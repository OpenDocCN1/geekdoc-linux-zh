    connect to the wireless network by pressing the WPS/QSS key.


    Chapter 38


    Wireless Network Monitoring


    ![](image_rsrc4A0.jpg)


    Because the data packets in the wireless network propagate in the way of wireless
    signals, users can monitor the data packets in the network to capture all the
    data. If you want to monitor the wireless network, you must set the wireless network
    card to monitor mode.This section will introduce how to set the wireless network
    monitoring mode with detailed instructions.Follow along!


    # Working mode of network card


    Wireless network cards can work in various modes to realise different functions.The
    main modes are Managed mode, Ad hoc mode, Master mode and Monitor mode.


    The concepts of these four working modes are described here with examples as follows:'
