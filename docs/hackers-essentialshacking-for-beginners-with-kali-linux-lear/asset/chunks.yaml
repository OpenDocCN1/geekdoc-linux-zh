    # Basic Domain Name Information


    When a domain name is registered, it contains basic information, such as whether
    the domain name has been registered or not, domain name registrar, domain name
    owner, etc. By checking the `WHOIS` information of the domain name, you can get
    the basic information of the domain name easily. The following section will introduce
    how to obtain the basic information of the domain name using `WHOIS` and other
    popular tools.


    It is always said that domain analysis is the first usual thing pentesters do
    before analysing the target.


    ## 1) Use WHOIS tools


    The `WHOIS` tool is used to find and display user-related information for a specified
    account (or domain name).


    The syntax format of using this tool to query domain name information is as follows:


    ```

    whois [domain name]

    ```


    Use-case scenario:


    Use the `WHOIS` tool to query the relevant information of the domain name `wikipedia.com`.


    The execution command is as follows:


    ```

    root@exampleserver:～# whois wikipedia.com

    ```


    After entering the above command on the terminal you can see the relevant `WHOIS`
    information for the domain name `wikipedia.com`.


    ## 2) Use DMitry tool


    `DMitry` is an integrated information gathering tool. Usually pentesters use this
    tool to collect `WHOIS` host IP and domain name information, subdomains, email
    addresses contained in domain names, etc.


    Among them, the syntax format used to obtain `WHOIS` information using this tool
    is as follows:


    ```

    dmitry -w [domain]

    ```


    Here `-w`: Implement `WHOIS` query on the specified domain name. Whereas, `domain`
    is the host we are trying to attack and find information about.


    Use-case scenario:


    Use the `DMitry` tool to query the `WHOIS` information of the domain name `wikipedia.com`.


    The execution command is as follows:


    ```

    root@exampleserver:～# dmitry -w wikipedia.com

    ```


    By using the above command in the linux terminal the `WHOIS` information related
    to the domain name `wikipedia.com` will be successfully obtained.


    # Find subdomains


    A subdomain is also treated as a domain by a penetration tester. In the domain
    name system hierarchy, it usually belongs to a higher domain. For example, `www.wikipedia.com`
    and `forum.wikipedia.com` are two subdomains of `wikipedia.com`, and it needs
    to be understood that `forum.wikipedia.com` is a subdomain of top-level domain
    `wikipedia.com`.


    Normally, a subdomain name will contain the host name. For example, in the `www.wikipedia.com`
    domain name, `.com` is the top-level domain name and `wikipedia.com` is the first-level
    domain name. `www` is the host name used to identify the server. Therefore, the
    WWW server established by `wikipedia.com` is `www.wikipedia.com`. It is a known
    fact that by looking up the subdomain name, the corresponding host can be found.
    The method to find subdomains will be described below with detailed examples.


    ## 1) Use Dmitry tool


    The `Dmitry` tool can be used to find subdomains. However, the tool uses the Google
    search engine to find subdomains. It may not be reliable some times if you are
    accessing websites that are backlisted by google. So, make sure your domain is
    compatible with Google search.


    The syntax format of using the `Dmitry` tool to find a subdomain name is as follows:


    ```

    dmitry -s -o

    ```


    The options and meanings in the above grammar are as follows:

    - `-S`: Implements subdomain query.

    - `-O`: Specifies the file to save the output result.


    Use-case scenario:


    Use the `Dmitry` tool to find the subdomain name of the domain name `wikipedia.com`.


    The execution command is as follows:


    ```

    root@exampleserver:～# dmitry -s -o wikipedia.com

    ```


    By using the above command in the linux terminal the information related to the
    domain name `wikipedia.com` will be successfully obtained.


    ## 2) Online query


    Users can also search for subdomains by online query. Among them, the domain name
    will be displayed. When using online tools, you can find the subdomains of a domain.
    It is important to understand the properties of the domain name.

