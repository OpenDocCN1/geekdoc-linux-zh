    ### Manually find the attack payload


    After users determine the vulnerabilities in the target system, they can search
    for penetration testing modules in Metasploit to select the penetration testing
    modules that can exploit their vulnerabilities, and then implement penetration
    testing. The following will introduce the method of manually searching the penetration
    test module using the `search` command.


    The syntax format for finding the penetration test module is as follows:


    ```

    search [options]

    ```


    In the `search` statement, `options` means available options; `keywords` means
    keywords. Next, we will manually find the vulnerability in `2020`.


    The execution command is as follows:


    ```

    msf5> search cve:2020

    ```


    From the output information, we can see that all penetration test modules are
    listed. The output includes several columns: `Name`, `Disclosure Date`, `Rank`,
    `Check`, and `Description`.


    In the `search` statement, we can search for the vulnerability `ms17-010` with
    `RCE`.


    The execution command is as follows:


    ```

    msf5> search name:ms17-010

    ```


    From the output information, we can see that the penetration testing modules for
    `eternalblue` are found. At this point, users can select `exploit/windows/smb/eternalblue`
    to implement penetration testing.


    ```

    msf5> use exploit/windows/smb/eternalblue

    ```


    ### Third-party modules


    If users cannot find the required module in Metasploit, they can also find them
    from third-party websites such as `exploitdb`. The following describes how to
