    ### 第三方模块


    如果用户在 Metasploit 中没有找到所需的模块，也可以从第三方网站（如 `exploitdb`）中查找。以下描述了如何手动将这些模块导入到 Metasploit
    中。


    1) 通过漏洞网站查找


    漏洞网站的地址为 `https://www.exploitdb.com/`。在浏览器中成功访问该网站后，将显示界面。用户可以通过 `CVE ID`、`name`
    或 `type` 搜索漏洞。


    从搜索结果中，可以看到攻击模块信息。输出包含几列：`Name`、`Disclosure Date`、`Platform`、`Check` 和 `Description`。


    2) 将模块文件 `webtest.rb` 拷贝到 Metasploit 的相应位置。Metasploit 模块的默认位置是 `/root/.msf4/modules`。为了方便组织模块，用户可以根据类型创建文件夹。


    ```bash

    root@exampleserver:～# mkdir /root/.msf4/modules/exploits

    ```


    执行上述命令后，没有输出。为了方便记忆位置，我们进入该目录并将攻击载荷文件拷贝进去。


    ```bash

    root@exampleserver:～# cd /root/.msf4/modules/exploits/

    root@exampleserver:exploits## cp webtest.rb .

    ```


    3) 重启 Metasploit 工具以查看加载的渗透测试攻击模块。


    ```bash

    root@exampleserver:～# msfconsole

    msf5>

    ```


    从上面显示的信息中，我们可以看到 exploit 类模块已从 `1873` 变为 `1874`。这说明模块已成功导入。

