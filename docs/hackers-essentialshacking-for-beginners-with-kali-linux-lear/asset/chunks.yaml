    当用户确定了要安装的软件包名称后，即可安装该软件。此外，如果系统中已经安装了某个软件，用户也可以进行更新。下面将介绍软件的安装和更新方法。


    ### 1) 安装软件


    在 Kali Linux 中，`apt-get install` 命令主要用于安装软件源中的软件。


    其中，该命令的语法格式如下：


    ```

    apt-get install [packet_name]

    ```


    下面将以 `StartDict` 软件包为例，介绍如何从软件源安装该软件。`StartDict` 是国外知名的字典框架，可以用它查询英语单词的含义。当然，用户也可以加入国内翻译工具的字典，例如《牛津词典》（Oxford
    dictionary）。Kali Linux 软件源中提供了该字典框架。


    执行命令如下：


    ```

    root@exampleserver:～# apt-get install qstardict stardict-*

    ```


    执行上述命令后，如果没有报告错误，则说明 `StarDict` 工具安装成功。此时，用户可以将其他翻译工具的词典文件（`.dict.dz`, `.dix`,
    `.ifo.syn`）复制到 `/usr/share/stardict/dic` 目录下，然后即可该工具。


    ### 2) 更新软件


    如果某个软件有了官方更新，但 Kali Linux 中仍在使用旧版本，此时用户可以通过重新安装软件来更新，以便尽快体验新功能。


    例如，要更新 `wpscan` 工具，执行命令如下：


    ```

    root@exampleserver:～# apt-get install wpscan

    ```


    从上述输出信息可以看出，有 3 个软件包已升级。从显示的结果中看到，`wpscan` 工具已从原始版本 `3.4.3` 升级到 `3.5.0` 版本。


    上述方法仅用于单独更新某个软件。


    如果用户想要更新所有软件，执行命令如下：


    ```

    root@exampleserver:～# apt-get upgrade

    ```


    执行上述命令后，当前系统中所有需要升级的软件包都将完成升级。


    ### 软件


    当用户不再需要某个软件时，可以将其删除。


    删除软件使用的语法格式如下：


    ```

    apt-get remove [package_name]

    ```


    # 卸载软件包


    或


    ```

    apt-get purge [package_name]

    ```


    # 卸载并清除软件包配置


    卸载 `apt-file` 软件。


    执行命令如下：


    ```

    root@exampleserver:～# apt-get remove apt-file

    ```


    看到上述输出信息，意味着 `apt-file` 软件已成功卸载。


    ### 安装虚拟机增强工具


    为了方便在物理机和虚拟机之间复制文件，需要安装虚拟机增强工具。`open-vm-tools` 是一个针对 VMware 虚拟机的增强工具。它提供了 VMware
    驱动，以增强虚拟显卡和硬盘的性能，并同步虚拟机与主机的时钟。只有在 VMware 虚拟机中安装了 `open-vm-tools` 工具，才能实现主机与虚拟机之间的文件共享，并支持自由的拖放放置功能。鼠标也可以在虚拟机和主机之间自由移动（无需再次按下
    `Ctrl+Alt` 快捷键）。


    下节将介绍如何安装虚拟机增强工具。


    在 Kali Linux 中安装 `open-vm-tools`。


    执行命令如下：


    ```

    root@exampleserver:～# apt-get install open-vm-tools-desktop fuse

    ```


    执行上述命令后，将安装 `open-vm-tools` 工具。安装完成后，重启电脑。电脑重启后，用户可以在物理机和虚拟机之间自由地移动、复制和粘贴文件。


    # 第 7 章：Kali 中的第三方软件安装


    ![](img/image_rsrc49V.jpg)


    Kali Linux 系统默认安装了大量的渗透测试软件。然而，某些渗透测试工具并未安装（例如 `Nessus`），需要从第三方下载并安装。通常，从第三方获取的软件包格式包括
    `.deb`, `.tar.gz`, `.tar.bz2`, `zip` 和 `rar`。为了满足用户需求，本节将介绍这些格式软件包的安装方法。


    # 安装二进制软件


    二进制包包含了已经编译并可以立即运行的程序。用户只需在使用前对其下载并解压（安装）即可。在 Linux 系统中，二进制软件包括两种格式：`RPM` 和 `DEB`。其中，`RPM`
    是基于 Red Hat Linux 发行版的包管理器，后缀为 `.rpm`；而 `DEB` 是基于 Debian 的包管理器，后缀为 `.deb`。Kali
    Linux 基于 Debian，因此其二进制包格式为 `.deb`。下节将介绍在 Kali Linux 中安装二进制包的方法。


    下节将以 `Nessus` 软件为例，介绍二进制包的安装方法。


    具体步骤如下：


    1) 在 `Nessus` 官网下载与你操作系统操作系统架构相同的二进制包。其中，`Nessus` 的下载地址为 `https://www.tenable.com/downloads/nessus`。在本例中，下载的包名为
    `Nessus-8.3.1-debian664.deb`。


    2) 安装 `Nessus` 工具。


    执行命令如下：


    ```

    root@exampleserver:～# dpkg -i Nessus-8.3.1-debian664.deb

    ```


    看到上述输出信息，意味着 `Nessus` 工具已安装成功。接下来用户可以使用该工具进行扫描。


    # 安装源码


    源码包包含了程序的源代码，需要用户进行编译以生成可运行的程序。通过源码安装软件耗时较长。在 Linux 中，常见的源码格式有 `.tar.gz` 和 `.tar.bz2`。下节将介绍这两种格式的安装方法。


    如果要安装 `.tar.gz` 和 `.tar.bz2` 源码包，需要使用 `tar` 命令进行解压，然后进行配置、编译和安装。


    解压 `.tar.gz` 源码包的语法格式如下：


    ```

    tar zxvf 文件 [-C 目录]

    ```


    解压 `.tar.bz2` 源码包的语法格式如下：


    ```

    tar jxvf 文件 [-C 目录]

    ```


    在上述语法中，`[-C 目录]` 用于指定源码包的解压位置。如果不指定，默认解压到当前目录。


    下节将以中间攻击工具为例，演示 `.tar.gz` 格式源码包的安装方法。


    具体步骤如下：


    1) 访问网站 `http://code.google.com/p/subterfuge/downloads/list` 下载 `subterfuge` 软件包。包名为
    `subterfuge_packages.tar.gz`。将下载的包拷贝到 Kali 系统。


    2) 解压下载的软件包。


    执行命令如下：


    ```

    root@exampleserver:～# tar zxvf subterfuge_packages.tar.gz

    ```


    成功解压 `subterfuge` 软件包后，所有文件将解压到 `subterfuge` 目录。


    3) 安装 `subterfuge` 工具：


    ```

    root@exampleserver:～# cd subterfuge/

    root@daxueba:～/subterfuge# python install.py

    ```


    执行上述命令后，将显示界面。


    4) 在界面中选择 `Full Install With Dependencies` 单选按钮，然后点击 `Install` 按钮进行安装。

