- fmt: '

    After the user has a clear understanding of the concept and format of the software
    source, the software source can be added. The following section will introduce
    the official software sources and commonly used third-party software sources in
    the Kali Linux system.


    ### 1) Official software source


    Kali Linux official sources and software sources redirected by the official are
    usually relatively stable. However, the speed is not said to be necessarily fast.


    Among them, the official source of Kali is as follows:


    `deb http://http.kali.org/kali kali-rolling main non-free contrib`


    ### 2) Commonly used third-party software sources


    Since the official source of Kali is a foreign website, domestic users may experience
    network instability when using it, which may result in a failure to install the
    package. Moreover, the download speed is still relatively slow. At this time,
    the user can try to add a third-party software source.


    A lot of mirrors are available for different countries and locations. You can
    find list of third-party sources available by doing a quick google search. Also,
    you can use torrent to distribute the Linux image file. It is not illegal in anyway
    and can help you download the softwares fastly.


    ### 3) Choice of HTTP and HTTPS


    For safety reasons, these software sources currently support the HTTPS protocol.
    To use the software source of the HTTPS protocol, you only need to change the
    `http` in the URL address to `https`.


    `deb https://http.kali.org/kali kali-rolling main non-free contrib`


    HTTPS is slow in downloading software due to encryption problems. However, the
    influence of the cache server can be avoided. Therefore, if the user fails to
    download the software due to the cache server when installing the software, the
    software can be reinstalled by modifying the software source to `HTTPS`.


    ### 4. deb-src software source


    Some software does not provide binary packages but only provides source code.
    For this kind of software, the software source of `deb-src` must be added. After
    downloading, it will automatically compile and generate executable files on the
    user''s computer.


    Among them, the `deb-src` software source format is as follows:


    `deb-src http://http.kali.org/kali kali-rolling main non-free contrib`


    ### Update software source/system


    After the user configures the software source, he needs to use the `apt-get update`
    command to update the software source to make the configuration effective. Users
    can also update the system quickly by updating the software source.


    The following section will introduce the method of updating the software source
    and updating the system.


    The execution command is as follows:


    ```

    root@exampleserver:～# apt-get update

    ```


    It can be seen from the above output that the software source has been successfully
    updated.


    The execution command is as follows:


    ```bash

    root@exampleserver:～# apt-get dist-upgrade R

    ```


    The updated package information is displayed in the above output information,
    including the package to be upgraded, the newly installed package, and the uninstalled
    package. At this point, enter `Y` to continue the operation. If there is no error
    message during the subsequent operation, the system update will be successful.
    After the update is completed, restart the system, that is, reload the new system.


    Users can also use the graphical interface to update the operating system.


    The specific steps are as follows:


    1) Click the `Show all programs` button in the favorites on the left to open the
    interface of all programs, and click the `Software` button to display the dialog
    box.

    2) From the `Update (U)` tab of the dialog box, you can see that there is an update
    prompt. At this point, click the `Operating System Update` option to see the software
    package that needs to be updated.

    3) The software package to be updated is displayed in this interface. At this
    time, click the `close` button in the upper right corner to return to the software
    update dialog box. Then, click the `Download (D)` button to start downloading
    the updated software package. After the download is completed, the dialog box
    will be displayed.

    4) Click the `Restart and Update` button in the upper right corner, so that the
    `Restart and Install Update` dialog box will pop up.

    5) Click the `Restart and Install` button to restart the system and update the
    software package.

    6) This interface shows the update package being installed. After the update is
    completed, the system will automatically restart.


    ### Install the software from the software source


    After the user configures the software source, all the software provided in the
    software source can be installed. This section will introduce the software in
    the installation software source.


    #### Confirm package name


    When users install software, they need to know the package name. If you are not
    sure of its name, you can use several commands in Kali Linux to search for the
    package name.


    The method of confirming the package name is described below.


    #### What is a software package?


    A software package refers to a program or a group of programs with specific functions
    to accomplish tasks. The software package consists of basic component and optional
    components, which can be in the form of source code or object code. In the Linux
    system, there are two main forms of software packages, namely binary packages
    and source packages. Among them, the most common binary package formats are `deb`
    and `rpm`.


    #### Search software packages on keywords


    In Kali Linux, users can use the `apt-cache` command to search for software packages
    based on keywords.


    Among them, the syntax format of the command is as follows:


    `apt-cache search package_name`


    Search the package name based on the keyword `pm-`.


    ```bash

    root@exampleserver:～# apt-cache search "pm-"

    ```


    From the output, you can see that all packages containing the `pm-` keyword have
    been searched. In the above information, the package name and the function of
    the package are shown respectively. By analyzing the package information, the
    name of the package can be determined.


    #### Search for packages according to the command


    Kali Linux provides a tool `apt-file` that can search for software packages based
    on commands. However, the tool is not installed by default. Therefore, you need
    to install it before using this tool.


    The execution command is as follows:


    ```bash

    root@exampleserver:～# apt-get install apt-file

    ```


    After executing the above command, if no error is reported, the installation is
    successful. Next, you can use the tool to search for packages based on commands.


    Among them, the syntax format for searching is as follows:


    `apt-file search [pattern]`


    Search for the software package where the `arpspoof` command is located.


    ```bash

    root@exampleserver:～# apt-file search arpspoof

    ```


    From the output information, you can see that the software package corresponding
    to the `arpspoof` tool is named `dsniff`.


    #### View the package structure


    After the user installs a certain software, if you are not sure where the software
    package is installed, you can use the `apt-file` command to view the package structure.
    In addition, users can also confirm whether they have the software they need based
    on the included files.


    The syntax format for viewing the package structure is:


    `apt-file list [pattern]`


    View the `dnsenum` software package structure:


    ```bash

    root@daxueba:～# apt-file list dnsenum

    ```


    From the output information, you can see the structure of the `dnsenum` package.
    From the displayed results, we can see that the startup file of the `dnsenum`
    tool is installed in the `/usr/bin` directory. We can also know that the help
    document is in the `/usr/share/doc/dnsenum` directory.

