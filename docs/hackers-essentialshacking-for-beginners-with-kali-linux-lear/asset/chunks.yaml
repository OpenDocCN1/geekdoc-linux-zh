    5) 从此界面，你可以看到弹出一个小型对话框，显示 Subterfuge 安装完成。此时，点击 `Finish` 按钮完成安装。


    接下来的部分将以 Firefox 浏览器为例，演示如何安装 `tar.bz2` 格式的软件包。


    具体步骤如下：


    1) 下载 Linux 版本的 Firefox 浏览器软件包包。


    在本例中，下载的包名为 `Firefox-latest-x86_64.tar.bz2`。


    提示：在下载 Firefox 浏览器软件包时，你必须根据用户的硬件架构进行选择。在本例中，下载的是 64 位架构的包。


    2) 解压软件包。


    执行的命令如下：


    ```

    root@exampleserver:～# tar jxvf Firefox-latest-x86_64.tar.bz2-C /usr

    ```


    执行上述命令后，Firefox 软件包中的所有文件都将解压到 `/usr` 目录。其中，解压后的文件名为 `firefox`。


    3) 切换到解压后的 `firefox` 目录，你会看到一个名为 `firefox` 的可执行文件。


    该可执行文件用于启动 Firefox 浏览器，如下所示：


    ```

    root@exampleserver:～# cd /usr/firefox/ root@exampleserver:/usr/firefox

    ```


    从上述显示的结果中，你可以看到可执行文件 `firefox` 用于启动浏览器。


    # 执行软件


    当用户成功将软件安装到系统后，就可以启动该软件对应的工具。其中，某些软件可以通过命令或图形界面启动，而某些软件则是使用可执行脚本启动。本节将分别介绍这两类软件的启动方法。


    ## 普通软件


    通常，启动常用软件的方法是使用命令行和图形界面。此外，Kali Linux 系统还提供了 `Alt+F2` 快捷键来打开命令提示对话框。用户可以在此对话框中输入任何要执行的命令。下面将介绍常用软件的几种启动方法。


    ### a) 图形界面模式


    图形界面方法是通过菜单命令启动。接下来的部分将以 Wireshark 软件为例介绍其启动方法。


    1) 在图形界面中，依次选择“Applications”|“sniffing/spoofing”|`Wireshark` 命令。


    2) 在此处选择 `Wireshark` 命令后，软件即可成功运行。


    看到此界面表示 Wireshark 已成功启动。接下来，用户选择网络接口，可以使用该软件捕捉数据包。


    ### b) 命令行模式


    命令行方法是通过终端执行的。接下来的部分将以 Metasploit 框架为例，介绍使用命令行启动软件的方法。


    启动 Metasploit 终端模式并执行命令如下：


    ```

    root@exampleserver:～# msfconsole

    ```


    从输出信息中，你可以看到命令行提示符显示为 `msf5 >`。这表明 Metasploit 工具已成功启动。


    ### c) 命令行提示符


    用户可以使用命令行提示符运行某些从终端运行的软件，且它们在界面模式下运行。这样一来，就不需要占用终端窗口。下面将以 DirBuster 软件为例介绍使用命令行提示符启动软件的方法。


    具体步骤如下：


    (1) 使用快捷键 `Alt+F2` 启动命令行提示符。


    (2) 在此界面中输入启动软件的命令。然后按 Enter 键启动工具。


    看到此界面意味着 DirBuster 软件已成功启动。


    # 执行脚本


    在 Kali Linux 系统中，某些软件在安装后需要通过脚本启动。其中最常见的可执行脚本有 Python、Ruby、Perl 和 Shell。对于某些脚本，可能还需要安装库或模块。本节将介绍几种常见的执行脚本启动方法。


    ### a) 执行 Ruby 脚本


    当用户执行 Ruby 脚本时，可能会缺少 Ruby 库文件。此时，用户需要使用 `gem install` 命令安装相应的库。


    其中安装 Ruby 库文件的语法格式如下：


    ```

    gem install [package]

    ```


    然后，使用 `ruby` 命令执行其 Ruby 脚本，如下：


    ```

    root@exampleserver:～# ruby hello.rb Hello World.

    ```


    ### b) 执行 Python 脚本


    当用户执行 Python 脚本时，可能会遇到缺少依赖包的问题。此时，用户可以使用 `pip install` 命令安装相应的依赖包。只有这样才能执行其 Python
    脚本。


    例如，`polenum` 是一个 Python 脚本，可以使用 Python 的 `impacket` 库从 Windows 内核安全机制获取密码策略。然而，该脚本依赖
    `impacket` `0.9.11` 版本库。因此，如果你想使用 `polenum` 工具，必须安装 `impacket` `0.9.11`。


    执行命令如下：


    ```

    root@exampleserver:～# pip install impacket==0.9.11

    ```


    从上述输出的最后一行，你可以看到 `impacket-0.9.11` 包已成功安装。接下来，用户可以使用 `polenum` 工具。


    Kali Linux 默认提供两个版本的 Python，即 Python 2 和 Python 3。`pip` 可以安装 Python 2 的依赖包。如果需要安装
    Python 3 的依赖包，则需要安装 `pip3`。


    首先，执行以下命令安装：


    ```

    root@exampleserver:～# apt-get install python3-pip

    ```


    执行上述命令后，如果没有报错，说明 `pip3` 命令安装成功。接下来，可以使用 `pip3` 安装依赖包。例如：


    ```

    root@exampleserver:～/kickout# pip3 install scapy-python3 python-nmap netifaces

    ```上述过程下载并安装了 `KickTheOut` 工具依赖的包。从输出的最后一行，可以看到上述依赖包已成功安装。


    ### c) 执行 Perl 脚本


    当用户执行 Perl 脚本时，可能会遇到缺少 Perl 模块的问题。此时，用户需要使用 `cpan` 命令安装，然后执行相应的脚本。例如，使用第三方工具 `7z2hashcat`
    需要 `Compress::Raw::Lzma` 组件。在这种情况下，你需要使用 `cpan` 命令安装该组件。`cpan` 工具包含在 `perl-doc`
    包中，因此你先需要安装 `perl-doc` 包。执行命令如下：


    ```

    root@exampleserver:～# apt-get install perl-doc

    ```


    ### d) 执行 Shell 脚本


    Shell 脚本执行相对简单，用户只需要添加执行权限。例如，有一个名为 `test.sh` 的 Shell 脚本，下面将在添加执行权限后执行：


    (1) 添加执行权限。执行命令如下：


    ```

    root@exampleserver:～# chmod +x test.sh

    ```


    执行上述命令后，没有信息输出。


    (2) 执行 `test.sh` 脚本，如下：


    ```

    root@exampleserver:～# ./test.sh

    ```


    或者


    ```

    root@exampleserver:～# sh test.sh Hello World!

    ```


    你可以看到输出了一行信息，这表明 `test.sh` 脚本已成功执行。


