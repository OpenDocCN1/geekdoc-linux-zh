    Configuring OpenVAS


    ![](image_rsrc49Y.jpg)


    After passing the previous series of configurations, the user can log in to the
    OpenVAS service. After the user successfully logs in to the OpenVAS service, some
    simple configurations are required to perform vulnerability scanning, such as
    creating a new scanning configuration, scanning target, and scanning task. The
    following section will introduce how to log in and configure the OpenVAS service.


    # Log in to OpenVAS service


    To login into the OpenVAS service follow the below steps carefully. Always remember
    to follow the troubleshooting guide in the official website if you face any errors.


    The specific steps are as follows:


    1) Enter the address in the browser, https://exampleserver:9392/ (IP address is
    the address of the OpenVAS service), so that you can access the OpenVAS service.
    ￼'
