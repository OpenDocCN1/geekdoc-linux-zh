    transmit data in a specified frequency range.The frequency range of 2.4GHz band
    is 2.4～2.4835GHz.In order to make full use of this frequency band, the range is
    divided into several parts, and each part is called a channel.


    At present, mainstream WiFi networks generally support 13 channels.Although their
    centre frequencies are different, they all occupy a certain frequency range, so
    there will be some overlapping cases.


    By knowing the frequency bands of these 13 channels, it is helpful to understand
    the meaning of the three non-overlapping channels. Wireless networks can operate
    on multiple channels. Various wireless network devices within the coverage area
    of wireless signals should use different channels as much as possible to avoid
    interference between signals.


    There are actually 14 channels, but the 14th channel is generally not used.The
    effective width of each channel is 20MHz, and there is also 2MHz forced isolation
    band.That is to say, the frequency range of channel 1 with centre frequency of
    2412MHz is 2401 ~ 2432 MHz.


    It can be seen from the figure that there is no overlap among the three channels
    1, 6 and 11 (marked by solid lines). That is, it is often said that there are
    three channels that do not overlap with each other.It is also easy to see the
    overlapping of frequency bands among other channels. In addition, if the equipment
    supports it, there are three groups of non-interfering channels (2, 7, 12), (3,
    8, 13) and (4, 9, 14) in addition to the three groups of non-interfering channels.


    5GHz frequency band


    With the development of the times, 5GHz band has gradually entered people''s lives.
    5GHz is the new wireless fidelity.The 5GHz band has higher frequency and shorter
    wavelength than 2.4GHz, so its penetrability and distance are weak, but the data
    transmission is faster.


    There are five channels supported at 5GHz, which are 149, 153, 157, 161 and 165.When
    there are few surrounding 5GHz signal sources, the channel can be selected arbitrarily.


    Bandwidth


    The bandwidth here refers to the channel bandwidth. Channel bandwidth is also
    often called "band bandwidth", which is the frequency range occupied by modulation
    carrier and also the standard of transmitting wireless signal frequency.In the
    commonly used 2.4～2.4835GHz band, the bandwidth of each channel is 20MHz.It can
    be found that the 802.11 n protocol includes two bandwidths, namely 20MHz and
    40MHz.


    Among them, 20MHz can reach 144Mbps bandwidth in 802.11 n mode, which has good
    penetrability and long transmission distance (about 100 meters). 40MHz can reach
    300Mbps bandwidth in 802.11 mode, but its penetration is slightly poor and its
    transmission distance is short (about 50 meters).


    If the reader is not clear about the above explanation, you can think of these
    two bandwidths as the width of the road.The wider the width, the more data that
    can be run at the same time, which improves the speed.However, the "road" of wireless
    network is shared by all.When a user occupies a wide road and runs a lot of data,
    it is easy to collide with other people.Once a car crashes, everyone will slow
    down, perhaps even slower than walking on a narrow road.


    It can be seen that the 802.11b/g protocol allows four APS to use at the same
    time.If one AP uses 40MHz, only two APS can use it at the same time.Therefore,
    the choice of bandwidth mainly depends on how many APS are working at the same
    time nearby.If there is not much interference nearby, it is recommended to use
    40MHz bandwidth, which can achieve higher transmission speed.20MHz bandwidth is
    recommended if there are more APS.


    What Next?


    Hope this chapter gave a clear cut explanation about the working of wireless networks.
    World is rapidly changing and tens of wireless modes are available now for users.
    As a hacker it is important for you to be aware of the new wireless devices and
    modes that are coming into the market. Constantly check for vulnerabilities in
    the wireless devices. In the next chapter, we will talk about wireless security
    in detail. Follow along!


    Chapter 37


    Wireless Network Security'
