    ## Modes


    - **Managed mode**: This mode is used when the user''s wireless client is directly
    connected to a Wireless Access Point (`WAP`). In this mode, the driver of wireless
    network card relies on `WAP` to manage the whole communication process.

    - **Ad hoc mode**: This is called as point-to-point mode. This mode is used when
    the user''s network consists of devices directly connected to each other. In this
    mode, both wireless communication parties share the responsibility of `WAP`.

    - **Master mode**: some high-end wireless network cards support master mode. This
    mode allows the wireless network cards to work with special drivers and software
    as `AP`(Access point) of other devices.

    - **Monitor mode**: This is the most important mode in terms of usage. If the
    network cable client is different from sending and receiving data and is only
    used to monitor all data packets in the network then you can use the monitoring
    mode.


    ## Wireless network card supporting monitoring


    If you want to monitor the wireless network, the wireless network card used must
    support the monitoring mode.


    Many wireless network cards are listed above. For 2.4GHz WiFi networks, it is
    recommended that users choose wireless network cards with chips of `3070` or `8187`.
    For 5GHz WiFi network, only wireless network cards with `RT3572` and `RTL8812AU`
    chips are supported.


    ### Set the monitoring mode


    When the user selects the appropriate wireless network card, the wireless network
    card can be set to monitor mode. Generally, the user sets the wireless network
    card to the listening mode by using the `airmon-ng` command.


    Syntax format is as follows:


    ```

    root@exampleserver : airmon-ng start set

    ```


    In the above syntax, the parameter `start` indicates that the listening mode is
    started. `Interface` refers to the wireless network interface.


    Set the wireless network card to monitor mode.


    Execute the command as follows:


    ```

    root@exampleserver : set=network

    ```


    It can be seen from the output information that the monitoring mode is successfully
    started, and its monitoring interface is `wlan0mon`.


    ### Set the monitoring mode of 5G WiFi network card


    At present, there are two common network card chips supporting 5G WiFi, namely
    `RT3572` and `RTL8812AU`. The wireless network card of `RT3572` chip has the same
    settings as the common wireless network card, and the monitoring mode can be started
    directly by using `airmon-ng` command.


    However, the wireless network card of `RTL8812AU` chip needs to be installed with
    drivers, and the monitoring mode needs to be set manually. The following describes
    the method of setting the wireless network card of `RTL8812AU` chip to monitor
    mode.


    Set the wireless network card of `RTL8812AU` chip to monitor mode.


    The specific operation steps are as follows:


    1) **Install the driver**.


    Execute the command as follows:


    ```

    root@exampleserver : install driver

    ```


    After executing the above command, if no error is reported, the driver installation
    will be successful.


    2) **Check the mode of the wireless network card**.

    Execute the command as follows:


    ```

    root@exampleserver : check mode

    ```


    It can be seen from the output information that the current working mode of the
    wireless network card is `Managed`.


    3) **Stop the wireless network card interface**.


    Execute the command as follows:


    ```

    root@exampleserver: air-mag stop

    ```


    4) **Set the wireless network card to monitor mode**.


    Execute the command as follows:


    ```

    root@exampleserver: air-mag mode = network

    ```


    5) **Start the wireless network card**.


    Execute the command as follows:


    ```

    root@exampleserver: air-mag wireless

    ```


    6) **Check the mode of the wireless network card again**.


    Execute the command as follows:


    ```

    root@exampleserver: air-mag check start

    ```


    It can be seen from the output information that the chip has been successfully
    set to `Monitor` mode. In which the interface in listening mode is named `wlan0`.


    ## Scanning the wireless network


    Scanning the wireless network means scanning the surrounding wireless network
    signals to find out the target of penetration test. If users want to implement
    penetration test, then they need to know some basic information of the target
    wireless network, such as `AP` name, MAC address and working channel. By scanning
    the wireless network and analysing the scanning results, the corresponding tools
    are selected to implement penetration test. This section describes the methods
    of scanning wireless networks with detailed instructions.


    ## Chapter 39: Usage of Airodump-ng Tool


    ![](image_rsrc4A0.jpg)


    ### Using Airodump-ng tool


    `airodump-ng` is a tool in `Aircrack-ng` toolset, which can be used to scan the
    surrounding wireless network signals. The name, MAC address, channel and encryption
    method of the surrounding open `AP` can be known by analysing the captured wireless
    signal packets. The following section describes the method of scanning wireless
    network using `airodump-ng` tool.


    The syntax for scanning wireless networks using `airodump-ng` tool is as follows:


    ```

    root@exampleserver: airodump scan

    ```


    In the above syntax, the parameter `interface` indicates the wireless network
    card listening interface.


    Scan wireless network with `airodump-ng` tool.


    Execute the command as follows:


    ```

    root@exampleserver: airodump wireless

    ```


    The scanned wireless network information can be seen from the output information.
    There are many columns in the above output information, and the meaning of each
    column parameter is as follows:


    1. **BSSID**: Indicates the MAC address of the wireless `AP`.

    2. **PWR**: The signal level reported by the network card, which mainly depends
    on the driver. The higher the signal value, the closer it is to `AP` or computer.
    If the values of `BSSID` and `PWR` are both `-1`, it means that the driver of
    network card does not support reporting signal level. If the `PWR` value is `-1`,
    it means that the client is not in the range that the current network card can
    listen to, but can capture the data sent by `AP` to the client. If all client
    `PWR` values are `-1`, then the network card driver does not support signal level
    reporting.

    3. **Beacons**: The announcement number sent by the wireless `AP`. Each access
    point (`AP`) transmits about 10 beacon per second at the lowest rate (`1M`).

    4. **Data**: The number of captured data packets (if it is `WEP`, it represents
    the number of unique `IVS`), including broadcast packets.

    5. **s**: the number of data packets captured per second in the past 10 seconds.

    6. **Ch**: channel number (obtained from `Beacons`).

    7. **Mb**: the maximum rate supported by wireless `AP`. If the value is `11`,
    it means that the `802.11b` protocol is used. If the value is `22`, it means that
    the `802.11b+` protocol is used. If it is higher, it means that `802.11g` protocol
    is used. If the value contains a dot (after `54`), it indicates that short preamble
    is supported. If the value contains `'' e''`, it means that `QoS(802.11 e)` is
    enabled in the network.

    8. **Cipher**: the detected encryption algorithm is one of `CCMP`, `WRAAP`, `TKIP`,
    `WEP` and `WEP104`. Typically (but not necessarily), `TKIP` is used in combination
    with `WPA`, and `CCMP` is used in combination with `WPA2`. If the key index value
    is greater than `0`, it is displayed as `WEP40`. Under standard conditions, indexes
    `0 ~ 3` are 40bit, and 104bit should be `0`.

    9. **Auth**: The authentication protocol is used. Commonly used are `MGT`(WPA/WPA2
    uses independent authentication server, such as `802.1x`, `radius` and `eap`,
    etc.), `ska`(shared key of `WEP`), `PSK`(pre-shared key of `wpa/wpa2`) or `OPN`(OPN(WEP)).

    10. **ESSID**: The so-called ssid number. If hidden SSID is enabled, it can be
    blank or displayed as `< length: 0 >`. In this case, `airodump-ng` tries to obtain
    SSID from `proberesponses` and `associationrequests`.

    11. **Station**: MAC address of clients, including connected clients and clients
    who want to search for wireless networks to connect. If the client is not connected,
    it displays not associated under `BSSID`.

    12. **Rate**: Indicates the transmission rate.

    '
