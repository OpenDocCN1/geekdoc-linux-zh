    and forum.wikipedia.com are two subdomains of wikipedia.com, and it needs to be
    understood that forum.wikipedia.com is a subdomain of top-level domain wikipedia.com.


    Normally, a subdomain name will contain the host name. For example, in the www.wikipedia.com
