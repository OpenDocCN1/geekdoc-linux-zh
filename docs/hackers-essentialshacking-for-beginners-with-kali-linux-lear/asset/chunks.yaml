    Bypass Windows login with Utilman


    Utilman is a Windows auxiliary tool manager. Under Windows, even if there is no
    user login, you can use the Windows+U key combination to call the Utilman process.
    With this mechanism, the Windows login authentication mechanism can be bypassed
    to operate the system. This section will introduce how to use this method.


    By replacing the Utilman.exe file with cmd.exe, bypassing the login operation.


    The specific steps are as follows:


    1) On a Windows computer, use the U disk installation medium to enter the Kali
    Linux Live mode. First start the U disk installation medium, the system installation
