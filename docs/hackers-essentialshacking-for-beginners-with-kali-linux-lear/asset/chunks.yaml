  trans: '

    Metasploit 框架的威力在于它提供了大量的渗透测试模块和插件。这些模块根据不同的用途分为 7 类，即 `Exploits`（渗透攻击模块）、`Auxiliary`（辅助模块）、`Post`（渗透后攻击模块）、`Payloads`（攻击载荷模块）、`Encoders`（编码模块）、`Nops`（空指令模块）和
    `Evasion`（规避模块）。下面将介绍这 7 类模块和插件的功能。


    ### 1) 渗透攻击模块


    渗透攻击模块主要利用发现的安全漏洞或配置弱点对目标系统进行攻击，植入并运行攻击载荷，从而获取目标系统的控制权限。Metasploit 框架中的渗透攻击模块可以根据安全漏洞的位置分为主动渗透攻击和被动渗透攻击。


    其中，这两种攻击的区别如下：


    **主动渗透攻击：**

    被利用的安全漏洞位于网络服务器软件以及由该服务器软件承载的上层应用中。因为这些服务通常会在主机上开启一些监听端口并等待客户端连接。通过连接到目标系统的网络服务，注入某些特殊构造的、包含“恶意”攻击数据的网络请求内容，触发安全漏洞，并导致远程服务器执行“恶意”数据中包含的攻击载荷，从而获取目标系统的权限。


    **被动渗透攻击：**

    被利用的漏洞位于客户端软件（如浏览器、浏览器插件、邮件客户端、Office 和 Adobe 等文档编辑软件）。对于此类安全漏洞，渗透测试人员无法从远程向客户端软件输入数据，因此只能使用被动渗透攻击。


    常用的被动渗透攻击包括构造“恶意”网页、电子邮件或文档文件，通过建立包含此类恶意内容的服务器、发送邮件附件、结合社会工程攻击分发、结合网络欺骗和劫持技术等手段，诱导目标用户在目标系统上打开或访问这些恶意内容，从而触发客户端软件的安全漏洞，获取控制目标系统的
    `Shell` 会话。


    ### 2) 辅助模块


    辅助模块包括各种网络服务的扫描和检测、构建伪服务以收集登录密码、密码破解等模块。此外，辅助模块还包括某些不需要加载的攻击载荷。这些模块用于获取目标系统的远程控制，例如拒绝服务攻击。


    ### 3) 渗透后攻击模块


    渗透后攻击模块主要用于获取目标系统的远程控制。在控制系统中执行各种渗透后攻击，如获取敏感信息、进一步扩展以及实现跳板攻击。


    ### 4) 攻击载荷模块


    攻击载荷是一段在成功渗透攻击后提示目标系统运行的嵌入代码。其通常功能是在目标系统上为渗透攻击者开启控制会话连接。在传统的渗透代码开发中，攻击载荷只是一个简单的
    `ShellCode` 代码，用汇编语言编译并转换为目标系统 CPU 架构支持的机器码。


    在渗透攻击触发漏洞后，程序执行流被劫持并跳转到这段代码执行，从而完成 `ShellCode` 中的单项功能。Metasploit 攻击载荷分为三种类型：Single（独立型）、Stager（传输器）和
    Stage（传输体）。


    这三种攻击载荷类型的区别如下：


    *   **Single**：它是完全独立的载荷，使用起来就像运行 `calc.exe` 一样简单，例如添加系统用户或删除文件。由于 Single Payloads
    是完全独立的，它们可能会被 `netcat` 等非 Metasploit 处理工具捕获。

    *   **Stager**：该载荷负责在目标用户和攻击者之间建立网络连接，并下载额外的组件或应用程序。常见的 Stager Payload 是 `reverse_tcp`，它允许目标系统与攻击者建立
    TCP 连接，允许目标系统主动连接到渗透测试人员的端口（反向连接）。另一个常用的是 `bind_tcp`，它允许目标系统开启 TCP 监听器，攻击者可以随时与目标系统通信（正向连接）。

    *   **Stage**：它是 Stager Payload 下的一种 Payload 组件，这种 Payload 可以提供更高级的功能，且没有大小大小限制。


    ### 5) 空指令模块


    空指令（`NOP`）是一些无操作或与操作无关的指令，它们不会对程序的运行状态产生任何实质性影响。最典型的无指令是无操作。在 X86 架构平台上的操作码为 `0x90`。


    当渗透攻击构造恶意数据缓冲区时，通常需要在要执行的 shell code 之前添加一个空指令区域。这样，当渗透攻击触发并执行 `ShellCode` 时，就会有一个更大的安全落地区域，从而避免因内存地址随机化和返回地址计算偏差导致的
    `ShellCode` 执行失败，提高渗透攻击的可靠性。


    ### 6) 编码模块


    在攻击载荷和空指令模块组装完成指令序列后，Metasploit 框架在渗透攻击模块将指令添加到恶意数据缓冲区并发送到目标系统运行之前需要进行编码。编码模块有两个主要功能：第一，确保攻击载荷中不会出现“坏字符”；第二是“释放”攻击载荷，即规避杀毒软件、IDS
    入侵检测系统和 IPS 入侵预防系统的检测与阻断。


    ### 7) 规避模块


    规避模块是 Metasploit 5 新增的。用户可以使用规避模块规避 Windows 防火墙。Windows Defender 是现在随 Windows
    系统的防火墙工具，它不仅可以扫描系统，还能监控系统。8. 插件可以扩展框架的功能，也可以将现有功能封装成高级功能组件。插件可以用于集成一些外部安全工具，如
    Nessus、OpenVAS 漏洞扫描器等。


    # 第 27 章：理解 Metasploit 接口


    ![](img/image_rsrc49Z.jpg)


    Metasploit 框架提供了两种接口：图形界面和终端模式。以前还提供命令行模式接口，但已废弃。下面将介绍 Metasploit 图形界面和终端模式启动方法。


    ### 1) Metasploit 的图形界面（Armitage）


    Armitage 是一个用 Java 编写的 Metasploit 图形界面攻击软件。它可以结合 Metasploit 中知的漏洞对主机漏洞进行自动化攻击。下面将介绍如何使用
    Armitage。


    具体步骤如下：


    1.  在图形界面中，依次选择“Applications”|“Vulnerability Exploitation Tool Set”|`armitage`
    命令启动 Armitage 工具。

