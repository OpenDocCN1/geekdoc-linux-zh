    用户可以通过主动扫描来确定目标主机是否活跃。主动扫描是通过发送探测请求数据包并等待目标主机的响应完成的。如果目标主机对请求做了响应，则意味着该主机是活跃的。否则，我们可以得出目标主机未在线的结论。


    本节将介绍几种主动扫描主机的方法。


    ### 1) 使用 Nmap 工具


    `Nmap` 是一个非常强大的网络扫描和嗅探工具包。该工具有三个基本功能。三个功能中的第一个是检测一组主机是否在线。第二个是扫描主机端口并嗅探所提供的网络服务，而第三个是推断主机正在使用的操作系统。


    以下示例将介绍如何使用 `Nmap` 工具检测目标主机是否在线。


    `Nmap` 的语法格式如下：


    ```

    nmap -sP [target]

    ```


    上述语法中的选项 `-sP` 意味着对目标主机执行 Ping 扫描。参数 `[target]` 用于指定扫描的目标地址。这里的目标可以是主机名、IP 地址（包括单个地址、多个地址或地址范围），有时甚至是网络网段。


    **使用场景：**


    检测目标主机 `72.132.234.64` 是否在线。


    执行命令如下：


    ```

    root@exampleserver:～# nmap -sP 72.132.234.64

    ```


    你也可以同时检查多个主机。下面我们为该场景提供了一个示例供你参考。


    **使用场景**


    使用 `Nmap` 检测主机 `72.132.234.64`、`72.132.234.65` 和 `72.132.234.66` 是否在线。


    执行命令如下：


    ```

    root@exampleserver:～# nmap -sP 72.132.234.64-66

    ```


    这显示了关于这 3 台服务器可用可用的输出。


    ### 2) 使用 Netdiscover 工具


    `Netdiscover` 是一个 ARP 探测工具，支持主动模式和被动模式。你可以使用此工具扫描网络上的 IP 地址，并检查在线的主机。


    本节将介绍如何使用 `Netdiscover` 工具实现 ARP 主动扫描。


    语法格式如下：


    ```

    netdiscover -r [range]

    ```


    上述语法中的选项 `-r [range]` 用于指定需要扫描的网络范围。如果用户未指定目标，则会自动选择目标网络进行扫描。


    **使用场景：**


    使用 `Netdiscover` 工具扫描 `72.132.234.64/94` 网段中的在线主机。


    执行命令如下：


    ```

    root@exampleserver:netdiscover -r 72.132.234.64/94

    ```


    通过分析捕获的数据包，你可以了解当前局域网中当前活跃主机的 IP 地址、MAC 地址和 MAC 地址厂商。你可以从 IP 列查看在线主机的地址。当扫描完成后，获得的所有信息都将显示出来。如果你敏锐观察，可以获得关于你试图攻击的主机的价值信息。在仔细研究输出后，按下
    `Ctrl+C` 键组合退出 `Netdiscover` 工具的扫描界面。


    用户有时也可以不指定扫描范围，寻找尽可能多的在线主机。


    执行命令如下：


    ```

    root@exampleserver:～# netdiscover

    ```


    然而，我们建议你不要尝试这样做，因为这可能会导致大量不值得你花费时间去攻击的主机。在攻击主机网络之前，始终要做彻底的研究。否则，入侵检测系统将捕获你的响应并封禁你长时间。


    # 监控发现主机


    嗅探（Snooping）意味着不主动向目标发送数据包，而只监控网络中的数据包。在局域网中，某些协议会自动广播数据包，例如 ARP 广播和 DHCP 广播。广播包是局域网内所有用户都可以接收的数据包。因此，用户可以通过监控这些包来检测网络上的活跃主机。本节将介绍通过监控发现主机。


    ### 1) ARP 监控


    `ARP`（地址解析协议）是一种根据 IP 地址获取物理地址的 TCP/IP 协议。当主机发送信息时，它向网络上的所有主机广播包含目标 IP 地址的 `ARP`
    请求，并接收响应以确定目标的物理地址。因此，通过实现 `ARP` 监控，可以发现局域网内的活跃主机。


    本节将介绍使用 `Netdiscover` 工具实现 `ARP` 监控的被动模式以发现在线主机。


    `Netdiscover` 工具被动扫描的语法格式如下：


    ```

    netdiscover -p

    ```


    上述语法中的选项 `-p` 意味着使用被动模式，也就是说不需要发送数据包，只允许嗅探。


    从第一行信息的输出中，你可以理解扫描正在被动模式下进行。从第二行信息中，你可以看到嗅探的数据包数量、主机数量和包大小。第 3 行以下的信息将关于嗅探包的信息。你可以从
    IP 列查看检测到的在线主机。许多其他任务可以使用此命令完成。我们建议你尝试这些命令以更好地理解该主题。


    ### 2) DHCP 嗅探


    `DHCP`（动态主机配置协议）是一种局域网协议，其主要功能是让内部网络服务商能够自动分配 IP 地址。当客户端需要获取 IP 地址时，它会发送广播包。然后，接收到请求的
    DHCP 服务器将为其提供可用的 IP 地址。因此，用户可以通过 DHCP 嗅探来发现网络上的活跃主机。本节将介绍通过 `Nmap` 的 `broadcast-dhcp-discover`
    脚本实现 DHCP 嗅探以发现在线主机。


    `Nmap` 的 `broadcast-dhcp-discover` 脚本可以发送 DHCP Discovery 广播包，并有效显示响应包的特定信息。通过分析响应包中的信息，可以找到分配的
    IP 地址。

    '
