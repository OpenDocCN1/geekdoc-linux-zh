    b) View PCI devices


    PCI (Peripheral Component Interconnect, Peripheral Component Interconnect Standard)
    is currently the most widely used interface specification in personal computers,
    and almost all motherboard products have slots of this specification. PCI devices
    refer to devices connected to these PCI slots, such as sound cards, network cards,
    and graphics cards. Kali Linux provides a command called lspci to view the list
    of PCI devices in the system.


    The execution command is as follows:


    root@exampleserver:～# lspci


    The above output information shows all PCI device information in the current system.
    From the output information, we can see that there are PCI devices such as motherboard
    chips, interface slots, graphics cards, and network cards.


    The user can see the driver module of the PCI device by using the -v option of
    the lspci command, and then confirm whether the device is correctly driven.


    The execution command is as follows:


    root@exampleserver:～# lspci -v


    From this interface, you can see the detailed information of the acquired PCI
    device. From the displayed information, you can see the driver information of
    each PCI device. For example, the graphics card driver used in the current system
    is vmwgfx.


    c) The virtual machine uses a USB device


    When users implement wireless penetration testing, they must use a wireless network
    card. However, in general, the built-in wireless network card chip in the system
    does not support wireless monitoring. Therefore, users must use a wireless network
    card with a USB interface to achieve this.


    If it is a physical machine, the user can directly insert the USB device into
    the host. If it is a virtual machine, the user needs to connect manually. In addition,
    you must start the virtual machine''s USB service (VMware USB Arbitration Service).
    Otherwise, the connected USB device cannot be recognized.


    The following section will take a USB wireless network card as an example to introduce
    the method of using USB devices in a virtual machine.


    The specific steps are as follows:


    1) USB service of virtual machine.


    Right-click the "Computer" icon on the desktop, and select the "Manage" | "Services
    and Applications" | "Services" command in the pop-up menu to open the service
    interface.


    2) Find the VMware USB Arbitration Service service from the service, and confirm
    that the service has been started. Next, insert the USB wireless network card
    into the physical machine, and a dialog box will pop up.


    3) From the dialog box, you can see that a new USB device is detected, its name
    is Ralink 802.11n NIC. At this point, the user can choose to connect to the host
    or connect to the virtual machine. After selecting the connection method, click
    the "OK" button to connect successfully.


    If the user selects the "Connect to a virtual machine" radio button, you can choose
    to connect to the virtual machine using the USB device. If the user selects the
    "Connect to Host" radio button, and then selects the "Virtual Machine" | "Removable
    Device" command in the virtual machine''s menu bar, the device can also be connected
    to the virtual machine.


    4) After selecting the "Realtek 802.11n NIC" | "Connect (disconnect from the host)
    (C)" command in the menu bar, the dialog box will pop up.


    5) From the dialog box, you can see that a USB device will be unplugged from the
    host and connected to the virtual machine. At this point, click the "OK" button
    to successfully connect the USB wireless network card to the virtual machine.
    Next, users can use the USB wireless network card to connect to a wireless network
    or perform wireless penetration testing.


    # Install prerequisite software packages


    For the Linux operating system, the driver is mainly directly contained by the
    kernel, and in fact, quite a large code is the driver of various devices. Except
    for individual graphics and network card drivers, most devices use open source
    drivers. And for general equipment, as long as the kernel version used is new
    enough, there is basically no need to install additional drivers. Therefore, the
    kernel header file is a necessary software package for installing the driver.
    The following sectionwill introduce the installation of kernel header files.


    The execution command is as follows:


    root@exampleserver:～# apt-get install linux-headers-$(uname -r)


    Install open source graphics driver


    Kali Linux uses the open source driver Nouvea by default to drive Nvidia graphics
    cards. This driver only supports 2D acceleration, not 3D acceleration. If you
    need 3D acceleration, you need to install Nvidia''s official driver.


    Install the open source graphics driver.


    The specific steps are as follows:


    1) Update the system to obtain the latest system kernel.


    Otherwise, it will cause the graphics card to fail to start.


    The execution command is as follows:


    root@exampleserver:～#apt-get update && apt-get dist-upgrade && reboot


    2) Check the bus number of the graphics card and execute the command as follows:


    root@exampleserver:～#lspci | grep -E "VGA|3D" 01:00.0 VGA compatible controller:
    NVIDIA Corporation GF108 [GeForce GT 440] (rev a1)


    Among them, 01:00:0 is the bus number of the Nvidia graphics card. When used later,
    it is simplified to 1:0:0.


    3) Use the VI editor to create a configuration file that disables the Nouveau
    driver, and execute the command as follows:


    root@exampleserver:～#vi /etc/modprobe.d/nvidia-blacklists-nouveau.conf'
