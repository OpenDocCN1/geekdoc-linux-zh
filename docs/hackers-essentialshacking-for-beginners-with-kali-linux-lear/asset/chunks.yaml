    msf5 auxiliary(scanner/mysql/mysql_login) exploit

    [＊ ] Auxiliary module execution completed

    ```


    从输出信息中可以看出，系统尝试使用指定用户名/密码文件中的用户名和密码连接连接 MySQL 服务器。在尝试了所有用户名和密码后，发现了一个有效的 MySQL
    数据库用户和密码。用户名为 `root`，密码为 `123456`。


