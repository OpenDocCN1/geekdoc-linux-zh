    Chapter 13


    Scanning ports


    ![](image_rsrc49X.jpg)


    By scanning the port, you can discover the programs running in the target host.
    After that we can collect information on these programs to obtain vulnerability
    information and can successfully implement penetration testing. This section will
    introduce the concept of ports and methods of implementing port scanning.


    # Introduction to Ports


    In computers, the port is considered as an essential concept. In network technology,
    ports have several meanings. The port referred to here is not a physical port,
    but a port in the TCP/IP protocol. It is a port in a logical sense. Among the
    TCP/IP protocols, the most commonly used protocols are TCP and UDP. Since the
    two protocols of TCP and UDP are independent, their respective port numbers are
    also independent of each other. For example, TCP has port 235, UDP can also have
    port 235, the two usually do not conflict.


    The functions of ports and commonly used ports are described below:


    1) The role of the port


    Users know that a host corresponds to an IP address and can provide multiple services,
    such as Web services and FTP services. If there is only one IP, different network
    services cannot be distinguished, so use "IP+port number" to distinguish different
    services.


    2) Definition of port


    The port number is used to identify the only process in the host, whereas "IP+port
    number" can identify the only process in the network. In Socket programming during
    network development, IP + port number is the socket. The port number is numbered
    by 16-bit binary numbers, and the range is between 0～65535.


    However, these ports cannot be used casually, and some ports can be already occupied.
    For example, the port of the Web server is 80, the port of the FTP service is
    21, etc. Therefore, ports are classified and the range of ports that users can
    use is specified rigorously for pen-testers. Always have a good knowledge about
    the ports that your target has.


    3) Port classification


    There are many ways to classify ports. Usually they will be classified according
    to the fact whether they are used by the server or by the client.


    The port number used by the server can be divided into a reserved port number
    and a registered port number as follows:


    *   Reserved port number:


    The value range of this type of port is 0～1023\. These ports cannot be used during
    user programming, and are used by some programs. Only applications with super
    user permissions are allowed to be assigned a reserved port number. For example,
    the default port of the WWW service is 80, and the default port of the FTP service
    is 21\. However, users can also specify other port numbers for these network services.
    Some system protocols use a fixed port number and cannot be changed. For example,
    port 139 is exclusively used for communication between NetBIOS and TCP/IP and
    cannot be changed manually.


    *   Registered port number:


    The range of this type of port is between 1024～49151, which is the port number
    range used by the user to write the server. These ports can also be dynamically
    selected by the client when they are not occupied by server resources.The port
    number used by the client is also called a temporary port number, and the value
    range is from 49152～65535.


    # Implement Port Scan


    After the user has a clear understanding of the port concept, port scanning can
    be implemented. The following section will introduce the use of Nmap and DMitry
    tools to implement port scanning.


    1) Use Nmap tool


    Using the Nmap tool to perform port scanning is often recommended.By using Nmap
    you can identify six port states, namely open (open), closed (closed), filtered
    (filtered), unfiltered (unfiltered), open/filtered (open or filtered)and closed/filtered
    (closed or filtered). If you want to use the Nmap tool to perform port scanning,
    you need to understand the meaning of each port status.


    The following section will introduce the specific meaning of these 6 port states.


    *   Open:


    In this condition the application is usually receiving TCP connections or UDP
    packets on this port. Security-conscious people know that every open port is an
    entry point for attack. Attackers or intrusion testers want to discover open ports,
    while administrators try to close them or use firewalls to protect them so as
    not to prevent legitimate users from using them. Non-security scans may also be
    interested in open ports because they show which services are available on the
    network.


    *   Closed:


    The closed port is also accessible to Nmap (it receives Nmap detection messages
    and responds), but it is evident that no application is listening on it. They
    can show that the host of the IP address (host discovery or ping scan) is running,
    and they can also help detect some operating systems. Because the closed ports
    are accessible, some ports may be opened again after a while. The system administrator
    may block such ports with a firewall. In this way, they will be displayed as being
    filtered.


    *   Filtered (filtered):'
