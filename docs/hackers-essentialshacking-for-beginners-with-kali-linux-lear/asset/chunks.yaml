    在用户准备好硬盘分区和安装媒体后，就可以在物理机上安装操作系统了。物理机上安装操作系统的方法与虚拟机中安装的方法相同。然而，要在物理机上安装操作系统，你需要设置安装媒体的启动项。


    通常情况下，硬盘是第一启动项。如果你使用 `USB` 安装盘来安装操作系统，则需要将第一启动项设置为 `USB` 设备。此外，在物理机上安装双系统时，还需要注意硬盘分区的选择以及
    `GRUB` 设置。如果操作不当，会导致数据丢失。接下来的部分将介绍一些在物理机上安装操作系统的设置方法。


    ## 将 USB 设备设置为第一启动项


    由于在物理机上不方便进行截图，接下来的部分将以虚拟机系统为例，介绍修改第一启动项的方法。


    具体步骤如下：


    1) 启动电脑并进入 `BIOS` 界面。虚拟机必须在关机状态才能进入。关闭虚拟机后，在菜单栏中选择`虚拟机` | `电源` | `开机时进入固件` 命令。


    注意：如果是物理机，用户需要在黑底白字界面出现时按下 `F2`、`F12` 或 `Del` 键（不同型号按键也不同，通常为 `F2` 键）进入 `BIOS`
    界面。


    2) 选择`开机时进入固件`命令进入当前系统的 `BIOS` 主菜单界面。


    3) 此界面为 `BIOS` 主菜单。在此界面中，用户使用右方向键切换到 `Boot` 标签，将显示相应的对话框。


    4) 从该对话框可以看到 4 个选项，即 `Removable Devices`、`Hard Drive`、`CD-ROM Drive`、`Network
    boot from Intel E1000 (Network)`。这 4 个选项代表 4 种启动方法，用户只需将启动项移动到第一位。如果你使用 `CD` 启动系统，使用向下箭头选择
    `CD-ROM Drive` 选项，按下加号 (+) 键将选项移动到第一位。此对话框的设置意味着第一启动项为 `Removable Devices`，即 U
    启动。设置完成后，保存并退出 `BIOS`。然后切换到右侧的 `Exit` 标签，即可显示对话框。


    5) 该对话框用于选择是否保存设置。选择 `Exit Saving Changes`（保存更改并退出）选项，按下 `Enter` 键，弹出对话框。


    6) 此对话框提示是否保存之前的设置并退出程序。如果用户确认设置无误，点击 `Yes` 按钮。点击 `Yes` 后系统将重启。系统启动时将进入 U 盘的引导界面。


    7) 本示例中的 U 盘是 `Kali Linux` 系统的安装盘，因此启动后显示的界面是安装 `Kali Linux` 的启动界面。此时，用户可以开始安装
    `Kali Linux` 操作系统。后续安装方法与虚拟机安装方法相同，此处不再重复。


    提醒：所有新电脑都带有 `UEFI` 固件，并且开启了 `Secure Boot`（安全启动）功能。此功能将拒绝启动未经过 UEFI 签名的操作系统。主板厂商通常允许用户关闭
    `Secure Boot` 功能，或要求你向 `UEFI` 中添加自定义公钥以绕过此限制。此时，用户需要关闭 `Secure Boot` 功能才能正常启动并进入他们的操作系统。


    ## 设置硬盘分区


    如果用户直接在没有任何数据的电脑上安装操作系统，则无需考虑数据丢失的问题，直接安装即可。然而，如果你正在安装双系统，则需要在硬盘分区过程中选择正确的格式化选项。在设置硬盘分区时，用户可以使用自动或手动方法。如果你不熟悉系统分区的用法，让系统自动分配即可。下面为读者描述了设置硬盘分区的常用方法，并提供了清晰的指令说明。请遵循操作！


    ### 如何自动分区系统？


    分区是一个复杂的程序，通常是系统程序员的工具箱。然而，对于初学者来说，有一些特定的指令可以让这个过程变得轻而易举。只需按照我们提供的步骤操作，即可避免任何错误。


    具体步骤如下：


    1) 在物理机上准备安装双系统时，会弹出一个对话框。


    2) 在对话框中，选择`Use the largest continuous free space`（使用最大连续空间）选项。如果一切顺利，系统中的空空间将被自动选中并分区。然后，点击`继续`
    按钮，屏幕将显示分区对话框。


    3) 从该对话框可以看到磁盘 `sdb` 已自动选中。在下一步中，选择`Place all files in the same partition`（将所有文件放在同一分区，推荐新手使用）并点击`继续`
    按钮。


    4) 从对话框中可以看到 `sdb` 磁盘上自动创建了两个分区，即 `swap` 和根目录 `/`。然后选择`结束分区设置并写入磁盘`选项并点击`继续` 按钮开始安装操作系统。


    ### 如何手动分区操作系统？


    1) 在分区方法中选择`手动`选项，点击`继续` 按钮查看当前系统的磁盘分区。


    2) 从对话框可以看到当前系统有两个硬盘，即 `sda` 和 `sdb`。此外，可以看到 `sdb` 中有 `107.4GB` 的空空间。此时，选择空空间并手动创建所需的
    Linux 系统分区表。通常建议创建一个根分区和一个交换分区。在此选择`空空间`进行分区，然后点击`继续` 按钮，显示分区对话框。


    3) 在对话框中指定要创建分区的大小。例如，为了创建一个 `2GB` 的交换分区，在文本框中输入 `2GB`。然后点击`继续` 按钮，显示设置分区类型的对话框。


    4) 在对话框中选择`Logical Partition`（逻辑分区）选项，点击`继续` 按钮，显示`新分区位置`对话框。


    5) 在对话框中选择`开始`选项，点击`继续` 按钮，立即显示`分区设置`对话框。


    6) 从此对话框可以看到，该分区将用于 `Ext4` 日文件系统，挂载点为 `/`。这里创建的是交换分区，因此需要修改为交换分区。然后点击`继续` 按钮，显示文件系统格式列表对话框。


    7) 在此对话框中，选择`Swap space`（交换空间）选项，点击`继续` 按钮返回`分区设置`对话框。


