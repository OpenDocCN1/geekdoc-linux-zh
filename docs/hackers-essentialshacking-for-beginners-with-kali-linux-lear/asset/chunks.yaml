    ​​is 255.255.255.0, the network segment is 192.168.1.0-255, that is, there are
    256 hosts in the network segment.


    When a user discovers a host, he can specify the network range through the mask
    format. Among them, for input convenience, CIDR format is usually used to specify
    the entire subnet. Among them, the CIDR format is composed of two parts, the network
    address and the subnet mask, separated by a slash (/).


    If the user is not sure of the subnet mask format corresponding to an IP range,
