- fmt: "\nThe user can analyse the leaked passwords of the target user's related groups,\
    \ obtain the password setting strategies of the similar groups, and then build\
    \ a new dictionary based on this. Markov Attack can analyse existing password\
    \ dictionary files, and count the occurrence probability, position distribution,\
    \ and context of each character in the password dictionary. Then, combined with\
    \ these rules, the mask can be used to generate a more effective password dictionary.\
    \ Kali Linux provides a tool called `statsgen` that supports Markov Attack technology.\
    \ The following section will introduce the method of using this tool to analyze\
    \ the password dictionary strategy.\n\nThe syntax format is as follows:\n\n```bash\n\
    statsgen [options] passwords.txt\n```\n\nIn the above grammar, `options` represents\
    \ the available options; `passwords.txt` represents the analysed password dictionary.\n\
    \nUse `statsgen` tool to analyze `rockyou.txt` password dictionary.\n\n### 1)\
    \ The execution command is as follows:\n\n```\nroot@exampleserver:～# statsgen\
    \ rockyou.txt\n```\n\nAfter executing the above command, it will start to analyse\
    \ the specified password dictionary and make statistics. Among them, the output\
    \ information includes basic statistical information of the tool, password length,\
    \ character set, password complexity, simple mask and advanced mask.\n\nIn order\
    \ to make the user more clear about the output result, the following section will\
    \ introduce each part of the information in turn. Among them, the first part of\
    \ the information is the basic information of the `statsgen` tool, as follows.\n\
    \nFrom the output information, you can see the version information of the `statsgen`\
    \ tool, the analyzed password file, and the statistics on the password file.\n\
    \nBy analyzing the output information, it can be seen that the version of the\
    \ tool is `0.0.3`; the analyzed password dictionary is `rockyou.txt`; the password\
    \ dictionary includes `14,344,392` passwords.\n\n### 2) The following is the password\
    \ length statistics information. The above information is based on the statistics\
    \ of the password length in the password dictionary, and sorted in descending\
    \ order according to the proportion of password length. Among them, the output\
    \ information is divided into 3 columns, which are the length of the password,\
    \ the proportion of the total number of passwords, and the total number of passwords.\n\
    \nFor example, the first line of information indicates that the password length\
    \ is `8`, which accounts for `20%` of the total number of passwords, and the total\
    \ number of passwords matching this length is `2966037`.\n\n### 3) The following\
    \ are statistics on the password character set.\n\nFrom the output information,\
    \ we can see that various password character sets in the password dictionary are\
    \ analyzed and counted.\n\n### 4) The following is the statistics of password\
    \ complexity. The above is a statistics on the complexity of the password. The\
    \ output information is divided into 3 columns, which respectively indicate the\
    \ characters that constitute the password and the use of such characters. The\
    \ minimum number of characters in the password and the maximum number of such\
    \ characters in the password.\n\n### 5) The following is the statistics of simple\
    \ masks: The above information is a simple statistics of the password string mask\
    \ format.\n\nFor example, `stringdigit` means letters in front, numbers behind;\
    \ `stringdigitstring` means letters in front, numbers in the middle, and letters\
    \ behind.\n\n### 6) The following is the advanced statistics of the password string\
    \ mask format: The above information is an advanced statistics on the password\
    \ string. Among them, advanced statistics is to represent the password characters\
    \ in the password file in mask format. Four mask formats are used after statistics,\
    \ and each format consists of one `?` (Question mark) Add a lowercase letter to\
    \ indicate a set of characters.\n\nThe representation and meaning of these four\
    \ mask formats are as follows:\n\n- `L`: represents the character set of lowercase\
    \ letters `a` to `z`.\n- `U`: Represents the character set of uppercase letters\
    \ `A` to `Z`.\n- `D`: Represents the character set of numbers `0-9`.\n- `S`: A\
    \ collection of characters representing special symbols.\n\nIn the mask format\
    \ obtained, a mask represents one digit in the password. For example, the `?l?l?l?l?d?d?d?d`\
    \ mask format represents an 8-bit password composed of 4 `?l` and 4 `?d`. Among\
    \ them, the first 4 passwords consist of lowercase letters `a` to `z` and the\
    \ last 4 passwords consist of numbers `0-9`.\n\n# Chapter 42: Generate a Dictionary\
    \ for Password Cracking\n\nAfter the user has collected enough target user information\
    \ and password policy, a password dictionary can be created based on the obtained\
    \ information. The following will introduce the method of generating dictionary\
    \ using `Crunch`, `rsmangler` and `rtgen` tools.\n\n### 1) Use Crunch Tool\n\n\
    `Crunch` is a password dictionary generator. It can generate a password dictionary\
    \ according to specified rules, and users can flexibly customize their own password\
    \ dictionary files. The following will introduce the method of using `Crunch`\
    \ tool to generate dictionary file.\n\nThe syntax format of using `Crunch` tool\
    \ to generate dictionary is as follows:\n\n```bash\ncrunch [min] [options]\n```\n\
    \nIn the above syntax, the parameter indicates the minimum length of the generated\
    \ password; indicates the maximum length of the generated password; indicates\
    \ the specified character set. `[options]` indicates the valid options.\n\nAmong\
    \ them, the commonly used options and their meanings are as follows:\n\n- `-O`:\
    \ Specify the name of the generated password dictionary file.\n- `-B number[type]`:\
    \ Specify the maximum number of bytes written to the file. The size can be specified\
    \ in `KB`, `MB`, or `GB`, but it must be used with the `-o` option.\n- `-T`: Set\
    \ the special format used.\n- `-L`: This option is used to identify some characters\
    \ of the placeholder when the `-t` option specifies `@`, `%`, or `^`.\n\nThe default\
    \ character set provided by the `Crunch` tool is saved in the `/usr/share/crunch/charset.lst`\
    \ file. At this point, the user can directly use these character sets to generate\
    \ the corresponding password dictionary.\n\nUsers can use the `cat` command to\
    \ view all character sets, as follows:\n\n```\nroot@exampleserver:/usr/share/crunch\n\
    # cat charset.lst\n```\n\nThe above output information is all character sets.\
    \ In the output information, the left side of the equal sign indicates the name\
    \ of the character set, and the right side indicates the characters used.\n\n\
    Use the `Crunch` tool to generate a password file with a minimum length of `8`\
    \ and a maximum length of `10`, and save it to the `/root/crunch.txt` file.\n\n\
    Among them, the character set used is `hex-lower`, that is `0123456789abcdef`.\n\
    \nThe execution command is as follows:\n\n```\nroot@exampleserver:～# crunch 8\
    \ 10 hex-lower -o /root/crunch.txt\n```\n\nCrunch will now generate the following\
    \ amount of data: `13304332288 bytes`, `12688 MB`, `12 GB`, `0 TB`. `Crunch will\
    \ now 100%` completed generating output.\n\nAs can be seen from the output information,\
    \ a `12GB` dictionary will be generated, with a total of `1224736768` passwords.\
    \ Moreover, the progress of the generated password is displayed as a percentage.\
    \ If the user wants to view the password in the dictionary, he can use the `vi`\
    \ editor or the `cat` command to view it. as follows:\n\n```\nroot @exampleserver:\
    \ ~ # cat \n```\n\n### 2) Use rsmangler tool\n\n`rsmangler` is a tool for generating\
    \ a dictionary based on the keywords of a word list. Use this tool to build a\
    \ dictionary based on the information collected by the user and use common password\
    \ construction rules.\n\nAmong them, the grammatical format of the `rsmangler`\
    \ tool is as follows:\n\n```bash\nrsmangler -f wordlist.txt -o new_passwords.txt\n\
    ```\n\nThe options and meanings in the above grammar are as follows:\n\n- `-F`,\
    \ `--file`: Specify the input file, that is, the password words collected by the\
    \ user.\n- `-O`, `--output`: Specify the name of the generated dictionary file.\n"
