    # 路由器密码破解


    路由器是网络的核心设备。一旦控制了路由器，就可以对连接到路由器的主机进行各种数据嗅探和欺骗攻击。大多数路由器使用用户名/密码认证方法。每个路由器的管理界面都有一个初始用户名和密码。由于某些管理员用户的错误，可能会使用初始密码或弱密码。本节将介绍破解路由器密码的常用方法。


    ## 路由器密码


    大多数路由器都有初始用户名和密码。为了方便用户实现路由器密码破解，下面列出了常见的路由器初始用户名和密码。


    ### 使用 Medusa 工具


    Medusa 是一款开源的暴力破解密码工具，它可以破解多种在线线密码，如 FTP、HTTP、IMAP 和 MYSQL。其中，路由器的管理界面基于 HTTP
    协议，因此用户可以使用 Medusa 工具实现密码破解。下面将介绍如何使用 Medusa 工具破解路由器密码。


    使用 Medusa 暴力破解路由器密码的语法格式如下：


    ```

    medusa -h [IP] -U [user file] -P [pass file] -M http -e ns

    ```


    暴力破解 TP-Linux 路由器的登录用户名和密码。


    执行命令如下：


    ```

    root@exampleserver:～# medusa -h 192.168.1.1-u admin -P passords.txt

    ACCOUNT FOUND: [http] Host: 192.168.1.1 User: admin Password: daxueba [SUCCESS]

    ```


    上面的输出信息显示了破解路由器密码的过程。从显示的结果中，可以看到路由器的用户名和密码已成功破解。其中，用户名为 `admin`，密码为 `daxueba`。


    # 破解 Linux 密码


    在 Linux 中，许多操作需要 root 用户 `root` 执行。如果获取 Linux 远程会话的用户没有权限且无法提升权限，则会话是无用的。此时，用户可以破解
    Linux 系统的用户密码并登录目标系统。下面将介绍破解 Linux 用户密码的方法。


    Linux 系统将加密的密码哈希保存在名为 `shadow` 的文件中，默认保存在 `/etc/shadow` 中。只要破解了该文件就可以查看用户的原始密码。但在破解
    `/etc/shadow` 密码之前，还需要 `/etc/passwd` 文件。该文件保存了用户的基本信息，如用户名、家目录和登录 Shell。破解 Linux
    用户密码需要结合 `/etc/shadow` 和 `/etc/passwd` 文件。该文件保存了用户的基本信息，如用户名、家目录和登录 Shell。破解 Linux
    用户密码需要结合 `/etc/shadow` 和 `/etc/passwd` 文件。


    1) 为了方便输入，将获取的密码文件复制到 `/root`。


    执行命令：


    ```

    root@exampleserver:～# cp /etc/passwd /etc/shadow /root

    ```


    执行上述命令后，`passwd` 和 `shadow` 文件位于 `/root` 目录。


    2) 使用 `unshadow` 命令提取。


    执行命令如下：


    ```

    root@exampleserver:～# unshadow shadow> cracked

    ```


    执行上述命令意味着 `passwd` 和 `shadow` 文件已提取并保存在 `cracked` 目录。


    3) 使用 `john` 工具破解密码。


    执行命令如下：


    ```

    root@exampleserver:～# john --wordlist=/usr/share/john/password.lst

    ```


    警告：检测到哈希类型为 "sha512crypt"，但也识别为 "crypt" 使用 `--show` 选项显示所有密码


    注意：上述命令中的 `--wordlist` 选项用于指定破解密码的字典。从输出信息可以看出，当前系统 root 用户的密码为 `daxueba`。此时，用户也可以使用
    `--show` 选项查看 `passwd` 中第二个字段的信息。


    执行命令如下：


    ```

    root@exampleserver:～# john --show cracked

    ```


    从输出信息可以看出，`passwd` 中 root 用户的第二个字段已从原始密码占位符变为真实密码。{结束}


    提示：使用 John the Ripper 工具破解 Linux 用户密码时，必须在该机器上操作。此外，`/etc/shadow` 和 `/etc/passwd`
    文件必须具有读取权限。


