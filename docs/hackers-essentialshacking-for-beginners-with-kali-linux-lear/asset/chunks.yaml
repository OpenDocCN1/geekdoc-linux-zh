- fmt: "\n# Learn to Attack And Crack Passwords of WIFI and Websites Using Tools\n\
    \n![](image_rsrc4A0.jpg)\n\nChapter 36\n\n## Understanding Wireless Networks\n\
    \n![](image_rsrc4A0.jpg)\n\nCompared with wired networks, wireless networks are\
    \ very simple to build, and only need a wireless router and a wireless client.\
    \ This section will introduce the composition and workflow of wireless network.\n\
    \n## Composition of wireless network\n\nUsually, a wireless network consists of\
    \ a router and a wireless client. In technical terms, routers are usually called\
    \ `AP` (Access Point) whereas Wireless clients are `STA` (Station). That is, clients\
    \ with wireless network cards, such as mobile phones, notebooks and tablet computers.\
    \ In a wireless network, there is at least one `AP` and one or more wireless clients.\n\
    \n### Wireless network workflow\n\nWhen the user has a clear understanding of\
    \ the structure of the wireless network, its workflow will be introduced.\n\n\
    There are four steps in this workflow as follows:\n\n1) Because `AP` broadcasts\
    \ `SSID` regularly, `STA` can listen to the signal sent by `AP`. When `STA` joins\
    \ the wireless network, it will send a probe request. When the `AP` receives the\
    \ request, it will respond to a response packet containing band information. At\
    \ this point, `STA` will switch to the specified frequency band.\n\n2) Then `STA`\
    \ will provide a password to authenticate the wireless network. When `AP` confirms\
    \ that the authentication information submitted by `STA` is correct then `STA`\
    \ will be allowed to access the wireless network.\n\n3) `STA` and `AP` usually\
    \ establish association. In the process of association, `STA` and `AP` should\
    \ negotiate the rate according to the strength of signals until the association\
    \ is successful. In which one `STA` can only be associated with one `AP` at the\
    \ same time.\n\n4) At this time, `STA` and `AP` can count\n\n`802.11` is a common\
    \ standard for wireless local area networks, which is formulated by the Institute\
    \ of Electrical and Electronics Engineers (`IEEE`) for wireless local area networks.\
    \ Although Wi-Fi is often confused with `802.11`, they are not the same. If you\
    \ want to penetrate the wireless network, you must understand its protocol standards.\
    \ Therefore, this next section will introduce the `802.11` protocol in detail.\n\
    \n### What is the 802.11 protocol?\n\n`802.11` is a WLAN standard originally formulated\
    \ by `IEEE`, and it is also the first internationally recognised protocol in the\
    \ field of WLAN. It is mainly used to solve the wireless access between users\
    \ and user terminals in office local area network and campus network. The maximum\
    \ rate of it can only reach `2Mbps`.\n\nBecause `802.11` was unable to meet people's\
    \ needs in terms of speed and transmission distance, `IEEE` team has successively\
    \ introduced two new standards, `802.11b` and `802.11a`. The main difference between\
    \ the three technologies lies in the MAC sublayer and the physical layer.\n\n\
    It can be understood that each `802.11` protocol standard uses different frequency\
    \ bands. There are two frequency bands, which are `2.4GHz` and `5GHz` respectively.\
    \ The difference between these two frequency bands will be explained later.\n\n\
    ### 802.11ac protocol\n\n`802.11ac` is the successor of `802.11n`. It is based\
    \ on `802.11a` standard, including `5GHz` band using `802.11ac`. The working bandwidth\
    \ of each channel of `802.11ac` will be increased from `40MHz` of `802.11n` to\
    \ `80MHz` or even `160MHz`. In addition, the actual frequency modulation efficiency\
    \ will be improved by about `10%`. Finally, the theoretical transmission speed\
    \ will jump from the highest `600Mbps` of `802.11n` to `1Gbps`.\n\nThe actual\
    \ transmission rate can be between `300 Mbps` and `400 Mbps`, which is close to\
    \ 3 times of the current actual transmission rate of `802.11n` (the current actual\
    \ transmission rate of `802.11n` wireless router is between `75 Mbps` and `150\
    \ Mbps`), which is enough to transmit multiple compressed video streams simultaneously\
    \ on one channel.\n\n### 2.4GHz frequency band\n\nFrequency band refers to the\
    \ frequency range of wireless signals. Wireless signals transmit data in a specified\
    \ frequency range. The frequency range of `2.4GHz` band is `2.4～2.4835GHz`. In\
    \ order to make full use of this frequency band, the range is divided into several\
    \ parts, and each part is called a `channel`.\n\nAt present, mainstream WiFi networks\
    \ generally support 13 channels. Although their centre frequencies are different,\
    \ they all occupy a certain frequency range, so there will be some overlapping\
    \ cases.\n\nBy knowing the frequency bands of these 13 channels, it is helpful\
    \ to understand the meaning of the three non-overlapping channels. Wireless networks\
    \ can operate on multiple channels. Various wireless network devices within the\
    \ coverage area of wireless signals should use different channels as much as possible\
    \ to avoid interference between signals.\n\nThere are actually 14 channels, but\
    \ the 14th channel is generally not used. The effective width of each channel\
    \ is `20MHz`, and there is also `2MHz` forced isolation band. That is to say,\
    \ the frequency range of channel 1 with centre frequency of `2412MHz` is `2401\
    \ ~ 2432 MHz`.\n\nIt can be seen from the figure that there is no overlap among\
    \ the three channels `1`, `6` and `11` (marked by solid lines). That is, it is\
    \ often said that there are three channels that do not overlap with each other.\
    \ It is also easy to see the overlapping of frequency bands among other channels.\
    \ In addition, if the equipment supports it, there are three groups of non-interfering\
    \ channels `(2, 7, 12)`, `(3, 8, 13)` and `(4, 9, 14)`.\n\n### 5GHz frequency\
    \ band\n\nWith the development of the times, `5GHz` band has gradually entered\
    \ people's lives. `5GHz` has higher frequency and shorter wavelength than `2.4GHz`,\
    \ so its penetability and distance are weak, but the data transmission is faster.\n\
    \nThere are five channels supported at `5GHz`, which are `149`, `153`, `157`,\
    \ `161` and `165`. When there are few `5GHz` sources, the channel can be selected\
    \ arbitrarily.\n\n### Bandwidth\n\nThe bandwidth here refers to the channel bandwidth.\
    \ Channel bandwidth is also often called `band bandwidth`, which is the frequency\
    \ range occupied by modulation carrier. In the commonly used `2.4～2.4835GHz` band,\
    \ the bandwidth of each channel is `20MHz`. It can be found that the `802.11n`\
    \ protocol includes two bandwidths, namely `20MHz` and `40MHz`.\n\nAmong them,\
    \ `20MHz` can reach `144Mbps` in `802.11n`, which has good penetability and long\
    \ transmission distance (about `100 meters`). `40MHz` can reach `300Mbps` in `802.11n`,\
    \ but its penetration is slightly poor and its transmission distance is short\
    \ (about `50 meters`).\n\nIf the reader is not clear about the above explanation,\
    \ you can think of these two bandwidths as the width of the road. The wider the\
    \ width, the more data that can be run at the same time, which improves the speed.\
    \ However, the \"road\" of wireless network is shared by all. When a user occupies\
    \ a wide road and runs a lot of data, it is easy to collide with other people.\
    \ Once a car crashes, everyone will slow down, perhaps even slower than walking\
    \ on a narrow road.\n\nIt can be seen that the `802.11b/g` protocol allows four\
    \ `APS` to use at the same time. If one `AP` uses `40MHz`, only two `APS` can\
    \ use it at the same time. Therefore, the choice of bandwidth mainly depends on\
    \ how many `APS` are working at the same time nearby. If there is not much interference\
    \ nearby, it is recommended to use `40MHz` bandwidth, which can achieve higher\
    \ transmission speed. \n\n## What Next?\n\nHope this chapter gave a clear cut\
    \ explanation about the working of wireless networks. World is rapidly changing\
    \ and tens of wireless modes are available now for users. As a hacker it is important\
    \ for you to be aware of the new wireless devices and modes that are coming into\
    \ the market. Constantly check for vulnerabilities in the wireless devices. In\
    \ the next chapter, we will talk about wireless security in detail. Follow along!\n"
