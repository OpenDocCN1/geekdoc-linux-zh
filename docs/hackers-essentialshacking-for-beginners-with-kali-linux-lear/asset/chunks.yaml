    在用户对软件源的含义和格式有清晰了解后，就可以添加软件源。本节将介绍 Kali Linux 系统中的官方软件源和常用的第三方软件源。


    ### 1) 官方软件源


    Kali Linux 官方源以及由官方重定向的源通常比较稳定。然而，速度并不一定快。


    其中，Kali 的官方源如下：


    `deb http://http.kali.org/kali kali-rolling main non-free contrib`


    ### 2) 常用的第三方软件源


    由于 Kali 的官方源是国外网站，国内用户在使用时可能会遇到网络不稳定问题，这可能导致软件包安装失败。此外，下载速度仍然较慢。此时，用户可以尝试添加第三方软件源。


    针对不同的国家和地区有许多可用的镜像站。你可以通过快速 Google 搜索来找到可用的第三方源列表。此外，你也可以使用 Torrent（种子）来分发 Linux
    镜像文件。这在任何方面都不是违法的，并且可以帮助你快速下载软件。


    ### 3) HTTP 和 HTTPS 的选择


    出于安全考虑，这些软件源目前支持 HTTPS 协议。要使用 HTTPS 协议的软件源，只需将 URL 地址中的 `http` 改为 `https` 即可。


    `deb https://http.kali.org/kali kali-rolling main non-free contrib`


    由于加密问题，HTTPS 下载软件的速度较慢。但它可以避免缓存服务器的影响。因此，如果用户在安装软件时因为缓存服务器导致无法下载软件，可以将软件源修改为 `HTTPS`
    并重新安装软件。


    ### 4. deb-src 软件源


    某些软件不提供二进制包，只提供源代码。对于这类软件，必须添加 `deb-src` 软件源。下载后，它会在用户的计算机上自动编译并生成可执行文件。


    其中，`deb-src` 软件源的格式如下：


    `deb-src http://http.kali.org/kali kali-rolling main non-free contrib`


    ### 更新软件源/系统


    用户配置软件源后，需要使用 `apt-get update` 命令更新软件源，以使配置生效。用户也可以通过更新软件源来快速更新系统。


    本节将介绍更新软件源和更新系统的方法。


    执行命令如下：


    ```

    root@exampleserver:～# apt-get update

    ```


    从上面的输出可以看出，软件源已成功更新。


    执行命令如下：


    ```bash

    root@exampleserver:～# apt-get dist-upgrade R

    ```


    上面的输出信息显示了更新后的包信息，包括要升级的包、新安装的包以及卸载的包。此时，输入 `Y` 继续操作。如果后续操作过程中没有错误信息，则系统更新将成功。更新完成后，重启系统，即重新加载新系统。


    用户也可以使用图形界面来更新操作系统。


    具体步骤如下：


    1) 点击左侧收藏夹中的 `Show all programs`（显示所有程序）按钮打开所有程序界面，点击 `Software`（软件）按钮显示对话框。

    2) 从对话框的 `Update (U)`（更新）选项卡可以看到有更新提示。此时，点击 `Operating System Update`（操作系统更新）选项查看需要更新的软件包。

    3) 界面会显示需要更新的软件包。此时点击右上角的 `close`（关闭）按钮返回软件更新对话框。然后，点击 `Download (D)`（下载）按钮开始下载更新后的软件包。下载完成后，将显示该对话框。

    4) 点击右上角的 `Restart and Update`（重启并更新）按钮，会弹出 `Restart and Install Update`（重启并安装更新）对话框。

    5) 点击 `Restart and Install`（重启并安装）重启系统并更新软件包。

    6) 此界面显示正在安装的更新包。更新完成后，系统会自动重启。


    ### 从软件源安装软件


    用户配置软件源后，就可以安装软件源中提供的所有软件。本节将介绍软件源中的软件。


    #### 确认包名


    用户在安装软件时，需要知道包名。如果你不确定名称，可以使用 Kali Linux 中的几个命令来搜索包名。


    确认包名的方法描述如下。


    #### 什么是软件包？


    软件包是指具有特定功能以完成任务的程序或一组程序。软件包由基础组件和可选组件组成，可以以源代码或目标代码的形式存在。在 Linux 系统中，软件包有两种主要形式，即二进制包和源码包。其中，最常见的二进制包格式是
    `deb` 和 `rpm`。


    #### 根据关键词搜索软件包


    在 Kali Linux 中，用户可以使用 `apt-cache` 命令根据关键词搜索软件包。


    其中，命令的语法格式如下：


    `apt-cache search package_name`


    根据关键词 `pm-` 搜索包名。


    ```bash

    root@exampleserver:～# apt-cache search "pm-"

    ```


    从输出中可以看到所有包含 `pm-` 关键词的包都已被搜索。在上面的信息中，分别显示了包名和软件包的功能。通过软件包信息可以确定包名。


    '
