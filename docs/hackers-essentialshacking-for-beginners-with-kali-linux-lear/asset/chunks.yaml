    2) This dialog box displays the welcome message for installing VMware Workstation.
    Click the "Next" button so that the "End User License Agreement" information will
    be displayed.


    3) This dialog box shows the user license agreement for using VMware. Select the
    "I accept the terms in the license agreement" check box, and click the "Next"
    button.


    4) You can customise the installation location of VMware in this dialog box. By
    default, VMware will be installed in the `C:\Program Files(x86)\VMware\WMware
    Workstation` directory. If the user wants to install to another location, he can
    click the "Change" button to specify the location of the installation. Then click
    the "Next" button, and the "User Experience Settings" dialog box will be displayed.


    5) This dialog box is used to set user experience information, including checking
    for product updates at startup and helping to improve VMware Workstation Pro.
    By default, both options are enabled. Use the default settings here, and then
    click the "Next" button, so that the shortcut creation dialog box will be displayed.


    6) This dialog box will show the shortcut location of VMware Workstation Pro,
    which will be created in "Desktop (D)" and "Start Menu Program Folder (S)" by
    default. Then click the "Next" button so that the "Ready to install VMware Workstation
    Pro" dialog box will be displayed.


    7) By this time, the previous basic settings work is completed. Click the "Install"
    button to start installing VMware products. After the installation is completed,
    the completion dialog box will be displayed.


    8) From this dialog box, you can see that VMware Workstation Pro has been installed.
    Since VMware Workstation Pro is not a free version, you need to enter a license
    key before it can be used for a long time after activation. Click the "License"
    button in this dialog box, and the "Enter License Key" dialog box will be displayed.
    We suggest you to buy the license for a year to reduce prices. There are also
    additional discount offers for students and organisations.


    9) After entering a license key in this dialog box, click the "Enter" button,
    and the completion dialog box will be displayed.


    (10) As you can see from this dialog box, the VMware Workstation pro installation
    wizard has been completed. Click the "Finish" button to successfully install the
    VMware software. In the next section, the user can use the virtual machine to
    install the operating system.


    # Create Kali Linux Virtual Machine


    If the user wants to install the operating system in the VMware software, he needs
    to create a corresponding virtual machine first, that is, to simulate an environment
    with complete hardware system functions. When creating a Kali Linux virtual machine
    environment, it is recommended that the memory is not less than 2GB, otherwise
    the Metasploit software cannot run normally. The disk space size should also not
    be less than 20GB, otherwise it will not be able to update normally later.


    The specific steps to create a Kali Linux virtual machine are as follows:


    1) Start the VMware virtual machine. After successful startup, the interface to
    enter settings will be displayed.


    2) The main interface of VMware is very easy to follow. The user can create a
    virtual machine by clicking the "Create a new virtual machine" button on this
    interface. You can also select the `File (F)` | `New Virtual Machine (N)` command
    in the menu bar to create a new virtual machine. After clicking the "Create a
    new virtual machine" button, the "New Virtual Machine Wizard" dialog box with
    additional information will be displayed.


    3) Select the type of new virtual machine in this dialog box. Two methods are
    provided here, namely "typical (recommended) (T)" and "custom (advanced) (C)".
    The difference between the two methods is that the operation of the first method
    is relatively simple, and the second method requires manual setting of some information,
    such as hardware compatibility, processor, memory, etc. If you are a novice, it
    is recommended to use the "typical (recommended) (T)" method. Moreover, the advanced
    settings (processor, memory, etc.) of the virtual machine can even be set after
    the virtual machine is created. Here for beginners we will select the "typical
    (recommended) (T)" method, and click the "Next" button, so that the installation
    source dialog box will be displayed.


    4) In this dialog box, select the source of the installation client, that is,
    the method to insert the installation image file. As you can see from this dialog
    box, three installation sources are provided by default. Here, select the "Install
    the operating system (S) later" option, and click on the "Next" button, so that
    the "Select Guest Operating System" dialog box will be displayed.


    5) This dialog box is usually used to select the operating system and version
    to be installed. In this example, the Kali Linux (based on Debian) operating system
    is being created. Therefore, the Linux operating system is selected here, and
    the version selected is Debian 9.x 64-bit. Then click the "Next" button, so that
    the "Name Virtual Machine" dialog box will be displayed.


    6) This dialog box asks you to create a name for the virtual machine and set the
    installation location of the virtual machine. After setting, click the "Next"
    button, so that the "Specify Disk Capacity" dialog box will be displayed.


    7) Set the disk capacity in this dialog box. For users of penetration testing,
    they usually have a large password dictionary when performing password brute force
    cracking. If the password dictionary is too large, it will take up a lot of space.
    In addition, in order to facilitate the user to update later, it is also recommended
    that the users set the disk capacity a bit larger to avoid insufficient disk capacity.
    In this example, we are going with the disk size to 100GB and are ready to click
    the "Next" button.


    8) The next dialog box displays the detailed information of the newly created
    machine. Click the "Finish" button to see the created virtual machine.


    This interface shows the newly created Kali Linux virtual machine. In the next
    section, the user can install the operating system.


    # Install the operating system


    Now, we install the Kali Linux operating system in the virtual machine created
    earlier. Before installing the operating system, it is recommended to modify its
    running memory and processor. If the memory is too small, a certain program will
    not run normally. In addition, before installing the system, you also need to
    manually load the corresponding image file.


    The specific steps to install Kali Linux are as follows:


    1) Open the previously created virtual machine, the interface with details will
    be displayed.


    2) Click the "Edit Virtual Machine Settings" option on this interface, or select
    the `Virtual Machine` | `Settings` command in the menu bar to open the "Virtual
    Machine Settings" dialog box.


    3) In the "Hardware" tab of the dialog box, you can set the details of memory,
    processor, and network adapter. Among them, the memory size is set to 2GB in this
    example. Then, select the CD/DVD option to load the system image file. Select
    the "Use ISO image file" radio button on the right and specify the image file
    of the Kali Linux system. After setting, click the "OK" button to return to the
    main interface of the virtual machine. Then click the "Enable this virtual machine"
    option, so that the operating system will start to install.


    4) This interface is the installation guide interface of Kali, you can select
    the installation method on this interface. The user can use the arrow keys to
    view all the boot options that are available. Select the Graphical install (graphical
    interface installation) option and press the Enter key. The language selection
    dialog box will be displayed immediately.

