    -   `/var`: 该目录的内容经常变化。`/var` 通常包含 `/var/log`、`/var/spool`、`/var/cache` 等。其中，`/var/log`
    是用于存储系统日志的目录。`/var/spool` 是存储打印机、邮件服务器、代理服务器等的置池化目录；`/var/cache` 用于存储一些缓存文件。


    在用户清晰了解 Kali Linux 文件系统结构后，就可以进行文件管理了。在这里，我们将介绍 Linux 图形界面系统的文件管理工具。


    1) 在桌面上选择“位置” | “计算机”，这样就会打开文件系统的根目录。


    2) 从此界面，你可以看到根目录下的所有文件和文件夹。此时，用户可以执行打开文件、创建文件、删除文件和查看文件内容等操作。如果你想打开一个文件，只需双击该文件。如果你想删除或复制文件，需要选择该文件或文件夹并点击右键，会弹出一个菜单。其中，将显示文件夹和文件的弹出菜单。


    3) 此时，选择弹出菜单中的任何命令来执行相应的操作。例如，选择“用文本编辑器打开”命令来显示文件内容。


    4) 此界面显示了 `sources.list`文件的内容。此时，用户可以编辑文件中的内容。如果你可以修改文件内容，可以点击“保存 (S)”按钮使修改生效。


    # 终端


    终端可以理解为命令行模式下的文件管理工具。对于喜欢使用命令行操作的用户来说，可以使用终端模式来实现文件管理。通过前面的介绍，用户也知道某些命令在图形界面下无法正常运行。因此，知道如何使用终端执行操作也是一项非常重要的技能。下节将介绍终端的常用操作。


    1) 打开新终端


    如果你想使用终端，首先需要打开终端。在 Kali Linux 中，有两种打开终端的方法。第一种是直接点击收藏中的终端按钮。第二种方法是在桌面上点击右键，并在弹出菜单中选择`在终端打开`
    命令。


    如你所见，立即界面表示终端窗口已成功打开。在这个窗口中，用户还可以打开多个终端。右键点击终端窗口并选择弹出菜单中的`新建标签页 (T)` 命令来打开一个新的终端窗口。


    从此界面可以看到，终端有两个标签。通过点击标签，你可以切换你当前所处的终端窗口。


    2) 查看目录


    当用户打开终端窗口时，他可以通过命令行管理文件。查看目录是确定当前目录下包含哪些文件最常用的操作。使用 `ls` 命令查看当前目录下的所有文件。


    从此界面显示的结果中，你可以看到当前目录下的所有文件已列出。


    3) 切换目录


    切换目录也是最常用的操作。如果用户想查看某个目录下的文件，需要切换到相应的目录。例如，使用 `cd` 命令切换到 `/etc` 目录，并使用 `pwd` 命令查看当前工作目录。


    从输出中可以观察到，你成功切换到了 `/etc` 目录。


    4) 编辑文件


    编辑文件是用于操作文件内容的方法。例如，如果你想在终端上设置软件源，就需要编辑软件源文件。例如，你可以使用 `Vi` 文本编辑器来编辑软件源。


    执行上述命令后，你就可以打开 `sources.list`文件的编辑界面。


    上述界面表示 `sources.list` 文件的编辑界面已成功打开。接下来，用户可以编辑文件。


    下节将介绍如何使用 `Vi` 文本编辑器编辑文件和保存文件。在使用 `VI` 编辑器之前，你需要理解它的 3 种工作模式，即命令模式、输入模式和末行模式。


    这 3 种模式的功能如下：


    - 命令模式：启动 `Vi` 文本编辑器后，默认进入命令模式。该模式主要完成光标移动、字符串搜索以及删除、复制和粘贴文件内容的相关操作。


    - 输入模式：此模式下的主要操作是输入文件内容，以便你可以修改文本文件主体或添加新内容。当处于输入模式时，`Vi` 文本编辑器的最后一行将显示状态提示信息
    `--INSERT--。


    - 末行模式：在此模式下，你可以设置 `VI` 编辑环境、保存文件、退出编辑器并执行搜索和替换文件内容等操作。当处于末行模式时，`VI` 编辑器的最后一行会出现冒号(:)
    提示符。


    当用户使用 `Vi` 文本编辑器打开文件时，默认进入命令模式。此时，按下 `a`、`i` 或 `o` 进入输入模式并编辑文件内容。编辑完成后，按下 `Esc`
    返回命令模式。然后，输入 `:` 提示进入末行模式，输入 `:wq` 保存并退出。或者，用户也可以输入 `ZZ` 保存并退出。


    第 5 章


    Kali 中的设置面板


    ![](img/image_r49V.jpg)


    在上一章中，我们学习了各种 Kali Linux 特性的重要性。本章将详细介绍设置面板以及用户需要了解的网络功能。


    # 设置面板


    设置面板可用于设置系统，如分辨率、电源、背景颜色、网络连接等。在某些系统中执行操作时，这些设置是必要的。本节将介绍 Kali 的设置面板。


    启动设置面板


    1) 点击收藏应用程序按钮，显示所有应用程序。


    2) 点击此界面上的设置按钮打开“设置”面板。


    3) 你可以在左栏看到所有设置项。用户选择设置项后，可以在右栏进行相应的设置。例如，设置电源。在左栏选择`电源`设置项，在右栏设置`空屏 (B)`和`自动睡眠
    (A)`的时间。


    # 配置网络


    为了实施渗透测试，你需要连接网络。在实施渗透测试之前，你需要配置网络。用户可以使用有线网络、无线网络和 `VPN` 连接网络。本节将介绍这三种网络配置方法。


    配置有线网络


    有线网络是通过同轴缆缆、双绞线和光纤连接的计算机网络。简单来说，就是通过网线连接的计算机网络，通常称为以太网。有线网络相对稳定。如果用户需要下载较大的文件或更新系统，则建议使用有线网络。在
    Kali Linux 中，用户可以使用命令行或图形界面配置有线网络。


    1) `ifconfig` 命令查看现有的网络配置


    配置网络之前，首先检查现有的网络配置。如果网络已经配置，则无需再次配置。如果没有配置，则用户需要手动配置。


    '
- fmt: '

    Use the `ifconfig` command to view the existing network configuration as follows:


    ```

    root@exampleserver:～# ifconfig

    ```


    This will display a lot of information about the wired network. We recommend you
    to save an image of this information for future reference of the target you are
    attacking. It is also useful when you are targeting a wireless network.


    ### Graphical interface settings


    The graphical interface settings are relatively intuitive and easy to operate.
    The following section will introduce the method of setting the wired network on
    the graphical interface.


    The specific steps to configure the wired network are as follows:


    1) Open the "Settings" panel and select the "Network" setting item, the dialog
    box will be displayed.


    2) As you can see from this dialog box, the wired network is not connected. At
    this time, click the setting button and the dialog box will be displayed.


    3) From the dialog box, you can see that it contains 5 labels, which are detailed
    information, identity, IPv4, IPv6, and security. Here mainly configure the options
    in the `IPv4` label. After setting, you can see the obtained network information
    in the "Details" tab. Select the `IPv4` tab, and the dialog box will be displayed.


    4) Set the method of obtaining IPv4 address in this dialog box. There are 4 methods
    provided here, namely automatic (DHCP), manual, local link only, and Disable.
    Among them, the "auto (DHCP)" option means that the DHCP server will automatically
    assign an IP address to the current host.


    The "manual" option means that the user needs to manually set the IP address,
    subnet mask and gateway. The "local link only" option is only used Local connection
    when it is unable to access the Internet. Disable option means to disable the
    IPv4 address. If you want to access the Internet, you must use both automatic
    (DHCP) and manual methods. For ease of use and faster operation, "Auto (DHCP)"
    is the best choice. If the user wants to fix the current computer address, he
    can select the "Manual" radio button so that the dialog box will be displayed.


    5) In this dialog box, you can manually specify the IP address, subnet mask, gateway,
    DNS, and routing information to prevent users from failing to access the Internet
    due to configuration errors. It is recommended to only set the IP address and
    subnet mask. After setting, click the "Apply (A)" button in the upper right corner
    to return to the network setting dialog box.


    6) At this time, the wired network configuration is complete. But the interface
    has not been activated yet. Therefore, users need to activate the interface before
    they can obtain the assigned IP address and then access the Internet. Click the
    start button in this dialog box to connect to the wired network.


    7) From this dialog box, you can see that the status of the wired network is "Connected".
    This shows that the wired network configuration is successful. At this point,
    you can see the acquired address information in the "Detailed Information" tab.


    8) From this dialog box, you can see the wired network speed, IPv4 and IPv6 address,
    hardware address, default route and DNS information. Be sure to select the "Automatic
    connection (A)" check box on this interface. Otherwise, you cannot automatically
    connect to the network after restarting the computer. By default, the "Auto Connect
    (A)" check box is selected.


    ### Command line settings


    It is also very simple to configure the network using the command line, and the
    configuration can be completed with a few commands. The network connection configuration
    file of Kali Linux is `/etc/network/interfaces`. Use the `VI` editor to edit the
    interfaces file.


    The default content of the file is as follows:


    ```

    root@exampleserver:～# vi /etc/network/interfaces


    # This file describes the network interfaces available on your system # and how
    to activate them.

    ```


    As can be seen from the above information, only one `lo` interface is configured
    by default. If you want to configure a wired network, add the information of the
    Ethernet interface `ethX`. Similarly, users can set to obtain an IP address dynamically
    or assign an IP address statically (manually). For example, the following will
    set up the wired network of the Ethernet interface `eth0`.


    The method of dynamically obtaining an IP address is as follows:


    ```

    auto eth0 iface eth0 inet dhcp

    ```


    The method of statically assigning an IP address is as follows:


    ```

    auto eth0 iface eth0 inet static

    ```


    Users can choose a method that suits them to configure the wired network. After
    the setting is complete, save and exit the configuration interface of the `interfaces`
    file. Next, the user also needs to restart the network service to make the configuration
    in the `interfaces` file take effect.


    The execution command is as follows:


    ```

    root@exampleserver:～# service networking restart

    ```


    After executing the above command, no information will be output. At this point,
    the user can use the `ifconfig` command to view the acquired address information.


    ### Configure wireless network


    Wireless network refers to any form of radio computer network. The computer needs
    to connect to the network through a wireless network card. If the user is a Kali
    Linux system installed in a virtual machine and wants to connect to a physical
    network, he can use a wireless network card to connect to his wireless network.


    The specific steps to configure a wireless network are as follows:


    1) Determine whether your host has a wireless network card. If there is no wireless
    network card, you can use a USB wireless network card. Insert the USB wireless
    network card into the host, and use the `lsusb` command to check whether the wireless
    network card is successfully identified.


    The execution command is as follows:


    ```

    root@exampleserver:～# lsusb

    ```


    2) Use the `ifconfig` command to check whether the wireless network interface
    is activated. as follows:


    ```

    root@exampleserver:～# ifconfig

    ```


    At this point, the user can use the `ifconfig -a` command to view all interfaces.
    After executing this command, if you see the `wlan` interface name, it means that
    the network card is successfully identified. The user needs to use the following
    command to activate the network card.


    ```

    root@exampleserver:～# ifconfig wlan0 up

    ```


    After executing the above command, there is no output information. In order to
    judge whether the wireless network card is successfully activated, the user can
    use the `ifconfig` command again to check.


    3) In the graphical interface of Kali Linux, click the shutdown button in the
    upper right corner, and a menu will pop up.


    4) From this menu, you can see commands such as "Wired Connected", "Wi-Fi Not
    Connected", and "Agent None". Select the "Wi-Fi not connected" option, and the
    subcommands for related settings will pop up.


    5) Select the "Select Network" command to see all Wi-Fi networks searched.


    6) In this dialog box, you can set the Wi-Fi network to be connected for network
    connection. For example, connect to the Test wireless network. First select the
    Test wireless network, and then click the "Connect" button, a dialog box will
    pop up.


    7) Enter the authentication password of the wireless network Test in this dialog
    box, and then click the "Connect" button. If the connection is successful, you
    can see the connected wireless network name.


    The above method is when the SSID name of the wireless AP is broadcasted and the
    user can connect directly. In many cases, users may hide their SSID number for
    security. At this time, the user cannot see the Wi-Fi network in the searched
    signal. So the user needs to manually add the wireless network and connect.


    The specific steps to connect to a hidden network are as follows:


    1) Use the `ifconfig` command to confirm that your wireless network card has been
    activated.


    2) Select the "Wi-Fi" option to open the WiFi dialog box. Click the list button
    in the upper right corner.

