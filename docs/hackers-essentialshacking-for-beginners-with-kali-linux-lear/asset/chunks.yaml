    # Learn How To Gather Information About A Target And Attack it With Nmap


    ![](image_rsrc49X.jpg)


    Introduction


    The previous module of this book introduced Kali Linux along with it''s features
    and installation guides. This module looks at the most important skill that needs
    to be mastered by all hackers and pen testers i.e Reconnaissance. We will look
    at various tools and provide tons of examples for you to understand the essence
    of the subject clearly.


    What tools do you need?


    There are hundreds of tools developed only for reconnaissance as it plays a major
    role in the hacking procedure. For a basic level introduction this book mainly
    focuses on two tools, Nmap and Dmitri. We suggest you to install both these tools
    before starting this book if you are on Windows or Mac. If you have already installed
    Kali then you can easily access them from the search menu. As said before tools
    are only their for automating things and streaming for your hacking procedure.
    The secret of hacking always depends on the strategy you chose to find a backdoor
    to the host. Don’t get overwhelmed by tools features and forget your main motto.


    How to approach this module?


    Information gathering is more about understanding the approach rather than understanding
    the tools or commands that have been used. Every target needs a different approach
    and as a hacker you need to solely develop an approach to attack a target depending
    on the results you obtain from reconnaissance. So, make sure you are analysing
    the log files and results carefully.'
