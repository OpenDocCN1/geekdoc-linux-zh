  trans: "\n\n## 使用 Nslookup 工具\n\n(1) 启动 `Nslookup` 工具进入交互模式。\n\n执行命令如下：\n\n```\n\
    root@exampleserver:～# nslookup>\n```\n\n如果你看到命令行提示符显示为 `>`，说明你已经成功进入了 `Nslookup`\
    \ 的交互模式。\n\n(2) 将查询类型设置为 `NS` 记录。\n\n执行命令如下：\n\n```\nset type=ns\n```\n\n(3) 输入要查询的域名名。\n\
    \n执行命令如下：\n\n```\nwikipedia.com\n```\n\n输出结果可能如所示所示：\n```text\nServer: 192.123.8.1\
    \ Address: 192.342.43.2 #53 Non-authoritative answer:\nName:www.wikipedia.com\
    \ Address: 54.123.131.876\n= ns7.wikipedia.com .\nwikipedia.comnameserver = ns2.wikipedia.com.\n\
    ```\n\n如果用户不需要查询其他记录，可以使用 `exit` 命令退出交互模式，如下：\n\n```\nexit root@exampleserver:～#\n\
    ```\n\n## 使用 Ping 命令\n\n`Ping` 命令可用于检查网络是否连接。这通常有助于用户分析和判断网络故障。对于域名，你通常可以指定多个\
    \ IP 地址。因此，当用户使用某些工具查询域名信息时，会获取多个地址信息。此时，用户无法确定目标服务器使用的是哪一个地址。用户可以使用 `Ping` 命令确定当前正在使用的\
    \ IP 地址，然后确定目标主机。\n\n`Ping` 命令的语法格式如下：\n\n```\nping -c [count][target]\n```\n\n\
    在上述语法中，选项 `-c` 用于指定要发送的 `Ping` 数据包数量，参数 `[target]` 用于指定目标主机的地址，其中目标主机地址可以是主机名、IP\
    \ 地址或域名。在 Windows 系统中，`Ping` 命令只会发送并响应 4 个数据包后停止 `Ping`。在 Linux 系统中，`Ping` 命令默认会一直执行，用户需要按下\
    \ `Ctrl+C` 组合键来停止 `Ping`。\n\n#### 用场景示例：\n\n使用 `Ping` 命令检测域名 `www.wikipedia.com`\
    \ 的 IP 地址，并指定只发送 4 个检测数据包。\n\n执行命令如下：\n\n```\nroot@exampleserver:～# ping -c 4\
    \ www.wikipedia.com\n```\n\n输入上述命令后，我们可以看到成功接收了目标主机的响应包。从响应包信息中可以看到目标所颁发的 IP 地址。\n\
    \n## 接下来做什么？\n\n在深入理解了域名和服务器分析后，你现在已经足够进入端口分析的重要性领域了。`Nmap` 是一个著名的信息收集工具，它的流行主要归功于其卓越的端口分析方法。跟随下文了解更多如何使用\
    \ `Nmap` 实现端口分析。\n\n## 第 13 章：扫描端口\n\n![](img/image_rsrc49X.jpg)\n\n通过扫描端口，你可以发现运行在目标主机上的程序。之后，我们可以收集这些程序的信息以获取漏洞信息，并成功实施渗透测试。本节将介绍端口的概念以及实现端口扫描的方法。\n\
    \n## 端口简介\n\n在计算机中，端口被认为是一个核心概念。在网络技术中，端口有多种含义。这里指的端口不是物理端口，而是 TCP/IP 协议中的端口。它是逻辑意义上的端口。在\
    \ TCP/IP 协议中，最常用的协议是 `TCP` 和 `UDP`。由于 `TCP` 和 `UDP` 两个协议是独立的，它们各自的端口号也是相互独立的。例如，`TCP`\
    \ 有端口 235，`UDP` 也可以有端口 235，两者通常不会冲突。\n\n端口的功能和常用端口描述如下：\n\n### 1) 端口的作用\n\n用户知道主机对应一个\
    \ IP 地址并可以提供多种服务，例如 Web 服务和 FTP 服务。如果只有一个 IP，则无法区分不同的网络服务，因此使用 `IP+端口号` 来区分不同的服务。\n\
    \n### 2) 端口的定义\n\n端口号用于识别主机中的唯一进程，而 `IP+端口号` 则可以识别网络中的唯一进程。在网络开发中的 Socket 编程中，`IP\
    \ + 端口号` 就是 socket。端口号由 16 位二进制数计数，范围在 0～65535 之间。\n\n然而，这些端口不能随意使用，某些端口可能已经被占用。例如，Web\
    \ 服务器的端口是 80，FTP 服务的端口是 21 等。因此，对端口进行了分类，并为渗透测试人员严格规定了用户可以使用的端口范围。始终对目标所拥有的端口有良好的了解。\n\
    \n### 3) 端口分类\n\n端口有许多分类方法。通常根据它们是由服务器使用还是客户端使用来进行分类。\n\n服务器使用的端口号可以分为预留端口号和注册端口号，如下：\n\
    \n*   **预留端口号**：\n    此类端口的数值范围是 0～1023。这些端口在用户编程期间不能使用，而是由某些程序使用。只有具有超级用户权限的应用才被允许使用预留端口。例如，WWW\
    \ 服务的端口是 80，FTP 服务的端口是 21。用户也可以为这些服务指定预留端口。例如，端口 139 专门用于 NetBIOS 和 TCP/IP 之间的通信且无法手动更改。\n\
    \n*   **注册端口号**：\n    该类型端口的范围是 1024～49151，是用户编写服务器使用的端口。当这些端口未被服务器资源占用时，客户端也可以动态选择。客户端使用的端口也称为临时端口，其范围是\
    \ 49152～65535。\n\n"
- fmt: '

    Because packet filtering prevents probe packets from reaching port, `nmap` cannot
    determine whether the port is open. Filtering may come from professional firewall
    equipment, router rules, or software firewalls on the host. Sometimes they respond
    to ICMP error messages, such as type 3 code (target cannot be reached), but more
    generally `nmap` will retry several times to detect whether probe packet is discarded
    due to network congestion. This will cause scanning speed to slow down significantly.


    ### Unfiltered

    The unfiltered state means that port is accessible, but `nmap` cannot determine
    whether is open or closed. User will only classify port into this state through
    `ACK` scan. Using other types of scanning (such as window scanning, `SYN` scanning)
    can help determine whether the port is open.


    ### Open/filtered

    When it is impossible to determine whether port is open, `nmap` divides the port
    into this state. This is the case when open port does not respond. No response
    may also mean filter discarded the probe message and any response caused by it.
    Therefore `nmap` cannot determine whether port is open or filtered. `UDP` protocol,
    `FIN`, `Null`, and `Xmas` scans may fall into this category.


    ### Closed/filtered

    This state is used when `nmap` cannot determine whether port is closed or filtered.
    It will only appear in `Idle` scan.


    ## Port Scanning

    The syntax format for port scanning using `nmap` is as follows:


    ```

    nmap -p [target]

    ```


    In the above syntax, `-p` option is used to specify the port to be scanned. The
    designated port can be a single port, multiple ports, or range of ports. When
    specifying multiple ports, separate the ports with commas. By default the range
    of ports scanned by `nmap` is 1 to 1000.


    #### Use-case scenario

    Perform port scanning on target host `192.243.176.84`.


    The execution command is as follows:


    ```

    root@exampleserver:~# nmap 192.243.176.84

    ```


    When this command is entered on the terminal `nmap` tool scans 1000 ports by default.
    It will display the open ports in the output.


    #### Use-case scenario

    Specify the port range from 1 to 50, and perform port scanning on target host.


    The execution command is as follows:


    ```

    root@exampleserver:~# nmap -p 1-50 192.243.176.84

    ```


    From the output result after entering the above terminal we can see that ports
    ranging from 1 to 50 are scanned. All the open ports will be displayed.


    #### Use-case scenario

    Specify ports 21 and 23 of target host.


    The execution command is as follows:


    ```

    root@exampleserver:~# nmap -p 21,23 192.243.176.84

    ```


    This gives detailed information about the two parts that have been specifically
    asked by the command. By using these techniques you can minimise the time that
    usually takes for scanning ports.


    ## Use Dmitri Tool

    `nmap` tool provides the `-p` option to implement port scanning. The syntax format
    used to implement port scanning is as follows:


    ```

    nmap -p [host]

    ```


    Here `host` is the IP address of the target we are trying to scan ports.


    #### Use-case scenario

    Use `dmitry` to scan the open ports on target host `192.243.176.84`.


    The execution command is as follows:


    ```

    root@exampleserver:~# dmitry -p 192.243.176.84

    ```


    From the output information, you can see all the ports open on the target host.
    From the penultimate line of output, you can see the number of ports that were
    scanned and number of ports that were closed.


    ## What Next?

    Many important ports are still difficult to implement. Nowadays administrators
    are using intrusion systems and it is not a good practice to completely rely on
    them. Also with ports we may not find additional information required to build
    exploits. It helps if we can find out about the operating system that the target
    is using. Follow along to know more about operating system detection in the next
    chapter.


    # Chapter 14 Identify the operating system


    ![](image_rsrc49X.jpg)


    By identifying the operating system, the system type of the target host can be
    determined. In this way penetration testers can perform vulnerability detection
    on the program of the target system in a strategic manner to save unnecessary
    wasted time. This section will introduce the method of identifying the operating
    system with significant examples.


    ### Recognition based on TTL

    `TTL` (Time To Live), this field specifies the maximum number of network segments
    that an IP packet is allowed to pass through before being discarded by the router.
    Different operating system types respond with different `TTL` values. Therefore
    users can use the `Ping` command for system identification. In order to enable
    users to quickly determine the type of a target system a list of initial `TTL`
    values of each operating system will be necessary. You can easily find them by
    a quick google search.


    #### Use-case scenario

    Use `Ping` to test the operating system type of target host `192.243.176.84`.
    The operating system type of the target host is Kali Linux. Let us find out whether
    the command can detect it or not.


    The execution command is as follows:


    ```

    root@exampleserver:~# ping -c 192.243.176.84

    ```


    It can be seen from the output information that the `TTL` value in the response
    packet is 64. It can be inferred that the host is a Linux operating system. You
    can experiment with this command on your own operating system to find out its
    value.


    #### Use-case scenario

    Use `Ping` to test the operating system type of target host `192.243.176.84`.
    The operating system type of the target host is Windows 7.


    The execution command is as follows:


    ```

    root@exampleserver:~# ping -c 192.243.176.84

    ```


    It can be seen from the output information that the `TTL` value in the response
    packet is 128. It can be explained that this is a Windows operating system.


    **Tip:** If there are too many routers from the local host to the target, the
    judgment result may not be very accurate.


    # Recognition using NMAP

    Since `TTL` is only a fuzzy judgment the result obtained may not be accurate.
    The `NMAP` tool provides a function to detect the operating system. The following
    section will introduce the use of `NMAP` to identify the operating system type.


    The syntax format of using `NMAP` to identify the operating system is as follows:


    ```

    nmap -O [target]

    ```


    Here `target` is the host address we are trying to attack for our penetration
    testing.


    #### Use-case scenario

    Use `NMAP` to detect the operating system type of target host `192.243.176.84`.

