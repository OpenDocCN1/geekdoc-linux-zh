    means letters in front, numbers in the middle, and letters behind.


    6) The following is the advanced statistics of the password string mask format:
    ￼ The above information is an advanced statistics on the password string. Among
    them, advanced statistics is to represent the password characters in the password
    file in mask format. Four mask formats are used after statistics, and each format
    consists of one? (Question mark) Add a lowercase letter to indicate a set of characters.


    The representation and meaning of these four mask formats are as follows:


    L: represents the character set of lowercase letters a to z. U: Represents the
    character set of uppercase letters A to Z. D: Represents the character set of
    numbers 0-9\. ·


    S: A collection of characters representing special symbols.


    In the mask format obtained, a mask represents one digit in the password. For
    example, the ?l?l?l?l?d?d?d?d mask format represents an 8-bit password composed
    of 4 ?l and 4 ?d. Among them, the first 4 passwords consist of lowercase letters
    a to z and the last 4 passwords consist of numbers 0-9.


    Chapter 42


    Generate a Dictionary for Password Cracking


    ![](image_rsrc4A0.jpg)


    After the user has collected enough target user information and password policy,
    a password dictionary can be created based on the obtained information. The following
    will introduce the method of generating dictionary using Crunch, rsmangler and
    rtgen tools.


    1) Use Crunch Tool


    Crunch is a password dictionary generator. It can generate a password dictionary
    according to specified rules, and users can flexibly customize their own password
    dictionary files. The following will introduce the method of using Crunch tool
    to generate dictionary file.


    The syntax format of using Crunch tool to generate dictionary is as follows: ￼


    crunch [][options]


    In the above syntax, the parameter indicates the minimum length of the generated
    password; indicates the maximum length of the generated password; indicates the
    specified character set. [options] indicates the valid options.


    Among them, the commonly used options and their meanings are as follows: ·


    -O: Specify the name of the generated password dictionary file. ·


    -B number[type]: Specify the maximum number of bytes written to the file.


    The size can be specified in KB, MB, or GB, but it must be used with the -o START
    option. ·


    -T: Set the special format used. ·


    -L: This option is used to identify some characters of the placeholder when the
    -t option specifies @,% or ^.


    The default character set provided by the Crunch tool is saved in the /usr/share/crunch/charset.lst
    file. At this point, the user can directly use these character sets to generate
    the corresponding password dictionary.


    Users can Use the cat command to view all character sets, as follows: ￼


    root@exampleserver:/usr/share/crunch


    # cat charset.lst￼


    The above output information is all the default character sets. In the output
    information, the left side of the equal sign indicates the name of the character
    set, and the right side indicates the characters used.


    Use the Crunch tool to generate a password dictionary file with a minimum length
    of 8 and a maximum length of 10, and save it to the /root/crunch.txt file.


    Among them, the character set used is hex-lower, that is, 0123456789abcdef.


    The execution command is as follows: ￼


    root@exampleserver:～# crunch 8 10 hex-lower -o /root/crunch.txt￼


    Crunch will now generate the following amount of data: 13304332288 bytes￼ 12688
    MB￼ 12 GB￼ 0 TB￼ Crunch will now 0 PB￼ crunch: 100% completed generating output


    As can be seen from the output information, a 12GB dictionary will be generated,
    with a total of 1224736768 passwords. Moreover, the progress of the generated
    password is displayed as a percentage. If the user wants to view the password
    in the dictionary, he can use the VI editor or the cat command to view it. as
    follows:


    ￼ root @ exampleserver: ~ # cat


    The above output information is the generated password. Due to the chapter, only
    a few passwords are briefly listed.


    2) Use rsmangler tool


    rsmangler is a tool for generating a dictionary based on the keywords of a word
    list. Use this tool to build a dictionary based on the information collected by
    the user and use common password construction rules.


    Among them, the grammatical format of the rsmangler tool is as follows: ￼


    rsmangler -f wordlist.txt -o new_passwords.txt


    The options and meanings in the above grammar are as follows: ·


    -F, --file: Specify the input file, that is, the password words collected by the
    user. ·


    -O, --output: Specify the name of the generated dictionary file.'
