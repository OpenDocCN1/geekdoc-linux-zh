    Use the `rsmangler` tool to generate a dictionary.


    The specific steps are as follows:


    1) Create a file to save the collected password words. Here will create a file
    named `test`, simply save two words to generate a new dictionary.


    ```bash

    root@exampleserver:～# vi test password

    ```


    (2) Use the `rsmangler` tool to generate a dictionary and save it to `pass.txt`.


    The execution command is as follows:


    ```bash

    root@exampleserver:～# rsmangler -f test -o pass.txt

    ```


    After executing the above command, no information will be output. At this point,
    the user can use the `cat` command to view the generated dictionary file as follows:


    ```bash

    root @exampleserver: ~ # cat pass.txt

    ```


    You can see the generated password dictionary from the output information. Due
    to space limitations, only some passwords are listed.


    3) Use `rtgen` tool


    The `rtgen` tool is used to generate rainbow tables. The rainbow table is a huge
    collection of possible letter combinations and pre-calculated hash values. Among
    them, the generated rainbow table includes multiple algorithms, such as `LM`,
    `NTLM`, `MD5`, `SHA1`, and `SHA256`.


    Then, using the rainbow table can quickly crack all kinds of passwords. The following
    will introduce the method of using the `rtegn` tool to generate a rainbow table.


    The syntax format is as follows:


    ```bash

    rtgen hash_algorithm charset plaintext_len_min plaintext_len_max table

    ```


    The meaning of the parameters in the above syntax is as follows:


    - `Hash_algorithm`: Specify the hash algorithm used. Among them, the values that
    can be specified include `lm`, `ntlm`, `md5`, `sha1`, and `sha256`.

    - `Charset`: Specify the character set. Among them, the default character set
    file provided by the `rtgen` tool is `/usr/share/rainbowcrack/charset.txt`, as
    follows:


    ```bash

    root @ exampleserver: /usr/share/rainbowcrack

    # cat charset.txt

    ```


    The above output information shows all character sets provided by the `rtgen`
    tool by default.


    Among them, the minimum length of the specified password is 4, and the maximum
    length is 8.


    The execution command is as follows:


    ```bash

    root@exampleserver:～# rtgen md5 loweralpha 4 8 010001000 0

    ```


    Seeing the above output information, it means that a rainbow table based on `MD5`
    has been successfully generated, the file name is `md5_loweralpha#4-6_0_1000x1000_0.rt`.


    Among them, the rainbow table is saved in the `/usr/share/rainbowcrack` directory
    by default:


    ```bash

    root@exampleserver:～# cd /usr/share/rainbowcrack/

    ```


    From the output information, we can see that the generated rainbow table file
    is `md5_loweralpha#4-8_0_1000x1000_0.rt`.


    To make it easier to use the generated rainbow table, you can use the `rtsort`
    command to sort it.


    The execution command is as follows:


    ```bash

    root@exampleserver:/usr/share/rainbowcrack# rtsort

    ```


    After executing the above command, no information will be output. Next, you can
    use the rainbow table to perform password cracking.


    ## Chapter 43: Cracking the Hash Password


    ![](image_rsrc4A0.jpg)


    ### Cracking the hash password


    In order to avoid the harm caused by information leakage, in actual application,
    the software and system will encrypt the password and then save it. Common encryption
    methods are various hash algorithms. This type of algorithm can encrypt passwords
    of different lengths into fixed-length strings. Since the encrypted string has
    a fixed length and cannot be directly reversed cracked, it has a very high degree
    of security and is therefore widely used. The method to crack the hashed password
    will be introduced below.


    ### Identify the hash encryption method


    Hash encryption is a type of algorithm, including many specific algorithms. When
    a penetration tester is cracking a hash password, if he determines the encryption
    method of the hash password, he can choose targeted tools and methods to crack
    it, which can save a lot of time and improve the efficiency of cracking. The following
    section describes how to use the `hashid` tool to identify the hash encryption
    method.


    Use the `hashid` tool below to identify the encryption method of the hash password
    value `6bcec2ba2597f089189735afeaa300d4`.


    The execution command is as follows:


    ```bash

    root@exampleserver: hashed tool MD5

    ```


    The above output information shows the possible hash password methods. Among them,
    the hash type shown in the front is more likely. It can be guessed that the hash
    type of the password is `MD2` or `MD5`.


    ### Cracking LM Hashes password


    LM (LAN Manager) Hash is one of the earliest password hashing algorithms used
    in the Windows operating system. The following will introduce the method of using
    `findmyhash` tool to crack LM Hashes password.


    The syntax format of using `findmyhash` tool to crack the password is as follows:


    ```bash

    findmyhash OPTIONS

    ```


    In the above syntax, the parameter `algorithm` indicates the type of password
    algorithm to be cracked. The supported algorithms are `MD4`, `MD5`, `SHA1`, `SHA224`,
    `SHA256`, `SHA384`, `SHA512`, `RMD160`, `GOST`, `WHIRLPOOL`, `LM`, `NTLM`, `MYSQL`,
    `CISCO7`, `JUNIPER`, `LDAP_MD5` and `LDAp_SHA1`. `OPTIONS` indicates available
    options.


    Among them, the commonly used options and their meanings are as follows:


    - `-H <hash_value>`: Specify the crackedHash value.

    - `-F`: Specify the cracked list.

    - `-G`: If the hashed password cannot be cracked, a Google search will be used.

    - `-h`: This option can only be used with `-h`.


    ```bash

    root@exampleserver:～# findmyhash MD5-h

    ```

