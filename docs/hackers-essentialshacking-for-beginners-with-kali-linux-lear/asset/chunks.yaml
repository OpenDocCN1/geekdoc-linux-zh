    BackTrack Linux is a set of professional computer security monitoring Linux operating
    system, referred to as `BT`. `BackTrack` is not only used as a surveillance platform
    (`WarDriving`), it also integrates more than 200 security penetration tools including
    `Metasploit`. In addition, numerous RFID tools and support for the `ARM` platform
    are also a bright spot. Currently, `BackTrack` has been replaced by `Kali Linux`
    and is no longer maintained.


    ## Historical versions


    `Kali Linux` has 4 version codes since its release, namely `moto`, `kali`, `sana`
    and `kali-rolling`. Among them, each version code represents a different version
    of Kali Linux. The user can update to the system of the corresponding version
    by modifying the version code in the software source.


    # Legal boundaries for penetration testers


    When implementing penetration testing, obtaining accurate written authorisation
    is very important. If it is not clear, it may cause the user to face legal proceedings,
    and more likely may go to jail for this.


    ### Obtaining legal authorisation


    When pen-testing the target host, the penetration tester first needs to obtain
    the legal authorisation given by the target owner. In this way, unnecessary legal
    disputes and other problems caused by illegal penetration testing can be avoided.


    ### Harmfulness of some operations


    During the penetration testing procedure, some operations have certain hazards,
    such as occupying system resources and leaving back doors. Therefore, the penetration
    tester needs to formally inform the target host owner of the possible impact of
    the penetration test in advance and ask the other party to confirm.


    ### Summary:


    - We provided a simple introduction to penetration testing along with different
    types of tests that are performed.

    - Penetration testing process is explained with clear introduction to all its
    stages.

    - Introduction to `Kali Linux` and its History.

    - Provided information about legal boundaries that need to be taken care seriously.


    In the next chapter, we will talk about the Installation of `Kali Linux` in both
    virtual machine and a Physical machine. Follow along!


    # Chapter 2: Installation of Kali In a Virtual Machine


    ![](image_rsrc49V.jpg)


    Previous chapter has been a good introduction to the hacking world. This chapter
    is an important resource for beginners who are struggling to create their own
    hacking environment. It is a known fact that hackers always rely on `Linux` for
    their day-to-day tasks. `Windows` and `Mac` are good productive operating systems
    but are not suitable for hackers. In this chapter, we will in depth discuss about
    the Installation of `Kali` ( A famous Hacking `Linux` distro). Let us start!


    # Download Linux image


    For installing the `Kali Linux` operating system on your computer, you need to
    obtain the image file of the system. In order to avoid data transmission errors
    during downloading, readers are also suggested to verify its integrity.


    ### How to get a mirror image of Kali Linux?


    Before obtaining the image, users need to have a simple understanding of the image
    of the `Kali Linux` system such as it''s version, architecture, desktop type.
    Then we need to choose to download the appropriate image to install in the operating
    system.


    #### 1) Mirror type


    `Kali Linux` officially provides two image files, one is a stable released version,
    and the other is a weekly updated version. Among both, the stable version is usually
    fully tested and is more convenient to use the advantage of the weekly updated
    version is that the tools included in it are of the latest version. But it''s
    flaw is that the testing is not sufficient and there maybe a risk of instability.


    #### 2) The difference in digits


    `Kali`''s official website provides images of `i386` and `amd64` architectures.
    Among them, `i386` means images that support 32-bit architecture & `amd64` means
    images that support 64-bit architecture. Therefore, when downloading mirror files,
    users need to select the corresponding mirror files according to their own system
    architecture.


    To check your own system architecture `windows` users can use the control panel
    and `Mac OS` users can check in the system preferences menu.


    **Note**: Remember that 64-bit architecture can support both 32-bit & 64-bit images.
    Whereas, 32-bit architecture can only support 32-bit supported image.


    #### 3) Desktop type


    The official website of `Kali Linux` provides 6 desktop images. These are `GNOME`,
    `E17`, `KDE`, `MATE`, `XFCE` and `LXDE` respectively. Among them, `Gnome` is the
    most common and easy-to-use desktop environment, so we recommended you to choose
    `Gnome` desktop for improving your hacking expertise. However, feel free to experiment
    with different versions and settle with the one that you feel comfortable with.


    #### 4) Download the mirror


    After the user gets a clear understanding about all the mirror files that are
    available in the official `Kali Linux` website, he can select the desired file
    to download.


    Here is a screenshot of the `Kali Linux` downloads page as of this writing.


    ### Verify Kali Linux image


    Since the installation image files are usually relatively large, the file may
    come damaged or incomplete during the download process. If the image file is damaged
    or incomplete, errors may occur during the installation process. In order to avoid
    these embarrassing situations, users can use a verification tool for verification.
    There are several websites that check the `Linux` file for it''s authenticity.


    After finding the value, compare and verify whether the obtained value and the
    value provided by the mirror file are the same. If they are the same, then it
    is confirmed that the mirror file is downloaded completely. If not, it is incomplete
    and maybe be filled with hidden malware. We suggest you to download again from
    the official website.


    In the next section, we will talk about installing `Kali linux` in a virtual machine.


    # Virtual machine installation


    A virtual machine refers to obtaining a complete computer system with complete
    hardware system functions and running in an isolated environment through software
    simulation. For a beginner, if you install the operating system directly on the
    physical machine, it may cause the system to crash or occur a data loss.


    Therefore, in order to not only learn to install the system, but also to avoid
    data loss, using a virtual machine is a better way. There are dozens of virtual
    machine software in the market. Among them, `VirtualBox` and `VMware` are two
    well-known virtual machine software available for windows. Personally, I think
    the `VMware` virtual machine is simple and easier to operate. I recommend users
    to use this virtual machine software. Next section will introduce you to install
    and create a `Kali Linux` virtual machine using `VMware`.


    ### Obtaining VMware software


    If you want to install `VMware` software, you need to obtain its installation
    package from it''s official website. It is available in both free and premium
    versions.


    To access and download the latest version of `VMware` software. [Please click
    here](http://www.vmware.com/products/workstation/workstation-evaluation)


    After visiting this address in the browser, the download interface will appear.


    From this interface, you can see `VMware Workstation Pro` products, which can
    be used under `Windows` and `Linux`. In this example, we choose to download the
    `Windows` software, so click the `Download Now` button in `Workstation 15 Pro
    for Windows`, and the `VMware` installation package will start to download. After
    the download is completed, the software package is named as `VMware-workstation-full-15.0.3-versionnumber.exe`.


    ### Install VMware


    When the `VMware` software installation package is downloaded, the user can install
    the software into the operating system. The following section will introduce how
    to install `VMware` software in `Windows`.


    Specific steps to Install `VMware` are as follows:


    1) Double-click the downloaded installation package to enter the welcome dialog
    box.

