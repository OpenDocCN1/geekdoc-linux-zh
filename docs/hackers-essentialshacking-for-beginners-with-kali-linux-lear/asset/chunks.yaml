    ### Binding process


    Meterpreter can run alone or bind with other processes. When Meterpreter runs
    as a process alone, it is easy to find. If you bind it to a process that runs
    frequently in the system, you can achieve persistence. The method of binding the
    process will be introduced below.


    ### Bind the process and capture keyboard records


    1) View the processes running in the current system.


    The execution command is as follows: ￼


    ```

    meterpreter> ps

    ```


