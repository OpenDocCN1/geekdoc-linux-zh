    4) After starting the interface, you can scan all the hosts. In the menu bar,
    select the Hosts|Scan for hosts command or press the Ctrl+S shortcut key. At this
    time, the interface shown will be displayed. ￼


    5) From the information output on this interface, you can see that a total of
    5 hosts have been scanned. If you want to view the scanned host information, select
    the Hosts|Hosts list command in the menu bar or press the Ctrl+H shortcut key.
    At this time, the interface shown will be displayed. ￼


    6) This interface displays the IP addresses and MAC addresses of the 5 hosts scanned.
    In this interface, select one of the hosts as the target system. Here select the
    192.168.29.136 host and click the Add to Target 1 button, select 192.168.29.2
    and click the Add to Target 2 button, and then you can start sniffing packets.
    In the menu bar, select Start|Start sniffing command or press Shift+Ctrl+W shortcut
    key. ￼


    7) After the sniffing is started, the important information of the target system
    is obtained by using the ARP injection attack method. To start the ARP injection
    attack, select the Mitm|ARP poisoning... command in the menu bar. At this time,
    the dialog box will be displayed. ￼


    8) Select the attack option in this dialog box, here select the Sniff remote connections
    check box. Then click the "OK" button and the interface shown will be displayed.
    ￼


    9) At this point, the man-in-the-middle attack is successfully implemented. All
    HTTP data accessed by the target user will be monitored by the attacking host.
    ￼


    10) It can be seen from this interface that the target user has logged in to the
    management interface of the router. Among them, the login user name is user and
    the password is "exampleserver". When the user stops the existing sniffing after
    obtaining the information, select the Start|Stop sniffing command in the menu
    bar. ￼


    11) After you stop sniffing, you need to stop man-in-the-middle attacks. Select
    the Mitm|Stop mitm attack(s) command in the menu bar, and the dialog box will
    be displayed. ￼


    12) Click the "OK" button in the dialog box, so that the man-in-the-middle attack
    has been successfully completed.


    The Ettercap tool provides two modes, one is a graphical interface, and the other
    is a command line mode. Users who like to use commands can also implement man-in-the-middle
    attacks through the command line mode.


    The syntax format is as follows: ￼


    ettercap [Options][Objective 1] [Objective 2]


    Use Ettercap''s command line mode to implement a man-in-the-middle attack on the
    target host 192.168.29.136.


    The execution command is as follows: ￼


    root@exampleserver:～ettercap -Tq -M arp:remote /192.168.29.136// /192.168.29.2//￼


    Seeing the similar output information above indicates that the man-in-the-middle
    attack has been successfully launched. When the attacking host sniffs the packet,
    it will output it. ￼


    What Next?


    In this chapter we gave a complete introduction to Sniffing with examples. To
    further enhance our skills in the next chapter we will talk about Social engineering
    toolkit that provides various interesting use cases for hackers. Follow along!


    Chapter 23


    Social Engineering Attacks


    ![](image_rsrc49Y.jpg)


    Social engineering attacks mainly use people''s curiosity, trust, greed and some
    stupid mistakes to attack people''s own weaknesses. Kali Linux provides a social
    engineering tool set SET, which can be used to implement social engineering attacks.
    This section will introduce methods for implementing social engineering attacks.


    # Start the social engineering toolkit-SET


    Social Engineering Toolkit-SET is an open source, Python-driven social engineering
    penetration testing tool. Using this toolkit, you can implement Web vector attacks
    and PowerShell attacks. The following section describes how to start the social
    engineering toolkit.


    The specific steps are as follows:


    1) Start SET.


    Execute the following commands in the terminal: ￼


    root@exampleserver:～# setoolkit


    After executing the above command, the following information will be output: ￼


