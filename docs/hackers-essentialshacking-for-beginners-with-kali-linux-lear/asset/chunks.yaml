    Third-party search


    If users cannot find a valid penetration test module in Metasploit, they can also
    find it from third-party websites, such as CVE vulnerability sites and exploitDB.
    In addition, Metasploit also supports importing third-party modules and implementing
    penetration testing. The following describes how to find penetration testing modules
    from these third-party websites.


    1) Find through the CVE vulnerability website


    The address of the CVE vulnerability website is https://www.cvedetails.com/. After
    successfully accessing the website in the browser, the interface shown will be
    displayed. ￼ At this point, users can search for penetration test modules by CVE
    ID, product name, manufacturer, or vulnerability type on the site page.


    For example, query Microsoft related vulnerabilities. Enter Microsoft in the search
    box, and then click the Search button to display the search results. ￼ From this
    interface, you can see the searched Microsoft related statistics. It can be seen
    from the statistical results that a total of 6328 vulnerabilities have been found.


    At this point, select the Vulnerabilities (6328) option to display the detailed
    information of the vulnerability. ￼ From this interface, you can see all the vulnerability
    information, including CVE ID, vulnerability type, release date, update date,
    and score. For example, CVE IE is CVE-2020-0879, the vulnerability type is Exec
    Code Overflow, the release date is 2020-04-09, and the update date is 2020-04-11.


    2) Find through exploitDB vulnerability website


    The address of exploitDB vulnerability website is https://www.exploit-db.com/.
    After successfully accessing the website in the browser, the interface shown will
    be displayed. ￼ Enter some keywords of the attack payload on this interface to
    search for the corresponding penetration test module. When searching, users can
    also select the Verified and Has App checkboxes to filter the verified and vulnerable
    application penetration test modules. For example, search for the penetration
    test module of the Windows system. After the search is successful, the boundary
    shown will be displayed.


    From this interface, you can see all the searched results. The output information
    includes 8 columns, indicating Date (release date), D (download penetration attack
    payload), A (available application), V (verified), Title (vulnerability title),
    Type (type) ), Platform (platform) and Author (author). Here, users can choose
    to download and view detailed information about the vulnerability. If you want
    to download the penetration test module, click the download button in column D
    ￼. If you want to view the detailed information of the vulnerability, just click
    the title of the vulnerability.


    From the description of the interface, you can see the details of the vulnerability.
    In addition, users can download some penetration testing modules from this website
    and manually import them into Metasploit.


    3) Manually import third-party modules


    Metasploit''s own modules are already very rich, but sometimes they cannot fully
    meet the needs of users. For some relatively new vulnerabilities or vulnerabilities
    without official module support, users can only manually write or import third-party
    modules. For general users, it is more convenient to use by directly importing
    third-party modules, and it is not easy to make mistakes. Therefore, the method
    of manually importing third-party modules will be introduced below.


