    3) 从此对话框可以看出，有 3 个选项分别用于连接隐藏网络、开启热点（Turn On Wi-Fi Hotspot）以及已知的 Wi-Fi 网络（Known
    Wi-Fi Networks）。在这里，点击“连接到隐藏网络 (C)...”按钮，将弹出对话框。


    4) 在此对话框中输入隐藏 Wi-Fi 网络信息后，点击“连接”按钮连接到隐藏网络。其中，`Network name` 用于指定网络名称，`Wi-Fi security`
    用于指定无线网络的安全认证/加密认证方法。


    默认情况下，系统提供 6 种认证方法，即：`WEP40/128-bit key (hexadecimal or ASCII)`、`WEP 128-bit pass
    phrase`、`LEAP`、`Dynamic WEP (802.1x)`、`WPA` and `WPA2 personal` 以及 `WPA` and `WPA2
    enterprises`。当用户选择任何加密方法时，会弹出相应的密码文本框。在本例中，连接的无线网络名称为 `Test`，加密认证方法为 `WPA-PSK/WPA2-PSK`。


    5)在此对话框中输入要连接的隐藏网络信息后，点击 `Connect` 按钮连接到相应的网络。


    # 配置 VPN 网络


    VPN 称为虚拟私有网络，属于远程访问技术。简单来说，就是利用公共网络建立私有网络进行加密通信。本节将介绍在 Kali Linux 中设置 VPN 代理网络的方法。


    ## 1) 安装 VPN 配置软件包


    安装完 Kali Linux 操作系统后，还无法配置 VPN 代理。


    添加网络连接从此界面可以看出，只能导入而不能手动添加。这是因为当前系统中没有安装与 VPN 配置相关的软件包。下节将详细介绍需要安装的几个 VPN 配置软件包。


    执行命令如下：


    ```bash

    root@exampleserver:～#apt-get install network-manager-openvpn-gnome -y

    ```


    执行完上述命令后，如果输出信息中没有报错，则说明软件包安装成功。然后重启网络管理器以使网络配置生效。


    执行命令如下：


    ```bash

    root@exampleserver:～#service network-manager restart

    ```


    执行上述命令后，将不会显示任何信息。接下来，用户就可以配置 VPN 代理了。


    提示：VPN 相关软件包必须在配置软件源后才能安装。


    ## 2) 配置 VPN 网络


    安装完上述软件包后，就可以配置 VPN 网络了。


    配置 VPN 的具体步骤如下：


    1) 打开 `Settings` 面板并选择 `Network` 选项，将显示对话框。


    2) 在对话框中，点击 `VPN` 选项右侧的加号按钮添加 VPN 网络。


    3) 从此对话框可以添加两种类型，即 `OpenVPN` 和 `Point-to-Point Tunneling Protocol (PPTP)`。在此选择
    `Point-to-Point Tunneling Protocol (PPTP)` 选项，将打开对话框。


    4) 在此界面设置 VPN 连接名称（任意名称）、服务器地址（网关框）、登录用户名和密码。设置完成后，点击 `Advanced...` 按钮，将显示对话框。


    5) 勾选 `Use Point-to-Point Encryption (MPPE) (P)` 复选框并点击 `OK` 按钮返回 VPN 连接信息配置。点击对话框右上角的
    `Add (A)` 按钮。


    6) 从此对话框可以看出，已添加名为 `VPN1` 的 VPN 网络。默认情况下，该网络尚未启用。如果你想使用该网络，需要先启动它。点击按钮将尝试连接到 VPN
    网络。连接成功后，你将在顶部菜单栏看到锁定的网络连接图标。


    # 第 6 章：在 Kali 中配置软件


    ![](img/image_rsrc49V.jpg)


    当用户安装操作系统时，如果没有选择使用网络镜像，则默认不会配置软件源。如果你使用网络镜像，则会自动配置 Kali Linux 软件源。本节将介绍如何配置软件源。


    ### 什么是软件源？


    软件源是一个应用程序安装库，其中包含了大量的应用程序。它可以是一个网络服务器、光盘（CD-ROM）甚至是硬盘上的一个目录。通过使用软件源方法，你可以快速安装所需的软件。


    下面将介绍软件源的功能和格式。


    #### 1) 软件源的作用


    通过配置软件源可以提高安装软件的效率，非常方便。用户配置软件源后，安装软件时会自动从软件源仓库下载并进行快速安装。


    #### 2) 软件源的格式


    为了配置合适的软件源，你需要了解软件源的格式。


    下节将以 Kali 官方软件源为例，介绍软件源的格式及各部分的含义如下：


    ```text

    deb http://http.kali.org/kali kali-rolling main non-free contrib own

    ```


    用户可以将这行代码分为 4 部分。这 4 部分的含义介绍如下：


    **1) deb**


    第一部分是 `deb` 或 `deb-src`。其中，`deb` 代表软件包的位置，`deb-src` 代表源码的位置。


    **2) http://http.kali.org/kali (URI)**


    第二部分代表软件下载地址（URI）。当用户在浏览器中打开该链接时，会发现它包含多个目录。以此处的镜像地址为例，打开后将显示界面。


    其中，`/dists/` 目录包含“releases”，这是获取发布版和预发布包的方式。此外，它还包含一些旧软件包和 `packages.gz` 文件。`/pool/`
    目录是软件包的物理地址。为了方便管理，`pool` 目录根据属性分为三类：`main`、`contrib` 和 `non-free`。


    然后在分类分类下，根据包名的首字母进行划分。这些目录包含的文件包括各种系统架构的二进制软件包，以及生成这些二进制包的源码包。`/project/` 目录是开发者的资源。


    **3) 版本**


    第三部分代表 Kali 的版本号。注意，这里的版本号不是某个软件的版本，而是 Kali 本身的版本。关于此项的具体表述，请参考网页 `http://http.kali.org/dists/`。目前
    Kali Linux 使用的软件源版本为 `kali-rolling`。上一章也详细介绍了 Kali 版本的历史。


    **4) 目录**


    第四部分是所有目录包含的 3 个目录。例如，进入 `kali-rolling` 目录，将看到界面。


    从显示的信息可以看出，包含 `contrib`、`main` 和 `non-free` 三个目录。


