- fmt: "\nMySQL is a relational database management system. In terms of web server\
    \ applications, MySQL database is usually the best choice for users. If the administrator\
    \ configures improperly, there may be vulnerabilities, such as weak passwords,\
    \ incorrect user rights configuration, etc. At this point, the penetration tester\
    \ can try to perform penetration testing on it. In the MSF control terminal, an\
    \ auxiliary module `mysql_login` is provided, which can be used to crack weak\
    \ passwords. The following will introduce the use of this module to implement\
    \ penetration testing on MySQL database services.\n\n### Use the `mysql_login`\
    \ module to penetrate the MySQL database service.\n\nThe specific steps are as\
    \ follows:\n\n1) Use the `mysql_login` module.\n\nThe execution command is as\
    \ follows:\n\n```\nmsf5> use auxiliary/scanner/mysql/mysql_login\nmsf5 auxiliary(scanner/mysql/mysql_login)>\n\
    ```\n\n2) View module configuration options.\n\nThe execution command is as follows:\n\
    \n```\nmsf5 auxiliary(scanner/mysql/mysql_login)> show options\n```\nModule options\
    \ (`auxiliary/scanner/mysql/mysql_login`):\n\nFrom the output information, you\
    \ can see all the configuration options parameters. Among them, there are several\
    \ options that must be configured. Next, it will be configured.\n\n3) Configure\
    \ module option parameters.\n\nThe execution command is as follows:\n\n```\nmsf5\
    \ auxiliary(scanner/mysql/mysql_login)> set RHOSTS 192.168.29.215 USERPASS_FILE\
    \ => /root/passwords.txt\n```\n\nIt can be seen from the output information that\
    \ the module option parameters have been successfully set.\n\n4) Implement penetration\
    \ testing.\n\nThe execution command is as follows:\n\n```\nmsf5 auxiliary(scanner/mysql/mysql_login)\
    \ exploit\n[＊ ] Auxiliary module execution completed\n```\n\nIt can be seen from\
    \ the output information that successive attempts to connect to the MySQL server\
    \ using the username and password in the specified username/password file. After\
    \ trying all the user names and passwords, I found a valid MySQL database user\
    \ and password. The user name is `root` and the password is `123456`.\n\n# Chapter\
    \ 31\n## Advanced Attacking using Metasploit\n\n![](image_rsrc49Z.jpg)\n\n## Penetration\
    \ attacks on PostgreSQL database services\n\nPostgerSQL is a free object-relational\
    \ database service (database management system). In some cases, users can also\
    \ use the database service to store data, such as Metasploit. The following will\
