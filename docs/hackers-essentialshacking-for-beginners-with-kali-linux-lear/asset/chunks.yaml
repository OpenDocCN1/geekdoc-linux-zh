    ![](img/image_rsrc4A0.jpg)


    无线网络安全是一种用于保护无线网络安全的相关设置。在大多数路由器中，支持三种无线加密方法，分别是 `WEP`、`WPS` 和 `WPA/WPA2`。此外，为了方便连接无线网络，用户可能不使用加密。本节将介绍这些加密方法和配置。


    ## 无密码模式


    无密码模式意味着你可以无需使用密码即可快速连接到无线网络。然而，这种模式没有安全性。下节将以 TP-LINK 路由器为例，介绍无线网络的每种加密模式。


    具体的操作步骤如下：


    1) 登录路由器的管理界面。通常，路由器的默认地址为 `192.168.1.1` 或 `192.168.0.1`。本例中的路由器地址为 `192.168.0.1`。因此，在浏览器中输入地址
    `http://192.168.0.1`，将弹出密码登录对话框。


    2) 在对话框中输入登录用户名和密码，然后点击 `登录` 显示路由器的主界面。


    3) 在左侧列选择“无线设置” | “无线安全设置”，将显示包含各种设置的界面。


    4) 从此界面可以看到所有支持的加密方法，包括 `WPA-PSK/WPA2-PSK`、`WPA/WPA2` 和 `WEP`。在此处设置无密码模式。选择“不开启无线安全”单选按钮。然后，点击底部的
    `保存` 按钮，将弹出提示对话框。


    5) 这提示用户在设置生效前重启路由器。点击 `确定` 按钮，界面底部将显示重启路由器的提示信息。


    6) 从此界面你可以看到用户已更改了无线设置，这些设置将在重启后生效。此时，点击 `重启` 选项，将弹出重启路由器的界面。


    7) 点击 `重启路由器` 按钮重启路由器。启动后，设置将生效。此时，用户无需输入密码即可快速连接到无线网络。


    在本章的下一节中，我们将通过解释几个著名的模式来介绍无线网络模式。


    # 无线网络模式


    ### a) WEP 模式


    `WEP`（无线等效隐私）可以加密在两个设备之间无线传输的数据，防止非法用户窃听或入侵无线网络。然而，该协议存在一些缺点，因此很容易受到攻击。目前很少有人使用这种加密方法。


    下面将描述 `WEP` 模式的设置方法。


    以 TP-LINK 路由器为例设置 `WEP` 加密模式。


    具体的操作步骤如下：


    1) 登录路由器管理界面。然后在左侧列选择“无线设置” | “无线安全设置”，将显示界面。


    2) 在此界面中选择 `WEP` 单选按钮，即 `WEP` 加密模式，然后用户可以设置此加密方法的认证类型、密钥格式和 `WEP` 密钥。其中，认证类型包括自动、开放系统和共享密钥。密钥格式包括
    ASCII 和十六进制。当用户选择 `开放系统`时，无线网络中的主机可以在不提供认证密码的情况下通过认证并关联无线网络。


    然而，如果你想传输数据，必须提供正确的密码。当用户选择 `共享密钥`时，无线网络中的主机必须提供正确的密码才能通过认证。否则，无法关联无线网络也无法进行数据传输。如果用户不想进行设置，可以选择
    `自动` 选项。对于 `WEP` 密钥格式，用户可以根据自己的喜好选择。设置完成后，点击 `保存` 按钮，将弹出提示对话框。


    3) 点击 `确定` 显示你已选择的所有设置的界面。


    4) 点击 `重启` 按钮显示重启路由器的界面。


    5) 点击 `重启路由器` 按钮重启路由器。路由器重启后，用户可以通过 `WEP` 加密连接到无线网络。


    ### b) WPA/WPA2 模式


    `WPA`（无线保护接入）具有两个标准，`WPA` 和 `WPA2`，是一种保护无线计算机网络安全的系统。由于 `WE` 协议存在严重缺陷，`WPA/WPA2`
    用于取代 `WEP`。尽管这种加密方法非常安全，用户仍然可以通过捕获握手包来破解密码。


    下面描述了 `WPA/WPA2` 模式的设置方法。


    具体的操作步骤如下：


    1) 登录路由器并打开无线安全设置界面。


    2) 从此界面可以看到两种 `WPA/WPA2` 加密模式。其中，`WPA-PSK/WPA2-PSK` 针对小型企业或家庭网络。`WPA/WPA2` 模式通常用于大型企业。


    然后，设置认证类型、加密算法和 `PSK` 密码。认证类型包括自动、`WPA-PSK` 和 `WPA2-PSK`。加密算法包括自动、`TKIP`（新的 `802.11n`
    不支持此加密算法）和 `AES`。选择 `自动` 选项。在此点击 `保存` 按钮。随后，根据提示重启路由器使设置生效。


    ### c) WPS 模式


    `WPS`（无线保护启动）是 WiFi 联盟组织并实施的一项项目，主要用于简化无线网络设置。通常，用户在创建无线网络时，会设置无线网络名称和加密方法以确保网络安全。当这些设置完成后，客户端连接无线网络时必须输入名称和密码。为了方便输入，你可以通过
    `WPS` 模式快速连接到无线网络。下面将介绍 WPS 模式的设置方法。


    提示：某些路由器的按钮显示为 `WPS`，有些显示为 `QSS`。


    具体的操作步骤如下：


    1) 登录路由器并选择无线安全选项，将显示界面。


    2) 从此界面可以看到 `QSS` 功能状态为关闭，即 `WPS` 功能未启用。在此，点击 `开启 QSS` 按钮启动 `WPS` 功能。点击 `开启 QSS`
    按钮后，将显示重启路由器的提示对话框。


    3) 点击 `确定` 显示重启功能的界面。


    4) 点击 `重启` 按钮显示重启路由器的对话框。


    5) 重启路由器后，你可以看到 `WPS` 功能已成功启用。


    6) 从此界面可以看到 `QSS` 功能已启用。因此，`WPS` 模式已成功启动。下一步，用户可以通过按下 `WPS/QSS` 键快速连接到无线网络。


