    个逃逸模块。接下来，用户可以使用这些 payload 进行渗透测试。


    ## 初始化 Metasploit


    在 Kali Linux 中，Metasploit 主要使用 PostgreSQL 数据库存储数据。因此，在使用 Metasploit 框架时，你需要启动
    PostgreSQL 数据库。


    执行命令如下： ￼


    ```

    root@exampleserver:～# service postgresql start

    ```


    此外，启动 PostgreSQL 数据库后，你还需要使用 `msfdb init` 命令来创建并初始化数据库。


