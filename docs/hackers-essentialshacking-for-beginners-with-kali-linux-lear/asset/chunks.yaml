    Chapter 3


    Installation of Kali in a Physical Machine


    ![](image_rsrc49V.jpg)


    While Virtual machines are quite popular among the industry they are still not
    used by majority of hackers for various reasons. It is evident that physical machine
    installation of Kali Linux is as important to understand as the Virtual machine
    installation. This is the reason we included a separate chapter for your better
    understanding. Let us learn now.


    Why is Physical machine installation necessary?


    Most users feel that the operation in the virtual machine is not very real, and
    sometimes the operation in the virtual machine is not smooth. If you want to experience
    the feeling of using a physical machine to implement penetration testing, you
    need to install the Kali Linux operating system on the physical machine. To install
    an operating system on a physical machine, you need to prepare the installation
    medium and partition the hard disk in advance. Otherwise, due to operating errors,
    hard disk data loss may occur. This section will introduce the method of installing
    the operating system on a physical machine.


