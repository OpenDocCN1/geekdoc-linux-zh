    For your understanding, here is an example that will introduce the installation
    of the Nessus tool in the Kali Linux x64 system. As Kali Linux is a Debian supported
    system the `.deb` format is selected here along with the 64-bit architecture package.
    After selecting and clicking the installation package on the download page, a
    dialog box for accepting the license agreement will pop up.


    ### 3) Click the "I Agree" button to accept the license agreement. At this point,
    the installation package will start to download. If all goes well within next
    few minutes, you can install the Nessus tool.


    The execution command is as follows:


    ```bash

    root@exampleserver:～# dpkg -i Nessus-Versionname-debian6_amd64.deb

    ```


    This command will compile the `.deb` file and will start the Nessus server in
    the system. You can then start Nessus Scanner by typing the following code on
    the Linux terminal


    ```bash

    /etc/init.d/nessusd start

    ```


    Then go to `https://exampleserver:8834/` to configure your scanner according to
    your requirements. If all goes well you will observe an output information indicates
    that the Nessus software package is installed successfully. Nessus is usually
    installed in the `/opt/nessus` directory by default. It can be seen from the above
    output information that the user can enter `https://exampleserver:8834/` in the
    browser to access the Nessus service and perform vulnerability scanning.


    Remember that you need to replace your system user name at the "example server"
    instance.


    ### 4) Start the Nessus service.


    After installing the Nessus service, it is not started by default. Therefore,
    if you want to use this program to perform scanning, you must first start the
    Nessus service.


    The execution command is as follows:


    ```bash

    root@exampleserver:～# /etc/init.d/nessusd start

    ```


    The following output will be displayed


    ``````

    Starting Nessus….

    ```


    Seeing the above output information indicates that the Nessus service started
    successfully.


    ### 5) Activate Nessus service


    Before using Nessus, you must activate the service to use it. To activate the
    Nessus program, an activation code is required. The following section will introduce
    the method of activating Nessus service.


    To activate Nessus the specific steps need to be followed:


    1. Obtain the Nessus activation code. [Click here] to enter the webpage that provides
    the Nessus activation code. When the user successfully visits the address in the
    browser, a dialog box for obtaining the activation code will be displayed.


    2. Click the Register Now button under the Nessus Home page, and the dialog box
    that is mandatory to be filled up will appear on the screen.


    3. Fill in the registration information required to obtain the activation code
    in this dialog box, such as user name and email address. After filling in, click
    the Register button and you will receive an email in the registered mailbox. After
    entering the mailbox of your designated e-mail address, you can see an activation
    code in the email.


    4. In the Next step, user can use the activation code to activate the Nessus service.
    At this point, enter the address `https://exampleserver:8834/` or `https://hostname:8834/`
    in the browser to access the Nessus service. After successful access, the interface
    will be displayed that the connection is not secure.


    **Note:** When accessing the Nessus service, the `https` protocol is used instead
    of `http`.


    This is shown because Nessus is a secure link (using hypertext transfer protocol),
    so you need to add trust before allowing login. After adding click the Advanced
    button, and a risk warning message will be displayed.


    5. After analysing the existing risks that are provided click on the “Add Execption”
    button, and then Add Security Exception dialog box will pop up.


    Click the Confirm Security Exception button so that the Create Account dialog
    box will be displayed for starting to utilize the Nessus software capabilities.


    6. This dialog box requires the creation of an account to manage the Nessus service.
    This happens because it is your first time to use and no account has been created
    yet. Create a user account on this interface and set a password. Then click the
    Continue button.


    7. Enter the activation code obtained from the email on this interface. Then,
    click the Continue button to initialise the Nessus service.


    8. If you can observe from this interface the plug-in will start being downloaded.
    After downloading, it will be initialised. Since this process will download a
    large number of plug-in files, it will take a long time, and users need to wait
    patiently. When the initialisation is complete, the login interface of Nessus
    will be displayed.


    9. Enter the account and password created earlier in this interface to log in
    to the Nessus service. After logging in, users can use Nessus to scan for various
    vulnerabilities.


    ## What Next?


    In the next chapter we will talk about configuring Nessus and using it for scanning
    vulnerabilities. Follow along!


    # Chapter 19

    ## Configuring and Attacking using Nessus


    ![](image_rsrc49Y.jpg)


    Before using Nessus to perform vulnerability scanning, you need to create a new
    scanning strategy and a scanning task. In order to successfully scan for various
    vulnerabilities later, the following section will introduce the method of creating
    new strategies and scanning tasks.


    # Create a new strategy


    For the same type of target, the scan operation performed each time is basically
    the same. In order to simplify the setup operation, Nessus provides a scanning
    strategy. The scanning policy specifies what actions need to be performed during
    the scan. Nessus provides multiple strategy templates. Users can create their
    own scanning strategies based on these templates.


    To create a new strategy follow the specific steps shown below:


    1. Log in to the Nessus service. Enter `https://exampleserver:8834/` in the address
    bar of the browser, and the login interface of Nessus will be displayed.


    2. Enter the user name and password created earlier in this interface, and then
    click the Sign In button. The main interface of Nessus will be displayed to start
    creating your custom strategy.


    3. Select the Policies option in the left column, and the policy interface that
    is available will be displayed.


    4. Click the New Policy button in the upper right corner, so that the policy template
    interface will be displayed.


    5. Select the type of policy template to be created in this interface. Among them,
    if UPGRADE information is displayed in the icon, it means that the home version
    is not available to be used. Click here to select the Advanced Scan policy template,
    so that the setting dialog box for the new policy will be displayed.


    6. Set the policy name and description information (optional) in this dialog box.
    The policy name should be named according to the task that is being performed.
    Then click the Plugins tab, and the vulnerability plug-in selection dialog box
    will be displayed.


    7. All plug-in programs are displayed in this dialog box. From this dialog box,
    you can see that these plug-in programs are all activated by default. In order
    to be able to scan for more vulnerabilities, it is recommended to enable all plug-ins.


    If there is a specific target system, you can choose to enable the corresponding
    vulnerability plug-ins, which can further save scanning time and network resources.
    In the dialog box, click the Disable All button in the upper right corner to disable
    all started plug-in programs. Then, set the required plug-in program to start.
    Such as manually starting the Debian Local Security Checks and Default Unix Accounts
    plug-in program.


    8. After the user has set the vulnerability plug-in to be used, click the Save
    button to see the created scanning strategy.


    9. From the interface, you can see the newly created strategy, indicating that
    the strategy has been created successfully. You can use this to attack different
    hosts and scan vulnerabilities that are often undetected manually.


    # New scan task

