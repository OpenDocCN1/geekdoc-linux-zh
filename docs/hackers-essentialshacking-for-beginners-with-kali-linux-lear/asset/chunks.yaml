    从输出信息可以看出，攻击主机的 IP 地址为 `192.168.29.134`，MAC 地址为 `00:0c:29:79:95:9e`。


    接下来，按照如下方式检查其 ARP 缓存表：￼


    ```

    root@exampleserver:～# arp

    ```


    从输出信息中，我们可以看到攻击主机只有一个网关 ARP 记录。此外，网关的 MAC 地址为 `00:50:56:f1:40:cb`。


    ### 3) 检查目标主机的 IP 地址和 ARP 缓存表。


    首先按照如下方式检查目标主机的 IP 地址：￼


    ```

    root@exampleserver:～# ifconfig

    ```


    从输出信息可以看出，目标主机的 IP 地址为 `192.168.29.135`，MAC 地址为 `00:0c:29:6c:5d:69`。


    接下来，按照如下方式检查 ARP 缓存表：￼


    ```

    root@exampleserver:～# arp

    ```


    从输出信息中可以看出，也只有一个绑定到网关的 ARP 条目。通过查看地址信息可以确定攻击主机尚未与目标主机通信过。此时，只要这两个主机进行通信，它们就会请求对方的
    IP 和 MAC 地址。此时，就可以对它们实施 ARP 攻击。


    ### 4) 对目标主机实施 ARP 攻击。


    执行命令如下：￼


    ```

    root@exampleserver:～# arpspoof -i eth0 -t

    ```


    从输出信息可以看出，攻击主机正在向目标主机发送 ARP 响应包，告诉目标主机网关的 MAC 地址为 `00:c:29:79:95:9e`（攻击主机的 MAC
    地址）。然而，网关的 MAC 地址实际上 `00:50:56:f1:40:cb`。这表明目标主机已开始被 ARP 欺骗。


    ### 5) 对网关实施 ARP 攻击。


    执行命令如下：￼


    ```

    root@exampleserver:～# arpspoof -i eth0 -t

    ```


    从输出信息可以看出，攻击主机正在向网关发送 ARP 响应包，告诉网关目标主机的 MAC 地址为 `00:c:29:79:95:9e`（攻击主机的 MAC 地址）。然而，目标主机的实际
    MAC 地址为 `00:0c:29:6c:5d:69`。这说明网关已实施 ARP 欺骗。


    **提醒**：用户可以使用一个命令同时对目标主机和网关进行 ARP 攻击。


    执行命令如下：￼


    ```

    root@exampleserver:～# arpspoof -i eth0 -t 192.168.29.135 -r

    ```


    从输出信息可以看出，攻击主机向目标主机和网关发送了 ARP 响应包，告诉网关和目标主机它们的 MAC 地址均为 `00:c:29:79:95:9e`。


    ### 6) 按照如下方式检查目标主机的 ARP 缓存表：￼


    ```

    root@exampleserver:～# arp

    ```


    从输出信息中，你可以看到主机有两个 ARP 记录（网关和攻击主机的 ARP 条目）。从显示的 ARP 条目可以看出，网关和攻击主机的 MAC 地址是相同的。这表明目标主机已成功被
    ARP 欺骗。


    ## 2) 使用 Ettercap 工具


    Ettercap 是一种基于 ARP 地址欺骗的网络嗅探工具，主要适用于交换机局域网。本节将介绍使用 `Ettercap` 工具实施中间人攻击的方法。


    具体步骤如下：


    ### 1) 启动 Ettercap 工具。


    执行命令如下：￼


    ```

    root@exampleserver:～# ettercap -G

    ```


    执行上述命令后，将显示界面。￼


    ### 2) 此界面是 Ettercap 工具的初始界面。接下来，通过捕包实施中间人攻击。在菜单栏中选择 `Sniff|Unified sniffing`
    命令或按下 `Ctrl+U` 快捷键。此时`Ctrl+U` 将显示对话框。


    ### 3) 在此对话框中选择网络接口。在这里选择 `eth0`，然后点击“OK”按钮，将显示所示界面。￼


    ### 4) 启动界面后，可以扫描所有主机。在菜单栏中选择 `Hosts|Scan for hosts` 命令或按下 `Ctrl+S` 快捷键。此时将显示相应的界面。￼


    ### 5) 从此界面的输出信息中可以看出，共扫描了 5 台主机。如果你想查看扫描的主机信息，在菜单栏中选择 `Hosts|Hosts list` 命令或按下
    `Ctrl+H` 快捷键。此时将显示相应的界面。￼


    ### 6) 此界面显示了扫描到的 5 台主机的 IP 地址和 MAC 地址。在此界面中，选择一个主机作为目标系统。在这里选择 `192.168.29.136`
    主机并点击 `Add to Target 1` 按钮，选择 `192.168.29.2` 并点击 `Add to Target 2` 按钮，然后就可以开始攻击。

    ```

