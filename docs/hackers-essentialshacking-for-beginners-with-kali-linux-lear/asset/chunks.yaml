    2) Online query


    Users can also search for subdomains by online query techniques. Among them, the
    popular address for online query of subdomain names is to visit the following
    website (https://phpinfo). When the user successfully visits the address in the
    browser, the interface that asks for the domain name will be displayed.


    Enter the domain name to be queried in the text box. Then, click the "Start" button
    to find the corresponding subdomain. For example, we can find the different subdomain
    names of the domain name wikipedia.com.


    All subdomains that are available for wikipedia.com will be displayed instantly.


    What Next?


    By now you are quite aware of the techniques to find subdomains and understanding
    the properties of a particular domain. However, it is important to know that often
    administrators and developers restrict their information to be accessed by anonymous
    users ( i.e penetration testers). So, it is important to not rely completely on
    domain analysis.


    In the next chapter, we will counter this problem by introducing the procedure
    of discovering servers for your hacking procedure. Follow along!


    Chapter 12


    Discover servers


    ![](image_rsrc49X.jpg)


    Although the domain name is convenient for people to remember, the computers in
    the network can only know each other''s IP addresses. Therefore, you need to query
    the corresponding host based on the domain name. In the domain name server, different
    hosts are identified through domain name records, such as A records, MX records,
    and NS records. Among them, A record represents a host; MX record represents a
    mail server; NS represents a DNS server. Each domain name record contains an IP
    address. The user can determine the IP address corresponding to the domain name
    by detecting the domain name server. The method to discover the server will be
    described below with valid instructions for your understanding. Follow along!


    1) Use Dnsenum tool


    Dnsenum is a domain name information collection tool. It can guess possible domain
    names through Google or dictionary files, and can effectively perform reverse
    queries on a network segment. It can also query the host address information,
    domain name server and mail exchange records of the website.


    The syntax format of using this tool to collect domain name information is as
    follows:


    dnsenum -w


    The option -w in the above syntax indicates that the WHOIS query is implemented
    within the scope of the network.


    Use-case scenario:


    Use Dnsenum to enumerate the information of the subdomain name wikipedia.com.


    The execution command is as follows:


    root@exampleserver:～# dnsenum -w wikipedia.com


    If you input the above code in terminal you can see that the IP address of the
    subdomain www.wikipedia.com has been obtained.


    2) Use Nslookup tool


    Nslookup is a command tool issued by Microsoft for detecting and troubleshooting
    DNS servers. This tool can be used to query DNS records to verify whether the
    domain name resolution is normal. In the event of a network failure, the tool
    can also be used to diagnose network problems. By implementing domain name resolution,
    the IP address of the corresponding server can be obtained.


    The syntax format of the tool is as follows:


    nslookup domain


    In the command, the parameter domain is used to specify the domain name to be
    queried.


    Use-case scenario:


    Use Nslookup to resolve the domain name www.wikipedia.com.


    The execution command is as follows:


    root@exampleserver:～# nslookup www.wikipedia.com


    Server: 192.123.8.1 Address: 192.342.43.2 #53


    Non-authoritative answer: Name:www.wikipedia.com Address: 54.123.131.876


    From the output information, we can see that the domain name www.wikipedia.com
    was successfully resolved. From the displayed results, we can see that the addresses
    corresponding to this domain name are 192.123.8.1 and 192.342.43.2.


    When using Nslookup to perform domain name query, the default query is A record.
    Users can also use settype=value to specify the value of the domain name record
    in the interactive mode. The specified domain name record value can be A, NS,
    MX, CNAME, PTR, etc.


    For example, you can use Nslookup to obtain the NS name server record of the domain
    name wikipedia.com, as follows:'
