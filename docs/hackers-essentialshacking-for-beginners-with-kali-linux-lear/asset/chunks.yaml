    Kali Linux provides two versions of Python by default, namely Python 2 and Python
    3\. pip can install Python 2 dependencies. If you want to install dependent packages
    for Python 3, you need to use the pip3 command. However, the pip3 command is not
    installed by default. Therefore, if you want to install dependent packages for
    Python 3, you need to install the pip3 command first.


    The execution command is as follows:


    root@exampleserver:～# apt-get install python3-pip


    After executing the above command, if no error is reported, the pip3 command is
    installed successfully. Next, you can install the dependencies of Python 3\. For
    example, packages that the KickThemOut tool depends on need to be installed using
    pip3.


    The following will demonstrate the use of pip3 to install the packages that the
    KickThemOut tool depends on.


    The execution command is as follows:


    root@exampleserver:～/kickthemout# pip3 install scapy-python3 python-nmap netifaces


    The above process downloads and installs the packages that the KickThemOut tool
    depends on. From the last line of information, you can see that the above dependent
    packages have been successfully installed.


    c) Execute Perl script


    When users execute Perl scripts, they may encounter the problem of missing Perl
    modules. At this point, the user needs to use the cpan command to install, and
    then execute the corresponding script.


    For example, to use the third-party tool 7z2hashcat, the Compress::Raw::Lzma component
    is required. I


    n this case, you need to use the cpan command to install the component. The cpan
    tool is included in the perl-doc package, so you need to install the perl-doc
    package first. The execution command is as follows:


    root@exampleserver:～# apt-get install perl-doc


    d) Execute Shell script


    Shell script execution is relatively simple, users only need to add execution
    permissions. For example, here is a Shell script named test.sh, and the script
    will be executed with executable permissions added below.


    (1) Add executable permissions. The execution command is as follows:


    root@exampleserver:～# chmod + x test.sh


    After executing the above command, there will be no information output.


    (2) Execute the test.sh script. as follows:


    root@exampleserver:～# ./test.sh


    or


    root@exampleserver:～# sh test.sh Hello World!


    You can see that a line of information is output, indicating that the test.sh
    script was successfully executed.


