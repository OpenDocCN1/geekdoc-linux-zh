    # Install GRUB


    Some users who often install multiple systems may know that there is a GRUB location
    problem during installation. In the previous operating systems, the user had to
    manually set the location of GRUB to the root partition of the system. However,
    it is different in Windows 7/8/10, and users do not need to set it manually. Because
    these systems are currently booted by GRUB, the user can directly choose to install
    the boot to the MBR format hard disk.


    ## How to Select the installation location of GRUB?


    The grub boot-loader can be changed by using simple techniques and steps. We certainly
    suggest you to not mess up with boot loader if you are not understanding what
    you are doing.


    The specific steps are as follows:


    1) Open the GRUB installation setting dialog box to make changes according to
    your convenience..


    2) At this point, ask if you want to install GRUB on the MBR. Select the "Yes"
    radio button, and then click the "Continue" button. Immediately a dialog box for
    setting GRUB installation location will be displayed.


    3) From the dialog box, you can see that there are two hard disks to install GRUB.
    However, it is recommended to choose the choice of `/dev/sda` (the first hard
    disk). Then, click the "Continue" button to continue installing the operating
    system.


    With this, simple procedure you will no longer have to deal with the GRUB boatload
    error that often can cause headaches.


    # Chapter 4: Introducing Kali Linux features


    ![](image_rsrc49V.jpg)


    In the previous chapter we have introduced different methods to install Kali Linux
    in both virtual and physical systems. Before starting to learn about different
    tools that Linux comes with it it is important to understand the functionalities
    of Kali as an operating system. Learn about its terminal and network capabilities
    can improve your productivity while pen testing. A lot of the sections that are
    described in this chapter needs access to the Kali system for better understanding.
    So, make sure that you are having a Kali Linux operating system on your computer
    while reading this book.


    # Kali Linux in Depth


    If you configure the Kali Linux system then you need to have a simple understanding
    of the system, such as the use of the menu bar, file management, system settings.
    This section will introduce the common operations of Kali Linux system.


    ## Command menu


    A large number of penetration testing tools are provided in Kali Linux. These
    tools are classified into different categories such as information collection,
    vulnerability analysis, Web programs. The user can see all the categories by selecting
    the "Application" tab on the graphical interface.


    From this starting interface, you can see that the application includes 14 categories.
    Moreover, each category has definite subcategories. Out of all the softwares available
    some tools are run on the graphical interface while some run on the command line.
    For tools running on a graphical interface, it is more convenient to start them
    through a menu command. For the tools running on the command line, it is often
    not available or possible to enter from the menu command and must be executed
    in the terminal. Therefore, it is not recommended to enter the tool from the command
    line. Always make sure that you refer individual doc format of tools for both
    GUI and CLI commands.


    ## File tool


    The File tool is used to manage files in a graphical interface. If you want to
    perform file management, you need to be very clear about the file system structure.
    Otherwise, you may face the problem of not being able to find the location of
    the file. Linux system is different from Windows system. Unlike windows it does
    not store files by drive letter. There is only one root partition in the Linux
    system, and all files are in the root directory. In order to facilitate users
    to better manage files, first we will in detail explain the file system structure
    of the Linux system.


    The file system structure under Linux is a tree, and the entry of it is the file
    directory under the `/(root)` tree structure. No matter which version of the Linux
    system, there are these directories, which are standardised directories. There
    will be some small differences between various Linux distributions, but overall
    they are similar. When users try to understand the structure of the Linux file
    system, they may not know the division of these files very well due to its complexity.


    There are several important directories in Linux such as:


    1) Home Directory


    Every user under Linux has a home directory, which stores the user''s files. Among
    them, the location of the user file is `/home/username`. However, the home directory
    of a super user is different from that of an ordinary user. The home directory
    of a super user is `/root`, which is also called the home directory. When the
    user opens the terminal, the location is the home directory of the user who logs
    in to the system. In addition, each ordinary user can only access his own home
    directory. However, the administrator can access the home directories of all users.
    This is why hackers always try to hack the privileges of an administrator as there
    can be more ways to exploit the system.


    2) Root Directory


    The root directory is the entry of the file system and is called the highest level
    directory. Every file and directory starts from the root directory, and only the
    root user has write permissions under this directory.


    3) Several other important folders


    In addition to the two directories mentioned above, there are several important
    folders that users need to understand, such as `/etc`, `/bin`, `/sbin`, etc.


    Here is a small introduction about them:


    * `/bin`: The commands required by the basic system are the commands required
    by the minimal system, such as `ls`, `cp`, `mkdir`, etc. The files in this directory
    are executable and can be used by general users.


    * `/sbin`: This directory is mainly used to store system management commands.
    It is the place where the executable commands of the super-privileged user root
    are stored. Ordinary users have no permission to execute the commands in this
    directory. This directory is similar to the `/usr/sbin` or `/usr/local/sbin` directory.
    Just remember that everything contained in the sbin directory can only be executed
    with root privileges.


    * `/etc`: Store configuration files of system programs or general tools.


    * `/usr`: This is the directory where the system stores programs, such as commands
    and help files. There are many files and directories in this directory. When a
    user installs a software package officially provided by a Linux distribution,
    most of them are installed here. If there are server configuration files involved,
    the configuration files will be installed in the `/etc/` directory.

