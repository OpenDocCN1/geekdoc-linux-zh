    # 第 17 章


    ## 理解漏洞


    ![](img/image_rsrc49Y.jpg)


    你可能经常听到“漏洞”这个词。2018 年，当勒索软件攻击发生时，搜索“漏洞”一词的人数剧增。尽管它是开发者和技术爱好者之间的流行词，但仍有 80%每天使用技术的人并不了解漏洞及其影响。作为一名黑客，理解漏洞的重要性是你的首要任务。本章将为你详细介绍漏洞。请看下去！


    # 什么是漏洞？


