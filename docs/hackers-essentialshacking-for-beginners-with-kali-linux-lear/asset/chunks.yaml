    \ 攻击向量\n\nWeb 攻击向量会刻意构建对目标具有可信度和吸引力的网页。当目标用户访问网页时，可以窃取目标用户的信息。社会工程攻击工具可以克隆与实际运行的信任站点看起来完全相同的网页，让受害者认为他们正在浏览合法的站点。本节将介绍使用社会工程实施\
    \ Web 攻击向量的方法。\n\n### 使用 SET 实施 Web 攻击向量\n\n具体步骤如下：\n\n1) 启动社会工程工具并选择社会工程攻击。\n\
