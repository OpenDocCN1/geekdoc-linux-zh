    \ `Google` 服务器，但地址栏中请求的 URL 仍是 `http://www.google.com/`。此时，当目标用户输入登录信息登录 `Google`\
    \ 服务器时，登录信息将被攻击主机捕获，捕获的信息将显示在终端上，如下：\n\n```\n192.168.29.135--[18/Apr/2019 16:17:51]\n\
    ```\n\n从上面的输出信息可以看出，生成的文件保存在此处（此处原文不完整，通常指路径）。操作将返回 Webattack 菜单。\n"
