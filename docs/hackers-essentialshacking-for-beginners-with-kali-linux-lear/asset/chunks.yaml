- fmt: '

    Win32Disk Imager tool is mainly used to write ISO/img files to SD card or USB
    card. For most people nowadays, the method of installing a system using a CD is
    rarely used. Moreover, today''s computers basically don''t come with an optical
    drive. Therefore, using a U disk to install the operating system is the most convenient
    and quick way. If you want to use a U disk to install the system, you need to
    make the U disk as an installation disk. At this point, you need to use the Win32Disk
    Imager tool to achieve. The tool is not installed in the system by default, so
    you need to install the tool first. The following section will introduce the specific
    installation method.


    The specific steps are as follows:


    1) Download the software package from the website `https://sourceforge.net/projects/win32diskimager/`.
    The software package is named `Win32DiskImager-1.0.0-install.exe`.


    2) Install Win32Disk Imager tool. Double-click the downloaded software package
    and the license agreement dialog box will be displayed.


    3) This dialog box shows the license information for installing Win32Disk Imager
    tool. Select the `I accept the agreement` radio button and click the `Next` button.
    A dialog box for selecting the target installation location will be displayed.


    4) This dialog box is used to select the installation location of the Win32Disk
    Imager tool. By default, it will be installed in the `C:\Program Files(x86)ImageWriter`
    directory. If the user wants to re-specify the installation location, you need
    to click the `Browser` button to set it. Then, click the `Next` button, and a
    dialog box for setting the folder of the startup menu bar will be displayed.


    5) This dialog box is used to set the folder name in the startup menu bar. Here
    use the default setting `Image Writer`, and click the `Next` button, so that the
    dialog box for selecting additional tasks will be displayed.


    6) Set whether or not to create a shortcut in this dialog box. In order to start
    the program conveniently, it is recommended that the user creates a shortcut.
    Select the `Create a desktop shortcut icon` check box and click the `Next` button
    so that the ready to install dialog box will be displayed.


    7) This dialog box displays the detailed information set before, and it will be
    ready to install Win32DiskImager. If you need to modify the settings, you can
    click the `Back` button to return to modify the settings. Otherwise, you need
    to click the `Install` button to start installing the tool. After the installation
    is completed, a dialog box for completing the setup wizard will be displayed.


    8) From this dialog box, you can see that the Win32Disk Imager tool has been installed.
    Click the `Finish` button to automatically start the tool. If the user does not
    want to start the tool directly, you can deselect the `Launch Win32DiskImager`
    checkbox. If you select the `View README.txt` check box, the `README.txt` file
    will be opened. This file shows detailed information about the Win32Disk Imager
    tool, such as functions, architecture descriptions, common problems, etc.


    # Make USB installation disk


    Through the previous section introduction, the Win32Disk Imager tool has been
    installed in the system. Now you can use this tool to make a USB installation
    disk. When writing the disc image, the U disk will be formatted. Therefore, you
    need to make sure that the data in the U disk has been backed up. The specific
    method for installation will be introduced below.


    ## Use Win32Disk Imager tool to make a USB installation disk


    Note that in order to avoid operation failure due to insufficient disks, the U
    disk must have enough space. Here, it is recommended that the minimum space of
    the U disk is `4GB`.


    The specific steps are as follows:


    1) Insert the U disk that made the installation disk into the current system and
    make sure it has been correctly identified. Then, start the Win32Disk Imager tool.


    2) As you can see from this dialog box, the Win32Disk Imager tool has automatically
    identified the removable disk `F`. Then click the button to import the Kali Linux
    ISO image file.


    3) From this dialog box, you can see that the image file of the Kali Linux system
    is selected. Then, in order to make sure that there is no problem with the produced
    installation media, verification is required here. Select the `SHA256` option
    from the `Check Value` drop-down list, and then click the `Generate` button. After
    a while, you will see the `SHA256` check value of the file. If the value is the
    same as the one provided on the official website, then the image file is complete.
    Otherwise, there may be problems.


    4) You can see the generated check value from this dialog box. After comparing
    with the value provided by the official website, it can be confirmed that the
    image file is complete. At this point, click the `Write` button, so that the dialog
    box will be displayed.


    5) This dialog box prompts whether or not you are sure to write data to disk `F`.
    Click the `Yes` button here to start writing data. When the data writing is completed,
    the `write successful` dialog box will pop up.


    6) Click the `OK` button to return to the dialog box that appears. Click the `Exit`
    button in this dialog box to exit the program. Next, the user can use the USB
    installation disk to install the Kali Linux operating system on the physical machine.


    Note: After writing the Kali Linux system image, the partition format of the U
    disk becomes `Ext4`. The file format cannot be recognised by Windows, so it will
    prompt that the U disk cannot be accessed normally and requires formatting. Just
    ignore the error message here.


    # Prepare Kali Linux hard disk partition


    For most users, they like to use the Windows operating system, but they also want
    to experience the use of Kali Linux to implement penetration testing on a physical
    machine. At this requirement, the best solution is to install dual systems.


    If you want to install a dual system, you need to prepare the hard disk partition
    for installing the Kali Linux system. If the hard disk partition is not prepared,
    it may cause damage to the original system or erase important files in a partition
    due to misoperation.


    Therefore, for safety reasons, choosing a separate hard disk or separate partition
    to install the Kali Linux system is the best choice. If the user has a separate
    hard disk to install the system, just install the system directly. If there is
    no separate hard disk, you need to split the existing disk to create a separate
    partition for installing the operating system. The following section will introduce
    the method of preparing to install the hard disk partition of the Kali Linux system.


    The following section will introduce the method of compressing the volume to divide
    a separate partition to install the Kali Linux operating system.


    The specific steps are as follows:


    1) Right-click the `Computer` icon on the desktop and select the `Manage` command
    to open the `Computer Management` interface.


    2) Select `Storage` | `Disk Management` option in the left column, so that the
    disk management interface will be displayed.


    3) From this interface, you can see that there are two disks in the current system,
    `disk 0` and `disk 1`. Moreover, both disks have only one partition, and the disk
    partition letters are `C` and `E`. Among them, the operating system is installed
    in `disk 0`. So, choose `Disk 1` here and divide it into a `100GB` partition.
    Here, select `E` partition and right-click and a menu will pop up.


    4) Select the `compressed volume (H)...` command, so that the compressed space
    setting dialog box will be displayed.


    5) The available compressed space is displayed in this dialog box. Set the compressed
    space size to `102400MB` here, and click the `Compress` button. When the compression
    is successful, you can see the divided free disk space.


    6) It can be seen from this interface that a `100GB` partition has been successfully
    divided in `Disk 1`. In the next step, the user can install other operating systems
    to the partition.


    # Set the first startup item

