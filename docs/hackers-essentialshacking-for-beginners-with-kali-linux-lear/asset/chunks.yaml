    # Configure VPN network


    VPN is called as a virtual private network, which belongs to remote access technology.
    Simply put, it is to use a public network to set up a private network for encrypted
    communication. The following section will introduce the method of setting up a
    VPN proxy network in Kali Linux.


    ## 1) Install the software package for VPN configuration


    After the Kali Linux operating system is installed, the VPN proxy cannot be configured.


    Add network connection As you can see from this interface, it can only be imported,
    and cannot be added manually. This is because there is no relevant software package
    for VPN configuration installed in the current system. The following section will
    section introduce several VPN configuration software packages that need to be
    installed.


    The execution command is as follows:


    ```bash

    root@exampleserver:～#apt-get install network-manager-openvpn-gnome -y

    ```


    After executing the above command, if no error is reported in the output information,
    it means that the software package is installed successfully. Then restart the
    network manager to make the network configuration take effect.


    The execution command is as follows:


    ```bash

    root@exampleserver:～#service network-manager restart

    ```


    After executing the above command, no information will be displayed. Next, the
    user can configure the VPN proxy.


    Tip: VPN related software packages can be installed only after the software source
    is configured.


    ## 2) Configure the VPN network


    After installing the above software packages, you can configure the VPN network.


    The specific steps to configure a VPN are as follows:


    1) Open the `Settings` panel and select the `Network` option, so that the dialog
    box will be displayed.


    2) In the dialog box, click the plus button on the right side of the `VPN` option
    to add a VPN network.


    3) Two options can be added from this dialog box, namely `OpenVPN` and `Point-to-Point
    Tunneling Protocol (PPTP)`. Select the `Point-to-Point Tunneling Protocol (PPTP)`
    option here, and the dialog box will open.


    4) Set the name of the VPN connection (any name), server address (gateway text
    box), login user name and password on this interface. After setting, click the
    `Advanced...` button, and the dialog box will be displayed.


    5) Select the `Use Point-to-Point Encryption (MPPE) (P)` check box and click the
    `OK` button to return to the configuration VPN connection information. Click the
    `Add (A)` button in the upper right corner of the dialog box.


    6) As you can see from this dialog box, a VPN network named `VPN1` has been added.
    By default, the network is not yet enabled. If you want to use this network, you
    need to start it first. Click the button so that it will try to connect to the
    VPN network. After the connection is successful, you will see a locked network
    connection icon in the top menu bar.


    # Chapter 6: Configure software in Kali


    ![](image_rsrc49V.jpg)


    When users install the operating system, if they do not choose to use network
    mirroring, the software source will not be configured by default. If you use network
    mirroring, the Kali Linux software source will be configured by default. This
    section will introduce how to configure the software source.


    ### What is a software source?


    The software source is an application installation library, and a large number
    of application software are in this library. It can be a network server, CD-ROM
    or even a directory on the hard disk. By using the software source method, you
    can quickly install the required software.


    The function and format of the software source will be introduced below.


    #### 1) The role of software sources


    By configuring the software source, the efficiency of installing the software
    can be improved and it is very convenient. After the user configures the software
    source, the software will be automatically downloaded from the software source
    warehouse when installing the software and can be installed quickly.


    #### 2) The format of the software source


    You need to understand the format of the software source in order to configure
    a suitable software source.


    The following section will take Kali official software source as an example to
    introduce the format of the software source and the meaning of each part as follows:


    ```text

    deb http://http.kali.org/kali kali-rolling main non-free contrib own```


    Users can divide this line of code into 4 parts. The meanings of these 4 parts
    are introduced as follows.


    **1) deb**


    The first part is `deb` or `deb-src`. Among them, `deb` represents the location
    of the software package, and `deb-src` represents the location of the software
    source code.


    **2) http://http.kali.org/kali(URI)**


    The second part represents the download address (`URI`) of the software. When
    the user opens the link in the browser, he will find that it contains several
    directories. Let''s take the mirror address in this example as an example. After
    opening, the interface will be displayed.


    Among them, the `/dists/` directory contains "releases", which is the formal way
    to obtain Kali releases and pre-releases packages. Moreover, some old packages
    and packages.gz files are still in it. The `/pool/` directory is the physical
    address of the software package. In order to facilitate management, the `pool`
    directory is classified according to attributes and divided into three categories:
    `main`, `contrib`, and `non-free`.


    Then, under the classification, file by the first letter of the source package
    name. The files contained in these directories include binary software packages
    that run on various system architectures, and source code packages that generate
    these binary software packages. The `/project/` directory is a resource for most
    developers.


    **3) Version**


    The third part represents the version number of Kali. Note that the version number
    here does not refer to the version number of a certain software, but the version
    number of Kali itself. For the specific wording of this item, please refer to
    the content on the webpage `http://http.kali.org/dists/`. Currently, the software
    source version used by Kali) Linux 2019 is `kali-rolling`. The previous chapter
    also introduced the history of Kali version in detail.


    **4) Catalogs**


    The fourth part is the 3 catalogs included in all catalogs. For example, enter
    the `kali-rolling` directory, you will see the interface.


    From the information displayed, you can see that there are three directories including
    `contrib`, `main`, and `non-free`.


    Among them, the meaning of each directory content is as follows:


    *   `main`: The most basic and main software in Debian that complies with free
    software specifications.

    *   `contrib`: The software in this directory can be run in Debian. Even though
    it is free software, it is mostly dependent on non-free software.

    *   `non-free`: Software that does not belong to the category of free software.


    Add software source

