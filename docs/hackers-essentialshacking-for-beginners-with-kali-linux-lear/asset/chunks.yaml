    6) At this time, the collected information is sorted out. In order to facilitate
    analysis and view more intuitively, users can associate the relationship between
    them through connecting lines. For example, use a cable to connect the host IP
    address and port here. Click the mouse near the IP address entity (`192.243.176.84`),
    a line will be extended, and then click the port entity. At this time, a dialog
    box will pop up.


    7) The information in this dialog box is used to set the connecting line, such
    as `Label`, `Color`, `Style` and `Thickness`. Here you will set the label of the
    line to `port` and the color to `red`, and can use the default values for other
    options.


    8) Click the `OK` button so you can see the added connection line.


    9) It can be seen from this interface that the relationship between the IP address
    entity and the port entity has been successfully established. Using the same method,
    users can connect the relationships between other entities with connecting lines,
    and mark entity information with tags.


    10) From this interface, the collected information can be seen more intuitively,
    and it is more convenient to use. At this point, users can also use `Transforms`
    provided by `Maltego` to collect more information, such as IP owner information,
    network information, and historical information.


    ### Organize and analyze domain name information


    By analysing the previously collected information, we can know the collected domain
    name WHOIS information, subdomain name, and server information. The following
    section will organize and analyze domain name information by using `Domain` entities.


    Use the `Maltego` tool to organise and analyse domain name information.


    The specific steps are as follows:


    1) Open a new chart in `Maltego` to avoid confusion with the previous information.
    Click the new chart button.


    2) From this interface, you can see that a new graph is opened, and its name is
    `New Graph(2)`. Select `domain` entity here (`Domain`) to organise and analyse
    domain name information. Select the `Domain` entity in the entity panel and drag
    it to the chart, and then modify the domain name of the entity to `wikipedia.com`.


    3) By analysing the information collected above, we can see that the WHOIS information,
    subdomain name and server information of the domain name have been obtained. For
    example, here are the subdomains of the domain name `wikipedia.com`. Among them,
    the entity used to represent the subdomain name is `DNS Name`. Therefore, select
    the `DNS Name` entity in the entity list and drag it to the chart, and then modify
    the entity name to the corresponding subdomain name.


    4) From this interface, you can see the organised subdomain information. Similarly,
    the user can use the cable to connect them.


    5) From this interface, you can see that the collected domain names are organised.
    Moreover, all subdomains corresponding to the domain name `wikipedia.com` can
    be seen intuitively. At this time, users using `Maltego`''s `Transform` can also
    collect more information about the domain name and subdomain names, such as domain
    name registrar, subdomain name, and WHOIS information.


    ### Use Transform to collect information


    `Maltego` provides a large number of `Transforms`, which can be used to collect
    more information. The following will take the domain name entity as an example
    to get more information.


    Use `Transform` to collect information about the domain name `wikipedia.com`.


    The specific steps are as follows:


    1) Select the `Domain` entity and drag it to a new chart, and modify the domain
    name to `wikipedia.com`.


    2) Select the domain name entity and right-click, a list of all available `Transforms`
    that will be displayed.


    3) From this interface, you can see the `Transform` sets that can be used for
    domain name entities, such as `Shodan`, `ThreatMiner`, and `Farsight DNSDB`. If
    the user wants to view all `Transforms`, click the `All Transforms` option to
    see all `Transforms`. If you want to view a certain `Transform` set, click the
    corresponding `Transform`. Click the `All Transforms` option here to expand the
    list of all `Transforms`.


    4) At this time, the user can select any `Transform` to obtain the corresponding
    information. For example, use the `To Domain[Find other TLDs]` `Transform` to
    find other top-level domains of the domain name.


    With this, we have completed a brief introduction to `Maltego` and it’s innovative
    and effective abilities to analyse information. Module two comes to an end with
    this chapter. In the next module of this book we will enhance our hacking skills
    by learning about Vulnerability scanning and Sniffing attacks. We recommend you
    to become thorough with the first two modules before jumping on to the third one.


    All the best and the third module is waiting for you!


