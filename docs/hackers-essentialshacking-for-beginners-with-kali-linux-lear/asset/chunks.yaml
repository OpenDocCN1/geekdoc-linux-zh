    # 基础域名信息


    当一个域名被注册时，它包含一些基础信息，例如域名是否已注册、域名注册商、域名所有者等。通过检查域名的 `WHOIS` 信息，你可以轻松地获取该域名的基础信息。下节节将介绍如何使用
    `WHOIS` 和其他常用工具获取域名的基础信息。


    人们常说，域名分析是渗透测试人员在分析目标之前首要的常规工作。


    ## 1) 使用 WHOIS 工具


    `WHOIS` 工具用于查找并显示指定账户（或域名）的相关信息。


    使用该工具查询域名信息的语法格式如下：


    ```

    whois [domain name]

    ```


    使用场景：


    使用 `WHOIS` 工具查询域名 `wikipedia.com` 的相关信息。


    执行命令如下：


    ```

    root@exampleserver:～# whois wikipedia.com

    ```


    在终端中输入上述命令后，你就可以看到与域名 `wikipedia.com` 相关的 `WHOIS` 信息了。


    ## 2) 使用 DMitry 工具


    `DMitry` 是一个集成的信息收集工具。渗透测试人员通常使用该工具来收集 `WHOIS` 主机 IP 和域名信息、子域名、域名中包含的电子邮件地址等。


    其中，使用该工具获取 `WHOIS` 信息的语法格式如下：


    ```

    dmitry -w [domain]

    ```


    此处 `-w`：对指定的域名执行 `WHOIS` 查询。而 `domain` 是我们试图攻击并查找其信息的主机。


    使用场景：


    使用 `DMitry` 工具查询域名 `wikipedia.com` 的 `WHOIS` 信息。


    执行命令如下：


    ```

    root@exampleserver:～# dmitry -w wikipedia.com

    ```


    通过在 linux 终端中使用上述命令，将成功获取与域名 `wikipedia.com` 相关的 `WHOIS` 信息。


    # 查找子域名


    子域名也被渗透测试人员视为一个域名。在域名系统层次结构中，它通常属于一个更高级别的域名。例如，`www.wikipedia.com` 和 `forum.wikipedia.com`
    是 `wikipedia.com` 的两个子域名，需要理解的是 `forum.wikipedia.com` 是顶级域名 `wikipedia.com` 的子域名。


    通常情况下，子域名名会包含主机名。例如，在 `www.wikipedia.com` 域名中，`.com` 是顶级域名，`wikipedia.com` 是一级域名。`www`
    是用于标识服务器的主机名。因此，由 `wikipedia.com` 建立的服务器是 `www.wikipedia.com`。众所周知的是，通过查找子域名，可以找到对应的主机。下文将通过详细示例描述查找子域名的方法。


    ## 1) 使用 Dmitry 工具


    可以使用 `Dmitry` 工具来查找子域名。然而，该工具使用 Google 搜索引擎来查找子域名。如果你访问的是被 Google 列入黑的网站，有时可能并不可靠。因此，请确保你的域名与
    Google 搜索兼容。


    使用 `Dmitry` 工具查找子域名的语法格式如下：


    ```

    dmitry -s -o

    ```


    上述语法中的选项及其含义如下：

    - `-S`：执行子域名查询。

    - `-O`: 指定保存输出结果的文件。


    使用场景：


    使用 `Dmitry` 工具查找域名 `wikipedia.com` 的子域名。


    执行命令如下：


    ```

    root@exampleserver:～# dmitry -s -o wikipedia.com

    ```


    通过在 linux 终端中使用上述命令，将成功获取与域名 `wikipedia.com` 相关的信息。


    ## 2) 在线查询


    用户也可以通过在线查询来搜索子域名。其中，将显示域名。使用在线工具时，你可以找到一个域名的子域名。理解域名的属性是非常重要的。


