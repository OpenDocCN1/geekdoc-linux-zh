    5) From this interface, you can see that a small dialog box pops up, showing that
    the Subterfuge installation is complete. At this point, click the `Finish` button
    to complete the installation.


    The following section will take the Firefox browser as an example to demonstrate
    the installation of the software package in the `tar.bz2` package format.


    The specific steps are as follows:


    1) Download the Linux version of the Firefox browser software package.


    In this example, the downloaded package name is `Firefox-latest-x86_64.tar.bz2`.


    Tip: When downloading the Firefox browser software package, you must choose according
    to the user''s hardware architecture. In this example, the 64-bit architecture
    package is downloaded.


    2) Unzip the software package.


    The execution command is as follows:


    ```

    root@exampleserver:～# tar jxvf Firefox-latest-x86_64.tar.bz2-C /usr

    ```


    After executing the above command, all files in the Firefox software package will
    be decompressed to the `/usr` directory. Among them, the decompressed file name
    is `firefox`.


    3) Switch to the decompressed `firefox` directory and you will see an executable
    file named `firefox`.


    This executable file is used to start the Firefox browser. as follows:


    ```

    root@exampleserver:～# cd /usr/firefox/ root@exampleserver:/usr/firefox

    ```


    From the results displayed above, you can see the executable file `firefox` is
    used to launch the browser.


    # Executing the software


    When the user successfully installs the software into the system, the tool corresponding
    to the software can be started. Among them, some software can be started by command
    or graphical interface, and some software is started using the executable script.
    This section will introduce the startup methods of these two types of software
    respectively.


    ## General software


    Generally, the way to start common software is by using command line and graphical
    interface. In addition, the Kali Linux system also provides `Alt+F2` shortcut
    keys to open a command prompt dialog box. Users can enter any command to be executed
    in this dialog box. Several startup methods of common software will be introduced
    below.


    ### a) Graphical interface mode


    The graphical interface method is to start through the menu command. The following
    section will take Wireshark software as an example to introduce its startup method.


    1) In the graphical interface, select "Applications"|"sniffing/spoofing"|`Wireshark`
    command in turn.


    2) After selecting the `Wireshark` command here, the software can be successfully
    run.


    Seeing this interface indicates that Wireshark has started successfully. Next,
    the user selects the network interface and can use the software to capture data
    packets.


    ### b) Command line mode


    The command line method is there to execute through the terminal. The following
    section will take the Metasploit framework as an example to introduce the method
    of using the command line to start the software.


    Start Metasploit terminal mode and execute the command as follows:


    ```

    root@exampleserver:～# msfconsole

    ```


    From the output information, you can see that the command line prompt is displayed
    as `msf5 >`. This shows that the Metasploit tool was successfully launched.


    ### c) Command line prompt


    The user can use the command line prompt to run some software that runs from the
    terminal, and it runs in interface mode. In this way, there is no need to occupy
    a terminal window. The following will take DirBuster software as an example to
    introduce the method of using the command line prompt to start the software.


    The specific steps are as follows:


    (1) Use the `Alt+F2` shortcut to start the command line prompt.


    (2) Enter the command to start the software in this interface. Then, press the
    Enter key to start the tool.


    Seeing this interface means that the DirBuster software has been successfully
    started.


    # Execute script


    In Kali Linux system, some software needs to be started by script after installation.
    Among them, the most common executable scripts are Python, Ruby, Perl and Shell.
    For some scripts, libraries or modules may also need to be installed. The following
    section will introduce several common execution script startup methods.


    ### a) Execute Ruby script


    When the user is executing Ruby scripts, Ruby library files may be missing. At
    this time, the user needs to install the corresponding library using the `gem
    install` command.


    Among them, the syntax format for installing Ruby library files is as follows:


    ```

    gem install [package]

    ```


    Then, use the `ruby` command to execute its Ruby script. as follows:


    ```

    root@exampleserver:～# ruby hello.rb Hello World.

    ```


    ### b) Execute Python script


    When users execute Python scripts, they may encounter the problem of missing dependency
    packages. At this time, the user can use the `pip install` command to install
    the corresponding dependency package. Only then can its Python script be executed.


    For example, `polenum` is a Python script that can use Python''s `impacket` library
    to obtain password policies from the Windows kernel security mechanism. However,
    the script depends on `impacket` `0.9.11` version of the library. So, if you want
    to use `polenum` tool, you must install `impacket` `0.9.11`.


    The execution command is as follows:


    ```

    root@exampleserver:～# pip install impacket==0.9.11

    ```


    From the last line of the above output, you can see that the `impacket-0.9.11`
    package has been successfully installed. Next, the user can use the `polenum`
    tool.


    Kali Linux provides two versions of Python by default, namely Python 2 and Python
    3. `pip` can install Python 2 dependencies. If you want to install dependent packages
    for Python 3, you need to use the `pip3` command. However, the `pip3` command
    is not installed by default. Therefore, if you want to install dependent packages
    for Python 3, you need to install the `pip3` command first.


    The execution command is as follows:


    ```

    root@exampleserver:～# apt-get install python3-pip

    ```


    After executing the above command, if no error is reported, the `pip3` command
    is installed successfully. Next, you can install the dependencies of Python 3.
    For example, packages that the `KickThemOut` tool depends on need to be installed
    using `pip3`.


    The following will demonstrate the use of `pip3` to install the packages that
    the `KickThemOut` tool depends on.


    The execution command is as follows:


    ```

    root@exampleserver:～/kickthemout# pip3 install scapy-python3 python-nmap netifaces

    ```


    The above process downloads and installs the packages that the `KickThemOut` tool
    depends on. From the last line of information, you can see that the above dependent
    packages have been successfully installed.


    ### c) Execute Perl script


    When users execute Perl scripts, they may encounter the problem of missing Perl
    modules. At this point, the user needs to use the `cpan` command to install, and
    then execute the corresponding script.


    For example, to use the third-party tool `7z2hashcat`, the `Compress::Raw::Lzma`
    component is required. In this case, you need to use the `cpan` command to install
    the component. The `cpan` tool is included in the `perl-doc` package, so you need
    to install the `perl-doc` package first. The execution command is as follows:


    ```

    root@exampleserver:～# apt-get install perl-doc

    ```


    ### d) Execute Shell script


    Shell script execution is relatively simple, users only need to add execution
    permissions. For example, here is a Shell script named `test.sh`, and the script
    will be executed with executable permissions added below.


    (1) Add executable permissions. The execution command is as follows:


    ```

    root@exampleserver:～# chmod +x test.sh

    ```


    After executing the above command, there will be no information output.


    (2) Execute the `test.sh` script. as follows:


    ```

    root@exampleserver:～# ./test.sh

    ```


    or


    ```

    root@exampleserver:～# sh test.sh Hello World!

    ```


    You can see that a line of information is output, indicating that the `test.sh`
    script was successfully executed.

