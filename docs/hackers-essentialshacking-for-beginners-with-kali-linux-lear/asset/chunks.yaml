    From the above output information, we can see that the target host has visited
    the `mail.126.com` website. Moreover, you can see that the user name submitted
    by the user is `testuser@126.com`, and the password is encrypted.


    # Quick analysis of network data


    When users use `Wireshark` to capture data packets, they can use `Xplico` tools
    to quickly analyze their data. `Xplico` tool can quickly find out the content
    of the webpage address, picture and video requested by the user. The following
    will introduce the method of using `Xplico` tool to analyze network data.


    # Install and start Xplico service


    Kali Linux does not install `Xplico` tools by default. Therefore, before using
    the tool, you need to install the tool.


    The execution command is as follows:


    ```bash

    root@exampleserver:～# apt-get install xplico

    ```


    After executing the above command, if no error is reported, the installation is
    successful. Next, you need to start the service before you can use it.


    The execution command is as follows:


    ```bash

    root@exampleserver:～# service xplico start

    ```


    After executing the above command, no information is output. Because `Xplico`
    is a web service-based tool. Therefore, the user also needs to start the Web service.


    The execution command is as follows:


    ```bash

    root@exampleserver:～# service apache2 start

    ```


    Now, users can access `Xplico` services. The default listening port of the `Xplico`
    service is `9876`.


    The user can check the listening port to determine whether the `Xplico` service
    is successfully started. details as follows:


    ```bash

    root@exampleserver:～# netstat -anptul | grep 9876

    tcp6 0 0 :::9876

    ```


    From the information output above, we can see that TCP port `9876` is being monitored.
    This shows that the `Xplico` service started successfully.


    The specific steps are as follows:


    1) Visit the `Xplico` server in the browser at `http://IP:9876/`. After the access
    is successful, the login interface of the `Xplico` service will be displayed.


    2) This interface is used to log in to `Xplico` services. The default username
    and password of the `Xplico` service are both `xplico`. After entering the user
    name and password to successfully log in to `Xplico`, the interface shown will
    be displayed.


    3) You can see from this interface that there is no content. By default, there
    are no cases and sessions in `Xplico` service. You need to create a case and session
    before you can analyze the capture file. First create a case, select the `New
    Case` option in the left column and the interface will be displayed.


    4) Two options for analyzing data are provided here, namely `Uploading PCAP capture
    file/s` and `Live acquisition`. Among them, the `Uploading PCAP capture file/s`
    option means uploading the `PCAP` capture file and analyzing it. The `Live acquisition`
    option means real-time online capture and analyzing data packets. Here will analyze
    the captured data packets, select the `Uploading PCAP capture file/s` radio button.
    Then, specify the case name. In this example, set the case name to `TCP`, and
    then click the `Create` button, the interface will be displayed.


    5) From this interface, you can see that the case has been created successfully,
    and the newly created case is displayed in the list. Click the newly created case
    name `TCP` to view the sessions in the case.


    6) From this interface, you can see that there is no session information, and
    then create a session. Select the `New Session` command in the left column and
    the interface will be displayed.


    7) Enter the name of the session you want to create in the `Session name` text
    box on this interface, and then click the `Create` button to create the session.
    After the creation is successful, the interface will be displayed.


    8) From this interface, you can see that a new session named `Web` has been created.
    Now enter the session, you can load the capture file and analyze it. Click the
    session name `Web`, and the interface shown will be displayed.


    9) This interface is used to display the detailed information of the captured
    file. No capture file has been uploaded yet, so click the `Select File` button
    to select the capture file to be analyzed, and then click the `Upload` button
    to upload the capture file. After the upload is successful, the interface will
    be displayed.


    10) From the `Session Data` part of the interface, you can see the time and status
    of the uploaded capture file. From the `Status` line information, you can see
    `DECODING COMPLETED`. Moreover, you will now see the number of each type of data
    packet corresponding to the capture file. The interface displays 15 types, such
    as `HTTP`, `MMS`, `Emails`, `FTP-TFTP-HTTP file`, `Web Mail`, etc. In this interface,
    you can see that some packet information is displayed in the `HTTP` type. For
    example, view information about visited sites. Select the `Web|Site` command in
    the left column, and all the links requested in the capture file will be displayed.


    11) In this interface, the `HTTP` information of `Html` type is displayed by default.
    Users can also view the images (`Image`), video (`Video`) and `Flash` animation
    in the request link. For example, here you can open a requested webpage at will.


    12) From this interface, you can see the video played by the target user. For
    example, view thumbnails requested by target users. Select the `Web|Images` command
    in the left column to see all the image content.


    13) Click `Image` under the picture in this interface, the picture will be displayed
    in the browser. If you click `Page`, the web page where the picture is located
    will be displayed. For example, here click `Page` to open a `Page` page.


