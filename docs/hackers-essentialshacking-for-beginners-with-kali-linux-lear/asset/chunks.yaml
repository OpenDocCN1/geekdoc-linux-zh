  trans: '


    使用 `Nmap` 识别服务版本的语法格式如下：


    ```

    nmap -sV [host]

    ```


    上述语法中的选项 `-sV` 意味着实现服务版本检测。


    ### 使用场景：

    识别目标主机 `192.243.176.84` 上所有开放的服务及其版本。


    执行命令如下：


    ```

    root@exampleserver:～# nmap -sV 192.243.176.84

    ```


    可以从输出信息中看到识别出的服务相关信息。输出信息包含 4 列，分别为 `PORT`（端口）、`STATE`（状态）、`SERVICE`（服务）和 `VERSION`（版本）。通过分析每一列信息，你可以获取有关对应服务的相关信息。例如，`TCP`
    端口 21 对应的服务是 `FTP`，版本为 `FileZilla ftpd`。你还可以从倒数第二行看到目标主机的主机名为 `TEST-PC`，操作系统类型为
    `Windows`。


    # 使用 Amap 工具


    Amap 是一组用于识别网络服务的渗透测试工具，包括 `amap` 和 `amapcrap` 两个工具。其中，`amap` 工具用于尝试识别在非常规端口运行应用程序，而
    `amapcrap` 工具通过发送触发包并在响应字符串列表中查找响应，基于非 ASCII 编码来识别应用程序。


    本节将介绍如何使用 Amap 工具识别服务信息。


    ### 1) 使用 amapcrap 工具


    `amapcrap` 工具可以向 `UDP`、`TCP` 或 `SSL` 端口发送随机数据以获取非法响应信息。获取到的信息将写入 `appdefs.trig`
    和 `appdefs.resp` 文件中，方便 Amap 检测的下一步。


    使用该工具识别服务信息的语法格式如下：


    ```

    amapcrap -n -m <0ab> [host][port] -v

    ```


    这里 `-V` 代表详细模式（verbose mode）。


    ### 使用场景：

    使用 `amapcrap` 工具探测 90 端口的应用程序。


    执行命令如下：


    ```

    root@exampleserver:～# amapcrap -n 20-ma 192.198.153.84 90 -v

    ```


    从显示的结果中，我们可以了解到获取的信息被写入了 `appdefs.trig` 和 `appdefs.resp` 触发文件中。当用户使用 Amap 工具识别服务时，这两个文件将用于用于获取信息。


    ### 2) 使用 amap 工具


    `amap` 工具可以尝试识别在异常端口运行的一些应用程序。


    使用该工具识别服务信息的语法格式如下：


    ```

    amap -bqv [host][port]

    ```


    ### 使用场景：

    使用 `amap` 工具扫描目标主机 `192.243.176.84` 上的 80 端口服务。


    执行命令如下：


    ```

    root@exampleserver:～# amap -bqv 192.243.176.84 80

    ```


    从输出信息中，你可以了解到匹配 80 端口的服务是 `http` 或 `http-apache2\.`。从显示的识别信息可以看出，运行在目标主机上的 Web
    服务是 `Apache`，版本为 `2.2.8\.`。在输出的前 3 行中，你可以看到 `amap` 工具使用了两个触发文件和一个响应文件。其中，文件名分别为
    `appdefs.trig`、`appdefs.resp` 和 `appdefs.rpc`。


    # 收集服务信息


    某些特殊服务可以提供额外信息。例如，`SMB` 服务可以提供文件系统结构，而 `SNMP` 服务可以提供目标主机相关信息。本节将解释如何使用这些服务为你的目标渗透测试信息收集收集有价值的信息。


    ### SMB 服务


    `SMB`（Server Message Block）是一种用于在计算机之间共享文件、打印机、串口等的 IBM 协议。`SMB` 协议可以运行在 `TCP/IP`
    之上，也可以运行在其他网络协议（如 `NetBEUI`）之上。通过获取 `SMB` 服务的共享文件夹信息，你可以了解目标主机的文件系统结构。本节将介绍使用
    `smbclient` 工具访问 `SMB` 服务的共享文件夹信息。


    `smbclient` 是 `SMB` 服务的客户端工具，可访问 `SMB` 服务中的共享文件。


    `smbclient` 工具的语法格式如下：


    ```

    root@exampleserver : smbclient -L -U <username></username>

    ```


    上述语法中的选项和含义如下：

    `-L`: 用于指定 `SMB` 服务器地址。

    `-U`: 用于指定登录 `SMB` 服务的用户名。


    ### 使用场景：

    在 Linux 系统中访问 `SMB` 服务。


    执行命令如下：


    ```

    smbclient -L 192.243.176.84 -U root Enter WORKGROUP\root''s password:

    ```


    输入 `SMB` 服务用户的登录密码将显示需要大量分析的信息。


    从输出信息中，你可以看到共享的文件。从输出信息中，你可以看到共享的文件。`Share` 代表共享名称，`Type` 代表类型，`Comment` 是描述。目标操作系统是
    `Linux`。如果目标操作系统是 `Windows`，将显示驱动器号。


    ```

    root@exampleserver:# smbclient -L 192.243.176.84 -U

    ```


    可以看到共享磁盘。


    ### SNMP 服务


    `SNMP`（简单网络管理协议）由一组网络管理标准组成，包括应用层协议和资源对象。该协议用于网络管理系统监控网络设备的状态。通过使用该服务可以获取主机信息。本节将介绍如何使用
    `snmpcheck` 工具获取主机信息。


    `snmpcheck` 工具可以用于枚举 `SNMP` 设备以获取信息。


    该工具的语法格式如下：


    ```

    snmpcheck [target]

    ```


    ### 使用场景：

    使用 `snmpcheck` 工具通过 `SNMP` 协议获取 `192.243.176.84` 主机信息。


    执行命令如下：


    ```

    root@exampleserver:～# snmpcheck 192.243.176.84

    ```


    连接成功后，可以获取主机的系统信息。


    由于上述命令带有大量的输出信息，理解每个部分都很重要。


    1. 我们可以获取系统信息，如主机名、操作系统类型和架构。

    2. 我们可以获取账户信息。

    3. 获取网络信息，如 `TTL` 值、`TCP` 段和数据元素。

    4. 获取网络接口信息，如接口状态、速度、`IP` 地址和子网掩码。

    5. 获取网络 `IP` 信息。

    6. 获取路由信息，如目的地址、下一跳地址、子网掩码和路径长度。

    7. 获取监控的 `TCP` 端口。

    8. 获取监控的 `UDP` 端口信息。例如，监控的 `UDP` 端口可以是 `123`、`154`、`6300`、`300` 和 `5322`。

    9. 我们可以获取网络服务信息，如分布式组件模型服务、`DHCP` 客户端和 `DNS` 客户端。

    10. 我们可以获取进程信息，如进程 ID、进程名和进程类型。

    11. 获取存储信息，如设备 ID、设备类型和文件系统类型。

    12. 获取文件系统信息，如索引、挂载点、远程挂载点和访问权限。

    13. 获取设备信息，如设备 ID 号、类型和状态。

    14. 获取软件组件信息，如 `.Net` 框架、`Visual C++2008` 等。


    '
- fmt: '

    With this, we have completed an important part of the information gathering procedure
    during penetration testing. With all this acquired data we need to analyse them
    to obtain or create a workflow that will work. To make this procedure easy for
    you we are going to explain Maltego tool with detailed instructions. Follow along!


    # Chapter 16: Information analysis and sorting


    ![](image_rsrc49X.jpg)


    By using the methods described above, a large amount of information about the
    target host can be collected. In order to facilitate the subsequent implementation
    of penetration testing, users need to sort and analyse this information. At this
    point, users can analyse and organise the information with the help of `Maltego`
    tools. This section will introduce the use of `Maltego` tools to analyse and organise
    information.


    ## Configure Maltego


    Maltego is a very powerful information gathering tool. Not only can it automatically
    collect the required information, but it can also visualise the collected information
    and can present the results to users in a graphical way. Kali Linux has installed
    the Maltego tool by default so users can use it directly. However, before using
    the tool, you need to do a simple configuration, such as registering an account
    and selecting a startup mode. The following section will introduce the configuration
    of the Maltego tool.


    ### 1) Register an account


    When users use Maltego tools, they need to log in to its official website. Therefore,
    you need to register an account before starting the tool.


    The address of the registered account is as follows:


    https://www.paterva.com/web7/community/community.php


    When the user successfully visits the above address in the browser, the dialog
    box with field boxes will be displayed.


    Fill in the correct information in this dialog box, and select the "Perform human-machine
    authentication" check box. A picture verification dialog box will pop up. In this
    dialog box, select the corresponding picture according to the prompts, and then
    click the "Verify" button. After the verification has been successful, the dialog
    box shown for registration will be displayed.


    At this point, click the `Register!` button to complete the registration. At this
    time, you will receive an email from the mailbox you used to register your account.
    Log in to your mailbox to activate your account.


    ### 2) Set the Maltego mode


    Maltego provides two modes, namely Normal Privacy Mode (normal privacy mode) and
    Stealth Privacy Mode (concealed privacy mode). Among them, the Normal Privacy
    Mode mode can obtain more information. Moreover, users are allowed to directly
    use data on the Internet, such as physical pictures and website information. Stealth
    Privacy Mode is more used to analyse information simply, especially when the current
    computer has no network. Using this mode, it will not be possible to obtain data
    directly from the Internet. So in order to get more information, it is recommended
    to select Normal Privacy Mode. The following section will introduce the specific
    method of setting the Maltego mode.


    **Use-case scenario:**


    Set the Maltego mode to Normal Privacy Mode. The specific steps are as follows:


    1) In the menu bar of the graphical interface, select "Applications"|"Information
    Collection"|`maltego command`. In turn, the Maltego product selection dialog box
    will be displayed.


    2) The available Maltego products are displayed in this dialog box, including
    `Maltego XL`, `Maltego Classic`, `Maltego CE (Free)` and `Maltego CaseFile (Free)`.
    Among them, `Maltego XL` and `Maltego Classic` are charged whereas `Maltego CE`
    and `Maltego CaseFile` are free. Here we will select the free Maltego tool and
    click the `run` button.


    3) This dialog box displays the license agreement information. Select the `Accept`
    check box, and then click the `Next` button. The login dialog box will be displayed.


    4) Enter the previously registered account information (email address, password
    and verification code) in this dialog box to log in to the Maltego server. Then
    click the `Next` button. A dialog box will appear.


    5) This dialog box shows the result of login. From this dialog box, you can see
    the login user name, email address, and login time. Then click the `Next` button,
    a dialog box for installing Transforms will be displayed.


    6) This dialog box displays information about application services, Transforms,
    entities, and hosts to be installed. Then click the `Next` button to display another
    dialog box.


    7) In this dialog box, you can set whether to enable the automatic error report
    function or not. If you want to enable it, select the `Automatically send Error
    Reports` checkbox. If you don''t want to enable it, just click the `Next` button.
    After clicking the `Next` button, the privacy mode selection dialog box will be
    displayed.


    8) In the dialog box, select `Normal mode`, and then click the `Next` button.


    9) You can see from this step that Maltego is ready. At this point, the user can
    use the Maltego tool to collect information. There are 3 methods provided by default
    here, namely to Open a blank graph and let me play around (open a blank graph),
    Open an example graph (open an example graph) and Go away, I have done this before!.
    Here, choose the first running method `Open a blank graph and let me play around`,
    which will open the interface.


    10) Seeing this interface means that Maltego has been successfully started and
    a new chart has been opened. Next, the user can select any entity and drag it
    to the chart to analyse and organise the collected information.


    ## Using Maltego tool


    Through the previous configuration, the Maltego tool can be used normally. Users
    can use the Maltego tool to organise and analyse the previously collected information.
    Moreover, you can also use Maltego''s Transforms to get more information. A large
    number of entities are provided in Maltego to represent information nodes. For
    example, the domain name information can use the `Domain` entity to represent
    a domain name. The following section will introduce the method of using Maltego
    tools to organise and analyse information.


    ### Organise and analyse host information


    Through the previous information collection, we can know the active hosts in the
    local area network. The open ports, services and operating system are some types
    of the hosts.


    The following section will introduce the use of IP address entities to organise
    and analyse host information.


    **Use-case scenario:**


    Use the Maltego tool to organise and analyse host information. The specific steps
    are as follows:


    1) Start the Maltego tool, and the interface will be displayed.


    2) All available entities are displayed in the left column of the interface. Here,
    the IP address entity will be selected to sort out the collected host-related
    information. Select the `IPv4 Address` entity and drag it to the chart so that
    the interface will be displayed.


    3) From this interface, you can see that an IP address entity has been added to
    the chart, and the default IP address of this entity is `192.243.176.84`. At this
    point, the user can modify the address to the active host address detected by
    the user, such as `192.168.29.136`. The user can modify the address of the entity
    by double-clicking the IP address of the entity or modifying the attribute `IP
    Address` value.


    4) It can be seen from this interface that the value of the IP address entity
    has been successfully modified. At this point, the user drags and drops the `Port`
    and `Service` entities to the chart in the same way to sort out the relevant information
    of the host.


    5) From this interface, you can see the added ports and service entities. Among
    them, the port default attribute value is `0`. The service default attribute value
    is `80/Apache 9`. Users can modify entity attribute values based on the information
    they collect. By sorting out the information collected above, we can see that
    the host has 21, 22, 80, 135, and 139 open ports, and the corresponding services
    are FTP, SSH, HTTP, msrpc and netbios-ssn.

    '
