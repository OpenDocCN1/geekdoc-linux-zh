    5) 在此对话框中选择安装系统的语言，此处选择“English”（英语）选项。然后点击 `Continue` 按钮显示区域选择对话框。


    6) 在此对话框中，选择用户当前所在的区域。此处，选择默认设置“USA”。然后点击 `Continue` 按钮，将显示 `Configure Keyboard`
    对话框。


    7) 选择默认键盘格式“English-US”，然后点击 `Continue` 按钮。


    8) 在过程中，将加载一些额外的组件并配置网络。当网络配置成功后，将显示设置主机名的对话框。


    9) 在此处，将主机名设置为 `exampleserver`，并点击 `Continue` 按钮，将显示设置域名的对话框。


    10) 此对话框用于设置计算机使用的域名，用户不需要设置。此处，使用默认提供的域名 `localdomain`，并点击 `Continue` 按钮，将显示
    `Set User and Password` 对话框。


    11) 此对话框用于设置 root 用户的密码。出于安全考虑，建议设置更复杂的密码。设置完成后，点击 `Continue` 按钮，将显示磁盘分区对话框。


    12) 此对话框用于选择磁盘分区方法。此处，选择 `Wizard-Use Entire Disk`（向导使用整个磁盘）选项，并点击 `Continue` 按钮。


    13) 在此对话框中选择要分区的磁盘。当前系统中只有一个磁盘，因此在此选择该磁盘。然后点击 `Continue` 按钮。


    **Tip**：如果用户选择了显示的第二个和第三个分区，务必注意默认自动分配的磁盘空间量。特别是根分区的大小，建议该分区至少设置为 20GB。如果空间太小，安装过程中将提示安装错误。


    14) 在此对话框中，选择分区方案。默认提供 3 种方案。此处，选择 `Place all files in the same partition (recommended
    for novices)`（将所有文件放在同一分区中（推荐新手使用））选项，并点击 `Continue` 按钮。


    15) 下一个对话框显示当前的系统分区。你可以看到目前有两个区域，根区域和交换分区区域。如果用户想修改当前分区，选择 `Undo the modification
    of the partition settings`（撤销分区设置修改）重新进行分区。如果你不想修改，选择 `End Partition Setting and
    Write Modifications to Disk`（结束分区设置并将修改写入磁盘）。然后点击 `Continue` 按钮，将显示对话框。


    16) 此对话框提示是否将更改写入磁盘，即格式化磁盘。此处，选择 `Yes` 单选按钮并点击 `Continue` 按钮开始安装系统。


    17) 此时，系统开始开始安装。在安装过程中，需要设置一些信息，例如设置网络镜像。如果安装 Kali Linux 系统的计算机未连接网络，请在此界面上选择
    `No` 单选按钮并点击 `Continue` 按钮。如果选择了 `Yes` 单选按钮，将涉及网络速度和寻找合适的镜像站点等问题。为了让用户顺畅安装操作系统，建议选择
    `No` 单选按钮。然后点击 `Continue` 按钮，将出现对话框。


    **Tip**：用户安装完系统后，也可以手动配置软件源并更新包管理器。因此，选择 `No` 单选按钮不会影响其他软件的安装。


    **Tip**：如果用户选择使用网络镜像，将弹出一个带有额外信息的对话框。


    在此对话框中可以设置 `HTTP` 代理以连接外部网络。如果你不需要连接外部网络，只需点击 `Continue` 按钮，将显示 `Configure Package
    Manager` 对话框。


    18) 当软件包配置完成后，将显示 `Install GRUB to the hard disk` 对话框。


    19) 此对话框提示是否将 GRUB 引导加载程序安装到主引导记录中。选择 `Yes` 单选按钮并点击 `Continue` 按钮显示对话框。


    20) 此对话框用于设置安装引导加载程序的设备。从显示的信息中，你可以看到只有一个 `/dev/sda` 设备。因此，此处有将 GRUB 安装到 `/dev/sda`
    的选项。然后点击 `Continue` 按钮。


    如果用户需要在其他设备上安装，可以选择 `manual input device`（手动输入设备）选项并输入设备名称。


    21) 当 GRUB 引导加载程序安装完成后，将显示 `End Installation Process` 对话框。


    22) 从此对话框中，你可以看到操作系统已安装。在下一步，需要重启操作系统。点击此对话框中的 `Continue` 按钮结束安装过程并重启操作系统。


    23) 从此对话框中，你可以看到安装过程即将结束。安装完成后，操作系统将自动重启。系统启动后，将显示登录对话框。


    24) 在此对话框中输入登录系统的用户名。在此处输入超级用户 `root`，并点击 `Next` 按钮，将显示密码输入对话框。


    25) 在此对话框中，输入超级用户 `root` 的密码，即安装操作系统期间设置的密码。输入密码后，点击 `Login` 按钮。如果你成功登录系统，将看到带有额外信息的界面。


    26) 当你看到此界面时，意味着 `root` 用户已成功登录系统。从现在起，用户可以在操作系统中实施各种渗透测试。


