  trans: '


    Win32Disk Imager 工具主要用于将 ISO/img 文件写入 SD 卡或 USB 闪盘。对于现在的大多数人来说，使用 CD 刻系统的方法已经很少使用了。此外，现在的电脑基本上不再配有光驱了。因此，使用
    U 盘安装操作系统是最方便、最快速的方法。如果你想用 U 盘安装系统，你需要将 U 盘制作成安装启动盘。此时，你需要使用 Win32Disk Imager
    工具来实现这一目标。该工具默认没有安装在系统中，因此你需要先安装该工具。接下来的章节将介绍具体的安装方法。


    具体步骤如下：


    1) 从网站 `https://sourceforge.net/projects/win32diskimager/` 下载软件包。软件包名为 `Win32DiskImager-1.0.0-install.exe`。


    2) 安装 Win32Disk Imager 工具。双击下载的软件包，将显示许可协议对话框。


    3) 该对话框显示了安装 Win32Disk Imager 工具的许可信息。选择 `I accept the agreement`（我接受协议）单选按钮并点击
    `Next`（下一步）按钮。将显示选择目标安装位置的对话框。


    4) 该对话框用于选择 Win32Disk Imager 工具的安装位置。默认情况下，它将安装在 `C:\Program Files(x86)\ImageWriter`
    。如果用户想重新指定安装位置，需要点击 `Browser`（浏览）按钮进行设置。然后点击 `Next` 按钮，将显示设置启动菜单文件夹的对话框。


    5) 该对话框用于设置启动菜单中的文件夹名称。这里使用默认设置 `Image Writer`，并点击 `Next` 按钮，将显示选择其他任务的对话框。


    6)在此对话框中设置是否创建快捷方式。为了方便启动程序，建议用户创建快捷方式。勾选 `Create a desktop shortcut icon`（创建桌面快捷方式）复选框并点击
    `Next` 按钮，将显示准备安装对话框。


    7) 该对话框显示之前设置的详细信息，准备好安装 Win32Disk Imager。如果你需要修改设置，可以点击 `Back`（上退）按钮返回修改。否则，你需要点击
    `Install`（安装）按钮开始安装工具。安装完成后，将显示完成设置向导的对话框。


    8) 从此对话框中，你可以看到 Win32Disk Imager 工具已安装。点击 `Finish`（完成）按钮自动启动工具。如果用户不想直接启动工具，可以取消勾选
    `Launch Win32DiskImager` 复选框。如果你勾选了 `View README.txt`，将打开 `README.txt` 文件。该文件显示了关于
    Win32Disk Imager 工具的详细信息，例如功能、架构描述、常见问题等。


    # 制作 USB 安装盘


    通过前面的介绍，系统中已经安装了 Win32Disk Imager 工具。现在你可以使用此工具制作 USB 安装盘。在写入磁盘镜像时，U 盘会被格式化。因此，你需要确保
    U 盘中的数据已经备份。下文将介绍具体的安装方法。


    ## 使用 Win32Disk Imager 工具制作 USB 安装盘


    注意，为了避免因磁盘不足导致操作失败，U 盘必须有足够的空间。这里建议 U 盘最小空间为 `4GB`。


    具体步骤如下：


    1) 将制作了安装盘的 U 盘插入当前系统，并确保它已被正确识别。然后，启动 Win32Disk Imager 工具。


    2) 从此对话框可以看出，Win32Disk Imager 工具已自动识别可移动磁盘 `F`。然后点击按钮导入 Kali Linux ISO 镜像文件。


    3) 从此对话框中，你可以看到选择了 Kali Linux 系统的镜像文件。然后，为了确保生成的安装介没有问题，在这里需要进行验证。从 `Check Value`（校验值）下拉列表中选择
    `SHA256` ，然后点击 `Generate`（生成）按钮。过一会儿，你将看到文件的 `SHA256` 校验值。如果该值与官方网站提供的相同，则说明镜像文件完整。否则，可能存在问题。


    4) 你可以从此对话框看到生成的校验值。与官方网站提供的值对比后，可以确认镜像文件完整。此时，点击 `Write`（写入）按钮，将显示对话框。


    5) 该对话框提示是否确定向磁盘 `F` 写入数据。在此点击 `Yes`（是）按钮开始写入数据。数据写入完成后，将弹出 `write successful`（写入成功）对话框。


    6) 点击 `OK` 按钮返回出现的对话框。点击此对话框中的 `Exit`（退出）按钮退出程序。接下来，用户可以使用 USB 安装盘在物理机上安装 Kali
    Linux 操作系统。


    注意：写入 Kali Linux 系统镜像后，U 盘的分区格式将变为 `Ext4`。Windows 无法识别该文件格式，因此会提示 U 盘无法正常访问并需要格式化。在此忽略错误消息即可。


    # 准备 Kali Linux 硬盘分区


    对于大多数用户来说，他们喜欢使用 Windows 操作系统，但也想体验使用 Kali Linux 在物理机上进行渗透测试。针对这一需求，最佳解决方案是安装双系统。


    如果你想安装双系统，需要为安装 Kali Linux 系统准备硬盘分区。如果没有准备好硬盘分区，可能会由于操作不当导致原系统受损或擦除某个分区中的重要文件。


    因此，出于安全考虑，选择独立的硬盘或独立的分区来安装 Kali Linux 系统是最佳选择。如果用户有独立的硬盘来安装系统，直接安装系统即可。如果没有独立的硬盘，你需要分割现有磁盘以创建一个独立的分区来安装操作系统。接下来的章节将介绍通过压缩卷划分独立分区来准备安装
    Kali Linux 系统分区的的方法。


    下文将介绍通过压缩卷划分独立分区来安装 Kali Linux 操作系统的方法。


    具体步骤如下：


    1) 右键点击桌面上的 `Computer`（计算机）图标，选择 `Manage`（管理）命令打开“计算机管理”界面。


    2) 在左列选择 `存储` | `磁盘管理` 选项，将显示磁盘管理界面。


    3) 从此界面中，你可以看到当前系统中有两个磁盘，`disk 0` 和 `disk 1`。此外，两个磁盘都只有一个分区，磁盘分区分别为 `C` 和 `E`。其中，操作系统安装在
    `disk 0` 上。所以，在此选择 `disk 1` 并将其划分为 `100GB` 分区。在这里，选择 `E` 分区并右键点击，弹出菜单。


    4) 选择 `compressed volume (H)...` 命令，将显示压缩空间设置对话框。


    5) 此对话框显示了可用压缩空间。在此将压缩空间大小设置为 `102400MB`，并点击 `Compress`（压缩）按钮。压缩完成后，你将看到划分出的可用磁盘空间。


    6) 从此界面可以看出 `disk 1` 中已成功划分出一个 `100GB` 的分区。在下一步中，用户可以在该分区上安装其他操作系统。


    # 设置第一个启动项


    '
- fmt: '

    After the user prepares the hard disk partition and installation media, the operating
    system can be installed on the physical machine. The method of installing the
    operating system is the same as the method of installing in a virtual machine.
    However, to install the operating system on a physical machine, you need to set
    the startup item of the installation medium.


    In general, the hard disk is the first boot item. If you use a `USB` installation
    disk to install the operating system, you need to set the first boot item as a
    `USB` device. In addition, to install dual systems in a physical machine, you
    also need to pay attention to the selection of hard disk partitions and `GRUB`
    settings. If you are not careful, data will be lost. The following section will
    introduce some settings for installing the operating system on the physical machine.


    ## Set the USB device as the first startup item


    Since it is not convenient to take a screenshot on a physical machine, the following
    section will take a virtual machine system as an example to introduce the method
    of modifying the first startup item.


    The specific steps are as follows:


    1) Start the computer and enter the `BIOS` interface. The virtual machine must
    be powered off before it can enter the virtual machine. After turning off the
    virtual machine, select the `Virtual Machine` | `Power` | `Enter the firmware
    when power on` command in the menu bar.


    Note: If it is in a physical machine, the user needs to press `F2`, `F12` or `Del`
    key (different models, the keys are also different, usually the `F2` key) when
    the black background and white font interface starts to appear to enter the `BIOS`
    interface.


    2) Select the `Enter firmware when power is turned on` command to enter the `BIOS`
    main menu interface of the current system.


    3) This interface is the `BIOS` main menu interface. In this interface, the user
    uses the right arrow key to switch to the `Boot` tab, and the dialog box shown
    will be displayed.


    4) From this dialog, you can see that there are 4 options, namely `Removable Devices`,
    `Hard Drive`, `CD-ROM Drive`, `Network boot from Intel E1000 (Network)`. These
    4 options represent 4 startup methods, and the user only needs to move the first
    startup item to the first position. If you use the `CD` to start the system, use
    the down arrow key to select the `CD-ROM Drive` option, and press the `plus (+)`
    key to move the option to the first position. The setting of this dialog box means
    that the first startup item is `Removable Devices`, that is, `U` disk startup.
    After the setting is complete, save and exit the `BIOS`. Then switch to the `Exit`
    tab to the right, so that the dialog box will be displayed.


    5) This dialog box is used to choose whether or not to save the settings. Select
    `Exit Saving Changes` (save and exit the settings) option, press `Enter`, and
    the dialog box will pop up.


    6) This dialog box prompts whether or not to save the previous settings and exit
    the program. If the user confirms that the settings are ok, then click the `Yes`
    button. After clicking the `Yes` button, the system will restart. When the system
    starts, it will enter the boot interface of the `U` disk.


    7) The `U` disk in this example is the installation disk of `Kali Linux` system,
    so the interface displayed after startup is the boot interface for installing
    `Kali Linux`. At this point, the user can start installing the `Kali Linux` operating
    system. The following installation method is the same as the installation method
    in the virtual machine, and will not be repeated here.


    Reminder: All new computers come with `UEFI` firmware, and the `Secure Boot` function
    is also enabled. This feature will refuse to boot operating systems that are not
    signed by UEFS. Motherboard manufacturers generally allow users to turn off the
    `Secure Boot` function, or asks you to add a custom public key to `UEFI` to bypass
    this restriction. At this time, users need to turn off the `Secure Boot` function
    before they can boot and start their operating system normally.


    ## Set Hard Disk Partition


    If the user installs the operating system directly on a computer without any data,
    there is no need to consider about the fear of data loss. They can just install
    it directly. However, if you are installing a dual system, you need to select
    the correct formatting options during the hard disk partitioning process. When
    setting hard disk partitions, users can use automatic or manual methods. If you
    don''t know the functioning of the system partition very well, just let the system
    allocate it automatically. The famous two methods for setting hard disk partitions
    are described below for our readers with clear cut instructions. Follow along!


    ### How to Automatically partition the system?


    Partitioning is a complex procedure and is often a toolbox for system programmers.
    However, there are certain instructions for beginners to make this procedure a
    cake walk. Just follow the steps we have provided for not dealing with any errors.


    The specific steps are as follows:


    1) When the dual system is about to install in the physical machine a dialog box
    will be displayed.


    2) In the dialog box, select the `Use the largest continuous free space` option.
    If all goes well then a free space in the system will be automatically selected
    and partitioned. Then, click the `Continue` button so that the partition scheme
    dialog box will be displayed on your computer screen.


    3) As you can see from this dialog box, the disk `sdb` is automatically selected.
    As a next task, in the `Partition Scheme` information display area, select the
    `Place all files in the same partition (recommended for novices)` option, and
    then click the `Continue` button.


    4) As can be seen from this dialog box, two Linux partitions are automatically
    created on the `sdb` disk, namely the `swap` partition (`swap`) and the root partition
    (`/`). Then, select the `End Partition Settings and Write Modifications to Disk`
    option and click the `Continue` button to start installing the operating system.


    ### How to manually partition the Operating system?


    1) Select the `Manual` option in the partition method, and then click the `Continue`
    button to see the disk partition table of the current system.


    2) From this dialog, you can see that there are two hard disks in the current
    system, namely `sda` and `sdb`. Moreover, you can see that there is a free space
    of `107.4GB` in `sdb`. At this point, select an idle disk partition and manually
    create the required Linux system partition table. In general, it is recommended
    to create a root partition and a swap partition. Here select the `Free Space`
    option to partition, and then click the `Continue` button, so that dialog box
    will be displayed.


    3) In the dialog box, select the `Create a new partition` option, and then click
    the `Continue` button, so that a box for setting the size of the new partition
    will be displayed.


    4) Specify the size of the partition to be created in this dialog box. For example,
    to create a swap partition with a size of `2GB`, enter `2GB` in the text box.
    Then click the `Continue` button, and a dialog box for setting the partition type
    will be displayed.


    5) Select the `Logical Partition` option in this dialog box, and then click the
    `Continue` button, the `New Partition Location` dialog box will be displayed.


    6) Select the `Start` option in the dialog box, and then click the `Continue`
    button. Immediately the `Partition Settings` dialog box will be displayed.


    7) As you can see from this dialog box, this partition will be used for the `Ext4`
    log file system, and the mount point is `/`. What is created here is a swap partition,
    so it needs to be modified to a swap partition. Then click the `Continue` button,
    and the file system format list dialog box will be displayed.


    8) In this dialog box, select the `Swap space` option, and then click the `Continue`
    button to return to the `Partition Settings` dialog box.

    '
