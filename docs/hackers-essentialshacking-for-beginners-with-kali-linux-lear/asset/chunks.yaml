    # Man-in-the-middle attack


    Man-in-the-Middle Attack, referred to as MITM attack, is an "indirect" intrusion
    attack. This attack mode is to virtually place a computer controlled by an intruder
    between two communicating computers in the network connection through various
    technical means. This computer is often referred to as a "man in the middle".


    Working principle


    Man-in-the-middle attacks have long been a common attack method used by hackers,
    and they have been spread to this day. Among them, the most typical man-in-the-middle
    attack methods are ARP spoofing and DNS spoofing. To put it simply, a man-in-the-middle
    attack is to intercept normal network communication data and perform data tampering
    and sniffing, while the communicating parties are unaware.


    Here we will take ARP spoofing technology as an example to introduce the working
    principle of man-in-the-middle attacks. In general, ARP spoofing is not to make
    the network unable to communicate normally, but to pretend to be a gateway or
    other host so that the data flow to the gateway or host is forwarded through the
    attacking host. By forwarding the traffic, you can control and view the traffic,
    thereby obtaining traffic or obtaining confidential information.


    How does it work?


    When communicating between host A and host B, if host A does not find the MAC
    address of host B in its ARP cache table, host A will send an ARP broadcast to
    all computers in the entire LAN. The computer will receive the data. At this time,
    host C responds to host A, saying that I am host B and my MAC address is XX-XX-XX-XX-XX-XX.
    Host A will update its cache table after receiving the address. When host A communicates
    with host B again, the data will be sent to the attacking host (host C), and host
    C will forward it to host B after receiving it.


    # Implementing a man-in-the-middle attack


    Once the user has a clear understanding of the principle of a man-in-the-middle
    attack, he can implement a man-in-the-middle attack. The following section will
    introduce the use of arpspoof and Ettercap to implement man-in-the-middle attacks.


    1) Use arpspoof tool


    arpspoof is a professional ARP spoofing tool that can directly spoof the gateway,
    making all computers accessing the network through the gateway be spoofed. Through
    ARP spoofing, the purpose of man-in-the-middle sniffing and capturing data packets
    can be achieved, and the data in transmission can be replaced. The following section
    will introduce the method of using the arpspoof tool to implement ARP attacks.


    The syntax format of the arpspoof tool is as follows: ￼


    arpspoof [options] host


    The options and meanings supported by the tool are as follows: ·


    -I interface: Specify the interface used. ·


    -T target: Specify the target of ARP spoofing. If not specified, all hosts in
    the LAN will be deceived. ·


    -R: Implement two-way deception. This option needs to be used with the -t option
    to be effective. ·


    Host: Specify the host you want to intercept the packet,Usually the local gateway.


    The specific steps to attack using arpspoof tool are as follows:


    1) Turn on routing and forwarding.


    The execution command is as follows: ￼


    root@exampleserver:～# echo 1> /proc/sys/net/ipv4/ip_forward￼


    Seeing the above output information, it means that routing and forwarding has
    been successfully turned on. If the user does not enable routing and forwarding,
    the target host cannot access the network.


    2) View the IP address and ARP cache table of the attacking host.


    First check the IP address as follows: ￼


    root@exampleserver:～# ifconfig￼'
