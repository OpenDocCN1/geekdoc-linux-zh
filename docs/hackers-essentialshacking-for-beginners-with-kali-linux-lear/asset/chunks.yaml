    1) Find through vulnerability website


    The address of the vulnerability website is `https://www.exploitdb.com/`. After
    successfully accessing the website in the browser, the interface will be displayed.
    Users can search for vulnerabilities by `CVE ID`, `name`, or `type`.


    From the search results, we can see the attack module information. The output
    includes several columns: `Name`, `Disclosure Date`, `Platform`, `Check`, and
    `Description`.


    2) Copy the module file `webtest.rb` to the corresponding location in Metasploit.
    The default location for Metasploit modules is `/root/.msf4/modules`. To organize
    modules conveniently, users can create folders according to the type.


    ```bash

    root@exampleserver:～# mkdir /root/.msf4/modules/exploits

    ```


    After executing the above command, there is no output. Here, for the convenience
    of remembering the location, we enter the directory and then copy the attack payload
