    WPA/WPA2 encryption is inherently secure. However, as long as the user captures
    the handshake bag and has a strong enough password dictionary, it is possible
    to crack the password violently. The following section will introduce the method
    of brute force cracking WPA/WPA2 wireless network password using `Aircraft-NG`
    tool.


    Using `Aricrack-ng` tool to crack WPA/WPA2 wireless password violently. The specific
    operation steps are as follows:


    1) Start the monitoring mode and scan the wireless network.


    All scanned wireless networks can be seen from the output information. At this
    time, select the wireless network encrypted with `WPA/WPA2`. For example, `CU_655w`
    wireless network will be selected here to implement brute force cracking.


    2) Use `Airodump-ng` tool to recapture the data packet, and specify the `BSSID`,
    `channel` and file saving location of the target AP.


    Execute the command as follows:


    ```

    root@exampleserver: airodump bssid

    ```


    Seeing the information output above indicates that the data packet is being captured.
    However, if you want to crack the password of this wireless network, you must
    capture the handshake bag. At this time, the user can use `mdk3` tool to carry
    out death attack, so as to speed up the acquisition of handshake bag.


    Its syntax format is as follows:


    ```

    root@exampleserver: handshake

    ```


    In the above syntax, option `d` means to carry out death attack. `-s` specifies
    the time interval for sending death packets. `-c` specifies the attack channel,
    that is, the channel where the AP is located.


    3) Use `mdk3` tool to carry out death attack to obtain handshake bag.


    Execute the command as follows:


    ```

    root@exampleserver: mdk3

    ```


    After executing the above command, no information will be given as output. At
    this time, return to `Airodump-ng` capture package interface to observe whether
    the handshake package is captured. If the handshake bag is captured, the MAC address
    of AP will be displayed in the upper right corner.


    As you can see from the upper right corner, `WPA handshake` is displayed. Therefore,
    the handshake bag has been successfully captured. Next, users can implement brute
    force cracking. In this scanning process, the generated capture file name is `wlan-01.cap`.


    4) Implement brute force cracking, and specify the password dictionary used as
    `pass.txt`. Among them, the password dictionary needs to be created manually by
    the user.


    Execute the command as follows:


    ```

    root@exampleserver: brute force dictionary.txt

    ```


    It can be seen from the output information that the password of `CU_655w` wireless
    network has been successfully cracked, and the password is `"exampleserver"`.


    ## Protective measures


    It can be found from the previous introduction that both `WEP` encryption and
    `WPA/WPA2` encryption can crack passwords. In order to make your wireless network
    as secure as possible, users can take some protective measures.


    * Several protective measures will be introduced below.

    * Change the default settings of the wireless router.

    * Prohibit `SSID` broadcasting to prevent being scanned and searched.

    * Turn off `WPS/QSS` function.

    * Enable `MAC` address filtering.

    * Set up complicated passwords. For example, it includes upper and lower case
    letters, numbers and special symbols.


    # Chapter 41: Creating a Dictionary for Bruteforcing


    ![](image_rsrc4A0.jpg)


    In the previous chapters of this module we have discussed about wireless hacking.
    As wireless networks passwords are well used in almost every part of the technology.
    Websites, Operating systems, online servers and a lot other devices use passwords
    to secure the information. As a hacker trying to crack these passwords is a challenging
    task. Now a days, people are being aware and are using strong passwords. However,
    there are still lakhs of people who are unaware of this and if tried can help
    us. This chapter introduces to Brute force cracking in detail. Follow along!


    # Creating a Password Dictionary


    The dictionary here is the password dictionary. If you want to implement a password
    attack, a password dictionary is essential. Users can collect and analyse password
    information to create a more reasonable password dictionary. Doing so can not
    only increase the cracking success rate, but also shorten the cracking time. This
    section will introduce how to create a dictionary.


    ## Password information collection


    Before creating a password dictionary, you can collect passwords. For example,
    you can collect information such as email addresses, website blog posts, Twitter
    posts, unit names, and personnel names related to the target. Because most users
    will use the simplest password for the convenience of remembering, or use personal
    related information (such as unit name, house number, etc.) as the password. At
    this point, if this information is collected and added to the dictionary file,
    the cracking success rate can be improved.


    # Cryptographic policy analysis


    The password policy means that the system imposes various restrictions on the
    password set by the user, such as not using only numbers, continuous numbers and
    English letters, etc. For example, some software or systems will have corresponding
    password policies to improve their security. At this point, the user can create
    a password dictionary in a targeted manner by analysing the password policies
    of these devices. The following section will introduce the password policy analysis
    method.


    ### 1) Software/system inherent strategy


    The inherent strategy refers to the password strategy built into the software/system
    itself. For the sake of safety, some software/systems have fixed strategies to
    avoid being easily cracked. If the software/system has inherent policies, users
    will be reminded of the minimum password length and complexity requirements when
    registering an account.


    For example, when installing an `Oracle` database, the user will be reminded whether
    the password set is complex enough. When the `Linux` operating system is installed,
