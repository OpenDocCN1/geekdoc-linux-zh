    \ Web 攻击向量方法，并详细描述了各种攻击方法的作用。\n\n3) 选择证书获取攻击方法，因此输入数字 `3`，将显示以下信息：\n\n```\nset:webattack>\
    \ 3\n```\n\n第一种方法将允许 `SET` 导入一个预定义的 Web 应用程序列表，可以在攻击中使用它们。第二种方法将完全克隆你选择的网站，并允许你在你尝试克隆的完全相同的\
