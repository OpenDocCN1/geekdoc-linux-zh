- fmt: "\nThe syntax format of using `Nmap` to identify the service version is as\
    \ follows:\n\n```\nnmap -sV [host]\n```\n\nThe option `-sV` in the above syntax\
    \ means to implement service version detection.\n\n### Use-case scenario:\nIdentify\
    \ all open services and versions on the target host `192.243.176.84`.\n\nThe execution\
    \ command is as follows:\n\n```\nroot@exampleserver:～# nmap -sV 192.243.176.84\n\
    ```\n\nThe identified service-related information can be seen from the output\
    \ information. The output information includes 4 columns, namely `PORT` (port),\
    \ `STATE` (state), `SERVICE` (service) and `VERSION` (version). By analysing each\
    \ column of information, you can obtain relevant information about the corresponding\
    \ service. For example, the service corresponding to `TCP` port 21 is `FTP`, and\
    \ the version is `FileZilla ftpd`. You can also see from the penultimate line\
    \ that the host name of the target host is `TEST-PC`, and the operating system\
    \ type is `Windows`.\n\n# Using Amap Tool\n\nAmap is a set of penetration testing\
    \ tools for identifying network services, including two tools, `amap` and `amapcrap`.\
    \ Among them, the `amap` tool is used to try to identify applications running\
    \ on unusual ports whereas the `amapcrap` tool identifies applications based on\
    \ non-ASCII encoding by sending trigger packets and finding the response in the\
    \ response string list.\n\nThe following section will introduce the use of Amap\
    \ tools to identify service information.\n\n### 1) Use the amapcrap tool\n\nThe\
    \ `amapcrap` tool can send random data to `UDP`, `TCP` or `SSL` ports to obtain\
    \ illegal response information. The obtained information will be written to the\
    \ `appdefs.trig` and `appdefs.resp` files to facilitate the next step of Amap\
    \ detection.\n\nThe syntax format of using this tool to identify service information\
    \ is as follows:\n\n```\namapcrap -n -m <0ab> [host][port] -v\n```\n\nHere `-V`\
    \ stands for the verbose mode.\n\n### Use-case scenario:\nUse the `amapcrap` tool\
    \ to probe port 90 applications.\n\nThe execution command is as follows:\n\n```\n\
    root@exampleserver:～# amapcrap -n 20-ma 192.198.153.84 90 -v\n```\n\nFrom the\
    \ displayed results, we can understand that the acquired information is written\
    \ into the `appdefs.trig` and `appdefs.resp` trigger files. When users use the\
    \ Amap tool to identify services, these two files will be used to obtain information.\n\
    \n### 2) Use the amap tool\n\nThe `amap` tool can try to identify some applications\
    \ running on abnormal ports.\n\nThe syntax format of using this tool to identify\
    \ service information is as follows:\n\n```\namap -bqv [host][port]\n```\n\n###\
    \ Use-case scenario:\nUse the `amap` tool to scan the port 80 service on the target\
    \ host `192.243.176.84`.\n\nThe execution command is as follows:\n\n```\nroot@exampleserver:～#\
    \ amap -bqv 192.243.176.84 80\n```\n\nFrom the output information, you can understand\
    \ that the service matching port 80 is `http` or `http-apache2\\.`. From the displayed\
    \ identification information, it can be seen that the web service running on the\
    \ target host is `Apache` and the version is `2.2.8\\. In the first 3 lines of\
    \ output, you can see that the `amap` tool uses two trigger files and a response\
    \ file. Among them, the file names are `appdefs.trig`, `appdefs.resp` and `appdefs.rpc`.\n\
    \n# Collect service information\n\nSome special services can provide additional\
    \ information. For example, `SMB` service can provide file system structure whereas\
    \ `SNMP` service can provide target host related information. This section will\
    \ explain how to use these services to collect valuable information for your pen\
    \ testing information collection about the target.\n\n### SMB Service\n\n`SMB`\
    \ (Server Message Block) is an IBM protocol used to share files, printers, serial\
    \ ports, etc. between computers. The `SMB` protocol can work on top of the `TCP/IP`\
    \ protocol, or on other network protocols (such as `NetBEUI`). By obtaining the\
    \ shared folder information of the `SMB` service, you can understand the file\
    \ system structure of the target host. The following section will introduce the\
    \ shared folder information for using the `smbclient` tool to access the `SMB`\
    \ service.\n\n`smbclient` is a client tool for `SMB` service that can be used\
    \ to access shared files in `SMB` service.\n\nThe grammatical format of the `smbclient`\
    \ tool is as follows:\n\n```\nroot@exampleserver : smbclient -L -U <username></username>\n\
    ```\n\nThe options and meanings in the above grammar are as follows:\n`-L`: Used\
    \ to specify the `SMB` server address.\n`-U`: Used to specify the user name for\
    \ logging in to the `SMB` service.\n\n### Use-Case scenario:\nAccess the `SMB`\
    \ service in the Linux system.\n\nThe execution command is as follows:\n\n```\n\
    smbclient -L 192.243.176.84 -U root Enter WORKGROUP\\root's password:\n```\n\n\
    Entering the password of the `SMB` service user login will display the information\
    \ that needs a lot of analysis.\n\nFrom the output information, you can see the\
    \ files shared in the target `SMB`. Among them, `Sharename` represents the name\
    \ of the shared file, `Type` represents the type of hard disk, and `Comment` is\
    \ the description of the shared file. It can be explained that the operating system\
    \ type of the target host is `Linux`, and the shared file is the Linux file system\
    \ type.\n\nIf the operating system of the target host is `Windows`, the file name\
    \ column will display the drive letter of the shared folder.\n\n```\nroot@exampleserver:～#\
    \ smbclient -L 192.243.176.84-U\n```\n\nAs can be seen from the output result,\
    \ the shared disks are `C` disk and `E` disk. \n\n### SNMP Service\n\n`SNMP` (Simple\
    \ Network Management Protocol) is composed of a set of network management standards,\
    \ including an application layer protocol and a set of resource objects. This\
    \ protocol is used by the network management system to monitor any situation on\
    \ the network equipment that deserves the attention of the administrator. By using\
    \ this service, host information can be obtained. The following section will introduce\
    \ the use of `snmpcheck` tool to obtain host information.\n\nThe `snmpcheck` tool\
    \ can be used to enumerate `SNMP` devices to obtain target information.\n\nThe\
    \ syntax format of the tool is as follows:\n\n```\nsnmpcheck [target]\n```\n\n\
    ### Use-case scenario:\nUse `snmpcheck` tool to obtain `192.243.176.84` host information\
    \ through `SNMP` protocol.\n\nThe execution command is as follows:\n\n```\nroot@exampleserver:～#\
    \ snmpcheck 192.243.176.84\n```\n\nWhen the connection is successful, the system\
    \ information of the host can be obtained.\n\nDue to the large amount of output\
    \ information that comes with the above command, each part will be important to\
    \ understand. Follow along!\n\n1. We can obtain system information, such as host\
    \ name, operating system type and architecture.\n2. We can obtain user account\
    \ information.\n3. Can obtain network information, such as `TTL` value, `TCP`\
    \ segment and data element.\n4. Can obtain network interface information, such\
    \ as interface status, speed, `IP` address, and subnet mask.\n5. Can obtain network\
    \ `IP` information.\n6. Can obtain routing information, such as destination address,\
    \ next hop address, subnet mask and path length value.\n7. Can obtain the monitored\
    \ `TCP` port.\n8. Can obtain monitoring `UDP` port information. For example, the\
