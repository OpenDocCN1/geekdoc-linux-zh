    至此，我们已经完成了渗透测试过程中信息收集阶段的一个重要部分。获取所有这些数据后，我们需要对它们进行分析，以获取或创建一个可行的工作流。为了让这一过程对您变得简单，我们将详细介绍
    Maltego 工具的使用方法。请跟随我们操作！


    # 第 16 章：信息分析与排序


    ![](img/image_rsrc49X.jpg)


    通过使用上述方法，可以收集大量关于目标主机的信息。为了方便后续渗透测试的实施，用户需要对这些信息进行排序和分析。此时，用户可以借助 `Maltego` 工具对信息进行分析和组织。本节将介绍如何使用
    `Maltego` 工具来分析和组织信息。


    ## 配置 Maltego


    Maltego 是一个强大的信息收集工具。它不仅可以自动收集所需信息，还能对收集到的信息进行可视化，并以图形方式向用户展示结果。Kali Linux 默认安装了
    Maltego 工具，因此用户可以直接使用。然而，在使用工具之前，你需要进行简单的配置，例如注册账户和选择启动模式。下节将介绍 Maltego 工具的配置。


    ### 1) 注册账户


    当用户使用 Maltego 工具时，需要登录其官方网站。因此，在启动工具之前你需要注册一个账户。


    注册账户的地址如下：


    https://www.paterva.com/web7/community/community.php


    当用户在浏览器中成功访问上述地址后，将显示带有字段框的对话框。


    在此对话框中填写正确信息，并勾选“执行人机认证”复选框。会弹出图片验证对话框。在对话框中，根据提示选择相应的图片，然后点击“Verify”按钮。验证成功后，将显示注册所需的对话框。


    此时，点击 `Register!` 按钮完成注册。此时，你将从用于注册账户的邮箱中收到一封邮件。登录你的邮箱以激活账户。


    ### 2) 设置 Maltego 模式


    Maltego 提供两种模式，即普通隐私模式（Normal Privacy Mode）和隐身隐私模式（Stealth Privacy Mode）。其中，普通隐私模式可以获取更多信息。此外，允许用户直接使用互联网数据，例如物理图片和网站信息。隐身隐私模式更多用于简单的信息分析，特别是当当前计算机没有网络时。使用此模式将无法直接从互联网获取数据。因此，为了获取更多信息，建议选择普通隐私模式。下节将介绍设置
    Maltego 模式的具体方法。


    **用例场景：**


    将 Maltego 模式设置为普通隐私模式。具体步骤如下：


    1) 在图形界面的菜单栏中，选择“Applications”|“Information Collection”|`maltego command`。此时将显示
    Maltego 产品选择对话框。


    2) 对话框中显示可选 Maltego 产品，包括 `Maltego XL`、`Maltego Classic`、`Maltego CE (Free)` 和
    `Maltego CaseFile (Free)`。其中，`Maltego XL` 和 `Maltego Classic` 收费，而 `Maltego CE`
    和 `Maltego CaseFile` 是免费的。在这里选择免费的 Maltego 工具并点击 `run` 按钮。


    3) 此对话框显示许可协议信息。勾选 `Accept` 复选框，然后点击 `Next` 按钮。将显示登录对话框。


    4) 在对话框中输入之前注册的账户信息（邮箱地址、密码和验证码）登录 Maltego 服务器。然后点击 `Next` 按钮。将出现对话框。


    5) 此对话框显示登录结果。从该对话框中你可以看到登录用户名、邮箱地址和登录时间。然后点击 `Next` 按钮，将显示安装 Transforms 的对话框。


    6) 此对话框显示要安装的应用服务、Transforms、实体（entities）和主机（hosts）信息。点击 `Next` 按钮显示另一个对话框。


    7) 在对话框中，你可以设置是否启用自动错误报告功能。如果你想启用，勾选 `Automatically send Error Reports` 复选框。如果你不想启用，直接点击
    `Next` 按钮。点击 `Next` 后，将显示隐私模式选择对话框。


    8) 在对话框中选择 `Normal mode`，然后点击 `Next` 按钮。


    9) 你可以从这一步看到 Maltego 已准备就绪。此时，用户可以使用 Maltego 工具收集信息。这里默认提供 3 种方法，即打开空白图让我玩玩（Open
    a blank graph and let me play around）、打开示例图（Open an example graph）以及离开，我以前做过了！（Go
    away, I have done this before!）。在这里选择第一种运行方法 `Open a blank graph and let me play
    around`，这将打开界面。


    10) 看到此界面意味着 Maltego 已成功启动并打开了一个新图表。接下来，用户可以选择任何实体并将其拖到图表中以分析和组织收集到的信息。


    ## 使用 Maltego 工具


    通过之前的配置，Maltego 工具可以正常使用了。用户可以使用 Maltego 工具来组织和分析之前收集的信息。此外，你还可以使用 Maltego 的 Transforms
    获取更多信息。Maltego 提供了大量的实体来表示信息节点。例如，域名信息可以使用 `Domain` 实体来表示。下节将介绍使用 Maltego 工具组织和分析信息的方法。


    ### 组织并分析主机信息


    通过之前的信息收集，我们可以了解局域网内的活动主机。开放端口、服务和操作系统是主机的一些类型。


    下节将介绍使用 IP 地址实体来分析主机信息。


    **用例场景：**


    使用 Maltego 工具组织和分析主机信息。具体步骤如下：


    1) 启动 Maltego 工具，将显示界面。


    2) 界面左侧列显示所有可用实体。在这里选择 IP 地址实体来整理收集的相关信息。选择 `IPv4 Address` 实体并将其拖到图表中，将显示界面。


    3) 从此界面中，你可以看到图表中添加了一个 IP 地址实体，该实体的默认 IP 地址为 `192.243.176.84`。此时，用户可以将地址修改为检测到的活动主机地址，例如
    `192.168.29.136`。用户可以通过双击实体的 IP 地址或修改属性 `IP Address` 值来修改实体地址。


    4) 从此界面可以看出 IP 地址实体的值已成功修改。此时，用户以相同的方式将 `Port` 和 `Service` 实体拖放到图表中，以整理主机的相关信息。


    5) 从此界面中，你可以看到添加的端口和服务实体。其中，端口的默认属性值为 `0`。服务的默认属性值为 `80/Apache 9`。用户可以根据收集的信息修改实体属性值。

