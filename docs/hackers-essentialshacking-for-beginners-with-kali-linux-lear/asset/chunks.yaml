  trans: '

    在 Kali Linux 2019 中，默认没有安装 OpenVAS 服务。因此，如果你想使用 OpenVAS 服务进行漏洞扫描，需要先安装该服务。此外，在服务成功安装后，还需要对
    OpenVAS 库进行初始化。接下来的章节将介绍安装 `OpenVAS service` 和初始化 `OpenVAS library` 的方法。


    ## 1) 安装 OpenVAS 服务


    由于默认未安装，你需要输入 Linux 命令来启动该服务，以便使用它进行漏洞扫描。


    执行命令如下：


    ```

    root@exampleserver:～# apt-get install openvas -y

    ```


    执行上述命令后，系统将检测依赖环境并下载相应的软件包。然后，它将在终端环境中自动下载（此处应为安装）所有下载的包。


    如果在安装过程中没有报告错误，则说明 OpenVAS 服务安装成功。如果你遇到任何错误，请检查其在线文档以解决错误。


    ## 2) 初始化 OpenVAS 库


    在用户成功安装 OpenVAS 服务后，需要对其进行初始化。在此过程中，OpenVAS 将根据最新的可用性下载许多文件（插件和漏洞数据）。这个过程需要很长时间，用户需要耐心等待。我们建议在此步骤使用高带宽连接。


    执行命令如下：


    ```

    root@exampleserver:～# openvas-setup

    ```


    从上面的输出信息中，你可以看到大量文件已经下载，所有库都已更新。此外，在最后，OpenVAS 相关服务被顺序启动，并自动生成了默认账户和密码。请记下用户名和密码，以便在使用命令行界面尝试初始化时使用。密码通常是加密的。


    提醒：在 Kali Linux 2019 中，当所有 OpenVAS 服务成功启动后，浏览器将自动启动并显示 OpenVAS 的登录界面供用户访问。


    ## 3) 初始化密码


    当用户初始化 OpenVAS 服务时，默认会生成一个长字符串密码。这个密码既不容易输入也不容易记忆，显然不符合用户使用通用简单密码的习惯。因此，为了方便起见，你可以使用以下命令快速更改密码。


    执行命令如下：


    ```

    root@exampleserver:～# openvasmd --user=admin --new-password="this-is-my-new-password"

    ```


    执行上述命令后，不会显示任何输出。然而，这并不意味着密码没有更改。请再次运行设置命令以检查密码是否已更改。


    注意：如果你再次运行 `openvas-setup` 命令，同步时间将非常快，并可以显著提高速度。


    ## 4) 检查安装的完整性


    在某些情况下，使用 `apt-get` 安装总是会导致各种各样的错误。此时，用户可以使用 `openvas-check-setup` 命令来排查错误。该命令不仅会指出错误位置，还会提示解决方案。


    执行命令如下：


    ```

    root@exampleserver:～# openvas-check-setup

    ```


    从上述命令中，你需要了解软件将通过 9 个步骤的检查。检查完成后，如果你看到“success prompt”（成功提示）消息，则说明 OpenVAS 安装成功。


    ## 5) 检查 OpenVAS 服务状态


    当 OpenVAS 服务初始化后，你就可以访问该服务。为了确保访问 OpenVAS 服务没有问题，请在此检查其状态。用户可以使用 `netstat` 命令查看监控端口，并按如下方式判断
    OpenVAS 服务是否成功启动。


    ```

    root@exampleserver:～# netstat

    ```


    此命令显示 OpenVAS 服务已经启动。如果你没有看到上述监控程序显示与 OpenVAS 相关的结果，说明服务未启动。


    ## 6) 设置外部访问


    通过检查 OpenVAS 服务的监控状态，我们可以看到服务的默认监控地址为 `127.0.0.1`，这意味着只允许本地主机访问。为了方便使用，用户需要手动配置外部访问。在这里，你需要将
    3 个配置文件中的监听 IP 从 `127.0.0.1` 修改为 `0.0.0.0`（代表任何 IP）。然后重启 OpenVAS 服务。


    具体步骤如下：


    1) 修改 `greenbone-security-assistant.service` 配置文件。在该文件中，有两个地方需要修改。第一个是修改 `--listen`
    和 `--mlisten` 的监听地址。第二个是增加 host header 的主机头地址。


    在此，首先将监听地址设置为任何 IP（`0.0.0.0`），如下所示：


    ```

    root@exampleserver:～# vi /usr/lib/systemd/system/greenbone-security-assistant.service

    ```


    2) 增加 host header 的主机头地址。如果主机增加 host header 的主机地址，外部访问将出现以下错误信息：The request contained
    an unknown or invalid Host header（请求包含未知或无效的 Host header）。如果你正尝试通过主机名或代理访问 GSA，请确保
    GSA 已设置为允许此类访问。


    在 `--mlisten=0.0.0.0` 之后添加 `--allow-header-host=IP address or domain name`。其中，此机器的
    IP 地址为 `192.168.1.132`。


    ```

    ExecStart=/usr/sbin/gsad --foreground --listen=0.0.0.0 --mlisten=0.0.0.0 --allow-header-host=192.168.1.132
    --port=9392

    ```


    3) 修改 `openvas-manager` 配置文件中的监听地址，如下：


    ```bash

    vi /etc/default/openvas-manager

    MANAGER_ADDRESS=0.0.0.0

    ```


    4) 修改 `greenbone-security-assistant` 配置文件中的监控地址，如下。注意修改 `GSA_ADDRESS` 和 `MANAGER_ADDRESS`。


    ```bash

    vi /etc/default/greenbone-security-assistant

    GSA_ADDRESS=0.0.0.0

    ```


    5) 重启 OpenVAS 服务。


    执行命令如下：


    ```

    root@exampleserver:～# openvas-stop

    root@exampleserver:～# openvas-start

    ```


    执行上述命令后，OpenVAS 服务成功重启。


    此时，再次检查监控状态，结果如下：


    ```

    root@exampleserver:～# netstat -anputl

    ```


    # 登录 OpenVAS 服务


    登录 OpenVAS 服务请仔细遵循以下步骤操作。如果遇到任何错误，请始终记住遵循官方网站上的故障排除指南。


    具体步骤如下：


    1) 在浏览器中输入地址 `https://exampleserver:9392/`（IP 地址为 OpenVAS 服务的地址），以便你访问 OpenVAS
    服务。


    '
