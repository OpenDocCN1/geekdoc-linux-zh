    ## Keyboard capture


    Test infiltrators can obtain the information input by the target user, such as
    user name and password, by starting the keyboard capture function.


    Among them, the command to start keyboard capture is as follows:


    ```

    meterpreter > keyscan_start

    ```


    Starting the keystroke sniffer...


    As can be seen from the output information, keyboard capture was successfully
    started. In order to simulate this test process, users can manually enter some
    information on the target host for test infiltrators to capture.


    When the user enters some information in the target host, the input information
    can be captured by using the `keyscan_dump` command on the attack host.


    ```

    meterpreter > keyscan_dump

    ```


    Dumping captured keystrokes... < Return > < Return > < Return > < N1 > < Return
    > 2 < Return > 34


    As can be seen from the output information, the information input by the target
    user has been successfully captured. If the user does not want to continue capturing
    the target host data, the keyboard capture can be stopped.


    Execute the following command:


    ```

    meterpreter > keyscan_stop

    ```


    Stopping the keystroke sniffer...


    Seeing the above output information indicates that the keyboard capture was successfully
    stopped.


    ## Screenshot


    The user can see the operations being performed by the target user, such as open
    files and web pages, by implementing screenshots. The following will take a screenshot
    of the target screen.


    Execute the following command:


    ```

    meterpreter > screenshot

    ```

    Screenshot saved to:/root/example.jpeg


    As can be seen from the output information, the screen of the target host was
    successfully intercepted and saved to the `/root/example.jpeg` file. At this time,
    the user can view the screenshot to confirm the operation performed by the target
    user.


    As you can see from the screenshot, the target user is browsing the CSDN blog
    webpage.


    ## Enumerate users


    A penetration tester can also use the `run post/windows/gather/enum_logged_on_user`
    command to enumerate users on the target host.


    The execution command is as follows: ￼


    ```

    meterpreter> run post/windows/gather/enum_logged_on_users

    ```


    From the output information, you can see that there is only one user on the target
    host, and the user name is `Administrator`.


    ## Privilege escalation


    In some cases, the Meterpreter session obtained by the user will be restricted
    by the user''s permissions, which will affect the operation of the penetration
    tester in the target system, such as modifying the registry, installing a backdoor,
    or exporting passwords. At this point, the user can use the `getsystem` command
    to escalate the rights of the current user. The following will introduce how to
    elevate user permissions.


    ### Raise the rights of ordinary users


    First check the permission information of the current user.


    The execution command is as follows: ￼


    ```

    meterpreter> getuid

    ```

    Server username: exampleserver-PC\bob


    ```


    From the output information, we can see that the current user is a normal user,
    whose user name is `bob`. Next, the user will be Promote rights.


    The execution command is as follows: ￼


    ```

    meterpreter> getsystem

    ```


    Seeing the above output information, it means that the current user has been successfully
    escalated. At this point, check the user permissions again.


    The results are as follows: ￼


    ```

    meterpreter> getuid

    ```

    Server username: NT AUTHORITY\SYSTEM


    ```


    From the output information, you can see that the current user''s authority is
    `NT AUTHORITY\SYSTEM`. This shows that the user''s authority has been successfully
    elevated.


    ## Get user password


    When the meterpreter session obtained by the user has certain permissions, the
    user password can be obtained. The following will use the `hashdump` command to
    obtain the user''s password.


    The execution command is as follows:


    ```

    meterpreter> hashdump Administrator: 500:

    ```


    From the output information, we can see that there are 3 users in the target host,
    namely `Administrator`, `bob` and `Guest`.


    The format of the above output information is `username: SID: LM hash: NTLM hash`.
    Among them, the LM hash `ccd3b653b51404 eeaad3b653b51404ee` and the NTLM hash
    `31d6ccy0d16ae981b23c89d7e0c045c0` correspond to an empty password.


    The hashed password obtained using the `hashdump` command requires further cracking
    to get the real password. At this point, the user can also obtain the user password
    by loading the `mimikatz` module. However, the commands of this module are only
    for 32-bit systems. The following will introduce how to use `mimikatz` module
    to obtain user password.


    The specific steps are as follows:


    1) Load the `mimikatz` module.


    The execution command is as follows: ￼


    ```

    meterpreter> load mimikatz

    ```


    Seeing the above output information, it means that the `mimikatz` module has been
    successfully loaded. At this point, you can use the `help mimikatz` command to
    view all the commands supported by the `mimikatz` module. details as follows:


    ```

