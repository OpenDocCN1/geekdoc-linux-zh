    Attacking Wireless Networks


    ![](image_rsrc4A0.jpg)


    By implementing wireless network scanning, we can find out the target of attack.This
    section will introduce how to attack the wireless network password and provide
    some protection measures.


    # Crack WEP wireless network password


    Because WEP encryption uses RC4 algorithm, the WEP encrypted network can be easily
    cracked.The following section will introduce how to use airplane-ng tool to crack
    WEP encrypted wireless network.


    Crack WEP wireless network password with airplane-ng tool.The specific operation
    steps are as follows:


    1) Start the monitoring mode.


    Execute the command as follows:


    root@exampleserver: airplane-ng monitor


    2) Scan the wireless network to find out the wireless network encrypted by WEP.


    It can be seen from the output information that WEP is the encryption method used
    by the wireless network whose ESSID is Test.Therefore, we will choose to crack
    the wireless network password here.


    3) Capture the wep wireless network data packet and specify that the captured
    data packet be saved in the WEP file.


    Execute the command as follows:


    root@exampleserver: airplane-ng capture


    See the above output information, indicating that the data packet of the Test
    wireless network is being captured. Whether the WEP encrypted wireless network
    can be cracked successfully depends on the captured IVS data packet. As can be
    seen from the Data column shown above, only 20 packages have been captured so
    far.In order to speed up packet capture, users can use Aireplay-ng tool to implement
    injection attack.


    The syntax format is as follows:


    root@exampleserver: inject


    Parameter -3 in the above syntax indicates ARP injection attack.-b specifies the
    MAC address of the AP. -h specifies the MAC address of the client.


    4) Implement ARP injection attack to accelerate the speed of capturing data packets.


    Execute the command as follows:


    root@exampleserver: airplane-ng inject packets ARP


    Seeing the above output information indicates that ARP injection attack is being
    implemented. At this time, when you return to the terminal where Airodump-ng tool
    is executed, you will find that the value of data column is growing rapidly.


    It can be seen from this interface that the value of the Data column has reached
    137501.At this point, the user can try to implement cracking. Generally, when
    the Data value reaches more than 10000, you can try to crack the password. If
    the password cannot be successfully cracked, continue to capture data.


    Tip: After the above command is successfully executed, the generated file name
    is wep-01.ivs instead of wep.ivs. This is for the convenience of calling airodump-ng
    tool when cracking later, and numbering all saved files in sequence, so there
    are more serial numbers like -01.By analogy, in the second attack, if the file
    is saved with the same file name wep, a file named wep-02.ivs will be generated.


    5) Implement password cracking.


    Execute the command as follows:


    root@exampleserver: crack dictionary.txt


    It can be seen from the output information that the password of WEP wireless network
    has been successfully cracked.The ASCII code of the password is abcde, and the
    hexadecimal value is 61:62:63:64:65.


