    In Kali Linux 2019, the OpenVAS service is not installed by default. Therefore,
    if you want to use the OpenVAS service to perform vulnerability scanning, you
    need to install the service first. Moreover, when the service is successfully
    installed, the OpenVAS library needs to be initialised. The following section
    will introduce the method of installing `OpenVAS service` and initialising `OpenVAS
    library`.


    ## 1) Install OpenVAS service


    As it is not installed by default, you need to enter a linux command to start
    the service so that you can scan vulnerabilities with it.


    The execution command is as follows:


    ```

    root@exampleserver:～# apt-get install openvas -y

    ```


    After executing the above command, the dependent environment will be detected
    and the corresponding software package will be downloaded. Then, it will install
    all the downloaded packages automatically within the terminal environment.


    If no error is reported during the installation process, it means that the OpenVAS
    service is installed successfully. If you face any errors please check their online
    documentation to clear the errors.


    ## 2) Initialise the OpenVAS library


    After the user successfully installs the OpenVAS service, it needs to be initialised.
    In this process, OpenVAS will download many files (plugins and vulnerability data)
    according to the latest availability. This process takes a long time, and users
    need to wait patiently. We recommend a high-network connection for this step.


    The execution command is as follows:


    ```

    root@exampleserver:～# openvas-setup

    ```


    From the above output information, you can see that a large number of files have
    been downloaded and all libraries have been updated. Moreover, at the end, OpenVAS-related
    services were started sequentially, and the default account and password were
    automatically generated. Please note down the account name and password to use
    it while trying to initialise it using the command line interface. The password
    is usually encrypted.


    Reminder: In Kali Linux 2019, when all OpenVAS services are successfully started,
    the browser will be automatically launched and the login interface of OpenVAS
    will be available for access.


    ## 3) Initialise the password


    When the user initialises the OpenVAS service, a long string of password is generated
    by default. This password is neither easy to enter nor easy to remember, and obviously
    does not conform to the users usual habit of using common and general passwords.
    So, for your convenience you can use the below command to quickly change the password.


    The execution command is as follows:


    ```

    root@exampleserver:～# openvasmd --user=admin --new-password="this-is-my-new-password"

    ```


    After executing the above command, no information will be shown as output. However,
    that doesn’t mean that the password has not changed. Please run the setup command
    again to check whether the password has changed or not.


    Note: If you run the `openvas-setup` command again, the synchronisation time will
    be very fast and can increase it’s speed significantly.


    ## 4) Check the integrity of the installation


    In some cases, the use of `apt-get` installation will always cause errors of one
    kind or another. At this point, the user can use the `openvas-check-setup` command
    to troubleshoot the error. This command will not only point out the location of
    the error, but also prompt the solution.


    The execution command is as follows:


    ```

    root@exampleserver:～# openvas-check-setup

    ```


    From the above command, you need to understand that the software will be checked
    in 9 steps. After the check is completed, if you see the “success prompt” message
    then it means that the OpenVAS installation is successful.


    ## 5) Check the OpenVAS service status


    When the OpenVAS service is initialised, you can access the service. In order
    to make sure that there is no problem in accessing the OpenVAS service, check
    its status here. The user can use the `netstat` command to view the monitored
    port and determine whether the OpenVAS service is started successfully as follows.


    ```

    root@exampleserver:～# netstat

    ```


    This command shows that the OpenVAS service has been started. If you do not see
    the above monitoring program showing results that are related to OpenVAS, it means
    that the service is not started.


    ## 6) Set up external access


    By checking the monitoring status of the OpenVAS service, we can see that the
    default monitoring address of the service is `127.0.0.1`, which means that only
    local host access is allowed. For ease of use, users need to manually configure
    external access. Here you will need to modify the listening IP in the 3 configuration
    files from `127.0.0.1` to `0.0.0.0` (representing any IP). Then, restart the OpenVAS
    service.


    The specific steps for this is like below:


    1) Modify the `greenbone-security-assistant.service` configuration file. In this
    configuration file, there are two places that need to be modified. The first is
    to modify the listening address of `--listen` and `--mlisten`. The second is to
    increase the host address of the host header.


    Here, first set the listening address to any IP (`0.0.0.0`) as follows:


    ```

    root@exampleserver:～# vi /usr/lib/systemd/system/greenbone-security-assistant.service

    ```


    2) Increase the host address of the host header. If the host address of the host
    header is not increased, the following error message will appear for external
    access: The request contained an unknown or invalid Host header. If you are trying
    to access GSA via its hostname or a proxy, make sure GSA is set up to allow it.


    Add `--allow-header-host=IP address or domain name` after `--mlisten=0.0.0.0`.
    Among them, the IP address of this machine is `192.168.19.132`.


    ```

    ExecStart=/usr/sbin/gsad --foreground --listen=0.0.0.0 --mlisten=0.0.0.0 --allow-header-host=192.168.19.132
    --port=9392

    ```


    3) Modify the listening address in the `openvas-manager` configuration file. as
    follows:


    ```bash

    vi /etc/default/openvas-manager

    MANAGER_ADDRESS=0.0.0.0

    ```


    4) Modify the monitored address in the `greenbone-security-assistant` configuration
    file. as follows. Note to modify `GSA_ADDRESS` and `MANAGER_ADDRESS`.


    ```bash

    vi /etc/default/greenbone-security-assistant

    GSA_ADDRESS=0.0.0.0

    ```


    5) Restart the OpenVAS service.


    The execution command is as follows:


    ```

    root@exampleserver:～# openvas-stop

    root@exampleserver:～# openvas-start

    ```


    After executing the above command, the OpenVAS service restarts successfully.


    At this point, check the monitoring status again, and the results are as follows:


    ```

    root@exampleserver:～# netstat -anputl

    ```


    # Log in to OpenVAS service


    To login into the OpenVAS service follow the below steps carefully. Always remember
    to follow the troubleshooting guide in the official website if you face any errors.


    The specific steps are as follows:


    1) Enter the address in the browser, `https://exampleserver:9392/` (IP address
    is the address of the OpenVAS service), so that you can access the OpenVAS service.

    '
