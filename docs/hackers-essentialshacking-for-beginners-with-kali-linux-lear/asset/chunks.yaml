    # Wireshark, a general-purpose packet capture tool


    Wireshark is a tool dedicated to network packets, which can be used to capture
    and analyze data packets. After a user implements a man-in-the-middle attack,
    Wireshark can be used to monitor the data packets of the target host flowing through
    the network. The following section will introduce the method of using Wireshark
    tool to capture data packets.


    ## Use Wireshark to monitor the data packets of the target host.


    The specific steps are as follows:


    1) Implement a man-in-the-middle attack.


    The execution command is as follows:


    ```bash

    root@exampleserver:～# ettercap -Tq -M arp:remote /192.168.29.148// /192.168.29.2//

    ```


    2) Start the Wireshark tool. In the menu bar, select `Applications``|``sniffing/spoofing``|`wireshark`
    command in turn, the interface will be displayed.


    3) Select the listening interface `eth0` in this interface. Then, click the start
    capturing group button to start capturing data packets.


    4) At this time, all data packets passing through the interface `eth0` are being
    monitored. When enough data packets are captured, click the stop capturing group
    button to stop capturing data packets.


    5) Save the captured package to the capture file. Select the `File` `|` `Save`
    command in the menu bar, and the interface will be displayed.


    6) Specify the capture file name and location in this interface. Then, click the
    `Save` button to successfully save the captured data packet.


    # Capture picture


    After the user successfully implements the man-in-the-middle attack, the driftnet
    tool can be used to capture the picture. Driftnet is a simple and practical image
    capture tool that can easily capture images in network data packets. By working
    with the `ettercap` tool, you can capture all the pictures browsed by the target
    host. The following section will introduce how to use driftnet tool to capture
    pictures of the target host.


    The syntax format of the driftnet tool is as follows:


    ```bash

    driftnet [options]

    ```


    ## Use driftnet tool to capture all pictures browsed by the target host.


    The specific steps are as follows:


    1) Use Ettercap to implement a man-in-the-middle attack.


    The execution command is as follows:


    ```bash

    root@exampleserver:～# ettercap -Tq -M arp:remote /192.168.29.135// /192.168.29.2//

    ```


    Seeing the above output information indicates that ARP spoofing was successfully
    implemented on the target. Next, users can use the driftnet tool to monitor the
    pictures of the target host.


    2) Use driftnet to start monitoring all pictures browsed by the target host, and
    specify to temporarily save the monitored pictures to the `/root/image` directory.


    The execution command is as follows:


    ```bash

    root@exampleserver:～# driftnet -i eth0-d /root/image

    ```


    After executing the above command, a driftnet terminal window will pop up.


    3) When the picture browsed by the target host is captured, it is displayed in
    the window. Moreover, the captured image information can also be seen in the interactive
    mode of driftnet monitoring.


    You can see the captured picture information from the information displayed above.
    In the information output above, the user can also find some warning messages.
    This is caused by the fact that some image formats are not supported by driftnet
    tools.


    At this point, the user enters the specified pictureYou can see all the captured
    images in the `/root/image` directory where the film is saved. Users can use the
    picture viewer to view any picture, and the display result is shown.


    4) You can see the captured pictures from this interface. If the user does not
    want to capture the picture again, press the `Ctrl+C` key combination to stop
    monitoring.


    # Chapter 25


    ## Advanced Monitoring of the Data


    ## Monitoring HTTP data


    HTTP (Hyper Text Transfer Protocol) is a transfer protocol used for Web servers
    to transfer hypertext to local browsers. Normally, the HTTP protocol is used by
    clients to access web pages. Therefore, users can also monitor HTTP data accessed
    by target users by using man-in-the-middle attacks. Since the HTTP protocol transmits
    data in plain text, if a user logs in to an HTTP protocol website, user information
    will be monitored. The following will introduce the method of using Ettercap tool
    to sniff HTTP protocol data.


    The specific steps are as follows:


    1) Use the Ettercap tool to implement a man-in-the-middle attack on the target.


    The execution command is as follows:


    ```bash

    root@exampleserver:～# ettercap -Tq -M arp:remote /192.168.29.135// /192.168.29.2//

    ```


    Seeing the above output information indicates that the ARP spoofing attack was
    successfully implemented on the target.


    2) At this time, when the target host accesses the HTTP protocol website, it will
    be monitored by the attacking host.


    For example, log in to the UNIX forum here, and when the user enters the login
    information and logs in, it will be monitored by the attacking host. as follows:


    ```

    HTTP: 42.62.98.167:80->

    USER: testuser PASS: password

    ```


    From the output information, we can see that the login information of the target
    host to access the UNIX forum is monitored. The user name is `testuser` and the
    password is `password`.


    ## Monitoring HTTPS data


    HTTPS (Hyper Text Transfer Protocol over Secure Socket) is a secure version of
    HTTP. At this point, the user can use SSLStrip tool to decrypt the encrypted data.
    The following will introduce the method of using SSLStrip tool to monitor HTTPS
    data.


    The specific steps are as follows:


    1) Turn on routing and forwarding.


    ```bash

    root@exampleserver:～# echo 1> /proc/sys/net/ipv4/ip_forward

    ```


    2) Import all HTTP data to port 10000 through iptables.


    ```bash

    root@exampleserver:～# iptables -t nat -A PREROUTING -p tcp --destination-port
    80-j REDIRECT --to-port 10000

    ```


    3) Use SSLstrip to monitor port 10000 to obtain information.


    The execution command is as follows:


    ```bash

    root@exampleserver:～# sslstrip -a -l 10000

    ```


    From the output information, you can see that the SSLStrip tool is running. At
    this point, a log file named `sslstrip.log` will be created in the current directory.


    By monitoring the log file, you can see the data transmitted by the target host
    as follows:


    ```bash

    root@exampleserver:～# tail -f sslstrip.log

    ```


    Tip: When using SSLStrip to attack, some warning messages may appear. However,
    this information does not affect SSLStrip''s capture of data packets.


    Among them, the warning message appears as follows:


    ```

    Unhandled error in Deferred: Traceback (most recent call last):

    ```


    4) Implement ARP spoofing attacks.


    The execution command is as follows:


    ```bash

    root@exampleserver:～# ettercap -Tq -M arp:remote /192.168.29.136// /192.168.29.2//

    ```


    5) At this time, visit the HTTPS encrypted website on the target host. If the
    target user submits sensitive information, it will be captured by SSLStrip. For
    example, log in to 126 mailbox (`https://mail.126.com`) to verify the success
    of the SSLStrip attack. When the target user successfully accesses the 126 mailbox,
    the interface will be displayed.


    6) It can be seen from this interface that the login interface of 126 mailboxes
    has been successfully displayed. Moreover, you can see from the address bar of
    the browser that it has been decrypted by the SSLStrip tool into the HTTP protocol
    (`http://mail.126.com`).

    '
