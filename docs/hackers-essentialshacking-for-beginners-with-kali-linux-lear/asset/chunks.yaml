    # 网络数据快速分析


    当用户使用 `Wireshark` 捕获数据包时，可以使用 `Xplico` 工具快速分析这些数据。`Xplico` 工具可以快速找出用户请求的网页地址、图片和视频内容。下面将介绍使用
    `Xplico` 工具分析网络数据的方法。


    # 安装并启动 Xplico 服务


    Kali Linux 默认没有安装 `Xplico` 工具。因此，在使用该工具之前，你需要先安装该工具。


    执行命令如下：


    ```bash

    root@exampleserver:～# apt-get install xplico

    ```


    执行上述命令后，如果没有报告错误，则安装成功。接下来，你需要在在使用之前先启动服务。


    执行命令如下：


    ```bash

    root@exampleserver:～# service xplico start

    ```


    执行上述命令后，没有内容输出。因为 `Xplico` 是一个基于 Web 的工具。因此，用户还需要启动 Web 服务。


    执行命令如下：


    ```bash

    root@exampleserver:～# service apache2 start

    ```


    现在，用户可以访问 `Xplico` 服务了。`Xplico` 服务的默认监听端口为 `9876`。


    用户可以通过检查端口来确定 `Xplico` 服务是否成功启动。详情如下：


    ```bash

    root@exampleserver:～# netstat -anptul | grep 9876

    tcp6 0 0 :::9876

    ```


    从上述输出信息中，我们可以看到 TCP 端口 `9876` 正在监听。这说明 `Xplico` 服务启动成功。


    具体步骤如下：


    1) 在浏览器中访问 `http://IP:9876/` 进入 `Xplico` 服务器。访问成功后，将显示 `Xplico` 服务的登录界面。


    2) 此界面用于登录 `Xplico` 服务。`Xplico` 服务的默认用户名和密码均为 `xplico`。在输入用户名和密码成功登录 `Xplico`
    后，将显示所示界面。


    3) 你可以从此界面看到没有任何内容。默认情况下，`Xplico` 服务没有案件（case）和会话（session）。你需要在分析捕获文件之前创建一个案件和会话。首先创建一个案件，在左栏选择
    `New Case` 选项即可显示界面。


    4) 这里提供了两种分析数据的选项，即 `Uploading PCAP capture file/s` 和 `Live acquisition`。其中，`Uploading
    PCAP capture file/s` 意味着上传 `PCAP` 捕获文件并进行分析。`Live acquisition` 意味着实时在线捕获并分析数据包。在这里我们要分析捕获的数据包，请选择
    `Uploading PCAP capture file/s` 单选按钮。然后指定案件名称。在本例中，将案件名称设置为 `TCP`，然后点击 `Create`
    按钮，将显示界面。


    5) 从此界面，你可以看到案件已成功创建，新创建的案件显示在列表中。点击新创建的案件名称 `TCP` 即可查看案件中的会话。


    6) 从此界面，你可以看到没有任何会话信息，然后创建一个会话。在左栏选择 `New Session` 命令即可显示界面。


    7) 在此界面的 `Session name` 框中输入你想创建的会话名称，然后点击 `Create` 按钮创建会话。创建成功后，将显示界面。


    8) 从此界面，你可以看到创建了一个名为 `Web` 的新会话。现在进入会话，可以加载并分析捕获文件。点击会话名称 `Web`，将显示所示界面。


    9) 此界面用于显示捕获文件的详细信息。由于尚未上传捕获文件，请点击 `Select File` 按钮选择要分析的捕获文件，然后点击 `Upload` 按钮上传捕获文件。上传成功后，将显示界面。


    10) 从界面的 `Session Data` 部分，你可以看到上传的捕获文件的时间状态。从 `Status` 行信息中，可以看到 `DECODING COMPLETED`（解码完成）。此外，你现在将看到与捕获文件对应的每类型数据包的数量。界面显示了
    15 类型，例如 `HTTP`、`MMS`、`Emails`、`FTP-TFTP-HTTP file`、`Web Mail` 等。在此界面中，你可以看到 `HTTP`
    类型显示了某些数据包信息。例如，查看访问站点的信息。在左栏选择 `Web|Site` 命令，将显示捕获文件中请求的所有链接。


    11) 在此界面，默认显示 `Html` 类型的 `HTTP` 信息。用户还可以查看图片（`Image`）、视频（`Video`）以及请求链接中的 `Flash`
    动画。例如，打开请求的网页。


    12) 从此界面，你可以看到用户播放的视频。例如，查看请求的缩略图。在左栏选择 `Web|Images` 命令即可查看所有图片。


