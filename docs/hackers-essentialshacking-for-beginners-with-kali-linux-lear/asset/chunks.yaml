  trans: '


    使用 `ifconfig` 命令查看现有的网络配置，如下：


    ```

    root@exampleserver:～# ifconfig

    ```


    这将显示大量关于有线网络的信息。我们建议你保存这些信息的截图，以便以后参考你正在攻击的目标。当你针对无线网络时，这很有用。


    ### 图形界面设置


    图形界面设置相对直观且易于操作。下节将介绍在图形界面上设置有线网络。


    配置有线网络的具体步骤如下：


    1) 打开“设置”（Settings）面板并选择“网络”（Network）设置项，将显示对话框。


    2) 从此对话框可以看出，有线网络未连接。此时，点击设置按钮，将显示对话框。


    3) 从对话框中可以看到它包含 5 个标签，分别是详细信息（Details）、身份（Identity）、IPv4、IPv6 和安全（Security）。这里主要配置
    `IPv4` 标签中的选项。设置后，你可以在“详细信息”选项卡中查看获取的网络信息。选择 `IPv4` 选项卡，将显示对话框。


    4) 在此对话框中设置获取 IPv4 地址的方法。这里提供了 4 种方法，即自动（DHCP）、手动（manual）、仅本地链路（local link only）和禁用（Disable）。其中，“自动
    (DHCP)”选项意味着 DHCP 服务器将自动为当前主机分配 IP 地址。


    “手动”选项意味着用户需要手动设置 IP 地址、子网掩码和网关。“仅本地链路”选项仅用于无法访问互联网时的本地连接。“禁用”选项表示禁用 IPv4 地址。如果你想访问互联网，必须使用自动
    (DHCP) 或手动方法。为了方便使用和更快的操作，“自动 (DHCP)”是最佳选择。如果用户想固定当前计算机的地址，可以选择“手动”单选按钮，这将显示对话框。


    5) 在此对话框中，你可以手动指定 IP 地址、子网掩码、网关、DNS 和路由信息，以防止用户因配置错误无法访问互联网。建议仅设置 IP 地址和子网掩码。设置完成后，点击右上角的“应用
    (A)”按钮返回网络设置对话框。


    6) 此时，有线网络配置完成。但接口尚未激活。因此，用户需要激活接口才能获取分配的 IP 地址并访问互联网。点击此对话框中的启动按钮连接到有线网络。


    7) 从此对话框中可以看到有线网络的状态为“已连接”。这表明有线网络配置成功。此时，你可以在“详细信息”选项卡中查看获取的地址信息。


    8) 从此对话框中可以看到有线网络速度、IPv4 和 IPv6 地址、硬件地址、默认路由和 DNS 信息。务必在此界面勾选“自动连接 (A)”复选框。否则，重启电脑后将无法自动连接网络。默认情况下，“自动连接
    (A)”复选框是被选中的。


    ### 命令行设置


    使用命令行配置网络也非常简单，通过几个命令即可完成配置。Kali Linux 的网络连接配置文件为 `/etc/network/interfaces`。使用
    `VI` 编辑器编辑 interfaces 文件。


    文件的默认内容如下：


    ```

    root@exampleserver:～# vi /etc/network/interfaces


    # 此文件描述了系统上可用的网络接口 # 以及如何激活它们。

    ```


    从上述信息可以看出，默认只配置了一个 `lo` 接口。如果你想配置有线网络，请添加以太网接口 `ethX` 的信息。同样，用户可以设置动态获取 IP 地址或静态分配
    IP 地址（手动）。例如，以下将设置以太网接口 `eth0` 的有线网络。


    动态获取 IP 地址的方法如下：


    ```

    auto eth0 iface eth0 inet dhcp

    ```


    静态分配 IP 地址的方法如下：


    ```

    auto eth0 iface eth0 inet static

    ```


    用户可以选择适合自己的方法来配置有线网络。设置完成后，保存并退出 `interfaces` 文件配置界面。接下来，用户还需要重启网络服务以使 `interfaces`
    文件中的配置生效。


    执行命令如下：


    ```

    root@exampleserver:～# service networking restart

    ```


    执行上述命令后，不会输出信息。此时，用户可以使用 `ifconfig` 命令查看获取的地址信息。


    ### 配置无线网络


    无线网络指的是任何形式的无线计算机网络。计算机需要通过无线网卡连接到网络。如果用户在虚拟机安装了 Kali Linux 系统并想要连接物理网络，可以使用无线网卡连接到他的无线网络。


    配置无线网络的具体步骤如下：


    1) 确定你的主机是否有无线网卡。如果没有无线网卡，可以使用 USB 无线网卡。将 USB 无线网卡插入主机，使用 `lsusb` 命令检查无线网卡是否被成功识别。


    执行命令如下：


    ```

    root@exampleserver:～# lsusb

    ```


    2) 使用 `ifconfig` 命令检查无线网络接口是否已激活，如下：


    ```

    root@exampleserver:～# ifconfig

    ```


    此时，用户可以使用 `ifconfig -a` 命令查看所有接口。执行此命令后，如果你看到 `wlan` 接口名称，意味着网卡已成功识别。用户需要使用以下命令激活网卡。


    ```

    root@exampleserver:～# ifconfig wlan0 up

    ```


    执行上述命令后，没有输出信息。为了判断无线网卡是否成功激活，用户可以再次使用 `ifconfig` 命令检查。


    3) 在 Kali Linux 的图形界面中，点击右上角的关闭按钮，将弹出菜单。


    4) 从此菜单中，你可以看到“有线已连接”、“Wi-Fi 未连接”和“无”等命令。选择“Wi-Fi 未连接”选项，将弹出相关设置的子命令。


    5) 选择“选择网络”命令查看搜索到的所有 Wi-Fi 网络。


    6) 在此对话框中，你可以设置要连接的 Wi-Fi 网络进行网络连接。例如，连接到 Test 无线网络。先选择 Test 无线网络，然后点击“连接”按钮，将弹出对话框。


    7) 在此对话框中输入 Test 无线网络的认证密码，然后点击“连接”按钮。如果连接成功，你可以看到连接的无线网络名称。


    上述方法适用于无线 AP 名称广播且用户可以直接连接的情况。在许多情况下，用户为了安全可能会隐藏 SSID 号。此时，用户在搜索信号中看不到 Wi-Fi 网络。因此用户需要手动添加无线网络并连接。


    连接隐藏网络的具体步骤如下：


