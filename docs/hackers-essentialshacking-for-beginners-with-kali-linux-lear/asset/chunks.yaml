    system are displayed. The output information includes 7 columns, which respectively
    represent `PID` (process ID), `PPID` (parent ID), `Name` (process name), `Arch`
    (architecture), `Session` (session), `User` (user name) and `Path` (path). For
    example, here will choose Meterpreter to bind with `winlogon.exe` process. Among
    them, the process ID is `400`.


