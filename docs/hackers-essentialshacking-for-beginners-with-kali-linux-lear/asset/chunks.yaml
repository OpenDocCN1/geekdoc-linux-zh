    Drivers are special programs added to the operating system. The drivers contain
    information about the hardware device. This information enables the computer to
    communicate with the corresponding device. When a hardware device is added to
    the computer, the corresponding driver must be installed. Otherwise, the device
    cannot be used.


    For Kali Linux system, because the kernel of the system is relatively new, it
    can support most device drivers. However, for certain devices, sometimes users
    need to manually install drivers, such as graphics card drivers. This section
    will introduce how to view device driver information and install the driver.


    Tip: Because of the risk of installing the driver, it is recommended to back up
    important data before installation.


    # View device


    Before installing the driver, the user can use the `lsusb` and `lspci` commands
    to view the detailed information of the USB or PCI device to determine whether
    the driver is correct. If it has started successfully, you need to install the
    driver. The following will introduce how to check whether the device is driven
    correctly.


    ### a) View USB devices


    When users implement wireless penetration testing, they usually need to use a
    wireless network card with a USB interface. When the user connects the device
    to the system, he can use the `lsusb` command to view the USB device list information
    to determine whether the device is correctly identified. as follows:


    ```

    root@exampleserver:～# lsusb

    ```


    The above output information shows the USB device list information in the current
    system. The above output information includes 3 parts, which are bus number, device
    number and manufacturer ID. By analyzing the manufacturer''s ID information of
    the device, it can be known that the device is a USB device with a model of Realtek
    Semiconductor Corp.


    The user can check the driver module of the device by using the `-v` option of
    the `lsusb` command to confirm whether the driver is correct. The following will
    introduce the use of `lsusb` command to view the detailed information of the USB
    device.


    The execution command is as follows:


    ```

    root@exampleserver:～# lsusb -v Bus

    ```


    After executing the above command, a lot of information will be given as output.
    Due to space limitations, only the detailed information of the first USB device
    is briefly listed. From the output information, you can see the manufacturer ID
    and product ID information of the device. It can be explained that the device
    has been correctly loaded with the driver. If it is not driven, you will not be
    able to see similar information.


    ### b) View PCI devices


    PCI (Peripheral Component Interconnect, Peripheral Component Interconnect Standard)
    is currently the most widely used interface specification in personal computers,
    and almost all motherboard products have slots of this specification. PCI devices
    refer to devices connected to these PCI slots, such as sound cards, network cards,
    and graphics cards. Kali Linux provides a command called `lspci` to view the list
    of PCI devices in the system.


    The execution command is as follows:


    ```

    root@exampleserver:～# lspci

    ```


    The above output information shows all PCI device information in the current system.
    From the output information, we can see that there are PCI devices such as motherboard
    chips, interface slots, graphics cards, and network cards.


    The user can see the driver module of the PCI device by using the `-v` option
    of the `lspci` command, and then confirm whether the device is correctly driven.


    The execution command is as follows:


    ```

    root@exampleserver:～# lspci -v

    ```


    From this interface, you can see the detailed information of the acquired PCI
    device. From the displayed information, you can see the driver information of
    each PCI device. For example, the graphics card driver used in the current system
    is `vmwgfx`.


    ### c) The virtual machine uses a USB device


    When users implement wireless penetration testing, they must use a wireless network
    card. However, in general, the built-in wireless network card chip in the system
    does not support wireless monitoring. Therefore, users must use a wireless network
    card with a USB interface to achieve this.


    If it is a physical machine, the user can directly insert the USB device into
    the host. If it is a virtual machine, the user needs to connect manually. In addition,
    you must start the virtual machine''s USB service (VMware USB Arbitration Service).
    Otherwise, the connected USB device cannot be recognized.


    The following section will take a USB wireless network card as an example to introduce
    the method of using USB devices in a virtual machine.


    The specific steps are as follows:


    #### 1) USB service of virtual machine.


    Right-click the "Computer" icon on the desktop, and select the `Manage` | `Services
    and Applications` | `Services` command in the pop-up menu to open the service.


    #### 2) VMware USB Arbitration Service.


    Find the `VMware USB Arbitration Service` in the list and ensure it is started.


    #### 3) Connecting the USB device.


    Insert the USB wireless network card into the host and use the virtual machine
    interface to connect the device.


    #### 4) Verifying the connection.


    Check if the device is correctly identified in the virtual machine.

    '
