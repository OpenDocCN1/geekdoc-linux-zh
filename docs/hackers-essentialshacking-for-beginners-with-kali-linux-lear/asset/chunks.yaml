    # 第 32 章


    ## 控制 Meterpreter 会话


    ![](img/image_rsrc49Z.jpg)


    ## 控制 Meterpreter 会话


    当渗透测试人员利用漏洞成功渗透目标系统并获取 Meterpreter 会话时，他可以使用漏洞模块支持的 Meterpreter 命令来控制 Meterpreter
    会话，以获取更多关于目标主机的信息或控制目标主机，例如关闭杀毒软件、键盘记录、截图、提升权限和创建账户等。本节将以获取的 Meterpreter 会话为例，介绍如何控制
    Meterpreter 会话。


    ### 关闭杀毒软件


    通常情况下，用户会在电脑上安装杀毒软件。为了方便其他操作，用户可以关闭杀毒软件。渗透测试人员获取目标主机的 shell 后，可以使用 `run killav`
    命令关闭目标主机的杀毒软件。


    命令如下：


    ```

    meterpreter> run killav

    ```

    从输出信息中，我们可以看到目标主机的杀毒服务已被杀死，`cmd.exe` 程序已结束。


    ### 获取目标主机的详细信息


    为了更好地了解目标主机的信息，可以使用 `sysinfo` 命令查看目标主机的系统信息。


    执行命令如下：


    ```

    meterpreter> sysinfo

    ```

    从输出信息中可以看到目标主机的详细信息。例如，计算机名为 `WIN-TJUIK7N16BP`；操作系统类型为 `Windows 2008 R2 (Build
    7600)`；架构为 `x64` 等。


    用户还可以使用 `run scraper` 命令查看目标主机的详细信息，并将其下载保存到本地。


    执行命令如下：


    ```

    meterpreter> run scraper

    ```

    从输出信息可以看出，已获取目标主机的详细信息。此外，获取的信息已下载并保存到本地的 `C:\Windows\TEMP` 目录。这些信息以 Windows 注册表的形式保存。


    ### 检查目标是否运行在虚拟机上


    用户还可以检查目标是否运行在虚拟机上。


    执行命令如下：


    ```

