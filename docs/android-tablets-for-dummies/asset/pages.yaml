- img_proc: true
  md: 'If you''d like to eschew using the alien mobile network and, potentially, avoid
    any unpleasant charges, disable the tablet''s Data Roaming option. Follow these
    steps:


    +   1. **Open the Settings app.**


    +   2. **In the Wireless & Networks section, tap the More item.**

    On some Samsung tablets, tap the Connections tab in the Settings app. The More
    item may be titled More Networks.


    +   3. **Choose Cellular Networks.**

    If you see a Mobile Networks item in the Wireless and Networks area, choose it
    instead and then choose Global Data Roaming Access.


    +   4. **Ensure that the Data Roaming option is disabled or denied.**


    On some tablets, the option is titled Global Data Roaming Access. Choose it and
    then choose the option Deny Data Roaming Access.


    On some Samsung tablets, follow these steps:


    +   1. **Open the Settings app and choose Mobile Networks.**


    +   2. **Choose Data Roaming Access.**


    +   3. **Select the option Deny Data Roaming Access and tap OK.**


    ![](img/d435d3e2564e3c6f2ff421dc0a90f095_285_0.png)


    Your tablet can access the Internet over the Wi-Fi connection while it''s roaming.
    Connecting to a Wi-Fi network doesn''t make you incur extra charges on your cellular
    bill.


    > Before traveling abroad, contact your cellular provider and ask about overseas
    data roaming. A subscription service or other options may be available, especially
    when you plan to stay overseas for an extended length of time.


    > If roaming concerns you, simply place the tablet into Airplane mode, as covered
    earlier in this chapter. In Airplane mode, your tablet can access Wi-Fi networks,
    but its cellular modem is definitely disabled.


    ![](img/d435d3e2564e3c6f2ff421dc0a90f095_285_1.png)'
