  md: '![](img/d435d3e2564e3c6f2ff421dc0a90f095_318_0.png)


    FIGURE 25-1:

    The popular game Plants Versus Zombies.


    Free or Lite versions of paid games are available in Google Play. Even so, a paid
    game is generally 99 cents. Treat yourself to a new paid game a month, or buy
    one before you leave on a trip to help yourself entertained.


    REMEMBER


    # Google Docs


    In previous editions of this book, I would recommend a specific note-taking app
    for jotting down information, lists, or other text on your tablet. Using such
    an app is no longer necessary because your Android tablet comes with Google Docs.


    Google Docs is really an Entire suite of apps, including word processing, a spreadsheet,
    and a presentation program. I know quite few businesses that use Google Docs exclusively,
    specifically because it allows for better document sharing than Microsoft Office.


    On my tablet, I use Google Docs to write quick notes and keep lists. For example,
    my shopping list is on a Google Doc. To access it, I open the Docs app, then choose
    a document thumbnail. I can read or edit the document. Also, because the documents
    are linked to my Google account, I can edit or view the document on any computer,
    laptop, or another Internet gizmo.


