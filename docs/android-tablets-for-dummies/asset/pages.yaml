    # # Foolish Assumptions


    Even though this book is written with the gentle handholding required by anyone
    who is just starting out, or who is easily intimidated, I''ve made a few assumptions.
    For example, I assume you''re a human being and not a colony creature from the
    planet Zantar.


    My biggest assumption: You have or desire to use a tablet that uses Google''s
    Android system. Your tablet might be an LTE tablet (one that uses the mobile data
    network) or a Wi-Fi-only model. This book covers both.


    The Android operating system comes in versions, or flavors. These versions are
    known by the Jelly Bean, Kit Kat, Lollipop, Marshmallow, and Nougat. To confirm
    the Android version is used on your tablet, follow these steps:


    +   1. At the Home screen, tap the Apps icon.


    Refer to Chapter 3 for a description of the Apps icon.


    +   2. Tap to open the Settings app.


    +   3. Choose About Tablet.


    This item might be named About Device. If you''re using a Samsung Galactic tablet,
    you might have to first tap the General tab atop the screen to locate the About
    item.


    +   4. Look at the item titled Android Version.


    The number that''s shown indicates the Android operating system version.'
