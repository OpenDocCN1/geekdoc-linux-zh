  md: '# Introduction


    Somewhere between a smartphone and a computer lies the premiere device of the
    21st century. It''s probably something you''ve never used but will soon be unable
    to live without it.It''s the tablet — specifically, an Android tablet.


    The Android tablet is a gizmo that could fully replace your computer, as well
    as several pieces of electronics you may take around. It''s an all-in-one, lightweight,
    battery-powered, long-lasting, fully mobile, telecommunications, information,
    and entertainment gizmo.


    Oh, but I do go on.


    As an Android tablet owner, or someone who''s interested in purchasing such a
    device, you want to get the most from your technology. Perhaps you''ve attempted
    to educate yourself using flimsy Getting Started leaflet that comes with the thing.
    Now you''re turning to this book, a wise choice.


    New technology can be intimidating. Frustrating. No matter what, your experience
    can be made better by leisurely reading this delightful, informative, and occasionally
    entertaining book.


    # About This Book


    Please don''t read this book from cover to cover. This book is a reference. It''s
    designed to be used as you need it. Look up a topic in the table of contents or
    the index. Find something about your tablet that vexes you or something you''re
    curious about. Look up the answer, and get on with your life.


    The overall idea for this book is to show how things are done on an Android tablet
    and to help you enjoy the device without overwhelming you with information or
    intimidating you into despair.


    +   Sample sections in this book include:

    - Unlocking the tablet

    - Activating voice input'
  merge: -1
  pgno: 18
- img_proc: true
  md: '+   * Importing contacts from a computer

    * Adding more email accounts

    * Placing a Hangouts phone call

    * Running Facebook on your tablet

    * Helping others find your location

    * Buying and renting movies

    * Flying with an Android tablet


    You have nothing to memorize, no sacred utterances or animal sacrifices, and definitely
    no PowerPoint presentations. Instead, every section explains a topic as it''s
    the first thing you read in this book. Nothing is assumed, and everything is cross-referenced.
    Technical terms and topics, when they come up, are neatly shoved to the side,
    where they''re easily avoided. The idea here isn''t to learn anything. My philosophy
    while writing this book was to help you look it up, figure it out, and get on
    with your life.


    # How to Use This Book


    This book follows a few conventions for using an Android tablet. First of all,
    no matter what your tablet has, whether it''s a manufacturer''s name or a pet
    name you''ve devised on your own, this book refers to your tablet as an Android
    tablet or, often, just tablet.


    The way you interact with the Android tablet is by using its touchscreen the glassy
    part of the device as it''s facing you. The device also has physical buttons,
    as well as holes and connectors. All these items are described in Chapter 1.


    The various ways to touch the screen are explained and named in Chapter 3.


    Chapter 4 covers text input on an Android tablet, which involves using an onscreen
    keyboard. When you tire of typing, you can dictate your text. It''s all explained
    in Chapter 4.


    This book directs you to do things by following numbered steps. Each step involves
    a specific activity, such as touching something on the screen; for example:


    +   1. Tap the Apps icon.


    Android Tablets For Dummies'
