  md: '# Using Hangouts


    You may find the Hangouts app launcher lurking on the tablet''s Home screen. Check
    inside the Google folder. Locate the app in the Apps drawer.


    When you first start the Hangouts app, it may ask whether you want to make phone
    calls. Of course do! Install the Hangouts Dialer — Call phones. If you''re not
    prompted, get the app from Google Play.


    Hangouts hooks into your Google account. You can connect with any one of your
    accounts who share a Google or Gmail account. Obey these steps:


    +   1. Tap the Side Menu icon.

    2. Choose Contacts from the navigation drawer.

    3. Tap a contact.

    4. Choose whether to text-chat (Hangouts Message), voice-call, or video-chat.

    5. Connect with the other person.


    If you choose Hangouts Message, you will see a screen similar to the text messaging
    app on your phone. Type a message to the other person. They type back (or not),
    and so it goes.


    In 8-1, you see the main Hangouts app screen. It shows conversations and indicates
    the type of chat: text (no icon), video, or voice.


    You can do anything else on the tablet while the Hangouts stays active. You''re
    alerted via notification of an impending Hangouts request. The notification icon
    is shown in the margin.


    > >> Conversations are archived in the Hangouts app. To peruse a previous chat,
    tap the Conversation tab and choose a conversation from the list. Video calls
    aren''t archived, but you can review when the call take place and with whom.


    > >> To remove a previous conversation, long-press it. Tap the Delete icon that
    appears after the screen.


    > >> Your friend can be on a computer or a mobile device to use Hangouts; it doesn''t
    matter which, the other person''s device must have a camera available to enable
    video chat.


