    # Chapter 13


    # Music, Music, Music


    Our Android tablet''s amazing arsenal of features includes the capability to play
    music. So it effectively replaces any gramophone you''ve been lugging around,
    which is the whole idea behind an all-in-one gizmo like an Android tablet. And
    beyond all your Eddie Cantor and Bing Crosby cylinders, you can add new tunes
    to the tablet''s music library. I hear this new guy Elvis is really something.


    # Listen Here


    Music is just a tap away on your Android tablet. Plug in some headphones, sum-mon
    a music-playing app, and choose tunes to match your mood. The Android app is called
    Play Music. It''s one of Google''s arsenal of “play” apps that entertain and inform
    you.


    # Browsing your music library


    The Play Music app opens the door to music on your tablet. You can choose to listen
    to a preprogrammed slate of music, purchase a music subscription service, or examine
    any music you''ve purchased or transferred to the device.'
