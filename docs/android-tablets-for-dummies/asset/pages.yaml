- img_proc: true
  md: '# Introducing the Camera app


    Google makes a standard Camera app, which is called Google Camera. Not every tablet
    uses that app, however. In fact, of all the apps on various Android tablets, the
    Camera app is the one that differs the most.


    Generally speaking, the Camera app features at least two shooting modes: Still
    and Video. Additional modes may offer features like a panorama and even-effects
    shots. All these shooting modes are handled by the single Camera app.


    The Camera app also controls the tablet''s camera: the main camera, which is on
    the tablet''s backside, and the front-facing camera, which is on the tablet''s
    front above the touchscreen.


    Figure 11-1 shows the Google Camera app''s main interface in Still Shot mode.
    To switch to Video mode, swipe the screen from left to right, as indicated in
    the figure.


    Shooting modes Side menu Viewfinder Self-timer


    ![](img/d435d3e2564e3c6f2ff421dc0a90f095_153_0.png)


    Figure 11-1: The Google Camera app, Still Shot mode.


    Swipe right for Video mode Swipe left for Still mode


    To show you how different things can be, Figure 11-2 shows the Camera app on a
    Samsung Galaxy Tab S2. This isn''t even the app you''d find on all Samsung galactic
    tablets; nope, each one can be unique.


    Similar items are present in both Figures 11-1 and 11-2, which is probably true
    for your tablet''s camera app as well. Refer to the next section for details on
    what''s important when it comes to taking pictures or recording video.'
  merge: -1
