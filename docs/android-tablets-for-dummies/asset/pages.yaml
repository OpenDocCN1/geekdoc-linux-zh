- img_proc: true
  md: '# The Maintenance Chore


    Relax. Maintenance of an Android tablet is simple and quick. Basically, I can
    summarize it in three words: Keep it clean. Beyond that, another maintenance worth
    of attention is backing up the information stored on your tablet.


    # Keeping it clean


    You probably already keep your Android tablet clean. Perhaps you''re one of those
    people who use their sleeves to wipe the touchscreen. Of course, better than your
    sleeve is something called a microfiber cloth. This item can be found at any computer-
    or off-supply store.


    ![](img/d435d3e2564e3c6f2ff421dc0a90f095_287_0.png)


    +   Never use any liquid to clean the touchscreen — especially ammonia or alcohol.
    These harsh chemicals damage the touchscreen, rendering it unable to detect your
    input. Further, they can smudge the display, making it more difficult to see.


    +   Touchscreen-safe cleaners are available for those times when your sleeve or
    even a microfiber cloth won''t cut it. Ensure that you get a cleaner designed
    for a touchscreen.


    +   If the screen gets getting dirty, consider adding a screen protector: This
    specially designed cover prevents the screen from getting scratched or dirty but
    still allows you to use your finger on the touchscreen. Be sure that the screen
    protector is designed for use with the specific brand and model of your Android
    tablet.


    # Backing up your stuff


    For a majority of the information on your Android tablet, backup is automatic.
    Your Google account takes care of Gmail, the calendar, your contacts, and even
    your apps. If you don''t download music, eBooks, or movies, nothing needs to be
    backed up — at least not manually.


    To confirm that your account information is being backed up, heed these steps:


    +   Open the Settings app and choose Accounts.


    +   On some Samsung tablets, tap the General tab to locate Accounts.


    +   Choose Google to access your Google account settings.'
  merge: -1
  pgno: 287
- img_proc: true
  md: '+   3. Ensure that the master control by each item in the list is enabled.


    These are the items that synchronize between the tablet and your Google

    account on the Internet.


    You''re not done yet!


    +   4. Tap the Back navigation icon until you''re returned to the main Settings

    app screen.


    On Samsung tablets, you can skip this step because the Settings app

    dplays categories on the left side of the screen.


    +   5. Choose Backup & Reset.


    +   6. Ensure the item Back Up My Data is On, or enabled.


    Beyond your Google account, which is automatically backed up, the rest of the

    information can be manually backed up. You can copy files from the tablet''s inter-

    nal storage to the cloud or your computer as a form of backup. See Chapter 17
    for

    information on coordinating files between the Android tablet and a computer.


    Yes, I agree: Manual backup isn''t an example of technology making your

    easier.


    # # Updating the system


    Every so often, a new version of the Android tablet''s operating system becomes

    available. It''s an Android update because Android is the name of the operating

    system, not because the Android tablet that it''s some type of robot.


    When an automatic update occurs, you see an alert or a message, indicating that

    system upgrade is available. The message may be as subtle as a notification icon,

    or it might be a card onscreen informing you that an update is necessary. My

    advice: Install the update and get it over with. Don''t daily.


    To manually check for updates, follow these steps:


    +   1. Open the Settings app.


    +   2. Choose About Tablet.


    This item may be titled About Device.


    +   3. Choose System Updates.


    On some Samsung tablets, the item is titled Download Updates Manually.


    ![](img/d435d3e2564e3c6f2ff421dc0a90f095_288_0.png)'
  merge: -1
  pgno: 288
- img_proc: true
  md: 'If any updates are pending, you see them listed. Tap the RESTART & INSTALL
    button. Otherwise, you can tap the CHECK FOR UPDATE button — though the but-ton
    isn''t magic, and tapping it doesn''t force an update when one isn''t available.


    +   - If possible, connect the tablet to a power source during a software update.

    You don''t need the battery in the middle of the operation.

    - Non-system updates may also be issued. For example, the tablet''s manufacturer
    may send out an update to the Android tablet''s guts. This type of update is often
    called a firmware update. With Android updates, my advice is to accept all firmware
    updates.


    # Battery Care and Feeding


    Perhaps the most important item you can monitor and maintain on your Android tablet
    is its battery. The battery supplies the necessary electrical juice by which the
    device operates. Without battery power, your tablet is basically an expensive
    trivet. Keep an eye on the battery.


    # Monitoring the battery


    Android tablets display the current battery status at the top of the screen, in
    the status area, next to the time. The icons used are similar to those shown in
    Figure 22-1. They can appear white–on–black or use a charming color scheme, as
    illustrated in the figure.


    ![](img/d435d3e2564e3c6f2ff421dc0a90f095_289_0.png)


    You might also see an icon for a dead battery, but for some reason I can''t get
    the Android tablet to turn on and display that icon.


    +   - Heed those low-battery warnings! The tablet sounds a notification whenever
    the battery power gets low. Another notification sounds whenever the battery gets
    very low.'
  merge: -1
  pgno: 289
- img_proc: true
  md: '+   When the battery level is low, the Android tablet shuts itself off.


    ![](img/d435d3e2564e3c6f2ff421dc0a90f095_290_0.png)


    +   The best way to deal with low battery power is to connect the tablet to a
    power source: Either plug it into a wall socket or connect it to a computer using
    a USB cable. The tablet begins charging immediately; plus, you can use the device
    while it''s charging.


    +   The tablet charges more efficiently when it''s plugged into a wall socket
    rather than a computer.


    +   You don''t have to fully charge the Android tablet to use it. When you have
    only 20 minutes to charge and get only a 70 percent battery level, that''s great.
    Well, it''s not bad, but it''s far better than a lower battery level.


    +   Battery percentage values are best-guess estimates. Just because you get 8
    hours of use from the tablet and the battery meter shows 20 percent remaining
    doesn''t imply that 20 percent equals 2 hours of use. In practice, the amount
    of time you have left is much less than that. As a rule, when the battery percentage
    value gets low, the battery appears to drain faster.


    ![](img/d435d3e2564e3c6f2ff421dc0a90f095_290_1.png)


    # Determining what is drawing power


    An Android tablet is smart enough to know which of its features and apps use the
    most battery power. You can check it out for yourself on the battery usage scene,
    as the one shown in Figure 22–2.


    To view the battery usage scene on your tablet, follow these steps:


    +   1. Open the Settings app.


    +   2. Choose Battery.


    On some Samsung tablets, you tap the General tab in the Settings app to locate
    the Battery item.


    Tap an item in the list to view specific details. For some items, the details
    scene hosts a button that lets you adjust power settings or even disable the feature.


    The number and variety of items shown on the battery usage depend depend on what
    you''ve been doing with your tablet between charges and how many different apps
    you''ve been using. Don''t be surprised if an item doesn''t show up in the list;
    not every app consumes a lot of battery power.'
  merge: -1
  pgno: 290
- img_proc: true
  md: '# Current battery charge and state


    # Usage and time chart Items consuming power


    ![](img/d435d3e2564e3c6f2ff421dc0a90f095_291_0.png)


    Figure 22-2: Things that drain the battery.


    Tap to view usage specifics or change settings


    # Extending battery life


    A surefire way to make a battery last a good, long time is to never turn off the
    device in the first place. That''s kind of impractical, rather than let you use
    your Android tablet as a high-tech sushi tray, I offer a smattering of suggestions
    you can follow to prolong tablet battery life:


    **Dim screen:** Refer to Figure 22-2, and you can see that the display (labeled
    Screen) draws a lot of battery power. Although a dim screen can be more difficult
    to see, especially outdoors, it definitely saves on battery life.


    **Lower the volume:** Consider lowering the volume for the various noises the
    Android tablet makes, especially notifications.


    **Disable the vibration options:** The tablet''s vibration is caused by a cheesy
    motor. Though you don''t see much battery savings by disabling the vibration options,
