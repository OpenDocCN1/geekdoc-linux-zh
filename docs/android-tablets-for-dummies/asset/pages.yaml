  md: '# Where to Keep Your Tablet


    Like your car keys, glasses, wallet, and phaser pistol, your Android tablet should
    be kept in a safe, easy-to-find, always handy place, whether you''re at home,
    work, on the road, or orbiting the Klingon home world.


    # Making a home for your tablet


    I recommend returning your Android tablet to the same spot whenever you finish
    using it. If you have a computer, my first suggestion is to make a spot right
    by the computer. Keep the charging cord handy, or just plug the cord into the
    computer''s USB port so that you can synchronize information with your computer
    on a regular basis, not to mention keep the tablet charged.


    Another handy place to keep the tablet is your nightstand. That makes sense, in
    addition to using the tablet for nighttime reading or video watching, it can serve
    as an alarm clock. (See Chapter 14.)


    Above all, avoid putting the tablet in a place where someone can sit on it, step
    on it, or otherwise damage it. For example, don''t leave the tablet on a counter
    or under a stack of newspapers, where it might get accidentally tossed out or
    put in the recycle bin.


    Never leave the tablet on a chair!


    As long as you remember to return the tablet to the same spot when you''re done
    with it, you''ll always know where it is.


    ![](img/d435d3e2564e3c6f2ff421dc0a90f095_35_0.png)


    # Taking the Android tablet with you


    If you''re like me, you probably carry the Android tablet around with you or from
    the office, at the airport, or tucked into your pants while you ride in a police
    car. I hope you''re not using the tablet while you''re driving. Regardless, it''s
    best to have a portable place to store your tablet while you''re on the road.


    The ideal place for the tablet is a specially designed pouch or sleeve. The pouch
    keeps the device from being dinged, scratched, or even unexpectedly turned on
    while it''s in your backpack, purse, or carry-on luggage or wherever you put the
    tablet when you''re not using it.


    Also see Chapter 21 for information on using an Android tablet on the road.'
