    said "Green cheese.


    When you hear folks say “Cheese” around your Android tablet, it''s most likely
    you''re taking advantage of the tablet''s photographic and video capabilities.
    Or I suppose that you could use the tablet as a festive cheese platter. Whenever
    you opt to take pictures or shoot video, turn to this chapter for helpful words
    of advice.


    # Android Tablet Camera 101


    Android tablet isn''t the world''s best camera. And I''m sure that Mr. Spock''s
    tricorder wasn''t the best camera in the Star Trek universe, either, but it could
    take pictures. That comparison is kind of the whole point: Your Android tablet
    is an incredible gizmo that does many things. One of things is to take pictures,
    which is the responsibility of the Camera app.'
