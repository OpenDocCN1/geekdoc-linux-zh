    # You’ve Got Email


    The first email message was sent back in the early 1970s. Programmer Ray Tomlinson
    doesn’t remember the exact text but guesses that it was probably something like
    “QWERTYUIOP.” Although that’s not as memorable as the first telegraph that was
    sent (“*What God wrought?”) or the first telephone message (“Mr. Watson, come
    here. I want you.”), it’s one for the history books.


    Today, email has become more functional and necessary, well beyond Mr. Tomlinson’s
    early tests. Although you could impress your email buddies by sending them “QWERTYUIOP,”
    you’re likely to send and reply to more meaningful communications. Your Android
    tablet is happily up to the task.


    # Android Tablet Email


    Historically, Android tablets used two apps for electronic mail: Gmail and Email.
    Recently, Gmail has been updated to handle all email, including Gmail itself as
    well as everything from traditional ISP email to web email to corporate email.
    If your tablet doesn’t have this update, you’ll find the traditional Email app,
    which you use for all your non-Gmail email.


