  md: '# # Shutting down an app run amok


    Sometimes an app goes up or crashes. You may see a warning message on the touchscreen,
    informing you that the app has been shut down. That''s good. What''s better is
    that you can shut down apps that misbehave or those you cannot otherwise stop.
    Follow these steps:


    +   1. **Open the Settings app.**


    +   2. **Tap the Apps item.**


    On Samsung tablets, choose Applications and then choose Application Manager. These
    items may be located on the Applications or General tab in the Settings app.


    +   3. **Choose the errant app from the list.**


    For example, if the Annoying Sound app is bothering you, you choose it from the
    list.


    +   4. **Tap the FORCE STOP button.**


    The app is terminated.


    > Use the FORCE STOP button only as a final act. Don''t kill any app or service
    unless the app is annoying or you are otherwise unable to stop it. Avoid killing
    off Google Services, which can change the tablet''s behavior or make the Android
    operating system unstable.


    ![](img/d435d3e2564e3c6f2ff421dc0a90f095_256_0.png)


    # # MOVING AN APP TO THE MICROSD


    On Android tablets with removable storage, you may find an option that moves the
    app from internal storage to the microSD card. My advice: Don''t.


    First, apps don''t occupy a lot of storage, so moving them to external storage
    isn''t saving anything. Second, you run the risk of losing the app should the
    storage vanish. Indeed, launcher icons for these apps disappear from the Home
    screen. Finally, the current trend is for Android tablets not to feature removable
    storage. So if moving apps to the microSD card works for you, it''s not a long-term
    solution.'
  merge: -1
  pgno: 256
- img_proc: true
  md: '# Apps Drawer Organization


    Some tablets offer tools for arranging apps in the Apps drawer. These tools allow
    you to present the apps in an order other than alphabetical, rearrange the apps,
    or even collect apps and place them into folders.


    The key to organizing the Apps drawer is to look for the Action Overflow or other
    actions on the screen. For example, some Samsung tablets feature an EDIT command,
    which is used to arrange icons in the Apps drawer. The A-Z command arranges apps
    in alphabetical order.


    You may find a FOLDER command that lets you build Apps drawer folders, or you
    might create folders by dragging icons over each other, similar to how folders
    work on the Home screen folder. Refer to the section “Working with folders,” earlier
    in this chapter, for more details.'
  merge: -1
