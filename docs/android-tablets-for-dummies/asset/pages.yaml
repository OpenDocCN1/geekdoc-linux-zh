    # Chapter 7

    Tablet Web Browsing


    > ''I''m certain that the World Wide Web was designed to be viewed on a computer.
    The monitor is big and roomy. Web pages are displayed amply, like Uncle Blake
    on the sofa watching a ballgame. The smaller the screen, however, the more difficult
    it is to view web pages designed for those roomy monitors. The web on a cell phone?
    Tragic. But on an Android tablet?


    Your tablet doesn''t have the diminutive screen of a cell phone, nor does it have
    a widescreen computer monitor. Instead, the tablet''s screen is a good size in
    between, like a younger, thinner version of Uncle Blake. That size is enjoyable
    for viewing the web, especially when you''ve read the tips and suggestions in
    this chapter.


    ![](img/d435d3e2564e3c6f2ff421dc0a90f095_104_0.png)


