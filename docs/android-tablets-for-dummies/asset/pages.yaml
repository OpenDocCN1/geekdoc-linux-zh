  md: '# Zedge


    The Zedge program is a helpful resource for finding wallpapers and ringtones —
    millions of them. It''s a sharing app, so you can access wallpapers and ringtones
    created by other Android users as well as share your own. If you''re looking for
    a specific sound or something special for Home screen wallpaper, Zedge is the
    best place to start your.


    In 25–2, you see a list of popular ringtones available from Zedge. Choose one
    to preview. If you like it, you can download the ringtone to your tablet or set
    it as the notification ringtone or set it for a specific app.


