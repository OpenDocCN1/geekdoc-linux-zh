- img_proc: true
  md: "# Getting to your destination\n\nAfter you arrive at your destination, the\
    \ tablet may update the date and time according to your new location. One additional\
    \ step you may want to take is to set the tablet's time zone. By doing so, you\
    \ ensure that your schedule adapts properly to your new location.\n\nTo change\
    \ the tablet's time zone, follow these steps:\n\n+   1. Open the Settings app.\n\
    2. Choose Date and Time.\n   On some Samsung tablets, tap the General tab to locate\
    \ the Date and Time item.\n3. If you find an Automatic Date & Time setting, ensure\
    \ that it's active.\n   If you're so; the tablet automatically updates its time\
    \ references. Otherwise, continue with Step 4.\n4. Choose Select Time Zone.\n\
    5. Pluck the current time zone from the list.\n\nIf you've set appointments for\
    \ your new location, visit the Calendar app to ensure that their start and end\
    \ times have been properly adjusted. If you're prompted to update appointment\
    \ times based on the new zone, do so.\n\n![](img/d435d3e2564e3c6f2ff421dc0a90f095_283_0.png)\n\
    \n> When you're traveling or change your time zone again, make sure that the tablet\
    \ is updated as well. When the Automatic Time Zone setting isn't available, follow\
    \ the steps in this section to reset the tablet's time zone.\n\n# The Android\
    \ Tablet Goes Abroad\n\nYes, your Android tablet works overseas. The two resources\
    \ you need to consider are how to recharge the battery and how to access Wi-Fi.\
    \ As long as you have both, you're pretty much set. You must also be careful about\
    \ mobile data (cellular) roaming surcharges when using an LTE tablet.\n\n# Using\
    \ overseas power\n\nYou can easily attach a foreign AC power adapter to your tablet's\
    \ AC power plug. You don't need a voltage converter — just an adapter. After it's\
    \ attached, you"
  merge: -1
  pgno: 283
- img_proc: true
  md: 'can plug your tablet into those weirdo overseas power sockets without the risk
    of blowing up anything. I charged my Android tablet nightly while I spent time
    in France, and It worked like a charm.


    # Accessing Wi-Fi in foreign lands


    Wi-Fi is pretty universal. The same protocols and standards are used everywhere,
    so if the tablet can access Wi-Fi at your local Starbucks, it can access Wi-Fi
    at the Malted Yak Batik Café in Wamboolaston. As long as Wi-Fi is available, your
    Android tablet can use it.


    +   See Chapter 16 for details on using Wi-Fi with your Android tablet.


    +   Internet cafes are more popular overseas than in the United States. They are
    the best locations for connecting your tablet and catching up on life back home.


    +   Many overseas hotels offer free Wi-Fi service, although the signal may not
    reach into every room. Don''t be surprised if you use the Wi-Fi network while
    you''re in the lobby.


    +   Obtain Skype Credit to use your Android tablet to make calls overseas. Skype''s
    international rates are quite reasonable. The calls are made over the Internet,
    so when the tablet has Wi-Fi access, you''re good to go. See Chapter 8 for more
    information on making Skype calls.


    ![](img/d435d3e2564e3c6f2ff421dc0a90f095_284_0.png)


    TIP


    # Disabling data roaming


    The word roam takes on an entirely new meaning when it''s applied to an LTE tablet
    (which features a cellular modem). Whenever you venture outside of your carrier''s
    service area, the tablet may end up latching onto another mobile data network.
    When that happens, the tablet is roaming.


    Roaming sounds handy, but there''s a catch: It almost always involves a surcharge
    for using another mobile data network — an unpleasant surcharge.


    Relax: Your cellular tablet alerts whenever you''re roaming. The Roaming icon
    appears in the status area, similar to the one shown in the margin. You may see
    the word Roaming on the Lock screen and witness the name of the foreign cellular
    provider where the local provider''s name normally appears.


    CHAPTER 21 On the Road 267'
  merge: -1
