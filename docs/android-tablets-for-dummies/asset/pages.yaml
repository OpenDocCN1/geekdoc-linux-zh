    # Chapter 18

    Apps and Widgets


    Of the more than 2 million apps available for your Android tablet, you probably
    want to keep a handful of your favorites ready and available. The best way to
    keep them accessible, neat, and tidy is to place their Launcher icons on the Home
    screen. Indeed, the whole point of having a Home screen is to keep handy apps
    and widgets.


    # Apps and Widgets on the Home Screen


    You can be an ideal observer, frustrated that the apps need don''t occupy your
    own postage stamp of real estate on the Home screen, or you can customize the
    Home screen to show those apps you use all the time.


    ![](img/d435d3e2564e3c6f2ff421dc0a90f095_244_0.png)


    The app icons on the Home screen are called launchers, or launcher icons.'
  merge: -1
