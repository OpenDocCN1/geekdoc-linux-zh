  md: '# Kindle


    Yes, your Android tablet comes with the Google Play Books app. Sometimes that''s
    not enough. Consider getting the Kindle app as well. You don''t need to use it
    exclusively, it''s just good to have options available.


    Obtain the Kindle from Google Play. Use your Amazon account to sign in. If you
    already have Kindle books, they''ll appear in the library. If not, go out and
    buy some books. The Kindle store often contains books not available from Google
    Play.


    # Movies by Flixster


    The Movies by Flixster app is your tablet''s gateway to Hollywood. It lists currently
    running films, premieres and openings, and it has links to your local theaters
    with show times and other information. The app is also tied to the popular Rot-Tomatoes
    website for reviews and feedback. If you enjoy going to the movies, you''ll find
    the Movies app a valuable addition to your tablet''s app library.


    # Sky Map


    Ever look up into the night sky and say, "What the heck is that?" Unless it''s
    a bird, an airplane, a satellite, or a UFO, the Sky Map can help you discover
    mysterious objects aloft. It may turn out that a particularly bright star in the
    sky is, in fact, the planet Jupiter.


    The Sky Map app works like a window you can look through to identify things in
    the night sky. Just start the app and hold up your tablet. Pan and tilt the device
    to identify planets, stars, and constellations.


    # Television Alternatives


    When you''re ready to cut the cable, your Android tablet is more than eager to
    step up to the plate and offer you a host of alternative TV and movie-watching
    resources. These apps offer media choices beyond what''s available at Google Play
    and viewable in the Play Movies & TV app. Here are my suggestions:'
  merge: -1
  pgno: 319
- img_proc: true
  md: '+   Netflix. The app is free, but you must have a Netflix subscription to access
    the content. When you do, you''ll be able to view the entire Netflix library of
    movies, TV shows, and documentaries on your Android tablet.


    +   Hulu. Similar to Netflix, Hulu offers current TV episodes, movies, foreign
    films, and other unique content to its subscription holders.


    +   HBO Now. If you cut the cable but miss Game of Thrones, you can obtain the
    HBO Now app and subscribe directly to the service. HBO Now offers every series
    ever broadcast on the network, as well as its current state of movie offerings.


    +   CBSN. When you miss news, consider getting the CBSN app, which shows a live
    feed of CBS news. The app is free.


    Other apps are available, but often to view shows or events you must currently
    have a cable TV subscription. This burden is not required for the above-listed
    apps. For example, the ESPN and CBS apps let you watch sports and live TV, but
    only when you have an active cable subscription. This restriction may change in
    the future.


    # Translate


    Not only Google''s Translate app assist with other apps in translating tongues
    into English, you can use the app directly to help you pass 3rd period French.
    I''m serious: I took an Italian course at a community college and just everyone
    used this app to help them get a C in that. Why a C? Because the translation is
    okay, it''s not perfect — and the professor knows when you''ve used it. Even so,
    it''s fun to play and brush up on anything from Chinese to Russian.


    # Voice Recorder


    All Android tablets have a microphone and speakers, so where is the voice recorder
    app? Don''t bother looking. If you need to record your blurts, conversations,
    or what new song you composed on the ukulele, get the Voice Recorder app. It has
    an elegant and simple interface: Touch the big Record to start recording. Make
    a note for yourself or record a friend doing his Daffy Duck Impression.


    Previous recordings are stored in a list on the Voice Recorder''s main screen.
    Each recording is shown with its title, the date and time of the recording, and
    the recording duration.


    Several voice recording apps can be found at Google Play. I recommend the one
    by Mamoru Tokashiki.'
