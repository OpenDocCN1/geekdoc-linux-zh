  md: '# Adding apps to the Home screen


    As you find yourself using an app frequently, consider slapping a launcher for
    the app on the Home screen. Here''s how that works:


    +   1. Visit the Home screen page on which you want to stick the launcher icon.

    The page must have room for the launcher icon. If it doesn''t, swipe the screen
    left or right to hunt down a page with room. Or, if you''re organizing pages by
    app type, visit the proper page. For example, on your tablet, the second Home
    page is just for games.

    2. Tap the Apps icon to display the Apps drawer.

    3. Long-press the app icon you want to add to the Home screen.


    After a moment, the Home screen page you chose in Step 1 appears, similar to the
    one in Figure 18-1.


    Drag the icon to a position on the Home screen


    ![](img/d435d3e2564e3c6f2ff421dc0a90f095_245_0.png)


    Favorites tray


    +   4. Drag the app to a position on the Home screen page.

    5. Lift your finger to place the app.


    Launcher icons on the Home screen are aligned to a grid. Other launchers may wiggle
    and jiggle when you find a spot. That''s okay.

    Don''t worry if the launcher isn''t in the exact spot you want. The later section
    "Moving launchers and widgets" describes how to rearrange items on the Home screen.'
  merge: -1
  pgno: 245
- img_proc: true
  md: 'The app hasn''t moved: What you see is a launcher, which is like a copy or
    shortcut. You can still find the app in the Apps drawer, but now the app is available
    — more conveniently — on the Home screen.


    +   - Newly installed apps often automatically affix a launcher icon to the Home
    screen.


    +   - Not every app needs a launcher icon on the Home screen. I recommend placing
    only few apps you use most frequently.


    +   - Some talets use the top row of the Apps drawer to list frequently accessed
    apps. Review the Apps drawer to peruse your frequent apps, and consider adding
    them to the Home screen if they''re not already.


    +   - You can''t create more launchers on the Home screen than will fit in the
    grid. As an alternative, rearranging launchers by moving some to another Home
    screen page, as covered in the later section "Moving launchers and widgets." Also
    see the later section "Working with folders" for another solution. If your tablet
    allows you to add more Home screen pages, you can solve the problem that way;
    see Chapter 19.


    ![](img/d435d3e2564e3c6f2ff421dc0a90f095_246_0.png)


    # Placing an app on the favorites tray


    The row of launchers at the bottom of the Home screen remains the same no matter
    which Home screen page you''re viewing. It''s called the favorites tray, and it''s
    an ideal spot for apps you use most frequently.


    Launchers are added to the favorites tray in one of ways:


    +   - Drag a launcher off the favorites tray, to either the Home screen page or
    the Remove or Delete icon. This step makes room for a new icon on the favorites
    tray.


    +   - Drag a launcher from the Home screen to the favorites tray, in which any
    existing icon swaps places with the icon that''s already there.


    Of these two methods, the second may not work on all tablets. In fact, the second
    method may create an app folder on the favorites tray, which is probably not what
    you want. (See the later section "Working with folders.")


    The best apps to place on the Home screen are those that show launcher notifications,
    similar to the icon shown in the margin. The apps include Facebook, Tw-ter, the
    Email app, and others.


    ![](img/d435d3e2564e3c6f2ff421dc0a90f095_246_1.png)


