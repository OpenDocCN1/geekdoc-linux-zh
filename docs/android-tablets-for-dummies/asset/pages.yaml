  md: '# Set Your Pictures and Videos Free


    Keeping your precious moments and memories in your tablet is an elegant solution
    to the problem of lugging around photo albums. But when you want to show your
    pictures to the widest possible audience, you need a much larger stage. That stage
    is the Internet, and you have many ways to send and save your pictures.


    # Posting a video to YouTube


    The best way to share a video is to upload it to YouTube. As a Google account
    holder, you also have a YouTube account. Why not populate that account with your
    latest, best videos? Who knows may go viral next!


    To upload a video you''ve recorded, follow these steps:


    +   1. Ensure that the Wi-Fi connection is activated.

    The best way to upload a video is to turn on the Wi-Fi connection, which (unlike
    the mobile network) doesn''t incur data surcharges. In fact, if you opt to use
    the 4G LTE network for uploading a YouTube video, you see a reminder about the
    data surcharges.

    2. Open the Photos app.

    3. View the video you want to upload.

    You do not need to play the video: just have it on the screen.

    4. Tap the Share icon.

    If you don''t see the Share icon, tap the screen.

    5. Choose YouTube.

    The Details screen appear. You may first see a tutorial on trimming the video,
    which is the next step.

    6. Trim the video, if necessary, resetting the start and ending points.

    If you opt to trim, drag the starting and ending points for the video left or
    right. As you drag, the video is scrubbed, allowing you to preview the start and
    end points.

    7. Type the video''s title.

    8. Set other options.

    Type a description, set the privacy level, add descriptive tags, and so on.


    ![](img/d435d3e2564e3c6f2ff421dc0a90f095_173_0.png)'
  merge: -1
  pgno: 173
- img_proc: true
  md: '# 9. Tap the Upload button.


    You return to the Photos app, and the video is uploaded. It continues to upload
    even if the tablet locks or you do other things on the tablet.


    The Upload notification appears while the video is being sent to YouTube. When
    the upload has completed, the notification stops animating and becomes the Uploads
    Finished icon. You also receive a Gmail message announcing your movie''s publication.


    To view your video, open the YouTube app. See Chapter 14 for details on using
    that app.


    # Sharing images with other apps


    Just about every app wants to get in the sharing bit, especially when it comes
    to pictures and videos. The key is to view an item full-screen in the Photos app
    and then tap the Share icon, shown in the margin. Choose an app to share the image
    or video, and that item is instantly sent to that app.


    What happens next?


    That depends on the app. For Facebook, Twitter, and other social networking apps,
    the item is attached to a new post. For Gmail, the item becomes an attachment.
    Other apps treat images and videos in a similar manner, somehow incorporating
    the item(s) into whatever wonderful that app does. The key is to look for that
    Share icon.'
