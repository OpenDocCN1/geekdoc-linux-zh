    # Playing a tune


    When you''ve found the proper tune to enhance your mood, play it! Tap on a song
    to play that song. Tap on an album to view songs in the album, or tap the album''s
    large Play button, shown in the margin, to listen to the entire album.


    While a song plays, controls appear at the bottom of the screen, as shown in the
    lower right corner in Figure 13-1. Tap that strip to view the song full-screen,
    as shown in Figure 13–2.


    While the song plays, you''re free to do anything else on the tablet. In fact,
    the song continues to play even when the tablet is locked. Choose the Play Music
    notification, shown in the margin, to return to the Play Music app, or you can
    use the controls in the notifications drawer or on the Lock screen to pause the
    song or skip to the next or previous tune.


    When the song is over, the next song in the play lists. The order depends on how
    you start the song. For example, if you start a song from Album view, all songs
    in that album play in the order listed.'
