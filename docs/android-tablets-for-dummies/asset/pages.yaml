  md: '# Adjusting display brightness


    You can set the screen brightness to very dim or very bright, or you can let the
    tablet determine the setting by using the ambient light in the room. Follow these
    steps:


    +   1. Open the Settings app and tap the Display item.

    On Samsung tablets, look for the Display item on the Device tab. This item might
    be titled Display and Wallpaper.

    2. Choose Brightness Level.

    3. Adjust the slider to the touchscreen''s intensity.


    If you''d rather have the tablet adjust the brightness for you, the master control
    by the Adaptive Brightness item to the On position, or tap to place a check mark
    in the Auto box. Not every tablet may feature this option.


    > > The Adaptive Brightness setting might be called Automatic Brightness.

    >> You might also find a Brightness setting in the tablet''s Quick Settings area.
    See Chapter 3 for information on accessing the Quick Settings.


    ![](img/d435d3e2564e3c6f2ff421dc0a90f095_263_0.png)


    # Lock Screen Settings


    The Lock screen is different from the Home screen, although the two locations
    share similar traits. As with the Home screen, you can customize the Lock screen.
    You can change the background, add app launcher shortcuts, and perform all sorts
    of tricks.


    > > Lock screen features might not be available for all Android tablets.

    >> For information on setting screen locks, as well as controlling the Lock screen
    notifications, refer to Chapter 20.


    # Setting the Lock screen background


    For most Android tablets, the Lock screen wallpaper is the same as the Home screen
    wallpaper. A few tablets, however, let you set a separate Lock screen wallpaper.'
