    # # eBook Reader


    Printed books are so 14th century. These days, reading material is presented electronically
    in the form of an eBook. The great Google way to read eBooks is to employ the
    Play Books app.


    Open the Play Books app to begin your reading experience. If you''ve been reading
    a book, the app opens to the last page you read. Otherwise, you view your entire
    book library, as shown in Figure 14–4.


    To view the library at any time, tap the Side Menu (shown in the margin) and choose
    the My Library command from the navigation drawer. Lists in the library are those
    titles you''ve obtained for your Google Books account. Swipe the screen to scroll
    through the selection.


    Tap a book to open it. If you''ve opened the book previously, you return to the
    page you read last. Otherwise, you see the book''s first page.


    Figure 14–5 illustrates the basic book-reading operation in the Play Books app.
    Swipe the screen from right to left to turn the “pages,” assuming that you''re
    reading English or other languages that read in that direction.


    The Play Books app works in both vertical and horizontal orientations. To lock
    the screen orientation, choose Settings from the navigation drawer and tap the
    Auto-Rotate screen item. Choose how you want the screen locked or not.


    If you don''t see a book in the library, tap the Action Overflow icon and choose
    Refresh.


    Books in Your Books library are stored on the Internet and available to read only
    when an Internet connection is active. It''s possible to keep a book on your tablet
    by downloading it to the device. Refer to Chapter 15 for details on downloading
    books.'
