  md: "+   IN THIS CHAPTER\n\n>> Cleaning an Android tablet\n>> Checking on the battery\n\
    >> Saving battery power\n>> Solving annoying problems\n>> Searching for support\n\
    >> Troubleshooting issues\n>> Getting answers\n\n# # Chapter 22\n Maintenance,\
    \ Troubleshooting, and Help\n\nMaintenance for your Android tablet is a lot easier\
    \ than it was in the old days. Back in the 1970s, tablet owners were required\
    \ to completely disassemble their devices and hand-clean every nut and sprocket\
    \ with using a wire brush. A special cloth was necessary to sop up all the electrical\
    \ oil. It was a nightmare, which is why most people never did tablet maintenance\
    \ back.\n\nToday, things are different. Android tablet maintenance is rather carefree,\
    \ involving little more than cleaning the thing every so often. No disassembly\
    \ is required. Beyond covering maintenance, this chapter offers suggestions for\
    \ using the battery, gives you some helpful tips, and answers some common questions.\n\
    \nCHAPTER 22 Maintenance, Troubleshooting, and Help 269"
  merge: -1
