  md: '# AVOIDING ANDROID VIRUSES


    How can you tell which apps are legitimate and which might be viruses or evil
    apps that do odd things to your Android tablet? Well, you can''t. In fact, most
    people can''t, because most apps don''t advertise themselves as such.


    The key to knowing whether an app is evil is to look at what it does, as described
    in this chapter. The key to knowing whether an app is malicious is to look at
    its access card: Open the app''s description in the Play Store app, and see which
    permissions it''s granted. If a simple grocery list uses the tablet''s microphone
    and the app doesn''t need to use the microphone, it''s suspect.


    In the history of the Android operating system, only a handful of malicious apps
    have been distributed, and most of them were found on devices used in Asia. Google
    removes malicious apps from its inventory. Google is also capable of remotely
    uninstalling malicious apps from your tablet. So you''re pretty safe.


    Generally speaking, avoid "hacker" apps, porn apps, and apps that use social engineering
    to make you do things on your tablet that you wouldn''t otherwise do, such as
    visiting an unknown website to see race pictures of politicians or celebrities.


    # Making a purchase at Google Play


    To purchase an app or media on Google Play, you tap the BUY button. A card appears,
    listing your preferred payment method, such as the example shown in Figure 15–3.


    In the figure, the album Brothers in Arms is listed for $9.49. The chosen payment
    method is a VISA card ending in 4870. To use that payment method, follow these
    steps:


    +   1. Tap the BUY button.


    For security, you''re prompted to type your Google password.


    +   2. Type your Google password.


    I strongly recommend that you do not choose the option Never Ask Me Again. You
    will be prompted every time for your password.


    +   3. Tap the Confirm button.'
