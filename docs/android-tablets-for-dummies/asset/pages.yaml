    # Connecting your tablet to a Mac


    You need special software to deal with the Android-to-Macintosh connection. Because''s
    Mac doesn''t natively recognize Android devices. Weird, how? It''s like Apple
    wants you to use some other type of transfer. I just don''t get it.


    To help with the USB connection on a Mac, obtain the Android File Transfer program.
    On your Mac, download that program from this website:


    ```

    android.com/filetransfer

    ```


    Install the software. Run it. From that point on, whenever you connect your Android
    tablet to the Mac, you see a special window appear, similar to the one shown in
    Figure 17-2. It lists the tablet''s folders and files. Use that window for file
    management, as covered later in this chapter.


    If the tablet has a microSD card inserted, you see two buttons on the Android
    File transfer program window: Tablet and Card, as shown in Figure 17-2. Click
    one or the other to see files and folders in that storage location.


    # Disconnecting the tablet from a computer


    The process is cinchy: When you''re done transferring files, music, or other media
    between a computer and your tablet, close all programs and folders opened on the
    computer — specifically, those you''ve used to work with the tablet''s storage.
    Then you can disconnect the USB cable. That''s it.'
