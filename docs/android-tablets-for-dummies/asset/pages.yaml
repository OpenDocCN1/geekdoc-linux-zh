  md: '# Quickly Switch Apps


    Android apps don''t quit. Sure, some of them have a Quit or Sign Out command,
    but most apps loiter in the tablet''s memory while you do other things. The Android
    operating system may eventually kill off a stale app. Before that happens, you
    can deftly and quickly switch between all running apps.


    The key to making the switch is to use the Recent navigation icon, found at the
    bottom of the touchscreen. Figure 23-1 illustrates two popular incarnations of
    the Recent navigation icon.


    ![](img/d435d3e2564e3c6f2ff421dc0a90f095_301_0.png)


    The Recent navigation icon and choose an app from the list. Swipe the list up
    or down peruse what''s available. To dismiss the list, tap the Back icon or Home
    icon.


    +   - On tablets that lack the Recent icon, long-press the Home navigation icon.

    - To remove an app from the list of recent apps, swipe it left or right. This
    is effectively the same thing as quitting an app.

    - Some tablets may feature a Task Manager. It''s usually a more technical representation
    of the items you find on the list of recent apps, with the addition of internal
    apps and services.

    - The list of recent apps is called the Overview, though everyone I know calls
    it the List of Recent Apps.


    # Install Apps from a Computer


    You don''t need to use an Android tablet to install apps. Using a computer, you
    can visit the Google Play website, browse for apps, and have that app installed
    remotely. It''s kind of cool yet kind of scary at the same time. Here''s how it
    works:'
