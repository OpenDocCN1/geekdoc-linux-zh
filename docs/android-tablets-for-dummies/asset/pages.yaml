    but unless you have only one album and enjoy all the songs on it, this organization
    problem won''t do. To better manage your music, you can create playlists. That
    way, you can hear the music you want to hear, in the order you want, for whatever
    mood hits.


    # Reviewing your playlists


    To view any playlists that you''ve already created, or have been preset on the
    tablet, tap the Playlists tab on the Music Library screen. Available playlists
    are displayed on the screen, similar to what''s shown in Figure 13-4.


