  md: 'Perhaps the issue isn''t with the tablet at all, but rather with the Wi-Fi
    network? Some networks have a “lease time” after which your tablet is disconnected.
    If so, follow the directions in Chapter 16 for turning off the tablet''s Wi-Fi
    and then turn it again. That often solves the issue.


    Another problem I''ve heard about is that the Wi-Fi router doesn''t recognize
    your Android tablet. In this case, the router might use older technology and it
    needs to be replaced. Especially if you have a Wi-Fi router over five years old,
    consider getting a newer router.


    # Music is playing and you want it to stop


    It''s awesome your tablet continues to play music while you do other things. Getting
    the music to stop quickly, however, requires some skill. You can access the play
    controls for the Play Music app from a number of locations. They''re found on
    the Lock screen, for example. You can also find them in the notifications drawer.


    # An app has run amok


    Sometimes, apps that misbehave let you know. You see a warning on the screen announcing
    the app''s stubborn disposition. When that happens, tap the Quit button to shut
    down the app. Then say, “Whew!”


    To manually shut down an app, refer to Chapter 18.


    # You’ve reached your wit’s end


    When all fails, you can do the drastic thing and perform a factory reset on your
    Android tablet. Before committing to this step, you should contact support as
