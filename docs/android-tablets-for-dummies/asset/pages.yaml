  md: 'To see which songs are in a playlist, tap the playlist''s card. To play the
    songs in the playlist, tap the first song in the list.


    A playlist is a helpful way to organize music when a song''s information may not
    been completely imported into your Android tablet. For example, if you''re like
    me, you probably have a lot of songs labeled Unknown. A quick way to remedy this
    situation is to name a playlist after the artist and add those unknown songs to
    the playlist.


    TIP


    # Creating your own playlists


    The Play Music app features “auto” playlists, three of which are shown in Figure
    13–4. Beyond those, the playlists you see are those you create. Here''s how it
    works:


    +   1. Locate some music you want to add to a playlist.

    2. Tap the Action Overflow icon by the album or song.

    3. Choose Add to Playlist.


    Ensure that you''re viewing a song or an album; otherwise, the Add to Playlist
    action doesn''t show up.


    +   4. Choose an existing playlist or, to create a new playlist, tap NEW PLAYLIST.


    If you create a new playlist, tap a name for the playlist and tap the CREATE PLAYLIST
    button.


    The song or album is added to the playlist you selected, or it''s placed into
    a new playlist you created. You can continue to add songs to the playlist by repeating
    these steps.


    +   >> You have tons of playlists on your tablet and as many songs into them as
    you like. Adding songs to a playlist doesn''t affect the tablet''s storage capacity.


    +   >> To remove a song from a playlist, open the playlist and tap the Action
    Overflow by the song and choose Remove from Playlist.


    +   >> Removing a song from a playlist doesn''t delete the song from the library;
    see the later section "Removing unwanted music."


    +   >> Songs in a playlist can be rearranged: While viewing the playlist, use
    the tab on the far left of a song title to drag that song up or down in the list.


    +   >> To delete a playlist, tap the Action Overflow icon in the right corner.
    (Refer to Figure 13–4.) Choose Delete and tap OK to confirm.'
