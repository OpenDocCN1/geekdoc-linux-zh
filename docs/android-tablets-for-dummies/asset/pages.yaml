  md: 'When you’re ready to erase all the tablet’s data, follow these steps:


    +   1. Start the Settings app and choose Backup & Reset.


    On some Samsung tablets, tap the General tab to locate the Backup & Reset item.


    +   2. Choose Factory Data Reset.


    +   3. Tap the RESET TABLET or RESET DEVICE button.


    +   4. If prompted, work the screen lock.


    This level of security prevents others from idling messing with your tablet.


    +   5. Tap the ERASE EVERYTHING or DELETE ALL button to confirm.


    All the information you’ve set or stored on the tablet is purged, including all
    your accounts, apps you’ve downloaded, music — everything.


    ![](img/d435d3e2564e3c6f2ff421dc0a90f095_276_0.png)


    Practical instances when this action is necessary include selling your tablet
    or giving it to someone else to use. That’s the perfect time to perform a factory
    reset.


    # It’s Everyone’s Tablet!


    Computers have long featured the capability to allow multiple users on the device.
    Each person has their own sign-in, with separate email and other online accounts,
    customizations, and features. It’s a good idea for a computer, but for a tablet?


    The best solution for multiple users is to get multiple Android tablets. When
    that’s impractical, and you really want to share your beloved gizmo, configure
    the device so that each human has their own user account. That includes accounts
    for the kiddies.


    # Adding another user


    Your tablet already has one account — yours! It appears as a tiny circle on the
    Lock screen, located in the upper right corner, similar to the one shown on the
    left in 20–2.


    To add accounts, first apply a secure screen lock to your account. See the earlier
    section “Lock Your Tablet.” I strongly recommend a PIN or Password screen lock.'
