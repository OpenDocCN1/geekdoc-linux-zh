    # Changing the way the web looks


    As I rant at the start of this chapter, the web on a tablet will never look as
    good as web on a computer. You do have a few options for making it better.


    First and foremost, remember that you can orient the device horizontally and vertically,
    which rearranges the way a web page is displayed.


    You can spread your fingers to zoom in any web page, but when you find yourself
    doing too often, consider resetting the screen size:


    +   1. Tap the Action Overflow icon and choose Settings.


    +   2. Choose Accessibility.

    This item might be titled Screen and Text in some web browser apps.


    +   3. Use the Text Scaling slider to adjust the text size.

    The preview below the slider helps you gauge which size works best.


    # Setting privacy and security options


    Pretty much every web browser app available to Android tablets presents premium
    settings. The only issue you should consider is how information is retained and
    automatically recalled. You may want to disable some of those features.


    +   1. Tap the Action Overflow icon and choose Settings.


    +   2. Choose Privacy.


    +   3. Tap the Clear Browsing Data button.


    +   4. Place check marks by these items you want removed from the tablet’s storage.


    +   5. Tap the CLEAR DATA button.


    Some web browser apps might present options for remembering form data or passwords.
    If so, remove the check marks by these items. Also, delete any personal data,
    if that’s an option.'
