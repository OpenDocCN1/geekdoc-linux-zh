- img_proc: true
  md: '# Using basic camera controls


    Here are some pointers to consider when using your tablet to take a still shot
    or record a video:


    +   - The tablet can be used as a camera in either landscape or portrait orientation.

    Don''t worry either way: The image is always saved with the proper side up.


    +   You can take as many pictures or record as much video with your tablet as
    you like, as long as you don''t run out of space in the tablet''s internal storage
    or external storage.


    +   A tablet with a microSD card installed automatically saves images to that
    location. Otherwise, images are saved internality.


    +   See Chapter 12 for information on previewing and managing pictures and videos.


    ![](img/d435d3e2564e3c6f2ff421dc0a90f095_154_0.png)'
  merge: -1
  pgno: 154
- img_proc: true
  md: 'If you''re recording a video, please-o-please use the tablet in a horizontal
    orientation. That''s the way people expect to see video, and your fans on YouTube
    will appreciate the proper orientation.


    The tablet''s touchscreen serves as the viewfinder; what you see on the screen
    is exactly what appears in the final photo or video.


    Tap the screen to focus on a specific object. You see a focus ring or square that
    confirms how the lens is focusing. Not every tablet has a camera that can focus;
    I''ve not seen any front-facing camera that can focus.


    Spread your fingers on the touchscreen to zoom.


    Pinch your fingers on the touchscreen to zoom out.


    Some tablets use the volume key to zoom in or out: Volume Up zooms in, Volume
    Down zooms out. On other cameras, press the volume key to take still shot, a function
    that works even when you record video.


    Hold the tablet steady! I recommend using two hands for taking a still shot and
    for shooting video.


    The phone stores pictures and videos in the DCIM/Camera folder. Still images are
    stored in the JPEG or PNG format; video is stored in the MPEG-4 format.


    # Capturing a still shot


    Taking a still image requires only two steps. First, ensure that the Camera app
    is in Single-Shot mode. Second, tap the Shutter icon to snap the photo.


    In the Google Camera app, to ensure that you''re in Single-Shot mode, check for
    the Shutter icon, shown in the margin. (Also refer to Figure 11-2 for what the
    Shutter icon looks like on a Galaxy Tab.)


    The image you see in the Camera app''s viewfinder is what you see for the final
    photo.


    Most Camera apps play a shutter sound when a still-shot image is taken.


    Set the resolution before you shoot. See the later section "Choosing resolution
    and quality."'
  merge: -1
  pgno: 155
- img_proc: true
  md: '# Recording video


    To record video, switch the Camera app to Video mode. The Shutter icon becomes
    the Record icon, similar to the one shown in the margin and in Figure 11-3. Tap
    that icon to start recording. The elapsed time, and maybe even storage consumed,
    appears on the touchscreen as video is being recorded.


    Stop recording

    Recording time Take still shot


    ![](img/d435d3e2564e3c6f2ff421dc0a90f095_156_0.png)


    Tap the Stop icon to end the recording.


    +   In the stock Android app, shown in Figure 11-3, swipe the screen from right
    to enter Video-Recording mode.

    On some Samsung tablets, you tap the Record button on the Camera app’s screen.
    (Refer to Figure 11-2). Some tablets may feature a Still/Video toggle that switches
    the Camera app between Still Shot and Video modes.

    Some Camera apps feature the Pause icon. Tap that icon to temporarily suspend
    recording. Tap the Record icon to resume. The video you record is saved as a single
    video as opposed to multiple videos.

    Some versions of the Camera app may allow you to grab a still image while the
    tablet is recording: Tap the screen or press the volume key to snap and save a
    still shot.

    Hold the tablet horizontally when you record video.


