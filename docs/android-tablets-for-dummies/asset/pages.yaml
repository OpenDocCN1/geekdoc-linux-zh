  md: '# The World of Apps


    You probably didn''t purchase a tablet so that you could enjoy the thrill-a-minute
    punch that''s packed by the Android operating system. No, an Android tablet''s
    success lies with the apps you obtain. Knowing how to deal with apps is vital
    to being a successful, happy Android tablet user.


    # Starting an app


    To start an app, tap its launcher. The app starts.


    Apps can be started from the Home screen: Tap a launcher to start the associated
    app. Apps can be started also from the Apps drawer, as described in the later
    section "Finding an app in the Apps drawer."


    You can also start an app found in a Home screen folder: Tap to open the folder,
    and then tap a launcher to start that app.


    # Quitting an app


    Unlike a computer, you don''t need to quit apps on your Android tablet. To leave
    an app, tap the Home icon to return to the Home screen. You can keep tapping the
    Back icon to get out of an app. Or you can tap the Recent to switch to another
    running app.


    +   - Some apps feature a Quit command or an Exit command, but for the most, you
    don''t quit an app on your tablet — not like you quit an app on a computer.


    +   - If necessary, the Android operating system shuts down apps you haven''t
    used in a while. You can directly stop apps run amok, which is described in Chapter
    18.


    ![](img/d435d3e2564e3c6f2ff421dc0a90f095_58_0.png)


    # Finding an app in the Apps drawer


    The launchers you see on the Home screen don''t represent all the apps in your
    tablet. To view all installed apps, you must visit the Apps drawer: Tap the Apps
    icon on the Home screen. This icon has a different look to it, depending on your
    tablet. Figure 3–8 illustrates common versions of the Apps icon, though many may
    exist.'
