  md: '# Everybody Was Touchscreen Typing


    In the 21st century, typing has become a basic human activity. Typing on a touchscreen
    keyboard, however, is still wacky. Don''t feel bad if you''re the world''s fastest
    typist yet can only hunt-and-peck on the tablet''s screen. That''s the limitation
    everyone has to face. Your Android tablet offers some tricks to make the pain
    less uncomfortable.


    # Typing one character at a time


    The onscreen keyboard is pretty easy to figure out: Tap a letter to produce the
    character. As you type, the key you use is highlighted. The tablet may give a
    wee bit of feedback in the form of a faint click or vibration.


    +   - To type in all caps, tap the Shift key twice. The Shift key may appear highlighted,
    the shift symbol may change color, or a highlighted may may appear on the key,
    which indicates that Shift Lock is on. Tap the Shift key again to deactivate Shift
    Lock.

    - Above all, it helps to type slowly until you get used to the onscreen keyboard.

    - A blinking cursor on the touchscreen shows where new text appears, which is
    similar to how typing text works on a computer.

    - When you make a mistake, tap the Delete key to back up and erase.

    - When you type a password, the character you type appears briefly, but for security
    reasons, it''s replaced by a black dot.

    - See the later section "Text Editing and Correcting" for more details on editing
    your text so that you can fix those myriad typos boo-boos.


    ![](img/d435d3e2564e3c6f2ff421dc0a90f095_67_0.png)


    # Accessing special characters


    You''re not limited to typing only the characters shown on the alphabetic keyboard.
    On the Google Keyboard, tap the ?123 key to access two additional keyboard layouts,
    as shown in Figure 4-4.


