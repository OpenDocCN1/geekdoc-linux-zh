    # Touching the touchscreen


    Minus any buttons and knobs, the way you control an Android tablet is to manipulate
    things on the touchscreen with one or two fingers. It doesn''t matter which fingers
    you use, and you should feel free to experiment with other body parts as well,
    though I find fingers to be handy.


    Here are some of the common ways to manipulate the touchscreen:


    +   **Tap:** The basic touchscreen technique is to touch it. You tap an object,
    an icon, a control, a menu item, a doodad, and so on. The tap operation is similar
    to a mouse click on a computer. It may also be referred to as a *touch* or a *press*.


    +   **Double-tap:** Tap the screen twice in the same location can be used to zoom
    in on an image or a map, but it can also zoom out. Because of the double-tap''s
    dual nature, I recommend using the pinch or spread operation to zoom.


    +   **Long-press:** Tap part of the screen and keep your finger down. Depending
    on what you''re doing, a pop-up menu or card may appear, or the item you''re long-pressing
    may get "picked" so that you can drag (move) it around. Long-press might also
    be referred to as *tap* and *hold*.


    +   **Swipe:** To swipe, tap your finger on one spot and then move your finger
    to another spot. Swipes go up, down, left, or right; the touchscreen content moves
    in the direction you swipe your finger. A swipe can be fast or slow. It is also
    called a *flick* or *slide*.


    +   **Drag:** A combination of long-press and then swipe, the drag operation moves
    items on the screen. Start with the long-press, and keep your finger on the screen
    to swipe. Lift your finger to complete the action.


    +   **Pinch:** A pinch involves two fingers


    +   **Spread:** The opposite of pinch is spread. You start with your fingers and
    then spread them. The spread is used to zoom in, to enlarge an image, or see more
    detail on a map. It''s also known as a *pinch open*.


    +   **Rotate:** A few taps let you rotate an image on the screen by touching with
    two fingers and twisting around a center point. If you have trouble with this
    operation, pretend that you''re turning the dial on a safe.'
