    special features and others that supposedly make the onscreen typing experience
    more enjoyable. I''ll leave it up to you to determine whether that''s true.


    # Generating keyboard feedback


    The onscreen keyboard can help with your typing by generating haptic feedback.
    This is in the form of either a pleasing click sound or the tablet''s vibration.
    Check these settings, follow these steps:


    +   1. Open the Settings app and choose Language & Input.

    2. Choose Google Keyboard and then Preferences.

    3. Set the Sound on Keypress master control to the On position.


    Samsung tablets follow a different set of steps:


    +   1. Open the Settings app and choose Language & Input.

    2. Choose Samsung Keyboard.

    3. Choose Key-Tap Feedback.

    4. Set the master control by the Sound item to the On position.


    On some Samsung tablets, look for this item on either the General or Controls
    tab.


    Not every tablet features vibration.


    # Ensuring that predictive text is active


    Predictive text is on all the time when you use the Google Keyboard. Not every
    Android tablet uses that keyboard, so to ensure that the feature is active, follow
    these steps:


    +   1. Open the Settings app and choose Language & Input.

    2. Choose Google Keyboard and then Preferences.


    On Samsung tablets, choose the Samsung Keyboard item.'
