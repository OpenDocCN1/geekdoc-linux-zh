    # Going incognito


    ![](img/d435d3e2564e3c6f2ff421dc0a90f095_110_0.png)


    Shhh! For secure browsing, use an incognito tab: Tap the Action Overflow and choose
    New Incognito Tab. The incognito tab takes over the screen, changing the look
    of the Chrome app and offering a description page.


    When you go incognito, the web browser doesn''t track your history, leave cookies,
    or provide other evidence of which web pages you''ve visited.


    To switch between incognito tabs and regular tabs, tap the Incognito icon in the
    upper right corner of the Chrome app''s screen, as seen in the margin.


    To close all incognito tabs, pull down the notification drawer and choose the
    Chrome notification, Close All Incognito Tabs.


    # Searching the web


    The easiest way to find things on the web is to use the Google Now app, covered
    in Chapter 14. You can also use the Google Search widget on the Home screen. If
    it''s not there, refer to Chapter 18 for information on adding widgets to the
    Home screen.


    While you''re using the web browser app, search text into the Address bar. Or
    you can visit any number of search engines. Google would most enjoy it if you
    used google.com.'
