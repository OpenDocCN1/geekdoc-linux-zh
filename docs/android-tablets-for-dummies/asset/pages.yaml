  md: '# There’s No Place Like Home Screen


    The Home screen is where you start your Android day. It''s the location from which
    you start an app. Knowing about the Home screen is an important part of understanding
    your Android tablet.


    To view the Home screen at any time, tap the Home navigation icon found at the
    bottom of the touchscreen. Some tablets feature a physical Home button or key,
    which performs the same duties as the Home navigation icon.


    # Touring the Home screen


    The typical Android tablet Home screen is illustrated in Figure 3-4. Several fun
    and interesting things appear on the Home screen. Find these items on your tablet''s
    Home screen:


    +   **Status bar:** This area at the top of the screen is the status bar. It shows
    notification icons and status icons, including the current time. The status bar
    may disappear, in which case a quick swipe of the screen from the top redraw displays
    it.


    +   **Notification icons:** These icons come and go, depending on what happens
    in your digital life. For example, new icons appear when you receive a new email
    message or have a pending appointment. See the later section "Reviewing notifications."


    +   **Status icons:** These icons represent the tablet''s current condition, such
    as the type of network connection, signal strength, battery status, and well as
    other items.


    +   **App launchers:** These icons represent apps installed on your tablet. Tap
    a to run the associated app.


    +   **Widgets:** Widgets work like teensy programs that display information or
    let you control the tablet, manipulate a feature, access an app, or do something
    purely amusing.


    +   **Folders:** Multiple launchers can be stored in a folder. Tap the folder
    to open it and view the launchers inside. See Chapter 18 for more information
    on folders.


    +   **Wallpaper:** The background image you see on the Home screen is the wallpaper.'
  merge: -1
