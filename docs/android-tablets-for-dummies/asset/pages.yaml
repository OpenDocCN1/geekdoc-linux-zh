    # Setting the screen lock timeout


    You can manually lock your tablet at any time by pressing the Power/Lock key.
    That''s probably why it''s called the Power/Lock key, though I have my doubts.
    When you don''t manually lock the tablet, it automatically locks after a given
    period of inactivity. Obey these steps to set that duration:


    +   1. Open the Settings app and choose Display.


    On some Samsung tablets, you need to first tap the Device tab before you locate
    the Display item.


    +   2. Choose Sleep.


    This item is titled Timeout on some tablets.


    +   3. Select a timeout value from the list.


    I prefer a value of ten minutes.


    The lock timer measures inactivity; when you don''t touch the screen, the timer
    starts ticking. About five seconds before the timeout kicks in, the touchscreen
    dims. When the touchscreen turns off and the tablet locks. If you touch the screen
    before then, the timer is reset.


    The Lock screen has its own timeout. If you unlock the tablet but don''t work
    the screen lock, the tablet locks itself automatically after about ten seconds.
    The timeout value cannot be adjusted.


    ![](img/d435d3e2564e3c6f2ff421dc0a90f095_262_0.png)'
  merge: -1
