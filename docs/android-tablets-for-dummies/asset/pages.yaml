  md: '# WONDERFUL WIDGETS


    Like apps, widgets appear on the Home screen. To use a widget, tap it. What happens
    after that depends on the widget and what it does.


    For example, the YouTube widget lets you peruse videos. The Calendar widget shows
    a preview of your upcoming schedule. A Twitter widget may display recent tweets.
    Other widgets do interesting things, display useful information, or give you access
    to the tablet''s settings and features.


    New widgets are obtained from Google Play, just like apps. See Chapter 18 for
    information on working widgets on the Home screen.


    FIGURE 3-8: Apps icon varieties.


    ![](img/d435d3e2564e3c6f2ff421dc0a90f095_59_0.png)


    After you tap the Apps icon, you see the Apps drawer. Swipe through the icons
    and down or left and right across the touchscreen.


    To run an app, tap its icon. The app starts, taking over the screen and drawing
    whatever magical thing that app does.


    +   As you add apps to your tablet, they appear in the Apps drawer. See Chapter
    15 for information on adding new apps.


    +   The Apps drawer may frequently opened apps at the top of the list. Apps are
    good candidates for adding to the Home screen. See Chapter 18 for details on adding
    apps to the Home screen.


    +   Some tables allow you to create folders in the Apps drawer. These folders
    contain multiple apps, which helps keep things organized. To access apps in the
    tablet, tap the Folder icon.


    +   The Apps drawer displays apps alphabetically. On some tables, you can switch
    to a non-alphabetical viewing grid. With that feature active, it is possible to
    rearrange the app icons in any order you like.


