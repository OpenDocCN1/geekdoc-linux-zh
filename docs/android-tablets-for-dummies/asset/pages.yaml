    # Chapter 8 Text, Voice, and Video


    The holy grail of communications has always been video in the 1960s, the video
    phone was touted as the harbinger of the future. The film 2001: A Space Odyssey
    features a key character making a video call to his daughter on the “Bell network.”
    (Cost: $1.70) Obviously, seeing and speaking on a phone was considered a big deal.


    Years after that film was to taken place, a video phone call is more commonly
    known as a video chat. It''s a feature that your Android tablet is more capable
    of offering, along with text messaging, voice chat, and even real phone calls.
    The future is here — and rather cost $1.70 for a 2-minute video call, it''s free.


    # Can We Hangouts?


    The great Googly way to text-message, voice-chat, and video-chat with your online
