    really need to manage apps. The Android operating system deftly handles the task
    for you. Still, you have a few duties you can perform.


    # # Reviewing your apps


    To peruse the apps you''ve downloaded from Google Play, follow these steps:


    +   1. Open the Play Store app.

    2. Ensure that you''re at the top level in the app.

    3. Tap the Side Menu icon.

