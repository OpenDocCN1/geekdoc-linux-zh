  md: '# Unediting an image


    The changes you make are directly applied to the image; an original copy isn''t
    retained. To remove any previously applied edits, crops, or rotation effects,
    view the image in the Photos app and follow these steps:


    +   1. Tap the Edit icon to edit the image.

    2. Tap the Action Overflow.

    3. Choose Undo Edits.

    4. Tap the SAVE button.


    The original image is restored.


    # Cropping


    To crop an image is to snip away parts you don''t want or need, similar to taking
    a pair of scissors to a photograph of you and your old girlfriend, though the
    process is far cathartic. To crop an image, obey these steps:


    +   1. View the image in the Photos app.

    2. Tap the Edit icon.

    3. Tap the Crop / Rotate icon.

    4. Drag any of the four corners to crop the image.


    > The icon is shown in the margin. The screen changes as illustrated in Figure
    12-4. The tools present crop and rotate the image.


    As you drag, portions of the image are removed. You can also drag the image within
    the cropping rectangle to modify the crop action.


    +   5. Tap the Done button.


    The image is cropped. You can continue to edit, or tap the SAVE button to make
    the changes permanent.


    If you''re unhappy with the changes after tapping the Done button, tap the Action
    Overflow and choose Undo Edits.


    Use the Aspect Ratio (refer to Figure 12-4) to adjust the cropping box for the
    image to a new presentation, such as square or widescreen.


