- img_proc: true
  md: '> A “flash” setting is also available for shooting video in low-light situations.
    In that case, the flash LED is on the entire time. This setting is made similarly
    to setting the flash, though the options are only On and Off. It must be set before
    you shoot video, and, yes, it devours a lot of battery power.


    # Choosing resolution and quality


    You don''t always have to set the highest resolution or top quality for images
    and videos. Especially when you''re shooting for the web or uploading pictures
    to Facebook, top quality is a waste of storage space and upload time because the
    image is on a relatively low-resolution computer monitor.


    As you may suspect, setting the image resolution or video quality differs by the
    various Camera apps. No matter what, you must set the new still-shot resolution
    or video quality before you.


    In the Google Camera app, follow these steps to access still-shot resolution and
    video-quality settings:


    +   1. Tap the Side Menu icon to display the Camera app''s shooting modes.

    2. Tap the Settings icon.

    3. Choose Resolution & Quality.

    4. Tap a mode and a camera (back or front).

    5. Choose a resolution or video-quality setting from the list.'
  merge: -1
  pgno: 160
- img_proc: true
  md: 'or Photo Size. You may also switch cameras (back or front) before setting the
    resolution.


    ![](img/d435d3e2564e3c6f2ff421dc0a90f095_161_0.png)


    +   >> Set the resolution describes how many pixels, or dots, are in the image.

    >> A picture''s resolution describes more dots, the better the image looks when
    enlarged.

    >> The resolution and video-quality choices are more limited on the front-facing
    camera because it''s not as sophisticated as the rear camera.

    >> The aspect ratio describes the overall dimensions horizontally by vertical.
    A 4:3 ratio is pretty much for photographs and is similar in proportion to the
    tablet screen. The 16:9 ratio is the widest format.

    >> Video quality settings HD and SD refer to High Definition and Standard Definition,
    the p value represents vertical resolution, with higher indicating higher quality.


    +   >> Megapixel is a measurement of the amount of information stored in an image.
    One megapixel is approximately 1 million pixels, or individual dots that comprise
    an image. It''s often abbreviated MP.


    ![](img/d435d3e2564e3c6f2ff421dc0a90f095_161_1.png)


    # Checking the location tag feature


    Your Android tablet not only takes pictures but also keeps track of where you
    are located when you take the picture — if you''ve activated that option. The
    feature is called location tag, geotag, or GPS-tag.


    To confirm the location-tag setting in the Google Camera app, follow these steps:


    +   1. Tap the Side Menu icon and choose Settings.


    +   2. Enable or disable the Save Location feature.


    The master control by the Save Location item is either on or off, reflecting the
    location-tag setting.


    For the Camera app on some Samsung tablets, obey these steps to check the location-tag
    feature:


    +   1. Tap the Settings icon on the main Camera app screen.


    Refer to 11-2, though on Galactic tablet the icon''s location may be different.


    +   2. Set the master control by the Location Tags item on or off.


    144 PART 3 Omni Tablet'
