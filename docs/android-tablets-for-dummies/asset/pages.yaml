    +   1. Choose the Camera app''s Panorama mode.

    For the stock Android app, tap the Side Menu icon (in the upper left of the screen),
    and then tap the Panorama icon, shown in the margin.

    On some Samsung tablets, tap the MODE button and choose Panorama.


    +   2. Hold the tablet steady, and then tap the Shutter icon.'
