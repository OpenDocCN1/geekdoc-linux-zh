  md: '# ANDROID TABLET PURCHASING TIPS


    The major things to look for when purchasing an Android tablet are the screen
    size and whether you want an LTE or a Wi-Fi-only device.


    Larger screens are more visible and easier to read, but a larger tablet requires
    two hands to operate. A smaller-size tablet might be more convenient. The only
    way to know which size works best for you is to manhandle an Android tablet at
    the store before you buy.


    LTE athletes use the mobile data network to access the Internet, just like a smartphone.
    That capability comes with a monthly bill, but if you need Internet access anywhere,
    it''s worth the price. Both LTE and Wi-Fi-only tablets can access Wi-Fi networks.


    Some tablets feature removable storage in the form of a microSD card. This feature
    allows you to expand the device''s storage and more easily share files with a
    computer.


    Ensure that the tablet has both front and rear cameras. The camera resolution
    is not vital, but if your tablet will be your only digital camera, getting a high-resolution
    rear camera is a plus. Also confirm that the rear camera has a flash.


    Beyond these items, most Android tablets are the same, with only software differences.
    Do ensure, however, that your tablet uses the Android operating system and can
    access Google Play. Some low-price, bargain tablets restrict your purchases to
    the manufacturer''s app store. I would avoid such devices.


    # Liberating the tablet from the box


    Thanks to an excess of funds, your federal government has conducted numerous studies
    on how people use electronic devices. Men and women wearing white coats and goggles
    have determined that using an Android tablet works best when you remove it from
    its box. Thank you, federal grant!


    I assume that you''re pretty good at the box-opening, so I probably don''t need
    to detail procedure. I can affirm, however, that it''s perfectly okay to remove
    and throw away those protective plastic sheets clinging to the front, back, and
    sides of the tablet. And don''t be embarrassed, after three weeks from now, you
    find yet another plastic sheet you haven''t removed. Feel free to remove and throw
    away the plastic sheets.


    Along with the tablet, you''ll find the following items in the box:


    +   **USB cable:** You can use it to connect the tablet to a computer or a wall
    charger.'
  merge: -1
  pgno: 27
- img_proc: true
  md: '**Power adapter:** Use this thing (the USB cable) to charge the tablet''s battery.
    The adapter may come in two pieces, both of which must be assembled.


    **Power charger and cable:** These are included with some tablets that don''t
    use the USB cable to charge the battery.


    **Useless pamphlets:** If your tablet is like mine, you the flimsy setup guide
    that shows the safety and warranty information is far more extensive than our
    culture places on lawyers versus technology writers.


    **The 4G SIM card holder:** For an LTE tablet, you need a 4G SIM card. If you
    purchased your tablet at a phone store, someone there have tossed the SIM card
    holder into the box as well. You can throw it out.


    ![](img/d435d3e2564e3c6f2ff421dc0a90f095_28_0.png)


    Keep the box for as long as own your Android tablet. If you ever need to return
    the thing, or ship it anywhere, the original box is the ideal contain. You can
    shove all those useless pamphlets and papers back into the box as well.


    # # Charging the battery


    The very first thing that I recommend you do with your tablet is give it a full
    charge. Follow these steps:


    +   1. **If necessary, assemble the charging cord.**

    Attach the charging-head (the wall adapter) to the USB cable that came with the
    tablet.

    2. **Plug the charging-head part of the USB cable into a wall socket.**

    3. **Plug the other end of the USB cable into the tablet.**

    4. **Wait.**


    As the tablet charges, you may see the Charging icon appear on the touchscreen.
    This icon lets you know that the tablet is functioning properly — but don''t be
    alarmed if the battery icon fails to appear.


    It''s okay if the tablet turns when you first charge it, but read Chapter 2 to
    discover how to run initial setup on your Android tablet.


    +   > Some tablets use their own charging cord, not the USB cable.

    >> Even if your Android tablet comes fully charged from the factory, I still recommend
    giving it an initial charge, to at least familiarize yourself with the process.'
  merge: -1
  pgno: 28
- img_proc: true
  md: 'The battery charges more efficiently if you plug it into a wall, as opposed
    to charging it from a computer''s USB port. Speaking of which:


    The tablet won''t charge when it''s connected to the USB port on a computer that
    isn''t turned on.


    Feel free to use the tablet while the battery is charging. And you don''t have
    to wait for a full charge, either.


    Some tablets can charge wirelessly, but only when you purchase a special wireless
    charger.


    It''s been a long time since I''ve seen an Android tablet with a removable battery.
    The only problem with having a nonremovable battery is that if the tablet won''t
    charge, you need to return the entire thing for a refund or replacement.


    ![](img/d435d3e2564e3c6f2ff421dc0a90f095_29_0.png)


    # # Tablet Exploration


    Everyone loves a good game of hide-and-seek — except when it comes to technology.
    It''s important that you know where certain key items are found on your Android
    tablet. The problem is the location of these items isn''t consistent, even when
    two tablets are made by the same manufacturer.


    # ## Finding things on the tablet


    Take heed of Figure 1-1, which is my attempt at illustrating a generic Android
    tablet''s hardware features. Use this figure as a guide as you follow along on
    your own tablet to locate some key features.


    Important items you''ll find on the front of the tablet include the items in this
    list:


    **Touchscreen:** The biggest part of the tablet is its touchscreen display, occupies
    all the territory on the front of the device. The touchscreen is a look-touch
    gizmo: You look at it but also touch with your fingers to control the tablet.


    **Front camera:** The Android tablet''s front-facing camera is found above the
    touchscreen. On larger tablets, the camera is on top when the tablet is oriented
    horizontally. (Refer to the left side of Figure 1-1.) On small-format tablets,
    the camera is on top when the tablet is oriented vertically. (Refer to the right
    side of Figure 1-1).'
  merge: -1
  pgno: 29
- img_proc: true
  md: '![](img/d435d3e2564e3c6f2ff421dc0a90f095_30_0.png)


    FIGURE 1-1:

    Things to find on your Android tablet.


    USB/Power connector


    USB/Power connector


    **Navigation icons:** The bottom of the touchscreen shows the Android navigation
    icons. On some tablets, these icons are physical buttons found below the touchscreen.
    Refer to Chapter 3 for information on the navigation icons.


    Important items found on the tablet''s edges include the following:


    **Power/Lock key:** This button, or key, turns the tablet on off, or unlocks the
    device. Directions for performing these activities are found in Chapter 2.


    **Volume key:** The tablet''s volume control is two buttons in one. Press one
    side of the key to set the volume higher or the other side to set the volume lower.
    This key is often found next to the Power/Lock key. It''s the larger of the two.


    **USB/Power connector:** This slot is where you connect the USB cable, which is
    used both to charge the battery and to connect your Android tablet to a computer.


    **Removable storage slot:** Into this slot you insert a microSD card, which expands
    the tablet''s storage. Details are covered in the next section.


    **SIM card cover:** This spot is used to access an LTE tablet''s SIM card, which
    is inserted into a slot beneath the cover.


    **Headphone jack:** This hole is where you can connect standard headphones.'
  merge: -1
  pgno: 30
- img_proc: true
  md: 'Speaker(s): Stereo speakers are found left and right on the tablet, although
    smaller-format tablets may have their speakers on the back.


    Microphone: A miniscule, circular opening serves as the device''s microphone.
    Some tablets may feature two microphone holes. Don''t worry if you can''t find
    them; they''re there.


    On the back of your Android tablet you''ll find one or more logos, plus the tablet''s
    main, or rear, camera. The camera may or may not feature an LED flash.


    +   Samsung tablets feature the Home button directly below the touchscreen. This
    physical button serves the same purpose as the Home navigation icon on other Android
    tablets.


    +   Samsung tablets also feature touch-sensitive Rec and Back buttons.


    +   Be careful not to confuse the SIM card slot with the external storage slot.
    They''re not the same thing. You''ll rarely, if ever, to access the SIM card.


    +   SIM stands for Subscriber Identity Module. The SIM card is used by a cellular
    provider to identify your tablet and keep track of the amount of data transmitted
    over the mobile data network. Yep, that''s so that you can be billed properly.
    The SIM also gives your LTE tablet a phone number, though it''s merely an account
