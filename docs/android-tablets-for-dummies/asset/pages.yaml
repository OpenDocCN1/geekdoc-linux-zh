    The stock Android method of shooting the screen is to press and hold both the
    Volume Down and Power/Lock keys at the same time. Upon success, the touchscreen
    image reduces in size, you may hear a shutter sound, and the screen shot is saved.


    +   * Screen shots are accessed through the Photos app. If your tablet uses the
    old Gallery app, you''ll find screen shots in their own album.

    * Some Samsung tablets use the Motion command to capture the screen: Hold your
    hand perpendicular to the tablet, like you''re giving it a karate chop. Swipe
    the edge of your palm over the screen, right-to-left or left-to-right. Upon success,
    you hear a shutter sound.

    * Internally, screen shots are stored in the Pictures/Screenshots folder. They''re
    created in the PNG graphics file format.


