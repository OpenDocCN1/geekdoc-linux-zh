  md: '# Snap a Pic of That Contact


    Here''s something I1 always forget: Whenever you''re near one of your contacts,
    take the person''s picture. Sure, some people are bashful, but most folks are
    flat-tered. The idea is to use the tablet''s address book so that all your contacts
    have photos.


    When taking a picture, be sure to show it to the person before you assign it to
    the contact. Let them decide whether it''s good enough.


    ![](img/d435d3e2564e3c6f2ff421dc0a90f095_314_0.png)


    # Use Google Now


    Google is known worldwide for its searching capabilities and its popular website.
    By gum, the word Google is synonymous with searching. So please don''t forget
    your Android tablet, which uses Google''s Android operating system, has a powerful
    search — nay, knowledge — command. It''s called Google Now.


    +   - On many Android tablets, you access Google Now from the far left screen
    page.

    - The Google Search widget on the Home screen provides a shortcut to Google Now.

    - The Google Now app is titled Google.

    - Review Chapter 14 for details on various Google Now commands.

    - Beyond Google Now, you can take advantage of the various Search icons found
    in just about every app on an Android tablet. Use this icon to search for information,
    locations, people — you name it. It''s handy.


    ![](img/d435d3e2564e3c6f2ff421dc0a90f095_314_1.png)'
