    # Web page content


    > >> Pinch the screen to zoom out or spread two fingers to zoom in.


    > >> You may see the mobile page, or a customized version of the web page designed
    for small-screen devices. To see the nonmobile version, tap the Action Overflow
    and choose Desktop View.


    > >> You can orient the tablet vertically to read a web page in Portrait mode.
    Doing so may reform some web pages, which can make long lines of text shorter
    and easier to read.


    ![](img/d435d3e2564e3c6f2ff421dc0a90f095_106_1.png)


    # Visiting a web page


    To visit a web page, tap its address in the Address box. (Refer to Figure 7–1)
    You can also type a search word or phrase if you don''t know the exact address
    of a web page. Tap the Go button on the onscreen keyboard to search or visit a
    specific web page.


