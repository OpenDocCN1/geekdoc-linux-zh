    # Chapter 19


    # Customize Your Android Tablet


    It''s entirely possible to own an Android tablet for decades and never once customize-it.
    It''s not that customization is impossible; it''s that most people just don''t
    bother. Maybe they don''t know how to customize it; maybe they don''t try; or
    maybe they''re deathally afraid that the tablet will seek revenge.


    Poppycock!


    It''s your tablet! Great potential exists to make the device truly yours own.
    You can change the way it looks to the way it sounds. Revenge is not part of the
    equation.


    # Home Screen and Display Settings


    The Home screen is where the action happens on your Android tablet. To help hone
    the Home screen to meet your demands, several customization options are available.
    You can change the background image, control the automatic lock'
  merge: -1
  pgno: 258
- img_proc: true
  md: 'timeout, and even add or remove Home screen pages. This section uncovers the
    secrets.


    # Decorating the Home screen


    To start your Home screen decoration project, long-press a blank part of the Home
    screen. Don''t long-press on an icon or widget. Upon success, you see Home screen
    management icons, similar to what''s shown in Figure 19-1.


    ![](img/d435d3e2564e3c6f2ff421dc0a90f095_259_0.png)


    FIGURE 19-1: The Home screen menu. Home screen management icons


    The icons or options presented for Home screen management include some or all
    of the following:


    +   - **Wallpaper:** Change the background image on the Home screen.

    - **Widgets:** Add widgets to the Home screen.

    - **Settings:** Open the Settings app.

    - **Folder:** Create a Home screen folder.

    - **Page:** Add, remove, or manage Home screen pages.


    These items might appear as icons (refer to Figure 19-1), or you may see a menu
    of options presented as a list. The most common items are the first three, as
    illustrated in Figure 19-1.'
