    # Text Editing and Correcting


    You''ll probably do more text editing on your Android tablet than you anticipated.
    That editing includes the basic stuff, such as spif up typos and adding a period
    here or as well as complex editing cutting, copy, and paste. The concepts are
    the same as you find on a computer, but the process can be daunting without a
    physical keyboard and a mouse. This section irons out the text-editing wrinkles.


    # Moving the cursor


    The first part of editing text is to move the cursor to the right spot. The cursor
    is that blinking, vertical line that marks the location where new text appears,
    edited text changes, or cut/copied text is pasted.


    To set the cursor''s location, tap the text. To help your accuracy, a cursor appears
    below the text, similar to the one shown in the margin. You can drag that tab
