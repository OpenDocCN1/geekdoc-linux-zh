    where you work. The Maps app lets you create shortcuts for these locations. They''re
    called, logically enough, Home and Work.


    To set the Home and Work locations, follow these steps in the Maps app:


    +   1. Tap the Side Menu to display the navigation drawer.

    2. Choose Your Places.

    3. On the LABELED tab, choose Home.

    4. Type your home address.

    5. Tap Work.

    6. Type your work address.


    You can use the Home and Work shortcuts when searching for a location or directions.
    For example, type Home into the Search box to instantly see where you live, or
    wherever you call home. To get directions from your current location to work,
    type Work as the destination. Keep reading in the next section.


    > > If you choose Home or Work from Your Places menu, see that location displayed
    on the map.


    > > To reset your home or work locations, display the Places screen (refer to
    Steps 1 and 2), but tap the Action Overflow icon and choose Edit Home or Edit
    Work, respectively.


