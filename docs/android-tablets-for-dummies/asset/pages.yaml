  md: '# IN THIS CHAPTER

    >> Traveling with your Android tablet

    >> Using the tablet on an airplane

    >> Activating Airplane mode

    >> Taking an Android tablet overseas

    >> Avoiding data roaming charges


    # Chapter 21 On the Road


    A mobile device, your Android tablet is designed to go wherever you go. And if
    you give the tablet a good throw, it can go beyond where you go, but that''s not
    my point. Because it is wireless and has a generous battery, the tablet is built
    to go on the road. Where can you take it? How can it survive? If it runs off by
    itself? Does it need wheels? These are some of the issues regarding taking your
    tablet elsewhere.


    # You Can Take It with You


    How far can you go with an Android tablet? As far as you desire to go. As you
    can carry the tablet with you, it goes wherever you do. How its functions change
    depending on your environment, and you can do a few things to prepare before you
    go.


    # Preparing to leave


    Unless you''re being unexpectedly abducted, you should prepare several things
    before leaving on a trip with your Android tablet.


    First and most important of, course, is to charge the thing. Plug it in your Android
    tablet overnight before I leave the next day. The tablet''s battery is nice and
    robust, so power should last until well after you reach your destination.'
  merge: -1
  pgno: 280
- img_proc: true
  md: 'Second, consider loading up some reading material, music, and a few apps before
    you go.


    Finally, don''t forget your tickets! Many airlines offer apps. The apps may make
    traveling easy because they generate notifications for your schedule and provide
    timely gate changes or flight delays — plus, you can use the tablet as an e-ticket.
    Search Google Play to see whether your airline offers an app.


    +   For entertainment, consider getting some eBooks for the road. I prefer to
    and stew over Google Play''s online library before I leave, as opposed to wandering
    aimlessly in some airport sundry store, trying hard to focus on the good books
    rather than on the salty snacks. Chapter 14 covers reading eBooks on your Android
    tablet.


    +   Picking up some music might be a good idea as well. Visit Chapter 13. I usually
    reward myself with a new game before I go on a trip with my tablet. Visit Google
    Play Store and see what''s hot or recommended. A good puzzle game can make a nice,
    long international flight go by a quicker.


    # Going to the airport


    I''m not a frequent flyer, but I am a nerd. The most amount of junk I''ve carried
    on a flight is two laptop computers and three cell phones. I know that''s not
    a record, but it''s enough to warrant the following list of travel tips, And,
    of which apply to taking an Android tablet with you on an extended journey:


    +   Take the Android tablet''s AC adapter and USB cable with you. Put them in
    your carry-luggage.


    +   Most airports feature USB chargers, so you can charge the tablet in an airport,
    if you need to. Even though you only need the cable to charge, bring along the
    AC adapter, anyway.


    +   At the security checkpoint, place your Android tablet in a bin with itself
    or with other electronics. The exceptions are when you''ve been approved for pre-check
    or by using a preapproved tablet carrying pouch.


    +   Use the Calendar app to keep track of your flights. The event time serves
    the airline and flight number. For the event time, use the take-off and landing
    schedules. For the location, list the origin and destination airport codes. And,
    in the Description field, find the flight reservation number. If you''re using
    separate calendars (categories), specify the Travel calendar for your flight.
    See Chapter 14 for more information on the Calendar app.


    ![](img/d435d3e2564e3c6f2ff421dc0a90f095_281_0.png)


    264 PART 4 Nuts & Bolts'
  merge: -1
  pgno: 281
- img_proc: true
  md: '> Scan for the airport''s Wi-Fi service. Most airports don''t charge for the
    service, though you may have to agree to terms by using the tablet''s web browser
    app to visit the airport''s website.


    # Flying with an Android tablet


    It truly the trendiest of things to be aloft with the latest mobile gizmo. Like
    taking a cell phone on a plane, however, you have to follow some rules.


    The good news is that because your Android tablet isn''t a smartphone, you can
    leave it for the duration of the flight. All you need to do is place the tablet
    into Airplane mode. Follow these steps just before take-off:


    +   1. Open the Settings app.


    +   2. Tap the Mode item in the Wireless & Networks area.


    +   If you find an Airplane Mode item in the Wireless and Networks section, choose
    that item instead.


    +   On some Samsung tablet, tap the Connections tab to locate the More or Airplane
    Mode item.


    +   3. Slide the master control by the Airplane Mode item to the On.


    The tablet turns off its Wi-Fi, Bluetooth, and GPS radios.


    When the Android tablet is in Airplane mode, a special icon appears in the status
    area, similar to the one shown in the margin.


    To exit Airplane mode, repeat the steps mentioned in this section.


    > The Airplane Mode Quick Settings button is also available: Summon the Quick
    Settings and tap the Airplane Mode icon. See Chapter 3 for more information on
    the Quick Settings.


    > Some tablets feature the Airplane Mode action on the Device Options menu: Press
    and hold the Power button and choose Airplane Mode.


    > If the airline features onboard wireless networking and you''re not skittish
    about overpaying forfully slow Internet access, you can reactivate the tablet''s
    Wi-Fi radio after you place the device into Airplane mode. After doing so, use
    the web browser app to display any page. What you see instead is the inflight
    Wi-Fi access screen. He the directions, pay the hefty fees, and you''re online.


    ![](img/d435d3e2564e3c6f2ff421dc0a90f095_282_0.png)


    ![](img/d435d3e2564e3c6f2ff421dc0a90f095_282_1.png)'
  merge: -1
