  md: '# Removing the screen lock


    You don''t remove the screen lock on your Android tablet as much as you replace
    it. Specifically, to remove the Pattern, PIN, or Password screen lock, set the
    Swipe lock. Follow the directions in the preceding section to get to the Choose
    Lock screen and change the existing screen lock to something else.


    # Assigning a password


    The most secure way to lock an Android tablet is to apply a full-on password.
    The password can contain numbers, symbols, and both upper- and lowercase letters.


    To set a password, choose Password from the Choose Screen Lock screen; refer to
    the earlier section "Finding the screen locks." The password you select must be
    at least four characters long. Longer passwords are more secure.


    You''re prompted to change the password whenever you unlock your Android tablet
    or whenever you try to change the screen lock. Tap the OK button to accept the
    password you''ve typed.


    # Setting a PIN


    The PIN lock is second only to the Password lock as the most secure for your Android
    tablet. To access the tablet, you must type a PIN, or personal identification.
    This type of screen lock is also employed as a backup for less secure screen locks,
    such as the Pattern lock


    The PIN lock is a code between 4 and 16 digits. It contains only numbers, 0 through
    9. To set the PIN lock for your Android tablet, follow the directions in the earlier
    section "Finding the screen locks" and choose PIN from the list of locks.


    Use the onscreen keypad to type your PIN once and confirm that you know it. Tap
    the CONTINUE button. Type the same PIN again to confirm you know it. Tap OK. The
    next time you unlock the tablet, you need to type the PIN to gain access.


    # Creating an unlock pattern


    One of the most popular screen locks is the Pattern. To unlock the tablet, a specific
    pattern must be traced exactly as it was created. To create an unlock pattern,
    follow these steps:


    +   1. Summon the Choose Screen Lock screen.


    Refer to the earlier section "Finding the screen locks."'
  merge: -1
  pgno: 270
- img_proc: true
  md: '+   2. Choose Pattern.


    If you''ve not set a Pattern lock, you may see a tutorial describing the process;
    tap the Next button to skip over the dreary directions.


    +   3. If the Secure Start-Up screen is presented, choose the option Require Pattern
    to Start Device, and tap CONTINUE.


    Alternatively, you can choose No Thanks, which is less secure.


    +   4. Trace an unlock pattern.


    Use Figure 20-1 as a guide. You can trace over the dots in any order, but you
