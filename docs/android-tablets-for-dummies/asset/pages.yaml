    # # Installing an app


    I can think of a few reasons to remove an app. It''s with eager relish that I
    remove apps that don''t work or that somehow annoy me. It''s also perfectly okay
    to remove redundant apps, such as when you''re trying to find a decent music-listening
    app and you end up with a dozen or so that you never use.


    Whatever the reason, remove an app by following these directions:


    +   1. Open the Play Store app.


    +   2. Choose My Apps & Games from the navigation drawer.


    If you don''t see that item, choose Apps & Games and repeat Steps 1 and 2.


    +   3. Tap the INSTALLED tab.


    +   4. Choose the app that offends you.


    +   5. Tap the UNINSTALL button.


    +   6. Tap the OK button to confirm.


    The app is removed.


    The app continues to appear on the ALL list even after it''s been removed. That''s
    because you downloaded it once. That doesn''t mean, however, that the app is still
    installed.'
