  md: '# Placing a Hangouts phone call


    If you''ve obtained the Hangouts Dialer app, you can use Hangouts to place a real,

    live phone call. It''s amazingly simple, and it works like this:


    +   1. Tap the Phone Calls tab in the Hangouts app.

    Refer to Figure 8-1 for its location. If you don''t see the Phone Calls tab, you

    haven''t yet installed the Hangouts Dialer app.

    2. Type a contact name or a phone number.

    3. Tap the matching contact, or tap the phone number (when it doesn''t

    belong to a contact) to dial.


    The call is placed.


    If you''d rather dial a number directly, tap the Dialpad icon, similar to what''s

    shown in the margin. Type the phone number, and then grep the Dial icon

    to place the call.


    Tap the red End call to end the call.


    +   >> To the person you''re calling, an incoming Hangouts call looks just like
    any

    other call, although the number may be displayed as Unavailable.

    >> The good news: Hangouts calls are free!

    >> The bad news: You can''t use Hangouts to dial every phone number.


    # Connect to the World with Skype


    Skype is one of the most popular Internet communications programs, allowing

    you to text-, voice-, or video-chat with other Skype users. But the big enchilada

    is Skype''s capability to place honest-to-goodness phone calls, including interna-

    tional calls.


    # Obtaining Skype for your tablet


    The typical Android tablet doesn''t come with the Skype app preinstalled. To get

    Skype, visit Google Play and obtain the Skype app. In case you find multiple apps,

    get one that''s from the Skype company itself.'
