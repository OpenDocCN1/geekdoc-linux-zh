    When you install a media app like Zedge, you will see the default app card displayed
    when you choose a ringtone or select wallpaper. The choices you''re pre-selected
    with Tablet Media and plus any other media apps. You can choose a default app,
    such as Zedge, or be prompted every time. For more information on this decision,
    see Chapter 18.


