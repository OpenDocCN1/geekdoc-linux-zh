    # Deleting images and videos


    It''s entirely possible, and often desirable, to remove unwanted, embarrassing,
    or questionably legal images and videos from the Photos app.


    ![](img/d435d3e2564e3c6f2ff421dc0a90f095_172_0.png)


    To banish the big dumpster, tap the Delete (Trash) icon on the screen when viewing
    an image or a video. It''s not really gone; no, it''s moved to the Trash album.
    You might even see a MOVE TO TRASH button after you tap the Delete icon.


    +   - If you don''t delete the icon, the item cannot be deleted. It''s most likely
    a copy pulled from a web photo-sharing service or a social networking site.

    - To view the Trash album, tap the Side Menu and choose Trash from the navigation
    drawer.

    - Items in the Trash album are automatically deleted after 60 days. To hasten
    the departure, long-press items in the Trash album and then tap the Delete icon
    atop the screen.


    # Selecting multiple pictures and videos


    Three commands can be applied to groups of images and videos in the Photos app:
    Share, Copy to Album, and Delete. To select a group, follow these steps:


    +   1. **Long-press an image or a video to select it.**

    Instantly, Image-Selection mode is activated. The thumbnail you long-pressed grows
    a check mark.

    2. **Continue tapping images and videos to select them.**

    3. **Perform an action on the group of images or videos.**


    The actions you can perform in Step 3


    ![](img/d435d3e2564e3c6f2ff421dc0a90f095_172_1.png)


    +   **Choose**: Choose an option to use for sharing the images, such as Gmail
    to send the lot as an attachment.

    **Copy to Album**: Select an album to copy the images to, or create a new album.

    **Delete**: The items are banished to the Trash album. The preceding section.


