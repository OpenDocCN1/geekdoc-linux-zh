  md: 'To “click” links on a page, tap them with your finger. If you have trouble
    stabbing the right link, zoom in on the page and try again. You can also long-press
    the screen to see a magnification window to make tapping links easier.


    +   - Look for special keys when typing a web page address. Some tablets display
    a .com (dot-com) or .www. key. Those keys assist you in rapidly typing web page
    addresses.


    +   - Long-press the .com key to see other top-level domains, as .org,.net, and
    so on.


    +   - If you don’t see the Address box, swipe the page from the center of the
    touchscreen downward. If that doesn’t work, tap the web page’s tab above the screen.


    +   - To reload a web page, tap the Refresh icon. (Refer to Figure 7-1.) If you
    don’t see it on the screen, tap the Action icon to find the Reload. Refresh updates
    a website that changes often. Using the command can also reload a web page that
    may not have completely loaded the first


    +   - To stop a web page from loading, tap the Cancel (X) icon that appears at
    the Address box.


    ![](img/d435d3e2564e3c6f2ff421dc0a90f095_107_0.png)


    # Browsing back and forth


    To return to a previously visited web page, tap the Back icon at the top of the
    screen. (Refer to Figure 7-1.) If that icon isn’t visible, tap the Back navigation
    icon, shown in the margin.


    Tap the Forward icon (refer to Figure 7-1) to go forward or return to a page you
    were visiting before you tapped the Back icon.


    To view web pages you’ve visited in the long term, visit the web browser’s page.
    In Chrome, tap the Action Overflow and choose History.


    +   - See the later section “Clearing your history” for information on purging
    items from the History list.


    +   - If you find yourself frequently clearing the web page history, consider
    using an incognito tab. See the later section “Going incognito.”'
