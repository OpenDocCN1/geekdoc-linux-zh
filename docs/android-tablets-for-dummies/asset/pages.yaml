    # Chapter 16

    It''s a Wireless Life


    At time, truly advanced technology was easily identified by its nest of tangled
    cables. Today, the opposite is true. Your Android tablet lives an untethered existence,
    thanks to its beefy battery and wireless Internet access. Welcome to the carefree
    digital lifestyle. Well, of course, with occasional stops to charge that beefy
    battery.


    # The Wonderful World of Wireless


    An Android tablet demands an Internet connection. To abate that desire, the tablet
    communicates with the information superhighway in a wireless way. Given how wireless
    networking has proliferated around the globe, finding an available wireless network
    is no longer a big deal. No, the issue is how to coax the tablet into making the
    connection happen.'
