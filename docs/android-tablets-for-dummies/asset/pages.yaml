  md: '# Saving the song queue as a playlist


    If you''ve created a song queue, and it''s a memorable one, considering that queue
    as a playlist that you can listen to over and over. Obey these directions:


    +   1. Tap the Song Queue icon to view the song queue.


    Refer to the earlier section "Queueing up the next song" for details on the song
    queue.


    +   2. Tap the Action Overflow icon and choose Save Queue.


    The Action Overflow icon appears to the right of the Song Queue.


    +   3. Choose NEW PLAYLIST.


    Or you can add the songs to an existing playlist, as described in the preceding
    section.


    +   4. Fill in the New Playlist card.


    Refer to the earlier section "Creating your own playlists."


    +   5. Tap the CREATE PLAYLIST button.


    The songs in the current queue now dwell in their own playlist, always accessible.


    # Removing unwanted music


    To remove a song or an album, tap its Action Overflow icon. Choose the Delete
    action. Tap the OK button to remove the song. Bye-bye, music.


    I don''t recommend removing music. Most music on your Android tablet is actually
    stored on the cloud, Google''s Play Music service. Therefore, removing the music
    doesn''t affect the tablet''s storage, so unless you totally despise the song
    or artist, removing the music has no effect.


