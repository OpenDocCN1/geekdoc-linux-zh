    # Chapter 4


    # Creating and Editing Text


    Your Android tablet lacks a keyboard — a real one, at least. To save the tablet''s
    text-input desires, you use something called an onscreen keyboard. It works like
    a real keyboard, but with the added frustration that it lacks movable keys. Don''t
    feel! You can add a real keyboard to your tablet, and you can even forgo typing
    and dictating your text.


    # Behold the Onscreen Keyboard


    The onscreen keyboard reveals itself on the bottom half of the tablet''s screen
    whenever text input is required. The stock Android keyboard, known as the Google
    Keyboard, is shown in Figure 4-1.


    No matter how the keyboard looks, all onscreen keyboards are based on the traditional
    QWERTY layout: You use keys from A through Z, albeit not in that order. You also
    see the Shift key for changing the case letter, and the Delete key, which back-spaces
    and erases. Your tablet may show more keys — such as Tab and Caps Lock — or may
    show fewer keys. Samsung tablets use the Samsung keyboard, illustrated in Figure
    4-2. It works similarly to the Google Keyboard, but offers its special features,
    such as a Ctrl (control) key and cursor, as in the figure.


