    The key is to save or export your computer email program''s records in the vCard
    (vcf) file format. These records can then be transferred to the Android tablet
    and read by the Contacts app. The method for exporting varies, depending on the
    email program:


    **In Microsoft Outlook**, you don''t need to do a thing. Outlook contacts are
    automatically synchronized when you use your Exchange Server account to the phone.
