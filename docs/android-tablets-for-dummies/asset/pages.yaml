  md: '# "The battery doesn’t charge!"


    Start from the source: Is the wall socket providing power? Is the cord plugged
    in?

    The cable may be damaged, so try another cable.


    When charging from a USB port on a computer, ensure that the computer is turned
    on. Most computers don''t provide USB power when they’re turned off. Also, some

    USB ports may not supply enough power to charge the tablet. If possible, use a

    port on the computer console (the box) instead of a USB hub.


    Some tablets may charge from a special cord, not the USB cable. Check to confirm

    yyour tablet is able to take a charge from the USB cable.


    # "The tablet gets hot so that

    it turns itself off!"


    Yikes! An overheating gadget can be a nasty problem. Can you hold the tablet

    your hand, or is it too hot to hold? When it’s too hot to hold, turn off the power.

    Disconnect from the power supply. Let it cool.


    If the overheating problem continues, have the Android tablet looked at for-

    tial repair. The battery might need to be replaced. As far as I can tell, there’s
    no

    way to remove and replace the Android tablet battery by yourself.


    > WARNING\Do not continue to use any gizmo that’s too hot! The heat damages the
    electronics.

    It can also start a fire.


    # "My tablet doesn’t do Landscape mode!"


    Not every app can change its orientation between Portrait and Landscape modes

    or even Upside-Down mode. For example, many games present themselves in one

    orientation only. Some tablets don’t rotate their Home screens. So, just because

    t app doesn’t go into Horizontal or Vertical mode doesn’t mean that anything

    is broken.


    Confirm that the orientation lock isn’t on: Check the Quick Settings. Ensure that

    t Auto-Rotate or Screen Rotation item is properly set. Also, some eBook reader

    apps sport their own screen-rotation lock feature. Tap the Action Overflow to

    determine whether it’s enabled.'
