    to a single device, such as a laptop computer.


    To create a mobile hotspot, heed these steps:


    +   Turn off the tablet''s Wi-Fi radio.

    There''s no point in creating a Wi-Fi hotspot where one is already deactive.


    +   If possible, connect your Android tablet to a power source.

    Running a mobile hotspot draws a lot of power.'
