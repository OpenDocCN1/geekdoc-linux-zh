  md: '# Chapter 1

    That Out-of-the-Box Experience


    To begin your Android tablet adventure, open the device''s box. Sour, you''ve
    probably already done that. I don''t blame you; I had already opened the box that
    my Android tablet came in before I read this chapter. No problem. Yet your new
    adventure is made smoother when you can accompany that out-of-the-experience with
    a gentle introduction and handling.


    # Initial Procedures


    If you''ve purchased a cellular or LTE tablet, the folks who sold it to you may
    have already done some configuration before you left the store. That''s great
    because an LTE tablet requires some extra setup before you can use the device.
    That duty is explained in Chapter 2. For now, all tablet owners LTE and Wi-Fi
    — need to perform two basic activities: Get it out of the box, and charge the
    battery.


    +   IN THIS CHAPTER

    - Unboxing the tablet

    - Charging the battery

    - Locating important tablet-things

    - Getting optional accessories

    - Storing a tablet'
