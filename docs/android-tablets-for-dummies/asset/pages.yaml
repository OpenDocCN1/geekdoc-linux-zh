  md: '# # Configuring the USB connection


    The USB connection is configured automatically whenever you connect your Android
    tablet to a computer. Everything should work perfectly. When it doesn''t, you
    can manually configuring the USB connection. Follow these steps:


    +   1. **Swipe down the notifications drawer.**


    +   2. **Choose the USB notification.**


    The USB icon is shown in the margin.


    +   3. **Choose a connection option.**


    The USB Computer Connection screen lists several options for configuring the USB
    connection:


    *Charging: The USB connection charges the tablet.*


    *File Transfers: Also called Transferring Media Files, MTP, CTP, this connection
    is ideal for transferring files. The computer views the tablet as a thumb drive
    or similar device.*


    *Photo Transfers (PTP): In this mode, which might also be labeled Transferring
    Image, the computer sees the tablet as a digital camera, which is best for importing
    photos and videos.*


    *MIDI: Choose this mode to use the tablet as a keyboard or similar device for
    musical input.*


    After choosing the mode, you may see a notification on the computer, prompting
    you to do something with the tablet. Your choices are based on which option you
    choose in Step 3.


    ![](img/d435d3e2564e3c6f2ff421dc0a90f095_231_0.png)


    > >> If the computer fails to recognize the tablet, select another USB connection
    option.


    > >> If you''re using a Macintosh, see the later section "Connecting your tablet
    to a Mac."


    > >> The computer might not access the tablet when it''s locked. Work the Lock
    on the screen to address this issue.


    > >> Some tablets may use their own file transfer software, which is annoying
    but you must deal with it. For example, some Samsung tablets require you to use
    the Kies utility to transfer files.


    > >> Most tablets while connected to the computer''s USB port. Some tablets, however,
    may not charge. If they don''t, try connecting the tablet to a USB port on the
    PC''s console (as opposed to an external USB hub).'
