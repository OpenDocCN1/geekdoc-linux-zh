    On some tablets, tap the Device tab to locate the Lock Screen item.


    +   2. Choose Notifications on the Lock Screen.


    +   3. Choose Content on the Lock Screen.


    The options are


    +   - Show Content


    +   - Hide Content


    +   - Do Not Show Notifications


    +   4. Select a notification level.


    You can also use the list of apps that''s presented (after Step 3) to determine
    which those apps can generate Lock screen notifications. Set the app''s master
    control to the Off position to suppress specific app''s Lock notifications.


    # Finding a lost tablet


    Someday, you may have lost your Android tablet. It might be for a few panic-filled
    seconds, or it might be for forever. The hardware solution is to weld a heavy
    object to the tablet, such as a vending machine, yet that kind of defeats the
    entire mobile/wireless paradigm. The software solution is to for these steps:


    +   1. On a computer, open a web browser, such as Google Chrome.


    +   2. Visit the main Google search page: google.com


    +   3. Into the Search box, type find your tablet and press the Enter key.


    +   4. If prompted, sign in to your Google (Gmail) account.


    Your device''s location appears on the screen.'
