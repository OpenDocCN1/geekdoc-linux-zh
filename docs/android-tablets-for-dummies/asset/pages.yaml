- img_proc: true
  md: 'Other Camera apps may require you to jump through various hoops, such as wade
    through an Action Overflow or Settings icon menu, to locate the Location Tag Item.


    +   Deactivating the location-tag feature doesn''t remove information from photos
    you''ve already taken.


    +   The location-tag information is stored in the picture itself. This means that
    other devices, apps, and computer programs can read the GPS information to determine
    where the image was taken.


    +   See Chapter 12 for information on reviewing a photograph''s location.


    # Selecting the storage device


    When you place a microSD card into your Android tablet''s removable storage slot,
    the Camera app automatically chooses that location to save new photos and videos.
    To confirm or change this setting, follow these steps in the Camera app:


    +   1. Tap the Action Overflow or Settings icon.


    +   2. Choose Storage Location.


    The option may have a different name from but similar to Storage Location.


    +   3. Set the location.


    The options are Device or Internal for the tablet''s internal storage; or microSD,
    Memory Card, or External Storage for the removable media card.


    ![](img/d435d3e2564e3c6f2ff421dc0a90f095_162_0.png)


    REMEMBER


    Not every tablet features removable storage.'
