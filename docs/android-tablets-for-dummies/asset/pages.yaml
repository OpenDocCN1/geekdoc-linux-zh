- img_proc: true
  md: '# Using the mobile data network


    LTE Android tablets use the mobile data network to connect to the Internet. That''s
    the same digital cellular network used by smartphones. Several types of this net-
    are available, based on the network''s speed:


    +   4G LTE: The fourth generation of wide-area data network and the fastest.


    +   3G: The third-generation network, which is the fastest network used when a
    4G signal isn''t available.


    +   1X: Several types of the original, slower cellular data signals are all available.
    They all fall under the 1X banner. It''s slow.


    Your tablet uses the best network available. So, when the 4G LTE network is within
    reach, it''s used for Internet communications. Otherwise, the 3G network is chosen,
    and ITX networking in an act of last-ditch desperation.


    > >> A status icon representing the network connection appears atop the touchscreen,
    right next to the Signal Strength icon.


    > >> The H or H+ status icons used by some cellular providers refer to the LTE
    (fast) network.


    > >> Accessing the digital cellular network isn''t free. You likely signed for
    some form of subscription plan for a certain quantity of data. When you expect
    that, costs can become prohibitive.


    > >> See Chapter 21 for information on how to avoid cellular data overcharges
    when taking your Android tablet out and about.


    > >> See Chapter 23 for information on monitoring your mobile data usage as well
    as on sharing the tablet''s mobile data connection.


    ![](img/d435d3e2564e3c6f2ff421dc0a90f095_219_0.png)


    # Understanding Wi-Fi


    The mobile data connection is nice, and it''s available pretty all over, but it
    costs you money every month. A better option is Wi-Fi, the wireless net-working
    standard used by computers to communicate with each other and the Internet.


    To Make Wi-Fi work on an Android tablet requires two steps. First, you must activate
    the tablet''s Wi-Fi radio. The second step is connecting to a specific wireless
    network. The next two sections cover these steps in detail.'
  merge: -1
  pgno: 219
- img_proc: true
  md: '+   When your tablet is connected to a Wi-Fi network, it uses that network
    rather than the mobile data network.


    +   Wi-Fi stands for wireless fidelity. It''s brought to you by the numbers 802.11
    and various letter suffixes too many to mention.


    ![](img/d435d3e2564e3c6f2ff421dc0a90f095_220_0.png)


    # # Activating Wi-Fi


    Follow these steps to activate your Android tablet''s Wi-Fi radio:


    +   1. Open the Settings app.


    +   2. Choose Wi-Fi.


    On some Samsung tablets, tap the Connections tab to locate the Wi-Fi item.


    +   3. Ensure that the Wi-Fi master control is set to the On position.


    To deactivate the Wi-Fi radio, which also disconnects the tablet from the Wi-Fi
