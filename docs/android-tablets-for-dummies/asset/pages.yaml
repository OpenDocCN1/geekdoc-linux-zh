    15.


    # Unmounting the microSD card


    The microSD card provides removable storage on some Android tablets. When the
    tablet is turned off, you can insert or remove the microSD card at will; directions
    are provided in Chapter 1. The microSD card can also be removed when the tablet
    is turned on, but you must firstmount it. One of these steps:


    +   1. Open the Settings app and choose Storage & USB.


    On some Samsung tablets, tap the General tab to locate the Storage item.


    +   2. Choose Unmount SD Card or press the Eject button.


    Refer to Figure 17-5 for the location of the Eject button. Otherwise, the Unmount
    SD Card action is found near the bottom of the screen.'
