    There is a need to do so? Of course not! But if you want to get dirty with files,
    you.


    View files and folders, attempt these steps:


    +   1. Open the Settings app and choose Storage & USB.


    This item may be titled Storage.


    +   2. Swipe to the bottom of the screen and choose Explore.


    You may have to tap the storage item to view the Explore action. Upon success,
    you see folders and files stored on your tablet.


    Some Android tablets come with a file management app. It''s called Files or My
    Files, and it''s a traditional type of file manager, which means that if you detect
    managing files on your computer, you''ll experience the same delightful frustation
    on your tablet.


