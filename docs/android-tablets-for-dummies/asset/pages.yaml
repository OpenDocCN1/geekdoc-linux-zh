    Tap the Back navigation icon when you''ve finished searching.


    # Sharing a web page


    There is it! That page you just have to talk about everyone you know. The gauche
    way to share the page is to copy and paste it. Because you''re reading this book,
    you know the better way to share a web page. Heed these steps:


    +   1. Go to the web page you desire to share.

    Actually, you''re sharing a link to the page, but don''t let my obsession with
    specificity deter you.


    +   2. Tap the Action Overflow icon and choose Share.

    The command might be called Share Via or Share Page. Either way, you will see
    an array of apps displayed. The variety and number of apps depends on whatever''s
    installed on the tablet.


    +   3. Choose an app.

    For example, choose Gmail to send the web page''s link by email, or Facebook to
    share the link with your friends.


    +   4. Do whatever happens next.

    Whatever happens depends on how you''re sharing the link: Compose the email, write
    a comment in Facebook, or whatever. Refer to various chapters in this book for
    specific directions.


    You cannot share a page you''re viewing on an incognito tab.


    Another way to share a page is to print it. See Chapter 17 for details.


    # The Art of Downloading


    The most important thing you need to know about downloading is that it''s transfer
    of information from another source to your gizmo. For your Android tablet, the
    other source is the Internet. The information that''s transferred is'
