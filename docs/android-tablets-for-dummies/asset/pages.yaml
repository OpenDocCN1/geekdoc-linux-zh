  md: '# Hanging new wallpaper


    The Home screen background can be draped with two types of wallpaper: traditional
    and live. Traditional wallpaper can be any image, such as a picture you''ve taken
    or an image provided by the tablet''s manufacturer. Live wallpaper can be animated
    or interactive.


    To set a new wallpaper for the Home screen, obey these steps:


    +   1. Long-press the Home screen.

    2. Choose Wallpapers.


    The command might be Set Wallpapers on some tablets.


    +   3. Tap a wallpaper to see a preview.


    Swipe the list left or right to peruse your options. You see the previous wallpaper
    images, plus those provided by the tablet manufacturer. On the far right, you''ll
    find the live wallpapers.


    Some tablets may first prompt you to select a category, such as Wallpapers, Life
    Wallpapers, and Images.


    +   4. Tap the Set Wallpaper button to confirm your choice.


    The new wallpaper takes over the Home screen.


    If you prefer to use an image from the tablet''s photo library, tap the My Photos
    or From Gallery button in Step 3. Choose an image. On some tablets, you''re required
    to crop the image; manipulate the cropping rectangle to do so. Tap the Done button
    to set the wallpaper.


    > On some Samsung tablets, tabs atop the wallpapers screen let you choose to set
    wallpaper for the Home screen, Lock screen, or both. See the later section "Setting
    the Lock screen behavior."


    > Be careful how you crop the wallpaper image when you choose one of your photos.
    Zoom out (with your fingers on the touchscreen) to ensure the entire image is
    cropped properly for both the tablet''s horizontal and vertical orientations.


    > Live wallpapers can be obtained from Google Play. See Chapter 15.


    > The Zedge app is an uber-repository of wallpaper images, collected from Android
    users all over the world. Zedge is a free app.


    > See Chapter 12 for more information on how to crop an image.


    ![](img/d435d3e2564e3c6f2ff421dc0a90f095_260_0.png)'
  merge: -1
  pgno: 260
- img_proc: true
  md: '# Managing Home screen pages


    The number of pages on the Home screen isn''t fixed. You can add pages. You can
    remove pages. You can even rearrange pages. This feature might not be available
    to all Android tablets and sadly, it''s not implemented in the same way.


    The stock Android method of adding a Home screen page is to drag an icon left
    or right, just as you were positioning that icon on another Home screen page.
    When a page to the left or right doesn''t exist, the tablet automatically adds
    a new, blank page.


    Other tablets may be more specific in how pages are added. For example, you can
    choose a Page command from the Home screen menu.


    The Home screen page overview for Samsung tablets is shown in Figure 19-2. To
    edit Home screen pages, pinch the Home screen: Touch the screen with two fingers
    and drag them together. You can then manage Home screen pages as illustrated in
    the figure.


    Set primary Home screen page


    Remove Home screen page


    ![](img/d435d3e2564e3c6f2ff421dc0a90f095_261_0.png)


    FIGURE 19-2: Manipulating Home screen pages.


    Primary Home screen page


    Add new Home screen page'
