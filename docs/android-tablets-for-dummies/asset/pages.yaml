    \ or both.\n3. Tap the ENCRYPT button to proceed.\n4. Wait.\n\nOnce encrypted,\
    \ only by unlocking the tablet will anyone be able to access its storage.\n\n\
    # Performing a factory data reset\n\nThe most secure thing you can do with information\
    \ on your Android tablet is to erase it all. The procedure is known as a factory\
    \ data reset. It effectively restores the device to its original state, just like\
    \ you got it new.\n\n> A factory data reset is a drastic thing. It not removes\
    \ all information from storage also erases all your accounts. Don't take this\
    \ step lightly! In fact, if you're using this procedure to cure an ill, I recommend\
    \ first getting support.\n\n![](img/d435d3e2564e3c6f2ff421dc0a90f095_275_0.png)"
