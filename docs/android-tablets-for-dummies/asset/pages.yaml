  md: '# Working with folders


    For further organization of the Home screen, consider gathering similar apps into
    folders. For example, I have a Listen folder that contains all my streaming music
    apps. Your tablet may have come with a Google folder, which contains all the apps
    provided by Google. These folders can not help organize your apps but also solve
    the problem of an overly crowded Home screen.


    Folders are created in different ways, depending on the tablet. The stock Android
    method to create a folder is to drag one launcher icon on top of another. When
    the two launchers get close, a circle encompasses them, which provides visual
    feedback that a folder is created.


    Another technique is to look for a Folder creation icon: Drag the launcher icon
    on top to that icon, which creates a new folder. Or, perhaps, long-press the Home
    screen and choose the Create Folder action. Drag icons into the new folder.


    Examples of various folder icons are shown in Figure 18-4.


    ![](img/d435d3e2564e3c6f2ff421dc0a90f095_250_0.png)


    To use a folder, tap its icon. The folder opens, displaying its contents. Tap
    a launcher to start the associated app. Or, if you don''t find what you want,
    tap the Back navigation icon to close the folder.


    +   * To add more apps to the folders, drag in their icons. Some folders may feature
    a Plus (+) or Add icon. In that case, tap the icon to add more launchers.

    * Folders are managed just like other icons on the Home screen. You drag folder
    icons around or delete them. When you delete a folder, you remove the launcher
    icons from the folder; deleting the folder doesn''t uninstall the apps.'
