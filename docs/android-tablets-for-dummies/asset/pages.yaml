    # Using a fingerprint lock


    Though not as popular on an Android tablet as on an Android phone, some devices
    come with fingerprint locks. Specifically, on Samsung tablets the Home button
    doubles as a fingerprint scanner. After you configure the scanner to read one
    or more of your digits, and add a Password or PIN lock as a backup, you can unlock
    your tablet with a touch of your finger.


    Not all fingerprint locks are configured identically, but the concept is the same:
    You practice the fingerprint reader until the tablet has a general idea of what
    your fingerprint looks like.


    To unlock the tablet, tap or swipe the fingerprint-reading gizmo. On Samsung tablets,
    tap or swipe the proper digit (or thumb) over the Home button. Upon success, the
    device unlocks, or you may have to type the PIN or password if you fail a given
    number of times.


    +   - You choose the Finger screen lock from the Choose Screen lock, as described
    in this earlier section "Finding the locks."

    - The Finger screen lock is not considered secure. Some tablets let you use it
    only in combination with a secure lock.


    # Other Tablet Security


    The screen lock only keeps the Bad Guys at bay. Further tablet security is necessary
    if you truly want to protect your personal information or employ methods to locate
    a lost or stolen Android tablet.


