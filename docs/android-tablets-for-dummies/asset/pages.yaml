  md: '# "WHAT’S THIS SONG?"


    Ever hear a song playing and you want to know what it is? Google is happy to oblige,
    but with a reason: The Sound Search for Google Play widget uses the tablet''s
    microphone to listen to music. It matches what you''re playing with Google''s
    song library and eventually gives you the song''s name and artist — plus a chance
    to purchase the music from Google Play. (That''s the reason for the app.)


    ![](img/d435d3e2564e3c6f2ff421dc0a90f095_181_0.png)


    ![](img/d435d3e2564e3c6f2ff421dc0a90f095_181_1.png)


    ![](img/d435d3e2564e3c6f2ff421dc0a90f095_181_2.png)


    The Sound Search widget works best (exclusively. I would argue) with recorded
    music. Try as you might, you cannot sing into the thing and have it recognize
    a song. Humming doesn''t work, either. I''ve tried playing the guitar and piano
    and — nope — that doesn''t work either. But it''s a great tool for discovering
    details about the music you''re listening to.


    You can obtain the Sound Search for Google Play widget from the Play Store app,
    as described in Chapter 15. Directions for adding widgets to the Home screen are
    offered in Chapter 18.


    # Queuing up the next song


    It''s fun to randomly listen to your music library, plucking out tunes like a
    mad DJ. Oftentimes, however, you don''t have patience to wait for the current
    song to finish before choosing the next tune. The solution is to add songs to
    the queue.


    Follow these steps:'
  merge: -1
