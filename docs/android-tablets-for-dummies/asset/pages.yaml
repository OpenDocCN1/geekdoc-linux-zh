    # # Add Some Music to Your Life


    Consider yourself fortunate that your Android tablet comes with music preinstalled.
    Otherwise, your music library may be a little light. To pack it full of those
    songs you adore, have two options:


    +   - Buy lots of music from Google Play, which is what Google wants you to do.

    - Borrow music from your computer, which Google also wants you to do, just not
    as enthusiastically as the first option.


    For information on buying music at Google Play, see Chapter 15. The next section
    covers borrowing music from your computer.


    # ## Getting music into the google cloud


