    # Chapter 17


    # Connect, Share, and Store


    Your Android tablet is no island. True, it''s wireless, but it does need to communicate
    with other devices. You can use those avenues of communications to share photos,
    transfer files, print items, or beam movies and music to another technology gizmo.
    That way, the tablet remains an island, just not a lonely island.


    # The USB Connection


    The most direct way to connect an Android tablet to a computer is to use a wire
    — specifically, the wire nestled at the core of a USB cable. Conveniently, such
    a cable came with the tablet. It''s for more than giving the device''s battery
    a charge.'
  merge: -1
  pgno: 230
- img_proc: false
  md: "# Configuring the USB connection\n\nThe USB connection is configured automatically\
    \ whenever you connect your Android tablet to a computer. Everything should work\
    \ peachy. When it doesn't, you can try manually configuring the USB connection.\
    \ Follow these steps:\n\n+   1. **Swipe down the notifications drawer.**\n2. **Choose\
    \ the USB notification.**\n   The USB icon is shown in the margin.\n3. **Choose\
    \ a connection option.**\n   The USB Computer Connection screen lists several\
    \ options for configuring the USB connection:\n\n![](bbox=[0.189, 0.22, 0.228,\
    \ 0.269])\n\n*Charging*: The USB connection charges the tablet.\n\n*File Transfers*:\
    \ Also called Transferring Media Files, MTP, or CTP, this connection is ideal\
    \ for transferring files. The computer views the tablet as a thumb drive or similar\
    \ storage device.\n\n*Photo Transfers (PTP)*: In this mode, which might also be\
    \ labeled Transferring Image, the computer sees the tablet as a digital camera,\
    \ which is best for importing photos and videos.\n\n*MIDI*: Choose this mode to\
    \ use the tablet as a keyboard or similar device for musical input.\n\nAfter choosing\
    \ the mode, you may see a notification on the computer, prompting you to do something\
    \ with the tablet. Your choices are based on which option you choose in Step 3.\n\
    \n![](bbox=[0.158, 0.633, 0.228, 0.703])\n\n+   - If the computer fails to recognize\
    \ the tablet, select another USB connection option.\n- If you're using a Macintosh,\
    \ see the later section \"Connecting your tablet to a Mac.\"\n- The computer might\
    \ not access the tablet when it's locked. Work the Lock screen on the tablet to\
    \ address this issue.\n- Some tablets may use their own file transfer software,\
    \ which is annoying but you must deal with it. For example, some Samsung tablets\
    \ require you to use the Samsung Kies utility to transfer files.\n- Most tablets\
    \ charge while connected to the computer's USB port. Some tablets, however, may\
    \ not charge. If they don't, try connecting the tablet to a USB port on the PC's\
    \ console (as opposed to an external USB hub)."
  merge: -1
