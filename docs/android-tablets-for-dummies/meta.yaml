    music, and signals alerts. While it''s locked, the tablet doesn''t use as much
    power as it would with the display on.

    - The tablet will probably spend most of its time locked.

    - Locking doesn''t turn off the tablet.

    - Any timers or alarms you set still trigger when your tablet is locked. See Chapter
    14 for information on setting alarms.

    - To unlock your tablet, press and release the Power/Lock key. See the section
    "Unlocking the tablet," earlier in this chapter.

    - Refer to Chapter 19 for information on setting the automatic timeout value for
    locking the tablet.'
