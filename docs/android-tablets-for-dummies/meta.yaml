  md: "This trick may not work when the tablet is turned off or it's been broken.\
    \ Also, it may not work if you used a nonsecure screen lock and the Bad Guys have\
    \ wiped clean the tablet's data.\n\n# Encrypting your tablet\n\nWhen the information\
    \ on your tablet must be really, really secure, you can take the drastic step\
    \ of encrypting the internal and external storage. For most Android tablet users,\
    \ this step is a bit much. However, if you're using your tablet to store the Colonel's\
    \ secret recipe, you might want to consider it.\n\nFirst, apply a secure screen\
    \ lock, such as the PIN or password.\n\nSecond, ensure that the tablet is either\
    \ plugged in or fully charged. Encryption takes a while, and you don't want your\
    \ gizmo pooping out before the process is complete.\n\nThird, follow these steps\
    \ to encrypt your tablet's internal storage:\n\n+   1. **Open the Settings app\
    \ and choose Security.**\n\n   On some Samsung tablets, choose Lock Screen and\
    \ Security. This item might be located on the Settings app's General tab.\n\n\
    2. **Choose the item Encrypt Tablet, Encrypt Device, or Encrypt SD Card.**\n\n\
    \   If you haven't followed my advice in this section, you'll need to charge the\
    \ tablet or set a password or both.\n\n3. **Tap the ENCRYPT button to proceed.**\n\
    \n4. **Wait.**\n\nOnce encrypted, only by unlocking the tablet will anyone be\
    \ able to access its storage.\n\n# Performing a factory data reset\n\nThe most\
    \ secure thing you can do with information on your Android tablet is to erase\
    \ it all. The procedure is known as a *factory data reset*. It effectively restores\
    \ the device to its original state, just like when you got it new.\n\n> ⚠️ WARNING\n\
    \nA factory data reset is a drastic thing. It not only removes all information\
    \ from storage but also erases all your accounts. Don't take this step lightly!\
    \ In fact, if you're using this procedure to cure an ill, I recommend first getting\
    \ support."
