    tap that item to either make a one-time Skype Credit purchase or get a subscription.
    You don''t need a lot of Skype Credit to make calls — the rates are quite cheap.


    After you''ve confirmed your Skype Credit, you can use the tablet to make a "real"
    phone call, which is a call to any phone number on the planet (Planet Earth).
    Heed these steps:'
