    icon, shown in the margin.

    » The Samsung keyboard features a multifunction key. (Refer to Figure 4-2.) Its
    label varies, showing perhaps the Emoji icon, the Settings icon, or the Dictation
    icon. Long-press the multifunction key to view its options.


    The keyboard changes its width when you reorient the tablet. The keyboard''s horizontal
    presentation is wider and easier for typing.


    # A REAL KEYBOARD?


    If typing is your thing and the onscreen keyboard doesn''t do it for you, consider
    getting your Android tablet a real keyboard. A common tablet accessory is a Bluetooth
    keyboard. They come separate, as part of a docking stand, or integrated into a
    portfolio cover. The Bluetooth keyboard connects wirelessly, giving you not only
    a "real" keyboard but also all the divine goodness that wireless brings. You can
    read more about Bluetooth in Chapter 16.'
