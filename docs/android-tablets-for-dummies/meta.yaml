    tablet won''t unlock. To do anything other than run the app, you must work the
    screen lock.


    » Samsung tablet lock-screen icons are enabled only when the swipe lock is set.


    # Make Phone Calls


    Yeah, I know: It''s not a phone. Even Android tablets that use the mobile data
    network can''t make phone calls. Why let that stop you?


    Both the Hangouts and Skype apps let you place phone calls and video-chat with
    your friends. Boost your Skype account with some coinage and you can even dial
    into real phones. See Chapter 8 for details.


    # Check Your Schedule


    The Calendar app reminds you of upcoming dates and generally keeps you on schedule.
    A great way to augment the calendar is to employ the Calendar widget on the Home
    screen.


    The Calendar widget lists the current date and then a long list of upcoming appointments.
    It''s a great way to check your schedule, especially when you use your tablet
    all the time. I recommend sticking the Calendar widget right on the main or center
    Home screen panel.


    ![](bbox=[0.158, 0.69, 0.22, 0.775])


    > » See Chapter 18 for information on adding widgets to the Home screen; Chapter
    14 covers the Calendar app.


    » As long as I''m handing out tips, remember to specify location information when
    you set up an appointment in the Calendar app. Type the information just as though
    you were using the Maps app to search. You can then quickly navigate to your next
    appointment by touching the location item when you review the event.'
