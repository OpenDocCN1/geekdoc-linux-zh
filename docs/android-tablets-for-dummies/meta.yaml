  md: '# # Valuable Tablet Q&A


    I love Q&A! Not only is it an effective way to express certain problems and solutions,
    but some of the questions might also cover things I''ve been wanting to ask.


    # ## "I can''t turn the tablet on (or off)!"


    Sometimes an Android tablet locks up. It''s frustrating, but I''ve discovered
    that if you press and hold the Power/Lock key for about eight seconds, the tablet
    turns either off or on, depending on which state it''s in.


    I''ve had a program lock my tablet tight when the 8-second Power/Lock key trick
    didn''t work. In that case, I waited 12 minutes or so, just letting the tablet
    sit there and do nothing. Then I pressed and held the Power/Lock key for about
    8 seconds, and it turned itself back on.


    # ## "The touchscreen doesn''t work!"


    A touchscreen requires a human finger for proper interaction. The tablet interprets
    the static potential between the human finger and the device to determine where
    the touchscreen is being touched. The touchscreen will not work if the screen
    is damaged. It will not work when you''re wearing gloves, unless they''re specially
    designed touchscreen gloves. The touchscreen might fail also when the battery
    power is low.


    # ## "The screen is too dark!"


    Android tablets feature a teensy light sensor on the front. If the Adaptive Brightness
    feature is active, the sensor adjusts the touchscreen''s brightness based on the
    amount of ambient light at your location. If the sensor is covered, the screen
    can get very, very dark.


    Ensure that you don''t unintentionally block the light sensor. Avoid buying a
    case or screen protector that obscures the sensor.


    The Automatic Brightness setting might also be vexing you. See Chapter 19 for
    information on setting screen brightness.'
  merge: -1
  pgno: 296
- img_proc: false
  md: '# # "The battery doesn''t charge!"


    Start from the source: Is the wall socket providing power? Is the cord plugged
    in? The cable may be damaged, so try another cable.


    When charging from a USB port on a computer, ensure that the computer is turned
    on. Most computers don''t provide USB power when they''re turned off. Also, some
    USB ports may not supply enough power to charge the tablet. If possible, use a
    port on the computer console (the box) instead of a USB hub.


    Some tablets may charge from a special cord, not the USB cable. Check to confirm
    that your tablet is able to take a charge from the USB cable.


    # # "The tablet gets so hot that it turns itself off!"


    Yikes! An overheating gadget can be a nasty problem. Can you hold the tablet in
    your hand, or is it too hot to hold? When it''s too hot to hold, turn off the
    power. Disconnect it from the power supply. Let it cool.


    If the overheating problem continues, have the Android tablet looked at for potential
    repair. The battery might need to be replaced. As far as I can tell, there''s
    no way to remove and replace the Android tablet battery by yourself.


    ⚠️ WARNING: Do not continue to use any gizmo that''s too hot! The heat damages
    the electronics. It can also start a fire.


    # # "My tablet doesn''t do Landscape mode!"


    Not every app can change its orientation between Portrait and Landscape modes
    — or even Upside-Down mode. For example, many games present themselves in one
    orientation only. Some tablets don''t rotate their Home screens. So, just because
    the app doesn''t go into Horizontal or Vertical mode doesn''t mean that anything
    is broken.


    Confirm that the orientation lock isn''t on: Check the Quick Settings. Ensure
    that the Auto-Rotate or Screen Rotation item is properly set. Also, some eBook
    reader apps sport their own screen-rotation lock feature. Tap the Action Overflow
    to determine whether it''s enabled.'
