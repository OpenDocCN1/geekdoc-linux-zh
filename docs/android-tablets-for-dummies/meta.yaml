  md: "# Shutting down an app run amok\n\nSometimes an app goofs up or crashes. You\
    \ may see a warning message on the touchscreen, informing you that the app has\
    \ been shut down. That's good. What's better is that you too can shut down apps\
    \ that misbehave or those you cannot otherwise stop. Follow these steps:\n\n+\
    \   1. **Open the Settings app.**\n2. **Tap the Apps item.**\n   On Samsung tablets,\
    \ choose Applications and then choose Application Manager. These items might be\
    \ located on the Applications or General tab in the Settings app.\n3. **Choose\
    \ the errant app from the list.**\n   For example, if the Annoying Sound app is\
    \ bothering you, choose it from the list.\n4. **Tap the FORCE STOP button.**\n\
    \   The app is terminated.\n\n> ⚠️ WARNING\nUse the FORCE STOP button only as\
    \ a final act. Don't kill off any app or service unless the app is annoying or\
    \ you are otherwise unable to stop it. Avoid killing off Google Services, which\
    \ can change the tablet's behavior or make the Android operating system unstable.\n\
    \n# MOVING AN APP TO THE MICROSD CARD\n\nOn Android tablets with removable storage,\
    \ you may find an option that moves the app from internal storage to the microSD\
    \ card. My advice: Don't.\n\nFirst, apps don't occupy a lot of storage, so moving\
    \ them to external storage isn't saving you anything. Second, you run the risk\
    \ of losing the app should the storage vanish. Indeed, launcher icons for those\
    \ apps disappear from the Home screen. Finally, the current trend is for Android\
    \ tablets not to feature removable storage. So even if moving apps to the microSD\
    \ card works for you, it's not a long-term solution."
