  md: '# TRANSFERRING INFORMATION FROM YOUR OLD TABLET


    Here''s one task you don''t need to worry about: All the Google information associated
    with your old tablet — or your current phone — is instantly transferred to your
    new Android tablet. This information includes contacts, Gmail, events, and other
    Googley account data. You can even install apps you''ve previously obtained (free
    or purchased).


    As you add other accounts to your tablet, the information associated with those
    accounts is migrated as well. The only category not migrated is media installed
    on the old device. If you''ve synchronized the media with an online-sharing service,
    the information can easily be transferred. Otherwise, refer to Chapter 17 for
    information on moving over photos, videos, and music to your new Android tablet.


    # The End of Your Android Tablet Day


    I know of three ways to say goodbye to your Android tablet; only one of them involves
    the application of high explosives. The other methods are documented in this section.


    # Locking the tablet


    Locking the tablet is cinchy: Simply press and release the Power/Lock key. The
    display goes dark; your tablet is locked.


