    gives you the song’s name and artist — plus a chance to purchase the music from
    Google Play. (That’s the reason for the app.)


    ![](bbox=[0.345, 0.255, 0.765, 0.555])


    The Sound Search widget works best (exclusively, I would argue) with recorded
    music. Try as you might, you cannot sing into the thing and have it recognize
    a song. Humming doesn’t work, either. I’ve tried playing the guitar and piano
    and — nope — that doesn’t work either. But it’s a great tool for discovering details
    about the music you’re listening to.


    You can obtain the Sound Search for Google Play widget from the Play Store app,
    as described in Chapter 15. Directions for adding widgets to the Home screen are
    offered in Chapter 18.


