  md: '# # Chapter 25

    Ten Nifty Apps


    +   ## IN THIS CHAPTER

    * Airline apps

    * Games

    * Google Docs

    * Kindle

    * Movies by Flixster

    * Sky Map

    * Television alternatives

    * Translate

    * Voice Recorder

