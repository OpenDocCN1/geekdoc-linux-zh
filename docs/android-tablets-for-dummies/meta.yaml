    # # Chapter 19

    ## Customize Your Android Tablet


    It''s entirely possible to own an Android tablet for decades and never once customize
    it. It''s not that customization is impossible; it''s that most people just don''t
    bother. Maybe they don''t know how to customize it; maybe they don''t try; or
    maybe they''re deathly afraid that the tablet will seek revenge.


    Poppycock!


    It''s your tablet! Great potential exists to make the device truly your own. You
    can change the way it looks to the way it sounds. Revenge is not part of the equation.


    # ## Home Screen and Display Settings


    The Home screen is where the action happens on your Android tablet. To help hone
    the Home screen to meet your demands, several customization options are available.
    You can change the background image, control the automatic lock'
  merge: -1
