    The large key at the bottom center of the onscreen keyboard is the *Space key*.
    It''s flanked left and right by other keys that may change, depending on the context
    of what you''re typing. For example, the / (slash) key or .com key may appear
    in order to assist in typing a web page or email address. Though these and other
    keys may change, the basic alphabetic keys remain the same.


