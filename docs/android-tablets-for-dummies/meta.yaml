  md: '# Recording video


    To record video, switch the Camera app to Video mode. The Shutter icon becomes
    the Record icon, similar to the one shown in the margin and in Figure 11-3. Tap
    that icon to start recording. The elapsed time, and maybe even storage consumed,
    appears on the touchscreen as video is being recorded.


    ![](bbox=[0.26, 0.22, 0.73, 0.55])


    Tap the Stop icon to end the recording.


    +   » In the stock Android Camera app, shown in Figure 11-3, swipe the screen
    from right to left to enter Video-Recording mode.

    » On some Samsung tablets, you tap the Record button on the Camera app''s screen.
    (Refer to Figure 11-2.) Some tablets may feature a Still/Video toggle that switches
    the Camera app between Still Shot and Video modes.

    » Some Camera apps feature the Pause icon. Tap that icon to temporarily suspend
    recording. Tap the Record icon to resume. The video you record is saved as a single
    video as opposed to multiple videos.

    » Some versions of the Camera app may allow you to grab a still image while the
    tablet is recording: Tap the screen or press the volume key to snap and save a
    still shot.

    » Hold the tablet horizontally when you record video.'
  merge: -1
