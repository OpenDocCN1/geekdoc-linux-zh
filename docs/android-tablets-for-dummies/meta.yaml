  md: '+   **IN THIS CHAPTER**


    * Waking up to your Android tablet

    * Making tablet calculations

    * Keeping your appointments

    * Reading digital books

    * Playing games

    * Watching junk on YouTube

    * Buying or renting films and TV shows


    # Chapter 14

    Amazing Tablet Feats


    Even given the variety of things your Android tablet can do, you will find some
    limitations. For example, you cannot use an Android tablet as a yoga block. It
    makes a poor kitchen cutting board. And despite efforts by European physicists,
    the Android tablet simply cannot compete with the Large Hadron Collider. Still,
    for more everyday purposes, I believe you’ll find your tablet more than up to
    the task.


    # Clock


    Your Android tablet keeps constant, accurate track of the time, which is displayed
    at the top of the Home screen as well as on the Lock screen. That’s handy, but
    it just isn’t enough, so the tablet ships with an app that tells the time and
    also may double as an alarm clock.


    The app may be called Clock or Alarm. If it’s called Alarm, it’s probably nothing
    more than a basic alarm clock. The Clock app, on the other hand, is more of a
    chronometric app, featuring a timer, stopwatch, alarm, and world clock functions.
    Of these activities, setting an alarm is pretty useful: In that mode, your tablet
    becomes your nightstand companion.'
  merge: -1
  pgno: 190
- img_proc: false
  md: 'Here’s how to set a wake-up alarm in the stock Android Clock app:


    +   1. **Tap the Alarm icon or tab atop the Clock app’s screen.**

    2. **Tap the Add icon.**

    Some Clock apps may simply present a new alarm card, so you don’t have to add
    anything.

    3. **Set the alarm time.**

    Tap hours, then minutes. Tap OK when you’re done. The new alarm appears on the
    screen, but you can add more details.

    4. **Fill in details about the alarm.**

    Set the alarm’s ringtone and assign a label such as “Wake up for the airport.”
    On Samsung tablets, you may have to tap the OPTIONS button to set details.


    The alarms you create are set active. Use the master control near the alarm, or
    tap the Alarm icon, to set or reset the alarm. Only a set alarm triggers. And
    you can confirm that an alarm is set when you see the Alarm Set status icon atop
    the touchscreen, similar to what’s shown in the margin.


    When the alarm triggers, tap the Dismiss icon to tell the tablet, “Okay! I’m up!”
    Or you can tap the Snooze icon to be annoyed again after a few minutes.


    +   » Your tablet keeps its clock accurate by accessing an Internet time server.
    You never have to set the time.

    » Information about a set alarm appears on the Clock app’s screen and on the tablet’s
    Lock screen.

    » Unsetting an alarm doesn’t delete the alarm. To remove an alarm, tap the alarm
    to select it and then tap the Delete (Trash) or Close (X) icon.

    » To make the alarm sound on specific days of the week, tap the Repeat check box.
    Choose the days of the week when you want the alarm to sound. Otherwise, the alarm
    sounds only when you set it.

    » The alarm doesn’t work when you turn off the Android tablet. However, the alarm
    triggers when the tablet is locked.


