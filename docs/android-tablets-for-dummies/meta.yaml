    # Battery Care and Feeding


    Perhaps the most important item you can monitor and maintain on your Android tablet
    is its battery. The battery supplies the necessary electrical juice by which the
    device operates. Without battery power, your tablet is basically an expensive
    trivet. Keep an eye on the battery.


    # Monitoring the battery


    Android tablets display the current battery status at the top of the screen, in
    the status area, next to the time. The icons used are similar to those shown in
    Figure 22-1. They can appear white-on-black or use a charming color scheme, as
    illustrated in the figure.


    ![](bbox=[0.135, 0.63, 0.885, 0.76])


    You might also see an icon for a dead battery, but for some reason I can''t get
    my Android tablet to turn on and display that icon.


    +   - Heed those low-battery warnings! The tablet sounds a notification whenever
    the battery power gets low. Another notification sounds whenever the battery gets
    very low.'
