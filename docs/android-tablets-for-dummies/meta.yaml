    > You may see the Paste Command button appear above the cursor tab. Use this button
    to paste in text, as described in the later section "Cutting, copying, and pasting
    text."


    Samsung keyboards may feature cursor movement keys. Use those keys to move the
    cursor as well as the stab-your-finger-on-the-screen method.


    # Selecting text


    Selecting text on an Android tablet works just like selecting text in a word processor:
    You mark the start and end of a block. That chunk of text appears highlighted
    on the screen. How you get there, however, can be a mystery — until now!


    To select text, long-press a word. Upon success, you see a chunk of selected text,
