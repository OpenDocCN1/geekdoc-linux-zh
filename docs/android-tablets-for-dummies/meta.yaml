  md: '# # The Web Browser App


    All Android tablets feature a web browsing app. The stock Android app is Google''s
    own Chrome web browser. Your tablet may have another web browser app, which may
    be named Web, Browser, or Internet.


    The good news is that all web apps work in a similar way and offer comparable
    features. The secret news is that most of those other tablet web browser apps
    are simply gussied–up versions of the Chrome web browser. And the sobering news
    is that I''m writing about only one web browser app in this chapter, which is
    the Chrome app.


    +   - If your tablet doesn''t have the Chrome app, you can obtain it for free
    at Google Play. See Chapter 15.

    - An advantage of using Chrome is that your bookmarks, web history, and other
    features are shared between all devices you use on which Chrome is installed.
    So if you use Chrome as your computer''s web browser, it''s logical to use Chrome
    on your Android tablet as well.

    - The first time you fire up the web browser app on certain Samsung tablets, you
    may see a registration page. Register your device to receive sundry Samsung bonus
    stuff — or not. Registration is optional.


    # # The Web on a Tablet


    It''s difficult these days to find someone who has no experience with the World
    Wide Web. More common is someone who has used the web on a computer but has yet
    to sample the Internet waters on a mobile device. If that''s you, consider this
    section your quick mobile web orientation.


    # ## Viewing the web


    When you first open the Chrome app, you see the last web page you viewed. In Figure
    7–1, I was just on Wikipedia, so when I fired up Chrome, it returned to that page.


    Here are some handy Android tablet web browsing and viewing tips:'
  merge: -1
