  md: "# # Removing the screen lock\n\nYou don't remove the screen lock on your Android\
    \ tablet as much as you replace it. Specifically, to remove the Pattern, PIN,\
    \ or Password screen lock, set the Swipe lock. Follow the directions in the preceding\
    \ section to get to the Choose Screen Lock screen and change the existing screen\
    \ lock to something else.\n\n# # Assigning a password\n\nThe most secure way to\
    \ lock an Android tablet is to apply a full-on password. The password can contain\
    \ numbers, symbols, and both upper- and lowercase letters.\n\nTo set a password,\
    \ choose Password from the Choose Screen Lock screen; refer to the earlier section\
    \ \"Finding the screen locks.\" The password you select must be at least four\
    \ characters long. Longer passwords are more secure.\n\nYou're prompted to type\
    \ the password whenever you unlock your Android tablet or whenever you try to\
    \ change the screen lock. Tap the OK button to accept the password you've typed.\n\
    \n# # Setting a PIN\n\nThe PIN lock is second only to the Password lock as the\
    \ most secure for your Android tablet. To access the tablet, you must type a PIN,\
    \ or personal identification number. This type of screen lock is also employed\
    \ as a backup for less secure screen locks, such as the Pattern lock.\n\nThe *PIN\
    \ lock* is a code between 4 and 16 digits long. It contains only numbers, 0 through\
    \ 9. To set the PIN lock for your Android tablet, follow the directions in the\
    \ earlier section \"Finding the screen locks\" and choose PIN from the list of\
    \ locks.\n\nUse the onscreen keypad to type your PIN once and tap the CONTINUE\
    \ button. Type the same PIN again to confirm that you know it. Tap OK. The next\
    \ time you unlock the tablet, you need to type the PIN to gain access.\n\n# #\
    \ Creating an unlock pattern\n\nOne of the most popular screen locks is the Pattern.\
    \ To unlock the tablet, a specific pattern must be traced exactly as it was created.\
    \ To create an unlock pattern, follow these steps:\n\n+   1. **Summon the Choose\
    \ Screen Lock screen.**\n   Refer to the earlier section \"Finding the screen\
    \ locks.\""
