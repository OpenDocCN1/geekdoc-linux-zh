    # Choosing a default app


    Every so often, you may see the Complete Action Using prompt, which may look similar
    to the one shown in Figure 18-6. Regardless of its appearance, you''re prompted
    to choose from one or more apps to complete an action, and given the choice of
    JUST ONCE or ALWAYS.


    ![](bbox=[0.255, 0.453, 0.675, 0.618])


    When you choose ALWAYS, the same app is always used for whatever action took place:
    composing email, listening to music, cropping a photo, navigating, and so on.


    When you choose JUST ONCE, you see the prompt again and again.


    My advice is to choose JUST ONCE until you get sick of seeing the Complete Action
    Using prompt. At that point, choose ALWAYS.


