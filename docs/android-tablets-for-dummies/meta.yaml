    \ it occasionally censors some of the words you utter. Perhaps you're the kind\
    \ of person who doesn't put up with that kind of s\\*\\*\\*\\*.\n\nRelax. You\
    \ can follow these steps to lift the vocal censorship ban:\n\n+   1. **Start the\
    \ Settings app.**\n2. **Choose Language & Input.**\n   On some Samsung tablets,\
    \ tap the General tab to locate the Language & Input item. If it's not there,\
    \ look on the Controls tab.\n3. **Choose Google Voice Typing.**\n4. **Disable\
    \ the option Block Offensive Words.**\n\nAnd just what are offensive words? I\
    \ would think that *censorship* is an offensive word. But no, apparently only\
    \ a few choice words fall into this category. I won't print them here, because\
    \ the tablet's censor retains the initial letter and generally makes the foul\
    \ language easy to guess. D\\*\\*\\*\\*.\n\n# # Add a Word to the Dictionary\n\
    \nBetcha didn't know that your tablet sports a dictionary. The dictionary keeps\
    \ track of words you type — words that may not be recognized as being spelled\
    \ properly.\n\nWords unknown to the tablet are highlighted on the screen. Sometimes\
    \ the word is shown in a different color or on a different background, and sometimes\
    \ it's underlined in red. To add that word to the tablet's dictionary, long-press\
    \ it. You see the Add Word to Dictionary action, which sticks the word in the\
    \ tablet's dictionary.\n\nTo review or edit the tablet's dictionary, follow these\
    \ steps:\n\n+   1. **Start the Settings app.**\n2. **Choose Language & Input.**\n\
    \   Tap the General tab on some Samsung tablets to locate this item.\n3. **Choose\
    \ Personal Dictionary.**\n   This action may not be obvious on some tablets: Try\
    \ choosing the keyboard first, and then choose either the Dictionary or User Dictionary\
    \ command."
