    Just like on a computer, cut or copied text on an Android tablet is stored on
    a clipboard. To paste any previously cut or copied text, move the cursor to the
    spot where you want the text pasted.


    To quickly paste text, tap the cursor tab, and you may see the PASTE button appear,
    similar to what''s shown in the margin. Tap that button to paste the text.


    +   » Some tablets feature a Clipboard app, which lets you peruse, review, and
    select previously cut or copied text or images. You might even find the Clipboard
    button on the Action Bar or onscreen keyboard.

    » You can paste text only into locations where text is allowed. Odds are good
    that if you see the onscreen keyboard, you can paste text.


    # Dealing with spelling errrs


    Similar to a word processor, your Android tablet may highlight misspelled words.
    A vicious red underline appears beneath the suspect spelling, drawing attention
    to the problem and general embarrassment to the typist.'
