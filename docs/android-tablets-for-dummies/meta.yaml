    # ## Listen Here


    Music is just a tap away on your Android tablet. Plug in some headphones, summon
    a music-playing app, and choose tunes to match your mood. The stock Android app
    is called Play Music. It''s one of Google''s arsenal of "play" apps that entertain
    and inform you.


