  md: '# Saving a favorite web page (bookmarks)


    You might call them bookmarks, but in the mobile world, your Android calls your
    favorite web pages just that: *favorites*. To mark a web page as a favorite, tap
    the Favorite (Star) icon that appears in the Address box. Refer to Figure 7-1
    for this icon''s location.


    When you mark a web page as a favorite, or when you load a favorite web page,
    the Star icon is filled in. To add more details, tap the icon again. You see the
    Edit Bookmark card, which makes you wonder why it''s not called Edit Favorite.
    See? Consistency is a thing that''s lacking in the Android universe. Figure 7-2
    shows the Edit Bookmark card, along with the bookmark or Favorites (or whatever)
    folder tree.


    ![](bbox=[0.13, 0.33, 0.69, 0.66])


    Use the Edit Bookmark card to change the bookmark/favorite''s name. The name given
    is generally longer than is necessary, so tap that item and use the onscreen keyboard
    to type something brief. For example, edit *Wikipedia, the free encyclopedia*
    to just *Wikipedia*. Simple.


    You can also use the Edit Bookmark card to place the bookmark into a specific
    folder. Normally, Chrome prefers to shove it into the Mobile Bookmarks folder,
    as illustrated in Figure 7-2. You can instead choose the Bookmarks bar, in which
    case the bookmark would also be available to Chrome on any computers you use.'
