    # Chapter 8

    # Text, Voice, and Video


    The holy grail of communications has always been video chat. Back in the 1960s,
    the video phone was touted as the harbinger of the future. The film *2001: A Space
    Odyssey* features a key character making a video phone call to his daughter on
    the "Bell network." (Cost: $1.70.) Obviously, seeing and speaking on a phone was
    considered a big deal.


    Years after that film was to have taken place, a video phone call is more commonly
    known as a *video chat*. It''s a feature that your Android tablet is more than
    capable of offering, along with text messaging, voice chat, and even real phone
    calls. The future is here — and rather than cost $1.70 for a 2-minute video call,
    it''s free.


    # ## Can We Hangout?


    The great Googly way to text-message, voice-chat, and video-chat with your online
    pals is to use the Hangouts app. It''s a communications app, designed by Google
    to let you connect with one or more of your friends to, well, hang out. It''s
    also a great communications tool.'
  merge: -1
  pgno: 116
- img_proc: false
  md: '# Using Hangouts


    You may find the Hangouts app launcher lurking on the tablet’s Home screen. Check
    inside the Google folder. Or locate the app in the Apps drawer.


    When you first start the Hangouts app, it may ask whether you want to make phone
    calls. Of course you do! Install the Hangouts Dialer — Call Phones app. If you’re
    not prompted, get the app from Google Play.


    Hangouts hooks into your Google account. You can connect with any one of your
    contacts who also shares a Google or Gmail account. Obey these steps:


    +   1. Tap the Side Menu icon.

    2. Choose Contacts from the navigation drawer.

    3. Tap a contact.

    4. Choose whether to text-chat (Hangouts Message), voice-call, or video-chat.

    5. Connect with the other person.


    If you choose Hangouts Message, you see a screen similar to the text messaging
    app on your phone. Type a message to the other person. They type back (or not),
    and so it goes.


    In Figure 8–1, you see the main Hangouts app screen. It shows previous conversations
    and indicates the type of chat: text (no icon), video, or voice.


    You can do anything else on the tablet while the Hangouts app stays active. You’re
    alerted via notification of an impending Hangouts request. The notification icon
    is shown in the margin.


    > » Conversations are archived in the Hangouts app. To peruse a previous text
    chat, tap the Conversation tab and choose a conversation from the list. Video
    calls aren''t archived, but you can review when the call took place and with whom.


    » To remove a previous conversation, long-press it. Tap the Delete icon that appears
    atop the screen.


    » Your friend can be on a computer or a mobile device to use Hangouts; it doesn''t
    matter which, but the other person''s device must have a camera available to enable
    video chat.'
