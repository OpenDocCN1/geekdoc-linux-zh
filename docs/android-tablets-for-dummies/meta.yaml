    # # Chapter 3

    # How Android Tablets Work


    It used to be that you could judge how advanced something was by how many buttons
    it had. Starting with the dress shirt and progressing to the first computer, more
    buttons meant fancier technology. Your Android tablet tosses that rule right out
    the window. Beyond the Power/Lock key and the volume key, the device is shamefully
    bereft of buttons.


    My point is that in order to use your tablet, you have to understand how a touchscreen
    works. That touchscreen is the tablet''s main input device — the gizmo you use
    to do all sorts of wondrous and useful things. Knowing how to use a touchscreen
    is important to getting the most from your Android tablet.


    # ## Basic Operations


    Your Android tablet''s ability to frustrate you is only as powerful as your fear
    of the touchscreen and how it works. After you clear that hurdle, as well as'
  merge: -1
