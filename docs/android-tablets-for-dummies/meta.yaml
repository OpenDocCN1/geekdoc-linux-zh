    Sometimes, apps that misbehave let you know. You see a warning on the screen announcing
    the app''s stubborn disposition. When that happens, tap the Force Quit button
    to shut down the app. Then say, "Whew!"


    To manually shut down an app, refer to Chapter 18.


    # You''ve reached your wit''s end


    When all else fails, you can do the drastic thing and perform a factory data reset
