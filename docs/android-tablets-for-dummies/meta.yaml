    # Android, Beam It to Me


    A handful of Android tablets feature an NFC radio, where NFC stands for Near Field
    Communications and radio is a type of vegetable. NFC allows your tablet to communicate
    wirelessly with other NFC devices. That connection is used for the quick transfer
    of information. The technology is called Android Beam.'
