- img_proc: false
  md: '# Using the mobile data network


    LTE Android tablets use the mobile data network to connect to the Internet. That’s
    the same digital cellular network used by smartphones. Several types of this network
    are available, based on the network’s speed:


    +   - **4G LTE:** The fourth generation of wide-area data network and the fastest.

    - **3G:** The third-generation network, which is the fastest network used when
    a 4G signal isn’t available.

    - **1X:** Several types of the original, slower cellular data signals are still
    available. They all fall under the 1X banner. It’s slow.


    Your tablet always uses the best network available. So, when the 4G LTE network
    is within reach, it’s used for Internet communications. Otherwise, the 3G network
    is chosen, and then 1X networking in an act of last-ditch desperation.


    > » A status icon representing the network connection type appears atop the touchscreen,
    right next to the Signal Strength icon.

    » The H or H+ status icons used by some cellular providers refer to the LTE (fast)
    network.

    » Accessing the digital cellular network isn’t free. You likely signed up for
    some form of subscription plan for a certain quantity of data. When you exceed
    that quantity, the costs can become prohibitive.

    » See Chapter 21 for information on how to avoid cellular data overcharges when
    taking your Android tablet out and about.

    » Also see Chapter 23 for information on monitoring your mobile data usage as
    well as tips on sharing the tablet’s mobile data connection.


    ![](bbox=[0.159, 0.469, 0.225, 0.549])


    # Understanding Wi-Fi


    The mobile data connection is nice, and it’s available pretty much all over, but
    it costs you money every month. A better option is Wi-Fi, the same wireless networking
    standard used by computers to communicate with each other and the Internet.


    To make Wi-Fi work on an Android tablet requires two steps. First, you must activate
    the tablet’s Wi-Fi radio. The second step is connecting to a specific wireless
    network. The next two sections cover these steps in detail.'
  merge: -1
  pgno: 219
- img_proc: false
  md: '+   - When your tablet is connected to a Wi-Fi network, it uses that network
    rather than the mobile data network.

    - Wi-Fi stands for wireless fidelity. It’s brought to you by the numbers 802.11
    and various letter suffixes too many to mention.


    # Activating Wi-Fi


    Follow these steps to activate your Android tablet’s Wi-Fi radio:


    +   1. Open the Settings app.

    2. Choose Wi-Fi.

    3. Ensure that the Wi-Fi master control is set to the On position.


    On some Samsung tablets, tap the Connections tab to locate the Wi-Fi item.


    To deactivate the Wi-Fi radio, which also disconnects the tablet from the Wi-Fi
    network, set the master control to the Off position in Step 3.


    +   - Use the Wi-Fi Quick Settings to instantly activate or deactivate the Wi-Fi
    connection. See Chapter 3 for information on accessing the Quick Settings.

    - Once Wi-Fi is activated, the tablet connects automatically to any memorized
    Wi-Fi networks. See the next section.

    - It’s perfectly okay to keep the tablet’s Wi-Fi radio on all the time. It does
    drain the battery, but you really need that Internet access to get the most from
    your Android tablet.

    - Using Wi-Fi to connect to the Internet doesn’t incur data usage charges — unless
    you’re accessing a metered network. See the later section "Setting a metered Wi-Fi
    connection."


    # Connecting to a Wi-Fi network


    After you’ve activated the Wi-Fi radio, you can connect your tablet to an available
    wireless network. If you’ve previously connected to an available network, the
    connection is made automatically — as long as the network’s Wi-Fi password is
    still valid.'
