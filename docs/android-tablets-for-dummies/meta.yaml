    Do not choose the Device account. When you do, the contact information is saved
    only on your Android tablet. It won''t be synchronized with the Internet or any
    other Android devices.


    **3. Fill in the contact''s information as best you can.**


    Type text in the various boxes with the information you know. The more information
    you provide, the better.


    Tap the chevron or Action Bar to the right of a field to set more details, such
    as whether a phone number is Mobile, Home, Work, or so on.


    ![](bbox=[0.17, 0.27, 0.23, 0.305])


    To add a second phone number, email, or location, tap the Add New button, which
    may look like a large Plus icon.


    At the bottom of the Add New Contact screen, you''ll find the button More Fields
    or Add Another Field. Use that button when you can add more details for the contact,
    such as a birthday or website address.


    ![](bbox=[0.155, 0.38, 0.235, 0.415])


    **4. Tap the Done icon or SAVE button to complete editing and add the new contact.**


    If you followed my advice in Step 2, the new contact is automatically synced with
    your Google account. That''s one beauty of the Android operating system: You have
    no need to duplicate your efforts; contacts you create on the tablet are instantly
    updated with your Google account on the Internet.


    # # Creating a contact from an email message


    Perhaps one of the easiest ways to build up the tablet''s address book is to create
    a contact from an email message. Follow these general steps when you receive a
    message from someone not already in your Android tablet''s address book, or when
    you receive an email from someone who''s in the address book but whose email address
    you might not have entered:


    **1. View the email message.**


    You can''t add a contact from the inbox; tap the message to view its contents.


    **2. Tap the contact''s name or the icon by the contact''s name.**


    You see more details about the contact.


    ![](bbox=[0.165, 0.785, 0.225, 0.82])


    **3. Tap the Add Contact icon.**


    If you don''t see the Add Contact icon (shown in the margin), tap the CREATE CONTACT
    or similar button. If so, skip Step 4.'
