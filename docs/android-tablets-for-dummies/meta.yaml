    \ by the widget.\n\n# Contact widget\n\nFor your most popular contacts, consider\
    \ adding a contact widget: Add the Contact widget to the Home screen, and then\
    \ select the specific contact from the tablet's address book. A widget representing\
    \ the contact (with the contact's picture, if"
