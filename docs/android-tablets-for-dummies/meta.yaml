    1. View the material you want to print.

    You can print a web page, photo, map, or any number of items.

    2. Tap the Action Overflow or MORE button and choose the Print action.

    If you don’t see the Print action, your tablet lacks this feature.

    3. Choose a printer.

    The current printer is shown on the Action Bar, shown in Figure 17-4. To view
    additional printers, tap the Action Bar, illustrated in the figure. You see a
    list of all printers available on the Wi-Fi network.

    4. To change any print settings, tap the Show More Details chevron.

    The items presented let you set which pages you want to print, change the number
    of copies, and make other common printer settings.

    5. Tap the Print button.

    The item prints.


    Not every app supports printing. The only way to know is to work Steps 1 and 2
    in this section. If you don’t see the Print action, you can’t print.


