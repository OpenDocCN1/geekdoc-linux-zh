  md: '# Using the self-timer


    One common feature found on just about every Android tablet’s Camera app is the
    self-timer. Though it’s normally disabled, you can enable this feature to delay
    taking a still image for a given number of seconds after you tap the Single-Shot
    Shutter icon. Supposedly, that gives you enough time to run in front of the tablet
    so that you, too, can be in the photo.


    To activate the self-timer feature, tap its icon. On the Google Camera app, tap
    once to set a 3-second delay, tap again to set a 10-second delay. Tap a third
    time to disable the feature. The icons on the Camera app’s screen are similar
    to those shown in Table 11-1.


    TABLE 11-1


    # Self-Timer Icon Round-Up


    | Icon | Setting |

    |---|---|

    | 🚫⏱ | The self-timer function is disabled; photos snap instantly. |

    | 3s | The photo snaps 3 seconds after you tap the icon. |

    | 10s | The photo snaps 10 seconds after you tap the icon. |


    After you set the timer, tap the Still-Shot Shutter icon. Then dash out in front
    of the tablet so that it can take your photo.


    Oh: You probably want to prop up the tablet on something stable, or even get a
    tablet tripod mount. The self-timer is pretty useless without one.


    +   * >> On some Samsung tablets, you tap the Self-Timer icon, similar to the
    one shown in the margin, and choose a delay from the pop-up menu.

    * >> Turn off the self-timer when you want to return to standard, Still Shot mode,
    or when you’re exhausted from running around.


    ![](bbox=[0.11, 0.67, 0.24, 0.82])'
  merge: -1
  pgno: 157
- img_proc: false
  md: '# ## Reviewing what you just shot


    To preview the image you just shot, or to watch the video you just recorded, tap
    the previous image thumbnail on the Camera app''s screen. You might be able to
    swipe the previous image left or right to view other recently taken images. Tap
    the Back navigation icon to return to the Camera app.


    +   - With some versions of the Android Camera app, where the previous image thumbnail
    may not appear, swipe the screen from right to left to view the previous image.

    - One reason to review an image you just shot is to delete it. To do so, view
    the image or video and tap the Delete (Trash) icon. The image is removed immediately,
    although some tablets may prompt you for confirmation; tap the OK button to delete
    the image or video.

    - To manage all images taken by or stored in the tablet, use the Photos app. See
    Chapter 12.

    - If your pictures or videos appear blurry, ensure that the camera lens on the
    back of the tablet isn''t dirty. Or, you may have neglected to remove the plastic
    cover from the rear camera when you first set up your tablet.


    # ## Camera Settings and Options


    Some tablets feature a Camera app laden with features, controls, and more special
    effects than you''ll find in a Hollywood movie. Perhaps I''m exaggerating, but
    even the most basic Camera app sports options necessary for any amateur photographer.


    # ### Switching cameras


    You can do more with the tablet''s front-facing camera than take those infamous
    selfie shots. What more exactly you can do I can''t think of right now, but the
    key is to be able to switch between front and rear cameras while using the Camera
    app.


    The Switch Cameras icon is usually found right on the main Camera app screen,
    which is illustrated in Figures 11-1 and 11-2. Variations on these icons appear
    in Figure 11-4. If you don''t see such an icon on your tablet''s Camera app screen,
    tap the Action Overflow or Settings icon to look for the Switch Cameras icon or
    action.'
  merge: -1
  pgno: 158
- img_proc: false
  md: 'When you see yourself on the touchscreen, you know that you''ve successfully
    switched cameras. Take a picture, record a video, ask yourself whether that''s
    a zit on your chin.


    # # Setting the flash


    Not all Android tablets feature a flash on the rear camera. None features a flash
    for the front camera, which is a good thing.


    If your tablet has a flash, you can set its behavior: Tap the Flash icon that
    appears on the Camera app screen. As you tap the icon, it cycles through various
    flash options, all of which are shown in Table 11-2.


    # ## TABLE 11-2 Android Tablet Camera Flash Settings


    | Setting | Icon | When the Flash Activates |

    |---------|------|-------------------------|

    | Auto | ![Auto flash icon](image) | During low-light situations but not when
    it''s bright out |

    | On | ![On flash icon](image) | Always |

    | Off | ![Off flash icon](image) | Never, even in low-light situations |


    When you can''t find the Flash icon on the screen, tap the Action Overflow or
    Settings icon. I''ve also seen Camera apps that feature a sliding drawer on which
    you''ll find the Flash icon. Look for a triangle or chevron near the edge of the
    screen, which could be one of those slide-in drawers.


    > > A good time to turn on the flash is when taking pictures of people or objects
    in front of something bright, such as Aunt Ellen showing off her prized peach
    cobbler in front of a burning munitions factory.'
