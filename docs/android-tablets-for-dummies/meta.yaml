- img_proc: false
  md: 'To play with the Android Beam feature, ensure that the tablet''s NFC radio
    has been activated. Follow these steps:


    +   1. **Open the Settings app.**


    +   2. **Locate the NFC item.**


    On a stock Android device, choose the More item in the Wireless & Networks area.
    On Samsung tablets with this feature, tap the Connections heading to find the
    NFC item.


    If you can''t find an NFC item, your tablet lacks this technology.


    +   3. **Ensure that the NFC item is activated.**


    Either place a check mark next to the NFC item or ensure that its master control
    icon is in the On position.


    With NFC activated, you can use your tablet to communicate with other NFC devices,
    such as tablets, phones, and payment systems for various merchants.


    To make the Android Beam feature work, touch your tablet to another NFC device,
    usually back-to-back. As long as both devices have an NFC radio and the Android
    Beam feature is active, they can share information. You can beam items such as
    a contact, map location, web page, YouTube video, or just about anything you''re
    viewing on the tablet''s touchscreen.


    +   » When two Android Beam devices touch, you see a prompt appear on the screen:
    Touch to Beam. Tap the screen, and the item you''re viewing is immediately sent
    to the other device. That''s pretty much it.


    +   » Generally speaking, if an app features the Share icon, you can use Android
    Beam to share an item between two NFC gizmos.


    +   » Both devices present the Touch to Beam prompt when they get close. If the
