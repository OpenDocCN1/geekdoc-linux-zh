  md: '# Employ Keyboard Suggestions


    Don''t forget to take advantage of the predictive-text suggestions that appear
    above the onscreen keyboard while you''re typing text. In fact, you don''t even
    need to tap a suggestion; to replace your text with the highlighted suggestion,
    simply touch the onscreen keyboard''s Space key. Zap! The word appears.


    Refer to Chapter 4 for information on using the keyboard suggestions.


    # Avoid the Battery Hogs


    Three items on an Android tablet suck down battery power faster than a massive
    alien fleet is defeated by a plucky antihero who only wants the girl:


    +   » The display

    » Navigation

    » Wireless radios


    The display is obviously a most necessary part of your Android tablet — but it''s
    also a tremendous power hog. The Adaptive Brightness (also called Auto Brightness)
    setting is your best friend for saving power with the display. See Chapter 19.


    Navigation is certainly handy, but the battery drains rapidly because the tablet''s
    touchscreen is on the entire time and the speaker is dictating your directions.
    If possible, plug the tablet into the car''s power socket when you''re navigating.


    Wireless radios include Wi-Fi networking, Bluetooth, and GPS. Though they require
    extra power, they aren''t real power hogs, like navigation and the display. Still,
    when power is getting low, consider disabling those items.


    See Chapter 22 for more information on managing the tablet''s battery.


    # Unlock and Launch


    Quite a few Android tablets feature special Lock screen icons. For example, you
    may see an icon representing the Camera app. Samsung tablets can sport several
    app icons on the Lock screen. To unlock and launch an app, swipe the icon across
    the screen. That app instantly runs.'
  merge: -1
