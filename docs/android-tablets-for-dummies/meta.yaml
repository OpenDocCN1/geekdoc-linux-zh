  md: '+   » When the battery level is too low, the Android tablet shuts itself off.


    » The best way to deal with low battery power is to connect the tablet to a power
    source: Either plug it into a wall socket or connect it to a computer by using
    a USB cable. The tablet begins charging itself immediately; plus, you can use
    the device while it''s charging.


    » The tablet charges more efficiently when it''s plugged into a wall socket rather
    than a computer.


    » You don''t have to fully charge the Android tablet to use it. When you have
    only 20 minutes to charge and you get only a 70 percent battery level, that''s
    great. Well, it''s not great, but it''s far better than a lower battery level.


    » Battery percentage values are best-guess estimates. Just because you get 8 hours
    of use from the tablet and the battery meter shows 20 percent remaining doesn''t
    imply that 20 percent equals 2 more hours of use. In practice, the amount of time
    you have left is much less than that. As a rule, when the battery percentage value
    gets low, the battery appears to drain faster.


    # Determining what is drawing power


    An Android tablet is smart enough to know which of its features and apps use the
    most battery power. You can check it out for yourself on the battery usage screen,
    such as the one shown in Figure 22-2.


    To view the battery usage screen on your tablet, follow these steps:


    +   1. **Open the Settings app.**

    2. **Choose Battery.**

    On some Samsung tablets, you tap the General tab in the Settings app to locate
    the Battery item.


    Tap an item in the list to view specific details. For some items, the details
    screen hosts a button that lets you adjust power settings or even disable the
    feature.


    The number and variety of items shown on the battery usage screen depend on what
    you''ve been doing with your tablet between charges and how many different apps
    you''ve been using. Don''t be surprised if an item doesn''t show up in the list;
    not every app consumes a lot of battery power.'
