  md: "# Finding text on a web page\n\nTo locate text on a web page, tap the Action\
    \ Overflow and choose Find in Page. Use the onscreen keyboard to type search text.\
    \ Matching text on the page is highlighted. Use the up and down chevrons to page\
    \ through found matches.\n\nTap the Back navigation icon when you've finished\
    \ searching.\n\n# Sharing a web page\n\nThere it is! That web page you just have\
    \ to talk about to everyone you know. The gauche way to share the page is to copy\
    \ and paste it. Because you're reading this book, though, you know the better\
    \ way to share a web page. Heed these steps:\n\n+   1. **Go to the web page you\
    \ desire to share.**\n\n   Actually, you're sharing a link to the page, but don't\
    \ let my obsession with specificity deter you.\n\n2. **Tap the Action Overflow\
    \ icon and choose Share.**\n\n   The command might be called Share Via or Share\
    \ Page. Either way, you see an array of apps displayed. The variety and number\
    \ of apps depends on what's installed on the tablet.\n\n3. **Choose an app.**\n\
    \n   For example, choose Gmail to send the web page's link by email, or Facebook\
    \ to share the link with your friends.\n\n4. **Do whatever happens next.**\n\n\
    \   Whatever happens next depends on how you're sharing the link: Compose the\
    \ email, write a comment in Facebook, or whatever. Refer to various chapters in\
    \ this book for specific directions.\n\nYou cannot share a page you're viewing\
    \ on an incognito tab.\n\nAnother way to share a page is to print it. See Chapter\
    \ 17 for details.\n\n# The Art of Downloading\n\nThe most important thing you\
    \ need to know about downloading is that it's a transfer of information from another\
    \ source to your gizmo. For your Android tablet, the other source is the Internet.\
    \ The information that's transferred is"
