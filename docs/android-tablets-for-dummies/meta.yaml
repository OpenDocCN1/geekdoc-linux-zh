    # Chapter 7

    Tablet Web Browsing


    ’m certain that the World Wide Web was designed to be viewed on a computer. The
    monitor is big and roomy. Web pages are displayed amply, like Uncle Blake on the
    sofa watching a ballgame. The smaller the screen, however, the more difficult
    it is to view web pages designed for those roomy monitors. The web on a cell phone?
    Tragic. But on an Android tablet?


    Your tablet doesn’t have the diminutive screen of a cell phone, nor does it have
    a widescreen computer monitor. Instead, the tablet’s screen is a good size in
    between, like a younger, thinner version of Uncle Blake. That size is enjoyable
    for viewing the web, especially when you’ve read the tips and suggestions in this
    chapter.


    ![](bbox=[0.174, 0.708, 0.237, 0.782])


    +   » If you have an LTE tablet, activate the Wi-Fi connection before you venture
    out on the web. The mobile data (cellular) connection works, but a Wi-Fi connection
    incurs no data usage charges.

    » Many places you visit on the web can instead be accessed directly and more effectively
    by using specific apps. Facebook, Gmail, Twitter, YouTube, and other popular web
    destinations have apps that you may find already installed on your tablet or are
    otherwise available for free from Google Play.'
