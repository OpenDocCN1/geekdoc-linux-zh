    # Accessing Wi-Fi in foreign lands


    Wi-Fi is pretty universal. The same protocols and standards are used everywhere,
    so if the tablet can access Wi-Fi at your local Starbucks, it can access Wi-Fi
    at the Malted Yak Blood Café in Wamboolistan. As long as Wi-Fi is available, your
    Android tablet can use it.


    +   >> See Chapter 16 for details on using Wi-Fi with your Android tablet.

    >> Internet cafés are more popular overseas than in the United States. They are
    the best locations for connecting your tablet and catching up on life back home.

    >> Many overseas hotels offer free Wi-Fi service, although the signal may not
    reach into every room. Don''t be surprised if you can use the Wi-Fi network only
    while you''re in the lobby.

    >> Obtain Skype Credit to use your Android tablet to place phone calls overseas.
    Skype''s international rates are quite reasonable. The calls are made over the
    Internet, so when the tablet has Wi-Fi access, you''re good to go. See Chapter
    8 for more information on making Skype calls.


    ![](bbox=[0.17, 0.42, 0.24, 0.54])


    # Disabling data roaming


    The word *roam* takes on an entirely new meaning when it''s applied to an LTE
    tablet (which features a cellular modem). Whenever you venture outside of your
    carrier''s service area, the tablet may end up latching onto another mobile data
    network. When that happens, the tablet is roaming.


    Roaming sounds handy, but there''s a catch: It almost always involves a surcharge
    for using another mobile data network — an unpleasant surcharge.


    Relax: Your cellular tablet alerts you whenever you''re roaming. The Roaming icon
    appears in the status area, similar to the one shown in the margin. You may even
    see the word *Roaming* on the Lock screen and witness the name of the foreign
    cellular provider where the local provider''s name normally appears.


    ![](bbox=[0.17, 0.75, 0.24, 0.8])'
