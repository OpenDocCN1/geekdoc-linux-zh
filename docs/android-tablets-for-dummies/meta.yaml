    » Pinch the screen to zoom out or spread two fingers to zoom in.


    » The page you see may be the mobile page, or a customized version of the web
    page designed for small-screen devices. To see the nonmobile version, tap the
    Action Overflow and choose Desktop View.


    » You can orient the tablet vertically to read a web page in Portrait mode. Doing
    so may reformat some web pages, which can make long lines of text shorter and
