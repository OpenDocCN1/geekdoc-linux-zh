  md: "# Keyboard Settings\n\nQuite a few options are available for the Google Keyboard,\
    \ some of which enable special features and others that supposedly make the onscreen\
    \ typing experience more enjoyable. I'll leave it up to you to determine whether\
    \ that's true.\n\n# Generating keyboard feedback\n\nThe onscreen keyboard can\
    \ help with your typing by generating haptic feedback. This is in the form of\
    \ either a pleasing click sound or the tablet's vibration. To check these settings,\
