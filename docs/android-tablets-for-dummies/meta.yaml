  md: "# # Hanging new wallpaper\n\nThe Home screen background can be draped with\
    \ two types of wallpaper: traditional and live. *Traditional* wallpaper can be\
    \ any image, such as a picture you've taken or an image provided by the tablet's\
    \ manufacturer. *Live* wallpaper is animated or interactive.\n\nTo set a new wallpaper\
    \ for the Home screen, obey these steps:\n\n+   1. **Long-press the Home screen.**\n\
    2. **Choose Wallpapers.**\n   The command might be Set Wallpapers on some tablets.\n\
    3. **Tap a wallpaper to see a preview.**\n   Swipe the list left or right to peruse\
    \ your options. You see the previous wallpaper images, plus those provided by\
    \ the tablet manufacturer. On the far right, you'll find the live wallpapers.\n\
    \   Some tablets may first prompt you to select a category, such as Wallpapers,\
    \ Life Wallpapers, and Images.\n4. **Tap the Set Wallpaper button to confirm your\
    \ choice.**\n   The new wallpaper takes over the Home screen.\n\nIf you prefer\
    \ to use an image from the tablet's photo library, tap the My Photos or From Gallery\
    \ button in Step 3. Choose an image. On some tablets, you're required to crop\
    \ the image; manipulate the cropping rectangle to do so. Tap the Done button to\
    \ set the wallpaper.\n\n![](bbox=[0.17, 0.67, 0.23, 0.75])\n\n> >> On some Samsung\
    \ tablets, tabs atop the Wallpapers screen let you choose to set wallpaper for\
    \ the Home screen, Lock screen, or both. See the later section “Setting the Lock\
    \ screen background.”\n>> Be careful how you crop the wallpaper image when you\
    \ choose one of your own photos. Zoom out (pinch your fingers on the touchscreen)\
    \ to ensure that the entire image is cropped properly for both the tablet's horizontal\
    \ and vertical orientations.\n>> Live wallpapers can be obtained from Google Play.\
    \ See Chapter 15.\n>> The Zedge app is an über-repository of wallpaper images,\
    \ collected from Android users all over the world. Zedge is a free app.\n>> See\
    \ Chapter 12 for more information on how to crop an image."
