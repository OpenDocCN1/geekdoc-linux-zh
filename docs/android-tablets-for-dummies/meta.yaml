    \    You can hunt down apps, books, music — the whole gamut.\n3. **Click the INSTALL\
    \ button or BUY button.**\n    If you're prompted to sign in to your Google account,\
    \ do so. Use the same account as you use on your tablet.\n4. **Choose your Android\
    \ tablet from the Choose a Device menu.**\n    If your tablet isn't listed, the\
    \ app isn't compatible. That happens. Also, the tablet may be listed using its\
    \ technical name, not the brand name you're used to seeing.\n5. **For a free app,\
    \ click the INSTALL button. For a paid app, click the CONTINUE button, choose\
    \ your payment source, and then click the BUY button.**\n    Installation proceeds.\n\
    \nAs if by magic, the app is installed on your Android tablet — even though you\
