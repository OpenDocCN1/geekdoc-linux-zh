    # Finding a lost tablet


    Someday, you may lose your beloved Android tablet. It might be for a few panic-filled
    seconds, or it might be for forever. The hardware solution is to weld a heavy
    object to the tablet, such as a vending machine, yet that strategy kind of defeats
    the entire mobile/wireless paradigm. The software solution is to follow these
    steps:


    **1. On a computer, open a web browser, such as Google Chrome.**


    **2. Visit the main Google search page: google.com**


    **3. Into the Search box, type find my tablet and press the Enter key.**


    **4. If prompted, sign in to your Google (Gmail) account.**


    Your device''s location appears on the screen.'
