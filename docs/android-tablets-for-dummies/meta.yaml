    Now. It''s not quite like having your own personal Jeeves, but it''s close.


    Google Now is often found dwelling on the far left Home screen page: Swipe the
    Home screen from left to right until you see it. This feature isn''t available
    on every tablet, so you can instead find the Google app in the Apps drawer.


    The main Google Now screen looks similar to what''s shown in Figure 14-6. Below
    the Search text box, you''ll find cards. The variety and number of cards depend
    on how often you use Google Now. Though you can''t manually add cards, the more
    the app learns about you, the more cards appear.


