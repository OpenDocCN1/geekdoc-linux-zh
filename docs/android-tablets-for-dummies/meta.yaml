  md: '# # Introducing the Camera app


    Google makes a standard Camera app, which is called Google Camera. Not every tablet
    uses that app, however. In fact, of all the apps on various Android tablets, the
    Camera app is the one that differs the most.


    Generally speaking, the Camera app features at least two shooting modes: Still
    Shot and Video. Additional modes may offer features like a panorama and even special-effects
    shots. All these shooting modes are handled by the single Camera app.


    The Camera app also controls both the tablet''s cameras: the main camera, which
    is on the tablet''s backside, and the front-facing camera, which is on the tablet''s
    front above the touchscreen.


    Figure 11-1 shows the Google Camera app''s main interface in Still Shot mode.
    To switch to Video mode, swipe the screen from right to left, as indicated in
    the figure.


    ![](bbox=[0.16, 0.43, 0.76, 0.73])


    Just to show you how different things can be, Figure 11-2 shows the Camera app
    on a Samsung Galaxy Tab S2. This isn''t even the same app you''d find on all Samsung
    Galactic tablets; nope, each one can be unique.


    Similar items are present in both Figures 11-1 and 11-2, which is probably true
    for your tablet''s camera app as well. Refer to the next section for details on
    what''s important when it comes to taking pictures or recording video.'
  merge: -1
  pgno: 153
- img_proc: false
  md: '![](bbox=[0.15, 0.072, 0.85, 0.51])


    +   - You can take as many pictures or record as much video with your tablet as
    you like, as long as you don''t run out of space in the tablet''s internal storage
    or external storage.

    - A tablet with a microSD card installed automatically saves images to that location.
    Otherwise, images are saved internally.

    - See Chapter 12 for information on previewing and managing pictures and videos.


    # ## Using basic camera controls


    Here are some pointers to consider when using your tablet to take a still shot
    or record a video:


    +   - The tablet can be used as a camera in either landscape or portrait orientation.
    Don''t worry either way: The image is always saved with the proper side up.'
  merge: -1
  pgno: 154
- img_proc: false
  md: '+   >> If you''re recording a video, please-o-please use the tablet in a horizontal
    orientation. That''s the way people expect to see video, and your fans on YouTube
    will appreciate the proper orientation.


    >> The tablet''s touchscreen serves as the viewfinder; what you see on the screen
    is exactly what appears in the final photo or video.


    >> Tap the screen to focus on a specific object. You see a focus ring or square
    that confirms how the camera lens is focusing. Not every tablet has a camera that
    can focus; I''ve not seen any front-facing camera that can focus.


    >> Spread your fingers on the touchscreen to zoom.


    >> Pinch your fingers on the touchscreen to zoom out.


    >> Some tablets let you use the volume key to zoom in or out: Volume Up zooms
    in, Volume Down zooms out. On other cameras, press the volume key to take a still
    shot, a function that works even while you record video.


    >> Hold the tablet steady! I recommend using two hands for taking a still shot
    and for shooting video.


    >> The phone stores pictures and videos in the DCIM/Camera folder. Still images
    are stored in the JPEG or PNG file format; video is stored in the MPEG-4 format.


    # Capturing a still shot


    Taking a still image requires only two steps. First, ensure that the Camera app
    is in Single-Shot mode. Second, tap the Shutter icon to snap the photo.


    In the Google Camera app, to ensure that you''re in Single-Shot mode, check for
    the Shutter icon, shown in the margin. (Also refer to Figure 11-2 for what the
    Shutter icon looks like on a Galaxy Tab.)


    +   >> The image you see in the Camera app''s viewfinder is exactly what you see
    for the final photo.


    >> Most Camera apps play a shutter sound when a still-shot image is taken.


    >> Set the resolution before you shoot. See the later section "Choosing resolution
    and quality."'
