  md: '# # The Bluetooth World


    *Bluetooth* has nothing to do with the color blue or dental hygiene. No, it''s
    a wireless protocol for communication between two or more Bluetooth-equipped devices.
    Your Android tablet just happens to have a Bluetooth wireless radio in its belly,
    so it can chat it up with Bluetooth devices, such as keyboards, headphones, printers,
    and robotic mice armed with deadly lasers.


    # ## Understanding Bluetooth


    To make Bluetooth work, you need a Bluetooth peripheral, such as a wireless keyboard.
    The goal is to pair that peripheral with your tablet. The operation works like
    this:


    +   1. **Turn on the Bluetooth wireless radio on both your tablet and the peripheral.**


    +   2. **Make the peripheral discoverable.**


    The peripheral must announce that it''s available and willing to go steady with
    other electronics in the vicinity.


    +   3. **On your tablet, choose the peripheral from the list of Bluetooth devices.**


    +   4. **If required, confirm the connection.**


    For example, you may be asked to input a code on the tablet, confirm a code on
    a printer, or press a button on peripherals that have buttons.


    +   5. **Use the Bluetooth peripheral.**


    You can use the Bluetooth peripheral as much as you like. Turn off the tablet.
    Turn off the peripheral. When you turn both on again, they''re automatically reconnected.


    Bluetooth devices are branded with the Bluetooth logo, shown in the margin. It''s
    your assurance that the gizmo works with other Bluetooth devices.


    ![](bbox=[0.178, 0.672, 0.227, 0.727])


    # ## Activating Bluetooth on your tablet


    You must turn on the tablet''s Bluetooth radio before you can enjoy using any
    Bluetooty peripherals. Here''s how to activate Bluetooth on an Android tablet:


    +   1. **Open the Settings app.**


    +   2. **Choose Bluetooth.**


    On some Samsung tablets, tap the Connections tab to locate the Bluetooth item.'
  merge: -1
  pgno: 225
- img_proc: false
  md: '+   3. **Ensure that the Bluetooth master control is set to the On position.**

    Slide the icon to the right to activate.


    ![](bbox=[0.17, 0.15, 0.24, 0.19])


    When Bluetooth is on, the Bluetooth status icon appears. It uses the Bluetooth
    logo, shown in the margin.


    To turn off Bluetooth, repeat the steps in this section but slide the master control
    to the Off position in Step 3.


    ![](bbox=[0.17, 0.26, 0.24, 0.3])


    You’ll also find a Bluetooth activation button in the tablet’s Quick Settings,
    as foretold in Chapter 3.


    # Pairing with a Bluetooth peripheral


    To make the Bluetooth connection between your tablet and some other gizmo, such
    as a Bluetooth keyboard, follow these steps:


    +   1. **Ensure that the tablet’s Bluetooth radio is on.**

    Refer to the preceding section.

    2. **Make the Bluetooth peripheral discoverable.**

    Turn on the gizmo and ensure that its Bluetooth radio is on. Keep in mind that
    some Bluetooth peripherals have separate power and Bluetooth switches. If so,
    press the Bluetooth button or take whatever action is necessary to make the peripheral
    discoverable.

    3. **On the Android tablet, open the Settings app.**

    4. **Choose Bluetooth.**

    On some Samsung tablets, tap the Connections tab in the Settings app to locate
    the Bluetooth item.


    ![](bbox=[0.18, 0.68, 0.24, 0.72])


    The Bluetooth screen shows already paired and available peripherals, similar to
    what’s shown in Figure 16-2. If not, tap the Action Overflow and choose Refresh.
    Some tablets may use the Scan button or show the Refresh icon, illustrated in
    the margin.


    +   5. **Choose the Bluetooth peripheral from the list.**

    6. **If necessary, type the device’s passcode or otherwise acknowledge the connection.**


    For example, with a Bluetooth keyboard, you may see a prompt on the tablet showing
    a series of numbers. Type those numbers on the keyboard and then press the Enter
    or Return key. That action completes the pairing.'
