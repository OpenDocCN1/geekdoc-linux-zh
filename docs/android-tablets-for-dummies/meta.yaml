  md: '# # Unfolding the Maps app


    To start the Maps app, tap its launcher on the tablet''s Home screen. You might
    find the launcher inside a Google folder. And, as with all apps on the tablet,
    you tap the Apps icon to locate the Maps app in the Apps drawer.


    If you''re starting the app for the first time or it has been recently updated,
    you can read the What''s New screen; tap the OK or GOT IT button to continue.


    Your tablet communicates with Global Positioning System (GPS) satellites to hone
    in on your current location. The position is accurate to within a given range,
    referenced by a blue circle around your location shown on the screen, as illustrated
    in Figure 10–1. If the circle doesn''t appear, either your location is pretty
    darn accurate or you need to zoom in.


    ![](bbox=[0.138, 0.36, 0.875, 0.805])


    Here are some fun things you can do when viewing the basic street map:


    **Zoom in:** To make the map larger (to move it closer), double-tap the screen.
    You can also spread your fingers on the touchscreen to zoom in.'
  merge: -1
  pgno: 139
- img_proc: false
  md: '**Zoom out:** To make the map smaller (to see more), pinch your fingers on
    the touchscreen.


    **Pan and scroll:** To see what''s to the left or right or at the top or bottom
    of the map, swipe your finger on the touchscreen. The map scrolls in the direction
    you swipe.


    **Rotate:** Using two fingers, rotate the map clockwise or counterclockwise. Tap
    the Compass Pointer icon, shown in the margin, to reorient the map with north
    at the top of the screen.


    **Perspective:** Touch the screen with two fingers and swipe up or down to view
    the map in perspective. You can also tap the Location icon to switch to Perspective
    view, though that trick works only for your current location. To return to Flat-Map
    view, tap the Compass Pointer icon.


    The closer you zoom in on the map, the more detail you see, such as street names,
    address block numbers, businesses, and other sites — but no tiny people.


    +   » See the nearby sidebar "Activate location technology!" to confirm that the
    tablet presents your location accurately.


    » The blue triangle (shown in the center of Figure 10-1, inside a faint blue circle)
    shows in which general direction the tablet is pointing.


    » When the tablet''s direction is unavailable, you see a blue dot as your location
    on the map.


    » When the Location icon is blue, you''re viewing your current location on the
    map. Tap the icon to enter Perspective view. Tap the Perspective icon, shown in
    the margin, to return to Flat-Map view.


    » When all you want is a virtual compass, similar to the one you lost as a kid,
    get a compass app from Google Play. See Chapter 15 for more information about
    Google Play.


    > ## ACTIVATE LOCATION TECHNOLOGY!


    The Maps app works best when you activate all the tablet''s location technologies,
    including both GPS and Wi-Fi. To ensure that these technologies are in use, open
    the Settings app and choose the Location item. On Samsung tablets, this item might
    be located in the Privacy area. Ensure that the master control is in the On position.
    Further, if a Mode item or Locating Method item is available, choose it and select
    either the High Accuracy item or the GPS and Wi-Fi option.'
