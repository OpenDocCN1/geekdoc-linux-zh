  md: '# ANDROID TABLET PURCHASING TIPS


    The major things to look for when purchasing an Android tablet are the screen
    size and whether you want an LTE or a Wi-Fi-only device.


    Larger screens are more visible and easier to read, but a larger tablet requires
    two hands to operate. A smaller-size tablet might be more convenient. The only
    way to know which size works best for you is to manhandle an Android tablet at
    the store before you buy.


    LTE tablets use the mobile data network to access the Internet, just like a smartphone.
    That capability comes with a monthly bill, but if you need Internet access anywhere,
    it''s worth the price. Both LTE and Wi-Fi-only tablets can access Wi-Fi networks.


    Some tablets feature removable storage in the form of a microSD card. This feature
    allows you to expand the device''s storage and more easily share files with a
    computer.


    Ensure that the tablet has both front and rear cameras. The camera resolution
    isn''t vital, but if your tablet will be your only digital camera, getting a high-resolution
    rear camera is a plus. Also confirm that the rear camera has a flash.


    Beyond these basic items, most Android tablets are the same, with only subtle
    software differences. Do ensure, however, that your tablet uses the Android operating
    system and can access and use Google Play. Some low-price, bargain tablets restrict
    your purchases to the manufacturer''s own app store. I would avoid such devices.


    # # Liberating the tablet from the box


    Thanks to an excess of funds, your federal government has conducted numerous studies
    on how people use electronic devices. Men and women wearing white lab coats and
    safety goggles have determined that using an Android tablet works best when you
    first remove it from its box. Thank you, federal grant!


    I assume that you''re pretty good at the box-opening thing, so I probably don''t
    need to detail that procedure. I can affirm, however, that it''s perfectly okay
    to remove and throw away those protective plastic sheets clinging to the front,
    back, and sides of the tablet. And don''t be embarrassed when, three weeks from
    now, you find yet another plastic sheet you haven''t removed. Feel free to remove
    and throw away the plastic sheets.


    Along with the tablet, you''ll find the following items in the box:


    +   - **USB cable:** You can use it to connect the tablet to a computer or a wall
    charger.'
