    # # Help and Troubleshooting


    Wouldn''t it be great if you could have an avuncular Mr. Wizard type available
    at a moment''s notice? He could just walk in and, with a happy smile on his face
    and a reassuring hand on your shoulder, let you know what the problem is and how
    to fix it. Then he''d give you a cookie. Never mind that such a thing would be
    creepy — getting helpful advice is worth it.


    # ## Fixing random and annoying problems


    Here are some typical problems you may encounter on your Android tablet and my
    suggestions for a solution:


    # ### General trouble


    For just about any problem or minor quirk, consider restarting the tablet. If
    the tablet features a Restart action on the Device Options menu, use it. Otherwise,
    turn off the tablet, and then turn it on again. This procedure will most likely
    fix a majority of the annoying problems you encounter.


    See Chapter 2 for basic tablet on/off instructions.


    # ### Connection woes


    As you move about, the cellular signal can change. In fact, you may observe the
    status icon change from 4G LTE to 3G to even the dreaded 1X or — worse — nothing,
    depending on the strength and availability of the mobile data network.


    My advice for random signal weirdness is to wait. Oftentimes, the signal comes
    back after a few minutes. If it doesn''t, the mobile data network might be down,
    or you may simply be in an area with lousy service. Consider changing your location.


    For Wi-Fi connections, ensure that Wi-Fi is set up properly and working. This
    process usually involves pestering the person who configured the Wi-Fi router
    or, in a coffee shop, bothering the cheerful person with the tattoos and piercings
    who serves you coffee.'
