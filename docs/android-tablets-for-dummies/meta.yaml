    # Android Tablet Camera 101


    An Android tablet isn''t the world''s best camera. And I''m sure that Mr. Spock''s
    tricorder wasn''t the best camera in the *Star Trek* universe, either, but it
    could take pictures. That comparison is kind of the whole point: Your Android
    tablet is an incredible gizmo that does many things. One of those things is to
    take pictures, which is the responsibility of the Camera app.'
