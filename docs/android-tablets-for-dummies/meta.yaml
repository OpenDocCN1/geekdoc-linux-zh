    # Digital Social Life


    Long ago, social networking eclipsed email as the number-one reason for using
    the Internet. It has nearly replaced email, has definitely replaced having a personalized
    website, and has become an obsession for millions across the globe. Your Android
    tablet is ready to meet your social networking desires.


    # ## Your Life on Facebook


    Of all the social networking sites, Facebook is the king. It''s the online place
    to go to catch up with friends, send messages, express your thoughts, share pictures
    and videos, play games, and waste more time than you ever thought you had.


    +   **TIP**


    - The best way to access Facebook is to use the Facebook app. This app is preinstalled
    on some tablets. If not, you can obtain the Facebook app for free at Google Play.
    See Chapter 15.

    - You can use the Facebook app to sign up for a Facebook account, or you can use
    your existing account.

    - After signing in to Facebook the first time, you have to perform configuration.
    I recommend choosing the option to synchronize Facebook with your phone''s contacts.'
