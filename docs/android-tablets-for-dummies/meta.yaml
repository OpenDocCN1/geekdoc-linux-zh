    # Android Tablet Storage


    Somewhere, nestled in your Android tablet’s bosom, lies a storage device. That
    storage works like the hard drive in a computer, and for the same purpose: to
    keep apps, music, videos, pictures, and a host of other information for the long
    term.


    +   » Android tablets come with a given quantity of internal storage. The amount
    is preset by the manufacturer, usually given as an option at purchase time.

    » Typical quantities of internal storage include 16GB, 32GB, 64GB, and more.

    » Removable storage in the form of a microSD card is available on some Android
    tablets.

    » GB stands for gigabyte, or 1 billion bytes (characters) of storage. A typical
    2-hour movie occupies about 4GB of storage, but most items that you store on the
    tablet — music and pictures, for example — take up only a sliver of storage.


