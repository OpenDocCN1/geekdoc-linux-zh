  md: 'If you have an LTE tablet, you see cellular data usage, not the Wi-Fi usage
    shown in Figure 23-2. To view Wi-Fi usage, tap the Action Overflow and choose
    Show Wi-Fi. You can then tap the CELLULAR or WI-FI tabs to view separate usage
    statistics.


    To help avoid data surcharges, activate the Set Cellular Data Limit option that
    appears on the CELLULAR tab (not shown in Figure 23-2); set that option''s master
    control to the On position. You can then adjust the black and red sliders on the
    chart to create a warning and cutoff values: When the black line is crossed, a
    warning appears. When the red line is crossed, the tablet ceases using the mobile
    data network.


    +   * The line chart (refer to Figure 23-2) informs you of your data usage over
    a specific period. Tap the Data Usage Cycle Action Bar to set that timespan, for
    example, matching it up with your cellular provider''s monthly billing cycle.

    * My monthly data plan is capped at 10GB. I set the limits (on all my Android
    devices) to 8GB for the warning (black bar) and 9.5GB for the stop (red bar).

    * Keep in mind that the data usage shown on your tablet may not reflect the same
    values tracked by the cellular provider.

    * If you notice that the app is using more data than it should, tap the App Settings
    button. You may be able to adjust some settings to curtail unintended Internet
    access. For example, you can allow large uploads or downloads only over the Wi-Fi
    network.


    # Share Mobile Data


    It''s marvelously convenient to have a cellular tablet and be able to use the
    Internet wherever you roam. If you''re feeling benevolent, you can share that
    mobile data connection in one of two ways: Create a mobile hotspot or tether the
    connection to a single device, such as a laptop computer.


    To create a mobile hotspot, heed these steps:


    +   1. **Turn off the tablet''s Wi-Fi radio.**

    There''s no point in creating a Wi-Fi hotspot where one is already available.

    2. **If possible, connect your Android tablet to a power source.**

    Running a mobile hotspot draws a lot of power.'
  merge: -1
  pgno: 304
- img_proc: false
  md: '+   3. Open the Settings app.

    Some tablets may feature an app named Mobile Hotspot or 4G Hotspot. If so, open
    it instead.


    +   4. In the Wireless & Networks area, tap the More item.


    +   5. Choose Tethering & Portable Hotspot.

    The Tethering & Portable Hotspot item might be found on the main Settings app
    screen. On some Samsung tablets, tap the Connections tab and then choose Tethering
    and Portable Hotspot.

    You may see text describing the process. If so, dismiss the text.


    +   6. Activate the Portable Wi-Fi Hotspot item.

    The item might be titled Mobile Hotspot.


    +   7. Choose Set Up Wi-Fi Hotspot.

    On some Samsung tablets, tap the MORE button and choose Configure Mobile Hotspot.

    Give the hotspot a name, or SSID, and review, change, or assign a password. You
    may need to tap a Configure button to set up these items.


    +   8. Tap the SAVE or OK button to set your changes.


    To deactivate the mobile hotspot, repeat these steps but deactivate the Portable
    Wi-Fi Hotspot item in Step 6.


    A more direct way to share the mobile data network is to tether the tablet to
    a computer by using a USB cable. Follow these steps to set up Internet tethering:


    +   1. Use a USB cable to connect the tablet to a computer or laptop.


    +   2. Open the Settings app.


    +   3. In the Wireless & Networks are, tap the More item.

    On some Samsung tablets, tap the Connections tab and choose Tethering.


    +   4. Activate USB Tethering.


    The other device instantly recognizes the Android tablet as a “modem” with Internet
    access. Further configuration may be required, which depends on the computer using
    the tethered connection. For example, you may have to accept the installation
    of new software when prompted by Windows.


    To terminate your Internet tethering session, repeat Steps 2 through 4 to remove
    the check mark. You can then disconnect the USB cable.'
