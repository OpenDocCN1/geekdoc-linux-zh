  md: "# # AVOIDING ANDROID VIRUSES\n\n![](bbox=[0.168, 0.085, 0.237, 0.157])\n\n\
    How can you tell which apps are legitimate and which might be viruses or evil\
    \ apps that do odd things to your Android tablet? Well, you can't. In fact, most\
    \ people can't, because most evil apps don't advertise themselves as such.\n\n\
    The key to knowing whether an app is evil is to look at what it does, as described\
    \ in this chapter. The key to knowing whether an app is malicious is to look at\
    \ its access card: Open the app's description in the Play Store app, and see which\
    \ permissions it's granted. If a simple grocery list app uses the tablet's microphone\
    \ and the app doesn't need to use the microphone, it's suspect.\n\nIn the history\
    \ of the Android operating system, only a handful of malicious apps have been\
    \ distributed, and most of them were found on devices used in Asia. Google routinely\
    \ removes malicious apps from its inventory. Google is also capable of remotely\
    \ uninstalling malicious apps from your tablet. So you're pretty safe.\n\nGenerally\
    \ speaking, avoid \"hacker\" apps, porn apps, and apps that use social engineering\
    \ to make you do things on your tablet that you wouldn't otherwise do, such as\
    \ visit an unknown website to see racy pictures of politicians or celebrities.\n\
