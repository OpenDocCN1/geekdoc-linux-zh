  md: 'Pandora Radio and Spotify let you select music based on your mood and preferences.
    The more feedback you give the apps, the better the music selections.


    The TuneIn Radio app gives you access to hundreds of Internet radio stations located
    around the world. They''re organized by category, so you can find just about whatever
    you want. Many of the radio stations are also broadcast radio stations, so odds
    are good that you can find a local station or two, which you can listen to on
    your Android tablet.


    These apps, as well as other, similar apps, are available for free. Paid versions
    might also be found on Google Play. The paid versions generally provide unlimited
    music with no advertising.


    +   » Google offers an unlimited music listening service. You can tap the item
    SUBSCRIBE NOW in the navigation drawer to sign up. (Refer to Figure 13-1.) The
