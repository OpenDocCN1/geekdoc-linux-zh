    # Chapter **21**


    # On the Road


    As a mobile device, your Android tablet is designed to go wherever you go. And
    if you give the tablet a good throw, it can go beyond where you go, but that''s
    not my point. Because it is wireless and has a generous battery, the tablet is
    built to go on the road. Where can you take it? How can it survive? What if it
    runs off by itself? Does it need wheels? These are some of the issues regarding
    taking your tablet elsewhere.


    # You Can Take It with You


    How far can you go with an Android tablet? As far as you desire to go. As long
    as you can carry the tablet with you, it goes where you do. How it functions may
    change depending on your environment, and you can do a few things to prepare before
    you go.


    # Preparing to leave


    Unless you''re being unexpectedly abducted, you should prepare several things
    before leaving on a trip with your Android tablet.


    First and most important, of course, is to charge the thing. I plug in my Android
    tablet overnight before I leave the next day. The tablet''s battery is nice and
    robust, so power should last until well after you reach your destination.'
  merge: -1
  pgno: 280
- img_proc: false
  md: 'Second, consider loading up on some reading material, music, and a few new
    apps before you go.


    Finally, don''t forget your tickets! Many airlines offer apps. The apps may make
    traveling easy because they generate notifications for your schedule and provide
    timely gate changes or flight delays — plus, you can use the tablet as your e-ticket.
    Search Google Play to see whether your preferred airline offers an app.


    +   - For entertainment, consider getting some eBooks for the road. I prefer to
    sit and stew over Google Play''s online library before I leave, as opposed to
    wandering aimlessly in some airport sundry store, trying hard to focus on the
    good books rather than on the salty snacks. Chapter 14 covers reading eBooks on
    your Android tablet.

    - Picking up some music might be a good idea as well. Visit Chapter 13.

    - I usually reward myself with a new game before I go on a trip with my tablet.
    Visit Google Play Store and see what''s hot or recommended. A good puzzle game
    can make a nice, long international flight go by a lot quicker.


    # Going to the airport


    I''m not a frequent flier, but I am a nerd. The most amount of junk I''ve carried
    with me on a flight is two laptop computers and three cell phones. I know that''s
    not a record, but it''s enough to warrant the following list of travel tips, all
    of which apply to taking an Android tablet with you on an extended journey:


    +   - Take the Android tablet''s AC adapter and USB cable with you. Put them in
    your carry-on luggage.

    - Most airports feature USB chargers, so you can charge the tablet in an airport,
    if you need to. Even though you need only the cable to charge, bring along the
    AC adapter, anyway.

    - At the security checkpoint, place your Android tablet in a bin by itself or
    with other electronics. The exceptions are when you''ve been approved for pre-check
    or you''re using a preapproved tablet carrying pouch.

    - Use the Calendar app to keep track of your flights. The event title serves as
    the airline and flight number. For the event time, use the take-off and landing
    schedules. For the location, list the origin and destination airport codes. And,
    in the Description field, put the flight reservation number. If you''re using
    separate calendars (categories), specify the Travel calendar for your flight.
    See Chapter 14 for more information on the Calendar app.


    ![](bbox=[0.16, 0.765, 0.227, 0.836])'
  merge: -1
  pgno: 281
- img_proc: false
  md: "> » Scan for the airport's Wi-Fi service. Most airports don't charge for the\
    \ service, though you may have to agree to terms by using the tablet's web browser\
    \ app to visit the airport's website.\n\n# Flying with an Android tablet\n\nIt\
    \ truly is the trendiest of things to be aloft with the latest mobile gizmo. Like\
