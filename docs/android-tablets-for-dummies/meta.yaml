  md: 'To use Skype, you need a Skype account. You can sign up when you first open
    the app. You will need to confirm your new account, and that confirmation must
    take place before you can start using the app.


    > » Direct Skype to scour the tablet''s address book for contacts. This process
    may take a while.


    » Skype is free to use. Text chat is free. Voice and video chat with one other
    Skype user is also free. When you want to call a real phone, or video-chat with
    a group, you need to boost your account with Skype Credit.


    » It''s doesn''t cost extra to do a gang video chat in the Hangouts app.


    » Don''t worry about getting a Skype number, unless you plan to receive Skype
    phone calls on your tablet. Those phone calls include calls from any phone, not
    just a mobile device using the Skype app.


    # Running Skype


    After you initially sign into Skype, the app continues to run on your tablet.
    Only when you turn off the tablet or deliberately sign out of Skype does the app
    stop.


    You''re free to do other things on your tablet while Skype runs. If any text message
    arrives, a Skype notification appears, similar to what''s shown in the margin.
    Voice and video chats feature full-screen invitations.


    To sign out of Skype, tap the Side Menu icon, and in the navigation drawer, choose
    the Sign Out action. Tap the Sign Out button to confirm.


    # Chatting with another Skype user


    Text chat with Skype works similarly to texting on a cell phone. The difference
    is, similar to the Hangouts app''s text chat, you can only type at other Skype
    users. If one of them shows up as available in the Skype contacts list, follow
    these steps to initiate a Skype chat:


    +   1. At the main Skype screen, tap the People tab to choose a contact.


    The People tab icon is shown in the margin. The Skype user''s status appears below
    the name. A user who is “Available” is theoretically online and willing to chat
    with you.'
