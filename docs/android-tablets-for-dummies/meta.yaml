    # WHO IS THIS ANDROID PERSON?


    Just like a computer, your Android tablet has an operating system. It''s the main
    program in charge of all the software (apps) inside the tablet. Unlike a computer,
    however, Android is a mobile device operating system, designed primarily for use
    in tablets and cell phones.


    Android is based on the Linux operating system, which is also a computer operating
    system, though it''s much more stable and bug-free than Windows, so it''s not
    as popular. Google owns, maintains, and develops Android, which is why your online
    Google information is synced with your tablet.


    The Android mascot, shown here, often appears on Android apps or hardware. He
