    # Extending battery life


    A surefire way to make a battery last a good, long time is to never turn on the
    device in the first place. That''s kind of impractical, so rather than let you
    use your Android tablet as a high-tech sushi tray, I offer a smattering of suggestions
    you can follow to help prolong tablet battery life:


    +   - **Dim the screen:** Refer to Figure 22-2, and you can see that the display
    (labeled *Screen*) draws quite a lot of battery power. Although a dim screen can
    be more difficult to see, especially outdoors, it definitely saves on battery
    life.

    - **Lower the volume:** Consider lowering the volume for the various noises the
    Android tablet makes, especially notifications.

    - **Disable the vibration options:** The tablet''s vibration is caused by a teensy
    motor. Though you don''t see much battery savings by disabling the vibration options,
    it''s better than no savings.

    - **Turn off Bluetooth:** When you''re not using Bluetooth, turn it off. The fastest
    way to do that is to use the Bluetooth Quick Action.


    > **TIP** Some Android tablets come with battery-saving features. To check for
    them, open the Settings app and choose Battery or look for a specific Battery
    Savings or Power Saving Mode item. This feature automatically throttles certain
    battery-consuming items. It may kick in automatically when the battery gets low,
    or it might be something you must activate specifically.'
