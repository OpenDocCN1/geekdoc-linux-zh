    # Chapter 5

    All Your Friends


    To best use your tablet as a communications tool, you need to keep track of people.
    No, it''s not spying. It''s simply a way to keep your information handy, such
    as someone''s email address, physical address, website, social networking info,
    and phone numbers because — and this isn''t really a secret — it''s possible to
    make phone calls with your tablet. That communication all starts with keeping
    all your friends'' information in a single app.


    # The Tablet''s Address Book


    You most likely already have contacts in your Android tablet''s address book because
    your Google account was synchronized with the tablet when you worked through the
    initial setup process. If you added social networking apps, those contacts might
    also be stirred into the mix. So you already have a host of friends available.
    The place where you can access these folks is the tablet''s address book.


    > » The tablet''s address book app is named either Contacts or People. The stock
    Android name is Contacts, though the app has been called People in the past. For
    the sake of consistency, this chapter refers to the app as Contacts.'
  merge: -1
  pgno: 78
- img_proc: false
  md: '+   >> Many apps use contact information from the Contacts app, including Gmail
    and Hangouts, as well as any app that lets you share information such as photographs
    or videos.

    >> Information from your social networking apps is also coordinated with the Contacts
    app. See Chapter 9 for more information on using the tablet as your social networking
    hub.


    # Using the address book


    To peruse your Android tablet''s address book, open the Contacts app. You may
    be blessed to find that app''s icon on the Home screen, if not directly then in
    the Google folder. That app is also found in the Apps drawer.


    The Contacts app shows all contacts, presented alphabetically by first name. Figure
    5–1 illustrates the stock Android Contacts app. In Figure 5–2, you see the Contacts
    app on a Samsung tablet.


    ![](bbox=[0.13, 0.44, 0.87, 0.83])'
