  md: '# Moving launchers and widgets


    Launcher icons and widgets aren''t fastened to the Home screen with anything stronger
    than masking tape. That''s obvious because it''s quite easy to pick up and move
    a launcher or widget, relocating it to a new position or removing it completely.
    To start, long-press an item, as illustrated in Figure 18-3.


    ![](bbox=[0.247, 0.222, 0.725, 0.556])


    Drag the item to another position on the Home screen. If you drag to the far left
    or far right of the screen, the icon or widget is sent to another Home screen
    page.


    # Removing an item from the Home screen


    To banish a launcher or widget from the Home screen, move the launcher or widget
    to the Remove icon located atop the Home screen. The Remove icon may be an X,
    the word *Remove* (refer to Figure 18-3), or the Delete icon, similar to what''s
    shown in the margin.


    Removing an app or widget from the Home screen doesn''t uninstall the app or widget.
    See the later section "Uninstalling an app."'
