  md: '![](bbox=[0.24, 0.06, 0.895, 0.445])


    Free or Lite versions of paid games are available in Google Play. Even so, a paid
    game is generally 99 cents. Treat yourself to a new paid game a month, or buy
    one before you leave on a trip to help keep yourself entertained.


    # Google Docs


    In previous editions of this book, I would recommend a specific note-taking app
    for jotting down information, lists, or other text on your tablet. Using such
    an app is no longer necessary because your Android tablet comes with Google Docs.


    Google Docs is really an entire Office suite of apps, including word processing,
    a spreadsheet, and a presentation program. I know quite a few businesses that
    use Google Docs exclusively, specifically because it allows for better document
    sharing than Microsoft Office.


    On my tablet, I use Google Docs to write quick notes and keep lists. For example,
    my shopping list is on a Google Doc. To access it, I open the Docs app, then choose
    a document thumbnail. I can read or edit the document. Also, because the documents
    are linked to my Google account, I can edit or view the document on any computer,
    laptop, or another Internet gizmo.'
  merge: -1
  pgno: 318
- img_proc: false
  md: '# Kindle


    Yes, your Android tablet comes with the Google Play Books app. Sometimes that''s
    not enough. Consider getting the Kindle app as well. You don''t need to use it
    exclusively, it''s just good to have options available.


    Obtain the Kindle app from Google Play. Use your Amazon account to sign in. If
    you already have Kindle books, they''ll appear in the library. If not, go out
    and buy some books. The Kindle store often contains books not available from Google
    Play.


    # Movies by Flixster


    The Movies by Flixster app is your tablet''s gateway to Hollywood. It lists currently
    running films, premieres and openings, and it has links to your local theaters
    with show times and other information. The app is also tied into the popular Rotten
    Tomatoes website for reviews and feedback. If you enjoy going to the movies, you''ll
    find the Movies app a valuable addition to your tablet''s app library.


    # Sky Map


    Ever look up into the night sky and say, "What the heck is that?" Unless it''s
    a bird, an airplane, a satellite, or a UFO, the Sky Map can help you discover
    mysterious objects aloft. It may turn out that a particularly bright star in the
    sky is, in fact, the planet Jupiter.


    The Sky Map app works like a window you can look through to identify things in
    the night sky. Just start the app and hold up your tablet. Pan and tilt the device
    to identify planets, stars, and constellations.


    # Television Alternatives


    When you''re ready to cut the cable, your Android tablet is more than eager to
    step up to the plate and offer you a host of alternative TV and movie-watching
    resources. These apps offer media choices beyond what''s available at Google Play
    and viewable in the Play Movies & TV app. Here are my suggestions:'
  merge: -1
  pgno: 319
- img_proc: false
  md: '+   » *Netflix*. The app is free, but you must have a Netflix subscription
    to access the content. When you do, you''ll be able to view the entire Netflix
    library of movies, TV shows, and documentaries on your Android tablet.

    » *Hulu*. Similar to Netflix, Hulu offers current TV show episodes, movies, foreign
    films, and other unique content to its subscription holders.

    » *HBO Now*. If you cut the cable but miss *Game of Thrones*, you can obtain the
    HBO Now app and subscribe directly to the service. HBO Now offers every series
    ever broadcast on the network, as well as its current slate of movie offerings.

    » *CBSN*. When you miss live news, consider getting the CBSN app, which shows
    a live feed of CBS news. The app is free.


    Other apps are available, but often to view shows or events you must concurrently
    have a cable TV subscription. This burden isn''t required for the above-listed
    apps. For example, the ESPN and CBS apps let you watch sports and live TV, but
    only when you have an active cable subscription. This restriction may change in
    the future.


    # Translate


    Not only does Google''s Translate app assist with other apps in translating foreign
    tongues into English, you can use the app directly to help you pass 3rd period
    French. I''m serious: I took an Italian course at a community college and just
    about everyone used this app to help them get a C in that course. Why a C? Because
    although the translation is okay, it''s not perfect — and the professor knows
    when you''ve used it. Even so, it''s fun to play with and brush up on anything
    from Chinese to Russian.


    # Voice Recorder


    All Android tablets have a microphone and speakers, so where is the voice recorder
    app? Don''t bother looking. If you need to record your blurts, conversations,
    or that new song you composed on the ukulele, get the Voice Recorder app. It has
    an elegant and simple interface: Touch the big Record button to start recording.
    Make a note for yourself or record a friend doing his Daffy Duck impression.


    Previous recordings are stored in a list on the Voice Recorder''s main screen.
    Each recording is shown with its title, the date and time of the recording, and
    the recording duration.


    Several voice recording apps can be found at Google Play. I recommend the one
    by Mamoru Tokashiki.'
  merge: -1
  pgno: 320
- img_proc: false
  md: '# # Zedge


    The Zedge program is a helpful resource for finding wallpapers and ringtones —
    millions of them. It''s a sharing app, so you can access wallpapers and ringtones
    created by other Android users as well as share your own. If you''re looking for
    a specific sound or something special for Home screen wallpaper, Zedge is the
    best place to start your search.


    In Figure 25–2, you see a list of popular ringtones available from Zedge. Choose
    one to preview. If you like it, you can download the ringtone to your tablet and
    configure it as the main notification ringtone or set it as a ringtone for a specific
    app.


    ![](bbox=[0.25, 0.33, 0.65, 0.8])


    **FIGURE 25–2:** The Zedge app lists popular ringtones.


    > > **REMEMBER** When you install a media app like Zedge, you will see the default
    app card displayed when you choose a ringtone or select wallpaper. The choices
    you''re presented with include Tablet Media and Zedge, plus any other media apps.
    You can choose a default app, such as Zedge, or be prompted every time. For more
    information on this decision, see Chapter 18.


