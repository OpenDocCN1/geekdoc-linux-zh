  md: '# NEVER BUY ANYTHING TWICE


    Any apps or media you obtain from Google Play are available to all your Android
    devices as well as from your Google account on the Internet. These items include
    apps, books, music, videos, and anything else.


    For example, if you have an Android phone and you''ve already paid for a slew
    of apps, you can get those same apps for your Android tablet: Open the Play Store
    app and install the apps. You''ll also find your purchased music, books, and videos
    in the Play Music, Play Books, and Play Movies & TV apps.


    To review any already purchased apps, display the Play Store app''s navigation
    drawer. (Refer to the left side of Figure 15-1.) Choose Apps & Games, and then
    display the navigation drawer again and choose My Apps & Games. Tap the All tab
    on the My Apps & Games screen to see all the apps you''ve ever obtained from Google
    Play, including apps you''ve previously paid for. Those apps are flagged with
    the text *PURCHASED*. Choose that item from the list to reinstall the paid app.


    +   - Media you purchase is available instantly. Apps are downloaded after the
    purchase method is verified.

    - Information about any potential refund is provided in the Gmail message you
    receive after the purchase. Review the message for refund details.

    - Be quick on that refund: For a purchased app, you have only two hours to get
    your money back. You know when the time limit is up, because the Refund button
    on the app''s description screen changes to Uninstall.

    - The credit or debit cards listed in Google Play are those you''ve used before.
    Don''t worry: Your information is safe.

    - All music sales are final. Don''t blame me; I''m just writing down Google''s
    current policy for music purchases.


    # Renting or purchasing videos


    When it comes to movies and TV shows available at the Google Play Store, you have
    two options: rent or purchase.


    When you choose to rent a video, the rental is available to view for the next
    30 days. Once you start watching, however, you have only 24 hours to finish —
    you can also watch the video over and over again during that time span.'
