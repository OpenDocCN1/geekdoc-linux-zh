    # Chapter 24

    Ten Things to Remember


    Have you ever tried to tie a string around your finger to remember something?
    I''ve not attempted that technique just yet. The main reason is that I keep forgetting
    to buy string and I have no way to remind myself.


    For your Android tablet, some things are definitely worth remembering. From that
    long, long list, I''ve come up with ten good ones.


    # Dictate Text


    Dictation is such a handy feature — don''t forget to use it! You can dictate most
    text instead of typing it. Just tap the Microphone key on the keyboard — or anywhere
    you see the Microphone icon — and begin speaking. Your utterances are translated
    to text. In most cases, the translation is instantaneous.'
  merge: -1
  pgno: 310
- img_proc: false
  md: '+   » See Chapter 4 for more information on Android tablet dictation.

    » Google Now doesn''t require you to tap the Microphone icon. Instead, utter the
    phrase "OK Google," and it starts listening.


    # Change the Tablet''s Orientation


    Larger-format Android tablets have a natural horizontal orientation. Smaller tablets
    beg to be held vertically. You won''t break any law by changing the tablet''s
    orientation.


    Apps such as Chrome and Gmail can look much better in the horizontal orientation,
    whereas apps such as Play Books and Play Music can look much better in the vertical
    orientation. The key to changing orientation is to rotate the tablet to view the
    app the way you like best.


    +   » If you prefer a specific orientation, use the Quick Settings item that sets
    the tablet''s orientation. See Chapter 3.

    » Not every app changes its orientation. Some apps — specifically, games — present
    themselves in one orientation only: landscape or portrait.

    » eBook reader apps have screen rotation settings that let you lock the orientation
    to the way you want, regardless of what the tablet is doing.


    # Work the Quick Settings


    Many tablet controls are available at a single, handy location: the Quick Settings
    drawer. Pull it down to turn tablet features on or off, such as Wi-Fi, Bluetooth,
    screen orientation, and other On–Off settings. Using the Quick Settings drawer
    is far more expedient than visiting the Settings app.


    +   » Some tablets feature a vast array of Quick Settings, only a handful of which
    appear at a time. Try swiping the Quick Settings left or right to see more.

    » As a bonus, you may find the Settings app shortcut in the Quick Settings drawer.'
  merge: -1
