    # # Even More Friends


    Having friends is great. Having more friends is better. Keeping all those friends
    as entries in the Contacts app is best.


    # ## Building a contact from scratch


    Sometimes it’s necessary to create a contact when you actually meet another human
    being in the real world. Or, maybe you finally got around to transferring information
    to the tablet from your old date book. In either instance, you have information
    to input, and it starts like this:


    +   1. **Tap the Add Contact icon in the Contacts app.**

    Refer to Figures 5-1 and 5-2 for what the icon may look like, though different
    address book apps use subtly different icons.

    2. **Choose an account with which to associate the contact.**

    I recommend using your Google account, but if you favor another account, such
    as Yahoo!, choose it instead.


    > **TIP**

    I recommend choosing your Google account. That way, the contact is synchronized
    with the Internet and any other Android gizmos you may own.'
