    # Chapter 12


    # Image Management


    What’s the point of an Android tablet having a camera unless you can eventually
    review, peruse, browse, and chortle at those various images and videos? To solve
    that problem, your tablet features a digital photo album. You use it to view,
    manage, and manipulate the images stored in the tablet. Further, you can export
    your images, sharing them with friends farflung and wide, as well as enjoy images
    shared on Google and from other Android devices you might own.


    # The Digital Gallery


    The stock Android app for viewing pictures and videos is called Photos. It’s the
    natural companion to the Camera app, covered in Chapter 11. To start the app,
    tap its icon, which may be lurking on the Home screen or, like all the tablet’s
    apps, found on the Apps drawer.


    > » The Photos app not only lets you look at pictures and watch videos, but you
    can also manage that media, edit, and share your visual creations online.'
