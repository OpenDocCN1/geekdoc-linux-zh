- img_proc: false
  md: '# Reviewing your downloads


    To browse or view items you''ve downloaded, open the Downloads app. It''s found
    in the Apps drawer.


    The Downloads app lists downloaded items alphabetically or by date. To set which
    way the items appear, look for a sorting icon or tap the Action Overflow to find
    a Sort or similar action.


    To view a download, choose it from the list. The Android tablet uses the appropriate
    app to view the download. If an app isn''t available, an appropriately rude message
    tells you so.


    ![](bbox=[0.16, 0.32, 0.225, 0.375])


    You can choose the Download notification to quickly review any single downloaded
    item.


    # Web Browser Controls and Settings


    More options and settings and controls exist for web browser apps than for just
    about any other Android app I''ve used. Rather than bore you with every dang-doodle
    detail, I thought I''d present just a few of the options worthy of your attention.


    # Clearing your web history


    When you don''t want the entire Internet to know what you''re looking at on the
    web, open an incognito tab, as described in the earlier section “Going incognito.”
    When you forget to do that, follow these steps to clear one or more web pages
    from the browser history:


    +   1. Tap the Action Overflow icon and choose History.

    2. Tap the X icon next to the web page entry you want to remove.


    It''s gone.


    If you want to remove *all* of your web browsing history, after Step 1 tap the
    button at the bottom of the screen, CLEAR BROWSING DATA. You see the Clear Browsing
    Data screen. The pre-checked items are what you need, so tap the CLEAR DATA button
    to purge your tablet''s web browsing history.'
