    # Chapter 10

    There’s a Map for That


    ’m hoping that teleportation becomes a reality someday. It would be so convenient
    to travel instantly, to get where you’re going without sitting in a cramped cabin.
    In fact, the only mystery will be whether teleportation has the same knack for
    losing your luggage as air travel.


    One thing our fortunate descendants probably won’t complain about is being lost.
    That’s because their Android tablets will tell them exactly where they are, thanks
    to the Maps app. They’ll be able to find all sorts of things, from tacos in pill
    form to used flying cars to Hello Kitty light sabers. Because it’s the future,
    they might even be able to use the futuristic version of an Android tablet to
    find their lost luggage.


    # Map 101


    To find your location, as well as the location of things near and far, summon
    the Maps app on your Android tablet. Good news: You run no risk of improperly
    folding the Maps app. Better news: The Maps app charts the entire country, including
    freeways, highways, roads, streets, avenues, drives, bike paths, addresses, businesses,
    and various points of interest.'
