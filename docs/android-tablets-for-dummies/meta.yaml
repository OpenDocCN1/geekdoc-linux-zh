  md: "+   **IN THIS CHAPTER**\n\n* Adding or changing a screen lock\n* Setting a\
    \ secure screen lock\n* Locating a lost tablet\n* Erasing your tablet's data\n\
    * Creating accounts for others\n* Setting up a child's account\n\n# Chapter 20\n\
    Android Tablet Security\n\nIn the last century, you didn't need to log in to your\
    \ computer. Banking and shopping were done in person. And passwords were used\
    \ only to keep the girls out of the boys' fort. Things today are different. Security\
    \ is vital. Forts are gender-neutral. And passwords are necessary to secure your\
    \ personal information for all your online personas.\n\n# Lock Your Tablet\n\n\
    If you keep anything important on your Android tablet or you have multiple users\
    \ on the same tablet or you access a corporate email account, you need Lock screen\
    \ security. I'm referring to more security than the simple Swipe screen lock.\n\
    \n# Finding the screen locks\n\nThe keys to your Android tablet's screen locks\
    \ are found within the Settings app. Here's how to get there:\n\n+   1. **Open\
    \ the Settings app.**\n2. **Choose Security.**\n\n   This item may be titled Lock\
    \ Screen and Security. On some Samsung tablets, tap the Device tab to locate the\
    \ Lock Screen item."
  merge: -1
  pgno: 268
- img_proc: false
  md: '3. Choose Screen Lock or Screen Lock Type.


    If you don''t see the Screen Lock item, look for the item titled Set Up Screen
    Lock or Change Screen Lock.


    4. Work any existing screen lock to continue.


    Eventually, you see the Choose Screen Lock screen, which may be instead called
    Screen Lock Type.


    Several lock types are shown on the Choose Screen Lock screen. The stock Android
    screen locks are


    **None:** The tablet has no screen lock. Press the Power/Lock key to instantly
    start using the tablet.


    **Swipe:** Swipe your finger across the screen to unlock the tablet.


    **Pattern:** Trace a pattern on the touchscreen to unlock the tablet.


    **PIN:** Type a personal identification number (PIN) to unlock the tablet.


    **Password:** Type a password to unlock the tablet.


    Other locks may be available, including Fingerprint, Face Unlock, and Signature.


    ![](bbox=[0.16, 0.49, 0.22, 0.54])


    +   » The most secure locks are the PIN and password. Using one or the other is
    required if the tablet has multiple users or a kid''s account or it accesses a
    secure email server.


    +   » If your tablet is encrypted, you may be prompted to require the screen lock
    (Pattern, PIN, or Password) to start the device. My recommendation is to require
    the screen lock; choose the option Require Lock to Start Device, where *lock*
    is the type of screen lock being applied.


    ![](bbox=[0.16, 0.64, 0.22, 0.69])


    +   » I know of no recovery method available if you forget your tablet''s PIN
    or password screen locks. If you use them, write them down somewhere inconspicuous,
    just in case.


    +   » The Face Unlock uses the tablet''s front camera to unlock the device. You
    stare at the screen and, as long as you haven''t had any recent, major plastic
    surgery, the tablet unlocks.


    +   » The signature lock is unique to the Samsung Galaxy Note tablets. Use the
    S Pen to scribble your John Hancock on the touchscreen. The tablet unlocks.'
