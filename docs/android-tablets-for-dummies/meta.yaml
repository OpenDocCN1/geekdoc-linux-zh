    # Chapter **4**


    # Creating and Editing Text


    Your Android tablet lacks a keyboard — a real one, at least. To sate the tablet''s
    text-input desires, you use something called an onscreen keyboard. It works like
    a real keyboard, but with the added frustration that it lacks moveable keys. Don''t
    fret! You can add a real keyboard to your tablet, and you can even forgo typing
    and simply dictate your text.


    # Behold the Onscreen Keyboard


    The onscreen keyboard reveals itself on the bottom half of the tablet''s touchscreen
    whenever text input is required. The stock Android keyboard, known as the *Google
    Keyboard*, is shown in Figure 4-1.


    No matter how the keyboard looks, all onscreen keyboards are based on the traditional
    QWERTY layout: You see keys from A through Z, albeit not in that order. You also
    see the Shift key for changing the letter case, and the Delete key, which backspaces
    and erases. Your tablet may show more keys — such as Tab and Caps Lock — or it
    may show fewer keys. Samsung tablets use the Samsung keyboard, illustrated in
    Figure 4-2. It works similarly to the Google Keyboard, but offers its own special
    features, such as a Ctrl (control) key and cursor keys, as shown in the figure.'
