  md: 'accessed on a web page. It can be a picture, a file, or something else that
    I can''t think of right now.


    +   - The Downloading Complete notification appears after your tablet has downloaded
    something. You can choose that notification to view the downloaded item.

    - Most people use the term *download* when they really mean transfer or copy.
    Those people must be shunned.

    - You use the Play Store app to install new apps on your tablet. This topic is
    covered in Chapter 15. Installing a new app is a type of downloading, but it''s
    not the same as the downloading described in this section.

    - The opposite of downloading is *uploading*. That''s the process of sending information
    from your gizmo to another source, such as the Internet.


    # Grabbing an image from a web page


    The simplest thing to download is an image from a web page: Long-press the image.
    You see an action card appear, from which you choose Save Image.


    Use the Photos app to view images you download from the web. These images are
    saved in the Download folder. Follow these steps in the Photos app to view that
    folder:


    +   1. Tap the **Side Menu** icon.

    2. Choose **Device Folders**


    Locate the Download folder to peruse images downloaded to your tablet.


    Refer to Chapter 12 for information on using the Photos app.


    # Downloading a file


    The web is full of links that don''t open in a web browser window. For example,
    some links automatically download, such as links to Microsoft Word documents or
    other types of files that a web browser is too frightened to display.


    To save other types of links that aren''t automatically downloaded, long-press
    the link and choose the Save Link action. If this action doesn''t appear, your
    tablet is unable to save the link, because either the file is of an unrecognized
    type or there''s a security issue.'
  merge: -1
