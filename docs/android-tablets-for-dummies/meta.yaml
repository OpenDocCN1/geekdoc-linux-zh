    Nothing stirs up controversy like choosing only ten free apps out of the million-plus
    apps available at Google Play. Even so, when I started out with my first smartphone
    30 years ago, I wanted to see a list of worthy apps, or even apps recommended
    by friends. Lamentably, that was long before anyone else had a smartphone of any
    type, so I was forced to wait. Thanks to the suggestions here, you don’t have
    to wait to get started with apps on your Android tablet.


    # ## Airline Apps


    All the major airlines have apps, and those apps have improved greatly over the
    years. Today, you use an airline app not only to make a reservation and check
    on flight status, but the app — and your tablet — serve as the boarding pass.
    The only downside to a digital boarding pass is that the airport security people
    have nothing to scribble on after they check your ID.'
  merge: -1
  pgno: 316
- img_proc: false
  md: 'Perhps the most convenient thing about an airline app are the updates. I had
    a flight change its departure gate (from one terminal to another) and then get
    canceled. The app informed me of the gate change and then automatically told me
    on which alternative flight I’d been re-booked. I found that amazing.


    # Games


    It’s not a question of whether or not the tablet can play games. The question
    is which games to choose. The selection is overwhelming, almost to the point where
    you’re unwilling to give a game a chance because more exist. So rather than speed-date
    some games, here are my suggestions:


    +   - **Angry Birds.** Perhaps the most viral of the mobile gaming apps, it spawned
    an entire series of games and even a silly movie. Still, the original game is
    lots of fun.

    - **Crossy Road.** This game is similar to the old arcade game Frogger, but it’s
    just insane. Crossy Road is easy to learn and play, addictive, and it’s a great
    short-time waster.

    - **Plants Versus Zombies.** Shown in Figure 25-1, this game is a lot of fun and
    somewhat strategic.

    - **X-Plane.** This flight simulator is easy to learn, though you must download
    the maps before you can play. I keep forgetting that when I want to play X-Plane
    on a real airplane without an Internet connection.

    - **Sudoku Daily.** If you’re a puzzle addict, specifically the Sudoku puzzle,
    then you’ll enjoy this version of the popular game. It makes new puzzles available
    each day, with a wide range of skill sets, hints, cheats, and anything a Sudoku
    addict would enjoy.

    - **Jet Car Stunts.** This paid game is enjoyable from a road-racing standpoint
    as well as a flight simulator. It’s quite challenging and it saved me from hours
    of boredom during a flight overseas.

    - **Threes!.** A strategy game, Threes! is delightful. It’s quick to learn, but
    increases in frustration quickly. It’s best to play when you have a friend who
    also plays so that you can compare scores.


    This list is by no means complete; I have dozens more games installed on my tablet.
    I’m not into sports games, and some of the more complex games become too involved
    for me to get interested.'
