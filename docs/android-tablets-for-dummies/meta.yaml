    # Chapter 23

    # Ten Tips, Tricks, and Shortcuts


    A tip is a small suggestion, a word of advice often spoken from bruising experience
    or knowledge passed along from someone with bruising experience. A trick, which
    is something not many know about, usually causes amazement or surprise. A shortcut
    is a quick way to get home, even though it crosses the old graveyard and you never
    quite know whether Old Man Witherspoon is the groundskeeper or a zombie.


    I''d like to think that just about everything in this book is a tip, trick, or
    shortcut for using an Android tablet. Even so, I''ve distilled a list of items
    in this chapter that are definitely worthy of note.'
  merge: -1
