  md: '# # Slapping down widgets


    Beyond app launchers, the Home screen is also where you find widgets. A widget
    works like a tiny, interactive or informative window, often providing a gateway
    into another app on the tablet. Widgets may display the time, the weather, tweets,
    or new videos or serve as placeholders for the eBook you''re reading or represent
    a contact, a location on the map, and a host of other goodies.


    To add widgets to the Home screen, obey these steps:


    +   1. **Switch to a Home screen page that has enough room for the new widget.**
    Widgets come in a variety of sizes. The size is measured by launcher dimensions:
    A 1x1 widget occupies the same space as a launcher icon. A 2x2 widget is twice
    as tall and twice as wide as a launcher icon.


    2. **Long-press a blank part of the Home screen.** You see a Home screen overview,
    along with icons at the bottom of the screen.


    3. **Tap the Widgets icon.** A list of widgets appears.


    4. **Long-press the widget you want to add.** Swipe through the pages to find
    widgets, which are listed alphabetically and show preview images just like apps.
    Also shown are the widget''s dimensions.


    5. **Drag the widget to the Home screen.** As you drag the widget, existing launcher
    icons and widgets jiggle to make room.


    6. **Lift your finger.** If the widget grows a border, it can be resized. See
    the next section.


    After adding widgets, you may be prompted for additional information — for example,
    a location for a weather widget, a contact name for a contact widget, and so on.


    > » The variety of available widgets depends on the apps installed. Some apps
    come with widgets; some don''t. Some widgets are independent of any app.


    » Fret not if you change your mind about the widget''s location. See the later
    section "Moving launchers and widgets" for obtaining the proper feng shui.


    » To remove a widget, see the later section "Removing an item from the Home screen."'
  merge: -1
  pgno: 247
- img_proc: false
  md: '# # Resizing a widget


    Some widgets are resizable. You can change a widget''s size right after plopping
    it down on the Home screen — or at any time, really: The secret is to long-press
    the widget. If it grows a box, as shown in Figure 18–2, you can change the widget''s
    dimensions.


    ![](bbox=[0.162, 0.217, 0.734, 0.783])


    To resize, drag one of the orange dots in or out. Tap elsewhere on the touchscreen
    when you''re done resizing.'
