  md: "# # Set Your Pictures and Videos Free\n\nKeeping your precious moments and\
    \ memories in your tablet is an elegant solution to the problem of lugging around\
    \ photo albums. But when you want to show your pictures to the widest possible\
    \ audience, you need a much larger stage. That stage is the Internet, and you\
    \ have many ways to send and save your pictures.\n\n# ## Posting a video to YouTube\n\
    \nThe best way to share a video is to upload it to YouTube. As a Google account\
    \ holder, you also have a YouTube account. Why not populate that account with\
    \ your latest, bestest videos? Who knows what may go viral next!\n\nTo upload\
    \ a video you’ve recorded, follow these steps:\n\n+   1. **Ensure that the Wi-Fi\
    \ connection is activated.**\n   The best way to upload a video is to turn on\
    \ the Wi-Fi connection, which (unlike the mobile cellular network) doesn’t incur\
    \ data surcharges. In fact, if you opt to use the 4G LTE network for uploading\
    \ a YouTube video, you see a reminder about the data surcharges.\n2. **Open the\
    \ Photos app.**\n3. **View the video you want to upload.**\n   You do not need\
    \ to play the video; just have it on the screen.\n4. **Tap the Share icon.**\n\
    \   If you don’t see the Share icon, tap the screen.\n5. **Choose YouTube.**\n\
    \   The Add Details screen appears. You may first see a tutorial on trimming the\
    \ video, which is the next step.\n6. **Trim the video, if necessary, resetting\
    \ the starting and ending points.**\n   If you opt to trim, drag the starting\
    \ and ending points for the video left or right. As you drag, the video is scrubbed,\
    \ allowing you to preview the start and end points.\n7. **Type the video’s title.**\n\
    8. **Set other options.**\n   Type a description, set the privacy level, add descriptive\
    \ tags, and so on."
  merge: -1
