    Drag the start and end markers around the touchscreen to define the block of selected
    text. Use the Action Bar to choose what to do with the text, as shown in Figure
    4-8. Tap the Action Overflow to view additional commands.


    To cancel text selection, tap anywhere in the text.


    > See the next section for information on cutting and copying text. To delete
