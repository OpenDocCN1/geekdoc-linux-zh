    本节的目的是直观且精彩地介绍和执行 Linux 命令行 shell（command shell）及其核心用途。命令行 shell 是一个允许用户编写和执行命令的程序。


    它允许用户通过在终端中物理输入命令来执行任务，此外还可以在被称为 shell 脚本的项目中执行。它并不是一个工作框架；它是与操作系统交互并运行特定命令的最佳方法。


    ## BASH


    `BASH` 被称为 Bourne Again Shell（再次的 Bourne 壳）。`BASH` 是一种 shell，它是用于 UNIX 系统的标准 shell——即
    Bourne Shell（`/bin/sh`）——的替代品。


    它获取了原始 Bourne Shell 的大部分核心元素，并且使得编程和使用命令行变得容易得得多。由于它是免费软件，因此在许多 Linux 发行版中被认为是非常有效的
    shell。


    ## BASH 与 DOS 不同


    以下是 `BASH` 区别于 DOS 的几个特性。


    ### 大小写敏感


    在 Linux 中，文件名和命令是区分大小大小的，这意味着编写 `"EXIT"` 而不是 `"exit"` 是一个错误。系统会在这些细微错误上报错。


    ### "\" 与 "/"


    在 Dos 中，`"/"` 用作命令行分隔符，而目录分隔符是 `"\"`。在 Linux/UNIX 中，目录分隔符是正斜杠，而转义字符通过反斜杠完成。


    ### 文件名


    对于文件名传统，“八三三”规则意味着每个文件都遵循相同的格式，DOS 允许文件名最多包含 8 个字符，后面跟着一个点，然后是长度最多 3 个字符的扩展名，例如
    `ANYFILE.TXT`。


    在 Linux 和 UNIX 中，没有这种关于文件扩展名的传统。点可以设置在文件名的任何位置，扩展名可以由项目进行不同的解析。


    ### 特殊字符


    在转向 Linux shell 命令之前，用户首先应该意识到有一些符号和字符在 shell 中以异常方式运行。


    这意味着这些编写的字符在特定情况下没有能力使用，它们可能被用于执行特殊操作，或者如果用户需要以普通方式使用它们，则应该对它们进行“转义”。


    ## 执行命令


    ### 命令路径 (PATH)


    命令被设置在你 shell 的“路径”（Way）中，这意味着你可以直接输入程序的名称来执行它。例如，输入 `"ls"` 将运行 `"ls"` 命令。shell
    的“路径”因素包含最广泛的程序区域，例如：


    `/usr/bin,/bin,/usr/X109A/bin,` 等。要运行不在当前 `PATH` 中的命令，需要先输入完整路径。例如：`/home/john/myprogram`


    *   `./program`（这将允许你在当前索引中运行特定的程序）

    *   `~/bin/program`（这将允许你沿着用户目录运行特定的程序）


    ### 命令语法


    命令可以自然地执行，用户也可以传递额外的参数来完成某些特定功能。命令语法的结构是：`command [-argument] [-- - another argument]
    [filename]` 一些示例是：


    *   `ls` 将列出当前目录下的文件

    *   `ls -l` 将以长格式列出每一个文件

    *   `cat filename` 将显示文件的内容*

    *   `cat -n filename` 将显示文件内容及其行号


    ## 入门指南


    当用户卡住并需要一些 Linux 命令行 shell 的帮助时，他/她可以轻松地从中获得帮助。


    许多 Linux 命令的帮助通常直接在命令本身中，通过在线帮助或案例信息页和基础页面打开。


    ### 使用命令的内置帮助


    大多数命令都有基本的帮助选项，可以使用特殊的标志来调用。这些命令通常看起来像 `--help` 或 `-h`。


    例如：`grep --help`


    ### 主页-在线手册


    某些命令的最佳数据源可以有效地在在线页面中找到，简称为 `man` 页面。输入 `"man"` 配合特定目标可以浏览不同命令的 man 页面。例如，输入 `man
    ls` 将演示与 `"ls"` 命令关联的手册，输入 `man manual` 将出现 manual 调用命令。


    要在 man 页面中搜索特定单词，输入 `''/word''`；要离开手册页，只需按 `''Q''` 键即可。有时，用户可能会忘记他需要搜索的命令名称，因此，请参考以下示例：


    假设你要修改文件的权限但忘记了命令名称，考虑到这一切，输入与你正要执行的任务相关的单词，例如，输入 `man-k consent`。输出将显示文件权限命令如下：


    `chmod (1)` 将更改文件的访问权限


    现在用户知道他正在寻找的命令是 `"chmod"` 了。输入 `''man chmod''` 将显示 chmod 命令的手册页。


    ### 导航 Linux 文件系统的命令


    下表中出现的命令将让你知道你可以去哪里，并向你展示那里有什么。其中一些非常简单，例如 `cd`（切换目录）、`ls`（列出文件）等等。


    # 第 4 章 – 使用 Linux 的优点与围绕 Linux 的误言


    如今，Linux 处于巅峰地位，并在软件工程师以及全球普通用户中非常流行。在本节中，将讨论 Linux 的重要优点以及它所面临的误言。


    Linux 的优点


    *   **成本**：使用 Linux 的一个显著优点是它是免费的。Linux 发行版可以在任何系统中引入而无需付费。此外，不同的应用程序也是免费获取的。事实上，即使是普通用户也可以通过命令下载这些程序。

    *   **安全性**：尽管是免费，Linux 的安全特性非常稳固。它不需要额外的病毒防护产品。用户不需要花费巨资购买对抗性病毒。

    *   **开源**：Linux 工作框架是开源的，如果今天出现全球性的 Linux 病毒，明天就会有补丁发布，甚至是使用该工作框架的普通用户或维护人员。

    *   **选择 (自由)**：选择权是最好的优势之一。通过 Linux，用户有能力控制工作框架的每一个部分。

    *   **硬件**：Linux 工作框架非常适合几乎没有处理能力的旧电脑，但现在它们正被工程师们用于组装新设备的一部分，例如手机、汽车，甚至冰箱等许多其他设备。

