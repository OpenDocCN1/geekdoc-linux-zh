    #### 关于“难以安装”的神话

    某些用户在安装 Linux 工作框架时可能会遇到挑战。

    Linux 的“发行版”实际上包含了一个文档，解释了安装 Linux 发行版、构建编译器和查找文件等过程；在某种程度上，如果文档没有更新，可能会变得困难且具有风险。


    #### 关于“不支持”的神话

    在过去，事实情况是 Linux 没有商业支持，但现如今，普通用户可以从主要的编程供应商（例如 `RedHat` 或 `Novell`）那里获得带有支持的 Linux
    工作框架。

    用户也可以使用免费下载的 Linux 应用程序并获得提供特定发行版的组织许可协议。

    通常不需要任何 PC 客户端获得商业支持，例如，免费提供的支持渠道与某些其他标记的操作系统相比具有显著的优势。


    #### 关于“在 Linux 中无法运行许多产品”的神话

    对于某些 Microsoft Windows 软件这可能是真的，但对于 Linux 来说，这只是一个神话。任何产品都可以毫无费力地下载、安装并在 Linux
    中持续运行。微软的一些软件也可以安装在 Linux 上，用户可以像在 Microsoft windows 中使用一样使用它们。著名的软件 `Google Chrome`
    和 `Firefox` 毫无疑问可以摆脱这种困境。


    除了这些传说，另外一些更常见的误解是关于 Linux 的安全、可靠性和内存限制的。有些人认为它是非图形化的，另一些人认为它很难操作，然而一旦用户使用了这个工作框架，他自己就能考虑到这个框架的特性。


    # 第 5 章 – Linux vs mac vs windows


    在本节中，为了对 windows、Linux 和 Mac OS 进行比较，列出了这三个重要工作框架的优缺点：Linux、Mac 和 Windows 通常称为‘PC’。


    除了这些还有许多其他工作框架，但由于市场份额很小而很少为人知。以下是三个领域的划分：Linux、`Macintosh` 和 windows，目标是根据它们的优缺点对它们进行对比。


    ## Windows

    从最流行的工作框架 windows 开始，没有人会错过这个框架，因为它占据了整个操作系统市场几乎 90% 的份额。它存在于企业结构、机械办公室、你的手机中，以及家用
    PC 上。


    Windows 于 1985 年；从以后推出了许多版本的 windows，如 `XP`、`NT`、`windows 98`、`2000`、`windows
    vista`、`windows 7`、`8`、`8.1` 以及 2015 年推出的 `windows 10`。除了这种快速的迭代周期，它也有一些缺陷，windows
    的优缺点如下：


    ### 优点

    * **兼容性**：几乎每个应用程序或软件工具、驱动程序、游戏都会 Windows 上高效运行。

    * **技术支持**：除了拥有大量的用户之外，如果发生任何需要帮助的情况，你只需找到一个在线或离线的人，他们就可以毫不费力地帮助你处理 Windows。

    * **巨大的容量**：当你熟悉 Windows 后，你会发现有很多功能可以让你以非常简单的方式在 windows 中完成任何事情。


    ### 缺点

    * **病毒**：每个用户都需要购买防病毒程序来保护他们的框架免受几乎每天产生的病毒侵害。虽然存在免费的防病毒软件，但由于感染数量巨大，恰切需要非常专业的防病毒工具。

    * **慢**：某些 Windows（特别是是 `Vista` 和 `7`）需要大量的 PC 资源，例如内存、处理器、磁盘空间，因此它们通常运行得较慢。总而言之，框架的效率会下降。

    * **价格**：Windows 非常昂贵。它们的成本通常在几百美元的范围内。


    ## Macintosh 工作框架

    操作系统世界的另一个大巨头是 Macintosh。Apple 的 `Macintosh OS` 比 Windows 更老牌。


    它是第一个有效的图形界面操作系统，比微软的竞争对手早一年发布。`Macintosh OS X` 是一件精妙且精确的作品，它为专业人士提供了工具，而这些工具在很多时候
    PC 是无法提供的。用户体验和 UI 界面都经过了精简，使得每个图标、动画和关联都为了明确的原因而被更改。其优缺点如下：


    ### 优点

    * **病毒**：Apple Macs 几乎没有感染。没有必要购买防病毒软件并运行安装它们。

    * **可靠性**：Macintoshes 仅在 Apple PCs 上运行，因此较少发生软件和硬件崩溃。

    * **外观**：Mac 看起来通常比任何 Windows 都好。它拥有像 Windows 一样易于理解的界面，但视觉上比任何 Linux 好得多。


    ### 缺点

    * **昂贵**：Macintosh 非常贵，比 Windows 贵得多。对于某些工程师来说，获取它是不现实的。

    * **仅限 Apple PC 使用**：如果你现在有一台 PC，你无法在上面运行 Mac OS，否则后果是严重的，你需要购买另一台 PC。

    * **兼容性**：只有少数项目可以在 Mac 上运行，或者用户可能需要购买每一个程序来使其运行。


    ## Linux

    Linux 较小，但正在迅速发展。Linux 是对 Windows 和 Mac 的响应，这意味着 Linux 是“免费的”。所谓免费，是你无需花分钱就可以下载、修改和重新分发该
    OS。Linux 是操作系统领域一个较年轻的玩家，但遗憾的是，它有一些局限性。


    ### 优点

    * **成本**：Linux 是免费的。你只需在它的终端输入几个命令就可以安装、下载、使用和调整它。许多程序你都可以从这里免费获取。

    * **多样性**：Linux 只是一部分。为了使用这个部分，应该为 Linux 安装一些额外的软件。这些包通常被称为“发行版”或基本的“发行版 (distros)”。著名的版本包括
    `Ubuntu`、`Fedora` 和 `Mint`。

    * **病毒**：尽管由于开源比 Mac 更容易感染，但 Linux 仍然面临极小程度的感染。


