  trans: '


    * **内核 (Kernel)**: `Kernel` 是 Linux 操作系统的核心部分。它与硬件直接协作，并为上层部分提供底层服务。

    * **工具项目 (Utility projects)**: 工具项目是指为客户端提供工作框架绝大部分功能的项目。就像 Windows 和 Mac 提供许多可以轻松发现和引入的优秀编程程序一样，Linux
    也为其客户提供了大量的工具项目。


    最先进的 Linux 发行版包含了如应用商店之类的设备，用于协调和改进应用程序的开发。


    * **外壳 (Shell)**: `Shell` 是内核的接口。它为终端用户隐藏了内核能力的复杂性。shell 从终端用户接收命令并执行内核的功能。


    它是曾经让人们最恐畏离开 Linux 的原因，因为他们认为需要学习一种看似古老的命令行结构才能让 Linux 运行起来。


    * **图形服务器 (Graphical Server)**: 它是在屏幕上显示表示的子框架。它通常被称为 X server 或简称为 "X"。


    ## 常用应用：


    Linux 根据客户的需求有不同的形式。从业余爱好者到设计师，你有各种类型的 Linux 来满足你的需求。


    这些 Linux 操作系统的版本被称为“发行版”，也称为 "distros"。任何此工作系统的发行版都可以免费下载、刻录在光盘或 USB 驱动器上，并安装到你喜欢的任何不同的机器上。


    著名的 Linux 发行版有 Linux Mint、Ubuntu Linux、Arch Linux、Fedora、Deepin、Debian、openSUSE。每个发行版对桌面都有不同的影响。一些客户选择极其图形化的
    UI，他们选择了 Deepin 桌面和 Ubuntu 的 Unity，而另一些人不需要图形桌面，因此他们使用 openSUSE 的 KDE。


    # 第二章 – Linux：Linux 操作系统的内核


    `Linux Kernel` 是一个类似于 UNIX 的计算机操作系统部分。Linux 操作系统依赖于内核，并发布在已安装框架以及自定义计算机系统中，例如服务器和
    PC，通常作为 Linux 发行版。用于手机、平板电脑和智能表的 Android 操作系统也基于 `Linux Kernel`。


    `Linux Kernel` 由 Linux Torvalds 在 20 世纪 90 代创建。他为自己的没有跨平台期的 PC 编写内核，但已扩展到支持大量的计算机结构，比其他操作系统或内核支持更多。


    Linux 迅速吸引了从其他软件项目中迁移代码以用于新工作系统的的设计师和终端用户。`Linux Kernel` 收到了来自全球 12,000 名开发人员、1200
    多家组织的承诺，其中包括大多数最大的硬件和软件供应商。


    Linux 内核 API `(应用程序编程接口)` 是客户端程序与内核交互的通道，旨在非常稳定且不会破坏用户空间程序。在内核的功能中，许多设备驱动程序控制硬件；主流设备驱动程序也非常稳定。


    然而，可加载内核模块之间的接口与其他内核框架完全不同，其设计上并不打算非常稳定，但由于其许多特性（如速度、内存、执行效率、执行各种任务的能力等），吸引了许多客户。


    ## 影响力：


    运行 Linux 内核的 Android 操作系统声名的巨大上升，使内核成为手机设计师最最重要的决策，成为其他操作系统的基础。随着过去的增长，不同机构估计已销售
    30 亿部 Android 手机。


    一些客户使用了 `Linux Kernel`，这适用于许多不同的设备，例如智能电视、服务器和其他嵌入式系统。然而，该内核在传统桌面 Linux 发行版中的应用与许多其他操作系统相比仍然较少。


    ## 特殊特性


    ### 编程语言：


    `C` 语言由 `GCC` 支持，内核是用该语言编写的。标准语言 `C` 经过多次修订。除了 `C` 语言外，底层计算机结构也可用于编写 `Linux Kernel`，汇编语言也支持
    `GCC`。过去，`GCC` 是适用于编译 `Linux Kernel` 的主要编译器。


    ### 编译器比较：


    `GCC` 是 Linux 内核的内置编译器。`GCC` 是内核最快且最可靠的编译器。它可以在更短时间内作为许多复杂项目汇集过程的一部分。


    ### 接口：


    如果仅使用其他编程工具进行客户端程序开发，规范或一致将是内核设备无法被 Linux 内核识别。


    ### 抢占


    `Linux Kernel` 在某些条件下允许抢占式调度。在采用 `2.4` 版本之前，单用户改进是非常是非抢占的，也就是说，在客户端用户方法中关闭现有策略执行之外，如果被驱动的任务需要进入运行状态，该执行将被中断。


    向 `2.6` 系列版本的过渡，内核允许在内核代码执行期间插入任务，尽管内核代码单元无法被有效地调用。内核涵盖了不同的不同的调度器类。`Linux Kernel`
    自然地使用调度器系统，被称为完全公平调度器 (CFS)，它是以 Linux 内核 `(2.6.23)` 的形式开发的。


    ### 可移植性


    尽管如此，该内核从未被设计为可移植的。Linux 现在是完全可移植的操作系统，运行在从 ARM 开发到 IBM 的之前或之后不同范围的设备上。


    Linux 想象的 `386` 开发之外的最重要移植是 `68000` Motorola 平台，但为了实现这一点，他们替换了 Torvalds 的内核真实分区以使其分支并形成类似的工作系统。Torvalds
    运行了内核的首次重建，以便随后的移植工作。


    ## 现场修复 (Live fixing)


    通过利用被称为热补丁的技术可以将计算机更新调整到内核。一些热补丁技术包括 `kpatch`、`kGraft` 和 `Ksplice`。修复程序在特定的 `4.0`
    版本合并到了 Linux 内核，于 2015 年 4 月 12 日发布。


    这些程序被称为现场修复，依赖于内核的最优功能，形成一个可以辅助热修复的聚合中心；对于 `akGraft` 和 `kpatch`，通过为包含热补丁的 Linux
    内单元提供 API 以及用户空间管理设备的 `ABIs`。


