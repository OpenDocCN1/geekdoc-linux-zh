    # 引言


    人类发展史上的过去所有年份都被标记为对人类文明生活水平的追求。尽管进步发生在每个领域和每个方面，但没有什么能与科学技术领域压倒性的进步相拟。


    在信息技术领域，软件开发是最具有进步性的领域，每一分钟的上升都意味着软件开发领域的进步。在这个领域中，程序员和研究人员的贡献巨大，使得普通大众领域能够从这种快速发展中获益。这种严谨研究的结果之一就是名为
    `Linux` 的编程软件。


    `Linux` 是一种类 Unix 且通常符合 `POSIX` 标准的操作系统，通过开源和免费软件发行及开发的模式收集而成。`Linux` 的显著特征是著名的
    `Linux 内核`，它是一个著名的操作系统，首次于 1991 年 9 月 17 日发布。


    这由 `Linus Torvalds` 引入。最初，`Linux` 是作为一种免费操作系统引入的，以便在具有 `Intel x86` 架构的个人电脑上使用。由于智能手机上
    `Android` 的主地位，`Linux` 似乎是操作系统的主要的安装基础。


    # 第 1 章 – Linux 操作系统简介


    与 `windows 7`、`windows 8`、`windows 10` 和 `Mac OS X` 等不同的操作系统一样，`Linux` 同样是最灵活的工作框架。框架用于运行设备，就像你的
    `window 7 or 8` 运行便携式 PC 或桌面 PC 一样。简单来说，工作框架建立了硬件与程序之间的对应关系。


    没有产品，我们的硬件部分无法提供功能。框架允许不同的软件项目在上面运行，`Linux` 就是其中之一。`Linux` 真的无处不在；它在你的汽车里，在你的手机里，在你的冰箱里，也在微波炉里。请看我们在下面对
    `Linux` 工作框架的详细概述。


    `Linux` 是极其开放且私密的，这意味着 `Linux` 工作框架中的每个部分对每个用户都是可见的。如果不学习框架的结构，用户很难理解 `Linux 操作系统`
    中每个模块背后的原理。


    `Linux` 是开源的，这意味着它的源代码可以免费获取并允许使用。开源框架 `Linux` 是一种基于 `Unix` 的自由分发和跨平台框架，可以安装在便携式
    PC、笔记本电脑、手机等上。


    `Linux` 与 `UNIX` 非常相似。`UNIX` 是多任务用户框架的集合。`Linux` 的用途描述如下：


    ## Linux 的巨大功能


    `Linux` 工作框架涉及三个主要部分：


    1. 内核 (Kernel)：


    它是 `Linux` 的中心和重要部分，负责框架的所有工作。该部分真正被称为 `Linux 内核`。它处理 `CPU`、边缘设备和内存。部分基本上用于不同设备之间的通信以及等。它包含一些模块，并直接与硬件交互。该部分提供了必要的反射，以隐藏程序的硬件细节。它是框架的最低层次。


    该部分的几个元素有：

    - 设备管理

    - 处理框架

    - 内存管理

    - 进程管理


    ### 系统库 (System Library)


    这些是框架实用程序或程序访问 `内核` 组件的独特功能。这些库处理了框架的大部分功能，它们不需要操心位代码的收益。


    由于该部分本身尚未准备好执行很多工作，因此首先应该被邀请来执行任务。此类请求是由应用程序发出的，这些应用程序必须熟悉如何为该部分进行框架调用。


    ### 系统工具 (System Utility)


    系统工具项目能够执行特定的个人层级任务。


    与框架库一样，对于框架设备没有特定的描述。工具项目对终端用户是完全透明的。这就是为什么 `Linux` 提供相同的框架工具，或设备，但具有不同的用途。


    ## Linux 操作系统的设计


    `Linux 系统`的设计涉及以下层级：


    字体 硬件层 (Hardware layer)：这一层由每个边缘设备组成，例如 `RAM`、`HDD`、`CPU`、输入设备、输出设备等。


