  raw: 'Kubernetes runs a set of specialised controllers that implement most of the
    intelligence that makes Kubernetes so powerful. Each one runs as *reconciliation
    loop* that watches the cluster and ensures *observed state* is in sync with *desired
    state.*


    We’ll briefly mention some of the more important controllers and then walk through
    an example.


    **Deployment controller**. The Deployment controller implements the intelligence
    and features required to run stateless apps on Kubernetes. For example, it can
    ensure 5 replicas of a web service are always running. If one fails, the controller
    starts a new one. It also implements the intelligence for zero-downtime rolling
    updates and more.


    **StatefulSet controller**. The StatefulSet controller is similar to the deployment
    controller but it specialises in **stateful** workloads. For example, it deploys
    and self-heals a desired number of pods just like the deployment controller does.
    However, it also implements things like *ordered startups* and *ordered shutdowns*
    that might be important to stateful apps that write to shared data stores.


    **DaemonSet controller**. The DaemonSet controller ensures a single instance of
    a particular pod is always running on every node of the cluster. A common example
    is logging, where it’s common to need an agent running on every cluster node to
    collect and ship logs. The DaemonSet controller will ensure an instance of the
    agent pod runs on every node in the cluster. This includes automatically starting
    pods on any new nodes added to the cluster. It can also restart or replace pods
    that fail.


    There are a lot more controllers, but they all operate as *reconciliation loops*
    that watch the cluster and make sure *observed state* matches *desired state.*


    Consider the following example. You have a new app that needs 5 stateless web
    pods running v1.3 of your code. You describe this requirement in a declarative
    manifest file that you post to the API server. This gets recorded in the cluster
    store as your *desired state* and the scheduler assigns the 5 pods to worker nodes.
    The deployment controller operates on the control plane as a background reconciliation
    loop making sure observed state matches desired state – in this example it’s making
    sure the 5 web pods are always running. If observed state matches desired state
    it just keeps watching the cluster. However, if a node running one of the pods
    fails, the deployment controller will observe 4 web pods and realise it doesn’t
    match the desired state of 5\. It will fix this by instructing the scheduler to
    start a new pod on a surviving node. This will bring observed state back into
    sync with desired state and is an example of *resiliency* or *self-healing.*


    Sticking with the same example, assume you want to update all 5 web pods from
    v1.3 to v1.4. You do this by updating the same declarative manifest file to specify
    the new version and post it to the API server again. This registers a new desired
    state of 5 web pods running v1.4\. The deployment controller will observe 5 web
    pods running v1.3 and compare that to desired state which now wants 0 pods running
    v1.3 and 5 pods running v1.4\. It will respond by replacing the 5 pods running
    v1.3 with 5 running v1.4\. This is an example of a rollout.


    > **Jargon busting.** We often say that controllers operate as *“control loops”,
    “watch loops”* or *“reconciliation loops”*. They all mean the same thing. We also
    use the terms *“current state”, “actual state”* and *“observed state”* to mean
    the same thing. Finally, the process of bringing current state back into sync
    with desired state is called *reconciliation*.


    ### Worker nodes


    Worker nodes are where user applications run. They can by physical servers, virtual
    machines, or cloud instances, and a single Kubernetes cluster can run a mix of
    any.


    All workers run three important services:


    *   Kubelet


    *   Container runtime


    *   Kube-proxy


    The kubelet is the main Kubernetes *agent* on the node. It watches the API server
    for new work assignments, tells the container runtime which containers to start
    and stop, and reports status info back to the API server. It also does other things
    such as making container logs available to the `kubectl logs` command.


    Older Kubernetes clusters used Docker as their container runtime. However, that
    layer is now pluggable, meaning cluster administrators can choose the best container
    runtime for their requirements. At the time of writing, most new Kubernetes clusters
    use containerd (pronounced “container dee”) as their container runtime but many
    others exist. In fact, a single cluster can run different runtimes on different
    worker nodes as shown in Figure 4.4.


    ![](resources/images----figure4-4.png)


    Figure 4.4


    The technology making the container runtime layer pluggable in Kubernetes is the
    *Container Runtime Interface (CRI).* The following list is some of the more common
    container runtimes.


    *   Containerd (popular on new clusters)


    *   CRI-O (default on RedHat OpenShift clusters)


    *   gVisor (provides additional isolation between container and host OS)


    *   Kata containers (runs every container in a lightweight VM)


    *   Docker (the original, but deprecated since K8s 1.20)


    The final piece of the worker node is the kube-proxy. This implements networking
    so that traffic can successfully reach pods.


    ### kubectl


    **kubectl** is the Kubernetes command-line tool and is available for most platforms,
    including Linux, MacOS, and Windows.


    You install it on a machine, configure its config file, and use it to manage remote
    Kubernetes clusters. It can do all of the following:


    *   Get cluster information


    *   Deploy objects such as pods and services


    *   Query the state of objects


    *   Read logs


    *   Execute commands inside of containers


    It has a configuration file called `config` that’s normally located in your home
    folder in a hidden directory called `.kube`. You’ll often hear it referred to
    as your *kubeconfig* file, and it contains a list of known clusters and user credentials.
    For example, if you have two clusters, they’ll both be listed in your kubeconfig
    file. As will any usernames and credentials required to connect to the clusters
    and manage them.


    The following are common kubectl commands:


    *   `kubectl get <object>`


    *   `kubectl describe <object>`


    *   `kubectl apply <filename>`


    *   `kubectl delete <filename | object>`


    *   `kubectl api-resources`


    `kubectl get` commands return brief information about a particular resource type.
    For example, the following command returns info about a pod called web-fe.


    ```

    $ kubectl get pod web-fe

    NAME       READY   STATUS    RESTARTS   AGE

    web-fe     1/1     Running   0          29m

    ```


    The following `kubectl describe` command returns more detailed information about
    the same pod.


    ```

    $ kubectl describe pod web-fe

    Name:         web-fe

    Namespace:    default

    Priority:     0

    Node:         prod-cluster/192.168.65.4

    Start Time:   Wed, 9 Feb 2022 21:43:01 +0000

    Labels:       project=kcna-book

    Annotations:  <none>

    Status:       Running

    IP:           10.1.0.107

    <Snip>

    ```


    The preferred way to deploy objects to Kubernetes is to describe them in a YAML
    manifest file and deploy them with `kubectl apply` or `kubectl create`. The following
    command deploys the objects defined in a file called `web-deploy.yml`.


    ```

    $ kubectl apply -f web-deploy.yml

    deployment.apps/kcna-deploy created

    ```


    The `kubectl delete` command deletes objects. You can give it an object type and
    name, or you can give it a manifest file. If you give it an object type and name,
    it will delete that object. If you give it a YAML manifest file, it will delete
    everything defined in the file. See the following examples.


    ```

    $ kubectl delete pod web-fe

    pod "web-fe" deleted


    $ kubectl delete -f web-deploy.yml

    deployment.apps "kcna-deploy" deleted

    ```


    The following command displays a list of all resources you can deploy on your
    cluster.'
