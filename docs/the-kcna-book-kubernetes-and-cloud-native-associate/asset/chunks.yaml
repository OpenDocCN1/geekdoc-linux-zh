    ## 章节总结


    Kubernetes 是一个最初由 Google 开发的容器编排器，并于 2014 年开源并捐赠给了 CNCF。它是第一个从 CNCF 毕业的项目，现在是行业标准的编排器，也是
    GitHub 上第二大的项目。它还可以编排虚拟机和无服务器函数。


    一个 Kubernetes 集群由一个或多个控制平面节点和一个或多个工作节点组成。控制平面节点运行 `API server`、集群存储、调度器、控制器以及
    API 本身。工作节点是用户应用程序运行的地方，并拥有 `kubelet`、容器运行时和 `kube-proxy`。


    `API server` 通过 RESTful HTTPS 接口暴露 API，并需要高性能的控制平面节点。所有的内部和外部 Kubernetes 流量都会通过
    `API server`。集群存储是控制平面中唯一有状态的部分，用于持久化集群和应用程序的状态。调度器将 Pod 分配给工作节点，控制器确保集群的观测状态始终与期望状态匹配。


    每个工作节点都运行一个 `kubelet`，它监控 `API server` 以获取新任务，并告诉容器运行时启动或停止容器。`kube-proxy` 实现网络规则，以确保指向
    Kubernetes 服务的流量到达正确的 Pod 和容器。


    命名空间（Namespaces）是将单个集群划分为多个虚拟集群的好方法，供不同团队和部门之间进行共享。每个命名空间都可以有自己的资源配额和用户账户，但你不应该将它们用作工作负载的边界。


    最后，Kubernetes 使用第三方插件来实现开放的扁平 Pod 网络，你应该通过网络策略（network policies）对其进行锁定。


    ## 考试要点


    ### Kubernetes

    `Kubernetes` 是容器化应用的行业标准编排器。它最初由 Google 开发，现在是 GitHub 上正在活跃开发的开源项目。它以控制平面节点和工作节点集群的形式部署，提供调度、自愈、自动伸缩等功能。第三方项目扩展了它的功能，包括虚拟机、无服务器函数等许多编排。


    ### Pods

    `Pods` 是 Kubernetes 上调度的原子单元。开发者编写应用程序，将其封装为容器，然后将这些容器封装在 Pod 中并在 Kubernetes 上运行。一个
    Pod 可以封装一个或多个容器，并且 Pod 中的所有容器都保证被调度在同一个节点上。Pod 还充当容器的共享执行环境。这意味着同一个 Pod 中的两个容器可以访问相同的卷和网络。如果你想扩展应用程序，只需添加更多
    Pod。


    ### 边 car 容器（Sidecar containers）

    多容器 Pod 模型通常包含一个主应用程序容器和一个辅助容器。辅助容器被称为 `sidecar`（边车），它开启了强大的模式和创新。例如，服务网格技术通过向与应用程序容器相同的
    Pod 中注入 sidecar 容器来工作。sidecar 可以拦截所有网络流量，并透明地进行加密和解密。它还可以暴露丰富的网络遥测数据，用于更好地理解和优化流量流。许多其他解决方案也使用了
    sidecar。


    ### 控制平面节点

    `Control plane nodes` 是所有控制平面服务运行的地方。事实上，为了高可用，每个控制平面服务都运行在每个控制平面节点上。它们可以是物理服务器、虚拟机，甚至是云实例，你应该运行
    3 个或 5 个以实现高可用。你应该将它们分散在不同的故障域。如果你运行的是托管 Kubernetes 集群，控制平面节点将由你的云平台管理。


    ### 控制平面

    `The control plane` 是组成 Kubernetes 智能的服务集合。这些服务包括 `API server`、`scheduler`、集群存储、`API`
    和控制器。每个服务都高度专业，只做一件事。所有控制平面服务都运行在所有控制平面节点上。


    ### API server

    `API server` 通过 HTTPS 上的 RESTful 端点暴露 Kubernetes API。它是作为控制平面一部分运行的服务，是 Kubernetes
    通信的核心枢纽。例如，所有发送给 Kubernetes 的命令和请求都会发送到 `API server`。即使是内部控制平面服务也只能通过 `API server`
    互相发送消息。


    ### 调度器

    `scheduler` 是一个将 Pod 分配到工作节点的控制平面服务。它实现了高级逻辑，能够对哪些节点是 Pod 的最佳选择做出智能决策。


    ### 集群存储

    `cluster store` 是控制平面中唯一有状态的部分，用于保存集群和应用的状态。它通常基于 `etcd` 分布式数据库，并在每个集群节点上运行一个副本。


    ### 控制器

    `Controllers` 作为控制平面的一部分运行，作为后台调谐循环，确保集群的观测状态与期望状态匹配。这在术语上是为了确保运行在集群上的内容是你所请求的内容。Kubernetes
    实现了多个控制器，每个控制器都高度专业。常见的控制器包括部署控制器、StatefulSet 控制器、DaemonSet 控制器和作业控制器。


    ### 部署控制器

    `deployment controller` 可能是最常用的 Kubernetes 控制器。它部署并管理无状态工作负载，并提供云原生功能，如弹性能力、自动伸缩和零停机滚动更新。


    ### StatefulSet 控制器

    `StatefulSet controller` 管理有状态工作负载，并提供云原生功能，如弹性能力、自动伸缩和更新。它还实现了顺序启动、顺序关闭和持久命名等功能。这些对于有状态的应用程序可能有用。


    ### DaemonSet 控制器

    `DaemonSet controller` 可以保证特定 Pod 的实例始终运行在每个集群节点上。如果集群添加了新节点，DaemonSet 控制器会注意到这一点并自动在新节点上启动该
    Pod 的实例。一个典型的用例是确保每个集群节点上都运行着日志代理。


    ### 工作节点

    `Worker nodes` 是运行用户应用程序的集群节点。它们不运行任何控制平面服务，但会运行 `kubelet`、容器运行时和 `kube-proxy`。你应该将工作节点分散在不同的故障域，以帮助调度器保持应用程序的高可用。


    ### Kubelet

    `kubelet` 是运行在每个工作节点上的主 Kubernetes 代理。它监控 `API server` 以获取待运行的新 Pod 并报告状态。它还让
    `kubectl logs` 命令可以使用容器日志。


    ### 容器运行时

    `Container runtime` 软件接收本地 `kubelet` 的指令，在本地节点上启动和停止容器。旧的 Kubernetes 集群总是使用 Docker
    作为容器运行时，新的集群实现了容器运行时接口（CRI），允许管理员根据需求选择最佳容器运行时。


    ### Kube-proxy

    `Kube-proxy` 是每个集群节点上的一个服务，实现了网络规则，使得发送到服务的流量能够到达 Pod。


    ### kubectl

    `kubectl` 是 Kubernetes 的命令行工具。它可以在许多操作系统和平台上运行。


    ### Kubeconfig

    `kubeconfig 文件` 告诉 `kubectl` 可以与哪些集群通信以及使用哪些用户账户进行身份验证。它通常命名为 `config`，位于家目录下的隐藏
    `.kube` 文件夹中。


