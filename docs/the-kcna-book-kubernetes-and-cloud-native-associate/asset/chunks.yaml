    ## 14. 哪个命令可以显示名为“kcna-pod”的已终止 Kubernetes pod 的日志？

    1. `kubectl logs kcna-pod -p`

    2. `kubectl logs kcna-pod -c`

    4. `kubectl get logs kcna-pod`


    ## 15. 哪个遥测类最适合查看历史趋势？

    1. 日志 (Logs)

    2. 时序 (Timeseries)

    3. 追踪 (Traces)

    4.指标 (Metrics)


    ## 16. 下列哪些指标通常最适合判断应用程序的健康和性能？

    1. CPU 利用率

    2. 内存利用率

    3. 自定义指标

    4. 网络延迟


    ## 17. 哪个遥测类最适合跟踪请求在遍历分布式微服务应用组件时的传输情况？

    1. 追踪 (Tracing)

    2. 日志 (Logging)

    3. 指标 (Metrics)


    ## 18. 下列哪个被许多人认为是 Kubernetes 的行业标准监控工具？

