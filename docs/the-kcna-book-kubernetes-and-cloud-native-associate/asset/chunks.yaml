  trans: "\n我们已经解释了节点池的上限和下限。它们可以防止受损或失控的服务产生非必要的开销。例如，配置了上限为 10 的节点池创建的节点永远不会超过 10\
    \ 个。这有助于限制潜在成本。\n\n监控正确的指标同样重要。例如，对于消息队列系统，队列大小和请求响应时间可能比 CPU 利用率是更好的指标。\n\n与规模调优和成本管理相关的还包括识别未使用的资源并将其关闭或删除。自动伸缩可以在这方面提供帮助。然而，如果你没有为所有资源配置自动伸缩，就应该定期检查你是否在为不再使用的基础设施和服务付费。\n\
    \n总而言之，自动伸缩是云原生成本管理的一项主要工具。如果配置得当，它可以确保你只使用并支付满足所需的正确基础设施。选择正确的实例类型也是控制云成本的重要组成部分。竞价实例（Spot\
    \ instances）提供最大的折扣，但可以在没有预警的情况下终止。预留实例（Reserved instances）通过对资源的长期承诺（通常为 1-3\
    \ 年）来换取折扣。按需实例（On demand instances）比竞价实例和预留实例更贵，但它们不会被云平台删除，而且你不受长期使用合同的限制。\n\n\
    ## 章节总结\n\n在本章中，你学习了遥测的三主要类型：日志（Logs）、指标（Metrics）和追踪（Traces）。日志是应用程序事件，是确定应用程序或微服务无法运行的佳工具。指标提供了历史趋势，并帮助识别随时间的变化。追踪允许你在请求穿过当今复杂的微服务应用时对其追踪。你还学习了\
    \ `OpenTelemetry` 项目提供了规范和插桩工具，以标准化并简化我们生成和存储遥测数据的方式。\n\n你学习了 `Prometheus` 是用于\
    \ Kubernetes 最流行的监控平台，通常与 `Grafana` 配合用于仪表板和可视化。它期望服务在 `/metrics` 端点暴露遥测数据，并采用拉取模型，定期定期“抓取”数据。它有一个推送网关（push\
    \ gateway）用于从短寿命进程获取遥测数据，还有一个告警管理器（alert manager）用于发送告警。\n\n你完成了本章，学习了预留实例、竞价实例和自动伸缩等内容对成本和成本管理的影响。\n\
    \n## 考试要点\n\n### 遥测 (Telemetry)\n\n`Telemetry` 是系统生成的与监控相关的输出的术语。它们包括日志、指标和追踪。高质量的遥测对于故障排除、调优和理解云原生应用的行为至关重要。\n\
    \n### OpenTelemetry\n\n`OpenTelemetry` 项目是一个 CNCF 孵化项目，它定义了规范和插桩工具，旨在让高质量的遥测成为所有云原生应用的一部分。\n\
    \n### 日志 (Logs)\n\n`Logs` 是与应用程序事件相关的遥测形式，是出现问题时查找故障的最佳位置之一。例如，应用程序重启、登录失败、连接断开等都将作为事件记录。日志数据通常是结构化的并格式化为\
    \ `JSON`，以便于读取和搜索。它还通常根据严重性程度进行分类，常见的严重性级别包括 `info`、`warning`、`error` 和 `critical`。\n\
    \n### 指标 (Metrics)\n\n`Metrics` 通常是长时间捕获的性能相关数据，用于识别性能趋势。自动伸缩器可以使用指标预测潜在问题并执行主动的伸缩操作。\n\
    \n### 追踪 (Traces)\n\n`Tracing` 是追踪请求在穿过复杂分布式系统（如微服务应用）时的端到端旅程的艺术。它们是优化和排查分布式应用程序故障极其重要的元素。`Jaeger`\
    \ 是分析追踪的流行工具。\n\n### 可观测性 (Observability)\n\n高度可观测的应用程序输出高质量的遥测，并存储在中央位置进行分析。观察遥测通常是了解分布式应用如何工作以及对其进行故障的最佳方法。\n\
    \n### Prometheus\n\n`Prometheus` 是一个云原生监控平台。它是一个毕业级 CNCF 项目，也是 Kubernetes 环境中最流行的监控平台。它采用基于拉取的模型，从远程系统抓取指标和日志数据并将其存储在时间序数据库中。它还提供基础仪表板，但通常与更强大的可视化平台（如\
    \ `Grafana`）配对。\n\n### 按需实例 (On-demand instances)\n\n`On-demand instances` 是最常见的云实例。它们最灵活但成本最高。你可以随时创建和销毁它们，云平台保证它们的可用性。\n\
    \n### 预留实例 (Reserved instances)\n\n许多云平台提供折扣价格的预留实例，以换长期承诺。\n\n### 竞价实例 (Spot\
    \ instances)\n\n许多云平台利用其空闲容量提供竞价实例。它们是最便宜的类型，但没有可用性保证。例如，如果其他地方需要，云平台将从你那里收回竞价实例。\n\
    \n## 复习题\n\n答案见附录 A。\n\n**1.** 下列哪项最能描述遥测？\n\n* 1. 对系统的远程 shell 访问\n* 2. 微服务应用的映射图\n\
    * 3. 按需付费云基础设施\n* 4. 与健康和性能相关的系统输出\n\n**2.** 下列哪项是遥测数据的三个主要类型？选择三个。\n\n* 1. 日志\n\
    * 2. 追踪\n* 3. 指标\n* 4. 审计\n\n**3.** Prometheus 要求指标采用什么格式？\n\n* 1. 十六进制\n* 2.\
    \ YAML\n* 3. SOAP\n* 4. 时间序\n\n**4.** 下列哪项描述了遥测和可观测性的主要目标？\n\n* 1. 故障排除和系统审计\n\
    * 2. 故障排除和改进系统\n* 3. 审计和改进系统\n* 4. 故障排除和证明系统快照\n\n**5.** 下列哪项是定义云可观测性规范和插桩的 CNCF\
    \ 项目？\n\n* 1. CloudWatch\n* 2. OpenTelemetry 项目\n* 3. Kubernetes\n* 4. OpenMonitoring\n\
    \n**6.** 下列哪类遥测以文本或 JSON 格式输出应用程序事件？\n\n* 1. 指标\n* 2. 日志\n* 3. 追踪\n* 4. 审计\n\n\
    **7.** 下列哪项按严重性从低到高显示日志数据？\n\n* 1. info, warning, critical, error\n* 2. warning,\
    \ critical, error, info\n* 3. info, warning, error, critical\n* 4. info, critical,\
    \ warning, error\n\n**8.** 下列哪项产生的输出更多？\n\n* 1. 高详细性\n* 2. 低详细性\n\n**9.** 你正在对应用程序进行故障排除，需要尽可能多的日志信息。你应该选择哪个级别？\n\
    \n* 1. critical\n* 2. info\n* 3. debug\n* 4. warning\n\n**10.** Kubernetes 支持哪两种类型的集群日志？\n\
    \n* 1. 节点级代理\n* 2. sidecar \n* 3. 聚合式\n* 4. 持久化日志\n\n**11.** 下列哪些日志可以使用 `kubectl\
    \ logs` 命令读取？选择两个。\n\n* 1. 写入容器 stdin 流的日志\n* 2. 写入容器 stderr 流的日志\n* 3. 写入容器 stdout\
    \ 流的日志\n* 4. 写入自定义文件系统位置的日志\n\n**12.** 你的应用程序生成的日志格式不符合中央日志系统要求的格式。下列哪项可能有所帮助？选择所有正确答案。\n\
    \n* 1. 节点级日志代理\n* 2. 带有日志代理的 sidecar 容器\n* 3. DaemonSet\n\n**13.** 为什么应用程序级日志在云原生应用中有时被认为是一种反模式？\n\
    \n"
- fmt: "\n# Questions\n\n1. Applications shouldn’t contain environment-specific data\n\
    2. Applications shouldn’t generate log data\n3. Application logging is too verbose\n\
    4. Application logging generates too much east-west network traffic\n\n## 14.\
    \ Which of the following commands will show the logs of a terminated Kubernetes\
    \ pod called “kcna-pod”?\n1. `kubectl logs kcna-pod -p`\n2. `kubectl logs kcna-pod\
    \ -c`\n4. `kubectl get logs kcna-pod`\n\n## 15. Which of the following telemetry\
    \ classes is the best for seeing historical trends?\n1. Logs\n2. Timeseries\n\
    3. Traces\n4. Metrics\n\n## 16. Which of the following metrics are usually the\
    \ best at determining application health and performance?\n1. CPU utilisation\n\
    2. Memory utilisation\n3. Custom metrics\n4. Network latency\n\n## 17. Which of\
    \ the following telemetry classes is the best for tracking requests as they traverse\
    \ the components of a distributed microservices app?\n1. Tracing\n2. Logging\n\
    3. Metrics\n\n## 18. Which of the following is considered by many as the industry\
    \ standard monitoring tool for Kubernetes?\n1. Jaeger\n2. Grafana\n3. Prometheus\n\
    4. GraphQL\n\n## 19. Which of the following tools is commonly paired with Prometheus\
    \ to provide visual dashboards?\n1. Kubernetes\n2. Jenkins\n3. GraphQL\n4. Grafana\n\
    \n## 20. Which of the following endpoints does Prometheus expect metrics to be\
    \ exposed on?\n1. `/healthz`\n2. `/metrics`\n3. `/metricz`\n4. `/health`\n\n##\
    \ 21. What is happening when Prometheus is “scraping”?\n1. It’s discarding metrics\
    \ older than a certain date\n2. It’s pushing an alert to a remote device\n3. It’s\
    \ gathering metrics data from remote systems\n4. It’s updating visual dashboards\n\
    \n## 22. Does Prometheus use a push or pull model for gathering remote metrics?\n\
    1. Push\n2. Pull\n\n## 23. What format does Prometheus store metrics data in?\n\
    1. Timeseries\n2. Timeslice\n3. XML\n4. SOAP\n\n## 24. You run lots of short-lived\
    \ applications and need a way to gather their telemetry into Prometheus. What\
    \ should you do?\n1. Keep your apps alive until Prometheus scrapes their telemetry\n\
    2. Nothing, Prometheus handles this automatically\n3. Have your apps push metrics\
    \ to a Prometheus pushgateway\n4. Prometheus doesn’t have a solution for this\n\
    \n## 25. You have several in-house apps that you need to integrate with your Prometheus\
    \ monitoring environment. Which of the following is a good solution?\n1. Prometheus\
    \ pushgaetway\n2. Prometheus client libraries\n3. A Prometheus exporter\n4. Prometheus\
    \ alert manager\n\n## 26. You have several 3rd-party applications that you need\
    \ to integrate with your Prometheus monitoring environment. Which of the following\
    \ solutions will help?\n1. Prometheus pushgaetway\n2. Prometheus client libraries\n\
    3. A Prometheus exporter\n4. Prometheus alert manager\n\n## 27. Which of the following\
    \ are three pillars of cloud native cost management? Choose three.\n1. Choosing\
    \ the right infrastructure\n2. Rightsizing\n3. Annual billing\n4. Turning unused\
    \ things off\n\n## 28. You’re deploying a new CI/CD pipeline that’s not business\
    \ critical. Part of it is build servers and you need to keep costs as low as possible.\
    \ Which of the following instance types is most cost effective?\n1. On-demand\
    \ instances\n2. Spot instances\n3. Reserved instances\n4. Serverless instances\n\
    \n## 29. Which of the following generic cloud instance types gets you discount\
    \ in exchange for a long-term commitment?\n1. On-demand instances\n2. Spot instances\n\
    3. Reserved instances\n4. Serverless instances\n\n## 30. Which of the following\
    \ technologies can help with application and infrastructure rightsizing?\n1. CI/CD\n\
    2. Autoscaling\n3. Self-healing\n4. Reserved instances\n\n## 31. Which of the\
    \ following are important when configuring autoscaling for infrastructure? Choose\
    \ two.\n1. Request response times\n2. Setting upper and lower limits\n3. Watching\
    \ the right metrics\n4. Using reserved cloud instances\n\n# The exam\n\nThis chapter\
    \ prepares you to take and pass the exam. It’s divided as follows:\n* Exam domains\
    \ and competencies\n* About the exam\n* Booking the exam\n* Taking the exam\n\
    * Getting your result\n* Staying connected\n\n## Exam domains and competencies\n\
    \nThe overall aim of the KCNA is to test and prove your understanding of the following\
    \ broad topics:\n* Cloud native and microservices architectures\n* Kubernetes\
    \ architecture\n* The wider Kubernetes and cloud native landscape (CI/CD, GitOps,\
    \ etc.)\n\nThe exam tests the following topics which map directly to the domains:\n\
    \n### Kubernetes fundamentals (46%)\n* Kubernetes resources\n* Kubernetes architecture\n\
    * Kubernetes API\n* Containers\n* Scheduling\n\n### Container orchestration (22%)\n\
    * Container orchestration fundamentals\n* Runtime\n* Security\n* Networking\n\
    * Storage\n\n### Cloud native architecture (16%)\n* Autoscaling\n* Serverless\n\
    * Community & governance\n* Roles and personas\n* Open standards\n\n### Cloud\
    \ native observability (8%)\n* Telemetry and observability\n* Prometheus\n\n###\
    \ Cost management (8%)\n* Application delivery fundamentals \n\n## About the exam\n\
    \nHere are the important details about the exam:\n* **Delivery method**: Remote\
    \ via secured browser\n* **Style**: Multiple-choice\n* **Duration**: 90 minutes\n\
    * **Passing score**: 75%\n* **Valid for**: 3 years\n* **Cost**: $250 with one\
    \ free resit\n\nThe exam is an online, proctored, multiple-choice exam. This means\
    \ you take it remotely over the internet and have a person remotely monitoring\
    \ your desktop, video, and audio. You’ll be required to download a secure browser\
    \ and there’s no option to take the exam at authorised testing centers.\n\nAll\
    \ questions are multiple choice and almost all of them have 4 possible answers.\
    \ There are no questions where you have to type your answers and there are no\
    \ hands-on simulator style questions.\n\nOnce you start your exam you have 90\
    \ minutes to complete all questions. The platform allows you to mark questions\
    \ for review that you can revisit. You have to review and submit your answers\
    \ to all questions before the 90 minutes expires.\n\nYou need to score a mark\
    \ of 75% or more to pass the exam and you’ll receive your score within 24 hours\
    \ of completing the exam. This is frustrating for an online exam where it would\
    \ be simple to give you an instant result. It usually takes nearly 24 hours to\
    \ receive your result, so don’t sit there all day clicking refresh in your inbox\
    \ or in the exam portal.\n\n## Booking the exam\n\nYou can book your exam at the\
