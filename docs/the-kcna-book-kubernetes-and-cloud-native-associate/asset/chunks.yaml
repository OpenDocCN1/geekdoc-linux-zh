  trans: '

    请考虑以下示例。你正在使用 GitOps 来管理一个线上 Kubernetes 环境。然而，一位尚未完全掌握 GitOps 流程的团队成员对线上环境进行了手动更改。这是一种
    `anti-pattern`（反模式），并导致线上环境的状态偏离了 Git 仓库中定义的定义。在同一天的晚些时候，你遵循 GitOps 流程，在特性分支中测试了一个更改并创建一个
    PR 来合并它。当 PR 获得批准后，你的更改被合并，CD 流水线将自动部署到线上环境。该过程将把整个配置应用到线上环境，并覆盖你同事所做的手动更改。


    让我们更仔细地观察一下。


    假设你的 GitHub 仓库中的配置文件指定了 Kubernetes 对象，如 pod、service 和网络策略。你一直严格遵循 GitOps 流程，线上环境与
    GitHub 仓库中存储的配置完全匹配。然而，某个应用程序开始出现问题，于是一位同事登录到线上系统，并手动更新了一个线上网络策略以解决了该问题。虽然这在当时看起来可能是个好主意，但线上环境不再与
    GitHub 仓库中的配置匹配，在以后可能会变成问题。


    在同一天的晚些时候，你遵循 GitOps 流程部署了一组新的应用程序 pod，并创建一个 PR 来合并该更改。PR 获得批准并合并到 `master` 分支，你的
    GitOps 工具观察到了变化并触发了 CD 工作流。即使你只添加了新的应用程序 pod，仓库中的整个配置也将将重新应用到环境中。这意味着网络策略也将被重新应用，并覆盖你同事的手动修复。这就是为什么每个人都认同
    GitOps 流程，并且停止允许对线上环境进行手动更改是关重要的原因。


    > **术语破解。** `anti-pattern`（反模式）是指在当时看起来像是个好主意，但实际上是一个坏主意。


    ### 重要的 GitOps 工具和项目


    如前所述，GitOps 启发了新一代持续交付工具，这些工具与 Git 工作流集成。我们将简要描述以下内容，你可能会在考试中遇到这些内容。


    *   `Flux`

    *   `Argo`

    *   `Jenkins X`


    `Flux`（有时称为 `FluxCD` 或 `Flux CD`）是一个易于使用的 Kubernetes 原生应用程序，用于将 Kubernetes 状态与
    Git 仓库中的配置文件同步。它始于 Weaveworks 项目，现在是 CNCF 的孵化项目。你将其安装在 Kubernetes 集群上，并配置它监控 Git
    仓库的变化。“监控”仓库是一种基于拉（pull-based）的模型，`Flux` 定期检查仓库并将任何更改与线上 Kubernetes 环境同步。`Flux`
    以极易用而闻名，并且完全专注于到 Kubernetes 集群的 CD（它不负责 CI）。它只能监控一个 Git 仓库，并且只能部署到一个 Kubernetes
    集群和命名空间。这使得安装和配置变得简单，但也意味着它比其他工具的可配置性较低。


    `Argo`（有时称为 `ArgoCD` 或 `Argo CD`）与 `Flux` 非常。它是一个为 Kubernetes 设计的声明式 GitOps 工具，由
    Intuit 开发，目前是 CNCF 的孵化项目。它同样作为 Kubernetes 原生应用安装，是基于拉的，并专注于 CD。它相比 `Flux` 具有的优势是单个
    `Argo` 安装可以监控多个 Git 仓库并部署到多个 Kubernetes 命名空间。这让它感觉像是 `Flux` 的“专业版”。


    `Jenkins X` 是一个专注于 Kubernetes 的 GitOps 工具，涵盖了整个 CI/CD 过程。在其底层是一系列其他开源工具，这些工具经过良好封装且部署相对简单。然而，它比
    `Argo` 和 `Flux` 复杂得多。


    总结来说，GitOps 结合了基础设施代码（IaC）、Git 工作流和 CD 流水线来自动化基础设施的配置。事实上，GitOps 通常被认为是“正确执行的基础设施即代码”。你在声明式配置文件中定义基础设施的期望状态，并将这些文件存储在
    Git 仓库中。仓库成为你环境的“真理来源”（source of truth），这意味着任何当 PR 合并到仓库的 `master` 分支时，CD 流水线就会部署它。它实现了频繁且可靠的部署，并确保每次合并时手动更改都会被覆盖。原生的版本控制保留了每一次更改的记录，可用于快速可靠的回滚以及审计。此审计历史包含了所有的拉取请求（PR）、评论和批准。最后，大量人员可以在他们自己的特性分支上进行更改，但你可以限制批准合并的人数。此外，每个人都采用
    GitOps 流程并停止对线上环境进行手动更改也是至关重要的。


    ### 本章总结


    在本章中，你学习了 CI/CD 如何实现软件和基础设施的构建、测试和部署。CI 负责自动化代码构建和测试的早期步骤，然后发布到仓库中。CD 获取构建并测试过的产物，并自动化将其部署到线上环境的过程。GitOps
    在此基础上通过添加版本控制、拉取请求和批准来触发 CD 过程。GitOps 在 Kubernetes 环境中特别强大，在这些环境中，一切通过 YAML 配置文件进行声明式描述，而这些文件用于配置环境。流行的
    GitOps 工具包括 `Argo`、`Flux` 和 `Jenkins X`。


    ### 考试要点


    **持续集成、持续交付 (CI/CD)**


    `CI/CD` 是一套工具和实践，专注于自动化从代码到生产环境的步骤。它是 DevOps 实践的关键部分，能够实现快速、可重复且可靠的测试和部署。它还为开发者留了更多时间处理功能和修复。自动化步骤通常被称为
    `pipeline`（流水线）。


    **持续集成 (CI)**


    `CI` 专注于自动化软件构建和测试。开发者通常会将代码合并到带有特定标签的仓库，从而触发构建软件并运行测试的自动化流水线。通常会在容器中启动构建并进行测试。通过测试的代码将传递给后续
    CD 阶段。


    **持续交付 (CD)**


    `CD` 专注于将软件和基础设施交付到线上环境。它通常在 CI 之后运行，并仅部署“好代码”。好代码是通过 CI 测试的代码。


    **基础设施即代码 (IaC)**


    `基础设施代码` 是使用配置文件定义基础设施并使用平台进行配置的实践。它在 Kubernetes 环境中非常流行，所有的 Kubernetes 对象都可以定义在用于配置
    Kubernetes 应用和基础设施的 YAML 文件中。IaC 在公有云上的 Kubernetes 环境中特别强大，因为整个基础设施栈可以从配置文件描述并部署。


    **GitOps**


    `GitOps` 将基础设施即代码增加了版本控制、批准和 CD 流水线。典型的 GitOps 工作流由 GitOps 工具监控 Git 仓库的合并。每当软件或基础设施配置合并时，GitOps
    工具就会触发 CD 流水线将更新部署到线上环境。包括 `Argo`、`Flux` 和 `Jenkins X` 在内的新 CD 工具是流行的 GitOps 工具。许多人认为
    GitOps 是正确的 IaC。


    ## 复习题


    答案见附录 A。


    **1.** 下面哪个术语指的是应用程序从版本 1.1 更新到 1.2 的过程？选择所有正确答案。


    *   1. Release (发布)

    *   2. Rollup

    *   3. Rollout (滚动)

    *   4. Rollback (回滚)


    **2.** 下面哪项是对持续集成 (CI) 的描述？


    *   1. 自动化更新到开发和测试环境的部署

