    Kubernetes 运行了一系列特定的控制器，这些控制器实现了让 Kubernetes 如此强大的大部分智能。每个控制器都以`reconciliation
    loop`（调循环）的形式运行，监控集群并确保 `observed state`（观测状态）与 `desired state`（期望状态）保持同步。


    我们将简要介绍一些重要的控制器，然后通过一个示例进行演示。


    ### Deployment 控制器

    `Deployment controller` 实现了在 Kubernetes 上运行无状态应用所需的智能机制和功能。例如，它可以确保 Web 服务的 5
    个副本始终在运行。如果其中一个失败了，控制器会启动一个新的。它还实现了零停机滚动更新等更多功能。


    ### StatefulSet 控制器

    `StatefulSet controller` 与部署控制器类似，但它专门用于 `stateful`（有状态）工作负载。例如，它可以像部署控制器一样部署并自愈所需数量的
    pod。然而，它还实现了诸如 `ordered startups`（有序启动）和 `ordered shutdowns`（有序关机）等功能，这些对于写入共享数据存储的有状态应用可能非常重要。


    ### DaemonSet 控制器

    `DaemonSet controller` 确保集群中的每个节点上始终运行一个特定 pod 的实例。一个常见的例子是日志记录，通常需要在每个集群节点上运行一个代理来收集并传输日志。DaemonSet
    控制器将确保集群中的每个节点都运行一个代理 pod 实例。这包括在添加到集群的任何新节点上自动启动 pod。它还可以重启或替换失败的 pod。


    还有许多控制器，但它们都作为 `reconciliation loops` 运行，监控集群并确保 `observed state` 与 `desired state`
    匹配。


    考虑以下示例。你有一个新应用，需要 5 个运行 v1.3 版本代码的无状态 web pod。你在一个声明式清单文件中描述了这一需求，并将其提交到 API 服务器。这被记录在集群存储器中作为你的
    `desired state`，并由调度器将这 5 个 pod 分配给工作节点。部署控制器在控制平面上作为后台 `reconciliation loop`
    运行，确保观测状态与期望状态匹配——在这个示例中，它负责确保 5 个 web pod 始终在运行。如果观测状态与期望状态匹配，它将只是继续监控集群。然而，如果运行其中一个
    pod 的节点发生故障，部署控制器将观察到只有 4 个 web pod，并意识到这与 5 个的期望状态不符。它将通过指示调度器在存活节点上启动新 pod 来修复此问题。这将观测状态恢复到与期望状态，是
    `resiliency`（弹性）或 `self-healing`（自愈）的示例。


    继续相同的示例，假设你想将所有 5 个 web pod 从 v1.3 更新到 v1.4。你通过更新同一个声明式清单文件来指定新版本，并再次提交到 API 服务器。这注册了一个新的期望状态：运行
    v1.4 的 5 个 web pod。部署控制器将观察到 5 个运行 v1.3 的 web pod，并将其与期望状态进行比较（现在的期望是 0 个运行 v1.3
    的和 5 个运行 v1.4 的）。它将通过将 5 个运行 v1.3 的 pod 替换为 5 个运行 v1.4 的 pod 来做出响应。这是一个发布（rollout）的示例。


    > **术语科普。** 我们经常说控制器作为 `control loops`（控制循环）、`watch loops`（监听循环）或 `reconciliation
    loops`（调循环）运行。它们的意思是一样的。我们还使用 `current state`（当前状态）、`actual state`（实际状态）和 `observed
    state`（观测状态）来表示相同的内容。最后，将当前状态恢复到与期望状态同步的过程被称为 `reconciliation`（调解/协调）。


    ### 工作节点

    工作节点是用户应用程序运行的地方。它们可以是物理服务器、虚拟机或云实例，单个 Kubernetes 集群可以运行它们的混合。


    所有工作节点都运行三个重要的服务：

    * Kubelet

    * 容器运行时 (Container runtime)

    * Kube-proxy


    `kubelet` 是节点上主要的 Kubernetes `agent`。它监控 API 服务器获取新的任务分配，告诉容器运行时启动和停止哪些容器，并向 API
    服务器报告状态信息。它还执行其他操作，例如使容器日志对 `kubectl logs` 命令可用。


    旧的 Kubernetes 集群使用 Docker 作为容器运行时。然而，该层现在是可插拔的，这意味着集群管理员可以根据需求选择最佳的容器运行时。在写作时，大多数新的
    Kubernetes 集群使用 `containerd`（读作“container dee”）作为容器运行时，但存在许多其他选择。事实上，单个集群可以在不同的工作节点上运行不同的运行时，如图
    4.4 所示。


    ![](img/images----figure4-4.png)


    图 4.4


    在 Kubernetes 中使容器运行时层可插拔的技术是 `Container Runtime Interface (CRI)`（容器运行时接口）。以下列表是一些常见的容器运行时：

    * `Containerd`（在新集群中流行）

    * `CRI-O`（RedHat OpenShift 集群的默认）

    * `gVisor`（在容器和主机 OS 之间提供额外的隔离）

    * `Kata containers`（在轻量级虚拟机中运行每个容器）

    * `Docker`（原始的，但自 K8s 1.20 起已弃用）


    工作节点的最后一部分是 `kube-proxy`。它实现了网络功能，使得流量能够成功到达 pod。


    ### kubectl

    `kubectl` 是 Kubernetes 的命令行工具，适用于大多数平台，包括 Linux、MacOS 和 Windows。


    你在机器上安装它，配置其配置文件，并使用它来管理远程 Kubernetes 集群。它可以执行所有操作：

    * 获取集群信息

    * 部署 pod 和 service 等对象

    * 查询对象状态

    * 读取日志

    * 在容器内部执行命令


    它有一个名为 `config` 的配置文件，通常位于你主目录下的隐藏目录 `.kube` 中。你经常会听到它被称为 `kubeconfig` 文件，它包含了连接到集群的列表和凭据。以下是常用的
    kubectl 命令：


    * `kubectl get <object>`

    * `kubectl describe <object>`

    * `kubectl apply <filename>`

    * `kubectl delete <filename | object>`

    * `kubectl api-resources`


    `kubectl get` 命令返回资源的简要信息。例如，以下命令返回关于 pod `web-fe` 的信息。


    ```

    $ kubectl get web-fe

    NAME       READY   STATUS    RESTARTS   AGE

    web-fe     1/1     Running   0          29m

    ```


    以下 `kubectl describe` 命令返回关于该 pod 更详细的信息。


    ```

    $ kubectl describe pod web-fe

    Name:         web-fe

    Namespace:    default

    Priority:     0

    Node:         prod-cluster/192.168.65.4

    Start Time:   Wed, 9 Feb 2022 21:43:01 +0000

    Labels:       project=kcna-book

    Annotations:  <none>

    Status:       Running

    IP:           10.1.0.107

    <省略>

    ```


    部署对象到 Kubernetes 的首选方法是在 YAML 清单文件中描述它们并使用 `kubectl apply` 或 `kubectl create`
    进行部署。以下命令部署了 `web-deploy.yml` 文件中定义的对象。


    ```

    $ kubectl apply -f web-deploy.yml

    deployment.apps/kcna-deploy created

    ```


    `kubectl delete` 命令删除对象。你可以给它对象类型和名称，也可以给它一个清单文件。如果你给出对象类型和名称，它将删除该对象。如果你给出一个
    YAML 清单文件，它将删除文件中定义的所有内容。参见以下示例。


    ```

    $ kubectl delete pod web-fe

    pod "web-fe" deleted


    $ kubectl delete -f web-deploy.yml

    deployment.apps "kcna-deploy" deleted

    ```


    以下命令显示了你可以在集群上部署的所有资源列表。


    '
- fmt: '

    ```

    $ kubectl api-resources

    NAME            APIVERSION      NAMESPACED   KIND

    pods            v1              true         Pod

    deployments     apps/v          true         Deployment

    daemonsets      appsv1          true         DaemonSet

    jobs            batch/v1        true         Job

    <Snip>

    ```


    It’s important that your version of `kubectl` is no more than one minor version
    older or newer than your Kubernetes API server. For example, if you’re running
    Kubernetes 1.23, you can use `kubectl` version 1.22 or 1.24.


    ### Hosted Kubernetes


    Most cloud platforms offer a `hosted Kubernetes` service. This is where the cloud
    platform owns and manages the Kubernetes cluster, and you pay to use it.


    Many hosted Kubernetes services own and manage the control plane but let you manage
    worker nodes. In this model, the cloud platform is responsible for the performance
    and availability of the control plane, as well as performing upgrades. You’re
    responsible for adding and removing worker nodes and configuring node pools.


    Hosted Kubernetes is very popular as it removes the pain and lead-time of building
    and managing your own high-performance highly-available cluster. However, costs
    that might initially seem small can easily become big if not managed well.


    Popular hosted Kubernetes services include:


    *   AWS Elastic Kubernetes Service (EKS)

    *   Azure Kubernetes Service (AKS)

    *   Google Kubernetes Engine (GKE)

    *   Linode Kubernetes Engine (LKE)


    Others also exist.


    ### Kubernetes architecture quiz


    **1.** Which open-source distributed database is the cluster store based on?


    *   1. Consul

    *   2. Oracle

    *   3. MongoDB

    *   4. etcd


    **2.** Which of the following container runtimes is default on Red Hat OpenShift
    clusters?


    *   1. CRI-O

    *   2. Docker

    *   3. containerd

    *   4. kata


    **3.** Which of the following statements is true of recent releases of Kubernetes?


    *   1. containerd is unsupported

    *   2. containerd is deprecated

    *   3. The Docker runtime is default

    *   4. The Docker runtime is deprecated or unsupported


    **4.** What is a common name for the kubectl configuration file?


    *   1. kubernetes.config

    *   2. kubeconfig

    *   3. kubectl.yml

    *   4. Kubelet


    **5.** What is the job of the Kubernetes API server?


    *   1. To serve the API over HTTPS

    *   2. The schedule work to cluster nodes

    *   3. To start and stop containers

    *   4. To define Kubernetes objects


    **6.** Which of the following are Kubernetes control plane services? Choose two.


    *   1. Docker

    *   2. Kubelet

    *   3. API server

    *   4. Scheduler


    **7.** Which of the following are types of Kubernetes cluster node? Choose two.


    *   1. Worker nodes

    *   2. Secondary nodes

    *   3. Control plane nodes

    *   4. Primary nodes


    **8.** What is hosted Kubernetes?


    *   1. Where your cloud platform owns and manages the Kubernetes control plane

    *   2. All Kubernetes clusters that run on a public cloud platform

    *   3. A name for on-premises Kubernetes clusters

    *   4. Lightweight Kubernetes distributions running on IoT and edge devices


    **9.** Which Kubernetes controller manages workloads that work with persistent
    data?


    *   1. CronJob

    *   2. Job

    *   3. StatefulSet

    *   4. Deployment


    **10.** Which of the following best describes how Kubernetes controllers operate?


    *   1. As key-value stores

    *   2. Client-server architecture

    *   3. As RESTful objects exposed over HTTPS

    *   4. As background reconciliation loops


    **Answers.** 1:D, 2:A, 3:D, 4:B, 5:A, 6:C,D, 7:A,C, 8:A, 9:C, 10:D.


    ### Scheduling


    Kubernetes has a built-in scheduler that runs as part of the control plane. It
    uses advanced logic to schedule pods to the right worker nodes.


    Scheduling starts when Kubernetes is asked to run a new pod. This might be you
    sending a new manifest file to the API server that asks for a new pod, it might
    be the result of an autoscaling event, or it might even be a self-healing action
    replacing a failed pod. Either way, as soon as a new pod is requested, it goes
    into the pending state while the scheduler picks the best node to run it. As soon
    as a node is identified the pod is scheduled. However, if the scheduler can’t
    find a suitable node, the pod will stay pending.


    Consider the following example. You’re running a Kubernetes cluster with 6 worker
    nodes and all of your pods have been configured with resource requests and resource
    limits – resource requests tell the scheduler the minimum amount of CPU and memory
    a container needs in order to run, whereas resource limits set maximums. Assume
    you’re scheduling two new pods and each one requires 2GB of memory and 2 CPU cores.
    If the scheduler can’t find a worker node with enough resources, they’ll go into
    the pending state until a suitable node becomes available. As soon as a suitable
    node becomes available they’ll be scheduled.


    The scheduler can also do advanced things such as:


    *   Affinity and anti-affinity

    *   Pod topology spread constraints

    *   Match workloads with container runtimes

    *   Schedule work to nodes with the right storage


    `Affinity rules` let you schedule pods onto particular nodes, or nodes that are
    running particular pods. `Anti-affinity` does the opposite – it lets you tell
    the scheduler not to run pods on particular nodes, or nodes already running particular
    pods. Think of affinity and anti-affinity rules as being like magnets that can
    either attract or repel pods from particular nodes – affinity rules attract pods
    to particular nodes, whereas anti-affinity rules repel pods from particular nodes.


    `Pod topology spread constraints` let you balance pods across user-defined failure
    domains. They’re an important tool for achieving application high availability.


    The scheduler can also target pods at nodes with specific container runtimes.
    For example, you can tell Kubernetes that certain workloads should only run on
    nodes with the gVisor runtime. It can also schedule containers to nodes with access
    to certain storage volumes.


    ### Scheduling quiz


    **1.** What is the job of the Kubernetes scheduler?


    *   1. To assign work to worker nodes

    *   2. To run batch jobs at specific times

    *   3. To maintain accurate time on the control plane

    *   4. To keep observed state in sync with desired state


    **2.** What happens to a pod if the scheduler can’t find a worker node to run
    it?


    *   1. The pod will be rejected and won’t run

    *   2. The pod will sit in the pending state

    *   3. It will temporarily run on a control plane node


    **Answers.** 1:A, 2:B.


    ### Kubernetes namespaces


    Kubernetes namespaces are a way to divide a single Kubernetes cluster into virtual
    clusters called `namespaces`.


    Each namespace can have its own set of resource quotas and user accounts. This
    makes them a good way to share clusters among different teams or environments.
    For example, you might use namespaces to divide a single cluster into dev, test,
    and qa namespaces. However, you shouldn’t use namespaces as a workload boundary
    to try and isolate hostile or potentially dangerous workloads. For example, namespaces
    cannot prevent a compromised container in one namespace from affecting containers
    in other namespaces. For example, a compromised container in the Pepsi namespace
    can easily take down containers in the Coke namespace. Currently, the only way
    to guarantee one workload won’t impact another is to put them on separate clusters.


    ### Kubernetes namespaces quiz


