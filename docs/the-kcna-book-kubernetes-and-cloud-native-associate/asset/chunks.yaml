    ### 7. You’re a security engineer being asked to give an example of a threat vector
    that exists for cloud native workloads but not traditional monolithic applications.
    Which could you use?


    * 1. Shared kernels

    * 2. Firewall breaches

    * 3. Software vulnerabilities

    * 4. Unpatched servers and applications


    ### 8. You’re looking to hire a hands-on team player who understands entire applications
    and application lifecycles and will bring a security-first approach. Which of
    the following job roles should you advertise?


    * 1. Cloud Architect

    * 2. DevSecOps Engineer

    * 3. Data Engineer

    * 4. Sysadmin


    ### 9. You’re building a business case to re-factor an existing application to
    make it cloud native. What are some of the benefits this will bring? Choose all
    correct answers.


    * 1. Application resiliency

    * 2. Automatic scaling

    * 3. Less human interaction with changes

    * 4. Better visibility into what’s going on inside the app


    ### 10. Which of the following are OCI specifications?


    * 1. `image-spec`

    * 2. `distribution-spec`

    * 3. `pod-spec`

    * 4. `runtime-spec`


    ### 11. How are service meshes able to augment Kubernetes workloads?


    * 1. By enforcing `KubeBench` best practices on all Kubernetes clusters

    * 2. By injecting a sidecar container into every application pod

    * 3. By automatically scanning the image of every container

    * 4. By implementing an automated testing pipeline


    ### 12. Which of the following are examples of container runtimes? Choose all
    correct answers.


    * 1. ESXi

    * 2. `Docker`

    * 3. Kubernetes

    * 4. `containerd`


    ### 13. You’re heading up a new project building a microservices application on
    containers. However, you’ve just learned of strict security requirements and concerns
    over shared kernels. What can you do?


    * 1. Ensure the project uses namespaced containers

    * 2. Ensure the project uses virtualised containers

    * 3. Ensure the project runs on Linux nodes

    * 4. Ensure the project runs on FreeBSD nodes


    ### 14. Which of the following container runtimes creates every container in its
    own virtual machine?


    * 1. `Docker`

    * 2. `RunC`

    * 3. `Kata containers`

    * 4. `CRI-O`


    ### 15. You’re about to deploy a new Kubernetes cluster running version 1.23.
    Which of the following versions of `kubectl` will you be able to safely use to
    manage it? Choose all correct answers.


    * 1. 1.19

    * 2. 1.24

    * 3. 1.25

    * 4. 1.22


    ### 16. You’re designing infrastructure to host microservices apps and you’ve
    been told that all container-to-container traffic has to be encrypted. Which of
    the following will accomplish this?


    * 1. Force every application to encrypt its own traffic

    * 2. Use the `CRI-O` container runtime

    * 3. Deploy a service mesh

    * 4. Use Kubernetes network policies


    ### 17. Put the following four Cs of cloud native security in order starting with
    the one you typically have the most control over and finishing with the one you
    typically have the least control over.


    * 1. Code, containers, clusters, cloud

    * 2. Code, clusters, containers, cloud

    * 3. Cloud, containers, clusters, code

    * 4. Clusters, containers, cloud, code


    ### 18. You’re deploying a Kubernetes cluster for some new applications. Which
    of the following network services does Kubernetes natively support? Choose two.


    * 1. IP address management (IPAM)

    * 2. Traffic encryption

    * 3. Service discovery

    * 4. Traffic shaping


    ### 19. You’re deploying a new production Kubernetes environment and management
    want to know why you’re deploying a service mesh. Which of the following would
    you include in your response? Choose all correct answers.


    * 1. Service meshes can automatically encrypt traffic

    * 2. Service meshes can automatically make network traffic more observable

    * 3. Service meshes can be used to make networks more reliable

    * 4. Service meshes enable IPv6 traffic


    ### 20. You’re adding instrumentation to an in-house application to output high-quality
    telemetry. Where should you expose it so that Prometheus can scrape it?


    ### 1. `/status`

    * 2. `/prometheus`

    * 3. `/healthz`

    * 4. `/metrics`


    ### 21. You’re deciding between containers and virtual machines for a new app.
    Which of the following are true? Choose all correct answers.


    * 1. You can run more virtual machines on a single server

    * 2. You can run more containers on a single server

    * 3. Virtual machines start faster than containers

    * 4. Containers start faster than virtual machines


    ### 22. How many Kubernetes releases happen in calendar year?


    * 1. 1

    * 2. 2

    * 3. 3

    * 4. 4


    ### 23. Which of the following container runtimes implements a proxy kernel layer
    between a container and the host’s kernel?


    * 1. `Docker`

    * 2. `containerd`

    * 3. `Kata containers`

    * 4. `gVisor`


    ### 24. You’re deploying a new cluster and need to ensure the control plane is
    highly available. How many control plane nodes should you deploy?


    ### 1. 1

    * 2. 3

    * 3. 4

    * 4. 6


    ### 25. You’re managing a cluster with all nodes running the `containerd` runtime.
    Which of the following might be a concern? Choose all correct answers.


    * 1. Unable to run OCI containers

    * 2. Root containers

    * 3. Doesn’t work with `CRI`

    * 4. Shared kernel


    ### 26. You’re responsible for a large environment with many customers that need
    isolating from each other. You’re about to containerise some of their applications
    and run them on Kubernetes. What can you do to ensure competing workloads are
    securely isolated?


    * 1. Create a Namespace for each customer on the existing Kubernetes cluster

    * 2. Use affinity scheduling rules to target each customer onto their own nodes

    * 3. Create a new Kubernetes cluster for each customer

    * 4. Use the `gVisor` runtime on all nodes


    ### 27. You manage a production Kubernetes environment and need to ensure pods
    are deployed across user-defined failure domains. Which technology will help?


    * 1. Pod topology spread constraints

    * 2. Pod HA policies

    * 3. Pod affinity rules

    * 4. Network policies


    ### 28. You want to divide a Kubernetes cluster so that different departments
    have their own resource quotas and users. Which technology will help?


    * 1. `KubeVirt`

    * 2. The `gVisor` runtime

    * 3. A quota policy

    * 4. Namespaces


    ### 29. Which of the following is the process for accepting new objects into the
    Kubernetes API?


    * 1. sandbox > incubating > graduated

    * 2. alpha > beta > gamma

    * 3. alpha > beta > stable

    * 4. incubating > sandbox > graduated


    ### 30. You’re deploying a new application. Which of the following types of check
    will ensure the application is up and running as expected?


    * 1. Health checks

    * 2. Prometheus checks

    * 3. Reconciliation

    * 4. Metric aggregation


    ### 31. Which of the following commands returns the logs of a recently terminated
    pod called `kcna-pod`?


    * 1. `kubectl logs kcna-pod`

    * 2. `kubectl logs kcna-pod -p`

    * 3. `kubectl get logs kcna-pod`

    * 4. `kubectl get logs kcna-pod -p`


    ### 32. Which of the following kubectl commands will return detailed information
    about a pod called `kcna-pod`?


    * 1. `kubectl get pod kcna-pod`

    * 2. `kubectl get pod kcna-pod --detail`

    * 3. `kubectl describe pod kcna-pod`

    * 4. `kubectl get pod kcna-pod --verbose`


    ### 33. You need to deploy a service mesh and the leadership team at your organisation
    has decided to only deploy technologies that have graduated the CNCF. Which of
    the following can you deploy?


    * 1. `Istio`

    * 2. `Linkerd`

    * 3. `prometheus`

    * 4. `Consul`

