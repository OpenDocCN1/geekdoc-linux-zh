    # The KCNA Book


    ### Kubernetes and Cloud Native Associate


    #### Nigel Poulton


    This book is for sale at [http://leanpub.com/thekcnabook](http://leanpub.com/thekcnabook)


    This version was published on 2022-03-23


    ![publisher''s logo](resources/leanpub-logo.png)


    This is a [Leanpub](https://leanpub.com) book. Leanpub empowers authors and publishers
    with the Lean Publishing process. [Lean Publishing](https://leanpub.com/manifesto)
    is the act of publishing an in-progress ebook using lightweight tools and many
    iterations to get reader feedback, pivot until you have the right book and build
    traction once you do.


    © 2022 Nigel Poulton


    ## Table of Contents


    ## Guide


    1. [Begin Reading](#chap00.xhtml)


    # Getting started


    Kubernetes and cloud native technologies are all the rage and are shaping the
    world we work in. Building apps as small, specialised, single-purpose services
    that can self-heal, autoscale, and be regularly updated without downtime brings
    huge benefits. However, possessing the knowledge and skills to leverage these
    technologies is a huge career boost for you as an individual. For example, knowing
    how to design, build, and troubleshoot cloud native microservices applications
    running on Kubernetes can get you the best roles, on the best projects, at the
    best organisations. It can even earn you more money.


    With all of this in mind, the Cloud Native Computing Foundation (CNCF) designed
    the KCNA exam and certification as a way for you to prove your competence with
    these technologies.


    This book covers all of the exam objectives in one place in a well-organised and
    concise format. It’s useful as both a revision guide and a place to start learning
    new technologies and concepts. For example, if you already know the basics of
    Kubernetes, the book will reinforce everything you already know, as well as test
    your knowledge with its extensive quizzes and explanations. However, if you’re
    new to any of the topics on the exam, the book will get you up-to-speed quickly.


    ## Who is the book for


    The book is for anyone wanting to gain the KCNA certification.


    As the exam tests your understanding of core technologies and concepts, it’s applicable
    to anyone working in technology. Examples include:


    * Architects

    * Management

    * Technical marketing

    * Developers

    * Operations

    * DevOps, DevSecOps, CloudOps, SREs etc.

    * Data engineers

    * More…


    The book and exam are particularly useful if you come from a traditional IT background
    and want to learn the fundamentals of Kubernetes and cloud native.


    If you’re brand new to Kubernetes, you should consider reading *Quick Start Kubernetes.*
    It’s only 100 pages long and will get you up-to-speed and 100% comfortable with
    the fundamentals of Kubernetes. It also has very easy hands-on examples that really
    help you grasp some of the concepts that might be new to you. It’s available on
    Amazon and Leanpub, and published in several languages, including French, Italian,
    Portuguese, Russian, Simplified Chinese, Spanish, and more about to be released.


    ## How is the book organised


    The technical content of the book is organised with one chapter per exam domain.
    There’s a chapter dedicated to preparing you to take the exam, and there’s a **full
    practice exam** with 60 questions just like the real exam.


    Each technical chapter is organised as follows:


    * Technical content

    * Chapter summary

    * Exam essentials

    * Practice questions


    The *exam essentials* is a recap of the major topics learned and can be used like
    flashcards when doing final revision and exam prep.


    The practice questions test your mastery of the topics learned and are a similar
    style to the questions in the exam. However, they are not actual exam questions.


    The chapter dedicated to preparing for, and taking the exam, explains exactly
    what it’s like taking the exam so you don’t have any surprises on the day.


    The practice exam is a great opportunity for you to test your readiness for the
    real exam. Again, the questions are *like* the questions you’ll see in the exam,
    but they’re not actual exam questions.


    ## About the author


    OK, so I’m Nigel and I’ve trained over one million people on cloud and container
    technologies. I’ve authored several best-selling books and video training courses
    and dedicated my working life to helping people take their first steps with containers
    and Kubernetes. I’m also passionate about explaining things as clearly as possible
    so that you love my books and videos.


    I actually wrote this entire book in draft form, took the exam, then came back
    and finely tuned the content to better prepare you for the exam. I considered
    failing the exam and re-taking it multiple times to get an even better feel for
    the style of questions and levels of detail being tested. However, that felt wrong
    and I wanted to get the book into your hands as quickly as possible.


    I’d love to connect and would love to hear about your exam experience. You can
    reach me at all of the following:


    * LinkedIn: https://www.linkedin.com/in/nigelpoulton/

    * Web: nigelpoulton.com

    * Twitter: @nigelpoulton


    ## Feedback


    Writing books is hard, and I worked tirelessly over holiday periods to get this
    book into your hands. With this in mind, I’d consider it a personal favor if you
    took a minute or two to write an Amazon review.


    Also, if you have any feedback on the book, or your exam experience, ping me an
    email at `kcnabook@nigelpoulton.com` and I’ll do my best to respond.


    Enjoy the book, and good luck with your exam!


    # 1: Setting the scene


    This chapter doesn’t map directly to an exam objective. However, the things you’ll
    learn are in the exam and are important in setting the scene for why we have technologies
    like containers and Kubernetes. If you already know this, you can skip to the
    next chapter. Otherwise, stick around while we set the scene for the rest of the
    book.


    We’ll cover all of the following at a high level.


    * Virtualisation

    * Containerisation

    * The transition from monolithic apps to microservices


    Don’t worry if you think we’re not covering things in enough detail. This is just
    an introductory chapter and we’ll get into the detail in later chapters.


    ## Virtualisation


    In the distant past we deployed one application per physical server. This was
    a huge waste of physical resources and company capital. It also delayed the rollout
    of applications while physical servers were procured, racked, patched into the
    network, and had an operating system installed.


    Virtualisation technologies like `VMware` came along and opened the door for us
    to run multiple applications on a single physical server. This meant we didn’t
    have to buy a new server for every new app, we could deploy apps very quickly
    to virtual machines on existing servers and avoid all of the following:


    * No more waiting for finance to approve server purchases

    * No more waiting for the datacenter team to rack and cable servers

    * No more waiting for the network team to authorise servers on the network

    * No more waiting for sysadmins to install operating systems


    Almost immediately we went from wasting money on over-powered physical servers
    that took ages to purchase and install… to a world where we could quickly provision
    virtual machines on existing servers.


    However, the industry never sleeps, and innovation never stops.


    ## Containerisation


    In the early 2010’s `Docker` gave the world the gift of easy-to-use containers.


    At a high level, containers are another form of virtualisation that allow us to
    run even more apps on less servers and deploy them even faster.


    Figure 1.1 shows a side-by-side comparison of server virtualisation and container
    virtualisation.


    ![](resources/images----figure1-1.png)


    Figure 1.1

