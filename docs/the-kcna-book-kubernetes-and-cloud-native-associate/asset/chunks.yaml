    Pods allow multiple containers to be co-scheduled to the same node and share the
    same execution environment (memory and volumes). Containers in the same pod do
    not share the same container image as they should be different, but complimentary,
    containers. For example, a web container running the `NGINX` image and a helper
    container running a `Git` synchroniser image.


    ### Question 10, answers A, B, D

    This is similar to the previous question. All containers in the same pod will
    run on the same node and share access to the same volumes and network stack. They
    will not share the same container image.


    ### Question 11, answers B, C

    A Kubernetes cluster is made up of control plane nodes and worker nodes.


    ### Question 12, answers B, D

    The `API server` and scheduler run run on the Kubernetes control plane. `kubectl`
    is the Kubernetes command line utility and you normally install it on your laptop
    or an admin workstation. `kube-proxy` handles node-level networking and while
    it technically runs on control plane nodes as well as worker nodes, it’s not considered
    part of the control plane.


    ### Question 13, answer C

    All control plane services run on all control plane nodes for high availability.


    ### Question 14, answer C

    You should always deploy an odd number of control plane nodes. 3 is the most common,
    but 5 is also common.


    ### Question 15, answer D

    `kubectl` is the Kubernetes command line utility.


    ### Question 16, answer B

    The cluster store is the only stateful control plane service and is usually based
    on the `etcd` distributed database.


    ### Question 17, answer A

    Existing applications will keep running if the control plane goes down. However,
    you won’t be able to manage them or deploy more apps until the control plane comes
    back up.


    ### Question 18, answer D

    `kubectl` sends all requests to the `API server`.


    ### Question 19, answer B

    Kubernetes controllers run as reconciliation loops that ensure observed state
    is always in sync with desired state.


    ### Question 20, answer D

    The `deployment` controller manages stateless workloads on Kubernetes.


    ### Question 21, answer C

    The `statefulset` controller manages stateful workloads on Kubernetes.


    ### Question 22, answer A

    The `daemonset` controller ensures an instance of a pod runs on every worker node
    in the cluster.


    ### Question 23, answers C, D

    `Current state` and `actual state` are both terms that mean the same thing as
    `observed state`.


    ### Question 24, answer C

    Reconciliation is the process of bringing observed state back into sync with desired
    state.


    ### Question 25, answer B

    Kubernetes controllers operate as background control loops that bring observed
    state into sync with desired state.


    ### Question 26, answer A

    `kube-proxy` is responsible for implementing local networking rules on cluster
    nodes.


    ### Question 27, answer D

    The Container Runtime Interface (`CRI`) is the tool that makes the Kubernetes
    container runtime layer pluggable.


    ### Question 28, answer A

    `containerd` is the most popular container runtime on modern Kubernetes clusters.
    `Docker` is more popular on older clusters but was deprecated in Kubernetes `1.20`
    and removed in `1.24`.


    ### Question 29, answer C

    `Docker` was deprecated in Kubernetes `1.20` and removed in `1.24`.


    ### Question 30, answer C

    The `kubeconfig` file is normally called “config” and stored in the hidden `.kube`
    folder of your profile.


    ### Question 31, answer D

    `kubectl` will return detailed info.


    ### Question 32, answers B, C

    `kubectl` should be no more than one.


    ### Question 33, answer A

    A pod will remain in pending state.


    ### Question 34, answer C

    Using labels lets you spread across nodes.


    ### Question 35, answer D

    Kubernetes namespaces divide a cluster. Each namespace has its own quota.


    ### Question 36, answer B

    Kubernetes objects are defined.


    ### Question 37, answer C

    Kubernetes releases three major version per year.


    ### Question 38, answer A

    Kubernetes deploys all pods.


    ### Question 39, answer D

    The Container Network Interface (`CNI`) makes networking layer pluggable.


    ### Question 40, answer A

    `Cilium` uses eBPF for networking.


    ## Chapter 5: Cloud native delivery


    Question 1, answers A, C

    “Release” and “rollout” both refer to updates of an app.


    Question 2, answer C

    Continuous Integration (`CI`) allows building and testing code.


    Question 3, answer A

    Continuous Integration (`CI`) is a great way to identifying bugs.


    Question 4, answer A

    Continuous Deployment (`CD`) is the process of deployment to live environments.


    Question 5, answer C

    CI/CD is a cornerstone of DevOps.


    Question 6, answer D

    `Jenkins` is a popular CI/CD tool. `Kubernetes` and `Swarm` are both container
    orchestrators.


    Question 7, answer B

    Using CI/CD tools allows developers to spend more time building.


    Question 8, answers A, C, D

    GitOps workflows integrate infrastructure as code, pull requests, and continuous
    delivery.


    Question 9, answers A, B, D

    Infrastructure as code defines policies, networks, and other cloud-based components.
    It cannot be used for physical tasks.


    Question 10, answer B

    IaC works on-premises and public cloud environments. However, as public cloud
    environments tend to be highly virtualised, it works better on them.


    Question 11, answer B

    Kubernetes objects are typically defined in YAML files.


    Question 12, answer A

    Pull requests and merges are used to trigger CD steps of a GitOps workflow.


    Question 13, answers A, B

    `ArgoCD` and `FluxCD` are both popular GitOps tools.


    Question 14, answer D

    You should not make manual changes once you’ve started using GitOps processes
    as they’ll be overwritten each time a PR is merged and the CD pipeline kicks in.


    Question 15, answer D

    Linus Torvalds created Git version control system used by GitHub.


    Question 16, answer B

    GitOps tools only care about deployment to live environments and aren’t concerned
    with build stages.


    Question 17, answer A

    In a GitOps workflow all manual changes can be overwritten with every PR and subsequent
    merge.


    Question 18, answer C

    An anti-pattern is something that seems like a good idea when you do it but turns
    out to be a bad idea later. A simple example is making a manual fix in a live
    environment to fix an issue. However, the fix is overwritten later when the automated
    process kicks in.


    Question 19, answer A

    `FluxCD` is known for being simple to configure and use.


    ## Chapter 6: Cloud native observability


    Question 1, answer D

    Telemetry is log data, metrics, and traces that are output from a system.


    Question 2, answers A, B, C

    The three main classes of telemetry data are logs, metrics, and traces.


    Question 3, answer D

    `Prometheus` stores data in a timeseries format.


    Question 4, answer B

    Telemetry is used to troubleshoot and tweak performance of a system.


    Question 5, answer B

    The OpenTelemetry projects provides instrumentation and specifications for cloud
    native observability.


    Question 6, answer B

    Log data is application output that is usually output as text or JSON.


    Question 7, answer C

