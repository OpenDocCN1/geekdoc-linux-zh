    * 2. `kubectl inspect pod kcna`

    * 3. `kubectl parse pod kcna`

    * 4. `kubectl describe pod kcna`


    ### 32. 你有一个运行版本 1.23 的 Kubernetes 集群。以下哪些版本的 `kubectl` 是支持的？选择所有正确答案。

    * 1. 1.21

    * 2. 1.22

    * 3. 1.24

    * 4. 1.25


    ### 33. 如果调度器无法识别用于运行 pod 的节点，新创建的 pod 会发生什么？

    * 1. 它将保持 pending 状态，直到有可用节点

    * 2. 它将保持 pending 状态持续 24 小时

    * 3. 它将保持 pending 状态，直到集群管理员释放它

    * 4. 它将保持 pending 状态，直到尝试重新部署


    ### 34. 下列哪种技术将确保 Kubernetes 调度器将负载分布在用户定义的故障区域？

    * 1. API server

    * 2. Pod HA 策略

    * 3. Pod 拓扑分布约束 (Pod topology spread constraints)

    * 4. 网络策略 (Network policies)


    ### 35. 哪种 Kubernetes 技术适用于划分单个集群，以便不同的团队和部门拥有自己的资源配额和用户账户？

    * 1. KubeVirt

    * 2. gVisor 容器运行时

    * 3. 配额策略 (quota policy)

    * 4. 命名 (Namespaces)


    ### 36. pods、 deployments、services 和 ingresses 等 Kubernetes 对象在哪里定义？

    * 1. 集群存储 (cluster store)

    * 2. API

    * 3. 集群目录 (cluster catalog)

    * 4. 部署控制器 (deployment controller)


    ### 37. Kubernetes 新版本的发布频率是多少？

    * 1. 每年一次

    * 2. 每季度一次

    * 3. 每四个月一次

    * 4. 每月一次


    ### 38. Kubernetes pods 部署到的网络名称是什么？

    * 1. pod 网络

    * 2. 容器网络

    * 3. 覆盖网络 (overlay network)

    * 4. 默认网络


    ### 39. 下列哪种技术使 Kubernetes 网络层变成可插件的？

    * 1. eBPF

    * 2. OpenShift

    * 3. OpenNetworking

    * 4. 容器网络接口 (Container Network Interface)


    ### 40. 哪个流行的 Kubernetes 网络插件是基于 eBPF 的？

    * 1. Cilium

    * 2. Calico

    * 3. Kubenet

    * 4. Weave


    # 5: 云原生应用交付


    本章涵盖了考试中“云原生应用交付”部分的主题。这些主题占整个考试分数的 8%。


    本章结构如下：

    * 导论 (Primer)

    * CI/CD

    * GitOps

    * 考试总结

    * 考试要点

    * 回习题


    ## 导论


    云原生应用交付通常被称为 `code to cloud`（代码到云）和 `code to production`（代码到生产），我们通常通过持续集成 (CI)
    和持续交付 (CD) 流水线以及 GitOps 工具来对其自动化。我们将在本章稍后详细讨论这些内容，但现在你应该了解主要的自动化步骤。


    1. 构建代码

    2. 测试代码

    3. 发布代码


    自动化这些步骤可以实现快速、频繁且高质量的发布。


    最后，`release`（发布）是推出应用程序或环境新版本的术语。例如，将应用程序从 1.1 版本更新到 1.2 版本是通过一次 `release` 完成的。我们经常使用
    `rollout`（滚动更新）、`update`（更新）和 `release`（发布）来表示相同的意思。


    ## CI/CD


    CI/CD 是持续集成（Continuous Integration）和持续交付（Continuous Delivery）的缩写。它是一套自动化软件构建、测试和配置的工具与流程。它实现了频繁可靠的发布，是更广泛的
    DevOps 运动不可或缺的一部分。


    正如缩写所示，CI/CD 是两个独立的流程：

    * 持续集成 (CI)

    * 持续交付 (CD)


    CI 自动化了软件更改的构建和测试过程。它通常涉及开发者频繁地将代码合并到中央仓库，并在那里进行构建和广泛测试。构建和测试必须是全自动的，并且在发布到活跃环境之前识别问题非常有效。整个过程都是自动化的，并确保只有高质量的代码才会传递到
    CD 过程。


    CD 自动化了将这些高质量代码发布到开发、测试和生产等活跃环境的后期过程。它通常在构建成功通过 CI 测试后被触发。


    整个 CI/CD 过程被称为 `pipeline`（流水线），因为它类似于水管的运行——你将某东西放入管道的一端，在它从另一端出来之前，你不需要再触碰它。CI/CD
    流程的自动化特性意味着一旦开发者向仓库上传了更改，整个过程就是自动化的，直到构建并测试好的产制品从另一端出来。


    这些步骤的自动化使得所有内容成为可能：

    * 更快的软件交付

    * 更频繁的软件交付

    * 更少的 Bug

    * 生产率更高的开发者


    自动化总是让事情更快且可重复。这就是为什么自动化的 CI/CD 流水线允许开发者更快、更频繁地测试和部署软件。测试自动化且强制意味着更少的 Bug 会进入生产环境。此外，开发者无需参与构建和测试（他们将代码放入流水线，由系统完成其余工作），这意味着他们可以花更多时间构建新应用和功能。


    你有时可能会看到 CD 分分为两个不同的不同的：

    * 持续交付 (Continuous delivery)

    * 持续部署 (Continuous deployment)


    `持续交付` 在部署到生产之前需要人工批准，而 `持续部署` 则自动化包括部署在内的一切。


    通常认为良好的 CI/CD 实践是尽可能频繁地构建、测试和发布。这样做可以测试流水线，让开发者和管理层对流程感到放心，保持更改和更新小且影响小，并加快功能和修复的交付。相反的做法是积累大量更改并在每年实施两次大任务。这种方式风险更高，并延迟了功能和修复的发布。


    流行的 CI/CD 工具包括：

    * Jenkins

    * CircleCI

    * GitLab CI

    * Travis CI


    总结来说，CI/CD 是关于自动化从应用程序构建、测试一直到在生产环境中部署的整个过程。使用一组特殊的工具来实现 CI/CD 流水线，并实现频繁可靠的软件发布。CI
    自动化构建和测试，并将经过测试的代码上传到仓库。CD 获取完成的代码并将其部署到开发、测试和生产环境。


    ## GitOps


    GitOps 的想法在 2017 年流行起来。从高层来说，它将我们多年来在软件开发中使用经过实战检验的 DevOps 实践引入基础设施和 Kubernetes
    世界。如果你刚刚读完关于 CI/CD 的章节，GitOps 通过增加版本控制和拉取请求（pull requests）对这些内容进行了扩展。


