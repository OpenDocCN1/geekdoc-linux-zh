    从宏观上看，每个微服务都应该以日志和指标的形式生成高质量的测量数据。Prometheus 收集这些数据并将其存储在可以查询和分析的地方，以帮助故障排除和优化。它还可以将数据馈给
    Grafana，用于生成高质量的仪表板和可视化。


    ## 深入探讨……


    Prometheus 期望应用程序通过 `/metrics` HTTP 端点暴露指标。这是以 `/metrics` 结尾的网络地址的术语。例如，如果一个微服务可以通过
    `store.myapp.k8s.local` 访问，它应该在 `store.myapp.k8s.local/metrics` 暴露 Prometheus
    指标。Prometheus 定期连接到此端点以 `scrape`（抓取）指标并存储它们。`scrape` 是“收集”指标的术语。这是一个 `pull`（拉取）模型，应用程序只负责提供指标，而抓取指标的辛苦工作则是
    Prometheus 的职责。Prometheus 抓取指标的频率被称为 `scrape interval`（抓取间隔）。


    一旦 Prometheus 获取了指标，就会将其存储在时间序数据库中。事件以纯文本形式存储，每个事件存储在数据库的单独行中。`Timeseries`（时间序）意味着每个事件都有时间戳。事实上，每个
    Prometheus 指标都有名称、时间戳和各种标签（labels）。这使得非常很容易进行分组、查询和分析。在查询方面，Prometheus 拥有自己的强大查询语言，称为
    `PromQL`。你可能还会听到将 Prometheus 数据模型称为 `multi-dimensional`（多维）。这意味着指标可以根据名称、时间戳和标签进行分组、查询和组织。


    Prometheus 提供了基础仪表板，但通常与 Grafana 配合使用以获得更强大的可视化。


    某些应用程序（例如短生命期的批处理作业）并不适合按定期间隔抓取的拉取模型。一个简单的例子是短生命期的批处理作业，它可能在 Prometheus 抓取其指标之前就已经退出。在这种情况下，你可以配置应用程序将指标
    `push`（推送）到 Prometheus 的 `pushgateway`，指标会在那里存储，直到 Prometheus 来抓取它们。


    ### 不支持原生支持 Prometheus 指标的应用程序


    当应用程序没有在 `/metrics` 端点原生暴露 Prometheus 时间序指标时，你有两个主要选择。


    *   客户端库（Client libraries）

    *   导出器（Exporters）


    如果你拥有该应用程序，可以使用 `client library` 来添加 Prometheus 支持。客户端库实现了所需的时间序指标，并通常通过预期的 `/metrics`
    端点暴露它们。它们存在于大多数语言编写的应用程序中，包括 Python、Java、Go 等许多语言。这种做法被称为 `direct instrumentation`（直接插桩）。


    如果你在使用第三方应用程序，你的开发者将无法使用客户端库对其进行直接插桩。在这种情况下，最佳选择通常是 `exporter`。导出器作为 sidecar 运行在应用程序的
    pod 中，捕获该应用程序的原生指标和日志，将其转换为 Prometheus 时间序格式，并在 `/metrics` 端点上暴露。一个常见的例子是 NGINX
    Web 服务器。NGINX 是一个非常流行的应用程序，但不支持 Prometheus 指标也没有暴露 `/metrics` 端点。然而，存在一个 NGINX
    的 Prometheus 导出器，它与 NGINX 并排运行，捕获其指标，转换为时间序格式并在 `/metrics` 端点暴露。


    ### Prometheus 与告警


    Prometheus 还可以执行告警。这就是它针对某种状态向你的手机弹出或发送消息的地方。


    为了使此功能生效，条件需要持续足够长以便触发告警。告警随后发送到 Prometheus alert manager（告警管理器），由它处理如何以及发送到哪里。可能的操作包括告警旁机、发送电子邮件、发送短信或
    Slack 消息等。


    总而言之，Prometheus 是最流行的云原生监控工具，经常部署在 Kubernetes 环境中。它对 Kubernetes 有内置支持，包括自动发现服务的能力。它期望指标和日志数据以时间序格式在广知的
    `/metrics` 端点暴露，并定期对该端点进行抓取。大多数编程语言都有客户端库，用于为你的内部应用程序添加 Prometheus 支持。这被称为 `direct
    instrumentation`。如果你在使用第三方应用程序且无法使用客户端库进行直接插桩，则可以使用导出器。最后，Prometheus 经常与 Grafana
    配对，以实现顶级的仪表板和可视化。


    ## 成本管理


    有效的成本管理是管理云原生应用和基础设施的关键部分，你应该始终考虑以下三点。


    1.  选择合适的基础设施

    2.  规模合理化（Rightsizing）

    3.  关闭未使用的基础设施


    ### 选择合适的基础设施


    选择正确的云平台是一个至关重要的决定。然而，即使在选择云平台之后，仍有许多对成本和成本管理有高影响的决定。


    例如，大多数云平台提供以下实例类别——`instance` 是云上虚拟服务器的专业术语。


    *   按需（On-demand）

    *   预留（Reserved）

    *   抢占（Spot）


    `On-demand instances`（按需实例）最常见且最灵活，但它们也是最昂贵的。你可以“按需”创建和删除它们，只要你需要，它们一直属于你。


    `Reserved instances`（预留实例）通过长期承诺换取折扣价格。例如，如果你承诺使用 AWS EC2 实例 3 年并预付部分费用，你获得的价格可能比按按需消耗便宜
    50-70%。然而，你必须支付整个协议期间的费用，即使你在中途停止了使用。


    `Spot instances`（抢占实例）通常最便宜，但可以在任何时候被删除。所有大型云平台都持有空闲容量以应对客户需求的激增。为了抵消这些闲置容量的成本，大多数云平台会以大幅折扣（有时低至
    90%）将其作为 `spot instances` 提供。然而，如果云平台需要这些容量，它可以直接删除你的抢占实例。虽然某些云平台会发送容量重平衡信号提醒你抢占实例正在被移除，但无法保证这些信号能及时发送或接收以供你做出反应。


    ### 针对成本的规模合理化


    规模合理化（Rightsizing）是确保你运行的基础设施数量恰好满足需求，它是性能和成本之间的一种微妙平衡。如果你部署了太多基础设施，性能会很好，但你将支付大量费用。如果你部署得太少，你会节省钱，但性能会很差。坦率地说，自动伸缩（autoscaling）可以有所帮助。


    像 Kubernetes 这样的系统可以自动伸缩应用程序和基础设施以满足需求。这意味着你应该始终运行正确的基础设施，而不是为不需要的基础设施付费。


    例如，大多数基于云的 Kubernetes 集群允许你定义带有上限和下限的节点池（node pools）。例子可能是下限为 2 个节点、上限为 10 个节点的节点池。这允许
    Kubernetes 根据需求在 2 到 10 个节点之间伸缩池节点数量。Kubernetes 还可以从外部存储系统上动态配置卷，并在不再需要时释放它们。


    两个重要的自动伸缩配置选项包括。


    *   配置正确的上限和下限

    *   监控正确的指标


