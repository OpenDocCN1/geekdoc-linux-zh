    工作节点（Worker nodes）是用户应用程序运行的地方。


    一个非技术的类比可以是 Amazon。Amazon 基本上是一个网络服务和一个分发服务。网络服务运行所有实现产品目录、搜索、你的购物车和愿望清单等功能的智能——这些是
    Amazon 成为 Amazon 的核心。分发部分是货物如何到达用户手中，有点类似于 Kubernetes 工作节点。


    Kubernetes 控制面节点保持高性能和高可用性至关重要。作为一个简单的例子，将三个控制面节点放置在不同的数据机房或云区域是一项良好的实践。这意味着如果某个区域或数据机房发生停电等情况，并不是所有的控制面节点都会失效。一个糟糕的反例是将三个控制面节点都放在同一个数据中心机架上，且位于漏水的空调单元下方，并连接到同一个网络交换机和同一个电源——如果其中任何一个环节出现故障，三个控制面节点都可能失效。


    通常建议运行 3 或 5 个控制面节点以实现高可用性。


    总结来说，容器用于运行复杂的微服务应用程序，我们需要帮助来管理它们。Kubernetes 是实现此任务的最流行的工具，属于被称为`容器编排器`（container
    orchestrators）的工具类。容器编排器的工作是`部署`和`管理`容器化应用程序。部署包括选择合适的节点来运行容器，而管理包括确保它们具有韧性、在需要时扩展，并且可以容易地更新和回滚。Kubernetes
    集群由控制面节点和工作节点组成。控制面节点实现 Kubernetes 智能，而工作节点是用户应用运行的地方。工作节点依赖容器运行时来启动和停止容器，但 Kubernetes
    做出哪些节点应该运行哪些容器的整体决策。Kubernetes 还做出自愈和扩展等决策。


    ## 容器安全


    有几种与容器特别相关的安全风险。我们将涵盖以下内容。


    * 共享内核

    * 根用户容器（Root containers）

    * 不安全的网络

    * 不可信的代码


    ### 容器与共享内核


    在继续之前，`kernel`（内核）是操作系统核心功能的专业术语。例如，Windows 操作系统的核心是 `Windows NT kernel`，而 Linux
    操作系统的核心是 `Linux kernel`。我们经常使用 `operating system` 和 `kernel` 这两个词来指代同一个东西。


    `命名空间容器`（Namespaced containers）是最流行的容器类型，采用共享内核模型运行。这意味着运行在同一节点上的所有容器共享该节点的内核。例如，运行在同一节点上的
    25 个容器将全部共享该节点的内核。这是容器之所以体积小且启动快的重要原因之一，但这也是一个安全风险。例如，如果节点内核被黑客攻击或破解，该节点上的每个容器也会被攻破。此外，一个被黑客攻破的容器可能会破坏整个节点以及该节点上的所有其他容器。


    这意味着命名空间容器从本质上比虚拟机不安全。


    创建命名空间容器的容器运行时示例 `Docker`、`containerd`、`runC` 和 `CRI-O`。


    `虚拟化容器`（Virtualised containers）和`沙箱容器`（sandboxed containers）是为了解决共享内核问题而创建的。虚拟化容器让每个容器运行在自己的轻级虚拟机中，每个虚拟机都有自己的内核。这解决了共享内核问题，但代价是每个容器变得更大且启动速度更慢。沙箱容器尝试在保护主机内核的同时，不为每个容器提供独立的虚拟机和内核。


    还存在其他技术来保护容器，但通常配置复杂。其中一些包括 `seccomp`、`capability dropping`（能力剥弃）、`SELinux` 和
    `AppArmor`。


    ### 根用户容器


    “Root”是 Linux 系统上权限最大的用户账户。这就是为什么以 `root` 身份运行容器会赋予它们过大的权限，并带来巨大的安全风险。因此，你应该避免在容器内部编写需要以
    root 用户运行的应用程序。


    如果你必须以 root 身份运行容器，应该考虑 `user namespaces`（用户命名空间），这样容器内部的 `root` 用户会自动映射到共享节点上的一个不同用户账户。


    ### 不安全的网络


    我们多次提到，容器运行的微服务应用是高度分布的，并通过网络进行相互通信。这使得网络成为一个潜在的弱点和热门攻击区域。因此，容器之间的通信进行加密至关重要。实现这一点的常用方法是使用服务网格（service
    mesh）。


    你还应该考虑 `Kubernetes Network Policies`（Kubernetes 网络策略）来限制哪些微服务可以与其他微服务进行通信。


    ### 不可信的代码


    容器的演进当时，公云还是一个相对新颖的概念。因此，我们在摸索规律的过程中犯了许多错误。例如，一种流行的习惯是运行所谓的`社区镜像`（community images）容器。这些镜像是由未知且不可信的第三方提供的。考虑以下这个简单的例子：


    你正在领导一个项目，部署一个实现你从未接触过的技术的应用程序。你没有自己去研究技术并构建自己的可信镜像，而是发现别人已经完成了这项困难工作，并向容器仓库上传了一个“可用”的镜像。你决定下载并使用该镜像，因为这将为你节省大量精力。显而见的风险是社区镜像可能包含恶意代码。


    考虑到这个例子，只运行可信的代码至关重要。


    总结来说，云原生安全通常被认为由四个 C 组成：


    * 代码（Code）

    * 容器（Containers）

    * 集群（Clusters）

    * 云端（Cloud）


    我们刚刚说过，你应该始终信任你运行的`code`。这包括了解它的来源，以及它确切包含什么、做了什么。你还应该通过不允许运行 root 容器以及选择合适的容器运行时来确保你的`containers`是安全的。你还应该减轻命名空间容器及其共享内核模型的潜在危险。你还应该确保你的
    Kubernetes 集群拥有最新的安全修复，并通过 `RBAC`（用户账户和访问控制）进行妥善保护。最后，你应该尽所能保护你的数据中心和云基础设施。


    图 3.3 显示了四个 C 以及随着位置向右移动，你通常拥有的控制权越少。


    ![](img/images----figure3-3.png)


    图 3.3


    ## 容器网络


    容器和微服务带来了以下所有网络挑战。


    * 增加的东向流量

    * 服务发现

    * 请求追踪

    * IP 频繁变化（IP churn）

    * 安全


    `东向`（East-west）网络流量是同一应用程序内容器在同一网络上相互通信的术语。另一种流量类型被称为南北向（north-south），是应用程序与外部服务的通信。考虑一个简单的微服务应用示例，它包含一个
    Web 前端服务和一个购物车服务。前端和购物车容器之间的流量是同一网络上的东向流量。前端与外部客户端（例如客户的手机 App）之间的流量是南北向流量，且运行在互联网等不可信网络上。


    微服务架构将复杂的应用程序拆分为许多通过网络相互通信的小应用程序。这极大地增加了东向流量，并要求对流量进行加密。


