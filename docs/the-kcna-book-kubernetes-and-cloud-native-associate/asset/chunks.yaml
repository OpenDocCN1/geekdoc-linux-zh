    *   Cloud


    We’ve just said you should always trust the *code* you run. This includes knowing
    where it came from and exactly what it contains and what it does. You should also
    ensure your *containers* are safe by not allowing root containers to run, and
    choosing the right container runtime. You should also mitigate the potential dangers
    of namespaced containers and their shared kernel model. You should also make sure
    your Kubernetes clusters are up-to-date with security fixes and properly secured
    with RBAC (user accounts and access control). Finally, you should do everything
    in your power to secure your datacenters and cloud infrastructure.


    Figure 3.3 shows the four C’s and how you normally have less and less control
    the further to the right you go.


    ![](resources/images----figure3-3.png)


    Figure 3.3


    ## Container networking


    Containers and microservices bring all of the following networking challenges.


    *   Increased east-west traffic


    *   Service discovery


    *   Tracing requests


    *   IP churn


    *   Security


    *East-west* network traffic is jargon for containers in the same application talking
    to each other on the same networks. The other type of traffic flow is called north-south
    and is applications talking to external services. Consider a simple example of
    a microservices application with a web front-end service and a shopping cart service.
    Traffic between the front-end and the shopping cart containers is east-west traffic
    on the same network. The traffic between the front-end and external client, such
    as a customer’s mobile phone app, is north-south and over untrusted networks such
    as the internet.


    Microservices architectures split complex applications into lots of small applications
    that all talk to each other over the network. This massively increases east-west
    traffic and requires traffic to be encrypted.'
