- fmt: '

    For example, the individual microservices of an application can all run on different
    servers and virtual machines. This means they need to communicate over the network,
    increasing network complexity as well as introducing security risks. It also becomes
    vital for the development teams of different microservices to communicate with
    each other and be aware of the overall app. That all said, the benefits of the
    microservices architecture far outweigh the challenges it brings.


    In quick summary, `microservices` is the architecture pattern where you split
    application features into their own small, single-purpose apps. `Cloud native`
    is a set of features and behaviors. The `features` including self-healing, autoscaling,
    zero-downtime updates and more. The `behaviors` include agile development, and
    frequent predictable releases.


    ## Chapter summary


    In this chapter, you learned that we used to deploy one application per physical
    server. This was wasteful of capital, servers, and environmental resources. It
    also caused long delays in application rollouts while new servers had to be procured,
    delivered, and installed. VMware came along and let us run multiple applications
    per physical server. It reduced capital expenditure and allowed more efficient
    use of server and environmental resources. It also allowed us to ship applications
    a lot faster by deploying them to virtual machines on servers we already owned.


    Containers are also a form of virtualisation. They virtualise at the operating
    system layer and each container is a virtual operating system. Containers are
    faster and more efficient than virtual machines, however, out-of-the-box they’re
    usually less secure. The advantages of containers made it possible for us to re-think
    the way we develop, deploy, and manage applications.


    A major innovation, enabled by containers, is the microservices design pattern
    where large complex applications are broken up and each application feature is
    developed and deployed as its own small, single-purpose, application called a
    microservice. This architecture enables cloud native features such as, self-healing,
    scaling, regular and repeatable rollouts, and more.


    All of this can be backed by cloud and cloud-like infrastructure that can scale
    on-demand.


    Today, we live in a world where applications and infrastructure can self-heal,
    and individual application features (microservices) can automatically scale and
    be updated without impacting any other application features.


    ## Exam essentials


    This chapter doesn’t map directly to an exam domain. However, the following exam
    topics were mentioned and will be covered in more detail later in the book.


    ### Container runtimes


    A server that runs containers is called a `container host`. They use a low-level
    tool called a `container runtime` to start and stop containers. Docker is the
    best-known container runtime and was the first container runtime supported by
    Kubernetes. However, it is being replaced in Kubernetes by a lighter-weight version
    called `containerd` (pronounced “container dee”). Many other container runtimes
    exist and some of them work differently. Some offer better performance at the
    expense of security, whereas others offer better security at the expense of size
    and performance. You’ll learn more later in the book.


    ### Container security


    All containers running on a single host share the host’s OS kernel. This makes
    them small, portable, and fast to start. However, if the host’s kernel is compromised,
    all containers running on that host are also compromised. There are many container
    runtimes available, and not all work the same. For example, the `Docker` and `containerd`
    runtimes implement the shared kernel model making them lightweight and fast but
    susceptible to shared kernel attacks. Whereas `gVisor` implements a more secure
    model. You’ll learn more later in the book.


    ### Container networking


    Microservices architectures implement application features as small standalone
    services called microservices. The different microservices making up an app have
    to use the network to communicate and share data. This increases the number of
    network entities, increases the complexity of networking in general, and increases
    network traffic. Communicating and sharing data across the network is also slower
    than communicating and sharing on the same server.


    ### Autoscaling


    Microservices architectures allow individual application microservices to scale
    independently. For example, platforms like Kubernetes can automatically scale
    up the reporting microservice of an application at month-end and year-end when
    they’re busier than normal. Again, you’ll learn more later in the book.


    ## Recap questions


    See Appendix A for answers. Page 157 in the paperback edition.


    **1.** Which of the following are advantages of containers compared to virtual
    machines? Choose all correct answers.


    * 1. Smaller size

    * 2. Faster start times

    * 3. More secure out-of-the-box

    * 4. More apps per physical server


    **2.** Which of the following is an advantage of virtual machines compared to
    containers?


    * 1. Virtual machines start faster than containers

    * 2. Virtual machines are more secure out-of-the-box

    * 3. Virtual machines are smaller than containers

    * 4. Virtual machines enable microservices design patterns


    **3.** Which layer does container virtualisation work at?


    * 1. The hardware layer

    * 2. The infrastructure layer

    * 3. The application layer

    * 4. The operating system layer


    **4.** Which of the following are components of a container? Choose all correct
    answers.


    * 1. Virtual process tree

    * 2. Virtual CPUs

    * 3. Virtual hard disks

    * 4. Virtual filesystems


    **5.** Which of the following is true?


    * 1. You can normally run more containers than virtual machines on a server

    * 2. You can normally run more VMs than containers on a server


    **6.** Why are containers potentially less secure than VMs?


    * 1. Container networking is always in plain text

    * 2. Container images are always available on the public internet

    * 3. You cannot encrypt container filesystems

    * 4. All containers on a host share the same OS kernel


    **7.** Which of the following are part of a container image? Choose all correct
    answers.


    * 1. Application code

    * 2. Application dependencies

    * 3. Application snapshots

    * 4. A dedicated operating system


    **8.** Which of the following best describes a monolithic application?


    * 1. An application that only runs on on-premises datacenters

    * 2. An application with all features coded in a single binary

    * 3. An application that implements cloud native features such as autoscaling
    and rolling updates

    * 4. An application with very small container images


    **9.** Which of the following are disadvantages of monolithic applications? Choose
    all correct answers.


    * 1. Every feature has to communicate over the network

    * 2. Updates are high risk and complex

    * 3. You cannot scale individual application features

    * 4. You cannot deploy them to the public cloud


    **10.** Which of the following are advantages of microservices applications? Choose
    all correct answers.


    * 1. Each microservice can have its own small agile development team

    * 2. Each microservice can have its own dedicated OS kernel

    * 3. Each microservice can be scaled independently

    * 4. Each microservice can be patched independently


    **11.** Which of the following are potential disadvantages of microservices applications?
    Choose all correct answers.


    * 1. Container images can be very small

    * 2. They cannot run on public clouds

    * 3. Increased networking complexity

    * 4. Increased network traffic


    # 2: Cloud native architecture


    In this chapter, you’ll learn everything needed to pass the `Cloud Native Architecture`
    section of the exam. These topics account for 16% of the exam and provide a foundation
    for the topics covered in later chapters.


