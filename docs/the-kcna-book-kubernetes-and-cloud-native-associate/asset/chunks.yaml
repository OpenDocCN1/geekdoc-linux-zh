    # 5: Cloud native application delivery


    This chapter covers the topics in the Cloud native application delivery section
    of the exam. The topics account for 8% of the overall exam.


    The chapter is divided as follows:

    * Primer

    * CI/CD

    * GitOps

    * Exam summary

    * Exam essentials

    * Recap questions


    ## Primer


    Cloud native application delivery is often referred to as `code to cloud` and
    `code to production`, and we usually automate it with continuous integration (CI)
    and continuous delivery (CD) pipelines as well as GitOps tools. We’ll talk more
    about all of this later in the chapter, but for now you should know the major
    automation steps.


    1. Build code

    2. Test code

    3. Release code


    Automating these steps enables fast, frequent, and high-quality releases.


    Finally, `release` is jargon for rolling out a new version of an application or
    an environment. For example, updating an application from version 1.1 to version
    1.2 is accomplished via a `release`. We often use the terms `rollout`, `update`,
    and `release` to mean the same thing.


    ## CI/CD


    CI/CD is an acronym for continuous integration, continuous delivery. It’s a set
    of tools and processes that automates the building, testing, and provisioning
    of software. It enables frequent reliable releases and is an integral part of
    the wider DevOps movement.


    As the acronym suggests, CI/CD is two separate processes:

    * Continuous Integration (CI)

    * Continuous Delivery (CD)


    CI automates the process of building and testing software changes. It usually
    involves developers frequently merging code to a central repository where it’s
    built and subjected to extensive tests. The building and testing must be fully
    automated and are highly effective at identifying issues before they’re released
    into live environments. The whole process is automated and ensures only high-quality
    code is passed to the CD process.


    CD automates the later process of releasing that high-quality code into live environments
    such as dev, test, and production. It’s often triggered after a build successfully
    passes CI testing.


    The overall CI/CD process is referred to as a `pipeline` as it resembles the operation
    of a pipe – you put something into one end of the pipe and don’t touch it again
    until it pops out the other end. The automated nature of CI/CD processes means
    once a developer uploads a change to a repository, the entire process is automated
    until the built and tested artefact pops out the other end.


    Automation of these steps makes all the following possible:

    * Faster software delivery

    * More frequent software delivery

    * Fewer bugs

    * More productive developers


    Automation always makes things faster and more repeatable. This is why automated
    CI/CD pipelines allow developers to test and deploy software faster and more frequently.
    The fact that testing is automated and mandatory means fewer bugs will make it
    through to live production environments. Also, the fact that developers aren’t
    involved in the building and testing (they put code into the pipeline and the
    system does the rest) means they can spend more time being productive building
    new apps and features.


    You might sometimes see CD split into two slightly different things:

    * Continuous delivery

    * Continuous deployment


    `Continuous delivery` requires human approval before deploying to production,
    whereas `continuous deployment` automates everything, including deploying to production.


    It’s normally considered good CI/CD practice to build, test, and release as frequently
    as possible. Doing this tests the pipeline, keeps developers and management comfortable
    with the process, keeps changes and updates small and potentially less impactful,
    and speeds up the delivery of features and fixes. The opposite would be saving
    up lots of changes and implementing them once or twice per year as big jobs. This
    is higher risk and delays the release of features and fixes.


    Popular CI/CD tools include:

    * Jenkins

    * CircleCI

    * GitLab CI

    * Travis CI


    In summary, CI/CD is about automating the entire process of application building
    and testing, all the way through to deployment in production environments. A special
    set of tools are used to implement CI/CD pipelines and enable frequent and reliable
    software releases. CI automates building and testing, and uploads the fully tested
    code to a repository. CD takes the completed code and deploys it to environments
    such as dev, test, and prod.


    ## GitOps


    The idea of GitOps became popular in 2017. At a high-level, it takes the battle-tested
    DevOps practices we’ve been using for years in software development and brings
    them to the world of infrastructure and Kubernetes. If you’ve just read the section
    on CI/CD, GitOps builds on these by adding version control and pull requests.

