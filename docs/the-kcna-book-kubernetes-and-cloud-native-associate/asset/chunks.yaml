    API. The deployments object is a stable v1 object in the *apps* named group. CSIStorageCapacity
    is a beta object in the storage.k8s.io named group.


    ```

    $ kubectl api-resources

    NAME                   APIVERSION               NAMESPACED   KIND

    deployments            apps/v1                  true         Deployment

    csistoragecapacities   storage.k8s.io/v1beta1   true         CSIStorageCapacity

    <Snip>

    ```


    Kubernetes has a deprecation policy that guarantees all stable objects will be
    supported for at least 12 months, or two releases (whichever is longer), after
    deprecation.


    At the time of writing, a new Kubernetes version is released every 4 months, resulting
    in three releases per year. For example, v1.21, v1.22, and v1.23 were all released
    in 2021\.


    The *API server* exposes the API over a RESTful HTTPS endpoint. All requests to
    the API server are subject to authentication (authN) and authorisation (authZ).


    ### API and API server quiz


    **1.** Where are Kubernetes objects defined?


    *   1.  The cluster store


    *   2.  The API


    *   3.  Individual controllers


    *   4.  The Kubernetes GitHub repo


    **2.** Which Kubernetes API group are workload objects, such as deployments and
    statefulsets, defined?


    *   1.  apps


    *   2.  core


    *   3.  workloads


    **3.** Which of the following are other ways to refer to a v1 API object? Choose
    two.


    *   1.  Stable


    *   2.  Beta


    *   3.  GA


    *   4.  Live


    **4.** How long does Kubernetes guarantee stable objects will be supported for?


    *   1.  At least one month following deprecation


    *   2.  At least 6 months following deprecation


    *   3.  At least 12 months following deprecation


    *   4.  At least 18 months following deprecation


    **Answers.** 1:B, 2:A, 3:A,C, 4:C.


    ## Kubernetes networking


    In this section we’ll cover the following network-related topics:


    *   Kubernetes services


    *   The pod network


    *   Service registration and discovery


    ### Kubernetes services


    You already know that pods are typically deployed via higher-level controllers
    like the deployment controller and the statefulset controller. These implement
    cloud native features such as self-healing, autoscaling, rollouts, and rollbacks.


    These features make individual pods extremely unreliable. Consider the following
    examples.


    Every time a node or pod fails, the missing pod is replaced with a new pod with
    a new IP address. If a client was connecting directly to the failed pod, future
    connections will time-out and won’t re-establish to the new pod. Scale-up events
    add new pods with new IP addresses, whereas scale-down events remove pods. Again,
    clients connected to a pod that is removed as part of a scale-down operation will
    lose their connection. Finally, rolling out a new version of an app removes all
    existing pods and replaces them new ones with new IP addresses.


    All of this makes pods unreliable and other apps should never connect directly
    to pods.


    To resolve this issue, Kubernetes provides a *service* object that sits in front
    of pods and provides them with reliable networking. For example, you define a
    service object and tell it to redirect traffic to all pods with a particular label.
    The service gets a stable name and IP address that Kubernetes guarantees will
    never change. Clients connect to the service, and the service redirects the traffic
    to the pods. The service is also intelligent enough to know when pods are added
    or removed, so it guarantees to always load-balance the traffic to the latest
    set of running pods.


    Figure 4.5 shows a service called *kcna-svc* with an IP address of 10.0.0.10\.
    The name and IP are stable, and clients should connect to these instead of directly
    to pods. All connections hitting the service are redirected to a healthy pod with
    the `project=kcna-book` label. The service makes sure it always knows when pods
    are added and removed from the network.


    ![](resources/images----figure4-5.png)


    Figure 4.5


    ### The pod network


    Every Kubernetes cluster implements a network called the *pod network* that all
    pods run on. It’s a large, flat, open network, meaning all pods can communicate
    with all other pods. This makes deployment easy but is a major security risk.
    As a result, you should implement Kubernetes network policies to control pod-to-pod
    communication.


    Behind the scenes, it’s actually a network plugin that implements the pod network.
    Kubernetes uses the *Container Network Interface (CNI)* to expose a pluggable
    network layer, and 3rd parties create CRI plugins that actually implement the
    pod network. This has resulted in a lot of innovation and a strong Kubernetes
    networking ecosystem. Some of the more well-known CRI plugins include:


    *   Cilium


    *   Canal


    *   Flannel


    *   Weave


    Cilium is open-source, based on eBPF, and it’s currently the most popular CRI
    plugin for Kubernetes.


    ### Service registration and discovery


    Kubernetes also implements native service registration and service discovery based
    on DNS. *Service registration* is the act of registering the name and IP of new
    services with DNS, whereas *service discovery* is the act of using a service name
    to learn its IP address.


    > **Clarification.** When saying “the name and IP of new services gets registered
    with DNS” we mean the name and IP address of *Kubernetes service objects* that
    sit in front of pods. These were explained in an earlier section.


    Kubernetes service discovery operates on two core principles:


    1.  All new services are automatically registered with DNS


    2.  All pods and containers are automatically configured to use DNS for discovery


    To make this work, every Kubernetes cluster runs an internal DNS service called
    the *cluster DNS.* This runs as a Kubernetes-native application that watches the
    API server for new service objects. When it sees one, it automatically registers
    its name and IP in the cluster DNS. This means services don’t need to implement
    any logic to register themselves – the cluster DNS is always watching the cluster
    and registers all services automatically.


    Also, every container on Kubernetes is automatically configured to use the cluster
    DNS when it needs to discover new services. This means apps running in containers
    don’t need to implement any special logic to find other services – the containers
    they’re running in do all of that automatically.


    ### Kubernetes networking quiz


    **1.** Which Kubernetes object provides stable networking for pods?


    *   1.  LoadBalancer


    *   2.  Ingress


    *   3.  Service


    *   4.  The pod network


    **2.** How is the Kubernetes pod network implemented?'
