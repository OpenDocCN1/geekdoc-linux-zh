    The `Container Runtime Interface (CRI)` is a low-level technology implemented
    by Kubernetes to make the container runtime layer pluggable. It enables cluster
    admins and cluster operators to choose the right container runtime for their applications
    and environment.


    ### containerd


    `containerd` (pronounced “container dee”) is the default container runtime on
    most modern Kubernetes clusters. It’s a stripped-down version of Docker with only
    the bits that Kubernetes needs. The code for `containerd` was donated to the CNCF
    by Docker, Inc. It’s a graduated CNCF project and stable container runtime.


    ### Namespaces


    `Namespaces` let you split a Kubernetes cluster into multiple virtual clusters
    called “namespaces”. Each namespace gets its own set of user accounts and resource
    quotas, and they’re a good way to share a cluster among different teams or departments
    in the same organisation. However, they’re not a secure workload boundary, so
    you shouldn’t use them to isolate production environments from test or dev. You
    also shouldn’t use them to divide a cluster between competing clients. This is
    because compromised containers in one namespace can easily impact containers in
    other namespaces.


    ### Pod network


    Every Kubernetes cluster implements a special network called the `pod network`.
    This is the network all pods and containers are deployed to, and it’s always implemented
    by a 3rd party network plugin. Lots of plugins exist, and they all plugin via
    the Container Network Interface (CNI). Every Kubernetes cluster has exactly one
    pod network.


    ### CNI


    The `Container Network Interface (CNI)` is a low-level technology that allows
    3rd-parties to build the pod network with advanced technologies and features.
    For example, some CNI plugins implement dual stack IPv4 and IPv6 networking, whereas
    others might only implement IPv4.


