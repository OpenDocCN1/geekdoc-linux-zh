- fmt: '

    In the world of cloud native microservices applications you should loosely couple
    services and store data outside of the app so that when individual microservices
    fail and change, the overall application keeps functioning. A simple example might
    be microservice A talking to microservice B via network abstraction, such as a
    shared DNS name, and all state being stored in an external data store. This way,
    if any instance of microservice B goes down, you can reach other instances via
    the same DNS name and they can access the same state from the external store.


    A tightly coupled version would be microservice A communicating directly with
    instance 1 of microservice B that stores state locally. When instance 1 of microservice
    B fails, the state is lost and none of the other instances can take over.


    ## Self-healing


    Another important feature of resilient applications and infrastructure is the
    ability to recover without human intervention – the system just heals itself.


    Three concepts are key to the way this works:


    - Desired state

    - Observed state

    - Reconciliation


    Desired state is what you want. Observed state is what you have. Reconciliation
    is the process of keeping observed state in sync with desired state.


    Consider the following example. You tell `Kubernetes` you want 5 web server pods
    running version 2.2 of your software. That’s your desired state. `Kubernetes`
    implements it and sets up a watch loop to observe things. At this point, desired
    state is 5 pods running version 2.2 and observed state is 5 pods running version
    2.2. However, if something breaks and you lose a pod, observed state will drop
    to 4 pods but desired state will still be 5. `Kubernetes` reconciles the situation
    by starting a new 5th pod running version 2.2 so that observed state is brought
    back into sync with desired state. This process is called `reconciliation` and
    is key to self-healing without human intervention.


    ## Health checks


    One final thing on resiliency is health-checks and probes. These are an extra
    layer of checks that often include `application intelligence` – this is jargon
    for a set of checks that test your application is working as expected.


    For example, the previous section on desired state and reconciliation has no `application
    intelligence`. It only makes sure there are 5 pods with version 2.2 of your software
    running. It does nothing to make sure the application inside each pod is working
    properly.


    A simple non-technical example might be a quick visual check that you have milk
    in the fridge. Your desired state might be a single carton of red-top milk in
    the fridge. A quick visual check proves you have that. However, it does nothing
    to check if the milk is fresh or how much is in the carton. In this scenario,
    an `application health-check` might pick up the carton, check the date, and may
    be do a “sniff test” ;-) The point is… while the quick visual check might make
    sure observed state matches desired state (you want one carton of milk and you
    have one carton of milk) it does nothing to check the milk is good.


    In the cloud native world, health-checks are usually specialised requests that
    test whether your application is working as expected. Sometimes we call them “probes”
    as they `probe` your applications.


    Many web-based applications expose a dedicated health-check endpoint such as `/healthz`.
    For example, if the app is reachable at `knca-app.kubernetes.local` it would expose
    `kcna-app.kubernetes.local/healthz`. Sending requests to this causes the app to
    return data you use to determine app health. An example URL might be `myapp.k8s.local/healthz`.


    In summary, loose coupling enables more fluid environments where things can break
    and be replaced without impacting the overall app and user experience. Systems
    like `Kubernetes` constantly observe their environment to ensure what they observe
    (observed state) is what you requested (desired state). If observed state doesn’t
    match desired state, a process of `reconciliation` fixes the issue. Health checks
    and probes add an additional layer of checks that test whether applications are
    working as expected.


    ## Autoscaling


    Autoscaling is the ability of applications and infrastructure to automatically
    grow and shrink to meet demand.


    Three things are vital for autoscaling to be truly cloud native:


    - Applications and infrastructure need to be able to scale

    - Scaling has to be automatic

    - Scaling has to be up and down


    `Kubernetes` has the ability to scale applications up and down based on current
    workload. It can use simple metrics, such as CPU and memory consumption, or it
    can use application-specific metrics such as queue size and request response times.


    A simple example might be the reporting microservice of an application. If business
    units are running end-of-year reports and the reporting microservice is experiencing
    a 10x increase in demand, `Kubernetes` can spin-up additional reporting containers
    to meet demand. When demand decreases, `Kubernetes` can terminate the additional
    containers. If the application is running on a public cloud, `Kubernetes` can
    also scale-up the infrastructure to help support the additional containers. A
    common example is `Kubernetes` adding more nodes to the node pool.


    Let’s take a closer look at the example.


    Assume your business application is running on 5 nodes (cloud instances/virtual
    machines) and the reporting microservice is running on two containers. Multiple
    business units kick-off their year-end reports and load on the reporting system
    goes through the roof. `Kubernetes` observes this increased load and deploys 3
    more reporting containers to handle the load. However, your 5 nodes are maxed
    out and don’t have the capacity to run the 3 additional containers. No problem,
    `Kubernetes` talks to your cloud and spins up an additional node to run the 3
    new containers. Reports run quickly and on time, and when demand on the reporting
    microservice decreases, `Kubernetes` terminates the additional 3 reporting containers
    as well as the additional node.


    It’s important to understand a few things from the example:


    The scaling up and scaling down was automatic. This is possible because `Kubernetes`
    is constantly observing key performance metrics for your applications. When it
    sees things, such as increased load or longer response times, it scales the application
    and infrastructure to cope. It also scales things down when demand drops. The
    latter is important in controlling costs, especially in public environments where
    you pay for what you use.


    Microservices architectures are vital to this behavior as they allow `Kubernetes`
    to only scale microservices that need it.


    Finally, the type of scaling described so far is referred to as `horizontal scaling`.
    At a high level, horizontal scaling is adding more instances of something you
    already have. The opposite is `vertical scaling` which attempts to increase the
    size of what you already have. The following non-technical example might help.


    Assume you run a business that provides delivery services and you currently have
    one small delivery vehicle. As the business grows you also need to grow your capability
    to make more deliveries. You can horizontally scale your delivery capability by
    adding 2 more small delivery vehicles. Alternatively, you can vertically scale
    by selling your small delivery vehicle and replacing it with a single larger vehicle.


    Switching back to the end-of-year reporting analogy. If one small reporting container
    cannot handle year-end demand, you can horizontally scale it by adding more of
    the same small containers. Alternatively, you can vertically scale by replacing
    the small reporting container with a single larger one. The same can be done for
    the infrastructure supporting it – you can horizontally scale by adding multiple
    small nodes, or vertically scale by adding a single huge node.


    Generally speaking, `Kubernetes` and cloud native patterns prefer horizontal scaling.


    `Kubernetes` has the following autoscalers.

    '
