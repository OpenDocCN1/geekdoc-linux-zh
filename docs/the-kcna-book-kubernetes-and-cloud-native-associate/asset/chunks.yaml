    # 水平 Pod 扩缩器 (HPA)

    # 集群自动扩缩器 (CA)


    水平 Pod 扩缩器在需求增加时添加更多 `pods`，需求减少时移除它们。集群自动扩缩器与你的公有云集成，并根据需求添加或移除 `nodes`。


    对于这两种自动扩缩器，配置上限和下限至关重要。例如，你可以配置 `Kubernetes` 将一个节点池限制为最多 20 个节点。这可以帮助你控制成本，并降低失控进程或恶意攻击导致节点池过大的风险。请记住，在云端
    `nodes` 是需要花钱的。


    总之，应用程序和基础设施应该能够根据指标自动扩展。微服务架构使得选择性地扩展应用程序中需要的部分成为可能。`Kubernetes` 有一个水平 Pod 扩缩器，可以扩展应用程序微服务以满足需求。它还有一个集群自动扩缩器，可以扩展云基础设施以满足需求。


    最后，重要的是要理解扩展是一个不断在性能与成本之间寻求平衡的过程——在提供良好用户体验的同时，避免消耗和支付过多的基础设施。


    ## 无服务器 (Serverless)


    从高层次来说，无服务器是一种事件驱动的计算模型，你编写短小的函数，这些函数在事件触发它们时执行。这里有很多术语，我们稍后会解释，不过在进入细节之前，我们需要解决几点问题。


    1. `serverless`（无服务器）和 `Function as a Service (FaaS)` 指的是同一事物

    2. 无服务器使用了服务器


    第 2 点提出了显而易见的问题：如果无服务器使用了服务器，为什么我们还称之为无服务器呢？


    答案很简单，服务器被隐藏得非常好，以至于我们**永远**不需要考虑它们。这样想……在云计算出现之前，我们花费了大量的时间和精力处理服务器。我们必须购买它们、上架并堆叠、支付维护合同，甚至在它们故障或变得太旧、太慢时更换它们。云的出现带走了**大部分**的服务器工作。最后，无服务器的出现带走了**所有**服务器工作。因此，在无服务器模型中，开发者可以完全专注于编写代码，而无服务器平台则负责
    care 所有的计算和存储需求。


    ### 无服务器是事件驱动的


    事件驱动元素是无服务器模型的核心。考虑以下无服务器工作流。


    1. 开发者编写代码

    2. 代码被封装为容器镜像

    3. 代码被上传到无服务器平台

    4. 代码与某个事件关联

    5. 事件发生，代码运行


    在这种模型中，代码被上传到无服务器平台，在关联的事件发生之前永远不会执行。如果事件从未发生，代码就永远不会运行。如果事件频繁发生，代码就会运行频繁。这对于全托管云平台具有财务上的影响，因为你只在代码运行时才付费。运行频繁的代码会比运行较少的代码花费更多费用。此外，尽管许多无服务器平台宣称的价格看似很低，但执行频繁的代码可能会花费大量资金。


    列表中的另外几点。


    大多数现代编程语言都适用于无服务器，然而，你应该根据微服务设计模式来设计和编写无服务器函数——即小小的、专门的、执行单一定义任务的函数。


    将无服务器函数封装为容器也很常见，因为它们很小、轻量级，且与微服务架构完美契合。然而，并非所有无服务器平台都支持容器。


    ### 无服务器平台


    许多公有云提供自己的专有无服务器平台。这些平台通常易于使用，并采用灵活的按需付费定价模型。然而，它们通常是专有的，并且缺乏治理和标准。流行的云端无服务器平台包括：


    * `AWS Lambda`

    * `AWS Fargate`

    * `Azure Functions`

    * `Google Cloud Functions`


    支持 `Kubernetes` 的流行开源无服务器平台包括：


    * `Knative`（读音为“kay native”）

    * `OpenFaaS`（读音为“open faz”）


    写作时，无服务器生态系统缺乏强有治理和标准。然而，`CloudEvents` 项目旨在解决这一问题。它目前是一个孵化中的 `CNCF` 项目。


    ### 无服务器与扩缩


    扩展是大多数无服务器平台不可或缺的一部分——平台会启动执行你的函数所需的容器和基础设施，并在完成后自动释放它们。如果一个函数在每分钟内执行了一百万次，平台就会启动所需的容器和基础设施并向你发送账单。在你的函数完成时，它也会释放它们。因此，扩展只是无服务器工作方式的一部分。


    总之，无服务器通常被称为`函数即服务 (FaaS)`，是一种事件驱动的计算模型，你将小函数上传到无服务器平台并将其与事件关联。当这些事件发生时，函数就会执行。在后台，许多无服务器平台在短寿命容器内部执行函数。扩展是无服务器的原生特性，许多云都有自己的专有无服务器平台，采用按需付费的定价模型——你只需为函数的每次每次执行付费。然而，专有的无服务器平台缺乏开放标准，并增加了你的被锁定风险。


    最后，当无服务器首次进入市场时，有许多推测认为它可能会成为现代应用程序的主流模型。然而，热度已经消退，现在很清楚的是，无服务器将与容器和虚拟机共同塑造云计算的未来。


    ## 社区与治理


    大多数云原生技术（包括 `Kubernetes`）都是开源的。这使得它们能够接触一个大型且充满激情的社区来开发和支持它们。然而，需要强有力的治理来提供方向和秩序。


    为了满足这一需求，`云原生基金会 (CNCF)` 于 2015 年成立。它定义了项目在走向“毕业”的过程中必须经过的三个成熟阶段。这些阶段是：


    1. `Sandbox`（沙箱）

    2. `Incubating`（孵化中）

    3. `Graduated`（已毕业）


    这个三步流程有助于项目成熟，并最终作为能够为社区带来价值的项目项目毕业。`Kubernetes` 是第一个 `CNCF` 项目，并于 2018 年毕业。此后，已有
    15 多个其他项目毕业，有 100 多个项目处于沙箱或孵化阶段。


    项目如果想通过这些阶段，必须向 `CNCF 技术监督委员会 (TOC)` 证明它们的成熟度。每个阶段都有自己一套的要求，但以下是毕业要求的示例：


    * 证明项目正被真实用户使用

    * 有来自至少两个组织的人员贡献项目

    * 完成独立的第三方安全审计并发布结果

    * 获得核心基础设施最佳实践徽章


    还有其他标准，但这些展示了 `CNCF` 提供的治理类型——一切都在推动项目向成熟和良好实践发展。然而，`CNCF` 的治理尽可能轻量化和少干预，以便项目学会自我治理。


    ## 角色与画像


    云原生不仅关乎你使用的技术。它还关乎创建合作文化和合适的工作环境。这很大程度上取决于拥有获得高级管理层完全支持的正确角色和职位名称。


    以下是你在现实世界中常见的云原生工作角色和画像。你将在考试中接受这些内容的测试。


    ### 云架构师 (Cloud Architect)


    '
- fmt: '

    A major responsibility of a Cloud Architect is choosing the right cloud platforms
    for the business and individual applications. This can include a mix of public
    clouds, private clouds, and hybrid clouds.


    The cloud architect is also responsible for designing infrastructure and applications
    to be cloud native – resilient, scalable, observable, automated etc.


    An awareness of costs and the differences between capital expenditures (`capex`)
    and operational expenditures (`opex`) is vital for this role.


    Public cloud is usually an `ope` cost where you rent infrastructure on a pay-as-you-go
    basis. On-premises and private clouds are usually `capex` costs where you pay
    large amounts up-front to procure and own infrastructure.


    ### DevOps Engineer


    As the word suggests, “DevOps” engineers have a mix of developer and operational
    skills. This means some experience with programming languages as well as some
    experience with operational tools such as monitoring, logging, and deployment.
    It’s common for a DevOps engineer to be 80% developer and 20% operator.


    As well as this, the following things are expected of a DevOps Engineer:


    1. Understand the entire application and application lifecycle

    2. Be skilled with the right tools

    3. Possess a willing mindset that’s not afraid of change or failure


    DevOps tools include continuous integration, continuous development (`CI/CD`),
    and GitOps tools that automate application development, testing, and deployment.
    A DevOps mindset means not being afraid to try new things and not being afraid
    to fail.


    A major reason the DevOps role was created was to break down the barriers that
    often exist between development teams and operations teams – quite often they
    battled against each other which wasn’t good for the business or customers. This
    is why the best DevOps Engineers have experience in both disciplines and are willing
    to see both perspectives.


    DevOps Engineers must also be confident enough to push teams and organisations
    toward a cloud native culture where change is the new normal.


    ### CloudOps Engineer


    This is a more recent role and is similar to DevOps but has a slightly narrower
    focus on cloud infrastructure and tools. CloudOps Engineers may focus entirely
    on public cloud technologies, whereas DevOps Engineers need wider skills that
    manage on-premises infrastructure and apps.


    ### Security Engineer


    A Security Engineer must understand cloud native infrastructure and applications,
    as well as the specific threat vectors that apply. These threats can be very different
    from traditional monolithic applications running solely on on-premises datacenters.


    A simple example is the increased reliance microservices applications have on
    sharing data over IP networks. In the past, monolithic applications implemented
    all features and functionality in a single binary that was deployed as a single
    large application on a single physical or virtual server. This meant all internal
    application communication was over secure local channels on the physical server.
    The microservices model breaks every application feature into its own small app
    and distributes them across multiple servers. This means all internal application
    communication now has to traverse IP networks and introduces totally new threat
    vectors.


    Another simple example is the shared kernel model most container platforms implement.
    This is where every container shares the OS kernel of the host it’s running on.
    If the host is compromised, so is every container running on that host. This introduces
    an entirely different set of threats to the virtual machine model where there
    is no shared kernel.


    From a culture perspective, Security Engineers must embed themselves within other
    teams to ensure security is a priority at every step of application and infrastructure
    design, development, and deployment. They must ensure that security is always
    on the agenda and never an afterthought.


    ### DevSecOps Engineer


    A DevSecOps Engineer is a DevOps Engineer with security skills and a security-first
    mindset.


    Many people consider this to be the same as a DevOps Engineer, as many organisations
    now expect their DevOps engineers to understand the importance of security, possess
    security skills, and possess a security-first mindset. This role is often considered
    one of the best ways of ensuring security is part of every discussion and part
    of every step of design, development, and deployment.


    You may hear the term security `left-shift`. This is moving security to the very
    start of the development process (all the way to the left of the workflow). DevSecOps
    engineers can make that happen.


    ### Data Engineer


    Data is the lifeblood of many organisations – if you lose it or it gets corrupted,
    the entire organisation might go out of business.


    The role of the Data Engineer is to ensure data is stored and protected appropriately,
    and making sure it’s always available when needed. This includes data locality
    (storing it in the right places), performance, availability, and protection. It
    also involves knowledge and experience with tools to analyze data.


    ### Full Stack Developer


    A Full Stack Developer is a multi-skilled developer that understands, and can
    code, the front-end (client-side) and back-end (server-side) components of a system.
    They need hands-on experience with multiple programming languages as well as infrastructure
    components such as cloud platforms and data stores.


    A typical Full Stack Developer will be proficient in at least two programming
    languages, have skills with at least one cloud platform and its tools, and have
    experience with at least one data store or database technology. These back-end
    data store technologies are usually open-source.


    Full Stack Developers are expected to be highly productive as they can make fast
    decisions and “just get stuff done” thanks to their broad skillset. A full stack
    developer is almost always faster and more agile than having to pull an entire
    team together – the Full Stack Developer gets the job done herself.


    ### Site Reliability Engineer (SRE)


    The main role of a Site Reliability Engineer (`SRE) is to create, maintain, and
    optimise cloud native systems. It’s sometimes considered DevOps Engineer 2.0,
    but usually has more of an operational focus than a DevOps engineer. For example,
    a typical SRE might be 20% developer, 80% operations.


    Like DevOps Engineers, SREs have a mindset of continual change and optimisation.
    However, it goes beyond simple DevOps engineering by focussing on key site reliability
    metrics such as Service Level Objectives (`SLO`), error budgets, Service Level
    Indicators (`SLI`), and Service Level Agreements (`SLA`).


    It’s often said that the goal of an SRE is to automate themselves out of a job.


    ## Open standards


    Open standards are a big deal in cloud native. They help users avoid vendor lock-in
    and product lock-in, and they give developers confidence the products they build
    will work and integrate well with the wider ecosystem.


    A common non-technical example is trains and train tracks. The majority of train
    tracks across the world are the same size and configuration (1,435 mm standard
    gauge). This means service providers can buy trains from one supplier today and
    switch to another tomorrow with full confidence the trains from both suppliers
    will work on the same tracks. It also gives train manufacturers confidence the
    trains they build will work on tracks all over the world. The net result is confidence,
    and confidence enables progress.


    The Open Containers Initiative (`OCI`) provides the following important standards
    in the cloud native ecosystem.


    * `Image spec`


    * `Runtime spec`


    * `Distribution spec`

