- fmt: '

    At a high level, containers are more lightweight than virtual machines. This means
    the same server can run more containers than virtual machines. As they’re both
    technologies for running applications, containers let you run more applications
    on your servers. For example, a server that can run 10 virtual machines might
    be able to run 50 containers. This enables huge cost savings for organisations
    – you need less infrastructure to run your apps. Being lightweight also means
    containers start faster than virtual machines and are easier to package and share.


    ## Container workflow


    The following list shows the common steps involved in creating and running an
    application as a container.


    1. A developer writes an application

    2. The application is packaged as a `container image`

    3. The container image is uploaded and shared in a registry

    4. A server downloads the image

    5. The server runs the image as a container


    Let’s look a little closer.


    Developers write applications in their favourite languages – there’s no need to
    learn new languages for containers.


    The application, and all dependencies, are packaged into a container image that
    we normally just call an `image`. As the app `and its dependencies` are packaged
    in the same image, you shouldn’t have situations where an application works on
    a developer’s laptop but doesn’t work in production. This used to happen because
    production systems and developer laptops were running different versions of dependencies.
    Containers fix this problem by bundling the app `and all dependencies` in the
    same container image.


    It’s normal practice to host container images in a centralised registry so they’re
    accessible from different environments (dev, test, production, etc.) and can be
    securely shared with different teams. Many container registries exist. Some are
    designed to run inside your firewall on your own private network, whereas others
    exist on the public internet. `Docker Hub` was the first major container registry
    and is available on the internet. However, like all registries, it’s divided into
    repositories that you can hide and restrict access to.


    Once an image is shared to a registry it can be downloaded to a server and ran
    as a container. You can restrict who can access and download your images, and
    the servers that run them can be physical servers, virtual machines, and even
    cloud instances.


    When an image is executing we call it a `container`. This means a container is
    a running instance of an image. If you’ve worked with VMware, it might be useful
    to think of images as being like VM templates, and containers as being like running
    VMs. However, remember that images and containers are smaller and more lightweight
    than VM templates and VMs.


    Servers that run containers need a special piece of software called a `container
    runtime`. A later section is dedicated to learning about these.


    ## Containers and microservices


    Containers were vital in shaping microservices architectures.


    As mentioned in previous chapters, microservices applications are made of lots
    of small independent services that work together to form a useful application.


    Each microservice is normally responsible for a single feature and packaged as
    its own container image. For example, a microservices application with front-end
    functionality, middleware functionality, and back-end functionality might be divided
    into the following three microservices/container images.


    * Front-end

    * Middleware

    * Back-end


    In this example, the front-end service is developed by a dedicated team, packaged
    as its own container image, and deployed independently of the other two microservices.
    The same is true for the other two. If demand on the front-end increases, you
    can scale it up by adding more front-end containers. If demand drops, you can
    scale back down by terminating the additional containers.


    This demonstrates the relationship between microservices and containers. It also
    shows how each microservice can be scaled independently by simply adding more
    copies of that microservice’s container.


    ## Container architecture


    Containers are sometimes referred to as `virtual operating systems`. Let’s compare
    them to virtual machines to make this clear.


    Hypervisor virtualisation, such as VMware, virtualises hardware. This means it
    takes physical servers and slices them into virtual servers that we call `virtual
    machines (VM)`. For example, CPUs are sliced into virtual CPUs, storage is sliced
    into virtual storage, and network cards are sliced into virtual network cards.
    These virtual resources are combined into VMs that look, smell, and feel like
    regular physical servers. You then install a single OS and application in each
    VM.


    Container virtualisation, such as Docker, virtualises operating systems (OS).
    This means it takes operating systems like Linux and Windows and slices them into
    virtual operating systems called `containers`. For example, process trees are
    sliced into virtual process trees, filesystems are sliced into virtual filesystems,
    and network interfaces are sliced into virtual interfaces. These virtual resources
    are combined into containers that look, smell, and feel like regular operating
    systems. You then run a single application in each container.


    To recap, hypervisor virtualisation slices physical servers into virtual machines
    that look, smell, and feel like physical servers. Container virtualisation slices
    operating systems into containers that look, smell, and feel like a regular OS.
