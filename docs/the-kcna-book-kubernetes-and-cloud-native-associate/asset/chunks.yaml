- fmt: '

    Congratulations. You’ve finished the practice exam. If you’ve completed the book
    and score more than 75% on this practice exam you should be ready to take your
    KCNA exam.


    To score 75% or more you need to have answered 45 or more questions correctly.


    # Appendix A: Chapter quiz answers


    This appendix lists the answers to all the in-chapter quizzes. See Appendix B
    for the answers to the Sample Test.


    ## Chapter 1: Setting the scene


    Question 1, answers A, B, D


    Answer C is **not** correct because containers are **less secure** than virtual
    machines. This is due to the shared kernel model.


    Question 2, answer B


    Every virtual machine has its own kernel and is therefore more secure than a container.
    However, this makes them bigger, slower to start, and not a good fit for microservices
    architectures.


    Question 3, answer D


    Each container is a virtual operating system with its own root filesystem, its
    own process tree, and its own `eth0` network interface.


    Question 4, answers A, D


    Containers virtualise operating system constructs such as process trees and filesystems.
    They do not virtualise hardware constructs such as CPUs and hard drives.


    Question 5, answer A


    Containers all share the OS and kernel of the host they’re running on. This makes
    them smaller than virtual machines and means you can run more containers on a
    host than virtual machines.


    Question 6, answer D


    Containers share the hosts kernel meaning a single compromised container can potentially
    compromise all other containers. A compromised host kernel also compromises all
    containers on the host.


    Question 7, answers A, B


    A container image comprises application source code and all dependencies.


    Question 8, answer B


    Monolithic applications code all features into a single program.


    Question 9, answers B, C


    Monolithic applications code all features into a single program. This means updating
    one feature requires the entire application to be taken down and updated. It also
    means every feature of the application scales with every other feature – everything
    is very tightly coupled.


    Question 10, answers A, C, D


    Microservices applications have every application feature coded as its own small,
    independent, single-purpose microservice. They’re all loosely coupled. This means
    every feature can have its own small dev team and can be scaled and patched without
    impacting other features.


    Question 11, answers C, D


    The distributed nature of lots of small loosely-coupled microservices means there’s
    a lot more network traffic and that traffic is more dynamic.


    ## Chapter 2: Cloud native architecture


    Question 1, answer B


    Resiliency is the ability for applications and infrastructure to self-heal.


    Question 2, answer C


    Applications and infrastructure can both be resilient. Kubernetes implements controllers,
    such as the deployment controller, to make applications resilient. Many cloud
    platforms allow you to build node pools that are resilient.


    Question 3, answer A


    Things fail all the time. Designing with failure in mind allows applications to
    continue working when things fail.


    Question 4, answer C


    Loose coupling means different components aren’t reliant on each other and can
    be less impacted when other components fail.


    Question 5, answer D


    Reconciliation is the process of synchronising observed state with desired state.


    Question 6, answer A


    `/healthz` is a common endpoint for application health checks and probes.


    Question 7, answer D


    Health checks are a good way to test whether an application is functioning as
    expected.


    Question 8, answer A


    Desired state is a record if intent – what you want.


    Question 9, answers B, C, D


    Autoscaling is the ability for applications and infrastructure to scale up and
    down without human intervention.


    Question 10, answer A


    Cloud infrastructure costs money to run. If you run infrastructure you’re not
    using you’ll still be paying for it.


    Question 11, answer C


    Individual microservices of an application can be scaled up and down without impacting
    other microservices. “A” is not an advantage of microservices because monolithic
    applications can also scale up and down.


    Question 12, answer A


    Horizontal scaling adds and removes instances of something you already have. For
    example, the Kubernetes horizontal pod autoscaler adds or removes more instances
    of a pod. The Kubernetes cluster autoscaler adds or removes more instances of
    a particular node type.


    Question 13, answer B


    Cloud native apps prefer horizontal scaling, sometimes referred to as scaling
    out.


    Question 14, answers A, D


    Kubernetes implements a horizontal pod autoscaler (HPA) for scaling applications,
    and a cluster autoscaler (CA) for scaling cluster nodes.


    Question 15, answers B, C


    Serverless is an event-driven computing model that still uses servers. The servers
    are so abstracted and hidden from the developer that we call it “serverless”.


    Question 16, answer D


    Many serverless platforms let you upload functions packaged as container images.


    Question 17, answer A


    Serverless functions are small, single-purpose workloads that follow microservices
    design patterns.


    Question 18, answers A, C


    Containers are small and ideal for microservices applications, making them ideal
    for serverless workloads.


    Question 19, answer A


    Many serverless platforms charge you each time a serverless function executes.


    Question 20, answer B


    CloudEvents is attempting to bring standards to the serverless ecosystem.


    Question 21, answer C


    Serverless functions automatically start when an associated event occurs, and
    they exit when they complete. This is a native form of scaling.


    Question 22, answer B


    Serverless workloads run small functions when an event triggers them. It’s commonly
    called Function as a Service (FaaS).


    Question 23, answer D


    The CNCF was founded under the umbrella of the Linux Foundation in 2015 to bring
    governance and direction to a new breed of open-source container-related technologies.
    The Foundation was founded in 2000.


    Question 24, answers A, B, D


    Projects enter the CNCF as “sandbox” projects, progress through the “incubating”
    stage, and eventually graduate.


    Question 25, answers A, B, C


    CNCF projects don’t have to have financial backing from at least two vendors.


    Question 26, answers A, C


    Most cloud platforms operate a pay-as-you-use model that most organisations classify
    as operational expenditure (opex).


    Question 27, answers C, D


    DevOps engineers are expected to understand the entire applications and their
    entire lifecycles. They’re also expected to have some experience as a developer
    and operator. Typically, the developer/operator split is somewhere along the lines
    of 80/20.


    Question 28, answer D


    CloudOps is very similar to DevOps but focusses almost entirely on cloud-only
    technologies and skills. For example, a DevOps engineer may have skills with one
    or two open-source key-value store technologies (NoSQL) that can be used on premises
    or in the cloud, whereas a CloudOps engineer might have skills with a particular
    cloud’s key-value store technology.


    Question 29, answer A


    Continuous integration, continuous delivery (CI/CD) tools are core DevOps tools.


    Question 30, answer C


    Full stack developers are go-getters with a lot of skills that just get done.


    Question 31, answer A


    It’s commonly said that SREs should automate themselves out of a job.


    Question 32, answers B, C


    Open standards in the cloud native world are like standardised rail tracks in
    the manufacturing and engineering world – they enable interoperable solutions
    that help avoid lock-in and give developer’s confidence the solutions they build
    will work well and integrate well.


    Question 33, answers A, B, C


    The Open Containers Initiative (OCI) is responsible for low-level container-related
    standards and currently maintains the image-spec, runtime-spec, and distribution-spec.


    Question 34, answers A, B, C, D

    '
