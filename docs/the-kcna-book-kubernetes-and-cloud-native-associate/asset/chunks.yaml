    # 6: Cloud native observability

    This chapter covers the topics required to pass the cloud native observability
    section of the exam and accounts for 8% of your exam grade.


    The chapter is divided as follows.

    * Primer

    * Telemetry and observability

    * Prometheus

    * Cost management

    * Chapter summary

    * Exam essentials

    * Recap questions


    ## Primer

    Cloud native applications are deployed as lots of small moving parts that connect
    over the network and are frequently updated and replaced. This makes it more important
    than ever to be able to see how applications are connected and have the ability
    to track requests as they traverse the various distributed microservices of an
    application.


    To assist with this, every microservice needs to output high-quality telemetry
    in the form of metrics and log data. You then need the right tools to collect
    the telemetry, aggregate it, and analyse it for troubleshooting and making adjustments.
    The process is a feedback loop that looks like Figure 6.1 – observe > analyse
    > adjust.


    ![](resources/images----figure6-1.png)


    Figure 6.1


    Even though we’ve been doing things like this for years with traditional monolithic
    apps, all of the following are either new or far more important with cloud native
    apps.

    * Tracing requests

    * Application-specific metrics

    * Network latency

    * Scaling decisions

    * The volume of logs and metrics

    * Collating and analysing


    ## Telemetry and observability

    *Telemetry* is jargon for logs, metrics, and traces. This is observed by remote
    monitoring platforms that use it to learn how systems work, diagnose problems,
    and measure performance. A highly observable system is one that generates high-quality
    telemetry.


    Consider the following quick example. You have an in-house cloud native application
    comprising lots of microservices. You also have a centralised monitoring platform.
    Each microservice outputs telemetry that is collected, stored, and analysed.


    As mentioned already, cloud native telemetry comes in three major flavours that
    we sometimes call signal types, verticals, or classes.

    * Logs

    * Metrics

    * Traces


    Each serves a different purpose, but collectively they provide detailed insights
    that can be vital in understanding, troubleshooting, and optimising microservices.


    The OpenTelemetry project is an incubating CNCF project that aims to standardise
    the way we collect telemetry and export it to centralised systems for analysis.
    The project consists of specifications and instrumentation. *Instrumentation*
    is jargon for coding telemetry into applications.


    Finally, the sheer volume of telemetry emitted by cloud native apps can resemble
    a firehose and be overwhelming. This is because every microservice generates its
    own telemetry, resulting in cloud native apps generating 10x or even 100x the
    amount of telemetry as traditional apps. This has driven the development of a
    new generation of cloud native monitoring and monitoring-related tools. These
    include Prometheus, Fluentd, Grafana, Jaeger, and more.


    ### Log data

    Log data is usually application-related events that are great for debugging problems
    and one of the first places you should check when something goes wrong.


    Each event, such as a dropped connection or a service restart, generates a log
    entry that is timestamped and often formatted as JSON for better organising and
    querying. They’re also categorised according to severity levels such as info,
    warning, error, and critical. *Debug* is another level that is usually the most
    verbose, often including all the data from all other levels.


    Many applications write logs to the standard out (stdout) and standard error (stderr)
    streams. However, some applications write logs to arbitrary locations.


    > **Jargon.** Very old computer systems had three standard streams relating to
    input and output channels. The standard in (stdin) handled input coming from a
    keyboard, standard out (stdout) handled output going to the screen, and standard
    error (stderr) allowed error information to be streamed independent of output
    to the screen. Linux continues to implement these streams, and it’s common practice
    for log data to be sent to `stdout` and `stderr`. This architecture still exists
    in containers running on Kubernetes.

