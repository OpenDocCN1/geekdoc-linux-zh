    virtual machines (VM). Each VM looks, smells, and feels like a physical server,
    meaning each one has virtual CPUs, virtual memory, virtual hard drives, and virtual
    network cards. You install an operating system (OS) on each one and then install
    one app per VM. If a single physical server is sliced into 10 virtual machines,
    there will be 10 operating systems and you can install 10 apps.


    Container virtualisation slices operating systems into virtual operating systems
    called *containers*. Each container looks, smells, and feels like a normal OS.
    This means each container has its own process tree, root filesystem, eth0 interface
    and more. You then run one app per container, meaning if a single server and OS
    is sliced into 50 containers, you can run 50 apps.


    That’s the view from 40K feet.


    ### Containers vs VMs


    Containers and virtual machines are both virtual constructs for running applications.
    However, containers have several important advantages.


    One advantage is that containers are a lot more lightweight and efficient than
    virtual machines. This means businesses using containers can run even more apps
    on the same number of physical servers.


    As an example, an organisation with 10 physical servers might be able to run 100
    virtual machines and apps. However, if the same organisation chose containers
    instead of virtual machines, they might be able to run 500 containers and apps.
    One of the reasons is that every VM needs its own dedicated operating system (OS).
    This means a single physical server sliced in to 10 VMs requires 10 installations
    of Windows or Linux (other operating systems exist). Each OS consumes CPU, memory
    and disk space that can’t be used for apps. In the container model every container
    shares the OS of the host it’s running on. This means there’s only one OS consuming
    CPU, memory, and disk space, resulting in more resources being available to run
    applications.


    Containers are also faster to deploy and start than VMs. This is also because
    every VM contains an OS and an application. Operating systems can be large, making
    them bigger and bulkier to package. It also means that starting a VM bootstraps
    a full OS before the app can start. This can be time consuming.


    To recap, when packaging an application as a container, you only package the application
    and dependencies. You do not package a full OS. This makes container images smaller
    and easier to share. It also makes them faster to start – you only start the app.


    The following might help if the above is a little unclear.


    Application developers write applications as they always have. The application
    and dependencies are then packaged into a container image. *Dependencies* are
    things like shared library files. Once the container image is created, you can
    host it in a shared repository where it can be accessed by the required systems
    and teams. A container host, which is just a server running a container runtime
    such as Docker, grabs a copy of the image and starts a container from it. The
    container host has a single copy of Windows or Linux that is already up and running,
    and the container runtime on the host quickly creates a container and executes
    the app that’s inside the image.


    The smaller packaging used by the container model enables other benefits such
    as microservices, automated pipelines and more. We’ll cover all of these later
    in the book.


    Before moving on, it’s important to acknowledge an advantage VMs have over containers.


    The fact that every VM requires a dedicated OS is a disadvantage when it comes
    to packaging and application start times. However, it can be an advantage when
    it comes to security. As a quick example, if the shared OS on a container host
    gets compromised, every container is also compromised. This is because every container
    shares the OS kernel of the container host. In the VM model, every VM has its
    own OS kernel, this means compromising one kernel has no impact on other VMs.


    Despite this security challenge, containers are generally considered the best
    solution for modern business applications.


    So far, we’ve focussed mainly on physical infrastructure, such as servers, and
