  trans: '


    在 Kubernetes 环境中，每个节点上的 `kubelet` 都会监控每个容器的 `stdout` 和 `stderr` 流，并让 `kubectl
    logs` 命令可以使用日志消息。它还会保留每个容器最近终止的实例的日志，以防你需要回溯这些日志。未写入容器的 `stdout` 和 `stderr` 的日志无法通过
    `kubectl logs` 查看。


    每个节点上的 `kubelet` 留存日志的缺点是，如果节点故障，所有日志消息都将丢失。这就是为什么将日志存储在集中位置被认为是更好的实践，在那里，日志数据的生命周期与容器及其运行的节点生命周期分离。Kubernetes
    将这种架构称为`集群级日志`（cluster-level logging），并提供了以下选项：


    * 节点级日志代理

    * 带有日志代理的 Sidecar


    `节点级日志代理` 在每个节点上安装一个代理，从 `kubelet` 收集所有容器日志并将其发送到中心位置。通常的做法是使用 Kubernetes 的 `DaemonSet`
    在每个节点上部署和管理该代理。


    日志 `sidecar` 是一个与应用程序容器运行在同一个 Pod 中的辅助容器。它捕获应用程序容器的日志，并将其流式传输到自己的 `stdout` 和 `stderr`，或者直接转发到中心位置。


    考虑以下示例。你有一个应用程序，它将日志数据写入容器文件系统中的自定义位置。这意味着本地 `kubelet` 无法访问这些日志。然而，应用程序提供了一个 sidecar
    容器，它知道日志写在何处，并将其转发到自己的 `stdout` 和 `stderr` 流。这样做允许节点上的 `kubelet` 从 sidecar 捕获这些日志，并将其提供给节点级代理，该代理可以将其转发进行聚合。它还让
    `kubectl logs` 命令可以使用这些日志。这是一个简单的解决方案，应用程序不需要更改写入日志的位置——sidecar 知道该位置并将它们放在 Kubernetes
    期望的地方。


    日志 sidecar 也可以直接将日志转发到中心位置。这样做会绕过 `kubelet`，并意味着你将无法通过 `kubectl logs` 查看它们。这是因为
    `kubectl logs` 是与本地 `kubelet` 协作，而将日志直接发送到中心位置会跳过 `kubelet`。


    `应用级日志`（Application-level logging）是另一种模式，它按所需的格式直接将日志推送到中心存储器。这同样跳过了 `kubelet`，并要求应用程序配置中心存储器的位置。这在云原生应用中是一种反模式，因为将特定于环境的配置编码到应用程序中通常不是良好的做法。


    如前所述，只要日志发送到 `stdout` 或 `stderr`，`kubectl logs` 命令就会返回运行中容器的日志。它还可以返回容器最近终止的实例的日志。如果一个
    Pod 包含多个容器，你必须使用 `-c` 标志指定容器名称。如果 Pod 只有一个容器，可以省略 `-c` 标志。


    以下命令从名为“kcna”的 Pod 中获取唯一容器的日志。


    ```

    kubectl logs kcna

    ```


    如果 Pod 失败或终止，可以使用 `-p` 或 `--previous` 标志。以下示例获取在已终止的 `kcna` Pod 中运行的 `ctr1` 容器的日志。


    ```

    kubectl logs -p -c ctr1 kcna

    ```


    ### 指标 (Metrics)


    指标是在一段时间内收集和衡量的性能相关值。每个指标都有时间戳、一个名称，并可以带有标签（labels）以帮助分组和查询。它们是查看历史趋势和预测未来变化的极佳方式。


    指标的示例包括 CPU 利用率、队列长度、请求数、错误率等。例如，如果请求数在过去 6 个月中平均每分钟 150 次，突然飙升到 10,000 次，你就知道发生了变化，系统可能需要做出反应。同样，如果系统部署以来丢弃连接平均每分钟少于
    2 个，但突然跳到 5,000 个，你就知道出问题了。


    CPU 利用率和内存占用等通用系统指标被认为是基础的，缺乏任何应用智能。自定义应用程序指标通常更有用。示例包括队列长度、响应时间、每秒请求数等。关键点在于，它们是特定于应用程序的因此在判断应用程序性能以及是否需要启动扩缩操作方面好得多。


    说到扩缩。云原生微服务应用通常会自动扩缩以满足需求。然而，自动扩缩的决策取决于所观测指标的质量。因此，不仅监控正确的指标至关重要，你还需要能够快速分析它们以做出扩缩决策。考虑以下这个简单的示例。


    你有一个具有 3 个微服务的云原生应用，并配置了自动扩缩来监控内存使用情况。请求流经所有三个微服务，你突然遇到响应时间变慢。你查看监控仪表板，发现内存使用在可接受范围内。然而，其中一个微服务的队列大小异常大。在与应用程序开发者讨论时，你意识到内存使用不是应用程序性能的良好指标，因此不是用于扩缩的良好指标。你通过增加一个额外的实例解决了眼下的问题，但你决定实现监控队列性能的自定义指标，这样当这种情况再次发生时，系统就有正确的指标来做出自动扩缩决策。


    网络相关的指标（如延迟）也比以往任何时候都重要，因为越来越多的请求依赖于网络。


    ### 追踪 (Tracing)


    追踪是一个技术术语，用于跟踪请求在通过分布式系统不同组件时的端到端旅程。


    单个请求可以被追踪，每个追踪都会报告如哪些系统组件处理了请求、哪些事件以及每个事件处理的时间。在理解分布式微服务环境中的流量和潜在瓶颈方面，它们比以往任何时候都更重要。例如，以前可能命中单个服务器并在本地处理的请求，现在在微服务之间传递时可能会命中多个服务器并多次穿越网络。考虑到这一点，能够观测每个请求的端到端旅程至关重要，这样你才有全景。


    Jaeger 是用于存储和分析追踪数据的流行工具。


    总之，有效的观测性需要高质量的遥测数据。日志数据由应用程序创建，是出现问题时的良好查找点。指标是查看历史趋势和发现趋势变化的极佳方式。追踪对于理解分布式微服务应用中的请求流至关重要。OpenTelemetry
    项目正试图简单地让应用程序具备高质量的遥测数据。


    ## Prometheus


    Prometheus 被认为是 Kubernetes 和云原生环境的`行业标准`监控工具。它由 SoundCloud 在 2012 年创建，当时他们发现现有监控工具无法满足他们的需求。它在
    2016 年作为开源项目捐赠给 CNCF，并在 2018 年底成为第二个毕业于 CNCF 项目。


    一种常见的模式是在 Kubernetes 上运行云原生应用，使用 Prometheus 进行监控和告警，并使用 Grafana 进行仪表板和可视化。


    ### Prometheus 如何工作


    '
- fmt: '

    At a high level, every microservice should generate high-quality telemetry in
    the form of logs and metrics. Prometheus collects these and stores them where
    they can be queried and analysed to help with troubleshooting and optimisation.
    It can also feed into Grafana for high-quality dashboards and visualisations.


    ## Digging a little deeper…


    Prometheus expects applications to expose metrics via the `/metrics` HTTP endpoint.
    That’s jargon for a web address that ends in `/metrics`. For example, if a microservice
    is reachable at `store.myapp.k8s.local` it should expose Prometheus metrics on
    `store.myapp.k8s.local/metrics`. Prometheus periodically connects to this endpoint
    to `scrape` the metrics and store them. Scraping is jargon for “collecting” the
    metrics. This is a `pull` model where the application is only responsible for
    making the metrics available and it’s the responsibility of Prometheus to do the
    hard work of scraping them. The frequency at which Prometheus scrapes metrics
    is called the `scrape interval`.


    Once Prometheus has the metrics, it stores them in a timeseries database. Events
    are stored in plain text and each event is stored on its own line in the database.
    `Timeseries` means each event has a timestamp. In fact, each Prometheus metric
    has a name, a timestamp, and various labels. This makes them very easy to group,
    query, and analyse. On the topic of queries, Prometheus has its own powerful query
    language called `PromQL`. You may also hear the Prometheus data model referred
    to as `multi-dimensional`. This means metrics can be grouped, queried, and organised
    on name, timestamp, and labels.


    Prometheus provides basic dashboards but is usually coupled with Grafana for more
    powerful visualisations.


    Some applications, such as short-lived batch jobs, don’t work well with pull models
    where scraping is done at regular intervals. A simple example is a short-lived
    batch job that might exit before Prometheus scrapes its metrics. In these scenarios,
    you can configure the application to `push` metrics to the Prometheus `pushgateway`
    where they’re stored until Prometheus comes along and scrapes them.


    ### Applications that don’t natively support Prometheus metrics


    You have two main options when an application doesn’t natively expose Prometheus
    timeseries metrics on the `/metrics` endpoint.


    *   Client libraries

    *   Exporters


    If you own the application, you can use a `client library` to add Prometheus support.
    Client libraries implement the required timeseries metrics and usually expose
    them via the expected `/metrics` endpoint. They exist for applications written
    in most languages, including Python, Java, Go and a lot more. Doing this is called
    `direct instrumentation`.


    If you’re using 3rd-party application, your developers won’t be able to directly
    instrument them with client libraries. In this scenario, the best option is usually
    an `exporter`. The exporter runs as a sidecar in the application pod, captures
    that application’s native metrics and logs, converts them to Prometheus timeseries
    format, and exposes them on a `/metrics` endpoint. A common example is the NGINX
    web server. NGINX is an extremely popular application but doesn’t support Prometheus
    metrics and doesn’t expose a `/metrics` endpoint. However, a Prometheus exporter
    for NGINX exists that sits alongside NGINX, captures its metrics, converts them
    into timeseries format, and exposes them on a `/metrics` endpoint.


    ### Prometheus and alerting


    Prometheus can also do alerting. This is where it pings your phone or sends a
    message about a condition.


    For this to work, a condition needs to persist long enough for an alert to be
    triggered. The alert is then sent to the Prometheus alert manager which deals
    with how and where to send it. Possible actions include alerting a pager, sending
    an email, sending SMS or Slack messages, and more.


    In summary, Prometheus is the most popular cloud native monitoring tool and is
    frequently deployed in Kubernetes environments. It has built-in support for Kubernetes,
    including the ability to automatically discover services. It expects metrics and
    log data to be exposed in timeseries format on the well-known `/metrics` endpoint
    that it scrapes at regular intervals. Client libraries are available in most programming
    languages to add Prometheus support to your in-house applications. This is called
    `direct instrumentation.` You can use exporters if you’re using 3rd-party applications
    and can’t directly instrument them with client libraries. Finally, Prometheus
    is often paired with Grafana for best-of-breed dashboards and visualisations.


    ## Cost management


    Effective cost management is a key part of managing cloud native apps and infrastructure,
    and you should always consider the following three things.


    1.  Choosing the right infrastructure

    2.  Rightsizing

    3.  Turning unused infrastructure off


    ### Choosing the right infrastructure


    Choosing the right cloud platform is a vital decision. However, even after you’ve
    chosen your cloud, there are still a lot of decisions that have a high impact
    on costs and cost management.


    For example, most clouds offer the following instance categories – `instance`
    is the technical term for a virtual server on a cloud.


    *   On-demand

    *   Reserved

    *   Spot


    `On-demand instances` are the most common and most flexible, however, they’re
    the most expensive. You can create and delete them “on demand” and they’re yours
    for as long as you need them.


    `Reserved instances` come at a discounted price in exchange for a long-term commitment.
    For example, if you commit to a use an AWS EC2 instance for 3 years, and pay part
    of the cost upfront, you may get it up to 50-70% cheaper than if you consume it
    as an on-demand instance. However, you’re tied into paying for the duration of
    the agreement, even if you stop needing it part way through.


    `Spot instances` are usually the cheapest but can be deleted at any point. All
    of the big clouds carry spare capacity to cope with surges in customer demand.
    To offset the cost of this capacity sitting idle, most clouds offer it as `spot
    instances` at significant discount (sometimes to 90% discount). However, if the
    cloud needs that capacity, it can simply delete your spot instances. And while
    some clouds send capacity rebalancing signals to alert you when spot instances
    are being removed, there’s no guarantee they’ll be sent or received in time for
    you to react.


    ### Rightsizing for cost


    Rightsizing is making sure you’re running the right amount of infrastructure to
    meet requirements and is a delicate balance between performance and cost. If you
    provision too much infrastructure, performance will be great but you’ll be paying
    much. If you provision too little, you’ll save money but performance will be poor.
    Frankly, autoscaling can help.


    Systems like Kubernetes can automatically scale applications and infrastructure
    up and down to meet demand. This means you should always be running the right
    amount of infrastructure and not paying for infrastructure you don’t need.


    For example. Most cloud-based Kubernetes clusters allow you to define-node pools
    with upper and lower limits. An example might be a node pool with a low limit
    of 2 nodes and high limit of 10 nodes. This allows Kubernetes to scale the number
    of pool nodes anywhere between 2 and 10 based on demand. Kubernetes can also dynamically
    provision volumes on external storage systems and then release them when they’re
    no longer needed.


    Two important autoscaling configuration options include.


    *   Configuring the right upper and lower limits

    *   Watching the right metrics

