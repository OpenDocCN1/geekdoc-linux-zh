    当你购买考试后，你将收到来自 `The Linux Foundation Training`（邮箱 `<noreply@mail.linuxfoundation.org>`）的确认邮件。邮件标题为“Order
    Confirmation”（订单确认），其中包含一个按钮会将你带到 Linux Foundation 门户，你可以在那里完成以下所有操作：


    *   同意全球候选人协议（Global Candidate Agreement）

    *   验证您的姓名

    *   安排考试日期

    *   检查您的系统要求

    *   阅读候选人手册和其他重要说明


    我强烈建议你尽快完成所有考前要求，这样你就能为考试做好准备，而必在在考试当天完成大量的行政性工作。


    在安排考试时，你将看到一个日历视图，你可以如图 7.1 所示选择可用的日期和时间。


    ![](img/images----figure7-1.png)


    图 7.1


    一旦预约成功，考试将显示在你 Linux Foundation 门户的仪表板中，如果需要，你可以在那里重新安排。


    你应该练习在计划用于考试的机器上登录 Linux Foundation 门户，并运行内置的系统检查程序以确保你的机器（包括视频和音频）符合要求。在检查系统要求时，你可能需要在音频测试期间说话以证明你的麦克风工作正常。


    考试将通过专用的安全浏览器进行，该浏览器无法在移动设备上运行。这可能包括 iPad Pro 等设备，因此你应该务必检查这一点，并准备另一台机器，以防安全浏览器无法工作。


    ## 参加考试


    考试当天最重要的事情是提前准备好一切，并尽情享受其中。不要压力太大，放松并享受这个时刻。


    考虑到这一点，你应该在考试当天之前完成所有考前准备，这样你就可以在当天放松心情，而不必担心完成长长的待办列表。


    参加考试的高级流程如下。我包含了一些建议步骤，以确保你的考试体验尽可能顺畅：


    *   确保你已准备好有效的身份证明文件

    *   考试前一晚睡个好觉

    *   在考试前至少一小时空出你的日程

    *   根据考试要求准备房间

    *   选择你的座位并确保其符合考试要求

    *   在开始考试前确保你已进食并进行了任何如休息，以便在考试期间感到舒适

    *   在透明容器中准备好清澈的饮料，以防你在考试期间需要饮水

    *   重启你将用于考试的机器

    *   关闭任何可能干扰或消耗网络带宽的必要后台进程

    *   确保家中没有人通过网络流媒体或玩游戏

    *   登录你的 Linux Foundation 门户并点击 `Take Exam`（考试）按钮（你可以在正式开始时间前 15 分钟开始）


    当你点击 `Take Exam` 按钮时，你将下载考试的安全浏览器。然后你需要使用摄像头拍摄几张周围环境的静态照片和视频，并将它们上传到系统。这可能需要大约
    10 分钟，在此期间你应该放松，因为考试时你需要保持冷静和放松。


    随后你将被分配一名监考（监控你考试的人），他们将通过浏览器中的实时聊天功能与你交流。这是基于文本的聊天，而不是音频。监将在授权你开始考试之前会检查你上传的照片和视频。如果你的任何照片或视频不符合要求，你可以重新拍摄新的并上传。


    一旦监考对你的身份证明和环境满意，他们将授权你开始考试。


    考试期间请注意你的屏幕分辨率，特别是当使用小型显示器时。我在 12 英寸的 MacBook 上参加考试，没有意识到某些答案选项在屏幕底部之外，我必须滚动屏幕才能看到它们。这在大多数屏幕上不是问题，但请注意大多数问题有
    4 个可能的答案，因此务必检查是否有位于屏幕底部且你看不见的答案。


    如果你对任何问题的答案不确定，可以将其标记为待评审。然后你可以继续做其他问题，并在最后重新查看这些标记为待评审的题目。显然，你必须在时间结束前提交所有答案，包括标记为待评审的答案。


    一旦你完成考试，监考将回到实时聊天并授权你离开。然后你将收到一份简短的调查需要完成。


    ## 获取结果


    尽管这是一场在线多选题考试，但评分过程花费整个 24 小时是正常的。一旦结果出炉，你将收到一封邮件并可以在 Linux Foundation 门户中查看。希望你获得及格分数并为此此庆祝。


    ## 保持联系


    我非常期待你参加 KCNA 考试，并希望听到你的考试体验和结果。


    我还会根据你可能提供的任何提示和建议更新这本书。


    通过邮件 `kcnabook@nigelpoulton.com` 与我联系。


    # 8: 示例测试


    本章包含一个示例测试。问题的格式与真实的考试题相似，但它们不是真实的考试题。在网上或书籍中发布真实的考试题违反了考试规则，这也是我绝不会做的事。我有兴趣帮助你获得真正的技能和真正的资历——我没有兴趣帮助任何人作弊通过考试。


    我建议采取以下措施以从此示例考试中获得最大的收益。


    *   准备笔和纸来记录你的答案

    *   在开始前在纸上写下数字 1-60

    *   在纸上写下每个答案

    *   为自己计时（90 分钟）


    题目的数量与考试中每个主题的权重相匹配。例如，“Kubernetes 基础”领域占考试的 46%，因此本测试中有 46% 的问题关于 `Kubernetes
    fundamentals`。


    问题的答案位于第 175 页（在质书中），并包含了解释。


    祝你好运，练习愉快。


    1. 以下哪些概念在设计和构建自愈能力系统时是重要的？选择所有正确答案。


    1. 期望状态 (Desired state)

    2. 调解 (Reconciliation)

    3. 迭代 (Iteration)

    4. 观测状态 (Observed state)


    2. 你正在一个运行 `containerd` 容器运行时环境中部署新应用程序，并被要求尽可能安全容器。以下哪些技术可能有帮助？选择两个正确答案。


    1. Seccomp

    2. SSL

    3. 权限下降 (Capability dropping)

    4. 安全 Shell (Secure Shell)


    3. Kubernetes 使用什么作为默认和首选的服务发现方法？


    1. 环境变量

    2. 键值对

    3. DNS

    4. IPv6


    4. 你准备部署一个新的 Kubernetes 集群。以下哪一点对于控制面很重要？选择两个答案。


    1. 它在本地运行

    2. 它是高用的

    3. 你运行至少两个控制面节点

    4. 它是高性能


    5. 你需要确保 Kubernetes 集群能够动态添加节点以应对性能峰值。你正在云端运行并知道它支持 Kubernetes 节点池。你需要配置哪种 Kubernetes
    技术以便节点池可以伸缩？


    1. 水平节点自动伸缩器 (horizontal node autoscaler)

    2. 水平 pod 自动伸缩器 (horizontal pod autoscaler)

    3. 集群自动伸缩器 (cluster autoscaler)

    4. 垂直自动伸缩器 (vertical autoscaler)


    6. 你需要部署一个用于存储和分析跟踪数据的工具。你刚刚被告知该技术也已从 CNCF 毕业。你应该部署哪一个？


    1. Rook

    2. Linkerd

    3. Jaeger

    4. Envoy'
