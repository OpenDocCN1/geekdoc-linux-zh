  trans: "\n从高层层面来说，你通过存储在 Git 仓库中的配置文件来描述基础设施的期望状态。每当你对环境进行更改时，你都会从 Git 中检出文件，用你的更改更新它们，并提交一个拉取请求（PR）将更改合并到仓库。一旦\
    \ PR 被合并，将更改部署到生产环境的过程就会启动。\n\n尽管有很多 GitOps 工具，如 `Argo`、`Flux` 和 `Jenkins X`，但\
    \ GitOps 实际上是工具、工作流和实践的集合。这些包括：\n\n*   基础设施即代码 (IaC)\n*   拉取请求与合并\n*   持续交付\n\
    *   对手动更改零容忍\n\n让我们详细查看每一项。\n\n## 基础设施即代码 (IaC)\n\nIaC 是在声明式配置文件中定义基础设施的实践。这意味着，你不再使用\
    \ GUI 和脚本来部署虚拟机、网络和策略等内容，而是通过配置文件定义它们，并将文件提供给你的 GitOps 工具，让它们完成配置的繁琐工作。它是快速且可重复基础设施部署的关键组件。\n\
    \n> **术语。** `声明式配置` 是一种模式，你在配置文件中描述某些内容的 `期望状态`，并让工具或过程来实现它。一个常见的现实示例是在 YAML 配置文件中定义\
    \ Kubernetes 对象，并将其提供给 Kubernetes API 服务器，由 Kubernetes 为你置备这些对象。\n\n使用配置文件部署基础设施在云平台上运行良好，因为云平台拥有一池可供你提取和配置的可用基础设施。例如，一个\
    \ IaC 配置文件可能会定义云实例、网络配置、防火墙和 ACL 规则、路由表、网络策略等。你将配置文件发送到云端，云端就会对其进行配置。然而，它在本地环境中没有云端那么强大，因为本地环境通常没有大型的可配置资源池。此外，IaC\
    \ 无法执行常见的本地置备任务，例如物理机架的服务器和连接物理网线。\n\nIaC 极其常见且强大的一个领域是 Kubernetes。这是因为 Kubernetes\
    \ 在配置文件中描述了用于配置的所有内容。例如，Kubernetes pod、service、ingress、网络策略、负载均衡器等都在 YAML 配置文件中进行了声明式描述，你将这些文件发布到\
    \ API 服务器，由 Kubernetes 负责进行配置。下面的 YAML 文件是 IaC 的示例——它描述了一个 Kubernetes 负载均衡服务，该服务将监听\
    \ 9000 端口并将 8080 端口的流量转发到带有 `env=prod` 标签的 pod。你可以使用 `kubectl apply` 将文件发送到 Kubernetes\
    \ 集群，Kubernetes 将与你的云平台通信并配置负载均衡器。\n\n```\napiVersion: v1\nkind: Service\nmetadata:\n\
    \  name: test-lb\nspec:\n  type: LoadBalancer\n  ports:\n  - port: 9000\n    targetPort:\
    \ 8080\n  selector:\n    env: prod\n```\n\n## 拉取请求与合并\n\nGitOps 将 IaC 与成熟的 Git\
    \ 工作流相结合，创建自动化持续交付流水线。在过去的几年里，它已成为管理 Kubernetes 环境的一种非常流行的方法，并启发了新一代持续交付 (CD)\
    \ 工具。\n\n考虑以下示例。你构建了一个 Kubernetes 集群并安装了如 `Flux`、`Argo` 或 `Jenkins X` 等 GitOps\
    \ 工具。你配置 GitOps 工具监控一个用于存储 Kubernetes 配置的 Git 仓库。你在 Kubernetes YAML 文件中描述了一个新应用程序，该文件包含多个\
    \ Kubernetes 对象，如 pod、service account、secret、网络策略和 ingress。你创建一个拉取请求 (PR) 将 YAML\
    \ 文件合并到 Git 仓库中。PR 包含了更改的描述以及任何测试的证据。同事在 PR 上发表评论，随后它获得批准并合并到仓库。你的 GitOps 工具注意到合并，并启动持续部署过程，在你的\
    \ Kubernetes 集群上配置应用和基础设施。\n\n过段时间后，你需要对配置进行微小更新。你不是手动编辑生产环境，而是创建一个 Git 仓库的分支并在那里进行配置更改。当你对这些更改满意后，创建一个\
    \ PR 将它们与仓库的 master 分支合并。同事再次在 PR 上发表评论并最终批准了合并。你的 GitOps 工具观察到合并，并启动另一个持续交付过程来应用更新。\n\
    \n如你所见，`PRs` 和 `merges` 是关键的 GitOps 操作。事实上，有四条重要的 GitOps 规则：\n\n1.  将`所有` 应用和基础设施配置存储在\
    \ Git 中\n2.  使用 `PRs` 和合并进行审批并触发部署\n3.  自动化部署\n4.  停止进行手动更改\n\n让我们澄清一些术语。\n\n\
    `Git` 是一个由 Linus Torvalds（Linux 的发明者）创建的流行开源版本控制系统。它的核心功能是跟踪更改和实现回滚，用于管理大型和小型项目。大型项目包括\
    \ Linux 和 Kubernetes，小型项目包括我其他书籍和视频培训课程的实验文件等。\n\n`GitHub` 是一个基于云的代码存储库，使用 Git\
    \ 进行版本控制。它将文件组织成名为 `repositories`（仓库）的文件夹，你通常为每个项目分配一个自己的仓库。例如，我《Quick Start Kubernetes》一书的所有文件都在\
    \ GitHub 的 `nigelpoulton/qsk-book` 仓库中，而《The Kubernetes Book》的所有文件都在 `nigelpoulton/TheK8sBook`\
    \ 仓库中——每个项目一个仓库。\n\n`Git` 允许你创建仓库的 `branches`（分支）作为处理更改的区域。你在自己的分支中进行更改，并使用拉取请求将更改合并到名为\
    \ `master` 的特殊分支。这个 master 分支是真理源，所有来自其他分支的更改和更新都必须 `merged` 到 master 才能成为项目的一部分。如所述，合并更改到\
    \ master 分支的过程是通过 `Pull Requests (PR)` 启动的，它通知团队成员更改已准备好进行评审并可能被 `merged`。PR 提供了一个评论论坛，可以在其中讨论更改。\n\
    \n在示例中，GitOps 工具（如 `Flux` 或 `Argo`）正在监控 Git 仓库的 master 分支。每当它观察到合并时，就会启动持续交付 (CD)\
    \ 过程，将更新后的配置部署到生产环境。\n\n### 持续交付\n\n正如本章节开头提到的，CI/CD 是两个不同的过程。\n\n*   `CI` 构建并测试软件\n\
    *   `CD` 将其部署到生产环境\n\nGitOps 主要关注 CD 方面，不处理较早的 CI 步骤。这意味着你仍然需要一个 CI 工具来处理应用的构建、测试和共享。\n\
    \n### 对手动更改零容忍\n\n一旦你采用 GitOps，你就不能再对生产环境进行手动更改了，因为这些更改会在每次 PR 和成功合并后丢失。\n"
