    # What next


    If you’re about to take your KCNA exam, good luck and I’m excited for you. I’d
    love to hear about your experience, and I’d love any feedback that could make
    the book better.


    If you’ve already taken it, I hope you passed and are ready to take your next
    steps.


    ## Other exams


    If you work in a hands-on technical role, the following Kubernetes-related exams
    are obvious next steps.


    *   Certified Kubernetes Application Developer (CKAD)


    *   Certified Kubernetes Administrator (CKA)


    *   Certified Kubernetes Security Specialist (CKS)


    All three are hands-on exams and quite a bit harder than the KCNA. This is because
    they’re specialist certifications and go into a lot more detail. They’re also
    hands-on and not multiple-choice.


    *The CKAD* is a hands-on exam focussed on deploying and managing applications
    on Kubernetes. *The CKA* is similar but focusses more on things like building
    and managing Kubernetes clusters. *The CKS* is obviously security focussed.


    Outside of CNCF Kubernetes-related exams, there are several cloud exam tracks
    that specialise in cloud technologies such as AWS, Azure, and Google Cloud.


    ## Books


    I have two other best-selling Kubernetes-related books that you’ll love:


    *   Quick Start Kubernetes


    *   The Kubernetes Book


    Both are available on Amazon, Leanpub, and many other reputable publishers.


    *Quick Start Kubernetes* is aimed at people that are new to Kubernetes. It’s only
    ~100 long and explains Kubernetes from the ground-up with really easy hands-on
    examples. In 100 pages you’ll build a Kubernetes cluster, deploy a simple app,
    break it and watch Kubernetes self-heal it, scale it, and perform a rolling update.
    When you’re done, you’ll be all-good with the basics of Kubernetes.


    *The Kubernetes Book* is an entirely different beast. It covers a lot more and
    goes into a lot more detail. It’s regularly listed as a best-seller.


    Both books are updated annually to make sure they’re up-to-date with the latest
    versions of Kubernetes and the latest trends in the cloud native ecosystem.


    ## Video courses


    I’ve created a lot of containers and Kubernetes video courses available at Pluralsight.com.
    They’re a lot of fun and have rave reviews. If you like video courses, you’ll
    love these. Some of them include:


    *   Docker & Kubernetes: The Big Picture


    *   Getting Started with Docker


    *   Getting Started with Kubernetes


    *   Docker Deep Dive


    *   Kubernetes Deep Dive


    ## Let’s connect


    I’m always happy to connect and I’d love to hear your opinions on the book and
    your experience with the exam. You can reach me at all of the following places.


    *   **LinkedIn:** https://www.linkedin.com/in/nigelpoulton/


    *   **Twitter:** @nigelpoulton'
