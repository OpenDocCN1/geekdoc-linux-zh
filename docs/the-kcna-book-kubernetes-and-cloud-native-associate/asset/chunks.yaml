    `Container Runtime Interface (CRI)` 是 Kubernetes 实现的一项低级技术，用于使容器运行时层具有扩展性。它允许集群管理员和集群操作人员为他们的应用程序和环境选择合适的容器运行时。


    ### containerd


    `containerd`（读音为“container dee”）是大多数现代 Kubernetes 集群的默认容器运行时。它是 Docker 的精简版本，仅包含
    Kubernetes 所需的部分。`containerd` 的代码是由 Docker, Inc. 捐赠给 CNCF 的。它是一个 CNCF 毕业项目，也是一个稳定的容器运行时。


    ### Namespaces（命名空间）


    `Namespaces` 允许你将 Kubernetes 集群划分为多个称为“命名空间”的虚拟集群。每个命名空间都有自己的一套用户账户和资源配额，它们是在同一组织内不同团队或部门之间共享集群的好方法。然而，它们并不是一个安全的负载边界，因此你不应该使用它们来将生产环境与测试或开发环境隔离开。你也不应该使用它们在竞争性客户端之间划分集群。这是因为一个命名空间中受损的容器很容易影响其他命名空间中的容器。


    ### Pod network（Pod 网络）


    每个 Kubernetes 集群都实现了一种特殊的网络，称为 `pod network`。这是所有 Pod 和容器部署到的网络，并且它始终由第三方网络插件实现。存在许多插件，它们都通过容器网络接口（CNI）进行插件化。每个
    Kubernetes 集群恰好有一个 pod 网络。


    ### CNI


    `Container Network Interface (CNI)` 是一是一项低级技术，允许第三方使用先进技术和功能构建 Pod 网络。例如，某些 CNI
    插件实现了双栈 IPv4 和 IPv6 网络，而另一些可能只实现 IPv4。


