    考虑以下简单示例。你有一个关键的业务应用程序，用于创建和管理非常重要的客户数据。这些数据需要被保护，且应用程序需要快速访问它们。你在容器上运行该业务应用程序，容器向高性能存储系统读写数据，该存储系统将数据异地复制，并定期进行快照。由于数据存储在外部存储系统中，应用程序容器可能会失败，并被运行在不同节点上的新容器替换，这些容器可以访问相同的数据。这就是应用程序代码、逻辑与应用程序数据之间松耦合的示例。


    Kubernetes 拥有基于容器存储接口（CSI）的可插拔存储层。它提供了一个通用存储接口，外部系统可以接入该接口并为运行 Kubernetes 上的应用程序提供存储服务。例如，如果你有一个想要在
    Kubernetes 中使用的 NetApp 存储系统，可以在 Kubernetes 集群上安装 NetApp 的 CSI 插件并连接存储器。


    总之，容器的设计旨在运行小型、专门的业务应用程序并保持无状态。这意味着你不应该在容器中存储数据，因为容器失败或删除时数据就会消失。相反，你使用 CSI 插件将外部系统的卷挂载到容器中。这些卷看起来和用起来与本地卷完全相同，应用程序像往常一样对它们读写数据。这样，如果容器失败或被替换，数据就能保留。从提供高级数据管理和数据保护服务的企业级存储系统将卷暴露到
    Kubernetes 中是常见做法。你可以将块存储、文件存储和对象存储提供给 Kubernetes。


    所有这一切对于只读写数据的应用程序来说都是透明的。


    ## 章节总结


    在本章中，你学习了容器的基础知识，以及它们如何像更小、更快的虚拟机一样，更适用于微服务应用程序。容器运行时是启动和停止容器的低级应用程序，通常由 Kubernetes
    等高层应用程序管理。Kubernetes 负责编排容器化应用程序，这是一个术语，指的是提供如调度、自愈和自动扩展缩容等功能。


    你还学习了容器和微服务设计模式引入了新的安全威胁，例如共享内核、root 容器、不安全的网络和不可信的代码。容器还为 IP 地址管理和服务发现等网络服务带来了新颖且独特的挑战。它们对整体网络安全也产生了影响。Kubernetes
    提供了原生的 IPAM 和服务发现，但你需要服务网格来实现容器之间的加密以及对网络流量的深度可见性。


    最后，你了解到容器的设计是无状态且瞬态的。这意味着你应该始终将数据存储在容器外的外部存储系统中。


    ## 考试要点


    ### 容器运行时


    `Container runtimes`（容器运行时）是一种基础设施应用程序，专门负责创建、启动、停止和删除容器等低级容器操作。它们通常在后台运行，并由 Kubernetes
    等高层工具管理。例如，你或你的团队可能每天向 Kubernetes 部署应用程序。然而，你不会亲自运行实际启动和停止容器的命令——Kubernetes 会在背后为你处理这一切。`Docker`
    是最为人知的容器运行时，其他的还包括 `containerd` 和 `CRI-O`。


    ### 容器化


    `Containerisation`（容器化）是将应用程序及其依赖项构建为容器镜像的过程。例如，当开发者编写了一个应用程序并封装为容器镜像时，你可以说开发者已经将“应用程序容器化”。


    ### 开放容器标准 (OCI)


    `The OCI` 是一个开放组织，负责开发底层容器标准，如 `container runtime-spec`（容器运行时规范）和 `container image-spec`（容器镜像规范）。这两者对于容器运行时和构建工具数量增长起了至关重要的作用。按照
    `OCI image-spec` 构建的容器镜像通常称为 `OCI images`。`Docker`、`containerd`、`CRI-O` 以及大多数其他容器运行时都支持
    OCI 镜像。


    ### 镜像与容器


    开发者编写应用程序并使用构建工具将其封装为 `images`（镜像）。容器运行时下载镜像并从从中启动 `containers`（容器）。因此，容器是镜像的运行实例，反之，镜像就像是停止的容器。然而，你可以从单个镜像启动多个容器。例如，你可以下载一份
    `MySQL` 镜像副本，并从它运行多个容器。


    ### 容器编排


    `Container orchestration`（容器编排）工具（如 `Kubernetes`）自动化了部署和管理容器化应用程序的大多数日常运营方面。例如，Kubernetes
    会将容器调度到具有足够资源的节点上，根据需求进行扩容和缩容，在它们失败时替换它们，并管理发布和回滚。


    ### Kubernetes


    `Kubernetes` 是行业标准的容器编排器。它由一个或多个控制平面节点和一个或多个工作节点组成集群运行。你将微服务应用程序封装为容器并运行在 Kubernetes
    集群上。然而，正如你之后将学到的，它们必须运行在 pod 内部。Kubernetes 拥有将每个容器工作负载调度到适当集群节点的智能，在需要时进行扩展，在发生故障时进行愈合，并允许频繁发布。控制平面节点实现编排智能，工作节点是用户程序运行的地方。


    ### 容器运行时接口 (CRI)


    `The CRI` 是 Kubernetes 实现的一种开放标准，用于使容器运行时层变得可插拔。这意味着你可以根据需求选择最佳容器运行时，并且 Kubernetes
    集群中的每个工作节点都可以运行不同的容器运行时。`Docker` 是 Kubernetes 原始使用的容器运行时，但在大多数新的 Kubernetes 集群中，它正被
    `containerd` 替换为默认。


    ### 共享内核


    最流行的容器类型是 `namespaced containers`（命名空间容器），它们共享所在运行的节点内核。它们最流行且最轻量，但安全性最低。`Docker`、`containerd`、`CRI-O`
    以及许多其他容器运行时都创建命名空间容器。虚拟化容器和沙箱容器更安全，但不够轻量且易于迁移。


    ### Root 容器


    不要在容器中以 root 身份运行应用程序。这是因为它们会对其运行的节点以及同一节点上的所有其他容器构成重大风险。你应该设计应用程序使其无需以 root 身份运行，并实施防止容器以
    root 身份运行的策略。如果你的程序绝对以 root 身份运行，你应该实现 `user namespaces`（用户命名空间），将容器内的 root 用户映射为节点上的非
    root 用户。这意味着被攻击的 root 容器不会获得节点的 root 权限。


    ### 不安全的网络


    微服务应用程序大量分布在多个节点上，这意味着它们必须通过 IP 网络共享敏感数据。如果这些网络是开放且数据以明文传输，这是一个巨大的安全风险。考虑到此，你应该加密容器之间的所有流量。实现这一点简单的方法之一是部署服务网格。


    ### 不可靠的代码


    你应该只运行你了解并信任的应用程序。实现这一点简单方法是在内部构建并测试所有代码。不要使用和信任从互联网下载的代码，例如社区镜像。


    容器网络：IP 地址管理 (IPAM)


