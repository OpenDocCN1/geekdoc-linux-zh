- fmt: "\nYou’ve just learned that pods wrap one or more containers and add capabilities.\
    \ However, pods don’t self-heal, they don’t autoscale, and they don’t do things\
    \ like zero-downtime rollouts. Kubernetes has higher-level controllers that wrap\
    \ around pods and implement these features. As a result, you’ll almost always\
    \ deploy pods via higher level controllers such as `deployments` and `statefulsets`.\n\
    \nYou’ll learn more about controllers later in the chapter. But for now, let’s\
    \ consider a simple example of deploying a stateless web server.\n\nYour development\
    \ team writes a stateless web app and packages it as a container. You know you\
    \ need 5 instances to meet expected demand, and as you’re running a Kubernetes\
    \ environment you need to wrap each container in a pod. However, pods aren’t resilient.\
    \ For example, if you deploy 5 standalone pods and a node hosting 2 of them fails,\
    \ there’s no intelligence to recreate them and ensure you always have 5. This\
    \ is where higher-level controllers come into play.\n\nKubernetes has a `deployment\
    \ controller` that accepts a pod definition and ensures a desired number are always\
    \ running.\n\nWith this in mind, you wrap your pod in a deployment and tell Kubernetes\
    \ to run that. Once all 5 pods are up and running, the deployment controller keeps\
    \ a watch on things and responds to events such as failures. For example, if a\
    \ node fails and takes two of the pods with it, the deployment reacts by starting\
    \ two new pods to keep you at 5.\n\nYou’ll learn more about controllers later,\
    \ but the following YAML shows a simple deployment. Notice how the container is\
    \ nested within the pod, which in turn is nested within the deployment. As such,\
    \ the deployment wraps the pod, which in turn wraps the container.\n\n```\n1 \
    \ apiVersion: apps/v1\n2  kind: Deployment\n3  metadata:\n4    name: kcna-deployment\n\
    5  spec:\n6    replicas: 5\n7    <Snip>\n8    template:\n9      spec:\n10    \
    \   runtimeClassName: level1 \n11       containers:\n12       - name: kcna-pod\n\
    13         image: <container-image>\n```\n\nLines 1-6 are the deployment and define\
    \ the desired state of 5 pod replicas always running. Lines 8-10 define the pod\
    \ and include the runtime class requirement you saw before. Lines 11-13 define\
    \ the container. This is shown in Figure 4.3.\n\n![](resources/images----figure4-3.png)\n\
    \nFigure 4.3\n\n### Augmenting pods quiz\n\n**1.** Why does Kubernetes implement\
    \ higher-level controllers instead of deploying static pods?\n\n* 1. They provide\
    \ advanced network telemetry\n* 2. They add features such as resiliency, scaling,\
    \ and updates\n* 3. They allow pods to be migrated between different cloud platforms\n\
    * 4. They run pods faster\n\n**2.** Which of the following Kubernetes controllers\
    \ ensures a specific number of containers are always running?\n\n* 1. Deployment\
    \ controller\n* 2. Job controller\n* 3. Endpoints controller\n* 4. Cloud controller\n\
    \n**3.** Which of the following best describes the architecture of pods and controllers?\n\
    \n* 1. Pod specifications are wrapped in a controller specification\n* 2. Controller\
    \ specifications are embedded inside pod specifications\n\n**Answers.** 1:B, 2:A,\
    \ 3:A.\n\n## Kubernetes architecture\n\nWe’ll cover a lot of things in this section,\
    \ so we’ll split things out into sub-sections to make things easier to digest\
    \ and refer back to. We’ll cover all of the following:\n\n* High level Kubernetes\
    \ architecture\n* The control plane\n* Controllers\n* Worker nodes\n* `kubectl`\n\
    * Hosted Kubernetes\n\n### High level Kubernetes architecture\n\nAt a high level,\
    \ Kubernetes is a cluster of nodes that run containerised applications. It runs\
    \ a number of `controllers` that implement features such as self-healing and automated\
    \ releases.\n\nThere are two types of nodes in a Kubernetes cluster.\n\n* Control\
    \ plane nodes\n* Worker nodes\n\nBoth can be virtual machines, physical servers,\
    \ or cloud instances, and you can mix-and-match different types in the same cluster.\n\
    \n`Control plane nodes` are the brains of Kubernetes. They run the API server,\
    \ the scheduler, and the cluster store. They also run the controllers that implement\
    \ the intelligence.\n\n`Worker nodes` are where user applications run. Every worker\
    \ node has a `kubelet` and a container runtime. The `kubelet` talks to the control\
    \ plane and tells the container runtime when to start and stop containers.\n\n\
    The Kubernetes command line utility is called `kubectl`.\n\nLet’s look at everything\
    \ in more detail.\n\n### The control plane\n\nThe Kubernetes control plane is\
    \ a collection of specialised independent services that run on every control plane\
    \ node. These implement the intelligence that makes Kubernetes so special.\n\n\
    As the control plane is a vital part of every Kubernetes cluster, it needs to\
    \ be high performance and highly available. In the real world, production Kubernetes\
    \ clusters normally run 3 or 5 control plane nodes spread across multiple failure\
    \ domains. This means failure of a control plane node, or any of the supporting\
    \ infrastructure, won’t take the entire control plane down. You should also ensure\
    \ control plane nodes are connected by low-latency reliable networks.\n\nIt’s\
    \ important that you run an odd number of control plane nodes, and running 1 is\
    \ better than running 2. This is because an even number has more chance of resulting\
    \ in a split-brain scenario where a network failure occurs and there are an equal\
    \ number of control plane nodes on either side of the network failure. If this\
    \ happens, neither side can be sure they have a majority.\n\nIf the control plane\
    \ ever does go down, applications that are already running will continue to work\
    \ but you won’t be able to make any changes or updates.\n\nThe major control plane\
    \ services include all of the following, and they all run on every control plane\
    \ node.\n\n* The API server\n* The scheduler\n* The cluster store\n* Controllers\n\
    \n`API server` is the main gateway in and out of Kubernetes. When you send commands\
    \ to Kubernetes, you send them to the API server. When you query the state of\
    \ something, you send the query to the API server. Also, the `kubelet` on every\
    \ worker node watches the API server for new work assignments and reports status\
    \ back to the API server. Basically, everything in Kubernetes goes through the\
    \ API server. This requires high-performance control plane nodes so the API server\
    \ can respond to requests quickly.\n\n`Scheduler` is responsible for deciding\
    \ which worker nodes to run pods on. It can schedule pods to nodes with CPU and\
    \ memory, it can distribute them across availability zones, and it can even target\
    \ them to particular nodes or keep them away from particular nodes.\n\n`Cluster\
    \ store` is where the state of the cluster is stored and is the only stateful\
    \ component of the entire control plane. This means it’s the only component that\
    \ creates and stores important cluster-related data that must not be lost. For\
    \ example, if you deploy an application that requires 5 instances of a particular\
    \ pod, this will be stored in the cluster store and used by controllers and other\
    \ components as a reference. The cluster store is based on the `etcd` distributed\
    \ database.\n\n`Controllers` watch the current state of the cluster and take actions\
    \ to ensure it’s always in sync with desired state. Again, as a simple example,\
    \ you might request 5 pods running a web server container – this is desired state.\
    \ If something fails and drops the number of pods down to 3, a controller observes\
    \ the change and starts 2 new pods to bring observed state back into sync with\
    \ desired state. We’ll explain this in more detail shortly.\n"
  raw: "You’ve just learned that pods wrap one or more containers and add capabilities.\
    \ However, pods don’t self-heal, they don’t autoscale, and they don’t do things\
    \ like zero-downtime rollouts. Kubernetes has higher-level controllers that wrap\
    \ around pods and implement these features. As a result, you’ll almost always\
    \ deploy pods via higher level controllers such as *deployments* and *statefulsets.*\n\
    \nYou’ll learn more about controllers later in the chapter. But for now, let’s\
    \ consider a simple example of deploying a stateless web server.\n\nYour development\
    \ team writes a stateless web app and packages it as a container. You know you\
    \ need 5 instances to meet expected demand, and as you’re running a Kubernetes\
    \ environment you need to wrap each container in a pod. However, pods aren’t resilient.\
    \ For example, if you deploy 5 standalone pods and a node hosting 2 of them fails,\
    \ there’s no intelligence to recreate them and ensure you always have 5\\. This\
    \ is where higher-level controllers come into play.\n\nKubernetes has a *deployment\
    \ controller* that accepts a pod definition and ensures a desired number are always\
    \ running.\n\nWith this in mind, you wrap your pod in a deployment and tell Kubernetes\
    \ to run that. Once all 5 pods are up and running, the deployment controller keeps\
    \ a watch on things and responds to events such as failures. For example, if a\
    \ node fails and takes two of the pods with it, the deployment reacts by starting\
    \ two new pods to keep you at 5.\n\nYou’ll learn more about controllers later,\
    \ but the following YAML shows a simple deployment. Notice how the container is\
    \ nested within the pod, which in turn is nested within the deployment. As such,\
    \ the deployment wraps the pod, which in turn wraps the container.\n\n```\n1 \
    \ apiVersion: apps/v1\n2  kind: Deployment\n3  metadata:\n4    name: kcna-deployment\n\
    5  spec:\n6    replicas: 5\n7    <Snip>\n8    template:\n9      spec:\n10    \
    \   runtimeClassName: level1 \n11       containers:\n12       - name: kcna-pod\n\
    13         image: <container-image>\n```\n\nLines 1-6 are the deployment and define\
    \ the desired state of 5 pod replicas always running. Lines 8-10 define the pod\
    \ and include the runtime class requirement you saw before. Lines 11-13 define\
    \ the container. This is shown in Figure 4.3.\n\n![](resources/images----figure4-3.png)\n\
    \nFigure 4.3\n\n### Augmenting pods quiz\n\n**1.** Why does Kubernetes implement\
    \ higher-level controllers instead of deploying static pods?\n\n*   1.  They provide\
    \ advanced network telemetry\n\n*   2.  They add features such as resiliency,\
    \ scaling, and updates\n\n*   3.  They allow pods to be migrated between different\
    \ cloud platforms\n\n*   4.  They run pods faster\n\n**2.** Which of the following\
    \ Kubernetes controllers ensures a specific number of containers are always running?\n\
    \n*   1.  Deployment controller\n\n*   2.  Job controller\n\n*   3.  Endpoints\
    \ controller\n\n*   4.  Cloud controller\n\n**3.** Which of the following best\
    \ describes the architecture of pods and controllers?\n\n*   1.  Pod specifications\
    \ are wrapped in a controller specification\n\n*   2.  Controller specifications\
    \ are embedded inside pod specifications\n\n**Answers.** 1:B, 2:A, 3:A.\n\n##\
    \ Kubernetes architecture\n\nWe’ll cover a lot of things in this section, so we’ll\
    \ split things out into sub-sections to make things easier to digest and refer\
    \ back to. We’ll cover all of the following:\n\n*   High level Kubernetes architecture\n\
    \n*   The control plane\n\n*   Controllers\n\n*   Worker nodes\n\n*   kubectl\n\
    \n*   Hosted Kubernetes\n\n### High level Kubernetes architecture\n\nAt a high\
    \ level, Kubernetes is a cluster of nodes that run containerised applications.\
    \ It runs a number of *controllers* that implement features such as self-healing\
    \ and automated releases.\n\nThere are two types of nodes in a Kubernetes cluster.\n\
    \n*   Control plane nodes\n\n*   Worker nodes\n\nBoth can be virtual machines,\
    \ physical servers, or cloud instances, and you can mix-and-match different types\
    \ in the same cluster.\n\n*Control plane nodes* are the brains of Kubernetes.\
    \ They run the API server, the scheduler, and the cluster store. They also run\
    \ the controllers that implement the intelligence.\n\n*Worker nodes* are where\
    \ user applications run. Every worker node has a kubelet and a container runtime.\
    \ The kubelet talks to the control plane and tells the container runtime when\
    \ to start and stop containers.\n\nThe Kubernetes command line utility is called\
    \ `kubectl`.\n\nLet’s look at everything in more detail.\n\n### The control plane\n\
    \nThe Kubernetes control plane is a collection of specialised independent services\
    \ that run on every control plane node. These implement the intelligence that\
    \ makes Kubernetes so special.\n\nAs the control plane is a vital part of every\
    \ Kubernetes cluster, it needs to be high performance and highly available. In\
    \ the real world, production Kubernetes clusters normally run 3 or 5 control plane\
    \ nodes spread across multiple failure domains. This means failure of a control\
    \ plane node, or any of the supporting infrastructure, won’t take the entire control\
    \ plane down. You should also ensure control plane nodes are connected by low-latency\
    \ reliable networks.\n\nIt’s important that you run an odd number of control plane\
    \ nodes, and running 1 is better than running 2\\. This is because an even number\
    \ has more chance of resulting in a split-brain scenario where a network failure\
    \ occurs and there are an equal number of control plane nodes on either side of\
    \ the network failure. If this happens, neither side can be sure they have a majority.\n\
    \nIf the control plane ever does go down, applications that are already running\
    \ will continue to work but you won’t be able to make any changes or updates.\n\
    \nThe major control plane services include all of the following, and they all\
    \ run on every control plane node.\n\n*   The API server\n\n*   The scheduler\n\
    \n*   The cluster store\n\n*   Controllers\n\n*The API server* is the main gateway\
    \ in and out of Kubernetes. When you send commands to Kubernetes, you send them\
    \ to the API server. When you query the state of something, you send the query\
    \ to the API server. Also, the kubelet on every worker node watches the API server\
    \ for new work assignments and reports status back to the API server. Basically,\
    \ everything in Kubernetes goes through the API server. This requires high-performance\
    \ control plane nodes so the API server can respond to requests quickly.\n\n*The\
    \ scheduler* is responsible for deciding which worker nodes to run pods on. It\
    \ can schedule pods to nodes with enough CPU and memory, it can distribute them\
    \ across availability zones, and it can even target them to particular nodes or\
    \ keep them away from particular nodes.\n\n*The cluster store* is where the state\
    \ of the cluster is stored and is the only stateful component of the entire control\
    \ plane. This means it’s the only component that creates and stores important\
    \ cluster-related data that must not be lost. For example, if you deploy an application\
    \ that requires 5 instances of a particular pod, this will be stored in the cluster\
    \ store and used by controllers and other components as a reference. The cluster\
    \ store is based on the *etcd* distributed database.\n\n*Controllers* watch the\
    \ current state of the cluster and take actions to ensure it’s always in sync\
    \ with desired state. Again, as a simple example, you might request 5 pods running\
    \ a web server container – this is desired state. If something fails and drops\
    \ the number of pods down to 3, a controller observes the change and starts 2\
    \ new pods to bring observed state back into sync with desired state. We’ll explain\
    \ this in more detail shortly.\n\nAs a quick recap, the control plane runs critical\
    \ services and needs to be highly available. For most scenarios you should run\
    \ 3 control plane nodes and spread them across different availability zones so\
    \ that local failures don’t impact all three. You should also ensure control plane\
    \ nodes are high-performance so that requests to the API server aren’t slow.\n\
    \n### Controllers"
