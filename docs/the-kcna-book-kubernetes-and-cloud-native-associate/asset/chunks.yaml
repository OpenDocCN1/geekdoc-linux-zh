    # The exam


    This chapter prepares you to take and pass the exam. It’s divided as follows:


    *   Exam domains and competencies


    *   About the exam


    *   Booking the exam


    *   Taking the exam


    *   Getting your result


    *   Staying connected


    ## Exam domains and competencies


    The overall aim of the KCNA is to test and prove your understanding of the following
    broad topics:


    *   Cloud native and microservices architectures


    *   Kubernetes architecture


    *   The wider Kubernetes and cloud native landscape (CI/CD, GitOps, observability,
    security etc.)


    *   Basics of using kubectl


    The exam tests the following topics that it calls *domains and competencies,*
    and you’ll notice they map directly to the chapters of the book. However, the
    book organises them so each chapter builds on the previous one and prepares you
    for the next one. As the name of the certification suggests, Kubernetes accounts
    for nearly half of the exam and the Kubernetes questions feel slightly more in-depth
    than other topics.


    Kubernetes fundamentals: 46%


    Kubernetes resources


    Kubernetes architecture


    Kubernetes API


    Containers


    Scheduling


    Container orchestration: 22%


    Container orchestration fundamentals


    Runtime


    Security


    Networking


    Service mesh


    Storage


    Cloud native architecture: 16%


    Autoscaling


    Serverless


    Community & governance


    Roles and personas


    Open standards


    Cloud native observability: 8%


    Telemetry and observability


    Prometheus


    Cost management


    Cloud native application delivery: 8%


    Application delivery fundamentals


    GitOps


    CI/CD


    ## About the exam


    Here are the important details about the exam:


    *   **Delivery method.** Remote via secured browser with remote proctor


    *   **Style.** Multiple-choice


    *   **Duration.** 90 minutes


    *   **Passing score.** 75%


    *   **Valid for.** 3 years


    *   **Cost.** $250 USD with one free resit


    The exam is an online, proctored, multiple-choice exam. This means you take it
    remotely over the internet and have a person remotely monitoring your desktop,
    video, and audio so you don’t cheat. You’ll be required to download a secure browser
    and there’s no option to take the exam at authorised testing centers.


    All questions are multiple choice and almost all of them have 4 possible answers.
    There are no questions where you have to type your answers and there are no hands-on/simulator
    style questions.


    Once you start your exam you have 90 minutes to complete all 60 questions. The
    platform allows you to mark questions for review that you can revisit later. You
    have to review and submit your answers to **all questions** before the 90 minutes
    expires.


    You need to score a mark of 75% or more to pass the exam and you’ll receive your
    score within 24 hours of completing the exam. This is frustrating for an online
    exam where it would be simple to give you an instant result. It usually takes
    nearly 24 hours to receive your result, so don’t sit there all day clicking refresh
    in your inbox or in the exam portal.


    ## Booking the exam


    You can book your exam at the following link and the process is as follows:


    1.  Purchase the exam


    2.  Book your exam date


    3.  Prepare and complete the pre-exam checklist


    4.  Take your exam


    https://training.linuxfoundation.org/certification/kubernetes-cloud-native-associate/


    The exam costs $250 and I recommend you book it ASAP and use the date as motivation
    and a target. However, if it’s getting close and you don’t think you’re ready,
    you can re-schedule as close as 24 hours in advance for no extra charge. You also
    get one free resit if you don’t pass first time.'
