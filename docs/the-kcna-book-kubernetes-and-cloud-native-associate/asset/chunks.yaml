    daemonset 控制器确保特定 pod 的实例始终运行在每个集群节点上。


    问题 42 ，答案 D


    containerd 由 Docker, Inc. 创建并捐赠给 CNCF，是一个适用于 Kubernetes 等环境的轻级容器运行时。


