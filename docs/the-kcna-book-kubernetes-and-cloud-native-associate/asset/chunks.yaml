    ## 31. 在配置基础设施的自动伸缩时，以下哪些是重要的？请选择两个。

    1. 请求响应时间

    2. 设置上限和下限

    3. 观察正确的指标

    4. 使用预留云实例


    # 考试


    本章节帮助你准备并通过考试。它分为以下：

    * 考试领域和能力

    * 关于考试

    * 预订考试

    * 参加考试

    * 获取结果

    * 保持联系


    ## 考试领域和能力


    KCNA 的总体目标是测试并证明你对以下广泛主题的理解：

    * 云原生和微服务架构

    * Kubernetes 架构

    * 更广泛的 Kubernetes 和云原生格局（CI/CD、GitOps 等）


    考试测试以下主题，这些主题直接映射到各个领域：


    ### Kubernetes 基础 (46%)

    * Kubernetes 资源

    * Kubernetes 架构

    * Kubernetes API

    * 容器

    * 调度


    ### 容器编排 (22%)

    * 容器编排基础

    * 运行时 (Runtime)

    * 安全

    * 网络

    * 存储


    ### 云原生架构 (16%)

    * 自动伸缩

    * 无服务器 (Serverless)

    * 社区与治理

    * 角色与画像

    * 开放标准


    ### 云原生观测性 (8%)

    * 遥测与可观测性

    * Prometheus


    ### 成本管理 (8%)

    * 应用程序交付基础


    ## 关于考试


    以下是关于考试的重要细节：

    * **交付方式**：通过安全浏览器远程进行

    * **类型**：多选题

    * **时长**：90 分钟

    * **及格分数**：75%

    * **有效期**：3 年

    * **费用**：250 美元，包含一次免费重考


    考试是一场在线的、受监考的多选题考试。这意味着你通过互联网远程参加，并由人员远程监控你的桌面、视频和音频。你需要下载一个安全浏览器，且没有在授权测试中心考试的选项。


    所有问题都是多选题，大多数问题有 4 个备选项。没有需要你输入答案的问题，也没有实操模拟类题目。


    一旦开始考试，你就有 90 分钟完成所有问题。平台允许你标记需要稍后查看的问题。你必须在 90 分钟结束前检查并提交所有问题的答案。


    你需要获得 75% 或以上的分数才能通过考试，你将在考试后 24 小时内收到分数。对于本可以给出即时结果的在线考试来说，这令人沮丧。通常需要近 24 小时才能收到结果，所以不要整天坐在收件箱或考试门户旁刷新。


    ## 预订考试


    你可以在以下链接预订考试，流程如下：

    1. 购买考试

    2. 预订考试日期

    3. 准备并完成考前清单

    4. 参加考试


    https://training.linuxfoundation.org/certification/kubernetes-cloud-native-associate/


    考试费用为 250 美元，建议你尽快预订，并将日期作为动力和目标。但是，如果日期临近你认为还没准备好，可以提前 24 小时重新安排，无需支付额外费用。如果你第一次没有通过，你还获得一次免费重考的机会。


