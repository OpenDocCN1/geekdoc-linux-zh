- fmt: '

    The `image-spec` defines a standard way to build and package container images,
    the `runtime-spec` standardises container execution environments and container
    lifecycles, and the `distribution-spec` standardises content distribution via
    registries. When combined, they act like the standardisation of train tracks and
    provide the confidence developers and users require for a strong ecosystem to
    emerge. Consider the following examples.


    The `image-spec` gave developers and startups confidence to create their own build
    tools to create `OCI` container images. Prior to the OCI `image-spec`, everybody
    used the Docker tools and the `docker build` command to build container images.
    Now there are a lot of tools to choose from.


    The `runtime-spec` gave developers and startups confidence to create their own
    container runtimes in the knowledge they’d work with other tools and safely run
    images created against the OCI `image-spec`. Prior to the OCI `runtime-spec` everybody
    used Docker and the `docker run` command to run containers. Now there are a lot
    of container runtimes and CLI tools to choose from.


    Finally, the `distribution-spec` gave developers and startups the confidence to
    build their own container registries. Again, Docker Hub was originally the only
    container registry. Now there are lots to choose from.


    Consider the following real-world success story made possible by the OCI standards.
    Kubernetes originally used Docker as its container runtime (the low-level tool
    to start and stop containers). Over time, Docker grew and became overkill for
    what Kubernetes needed. As a result, Kubernetes made the runtime layer pluggable
    so that users can pick the best container runtime for their requirements. And
    the best part about it… as long as the new container runtime works with `OCI`
    images, which almost all of them do, everything keeps working and no changes are
    needed to existing container images.


    If the OCI image spec didn’t exist, users and projects would lack the confidence
    to make changes like this as the risk of interoperability issues would be too
    high.


    The OCI operates under the umbrella of the Linux Foundation and is made up of
    volunteers from major cloud native and container-focussed companies. Its goal
    is to provide lightweight governance and standards for low-level container-related
    technologies.


    Other standards that have been instrumental in the Kubernetes ecosystem include
    the following:


    * Container Runtime Interface (`CRI`)

    * Container Network Interface (`CNI`)

    * Container Storage Interface (`CSI`)

    * Service Mesh Interface (`SMI`)


    These are all instrumental in standardising important low-level components of
    Kubernetes so that ecosystem partners can develop products and be confident they’ll
    work as expected. It also creates environments and tools that are swappable and
    prevent vendor and product lock-in. You’ll learn about each of these later in
    the book.


    ## Chapter summary


    In this chapter, you learned that being `cloud native` is a lot more than running
    your apps in the public cloud. In fact, cloud native is a combination of technologies
    and behaviors. The technologies include platforms like Kubernetes, as well as
    microservices applications that run as containers and serverless functions. The
    behaviors include a mindset that’s open to change, as well as a culture that’s
    open to acting quickly and investing in the right people and technologies. Open
    standards are also key bringing the kind of stability and confidence required
    for a strong ecosystem of tools to emerge.


    ## Exam essentials


    ### Autoscaling


    `Autoscaling` is the ability for applications and infrastructure to automatically
    grow and shrink to meet demand. When demand goes up, more application instances
    and more infrastructure can be dynamically added to the environment. When demand
    drops, application instances and infrastructure can be removed. Kubernetes has
    a horizontal pod autoscaler to add and remove application instances to meet demand.
    It also has a cluster autoscaler that integrates with cloud platforms to add and
    remove nodes to meet infrastructure requirements. Metrics are used to make scaling
    decisions. Basic metrics include CPU and memory, whereas custom application metrics
    include things such as queue length and request response time.


    ### Serverless


    `Serverless` is a modern event-driven computing model where small functions are
    associated with specific events and only execute when those events occur. Sometimes
    we call it Function as a Service (`FaaS`) and many public clouds offer proprietary
    serverless platforms where you upload your functions, associate them with events,
    and only pay for the time your functions execute. Open-source serverless platforms
    include `OpenFaaS` and `Knative`.


    ### Community and governance


    The cloud native community is a large and thriving open-source community that
    actively develops and maintains important cloud native technologies such as Kubernetes.
    While these communities are amazing, the projects need strong governance to keep
    the community focussed and the projects heading in the right direction. The major
    source of governance in the cloud native ecosystem is the Cloud Native Computing
    Foundation (`CNCF`). It was founded in 2015 and defines three stages of project
    maturity – sandbox, incubating, and graduated. Projects have to prove their maturity
    to progress through the stages, and each stage is designed to guide projects towards
    further maturity. Kubernetes, and over 15 other projects, have graduated the `CNCF`.


    ### Roles and personas


    An important step towards being cloud native is hiring the right people into the
    right roles. People need to have strong open mindsets and not be afraid to try
    new things and occasionally fail. Hopefully the failures will be in test and development
    environments, but it’s vital that people are open to trying lots of new things
    and failing along the way. As well as hiring the right people, they have to be
    hired into the right roles with the full support of senior management. For example,
    `DevOps Engineers` need to be free and authorised to implement DevOps practices
    and use DevOps tools. There’s no point hiring the right person and giving them
    the title of `DevOps Engineer` if your company culture and senior management won’t
    allow them to carry-out their role.


    ### Open standards


    `Open standards` are vital in two very important areas. They give developers confidence
    the products they build will work as expected and integrate well with other tools.
    They also help prevent technology lock-in by encouraging large ecosystems with
    lots of compatible choice. The Open Containers Initiative (`OCI`) has created
    three container-related standards that have helped the container ecosystem grow.
    Thanks to the `OCI` there is a lot of choice for container runtimes, container
    image build tools, and registries.


    ## Recap questions


    See Appendix A for answers. Page 159 in the paperback edition.


    **1.** Which of the following is another term for resiliency?


    * 1. Automation

    * 2. Self-healing

    * 3. Robustness

    * 4. Autoscaling


    **2.** Which of the following can be resilient?


    * 1. Only applications

    * 2. Only infrastructure

    * 3. Applications and infrastructure


    **3.** Which of the following is true about designing cloud native applications?


    * 1. They should be designed to expect failures

    * 2. They should be designed so failures cannot happen

    * 3. They should be designed to shut down when failures happen

    * 4. They should become read-only when failures happen


    **4.** Which of the following design principles is key to resilient apps?


    * 1. Tight coupling

    * 2. Over coupling

    * 3. Loose coupling

    * 4. Mesh coupling


    **5.** What is the name for the process of synchronising observed state with desired
    state?


    * 1. Re-distribution

    * 2. Realignment

    * 3. Retribution

    * 4. Reconciliation


    **6.** Which of the following is commonly used as an application health-check
    endpoint?

