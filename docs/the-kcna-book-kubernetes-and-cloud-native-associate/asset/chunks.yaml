    fact, sometimes we call resiliency “self-healing”.


    A simple infrastructure example is a node pool. Most cloud platforms let you create
    a pool of virtual servers called a node pool. If you configure one with 10 virtual
    servers, and one of them fails, the system can self-heal by spinning up a new
    node and automatically adding it to the pool.


    Kubernetes offers self-healing capabilities for applications **and** infrastructure.
    For example, if Kubernetes knows you need 5 containers for a web front-end microservice,
    and one of them fails, it spins up a new one so you still have 5\.


    Although these are simple examples, combining resilient applications with resilient
    infrastructure is extremely powerful.


    ### Loose coupling and building for failure


    A key principle when designing resilient systems is to expect things to fail.
    This forces you to build stuff that can handle failures. A popular and battle-tested
    infrastructure example is disk mirroring. This is where two copies of the same
    data are written to two separate storage devices. When one of them fails, you
    can still access the data and no downtime or data loss is incurred. The key word
    from the previous sentence is *when*, not *if* – *when one fails* not *if one
    fails*.


    Modern microservices applications should be designed and built in the sure knowledge
    that components will fail from time to time. Simple tactics to deal with this
    include loose coupling of microservices and consuming via APIs. That’s a lot of
    buzzwords, so this non-technical analogy should help.


    Imagine you’ve bought a product that shipped with a missing part. An option is
    to contact the customer services team. To do this, you call a generic phone number
    and speak to Mia who opens a support case and ships the missing part. Two days
    later it still hasn’t arrived, so you call back. This time Ross answers the phone
    and you ask to speak to Mia. Unfortunately, she’s on vacation for a week, so you
    give your case number to Ross. He’s able to help you because your case details
    are stored on an external shared system the whole team has access to. In this
    example, you’re *loosely coupled* with the customer services team via a generic
    phone number and your case notes are stored on a separate system the entire team
    can access. This means you can speak to any member of the customer services team
    and they can help you with your case.


    A *tightly coupled* version of the same scenario might look like this. You’ve
    bought a product that arrived with a missing part. You call Mia, from the customer
    service team, on her direct phone number. She records some case notes on her laptop
    and ships the missing part. Two days later it still hasn’t arrived, so you call
    her back. However, her phone keeps going straight to messages. After two days
    of trying to contact Mia you manage to find the phone number of another member
    of the customer support team called Ross. You call him on his direct phone number
    and he explains he can’t access your case notes because they’re on Mia’s laptop
    and she’s taken it home with her. In this scenario you were tightly coupled to
    a specific member of the support team and things fell apart when your person wasn’t
    there.'
