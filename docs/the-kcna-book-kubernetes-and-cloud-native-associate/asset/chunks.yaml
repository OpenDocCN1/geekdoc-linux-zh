    ## Primer


    Google has been running Search and Gmail on billions of containers per week for
    a lot of years. This is massive scale and they needed help. So, they built a couple
    of in-house tools called `Borg` and `Omega` to help. The rest of the world encountered
    similar challenges when Docker made containers popular. Even though we weren’t
    doing things at the same scale as Google, we still needed tools to help. At around
    the same time that Docker made containers popular, a group of technologists at
    Google were building a new container orchestration tool. It was based on lessons
    learned from `Borg` and `Omega`, and in 2014 they released it as an open-source
    project called “Kubernetes”.


    So, Kubernetes is a platform for scheduling and managing containers at scale.
    It brings features such as self-healing, autoscaling, and zero-downtime rolling
    updates. It was originally built inside of Google and released the community as
    an open-source project in 2014. Since then, it’s become the industry-standard
    container orchestrator, it’s the second biggest open-source project on GitHub,
    and it was the first project to graduate the CNCF.


    Although Kubernetes is primarily a container orchestrator it can also orchestrate
    virtual machines and serverless functions. The `KubeVirt` project allows Kubernetes
    to manage virtual machines, and the `Knative` and `OpenFaaS` projects enable serverless
    workloads to run on Kubernetes.


    Kubernetes is currently the central project at the heart of a thriving ecosystem
    with many other projects plugging into it, expanding its capabilities, and providing
    additional services. Some examples include.


    * KubeVirt

    * Knative

    * OpenFaaS

    * The Container Network Interface (CNI)

    * Prometheus

    * Linkerd

    * Harbor


    As already mentioned, `KubeVirt` extends Kubernetes so it can manage virtual machines,
    whereas `Knative` and `OpenFaaS` make Kubernetes able to manage serverless functions.


    The `CNI` makes Kubernetes networking pluggable so that other technologies, such
    as `Cilium`, can bring advanced networking. `Prometheus` adds advanced monitoring,
    `Linkerd` brings service mesh capabilities, and `Harbor` implements a container
    registry. Finally, the name “Kubernetes” comes from the Greek word for helmsman.
    You’ll also see the name shortened to `K8s` which is pronounced “kates”. In this
    abbreviation, the number `8` represents the eight letters removed from the name.


    ### Kubernetes primer quiz


    **1.** Which of the following is a reason for deploying Kubernetes? Choose one
    answer.

    * 1. To manage on-premises networks and storage

    * 2. As DevOps tool for build and test pipelines

    * 3. To help manage container applications at scale

    * 4. As an open-source alternative to proprietary cloud platforms


    **2.** Which of the following features can Kubernetes bring to containerised applications?
    Choose correct answers.

    * 1. Encrypt network traffic

    * 2. Self-healing

    * 3. Zero-downtime rolling updates

    * 4. Autoscaling


    **3.** How does the `KubeVirt` project extend Kubernetes?

    * 1. Allows you to slice a single cluster into multiple clusters

    * 2. Allows Kubernetes to schedule virtual machine workloads

    * 3. Lets you run serverless workloads

    * 4. Lets you run Kubernetes in on-premises environments


    **4.** Which of the following community projects provides Kubernetes-native monitoring
    and logging?

    * 1. Linkerd

    * 2. Docker

    * 3. Harbor

    * 4. Prometheus


    **Answers.** 1:C, 2:B,C,D, 3:B, 4:D.


    ## Simple Kubernetes workflow


    Application developers write code that gets packaged as container images and hosted
    in a registry.


    For a container to run on Kubernetes it must be wrapped in a `pod`. This is done
    by describing the container in a pod manifest file that you post to the Kubernetes
    API server where the request is authenticated and authorised. Assuming these checks
    pass, the pod definition is persisted to the cluster store and the scheduler allocates
    the pod to a node. The `Kubelet` service on the assigned worker node tells its
    container runtime to download the required image and start it as a container.


    There’s quite a lot of jargon in those paragraphs and we’ll explain it all throughout
    the rest of the chapter.


    ### Kubernetes workflow quiz


    **1.** True or false, Containers can be directly scheduled to Kubernetes?

    * 1. True

    * 2. False


    **2.** Which Kubernetes node component downloads container images and starts containers?

    * 1. Kubelet

    * 2. Container runtime

    * 3. API server

    * 4. Scheduler


    **Answers.** 1:B, 2:B.

