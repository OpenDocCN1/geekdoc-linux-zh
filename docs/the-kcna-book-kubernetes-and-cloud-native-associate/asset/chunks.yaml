    Consider the following example. You’re using GitOps to manage a live Kubernetes
    environment. However, a team member who isn’t fully onboard with the GitOps process
    makes a manual change to the live environment. This is an `anti-pattern` and causes
    the state of the live environment to drift from what is defined in the Git repo.
    Later the same day, you follow the GitOps process of testing a change in a feature
    branch and creating a PR to merge it. When the PR is approved, your changes are
    merged and the CD pipeline automates deployment to the live environment. The process
    will apply the entire configuration to the live environment and overwrite the
    manual change made by your teammate.


    Let’s look a bit closer.


    Assume the config files in your GitHub repo specify Kubernetes objects such as
    pods, services, and network policies. You’ve been following your GitOps process
    and the live environment exactly matches the configuration stored in the GitHub
    repo. However, an application starts experiencing an issue, so a teammate logs
    on to a live system and manually updates a live network policy that resolves the
    issue. While this might seem like a good idea at the time, the live environment
    no longer matches the configuration in the GitHub repo and can become a problem
    later.


    Later the same day, you follow the GitOps process to deploy a new set of application
    pods and you create a PR to merge the change. The PR is approved and merged to
    the `master` branch, your GitOps tool observes the change and triggers the CD
    workflow. Even though you only added new application pods, the entire configuration
    from the repo will be re-applied to the environment. This means network policies
    will also be re-applied and will overwrite your teammate’s manual fix. This is
    why it’s extremely important everybody buys into the GitOps process and you stop
    allowing manual changes to live environments.


    > **Jargon busting.** An `anti-pattern` is something that seems like a good idea
    at the time but is actually a bad idea.


    ### Important GitOps tools and projects


    As previously mentioned, GitOps inspired a new generation of continuous delivery
    tools that integrate with Git workflows. We’ll briefly describe the following
    and you may be tested on them in the exam.


    *   `Flux`

    *   `Argo`

    *   `Jenkins X`


    `Flux` (sometimes called `FluxCD` or `Flux CD`) is an easy-to-use Kubernetes-native
    application that synchronises Kubernetes state with config files in a Git repo.
    It started as a Weaveworks project and is now an incubating CNCF project. You
    install it on a Kubernetes cluster and configure it to watch a Git repo for changes.
    “Watching” a repo is a pull-based model where `Flux` periodically checks the repo
    and synchronises any changes with the live Kubernetes environment. `Flux` is known
    for being extremely simple to use and is entirely focussed on CD to the Kubernetes
    cluster (it doesn’t do CI). It can only watch one Git repo and can only deploy
    to one Kubernetes cluster and namespace. This makes it easy to install and configure
    but means it’s less configurable than some other tools.


    `Argo` (sometimes called `ArgoCD` or `Argo CD`) is a lot like `Flux`. It’s a declarative
    GitOps tool designed for Kubernetes that was originally developed at Intuit and
    is currently an incubating CNCF project. It’s also installed as a Kubernetes-native
    app, is pull-based, and focuses on CD. An advantage it has over `Flux` is that
    a single `Argo` installation can monitor multiple Git repos and deploy to multiple
    Kubernetes namespaces. This can make it feel like the “Pro” version of `Flux`.


    `Jenkins X` is a Kubernetes focussed GitOps tool that covers the entire CI/CD
    process. Under-the-hood it’s a collection of other open-source tools that are
    nicely packaged and relatively simple to deploy. However, it’s a lot more complex
    than `Argo` and `Flux`.


    In summary, GitOps combines infrastructure as code, Git workflows, and CD pipelines
    to automate infrastructure provisioning. In fact, GitOps is often considered “infrastructure
    as code done properly”. You define the desired state of your infrastructure in
    declarative configuration files that you store in a Git repo. The repo becomes
    the source of truth for your environment, meaning any time a PR is merged to the
    `master` branch of the repo the CD pipeline deploys it. It enables frequent and
    reliable deployments as well as ensuring manual changes are overwritten with each
    merge. The native version control keeps a history of every change that can be
    used for fast and reliable rollbacks as well as auditing. This audit history includes
    all pull requests, comments, and approvals. Finally, large numbers of people can
    work on changes in their own feature branches, but you can limit the number of
    people who can approve merges. It’s also vital that everyone adopts the GitOps
    process and stops making manual changes to live environments.


    ### Chapter summary


    In this chapter, you learned that CI/CD automates the building, testing, and deployment
    of software and infrastructure. CI deals with automating the early steps of building
    and testing code, and then publishing it to repositories. CD takes the built and
    tested artefact and automates the process of deploying it to live environments.
    GitOps builds on this by adding version control, pull requests, and approvals
    that trigger the CD process. GitOps is particularly powerful in Kubernetes environments
    where everything is declaratively described in YAML configuration files that are
    used to configure the environment. Popular GitOps tools include `Argo`, `Flux`,
    and `Jenkins X`.


    ### Exam essentials


    **Continuous integration, continuous delivery (CI/CD)**


    `CI/CD` is a set of tools and practices focussed on automating the steps taking
    software from code to production. It’s a key part of DevOps practices and enables
    fast, repeatable, and reliable testing and deployment. It also gives developers
    more time to work on features and fixes. The automated steps are often referred
    to as a `pipeline`.


    **Continuous integration (CI)**


    `CI` is focussed on automating software builds and tests. A developer will typically
    merge code to a repo with a particular tag that kicks-off an automated pipeline
    that builds the software and runs tests against it. It’s common to spin-up the
    build in a container and perform the tests. The code that passes the tests gets
    passed on to later CD stages.


    **Continuous delivery (CD)**


    `CD` is focussed on automating the delivery of software and infrastructure to
    live environments. It typically runs after CI processes and only deploys “good
    code”. Good code is code that passed CI tests.


    **Infrastructure as Code (IaC)**


    `Infrastructure as Code` is the practice of defining infrastructure in configuration
    files and using a platform to provision it. It’s extremely popular in Kubernetes
    environments where all Kubernetes objects can be defined in YAML manifest files
    that are used to provision Kubernetes apps and infrastructure. IaC is particularly
    powerful in Kubernetes environments running on public clouds as the entire infrastructure
    stack can be described and deployed from config files.


    **GitOps**


    `GitOps` takes infrastructure as code and adds version control, approvals, and
    CD pipelines. A typical GitOps workflow will have a GitOps tool monitoring a Git
    repo for merges. Any time software or infrastructure configs are merged, the GitOps
    tool kicks-off a CD pipeline that deploys the update to the live environment.
    A new breed of CD tools, including `Argo`, `Flux`, and `Jenkins X` are popular
    GitOps tools. Many people consider GitOps to be IaC done properly.


    ## Recap questions


    See Appendix A for answers.


    **1.** Which of the following terms refers to the process of updating an application
    from version 1.1 to 1.2? Choose all correct answers.


    *   1. Release

    *   2. Rollup

    *   3. Rollout

    *   4. Rollback


    **2.** Which of the following is a description of continuous integration (CI)?


    *   1. Automating the deployment of updates to dev and test environments

