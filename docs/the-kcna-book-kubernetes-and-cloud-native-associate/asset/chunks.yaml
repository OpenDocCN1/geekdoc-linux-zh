    ## Chapter summary


    Kubernetes is a container orchestrator originally developed at Google and open-sourced
    and donated to the CNCF in 2014. It was the first project to graduate the CNCF
    and is now the industry-standard orchestrator and second biggest project on GitHub.
    It can also orchestrate virtual machines and serverless functions.


    A Kubernetes cluster consists of one or more control plane nodes and one or more
    worker nodes. Control plane nodes run the `API server`, cluster store, scheduler,
    controllers, and the API itself. Worker nodes are where user applications run
    and have a `kubelet`, container runtime, and `kube-proxy`.


    The `API server` exposes the API over a RESTful HTTPS interface and requires high-performance
    control plane nodes. All internal and external Kubernetes traffic goes through
    the `API server`. The cluster store is the only stateful part of the control plane
    and is where the state of the cluster and applications is persisted. The scheduler
    assigns pods to worker nodes, and controllers ensure the observed state of the
    cluster always matches desired state.


    Every worker node runs a `kubelet` that watches the `API server` for new work
    and tells the container runtime which containers to start and stop. The `kube-proxy`
    implements networking rules to ensure traffic to Kubernetes services reaches the
    right pods and containers.


    Namespaces are a great way to divide a single cluster into virtual clusters for
    sharing between different teams and departments. Every namespace can have its
    own resource quotas and user accounts, but you shouldn’t use them as workload
    boundaries.


    Finally, Kubernetes uses 3rd party plugins to implement an open flat pod network
    that you should lock down with network policies.


    ## Exam essentials


    ### Kubernetes

    `Kubernetes` is the industry-standard orchestrator for containerised apps. It
    was initially developed at Google and is now an open-source project under active
    development on GitHub. It’s deployed as a cluster of control plane nodes and worker
    nodes that provide scheduling, self-healing, autoscaling, and more. Third-party
    projects have extended its capabilities to include orchestration of virtual machines,
    serverless functions, and much more.


    ### Pods

    `Pods` are the atomic unit of scheduling on Kubernetes. Developers write applications,
    package them as containers, and then wrap those containers in pods to run on Kubernetes.
    A Pod can wrap one or more containers, and all containers in a pod are guaranteed
    to be scheduled on the same node. The pod also acts as a shared execution environment
    for containers. This means two containers in the same pod have access to the same
    volumes and networking. If you want to scale an app, you add more pods.


    ### Sidecar containers

    The multi-container pod model usually has a main application container and a helper
    container. The helper container is called a `sidecar` and has enabled powerful
    patterns and innovations. For example, service mesh technologies work by injecting
    a sidecar container into the same pod as applications containers. The sidecar
    can intercept all network traffic and transparently encrypt and decrypt it. It
    can also expose rich network telemetry that can be used to better understand and
    optimize traffic flow. Many other solutions use sidecars.


    ### Control plane nodes

    `Control plane nodes` are where all control plane services run. In fact, every
    control plane service runs on every control plane node for high availability.
    They can be physical servers, virtual machines, and even cloud instances, and
    you should run either 3 or 5 for high availability. You should also spread them
    across failure domains. If you’re running a hosted Kubernetes cluster, the control
    plane nodes will be managed by your cloud platform.


    ### The Control plane

    `The control plane` is the collection of services that comprise the intelligence
    of Kubernetes. The services include the `API server`, `scheduler`, cluster store,
    `API`, and controllers. Each service is highly specialised and does one thing.
    All control plane services run on all control plane nodes.


    ### API server

    The `API server` exposes the Kubernetes API as a RESTful endpoint over HTTPS.
    It’s a service that runs as part of the control plane and is the central hub of
    Kubernetes communication. For example, all commands and requests issued to Kubernetes
    are sent to the `API server`. Even internal control plane services can only send
    messages to each other via the `API server`.


    ### Scheduler

    The `scheduler` is a control plane service that assigns pods to worker nodes.
    It implements advanced logic that let it make intelligent decisions about which
    nodes are the best choice for pods.


    ### Cluster store

    The `cluster store` is the only stateful part of the control plane and is where
    the state of the cluster and apps is kept. It’s usually based on the `etcd` distributed
    database, and a copy runs on each cluster node.


    ### Controllers

    `Controllers` run as part of the control plane as background reconciliation loops
    that ensure the observed state of the cluster matches desired state. That’s jargon
    for making sure what is running on the cluster is what you asked for. Kubernetes
    implements several controllers, and each one is highly specialised. Common controllers
    include the deployment controller, the statefulset controller, the DaemonSet controller,
    and the job controller.


    ### Deployment controller

    The `deployment controller` is probably the most widely used Kubernetes controller.
    It deploys and manages stateless workloads and provides cloud native features
    such as resiliency, autoscaling, and zero-downtime rolling updates.


    ### StatefulSet controller

    The `StatefulSet controller` manages stateful workloads and provides cloud native
    features such as resiliency, autoscaling, and updates. It also implements things
    like ordered startups, ordered shutdowns, and persistent naming. These might be
    useful to stateful apps.


    ### DaemonSet controller

    The `DaemonSet controller` can be used to guarantee an instance of a particular
    pod will always be running on every cluster node. If new nodes are added to the
    cluster, the DaemonSet controller will notice this and automatically start an
    instance of the pod on the new node. A typical use case is ensuring a logging
    agent is running on every cluster node.


    ### Worker nodes

    `Worker nodes` are clusters nodes where user applications run. They don’t run
    any control plane services, but they do run a `kubelet`, container runtime, and
    `kube-proxy`. You should spread worker nodes across failure domains to help the
    scheduler keep applications highly available.


    ### Kubelet

    The `kubelet` is the main Kubernetes agent running on every worker node. It watches
    the `API server` for new pods to run and reports back on status. It also makes
    container logs available to the `kubectl logs` command.


    ### Container runtime

    `Container runtime` software takes instructions from the local `kubelet` to start
    and stop containers on the local node. Older Kubernetes clusters always used Docker
    as the container runtime, but newer clusters implement the Container Runtime Interface
    that lets administrators choose the best container runtimes to suite their requirements.


    ### Kube-proxy

    `Kube-proxy` is a service on every cluster node that implements the networking
    rules that enable traffic sent to services to reach pods.


    ### kubectl

    `kubectl` is the Kubernetes command line utility. It’s available on many operating
    systems and platforms.


    ### Kubeconfig

    The `kubeconfig file` tells `kubectl` which clusters it can talk to and which
    user accounts to authenticate with. It’s normally just called `config` and lives
    in the hidden `.kube` folder of you home directory.


