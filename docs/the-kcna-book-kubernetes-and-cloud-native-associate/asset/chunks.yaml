  trans: '

    微服务应用通常运行在 `Kubernetes` 等平台上，并具备自愈、伸缩和滚动发布等云云原生能力。所有这些操作都会从 IP 网络中添加和删除容器，导致 IP
    地址的变动频率比大多数网络的设计要高得多——这有时被称为 `IP churn`（IP 抖动）。


    这一切需要一种全新的容器网络模型和新一代网络工具。


    ### Kubernetes 与容器网络


    Kubernetes 实现了一个名为 `pod network` 的开放扁平网络。这是容器运行的地方，跨越了整个 Kubernetes 集群中的所有节点。让我们仔细观察一下它的一些能力。


    Kubernetes pod 网络是扁平且开放的。这个专业术语意味着所有容器都可以相互看到并进行通信。这保持了操作的简单性，并使得容器之间的流量变得容易处理。然而，你应该使用
    Kubernetes 网络策略来控制流量。这包括限制哪些容器和服务之间可以相互通信——让所有内容都相互通信是一个重大的安全风险。


    Kubernetes 还实现并自动化了服务发现。所有新应用都会自动将其名称和 IP 地址注册到内部 DNS 中。它们还配置为使用内部 DNS 来查找其他应用。Kubernetes
    使这一过程自动化，从而使得应用程序无需担心如何实现它。


    Kubernetes 还实现了 IP 地址管理 (`IPAM`)，负责为新容器分配 IP 地址，并对已终止和失败容器的 IP 地址进行垃圾回收。这通过确保
    DNS 永远不会解析不再运行的容器的 IP 地址，保持了系统的实时性。


    Kubernetes 在网络可观测性和追踪方面没有强大的能力。可观测性是查看网络正在发生的情况并可能对流量进行故障排除或优化的能力。追踪是在请求应用程序的不同微服务之间传递时跟踪它们。对于这些能力，你应该考虑服务网格（service
    mesh）。


    最后，Kubernetes pod 网络是由网络插件实现的，你可以选择一个最适合你要求的插件。例如，并不是所有的网络插件都支持 `IPv4` 和 `IPv6`
    网络。Kubernetes 实现了容器网络接口 (`CNI`) 以使 pod 网络具有可插件性。这与它通过容器运行时接口（CRI）使容器运行时变为可插件的方式类似。


    总结来说，容器和微服务应用为网络带来了一系列新挑战。大量的东西向（east-west）网络流量需要安全保障且需要可观测。云原生特性（如自愈和伸缩）意味着容器频繁地从网络中添加和删除，导致大量的
    IP 抖动。这需要强大的 IP 地址管理和服务发现工具。Kubernetes 实现了一个开放的扁平 pod 网络，你应该用网络策略来保护它。它还提供了强大的
    `IPAM` 和服务发现工具。对于容器之间的流量加密以及对流量流的深度可见性，你应该使用服务网格。


    ### 服务网格


    服务网格自动为云原生应用添加网络安全、可观测性和可靠性，对于大规模生产环境来说至关重要。


    服务网格的一个关键方面是自动添加这些功能的能力。它们通过在平台层而非应用层实现这些功能来实现。这个专业术语意味着你只需要安装服务网格，运行在其上面的每个应用程序就能“直接获得这些功能”。这是一种强大的模型，意味着开发者和单个应用程序甚至不需要考虑这些服务。


    考虑一个需要加密流量的大型微服务应用。如果没有服务网格，你将需要为每个微服务编写代码，使其具备加密和解密流量的智能和证书能力。这增加了每个微服务的复杂性，并让开发者无法专注于开发对客户和业务有益的功能。替代方案是使用服务网格，它可以自动完成所有的加密和解密，而应用程序甚至不知道这些正在发生——服务网格提供了“加密服务”。


    让我们看看服务网格通常在 Kubernetes 上是如何实现的。


    Kubernetes 是一个由控制平面节点和工作节点组成的集群，运行容器化的应用程序。然而，Kubernetes 实际上将容器运行在名为 `pod` 的构造内部。这听起来可能很困惑，但其实不是——pod
    只是一个轻量级的封装，允许 Kubernetes 将多个容器调度为单个单元。服务网格利用这一点，在每个应用程序容器的同一个 pod 中注入一个轻量的服务网格容器。该服务网格容器透明地接管了
    pod 内的网络，并执行诸如对所有进入和离开 pod 的流量进行加密/解密等操作。它还暴露了高级的网络遥测数据，可用于故障排除和优化网络性能。一个关键特性是应用程序容器感知不到服务网格的存在，并像往常一样运行。如图
    3.4


    ![](img/images----figure3-4.png)


    图 3.4


    流行的服务网格包括 `Istio`、`Linkerd` 和 `Consul`。其他网格也存在，但它们都提供类似的功能。Linkerd 是一个 CNCF 毕业项目，而服务网格接口
    (`SMI`) 是一种旨在标准化 Kubernetes 中基础服务网格能力的规范。


    总结来说，服务网格在平台层提供了开箱即用的网络安全和可观测性。这意味着应用程序可以专注于应用本身，而无需关心网络。在 Kubernetes 中，它们通过向应用程序
    pod 注入特殊的服务网格容器来实现这一目标。该服务网格容器处理进入和离开 pod 的网络流量，使其能够透明地保护流量，并暴露高级遥测数据用于故障排除和流量优化。Kubernetes
    有很多服务网格选项，而 `SMI` 是定义通用服务网格能力的行业规范。


    ### 容器存储


    容器被设计为瞬态的且无状态的。瞬态意味着它们被设计为短寿命的，如果它们失败了，你会用新容器替换它们，而不是修复它们。无状态意味着它们从未被设计用于存储数据。事实上，如果一个容器失败，它内部的所有数据都将丢失。


    考虑到这一点，容器应该将数据存储在外部系统中。这是一个非常简单的模型，应用程序代码运行在容器中，而应用程序数据存储在外部。一个运行在 `AWS` 上的简单云示例可能是：业务应用程序代码运行在容器中，其生成的数据存储在
    `AWS` 弹性存储 (`EBS`) 卷中。这样，如果任何应用程序容器失败，数据仍然存在于 `EBS` 卷中。一个类似的本地示例可能是：应用程序代码运行在容器中，其生成的数据存储在共享
    `NetApp` 存储系统的卷中。还存在其他云和存储系统。


    这种模型将数据的生命周期与容器的生命周期解耦，并允许为每个容器化应用程序选择合适的存储后端。该架构如图 3.5 所示。


    ![](img/images----figure3-5.png)


    图 3.5

