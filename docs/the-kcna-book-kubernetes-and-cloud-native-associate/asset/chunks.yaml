    ## Containers and pods


    Let’s clear up some terminology before getting into the detail.


    We sometimes use the terms `container` and `pod` to mean the same thing. However,
    a pod is actually a thin wrapper around one or more containers and is a mandatory
    requirement for any container that wants to run on Kubernetes. This means containers
    **must** be wrapped in a pod if they want to run on Kubernetes. The following
    extremely simple YAML file defines a pod with a single container.


    ```

    1  apiVersion: v1

    2  kind: Pod

    3  metadata:

    4    name: kcna-pod

    5    labels:

    6      project: kcna-book

    7  spec:

    8    containers:     <<==== Container is defined below here

    9      - name: kcna-container

    10       image: <container-image-goes-here>

    ```


    Lines 1-7 give the pod and name and a label. Lines 8-10 show the container definition
    embedded within the overall pod definition. As the container is embedded within
    the pod definition, we say the pod “wraps the container”.


    As well as enabling containers to run on Kubernetes, pods also augment containers
    with all the following features and capabilities:


    * Co-scheduling

    * Shared memory

    * Shared volumes

    * Shared networking

    * Policies

    * Kubernetes intelligence


    Co-scheduling allows you to run multiple containers in the same pod and guarantees
    they’ll always run on the same node. The common model is to have a main application
    container and a helper container. The helper container is usually called a `sidecar`.


    A `logging sidecar` is a special container that runs in the same pod as an application
    container. It collects the application’s logs and ships them to a central location
    for aggregation. This allows the application container to focus on running the
    application while the logging sidecar focuses on handling the logs.


    Service meshes also use pods for co-scheduling. They inject a `proxy sidecar`
    into the same pod as an application container. The sidecar intercepts all network
    traffic and can do things such as encrypt and decrypt traffic, expose detailed
    network telemetry, and optimise network traffic flow. As with the logging sidecar
    example, the application container focusses on running the application while the
    service mesh sidecar focuses advanced network features.


    In both cases, the application container doesn’t even know the sidecar exists.


    Pods are also a `shared execution environment.` This means every container in
    the same pod has access to the same memory, volumes, and network stack. This enables
    helper patterns such as a main web container and a synchroniser sidecar. In this
    example, the web container focusses entirely on serving static content from a
    volume, while the sidecar focusses entirely on syncing the latest content from
    a remote repository and putting it into the shared volume where the web server
    can access it. This works because both containers are in the same pod and have
    access to the same volumes. See Figure 4.1.


    ![](resources/images----figure4-1.png)


    Figure 4.1


    Pods also allow you to attach polices and things like resource requests and resource
    limits. `Resource requests` specify the minimum amount of CPU and memory a pod
    requires to run properly, whereas `resource limits` let you set maximum values.
    They’re extremely important in helping the scheduler assign pods to nodes with
    sufficient resources.


    Figure 4.2 shows two pods. The one on the left is scheduling a single container
    and the one on the right is scheduling two. Both containers in the pod on the
    right have access to the same shared memory, the same shared volumes, and the
    same shared network stack. This means both containers in the pod on the right
    share the same IP address and are accessible via dedicated ports. They’re also
    guaranteed to be scheduled to the same worker node.


    ![](resources/images----figure4-2.png)


    Figure 4.2


    The following declarative YAML file defines a multi-container pod with some advanced
    features. Don’t be overwhelmed if it looks complex, you don’t have to understand
    the detail for the exam. However, you will need to understand the concepts. It’s
    also been annotated to highlight the important parts.


    ```

    1  apiVersion: v1

    2  kind: Pod             <<==== This file is defining a pod

    3  metadata:

    4    name: kcna-pod      <<==== Pod name

    5  spec:

    6    volumes:            <<==== Define a volume both containers can access

    7    - name: html        <<==== Give the shared volume a name ("html")

    8      emptyDir: {}      <<==== Make it an empty volume

    9    runtimeClassName: level1       <<==== Schedule to a node with a specific
    runtime

    10   containers:                    <<==== This block defines two containers

    11     - name: main-container       <<==== This is the main app container

    12       image: <app-image>         <<==== Main app container image

    13       volumeMounts:              <<==== Mount a volume into main app container

    14       - name: html               <<==== Mount the shared “html” volume

    15         mountPath: /usr/share/nginx/    <<=== Mount it here in the container

    16     - name: sidecar              <<==== This is the sidecar container

    17       image: <sidecar-image>     <<==== Sidecar container image

    18       volumeMounts:              <<==== Mount a volume into the sidecar container

    19       - name: html               <<==== Mount the same shared “html” volume

    20         mountPath: /tmp/git      <<==== Mount it here in the sidecar container

    ```


    Lines 1-9 define the pod, whereas lines 10-20 describe two containers. As with
    the previous example, both containers are nested/wrapped within the pod definition.


    Lines 6-8 define a new empty volume called `html`. As it’s part of the pod environment
    it’s accessible to both containers. Line 9 tells Kubernetes to schedule the pod
    to nodes with a particular container runtime. The detail isn’t important, you
    just need to recognise that the pod is bringing features the containers don’t
    natively have.


    Lines 11-15 define the main application container. It mounts the shared `html`
    volume into its local filesystem at `/usr/share/nginx.`


    Lines 16-20 define the sidecar container and mount the same shared `html` volume
    at `/tmp/git.`


    To summarise the YAML file. It describes a multi-container pod. The pod includes
    a runtime class reference to help the scheduler and it defines a shared volume.
    Both containers mount the shared volume and can use it to share data.


    There’s a lot more we could say about pods, but for now, it’s enough to know they’re
    a lightweight wrapper around one or more containers and that you cannot run a
    container on Kubernetes without wrapping it in a pod. We often use the terms `container`
    and `pod` interchangeably, especially when there’s no need to draw a distinction.
    Also, containers in a pod share the same environment and are guaranteed to be
    scheduled to the same node.


    ### Containers and pods quiz


    **1.** Which of the following is the atomic unit of scheduling on Kubernetes?


    * 1.Docker

    * 2.Container

    * 3.Pod

    * 4.Kubelet


    **2.** Which of the following are advantages of deploying containers inside pods?
    Choose all correct answers.


    * 1. Pods allow co-scheduling of containers

    * 2. Pods allow multiple containers to share the same execution environment

    * 3. Pods give dedicated kernels to containers

    * 4. Pods let you apply policies to containers


    **3.** What is a common name for a helper container?


    * 1. Sidecar

    * 2. Sideshow

    * 3. service mesh

    * 4. Supporter


    **4.** What format are Kubernetes manifest files usually written in?


    * 1. Python

    * 2. YAML

    * 3. XML

    * 4. Rust


    **Answers.** 1:C, 2:A,B,D, 3:A, 4:B.

