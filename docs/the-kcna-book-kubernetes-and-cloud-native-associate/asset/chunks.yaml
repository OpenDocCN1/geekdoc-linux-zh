  trans: "\n你刚刚学习了 pods 如何封装一个或多个容器并添加相应的功能。然而，pods 并不具备自愈能力，不会自动伸缩，也不会执行零停机发布等操作。Kubernetes\
    \ 拥有更高层的控制器来封装 pods 并实现这些功能。因此，你几乎总是通过高级别的控制器（如 `deployments` 和 `statefulsets`）来部署\
    \ pods。\n\n你将在本章稍后的部分学习更多关于控制器的知识。但现在，让我们考虑一个部署无状态 Web 服务器的简单示例。\n\n你的开发团队编写了一个无状态\
    \ Web 应用并将其封装为容器。你知道你需要 5 个实例来满足预期需求，而且由于你正在运行 Kubernetes 环境，你需要将每个容器封装在 pod 中。然而，pods\
    \ 并不具有容错性。例如，如果你部署了 5 个独立的 pod，而托管其中 2 个 pod 的节点发生故障，并没有什么智能机制来重新创建它们并确保你始终有 5\
    \ 个。这就是高级别控制器发挥用场的地方。\n\nKubernetes 有一个 `deployment controller`（部署控制器），它接受 pod\
    \ 定义并确保始终运行着指定数量的 pod。\n\n考虑到此，你将 pod 封装在一个 deployment 中，并告诉 Kubernetes 运行它。一旦所有\
    \ 5 个 pod 都启动并运行，部署控制器就会持续监控状态并对故障等事件做出响应。例如，如果一个节点故障并带走了两个 pod，部署将通过启动两个新 pod\
    \ 来保持你的数量维持在 5 个。\n\n你将在稍后学习更多关于控制器的知识，但下面的 YAML 显示了一个简单的部署。注意容器是如何嵌套在 pod 内部的，而\
    \ pod 又嵌套在 deployment 内部。因此，deployment 封装了 pod，而 pod 再次封装了容器。\n\n```\n1  apiVersion:\
    \ apps/v1\n2  kind: Deployment\n3  metadata:\n4    name: kcna-deployment\n5  spec:\n\
    6    replicas: 5\n7    <Snip>\n8    template:\n9      spec:\n10       runtimeClassName:\
    \ level1 \n11       containers:\n12       - name: kcna-pod\n13         image:\
    \ <container-image>\n```\n\n第 1-6 行是部署部分，定义了始终运行的 5 个 pod 副本的期望状态。第 8-10 行定义了\
    \ pod，并包含了你之前看到的运行时类要求。第 11-13 行定义了容器。这如图 4.3 所示。\n\n![](img/images----figure4-3.png)\n\
    \n图 4.3\n\n### Pod 增强功能测验\n\n**1.** 为什么 Kubernetes 实现高级别控制器而不是部署静态 pod？\n\n* 1.\
    \ 它们提供了高级的网络遥测\n* 2. 它们增加了如韧性、伸缩和更新等功能\n* 3. 它们允许 pod 在不同的云平台之间迁移\n* 4. 它们运行 pod\
    \ 的速度更快\n\n**2.** 下面哪个 Kubernetes 控制器确保特定数量的容器始终运行？\n\n* 1. Deployment controller（部署控制器）\n\
    * 2. Job controller（作业控制器）\n* 3. Endpoints controller（端点控制器）\n* 4. Cloud controller（云控制器）\n\
    \n**3.** 下面哪项最能描述 pods 和控制器的架构？\n\n* 1. Pod 规范封装在控制器规范中\n* 2. 控制器规范嵌入到 pod 规范内部\n\
    \n**答案。** 1:B, 2:A, 3:A.\n\n## Kubernetes 架构\n\n我们在这一节将涵盖很多内容，因此我们将它们分成几个小节，以便于理解和查阅。我们将涵盖以下内容：\n\
    \n* 高级 Kubernetes 架构\n* 控制平面 (The control plane)\n* 控制器 (Controllers)\n* 工作节点\
    \ (Worker nodes)\n* `kubectl`\n* 托管 Kubernetes (Hosted Kubernetes)\n\n### 高级 Kubernetes\
    \ 架构\n\n从高层来看，Kubernetes 是一个运行容器化应用程序的节点集群。它运行许多 `controllers` 来实现自愈和自动化发布等功能。\n\
    \nKubernetes 集群中有两种节点。\n\n* 控制平面节点\n* 工作节点\n\n它们都可以是虚拟机、物理服务器或云实例，你可以在同一个集群中混合使用不同类型。\n\
    \n`Control plane nodes` 是 Kubernetes 的大脑。它们运行 API server、调度器和集群存储。它们还运行着实现智能逻辑的控制器。\n\
    \n`Worker nodes` 是用户应用程序运行的地方。每个工作节点都有一个 `kubelet` 和容器运行时。`kubelet` 与控制平面通信，并告诉容器运行时何时启动和停止容器。\n\
    \nKubernetes 命令行工具称为 `kubectl`。\n\n让我们更详细地查看每一个部分。\n\n### 控制平面 (The control plane)\n\
    \nKubernetes 控制平面是运行在每个控制平面节点上的专用独立服务的集合。这些实现了让 Kubernetes 如此特别的智能逻辑。\n\n由于控制平面是每个\
    \ Kubernetes 集群的关键部分，它需要具有高高性能和高可用性。在现实世界中，生产环境的 Kubernetes 集群通常运行跨多个故障域的 3 或\
    \ 5 个控制平面节点。这意味着控制平面节点或任何支持基础设施的故障都不会导致整个控制平面的崩溃。你还应该确保控制平面节点通过低延迟的可靠网络连接。\n\n\
    运行奇数数量的控制平面节点是非常重要的，运行 1 个比运行 2 个要好。这是因为偶数更有可能导致“脑裂”场景，即发生网络故障时，网络故障两侧的控制平面节点数量相等。如果发生这种情况，任何一方都无法确定自己是否拥有多数派权。\n\
    \n如果控制平面真的宕机了，已经在运行的应用程序将继续工作，但你将无法进行任何更改或更新。\n\n主要的控制平面服务包括以下所有项，它们都运行在每个控制平面节点上。\n\
    \n* API server\n* 调度器 (Scheduler)\n* 集群存储 (Cluster store)\n* 控制器 (Controllers)\n\
    \n`API server` 是 Kubernetes 进出的网关。当你向 Kubernetes 发命令时，你是将命令发送给 API server。当你查询某个对象的状态时，你是将查询发送给\
    \ API server。此外，每个工作节点上的 `kubelet` 监控 API server 的新任务分配，并向 API server 报告状态。基本上，Kubernetes\
    \ 中的一切都通过 API server。这需要高性能的控制平面节点，以便 API server 能够快速响应请求。\n\n`Scheduler`（调度器）负责决定在哪些节点上运行\
    \ pod。它可以将 pod 调度到具有 CPU 和内存的节点上，可以将它们分布在不同的可用区，甚至可以将它们目标指向特定节点或避开特定节点。\n\n`Cluster\
    \ store`（集群存储）是存储集群状态的地方，它是整个控制平面中唯一有状态的组件。这意味着它是唯一创建并存储不能丢失的重要集群相关数据的组件。例如，如果你部署一个需要\
    \ 5 个特定 pod 实例的应用程序，这将被存储在集群存储中，并供控制器和其他组件作为参考。集群存储基于 `etcd` 分布式数据库。\n\n`Controllers`（控制器）监控集群的当前状态并采取行动以确保其与期望状态保持同步。再次，作为一个简单的示例，你可能请求运行\
    \ 5 个运行 Web 服务器容器的 pod——这就是期望状态。如果发生故障导致 pod 数量减少到 3 个，控制器会观察到变化并启动 2 个新 pod，以使观测状态恢复到与期望状态同步。我们稍后将详细解释这一点。\n\
    \n"
- fmt: '

    Kubernetes runs a set of specialised controllers that implement most of the intelligence
    that makes Kubernetes so powerful. Each one runs as a `reconciliation loop` that
    watches the cluster and ensures `observed state` is in sync with `desired state`.


    We’ll briefly mention some of the more important controllers and then walk through
    an example.


    ### Deployment controller

    The `Deployment controller` implements the intelligence and features required
    to run stateless apps on Kubernetes. For example, it can ensure 5 replicas of
    a web service are always running. If one fails, the controller starts a new one.
    It also implements the intelligence for zero-downtime rolling updates and more.


    ### StatefulSet controller

    The `StatefulSet controller` is similar to the deployment controller but it specialises
    in `stateful` workloads. For example, it deploys and self-heals a desired number
    of pods just like the deployment controller does. However, it also implements
    things like `ordered startups` and `ordered shutdowns` that might be important
    to stateful apps that write to shared data stores.


    ### DaemonSet controller

    The `DaemonSet controller` ensures a single instance of a particular pod is always
    running on every node of the cluster. A common example is logging, where it’s
    common to need an agent running on every cluster node to collect and ship logs.
    The DaemonSet controller will ensure an instance of the agent pod runs on every
    node in the cluster. This includes automatically starting pods on any new nodes
    added to the cluster. It can also restart or replace pods that fail.


    There are a lot more controllers, but they all operate as `reconciliation loops`
    that watch the cluster and make sure `observed state` matches `desired state`.


    Consider the following example. You have a new app that needs 5 stateless web
    pods running v1.3 of your code. You describe this requirement in a declarative
    manifest file that you post to the API server. This gets recorded in the cluster
    store as your `desired state` and the scheduler assigns the 5 pods to worker nodes.
    The deployment controller operates on the control plane as a background reconciliation
    loop making sure observed state matches desired state – in this example it’s making
    sure the 5 web pods are always running. If observed state matches desired state
    it just keeps watching the cluster. However, if a node running one of the pods
    fails, the deployment controller will observe 4 web pods and realise it doesn’t
    match the desired state of 5. It will fix this by instructing the scheduler to
    start a new pod on a surviving node. This will bring observed state back into
    sync with desired state and is an example of `resiliency` or `self-healing`.


    Sticking with the same example, assume you want to update all 5 web pods from
    v1.3 to v1.4. You do this by updating the same declarative manifest file to specify
    the new version and post it to the API server again. This registers a new desired
    state of 5 web pods running v1.4. The deployment controller will observe 5 web
    pods running v1.3 and compare that to desired state which now wants 0 pods running
    v1.3 and 5 pods running v1.4. It will respond by replacing the 5 pods running
    v1.3 with 5 running v1.4. This is an example of a rollout.


    > **Jargon busting.** We often say that controllers operate as `control loops`,
    `watch loops` or `reconciliation loops`. They all mean the same thing. We also
    use the terms `current state`, `actual state` and `observed state` to mean the
    same thing. Finally, the process of bringing current state back into sync with
    desired state is called `reconciliation`.


    ### Worker nodes

    Worker nodes are where user applications run. They can by physical servers, virtual
    machines, or cloud instances, and a single Kubernetes cluster can run a mix of
    any.


    All workers run three important services:

    * Kubelet

    * Container runtime

    * Kube-proxy


    The `kubelet` is the main Kubernetes `agent` on the node. It watches the API server
    for new work assignments, tells the container runtime which containers to start
    and stop, and reports status info back to the API server. It also does other things
    such as making container logs available to the `kubectl logs` command.


    Older Kubernetes clusters used Docker as their container runtime. However, that
    layer is now pluggable, meaning cluster administrators can choose the best container
    runtime for their requirements. At the time of writing, most new Kubernetes clusters
    use `containerd` (pronounced “container dee”) as their container runtime but many
    others exist. In fact, a single cluster can run different runtimes on different
    worker nodes as shown in Figure 4.4.


    ![](resources/images----figure4-4.png)


    Figure 4.4


    The technology making the container runtime layer pluggable in Kubernetes is the
    `Container Runtime Interface (CRI)`. The following list is some of the more common
    container runtimes.

    * `Containerd` (popular on new clusters)

    * `CRI-O` (default on RedHat OpenShift clusters)

    * `gVisor` (provides additional isolation between container and host OS)

    * `Kata containers` (runs every container in a lightweight VM)

    * `Docker` (the original, but deprecated since K8s 1.20)


    The final piece of the worker node is the `kube-proxy`. This implements networking
    so that traffic can successfully reach pods.


    ### kubectl

    `kubectl` is the Kubernetes command-line tool and is available for most platforms,
    including Linux, MacOS, and Windows.


    You install it on a machine, configure its config file, and use it to manage remote
    Kubernetes clusters. It can do all of the following:

    * Get cluster information

    * Deploy objects such as pods and services

    * Query the state of objects

    * Read logs

    * Execute commands inside of containers


    It has a configuration file called `config` that’s normally located in your home
    folder in a hidden directory called `.kube`. You’ll often hear it referred to
    as your `kubeconfig` file, and it contains a list of known clusters and credentials
    required to connect to them. The following are common kubectl commands:


    * `kubectl get <object>`

    * `kubectl describe <object>`

    * `kubectl apply <filename>`

    * `kubectl delete <filename | object>`

    * `kubectl api-resources`


    `kubectl get` commands return brief information about a resource type. For example,
    the following command returns info about a pod called `web-fe`.


    ```

    $ kubectl get pod web-fe

    NAME       READY   STATUS    RESTARTS   AGE

    web-fe     1/1     Running   0          29m

    ```


    The following `kubectl describe` command returns more detailed information about
    the same pod.


    ```

    $ kubectl describe pod web-fe

    Name:         web-fe

    Namespace:    default

    Priority:     0

    Node:         prod-cluster/192.168.65.4

    Start Time:   Wed, 9 Feb 2022 21:43:01 +0000

    Labels:       project=kcna-book

    Annotations:  <none>

    Status:       Running

    IP:           10.1.0.107

    <Snip>

    ```


    The preferred way to deploy objects to Kubernetes is to describe them in a YAML
    manifest file and deploy them with `kubectl apply` or `kubectl create`. The following
    command deploys the objects defined in a file called `web-deploy.yml`.


    ```

    $ kubectl apply -f web-deploy.yml

    deployment.apps/kcna-deploy created

    ```


    The `kubectl delete` command deletes objects. You can give it an object type and
    name, or you can give it a manifest file. If you give it an object type and name,
    it will delete that object. If you give it a YAML manifest file, it will delete
    everything defined in the file. See the following examples.


    ```

    $ kubectl delete pod web-fe

    pod "web-fe" deleted


    $ kubectl delete -f web-deploy.yml

    deployment.apps "kcna-deploy" deleted

    ```


    The following command displays a list of all resources you can deploy on your
    cluster.

