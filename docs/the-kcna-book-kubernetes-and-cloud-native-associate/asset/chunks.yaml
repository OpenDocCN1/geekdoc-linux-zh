    从高层级来看，容器比虚拟机更轻量。这意味着同一台服务器可以运行比虚拟机数量得多的容器。由于两者都是运行应用程序的技术，容器允许你可以在服务器上运行更多的应用程序。例如，一台可以运行
    10 台虚拟机的服务器可能可以运行 50 个容器。这为机构节省了巨额成本——你运行应用程序需要更少的基础设施。轻量化也意味着容器的启动速度比虚拟机更快，并且更容易进行打包和共享。


    ## 容器工作流


    以下列表显示了将应用程序作为容器创建和运行涉及的常用步骤。


    1. 开发者编写应用程序

    2. 将应用程序打包为 `container image`（容器镜像）

    3. 将容器镜像上传并共享在注册表（registry）中

    4. 服务器下载镜像

    5. 服务器将镜像作为容器运行


    让我们观察得更仔细一点。


    开发者使用他们最喜欢的编程语言编写应用程序——不需要为了容器学习新语言。


    应用程序以及所有的依赖项都被封装进容器镜像中，我们通常称之为 `image`（镜像）。由于应用`and its dependencies`被封装在同一个镜像中，因此你不应该遇到应用程序在开发者笔记本电脑上可以运行但在生产环境中无法运行的情况。这种情况以前经常发生是因为生产系统和开发者笔记本电脑运行了不同版本的依赖项。容器通过将应用`and
    all dependencies`封装在同一个容器镜像中解决了这个问题。


    在中心化的注册表中托管容器镜像是种常做法，这样就可以从不同的环境（开发、测试、生产等）访问它们，并与不同的团队安全地共享。存在许多容器注册表。有些设计为运行在你防火墙内的私有网络上，而另一些存在于公共互联网。`Docker
    Hub` 是第一个主要的容器注册表，可以在网上访问。然而，像所有注册表一样，它被分为仓库（repositories），你可以隐藏它们并限制访问。


    一旦镜像共享到注册表，它就可以被下载到服务器并作为容器运行。你可以限制谁可以访问和下载你的镜像，运行镜像的服务器可以是物理服务器、虚拟机，甚至是云实例。


    当一个镜像正在执行时，我们称其为 `container`（容器）。这意味着容器是镜像的运行实例。如果你用过 VMware，将镜像比作类似 VM 模板，将容器比作运行中的虚拟机可能会很有帮助。但是，请记住，镜像和容器比
    VM 模板和虚拟机更小、更轻量。


    运行容器的服务器需要一种名为 `container runtime`（容器运行时）的特殊软件。稍后的章节将专门介绍这些内容。


    ## 容器与微服务


    容器在塑造微服务架构方面至关重要。


    正如前面的章节提到的，微服务应用程序由许多小型、独立的服务组成，这些服务共同工作形成一个实用的应用程序。


    每个微服务通常负责单一功能，并封装为它自己的容器镜像。例如，一个具有前端功能、中间件功能和后端功能的微服务应用程序可能会被分为以下三个微服务/容器镜像：


    * 前端 (Front-end)

    * 中间件 (Middleware)

    * 后端 (Back-end)


    在这个示例中，前端服务由专门团队开发，封装为自己的容器镜像，并独立于另外两个微服务部署。另外两个也是如此。如果前端需求增加，你可以通过增加更多的前端容器来扩展。如果需求下降，你可以通过终止额外的容器来缩小规模。


    这证明了微服务与容器之间的关系。它还展示了每个微服务如何通过简单地增加该微服务的容器副本来进行独立扩展。


    ## 容器架构


    容器有时被称为 `virtual operating systems`（虚拟操作系统）。让我们将其与虚拟机进行比较以明确这一点。


    虚拟机程序虚拟化（如 VMware）将硬件虚拟化。这意味着它获取物理服务器并将其切分为我们称之为 `virtual machines (VM)`（虚拟机）的虚拟服务器。例如，CPU
    被切分成虚拟 CPU，存储被切分成虚拟存储，网卡被切分成虚拟网卡。这些虚拟资源被组合成虚拟机，它们看起来、闻起来和感觉起来就像普通的物理服务器。然后你在每个虚拟机中安装单一的操作系统和应用程序。


    容器虚拟化（如 Docker）将操作系统（OS）虚拟化。这意味着它获取 Linux 和 Windows 等操作系统并将其切分为 `containers`（容器）的虚拟操作系统。例如，进程树被切分成虚拟进程树，文件系统被切分成虚拟文件系统，网络接口被切分成虚拟接口。这些虚拟资源组合成容器，它们看起来、闻起来和感觉起来就像普通的操作系统。然后你在每个容器中运行一个应用程序。


    总结一下，虚拟机程序虚拟化将物理服务器切成看起来、闻起来和感觉起来像物理服务器的虚拟机。容器虚拟化将操作系统切成看起来、闻起来和感觉起来像普通 OS 的容器。图
    3.1 显示了对比。


    ![](img/images----figure3-1.png)


    图 3.1


    总结：容器是一种比 VMware 等虚拟机程序虚拟化更轻量的虚拟化形式。这意味着容器消耗更少的基础且更具移植性。应用程序代码和依赖项被封装到容器镜像中，存储在中心注册表中，并由想要运行它们的服务器下载。服务器使用容器运行时下载容器镜像并将其作为容器运行。你还学习了容器虚拟化操作系统——每个容器本质上都是一个运行单个应用程序的虚拟操作系统。运行
    10 个容器的服务器可以运行 10 个应用程序。


    ## 容器运行时


    容器运行在物理服务器、虚拟机和云实例上。由于它们对容器来说看起来是一样的，我们将它们统称为 `nodes`（节点）。


    每个想要运行容器的节点都需要名为 `container runtime`（容器运行时）的专用软件。它负责从注册表下载容器镜像，以及在节点上创建、启动、停止和删除容器。Docker
    是最广为人知的容器运行时，但也存在许多其他。


    让我们回顾之前提到的工作流，以显示容器运行时处于什么位置。


    开发者编写应用程序，将其构建成容器镜像并存储在注册表中。为了运行容器，节点需要下载镜像并从其启动容器。执行此操作的软件就是容器运行时。下载容器镜像通常被称为
    `pulling the image`。


    如果你用过 VMware，将容器运行时与 ESXi 进行比较可能会很有帮助。因为两者都是底层工具，执行如启动和停止容器或虚拟机的任务。在 VMware 世界中，像
    vCenter 等高级工具提供了更高级的功能。在容器世界中，像 Kubernetes 等高级工具提供了更高级的功能。


    ### 开放容器组织 (OCI)


    Docker 是原始容器运行时并且仍然被广泛使用。然而，开放容器组织（OCI）创建了一套行业标准，使得其他开发者和公司能够简单、安全地创建自己的容器运行时。事实上，Docker,
    Inc. 是 OCI 的创始成员，并深度参与了标准的制定。一些最流行的容器运行时包括：


    * Docker


