- fmt: '

    When you purchase the exam, you’ll receive a confirmation email from `The Linux
    Foundation Training` at `<noreply@mail.linuxfoundation.org>`. The email is titled
    “Order Confirmation” and it has a button that takes you to your Linux Foundation
    portal where can complete all of the following.


    *   Agree to the Global Candidate Agreement

    *   Verify your name

    *   Schedule your exam date

    *   Check your system requirements

    *   Read the Candidate Handbook and other important instructions


    I highly recommend you complete all pre-exam requirements as soon as possible
    so you’re prepared for the exam and don’t have lots of admin to complete on the
    day of your exam.


    When scheduling the exam, you’ll be shown a calendar view where you choose an
    available date and time as shown in Figure 7.1.


    ![](resources/images----figure7-1.png)


    Figure 7.1


    Once booked, the exam will show up in the dashboard of your Linux Foundation portal
    where you can reschedule if required.


    You should practice logging in to your Linux Foundation portal on the machine
    you plan to use for the exam, and you should run the built-in system checker to
    ensure your machine, including video and audio, meet requirements. When checking
    your system requirements, you may need to speak during the audio test to prove
    your microphone works.


    The exam will be delivered through a proprietary secure browser that does not
    work on mobile devices. This may include devices such as the iPad Pro, so you
    should be sure to check this and have another machine available in case the secure
    browser doesn’t work.


    ## Taking the exam


    The most important thing about your exam day is to have everything ready in advance
    and have as much fun as possible. Don’t stress, relax and enjoy the occasion.


    With this in mind, you should complete all exam pre-requisites before the day
    of your exam so you can chill on the day and not have to worry about completing
    long lists of checks.


    The high-level process for taking your exam is as follows. I’m including recommended
    steps to make your exam day experience as smooth as possible:


    *   Make sure you have your authorised form of ID available

    *   Get a good night sleep the night before

    *   Clear your schedule at least one hour before the exam

    *   Prepare the room according to exam requirements

    *   Choose where you’re going to sit and make sure it meets exam requirements

    *   Make sure you eat and take any required comfort breaks before you start so
    you’re comfortable during it

    *   Prepare a clear drink in a clear container in case you need to drink during
    the exam

    *   Reboot the machine you’ll be using to take the exam

    *   Close any unnecessary background processes that might interfere or consume
    network bandwidth

    *   Make sure nobody in the house is streaming or gaming over the network

    *   Log on to your Linux Foundation portal and click the `Take Exam` button (you
    can start 15 minutes before your official start time)


    When you click the `Take Exam` button you’ll download the exam’s secure browser.
    You then need to use your webcam to take several still photos and videos of your
    surroundings and upload them to the system. This can take around 10 minutes, and
    you should relax while you do this as you need to be calm and relaxed for the
    exam.


    You’ll then be assigned a proctor (person who will monitor your exam) who will
    communicate with you through a live chat feature in the browser. This is text-based
    chat and not audio. The proctor will check the photos and videos you uploaded
    before authorizing you to start the exam. If any of your photos or videos don’t
    meet the requirements, you’ll be able to take new ones and upload them.


    Once the proctor is happy with your ID and surroundings, they’ll authorise you
    to start the exam.


    Beware of your screen resolution during the exam, especially if using a small
    monitor. I took my exam on a 12-inch MacBook and didn’t realise some of the answer
    options were off the bottom of my screen and I had to scroll to see them. This
    won’t be a problem on most screens but be aware that most questions have 4 possible
    answers, so be sure to check you don’t have answers off the bottom of your screen
    that you can’t see.


    If you’re unsure about the answer to any question you can mark it for review.
    You can then proceed with the other questions and revisit those marked for review
    at the end. Obviously, you have to submit all answers, including those marked
    for review, before your time is up.


    Once you complete the exam, your proctor will come back on the live chat and authorise
    you to go. You’ll then get a short survey to complete.


    ## Getting your result


    Despite being an online multiple-choice exam, it’s normal for the grading process
    to take the full 24 hours. As soon as your result is available, you’ll get an
    email and be able to view it in your Linux Foundation portal. Hopefully you’ll
    receive a passing grade and be able to celebrate.


    ## Staying connected


    I’m really excited for you to take your KCNA exam and would love to hear about
    your exam experience and your result.


    I’ll also update the book with any tips and recommendations you may have.


    Email me at `kcnabook@nigelpoulton.com`


    # 8: Sample test


    This chapter contains a sample test. The questions are written in a similar format
    to the real exam questions, but they are not real exam questions. Posting real
    exam questions online or in a book is a breach of exam rules and is not something
    I would ever do. I’m interested in helping you gain real skills and real qualifications
    – I have no interest in helping anyone cheat to pass exams.


    I recommend the following to get the most out of this sample exam.


    *   Get a pen and paper to record your answers

    *   Write the numbers 1-60 on the paper before you start

    *   Write each answer against the question number on the paper

    *   Time yourself (90 minutes)


    The number of questions per topic matches the weight of each topic in the exam.
    For example, the `Kubernetes fundamentals` domain accounts for 46% of the exam,
    so 46% of the questions in this test are about `Kubernetes fundamentals.`


    The answers to the questions start on page 175, in the paperback, and include
    explanations.


    Good luck and have fun practicing for the exam.


    **1.** Which of the following are important concepts when designing and building
    resilient systems that self-heal? Choose all correct answers.


    *   1. Desired state

    *   2. Reconciliation

    *   3. Iteration

    *   4. Observed state


    **2.** You’re deploying a new application to an environment running the `containerd`
    container runtime and you’ve been told you need to secure containers as much as
    possible. Which of the following technologies might help? Choose the two correct
    answers.


    *   1. Seccomp

    *   2. SSL

    *   3. Capability dropping

    *   4. Secure Shell


    **3.** What does Kubernetes use as its default and preferred method of service
    discovery?


    *   1. Environment variables

    *   2. Key-value pairs

    *   3. DNS

    *   4. IPv6


    **4.** You’re about to deploy a new Kubernetes cluster. Which of the following
    is important for the control plane? Choose two answers.


    *   1. It runs on-premises

    *   2. It’s highly available

    *   3. You run at least two control plane nodes

    *   4. It’s high performance


    **5.** You need to ensure your Kubernetes cluster can dynamically add nodes to
    deal with spikes in performance. You’re running on a cloud and you know it supports
    Kubernetes node pools. Which Kubernetes technology do you need to configure so
    that node pools can grow and shrink?


    *   1. The horizontal node autoscaler

    *   2. The horizontal pod autoscaler

    *   3. The cluster autoscaler

    *   4. The vertical autoscaler


    **6.** You need to deploy a tool to store and analyse trace data. You’ve just
    been told the technology should also have graduated the CNCF. Which should you
    deploy?


    *   1. Rook

    *   2. Linkerd

    *   3. Jaeger

    *   4. Envoy

