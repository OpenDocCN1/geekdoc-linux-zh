    ## 导论


    多年来，Google 一直每周在数十亿个容器上运行搜索和 Gmail。这是一个巨大的规模，他们需要帮助。因此，他们构建了两个名为 `Borg` 和 `Omega`
    的内部工具来提供。当 Docker 让容器流行起来时，世界上其他地区遇到了类似的挑战。虽然我们的规模没有 Google 那么大，但我们仍然需要工具来帮助。在
    Docker 让容器流行的同时，Google 的一组技术人员正在构建一种新的容器编排工具。它是基于从 `Borg` 和 `Omega` 中中学的经验，并于
    2014 年作为一个名为“Kubernetes”的开源项目发布。


    因此，Kubernetes 是一个用于大规模调度和管理容器的平台。它带来了如自愈、、自动伸缩和零停机滚动更新等功能。它最初构建在 Google 内部，并在
    2014 年作为开源项目发布给社区。从那时起，它成为行业标准的容器编排器，是 GitHub 上第二大开源项目，也是第一个从 CNCF 毕业的项目。


    尽管 Kubernetes 主要是一个容器编排器，但它也可以也可以编排虚拟机和无服务器函数。`KubeVirt` 项目允许 Kubernetes 管理虚拟机，而
    `Knative` 和 `OpenFaaS` 项目使无服务器工作负载能够在 Kubernetes 上运行。


    Kubernetes 目前是繁荣生态系统的核心中心项目，许多其他项目接入其中，扩展其功能并提供额外的服务。示例包括：


    * KubeVirt

    * Knative

    * OpenFaaS

    * 容器网络接口 (CNI)

    * Prometheus

    * Linkerd

    * Harbor


    正如前面提到的，`KubeVirt` 扩展了 Kubernetes 以能够管理虚拟机，而 `Knative` 和 `OpenFaaS` 让 Kubernetes
    能够管理无服务器函数。


    `CNI` 让 Kubernetes 网络变得可插件化，使得 `Cilium` 等其他技术可以带来先进的网络功能。`Prometheus` 增加了高级监控，`Linkerd`
    带来了服务网格功能，`Harbor` 实现了容器镜像仓库。最后，“Kubernetes”这个名字源于希腊语中的“舵手”。你还会看到该名字缩写为 `K8s`，发音为“kates”。在这个缩写中，数字
    `8` 代表被去掉的八个字母。


    ### 导论测验


    **1. 部署 Kubernetes 的原因是什么？选择一个答案。**

    * 1. 管理本地网络和存储

    * 2. 作为构建和测试流水线的工具

    * 3. 帮助大规模管理容器应用

    * 4. 作为私有云平台的开源替代方案


    **2. Kubernetes 带来哪些功能？选择正确答案。**

    * 1. 加密流量

    * 2. 自愈

    * 3. 零停机滚动更新

    * 4. 自动伸缩


    **3. `KubeVirt` 项目是如何扩展 Kubernetes 的？**

    * 1. 允许将单个集群分为多个集群

    * 2. 允许 Kubernetes 调度虚拟机工作负载

    * 3. 运行无服务器工作负载

    * 4. 在本地运行 Kubernetes


    **4. 哪些社区项目提供 Kubernetes 原生的监控和日志？**

    * 1. Linkerd

    * 2. Docker

    * 3. Harbor

    * 4. Prometheus


    **答案：** 1:C, 2:B,C,D, 3:B, 4:D.


    ## 简单的 Kubernetes 工作流


    应用程序编写编写被封装成容器镜像并托管在仓库中。


    为了让容器在 Kubernetes 上运行，它必须封装在 `pod` 中。这是通过在 pod 清单文件中描述容器来实现的并将其提交给 Kubernetes
    API 服务器，在那里请求将经过验证和授权。假设这些检查通过，pod 定义将持久化到集群存储中，调度器将其分配给一个节点。分配的工作节点上的 `Kubelet`
    服务告诉其容器运行时下载所需的镜像并将其作为容器启动。


    这些段落中有很多术语，我们将在章节的其余部分解释它们。


    ### Kubernetes 工作流测验


