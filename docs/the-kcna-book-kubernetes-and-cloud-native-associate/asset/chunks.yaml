  trans: '


    ## 容器与 Pod


    在进入细节之前，让我们先理清一些术语。


    我们有时使用 `container`（容器）和 `pod` 这两个词来表示相同的意思。然而，pod 实际上是对一个或多个容器的薄层封装，它是任何想要在 Kubernetes
    上运行的容器的强制性要求。这意味着容器如果运行在 Kubernetes 上，**必须**被封装在 pod 中。以下极其简单的 YAML 文件定义了一个包含单个容器的
    pod。


    ```

    1  apiVersion: v1

    2  kind: Pod

    3  metadata:

    4    name: kcna-pod

    5    labels:

    6      project: kcna-book

    7  spec:

    8    containers:     <<==== 容器在下方处定义

    9      - name: kcna-container

    10       image: <container-image-goes-here>

    ```


    第 1-7 行定义了 pod 的名称和标签。第 8-10 行显示了嵌入在整个 pod 定义中的容器定义。由于容器是嵌入在 pod 定义中的，我们称 pod
    “封装了容器”。


    除了让容器在 Kubernetes 上运行外，pod 还为容器增加了以下所有功能和能力：


    * 协同调度 (Co-scheduling)

    * 共享内存

    * 共享卷

    * 共享网络

    * 策略 (Policies)

    * Kubernetes 智能调度


    协同调度允许你在同一个 pod 中运行多个容器，并保证它们始终运行在同一个节点上。常见的模型是拥有一个主应用程序容器和一个辅助容器。辅助容器通常被称为 `sidecar`（旁路容器）。


    `logging sidecar`（日志 sidecar）是一个与应用程序容器运行在同一个 pod 中的特殊容器。它收集应用程序日志并将其传输到中心位置进行聚合。这允许应用程序容器专注于运行程序，而让日志
    sidecar 专注于处理日志。


    服务网格（Service meshes）也使用 pod 进行协同调度。它们在应用程序容器的同一个 pod 中注入一个 `proxy sidecar`（代理
    sidecar）。sidecar 拦截所有网络流量，并执行诸如加密和解密流量、暴露详细的网络测量以及优化网络流量流的操作。与日志 sidecar 示例一样，应用程序容器专注于运行程序，而服务网格
    sidecar 专注于高级网络功能。


    在这两种情况下，应用程序容器甚至不知道 sidecar 的存在。


    Pod 还是一个`共享执行环境`。这意味着同一个 pod 中的每个容器都可以访问相同的内存、卷和网络栈。这使得辅助模式成为可能，例如主 Web 容器和同步器
    sidecar。在这个示例中，Web 容器完全专注于从卷中提供静态内容，而 sidecar 完全专注于从远程仓库同步最新内容并将其放入共享卷中，供 Web
    服务器访问。这之所以行得通，是因为两个容器都在同一个 pod 中，并且可以访问相同的卷。请见图 4.1。


    ![](img/images----figure4-1.png)


    图 4.1


    Pod 还允许你挂载策略以及资源请求（resource requests）和资源限制（resource limits）等内容。`Resource requests`
    指定了 pod 正常运行所需的 CPU 和内存最小量，而 `resource limits` 则允许你设置最大值。它们对于帮助调度器将 pod 分配到具有足够资源的节点至关重要。


    图 4.2 显示了两个 pod。左侧的正在调度单个容器，右侧的正在调度两个。右侧 pod 中的两个容器都可以访问相同的共享内存、相同的共享卷和相同的共享网络栈。这意味着右侧
    pod 中的两个容器共享相同的 IP 地址，并可以通过专用端口访问。它们还保证会被调度到同一个工作节点上。


    ![](img/images----figure4-2.png)


    图 4.2


    接下来的声明式 YAML 文件定义了一个带有某些高级功能的多容器 pod。如果看起来很复杂，请不要望所措，你考试时不需要理解细节。但是，你需要理解这些概念。该文件还经过了注释以突出显示重要部分。


    ```

    1  apiVersion: v1

    2  kind: Pod             <<==== 此文件正在定义一个 pod

    3  metadata:

    4    name: kcna-pod      <<==== Pod 名称

    5  spec:

    6    volumes:            <<==== 定义一个两个容器都可以访问的卷

    7    - name: html        <<==== 为共享卷命名为 ("html")

    8      emptyDir: {}      <<==== 将其制为空卷

    9    runtimeClassName: level1       <<==== 调度到具有特定运行环境的节点

    10   containers:                    <<==== 此代码块定义了两个容器

    11     - name: main-container       <<==== 这是主应用容器

    12       image: <app-image>         <<==== 主应用容器镜像

    13       volumeMounts:              <<==== 将卷挂载到主应用容器

    14       - name: html               <<==== 挂载共享的 “html”卷

    15         mountPath: /usr/share/nginx/    <<=== 在容器中挂载到此处

    16     - name: sidecar              <<==== 这是 sidecar 容器

    17       image: <sidecar-image>     <<==== Sidecar 容器镜像

    18       volumeMounts:              <<==== 将卷挂载到 sidecar 容器

    19       - name: html               <<==== 挂载相同的共享 “html”卷

    20         mountPath: /tmp/git      <<==== 在 sidecar 容器中挂载到此处

    ```


    第 1-9 行定义了 pod，而第 10-20 行描述了两个容器。与之前的示例一样，两个容器都嵌套/封装在 pod 定义中。


    第 6-8 行定义了一个名为 `html` 的新空卷。由于它是 pod 环境，两个容器都可以。第 9 行告诉 Kubernetes 将 pod 调度到具有特定运行环境的节点。第
    11-15 行定义了应用程序容器。它将共享 `html` 卷挂载到本地文件系统 `/usr/share/nginx/`。第 16-20 行定义了 sidecar
    容器，并将相同的共享 `html` 卷挂载到 `/tmp/git`。


    总结该 YAML 文件。它描述了一个多容器 pod。它包含了运行时类引用并定义了一个共享卷。关于 pod 我们还可以说很多，但目前，了解它们是对一个或多个容器的轻量级封装，以及如果不封装在
    pod 中无法在 Kubernetes 上运行容器已经足够了。我们经常通用 `container` 和 `pod`，尤其在不需要区分时。此外，pod 中的容器共享相同的环境并保证被调度到同一个节点上。


    ### 容器与 Pod 测试


    1. Kubernetes 上的调度原子单位是哪个？


    * 1. Docker

    * 2. Container

    * 3. Pod

    * 4. Kubelet


    2. 在 pod 中部署容器的优点有哪些？请选择所有正确答案。


    * 1. Pod 允许容器协同调度

    * 2. Pod 允许多个容器共享相同的执行环境

    * 3. Pod 为容器提供专用的内核

    * 4. Pod 允许对容器应用策略


    3. 辅助容器的常用名称是什么？


    * 1. Sidecar

    * 2. Sideshow

    * 3. service mesh

    * 4. Supporter


    4. Kubernetes 清单文件通常用什么格式编写？


    * 1. Python

    * 2. YAML

    * 3. XML

    * 4. Rust


    **答案。**1:C, 2:A,B,D, 3:A, 4:B.


