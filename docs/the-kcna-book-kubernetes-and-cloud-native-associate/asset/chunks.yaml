    * 2. 虚拟机开箱即用的安全性更高

    * 3. 虚拟机比容器小

    * 4. 虚拟机实现了微服务设计模式


    **3.** 容器虚拟化在哪层工作？


    * 1. 硬件层

    * 2. 基础设施层

    * 3. 应用层

    * 4. 操作系统层


    **4.** 以下哪些项是容器的组成部分？选择所有正确答案。


    * 1. 虚拟进程树

    * 2. 虚拟 CPU

    * 3. 虚拟硬盘

    * 4. 虚拟文件系统


    **5.** 下列哪个说法是正确的？


    * 1. 你通常可以在服务器上运行比虚拟机数量多的容器

    * 2. 你通常可以在服务器上运行比容器数量多的虚拟机


    **6.** 为什么容器可能比虚拟机不安全？


    * 1. 容器网络始终是明文传输的

    * 2. 容器镜像在公共网上始终可用

    * 3. 你不能加密容器文件系统

    * 4. 宿主机上的所有容器共享同一个操作系统内核


    **7.** 以下哪些项是容器镜像的一部分？选择所有正确答案。


    * 1. 应用程序代码

    * 2. 应用程序依赖项

    * 3. 快照

    * 4. 独立的操作系统


    **8.** 以下哪项最能描述单体应用程序？


    * 1. 仅运行在本地数据中心的应用程序

    * 2. 所有功能都编码在单个二进制文件应用程序

    * 3. 实现了自动伸缩和滚动更新等云原生功能的应用程序

    * 4. 具有非常小的容器镜像的应用程序


    **9.** 以下哪些项是单体应用程序的缺点？选择所有正确答案。


    * 1. 每个功能都必须通过网络通信

    * 2. 更新风险且复杂

    * 3. 无法扩展单个应用程序功能

    * 4. 无法将其部署到公云


    **10.** 以下哪些项是微服务应用程序的优点？选择所有正确答案。


    * 1. 每个微服务都可以拥有自己的精简敏捷开发团队

    * 2. 每个微服务都可以拥有独立的操作系统内核

    * 3. 每个微服务都可以独立伸缩

    * 4. 每个微服务都可以独立进行补丁


    **11.** 以下哪些项是微服务应用程序的潜在缺点？选择所有正确答案。


    * 1. 容器镜像可以非常小

    * 2. 它们无法在公云上运行

    * 3. 网络复杂性增加

    * 4. 网络流量增加


