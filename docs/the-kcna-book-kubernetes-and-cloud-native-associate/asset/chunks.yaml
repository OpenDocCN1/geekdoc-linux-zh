    在 Kubernetes 上保护竞争工作负载的唯一方法是将每个工作负载运行在自己的 Kubernetes 集群中。命名空间（Namespaces）并不是安全的负载负载边界。


    问题 27 ，答案 A


    Pod 拓扑分布约束（topology spread constraints）允许您将用户负载分布在不同的故障区域。


    问题 28 ，答案 D


    Kubernetes 命名空间是在非敌对工作负载之间划分集群的好方法。每个命名空间都有自己的资源配额（resource quota）和用户账户。


    问题 29 ，答案 C


    新的 Kubernetes 对象以 alpha 资源的形式进入 API，经过 beta 阶段，最终提升为稳定版（即“GA”）。


    问题 30 ，答案 A


    Kubernetes 提供了一种健康检查机制，用于探测应用程序是否按预期运行。


    问题 31 ，答案 B


    `kubectl logs` 命令返回容器日志。添加 `-p` 标志可以返回最近终止的 pod 的日志。


    问题 32 ，答案 C


    `kubectl describe` 命令用于返回对象的详细信息。


    问题 33 ，答案 B


    Linkerd 是一个已毕业的 CNCF 服务网格。Istio 也是一个服务网格，但不是 CNCF 项目。


    问题 34 ，答案 A


    kubeconfig 是 kubectl 的配置文件。


    问题 35 ，答案 C


    容器运行时负责运行容器。某些容器运行时（如 Kata containers）在它们自己的虚拟机中运行每个容器。


    问题 36 ，答案 C


    为了高可用性，您应该始终部署奇数个控制平面节点。三个是最常见的，且一个比两个要好。


    问题 37 ，答案 B, C, D


    托管 Kubernetes（Hosted Kubernetes）是一种消费模型，由您的云提供商为您构建并管理您的 Kubernetes 集群的控制平面。这包括管理性能、可用性和升级。由于您不需要担心这些任何问题，您可以更多地关注应用程序。


    问题 38 ，答案 B


    Kubernetes 保证 GA 对象在弃用后至少会被支持 12 个月。


    问题 39 ，答案 D


    Kubernetes deployment 控制器管理无状态应用，并添加了自愈、扩展和滚动更新功能。


