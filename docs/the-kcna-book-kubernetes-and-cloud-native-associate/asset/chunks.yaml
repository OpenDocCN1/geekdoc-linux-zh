- fmt: '

    * `containerd` (pronounced “container dee”)

    * `runC` (pronounced “run see”)

    * `CRI-O` (pronounced “cry oh”)

    * `gVisor` (pronounced “jee visor”)

    * `Kata containers`


    As you’d expect, each one has advantages and disadvantages.


    Docker has been around a long time and is very widely used. However, it does a
    lot more than just the low-level stuff. For example, Docker does advanced scheduling
    and implements a lot of higher-level features normally provided by platforms such
    as Kubernetes. As a result, it’s overkill for a lot of projects and scenarios.


    `containerd` (pronounced “container dee”) is just the low-level runtime code stripped
    out of Docker and donated to the CNCF in 2017. Thanks to its lightweight nature,
    it’s fast becoming the most popular container runtime used by Kubernetes. It’s
    based on `OCI` specs and works with `OCI` images.


    > **Jargon:** The OCI created three specifications that have defined low-level
    industry standards for containers. One of these specs is the `image-spec` that
    defines what a container image should look like and how it’s constructed. Container
    images that conform to the OCI image-spec are often referred to as `OCI images`.
    Almost all container runtimes work with `OCI images`. Put in more simple terms,
    `Docker images` and `OCI images` are the same.


    ### Types of container runtimes


    There are three main types of containers and container runtimes:


    * Namespaced (shared kernel)

    * Sandboxed (proxied kernel)

    * Virtualised (dedicated kernel)


    That’s a lot of jargon that boils down to size and security.


    Namespaced containers are the fastest and most lightweight, but they’re the least
    secure. This is because every container on the same node shares the node’s kernel.
    Docker, `containerd`, and `CRI-O` are common examples of container runtimes that
    create namespaced containers.


    Virtualised containers are the slowest to start and consume the most resources,
    however, they’re the most secure. This is because every container runs inside
    its own virtual machine with its own kernel. Windows containers and `Kata Containers`
    are examples of container runtimes that create virtualised containers.


    Sandboxed containers are an attempt at a middle-ground. They’re faster and smaller
    than virtualised containers but bigger and slower than namespaced containers.
    They’re also in the middle when it comes to security. Implementation details are
    beyond the scope of this book and the exam, but they often implement a proxy layer
    between the container and the host’s kernel. `gVisor` is an example of a container
    runtime that creates sandboxed containers.


    ### Kubernetes and containers


    Even though Kubernetes is a container orchestrator, it cannot run containers without
    the help of a container runtime.


    Figure 3.2 shows the relationship between Kubernetes and container runtimes. Kubernetes
    manages a cluster of nodes, each running a container runtime, and tells them when
    to start and stop containers. It also implements high-level intelligence such
    as self-healing and autoscaling etc.


    ![](resources/images----figure3-2.png)


    Figure 3.2


    In the early days, Kubernetes used Docker as it’s runtime and a lot of Kubernetes
    installations still do. However, Kubernetes implements a technology called the
    Container Runtime Interface (`CRI`) that allows users to pick their favourite
    container runtimes. As things stand, `containerd` is the default container runtime
    on most new Kubernetes clusters.


    The `OCI` specs were instrumental in enabling the `CRI` and allowing Kubernetes
    to make container runtimes swappable – as long as container runtimes work with
    `OCI images`, you can swap one for another.


    > **Jargon.** The OCI maintains low-level industry specifications for things such
    as container runtimes and container images. The `CRI` is what makes the container
    runtime layer of Kubernetes pluggable. Don’t get the two mixed up.


    In summary, container runtimes are low-level tools that pull images, start, stop,
    and delete containers. They come in different shapes and sizes to fit different
    business and technical requirements. For example, some are fast and lightweight
    but less secure, whereas others are bigger and slower but more secure. The OCI
    created specifications that brought important standards to the container ecosystem
    making it possible for a wide range of container-related tools and platforms to
    be built. Kubernetes is a higher-level tool that manages clusters of container
    runtimes and tells them which containers to run as well as bringing autoscaling
    and other cloud native features. Kubernetes also implements a pluggable layer,
    called the Container Runtime Interface, that allows you to choose the best container
    runtime for your requirements. Finally, as container runtimes are low-level tools,
    they usually operate in the background, and you normally interact with them indirectly
    via higher level tools such as Kubernetes.


    ## Container orchestration fundamentals


    As soon as we started using containers it became obvious we needed help managing
    them. This is because we were breaking large applications into lots of small loosely
    coupled microservices that were scaling up and down and we were rolling out new
    versions and updates all the time. As an example, a single large monolithic application
    that rarely changed would be replaced with a sprawling microservices application
    that changes all the time. Help was needed.


    Tools like Docker Swarm, Kubernetes, and Mesosphere DCOS were created to help
    solve the problem. To cut a long story short, Kubernetes emerged as the most popular
    of those tools and is now the most important cloud native technology on the planet.


    At a high level, Kubernetes is a `container orchestrator.* This means it runs
    and manages applications that run in containers. Part of this includes providing
    cloud native features such as scheduling, self-healing, and autoscaling.


    Let’s consider a simple example. You have a business application with a front-end
    and back-end. Your developers have designed it with two microservices – one for
    the front-end and one for the back-end. Each one has been written and packaged
    as a container image and hosted in a container registry. You need a platform to
    run the application and provide cloud native features, so you choose Kubernetes.
    Your operations team builds a Kubernetes cluster with 3 nodes running the `containerd`
    container runtime. When the cluster is built, you tell Kubernetes to run your
    app with two containers for the front-end and two containers for the back-end
    – this is called your `desired state`. Kubernetes deploys the application and
    configures `watch loops` to make sure what is actually running on the cluster
    matches what you asked for. We call this `observed state` and `desired state`.


    Let’s assume that one of the cluster nodes fails and takes a front-end container
    with it. Watch loops will notice that `observed state` is now one front-end container
    but desired state is two. They will automatically fix this by starting a second
    front-end container on a surviving node so that observed state is back in sync
    with desired state. Also, as you’ve configured your node pool to have three nodes
    and it currently only has two, a new third node will be automatically created
    and added to the pool. We call this `self-healing` or `resiliency.*


    Let’s also assume you configured scaling metrics for the app and Kubernetes notices
    the front-end is struggling to cope with current demand. To resolve this, it automatically
    scales the number of front-end containers up from two to four. This resolves the
    issue, and when demand drops off Kubernetes scales back down to two.


    This demonstrates the cloud native capabilities of Kubernetes and is called `container
    orchestration`.


    ### Kubernetes architecture basics


    Kubernetes is a cluster of `control plane nodes` and `worker nodes.*


    Control plane nodes run all of the intelligence that implements cloud native features
    – the stuff that makes Kubernetes Kubernetes.

