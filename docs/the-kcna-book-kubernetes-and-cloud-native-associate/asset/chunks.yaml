  trans: "\n云原生应用应该具有弹性，能够提供高质量的遥测以实现高可观测性，并能够自动伸缩。扩展和自愈等操作应该在无需人工参与的情况下完成。\n\n##\
    \ 第 3 章：容器编排\n\n问题 1，答案 A, D\n\n容器与虚拟机相似。然而，它们共享主机的内核，使得它们比虚拟机更轻量。你通常每个容器运行一个小型单一应用程序。\n\
    \n问题 2，答案 A\n\n容器比虚拟机和物理机小、更轻量。这意味着如果你使用容器就可以运行更多的应用程序。\n\n问题 3，答案 A\n\n容器比虚拟机小、更轻量，更容易打包和共享。容器还封装了应用程序源代码和所有依赖，这意味着它们在生产环境中的运行方式与在开发者笔记本电脑上相同——这使得它们更便于共享。\n\
    \n问题 4，答案 B\n\n`Kubernetes` 和容器并不关心你的应用程序是用什么语言编写的。\n\n问题 5，答案 D\n\n容器镜像包含了应用程序代码和所有依赖。\n\
    \n问题 6，答案 C\n\n由于容器包含了应用程序代码和所有依赖，这意味着任何在开发者笔记本电脑上运行的程序，在生产环境中也应该可以运行。这是因为应用程序不依赖外部依赖（例如共享库文件），这些文件在开发者笔记本电脑和生产环境中的版本可能不同。\n\
    \n问题 7，答案 B\n\n容器运行时是一类启动和停止容器的低级软件。\n\n问题 8，答案 A, C, D\n\n容器运行时从仓库下载容器镜像并启动和停止容器。更高层次的决策（例如选择容器应该运行在哪个节点上）由\
    \ `Kubernetes` 等更高层级的工具做出。\n\n问题 9，答案 B\n\n`OCI` 定义了低级容器标准，例如 `image-spec`、`runtime-spec`\
    \ 和 `distribution-spec`。\n\n问题 10，答案 B\n\n`OCI` 镜像是根据 `OCI image-spec` 构建的容器镜像。\n\
    \n问题 11，答案 D\n\n`Docker` 构建符合 `OCI image-spec` 的镜像。\n\n问题 12，答案 A, B, D\n\n命名空间容器是最流行的，并在共享内核模型运行。沙箱容器在容器和主机内核之间插入了一个代理层。虚拟化容器在它自己的轻量级虚拟机中运行每个容器。\n\
    \n问题 13，答案 B, C, D\n\n`Docker`、`CRI-O` 和 `containerd` 都创建命名空间容器。`Kata containers`\
    \ 创建虚拟化容器。\n\n问题 14，答案 D\n\n`Kubernetes` 无法创建容器。它必须使用容器运行时来实现此。`Kubernetes` 处理调度和伸缩等高层操作。\n\
    \n问题 15，答案 A\n\n绝大多数现代 `Kubernetes` 集群默认使用 `containerd` 作为它们的容器运行时。\n\n问题 16，答案\
    \ B\n\n容器运行时接口 (`CRI`) 是 `Kubernetes` 实现的低级技术，用于使容器运行时层可插拔。\n\n问题 17，答案 A\n\n\
    `OCI` 负责低级容器相关标准。`CRI` 使 `Kubernetes` 容器运行时层可插拔。\n\n问题 18，答案 A, B, D\n\n容器编排器（如\
    \ `Kubernetes`）可以对容器进行调度、伸缩和自愈。构建工具负责创建容器镜像。\n\n问题 19，答案 C\n\n`Kubernetes` 是行业标准的容器编排器，也是目前为止最流行的。\n\
    \n问题 20，答案 C\n\n`Kubernetes` 集群由工作节点组成。\n\n问题 21，答案 A, B, D\n\n`Kubernetes` 集群是之一。\n\
    \n问题 22，答案 B\n\n用户命名空间是一类。\n\n问题 23，答案 D\n\n云原生安全的四个 C。\n\n问题 24，答案 A, B, C\n\n\
    `Kubernetes` 是 less..\n\n 25,, answer\n\n`-west`` is to..\n\n  26,,,,,,,\n\n````,,,,,.,\
