    Containers are small and ideal for microservices applications, making them ideal
    for serverless workloads.


    Question 19, answer A


    Many serverless platforms charge you each time a serverless function executes.


    Question 20, answer B


    CloudEvents is attempting to bring standards to the serverless ecosystem.


    Question 21, answer C


    Serverless functions automatically start when an associated event occurs, and
    they exit when they complete. This is a native form of scaling.


    Question 22, answer B


    Serverless workloads run small functions when an event triggers them. It’s commonly
    called Function as a Service (FaaS).


    Question 23, answer D


    The CNCF was founded under the umbrella of the Linux Foundation in 2015 to bring
    governance and direction to a new breed of open-source container-related technologies.
    The Linux Foundation was founded in 2000.


    Question 24, answers A, B, D


    Projects enter the CNCF as “sandbox” projects, progress through the “incubating”
    stage, and eventually “graduate”.


    Question 25, answers A, B, C


    CNCF projects don’t have to have financial backing from at least two vendors.


    Question 26, answers A, C


    Most cloud platforms operate a pay-as-you-use model that most organisations classify
    as an operational expenditure (opex).


    Question 27, answers C, D


    DevOps engineers are expected to understand the entire applications and their
    entire lifecycles. They’re also expected to have some experience as a developer
    and operator. Typically, the developer/operator split is somewhere along the lines
    of 80/20.


    Question 28, answer D


    CloudOps is very similar to DevOps but focusses almost entirely on cloud-only
    technologies and skills. For example, a DevOps engineer may have skills with one
    or two open-source key-value store technologies (NoSQL) that can be used on premises
    or in the cloud, whereas a CloudOps engineer might have skills with a particular
    cloud’s proprietary key-value store technology.


    Question 29, answer A


    Continuous integration, continuous delivery (CI/CD) tools are core DevOps tools.


    Question 30, answer C


    Full stack developers are go-getters with a lot of skills that just get stuff
    done.


    Question 31, answer A


    It’s commonly said that SREs should automate themselves out of a job.


    Question 32, answers B, C


    Open standards in the cloud native world are like standardised rail tracks in
    the manufacturing and engineering world – they enable interoperable solutions
    that help avoid lock-in and give developer’s confidence the solutions they build
    will work well and integrate well.


    Question 33, answers A, B, C


    The Open Containers Initiative (OCI) is responsible for low-level container-related
    standards and currently maintains the image-spec, runtime-spec, and distribution-spec.


    Question 34, answers A, B, C, D'
