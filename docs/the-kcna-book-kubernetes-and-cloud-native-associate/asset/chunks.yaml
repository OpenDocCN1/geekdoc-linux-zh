  raw: 'Cloud native applications should be resilient, provide high-quality telemetry
    for high observability, and be able to autoscale. Things like scaling and self-healing
    should happen without a human having to get involved.


    ## Chapter 3: Container orchestration


    Question 1, answers A, D


    Containers are similar to virtual machines. However, they share the host’s kernel
    making them more lightweight than virtual machines. You normally run one small,
    single-purpose application per container.


    Question 2, answer A


    Containers are smaller and more lightweight than virtual and physical machines.
    This means you can run more apps if you use containers.


    Question 3, answer A


    Containers are smaller and more lightweight than virtual machines, making them
    easier to package and share. Containers also package application source code and
    all dependencies meaning they will work the same in production as they do on a
    developer’s laptop – this also makes them better for sharing.


    Question 4, answer B


    Kubernetes and containers don’t care what languages your applications are written
    in.


    Question 5, answer D


    A container image holds application code and all dependencies.


    Question 6, answer C


    As a container includes application code and all dependencies, it means whatever
    works on a developer’s laptop should also work in production. This is because
    the application doesn’t rely on external dependences, such as shared library files,
    that might be different versions on the developer’s laptop and production.


    Question 7, answer B


    Container runtimes are a class of low-level software that starts and stops containers.


    Question 8, answers A, C, D


    Container runtimes download container images from registries and start and stop
    containers. Higher level decisions, such as choosing which node a container should
    run on, are made by higher level tools such as Kubernetes.


    Question 9, answer B


    The OCI defines low-level container standards such as the image-spec, runtime-spec,
    and distribution-spec.


    Question 10, answer B


    An OCI image is a container image built according to the OCI image-spec.


    Question 11, answer D


    Docker builds images that comply with the OCI image-spec.


    Question 12, answers A, B, D


    Namespaced containers are the most popular and operate the shared kernel model.
    Sandboxed containers insert a proxy layer between the container and the host kernel.
    Virtualised containers run each container in its own lightweight virtual machine.


    Question 13, answers B, C, D


    Docker, CRI-O, and containerd all create namespaced containers. Kata containers
    creates virtualised containers.


    Question 14, answer D


    Kubernetes cannot create containers. It has to use a container runtime to do this.
    Kubernetes handles higher-level operations such as scheduling and scaling.


    Question 15, answer A


    Most modern Kubernetes clusters default to using containerd as their container
    runtime.


    Question 16, answer B


    The Container Runtime Interface (CRI) is the low-level technology implemented
    by Kubernetes to make the container runtime layer pluggable.


    Question 17, answer A


    The OCI is responsible for low-level container-related standards. The CRI makes
    the Kubernetes container runtime layer pluggable.


    Question 18, answers A, B, D


    Container orchestrators, such as Kubernetes, can schedule, scale, and self-heal
    containers. Build tools are responsible for creating container images.


    Question 19, answer C


    Kubernetes is the industry-standard container orchestrator and by far the most
    popular container orchestrator in use today.


    Question 20, answer C


    A Kubernetes cluster comprises one or more control plane nodes and worker nodes.


    Question 21, answers A, B, C, D


    Root containers can potentially cause damage to the shared container host. Unsecured
    networks make container-to-container traffic easy to snoop. Untrusted images can
    contain malicious code. Shared kernels increase the risk of a compromised container
    affecting other container or even the host it’s running on.


    Question 22, answer B


    User namespaces is a Linux kernel technology that maps the root user ID inside
    a container to a different, less powerful, user on the shared host. This means
    a compromised root process in a container will not have root access on the shared
    host.


    Question 23, answer D


    The four Cs of cloud native security are code > containers > clusters > clouds


    Question 24, answers A, B, C, D


    Containers are typically microservices applications that send internal application
    traffic over the network. This means network security is vital. Each container
    (microservice) needs to know how to discover other services. Self-healing, scaling,
    and update operations all add and remove containers from the network, this includes
    IP addresses and causes a lot of IP churn. Tracing requests as they are handed
    off between lots of different microservices is vital to understanding how applications
    work and how traffic flows.


    Question 25, answer B


    Container-to-container traffic happens over the same network and is referred to
    as east-west traffic. There is lots of it in microservices architectures where
    each application feature is deployed in its own container and needs to share data
    with other containers.


    Question 26, answers A, B, C


    Self-healing, autoscaling, and rollouts all cause containers to be added and removed
    from the network. This means IP addresses are being added and removed frequently.


    Question 27, answer A


    The Kubernetes pod network is open and flat. This means all containers can communicate
    by default but is a security risk and should be locked down.


    Question 28, answer C


    The Container Network Interface (CNI) is a low-level technology implemented by
    Kubernetes to make the networking layer pluggable.


    Question 29, answer D


    East-west traffic refers to traffic between containers on the same network.


    Question 30, answer B


    Service meshes implement features at the *platform layer.* This is another way
    of saying any container on the service mesh automatically gets the features without
    having to change the configuration of applications or containers.


    Question 31, answers B, C


    Istio and Linkerd are popular service meshes. Kubernetes is a container orchestrator
    and Prometheus is a monitoring tool.


    Question 32, answer B


    The Container Storage Interface is a low-level technology implemented by Kubernetes
    to make the storage layer pluggable.


    Question 33, answers A, B


    Seccomp, SELinux, and AppArmor all allow you to secure containers. Secure shell
    gets you a secure command line session on a remote system, whereas KubeVirt lets
    Kubernetes orchestrate virtual machine workloads.


    ## Chapter 4: Kubernetes fundamentals


    Question 1, answer D


    Kubernetes was released in 2014.


    Question 2, answers A, B, D


    Kubernetes is a container orchestrator and can add self-healing, autoscaling,
    and zero-downtime rolling-updates to containerised applications. Image scanning
    is usually provided by registries or CI/CD pipelines.


    Question 3, answers A, B, D


    Kubernetes natively orchestrates containers. KubeVirt extends it to be able to
    orchestrate virtual machines, whereas OpenFaaS and Knative extend it to be able
    to orchestrate serverless functions.


    Question 4, answer B


    KubeVirt enables Kubernetes to manage virtual machine workloads inside of pods.
    Knative and OpenFaaS are for serverless, whereas Cilium is a network plugin.


    Question 5, answers A, D


    OpenFaaS and Knative extend Kubernetes for serverless function workload orchestration.
    Cilium is a network plug, and KubeVirt enables virtual machine workloads on Kubernetes.


    Question 6, answer B


    Linkerd provides service mesh functionality. Prometheus is a monitoring tool,
    OpenFaaS is serverless, and Harbor is a registry.


    Question 7, answer D


    A Kubernetes pod is a thin wrapper around one or more containers that are mandatory
    if a container wants to run on Kubernetes.


    Question 8, answer D


    Containers can only run on Kubernetes if they’re wrapped in a pod.


    Question 9, answers A, B, C'
