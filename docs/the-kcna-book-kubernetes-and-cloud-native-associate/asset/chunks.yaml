    ## Defining cloud native architecture


    The first thing to understand is that `cloud native` is a set of capabilities
    and practices. That’s right, cloud native isn’t about running on the public cloud,
    it’s a set of capabilities and practices.


    `Cloud native capabilities` include applications and infrastructure that is resilient,
    scalable, observable, highly automated, and easily updated. `Cloud native practices`
    is about building teams and processes that encourage co-operation, integration,
    and open governance. The end result is an environment that delivers high-quality
    applications that meet and respond to modern business demands.


    Most cloud native apps are also `microservices apps`. As explained in the previous
    chapter, microservices is an architecture where every application feature is developed
    and deployed as a small independent application. As a simple example, an application
    with a web front-end and a database back-end will have two microservices – one
    for the front-end and one for the back-end. The most common model is to deploy
    each microservice as its own set of containers. For example, your initial deployment
    might have one container for the front-end and a different container for the back-end.
    If you need to scale-up the front-end, you add more identical front-end containers.


    To avoid confusion, `microservices` is the application architecture such as developing
    each application feature as its own small app. `Cloud native` is the features
    such as resiliency, scalability, rollouts, etc. The two work together very well.


    While it’s true that cloud native isn’t just running apps in the cloud, it’s also
    true that many of the concepts originated in the public cloud and work best there.
    However, it’s possible to be `cloud native` in your own on-premises datacenter,
    and doing so will bring many benefits to your business. For example, on-premises
    infrastructure and applications can be observable, automated, and even have elements
    of resiliency and scalability. They will also be easier to migrate to the cloud
    and even burst into the cloud. However, they’ll always struggle to compete against
    the theoretically infinite resources of the public cloud.


    Let’s quickly clarify a few key terms. Anything not clarified here will be covered
    in detail in the following sections.


    ### Public cloud


    The `public cloud` is on-demand pay-as-you-use infrastructure and services offered
    by a 3rd-party. Popular examples include Amazon Web Services, Microsoft Azure,
    Google Cloud Platform, and Digital Ocean. The infrastructure and services are
    shared with other users and you don’t own or manage them. You just consume them
    and pay for what you use. Most cloud platforms are so large that we sometimes
    say they have infinite capacity.


    ### On-premises datacenter


    `On-premises`, `on-prem` and `datacenter` are all terms that refer to your own
    dedicated infrastructure and services that you own and manage. You may even own
    the facility that houses them, but this is not a requirement. They are usually
    very small compared to public clouds.


    ### Infrastructure

    `Infrastructure` is things such as servers, virtual machines, cloud instances,
    networks, and storage.


    ### Cloud bursting

    `Cloud bursting` is when you max-out your datacenter capacity and use the cloud
    as an overflow area. For example, an online retail app might max out on-prem datacenter
    capacity over a holiday weekend and scale into the public cloud to meet the temporary
    peak in demand. Users of the app may have requests serviced by instances running
    in your on-premises datacenter or the public cloud and should not know the difference.
    When demand decreases, the app stops using the public cloud.


    In summary, `cloud native` is a combination of technologies and practices. Applications
    and infrastructure that are resilient, scalable, observable, and automated are
    “cloud native”. Organisations that embrace processes and standards that enable
    frequent and reliable deployments are “cloud native”. You can be cloud native
    if you run in the public cloud or your own on-premises datacenters.


    Let’s dig deeper into the specific learning objectives for the exam.


    ## Resiliency


    `Resilient` applications and infrastructure can self-heal when things break. In
    fact, sometimes we call resiliency “self-healing”.


    A simple infrastructure example is a node pool. Most cloud platforms let you create
    a pool of virtual servers called a node pool. If you configure one with 10 virtual
    servers, and one of them fails, the system can self-heal by spinning up a new
    node and automatically adding it to the pool.


    `Kubernetes` offers self-healing capabilities for applications and infrastructure.
    For example, if `Kubernetes` knows you need 5 containers for a web front-end microservice,
    and one of them fails, it spins up a new one so you still have 5.


    Although these are simple examples, combining resilient applications with resilient
    infrastructure is extremely powerful.


    ### Loose coupling and building for failure


    A key principle when designing resilient systems is to expect things to fail.
    This forces you to build stuff that can handle failures. A popular and battle-tested
    infrastructure example is disk mirroring. This is where two copies of the same
    data are written to two separate storage devices. When one of them fails, you
    can still access the data and no downtime or data loss is incurred. The key word
    from the previous sentence is `when`, not `if` – `when one fails` not `if one
    fails`.


    Modern microservices applications should be designed and built in the sure knowledge
    that components will fail from time to time. Simple tactics to deal with this
    include loose coupling of microservices and consuming via `APIs`. That’s a lot
    of buzzwords, so this non-technical analogy should help.


    Imagine you’ve bought a product that shipped with a missing part. An option is
    to contact the customer services team. To do this, you call a generic phone number
    and speak to Mia who opens a support case and ships the missing part. Two days
    later it still hasn’t arrived, so you call back. This time Ross answers the phone
    and you ask to speak to Mia. Unfortunately, she’s on vacation for a week, so you
    give your case number to Ross. He’s able to help you because your case details
    are stored on an external shared system the whole team has access to. In this
    example, you’re `loosely coupled` with the customer services team via a generic
    phone number and your case notes are stored on a separate system the entire team
    can access. This means you can speak to any member of the customer services team
    and they can help you with your case.


    A `tightly coupled` version of the same scenario might look like this. You’ve
    bought a product that arrived with a missing part. You call Mia, from the customer
    service team, on her direct phone number. She records some case notes on her laptop
    and ships the missing part. Two days later it still hasn’t arrived, so you call
    back.., her phone keeps going straight to messages. After two days of trying to
    contact Mia you manage to find the phone number of another member of the customer
    support team called Ross. You call him on his direct phone number and he explains
    he can’t access your case notes because they’re on Mia’s laptop and she’s taken
    it home with her. In this scenario you were tightly coupled to a specific member
    of the support team and things fell apart when your person wasn’t there.

