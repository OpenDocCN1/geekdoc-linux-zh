- fmt: '

    It’s also common for microservices applications to run on platforms like `Kubernetes`
    and have cloud native capabilities such as self-healing, scaling, and rollouts.
    All of these operations add and remove containers from the IP network and cause
    IP addresses to come and go a lot more frequently than most networks were designed
    for – this is sometimes called `IP churn`.


    All of this requires a new container networking model and a new generation of
    networking tools.


    ### Kubernetes and container networking


    Kubernetes implements an open flat network called the `pod network`. This is where
    containers run, and it spans all nodes in a Kubernetes cluster. Let’s take a closer
    look at some of its capabilities.


    The Kubernetes pod network is flat and open. That’s jargon meaning all containers
    can see each other and can communicate with each other. This keeps things simple
    and makes container-to-container traffic easy. However, you should use Kubernetes
    network policies to to control traffic flow. This includes restricting which containers
    and services can communicate with each other – letting everything communicate
    with everything is a major security risk.


    Kubernetes also implements and automates service discovery. All new applications
    automatically have their names and IP addresses registered with internal DNS.
    They’re also configured to use the internal DNS to find other applications. Kubernetes
    makes this automatic so that applications don’t have to worry about how to implement
    it.


    Kubernetes also implements IP address management (`IPAM`) that takes care of assigning
    IP addresses to new containers and garbage collecting the IP addresses of terminated
    and failed containers. This keep things fresh by ensuring DNS never resolves requests
    to the IP addresses of containers that are no longer running.


    Kubernetes does not have strong capabilities for network observability and tracing.
    Observability is the ability to see what is going on a network and potentially
    troubleshoot or optimise traffic flow. Tracing is the ability to track requests
    as they pass between the different microservices of an application. For these
    capabilities you should consider a service mesh.


    Finally, the Kubernetes pod network is implemented by a networking plugin and
    you can choose one that best fits your requirements. For example, not all network
    plugins support `IPv4` and `IPv6` networking. Kubernetes implements the Container
    Network Interface (`CNI`) to make the pod network pluggable. This is similar to
    the way it makes container runtimes pluggable with the Container Runtime Interface.


    In summary, containers and microservices applications bring a new set of challenges
    to networking. There’s a lot of east-west network traffic that needs securing
    and needs to be observable. Cloud native features, such as self-healing and scaling,
    mean containers are frequently added and removed from the network causing a lot
    of IP churn. This requires strong IP address management and service discovery
    tools. Kubernetes implements an open flat pod network that you should secure with
    network policies. It also provides strong `IPAM` and service discovery tools.
    For container-to-container traffic encryption, as well as deep visibility into
    traffic flow, you should use a service mesh.


    ### Service meshes


    Service meshes automatically add network security, observability, and reliability
    to cloud native applications and are important for large-scale production environments.


    A key aspect of service meshes is the ability to add these features automatically.
    They do this by implementing them at the platform layer instead of the application
    layer. This is jargon that means you just install the service mesh and every application
    that runs on it “just gets the features”. It’s a powerful model that means developers
    and individual applications don’t need to even think about these services.


    Consider a large microservices application that needs to encrypt traffic. Without
    a service mesh you’d need to code every microservice with the intelligence and
    certificates to encrypt and decrypt traffic. This adds complexity to every microservice
    and distracts developers from developing features that benefit customers and the
    business. The alternative is a service mesh that automatically does all of the
    encrypting and decrypting without the application even knowing it’s happening
    – the service mesh provides the encryption “as a service”.


    Let’s look at how service meshes are usually implemented on Kubernetes.


    Kubernetes is a cluster of control plane nodes and worker nodes that run containerised
    applications. However, Kubernetes actually runs containers inside of another construct
    called a `pod`. This might sound confusing, but it’s not – a pod is just a lightweight
    wrapper that let’s Kubernetes schedule multiple containers as a single unit. Service
    meshes exploit this by injecting a lightweight service mesh container into the
    same pod as every application container. The service mesh container transparently
    takes over networking in the pod and does things such as encrypting/decrypting
    all traffic ingressing and egressing the pod. It also exposes advanced networking
    telemetry that can be used to troubleshoot and optimise network performance. A
    key feature is that application containers are unaware of the existence of the
    service mesh and just operate as normal. See Figure 3.4


    ![](resources/images----figure3-4.png)


    Figure 3.4


    Popular service meshes include `Istio`, `Linkerd`, and `Consul`. Others exist,
    but they all provide similar features. Linkerd is a graduated CNCF project, and
    the Service Mesh Interface (`SMI`) is a specification aimed at to standardising
    fundamental service mesh capabilities in Kubernetes.


    In summary, service meshes offer out-of-the-box network security and observability
    at the platform layer. This means applications can focus on being applications
    and not have to care about the network. They accomplish this in Kubernetes by
    injecting a special service mesh container into applications pods. This service
    mesh container handles network traffic entering and leaving the pod, enabling
    them to transparently secure traffic and expose advanced telemetry for troubleshooting
    and traffic optimisation. There are lots of service mesh options for Kubernetes
    and the `SMI` is an industry specification that defines common service mesh capabilities.


    ### Container storage


    Containers are designed to be ephemeral and stateless. Ephemeral means they’re
    designed to be short-lived, and if they fail you replace them with new ones instead
    of fixing them. Stateless means they were never designed to store data. In fact,
    if a container fails, all data inside it is lost.


    With this in mind, containers should store data in external systems. It’s a very
    simple model where application code runs in containers and application data is
    stored outside of them. A simple cloud example running on `AWS` might have business
    application code running inside containers that store the data they generate in
    `AWS` elastic block store (`EBS`) volumes. This way, if any of the application
    containers fail, the data still exists in the `EBS` volumes. A similar on-premises
    example might have application code running inside containers and the data they
    generate in volumes on a shared `NetApp` storage system. Other clouds and storage
    systems exist.


    This model decouples the lifecycle of data from the lifecycle of containers and
    allows you to pick and choose the right storage backend for each containerised
    application. The architecture is shown in Figure 3.5.


    ![](resources/images----figure3-5.png)


    Figure 3.5

