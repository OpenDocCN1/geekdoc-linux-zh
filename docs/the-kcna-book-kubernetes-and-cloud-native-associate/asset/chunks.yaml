    **43.** You’ve described a new application in a declarative Kubernetes manifest
    file called “kcna-app.yml” and want to deploy it with `kubectl`. Which command
    should you run?


    *   1.  kubectl run -f kcna-app.yml


    *   2.  kubectl deploy -f kcna-app.yml


    *   3.  kubectl post -f kcna-app.yml


    *   4.  kubectl apply -f kcna-app.yml


    **44.** You’re concerned about the networking requirements of some applications
    you’re in the process of containerising and deploying to Kubernetes. Which of
    the following network-related technologies does Kubernetes provide out-of-the-box?


    *   1.  IPAM


    *   2.  Service registration and discovery


    *   3.  Traffic encryption


    *   4.  Deep observability


    **45.** What is the atomic unit of scheduling on a Kubernetes cluster?


    *   1.  Container


    *   2.  Pod


    *   3.  Deployment


    *   4.  Function


    **46.** An application microservice in your live production environment is down
    and you need to troubleshoot the root cause. Which class of telemetry data is
    the most likely place you’ll find the root cause?


    *   1.  Metrics


    *   2.  Application logs


    *   3.  Audit logs


    *   4.  Trace data


    **47.** One of your development teams is writing an in-house application that
    creates and uses persistent data and they want to run it on Kubernetes. Which
    of the following Kubernetes controllers might be appropriate for the app?


    *   1.  Workload controller


    *   2.  StatefulSet controller


    *   3.  StatelessSet controller


    *   4.  Deployment controller


    **48.** Why does Kubernetes implement higher-level controllers instead of deploying
    static pods?


    *   1.  They provide advanced network telemetry


    *   2.  They add features such as resiliency, scaling, and updates


    *   3.  They allow pods to be migrated between different cloud platforms


    *   4.  They run pods faster


    **49.** How do Kubernetes controllers operate?


    *   1.  As key-value stores


    *   2.  Client-server architecture


    *   3.  As RESTful objects exposed over HTTPS


    *   4.  As background reconciliation loops


    **50.** Why is serverless called serverless if it uses servers?


    *   1.  It uses “less” servers


    *   2.  The servers are so well hidden


    *   3.  All work runs on a single large Mainframe


    *   4.  It only works in the public cloud


    **51.** You’re deploying a new GitOps workflow that deploys to production upon
    successful merge. Which of the following common practices will be an anti-pattern
    when your GitOps workflow goes live?


    *   1.  Leaving manual comments in the PR comments forum


    *   2.  Making manual changes to the live environment


    *   3.  Pushing builds with the deploy label


    *   4.  Deploying Kubernetes objects via declarative manifests


    **52.** You have a small Kubernetes environment and need a GitOps tool that’s
    easy to deploy and learn how to use. Which of the following is a good tool to
    choose?


    *   1.  Jenkins


    *   2.  ArgoCD


    *   3.  CircleCI


    *   4.  FluxCD


    **53.** You’re about to deploy a new application and the developers want to be
