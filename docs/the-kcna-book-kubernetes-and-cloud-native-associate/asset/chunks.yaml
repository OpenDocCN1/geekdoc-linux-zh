    In summary. Containers are a form of virtualisation that is lighter weight than
    hypervisor virtualisation like VMware. This means containers waste less infrastructure
    and are more portable. Application code and dependencies are packaged into container
    images that are stored in centralised registries and downloaded by servers that
    want to run them. Servers use a container runtime to download container images
    and run them as containers. You also learned that containers virtualise operating
    systems – each container is essentially a virtual operating system running a single
    app. A server running 10 containers can run 10 apps.


    ## Container runtimes


    Containers run on physical servers, virtual machines, and cloud instances. As
    they all look the same to a container we’ll refer to them generically as `nodes.`


    Every node that wants to run containers needs specialised software called a `container
    runtime.` This is responsible for downloading container images from registries,
    as well as creating, starting, stopping, and deleting containers on the node.
    Docker is the best-known container runtime, but lots of others exist.


    Let’s revisit the workflow mentioned earlier to show where container runtimes
    fit in.


    Developers write applications that get built into container images and stored
    in registries. To run a container, a node needs to download the image and start
    a container from it. The software that does this is the container runtime. The
    act of downloading a container image is usually referred to as `pulling the image`.


    If you’ve worked with VMware, it might be helpful to compare container runtimes
    with ESXi. This is because both are low-level tools that perform tasks such as
    starting and stopping containers or VMs. In the VMware world, higher-level tools
    like vCenter add more advanced functionality. In the container world, higher-level
