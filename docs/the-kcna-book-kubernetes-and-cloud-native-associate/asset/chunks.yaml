    *   4. Scheduler


    **7.** 下面哪些是 Kubernetes 集群节点的类型？请选择两项。


    *   1. 工作节点 (Worker nodes)

    *   2. 次级节点 (Secondary nodes)

    *   3. 控制平面节点 (Control plane nodes)

    *   4. 主节点 (Primary nodes)


    **8.** 什么是托管 Kubernetes？


    *   1. 你的云平台拥有并管理 Kubernetes 控制平面

    *   2. 所有运行在公共云平台上的 Kubernetes 集群

    *   3. 本地 Kubernetes 集群的名称

