    这是一本来自 [Leanpub](https://leanpub.com) 的书。Leanpub 通过精益出版（Lean Publishing）流程为作者和出版者赋能。[精益出版](https://leanpub.com/manifesto)
    是使用轻量级工具和多次迭代来发布进行中的电子书，以获取读者反馈，不断调整直到获得正确的书籍，并在成功后建立影响力的行为。


    © 2022 Nigel Poulton


    ## 目录


    ## 指南


    1. 开始阅读


    # 入门


    Kubernetes 和云原生技术正风靡，并塑造着我们工作的世界。将应用程序构建为小型、专门、单一用途的服务，并使其能够自愈、自动伸缩且在不停止机机的情况下定期更新，这将带来巨大的收益。然而，掌握利用这些技术的知识和技能对你个人的职业生涯来说是一个巨大的助力。例如，了解如何设计、构建和排错运行在
    Kubernetes 上的云原生微服务应用程序，可以让你在最好的机构、最好的项目上获得最好的职位。它甚至能让你赚到更多钱。


    考虑到这一切，云原生计算基金会（CNCF）设计了 KCNA 考试和认证，作为你证明自己掌握这些技术能力的一种方式。


    本书以组织良好且简洁的格式，在一个地方涵盖了所有的考试目标。它既可以作为复习指南，也可以作为学习新技术和概念的起点。例如，如果你已经了解 Kubernetes
    的基础知识，这本书将强化你已经掌握的所有内容，并通过大量的测验和解释来测试你的知识。然而，如果你对考试中的任何主题都比较陌生，这本书将带你快速进入状态。


    ## 本书适合谁读


    本书适合任何想要获得 KCNA 认证的人。


    由于考试测试的是你对核心技术和概念的理解，它适用于任何从事技术工作的人。示例包括：


    * 架构师

    * 管理人员

    * 技术营销

    * 开发人员

    * 运维人员

    * DevOps, DevSecOps, CloudOps, SRE 等

    * 数据工程师

    * 更多……


    如果你来自传统的 IT 背景并想学习 Kubernetes 和云原生的基础知识，那么这本书和考试将特别有用。


    如果你是 Kubernetes 的纯新手，你应该考虑阅读*快速上手 Kubernetes*（*Quick Start Kubernetes*）。它只有 100
    页，将让你快速进入状态并 100% 熟悉 Kubernetes 的基础知识。它还有非常易懂的上手示例，真的能帮助你掌握一些对你来说可能是新的概念。它在 Amazon
    和 Leanpub 上架，并有多种语言，包括法语、意大利语、葡萄牙语、俄语、简体中文、西班牙语以及更多即将推出。


    ## 本书是如何组织的


    本书的技术内容按每个考试领域分为一个章节。有一个章节专门用于让你准备考试，还有一个包含 60 题的**完整模拟考试**，与真实考试一样。


    每个技术章节的结构如下：


    * 技术内容

    * 章节总结

    * 考试要点

    * 练习题


    *考试要点*是对所学主要主题的总结，可以在进行最后的复习和备考时像抽闪卡一样使用。


    练习题测试你对所学主题的掌握情况，其风格与考试中的题目相似。然而，它们不是真实的考试题。


    专门用于准备和参加考试的章节详细解释了考试的真实情况，这样你在考试当天就不会有任何意外。


    模拟考试是你测试自己是否准备好参加真实考试绝佳机会。再次强调，这些题目*像*你将在考试中看到的题目，但它们不是真实的考试题。


    ## 关于作者


    好的，我是 Nigel，我已经在云技术和容器技术方面培训了超过一百万人。我编写了多本畅销书和多个视频培训课程，并将我的职业生涯致力于帮助人们迈出容器和 Kubernetes
    的第一步。我热热于尽可能清晰地解释事情，以便你喜欢我的书和视频。


    我实际上是以草稿形式写完整本书的，参加了考试，然后回来对内容进行了精细调整，以更好地为你准备考试。我曾考虑过通过考试并重考多次，以便对题目风格和测试详细程度有更好的感觉。然而，这感觉很不对，我想尽快把这本书交到你手中。


    我很乐与你联系，并希望能听到你的考试经历。你可以通过以下所有方式找到我：


    * LinkedIn: https://www.linkedin.com/in/nigelpoulton/

    * 网站: nigelpoulton.com

    * Twitter: @nigelpoulton


    ## 反馈


    写书很辛苦，我在假期期间工作不懈，才把这本书送到你手中。考虑到这一点，如果你愿意花一分钟写写 Amazon 评论，我会将其视为你的一份情。


    此外，如果你对这本书或你的考试经历有任何反馈，请给我发送电子邮件到 `kcnabook@nigelpoulton.com`，我会尽力回复。


    祝阅读愉快，祝你考试好运！


    # 1: 设定背景


    本章没有直接对应考试目标。然而，你将学习的内容在考试中，并且对于设定为什么会有容器和 Kubernetes 等技术的背景非常重要。如果你已经了解了这些，可以跳到下一章。否则，请留下来，我们将为本书其余部分设定背景。


    我们将从高层次涵盖以下内容：


    * 虚拟化

    * 容器化

    * 从单体应用到微服务的转变


    如果你觉得我们涵盖的细节不够，请不要担心。这只是一个介绍章节，我们将在后面的章节中进入细节。


    ## 虚拟化


    在遥远的过去，我们每台物理服务器部署一个应用程序。这是对物理资源和公司资本的巨大浪费。它在等待物理服务器采购、上架、接入网络和安装操作系统期间也延迟了应用程序的发布。


    `VMware` 等虚拟化技术的出现，为我们在单台物理服务器上运行多个应用程序打开了大门。这意味着我们不需要为每个新应用购买新服务器，可以在现有服务器的虚拟机上快速部署应用，并避免以下所有情况：


    * 不再需要等待财务部门批准服务器购买

    * 不再需要等待数据中心团队上架和连接服务器

    * 不再需要等待网络团队在网络上授权服务器

    * 不再需要系统管理员安装操作系统


    几乎立即，我们就从在购买和安装需要漫长时间的性能过剩物理服务器上浪费钱……转变为一个我们可以在现有服务器上快速配置虚拟机的世界。


    然而，行业从未睡眠，创新从未停止。


    ## 容器化


    在 21 世纪 10 年代初，`Docker` 为世界带来了易用容器的礼物。


    从高层次来看，容器是虚拟化的另一种形式，允许我们在更少的服务器上运行更多的应用程序，并部署得更快。


    图 1.1 显示了服务器虚拟化和容器虚拟化的对比图。


    ![](img/images----figure1-1.png)


    图 1.1


