- fmt: '

    Consider the following simple example. You have a crucial business application
    that creates and manages very important customer data. The data needs to be protected
    and the app needs fast access to it. You run the business application on containers
    that read and write data to a high-performance storage system that replicates
    data offsite and takes regular snapshots. As the data is stored in an external
    storage system, application containers can fail and be replaced by new containers
    running on different nodes that can access the same data. This is an example of
    loosely coupling application code and logic with the application data.


    Kubernetes has a pluggable storage layer based on the Container Storage Interface
    (CSI). It provides a common storage interface that external systems can plug into
    and provide their storage services to applications running on Kubernetes. For
    example, if you have a NetApp storage system that you want to use with Kubernetes,
    you’ll install NetApp’s CSI plugin on your Kubernetes cluster and connect the
    storage.


    In summary, containers are designed to run small, specialised business applications
    and be stateless. This means you shouldn’t store data in them because it disappears
    any time the container fails or is deleted. Instead, you use CSI plugins to mount
    volumes from external systems into containers. These volumes look and feel exactly
    the same as local volumes and apps read and write data to them as normal. This
    way, if, and when, containers fail or are replaced, the data survives. It’s common
    to expose volumes into Kubernetes from enterprise-grade storage systems that provide
    advanced data management and data protection services. You can make block storage,
    file storage, and object storage available to Kubernetes.


    All of this is transparent to the app that just reads and writes data.


    ## Chapter summary


    In this chapter, you learned the basics of containers and how they’re like smaller
    faster virtual machines that are better suited for microservices applications.
    Container runtimes are low-level applications that start and stop containers and
    are usually managed by higher-level applications like Kubernetes. Kubernetes orchestrates
    containerised applications, which is jargon for providing features such as scheduling,
    self-healing, and autoscaling.


    You also learned that containers and micro-services design patterns introduce
    new security threats such as shared kernels, root containers, unsecured networks,
    and untrusted code. Containers also provide new and unique challenges for network
    services such as IP address management and service discovery. They also have an
    impact on overall network security. Kubernetes provides native IPAM and service
    discovery, but you need a service mesh for container-to-container encryption and
    deep visibility into network traffic flow.


    Finally, you learned that containers are designed to be stateless and ephemeral.
    This means you should always store data outside of the container in an external
    storage system.


    ## Exam essentials


    ### Container runtimes


    `Container runtimes` are a class of infrastructure application that specialises
    in low-level container operations such as creating, starting, stopping, and deleting
    containers. They tend to operate in the background and are managed by higher-level
    tools like Kubernetes. For example, you or your team might deploy applications
    to Kubernetes on a daily basis. However, you won’t run the commands to actually
    start and stop containers – Kubernetes looks after all of that for you behind
    the scenes. `Docker` is the best-known container runtime, but others include `containerd`
    and `CRI-O`.


    ### Containerisation


    `Containerisation` is the process of building an application and its dependencies
    into a container image. For example, when a developer has written an application
    and packaged it as a container image you can say the developer has “containerised
    the app”.


    ### The Open Containers Initiative (OCI)


    `The OCI` is an open organisation that develops low-level container standards
    such as the `container runtime-spec` and `container image-spec`. Both have been
    instrumental in growing the number of container runtimes and build tools. Container
    images that are built to the `OCI image-spec` are often referred to as `OCI images`.
    `Docker`, `containerd`, `CRI-O`, and most other container runtimes work with OCI
    images.


    ### Images and containers


    Developers write applications and use build tools to package them as `images`.
    Container runtimes download images and start `containers` from them. As such,
    a container is a running instance of an image, and on the flip side, images are
    like stopped containers. However, you can start multiple containers from a single
    image. For example, you can download a single copy of the `MySQL` image and run
    multiple containers from it.


    ### Container orchestration


    `Container orchestration` tools, such as `Kubernetes`, automate most of the day-to-day
    operational aspects of deploying and managing containerised applications. For
    example, Kubernetes will schedule containers on nodes with enough resources to
    run them, scale them up and down based on demand, replace them when they fail,
    and manage rollouts and rollbacks.


    ### Kubernetes


    `Kubernetes` is the industry-standard container orchestrator. It runs as a cluster
    of one or more control plane nodes and one or more worker nodes. You package microservices
    applications as containers and run them on Kubernetes clusters. However, as you’ll
    learn later, they have to run inside pods. Kubernetes has the intelligence to
    schedule each container workload to appropriate cluster nodes, it scales them
    when required, heals them when failures occur, and enables frequent rollouts.
    Control plane nodes implement the orchestration intelligence and worker nodes
    are where user apps run.


    ### Container Runtime Interface (CRI)


    `The CRI` is an open standard implemented by Kubernetes to make the container
    runtime layer pluggable. This means you can pick the best container runtimes for
    your requirements, and each worker node in a Kubernetes cluster can run a different
    container runtime. `Docker` was the original container runtime used by Kubernetes,
    but it’s being replaced by `containerd` as the default on most new Kubernetes
    clusters.


    ### Shared kernels


    The most popular type of containers are `namespaced containers` and they all share
    the kernel of the node they’re running on. They’re the most popular and lightweight,
    but they’re the least secure. `Docker`, `containerd`, `CRI-O` and many others
    container runtimes create namespaced containers. Virtualised containers and sandboxed
    containers are more secure but not as lightweight and portable.


    ### Root containers


    Don’t run applications as root in your containers. This is because they can pose
    a significant risk to the node they run on, as well as every other container on
    the same node. You should design your applications so they don’t need to run as
    root, and you should implement policies that prevent containers from running as
    root. If your apps absolutely have to run as root, you should implement `user
    namespaces` to map the root user inside the container to a non-root user on the
    node. This means a compromised root container won’t have root access on the node.


    ### Unsecured networks


    Microservices applications are heavily distributed over multiple nodes meaning
    they have to share sensitive data over IP networks. This is a huge security risk
    if those networks are open and data is sent in plain text. With this in mind,
    you should encrypt all traffic between containers. One of the simplest ways to
    do this is by implementing a service mesh.


    ### Untrusted code


    You should only run applications that you know and trust. A simple way to accomplish
    this is to build and test all code yourself internally. Do not use and trust code
    downloaded from the internet such as community images.


    Container networking: IP address management (IPAM)

