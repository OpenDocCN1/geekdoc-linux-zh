  trans: '


    Pods 允许多个容器被共同调度到同一个节点，并共享相同的执行环境（内存和卷）。同一个 pod 中的容器不共享相同的容器镜像，因为它们应该是不同的、互补的容器。例如，一个运行
    `NGINX` 镜像的 Web 容器和一个运行 `Git` 同步镜像的辅助容器。


    ### 问题 10，答案 A, B, D

    这与上一个问题相似。同一个 pod 中的所有容器运行在同一个节点上，并共享对相同卷和网络栈的访问。它们不会共享相同的容器镜像。


    ### 问题 11，答案 B, C

    Kubernetes 集群由控制平面节点和工作节点组成。


    ### 问题 12，答案 B, D

    `API server` 和调度器运行在 Kubernetes 控制平面上。`kubectl` 是 Kubernetes 的命令行工具，你通常将其安装在笔记本电脑或管理员工作站上。`kube-proxy`
    处理节点级网络，虽然它在技术上也运行在控制平面和工作节点上，但它不被视为控制平面的一部分。


    ### 问题 13，答案 C

    为了高可用性，所有控制平面服务都运行在所有控制平面节点上。


    ### 问题 14，答案 C

    你应该始终部署奇数个控制平面节点。3 是最常见的，但 5 也很常见。


    ### 问题 15，答案 D

    `kubectl` 是 Kubernetes 的命令行工具。


    ### 问题 16，答案 B

    集群存储（cluster store）是唯一的有状态控制平面服务，通常基于 `etcd` 分布式数据库。


    ### 问题 17，答案 A

    如果控制平面崩溃，现有应用程序将继续运行。但在控制平面恢复之前，你将无法管理它们或部署更多应用。


    ### 问题 18，答案 D

    `kubectl` 将所有请求发送给 `API server`。


    ### 问题 19，答案 B

    Kubernetes 控制器作为调谐循环运行，确保观测状态与期望状态同步。


    ### 问题 20，答案 D

    `deployment` 控制器管理 Kubernetes 上的无状态负载。


    ### 问题 21，答案 C

    `statefulset` 控制器管理 Kubernetes 上的有状态负载。


    ### 问题 22，答案 A

    `daemonset` 控制器确保集群中的每个工作节点都运行一个 pod 实例。


    ### 问题 23，答案 C, D

    `Current state`（当前状态）和 `actual state`（实际状态）与 `observed state`（观测状态）意思相同。


    ### 问题 24，答案 C

    调谐（Reconciliation）是将观测状态恢复到与期望状态同步的过程。


    ### 问题 25，答案 B

    Kubernetes 控制器作为后台控制循环运行，将观测状态同步期望状态。


    ### 问题 26，答案 A

    `kube-proxy` 负责在集群节点上实现本地网络规则。


    ### 问题 27，答案 D

    运行时接口 (`CRI`) 是使 Kubernetes 容器运行时层可选的工具。


    ### 问题 28，答案 A

    `containerd` 是现代 Kubernetes 集群中最流行的容器运行时。`Docker` 在旧集群中更流行，但在 Kubernetes `1.20`
    中被弃用，并在 `1.24` 中移除。


    ### 问题 29，答案 C

    `Docker` 在 Kubernetes `1.20` 中被弃用，并在 `1.24` 中移除。


    ### 问题 30，答案 C

    `kubeconfig` 文件通常被称为“config”，存储在用户配置目录下的隐藏 `.kube` 文件夹中。


    ### 问题 31，答案 D

    `kubectl` 将返回详细信息。


    ### 问题 32，答案 B, C

    `kubectl` 不应该多于一个。


    ### 问题 33，答案 A

    pod 将保持在 pending（等待）状态。


    ### 问题 34，答案 C

    使用标签（labels）可以让你跨节点分布。


    ### 问题 35，答案 D

    Kubernetes 命名空间（namespaces）划分集群。每个命名空间都有自己的配额。


    ### 问题 36，答案 B

    定义了 Kubernetes 对象。


    ### 问题 37，答案 C

    Kubernetes 每年发布三个大版本。


    ### 问题 38，答案 A

    Kubernetes 部署所有 pod。


    ### 问题 39，答案 D

    容器网络接口 (`CNI`) 使网络层可选。


    ### 问题 40，答案 A

    `Cilium` 使用 eBPF 进行网络。


    ## 第 5 章：云原生交付


    问题 1，答案 A, C

    “Release”（发布）和“rollout”（滚动更新）都指的是应用的更新。


    问题 2，答案 C

    持续集成 (`CI`）允许构建和测试代码。


    问题 3，答案 A

    持续集成 (`CI`）是识别 bug 的极方法。


    问题 4，答案 A

    持续部署 (`CD`）是部署到生产环境的过程。


    问题 5，答案 C

    CI/CD 是 DevOps 的基石。


    问题 6，答案 D

    `Jenkins` 是一个流行的 CI/CD 工具。`Kubernetes` 和 `Swarm` 都是容器编排器。


    问题 7，答案 B

    使用 CI/CD 工具允许开发者花费更多时间进行构建。


    问题 8，答案 A, C, D

    GitOps 工作流将基础设施即代码、拉请求和持续交付集成在一起。


    问题 9，答案 A, B, D

    基础设施即代码（IaC）定义了策略、网络和其他基于云的组件。它不能用于物理任务。


    问题 10，答案 B

    IaC 在本地和公云环境中均可用。但是，由于公云环境倾向于高度虚拟化，它在这些环境中工作效果更好。


    问题 11，答案 B

    Kubernetes 对象通常定义在 YAML 文件中。


    问题 12，答案 A

    拉请求（Pull requests）和合并（merges）用于触发 GitOps 工作流的 CD 步骤。


    问题 13，答案 A, B

    `ArgoCD` 和 `FluxCD` 都是流行的 GitOps 工具。


    问题 14，答案 D

    一旦开始使用 GitOps 流程，就不应进行手动更改，因为每次 PR 合并并触发 CD 流水线时，更改都会被覆盖。


    问题 15，答案 D

    Linus Torvalds 创建了 GitHub 使用的 Git 版本控制系统。


    问题 16，答案 B

    GitOps 工具只关心部署到生产环境，而不关心构建阶段。


    问题 17，答案 A

    在 GitOps 工作流中，所有手动更改都会在每次 PR 随后的合并中被覆盖。


    问题 18，答案 C

    反模式（anti-pattern）是指在执行时看起来是个好主意，但后来证明是坏主意的事。一个简单的例子是在生产环境中进行手动修复来解决问题。然而，当自动化过程启动时，该修复会被覆盖。


    问题 19，答案 A

    `FluxCD` 以配置和使用简单而闻名。


    ## 第 6 章：云原生观测性


    问题 1，答案 D

    遥测（Telemetry）是系统输出的日志数据、指标和追踪。


    问题 2，答案 A, B, C

    遥测的三类主要数据是日志、指标和追踪。


    问题 3，答案 D

    `Prometheus` 以时间序列格式存储数据。


    问题 4，答案 B

    遥测用于故障排除和调优系统性能。


    问题 5，答案 B

    OpenTelemetry 项目为云原生观测性提供了实例化和规范。


    问题 6，答案 B

    日志数据是通常以文本或 JSON 格式输出的应用程序输出。


    问题 7，答案 C


