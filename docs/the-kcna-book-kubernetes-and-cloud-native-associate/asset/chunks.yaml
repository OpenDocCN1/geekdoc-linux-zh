- fmt: "\nKeeping it high-level, you describe the desired state of your infrastructure\
    \ in configuration files that you store in a Git repo for version control. Every\
    \ time you make a change to your environment you check the files out of Git, update\
    \ them with your changes, and submit a Pull Request (PR) to merge the changes\
    \ into the repo. As soon as the PR is merged, the process of deploying the changes\
    \ to your live environment kicks in.\n\nAlthough there are lots of GitOps tools,\
    \ such as `Argo`, `Flux` and `Jenkins X`, GitOps is actually a collection of tools,\
    \ workflows, and practices. These include:\n\n*   Infrastructure as Code\n*  \
    \ Pull requests and merges\n*   Continuous delivery\n*   Zero tolerance for manual\
    \ changes\n\nLet’s take a closer look at each.\n\n## Infrastructure as Code (IaC)\n\
    \nIaC is the practice of defining infrastructure in declarative configuration\
    \ files. This means instead of using GUIs and scripts to deploy things like virtual\
    \ machines, networks, and policies, you define them in configuration files that\
    \ you feed to your GitOps tools and let them do the hard work of provisioning.\
    \ It’s a key component of fast and repeatable infrastructure deployments.\n\n\
    > **Terminology.** `Declarative configuration` is a pattern where you describe\
    \ the `desired state` of something in a configuration file and let a tool or process\
    \ implement it. A common real-world example is defining Kubernetes objects in\
    \ YAML configuration files that you feed to the Kubernetes API server and Kubernetes\
    \ provisions the objects for you.\n\nUsing configuration files to deploy infrastructure\
    \ works well on cloud platforms where there’s a pool of available infrastructure\
    \ you can claim and configure. For example, an IaC config file might define cloud\
    \ instances, network configurations, firewall and ACL rules, routing tables, network\
    \ policies, and more. You send the config file to your cloud and your cloud provisions\
    \ it. However, it isn’t as powerful in on-premises environments as they don’t\
    \ usually have large pools of configurable resources. Also, IaC cannot perform\
    \ common on-premises provisioning tasks such as physically racking servers and\
    \ connecting physical network cables.\n\nOne area where IaC is extremely common\
    \ and powerful is Kubernetes. This is because Kubernetes describes everything\
    \ in configuration files that are used for provisioning. As an example, Kubernetes\
    \ pods, services, ingresses, network policies, load-balancers, and more are all\
    \ declaratively described in YAML configuration files that you post to the API\
    \ server and Kubernetes provisions them. The following YAML file is an example\
    \ of IaC – it describes a Kubernetes load-balancer service that will listen on\
    \ port 9000 and forward the traffic on port 8080 to pods with the `env=prod` label.\
    \ You can use `kubectl apply` to send the file to a Kubernetes cluster and Kubernetes\
    \ will talk with your cloud platform and provision the load-balancer.\n\n```\n\
    apiVersion: v1\nkind: Service\nmetadata:\n  name: test-lb\nspec:\n  type: LoadBalancer\n\
    \  ports:\n  - port: 9000\n    targetPort: 8080\n  selector:\n    env: prod\n\
    ```\n\n## Pull requests and merges\n\nGitOps combines IaC with well-established\
    \ Git workflows to create automated continuous delivery pipelines. Over the past\
    \ few years, it’s become a very popular way to manage Kubernetes environments\
    \ and has inspired a new generation of continuous delivery (CD) tools.\n\nConsider\
    \ the following example. You build a Kubernetes cluster and install a GitOps tool\
    \ such as `Flux`, `Argo`, or `Jenkins X`. You configure the GitOps tool to monitor\
    \ a Git repo that you use to store your Kubernetes configuration. You describe\
    \ a new application in a Kubernetes YAML file that comprises several Kubernetes\
    \ objects such as pods, service accounts, secrets, network policies and an ingress.\
    \ You create a Pull Request (PR) to merge the YAML file into the Git repo. The\
    \ PR includes a description of the changes and evidence of any testing. Teammates\
    \ comment on the PR and it gets approved and merged to the repo. Your GitOps tool\
    \ notices the merge and initiates a continuous deployment process that provisions\
    \ the app and infrastructure on your Kubernetes cluster.\n\nSometime later, you\
    \ need to make a small update to the config. Instead of manually editing the live\
    \ environment, you create a branch of the Git repo and make the configuration\
    \ changes there. Once you’re happy with them you create a PR to merge them with\
    \ the master branch of the repo. Teammates once again comment on the PR and eventually\
    \ approve the merge. Your GitOps tool observes the merge and kicks-off another\
    \ continuous delivery process to apply the update.\n\nAs you can see, `PRs` and\
    \ `merges` are critical GitOps operations. In fact, there are four important GitOps\
    \ rules:\n\n1.  Store `all` of your app and infrastructure configuration in Git\n\
    2.  Use `PRs` and merges for approvals and triggering deployments\n3.  Automate\
    \ deployment\n4.  Stop making manual changes\n\nLet’s clear up some of the jargon.\n\
    \n`Git` is a popular open-source version control system created by Linus Torvalds\
    \ (the inventor of Linux). Its core functionality is tracking changes and enabling\
    \ rollbacks, and it’s used to manage large and small projects. Huge projects include\
    \ Linux and Kubernetes, small projects include things such as the lab files for\
    \ my other books and video training courses.\n\n`GitHub` is cloud-based code repository\
    \ that uses Git for version control. It organises files into folders called `repositories`\
    \ and you normally give each project its own repository. For example, all the\
    \ files for my Quick Start Kubernetes book are on GitHub in the `nigelpoulton/qsk-book`\
    \ repository, whereas all the files for The Kubernetes Book are in the `nigelpoulton/TheK8sBook`\
    \ repository – one project per repository.\n\n`Git` lets you create `branches`\
    \ of a repository as areas to work on changes. You work on changes in your own\
    \ branch and use pull requests to merge your changes into a special branch called\
    \ `master`. This master branch is the source of truth and all changes and updates\
    \ from other branches have to be `merged` into master to become part of the project.\
    \ As mentioned, the process of merging changes to the master branch is initiated\
    \ via `Pull Requests (PR)` that notify team members the changes are ready to be\
    \ reviewed and potentially `merged`. PRs provide a comments forum where changes\
    \ can be discussed.\n\nIn the example, a GitOps tool such as `Flux` or `Argo`\
    \ is watching the master branch of the Git repository. Every time it observes\
    \ a merge, it kicks off a continuous delivery (CD) process to deploy the updated\
    \ configuration to the live environment.\n\n### Continuous delivery\n\nAs mentioned\
    \ earlier in the chapter, CI/CD is two distinct processes.\n\n*   `CI` builds\
    \ and tests software\n*   `CD` deploys to live environments\n\nGitOps is primarily\
    \ focussed on the CD aspects and doesn’t handle the earlier CI steps. This means\
    \ you’ll still need a CI tool to handle application building, testing, and sharing.\n\
    \n### Zero tolerance for manual changes\n\nOnce you adopt GitOps, you can no-longer\
    \ make manual changes to live environments as they’ll be lost with every PR and\
    \ successful merge.\n"
