    * `containerd` (读音“container dee”）

    * `runC` (读音“run see”）

    * `CRI-O` (读音“cry oh”）

    * `gVisor` (读音“jee visor”）

    * `Kata containers`


    正如你预期的，每种工具都有其优缺点。


    Docker 已经很长时间并且被广泛使用。然而，它的功能远不止于底层工作。例如，Docker 还执行了高级调度，并实现了许多通常由 Kubernetes 等平台提供的高级功能。因此，对于许多项目和场景来说，它显得大材小用。


    `containerd`（读音“container dee”）仅仅是从 Docker 中提取出的底层运行时代码，并于 2017 年捐赠给了 CNCF。得益于其轻量级的特性，它正迅速成为
    Kubernetes 使用的最流行的容器运行时。它基于 `OCI` 规范并与 `OCI` 镜像协同工作。


    > **术语：** OCI 创建了三项规范，定义了容器的低层行业标准。其中一项规范是 `image-spec`，它定义了容器镜像应该什么样以及如何构建。符合
    OCI image-spec 的容器镜像通常被称为 `OCI images`。几乎所有的容器运行时都能与 `OCI images` 配合。简单来说，`Docker
    images` 和 `OCI images` 是同的。


    ### 容器运行时的类型


    容器和容器运行时主要有三种类型：


    * 命名空间（共享内核）

    * 沙箱（代理内核）

    * 虚拟化（专用内核）


    这些术语归结底就是尺寸和安全性的区别。


    命名空间容器最快且最轻量，但安全性最低。这是因为同一节点上的每个容器都共享该节点的内核。Docker、`containerd` 和 `CRI-O` 都是创建命名空间容器的常见运行时示例。


    虚拟化容器启动最慢且消耗资源最多，但它们最安全。这是因为每个容器都运行在带有独立内核的虚拟机内部。Windows 容器和 `Kata Containers`
    是虚拟化容器的运行时示例。


    沙箱容器是折中方案的一种。它们比虚拟化容器更快、更小，但比命名空间容器更大、更慢。在安全性方面，它们也处于中间位置。实现细节超出了本书和考试的范围，但它们通常会在容器与宿主机内核之间实现一个代理层。`gVisor`
    是创建沙箱容器的运行时示例。


    ### Kubernetes 与容器


    尽管 Kubernetes 是一个容器编排器，但在没有容器运行时帮助的情况下它无法运行容器。


    图 3.2 显示了 Kubernetes 与容器运行时之间的关系。Kubernetes 管理一个节点集群，每个节点运行一个容器运行时，并告诉它们何时启动和停止容器。它还实现了自愈和自动伸缩等高级智能功能。


    ![](img/images----figure3-2.png)


    图 3.2


    在早期，Kubernetes 使用 Docker 作为其运行时，许多 Kubernetes 安装现在仍然如此。然而，Kubernetes 实现了一项名为容器运行时接口（`CRI`）的技术，允许用户选择喜欢的容器运行时。目前，`containerd`
    是大多数新 Kubernetes 集群的默认容器运行时。


    `OCI` 规范对于启用 `CRI` 起了关键作用，允许 Kubernetes 使容器运行时可切换——只要容器运行时与 `OCI images` 兼容，你就可以用一个替换另一个。


    > **术语。** OCI 维护着容器运行时和容器镜像等内容的低层行业规范。`CRI` 是让 Kubernetes 的容器运行时层变得可扩展的关键。不要把两者搞混了。


    总结，容器运行时是拉取镜像、启动、停止和删除容器的底层工具。它们具有不同的形状和大小，以适应不同的业务和技术需求。例如，某些快速轻量但安全性较低，而另一些更大更慢但更安全。OCI
    创建的规范为容器生态系统带来了重要的标准，使得构建各种容器相关的工具和平台成为可能。Kubernetes 是一个更高级的工具，管理容器运行时集群，并告诉它们运行哪些容器，同时带来了自动伸缩和其他云原生功能。Kubernetes
    还实现了一个名为容器运行时接口的可插拔层，允许你根据需求选择最佳的容器运行时。最后，由于容器运行时是底层工具，它们通常在后台运行，你通常通过 Kubernetes
    等更高级的工具与它们间接交互。


    ## 容器编排基础


    一旦我们开始使用容器，就显而易见我们需要帮助来管理它们。这是因为我们正在将大型应用程序拆分为许多小小的、松耦合的微服务，这些微服务不断地扩展和缩小，而且我们一直在发布新版本和更新。例如，一个很少更改的大型单体应用将被一个不断变化的复杂的微服务应用所取代。我们需要帮助。


    Docker Swarm、Kubernetes 和 Mesosphere DCOS 等工具的创建是为了帮助解决这个问题。简而言之，Kubernetes 在这些工具中脱颖而出，现在已成为地球上最重要的云原生技术。


    从高层面上说，Kubernetes 是一个`容器编排器`。这意味着它运行并管理运行在容器中的应用程序。部分包括提供云原生功能，如调度、自愈和自动伸缩等。


    让我们考虑一个简单的例子。你有一个带有前端和后端的业务应用程序。你的开发者设计了两个微服务——一个用于前端，一个用于后端。每个微服务都编写并封装成容器镜像，托管在容器仓库中。你需要一个平台来运行应用程序并提供云原生功能，因此选择了
    Kubernetes。你的运维团队构建了一个具有 3 个节点的 Kubernetes 集群，运行 `containerd` 容器运行时。集群完成后，你告诉
    Kubernetes 运行两个前端容器和两个后端容器——这被称为“期望状态”（desired state）。Kubernetes 部署应用程序并配置“监控循环”，以确保集群上实际运行的内容与你的要求相符。我们称之为“观测状态”（observed
    state）和“期望状态”。


    假设集群的一个节点发生故障并带走了一个前端容器。监控循环会发现观测状态现在只有一个前端容器，而期望状态是两个。它们将通过在幸存节点上启动第二个前端容器来自动修复此问题，使观测状态恢复到同步期望状态。同时，由于你配置的节点池有三个节点而目前只有两个，一个新的第三节点将被自动创建并加入池中。我们称之为“自愈”或“弹性”。


    让我们也假设你为应用配置了伸缩指标，Kubernetes 发现前端难以以应对当前需求。为了解决这个问题，它自动将前端容器的数量从两个扩展到四个。这解决了问题，当需求下降时，Kubernetes
    会自动缩减回两个。


    这展示了 Kubernetes 的云原生能力，并被称为`容器编排`。


    ### Kubernetes 架构基础


    Kubernetes 是由`控制平面节点`和`工作节点`组成的集群。


    控制平面节点运行所有实现云原生功能的智能——那些让 Kubernetes 成为 Kubernetes 的功能。


