- fmt: '

    Worker nodes are where user applications run.


    A non-technical analogy might be Amazon. Amazon is basically a web service and
    distribution service. The web service runs all the intelligence that implements
    things like the product catalog, searches, your shopping basket and wish lists
    – the stuff that makes Amazon Amazon. The distribution part is how stuff gets
    to users and is a bit like the Kubernetes worker nodes.


    It’s vital that Kubernetes control plane nodes are high performance and highly
    available. As a quick example, placing three control plane nodes in different
    datacenter halls or cloud zones is a good practice. This means if one zone or
    datacenter hall experiences something like a power outage, not all control plane
    nodes will fail. A bad example would be putting all three control plane nodes
    in the same datacenter rack under a leaky air-conditioning unit and all on the
    same network switch and same power supply – if any of those things break, all
    three control plane nodes could fail.


    It’s usually recommended to run 3 or 5 control plane nodes for high availability.


    In summary, containers are used to run complex microservices applications and
    we need help managing them. Kubernetes is the most popular tool for doing this
    and sits in a class of tools called `container orchestrators`. The job of a container
    orchestrator is to `deploy` and `manage` containerised applications. Deploying
    includes selecting the right nodes to run containers, whereas managing includes
    making sure they’re resilient, scale when required, and can be easily updated
    and rolled back. Kubernetes clusters are made up of control plane nodes and worker
    nodes. The control plane nodes implement the Kubernetes intelligence, whereas
    worker nodes are where user apps run. Worker nodes rely on container runtimes
    to start and stop containers, but Kubernetes makes the overall decisions which
    nodes should run which containers. Kubernetes also makes the decisions to self-heal
    and scale etc.


    ## Container security


    There are several security risks that are particularly relevant to containers.
    We’ll cover the following.


    * Shared kernels

    * Root containers

    * Unsecured networks

    * Untrusted code


    ### Containers and shared kernels


    Before going any further, `kernel` is a technical term for the core functionality
    of an operating system. For example, the core of the Windows operating system
    is the `Windows NT kernel`, and the core of Linux operating systems is the `Linux
    kernel`. We often use the terms `operating system` and `kernel` to mean the same
    thing.


    `Namespaced containers` are the most popular type of container and operate a shared
    kernel model. This means all containers running on the same node share the node’s
    kernel. As an example, 25 containers running on the same node will all share the
    node’s kernel. This is a big part of why containers are small and start fast,
    but it’s a security risk. For example, if the node’s kernel is hacked or compromised,
    every container on that node is also compromised. Also, a single container that
    gets hacked and compromised might be able to compromise the node and every other
    container on that node.


    This means namespaced containers are inherently less secure than virtual machines.


    Examples of container runtimes that create namespaced containers are `Docker`,
    `containerd`, `runC`, and `CRI-O`.


    `Virtualised containers` and `sandboxed containers` were created to address the
    shared kernel issue. Virtualised containers run every container in its own lightweight
    virtual machine where each one gets its own kernel. This resolves the shared kernel
    issue but comes at the cost of each container being larger and slower to start.
    Sandboxed containers attempt to protect the host kernel without giving each container
    its own VM and kernel.


    Other technologies exist to secure containers but are usually complex to configure.
    Some of these include `seccomp`, `capability dropping`, `SELinux`, and `AppArmor`.


    ### Root containers


    “Root” is the name of the most powerful user account on a Linux system. This is
    why running containers as `root` gives them too much power and is a huge security
    risk. As a result, you should avoid writing applications that need to run as the
    root user inside containers.


    If you absolutely have to run containers as root, you should consider `user namespaces`
    so the `root` user inside a container is automatically mapped to a different user
    account on the shared node.


    ### Unsecured networks


    We’ve mentioned several times that containers run microservices apps that are
    highly distributed and talk to each other over the network. This makes networks
    a potential weak point and popular area to attack. As a result, it’s vital that
    container-to-container communication is encrypted. A common way to do this is
    with a service mesh.


    You should also consider `Kubernetes Network Policies` to restrict which microservices
    can communicate with other microservices.


    ### Untrusted code


    Containers evolved while the public cloud was a relatively new concept. As a result,
    we made a lot of mistakes as we figured things out. For example, a habit that
    became popular was running containers from so-called `community images.` These
    were images provided by unknown and un-trusted 3rd parties. Consider the following
    quick example.


    You’re leading a project to deploy a new application that implements a technology
    you’ve never worked with before. Instead of figuring out the technology yourself
    and building your own trusted images, you realise somebody else has already done
    the hard work and uploaded a “working” image to a container registry. You decide
    to download and use that image as it will save you a lot of effort. The obvious
    risk is that the community image could contain malicious code.


    With this example in mind, it’s vital that you only run trusted code.


    In summary, cloud native security is often said to consist of four C’s:


    * Code

    * Containers

    * Clusters

    * Cloud


    We’ve just said you should always trust the `code` you run. This includes knowing
    where it came from and exactly what it contains and what it does. You should also
    ensure your `containers` are safe by not allowing root containers to run, and
    choosing the right container runtime. You should also mitigate the potential dangers
    of namespaced containers and their shared kernel model. You should also make sure
    your Kubernetes clusters are up-to-date with security fixes and properly secured
    with `RBAC` (user accounts and access control). Finally, you should do everything
    in your power to secure your datacenters and cloud infrastructure.


    Figure 3.3 shows the four C’s and how you normally have less and less control
    the further to the right you go.


    ![](resources/images----figure3-3.png)


    Figure 3.3


    ## Container networking


    Containers and microservices bring all of the following networking challenges.


    * Increased east-west traffic

    * Service discovery

    * Tracing requests

    * IP churn

    * Security


    `East-west` network traffic is jargon for containers in the same application talking
    to each other on the same networks. The other type of traffic flow is called north-south
    and is applications talking to external services. Consider a simple example of
    a microservices application with a web front-end service and a shopping cart service.
    Traffic between the front-end and the shopping cart containers is east-west traffic
    on the same network. The traffic between the front-end and external client, such
    as a customer’s mobile phone app, is north-south and over untrusted networks such
    as the internet.


    Microservices architectures split complex applications into lots of small applications
    that all talk to each other over the network. This massively increases east-west
    traffic and requires traffic to be encrypted.

    '
