    曾经是一个具有单一且固定 IP 地址的大型单体应用，现在变成了一个拥有 15 个 IP 地址的云原生微服务应用。不，等一下，它刚刚扩展了，现在是 21 个
    IP 地址。不，等一下，23 个……微服务应用中的每个容器都有自己的 IP 地址，随着规模的扩大和缩小，以及新版本的发布，IP 地址会不断从网络中添加和删除。这需要现代的
    IPAM（IP 管理）工具。Kubernetes 为高度动态的网络提供了原生的 IPAM。


    ### 服务发现


    Kubernetes 使用专用的内部 DNS 进行服务注册和发现。Kubernetes 集群上的所有新服务都会自动注册到 DNS 中，并且每个容器都配置为使用此内部
    DNS 进行服务发现。这意味着 Kubernetes 集群上的每个服务都能找到其他服务。


    ### Kubernetes Pod 网络


    Kubernetes 实现了一个名为“pod 网络”的网络，所有容器都连接到该网络。它是一个扁平开放网络，意味着所有容器都可以连接到所有其他容器。它也是实现
    IPAM 和服务发现的地方。然而，你应该使用 Kubernetes 网络策略来对其锁定，并控制哪些服务允许通信。


    ### 服务网格


    服务网格在生产级 Kubernetes 环境非常有用。它们在平台层提供了网络安全和可观测性。这意味着应用程序可以专注于业务本身，而无需考虑流量安全和遥测数据暴露——服务网格会自动提供所有这些。流行的服务网格技术包括
    Istio、Linkerd 和 Consul。服务网格接口（SMI）是一个与 Kubernetes 相关的规范，定义了一组标准的服务网格资源。


    ### 容器存储


    容器被设计为无状态的。这意味着你不应该将数据存储在它们中，因为当容器被删除或丢失时数据将会丢失。Kubernetes 实现了一种名为容器存储接口（CSI）的技术，使第三方存储资源能够暴露在
    Kubernetes 中并被运行在 Kubernetes 上的应用程序使用。它让你能够为运行在 Kubernetes 上的应用暴露企业级存储。这也意味着当容器被删除或失败时，数据仍然可用。


    ## 回复习题


    答案请参附录 A。


    **1.** 关于容器，以下哪项是正确的？选择所有正确答案。

    * 1. 容器类似于轻量级虚拟机

    * 2. 你不能在容器中运行用户应用程序

    * 3. 容器始终有专用的内核

    * 4. 你通常每个容器运行一个应用程序


    **2.** 运行相同数量的程序，以下哪项需要的最少基础设施？

    * 1. 容器

    * 2. 虚拟机

    * 3. 物理服务器


    **3.** 哪个更容易打包和共享？

    * 1. 容器

    * 2. 虚拟机


    **4.** 你正在建议你的业务采用 Kubernetes 和容器。你的开发者需要学习任何新的编程语言吗？

    * 1. 需要

    * 2. 不需要


    **5.** 下列哪项最能描述容器镜像的内容？

    * 1. 操作系统内核

    * 2. 仅应用程序代码

    * 3. 应用程序依赖项列表

    * 4. 应用程序代码和依赖项


    **6.** 容器解决了以下哪些问题？

    * 1. 共享内核

    * 2. 恶意代码注入

    * 3. 在笔记本电脑上可以运行，在生产环境中报错

    * 4. 网络流量加密


    **7.** 启动和停止容器的软件名称是什么？

    * 1. 服务网格

    * 2. 容器运行时

    * 3. 虚拟机

    * 4. 沙箱


    **8.** 下列哪项是容器运行运行时的工作？选择所有正确答案。

    * 1. 下载（拉）容器镜像

    * 2. 选择在哪个节点上运行容器

    * 3. 启动容器

    * 4. 停止容器


    **9.** Open Containers Initiative（开放容器 way）的角色是什么？

    * 1. 定义 Kubernetes 标准

    * 2. 定义低级容器标准

    * 3. 确保容器始终是开源的

    * 4. 帮助生态系统项目走向成熟


    **10.** 什么是 OCI 镜像？

    * 1. Docker Hub 上可用的社区镜像，用作标准基础镜像

    * 2. 任何符合 OCI 镜像规范（image-spec）的容器镜像


    **11.** Docker 镜像和 OCI 镜像的主要区别是什么？

    * 1. Docker 镜像更小

    * 2. OCI 镜像更小

    * 3. OCI 镜像更慢

    * 4. 没有区别


    **12.** 下列哪项是容器的主要类型？选择 3 个。

    * 1. 沙箱容器

    * 2. 虚拟化容器

    * 3. OCI 容器

    * 4. 命名空间容器


    **13.** 下列哪些容器共享节点的内核？选择所有正确答案。

    * 1. Kata 容器

    * 2. Docker 容器

    * 3. CRI-O 容器

    * 4. containerd 容器


    **14.** Kubernetes 原生创建什么种类型的容器？

    * 1. 命名空间容器

    * 2. 沙箱容器

    * 3. Kubernetes 可以创建命名空间、虚拟化和沙箱容器

    * 4. Kubernetes 无法原生创建容器


    **15.** 下列哪项是大多数现代 Kubernetes 集群的默认容器运行时？

    * 1. containerd

    * 2. CRI-O

    * 3. Docker


    ****16.** 下列哪种技术允许不同的运行时？

    * 1. OCI 规范

    * 2. CRI

    * 3. VCL

    * 4. gVisor


    **17.** 下列哪项是 OCI 负责的？

    * 1. 低级容器标准

    * 2. 使容器运行时可插


    **18.** 下列哪些项是容器编排器的工作？选择所有正确答案。

    * 1. 自愈

    * 2. 自动伸缩

    * 3. 创建镜像

    * 4. 调度容器到节点


    **19.** 现在最流行的编排器是？

    * 1. Docker

    * 2. containerd

    * 3. Kubernetes

    * 4. CRI


    **20.** 下列哪项描述 Kubernetes 集群？

    * 1. 多个控制平面节点

    * 2. 多个工作节点

    * 3. 多个控制平面和工作节点

    * 4. 多个容器


    **21.** 下列哪些是容器的潜在安全风险？选择所有正确答案。

    * 1. 根容器

    * 2. 不安全的网络

    * 3. 不信任的“社区”代码或镜像

    * 4. 共享内核


    **22.** 如果你有需要在根容器中运行的应用，下列哪种技术可能有帮助？选择一个。

    * 1. Rootkits

    * 2. 用户命名空间

    * 3. pid 命名空间

    * 4. 加密网络


    **23.** 云原生安全的四个 C 是什么？

    * 1. 代码、证书、集群、云

    * 2. 代码、容器、集群、证书

