    What was once a large monolithic application with a single IP address that never
    changed is now a cloud native microservices application with 15 IP addresses.
    No, wait, it just scaled up and is now 21 IP addresses. No, wait, 23… Every container
    in a microservices application has its own IP address, and as things scale up
    and down, and as new versions are rolled out, IP addresses are constantly being
    added and removed from the network. This requires modern IPAM tools. Kubernetes
    provides native IPAM for highly dynamic networks.


    ### Service discovery


    Kubernetes uses a dedicated internal DNS for service registration and discovery.
    All new services on a Kubernetes cluster are automatically registered with DNS,
    and every container is configured to use this internal DNS for service discovery.
    This means every service on a Kubernetes cluster can find every other service.


    ### The Kubernetes pod network


    Kubernetes implements a network, called the “pod network”, that all containers
    get connected to. It’s a flat open network meaning all containers can connect
    to all other containers. It’s also where IPAM and service discovery are implemented.
    However, you should use Kubernetes network policies to lock it down and control
    which services are allowed to communicate.


    ### Service meshes


    Service meshes are very useful in production Kubernetes environments. They provide
    network security and observability at the platform layer. This means applications
    can focus on being applications without having to think about securing traffic
    and exposing telemetry – the service mesh automatically provides all of this.
    Popular service mesh technologies include Istio, Linkerd, and Consul. The Service
    Mesh Interface (SMI) is a Kubernetes-related specification defining a standard
    set of service mesh resources.


    ### Container storage


    Containers are designed to be stateless. This means you shouldn’t store data in
    them as it will be lost when the container is deleted or lost. Kubernetes implements
    a technology called the Container Storage Interface (CSI) that enables 3rd-party
    storage resources to be exposed in Kubernetes and used by applications running
    on Kubernetes. It makes it possible for you to expose enterprise-grade storage
    to apps running on Kubernetes. It also means that when containers are deleted
    or fail, the data is still available.


    ## Recap Questions


    See Appendix A for answers.


    **1.** Which of the following is true of containers? Choose all correct answers.

    * 1. Containers are like lightweight virtual machines

    * 2. You cannot run user applications in containers

    * 3. Containers always have a dedicated kernel

    * 4. You normally run one application per container


    **2.** Which of the following requires the least infrastructure to run the same
    number of apps?

    * 1. Containers

    * 2. Virtual machines

    * 3. Physical servers


    **3.** Which is easier to package and share?

    * 1. Containers

    * 2. Virtual machines


    **4.** You’re recommending your business adopts Kubernetes and containers. Will
    your developers need to learn any new programming languages?

    * 1. Yes

    * 2. No


    **5.** Which of the following best describes the contents of a container image?

    * 1. Operating system kernel

    * 2. Just application code

    * 3. A list of application dependencies

    * 4. Application code and dependencies


    **6.** Which of the following problems does containers solve?

    * 1. Shared kernel

    * 2. Malicious code injection

    * 3. Works on laptop, breaks in production

    * 4. Encryption of network traffic


    **7.** What is the name of the software that starts and stops containers?

    * 1. Service mesh

    * 2. Container runtime

    * 3. Virtual machine

    * 4. Sandbox


    **8.** Which of the following is the job of a container runtime? Choose all correct
    answers.

    * 1. Download (pull) container images

    * 2. Choose which node to run containers on

    * 3. Start containers

    * 4. Stop containers


    **9.** What is the role of the Open Containers Initiative (OCI)?

    * 1. To define Kubernetes standards

    * 2. To define low-level container standards

    * 3. To ensure containers are always open source

    * 4. To help ecosystem projects progress to maturity


    **10.** What is an OCI image?

    * 1. A community image available on Docker Hub to be used as a standard base image

    * 2. Any container image complying with the OCI image-spec


    **11.** What is the major difference between a Docker image and an OCI image?

    * 1. Docker images are smaller

    * 2. OCI images are smaller

    * 3. OCI images are slower

    * 4. There is no difference


    **12.** Which of the following are the main types of containers? Choose 3.

    * 1. Sandbox containers

    * 2. Virtualised containers

    * 3. OCI containers

    * 4. Namespaced containers


    **13.** Which of the following containers share the node’s kernel? Choose all
    correct answers.

    * 1. Kata containers

    * 2. Docker containers

    * 3. CRI-O containers

    * 4. containerd containers


    **14.** What type of containers does Kubernetes natively create?

    * 1. Namespaced containers

    * 2. Sandboxed containers

    * 3. Kubernetes can create namespaced, virtualised, and sandboxed containers

    * 4. Kubernetes can’t natively create containers


    **15.** Which of the following is the default container runtime on most modern
    Kubernetes clusters?

    * 1. containerd

    * 2. CRI-O

    * 3. Docker


    **16.** Which of the following technologies allows different runtimes?

    * 1. OCI spec

    * 2. CRI

    * 3. VCL

    * 4. gVisor


    **17.** Which of the following is OCI responsible for?

    * 1. Low-level container standards

    * 2. Making the container runtime pluggable


    **18.** Which of the following are jobs a container orchestrator does? Choose
    all correct answers.

    * 1. Self-healing

    * 2. Autoscaling

    * 3. Creating images

    * 4. Scheduling containers to nodes


    **19.** What is the most popular orchestrator in use today?

    * 1. Docker

    * 2. containerd

    * 3. Kubernetes

    * 4. CRI


    **20.** Which of the following describes a Kubernetes cluster? Choose one.

    * 1. One or more control plane nodes

    * 2. One or more worker nodes

    * 3. One or more control plane and worker nodes

    * 4. One or more containers


    **21.** Which of the following are potential security risks for containers? Choose
    all correct answers.

    * 1. Root containers

    * 2. Unsecured networks

    * 3. Untrusted “community” code or images

    * 4. Shared kernels


    **22.** Which of the following technologies might help if you have apps that need
    to run in root containers? Choose one.

    * 1. Rootkits

    * 2. user namespaces

    * 3. pid namespaces

    * 4. Encrypted networks


    **23.** What are the four Cs of cloud native security?

    * 1. Code, certificates, clusters, cloud

    * 2. Code, containers, clusters, certificates

    * 3. Code, containers, certificates, cloud

    * 4. Code, containers, clusters, cloud


    **24.** Which of the following might be network-related challenges that come with
    containers? Choose all correct answers.

    * 1. Traffic security

    * 2. Service discovery

    * 3. IP churn

    * 4. Tracing requests


    **25.** Which of the following significantly increases with microservices applications?

    * 1. North-south traffic

    * 2. East-west traffic

    * 3. Shaped traffic

    * 4. Free CPU cycles


    **26.** Which of the following can increase IP churn (IP addresses being added
    and removed from the network)? Choose all correct answers.

    * 1. Self-healing

    * 2. Autoscaling

    * 3. Rollouts

    * 4. Traffic encryption


    **27.** Which of the following is true of the Kubernetes pod network?

    * 1. It’s open and flat

    * 2. It’s open and hierarchical

    * 3. It’s locked-down by default

