- fmt: '

    Log events are often categorised from lowest to highest severity in the following
    order: `info` > `warning` > `error` > `critical`.


    Question 8, answer A


    High verbosity generates more output than low verbosity.


    Question 9, answer C


    Debug level is the most verbose and intended to dump out as much data as possible.


    Question 10, answers A, B


    Kubernetes supports cluster-level logging via an agent on each node, or an agent
    in a sidecar container.


    Question 11, answers B, C


    The local `kubelet` on each worker node monitors a container’s `stdout` and `stderr`
    streams for logs and makes them available to the `kubectl logs` command.


    Question 12, answers A, B


    Logging agents can convert log data into the format required by your central logging
    system.


    Question 13, answer A


    Cloud native applications should be decoupled from their environment configuration.
    This allows apps to run in multiple environments without having to be changed.
    You can inject environment configuration data at runtime.


    Question 14, answer A


    The `-p` flag returns the logs from the previous instance of a pod/container.


    Question 15, answer D


    Metrics data tracks system performance over long periods of time, making it a
    great way to see historical trends and predict future trends.


    Question 16, answer C


    Custom metrics are metrics tailored to applications and therefore the best way
    to see the health and performance of an application.


    Question 17, answer A


    Tracing is the art of tracking requests as they bounce around a distributed system.


    Question 18, answer C


    Prometheus is considered the industry-standard monitoring system for Kubernetes.


    Question 19, answer D


    Grafana is commonly paired with Prometheus to provide best-in-class dashboards
    and visualisations.


    Question 20, answer B


    Prometheus expects metrics to be exposed over HTTPS on the `/metrics` endpoint.


    Question 21, answer C


    Scraping is the term Prometheus uses to refer to the process of gathering logs
    from remote systems.


    Question 22, answer B


    Prometheus uses a pull model for scraping logs from remotely monitored systems.


    Question 23, answer A


    Prometheus stores data in timeseries format.


    Question 24, answer C


    Prometheus provides a `pushgateway` for short-lived apps that might have terminated
    before Prometheus scrapes its metrics. The app pushes metrics to the `pushgateway`
    and Prometheus scrapes the metrics from there.


    Question 25, answer B


    Prometheus provides client libraries for most programming languages that you can
    use to instrument in-house apps for Prometheus integration.


    Question 26, answer C


    If you don’t have access to the source code of 3rd-party apps, you won’t be able
    to directly instrument them via client libraries. In these situations, you can
    run a Prometheus exporter in a sidecar container that will reformat data for Prometheus.


    Question 27, answers A, B, D


    It’s vital in cloud native environments that you choose the right infrastructure
    and platforms, rightsize things, and turn things off or delete them when you’re
    not using them.


    Question 28, answer B


    Spot instances are the cheapest type of cloud instance and are ideal for services
    that aren’t business critical and can easily be rebuilt or re-deployed.


    Question 29, answer C


    Reserved instances get you discounted pricing on cloud infrastructure in exchange
    for a long-term commitment.


    Question 30, answer B


    Autoscaling ensures you always have the right amount of infrastructure to run
    an app against current demand. As such it is constantly right-sizing your infrastructure.


    Question 31, answers B, C


    When configuring autoscaling it’s vital you watch the right metrics as these are
    what the system uses to make scaling decisions. If you’re monitoring the wrong
    metrics the system will make the wrong decisions. It’s also important you set
    upper and lower bounds to keep costs and usage under control.


    # Appendix B: Sample Test answers


    This appendix contains the answers to the Sample Test.


    Question 1, answers A, B, D


    Self-healing in Kubernetes is based on controllers that operate in reconciliation
    loops ensuring observed state is always in sync with desired state.


    Question 2, answers A, C


    Seccomp and Capability dropping are Linux kernel-related technologies that can
    be used to secure the kinds of access namespaced containers have to the host’s
    kernel.


    Question 3, answer C


    Kubernetes has an internal DNS service it uses for service registration and service
    discovery.


    Question 4, answers B, D


    It’s always important the Kubernetes control plane is high performance and highly
    available.


    Question 5, answer C


    The Kubernetes cluster autoscaler (`CA`) integrates with underlying cloud platforms
    to dynamically add and remove worker nodes to deal with demand.


    Question 6, answer C


    Jaeger is a popular tool for storing and analysing trace data. It’s also a graduated
    CNCF project.


    Question 7, answer A


    Containers normally share the kernel of the host they’re running on. This means
    compromised containers can impact the host and all other containers running on
    the host. It also means a compromised host can impact all containers.


    Question 8, answer B


    DevSecOps Engineers bring a security-first approach to DevOps engineering.


    Question 9, answers A, B, C, D


    Cloud native applications and infrastructure are resilient, can automatically
    scale, and provide extensive observability. Operations like self-healing and autoscaling
    happen without human intervention.


    Question 10, answers A, B, D


    The OCI is responsible for low-level container-related specifications. These include
    the `image-spec`, the `runtime-spec`, and the `distribution-spec`.


    Question 11, answer B


    Service mesh technologies inject a sidecar container into every application pod
    that intercepts network traffic and provides advanced services.


    Question 12, answers B, D


    Docker and `containerd` are examples of container runtimes. `ESXi` is a lightweight
    hypervisor and Kubernetes is a cloud native orchestrator.


    Question 13, answer B


    Virtualised containers avoid the security concerns of shared kernels by running
    each container in its own virtual machine.


    Question 14, answer C


    Kata containers is a container runtime that creates every container in a small
    virtual machine.


    Question 15, answers B, D


    `kubectl` should be no than one version above or below the version of Kubernetes
    you’re running.


    Question 16, answer C


    Service meshes are a common way to encrypt traffic in Kubernetes environments.


    Question 17, answer A


    Generally speaking, you have full control over your own application code, relatively
    less over your containers, even less over your clusters, and hardly any over your
    cloud.


    Question 18, answers A, C


    Kubernetes provides out-of-the-box IPAM and service registration/discovery.


    Question 19, answers A, B, C


    Service meshes provide traffic encryption, network observability, and network
    reliability, at the platform layer.


    Question 20, answer D


    Prometheus expects telemetry to be available on the `/metrics` endpoint.


    Question 21, answers B, D


    Containers are smaller and start faster than virtual machines. As they’re smaller
    you can run more containers on a server than virtual machines.


    Question 22, answer C


    A new version of Kubernetes is released every 4 months. This means there are three
    new releases per year.


    Question 23, answer D


    `gVisor` is a container runtime that implements a proxy kernel between containers
    and the kernel of the host they’re running on.


    Question 24, answer B


    You should always deploy an odd number of control plane nodes for high availability.
    3 is the most common number, but 5 is also quite common.


    Question 25, answers B, D


    `containerd` runs namespaced containers meaning all containers on the same host
    share the same kernel. This is a security concern for a lot of reasons, but also
    means compromised root containers can potentially impact the host and all other
    containers running on the same host.


    Question 26, answer C

