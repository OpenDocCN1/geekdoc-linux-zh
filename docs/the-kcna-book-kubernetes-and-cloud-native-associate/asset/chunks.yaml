    如果你对 API 的概念还不熟悉，你应该将 `Kubernetes API` 想象成列出了所有可能的 Kubernetes 对象及其属性的目录。该目录（API）通过
    `API server` 进行访问。


    例如，Kubernetes 定义了许多对象，如 pods、deployments、replicasets、statefulsets、cronjobs、services、ingresses、network-policies
    等。所有这些对象都定义在 API 中，并包含了所有用于配置它们的属性。当你部署一个对象（例如一个 deployment）时，你会在一个声明式清单（declarative
    manifest）中定义它，并将其发送到 `API server`，在那里它将通过身份验证（authN）、授权（authZ），并调度到集群中。


    如果你尝试部署一个在 API 中未定义的对象，操作将失败。此外，如果你尝试配置一个已不存在对象的属性，操作也会失败。


    `Kubernetes API` 被分为不同的命名组（named groups），以便理解、导航和扩展。例如，与负载相关的对象（如 deployments
    和 statefulsets）定义在 `apps` API 组中，而与存储相关的对象定义在 `storage.k8s.io` API 组中。


    新功能以 `alpha` 特性进入 API，通过 `beta` 阶段，最终毕业成为 `stable`（稳定）阶段。我们有时将稳定功能称为 `generally
    available (GA)` 或 `v1`。稳定对象也可以是 `v2`、`v3` 等。


    下面的 `kubectl` 命令显示了 `Kubernetes API` 中的几个对象。`deployments` 对象是 `apps` 命名组中的稳定 v1
    对象。`CSIStorageCapacity` 是 `storage.k8s.io` 命名组中的一个 beta 对象。


    ```

    $ kubectl api-resources

    NAME                   APIVERSION               NAMESPACED   KIND

    deployments            apps/v1                  true         Deployment

    csistoragecapacities   storage.k8s.io/v1beta1   true         CSIStorageCapacity

    <Snip>

    ```


    Kubernetes 拥有一项弃用策略，保证所有稳定对象在弃用后至少将支持 12 个月或两个发布版本（以较者为准）。


    在编写本文时，每 4 个月会发布一个新的 Kubernetes 版本，导致每年发布三个版本。例如，v1.21、v1.22 和 v1.23 都在 2021 年发布。


    `API server` 通过 RESTful HTTPS 端点暴露 API。所有发送到 `API server` 的请求都必须经过身份验证（authN）和授权（authZ）。


    ### API 和 API server 测验


    **1.** Kubernetes 对象是在哪里定义的？


    *   1. 集群存储（The cluster store）

    *   2. API

    *   3. 个体控制器（Individual controllers）

    *   4. Kubernetes GitHub 仓库


    **2.** 负载对象（如 deployments 和 statefulsets）定义在哪个 Kubernetes API 组中？


    *   1. apps

    *   2. core

    *   3. workloads


    **3.** 下列哪些哪些是指代 v1 API 对象的其他方式？选择两个。


    *   1. Stable（稳定）

    *   2. Beta（测试版）

    *   3. GA

    *   4. Live（在线）


    **4.** Kubernetes 保证稳定对象会被支持多久？


    *   1. 弃用后至少支持一个月

    *   2. 弃用后至少支持 6 个月

    *   3. 弃用后至少支持 12 个月

    *   4. 弃用后至少支持 18 个月


    **答案。** 1:B, 2:A, 3:A,C, 4:C。


    ## Kubernetes 网络


    在本节中，我们将涵盖以下网络相关主题：


    *   Kubernetes services

    *   pod 网络（The pod network）

    *   服务注册与发现


    ### Kubernetes services


    你已经知道 pods 通常是通过高级别的控制器（如 deployment 控制和 statefulset 控制）部署的。这些控制器实现了云原生功能，如自愈、自动伸缩、发布和回滚。


    这些特性使得单个 pod 极其不可靠。考虑以下示例。


    每当节点或 pod 失败时，缺失的 pod 会被具有新 IP 地址的新 pod 替换。如果客户端直接连接失败的 pod，未来的连接将超时且不会重新连接到新
    pod。扩容（Scale-up）事件会添加带有新 IP 地址的新 pod，而缩容（Scale-down）事件会移除 pod。同样，连接到由于缩容操作而被移除的
    pod 的客户端将丢失连接。最后，发布应用的新版本会移除所有现有 pod，并用具有新 IP 地址的新 pod 替换。


    这一切使得 pod 变得不可靠，其他应用永远不应该直接连接 pod。


    为了解决这个问题，Kubernetes 提供了一个 `service` 对象位于 pod 前端并为它们提供可靠的网络。例如，你定义了一个 service 对象并告诉它将流量重定向到带有特定标签的所有
    pod。service 有一个稳定的名称和 IP 地址，Kubernetes 保证该地址永远不会更改。客户端连接到 service，service 将流量重定向到
    pod。service 还足够智能，知道 pod 何时被添加或移除，因此它保证始终将流量负载到最新的运行 pod 集合。


    图 4.5 显示了一个名为 `kcna-svc` 的服务，IP 地址为 10.0.0.10。名称和 IP 是稳定的，客户端应该连接到这些，而不是直接连接到
    pod。所有访问服务的连接都会重定向到带有 `project=kcna-book` 标签的健康 pod。service 确保始终知道 pod 何时从网络中添加或移除。


    ![图 4.5](img/figure4-5.png)


    ### pod 网络


    每个 Kubernetes 集群实现了一个名为 `pod network` 的网络，所有 pod 都运行其上。这是一个扁直开放的网络，意味着所有 pod 都可以通信。这带来了巨大的安全风险。因此，你应该实施
    Kubernetes 网络策略来控制 pod 间的通信。


    在后台，它实际上是一个实现 pod 网络的网络插件。Kubernetes 使用容器接口（CNI）暴露一个可扩展的网络，第三方创建实现 pod 网络的 CRI
    插件。一些常见的 CRI 插件包括：


    *   Cilium

    *   Canal

    *   Flannel

    *   Weave


    Cilium 是开源的，基于 eBPF，目前是最流行的。


    ### 服务注册与发现


    Kubernetes 还基于 DNS 实现了原生的服务注册与发现。服务注册（Service registration）是将新服务的名称和 IP 注册到 DNS，而服务发现（service
    discovery）是通过服务名称获取其 IP 地址的行为。


    > **说明。** 当说“新服务的名称和 IP 注册到 DNS”时，指的是位于 pod 前端的 `Kubernetes service objects` 的名称和
    IP 地址。这些在前面的章节中介绍过。


    Kubernetes 服务发现基于两个核心原则：


    1. 所有新服务都会自动注册到 DNS

    2. 所有 pod 和容器都会自动配置使用 DNS 进行发现


    为了实现这一功能，每个 Kubernetes 集群都会运行一个名为 `cluster DNS` 的内部 DNS 服务。它作为一个 Kubernetes 原生应用程序运行，监控
    API server 服务对象。当它发现新对象时，会自动将其名称和 IP 注册到 cluster DNS。这意味着服务不需要实现任何注册逻辑——cluster
    DNS 一直监控集群并自动注册所有服务。


    同样，Kubernetes 中的每一个容器在需要发现新服务时都会自动配置使用 cluster DNS。这意味着运行在容器中的应用不需要实现任何特殊逻辑来查找其他服务——它们运行的容器会自动完成所有这一切。


    ### Kubernetes 网络测验


    **1.** 哪个 Kubernetes 对象为 pod 提供了稳定的网络？


    *   1. LoadBalancer

    *   2. Ingress

    *   3. Service

    *   4. pod 网络


    **2.** Kubernetes pod 网络是如何实现的？


