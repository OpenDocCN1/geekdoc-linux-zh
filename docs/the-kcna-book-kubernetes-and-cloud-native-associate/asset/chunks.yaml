    * 1. 正确

    * 2. 错误


    **2. 哪个 Kubernetes 节点组件下载容器镜像并启动容器？**

    * 1. Kubelet

    * 2. 容器运行时

    * 3. API 服务器

    * 4. 调度器


    **答案：** 1:B, 2:B.


