- fmt: '

    In Kubernetes environments the `kubelet` on each node watches the `stdout` and
    `stderr` streams of every container and makes the log messages available to the
    `kubectl logs` command. It also keeps the logs from the most recently terminated
    instance of every container in case you need to go back to them. Logs that are
    not written to a container’s `stdout` and `stderr` cannot be viewed using `kubectl
    logs`.


    A drawback to the `kubelet` on each node keeping logs is that if the node fails
    all log messages are lost. This is why it’s considered a better practice to store
    logs in a centralised location where the lifecycle of the log data is separate
    to the lifecycle of the container and the node it’s running on. Kubernetes calls
    this architecture `cluster-level logging` and offers the following options.


    * Node-level logging agent

    * Sidecar with logging agent


    The `node-level logging agent` installs an agent on each node that gathers all
    container logs from the `kubelet` and ships them to a central location. It’s common
    practice to use a Kubernetes `DaemonSet` to deploy and manage the agent on each
    node.


    A logging `sidecar` is a support container that runs in the same pod as an application
    container. It captures the logs from the application container and either streams
    them to its own `stdout` and `stderr`, or forwards them directly to a central
    location.


    Consider the following example. You have an application that writes log data to
    a bespoke location in the container’s filesystem. This means the local `kubelet`
    can’t access them. However, the application provides a sidecar container that
    knows where the logs are written to and forwards them to its own `stdout` and
    `stderr` streams. Doing this allows the `kubelet` on the node to capture them
    from the sidecar and make them available to a node-level agent that can forward
    them on for aggregation. It also makes them available to the `kubectl logs` command.
    It’s a simple solution that means applications don’t need to change where they
    write logs to – the sidecar knows the location and puts them in the place Kubernetes
    expects them.


    Logging sidecars can also forward logs directly to a central location. Doing this
    bypasses the `kubelet` and means you won’t be able to view them with `kubectl
    logs`. This is because `kubectl logs` works with the local `kubelet` and shipping
    them straight to a central location bypasses the `kubelet`.


    `Application-level logging` is another pattern that pushes logs straight to the
    central store in the required format. This also skips the `kubelet` and requires
    applications to be configured with the location of the central store. This is
    an anti-pattern in cloud native apps as it’s not usually good practice to code
    environment-specific configuration into applications.


    As already mentioned, the `kubectl logs` command returns the logs from a running
    container as long as they’re sent to `stdout` or `stderr`. It can also return
    the logs from the most recently terminated instance of a container. If a pod has
    more than one container, you have to specify the container name with the `-c`
    flag. If the pod has only one container you can omit the `-c` flag.


    The following command retrieves logs from the only container in a pod called “kcna”.


    ```

    kubectl logs kcna

    ```


    If the pod is failed or terminated, you can use the `-p` or `--previous` flag.
    The following example retrieves the logs from the `ctr1` container that ran in
    the terminated `kcna` pod.


    ```

    kubectl logs -p -c ctr1 kcna

    ```


    ### Metrics


    Metrics are performance-related values gathered and measured over a period time.
    Each metric is time-stamped, has a name, and can have labels to help with grouping
    and querying. They’re a great way to see historical trends and predict future
    changes.


    Examples of metrics include CPU utilisation, queue length, number of requests,
    error rate, and more. For example, if the number of requests has been averaging
    150 per minute for the last 6 months and suddenly spikes to 10,000, you know something
    has changed and the system may need to react. Likewise, if dropped connections
    has been averaging less than 2 per minute since the system was deployed, but suddenly
    jumps to 5,000, you know something’s wrong.


    Generic system metrics such as CPU utilisation and memory usage are considered
    basic and lack any application intelligence. Custom application metrics are usually
    more useful. Examples include, queue length, response time, requests per second,
    and a lot more. The point is, they’re specific to an application and therefore
    a lot better at determining application performance and whether or not scaling
    operations need to be initiated.


    Speaking of scaling. Cloud native microservices applications will normally autoscale
    to meet demand. However, autoscaling decisions are only as good as the metrics
    being observed. So, it’s not only vital you monitor the right metrics, you also
    need to be able to quickly analyse them for scaling decisions. Consider the following
    simple example.


    You have a cloud native app with 3 microservices and autoscaling configured to
    watch memory usage. Requests traverse all three microservices and you’re suddenly
    experiencing slow response times. You look at your monitoring dashboard and see
    memory usage is within acceptable limits. However, one of the microservices has
    an abnormally large queue size. When discussing with the application developers
    you realise that memory usage isn’t a good indicator of application performance
    and therefore not a good metric to scale on. You rectify the immediate problem
    by adding an extra instance, but you decide to implement custom metrics that monitor
    queue performance so that when this happens again the system has the right metrics
    to make automatic scaling decisions.


    Network-related metrics, such as latency, are also more important than ever as
    more and more requests are reliant on the network.


    ### Tracing


    Tracing is a technical term for tracking the end-to-end journey of requests as
    they pass through the different components of a distributed system.


    Individual requests can be traced, and each trace reports things such as which
    system components processed the request, any events, and how long each event took
    to process. They’re more important than ever in understanding traffic flow and
    potential bottlenecks in distributed microservices environments. For example,
    a request that might previously have hit a single server and been handled locally
    might now hit several servers and traverse the network several times as it’s passed
    between microservices. With this in mind, it’s vital you can observe the end-to-end
    journey of every request so you have the full picture.


    Jaeger is a popular tool for storing and analysing tracing data.


    In summary, effective observability requires high-quality telemetry. Log data
    is created by applications and is a good place to look when something goes wrong.
    Metrics are a great way of seeing historical trends and spotting when trends change.
    Traces are vital in understanding request flow in distributed microservices applications.
    The OpenTelemetry project is trying to make it as simple as possible to instrument
    applications with high-quality telemetry.


    ## Prometheus


    Prometheus is considered the `industry standard` monitoring tool for Kubernetes
    and cloud native environments. It was created by SoundCloud in 2012 when they
    realised existing monitoring tools weren’t good enough for what they needed. It
    was donated to the CNCF as an open-source project in 2016 and became the second
    project to graduate the CNCF in late 2018.


    It’s a common pattern to run cloud native applications on Kubernetes, use Prometheus
    for monitoring and alerting, and use Grafana for dashboards and visualisation.


    ### How Prometheus works

