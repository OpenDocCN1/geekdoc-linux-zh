  raw: 'We’ve already explained upper and lower limits for node pools. They provide
    protection against compromised or runaway services. For example, a node pool configured
    with an upper limit of 10 will never provision more than 10 nodes. This helps
    cap potential costs.


    Watching the right metrics is also important. For example, queue size and request
    response time might be better metrics than CPU utilisation for a message queue
    system.


    Also related to rightsizing and cost management is identifying unused resources
    and turning them off or deleting them. Autoscaling can help here. However, if
    you don’t have autoscaling configured for all resources you should regularly check
    that you’re not paying for infrastructure and services you’re no longer using.


    In summary, autoscaling is a major tool in cloud native cost management. If configured
    correctly, it can ensure you’re only using and paying for the right amount of
    infrastructure to meet requirements. Choosing the right instance types is also
    a huge part of getting cloud costs right. Spot instances offer the biggest discounts
    but can be terminated without warning. Reserved instances offer discount in exchange
    for a long-term commitment to the resource, usually 1-3 years. On demand instances
    are more expensive than spot instances and reserved instances, however, they won’t
    be deleted by your cloud platform and you’re not bound to a long-term usage contract.


    ## Chapter summary


    In this chapter, you learned the three main types of telemetry are logs, metrics,
    and traces. Logs are application events and are a great tool for determining why
    an application or microservice isn’t working. Metrics provide historical trends
    and help identify changes over time. Traces let you track requests as they traverse
    today’s complex microservices apps. You also learned that the OpenTelemetry project
    offers specifications and instrumentation to standardise and simplify the way
    we generate and store telemetry.


    You learned that Prometheus is the most popular monitoring platform used with
    Kubernetes and is often coupled with Grafana for dashboards and visualisations.
    It expects services to expose telemetry on the `/metrics` endpoint and operates
    a pull model where it “scrapes” the data at periodic intervals. It has a push
    gateway for getting telemetry from short-lived processes, and an alert manager
    for sending out alerts.


    You finished the chapter learning how things like reserved instances, spot instances,
    and autoscaling have an impact on costs and cost management.


    ## Exam essentials


    Telemetry


    *Telemetry* is jargon for the monitoring-related outputs generated by a system.
    They include logs, metrics, and traces. High-quality telemetry is vital for troubleshooting,
    tweaking, and understanding the behaviour of cloud native apps.


    OpenTelemetry


    *The OpenTelemetry project* is an incubating CNCF project that defines specifications
    and instrumentation aimed at making high-quality telemetry part of all cloud native
    apps.


    Logs


    *Logs* are a form of telemetry relating to application events and are one of the
    best places to look when things break. For example, application restarts, failed
    logins, dropped connections, and more will all be logged as events. Log data is
    often structured and formatted as JSON to make it easy to read and search. It’s
    also commonly categorised according to severity, with common severity levels including
    *info, warning, error,* and *critical.*


    Metrics


    *Metrics* are usually performance related data captured over long periods of time
    and used to identify performance trends. Autoscalers can use metrics to forecast
    potential issues and perform proactive scaling operations.


    Traces


    *Tracing* is the art of tracking the end-to-end journey of requests as they traverse
    complex distributed systems such as microservices applications. They’re an extremely
    important element of optimising and troubleshooting distributed applications.
    Jaeger is a popular tool for analysing traces.


    Observability


    A highly observable application is one that outputs high-quality telemetry that
    is stored in a central location for analysis. Observing telemetry is often the
    best way of figuring out how distributed applications work and troubleshooting
    them.


    Prometheus


    *Prometheus* is a cloud native monitoring platform. It’s a graduated CNCF project
    and the most popular monitoring platform for Kubernetes environments. It operates
    a pull-based model where it scrapes metrics and log data from remote systems and
    stores them in a timeseries database. It also provides basic dashboards but is
    commonly paired with a more powerful visualisation platform such as Grafana.


    On-demand instances


    *On-demand instances* are the most common type of cloud instance. They’re the
    most flexible and come at the highest cost. You can create and destroy them any
    time you want, and the cloud platform guarantees their availability.


    Reserved instances


    Many cloud platforms offer reserved instances at discounted pricing in exchange
    for a long-term commitment.


    Spot instances


    Many cloud platforms offer spot instances from the spare capacity they carry.
    They’re the cheapest type but have no availability guarantees. For example, the
    cloud will take spot instances away from you if the capacity is needed elsewhere.


    ## Recap questions


    See Appendix A for answers.


    **1.** Which of the following best describes telemetry?


    *   1.  Remote shell access to a system


    *   2.  A map diagram of a microservices app


    *   3.  Pay-as-you-use cloud infrastructure


    *   4.  Health and performance related system outputs


    **2.** Which of the following are the three main types of telemetry data? Choose
    three.


    *   1.  Logs


    *   2.  Traces


    *   3.  Metrics


    *   4.  Audits


    **3.** What format does Prometheus require metrics in?


    *   1.  Hexadecimal


    *   2.  YAML


    *   3.  SOAP


    *   4.  Timeseries


    **4.** Which of the following describes the main aim of telemetry and observability?


    *   1.  Troubleshooting and auditing systems


    *   2.  Troubleshooting and improving systems


    *   3.  Auditing and improving systems


    *   4.  Troubleshooting and proving system snapshots


    **5.** Which of the following is a CNCF project defining specifications and instrumentation
    for cloud native observability?


    *   1.  CloudWatch


    *   2.  The OpenTelemetry project


    *   3.  Kubernetes


    *   4.  The OpenMonitoring project


    **6.** Which of the following telemetry classes outputs application events in
    text or JSON format?


    *   1.  Metrics


    *   2.  Logs


    *   3.  Traces


    *   4.  Audits


    **7.** Which of the following shows log data ranked from lowest severity to highest?


    *   1.  Info, warning, critical, error


    *   2.  Warning, critical, error, info


    *   3.  Info, warning, error, critical


    *   4.  Info, critical, warning, error


    **8.** Which of the following generates more output?


    *   1.  High verbosity


    *   2.  Low verbosity


    **9.** You’re troubleshooting an application and need as much info as possible
    from logs. Which logging level should you choose?


    *   1.  Critical


    *   2.  Info


    *   3.  Debug


    *   4.  Warning


    **10.** Which two types of cluster-level logging does Kubernetes support?


    *   1.  Node-level agent


    *   2.  Sidecar


    *   3.  Aggregated


    *   4.  Persistent logging


    **11.** Which of the following logs can be read with the `kubectl logs` command?
    Choose two.


    *   1.  Logs written to a container’s stdin stream


    *   2.  Logs written to a container’s stderr stream


    *   3.  Logs written to a container’s stdout stream


    *   4.  Logs written to a bespoke filesystem location


    **12.** You have an application that doesn’t generate logs in the format required
    by your central logging system. Which of the following might help? choose all
    correct answers.


    *   1.  A node-level logging agent


    *   2.  A sidecar container with logging agent


    *   3.  A Kubernetes DaemonSet


    **13.** Why is application-level logging sometimes considered an anti-pattern
    in cloud native apps?'
