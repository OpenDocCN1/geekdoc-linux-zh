    # Horizontal Pod Autoscaler (HPA)

    # Cluster Autoscaler (CA)


    The horizontal pod autoscaler adds more `pods` when demand goes up and removes
    them when demand goes down. The cluster autoscaler integrates with your public
    cloud and adds or removes `nodes` according to demand.


    For both autoscalers it’s important you configure upper and lower bounds. For
    example, you might configure `Kubernetes` to limit a node pool to a maximum of
    20 nodes. This can help you control costs and reduce the risk of runaway processes
    and malicious attacks growing the pool too large. Remember, `nodes` cost money
    in the cloud.


    In summary, applications and infrastructure should be able to scale automatically
    based on metrics. Microservices architectures make it possible to selectively
    scale just the parts of an application that need it. `Kubernetes` has a horizontal
    pod autoscaler that scales application microservices to meet demand. It also has
    a cluster autoscaler that scales cloud infrastructure to meet demand.


    Finally, it’s important to understand that scaling is a constant attempt to balance
    performance with cost – providing a good user experience without consuming and
    paying for too much infrastructure.


    ## Serverless


    At a high level, serverless is an event-driven computing model where you write
    small functions that execute when an event triggers them. That’s a lot of jargon,
    and we’ll explain it all in a second, however, there’s a couple of things we need
    to address before getting into the detail.


    1. The terms `serverless` and `Function as a Service (FaaS)` refer to the same
    thing

    2. Serverless uses servers


    Point 2 raises the obvious question; if serverless uses servers, why do we call
    it serverless?


    The answer is simple, the servers are hidden so well that we **never** have to
    think about them. Think about it like this… before cloud computing we spent a
    lot of time and energy working with servers. We had to buy them, rack and stack
    them, pay for maintenance contracts, and even replace them when they failed or
    got too old and slow. The cloud came along and took **most** of the server work
    away. Finally, along came serverless and took **all** of the server work away.
    So, in the serverless model, developers can focus entirely on writing code while
    the serverless platform takes care of all the compute and storage requirements.


    ### Serverless is event-driven


    The event-driven element is key to the serverless model. Consider the following
    serverless workflow.


    1. Developer writes code

    2. Code gets packaged as container image

    3. Code gets uploaded to serverless platform

    4. Code gets associated with an event

    5. Event occurs and code runs


    In this model, the code gets uploaded to the serverless platform and never executes
    until its associated event occurs. If the event never occurs, the code never runs.
    If the event occurs a lot, the code runs a lot. This has financial implications
    on fully-managed cloud platforms where you only pay when your code runs. Code
    that runs a lot will cost you more than code that runs less. Also, despite the
    seemingly low prices advertised by many serverless platforms, code that executes
    a lot can cost a lot of money.


    A couple of other points from the list.


    Most modern programming languages work with serverless, however, you should design
    and write serverless functions according to microservices design patterns – small,
    specialised functions that do a single well-defined job.


    It’s also common to package serverless functions as containers as they are small,
    lightweight, and fit well with microservices architectures. However, not all serverless
    platforms support containers.


    ### Serverless platforms


    A lot of public clouds provide their own proprietary serverless platforms. These
    are usually easy-to-use and operate on flexible pay-as-you-go pricing models.
    However, they’re usually proprietary and lack governance and standards. Popular
    cloud-based serverless platforms include.


    * `AWS Lambda`

    * `AWS Fargate`

    * `Azure Functions`

    * `Google Cloud Functions`


    Popular open-source serverless platforms that support `Kubernetes` include.


    * `Knative` (pronounced “kay native”)

    * `OpenFaaS` (pronounced “open faz”)


    At the time of writing, the serverless ecosystem is lacking strong governance
    and standards. However, the `CloudEvents` project is aiming to resolve this. It’s
    currently an incubating `CNCF` project.


    ### Serverless and scaling


    Scaling is an integral part of most serverless platforms – the platform spins
    up the container and infrastructure required to execute your function and then
    automatically releases them when it completes. If a function executes one million
    times in a minute, the platform spins up the required containers and infrastructure
    and sends you the bill. It also releases them when your functions complete. As
    such, scaling is just part of the way serverless works.


    In summary, serverless is often called `function as a service (FaaS)` and is an
    event-driven computing model where you upload small functions to the serverless
    platform and associate them with events. When those events occur, the functions
    execute. Behind the scenes, many serverless platforms execute functions inside
    of short-lived containers. Scaling is native to serverless, and many clouds have
    their own proprietary serverless platforms that operate a pay-as-you-use pricing
    model – you only pay for each time your functions execute. However, proprietary
    serverless platforms lack open standards and increase your risk of lock-in.


    Finally, when serverless first hit the market there was a lot of speculation that
    it might become the dominant model for modern applications. However, the hype
    has faded and it’s now clear that serverless will work together with containers
    and virtual machines in shaping the future of cloud computing.


    ## Community and governance


    Most cloud native technologies, including `Kubernetes`, are open source. This
    gives them access to large and passionate communities that develop and support
    them. However, strong governance is required to provide direction and order.


    To address this requirement, the `Cloud Native Foundation (CNCF)` was founded
    in 2015. It defines three maturity stages projects have to pass through on their
    journey to “graduation”. The stages are.


    1. `Sandbox`

    2. `Incubating`

    3. `Graduated`


    This three-step process helps projects mature and eventually graduate as production-grade
    projects that can thrive and bring value to the community. `Kubernetes` was the
    first `CNCF` project and graduated in 2018. Since then, more than 15 other projects
    have graduated, and more than 100 are either in the sandbox or incubating stages.


    Projects have to prove their maturity to the `CNCF Technical Oversight Committee
    (TOC)` if they want to progress through the stages. Each stage has its own set
    of requirements, but the following is an example of some of the requirements to
    graduate.


    * Prove the project is in active use by real users

    * Have people from at least two organisations contributing to the project

    * Complete an independent 3rd-party security audit and publish the results

    * Achieve and maintain a Core Infrastructure Initiative Best Practices Badge


    There are other criteria, but these demonstrate the kind of governance provided
    by the `CNCF` – everything pushes projects towards maturity and good practices.
    However, `CNCF` governance is as lightweight and hands-off as possible so that
    projects learn to govern themselves.


    ## Roles and personas


    Being cloud native is more than the technologies you use. It’s also about creating
    a co-operative culture and the right working environment. A large part of this
    is having the right set of roles and job titles that are fully supported by senior
    management.


    The following are typical cloud native job roles and personas that you’ll see
    in the real world. You’ll also be tested on them in the exam.


    ### Cloud Architect

