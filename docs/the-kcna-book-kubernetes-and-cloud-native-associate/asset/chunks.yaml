  trans: '

    在云原生微服务应用世界中，你应该使服务保持松散耦合，并将数据存储在应用之外，这样当单个微服务发生故障或变更时，整个应用程序仍能运行。一个简单的例子可能是微服务
    A 通过网络抽象（例如共享 DNS 名称）与微服务 B 通信，所有的状态都存储在外部数据存储中。这样，如果微服务 B 的任何实例宕机，你仍然可以通过相同的
    DNS 名称访问其他实例，它们可以从外部存储器访问相同的状态。


    紧耦合的版本是微服务 A 直接与微服务 B 的实例 1 通信，而该实例本地存储状态。当微服务 B 的实例 1 故障时，状态就会丢失，其他实例都无法接管。


    ## 自愈


    韧性应用程序和基础设施的另一个重要特性是在无需人工干预的情况下恢复的能力——系统会自动愈合。


    三个概念是实现这一工作机制的关键：


    - 期望状态 (Desired state)

    - 观测状态 (Observed state)

    - 调 (Reconciliation)


    期望状态是你希望拥有的。观测状态是你实际拥有的。调是指保持观测状态与期望状态同步的过程。


    考虑以下示例。你告诉 `Kubernetes` 你希望运行 5 个版本为 2.2 的软件 Web 服务器 pod。这就是你的期望状态。`Kubernetes`
    实现它并设置了一个监视循环来观察情况。此时，期望状态是 5 个运行版本 2.2 的 pod，观测状态也是 5 个运行版本 2.2 的 pod。然而，如果某些地方损坏导致你丢失了一个
    pod，观测状态将降到 4 个 pod，但期望状态仍然是 5 个。`Kubernetes` 通过启动一个新的第 5 个运行版本 2.2 的 pod 来调这种状况，使观测状态恢复到与期望状态同步。这个过程被称为
    `reconciliation`，是无需人工干预实现自愈的关键。


    ## 健康检查


    关于韧性的最后一点是健康检查和探针（probes）。这些是额外的检查层，通常包含`应用智能`（application intelligence）——这是一个术语，指的是一组测试你的应用程序是否按预期运行的检查项。


    例如，之前关于期望状态和调的章节没有包含`应用智能`。它只确保有 5 个运行版本 2.2 软件的 pod。它并不能确保每个 pod 内部的应用程序运行正常。


    一个简单的非技术示例可能是快速肉眼检查冰箱里是否有牛奶。你的期望状态可能是冰箱里有一盒红盖牛奶。快速的视觉检查证明了你拥有它。然而，它并不能检查牛奶是否新鲜，或者盒里还有多少。在这种情况下，`应用健康检查`可能会拿起那盒牛奶，检查日期，并可能进行“嗅闻测试”
    ;-)。重点是……虽然快速的视觉检查可能确保观测状态匹配期望状态（想要一盒牛奶，你确实有一盒牛奶），但它无法检查牛奶是否良好。


    在云原生世界中，健康检查通常是测试应用程序是否按预期运行的专用请求。有时我们称之为“探针”，因为它们会 `probe` 应用程序。


    许多基于 Web 的应用程序会暴露一个特定的健康检查终端，例如 `/healthz`。例如，如果应用可以通过 `knca-app.kubernetes.local`
    访问，它就会暴露 `kcna-app.kubernetes.local/healthz`。向该地址发送请求会导致应用返回你用于判断应用健康的数据。示例 URL
    可能是 `myapp.k8s.local/healthz`。


    总而言之，松耦合实现了更流动的环境，事物可以在发生故障并被替换而不影响整个应用和用户体验。`Kubernetes` 等系统不断观察其环境，以确保它们观察到的（观测状态）是你请求的（期望状态）。如果观测状态与期望状态不匹配，`调`
    过程就会修复问题。健康检查和探针增加了额外的检查层，用于测试应用程序是否按预期工作。


    ## 自动伸缩


    自动伸缩是应用程序和基础设施自动增长和缩小以满足需求的能力。


    要让自动伸缩真正云原生，三点至关重要：


    - 应用程序和基础设施需要能够扩展

    - 扩展必须是自动的

    - 扩展必须是向上和向下


    `Kubernetes` 具有根据当前负载向上和向下扩展应用程序的能力。它可以使用简单的指标（如 CPU 和内存消耗），也可以使用特定特定的指标（如队列大小和请求响应时间）。


    一个简单的例子可能是应用程序的报告微服务。如果业务部门正在运行年度报告，且报告微服务面临 10 倍的需求增长，`Kubernetes` 可以启动额外的报告容器来满足需求。当需求减少时，`Kubernetes`
    可以终止额外的容器。如果应用程序运行在公有云上，`Kubernetes` 还可以扩展基础设施以帮助支持额外的容器。一个常见的例子是 `Kubernetes`
    向节点池中添加更多节点。


    让我们仔细观察这个示例。


    假设你的业务应用程序运行在 5 个节点（云实例/虚拟机）上，报告微服务运行在两个容器上。多个业务部门启动了年度报告，报告系统的负载飙升。`Kubernetes`
    观察到这种负载增加，并部署了 3 个额外的报告容器来处理负载。然而，你的 5 个节点已满，没有容量运行这 3 个额外的容器。没问题，`Kubernetes`
    与你的云通信并启动了一个额外的节点来运行这 3 个新容器。报告运行快速且准时，当报告微服务的需求减少时，`Kubernetes` 也会终止额外的 3 个报告容器以及额外的节点。


    从这个示例中理解几点是非常重要的：


    向上扩展和向下扩展是自动的。这是因为 `Kubernetes` 在不断观察应用程序的关键性能指标。当它看到某些情况（例如负载增加或响应时间变长）时，它会扩展应用程序和基础设施来应对。它在需求下降时也会缩小规模。后者对于控制成本非常重要，特别是在按需付费的公有环境中。


    微服务架构对于这种行为至关重要，因为它们允许 `Kubernetes` 只扩展那些所需的微服务。


    最后，到为止描述的扩展类型被称为`水平扩展`（horizontal scaling）。从高层面上说，水平扩展是为你已有的某些东西添加更多实例。相反是`垂直扩展`（vertical
    scaling），它尝试增加你已有东西的大小。以下非技术示例可能有所帮助。


    假设你经营着一家提供服务的业务，你目前有一辆小配送车。随着业务增长，你需要增加进行更多配送的能力。你可以通过增加 2 辆额外的小配送车来水平扩展你的配送能力。或者，你可以通过卖掉小配送车并将其替换为一辆更大的车来垂直扩展。


    回到年度报告的类比。如果一个小型报告容器无法处理年度需求，你可以通过添加更多相同的小型容器来水平扩展它。或者，你可以通过将小型报告容器替换为单个更大的容器来垂直扩展。支持它的基础设施也可以这样做——你可以通过添加多个小节点来水平扩展，或者通过添加一个巨大的巨大的节点来垂直扩展。


    通常来说，`Kubernetes` 和云原生模式更偏好水平扩展。


    `Kubernetes` 具有以下自动伸缩器。


