    # 6: 云原生可观测性

    本章涵盖了通过云原生可观测性部分考试所需的知识，占考试总分的 8%。


    本章结构如下：

    * 导论

    * 遥测与可观测性

    * Prometheus

    * 成本管理

    * 章节总结

    * 考试要点

    * 复习题


    ## 导论

    云原生应用以许多微小移动部件的形式部署，这些部件通过网络连接并频繁地更新和更换。这使得能够查看应用程序是如何连接的，以及跟踪请求穿越应用程序各种分布式微服务的能力，变得比以往任何时候都更为重要。


    为了协助这一点，每个微服务都需要以指标和日志数据的格式输出高质量的遥测数据。然后你需要正确的工具来收集、聚合并分析这些遥测数据，以便进行故障排除和调整。这个过程是一个反馈循环，如图
    6.1 所示——观察 > 分析 > 调整。


    ![](img/images----figure6-1.png)


    图 6.1


    尽管多年来我们在传统单体应用中一直在做这类事情，但对于云原生应用，以下所有内容要么是新的，要么更加重要：

    * 请求追踪

    * 应用程序特定的指标

    * 网络延迟

    * 伸缩决策

    * 日志和指标的体量

    * 整理与分析


    ## 遥测与可观测性

    *遥测*（Telemetry）是日志、指标和追踪的术语。远程监控平台通过使用它来了解系统工作原理、诊断问题并衡量性能。一个高可观测性的系统是指产生高质量遥测数据的系统。


    考虑以下简单示例：你有一个由许多微服务组成的内部云原生应用。你还有一个中央监控平台。每个微服务输出收集、存储和分析的遥测数据。


    如前所述，云原生遥测主要有三种，我们有时称为信号类型、垂直领域或类别：

    * 日志 (Logs)

    * 指标 (Metrics)

    * 追踪 (Traces)


    每种都有不同的用途，但它们共同提供了理解、故障排除和优化微服务至关重要的详细见解。


    OpenTelemetry 项目是一个 CNCF 项目，旨在标准化我们收集并将其导出到中央系统进行分析的方法。该项目由规范和实例化组成*实例化*（Instrumentation）是指在应用程序中编写遥测代码术语。


    最后，云原生应用产生的遥测数据量可能像洪流一样令人难以应对。这是因为每个微服务都会生成自己的遥测数据，导致云原生应用的遥测数据量是传统应用的 10 倍甚至
    100 倍。这驱动了一代云原生监控及相关工具的发展。这些工具包括 Prometheus、Fluentd、Grafana、Jaeger 等。


    ### 日志数据

    日志数据通常是与相关的事件，对于调试问题非常有帮助，而且当出现问题时你应该首先检查的地方之一。


    每个事件（如连接断开或服务重启）都会生成带有时间戳且通常格式化 JSON 的日志记录，以便组织和查询。它们还根据严重程度进行分类，例如信息（info）、警告（warning）、错误（error）和严重（critical）。*调试*（Debug）是另一个级别，通常是最详细的，通常包含所有其他级别的数据。


    许多应用程序将日志写入到标准输出 (stdout) 和标准错误 (stderr) 流。然而，某些应用程序会将日志写入任意位置。


    > **术语。** 非常古老的计算机系统有三个与输入输出通道的标准流。标准输入 (stdin) 处理来自键盘的输入，标准输出 (stdout) 处理到屏幕的输出，标准错误
    (stderr) 允许错误信息独立于屏幕输出进行流传输。Linux 继续实现这些流，且将日志数据发送到 `stdout` 和 `stderr` 是一种常见做法。这种架构在
    Kubernetes 上运行的容器中仍然存在。


