    日志事件通常按照严重程度从低到高分类如下：`info` > `warning` > `error` > `critical`。


    第 8 题，答案 A


    高详细度产生的输出比低详细度产生的输出多。


    第 9 题，答案 C


    调试（Debug）级别是最详细的，旨在尽可能输出所有数据。


    第 10 题，答案 A, B


    Kubernetes 通过每个节点上的代理或 sidecar 容器中的代理支持集群级日志。


    第 11 题，答案 B, C


    每个工作节点上的本地 `kubelet` 监控容器的 `stdout` 和 `stderr` 流以获取日志，并使其通过 `kubectl logs` 命令可用。


    第 12 题，答案 A, B


    日志代理可以将日志数据转换为中心日志系统所需的格式。


    第 13 题，答案 A


    云原生应用应与其环境配置解耦。这允许应用在多个环境中运行而无需更改。你可以在运行时注入环境配置数据。


    第 14 题，答案 A


    `-p` 标志返回上一个 pod/容器实例的日志。


    第 15 题，答案 D


    指标数据（Metrics）跟踪长时间的系统性能，是查看历史趋势和预测未来趋势的极佳方法。


    第 16 题，答案 C


    自定义指标是为应用程序定制的指标，因此是查看应用健康和性能的最佳方式。


    第 17 题，答案 A


    追踪（Tracing）是跟踪请求在分布式系统中之间跳跃过程的艺术。


    第 18 题，答案 C


    Prometheus 被认为是 Kubernetes 的行业标准监控系统。


    第 19 题，答案 D


    Grafana 通常与 Prometheus 配合使用，提供顶级的仪表板和可视化。


    第 20 题，答案 B


    Prometheus 期望通过 HTTPS 在 `/metrics` 端点上暴露指标。


    第 21 题，答案 C


    抓取（Scraping）是 Prometheus 用于指从从远程系统收集日志的术语。


    第 22 题，答案 B


    Prometheus 使用拉取模型（pull model）从远程监控系统抓取日志。


    第 23 题，答案 A


    Prometheus 以时间序列格式存储数据。


    第 24 题，答案 C


    Prometheus 为短生命周期应用提供了 `pushgateway`，这些应用可能在 Prometheus 抓取其指标之前已终止。应用将指标推送到 `pushgateway`，Prometheus
    则从那里抓取指标。


    第 25 题，答案 B


    Prometheus 为大多数编程语言提供了客户端库，你可以使用这些库对内部应用进行插桩，以集成 Prometheus。


    第 26 题，答案 C


    如果你无法访问第三方应用的源码，将无法通过客户端库直接对它们进行插桩。在这种情况下，你可以在 sidecar 容器中运行 Prometheus 导出器（exporter），为
    Prometheus 重新格式化数据。


    第 27 题，答案 A, B, D


    在云原生环境中，选择合适的基础设施和平台、合理调整配置、并在不使用时关闭或删除它们至关重要。


    第 28 题，答案 B


    竞价实例（Spot instances）是最便宜的云实例类型，对于非业务关键且可以轻松重建或重新部署的服务非常理想。


    第 29 题，答案 C


    预留实例（Reserved instances）通过长期承诺来换取云基础设施的折扣价格。


    第 30 题，答案 B


    自动伸缩（Autoscaling）确保你始终有足够的基础设施根据当前需求运行应用。因此它不断对你的基础设施进行规模调整。


    第 31 题，答案 B, C


    配置自动伸缩时，监控正确的指标至关重要，因为系统使用这些指标来做出伸缩决策。如果你监控了错误的指标，系统将做出错误的决策。此外，设置上限和下限以控制成本和使用也很。


    # 附录 B：示例测试答案


    本附录包含示例测试的答案。


    第 1 题，答案 A, B, D


    Kubernetes 的自愈功能基于在调和循环中运行的控制器，确保观测状态始终与期望状态保持同步。


    第 2 题，答案 A, C


    Seccomp 和能力裁剪（Capability dropping）是与 Linux 内核相关的技术，可用于保护命名空间容器对主机内核的访问权限。


    第 3 题，答案 C


    Kubernetes 拥有一个内部 DNS 服务，用于服务注册和服务发现。


    第 4 题，答案 B, D


    Kubernetes 控制平面保持高性能和高可用性至关重要。


    第 5 题，答案 C


    Kubernetes 集群伸缩器（`CA`）与底层云平台集成，动态添加和删除工作节点以应对需求。


    第 6 题，答案 C


    Jaeger 是一个用于存储和分析追踪数据的流行工具。它还是一个 CNCF 毕业项目。


    第 7 题，答案 A


    容器通常共享它们运行所在主机的内核。这意味着受攻击的容器可能会影响主机以及运行在主机上的所有其他容器。这也意味着受攻击的主机可能会影响所有容器。


    第 8 题，答案 B


    DevSecOps 工程师为 DevOps 工程引入了安全优先的方法。


    第 9 题，答案 A, B, C, D


    云原生应用和基础设施具有弹性，可以自动伸缩，并提供广泛的可观测性。自愈和自动伸缩等操作在无需人工干预的情况下完成。


    第 10 题，答案 A, B, D


    OCI 负责底层的容器相关规范。这些包括 `image-spec`、`runtime-spec` 和 `distribution-spec`。


    第 11 题，答案 B


    服务网格（Service mesh）技术向每个应用 pod 注入 sidecar 容器，拦截网络流量并提供高级服务。


    第 12 题，答案 B, D


    Docker 和 `containerd` 是容器运行时的示例。`ESXi` 是轻量级虚拟机程序，而 Kubernetes 是云原生编排器。


    第 13 题，答案 B


    虚拟化容器通过将每个容器运行在独立的虚拟机中避免了共享内核的安全问题。


    第 14 题，答案 C


    Kata 容器是一种容器运行时，它为每个容器创建一个小型虚拟机。


    第 15 题，答案 B, D


    `kubectl` 版本应与你运行的 Kubernetes 版本高一或低一。


    第 16 题，答案 C


    服务网格是 Kubernetes 环境中加密流量的一种方式。


    第 17 题，答案 A


    通常情况下，你对自己的应用代码有完全控制权，对容器较少，对集群更少，而对云几乎没有控制权。


    第 18 题，答案 A, C


    Kubernetes 提供内置的 IP 管理和服务注册/发现。


    第 19 题，答案 A, B, C


    服务网格在平台层提供流量加密、网络观测性和网络可靠性。


    第 20 题，答案 D


    Prometheus 期望遥数据在 `/metrics` 端点可用。


    第 21 题，答案 B, D


    容器比虚拟机小且启动更快。由于它们更小，你可以在服务器上运行比虚拟机更多的容器。


    第 22 题，答案 C


    Kubernetes 每四个月发布一个新版本。这意味着每年有三个新版本。


    第 23 题，答案 D


    `gVisor` 是一种容器运行时，在容器与其运行的主机内核之间实现了一个代理内核。


    第 24 题，答案 B


    你应该始终部署奇数个控制节点节点以实现高可用。3 是最常见的数量，5 也很常见。


    第 25 题，答案 B, D


    `containerd` 运行命名空间容器，意味着同一主机上的所有容器共享同一个内核。出于许多原因这是一个安全问题，但也意味着受攻击的 root 容器可能会影响主机以及同一主机上的所有其他容器。


