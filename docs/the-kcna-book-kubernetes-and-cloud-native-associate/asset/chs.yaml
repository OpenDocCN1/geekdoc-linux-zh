  * 4. Weave\n\n# 5: 云原生应用交付\n\n本章涵盖了考试中“云原生应用交付”部分的主题。这些主题占整个考试分数的 8%。\n\n本章结构如下：\n\
  * 导论 (Primer)\n* CI/CD\n* GitOps\n* 考试总结\n* 考试要点\n* 回习题\n\n## 导论\n\n云原生应用交付通常被称为\
  \ `code to cloud`（代码到云）和 `code to production`（代码到生产），我们通常通过持续集成 (CI) 和持续交付 (CD)\
  \ 流水线以及 GitOps 工具来对其自动化。我们将在本章稍后详细讨论这些内容，但现在你应该了解主要的自动化步骤。\n\n1. 构建代码\n2. 测试代码\n\
  3. 发布代码\n\n自动化这些步骤可以实现快速、频繁且高质量的发布。\n\n最后，`release`（发布）是推出应用程序或环境新版本的术语。例如，将应用程序从\
  \ 1.1 版本更新到 1.2 版本是通过一次 `release` 完成的。我们经常使用 `rollout`（滚动更新）、`update`（更新）和 `release`（发布）来表示相同的意思。\n\
  \n## CI/CD\n\nCI/CD 是持续集成（Continuous Integration）和持续交付（Continuous Delivery）的缩写。它是一套自动化软件构建、测试和配置的工具与流程。它实现了频繁可靠的发布，是更广泛的\
  \ DevOps 运动不可或缺的一部分。\n\n正如缩写所示，CI/CD 是两个独立的流程：\n* 持续集成 (CI)\n* 持续交付 (CD)\n\nCI 自动化了软件更改的构建和测试过程。它通常涉及开发者频繁地将代码合并到中央仓库，并在那里进行构建和广泛测试。构建和测试必须是全自动的，并且在发布到活跃环境之前识别问题非常有效。整个过程都是自动化的，并确保只有高质量的代码才会传递到\
  \ CD 过程。\n\nCD 自动化了将这些高质量代码发布到开发、测试和生产等活跃环境的后期过程。它通常在构建成功通过 CI 测试后被触发。\n\n整个 CI/CD\
  \ 过程被称为 `pipeline`（流水线），因为它类似于水管的运行——你将某东西放入管道的一端，在它从另一端出来之前，你不需要再触碰它。CI/CD 流程的自动化特性意味着一旦开发者向仓库上传了更改，整个过程就是自动化的，直到构建并测试好的产制品从另一端出来。\n\
  \n这些步骤的自动化使得所有内容成为可能：\n* 更快的软件交付\n* 更频繁的软件交付\n* 更少的 Bug\n* 生产率更高的开发者\n\n自动化总是让事情更快且可重复。这就是为什么自动化的\
  \ CI/CD 流水线允许开发者更快、更频繁地测试和部署软件。测试自动化且强制意味着更少的 Bug 会进入生产环境。此外，开发者无需参与构建和测试（他们将代码放入流水线，由系统完成其余工作），这意味着他们可以花更多时间构建新应用和功能。\n\
  \n你有时可能会看到 CD 分分为两个不同的不同的：\n* 持续交付 (Continuous delivery)\n* 持续部署 (Continuous deployment)\n\
  \n`持续交付` 在部署到生产之前需要人工批准，而 `持续部署` 则自动化包括部署在内的一切。\n\n通常认为良好的 CI/CD 实践是尽可能频繁地构建、测试和发布。这样做可以测试流水线，让开发者和管理层对流程感到放心，保持更改和更新小且影响小，并加快功能和修复的交付。相反的做法是积累大量更改并在每年实施两次大任务。这种方式风险更高，并延迟了功能和修复的发布。\n\
  \n流行的 CI/CD 工具包括：\n* Jenkins\n* CircleCI\n* GitLab CI\n* Travis CI\n\n总结来说，CI/CD\
  \ 是关于自动化从应用程序构建、测试一直到在生产环境中部署的整个过程。使用一组特殊的工具来实现 CI/CD 流水线，并实现频繁可靠的软件发布。CI 自动化构建和测试，并将经过测试的代码上传到仓库。CD\
  \ 获取完成的代码并将其部署到开发、测试和生产环境。\n\n## GitOps\n\nGitOps 的想法在 2017 年流行起来。从高层来说，它将我们多年来在软件开发中使用经过实战检验的\
  \ DevOps 实践引入基础设施和 Kubernetes 世界。如果你刚刚读完关于 CI/CD 的章节，GitOps 通过增加版本控制和拉取请求（pull requests）对这些内容进行了扩展。\n\
  \n\n\n\n从高层层面来说，你通过存储在 Git 仓库中的配置文件来描述基础设施的期望状态。每当你对环境进行更改时，你都会从 Git 中检出文件，用你的更改更新它们，并提交一个拉取请求（PR）将更改合并到仓库。一旦\
  \ PR 被合并，将更改部署到生产环境的过程就会启动。\n\n尽管有很多 GitOps 工具，如 `Argo`、`Flux` 和 `Jenkins X`，但 GitOps\
  \ 实际上是工具、工作流和实践的集合。这些包括：\n\n*   基础设施即代码 (IaC)\n*   拉取请求与合并\n*   持续交付\n*   对手动更改零容忍\n\
  \n让我们详细查看每一项。\n\n## 基础设施即代码 (IaC)\n\nIaC 是在声明式配置文件中定义基础设施的实践。这意味着，你不再使用 GUI 和脚本来部署虚拟机、网络和策略等内容，而是通过配置文件定义它们，并将文件提供给你的\
  \ GitOps 工具，让它们完成配置的繁琐工作。它是快速且可重复基础设施部署的关键组件。\n\n> **术语。** `声明式配置` 是一种模式，你在配置文件中描述某些内容的\
  \ `期望状态`，并让工具或过程来实现它。一个常见的现实示例是在 YAML 配置文件中定义 Kubernetes 对象，并将其提供给 Kubernetes API\
  \ 服务器，由 Kubernetes 为你置备这些对象。\n\n使用配置文件部署基础设施在云平台上运行良好，因为云平台拥有一池可供你提取和配置的可用基础设施。例如，一个\
  \ IaC 配置文件可能会定义云实例、网络配置、防火墙和 ACL 规则、路由表、网络策略等。你将配置文件发送到云端，云端就会对其进行配置。然而，它在本地环境中没有云端那么强大，因为本地环境通常没有大型的可配置资源池。此外，IaC\
  \ 无法执行常见的本地置备任务，例如物理机架的服务器和连接物理网线。\n\nIaC 极其常见且强大的一个领域是 Kubernetes。这是因为 Kubernetes\
  \ 在配置文件中描述了用于配置的所有内容。例如，Kubernetes pod、service、ingress、网络策略、负载均衡器等都在 YAML 配置文件中进行了声明式描述，你将这些文件发布到\
  \ API 服务器，由 Kubernetes 负责进行配置。下面的 YAML 文件是 IaC 的示例——它描述了一个 Kubernetes 负载均衡服务，该服务将监听\
  \ 9000 端口并将 8080 端口的流量转发到带有 `env=prod` 标签的 pod。你可以使用 `kubectl apply` 将文件发送到 Kubernetes\
  \ 集群，Kubernetes 将与你的云平台通信并配置负载均衡器。\n\n```\napiVersion: v1\nkind: Service\nmetadata:\n\
  \  name: test-lb\nspec:\n  type: LoadBalancer\n  ports:\n  - port: 9000\n    targetPort:\
  \ 8080\n  selector:\n    env: prod\n```\n\n## 拉取请求与合并\n\nGitOps 将 IaC 与成熟的 Git 工作流相结合，创建自动化持续交付流水线。在过去的几年里，它已成为管理\
  \ Kubernetes 环境的一种非常流行的方法，并启发了新一代持续交付 (CD) 工具。\n\n考虑以下示例。你构建了一个 Kubernetes 集群并安装了如\
  \ `Flux`、`Argo` 或 `Jenkins X` 等 GitOps 工具。你配置 GitOps 工具监控一个用于存储 Kubernetes 配置的 Git\
  \ 仓库。你在 Kubernetes YAML 文件中描述了一个新应用程序，该文件包含多个 Kubernetes 对象，如 pod、service account、secret、网络策略和\
  \ ingress。你创建一个拉取请求 (PR) 将 YAML 文件合并到 Git 仓库中。PR 包含了更改的描述以及任何测试的证据。同事在 PR 上发表评论，随后它获得批准并合并到仓库。你的\
  \ GitOps 工具注意到合并，并启动持续部署过程，在你的 Kubernetes 集群上配置应用和基础设施。\n\n过段时间后，你需要对配置进行微小更新。你不是手动编辑生产环境，而是创建一个\
  \ Git 仓库的分支并在那里进行配置更改。当你对这些更改满意后，创建一个 PR 将它们与仓库的 master 分支合并。同事再次在 PR 上发表评论并最终批准了合并。你的\
  \ GitOps 工具观察到合并，并启动另一个持续交付过程来应用更新。\n\n如你所见，`PRs` 和 `merges` 是关键的 GitOps 操作。事实上，有四条重要的\
  \ GitOps 规则：\n\n1.  将`所有` 应用和基础设施配置存储在 Git 中\n2.  使用 `PRs` 和合并进行审批并触发部署\n3.  自动化部署\n\
  4.  停止进行手动更改\n\n让我们澄清一些术语。\n\n`Git` 是一个由 Linus Torvalds（Linux 的发明者）创建的流行开源版本控制系统。它的核心功能是跟踪更改和实现回滚，用于管理大型和小型项目。大型项目包括\
  \ Linux 和 Kubernetes，小型项目包括我其他书籍和视频培训课程的实验文件等。\n\n`GitHub` 是一个基于云的代码存储库，使用 Git 进行版本控制。它将文件组织成名为\
  \ `repositories`（仓库）的文件夹，你通常为每个项目分配一个自己的仓库。例如，我《Quick Start Kubernetes》一书的所有文件都在\
  \ GitHub 的 `nigelpoulton/qsk-book` 仓库中，而《The Kubernetes Book》的所有文件都在 `nigelpoulton/TheK8sBook`\
  \ 仓库中——每个项目一个仓库。\n\n`Git` 允许你创建仓库的 `branches`（分支）作为处理更改的区域。你在自己的分支中进行更改，并使用拉取请求将更改合并到名为\
  \ `master` 的特殊分支。这个 master 分支是真理源，所有来自其他分支的更改和更新都必须 `merged` 到 master 才能成为项目的一部分。如所述，合并更改到\
  \ master 分支的过程是通过 `Pull Requests (PR)` 启动的，它通知团队成员更改已准备好进行评审并可能被 `merged`。PR 提供了一个评论论坛，可以在其中讨论更改。\n\
  \n在示例中，GitOps 工具（如 `Flux` 或 `Argo`）正在监控 Git 仓库的 master 分支。每当它观察到合并时，就会启动持续交付 (CD)\
  \ 过程，将更新后的配置部署到生产环境。\n\n### 持续交付\n\n正如本章节开头提到的，CI/CD 是两个不同的过程。\n\n*   `CI` 构建并测试软件\n\
  *   `CD` 将其部署到生产环境\n\nGitOps 主要关注 CD 方面，不处理较早的 CI 步骤。这意味着你仍然需要一个 CI 工具来处理应用的构建、测试和共享。\n\
  \n### 对手动更改零容忍\n\n一旦你采用 GitOps，你就不能再对生产环境进行手动更改了，因为这些更改会在每次 PR 和成功合并后丢失。\n\n\n\n\
  请考虑以下示例。你正在使用 GitOps 来管理一个线上 Kubernetes 环境。然而，一位尚未完全掌握 GitOps 流程的团队成员对线上环境进行了手动更改。这是一种\
  \ `anti-pattern`（反模式），并导致线上环境的状态偏离了 Git 仓库中定义的定义。在同一天的晚些时候，你遵循 GitOps 流程，在特性分支中测试了一个更改并创建一个\
  \ PR 来合并它。当 PR 获得批准后，你的更改被合并，CD 流水线将自动部署到线上环境。该过程将把整个配置应用到线上环境，并覆盖你同事所做的手动更改。\n\n\
  让我们更仔细地观察一下。\n\n假设你的 GitHub 仓库中的配置文件指定了 Kubernetes 对象，如 pod、service 和网络策略。你一直严格遵循\
  \ GitOps 流程，线上环境与 GitHub 仓库中存储的配置完全匹配。然而，某个应用程序开始出现问题，于是一位同事登录到线上系统，并手动更新了一个线上网络策略以解决了该问题。虽然这在当时看起来可能是个好主意，但线上环境不再与\
  \ GitHub 仓库中的配置匹配，在以后可能会变成问题。\n\n在同一天的晚些时候，你遵循 GitOps 流程部署了一组新的应用程序 pod，并创建一个 PR\
  \ 来合并该更改。PR 获得批准并合并到 `master` 分支，你的 GitOps 工具观察到了变化并触发了 CD 工作流。即使你只添加了新的应用程序 pod，仓库中的整个配置也将将重新应用到环境中。这意味着网络策略也将被重新应用，并覆盖你同事的手动修复。这就是为什么每个人都认同\
  \ GitOps 流程，并且停止允许对线上环境进行手动更改是关重要的原因。\n\n> **术语破解。** `anti-pattern`（反模式）是指在当时看起来像是个好主意，但实际上是一个坏主意。\n\
  \n### 重要的 GitOps 工具和项目\n\n如前所述，GitOps 启发了新一代持续交付工具，这些工具与 Git 工作流集成。我们将简要描述以下内容，你可能会在考试中遇到这些内容。\n\
  \n*   `Flux`\n*   `Argo`\n*   `Jenkins X`\n\n`Flux`（有时称为 `FluxCD` 或 `Flux CD`）是一个易于使用的\
  \ Kubernetes 原生应用程序，用于将 Kubernetes 状态与 Git 仓库中的配置文件同步。它始于 Weaveworks 项目，现在是 CNCF\
  \ 的孵化项目。你将其安装在 Kubernetes 集群上，并配置它监控 Git 仓库的变化。“监控”仓库是一种基于拉（pull-based）的模型，`Flux`\
  \ 定期检查仓库并将任何更改与线上 Kubernetes 环境同步。`Flux` 以极易用而闻名，并且完全专注于到 Kubernetes 集群的 CD（它不负责\
  \ CI）。它只能监控一个 Git 仓库，并且只能部署到一个 Kubernetes 集群和命名空间。这使得安装和配置变得简单，但也意味着它比其他工具的可配置性较低。\n\
  \n`Argo`（有时称为 `ArgoCD` 或 `Argo CD`）与 `Flux` 非常。它是一个为 Kubernetes 设计的声明式 GitOps 工具，由\
  \ Intuit 开发，目前是 CNCF 的孵化项目。它同样作为 Kubernetes 原生应用安装，是基于拉的，并专注于 CD。它相比 `Flux` 具有的优势是单个\
  \ `Argo` 安装可以监控多个 Git 仓库并部署到多个 Kubernetes 命名空间。这让它感觉像是 `Flux` 的“专业版”。\n\n`Jenkins\
  \ X` 是一个专注于 Kubernetes 的 GitOps 工具，涵盖了整个 CI/CD 过程。在其底层是一系列其他开源工具，这些工具经过良好封装且部署相对简单。然而，它比\
  \ `Argo` 和 `Flux` 复杂得多。\n\n总结来说，GitOps 结合了基础设施代码（IaC）、Git 工作流和 CD 流水线来自动化基础设施的配置。事实上，GitOps\
  \ 通常被认为是“正确执行的基础设施即代码”。你在声明式配置文件中定义基础设施的期望状态，并将这些文件存储在 Git 仓库中。仓库成为你环境的“真理来源”（source\
  \ of truth），这意味着任何当 PR 合并到仓库的 `master` 分支时，CD 流水线就会部署它。它实现了频繁且可靠的部署，并确保每次合并时手动更改都会被覆盖。原生的版本控制保留了每一次更改的记录，可用于快速可靠的回滚以及审计。此审计历史包含了所有的拉取请求（PR）、评论和批准。最后，大量人员可以在他们自己的特性分支上进行更改，但你可以限制批准合并的人数。此外，每个人都采用\
  \ GitOps 流程并停止对线上环境进行手动更改也是至关重要的。\n\n### 本章总结\n\n在本章中，你学习了 CI/CD 如何实现软件和基础设施的构建、测试和部署。CI\
  \ 负责自动化代码构建和测试的早期步骤，然后发布到仓库中。CD 获取构建并测试过的产物，并自动化将其部署到线上环境的过程。GitOps 在此基础上通过添加版本控制、拉取请求和批准来触发\
  \ CD 过程。GitOps 在 Kubernetes 环境中特别强大，在这些环境中，一切通过 YAML 配置文件进行声明式描述，而这些文件用于配置环境。流行的\
  \ GitOps 工具包括 `Argo`、`Flux` 和 `Jenkins X`。\n\n## 考试要点\n\n**持续集成、持续交付 (CI/CD)**\n\
  \n`CI/CD` 是一套工具和实践，专注于自动化从代码到生产环境的步骤。它是 DevOps 实践的关键部分，能够实现快速、可重复且可靠的测试和部署。它还为开发者留了更多时间处理功能和修复。自动化步骤通常被称为\
  \ `pipeline`（流水线）。\n\n**持续集成 (CI)**\n\n`CI` 专注于自动化软件构建和测试。开发者通常会将代码合并到带有特定标签的仓库，从而触发构建软件并运行测试的自动化流水线。通常会在容器中启动构建并进行测试。通过测试的代码将传递给后续\
  \ CD 阶段。\n\n**持续交付 (CD)**\n\n`CD` 专注于将软件和基础设施交付到线上环境。它通常在 CI 之后运行，并仅部署“好代码”。好代码是通过\
  \ CI 测试的代码。\n\n**基础设施即代码 (IaC)**\n\n`基础设施代码` 是使用配置文件定义基础设施并使用平台进行配置的实践。它在 Kubernetes\
  \ 环境中非常流行，所有的 Kubernetes 对象都可以定义在用于配置 Kubernetes 应用和基础设施的 YAML 文件中。IaC 在公有云上的 Kubernetes\
  \ 环境中特别强大，因为整个基础设施栈可以从配置文件描述并部署。\n\n**GitOps**\n\n`GitOps` 将基础设施即代码增加了版本控制、批准和 CD\
  \ 流水线。典型的 GitOps 工作流由 GitOps 工具监控 Git 仓库的合并。每当软件或基础设施配置合并时，GitOps 工具就会触发 CD 流水线将更新部署到线上环境。包括\
  \ `Argo`、`Flux` 和 `Jenkins X` 在内的新 CD 工具是流行的 GitOps 工具。许多人认为 GitOps 是正确的 IaC。\n\n\
