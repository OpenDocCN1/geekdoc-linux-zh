  # 6: 云原生可观测性\n本章涵盖了通过云原生可观测性部分考试所需的知识，占考试总分的 8%。\n\n本章结构如下：\n* 导论\n* 遥测与可观测性\n*\
  \ Prometheus\n* 成本管理\n* 章节总结\n* 考试要点\n* 复习题\n\n## 导论\n云原生应用以许多微小移动部件的形式部署，这些部件通过网络连接并频繁地更新和更换。这使得能够查看应用程序是如何连接的，以及跟踪请求穿越应用程序各种分布式微服务的能力，变得比以往任何时候都更为重要。\n\
  \n为了协助这一点，每个微服务都需要以指标和日志数据的格式输出高质量的遥测数据。然后你需要正确的工具来收集、聚合并分析这些遥测数据，以便进行故障排除和调整。这个过程是一个反馈循环，如图\
  \ 6.1 所示——观察 > 分析 > 调整。\n\n![](img/images----figure6-1.png)\n\n图 6.1\n\n尽管多年来我们在传统单体应用中一直在做这类事情，但对于云原生应用，以下所有内容要么是新的，要么更加重要：\n\
  * 请求追踪\n* 应用程序特定的指标\n* 网络延迟\n* 伸缩决策\n* 日志和指标的体量\n* 整理与分析\n\n## 遥测与可观测性\n*遥测*（Telemetry）是日志、指标和追踪的术语。远程监控平台通过使用它来了解系统工作原理、诊断问题并衡量性能。一个高可观测性的系统是指产生高质量遥测数据的系统。\n\
  \n考虑以下简单示例：你有一个由许多微服务组成的内部云原生应用。你还有一个中央监控平台。每个微服务输出收集、存储和分析的遥测数据。\n\n如前所述，云原生遥测主要有三种，我们有时称为信号类型、垂直领域或类别：\n\
  * 日志 (Logs)\n* 指标 (Metrics)\n* 追踪 (Traces)\n\n每种都有不同的用途，但它们共同提供了理解、故障排除和优化微服务至关重要的详细见解。\n\
  \nOpenTelemetry 项目是一个 CNCF 项目，旨在标准化我们收集并将其导出到中央系统进行分析的方法。该项目由规范和实例化组成*实例化*（Instrumentation）是指在应用程序中编写遥测代码术语。\n\
  \n最后，云原生应用产生的遥测数据量可能像洪流一样令人难以应对。这是因为每个微服务都会生成自己的遥测数据，导致云原生应用的遥测数据量是传统应用的 10 倍甚至\
  \ 100 倍。这驱动了一代云原生监控及相关工具的发展。这些工具包括 Prometheus、Fluentd、Grafana、Jaeger 等。\n\n### 日志数据\n\
  日志数据通常是与相关的事件，对于调试问题非常有帮助，而且当出现问题时你应该首先检查的地方之一。\n\n每个事件（如连接断开或服务重启）都会生成带有时间戳且通常格式化\
  \ JSON 的日志记录，以便组织和查询。它们还根据严重程度进行分类，例如信息（info）、警告（warning）、错误（error）和严重（critical）。*调试*（Debug）是另一个级别，通常是最详细的，通常包含所有其他级别的数据。\n\
  \n许多应用程序将日志写入到标准输出 (stdout) 和标准错误 (stderr) 流。然而，某些应用程序会将日志写入任意位置。\n\n> **术语。** 非常古老的计算机系统有三个与输入输出通道的标准流。标准输入\
  \ (stdin) 处理来自键盘的输入，标准输出 (stdout) 处理到屏幕的输出，标准错误 (stderr) 允许错误信息独立于屏幕输出进行流传输。Linux\
  \ 继续实现这些流，且将日志数据发送到 `stdout` 和 `stderr` 是一种常见做法。这种架构在 Kubernetes 上运行的容器中仍然存在。\n\n\
  \n\n\n\n在 Kubernetes 环境中，每个节点上的 `kubelet` 都会监控每个容器的 `stdout` 和 `stderr` 流，并让 `kubectl\
  \ logs` 命令可以使用日志消息。它还会保留每个容器最近终止的实例的日志，以防你需要回溯这些日志。未写入容器的 `stdout` 和 `stderr` 的日志无法通过\
  \ `kubectl logs` 查看。\n\n每个节点上的 `kubelet` 留存日志的缺点是，如果节点故障，所有日志消息都将丢失。这就是为什么将日志存储在集中位置被认为是更好的实践，在那里，日志数据的生命周期与容器及其运行的节点生命周期分离。Kubernetes\
  \ 将这种架构称为`集群级日志`（cluster-level logging），并提供了以下选项：\n\n* 节点级日志代理\n* 带有日志代理的 Sidecar\n\
  \n`节点级日志代理` 在每个节点上安装一个代理，从 `kubelet` 收集所有容器日志并将其发送到中心位置。通常的做法是使用 Kubernetes 的 `DaemonSet`\
  \ 在每个节点上部署和管理该代理。\n\n日志 `sidecar` 是一个与应用程序容器运行在同一个 Pod 中的辅助容器。它捕获应用程序容器的日志，并将其流式传输到自己的\
  \ `stdout` 和 `stderr`，或者直接转发到中心位置。\n\n考虑以下示例。你有一个应用程序，它将日志数据写入容器文件系统中的自定义位置。这意味着本地\
  \ `kubelet` 无法访问这些日志。然而，应用程序提供了一个 sidecar 容器，它知道日志写在何处，并将其转发到自己的 `stdout` 和 `stderr`\
  \ 流。这样做允许节点上的 `kubelet` 从 sidecar 捕获这些日志，并将其提供给节点级代理，该代理可以将其转发进行聚合。它还让 `kubectl\
  \ logs` 命令可以使用这些日志。这是一个简单的解决方案，应用程序不需要更改写入日志的位置——sidecar 知道该位置并将它们放在 Kubernetes\
  \ 期望的地方。\n\n日志 sidecar 也可以直接将日志转发到中心位置。这样做会绕过 `kubelet`，并意味着你将无法通过 `kubectl logs`\
  \ 查看它们。这是因为 `kubectl logs` 是与本地 `kubelet` 协作，而将日志直接发送到中心位置会跳过 `kubelet`。\n\n`应用级日志`（Application-level\
  \ logging）是另一种模式，它按所需的格式直接将日志推送到中心存储器。这同样跳过了 `kubelet`，并要求应用程序配置中心存储器的位置。这在云原生应用中是一种反模式，因为将特定于环境的配置编码到应用程序中通常不是良好的做法。\n\
  \n如前所述，只要日志发送到 `stdout` 或 `stderr`，`kubectl logs` 命令就会返回运行中容器的日志。它还可以返回容器最近终止的实例的日志。如果一个\
  \ Pod 包含多个容器，你必须使用 `-c` 标志指定容器名称。如果 Pod 只有一个容器，可以省略 `-c` 标志。\n\n以下命令从名为“kcna”的 Pod\
  \ 中获取唯一容器的日志。\n\n```\nkubectl logs kcna\n```\n\n如果 Pod 失败或终止，可以使用 `-p` 或 `--previous`\
  \ 标志。以下示例获取在已终止的 `kcna` Pod 中运行的 `ctr1` 容器的日志。\n\n```\nkubectl logs -p -c ctr1 kcna\n\
  ```\n\n### 指标 (Metrics)\n\n指标是在一段时间内收集和衡量的性能相关值。每个指标都有时间戳、一个名称，并可以带有标签（labels）以帮助分组和查询。它们是查看历史趋势和预测未来变化的极佳方式。\n\
  \n指标的示例包括 CPU 利用率、队列长度、请求数、错误率等。例如，如果请求数在过去 6 个月中平均每分钟 150 次，突然飙升到 10,000 次，你就知道发生了变化，系统可能需要做出反应。同样，如果系统部署以来丢弃连接平均每分钟少于\
  \ 2 个，但突然跳到 5,000 个，你就知道出问题了。\n\nCPU 利用率和内存占用等通用系统指标被认为是基础的，缺乏任何应用智能。自定义应用程序指标通常更有用。示例包括队列长度、响应时间、每秒请求数等。关键点在于，它们是特定于应用程序的因此在判断应用程序性能以及是否需要启动扩缩操作方面好得多。\n\
  \n说到扩缩。云原生微服务应用通常会自动扩缩以满足需求。然而，自动扩缩的决策取决于所观测指标的质量。因此，不仅监控正确的指标至关重要，你还需要能够快速分析它们以做出扩缩决策。考虑以下这个简单的示例。\n\
  \n你有一个具有 3 个微服务的云原生应用，并配置了自动扩缩来监控内存使用情况。请求流经所有三个微服务，你突然遇到响应时间变慢。你查看监控仪表板，发现内存使用在可接受范围内。然而，其中一个微服务的队列大小异常大。在与应用程序开发者讨论时，你意识到内存使用不是应用程序性能的良好指标，因此不是用于扩缩的良好指标。你通过增加一个额外的实例解决了眼下的问题，但你决定实现监控队列性能的自定义指标，这样当这种情况再次发生时，系统就有正确的指标来做出自动扩缩决策。\n\
  \n网络相关的指标（如延迟）也比以往任何时候都重要，因为越来越多的请求依赖于网络。\n\n### 追踪 (Tracing)\n\n追踪是一个技术术语，用于跟踪请求在通过分布式系统不同组件时的端到端旅程。\n\
  \n单个请求可以被追踪，每个追踪都会报告如哪些系统组件处理了请求、哪些事件以及每个事件处理的时间。在理解分布式微服务环境中的流量和潜在瓶颈方面，它们比以往任何时候都更重要。例如，以前可能命中单个服务器并在本地处理的请求，现在在微服务之间传递时可能会命中多个服务器并多次穿越网络。考虑到这一点，能够观测每个请求的端到端旅程至关重要，这样你才有全景。\n\
  \nJaeger 是用于存储和分析追踪数据的流行工具。\n\n总之，有效的观测性需要高质量的遥测数据。日志数据由应用程序创建，是出现问题时的良好查找点。指标是查看历史趋势和发现趋势变化的极佳方式。追踪对于理解分布式微服务应用中的请求流至关重要。OpenTelemetry\
  \ 项目正试图简单地让应用程序具备高质量的遥测数据。\n\n### Prometheus\n\nPrometheus 被认为是 Kubernetes 和云原生环境的`行业标准`监控工具。它由\
  \ SoundCloud 在 2012 年创建，当时他们发现现有监控工具无法满足他们的需求。它在 2016 年作为开源项目捐赠给 CNCF，并在 2018 年底成为第二个毕业于\
  \ CNCF 项目。\n\n一种常见的模式是在 Kubernetes 上运行云原生应用，使用 Prometheus 进行监控和告警，并使用 Grafana 进行仪表板和可视化。\n\
  \n### Prometheus 如何工作\n\n\n\n\n\n从宏观上看，每个微服务都应该以日志和指标的形式生成高质量的测量数据。Prometheus 收集这些数据并将其存储在可以查询和分析的地方，以帮助故障排除和优化。它还可以将数据馈给\
  \ Grafana，用于生成高质量的仪表板和可视化。\n\n## 深入探讨……\n\nPrometheus 期望应用程序通过 `/metrics` HTTP 端点暴露指标。这是以\
  \ `/metrics` 结尾的网络地址的术语。例如，如果一个微服务可以通过 `store.myapp.k8s.local` 访问，它应该在 `store.myapp.k8s.local/metrics`\
  \ 暴露 Prometheus 指标。Prometheus 定期连接到此端点以 `scrape`（抓取）指标并存储它们。`scrape` 是“收集”指标的术语。这是一个\
  \ `pull`（拉取）模型，应用程序只负责提供指标，而抓取指标的辛苦工作则是 Prometheus 的职责。Prometheus 抓取指标的频率被称为 `scrape\
  \ interval`（抓取间隔）。\n\n一旦 Prometheus 获取了指标，就会将其存储在时间序数据库中。事件以纯文本形式存储，每个事件存储在数据库的单独行中。`Timeseries`（时间序）意味着每个事件都有时间戳。事实上，每个\
  \ Prometheus 指标都有名称、时间戳和各种标签（labels）。这使得非常很容易进行分组、查询和分析。在查询方面，Prometheus 拥有自己的强大查询语言，称为\
  \ `PromQL`。你可能还会听到将 Prometheus 数据模型称为 `multi-dimensional`（多维）。这意味着指标可以根据名称、时间戳和标签进行分组、查询和组织。\n\
  \nPrometheus 提供了基础仪表板，但通常与 Grafana 配合使用以获得更强大的可视化。\n\n某些应用程序（例如短生命期的批处理作业）并不适合按定期间隔抓取的拉取模型。一个简单的例子是短生命期的批处理作业，它可能在\
  \ Prometheus 抓取其指标之前就已经退出。在这种情况下，你可以配置应用程序将指标 `push`（推送）到 Prometheus 的 `pushgateway`，指标会在那里存储，直到\
  \ Prometheus 来抓取它们。\n\n### 不支持原生支持 Prometheus 指标的应用程序\n\n当应用程序没有在 `/metrics` 端点原生暴露\
  \ Prometheus 时间序指标时，你有两个主要选择。\n\n*   客户端库（Client libraries）\n*   导出器（Exporters）\n\
  \n如果你拥有该应用程序，可以使用 `client library` 来添加 Prometheus 支持。客户端库实现了所需的时间序指标，并通常通过预期的 `/metrics`\
  \ 端点暴露它们。它们存在于大多数语言编写的应用程序中，包括 Python、Java、Go 等许多语言。这种做法被称为 `direct instrumentation`（直接插桩）。\n\
  \n如果你在使用第三方应用程序，你的开发者将无法使用客户端库对其进行直接插桩。在这种情况下，最佳选择通常是 `exporter`。导出器作为 sidecar 运行在应用程序的\
  \ pod 中，捕获该应用程序的原生指标和日志，将其转换为 Prometheus 时间序格式，并在 `/metrics` 端点上暴露。一个常见的例子是 NGINX\
  \ Web 服务器。NGINX 是一个非常流行的应用程序，但不支持 Prometheus 指标也没有暴露 `/metrics` 端点。然而，存在一个 NGINX\
  \ 的 Prometheus 导出器，它与 NGINX 并排运行，捕获其指标，转换为时间序格式并在 `/metrics` 端点暴露。\n\n### Prometheus\
  \ 与告警\n\nPrometheus 还可以执行告警。这就是它针对某种状态向你的手机弹出或发送消息的地方。\n\n为了使此功能生效，条件需要持续足够长以便触发告警。告警随后发送到\
  \ Prometheus alert manager（告警管理器），由它处理如何以及发送到哪里。可能的操作包括告警旁机、发送电子邮件、发送短信或 Slack 消息等。\n\
  \n总而言之，Prometheus 是最流行的云原生监控工具，经常部署在 Kubernetes 环境中。它对 Kubernetes 有内置支持，包括自动发现服务的能力。它期望指标和日志数据以时间序格式在广知的\
  \ `/metrics` 端点暴露，并定期对该端点进行抓取。大多数编程语言都有客户端库，用于为你的内部应用程序添加 Prometheus 支持。这被称为 `direct\
  \ instrumentation`。如果你在使用第三方应用程序且无法使用客户端库进行直接插桩，则可以使用导出器。最后，Prometheus 经常与 Grafana\
  \ 配对，以实现顶级的仪表板和可视化。\n\n## 成本管理\n\n有效的成本管理是管理云原生应用和基础设施的关键部分，你应该始终考虑以下三点。\n\n1. \
  \ 选择合适的基础设施\n2.  规模合理化（Rightsizing）\n3.  关闭未使用的基础设施\n\n### 选择合适的基础设施\n\n选择正确的云平台是一个至关重要的决定。然而，即使在选择云平台之后，仍有许多对成本和成本管理有高影响的决定。\n\
  \n例如，大多数云平台提供以下实例类别——`instance` 是云上虚拟服务器的专业术语。\n\n*   按需（On-demand）\n*   预留（Reserved）\n\
  *   抢占（Spot）\n\n`On-demand instances`（按需实例）最常见且最灵活，但它们也是最昂贵的。你可以“按需”创建和删除它们，只要你需要，它们一直属于你。\n\
  \n`Reserved instances`（预留实例）通过长期承诺换取折扣价格。例如，如果你承诺使用 AWS EC2 实例 3 年并预付部分费用，你获得的价格可能比按按需消耗便宜\
  \ 50-70%。然而，你必须支付整个协议期间的费用，即使你在中途停止了使用。\n\n`Spot instances`（抢占实例）通常最便宜，但可以在任何时候被删除。所有大型云平台都持有空闲容量以应对客户需求的激增。为了抵消这些闲置容量的成本，大多数云平台会以大幅折扣（有时低至\
  \ 90%）将其作为 `spot instances` 提供。然而，如果云平台需要这些容量，它可以直接删除你的抢占实例。虽然某些云平台会发送容量重平衡信号提醒你抢占实例正在被移除，但无法保证这些信号能及时发送或接收以供你做出反应。\n\
  \n### 针对成本的规模合理化\n\n规模合理化（Rightsizing）是确保你运行的基础设施数量恰好满足需求，它是性能和成本之间的一种微妙平衡。如果你部署了太多基础设施，性能会很好，但你将支付大量费用。如果你部署得太少，你会节省钱，但性能会很差。坦率地说，自动伸缩（autoscaling）可以有所帮助。\n\
  \n像 Kubernetes 这样的系统可以自动伸缩应用程序和基础设施以满足需求。这意味着你应该始终运行正确的基础设施，而不是为不需要的基础设施付费。\n\n\
  例如，大多数基于云的 Kubernetes 集群允许你定义带有上限和下限的节点池（node pools）。例子可能是下限为 2 个节点、上限为 10 个节点的节点池。这允许\
  \ Kubernetes 根据需求在 2 到 10 个节点之间伸缩池节点数量。Kubernetes 还可以从外部存储系统上动态配置卷，并在不再需要时释放它们。\n\
  \n两个重要的自动伸缩配置选项包括。\n\n*   配置正确的上限和下限\n*   监控正确的指标\n\n\n\n\n我们已经解释了节点池的上限和下限。它们可以防止受损或失控的服务产生非必要的开销。例如，配置了上限为\
  \ 10 的节点池创建的节点永远不会超过 10 个。这有助于限制潜在成本。\n\n监控正确的指标同样重要。例如，对于消息队列系统，队列大小和请求响应时间可能比\
  \ CPU 利用率是更好的指标。\n\n与规模调优和成本管理相关的还包括识别未使用的资源并将其关闭或删除。自动伸缩可以在这方面提供帮助。然而，如果你没有为所有资源配置自动伸缩，就应该定期检查你是否在为不再使用的基础设施和服务付费。\n\
  \n总而言之，自动伸缩是云原生成本管理的一项主要工具。如果配置得当，它可以确保你只使用并支付满足所需的正确基础设施。选择正确的实例类型也是控制云成本的重要组成部分。竞价实例（Spot\
  \ instances）提供最大的折扣，但可以在没有预警的情况下终止。预留实例（Reserved instances）通过对资源的长期承诺（通常为 1-3 年）来换取折扣。按需实例（On\
  \ demand instances）比竞价实例和预留实例更贵，但它们不会被云平台删除，而且你不受长期使用合同的限制。\n\n## 章节总结\n\n在本章中，你学习了遥测的三主要类型：日志（Logs）、指标（Metrics）和追踪（Traces）。日志是应用程序事件，是确定应用程序或微服务无法运行的佳工具。指标提供了历史趋势，并帮助识别随时间的变化。追踪允许你在请求穿过当今复杂的微服务应用时对其追踪。你还学习了\
  \ `OpenTelemetry` 项目提供了规范和插桩工具，以标准化并简化我们生成和存储遥测数据的方式。\n\n你学习了 `Prometheus` 是用于 Kubernetes\
  \ 最流行的监控平台，通常与 `Grafana` 配合用于仪表板和可视化。它期望服务在 `/metrics` 端点暴露遥测数据，并采用拉取模型，定期定期“抓取”数据。它有一个推送网关（push\
  \ gateway）用于从短寿命进程获取遥测数据，还有一个告警管理器（alert manager）用于发送告警。\n\n你完成了本章，学习了预留实例、竞价实例和自动伸缩等内容对成本和成本管理的影响。\n\
  \n## 考试要点\n\n### 遥测 (Telemetry)\n\n`Telemetry` 是系统生成的与监控相关的输出的术语。它们包括日志、指标和追踪。高质量的遥测对于故障排除、调优和理解云原生应用的行为至关重要。\n\
  \n### OpenTelemetry\n\n`OpenTelemetry` 项目是一个 CNCF 孵化项目，它定义了规范和插桩工具，旨在让高质量的遥测成为所有云原生应用的一部分。\n\
  \n### 日志 (Logs)\n\n`Logs` 是与应用程序事件相关的遥测形式，是出现问题时查找故障的最佳位置之一。例如，应用程序重启、登录失败、连接断开等都将作为事件记录。日志数据通常是结构化的并格式化为\
  \ `JSON`，以便于读取和搜索。它还通常根据严重性程度进行分类，常见的严重性级别包括 `info`、`warning`、`error` 和 `critical`。\n\
  \n### 指标 (Metrics)\n\n`Metrics` 通常是长时间捕获的性能相关数据，用于识别性能趋势。自动伸缩器可以使用指标预测潜在问题并执行主动的伸缩操作。\n\
  \n### 追踪 (Traces)\n\n`Tracing` 是追踪请求在穿过复杂分布式系统（如微服务应用）时的端到端旅程的艺术。它们是优化和排查分布式应用程序故障极其重要的元素。`Jaeger`\
  \ 是分析追踪的流行工具。\n\n### 可观测性 (Observability)\n\n高度可观测的应用程序输出高质量的遥测，并存储在中央位置进行分析。观察遥测通常是了解分布式应用如何工作以及对其进行故障的最佳方法。\n\
  \n### Prometheus\n\n`Prometheus` 是一个云原生监控平台。它是一个毕业级 CNCF 项目，也是 Kubernetes 环境中最流行的监控平台。它采用基于拉取的模型，从远程系统抓取指标和日志数据并将其存储在时间序数据库中。它还提供基础仪表板，但通常与更强大的可视化平台（如\
  \ `Grafana`）配对。\n\n### 按需实例 (On-demand instances)\n\n`On-demand instances` 是最常见的云实例。它们最灵活但成本最高。你可以随时创建和销毁它们，云平台保证它们的可用性。\n\
  \n### 预留实例 (Reserved instances)\n\n许多云平台提供折扣价格的预留实例，以换长期承诺。\n\n### 竞价实例 (Spot instances)\n\
  \n许多云平台利用其空闲容量提供竞价实例。它们是最便宜的类型，但没有可用性保证。例如，如果其他地方需要，云平台将从你那里收回竞价实例。\n\n## 复习题\n\n\
  答案见附录 A。\n\n**1.** 下列哪项最能描述遥测？\n\n* 1. 对系统的远程 shell 访问\n* 2. 微服务应用的映射图\n* 3. 按需付费云基础设施\n\
  * 4. 与健康和性能相关的系统输出\n\n**2.** 下列哪项是遥测数据的三个主要类型？选择三个。\n\n* 1. 日志\n* 2. 追踪\n* 3. 指标\n\
  * 4. 审计\n\n**3.** Prometheus 要求指标采用什么格式？\n\n* 1. 十六进制\n* 2. YAML\n* 3. SOAP\n* 4.\
  \ 时间序\n\n**4.** 下列哪项描述了遥测和可观测性的主要目标？\n\n* 1. 故障排除和系统审计\n* 2. 故障排除和改进系统\n* 3. 审计和改进系统\n\
  * 4. 故障排除和证明系统快照\n\n**5.** 下列哪项是定义云可观测性规范和插桩的 CNCF 项目？\n\n* 1. CloudWatch\n* 2.\
  \ OpenTelemetry 项目\n* 3. Kubernetes\n* 4. OpenMonitoring\n\n**6.** 下列哪类遥测以文本或 JSON\
  \ 格式输出应用程序事件？\n\n* 1. 指标\n* 2. 日志\n* 3. 追踪\n* 4. 审计\n\n**7.** 下列哪项按严重性从低到高显示日志数据？\n\
  \n* 1. info, warning, critical, error\n* 2. warning, critical, error, info\n* 3.\
  \ info, warning, error, critical\n* 4. info, critical, warning, error\n\n**8.**\
  \ 下列哪项产生的输出更多？\n\n* 1. 高详细性\n* 2. 低详细性\n\n**9.** 你正在对应用程序进行故障排除，需要尽可能多的日志信息。你应该选择哪个级别？\n\
  \n* 1. critical\n* 2. info\n* 3. debug\n* 4. warning\n\n**10.** Kubernetes 支持哪两种类型的集群日志？\n\
  \n* 1. 节点级代理\n* 2. sidecar \n* 3. 聚合式\n* 4. 持久化日志\n\n**11.** 下列哪些日志可以使用 `kubectl\
  \ logs` 命令读取？选择两个。\n\n* 1. 写入容器 stdin 流的日志\n* 2. 写入容器 stderr 流的日志\n* 3. 写入容器 stdout\
  \ 流的日志\n* 4. 写入自定义文件系统位置的日志\n\n**12.** 你的应用程序生成的日志格式不符合中央日志系统要求的格式。下列哪项可能有所帮助？选择所有正确答案。\n\
  \n* 1. 节点级日志代理\n* 2. 带有日志代理的 sidecar 容器\n* 3. DaemonSet\n\n**13.** 为什么应用程序级日志在云原生应用中有时被认为是一种反模式？\n\
  \n\n\n\n\n# 问题\n\n1. 应用程序不应包含特定环境的数据\n2. 应用程序不应生成日志数据\n3. 应用程序日志过于冗\n4. 应用程序日志产生了大量的东西向（east-west）网络流量\n\
  \n## 14. 哪个命令可以显示名为“kcna-pod”的已终止 Kubernetes pod 的日志？\n1. `kubectl logs kcna-pod\
  \ -p`\n2. `kubectl logs kcna-pod -c`\n4. `kubectl get logs kcna-pod`\n\n## 15. 哪个遥测类最适合查看历史趋势？\n\
  1. 日志 (Logs)\n2. 时序 (Timeseries)\n3. 追踪 (Traces)\n4.指标 (Metrics)\n\n## 16. 下列哪些指标通常最适合判断应用程序的健康和性能？\n\
  1. CPU 利用率\n2. 内存利用率\n3. 自定义指标\n4. 网络延迟\n\n## 17. 哪个遥测类最适合跟踪请求在遍历分布式微服务应用组件时的传输情况？\n\
  1. 追踪 (Tracing)\n2. 日志 (Logging)\n3. 指标 (Metrics)\n\n## 18. 下列哪个被许多人认为是 Kubernetes\
