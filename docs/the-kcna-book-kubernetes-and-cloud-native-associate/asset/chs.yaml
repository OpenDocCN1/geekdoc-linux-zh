  * 3. 每次合并都会启动一个全新的额外环境\n* 4. 频繁的测试\n\n### 18. 下列哪项最能描述反模式？\n* 1. 在配置文件中声明式地定义基础设施\n\
  * 2. 仅根据 CPU 和内存使用情况缩缩应用程序\n* 3. 看起来是个好主意但事实并非如此\n* 4. 频繁部署\n\n### 19. 下列哪一个 GitOps\
