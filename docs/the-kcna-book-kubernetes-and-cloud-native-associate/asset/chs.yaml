  \ 减少对变更的人工干预\n* 4. 对应用程序内部有更好的可见性\n\n# 3: 容器编排\n\n本章涵盖了通过考试中*容器编排（Container orchestration）*部分所需的所有内容。这些主题占考试分数的\
  \ 22%，并建立在上一章所学知识的基础上。它们也为后续章节奠定了基础。\n\n本章划分如下：\n\n* 导论（Primer）\n* 容器运行时（Container\
  \ runtimes）\n* 容器编排基础（Container orchestration fundamentals）\n* 容器安全（Container security）\n\
  * 容器网络（Container networking）\n* 服务网格（Service meshes）\n* 容器存储（Container storage）\n\
  * 考试要点（Exam essentials）\n* 复习习题（Recap questions）\n\n## 导论\n\n容器与虚拟机相似——都允许在单个物理服务器上运行多个应用程序。然而，它们之间存在重要的差异。\n\
  \n\n\n\n\n从高层级来看，容器比虚拟机更轻量。这意味着同一台服务器可以运行比虚拟机数量得多的容器。由于两者都是运行应用程序的技术，容器允许你可以在服务器上运行更多的应用程序。例如，一台可以运行\
  \ 10 台虚拟机的服务器可能可以运行 50 个容器。这为机构节省了巨额成本——你运行应用程序需要更少的基础设施。轻量化也意味着容器的启动速度比虚拟机更快，并且更容易进行打包和共享。\n\
  \n## 容器工作流\n\n以下列表显示了将应用程序作为容器创建和运行涉及的常用步骤。\n\n1. 开发者编写应用程序\n2. 将应用程序打包为 `container\
  \ image`（容器镜像）\n3. 将容器镜像上传并共享在注册表（registry）中\n4. 服务器下载镜像\n5. 服务器将镜像作为容器运行\n\n让我们观察得更仔细一点。\n\
  \n开发者使用他们最喜欢的编程语言编写应用程序——不需要为了容器学习新语言。\n\n应用程序以及所有的依赖项都被封装进容器镜像中，我们通常称之为 `image`（镜像）。由于应用`and\
  \ its dependencies`被封装在同一个镜像中，因此你不应该遇到应用程序在开发者笔记本电脑上可以运行但在生产环境中无法运行的情况。这种情况以前经常发生是因为生产系统和开发者笔记本电脑运行了不同版本的依赖项。容器通过将应用`and\
  \ all dependencies`封装在同一个容器镜像中解决了这个问题。\n\n在中心化的注册表中托管容器镜像是种常做法，这样就可以从不同的环境（开发、测试、生产等）访问它们，并与不同的团队安全地共享。存在许多容器注册表。有些设计为运行在你防火墙内的私有网络上，而另一些存在于公共互联网。`Docker\
  \ Hub` 是第一个主要的容器注册表，可以在网上访问。然而，像所有注册表一样，它被分为仓库（repositories），你可以隐藏它们并限制访问。\n\n一旦镜像共享到注册表，它就可以被下载到服务器并作为容器运行。你可以限制谁可以访问和下载你的镜像，运行镜像的服务器可以是物理服务器、虚拟机，甚至是云实例。\n\
  \n当一个镜像正在执行时，我们称其为 `container`（容器）。这意味着容器是镜像的运行实例。如果你用过 VMware，将镜像比作类似 VM 模板，将容器比作运行中的虚拟机可能会很有帮助。但是，请记住，镜像和容器比\
  \ VM 模板和虚拟机更小、更轻量。\n\n运行容器的服务器需要一种名为 `container runtime`（容器运行时）的特殊软件。稍后的章节将专门介绍这些内容。\n\
  \n## 容器与微服务\n\n容器在塑造微服务架构方面至关重要。\n\n正如前面的章节提到的，微服务应用程序由许多小型、独立的服务组成，这些服务共同工作形成一个实用的应用程序。\n\
  \n每个微服务通常负责单一功能，并封装为它自己的容器镜像。例如，一个具有前端功能、中间件功能和后端功能的微服务应用程序可能会被分为以下三个微服务/容器镜像：\n\
  \n* 前端 (Front-end)\n* 中间件 (Middleware)\n* 后端 (Back-end)\n\n在这个示例中，前端服务由专门团队开发，封装为自己的容器镜像，并独立于另外两个微服务部署。另外两个也是如此。如果前端需求增加，你可以通过增加更多的前端容器来扩展。如果需求下降，你可以通过终止额外的容器来缩小规模。\n\
  \n这证明了微服务与容器之间的关系。它还展示了每个微服务如何通过简单地增加该微服务的容器副本来进行独立扩展。\n\n## 容器架构\n\n容器有时被称为 `virtual\
  \ operating systems`（虚拟操作系统）。让我们将其与虚拟机进行比较以明确这一点。\n\n虚拟机程序虚拟化（如 VMware）将硬件虚拟化。这意味着它获取物理服务器并将其切分为我们称之为\
  \ `virtual machines (VM)`（虚拟机）的虚拟服务器。例如，CPU 被切分成虚拟 CPU，存储被切分成虚拟存储，网卡被切分成虚拟网卡。这些虚拟资源被组合成虚拟机，它们看起来、闻起来和感觉起来就像普通的物理服务器。然后你在每个虚拟机中安装单一的操作系统和应用程序。\n\
  \n容器虚拟化（如 Docker）将操作系统（OS）虚拟化。这意味着它获取 Linux 和 Windows 等操作系统并将其切分为 `containers`（容器）的虚拟操作系统。例如，进程树被切分成虚拟进程树，文件系统被切分成虚拟文件系统，网络接口被切分成虚拟接口。这些虚拟资源组合成容器，它们看起来、闻起来和感觉起来就像普通的操作系统。然后你在每个容器中运行一个应用程序。\n\
  \n总结一下，虚拟机程序虚拟化将物理服务器切成看起来、闻起来和感觉起来像物理服务器的虚拟机。容器虚拟化将操作系统切成看起来、闻起来和感觉起来像普通 OS 的容器。图\
  \ 3.1 显示了对比。\n\n![](img/images----figure3-1.png)\n\n图 3.1\n\n总结：容器是一种比 VMware 等虚拟机程序虚拟化更轻量的虚拟化形式。这意味着容器消耗更少的基础且更具移植性。应用程序代码和依赖项被封装到容器镜像中，存储在中心注册表中，并由想要运行它们的服务器下载。服务器使用容器运行时下载容器镜像并将其作为容器运行。你还学习了容器虚拟化操作系统——每个容器本质上都是一个运行单个应用程序的虚拟操作系统。运行\
  \ 10 个容器的服务器可以运行 10 个应用程序。\n\n### 容器运行时\n\n容器运行在物理服务器、虚拟机和云实例上。由于它们对容器来说看起来是一样的，我们将它们统称为\
  \ `nodes`（节点）。\n\n每个想要运行容器的节点都需要名为 `container runtime`（容器运行时）的专用软件。它负责从注册表下载容器镜像，以及在节点上创建、启动、停止和删除容器。Docker\
  \ 是最广为人知的容器运行时，但也存在许多其他。\n\n让我们回顾之前提到的工作流，以显示容器运行时处于什么位置。\n\n开发者编写应用程序，将其构建成容器镜像并存储在注册表中。为了运行容器，节点需要下载镜像并从其启动容器。执行此操作的软件就是容器运行时。下载容器镜像通常被称为\
  \ `pulling the image`。\n\n如果你用过 VMware，将容器运行时与 ESXi 进行比较可能会很有帮助。因为两者都是底层工具，执行如启动和停止容器或虚拟机的任务。在\
  \ VMware 世界中，像 vCenter 等高级工具提供了更高级的功能。在容器世界中，像 Kubernetes 等高级工具提供了更高级的功能。\n\n###\
  \ 开放容器组织 (OCI)\n\nDocker 是原始容器运行时并且仍然被广泛使用。然而，开放容器组织（OCI）创建了一套行业标准，使得其他开发者和公司能够简单、安全地创建自己的容器运行时。事实上，Docker,\
  \ Inc. 是 OCI 的创始成员，并深度参与了标准的制定。一些最流行的容器运行时包括：\n\n* Docker\n\n\n\n\n\n* `containerd`\
  \ (读音“container dee”）\n* `runC` (读音“run see”）\n* `CRI-O` (读音“cry oh”）\n* `gVisor`\
  \ (读音“jee visor”）\n* `Kata containers`\n\n正如你预期的，每种工具都有其优缺点。\n\nDocker 已经很长时间并且被广泛使用。然而，它的功能远不止于底层工作。例如，Docker\
  \ 还执行了高级调度，并实现了许多通常由 Kubernetes 等平台提供的高级功能。因此，对于许多项目和场景来说，它显得大材小用。\n\n`containerd`（读音“container\
  \ dee”）仅仅是从 Docker 中提取出的底层运行时代码，并于 2017 年捐赠给了 CNCF。得益于其轻量级的特性，它正迅速成为 Kubernetes\
  \ 使用的最流行的容器运行时。它基于 `OCI` 规范并与 `OCI` 镜像协同工作。\n\n> **术语：** OCI 创建了三项规范，定义了容器的低层行业标准。其中一项规范是\
  \ `image-spec`，它定义了容器镜像应该什么样以及如何构建。符合 OCI image-spec 的容器镜像通常被称为 `OCI images`。几乎所有的容器运行时都能与\
  \ `OCI images` 配合。简单来说，`Docker images` 和 `OCI images` 是同的。\n\n### 容器运行时的类型\n\n容器和容器运行时主要有三种类型：\n\
  \n* 命名空间（共享内核）\n* 沙箱（代理内核）\n* 虚拟化（专用内核）\n\n这些术语归结底就是尺寸和安全性的区别。\n\n命名空间容器最快且最轻量，但安全性最低。这是因为同一节点上的每个容器都共享该节点的内核。Docker、`containerd`\
  \ 和 `CRI-O` 都是创建命名空间容器的常见运行时示例。\n\n虚拟化容器启动最慢且消耗资源最多，但它们最安全。这是因为每个容器都运行在带有独立内核的虚拟机内部。Windows\
  \ 容器和 `Kata Containers` 是虚拟化容器的运行时示例。\n\n沙箱容器是折中方案的一种。它们比虚拟化容器更快、更小，但比命名空间容器更大、更慢。在安全性方面，它们也处于中间位置。实现细节超出了本书和考试的范围，但它们通常会在容器与宿主机内核之间实现一个代理层。`gVisor`\
  \ 是创建沙箱容器的运行时示例。\n\n### Kubernetes 与容器\n\n尽管 Kubernetes 是一个容器编排器，但在没有容器运行时帮助的情况下它无法运行容器。\n\
  \n图 3.2 显示了 Kubernetes 与容器运行时之间的关系。Kubernetes 管理一个节点集群，每个节点运行一个容器运行时，并告诉它们何时启动和停止容器。它还实现了自愈和自动伸缩等高级智能功能。\n\
  \n![](img/images----figure3-2.png)\n\n图 3.2\n\n在早期，Kubernetes 使用 Docker 作为其运行时，许多\
  \ Kubernetes 安装现在仍然如此。然而，Kubernetes 实现了一项名为容器运行时接口（`CRI`）的技术，允许用户选择喜欢的容器运行时。目前，`containerd`\
  \ 是大多数新 Kubernetes 集群的默认容器运行时。\n\n`OCI` 规范对于启用 `CRI` 起了关键作用，允许 Kubernetes 使容器运行时可切换——只要容器运行时与\
  \ `OCI images` 兼容，你就可以用一个替换另一个。\n\n> **术语。** OCI 维护着容器运行时和容器镜像等内容的低层行业规范。`CRI` 是让\
  \ Kubernetes 的容器运行时层变得可扩展的关键。不要把两者搞混了。\n\n总结，容器运行时是拉取镜像、启动、停止和删除容器的底层工具。它们具有不同的形状和大小，以适应不同的业务和技术需求。例如，某些快速轻量但安全性较低，而另一些更大更慢但更安全。OCI\
  \ 创建的规范为容器生态系统带来了重要的标准，使得构建各种容器相关的工具和平台成为可能。Kubernetes 是一个更高级的工具，管理容器运行时集群，并告诉它们运行哪些容器，同时带来了自动伸缩和其他云原生功能。Kubernetes\
  \ 还实现了一个名为容器运行时接口的可插拔层，允许你根据需求选择最佳的容器运行时。最后，由于容器运行时是底层工具，它们通常在后台运行，你通常通过 Kubernetes\
  \ 等更高级的工具与它们间接交互。\n\n## 容器编排基础\n\n一旦我们开始使用容器，就显而易见我们需要帮助来管理它们。这是因为我们正在将大型应用程序拆分为许多小小的、松耦合的微服务，这些微服务不断地扩展和缩小，而且我们一直在发布新版本和更新。例如，一个很少更改的大型单体应用将被一个不断变化的复杂的微服务应用所取代。我们需要帮助。\n\
  \nDocker Swarm、Kubernetes 和 Mesosphere DCOS 等工具的创建是为了帮助解决这个问题。简而言之，Kubernetes 在这些工具中脱颖而出，现在已成为地球上最重要的云原生技术。\n\
  \n从高层面上说，Kubernetes 是一个`容器编排器`。这意味着它运行并管理运行在容器中的应用程序。部分包括提供云原生功能，如调度、自愈和自动伸缩等。\n\
  \n让我们考虑一个简单的例子。你有一个带有前端和后端的业务应用程序。你的开发者设计了两个微服务——一个用于前端，一个用于后端。每个微服务都编写并封装成容器镜像，托管在容器仓库中。你需要一个平台来运行应用程序并提供云原生功能，因此选择了\
  \ Kubernetes。你的运维团队构建了一个具有 3 个节点的 Kubernetes 集群，运行 `containerd` 容器运行时。集群完成后，你告诉\
  \ Kubernetes 运行两个前端容器和两个后端容器——这被称为“期望状态”（desired state）。Kubernetes 部署应用程序并配置“监控循环”，以确保集群上实际运行的内容与你的要求相符。我们称之为“观测状态”（observed\
  \ state）和“期望状态”。\n\n假设集群的一个节点发生故障并带走了一个前端容器。监控循环会发现观测状态现在只有一个前端容器，而期望状态是两个。它们将通过在幸存节点上启动第二个前端容器来自动修复此问题，使观测状态恢复到同步期望状态。同时，由于你配置的节点池有三个节点而目前只有两个，一个新的第三节点将被自动创建并加入池中。我们称之为“自愈”或“弹性”。\n\
  \n让我们也假设你为应用配置了伸缩指标，Kubernetes 发现前端难以以应对当前需求。为了解决这个问题，它自动将前端容器的数量从两个扩展到四个。这解决了问题，当需求下降时，Kubernetes\
  \ 会自动缩减回两个。\n\n这展示了 Kubernetes 的云原生能力，并被称为`容器编排`。\n\n### Kubernetes 架构基础\n\nKubernetes\
  \ 是由`控制平面节点`和`工作节点`组成的集群。\n\n控制平面节点运行所有实现云原生功能的智能——那些让 Kubernetes 成为 Kubernetes\
  \ 的功能。\n\n\n\n\n\n工作节点（Worker nodes）是用户应用程序运行的地方。\n\n一个非技术的类比可以是 Amazon。Amazon 基本上是一个网络服务和一个分发服务。网络服务运行所有实现产品目录、搜索、你的购物车和愿望清单等功能的智能——这些是\
  \ Amazon 成为 Amazon 的核心。分发部分是货物如何到达用户手中，有点类似于 Kubernetes 工作节点。\n\nKubernetes 控制面节点保持高性能和高可用性至关重要。作为一个简单的例子，将三个控制面节点放置在不同的数据机房或云区域是一项良好的实践。这意味着如果某个区域或数据机房发生停电等情况，并不是所有的控制面节点都会失效。一个糟糕的反例是将三个控制面节点都放在同一个数据中心机架上，且位于漏水的空调单元下方，并连接到同一个网络交换机和同一个电源——如果其中任何一个环节出现故障，三个控制面节点都可能失效。\n\
  \n通常建议运行 3 或 5 个控制面节点以实现高可用性。\n\n总结来说，容器用于运行复杂的微服务应用程序，我们需要帮助来管理它们。Kubernetes 是实现此任务的最流行的工具，属于被称为`容器编排器`（container\
  \ orchestrators）的工具类。容器编排器的工作是`部署`和`管理`容器化应用程序。部署包括选择合适的节点来运行容器，而管理包括确保它们具有韧性、在需要时扩展，并且可以容易地更新和回滚。Kubernetes\
  \ 集群由控制面节点和工作节点组成。控制面节点实现 Kubernetes 智能，而工作节点是用户应用运行的地方。工作节点依赖容器运行时来启动和停止容器，但 Kubernetes\
  \ 做出哪些节点应该运行哪些容器的整体决策。Kubernetes 还做出自愈和扩展等决策。\n\n## 容器安全\n\n有几种与容器特别相关的安全风险。我们将涵盖以下内容。\n\
  \n* 共享内核\n* 根用户容器（Root containers）\n* 不安全的网络\n* 不可信的代码\n\n### 容器与共享内核\n\n在继续之前，`kernel`（内核）是操作系统核心功能的专业术语。例如，Windows\
  \ 操作系统的核心是 `Windows NT kernel`，而 Linux 操作系统的核心是 `Linux kernel`。我们经常使用 `operating\
  \ system` 和 `kernel` 这两个词来指代同一个东西。\n\n`命名空间容器`（Namespaced containers）是最流行的容器类型，采用共享内核模型运行。这意味着运行在同一节点上的所有容器共享该节点的内核。例如，运行在同一节点上的\
  \ 25 个容器将全部共享该节点的内核。这是容器之所以体积小且启动快的重要原因之一，但这也是一个安全风险。例如，如果节点内核被黑客攻击或破解，该节点上的每个容器也会被攻破。此外，一个被黑客攻破的容器可能会破坏整个节点以及该节点上的所有其他容器。\n\
  \n这意味着命名空间容器从本质上比虚拟机不安全。\n\n创建命名空间容器的容器运行时示例 `Docker`、`containerd`、`runC` 和 `CRI-O`。\n\
  \n`虚拟化容器`（Virtualised containers）和`沙箱容器`（sandboxed containers）是为了解决共享内核问题而创建的。虚拟化容器让每个容器运行在自己的轻级虚拟机中，每个虚拟机都有自己的内核。这解决了共享内核问题，但代价是每个容器变得更大且启动速度更慢。沙箱容器尝试在保护主机内核的同时，不为每个容器提供独立的虚拟机和内核。\n\
  \n还存在其他技术来保护容器，但通常配置复杂。其中一些包括 `seccomp`、`capability dropping`（能力剥弃）、`SELinux` 和\
  \ `AppArmor`。\n\n### 根用户容器\n\n“Root”是 Linux 系统上权限最大的用户账户。这就是为什么以 `root` 身份运行容器会赋予它们过大的权限，并带来巨大的安全风险。因此，你应该避免在容器内部编写需要以\
  \ root 用户运行的应用程序。\n\n如果你必须以 root 身份运行容器，应该考虑 `user namespaces`（用户命名空间），这样容器内部的 `root`\
  \ 用户会自动映射到共享节点上的一个不同用户账户。\n\n### 不安全的网络\n\n我们多次提到，容器运行的微服务应用是高度分布的，并通过网络进行相互通信。这使得网络成为一个潜在的弱点和热门攻击区域。因此，容器之间的通信进行加密至关重要。实现这一点的常用方法是使用服务网格（service\
  \ mesh）。\n\n你还应该考虑 `Kubernetes Network Policies`（Kubernetes 网络策略）来限制哪些微服务可以与其他微服务进行通信。\n\
  \n### 不可信的代码\n\n容器的演进当时，公云还是一个相对新颖的概念。因此，我们在摸索规律的过程中犯了许多错误。例如，一种流行的习惯是运行所谓的`社区镜像`（community\
  \ images）容器。这些镜像是由未知且不可信的第三方提供的。考虑以下这个简单的例子：\n\n你正在领导一个项目，部署一个实现你从未接触过的技术的应用程序。你没有自己去研究技术并构建自己的可信镜像，而是发现别人已经完成了这项困难工作，并向容器仓库上传了一个“可用”的镜像。你决定下载并使用该镜像，因为这将为你节省大量精力。显而见的风险是社区镜像可能包含恶意代码。\n\
  \n考虑到这个例子，只运行可信的代码至关重要。\n\n总结来说，云原生安全通常被认为由四个 C 组成：\n\n* 代码（Code）\n* 容器（Containers）\n\
  * 集群（Clusters）\n* 云端（Cloud）\n\n我们刚刚说过，你应该始终信任你运行的`code`。这包括了解它的来源，以及它确切包含什么、做了什么。你还应该通过不允许运行\
  \ root 容器以及选择合适的容器运行时来确保你的`containers`是安全的。你还应该减轻命名空间容器及其共享内核模型的潜在危险。你还应该确保你的 Kubernetes\
  \ 集群拥有最新的安全修复，并通过 `RBAC`（用户账户和访问控制）进行妥善保护。最后，你应该尽所能保护你的数据中心和云基础设施。\n\n图 3.3 显示了四个\
  \ C 以及随着位置向右移动，你通常拥有的控制权越少。\n\n![](img/images----figure3-3.png)\n\n图 3.3\n\n## 容器网络\n\
  \n容器和微服务带来了以下所有网络挑战。\n\n* 增加的东向流量\n* 服务发现\n* 请求追踪\n* IP 频繁变化（IP churn）\n* 安全\n\n\
  `东向`（East-west）网络流量是同一应用程序内容器在同一网络上相互通信的术语。另一种流量类型被称为南北向（north-south），是应用程序与外部服务的通信。考虑一个简单的微服务应用示例，它包含一个\
  \ Web 前端服务和一个购物车服务。前端和购物车容器之间的流量是同一网络上的东向流量。前端与外部客户端（例如客户的手机 App）之间的流量是南北向流量，且运行在互联网等不可信网络上。\n\
  \n微服务架构将复杂的应用程序拆分为许多通过网络相互通信的小应用程序。这极大地增加了东向流量，并要求对流量进行加密。\n\n\n\n\n微服务应用通常运行在 `Kubernetes`\
  \ 等平台上，并具备自愈、伸缩和滚动发布等云云原生能力。所有这些操作都会从 IP 网络中添加和删除容器，导致 IP 地址的变动频率比大多数网络的设计要高得多——这有时被称为\
  \ `IP churn`（IP 抖动）。\n\n这一切需要一种全新的容器网络模型和新一代网络工具。\n\n### Kubernetes 与容器网络\n\nKubernetes\
  \ 实现了一个名为 `pod network` 的开放扁平网络。这是容器运行的地方，跨越了整个 Kubernetes 集群中的所有节点。让我们仔细观察一下它的一些能力。\n\
  \nKubernetes pod 网络是扁平且开放的。这个专业术语意味着所有容器都可以相互看到并进行通信。这保持了操作的简单性，并使得容器之间的流量变得容易处理。然而，你应该使用\
  \ Kubernetes 网络策略来控制流量。这包括限制哪些容器和服务之间可以相互通信——让所有内容都相互通信是一个重大的安全风险。\n\nKubernetes\
  \ 还实现并自动化了服务发现。所有新应用都会自动将其名称和 IP 地址注册到内部 DNS 中。它们还配置为使用内部 DNS 来查找其他应用。Kubernetes\
  \ 使这一过程自动化，从而使得应用程序无需担心如何实现它。\n\nKubernetes 还实现了 IP 地址管理 (`IPAM`)，负责为新容器分配 IP 地址，并对已终止和失败容器的\
  \ IP 地址进行垃圾回收。这通过确保 DNS 永远不会解析不再运行的容器的 IP 地址，保持了系统的实时性。\n\nKubernetes 在网络可观测性和追踪方面没有强大的能力。可观测性是查看网络正在发生的情况并可能对流量进行故障排除或优化的能力。追踪是在请求应用程序的不同微服务之间传递时跟踪它们。对于这些能力，你应该考虑服务网格（service\
  \ mesh）。\n\n最后，Kubernetes pod 网络是由网络插件实现的，你可以选择一个最适合你要求的插件。例如，并不是所有的网络插件都支持 `IPv4`\
  \ 和 `IPv6` 网络。Kubernetes 实现了容器网络接口 (`CNI`) 以使 pod 网络具有可插件性。这与它通过容器运行时接口（CRI）使容器运行时变为可插件的方式类似。\n\
  \n总结来说，容器和微服务应用为网络带来了一系列新挑战。大量的东西向（east-west）网络流量需要安全保障且需要可观测。云原生特性（如自愈和伸缩）意味着容器频繁地从网络中添加和删除，导致大量的\
  \ IP 抖动。这需要强大的 IP 地址管理和服务发现工具。Kubernetes 实现了一个开放的扁平 pod 网络，你应该用网络策略来保护它。它还提供了强大的\
  \ `IPAM` 和服务发现工具。对于容器之间的流量加密以及对流量流的深度可见性，你应该使用服务网格。\n\n### 服务网格\n\n服务网格自动为云原生应用添加网络安全、可观测性和可靠性，对于大规模生产环境来说至关重要。\n\
  \n服务网格的一个关键方面是自动添加这些功能的能力。它们通过在平台层而非应用层实现这些功能来实现。这个专业术语意味着你只需要安装服务网格，运行在其上面的每个应用程序就能“直接获得这些功能”。这是一种强大的模型，意味着开发者和单个应用程序甚至不需要考虑这些服务。\n\
  \n考虑一个需要加密流量的大型微服务应用。如果没有服务网格，你将需要为每个微服务编写代码，使其具备加密和解密流量的智能和证书能力。这增加了每个微服务的复杂性，并让开发者无法专注于开发对客户和业务有益的功能。替代方案是使用服务网格，它可以自动完成所有的加密和解密，而应用程序甚至不知道这些正在发生——服务网格提供了“加密服务”。\n\
  \n让我们看看服务网格通常在 Kubernetes 上是如何实现的。\n\nKubernetes 是一个由控制平面节点和工作节点组成的集群，运行容器化的应用程序。然而，Kubernetes\
  \ 实际上将容器运行在名为 `pod` 的构造内部。这听起来可能很困惑，但其实不是——pod 只是一个轻量级的封装，允许 Kubernetes 将多个容器调度为单个单元。服务网格利用这一点，在每个应用程序容器的同一个\
  \ pod 中注入一个轻量的服务网格容器。该服务网格容器透明地接管了 pod 内的网络，并执行诸如对所有进入和离开 pod 的流量进行加密/解密等操作。它还暴露了高级的网络遥测数据，可用于故障排除和优化网络性能。一个关键特性是应用程序容器感知不到服务网格的存在，并像往常一样运行。如图\
  \ 3.4\n\n![](img/images----figure3-4.png)\n\n图 3.4\n\n流行的服务网格包括 `Istio`、`Linkerd`\
  \ 和 `Consul`。其他网格也存在，但它们都提供类似的功能。Linkerd 是一个 CNCF 毕业项目，而服务网格接口 (`SMI`) 是一种旨在标准化\
  \ Kubernetes 中基础服务网格能力的规范。\n\n总结来说，服务网格在平台层提供了开箱即用的网络安全和可观测性。这意味着应用程序可以专注于应用本身，而无需关心网络。在\
  \ Kubernetes 中，它们通过向应用程序 pod 注入特殊的服务网格容器来实现这一目标。该服务网格容器处理进入和离开 pod 的网络流量，使其能够透明地保护流量，并暴露高级遥测数据用于故障排除和流量优化。Kubernetes\
  \ 有很多服务网格选项，而 `SMI` 是定义通用服务网格能力的行业规范。\n\n### 容器存储\n\n容器被设计为瞬态的且无状态的。瞬态意味着它们被设计为短寿命的，如果它们失败了，你会用新容器替换它们，而不是修复它们。无状态意味着它们从未被设计用于存储数据。事实上，如果一个容器失败，它内部的所有数据都将丢失。\n\
  \n考虑到这一点，容器应该将数据存储在外部系统中。这是一个非常简单的模型，应用程序代码运行在容器中，而应用程序数据存储在外部。一个运行在 `AWS` 上的简单云示例可能是：业务应用程序代码运行在容器中，其生成的数据存储在\
  \ `AWS` 弹性存储 (`EBS`) 卷中。这样，如果任何应用程序容器失败，数据仍然存在于 `EBS` 卷中。一个类似的本地示例可能是：应用程序代码运行在容器中，其生成的数据存储在共享\
  \ `NetApp` 存储系统的卷中。还存在其他云和存储系统。\n\n这种模型将数据的生命周期与容器的生命周期解耦，并允许为每个容器化应用程序选择合适的存储后端。该架构如图\
  \ 3.5 所示。\n\n![](img/images----figure3-5.png)\n\n图 3.5\n\n\n\n\n考虑以下简单示例。你有一个关键的业务应用程序，用于创建和管理非常重要的客户数据。这些数据需要被保护，且应用程序需要快速访问它们。你在容器上运行该业务应用程序，容器向高性能存储系统读写数据，该存储系统将数据异地复制，并定期进行快照。由于数据存储在外部存储系统中，应用程序容器可能会失败，并被运行在不同节点上的新容器替换，这些容器可以访问相同的数据。这就是应用程序代码、逻辑与应用程序数据之间松耦合的示例。\n\
  \nKubernetes 拥有基于容器存储接口（CSI）的可插拔存储层。它提供了一个通用存储接口，外部系统可以接入该接口并为运行 Kubernetes 上的应用程序提供存储服务。例如，如果你有一个想要在\
  \ Kubernetes 中使用的 NetApp 存储系统，可以在 Kubernetes 集群上安装 NetApp 的 CSI 插件并连接存储器。\n\n总之，容器的设计旨在运行小型、专门的业务应用程序并保持无状态。这意味着你不应该在容器中存储数据，因为容器失败或删除时数据就会消失。相反，你使用\
  \ CSI 插件将外部系统的卷挂载到容器中。这些卷看起来和用起来与本地卷完全相同，应用程序像往常一样对它们读写数据。这样，如果容器失败或被替换，数据就能保留。从提供高级数据管理和数据保护服务的企业级存储系统将卷暴露到\
  \ Kubernetes 中是常见做法。你可以将块存储、文件存储和对象存储提供给 Kubernetes。\n\n所有这一切对于只读写数据的应用程序来说都是透明的。\n\
  \n## 章节总结\n\n在本章中，你学习了容器的基础知识，以及它们如何像更小、更快的虚拟机一样，更适用于微服务应用程序。容器运行时是启动和停止容器的低级应用程序，通常由\
  \ Kubernetes 等高层应用程序管理。Kubernetes 负责编排容器化应用程序，这是一个术语，指的是提供如调度、自愈和自动扩展缩容等功能。\n\n\
  你还学习了容器和微服务设计模式引入了新的安全威胁，例如共享内核、root 容器、不安全的网络和不可信的代码。容器还为 IP 地址管理和服务发现等网络服务带来了新颖且独特的挑战。它们对整体网络安全也产生了影响。Kubernetes\
  \ 提供了原生的 IPAM 和服务发现，但你需要服务网格来实现容器之间的加密以及对网络流量的深度可见性。\n\n最后，你了解到容器的设计是无状态且瞬态的。这意味着你应该始终将数据存储在容器外的外部存储系统中。\n\
  \n## 考试要点\n\n### 容器运行时\n\n`Container runtimes`（容器运行时）是一种基础设施应用程序，专门负责创建、启动、停止和删除容器等低级容器操作。它们通常在后台运行，并由\
  \ Kubernetes 等高层工具管理。例如，你或你的团队可能每天向 Kubernetes 部署应用程序。然而，你不会亲自运行实际启动和停止容器的命令——Kubernetes\
  \ 会在背后为你处理这一切。`Docker` 是最为人知的容器运行时，其他的还包括 `containerd` 和 `CRI-O`。\n\n### 容器化\n\n\
  `Containerisation`（容器化）是将应用程序及其依赖项构建为容器镜像的过程。例如，当开发者编写了一个应用程序并封装为容器镜像时，你可以说开发者已经将“应用程序容器化”。\n\
  \n### 开放容器标准 (OCI)\n\n`The OCI` 是一个开放组织，负责开发底层容器标准，如 `container runtime-spec`（容器运行时规范）和\
  \ `container image-spec`（容器镜像规范）。这两者对于容器运行时和构建工具数量增长起了至关重要的作用。按照 `OCI image-spec`\
  \ 构建的容器镜像通常称为 `OCI images`。`Docker`、`containerd`、`CRI-O` 以及大多数其他容器运行时都支持 OCI 镜像。\n\
  \n### 镜像与容器\n\n开发者编写应用程序并使用构建工具将其封装为 `images`（镜像）。容器运行时下载镜像并从从中启动 `containers`（容器）。因此，容器是镜像的运行实例，反之，镜像就像是停止的容器。然而，你可以从单个镜像启动多个容器。例如，你可以下载一份\
  \ `MySQL` 镜像副本，并从它运行多个容器。\n\n### 容器编排\n\n`Container orchestration`（容器编排）工具（如 `Kubernetes`）自动化了部署和管理容器化应用程序的大多数日常运营方面。例如，Kubernetes\
  \ 会将容器调度到具有足够资源的节点上，根据需求进行扩容和缩容，在它们失败时替换它们，并管理发布和回滚。\n\n### Kubernetes\n\n`Kubernetes`\
  \ 是行业标准的容器编排器。它由一个或多个控制平面节点和一个或多个工作节点组成集群运行。你将微服务应用程序封装为容器并运行在 Kubernetes 集群上。然而，正如你之后将学到的，它们必须运行在\
  \ pod 内部。Kubernetes 拥有将每个容器工作负载调度到适当集群节点的智能，在需要时进行扩展，在发生故障时进行愈合，并允许频繁发布。控制平面节点实现编排智能，工作节点是用户程序运行的地方。\n\
  \n### 容器运行时接口 (CRI)\n\n`The CRI` 是 Kubernetes 实现的一种开放标准，用于使容器运行时层变得可插拔。这意味着你可以根据需求选择最佳容器运行时，并且\
  \ Kubernetes 集群中的每个工作节点都可以运行不同的容器运行时。`Docker` 是 Kubernetes 原始使用的容器运行时，但在大多数新的 Kubernetes\
  \ 集群中，它正被 `containerd` 替换为默认。\n\n### 共享内核\n\n最流行的容器类型是 `namespaced containers`（命名空间容器），它们共享所在运行的节点内核。它们最流行且最轻量，但安全性最低。`Docker`、`containerd`、`CRI-O`\
  \ 以及许多其他容器运行时都创建命名空间容器。虚拟化容器和沙箱容器更安全，但不够轻量且易于迁移。\n\n### Root 容器\n\n不要在容器中以 root\
  \ 身份运行应用程序。这是因为它们会对其运行的节点以及同一节点上的所有其他容器构成重大风险。你应该设计应用程序使其无需以 root 身份运行，并实施防止容器以\
  \ root 身份运行的策略。如果你的程序绝对以 root 身份运行，你应该实现 `user namespaces`（用户命名空间），将容器内的 root 用户映射为节点上的非\
  \ root 用户。这意味着被攻击的 root 容器不会获得节点的 root 权限。\n\n### 不安全的网络\n\n微服务应用程序大量分布在多个节点上，这意味着它们必须通过\
  \ IP 网络共享敏感数据。如果这些网络是开放且数据以明文传输，这是一个巨大的安全风险。考虑到此，你应该加密容器之间的所有流量。实现这一点简单的方法之一是部署服务网格。\n\
  \n### 不可靠的代码\n\n你应该只运行你了解并信任的应用程序。实现这一点简单方法是在内部构建并测试所有代码。不要使用和信任从互联网下载的代码，例如社区镜像。\n\
  \n容器网络：IP 地址管理 (IPAM)\n\n\n\n\n\n曾经是一个具有单一且固定 IP 地址的大型单体应用，现在变成了一个拥有 15 个 IP 地址的云原生微服务应用。不，等一下，它刚刚扩展了，现在是\
  \ 21 个 IP 地址。不，等一下，23 个……微服务应用中的每个容器都有自己的 IP 地址，随着规模的扩大和缩小，以及新版本的发布，IP 地址会不断从网络中添加和删除。这需要现代的\
  \ IPAM（IP 管理）工具。Kubernetes 为高度动态的网络提供了原生的 IPAM。\n\n### 服务发现\n\nKubernetes 使用专用的内部\
  \ DNS 进行服务注册和发现。Kubernetes 集群上的所有新服务都会自动注册到 DNS 中，并且每个容器都配置为使用此内部 DNS 进行服务发现。这意味着\
  \ Kubernetes 集群上的每个服务都能找到其他服务。\n\n### Kubernetes Pod 网络\n\nKubernetes 实现了一个名为“pod\
  \ 网络”的网络，所有容器都连接到该网络。它是一个扁平开放网络，意味着所有容器都可以连接到所有其他容器。它也是实现 IPAM 和服务发现的地方。然而，你应该使用\
  \ Kubernetes 网络策略来对其锁定，并控制哪些服务允许通信。\n\n### 服务网格\n\n服务网格在生产级 Kubernetes 环境非常有用。它们在平台层提供了网络安全和可观测性。这意味着应用程序可以专注于业务本身，而无需考虑流量安全和遥测数据暴露——服务网格会自动提供所有这些。流行的服务网格技术包括\
  \ Istio、Linkerd 和 Consul。服务网格接口（SMI）是一个与 Kubernetes 相关的规范，定义了一组标准的服务网格资源。\n\n###\
  \ 容器存储\n\n容器被设计为无状态的。这意味着你不应该将数据存储在它们中，因为当容器被删除或丢失时数据将会丢失。Kubernetes 实现了一种名为容器存储接口（CSI）的技术，使第三方存储资源能够暴露在\
  \ Kubernetes 中并被运行在 Kubernetes 上的应用程序使用。它让你能够为运行在 Kubernetes 上的应用暴露企业级存储。这也意味着当容器被删除或失败时，数据仍然可用。\n\
