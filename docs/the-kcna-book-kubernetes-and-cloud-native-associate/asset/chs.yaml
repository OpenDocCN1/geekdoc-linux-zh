  * 网站: nigelpoulton.com\n* Twitter: @nigelpoulton\n\n## 反馈\n\n写书很辛苦，我在假期期间工作不懈，才把这本书送到你手中。考虑到这一点，如果你愿意花一分钟写写\
  \ Amazon 评论，我会将其视为你的一份情。\n\n此外，如果你对这本书或你的考试经历有任何反馈，请给我发送电子邮件到 `kcnabook@nigelpoulton.com`，我会尽力回复。\n\
  \n祝阅读愉快，祝你考试好运！\n\n# 1: 设定背景\n\n本章没有直接对应考试目标。然而，你将学习的内容在考试中，并且对于设定为什么会有容器和 Kubernetes\
  \ 等技术的背景非常重要。如果你已经了解了这些，可以跳到下一章。否则，请留下来，我们将为本书其余部分设定背景。\n\n我们将从高层次涵盖以下内容：\n\n* 虚拟化\n\
  * 容器化\n* 从单体应用到微服务的转变\n\n如果你觉得我们涵盖的细节不够，请不要担心。这只是一个介绍章节，我们将在后面的章节中进入细节。\n\n## 虚拟化\n\
  \n在遥远的过去，我们每台物理服务器部署一个应用程序。这是对物理资源和公司资本的巨大浪费。它在等待物理服务器采购、上架、接入网络和安装操作系统期间也延迟了应用程序的发布。\n\
  \n`VMware` 等虚拟化技术的出现，为我们在单台物理服务器上运行多个应用程序打开了大门。这意味着我们不需要为每个新应用购买新服务器，可以在现有服务器的虚拟机上快速部署应用，并避免以下所有情况：\n\
  \n* 不再需要等待财务部门批准服务器购买\n* 不再需要等待数据中心团队上架和连接服务器\n* 不再需要等待网络团队在网络上授权服务器\n* 不再需要系统管理员安装操作系统\n\
  \n几乎立即，我们就从在购买和安装需要漫长时间的性能过剩物理服务器上浪费钱……转变为一个我们可以在现有服务器上快速配置虚拟机的世界。\n\n然而，行业从未睡眠，创新从未停止。\n\
  \n### 容器化\n\n在 21 世纪 10 年代初，`Docker` 为世界带来了易用容器的礼物。\n\n从高层次来看，容器是虚拟化的另一种形式，允许我们在更少的服务器上运行更多的应用程序，并部署得更快。\n\
  \n图 1.1 显示了服务器虚拟化和容器虚拟化的对比图。\n\n![](img/images----figure1-1.png)\n\n图 1.1\n\n\n\n\
  \n如图像所示，服务器虚拟化将一台物理服务器切分为多个虚拟机（VM）。每个虚拟机看起来、闻起来、用起来都像一台物理服务器，这意味着每个虚拟机都拥有虚拟 CPU、虚拟内存、虚拟虚拟硬盘和虚拟网卡。你可以在每个虚拟机上安装操作系统（OS），然后为每个虚拟机安装一个应用程序。如果一台物理服务器被切成\
  \ 10 个虚拟机，就会有 10 个操作系统，你可以安装 10 个应用程序。\n\n容器虚拟化则将操作系统切分为称为 `containers` 的虚拟操作系统。每个容器看起来、闻起来、用起来都像一个正常的操作系统。这意味着每个容器都有它自己的进程树、根文件系统、`eth0`\
  \ 接口等。你随后为每个容器运行一个应用程序，这意味着如果一台服务器和一个操作系统被切成 50 个容器，你可以运行 50 个应用程序。\n\n这就是从 4 万英尺高空观察的视角。\n\
  \n### 容器 vs 虚拟机\n\n容器和虚拟机都是用于运行应用程序的虚拟构建结构。然而，容器具有几个重要优势。\n\n一个优势是，容器比虚拟机轻量得多且高效得多。这意味着使用容器的企业可以在相同数量的物理服务器上运行更多的应用程序。\n\
  \n例如，一个拥有 10 台物理服务器的组织可能能够运行 100 个虚拟机和应用程序。然而，如果该组织选择容器而不是虚拟机，他们可能可以运行 500 个容器和应用程序。原因之一是，每个虚拟机都需要一个专用的操作系统（OS）。这意味着一台被切成\
  \ 10 个虚拟机的物理服务器需要安装 10 次 Windows 或 Linux（也存在其他操作系统）。每个操作系统都会消耗 CPU、内存和磁盘空间，而这些是无法用于应用程序的。在容器模型中，每个容器都共享其运行所在宿主机的操作系统。这意味着只有一个操作系统在消耗\
  \ CPU、内存和磁盘空间，从而留出更多资源运行应用程序。\n\n容器的部署和启动也比虚拟机快。这这也是因为每个虚拟机都包含一个操作系统和一个应用程序。操作系统可能很大，导致它们打包时体积更大、更笨肿。这意味着在应用程序启动之前，启动虚拟机需要先引导一个完整的操作系统。这可能会非常耗时。\n\
  \n总结一下，当将应用程序打包为容器时，你只打包应用程序及其依赖项。你不需要打包完整的操作系统。这使得容器镜像更小、更容易共享。它也让它们启动更快——你只需要启动应用程序。\n\
  \n如果上述内容有点模糊，以下内容可能有所帮助。\n\n应用程序开发者像既往一样编写应用程序。然后将应用程序和依赖项打包成容器镜像。`Dependencies`\
  \ 是共享库文件等。一旦创建了容器镜像，就可以将其托管在共享仓库供所需的系统和团队访问。容器主机（只是运行 `Docker` 等容器运行时的服务器）获取镜像副本并从其启动容器。容器主机上有一个正在运行的\
  \ Windows 或 Linux 副本，宿主机上的容器运行时会快速创建容器并执行镜像内部的程序。\n\n容器模型使用的更小打包方式带来了其他优势，例如微服务、自动化流水线等。我们将在书的后续部分介绍这些内容。\n\
  \n在继续之前，承认虚拟机相对于容器所拥有的优势是非常重要的。\n\n每个虚拟机都需要专用操作系统这一事实，在打包和应用程序启动时间方面是一个缺点。但在安全性方面，它可能是一个优势。举个简单的例子，如果容器宿主机上的共享操作系统被攻破，每个容器也会被攻破。这是因为每个容器都共享宿主机的\
  \ OS 内核。在虚拟机模型中，每个虚拟机都有自己的 OS 内核，这意味着攻破一个内核不会影响其他虚拟机。\n\n尽管存在这一安全挑战，容器通常被认为是现代业务应用程序的最佳解决方案。\n\
  \n到目前为止，我们主要关注物理基础设施（如服务器）以及如何最好地利用它们。现在让我们转向应用程序的开发和管理。\n\n字体 单体架构 vs 微服务\n\n在过去，我们构建运行在专用物理服务器上的单体应用。\n\
  \n`Monolithic application`（单体应用）是一个术语，指执行许多功能的大型复杂应用程序。例如，一个单体应用可能将所有服务捆绑并作为一个单一程序发布：\n\
  \n*   Web 前端\n*   身份验证\n*   购物车\n*   目录\n*   持久化存储\n*   报告\n\n需要理解的关键点是，所有这些服务都由同一个团队开发，作为一个单一程序发布，作为一个单一程序安装，并作为一个单一程序进行补丁和更新。这意味着它们非常复杂且难以处理。例如，对单体应用的报告服务进行补丁、更新或扩展意味着你必须对整个应用进行补丁、更新或扩展。这使得几乎所有的更改都是高风险的，通常导致更新被合并成一次极高风险的更新，并每年在一个漫长且充满压力的周末完成一次。\n\
  \n虽然这种模型在过去是可以的，但在现代云时代就不行了，因为企业完全依赖技术，并且需要他们的应用程序能够对快速变化的市场和情况做出反应。\n\n微服务应用登场……\n\
  \n解决单体应用问题的现代答案是 `cloud native microservices`（云原生微服务）应用。\n\n在最高层，“云原生”和“微服务”是两个不同的概念。`Microservices`\
  \ 是用于设计和开发应用程序的架构，而`cloud native`是一组应用程序特性。我们很快就会详细介绍。\n\n考虑具有 Web 前端、身份验证、购物车、目录、持久化存储和报告需求的同一个应用程序。为了变成微服务应用，你独立开发每个功能、独立发布每个功能、独立安装每个功能，并独立地进行补丁、更新和扩展。然而，它们相互通信并协同工作，为用户和客户端提供相同的应用程序体验。\n\
  \n我们将这些功能中的每一个称为“服务”（service），由于每个服务都是很小的，我们将其称为微服务（`micro` 是英语中“小的另一种表达）。考虑到这一点，同一个应用程序将具有以下\
  \ 6 个微服务，每个微服务都是一个独立的微型应用程序：\n\n*   Web 前端\n*   身份验证\n*   购物车\n*   目录\n*   持久化存储\n\
  *   报告\n\n这种微服务架构改变了许多事情，包括：\n\n*   每个微服务都可以拥有自己的小型敏捷开发团队\n*   每个微服务都可以有自己的发布和更新周期\n\
  *   你可以扩展任何微服务而不影响其他服务\n*   你可以修补和更新任何微服务而不影响其他服务\n\n通常来说，采用微服务架构意味着你可以比使用单体应用更容易、更频繁地部署、打补丁、更新、扩展和自愈你的业务应用程序——这就是云原生元素。许多使用微服务应用程序的组织每天推送多次安全可靠的更新。\n\
  \n然而，微服务应用程序的分布式特性也带来了一些挑战。\n\n\n\n例如，应用程序的各个微服务可以运行在不同的服务器和虚拟机上。这意味着它们需要通过网络进行通信，这增加了网络复杂性并引入了安全风险。同时，对于不同微服务的开发团队来说，相互通信并对应用程序的整体也变得至关重要。尽管如此，微服务架构带来的收益远大于其带来的挑战。\n\
  \n简而言之，`microservices`（微服务）是一种将应用程序功能拆分为独立的小型、单一用途应用程序的架构模式。`Cloud native`（云原生）是一系列特性和行为。`features`包括自愈能力、自动伸缩、零停机更新等。`behaviors`包括敏捷开发和频繁可预测的发布。\n\
  \n## 章节总结\n\n在本章中，你学习了我们过去每台物理服务器只部署一个应用程序。这造成了资本、服务器和环境资源的浪费。此外，由于新服务器需要采购、交付和安装，这导致了应用程序部署的长时间延迟。VMware\
  \ 的出现使我们能够在每台物理服务器上运行多个应用程序。它减少了资本支出，并允许更高效地利用服务器和环境资源。它还允许我们通过将应用程序部署到已拥有的服务器上的虚拟机中，更快地发布应用程序。\n\
  \n容器也是一种虚拟化形式。它们在操作系统层进行虚拟化，每个容器都是一个虚拟操作系统。容器比虚拟机更快、更高效，但在开箱即用的情况下它们的安全性通常较低。容器的优势使我们能够重新思考开发、部署和管理应用程序的方式。\n\
  \n由容器实现的一大创新是微服务设计模式，它将大型复杂的应用程序拆分，每个应用程序功能都被开发并部署为一个名为“微服务”的独立的小型、单一用途的应用程序。这种架构实现了云原生特性，例如自愈、伸缩、定期且可重复的发布等。\n\
  \n所有这些都可以由云和类云基础设施提供，这些基础设施可以根据需要进行扩展。\n\n今天，我们生活在一个应用程序和基础设施可以自愈，且单个应用程序功能（微服务）可以自动伸缩并更新，而不影响任何其他应用程序功能的世界上。\n\
  \n## 考试要点\n\n本章没有直接对应某个考试领域。然而，以下考试主题被提及，并将在书籍后续部分进行详细介绍。\n\n### 容器运行时\n\n运行容器的服务器被称为\
  \ `container host`（容器宿主机）。它们使用一种名为 `container runtime`（容器运行时）的低级工具来启动和停止容器。Docker\
  \ 是最著名的容器运行时，也是 Kubernetes 支持的首个容器运行时。然而，它在 Kubernetes 中正被一个名为 `containerd`（发音为\
  \ container dee）的更轻量的版本取代。存在许多其他容器运行时，其中一些的工作方式不同。有些以牺牲安全性为代价换取更好的性能，而另一些以牺牲体积和性能为代价换取更好的安全性。你将在书中了解更多内容。\n\
  \n## 容器安全\n\n运行在单个宿主机上的所有容器共享宿主机的操作系统内核。这使得它们很小、易于携带且启动快速。但是，如果宿主机的内核被破坏，运行在该宿主机上的所有容器也会受到破坏。目前有很多容器运行时可用，并非所有的原理都相同。例如，`Docker`\
  \ 和 `containerd` 运行时实现了共享内核模型，使它们轻量且快速，但容易受到共享内核攻击。而 `gVisor` 实现了一种更安全的模型。你将在书中了解更多内容。\n\
  \n## 容器网络\n\n微服务架构将应用程序功能实现为称为微服务的微型独立服务。组成应用程序的不同微服务必须使用网络进行通信和数据共享。这增加了网络实体的数量，增加了整体网络复杂性，并增加了网络流量。跨网络通信和共享数据也比在同一服务器上进行通信和共享要慢。\n\
  \n### 自动伸缩\n\n微服务架构允许单个应用程序微服务独立伸缩。例如，像 Kubernetes 平台可以在月底和年底业务比平时更忙碌时，自动扩展应用程序的报告微服务的规模。再次，你将在书中了解更多内容。\n\
  \n## 复习题\n\n答案请参见附录 A。纸质版第 157 页。\n\n**1.** 与虚拟机相比，以下哪些项是容器的优点？选择所有正确答案。\n\n* 1.\
  \ 体积更小\n* 2. 启动速度更快\n* 3. 开箱即用的安全性更高\n* 4. 每台物理服务器可运行更多应用\n\n**2.** 与容器相比，以下哪项是虚拟机的优点？\n\
  \n* 1. 虚拟机启动比容器快\n* 2. 虚拟机开箱即用的安全性更高\n* 3. 虚拟机比容器小\n* 4. 虚拟机实现了微服务设计模式\n\n**3.**\
  \ 容器虚拟化在哪层工作？\n\n* 1. 硬件层\n* 2. 基础设施层\n* 3. 应用层\n* 4. 操作系统层\n\n**4.** 以下哪些项是容器的组成部分？选择所有正确答案。\n\
  \n* 1. 虚拟进程树\n* 2. 虚拟 CPU\n* 3. 虚拟硬盘\n* 4. 虚拟文件系统\n\n**5.** 下列哪个说法是正确的？\n\n* 1.\
  \ 你通常可以在服务器上运行比虚拟机数量多的容器\n* 2. 你通常可以在服务器上运行比容器数量多的虚拟机\n\n**6.** 为什么容器可能比虚拟机不安全？\n\
  \n* 1. 容器网络始终是明文传输的\n* 2. 容器镜像在公共网上始终可用\n* 3. 你不能加密容器文件系统\n* 4. 宿主机上的所有容器共享同一个操作系统内核\n\
  \n**7.** 以下哪些项是容器镜像的一部分？选择所有正确答案。\n\n* 1. 应用程序代码\n* 2. 应用程序依赖项\n* 3. 快照\n* 4. 独立的操作系统\n\
  \n**8.** 以下哪项最能描述单体应用程序？\n\n* 1. 仅运行在本地数据中心的应用程序\n* 2. 所有功能都编码在单个二进制文件应用程序\n* 3.\
  \ 实现了自动伸缩和滚动更新等云原生功能的应用程序\n* 4. 具有非常小的容器镜像的应用程序\n\n**9.** 以下哪些项是单体应用程序的缺点？选择所有正确答案。\n\
  \n* 1. 每个功能都必须通过网络通信\n* 2. 更新风险且复杂\n* 3. 无法扩展单个应用程序功能\n* 4. 无法将其部署到公云\n\n**10.**\
  \ 以下哪些项是微服务应用程序的优点？选择所有正确答案。\n\n* 1. 每个微服务都可以拥有自己的精简敏捷开发团队\n* 2. 每个微服务都可以拥有独立的操作系统内核\n\
  * 3. 每个微服务都可以独立伸缩\n* 4. 每个微服务都可以独立进行补丁\n\n**11.** 以下哪些项是微服务应用程序的潜在缺点？选择所有正确答案。\n\
  \n* 1. 容器镜像可以非常小\n* 2. 它们无法在公云上运行\n* 3. 网络复杂性增加\n* 4. 网络流量增加\n\n\n\n\n- 定义云原生架构\n\
  - 弹性\n- 自动伸缩\n- 无服务器 (Serverless)\n- 社区与治理\n- 角色与人物\n-开放标准\n- 章节总结\n- 考试要点\n- 复习题\n\
  \n## 定义云原生架构\n\n首先需要理解的是，`cloud native`（云原生）是一种能力和实践。没错，云原生并不是指运行在公云上，它是一套能力和实践。\n\
  \n`云原生能力`包括具有弹性、可扩展性、观测性、高度自动化且易于更新的应用程序和基础设施。`云原生实践`则是关于构建鼓励合作、集成和开放治理的团队和流程。最终结果是创建一个能够交付高质量、并满足且响应现代业务需求的环境。\n\
  \n大多数云原生应用也是`microservices apps`（微服务应用）。正如上一章所解释的，微服务是一种架构，每个应用程序功能都作为一个小型独立的应用程序进行开发和部署。举个简单的例子，一个具有\
  \ Web 前端和数据库后端的应用程序将会有两个微服务——一个前端，一个后端。最常见的模型是将每个微服务部署为自己的一组容器。例如，你的初始部署可能有一个前端容器和另一个不同的后端容器。如果你需要扩展前端，只需添加更多相同的前端容器。\n\
  \n为了避免混淆，`microservices`（微服务）是一种应用程序架构，例如将每个应用程序功能开发为自己的小体应用。而`Cloud native`（云原生）是指如弹性、可扩展性、发布等特性。这两者结合得非常好。\n\
  \n虽然云原生不仅仅是在云中运行应用程序，这是事实，但许多概念起源于公云并在那里运行效果最好，这也是事实。然而，在你自己的本地（on-premises）数据中心中也可以实现`cloud\
  \ native`，这样做将为你的业务带来许多益处。例如，本地基础设施和应用程序是可以观测的、自动化的，甚至具有弹性和可扩展性的元素。它们将更容易迁移到云端，甚至实现云端爆发（burst）。然而，它们在与公云理论上无限的资源竞争时，将始终面临困难。\n\
  \n让我们快速澄清几个关键术语。在这里未澄清的内容将在接后的章节中详细介绍。\n\n### 公云\n\n`public cloud`（公云）是由第三方提供的按需付费的基础设施和服务。流行的例子包括\
  \  Amazon Web Services (AWS)、Microsoft Azure、Google Cloud Platform 和 Digital Ocean。基础设施和服务与其他用户共享，你并不拥有或管理它们。你只需要使用它们并为你用过的部分付费。大多数云平台规模如此巨大，以至于我们有时说它们拥有无限容量。\n\
  \n### 本地数据中心\n\n`On-premises`（本地）、`on-prem` 和 `datacenter`（数据中心）都是指你拥有并管理的专用基础设施和服务的。你甚至可能拥有存放它们的设施，但这并不是必要条件。与公云相比，它们通常要小得多。\n\
  \n### 基础设施\n`Infrastructure`（基础设施）指的是服务器、虚拟机、云实例、网络和存储等物品。\n\n### 云爆发\n\n`Cloud\
  \ bursting`（云爆发）是指当你数据中心容量达到极限时，将云作为溢出区域。例如，一个在线零售应用程序在节假日周末可能会耗尽本地数据中心的容量，并扩展到公云中以满足临时需求峰值。应用程序的用户可能由运行在本地数据中心或公云中的实例提供服务，且他们不应该感知到区别。当需求减少时，应用程序将停止使用公云。\n\
  \n总结来说，`cloud native`（云原生）是技术与实践的结合。具有弹性、扩展性、观测性和自动化的应用程序和基础设施就是“云原生”。采用能够频繁且可靠部署的流程和标准的组织就是“云原生”。无论你运行在公云还是你自己的本地数据中心，你都可以是云原生的。\n\
  \n让我们深入研究考试的特定学习目标。\n\n## 弹性\n\n`Resilient`（弹性的）应用程序和基础设施可以在发生故障时自愈合。事实上，我们有时将弹性称为“自愈合”。\n\
  \n一个简单的基础设施例子是节点池（node pool）。大多数云平台允许你创建一个名为节点池的虚拟服务器池。如果你配置了 10 个虚拟服务器，而其中一个故障了，系统可以通过启动新节点并自动将其添加到池中来实现自愈合。\n\
  \n`Kubernetes` 为应用程序和基础设施提供了自愈合能力。例如，如果 `Kubernetes` 知道你一个 Web 前端微服务需要 5 个容器，而其中一个故障了，它会启动一个新的，以确保你仍然拥有\
  \ 5 个。\n\n尽管这些仅仅是简单的例子，但将弹性的应用程序与弹性的基础设施相结合是非常强大的。\n\n### 松散耦合与为故障而设计\n\n设计弹性系统的一个关键原则是预料故障的发生。这迫使你构建能够处理故障的东西。一个流行且经过实战的基础设施例子是磁盘镜像（disk\
  \ mirroring）。这是将同一份数据的两个副本写入两个单独的存储设备中。当其中一个故障时，你仍然可以访问数据，且不会产生停机或数据丢失。上一句话的关键词是\
  \ `when`（当...），而不是 `if`（如果）——是“当一个故障时”而不是“如果一个故障时”。\n\n现代微服务应用的设计和构建必须明确知道组件会经常发生故障。处理此问题的简单策略包括微服务的松散耦合以及通过\
  \ `APIs` 进行消费。这有很多专业术语，所以这个非技术性的类比应该有所帮助。\n\n想象你买了一个缺少了某个零件的产品。一种选择是联系客户服务团队。为此，你拨打了一个通用电话并与\
  \ Mia 通话，她开启了一个支持案例并寄了缺失的零件。两天后货物还没有到达，于是你再次拨打电话。这次 Ross 接了电话，你要求找 Mia。不幸的是，她休假一周，所以你把工单号给了\
  \ Ross。由于案例详情存储在整个团队都可以访问的外部共享系统中，Ross 能够帮助你。在这个例子中，你通过通用电话与客户服务团队是`松散耦合`的，你的案例记录存储在团队可以访问的独立系统中。这意味着你可以与客户服务团队的任何成员交流，他们都能帮助你处理案例。\n\
  \n`Tightly coupled`（紧耦合）版本的相同场景可能是这样的。你买了一个缺少了零件的产品。你拨打了客户服务团队 Mia 的直拨电话与她通话。她在笔记本电脑上记录了一些案例记录并寄了缺失的零件。两天后货物还没有到达，于是你再次拨打电话..她的电话一直转到语音箱。在尝试联系\
  \ Mia 两天后，你终于找到了客户支持团队另一位成员 Ross 的电话。你拨打了他的直拨电话，他解释说无法访问你的案例记录，因为这些记录在 Mia 的笔记本电脑上，而她把它带回家了。在这个场景中，你与特定的支持团队成员是紧耦合的，当你要联系的人不在时，一切都崩溃了。\n\
  \n\n\n在云原生微服务应用世界中，你应该使服务保持松散耦合，并将数据存储在应用之外，这样当单个微服务发生故障或变更时，整个应用程序仍能运行。一个简单的例子可能是微服务\
  \ A 通过网络抽象（例如共享 DNS 名称）与微服务 B 通信，所有的状态都存储在外部数据存储中。这样，如果微服务 B 的任何实例宕机，你仍然可以通过相同的\
  \ DNS 名称访问其他实例，它们可以从外部存储器访问相同的状态。\n\n紧耦合的版本是微服务 A 直接与微服务 B 的实例 1 通信，而该实例本地存储状态。当微服务\
  \ B 的实例 1 故障时，状态就会丢失，其他实例都无法接管。\n\n## 自愈\n\n韧性应用程序和基础设施的另一个重要特性是在无需人工干预的情况下恢复的能力——系统会自动愈合。\n\
  \n三个概念是实现这一工作机制的关键：\n\n- 期望状态 (Desired state)\n- 观测状态 (Observed state)\n- 调 (Reconciliation)\n\
  \n期望状态是你希望拥有的。观测状态是你实际拥有的。调是指保持观测状态与期望状态同步的过程。\n\n考虑以下示例。你告诉 `Kubernetes` 你希望运行\
  \ 5 个版本为 2.2 的软件 Web 服务器 pod。这就是你的期望状态。`Kubernetes` 实现它并设置了一个监视循环来观察情况。此时，期望状态是\
  \ 5 个运行版本 2.2 的 pod，观测状态也是 5 个运行版本 2.2 的 pod。然而，如果某些地方损坏导致你丢失了一个 pod，观测状态将降到 4 个\
  \ pod，但期望状态仍然是 5 个。`Kubernetes` 通过启动一个新的第 5 个运行版本 2.2 的 pod 来调这种状况，使观测状态恢复到与期望状态同步。这个过程被称为\
  \ `reconciliation`，是无需人工干预实现自愈的关键。\n\n## 健康检查\n\n关于韧性的最后一点是健康检查和探针（probes）。这些是额外的检查层，通常包含`应用智能`（application\
  \ intelligence）——这是一个术语，指的是一组测试你的应用程序是否按预期运行的检查项。\n\n例如，之前关于期望状态和调的章节没有包含`应用智能`。它只确保有\
  \ 5 个运行版本 2.2 软件的 pod。它并不能确保每个 pod 内部的应用程序运行正常。\n\n一个简单的非技术示例可能是快速肉眼检查冰箱里是否有牛奶。你的期望状态可能是冰箱里有一盒红盖牛奶。快速的视觉检查证明了你拥有它。然而，它并不能检查牛奶是否新鲜，或者盒里还有多少。在这种情况下，`应用健康检查`可能会拿起那盒牛奶，检查日期，并可能进行“嗅闻测试”\
  \ ;-)。重点是……虽然快速的视觉检查可能确保观测状态匹配期望状态（想要一盒牛奶，你确实有一盒牛奶），但它无法检查牛奶是否良好。\n\n在云原生世界中，健康检查通常是测试应用程序是否按预期运行的专用请求。有时我们称之为“探针”，因为它们会\
  \ `probe` 应用程序。\n\n许多基于 Web 的应用程序会暴露一个特定的健康检查终端，例如 `/healthz`。例如，如果应用可以通过 `knca-app.kubernetes.local`\
  \ 访问，它就会暴露 `kcna-app.kubernetes.local/healthz`。向该地址发送请求会导致应用返回你用于判断应用健康的数据。示例 URL\
  \ 可能是 `myapp.k8s.local/healthz`。\n\n总而言之，松耦合实现了更流动的环境，事物可以在发生故障并被替换而不影响整个应用和用户体验。`Kubernetes`\
  \ 等系统不断观察其环境，以确保它们观察到的（观测状态）是你请求的（期望状态）。如果观测状态与期望状态不匹配，`调` 过程就会修复问题。健康检查和探针增加了额外的检查层，用于测试应用程序是否按预期工作。\n\
  \n### 自动伸缩\n\n自动伸缩是应用程序和基础设施自动增长和缩小以满足需求的能力。\n\n要让自动伸缩真正云原生，三点至关重要：\n\n- 应用程序和基础设施需要能够扩展\n\
  - 扩展必须是自动的\n- 扩展必须是向上和向下\n\n`Kubernetes` 具有根据当前负载向上和向下扩展应用程序的能力。它可以使用简单的指标（如 CPU\
  \ 和内存消耗），也可以使用特定特定的指标（如队列大小和请求响应时间）。\n\n一个简单的例子可能是应用程序的报告微服务。如果业务部门正在运行年度报告，且报告微服务面临\
  \ 10 倍的需求增长，`Kubernetes` 可以启动额外的报告容器来满足需求。当需求减少时，`Kubernetes` 可以终止额外的容器。如果应用程序运行在公有云上，`Kubernetes`\
  \ 还可以扩展基础设施以帮助支持额外的容器。一个常见的例子是 `Kubernetes` 向节点池中添加更多节点。\n\n让我们仔细观察这个示例。\n\n假设你的业务应用程序运行在\
  \ 5 个节点（云实例/虚拟机）上，报告微服务运行在两个容器上。多个业务部门启动了年度报告，报告系统的负载飙升。`Kubernetes` 观察到这种负载增加，并部署了\
  \ 3 个额外的报告容器来处理负载。然而，你的 5 个节点已满，没有容量运行这 3 个额外的容器。没问题，`Kubernetes` 与你的云通信并启动了一个额外的节点来运行这\
  \ 3 个新容器。报告运行快速且准时，当报告微服务的需求减少时，`Kubernetes` 也会终止额外的 3 个报告容器以及额外的节点。\n\n从这个示例中理解几点是非常重要的：\n\
  \n向上扩展和向下扩展是自动的。这是因为 `Kubernetes` 在不断观察应用程序的关键性能指标。当它看到某些情况（例如负载增加或响应时间变长）时，它会扩展应用程序和基础设施来应对。它在需求下降时也会缩小规模。后者对于控制成本非常重要，特别是在按需付费的公有环境中。\n\
  \n微服务架构对于这种行为至关重要，因为它们允许 `Kubernetes` 只扩展那些所需的微服务。\n\n最后，到为止描述的扩展类型被称为`水平扩展`（horizontal\
  \ scaling）。从高层面上说，水平扩展是为你已有的某些东西添加更多实例。相反是`垂直扩展`（vertical scaling），它尝试增加你已有东西的大小。以下非技术示例可能有所帮助。\n\
  \n假设你经营着一家提供服务的业务，你目前有一辆小配送车。随着业务增长，你需要增加进行更多配送的能力。你可以通过增加 2 辆额外的小配送车来水平扩展你的配送能力。或者，你可以通过卖掉小配送车并将其替换为一辆更大的车来垂直扩展。\n\
  \n回到年度报告的类比。如果一个小型报告容器无法处理年度需求，你可以通过添加更多相同的小型容器来水平扩展它。或者，你可以通过将小型报告容器替换为单个更大的容器来垂直扩展。支持它的基础设施也可以这样做——你可以通过添加多个小节点来水平扩展，或者通过添加一个巨大的巨大的节点来垂直扩展。\n\
  \n通常来说，`Kubernetes` 和云原生模式更偏好水平扩展。\n\n`Kubernetes` 具有以下自动伸缩器。\n\n\n\n\n\n# 水平 Pod\
  \ 扩缩器 (HPA)\n# 集群自动扩缩器 (CA)\n\n水平 Pod 扩缩器在需求增加时添加更多 `pods`，需求减少时移除它们。集群自动扩缩器与你的公有云集成，并根据需求添加或移除\
  \ `nodes`。\n\n对于这两种自动扩缩器，配置上限和下限至关重要。例如，你可以配置 `Kubernetes` 将一个节点池限制为最多 20 个节点。这可以帮助你控制成本，并降低失控进程或恶意攻击导致节点池过大的风险。请记住，在云端\
  \ `nodes` 是需要花钱的。\n\n总之，应用程序和基础设施应该能够根据指标自动扩展。微服务架构使得选择性地扩展应用程序中需要的部分成为可能。`Kubernetes`\
  \ 有一个水平 Pod 扩缩器，可以扩展应用程序微服务以满足需求。它还有一个集群自动扩缩器，可以扩展云基础设施以满足需求。\n\n最后，重要的是要理解扩展是一个不断在性能与成本之间寻求平衡的过程——在提供良好用户体验的同时，避免消耗和支付过多的基础设施。\n\
  \n### 无服务器 (Serverless)\n\n从高层次来说，无服务器是一种事件驱动的计算模型，你编写短小的函数，这些函数在事件触发它们时执行。这里有很多术语，我们稍后会解释，不过在进入细节之前，我们需要解决几点问题。\n\
  \n1. `serverless`（无服务器）和 `Function as a Service (FaaS)` 指的是同一事物\n2. 无服务器使用了服务器\n\
  \n第 2 点提出了显而易见的问题：如果无服务器使用了服务器，为什么我们还称之为无服务器呢？\n\n答案很简单，服务器被隐藏得非常好，以至于我们**永远**不需要考虑它们。这样想……在云计算出现之前，我们花费了大量的时间和精力处理服务器。我们必须购买它们、上架并堆叠、支付维护合同，甚至在它们故障或变得太旧、太慢时更换它们。云的出现带走了**大部分**的服务器工作。最后，无服务器的出现带走了**所有**服务器工作。因此，在无服务器模型中，开发者可以完全专注于编写代码，而无服务器平台则负责\
  \ care 所有的计算和存储需求。\n\n### 无服务器是事件驱动的\n\n事件驱动元素是无服务器模型的核心。考虑以下无服务器工作流。\n\n1. 开发者编写代码\n\
  2. 代码被封装为容器镜像\n3. 代码被上传到无服务器平台\n4. 代码与某个事件关联\n5. 事件发生，代码运行\n\n在这种模型中，代码被上传到无服务器平台，在关联的事件发生之前永远不会执行。如果事件从未发生，代码就永远不会运行。如果事件频繁发生，代码就会运行频繁。这对于全托管云平台具有财务上的影响，因为你只在代码运行时才付费。运行频繁的代码会比运行较少的代码花费更多费用。此外，尽管许多无服务器平台宣称的价格看似很低，但执行频繁的代码可能会花费大量资金。\n\
  \n列表中的另外几点。\n\n大多数现代编程语言都适用于无服务器，然而，你应该根据微服务设计模式来设计和编写无服务器函数——即小小的、专门的、执行单一定义任务的函数。\n\
  \n将无服务器函数封装为容器也很常见，因为它们很小、轻量级，且与微服务架构完美契合。然而，并非所有无服务器平台都支持容器。\n\n### 无服务器平台\n\n\
  许多公有云提供自己的专有无服务器平台。这些平台通常易于使用，并采用灵活的按需付费定价模型。然而，它们通常是专有的，并且缺乏治理和标准。流行的云端无服务器平台包括：\n\
  \n* `AWS Lambda`\n* `AWS Fargate`\n* `Azure Functions`\n* `Google Cloud Functions`\n\
  \n支持 `Kubernetes` 的流行开源无服务器平台包括：\n\n* `Knative`（读音为“kay native”）\n* `OpenFaaS`（读音为“open\
  \ faz”）\n\n写作时，无服务器生态系统缺乏强有治理和标准。然而，`CloudEvents` 项目旨在解决这一问题。它目前是一个孵化中的 `CNCF` 项目。\n\
  \n### 无服务器与扩缩\n\n扩展是大多数无服务器平台不可或缺的一部分——平台会启动执行你的函数所需的容器和基础设施，并在完成后自动释放它们。如果一个函数在每分钟内执行了一百万次，平台就会启动所需的容器和基础设施并向你发送账单。在你的函数完成时，它也会释放它们。因此，扩展只是无服务器工作方式的一部分。\n\
  \n总之，无服务器通常被称为`函数即服务 (FaaS)`，是一种事件驱动的计算模型，你将小函数上传到无服务器平台并将其与事件关联。当这些事件发生时，函数就会执行。在后台，许多无服务器平台在短寿命容器内部执行函数。扩展是无服务器的原生特性，许多云都有自己的专有无服务器平台，采用按需付费的定价模型——你只需为函数的每次每次执行付费。然而，专有的无服务器平台缺乏开放标准，并增加了你的被锁定风险。\n\
  \n最后，当无服务器首次进入市场时，有许多推测认为它可能会成为现代应用程序的主流模型。然而，热度已经消退，现在很清楚的是，无服务器将与容器和虚拟机共同塑造云计算的未来。\n\
  \n### 社区与治理\n\n大多数云原生技术（包括 `Kubernetes`）都是开源的。这使得它们能够接触一个大型且充满激情的社区来开发和支持它们。然而，需要强有力的治理来提供方向和秩序。\n\
  \n为了满足这一需求，`云原生基金会 (CNCF)` 于 2015 年成立。它定义了项目在走向“毕业”的过程中必须经过的三个成熟阶段。这些阶段是：\n\n1.\
  \ `Sandbox`（沙箱）\n2. `Incubating`（孵化中）\n3. `Graduated`（已毕业）\n\n这个三步流程有助于项目成熟，并最终作为能够为社区带来价值的项目项目毕业。`Kubernetes`\
  \ 是第一个 `CNCF` 项目，并于 2018 年毕业。此后，已有 15 多个其他项目毕业，有 100 多个项目处于沙箱或孵化阶段。\n\n项目如果想通过这些阶段，必须向\
  \ `CNCF 技术监督委员会 (TOC)` 证明它们的成熟度。每个阶段都有自己一套的要求，但以下是毕业要求的示例：\n\n* 证明项目正被真实用户使用\n*\
  \ 有来自至少两个组织的人员贡献项目\n* 完成独立的第三方安全审计并发布结果\n* 获得核心基础设施最佳实践徽章\n\n还有其他标准，但这些展示了 `CNCF`\
  \ 提供的治理类型——一切都在推动项目向成熟和良好实践发展。然而，`CNCF` 的治理尽可能轻量化和少干预，以便项目学会自我治理。\n\n### 角色与画像\n\
  \n云原生不仅关乎你使用的技术。它还关乎创建合作文化和合适的工作环境。这很大程度上取决于拥有获得高级管理层完全支持的正确角色和职位名称。\n\n以下是你在现实世界中常见的云原生工作角色和画像。你将在考试中接受这些内容的测试。\n\
  \n### 云架构师 (Cloud Architect)\n\n\n\n\n\n云架构师的一项主要职责是为业务和应用程序选择合适的云平台。这可能包括公有云、私有云和混合云的组合。\n\
  \n云架构师还负责设计云原生的基础设施和应用程序——即具备韧性、可扩展性、可观测性、自动化等特性。\n\n对于这一角色，意识到成本以及资本支出（`capex`）与运营支出（`opex`）之间的差异至关重要。\n\
  \n公有云通常是 `ope` 成本，你按需付费的方式租赁基础设施。本地部署和私有云通常是 `capex` 成本，你需要预付大额资金来采购和拥有基础设施。\n\n\
  ### DevOps 工程师\n\n如其名所示，“DevOps”工程师兼具开发和运维的技能。这意味着他们具有某些编程语言的经验，同时也具有监控、日志和部署等运维工具的经验。DevOps\
  \ 工程师作为 80% 的开发人员加 20% 的运维人员是很常见的现象。\n\n此外，还对 DevOps 工程师有以下要求：\n\n1. 理解整个应用及其应用生命周期\n\
  2. 熟练使用正确的工具\n3. 拥有一种不畏惧变化或失败的意愿心态\n\nDevOps 工具包括持续集成、持续开发（`CI/CD`）以及自动化应用程序开发、测试和部署的\
  \ GitOps 工具。DevOps 思态意味着不害怕尝试新事物，也不害怕失败。\n\n创建 DevOps 角色的一个主要原因是为了打破开发团队和运维团队之间经常存在的隔阂——他们经常互相斗争，这对于业务或客户来说都不是好事。这就是为什么最优秀的\
  \ DevOps 工程师都拥有这两个领域的经验，并愿意从这两个视角来看待问题。\n\nDevOps 工程师还必须足够自信，推动团队和组织向云原生文化转型，在这种文化中，变化是新的常态。\n\
  \n### CloudOps 工程师\n\n这是一个较新的角色，与 DevOps 类似，但在云基础设施和工具方面的侧重点稍为窄。CloudOps 工程师可能完全专注于公有云技术，而\
  \ DevOps 工程师则需要更广泛的技能来管理本地基础设施和应用。\n\n### 安全工程师\n\n安全工程师必须理解云原生基础设施和应用程序，以及适特定的威胁向量。这些威胁与仅运行在本地数据中心上的传统单体应用有大不相同。\n\
  \n一个简单的例子是，微服务应用程序对通过 IP 网络共享数据的依赖程度增加。在过去，单体应用在单个二进制文件中实现所有功能和特性，并作为一个单一大型应用程序部署在单个物理或虚拟服务器上。这意味着所有应用内部的通信都是通过物理服务器上的安全本地通道进行的。微服务模型将每个应用程序功能拆分为自己的自己的小型应用，并将它们分布在多个服务器上。这意味着所有应用内部通信现在必须穿越\
  \ IP 网络，并引入了全新的威胁向量。\n\n另一个简单的例子是大多数容器平台实现的共享内核模型。在这种情况下，每个容器都共享其运行所在主机的操作系统内核。如果主机被攻破，运行在该主机上的每个容器也会被攻破。这与没有共享内核的虚拟机模型相比，引入了完全不同的威胁。\n\
  \n从文化的角度来看，安全工程师必须融入到其他团队中，以确保安全是应用程序和基础设施设计、开发和部署的每一步中的优先事项。他们必须确保安全始终在议程之上，而绝不是事后才。\n\
  \n### DevSecOps 工程师\n\nDevSecOps 工程师是具备安全技能和“安全优先”心态的 DevOps 工程师。\n\n许多人认为这与 DevOps\
  \ 工程师相同，因为许多组织现在期望其 DevOps 工程师理解安全的重要性，具备安全技能，并拥有安全优先的心态。这一角色通常被认为是确保安全成为每次讨论内容、成为设计、开发和部署的每一步内容的最佳方式之一。\n\
  \n你可能会听到安全“左移”（`left-shift`）术语。这是将安全移动到开发过程的最开始（一直到工作流的最左侧）。DevSecOps 工程师可以实现这一点。\n\
  \n### 数据工程师\n\n数据是许多组织的生命线——如果你丢失了它或它被损坏，整个组织都可能破闭。\n\n数据工程师的角色是确保数据得到适当的存储和保护，并确保在需要时始终可用。这包括数据本地化（将数据存储在合适的地方）、性能、可用性和保护。它还涉及分析数据工具的知识和经验。\n\
  \n### 全栈开发人员\n\n全栈开发人员是一种多才的开发者，他们理解并能够编写系统的前端（客户端）和后端（服务端）组件。他们需要多种编程语言的实战经验，以及云平台和数据存储等基础设施组件的经验。\n\
  \n一个典型的全栈开发人员将精通至少两种编程语言，掌握至少一种云平台及其工具的技能，并具有至少一种数据存储或数据库技术的经验。这些后端数据存储技术通常是开源的。\n\
  \n全栈开发人员被认为具有高生产力，因为得益于广泛的技能，他们可以做出快速决策并“搞定事情”。一个全栈开发人员几乎比集结整个团队更快、更灵活——全栈开发人员自己就能完成工作。\n\
  \n### 站点可靠性工程师 (SRE)\n\n站点可靠性工程师（`SRE`）的主要角色是创建、维护和优化云原生系统。它有时被认为是 DevOps 工程师 2.0，但通常比\
  \ DevOps 工程师更关注运维。例如，一个典型的 SRE 可能是 20% 的开发人员，80% 的运维人员。\n\n和 DevOps 工程师一样，SRE 拥有持续变化和优化的心态。然而，它通过关注关键的站点可靠性指标，如服务水平目标（`SLO`）、错误预算、服务水平指标（`SLI`）和服务水平协议（`SLA`），这超越了简单的\
  \ DevOps 工程师。\n\n人们常说，SRE 的目标是通过自动化来让自己失业。\n\n### 开放标准\n\n开放标准在云原生领域非常重要。它们帮助用户避免供应商锁定和产品锁定，并让开发者相信他们构建的产品能够与更广泛的生态系统良好工作和集成。\n\
  \n一个常见的非技术例子是火车和轨道。世界上大多数轨道具有相同的尺寸和配置（1435 毫米标准轨）。这意味着服务提供商今天从一个供应商那里购买火车，明天切换到另一家，并完全相信这两个供应商的火车都能在同一轨道上运行。这也让火车制造商充满信心，他们制造的火车可以在全球范围范围内运行。最终的结果是信心，而信心推动进步。\n\
  \n开放容器计划（`OCI`）为云原生生态系统提供了以下重要标准。\n\n* `Image spec`\n\n* `Runtime spec`\n\n* `Distribution\
  \ spec`\n\n\n\n\n\n`image-spec` 定义了构建和打包容器镜像的标准，`runtime-spec` 标准化了容器执行环境和容器周期，而\
  \ `distribution-spec` 标准化了通过注册表的内容分发。当它们结合在一起时，它们就像铁轨的标准化，为开发者和用户提供了构建强大生态系统所需的信心。请考虑以下示例。\n\
  \n`image-spec` 让开发者和初创公司有信心创建自己的构建工具，以创建 `OCI` 容器镜像。在 OCI `image-spec` 出现之前，每个人都使用\
  \ Docker 工具和 `docker build` 命令来构建容器镜像。现在有很多工具可以选择。\n\n`runtime-spec` 让开发者和初创公司有信心创建自己的容器运行时，因为他们知道这些运行时可以与其他工具协作，并安全地运行基于\
  \ OCI `image-spec` 创建的镜像。在 OCI `runtime-spec` 之前，每个人都使用 Docker 和 `docker run` 命令来运行容器。现在有许多容器运行时和\
  \ CLI 工具供选择。\n\n最后，`distribution-spec` 让开发者和初创公司建立了构建自己的容器注册表的信心。同样，Docker Hub 最初是唯一的容器注册表。现在有很多供选择。\n\
  \n考虑以下一个由 OCI 标准实现的真实世界成功案例。Kubernetes 最初使用 Docker 作为其容器运行时（启动和停止容器的低级工具）。随着时间的推移，Docker\
  \ 变得太大，对于 Kubernetes 的需求来说已经过载了。因此，Kubernetes 将运行时层变为可插拔，以便用户可以根据需求选择最佳的容器运行时。最棒的部分是……只要新的容器运行时支持\
  \ `OCI` 镜像（几乎所有的运行时都是如此），一切就能继续运行，而无需对现有容器镜像进行任何更改。\n\n如果不存在 OCI 镜像规范，用户和项目将缺乏进行此类更改的信心，因为互操作性问题的风险太高了。\n\
  \nOCI 在 Linux 基金会的框架下运行，由来自主要云原生和专注于容器公司的志愿者组成。它的目标是为低级容器相关技术提供轻量级的治理和标准。\n\n对 Kubernetes\
  \ 生态系统起关键作用的其他标准还包括：\n\n* 容器运行时接口 (`CRI`)\n* 容器网络接口 (`CNI`)\n* 容器存储接口 (`CSI`)\n\
  * 服务网格接口 (`SMI`)\n\n这些标准对于标准化 Kubernetes 的重要低级组件起着至关重要的作用，使生态系统伙伴能够开发产品并确它们将按预期工作。它还创建了可切换的环境和工具，防止了供应商和产品锁定。你将在本书的后续部分学习其中的每一个项。\n\
  \n## 章节总结\n\n在本章中，你学习了成为`云原生`不仅仅是将你的应用程序运行在公云上。事实上，云原生是技术和行为的结合。技术包括 Kubernetes\
  \ 等平台，以及作为容器和无服务器函数运行的微服务应用程序。行为包括开放变化的心态，以及一种开放快速行动并对正确的人和技术进行投资的文化。开放标准也是带来强大工具生态系统所需的稳定性和信心的关键。\n\
  \n## 考试要点\n\n### 自动伸放\n\n`Autoscaling` 是应用程序和基础设施自动扩展缩小以满足需求的能力。当需求增加时，可以动态向环境中添加更多应用程序实例和基础设施。当需求下降时，可以移除应用程序实例和基础设施。Kubernetes\
  \ 有一个水平 Pod 自动伸放器，用于添加和移除应用程序实例以满足需求。它还有一个集群自动伸放器，可以与云平台集成，添加和移除节点以满足基础设施需求。使用指标（Metrics）来做出缩放决策。基础指标包括\
  \ CPU 和内存，而自定义应用程序指标包括队列长度和请求响应时间等内容。\n\n### 无服务器 (Serverless)\n\n`Serverless` 是一种现代的事件驱动计算模型，小型函数与特定事件关联，并仅在这些事件发生时执行。有时我们称为函数即服务\
  \ (`FaaS`)，许多公共云提供专有的无服务器平台，你可以在平台上上传函数，将其与事件关联，并仅为函数执行的时间付费。开源无服务器平台包括 `OpenFaaS`\
  \ 和 `Knative`。\n\n### 社区与治理\n\n云原生社区是一个大型且蓬勃的开源社区，积极开发和维护如 Kubernetes 等重要的云原生技术。虽然这些社区非常棒，但项目需要强大的治理来保持社区的专注并引导项目朝着正确的方向发展。云原生生态系统中主要的治理来源是云原生计算基金会\
  \ (`CNCF`)。它成立于 2015 年，定义了项目成熟的三个阶段：沙箱（sandbox）、孵化（incubating）和毕业（graduated）。项目必须证明自己的成熟度以通过这些阶段，每个阶段都旨在引导项目向进一步成熟的方向迈进。Kubernetes\
  \ 以及其他 15 多个项目已经从 `CNCF` 毕业。\n\n### 角色与画像\n\n走向云原生的重要一步是将正确的人招聘到正确的位置上。人们需要具有强大的开放心态，不要害怕尝试新事物以及偶尔失败。希望这些失败发生在测试和开发环境中，但人们开放尝试许多新事物并在过程中失败是至关重要的。除了聘用正确的人外，他们必须在高级管理层的全力支持下被招聘到正确的位置上。例如，`DevOps\
  \ 工程师` 需要获得自由并授权实施 DevOps 实践并使用 DevOps 工具。如果你的公司文化和高级管理层不允许他们履行职责，那么聘用正确的人并给他们 `DevOps\
  \ 工程师` 的头衔是没有意义的。\n\n### 开放标准\n\n`Open 标准` 在两个非常重要的领域至关重要。它们让开发者有信心认为他们构建的产品将按预期工作并与其他工具良好集成。它们还通过鼓励具有大量选择的生态系统来防止技术锁定。开放容器倡议\
  \ (`OCI`) 创建了三个容器相关标准，帮助了容器生态系统的增长。由于 `OCI`，容器运行时、镜像构建工具和注册表都有许多选择。\n\n## 复习题\n\n\
