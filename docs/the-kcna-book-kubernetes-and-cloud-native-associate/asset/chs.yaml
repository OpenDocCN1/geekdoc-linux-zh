  \n恭喜。你已经完成了模拟考试。如果你已经完成了这本书，并且在模拟考试中得分超过 75%，你就应该准备好参加 KCNA 考试了。\n\n要获得 75% 或以上的分数，你需要正确回答\
  \ 45 个或更多问题。\n\n# 附录 A：章节答案\n\n本附录列出了所有章节测试的答案。样例测试答案请参见附录 B。\n\n## 第 1 章：背景\n\n\
  问题 1，答案 A, B, D\n\n答案 C **不是**确定的，因为容器的安全性**低于**虚拟机。这是由于共享内核模型导致的。\n\n问题 2，答案 B\n\
  \n每台虚拟机都有自己的内核，因此安全性比容器高。然而，这使得它们体积更大、启动更慢，并且不适合微服务架构。\n\n问题 3，答案 D\n\n每个容器都是一个虚拟操作系统，拥有自己的根文件系统、自己的进程树和自己的\
  \ `eth0` 网络接口。\n\n问题 4，答案 A, D\n\n容器虚拟化了如进程树和文件系统等操作系统构建结构。它们没有虚拟化 CPU 和硬硬盘等硬件构建结构。\n\
  \n问题 5，答案 A\n\n所有容器都共享其运行的主机操作系统和内核。这使得它们比虚拟机小，意味着你可以在主机上运行比虚拟机多多的容器。\n\n问题 6，答案\
  \ D\n\n容器共享宿主机的内核，这意味着单个被攻破的容器可能会危及所有其他容器。主机内核被攻破也会危及主机上的所有容器。\n\n问题 7，答案 A, B\n\
  \n容器镜像包含了应用程序源代码和所有依赖项。\n\n问题 8，答案 B\n\n单体应用程序将所有功能编码到一个程序中。\n\n问题 9，答案 B, C\n\n\
  单体应用程序将所有功能编码到一个程序中。这意味着更新一个功能需要停止整个应用程序并进行更新。它还意味着应用程序的每个功能都与其他每个功能同步扩展——一切都是非常紧密耦合的。\n\
  \n问题 10，答案 A, C, D\n\n微服务应用程序将每个应用程序功能都编码为自己的微型、独立的、单一用途微服务。它们之间都是松耦合的。这意味着每个功能都可以有自己的小开发团队，并且可以在不影响其他功能的情况下进行扩展和打补丁。\n\
  \n问题 11，答案 C, D\n\n许多小型且松耦合的微服务的分布式特性意味着会有大量的网络流量，且这些流量更具动态性。\n\n## 第 2 章：云原生架构\n\
  \n问题 1，答案 B\n\n韧性是应用程序和基础设施自愈的能力。\n\n问题 2，答案 C\n\n应用程序和基础设施都可以具有韧性。Kubernetes 实现了控制器（如部署控制器）来提高程序的韧性。许多云平台允许你构建具有韧性的节点池。\n\
  \n问题 3，答案 A\n\n故障总会发生。考虑到故障进行设计可以允许应用程序在故障发生时继续工作。\n\n问题 4，答案 C\n\n松耦合意味着不同组件之间不相互依赖，当其他组件故障时，受到的影响较小。\n\
  \n问题 5，答案 D\n\n调解（Reconciliation）是将观测状态与期望状态同步的过程。\n\n问题 6，答案 A\n\n`/healthz` 是应用程序健康检查和探测的常用端点。\n\
  \n问题 7，答案 D\n\n健康检查是测试应用程序按预期运行的良好方法。\n\n问题 8，答案 A\n\n期望状态是意图记录——你想要的东西。\n\n问题 9，答案\
  \ B, C, D\n\n自动伸缩是应用程序和基础设施在没有人工干预的情况下进行扩展和缩小的能力。\n\n问题 10，答案 A\n\n云基础设施的运行是有成本的。如果你运行了没有使用的基础设施，你仍然需要为此付费。\n\
  \n问题 11，答案 C\n\n应用程序的单个微服务可以扩展和缩小，而不影响其他微服务。“A”并不是微服务的优势，因为单体应用程序也可以扩展和缩小。\n\n问题\
  \ 12，答案 A\n\n水平扩展是添加和移除你已经拥有的某些实例。例如，Kubernetes 水平 Pod 自动伸缩器（HPA）添加或移除更多 Pod 实例。Kubernetes\
  \ 集群自动伸缩器添加或移除更多特定类型的节点实例。\n\n问题 13，答案 B\n\n云原生应用偏好水平扩展，有时被称为向外扩展（scaling out）。\n\
  \n问题 14，答案 A, D\n\nKubernetes 实现了水平 Pod 自动伸缩器 (HPA) 来扩展应用程序，并实现了集群自动伸缩器 (CA) 来扩展集群节点。\n\
  \n问题 15，答案 B, C\n\n无服务器（Serverless）是一种仍然使用服务器的事件驱动计算模型。这些服务器被高度抽象化并对开发者隐藏了，以至于我们称之为“无服务器”。\n\
  \n问题 16，答案 D\n\n许多无服务器平台允许你上传以容器镜像封装的函数。\n\n问题 17，答案 A\n\n无服务器函数是遵循微服务设计模式的小型、单一用途负载。\n\
  \n问题 18，答案 A, C\n\n容器很小，非常适合微服务应用程序，使它们成为无服务器负载的理想选择。\n\n问题 19，答案 A\n\n许多无服务器平台会在每次执行无服务器函数时收取费用。\n\
  \n问题 20，答案 B\n\nCloudEvents 正在尝试为无服务器生态系统带来标准。\n\n问题 21，答案 C\n\n无服务器函数在关联事件发生时自动启动，并在完成后退出。这是一种原生的扩展形式。\n\
  \n问题 22，答案 B\n\n无服务器负载在事件触发它们时运行小型函数。这通常被称为函数即服务 (FaaS)。\n\n问题 23，答案 D\n\nCNCF 于\
  \ 2015 年在 Linux 会的框架下成立，旨在为新型开源容器技术带来治理和方向。该基金成立于 2000 年。\n\n问题 24，答案 A, B, D\n\n\
  项目以“沙盒”（sandbox）项目的身份进入 CNCF，通过“孵化”（incubating）阶段，并最终毕业。\n\n问题 25，答案 A, B, C\n\n\
  CNCF 项目不需要至少两家供应商的资金支持。\n\n问题 26，答案 A, C\n\n大多数云平台运行按需付费模式，大多数组织将其归类为运营支出（opex）。\n\
  \n问题 27，答案 C, D\n\nDevOps 工程师被理解整个应用程序及其整个生命周期。他们还被具有开发者和运维者的经验。通常，开发者/运维者的比例大约在\
  \ 80/20 左右。\n\n问题 28，答案 D\n\nCloudOps 与 DevOps 非常相似，但几乎完全专注于云端技术和技能。例如，DevOps 工程师可能掌握一或两种开源键值存储技术（NoSQL），这些技术可以在本地或在云端使用，而\
  \ CloudOps 工程师可能掌握特定云的键值存储技术。\n\n问题 29，答案 A\n\n持续集成、持续交付（CI/CD）工具是核心 DevOps 工具。\n\
  \n问题 30，答案 C\n\n全栈开发者是拥有多种技能并高效完成任务的人。\n\n问题 31，答案 A\n\n人们常说 SRE 应该通过自动化让自己失业。\n\
  \n问题 32，答案 B, C\n\n云原生世界中的开放标准就像制造和工程世界中的标准化铁轨——它们实现了互互操作的解决方案，有助于避免供应商锁定，并让开发者相信他们构建的解决方案能够良好地运行和集成。\n\
  \n问题 33，答案 A, B, C\n\n开放容器组织 (OCI) 负责底层容器相关的标准，并目前维护镜像规范、运行时规范和分发规范。\n\n问题 34，答案\
  \ A, B, C, D\n\n\n\n\n云原生应用应该具有弹性，能够提供高质量的遥测以实现高可观测性，并能够自动伸缩。扩展和自愈等操作应该在无需人工参与的情况下完成。\n\
  \n## 第 3 章：容器编排\n\n问题 1，答案 A, D\n\n容器与虚拟机相似。然而，它们共享主机的内核，使得它们比虚拟机更轻量。你通常每个容器运行一个小型单一应用程序。\n\
  \n问题 2，答案 A\n\n容器比虚拟机和物理机小、更轻量。这意味着如果你使用容器就可以运行更多的应用程序。\n\n问题 3，答案 A\n\n容器比虚拟机小、更轻量，更容易打包和共享。容器还封装了应用程序源代码和所有依赖，这意味着它们在生产环境中的运行方式与在开发者笔记本电脑上相同——这使得它们更便于共享。\n\
  \n问题 4，答案 B\n\n`Kubernetes` 和容器并不关心你的应用程序是用什么语言编写的。\n\n问题 5，答案 D\n\n容器镜像包含了应用程序代码和所有依赖。\n\
  \n问题 6，答案 C\n\n由于容器包含了应用程序代码和所有依赖，这意味着任何在开发者笔记本电脑上运行的程序，在生产环境中也应该可以运行。这是因为应用程序不依赖外部依赖（例如共享库文件），这些文件在开发者笔记本电脑和生产环境中的版本可能不同。\n\
  \n问题 7，答案 B\n\n容器运行时是一类启动和停止容器的低级软件。\n\n问题 8，答案 A, C, D\n\n容器运行时从仓库下载容器镜像并启动和停止容器。更高层次的决策（例如选择容器应该运行在哪个节点上）由\
  \ `Kubernetes` 等更高层级的工具做出。\n\n问题 9，答案 B\n\n`OCI` 定义了低级容器标准，例如 `image-spec`、`runtime-spec`\
  \ 和 `distribution-spec`。\n\n问题 10，答案 B\n\n`OCI` 镜像是根据 `OCI image-spec` 构建的容器镜像。\n\
  \n问题 11，答案 D\n\n`Docker` 构建符合 `OCI image-spec` 的镜像。\n\n问题 12，答案 A, B, D\n\n命名空间容器是最流行的，并在共享内核模型运行。沙箱容器在容器和主机内核之间插入了一个代理层。虚拟化容器在它自己的轻量级虚拟机中运行每个容器。\n\
  \n问题 13，答案 B, C, D\n\n`Docker`、`CRI-O` 和 `containerd` 都创建命名空间容器。`Kata containers`\
  \ 创建虚拟化容器。\n\n问题 14，答案 D\n\n`Kubernetes` 无法创建容器。它必须使用容器运行时来实现此。`Kubernetes` 处理调度和伸缩等高层操作。\n\
  \n问题 15，答案 A\n\n绝大多数现代 `Kubernetes` 集群默认使用 `containerd` 作为它们的容器运行时。\n\n问题 16，答案\
  \ B\n\n容器运行时接口 (`CRI`) 是 `Kubernetes` 实现的低级技术，用于使容器运行时层可插拔。\n\n问题 17，答案 A\n\n`OCI`\
  \ 负责低级容器相关标准。`CRI` 使 `Kubernetes` 容器运行时层可插拔。\n\n问题 18，答案 A, B, D\n\n容器编排器（如 `Kubernetes`）可以对容器进行调度、伸缩和自愈。构建工具负责创建容器镜像。\n\
  \n问题 19，答案 C\n\n`Kubernetes` 是行业标准的容器编排器，也是目前为止最流行的。\n\n问题 20，答案 C\n\n`Kubernetes`\
  \ 集群由工作节点组成。\n\n问题 21，答案 A, B, D\n\n`Kubernetes` 集群是之一。\n\n问题 22，答案 B\n\n用户命名空间是一类。\n\
  \n问题 23，答案 D\n\n云原生安全的四个 C。\n\n问题 24，答案 A, B, C\n\n`Kubernetes` 是 less..\n\n 25,,\
  \ answer\n\n`-west`` is to..\n\n  26,,,,,,,\n\n````,,,,,.,   ,,,,,,,,,,,,,,,,,,\n\
  \n is is is...\n\n  9,,,\n\n-- traffic is is between containers.\n\n问题 30，答案 B\n\
  \n`Istio` 和 `Linkerd` 是服务网格。\n\n问题 31,, B,,\n\n`````` is is is......\n\n问题 32，答案\
  \ B\n\n容器存储接口 (`CSI`) 是 `Kubernetes` 实现的低级技术，用于使存储层可插拔。\n\n问题 33，答案 A, B\n\n`Seccomp`、`SELinux`\
  \ 和 `AppArmor` 允许你保护容器安全。\n\n## 第 4 章：Kubernetes 基础\n\n问题 1，答案 D\n\n`Kubernetes`\
  \ 发布于 2014 年。\n\n问题 2，答案 A, B, D\n\n`Kubernetes` 是一个容器编排器，可以为容器应用添加自愈、自动伸缩和零停机滚动更新。镜像扫描通常由仓库或\
  \ CI/CD 流水线提供。\n\n问题 3，答案 A, B, D\n\n`Kubernetes` 原生编排容器。`KubeVirt` 扩展使其能够编排虚拟机，而\
  \ `OpenFaaS` 和 `Knative` 扩展它使其能够编排无服务器函数。\n\n问题 4，答案 B\n\n`KubeVirt` 使 Kubernetes\
  \ 能够管理 pod 内部虚拟机负载。`Knative` 和 `OpenFaaS` 用于无服务器，而 `Cilium` 是一个网络插件。\n\n问题 5，答案\
  \ A, D\n\n`OpenFaaS` 和 `Knative` 扩展了 Kubernetes 用于无服务器函数负载编排。`Cilium` 是网络插件，`KubeVirt`\
  \ 允许在 Kubernetes 上运行虚拟机。\n\n问题 6，答案 B\n\n`Linkerd` 提供服务网格功能。`Kubernetes` 是容器编排器，`Prometheus`\
  \ 是监控工具。\n\n问题 7，答案 D\n\n`Kubernetes` pod 是对一个或多个容器的薄层封装，如果容器想在 `Kubernetes` 上运行，这是强制性的。\n\
  \n问题 8，答案 D\n\n容器只有在封装在 pod 中才能在 `Kubernetes` 上运行。\n\n问题 9，答案 A, B, C\n\n\n\n\n\
  Pods 允许多个容器被共同调度到同一个节点，并共享相同的执行环境（内存和卷）。同一个 pod 中的容器不共享相同的容器镜像，因为它们应该是不同的、互补的容器。例如，一个运行\
  \ `NGINX` 镜像的 Web 容器和一个运行 `Git` 同步镜像的辅助容器。\n\n### 问题 10，答案 A, B, D\n这与上一个问题相似。同一个\
  \ pod 中的所有容器运行在同一个节点上，并共享对相同卷和网络栈的访问。它们不会共享相同的容器镜像。\n\n### 问题 11，答案 B, C\nKubernetes\
  \ 集群由控制平面节点和工作节点组成。\n\n### 问题 12，答案 B, D\n`API server` 和调度器运行在 Kubernetes 控制平面上。`kubectl`\
  \ 是 Kubernetes 的命令行工具，你通常将其安装在笔记本电脑或管理员工作站上。`kube-proxy` 处理节点级网络，虽然它在技术上也运行在控制平面和工作节点上，但它不被视为控制平面的一部分。\n\
  \n### 问题 13，答案 C\n为了高可用性，所有控制平面服务都运行在所有控制平面节点上。\n\n### 问题 14，答案 C\n你应该始终部署奇数个控制平面节点。3\
  \ 是最常见的，但 5 也很常见。\n\n### 问题 15，答案 D\n`kubectl` 是 Kubernetes 的命令行工具。\n\n### 问题 16，答案\
  \ B\n集群存储（cluster store）是唯一的有状态控制平面服务，通常基于 `etcd` 分布式数据库。\n\n### 问题 17，答案 A\n如果控制平面崩溃，现有应用程序将继续运行。但在控制平面恢复之前，你将无法管理它们或部署更多应用。\n\
  \n### 问题 18，答案 D\n`kubectl` 将所有请求发送给 `API server`。\n\n### 问题 19，答案 B\nKubernetes\
  \ 控制器作为调谐循环运行，确保观测状态与期望状态同步。\n\n### 问题 20，答案 D\n`deployment` 控制器管理 Kubernetes 上的无状态负载。\n\
  \n### 问题 21，答案 C\n`statefulset` 控制器管理 Kubernetes 上的有状态负载。\n\n### 问题 22，答案 A\n`daemonset`\
  \ 控制器确保集群中的每个工作节点都运行一个 pod 实例。\n\n### 问题 23，答案 C, D\n`Current state`（当前状态）和 `actual\
  \ state`（实际状态）与 `observed state`（观测状态）意思相同。\n\n### 问题 24，答案 C\n调谐（Reconciliation）是将观测状态恢复到与期望状态同步的过程。\n\
  \n### 问题 25，答案 B\nKubernetes 控制器作为后台控制循环运行，将观测状态同步期望状态。\n\n### 问题 26，答案 A\n`kube-proxy`\
  \ 负责在集群节点上实现本地网络规则。\n\n### 问题 27，答案 D\n运行时接口 (`CRI`) 是使 Kubernetes 容器运行时层可选的工具。\n\
  \n### 问题 28，答案 A\n`containerd` 是现代 Kubernetes 集群中最流行的容器运行时。`Docker` 在旧集群中更流行，但在\
  \ Kubernetes `1.20` 中被弃用，并在 `1.24` 中移除。\n\n### 问题 29，答案 C\n`Docker` 在 Kubernetes\
  \ `1.20` 中被弃用，并在 `1.24` 中移除。\n\n### 问题 30，答案 C\n`kubeconfig` 文件通常被称为“config”，存储在用户配置目录下的隐藏\
  \ `.kube` 文件夹中。\n\n### 问题 31，答案 D\n`kubectl` 将返回详细信息。\n\n### 问题 32，答案 B, C\n`kubectl`\
  \ 不应该多于一个。\n\n### 问题 33，答案 A\npod 将保持在 pending（等待）状态。\n\n### 问题 34，答案 C\n使用标签（labels）可以让你跨节点分布。\n\
  \n### 问题 35，答案 D\nKubernetes 命名空间（namespaces）划分集群。每个命名空间都有自己的配额。\n\n### 问题 36，答案\
  \ B\n定义了 Kubernetes 对象。\n\n### 问题 37，答案 C\nKubernetes 每年发布三个大版本。\n\n### 问题 38，答案\
  \ A\nKubernetes 部署所有 pod。\n\n### 问题 39，答案 D\n容器网络接口 (`CNI`) 使网络层可选。\n\n### 问题 40，答案\
  \ A\n`Cilium` 使用 eBPF 进行网络。\n\n## 第 5 章：云原生交付\n\n问题 1，答案 A, C\n“Release”（发布）和“rollout”（滚动更新）都指的是应用的更新。\n\
  \n问题 2，答案 C\n持续集成 (`CI`）允许构建和测试代码。\n\n问题 3，答案 A\n持续集成 (`CI`）是识别 bug 的极方法。\n\n问题\
  \ 4，答案 A\n持续部署 (`CD`）是部署到生产环境的过程。\n\n问题 5，答案 C\nCI/CD 是 DevOps 的基石。\n\n问题 6，答案 D\n\
  `Jenkins` 是一个流行的 CI/CD 工具。`Kubernetes` 和 `Swarm` 都是容器编排器。\n\n问题 7，答案 B\n使用 CI/CD\
  \ 工具允许开发者花费更多时间进行构建。\n\n问题 8，答案 A, C, D\nGitOps 工作流将基础设施即代码、拉请求和持续交付集成在一起。\n\n问题\
  \ 9，答案 A, B, D\n基础设施即代码（IaC）定义了策略、网络和其他基于云的组件。它不能用于物理任务。\n\n问题 10，答案 B\nIaC 在本地和公云环境中均可用。但是，由于公云环境倾向于高度虚拟化，它在这些环境中工作效果更好。\n\
  \n问题 11，答案 B\nKubernetes 对象通常定义在 YAML 文件中。\n\n问题 12，答案 A\n拉请求（Pull requests）和合并（merges）用于触发\
  \ GitOps 工作流的 CD 步骤。\n\n问题 13，答案 A, B\n`ArgoCD` 和 `FluxCD` 都是流行的 GitOps 工具。\n\n\
  问题 14，答案 D\n一旦开始使用 GitOps 流程，就不应进行手动更改，因为每次 PR 合并并触发 CD 流水线时，更改都会被覆盖。\n\n问题 15，答案\
  \ D\nLinus Torvalds 创建了 GitHub 使用的 Git 版本控制系统。\n\n问题 16，答案 B\nGitOps 工具只关心部署到生产环境，而不关心构建阶段。\n\
  \n问题 17，答案 A\n在 GitOps 工作流中，所有手动更改都会在每次 PR 随后的合并中被覆盖。\n\n问题 18，答案 C\n反模式（anti-pattern）是指在执行时看起来是个好主意，但后来证明是坏主意的事。一个简单的例子是在生产环境中进行手动修复来解决问题。然而，当自动化过程启动时，该修复会被覆盖。\n\
  \n问题 19，答案 A\n`FluxCD` 以配置和使用简单而闻名。\n\n## 第 6 章：云原生观测性\n\n问题 1，答案 D\n遥测（Telemetry）是系统输出的日志数据、指标和追踪。\n\
  \n问题 2，答案 A, B, C\n遥测的三类主要数据是日志、指标和追踪。\n\n问题 3，答案 D\n`Prometheus` 以时间序列格式存储数据。\n\
  \n问题 4，答案 B\n遥测用于故障排除和调优系统性能。\n\n问题 5，答案 B\nOpenTelemetry 项目为云原生观测性提供了实例化和规范。\n\n\
  问题 6，答案 B\n日志数据是通常以文本或 JSON 格式输出的应用程序输出。\n\n问题 7，答案 C\n\n\n\n\n\n日志事件通常按照严重程度从低到高分类如下：`info`\
  \ > `warning` > `error` > `critical`。\n\n第 8 题，答案 A\n\n高详细度产生的输出比低详细度产生的输出多。\n\n\
  第 9 题，答案 C\n\n调试（Debug）级别是最详细的，旨在尽可能输出所有数据。\n\n第 10 题，答案 A, B\n\nKubernetes 通过每个节点上的代理或\
  \ sidecar 容器中的代理支持集群级日志。\n\n第 11 题，答案 B, C\n\n每个工作节点上的本地 `kubelet` 监控容器的 `stdout`\
  \ 和 `stderr` 流以获取日志，并使其通过 `kubectl logs` 命令可用。\n\n第 12 题，答案 A, B\n\n日志代理可以将日志数据转换为中心日志系统所需的格式。\n\
  \n第 13 题，答案 A\n\n云原生应用应与其环境配置解耦。这允许应用在多个环境中运行而无需更改。你可以在运行时注入环境配置数据。\n\n第 14 题，答案\
  \ A\n\n`-p` 标志返回上一个 pod/容器实例的日志。\n\n第 15 题，答案 D\n\n指标数据（Metrics）跟踪长时间的系统性能，是查看历史趋势和预测未来趋势的极佳方法。\n\
  \n第 16 题，答案 C\n\n自定义指标是为应用程序定制的指标，因此是查看应用健康和性能的最佳方式。\n\n第 17 题，答案 A\n\n追踪（Tracing）是跟踪请求在分布式系统中之间跳跃过程的艺术。\n\
  \n第 18 题，答案 C\n\nPrometheus 被认为是 Kubernetes 的行业标准监控系统。\n\n第 19 题，答案 D\n\nGrafana\
  \ 通常与 Prometheus 配合使用，提供顶级的仪表板和可视化。\n\n第 20 题，答案 B\n\nPrometheus 期望通过 HTTPS 在 `/metrics`\
  \ 端点上暴露指标。\n\n第 21 题，答案 C\n\n抓取（Scraping）是 Prometheus 用于指从从远程系统收集日志的术语。\n\n第 22\
  \ 题，答案 B\n\nPrometheus 使用拉取模型（pull model）从远程监控系统抓取日志。\n\n第 23 题，答案 A\n\nPrometheus\
  \ 以时间序列格式存储数据。\n\n第 24 题，答案 C\n\nPrometheus 为短生命周期应用提供了 `pushgateway`，这些应用可能在 Prometheus\
  \ 抓取其指标之前已终止。应用将指标推送到 `pushgateway`，Prometheus 则从那里抓取指标。\n\n第 25 题，答案 B\n\nPrometheus\
  \ 为大多数编程语言提供了客户端库，你可以使用这些库对内部应用进行插桩，以集成 Prometheus。\n\n第 26 题，答案 C\n\n如果你无法访问第三方应用的源码，将无法通过客户端库直接对它们进行插桩。在这种情况下，你可以在\
  \ sidecar 容器中运行 Prometheus 导出器（exporter），为 Prometheus 重新格式化数据。\n\n第 27 题，答案 A, B,\
  \ D\n\n在云原生环境中，选择合适的基础设施和平台、合理调整配置、并在不使用时关闭或删除它们至关重要。\n\n第 28 题，答案 B\n\n竞价实例（Spot\
  \ instances）是最便宜的云实例类型，对于非业务关键且可以轻松重建或重新部署的服务非常理想。\n\n第 29 题，答案 C\n\n预留实例（Reserved\
  \ instances）通过长期承诺来换取云基础设施的折扣价格。\n\n第 30 题，答案 B\n\n自动伸缩（Autoscaling）确保你始终有足够的基础设施根据当前需求运行应用。因此它不断对你的基础设施进行规模调整。\n\
  \n第 31 题，答案 B, C\n\n配置自动伸缩时，监控正确的指标至关重要，因为系统使用这些指标来做出伸缩决策。如果你监控了错误的指标，系统将做出错误的决策。此外，设置上限和下限以控制成本和使用也很。\n\
  \n# 附录 B：示例测试答案\n\n本附录包含示例测试的答案。\n\n第 1 题，答案 A, B, D\n\nKubernetes 的自愈功能基于在调和循环中运行的控制器，确保观测状态始终与期望状态保持同步。\n\
  \n第 2 题，答案 A, C\n\nSeccomp 和能力裁剪（Capability dropping）是与 Linux 内核相关的技术，可用于保护命名空间容器对主机内核的访问权限。\n\
  \n第 3 题，答案 C\n\nKubernetes 拥有一个内部 DNS 服务，用于服务注册和服务发现。\n\n第 4 题，答案 B, D\n\nKubernetes\
  \ 控制平面保持高性能和高可用性至关重要。\n\n第 5 题，答案 C\n\nKubernetes 集群伸缩器（`CA`）与底层云平台集成，动态添加和删除工作节点以应对需求。\n\
  \n第 6 题，答案 C\n\nJaeger 是一个用于存储和分析追踪数据的流行工具。它还是一个 CNCF 毕业项目。\n\n第 7 题，答案 A\n\n容器通常共享它们运行所在主机的内核。这意味着受攻击的容器可能会影响主机以及运行在主机上的所有其他容器。这也意味着受攻击的主机可能会影响所有容器。\n\
  \n第 8 题，答案 B\n\nDevSecOps 工程师为 DevOps 工程引入了安全优先的方法。\n\n第 9 题，答案 A, B, C, D\n\n云原生应用和基础设施具有弹性，可以自动伸缩，并提供广泛的可观测性。自愈和自动伸缩等操作在无需人工干预的情况下完成。\n\
  \n第 10 题，答案 A, B, D\n\nOCI 负责底层的容器相关规范。这些包括 `image-spec`、`runtime-spec` 和 `distribution-spec`。\n\
  \n第 11 题，答案 B\n\n服务网格（Service mesh）技术向每个应用 pod 注入 sidecar 容器，拦截网络流量并提供高级服务。\n\n\
  第 12 题，答案 B, D\n\nDocker 和 `containerd` 是容器运行时的示例。`ESXi` 是轻量级虚拟机程序，而 Kubernetes\
  \ 是云原生编排器。\n\n第 13 题，答案 B\n\n虚拟化容器通过将每个容器运行在独立的虚拟机中避免了共享内核的安全问题。\n\n第 14 题，答案 C\n\
  \nKata 容器是一种容器运行时，它为每个容器创建一个小型虚拟机。\n\n第 15 题，答案 B, D\n\n`kubectl` 版本应与你运行的 Kubernetes\
  \ 版本高一或低一。\n\n第 16 题，答案 C\n\n服务网格是 Kubernetes 环境中加密流量的一种方式。\n\n第 17 题，答案 A\n\n通常情况下，你对自己的应用代码有完全控制权，对容器较少，对集群更少，而对云几乎没有控制权。\n\
  \n第 18 题，答案 A, C\n\nKubernetes 提供内置的 IP 管理和服务注册/发现。\n\n第 19 题，答案 A, B, C\n\n服务网格在平台层提供流量加密、网络观测性和网络可靠性。\n\
  \n第 20 题，答案 D\n\nPrometheus 期望遥数据在 `/metrics` 端点可用。\n\n第 21 题，答案 B, D\n\n容器比虚拟机小且启动更快。由于它们更小，你可以在服务器上运行比虚拟机更多的容器。\n\
  \n第 22 题，答案 C\n\nKubernetes 每四个月发布一个新版本。这意味着每年有三个新版本。\n\n第 23 题，答案 D\n\n`gVisor`\
  \ 是一种容器运行时，在容器与其运行的主机内核之间实现了一个代理内核。\n\n第 24 题，答案 B\n\n你应该始终部署奇数个控制节点节点以实现高可用。3 是最常见的数量，5\
  \ 也很常见。\n\n第 25 题，答案 B, D\n\n`containerd` 运行命名空间容器，意味着同一主机上的所有容器共享同一个内核。出于许多原因这是一个安全问题，但也意味着受攻击的\
  \ root 容器可能会影响主机以及同一主机上的所有其他容器。\n\n\n\n\n在 Kubernetes 上保护竞争工作负载的唯一方法是将每个工作负载运行在自己的\
  \ Kubernetes 集群中。命名空间（Namespaces）并不是安全的负载负载边界。\n\n问题 27 ，答案 A\n\nPod 拓扑分布约束（topology\
  \ spread constraints）允许您将用户负载分布在不同的故障区域。\n\n问题 28 ，答案 D\n\nKubernetes 命名空间是在非敌对工作负载之间划分集群的好方法。每个命名空间都有自己的资源配额（resource\
  \ quota）和用户账户。\n\n问题 29 ，答案 C\n\n新的 Kubernetes 对象以 alpha 资源的形式进入 API，经过 beta 阶段，最终提升为稳定版（即“GA”）。\n\
  \n问题 30 ，答案 A\n\nKubernetes 提供了一种健康检查机制，用于探测应用程序是否按预期运行。\n\n问题 31 ，答案 B\n\n`kubectl\
  \ logs` 命令返回容器日志。添加 `-p` 标志可以返回最近终止的 pod 的日志。\n\n问题 32 ，答案 C\n\n`kubectl describe`\
  \ 命令用于返回对象的详细信息。\n\n问题 33 ，答案 B\n\nLinkerd 是一个已毕业的 CNCF 服务网格。Istio 也是一个服务网格，但不是\
  \ CNCF 项目。\n\n问题 34 ，答案 A\n\nkubeconfig 是 kubectl 的配置文件。\n\n问题 35 ，答案 C\n\n容器运行时负责运行容器。某些容器运行时（如\
  \ Kata containers）在它们自己的虚拟机中运行每个容器。\n\n问题 36 ，答案 C\n\n为了高可用性，您应该始终部署奇数个控制平面节点。三个是最常见的，且一个比两个要好。\n\
  \n问题 37 ，答案 B, C, D\n\n托管 Kubernetes（Hosted Kubernetes）是一种消费模型，由您的云提供商为您构建并管理您的\
  \ Kubernetes 集群的控制平面。这包括管理性能、可用性和升级。由于您不需要担心这些任何问题，您可以更多地关注应用程序。\n\n问题 38 ，答案 B\n\
  \nKubernetes 保证 GA 对象在弃用后至少会被支持 12 个月。\n\n问题 39 ，答案 D\n\nKubernetes deployment 控制器管理无状态应用，并添加了自愈、扩展和滚动更新功能。\n\
  \n问题 40 ，答案 A\n\nKubernetes 集群自动伸缩器（CA）与底层云平台集成，根据需求扩大或缩小节点池。\n\n问题 41 ，答案 A\n\n\
  daemonset 控制器确保特定 pod 的实例始终运行在每个集群节点上。\n\n问题 42 ，答案 D\n\ncontainerd 由 Docker, Inc.\
  \ 创建并捐赠给 CNCF，是一个适用于 Kubernetes 等环境的轻级容器运行时。\n\n问题 43 ，答案 D\n\n`kubectl apply` 命令通常用于从\
  \ YAML 清单文件部署对象。\n\n问题 44 ，答案 A, B\n\nKubernetes 提供原生的 IPAM 和服务发现。对于可观测性和流量加密，您需要一个服务网格。\n\
  \n问题 45 ，答案 B\n\nPod 是您可以部署到 Kubernetes 集群的最小工作单元。\n\n问题 46 ，答案 B\n\n当出现问题时，应用程序日志是查看的好佳地方。这是因为它们列出了详细的应用程序相关事件，这些事件通常包括服务重启、崩溃、身份验证失败、网络超时以及导致问题的因素。\n\
  \n问题 47 ，答案 B\n\nstatefulset 控制器管理读写持久化数据的应用程序。它提供了自愈、扩展、持久化命名和有序启动。\n\n问题 48 ，答案\
  \ B\n\nKubernetes 控制器提供自愈、扩展、持久化命名和有序启动。\n\n问题 49 ，答案 D\n\nKubernetes deployment\
  \ 控制器管理无状态应用，并添加了自愈、扩展和滚动更新功能。\n\n问题 50 ，答案 A\n\nKubernetes 集群自动伸缩器（CA）与底层云平台集成，根据需求扩大或缩小节点池。\n\
  \n问题 51 ，答案 B\n\ndaemonset 控制器确保特定 pod 的实例始终运行在每个集群节点上。\n\n问题 52 ，答案 D\n\ncontainerd\
  \ 由 Docker, Inc. 创建并捐赠给 CNCF，是一个适用于 Kubernetes 等环境的轻级容器运行时。\n\n问题 53 ，答案 B\n\n`kubectl\
  \ apply` 命令通常用于从 YAML 清单文件部署对象。\n\n问题 54 ，答案 C\n\nKubernetes 提供原生的 IPAM 和服务发现。对于可观测性和流量加密，您需要一个服务网格。\n\
  \n问题 55 ，答案 B, C\n\nPod 是您可以部署到 Kubernetes 集群的最小工作单元。\n\n问题 56 ，答案 D\n\n当出现问题时，应用程序日志是查看的好佳地方。这是因为它们列出了详细的应用程序相关事件，这些事件通常包括服务重启、崩溃、身份验证失败、网络超时以及导致问题的因素。\n\
  \n问题 57 ，答案 A\n\nstatefulset 控制器管理读写持久化数据的应用程序。它提供了自愈、扩展、持久化命名和有序启动。\n\n问题 58 ，答案\
