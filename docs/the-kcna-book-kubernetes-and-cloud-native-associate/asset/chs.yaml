  \ `/health`\n\n## 21. 当 Prometheus 正在“抓取（scraping）”时发生了什么？\n1. 它正在丢弃比某日期旧 Metrics\n\
  2. 它正在向远程设备推送告警\n3. 它正在从远程系统收集指标数据\n4. 它正在更新可视化仪表板\n\n## 22. Prometheus 收集远程指标是使用推送（push）还是拉取（pull）模型？\n\
  1. 推送 (Push)\n2. 拉 (Pull)\n\n## 23. Prometheus 以什么格式存储指标数据？\n1. 时序 (Timeseries)\n\
  2. 时间片 (Timeslice)\n3. XML\n4. SOAP\n\n## 24. 你运行了许多短寿命应用程序，需要一种方法将它们的遥测数据收集到 Prometheus\
  \ 中。你应该怎么办？\n1. 保持程序运行，直到 Prometheus 抓取它们的遥测数据\n2. 什么都不做，Prometheus 会自动处理此\n3. 让你的程序将指标推送到\
  \ Prometheus pushgateway\n4. Prometheus 对此没有解决方案\n\n## 25. 你有几个内部应用程序需要集成到你的 Prometheus\
