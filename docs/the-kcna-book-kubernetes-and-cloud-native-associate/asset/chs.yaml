  * 3. SOAP\n* 4. Python\n\n### 12. GitOps 工作流中典型的持续交付触发器是什么？\n* 1. 拉取请求并合并\n* 2.\
  \ Git rebase\n* 3. Docker pull\n* 4. 提交带有 deploy 标签的文件\n\n### 13. 下列哪些项是 GitOps\
