  # 4: Kubernetes 基础\n\n本章涵盖了考试中 Kubernetes 基础部分的主题。它占你总分数的 46%，是考试中最重要的部分。与 Kubernetes\
  \ 相关的问题也是考试中最详细的。\n\n考虑到这一点，本章的内容将比其他章节更详尽。在大多数章节节之后，我们还设置了一小组复习题。这将强化你所学的内容，并在无需等到章节末尾的情况下测试你的知识。章节末尾仍然有常规的总结题。\n\
  \n如果你是 Kubernetes 的初学者，应该准备好发现其中一些内容可能很困难。但是，它是考试的重要组成部分，你必须学习它。请务必：\n\n* 记笔记\n\
  * 在所有复习题上彻底自测\n* 重新回顾任何你感到困难的主题\n\n如果你觉得在考试之前需要学习更多关于 Kubernetes 的知识，你应该认真考虑作者提供的额外资源。\n\
  \n* **书籍：**Quick Start Kubernetes\n* **视频课程：**Docker and Kubernetes: The Big Picture\
  \ (Pluralsight)\n* **视频课程：**Getting Started with Kubernetes (Pluralsight)\n\n所有这些资源都很短，评价极高，并将帮助你学习\
  \ Kubernetes 的基础知识。例如，那本书只有大约 100 页。\n\n在阅读本章之前，你应该熟悉容器和微服务，以及弹性性和自动伸缩容等云原生特性。之前的章节已经涵盖了这些主题，所以如果你完成了那些部分，就可以准备好学习本章了。\n\
  \n本章划分如下：\n\n* 导论 (Primer)\n* 简单的 Kubernetes 工作流\n* 容器与 Pod (pods)\n* Kubernetes\
  \ 架构\n* 调度 (Scheduling)\n* Kubernetes 命名空间 (namespaces)\n* Kubernetes API 和 API\
  \ 服务器\n* Kubernetes 网络\n* 章节总结\n* 考试要点\n* 复习题\n\n## 导论\n\n多年来，Google 一直每周在数十亿个容器上运行搜索和\
  \ Gmail。这是一个巨大的规模，他们需要帮助。因此，他们构建了两个名为 `Borg` 和 `Omega` 的内部工具来提供。当 Docker 让容器流行起来时，世界上其他地区遇到了类似的挑战。虽然我们的规模没有\
  \ Google 那么大，但我们仍然需要工具来帮助。在 Docker 让容器流行的同时，Google 的一组技术人员正在构建一种新的容器编排工具。它是基于从 `Borg`\
  \ 和 `Omega` 中中学的经验，并于 2014 年作为一个名为“Kubernetes”的开源项目发布。\n\n因此，Kubernetes 是一个用于大规模调度和管理容器的平台。它带来了如自愈、、自动伸缩和零停机滚动更新等功能。它最初构建在\
  \ Google 内部，并在 2014 年作为开源项目发布给社区。从那时起，它成为行业标准的容器编排器，是 GitHub 上第二大开源项目，也是第一个从 CNCF\
  \ 毕业的项目。\n\n尽管 Kubernetes 主要是一个容器编排器，但它也可以也可以编排虚拟机和无服务器函数。`KubeVirt` 项目允许 Kubernetes\
  \ 管理虚拟机，而 `Knative` 和 `OpenFaaS` 项目使无服务器工作负载能够在 Kubernetes 上运行。\n\nKubernetes 目前是繁荣生态系统的核心中心项目，许多其他项目接入其中，扩展其功能并提供额外的服务。示例包括：\n\
  \n* KubeVirt\n* Knative\n* OpenFaaS\n* 容器网络接口 (CNI)\n* Prometheus\n* Linkerd\n*\
  \ Harbor\n\n正如前面提到的，`KubeVirt` 扩展了 Kubernetes 以能够管理虚拟机，而 `Knative` 和 `OpenFaaS`\
  \ 让 Kubernetes 能够管理无服务器函数。\n\n`CNI` 让 Kubernetes 网络变得可插件化，使得 `Cilium` 等其他技术可以带来先进的网络功能。`Prometheus`\
  \ 增加了高级监控，`Linkerd` 带来了服务网格功能，`Harbor` 实现了容器镜像仓库。最后，“Kubernetes”这个名字源于希腊语中的“舵手”。你还会看到该名字缩写为\
  \ `K8s`，发音为“kates”。在这个缩写中，数字 `8` 代表被去掉的八个字母。\n\n### 导论测验\n\n**1. 部署 Kubernetes 的原因是什么？选择一个答案。**\n\
  * 1. 管理本地网络和存储\n* 2. 作为构建和测试流水线的工具\n* 3. 帮助大规模管理容器应用\n* 4. 作为私有云平台的开源替代方案\n\n**2.\
  \ Kubernetes 带来哪些功能？选择正确答案。**\n* 1. 加密流量\n* 2. 自愈\n* 3. 零停机滚动更新\n* 4. 自动伸缩\n\n**3.\
  \ `KubeVirt` 项目是如何扩展 Kubernetes 的？**\n* 1. 允许将单个集群分为多个集群\n* 2. 允许 Kubernetes 调度虚拟机工作负载\n\
  * 3. 运行无服务器工作负载\n* 4. 在本地运行 Kubernetes\n\n**4. 哪些社区项目提供 Kubernetes 原生的监控和日志？**\n\
  * 1. Linkerd\n* 2. Docker\n* 3. Harbor\n* 4. Prometheus\n\n**答案：** 1:C, 2:B,C,D,\
  \ 3:B, 4:D.\n\n## 简单的 Kubernetes 工作流\n\n应用程序编写编写被封装成容器镜像并托管在仓库中。\n\n为了让容器在 Kubernetes\
  \ 上运行，它必须封装在 `pod` 中。这是通过在 pod 清单文件中描述容器来实现的并将其提交给 Kubernetes API 服务器，在那里请求将经过验证和授权。假设这些检查通过，pod\
  \ 定义将持久化到集群存储中，调度器将其分配给一个节点。分配的工作节点上的 `Kubelet` 服务告诉其容器运行时下载所需的镜像并将其作为容器启动。\n\n\
  这些段落中有很多术语，我们将在章节的其余部分解释它们。\n\n### Kubernetes 工作流测验\n\n**1. 正确或错误：容器可以直接调度到 Kubernetes\
  \ 中？**\n* 1. 正确\n* 2. 错误\n\n**2. 哪个 Kubernetes 节点组件下载容器镜像并启动容器？**\n* 1. Kubelet\n\
  * 2. 容器运行时\n* 3. API 服务器\n* 4. 调度器\n\n**答案：** 1:B, 2:B.\n\n\n\n\n\n## 容器与 Pod\n\n\
  在进入细节之前，让我们先理清一些术语。\n\n我们有时使用 `container`（容器）和 `pod` 这两个词来表示相同的意思。然而，pod 实际上是对一个或多个容器的薄层封装，它是任何想要在\
  \ Kubernetes 上运行的容器的强制性要求。这意味着容器如果运行在 Kubernetes 上，**必须**被封装在 pod 中。以下极其简单的 YAML\
  \ 文件定义了一个包含单个容器的 pod。\n\n```\n1  apiVersion: v1\n2  kind: Pod\n3  metadata:\n4 \
  \   name: kcna-pod\n5    labels:\n6      project: kcna-book\n7  spec:\n8    containers:\
  \     <<==== 容器在下方处定义\n9      - name: kcna-container\n10       image: <container-image-goes-here>\n\
  ```\n\n第 1-7 行定义了 pod 的名称和标签。第 8-10 行显示了嵌入在整个 pod 定义中的容器定义。由于容器是嵌入在 pod 定义中的，我们称\
  \ pod “封装了容器”。\n\n除了让容器在 Kubernetes 上运行外，pod 还为容器增加了以下所有功能和能力：\n\n* 协同调度 (Co-scheduling)\n\
  * 共享内存\n* 共享卷\n* 共享网络\n* 策略 (Policies)\n* Kubernetes 智能调度\n\n协同调度允许你在同一个 pod 中运行多个容器，并保证它们始终运行在同一个节点上。常见的模型是拥有一个主应用程序容器和一个辅助容器。辅助容器通常被称为\
  \ `sidecar`（旁路容器）。\n\n`logging sidecar`（日志 sidecar）是一个与应用程序容器运行在同一个 pod 中的特殊容器。它收集应用程序日志并将其传输到中心位置进行聚合。这允许应用程序容器专注于运行程序，而让日志\
  \ sidecar 专注于处理日志。\n\n服务网格（Service meshes）也使用 pod 进行协同调度。它们在应用程序容器的同一个 pod 中注入一个\
  \ `proxy sidecar`（代理 sidecar）。sidecar 拦截所有网络流量，并执行诸如加密和解密流量、暴露详细的网络测量以及优化网络流量流的操作。与日志\
  \ sidecar 示例一样，应用程序容器专注于运行程序，而服务网格 sidecar 专注于高级网络功能。\n\n在这两种情况下，应用程序容器甚至不知道 sidecar\
  \ 的存在。\n\nPod 还是一个`共享执行环境`。这意味着同一个 pod 中的每个容器都可以访问相同的内存、卷和网络栈。这使得辅助模式成为可能，例如主 Web\
  \ 容器和同步器 sidecar。在这个示例中，Web 容器完全专注于从卷中提供静态内容，而 sidecar 完全专注于从远程仓库同步最新内容并将其放入共享卷中，供\
  \ Web 服务器访问。这之所以行得通，是因为两个容器都在同一个 pod 中，并且可以访问相同的卷。请见图 4.1。\n\n![](img/images----figure4-1.png)\n\
  \n图 4.1\n\nPod 还允许你挂载策略以及资源请求（resource requests）和资源限制（resource limits）等内容。`Resource\
  \ requests` 指定了 pod 正常运行所需的 CPU 和内存最小量，而 `resource limits` 则允许你设置最大值。它们对于帮助调度器将\
  \ pod 分配到具有足够资源的节点至关重要。\n\n图 4.2 显示了两个 pod。左侧的正在调度单个容器，右侧的正在调度两个。右侧 pod 中的两个容器都可以访问相同的共享内存、相同的共享卷和相同的共享网络栈。这意味着右侧\
  \ pod 中的两个容器共享相同的 IP 地址，并可以通过专用端口访问。它们还保证会被调度到同一个工作节点上。\n\n![](img/images----figure4-2.png)\n\
  \n图 4.2\n\n接下来的声明式 YAML 文件定义了一个带有某些高级功能的多容器 pod。如果看起来很复杂，请不要望所措，你考试时不需要理解细节。但是，你需要理解这些概念。该文件还经过了注释以突出显示重要部分。\n\
  \n```\n1  apiVersion: v1\n2  kind: Pod             <<==== 此文件正在定义一个 pod\n3  metadata:\n\
  4    name: kcna-pod      <<==== Pod 名称\n5  spec:\n6    volumes:            <<====\
  \ 定义一个两个容器都可以访问的卷\n7    - name: html        <<==== 为共享卷命名为 (\"html\")\n8      emptyDir:\
  \ {}      <<==== 将其制为空卷\n9    runtimeClassName: level1       <<==== 调度到具有特定运行环境的节点\n\
  10   containers:                    <<==== 此代码块定义了两个容器\n11     - name: main-container\
  \       <<==== 这是主应用容器\n12       image: <app-image>         <<==== 主应用容器镜像\n13 \
  \      volumeMounts:              <<==== 将卷挂载到主应用容器\n14       - name: html     \
  \          <<==== 挂载共享的 “html”卷\n15         mountPath: /usr/share/nginx/    <<===\
  \ 在容器中挂载到此处\n16     - name: sidecar              <<==== 这是 sidecar 容器\n17      \
  \ image: <sidecar-image>     <<==== Sidecar 容器镜像\n18       volumeMounts:       \
  \       <<==== 将卷挂载到 sidecar 容器\n19       - name: html               <<==== 挂载相同的共享\
  \ “html”卷\n20         mountPath: /tmp/git      <<==== 在 sidecar 容器中挂载到此处\n```\n\n\
  第 1-9 行定义了 pod，而第 10-20 行描述了两个容器。与之前的示例一样，两个容器都嵌套/封装在 pod 定义中。\n\n第 6-8 行定义了一个名为\
  \ `html` 的新空卷。由于它是 pod 环境，两个容器都可以。第 9 行告诉 Kubernetes 将 pod 调度到具有特定运行环境的节点。第 11-15\
  \ 行定义了应用程序容器。它将共享 `html` 卷挂载到本地文件系统 `/usr/share/nginx/`。第 16-20 行定义了 sidecar 容器，并将相同的共享\
  \ `html` 卷挂载到 `/tmp/git`。\n\n总结该 YAML 文件。它描述了一个多容器 pod。它包含了运行时类引用并定义了一个共享卷。关于 pod\
  \ 我们还可以说很多，但目前，了解它们是对一个或多个容器的轻量级封装，以及如果不封装在 pod 中无法在 Kubernetes 上运行容器已经足够了。我们经常通用\
  \ `container` 和 `pod`，尤其在不需要区分时。此外，pod 中的容器共享相同的环境并保证被调度到同一个节点上。\n\n### 容器与 Pod\
  \ 测试\n\n1. Kubernetes 上的调度原子单位是哪个？\n\n* 1. Docker\n* 2. Container\n* 3. Pod\n* 4.\
  \ Kubelet\n\n2. 在 pod 中部署容器的优点有哪些？请选择所有正确答案。\n\n* 1. Pod 允许容器协同调度\n* 2. Pod 允许多个容器共享相同的执行环境\n\
  * 3. Pod 为容器提供专用的内核\n* 4. Pod 允许对容器应用策略\n\n3. 辅助容器的常用名称是什么？\n\n* 1. Sidecar\n* 2.\
  \ Sideshow\n* 3. service mesh\n* 4. Supporter\n\n4. Kubernetes 清单文件通常用什么格式编写？\n\n\
  * 1. Python\n* 2. YAML\n* 3. XML\n* 4. Rust\n\n**答案。**1:C, 2:A,B,D, 3:A, 4:B.\n\n\
  \n\n\n你刚刚学习了 pods 如何封装一个或多个容器并添加相应的功能。然而，pods 并不具备自愈能力，不会自动伸缩，也不会执行零停机发布等操作。Kubernetes\
  \ 拥有更高层的控制器来封装 pods 并实现这些功能。因此，你几乎总是通过高级别的控制器（如 `deployments` 和 `statefulsets`）来部署\
  \ pods。\n\n你将在本章稍后的部分学习更多关于控制器的知识。但现在，让我们考虑一个部署无状态 Web 服务器的简单示例。\n\n你的开发团队编写了一个无状态\
  \ Web 应用并将其封装为容器。你知道你需要 5 个实例来满足预期需求，而且由于你正在运行 Kubernetes 环境，你需要将每个容器封装在 pod 中。然而，pods\
  \ 并不具有容错性。例如，如果你部署了 5 个独立的 pod，而托管其中 2 个 pod 的节点发生故障，并没有什么智能机制来重新创建它们并确保你始终有 5 个。这就是高级别控制器发挥用场的地方。\n\
  \nKubernetes 有一个 `deployment controller`（部署控制器），它接受 pod 定义并确保始终运行着指定数量的 pod。\n\n\
  考虑到此，你将 pod 封装在一个 deployment 中，并告诉 Kubernetes 运行它。一旦所有 5 个 pod 都启动并运行，部署控制器就会持续监控状态并对故障等事件做出响应。例如，如果一个节点故障并带走了两个\
  \ pod，部署将通过启动两个新 pod 来保持你的数量维持在 5 个。\n\n你将在稍后学习更多关于控制器的知识，但下面的 YAML 显示了一个简单的部署。注意容器是如何嵌套在\
  \ pod 内部的，而 pod 又嵌套在 deployment 内部。因此，deployment 封装了 pod，而 pod 再次封装了容器。\n\n```\n\
  1  apiVersion: apps/v1\n2  kind: Deployment\n3  metadata:\n4    name: kcna-deployment\n\
  5  spec:\n6    replicas: 5\n7    <Snip>\n8    template:\n9      spec:\n10      \
  \ runtimeClassName: level1 \n11       containers:\n12       - name: kcna-pod\n13\
  \         image: <container-image>\n```\n\n第 1-6 行是部署部分，定义了始终运行的 5 个 pod 副本的期望状态。第\
  \ 8-10 行定义了 pod，并包含了你之前看到的运行时类要求。第 11-13 行定义了容器。这如图 4.3 所示。\n\n![](img/images----figure4-3.png)\n\
  \n图 4.3\n\n### Pod 增强功能测验\n\n**1.** 为什么 Kubernetes 实现高级别控制器而不是部署静态 pod？\n\n* 1.\
  \ 它们提供了高级的网络遥测\n* 2. 它们增加了如韧性、伸缩和更新等功能\n* 3. 它们允许 pod 在不同的云平台之间迁移\n* 4. 它们运行 pod\
  \ 的速度更快\n\n**2.** 下面哪个 Kubernetes 控制器确保特定数量的容器始终运行？\n\n* 1. Deployment controller（部署控制器）\n\
  * 2. Job controller（作业控制器）\n* 3. Endpoints controller（端点控制器）\n* 4. Cloud controller（云控制器）\n\
  \n**3.** 下面哪项最能描述 pods 和控制器的架构？\n\n* 1. Pod 规范封装在控制器规范中\n* 2. 控制器规范嵌入到 pod 规范内部\n\
  \n**答案。** 1:B, 2:A, 3:A.\n\n## Kubernetes 架构\n\n我们在这一节将涵盖很多内容，因此我们将它们分成几个小节，以便于理解和查阅。我们将涵盖以下内容：\n\
  \n* 高级 Kubernetes 架构\n* 控制平面 (The control plane)\n* 控制器 (Controllers)\n* 工作节点 (Worker\
  \ nodes)\n* `kubectl`\n* 托管 Kubernetes (Hosted Kubernetes)\n\n### 高级 Kubernetes\
  \ 架构\n\n从高层来看，Kubernetes 是一个运行容器化应用程序的节点集群。它运行许多 `controllers` 来实现自愈和自动化发布等功能。\n\
  \nKubernetes 集群中有两种节点。\n\n* 控制平面节点\n* 工作节点\n\n它们都可以是虚拟机、物理服务器或云实例，你可以在同一个集群中混合使用不同类型。\n\
  \n`Control plane nodes` 是 Kubernetes 的大脑。它们运行 API server、调度器和集群存储。它们还运行着实现智能逻辑的控制器。\n\
  \n`Worker nodes` 是用户应用程序运行的地方。每个工作节点都有一个 `kubelet` 和容器运行时。`kubelet` 与控制平面通信，并告诉容器运行时何时启动和停止容器。\n\
  \nKubernetes 命令行工具称为 `kubectl`。\n\n让我们更详细地查看每一个部分。\n\n### 控制平面 (The control plane)\n\
  \nKubernetes 控制平面是运行在每个控制平面节点上的专用独立服务的集合。这些实现了让 Kubernetes 如此特别的智能逻辑。\n\n由于控制平面是每个\
  \ Kubernetes 集群的关键部分，它需要具有高高性能和高可用性。在现实世界中，生产环境的 Kubernetes 集群通常运行跨多个故障域的 3 或 5\
  \ 个控制平面节点。这意味着控制平面节点或任何支持基础设施的故障都不会导致整个控制平面的崩溃。你还应该确保控制平面节点通过低延迟的可靠网络连接。\n\n运行奇数数量的控制平面节点是非常重要的，运行\
  \ 1 个比运行 2 个要好。这是因为偶数更有可能导致“脑裂”场景，即发生网络故障时，网络故障两侧的控制平面节点数量相等。如果发生这种情况，任何一方都无法确定自己是否拥有多数派权。\n\
  \n如果控制平面真的宕机了，已经在运行的应用程序将继续工作，但你将无法进行任何更改或更新。\n\n主要的控制平面服务包括以下所有项，它们都运行在每个控制平面节点上。\n\
  \n* API server\n* 调度器 (Scheduler)\n* 集群存储 (Cluster store)\n* 控制器 (Controllers)\n\
  \n`API server` 是 Kubernetes 进出的网关。当你向 Kubernetes 发命令时，你是将命令发送给 API server。当你查询某个对象的状态时，你是将查询发送给\
  \ API server。此外，每个工作节点上的 `kubelet` 监控 API server 的新任务分配，并向 API server 报告状态。基本上，Kubernetes\
  \ 中的一切都通过 API server。这需要高性能的控制平面节点，以便 API server 能够快速响应请求。\n\n`Scheduler`（调度器）负责决定在哪些节点上运行\
  \ pod。它可以将 pod 调度到具有 CPU 和内存的节点上，可以将它们分布在不同的可用区，甚至可以将它们目标指向特定节点或避开特定节点。\n\n`Cluster\
  \ store`（集群存储）是存储集群状态的地方，它是整个控制平面中唯一有状态的组件。这意味着它是唯一创建并存储不能丢失的重要集群相关数据的组件。例如，如果你部署一个需要\
  \ 5 个特定 pod 实例的应用程序，这将被存储在集群存储中，并供控制器和其他组件作为参考。集群存储基于 `etcd` 分布式数据库。\n\n`Controllers`（控制器）监控集群的当前状态并采取行动以确保其与期望状态保持同步。再次，作为一个简单的示例，你可能请求运行\
  \ 5 个运行 Web 服务器容器的 pod——这就是期望状态。如果发生故障导致 pod 数量减少到 3 个，控制器会观察到变化并启动 2 个新 pod，以使观测状态恢复到与期望状态同步。我们稍后将详细解释这一点。\n\
  \n\n\n\nKubernetes 运行了一系列特定的控制器，这些控制器实现了让 Kubernetes 如此强大的大部分智能。每个控制器都以`reconciliation\
  \ loop`（调循环）的形式运行，监控集群并确保 `observed state`（观测状态）与 `desired state`（期望状态）保持同步。\n\n\
  我们将简要介绍一些重要的控制器，然后通过一个示例进行演示。\n\n### Deployment 控制器\n`Deployment controller` 实现了在\
  \ Kubernetes 上运行无状态应用所需的智能机制和功能。例如，它可以确保 Web 服务的 5 个副本始终在运行。如果其中一个失败了，控制器会启动一个新的。它还实现了零停机滚动更新等更多功能。\n\
  \n### StatefulSet 控制器\n`StatefulSet controller` 与部署控制器类似，但它专门用于 `stateful`（有状态）工作负载。例如，它可以像部署控制器一样部署并自愈所需数量的\
  \ pod。然而，它还实现了诸如 `ordered startups`（有序启动）和 `ordered shutdowns`（有序关机）等功能，这些对于写入共享数据存储的有状态应用可能非常重要。\n\
  \n### DaemonSet 控制器\n`DaemonSet controller` 确保集群中的每个节点上始终运行一个特定 pod 的实例。一个常见的例子是日志记录，通常需要在每个集群节点上运行一个代理来收集并传输日志。DaemonSet\
  \ 控制器将确保集群中的每个节点都运行一个代理 pod 实例。这包括在添加到集群的任何新节点上自动启动 pod。它还可以重启或替换失败的 pod。\n\n还有许多控制器，但它们都作为\
  \ `reconciliation loops` 运行，监控集群并确保 `observed state` 与 `desired state` 匹配。\n\n考虑以下示例。你有一个新应用，需要\
  \ 5 个运行 v1.3 版本代码的无状态 web pod。你在一个声明式清单文件中描述了这一需求，并将其提交到 API 服务器。这被记录在集群存储器中作为你的\
  \ `desired state`，并由调度器将这 5 个 pod 分配给工作节点。部署控制器在控制平面上作为后台 `reconciliation loop`\
  \ 运行，确保观测状态与期望状态匹配——在这个示例中，它负责确保 5 个 web pod 始终在运行。如果观测状态与期望状态匹配，它将只是继续监控集群。然而，如果运行其中一个\
  \ pod 的节点发生故障，部署控制器将观察到只有 4 个 web pod，并意识到这与 5 个的期望状态不符。它将通过指示调度器在存活节点上启动新 pod 来修复此问题。这将观测状态恢复到与期望状态，是\
  \ `resiliency`（弹性）或 `self-healing`（自愈）的示例。\n\n继续相同的示例，假设你想将所有 5 个 web pod 从 v1.3\
  \ 更新到 v1.4。你通过更新同一个声明式清单文件来指定新版本，并再次提交到 API 服务器。这注册了一个新的期望状态：运行 v1.4 的 5 个 web pod。部署控制器将观察到\
  \ 5 个运行 v1.3 的 web pod，并将其与期望状态进行比较（现在的期望是 0 个运行 v1.3 的和 5 个运行 v1.4 的）。它将通过将 5 个运行\
  \ v1.3 的 pod 替换为 5 个运行 v1.4 的 pod 来做出响应。这是一个发布（rollout）的示例。\n\n> **术语科普。** 我们经常说控制器作为\
  \ `control loops`（控制循环）、`watch loops`（监听循环）或 `reconciliation loops`（调循环）运行。它们的意思是一样的。我们还使用\
  \ `current state`（当前状态）、`actual state`（实际状态）和 `observed state`（观测状态）来表示相同的内容。最后，将当前状态恢复到与期望状态同步的过程被称为\
  \ `reconciliation`（调解/协调）。\n\n### 工作节点\n工作节点是用户应用程序运行的地方。它们可以是物理服务器、虚拟机或云实例，单个 Kubernetes\
  \ 集群可以运行它们的混合。\n\n所有工作节点都运行三个重要的服务：\n* Kubelet\n* 容器运行时 (Container runtime)\n* Kube-proxy\n\
  \n`kubelet` 是节点上主要的 Kubernetes `agent`。它监控 API 服务器获取新的任务分配，告诉容器运行时启动和停止哪些容器，并向 API\
  \ 服务器报告状态信息。它还执行其他操作，例如使容器日志对 `kubectl logs` 命令可用。\n\n旧的 Kubernetes 集群使用 Docker\
  \ 作为容器运行时。然而，该层现在是可插拔的，这意味着集群管理员可以根据需求选择最佳的容器运行时。在写作时，大多数新的 Kubernetes 集群使用 `containerd`（读作“container\
  \ dee”）作为容器运行时，但存在许多其他选择。事实上，单个集群可以在不同的工作节点上运行不同的运行时，如图 4.4 所示。\n\n![](img/images----figure4-4.png)\n\
  \n图 4.4\n\n在 Kubernetes 中使容器运行时层可插拔的技术是 `Container Runtime Interface (CRI)`（容器运行时接口）。以下列表是一些常见的容器运行时：\n\
  * `Containerd`（在新集群中流行）\n* `CRI-O`（RedHat OpenShift 集群的默认）\n* `gVisor`（在容器和主机 OS\
  \ 之间提供额外的隔离）\n* `Kata containers`（在轻量级虚拟机中运行每个容器）\n* `Docker`（原始的，但自 K8s 1.20 起已弃用）\n\
  \n工作节点的最后一部分是 `kube-proxy`。它实现了网络功能，使得流量能够成功到达 pod。\n\n### kubectl\n`kubectl` 是\
  \ Kubernetes 的命令行工具，适用于大多数平台，包括 Linux、MacOS 和 Windows。\n\n你在机器上安装它，配置其配置文件，并使用它来管理远程\
  \ Kubernetes 集群。它可以执行所有操作：\n* 获取集群信息\n* 部署 pod 和 service 等对象\n* 查询对象状态\n* 读取日志\n\
  * 在容器内部执行命令\n\n它有一个名为 `config` 的配置文件，通常位于你主目录下的隐藏目录 `.kube` 中。你经常会听到它被称为 `kubeconfig`\
  \ 文件，它包含了连接到集群的列表和凭据。以下是常用的 kubectl 命令：\n\n* `kubectl get <object>`\n* `kubectl\
  \ describe <object>`\n* `kubectl apply <filename>`\n* `kubectl delete <filename\
  \ | object>`\n* `kubectl api-resources`\n\n`kubectl get` 命令返回资源的简要信息。例如，以下命令返回关于\
  \ pod `web-fe` 的信息。\n\n```\n$ kubectl get web-fe\nNAME       READY   STATUS    RESTARTS\
  \   AGE\nweb-fe     1/1     Running   0          29m\n```\n\n以下 `kubectl describe`\
  \ 命令返回关于该 pod 更详细的信息。\n\n```\n$ kubectl describe pod web-fe\nName:         web-fe\n\
  Namespace:    default\nPriority:     0\nNode:         prod-cluster/192.168.65.4\n\
  Start Time:   Wed, 9 Feb 2022 21:43:01 +0000\nLabels:       project=kcna-book\n\
  Annotations:  <none>\nStatus:       Running\nIP:           10.1.0.107\n<省略>\n```\n\
  \n部署对象到 Kubernetes 的首选方法是在 YAML 清单文件中描述它们并使用 `kubectl apply` 或 `kubectl create`\
  \ 进行部署。以下命令部署了 `web-deploy.yml` 文件中定义的对象。\n\n```\n$ kubectl apply -f web-deploy.yml\n\
  deployment.apps/kcna-deploy created\n```\n\n`kubectl delete` 命令删除对象。你可以给它对象类型和名称，也可以给它一个清单文件。如果你给出对象类型和名称，它将删除该对象。如果你给出一个\
  \ YAML 清单文件，它将删除文件中定义的所有内容。参见以下示例。\n\n```\n$ kubectl delete pod web-fe\npod \"web-fe\"\
  \ deleted\n\n$ kubectl delete -f web-deploy.yml\ndeployment.apps \"kcna-deploy\"\
  \ deleted\n```\n\n以下命令显示了你可以在集群上部署的所有资源列表。\n\n\n\n\n\n```\n$ kubectl api-resources\n\
  NAME            APIVERSION      NAMESPACED   KIND\npods            v1          \
  \    true         Pod\ndeployments     apps/v          true         Deployment\n\
  daemonsets      appsv1          true         DaemonSet\njobs            batch/v1\
  \        true         Job\n<Snip>\n```\n\n你的 `kubectl` 版本与 Kubernetes API 服务器相比，旧或新旧超过一个次版本是极其重要的。例如，如果你运行的是\
  \ Kubernetes 1.23，可以使用 1.22 或 1.24 版本的 `kubectl`。\n\n### 托管 Kubernetes (Hosted Kubernetes)\n\
  \n大多数云平台都提供 `hosted Kubernetes` 服务。在这种情况下，由云平台拥有并管理 Kubernetes 集群，你通过付费来使用它。\n\n\
  许多托管 Kubernetes 服务虽然拥有并管理控制平面，但允许你管理工作节点。在这种模型中，云平台负责控制平面的性能、可用性以及执行升级工作。而你则负责添加和删除工作节点以及配置节点池。\n\
  \n托管 Kubernetes 非常受欢迎，因为它消除了构建和管理自己高性能、高可用集群的痛苦和时间耗时。然而，如果管理不当，最初看起来微小的成本很容易变成巨大的开支。\n\
  \n流行的托管 Kubernetes 服务包括：\n\n*   AWS Elastic Kubernetes Service (EKS)\n*   Azure\
  \ Kubernetes Service (AKS)\n*   Google Kubernetes Engine (GKE)\n*   Linode Kubernetes\
  \ Engine (LKE)\n\n也存在其他服务。\n\n### Kubernetes 架构测试题\n\n**1.** 集群存储（cluster store）是基于哪种开源分布式数据库？\n\
  \n*   1. Consul\n*   2. Oracle\n*   3. MongoDB\n*   4. etcd\n\n**2.** 下面哪种容器运行时是\
  \ Red Hat OpenShift 集群的默认运行时？\n\n*   1. CRI-O\n*   2. Docker\n*   3. containerd\n\
  *   4. kata\n\n**3.** 关于 Kubernetes 的最新发布版本，以下哪个说法是正确的？\n\n*   1. containerd 不受支持\n\
  *   2. containerd 已废弃\n*   3. Docker 运行时是默认的\n*   4. Docker 运行时已废弃或不支持\n\n**4.**\
  \ kubectl 配置文件的常用名称是什么？\n\n*   1. kubernetes.config\n*   2. kubeconfig\n*   3. kubectl.yml\n\
  *   4. Kubelet\n\n**5.** Kubernetes API 服务器的作用是什么？\n\n*   1. 通过 HTTPS 提供 API 服务\n\
  *   2. 在集群节点上调度工作\n*   3. 启动和停止容器\n*   4. 定义 Kubernetes 对象\n\n**6.** 下面哪些是 Kubernetes\
  \ 控制平面服务？请选择两项。\n\n*   1. Docker\n*   2. Kubelet\n*   3. API server\n*   4. Scheduler\n\
  \n**7.** 下面哪些是 Kubernetes 集群节点的类型？请选择两项。\n\n*   1. 工作节点 (Worker nodes)\n*   2. 次级节点\
  \ (Secondary nodes)\n*   3. 控制平面节点 (Control plane nodes)\n*   4. 主节点 (Primary nodes)\n\
  \n**8.** 什么是托管 Kubernetes？\n\n*   1. 你的云平台拥有并管理 Kubernetes 控制平面\n*   2. 所有运行在公共云平台上的\
  \ Kubernetes 集群\n*   3. 本地 Kubernetes 集群的名称\n*   4. 在 IoT 和边缘设备上的轻量级 Kubernetes\
  \ 发行版\n\n**9.** 哪个 Kubernetes 控制器管理处理持久化数据的负载？\n\n*   1. CronJob\n*   2. Job\n*\
  \   3. StatefulSet\n*   4. Deployment\n\n**10.** 下面哪项最准确地描述了 Kubernetes 控制器的工作？\n\
  \n*   1. 作为键值存储\n*   2. 客户端-服务器架构\n*   3. 作为通过 HTTPS 的 RESTful 对象\n*   4. 作为后台调循环（reconciliation\
  \ loops）\n\n**答案。** 1:D, 2:A, 3:D, 4:B, 5:A, 6:C,D, 7:A,C, 8:A, 9:C, 10:D.\n\n###\
  \ 调度 (Scheduling)\n\nKubernetes 有一个内置的调度器，作为控制平面的一部分运行。它使用高级逻辑将 Pod 调度到正确的工作节点。\n\
  \n当要求 Kubernetes 运行一个新的 Pod 时，调度开始。这可能是你向 API 服务器发送了一个请求新 Pod 的新清单文件，可能是自动伸缩事件的结果，甚至可能是替换失败\
  \ Pod 的自愈操作。无论如何，一旦请求了新 Pod，它就会进入挂起（pending）状态，直到调度器选择最佳节点来运行它。一旦确定了节点，Pod 就会被调度。然而，如果调度器找不到合适的节点，Pod\
  \ 将保持挂起状态。\n\n考虑以下示例：你正在运行一个拥有 6 个工作节点的 Kubernetes 集群，并且你所有的 Pod 都配置了资源请求（resource\
  \ requests）和资源限制（resource limits）——资源请求告诉调度器容器运行所需的最小 CPU 和内存，而资源限制则设置了最大值。假设你正在调度两个新\
  \ Pod，每个 Pod 需要 2GB 内存和 2 个 CPU 核心。如果调度器找不到具有足够资源的工作节点，它们将进入挂起状态，直到合适的节点可用。一旦合适的节点可用，它们就会被调度。\n\
  \n调度器还可以执行高级操作，例如：\n\n*   亲和性和反亲和性（Affinity and anti-affinity）\n*   Pod 拓扑分布约束（Pod\
  \ topology spread constraints）\n*   将负载与容器运行时匹配\n*   将工作调度到具有正确存储的节点\n\n`Affinity\
  \ rules`（亲和规则）允许你将 Pod 调度到特定节点，或运行了特定 Pod 的节点。`Anti-affinity`（反亲和性）则相反——它允许你告诉调度器不要在特定节点或运行特定\
  \ Pod 的节点上运行 Pod。亲和性规则像磁铁一样将 Pod 吸引到特定节点，而反亲和性规则则将 Pod 推离特定节点。`Pod topology spread\
  \ constraints`（Pod 拓扑分布约束）允许你跨用户定义的故障域平衡 Pod。它们是实现应用程序可用性的重要工具。\n\n调度器还可以针对特定的运行时调度\
  \ Pod。例如，你可以告诉 Kubernetes 负载仅运行在具有 gVisor 运行时节点上。它还可以将容器调度到访问特定存储卷的节点。\n\n### 调度测试题\n\
  \n**1.** Kubernetes 调度器的作用是什么？\n\n*   1. 为工作节点分配工作\n*   2. 在特定时间运行批作业\n*   3.维持控制平面的时间\n\
  *   4. 使观测状态与预期状态同步\n\n**2.** 如果调度器找不到运行节点，Pod 会发生什么？\n\n*   1. Pod 将被拒绝不运行\n* \
  \  2. Pod 将处于挂起状态\n*   3. 它将临时运行在控制平面节点上\n\n**答案。** 1:A, 2:B.\n\n### Kubernetes\
  \ 命名空间 (namespaces)\n\nKubernetes 命名空间是将单个 Kubernetes 集群划分为名为 `namespaces` 的虚拟集群的方法。\n\
  \n每个命名空间都可以有自己的资源配额和用户账户。这使其成为不同团队或环境共享集群的好方法。例如，你可能使用命名空间将单个集群划分为 dev、test 和 qa\
  \ 命名空间。然而，你不应该将命名空间作为负载边界来尝试隔离恶意或潜在危险的负载。例如，命名空间无法防止一个命名空间中的受攻击容器影响其他命名空间的容器。例如，Pepsi\
  \ 命名空间中的受攻击容器可以轻松破坏 Coke 命名空间的容器。目前，保证一个负载不会影响另一个负载的唯一方法是将它们放在不同的集群中。\n\n### Kubernetes\
  \ 命名空间测试题\n\n**1.** 下面哪项是 Kubernetes 命名空间的良好用例？\n\n*   1. 在竞争性负载之间划分集群\n* 2. 为 Kubernetes\
  \ 集群分配友好名称\n*   3. 将多个 Kubernetes 集群合并到单个 DNS 名称下以便简化管理\n* 4. 在不同不竞争部门之间划分集群\n\n\
  **答案。** 1:D.\n\n### Kubernetes API 和 API 服务器\n\n\n\n\n\n如果你对 API 的概念还不熟悉，你应该将 `Kubernetes\
  \ API` 想象成列出了所有可能的 Kubernetes 对象及其属性的目录。该目录（API）通过 `API server` 进行访问。\n\n例如，Kubernetes\
  \ 定义了许多对象，如 pods、deployments、replicasets、statefulsets、cronjobs、services、ingresses、network-policies\
  \ 等。所有这些对象都定义在 API 中，并包含了所有用于配置它们的属性。当你部署一个对象（例如一个 deployment）时，你会在一个声明式清单（declarative\
  \ manifest）中定义它，并将其发送到 `API server`，在那里它将通过身份验证（authN）、授权（authZ），并调度到集群中。\n\n如果你尝试部署一个在\
  \ API 中未定义的对象，操作将失败。此外，如果你尝试配置一个已不存在对象的属性，操作也会失败。\n\n`Kubernetes API` 被分为不同的命名组（named\
  \ groups），以便理解、导航和扩展。例如，与负载相关的对象（如 deployments 和 statefulsets）定义在 `apps` API 组中，而与存储相关的对象定义在\
  \ `storage.k8s.io` API 组中。\n\n新功能以 `alpha` 特性进入 API，通过 `beta` 阶段，最终毕业成为 `stable`（稳定）阶段。我们有时将稳定功能称为\
  \ `generally available (GA)` 或 `v1`。稳定对象也可以是 `v2`、`v3` 等。\n\n下面的 `kubectl` 命令显示了\
  \ `Kubernetes API` 中的几个对象。`deployments` 对象是 `apps` 命名组中的稳定 v1 对象。`CSIStorageCapacity`\
  \ 是 `storage.k8s.io` 命名组中的一个 beta 对象。\n\n```\n$ kubectl api-resources\nNAME    \
  \               APIVERSION               NAMESPACED   KIND\ndeployments        \
  \    apps/v1                  true         Deployment\ncsistoragecapacities   storage.k8s.io/v1beta1\
  \   true         CSIStorageCapacity\n<Snip>\n```\n\nKubernetes 拥有一项弃用策略，保证所有稳定对象在弃用后至少将支持\
  \ 12 个月或两个发布版本（以较者为准）。\n\n在编写本文时，每 4 个月会发布一个新的 Kubernetes 版本，导致每年发布三个版本。例如，v1.21、v1.22\
  \ 和 v1.23 都在 2021 年发布。\n\n`API server` 通过 RESTful HTTPS 端点暴露 API。所有发送到 `API server`\
  \ 的请求都必须经过身份验证（authN）和授权（authZ）。\n\n### API 和 API server 测验\n\n**1.** Kubernetes\
  \ 对象是在哪里定义的？\n\n*   1. 集群存储（The cluster store）\n*   2. API\n*   3. 个体控制器（Individual\
  \ controllers）\n*   4. Kubernetes GitHub 仓库\n\n**2.** 负载对象（如 deployments 和 statefulsets）定义在哪个\
  \ Kubernetes API 组中？\n\n*   1. apps\n*   2. core\n*   3. workloads\n\n**3.** 下列哪些哪些是指代\
  \ v1 API 对象的其他方式？选择两个。\n\n*   1. Stable（稳定）\n*   2. Beta（测试版）\n*   3. GA\n*   4.\
  \ Live（在线）\n\n**4.** Kubernetes 保证稳定对象会被支持多久？\n\n*   1. 弃用后至少支持一个月\n*   2. 弃用后至少支持\
  \ 6 个月\n*   3. 弃用后至少支持 12 个月\n*   4. 弃用后至少支持 18 个月\n\n**答案。** 1:B, 2:A, 3:A,C, 4:C。\n\
  \n## Kubernetes 网络\n\n在本节中，我们将涵盖以下网络相关主题：\n\n*   Kubernetes services\n*   pod 网络（The\
  \ pod network）\n*   服务注册与发现\n\n### Kubernetes services\n\n你已经知道 pods 通常是通过高级别的控制器（如\
  \ deployment 控制和 statefulset 控制）部署的。这些控制器实现了云原生功能，如自愈、自动伸缩、发布和回滚。\n\n这些特性使得单个 pod\
  \ 极其不可靠。考虑以下示例。\n\n每当节点或 pod 失败时，缺失的 pod 会被具有新 IP 地址的新 pod 替换。如果客户端直接连接失败的 pod，未来的连接将超时且不会重新连接到新\
  \ pod。扩容（Scale-up）事件会添加带有新 IP 地址的新 pod，而缩容（Scale-down）事件会移除 pod。同样，连接到由于缩容操作而被移除的\
  \ pod 的客户端将丢失连接。最后，发布应用的新版本会移除所有现有 pod，并用具有新 IP 地址的新 pod 替换。\n\n这一切使得 pod 变得不可靠，其他应用永远不应该直接连接\
  \ pod。\n\n为了解决这个问题，Kubernetes 提供了一个 `service` 对象位于 pod 前端并为它们提供可靠的网络。例如，你定义了一个 service\
  \ 对象并告诉它将流量重定向到带有特定标签的所有 pod。service 有一个稳定的名称和 IP 地址，Kubernetes 保证该地址永远不会更改。客户端连接到\
  \ service，service 将流量重定向到 pod。service 还足够智能，知道 pod 何时被添加或移除，因此它保证始终将流量负载到最新的运行 pod\
  \ 集合。\n\n图 4.5 显示了一个名为 `kcna-svc` 的服务，IP 地址为 10.0.0.10。名称和 IP 是稳定的，客户端应该连接到这些，而不是直接连接到\
  \ pod。所有访问服务的连接都会重定向到带有 `project=kcna-book` 标签的健康 pod。service 确保始终知道 pod 何时从网络中添加或移除。\n\
  \n![图 4.5](img/figure4-5.png)\n\n### pod 网络\n\n每个 Kubernetes 集群实现了一个名为 `pod network`\
  \ 的网络，所有 pod 都运行其上。这是一个扁直开放的网络，意味着所有 pod 都可以通信。这带来了巨大的安全风险。因此，你应该实施 Kubernetes 网络策略来控制\
  \ pod 间的通信。\n\n在后台，它实际上是一个实现 pod 网络的网络插件。Kubernetes 使用容器接口（CNI）暴露一个可扩展的网络，第三方创建实现\
  \ pod 网络的 CRI 插件。一些常见的 CRI 插件包括：\n\n*   Cilium\n*   Canal\n*   Flannel\n*   Weave\n\
  \nCilium 是开源的，基于 eBPF，目前是最流行的。\n\n### 服务注册与发现\n\nKubernetes 还基于 DNS 实现了原生的服务注册与发现。服务注册（Service\
  \ registration）是将新服务的名称和 IP 注册到 DNS，而服务发现（service discovery）是通过服务名称获取其 IP 地址的行为。\n\
  \n> **说明。** 当说“新服务的名称和 IP 注册到 DNS”时，指的是位于 pod 前端的 `Kubernetes service objects` 的名称和\
  \ IP 地址。这些在前面的章节中介绍过。\n\nKubernetes 服务发现基于两个核心原则：\n\n1. 所有新服务都会自动注册到 DNS\n2. 所有\
  \ pod 和容器都会自动配置使用 DNS 进行发现\n\n为了实现这一功能，每个 Kubernetes 集群都会运行一个名为 `cluster DNS` 的内部\
  \ DNS 服务。它作为一个 Kubernetes 原生应用程序运行，监控 API server 服务对象。当它发现新对象时，会自动将其名称和 IP 注册到 cluster\
  \ DNS。这意味着服务不需要实现任何注册逻辑——cluster DNS 一直监控集群并自动注册所有服务。\n\n同样，Kubernetes 中的每一个容器在需要发现新服务时都会自动配置使用\
  \ cluster DNS。这意味着运行在容器中的应用不需要实现任何特殊逻辑来查找其他服务——它们运行的容器会自动完成所有这一切。\n\n### Kubernetes\
  \ 网络测验\n\n**1.** 哪个 Kubernetes 对象为 pod 提供了稳定的网络？\n\n*   1. LoadBalancer\n*   2.\
  \ Ingress\n*   3. Service\n*   4. pod 网络\n\n**2.** Kubernetes pod 网络是如何实现的？\n\n\n\
  \n\n\n1. 通过外部物理网络\n2. 通过为工作节点分配 IPv6 地址\n3. 通过第三方 CNI 插件\n4. 通过服务网格\n\n### 3. Kubernetes\
  \ 是如何实现服务注册与发现的？\n1. 通过服务网格\n2. CNI\n3. IPv6\n4. DNS\n\n**答案。** 1:C, 2:C, 3:D.\n\
  \n## 章节总结\n\nKubernetes 是一个最初由 Google 开发的容器编排器，并于 2014 年开源并捐赠给了 CNCF。它是第一个从 CNCF\
  \ 毕业的项目，现在是行业标准的编排器，也是 GitHub 上第二大的项目。它还可以编排虚拟机和无服务器函数。\n\n一个 Kubernetes 集群由一个或多个控制平面节点和一个或多个工作节点组成。控制平面节点运行\
  \ `API server`、集群存储、调度器、控制器以及 API 本身。工作节点是用户应用程序运行的地方，并拥有 `kubelet`、容器运行时和 `kube-proxy`。\n\
  \n`API server` 通过 RESTful HTTPS 接口暴露 API，并需要高性能的控制平面节点。所有的内部和外部 Kubernetes 流量都会通过\
  \ `API server`。集群存储是控制平面中唯一有状态的部分，用于持久化集群和应用程序的状态。调度器将 Pod 分配给工作节点，控制器确保集群的观测状态始终与期望状态匹配。\n\
  \n每个工作节点都运行一个 `kubelet`，它监控 `API server` 以获取新任务，并告诉容器运行时启动或停止容器。`kube-proxy` 实现网络规则，以确保指向\
  \ Kubernetes 服务的流量到达正确的 Pod 和容器。\n\n命名空间（Namespaces）是将单个集群划分为多个虚拟集群的好方法，供不同团队和部门之间进行共享。每个命名空间都可以有自己的资源配额和用户账户，但你不应该将它们用作工作负载的边界。\n\
  \n最后，Kubernetes 使用第三方插件来实现开放的扁平 Pod 网络，你应该通过网络策略（network policies）对其进行锁定。\n\n##\
  \ 考试要点\n\n### Kubernetes\n`Kubernetes` 是容器化应用的行业标准编排器。它最初由 Google 开发，现在是 GitHub\
  \ 上正在活跃开发的开源项目。它以控制平面节点和工作节点集群的形式部署，提供调度、自愈、自动伸缩等功能。第三方项目扩展了它的功能，包括虚拟机、无服务器函数等许多编排。\n\
  \n### Pods\n`Pods` 是 Kubernetes 上调度的原子单元。开发者编写应用程序，将其封装为容器，然后将这些容器封装在 Pod 中并在 Kubernetes\
  \ 上运行。一个 Pod 可以封装一个或多个容器，并且 Pod 中的所有容器都保证被调度在同一个节点上。Pod 还充当容器的共享执行环境。这意味着同一个 Pod\
  \ 中的两个容器可以访问相同的卷和网络。如果你想扩展应用程序，只需添加更多 Pod。\n\n### 边 car 容器（Sidecar containers）\n\
  多容器 Pod 模型通常包含一个主应用程序容器和一个辅助容器。辅助容器被称为 `sidecar`（边车），它开启了强大的模式和创新。例如，服务网格技术通过向与应用程序容器相同的\
  \ Pod 中注入 sidecar 容器来工作。sidecar 可以拦截所有网络流量，并透明地进行加密和解密。它还可以暴露丰富的网络遥测数据，用于更好地理解和优化流量流。许多其他解决方案也使用了\
  \ sidecar。\n\n### 控制平面节点\n`Control plane nodes` 是所有控制平面服务运行的地方。事实上，为了高可用，每个控制平面服务都运行在每个控制平面节点上。它们可以是物理服务器、虚拟机，甚至是云实例，你应该运行\
  \ 3 个或 5 个以实现高可用。你应该将它们分散在不同的故障域。如果你运行的是托管 Kubernetes 集群，控制平面节点将由你的云平台管理。\n\n###\
  \ 控制平面\n`The control plane` 是组成 Kubernetes 智能的服务集合。这些服务包括 `API server`、`scheduler`、集群存储、`API`\
  \ 和控制器。每个服务都高度专业，只做一件事。所有控制平面服务都运行在所有控制平面节点上。\n\n### API server\n`API server` 通过\
  \ HTTPS 上的 RESTful 端点暴露 Kubernetes API。它是作为控制平面一部分运行的服务，是 Kubernetes 通信的核心枢纽。例如，所有发送给\
  \ Kubernetes 的命令和请求都会发送到 `API server`。即使是内部控制平面服务也只能通过 `API server` 互相发送消息。\n\n\
  ### 调度器\n`scheduler` 是一个将 Pod 分配到工作节点的控制平面服务。它实现了高级逻辑，能够对哪些节点是 Pod 的最佳选择做出智能决策。\n\
  \n### 集群存储\n`cluster store` 是控制平面中唯一有状态的部分，用于保存集群和应用的状态。它通常基于 `etcd` 分布式数据库，并在每个集群节点上运行一个副本。\n\
  \n### 控制器\n`Controllers` 作为控制平面的一部分运行，作为后台调谐循环，确保集群的观测状态与期望状态匹配。这在术语上是为了确保运行在集群上的内容是你所请求的内容。Kubernetes\
  \ 实现了多个控制器，每个控制器都高度专业。常见的控制器包括部署控制器、StatefulSet 控制器、DaemonSet 控制器和作业控制器。\n\n###\
  \ 部署控制器\n`deployment controller` 可能是最常用的 Kubernetes 控制器。它部署并管理无状态工作负载，并提供云原生功能，如弹性能力、自动伸缩和零停机滚动更新。\n\
  \n### StatefulSet 控制器\n`StatefulSet controller` 管理有状态工作负载，并提供云原生功能，如弹性能力、自动伸缩和更新。它还实现了顺序启动、顺序关闭和持久命名等功能。这些对于有状态的应用程序可能有用。\n\
  \n### DaemonSet 控制器\n`DaemonSet controller` 可以保证特定 Pod 的实例始终运行在每个集群节点上。如果集群添加了新节点，DaemonSet\
  \ 控制器会注意到这一点并自动在新节点上启动该 Pod 的实例。一个典型的用例是确保每个集群节点上都运行着日志代理。\n\n### 工作节点\n`Worker\
  \ nodes` 是运行用户应用程序的集群节点。它们不运行任何控制平面服务，但会运行 `kubelet`、容器运行时和 `kube-proxy`。你应该将工作节点分散在不同的故障域，以帮助调度器保持应用程序的高可用。\n\
  \n### Kubelet\n`kubelet` 是运行在每个工作节点上的主 Kubernetes 代理。它监控 `API server` 以获取待运行的新 Pod\
  \ 并报告状态。它还让 `kubectl logs` 命令可以使用容器日志。\n\n### 容器运行时\n`Container runtime` 软件接收本地\
  \ `kubelet` 的指令，在本地节点上启动和停止容器。旧的 Kubernetes 集群总是使用 Docker 作为容器运行时，新的集群实现了容器运行时接口（CRI），允许管理员根据需求选择最佳容器运行时。\n\
  \n### Kube-proxy\n`Kube-proxy` 是每个集群节点上的一个服务，实现了网络规则，使得发送到服务的流量能够到达 Pod。\n\n###\
  \ kubectl\n`kubectl` 是 Kubernetes 的命令行工具。它可以在许多操作系统和平台上运行。\n\n### Kubeconfig\n`kubeconfig\
  \ 文件` 告诉 `kubectl` 可以与哪些集群通信以及使用哪些用户账户进行身份验证。它通常命名为 `config`，位于家目录下的隐藏 `.kube` 文件夹中。\n\
  \nCRI\n\n\n\n\n\n`Container Runtime Interface (CRI)` 是 Kubernetes 实现的一项低级技术，用于使容器运行时层具有扩展性。它允许集群管理员和集群操作人员为他们的应用程序和环境选择合适的容器运行时。\n\
  \n### containerd\n\n`containerd`（读音为“container dee”）是大多数现代 Kubernetes 集群的默认容器运行时。它是\
  \ Docker 的精简版本，仅包含 Kubernetes 所需的部分。`containerd` 的代码是由 Docker, Inc. 捐赠给 CNCF 的。它是一个\
  \ CNCF 毕业项目，也是一个稳定的容器运行时。\n\n### Namespaces（命名空间）\n\n`Namespaces` 允许你将 Kubernetes\
  \ 集群划分为多个称为“命名空间”的虚拟集群。每个命名空间都有自己的一套用户账户和资源配额，它们是在同一组织内不同团队或部门之间共享集群的好方法。然而，它们并不是一个安全的负载边界，因此你不应该使用它们来将生产环境与测试或开发环境隔离开。你也不应该使用它们在竞争性客户端之间划分集群。这是因为一个命名空间中受损的容器很容易影响其他命名空间中的容器。\n\
  \n### Pod network（Pod 网络）\n\n每个 Kubernetes 集群都实现了一种特殊的网络，称为 `pod network`。这是所有 Pod\
  \ 和容器部署到的网络，并且它始终由第三方网络插件实现。存在许多插件，它们都通过容器网络接口（CNI）进行插件化。每个 Kubernetes 集群恰好有一个 pod\
  \ 网络。\n\n### CNI\n\n`Container Network Interface (CNI)` 是一是一项低级技术，允许第三方使用先进技术和功能构建\
  \ Pod 网络。例如，某些 CNI 插件实现了双栈 IPv4 和 IPv6 网络，而另一些可能只实现 IPv4。\n\n## Recap questions（回顾问题）\n\
