  \ 下列哪一项是 GitOps 环境中的反模式？\n* 1. 在拉取请求上发表评论\n* 2. CD 流水线\n* 3. 使用 GitHub 仓库\n* 4.\
  \ 对现网环境进行手动更改\n\n### 15. 下列哪一项是 Linux 创始人 Linus Torvalds 创建的开源版本控制系统？\n* 1. GitHub\n\
