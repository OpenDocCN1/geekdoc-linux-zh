  \ exporter\n4. Prometheus alert manager\n\n## 26. 你有几个第三方应用程序需要集成到你的 Prometheus\
  \ 监控环境中。以下哪些方案会有帮助？\n1. Prometheus pushgateway\n2. Prometheus 客户端库\n3. 一个 Prometheus\
  \ exporter\n4. Prometheus alert manager\n\n## 27. 下列哪些是云原生成本管理的三支柱？请选择三个。\n1. 选择合适的基础设施\n\
  2. 规模调优 (Rightsizing)\n3. 年付付费\n4. 关闭未使用的资源\n\n## 28. 你正在部署一个新的非业务关键 CI/CD 流水线。部分内容是构建服务器，你需要尽可能降低成本。以下哪种实例类型成本效益？\n\
  1. 按需付费实例 (On-demand instances)\n2. 竞价实例 (Spot instances)\n3. 预留实例 (Reserved instances)\n\
  4. 无服务器实例 (Serverless instances)\n\n## 29. 下列哪种通用云实例可以通过长期承诺换取折扣？\n1. 按需付费实例 (On-demand\
  \ instances)\n2. 竞价实例 (Spot instances)\n3. 预留实例 (Reserved instances)\n4. 无服务器实例\
  \ (Serverless instances)\n\n## 30. 下列哪些技术可以帮助应用程序和基础设施的规模调优？\n1. CI/CD\n2. 自动伸缩\
  \ (Autoscaling)\n3. 自愈能力 (Self-healing)\n4. 预留实例 (Reserved instances)\n\n## 31.\
  \ 在配置基础设施的自动伸缩时，以下哪些是重要的？请选择两个。\n1. 请求响应时间\n2. 设置上限和下限\n3. 观察正确的指标\n4. 使用预留云实例\n\
  \n# 考试\n\n本章节帮助你准备并通过考试。它分为以下：\n* 考试领域和能力\n* 关于考试\n* 预订考试\n* 参加考试\n* 获取结果\n* 保持联系\n\
  \n## 考试领域和能力\n\nKCNA 的总体目标是测试并证明你对以下广泛主题的理解：\n* 云原生和微服务架构\n* Kubernetes 架构\n* 更广泛的\
  \ Kubernetes 和云原生格局（CI/CD、GitOps 等）\n\n考试测试以下主题，这些主题直接映射到各个领域：\n\n### Kubernetes\
  \ 基础 (46%)\n* Kubernetes 资源\n* Kubernetes 架构\n* Kubernetes API\n* 容器\n* 调度\n\n###\
  \ 容器编排 (22%)\n* 容器编排基础\n* 运行时 (Runtime)\n* 安全\n* 网络\n* 存储\n\n### 云原生架构 (16%)\n*\
  \ 自动伸缩\n* 无服务器 (Serverless)\n* 社区与治理\n* 角色与画像\n* 开放标准\n\n### 云原生观测性 (8%)\n* 遥测与可观测性\n\
  * Prometheus\n\n### 成本管理 (8%)\n* 应用程序交付基础\n\n## 关于考试\n\n以下是关于考试的重要细节：\n* **交付方式**：通过安全浏览器远程进行\n\
  * **类型**：多选题\n* **时长**：90 分钟\n* **及格分数**：75%\n* **有效期**：3 年\n* **费用**：250 美元，包含一次免费重考\n\
  \n考试是一场在线的、受监考的多选题考试。这意味着你通过互联网远程参加，并由人员远程监控你的桌面、视频和音频。你需要下载一个安全浏览器，且没有在授权测试中心考试的选项。\n\
  \n所有问题都是多选题，大多数问题有 4 个备选项。没有需要你输入答案的问题，也没有实操模拟类题目。\n\n一旦开始考试，你就有 90 分钟完成所有问题。平台允许你标记需要稍后查看的问题。你必须在\
  \ 90 分钟结束前检查并提交所有问题的答案。\n\n你需要获得 75% 或以上的分数才能通过考试，你将在考试后 24 小时内收到分数。对于本可以给出即时结果的在线考试来说，这令人沮丧。通常需要近\
  \ 24 小时才能收到结果，所以不要整天坐在收件箱或考试门户旁刷新。\n\n## 预订考试\n\n你可以在以下链接预订考试，流程如下：\n1. 购买考试\n2.\
  \ 预订考试日期\n3. 准备并完成考前清单\n4. 参加考试\n\nhttps://training.linuxfoundation.org/certification/kubernetes-cloud-native-associate/\n\
  \n考试费用为 250 美元，建议你尽快预订，并将日期作为动力和目标。但是，如果日期临近你认为还没准备好，可以提前 24 小时重新安排，无需支付额外费用。如果你第一次没有通过，你还获得一次免费重考的机会。\n\
  \n\n\n\n\n当你购买考试后，你将收到来自 `The Linux Foundation Training`（邮箱 `<noreply@mail.linuxfoundation.org>`）的确认邮件。邮件标题为“Order\
  \ Confirmation”（订单确认），其中包含一个按钮会将你带到 Linux Foundation 门户，你可以在那里完成以下所有操作：\n\n*   同意全球候选人协议（Global\
  \ Candidate Agreement）\n*   验证您的姓名\n*   安排考试日期\n*   检查您的系统要求\n*   阅读候选人手册和其他重要说明\n\
  \n我强烈建议你尽快完成所有考前要求，这样你就能为考试做好准备，而必在在考试当天完成大量的行政性工作。\n\n在安排考试时，你将看到一个日历视图，你可以如图 7.1\
  \ 所示选择可用的日期和时间。\n\n![](img/images----figure7-1.png)\n\n图 7.1\n\n一旦预约成功，考试将显示在你 Linux\
  \ Foundation 门户的仪表板中，如果需要，你可以在那里重新安排。\n\n你应该练习在计划用于考试的机器上登录 Linux Foundation 门户，并运行内置的系统检查程序以确保你的机器（包括视频和音频）符合要求。在检查系统要求时，你可能需要在音频测试期间说话以证明你的麦克风工作正常。\n\
  \n考试将通过专用的安全浏览器进行，该浏览器无法在移动设备上运行。这可能包括 iPad Pro 等设备，因此你应该务必检查这一点，并准备另一台机器，以防安全浏览器无法工作。\n\
  \n## 参加考试\n\n考试当天最重要的事情是提前准备好一切，并尽情享受其中。不要压力太大，放松并享受这个时刻。\n\n考虑到这一点，你应该在考试当天之前完成所有考前准备，这样你就可以在当天放松心情，而不必担心完成长长的待办列表。\n\
  \n参加考试的高级流程如下。我包含了一些建议步骤，以确保你的考试体验尽可能顺畅：\n\n*   确保你已准备好有效的身份证明文件\n*   考试前一晚睡个好觉\n\
  *   在考试前至少一小时空出你的日程\n*   根据考试要求准备房间\n*   选择你的座位并确保其符合考试要求\n*   在开始考试前确保你已进食并进行了任何如休息，以便在考试期间感到舒适\n\
  *   在透明容器中准备好清澈的饮料，以防你在考试期间需要饮水\n*   重启你将用于考试的机器\n*   关闭任何可能干扰或消耗网络带宽的必要后台进程\n*\
  \   确保家中没有人通过网络流媒体或玩游戏\n*   登录你的 Linux Foundation 门户并点击 `Take Exam`（考试）按钮（你可以在正式开始时间前\
  \ 15 分钟开始）\n\n当你点击 `Take Exam` 按钮时，你将下载考试的安全浏览器。然后你需要使用摄像头拍摄几张周围环境的静态照片和视频，并将它们上传到系统。这可能需要大约\
  \ 10 分钟，在此期间你应该放松，因为考试时你需要保持冷静和放松。\n\n随后你将被分配一名监考（监控你考试的人），他们将通过浏览器中的实时聊天功能与你交流。这是基于文本的聊天，而不是音频。监将在授权你开始考试之前会检查你上传的照片和视频。如果你的任何照片或视频不符合要求，你可以重新拍摄新的并上传。\n\
  \n一旦监考对你的身份证明和环境满意，他们将授权你开始考试。\n\n考试期间请注意你的屏幕分辨率，特别是当使用小型显示器时。我在 12 英寸的 MacBook\
  \ 上参加考试，没有意识到某些答案选项在屏幕底部之外，我必须滚动屏幕才能看到它们。这在大多数屏幕上不是问题，但请注意大多数问题有 4 个可能的答案，因此务必检查是否有位于屏幕底部且你看不见的答案。\n\
  \n如果你对任何问题的答案不确定，可以将其标记为待评审。然后你可以继续做其他问题，并在最后重新查看这些标记为待评审的题目。显然，你必须在时间结束前提交所有答案，包括标记为待评审的答案。\n\
  \n一旦你完成考试，监考将回到实时聊天并授权你离开。然后你将收到一份简短的调查需要完成。\n\n## 获取结果\n\n尽管这是一场在线多选题考试，但评分过程花费整个\
  \ 24 小时是正常的。一旦结果出炉，你将收到一封邮件并可以在 Linux Foundation 门户中查看。希望你获得及格分数并为此此庆祝。\n\n## 保持联系\n\
  \n我非常期待你参加 KCNA 考试，并希望听到你的考试体验和结果。\n\n我还会根据你可能提供的任何提示和建议更新这本书。\n\n通过邮件 `kcnabook@nigelpoulton.com`\
  \ 与我联系。\n\n# 8: 示例测试\n\n本章包含一个示例测试。问题的格式与真实的考试题相似，但它们不是真实的考试题。在网上或书籍中发布真实的考试题违反了考试规则，这也是我绝不会做的事。我有兴趣帮助你获得真正的技能和真正的资历——我没有兴趣帮助任何人作弊通过考试。\n\
  \n我建议采取以下措施以从此示例考试中获得最大的收益。\n\n*   准备笔和纸来记录你的答案\n*   在开始前在纸上写下数字 1-60\n*   在纸上写下每个答案\n\
  *   为自己计时（90 分钟）\n\n题目的数量与考试中每个主题的权重相匹配。例如，“Kubernetes 基础”领域占考试的 46%，因此本测试中有 46%\
  \ 的问题关于 `Kubernetes fundamentals`。\n\n问题的答案位于第 175 页（在质书中），并包含了解释。\n\n祝你好运，练习愉快。\n\
  \n1. 以下哪些概念在设计和构建自愈能力系统时是重要的？选择所有正确答案。\n\n1. 期望状态 (Desired state)\n2. 调解 (Reconciliation)\n\
  3. 迭代 (Iteration)\n4. 观测状态 (Observed state)\n\n2. 你正在一个运行 `containerd` 容器运行时环境中部署新应用程序，并被要求尽可能安全容器。以下哪些技术可能有帮助？选择两个正确答案。\n\
  \n1. Seccomp\n2. SSL\n3. 权限下降 (Capability dropping)\n4. 安全 Shell (Secure Shell)\n\
  \n3. Kubernetes 使用什么作为默认和首选的服务发现方法？\n\n1. 环境变量\n2. 键值对\n3. DNS\n4. IPv6\n\n4. 你准备部署一个新的\
  \ Kubernetes 集群。以下哪一点对于控制面很重要？选择两个答案。\n\n1. 它在本地运行\n2. 它是高用的\n3. 你运行至少两个控制面节点\n\
  4. 它是高性能\n\n5. 你需要确保 Kubernetes 集群能够动态添加节点以应对性能峰值。你正在云端运行并知道它支持 Kubernetes 节点池。你需要配置哪种\
  \ Kubernetes 技术以便节点池可以伸缩？\n\n1. 水平节点自动伸缩器 (horizontal node autoscaler)\n2. 水平 pod\
  \ 自动伸缩器 (horizontal pod autoscaler)\n3. 集群自动伸缩器 (cluster autoscaler)\n4. 垂直自动伸缩器\
  \ (vertical autoscaler)\n\n6. 你需要部署一个用于存储和分析跟踪数据的工具。你刚刚被告知该技术也已从 CNCF 毕业。你应该部署哪一个？\n\
  \n1. Rook\n2. Linkerd\n3. Jaeger\n4. Envoy\n\n\n\n### 7. 你的一名安全工程师，被要求提供一个在云原生工作负载中存在但在传统单体应用中不存在的威胁向量。你会使用哪一个？\n\
  \n* 1. 共享内核\n* 2. 防火墙突破\n* 3. 软件漏洞\n* 4. 未补丁的服务器和应用程序\n\n### 8. 你正寻找一名具有实操经验的团队成员，他需要理解整个应用程序及其生命周期，并能带来安全优先的方法。你应该发布以下哪种职位广告？\n\
  \n* 1. 云原生架构师\n* 2. DevSecOps 工程师\n* 3. 数据工程师\n* 4. 系统管理员\n\n### 9. 你正在编写一个业务案例，提议对现有应用程序进行重构以实现云原生化。这将带来哪些收益？选择所有正确答案。\n\
  \n* 1. 应用程序韧性\n* 2. 自动扩缩容\n* 3. 减少对变更的人工干预\n* 4. 更好地了解应用内部运行状况\n\n### 10. 以下哪些项是\
  \ OCI 规范？\n\n* 1. `image-spec`\n* 2. `distribution-spec`\n* 3. `pod-spec`\n* 4.\
  \ `runtime-spec`\n\n### 11. 服务网格（service meshes）是如何增强 Kubernetes 工作负载的？\n\n* 1.\
  \ 对所有 Kubernetes 集群强制 `KubeBench` 最佳实践\n* 2. 向每个应用 Pod 注入侧边容器（sidecar container）\n\
  * 3. 自动扫描每个容器的镜像\n* 4. 实现自动化测试流水线\n\n### 12. 以下哪些是容器运行时（container runtimes）的示例？选择所有正确答案。\n\
  \n* 1. ESXi\n* 2. `Docker`\n* 3. Kubernetes\n* 4. `containerd`\n\n### 13. 你领导一个新项目，在容器上构建微服务应用程序。然而，你刚刚了解到严格的安全要求以及对共享内核的担忧。你可以做什么？\n\
  \n* 1. 确保项目使用命名空间容器（namespaced containers）\n* 2. 确保项目使用虚拟化容器（virtualised containers）\n\
  * 3. 确保项目运行在 Linux 节点上\n* 4. 确保项目运行在 FreeBSD 节点上\n\n### 14. 以下哪个容器运行时会将每个容器创建在自己的虚拟机中？\n\
  \n* 1. `Docker`\n* 2. `RunC`\n* 3. `Kata containers`\n* 4. `CRI-O`\n\n### 15. 你准备部署一个运行版本\
  \ 1.23 的新 Kubernetes 集群。你能够安全地使用哪些版本的 `kubectl` 来管理它？选择所有正确答案。\n\n* 1. 1.19\n* 2.\
  \ 1.24\n* 3. 1.25\n* 4. 1.22\n\n### 16. 你正在设计用于托管微服务应用的基础设施，并被告知所有容器之间的流量都必须加密。以下哪项可以实现这一点？\n\
  \n* 1. 强制每个应用程序加密其自身的流量\n* 2. 使用 `CRI-O` 容器运行时\n* 3. 部署服务网格\n* 4. 使用 Kubernetes\
  \ 网络策略\n\n### 17. 将以下云原生安全的“4C”排序，从你通常拥有最大控制权的项开始，到你通常拥有最小控制权的项结束。\n\n* 1. 代码、容器、集群、云\n\
  * 2. 代码、集群、容器、云\n* 3. 云、容器、集群、代码\n* 4. 集群、容器、云、代码\n\n### 18. 你正在为一些新应用部署 Kubernetes\
