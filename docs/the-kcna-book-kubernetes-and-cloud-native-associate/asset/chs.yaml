- "# KCNA Book：Kubernetes 与云原生认证指南指南\n\n\n\n![](img/title_page.jpg)\n\n![KCNA 籍](img/title_page.jpg)\n\
  \n\n\n\n此书可在 [`leanpub.com/thekcnabook`](http://leanpub.com/thekcnabook) 购买\n\n\
  此版本发布于 2022-03-23\n\n\n\n\n\n# 入门\n\nKubernetes 和云原生技术正风靡，并塑造着我们工作的世界。将应用程序构建为小型、专门、单一用途的服务，并使其能够自愈、自动伸缩且在不停止机机的情况下定期更新，这将带来巨大的收益。然而，掌握利用这些技术的知识和技能对你个人的职业生涯来说是一个巨大的助力。例如，了解如何设计、构建和排错运行在\
  \ Kubernetes 上的云原生微服务应用程序，可以让你在最好的机构、最好的项目上获得最好的职位。它甚至能让你赚到更多钱。\n\n考虑到这一切，云原生计算基金会（CNCF）设计了\
  \ KCNA 考试和认证，作为你证明自己掌握这些技术能力的一种方式。\n\n本书以组织良好且简洁的格式，在一个地方涵盖了所有的考试目标。它既可以作为复习指南，也可以作为学习新技术和概念的起点。例如，如果你已经了解\
  \ Kubernetes 的基础知识，这本书将强化你已经掌握的所有内容，并通过大量的测验和解释来测试你的知识。然而，如果你对考试中的任何主题都比较陌生，这本书将带你快速进入状态。\n\
  \n## 本书适合谁读\n\n本书适合任何想要获得 KCNA 认证的人。\n\n由于考试测试的是你对核心技术和概念的理解，它适用于任何从事技术工作的人。示例包括：\n\
  \n* 架构师\n* 管理人员\n* 技术营销\n* 开发人员\n* 运维人员\n* DevOps, DevSecOps, CloudOps, SRE 等\n\
  * 数据工程师\n* 更多……\n\n如果你来自传统的 IT 背景并想学习 Kubernetes 和云原生的基础知识，那么这本书和考试将特别有用。\n\n如果你是\
  \ Kubernetes 的纯新手，你应该考虑阅读*快速上手 Kubernetes*（*Quick Start Kubernetes*）。它只有 100 页，将让你快速进入状态并\
  \ 100% 熟悉 Kubernetes 的基础知识。它还有非常易懂的上手示例，真的能帮助你掌握一些对你来说可能是新的概念。它在 Amazon 和 Leanpub\
  \ 上架，并有多种语言，包括法语、意大利语、葡萄牙语、俄语、简体中文、西班牙语以及更多即将推出。\n\n## 本书是如何组织的\n\n本书的技术内容按每个考试领域分为一个章节。有一个章节专门用于让你准备考试，还有一个包含\
  \ 60 题的**完整模拟考试**，与真实考试一样。\n\n每个技术章节的结构如下：\n\n* 技术内容\n* 章节总结\n* 考试要点\n* 练习题\n\n\
  *考试要点*是对所学主要主题的总结，可以在进行最后的复习和备考时像抽闪卡一样使用。\n\n练习题测试你对所学主题的掌握情况，其风格与考试中的题目相似。然而，它们不是真实的考试题。\n\
  \n专门用于准备和参加考试的章节详细解释了考试的真实情况，这样你在考试当天就不会有任何意外。\n\n模拟考试是你测试自己是否准备好参加真实考试绝佳机会。再次强调，这些题目*像*你将在考试中看到的题目，但它们不是真实的考试题。\n\
