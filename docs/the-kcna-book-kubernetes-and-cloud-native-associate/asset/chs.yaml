  * 4. Serverless 函数\n\n**4.** 下列哪个项目允许 Kubernetes 编排虚拟机工作负载？\n\n* 1. OpenFaaS\n*\
  \ 2. KubeVirt\n* 3. Cilium\n* 4. Knative\n\n**5.** 哪两个项目允许 serverless 函数在 Kubernetes\
