    ## SSD


    固态硬盘（或 SSD）与普通的旋转驱动器显著不同，其要求也与传统磁盘完全不同。其一，它们甚至不是磁盘。


    对于旋转驱动器要读取磁盘上不同位置的两个扇区，读头必须定位到正确的位置，等待旋转盘片转到正确位置，读取扇区，然后重新定位到第二个扇区，再次等待盘片转到正确的偏移量，然后读取第二个扇区。这种等待被称为*寻道时间*（seek
    time）。


    SSD 没有移动部件。当你从驱动器的两个不同部分读取数据时，驱动器的寻道时间为零。大多数 SSD 获得较高的读写速度是因为它们并发地读写多个存储单元。为了保持多个内存单元处于忙碌状态，操作系统必须向驱动器提供一个待完成的任务队列。


    对于一个普通的旋转驱动器来说，拥有“深度”队列是有害的。这意味着请求数据到写入或返回数据之间的时间较长，因为必须等待队列中前面的工作完成。通过较低的队列深度，更重要的任务项可以到达队列前端，插在正在排队等待的次要任务之前。然而，要充分利用
    SSD 的性能，队列深度必须足够高，以确保每个单元都能分配到工作。如果没有满队列，你就无法获得包装盒上吹嘘的性能。


    与位于盘片上固定位置扇区的旋转磁盘不同，SSD 是一个不可移动闪存单元阵列。SSD 使用 FTL（闪存转换层）将磁盘上的逻辑位置映射到包含存储数据的特定闪存单元。虽然
    SSD 声称拥有与旋转磁盘器相同的逻辑块地址（LBA），但 FTL 为它们提供了这些 LBA。SSD 上的 LBA 与旋转磁盘相比与现实的关系更小。


    由于闪存单元会磨损，几乎所有 SSD 包含的存储空间都比盒上声称的多。驱动器将数据分散在单元中，以便磨损更均匀。一旦所有空间被占用，垃圾回收程序就会运行。垃圾回收程序找到不再被引用或操作系统通过
    TRIM (SATA) 或 UNMAP (SCSI) 命令标记为未使用的单元，并清除它们供后续使用。


    当你将 SSD 或支持 TRIM 的其他设备添加到 ZFS 池时，FreeBSD 默认会对整个分区或设备进行 TRIM 操作，使其从已知状态开始。这可能会导致驱动器在使用之前出现几分钟甚至几小时的延迟。如果你的设备是新的，或者你不想在将它们添加到池时对其进行
    TRIM，请在将设备添加到池之前，将 `sysctl vfs.zfs.vdev.trim_on_init` 设置为 0。


    ## NVMe


    非易失性内存表达式（或 NVMe）是一种较新技术，旨在进一步提高固态存储速度。它用于闪存驱动以及其他非易失性内存如 Intel 的 3D Xpoint。NVMe
    本身是一种物理接口规范，是 SATA 或 SCSI/SAS 的替代方案。你会发现连接 PCI-e 总线的 NVMe 线缆和适配器。


    SSD 最慢、最复杂且容易出错的部分是 FTL。假装得像 1980 年代的旋转磁盘一样真是一项苦力活。NVMe 通过放弃这种笨拙的伪装，转而采用闪存内存协议提高了性能。


    NVMe 设备与 SSD 之间最大的区别之一是 NVMe 设备具有多个队列，通常每个 CPU 有一个读队列和一个写队列。与其试图保持一个包含足够占据多个单元任务的单队列，NVMe
    拥有多个队列。NVMe 队列可以保持较浅，以允许高优先级任务取代旧工作。将负载分散到各个 CPU 上有助于获得更强大的性能。


    虽然 HDD 和 SSD 使用 AHCI 接口（AHCI 每个设备具有 64 个命令的单队列），但 NVMe 接口允许多达 65536 个队列。NVMe 接口需要更少的锁同时提供了更大的并行性。FreeBSD
    的 nvme 驱动出现在 9.2 版本。像硬盘一样，你可以预计第一个 nvme 设备是 `/dev/nvme0`，第二个是 `/dev/nvme1`，依此类推。NVMe
    原生支持命名空间，允许将其划分为逻辑命名空间，类似于分区。与计算一切不同，NVM Express 规范从 1 开始命名空间。只有较新的 NVMe 设备支持管理空间。当前设备只有一个命名空间。


    ## 查看 NVMe 设备


    使用 nvmectl 管理 NVMe 设备。首先列出连接到系统的 NVMe 设备。


