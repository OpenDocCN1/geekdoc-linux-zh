  - '[PAGE 43]


    # Permission Sets


    Running zfs allow presents a list of over 60 permissions you can grant a user.
    We won’t list them all here, but you can grant access to each zfs(8) subcommand
    and each pool and dataset property individually.


    Rather than granting a long list of permissions to each user, and inevitably forgetting
    one, ZFS allows you to define sets of permissions. Use the -s flag and give a
    permission set name, beginning with the @ sign. Then list the permissions in that
    set, and the name of the dataset that permission set is valid for.


    ```

    # zfs allow -s @permissionset permission.permission.permission...dataset

    ```


    Here we create a permission set called @dataset that includes the permissions
    to manage datasets. It applies to the mypool/teams dataset.


    ```

    # zfs allow -s @dataset create,destroy,mount,rename,snapshot,rollback,clone,promote,hold,release
    mypool/teams

    ```


    Here’s a permission set called @replication that offers the privileges needed
    for replication on that same dataset.


    ```

    # zfs allow -s @replication send,receive mypool/teams

    ```


    The @billing permission set grants access to the normally inaccessible usergrouped
    properties on this dataset.


    ```

    # zfs allow -s @billing userused,grouped mypool/teams

    ```


    Here’s a @quotas permission set that lets someone manage dataset space quotas.


    ```

    # zfs allow -s @quotas userquota,groupquota,quota,refquota,reservation,rerefreservation
    mypool/teams

    ```


    Finally, here’s a permissions set to let people adjust some basic dataset properties.
    Presumably the sysadmin sets these to reasonable defaults, but users might have
    specific datasets with special requirements.


    ```

    # zfs allow -s @basic_properties compression,copies,atime,primarycache,secondarycache
    mypool/teams

    ```


    Once you establish permission sets, you can assign them to users and groups. Here,
    the managers group get access to privileges in the @dataset and @basic_properties
    sets in their dataset.


    ```

    # zfs allow -g managers @dataset,@basic_properties mypool/teams

    ```


    And here, we allow the b111bot user that runs the billing system access to the
    billing permissions set on mypool/teams.


    ```

    # zfs allow -u billbot @billing mypool/teams

    ```'
