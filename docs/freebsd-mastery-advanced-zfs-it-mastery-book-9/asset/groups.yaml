    # 第 8 章：性能


    我们都希望存储系统是快速、功能丰富且无限的。虽然我们还没有达到极限，但在良好的硬件上，ZFS 的功能可以非常快。然而，即使是最好的硬件也可能无缘无故变慢。了解如何使用诊断工具可以帮助你理解系统的性能。也许你无法用手头的设备修复它，但至少你心里清楚哪里出了问题，并可能将部分负载转移到其他地方。


    FreeBSD 包含了检查通用磁盘和文件系统性能的工具，以及 ZFS 特有的工具。你可以通过 `sysctl(8)`、`vmstat(8)` 和相关命令获取详细信息，但我们强烈建议安装
    `zfs-stats` 附加包，以便于解析和处理这些信息。


    一旦你理解了如何评估系统性能，我们将讨论几个 ZFS 性能特性以及它们在何时可能有用。


    在深入评估 ZFS 性能之前，让我们先泛谈谈性能。


    # 什么是性能？


    性能可以被描述为“系统管理工作负载的优劣”。每个系统的负载略有不同，因此即使是相同的硬件执行看似相同的任务，性能也会存在差异。即使你尽力在另一个系统上复制硬件、软件安装和工作负载，别人也能发现它们之间的差异。这正是让基准测试（benchmarking）令人恼的原因之一。


    系统管理员主要关心提高性能。这意味着识别并消除瓶颈。普通计算机有四种基本资源：存储输入/输出（I/O）、网络带宽、内存和 CPU。如果你向系统堆积工作，直到它无法处理更多任务，你实际上是在发现这些资源中哪一个先达到饱和。那个资源就是你的瓶颈。


    提高性能需要识别并转移瓶颈。你总是会遇到下一个瓶颈。如果 CPU 是当前的瓶颈，而你增加了更多的处理能力，计算机就会加速，直到磁盘 I/O 或网络内存达到饱和。你确实提高了性能，是的……但仅限于新硬件允许的范围。


    不同的工作负载可能有完全不同的瓶颈。


    许多系统管理工作需要增强这些资源中的某一个以适应另一个。Lucas 总是将“系统调优”称为“重新排列瓶颈”。¹


    考虑一下 ZFS 压缩。ZFS 压缩减少了系统写入磁盘的数据量。压缩和解压数据会消耗处理器时间。压缩是用存储 I/O 交换 CPU 时间。然而，大多数计算机的处理器能力远超过其可能使用的量。我正在写的笔记本电脑有一个四核处理器，但只有一个中等速度且
    I/O 有限的磁盘。在这个系统上开启压缩是一个显而易见的获。。在一个磁盘 I/O 多于处理器能力的系统上，你可能会做出不同的决定。


    你的存储越复杂，就越能调整和转移瓶颈。你的服务器有六个磁盘控制器，但所有的 I/O 都流向其中一个？重新排列你的数据集，将负载分散到多个控制器上。也许某个特定磁盘饱和了？拆分该负载。也许你的存储池读或写满了，或者读写都满了。添加一个配置适当的
    SLOG 和 L2ARC 来帮助。


    不过，在进行任何更改之前，请调查瓶颈在哪里。如果系统的特定工作负载受限于 CPU 或内存，购买更快的磁盘系统将毫无帮助。如果磁盘读取限制了服务器的性能，为
    ZIL 添加快速 SSD 也不会提高性能。


    系统管理中许多长久问题之一是：是什么在消耗我的磁盘带宽？ZFS 存储池扫描（scrub）可能会影响其他操作，但在日常使用中，ZFS 并对这个问题产生任何新答案。使用
    `top -m io` 来识别密集使用磁盘的进程。最活跃的进程应该是繁忙吗？


    如果你的性能不符合预期，请记住，你的存储系统性能取决于其最慢的组件。你可以拥有非常快的 SAS 控制器和顶级高速硬盘，但可能因为劣质的驱动线而获得糟糕的性能。SATA
    端口倍增器会根据连接磁盘的数量按比例降低性能。仅仅是因为你可以把某些硬件组件连接在一起而已。


