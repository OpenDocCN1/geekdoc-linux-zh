    ## NVMe Performance


    The nvmectl utility also includes a performance testing tool, nvmeftest. While
    you might want to test the performance of a drive, it can demonstrate the advantages
    of multiple queues. Here we use the performance to measure reading speed with
    an increasing number of threads, for each 30 seconds. Each test uses increasingly
    large block sizes. The last column shows the actual throughput for each number
    of threads, in megabytes per second.


    Start with 512-byte blocks.


