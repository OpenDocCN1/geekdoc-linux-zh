    # Picking a VDEV Type


    As discussed in FreeBSD Mastery: ZFS, selecting the correct VDEV type when creating
    your pool is the most important decision you make. It affects the performance
    of your pool, as well as the expansion possibilities.


    A study by Pâris, Amer, Long, and Schwarz (http://arxiv.org/ftp/arxiv/papers/1501/1501.00513.pdf)
    found that to build a disk array that could survive for four years with no human
    interaction, required triple parity RAID. Double parity, even with an unlimited
    number of spares, cannot maintain 99.999% (five nines) reliability over a four-year
    period.


    Combine this consideration with the hardware you have and your expected future
    storage needs.


    # The Importance of Labels


    By labeling drives, you save your future self lot of headache. Label your disks
    and partitions before adding them to a ZFS pool—or, indeed, using them in any
    way, for reasons we''ll discuss through this section.


    Take the case of an unfortunate friend of Jude''s, who created a pool with raw
    device names. When a device failed, he rebooted before replacing the disk. His
    pool looked little different than he expected.


    ```

    # zpool status

    pool: data

    state: DEGRADED

    status: One or more devices is currently resilvered. The pool will

    continue to function, possibly in a degraded state.

    action: Wait for the resilver to complete.

    scan: resilver in progress since Sat 11 17:49:38 2015

    62.0M scanned out 1.57T at 5.16M/s, 87h40m to go

    9.81M resilvered, 0.00% denom

    ```


    ```

    config:

    STATE  READ WRITE CKSUM

    data DEGRADED 0 0 0

    mirror-0 DEGRADED 0 0 0

    spnare-0 UNAVAIL 0 0 0

    5694975301095445325 FAULTED 0 0 0 was /dev/da1

    ```'
  - '[PAGE 10]


    | da7 ONLINE ø ø 856 (resivering)|

    |da14 ONLINE ø ø |

    |mirror-1 ONLINE ø ø |

    |da1 ONLINE ø ø |

    |da13 ONLINE ø ø |


    Originally, the pool had of two mirrors: mirror-0 of da1 and da15, and mirror-1
    of da2 and da14. Disk da1 failed.


    FreeBSD dynamically assigns device nodes at boot. With da1 missing, FreeBSD renamed
    the remaining devices to shift one number lower. Disk da15 became da14, da14 became
    da13, and worst of all, da2 became da1.


    So then mirror-1 contained da1—which was not the same da1 as the faulted disk.
    Once Jude''s Mirror-0 was using its spare (da7) in place of what was used to be
    called da1. Once unfortunate friend put a disk back in place for the failed da1,
    though, da7 became da8.


    ZFS doesn''t use FreeBSD disk names to find the members of each VDEV, instead
    relying on its own on-disk label with a Globally Unique Identifier (GUID). ZFS
    can identify the disk no matter where the operating system puts its device node.
    And the operating system doesn''t care either—it found the disk for you and mounted
    the filesystem; what more do you want?


    This can easily confuse the human operator, though. Suddenly da1 is not the failed
    device, but a perfectly good device in another VDEV entirely! After the operator
    replaces the device and reboots the machine, the replaced drive will almost become
    da1 again. All the device nodes will shift back to their original values. By the
    end of all this, the sysadmin has no idea which disk is which. The only idea he''ll
    have in mind is the need for a stiff drink.'
- md: '

    # Labeling Disks


    FreeBSD provides several ways to label a disk or partition. Some are automatic,
    and some are managed by the user. Each has advantages and disadvantages. One device
    can have multiple labels.


    Once a label is accessed, other label pointing at the same device wither and become
    inaccessible. This prevents accessing a single device by multiple names.


    All of the automatically generated labels are activated by default. If you desire
    to use a manual label, it''s best to disable the manual methods.


    # GPT Label (Manual)


    If the disk is partitioned with a GUID Partition Table (GPT), each partition can
    contain a text label of your choosing. This is authors’ preferred method of labeling
    disks.


    Use gpart(8) to create and label a new partition.


    ```

    # gpart add -t freebsd-zfs -zfs-mirror-1 da2

    ```


    Here we change the label on the existing 2nd partition.


    ```

    # gpart modify -i 2 -f01-serialnumber da2

    ```


    Manual labels help identify disks by characteristics such as physical placement
    or serial number.


    If you use GPT labels, we recommend disabling GPTID and disk ID labels.


    # GPTID Label (Automatic)


    With the GPT partitioning scheme, each partition has a unique GUID. The GPT labeling
    system uses the GUID to identify partitions. The problem is that GUIDs mean little
    to a human. By looking at a few, you can see that it can be hard to spot the differences.


    ```

    ada0p1: /dev/gptid/b305e4ff-b889-11e5-002590db872e

    ada1p1: /dev/gptid/b329ff70-b889-11e5-002590db872e

    ada1p2: /dev/gptid/b33db4ac-b889-11e5-002590db872e

    ```


    If only the last few characters of the first segment are actually different, it''s
    easy to confuse yourself.


    If ZFS sees a piece of a pool under a GPT label before seeing that same pool under
    a different label, it uses the GPTID label. This hides your carefully hand-crafted
    labels.


    Disable GPTID labels at boot by adding the following to /boot/loader.conf.


    ```

    kern.geom.label.gptid.enable=0

    ```


    FreeBSD enables GPT ID by default.


    # Disk Ident Label (Automatic)


    While GPT and GPTID labels identify a partition, the Disk Ident (or diskid) labels
    identify an entire disk. The device name is based on the disk''s serial number,
    which is convenient. Unfortunately, any special characters in the serial number—notably,
    spaces—get encoded. This creates very ugly device names. In addition, since the
    label identifies the disk, not a partition, the partition part of the device name
    (p3) is appended, and can be hard to pick out of the device.


    ```

    /dev/diskid/DISK-07013121E6B2BFA14

    /dev/diskid/DISK-%20%20%20%20%20WD-WCC131365642

    /dev/diskid/DISK-%20%20%20%20%20%20%20%20%20Z300HTCE

    ```


    These autogenerated labels can be disabled to block ZFS from using instead of
    your GPT label. Adding the following to /boot/loader.conf:


    ```

    kern.geom.label.disk_ident.enable=0

    ```


    Many people have strong arguments in favor of diskid labels. The authors won''t
    say those arguments are incorrect. We will say diskid labels give both of us a
    headache.


    FreeBSD enables diskid labels by default.


    # Glabel (Manual)


    In addition to the other types of labels, you can also create a GEOM label stored
    in the last sector of a disk or partition. These labels are in a GEOM-specific
    format, called glabel. The advantage to these custom labels is that the do not
    require using the GPT format, so they can work with MBR formatted disks and raw
    disks without partitions. A glabel uses the provider''s last sector.


    Create and view glabel with glabel(8).


    ```

    # glabel label -v mylabel /dev/ada02

    Metadata value stored on /dev/ada02.

    Done.

    # glabel status

    Name Status Components

    gpt/gptboot0 N/A ada0p1

    label/mylabel N/A ada0p2

    gpt/zfs0 N/A ada0p3

    ```


    There is now a /dev/label/mylabel device.


    All labels must be unique. While you can apply the same label to multiple disks,
    only one shows up.


    # DTrace


    Higher-level tuning of some ZFS features requires using DTrace, a program for
    tracing software behavior and performance.


    Knowledge using DTrace with ZFS requires an understanding of the kernel internals.
    This is not a book on either DTrace or kernel internals. Grabbing an existing
    script and running it requires neither.


    We would encourage you to use the output of these DTrace scripts both to solve
    your ZFS problems, and as entry points for choosing which kernel internals. You
    might not need to be a programmer, but a professional sysadmin should develop
    understanding of how the system works.


    Blindly running scripts is exactly the sort of "occult IT" that Lucas rants and
    rails against. That said, he''s exactly how you blindly run a DTrace script.


    DTrace uses kernel modules for the software probes that watch software behaves:
    dtrace.ko and dtraceall.ko. You can load these automatically at boot in loader.conf.
    If the kernel modules aren''t found, the dtrace(1) program automatically loads
    them the first time you run it.


    You must run dtrace as root.


    Copy your script to a file. Then run dtrace -s, giving the script as an argument.


    Hit CTRL-c to interrupt the script.


    You can download all of the DTrace scripts given in this book from Lucas’ GitHub
    repo, linked from zfsbook.com.


    A FreeBSD sysadmin with an understanding of how the kernel works can solve problems
    more quickly and correctly. For an overview of ZFS’ internals, grab the latest
    edition of The Design and Implementation of the FreeBSD Operating System (Addison-Wesley
    Professional, 2014). Similarly, DTrace is a powerful tool well worth learning
    and understanding. We recommend Gregg’s and Mauro’s book DTrace: Dynamic Tracing
    in Oracle Solaris, Mac OS X, and FreeBSD (Prentice Hall, 2011).

    '
  mdcn: '


    # 磁盘标记


    FreeBSD 提供了几种标记磁盘或分区的方法。其中一些是自动的，另一些由用户管理。每种方法都有优缺点。一个设备可以拥有多个标记。


    一旦访问了某个标记，指向同一设备的其他标记就会失效并变得无法访问。这防止了通过多个名称访问同一个设备。


    所有自动生成的标记默认都是激活的。如果您想使用手动标记，最好禁用手动方法。


    # GPT 标记（手动）


    如果磁盘使用 GUID 分区表 (GPT)进行分区，每个分区都可以包含一个您自定义的文本标记。这是作者首选的磁盘标记方法。


    使用 gpart(8) 创建并标记新分区。


    ```

    # gpart add -t freebsd-zfs -zfs-mirror-1 da2

    ```


    在这里，我们更改现有第 2 分区的标记。


    ```

    # gpart modify -i 2 -f01-serialnumber da2

    ```


    手动标记有助于通过物理位置或序列号等特征来识别磁盘。


    如果您使用 GPT 标记，我们建议禁用 GPTID 和磁盘 ID 标记。


    # GPTID 标记（自动）


    在 GPT 分区方案中，每个分区都有一个唯一的 GUID。GPT 标记系统使用 GUID 来识别分区。问题是 GUID 对人类来说意义不大。通过观察其中几个，你会发现很难看出它们之间的差异。


    ```

    ada0p1: /dev/gptid/b305e4ff-b889-11e5-002590db872e

    ada1p1: /dev/gptid/b329ff70-b889-11e5-002590db872e

    ada1p2: /dev/gptid/b33db4ac-b889-11e5-002590db872e

    ```


    如果第一段的最后几个字符实际上不同，很容易产生混淆。


    如果 ZFS 在其他标记下看到某个池之前，先在 GPT 标记下看到了该池，它将使用 GPTID 标记。这会隐藏您精心设计的标记。


    通过在 /boot/loader.conf 中添加以下内容在启动时禁用 GPTID 标记。


    ```

    kern.geom.label.gptid.enable=0

    ```


    FreeBSD 默认启用 GPT ID。


    # 磁盘标识标记（自动）


    虽然 GPT 和 GPTID 标记识别分区，但磁盘标识（或 diskid）标记识别的是整个磁盘。设备名称基于磁盘的序列号，这非常方便。遗憾的是，序列号中的任何特殊字符（特别是空格）都会编码。这创建了非常难看的设备名称。此外，由于标记的是磁盘而非分区，设备名称的分区部分（p3）会被附加在后面，很难从设备中识别出来。


    ```

    /dev/diskid/DISK-07013121E6B2BFA14

    /dev/diskid/DISK-%20%20%20%20%20WD-WCC131365642

    /dev/diskid/DISK-%20%20%20%20%20%20%20%20%20Z300HTCE

    ```


    可以禁用这些自动生成的标记，以防止 ZFS 使用它们代替 GPT 标记。在 /boot/loader.conf 中添加以下内容：


    ```

    kern.geom.label.disk_ident.enable=0

    ```


    许多人支持 diskid 标记有强有力的理由。作者不会说这些观点是错误的。我们只会说 diskid 标记让我们双方都头疼。


    FreeBSD 默认启用 diskid 标记。


    # Glabel（手动）


    除了其他类型的标记外，您还可以创建一个存储在磁盘或分区最后一个扇区的 GEOM 标记。这些标记采用 GEOM 特定的格式，称为 glabel。这些自定义标记的优点是它们不需要使用
    GPT 格式，因此它们适用于 MBR 格式磁盘和没有分区的原始磁盘。glabel 使用提供者的最后一个扇区。


    使用 glabel(8) 创建和查看 glabel。


    ```

    # glabel label -v mylabel /dev/ada02

    Metadata value stored on /dev/ada02.

    Done.

    # glabel status

    Name Status Components

    gpt/gptboot0 N/A ada0p1

    label/mylabel N/A ada0p2

    gpt/zfs0 N/A ada0p3

    ```


    现在有了一个 /dev/label/mylabel 设备。


    所有标记必须是唯一的。虽然您可以对多个磁盘应用相同的标记，但只会显示一个。


    # DTrace


    对某些 ZFS 特性的更高级调优需要使用 DTrace，这是一个用于跟踪软件行为和性能的程序。


    使用 DTrace  ZFS 的知识需要了解内核内部。这既不是一本关于 DTrace 的书，也不是内核内部。获取现有脚本并运行它不需要这些知识。


    我们鼓励您使用这些 DTrace 脚本的输出来解决您的 ZFS 问题，并将其作为选择哪些内核内部的切入点。您可能不需要成为程序员，但专业的系统管理员应该对系统的工作原理建立理解。


    盲目运行脚本正是 Lucas 极力抨击和反对的那种“神秘 IT”。尽管如此，他正是教你如何盲目运行一个 DTrace 脚本的。


    DTrace 使用内核模块作为监控软件行为的软件探针：dtrace.ko 和 dtraceall.ko。您可以在 loader.conf 中在启动时自动加载这些模块。如果找不到内核模块，dtrace(1)
    程序在您第一次运行时它会自动加载它们。


    您必须以 root 身份运行 dtrace。


    将您的脚本复制到文件中。然后运行 dtrace -s，将脚本作为参数。


    按下 CTRL-c 中断脚本。


    您可以从 zfsbook.com 链接到的 Lucas GitHub 仓库下载本书中提供的所有 DTrace 脚本。


    理解内核工作原理的 FreeBSD 系统管理员可以更快、更准确地解决问题。关于 ZFS 内部的概览，请获取最新版本的《The Design and Implementation
    of the FreeBSD Operating System》（Addison-Wesley Professional, 2014）。同样，DTrace
    是一个非常值得学习和理解的强大工具。我们推荐 Gregg 和 Mauro 的书籍《DTrace: Dynamic Tracing in Oracle Solaris,
    Mac OS X, and FreeBSD》（Prentice Hall, 2011）。


    '
