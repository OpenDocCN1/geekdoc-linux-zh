    timing, parent object, and more. If you look at this file with ls(1) the file
    appears to be 4,139 bytes, but that doesn''t include any of the ZFS metadata that
    supports it.


    Now let''s consider a larger, lz4-compressed file.


    # # zdb -ddddd zstore/tmp 3628


    | Object | lvl | iblk | dblk | dsize | %full | type |

    | --- | --- | --- | --- | --- | --- | --- |

    | 3628 | 2 | 16K | 128K | 244K | 100.00 168 | ZFS plain file bonus System attributes
    |


    This starts with basic proof, but dives into the file itself. While this file
    takes 244 KB of disk space, its true size is 896 KB. Compression reduces the amount
    of disk space needed.


    After the Unix information, though, we can get a list of indirect blocks.


    Indirect blocks:


    +   - 0 L0: 0:20ed2c20:00 4000L/1000P F=7 B=19665896/19665896

    - 0 L0: 0:188fc2c00:c000 2000L/8000P F=1 B=19665895/19665895

    - 20000 L0: 0:188fc2f800:c000 2000L/8000P F=1 B=19665895/19665895

    - 40000 L0: 0:188fc2c00:c000 2000L/8000P F=1 B=19665895/19665895

    - 60000 L0: 0:188fc2e00:c000 2000L/8000P F=1 B=19665895/19665895

    - 80000 L0: 0:188fc2d400:c000 2000L/8000P F=1 B=19665895/19665895

    - a00000 L0: 0:188fc32400:c000 2000L/8000P F=1 B=19665895/19665895

    - c00000 L0: 0:20834ca00:e000 2000L/8000P F=1 B=19665896/19665896


    segment [0000000000000000, 0000000000000000] size 896K


    When a file is larger than the recordsize (dblk), ZFS stores it as multiple separate
    blocks. The first column is the offset in the file, in hex. The number 20,000
    in hex is 128 KB. The file in question has an L1 indirect block, and then 128
    KB L0 blocks actually hold the data, the last of which is actually smaller.


    # Examining Specific Files


    Maybe you want to look at a particular file—say, to get what block size it was
    written with. You can easily extract that from z or inode number from ls(1) by
    using the -i flag. However, for some unexpected reason, we''re interested in My
    MySQL data file.


    ```

    # ls -i /var/mysql/nyaahrgh/users.MYI

    ```


    132/var/mysql/nyaahrgh/users.MYI


    This is 132 on the zroot/var/mysql dataset.


    When you''re working from an inode number, the -v flag to zdb(8).


    ```

    # zdb -v zroot/var/mysql 132

