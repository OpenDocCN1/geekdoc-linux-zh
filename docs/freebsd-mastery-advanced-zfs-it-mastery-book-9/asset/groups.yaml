    # 数据集 ZIL 调优 (Per-Dataset ZIL Tuning)


    你可以通过 sync 属性控制数据集是否使用 ZIL。默认设置标准 会告诉数据集使用 ZIL。将 sync 设置为 always 是管理数据最安全的方法，但会有严重的性能代价。


    将 sync 设置为 disabled 会完全禁用该数据集的 ZIL。所有写入都是异步的。永远在任何由数据库或 NFS 使用的数据集上禁用 ZIL。唯一的理由是，如果禁用
    ZIL 解决了你的应用程序问题，请一定要提交错误报告或安装快速的 SLOG。


    在所有情况下，请将 sync 留为标准。你可能有一个。


    ZFS 成为许多不同应用程序（如网络文件系统 NFS 和 iSCSI）的数据存储后端。你可能使用一个卷作为虚拟化系统的驱动器。所有这些不同层都独立运行。虽然它们可以通过常用的系统调用和
