    This pool averages out 104 operations per second, but at this moment it''s doing
    600 operations per second. It''s doing real work!


    ## Virtual Device Activity


    While each pool contains one or more identical virtual devices, the pool''s usage
    of virtual devices might not be identical.


    One common situation is when you have a nearly full pool and add a new virtual
    device to gain more space. The pool''s apparent write performance might then drop
    to that of the new virtual device, rather than the theoretical throughput of the
    entire pool with all its virtual devices. The new virtual device has all of the
    free space, so that''s where the new writes goes. Over time, as you delete old
    files and remove old snapshots, per-VDEV utilization might average out. Depending
    on your workload, however, VDEV utilization might never reach equilibrium.


    To view per-VDEV activity of each pool, add the -v flag after iostat.


    Like regular non-verbose zpool iostat, the first output you get represents the
    average since the system booted. In verbose mode, these numbers look kind of weird.


    ## zpool iostat -v work

    | capacity | operations | bandwidth |

    | alloc free | read write | read write |

    | work | 2.13G 1.81T | 10 87 | 100K 715K |

    | mirror | 1.06G 927G | 5 43 | 50.9K 359K |

    | gpt/zfs0 | | 2 8 | 26.4K 360K |

    | gpt/zfs1 | | 2 8 | 26.4K 360K |

    | mirror | 1.07G 927G | 4 43 | 49.6K 356K |

    | gpt/zfs2 | | 2 8 | 25.0K 357K |

    | gpt/zfs3 | | 2 8 | 26.4K 357K |


    You''ll get a total for the pool, totals for VDEV in the pool, and a number for
    each provider in the pool. Look at the write operations per second your pool.
    The pool as a whole has averaged 10 operations per second system booted. The first
    mirror device is responsible for five of these, the second for four of them. Each
    disk within each virtual device handles two reads per second.


    The write activity looks downright strange. ZFS'' initial data shows that this
    pool averages 87 write requests per second, with 43 coming from each pool. That’s
    not bad—but the per-device values show that each disk averages write requests
    per second. No matter how grotesely you round these values, they aren''t close.


    The short answer is, ZFS'' de-averages are not reliable as numbers. They''re proportionally
    correct. The zpool iostat doesn''t lock in-kernel data structures while measuring
    performance, you''ll get slight variations as the command runs.


    Just as with non-verbose zpool iostat, to see current values you must provide
    an interval at the end of your command line. Here we show the per-device activity
    on the pool work, updating every two seconds.


    ## zpool iostat -v work 2...

    | capacity | operations | bandwidth |

    | alloc free | read write | read write |

    | work | 2.36G 1.81T | 0 69 | 0 147K |

    | mirror | 1.15G 927G | 0 40 | 0 93.6K |

    | gpt/zfs0 | | 0 10 | 0 94.9K |

    | gpt/zfs1 | | 0 10 | 0 94.9K |

    | mirror | | 0 28 | 0 53.3K |

    | gpt/zfs2 | | 0 6 | 0 54.6K |

    | gpt/zfs3 | | 0 6 | 0 54.6K |


    The first mirror VDEV performs I/O operations per second than the second mirror.
    Again, the individual disk numbers don’t add up to the total number of operations
    in the device, but they''re proportionally accurate. Now that you can see how
    well your pools are working, let’s discuss some features that can change well
    your pool performs.


    ## ZFS Prefetch


    The job of a filesystem is to provide data on request. ZFS takes that idea further,
    by getting ready to provide data you''re about to ask. This takes place on two
    levels, per-VDEV and per-file. FreeBSD doesn’t enable per-VDEV prefetch by default,
    enables per-file prefetching.


    ## Per-VDEV Prefetch


    The most time-consuming part of retrieving data from a spinning disk is positioning
    the heads over the tracks. It’s like making a sandwich—slapping peanut butter
    between two slices of bread takes two minutes, but going to the store to get bread
    and peanut butter might take an hour. Now the hardware is physically arranged,
    reading a full track of data off a disk spinning at 5,000 or 10,000 RPM takes
    microseconds.


    Per-VDEV prefetch is an attempt to make moving the heads worthwhile. FreeBSD does
    not use per-VDEV prefetching by default, but if your workload involves complicated
    metadata, large directory trees, or many small files, per-VDEV prefetch might
    help you. Whenever ZFS reads a few blocks off the VDEV, it also reads the few
    blocks after the target blocks, looking for metadata. Any metadata found gets
    into a special per-VDEV prefetch cache. There’s a good chance the requesting program
    will return and ask for that metadata. Each time a program requests prefetched
    metadata, ZFS provides it from the cache, returns to the physical VDEV, and prefetches
    more blocks.


    Per-VDEV prefetched blocks go into a simple Recently Used cache, not the ARC.
    The size of a VDEV’s cache equals the number of storage providers in the VDEV
    times it is tunable vfs.zdev.cache.size. FreeBSD sets this to 0 by default, so
    the cache is not used. Enable the cache by setting this tunable to the desired
    value in /boot/loader.conf. A common value vfs.zdev.cache.size="10M".


    After a reboot, you’ll have a per-VDEV prefetch cache in play.


    The sysctl kstat.zfs.misc.vdev_cache_stats.miss shows how many times ZFS checked
    the per-VDEV cache for metadata and didn’t find it. Similarly, the sysctl kstat.zfs.misc.vdev_cache_stats.hits
    shows how often ZFS found something in the cache.


    Test your workload without per-VDEV prefetch and see how it behaves.


    How much does per-VDEV prefetching preemptively cache? The sysctl vfs.zdev.max
    gives the minimal size of a read from a VDEV. This defaults to 16384, or 16 KB.
    If a program requests a read smaller than this size, per-VDEV prefetching kicks
    in.


    The read isn’t just expanded to 16 KB, however. The sysctl vfs.zdev.cacheshift
    gives the amount of data to be prefetched and searched for metadata. This is a
    bit value, so the default of 16 means 64 KB.


    So, if a program requests a read smaller than 16 KB, ZFS reads 64 KB instead.
    If a program requests a read of, say, 20 KB, no-VDEV prefetching occurs.


    While changing the prefetch values helped performance with some older versions
    of ZFS, in modern ZFS you should almost always leave alone. The authors are aware
    of any situations when changing these values helps, but we know many times when
    changing these values causes suffering.


    ## Per-File Prefetch


    If a program requests the start of a file, it’ll probably want the rest of the
    file before. ZFS’ per-file prefetching tries to anticipate these requests, caching
    the file in the ARC before the program gets around to asking for it. This makes
    ZFS feel more responsive. This is often called ZFS’ intelligent prefetch, or sometimes
    just prefetch. While file-level prefetching might not appear terribly sophisticated,
    most filesystems don’t manage it.


    File-level prefetch increases the size of the ARC. FreeBSD automatically disables
    prefetching on hosts less than 4 GB of RAM, and automatically enables it for hosts
    with 4 GB or more. You can override this by setting the tunable vfs.zfs.prefetch_disable
    to 1 in /boot/loader.conf.


    Prefetch can cause problems on systems that have hundreds of thousands (or more)
    tiny files, such as 64 KB and smaller. You’ll want to disable file-level prefetch
    for such hosts. Those systems are fairly rare, however.


    Normal, file-level prefetch improves performance if your system has sufficient
    memory to support it. You can enable and disable prefetch to test performance,
    but in almost all cases prefetch is helpful.

