    # 清洗（Scrub）与重构（Resolver）性能


    任何在大型企业工作过的人都经历过过完全适用于现代硬件的维护窗口策略的苦扰。Lucas 曾多次在工作期间延迟更换故障的热插拔硬盘，因为公司的维护政策规定周日是进行维护的唯一时间。如果你受限于这类政策，那么让重构（resolvers）和清洗（scrubs）快速完成就至关重要，这样你才能继续你当天的工作。


    清洗和重构具有内置的速率限制，以确保这些操作不会干扰正常运行。如果任何其他进程需要 I/O，这些维护操作就会延迟。加速清洗和重构意味着要限制速率。


    速率限制是一个 `sysctl` 参数，它为该进程的每次 I/O 操作之间留出时间。这种速率限制仅在磁盘非空闲时生效。


    延迟以系统时答（ticks）为单位。每秒的时答数由 `kern.hz` sysctl 控制。该默认值为 1000，尽管许多虚拟机和笔记本电脑用户可能为了提高性能而将其设置为
    100。


    “非空闲”到底意味着什么？磁盘必须持续等于 `vfs.zfs.scan_idle` sysctl 数值的时答时间内没有任何活动。


    `vfs.zfs.resolver_delay` sysctl 控制重构的这种人工延迟，而 `vfs.zfs.scrub_delay` 则处理清洗。默认情况下，清洗在操作之间等待四个时答，而重构延迟两个时答。如果
    ZFS 每次 I/O 睡眠四个时答，那么在非空闲池上清洗产生的最大 IOPS 将是 250 IOPS（每秒 1000 时答除以每次操作四个时答）。其他进程可以在这些阶段执行
    I/O。运行这些操作会进一步延迟清洗或重构。


    其他 OpenZFS 消费者（如 illum）通常使用每秒 100 个时答。FreeBSD 的延迟只有大多数其他操作系统的十分之一。这可能是一个疏忽，而不是刻意的设计决策。


    要消除清洗或重构延迟，请将这些值设置为 0，使你的维护任务与其他任何进程具有相同的优先级。请记住，这些延迟仅在池中存在其他活动时才会触发。


    你可以控制清洗发送到 I/O 调度器的数据量。增加队列深度为 ZFS I/O 调度器提供了更有效运行的机会。`vfs.zfs.top_maxinflight`
    控制清洗的 I/O 队列深度。它的默认值为 32，有些人将其调高到 2048。增加过高会耗尽系统内存，因此在调整清洗时要密切监控系统。


    每个 txg（事务组）在重验证（resverifying）上花费的时间有限。默认情况下，一个 txg 在重验证上花费至少 3000 毫秒。`vfs.zfs.resilver_min_time_ms`
    控制事务组在重验证 I/O 上花费多少时间。当没有进行重验证时，此值会被忽略。


    无论你做什么，最终你都会达到硬件对于工作负载的极限。重新排列瓶颈就像在邮轮船上重新布置甲板椅。在某些船上，你可以为一场精彩的滑板游戏腾出空间。然而，如果这艘船是泰坦尼克号，无论如何移动资源都无法让你浮起来。


    > Lucas 将很多事情称为“重新排列瓶颈”。他通过花费时间和洗涤剂资源来解决“脏衣服”瓶颈。在你读这段字的精确时刻，他几乎肯定正遭受冰淇淋瓶颈的困扰。


    > 这些是平均值，所以不要让 ZFS 认为 2+2=5 的事实让你担心。ZFS 的校验功能计算数学更加准确。


    > 你可以在启动后后更改 `vfs.zfs.dirty_data_max_percent`。它不会以任何方式影响系统性能，但你可以更改它。


    > 并不是 Lucas 记得由于这种愚蠢浪费的每一分钟。也没有列出那些政策浪费了他周末的人员。或者在等待 Kneecappers Inc 对其报价请求的正式回复。


    ## 第 9 章：优化


    学习 ZFS 的系统管理员通常会花时间对 ZFS 的空间使用感到头疼。池化存储、数据集、快照和克隆使得 ZFS 空间利用变得非常复杂，以至于在《FreeBSD
    Mastery: ZFS》中专门用了一整章。当你开始折腾数据集和 zvols 的 `recordsize` 和 `volblocksize` 属性时，利用率可能会直接进入“神秘领域”。


    `volblocksize` 属性给出了 zvol 上一个块的大小。该块的大小应该代表在 zvol 上使用的文件系统块。默认的 `volblocksize`
    为 8 KB，它可以容纳两个 4 KB 或十六个 512 字节的扇区。


    `recordsize` 属性给出了 ZFS 数据集中逻辑块的最大大小。默认的 `recordsize` 为 128 KB，在 4 KB 扇区的磁盘上相当于
    32 个扇区，在 512 字节扇区的磁盘上相当于 256 个扇区。随着 `large_blocks` 特性的引入，最大大小被增加到了 1 MB。许多数据库引擎更倾向于较小的块，例如
    4 KB 或 8 KB。对于此类此类文件的数据集，更改 `recordsize` 是有意义。即使你不这样做，ZFS 也会根据需要自动调整大小。写入 16 KB
    的文件应该只占用 16 KB（加上冗余空间），而不是浪费整个 128 KB。


    块大小与冗余之间的交互意味着磁盘可能会突然填满，尽管它们只占了你预期的数据的 25%。理解为什么需要深入研究。


    ## 镜像（Mirrors）与条带（Stripes）


    镜像和条带需要元数据来附加 ZFS 树，但它们不需要额外的冗余块。我们的 8 KB 使用两个 4 KB 或十六个 512 字节的扇区。


    ## RAID-Z1


    在 4 KB 扇区的 RAID-Z1 池上，8 KB 的数据本身需要两个块。我们需要一个块作为校验数据，总共三个块。RAID-Z1 允许以二的倍数分配块（校验位+1），因此会向上取到四个块。假设你有三盘
    RAID-Z1，如果磁盘是 4 KB 扇区，这种配置意味着你只能填满磁盘。填充会消耗剩余空间。


    在 512 字节扇区的三盘 RAID-Z1 上，同样的 8 KB 占用 16 个块。我们需要一个校验块，总共 17 个块。分配必须能被二整除，所以池分配一个填充块，使总数达到
    18 个块。


    ## RAID-Z2


    在 4 KB 扇区的 RAID-Z2 池上，8 KB 的数据再次占用两个块。我们需要两个块作为校验数据，总共四个块。RAID-Z2 池允许以三的倍数分配块（校验位+1），因此这会向上取到六个块。在四盘
    RAID-Z2 上，你预计能够填满磁盘的一半。但如果你用 8 KB 块填充池，你只能填满 33%。


    ## RAID-Z3


    在具有 4 KB 文件系统扇区的 ZFS 上，数据本身需要两个扇区。该池使用三重校验，因此你需要三个磁盘扇区作为校验数据。对于 4 KB 扇区，RAID-Z3
    允许你以四的倍数分配扇区，因此 ZFS 为这 8 KB 数据分配八个扇区。八个扇区是 32 KB。你无法将这个 zvol 填充超过 25%。只要池有 800
    GB 的物理空间，你可以完全填充一个 200 GB 的 zvol。


    在具有 512 字节文件系统扇区的 ZFS 上，数据本身需要 16 个扇区。它还需要另外三个扇区作为校验数据，总共 19 个扇区。由于分配必须是四的倍数，这次写入将被分配
    20 个文件系统扇区。二十个扇区是 10 KB，给你 80% 的效率。


    '
