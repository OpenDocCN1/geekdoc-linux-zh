    # 网络文件系统


    关于网络文件系统（或 NFS）已经写了整整的书。许多不同的操作系统都支持 NFS，可以作为服务器、客户端或两者兼具。在书中，我们将关注如何通过 ZFS 集成工具提供
    NFS 共享。


    # NFS 配置类型


    你可以使用传统的 FreeBSD `/etc/exports` 文件来管理基于 ZFS 的 NFS 导出，这不会发生发生任何可怕的事情。如果你是一个老 FreeBSD
    高手，`/etc/exports` 甚至可能让你感到更舒服。`zfs(8)` 为你处理了 NFS 管理的许多方面，并在所有 ZFS 平台上工作方式完全相同。


    无论你在主机上如何管理 NFS，我们强烈建议你选择一种方法并坚持下去。不要同时使用 `/etc/exports` 和 ZFS 来管理你的共享。FreeBSD
    会从这两个位置读取共享信息，这使得故障排除变得更加麻烦。


    FreeBSD 主机必须有一个 `/etc/exports` 文件来提供 NFS 共享，即使你完全在 ZFS 内部管理 NFS。获取此文件的简单方法是执行
    `touch /etc/exports`，尽管你可能想要一个只包含注释的 exports 文件，引导其他系统管理员使用 `zfs(8)`。


    就像处理 iSCSI 一样，我们不会完全涵盖 NFS。我们将从 ZFS 的角度涵盖管理 NFS，并在有用的地方与传统的 NFS 配置进行比较。


    # 启用 NFSv2/v3


    如果主机没有运行 NFS 所需的服务，那么在 ZFS 级别启用 NFS 将没有任何作用。在 `/etc/rc.conf` 中设置以下内容以便在启动时启动提供
    NFS 所需的进程。


    ```

    nfs_server_enable=YES

    rpcbind_enable=YES

    mountd_enable=YES

    rpc_lockd_enable=YES

    rpc_statd_enable=YES

    ```


    并不是所有的环境都需要所有这些服务，但开启它们不会消耗许多系统资源，并提供最广泛的兼容性和不错的的性能。


    你还必须通过 `/etc/hosts.allow` 条目允许网络上的主机访问 `rpcbind(8)`。在这里，我允许网络 `203.0.113.0/24`
    访问我的 NFS 服务。


    `rpcbind: 203.0.113.0/255.255.255:0: allow`


    如果没有这个 `hosts.allow` 条目，你的客户端将用无意义的 NFS 错误让你抓疯。


    # 通过 ZFS 配置 NFSv2/v3


    ZFS 是以数据集为单位配置 NFS 的。ZFS 属性 `share` 决定了数据集如何共享。此属性可以设置为 `on`、`off` 或数据集的 NFS 共享选项。


    如果设置为 `off`，ZFS 不为该数据集配置共享。但是，该数据集仍然可以通过 `/etc/exports` 共享。


    将此属性设置为 `on` 会通过 NFS 共享数据集。这等同于通过 `/etc/exports` 列出文件系统。为 `zroot/home` 将 `share`
    设置为 `on` 就像下面的 `/etc/exports` 条目。


    世界上任何一个主机都可以访问并挂载此主机。为我们允许的所有主机设置要明智得多。


    ```

    # zfs share="203.0.113.0/24" zroot/home

    ```


    这将生成类似这样的 `/etc/zfs/exports`。


    ```

    /home 203.0.113.0/24

    ```


    如果你在属性中输入了更复杂的值，请用引号括起来或进行转义。


    ```

    # zfs share="-network 203.0.113.0 -mask 255.255.255.0" zroot/home

