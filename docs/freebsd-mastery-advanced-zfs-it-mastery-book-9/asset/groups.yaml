    # Accessing zvols


    You can''t zfs mount a zvol like you would a filesystem dataset. The whole point
    of a zvol is that it''s a block device. To access it, you must access the device
    node or its GEOM provider. The most common is probably the device node.


    A zvol gets a device node in /dev/zvol1, in a subdirectory named after the pool.
    The device node for our sample zvol, vm/db1, would be /dev/zvol/vm/db1.


    We might assign this zvol storage for a bhyve virtual machine, in which case we''d
    probably let the virtual machine partition the disk.


    For other uses we might want to partition it locally. Here we create a GPT partition
    scheme on the zvol and make it one large partition, with a GEOM label of db1.
    We also assign it a GEOM label.


    ```

    # gpart create -s g /dev/zvol/vm/db1

    zvol/vm/db1 created

    # gpart add -t freebs-ufs -1 db1 /dev/zvol/vm/db1

    zvol/vm/db1p added

    # glabel db1 /dev/zvol/vm/db1

    ```


    As this zvol was created with the default volmode, geom, it''s now also accessible
    by the device node /dev/label/db1.


    Once the partition exists you can create a filesystem on it.


    ```

    # newfs -j /dev/zvol/vm/db1

    /dev/zvol/vm/db1: 2097152.0MB (4294967296 sectors) block size 32768, fragment
    using 3350 cylinder groups of 626.9MB, 20035 blks, 80256 inodes.

    with soft updates

    ```


    Wait—why would we possibly want to use UFS on a zvol?


    Perhaps our iSCSI client or VM guest doesn''t have resources to run ZFS effectively.
    By giving the client a ZFS-backed volume with a filesystem it can support, the
    client gets the additional protections of ZFS even though the client can''t use
    ZFS directly. I enable UFS soft updates journaling with -j, however because ZFS
    data integrity and UFS filesystem journaling protect completely different things.
    ZFS integrity checks make that the writes are safe, but filesystem journaling
    verifies that all the writes are completed.


    Now that the zvol has a filesystem, you can mount it.'
