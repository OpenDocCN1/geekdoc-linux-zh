    # SCSI Enclosure Services


    The most common way to add storage is through a box specifically designed to hold
    hard drives. The most common is the SCSI enclosure (sometimes called a backplane).
    Attach a SCSI enclosure to a host with a disk controller card.


    SCSI enclosures have all sorts of hardware and features in them. You''ll often
    see SAS or SATA port multipliers, allowing you to connect more than four drives
    to each port on the disk controller. You''ll probably see disk bays or trays,
    probably hot-swappable. An enclosure has fans, temperature sensors, power supplies,
    and more. An enclosure might even have its own CPU, running a custom operating
    system specifically designed to corral all of these features. Failed fans and
    power supplies can bring down your storage.


    SCSI enclosures have protocols to communicate with server operating systems. SCSI
    Enclosure Services, or SES, is the modern protocol for monitoring and managing
    the storage subsystem of your server. It''s the successor to the SCSI Accessed
    Fault-Tolerant (SAF-TE) protocol found in older hardware.


    SES is universally integrated into the backplane of the hot-swap bays or in the
    SAS Expander. SES provides a standard way to monitor and locate your disk drives,
    and can also be used to monitor fans, lights, and other devices.


    FreeBSD supports SES with the ses(4) driver. FreeBSD 10.3 introduced sesutil(8),
    letting you examine and control the ses(4) devices on your system.


    # Examining your Enclosure


    Sesutil(8) has many sub-functions. Start with sesutil map, which displays all
    of the devices in all of your enclosures.


    ```

    # sesutil map

    ses0:

    enclosure Name: LSI SAS2X36 0e12

    enclosure ID: 500304801786b87f

    ```


    The first entry for an enclosure is the device name (ses0). If you have multiple
    controllers, a reboot might change the device node, so don''t rely on it to identify
    a specific enclosure. The enclosure name is based on the hardware model, but the
    enclosure ID is unique to this particular piece of hardware.


    Each piece of monitored or controlled hardware in an enclosure is an element.
    Each element is assigned a number. Element numbers do not change at reboot. Here''s
    the first element of one of Jude''s arrays.'
