    # Throttling Writes


    Programs that ask the kernel to write to disk won''t proceed until the kernel
    acknowledges the write request. There are exceptions—in a multithreaded program,
    the write request probably blocks only a single thread. Applications that run
    in multiple simultaneous processes, like Apache, will probably only have a single
    process for I/O. Still, in general, every program or some of the program blocks
    on I/O until the kernel acknowledges the write request.


    In the most common situation, OpenZFS acknowledges receipt of data as soon as
    the data is in a transaction group ready to write to disk. This works well—until
    the underlying hardware can''t keep up with the write requests. You can''t log
    every packet on a saturated gigabit line on a SATA-I drive, some people insist
    on trying.


    When the providers start lagging behind the write requests, OpenZFS artificially
    delays acknowledging receipt of data. The requesting program won''t continue until
    the write request is acknowledged. It hangs for a few milliseconds, or longer
    if needed. Effectively, when a program pushes the kernel too hard, the kernel
    cowers.


    A one-line DTrace script can identify if your system is delaying writes.


    ```

    # dtrace -n fbt:dsl_pool_need_dirty_delay:return'' { @args[1] == 0 ? "no delay":
    "delay" = count(); }

    ```


    Run this script during a performance issue. Let it gather data for a "while”—anything
    from several seconds to a couple minutes. Hit CTRL-C to quit. You''ll get the
    number of artificially delayed writes and the number of not-delayed writes. If
    only a small fraction of your writes are delayed, your performance problems lie
    elsewhere.


    FreeBSD uses sysctl to tweak the delay values, or adjust latency so it''s more
    consistent, but if your hardware is backing up, you''re clearly trying to stuff
    too much data through your storage I/O. Split your writes between more devices,
    add hardware, or improve your hardware.'
