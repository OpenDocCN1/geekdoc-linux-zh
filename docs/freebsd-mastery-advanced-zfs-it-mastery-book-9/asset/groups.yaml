    想要删除源机器上不再存在的远程快照。使用 `-d` 来实现此操作。从删除旧快照开始。


    ```

    local# zfs destroy zroot/somedata@reply

    ```


    使用 `-d` 标志从目标端清理任何已删除的快照：


    ```

    local$ zferfer -vd -T remote -R zroot/somedatemepool/backup

    ```


    在详细模式下，zxfer 会显示每个数据集以及它创建的数据集。


    正在删除快照 remotepool/somedata@reply。


    你可以眼睁睁看着匆忙输入的错误命令销毁了你心爱的数据。


    # 保留旧快照


    常见的快照方案要求每 15 分钟创建一次快照，然后每小时、每天、每周和每月创建一次。（我们在 *FreeBSD Mastery: ZFS* 中讨论了这种旋转方案）。主机在几小时后丢弃
    15 分钟的快照，在几天后丢弃小时快照，以此此类推。你希望在远程主机上丢弃这些 15 分钟的快照，但你可能希望在源删除它们后，让远程主机保留某些快照。我们中的许多人想保留每周或每月的快照作为长期备份。


    `-g` 标志允许你通过一个天数的参数来保护最旧的备份。例如，`-g 375` 告诉 zxfer 不要删除 375 天或或更早的快照。


    假设你想保留所有的月度快照，但自动删除任何从源端删除的其他快照。源端在三个月后删除月度快照，在六周后删除每周快照。六周是 42 天。再为系统异常多留出一周，设置
    `-g 50` 将告诉 zxfer 不要删除任何 50 天或或更早的快照。


    ```

    local$ zxfer -vd -g 50 -T remote -R zroot/somedatemepool/backup

    ```


    最终，你的备份池将会填满。你必须进去清理掉那些老到已经不再有用的快照。这与清理公司的磁带柜没有区别。


    # 属性与灾难恢复


    你通常会想要复制复杂的属性，例如 `sharenfs` 和任何配额（quotas）。`-p` 参数告诉 zxfer 将目标端的属性设置为与源端匹配。


    在某些情况下，你想知道属性是什么，但你不想在复制时立即恢复它们。`zxfer` 命令可以将数据集属性复制到文本文件中，让你稍后从该文件恢复。


    `-k` 标志告诉 zxfer 在副本的根目录下创建属性文本文件。该文件名为 `.zxfer_backup_info`，后面跟着一个句点和池名称。如果你正在将一个整个主机
    `web5` 的 `zroot` 池复制到备份主机上的 `remotepool/web5`，那么属性备份文件将位于 `remotepool/web5/.zxfer_backup_info.zroot`。


    使用 `-e` 标志从此文件中恢复数据集和池属性。


    一种常见的配置是让主机留出一个池来接收备份，然后留出另一个池用于灾难恢复。如果源机器坏了，你可以在本地使用 `zxfer` 将最新的备份复制到灾难恢复池。你可以在
    `zxfer(8)` 手册页中找到完全一致的例子，但这里有一个常见的例子，包括恢复属性。我正在将主机 `web5` 的备份恢复到一个同样名为 `web5`
    的池中。


    ```

    # zxfer -defP -R remotepool/web5/ web5

    ```


    从新的 `web5` 池启动，你就恢复了服务！


    # Zxfer 选项


    `zxfer` 程序有一系列选项来处理各种棘手的情况。


    如果你有复杂的 SSH 设置，你可能需要在 `zxfer` 用户的 `$HOME/.ssh/config` 中设置一些客户端选项。或者，你也可以在单个 `-o
    -t` 中添加这些选项。


    `-o` 和 `-T` 标志也可以用于注入 SSH 选项以及命令行参数。在用户和主机之前的额外参数将为 `zfs(8)` 命令添加前缀。（不过，使用 `sudo`
    配置 ZFS 数据集权限对你更有帮助。）


    ```

    -O ''port=1022 -i /path/to/key/file replication@hotspot''

    ```


    `-f` 标志告诉 `zfs receive` 回滚所有被复制的数据集。如果你更改了被复制的数据集，`-f` 将彻底抹掉那些更改。


    你可以让 `zxfer` 在运行前自动拍摄快照。它不会删除快照，因此它不是一个真正的快照旋转方案。然而，它适用于即时备份，只是将清理问题留到了另一天。添加
    `-s` 让 `zxfer` 对每个复制的数据集拍摄快照。


    最后，`-n` 标志触发空操作（no-op）模式。`zxfer` 程序不会传输或删除任何快照。相反，它会执行分析并打印出如果你没有设置 `-n` 它将做什么。


    既然你已经过过了复制，相比之下，ZFS 卷的问题应该看起来简单了。或者，也许并没有……


    - 1 在你的 IT 员工中安排地理上的高可用性是一个独立的问题。我们建议让大家居家办公。为了获得最佳效果，在斐济岛和塞舌尔群岛等地方为他们买房。把那个不受欢迎的人困在阿拉斯加州的穆斯伯普（Moose
    Base）。

    - 2 那些能够在不将文件系统转回文件系统的情况下读取流文件系统的人，对时间有更好的利用。

    - 3 系统管理员可能会将发生的任何一次问题归咎于“随机网络问题”。这在行为准则中是有规定的。

    - 4 Lucas 会发现让你编造一个符合 ZFS 的晦涩单词是巨大的乐趣。

