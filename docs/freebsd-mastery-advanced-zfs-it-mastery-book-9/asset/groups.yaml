    On a default FreeBSD install, PostgreSQL goes in /usr/local/postgresql/data. For
    a big install, you probably have a separate pool for that data. Here I''m using
    the pool pgsql for PostgreSQL.


    ```

    # zfs create mountpoint=/usr/local/postgresql pgsql

    # zfs create pgsql/data

    ```


    Now we have a chicken-and-egg problem. PostgreSQL’s database initialization routine
    expects to create its own directory tree, but we want particular subdirectories
    to have their own datasets. The easiest way to do this is to let PostgreSQL initialize,
    and then create datasets and move the files.


    ```

    # /usr/local/etc/rc.d/initdb

    ```


    The initialization routine creates databases, views, schemas, configuration files,
    and all the other components of a high-end database. Now you can create datasets
    for the special parts.


    PostgreSQL stores databases in /usr/local/postgresql/data/base. The Write Ahead
    Log, WAL, lives in /usr/local/postgresql/data/pg_xlog. Move both of these out
    of the way.


    ```

    # cd /usr/local/postgresql/

    # mv base base-old

    # mv pg_xlog pg_xlog-old

    ```


    Both of these use an 8 KB block size, and you would want to snapshot them separately
    to create a dataset for each. With MySQL, tell the ARC to cache only the metadata.
    Also tell these to bypass over latency with the logbias property.


    ```

    # zfs create recordsize=8k -o redundant_metadata=most -o primarycache=metadata
    logbias=throughput

    pgsql/data/pg_xlog

    # zfs create recordsize=8k -o redundant_metadata=most -o primarycache=metadata
    logbias=throughput

    pgsql/base

    ```


    Copy the contents of the original directories into the new datasets.


    ```

    # cp -Rp base-old/*

    # cp -Rp pg_xlog-old/* pg_xlog

    ```


    You can now start PostgreSQL.


    ## Tuning for File Size


    ZFS is designed to be a good general-purpose filesystem. If you have a ZFS system
    serving as file server for a typical office, you don''t really have to tune for
    file size. If you know what size of files you''re going to have, though, you can
    make changes to improve performance.


    ### Small Files


    When creating many small files at high speed in a system without a SLOG, ZFS spends
    a significant amount of time waiting for the files and metadata to finish flushing
    to stable storage.


    If you are willing to risk the loss of any new files created in the last five
    seconds (or if your vfs.zfs.txg.timeout is higher), setting the sync property
    to disabled tells ZFS to treat all writes as asynchronous. Even if an application
    asks it not to be told that the write is complete until the file is safe, ZFS
    returns immediately and writes the file along with the next regularly scheduled
    txg.


    A high-speed SLOG lets you store those tiny files both synchronously and quickly.


    ### Big Files


    ZFS recently added support for blocks larger than 128 KB via the large_block feature.
    If you''re storing many large files, certainly consider this. The default maximum
    block size is 1 MB.


    Theoretically, you can use block sizes larger than 1 MB. Very few systems extensively
    tested this, however, and the interaction with the kernel memory allocation subsystem
    has not been tested over prolonged use. You can really try large record sizes,
    but to sue a file report when everything goes sideways. The sysctl vfs.zfs.max_recordsize
    controls the maximum block size.


    Once you activate large_blocks (or any other feature), the pool can no longer
    be used by hosts that do not support the feature. Deactivate the feature by destroying
    any datasets that have ever had their recordsize set to larger than 128 KB.


    Storage systems struggle to balance latency and throughput. ZFS uses a logbias
    of latency to decide which one should lead. ZFS uses by default, that data is
    quickly synched to disk, allowing databases and other applications to continue
    working. When dealing with large files, changing the logbias property to throughput
    might result better performance. You must do your own testing and decide which
    setting is right for your workload.


    ## The Worst of Both Worlds: Bittorrent


    Bittorrent combines the worst parts of large files and the worst parts of small
    files all in one convenient package. Bittorrent''s out-of-order write pattern
    can cause a great deal of dataset fragmentation. Plus, Bittorrent''s 16 KB block
    size can lead to write amplification if the recordsize of the dataset isn''t 16
    KB.


    The best solution to both of these issues is to actually have two datasets. The
    dataset where the files are stored during downloading uses the smaller record
    size.


    ```

    # zfs create -o recordsize=16k -o redundant_metadata=most -o compress=off mypool/torrents/in-progress

    ```


    The dataset where you store completed torrents should have a larger block size.
    Moving files from one to the other defragments the files, resulting in improved
    read performance and avoiding pool fragmentation. Most torrent clients support
    using a separate directory for in-progress downloads, so this should not require
    any action on your part aside from creating the two datasets.


    If you download large files, like operating system ISOs, you might also consider
    a recordsize of 1 MB to further increase performance and amortize.


    ```

    # zfs create -o recordsize=1m mypool/torrents

    ```


    ## Short Stroking


    Regular disks have specific characteristics that cause uneven performance. Short
    stroking is the process of using only a subset of the disk, usually the beginning,
    where the head has less to travel. This can increase throughput.


    ## Chapter 10: ZFS Potpourri


    This chapter covers small topics that didn''t fit anywhere.


    ## Splitting Mirrors


    Combining storage into pools is one of ZFS'' core features. But ZFS lets you perform
    the same action in reverse—splitting mirrored pools. If you want to literally
    clone a machine, or pull off a copy of a mirror to run a backup, or perform some
    other sort of computer science, zpool split is your friend.


    We''ll demonstrate adding disks to a mirrored pool, then split the pool into duplicates.
    You could perform the same task in reverse: pull the disks off a mirror, then
    add them back when you''re done with the duplicate. We recommend maintaining at
    least two providers in each mirrorDEV at all times, however.


    ## Make Mirrors Deeper


    A mirror''s depth describes how many copies of data the mirror includes. This
    pool, a typical mirror, contains two mirrors of two disks each.


    ```

    # zpool status db

    NAME STATE READ WRITE CKSUM

    db mirror-0 ONLINE 0 0 0

    gpt/zfs0 ONLINE 0 0 0

    gpt/zfs1 ONLINE 0 0 0

    mirror-1 ONLINE 0 0 0

    gpt/zfs2 ONLINE 0 0 0

    gpt/zfs3 ONLINE 0 0 0

    ```


    I want to make this pool deeper, adding an additional disk to each VDEV. Use the
    zpool attach command with the pool name, a device already in the target VDEV,
    and the new device.


    ```

    # zpool attach db gpt/zfs1 gpt/zfs4

    # zpool attach db gpt/zfs3 gpt/zfs5

    ```


    In between running these two commands, the pool has one mirror of three devices
    and one mirror of two devices. At the end, the mirror looks like this.


    ```

    NAME STATE READ WRITE CKSUM

    db mirror-0 ONLINE 0 0 0

    gpt/zfs0 ONLINE 0 0 0

    gpt/zfs1 ONLINE 0 0 0

    gpt/zfs4 ONLINE 0 0 0

    mirror-1 ONLINE 0 0 0

    gpt/zfs2 ONLINE 0 0 0

    gpt/zfs3 ONLINE 0 0 0

    ```

