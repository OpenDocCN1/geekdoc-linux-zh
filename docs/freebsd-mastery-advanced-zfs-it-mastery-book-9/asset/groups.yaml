    # Renaming Boot Environments


    Sometimes you want to change the name of a boot environment. Maybe the name you
    picked wasn''t distinctive as you thought, or one of your minions thought to create
    a boot environment but named it FeliciaGoesViking. The beadm rename command lets
    you rename boot environments. Give two arguments: the original name and the new
    name.


