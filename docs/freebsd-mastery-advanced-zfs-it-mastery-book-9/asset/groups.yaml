    \ of the maximum size. (Strictly speaking, the minimum ARC size is half of the\
    \ maximum amount of memory usable for metadata in the ARC, which is one quarter\
    \ of the maximum ARC size.) Use the boot-time tunable vfs.arc_min to set a minimum\
    \ ARC size. Like the maximum size, the minimum size is expressed in bytes. Here\
    \ I set the minimum ARC size to 4 GB in `/boot/loader.conf`.\n\n```\nvfs.arc_min=\"\
    429467296\"\n```\n\nLucas normally sets up lower limits on ARC only when he's\
