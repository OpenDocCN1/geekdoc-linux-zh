- md: '

    The numbers in the first column are block sizes, as shown kilobytes in powers
    of 2. $2^{13} = 8,192$, so it is 8 KB. This metaslab has 281 KB allocations.


    Line 14 is 16 KB. This metaslab has 197 KB allocations.


    Line 15 is 32 KB, with 189 allocations, and so on, all the way up to a single
    $2^{32}$ (or 4 GB) allocation.


    After the histogram of the metaslab in memory, we get to see how the version of
    the metaslab on the disk looks. On a busy disk, ZFS is always allocating and de-allocating
    blocks.


    ```

    On-disk histogram: fragmentation 0

    13: 295 *********************

    14: 198 ********************

    15: 189 *******************

    16: 107 *****************

    17: 29 ****

    18: 3 *

    ```


    32: 1 *

    Scroll down, no. Eventually, you''ll come to a later metaslab that looks considerably
    different. Metaslab, 43 in this case.


    ```

    metaslab 43 offset 56000000000 spacemap 8280 free 59.16

    segments 17893 maxsize 815M freepct 46%

    ```


    This metaslab has 17,893 allocations, but is 46 percent free. And the block size
    distribution is considerably different.


    ```

    In-memory histogram:

    13: 891 *********

    14: 565 *******************

    15: 806 ****************

    16: 994 *********************

    17: 3341 *****************

    18: 1452 *****************

    19: 1932 **********************************

    20: 4406 ************************************

    21: 1557 *****************

    22: 934 *************

    23: 488 ***

    24: 272 **

    25: 103 *

    26: 80 *

    27: 47 *

    28: 19 *

    29: 6 *

    ```


    Our most common allocations are 17 (128 KB) and 20 (1 MB).


    The disk gives a hint why metaslab is only about half full, though.


    ```

    On-disk histogram:      fragmentation 11

    13: 7520 *********************

    14: 5782 *******************

    15: 4096 *****************

    ```


    Note the fragmentation level—11. On the disk, metaslab 43 is fragmented. This
    means that the chunks of free space are relatively small. With spinning disks,
    storing chunks of a file contiguously improves performance. For ZFS needs to write
    a large block, it''ll probably proceed to a later metaslab.


    Even descend further down into the bowels of your metaslabs.


    ```

    metaslab 121 offset f2000000000 spacemap 0 free 128G

    segments 1 maxsize 128G freepct 100%

    In-memory histogram:

    37: 1 *

    ```


    The slabs near the end of the disk are made up of contiguous 128 GB chunks. If
    this pool had previously been nearly full, the higher-numbered metaslabs would
    likely contain bits of data, whereas on this pool, they are untouched.


    ZFS normally divides a VDEV up into 200 metaslabs of equal size. You can tune
    this number with the vfs.zfs.vdev.metaslabs_per_vdev sysctl, but you must set
    the sysctl before creating the VDEV. The number 200 was chosen because it seemed
    to work pretty well, but there''s lots of room for experimenting with metaslab
    allocations.


    When you expand a VDEV by replacing its disks with larger ones, ZFS creates metaslabs
    to support the increased space. You can get a pool with far more than 200 metaslabs
    this way.


    ZFS can only keep so many metaslabs in memory at once. Growing a VDEV to its original
    size can have a negative performance impact, as ZFS shuffles metaslabs to and
    from disk.


