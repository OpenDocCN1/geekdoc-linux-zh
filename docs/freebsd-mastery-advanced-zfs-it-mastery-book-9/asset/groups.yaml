    \ `db` 池，在 `db2` 池中创建一个完全相同的副本。\n\nZFS 会移除每个镜像（mirror）中最近添加的设备，以此创建一个新池。\n\n拆分池不会自动导入新池。一旦你导入了它，拆分后的池看起来如下：\n\
