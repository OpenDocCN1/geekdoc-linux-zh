    that across. This means that if you make a small change to a large file, rsync
    must read and check the entire file on both the local and remote side. Using rsync
    to maintain a copy of 500 GB VM disk image on a backup machine eats a bunch of
    bandwidth and processor time.


    Each block in ZFS has a birthtime, the transaction group ID of when the block
    was created. The replication process sends any block newer than the last time
    replication was run. It doesn’t matter if the blocks come from a new file, or
    the middle of a huge file.


    The advantages of snapshot-based replication really come into play when you regularly
    synchronize filesystems. Suppose you replicate a snapshot on a backup server.
    An hour later, you create a new snapshot and incrementally send that snapshot
    to the backup server. ZFS finishes in a few seconds, while rsync is still walking
    the first level of'
  - '[PAGE 61]


    directories.


    Rsync(1) supports a snapshot backup mode. Snapshots in rsync are completely different
    than ZFS snapshots, however. With rsync snapshots, if you modify 1 byte of a 1
    GB file, rsync keeps two copies of the file. ZFS, on the other hand, keeps the
    two different copies of a single block. The two versions of the file share the
    rest of the blocks.


    In rsync''s defense, it is a cross-platform, cross-filesystem tool. You can use
    rsync to synchronize directory trees between operating systems and between filesystems.
    Lucas has used rsync to synchronize directory trees between wildly different Unix-like
    platforms, like FreeBSD and AIX and Linux.


    But if you''re using ZFS, replication is uniquely suited to deal with ZFS. Replication
    understands and duplicates ZFS properties. It can maintain the relationship between
    a clone and its parent, whereas rsync would lose this link and surrender all of
    your space savings. Rsync(1) doesn''t work so well on raw block devices, but ZFS
    replication works with zvols. Replication uses the filesystem''s integrated checksums
    as well, so there''s no risk of the files you receive somehow differing from the
    originals.


    ZFS replication is also version agnostic. New pool features are enabled only if
    you deliberately add the command-line flags to request them. This lets ZFS replication
    easily move data between pools of different versions.'
  - '[PAGE 62]


    # Why Replicate?


    Replication comes into play many ways: most obviously in backups, but also in
    testing, virtualization, and data migrations.


    You remember that RAID is not a backup, right? Even RAID-Z3 is not a proper backup.
    When your machine catches on fire, when law enforcement confiscates hardware at
    your hosting provider, or when you accidentally delete that vital dataset, RAID-Z3
    will not save you. Replicate your important pools to an external drive, a backup
    machine, or a tape library. The beauty of ZFS is that after the initial replication,
    every backup can be an incremental.


    Let''s take it step further. Maybe just being to recover your data is inadequate.
    You must guarantee that your data is always accessible, 24x7x365. You need High
    Availability. Replicate your data to a second and third server, with incremental
    snapshots every few minutes. Now you have your data ready to go on n+2 hot servers.
    Now use one of those servers at a remote location, and you are protected against
    total facility destruction.


    So, that nice dataset of customer data you have there. You''d like to test the
    new version of your billing system with that. Rather than cloning the data on
    the same machine, you need a completely separate copy in the dev environment.
    Whether the target is a remote machine or a new dataset on the same pool, ZFS
    replication is the fastest and most reliable way to copy data.


    Do you have dozens or hundreds of identical machines, VMs, or containers? Use
    ZFS replication to deploy your perfectly crafted image everywhere. If you design
    your systems properly, you can even use incremental replication to deploy updates.


    Replication also greatly simplifies migrating data, even huge amounts of data
    over ridiculous distances. Maybe you have to migrate a massive dataset to the
    other side of the country, or across the planet. With enough data, even 10 Gb/s
    Ethernet in the datacenter seems too slow! Suppose you have many terabytes of
    data that are always in use and using constant minor churn, as a customer database.
    Copying that data over the Internet to the opposite end of the country, or the
    world, will take days—but then, the data will have changed. An rsync-based replication
    process takes so long that you will probably never catch up. Your database administrators
    are smart folks, and probably can come up with a clever plan for moving the data
    with some sort of complicated data'
  - '[PAGE 63]


    segmentation. These plans can be done successfully, but increase risk and always
    impose a heavy workload and frustration.


    If the bandwidth available for synchronization exceeds the rate of change in the
    data, use ZFS instead. Your first ZFS replication, which includes every scrap
    of data from this huge dataset, might take a few days or weeks. You might even
    find it more practical to perform the first synchronization via tape and overnight
    shipping. When this synchronization finishes, though, a second replication from
    a new snapshot won’t take nearly as long. With a few iterations, so long as your
    rate of change is slower than the bandwidth available for backup, ZFS replication
    catches up to nearly real time.


    On Big Switch Day, freeze the dataset for a few moments while you replicate the
    recent set of changes. You’ll probably have a few moments of panic over load balancers,
    firewalls, new servers, and all the other gadgets needed to support such a massive
    dataset, but the data itself won’t be the problem.'
  - '[PAGE 64]


    # Basic Replication


    ZFS doesn’t replicate datasets. It replicates snapshots. Snapshots don’t change
    during replication (or any other time), so they’re guaranteed to be internally
    consistent. Start by creating a snapshot of your data.


    ```

    # zfs snapshot mypool/somedata@snappycheckpoint

    ```


    Now let’s replicate this snapshot both locally and on a remote host.


    # Local Replication


    ZFS replication is unidirectional, meaning that it doesn’t need any feedback from
    the receiver. Here you can dump the snapshot into any other program, using standard
    Shell redirections and pipes. Here, I feed the output of zfs send into a regular
    file. (If you add the -v flag, zfs send prints a progress summary every second.)


    ```

    # zfs send mypool/somedata@snappycheckpoint > backup_file

    ```


    This is our first use of ZFS replication, so it’s not incremental. It contains
    everything in the snapshot. It’s about the same size as the dataset. It’s not
    exactly useful as-is, however—very few people can read a streamed filesystem without
    turning it into a filesystem. So let’s receive this dataset back into ZFS with
    zfs receive.


    ```

    # zfs receive mypool/copy < backup_file

    ```


    ZFS(8) reads the replication stream from the backup_file and create a new dataset
    from it, an exact duplicate of the original dataset.


    You don’t need a file in the middle of local replication. This is a Unix-like
    system. We have the miracle of pipes. This host has home directories on the root
    pool, but I’m moving a copy to a new pool.


    ```

    # zfs zroot/home@weds zfs receive mypool/home

    ```


    I now shuffle a couple dataset mount points and move my home directories to the
    new pool.


    ZFS’ unidirectional nature lets you replicate anything you can aim a command at,
    such as a tape. With pipes you can pour zfs send through SSH and into zfs receive,
    letting you replicate a dataset on a remote machine.


    # Viewing Replicas


    Want to see the inside of a stream file? The zstreamdump(8) utility examines streams
    and exposes their details. You can examine a file, or read directly from zfs send.'
- md: '

    # zstreamdump < backup_file


    The zstreamdump program responds with one section like this for each and every
    snapshot within the zfs send stream.


    ```

    BEGIN record

    hdrtype = 1

    toname = 4

    features = 2f5bacbac

    magic = 56a53713

    type = 2

    flags = 0x0

    toguid = 4264598740125b

    fromuid = 0

    toname = mypool@somedata@snappycomeback

    END checksum = 14035a47cfdef2/65f5a463eb5247f0/3e70de6ff7d7456/49749c053fad

    ```


    This output has a bunch of information from the zfs send stream. The part that
    is of it is presented in a human-friendly manner. Even so, we can extract a few
    chunks of information from it.


    The creation_time field gives the time zfs send was run, in the convenient measure
    of seconds from the Unix epoch—in hex, of course, because why wouldn’t you use
    hex for dates? Convert this value (56a53713) to a human-readable value with date(1).
    Put a 0x in front of the value to identify it as a hex value.


    ```

    $ date - 0x56a53713

    Sun Jan 24 15:41:55 EST 2016

    ```


    On non-FreeBSD hosts, date might not accept hex values. While there are many ways
    to this conversion, you might try something like this.


    ```

    $ printf "%d\n" 0x56a53713 | xargs -r

    ```


    Each snapshot has a human-readable name, given in the toname. This snapshot is
    called mypool@somedata@snappycomeback, and illuminates the importance of using
    meaningful names for datasets and snapshots.


    Each snapshot within a stream also has a globally unique identifier, or GUID.
    This snapshot’s GUID appears in the toguid field.


    The fromguid field is used for incremental ZFS (see “Incremental Replication"
    later in this chapter), including only the changes between two snapshots. It’s
    zero in this example, meaning that this zfs send stream contains a complete snapshot.
    It’s not an incremental. As it’s a complete snapshot, restoring the zfs send stream
    to a live dataset makes sense. (You could restore an incremental ZFS stream, but
    you’d need a copy of the snapshot it''s based on.)


    If a stream has multiple snapshots in it—say, from an incremental or recursive
    zfs send—you can use the toguid and fragmid values to piece together the snapshots
    fit. It''s probably easier to restore the zfs send stream to a dataset and look
    at it that, however.


    Each section ends with a checksum. You can''t use the checksum to manually verify
    the snapshot in this section, but it''s nice to know that ZFS uses checksums.


    After the details on each snapshot, zstreamdump prints a summary.


    SUMMARY:


    ```

    Total DRR_BEGIN records = 5

    Total DRR_END records = 6

    ```


    ```

    Total records = 170

    Total write size = 10523136 (0xa09200)

    Total stream length = 10554216 (0xa10b68)

    ```


    The summary includes a whole bunch of ZFS internal metadata. The most interesting
    parts here are the number of DRR_BEGIN records, which corresponds to the number
    of snapshots in this stream. The sizes at the end are in bytes. The write size
    is the size of the data included in the stream, while the stream length is the
    size of the stream itself. (A ZFS send stream has metadata for restoring data
    to disk that doesn''t need to get written to the disk.)


    # Remote Replication


    In order to replicate ZFS to a remote host, the remote host needs a user that
    can accept the replication and a secure pipe to remote host. The most common type
    of secure replication pipe is SSH, so we’ll assume that your tool. In the long
    term, the easiest way to use SSH is with key-based authentication. If you’re not
    familiar with SSH, consult any number of online tutorials or Lucas’s Mastery (2).
    You could use the root account to receive streams, but that means permitting SSH
    logins as root. SSH as root is a bad idea. Don’t do it. And do you really want
    some random guy somewhere on the Internet around all of your machines? Similarly,
    while you can send ZFS datasets as root, you might want an operator or normal
    user to have the ability to send.


    # Replication Users and Datasets


    On both the sending and receiving hosts, we create a user dedicated to replication.
    Our sample user is called replicator. It needs a shell, but no special group memberships.


    ```

    local pw user add replicator -m /bin/sh

    remote pw user add replicator -m /bin/sh

    ```


    On the sending host, the replication needs the send and snapshot privileges for
    the dataset to be sent. Here we give these privileges to user home.


    ```

    # zfs allow -u replicator send,snapshot zroot/user/home

    ```


    The sending user needs an SSH keypair. A user on both the sending and receiving
    sides can use their own keys for this. For dedicated accounts, generate a keypair
    with ssh-keygen(1).


    ```

    $ replicator$ ssh-keygen

    ```


    The ssh-keygen program prompts you for a passphrase. If this is for an automated
    process, use an empty passphrase. The key file .ssh/id_rsa.pub in the user’s home
    account. We also recommend restricting who can use this key to log in to the remote
    machine, to help protect against key being stolen. Now have this unprivileged
    user install the public key in their account on the remote machine. Here we sent
    the new key to an account with the same username on the host.


    ```

    $ zfs-copy-id ~/.ssh/id_rsa.pub hotsparse

    ```


    Verify that you can log into the receiving host as this user. On the receiving
    host, the user must mount the recipient dataset. The system must also permit unprivileged
    users to mount filesystems they own, using vfs.usermount.


    ```

    $ zfs create -o mountpoint=/backup remotepool/backup

    # replicator:replicator/backup

    # vfs.usermount=1

    ```


    Our unprivileged user needs the compression, create, mount, mountpoint, and receive
    ZFS privileges on the target dataset. Here I assign replicator privileges on remotepool/backup.
    If you intend to automate ZFS replication, including destruction of outdated snapshots,
    you’ll want to add the destroy property.


    ```

    $ zfs allow -u replicator:compression,mountpoint,create,receive remotepool/backup

    ```


    This unprivileged user can replicate this dataset. If you want to replicate all
    of the dataset''s properties, you must allow the replicator user to set all of
    those properties. See Chapter 2 for details on how to create permissions.


    # Dataset Remote Replication


    To replicate a ZFS dataset, create a snapshot. I gave my unprivileged user permission
    to create snapshots exactly for this, so let him do it.


    ```

    $ zfs snapshot zroot/user/home/monday

    ```


    Now use zfs send to transmit this snapshot, pipe into SSH, and dump into zfs receive.
    Remember, ssh(1) lets you execute commands on the remote host. Since this is the
    first time we have replicated this dataset, the send stream includes every block
    in the snapshot.


    ```

    $ zfs send zroot/user/home/monday | ssh user@host zfs receive remotepool/backup

    ```


    In addition to replicating to a pool on another machine, you can replicate to
    the same pool or a second pool on the same machine, to a file, or to a pipe. Replicating
    to a file or pipe can be useful for backups, such as tape, or to a different filesystem.


    You can have a host log into another host to trigger the zfs send if you prefer,
    changing ZFS replication from a push to pull one.


    ```

    $ ssh user@host zfs send zroot/user/home/monday | zfs receive remototep/backup

    ```


    This book assumes you''re sending from a local dataset for consistency, but everything
    works in the other direction.


    # Incremental Replication


    The real power comes from incremental replication. Now that we have replicated
    all of the data from the dataset as Monday, Tuesday’s replication needs to send
    only the blocks that have changed. The receive side of the command doesn''t change
    at all, but on the send -i flag to indicate the most recent snapshot sent.


    ```

    $ zfs snapshot zroot/user/home/monday

    $ zfs send -i zroot/user/home/monday | ssh user@host zfs receive remototep/backup/home

    ```


    ZFS sends only the blocks that have changed between the @monday and @today snapshots,
    saving time and bandwidth.


    Now look at the dataset on the receiving system.


    ```

    # zfs list -t snap -r zroot/backup

    NAME USED AVAIL REFER MOUNTPOINT

    zroot/backup/usr/home/monday 8K - 49.0M -

    zroot/backup/usr/home/tuesday 0 - 49.0M -

    ```


    Two snapshots show now.


    One common mistake with incremental backups is not specifying the last snapshot
    that exists on the remote system. If you don''t specify the most recent snapshot
    that was transmitted, you will get an error.


    ```

    # zfs send zroot/usr/home/tuesday | ssh hotspot zfs recv remototep/backup/usrhome

    cannot receive new filesystem stream: destination remototep/backup/usrhome'' exists

    specify -F to overwrite it

    ```

