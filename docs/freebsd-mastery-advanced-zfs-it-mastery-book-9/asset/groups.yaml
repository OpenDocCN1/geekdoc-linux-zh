  - '[PAGE 59]


    # Chapter 4: Replication


    What exactly is [/,replä’käSH(a)n/] anyway? In ZFS, it means making an exact copy
    of your filesystem someplace else. That other place can be another dataset in
    your pool, a second pool on your system, an external drive, a remote system, a
    tape, or just a file. You can declare “I want this filesystem in that place,”
    and make it happen. ZFS replication has a few design features that make it especially
    powerful.


    Programs like dump(8) and rsync(1) expect the receiver to somehow acknowledge
    receipt of the data. The ZFS replication process is unidirectional—the sender
    does not need any feedback from the receiving side. As replication doesn’t expect
    any acknowledgement, the ZFS recipient doesn’t need any intelligence; it only
    needs to accept a stream of bytes and do something with them.


    The replication system is integrated with snapshots. A snapshot is a static, unchanging
    entity, which means that the transmitted ZFS dataset is fully coherent, unlike
    dumping or rsyncing a live filesystem. Snapshot-based replication also means you
    can do incremental replication, sending only the blocks that have changed between
    two snapshots. With incremental replication, you never have to send the same data
    twice.


    ZFS’s replication feature is designed to fully utilize all of your disks. The
    only limitation to how fast you can replicate data between machines is the speed
    of your network link.


    ZFS replication consists of two parts: zfs send, which serializes a snapshot or
    series of snapshots into a single data stream, and zfs receive, which turns that
    stream back into a ZFS filesystem.'
