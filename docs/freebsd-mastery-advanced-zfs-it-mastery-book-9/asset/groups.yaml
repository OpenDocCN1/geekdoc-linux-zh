    # Network File System


    Entire books have been written about the Network File System, or NFS. Many different
    operating systems support NFS, either as a server or a client or both. For this
    book, we’ll focus on offering NFS shares through the ZFS-integrated tools.


    # NFS Configuration Types


    You can manage ZFS-backed NFS exports with the traditional FreeBSD /etc/exports
    files, and nothing horrific will happen to you. If you’re an old FreeBSD hand,
    /etc/exports might even feel more comfortable. zfs(8) handles many aspects of
    NFS management for you, and works identically across all ZFS platforms.


    However you manage NFS on your host, we strongly encourage you to choose a single
    method and stick with it. Don''t use both /etc/exports and ZFS to manage your
    shares. FreeBSD reads share information from both locations, making troubleshooting
    even more annoying.


    A FreeBSD host must have an /etc/exports file to serve NFS shares, even if you
    manage NFS entirely within ZFS. The simplest way to get this is touch /etc/exports,
    although you might want an exports file that contains only comments directing
    other sysadmins to zfs(8).


    As we with iSCSI, we’re not going to completely cover NFS. We’ll cover managing
    NFS from a ZFS perspective, drawing comparisons to traditional NFS configuration
    where useful.


    # Enabling NFSv2/v3


    Enabling NFS at the ZFS level does nothing if the host isn’t running the services
    required for NFS. Set the following in /etc/rc.conf to start the processes needed
    to serve NFS at boot.


    ```

    nfs_server_enable=YES

    rpcbind_enable=YES

    mountd_enable=YES

    rpc_lockd_enable=YES

    rpc_statd_enable=YES

    ```


    Not all environments require all of these services, but turning them on doesn’t
    use many system resources and offers the widest range of compatibility and decent
    performance.'
  - '[PAGE 56]


    You must also allow hosts on your network to access rpcbind(8), with an /etc/hosts.allow
    entry. Here I let the network 203.0.113.0/24 access my NFS services.


    rpcbind: 203.0.113.0/255.255.255:0: allow


    Without this hosts.allow entry, your clients will drive you to the brink of madness
    with meaningless NFS errors.


    # Configuring NFSv2/v3 via ZFS


    ZFS configures NFS on a per-dataset basis. The ZFS property sharen dictates how
    a dataset is shared. This property can be set to on, off, or to NFS share options
    for the dataset.


    If set to off, ZFS does not configure sharing for this dataset. The dataset could
    still be shared via /etc/exports, however.


    Setting this property to on shares the dataset via NFS. It''s equivalent to listing
    the filesystem by /etc/exports. Setting sharen to on for zroot/home would be like
    the following /etc/exports entry.


    Any host anywhere in the world could access and NFS mount this host.


    It would be far more sensible to set access for all hosts we want to allow.


    ```

    # zfs sharenfs="203.0.113.208" zroot/home

    ```


    This generates an /etc/zfs/exports like this.


    ```

    /home 203.0.113.208

    ```


    If you enter more complicated values in the properties, enclose them in quotes
    or otherwise escape them.


    ```

    # zfs sharenfs="-network 203.0.113.0 -mask 255.255.255.0" zroot/home

    ```


    Any entries that valid /etc/exports entries are usable as values for sharenfs.


    The sharenfs property cannot support any NFS configuration that requires multiple
    lines in /etc/exports. For these environments, you must use a traditional exports
    file.


    # Enabling NFSv4


    NFSv4 is a whole different protocol from NFSv2 or v3. Don''t enable NFSv4 unless
    you understand it. This section gets those people who already have some NFSv4
    know-how up and running.'
  - '[PAGE 57]


    To enable NFSv4, set the following in /etc/rc.conf.


    ```

    nfs_server_enable=YES

    mount_enable=YES

    nfsv4_server_enable=YES

    nfsusedid_enable=YES

    ```


    You''ll also need a single line in /etc/exports, defining the root of your NFS
    tree. This is normally the filesystem root.


    V4: /


    Enable and disable NFS sharing with the sharerens property on individual datasets.


    # Configuring NFSv4 via ZFS


    As older NFS versions, use the sharerens property to configure exports for a single
    dataset. NFSv4 exports everything in a directory tree, however, inheritance plays
    a pretty big role.


    Setting sharerens to on tells NFS to share the dataset with everyone, without
    restrictions. You rely entirely on firewalls or packet filters to prevent unauthorized
    access to this dataset and its descendent datasets. Like other ZFS properties,
    sharerens is inherited. If you share zroot/home, you''re sharing all home directories
    beneath it.


    Setting sharerens to off tells NFS not to share this dataset. Use this to deliberately
    override a parent dataset''s sharerens setting.


    Setting this to an IP address, or a mask statement, shares the dataset exactly
    as it does in NFSv2/3 exports.


    # Debugging ZFS NFS


    FreeBSD assembles sharerens properties into an exports file, /etc/zfs/exports.
    If you''re familiar with NFS, checking this file might give you insight into why
    the file shares are working as they do.


    Check /var/log/messages on the client and server for hints as why a mount fails.
    The most common errors we see, after hosts.allow and firewall problems, are invalid
    sharerens properties. After decades of practice, Lucas still specifies allowed
    networks as CIDR blocks rather than in the NFS-friendly format.'
