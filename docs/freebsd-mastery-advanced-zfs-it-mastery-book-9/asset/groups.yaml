    # Afterword


    Allan has gone off to AsiaBSDCon 2016, leaving me to write the afterword on my
    own.


    Many tools change how we practice systems administration. ZFS is practically unique,
    in that the change is for the better. Once you''ve used ZFS for a while, other
    filesystems seem positively quaint. I administered various iterations of UFS and
    EXT for two decades, but after only a few months of using ZFS, the inability to
    do a ufs send ufs clone would instantly drive me to a red rage. Fortunately, UFS
    has snapshots, so I was able to regain my composure before too many people permanently
    maimed.


    What''s more, this is the last of four books on FreeBSD storage. I''d like to
    note that, at long last, I''ve written a tetrology. Well, most of a tetrology.
    Yeah, without Allan''s help some of this stuff wouldn''t have been in here—Allan
    knows more than I do, and I gave both ZFS books a depth I couldn''t have alone.
    And he has hardware I don''t, like multipath SAS, meaning he could write those
    sections when I simply couldn''t. And he knew who to ask for access to hardware
    neither of us owned, like NVMe. Yeah, fine, without Allan my tetrology would have
    been a trilogy, and the single ZFS volume would not have been nearly as good—but
    that''s not my point. What is my point? Oh, look—over there! A man-eating platypus!
    Run away!'
