    # iSCSI


    You can share zvols through any iSCSI target software you prefer. FreeBSD 10 and
    newer includes the Cam Target Layer daemon ctld(8), which serves as an iSCSI target.
    The ctld(8) software generally has higher performance than the istgt package used
    in older FreeBSD versions.


    The ZFS administration tools do not integrate with either FreeBSD iSCSI target
    software, however. Manage sharing of zvols within ctld, not with zfs(8). We''ll
    cover configuring a zvol-backed iSCSI target and some performance considerations
    for ZFS-backed iSCSI devices.


    For more detail on iSCSI and how not to use it, check out Lucas’s FreeBSD Mastery:
    Specialty Filesystems.


    # Target Configuration


    An iSCSI target provides SCSI-style storage services over the network. You might
    think of it as an iSCSI server, but a target is subtly different from a server.
    An iSCSI target never initiates any activity on its. All requests must come from
    a client, or initiator.


    Basic iSCSI services require a portal group, a target, and a Logical Unit Number
    or LUN. A portal group is a name given to a specific combination of IP address
    and TCP port. (All IP addresses on this host) is a valid component of a portal
    group.) A target is a specific group of storage devices exported via iSCSI. One
    portal group can have any number of targets. A LUN is a single device within a
    target.


    Here’s a snippet of /etc/ctld.conf that defines a single portal group.


    ```

    portal-group0 {

    discovery-auth-group no-authentication

    listen 0.0.0.0

    listen [::]

    }

    ```


    The portal group is named group0. While we can (and should) configure authentication
    for a production iSCSI target, we don’t need authentication to get started. This
    portal group is available on IPv4 and IPv6 addresses on the machine.


    Next we define a target for this portal group. This target contains one LUN.


    ```

    target iqn.2013-11.org.mwlucas:target0 {

    auth-group no-authentication

    portal-group group0

    lun {

    ```'
