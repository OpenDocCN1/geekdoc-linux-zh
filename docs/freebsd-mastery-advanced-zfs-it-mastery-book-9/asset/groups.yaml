    在创建所需的数据集之前初始化你的数据库


    PostgreSQL 默认对所有内容都使用 8 KB 的存储块。如果你更改了 PostgreSQL 的块大小，你必须更改数据集的大小以匹配它。


    在默认的 FreeBSD 安装中，PostgreSQL 位于 `/usr/local/postgresql/data`。对于大型安装，你可能为这些数据准备了单独池（pool）。在这里，我为
    PostgreSQL 使用名为 `pgsql` 的池。


    ```

    # zfs create mountpoint=/usr/local/postgresql pgsql

    # zfs create pgsql/data

    ```


    现在我们遇到了一个先有鸡还是有蛋的问题。PostgreSQL 的数据库初始化例程期望创建它自己的目录树，但我们希望特定的子目录拥有自己的数据集。实现此的最简单方法是让
    PostgreSQL 初始化，然后创建数据集并移动文件。


    ```

    # /usr/local/etc/rc.d/initdb

    ```


    初始化例程创建数据库、视图、架构、配置文件以及高级数据库的所有其他组件。现在你可以为特殊部分创建数据集了。


    PostgreSQL 将数据库存储在 `/usr/local/postgresql/data/base`。写预读日志（WAL）位于 `/usr/local/postgresql/data/pg_xlog`。将这两者都移开。


    ```

    # cd /usr/local/postgresql/

    # mv base base-old

    # mv pg_xlog pg_xlog-old

    ```


    这两者都使用 8 KB 的块大小，你可能希望分别对它们进行快照，以便为每个创建一个数据集。对于 MySQL，告诉 ARC 只缓存元数据。还要通过 `logbias`
    属性告诉这些操作绕过延迟。


    ```

    # zfs create recordsize=8k -o redundant_metadata=most -o primarycache=metadata
    logbias=throughput

    pgsql/data/pg_xlog

    # zfs create recordsize=8k -o redundant_metadata=most -o primarycache=metadata
    logbias=throughput

    pgsql/base

    ```


    将原始目录的内容复制到新数据集中。


    ```

    # cp -Rp base-old/*

    # cp -Rp pg_xlog-old/* pg_xlog

    ```


    你现在可以启动 PostgreSQL 了。


    ## 针对文件大小调优


    ZFS 设计为一种优秀的通用文件系统。如果你有一个 ZFS 系统作为典型办公室的文件服务器，你并不需要针对文件大小进行调优。然而，如果你知道你将拥有多大的文件，可以进行更改以提高性能。


    ### 小文件


    在没有 SLOG（专用日志设备）的系统中高速创建许多小文件时，ZFS 会花费大量时间等待文件和元数据刷新到稳定存储中。


    如果你愿意承担最后五秒内创建的任何新文件的丢失风险（如果你的 `vfs.zfs.txg.timeout`较高），将 `sync` 属性设置为 `disabled`，这将告诉
    ZFS 将所有写入视为异步。即使应用程序请求不要在文件安全之前通知它写入已完成，ZFS 也会立即返回，并随下一个定期计划的 txg 一起写入文件。


    高速 SLOG 让你能够既同步又快速地存储那些微小文件。


    ### 大文件


    ZFS 最近通过 `large_block` 特性增加了对大于 128 KB 块的支持。如果你正在存储许多大文件，务必考虑这一点。默认的最大块大小为 1 MB。


    理论上，你可以使用大于 1 MB 的块大小。然而，很少有系统对此进行过广泛测试，而且与内核内存分配子系统的交互在长时间使用中尚未经过测试。你可以尝试使用大的
    `recordsize`，以便在一切出现问题时寻求一个文件报告。`sysctl vfs.zfs.max_recordsize` 控制最大块大小。


    一旦你激活了 `large_blocks`（或任何其他特性），该池将无法被不支持该特性的主机使用。通过删除任何曾经设置过 `recordsize` 的数据集来禁用该特性。


