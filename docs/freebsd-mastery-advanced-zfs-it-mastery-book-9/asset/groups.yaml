    # zpool.cache


    Now let''s discuss a cache that you''ll hear about, but that doesn''t affect day-to-day
    system administration: the file /boot/zfs/zpool.cache.


    The zpool.cache file contains a description of the pools currently active on the
    system and their providers. When you boot a ZFS system, the kernel checks the
    zpool.cache file on the root pool to discover which of the system''s pools it
    should import.


    ZFS'' db(8) uses information in the cache file for debugging. You can''t use the
    debugger on a pool without a cache.


    You can control the cache file''s location with the cachefile property. Here,
    we change the cache file for the pool work.


    ```bash

    # zpool set cachefile=/work/zfs/work.zpool.cache work

    ```


    Despite much lingering, obsolete documentation to the contrary, there''s almost
    never a reason to change the cachefile location on modern versions of ZFS or FreeBSD.


    Now that you understand the cache, we can talk about performance.


    > ¹1 If you must have this conversation again, do try to not add "Aaargh, how
