  mdcn: '


    # 但我有 rsync！


    几十年来，rsync(1) 一直是机器间同步文件的标准工具。为了同步文件，rsync 会遍历目录树，评估每个文件的时间戳和加密校验和，并将其与远程侧的文件进行比较。许多组织已经部署了基于
    rsync 的大量基础设施。


    ZFS 从磁盘底层开始设计，以实现最大性能。它对 rsync 的完胜如此惨烈，以至于 rsync 的妈妈都急需医疗救治。ZFS 在磁盘上维护了一个列表，记录每个快照之间不同的块。复制过程不需要确定哪些文件发生了变化——文件系统本身已经持有了这些信息。复制过程会立即尽可能快地开始发送这些块。由于更改的块包含了重组文件所需的所有元数据，复制过程甚至不需要知道这些块属于哪个文件。


    当 rsync 正在遍历你的文件系统、查看每个文件、检查时间戳、计算校验和并将其与另一侧的版本进行比较时，ZFS 已经完成了。如果你有 10 TB 的数据，而只有
    1 GB 发生了变化，rsync 仍然需要检查每一个文件。而 ZFS 只需要抓取那 1 GB 更改的块并发送它们。


    需要更快的 rsync 同步的系统管理员可以告诉 rsync “作弊”，假设如果本地和远程文件的最后修改时间相同，则文件没有发生变化。（这实际上并不总是如此，但不要因此埋怪
    rsync——系统管理员应该对此了然）。当文件时间戳发生变化时，rsync 会计算双方文件分块的校验和，并比较这些校验和。如果它发现差异，就会计算出一个增量并将其发送过去。这意味着如果你对一个大文件进行了微小的修改，rsync
    必须在本地和远程侧都读取并检查整个文件。使用 rsync 在备份机器上维护 500 GB 的虚拟机磁盘镜像副本会消耗大量的带宽和 CPU 时间。


    ZFS 中的每个块都有一个出生时间（birthtime），即创建该块的事务组 ID。复制过程会发送任何晚于上次运行复制任务时的块。这些块是来自一个新文件，还是来自一个巨大文件的中间，并不重要。


    基于快照的复制的优势在定期同步文件系统时真正大显威力。假设你在备份服务器上复制了一个快照。一小时后，你创建了一个新快照并将该快照增量发送到备份服务器。ZFS
    在几秒钟内完成，而 rsync 仍在遍历第一层目录。


    rsync(1) 支持快照备份模式。然而，rsync 快照与 ZFS 快照完全不同。在 rsync 快照中，如果你修改了一个 1 GB 文件的 1 字节，rsync
    会保留该文件的两个副本。而相反，ZFS 保留的是单个块的两个不同版本。文件的两个版本共享剩余的块。


    为 rsync 辩护，它是一个跨平台、跨文件系统的工具。你可以使用 rsync 同步不同操作系统以及不同文件系统之间的目录树。Lucas 曾使用 rsync
    在截然不同的 Unix 类平台（如 FreeBSD、AIX 和 Linux）之间同步目录树。


    但如果你正在使用 ZFS，复制功能特别适合处理 ZFS。复制功能能够理解并复制 ZFS 属性。它可以维护克隆（clone）与其父级快照之间的关系，而 rsync
    则会丢失这种链接并导致你所有的空间节省。rsync(1) 在原始块设备上工作得并不好，但 ZFS 复制可以与 zvols 工作。复制还使用了文件系统集成的校验和，因此不存在收到的文件与原始文件存在差异的风险。


    ZFS 复制也是版本无关的。只有当你刻意添加命令行标志请求它们时，新的池功能才会被启用。这使得 ZFS 复制能够轻松地在不同版本的池之间移动数据。


    # 为什么要复制？


    复制在许多方面发挥作用：最明显是在备份中，但也适用于测试、虚拟化和数据迁移。


    你记得 RAID 不是备份吧？即使是 RAID-Z3 也不是真正的备份。当你的机器起火时，当执法部门在你的托管提供商处没收硬件，或者你不小心删除了那个重要数据集时，RAID-Z3
    无法拯救你。将重要的池复制到外部驱动器、备份机器或磁带库。ZFS 的妙之处在于，在初始复制之后，每次备份都可以是增量的。


    让我们更进一步。也许仅仅能够恢复数据是不够的。你必须保证数据始终可用，24x7x365 全天在线。你需要高可用性。将你的数据复制到第二和第三台服务器，每隔几分钟进行一次增量快照。现在，你的数据已准备好在
    n+2 台热服务器上运行。现在使用其中一台位于远程位置的服务器，你就防止了整个设施被毁的风险。


    所以，你那里的那份很不错的客户数据集。你想用它来测试计费系统的新版本。与其在同一台机器上克隆数据，你需要在开发环境中有一个完全独立的副本。无论目标是远程机器还是同一池上的新数据集，ZFS
    复制都是拷贝数据最快、最可靠的方法。


    你是否有几十个或数百个完全相同的机器、虚拟机或容器？使用 ZFS 复制将你完美制作的镜像部署到每处。如果你设计系统得当，甚至可以使用增量复制来部署更新。


    复制还极大地简化了数据迁移，即使是跨越遥距离迁移海量数据。也许你必须将一个巨大的数据集迁移到另一端。


    # 基础复制


    ZFS 不复制数据集（datasets）。它复制的是快照。快照在复制过程中不会更改，因此可以保证内部一致性。首先为你的数据创建一个快照。


    ```bash

    # zfs snapshot mypool/someata@snappycheckpoint

    ```


    现在让我们在本地和远程主机上复制这个快照。


    # 本地复制


    ZFS 复制是单向的，这意味着它不需要接收方的反馈。在这里，你可以使用标准重定向和管道将快照导入任何其他程序。在这里我们将 zfs send 的输出馈到一个文件。（如果你添加了
    -v 标志，zfs send 会打印进度摘要。）


    ```bash

    # zfs send mypool/someata@snappycheckpoint > backup_file

    ```


    这是我们第一次使用 ZFS 复制，所以它不是增量的。它包含了快照中的所有内容。它与数据集的大小相当。然而，它本身并没有什么用处——很少有人能在不将其转换为文件系统的情况下读取流文件系统。让我们用
    zfs receive 将数据集接收回 ZFS。


    ```bash

    # zfs receive mypool/copy < backup_file

    ```


    ZFS(8) 从 backup_file 读取复制流并创建一个新的数据集，它是原始数据集的精确副本。


    在本地复制中，你不需要中间文件。这是一个类 Unix 系统。我们拥有管道的奇迹。这台主机在根池上有主目录，但我正将它们移动到新池。


    ```bash

    # zfs zroot/home@weds zfs receive mypool/home

    ```


    我现在调整了几个数据集挂载点，并将主目录移动到新池。


    ZFS 的单向性允许你复制任何可以被命令指向的对象，例如磁带。通过管道，你可以将 zfs send 倒入 SSH 并馈入 zfs receive，从而在远程机器上复制数据集。


    # 查看副本


    想查看流文件的内部内容吗？zstreamdump(8) 实用程序可以检查流并显示其细节。你可以检查文件，也可以直接从 zfs send 读取。


