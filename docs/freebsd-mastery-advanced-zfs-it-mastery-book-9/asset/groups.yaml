    a dataset.


    ```

    # zfs allow mypool/teams

    -- Permissions on mypool/teams --

    Permission sets:

    @basic_properties atime,compression,copies,primarycache,secondarycache

    @billing grouped,create,destroyused

    @dataset clone,create,destroy,hold,mount,promote,release,rename,rollback

    @quotas groupquota,quota,refquota,refreservation,reservation,userquotas

    @replication receive,send

    Local+Descendent permissions:

    user billbot @billing

    group managers @basic_properties,@dataset

    ```


    ZFS delegation can quickly become complex. As with many other permissions schemes,
    using groups can help simplify management. Assign permissions only when they’re
    needed, not because you think you know how the system will evolve.'
