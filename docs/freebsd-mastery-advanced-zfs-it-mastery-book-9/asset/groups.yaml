    period, zfsd marks the device as degraded and activates a hot spare. ZFS continues
    to the degraded device while the pool finishes resilvering, zfsd removes the failing
    device from the pool.


    If a new hot spare is added, or returned, to the pool, zfsd activates the spare
    if it is'
  - "[PAGE 120]\n\nneeded to replace another device.\n\nWhen a resilver operation\
    \ completes, zfsd attempts to deactivate any hot spares that are no longer needed,\
    \ so that they are available to replace further failures they occur.\n\nZfsd(8)\
    \ also listens for “physical path change” events, to be notified when the path\
    \ to a newly arriving disk is set. This can happen slightly later than when the\
    \ disk insert arrives. When the physical path is updated, and the pool’s autoreplay\
    \ property is set, zfsd attempts to replace any missing disk with the same physical\
    \ path.\n\nWhen you swap out a failed disk, and the CAM subsystem notes the new\
    \ disk is in the same slot, with the same path, zfsd automatically initiates the\
    \ replace operation and restores the pool back to a healthy state.\n\nMoving a\
    \ disk from one slot to another works exactly like removing a disk and plugging\
    \ a disk back in. The kernel marks an absent disk as removed. When you put the\
    \ disk back in, the kernel sees the ZFS label on the disk, identifies which pool\
    \ it belongs to, and automatically reactivates it with zpool online. The pool\
    \ metadata gets updated with the physical path.\n\nNow that we’ve talked about\
