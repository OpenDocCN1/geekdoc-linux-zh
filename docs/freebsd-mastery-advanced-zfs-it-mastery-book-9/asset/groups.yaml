    \ GB |\n| Max Size (High Water): | 8:1 30.07 GB |\n\nThis particular ARC is at\
    \ 36.22% of its maximum size, or 10.89 GB. It’s configured for a maximum size\
    \ of 30.07 GB. The minimum is 3.76 GB.\n\n| ARC Size Breakdown: | |\n| :--- |\
    \ :--- |\n| Recently Used Cache Size: | 50.00% 15.03 GB |\n| Frequently Used Cache\
    \ Size: | 50.00% 15.03 GB |\n\nThe ARC has even divided memory allocated for the\
    \ MRU and MFU caches.\n\nThe ARC efficiency report, given by zfs-stats -E, is\
    \ more interesting than the general report. Here are the most interesting snippets\
    \ of that output from a different server.\n\n### zfs-stats -E\n\n| Metric | Value\
    \ |\n| :--- | :--- |\n| ARC Efficiency: | 78.40m |\n| Cache Hit Ratio: | 97.76%\
    \ 76.65m |\n| Cache Miss Ratio: | 2.24% 1.75m |\n| Actual Hit Ratio: | 97.76%\
    \ 76.65m |\n\nZFS decodes gob of memory to files caching. The top of this report\
    \ shows us how benefit we get out of this. The Cache Hit Ratio says what percent\
    \ of disk read requests were served from the ARC rather than going to disk. In\
    \ this case, 97.76% of all read requests on this machine were served out of memory.\
    \ The number after percentage is the raw number of requests. This hosted 76.65\
    \ million disk requests out of the ARC.\n\nNext, zfs-stats shows which cache a\
    \ cached file came from.\n\n| CACHE HITS BY CACHE LIST: | |\n| :--- | :--- |\n\
