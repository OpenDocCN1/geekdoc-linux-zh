    放在 bootpool/boot。在运行的系统中，/boot 是指向其他 pool 的符号链接。其余部分进入 zroot 池。


    PC-BSD 10 确实支持 GELI 加密磁盘上的启动环境，但它们使用 GRUB 引导加载程序和一些特殊技巧。

