    软件设置显然不会让你超过硬件的限制。


    SSD 不再像以前那样臭名地脆弱了。现代数据中心级 SSD，例如 200 GB 的 Intel DC S3700，其耐用性评分为“5 年每天写入 10 次硬盘”。这意味着每天约
    2,000 GB，或每秒 23 MB。你可以持续向此驱动器写入 22 MB/s 的数据，根据英特的说法，它可以持续五年。在高性能服务器上，将 `sysctl`
    节流参数调到这些值，并备注在 58 个月后订购新的缓存设备是合理的。由于你的主机可能不会一直以全速写入 L2ARC，因此将这些参数调得更高也可能意义。


    # ZFS 意图日志 (ZFS Intent Log)


    缓存不仅仅是为了读取数据。ZFS 也通过 ZFS 意图日志 (ZIL) 对写入进行缓存。ZFS 将写入操作写入 ZIL，并处理这些写入以将其正确地添加到 ZFS
    中。每个池都有自己的 ZIL。在正常使用情况下，ZFS 在每个提供设备上使用一部分空间作为 ZIL。如果你需要，可以添加一个额外设备作为 ZIL。严格来说，ZIL
    并不完全是写入缓存。但它具有某种缓存特性，因此我们将在本章中介绍它。


    然而，ZIL 的工作方式并非人们认为的那样。要理解池何时需要独立的日志设备，何时不需要，你必须理解 ZFS 是如何写入数据的。


    # 同步与异步事务 (Sync and Async Transactions)


    ZFS 核心在于到达持久性存储的数据完整性。磁盘上的数据应该始终保持一致。系统可能会在程序和磁盘之间丢失数据，但没有任何文件系统可以保护仅驻留在 RAM 中的传输中数据。


    为了确保磁盘数据的完整性，ZFS 将请求分组在事务组（transaction groups，txgs）中。事务组是一组数据以及相关的文件系统元数据。当你请求系统写入磁盘时，ZFS
    会在一个事务组中收集这些写入操作。一个事务组可以包含来自许多无关进程的写入。当该组拥有足够的数据或计时器超时时，该事务组就会写入磁盘。该计时器可能长达 30
    秒，也可能短至 5 秒，取决于你运行的 FreeBSD 版本。


    事务组是文件系统的待办列表。正就像你的待办列表一样，如果发生了糟糕的事情，列表就会被抛给狼群。在完全写入磁盘之前，数据很容易受到系统故障的影响。如果系统在事务组写入磁盘之前崩溃或死亡，这些数据就会丢失。缩短事务组超时可能会减少数据丢失量，但也会影响性能。


    作为系统管理员，你的工作是管理数据丢失风险。让我们来看看写入磁盘的过程。


    程序将一段数据交给内核并说：“请写入磁盘”。在内核确认接收数据之前，程序不会继续执行。一旦内核说“我收到数据了”，程序就会继续。等待此响应的程序被称为在 I/O
    上发生阻塞（blocking on I/O）。


    重要的问题是：内核何时确认接收数据？是在数据被添加到事务组时，还是在写入磁盘时？


    在正常操作中，当数据作为待处理事务组的一部分添加到内存时，内核就会确认数据。数据不在磁盘上——内核仅仅是承担了数据的责任。如果系统是一家餐厅，那么现在的晚餐就在服务员通往客户手中的手中的，但服务员仍可能绊倒。异步操作的变体在现代文件系统中很常见，例如
    Linux 的各种版本 extfs 和 BSD UFS。


    文件系统也可以以同步模式工作，在这种模式下，只有当位写入物理存储介质时内核才会确认数据。同步计数（Sync counts）极其安全，但也极其缓慢。写入数据的程序将阻塞等待内核的写入请求。某些程序（例如数据库服务器）使用
    `fsync(2)` 系统调用对特定文件请求同步确认。`zsadmin` 同步命中元数据，以便系统仅在写入完成后才确认数据，或者可以使用 `fsync(8)`
    程序告诉系统立即将所有内容刷新（flush）到磁盘。


    # ZFS 意图日志 (ZFS Intent Log)


    当 ZFS 在同步模式下写入文件时，它不会立即将事务推送到磁盘。相反，这些写入会被倾倒入 ZIL。它们并没有像 ZFS 数据集块那样整齐地排列；相反，它们只是磁盘上的一堆块。当事务组写入磁盘时，ZIL
    上的块会被写入到它们正确的位置。


    池导入（pool import）过程会检查 ZIL，查找尚未到达最终位置的数据。如果系统在正在导入的池中发现传输中的块，它将完成这些事务。


    池通常使用每个存储提供设备上的一个小块空间作为 ZIL。是的，这意味着同步写入会被写入物理存储两次。但池仅对同步写入的数据使用 ZIL。正常的异步写入被存储在
    RAM 中，并作为常规事务组的一部分提交。


    你有时可以通过将 ZIL 放在一个专用的快速设备上（称为“独立意图日志”，Separate Intent LOG）来提高性能。


    # 独立意图日志 (Separate Intent Log)


    你可以通过使用独立意图日志（SLOG）将 ZIL 从池中分离。通过将 ZIL 移动到独立的专用硬件上，你避免了向存储提供设备写入两次相同的数据。如果 SLOG
    硬件比池快，内核可以更快地确认数据，从而提高请求应用程序的性能。


    尽管用法常见，SLOG 并不等同于 ZIL。SLOG 运行在 ZIL 或存储提供设备上。你可以通过一个窗口启动 SLOG。


    最快、最可靠且昂贵的 SLOG 是 NVRAM 芯片。高耐用性 SSD 是 SLOG 的常见选择。你甚至可以使用 SAS 驱动器，但它们是最不可靠的。每一个都需要一个电源（例如电池或超级电容器），以便在系统故障时完成写入。


    SLOG 不需要很大。`vfs.zfs.dirty_data_max` 给出了可能的传输数据量。FreeBSD 10 默认使用的 ZIL 大小等于系统内存的十分之一。你可以使用一个设备为多个池提供
