    # Remote Replication


    In order to replicate ZFS to a remote host, the remote host needs a user that
    can accept the replication and a secure pipe to remote host. The most common type
    of secure replication pipe is SSH, so we’ll assume that your tool. In the long
    term, the easiest way to use SSH is with key-based authentication. If you’re not
    familiar with consult any number of online tutorials or Lucas’s SSH Mastery (Tilted
    Windmill Press, 2012).


    You could use the root account to receive replication streams, but that means
    permitting SSH logins as root. SSH as root is a bad idea. Don’t do it. And do
    you really want some shell script maintained by this random guy somewhere on the
    Internet astounding around root on all of your machines? Instantiate, create an
    unprivileged user and assign it replication rights, as discussed in Chapter 2.


    Similarly, while you can send ZFS datasets as root, you might want an operator
    or normal user to have the ability to send datasets.


    # Replication Users and Datasets


    On both the sending and receiving hosts, we create a user dedicated to replication.
    Our sample user is called replicator. It needs a shell, but no special group memberships.


    ```

    local# pw user add replicator -m -s /bin/sh

    remote# pw user add replicator -m -s /bin/sh

    ```


    On the sending host, the replication needs the send and snapshot privileges for
    the dataset to be sent. Here we give these privileges on user home directories.


    ```

    # zfs allow -u replicator send,snapshot zroot/user/home

    ```


    The sending user needs an SSH keypair. A user who is using his own account on
    both the sending and receiving sides can use their own SSH keys for this. For
    dedicated accounts, generate a keypair with ssh-keygen(1).


    ```

    $ replicator

    $ ssh-keygen

    ```


    The ssh-keygen program prompts you for a passphrase. If a human being will use
    the account to send ZFS datasets, use a passphrase. If this is for an automated
    process, use an empty passphrase.


    The key is file .ssh/id_rsa.pub in the user’s home account. We also recommend
    restricting hosts which can use this key to log in to the remote machine, to help
    protect the'
  - '[PAGE 68]


    remote host and your backups in the event this key is stolen.


    Now have this unprivileged user install the public key in their account on the
    remote machine. Here we sent the new key to an account with the same username
    on the host hotsparse.


    ```

    $ zfs-copy-id -i ~/.ssh/id_rsa.pub hotsparse

    ```


    Verify that you can log into the receiving host as this user.


    On the receiving host, the user must owner mount the point of the recipient dataset.
    The system must also permit unprivileged users to mount filesystems on directories
    they own, using the vfs.usermount sysctl.


    ```

    $ zfs create -o mountpoint=/backup remotepool/backup

    # chosen replicator:replicator/backup

    # sysctl vfs.usermount=1

    ```


    Our unprivileged user needs the compression, create, mount, mountpoint, and receive
    ZFS privileges on the target dataset. Here I assign the replicator user privileges
    on the remotepool/backup dataset. If you intend to automate ZFS replication, including
    destruction of outdated snapshots, you''ll want to add the destroy property.


    ```

    $ zfs allow -u replicator:compression,mountpoint,create,receive remotepool/backup

    ```


    This unprivileged user can replicate this dataset.


    If you want to replicate all of the dataset''s properties, you must allow the
    replicator user to set all of those properties. See Chapter 2 for details on how
    to create a permissions set.


    # Dataset Full Remote Replication


    To replicate a ZFS dataset, create a snapshot. I gave my unprivileged user permission
    to create snapshots exactly for this, so let him do it.


    ```

    $ zfs snapshot zroot/usr/home/monday

    ```


    Now use zfs send to transmit this snapshot, pipe into SSH, and dump it into zfs
    receive. Remember, ssh(1) lets you execute commands on the remote host. Since
    this is the first time we have replicated this dataset, the send stream includes
    every block in the snapshot.


    ```

    $ zfs send zroot/usr/home/monday | ssh user@host zfs receive remotepool/backup

    ```


    In addition to replicating to a pool on another machine, you can replicate to
    the same pool or a second pool on the same machine, to a file, or to a pipe. Replicating
    to a file or'
  - '[PAGE 69]


    pipe can be useful for backups, such as tape, or to a different filesystem.


    You can have a host log into another host to trigger the zfs send if you prefer,
    changing ZFS replication from a push to pull one.


    ```

    $ ssh user@host zfs send zroot/user/home/monday | zfs receive remotemotep/backup

    ```


    This book assumes you''re sending from a local dataset for consistency, but everything
    works in the other direction.


    # Incremental Replication


    The real power comes from incremental replication. Now that we have replicated
    all of the data from the dataset as Monday, Tuesday’s replication needs to send
    only the blocks that have changed. The receive side of the command doesn''t change
    at all, but on the send -i flag to indicate the most recent snapshot sent.


    ```

    $ zfs snapshot zroot/user/home/monday

    $ zfs send -i zroot/usr/home/monday | ssh user@host zfs receive remotemotep/backup/home

    ```


    ZFS sends only the blocks that have changed between the @monday and @today snapshots,
    saving time and bandwidth.


    Now look at the dataset on the receiving system.


    ```

    # zfs list -t snap -r zroot/backup

    NAME USED AVAIL REFER MOUNTPOINT

    zroot/backup/usr/home/monday 8K - 49.0M -

    zroot/backup/usr/home/tuesday 0 - 49.0M -

    ```


    Two snapshots show now.


    One common mistake with incremental backups is not specifying the last snapshot
    that exists on the remote system. If you don''t specify the most recent snapshot
    that was transmitted, you will get an error.


    ```

    # zfs send zroot/usr/home/tuesday | ssh hotspot zfs recv remotemotep/backup/usrhome

    cannot receive new filesystem stream: destination remotemotep/backup/usrhome''
    exists

    specify -F to overwrite it

    ```


    The danger of an error message like this is that it offers ways to make the error
    disappear, rather than suggesting ways to fix the underlying problem. Overwriting
    the remote dataset wipes out your snapshots and resends all the data.


    When using -i, you can skip the @ sign in front of the snapshot name. The -i flag
    means “this is a snapshot,” so it can safely assume that you meant to put the
    @ in front just couldn''t be bothered.'
