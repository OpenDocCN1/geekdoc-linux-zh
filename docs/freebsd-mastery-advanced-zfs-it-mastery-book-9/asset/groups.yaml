    # zpool iostat


    The iostat component of zpool gives a snapshot of how your pools are performing
    at a particular instant in time. To see average activity on your pools since the
    system booted, run zpool iostat.


    # zpool iostat


    | pool alloc free operations write bandwidth read read write |

    |---|---|---|---|---|---|---||

    | work | 2.21G 1.81T | 2 402 36.2K 24.0M |

    | zroot | 15.5G 90S | 275 0 7.34M 0 |


    We have the name of each pool, with the amount of allocated and free space in
    each. The last four columns display each pool''s read and write activity, in units
    of both operations per second and by bytes second.


    This example shows two pools, work and zroot. The zroot pool has 15.5 GB allocated
    and 905 GB free. The pool is doing 275 read operations per second, or 7.34 MB
    per second, and no write operations. This means each read operation averages around
    27 KB (7.34 MB / 275 = 27 KB).


    The pool is more interesting. We have two read requests per second, and 402 writes
    per second for a total of 24 MB/s. The reads are negligible, but each write averages
    60 KB. There''s actual work happening here.


    What does this mean for your pool? Taken on its own, not much. This is the pool
    activity at a particular instant. This instant moment, or it might be a high or
    low period. You need an ongoing view of pool activity to make any sensible decisions.


    To view the activity for a single pool, give the pool a name.


    # zpool iostat work


    This eliminates all output except for the specified pool.


    Remember, this is an average of behavior since the system booted. It doesn''t
    reflect current values.


    # Current & Ongoing Pool Activity


    To see how the pool is behaving at this particular moment, and how activity changes
    over time, have zpool iostat print new statistics every few seconds. Specify a
    number of seconds at the end of the command line. Here we get updates every two
    seconds. Hit CTRL-c to exit.


    # zpool iostat 2'
