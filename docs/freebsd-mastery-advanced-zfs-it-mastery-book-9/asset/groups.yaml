  - '[PAGE 159]


    Generally speaking, the goal of performance tuning is to improve the numbers you
    care about without making the other numbers too large. Play with the maximum number
    of permitted reads and writes of each type, increasing them by 20–100 percent
    between runs. Make sure you don’t hoist these values high enough that your VDEVs
    go over the per-VDEV limit—or, alternatively, play with the minimums.


    The stddev (standard deviation) column is especially noteworthy. You might achieve
    excellent throughput, but find yourself with wildly varying latency. Massive throughput
    okay if some of your reads and writes take five seconds to complete? Only you
    know.


    When adjusting read performance, beware of the ARC. If you keep accessing the
    same file, the kernel uses the in-memory copy rather than re-reading it from disk.
    To properly test read performance, you must flush commonly used files from the
    ARC. Either unmount and remount your read-intensive datasets, or just reboot the
    machine.


    Yes, performance tuning and testing is intrusive. There’s a reason why people
    don’t bother doing it. The good news is, ZFS performs pretty well with the default
    settings.'
  - '[PAGE 160]


    # I/O Queues


    ZFS breaks I/O traffic up into five queues: sync reads, async reads, sync writes,
    async writes, and scrubs. Each has a pair of related sysctls that control the
    maximum and minimum outstanding requests of that type can be active concurrently
    on each storage provider.


    Synchronous reads are when the application is asking for the data right now. The
    application, and possibly the user, is sitting waiting for that data before it
    can continue its work. Synchronous writes, similarly, request that the data get
    written immediately. Databases—and other applications that want to be sure that
    they do not “the next thing” until this data is safe on the disk—request synchronous
    writes. In ZFS, synchronous writes are done as quickly as possible. This is where
    the SLOG comes in, a fast dedicated device that synchronous writes can be stored
    on temporarily, more quickly than storing normally.


    Asynchronous reads are less important, mostly consisting of ZFS’s preface feature,
    loading data from the disk in anticipation of your needing. The application will
    be notified when ZFS gets around to reading this data in making it available,
    rather than explicitly waiting for it. Asynchronous writes work in a similar fashion.
    The application gives some data to ZFS and says, “write this down at some point.”
    ZFS holds the data for asynchronous writes in memory until the next txg is closing,
    flush it to the disk. Grouping these writes together and writing them out en masse
    improves performance.


    The maximums and minimums do not apply simultaneously, however. The maximums apply
    in one set of conditions, while the minimums apply in different conditions. Some
    of these values for a type of write are identical—both the maximum and minimum
    for sync reads are set to 10, for example. This isn’t a conflict, only different
    settings for a different situation.


    Sync reads include data requested by a program. Calling a file in your text editor
    is a sync read. Control these with the sysctls vfs.zfs.vdev.sync_read_max_active
    and vfs.zfs.vdev.sync_read_min_active. Each defaults to 10. The user is likely
    to notice latency in sync reads. If a user tries to open a file and it takes five
    seconds instead of 50ms, the user will say the system is slow.


    Prefetch reads are async; nobody has yet requested that data, but ZFS guesses
    that the request will arrive soon. If a program reads the first chunk of a file,
    ZFS has a pretty good idea that a request for the rest of the file is coming soon.
    Control the number'
  - '[PAGE 161]


    of outstanding async read requests with the sysctl vfs.vdev.async_read_max_active
    vfs.vdev.async_read_min_active These default to a maximum of 3 and a minimum of
    1. The purpose of limiting the number of async operations is to ensure that new
    sync operations do not end up back at the line behind a bunch of less important
    reads. When the number of outstanding operations on the drive drops below the
    minimum, ZFS adds more to the queue, with the most important operations being
    added to the queue first. The order of operations in the queue does not change.


    Sync writes are used where a program uses the fsync(2) system call. These requests
    go straight to the ZIL, either on the data storage providers or on a separate
    SLOG. These writes are the most important operation, as the calling application
    is waiting for the operation to finish before it continues. Tuning this value
    lowers throughput and increases latency. Writes in ZFS are usually batched, so
    take advantage of the write head being in the correct position to write as much
    data as at once. However, if the number of operations to queue is too high, sync
    reads must wait for the already queued writes to finish, which can negatively
    impact system responsiveness. The sysctl vfs.vdev.sync_write_max_active and vfs.vdev.sync_write_min_active
    control how many of these requests may be pending per provider at any time. The
    default is 10.


    Async writes are normal traffic that doesn''t traverse the ZIL. Async writes sit
    in a txg, then get committed in masse. The sysctl vfs.zdev.async_write_max_active
    and vfs.vdev.async_write_min_active control how many outstanding async write requests
    can be simultaneously active on a single provider. The default maximum is 10 and
    the minimum 1.


    Scrub processes have their own queues, controlling how many outstanding I/O requests
    can be active on a pool simultaneously. The sysctl vfs.vdev.scrub_max_active,
    with a default of 2, and vfs.vdev.scrub_min_active, with a default of 1, control
    this queue. Tuning adjusts how a scrub impacts system load. A higher queue depth
    makes the scrub complete sooner, but queues other operations behind the scrub
    operations.


    How ZFS uses these limits depends on the number of outstanding requests permitted.


    # Per-VDEV Requests


    To know how ZFS will schedule activity, you must know how many outstanding requests
    can go to each of the system''s VDEVs. Consider the maximum number of requests
    of each type per provider (usually a disk), as given by the sysctl from the previous
    section.'
