    # MySQL – InnoDB/XtraDB


    Inno became the default storage engine in MySQL 5.5 and has significantly different
    characteristics than MyISAM. Percona''s XtraDB, also used by MariaDB, is similar
    to InnoDB. Both InnoDB and XtraDB use a 16 KB block size, so the ZFS dataset record
    size is set to match. We also recommend using MySQL''s innodb_file_per_table setting
    to keep the InnoDB data for each table in a separate file, rather than grouping
    it into a single ibdata file. This makes snapshots more useful and allows selective
    restoration or rollback.


    Store different types of files on different datasets. The data files need 16 KB
    block size, compression and reduced metadata. You might see performance gains
    from caching only metadata, but this also allows prefetch. Experiment and see
