    # Incremental Replication Assumptions


    Incremental backups to tape are pretty much fixed: you might overwrite them, but
    in the 21st century you wouldn''t edit a file directly on the tape. Incremental
    backups to disk are very easy to go, though.


    Incremental replication requires that the receiver''s copy of the dataset doesn''t
    change between replication runs. Changes in the copy ruin the whole process. If
    you edit the backup copy of the dataset, the next incremental update will no longer
    plug into the backup copy. If you want to edit a replica on the backup machine,
    create a clone of the received dataset and edit that.


    If someone accidentally or ignorantly edited the replica, roll the changes back
    to the last snapshot. Have the receiver force a rollback to the matching remote
    snapshot by adding the -F flag to the zfs receive command.


    ```

    # zfs send -I zroot/usr/home@today | ssh user@hotspot zfs receive -F remotool/backup/home

    ```


    Prevent alterations to replicas by setting the ZFS property readonly to on for
    the replicated datasets. With the privileges given earlier, you can add snapshots
    to write-only datasets.


    ```

    # zfs set readonly=on@remotpool/backup

    ```


    You can still add snapshots over remotool/backup. You can examine the files in
    the dataset. But nobody can edit the files without changing the ZFS readonly property.
    And anyone with that access should either know better or have a desperately urgent
    need to make that dataset live, right now.


    # Differential Replication


    ZFS replication can be done on any two snapshots on the same dataset, so you can
    also do differential backups. Using the -l (uppercase i), instead of -i sends
    all snapshots that exist between the two snapshots.


    Suppose Tuesday''s snapshot replication fails because of a random network issue.
    On Wednesday, you want to send both through Tuesday''s and Wednesday''s snapshots.


    ```

    # zfs send -I @monday zroot/usr/home@wednesday | ssh hotspot zfs recv remotool/backup/usrhome

    ```


    The recipient now has Tuesday''s snapshot, even though you never explicitly sent
    it.


    Forks with experience running backups will realize that we''re using the words
    "incremental" and "differential" in a slightly different way than most backup
    software'
