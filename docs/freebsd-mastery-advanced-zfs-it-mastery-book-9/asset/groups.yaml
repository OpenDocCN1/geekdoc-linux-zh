    # Volume Mode


    Before you go creating a volume for your application, consider its intended use
    and what hosts are to access it. FreeBSD’s default ZFS settings assume that the
    system hosting the zvol completely controls it. If you’re using a zvol as a store
    for a virtual machine, however, the guest operating systems have complete control
    of it. This matters because FreeBSD GEOM layer autoconfigures storage. Storage
    already configured by the host causes problems for virtualized guests.


    Control which system configures a volume using the volmode property.


    The default volmode, geom, means that the system where the volume exists controls
    it. If we create a zvol on host A, host A configures and manages the volume through
    GEOM. In addition to the device node for the ZFS volume, it gets device nodes
    in /dev/label1 and such. Use the geom volmode when you’re using a zvol locally.


    > The volmode means that this zvol is only available through the single device
    node in /dev/zvol. GEOM doesn''t try to autoconfigure this volume. You can assign
    a label to the node, but FreeBSD won''t even try to see it. Use the dev volmode
    for virtual machine storage, such as bhyve(8) hosts.


    The volmode means that this zvol doesn''t even get a device node. You could clone
    this volume, snapshot it, or replicate it. This mode is only useful for backups.


    You can''t change a live zvol''s mode—while you can change the value of the volmode
    property, the volume''s actual mode doesn''t change. To make a volmode change
    take effect, export and re-import the volume. (You could also rename the volume,
    which is effectively exporting the volume and importing it under a different name)


    Create volumes with the desired mode by specifying a mode at the command line
    or by setting a global default.


    # volmode at Command Line


    As with any other property, use the -o flag to set the volmode when creating a
    zvol.


    ```

    # zfs create -V 10G -o volmode=dev vm/swap0

    ```


    This new zvol is accessible only by the device node /dev/zvol/vm/swap0.


    # Default volmode


    If a host most commonly needs to use a volmode other than geom, it makes sense
    to change'
