    # 启动环境与应用程序


    FreeBSD 在过去的几十年里开发了许多做法，特别是软件包。其中一些基于 FreeBSD 的习惯：MySQL 存储在 /var/db/mysql。有些是基于软件本身的偏好：PostgreSQL
    将记录保留在 /usr/local/postgresql。这些在使用启动环境时都会产生的问题。


    以 MySQL 为例。目录 /var/db/mysql 是根数据集的一部分。如果你将数据库数据存储在启动环境中，回退到旧的启动环境会将你的数据库数据恢复到之前的版本。这可能不是你想要的。


    其他软件具有相同的问题。处理这个问题并不，但你需要了解你的软件。你有两个选择：更改数据位置，或者在根目录下创建数据集。一旦你理解了需求，两种都可行。


    # 移动应用程序数据


    移动应用程序数据需要为数据创建一个数据集，并告诉应用程序使用该位置。在这里，我决定将 MySQL 数据放在 /var/mysql。


    ```

    # zfs create zroot/var/mysql

    ```


    我现在必须告诉 MySQL 使用这个数据目录。检查 /local/etc/rc.conf 中的变量，发现我在 /etc/rc.conf 中需要 `mysql_dbdir`
    选项：`mysql_dbdir=/var/mysql`。


    我必须将 /var/db/mysql 中的任何现有数据和配置文件移动到 /var/mysql，然后重启服务器。


    # 创建新数据集


    启动环境只影响根文件系统数据集。如果你想将应用程序留在通常的位置，必须为该数据创建一个新数据集。以 PostgreSQL 为例。PostgreSQL 将数据存储在
