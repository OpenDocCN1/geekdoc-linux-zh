- md: "\n# FreeBSD Mastery\nAdvanced ZFS\n\nJude & Lucas\n\n![](img/ec2cadedd00f39b2e62dde91407e8263_0_0.png)\n\
    \n# Table of Contents\n\n* Title Page\n* Acknowledgements\n* Chapter 0: Introduction\n\
    * Chapter 1: Boot Environments\n* Chapter 2: Delegation and Jails\n* Chapter 3:\
    \ Sharing Datasets\n* Chapter 4: Replication\n* Chapter 5: ZFS Volumes\n* Chapter\
    \ 6: Advanced Hardware\n* Chapter 7: Caches\n* Chapter 8: Performance\n* Chapter\
    \ 9: Tuning\n* Chapter 10: ZFS Potpourri\n* Afterword\n* Sponsors\n* About the\
    \ Authors\n* Publishing Information\n\n# # FreeBSD Mastery\nAdvanced ZFS\n\nAllan\
    \ Jude\nMichael W Lucas\n\n![](img/ec2cadedd00f39b2e62dde91407e8263_2_0.png)\n\
    \n# Acknowledgements\n\nOur gratitude goes to the people who offered feedback\
    \ on the manuscript that became this book: Will Andrews, Marie Helene Kvello-Aune,\
    \ Josh Paetzel, Benedict Reuschling, Alan Somers, Matthew Seaman, and Wim Wauters.\n\
    \nLukas’ portions of this book were largely written on hardware from iX Systems\
    \ (http://www.ixsysystems.com).\n\nThe authors would like to thank the FreeBSD\
    \ Project and the FreeBSD Foundation for providing access to NVMe devices in the\
    \ NetPerf cluster, and to Sentex Data Communications for hosting said cluster.\
    \ Lucas would like to thank Jude for somehow convincing these folks to grant Jude\
    \ cluster access, because there’s no way they’d give it to Lucas. Also because\
    \ it means Lucas didn’t have to write that part of the book.\n\n# Chapter 0: Introduction\n\
    \nThe Z File System, or ZFS, is a complicated beast, but it is also the most powerful\
    \ tool in a sysadmin’s Batman-esque utility belt. This book tries to demystify\
    \ some of the magic that makes ZFS such a powerhouse, and give you solid, actionable\
    \ intel as you battle your storage dragons.\n\nZFS contains over 100 “engineering\
    \ years” of effort from some of the best minds in the industry. While it has competitors,\
    \ such as B-Tree File System (BTRFS), those competitors have a lot of catching\
    \ up to do. And ZFS races further ahead every day.\n\nThis book takes you into\
    \ some of the more complicated and esoteric parts of managing ZFS. If you want\
    \ to know why a single gigabyte of data fills your 2 GB drive, if you want to\
    \ automatically update your disaster recovery facility, or if you just want to\
    \ boot environments on your laptop, *FreeBSD Mastery: Advanced ZFS* is for you.\n\
    \nJust about everything in this book applies in general to OpenZFS. We use FreeBSD\
    \ as the reference platform, but the mechanics of using OpenZFS don’t change much\
    \ among platforms.\n\n# Prerequisites\n\nThe title of the book includes the word\
    \ “Advanced.” We expect you to know a couple things before you can use this. The\
    \ easy answer would be that you should read and assimilate two earlier FreeBSD\
    \ titles: Storage Essentials and ZFS. But you might already know what’s in those\
    \ books, so here are some details on what you need to bring with you.\n\nYou’ll\
    \ need familiarity with FreeBSD’s storage management layer, GEOM. On non-FreeBSD\
    \ platforms you can use disks and partition devices for ZFS. Always use ZFS on\
    \ disk or partition devices, not on RAID or other software devices.\n\nWe assume\
    \ you’re familiar with ZFS pools and datasets. You know how to add VDEVs to a\
    \ pool, and understand why you can’t add a lone disk to your RAID-Z. You can take\
    \ snapshots and create clones.\n\nIf you want to use FreeBSD’s encrypted ZFS support,\
    \ you must understand FreeBSD’s GELI encryption. (You could use GBDE if you’re\
    \ relying on the encryption to preserve human life, but the built-in GELI support\
    \ suffices for most of us. Also, GELI takes advantage of the AES-NI hardware crypto\
    \ acceleration in modern CPUs.)\n\n# ZFS Best Practices\n\nWhile you can acquire\
    \ all needed ZFS knowledge from publicly available documentation, it won't give\
    \ you the ZFS best practices we've discussed in earlier books. As with many other\
    \ things, the nice thing about best practices is that there are many of them to\
    \ choose from. We're discussing some of our best practices here. Perhaps these\
    \ are better than yours and you'll gleefully adopt them. Even if your practices\
    \ blows away, these at least display so you know how we're approaching the issues\
    \ of storage management.\n\n# Space Management\n\nWith copy-on-write filesystems,\
    \ deleting files uses space. Sysadmins accustomed to traditional filesystems might\
    \ find this when they start with ZFS, but don't really worry until the first time\
    \ they run out and suffer a nasty shock. As the pool approaches capacity, ZFS\
    \ needs more space to store additional data. Performance degrades. While fragmentation\
    \ becomes more of an issue as the pool approaches 100% utilization, recovering\
    \ from a completely full pool is terribly hard. To prevent all of the space from\
    \ being used or to at least provide a warning ahead of time, create a reservation.\
    \ Ideally, you should create a reservation for 20% of your pool. You can always\
    \ lower the reservation to buy time while you work on adding or removing data.\
    \ The last thing you want is to unexpectedly run out of space. This can give you\
    \ the soft landing where only the last few percent of available disk is used.\
    \ On this TB pool, create a new dataset with a 200 GB reservation.\n\n```\nzfs\
    \ create -o reservation=200G mypool own```\n\nAny time you're exploring space\
    \ issues on ZFS, remember the zfs get space command. You'll see all of the space-related\
    \ properties in a convenient display.\n\n```\nzfs get space data/usr\nNAME   \
    \       SOURCE\ndata/usr      available     5.0T\ndata/usr      used         \
    \ 367M\nsnapshots     0\n```\n\nWhile zfs get space won't free up space for you,\
    \ it's the quickest path to finding out where space went.\n\n# Picking a VDEV\
    \ Type\n\nAs discussed in FreeBSD Mastery: ZFS, selecting the correct VDEV type\
    \ when creating your pool is the most important decision you make. It affects\
    \ the performance of your pool, as well as expansion possibilities.\n\nA study\
    \ by Paris, Amer, and Schwarz (http://arxiv.org/pdf/papers/1501/1501.pdf) found\
    \ that to build a disk array that could survive for four years with no human interaction\
    \ required triple parity. Double parity, even with unlimited number of spares,\
    \ cannot maintain 99.999% (five nines) reliability over a four-year period. Combine\
    \ this consideration with the hardware you have and your expected storage needs.\n\
    \n# The Importance of Labels\n\nBy labeling drives, you save your future self\
    \ lot of headache. Label your disks and partitions before adding them to a ZFS\
    \ pool—or, indeed, using them in any way for reasons we'll discuss through this\
    \ section.\n\nTake the case of an unfortunate friend of Jude, who created a pool\
    \ with raw device names. When a device failed, he rebooted before replacing the\
    \ disk. His pool looked little different than he expected.\n\n```\nzpool status\n\
    pool: data\nstate: DEGRADED\nstatus: One or more devices are currently resilvered.\
    \ The pool will\ncontinue to function, possibly in a degraded state.\naction:\
    \ Wait for the resilver to complete.\nscan: resilver in progress since Sat 11\
    \ 17:49:38 2015\n62.0M scanned out 1.57T at 5.16M/s, 87h40m to go\n9.81M resilvered,\
    \ 0.00% denom\n```\n\n```\nconfig:\n  STATE    READ WRITE CKSUM\n  data     DEGRADED\
    \     0      0      0\n    mirror-0 DEGRADED     0      0      0\n    spare-0\
    \  UNAVAIL     0      0      0\n    5694975301095445325 FAULTED      0      0\
    \      0 was /dev/da1\n```\n\n| NAME | STATE | VALUE | SOURCE |\n| :--- | :---\
    \ | :--- | :--- |\n| data | DEGRADED | | |\n| mirror-0 | DEGRADED | 856 (resivering)\
    \ | da7 |\n| da14 | ONLINE | | |\n| mirror-1 | ONLINE | | |\n| da1 | ONLINE |\
    \ | |\n| da13 | ONLINE | | |\n\nOriginally, the pool had two mirrors: mirror-0\
    \ of da1 and da15, and mirror-1 of da2 and da14. Disk da1 failed.\n\nFreeBSD dynamically\
    \ assigns device nodes at boot. With da1 missing, FreeBSD renamed the remaining\
    \ devices to shift one number lower. Disk da15 became da14, da14 became da13,\
    \ and worst of all, da2 became da1.\n\nSo then mirror-1 contained da1—which was\
    \ not the same da1 as the faulted disk. Once Jude's Mirror-0 was using its spare\
    \ (da7) in place of what was used to be da1. Once unfortunate friend put a disk\
    \ back in place for the failed da1, though, da7 became da8.\n\nZFS doesn't use\
    \ FreeBSD disk names to find the members of each VDEV, instead relying on its\
    \ own on-disk label with a Globally Unique Identifier (GUID). ZFS can identify\
    \ the disk no matter where the operating system puts its device node. And the\
    \ operating system doesn't care either—it found the disk for you and mounted the\
    \ filesystem; what more do you want?\n"
  mdcn: "\n\n# FreeBSD 精通\n进阶 ZFS\n\nJude & Lucas\n\n![](img/ec2cadedd00f39b2e62dde91407e8263_0_0.png)\n\
    \n# 目录\n\n* 标题页\n* 谢谢\n* 第 0 章：引言\n* 第 1 章：启动环境 (Boot Environments)\n* 第 2 章：权限划分与监狱\
    \ (Jails)\n* 第 3 章：数据集共享\n* 第 4 章：复制\n* 第 5 章：ZFS 卷\n* 第 6 章：高级硬件\n* 第 7 章：缓存\n\
    * 第 8 章：性能\n* 第 9 章：调优\n* 第 10 章：ZFS 杂谈\n* 结记\n* 赞助商\n* 关于作者\n* 出版信息\n\n# # FreeBSD\
    \ 精通\n进阶 ZFS\n\nAllan Jude\nMichael W Lucas\n\n![](img/ec2cadedd00f39b2e62dde91407e8263_2_0.png)\n\
    \n# 谢谢\n\n我们非常感谢对本书稿提供反馈的人士：Will Andrews, Marie Helene Kvello-Aune, Josh Paetzel,\
    \ Benedict Reuschling, Alan Somers, Matthew Seaman 和 Wim Wauters。\n\n书中由 Lukas\
    \ 编写的部分大部分是在 iX Systems（http://www.ixsysystems.com）的硬件上完成的。\n\n作者感谢 FreeBSD 项目和\
    \ FreeBSD 基金提供 NetPerf 集群中的 NVMe 设备，并感谢 Sentex Data Communications 托管了该集群。Lucas\
    \ 感谢 Jude 以某种方式说服这些人授予 Jude 访问集群的权限，因为他们绝不会给 Lucas 的。此外，这意味着 Lucas 就不需要写书中的那部分了。\n\
    \n# 第 0 章：引言\n\nZ 文件系统（或 ZFS）是一个复杂的怪兽，但它也是系统管理员蝙蝠侠工具用带中最强大的工具。本书试图揭秘让 ZFS 如此强大的某些魔力，并在你与存储巨龙作斗时，为你提供坚实且可操作的情报。\n\
    \nZFS 包含了业内一些顶尖人才超过 100 个“工程年”的心血。尽管它有竞争对手，例如 B 树文件系统 (BTRFS)，但那些竞争对手还有很多路要走。而\
    \ ZFS 每天都在遥遥领先。\n\n本书将带你进入管理 ZFS 的一些复杂且深奥的部分。如果你想知道为什么 1GB 的数据会填满你的 2GB 硬盘，如果你想自动更新你的灾难恢复设施，或者你只想笔记本电脑上运行启动环境，那么\
    \ *FreeBSD Mastery: Advanced ZFS* 正为你准备的。\n\n书中几乎所有内容都适用于 OpenZFS。我们使用 FreeBSD\
    \ 作为参考平台，但使用 OpenZFS 的机制在不同平台之间并没有太大。\n\n# 前提条件\n\n书名中包含了“进阶”一词。我们预计你在使用它之前已经掌握一些知识。简单的答案是你应该阅读并吸收早期的两本关于\
    \ FreeBSD 的著作：《存储精要》(Storage Essentials) 和《ZFS》。但你可能已经知道那些书中的内容了，所以这里是关于你需要准备知识的细节。\n\
    \n你需要熟悉 FreeBSD 的存储管理层 GEOM。在非 FreeBSD 平台上，你可以使用磁盘和分区设备运行 ZFS。请务必在磁盘或分区设备上使用 ZFS，而不是在\
    \ RAID 或软件设备上。\n\n我们假设你熟悉 ZFS 存储池（pools）和数据集（datasets）。你知道如何向池中添加 VDEV，并理解为什么不能向\
    \ RAID-Z 中添加单块磁盘。你可以拍摄快照并创建克隆。\n\n如果你想使用 FreeBSD 的加密 ZFS 支持，你必须理解 FreeBSD 的 GELI\
    \ 加密。（如果你依靠加密来保护人类生命，可以使用 GBDE，但内置的 GELI 支持对我们大多数人来说足够了。）\n\n# ZFS 最佳实践\n\n虽然你可以从公开文档中获取所需的\
    \ ZFS 知识，但它并不会提供我们在之前的书中讨论过的 ZFS 最佳实践。正如许多其他事情一样，最佳实践的妙处在于有很多供选择。我们在这里讨论一些最佳实践。也许这些比你的更好，你会乐意采纳它们。它们至少让你知道我们是如何处理存储问题的。\n\
    \n# 空间管理\n\n在写时复制（copy-on-write）文件系统中，删除文件会占用空间。习惯传统文件系统的系统管理员在开始使用 ZFS 时可能会发现这一点，直到第一次耗尽空间时感到震惊。当池接近容量时，ZFS\
    \ 需要更多空间来存储额外数据。性能会下降。为了防止空间意外耗尽，理想情况下，你应该为池创建一个预留（reservation）。你可以在添加或删除数据时随时降低预留。你最希望的情况是耗尽空间。在可用磁盘剩余最后百分比时，创建一个预留\
    \ 200GB 的数据集。\n\n```\nzfs create -o reservation=200G mypool\n```\n\n每当你探索 ZFS\
    \ 空间问题时，记住 `zfs get space` 命令。你会看到所有与空间相关的属性。\n\n```\nzfs get space data/usr\n\
    NAME          SOURCE\ndata/usr      available     5.0T\ndata/usr      used   \
    \       367M\n```\n\n虽然 zfs get 不会为你释放空间，但它是发现空间去向的最快路径。\n\n# 选择 VDEV 类型\n\n正如《FreeBSD\
    \ Mastery: ZFS》中所讨论的，创建池时选择正确的 VDEV 类型是你所做出的最重要的决定。它影响池的性能以及扩展的可能性。Paris、Amer\
    \ 和 Schwarz 的一项研究（http://arxiv.org/pdf/papers/1501/1501.pdf）发现，要构建一个无需人工干预即可生存四年的磁盘阵列，需要三冗余（triple\
    \ parity）。双冗余即使有无限数量的备用盘也无法在四年内保持 99.999%（五九）的可靠性。将此考虑与你拥有的硬件以及你的存储需求相结合。\n\n\
    # 标签的重要性\n\n通过对驱动器标记，你可以避免未来的很多麻烦。在将它们添加到 ZFS 池之前，标记你的磁盘和分区——我们将在本节中讨论这种方法。\n\n\
    以 Jude 的一个不幸的朋友为例，他使用原始设备名称创建池。当一个设备故障时，他在更换磁盘之前重启了。他的池看起来与预期的的不一样。\n\n```\nzpool\
    \ status\npool: data\nstate: DEGRADED\nstatus: 一个或多个设备正在恢复。池将继续运行，可能处于降级状态。\n\
    action: 等待恢复完成。\nscan: resilver in progress since Sat 11 17:49:38 2015\n62.0M\
    \ scanned out 1.57T at 5.16M/s, 87h40m to go\n9.81M resilvered, 0.00% denom\n\
    ```\n\n```\nconfig:\n  STATE    READ WRITE CKSUM\n  data     DEGRADED     0  \
    \    0      0\n    mirror-0 DEGRADED     0      0      0\n    spare-0  UNAVAIL\
    \     0      0      0\n    5694975301095445325 FAULTED      0      0      0 was\
    \ /dev/da1\n```\n\n| NAME | STATE | VALUE | SOURCE |\n| :--- | :--- | :--- | :---\
    \ |\n| data | DEGRADED | | |\n| mirror-0 | DEGRADED | 856 (resivering) | da7 |\n\
    | da14 | ONLINE | | |\n| mirror-1 | ONLINE | | |\n| da1 | ONLINE | | |\n| da13\
    \ | ONLINE | | |\n\n最初，池有两个镜像：da1 和 da15 的 mirror-0，以及 da2 和 da14 的 mirror-1。磁盘\
    \ da1 故障了。\n\nFreeBSD 在启动时动态分配设备节点。由于 da1 缺失，FreeBSD 重命名了剩余设备以向下移动一位。磁盘 da15 变成了\
    \ da14，da14 变成了 da13，最糟糕的是，da2 变成了 da1。\n\n因此，mirror-1 包含了 da1——但这并不是故障磁盘所在的 da1。一旦\
    \ Jude 的 Mirror-0 使用了它的备用盘（da7）来代替原来的 da1。然而，一旦那个不幸的朋友为故障的 da1 放回了磁盘，da7 就变成了\
    \ da8。\n\nZFS 不使用 FreeBSD 磁盘名称来查找每个 VDEV 的成员，而是依赖于自带带有全局唯一标识符（GUID）的磁盘上标签。无论操作系统将设备节点放在哪里，ZFS\
    \ 都能识别该磁盘。操作系统也不在乎——它为你找到了磁盘并挂载了文件系统；你还想要什么？\n\n"
