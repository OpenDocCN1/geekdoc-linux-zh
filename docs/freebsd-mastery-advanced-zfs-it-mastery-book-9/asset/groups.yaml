    maximum size.(Strictly speaking, the minimum ARC size is half of the maximum amount
    of memory usable for metadata in the ARC, which is one quarter of the maximum
    ARC size.) Use the boot-time tunable vfs.arc_min to set a minimum ARC size. Like
    the maximum size, the minimum size is expressed in bytes. Here I set the minimum
    ARC size to 4 GB in `/boot/loader.conf`.


    ```

    vfs.arc_min="429467296"

    ```


    Lucas normally sets up and lower limits on ARC only when he''s gotten sick of
    explaining how the ARC works to non-technical managers. “Yes, PostgreSQL can use
    a lot of memory. The ARC uses memory. But the ARC only caches that PostgreSQL
    calls for, and PostgreSQL must be up and running to do so, it''s not a problem.”¹


    FreeBSD 10.2 and can later specify how much the ARC should try to leave free for
    use of other processes, with the sysctl vfs.arc_free_target. The value is different
    from the others in this section because it is specified in pages, not bytes. A
    page is 4096 bytes of memory, so a value of 2 GB would be expressed as 524288
    (2 * 1024³ / 4096). When the amount of free memory drops below this value, the
    kernel memory reaper runs. The reaper performs two functions: it adjusts the size
    of the ARC to ensure there is enough free memory, and it defragments the KMEM
    Arena. While ZFS has rapidly allocating and freeing bits of memory as file moves
    in and out of the ARC, it has littered all the different segments of kernel memory.
    Memory is not returned to free until all allocations in an arena are freed. This
    manifests itself as the amount of wired memory being significantly higher than
    the size of the ARC plus the expected wired pages like the networking stack. Unlike
    the previous tunables, vfs.arc_free_target can be adjusted on a running system
    and takes immediate effect.


    # Metadata and the ARC


    Filesystem metadata includes all the stuff about files, except the files themselves:
    directories, permissions, ownership, size, properties, and the ARC caches all
    of this information exactly as it caches file contents. Accessing a file’s contents
    requires accessing the file’s metadata, after all.


    By default, the ARC uses up to one-fourth of its maximum size to cache this metadata.
    While this is almost always sufficient, if a filesystem has a bunch of tiny files,
    you might need to expand this limit. The boot-time tunable vfs.arc_meta_limit
    lets you configure a specific limit for metadata that can be either or below the
    default. We hard-code the ARC’s metadata cache to 8 GB in `/boot/loader.conf`.'
