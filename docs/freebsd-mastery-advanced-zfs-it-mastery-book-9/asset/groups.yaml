    ## SAS Multipath


    Systems with high availability requirements and many disks might need SAS Multipath.
    The goal of multipath is to provide more than a single path from the CPU to each
    disk. The other paths can be used for load balancing or failover. Generally, multipath
    means connecting two or more controllers to the backplane or storage shelf that
    contains the disks.


    ## Why Multipath?


    When each disk can be reached via any of the controllers, the failure of one controller
    or cable doesn''t have to interrupt service. Additionally, it can allow you to
    use the combined bandwidth of all of the controllers.


    This concept can even be extended to provide full High Availability. If you have
    JBOD shelf full of disks, connect one of the SAS ports to the first server, and
    the other to the second server. Now both machines have access to the disks. Use
    something like CARP, one of the many heartbeats domains, or some quorum-based
    high availability service to allow these two servers to share an IP address.


    With both machines having access to all the data, you can gracefully fail over
    services between the machines. This lets you do that OS upgrade have been putting
    off, without taking down the file server.


    Take extra care to ensure that both systems don''t try to mount the disks simultaneously.
    This is why the zpool import command checks the Host ID, and refuses to import
    pools that look like they''re in use by another system.


    ## Multipath Modes


    Multipath poses an interesting problem. If each of your disks has two or more
    paths back to the CPU, the operating system sees each individual disk multiple
    times, once via each controller. Now my 36-disk system suddenly appears to have
    72 disks.


    The GEOM multipath module, gmultipath(8), takes these multiple paths and provides
    a single logical storage device to the operating system. Gmultipath(8) automatically
    chooses the best path to reach the disk, so the upper layers don''t have to worry
    about it.


    GEOM multipath currently supports three modes of operation: active/passive, active/active,
    and active/read.


    Active/passive uses only one path at a time. When a path fails, the system reissues
    the command on the next path. Specify active/passive with -P.


    Active/active mode uses all paths simultaneously to increase the available bandwidth.
    Using all the paths can sometimes actually hurt performance. The active/active
    mode has no idea what''s happening at the filesystem or application level; it
    sprays the instructions across the different controllers. Commands that depend
    on each other might have to wait for response from the other controller before
    they are able to proceed. Specify active/active mode with -A.


    Active/read mode uses all paths for reads, but does all writes via the primary
    path. This hybrid approach resolves some of the write order problems that can
    be introduced by using active/active mode. This mode may help saturate an SSD
    by providing more controller bandwidth. On a regular spinning disk, random I/O
    performance may actually be worse than active/passive. Specify active/read with
    -R.


    A fourth mode, logical block, is being investigated, but is not available yet.
    Logical block mode breaks the disk into chunks of a specified size, and always
    uses the same path to access that region. This can avoid cache duplication on
    the controllers, as the same region of the disk will not be accessed by both controllers.
    This can also solve the write ordering issue and is expected to provide better
    performance than active/active mode.


    ## Identifying Disks


    The annoying part of configuring multipath is identifying which devices nodes
    (/dev/dax) represent different views of the same hardware. You must solve this
    before you add any labels to the disks. One way to solve this is to use camcontrol(8)
    on SAS devices to get the serial number.


    ```

    # camcontrol inquiry da7 -S

    EHNLWRC

    # camcontrol inquiry da43 -S

    EHNLWRC

    ```


    Compile a list of devices and their serial numbers, and find the ones that match
    up.


    Alternatively, you can use sesutil(8) to match up slot numbers. We''ll use Jude''s
    multipath system as an example. It has two enclosures: the front one has the back
    one one of the SAS ports to the first server, and the other to the second server.
    Now both machines have access to the disks. Use something like CARP, one of the
    many heartbeats domains, or some quorum-based high availability service to allow
    these two servers to share an IP address.


    With both machines having access to all the data, you can gracefully fail over
    services between the machines. This lets you do that OS upgrade have been putting
    off, without taking down the file server.


    Take extra care to ensure that both systems don''t try to mount the disks simultaneously.
    This is why the zpool import command checks the Host ID, and refuses to import
    pools that look like they''re in use by another system.

