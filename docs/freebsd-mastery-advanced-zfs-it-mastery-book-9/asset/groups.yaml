    你可以通过 `cachefile` 属性控制缓存文件的位置。在这里，我们更改 `work` 存储的缓存文件。


    ```bash

    # zpool set cachefile=/work/zfs/work.zpool.cache work

    ```


    尽管许多遗留的过时文档给出了相反的，但在现代版本的 ZFS 或 FreeBSD 中，几乎没有理由更改 `cachefile` 的位置。


    既然你已经理解了缓存，我们就可以谈谈性能了。


