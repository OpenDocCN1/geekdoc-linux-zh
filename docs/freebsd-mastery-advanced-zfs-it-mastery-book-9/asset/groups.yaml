    Software settings will not let you exceed the hardware’s limitations, of course.


    SSDs are not as notoriously fragile as they once were. A modern data center class
    SSD, like a 200 GB Intel DC S3700, has an Endurance Rating of “10 drive writes
    per day for 5 years.” This translates to around 2,000 GB per day, or 23 MB/second.
    You could constantly write 22 MB/s to this drive, and according to Intel it would
    endure for five years. On a high-performance server, tuning the throttle sysctls
    up to these values and adding a note to order a new cache device in 58 months
    would make sense. As your host probably won’t write to the L2ARC at full throttle
    all of the time, turning these parameters even higher might make sense.


    # ZFS Intent Log


    Caches aren’t just for reading data. ZFS caches for writes as well, through the
    ZFS Intent Log (ZIL). ZFS dumps writes to the ZIL, and processes those writes
    to add them properly to ZFS. Every pool has its own ZIL. In normal use, ZFS uses
    a chunk of space on each provider for the ZIL. If you desire, you can add an extra
    device for use as a ZIL. Strictly speaking, the ZIL isn''t exactly a write cache.
    But it''s sort of cachey, so we''ll cover it in this chapter.


    The ZIL doesn’t work the way people think it does, however. To understand when
    a pool needs a separate logging device and when it doesn’t, you must understand
    how ZFS writes data.


    # Sync and Async Transactions


    ZFS is all about the integrity of data that reaches permanent storage. Data on
    the disk should always be coherent. A system might lose data in between the program
    and the disk, but no filesystem can protect-in-flight data residing only in RAM.


    To ensure on-disk data integrity, ZFS groups requests in transaction groups, or
    txgs. A transaction group is a bunch of data and the associated filesystem metadata.
    When you ask the system to write to disk, ZFS collects those writes in a transaction
    group. One transaction group can include writes from many unrelated processes.
    The group has enough data or a timer expires, that transaction group writes to
    the disk. That timer might be as long as 30 seconds or as short as five, depending
    on release of FreeBSD you’re running.


    A transaction group is the filesystem’s to-do list. Exactly like your to-do list,
    if something horrible happens the list gets thrown to the wolves. Data is vulnerable
    to system failure until it is completely written to the disk. If the system crashes
    or dies before the transaction group is written to disk, that data is lost. Reducing
    the transaction group timeout might reduce the amount of data loss, but it also
    impacts performance.


    As the sysadmin, it’s your job to manage the risk of data loss. Let’s walk through
    writing data to disk.


    A program hands the kernel a chunk of data and says, “Please write to the disk.”
    The program does not proceed until the kernel acknowledges receipt of the data.
    Once the kernel says, “I have the data,” the program continues. A program waiting
    for this response is said to be blocking on I/O.


    The important question is: when does the kernel acknowledge receipt of the data?
    When the data is added to a transaction group, or when it''s written to disk?


    In normal operation, the kernel acknowledges the data when the data is added in
    memory as part of a pending transaction group. The data is not on the disk—the
    kernel has merely claimed responsibility for the data. If the system was a restaurant,
    dinner now would be in the waiter''s hands on the way to the customer, but the
    waiter could still trip. Variants of asynchronous operation are common among modern
    filesystems, such as the various versions of Linux''s extfs and BSD UFS.


    A filesystem can also work in synchronous mode, where the kernel acknowledges
    data only when the bits are written to the physical storage medium. Sync counts
    are extremely safe, but also extremely slow. The program that wrote the data will
    block waiting for the kernel''s write request. Certain programs, such as database
    servers, request synchronous acknowledgement for particular files using the fsync(2)
    system call. The zsadmin hit metadata synchronously, so that the system only acknowledges
    data when the write is complete, or could use the fsync(8) program to tell the
    system to flush everything to disk right now.


    # ZFS Intent Log


    When ZFS writes files in synchronous mode, it doesn''t immediately push a transaction
    to the disk. Instead, those writes get dumped on the ZIL. They''re not neatly
    ordered as ZFS dataset blocks; instead, they''re just a heap of blocks on the
    disk. When the transaction group gets written to the disk, the blocks on the ZIL
    get written to their proper location.


    The pool import process checks the ZIL for data that hasn''t yet reached its final
    home. If the system finds in-flight blocks in a pool it''s importing, it completes
    those transactions.


    Pools normally use a small chunk of space on each storage provider as the ZIL.
    Yes, this means synchronous write get written to physical storage twice. But the
    pool only uses the ZIL for synchronously-written data. Normal, asynchronous writes
    get stored in RAM and committed as part of a regular transaction group.


    You can sometimes improve performance by putting the ZIL on a dedicated, fast
    device, called a Separate Intent LOG.


    # Separate Intent Log


    You can separate the ZIL from the pool by using a Separate Intent Log, or SLOG.
    By moving the ZIL to separate, dedicated hardware, you avoid writing the same
    data twice to the storage providers. If the SLOG hardware is faster than the pool,
    the kernel can acknowledge the data more quickly, improving the performance of
    the requesting application.


    Despite common usage, a SLOG is not the same thing as a ZIL. The SLOG lives on
    either the SLOG or the storage providers. You can launch the SLOG through a window,
    but you can only swear at the ZIL.


    The fastest, most reliable, and most expensive SLOG is an NVRAM chip. High-endurance
    SSDs are the most common choice for SLOG. You can even use fast SAS drives, but
    they''re the least reliable. Every one of these needs a private power source,
    such as a battery or a supercapacitor, to let them complete writes in a system
    failure.


    A SLOG does not need to be large. The systemctl vfs.zfs.dirty_data_max gives the
    maximum possible amount of in-flight data. FreeBSD 10''s ZFS defaults to using
    a ZIL with a size equal to one-tenth of the system RAM. You could use a single
    piece of hardware to support SLOG for more than one pool, but also splits that
    device''s I/O between those pools. One reason for


    Not all SSDs are created equal. For an application where data integrity is vital,
    the authors strongly encourage you to consult with hardware vendor such as iX
    Systems (www.ixsystems.com). A poor choice can devastate your performance.


    # Per-Dataset ZIL Tuning


    You can control whether a dataset uses the ZIL with the sync property. The default
    setting, standard, tells the dataset to use the ZIL. Setting sync to always is
    the safest way to manage data, but it has a serious performance penalty.


    Setting sync to disabled completely disables use of the ZIL on this dataset. All
    writes are asynchronous. Never disable the ZIL on any dataset used by a database
    or NFS. The only reason to disable the ZIL on a dataset is to verify that the
    ZIL is not causing your application performance problem. If disabling the ZIL
    fixes your application, definitely file a bug report or install a fast SLOG.


    In all cases, leave sync at standard. You might have one.


    ZFS winds up the data storage backend for many different applications, such as
    the Network File System (NFS) and iSCSI. You might use a zvol for a virtualized
    system''s drive. All of these different layers operate independently. While they
    can talk to each other through the common system calls and APIs, they don''t control
    each other. Each layer of an application stack (and (routinely does) lie to the
    other layers. And nowhere is this more obvious, and more dangerous, than the fsync(2)
    system call.


    Suppose you have a virtual machine that runs off an iSCSI drive, backed by a zvol
    on your server. The virtual machine''s operating system requests a synchronous
    disk write. The iSCSI stack requests that and passes it to ZFS. If you set sync
    to disabled on that zvol ZFS snickers, says “Synchronous? Sure! You got it, buddy,”
    and waits to do anything until the next txg.

