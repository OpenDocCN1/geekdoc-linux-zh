    To view the activity for a single pool, give the pool a name.


    # zpool iostat work


    This eliminates all output except for the specified pool.


    # Current & Ongoing Pool Activity


    To see how the pool is behaving at this particular moment, and how activity changes
    over time, have zpool iostat print new statistics every few seconds. Specify a
    number of seconds at the end of the command line. Here we get updates every two
    seconds. Hit CTRL-c to exit.


    # zpool iostat 2

