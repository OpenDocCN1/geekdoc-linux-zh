    # zpool.cache


    现在让我们讨论一个你可能听过，但对日常系统管理没有影响的文件： `/boot/zfs/zpool.cache`。


    `zpool.cache` 文件包含了系统中当前活跃的存储池（pools）及其提供者的描述。当你启动 ZFS 系统时，内核会检查根池上的 `zpool.cache`
