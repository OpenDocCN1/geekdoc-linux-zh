    ## Building a ZFS Delegation Jail


    Your jails probably don''t want a bare-bones jail. They probably want an actual
    userland, with programs and the ability to run services. That means installing
    FreeBSD on your jailed dataset. Jails can be incredibly complex, so we do not
    completely cover them. We''ll do a basic FreeBSD install on a jailed dataset,
    so you can add ZFS to your existing jail processes.


    First, create the jail dataset.


    ```

    # zfs create -p mypool/jails/lucas/zroot

    ```


    Now installing the operating system on that dataset. You can install directly
    from the FTPs, where we have the amd64 version of FreeBSD 10.3.


    ```

    # fetch -o ftp://ftp.freebsd.org/pub/FreeBSD/releases/amd64/10.3-RELEASE/base.txz
    | tar -Xf -C /

    /mypool/jails/lucas/

    ```


