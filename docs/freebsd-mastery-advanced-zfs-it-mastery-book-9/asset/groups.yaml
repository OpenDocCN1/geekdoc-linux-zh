  - '[PAGE 185]


    Once the pool finishes resilvering the drives, you can split the pool.


    # Splitting the Pool


    Use the zpool split command to pull a device from each VDEV to create the new
    pool. The command has mandatory arguments: the name of the pool you want to split
    and a name for the newly created pool. Here we split the pool db, creating an
    identical copy in the pool db2.


    ZFS removes the device most recently added to each mirror to create a new pool.


    Splitting a pool does not automatically import the new pool. Once you import it,
    the split pool looks like this.


    ```

    # zpool status db2

    ...

    NAME      STATE READ WRITE CKSUM

    db2      ONLINE 0     0      0

    gpt/zfs4 ONLINE 0     0      0

    gpt/zfs5 ONLINE 0     0      0

    ```


    This pool contains two striped disks.


    In the original pool, the striped pair of three-way mirrors has become a striped
    pair of two-disk mirrors.


    If you’re keeping this split-off pool around for any length of time, you should
    add more disks to create proper mirrors. You might not add another set of disks
    if you’re pulling backups off of these drives, though.'
  - '[PAGE 186]


    # SnapSpec


    Snapshots are great—but they breed tribbles™. Once you’re accustomed to using
    snapshots to deal with system administration issues, you’ll find yourself dealing
    with disk storage shortages because of all the snapshots you have. Removing a
    single snapshot is easy.


    ```

    # zfs destroy mypool/dataset@snapshotname

    ```


    But if you want to destroy 10 snapshots at once? Identifying each snapshot and
    specifying each on the command line is incredibly tedious.


    ZFS lets you identify multiple neighboring snapshots with a snapspec. You can’t
    use a snapspec to specify multiple disparate snapshots, but if you want to blow
    away daily snapshots @monday through @saturday, a snapspec is your friend.


    Any time you use a snapspec, we recommend running your command with -n and -v.
    The -v flag tells zfs(1) to print what the command does in more detail. The -n
    tells it not to actually do anything. Combined, they “give me more detail on exactly
    what this command will do.” As you can assign arbitrary snapshot names, it’s best
    to verify that a needed but forgotten snapshot won’t be caught up in a snapshot
    massacre. Once you know exactly which snapshots the command will destroy, rerun
    the command without the -n.


    # Snapshot Range


    The basic snapspec is fromsnap%tosnap. It destroys every snapshot between the
    two indicated, including themselves:


    ```

    # zfs destroy -vn mypool/dataset@one@three

    would destroy mypool/dataset@one

    would destroy mypool/dataset@two

    would destroy mypool/dataset@three

    ```


    If you slip a @beforeUpgrade snapshot in between the numbered snaps? This is why
    you use -n first.


    # Specify by Age


    You can use @foo to destroy snapshot@foo and anything older than this.


    ```

    # zfs destroy -vn mypool/dataset@four

    would destroy mypool/dataset@one

    would destroy mypool/dataset@two

    would destroy mypool/dataset@three

    would destroy mypool/dataset@four

    ```'
  - '[PAGE 187]


    Similarly, use @foo% to destroy @foo and anything newer than itself:


    ```

    # zfs destroy -vn mypool/dataset@six%

    would destroy mypool/dataset@six

    would destroy mypool/dataset@seven

    would destroy mypool/dataset@eight

    would destroy mypool/dataset@nine

    would destroy mypool/dataset@ten

    ```


    That''s much easier than re-entering each snapshot.


    # Snapshot Slaughter


    Sometimes, you want to destroy all snapshots. Use @% to burn it all down.


    ```

    # zfs destroy -vn mypool/dataset@%

    would destroy mypool/dataset@one

    would destroy mypool/dataset@two

    ...

    would destroy mypool/dataset@ten

    ```


    Now you can start accumulating snapshots all over again.


    If you''ve taken recursive snapshots, you probably want to burn the whole tree
    down. Add -r to eradicate snapshots from a dataset and all its children. Here,
    we''ve finished the upgrade and we think we''re happy with the results


    ```

    # zfs destroy -nvR pgsql/data%

    would destroy pgsql/data@beforeupgrade

    would destroy pgsql/data/base@beforeupgrade

    would destroy pgsql/data/pg_xlog@beforeupgrade

    ```


    But, you know ... we think we''ll hold on those backups just a little longer.'
