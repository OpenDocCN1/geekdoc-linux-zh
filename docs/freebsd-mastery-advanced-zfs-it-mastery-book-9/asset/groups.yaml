    Threads: 32 Size: 131072 READ Time: 30 IO/s: 25718 MB/s: 3214

    Threads: 64 Size: 131072 READ Time: 30 IO/s: 25710 MB/s: 3213

    ```


    Two threads maximize throughput with these large blocks.


    A mere 3200 MB/s might not sound fast—it''s 3.2 GB/s. But SATA measures performance
    in bits, not bytes. Once you get rid of the overhead, SATA 3 6 GB/s maxes out
    at about 550 MB/s.


