    ```

    # zfs create zroot/usr/local/postgresql

    ```


    没有 /usr/local 数据集，你无法创建 zroot/usr/local/postgresql。如果你创建一个标准的 /usr/local 数据集，你将从启动环境中提取
    /usr/local 中的文件，或者在填充的 /usr/local 目录上覆盖一个空文件系统。与 /usr 一，解决方案是创建一个 `canmount` 属性设置为
    off 文件系统，然后创建子数据集。


    ```

    # zfs create -o canmount=off zroot/usr/local

    # zfs create zroot/usr/local/postgresql

    ```


    你现在拥有 /usr/local/postgresql 自己的数据集，并可以安全地通过启动环境运行 PostgreSQL。


    两种解决方案都没有解决 Apache 这样混乱的软件软件包。例如，Apache 2.4 在 /usr/local/www 和 /usr/local/etc/apache24
    中塞了一堆东西。管理员应该编辑这些文件的一部分，而不是全部。通过 ZFS 数据集进行完全分离。对于 Apache 此类程序，我通常会创建一个全新的数据集，例如
    /var/www/，并将活动站点文件放在那里。


