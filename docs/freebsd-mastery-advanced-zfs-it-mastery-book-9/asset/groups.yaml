    zroot/ROOT/default@2016-02-16-08:35:22 25.9M - 479M -

    ```


    This host has one snapshot, named after the boot environment I created. The default
    boot environment is what''s currently running, so it doesn''t need a snapshot.
    Now look at the datasets under zroot/ROOT.


    Each boot environment is a dataset under zroot/ROOT, cloned from the source snapshot.

    The boot environment default is zroot/ROOT/default, while the 10.3-release boot
    environment is at zroot/ROOT/10.3-release.


    While all the boot datasets have a mountpoint of /, every boot environment except
    the active one cannot set to off. You can mount these datasets if you wish, but
    you''ll want to specify a new mount point.


    Destroying a boot environment destroys the associated snapshot and clone.


    # Accessing Unused Boot Environments


    One way to access the contents of unused boot environments is to check the snapshots
    the boot environments were created. The boot environments are accessible in the
    hidden /.zfs directory. This is convenient for quick checks.


    If you want to mount boot environments read-write, use the beadm mount command
    and the boot environment name. The boot environment will be read-write mounted
    in a location /tmp.


    ```

    # beadm mount 10.3-p19

    ```


    Mounted successfully on /tmp/BE-10.3-p19.DmtRWZGf


    When you finish with the environment, unmount it with beadm umount.


    ```

    # beadm unmount 10.3-p19

    ```


    Unmounted successfully.'
  - '[PAGE 27]


    It is possible to mount and unmount boot environment snapshots with the camount
    and mountpoint properties. If you do it incorrectly, however, you''ll mount the
    old boot environment over the top of your running boot environment. While FreeBSD
    filesystems are stackable, changing all the system binaries on a running system
    can put you in a difficult situation. Imagine being unable to run reboot(8) because
    the binary can''t talk to the running kernel!


    Be safe. Use snapshot mounting and unmounting functions built into beadm(8).'
  - "[PAGE 28]\n\n# Boot Environments at Boot\n\nSo you've truly hosed your operating\
    \ system. Forget getting to multi-user mode—even single mode has dissolved into\
    \ a stream of error messages so obscure that even FreeBSD's most experienced kernel\
    \ hackers think your hardware has been hitting the radiator booze. FreeBSD 10.3\
    \ and above lets you change your boot environment right at the loader prompt.\
    \ This requires console access, but so would any other method of getting yourself\
    \ out of this hole. \n\nBoot the host. You'll get a loader menu much like this,\
    \ plus some graphics.\n\n```\n+==========Welcome to FreeBSD==========+\n| 1. Boot\
    \ Multi User [Enter]\n| 2. Boot [S]ingle User\n| 3. [E]scape to loader prompt\n\
    | 4. Reboot\n|\nOptions:\n| 5. [K]ernel: kernel (1 of 2)\n| 6. Configure Boot\
    \ [O]ptions..\n| 7. Select Boot [E]nvironment...\n|\n+====================================++=\n\
    ```\n\nNote item 7. Select it and you'll get a new menu.\n\n```\n+==========Welcome\
    \ to FreeBSD==========+\n| 1. Active:\n| 2. bootfs: zfs:zroot/ROOT/default\n|\
    \ 3. [P]age: 1 of 1\n|\nBoot Environments:\n| 4. 10.3-release\n| 5. default\n\
    |\n+==========================================\n```\n\nChoose your preferred boot\
