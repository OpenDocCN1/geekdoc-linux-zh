    LBA #04: Data Size: 4096 Metadata Size: 8

    LBA #05: Data Size: 4096 Metadata Size: 64

    LBA #06: Data Size: 4096 Metadata Size: 128

    ```


    LBA 格式允许指定扇区大小，包括用于加密或元数据的额外空间。FreeBSD 尚未让你用不同的扇区格式化驱动器。


