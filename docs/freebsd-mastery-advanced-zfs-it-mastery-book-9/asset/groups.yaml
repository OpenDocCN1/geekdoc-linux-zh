  - '[PAGE 46]


    # Delegation and Jails


    FreeBSD supports a lightweight virtualization method called jails. You’ll find
    many tutorials on using jails, so we won’t get into the complexities of jails.³
    FreeBSD’s ZFS implementation has special support for jails.


    A dataset can be marked for use only in a jail. The jail’s root user has full
    control of the dataset. She can create child datasets and change any properties
    she wishes.


    A jailed dataset cannot be mounted on the host system. The jail dataset is untrusted,
    and might have property settings that are incompatible—or actively hostile to—the
    host. As an example, the jail might have a dataset with a mountpoint of /etc.
    Remember, BSD filesystems are stackable. If the host mounts that jail, the jail’s
    /etc/password, rc.conf, sshd_config, and other vital system files will work. Worst
    case, the jail’s sysadmin could claim control of the host. Best case, the host’s
    sysadmin would have a really unhappy day.


    As far as the jail’s root user can tell, he almost completely owns the dataset.
    The only property he cannot change is the quota. Editing the quota might give
    him more access than the sysadmin allocated to him.


    The jailed root account can see that it exists within a jail, however. The root
    account can see each of their dataset’s parent datasets up to the root of the
    pool. If you have a jails pool and a jail exists in, say, jails/customers/lucas,
    the root user can see that path. You can’t see any other datasets outside the
    jail, however. Other customer datasets are invisible.


    # Jailing a Dataset


    To build a jail, set the jailed property to on. The host will no longer be able
    to mount the dataset.


    To build a jail, use the zroot/lucas/jail dataset to serve as the root of his
    prison. Here we use


    ```

    # zfs create -o jailed=on mountpoint=/jail zroot/jails/lucas/jail

    ```


    Once you have the dataset, start a temporary jail rooted in that.


    ```

    # jail -c path=/zroot/lucas/jail mount.devfs allow.allow.mount.zfs \

    hostname=lucas ip4.addr="lo0|127.0.0.2" exec.poststart=\\n/sbin/zfs jail lucas
    zroot/lucas/jail command=/bin/sh

    ```


    Now enter the jail.'
