  - '[PAGE 29]


    # Boot Environments and Applications


    FreeBSD developed many traditional practices over the last decades, especially
    with add-packages. Some of these are based on FreeBSD sensibilities: MySQL stashes
    in /var/db/mysql. Some are based on the software''s preferences: PostgreSQL keeps
    its records in /usr/local/postgresql. All of these pose possible problems when
    using boot environments.


    Let''s consider MySQL as an example. The directory /var/db/mysql is part of the
    root dataset. It''s included in boot environments. If you store your database
    data in a boot environment, falling back to an older boot environment will also
    revert your database data to an earlier version. This probably isn''t what you
    want.


    Other server software has exactly the same problem.


    Dealing with this isn''t hard, but it requires that you know your software. You
    have two choices: changing the application data location, or creating datasets
    in the old application directory. Both work fine once you understand your needs.


    # Moving Application Data


    Moving application data requires creating a dataset for application data, and
    telling the application to use that location. Here, I decide to put my MySQL data
    in /var/mysql.


    ```

    # zfs create zroot/var/mysql

    ```


    I now have to tell MySQL to use this data directory. Checking the variables in
    /usr/local/etc/rc.mysql-server tells me I want the MySQL-dbdir option in /etc/rc.conf.
    mysql_dbdir=/var/mysql"


    I must move any existing data and configuration files from /var/db/mysql to /var/mysql,
    then restart the server.


    # Creating New Datasets


    A boot environment affects only the root filesystem dataset. If you want to leave
    application data in the usual locations, you must create a new dataset for that
    data. Let''s consider PostgreSQL as an example. PostgreSQL stores its data in
    /usr/local/postgresql, so you could just create that dataset.


    ```

    # zfs create zroot/usr/local/postgresql: does not exist

    ```


    Without a /usr/local dataset, you cannot create zroot/usr/local/postgresql. But
    if you create a standard /usr/local dataset, you''ll pull the files in /usr/local
    out of the boot'
  - '[PAGE 30]


    environment, or overlay an empty filesystem on top of the populated /usr/local
    directory.

    As with /usr, the solution is to create a filesystem with the canmount property
    set to off, and

    then create the child dataset.


    ```

    # zfs create -o canmount=zroot/usr/local

    # zfs create zroot/usr/local/postgresql

    ```


    You now have /usr/local/postgresql as its own dataset, and can safely run PostgreSQL
    with

    boot environments.


    Neither solution addresses messy software packages like Apache. Apache 2.4, for

    example, sticks of stuff in /usr/local/www and /usr/local/etc/apache24. The sysadmin
    is

    upposed to edit some, but not all, of these files. Complete separation by ZFS

    dasets. For Apache and programs like it, I normally create an entirely new dataset,
    such

    as /var/www/, and put the active site files there.


    # Disk Encryption and Boot Environments


    The standard beadm boot environment manager only works with a single root filesystem

    daset. A FreeBSD installation to GELI-encrypted disk is incompatible with beadm.


    Installing default FreeBSD with ZFS onto an encrypted disk device requires a small,

    unencrypted partition to store the boot kernel. The default installer creates
    the pool bootpool

    for this, and puts the /boot in bootpool/boot. On a running system, /boot is a
    symlink to

    other pool. The rest of the system goes in the zroot pool.


    You can use boot environments on encrypted disks. You just don''t get the convenience

    of a boot environment manager. Take a snapshot before you upgrade your system.
    Clone

    that snapshot to create a copy of the kernel for each boot

    environment. Change which FreeBSD uses as the root filesystem with the

    zroot pool''s bootfs property.


    Booting the kernel requires a whole different process, however. Before patching
    your

    kernel you must create a copy of that kernel named after your boot environment.
    Before

    upgrading from say, 10.3-RELEASE to 10.3-p5, you''ll want to copy the 10.3-RELEASE

    kernel from /kernel to /boot/kernel.10.3r. If you have to revert the boot environment,

    choose the old kernel at the loader menu.


    PC-BSD 10 does support boot environments on GELI-encrypted disks, but they

    use the GRUB boot loader and some special trickery.'
- md: "\nFreeBSD 11.0 is expected to support booting from GELI encrypted ZFS without\
    \ the separate bootpool, allowing boot environments to work the same as they do\
    \ on unencrypted disks. That feature has not landed as of this book’s publication\
    \ date.\n\nFor most FreeBSD ZFS users, boot environments save a lot of trouble.\
    \ Let’s go on and talk about other ways to save you trouble.\n\n> We're told that\
    \ the World Trade Organization considers tampering with a sysadmin's email to\
    \ be grounds for execution. We haven't experimentally verified this, because it\
    \ conforms to our prejudices.\n\n# Chapter 2: Delegation and Jails\n\nThe ZFS\
    \ designers did their best to ease storage management for system administrators.\n\
    One of the best ways to reduce the amount of work you do is to make someone else\
    \ do the work for you. ZFS has a fully featured delegation system that lets you\
    \ dictate what commands and features a user or group of users can use on each\
    \ dataset. You can allow users to create and destroy their own snapshots, create\
    \ child datasets, generate space consumption reports, or control the properties\
    \ of a dataset. ZFS builds on the delegation feature to provide special support\
    \ to jails.\n\n## ZFS Delegation\n\nZFS lets you delegate administrative tasks\
    \ to users on a per-property and per-command basis for each database. You can\
    \ give the database administrator complete control over the database pool, or\
    \ the web server admin control over snapshots on the web site data. Use the zfs\
    \ allow command to delegate permissions.\n\nGiving zfs allow a pool or dataset\
    \ as an argument shows the permissions on that device. Here I get the permissions\
    \ on the pool remotepool.\n\n```bash\n# zfs allow remotepool\n---- Permissions\
    \ on remotepool -----\nLocal+Descendent permissions:\n  user replicator compression,\
    \ create, destroy, mount, mountpoint, receive\n```\n\nThis pool has a single permission\
    \ entry, for the replicator. This user has rights to the compression and mountpoint\
    \ properties, as well as the create, destroy, mount, and receive subcommands of\
    \ zfs. (Chapter 4 discusses the importance of these particular permissions.)\n\
    \nApplications and users can define their own properties. Programs like zftools\
    \ create properties to manage snapshots. There is a special permission, userprop,\
    \ to allow users to create user-defined properties. User-defined properties are\
    \ assigned as a single permission: you cannot separately assign different user-defined\
    \ properties.\n\nWhile root is not listed as having any permissions here, root\
    \ can do whatever it pleases. Because that's how Unix rolls.\n\n## Adding Permissions\n\
    \nDelegate permissions on a pool or a dataset to a user or group. The -u flag\
    \ lets you specify a username to zfs allow, and -g specifies a group.\n\n```bash\n\
    # zfs allow -u username permissions pool/dataset\n```\n\nSuppose we have a troublesome\
    \ user—call him Lucas. He keeps trying stupid Unix tricks that fry his home directory.\
    \ Let's allow Lucas to create own snapshots so he doesn't have to bother the sysadmin\
    \ every time he breaks his environment.\n\n```bash\n# zfs allow -u lucas snapshot,rollback\
    \ mypool/usr/home/lucas\n```\n\nWhen you view the dataset permissions, the two\
    \ permissions you've assigned him show up.\n\n```bash\n# zfs allow mypool/usr/home/lucas\n\
    ---- Permissions on mypool/usr/home/lucas -----\nLocal+Descendent permissions:\n\
    \  user lucas rollback, snapshot\n```\n\nDelegations are automatically inherited.\
    \ When Lucas gained the ability to snapshot his home directory dataset, he also\
    \ gained permission on all of the child datasets of his home directory. For some\
    \ reason he has a dataset called blackmail. It's probably where he stashes all\
    \ of the photos and records he uses to get BSD developers to help him with research\
    \ and technical reviews.\n\n```bash\n# zfs allow mypool/usr/home/lucas/blackmail\n\
    --- Permissions on mypool/usr/home/lucas\nLocal+Descendent permissions:\n lucas\
    \ rollback, snapshot\n```\n\nLucas should have the access to create a snapshot.\
    \ Before telling him it works, though, impersonate and create a snapshot.\n\n\
    ```bash\n$ su lucas\n$ zfs snapshot mypool/usr/home/lucas/blackmail@bsdcan-drunken-escapades\n\
    $ zfs list -t all -r -o name mypool/usr/home/lucas\nNAME\nmypool/usr/home/lucas\n\
    mypool/usr/home/lucas/blackmail\nmypool/usr/home/lucas/blackmail@bsdcan-drunken-escapades\n\
    ```\n\nWe know this. Let's get rid of the snapshot before Lucas gets any ideas\
    \ he doesn't already have.\n\n```bash\n$ zfs destroy mypool/usr/home/lucas/blackmail@bsdcan-drunken-escapades\n\
    cannot destroy snapshots: permission denied\n```\n\nCreating new datasets involves\
    \ moving them, and destroying a dataset obviously should include unmounting that.\
    \ To be useful, clone, create, and destroy commands all require the mount permission.\
    \ To grant lucas permissions, run zfs allow -u lucas and list the desired permissions\
    \ and dataset.\n\n```bash\n# zfs allow -u lucas destroy,mount mypool/usr/home/lucas\n\
    ```\n\nChecking your work shows every privilege you've assigned in both runs of\
    \ zfs allow.\n\n```bash\n# zfs allow mypool/usr/home/lucas\n--- Permissions on\
    \ mypool/usr/home/lucas\nLocal+Descendent permissions:\n lucas destroy, mount,\
    \ rollback\n```\n\nLucas can now show himself in the foot by destroying the dataset\
    \ his home directory resides on. And he'll certainly call to whine about it.\n"
  mdcn: "\n\nFreeBSD 11.0 预计支持从 GELI 加密的 ZFS 启动，而无需独立的启动池，使得启动环境的工作方式与在未加密磁盘上完全一致。在本书出版时，该功能尚未发布。\n\
    \n对于大多数 FreeBSD ZFS 用户来说，启动环境节省了大量麻烦。让我们继续讨论其他可以帮你节省麻烦的方法。\n\n> 我们听说，世界贸易组织认为篡改系统管理员的电子邮件是处刑的理由。我们还没有通过实验来验证这一点，因为这符合我们的偏见。\n\
    \n# 第 2 章：委托与监狱 (Jails)\n\nZFS 设计者尽力减轻系统管理员的存储管理工作。\n减少工作量最好的方法之一就是让别人为你工作。ZFS\
    \ 拥有一个功能全委托系统，允许你规定用户或用户组在每个数据集上可以使用命令和功能。你可以允许用户创建和销毁自己的快照、创建子数据集、生成空间消耗报告，或控制数据集的属性。ZFS\
    \ 基于委托功能为 jails 提供了特殊支持。\n\n## ZFS 委托\n\nZFS 允许你针对每个数据库，按属性和按命令将管理任务委托给用户。你可以让数据库管理员完全控制数据库池，或让\
    \ Web 服务器管理员控制网站数据上的快照。使用 `zfs allow` 命令来委托权限。\n\n将池或数据集作为参数传递给 `zfs allow` 会显示该设备的权限。在这里，我获取\
    \ `remotepool` 池的权限。\n\n```bash\n# zfs allow remotepool\n---- Permissions on remotepool\
    \ -----\nLocal+Descendent permissions:\n  user replicator compression, create,\
    \ destroy, mount, mountpoint, receive\n```\n\n该池有一个权限条目，针对 `replicator`。该用户拥有\
    \ `compression` 和 `mountpoint` 属性的权限，以及 zfs 的 `create`、`destroy`、`mount` 和 `receive`\
    \ 子命令。（第 4 章讨论了这些特定权限的重要性。）\n\n应用程序和用户可以定义自己的属性。像 `zftools` 这样的程序创建属性来管理快照。有一个特殊的权限\
    \ `userprop`，允许用户创建用户定义的属性。用户定义的属性被作为一个单一权限分配：你不能单独分配不同的用户定义属性。\n\n虽然 root 在这里没有被列出任何权限，但\
    \ root 可以随心所欲地做任何事。因为 Unix 就是这么运行的。\n\n## 添加权限\n\n将池或数据集的权限委托给用户或组。`-u` 标志允许你为\
    \ `zfs allow` 指定用户名，`-g` 指定组。\n\n```bash\n# zfs allow -u username permissions\
    \ pool/dataset\n```\n\n假设我们有一个麻烦的用户——就叫他 Lucas 吧。他总是尝试一些愚蠢的 Unix 技巧，搞坏了他的家目录。让我们允许\
    \ Lucas 创建自己的快照，这样他每次弄坏环境时就不需要打扰系统管理员了。\n\n```bash\n# zfs allow -u lucas snapshot,rollback\
    \ mypool/usr/home/lucas\n```\n\n当你查看数据集权限时，你分配给他的两个权限就会显示出来。\n\n```bash\n# zfs\
    \ allow mypool/usr/home/lucas\n---- Permissions on mypool/usr/home/lucas -----\n\
    Local+Descendent permissions:\n  user lucas rollback, snapshot\n```\n\n委托是自动继承的。当\
    \ Lucas 获得对其家目录数据集创建快照的能力时，他也获得了家目录下所有子数据集的权限。出于某种原因，他有一个名为 `blackmail`（勒索）的数据集。那可能是他存放所有照片和记录的地方，他用这些来获取\
    \ BSD 开发者帮助他进行研究和技术评审。\n\n```bash\n# zfs allow mypool/usr/home/lucas/blackmail\n\
    --- Permissions on mypool/usr/home/lucas\nLocal+Descendent permissions:\n lucas\
    \ rollback, snapshot\n```\n\nLucas 应该拥有创建快照的权限。但在告诉他可以用之前，先模拟身份并创建一个快照。\n\n```bash\n\
    $ su lucas\n$ zfs snapshot mypool/usr/home/lucas/blackmail@bsdcan-drunken-escapes\n\
    $ zfs list -t all -r -o name mypool/usr/home/lucas\nNAME\nmypool/usr/home/lucas\n\
    mypool/usr/home/lucas/blackmail\nmypool/usr/home/lucas/blackmail@bsdcan-drunken-escapes\n\
    ```\n\n我们知道这样做。在 Lucas 产生新想法之前，让我们删掉这个快照。\n\n```bash\n$ zfs destroy mypool/usr/home/lucas/blackmail@bsdcan-drunken-escapes\n\
    cannot destroy snapshots: permission denied\n```\n\n创建新数据集涉及挂载，而销毁数据集显然应该包括卸载。为了能够有用，`clone`、`create`\
    \ 和 `destroy` 命令都需要 `mount` 权限。要授予 lucas 权限，运行 `zfs allow -u lucas` 并列出所需的权限和数据集。\n\
    \n```bash\n# zfs allow -u lucas destroy,mount mypool/usr/home/lucas\n```\n\n检查你的工作会显示两次运行\
    \ `zfs allow` 时分配的所有权限。\n\n```bash\n# zfs allow mypool/usr/home/lucas\n--- Permissions\
    \ on mypool/usr/home/lucas\nLocal+Descendent permissions:\n lucas destroy, mount,\
    \ rollback\n```\n\nLucas 现在可以自作自受地毁掉他家目录所在的数据集。而且他一定会来抱怨的。\n\n"
