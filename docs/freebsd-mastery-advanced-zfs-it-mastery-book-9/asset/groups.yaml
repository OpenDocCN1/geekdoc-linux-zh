    ## 数据集与 ARC


    某些数据具有规律的访问模式，这使得 ARC 变得无关紧要——当任何文件被第二次访问时，它早已从 MRU（最近最使用）列表和 MFU（最频繁使用）列表中过期了。这通常发生在数据集包含数百万个文件，且你可以轻松预测其使用情况的情况下。告诉
    ARC 不要缓存这些文件可以释放内存，用于缓存可能从中获益的文件。


    ZFS 属性 `primarycache` 定义了数据集信息中哪些部分进入 ARC。默认值 *all*（全部）意味着同时缓存文件数据和元数据。


    将 `primarycache` 设置为 `metadata`（元数据）告诉 ARC 只缓存每个文件的元数据，而不是内容。对于包含大量文件的目录，你可能会发现这很有用。如果没有元数据缓存，在大型目录上运行
    `ls(1)` 可能需要花费几分钟，因为 ZFS 需要读取磁盘并组装信息。仅缓存元数据会导致 ZFS 预取失效，这对性能的损害可能比仅元数据缓存带来的帮助更大。


    将 `primarycache` 设置为 `none`（无）告诉 ARC 不要缓存此数据集的任何内容。没有缓存就无法进行预取，但如果一个数据集没有被缓存，性能显然不再需要考虑的问题。


    例如，Lucas 的服务器之一拥有一个数 TB 大的数据集，其中在过去的 15 年中创建了无数文件。在这些文件被访问的少数情况下，它们是按顺序搜索的。服务器没有足够的内存来有效地缓存所有这些文件的内容。告诉
    ARC 在此数据集上缓存元数据意味着 `ls(1)` 仍然运行飞快，但我们不会让这台机器的 ARC 被无用的垃圾占用。


    在更改 `primarycache` 属性之前，你必须卸载并重新挂载数据集：


    ```bash

    # zfs set primarycache=metadata cdr/cdr

    # zfs unmount cdr/cdr

    # zfs mount cdr/cdr

    ```


    现在 ARC 可以空出有用的工作，例如缓存分析这些记录时创建的临时文件。


    卸载数据集会从 ARC 和 L2ARC 中移除关于该数据集的所有缓存信息。


    ## 二级 ARC


    ARC 会不断进行自我修剪以保持在允许的大小内。长时间未被引用的文件会从 MRU 列表中移除。通常情况下，从 ARC 中删除的项会消失——虽然它们会在幽灵列表（ghost
    lists）中，因此 MFU 队列可以在它们再次出现时识别出它们，但系统依赖于文件的磁盘副本。


    二级 ARC（或 L2ARC）是一个二级读取缓存。L2ARC 捕从 ARC 中掉出的项。通过使用小型、快速、高耐用的磁盘来缓存 ARC 数据，你可以同时减少系统主存储的读取负载并提高读取性能。`zpool(8)`
    命令将 L2ARC 称为缓存设备。


    虽然 L2ARC 被写入磁盘，但其中的数据在重启后不会仍然存在。即使这些索引可用，在重启系统之前，池可能已经在另一台机器上被修改过。ZFS 无法信任缓存设备上的信息。


    截至 2016 年初，已经有了几乎完整的持久化 L2ARC 实现。有了持久化 L2ARC，系统将重新加载主 L2ARC 并将所有内容加载回内存。虽然此功能可能永远不会广泛普及，但重度
    L2ARC 用户未来可能会关注该功能。


