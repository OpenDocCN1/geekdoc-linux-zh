  - '[PAGE 150]


    # ZFS Prefetch


    The job of a filesystem is to provide stored data on request. ZFS takes that idea
    further, by getting ready to provide data you''re about to ask for. This takes
    place on two levels, per-VDEV and per-file. FreeBSD doesn’t enable per-VDEV prefetch
    by default, enables per-file prefetching.


    # Per-VDEV Prefetch


    The most time-consuming part of retrieving data from a spinning disk is positioning
    the heads over the tracks containing the data. It’s like making a sandwich—slapping
    peanut butter between two slices of bread takes two minutes, but going to the
    store to get bread and peanut butter might take you an hour. Now the hardware
    is physically arranged, reading a full track of data off a disk spinning at 5,000
    or 10,000 RPM takes microseconds.


    Per-VDEV prefetch is an attempt to make moving the heads worthwhile. FreeBSD does
    not use per-VDEV prefetching by default, but if your workload involves complicated
    metadata, complex or large directory trees, or many small files, per-VDEV prefetch
    might help you.


    Whenever ZFS reads a few blocks off the VDEV, it also reads the few blocks after
    the target blocks, looking for metadata. Any metadata found gets stuffed into
    a special per-VDEV prefetch cache. There’s a good chance the requesting program
    will return and ask for that metadata. Each time a program requests prefetched
    metadata, ZFS provides it from the cache, returns to the physical VDEV, and prefetches
    more blocks.


    Per-VDEV prefetched blocks go into a simple Least Recently Used cache, not the
    ARC. The size of a VDEV’s cache equals the number of storage providers in the
    VDEV times it is tunable vfs.zdev.cache.size. FreeBSD sets this to 0 by default,
    so the cache is not used. Enable the cache by setting this tunable to the desired
    value in /boot/loader.conf. A common value vfs.zdev.cache.size="10M"


    After a reboot, you’ll have a per-VDEV prefetch cache in play.


    The sysctl kstat.zfs.misc.vdev_cache_stats.miss shows how many times ZFS checked
    the per-VDEV cache for metadata and didn’t find it. Similarly, the sysctl kstat.zfs.misc.vdev_cache_stats.hits
    shows how often ZFS found something in the cache.'
  - '[PAGE 151]


    Test your workload with without per-VDEV prefetch and see how it behaves.


    How much does per-VDEV prefetching preemptively cache? The sysctl vfs.zfs.vdev.max
    gives the minimal size of a read from a VDEV. This defaults to 16384, or 16 KB.
    If a program requests a read smaller than this size, per-VDEV prefetching kicks
    in.


    The read isn’t just expanded to 16 KB, however. The sysctl vfs.zfs.vdev.cacheshift
    gives the amount of data to be prefetched and searched for metadata. This is a
    bit value, so the default of 16 means 64 KB.


    So, if a program requests a read smaller than 16 KB, ZFS reads 64 KB instead.
    If a program requests a read of, say, 20 KB, no-VDEV prefetching occurs.


    While changing the prefetch values helped performance with some older versions
    of ZFS, in modern ZFS you should almost always leave alone. The authors are aware
    of any situations when changing these values helps, but we do know many times
    when changing these values causes suffering.


    # Per-File Prefetch


    If a program requests the start of a file, it’ll probably want the rest of the
    file before. ZFS’ per-file prefetching tries to anticipate these requests, caching
    the file in the ARC before the program gets around to asking for it. This makes
    ZFS feel more responsive. This is often called ZFS’ intelligent prefetch, or sometimes
    just prefetch. While file-level prefetching might not appear terribly sophisticated,
    most filesystems don’t manage it.


    File-level prefetch increases the size of the ARC. FreeBSD automatically disables
    prefetching on hosts less than 4 GB of RAM, and automatically enables it for hosts
    with 4 GB or more. You can override this by setting the tunable vfs.zfs.prefetch_disable
    to 1 in /boot/loader.conf.


    Prefetch can cause problems on systems that have hundreds of thousands (or more)
    tiny files, such as 64 KB and smaller. You’ll want to disable file-level prefetch
    for such hosts. Those systems are fairly rare, however.


    Normal, file-level prefetch improves performance if your system has sufficient
    memory to support it. You can enable and disable prefetch to test performance,
    but in almost all cases prefetch is helpful.'
- md: "\n## Transaction Group Tuning\n\nYou can tune performance by adjusting transaction\
    \ groups and the I/O scheduler. We’re specifically covering tuning FreeBSD 10\
    \ and later. The mechanisms for tuning OpenZFS writes in earlier versions were\
    \ considerably more baroque.\n\nA transaction group, or txg, is a single lump\
    \ of data written to disk in an ordered manner. A transaction group can contain\
    \ many blocks from many different programs. If the entire transaction group is\
    \ not successfully written to the disk, the entire group is canceled.\n\nYou can\
    \ control how often the system writes a transaction group and its maximum size.\n\
    \n## txg Timing\n\nIf nothing else triggers writing a txg to disk, ZFS write every\
    \ few seconds, as given by the sysctl vfs.zfs.txg.timeout. While the value of\
    \ this setting flailed around a bit in earlier releases of OpenZFS, the current\
    \ default is five seconds. Worst case, any pending data gets written to disk every\
    \ five seconds.\n\nFor most systems, writing every five seconds is fine. A program\
    \ like top(1) might show a burst of CPU activity every five seconds as the pending\
    \ transaction group gets compressed. You rarely reduce the timeout to less than\
    \ five seconds.\n\nIncreasing the value make sense for some systems, however.\
    \ If you’re running ZFS on a low-load virtual machine, you might crank the txg\
    \ timeout to 15 or so. Lucas often runs hosts LDAP mirrors and authoritative DNS\
    \ servers on virtual machines, and these kinds of hosts rarely have high demand\
    \ for disk I/O. Reducing the frequency of transaction writes wouldn’t improve\
    \ performance on this particular virtual machine, but it would improve hardware\
    \ access for other VMs running on hypervisor. Giving all the virtual machines\
    \ that host mostly low settings would improve performance for virtual machines\
    \ across the board, but a single selfish or high-load VM could eat up many of\
    \ those gains. (That might be exactly what you’re trying to achieve, however.)\n\
    \nOn typical hardware that shares reading and writing bandwidth, increasing the\
    \ timeout might improve read performance most of the time, but will degrade read\
    \ performance during writes.\n\nIf the timer expires and the system has no transactions\
    \ waiting to be written to disk, ZFS won’t write any data. ZFS won’t write an\
    \ empty transaction just for the sake of having a transaction group. It still\
    \ increments the transaction group count, however.\n\nSetting the transaction\
    \ group timeout to less than five seconds runs up against the I/O scheduler and\
    \ the write throttle. For most of us, five seconds is the minimum sensible value.\n\
    \n## txg Size\n\nA txg that grows sufficiently large gets committed to disk before\
    \ the timeout. FreeBSD auto-tunes the maximum size of a transaction group at boot\
    \ time based on the amount of memory in the host and the tunable vfs.zfs.dirty_data_max_percent.\
    \ The default is 10, up to a maximum of 4 GB, and is controlled by vfs.zfs.dirty_data_max_max.\
    \ Once a transaction group uses 10 percent of a system's RAM, it gets written\
    \ to disk.\n\nYou can change the maximum size of a transaction group after boot\
    \ with the sysctl vfs.zfs.dirty_data_max. This value is in bytes, multiply your\
    \ desired number of gigabytes by 1024³ to get the proper sysctl value.\n\nThe\
    \ hard question is: should you change the size of the transaction group? How long\
    \ does it take your system to write 10 percent of RAM to disk, and how often does\
    \ it happen? Most hosts have far more RAM than they have I/O throughput. Trying\
    \ to write one tenth of RAM in five seconds would be a disaster. Lucas' test host\
    \ has several hard drives in a single pool and 32 GB of RAM. Writing 3.2 GB to\
    \ disk takes 20 seconds. If this host generated 3.2 GB of disk activity in less\
    \ than the standard five-second timeout, the machine would quickly spiral into\
    \ unusability.\n\nIf your system is a high-performance disk array with big goals\
    \ of throughput and an economy-sized pile of RAM, you might find increasing the\
    \ maximum value useful.\n\nDuring \"write cycles,\" most reading from disk is\
    \ suspended. This allows the write to complete as quickly as possible. Reading\
    \ resumes once writing is complete. \"Interleaving\" the workload this usually\
    \ increases performance. Using knowledge of your workload, you can decide if flushing\
    \ larger groups less often or smaller ones more is the best approach. When bulk\
    \ copying data inside the same pool, Jude increased the txg size to 24 GB and\
    \ the timeout to 30 seconds, and improved performance by 25 percent.\n\n## txg\
    \ Duration and Contents\n\nIf you're trying to tune the size and period of transaction\
    \ groups, it makes sense to ask how large they are and how long they take to commit.\
    \ To measure the amount of data in each txg, use the following script:\n\n```dtrace\n\
    #!/usr/bin/dtrace -s\ntxg-syncing\n/((dsl_pool_t*)arg0)->dp_spa->spa_name == $1/\n\
    {\n  start = timestamp;\n}\ntxtg-synced\n/start && ((dsl_pool_t*)arg0)->dp_spa->spa_name\
    \ == $1/\n{\n  this->d = timestamp - start;\n  printf(\"%4dMB of %dMB synced in\
    \ %d.%02d seconds\",\n  d_total / 1024 / 1024,\n  d_max / 1024 / 1024, this->d\
    \ / 1000000000,\n  this->d / 1000000000 % 100);\n}\n```\n\nRun this script giving\
    \ the pool name as an argument. Lucas has created some dtrace scripts useful for\
    \ measuring both simultaneously.\n\n```dtrace\ndtrace -s 'duration' matched 2\
    \ probes\n\nCPU ID:NAME\n1::txg-synced synced 0.11 seconds\n2::txg-synced synced\
    \ 0.24 seconds\n4::txg-synced synced 0.22 seconds\n2::txg-synced synced 0.31 seconds\n\
    ```\n\nIf you see that your transaction groups are bouncing against the maximum\
    \ txg size, you might want to either increase the txg size or decrease the time\
    \ between groups. Despite best efforts, ZFS isn't working hard on this.\n\n##\
    \ Write Throttle\n\nOne term you'll hear about is the write throttle. The write\
    \ throttle can come into play when a program feeds data into memory from ZFS can\
    \ write it to disk. As the system RAM gets more and more full, ZFS starts inserting\
    \ a small delay into each write request. Programs wait until they get a response\
    \ to their write requests, putting a delay forces them to slow down. The goal\
    \ is to determine how much load the disks can take, and slow down programs that\
    \ they run at exactly that speed.\n\nThe write throttle algorithm in FreeBSD 10\
    \ and newer works much more smoothly. You can tune it through the I/O scheduler,\
    \ discussed next.\n"
  mdcn: "\n\n## 事务组调优\n\n你可以通过调整事务组和 I/O 调度器来优化性能。我们专门针对 FreeBSD 10 及更高版本的调优。在早期版本中，调优\
    \ OpenZFS 写入的机制要复杂得多。\n\n事务组（或 txg）是按顺序写入磁盘的单块大容量数据。一个事务组可以包含来自许多不同程序的许多数据块。如果整个事务组没有成功写入磁盘，则整个组都会被取消。\n\
    \n你可以控制系统写入事务组的频率及其最大尺寸。\n\n## txg 计时\n\n如果没有其他触发因素将 txg 写入磁盘，ZFS 会每隔几秒写入一次，这具体由\
    \ `sysctl vfs.zfs.txg.timeout` 决定。虽然该设置的值在 OpenZFS 的早期版本中有所波动，但目前的默认值是五秒。最坏的情况下，任何待处理的数据都会每五秒写入一次磁盘。\n\
    \n对于大多数系统来说，每五秒写入一次是可以的。像 `top(1)` 这样的程序可能会每五秒显示一次 CPU 活动突峰，因为待处理的事务组正在被压缩。你很少会将超时时间减少到五秒以下。\n\
    \n然而，对于某些系统，增加该值是有意义的。如果你在低负载虚拟机上运行 ZFS，你可能会将 txg 超时时间增加到 15 秒左右。Lucas经常在虚拟机上运行主机\
    \ LDAP 镜像和权威 DNS 服务器，而这类主机对磁盘 I/O 的需求通常不高。减少事务写入的频率不会提高这台特定虚拟机的性能，但它会提高运行在超层视程序上的其他虚拟机的硬件访问效率。为大多数运行低负载设置的虚拟机提供低设置可以提高所有虚拟机的整体性能，但单个自私或高负载的虚拟机可能会消耗掉许多此类增益。（不过，这可能恰恰是你想要达到的目标。）\n\
    \n在共享读写带宽的典型硬件上，增加超时时间在大多数情况下可能会提高读取性能，但在写入期间会降低读取性能。\n\n如果计时器到期且系统没有等待写入磁盘的事务，ZFS\
    \ 将不会写入任何数据。ZFS 不会为了有一个事务组而写入一个空事务。然而，它仍然会增加事务组的计数。\n\n将事务组超时时间设置为五秒以下会遇到 I/O\
    \ 调度器和写入节流的限制。对大多数人来说，五秒是最小合理值。\n\n## txg 大小\n\n增长得足够大的 txg 会在超时之前提交到磁盘。FreeBSD\
    \ 在启动时会根据主机的内存量和可调优的 `vfs.zfs.dirty_data_max_percent` 自动调整事务组的最大尺寸。默认值为 10%，最高可达\
    \ 4 GB，并由 `vfs.zfs.dirty_data_max_max` 控制。一旦事务组使用了系统 10% 的内存内存，它就会被写入磁盘。\n\n你可以在系统启动后使用\
    \ `sysctl vfs.zfs.dirty_data_max` 更改事务组的最大尺寸。该值的单位是字节，将你所需的 GB 数值乘以 $1024^3$ 即可获得适当的\
    \ `sysctl` 值。\n\n棘手的问题是：你是否应该更改事务组的大小？你的系统将 RAM 的 10% 写入磁盘需要多久？发生的频率是多少？大多数主机的\
    \ RAM 内存远大于其 I/O 吞吐量。尝试在五秒内写入十分分之一的内存将是一场灾难。Lucas 的测试主机在单个池中有几块硬盘并拥有 32 GB 内存。向磁盘写入\
    \ 3.2 GB 数据需要 20 秒。如果该主机在标准的五秒超时时间内生成了 3.2 GB 的磁盘活动，机器将迅速陷入不可用的状态。\n\n如果你的系统是一个高性能磁盘阵列，具有极大的吞吐量目标和经济规模的内存，你可能会发现增加最大值是有用的。\n\
    \n在“写入周期”期间，大多数从磁盘的读取会被挂起。这允许写入尽快完成。写入完成后，读取恢复。这种交替工作负载通常可以提高性能。通过对工作负载的了解，你可以决定是频繁地刷新大组还是频繁地刷新小组。在同一个池内大量拷贝数据时，Jude\
    \ 将 txg 大小增加到 24 GB并将超时延长到 30 秒，性能提高了 25%。\n\n## txg 持续时间和内容\n\n如果你正在调整事务组的大小和周期，使用以下脚本测量它们的大小和耗时是合理的：\n\
    \n```dtrace\n#!/usr/bin/dtrace -s\ntxg-syncing\n((dsl_pool_t*)arg0)->dp_spa->spa_name\
    \ == $1/\n{\n  start = timestamp;\n}\ntxtg-synced\n/start && ((dsl_pool_t*)arg0)->dp_spa->spa_name\
    \ == $1/\n{\n  this->d = timestamp - start;\n  printf(\"%4dMB of %dMB synced in\
    \ %d.%0d seconds\",\n  d_total / 1024 / 1024,\n  d_max / 1024 / 1024, this->d\
    \ / 1000000000,\n  this->d / 1000000000 % 100);\n}\n```\n\n运行脚本并传入池名称。Lucas 创建了一些可以同时测量这两者的\
    \ dtrace 脚本。\n\n```dtrace\ndtrace -s 'duration' matched 2 probes\n\nCPU ID:NAME\n\
    1::txg-synced synced 0.11 seconds\n2::txg-synced synced 0.24 seconds\n4::txg-synced\
    \ synced 0.22 seconds\n2::txg-synced synced 0.31 seconds\n```\n\n## 写入节流\n\n你可能会听到的一个术语是写入节流（write\
    \ throttle）。当程序向内存提供数据而 ZFS 可以将其写入磁盘时，写入节流就会发挥作用。随着系统 RAM 越来越满，ZFS 开始在每个写入请求中插入微小的延迟。程序会等待写入请求的响应，这种延迟迫使它们慢下来。目标是确定磁盘可以承受的负载，并让程序以恰好该速度运行。\n\
    \nFreeBSD 10 及更高版本中的写入节流算法运行得流畅得多。你可以通过 I/O 调度器对其进行调优，将在下文中讨论。\n\n"
