    ## Datasets and the ARC


    Some data has regular access patterns that make the ARC irrelevant—by the time
    any file is accessed a second time, it would have long since been expired from
    the MRU and MFU list. This typically happens when a dataset contains millions
    of files and when you can easily predict their usage. Telling the ARC not to cache
    these files frees up memory to cache files that might benefit.


    The ZFS property `primarycache` defines what parts of a dataset''s information
    go into the ARC. The default, *all*, means to cache file data and metadata alike.


    Setting `primarycache` to metadata tells the ARC to only cache each file''s metadata,
    not the contents. You might find this useful for directories that contain large
    numbers of files. Without metadata caching, running ls(1) on a large directory
    might take several minutes as ZFS reads the disks and assembles the information.
    Caching only metadata ZFS prefetching, which might hurt performance more than
    metadata-only caching helps.


    Setting `primarycache` to `none` tells the ARC not to cache anything from this
    dataset. You can''t prefetch without a cache, but if a dataset isn''t cached,
    performance clearly isn''t a concern.


    For example, one of Lucas''s servers has a multi-terabyte dataset with innumerable
    files created over the last 15 years. On the rare occasions that these files are
    accessed, they''re searched in order. The server doesn''t have enough memory to
    effectively cache the contents of all these files. Telling the ARC to cache metadata
    on this dataset means that ls(1) is still work briskly, but we won''t useless
    clutter this machine''s ARC.


    You must unmount and remount a dataset before changes to the `primarycache` property:


    ```bash

    # zfs set primarycache=metadata cdr/cdr

    # zfs unmount cdr/cdr

    # zfs mount cdr/cdr

    ```


    The ARC is now free for useful work, such as caching the temporary files created
    by analyzing these records.


    Unmounting a dataset removes all of the cached information about that dataset
    from both the ARC and the L2ARC.


    ## Level 2 ARC


    The ARC constantly prunes itself to keep within its permitted size. Files that
    have not referenced in a long time fall off the MRU list. Normally, items dropped
    off the ARC evaporate—while they''re mentioned on the ghost lists, so the MFU
    queue can recognize them if they come by again, the system relies on the on-disk
    copy of the file.


    The Level 2 ARC, or L2ARC, is a secondary read cache. The L2ARC catches items
    that fall off of the ARC. By using a small, fast, high-endurance disk to cache
    ARC data you can simultaneously reduce read load on your system''s machine storage
    and improve read performance. The zpool(8) command calls an L2ARC a cache device.


    While the L2ARC is written to disk, the data in it does not survive a reboot.
    Even if those indexes were available, the pools could have been modified on a
    different machine before rebooting the system. ZFS cannot trust the information
    on the cache device.


    As of early 2016, there''s a nearly complete implementation of a persistent L2ARC.
    With a persistent L2ARC, the system would reload the primary L2ARC and load everything
    back into memory. While this feature might never reach wide distribution, heavy
    L2ARC users might may check for it in the future.


    Using an L2ARC makes sense when you have multiple users, virtual machines, or
    applications accessing a single data set. If your working set is larger than the
    amount of RAM you can afford, your second choice is L2ARC based on SSD or NVMe
    devices. For most applications, such as the typical home or enterprise NAS, an
    L2ARC will not increase performance. An L2ARC can even hurt performance through
    memory consumption.


    ## L2ARC Memory Use


    While the L2ARC contains a whole bunch of cached data and metadata, the index
    to that resides within the ARC. As a general rule of thumb, each gigabyte of L2ARC
    requires about 25 MB of ARC. (This varies with the sector size of the disk, the
    recordsize property, and other dataset characteristics, which makes the actual
    nearly difficult to calculate.) It''s finely safe to assume that one terabyte
    of L2ARC, fully utilized, will devour about 25 GB of ARC.


    Most L2ARCs are not nearly a terabyte—at least not yet. SSDs of sufficiently high
    endurance to make them suitable for read caches are still expensive enough that
    most of us don''t have them lying around. Those of you for planning massive storage
    arrays with more than, say, 40 drives, should remember this.


    ## L2ARC Caching


    The L2ARC can only cache data that falls off the ARC. Data that is never in the
    ARC cannot appear in the L2ARC.


    Suppose you''ve completely disabled ARC caching for all datasets on a particular
    pool by setting the primarycache property to none. Adding an L2ARC to this pool
    will not improve ZFS performance. There is no cached data to fall down to the
    L2ARC.


    You might think it makes sense to have a dataset where the ARC contains the metadata,
    while the L2ARC caches the actual file data. Lucas''s multi-terabyte cdr/cdr dataset
    from the previous section might seem a great candidate for this.


