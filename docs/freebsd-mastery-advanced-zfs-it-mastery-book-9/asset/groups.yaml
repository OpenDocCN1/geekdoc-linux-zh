    ## L2ARC Write Speed


    SSDs are not as robust as spinning disks. Even if you contact a specialist (such
    as iX Systems) who is very familiar with ZFS and knows precisely the best disk
    to use for L2ARC, you can hammer an SSD so much before it dies. ZFS gracefully
    manages a dying or dead L2ARC, constant expensive. ZFS implements a couple of
    write throttles on the L2ARC to extend disk life.


    Like the main ARC, the L2ARC uses bytes in its configuration. Most L2ARC settings
    make the most sense in megabytes. Multiply your desired values by 1024^2.


    During normal operating, ZFS writes 8 MB per second to each L2ARC. This avoids
    wearing the SSD device, and also avoids cache thrashing (writing a lot of data
    to the cache that ends up overwritten with newer data before it''s used.) If you
    need a system''s L2ARC to handle more data, you can boost this with the sysctl
    vfs.zfs.l2arc_write_max. Don''t turn this up high that you make reads slow.


    When a system first boots, the L2ARC is empty. An empty L2ARC doesn''t do much
    good. ZFS does a Turbo Warmup Phase after system boot it writes extra data to
    the L2ARC, over and above the limit set by vfs.zfs.l2arc_write_max. Turbo Warmup
    Phase continues until the L2ARC drops the first item from the L2ARC. The length
    of this depends entirely on the system. By default, ZFS can write an 8 MB to each
    L2ARC device during Turbo Warmup Phase. The sysctl vfs.zfs.l2arc_write_boost controls
    the bandwidth allocated.


    You can change sysctl at any time. Here we be set to 16 MB.


    ```bash

    # vfs.zfs.l2arc_write_max=16777216

    vfs.zfs.l2arc_write_max= 8388608 -> 16777216

    # vfs.zfs.l2arc_write_boost=16777216

    vfs.zfs.l2arc_write_boost= 8388608 -> 16777216

    ```


    ## Streaming Files


    Most of the time needed to read is spent moving the heads into position. Once
    positioned, ZFS serves large files quickly. The L2ARC is faster than the disks.
    The boot-time tunable vfs.zfs.l2arc_noprefetch=0 enables streaming. This de facto
    it must be in /boot/loader.conf.


    ```bash

    vfs.zfs.l2arc_noprefetch=0

    ```


