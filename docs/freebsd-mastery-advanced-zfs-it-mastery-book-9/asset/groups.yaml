    # Chapter 5: ZFS Volumes


    A ZFS volume, or zvol, is a chunk of space backed by a ZFS pool and used as a
    block device. A zvol is normally used like a file-backed filesystem and exported
    to some other device by iSCSI. A zvol doesn''t have the normal dataset files and
    directories and permissions, instead relying on whatever uses the volume to provide
    the filesystem. Zwols are commonly used as iSCSI targets for other network devices,
    giving you access to ZFS-backed storage on operating systems with less flexible
    filesystems. You can also use zvols as storage for virtual machines, giving any
    guest operating systems access to ZFS'' integrity features even if the client
    operating system can''t use ZFS. Plus, you can replicate zvols across the network.


    We touched on zvols in FreeBSD Mastery: ZFS. This chapter exposes some common
    zvol pitfalls. But let''s start with zvol basics.'
  - '[PAGE 91]


    # Creating, Destroying, and Manipulating ZFS Volumes


    The -v flag tells zfs create that you''re making a ZFS volume. Give the desired
    size and the full path to the volume. Here we create a 2 TB zvol on the pool vm.
    As this volume will be exported to a web server, we''ll name it www1.


    ```

    # zfs create - 2T vm/ww1

    ```


    Zvols must be the children of the zpool''s root dataset. You cannot create a zvol
    as a child of a zvol. Our volume shows up in the list of datasets.


    ```

    # zfs list -r vm

    NAME USED AVAIL REFER MOUNTPOINT

    vm 2.06T 563G 31.8K /vm

    vm/db1 2.06T 2.61T 15.9K -

    ```


    A zvol immediately claims all the space you assigned for it. We created a 2 TB
    volume so it uses 2 TB of space plus some extra for metadata. A brand-new volume
    hasn''t used this space yet—it hasn''t written a bunch of placeholder data to
    the pool or anything like that. It''s only claimed that space via a refreshment.


    Remove a volume with zfs destroy.


    ```

    # zfs destroy vm/ww1

    ```


    You can use other ZFS commands on zvols, such as renaming and moving. The volume
    is actually being used for data, so we give it a more meaningful name.


    ```

    # zfs rename vm/ww1 vm/db1

    ```


    A zvol has many properties identical to other ZFS datasets, but most unique properties
    such as volmode and volblocksize, while you can''t set sharesyn atime on a zvol.


    Access a zvol through its device node. Most zvols have device nodes in /dev/zvol1,
    in a directory named after their pool. The device node for our sample zvol, vm/db1,
    would be /dev/zvol/vm/db1. A zvol might have other device nodes, depending on
    its mode.'
  - '[PAGE 92]


    # Sparse Volumes


    ZFS lets you create a ZFS volume larger than the space available to stick it in,
    thus overcommitting on space. Refining some space, but not enough, is called thin
    provisioning. Thin provisioning is quite risky on older filesystems, as you can
    easily provision more space than the filesystem contains. You can easily expand
    a ZFS pool by adding more hard drives, so it''s not much of a risk here. The refraction
    property controls how much space a volume has reserved for it. Here we create
    the 2 TB zvol dbs, but tell ZFS to reserve only 100 MB for it.


    ```

    # zfs create -V 2T -o reservation=100M db/dbs

    ```


    Those of us who have a couple of empty SAS shelves and already have plans for
    adding more hard drives might use sparse volumes. Sparse volumes use only the
    amount of space used on the volume. Use the -s flag to create a sparse volume.


    ```

    # zfs create -V 2T -s db/dbs

    ```


    You might use smaller reservations if you''re exporting iSCSI volumes to other
    hosts and the client''s filesystem is less flexible than ZFS. Growing an NTFS
    or UFS filesystem when the underlying disk expands can cause long-term problems.
    Using a sparse volume means you can tell the Windows host that an iSCSI device
    is of a large size, even if the underlying pool doesn''t have much free space.
    The zvol it consumes the amount of space used by the files on the device, plus
    any filesystem metadata.


    This lets you create truly impressive volumes, if you''re prepared to support
    them. Here we create two exabyte sparse volumes. It doesn''t matter that the pool
    beneath is only 500 GB.


    ```

    # zfs create -V 2E -s zvol/db/dbs

    ```


    Use guart show /dev/zvol/db/dbs, and you''ll see that this disk device is really
    two exabytes. If you need two exabytes of space on a single iSCSI volume, you
    can probably afford a flunky to unpack and mount hard drives quickly enough to
    keep up with demand.


    Overitting gets ugly when you run out of space. Your iSCSI clients completely
    lose their cool when they''re informed that these volumes are out of space even
    though the operating system instances insist they''re only 10 percent full. Many
    iSCSI stacks cope gracefully with such problems. Others... do not.


    If you don''t have enough physical hardware capacity to add store, let ZFS volumes
    take up an amount of space equal to their size. Don''t overcommit space.'
- md: '

    # Volume Mode


    Before you go creating a volume for your application, consider its intended use
    and what hosts are to access it. FreeBSD’s default ZFS settings assume that the
    system hosting the zvol completely controls it. If you’re using a zvol as a store
    for a virtual machine, however, the guest operating systems have complete control
    of it. This matters because FreeBSD GEOM layer autoconfigures storage. Storage
    already configured by the host causes problems for virtualized guests.


    Control which system configures a volume using the volmode property.


    The default volmode, geom, means that the system where the volume exists controls
    it. If we create a zvol on host A, host A configures and manages the volume through
    GEOM. In addition to the device node for the ZFS volume, it gets device nodes
    in /dev/label1 and such. Use the geom volmode when you’re using a zvol locally.


    > The volmode means that this zvol is only available through the single device
    node in /dev/zvol. GEOM doesn''t try to autoconfigure this volume. You can assign
    a label to the node, but FreeBSD won''t even try to see it. Use the dev volmode
    for virtual machine storage, such as bhyve(8) hosts.


    The volmode means that this zvol doesn''t even get a device node. You could clone
    this volume, snapshot it, or replicate it. This mode is only useful for backups.


    You can''t change a live zvol''s mode—while you can change the value of the volmode
    property, the volume''s actual mode doesn''t change. To make a volmode change
    take effect, export and re-import the volume. (You could also rename the volume,
    which is effectively exporting the volume and importing it under a different name)


    Create volumes with the desired mode by specifying a mode at the command line
    or by setting a global default.


    # volmode at Command Line


    As with any other property, use the -o flag to set the volmode when creating a
    zvol.


    ```

    # zfs create -V 10G -o volmode=dev vm/swap0

    ```


    This new zvol is accessible only by the device node /dev/zvol/vm/swap0.


    # Default volmode


    If a host most commonly needs to use a volmode other than geom, it makes sense
    to change the default volmode. The sysctl vfs.zfs.vol.mode controls the default
    volmode for new zvols.


    The default value, 1, tells ZFS to use the volmode of geom. A setting of 2 indicates
    the dev volmode, while 3 means a volmode of none. Change the default with sysctl(8),
    or make the change permanently effective at the next reboot with an /etc/sysctl.conf
    entry. Here''s an /etc/sysctl.conf entry to make a virtualization server create
    new zvols with a volmode of dev. vfs.zfs.vol.mode=2


    There’s no need to explicitly define the geom volmode.


    # Accessing zvols


    You can''t zfs mount a zvol like you would a filesystem dataset. The whole point
    of a zvol is that it''s a block device. To access it, you must access the device
    node or its GEOM provider. The most common is probably the device node.


    A zvol gets a device node in /dev/zvol1, in a subdirectory named after the pool.
    The device node for our sample zvol, vm/db1, would be /dev/zvol/vm/db1.


    We might assign this zvol storage for a bhyve virtual machine, in which case we''d
    probably let the virtual machine partition the disk.


    For other uses we might want to partition it locally. Here we create a GPT partition
    scheme on the zvol and make it one large partition, with a GEOM label of db1.
    We also assign it a GEOM label.


    ```

    # gpart create -s g /dev/zvol/vm/db1

    zvol/vm/db1 created

    # gpart add -t freebs-ufs -1 db1 /dev/zvol/vm/db1

    zvol/vm/db1p added

    # glabel db1 /dev/zvol/vm/db1

    ```


    As this zvol was created with the default volmode, geom, it''s now also accessible
    by the device node /dev/label/db1.


    Once the partition exists you can create a filesystem on it.


    ```

    # newfs -j /dev/zvol/vm/db1

    /dev/zvol/vm/db1: 2097152.0MB (4294967296 sectors) block size 32768, fragment
    using 3350 cylinder groups of 626.9MB, 20035 blks, 80256 inodes.

    with soft updates

    ```


    Wait—why would we possibly want to use UFS on a zvol?


    Perhaps our iSCSI client or VM guest doesn''t have resources to run ZFS effectively.
    By giving the client a ZFS-backed volume with a filesystem it can support, the
    client gets the additional protections of ZFS even though the client can''t use
    ZFS directly. I enable UFS soft updates journaling with -j, however because ZFS
    data integrity and UFS filesystem journaling protect completely different things.
    ZFS integrity checks make that the writes are safe, but filesystem journaling
    verifies that all the writes are completed.


    Now that the zvol has a filesystem, you can mount it.


    ```

    # mount /dev/gpt/db1 /media/

    ```


    And voilà! I have a UFS filesystem backed by ZFS, ready for use.


    The most common use for zvols is as backing stores for virtual machines. A serious
    quantity of virtual machines requires serious hardware. Let’s take a look at that
    next.


    > ¹ Lucas has used a local USB flash drive as a gjournal(8) or gcache(8) cache
    for an iSCSI device. It worked. If you find yourself in a situation that makes
    sense, however, leave the situation.


    # Chapter 6: Advanced Hardware


    A typical server can only hold so many hard drives. As your storage needs grow,
    you’ll eventually encounter more advanced hardware than you find on your typical
    home machine. This chapter covers enough of the basics to ensure that you know
    what your storage vendor is trying to sell you, and how to make use of these additional
    features.


    # SCSI Enclosure Services


    The most common way to add storage is through a box specifically designed to hold
    hard drives. The most common is the SCSI enclosure (sometimes called a backplane).
    Attach a SCSI enclosure to a host with a disk controller card.


    SCSI enclosures have all sorts of hardware and features in them. You''ll often
    see SAS or SATA port multipliers, allowing you to connect more than four drives
    to each port on the disk controller. You''ll probably see disk bays or trays,
    probably hot-swappable. An enclosure has fans, temperature sensors, power supplies,
    and more. An enclosure might even have its own CPU, running a custom operating
    system specifically designed to corral all of these features. Failed fans and
    power supplies can bring down your storage.


    SCSI enclosures have protocols to communicate with server operating systems. SCSI
    Enclosure Services, or SES, is the modern protocol for monitoring and managing
    the storage subsystem of your server. It''s the successor to the SCSI Accessed
    Fault-Tolerant (SAF-TE) protocol found in older hardware.


    SES is universally integrated into the backplane of the hot-swap bays or in the
    SAS Expander. SES provides a standard way to monitor and locate your disk drives,
    and can also be used to monitor fans, lights, and other devices.


    FreeBSD supports SES with the ses(4) driver. FreeBSD 10.3 introduced sesutil(8),
    letting you examine and control the ses(4) devices on your system.


    # Examining your Enclosure


    Sesutil(8) has many functions. Start with sesutil map, which displays all of the
    enclosures.


    ```

    # sesutil map

    ses0:

    enclosure Name: LSI SAS2X36

    enclosure ID: 500304801786b87

    ```


    The first entry for the enclosure is name (ses0). If you have multiple controllers,
    don''t rely on the device node to identify a specific enclosure. The enclosure
    name is based on the hardware model, but the enclosure ID is unique to this piece
    of hardware.


    Each monitored or controlled hardware is an element. Each element is assigned
    a number. Here''s the first element of one''s arrays.


    Element 0, Type: Array Device Slot

    Status: Unsupported (0x00 0x00 0x00)

    Description: Drive Slots


    Element 0 has the type Array Device Slot, and a description of Drive Slots. This
    is a parent element for all of the individual slots, which follows.


    Element 1, Type: Array Device Slot

    Status: OK (0x01 0x00 0x00)

    Description: Slot 01

    Device Names: da0,pass4

    Element 2, Type: Array Device Slot

    Status: OK (0x01 0x00 0x00)

    Description: Slot 02

    Device Names: da1,pass5


