    If your performance doesn''t match your expectations, remember that your storage
    system performs only as well as its slowest component. You can have a really fast
    SAS controller and top-of-the-line, high-speed hard drives but get terrible performance
    because of the cruddy drive cables. A SATA port multiplier slashes performance
    proportionally to the number of drives attached. Just because you can plug certain
    hardware components together, doesn’t mean you should.'
  - '[PAGE 145]


    # ZFS and Performance


    Much of the usual storage performance tuning advice applies to ZFS as it does
    any other filesystem. If you don''t need to know when a file was last used, disable
    recording access with the `atime` property.


    ZFS is designed to work with lots of disk space. A pool that’s more than 80 percent
    full performs badly. That’s inherent in how ZFS is put together. If you’re trying
    to figure out why an almost full pool is running slowly, move some of the data
    to another pool. Releasing space on a nearly full pool alleviates most ZFS issues.


    ZFS is also designed to work with 64-bit systems. With some persuasion, luck,
    and a little traditional Haitian voodoo, you can get ZFS to work on 32-bit FreeBSD.
    It won’t work well, and it won’t be efficient—but the system will boot. Becoming
    frustrated with ZFS performance on 32-bit systems is like getting annoyed at the
    dancing bear with a poor sense of rhythm. In both cases, the amazing thing is
    that it works at all.


    If the usual sysadmin advice for increasing filesystem performance doesn''t solve
    your problems, you must dive in and see why your storage system is behaving poorly.
    Every operating system includes tools for measuring performance. FreeBSD’s vmstat(8)
    can quickly identify if your system is waiting for processor, storage, or memory.


    To see how well your pools perform, use `zpool iostat.'
