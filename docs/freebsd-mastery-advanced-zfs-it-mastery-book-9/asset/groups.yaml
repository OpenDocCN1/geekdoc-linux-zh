    SAS expanders get a little more complex. You’ll see entries for SAS expanders,
    and then all the components within the expander. There’s very little to go wrong
    with a SAS expander, but some of the components do offer a status.


    - Element 41, Type: SAS Expander

    - Status: Unsupported (0x00 0x00 0x00)

    - Description: SAS Expanders

    - Element 42, Type: SAS Expander

    - Status: OK (0x01 0x00 0x00)

    - Description: Primary Expander

    - Element 44, Type: SAS Connector

    - Status: OK (0x01 0x11 0xff)

    - Description: Upstream Connector (Primary)

    - Element 45, Type: SAS Connector

    - Status: OK (0x01 0x11 0xff)

    - Description: Downstream Connector 1 (Primary)

    - Element 46, Type: SAS Connector

    - Status: OK (0x01 0x11 0xff)

    - Description: Downstream Connector 2 (Primary)


    Even the individual connectors show up


    - Element 47, Type: SAS Connector

    - Status: OK (0x01 0x20 0x00)

    - Description: Drive Connector 00


    This is far more detail than what we need. But checking the status of your SAS
    expanders and controllers before you start replacing hard drives en masse can
    save you lot of suffering.


    ## Closure Path


    You can describe a disk’s location in an enclosure by how it''s connected. To
    reach a particular disk, the operating system must go to a certain enclosure,
    to a particular bay in that enclosure. FreeBSD automatically generates device
    node directories based on this path. This allows the sysadmin to identify the
    devices underlying a particular chunk of hardware. This device path is a series
    of key-value pairs, separated by @ symbols. For example, enclosure 500304801786b87d
    shows up enc@n500304801786b87d. Each path has components: the enclosure, the device
    type, the slot, and then the element creating paths like the one below.


    ```

    /dev/enc/n500304801786b87d/type@0/slot@a/elmdesc/Slot_10/

    ```


    This device represents enclosure 500304801786b87d. The leading N before the enclosure
    identifies that this is a Network Addressing Authority (NAA) identifier, which
    is largely vestigial because everything here is an NAA identifier. The hexadecimal
    number is the SAS address of the Addressed Logical Unit. How this number is determined
    varies by vendors.


    The type is a numeric device type. Disks are the only devices this driver currently
    supports, but later FreeBSD versions might add support for other devices.


    The slot is the drive bay. Slots are numbered in hexadecimal: slot a is 10, b
    is 11, and so on. Slot 10 is actually 16.


    The last component is the element description that appears when you run sesutil
    map.


    This directory contains symlinks to all of the device nodes associated with this
    slot. It has label subdirectories (You are managing your disks with labels, right?)


    ```

    # ls -l /dev/enc@n50030480178BB8D7/type//@slot/elmdesc@Slot_10/

    total 1

    lwxr-xr-x 1 root wheel 15 Oct 5 23:27 da9@ -> ../../../da9

    dr-xr-x 2 root wheel 512 Oct 5 23:27 gpt/ ->

    lwxr-xr-x 1 root wheel 18 Oct 5 23:27 pass13@ -> ../../../pass13

    ```


    If slot 15 on your enclosure is making an unusual buzzing noise, you can go into
    the enclosure-based device node and identify which providers light there.


    ## Keeping the lights on


    The folks on your hardware need all the help they can get. Those slot numbers
    are probably printed in six-point type, and only visible when you pull the drive
    out of the bay. Emergency drive replacements always happen when the on-site team
    is barely conscious.


    Enclosure bays have locate lights specifically to provide your remote hands an
    extra clue. Activate a bay''s light with sesutil locate. Here, we activate the
    light on the bay driving da2.


    ## sesutil locate da2 on


    The light either shines or blinks, depending on the manufacturer.


    The sesutil map command shows a slot''s locate light is on.


    ## sesutil map


    ```

    ...

    Element 3, Type: Array Device Slot

    Status: OK (0x01 0x00 0x02 0x00)

    Description: Slot 03

    Device Names: da2,pass6

    Extra status:

    - LED=locate

    ```


    You might need to activate a locate light in a bay without a disk—say, to show
    the tech where to install a new hard drive. Use the SES device node and the element
    number rather than the device node. The slot number is often, but not always,
    the same as the element number. Be careful.


    Here we activate the locate light on element 3 on enclosure /dev/ses0.


    ```

    # sesutil locate -u /dev/ses0 3 on

    ```


    To turn the locate light off, run the same command but replace on with ... wait
    for it ... off.


    ## Controlling Host Adapters


    FreeBSD includes several tools for managing non-RAID hard drive controllers, normally
    called host adapters, or HBAs. For older controllers you probably would rather
    not using any, you''ll find mpsutil(8) and mprutil(8). FreeBSD 10.3 has mprutil(8)
    and mpsutil(8). mprutil(8) is for LSI Fusion-3 HBAs, while mpsutil(8) is for LSI
    Fusion-2 HBAs. (As Avago purchased LSI, you might also see these cards with Avago
    branding.) Both programs behave identically, demonstrate with mpsutil(8).


    ## Adapter Details


    First, find the adapters connected to your system.


    ```

    # mpsutil show adapters

    Device Name Chip Name Firmware

    /dev/mps0 SAS2308 1300000

    /dev/mps1 SAS2308 1300000

    ```


    Now look at all of the devices attached. By default both tools access the first
    device node, either /dev/mps0 or /dev/mpr. Access other HBA devices with the -u
    flag and the device number.


    | SAS Address | Handle | Parent | Target | Speed | Slot | Wdt |

    |---|---|---|---|---|---|---|

    | 00 | 08 | 5000ca2235ddd0a | 00a | SAS Target | 6.0 | 0002 | 0 |

    | 00 | | 5000ca2235ddd0a | 00a | SAS Target | 6.0 | 0002 | 1 |

    | 00 | 09 | 5000ca2235d2719d | 00b | SAS Target | 6.0 | 0002 | 1 |

    | 00 | 10 | 5000ca2235dbbd0 | 00c | SAS Target | 6.0 | 0002 | 2 |

    | 00 | 11 | 5000ca2235e028d | 00d | SAS Target | 6.0 | 0002 | 3 |


    Every line here is some device that responds to SCSI commands. The majority of
    them are hard drives. Anything that''s on the SCSI bus is a target, a hard drive.
    Really digging into this requires understanding of SAS and SCSI, but we can glean
    useful information without deep knowledge. The first two columns show the device''s
    SCSI-style address. The third gives the device''s physical address. Much like
    an Ethernet card, every SAS device has a unique. The Handle column indicates the
    name for the device, while the Parent column shows what this device is attached
    to. Look at our first line. It has a handle 0009. The second column has its parent
    is 0009. The device on line two is attached to the device on line one.


    The Device column shows what kind of device this is. A “SAS Target” is a fancy
    way of saying “a hard drive.” An SMP (Serial Attached Management Protocol) target
    is a SAS switch or expander. The Speed column shows the connection speed in gigabytes
    per second. The Enc column shows the enclosure, while the Slot column shows the
    slot or drive bay. Finally, the Wdt column shows the maximum number of port connections
    on this device.


    ## Display Enclosures


    Use the show enclosures command to view the enclosures attached to an HBA. Here
    we list the enclosures connected to /dev/mps1.


    ```

    # mpsutil -u 1 show enclosures

    Slots Logical ID SEPHandle EnchHandle Type

    08 500605b009d018c 0001 Direct Attached SGPIO

    25 500304801786b87f 0022 External SES-2

    13 5003048001f7ab3f 0003 External SES-2

    ```


    You’ll see the number of slots in the enclosure, the device’s handle (if any),
    and the type of enclosure. The Logical ID is a SAS address. You can map these
    to SAS addresses shown in sesutil(8) or other commands.


    ## sas2ircu


    If you are using an older version of FreeBSD that doesn''t have mpsutil, or need
    functionality that it doesn''t provide, LSI/Avro provides their own proprietary
    tool, sas2ircu(8). Most of the features mpsutil(8) lacks the controller''s built-in
    software RAID.2. Sas2ircu(8) also lets you get information about the HBA''s firmware
    version. It''s available as a FreeBSD port, sysutils/sas2ircu.


    The sas2ircu program expects at least two arguments: a controller (device node)
    number and a command. Even if you have only one controller, you must specify the
    controller number.


    ## Viewing Hardware


    To see the hardware attached to an HBA, use the display command. Here we look
    at the devices attached to controller 0, /dev/mps0 Or /dev/mps0.


    ```

    # sas2ircu 0 display

    ```


    You''ll get a bunch of copyright information, as well as helpful notes like this:


    Read configuration has been initiated for controller 0


    Or, "I''m going to do that as you asked now."


    ```

    Controller information


    Controller type         : SAS2308_2

    BIOS version            : 7.37.00.00

    Firmware version        : 19.00.00.00

    Channel description    : 1 Serial Attached SCSI

    ....

    ```


    BIOS and firmware versions are useful if you have to troubleshoot or use the manufacturer''s
    technical support. Once all this is past, we get information on the actual hardware.
    Each hard drive gets an entry like this.


    ## Physical device information


    ```

    Initiator at ID #0


    Device is a Hard disk

    Enclosure #           : 1

    Slot #                : 0

    SAS Address            : 4433221-1-0300-0000

    State                 : Ready (RDY)

    Size (in MB)/(sectors)  : 4769307/976541167

    Manufacturer         : ATA

    Model Number          : TOSHIBA MD04ACA5

    ```

