    # 条带化镜像 (Striped Mirrors)


    条带镜像不需要任何校验数据。ZFS 将数据整体地复制到多个存储提供者。条带镜像不会为了适应分配大小而填充数据。条带镜像是存储数据最高的地方，但它的数据保护模型与
    RAID-Z 不同。


    三路镜像提供与 RAID-Z2 类似的数据保护——你可以从每个 VDEV 中丢失两个驱动器而不会丢失数据——但你只能获得总空间的的 33%。


    # 更改分配大小


    将 `recordsize` 或 `volblocksize` 更改为 4 KB 会改变计算结果。较小的条带大小意味着更多的校验数据，这可能意味着更多的空填充。


    看看我们对 RAID-Z3 上的 8 KB 写入示例。它被分成两个条带。在具有 4 KB 块的 zvol 上，每个条带需要四个扇区，这同样导致了 25% 的空间效率。使用
    512 字节块时，每个条带需要 11 个块，并向上取整到 12 个。你将获得大约 66% 的空间效率。


    条带大小（`volblocksize`）、校验数据和填充之间的相互作用，就是为什么你不需要对文件系统数据集执行这些计算的原因。128 KB 的条带大小可以将分配填充减少到更少。


    # 建议


    在为数据库或 zvols 设置系统之前，请仔细考虑数据池底层的存储。对于我们强烈推荐的 8 KB 常用 `recordsize` 设置，建议顺序为：镜像条带池（mirrored
    stripe pool）、四驱动 RAID-Z2 池，或三驱动 RAID-Z 池。


    如果你正在使用 `volblocksize` 为 4 KB 的 zvol 来支持虚拟机，你的选择会更加有限。镜像条带池允许你获得最大的空间效率，而所有其他大小都会由于填充导致至少的空间损失。镜像在
    IOPS 方面相比 RAID-Z 具有巨大的优势。


    # 数据库与 ZFS


    许多 ZFS 特性对数据库非常有利。每个 DBA 都希望有快速、简单且高效的复制、快照、克隆、可调缓存和池化存储。虽然 ZFS 被设计为通用文件系统，但你可以对其进行调优，让你的数据库飞起来。


    数据库通常由多种类型的文件组成，每种文件都有不同的特征和使用模式，且都需要不同的调优。我们将专门讨论 MySQL 和 PostgreSQL，但这些原理适用于任何数据库软件。


    你可以为可以执行的最重要的调优是数据集块大小，通过 `recordsize` 属性实现。对于任何可能被覆盖的文件，都必须与应用程序使用的块大小匹配。


    调优块大小还可以避免写放大（write amplification）。写放大发生在当更改少量数据却需要写入大量数据时。假设你必须更改 128 KB 块中间的
    8 KB。ZFS 必须读取这 128 KB，修改其中某处的 8 KB，计算新的校验和，并写入新的 128 KB 块。ZFS 是一个写时复制（copy-on-write）文件系统，因此它将为了更改那
    8 KB 而最终写入整个 128 KB 块。这并不是你希望看到的。现在将此乘以你数据库的写入次数。写放大会损害性能。


    虽然这种优化对我们许多人来说并不是必要的，但对于高性能系统来说，它可能是无价的。它还会影响 SSD 以及其他闪存存储的寿命，这些设备在整个寿命内只能处理有限的写入量。当然，不同的数据库引擎并没有让这变得容易，每个引擎都有不同的需求。日志、二进制复制日志、错误和查询日志以及其他文件都需要不同的调优。


    在创建具有小 `recordsize` 的数据集之前，请确保你理解 VDEV 类型与空间利用之间的相互作用。在某些情况下，具有较小的 512 字节扇区数的磁盘可以提供更好的存储效率。你完全可能为你的数据库专门设置一个独立的池更好，而将主池用于你的其他文件。


    对于高性能系统，请使用镜像而非任何类型的 RAID-Z。是的，为了韧性，你可能想要 RAID-Z。选择你的痛苦点。¹


    # 所有数据库


    在数据库上启用 lz4 压缩，不直觉地实际上可以降低延迟。


    压缩数据可以更快地从物理介质读取，因为需要读取的内容更少，从而导致更短的传输时间。Iz4 的早期终止（early abort）功能在最坏的情况下只比禁用压缩慢几毫秒，但收益通常是非常显著的。这就是为什么
    ZFS 对它所有的元数据和 L2ARC 使用 lz4 压缩。在不远的将来，当压缩 ARC 特性进入 OpenZFS 时，在数据集上启用压缩将允许更多数据保留在
    ARC 中，这是 ZFS 最快的缓存。


    在 Delphix 的一个生产案例中，一个拥有 768 GB 内存的数据库服务器使用超过 90% 的内存来缓存数据库，仅使用 46 GB 内存即可缓存 1.2
    TB 的压缩数据。压缩内存缓存导致了显著的性能提升。由于机器无法支持更多内存，压缩是改进的唯一方法。


    ZFS 元数据也会影响数据库。当数据库发生快速变化时，为每次更改写入两或三份元数据可能会消耗底层存储大量的可用 IOPS。通常，与 128 KB 的记录大小相比，元数据的数量相对较小。尽管如此，数据库的小记录大小运行更好。保留三份元数据可能会导致与向池写入实际数据的磁盘活动相当甚至更多。


    较新的 OpenZFS 版本包含 `redundant_metadata` 属性，默认认为 all。将 `redund metadata` 设置为 off
    可以节省 IOPS，但会增加损坏的风险。对于大多数数据库，默认值是可以的。然而，如果元数据开销是瓶颈，你可以对此进行调优。


    一旦压缩 ARC 特性可用，明智的做法可能是减小数据库内部缓存的大小，而是让 ZFS 处理缓存。在相同的内存中可以容纳更多数据。


    # MySQL – InnoDB/XtraDB


    InnoDB 在 MySQL 5.5 中成为默认存储引擎，其特性与 MyISAM 有显著不同。Percona 的 XtraDB（也被 MariaDB 使用）与
    InnoDB 类似。InnoDB 和 XtraDB 都使用 16 KB 的块大小，因此 ZFS 数据集的记录大小被设置为匹配。我们还建议使用 MySQL 的
    `innodb_file_per_table` 设置，将每个表的 InnoDB 数据保留在单独的文件中，而不是将其分组到单个 ibdata 文件中。这使得快照更有用，并允许选择性的恢复或回滚。


    在不同的数据集上存储不同类型的文件。数据文件需要 16 KB 块大小、压缩和减少元数据。你可能会看到仅缓存元数据带来的性能提升，但这同时也允许了预取（prefetch）。实验并观察你的环境表现如何。


    ```

    # zfs create - recordsize=16k -o compress=lz4 -o redundant_metadata=most -o primarycache=metadata
    mypool/var/db/mysql

    ```


    主 MySQL 日志用 gzip 压缩效果最好，且不需要内存缓存。


    ```

    # zfs create -compress=gzip -o primarycache=none var/log/mysql

    ```


    复制日志使用 lz4 压缩效果最好。


    ```

    # zfs create -compress=lz4 mypool/var/log/replication

    ```


    通过 /usr/local/etc/my.cnf 设置让 MySQL 使用这些数据集。


    ```

    data_path=/var/db/mysql

    log_path=/var/log/mysql

    binlog_path=/var/log/mysql/replication

    ```


    现在你可以初始化数据库并开始加载数据了。


    # MySQL – MyISAM


    许多 MySQL 应用程序在使用旧的 MyISAM 存储引擎，是因为它的简单，或者因为它们还没有转换为使用 InnoDB。


    MyISAM 使用 8 KB 的块大小。数据集记录大小应设置为匹配。除此之外，数据集布局应与 InnoDB 相同。


    # PostgreSQL


    如果调优得当，ZFS 可以支持非常大且快速的 PostgreSQL 系统。


    '
