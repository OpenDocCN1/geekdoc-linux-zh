    # Automating Replication


    Everybody wants backups, but backups that must be manually run are not backups
    because they won''t happen. Sure, you''ll do them once or twice, but one day the
    coffee pot will break and you''ll barely be able to remember where you left your
    spleen. Reliable backups demand automation and testing. Testing is always your
    problem, but for automation we have zxfer.


    Zxfer(8) examines select local and remote datasets, determines which snapshots
    must be replicated to synchronize the two sets of data, and sends the datasets.
    It can also remove snapshots on the remote side once they''re removed from the
    local pool.


    FreeBSD does not include zxfer by default, but you can easily install it with
    pkg. As zxfer can work in both push and pull modes, you only need to install it
    on one of the systems. For our demonstration, we will install it on all nodes.


    ```

    # pkg install zxfer

    ```


    The zxfer command does not currently support either bookmarks or resumable replication.
    It also doesn''t set up replication user accounts. You must configure those accounts,
    create SSH keys, and set permissions exactly as you would for normal replication.


    # Using zxfer


    All of our replication examples have used push mode; the host with the current
    datasets pushes them to a replication target. We''ll start with using zxfer similarly.
    Enable mode with -t and the login for the remote host.


    Zxfer requires that you declare if you want to replicate a single dataset, or
    the dataset and all its children. The -R flag enables recursion, while -N indicates
    a single dataset and its snapshots. For backups, recursive mode is almost always
    correct.


    You might also add -v, for verbose mode.


    ```

    $ zxfer -v -T user@host -R localhost remotep

    ```


    If the account is the same on both sides, you can skip identifying the user their
    own cannot be combined with arguments that don''t require that. You can use -v
    -T user@host, but -VT user@host makes zxfer complain bitterly.


    One thing to remember is that arguments that take an argument of zxfer is a shell
    script, it uses getopt(1) to handle command-line arguments, rather than the fancy
    option handling available in more complex'
