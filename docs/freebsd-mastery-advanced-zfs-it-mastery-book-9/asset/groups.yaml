    5000 或 10000 转旋转的磁盘读取整条磁道的数据只需要微秒。


    每个 VDEV 预取尝试让移动头部变得值得。FreeBSD 默认不使用每个 VDEV 预取，但如果你的负载涉及复杂的元数据、大型目录树或许多小文件，每个 VDEV
    预取可能会有所帮助。每当 ZFS 从 VDEV 读取几个块时，它也会读取目标之后的几个块以寻找元数据。发现的任何元数据都会进入特殊的每个 VDEV 预取缓存。请求程序很有返回并请求该元数据。每当程序请求预取的元数据时，ZFS
    从缓存中提供它，返回物理 VDEV 并预取更多块。


    每个 VDEV 预取的块进入简单的“最近使用”缓存，而不是 ARC。VDEV 缓存的大小等于 VDEV 中存储提供者的数量乘以可调参数 `vfs.zdev.cache.size`。FreeBSD
    默认将其设置为 0，因此不使用该缓存。通过在 `/boot/loader.conf` 中将此可调参数设置为所需值来启用缓存。一个常见的值 `vfs.zdev.cache.size="10M"`。


    重启后，你将有一个每个 VDEV 预取缓存生效。`sysctl kstat.zfs.misc.vdev_cache_stats.miss` 显示 ZFS 检查每个
    VDEV 缓存中的元数据但未找到的次数。同样，`sysctl kstat.zfs.misc.vdev_cache_stats.hits` 显示 ZFS 在缓存中找到东西的频率。


    在没有每个 VDEV 预取的情况下测试你的负载并观察其行为。


    每个 VDEV 预取预先缓存了多少？`sysctl vfs.zdev.max` 给出了从 VDEV 读取的最小大小。这默认值为 16384，即 16 KB。如果程序请求小于此大小的内容，就会触发每个
    VDEV 预取。


    然而，`vfs.zdev.cacheshift` 给出了要预取并搜索的数据量。这是一个位移值，所以默认的 16 意味着 64 KB。


    因此，如果程序请求小于 16 KB 的读取，ZFS 而是读取 64 KB。如果程序请求例如 20 KB 的读取，则发生没有 VDEV 预取。


    虽然更改预取值在某些旧版本的 ZFS 中有助于性能，但在现代 ZFS 中，你应该几乎总是保持原样。作者知道很多时候更改这些值会导致痛苦。


    ## 每个文件预取


    文件系统的任务是根据请求提供数据。ZFS 通过准备提供你即将提问的数据，进一步地利用了这一想法。这发生在两个级别：每个 VDEV 和每个文件。FreeBSD
    默认不启用每个 VDEV 预取，但启用了每个文件预取。


    '
