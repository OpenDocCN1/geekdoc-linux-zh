    root 身份发送 ZFS 数据集，但你可能希望操作员或普通用户拥有发送能力。


    # 复制用户和数据集


    在发送和接收主机上，我们都创建一个专门复制的用户。我们的示例用户名为 `replicator`。它需要一个 shell，不需要特殊的组组成。


    ```

