    \ where clients access different files. If your pool has terabytes of data, caching\
    \ in memory will not boost performance.\n\n## Modifying the ARC\n\nZFS manages\
    \ itself in the overwhelming majority of cases. In most cases where the ARC cannot\
    \ auto-tune itself, performance problems are best solved by adding hardware. Sometimes,\
    \ though, adjusting the ARC can buy you time until you can install new hardware.\
    \ On rare occasion, adjusting the ARC is the proper response for a specific application.\
    \ You can tweak the ARC by setting upper and lower boundaries on how much memory\
    \ it can use as well as controlling when the ARC caches data.\n\n## Restricting\
    \ ARC Size\n\nA default install sets aside 1 GB of RAM for the kernel, permitting\
    \ ZFS to absorb the rest in the ARC. If the system demands it, you can change\
    \ this by reserving a minimum amount of memory for the ARC or setting a hard limit\
    \ on how much memory the ARC can take. The ARC settings are all given in bytes.\
    \ Today we manage memory in gigabytes. To set a value for ZFS, multiply the desired\
    \ number of gigabytes by 1024. The ARC surrenders memory readily upon request,\
    \ freeing doesn't happen instantaneously. Releasing memory from the ARC and allocating\
    \ it to another process takes longer than allocating memory to that same process.\
