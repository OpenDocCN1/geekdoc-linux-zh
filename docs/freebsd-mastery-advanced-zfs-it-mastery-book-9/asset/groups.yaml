    # Sponsors


    The following fine folks thought that this book was important enough that they
    offered Lucas financial support as he produced it. Ebook sponsors paid at least
    $20 for the privilege of getting their name in the electronic version, while the
    maniacs who sponsored the print version shelled out at least $100 to get their
    name immortalized on that edition’s soft, absorbent pages.


    Four days after sponsorships went on sale, Lucas’ hot water heater died. In February.
    In Michigan. Those initial sponsors almost exactly covered the cost of the water
    heater.


    Thank you all. Very much.'
