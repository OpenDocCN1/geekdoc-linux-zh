    # Activating Boot Environments


    Suppose you apply the latest patches and the machine goes bonkers. Your server
    fails, or the kernel panics, or tiny gremlins hop out of the USB ports and stealing
    your spoons. Fall back to an older version by activating the boot environment
    and rebooting. Activate a boot environment with beadm activate.


    ```

    # beadm activate 10.3-release

    Activated successfully

    # beadm list

    ```


    BE      Active  Mountpoint Space   Created

    default N        /        308.1M   2016-05-19 10:04

    10.3-release R -        457.1M   2016-05-19 14:13


    The default boot environment has the Active flag set to N, meaning it''s running.
    The 10.3-release environment has the Active flag set to R, so after a reboot it
    will be live.


    Reboot the system and suddenly you''re back to running the 10.3-release environment,
    without any security updates and with whatever packages you originally installed
    on the system. You''ve fallen back to an older version of the operating system,
    with much less risk than restoring from backup.


