    # Book Overview


    Chapter 0 is this introduction.


    Chapter 1, “Boot Environments,” takes you through using ZFS snapshots to create
    Solaris-style boot environments. Boot environments let you painfully revert changes
    such as upgrades. You can even have multiple versions of FreeBSD installed simultaneously.
    Once you''ve used boot environments, you''ll wonder how you ever lived without
    them.


    Chapter 2, “Delegation and Jails,” covers ZFS’s internal permissions scheme. ZFS
    can let the sysadmin select users and groups privileges to perform operations
    that normally require root access, such as snapshots and cloning.


    Chapter 3, “Sharing Datasets,” covers ZFS’s network file sharing features. FreeBSD’s
    ZFS is integrated with the Network File System, and is terribly useful for iSCI
    devices.


    Chapter 4, “Replication,” teaches you how to replicate ZFS datasets to other machines.
    Replication can you pick up a massive amount of data and ship it across the country
    or around the planet, and keep it up to date, without your users even noticing.


    Chapter 5, “ZFS Volumes,” discusses some fine details of creating and using block
    devices on top of a ZFS pool.


    Chapter 6, “Advanced Hardware,” is for the people who have really large storage
    arrays. If the words “SCSI multipathing” throw fear into your heart, or if you
    have no idea what NVMe is, this is chapter for you.


    Chapter 7, “Caches,” covers all of the various caching mechanisms. You’ll learn
    the Advanced Replacement Cache and all its variants, reading and writing caches,
    and the on-disk pool cache.


    Chapter 8, “Performance,” delves deep into how ZFS performs in different environments
    and how to determine system changes might improve performance.


    Chapter 9, “Tuning,” discusses how to adjust ZFS to work best in your environment,
    hopefully without buying additional and expensive hardware.


    Finally, Chapter 10, “ZFS Potpourri,” includes a bunch of short tips on using
    ZFS.


    To those of you who read the introductions to books: congratulations. We hope
    you learned something, or were at least reminded of some important details. Let’s
    go on to boot environments!'
