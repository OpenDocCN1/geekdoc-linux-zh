    We''ll demonstrate adding disks to a mirrored pool, then split the pool into duplicates.
    You could perform the same task in reverse: pull the disks off a mirror, then
    add them back when you''re done with the duplicate. We recommend maintaining at
    least two providers in each mirror VDEV at all times, however.


    # Make Mirrors Deeper


    A mirror''s depth describes how many copies of data the mirror includes. This
    pool, a typical striped mirror, contains two mirrors of two disks each.


    ```

    # zpool status db

    NAME STATE READ WRITE CKSUM

    db mirror-0 ONLINE 0 0 0

    gpt/zfs0 ONLINE 0 0 0

    gpt/zfs1 ONLINE 0 0 0

    mirror-1 ONLINE 0 0 0

    gpt/zfs2 ONLINE 0 0 0

    gpt/zfs3 ONLINE 0 0 0

    ```


    I want to make this pool deeper, adding an additional disk to each VDEV. Use the
    zpool attach command with the pool name, a device already in the target VDEV,
    and the new device.


    ```

    # zpool attach db gpt/zfs1 gpt/zfs4

    # zpool attach db gpt/zfs3 gpt/zfs5

    ```


    In between running these two commands, the pool has one mirror of three devices
    and one mirror of two devices. At the end, the mirror looks like this.


    ```

    NAME STATE READ WRITE CKSUM

    db mirror-0 ONLINE 0 0 0

    gpt/zfs0 ONLINE 0 0 0

    gpt/zfs1 ONLINE 0 0 0

    gpt/zfs4 ONLINE 0 0 0

    mirror-1 ONLINE 0 0 0

    gpt/zfs2 ONLINE 0 0 0

    gpt/zfs3 ONLINE 0 0 0

    ```'
- md: "\nOnce the pool finishes resilvering the drives, you can split the pool.\n\n\
    ## Splitting the Pool\n\nUse the zpool split command to pull a device from each\
    \ VDEV to create the new pool. The command has mandatory arguments: the name of\
    \ the pool you want to split and a name for the newly created pool. Here we split\
    \ the pool db, creating an identical copy in the pool db2.\n\nZFS removes the\
    \ device most recently added to each mirror to create a new pool.\n\nSplitting\
    \ a pool does not automatically import the new pool. Once you import it, the split\
    \ pool looks like this.\n\n```\n# zpool status db2\n...\nNAME      STATE READ\
    \ WRITE CKSUM\ndb2      ONLINE 0     0      0\ngpt/zfs4 ONLINE 0     0      0\n\
    gpt/zfs5 ONLINE 0     0      0\n```\n\nThis pool contains two striped disks.\n\
    \nIn the original pool, the striped pair of three-way mirrors has become a striped\
    \ pair of two-disk mirrors.\n\nIf you’re keeping this split-off pool around for\
    \ any length of time, you should add more disks to create proper mirrors. You\
    \ might not add another set of disks if you’re pulling backups off of these drives,\
    \ though.\n\n## SnapSpec\n\nSnapshots are great—but they breed tribbles™. Once\
    \ you’re accustomed to using snapshots to deal with system administration issues,\
    \ you’ll find yourself dealing with disk storage shortages because of all the\
    \ snapshots you have. Removing a single snapshot is easy.\n\n```\n# zfs destroy\
    \ mypool/dataset@snapshotname\n```\n\nBut if you want to destroy 10 snapshots\
    \ at once? Identifying each snapshot and specifying each on the command line is\
    \ incredibly tedious.\n\nZFS lets you identify multiple neighboring snapshots\
    \ with a snapspec. You can’t use a snapspec to specify multiple disparate snapshots,\
    \ but if you want to blow away daily snapshots @monday through @saturday, a snapspec\
    \ is your friend.\n\nAny time you use a snapspec, we recommend running your command\
    \ with -n and -v. The -v flag tells zfs(1) to print what the command does in more\
    \ detail. The -n tells it not to actually do anything. Combined, they “give me\
    \ more detail on exactly what this command will do.” As you can assign arbitrary\
    \ snapshot names, it’s best to verify that a needed but forgotten snapshot won’t\
    \ be caught up in a snapshot massacre. Once you know exactly which snapshots the\
    \ command will destroy, rerun the command without the -n.\n\n## Snapshot Range\n\
    \nThe basic snapspec is fromsnap%tosnap. It destroys every snapshot between the\
    \ two indicated, including themselves:\n\n```\n# zfs destroy -vn mypool/dataset@one@three\n\
    would destroy mypool/dataset@one\nwould destroy mypool/dataset@two\nwould destroy\
    \ mypool/dataset@three\n```\n\nIf you slip a @beforeUpgrade snapshot in between\
    \ the numbered snaps? This is why you use -n first.\n\n## Specify by Age\n\nYou\
    \ can use @foo to destroy snapshot@foo and anything older than this.\n\n```\n\
    # zfs destroy -vn mypool/dataset@four\nwould destroy mypool/dataset@one\nwould\
    \ destroy mypool/dataset@two\nwould destroy mypool/dataset@three\nwould destroy\
    \ mypool/dataset@four\n```\n\nSimilarly, use @foo% to destroy @foo and anything\
    \ newer than itself:\n\n```\n# zfs destroy -vn mypool/dataset@six%\nwould destroy\
    \ mypool/dataset@six\nwould destroy mypool/dataset@seven\nwould destroy mypool/dataset@eight\n\
    would destroy mypool/dataset@nine\nwould destroy mypool/dataset@ten\n```\n\nThat's\
    \ much easier than re-entering each snapshot.\n\n## Snapshot Slaughter\n\nSometimes,\
    \ you want to destroy all snapshots. Use @% to burn it all down.\n\n```\n# zfs\
    \ destroy -vn mypool/dataset@%\nwould destroy mypool/dataset@one\nwould destroy\
    \ mypool/dataset@two\n...\nwould destroy mypool/dataset@ten\n```\n\nNow you can\
    \ start accumulating snapshots all over again.\n\nIf you've taken recursive snapshots,\
    \ you probably want to burn the whole tree down. Add -r to eradicate snapshots\
    \ from a dataset and all its children. Here, we've finished the upgrade and we\
    \ think we're happy with the results\n\n```\n# zfs destroy -nvR pgsql/data%\n\
    would destroy pgsql/data@beforeupgrade\nwould destroy pgsql/data/base@beforeupgrade\n\
    would destroy pgsql/data/pg_xlog@beforeupgrade\n```\n\nBut, you know ... we think\
    \ we'll hold on those backups just a little longer.\n\n## Recovering Destroyed\
    \ Pools\n\nThere’s nothing quite like the moment when you realize, “Wait, that\
    \ command is a horrible mistake! and you try to stop, but you know that the nerve\
    \ impulses have time to race down from your brain before your hand finishes pressing\
    \ the ENTER key.\n\nOne place that can happen when you destroy a ZFS pool. And\
    \ the ZFS designers were very aware of exactly this syndrome.\n\nThe zpool destroy\
    \ command doesn’t actually damage any data on the underlying disks. Instead, it\
    \ marks the pool as destroyed. A zpool list skips pools marked as destroyed. If\
    \ you haven’t written to or physically remove the disks under the destroyed pool,\
    \ you can recover the pool. Use the -d flag to zpool import to view destroyed\
    \ pools.\n\n```\n# zpool import -D\n```\n\nYou’ll get two kinds of responses,\
    \ for recoverable and non-recoverable pools.\n\n## Recoverable Pools\n\nHere’s\
    \ a pool that you can easily recover.\n\n```\n# zpool import -D\npool: db2\nid:\
    \ 555215874600692385\nstate: ONLINE\naction: The pool is\nconfig:\n  db2\n  gpt/zfs4\n\
    \  gpt/zfs5\n```\n\nThis pool contains two striped disks.\n\nIn the original pool,\
    \ the striped pair of three-way mirrors has become a striped pair of two-disk\
    \ mirrors.\n\nIf you’re keeping this split-off pool around for any length of time,\
    \ you should add more disks to create proper mirrors. You might not add another\
    \ set of disks if you’re pulling backups off of these drives, though.\n\n## Non-Recoverable\
    \ Pools\n\nOther pools are not so easy.\n\n```\n# zpool import -D\npool: db\n\
    id: 1312274962632109\nstate: DESTROYED\naction: The pool is missing\nconfig:\n\
    \  db2                DEGRADED\n```\n\n## Rename Pool at Recovery\n\nSometimes\
    \ you want to rename a pool when you unimport it. Perhaps it has the same name\
    \ as a live pool, or the function of the pool has changed. To rename a pool when\
    \ you import it, add the new name after the pool's old name. Here we import the\
    \ destroyed pool db2, and rename it olddb2.\n\n```\n# zpool import -D olddb2\n\
    ```\n\nIt's otherwise the same as renaming an imported pool.\n\n## Cloning Machines\n\
    \nZFS is a perfectly sensible choice for virtual machines. While losing direct\
    \ access to the disks means ZFS can handle error detection for you, features such\
    \ as snapshots and replication make ZFS worthwhile.\n\nMost virtualization systems\
    \ offer to clone systems for you, sometimes disguised as a template you can deploy.\
    \ If you copy a disk image containing a ZFS pool to a new virtual machine, though,\
    \ your virtual machine is a copy of the original. This means that some items that\
    \ should be globally unique, longer are. Will this cause problems? Not on a standalone\
    \ virtual machine. If you're going to move disk images between virtual machines,\
    \ though, you'll want to change the GUID of each VM's pools.\n\nThe guid property\
    \ contains a pool's GUID. Here we get the GUID of the pool db2.\n\n```\n# zpool\
    \ get guid db2\nNAME PROPERTY VALUE SOURCE\ndb2 guid 5552158746006792385 default\n\
    ```\n\nTo generate a new pool GUID, use zpool reguid. Give the pool name as an\
    \ argument.\n\n```\n# zpool reguid db2\n# zpool get guid db2\nNAME PROPERTY VALUE\
    \ SOURCE\ndb2 guid 76624604609377566669 default\n```\n\nYou can now attach the\
    \ disk image from one virtual machine to another without making ZFS a hissy fit.\n\
    \nGiving a pool a new GUID can also help if for some reason zdb(8) cannot find\
    \ your pool.1234\n"
