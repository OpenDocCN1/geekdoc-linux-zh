    # Prerequisites


    The title of the book includes the word “Advanced.” We expect you to know a couple
    things before you can use this. The easy answer would be that you should read
    and assimilate two earlier FreeBSD titles: Storage Essentials and ZFS. But you
    might already know what’s in those books, so here are some details on what you
    need to bring with you.


    You’ll need familiarity with FreeBSD’s storage management layer, GEOM. On non-FreeBSD
    platforms you can use disks and partition devices for ZFS. Always use ZFS on disk
    or partition devices, not on RAID or other software devices.


    We assume you’re familiar with ZFS pools and datasets. You know how to add VDEVs
    to a pool, and understand why you can’t add a lone disk to your RAID-Z. You can
    take snapshots and create clones.


    If you want to use FreeBSD’s encrypted ZFS support, you must understand FreeBSD’s
    GELI encryption. (You could use GBDE if you’re relying on the encryption to preserve
    human life, but the built-in GELI support suffices for most of us. Also, GELI
    takes advantage of the AES-NI hardware crypto acceleration in modern CPUs.)'
