    ## Resumable Send


    Just because ZFS makes dataset replication simple, doesn''t mean that the real
    world cooperates. As a dataset grows in size, chances increase that some transient
    network problem will break the connection and interrupt the stream. If you''re
    almost done with a 40 GB data stream over the Internet, a two-minute outage at
    your ISP can spark some well-deserved rage. Don''t go after the carrier with an
    axe; use resumable zfs send instead, letting you resume interrupted replications.
    Resumable zfs send first appeared in FreeBSD 10.3 in early 2016.


    To make a ZFS stream resumable, add the -s flag to zfs receive.


    The mypool/from dataset needs a few gigabytes in size. By adding -s to the zfs
    receive statement, though, we make the stream resumable. Which is good, because
    we''re going to interrupt the transmission with CTRL.


    ```

    local# zfs snapshot mypool/from@resumeme

    local# zfs send -v mypool/from@resumeme | ssh hotspot zfs receive -s remote

    full send of mypool/from@resumeme estimated size is 2.00G

    total estimated size is 2.00G

    TIME SENT SNAPSHOT

    17:12:43 279M mypool/from@resumeme

    17:12:44 529M mypool/from@resumeme

    17:12:45 786M mypool/from@resumeme

    ^

    ```


    Of course, because ZFS replication is unidirectional, the sender has no idea which
    blocks recently captured and wrote to the disk. Without resumable, you''d have
    to start the whole transmission over again.


    Over the receiving host, the partially received dataset has a new property,

    receive_resume_token. The sender needs the value of this property to pick where
    it left off.


    remote# zfs get -o value receive_resume_token remotop/to

    1-db9a171a3-c8-789c63606400310a50c4ec5c306710e7265


    Now provide that token with the -t flag. You do not need to include the source
    dataset, as the token includes everything zfs sends. Adding the -v spins out more
    details about the transmission.


    ```

    local# zfs send -v -t 1db9a171a3-c8-789c63606400310a50c4ec5c306710e7265

    resume token contents:

    version: 0

    object = 0x35000

    offset = 0x35000

    bytes = 0x355630

    guid = 0xc2374c4522d045

    name = mypool/from@resumeme

    full sent of mypool/from@resumeme estimated size is 1.16G

    TIME SENT SNAPSHOT

    17:38:20 263M mypool/from@resumeme

    17:38:21 472M mypool/from@resumeme

    ...

    17:42:04 1.16G mypool/from@resumeme

    ```


    Once zfs receive completes, the property becomes blank.


    ```

    # zfs get receive_resume_token remotool/to

    NAME PROPERTY VALUE

    remotepool/to receive_resume_token -

    ```


    If you don''t resume that send, the destination pool will have an unusable, incomplete
    dataset on it, taking up space. Delete that with -A.


    ```

    remote# zfs receive -A remotool/to

    ```


    This removes the partially received stream and frees that space.


    ## Automating Replication


    Everybody wants backups, but backups that must be manually run are not backups
    because they won''t happen. Sure, you''ll do them once or twice, but one day the
    coffee will break and you''ll barely be able to remember where you left off. Reliable
    backups demand and testing, but for automation we have zxfer.


    Zxfer(8) examines local and remote datasets, determines which snapshots must be
    replicated to synchronize the sets of data, and sends the datasets. It can also
    remove snapshots on the remote side once they''re removed from the local pool.
    FreeBSD does not include zxfer by default, but you can easily install it with
    pkg. As zxfer can work in both push and pull modes, you only need to install it
    on one of the systems. For our demonstration, we will install it on all nodes.


    ```

    # pkg install zxfer

    ```


    The zxfer command does not support either bookmarks or resumable replication.
    It also doesn''t set up replication accounts. You must configure those accounts,
    create SSH keys, and set permissions exactly as you would for normal replication.


    ## Using zxfer


    All of our replication examples used push mode; the host with the current datasets
    pushes them to a replication target. We''ll start with using zxfer similarly for
    the pull mode login for the remote host. Zxfer requires that you declare if you
    want to replicate a single dataset, or the dataset and all its children. The -R
    flag enables recursion, while -N indicates a single dataset and its snapshots.
    For backups, recursive mode is almost always correct. You might also add -v, for
    verbose mode.


    ```

    $ zxfer -v -T user@host -R localhost remotep

    ```


    If the account is the same on both sides, you can skip identifying the user; their
    own cannot be combined with arguments that don''t require that. You can use -v
    -T user@host, but -VT user@host makes zxfer complain bitterly. One thing to remember
    is that arguments that take an argument of zxfer is a shell script, it uses getopt(1)
    to handle command-line arguments, rather than the fancy option handling available
    in more complex


    Here we replicate the zroot/somedata dataset to use the pool remotool/backups
    on the remote.


    ```

    local$ zxfer -T replicator@remote -R mypool/somedata remotool/backups

    ```


    If you add the -v for verbose mode, you''ll see zxfer transferring each snapshot.


    +   - Sending zroot/somedata@snappycomeback to remotool/backups/somedata.

    - Sending zroot/somedata@reply to remotool/backups/somedata.

    - (incremental to zroot/somedata@snappycomeback).

    - Sending zroot/somedata@more to remotool/backups/somedata.

    - (incremental to zroot/somedata@reply).


    Once zfs exits, the remote host has all the snapshots.


    ```

    remote$ zfs list -t all -r remotool/backups

    NAME USED AVAIL REFER MOUNTPOINT

    remotepool/backups/somedata 10.1M 15.0G 10.1M /remotepool/ba

    remotepool/backups/somedata@snappycomeback 8K 10.1M

    remotepool/backups/somedata@reply 8K 10.1M

    remotepool/backups/somedata@more 8K 10.1M

    ```


    Further replication of these snapshots can run either in push mode or in pull
    mode. Lets try pull mode next.


    ## Zxfer Pull Mode


    In pull mode, zxfer logs into the remote machine via SSH and runs zfs send to
    transfer snapshots back to the host running zxfer. Use the -o flag with the login
    and host to indicate pool everything. Everything is the same.


    ```

    $ zxfer -O @user@host -R localpath remotep

    ```


    Now create an additional snapshot on the source pool


    ```

    local$zfs snapshot pool/somedata@new

    ```


    On the destination machine, run zxfer to pull the snapshots over. Here we''re
    adding -v to show more of what really happens


    ```

    remote#zxfer -v -O replicator@local -R zroot/somedata remotepool/back

    ```


    ## Rotating Snapshots


    If you keep sending snapshots, eventually your remote pool will fill up. You probably

