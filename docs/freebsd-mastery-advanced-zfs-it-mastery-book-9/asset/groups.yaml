    The zdb(8) man page clearly states that “The output of command in general refers
    to the on-disk structure of a ZFS pool, and is inherently unstable. The precise
    output of most invocations is not documented, knowledge of ZFS internals is assumed.”
    The output is based on what is on the disk and zdb(8)’s simulation of what’s in
    memory at any given instant. The interpretation is largely left to the operator.
    If you really dig into zdb(8), you probably need a copy of D&I handy for reference.


    The zdb(8) command has a large number of flags. Most all of these can be specified
    multiple times, increasing the verbosity of the information.


    # Block Statistics


    The zdb(8) utility can examine the breakdown of how blocks are allocated in the
    pool. We’ll start by examining a very small pool from a virtual machine, and then
    increasing larger pools. Use the -b flag and the pool name to get block statistics
    for that pool.


    Analyzing block statistics takes a lot of memory, as zdb(8) must track every block
    as it calculates the various statistics. A very large pool might require more
    memory than the host, and eventually the kernel’s out-of-memory killer will terminate
    zdb in-defense. Be careful running this on a production system, as zdb(8) can
    grind the system to halt.


    Let’s start with a small one-disk pool from a virtual machine.


    ```

    # zdb -b mypool

    tversing all blocks to verify nothing leaked...

    925M completed ( 473MB/s) estimated time remaining: Uhr 00min 00sec

    No leaks (block matches space maps exactly)

    ```'
