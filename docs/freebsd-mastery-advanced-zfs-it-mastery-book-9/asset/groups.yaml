  - "[PAGE 155]\n\n```\ndtrace -s duration.d 'duration' matched 2 probes\n```\n\n\
    ```\nCPU ID FUNCTION:NAME\n1 61043 : :txg-synced sync took 0.11 seconds\n2 61043\
    \ : :txg-synced sync took 0.24 seconds\n4 61043 : :txg-synced sync took 0.22 seconds\n\
    2 61043 : :txg-synced sync took 0.31 seconds\n```\n\nDespite best efforts, ZFS\
    \ isn't working hard on this system.\n\nIf you see that your transaction groups\
    \ are bouncing up against the maximum txg size, you might want to either increase\
    \ the txg size or decrease the time between groups.\n\nOnce you get the hang of\
    \ these, Jude created a script that measures both of these simultaneously.\n\n\
    ```\n#!/usr/bin/dtrace -s\ntxg-syncing\n/((dsl_pool_t *)arg0)->dp_spa->spa_name\
    \ == $1/\n{\n  start = timestamp;\n  this->dp = (dsl_pool_t *)arg0;\n  d_total\
    \ = this->dp->dp_dirty_total;\n  d_max = zfs_dirty_data_max;\n}\ntxtg-synced\n\
    /start & ((dsl_pool_t *)arg0)->dp_spa->spa_name == $1/\n{\n  this->d = timestamp\
    \ - start;\n  printf(\"%4dMB of %4dMB synced in %d.%02d seconds\",\n  d_total\
    \ / 1024 / 1024,\n  d_max / 1024 / 1024, this->d / 1000000000,\n  this->d / 1000000000\
    \ % 100);\n```\n\nSimultaneously viewing txg size and timing can provide additional\
    \ insight into how your pool really behaves.\n\n# Write Throttle\n\nOne term you'll\
    \ hear about is the write throttle. The write throttle can come into play when\
    \ a program feeds data into memory from ZFS can write it to disk. As the system\
    \ RAM gets more and more full, ZFS starts inserting a small delay into each write\
    \ request. Programs wait until they get a response to their write requests, putting\
    \ a delay forces them to slow down. The goal is to determine how much load the\
    \ disks can take, and slow down programs that they run at exactly that speed.\n\
    \nIn older versions of ZFS, the write throttle caused very irregular performance.\
    \ The"
  - '[PAGE 156]


    write throttle algorithm in FreeBSD 10 and newer works much more smoothly. You
    can tune it through the I/O scheduler, discussed next.'
- md: "\n# I/O Scheduling\n\nNot all hardware is created equal. Jude's top-of-the-line\
    \ laptop has a lot less I/O capacity than of his Content Delivery Network servers.\
    \ FreeBSD's default settings are fairly generic. While you don't really need to\
    \ tune them on a laptop, if you have dozens or hundreds of disks with very specific\
    \ workloads you can adjust performance through tuning the scheduling. Scheduling\
    \ I/O lets you adjust latency and throughput.\n\nThroughput is the amount of data\
    \ that can be read from and written to the storage device. When you say that SATA-3\
    \ can transfer data at 6.0 GB/s, you're talking about throughput.\n\nLatency is\
    \ the length of the time the system needs to service these requests. A complicated\
    \ storage system, with Fiber Channel busses and multiple shelves in multiple parts\
    \ of the building, might induce latency as it traverses the system. Your laptop\
    \ is more likely to have storage latency when you overload the hard drive by copying\
    \ too many files simultaneously.\n\nWhile hard drives are generally marketed with\
    \ a description of how many I/O operations they can perform per second (IOPS),\
    \ that isn't a term as you might think. Being able to perform 250 IOPS of carefully\
    \ selected data says nothing about the drive's ability to perform with your data.\n\
    \nThink of hard drives like automobiles. Some are optimized for capacity, others\
    \ for mileage. A huge tandem tractor-trailer rig can haul far more stuff than\
    \ a Tesla Roadster, that isn't snappy off the red light. Most of us would use\
    \ the big truck to move a hundred-person call center across town over the weekend,\
    \ but prefer different optimizations to get a child to the hospital before appendix\
    \ rupturing.\n\nUnlike a car, you can to a certain extent control the optimization\
    \ of most hard drives. (Some specialty storage devices are specifically designed\
    \ for certain optimizations.) That's why you can dump huge amounts of data on\
    \ your laptop's hard drive and make the system unresponsive—you've just exchanged\
    \ throughput for latency.\n\nZFS I/O scheduling is designed to smooth out latency.\
    \ This can reduce throughput, but makes the overall experience more consistent.\
    \ Generally, by changing the scheduling, you're trying to improve performance\
    \ while not introducing too much latency.\n\nZFS scheduling is built around I/O\
    \ queues.\n\n# Measuring Latency and Throughput\n\nHow do you know if a change\
    \ positively affects system performance? You measure. Adam Leventhal wrote a latency\
    \ and throughput DTrace script for illumos, but here's a version modified for\
    \ FreeBSD.\n\n```c\n#pragma D option quiet\ninline uint32_t BIO_READ = 1;\ninline\
    \ uint32_t BIO_WRITE = 2;\nthis uint64_t delta;\nBEGIN\n{\n start = timestamp;\n\
    io::=start / args[0] /\n{\n ts[args[0]] = timestamp;\n}\n io::=done /args[0] &\
    \ ts(args[0])/\nthis->delta = (timestamp - ts(args[0])) / 1000;\nthis->name =\
    \ (args[0]-bio_cmd & BIO_READ | BIO_WRITE) == BIO_READ ?\n\"read\" : \"write\"\
    \n@q[this->name] = quantize(this->delta);\n@a[this->name] = avg(this->delta);\n\
    @v[this->name] = stddev(this->delta);\n@if[this->name] = count();\n@b[this->name]\
    \ = sum(args[0]->bio_bcount);\nts(args[0]) = 0;\n}\nEND\n{\nnormalize(@q);i, (timestamp\
    \ - start) / 1000000000);\nnormalize(@b, (timestamp - start) / 1000000000 * 1024);\n\
    printf(\"%-30s %11s %11s %11s\\n\", \"\", \"avg latency\", \"stddev\", \"iops\"\
    )\nprintf(\"%-30s %9us %9us %bu/s %8uk/s\\n\", @a, @v, @i, @b);\n```\n\nRun script\
    \ several times while your system experiences normal load to get accurate baselines\
    \ for latency and throughput.\n\n# dtrace -s rw.d -c 'sleep 30'\nThe sleep command\
    \ tells the script how long to spend gathering data. The rw.d script watches the\
    \ throughput and latency for these many seconds, then prints out two graphs of\
    \ read and write. At the end you'll get a report like so:\n\n| avg latency | stddev\
    \ | iops | throughput |\n| :--- | :--- | :--- | :--- |\n| write | 1362us | 8378us\
    \ | 68/s | 4620k/s |\n| read | 6943us | 5839us | 2/s | 46k/s |\n\nGenerally speaking,\
    \ the goal of performance tuning is to improve the numbers you care about without\
    \ making the other numbers too large. Play with the maximum number of permitted\
    \ reads and writes of each type, increasing them by 20–100 percent between runs.\
    \ Make sure you don’t hoist these values high enough that your VDEVs go over the\
    \ per-VDEV limit—or, alternatively, play with the minimums.\n\nThe stddev (standard\
    \ deviation) column is especially noteworthy. You might achieve excellent throughput,\
    \ but find yourself with wildly varying latency. Massive throughput okay if some\
    \ of your reads and writes take five seconds to complete? Only you know.\n\nWhen\
    \ adjusting read performance, beware of the ARC. If you keep accessing the same\
    \ file, the kernel uses the in-memory copy rather than re-reading it from disk.\
    \ To properly test read performance, clear the cache.\n\n# I/O Queues\n\nZFS breaks\
    \ I/O into several queues: sync writes, async writes, and scrubs. The number of\
    \ outstanding requests in each queue is limited by the sysctls.\n\nSync writes\
    \ are used where a program uses the fsync(2) system call. These requests go straight\
    \ to the ZIL, either on a separate SLOG or on the disk. These writes are the most\
    \ important, as the application is waiting for the operation to finish. Tuning\
    \ this value lowers throughput and increases latency.\n\nAsync writes are normal\
    \ traffic that doesn't traverse the ZIL. Async writes sit in a txg, then get committed\
    \ in masse.\n\nScrub processes have their own queues, controlling how many outstanding\
    \ I/O requests can be active on a pool simultaneously.\n"
  mdcn: "\n\n# I/O 调度\n\n并非所有硬件都是平等的。Jude 的顶配笔记本电脑的 I/O 容量远低于他的内容分发网络服务器。FreeBSD 的默认设置相当通用。虽然在笔记本电脑上你并不需要对它们进行调优，但如果你有几十个或上百个具有特定工作负载的磁盘，你可以通过调优调度来调整性能。I/O\
    \ 调度允许你调整延迟和吞吐量。\n\n吞吐量是指可以从存储设备读取和写入的数据量。当你说 SATA-3 可以以 6.0 GB/s 的速度传输数据时，你说的的就是吞吐量。\n\
    \n延迟是系统处理这些请求所需的时间。复杂的存储系统（带有光纤通道总线和建筑多个部分的多个机架）在数据穿过系统时可能会产生延迟。当你通过同时复制太多文件导致硬盘过载时，你的笔记本电脑更容易出现存储延迟。\n\
    \n虽然硬盘通常的营销描述是它们每秒可以执行多少次 I/O 操作（IOPS），但这个术语的意义并不如你想象的那样。能够执行 250 IOPS 经过仔细挑选的数据，并不能说明硬盘处理你数据的能力。\n\
    \n将硬盘想象成汽车。有些针对容量进行了优化，另一些针对里程进行了优化。一辆巨大的双挂牵引车可以运输的货物远比特斯拉 Roadster 多，而后者在红灯起步时并不敏捷。我们大多数人会在周末使用大卡车将一个百人的呼叫中心搬到城市另一端，但在阑尾破裂前把孩子送到医院时会倾向于不同的优化方案。\n\
    \n与汽车不同，你可以在某种程度上控制大多数硬盘的优化。（某些特殊存储设备是专门为某些优化而设计的。）这就是为什么你可以向笔记本电脑的硬盘中倾倒大量数据并导致系统无响应——你只是用吞吐量换了延迟。\n\
    \nZFS I/O 调度旨在平滑延迟。这可能会降低吞吐量，但会让整体体验更具一致性。通常，通过更改调度，你是在尝试在不引入过多延迟的情况下提高性能。\n\n\
    ZFS 调度是围绕 I/O 队列构建的。\n\n# 测量延迟和吞吐量\n\n你如何知道某个更改是否正向影响了系统性能？通过测量来。Adam Leventhal\
    \ 为 illumos 编写了一个延迟和吞吐量的 DTrace 脚本，但这里有一个针对 FreeBSD 修改后的的版本。\n\n```c\n#pragma\
    \ D option quiet\ninline uint32_t BIO_READ = 1;\ninline uint32_t BIO_WRITE = 2;\n\
    this uint64_t delta;\nBEGIN\n{\n start = timestamp;\nio::=start / args[0] /\n\
    {\n ts[args[0]] = timestamp;\n}\n io::=done /args[0] & ts(args[0])/\nthis->delta\
    \ = (timestamp - ts(args[0])) / 1000;\nthis->name = (args[0]-bio_cmd & BIO_READ\
    \ | BIO_WRITE) == BIO_READ ?\n\"read\" : \"write\"\n@q[this->name] = quantize(this->delta);\n\
    @a[this->name] = avg(this->delta);\n@v[this->name] = stddev(this->delta);\n@if[this->name]\
    \ = count();\n@b[this->name] = sum(args[0]->bio_bcount);\nts(args[0]) = 0;\n}\n\
    END\n{\nnormalize(@q);i, (timestamp - start) / 1000000000);\nnormalize(@b, (timestamp\
    \ - start) / 1000000000 * 1024);\nprintf(\"%-30s %11s %11s %11s\\n\", \"\", \"\
    avg latency\", \"stddev\", \"iops\")\nprintf(\"%-30s %9us %9us %bu/s %8uk/s\\\
    n\", @a, @v, @i, @b);\n```\n\n在系统承受正常负载时多次运行脚本，以获得延迟和吞吐量的准确基准。\n\n# dtrace -s\
    \ rw.d -c 'sleep 30'\n`sleep` 命令告诉脚本花费多长时间收集数据。`rw.d` 脚本监控这几秒钟内的吞吐量和延迟，然后打印读取和写入两张图表。最后你将得到如下所示报告：\n\
    \n| avg latency | stddev | iops | throughput |\n| :--- | :--- | :--- | :--- |\n\
    | write | 1362us | 8378us | 68/s | 4620k/s |\n| read | 6943us | 5839us | 2/s |\
    \ 46k/s |\n\n通而言之，性能调优的目标是在提高你关心的数字的同时，不让其他数字变得太大。尝试调整每类型允许的最大读取和写入次数，在每次运行之间增加\
    \ 20–100%。确保不要将这些值调得太高以至于你的 VDEVs 超过了每个 VDEV 的限制——或者，尝试调整最小值。\n\n`stddev`（标准差）列特别值得注意。你可能获得了卓越的吞吐量，但发现延迟波动很大。如果你的某些读取和写入需要五秒才能完成，巨大的吞吐量还可以吗？只有你知道。\n\
    \n在调整读取性能时，注意 ARC。如果你一直访问同一个文件，内核将使用内存中的副本而不是从磁盘重新读取。为了正确测试读取性能，请清除缓存。\n\n# I/O\
    \ 队列\n\nZFS 将 I/O 分为几个队列：同步写入、异步写入和校验（scrub）。每个队列中未处理的请求数受 sysctls 限制。\n\n同步写入程序使用\
    \ `fsync(2)` 系统调用的地方。这些请求直接进入 ZIL，是在独立的 SLOG 上还是磁盘上。这些写入是最重要的，因为应用程序正在等待操作完成。调整此值会降低吞吐量并增加延迟。\n\
    \n异步写入是不经过 ZIL 的正常流量。异步写入保留在 txg 中，然后批量提交。\n\n校验进程有自己的队列，控制池中同时可以有多少个活跃的 I/O 请求。\n\
    \n"
