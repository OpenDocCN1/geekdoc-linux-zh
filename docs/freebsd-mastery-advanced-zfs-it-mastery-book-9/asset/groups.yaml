    ## 不区分大小写的文件系统


    某些客户端（特别是 OS X）期望文件系统是不区分大小写的。你可以通过 `casesensitivity` 属性让 ZFS 数据集不区分大小写。


    `casesensitivity` 属性默认是 `sensitive`（敏感），即传统的 Unix 风格区分大小写。如果你将其设置为 `mixed`（混合），ZFS
    可以支持区分大小写和不区分大小写的请求。将 `casesensitivity` 设置为 `insensitive`（不敏感）意味着 ZFS 将完全不区分大小写。


    你只能在创建数据集时设置此属性。


    ```

    # zfs create -o casesensitivity=mixed samba/share

    ```


    要更改现有数据集的大小写敏感性，创建一个正确设置属性的新数据集，然后将文件复制过去。


    ## ZFS 深度解析：zdb(8)


    为了更好地了解 ZFS 内部正在发生什么，能够窥探幕后情况会有帮助。检查 ZFS 的内部状态可以帮助你理解系统为何以这种方式运行运行。即使你对“香肠是如何制作的”不感兴趣，本节也可能包含一些感兴趣的点。


    许多人阅读《FreeBSD 系统的设计与实现》（第 2 版，Addison-Wesley Professional, 2014）中的 ZFS 章节来学习 ZFS
    的内部数据结构。虽然该书提供了大量信息，但对系统中的实际文件研究这些数据结构的能力会让一切更有意义。


    FreeBSD 提供的 ZFS 工具套包含 `zdb(8)`，它是 ZFS 调试器。`zdb(8)` 手页明确指出：“命令的输出通常指的是 ZFS 池的磁盘上结构，并且在本质上是不稳定的。大多数调用的精确输出均未记录，假设用户了解
    ZFS 内部原理。”输出基于磁盘上的内容以及 `zdb(8)` 对任何时刻内存中内容的模拟。解释工作很大程度上留给了操作员。如果你真的深入研究 `zdb(8)`，你可能需要手头准备一份《设计与实现》以供参考。


    `zdb(8)` 命令有许多标记。其中大多数标记可以指定多次，以增加信息的详细程度。


    ### 块统计


    `zdb(8)` 实用可以检查池中块分配的分类情况。我们将从检查一个虚拟机的极小池开始，然后增加较大的池。使用 `-b` 标记和池名称来获取该池的块统计。


    分析块统计需要大量内存，因为 `zdb(8)` 在计算各种统计数据时必须跟踪每一个块。非常大的池可能需要的内存超过宿主机内存，最终内核的 OOM 杀手会为了保护系统而终止
    `zdb`。在生产系统上运行此命令时要小心，因为 `zdb(8)` 可能会导致系统停顿。


    让我们从虚拟机的小型单磁盘池开始。


    ```

    # zdb -b mypool

    traversing all blocks to verify nothing leaked...

    925M completed ( 473MB/s) estimated time remaining: Uhr 00min 00sec

    No leaks (block matches space maps exactly)

    ```


    ```

    bp count: 85010

    ganged count: 0

    bp logical: 2159973376 avg: 25408

    bp physical: 89729176 avg: 10555 compression: 2.41

    bp allocated: 1159446528 avg: 13638 compression: 1.86

    bp deduped: 0 ref>1: 0 deduplication: 1.00

    SPA allocated: 1159446528 used: 5.72%

    ```


    额外的、非指针类型的块数量：5873

    同一 vdev 上的 Dittoed 块：9645


    统计数据的第一部分涵盖了指针，即包含数据块元数据和索引细节的块。`bp count` 字段显示池中有多少个块指针——这里是 85,010 个。


    `bp logical` 字段显示逻辑空间的总量，或这些块的实际大小。这些块指针指向 2,159,973,376 字节，约 2 GB。平均块指针处理约 25,408
    字节。


    `bp physical` 数量显示这些块在磁盘上消耗了多少空间。这就是压缩优势显示的地方。虽然我们有大约 2 GB 的文件，但显示我们使用了大约 800
    MB 的磁盘空间来存储文件。但这并不是全部。


    `bp allocated` 数字给出了真实世界的磁盘空间消耗情况。扇区大小、填充和校验意味着我们没有获得压缩提供的全部节省。这台服务器的真实压缩系数为 1.86，将那
    2 GB 进了 1.1 GB——这是重大的。


    这里有一个来自活动服务器的较大池，只有一个单磁盘 VDEV：

