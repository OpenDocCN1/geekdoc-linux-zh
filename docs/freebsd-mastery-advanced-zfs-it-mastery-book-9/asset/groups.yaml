    Speaking of SSDs...


    ## SSDs


    Solid state disks, or SSDs, are significantly different than regular spinning
    drives, and requiring utterly different from traditional disks. For one thing,
    they''re not even disks.


    For a spinning drive to read to two sectors that reside at different locations
    on the disk, the read head must position itself in the right location, wait for
    the spinning platter to come around to the correct location, read the sector,
    then reposition itself to the second sector, again wait for the platter to come
    around to the correct offset, then read the second sector. This waiting is called
    the *seek time*.


    An SSD has no moving parts. When you read data from two different parts of the
    drive, the drive has a seek time of zero. Most SSDs get their relatively high
    read and write speeds from the fact that they read and write to multiple cells
    concurrently. In order to keep multiple memory cells busy, the operating system
    must supply the drive with a queue of work to complete.


    For a normal spinning drive, having a “deep” queue is bad. It means the amount
    of time between data is requested and when it is written or returned is higher,
    because it must wait for the work ahead of it in the queue to complete. By having
    a lower queue depth, more important work items can get to the front of the queue,
    cutting in front of less important work that has been waiting in line. To get
    the most out of an SSD, however, the queue depth must be high enough to make each
    cell gets assigned work. You cannot get the performance boasted on a box without
    a full queue.


    Unlike a spinning disk, which has sectors that reside at fixed locations on the
    platter, SSDs are an array of immobile flash cells. SSDs use FTL (Flash Translation
    Layer) to map the equated locations on disk to the particular flash cell containing
    stored data. While SSDs claim to have the Logical Block Addresses by spinning
    disks, the FTL provides these with LBAs. LBAs on an SSD bear even less relationship
    to reality than they do on spinning disks.


    Since flash cells wear out, almost all SSDs contain more storage than they claim
    on the box. The drives spread data around the cells in order to wear them more
    evenly. Once all the space is occupied, a garbage collector runs. The garbage
    collector finds cells that are no longer referenced, or which the OS has used
    the TRIM (SATA) or UNMAP (SCSI) command to mark as unused, and clears them for
    further use.


    When you add SSDs or other devices that support TRIM to a ZFS pool, FreeBSDTRIMs
    the entire partition or device by default, so that it starts in a known state.
    This can cause a delay of tens of minutes or even hours before the drive is usable.
    If your devices are new, or you do not want to TRIM them when you add them to
    the pool, set the sysctl vfs.zfs.vdev.trim_on_init to 0 before adding the device
    to the pool.


    ## NVMe


    Non-Volatile Memory Express, or NVMe, is a newer technology designed to further
    increase solid state storage speed. It''s used for flash drives, as well as other
    non-volatile memory Intel''s 3D Xpoint. NVMe itself is a physical interface specification,
    an alternative to SATA or SCSI/SAS. You''ll find NVMe cables and adapters that
    attach the PCI-e bus.


    The slowest, most complicated, and most error-prone part of an SSD is the FTL.
    Pretending to be as stupid as a 1980s-era spinning disk is hard labor. NVMe improves
    performance on the same hardware by dropping this clumsy pretense, instead adopting
    protocols for flash memory.


    One of the biggest differences between NVMe devices and SSDs is that NVMe devices
    have multiple queues, usually one read and one queue per CPU. Rather than trying
    to keep a single queue of enough work to occupy multiple cells, NVMe has multiple
    queues. NVMe queues can be kept relatively shallow, to allow high-priority tasks
    to supersede older work. Spreading the load across CPUs helps even greater performance.


    While HDDs and SSDs interface with AHCI, which has a single queue of up to 64
    commands per device, the NVMe interface allows up to 65,536 queues each. The NVMe
    interface requires less locking while offering greater parallelism.


    FreeBSD''s nvme driver appeared in FreeBSD 9.2. Much like a hard drive, you can
    expect the first nvme device to be /dev/nvme0, /dev/nvme1, and so on. NVMe devices
    natively support namespaces, allowing them to be divided into logical namespaces,
    similar to partitioning. Unlike everything in computing, the NVM Express specification
    starts numbering namespaces at 1 rather than 0. You''ll get devices like /dev/nvme01,
    /dev/nvme02, and so on. Only newer NVMe devices support managing namespaces. Current
    devices have a single namespace that covers the entire device.


    ## Viewing NVMe Devices


    Use nvmectl to manage NVMe devices. Start by identifying all of the NVMe hardware
    connected to the system with nvmectl list.


    ```

    # nvmectl list

    nvme0: INTEL SSDMD800G

    nvme0ns1 (763097MB)

    ```


    This host has a single NVMe, with a single namespace. Use the `nvmectl identify`
    command to learn specific information about the device.


    ```

    # nvmectl identify nvme0

    Controller Capabilities/Features

    Vendor ID: 8086

    Subsystem Vendor ID: 8086

    Serial Number: CVFT403004A800CG

    Model Number: INTEL SSDMD800G

    Firmware Version: 8DV1051

    ```


    This goes on for a bit, identifying all of features NVMe supports. The `identify`
    command also works on the namespaces.


    ```

    # nvmectl identify nvme0ns1

    Size (in LBAs): 156284368 (1490M)

    Capacity (in LBAs): 156284368 (1490M)

