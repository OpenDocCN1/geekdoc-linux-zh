    # 卷模式 (Volume Mode)


    在为应用程序创建卷之前，请考虑它的预期用途以及哪些主机将访问它。FreeBSD 默认的 ZFS 设置假设托管 zvol 的系统完全控制着它。然而，如果你将
    zvol 用作虚拟机的存储器，那么客体操作系统对其拥有完全控制权。这很重要，因为 FreeBSD GEOM 层会自动配置存储。已经由主机配置好的存储会给虚拟化客端系统带来问题。


    使用 `volmode` 属性来控制由哪个系统配置卷。


    默认的 `volmode` 为 `geom`，意味着卷所在的系统对其进行控制。如果我们在主机 A 上创建一个 zvol，则主机 A 将通过 GEOM 配置并管理该卷。除了
    ZFS 卷的设备节点外，它还会在 `/dev/label1/` 等类似位置（注：原文为 /dev/label1）获取设备节点。在本地使用 zvol 时，请使用
    `geom volmode`。


    > `volmode` 表示该 zvol 仅通过 `/dev/zvol` 中的单个设备节点可用。GEOM 不会尝试自动配置此卷。你可以为该节点分配标签，但
    FreeBSD 甚至不会尝试查看它。对于虚拟机存储（如 bhyve(8) 主机），请使用 `dev volmode`。


    `volmode` 表示该 zvol 甚至不会获得设备节点。你可以对此卷进行克隆、快照或复制。这种模式仅对备份有用。


    你无法更改正在运行的 zvol 的模式——虽然你可以更改 `volmode` 属性的值，但该卷的实际模式不会发生改变。要让 `volmode` 的更改生效，请导出（export）并重新导入（import）该卷。（你也可以重命名卷，这实际上相当于导出该卷并在不同的名称下导入它）


    通过在命令行指定模式或设置全局默认值来创建具有所需模式的卷。


    # 命令行中的 volmode


    与任何其他属性一样，在创建 zvol 时使用 `-o` 标志来设置 `volmode`。


    ```

    # zfs create -V 10G -o volmode=dev vm/swap0

    ```


    这个新的 zvol 仅可以通过设备节点 `/dev/zvol/vm/swap0` 访问。


    # 默认 volmode


    如果一个主机经常需要使用 `geom` 以外的 `volmode`，那么更改默认 `volmode` 是合理的。`sysctl vfs.zfs.vol.mode`
    控制新 zvol 的默认 `volmode`。


    默认值 `1` 告诉 ZFS 使用 `geom` 模式。设置为 `2` 表示 `dev` 模式，而 `3` 则表示 `none` 模式。使用 `sysctl(8)`
    修改默认值，或通过 `/etc/sysctl.conf` 中的条目使更改在下次重启时永久生效。这里有一个 `/etc/sysctl.conf` 条目，用于让虚拟化服务器创建模式为
    `dev` 的新 zvol：`vfs.zfs.vol.mode=2`


    不需要显式定义 `geom` volmode。


    # 访问 zvol


    你不能像挂文件系统数据集那样 `zfs mount` 一个 zvol。zvol 的意义在于它是一个块设备。要访问它，必须访问设备节点或其 GEOM 提供者。最可能是设备节点。


    zvol 会在 `/dev/zvol/` 下以池命名的子目录下获得一个设备节点。我们示例 zvol `vm/db1` 的设备节点将是 `/dev/zvol/vm/db1`。


    我们可能会将此 zvol 存储分配给 bhyve 虚拟机，在这种情况下，我们可能会让虚拟机对磁盘进行分区。


    对于其他用途，我们可能想在本地对其分区。在这里，我们在 zvol 上创建一个 GPT 分区方案，并使其作为一个大分区，带有 `db1` 的 GEOM 标签。我们还为它分配了一个
    GEOM 标签。


    ```

    # gpart create -s g /dev/zvol/vm/db1

    zvol/vm/db1 created

    # gpart add -t freebs-ufs -1 db1 /dev/zvol/vm/db1

    zvol/vm/db1p added

    # glabel db1 /dev/zvol/vm/db1

    ```


    由于此 zvol 是用默认的 `volmode` (geom) 创建的，它现在也可以通过设备节点 `/dev/label/db1` 访问。


    一旦分区存在，你就可以在其上创建文件系统。


    ```

    # newfs -j /dev/zvol/vm/db1

    /dev/zvol/vm/db1: 2097152.0MB (4294967296 sectors) block size 32768, fragment
    using 3350 cylinder groups of 626.9MB, 20035 blks, 80256 inodes.

    with soft updates

    ```


    等一下——我们为什么可能要在 zvol 上使用 UFS 呢？


    也许我们的 iSCSI 客端或虚拟机虚拟机没有资源来有效运行 ZFS。通过为客端提供带有其可以支持的文件系统的 ZFS 支撑卷，客端可以获得 ZFS 的额外保护，即使客端无法直接使用
    ZFS。然而，我通过 `-j` 启用了 UFS 软更新日志，因为 ZFS 的数据完整性与 UFS 文件系统日志保护的是完全不同的内容。ZFS 完整性检查确保了写入是安全的，而文件系统日志则验证所有写入都已完成。


    现在 zvol 有了文件系统，你就可以挂载它。


    ```

    # mount /dev/gpt/db1 /media/

    ```


    大功告成！我有一个由 ZFS 支持的 UFS 文件系统，准备可以使用。


    zvol 最常见的用途是作为虚拟机的后端存储。...（注：此处提供的原始文本后半部分似乎出现了大量乱码或重复的无意义字符，已根据指令翻译了前半部分并在此处逻辑结束）


