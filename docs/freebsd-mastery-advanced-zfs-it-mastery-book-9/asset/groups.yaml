    # Splitting Mirrors


    Combining storage into pools is one of ZFS'' core features. But ZFS lets you perform
    the same action in reverse—splitting mirrored pools into multiple identical pools.
    If you want to more literally clone a machine, or pull off a copy of a mirror
    to run a backup, or perform some other sort of mad computer science, zzpool split
