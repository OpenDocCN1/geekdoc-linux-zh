  mdcn: '

    同步读取最大：10

    异步读取最大：3

    同步写入最大：10

    异步写入最大：10

    清洗最大：2


    一个具有最大可能并发请求数的磁盘将会有 35 个待处理请求。一个 10 块磁盘的 VDEV 可以有 350 个并发待处理请求，而 29 块磁盘的 VDEV
    可以有 1015 个并发待处理请求。


    观察每类型的请求，你会发现这是一个相当平衡的计划。同步和异步写入都有自己的队列，因此你的写入不会过载 ZIL（同步日志）。只要降低异步预取读取，你就可以获得大量的读取，这样
    ZFS 对你的程序将要访问数据的猜测就不会阻塞活跃的流量。


    更改这些值会调整 ZFS 分配请求的方式。你希望系统偏向于写入数据吗？增加异步写入的数量。你想要快速清洗吗？提高清洗请求的上限。


    然而，你无法通过提高这些设置来提升硬件速度。现有的限制已经足以完全饱和一个 5400 转的 SATA 硬盘。对于具有读写分离硬件的高端存储设备，可能可以处理略高的值。即使如此，你很快就会达到最大容量。


    对于固态存储（如 SSD），其 IOPS 远大于旋转硬盘，通过增加其所有调优参数可以提高性能。为了从设备获得最大的性能，你必须给它足够的工作来保持忙碌，但同时工作不能太多，以免导致重要的请求排在队列末尾时等待太久。使用本章节前面提供的
    DTrace 脚本测量负载下的延迟并根据需要进行调整。


    但如果你拥有顶级的硬件并将限制提高过高，就会触及每个 VDEV 的限制，改变一切。


    # 调度大型 VDEV


    ZFS 有两个调度系统：一个用于系统允许许多待处理 I/O 请求的情况，另一个用于系统不允许的情况。多少算“许多”？这取决于你的 VDEV 和宿主机。


    `sysctl vfs.zfs.vdev.max_active` 给出了 ZFS 更改调度算法的标记位。FreeBSD 的默认值是 1000。对于大多数主机，在默认配置下，这意味着在切换算法之前，一个
    VDEV 可以包含 28 块磁盘。如果你更改了 I/O 队列，你就改变了计算方式。


    达到限制意味着 ZFS 改变了调度方式。它不再将最大值作为上限，而是允许每块磁盘拥有等于最小值的待处理请求数。


    - 同步读取最小：10

    - 异步读取最小：3

    - 同步写入最小：10

    - 异步写入最小：1

    - 清洗最小：1


    这意味着每块磁盘至少获得 25 个待处理请求。系统默认可以支持多达 1000 个待处理请求，因此任何额外的请求将按优先级顺序分配。


    如果你在单个 VDEV 中有超过 40 个存储提供者，即使是最小值也超过了系统允许的总数。要么更改 `vfs.zfs.vdev.max_active` 以允许更多请求，或者（最好）重新排列你的
    VDEV，使其包含合理数量的存储提供者。


    # 异步写入与事务组大小


    异步写入的工作方式略有不同。当系统大部分时间空闲且没有太多要写入时，系统会创建一个异步写入请求。（从技术上说，最小数量是 `vfs.zdev.async_write_min_active`，但没有理由将其高于
    1。） 内存中等待写入磁盘的数据被称为“脏数据”。随着事务组（txg）大小和频率的增加，ZFS 会调度更多的并发写入。当系统达到 `vfs.zdev.async_write_max_active`
    sysctl 定义的最大写入请求数时，它开始人为地放慢写入。


    `vfs.zdev.async_write_min_percent` 和 `vfs.zdev.async_write_max_dirty_percent`
    控制 ZFS 如何添加写入请求。这些是系统允许脏数据的百分比——事务组的最大大小。在最小百分比以下，系统使用最小写入请求数，留出更多带宽。在最大百分比及以上，系统使用最大写入请求数以匹配需要写入的数据。请求数在它们之间线性缩放。


    默认情况下，最小百分比是 30，最大是 60。异步写入的数量是 1，最大是 10。这是如何运作的？


    假设 `vfs.zdev.dirty_data_max` 设置为 1 GB，这使得计算变得简单。一个事务组只能是 1 GB。如果宿主机有 300 MB 数据准备好写入（即
    1 GB 的 30%），它使用单个写入请求。每超过 300 MB 的脏数据就会增加另一个写入请求。如果宿主机有 600 MB 数据准备好写入（即 1 GB
    的 60%），它会队列 10 个写入请求。


    在理想情况下，系统在正常负载下运行时，事务组的大小应该处于最小和最大值之间。

    '
