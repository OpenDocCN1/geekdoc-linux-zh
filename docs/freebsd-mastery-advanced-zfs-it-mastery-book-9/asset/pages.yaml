    n\", @a, @v, @i, @b);\n\nRun script several times while your system experiences\
    \ normal load to get accurate baselines for latency and throughput.\n\n# dtrace\
    \ -s rw.d -c 'sleep 30'\nThe sleep command tells the script how long to spend\
    \ gathering data. The rw.d script\nwatches the throughput and latency for these\
