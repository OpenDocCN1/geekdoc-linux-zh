  md: '# Controlling Host Adapters


    FreeBSD includes several tools for managing non-RAID hard drive controllers, normally
    called host adapters, or HBAs. For older controllers you probably would rather
    not be using any more, you''ll find mfiutil(8) and mputil(8). FreeBSD 10.3 has
    the mprutil(8) and mpsutil(8) programs. Mprutil(8) is for the LSI Fusion-MPS 3
    HBAs, while mpsutil(8) is for LSI Fusion-MPS 2 HBAs. (As Avago purchased LSI,
    you might also see these cards with Avago branding.)


    Both programs behave identically, we''ll demonstrate with mpsutil(8).


    # Adapter Details


    First, find the adapters connected to your system.


    ```

    # mpsutil show adapters

    Device Name Chip Name Board Name Firmware

    /dev/mps0 LSISAS2308 13000000

    /dev/mps1 LSISAS2308 13000000

    ```


    Now look at all of the devices attached. By default both tools access the first
    device node, either /dev/mps0 or /dev/mpr. Access other HBA devices with the -u
    flag and the device number.


    | SAS Address Handle Parent Device Target Speed Enc Slot Wdt |

    |---|---|---|---|---|---|---|---||

    | 00 | 08 | 5000ca2235ddd0a4 | 000a | 0009 | SMP Target | 6.0 | 0002 | 00 | 4
    |

    | 00 | | 5000ca2235ddd0a | 000a | 0009 | SAS Target | 6.0 | 0002 | 00 | 1 |

    | 00 | 09 | 5000ca2235d2719d | 000b | 0009 | SAS Target | 6.0 | 0002 | 01 | 1
    |

    | 00 | 10 | 5000ca2235db3bd0 | 000c | 0009 | SAS Target | 6.0 | 0002 | 02 | 1
    |

    | 00 | 11 | 5000ca2235e028d | 000d | 0009 | SAS Target | 6.0 | 0002 | 03 | 1 |


    Every line here is some device that responds to SCSI commands. The majority of
    them are hard drives. Anything that''s on the SCSI bus is a target, a hard drive.
    Really digging into this requires understanding of SAS and SCSI, but we can glean
    useful information without deep knowledge.


    The first two columns show the device''s SCSI-style address. The third gives the
    device''s physical address. Much like an Ethernet card, every SAS device has a
    unique.


    The Handle column indicates the name for the device, while the Parent column shows
    what this device is attached to. Look at our first line. It has a handle of 0009.
    The second column has its parent is 0009. The device on line two is'
  merge: -1
  pgno: 104
- img_proc: true
  md: 'attached to the device on line one.


    The Device column shows what kind of device this is. A “SAS Target” is a fancy
    way of saying “a SAS hard drive.” An SMP (Serial Attached Management Protocol)
    target is a SAS switch or expander.


    The Speed column shows the connection speed in gigabytes per second.


    The Enc column shows the enclosure, while the Slot column shows the slot or drive
    bay. Finally, the Wdt column shows the maximum number of port connections on this
    device.


    # Display Enclosures


    Use the show enclosures command to view the enclosures attached to an HBA. Here
    we list the enclosures connected to /dev/mps1.


    ```

    # mpsutil -u 1 show enclosures

    Slots Logical ID SEPHandle EnchHandle Type Direct Attached SGPIO

    08 500605b009d018c0 0001 Direct Attached SGPIO

    25 500304801786b87f 0022 External SES-2

    13 5003048001f7ab3f 0003 External SES-2

    ```


    You’ll see the number of slots in the enclosure, the device’s handle (if any),
    and the type of enclosure.


    The Logical ID is a SAS address. You can map these to SAS addresses shown in sesutil(8)
    or other commands.'
  merge: -1
  pgno: 105
- img_proc: true
  md: '# sas2ircu


    If you are using an older version of FreeBSD that doesn''t have mpsutil, or need
    functionality that it doesn''t provide, LSI/Avro provides their own proprietary
    tool, sas2ircu(8). Most of the features mpsutil(8) lacks the controller''s built-in
    software RAID.2 Sas2ircu(8) also lets you get information about the HBA''s firmware
    version. It''s available as a FreeBSD port, sysutils/sas2ircu.


    The sas2ircu program expects at least two arguments: a controller (device node)
    number and a command. Even if you have only one controller, you must specify the
    controller number.


    # Viewing Hardware


    To see the hardware attached to an HBA, use the display command. Here we look
    at the devices attached to controller 0, /dev/mps0 Or /dev/mps0.


    ```

    # sas2ircu 0 display

    ```


    You''ll get a bunch of copyright information, as well as helpful notes like this:


    Read configuration has been initiated for controller 0


    Or, "I''m going to do that as you asked now."


    ```

    Controller information


    Controller type         : SAS2308_2

    BIOS version            : 7.37.00.00

    Firmware version        : 19.00.00.00

    Channel description    : 1 Serial Attached SCSI

    ....

    ```


    BIOS and firmware versions are useful if you have to troubleshoot or use the manufacturer''s
    technical support. Once all this is past, we get information on the actual hardware.
    Each hard drive gets an entry like this.


    # Physical device information


    ```

    Initiator at ID #0


    Device is a Hard disk

    Enclosure #           : 1

    Slot #                : 0

    SAS Address            : 4433221-1-0300-0000

    State                 : Ready (RDY)

    Size (in MB)/(sectors)  : 4769307/976541167

    Manufacturer         : ATA

    Model Number          : TOSHIBA MD04ACA5

    ```'
  merge: -1
