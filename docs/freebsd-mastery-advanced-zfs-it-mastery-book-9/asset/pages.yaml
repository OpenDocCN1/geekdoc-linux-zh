  md: '# Asynchronous Writes and Transaction Group Sizes


    Asynchronous writes work slightly differently. When the system is mostly idle,
    and doesn''t have much to write, the system creates a single asynchronous write
    request.(Technically, the minimum number is the sysctl vfs.zdev.async_write_min_active,
    but there''s no reason to turn this above 1.) Data that''s in memory and waiting
    to be written to disk is calleddirty data". As transaction groups increase in
    size and frequency, ZFS schedules more and more concurrent writes. When the system
    hits the maximum number of write requests, as defined by the vfs.zdev.async_write_max_active
    sysctl, it starts artificially slowing write requests


    The sysctls vfs.zdev.async_write_min_dirty_percent and vfs.zdev.async_write_max_dirty_percent
    control how ZFS adds write requests. These are percentages of the allowed dirty
    data on the system—the maximum size of a txg, or the value of the sysctl vfs.zdev.dirty_data_max.
    At the minimum percentage and below, the system uses the minimum number of write
    requests, leaving more bandwidth for reads. At the maximum percentage and above,
    the system uses the maximum number of write requests to keep up with the amount
    of data that needs to be written. The number of requests requests scales linearly
    between them.


    By default, the minimum percentage is 30 and the maximum is 60. The minimum number
    of async write requests is 1, and the maximum is 10. How does this play out?


    Assume a host has vfs.zdev.dirty_data_max set to 1 GB, because it makes the math
    easy. One txg can only be 1 GB in size. If a host has up to 300 MB of data ready
    to write (30 percent of 1 GB), it uses a single write request. Each 30 MB of dirty
    data over 300 adds another write request. If the host has 600 MB of data ready
    to write (60 percent of 1 GB), it queues 10 write requests.


    In an ideal world, where the system is cruising at normal load, the size of a
    txg should go somewhere between the minimum and maximum size. Our host with vfs.zdev.dirty_data_max
    should have an amount of dirty data around 450 MB, plus or minus 150.


    Maybe the VDEVs can handle more than 10 commands queued to the disk, so you want
    to increase the vfs.zdev.async_write_max_active sysctl. Increasing this sysctl
    beyond what your hardware handles causes latency, so be sure to monitor the effects
    of any changes under normal load. Changing the maximum number of outstanding write
    requests impacts how quickly the system creates write requests, but it doesn''t
    affect'
