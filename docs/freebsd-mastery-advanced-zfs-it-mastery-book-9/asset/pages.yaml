  md: '# Splitting Mirrors


    Combining storage into pools is one of ZFS'' core features. But ZFS lets you perform
    the same action in reverse—splitting mirrored pools into multiple identical pools.
    If you want to more literally clone a machine, or pull off a copy of a mirror
    to run a backup, or perform some other sort of mad computer science, zzpool split
    is your friend.


    We''ll demonstrate adding disks to a mirrored pool, then split the pool into duplicates.
    You could perform the same task in reverse: pull the disks off a mirror, then
    add them back when you''re done with the duplicate. We recommend maintaining at
    least two providers in each mirror VDEV at all times, however.


    # Make Mirrors Deeper


    A mirror''s depth describes how many copies of data the mirror includes. This
    pool, a typical striped mirror, contains two mirrors of two disks each.


    ```

    # zpool status db

    NAME STATE READ WRITE CKSUM

    db mirror-0 ONLINE 0 0 0

    gpt/zfs0 ONLINE 0 0 0

    gpt/zfs1 ONLINE 0 0 0

    mirror-1 ONLINE 0 0 0

    gpt/zfs2 ONLINE 0 0 0

    gpt/zfs3 ONLINE 0 0 0

    ```


    I want to make this pool deeper, adding an additional disk to each VDEV. Use the
    zpool attach command with the pool name, a device already in the target VDEV,
    and the new device.


    ```

    # zpool attach db gpt/zfs1 gpt/zfs4

    # zpool attach db gpt/zfs3 gpt/zfs5

    ```


    In between running these two commands, the pool has one mirror of three devices
    and one mirror of two devices. At the end, the mirror looks like this.


    ```

    NAME STATE READ WRITE CKSUM

    db mirror-0 ONLINE 0 0 0

    gpt/zfs0 ONLINE 0 0 0

    gpt/zfs1 ONLINE 0 0 0

    gpt/zfs4 ONLINE 0 0 0

    mirror-1 ONLINE 0 0 0

    gpt/zfs2 ONLINE 0 0 0

    gpt/zfs3 ONLINE 0 0 0

    ```'
  merge: -1
  pgno: 184
- img_proc: true
  md: 'Once the pool finishes resilvering the drives, you can split the pool.


    # Splitting the Pool


    Use the zpool split command to pull a device from each VDEV to create the new
    pool. The command has mandatory arguments: the name of the pool you want to split
    and a name for the newly created pool. Here we split the pool db, creating an
    identical copy in the pool db2.


    ZFS removes the device most recently added to each mirror to create a new pool.


    Splitting a pool does not automatically import the new pool. Once you import it,
    the split pool looks like this.


    ```

    # zpool status db2

    ...

    NAME      STATE READ WRITE CKSUM

    db2      ONLINE 0     0      0

    gpt/zfs4 ONLINE 0     0      0

    gpt/zfs5 ONLINE 0     0      0

    ```


    This pool contains two striped disks.


    In the original pool, the striped pair of three-way mirrors has become a striped
    pair of two-disk mirrors.


    If you’re keeping this split-off pool around for any length of time, you should
    add more disks to create proper mirrors. You might not add another set of disks
    if you’re pulling backups off of these drives, though.'
  merge: -1
