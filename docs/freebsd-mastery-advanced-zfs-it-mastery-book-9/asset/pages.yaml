  md: '# ## Chapter 9: Tuning


    A sysadmin learning ZFS usually spends time scratching her head over ZFS'' space
    use. Combining pooled storage, datasets, snapshots, and clones, makes ZFS space
    utilization very complicated, demanding a whole chapter in *FreeBSD Mastery: ZFS*.
    When you start mucking with the `recordsize` and `volblocksize` properties for
    databases and zvols, utilization can swerve straight into the Twilight Zone.


    The `volblocksize` property gives the size of a storage block on a zvol. The block
    size should represent the block size of the filesystem used on the zvol. The default
    `volblocksize` is 8 KB, which could hold two 4 KB or 16 512-byte filesystem sectors.


    The `recordsize` property gives the maximum size of a logical block in a ZFS filesystem
    dataset. The default `recordsize` is 128 KB, which comes to 32 sectors on a disk
    with 4 KB sectors, or 256 sectors on a disk with 512 byte sectors. The maximum
    record size was increased to 1 MB with the introduction of the `large_blocks`
    feature flag in 2015. Many database engines prefer smaller blocks, such as 4 KB
    or 8 KB. It makes sense to change the `recordsize` on datasets dedicated to such
    files. Even if you don''t ZFS automatically sizes records as needed. Writing a
    16 KB file should take up only 16 KB of space (plus metadata and redundancy space),
    not waste an entire 128 KB record.


    Interactions between block size and RAID-Z mean that the server''s disks can suddenly
    fill up, though they have only 25 percent of the data you''d expect them to hold.


    Understanding why requires diving deeper into how ZFS allocates blocks.'
  merge: -1
  pgno: 170
- img_proc: true
  md: '# ZFS Stripe Allocation


    Stripes are made up of sectors on the physical disk (or other provider, such as
    a GELI). If your disk has 4 KB sectors, allocating 128 KB requires 32 physical
    sectors.


    Zpools store all parity information in disk sectors, or blocks. Each level of
    parity requires a block for each stripe. A RAID-Z3 pool needs three blocks for
    parity information for each chunk of disk allocated.


    RAID-Z pools always allocate blocks in multiples of the parity level plus one.
    That is, RAID-Z1 allocates two blocks at a time, RAID-Z2 allocates three blocks
    at a time, and RAID-Z3 allocates four at a time. This helps ZFS prevent fragmentation
    and reduces the risk of wasting space. If a stripe doesn''t need that space, ZFS
    pads it out to fill the entire allocation. For usual stripe sizes, an extra sector
    or two per file doesn''t matter. RAID-Z allocates in consistent-sized blocks so
    when a block is freed, it can be easily reused.


    Consider 8 KB of space on a RAID-Z2. While 8 KB requires only four sectors, RAID-Z2
    allocates only in multiples of three, so it gets six blocks. You erase that file,
    and allocate for a 4 KB file in the same sectors. If RAID-Z didn''t pad to multiples
    of N+1, you''d get a single unused disk block between the 4 KB file and the next
    file. This lone block, an orphaned sector, could never be used.


    Write and delete a bunch of files of different sizes, and pretty your disk has
    a whole bunch of free space—but it''s all in unusable one-block chunks. Your disk
    would be paralyzed.


    Each file also needs metadata to attach it to the ZFS tree, giving the blocks
    containing the file, their hashes, and such. Each such metadata block contains
    the information on many files, and can be ignored for this discussion.


    This seems straightforward and unsworryome, but let''s see how these facts interact
    with filesystems using 4 KB and 512-byte sectors. In all of these examples, we''re
    writing a single 8 KB block, either for a zvol or a database.


    # Mirrors and Stripes


    Mirrors and stripes need blocks of metadata to attach them to the ZFS tree, but
    they don''t require any additional redundancy blocks. Our 8 KB file uses two 4
    KB or 16 512-byte disk sectors.'
