  md: '# Chapter 3: Sharing Datasets


    OpenZFS integrates sharing of datasets over Server Message Block (SMB), Network
    File System (NFS), and Internet Small Computer System Interface (iSCSI). FreeBSD
    bundles support for only NFS and iSCSI, however. This chapter takes you through
    FreeBSD’s iSCSI and NFS implementations and how they relate to ZFS, plus a few
    notes on using SMB with ZFS.'
  merge: -1
  pgno: 51
- img_proc: true
  md: '# SMB


    You can share ZFS datasets over SMB using a program like Samba (https://www.samba.org).
    It works exactly like Samba on any other filesystem. ZFS imposes literally zero
    restrictions or requirements on Samba, although you probably to set casesensitivity
    to mixed on datasets shared with Windows clients via SMB.


    ZFS datasets shared via Samba can seem weird to SMB clients, however. As a pool
    fills up, clients see the size of the dataset shrink. We discuss this in detail
    in FreeBSD Mastery: ZFS, but it''s worth repeating here: if you monitor free space
    via SMB, you''ll get terribly odd results. FreeNAS includes special support to
    show space utilization to Windows users correctly.


    You can leverage Samba with ZFS to replicate many features found on Windows servers.
    For example, with a bit of work, ZFS snapshots can be accessed through Windows
    Volume Shadow Copy. FreeNAS uses many such tricks to support Windows clients.


    If your main role for ZFS is to support Windows clients with SMB, the authors
    strongly recommend using FreeNAS.'
  merge: -1
  pgno: 52
- img_proc: true
  md: '# iSCSI


    You can share zvols through any iSCSI target software you prefer. FreeBSD 10 and
    newer includes the Cam Target Layer daemon ctld(8), which serves as an iSCSI target.
    The ctld(8) software generally has higher performance than the istgt package used
    in older FreeBSD versions.


    The ZFS administration tools do not integrate with either FreeBSD iSCSI target
    software, however. Manage sharing of zvols within ctld, not with zfs(8). We''ll
    cover configuring a zvol-backed iSCSI target and some performance considerations
    for ZFS-backed iSCSI devices.


    For more detail on iSCSI and how not to use it, check out Lucas’s FreeBSD Mastery:
    Specialty Filesystems.


    # Target Configuration


    An iSCSI target provides SCSI-style storage services over the network. You might
    think of it as an iSCSI server, but a target is subtly different from a server.
    An iSCSI target never initiates any activity on its. All requests must come from
    a client, or initiator.


    Basic iSCSI services require a portal group, a target, and a Logical Unit Number
    or LUN. A portal group is a name given to a specific combination of IP address
    and TCP port. (All IP addresses on this host) is a valid component of a portal
    group.) A target is a specific group of storage devices exported via iSCSI. One
    portal group can have any number of targets. A LUN is a single device within a
    target.


    Here’s a snippet of /etc/ctld.conf that defines a single portal group.


    ```

    portal-group0 {

    discovery-auth-group no-authentication

    listen 0.0.0.0

    listen [::]

    }

    ```


    The portal group is named group0. While we can (and should) configure authentication
    for a production iSCSI target, we don’t need authentication to get started. This
    portal group is available on IPv4 and IPv6 addresses on the machine.


    Next we define a target for this portal group. This target contains one LUN.


    ```

    target iqn.2013-11.org.mwlucas:target0 {

    auth-group no-authentication

    portal-group group0

    lun {

    ```'
  merge: -1
  pgno: 53
- img_proc: true
  md: '```

    path /dev/zvol/vm/db1

    size 1T

    }

    }

    ```


    Names for an iSCSI target are based on the domain name of the organization providing
    the target. Theoretically, you can name your iSCSI targets almost any way you
    please, but some initiator software attempts to use the name to set optimizations.
    It''s best to copy target names from your commercial SAN provider.


    The naming scheme for iSCSI devices always starts with the string iqn. You then
    have the year and month the domain name was registered, followed by the domain
    name in reverse. Here, mwluccas.org was registered in November of 2013, so the
    target name starts with iqn.2013-11.org.mwluccas. We then have a colon and the
    name of this specific target.


    Like our portal group, this target does not require authentication. The portal-group
    keyword ties us to the group0 portal group created earlier.


    This target has a single LUN, number 0. We give the path to the file or device
    node and the size of the target. Note the device node we use here, /dev/zvol/vm/db1.
    While a zvol might have multiple device nodes, always access the device node for
    iSCSI exported-zvols under /dev/zvol. It''s best to create such zvols with a volmode
    of dev, so that the server''s GEOM layer doesn''t taste and preconfigure the zvol.


    Once /etc/ctld1.conf exists, start ctld(8).


    ```

    # service ctld start

    ```


    Status and error messages appear in /var/log/messages.


    If ctld(8) doesn''t fit your needs, use any target software you prefer. Use the
    zvol''s device node to offer it to your initiator.'
