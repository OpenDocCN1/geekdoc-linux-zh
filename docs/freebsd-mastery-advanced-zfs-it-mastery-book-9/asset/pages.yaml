  md: 'initialize your database until you''ve created the needed datasets


    PostgreSQL defaults to using 8 KB storage blocks for everything. If you change
    PostgreSQL’s block size, you must change the dataset size to match.


    On a default FreeBSD install, PostgreSQL goes in /usr/local/postgresql/data. For
    a big install, you probably have a separate pool for that data. Here I''m using
    the pool pgsql for PostgreSQL.


    ```

    # zfs create mountpoint=/usr/local/postgresql pgsql

    # zfs create pgsql/data

    ```


    Now we have a chicken-and-egg problem. PostgreSQL’s database initialization routine
    expects to create its own directory tree, but we want particular subdirectories
    to have their own datasets. The easiest way to do this is to let PostgreSQL initialize,
    and then create datasets and move the files.


    ```

    # /usr/local/etc/rc.d/initdb

    ```


    The initialization routine creates databases, views, schemas, configuration files,
    and all the other components of a high-end database. Now you can create datasets
    for the special parts.


    PostgreSQL stores databases in /usr/local/postgresql/data/base. The Write Ahead
    Log, WAL, lives in /usr/local/postgresql/data/pg_xlog. Move both of these out
    of the way.


    ```

    # cd /usr/local/postgresql/

    # mv base base-old

    # mv pg_xlog pg_xlog-old

    ```


    Both of these use an 8 KB block size, and you would want to snapshot them separately
    to create a dataset for each. With MySQL, tell the ARC to cache only the metadata.
    Also tell these to bypass over latency with the logbias property.


    ```

    # zfs create recordsize=8k -o redundant_metadata=most -o primarycache=metadata
    logbias=throughput

    pgsql/data/pg_xlog

    # zfs create recordsize=8k -o redundant_metadata=most -o primarycache=metadata
    logbias=throughput

    pgsql/base

    ```


    Copy the contents of the original directories into the new datasets.


    ```

    # cp -Rp base-old/*

    # cp -Rp pg_xlog-old/* pg_xlog

    ```


    You can now start PostgreSQL.'
