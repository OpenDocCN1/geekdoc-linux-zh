  md: '# Chapter 7: Caches


    Like any other filesystem, ZFS uses in-memory caches to enhance performance. Unlike
    most other filesystems, though, the sysadmin can tweak these caches to adjust
    system behavior. ZFS caches a list of system pools in the `zpool.cache` file.
    It can use cache devices for reading and writing. The most visible cache, though,
    is ZFS’s Adaptive Replacement Cache.'
  merge: -1
  pgno: 122
- img_proc: true
  md: '# Adaptive Replacement Cache


    Calling data from memory is much faster than accessing files from disk. Unix-like
    operating systems normally retain copies of the most recently accessed files in
    an in-memory buffer cache. ZFS uses a more sophisticated and more effective type
    of cache, the Adaptive Replacement Cache, or ARC. Understanding the ARC starts
    with understanding the buffer cache.


    # Traditional Buffer Cache


    The buffer cache chooses data to cache based on the Least Recently Used, or LRU,
    algorithm. The LRU is a list, stored by the last time a chunk of data was accessed.
    Whenever an object is used, it moves to the top of the cache. When the cache fills
    up, the system drops items from the bottom of the list until there''s room to
    insert new items at the top of the list.


    Buffer caches work well enough to provide performance gains, but in certain situations
    the LRU method causes undesirable behavior. Consider a nightly backup. The backup
    program scans the entire hard drive, looking for files modified since the last
    backup. Running this scan adds each file on the system to the top of the list,
    letting files that were just scanned off the bottom. By the end of the backup,
    the buffer cache is full of data that nobody cares about. Meanwhile, the mission-critical
    database has been shoved entirely to disk. This is called cache thrashing.


    The ARC avoids these problems.


    # ARC Design


    The ARC also caches files that have been recently read from disk. Instead of a
    single list, the ARC has two pairs of lists. One is the Most Recently Used, or
    MRU, tracking accessed filesystem blocks like the buffer cache. The second is
    the Most Frequently Used (MFU), tracking filesystem blocks that get used regularly.


    The addition of the MFU list reduces the impact of cache-thrashing processes like
    the hypothetical backup job. While scanning every file on the system purges the
    MRU list, it won’t affect the MFU list. Scanning a block, for backup purposes,
    is not “frequent.” The most frequently used files remain cached in memory. Running
    your backup still disks I/O, reducing write performance, but the system serves
    the most popular files from the copy cached memory.


    Each list is paired with a ghost list, which contains the information about blocks
    that'
  merge: -1
  pgno: 123
- img_proc: true
  md: 'have been evicted from the list. When the MRU or MFU lists fill up, the blocks
    at the bottom of the list fall off. By tracking these blocks dropped from the
    caches, the ARC can prevent a block from constantly cycling in and out of the
    cache. The ARC can also decide if a block is now being used frequently enough
    to warrant entry onto the MFU list.


    In almost all cases, the ARC is self-adjusting and a sysadmin''s manual tuning
    can only impair performance. It''s possible that your particular application might
    need special handling. Understand how the ARC behaves before you start fiddling
    with it, however.


    # ARC Memory Use


    The ARC is designed to be both greedy and generous. If the system has free memory,
    and the ARC thinks it might possibly benefit from it, the ARC claims the memory.
    Every time the system reads something from disk, the ARC caches the file in memory
    until the system is using all of its memory.


    FreeBSD reserves 1 GB of RAM for the kernel and application programs. All the
    rest of the system memory is fair game for the ARC. On a long-running system with
    a lot of storage and not a lot of memory, it''s not surprising to see the ARC
    consume a majority of the system memory.


    The ARC has a very low priority for memory requests, however. If an application
    requests memory, but the system doesn''t have free memory, the kernel shrinks
    the ARC to give the application its requested memory. The process of returning
    memory from the ARC to the system free is not instantaneous; it can take a few
    seconds.


    So: if the memory is free, the ARC will use it. If something needs that memory,
    the ARC gives it back. Modern servers have a lot of memory. They might well use
    it for something. The old saying “Free RAM is wasted” still holds true.


    The easiest way to check the size of the ARC is through top(1). Here''s a slice
    of top output from sampler with 32 GB of RAM and 20 TB of disk.


    ```

    Mem: 168M Active, 116M In, 24G Wired, 1168K Cache, 449M Buf, 7052M Free

    ARC: 23G Total, 15G MFU, 7398M MRU, 18K Anon, 412M Header, 88M Other

    ```


    The Mem line appears in top output on almost all Unix-like systems, and offers
    details how much memory the system is using for various types of tasks. While
