  md: '# Automating Replication


    Everybody wants backups, but backups that must be manually run are not backups
    because they won''t happen. Sure, you''ll do them once or twice, but one day the
    coffee pot will break and you''ll barely be able to remember where you left your
    spleen. Reliable backups demand automation and testing. Testing is always your
    problem, but for automation we have zxfer.


    Zxfer(8) examines select local and remote datasets, determines which snapshots
    must be replicated to synchronize the two sets of data, and sends the datasets.
    It can also remove snapshots on the remote side once they''re removed from the
    local pool.


    FreeBSD does not include zxfer by default, but you can easily install it with
    pkg. As zxfer can work in both push and pull modes, you only need to install it
    on one of the systems. For our demonstration, we will install it on all nodes.


    ```

    # pkg install zxfer

    ```


    The zxfer command does not currently support either bookmarks or resumable replication.
    It also doesn''t set up replication user accounts. You must configure those accounts,
    create SSH keys, and set permissions exactly as you would for normal replication.


    # Using zxfer


    All of our replication examples have used push mode; the host with the current
    datasets pushes them to a replication target. We''ll start with using zxfer similarly.
    Enable mode with -t and the login for the remote host.


    Zxfer requires that you declare if you want to replicate a single dataset, or
    the dataset and all its children. The -R flag enables recursion, while -N indicates
    a single dataset and its snapshots. For backups, recursive mode is almost always
    correct.


    You might also add -v, for verbose mode.


    ```

    $ zxfer -v -T user@host -R localhost remotep

    ```


    If the account is the same on both sides, you can skip identifying the user their
    own cannot be combined with arguments that don''t require that. You can use -v
    -T user@host, but -VT user@host makes zxfer complain bitterly.


    One thing to remember is that arguments that take an argument of zxfer is a shell
    script, it uses getopt(1) to handle command-line arguments, rather than the fancy
    option handling available in more complex'
  merge: -1
  pgno: 84
- img_proc: true
  md: 'Here we replicate the zroot/somedata dataset to use the pool remotepool/backups
    on the remote.


    ```

    local$zxfer -T replicator@remote -R mypool/somedata remotepool/backups

    ```


    If you add the -v for verbose mode, you''ll see zxfer transferring each snapshot.


    +   - Sending zroot/somedata@snappycomeback to remotepool/backups/somedata.

    - Sending zroot/somedata@reply to remotepool/backups/somedata.

    - (incremental to zroot/somedata@snappycomeback.).

    - Sending zroot/somedata@more to remotepool/backups/somedata.

    - (incremental to zroot/somedata@reply).


    Once zfs exits, the remote host has all the snapshots.


    ```

    remote$ zfs list -t all -r remotepool/backups

    NAME USED AVAIL REFER MOUNTPOINT

    remotepool/backups/somedata 10.1M 15.0G 10.1M /remotepool/ba

    remotepool/backups/somedata@snappycomeback 8K 10.1M

    remotepool/backups/somedata@reply 8K 10.1M

    remotepool/backups/somedata@more 8K 10.1M

    ```


    Further replication of these snapshots can run either in push mode or in pull
    mode. Lets your try mode next.


    # Zxfer Pull Mode


    In pull mode, zxfer logs into the remote machine via SSH and runs zfs send to
    transfer snapshots back to the host running zxfer. Use the -o flag with the login
    and host to indicate pool everything. Everything is the same.


    ```

    $ zxfer -O @user@host -R localpath remotepath

    ```


    Now create an additional snapshot on the source pool


    ```

    local$zfs snapshot pool/somedata@new

    ```


    On the destination machine, run zxfer to pull the snapshots over. Here we''re
    adding -v to show more of what really happens


    ```

    remote#zxfer -v -O replicator@local -R zroot/somedata remotepool/back

    ```


    +   - Sending mypool/somedata@new to zroot/backups/somedata.

    - (incremental to zroot/somedata@more).


    The mounted dataset is updated with the new snapshot.


    # Rotating Snapshots


    If you keep sending snapshots, eventually your remote pool will fill up. You probably'
  merge: -1
  pgno: 85
- img_proc: true
  md: 'want to destroy remote snapshots that no longer exist on the source machine.
    Use -d to accomplish this. Start by removing an old snapshot.


    ```

    local# zfs destroy zroot/somedata@reply

    ```


    Use the -d flag to prune any deleted snapshots from the destination:


    ```

    local$ zferfer -vd -T remote -R zroot/somedatemepool/backup

    ```


    In verbose mode, zxfer displays each dataset as well as those it creates.


    Destroying snapshot remotepool/somedata@reply.


    You can watch as hastily-typed incorrect command destroys your beloved data.


    # Keeping Old Snapshots


    A common snapshot regimen calls for making snapshots every 15 minutes, and then
    every hour, day, week, and month. (We discuss such rotation scheme in FreeBSD
    Mastery: ZFS.) The host discards 15-minute snapshots after a few hours, hourly
    snapshots after a couple of days, and so on. You want those 15-minute snapshots
    discarded on the remote host, but you might want the remote host to retain some
    snapshots after the source destroys them. Many of us want to keep weekly or monthly
    snapshots as long-term backups.


    The -g flag lets you protect the oldest backups with an argument of a number of
    days. For example, -g 375 zxfer not to delete snapshots that are 375 days old
    or older.


    Suppose you want to keep all the monthly snapshots, but automatically remove any
    other snapshots that get removed from the source. The source deletes monthly snapshots
    after three months, weekly snapshots after six weeks. Six weeks is 42 days. Add
    an extra week for system anomalies, giving a -g of 50 would tell zxfer not to
    delete any 50 days or older.


    ```

    local$ zxfer -vd -g 50 -T remote -R zroot/somedatemepool/backup

    ```


    Eventually, your backup pool will fill up. You must go in and clean out the snapshots
    that are so old they''re no longer useful. It''s no different than cleaning out
    the corporate tape closet.


    # Properties and Disaster Recovery


    You''ll often want to replicate complex properties, like sharenfs and any of the
    quotas. The p argument tells zxfer to set the properties in the destination to
    match the source.


    In some cases you want to know what the properties are, but you don''t want to
    restore'
  merge: -1
  pgno: 86
- img_proc: true
  md: 'them immediately upon replication. The zxfer command can copy dataset properties
    to a text file, letting you restore from that file later.


    The -k flag tells zxfer to create the properties text file, in the root directory
    of the replica. The file is named .zxfer_backup_info, followed by a period and
    the pool name. If you''re replicating an entire host web5''s zroot pool to the
    remotepool/web5 on the backup host, the properties backup file will be in remotepool/web5/.zxfer_backup_info.zroot.


    Use the -e flag to restore the dataset and pool properties from this file.


    A common configuration is for a host to have a pool set aside to accept backups,
    and then a pool set for disaster recovery. If the source machine dies, you can
    use zxfer locally to copy the latest backup to the disaster-recovery pool. You''ll
    find examples of exactly this in the zxfer(8) manual page, but here''s a common
    example, including restoring properties. I''m restoring backup of the host web5,
    into a pool also called web5.


    ```

    # zxfer -defP -R remotepool/web5/ web5

    ```


    Boot from the new web5 pool, and you have restored service!


    # Zxfer Options


    The zxfer program has a bunch of options to copy with annoying situations.


    If you have a complicated SSH setup, you might need to set some client options
    in the zxfer user''s $HOME/.ssh/config. Alternatively, you could add these options
    in single -o -t.


    The -o and -T flags can also be used to inject SSH options, as well as command-line
    arguments. The additional parameters before the user and host get prefix the zfs(8)
    command. (You''re better served configuring ZFS dataset permissions using sudo,
    however.)


    ```

    -O ''port=1022 -i /path/to/key/file replication@hotspot''

    ```


    The -f flag tells zfs receive to roll back all datasets that replication. If you''ve
    changed the replicated dataset, -f blows away those changes.


    You can have zxfer take a snapshot automatically before running. It won''t remove
    snapshots, so it''s not a proper snapshot rotation regime. It works for immediate
    backups, however, leaving the problem of cleaning up for another day. Add the
    -s to have the zxfer snapshots of every replicated dataset.'
