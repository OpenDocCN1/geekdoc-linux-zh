  md: "# Delegation Inheritance\n\nZFS delegated permissions are automatically inherited.\
    \ If you give a user privileges zroot/db, she automatically gets those same privileges\
    \ over all children of zroot/db. The zfs allow subcommand can also restrict permission\
    \ inheritance. Inherited permissions can be allow local, or apply to descendants.\n\
    \nLocal permissions apply only to the specified dataset. We might allow lucas\
    \ permissions to snapshot zroot/usr/home/lucas, but not snapshot the child datasets.\
    \ He'll have to manage his blackmail material the old-fashioned way. Set privileges\
    \ to be local only with the -1 flag\n\n# zfs allow -l lucas clone,destroy,mount,rollback,snapshot\
    \ zroot/home/lucas\n\nThe permissions now show up as local only, rather than local\
    \ and descendant.\n\n```\n# zfs allow zroot/home/lucas\n----\nPermissions on zroot/home/lucas\n\
    Local permissions:\n  user lucas clone, destroy, mount, rollback, snapshot\n```\n\
    \nYou can also apply permissions only to child datasets, and not the dataset in\
    \ the command. The -d flag tells zfs allow that the permission applies only to\
    \ the descendant datasets, not the parent on which the permissions were created.\
    \ This can be used to allow users to destroy child datasets, but not the parent.\n\
    \nHere I want to allow lucas to destroy the snapshots he created, but not destroy\
    \ his entire home directory. I use -d to specify that these permissions apply\
    \ only to his home directory's child datasets, and not the home directory itself.\
    \ I leave permissions for the snapshot and rollback commands in place on his home\
    \ directory, so he can rescue himself if he doesn't screw up too badly.\n\n```\n\
    # zfs allow -d lucas destroy, mount mypool/usr/home/lucas\n# zfs allow mypool/usr/home/lucas\n\
    ----\nPermissions on mypool/usr/home/lucas\nDescendant permissions:\n  user lucas\
    \ destroy, mount\nLocal-Descendant permissions:\n  user lucas destroy, rollback,\
    \ snapshot\n```\n\nOnce again, impersonate Lucas and test the permissions.\n\n\
    ```\n$ zfs destroy -v mypool/usr/home/lucas/desc\nwill destroy mypool/usr/home/lucas/desc\n\
    $ zfs destroy -v mypool/usr/home/lucas\ncannot unmount '/home/lucas': Operation\
    \ not permitted\n```"
  merge: -1
  pgno: 38
- img_proc: true
  md: Running zfs destroy on Lucas’ home directory is now a pleasure reserved for
    the sysadmin.
  merge: -1
  pgno: 39
- img_proc: true
  md: "# Create Time Permissions\n\nZFS allows you to create permissions today, for\
    \ datasets that won’t exist until next Tuesday, or some other future time. Create\
    \ time permissions apply to the user who creates a dataset. They’re like a “sticky\
    \ bit” for delegation. Define time permissions with c.\n\nA common desire for\
    \ these kinds of permissions is to give the permissions to everyone, rather than\
    \ specifying every user on the system or defining a group that includes all users.\
    \ Rather than -u or -g and a user or group name, use the -e flag to indicate everyone\
    \ (all users).\n\nUsing create time permissions requires careful control of inheritance.\
    \ You want the create time permissions to apply to child datasets, not the parent.\
    \ The parent dataset should have its own privileges, set with -1.\n\nSuppose we\
    \ have a scratch dataset, usable by everyone. It’s like a /tmp, but with ZFS features.\
    \ We want everyone to be able to create and mount datasets in this space, but\
    \ not have access to trash the dataset as a whole. Those permissions must be restricted\
    \ (via the -1 flag) to allow -e create,mount mypool/scratch and not automatically\
    \ inherited by the new children.\n\n```\n# zfs allow -l -e create,mount mypool/scratch\n\
    ```\n\nNow -ce to specify create time permissions assigned to newly created datasets.\n\
    \n```\n# zfs allow -c snapshot,rollback,destroy mypool/scratch\n```\n\nChecking\
    \ your work will show the create time permissions as permission sets.\n\n```\n\
    # zfs allow mypool/scratch\n---- Permissions on mypool/scratch\nPermission sets:\n\
    \  destroy, rollback, snapshot\nLocal permissions:\n  everyone create, mount\n\
    ```\n\nThe real test is running these commands as a normal user, of course. Let’s\
    \ get lucas to create some datasets under mypool/scratch.\n\n```\n# su lucas\n\
    ```\n\n```\n$ zfs create mypool/scratch/lucas\n```\n\nThat worked. But what privileges\
    \ does he have?\n\n```\n$ zfs allow mypool/scratch/lucas\n---- Permissions on\
    \ mypool/scratch/lucas\nLocal permissions:\n```"
  merge: -1
  pgno: 40
- img_proc: true
  md: "```\nuser lucas destroy,rollback,snapshot\n---- Permissions on myypool/scratch\
    \ --------------------\nPermission sets:\n  destroy,rollback, snapshot\nLocal\
    \ permissions:\n  everyone create,mount\n```\n\nNow lucas, and only lucas, can\
    \ create snapshots of and destroy his dataset. Other users can create their own\
