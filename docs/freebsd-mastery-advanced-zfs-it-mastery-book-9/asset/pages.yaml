  md: '# Advanced Sending Options


    A sender can alter how it sends datasets in several ways.


    # Sending Properties


    To send dataset properties as well as the actual data, add the -p flag. When the
    properties of the received dataset differ from those already on the dataset, zfs
    receive attempts to change the properties to match those. That is, if you''re
    replicating properties from a dataset that uses l4 compression to a dataset that
    already uses l4, zfs receive does nothing with that property. If the sender uses
    gzip-9 compression, though, the receiver changes to match the original.


    The user receiving the dataset must have the permissions to set the properties
    you want replicated. If the user has permissions to replicate but not all of the
    properties, the permissible properties get set and the disallowed properties are
    rejected.


    Suppose source dataset has dedup set to on and compression Set to gzip-9. The
    receiving dataset has dedup set to off and compression set to l4. We want the
    replicating dataset to use the same compression, but not the dedup setting. We
    permit our replication user to change compression.


    ```

    # zfs allow -u replicator zroot/backup

    ```


    When we send the dataset, we''ll get an error.


    cannot receive compression dedup on remotool/backup: permission denied


    That''s fine—we don''t want the dedup property set on the replica. The compression
    property is replicated as desired, though.


    Why would we replicate properties, rather than just set them on the destination?
    Manual configuration might be fine for simple properties like compression and
    dedup, but not so suitable for complicated properties like sharens or any of the
    quotas.


    # Deduplicated Data Stream


    Is your data deduplicated? Is it suitable for deduplication? ZFS lets you deduplicate
    the zfs data stream. With -d, each unique block is sent only once. It doesn''t
    change what the recipient writes to disk, but only affects the data stream.


    Deduplicated data streams use a different set of deduplication memory than used
    by on-disk deduplication. If your data can be effectively deduplicated, but that'
  merge: -1
  pgno: 76
- img_proc: true
  md: 'deduplication uses many gigabytes of RAM, both the sending and receiving hosts
    need a similar amount of memory to deduplicate the data stream. Don''t lightly
    deduplicate in zfs send!


    # Debugging and Testing


    A zfs send supports a couple of options that can help with debugging, testing,
    and monitoring.


    The -v option makes zfs send verbose. It prints information about the data to
    be sent and adds regular status updates.


    The -p flag prints information about the send stream right when the stream starts
    flowing. The manual describes this information as “machine-readable.” The information
    is readable by humans, but it''s not nicely tabulated. It''s perfect for feeding
    to your scripts, however.


    The -n flag prevents zfs send from actually sending any data. Instead, when combined
    with either -v or -p, it gives statistics on what zfs send would do if it actually
    ran.


    # Large and Small Blocks


    Newer versions of ZFS can support disk blocks larger than 128 KB, with the large_blocks
    zpool(8) feature. The -L flag lets zfs send include large blocks rather than breaking
    them up into small blocks. The recipient pool must also support large blocks.


    For hosts with really small blocks, -e shrinks the size of the data stream by
    using the embedded_data feature. The destination pool must also support the embedded_data
    feature flag.'
  merge: -1
  pgno: 77
- img_proc: true
  md: '# Advanced Receiving Options


    The receiver can adjust how it stores the incoming ZFS stream, through arguments
    to `zfs receive`.


    # Path and Mount Management


    A received ZFS stream includes the pool and dataset path of the origin. You can
    either retain this path or strip it out.


    By adding the `-d` flag, you `zfs receive` to use the source''s full path (except
    for the pool name) as the path to the destination dataset, rather than requiring
    the sysadmin to specify the destination dataset. Earlier, we replicated `zroot:/usr/`
    to `remotepool/backup/usrhome`. By using `-d` here, we `zfs receive` to use the
    source path on the destination.


    ```

    $ zfs send zroot/home/monday | ssh hotspot zfs receive -d remotepool/backup

    ```


    The receiver creates `remotepool/backup/usr/home` and sticks the `@monday` snapshot
    there. This function is very useful when replicating many layers of datasets.


    Alternatively, you can strip most of the path information. By adding the `-e`
    flag, you instruct `zfs receive` to use the last part of the path to name this
    dataset. Here we run the same backup, but strip out most of the path.


    ```

    $ zfs send zroot/usr/home@monday | ssh zfs2 zfs receive -e remotepool/backup

    ```


    The `zfs receive` command looks at the path `zroot:/usr/home` and discards everything
    the last chunk, or `home`. The received data goes into `remotepool/backup/home`.


    Finally, the `-u` option tells `zfs receive` not to mount received snapshots.
    The data''s there for mounting if the sysadmin desires, but mounting the dataset
    might lead to changing the data.


    # Roll Back Changes


    If someone has altered a received dataset, attempts to incrementally add a new
    snapshot to that replica will fail. Datasets of received snapshots must be pristine
    for `zfs receive` to accept incremental or differential updates.


    The `-F` flag tells `zfs receive` to roll back any changes that prevent accepting
    this snapshot.


    # Debugging and Testing'
  merge: -1
  pgno: 78
