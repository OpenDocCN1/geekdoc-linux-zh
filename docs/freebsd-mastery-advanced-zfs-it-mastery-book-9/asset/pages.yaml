  md: '# Chapter 1: Boot Environments


    One of the most tediously terrifying system administration tasks is a system upgrade.
    We all know that the new kernel might not boot the system, but that''s the least
    of your problems. What if a critical program requires an old version of a shared
    library? Maybe that new terminal mode is subtly incompatible with your software.
    Or perhaps your mission-critical software chokes on the new linker.


    Things go wrong. Sometimes problems aren''t apparent at first but only snarl at
    you after a week or two, when falling back comes even more difficult. No matter
    what precautions you take or how much you are testing yourself, any upgrade can
    go bad.


    We''ve developed all sorts of tools to work around bad upgrades. Boot loaders
    help you quickly recover from bad kernels. Backups help you slowly recover from
    bad userlands. But none of these help you understand exactly what went wrong and
    duplicate the problem.


    Unless you''re running ZFS, that is.


    By combining snapshots and clones, you can create bootable backups of your operating
    system''s kernel and userland. You want to upgrade? Clone your operating system
    datasets and go ahead. If the upgrade goes badly, boot the clone instead. This
    restores service while you use `zfs diff` to determine which files changed and
    which of them went wrong.


    You can do all that by hand, but FreeBSD bundles this functionality into boot
    environments. With boot environment management tools, you can easily create, destroy,
    and deploy boot environments. Every time you''re about to upgrade, create a new
    boot environment. If the upgrade goes bad, either immediately or even weeks later,
    you can revert to the old operating system version. The failed version stays around,
    so you can deploy it to another machine and study exactly what went wrong.


    Using boot environments well requires that you understand how you''ve installed
    FreeBSD, however.'
  merge: -1
  pgno: 19
- img_proc: true
  md: '# Installation Datasets


    On FreeBSD 10.1 and newer, ZFS-based install creates datasets designed specifically
    for boot environments. These might seem counterintuitive at first glance. Take
    a look at a few of the datasets on a default install.


    ```

    # zfs list

    NAME USED AVAIL REFER MOUNTPOINT

    zroot/var 703K 1886 128K /var

    zroot/var/crash 128K 1886 128K /var/crash

    zroot/var/log 192K 1886 192K /var/log

    zroot/var/mail 128K 1886 128K /var/mail

    zroot/var/tmp 128K 1886 128K /var/tmp

    ```


    We have datasets for certain subdirectories of /var/: /var/crash, /var/log, /var/mail,
    and /var/tmp. But what about all of the other directories /var? The /var/db directory
    contains critical system information, like the package database. Surely that is
    at least as important as /var/tmp?


    The default install doesn''t create datasets based on the importance of the data
    in the directory. It creates datasets to separate data.


    Now check zfs mount var and see how these datasets are mounted.


    ```

    # zfs mount

    zroot/ROOT/default /

    n...

    zroot/var/crash /var/crash

    zroot/var/log /var/log

    zroot/var/mail /var/mail

    zroot/var/tmp /var/tmp

    ```


    Notice the missing dataset: /var. That dataset exists, but isn''t mounted (the
    canmount property is set to no). Files directly in /var actually go in the dataset
    mounted as root, zroot/ROOT/default. Files under /var that have their own dataset,
    such as /var/log/messages, in a separate dataset. Files that go /var but don''t
    have their own dataset, such as /var/db, go into the root dataset.


    The location of data is critical to boot environments. Data likely to be affected
    by a boot environment goes on the root dataset. Data that you won''t want to manage
    as part of the boot environment gets its own dataset.


    Consider /var/db. This contains critical information like the package database,
    the locate database, freebsd-update(8) records, and so on. All of this is tightly
    tied to the operating'
  merge: -1
  pgno: 20
- img_proc: true
  md: 'system version. Upgrading your host to a new operating system version requires
    using freebsd-update, and probably means updating your add-on software while you''re
    at it. If you must revert an upgrade, you want those files reverted as well.


    Compare that to /var/log. If I revert an upgrade, I specifically don''t want my
    log files rolled back as. Logs cover more than just the operating system. Similarly,
    home directories and the mail spool in /var/mail had better not get rolled back
    with the operating system.¹


    FreeBSD upgrades affect specific directories. The core programs lurk in /bin,
    /sbin, /usr/bin, and /usr/sbin, with libraries in /lib and /usr/lib. Thanks to
    the non-mounting /usr dataset, these directories are now on your root dataset.
    Packages install under /usr/local, but it''s also part of the root dataset. Similarly,
    thanks to the non-mounting /var, the /var/db directory with all that critical
    system information is also part of the root dataset.


    Files that are not part of the core system, such as logs, user home directories,
    and so on, have their own datasets.


    This segregates the core system and official packages from the rest of the host,
    letting you manage them as a single entity. The FreeBSD developers are working
    on packaging the base system as well as add-on packages, which might necessitate
    revisiting the system discussed here.'
  merge: -1
