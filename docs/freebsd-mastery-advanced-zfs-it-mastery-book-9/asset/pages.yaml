- img_proc: true
  md: '# Chapter 8: Performance


    We all like our storage to be fast, featureful, and infinite. We haven’t quite
    hit capacity yet, but on good hardware ZFS’ features can be pretty fast. Even
    the best hardware can turn slow for no apparent reason, however. Knowing how to
    use the diagnostic tools can help you understand a system’s performance. Maybe
    you can''t fix it with the equipment on hand, but at least you’ll understand what’s
    going wrong and maybe shift some of the load elsewhere.


    FreeBSD includes tools to check both generic disk and filesystem performance as
    well as ZFS-specific tools. You can get detailed information through sysctl(8),
    vmstat(8), and related commands, but we strongly recommend installing the add-on
    package zfs-stats to conveniently parse and process that information.


    Once you understand how to assess system performance, we’ll discuss several ZFS
    performance features and when they might be useful.


    Before diving into assessing ZFS performance, let’s talk a bit about performance
    in general.'
  merge: -1
  pgno: 142
- img_proc: true
  md: '# What Is Performance?


    Performance might be described as “how well a system manages a workload.” Every
    system has a slightly different workload, so performance varies even between identical
    identical hardware performing seemingly identical tasks. Even if you try very
    hard to replicate hardware, software installations, and workload on another system,
    somebody can find a difference between them. That’s part of what makes benchmarking
    annoying.


    A system administrator mostly cares about improving performance. This means identifying
    and removing bottlenecks. The average computer has four basic resources: storage
    input/output, network bandwidth, memory, and CPU. If you pile work on a system
    until it can’t handle any more, what you’re really doing is discovering which
    of these resources you saturate first. That resource is your bottleneck.


    Increasing performance requires identifying and shifting bottlenecks. And you’ll
    always hit another bottleneck. If your CPU is the current bottleneck, and you
    add more processing power, the computer speeds up until it saturates disk I/O
    or memory of the network. You’ve improved performance, yes ... up to the limit
    permitted by the new


    And a different workload probably has a completely different bottleneck.


    A lot of systems administrations requires enhancing which of these resources for
    another. It’s yours Lucas always refers to “system tuning” as “rearranging bottlenecks.”¹


    Consider ZFS compression for a moment. ZFS compression reduces the amount of data
    the system writes to, from the disk. Compressing and decompressing blocks consumes
    processor time. Compression exchanges storage I/O for CPU time. Most computers
    have far more processor oomp than can possibly use, however. The laptop I’m writing
    on has a four-core processor, but a single middling-speed disk with limited I/O.
    Enabling compression is an obvious win on this system. On a system with more disk
    I/O than processor power, you might make a different decision.


    The more complicated your storage is, the more you can adjust and shift bottlenecks.
    Your server has six disk controllers, but all the I/O is going to one of them?
    Rearrange your datasets to split the load across multiple controllers. Maybe a
    particular disk is saturated? Split up that load. Perhaps your pools are saturated
    with reads, or both. Add a properly configured SLOG and an L2ARC to help.


    Before you make any changes, though, investigate where the bottleneck is. Purchasing'
  merge: -1
  pgno: 143
- img_proc: true
  md: 'a faster disk system won’t help if your system’s particular workload is limited
    by CPU or memory. Adding a fast SSD for a ZIL won’t improve performance if disk
    reads throttle the server’s performance.


    One of many perennial questions in systems administration is: what''s eating up
    my disk bandwidth? A ZFS pool scrub can impact other operations, but in routine
    use, ZFS doesn''t create any new answers to this question. Use top -m io to identify
    the processes using the disk most intensively. Should the most active processes
    be busy?


    If your performance doesn''t match your expectations, remember that your storage
    system performs only as well as its slowest component. You can have a really fast
    SAS controller and top-of-the-line, high-speed hard drives but get terrible performance
    because of the cruddy drive cables. A SATA port multiplier slashes performance
    proportionally to the number of drives attached. Just because you can plug certain
    hardware components together, doesn’t mean you should.'
