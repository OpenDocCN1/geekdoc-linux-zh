- img_proc: true
  md: '# The Worst of Both Worlds: Bittorrent


    Bittorrent combines the worst parts of large files and the worst parts of small
    files all in one convenient package. Bittorrent''s out-of-order write pattern
    can cause a great deal of dataset fragmentation. Plus, Bittorrent''s 16 KB block
    size can lead to write amplification if the the recordsize of the dataset isn''t
    16 KB.


    The best solution to both of these issues is to actually have two datasets. The
    dataset where the files are stored during downloading uses the smaller record
    size.


    ```

    # zfs create -o recordsize=16k -o redundant_metadata=most -o compress=off mypool/torrents/in-progress

    ```


    The dataset where you store completed torrents should have a larger block size.
    Moving files from one to the other defragments the files, resulting in improved
    read performance and avoiding pool fragmentation. Most torrent clients support
    using a separate directory for in-progress downloads, so this should not require
    any action on your part aside from creating the two datasets.


    If you download large files, like operating system ISOs, you might also consider
    a recordsize of 1 MB to further increase performance and amortize metadata and
    redundancy.


    ```

    # zfs create -o recordsize=1m mypool/torrents

    ```


    Tell your torrent client about these directories and you''ll be ready to go.'
  merge: -1
  pgno: 180
- img_proc: true
  md: '# Short Stroking


    Regular spinning disks have specific characteristics that can cause uneven performance.
    Reads and writes to the beginning of the disk can be significantly faster (higher
    throughput) than writes later on the disk. The slowest aspect of a regular spinning
    disk is seek time, the time it takes for the drive to physically reposition the
    read/write head the sector you want to read or write. When data is scattered all
    over the disk, this can significantly decrease performance.


    Short Stroking is the process of using only a small subset of a disk’s capacity,
    usually a partition of only the fastest 10–30% of a disk. Now that the head ever
    has to travel over a small portion of the disk’s surface, the average seek time
    will be significantly less. In the future, if more storage space is required,
    the partition can simply be resized and ZFS will grow the pool. Remember that
    running ZFS low on disk space increases fragmentation, which can be much worse
    for performance than a higher average seek time.


    You now have the tools to configure your datasets, pools, and hardware in the
    best possible manner. Now let’s poke at some more obscure corners of ZFS.


    > admins don’t get to choose between the Lady and the Tiger. We get to choose
    between Angry Tiger and Hungry Tiger.'
  merge: -1
