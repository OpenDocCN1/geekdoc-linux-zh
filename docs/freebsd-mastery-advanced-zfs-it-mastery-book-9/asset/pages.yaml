  md: '# ZFS Best Practices


    While you can acquire all needed ZFS knowledge from publicly available documentation,
    won''t give you the ZFS best practices we''ve discussed in earlier books. As with
    many other things in technology, the nice thing about best practices is that there
    are many of them to choose from.


    We''re discussing some of our best practices here. Perhaps these practices are
    better than yours and you''ll gleefully adopt them. Maybe they''ll spark some
    improvements in your existing best practices. Even if your best practices blows
    away, these at least display your biases so you know how we''re approaching the
    issues of storage management.


    # Space Management


    With copy-on-write filesystems, deleting files uses space. Sysadmins accustomed
    to traditional filesystems might find this when they start with ZFS, but don''t
    really internal until the first time they run out of disk and suffer a nasty shock.
    As the pool approaches capacity, ZFS needs more and more space to store additional
    data blocks. Performance degrades. While fragmentation, it becomes more and more
    of an issue as the pool approaches 100% utilization.


    > Recovering from a completely full pool is terribly hard. To prevent all of the
    space from being used, or to at least provide a warning ahead of time, create
    a reservation.


    Ideally, you should create a reservation for 20% of the capacity of your pool.
    You can always lower the reservation to buy time while you work on adding more
    capacity or removing old data. The last thing you want is to unexpectedly run
    out of space. This can give you the soft landing that the Unix File System (UFS)
    offers, where only root can use the last few percent of available disk space.


    On this 1 TB pool, we create a new dataset with 200 GB refreservation.


    ```

    # zfs create -o refreservation=200G mypool/reserved

    ```


    Any time you''re exploring space issues on a ZFS dataset, remember the zfs get
    space command. You''ll see all of the space-related properties in a convenient
    display.


    ```

    # zfs get space zstore/usr

    NAME VALUE SOURCE

    zstore/usr name -zstore/usr

    zstore/usr available 5.00T

    zstore/usr used 367M

    zstore/usr usedbysnapsshots 0

    ```'
  merge: -1
