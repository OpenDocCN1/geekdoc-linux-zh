    # Defining Limits and Safety Belts


    But if Lucas is incompetent, or evil? You gave him access to take his own snapshots,
    and he tries to create a million snapshots “just to see what would happen.” You
    know people like that.


    ZFS has your back when dealing with these difficult users. ZFS provides the snapshot_limit
    and filesystem_limit properties, which allow you to restrict the number of snapshots
    or child filesystems that can be created under a specific dataset. Set these properties
    to one greater than the number of snapshots or datasets the user wants to create.
    That is, if you set snapshot_limit to 10, the user can create nine snapshots.
    The tenth generates an error.


    To contain the evil that is Lucas, limit the number of snapshots he can create
    to two.


    ```

    # zfs set snapshot_limit=3 zroot/usr/home/lucas

    # su lucas

    $ zfs snapshot zroot/usr/home/lucas@three

    $ zfs snapshot zroot/usr/home/lucas@four

    ```


    cannot create snapshot ''zroot/usr/home/lucas'': out of space


    The read-only filesystem_count and snapshot_count properties allow you to quickly
    see how many filesystems or snapshots exist, and compare that number to the limit.


    Delegation and jails are powerful tools for administrative management of storage.
    Now let''s discuss sharing with ZFS.


