  md: '# Dataset Information


    Examining a dataset in detail can also provide a lot of information, and help
    visualize the internals of the filesystem.


    # Dataset Basics


    To see a dataset''s basic internal information, use -d and the dataset name. Here
    we examine a dataset on the media pool used in the previous section.


    # zdb - media/svn/base


    Dataset media/svn/base[ZPL], ID 4778, cr_txg 4820082, 3.82G, 259339 objects


    That did not provide much information. The cr_txg field shows the transaction
    group where this dataset was created, number 4,820,082 of 15,612,202 on this pool.
    It holds 3.82 GB of data, which has 259,339 objects in it. Objects includes files
    and directories, but also metadata, ACLs, and every other type of ZFS can hold.


    # Dataset Detail


    You want more detail? Add a second -d and hang on your hat. You might want to
    run this script(1) or another terminal recording program.


    # zdb - media/svn/base


    Dataset media/svn/base[ZPL], ID 4778, cr_txg 4820082, 3.82G, 259339 objects


    | Object | lvl | iblk | dsize | lsize | %full | type |

    |---|---|---|---|---|---|-|

    | 0 | 7 | 16K | 1K | 417M | 622M | 20.04 | DMU dnode |

    | -1 | 7 | 16K | 1K | 0 | 1K | 100.00 | ZFS user/group used |

    | -2 | 1 | 16K | 0 | 1K | 100.00 | ZFS user/group used |

    | 2 | 1 | 16K | 16K | 16K | 512 | 100.00 | ZFS master node |

    | 9 | 1 | 16K | 16.5K | 16K | 16.5K | 100.00 | ZFS directory |

    | 11 | 3 | 120K | 43.3M | 155M | 82.49 | ZFS plain file |

    | 13 | 1 | 16K | 512 | 8K | 512 | 100.00 | ZFS plain file |


    How long does this go on?...


    | | lvl | iblk | dsize | lsize | %full | type |

    |---|---|---|---|---|---|-|

    | 1294291 | 1 | 16K | 3.50K | 8K | 3.50K | 100.00 | ZFS plain file |

    | 1294324 | 1 | 16K | 4K | 8K | 4K | 100.00 | ZFS plain file |

    | 1294328 | 1 | 16K | 4.50K | 8K | 4.50K | 100.00 | ZFS plain file |


    This dataset has a bunch of files, directories, and related stuff to sysadmins.


    A few of the columns might be interest to sysadmins. The dblk column is the record
    size for each object. The Isize is the logical size of the object, most of us
    think when we say “file size."'
