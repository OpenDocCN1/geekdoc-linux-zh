  md: '# Chapter 0: Introduction


    The Z File System, or ZFS, is a complicated beast, but it is also the most powerful
    tool in a sysadmin’s Batman-esque utility belt. This book tries to demystify some
    of the magic that makes ZFS such a powerhouse, and give you solid, actionable
    intel as you battle your storage dragons.


    ZFS contains over 100 “engineering years” of effort from some of the best minds
    in the industry. While it has competitors, such as B-Tree File System (BTRFS),
    those competitors have a lot of catching up to do. And ZFS races further ahead
    every day.


    This book takes you into some of the more complicated and esoteric parts of managing
    ZFS. If you want to know why a single gigabyte of data fills your 2 GB drive,
    if you want to automatically update your disaster recovery facility, or if you
    just want to boot environments on your laptop, *FreeBSD Mastery: Advanced ZFS*
    is for you.


    Just about everything in this book applies in general to OpenZFS. We use FreeBSD
    as the reference platform, but the mechanics of using OpenZFS don’t change much
    among platforms.'
  merge: -1
