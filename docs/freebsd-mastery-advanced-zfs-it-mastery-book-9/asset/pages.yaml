  md: '# DTrace


    Higher-level tuning of some ZFS features requires using DTrace, a program for
    tracing software behavior and performance.


    Knowledgeusing DTrace with ZFS requires an understanding of the kernel internals.
    This is not a book on either DTrace or kernel internals. Grabbing an existing
    script and running it requires neither.


    We would encourage you to use the output of these DTrace scripts both to solve
    your ZFS problems, and as entry points for choosing which kernel internals. You
    might not need to be a programmer, but a professional sysadmin should develop
    understanding of how the system works.


    Blindly running scripts is exactly the sort of "ocult IT" that Lucas rants and
    rails against. That said, he''s exactly how you blindly run a DTrace script.


    DTrace uses kernel modules for the software probes that watch software behaves:
    dtrace.ko and dtraceall.ko. You can load these automatically at boot in loader.conf.
    If the kernel modules aren''t found, the dtrace(1) program automatically loads
    them the first time you run it.


    You must run dtrace as root.


    Copy your script to a file. Then run dtrace -s, giving the script as an argument.


    Hit CTRL-c to interrupt the script.


    You can download all of the DTrace scripts given in this book from Lucas’ GitHub
    repo, linked from zfsbook.com.


    A FreeBSD sysadmin with an understanding of how the kernel works can solve problems
    more quickly and correctly. For an overview of ZFS’ internals, grab the latest
    edition of The Design and Implementation of the FreeBSD Operating System (Addison-Wesley
    Professional, 2014). Similarly, DTrace is a powerful tool well worth learning
    and understanding. We recommend Gregg’s and Mauro’s book DTrace: Dynamic Tracing
    in Oracle Solaris, Mac OS X, and FreeBSD (Prentice Hall, 2011).'
  merge: -1
