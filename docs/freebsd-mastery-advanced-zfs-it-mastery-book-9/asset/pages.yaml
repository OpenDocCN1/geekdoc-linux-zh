  md: '# Modifying the ARC


    The ZFS ARC manages itself in the overwhelming majority of cases. In most cases
    where the ARC cannot auto-tune itself, performance problems are best solved by
    adding hardware. Sometimes, though, adjusting ZFS’ memory or performance can buy
    you time until you can receive and install new hardware. On rare occasion, adjusting
    the ARC is the proper response for a specific application.


    You can tweak the ARC by setting upper and lower boundaries on how much memory
    it can use, as well as controlling what, when, and where the ARC caches data.


    # Restricting ARC Size


    A default FreeBSD install sets aside 1 GB of RAM for the kernel and operating
    programs, permitting ZFS to absorb the rest in the ARC if that’s what the system
    performance demands. You can change this by reserving a minimum amount of memory
    for the ARC and/or setting a hard limit on how much memory the ARC can take.


    The ARC settings are all given in bytes. Today, we manage memory in gigabytes.
    To set a value for ZFS, multiply the desired number of gigabytes by 1024.


    The ARC surrenders memory readily upon request, freeing memory doesn’t happen
    instantaneously. Releasing memory from the ARC and allocating it to another process
    unquestionably takes longer than allocating memory to that same process. On a
    host with a very large ARC, dumping gigabytes of objects from the cache might
    take a measurable fraction of a second.


    You might decide to limit the amount of memory the ARC can use, freeing system
    memory for applications. Use the boot-tun vfs.zfs.arc_max to set this. By default,
    FreeBSD sets to this total memory 1 GB. We set an upper limit of 20 GB in `/boot/loader.conf`.


    ```

    vfs.zfs.arc_max=2147483648

    ```


    The maximum ARC size is not a hard limit, but rather more of a high-water mark.
    When the ARC hits this size, ZFS begins hurriedly reducing the cache size. The
    least important items get to the ghost queues and dumped. If you’re monitoring
    the ARC size, you might see memory usage wobble around vfs.zfs.arc_max when the
    system experiences memory pressure.


    It’s also possible that an application could use the ARC’s generosity against
    it, and squeeze it out of existence. The default minimum size of the ARC is one-eighth
    of the'
