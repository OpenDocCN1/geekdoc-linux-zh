    multipath system as an example. It has two enclosures: the front one has 24 slots,
    and the rear one 12. The server has two disk controllers.


    The first controller''s first port is plugged into the front enclosure, and gets
    called /dev/ses0. The second port is plugged into the rear enclosure, and becomes
    /dev/ses1.'
