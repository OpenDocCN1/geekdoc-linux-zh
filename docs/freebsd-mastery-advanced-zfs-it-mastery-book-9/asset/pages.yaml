  md: '# Recursive Replication


    ZFS also supports recursive replication, which replicates a dataset and all of
    its children one command. Here''s a sample pool with three datasets.


    | NAME | USED | AVAIL | REFER | MOUNTPOINT |

    |---|---|---|---|--|

    | mypool | 41M | 3.0T | 192K | /mypool |

    | mypool/family | 50.2M | 3.0T | 50.2M | /mypool/family |

    | mypool/home | 150M | 3.0T | 150M | /mypool/home |

    | mypool/work | 200M | 3.0T | 200M | /mypool/work |


    Take a recursive snapshot of the dataset and its children.


    ```

    # zfs snapshot -r mypool@first

    # zfs list -all -r mypool

    NAME USED AVAIL REFER MOUNTPOINT

    mypool 41M 3.0T 192K /mypool

    mypool@first 0 192K

    mypool/family 50.2M 3.0T 50.2M /mypool/family

    mypool/family@first 0 50.2M

    mypool/home 150M 3.0T 150M /mypool/home

    mypool/home@first 0 150M

    mypool/work 200M 3.0T 200M /mypool/work

    mypool/work@first 0 200M

    ```


    Now replicate that snapshot and all its children simultaneously, using a recursive
    send.


    ```

    # zfs send -Rv mypool@first | zfs receive remotpool/backup

    send from @ to mypool@first estimated size is 9.50K

    send from @ to mypool/work@first estimated size is 200M

    send from @ to mypool/family@first estimated size is 50.1M

    send from @ to mypool/home@first estimated size is 150M

    total estimated size is 401M

    ```


    Recursive send also works with incremental (-i) and differential (-d) backups,
    exactly the same way. You can now forcibly destroy a dataset and its children
    simultaneously!'
