  md: "Much like zfs send, zfs receive supports verbosity and no-effect options.\n\
    \nThe -v option makes zfs receive verbose. It prints information about the data\
    \ received and adds regular status updates.\n\nThe -n flag prevents zfs receive\
    \ from actually writing any data to disk. Instead, when with -v it offers statistics\
    \ on what zfs receive would do if actually used.\n\nWhile verbosity can be useful,\
    \ the -n option has limited utility in receiving data. The host will have sent\
    \ data across the network to this host, and the recipient will have done some\
    \ numerical analysis and discarded the data. To write the data to disk, you must\
    \ send it.\n\n# Cloning on Receipt\n\nYou might need to send a dataset that you\
    \ know you're going to want to muck with. As of FreeBSD 10.3, you can tell zfs\
    \ receive to store an incoming incremental replication stream as a clone rather\
    \ than as a snapshot. Cloning on works only with incremental replication.\n\n\
    To have zfs receive create a clone, and the -o flag and define the origin as the\
    \ dataset you want to clone. The zfs receive command takes that dataset, adds\
    \ the incoming snapshot to it, and forks the clone off the original.\n\nThroughout\
    \ this chapter we've been backing up zroot/usr/home to a remote server. Assume\
    \ we want a read-write clone of the Wednesday snapshot. We'll start by cloning\
    \ the Tuesday snapshot.\n\n```\n$ zfs send -i@tuesday zroot/usr/home@wednesday\
    \ | ssh hotspare zfs receive - \norigin=remotepool/usr/home@wednesday\n```\n\n\
    The -o origin statement tells zfs receive that we're starting from the snapshot\
    \ remotepool/usr/home@tuesday and creating a clone. The final argument gives the\
    \ name of our clone, remotepool/usr/wedhome. We can now go into /remotepool/usr/wedhome\
    \ and make changes we desire, without interfering with further replications.\n\
    \nRemember that creating this clone doesn't affect the snapshot to the snapshots\
    \ in the original destination, however. If we want to also create remotepool/usr/home@wednesday,\
    \ we must retransmit it without the -o origin option."
