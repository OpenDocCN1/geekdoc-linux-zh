    and mountpoint properties. If you do it incorrectly, however, you''ll mount the
    old boot environment over the top of your running boot environment. While FreeBSD
    filesystems are stackable, changing all the system binaries on a running system
    can put you in a difficult situation. Imagine being unable to run reboot(8) because
    the binary can''t talk to the running kernel!


    Be safe. Use snapshot mounting and unmounting functions built into beadm(8).'
