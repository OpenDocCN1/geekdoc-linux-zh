  md: '# Resumable Send


    Just because ZFS makes dataset replication simple, doesn''t mean that the real
    world cooperates. As a dataset grows in size, chances increase that some transient
    network problem will break the connection and interrupt the stream. If you''re
    almost done with a 40 GB data stream over the Internet, a two-minute outage at
    your ISP can spark some well-deserved rage. Don''t go after the carrier with an
    axe; use resumable zfs send instead, letting you resume interrupted replications.
    Resumable zfs send first appeared in FreeBSD 10.3 in early 2016.


    To make a ZFS stream resumable, add the -s flag to zfs receive.


    The mypool/from dataset needs a few gigabytes in size. By adding -s to the zfs
    receive statement, though, we make the stream resumable. Which is good, because
    we''re going to interrupt the transmission with CTRL.


    ```

    local# zfs snapshot mypool/from@resumeme

    local# zfs send -v mypool/from@resumeme | ssh hotspot zfs receive -s remote

    full send of mypool/from@resumeme estimated size is 2.00G

    total estimated size is 2.00G

    TIME SENT SNAPSHOT

    17:12:43 279M mypool/from@resumeme

    17:12:44 529M mypool/from@resumeme

    17:12:45 786M mypool/from@resumeme

    ^

    ```


    Of course, because ZFS replication is unidirectional, the sender has no idea which
    blocks recently captured and wrote to the disk. Without resumable, you''d have
    to start the whole transmission over again.


    Over the receiving host, the partially received dataset has a new property,

    receive_resume_token. The sender needs the value of this property to pick where
    it left off.


    remote# zfs get -o value receive_resume_token remotop/to

    1-db9a171a3-c8-789c63606400310a500c4ec5c306710e72765a269740d80ce4e3d28a5


    Now provide that token with the -t flag. You do not need to include the source
    dataset, as the token includes everything zfs sends. Adding the -v spins out more
    details about the transmission, though.


    ```

    local# zfs send -v -t 1-db9a171a3-c8-789c63606400310a500c4ec5c306710e72765

    resume token contents:

    vlist version: 0

    object = 0x8

    offset = 0x35a00000

    bytes = 0x35c5630

    ```'
  merge: -1
  pgno: 82
