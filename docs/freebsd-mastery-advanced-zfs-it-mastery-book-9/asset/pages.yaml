  md: '# zfsd


    FreeBSD 11.0, expected to be released in July 2016, will include the first version
    of zfsd(8). This daemon, specific to FreeBSD, offers some of the functionality
    provided by Solaris'' Service Management Facility (SMF). Zfsd(8) receives notifications
    about faults that the kernel cannot handle itself, and resolves them.


    The daemon listens for devctl(4) events such as I/O errors or disk attach and
    removal events, then responds to them by activating and deactivating hot spares,
    or onlining and offlining individual devices in the pool.


    Zfsd(8) does not require any configuration. It makes all of its decisions based
    on your pool configuration. In the first version of zfsd, only the autoreplace
    pool property has any effect.


    If a device notification is received for a disk that is a member of a VDEV, zfsd
    immediately activates a hot spare in the pool and starts resilvering.


    When a new GEOM device appears, zfsd first checks for a ZFS label. If the disk
    has a label that indicates it was previously a member of a pool, and the pool
    is reattached. Once it resilvering, any hot spares that were temporarily replacing
    that device are deactivated and returned to the list of available spares.


    If the newly arrived device has no ZFS label, but its physical path matches that
    of a missing member of a VDEV, and the pool pool property set, then the new device
    is used to replace the missing one. In newer FreeBSD versions the physical path
    might be bright, or it might be the SES path,

    `/dev/enc\n50030480176b87d/type@0/slot/1/elmdesc@slot_01/gpt/f0-1EHJZMC`.


    Once resilvering completes, zfsd deactivates any hot spares that were replacing
    that device. Deactivated devices get returned to the list of available spares.


    If a VDEV becomes degraded or faulted, zfsd attempts to resolve the issue by activating
    a hot spare.


    If an individual device generates more than 50 I/O or checksum errors in a 60-second
    period, zfsd marks the device as degraded and activates a hot spare. ZFS continues
    to the degraded device while the pool finishes resilvering, zfsd removes the failing
    device from the pool.


