- img_proc: true
  md: 'Firmware Revision : FP2A

    Serial No : 55FGK5SUFS9A

    GUID : N/A

    Protocol : SATA

    Drive Type : SATA_HDD


    You see serial numbers, the drive type, if the drive is ready to use or not, the
    size, and more.


    Once you get through all of the hard drives, it’ll spill out details about the
    enclosure itself.


    Enclosure information


    Enclosure# : 1

    Logical ID : 500605b0:09cfc82

    Numslots : 8

    StartSlot : 0


    It’s not quite everything about your enclosure—it won’t tell you which drive is
    responsible for burning smell—but it provides guidance.


    # sas2ircu Locate Lights


    To turn the LED on a specific drive bay on or off, you’ll need the controller
    number, the enclosure number, and the slot number. Get all that from the display
    command.


    ```

    # sas2ircu <controller#> Locate <enclosure#:slot#> on

    ```


    Suppose we want to activate the LED on drive 8 on the enclosure shown in the previous
    section. We were using controller 0, or /dev/mps0. The display command shows each
    device’s enclosure number and slot number. Drive 8 is in slot 7—remember, slots
    often start numbering at zero. So to blink the LED for drive 8 (above) on /dev/mps0,
    you would run.


    ```

    # sas2ircu 0 locate 1:7 on

    ```


    Turn it off again when you’re done.'
