  md: 'don''t have them lying around. Those of you for planning massive storage arrays
    with more than, say, 40 drives, should remember this.


    # L2ARC Caching


    The L2ARC can only cache data that falls off the ARC. Data that is never in the
    ARC cannot appear in the L2ARC.


    Suppose you''ve completely disabled ARC caching for all datasets on a particular
    pool by setting the primarycache property to none. Adding an L2ARC to this pool
    will not improve ZFS performance. There is no cached data to fall down to the
    L2ARC.


    You might think it makes sense to have a dataset where the ARC contains the metadata,
    while the L2ARC caches the actual file data. Lucas''s multi-terabyte cdr/cdr dataset
    from the previous section might seem a great candidate for this. And he sets primarycache
    to metadata, it so looks like what will happen.


    ```

    # zfs get primarycache, secondarycache zroot/cdr

    NAME PROPERTY VALUE SOURCE

    zroot/cdr primarycache metadata local

    zroot/cdr secondarycache all default

    ```


    The problem is that the ARC only caches metadata, so the only stuff it can push
    to the L2ARC is metadata. The L2ARC can contain only what''s in the ARC, or a
    subset thereof.


    By default the ARC caches everything the system accesses, so the L2ARC does the
    same.n primarycache property, secondarycache can be set to all, metadata, or none.
    The default is all, meaning data that''s almost important enough for the primary
    ARC gets pushed onto the L2ARC.


