  md: "# Boot Environments at Boot\n\nSo you've truly hosed your operating system.\
    \ Forget getting to multi-user mode—even single mode has dissolved into a stream\
    \ of error messages so obscure that even FreeBSD's most experienced kernel hackers\
    \ think your hardware has been hitting the radiator booze. FreeBSD 10.3 and above\
    \ lets you change your boot environment right at the loader prompt. This requires\
    \ console access, but so would any other method of getting yourself out of this\
    \ hole. \n\nBoot the host. You'll get a loader menu much like this, plus some\
    \ graphics.\n\n```\n+==========Welcome to FreeBSD==========+\n| 1. Boot Multi\
    \ User [Enter]\n| 2. Boot [S]ingle User\n| 3. [E]scape to loader prompt\n| 4.\
    \ Reboot\n|\nOptions:\n| 5. [K]ernel: kernel (1 of 2)\n| 6. Configure Boot [O]ptions..\n\
    | 7. Select Boot [E]nvironment...\n|\n+====================================++=\n\
    ```\n\nNote item 7. Select it and you'll get a new menu.\n\n```\n+==========Welcome\
    \ to FreeBSD==========+\n| 1. Active:\n| 2. bootfs: zfs:zroot/ROOT/default\n|\
    \ 3. [P]age: 1 of 1\n|\nBoot Environments:\n| 4. 10.3-release\n| 5. default\n\
    |\n+==========================================\n```\n\nChoose your preferred boot\
    \ environment. The menu will update, displaying your chosen environment in space\
    \ 1 (labeled Active). Press 1 to go back to the main menu, hit ENTER to boot.\
    \ Your system will revert to a known working boot environment, giving you a chance\
    \ to find out why everything went sideways."
