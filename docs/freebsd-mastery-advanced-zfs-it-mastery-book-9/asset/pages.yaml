    The bp physical amount shows how much space these blocks consume on the disk.
    This is where the advantages of compression show up. While we have about 2 GB
    of files, this shows we''re using about 800 MB of disk space for files. But that''s
    not quite the whole story.


    The bp allocated number gives the actual-world disk space consumption. Sector
    size, padding, and parity mean that we don''t get all of the savings that compression
    provided. This server gets a real-world compression factor of 1.86, fitting that
    2 GB in 1.1 GB—significant.


    Here''s a larger pool from an active server with only a single disk VDEV:


