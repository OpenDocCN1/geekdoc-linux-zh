  md: '# Cloning Machines


    ZFS is a perfectly sensible choice for virtual machines. While losing direct access
    to the disks means ZFS can handle error detection for you, features such as snapshots
    and replication make ZFS worthwhile.


    Most virtualization systems offer to clone systems for you, sometimes disguised
    as a standard template you can deploy. If you copy a disk image containing a ZFS
    pool to a new virtual machine, though, your virtual machine is a copy of the original.
    This means that some items that should be globally unique, no longer are. Will
    this cause problems? Not on a stand-alone virtual machine. If you''re going to
    move disk images between virtual machines, though, you''ll want to change the
    GUID of each VM''s pools.


    The guid property contains a pool''s GUID. Here we get the GUID of the pool db2.


    ```

    # zpool get guid db2

    NAME PROPERTY VALUE SOURCE

    db2 guid 5552158746006792385 default

    ```


    To generate a new pool GUID, use zpool reguid. Give the pool name as an argument.


    ```

    # zpool reguid db2

    # zpool get guid db2

    NAME PROPERTY VALUE SOURCE

    db2 guid 76624604609377566669 default

    ```


    You can now attach the disk image from one virtual machine to another without
    making ZFS a hissy fit.


    Giving a pool a new GUID can also help if for some reason zdb(8) cannot find your
    pool.1234'
  merge: -1
  pgno: 190
- img_proc: true
  md: '# Case-Insensitive Filesystem


    Some clients (OS X in particular) expect filesystems to be case-insensitive. You
    can tell a ZFS dataset to be case-insensitive with the casesensitivity property.


    The casesensitivity property defaults to sensitive, which is traditional Unix-style
    case sensitive. If you set it to mixed, ZFS can support both case-sensitive and
    case-insensitive requests. Setting casesensitivity to insensitive means ZFS will
    be completely case-insensitive.


    You can set this property only at dataset creation time.


    ```

    # zfs create -o casesensitivity=mixed samba/share

    ```


    To change casesensitivity on an existing dataset, create a new dataset with the
    property set correctly, and then copy the files over.'
  merge: -1
  pgno: 191
