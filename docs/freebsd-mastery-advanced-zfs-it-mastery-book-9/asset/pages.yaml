  md: '# Chapter 6: Advanced Hardware


    A typical server can only hold so many hard drives. As your storage needs grow,
    you’ll eventually encounter more advanced hardware than you find on your typical
    home machine. This chapter covers enough of the basics to ensure that you know
    what your storage vendor is trying to sell you, and how to make use of these additional
    features.'
  merge: -1
  pgno: 98
- img_proc: true
  md: '# SCSI Enclosure Services


    The most common way to add storage is through a box specifically designed to hold
    hard drives. The most common is the SCSI enclosure (sometimes called a backplane).
    Attach a SCSI enclosure to a host with a disk controller card.


    SCSI enclosures have all sorts of hardware and features in them. You''ll often
    see SAS or SATA port multipliers, allowing you to connect more than four drives
    to each port on the disk controller. You''ll probably see disk bays or trays,
    probably hot-swappable. An enclosure has fans, temperature sensors, power supplies,
    and more. An enclosure might even have its own CPU, running a custom operating
    system specifically designed to corral all of these features. Failed fans and
    power supplies can bring down your storage.


    SCSI enclosures have protocols to communicate with server operating systems. SCSI
    Enclosure Services, or SES, is the modern protocol for monitoring and managing
    the storage subsystem of your server. It''s the successor to the SCSI Accessed
    Fault-Tolerant (SAF-TE) protocol found in older hardware.


    SES is universally integrated into the backplane of the hot-swap bays or in the
    SAS Expander. SES provides a standard way to monitor and locate your disk drives,
    and can also be used to monitor fans, lights, and other devices.


    FreeBSD supports SES with the ses(4) driver. FreeBSD 10.3 introduced sesutil(8),
    letting you examine and control the ses(4) devices on your system.


    # Examining your Enclosure


    Sesutil(8) has many sub-functions. Start with sesutil map, which displays all
    of the devices in all of your enclosures.


    ```

    # sesutil map

    ses0:

    enclosure Name: LSI SAS2X36 0e12

    enclosure ID: 500304801786b87f

    ```


    The first entry for an enclosure is the device name (ses0). If you have multiple
    controllers, a reboot might change the device node, so don''t rely on it to identify
    a specific enclosure. The enclosure name is based on the hardware model, but the
    enclosure ID is unique to this particular piece of hardware.


    Each piece of monitored or controlled hardware in an enclosure is an element.
    Each element is assigned a number. Element numbers do not change at reboot. Here''s
    the first element of one of Jude''s arrays.'
  merge: -1
  pgno: 99
- img_proc: true
  md: 'Element 0, Type: Array Device Slot

    Status: Unsupported (0x00 0x00 0x00)

    Description: Drive Slots


    Element 0 has the type Array Device Slot, and a description of Drive Slots. This
    is a parent element for all of the individual drive slots, which follows.


    Element 1, Type: Array Device Slot

    Status: OK (0x01 0x00 0x00)

    Description: Slot 01

    Device Names: da0,pass4

    Element 2, Type: Array Device Slot

    Status: OK (0x01 0x00 0x00)

    Description: Slot 02

    Device Names: da1,pass5


    Here are a couple of actual hard drives. You''ll see the FreeBSD device names
    and the drive''s physical location. Presumably, your enclosure has slots indes
    delimited on it—preferably, not on the removable drives. When FreeBSD whines that
    disk is dead, you can call the on-site tech to go straight to Slot 02.


    Other hardware appears after the drive bays.


    Element 26, Type: Temperature Sensors

    Status: OK (0x01 0x00 0x39)

    Description: Temperature

    Extra status:

    - Temperature: 37 C


    That''s a lot of words to say that the first thermometer says the enclosure is
    at textbook body temperature.


    Element 28, Type: Cooling

    Status: OK (0x01 0x01 0xfe 0x21)

    Description: Fan1

    Extra status:

    - Speed: 5100 rpm


    A cooling element is probably a fan, although someone''s probably built a supercooled
    enclosure by now. The fan speed lets you know the fan is still running. You might
    have to check the manual to see exactly Fan1 is, though.


    Element 34, Type: Voltage Sensor

    Status: OK (0x01 0x00 0x01 0xf6)

    Description: 5V

    Extra status:

    - Voltage: 5.02 V


    The voltage sensors list each sensor''s expected voltage as a Description, then
    provide the actual voltage as an extra status.'
  merge: -1
  pgno: 100
- img_proc: true
  md: 'SAS expanders get a little more complex. You’ll see entries for SAS expanders,
    and then all the components within the expander. There’s very little to go wrong
    with a SAS expander, but some of the components do offer a status.


    Element 41, Type: SAS Expander

    Status: Unsupported (0x00 0x00 0x00)

    Description: SAS Expanders

    Element 42, Type: SAS Expander

    Status: OK (0x01 0x00 0x00)

    Description: Primary Expander

    Element 44, Type: SAS Connector

