  md: 'You might need to activate a locate light in a bay without a disk—say, to show
    the tech where to install a new hard drive. Use the SES device node and the element
    number rather than the device node. The slot number is often, but not always,
    the same as the element number. Be careful.


    Here we activate the locate light on element 3 on enclosure /dev/ses0.


    ```

    # sesutil locate -u /dev/ses0 3 on

    ```


    To turn the locate light off, run the same command but replace on with ... wait
    for it ... off.'
