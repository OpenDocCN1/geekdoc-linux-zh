  md: '# The Complexities of Incremental Replication


    ZFS replication is unidirectional, from the sender to the receiver. The sender
    gets no feedback from the receiver, permitting dump stream to just about anything.
    This becomes important when deciding between incremental and differential replication.


    Incremental backups (with -i) send all blocks that have changed between the birthtimes
    of the first snapshot and the last, without sending snapshots that exist in between.
    If a dataset has a snapshot for each day of the week, zfs send -i monday zroot/usr/home@thursday
    generates a stream that depends on the @thursday snapshot existing on the receiving
    side, and results in the @intervening snapshots do not get replicated.


    Differential backups (with -i) work exactly like incremental backups, but they
    create any intermediary snapshots. A command like zfs send -I monday zroot/usr/home@monday
    requires that the @monday snapshot exists on the remote side, and it creates the
    absent @tuesday and @wednesday snapshots in passing.


    Assume you''ve automatically taken daily snapshots of a dataset, and you want
    to ship them over to the remote server. Replicate the @monday snapshot to the
    remote pool:


    ```

    # zfs send zroot/usr/home@monday | zfs receive remotipool/backup/usrhome

    ```


    Check on your remote host to verify the presence of the @monday snapshot.


    ```

    # zfs list -t all -r remotipool/backup/usrhome

    NAME USED AVAIL REFER MOPOINT

    remotepool/backup/usrhome 19.5K 472M 19.5K /remotepool/weekday

    remotepool/backup/usrhome@monday 0 19.5K

    ```


    Now we incrementally replicate the @tuesday snapshot.


    ```

    # zfs send -i remotipool/backup/usrhome@tuesday | zfs receive remotipool/backup

    ```


    Checking the remote host, you''ll find snapshots.


    ```

    # zfs list -t all -r remotipool/backup/usrhome

    NAME USED AVAIL REFER MOPOINT

    remotepool/backup/usrhome 29K 472M 19.5K /remotepool/weekday

    remotepool/backup/usrhome@monday 9.5K 19.5K

    remotepool/backup/usrhome@tuesday 0 19.5K

    ```


    On Wednesday if you were galivanting about—, I mean, "out sick"—so you didn''t
    do the replication. Thursday, you want to catch up, so you do a differential replication
    of the @thursday snapshot.


    ```

    # zfs send -I tuesday zroot/usr/home@thursday | zfs receive remotipool/backup/usrhome

