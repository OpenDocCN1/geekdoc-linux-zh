- img_proc: true
  md: "# Recovering Destroyed Pools\n\nThere’s nothing quite like the moment when\
    \ you realize, “Wait, that command is a horrible mistake! and you try to stop,\
    \ but you know that the nerve impulses have time to race down from your brain\
    \ before your hand finishes pressing the ENTER key.\n\nOne place that can happen\
    \ when you destroy a ZFS pool. And the ZFS designers were very aware of exactly\
    \ this syndrome.\n\nThe zpool destroy command doesn’t actually damage any data\
    \ on the underlying disks. Instead, it marks the pool as destroyed. A zpool list\
    \ skips pools marked as destroyed. If you haven’t written to or physically remove\
    \ the disks under the destroyed pool, you can recover the pool. Use the -d flag\
    \ to zpool import to view destroyed pools.\n\n```\n# zpool import -D\n```\n\n\
    You’ll get two kinds of responses, for recoverable and non-recoverable pools.\n\
    \n# Recoverable Pools\n\nHere’s a pool that you can easily recover.\n\n```\n#\
    \ zpool import -D\npool: db2\nid: 555215874600692385\nstate: ONLINE (DESTROYED)\n\
    action: The pool can be imported using its name or numeric identifier.\nconfig:\n\
    \  ONLINE\n  db2\n  gpt/zfs4 ONLINE\n  gpt/zfs5 ONLINE\n```\n\nThis destroyed\
    \ pool, db2, looks like a normal, healthy pool. The state says it’s DESTROYED,\
    \ but the output shows the two providers in the pool’s single VDEV, and they’re\
    \ both online.\n\nTo import a destroyed pool, run zpool import -D and give the\
    \ pool name. Let’s reactivate pool db2.\n\n```\n# zpool import -D db2\n```\n\n\
    Other pools are not so easy.\n\n# Non-Recoverable Pools\n\nOther destroyed pools\
    \ look more like this.\n\n```\n# zpool import -D\npool: db\n```"
