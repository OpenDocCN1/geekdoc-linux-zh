  md: '# ZFS Prefetch


    The job of a filesystem is to provide stored data on request. ZFS takes that idea
    further, by getting ready to provide data you''re about to ask for. This takes
    place on two levels, per-VDEV and per-file. FreeBSD doesn’t enable per-VDEV prefetch
    by default, enables per-file prefetching.


    # Per-VDEV Prefetch


    The most time-consuming part of retrieving data from a spinning disk is positioning
    the heads over the tracks containing the data. It’s like making a sandwich—slapping
    peanut butter between two slices of bread takes two minutes, but going to the
    store to get bread and peanut butter might take you an hour. Now the hardware
    is physically arranged, reading a full track of data off a disk spinning at 5,000
    or 10,000 RPM takes microseconds.


    Per-VDEV prefetch is an attempt to make moving the heads worthwhile. FreeBSD does
    not use per-VDEV prefetching by default, but if your workload involves complicated
    metadata, complex or large directory trees, or many small files, per-VDEV prefetch
    might help you.


    Whenever ZFS reads a few blocks off the VDEV, it also reads the few blocks after
    the target blocks, looking for metadata. Any metadata found gets stuffed into
    a special per-VDEV prefetch cache. There’s a good chance the requesting program
    will return and ask for that metadata. Each time a program requests prefetched
    metadata, ZFS provides it from the cache, returns to the physical VDEV, and prefetches
    more blocks.


    Per-VDEV prefetched blocks go into a simple Least Recently Used cache, not the
    ARC. The size of a VDEV’s cache equals the number of storage providers in the
    VDEV times it is tunable vfs.zdev.cache.size. FreeBSD sets this to 0 by default,
    so the cache is not used. Enable the cache by setting this tunable to the desired
    value in /boot/loader.conf. A common value vfs.zdev.cache.size="10M"


    After a reboot, you’ll have a per-VDEV prefetch cache in play.


    The sysctl kstat.zfs.misc.vdev_cache_stats.miss shows how many times ZFS checked
    the per-VDEV cache for metadata and didn’t find it. Similarly, the sysctl kstat.zfs.misc.vdev_cache_stats.hits
    shows how often ZFS found something in the cache.'
  merge: -1
  pgno: 150
- img_proc: true
  md: 'Test your workload with without per-VDEV prefetch and see how it behaves.


    How much does per-VDEV prefetching preemptively cache? The sysctl vfs.zfs.vdev.max
    gives the minimal size of a read from a VDEV. This defaults to 16384, or 16 KB.
    If a program requests a read smaller than this size, per-VDEV prefetching kicks
    in.


    The read isn’t just expanded to 16 KB, however. The sysctl vfs.zfs.vdev.cacheshift
    gives the amount of data to be prefetched and searched for metadata. This is a
    bit value, so the default of 16 means 64 KB.


    So, if a program requests a read smaller than 16 KB, ZFS reads 64 KB instead.
    If a program requests a read of, say, 20 KB, no-VDEV prefetching occurs.


    While changing the prefetch values helped performance with some older versions
    of ZFS, in modern ZFS you should almost always leave alone. The authors are aware
    of any situations when changing these values helps, but we do know many times
    when changing these values causes suffering.


    # Per-File Prefetch


    If a program requests the start of a file, it’ll probably want the rest of the
    file before. ZFS’ per-file prefetching tries to anticipate these requests, caching
    the file in the ARC before the program gets around to asking for it. This makes
    ZFS feel more responsive. This is often called ZFS’ intelligent prefetch, or sometimes
    just prefetch. While file-level prefetching might not appear terribly sophisticated,
    most filesystems don’t manage it.


    File-level prefetch increases the size of the ARC. FreeBSD automatically disables
    prefetching on hosts less than 4 GB of RAM, and automatically enables it for hosts
    with 4 GB or more. You can override this by setting the tunable vfs.zfs.prefetch_disable
    to 1 in /boot/loader.conf.


    Prefetch can cause problems on systems that have hundreds of thousands (or more)
    tiny files, such as 64 KB and smaller. You’ll want to disable file-level prefetch
    for such hosts. Those systems are fairly rare, however.


    Normal, file-level prefetch improves performance if your system has sufficient
    memory to support it. You can enable and disable prefetch to test performance,
    but in almost all cases prefetch is helpful.'
  merge: -1
  pgno: 151
- img_proc: true
  md: '# Transaction Group Tuning


    You can tune performance by adjusting transaction groups and the I/O scheduler.
    We’re specifically covering tuning FreeBSD 10 and later. The mechanisms for tuning
    OpenZFS writes in earlier versions were considerably more baroque.


    A transaction group, or txg, is a single lump of data written to disk in an ordered
    manner. A transaction group can contain many blocks from many different programs.
    If the entire transaction group is not successfully written to the disk, the entire
    group is canceled.


    You can control how often the system writes a transaction group and its maximum
    size.


    # txg Timing


    If nothing else triggers writing a txg to disk, ZFS write every few seconds, as
    given by the sysctl vfs.zfs.txg.timeout. While the value of this setting flailed
    around a bit in earlier releases of OpenZFS, the current default is five seconds.
    Worst case, any pending data gets written to disk every five seconds.


    For most systems, writing every five seconds is fine. A program like top(1) might
    show a burst of CPU activity every five seconds as the pending transaction group
    gets compressed. You rarely reduce the timeout to less than five seconds.


    Increasing the value make sense for some systems, however. If you’re running ZFS
    on a low-load virtual machine, you might crank the txg timeout to 15 or so. Lucas
    often runs hosts LDAP mirrors and authoritative DNS servers on virtual machines,
    and these kinds of hosts rarely have high demand for disk I/O. Reducing the frequency
    of transaction writes wouldn’t improve performance on this particular virtual
    machine, but it would improve hardware access for other VMs running on hypervisor.
    Giving all the virtual machines that host mostly low settings would improve performance
    for virtual machines across the board, but a single selfish or high-load VM could
    eat up many of those gains. (That might be exactly what you’re trying to achieve,
    however.)


    On typical hardware that shares reading and writing bandwidth, increasing the
    timeout might improve read performance most of the time, but will degrade read
    performance during writes.


    If the timer expires and the system has no transactions waiting to be written
    to disk, ZFS won’t write any data. ZFS won’t write an empty transaction just for
    the sake of having a transaction group. It still increments the transaction group
    count, however.'
  merge: -1
  pgno: 152
- img_proc: true
  md: 'Setting the transaction group timeout to less than five seconds runs up against
    the I/O scheduler and the write throttle. For most of us, five seconds is the
    minimum sensible value.


    # txg Size


    A txg that grows sufficiently large gets committed to disk before the timeout.
    FreeBSD auto-tunes the maximum size of a transaction group at boot time based
    on the amount of memory in the host and the tunable vfs.zfs.dirty_data_max_percent.
    The default is 10, up to a maximum of 4 GB, and is controlled by vfs.zfs.dirty_data_max_max.
    Once a transaction group uses 10 percent of a system''s RAM, it gets written to
    disk.


    You can change the maximum size of a transaction group after boot with the sysctl
    vfs.zfs.dirty_data_max. This value is in bytes, multiply your desired number of
    gigabytes by 1024³ to get the proper sysctl value.


    The hard question is: should you change the size of the transaction group? How
    long does it take your system to write 10 percent of RAM to disk, and how often
    does it happen? Most hosts have far more RAM than they have I/O throughput. Trying
    to write one tenth of RAM in five seconds would be a disaster. Lucas'' test host
    has several hard drives in a single pool and 32 GB of RAM. Writing 3.2 GB to disk
    takes 20 seconds. If this host generated 3.2 GB of disk activity in less than
    the standard five-second timeout, the machine would quickly spiral into unusability.


    If your system is a high-performance disk array with big goals of throughput and
    an economy-sized pile of RAM, you might find increasing the maximum value useful.


    During "write cycles," most reading from disk is suspended. This allows the write
    to complete as quickly as possible. Reading resumes once writing is complete.
    "Interleaving" the workload this usually increases performance. Using knowledge
    of your workload, you can decide if flushing larger groups less often or smaller
    ones more is the best approach. When bulk copying data inside the same pool, Jude
    increased the txg size to 24 GB and the timeout to 30 seconds, and improved performance
    by 25 percent.


    # txg Duration and Contents


    If you''re trying to tune the size and period of transaction groups, it makes
    sense to ask how large your transaction groups are and how long they take to commit
    to disk. Adam'
  merge: -1
  pgno: 153
