- img_proc: true
  md: 'sync read maximum: 10

    async reads maximum: 3

    sync write maximum: 10

    async writes maximum: 10

    scrub maximum: 2


    A disk with the maximum number of simultaneous requests possible would have 35
    outstanding requests. A 10-disk VDEV could have 350 simultaneous outstanding requests,
    where a 29-disk VDEV could have 1015 simultaneous outstanding requests.


    Looking at the requests of each type, you''ll see that this is a fairly balanced
    plan. Synchronous and asynchronous writes get their own queues, so your writes
    won''t overload the ZIL. You get as many reads as asynchronous prefetch is turned
    down so ZFS guesses on the data your programs will won''t overwhelm traffic programs
    actively


    Changing these values adjusts how ZFS can distribute requests. You want your system
    balanced towards writing data? Increase the number of async writes. You want fast
    scrubs? Lift the scrub request ceiling.


    You cannot increase your hardware speed by cranking these settings, however. The
    existing limits can more than saturate a 5400 RPM SATA hard drive. High-end storage
    devices, where you have separate hardware for reading and writing, can probably
    handle slightly higher values. Even then, you''ll hit the maximum capacity soon.


    For solid-state storage, like SSDs, where the number of IOPS can be much greater
    than spinning disks, performance can be improved by increasing all of its tunables.
    In order to get the most performance out of your device, you must give it enough
    work to keep busy, but at the same time, not much work that it takes to get to
    an important request added to the end of the queue. Use the DTrace scripts provided
    earlier in this chapter to measure latency under loads and adjust as necessary.


    If you have super-duper hardware and raise the limits too high, though, you''ll
    hit the per-VDEV limits, changing everything.


    # Scheduling Large VDEVs


    ZFS has two scheduling systems: one for use when the system permits many outstanding
    I/O requests, and another for when the system doesn''t. How many is many? That
    depends'
  merge: -1
  pgno: 162
- img_proc: true
  md: 'on your VDEVs and your host.


    The sysctl vfs.zfs.vdev.max_active gives a flag level where ZFS changes scheduling
    algorithms. FreeBSD''s default is 1000. For most hosts, in the default configuration,
    this means you can have up to 28 disks in a VDEV before switching algorithms.
    If you alter your I/O queues, you change the math.


    Hitting the limit means ZFS changes how it schedules. Rather than using the maximum
    values as a ceiling, it permits each disk a number of outstanding requests equal
    to the minimum values.


    +   - sync read minimum: 10

    - async reads minimum: 3

    - sync write minimum: 10

    - async writes minimum: 1

    - scrub minimum: 1


    This means that each disk gets at least 25 outstanding requests. The system can
    support up to 1000 outstanding requests by default, so any additional requests
    get assigned to priority order.


    If you have more than 40 storage providers in a single VDEV, even the minimums
    exceed the total permitted on the system. Either change vfs.zfs.vdev.max_active
    to permit more requests or, preferably, rearrange your VDEVs to contain a sane
    number of storage providers.'
