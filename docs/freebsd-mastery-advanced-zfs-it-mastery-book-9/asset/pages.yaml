    | work | 3.36G | 1.81T | | 607 | 21.0K | 2.57M |


    This pool averages out 104 operations per second, but at this moment it''s doing
    600 operations per second. It''s doing real work!


    # Virtual Device Activity


    While each pool contains one or more identical virtual devices, the pool''s usage
    of virtual devices might not be identical.


    One common situation is when you have a nearly full pool and add a new virtual
    device to gain more space. The pool''s apparent write performance might then drop
    to that of the new virtual device, rather than the theoretical throughput of the
    entire pool with all its virtual devices. The new virtual device has all of the
    free space, so that''s where the new writes goes. Over time, as you delete old
    files and remove old snapshots, per-VDEV utilization might average out. Depending
    on your workload, however, VDEV utilization might never reach equilibrium.


    To view per-VDEV activity of each pool, add the -v flag after iostat.'
