  md: 'ARC might be able to fit significantly more data in the same amount of RAM
    than your database can.


    # MySQL – InnoDB/XtraDB


    Inno became the default storage engine in MySQL 5.5 and has significantly different
    characteristics than the previously used MyISAM engine. Percona''s XtraDB, also
    used by MariaDB, is similar to InnoDB. Both InnoDB and XtraDB use a 16 KB block
    size, so the ZFS dataset that contains the actual data files has its recordsize
    property set to match. We also recommend using MySQL''s innodb_one_file_per_table
    setting to keep the InnoDB data for each table in a separate file, rather than
    grouping it into a single ibata file. This makes snapshots more useful and allows
    more selective restoration or rollback.


    Store different types of files on different datasets. The data files need 16 KB
    block size, l4 compression and reduced metadata. You might see performance gains
    from caching only metadata, but this also allows prefetch. Experiment and see
    how your environment behaves.


    ```

    # zfs create - recordsize=16k -o compress=lz4 -o redundant_metadata=most -o primarycache=metadata
    mypool/var/db/mysql

    ```


    The primary MySQL logs compress best with gzip, and don''t need caching in memory.


    ```

    # zfs create -compress=gzip1 -o primarycache=none mysql var/log/mysql

    ```


    The replication log works best with lz4 compression.


    ```

    # zfs create -compress=lz4 mypool/var/log/replication

    ```


    Tell MySQL to use these datasets with the /usr/local/etc/my.cnf settings.


    ```

    data_path=/var/db/mysql

    log_path=/var/log/mysql

    binlog_path=/var/log/mysql/replication

    ```


    You can now initialize your database and start loading data.


    # MySQL – MyISAM


    Many MySQL applications still use the older MyISAM storage engine, either because
    of its simplicity or because they have not been converted to using InnoDB.


    MyISAM uses an 8 KB block size. The dataset record size should be set to match.
    The dataset layout should otherwise be the same as for InnoDB.


