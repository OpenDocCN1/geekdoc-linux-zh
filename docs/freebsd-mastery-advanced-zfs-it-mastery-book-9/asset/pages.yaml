- img_proc: true
  md: '# Striped Mirrors


    Striped mirrors do not need any parity data. ZFS copies the data wholesale to
    multiple storage providers. Striped mirrors don''t pad data to fit allocation
    sizes. A striped mirror is the most efficient place to store data, but it has
    a different data protection model than RAID-Z.


    Three-way mirrors give similar data protection to RAID-Z2—you can lose two drives
    from each VDEV without losing any data—but you get only 33 percent of the total
    space.


    # Changing the allocation size


    Change recordsize or volblocksize to 4 KB changes the calculations. A smaller
    stripe size means more parity, which possibly means empty padding.


    Look at our sample 8 KB write on RAID-Z3. It gets broken up into two stripes.
    On a zvol with 4 KB blocks, each stripe needs four sectors, again giving you 25
    percent space efficiency. With 512-byte blocks, each stripe needs 11 blocks, which
    gets rounded up to 12. You''ll get about 66 percent space efficiency.


    The interaction among the stripe size (volblocksize), parity, and padding is why
    you don''t have to perform these calculations with filesystem datasets. A stripe
    size of 128 KB reduces allocation padding to more noise.


    # Recommendations


    Before setting up a system for databases or zvols, carefully consider the storage
    beneath the data pool. With the common recordsize setting of 8 KB we strongly
    recommend, in order: a mirrored stripe pool, a four-drive RAID-Z2 pool, or a three-drive
    RAID-Z pool.


    If you''re using zvols with a volblocksize of 4 KB to support virtual machines,
    your choices are more limited. Mirrored stripe pools allow you maximum space efficiency,
    while all other sizes cause at least some space loss due to padding. Mirrors also
    have a great IOPS advantage over RAID-Z.'
  merge: -1
  pgno: 173
- img_proc: true
  md: '# Databases and ZFS


    Many ZFS features are highly advantageous for databases. Every DBA wants fast,
    easy, and efficient replication, snapshots, clones, tunable caches, and pooled
    storage. While ZFS is designed as a general-purpose filesystem, you can tune it
    to make your databases fly.


    Databases usually consist of more than one type of file, and each has different
    characteristics and usage patterns, each requires different tuning. We''ll discuss
    MySQL and PostgreSQL in particular, but the principles apply to any database software.


    The most important tuning you can perform for a database is the dataset block
    size, through the `recordsize` property. For any file that might be overwritten
    needs to match the block size used by the application.


    Tuning the block size also avoids write amplification. Write amplification happens
    when changing a small amount of data requires writing a large amount of data.
    Suppose you must change 8 KB in the middle of a 128 KB block. ZFS must read the
    128 KB, modify 8 KB somewhere in it, calculate a new checksum, and write the new
    128 KB block. ZFS is a copy-on-write filesystem, so it will wind up writing a
    whole 128 KB block just to change that 8 KB. You don''t want. Now multiply this
    by the number of your writes database. Write amplification deteriorates performance.


    While this sort of optimization isn''t necessary for many of us, for a high-performance
    system it might be invaluable. It can also affect the life of SSDs and other flash-based
    storage that can handle a limited volume of writes over their lifetime. Of course
    the different database engines don''t make this easy, and each has different needs.
    Journals, binary replication logs, error and query logs, and other miscellaneous
    files also require different tuning.


    Before creating a dataset with a small `recordsize`, be sure you understand the
    interaction between VDEV type and space utilization. In some situations, disks
    with the smaller 512-byte sector size can provide better storage efficiency. It
    is entirely possible you may be better off with a separate pool specifically for
    your database, with the main pool for your other files.


    For high-performance systems, use mirrors rather than any type of RAID-Z. Yes,
    for resiliency you probably want RAID-Z. Choose your pain.¹


    # All Databases


    Enabling lz compression on a database can, unintuuitively, actually decrease latency.'
  merge: -1
  pgno: 174
- img_proc: true
  md: 'Compressed data can be read more quickly from the physical media, as there
    is less to read, which can result in shorter transfer times. Iz4''s early abort
    feature, the worst case is only a few milliseconds slower than opting out of compression,
    but the benefits are usually quite significant. This is why ZFS uses iz4 compression
    for all of its own metadata and for the L2ARC. In the near future when the Compressed
    ARC feature lands in OpenZFS, enabling compression on the dataset will allow more
    data to be kept in the ARC, the fastest cache in ZFS.


    In a production case study by Delphix, a database server with 768 GB of RAM went
    using more than 90 percent of its memory to cache a database by using only 46
    GB to cache 1.2 TB of compressed data. Compressing the in-memory cache resulted
    in a significant performance improvement. As the machine could not support any
    more RAM, compression was the only way to improve.


    ZFS metadata can also affect databases. When a database is rapidly changing, writing
    two or three copies of the metadata for each change can take a significant number
    of the available IOPS of the backing storage. Normally, the quantity of metadata
    is relatively small compared to the 128 KB record size. Databases work better
    with small record sizes, though. Keeping three copies of the metadata can cause
    as much disk activity, or more, writing actual data to the pool.


    Newer versions of OpenZFS also contain a redundant_metadata property, which defaults
    to all. This is the original behavior from previous versions of ZFS. However,
    this property can also be set to most, which causes ZFS to reduce the number of
    copies of some types of metadata that it keeps.


    Depending on your needs and workload, allowing the database engine to manage caching
    might be better. ZFS defaults to caching much or all of the data from your database
    in the ARC, while the database keeps its own cache, resulting in wasteful double
    caching. Setting the primarycache to metadata rather than the default tells ZFS
    to avoid caching actual data in the ARC. The secondarycache similarly controls
    the L2ARC.


    Depending on the access pattern and the database engine, ZFS may already be more
    efficient, using a tool like zfsstat from the zfs-tools package to monitor the
    ARC cache hit, and compare it to that of the database''s internal cache.


    Once the Compressed ARC feature is available, it might be wise to consider reducing
    the size of the database''s internal cache, and instead letting ZFS handle the
    caching.'
