  md: '# Labeling Disks


    FreeBSD provides several ways to label a disk or partition. Some are automatic,
    and some are managed by the user. Each has advantages and disadvantages. One device
    can have multiple labels.


    Once a label is accessed, other label pointing at the same device wither and become
    inaccessible. This prevents accessing a single device by multiple names.


    All of the automatically generated labels are activated by default. If you desire
    to use a manual label, it''s best to disable the manual methods.


    # GPT Label (Manual)


    If the disk is partitioned with a GUID Partition Table (GPT), each partition can
    contain a text label of your choosing. This is authors’ preferred method of labeling
    disks.


    Use gpart(8) to create and label a new partition.


    ```

    # gpart add -t freebsd-zfs -zfs-mirror-1 da2

    ```


    Here we change the label on the existing 2nd partition.


    ```

    # gpart modify -i 2 -f01-serialnumber da2

    ```


    Manual labels help identify disks by characteristics such as physical placement
    or serial number.


    If you use GPT labels, we recommend disabling GPTID and disk ID labels.


    # GPTID Label (Automatic)


    With the GPT partitioning scheme, each partition has a unique GUID. The GPT labeling
    system uses the GUID to identify partitions. The problem is that GUIDs mean little
    to a human. By looking at a few, you can see that it can be hard to spot the differences.


    ```

    ada0p1: /dev/gptid/b305e4ff-b889-11e5-002590db872e

    ada1p1: /dev/gptid/b329ff70-b889-11e5-002590db872e

    ada1p2: /dev/gptid/b33db4ac-b889-11e5-002590db872e

    ```


    If only the last few characters of the first segment are actually different, it''s
    easy to confuse yourself.


    If ZFS sees a piece of a pool under a GPT label before seeing that same pool under
    a different label, it uses the GPTID label. This hides your carefully hand-crafted
    labels.


    Disable GPTID labels at boot by adding the following to /boot/loader.conf.'
  merge: -1
  pgno: 11
- img_proc: true
  md: 'kern.geom.label.gptid.enable=0


    FreeBSD enables GPT ID by default.


    # Disk Ident Label (Automatic)


    While GPT and GPTID labels identify a partition, the Disk Ident (or diskid) labels
    identify an entire disk. The device name is based on the disk''s serial number,
    which is convenient. Unfortunately, any special characters in the serial number—notably,
    spaces—get encoded. This creates very ugly device names. In addition, since the
    label identifies the disk, not a partition, the partition part of the device name
    (p3) is appended, and can be hard to pick out of the device.


    ```

    /dev/diskid/DISK-07013121E6B2BFA14

    /dev/diskid/DISK-%20%20%20%20%20WD-WCC131365642

    /dev/diskid/DISK-%20%20%20%20%20%20%20%20%20Z300HTCE

    ```


    These autogenerated labels can be disabled to block ZFS from using instead of
    your GPT label. Adding the following to /boot/loader.conf:


    kern.geom.label.disk_ident.enable=0


    Many people have strong arguments in favor of diskid labels. The authors won''t
    say those arguments are incorrect. We will say diskid labels give both of us a
    headache.


    FreeBSD enables diskid labels by default.


    # Glabel (Manual)


    In addition to the other types of labels, you can also create a GEOM label stored
    in the last sector of a disk or partition. These labels are in a GEOM-specific
    format, called glabel. The advantage to these custom labels is that the do not
    require using the GPT format, so they can work with MBR formatted disks and raw
    disks without partitions. A glabel uses the provider''s last sector.


    Create and view glabel with glabel(8).


    ```

    # glabel label -v mylabel /dev/ada02

    Metadata value stored on /dev/ada02.

    Done.

    # glabel status

    Name Status Components

    gpt/gptboot0 N/A ada0p1

    label/mylabel N/A ada0p2

    gpt/zfs0 N/A ada0p3

    ```


    There is now a /dev/label/mylabel device.'
  merge: -1
