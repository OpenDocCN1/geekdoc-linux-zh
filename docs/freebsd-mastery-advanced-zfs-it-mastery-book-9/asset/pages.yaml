  md: '# I/O Scheduling


    Not all hardware is created equal. Jude''s top-of-the-line laptop has a lot less
    I/O capacity than of his Content Delivery Network servers. FreeBSD''s default
    settings are fairly generic. While you don''t really need to tune them on a laptop,
    if you have dozens or hundreds of disks with very specific workloads you can adjust
    performance through tuning the scheduling. Scheduling I/O lets you adjust latency
    and throughput.


    Throughput is the amount of data that can be read from and written to the storage
    device. When you say that SATA-3 can transfer data at 6.0 GB/s, you''re talking
    about throughput.


    Latency is the length of the time system needs to service these requests. A complicated
    storage system, with Fiber Channel busses and multiple shelves in multiple parts
    of the building, might induce latency as traverse the system. Your laptop is more
    likely to have storage latency when you overload the hard drive by copying too
    many files simultaneously.


    While hard drives are generally marketed with a description of how many I/O operations
    they can perform per second (IOPS), that isn''t a term as you might think. Being
    able to perform 250 IOPS of carefully selected data says nothing about the drive''s
    ability to perform with your data.


    Think of hard drives like automobiles. Some are optimized for capacity, others
    for mileage. A huge tandem tractor-trailer rig can haul far more stuff than a
    Tesla Roadster, That''s isn''t snappy off the red light. Most of us would use
    the big truck to move a hundred-person call center across town over the weekend,
    but prefer different optimizations to get a child to the hospital before appendix
    rupturing.


    Unlike a car, you can to a certain extent control the optimization of most hard
    drives. (Some specialty storage devices are specifically designed for certain
    optimizations.) That''s why you can dump huge amounts of data on your laptop''s
    hard drive and make the system unresponsive—you''ve just exchanged throughput
    for latency.


    ZFS I/O scheduling is designed to smooth out latency. This can reduce throughput,
    but makes the overall experience more consistent. Generally, by changing the scheduling,
    you''re trying to improve performance while not introducing too much latency.


    ZFS scheduling is built around I/O queues.


    # Measuring Latency and Throughput'
  merge: -1
  pgno: 157
- img_proc: true
  md: "How do you know if a change positively affects system performance? You measure.\n\
    Adam Leventhal wrote a latency and throughput DTrace script for illumos, but here's\
    \ a\nversion modified for FreeBSD.\n\n```\n#pragma D option quiet\ninline uint32_t\
    \ BIO_READ = 1;\ninline uint32_t BIO_WRITE = 2;\nthis uint64_t delta;\nBEGIN\n\
    {\n start = timestamp;\nio::=start\n / args[0] /\n{\n ts[args[0]] = timestamp;\n\
    }\n io::=done\n/args[0] & ts(args[0])/\nn this->delta = (timestamp - ts(args[0]))\
    \ / 1000;\nthis->name = (args[0]-bio_cmd & BIO_READ | BIO_WRITE) == BIO_READ ?\n\
    \"read\" = \"write\"\n@q[this->name] = quantize(this->delta);\n@a[this->name]\
    \ = avg(this->delta);\n@v[this->name] = stddev(this->delta);\n@if[this->name]\
    \ = count();\n@b[this->name] = sum(args[0]->bio_bcount);\nts(args[0]) = 0;\n}\n\
