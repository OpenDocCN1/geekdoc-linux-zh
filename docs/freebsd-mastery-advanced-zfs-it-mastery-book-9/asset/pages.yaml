  md: '# About the Authors


    Allan Jude is VP of operations at ScaleEngine Inc., a global Video Streaming CDN,
    where he makes extensive use of ZFS on FreeBSD. He is also the weekly video podcasts
    BSD Now (with Kris Moore) and TechSNAP on JupiterBroadcasting.com. Allan is a
    FreeBSD committer, focused on improving the documentation and implementing libuccl
    and libxo throughout the base system. He taught FreeBSD and NetBSD at Mohawk College
    in Hamilton, Canada from 2007-2010 and has 13 years of BSD unix sysadmin experience.


    Michael W Lucas is a full time author. His FreeBSD experience is almost as old
    as FreeBSD. He worked for twenty years as a sysadmin and network engineer at a
    variety of firms, most of which no longer exist. He''s written a whole stack of
    technology books, which have been translated into nine languages. (Yes, real languages.
    Ones that people actually speak.) You can find him lurking at various user groups
    around Detroit, Michigan, his dojo (http://zenmartialarts.com), or at https://www.michaellucas.com.


    Find the authors on Twitter as @allanjude and @mwlauthor.'
