  md: '# Chapter 4: Replication


    What exactly is [/,replä’käSH(a)n/] anyway? In ZFS, it means making an exact copy
    of your filesystem someplace else. That other place can be another dataset in
    your pool, a second pool on your system, an external drive, a remote system, a
    tape, or just a file. You can declare “I want this filesystem in that place,”
    and make it happen. ZFS replication has a few design features that make it especially
    powerful.


    Programs like dump(8) and rsync(1) expect the receiver to somehow acknowledge
    receipt of the data. The ZFS replication process is unidirectional—the sender
    does not need any feedback from the receiving side. As replication doesn’t expect
    any acknowledgement, the ZFS recipient doesn’t need any intelligence; it only
    needs to accept a stream of bytes and do something with them.


    The replication system is integrated with snapshots. A snapshot is a static, unchanging
    entity, which means that the transmitted ZFS dataset is fully coherent, unlike
    dumping or rsyncing a live filesystem. Snapshot-based replication also means you
    can do incremental replication, sending only the blocks that have changed between
    two snapshots. With incremental replication, you never have to send the same data
    twice.


    ZFS’s replication feature is designed to fully utilize all of your disks. The
    only limitation to how fast you can replicate data between machines is the speed
    of your network link.


    ZFS replication consists of two parts: zfs send, which serializes a snapshot or
    series of snapshots into a single data stream, and zfs receive, which turns that
    stream back into a ZFS filesystem.'
  merge: -1
  pgno: 59
- img_proc: true
  md: '# But I Have Rsync!


    For decades now, rsync(1) has been the standard tool for synchronizing files between
    machines. To synchronize files, rsync walks the directory tree, evaluates the
    timestamps and cryptographic checksums of each file, and compares them to the
    files on the remote side. Many organizations have deployed extensive rsync-based
    infrastructure.


    ZFS is designed from the disk up for maximum performance. It beats rsync so badly
    that rsync’s mom needs urgent medical attention. ZFS maintains a list of blocks
    on disk that differ between each snapshot. The replication process doesn’t need
    to determine which files has changed—the filesystem itself already has that information.
    The replication process starts sending those blocks, as quickly as possible, immediately.
    As the changed blocks contain all the metadata to reassemble the file, the replication
    process doesn’t even need to know which blocks belong to.


    While rsync is walking your filesystem, looking at each file, checking its timestamp,
    calculating a checksum, and comparing those to the versions on the other side,
    ZFS has already finished. If you have 10 TB of data, and only 1 GB has changed,
    rsync still needs to check every file. ZFS just grabs the 1 GB of changed blocks
    and sends them.


    A sysadmin who needs faster rsync synchronization can tell rsync to cheat and
    assume that if the last modified time on both the local and remote files are the
    same, the file has not changed. (This is not actually always true, but don’t hold
    that against rsync—the sysadmin should know better). When a file’s 9 timestamp
    has changed, rsync calculates checksums on chunks of the file on both sides, and
    compares the checksums. If it finds a difference, it calculates a delta and sends
    that across. This means that if you make a small change to a large file, rsync
    must read and check the entire file on both the local and remote side. Using rsync
    to maintain a copy of 500 GB VM disk image on a backup machine eats a bunch of
    bandwidth and processor time.


    Each block in ZFS has a birthtime, the transaction group ID of when the block
    was created. The replication process sends any block newer than the last time
    replication was run. It doesn’t matter if the blocks come from a new file, or
    the middle of a huge file.


    The advantages of snapshot-based replication really come into play when you regularly
    synchronize filesystems. Suppose you replicate a snapshot on a backup server.
    An hour later, you create a new snapshot and incrementally send that snapshot
    to the backup server. ZFS finishes in a few seconds, while rsync is still walking
    the first level of'
