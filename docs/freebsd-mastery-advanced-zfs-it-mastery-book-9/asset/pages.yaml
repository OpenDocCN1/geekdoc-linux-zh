    # L2ARC Write Speed


    SSDs are not as robust as spinning disks. Even if you contact a specialist vendor
    (such as iX Systems) who''s very familiar with ZFS and knows precisely the best
    disk to use for L2ARC, you can hammer on an SSD so much before it dies. While
    ZFS gracefully manages a dying or dead L2ARC, constant disk death is expensive,
    time consuming, and annoying to the sysadmin. ZFS implements a couple of write
    throttles on the L2ARC to extend disk life.


    Like the main ARC, the L2ARC uses bytes in its configuration. Most L2ARC settings
    make the most sense in megabytes. Multiply your desired values by 1024^2.


    During normal operating, ZFS writes 8 MB per second to each L2ARC device. This
    avoids wearing the SSD device, and also avoids cache thrashing (writing a lot
    of data to the cache that ends up getting overwritten with newer data before it''s
    used.) If you need a system''s L2ARC to handle more data, you can boost this with
    the sysctl vfs.zfs.l2arc_write_max. Don''t turn this up high that you make reads
    slow.


    When a system first boots, the L2ARC is empty. An empty L2ARC doesn''t do much
    good. ZFS does a Turbo Warmup Phase after system boot it writes extra data to
    the L2ARC, over and above the limit set by vfs.zfs.l2arc_write_max. Turbo Warmup
    Phase continues until the L2ARC drops the first item from the L2ARC. The length
    of this depends entirely on the system. By default, ZFS can write an 8 MB to each
    L2ARC device during Turbo Warmup Phase. The sysctl vfs.zfs.l2arc_write_boost controls
    the bandwidth allocated.


    You can change sysctl at any time. Here we be set to 16 MB.


    ```

    # vfs.zfs.l2arc_write_max=16777216

    vfs.zfs.l2arc_write_max= 8388608 -> 16777216

