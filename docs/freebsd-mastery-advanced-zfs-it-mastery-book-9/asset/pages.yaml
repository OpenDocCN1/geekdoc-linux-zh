  md: 'also has its say here. FreeBSD uses the sysctl vfs.usermount to determine if
    users can mount partitions. Set this sysctl to 1 to allow a user to mount partitions.


    Even with sysctl, allowing a regular user to mount filesystems comes with a safety
    belt that blocks users from doing evil things. A user must own the directory where
    he wants to mount anything. This prevents users mounting their new dataset as
    /etc and hijacking your system. The dataset might have restrictive permissions
    on it, but a user who owns the mount point and has the privilege can mount it.


    To allow the regular user lucas to create, clone, and mount datasets under his
    home directory, set the sysctl and make sure he owns the directory you''re letting
    him control.


    ```

    # sysctl vfs.usermount=1

    # zfs -u lucas create,clone,mount mypool/usr/home/lucas

    ```


    Log in as lucas again to verify it works.


    ```

    # su lucas

    $ zfs create mypool/usr/home/lucas/evil_plot

    $ zfs mount

    mypool/ROOT/default             /

    mypool/usr/home /usr/home

    mypool/usr/home/lucas /usr/home/lucas

    mypool/usr/home/lucas/blackmail /usr/home/lucas/blackmail

    mypool/usr/home/lucas/evil_plot /usr/home/lucas/evil_plot

    ```


    Remember to add vfs.usermount=1 to your /etc/sysctl.conf so he can still mount
    datasets after a reboot, he''ll come wishing for you.


    # Revoking Permission


    Giving permissions (and work) away to other people can be freeing, but nothing
    matches the feeling of taking permission away. Use zfs unallow to remove permissions
    from a dataset. The command follows the exact syntax as zfs allow.


    Here, lucas has created many children and we decide he should not longer be allowed
    to create. Get rid of his create permission.


