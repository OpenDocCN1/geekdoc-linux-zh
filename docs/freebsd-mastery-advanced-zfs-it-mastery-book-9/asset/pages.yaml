  md: '# NVMe


    Non-Volatile Memory Express, or NVMe, is a newer technology designed to further
    increase solid state storage speed. It''s used for flash drives, as well as other
    non-volatile memory Intel''s 3D Xpoint. NVMe itself is a physical interface specification,
    an alternative to SATA or SCSI/SAS. You''ll find NVMe cables and adapters that
    attach the PCI-e bus.


    The slowest, most complicated, and most error-prone part of an SSD is the FTL.
    Pretending to be as stupid as a 1980s-era spinning disk is hard labor. NVMe improves
    performance on the same hardware by dropping this clumsy pretense, instead adopting
    protocols for flash memory.


    One of the biggest differences between NVMe devices and SSDs is that NVMe devices
    have multiple queues, usually one read and one queue per CPU. Rather than trying
    to keep a single queue of enough work to occupy multiple cells, NVMe has multiple
    queues. NVMe queues can be kept relatively shallow, to allow high-priority tasks
    to supersede older work. Spreading the load across CPUs helps even greater performance.


    While HDDs and SSDs interface with AHCI, which has a single command queue of up
    to 64 commands per device, the NVMe interface allows 65,536 queues, of 65,536
    commands each. The NVMe interface requires less locking while offering greater
    parallelism and therefore performance.


    FreeBSD''s nvme(4) driver first appeared in FreeBSD 9.2. Much like a hard drive
    device node, you can expect the first nvme(4) device to be /dev/nvme0, /dev/nvme1,
    and so on.


    NVMe devices natively support namespaces, allowing them to be divided into logical
    namespaces, similar but different to partitioning. NVme(4) uses the ns to identify
    namespaces in the device node. Unlike most everything in computing, the NVM Express
    specification starts numbering namespaces at 1 rather than 0. You''ll get device
    nodes like /dev/nvme01, /dev/nvme02, and so on.


    Only newer Enterprise NVMe devices support managing the namespaces. Current devices
    have a single namespace that covers the entire device.


    # Viewing NVMe Devices


    Use nvcontrol(8) to manage NVMe devices. Start by identifying all of the NVMe
    hardware connected to the system with nvmecontrol devlist.'
