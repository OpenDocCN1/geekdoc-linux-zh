  md: '# Chapter 2: Delegation and Jails


    The ZFS designers did their best to ease storage management for system administrators.

    One of the best ways to reduce the amount of work you do is to make someone else
    do the work for you. ZFS has a fully featured delege system that lets you dictate
    what commands and features a user or group of users can use on each dataset. You
    can allow users to create and destroy their own snapshots, create child datasets,
    generate space consumption reports, or control the properties of a dataset. ZFS
    builds on the delegation feature to provide special support to jails.'
  merge: -1
  pgno: 33
- img_proc: true
  md: "# ZFS Delegation\n\nZFS lets you delegate administrative tasks to users on\
    \ a per-property and per-command basis for each database. You can give the database\
    \ administrator complete control over the database pool, or the web server admin\
    \ control over snapshots on the web site data. Use the zfs allow command to delegate\
    \ permissions.\n\nGiving zfs allow a pool or dataset as an argument shows the\
    \ permissions on that device. Here I get the permissions on the pool remotepool.\n\
    \n```\n# zfs allow remotepool\n---- Permissions on remotepool -----\nLocal+Descendent\
    \ permissions:\n  user replicator compression, create, destroy, mount, mountpoint,\
    \ receive\n```\n\nThis pool has a single permission entry, for the replicator.\
    \ This user has rights to the compression and mountpoint properties, as well as\
    \ the create, destroy, mount, and receive subcommands of zfs. (Chapter 4 discusses\
    \ the importance of these particular permissions.)\n\nApplications and users can\
    \ define their own properties. Programs like zftools create properties to manage\
    \ snapshots. There is a special permission, userprop, to allow users to create\
    \ user-defined properties. User-defined properties are assigned as a single permission:\
    \ you cannot separately assign different user-defined properties.\n\nWhile root\
    \ is not listed as having any permissions here, root can do whatever it pleases.\
    \ Because that's how Unix rolls.\n\n# Adding Permissions\n\nDelegate permissions\
    \ on a pool or a dataset to a user or group. The -u flag lets you specify a username\
    \ to zfs allow, and -g specifies a group.\n\n```\n# zfs allow -u username permissions\
    \ pool/dataset\n```\n\nSuppose we have a troublesome user—call him Lucas. He keeps\
    \ trying stupid Unix tricks that fry his home directory. Let's allow Lucas to\
    \ create own snapshots so he doesn't have to bother the sysadmin every time he\
    \ breaks his environment.\n\n```\n# zfs allow -u lucas snapshot,rollback mypool/usr/home/lucas\n\
    ```\n\nWhen you view the dataset permissions, the two permissions you've assigned\
    \ him up.\n\n```\n# zfs allow mypool/usr/home/lucas\n---- Permissions on mypool/usr/home/lucas\
    \ -----\nLocal+Descendent permissions:\n  user lucas rollback, snapshot\n```"
  merge: -1
  pgno: 34
- img_proc: true
