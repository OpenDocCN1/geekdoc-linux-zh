    # Activating Boot Environments


    Suppose you apply the latest patches and the machine goes bonkers. Your server
    software fails, or the kernel panics, or tiny gremlins hop out of the USB ports
    and stealing your spoons. Fall back to an earlier version by activating the boot
    environment and rebooting. Activate a boot environment with beadm activate.


    ```

