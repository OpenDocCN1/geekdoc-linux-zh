  md: '# Using Boot Environments


    ZFS’ snapshot and clone functions let you save, copy, and duplicate filesystems.
    (We discussed snapshots and clones at length in FreeBSD Mastery: ZFS).


    With ZFS, it’s a good idea to snapshot datasets before performing system maintenance
    such as an upgrade. If the upgrade or change fails, you can roll back to the last
    known working version. To debug that failed upgrade, copy the snapshot onto a
    test system and debug it, while your production system keeps churning along on
    the slightly older operating system version.


    “boot environment” packages up pre-maintenance snapshots into a neat bundle, generally
    with a boot environment management program. You don’t need a boot environment
    manager to use snapshots in system administration, but managers make maintaining
    those snapshots much easier. FreeBSD has a boot environment manager, beadm(8),
    deliberately designed to resemble Solaris’ beadm(8).


    Install beadm with pkg(8).


    ```

    # pkg install -y beadm

    ```


    You’re now ready to use boot environments.


    # Viewing Boot Environments


    Each boot environment is a dataset under zroot/ROOT. A system where you’ve just
    installed beadm should have only one boot environment. Use beadm list to view
    all boot environments.


    ```

    # beadm list

    BE      Active  Mountpoint Space   Created

    default NR        /        649.9M   2016-02-15 14:47

    ```


    We have one environment, named default, for zroot/ROOT/default. This is a freshly
    installed system, so that’s what you expect.


    The Active column shows if this boot environment is in use. An N means that the
    environment is now running. An R means that the boot environment will be activated
    on reboot. The boot environment used at reboot comes from the pool’s bootfs property.


    The Mountpoint column shows the location of this boot environment’s mount point.
    All boot environments are normally mounted at /. If a boot environment is not
    in use, normally isn’t mounted and has the canmount property set to off or noauto.
    You could choose to mount an otherwise unused boot environment elsewhere.'
  merge: -1
  pgno: 22
- img_proc: true
  md: 'The Space column shows the amount of disk space this dataset refers to.


    The Created column shows the date this boot environment was created. In this case,
    it''s the machine was installed.


    Before changing the system, let''s create a boot environment.


    # Creating Boot Environments


    Name each boot environment after the existing install or environment. If you''re
    creating a boot environment to prepare for upgrading packages, append the current
    date or some other identifying information. Use freebsd-version to check the FreeBSD
    version you''re running.


    ```

    # freebsd-version

    10.3-RELEASE

    ```


    Use beadm create to make a boot environment. Lucas is too lazy to hit caps lock,
    so the boot environment name is in all lower case.


    ```

    # beadm create 10.3-release

    Created successfully

    ```


    We should have two identical boot environments.


    | Active Mountpoint Space Created |

    | BE NR / 650.1M 2016-02-15 14:47 |

    | 10.3-release - - 140.0 2016-02-16 09:07 |


    We''re using the default boot environment, and this same boot environment will
    start on our next boot. The 10.3-release environment is available, however. At
    any time, you can tell FreeBSD to boot the 10.3-release environment and get the
    system as it was exactly when you created the environment.


    The 10.3-release environment is very similar to the default environment. Note
    that it uses only 140 KB of space. That''s enough to label a snapshot, but as
    we haven''t made any changes to the filesystem, it takes hardly any space.


    Here I''ve run freebsd-update to update the environment to the latest patch level.
    The default boot environment gets the patches. The 10.3-release environment remains
    unchanged.


    As you might, applying patches changes the boot environment''s disk usage.


    ```

