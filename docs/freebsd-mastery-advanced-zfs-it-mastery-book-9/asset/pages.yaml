    Most of the time needed to read a file is spent moving the disk heads into position
    over the platter. Once positioned, the heads read data pretty quickly. This is
    called streaming. While serving large files out of memory would be faster than
    reading them from disk, on most systems the multiple disks of the main pool are
    faster than the one or two disks of the L2ARC. In this case, having the L2ARC
    cache streaming files doesn''t make sense, so it''s disabled by default.


    If you have an L2ARC that''s faster than your main pool, you might want to enable'
