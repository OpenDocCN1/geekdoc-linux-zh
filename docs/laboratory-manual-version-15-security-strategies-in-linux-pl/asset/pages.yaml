- pgno: 10
  md: '# Preface


    Welcome! This lab manual is your step-by-step guide to completing the laboratory
    exercises for this course.


    # Virtual Security Cloud Lab (VSCL)


    For most of the exercises in this lab manual, you will use the Virtual Security
    Cloud Lab (VSCL) resource.


    > Note:

    The Virtual Security Cloud Lab requires use either Windows Internet Explorer or
    Mozilla Firefox. The Virtual Security Cloud Lab does not support Google Chrome,
    Safari, or Opera at this time.


    The VSCL is a collection of virtual resources, including Windows and Linux servers,
    Cisco routers, and applications as Wireshark, FileZilla, and Nessus that will
    allow you to perform all of the tasks in this lab manual as if you were performing
    them in a live production environment. The heart of the VSCL is a Windows Workstation
    desktop configured to give you access to the tools and resources you need for
    each lab, without any special setup on your part.


    As noted in the following table, one of the exercises in this lab manual will
    be performed without using the VSCL. For detailed instructions on how to perform
    this exercise, please consult your syllabus or instructor.


    # How to Use This Lab Manual


    This lab manual features step-by-step instructions for completing the following
    hands-on lab exercises:


    | VSCL | LAB TITLE |

    |---|---|

    | No | Lab #1: Install a Core Linux Operating System on a Server |

    | Yes | Lab #2: Configure Basic Security Controls on a CentOS Linux Server |

    | Yes | Lab #3: Apply Hardened User Account Management and Security Controls |

    | Yes | Lab #4: Apply Hardened Linux File System Security Controls |

    | Yes | Lab #5: Apply Hardened Security for Linux Services and Applications |

    | Yes | Lab #6: Apply Hardened Security for Controlling Access |

    | Yes | Lab #7: Apply Hardened Security for the Linux Kernel |

    | Yes | Lab #8: Implement Best Practices for Secure Software Management |

    | Yes | Lab #9: implement Best Practices for Security Logging and Monitoring |

    | Yes | Lab #10: Define Linux OS and Application Backup and Recovery Procedures
    |'
  merge: -1
  img_proc: true
- pgno: 11
  md: '# Preface


    # Video Walkthroughs of Each Lab


    Each VSCL-based exercise in this lab manual includes a video walkthrough that
    gives you a quick overview of every step and function. You can watch the video
    walkthrough prior to performing the lab exercise, and refer to it as necessary
    when you complete the lab. You can pause, rewind, and fast-forward the video walkthroughs
    if you need to take notes or spend extra time on a particular step or function.
    Consult your syllabus or instructor for information on where to locate the walkthroughs.


    # Step-by-Step Instructions


    You''ll find it easy to complete these lab exercises by following the detailed
    step-by-step instructions. Each step is clearly broken down into sub-steps, and
    all actions are required to be noted in bold font. Screenshots are included to
    help you identify menu, dialog boxes, and input locations. If you get stuck on
    a step, refer to the lab video, which follows the order of the steps.


    # Deliverables


    At the completion of each lab, you''ll be asked to provide a set of deliverables
    to your instructor. These deliverables may include documents, files, screenshots,
    and/or answers to assessment questions. The deliverables are designed to test
    your understanding of the information, and your successful completion of the steps
    and functions of the lab. For specific information on deliverables, refer to the
    Deliverables section at the end of each lab.


    > Note: Some labs require the use of a word processor such as Microsoft Word for
    preparing and submitting deliverables. If you do not have access to a word processor,
    you can use OpenOffice on the Workstation desktop of the VSCL to prepare your
    documents. It includes a word processor called Writer that has all the features
    necessary for creating documents for use in these labs.


    # File Transfer


    At times, you may be asked to transfer to another computer files you have created
    while performing lab steps in the VSCL. This can be performed using the File Transfer
    function built into the vWorkstation desktop of the VSCL. Instructions for preparing
    and saving files using the File Transfer function can be found at the beginning
    of the video walkthrough for the first lab in each course (in most cases, Lab
    #1).


    > Note: Use of this lab manual or the VSCL does not require use of the textbook.
    If you have questions about whether a textbook is needed for your course, consult
    your instructor.'
  merge: -1
  img_proc: true
- pgno: 12
  md: '# # Install a Core Linux Operating System on a Server


    # ## Introduction


    In this lab, you will review screen captures from a recent installation of a CentOS
    Linux Server that document the installation process, including applying passwords,
    creating partitions, and establishing system administrator access controls. You
    will use the information provided in the screen captures to create an audit checklist
    when installing other secure Linux servers.


    This lab is a paper-based design lab and does not require use of the Virtual Security
    Cloud Lab (VSCL). To successfully complete the deliverables for this lab, you
    will need access to a text editor or word processor, such as Microsoft Word. For
    some labs, you may also need access to a graphics line drawing application, such
    as Visio or PowerPoint.


    > Note:\ If you don''t have a word processor or graphics package, use OpenOffice
    on the student learning vWorkstation for your lab deliverables and to answer the
    lab assessment questions. To capture screenshots, press Prt Sc > paste into a
    text document, and save the document in the Security_Strategies folder (C:\Security_Strategies)
    using the File Transfer function.


    # ## Learning Objectives and Outcomes


    Upon completing this lab, you will be able to:


    +   - Design an installation plan for the Linux operating system based upon necessary
    software

    - Design secured partitions within the core Linux server for desired security
    hardening, and application support

    - Understand how to enable a network time server during installation to maintain
    a synchronized time setting throughout the system

    - Create a non-privileged user account for system administration access as a secure
    alternative to logging in as a root user'
  merge: -1
  img_proc: true
