- pgno: 80
  md: '# # Apply Hardened Security for Linux Services and Applications


    # ## Introduction


    This lab is an extension of the previous labs, and it incorporates security hardening
    for Linux services and applications loaded in the physical server. In this lab,
    you will configure security and hardened services and applications to ensure the
    confidentiality, integrity, and availability of those services. You will configure
    and secure an Apache Web server and MySQL database and the components necessary
    to harden the implementation of both. You will also configure the Sendmail application
    for secure local messaging and enable secure, encrypted remote access using Secure
    Shell (SSH).


    # ## Learning Objectives


    Upon completing this lab, you will be able to:


    +   * Harden Linux server services when configuring them, and keep a security
    perspective during configuration

    * Perform basic security configurations to ensure that the system has been hardened
    before hosting a website

    * Configure and perform basic security for a MySQL database, understanding the
    ramifications of a default installation and recommending hardening steps for the
    database instance

    * Set up and perform basic security configuration for Sendmail to be able to leverage
    the built-in messaging capabilities of the Linux system

    * Enable and implement secure SSH for encrypted remote access over the network
    or across the Linux server system


