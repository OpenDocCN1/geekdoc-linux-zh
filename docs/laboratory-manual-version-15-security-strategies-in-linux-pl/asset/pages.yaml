- pgno: 8
  md: '# Ethics and Code of Conduct


    The material presented in this course is designed to give you a real-life look
    at the use of various tools and systems that are at the heart of every network
    security analyst''s daily responsibilities. Through use of this material, you
    will have access to software and techniques used every day by professionals. With
    this access come certain ethical responsibilities.


    The hardware, software, tools, and applications presented and used in this lab
    manual and/or the VSCLI are intended to be used for instructional and educational
    purposes only.


    As a student in this course, you are not to use these tools, applications, or
    techniques on live production IT infrastructures inside or outside of your campus
    or organization. Under no circumstances are you permitted to use these tools,
    applications, or techniques on the production IT infrastructures and networks
    of other organizations.


    You are required to conform to your school or organization''s Code of Conduct
    and ethics policies during the use of this lab manual and any of the tools, applications,
    or techniques described within.'
  merge: -1
  img_proc: true
