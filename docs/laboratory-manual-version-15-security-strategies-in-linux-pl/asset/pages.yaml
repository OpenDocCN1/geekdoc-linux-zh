- pgno: 162
  md: '# On-Hand Steps


    8. At the command prompt, type su -c ''tar zcvf lab10.tar.gz /etc /var '' and
    press Enter to archive and compress the /etc /var directories for backup.


    9. This command requires a password, type ISS316Security at the command prompt.

    The system will return all directories and files as they are backed up. This will
    take several minutes. Once the backup process is complete, the system will create
    a new compressed file lab10.tar.gz containing the contents of the /etc and /var
    directories.


    10. At the command prompt, type su -c ''openssl des3 -salt -out lab10.tar.gz.des3
    lab10.tar.gz '' and press Enter to encrypt the file.


    11. When prompted for a password, type ISS316Security.

    To finalize the encryption process, the system will prompt you for an encryption
    password.


    12. Type lab10 when prompted to enter a de-ede3-3c encryption password.

    13. Type lab10 when prompted to verify the de-ede3-3c encryption password.


    ![](img/2e1421b69289d83e7c4fd114dc4b0083_162_0.png)


    14. At the command prompt, type ls lab10.tar.gz.des3 and press Enter to verify
    that the new encrypted file has been created.

    The system will return the lab10.tar.gz.des3 file. If the system returns no such
    file or directory message, confirm your spelling in step 14 or repeat steps 10-13
    to ensure the file is created.


    15. At the command prompt, type su -c ''rm -f lab10.tar.gz '' and press Enter
    to delete (remove) the unencrypted file. When prompted for a password, type ISS316Security.


    16. Use the File Transfer button to download lab10.tar.gz to your local computer
    and submit it as part of your deliverables.


    > > Note:

    The next steps will simulate a deleted file, then you will decrypt the backup
    file and use it to restore the "deleted" data file (sendmail.mc). You will be
    keeping track of the time that it takes to perform the steps in this section.
    That time is the recovery time objective (RTO) for this data recovery. You will
    submit with that time your deliverables for this lab.'
  merge: -1
  img_proc: true
- pgno: 163
  md: '# LAB #10 | Define Linux OS and Application Backup and Recovery Procedures


    17. Check the system clock and record the start time ( ) for this set of steps.


    18. At the command prompt, type su -c '' mv /etc/mail/sendmail.mc /tmp '' and
    press Enter to move the sendmail.mc file to the /tmp directory storing a deleted
    configuration.


    19. When prompted for a password, type IS55316Security.


    20. At the command prompt, type su -c '' openssl des3 -d -salt -in lab10.tar.gz.des3
    -out lab10.tar.gz '' andnpress Enter to decrypt the backup file.


    21. When prompted for a password, type IS55316Security.


    22. When prompted for the password, type the de-eds3-cbc decryption password,
    type lab10.

    deryption process will take several seconds. Do not touch any keys until the prompt
    returns.


    23. At the command prompt, type su -c '' tar xvf lab10.tar.gz -c /etc/mail/sendmail.mc
    '' and press Enter to restore the sendmail configuration from the backup file
    to its appropriate location. Note the space on the backslash before /etc/mail...
    This is a required space and the command will not work without it.


    24. When prompted for a password, type IS55316Security.


    25. At the command prompt, type ls /etc/mail/sendmail.mc and press Enter to verify
    that the sendmail.mcfile has been restored.

    The system will return the sendmail.mc filename. If the system returns a No file
    or directory message, confirm your prompt in step 25 or repeat steps 20-25 to
    ensure the file is created.


    ![](img/2e1421b69289d83e7c4fd114dc4b0083_163_0.png)


    26. Check the system clock and record the stop time ( ) for this set of steps.


    27. Make a screen capture of the terminal window showing the results of the ls
    /etc/mail/sendmail.mccommand and paste it into a new text document.


    > Note:

    to capture the screen, press the Ctrl and PrtSc keys together, and then use Ctrl
    + V to paste the image into a Word or other processor document.'
  merge: -1
