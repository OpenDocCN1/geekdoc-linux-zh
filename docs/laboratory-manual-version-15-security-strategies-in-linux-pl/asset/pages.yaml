- pgno: 164
  md: '28. In your document, record the RTO (RTO=stop time less start time) for the
    recovery of the sendmail.


    > The next steps will restore a deleted file that was not captured in a backup
    data file. The system will hold deleted files in memory for a period of time with
    a process ID number (PID). As long as the file is still being referenced by the
    less command, you can restore it. You will first create a new file (acked.sh)
    that is not a part of the lab10.tar.gz backup and delete it. Finally, you will
    restore the file using the /proc command.


    29. At the command prompt, type vi hacked.sh and press Enter to open a new file
    called hacked.sh in the VI Editor.


    30. Press the I to enter INSERT mode.


    +   31. Use the arrow keys to locate the first blank line in the file and type
    the following line:

    - You have been hacked!


    ![](img/2e1421b69289d83e7c4fd114dc4b0083_164_0.png)


    32. Press the Esc key to exit the INSERT mode and press Shift + : to return to
    the command line mode. A colon with a blinking cursor at the bottom of the window
    indicates that you are in the command line mode.


    33. Type wq and press Enter to save your changes and exit the VI Editor.


    34. At the command prompt, type less hacked.sh and press Enter to view the contents
    of the hacked.sh file you just created.


    35. Hold CTRL and press the Z key to exit the less screen.


    36. At the command prompt, type rm -f hacked.sh and press Enter to delete the
    hacked.sh file.'
  merge: -1
  img_proc: true
- pgno: 165
  md: '# LAB #10 | Define Linux OS and Application Backup and Recovery Procedures


    37. At the command prompt, type /usr/bin/lsof | grep hacked and press Enter to
    verify that the file is being referenced by the command and obtain the process
    ID (PID).


    The PID is a numeric reference number for the file. The number may be different.


    ![](img/2e1421b69289d83e7c4fd114dc4b0083_165_0.png)


    38. Document the process ID for the hacked.sh file on your vWorkstation (PID=...).
    You will need it in the next step.


    39. At the command prompt, type cd /proc/PID/fd and press Enter to find the file
    in the system memory. Replace PID in this command line with the actual number
    you documented in step 38.


    40. At the command prompt, type ls -is and press Enter to find the file descriptor
    associated with the deleted file.


    Though several file may be returned, the correct descriptor will reference the
    previous location of the deleted file (/home/student/hacked.sh).


    ![](img/2e1421b69289d83e7c4fd114dc4b0083_165_1.png)'
  merge: -1
