  md: '# Hands-On Steps


    6. At the command prompt, type sudo /bin/iptables -L and press Enter to list the
    current host-based firewall rules.


    7. When prompted for a password, type sudo ISS316Security.

    The system returns a list of the existing INPUT, OUTPUT, and FORWARD chains indicating
    that there are no firewall rules set for any of them.


    FIGURE 6.4

    Existing INPUT, OUTPUT,

    and FORWARD chains


    ![](img/2e1421b69289d83e7c4fd114dc4b0083_102_0.png)


    8. At the command prompt, type sudo /bin/iptables -I INPUT -m state --state ESTABLISHED,RELATED
    -j ACCEPT and press Enter to add a new firewall rule that allows INPUT chains
    to the firewall rules and allow established connections.


    9. At the command prompt, type sudo /bin/iptables -A INPUT -p tcp --dport 80 -j
    ACCEPT and press Enter to add a new firewall rule that allows INPUT chains to
    the firewall rules and allow http (Web) access.


    10. At the command prompt, type sudo /bin/iptables -A INPUT -p tcp --dport 443
    -j ACCEPT and press Enter to add a new firewall rule that allows INPUT chains
    to the firewall rules and allow https (SSL) access.


    11. At the command prompt, type sudo /bin/iptables -A INPUT -p tcp --dport 22
    -j ACCEPT and press Enter to add a new firewall rule that allows INPUT chains
    to the firewall rules and allow secure shell (SSH) connections.


    12. At the command prompt, type sudo /bin/iptables -A INPUT -p icmp -j ACCEPT
    and press Enter to add a new firewall rule that allows INPUT chains to the firewall
    rules and allow ICMP ping.


    13. At the command prompt, type sudo /bin/iptables -A INPUT -p all -j DROP and
    press Enter to add a new firewall rule that denies all other traffic from the
    INPUT chains.


    14. At the command prompt, type sudo /bin/service iptables save and press Enter
    to save the rule you just created.

    The system returns an OK flag indicating that the rules have been saved.'
