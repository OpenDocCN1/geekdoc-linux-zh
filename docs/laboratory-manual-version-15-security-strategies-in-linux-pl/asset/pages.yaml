- pgno: 30
  md: 'Assessment Worksheet


    # LAB #1 – ASSESSMENT WORKSHEET


    # Install a Core Linux Operating System on a Server


    | Course Name and Number: |

    | Student Name: |

    | Instructor Name: |

    | Lab Due Date: |


    Overview

    In this lab, you reviewed screen captures from a recent installation of CentOS
    Linux Server that document the installation process, including applying passwords,
    creating partitions, and establishing system administrator access controls. You
    used the information provided in the screen captures to create an audit checklist
    to be used when installing other secure Linux servers.


    # Lab Assessment Questions & Answers


    +   1. During the install, the option to sync with an NTP (Network Time Protocol)
    server was checked. From a security perspective, why is it important for a system
    to keep accurate time?


    +   2. During the install, a password has been set for the “root” user. What is
    the “root” user, and when is it appropriate to use this account?


    +   3. During the install, X-Window and a desktop manager were installed. However,
    in a production environment it is recommended NOT to run the X-Window environment.
    Explain the purpose of this recommendation.'
  merge: -1
  img_proc: true
