  md: '# Hands-On Steps


    1. This lab begins with a request from your supervisor. As the newest member of
    the network administration team for a fictitious financial institution. First
    World Bank, you will be required to create an audit checklist based on the screen
    captures included in this lab. The checklist will be used in the future for ensuring
    secure Linux servers at the organization.


    > Note:

    The next steps include screen captures of a recent Linux installation. Use these
    screen captures as references as you create an Audit Checklist and Installation
    Summary that meets your company''s needs.


    2. In a new document, create an Audit Checklist and Installation Summary.

    You will follow the steps in this lab to complete the checklist as if you were
    part of the network administration team. You will be responsible for determining
    what to document in this report.

    3. In your text document, explain why it is especially important to physically
    secure Linux computers.

