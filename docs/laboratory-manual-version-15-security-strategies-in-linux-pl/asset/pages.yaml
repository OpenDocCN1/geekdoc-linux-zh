  md: '# Apply Hardened Security for Controlling Access


    # LAB 6


    # Introduction


    This lab is an extension of the previous labs, and it incorporates access control
    for the CentOS Linux Server. In this lab, you will first review current host-based
    IP firewall services, flush the current firewall configuration, and then reconfigure
    it with stringent permit/deny rule sets. You will also configure TCP Wrappers
    for unauthorized access controls and logging and SELinux for implementation of
    a layered security strategy.


    # Learning Objectives


    Upon completing this lab, you will be able to:


    +   * Review current internal host-based firewall parameters and configuration
    settings to verify allowed and denied IP communications

    * Configure an internal host-based firewall using iptables and create stringent
    allow/deny rules for services that may require remote access to the system

    * Harden the system by enabling TCP Wrappers to deny and log unauthorized attempts
    against services and ports running on the system

    * Secure processes running on the system by using and configuring SELinux to help
    perform more in-depth security

    * Verify configurations of the settings applied by connecting to the Linux server
    using SSH and connect to other services running on a Linux server


