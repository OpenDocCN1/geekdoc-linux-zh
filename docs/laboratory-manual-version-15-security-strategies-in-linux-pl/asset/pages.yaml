- pgno: 140
  md: '# # Implement Best Practices for Security Logging and Monitoring


    # Introduction


    In this lab, you will configure remote logging in the CentOS Linux Server and
    send syslogs to a remote host for secure secondary logging. You will use Tripwire,
    a third-party file integrity tool, to identify modifications to important system
    files. You will configure Rootkit Hunter (rkhunter), to look for rootkits and
    other anomalies on a set schedule. You will also search the log files for specific
    criteria.


    # Learning Objectives


    +   * Configure remote logging in the CentOS Linux Server and send syslogs and
    other events to a remote host for secure secondary logging

    * Search through different log files in the CentOS Linux Server to identify where
    certain types of logs are stored and how they get recycled

    * Configure the Tripwire file integrity tool so that modifications to important
    system files are quickly identified and properly logged locally and remotely

    * Configure and schedule rkhunter to run locally at said interval using the cron
    subsystem so that a rootkit can be properly properly and quickly identified if
    possible

    * Configure both automatic searches on log files as well as automatic running
    of important security applications to properly monitor a CentOS Linux Server for
    malicious activity


    | NAME | MORE INFORMATION |

    | --- | --- |

    | Tripwire | http://www.tripwire.com |

    | Rootkit Hunter | http://rkhunter.sourceforge.net/ |'
  merge: -1
  img_proc: true
