- pgno: 158
  md: '# # Define Linux OS and Application Backup and Recovery Procedures


    # ## Introduction


    In this lab, you will maximize availability and define a recovery time objective
    for data file backups and recovery on a production CentOS Linux Server. You will
    secure a data file backup using openssl encryption and restore the data file from
    the encrypted backup. You also will recover a deleted file using the /proc function.


    # ## Learning Objectives


    Upon completing this lab, you will be able to:


    +   - Ensure Linux OS, application, and data availability with documented backup
    and recovery procedures

    - Configure and perform backups within the Linux operating system as an automated
    and stable version of enhancing backup and recovery procedures and maximizing
    system availability

    - Encrypt backups in the Linux operating system as they are being performed and
    for securing data backups and storage

    - Restore encrypted backups for full recovery of the Linux OS as per defined recovery
    time objectives (RTO)

    - Back up and restore deleted files using /proc in Linux so that an entire system
    does not have to be restored in the instance of a deleted file


    | NAME | MORE INFORMATION |

    | --- | --- |

    | None | |'
  merge: -1
  img_proc: true
