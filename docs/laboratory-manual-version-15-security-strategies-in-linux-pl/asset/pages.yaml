- pgno: 34
  md: '# # Configure Basic Security Controls on a CentOS Linux Server


    In this lab, you will practice properly securing a Linux server system. You will
    perform the steps to secure the bootloader, enable iptables, and run SELinux to
    help lock down the Linux OS. You will also apply ACLs to directories and files
    to secure file and data access and then check those ACLs and permissions on the
    system.


    # ## Learning Objectives


    Upon completing this lab, you will be able to:


    +   - Configure the bootloader with the timeout to 0 and password credential to
    mitigate tampering with the GRUB loader and the boot sequence of the server

    - Verify SELinux mode on a CentOS Linux Server by viewing the configuration file
    and using the sestatus command

    - Create a student user account and add it to a user group for managing permissions
    and applying access controls across the system

    - Configure user groups with limited sudo access (with password credentials) to
    log and properly monitor access across the system

    - Create iptables set to "on" for runlevels 2 through 5 to enable an internal,
    host-based IP stateful firewall

    - Set restrictions and permissions for user access to files and system log files


    | TOOLS AND SOFTWARE USED |

