    序言 欢迎！本实验手册是完成本课程实验的逐步指南。


    # 云安全实验室 (VSCL)


    在本实验手册的大多数实验中，你将使用云安全实验室 (VSCL)。


    > 注意：

    云安全实验室需要使用 Windows Internet Explorer 或 Mozilla Firefox。目前该实验室不支持 Google Chrome、Safari
    或 Opera。


    VSCL 是一个系列虚拟资源，包括 Windows 和 Linux 服务器、Cisco 路由器以及 Wireshark、FileZilla 和 Nessus
    等应用程序，允许你像在实时生产环境中一样执行本实验手册中的所有任务。


    如下表所示，本实验手册中的一个实验将不使用 VSCL。有关如何执行该实验的详细说明，请咨询你的教学大纲或教师。


    # 如何使用本实验手册


