    # # Apply Hardened Security for Linux Services and Applications


    # ## Introduction


    This lab is an extension of the previous labs, and it incorporates security hardening
    for Linux services and applications loaded in the physical server. In this lab,
    you will configure security and hardened services and applications to ensure the
    confidentiality, integrity, and availability of those services. You will configure
    and secure an Apache Web server and MySQL database and the components necessary
