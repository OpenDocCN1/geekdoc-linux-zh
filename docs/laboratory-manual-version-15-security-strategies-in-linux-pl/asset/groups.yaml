    34. 在命令行提示符处，输入 `su -c /usr/bin/visudo` 并按回车，编辑用于 sudo 用户文件的 sudoers 配置文件。


    ![](img/2e1421b69289d83e7c4fd114dc4b0083_42_0.png)


    35. 按键 `I` 进入模式。


    36. 使用方向键在编辑器中找到 `%wheel ALL = NETWORKING, SOFTWARE, SERVICES, STORAGE, DELEGATING,
    PROCESSES, LOCATES` 行。在下一行的开头按回车开始新行。

    TargetRedHat11 已预配置，允许“wheel”组中的任何用户对此步骤列出的所有命令拥有 sudo 权限。


    37. 使用方向键移动到空行，输入 `%web ALL = NETWORKING, SOFTWARE, SERVICES, STORAGE, DELEGATING,
    PROCESSES, LOCATES`。

    此步骤创建了一个新组，该组将对此处列出的每个命令拥有 sudo 权限。


    ![](img/2e1421b69289d83e7c4fd114dc4b0083_42_1.png)


    ## 实验 #2 在 CentOS Linux 服务器上配置基本安全控制


    38. 拍摄显示新 web 组的窗口并将其粘贴到新的文本文档中。


    39. 按 `Esc` 键退出插入（INSERT）模式并按 `Shift + :` 返回命令行模式。窗口底部带有闪烁光标的冒号表示您正处于行模式。


    40. 输入 `wq` 保存更改并退出 sudoers 文件。


    > 注意：

    后续步骤将通过对临时文件设置不可变权限来在此服务器上应用安全措施。不可变（immutable）标记可以防止文件被删除，即使是具有 root 权限权限的人也不行。


    - 41. 在命令行提示符处，输入 `touch /tmp/mytest` 并按回车创建一个临时文件。

    - 42. 输入 `lsattr /tmp/mytest` 并按回车列出文件属性，查看新文件的当前权限。

    - 43. 输入 `su -c +i /tmp/mytest` 并按回车更改文件属性，并将不可变标记（i）添加到文件权限。

    - 44. 当提示密码时，输入 `ISS3316Security`。

    - 45. 输入 `lsattr /tmp/mytest` 并按回车列出文件属性，验证不可变标记是否已添加到文件权限。

    结果将包含一个小写的 `i`（例如 `----i----`）。


    ![](img/2e1421b69289d83e7c4fd114dc4b0083_43_0.png)


