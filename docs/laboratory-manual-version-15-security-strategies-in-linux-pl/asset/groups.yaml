    ________________________________________________________________________________________________________________________________________________________________________________________________________________________________________________________________\n\
    \n- 4. 为什么收到“无法重新挂载已挂载的文件（cannot remount filesystem mounted）”的错误？\n________________________________________________________________________________________________________________________________________________________________________________________________________________________________________________________________\n\
    ________________________________________________________________________________________________________________________________________________________________________________________________________________________________________________________________\n\
    \n- 5. /etc/fstab 文件有什么用？\n________________________________________________________________________________________________________________________________________________________________________________________________________________________________________________________________\n\
    ________________________________________________________________________________________________________________________________________________________________________________________________________________________________________________________________\n\
    \n- 6. 什么是 mount 命令？请解释。\n________________________________________________________________________________________________________________________________________________________________________________________________________________________________________________________________\n\
    ________________________________________________________________________________________________________________________________________________________________________________________________________________________________________________________________\n\
    _________________________________________________________________________________________________________________________________________________________________________________________________________________________________________________________________________________________________________________\n\
    \n- 7. Linux 中的 \"repquota\" 命令用于什么？请解释。\n\n# 为 Linux 服务和应用程序应用加固安全\n\n## 引言\n\
    \n本实验是之前实验的扩展，包含了对 Linux 服务和应用程序的安全加固。在本次实验中，你将配置安全加固的服务，以确保这些服务的机密性、完整性和可用性。你将配置并保护\
    \ Apache Web 服务器和 MySQL 数据库，以及加固这两个实现所需的所需的组件。你还将配置 Sendmail 应用程序进行安全消息，并使用安全\
    \ Shell（SSH）启用加密远程访问。\n\n## 学习目标\n\n完成本实验后，你将能够：\n\n- 在配置 Linux 服务时对其进行加固，并在配置过程中保持安全视角\n\
    - 执行基础安全配置，以在托管网站之前确保系统已加固\n- 为 MySQL 数据库配置并执行基础安全防护，理解默认安装的影响，并为数据库实例建议加固步骤\n\
    - 为 Sendmail 设置并执行基础安全配置，以利用 Linux 系统的内置功能\n- 启用并实现安全的 SSH，以便通过网络或跨 Linux 服务器进行加密远程访问\n\
    \n## 工具及所用软件\n\n| 名称 | 更多信息 |\n|---|---|\n| 无 | |\n\n## 交付物\n\n完成本实验后，你需要向你的导师提供以下交付物：\n\
    \n- 1. 一份包含以下内容截图的文本文档：\n    a. my.cnf 文件的输出；\n    b. httpd.conf 文件的输出；\n    c.\
    \ telnet 连接的输出；\n    d. sshd_config 文件的输出；\n    e. 显示 MOTD 的 VI 编辑器；\n    f. SSH\
