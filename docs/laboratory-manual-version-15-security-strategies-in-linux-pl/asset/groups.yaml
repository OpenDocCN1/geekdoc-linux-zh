    \ SELinux 设置，以查看哪些 Web 进程正在受保护。\n系统返回 `user_ucysystem_r:httpd_t` 标签下的进程列表。\n\n\
    53. 在命令提示符下，输入 `/usr/sbin/getsetboolean -a | grep http` 并按回车以查看 Web 服务器类型的布尔设置。\n\
    系统返回该项的设置列表，包括你将在本实验中修改的以下设置：\n\n- http_builtin_scripting --off (禁止 Web 服务器执行\
    \ PHP 和其他 Web 脚本)\n- http_can_sendmail --off (禁止 Web 服务器发送电子邮件)\n- http_use_nfs\
    \ --off (禁止 Web 服务器连接到远程 NFS 共享)\n\n54. 在命令提示符下，输入 `su -c '/usr/sbin/setboolean\
    \ -P httpd_builtin_scripting 1 '` 并按回车，允许 Web 服务器执行 Web 脚本。\n\n55. 当提示密码时，输入 `ISS5316Security`。\n\
    此命令可能需要一些时间来重新标签。在命令提示符返回之前，请按下任何键。\n\n56. 在命令提示符下，输入 `su -c '/usr/sbin/setboolean\
    \ -P httpd_can_sendmail 1 '` 并按回车以允许 Web 服务器发送邮件。\n\n57. 当提示密码时，输入 `ISS5316Security`。\n\
    此命令可能需要一些时间来重新标签。在命令提示符返回之前，请按下任何键。\n\n58. 在命令提示符下，输入 `su -c '/usr/sbin/setboolean\
    \ -P httpd_use_nfs 1 '` 并按回车以允许 Web 服务器连接到远程 NFS 共享。\n\n![](img/2e1421b69289d83e7c4fd114dc4b0083_108_0.png)\n\
