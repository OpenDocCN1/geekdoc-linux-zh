    > 注意：

    后续步骤将通过授予特殊权限允许用户访问服务器的日志文件，在此服务器上应用安全措施。您将为 wheel 组分配访问控制列表（ACL）。


    ## 动手操作步骤


    - 47. 输入 `su -c setfacl -m g:wheel:/var/log/messages` 并按回车为日志文件设置 ACL 权限。

    - 48. 输入 `getfacl /var/log/messages` 并按回车获取日志文件的当前权限，并验证设置是否正确。wheel 组现在可以访问日志文件了。

