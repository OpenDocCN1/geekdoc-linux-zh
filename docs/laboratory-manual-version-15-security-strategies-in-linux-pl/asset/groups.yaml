  mdcn: "\n\n# 前言\n\n# 每个实验的视频演示\n\n本实验手册中每个基于 VSCL 的练习都包含一个视频演示，帮助您快速概述每个步骤和功能。您可以在执行实验练习之前观看视频演示，并在完成实验时根据需要对其进行参考。如果您需要做笔记或在特定步骤或功能上花费额外时间，可以暂停、重回或快进视频演示。有关在何处找到这些视频演示的信息，请咨询您的教学大纲或讲师。\n\
    \n# 分步骤说明\n\n通过遵循详细的分步骤说明，您将轻松地完成这些实验练习。每个步骤都清晰地拆分为子步骤，并且所有要求的操作都将用**粗字体**标记。文档包含截图，以帮助您识别菜单、对话框和输入位置。如果您在某个步骤上遇到困难，请参考实验视频，视频的顺序与步骤一致。\n\
    \n# 交付物\n\n在完成每个实验后，您需要向教师提供一组交付物。这些交付物可能包括文档、文件、截图和/或评估问题的答案。交付物的设计目的是测试您对信息的理解，以及您是否成功完成了实验的步骤和功能。有关交付物的具体信息，请参阅每个实验末尾的交付物部分。\n\
    \n> 注意：某些实验需要使用 Microsoft Word 等文字处理程序来准备和提交交付物。如果您无法访问文字处理器，可以使用 VSCL 工作站桌面上的\
    \ OpenOffice 来准备您的文档。它包含一个名为 Writer 的文字处理器，具有创建用于这些实验的文档所需的所有功能。\n\n# 文件传输\n\n\
    有时，您可能被要求将执行 VSCL 实验步骤时创建的文件传输到另一台计算机。这可以使用 VSCL vWorkstation 桌面内置的物理传输功能来完成。有关如何使用文件传输功能准备和保存文件的说明，可以在每个课程第一个实验（通常情况下是实验\
    \ #1）的视频演示的开头找到。\n\n> 注意：使用本实验手册或 VSCL 不需要使用教科书。如果您对您的课程是否需要教科书有任何疑问，请咨询您的讲师。\n\
    \n# 在服务器上安装核心 Linux 操作系统\n\n## 简介\n\n在本实验中，您将查看最近安装的 CentOS Linux 服务器的截图，这些截图记录了安装过程，包括设置密码、创建分区以及建立系统管理员访问控制。您将利用截图提供的信息，在安装其他安全\
    \ Linux 服务器时创建一个审计检查清单。\n\n本实验是一个纸面设计实验，不需要使用虚拟安全云实验室（VSCL）。为了成功完成本实验的交付物，您需要访问文本编辑器或文字处理器（如\
    \ Microsoft Word）。对于某些实验，您可能还需要访问 Visio 或 PowerPoint 等图形线条绘图应用程序。\n\n> 注意：如果您没有文字处理器或图形软件包，请使用学生学习\
    \ vWorkstation 上的 OpenOffice 来完成实验交付物并回答实验评估问题。要截屏，请按 `Prt Sc` 粘贴到文本文档中，并使用文件传输功能将文档保存到\
    \ Security_Strategies 文件夹（C:\\Security_Strategies）中。\n\n## 学习目标与成果\n\n完成本实验后，您将能够：\n\
    \n- 根据所需的软件为 Linux 操作系统设计安装计划\n- 在核心 Linux 服务器内设计安全的分区，以实现所需的安全加固和应用支持\n- 理解在安装期间如何启用网络时间服务器，以维护整个系统的同步时间设置\n\
    - 创建非特权用户账户用于系统管理访问，作为以 root 用户身份登录的安全替代方案\n\n# 交付物\n\n完成本实验后，您需要向教师提供以下交付物：\n\
    \n1. 审计检查清单和安装总结：\n2. 实验 #1 的实验评估问题与答案。\n\n# 动手步骤\n\n1. 本实验始于主管的请求。作为虚构金融机构——第一世界银行（First\
    \ World Bank）网络管理团队的最新成员，您被要求根据本实验包含的截图创建一个审计检查清单。该清单在未来将用于确保组织内 Linux 服务器的安全性。\n\
    \n> 注意：\n接下来的步骤包含了最近 Linux 安装的截图。在创建符合公司需求的审计检查清单和安装总结时，请将这些截图作为参考。\n\n2. 在新文档中创建一个审计检查清单和安装总结。\n\
    \   您将遵循本实验中的步骤来完成清单，就像您是网络管理团队的一员一样。您将负责决定在报告中记录的内容。\n3. 在您的文本文档中，解释为什么物理保护 Linux\
    \ 计算机特别为重要。\n4. 查看以下截图。\n\n图 1.1\n在图形模式下接受新安装的默认设置，按 Enter \n\n![](img/2e1421b69289d83e7c4fd114dc4b0083_14_0.png)\n\
    \n图 1.2\n点击 Next 继续\n\n![](img/2e1421b69289d83e7c4fd114dc4b0083_14_1.png)\n\n\
    # 实验 #1 | 在服务器上安装核心 Linux 操作系统\n\n图 1.3\n\n选择合适的语言并点击 Next\n\n![](img/2e1421b69289d83e7c4fd114dc4b0083_14_0.png)\n\
    \n图 1.4\n选择合适的键盘并点击 Next\n\n![](img/2e1421b69289d83e7c4fd114dc4b0083_15_1.png)\
    \ 动手步骤\n\n如果这是一个新驱动器，安装程序将显示初始化选项。\n图 1.5\n从下拉菜单选择自定义布局\n\n![](img/2e1421b69289d83e7c4fd114dc4b0083_16_0.png)\n\
    \n图 1.6\n为 /boot 创建 ext2 文件系统，大小为 500\n\n![](img/2e1421b69289d83e7c4fd114dc4b0083_16_1.png)\n\
