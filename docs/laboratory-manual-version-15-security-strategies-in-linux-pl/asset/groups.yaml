    \ Security16。系统返回失败状态，表示 MySQL 服务未运行。\n\n- 8. 在命令提示符处输入 `sudo vi /etc/my.cnf`\
    \ 并按回车用 VI 编辑器打开配置文件。\n\n- 9. 提示密码时输入 Security16。\n\n- 10. 按 `I` 键进入插入模式。\n\n\
    - 11. 使用方向键找到文件中以下行：\n    * symbolic-links=0\n    * #skip-networking\n\n- 12.\
    \ 将光标移动到行首并删除 `#` 符号。\n\n图 5.5 修改 my.cnf 文件\n![](img/2e1421b69289d83e7c4fd11dc4b0083_84_1_png)\n\
    \n- 13. 截图 VI 编辑窗口并粘贴到新的文本文档中。\n\n注意：要捕捉屏幕，请同时按下 `Ctrl` 和 `PrtSc` 键，然后使用 `Ctrl\
    \ + V` 将图像粘贴到 Word 或其他文字处理文档中。\n\n- 14. 按 `Esc` 键退出插入模式并按 `Shift + :` 返回命令行模式。窗口底部带有闪烁的光标表示你正处于命令行模式。\n\
    \n- 15. 输入 `wq` 并按回车保存更改并退出 VI 编辑器。\n\n- 16. 在命令提示符处输入 `sudo /sbin/chkconfig --level\
    \ 3 mysql on` 并按回车，使数据库在运行级别 3 下自动启动。\n\n- 17. 在命令提示符处输入 `sudo /sbin/chkconfig\
    \ --list` 并按回车查看 MySQL 运行级别设置，验证服务在运行级别 3 已开启。虽然 sudo 命令通常需要密码，但在同一会话（如此实例）中重复使用\
    \ sudo 不需要再次输入密码。\n\n图 5.6 MySQL 运行级别设置\n![](img/2e1421b69289d83e7c4fd11dc4b0083_85_png)\n\
    \n- 18. 在命令提示符处输入 `sudo /sbin/service mysql start` 并按回车启动数据库服务器。系统返回 OK 标志，表示\
