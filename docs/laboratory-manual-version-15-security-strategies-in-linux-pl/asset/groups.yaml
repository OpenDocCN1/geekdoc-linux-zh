  mdcn: "\n\n# 实验 #6 | 应用加固安全以控制访问\n\n- 4. 使用以下凭据登录 TargetRedHat01 服务器：\n  - 用户名：student\n\
    \  - 密码：ISS5316Security\n\n将显示 GNOME 桌面，这是虚拟 Linux 服务器的图形用户界面 (GUI)。\n\n![](img/2e1421b69289d83e7c4fd114dc4b0083_101_0.png)\n\
    \n> 注意：\n接下来的步骤将通过配置严格的允许和拒绝规则集，为 LINUX 主机 IP 防火墙应用安全措施。你将向 INPUT、OUTPUT 和 FORWARD\
    \ 链添加规则以允许 HTTP、ICMP ping 和 SSH 访问，并拒绝所有其他访问。\n\n- 5. 双击 GNOME 桌面上的终端图标，打开终端模拟器并访问\
    \ Linux 服务器命令行。\n\n# 实践步骤\n\n6. 在命令提示符处，输入 `sudo /bin/iptables -L` 并按回车，列出当前的主机防火墙规则。\n\
    \n7. 当提示密码时，输入 `sudo ISS316Security`。\n系统返回现有的 INPUT、OUTPUT 和 FORWARD 链列表，表明其中任何一个链都没有设置防火墙规则。\n\
    \n图 6.4\n现有的 INPUT、OUTPUT\n和 FORWARD 链\n\n![](img/2e1421b69289d83e7c4fd114dc4b0083_102_0.png)\n\
    \n8. 在命令提示符处，输入 `sudo /bin/iptables -I INPUT -m state --state ESTABLISHED,RELATED\
    \ -j ACCEPT` 并按回车，添加新的防火墙规则，允许 INPUT 链通过并允许已建立的连接。\n\n9. 在命令提示符处，输入 `sudo /bin/iptables\
    \ -A INPUT -p tcp --dport 80 -j ACCEPT` 并按回车，添加新的防火墙规则，允许 INPUT 链通过 http (Web)\
    \ 访问。\n\n10. 在命令提示符处，输入 `sudo /bin/iptables -A INPUT -p tcp --dport 443 -j ACCEPT`\
    \ 并按回车，添加新的防火墙规则，允许 INPUT 链通过 https (SSL) 访问。\n\n11. 在命令提示符处，输入 `sudo /bin/iptables\
    \ -A INPUT -p tcp --dport 22 -j ACCEPT` 并按回车，添加新的防火墙规则，允许 INPUT 链通过安全外壳 (SSH)\
    \ 连接。\n\n12. 在命令提示符处，输入 `sudo /bin/iptables -A INPUT -p icmp -j ACCEPT` 并按回车，添加新的防火墙规则，允许\
    \ INPUT 链通过 ICMP ping 访问。\n\n13. 在命令提示符处，输入 `sudo /bin/iptables -A INPUT -p all\
    \ -j DROP` 并按回车，添加新的防火墙规则，拒绝来自 INPUT 链的所有其他流量。\n\n14. 在命令提示符处，输入 `sudo /bin/service\
    \ iptables save` 并按回车，保存你刚刚创建的规则。\n系统返回 OK 标志，表示规则已保存。\n\n# 实验 #6 | 控制访问的加固安全\n\
    \n15. 对终端窗口进行截图，显示 `iptables` 命令的结果，并粘贴到新的文本文档中。\n\n> 注意：要进行截图，请同时按下 Ctrl 和 PrSc\
    \ 键，然后使用 Ctrl + V 将图像粘贴到 Word 或其他文字处理器文档中。\n\n16. 在命令提示符处，输入 `sudo /sbin/iptables\
    \ -L` 并按回车，列出新保存的防火墙规则。系统返回现有的 INPUT、OUTPUT 和 FORWARD 命令列表，包括你在本实验中创建的防火墙规则。\n\
    \n## 6.5\nINPUT 链的新防火墙规则\n\n![](img/2e1421b69289d83e7c4fd114dc4b0083_103_0.png)\n\
    \n17. 对终端窗口进行截图，显示 `iptables -L` 的输出，并将其粘贴到你的文本文档中。\n\n> 注意：接下来的步骤将通过配置 TCP Wrappers，在此服务器上拒绝并记录来自特定域名\
    \ (hackers.com) 的所有连接。你将修改 `hosts.deny` 配置文件并尝试建立 SSH 连接以验证你的更改。\n\n18. 在命令提示符处，输入\
    \ `su -c 'vi /etc/hosts.deny'` 并按回车，在 VI 编辑器中打开 `hosts.deny` 配置文件。\n\n19. 当提示密码时，输入\
    \ `ISS316Security`。\n\n20. 按键进入 **INSERT** (插入) 模式。\n\n21. 使用方向键找到文件中的第一个空行，并输入以下新行：\n\
    \n- ALL: .hackers.com:severity emergent\n\n![](img/2e1421b69289d83e7c4fd114dc4b0083_104_0.png)\n\
    \n22. 按 `Esc` 键退出插入模式，并按 `Shift + :` 返回命令模式。窗口底部带有闪烁光标的冒号表示你正处于命令行模式。\n\n23. 输入\
    \ `w` 并按回车保存更改并退出 VI 编辑器。\n\n24. 在命令提示符处，输入 `/sbin/ifconfig eth0` 并按回车，查找 eth0\
    \ 接口的 IP 地址 (inet addr)。\n\n25. 记录你找到的 eth0 IP 地址。\n\n26. 在命令提示符处，输入 `su -c 'vi\
    \ /etc/hosts.deny'` 并按回车打开 `hosts.deny` 配置文件。\n\n27. 当提示密码时，输入 `ISS316Security`。\n\
    \n28. 按键进入 **INSERT** (插入) 模式。\n\n29. 使用方向键找到文件中的第一个空行，并输入以下新行：\n- ALL: .hackers.com:severity\
    \ emergent\n\n30. 按 `Esc` 键退出插入模式，并按 `Shift + :` 返回命令模式。\n\n31. 输入 `w` 并按回车保存更改并退出\
    \ VI 编辑器。\n\n32. 在命令提示符处，输入 `/sbin/ifconfig eth0` 并按回车，查找 eth0 接口的 IP 地址。\n\n\
