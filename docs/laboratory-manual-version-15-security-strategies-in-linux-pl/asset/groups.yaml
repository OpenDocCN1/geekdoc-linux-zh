    53. 对显示更改的 VI 编辑器窗口进行截图，并将其粘贴到你的文本文档中。注意，你可能需要多张截图才能显示所有的更改。


    # 在线步骤


    54. 按 `Esc` 键退出插入模式（INSERT mode），并按 `Shift + :` 返回命令行模式。窗口底部带有闪烁光标的冒号表示你正处于命令行模式。


    55. 输入 `wq` 并按回车键保存更改并退出 VI 编辑器。


    56. 在命令提示符下，输入 `su -c /etc/motd` 并按回车键用 VI 编辑器打开 MOTD（每日消息）横幅文件。


    57. 当提示密码时，输入 `ISS316Security`。


    58. 按 `i` 键进入插入模式。


    59. 使用方向键将光标移动到第一行的开头，输入 `PROPERTY OF FIRST WORLD BANK SAVINGS AND LOAN. AUTHORIZED
    USERS ONLY!`。


    60. 对显示更改的 VI 编辑器进行截图，并将其粘贴到你的文本文档中。


    # 图 5.14


    修改 motd 文件


    ![](img/2e1421b69289d83e7c4fd114dc4b0083_92_0.png)


    61. 按 `Esc` 键退出插入模式，并按 `Shift + :` 返回命令行模式。窗口底部带有闪烁光标的冒号表示你正处于命令行模式。


    62. 输入 `wq` 并按回车键保存更改并退出 VI 编辑器。


    63. 在命令提示符下，输入 `sudo /sbin/service sshd status` 并按回车键检查打开的 SSH 器的状态。


    64. 此命令需要 root 权限，因此在提示密码时输入 `ISS316Security`。系统将返回一个指示表示 openssh-daemon 正在运行。


    65. 在命令提示符下，输入 `sudo /sbin/service sshd reload` 并按回车键重新加载打开的 SSH 配置文件并使更改生效。系统会返回
    OK 标志，表示 SSH 服务正在重新加载。


    # 实验 #5 | Linux 服务与应用程序的安全加固


    66. 在命令提示符下，输入 `ssh localhost` 并按回车键建立到本地的 SSH 连接。


    系统返回一个错误，表示无法建立连接。


    67. 当提示继续连接时，输入 `yes` 并按回车键。

    SSH 服务器将拒绝访问，因为没有使用密钥，这表明你对 `PasswordAuthentication` 行的更改配置正确。


    ![](img/2e1421b69289d83e7c4fd114dc4b0083_93_0.png)


    68. 对显示每日消息横幅的终端窗口截图，并将其粘贴到你的文本文档中。


    69. 关闭终端窗口。


    70. 关闭 TargetRedHat01 窗口。


    71. 在提示断开会话时点击断开（Disconnect）。


    72. 关闭 ISSA_VM Server Farm_RDP 文件夹。


    73. 使用文件传输（File Transfer）按钮将文件下载到本地计算机并作为交付提交。


