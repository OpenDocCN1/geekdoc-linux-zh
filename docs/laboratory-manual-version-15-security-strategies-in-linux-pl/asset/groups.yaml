  mdcn: "\n\n12. 使用逻辑卷管理器 (LVM) 进行分区如何帮助实现安全 CIA 三要素中的机密性完整性和可用性？\n\n13. 选择“最小”（minimal）软件安装选项时可以实现哪些安全优势？\n\
    \n14. 你如何自动化一个面向安全的 CentOS 或 Red Hat 安装？\n\n15. “firstboot”的目的是什么？\n\n# 在 CentOS\
    \ Linux 服务器上配置基础安全控制\n\n在本实验中，你将练习如何妥善地保护 Linux 服务器系统。你将执行相关步骤来保护引导加载程序、启用 iptables\
    \ 并运行 SELinux 以帮助锁定 Linux 操作系统。你还将对目录和文件应用 ACL 以确保文件和数据访问安全，然后在系统上检查这些 ACL 权限设置。\n\
    \n## 学习目标\n\n完成本实验后，你将能够：\n\n- 配置引导加载程序，将超时设置为 0 并设置密码凭据，以防止对 GRUB 加载器和服务器启动序列的篡改\n\
    - 通过查看配置文件和使用 `sestatus` 命令验证 CentOS Linux 服务器上的 SELinux 模式\n- 创建学生用户账户并将其添加到用户组，以便在整个系统中管理权限并应用访问控制\n\
    - 配置具有有限 sudo 访问（带密码凭据）的用户组，以记录并适当监控整个系统的访问情况\n- 为运行级别 2 到 5 设置 iptables 为“开启”，以启用内部的、基于主机的\
    \ IP 状态防火墙\n- 为用户访问文件和系统日志文件设置限制和权限\n\n| 使用的工具和软件 |\n| 名称 | 更多信息 |\n| 无 | |\n\n\
    # 交付成果\n\n完成本实验后，你需要向讲师提供以下交付成果：\n\n- 1. 一份包含以下内容的文本文档：\n   a. 你对 `grub.conf`\
    \ 文件的修改；\n   b. 你对 SELinux 配置文件的修改；\n   c. 你对运行级别 2 到 5 防火墙的修改；\n   d. 你对 sudoers\
