    - 1. 本实验从 VSCL 的学生登录界面 vWorkstation 虚拟机桌面开始，如图所示。


    图 7.1

    “学生登录界面”

    VSCL 工作站


    ![](img/2e1421b69289d83e7c4fd114dc4b0083_116_0.png)


    - 2. 双击桌面上的 `ISSA_VM Server Farm_RDP` 图标。此文件夹包含此实验环境中虚拟服务器的链接。


    - 3. 双击 `TargetRedHat01` 文件以打开 Linux 服务器。


    图 7.2

    打开到 TargetRedHat01 服务器的远程桌面连接


    C:\Documents and Settings\Administrator\Desktop\ISSA_VM Server Farm_RDP

    | 名称 Name | 大小 | 类型 | 修改日期 | 属性 |

    |---|---|---|---|---|

    | targetRedHat01 | - | 快捷方式 | 2021/10/21 11:09 AM | |


    # 实验 #7 | 为 Linux 内核应用加固安全


    - 4. 使用以下凭据登录 TargetRedHat01 服务器：

    * 用户名：student

    * 密码：ISS3166Security


    显示 GNOME 提示符，即虚拟 Linux 服务器的图形用户界面 (GUI)。


    # 图 7.3

    GNOME 桌面


    ![](img/2e1421b69289d83e7c4fd114dc4b0083_117_0.png)


    > 注意：

    接下来的步骤将通过调整 CentOS Linux 参数为 MySQL 数据库应用加固安全措施。你将首先查看正在运行内核的现有设置，然后修改系统控制配置 (`sysctl.conf`)
    文件以启用 SYN cookies 并更改学生用户可以打开的文件最大数。


    - 5. 双击 GNOME 桌面上的 `Terminal` 图标打开终端模拟器并访问 Linux 服务器命令行。

    - 6. 在命令提示符处，输入 `cat /etc/sysctl.conf | less` 并按回车查看正在运行内核的当前设置。

    系统将返回预设配置列表。使用方向键查看这些设置。

    - 7. 输入 `q` 并按回车返回命令提示符。

    - 8. 在命令提示符处，输入 `su -c '' vi /etc/sysctl.conf ''` 并按回车在 VI 编辑器中打开系统控制配置文件。

    - 9. 当提示密码时，输入 `ISS316Security`。

    - 10. 按 `I` 键进入插入（INSERT）模式。

    - 11. 使用方向键在文件中定位到以下行：

    * `net.ipv4.tcp_syncookies=0`


    # 实验步骤


    - 12. 将 `0` 替换为 `1` 以启用 SYN cookies。


    ![](img/2e1421b69289d83e7c4fd114dc4b0083_118_0.png)


    - 13. 对当前配置进行截图并粘贴到新的文本文档中。


    > 注意：要截屏，按下 `Ctrl` 和 `PrtSc` 键，然后使用 `Ctrl + V` 将图像粘贴到 Word或其他文字处理器文档中。


    - 14. 按 `Esc` 键退出插入模式，并按 `Shift + :` 返回命令行模式。窗口底部带有闪烁光标的冒号表示你正处于命令模式。


    - 15. 输入 `wq` 并按回车保存更改并退出 Vi 编辑器。


    - 16. 在命令提示符处，输入 `su -c ''echo "1" >/proc/sys/net/ipv4/tcp_syncookies ''` 并按回车，无需重启即可更改
    SYN cookies 设置。


    - 17. 当提示密码时，输入 `ISS316Security`。


    # 实验 #7 | Linux 内核加固安全


    - 18. 在命令提示符处，输入 `cat /proc/sys/net/ipv4/tcp_syncookies` 并按回车查看当前内核参数。


    运行时数据中的 `1` 表示设置已更改且 SYN cookies 已启用。


    ![](img/2e1421b69289d83e7c4fd114dc4b0083_119_0.png)


    - 19. 在命令提示符处，输入 `/sbin/sysctl -a | less` 并按回车查看运行内核的所有可用参数。

