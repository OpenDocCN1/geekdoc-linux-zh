  mdcn: "\n\n# 应用加固的 Linux 文件系统安全控制\n\n| 课程名称和编号： | |\n|---|---|\n| 学生姓名: | |\n| 导师姓名:\
    \ | |\n| 实验截止日期: | |\n\n## 概述\n\n本实验是之前实验的扩展。它包含了对文件系统和挂载文件系统的用户访问的安全加固。在本次实验中，你在\
    \ CentOS Linux 服务器上挂载了一个没有执行权限的文件系统。你还挂载了一个远程文件系统并为挂载文件系统的用户设置了配额。\n\n## 实验评估问题与解答\n\
