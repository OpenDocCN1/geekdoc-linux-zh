    3. SELinux 有哪种模式？解释其基本功能。\n4. 考虑以下防火墙规则，并描述：\n5. 使用什么命令允许所有？\n6. 使用什么开关查看配置？\n\
    7. 如果在某处允许而在另一处拒绝，结果是什么？\n8. 规则的顺序重要吗？\n9. 如果文件不存在会发生什么？\n\n# 应用 Linux 内核安全\n\n\
