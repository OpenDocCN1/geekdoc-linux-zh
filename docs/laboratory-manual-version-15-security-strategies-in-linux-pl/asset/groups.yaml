    \ Server Farm）图标。该文件夹包含指向该环境中虚拟服务器的链接。\n\n- 3. 双击 TargetHat01 文件打开 Linux 服务器。\n\
    \n图 5.2 打开到 TargetHat01 服务器的远程桌面连接\n\n| 名称 | 大小 | 类型 | 修改日期 | 属性 |\n|---|---|---|---|---|\n\
    | TargetHat01 | 2 KB | 文件夹 | 2013/10/27 11:03 AM | A |\n\n- 4. 使用以下凭据登录 TargetHat01\
    \ 服务器：\n    - 用户名: student\n    - 密码: Security16\n\n显示虚拟 Linux 服务器的图形用户界面（GUI）GNOME\
    \ 桌面。\n![](img/2e1421b69289d83e7c4fd11dc4b0083_83_png)\n\n注意：后续步骤将通过修改 my.cnf\
    \ 配置文件为 MySQL 数据库应用程序应用安全措施。你将添加 skip-networking 以防止远程访问数据库，并禁止加载本地数据文件。你还将配置数据库在运行级别\
    \ 3 下自动启动，并设置 MySQL root 密码。\n\n- 5. 双击 GNOME 桌面上的终端图标打开终端模拟器并访问 Linux 服务器命令行。\n\
    \n- 6. 在命令提示符处输入 `sudo /bin/service mysql status` 并按回车检查 MySQL 服务的状态。\n\n图 5.4\
