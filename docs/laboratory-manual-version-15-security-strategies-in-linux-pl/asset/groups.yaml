    38. 记录你 vWorkstation 上 `hacked.sh` 文件的进程 ID (PID=...)。你将在下一步中需要它。


    39. 在命令提示符下，输入 `cd /proc/PID/fd` 并按回车，在系统内存中查找该文件。将此命令行中的 PID 替换为你在第 38 步中记录的实际数字。


