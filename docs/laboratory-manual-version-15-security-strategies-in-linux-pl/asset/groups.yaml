    # Hand-On Steps


    48. Make a screen capture of the terminal window showing the SELinux status and
    paste it into your text document.


    49. At the command prompt, type sudo /bin/service http status and press Enter
    to check the status of http service.


    50. When prompted for a password, type ISS5316Security.

    The system returns a message indicating that the http service stopped.


    51. At the command prompt, type sudo /sbin/service http start and press Enter
    to start the http (Web) service.

    The system will return an OK flag indicating that the service is running.


    52. At the command prompt, type ps -Z http and press Enter to see the SELinux
    setting to see which Web processes are currently protected.

    The system returns a list of processes under the label user_ucysystem_r:httpd_t.


    53. At the command prompt, type /usr/sbin/getsetboolean -a | grep http and press
    Enter to view the Boolean settings for the Web server type.

    The system returns a list of settings for this, including the following settings
    that you will modify during this lab:


    +   - http_builtin_scripting --off (prohibits the Web server from executing PHP
    and other Web scripts)

    - http_can_sendmail --off (prohibits the Web server from sending e-mail)

    - http_use_nfs --off (prohibits the Web server from connecting to a remote NFS
    share)


    54. At the command prompt, type su -c ''/usr/sbin/setboolean -P httpd_builtin_scripting
    1 '' and press Enter to toallow the Web server to execute Web scripts.


    55. When prompted for a password, type ISS5316Security.

    This command may take a few moments to relapse. Do not press any keys until the
    command prompt returns.


    56. At the command prompt, type su -c ''/usr/sbin/setboolean -P httpd_can_sendmail
    1 '' and press Enter to allow the Web server to send mail.


    57. When prompted for a password, type ISS5316Security.

    This command may take a few moments to relapse. Do not press any keys until the
    command prompt returns.


    58. At the command prompt, type su -c ''/usr/sbin/setboolean -P httpd_use_nfs
    1 '' and press Enter to allow the Web server to connect to a remote NFS share.


    ![](img/2e1421b69289d83e7c4fd114dc4b0083_108_0.png)'
