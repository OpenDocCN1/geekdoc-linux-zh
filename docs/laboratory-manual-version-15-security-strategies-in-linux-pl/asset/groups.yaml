    # LAB #6 – ASSESSMENT WORKSHEET


    # Apply Hardened Security for Controlling Access


    | Course Name and Number: |

    | Student Name: |

    | Instructor Name: |

    | Lab Due Date: |


    # Overview


    This lab is an extension of the previous labs, and it incorporated access control
    for the CentOS Linux Server. In this lab, you first reviewed current host-based
    IP firewall services, flushed the current firewall configuration, and then re-configured
    it with stringent permit/deny rule sets. You also configured TCP Wrappers for
    unauthorized access controls and logging and SELinux for implementation of a layered
    security strategy.


    # Lab Assessment Questions & Answers


    +   1. Suppose the domain hackers.com is denied for all services in the hosts.deny,
    and the hosts.allow file has the rule ALL: All. Will TCP Wrappers allow hackers.com
    access anyway?


    +   2. How do you enable SELinux?'
