    # Apply Hardened Linux File System Security Controls


    # LAB 4


    # Introduction


    This lab is an extension of the previous labs. It incorporates security hardening
    for file systems and user access to mounted file systems. In this lab, you will
    mount a file system on the CentOS Linux Server that does not have execute permissions.
    You will also mount a remote file system and set quotas for users of mounted file
    systems.


    # Learning Objectives


    Upon completing this lab, you will be able to:


    +   - Mount a file system without execute permissions, so you can safely read
    the data contained in the disk without executing any unexpected programs

    - Mount a remote file system and configure the system to be mounted at boot time
    for an automatic network share on a Linux system

    - Set user quotas on disk to protect the availability and security on the Linux
    system and prevent users from taking up all the disk drive on the system

    - Edit and modify the /etc/fstab file to manage local and remote NFS shares as
    well as the necessary disk mounting configurations required

    - Configure and use the repquota command to verify usage of disk space by users
    and manage quotas


