    # # Implement Best Practices for Security Logging and Monitoring


    # Introduction


    In this lab, you will configure remote logging in the CentOS Linux Server and
    send syslogs to a remote host for secure secondary logging. You will use Tripwire,
    a third-party file integrity tool, to identify modifications to important system
    files. You will configure Rootkit Hunter (rkhunter), to look for rootkits and
    other anomalies on a set schedule. You will also search the log files for specific
    criteria.


