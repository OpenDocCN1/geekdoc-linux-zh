    \n![](img/2e1421b69289d83e7c4fd114dc4b0083_109_0.png)\n\n60. 在命令提示符下，输入 `/usr/sbin/getsebook\
    \ -a | grep` 并按回车查看 Web 服务器类型的设置。\n系统返回该类型的设置列表；包括你已在本实验中修改的以下设置：\n\n- httpd_builtin_scripting\
    \ -> off (允许 Web 服务器执行 PHP 和其他 Web 脚本)\n- httpd_can_sendmail -> off (允许 Web 服务器发送电子邮件)\n\
    - httpd_use_nfs -> off (允许 Web 服务器连接到远程 NFS 共享)\n\n![](img/2e1421b69289d83e7c4fd114dc4b0083_109_1.png)\n\
