    - 20. 对当前配置进行截图并粘贴到文本文档中。

    - 21. 输入 `q` 返回命令提示符。

    - 22. 在命令提示符处，输入 `su -c ''/sbin/sysctl -w fs.file-max=100000 ''` 并按回车，将用户一次可以打开的文件最大数改为
    `100000`。

    - 23. 当提示密码时，输入 `ISS316Security`。


    > 注意：接下来的步骤将通过 `cat` 命令获取进程、文件系统、模块以及关于当前运行内核的其他信息，以此对该服务器进行安全加固。你需要将输出结果作为实验交付物。


    # 实验步骤


    - 24. 在命令提示符处，输入 `cat /proc/filesystems` 并按回车查看当前文件系统。

