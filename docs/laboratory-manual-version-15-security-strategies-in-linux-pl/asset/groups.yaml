    # 实验 #5 | Linux 服务与应用程序的安全加固


    52. 将光标移动到行首，并删除存在的 `#` 符号，同时进行以下更改：


    - PermitRootLogin no（此设置禁用了 root 用户的登录权限）。

    - PasswordAuthentication no（此设置禁用了密码登录）。

    - UsePam no（此设置禁用了可插认证模块）。

    - Banner /etc/motd（此设置向所有尝试登录的用户显示 MOTD 警告信息）。


