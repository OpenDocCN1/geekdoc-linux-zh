  - '[PAGE 114]


    # Apply Hardened Security for the Linux Kernel


    # Introduction


    This lab is an extension of the previous labs, and it incorporates security hardening
    for the Linux kernel with security parameters. In this lab, you will view and
    tune all kernel parameters and discover information regarding the current Loadable
    Kernel Modules (LKMs) and information about the kernel itself. The kernel is the
    core, or base component, of the OS and consists of program code that runs and
    manages all other code and resources. Finally, you will also enable and interpret
    the results of the lsmod command.


    # Learning Objectives


    Upon completing this lab, you will be able to:


    +   * Review and tune the kernel parameters on a CentOS Linux Server for security
    and monitoring purposes

    * Produce kernel versions and loaded options for a better understanding of how
    the system is configured and to identify potential security vulnerabilities in
    the CentOS Linux Server

    * Edit /etc/sysctl.conf file and adjust tcp_syncookies settings to configure secure
    options for users on a CentOS Linux Server

    * Review and assess the Loaded Kernel Modules (LKMs) of the target Linux system
    and provide recommendations on the output and current running configuration

    * Use and interpret the lsmod command output and perform security hardening configurations
    on the CentOS Linux Server


    | TOOLS AND SOFTWARE USED |

    | NAME | MORE INFORMATION |

    | None | |'
