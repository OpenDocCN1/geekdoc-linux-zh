    # How can I protect my password?


    - Change your password once a month.

    - Change your password immediately if you suspect someone knows your password.

    - Never write down your password.

    - Never share your password with other people.

    - Use a different password for each account set up on your computer.


    ![](img/e2eac216eed4c6806c742998f1420a0c_182_0.png)


    ![](img/e2eac216eed4c6806c742998f1420a0c_182_1.png)


    ![](img/e2eac216eed4c6806c742998f1420a0c_182_2.png)


    Click this area and type a new password.


    Click OK to continue.


    Click this area and retype the new password.


    Click OK. Linux changes the password for the account.


    Note: If Linux does not ask you to retype your password, the password was not
    accepted. Repeat steps 1 to 8 with another password. For information on choosing
    a password, see the top of 167.


    # LOG ON AS ANOTHER USER


    If you share your computer with others, you can log out so another person can
    log on and use the computer.


    ![](img/e2eac216eed4c6806c742998f1420a0c_183_0.png)


    When you installed Linux, you created one or more user accounts. To create a user
    account after you install Linux, see page 164.


    # LOG ON AS ANOTHER USER


    ![](img/e2eac216eed4c6806c742998f1420a0c_183_1.png)


    ![](img/e2eac216eed4c6806c742998f1420a0c_183_2.png)


    # LOG OUT


    1. Click to display the Main Menu.

    2. Click Log out.


    A dialog box appears, confirming that you want to log out.


    4. Click Yes to log out.

    3. Click Logout (changes to).


    # WORK WITH ACCOUNTS


    Will I ever need to log on as another user if I am the only person using my computer?


    If you are the only person using your computer, you can log on as another user
    to switch between the root account and your user account. When performing daily
    tasks, you should work in a user account. You should only use the root account
    when performing administrative tasks, such as setting up hardware.


    ![](img/e2eac216eed4c6806c742998f1420a0c_184_0.png)


    ![](img/e2eac216eed4c6806c742998f1420a0c_184_1.png)


    ![](img/e2eac216eed4c6806c742998f1420a0c_184_2.png)


    # LOG ON


    - A dialog box appears, asking for the user name of the person who wants to log
    on to the computer.

    - Type the user name and then press the Enter key.

    - Type the password and then press the Enter key.

    - The person is logged on the computer and can begin using Linux.


    Note: A symbol (*) appears for each character you type to prevent others from
    seeing the password.


    Note: For information on the windows that appear when Linux starts, see page 29.


    ![](img/e2eac216eed4c6806c742998f1420a0c_185_0.png)


    # Work With Floppy and CD-ROM Drives


    This chapter will teach you how to use Linux to work with information stored on
    floppy disks and CD-ROM discs.


    - Display Contents of a Linux Floppy Disk ..........................................176

    - Set Up Linux to Use MS-DOS Floppy Disks.......................................
    178

    - Mount an MS-DOS Floppy Disk ................................................
    182

    - Display Contents of an MS-DOS Floppy Disk ...................... 184

    - Copy a File to a Floppy Disk ....................................... 186

    - Format a Floppy Disk ................................................ 188

    - Display Contents of a CD-ROM Disc ............................... 190

    - Play a Music CD ...................................................... 192


    ![](img/e2eac216eed4c6806c742998f1420a0c_186_0.png)


    # DISPLAY CONTENTS OF A LINUX FLOPPY DISK


    You can display the contents of a Linux floppy disk. This lets you review and
    make changes to the files stored on the disk.


    ![](img/e2eac216eed4c6806c742998f1420a0c_187_0.png)


    To display the contents of an MS-DOS floppy disk, see pages 182 to 185.


    # DISPLAY CONTENTS OF A LINUX FLOPPY DISK


    ![](img/e2eac216eed4c6806c742998f1420a0c_187_1.png)


    1. Insert the floppy disk that contains the files you want to display into your
    floppy drive.

    2. Double-click the **Floppy** icon.

    A window appears, displaying the contents of the floppy disk. The **Floppy** directory
    is highlighted. This directory contains the contents of the floppy disk.

    The contents of the floppy disk appear in this area.


    # WORK WITH FLOPPY AND CD-ROM DRIVES


    # Why can''t I save the changes I made to a floppy disk?


    You may not have permission to make changes to the file. To change the file, perform
    one of the following tasks:


    - Log on to your computer using the root account as shown on page 172. The root
    account can always make changes to the files on a floppy disk.

    - Change the permissions for the file as shown on page 74. You must be logged
    on to your computer using the root account to change the permissions for the file.


    ![](img/e2eac216eed4c6806c742998f1420a0c_188_0.png)


    ![](img/e2eac216eed4c6806c742998f1420a0c_188_1.png)


    To open a file, double-click the file. For more information on opening files,
    see page 62.


    When you finish reviewing the contents of the floppy disk, click X to close the
    window.


    # UNMOUNT A LINUX FLOPPY DISK


    Click Unmount device.


    When you finish working of a floppy disk, you must unmount the disk. You may now
    remove the floppy disk from your floppy drive.


    Right-click the Floppy icon. A menu appears.


    ![](img/e2eac216eed4c6806c742998f1420a0c_188_2.png)


    # SET UP LINUX TO USE MS-DOS FLOPPY DISKS


    If you want to use floppy disks that contain files created in MS-DOS or Windows,
    you must set up Linux to use MS-DOS floppy disks.


    ![](img/e2eac216eed4c6806c742998f1420a0c_189_0.png)


    You can only set up Linux to use MS-DOS floppy disks if you are logged on your
    computer as root. If you are logged on as a regular user, you cannot set up Linux
    to use MS-DOS floppy disks.


    # SET UP LINUX TO USE MS-DOS FLOPPY DISKS


    ![](img/e2eac216eed4c6806c742998f1420a0c_189_1.png)


    1. Click to display the Main Menu.

    2. Click System.

    3. Click LinuxConf.

    4. The gnome-linuxconf window appears.

    Note: A welcome message appears the first time you start LinuxConf. Click Quit
    to close the message.

    4. Access local drive.

    5. Click Add to provide information that will allow Linux to use MS-DOS floppy
    disks.


    # WORK WITH FLOPPY AND CD-ROM DRIVES


    # Why would I want to use MS-DOS floppy disks?


    ![](img/e2eac216eed4c6806c742998f1420a0c_190_0.png)


    # Share Information


    Using MS-DOS floppy disks is useful if you want to exchange information with colleagues
    or family members who MS-DOS or Windows.


    # Dual-Boot Setup


    If you have set up your computer to run both Linux and Windows, known as a dual-boot
    setup, you can use MS-DOS floppy disks to exchange information between Linux and
    Windows.


    ![](img/e2eac216eed4c6806c742998f1420a0c_190_1.png)


    6. This area and type /dev/fd0 to specify that you are providing information for
    a floppy drive.

    8. This area and type /mnt/dosfloppy to specify the directory that will display
    the contents of MS-DOS floppy disks.

    7. Click this area and mdos to specify that you want the floppy drive to be able
    to access MS-DOS files.

    9. Click the Options tab. 10. Click mountable to allow every user set up to access
    files on MS-DOS floppy disks.

    11. Click Not at boot time to specify that you do not want Linux to automatically
    set up the floppy drive when you turn on your computer.


    # SET UP LINUX TO USE MS-DOS FLOPPY DISKS


    When you set up Linux to use MS-DOS floppy disks, Linux creates a directory on
    your computer that will display the contents of the disks.


