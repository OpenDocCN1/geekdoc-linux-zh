    \n正在启动你的计算机...\n这可能需要几分钟。请稍候...\n诊断工具已成功加载到驱动器：\n如需帮助，输入 HELP 并按回车。\n\n![](img/e2eac216eed4c6806c742998f1420a0c_15_2.png)\n\
    \n> 你的计算机有一个大于 32 GB 的磁盘。此版本的 Windows 不支持大磁盘，导致大硬盘上的空间丢失，并减慢超过 2 GB 磁盘的运行。\n\n\
    重要：要启用大磁盘支持并创建任何新驱动器（包括某些版本的 Windows 95 和 Windows NT），请进入分区阶段并使用 FDISK。未为 FAT32\
    \ 系统设计的磁盘工具将无法正常工作。其他磁盘工具无法启用大支持。\n\n你是否要启用大支持 (Y/N) [ ] Y\n\n# 启动 FDISK\n\n1.\
    \ 将 Windows 98 启动软盘插入软驱器。\n2. 开启你的计算机。\n3. 显示 Microsoft Windows 98 启动菜单。按 3 在不访问\
    \ CD-ROM 驱动器的情况下启动计算机并按回车。\n4. 输入 fdisk 然后按回车键。\n5. 显示一条消息询问你要启用大磁盘支持，这允许你处理大于\
    \ 2 GB 的分区。\n6. 要启用大支持，按 Y（代表是）然后按回车键。\n\n# 在准备安装 Linux 之前我应该做什么？\n\n- 你应该备份计算机上的信息。删除分区将永久删除计算机上的所有信息。\n\
    - 获取 Windows 98 启动软盘。如果你没有 Windows 98 启动软盘，可以使用任何运行 Windows 98 的计算机创建启动盘。\n- 确保你的计算机在开机时从软驱启动。如果你的计算机没有从软驱启动，请咨询你的计算机手册以确定如何更改\
    \ BIOS 设置。\n\n![](img/e2eac216eed4c6806c742998f1420a0c_16_0.png)\n![](img/e2eac216eed4c6806c742998f1420a0c_16_1.png)\n\
    \n# 查看分区信息\n此区域显示你可以选择的 FDISK 选项列表。\n\n按 4 显示硬盘上分区信息并按回车键。\n\n此区域显示硬盘上的每个分区。\n\
    此区域显示硬盘上的总空间。\n\n按 Esc 键返回 FDISK 选项列表。\n\n# 准备安装 Linux\n\n在安装 Linux 之前，你必须删除计算机上的所有分区。删除分区将永久删除计算机上的所有信息。\n\
    \n![](img/e2eac216eed4c6806c742998f1420a0c_17_0.png)\n\n# 准备安装 Linux（续）\n\nFDISK\
    \ 选项\n固定磁盘驱动器: 1\n选择以下其中之一：\n1. 创建 DOS 分区或逻辑 DOS 驱动器\n2. 设置大小\n3. 删除分区或逻辑 DOS\
    \ 驱动器\n4. 显示分区信息\n\n输入选择：[1]\n\n按 Esc 退出 FDISK\n\n删除 DOS 分区或逻辑 DOS 驱动器\n固定磁盘驱动器:\
    \ 1\n选择以下其中之一：\n1. 删除主 DOS 分区\n2. 删除大小\n3. 删除扩展分区中的逻辑 DOS 驱动器\n4. 删除非 DOS 分区\n\
    \n输入选择：[1]\n\n按 Esc 返回 FDISK 选项\n\n# 删除分区\n\n此区域显示你可以选择的 FDISK 选项列表。\n\n按 3 删除分区并按回车键。\n\
    \n此区域显示你可以删除的分区类型。\n\n按 1 删除主分区并按回车键。\n\n出现一条消息提示你将丢失分区数据。\n\n# 安装 Linux\n\n我有多个分区。\n\
    如何删除所有分区？\n\n# 主分区\n\n每个硬盘都有一个主分区，通常被称为 C 盘。你可以通过以下步骤删除主分区。\n\n![](img/e2eac216eed4c6806c742998f1420a0c_18_0.png)\n\
    \n# 扩展分区\n\n硬盘也可以有一个扩展分区。扩展分区包含一个或多个逻辑驱动器，通常被称为 D 盘、E 盘等。在删除扩展分区之前，必须删除所有逻辑驱动器。要删除逻辑驱动器，在步骤\
    \ 2 中按 3。要删除扩展分区，在步骤 2 中按 2。\n\n![](img/e2eac216eed4c6806c742998f1420a0c_18_1.png)\n\
    \n# 删除主 DOS 分区\n\n固定磁盘驱动器: 1\n\n![](img/e2eac216eed4c6806c742998f1420a0c_18_2.png)\n\
    \n# 删除主 DOS 分区\n\n固定磁盘驱动器: 1\n\n| 分区 | 状态 | 类型 | 卷标 | 系统 | 使用率 |\n|---|---|---|---|---|---|\n\
    | C. | A | PRI DOS | 4068 | WIN35 | FAT32 | 100% |\n\n总磁盘空间为 4068 Megabytes (1\
    \ MB = 1048576 bytes)\n\n> 警告：如果删除主 DOS 分区，将会丢失。如果删除分区，将丢失该分区上的所有数据。确定吗？\n按 Esc\
    \ 返回 FDISK 选项\n\n分区已删除。\n\n总磁盘空间为 4068 Megabytes (1 MB = 1048576 bytes)\n\n"
