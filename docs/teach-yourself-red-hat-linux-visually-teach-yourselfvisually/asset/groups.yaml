  md: "\n# WORK WITH FILES\n\nHow did Linux open my file without asking which program\
    \ to use?\n\nIf the name of the file you are opening contains a file extension,\
    \ Linux may automatically open the file. Linux uses the file extension to determine\
    \ which program to use to open the file. A file extension appears at the end of\
    \ a file name and is separated by a period (example: manual.txt).\n\n![](img/e2eac216eed4c6806c742998f1420a0c_74_0.png)\n\
    \nHere are some common file extensions.\n\n| Type of File | File Extensions |\n\
    |---|-|\n| Audio | au, mp3, ram, snd, wav |\n| Image | bmp, gif, jpeg, jpg, png\
    \ |\n| Text | asc, txt |\n| Video | avi, mpeg, mov |\n\n![](img/e2eac216eed4c6806c742998f1420a0c_74_1.png)\n\
    \n![](img/e2eac216eed4c6806c742998f1420a0c_74_2.png)\n\n![](img/e2eac216eed4c6806c742998f1420a0c_74_3.png)\n\
    \n![](img/e2eac216eed4c6806c742998f1420a0c_74_4.png)\n\n![](img/e2eac216eed4c6806c742998f1420a0c_74_5.png)\n\
    \n![](img/e2eac216eed4c6806c742998f1420a0c_74_6.png)\n\n![](img/e2eac216eed4c6806c742998f1420a0c_74_7.png)\n\
    \nClick OK to open the file.\n\nThe file opens. You can now review and make changes\
    \ to the file.\n\nWhen you finish working with the file, click X to close the\
    \ file.\n\n# RENAME A FILE\n\nYou can give a new name to better describe the contents\
    \ of the file.\n\n![](img/e2eac216eed4c6806c742998f1420a0c_75_0.png)\n\n# RENAME\
    \ A FILE\n\nIf you are logged on to your computer as a regular user, you can usually\
    \ rename files that you have created. If you are logged as root, you can rename\
    \ files on your computer.\n\n| File | Edit | Settings | Layout | Commands | View\
    \ |\n|---|---|---|---|---|---||\n| Back | Up | Finland | Russian | Home | | |\n\
    | New | Open | Default | Custom | | | |\n\n| File | Edit | Settings | Layout |\
    \ Commands | View |\n|---|---|---|---|---|---||\n| Back | Up | Finland | Russian\
    \ | Home | | |\n| New | Open | Default | Custom | | | |\n\n| Properties | |\n\
    |---|---|\n| Name: | |\n| Type: | |\n| Size: | |\n| Location: | |\n| Date Created:\
    \ | |\n| Last Accessed On: | |\n\nYou should only rename files that you have created.\n\
    \n- 1 Right-click the file you want to rename.\nA menu appears.\n\n- 2 Click Properties.\n\
    The Properties dialog box appears. \n\nThis area displays the current file name.\n\
    \n- 3 Drag the mouse over the current file name to select the name.\n\n# WORK\
    \ WITH FILES\n\nCan I rename a directory?\nYes. To rename a directory, perform\
    \ the steps below, except right-click the directory you want to rename in step\
    \ 1. You should only rename directories that you have created.\n\n![](img/e2eac216eed4c6806c742998f1420a0c_76_0.png)\n\
    \n![](img/e2eac216eed4c6806c742998f1420a0c_76_1.png)\n\n- 4 Type a new name for\
    \ the file.\n- 5 Click OK to confirm your change.\nThe file displays the new name.\n\
    \n# DELETE A FILE\n\nYou can delete a file you no need. Linux will permanently\
    \ delete the file from your computer.\n\n![](img/e2eac216eed4c6806c742998f1420a0c_77_0.png)\n\
    \nIf you are logged on your computer as a regular user, you can usually delete\
    \ files that you have created. If you are logged on as root, you can delete any\
    \ file on your computer.\n\n![](img/e2eac216eed4c6806c742998f1420a0c_77_1.png)\n\
    \nYou should only delete files that you have created.\n\n- 1 Click the file you\
    \ want to delete.\n- 2 To delete more than one file, select the files.\n- 3 Click\
    \ File.\nClick Delete.\nThe Delete dialog box appears.\n- 4 Click Yes to delete\
    \ the file.\n\n# How do I delete a file on my desktop?\n\n- 1 Right-click the\
    \ file you want to delete. A menu appears.\n- 2 Click Delete.\nThe Delete dialog\
    \ box will appear. Click Yes to delete the file.\n\n![](img/e2eac216eed4c6806c742998f1420a0c_78_0.png)\n\
    \nThe file permanently disappears.\n\n# DELETE A DIRECTORY\n\nYou can delete a\
    \ directory and all the files it contains. You should only delete directories\
    \ that you have created.\n\n- 1 Perform steps 1 to 4 on page 66, selecting the\
    \ directory you want to delete.\nA dialog box appears, stating that the directory\
    \ is not empty.\n- 2 Click Yes to delete the directory.\n\n![](img/e2eac216eed4c6806c742998f1420a0c_78_1.png)\n\
    \n![](img/e2eac216eed4c6806c742998f1420a0c_78_2.png)\n\n# MOVE AND COPY FILES\n\
    \nYou can organize the files stored on your computer by moving or copying them\
    \ to new locations.\n\n![](img/e2eac216eed4c6806c742998f1420a0c_79_0.png)\n\n\
    # MOVE FILES\n\nIf you are logged on to computer as a regular user, you can usually\
    \ move and copy files only within your home directory. If you are logged on as\
    \ root, you can move and copy files to any location on your computer.\n\n![](img/e2eac216eed4c6806c742998f1420a0c_79_1.png)\n\
    \n- Position the mouse over the file you want to move.\n- To move multiple files\
    \ at the same time, select the files. Then position the mouse over one of the\
    \ files. To select multiple files, see page 60.\n- Drag the file to the directory\
    \ where you want to place the file.\nThe file moves to the directory you specified.\n\
    \n# What is the difference between moving and copying a file?\n\n![](img/e2eac216eed4c6806c742998f1420a0c_80_0.png)\n\
    \n# Move a File\n\nWhen you move a file, you place the file in a new location\
    \ on your computer.\n\n![](img/e2eac216eed4c6806c742998f1420a0c_80_1.png)\n\n\
    # Copy a File\n\nWhen you copy a file, you make an exact copy of the file and\
    \ then place the copy in a new location. This lets you store the file in two locations.\n\
    \n# COPY FILES\n\n![](img/e2eac216eed4c6806c742998f1420a0c_80_2.png)\n\n![](img/e2eac216eed4c6806c742998f1420a0c_80_3.png)\n\
    \n- 1 To view the file in the new location, click the directory you moved the\
    \ file.\n- 2 This area displays the contents of the directory, including the file\
    \ you moved.\n\nNote: You can move directories the same way you move files. When\
    \ you move a directory, all the files in the directory also move.\n\n- 3 Position\
    \ the mouse over the file you want to copy.\n- 4 To copy multiple files at the\
    \ same time, select the files. Then position the mouse over one of the files.\
    \ To select multiple files, see page 60.\n- 5 Press and hold down the Ctrl key\
    \ as drag the file to the directory where you want to place a copy of the file.\n\
    \n# PRINT A FILE\n\nYou can produce a paper copy of a file stored on your computer.\n\
    \n![](img/e2eac216eed4c6806c742998f1420a0c_81_0.png)\n\nBefore you can print,\
    \ you must set up a printer as shown on page 79.\n\n# PRINT A FILE\n\n![](img/e2eac216eed4c6806c742998f1420a0c_81_1.png)\n\
    \n# ADD A PRINT ICON\n\nBefore you can print a file, you must add a Print icon\
    \ to the GNOME Panel. You only need to add it once.\n\n- 1 Click to display the\
    \ Main Menu.\n2 Click Panel.\n3 Add applet.\n- 4 Click Utility.\n5 Click Printer\
    \ Applet.\n\nA Print icon appears on the GNOME Panel.\n\nYou can use the Print\
    \ icon to print your files.\n\n# Can I print several files at the same time?\n\
    \nYou can print several files at the same time by performing the following steps.\n\
    \n![](img/e2eac216eed4c6806c742998f1420a0c_82_0.png)\n\n- 1 Select the files you\
    \ want to print. To select multiple files, see page 60.\n2 Position the mouse\
    \ over one of the files.\n- 3 Drag the file to the Print icon on the GNOME Panel.\n\
    The files prints.\n\n![](img/e2eac216eed4c6806c742998f1420a0c_82_1.png)\n\n# PRINT\
    \ A FILE\n\n- 1 Double-click Home to view the directories and files on your computer.\n\
    A window appears.\n- 2 Click the directory that contains the file you want to\
    \ print.\n- 3 Position the mouse over the file you want to print.\n\n# FIND A\
    \ FILE\n\nIf you cannot remember the location of a file you want to work with,\
    \ you can have Linux search for the file.\n\n![](img/e2eac216eed4c6806c742998f1420a0c_83_0.png)\n\
    \n# FIND A FILE\n\n![](img/e2eac216eed4c6806c742998f1420a0c_83_1.png)\n\n- 1.\
    \ Click the directory where you want to search for the file. If the directory\
    \ contains other directories, Linux will also search these directories.\n2. Click\
    \ Commands.\n3. Click Find File.\nThe Find File window appears.\n4. Double-click\
    \ the area and type the name of the file you want to find. Make sure you type\
    \ the correct upper and lower case letters.\n\nNote: If you do not know the exact\
    \ name of the file, you can use an asterisk (*) or question mark (?) to help you\
    \ find the file. For more information, see the page 73.\n5. Click OK to start\
    \ the search.\n"
  mdcn: "\n\n# 操作文件\n\nLinux 如何在不询问要用哪种程序的情况下打开我的文件？\n\n如果你打开的文件包含文件扩展名，Linux 可能会打开打开文件。Linux\
    \ 使用文件扩展名来确定使用哪个程序打开文件。文件扩展名出现在文件名的结尾，并用点分隔（例如：manual.txt）。\n\n![](img/e2eac216eed4c6806c742998f1420a0c_74_0.png)\n\
    \n以下是一些常见的文件扩展名。\n\n| 文件类型 | 文件扩展名 |\n|---|-|\n| 音频 | au, mp3, ram, snd, wav |\n\
    | 图像 | bmp, gif, jpeg, jpg, png |\n| 文本 | asc, txt |\n| 视频 | avi, mpeg, mov |\n\
    \n![](img/e2eac216eed4c6806c742998f1420a0c_74_1.png)\n\n![](img/e2eac216eed4c6806c742998f1420a0c_74_2.png)\n\
    \n![](img/e2eac216eed4c6806c742998f1420a0c_74_3.png)\n\n![](img/e2eac216eed4c6806c742998f1420a0c_74_4.png)\n\
    \n![](img/e2eac216eed4c6806c742998f1420a0c_74_5.png)\n\n![](img/e2eac216eed4c6806c742998f1420a0c_74_6.png)\n\
    \n![](img/e2eac216eed4c6806c742998f1420a0c_74_7.png)\n\n点击 OK 打开文件。\n\n文件打开了。你现在可以查看并对文件进行更改。\n\
    \n当你完成文件操作后，点击 X 关闭文件。\n\n# 重命名文件\n\n你可以给文件起一个新名字以便描述其内容。\n\n![](img/e2eac216eed4c6806c742998f1420a0c_75_0.png)\n\
    \n# 重命名文件\n\n如果你以普通用户身份登录计算机，你通常可以重命名你创建的文件。如果你以 root 身份登录，你可以重命名计算机上的任何文件。\n\n\
    | 文件 | 编辑 | 设置 | 布局 | 命令 | 视图 | |\n|---|---|---|---|---|---||\n| 返回 | 向上 | 芬兰\
    \ | 俄语 | 主页 | | |\n| 新建 | 打开 | 默认 | 自定义 | | | |\n\n| 文件 | 编辑 | 设置 | 布局 | 命令 |\
    \ 视图 | |\n|---|---|---|---|---|---||\n| 返回 | 向上 | 芬兰 | 俄语 | 主页 | | |\n| 新建 | 打开\
    \ | 默认 | 自定义 | | | |\n\n| 属性 | |\n|---|---|\n| 名称: | |\n| 类型: | |\n| 大小: | |\n\
    | 位置: | |\n| 创建日期: | |\n| 最后访问时间: | |\n\n你应该只重命名你创建的文件。\n\n- 1 右键点击你想要重命名的文件。\n\
    出现一个菜单。\n\n- 2 点击属性（Properties）。\n出现属性对话框。 \n\n此区域显示当前文件名。\n\n- 3 将鼠标悬停在当前文件名上以选择该名称。\n\
    \n# 操作文件\n\n我可以重命名目录吗？\n可以。要重命名目录，请执行以下步骤，但在步骤 1 中改为右键点击你想要重命的目录。你应该只重命名你创建的目录。\n\
    \n![](img/e2eac216eed4c6806c742998f1420a0c_76_0.png)\n\n![](img/e2eac216eed4c6806c742998f1420a0c_76_1.png)\n\
    \n- 4 为文件输入一个新名称。\n- 5 点击 OK 确认你的更改。\n文件显示了新名称。\n\n# 删除文件\n\n你可以删除不需要的文件。Linux\
    \ 将从你的计算机中永久删除该文件。\n\n![](img/e2eac216eed4c6806c742998f1420a0c_77_0.png)\n\n如果你以普通用户身份登录计算机，你通常可以删除你创建的文件。如果你以\
    \ root 身份登录，你可以删除计算机上的任何文件。\n\n![](img/e2eac216eed4c6806c742998f1420a0c_77_1.png)\n\
    \n你应该只删除你创建的文件。\n\n- 1 点击你想删除的文件。\n- 2 若要删除多个文件，请选择这些文件。\n- 3 点击文件（File）。\n点击删除（Delete）。\n\
    出现删除对话框。\n- 4 点击 Yes 删除文件。\n\n# 我 如何在桌面上删除文件？\n\n- 1 右键点击你想删除的文件。出现一个菜单。\n- 2\
    \ 点击删除（Delete）。\n出现删除对话框。点击 Yes 删除文件。\n\n![](img/e2eac216eed4c6806c742998f1420a0c_78_0.png)\n\
    \n文件永久消失了。\n\n# 删除目录\n\n你可以删除一个目录及其包含的所有文件。你应该只删除你创建的目录。\n\n- 1 按照第 66 页的步骤 1\
    \ 到 4 操作选择要删除的目录。\n出现一个对话框说明该目录为空。\n- 2 点击 Yes 删除目录。\n\n![](img/e2eac216eed4c6806c742998f1420a0c_78_1.png)\n\
    \n![](img/e2eac216eed4c6806c742998f1420a0c_78_2.png)\n\n# 移动和复制文件\n\n你可以通过移动或复制到新位置来组织计算机上的文件。\n\
    \n![](img/e2eac216eed4c6806c742998f1420a0c_79_0.png)\n\n# 移动文件\n\n如果你以普通用户身份登录，你通常只能在主目录下移动和复制文件。如果你以\
    \ root 身份登录，你可以将文件移动到计算机上的任何位置。\n\n![](img/e2eac216eed4c6806c742998f1420a0c_79_1.png)\n\
    \n- 1 将鼠标悬停在你想移动的文件上。\n- 若要同时移动多个文件，请选择这些文件。将鼠标悬停在其中一个文件上。选择多个文件请参第 60 页。\n- 将文件拖到你想放置的目录。\n\
    文件移动到了指定的目录。\n\n# 移动文件和复制文件有什么区别？\n\n![](img/e2eac216eed4c6806c742998f1420a0c_80_0.png)\n\
    \n# 移动文件\n\n当你移动文件时，你将文件放在计算机上的新位置。\n\n![](img/e2eac216eed4c6806c742998f1420a0c_80_1.png)\n\
    \n# 复制文件\n\n当你复制文件时，你会创建一个文件的完全副本并将其放在新位置。这让你将文件存储在两个位置。\n\n# 复制文件\n\n![](img/e2eac216eed4c6806c742998f1420a0c_80_2.png)\n\
    \n![](img/e2eac216eed4c6806c742998f1420a0c_80_3.png)\n\n- 1 若要查看新位置的文件，点击你移动文件的目录。\n\
    - 2 此区域显示目录内容，包括你移动的文件。\n注意：你可以像移动文件一样移动目录。当你移动目录时，目录中的所有文件也会移动。\n\n- 3 将鼠标悬停在复制复制的文件。\n\
    - 4 若要同时复制多个文件，请选择这些文件。将鼠标悬停在其中一个文件上。选择多个文件请查看第 60 页。\n- 5 按住 Ctrl 键，将文件拖到你想放置文件副本的目录。\n\
    \n# 打印文件\n\n你可以为计算机上的文件制作纸质副本。\n\n![](img/e2eac216eed4c6806c742998f1420a0c_81_0.png)\n\
    \n在打印之前，你必须按照第 79 页所示设置打印机。\n\n# 打印文件\n\n![](img/e2eac216eed4c6806c742998f1420a0c_81_1.png)\n\
    \n# 添加打印图标\n\n在打印文件之前，你必须向 GNOME 面板添加打印图标。你只需要添加一次。\n\n- 1 点击显示主菜单。\n2 点击面板（Panel）。\n\
    3 添加组件（Add applet）。\n- 4 点击工具（Utility）。\n5 点击打印组件（Printer Applet）。\n\nGNOME 面板上会出现打印图标。\n\
    \n你可以使用打印图标打印你的文件。\n\n# 我可以同时打印多个文件吗？\n\n你可以通过以下步骤同时打印多个文件。\n\n![](img/e2eac216eed4c6806c742998f1420a0c_82_0.png)\n\
    \n- 1 选择你想打印的文件。选择多个文件请查看第 60 页。\n2 将鼠标悬停在其中一个文件上。\n- 3 将文件拖到 GNOME 面板上的打印图标。\n\
    文件被打印。\n\n![](img/e2eac216eed4c6806c742998f1420a0c_82_1.png)\n\n# 打印文件\n\n- 1\
    \ 双击“主页”（Home）查看计算机上的目录和文件。\n出现一个窗口。\n- 2 点击包含你想打印的文件目录。\n- 3 将鼠标悬停在你想打印的文件上。\n\
    \n# 查找文件\n\n如果你不记得想要操作的文件的位置，你可以让 Linux 搜索该文件。\n\n![](img/e2eac216eed4c6806c742998f1420a0c_83_0.png)\n\
    \n# 查找文件\n\n![](img/e2eac216eed4c6806c742998f1420a0c_83_1.png)\n\n- 1. 点击你想搜索文件的目录。如果该目录包含其他目录，Linux\
    \ 也会搜索这些目录。\n2. 点击命令（Commands）。\n3. 点击查找文件（Find File）。出现“查找文件”窗口。\n4. 双击该区域并输入你想查找的文件名。确保你输入的大小写字母正确。\n\
    \n注意：如果你不知道文件的确切名称，可以使用星号（*）或问号（?）来帮助查找该文件。更多信息请参阅第 73 页。\n5. 点击 OK 开始搜索。\n\n"
