    # WORK WITH FILES


    How did Linux open my file without asking which program to use?


    If the name of the file you are opening contains a file extension, Linux may automatically
    open the file. Linux uses the file extension to determine which program to use
    to open the file. A file extension appears at the end of a file name and is separated
    by a period (example: manual.txt).


    ![](img/e2eac216eed4c6806c742998f1420a0c_74_0.png)


    Here are some common file extensions.


    | Type of File | File Extensions |

    |---|-|

    | Audio | au, mp3, ram, snd, wav |

    | Image | bmp, gif, jpeg, jpg, png |

    | Text | asc, txt |

    | Video | avi, mpeg, mov |


