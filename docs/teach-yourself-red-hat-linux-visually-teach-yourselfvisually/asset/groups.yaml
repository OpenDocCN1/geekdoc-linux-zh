    +   - This area displays the amount of time before the appointment will remind
    you.


    +   - To specify another time, double-click this area and type the new time.


    +   - Click OK to confirm the information you entered.


    +   - The appointment appears in the calendar window.


    +   - Right-click the appointment you want to delete. A menu appears.


    +   - Delete the appointment.'
