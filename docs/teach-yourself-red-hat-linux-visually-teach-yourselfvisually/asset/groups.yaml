    changes to [x].

    - 9 To select additional packages, repeat step 8 for each package.


    You may now install the packages you selected. To install packages, skip to step
    15.


    # Where else can I get packages that I can install?


    ![](img/e2eac216eed4c6806c742998f1420a0c_228_0.png)


    ![](img/e2eac216eed4c6806c742998f1420a0c_228_1.png)


    # Computer Stores


    Many computer stores offer CD-ROM discs containing Linux packages that you can
    install.


    # Internet


    You can obtain packages on the Internet that you can install. For example, you
    can find free packages at www.tucows.com Web site.


    ![](img/e2eac216eed4c6806c742998f1420a0c_228_2.png)


    # BROWSE THROUGH PACKAGES:


    If you were unable to find the package you wanted to install by browsing through
    categories, you can browse through the packages on the CD-ROM disc.


    - 1 Click to browse through the packages on the CD-ROM disc.

    2 The Packages window appears.

    This area shows the displayed directories and files.

    Note: You will find the contents of a CD-ROM disc in the /mnt/cdrom directory.

    Note: You can double-click/ to move up one level in the directory structure.

    To display the contents of a different directory, double-click the directory in
    this area.

    This area appears in the current directory.

    '
