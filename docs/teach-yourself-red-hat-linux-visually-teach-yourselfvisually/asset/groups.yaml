  md: '

    ## VIEW CONTENTS OF YOUR COMPUTER


    You can use the GNOME File Manager to view the directories and files on your computer.


    ![](img/e2eac216eed4c6806c742998f1420a0c_63_0.png)


    The GNOME File Manager allows you to perform tasks such as moving, deleting and
    sorting files.


    ![](img/e2eac216eed4c6806c742998f1420a0c_63_1.png)


    - Double-click Home directory to display the directories and files on your computer.

    - A window appears.

    - This area displays the organization of the directories on your computer. Your
    home directory that stores your personal files is automatically highlighted.

    - To display the contents of another directory, click the directory.


    ## What do the icons in the GNOME File Manager represent?


    Each directory and file displays an icon to help you distinguish between the different
    types of items. Common types of items includes:


    ![](img/e2eac216eed4c6806c742998f1420a0c_64_0.png)

    ![](img/e2eac216eed4c6806c742998f1420a0c_64_1.png)

    ![](img/e2eac216eed4c6806c742998f1420a0c_64_2.png)


    - A directory displaying a plus sign (✚) contains subdirectories.

    - Click the plus sign (✚) beside the directory to display its subdirectories.

    - The subdirectories appear.


    Note: You can click the sign (▼) to once again hide the subdirectories to ⊟.


    - The plus sign (✚) beside the directory changes to a minus sign (➖). This indicates
    that the subdirectories within the directory are displayed.

    - When you are reviewing the directories and files on your computer, click X to
    close the window.


    ## DISPLAY YOUR HOME DIRECTORY


    You can quickly display the contents of your home directory. Your home directory
    stores your personal files and settings.


    ![](img/e2eac216eed4c6806c742998f1420a0c_65_0.png)

    ![](img/e2eac216eed4c6806c742998f1420a0c_65_1.png)


    - Click Home to display your home directory.

    - This area displays the contents of your home directory.

    - If you are logged on your computer as a regular user, your home directory is
    the directory with your user name.

    - If you are logged on your computer as root, your home directory is the root
    directory.


    ## WORK WITH FILES


    ### DISPLAY FILE PROPERTIES


    You can display information about a file, such as the size of the file and the
    date the file was last changed.


    ![](img/e2eac216eed4c6806c742998f1420a0c_66_0.png)


    ![](img/e2eac216eed4c6806c742998f1420a0c_66_1.png)

    ![](img/e2eac216eed4c6806c742998f1420a0c_66_2.png)


    1. Right-click the file whose properties you want to display.

    2. Click Properties.

    The Properties dialog box appears.


    - This area displays the location and name of the file.

    - This area displays the file was created, last changed and opened last.

    - This area displays the type and size of the file.

    3. When finishing review the information, click OK to close the dialog box.


    ### CHANGE VIEW OF ITEMS


    You can change the way items appear in directories.


    ![](img/e2eac216eed4c6806c742998f1420a0c_67_0.png)

    ![](img/e2eac216eed4c6806c742998f1420a0c_67_1.png)


    When you first start Linux, directories and files appear in the Icons view.


    1. Click Icons, List or Detailed to select the way to view the directories and
    files.

    - The directories and files appear in the new view.

    - In this directories and files appear in the Detailed view. This view displays
    information about each directory and file.


    56


    ### SORT ITEMS


    You can sort the items in a directory to help you find items of interest.


    ![](img/e2eac216eed4c6806c742998f1420a0c_68_0.png)


    You can sort items by name, size or the date it was last changed.


    ![](img/e2eac216eed4c6806c742998f1420a0c_68_1.png)


    - Click Detailed to display the directories and files in the Detailed view.

    - When you start Linux, directories and files are sorted alphabetically by name.

    - The directories and files are sorted. In this example, the directories and files
    are sorted by size.


    ### CUSTOMIZE DISPLAY OF FILE INFORMATION


    You can change the type of information that Linux displays about the files on
    your computer.


    ![](img/e2eac216eed4c6806c742998f1420a0c_69_0.png)

    ![](img/e2eac216eed4c6806c742998f1420a0c_69_1.png)


    1. Click Custom to display detailed information about the files on your computer.

    2. To change the type of information that Linux displays, click Settings.

    3. Click Preferences.

    The Preferences dialog box appears.

    4. Click the View tab.

    These areas show columns of information you can choose to display and the currently
    displayed.

    5. Add a column you want to display, click the column.

    6. Click Add to add the column.

    Note: If the button is dimmed, the column is already displayed.


    58


    What type of information can I display about the files on my computer?


    Here are some columns of information that you may want to display.


    | Column | Description |

    | :--- | :--- |

    | Access Time | The date and time each file was last accessed. |

    | Creation Time | The date and time each file was created. |

    | Modification Time | The date and time each file was last changed. |

    | Name | The name of each file. |

    | Owner | The name of the person who owns each file. |

    | Permission | The read (r), write (w) and execute (x) permissions for each file.
    |

    | Size | The size of each file in bytes. |

    | Type | An icon that represents the type of each file. |


    ![](img/e2eac216eed4c6806c742998f1420a0c_70_0.png)


    - The column you added appears in this area.

    - To remove a column you no longer want to display, click the column.

    - Click Remove to remove the column.

    - Click OK to confirm your changes.


    This area shows the columns you choose to display.


    To change the width of a column, position the mouse over the right edge of the
    column heading (↔). Then drag the column edge until the column displays your width.


    Note: If you no longer want to display customized information, you can change
    the width as shown on page 56.


    ## SELECT FILES


    Before working with files, you often need to select the files you want to work
    with. The names of selected files appear highlighted on your screen.


    ![](img/e2eac216eed4c6806c742998f1420a0c_71_0.png)


    You can select directories the same way as files. Selecting a directory will select
    all the files in the directory.


    ![](img/e2eac216eed4c6806c742998f1420a0c_71_1.png)


    - Click the file you want to select.

    - The name of the file is highlighted.

    This area displays the size of the file you selected.


    - Click the first file you want to select.

    - Press and hold down the Shift key.

    - Still holding down the Shift key, click the last file you want to select.


    60


    ## WORK WITH FILES


    How do I deselect files?


    To deselect all files, click a blank area on the right side of the window.


    To deselect one file from a group of selected files, press and hold the Ctrl key
    while clicking the file you want to deselect.

    Note: You can deselect directories the same way you deselect files.


    ![](img/e2eac216eed4c6806c742998f1420a0c_72_0.png)

    ![](img/e2eac216eed4c6806c742998f1420a0c_72_1.png)


    1. Click a file you want to select.

    2. Press and hold down the Ctrl key.

    3. Still holding down the Ctrl key, click each file you want to select.


    1. To select all the files in the current directory, click Edit.

    2. Click Select All.


    61


    ## OPEN A FILE


    You can open a file to display its contents on your screen. This lets you review
    and make changes to the file.


    ![](img/e2eac216eed4c6806c742998f1420a0c_73_0.png)

    ![](img/e2eac216eed4c6806c742998f1420a0c_73_1.png)


    - Double-click the file you want to open.

    - Your home directory stores your personal files. To display your home directory,
    click Home.

    - A dialog box may appear, asking you to select the program you want to use to
    open the file.

    - Click the program you want to use to open the file.


    62

