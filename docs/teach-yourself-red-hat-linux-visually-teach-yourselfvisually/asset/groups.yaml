    ## 最小化窗口


    LINUX 基础


    如果你不使用某个窗口，可以最小化该窗口将其暂时从屏幕上移除。你可以随时重新显示该窗口。


    ![](img/e2eac216eed4c6806c742998f1420a0c_46_0.png)


    ## 最小化窗口


    ![](img/e2eac216eed4c6806c742998f1420a0c_46_1.png)


    - 1 点击你想要最小化的窗口。

    - 窗口将缩小为 GNOME Pager（分页器）上的一个按钮。

    - 要重新显示该窗口，请点击 GNOME Pager 上的对应按钮。


    ## 滚动窗口


    你可以使用滚动条来浏览窗口中的信息。当窗口足够不足以显示其包含的所有信息时，这非常有用。


    ![](img/e2eac216eed4c6806c742998f1420a0c_47_0.png)


    ## 滚动窗口


    ![](img/e2eac216eed4c6806c742998f1420a0c_47_1.png)

    ![](img/e2eac216eed4c6806c742998f1420a0c_47_2.png)


    ## 向下滚动


    - 1 点击 /即可向下滚动窗口中的信息。


    ## 向上滚动


    - 1 点击即可向上滚动窗口中的信息。


    ## 滚动到任意位置


    - 1 拖动滚动框沿滚动条移动，直到你想要的信息出现。例如，当滚动框位于滚动条中间处时，你正在查看窗口中间的信息。


    ## 在窗口之间切换


    如果你打开了多个窗口，可以轻松地在窗口之间切换。


    ![](img/e2eac216eed4c6806c742998f1420a0c_48_0.png)


    ## 在窗口之间切换


    ![](img/e2eac216eed4c6806c742998f1420a0c_48_1.png)


    - 你一次只能在一个窗口中工作。活动窗口会出现在所有其他窗口前面，并显示高亮的标题栏。

    - GNOME P 在桌面上为每个打开的窗口显示一个按钮。

    - 要将你想工作的窗口显示在所有其他窗口前面，请点击 GNOME Pager 上的对应按钮。窗口将出现在所有其他窗口前面，标题栏将高亮。现在你可以在该窗口中工作了。


    ## 遮盖窗口


    你可以遮盖窗口来暂时隐藏窗口的内容。这有助于减少桌面的杂乱。


    ![](img/e2eac216eed4c6806c742998f1420a0c_49_0.png)


    ## 遮盖窗口


    ![](img/e2eac216eed4c6806c742998f1420a0c_49_1.png)


    - 双击你想要遮盖窗口的标题栏。

    - 窗口的内容被隐藏。标题栏仍留在桌面上。

    - 要重新显示窗口内容，双击该窗口的标题栏。


    38


    ## 关闭窗口


    LINUX 基础


    当你完成对某个窗口的工作时，可以关闭窗口将其从屏幕上移除。


    ![](img/e2eac216eed4c6806c742998f1420a0c_50_0.png)


    ## 关闭窗口


    ![](img/e2eac216eed4c6806c742998f1420a0c_50_1.png)


    - 点击你想要关闭的窗口中的 X。

    - 窗口从屏幕上消失。

    - 窗口的按钮从 GNOME Pager 上消失。

    注意：如果程序出现问题导致窗口无法关闭，请在步骤 1 中右键点击强制关闭窗口。


    39


    ## 重启电脑


    如果你在使用 Linux 时遇到问题，可以重启电脑来解决问题。


    ![](img/e2eac216eed4c6806c742998f1420a0c_51_0.png)


    ## 重启电脑


    ![](img/e2eac216eed4c6806c742998f1420a0c_51_1.png)


    - 1 点击显示主菜单。

    - 2 点击注销。

    - 3 出现一个对话框。

    - 4 点击重启以重启你的电脑。

    - 5 点击是。

    注意：如果你以普通用户身份登录电脑，将出现一个对话框要求输入密码。点击对话框并输入密码，然后按回车键。

    - Linux 重启你的电脑。


    40


    ## 退出 Linux


    LINUX 基础


    当你完成对 Linux 使用后，可以退出 Linux 并关闭电脑。


    ![](img/e2eac216eed4c6806c742998f1420a0c_52_0.png)


    当此消息出现时，你可以关闭电脑。


    ## 退出 Linux


    ![](img/e2eac216eed4c6806c742998f1420a0c_52_1.png)


    - 1 点击注销。

    - 2 出现一个对话框。

    - 3 点击重启以重启电脑。

    - 4 点击是。

    注意：如果你以普通用户身份登录电脑，将出现一个对话框要求输入密码。点击对话框并输入密码，然后按回车键。

    - Linux 重启你的电脑。


    ## 获取帮助


    如果你不知道如何在 Linux 中执行某操作，可以使用帮助功能获取信息。


    ![](img/e2eac216eed4c6806c742998f1420a0c_53_0.png)


    ## 获取帮助


    ![](img/e2eac216eed4c6806c742998f1420a0c_53_1.png)


    - 1 点击显示主菜单。

    - 2 出现帮助浏览器窗口。

    - 3 点击 GNOME 用户指南。


    ## 帮助功能提供哪些类型的帮助？


    在帮助浏览器窗口中，你可以点击以下选项获取帮助：


    - Red Hat Linux 入门指南：提供基础帮助。

    - Red Hat Linux 安装指南：提供安装相关的帮助。

    - Red Hat Linux 参考指南：提供详细帮助。


    ![](img/e2eac216eed4c6806c742998f1420a0c_54_0.png)


    - GNOME 文档：提供程序帮助。

    - Man 页面：提供基础命令帮助。

    - Info 页面：提供详细命令帮助。


    ![](img/e2eac216eed4c6806c742998f1420a0c_54_1.png)

    ![](img/e2eac216eed4c6806c742998f1420a0c_54_2.png)


    ## Enlightenment 配置工具


    有很多方法可以访问 Enlightenment 配置工具 (E-conf)。你可以通过 GNOME 控制中心、窗口管理器或从桌面访问它。


    它还包含许多控制 Enlightenment 各个方面的章节。你可以在 E-conf 的左上角找到列表：主题、选项、桌面、外观、音频、特效、主题和其他。


    ### 基础选项


    以下是 E-conf 的章节，你可以从中学习如何配置外观和行为：


    - 出现了 GNOME 用户指南目录。

    - 你需要向下滚动条查看目录。

    - 点击感兴趣的主题。

    - 显示该帮助主题的信息。

    - 你可以点击返回 GNOME 用户指南目录以选择其他主题。


    当你完成查看帮助时，点击关闭窗口。


    ## 获取帮助


    当你发现包含有用信息的帮助主题时，可以将其标记为书签，以便以后返回。


    ![](img/e2eac216eed4c6806c742998f1420a0c_55_0.png)


    ## 书签帮助主题


    ![](img/e2eac216eed4c6806c742998f1420a0c_55_1.png)


    | Gnome Browser | | | | |

    |---|---|---|---|---|

    | 文件 | 编辑 | 查看 | 书签 | 帮助 |

    | 添加书签 | | | | |

    | 窗口 | | | | |

    | 退出 | | | | |

    | Gnome Browser | | | | |

    | 后退 | 前进 | 刷新 | 索引 | 书签 | 帮助 |


    ![](img/e2eac216eed4c6806c742998f1420a0c_55_2.png)


    ## Enlightenment 配置工具


    有两种方法可以启动 Enlightenment 配置工具 (E-conf)。你可以打开 GNOME 控制中心并选择窗口管理器，或者从 Enlightenment
    按钮运行配置工具。


    该工具还允许你配置左右手的鼠标键。你可以通过从 Enlightenment 菜单选择切换配置来模拟这种操作。


    '
