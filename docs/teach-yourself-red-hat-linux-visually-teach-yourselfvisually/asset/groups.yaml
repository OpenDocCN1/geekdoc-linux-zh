    3. To redraw the appointments for the current day, click Today.


    # CHANGE VIEW OF CALENDAR


    You can view appointments by day, week or year.

    1. Click the tab for the way you want to view your appointments.


    ![](img/e2eac216eed4c6806c742998f1420a0c_108_4.png)


    # USING CALENDAR


    You can add an appointment to Calendar to remind you of an activity such as a
    business meeting, lunch or doctor''s appointment.


    ![](img/e2eac216eed4c6806c742998f1420a0c_109_0.png)


    # ADD APPOINTMENT


    ![](img/e2eac216eed4c6806c742998f1420a0c_109_1.png)


    1. Click New to add an appointment.

    2. The create new appointment dialog box appears.

    3. Click this area and type a description for the appointment.

    4. These areas display the date and the time the appointment will start and end.

    5. To change the date or time, double-click the part of the date or time you want
    to change and then type the new.


    Note: Make sure you enter the time using the 24-hour format. For example, 14:00
    for pm.


    # How will Calendar remind me of an appointment?


    You can have Calendar display a reminder message to notify you of an upcoming
    appointment. By default, Calendar will remind you of an appointment 15 minutes
    before the appointment. The Calendar program must be open for the reminder message
    to appear. To close the reminder message, click OK.


    ![](img/e2eac216eed4c6806c742998f1420a0c_110_0.png)

    ![](img/e2eac216eed4c6806c742998f1420a0c_110_1.png)


    1. Click this if you want Calendar to remind you of the appointment.

    2. This area displays the amount of time before the appointment will remind you.

    3. To specify another time, double-click this area and type the new time.

    4. Click OK to confirm the information you entered.

    5. The appointment appears in the calendar window.

    6. Right-click the appointment you want to delete. A menu appears.

    7. Delete the appointment.


    # USING GNOMECARD


    You can use the GnomeCard address book to keep detailed information about friends,
    family members, colleagues and clients.


    ![](img/e2eac216eed4c6806c742998f1420a0c_111_0.png)


    # USING GNOMECARD


    ![](img/e2eac216eed4c6806c742998f1420a0c_111_1.png)


    1. Click to display the Main Menu.

    2. Click Applications.

    3. Click Address Book.

    4. The GnomeCard window appears.

    5. Click Add to add a new contact.


    # USING LINUX APPLICATIONS


    # What information can I use to file a contact?


    When filing a contact, you can use information such as the contact''s first name,
    last name, full name or nickname. For example, you can file a contact as Smith,
    John. You should use the same method for all of your contacts to help you organize
    the contacts in the GnomeCard window.


    ![](img/e2eac216eed4c6806c742998f1420a0c_112_0.png)

    ![](img/e2eac216eed4c6806c742998f1420a0c_112_1.png)

    ![](img/e2eac216eed4c6806c742998f1420a0c_112_2.png)


    - The GnomeCard dialog appears, displaying areas where you can enter information
    about the contact.

    - To enter the contact''s birthday, double-click each part of the date and type
    the correct information.

    - Click each area and type the information for the contact. You can leave areas
    blank if you wish.

    - Click this area and type the information you want GnomeCard to use to file the
    contact.

    - If you want to fill the contact''s full name to file, click **Take from Name**.
    GnomeCard will fill in the contact''s name for you.


    # USING GNOMECARD


    You can use GnomeCard to keep track of the e-mail and mailing addresses of your
    contacts.


    ![](img/e2eac216eed4c6806c742998f1420a0c_113_0.png)


    # USING GNOMECARD (CONTINUED)


    ![](img/e2eac216eed4c6806c742998f1420a0c_113_1.png)

    ![](img/e2eac216eed4c6806c742998f1420a0c_113_2.png)


    8. Click the Network tab.

    9. Click this area and type the contact''s Web page address.

    10. Click this area and type the contact''s e-mail address.

    11. Click the type of e-mail address you enter ( changes to ).

    12. Click Add.

    - The e-mail address appears in this area.

    - To enter more than one e-mail address for the contact, repeat steps 10 to 12
    for each address.

