  mdcn: "\n\n# 阅读消息\n\n你可以阅读新闻组中的消息，学习世界各地人士的观点和想法。\n\n![](img/e2eac216eed4c6806c742998f1420a0c_303_0.png)\n\
    \n在阅读新闻组中的消息之前，你需要订阅该新闻组。要订阅新闻组，请参阅第 288 页。\n\n# 阅读消息 新闻组：Re: Shaped Skins\n\n\
    | 组名 | 大小 | 查看 | 消息 | 评论 |\n|---|---|---|---|--|\n| Loose Mail | 0 | 0 | 0 | 0\
    \ |\n| Linux_jaged | 0 | 0 | 0 | 0 |\n| Templates | 0 | 0 | 0 | 0 |\n| Taph |\
    \ 0 | 0 | 0 | 0 |\n\n| 组名 | 大小 | 查看 | 消息 | 评论 |\n|---|---|---|---|--|\n| Re:Shaped\
    \ Skins | 0 | 0 | 0 | 0 |\n| Re:Shaped Skins | 0 | 0 | 0 | 0 |\n| Re:Good Mountain\
    \ | 0 | 0 | 0 | 0 |\n\n| 组名 | 大小 | 查看 | 消息 | 评论 |\n|---|---|---|---|--|\n| Loose\
    \ Mail | 0 | 0 | 0 | 0 |\n| Linux_jaged | 0 | 0 | 0 | 0 |\n| Templates | 0 | 0\
    \ | 0 | 0 |\n| Taph | 0 | 0 | 0 | 0 |\n\n| 组名 | 大小 | 查看 | 消息 | 评论 |\n|---|---|---|---|--|\n\
    | Re:Shaped Skins | 0 | 0 | 0 | 0 |\n| Re:Shaped Skins | 0 | 0 | 0 | 0 |\n| Re:Good\
    \ Mountain | 0 | 0 | 0 | 0 |\n\n![](img/e2eac216eed4c6806c742998f1420a0c_303_1.png)\n\
    \n如果你喜欢这个附件，我建议将其发送给一对朋友，这可能会节省一些空间。\n\n> John 写道：\n我很喜欢你制作皮肤的方式。我现在应该去把它们删了。\n\
    \n> 感谢帮助！\n- Mary Doe\n\n我是一个滑雪新手，正打算购买双滑雪板。我该如何判断它们的尺寸是多少？\n\n- 点击包含消息的消息进行阅读。新闻组旁边会显示未读消息数和消息总数。\n\
    \n- 如果你不感兴趣，点击新闻服务器旁边的加号 (+)。\n\n- 此区域显示你所选新闻组中的消息。你未读的消息将以**粗体**显示。\n\n注意：如果所选新闻组包含超过\
    \ 500 条消息，会弹出对话框。点击确定以传输所有消息。\n\n- 点击你想阅读的消息。\n\n- 要显示另一条消息的内容，点击该消息。\n\n# 发送消息\n\
    \n加入新闻组\n\n你可以向新闻组发送消息以提问或表达你的观点。\n\n![](img/e2eac216eed4c6806c742998f1420a0c_304_0.png)\n\
    \n在发送消息之前，你应该至少阅读一周该新闻组中的消息。这可以帮助你避免发送他人已经读过的消息，并学习新闻组内的人是如何交流的。\n\n# 发送消息\n\n\
    Outlook 邮件与新闻组：Shaped Skills\n\nOutlook 邮件与新闻组：洛基滑雪度假区\n\n![](img/e2eac216eed4c6806c742998f1420a0c_304_1.png)\n\
    \n- 1 点击新闻组以发送消息。\n- 2 如果未显示新闻组，点击新闻服务器旁边的加号 (+) 使其变为 (–)。\n- 3 点击“新消息”（New Msg）创建新消息。\n\
