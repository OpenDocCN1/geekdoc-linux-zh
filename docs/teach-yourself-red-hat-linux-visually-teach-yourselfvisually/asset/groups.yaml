    # 使用命令行


    ![](img/e2eac216eed4c6806c742998f1420a0c_248_0.png)


    ![](img/e2eac216eed4c6806c742998f1420a0c_248_1.png)


    ## MAN

    显示命令的帮助信息。


    - 输入 **man** 后跟你想要获取信息的命令名称。然后按 `Enter` 键。

    - 若要重绘命令行，按 `Q` 键。


    ## MKDIR

    创建一个新目录。


    - 输入 **mkdir** 后跟你想要创建的目录的路径和名称。然后按 `Enter` 键。


    ![](img/e2eac216eed4c6806c742998f1420a0c_248_2.png)


    ![](img/e2eac216eed4c6806c742998f1420a0c_248_3.png)


    ## MV

    将文件移动到新位置。


    - 输入 **mv** 后跟你想要移动的文件路径和名称。

    - 输入你想要放置文件的目录的路径和名称。然后按 `Enter` 键。


    ## PASSWD

    更改你的密码。


    - 输入 **passwd** 然后按 `Enter` 键。

    注意：如果你是以普通用户登录的，Linux 将要求你输入当前密码。然后按 `Enter` 键。

    - 输入新密码，然后按 `Enter` 键。

    - 再次输入新密码以确认密码，然后按 `Enter` 键。


    ## 常用 Linux 命令


    ![](img/e2eac216eed4c6806c742998f1420a0c_249_0.png)


    ## PICO

    启动一个允许你创建和编辑文本文件的程序。


    - 输入 `pico` 然后按 `Enter` 键。

    - 若要重新设计命令行，按住 `Ctrl` 键并按下 `X` 键。


    ![](img/e2eac216eed4c6806c742998f1420a0c_249_1.png)


    ![](img/e2eac216eed4c6806c742998f1420a0c_249_2.png)


    | PID TTY | TIME | CMD |

    | --- | --- | --- |

    | 740 pts/2 | 00:00:00 | bash |

    | 808 pts/2 | 00:00:00 | netscape-commun |

    | 828 pts/2 | 00:00:00 | root |


    ## PS

    显示从命令行启动的运行程序列表。


    - 输入 `ps` 然后按 `Enter` 键。


    ![](img/e2eac216eed4c6806c742998f1420a0c_249_3.png)


    ![](img/e2eac216eed4c6806c742998f1420a0c_249_4.png)


    ```

    [root@localhost #root# pwd]

    /root

    [root@localhost #root# ]

    ```


    ## PWD

    显示当前目录的路径和名称。


    - 输入 `pwd` 然后按 `Enter` 键。


    ![](img/e2eac216eed4c6806c742998f1420a0c_249_5.png)


    ![](img/e2eac216eed4c6806c742998f1420a0c_249_6.png)


    ```

    [root@localhost #root# rm /root/meeting_minutes]

    rm: remove /root/meeting_minutes ?

    ```


    ## RM

    删除文件。


    - 输入 `rm` 后跟要删除的文件路径和名称。按 `Enter` 。

    - 可能会出现确认信息。

    - 输入 `Y` 然后按 `Enter` 键删除。


    ## RMDIR

    删除目录。在删除目录之前，必须先删除目录中的所有文件。


    - 输入 `rmdir` 后跟要删除的目录路径和名称。按 `Enter` 键。


    ## SHUTDOWN

    关闭或重启计算机。


    - 若要关闭计算机，输入 `shutdown -h` 然后按 `Enter` 键。

    - 若要重启计算机，输入 `shutdown -r` 然后按 `Enter` 键。

    注意：如果你是以普通用户登录的，Linux 将要求你输入密码。输入密码后按 `Enter` 键。


    ![](img/e2eac216eed4c6806c742998f1420a0c_250_2.png)


    ## TAR

    从压缩包中提取文件以便处理。压缩包是为了节省空间而存储为单个文件的组。`tar` 命令用于提取 .tar 扩展的文件，通常与 gzip 命令配合使用。


    - 输入 `tar -xf` 后跟压缩文件的路径和名称。然后按 `Enter` 键。


    ![](img/e2eac216eed4c6806c742998f1420a0c_250_3.png)


    ```

    root    tty1  Nov 16

    smith   tty2  Nov 16

    root@localhost /root#

    ```


    ## WHO

    显示在命令行登录计算机的用户列表。


    - 输入 `who` 然后按 `Enter` 键。

    注意：你可以使用 `who -am` 来确定你是以哪个账户登录。


    ![](img/e2eac216eed4c6806c742998f1420a0c_250_4.png)


    ## 连接互联网

    本章介绍了如何设置互联网连接，以便访问万维网。


    - 设置互联网连接

    - 输入 DNS 和网关数字

    - 连接互联网


    ![](img/e2eac216eed4c6806c742998f1420a0c_252_0.png)


    ## 设置互联网连接

    在浏览网页、交换电子邮件和加入新闻组之前，你需要设置互联网连接。


    1. 点击显示主菜单。

    2. 点击互联网（Internet）。

    3. 点击拨号配置（Dialup Configuration）。

    注意：如果你是以普通用户登录计算机，会弹出一个请求 root 账户密码的窗口。输入密码后按 `Enter` 键。

    4. 出现互联网连接窗口和“新建互联网连接”对话框。该对话框将帮助你设置互联网连接。

    5. 点击“下一步”继续。


    ## 连接互联网

    为什么 Linux 没有检测到我的调制调器？

    Linux 可能无法检测某些类型的调制调器，例如即插即用调调器专门为运行 Windows 系统的计算机设计的调制调器。要确定你的调制调器是否可以在 Linux
    上工作，请检查调制调器附带的文档或访问网页：

    www.redhat.com/corp/support/hardware


    ![](img/e2eac216eed4c6806c742998f1420a0c_254_0.png)


    互联网连接

    密码

    账户名称：Home

    新建互联网连接

    找到调制调器

    在系统中未找到以下调制调器：

    | 设备 | 返回 |

    | --- | --- |

    | USB23 | 11019 | （等待，检查文本对齐）


    ![](img/e2eac216eed4c6806c742998f1420a0c_254_1.png)


    如果你尚未设置调制调器，则会出现此消息。你的调制调器必须设置互联网连接。

    注意：如果没有出现此消息，请跳到第 244 页的步骤 7 。


    - 点击“下一步”让 Linux 检测并设置你的调制调器。

    - 此区域显示 Linux 找到的调器信息。

    - 点击“下一步”继续。

    注意：如果 Linux 未检测到你的调制调器，请查看此页顶部。


    ## 设置互联网连接

    在设置互联网连接时，你需要输入信息，如访问互联网服务提供商（ISP）所需的拨打的电话号码。


    ![](img/e2eac216eed4c6806c742998f1420a0c_255_0.png)


    ## 设置互联网连接（续）


    | 互联网连接 | | | |

    |---|---|---|---|

    | 账户号码 | 电话号码 | | |

    | 新建互联网连接 | | | |

    | 电话号码和名称 | | | |

    | 为互联网连接选择一个名称。账户名称：我的互联网连接 | | | |

    | 输入互联网供应商的电话号码。电话和区号是可选的。 | | | |

    | 11 区/县代码 | 电话 (212) 555-1234 | | |

    | 返回 | 下一步 | 取消 | |


    - 点击此区域并输入互联网连接的名称。

    - 如果在拨打互联网供应商的电话号码之前需要拨打号码，请点击此区域并输入该号码。

    注意：你可能需要拨打外线或禁用呼叫等待。

    - 点击此区域并输入互联网供应商的区号。

    - 点击此区域并输入互联网供应商的电话号码。

    - 点击此区域并输入互联网账户的用户名。

    - 点击此区域并输入互联网账户的密码。

    注意：每输入一个字符都会出现一个符号（*），以防止他人看到你的密码。

    - 点击“下一步”继续。

    你可以随时点击“返回”回到上一个步骤并更改答案。


