    # # ABOUT ID BOOKS WORLDWIDE


    Welcome to the world of IDG Books


    IDG Books Worldwide, Inc., is a subsidiary of International Data Group, the world''s
    largest publisher of computer-related information and the leading global provider
    of information services on technology IDG was founded more than 30 years ago by
    Patrick McGoernn covers more than 9,000 people worldwide IDG publishes more than
    290 computer publications in 75 countries. More than 90,000 people read our IDG
    publications each month


    Launched in 1990, IDG Books Worldwide is today the #1 Publisher of best-selling
    computer books in the United States. We are proud to have received eight awards
    from the Computer Press Association in recognition of excellence and three from
    Computer Currents'' First Annual Readers Choices. Our best-selling... For Dummies*
    series has more than 50 million copies in print with translations in 31 languages.
    IDG Worldwide through a joint venture with IDG''s Hi-Tech Beijing, became the
    first publisher to publish a bestseller for the second time. IDG Books Worldwide
    became the first choice for readers around the world who want to learn how to
    manage their businesses


    Our mission is simple: every one of our books is designed to bring extra value
    and skillful instructions to the reader. Our books are written by experts who
    understand and care about our readers. The knowledge base of our editorial staff
    comes from years of experience in publishing, education, and journalism - we use
    our experience to produce books that carry us into the new millennium. We pay
    close attention to details like interior design, use of icons, and illustrations.
    Because we use an efficient process of authoring, editing, and publishing our
    books, we can spend more time ensuring superior content and less time on the techniques
    of making books.


    You can count on our commitment to deliver high-quality books at competitive prices
    on topics you want to read about. At IDG Books Worldwide, we continue the tradition
    of delivering quality for more than 30 years. You''ll find no better book on a
    subject than one from IDG Books Worldwide.


    ![](img/e2eac216eed4c6806c742998f1420a0c_4_0.png)


    John Kilcullen

    Chairman and CEO

    IDG Books Worldwide, Inc.


    Steven Berkowitzitz

    President and Publisher

    IDG Books Worldwide, Inc.


    ![](img/e2eac216eed4c6806c742998f1420a0c_4_1.png)


    IDG is the world''s leading media, research and exposition company. Founded in
    1964, IDG had 1997 revenues of $2.5 billion and more than 9,000 employees. IDG
    rewards the wide range of media options that reach buyers in 75 countries representing
    95% of worldwide IT industry. IDG''s diverse product and services span six key
    areas including print publishing, online publishing, magazines and newsletters,
    exhibitions and conferences, market research, education, and global marketing
    services. More than 90,000 people read our IDG publications each month, and millions
    of people annually visit the Macroworld and the world family of publications.
    IDG is one of the fastest-growing book publishers worldwide, with more than 700
    titles in 33 languages. The *For Dummies* series has more than 50 million copies
    in print. IDG publishes more than 500 books each year. Our IDG.net (www.idg.net),
    which comprises more than 5,000 pages in 25 languages, gives online users the
    latest information on technology and business. International Data Corporation
    (IDC) is the world''s leading provider of technology data and analysis, with research
    centers in over 41 countries and more than 400 research analyses worldwide. IDG
    World is a leader in publishing more than 168 globally branded conferences and
    expositions in 35 countries including E3 (Electronic Entertainment Expo), Macroworld
    Expo, and Asia Pacific. The Agenda is the world''s leading computer trade magazine.
    IDG''s subsidiary, E-Train, is the world''s largest training company, with more
    than 230 locations worldwide and 785 training courses. IDG Marketing Services
    helps the world-leading IT companies build international brand recognition by
    developing global integrated marketing programs via IDG''s print, online and exposition
    products worldwide. Further information about the company can be found at www.idg.com.'
