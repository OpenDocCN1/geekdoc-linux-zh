    # Why can''t I save the changes I made

    to a file on a floppy disk?


    You may not have permission to make

    changes to the file. To change the file,

    perform one of the following tasks:


    +   - Log on to your computer using the

    root account as shown on page 172.

    The root account can always make

    changes to the files on a floppy disk.

    - Change the permissions for the

    file as shown on page 74.

    You must be logged on to your computer

    using the root account to change

    the permissions for the file.


