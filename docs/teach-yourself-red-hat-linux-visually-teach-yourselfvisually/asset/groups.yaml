    # What other types of help does the Help feature offer?


    In the Inome Help Browser window, you can click one of the following options to
    get help.


    Red Hat Linux Getting Started Guide

    Provides basic help on using Linux.


    Red Hat Linux Install Guide

    Provides help on installing Linux.


    Red Hat Linux Reference Guide

    Provides detailed help on installing and using Linux.


    ![](img/e2eac216eed4c6806c742998f1420a0c_54_0.png)


    GNOME Documents

    Provides help on GNOME programs.


    Man Pages

