    - GNOME Control Center allows you to view and change settings such as the color
    of your desktop.

    - Terminal allows you to display the Terminal window where you can type Linux
    commands.

    - Netscape Communicator allows you to browse the Web, exchange electronic mail
    and join newsgroups.


    ### GNOME Pager

    - Desktop View allows you to switch between different desktops.

    - Task List Button allows you to display a list of all open windows.

    - Applications View displays a button for each open window over the current desktop.


    ![](img/e2eac216eed4c6806c742998f1420a0c_41_1.png)


    ## LINUX BASICS


    ### START A PROGRAM


    You can use the Main Menu button to start your programs.


    ![](img/e2eac216eed4c6806c742998f1420a0c_42_0.png)


    ### START A PROGRAM


    | System menus | Applications |

    | :--- | :--- |

    | Applications | Address Book |

    | Games | Edit |

    | Graphics | emacs Editor |

    | Internet | gEdit |

    | Multimedia | GHex |

    | System | GnomePGP |

    | Settings | gnotepad+ |

    | Gnumeric spreadsheet | Time tracking tool |


    ![](img/e2eac216eed4c6806c742998f1420a0c_42_1.png)


    1. Click to display the Main Menu.

    2. Position the mouse over a menu item that displays an arrow (→). A second menu
    appears.

    3. Click the program you want to start.


    Note: To close the Menu without selecting a program, click outside the menu area.

    - In this example, the Calendar appears.

    - The GNOME Pager displays a button for the open program.


    ## MOVE A WINDOW


    If a window covers items on your screen, you can move the window to a different
    location.


    ![](img/e2eac216eed4c6806c742998f1420a0c_43_0.png)


    ![](img/e2eac216eed4c6806c742998f1420a0c_43_1.png)


    1. Position the mouse over the title bar of the window you want to move (cursor)
    changes to (cursor).

    2. Drag the mouse to where you want to place the window.

    3. The window moves to the new location.

    '
  mdcn: "\n\n# LINUX 简介\n\n## 账户操作\n\n当你安装 Linux 时，系统会创建一个 root 账户和一个或多个用户账户。你应该只使用\
    \ root 账户来执行管理和维护任务，因为使用 root 账户可能会损坏你的计算机。在执行日常任务时，你应该在用户账户下操作。\n\n![](img/e2eac216eed4c6806c742998f1420a0c_37_0.png)\n\
    \n## 软磁盘和 CD-ROM 驱动器\n\n你可以查看软磁盘和 CD-ROM 光的内容。你还可以将文件复制到软磁盘、格式化软磁盘以准备使用，以及在计算机上播放音乐光盘。\n\
    \n![](img/e2eac216eed4c6806c742998f1420a0c_37_1.png)\n\n## 设置硬件和软件\n\nLinux 帮助你设置硬件，例如打印机、声卡和网卡。Linux\
    \ 还帮助你安装包含程序和文件的软件包，这些包为 Linux 增加了新功能。\n\n![](img/e2eac216eed4c6806c742998f1420a0c_37_2.png)\n\
    \n## 连接网络\n\nLinux 附带 Netscape Communicator，它允许你浏览网页、与世界各地的人交换电子邮件，并加入新闻组以与有共同兴趣的人交流。\n\
    \n![](img/e2eac216eed4c6806c742998f1420a0c_37_3.png)\n\n## 使用鼠标\n\n鼠标是一种手持设备，允许你选择和移动屏幕上的项目。\n\
    \n当你在桌面上移动鼠标时，屏幕上的鼠标指针会向相同的方向移动。鼠标指针会根据它在屏幕上的位置以及你正在执行的任务呈现不同的形状，例如 ✎ 或 ⚡。\n\n\
    ![](img/e2eac216eed4c6806c742998f1420a0c_38_0.png)\n\n## 鼠标动作\n\n### 三键鼠标\n\n\
    如果你有一个三个按钮的鼠标，可以使用鼠标中间键执行某些任务。如果你有一个两个按钮的鼠标，可以通过同时按下左键和右键来模拟第三个按钮。\n\n- 点击\n \
    \ 按下并释放左鼠标键。\n\n- 双击\n  快速按下并释放左鼠标键两次。\n\n- 右键\n  按下并释放右鼠标键。\n\n- 拖动\n  将鼠标指针置于屏幕上的对象上，然后按住左鼠标键并移动鼠标到你想放置对象的地方。然后释放按钮。\n\
    \n![](img/e2eac216eed4c6806c742998f1420a0c_38_1.png)\n\n## 启动 LINUX\n\n当你打开计算机时，可以启动\
    \ Linux 来执行任务。\n\n![](img/e2eac216eed4c6806c742998f1420a0c_39_0.png)\n\n当你安装 Linux\
    \ 时，系统会创建一个 root 账户和一个或多个用户账户。你应该只使用 root 账户来执行管理任务。在执行日常任务时，你应该使用用户账户。若要在安装 Linux\
    \ 后创建用户账户，请参阅第 164 页。\n\n## 启动 LINUX\n\n![](img/e2eac216eed4c6806c742998f1420a0c_39_1.png)\n\
    ![](img/e2eac216eed4c6806c742998f1420a0c_39_2.png)\n\n- 开启计算机。\n- 出现一个对话框，询问你的用户名。\n\
    - 注意：如果对话框没有出现，请参阅第 29 页顶部。\n- 输入你的用户名然后按 Enter 键。\n- 输入你的密码然后按 Enter 键。\n- 注意：你输入的每个字符都会显示一个符号\
    \ (*)，以防止他人看到密码。\n\n## LINUX 基础\n\n### 为什么我启动 Linux 时会出现这个屏幕？\n\n如果你在计算机上安装 Linux\
    \ 时没有选择使用图形界面，就会出现此屏幕。要启动 GNOME 桌面环境，请执行以下步骤。\n\nRed Hat Linux release 6 (2)\n\
    Kernel 2.6.9-x886\n\n注意在使用 Xconfig 程序更改显示设置时，你可以选择使用图形登录。要使用 X 更改显示设置，请参阅第 42\
    \ 页。\n\n```\nlocalhost:tsmith\nPassword:\nLast login: Thu Nov 4 14:45 on localhost\n\
    tsmith@localhost\n```\n\n- 输入你的用户名并按 Enter 键。\n- 输入你的密码然后按 Enter 键。\n- 注意：密码不会显示在屏幕上，以防止他人看到。\n\
    - 输入 startx 然后按 Enter 键。\n\n![](img/e2eac216eed4c6806c742998f1420a0c_40_0.png)\n\
    ![](img/e2eac216eed4c6806c742998f1420a0c_40_1.png)\n\n## Red Hat Online\n\n你正在以\
    \ root 身份运行 GNOME 文件管理器。作为 root，你可以损坏系统，且文件管理器不会阻止你。你的操作可能会影响系统上的每个非特权账户。\n\n\
    出现帮助窗口，提供了有关如何使用 Linux 的帮助。\n注意：有关帮助功能的信息，请参阅第 42 页。\n\n如果你以 root 身份登录计算机，会弹出一个警告信息，提示你可以使用\
    \ root 账户损坏计算机。出现一个窗口，显示你计算机的内容。\n\n- 点击关闭窗口。\n- 你可以启动 Linux 执行任务。\n- 点击 OK 关闭警告信息。\n\
    - 点击关闭窗口。\n\n## 屏幕区域\n\n### 主目录\n允许显示存储你个人文件的目录内容。\n\n### 帮助网页\n允许你快速显示网络上提供的使用\
    \ Linux 帮助的页面。\n\n### 软磁盘图标\n允许你显示软磁盘的内容。\n\n![](img/e2eac216eed4c6806c742998f1420a0c_41_0.png)\n\
    \n### GNOME 面板\n\n### 桌面\n屏幕的背景区域。\n\n### 时钟\n显示当前日期和时间。\n\n### 隐藏按钮\n隐藏 GNOME\
    \ 面板。\n\n### 主菜单按钮\n提供程序的快速访问。\n\n### 启动器\n- 帮助提供 Linux 帮助。\n- GNOME 控制中心允许更改设置，如桌面颜色。\n\
    - 终端允许你输入 Linux 命令的窗口。\n- Netscape Communicator 允许你浏览网页、交换电子邮件并加入新闻组。\n\n## GNOME\
    \ 切换器\n- 桌面视图允许切换不同的桌面。\n- 任务列表按钮显示所有打开窗口的列表。\n- 视图在当前桌面上显示每个打开窗口的按钮。\n\n![](img/e2eac216eed4c6806c742998f1420a0c_41_1.png)\n\
    \n## LINUX 基础\n\n### 启动程序\n\n你可以使用菜单按钮启动程序。\n\n![](img/e2eac216eed4c6806c742998f1420a0c_42_0.png)\n\
    \n### 启动程序\n\n| 系统 | 应用程序 |\n| :--- | :--- |\n| 应用程序 | 地址簿 |\n| 游戏 | 编辑 |\n| 图形\
    \ | emacs 编辑 |\n| 互联网 | gEdit |\n| 多媒体 | GHex |\n| 系统 | GnomePGP |\n| 设置 | gnotepad+\
    \ |\n| Gnumeric 电子表格 | 时间跟踪工具 |\n\n![](img/e2eac216eed4c6806c742998f1420a0c_42_1.png)\n\
    \n1. 点击显示主菜单。\n2. 将鼠标置于显示箭头 (→) 的菜单项上。出现第二个菜单。\n3. 点击你想启动的程序。\n\n注意：要在不选择程序的情况下关闭菜单，请点击菜单区域外。\n\
    - 在示例中，出现了日历。\n- GNOME 切换器显示打开程序的按钮。\n\n## 移动窗口\n\n如果窗口遮挡了屏幕上的项目，你可以将窗口移动到不同的位置。\n\
    \n![](img/e2eac216eed4c6806c742998f1420a0c_43_0.png)\n\n![](img/e2eac216eed4c6806c742998f1420a0c_43_1.png)\n\
    \n1. 将鼠标置于你想移动的窗口的标题栏上，光标变为（箭头）。\n2. 拖动鼠标到你想放置窗口的地方。\n3. 窗口移动到新位置。\n\n"
