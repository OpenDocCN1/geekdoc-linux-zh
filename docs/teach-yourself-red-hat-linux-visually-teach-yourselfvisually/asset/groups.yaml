    # INTRODUCTION TO THE WEB


    The World Wide Web is part of the Internet and consists of a huge collection of
    documents stored on hundreds of thousands of computers around the world.


    ## Links


    Web pages contain highlighted text or images, called links, that connect to other
    pages on the Web. You can select a link on a Web page to display another Web page
    located on the same computer or a computer across the city, country or world.


    The World Wide Web is also called the Web.


    ## Web Page


    A Web page is a document on the Web. Web pages can include text, pictures, sound
    and video.


    ![](img/e2eac216eed4c6806c742998f1420a0c_265_0.png)


    ## Web Site


    A Web site is a collection of Web pages maintained by a college, university, government
    agency, company or individual.


    ## URL


    Each Web page has a unique address, called a Uniform Resource Locator (URL). You
    can display any Web page if you know its URL.


    ## Connecting to the Internet


    Most people use an Internet Service Provider (ISP) to connect to the Internet.
    Once you pay your ISP to connect to the Internet, you can exchange information
    on the Internet free of charge.


