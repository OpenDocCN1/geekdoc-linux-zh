  - '[PAGE 275]


    # ADD A BOOKMARK


    You can create bookmarks to store the addresses of your favorite Web pages. Bookmarks
    save you from having to remember and constantly retype Web page addresses.


    ![](img/e2eac216eed4c6806c742998f1420a0c_275_0.png)


    Netscape Navigator uses folders to organize related bookmarks into categories,
    such as Business and Finance. Many folders already contain bookmarks that you
    can quickly access Web pages.


    # ADD A BOOKMARK


    ![](img/e2eac216eed4c6806c742998f1420a0c_275_1.png)


    +   1 Display the Web page you want to add to your list of bookmarks.

    2 Click Bookmarks.

    3 Click File Bookmark.

    4 A list of folders that can store the bookmark appears.

    5 Click the folder you want to store the bookmark.

    6 Netscape Navigator adds the bookmark to the folder.


    264'
  - '[PAGE 276]


    # Is there another way to quickly access useful Web pages?


    The Personal toolbar gives you quick access to useful Web pages.


    ![](img/e2eac216eed4c6806c742998f1420a0c_276_0.png)


    ### WebMail

    Lets you access Netscape''s free e-mail service.

    ### Contact

    Lets you access Netscape''s contact management service, which includes a calendar
    and address book.

    ### People

    Lets you search for people.

    ### Yellow Pages

    Lets you search for people and businesses.

    ### Download

    Lets you obtain the latest versions of Netscape software.

    ### Find Sites

    Lets you search for Web pages.


    # SELECT A BOOKMARK


    ![](img/e2eac216eed4c6806c742998f1420a0c_276_1.png)


    +   1. Click Bookmarks.

    2. Click the folder that stores the bookmark for the Web page you want to display.

    3. Click the bookmark for the Web page you want to display.


    +   - The Web page appears.'
  - '[PAGE 277]


    # DELETE A BOOKMARK


    You should delete a bookmark you no longer use. Deleting bookmarks can help keep
    your bookmark list from becoming cluttered.


    ![](img/e2eac216eed4c6806c742998f1420a0c_277_0.png)


    # DELETE A BOOKMARK


    ![](img/e2eac216eed4c6806c742998f1420a0c_277_1.png)


    +   - Click Bookmarks.

    - Click Edit Bookmarks.


    +   - A window appears, displaying a list of your bookmarks. Bookmarks display
    the symbol.

    - Click the bookmark you want to delete.

    - Click Edit.

    - Click Delete.


    +   - The window will disappear from the list.


    266'
  - '[PAGE 278]


    # SEARCH THE WEB


    # BROWSE THE WEB


    You can find pages on the Web that discuss topics of interest to you.


    ![](img/e2eac216eed4c6806c742998f1420a0c_278_0.png)


    # SEARCH THE WEB


    There are search tools on the Web that catalog information about millions of Web
    pages. Popular search tools could include Excite, HotBot and Lycos.


    ![](img/e2eac216eed4c6806c742998f1420a0c_278_1.png)


    +   1 Click Search to find pages of interest.

    2 Click the search tool you want to use.


    +   3 Click this area and type a word you want to search for. Then press the Enter
    key.


    +   4 Click a Web page of interest to display the Web page.


    +   You may need to use the scroll bar to view the entire list.'
