    # Linux 是否带有我访问互联网信息所需的程序？


    Linux 自带了 Netscape Communicator，它包含了允许你访问互联网信息的程序。


    ![](img/e2eac216eed4c6806c742998f1420a0c_258_0.png)


    # Netscape Navigator


    允许你浏览 Web 上的信息。更多信息，请参阅第 254 页。


    # Netscape Messenger


    允许你交换电子邮件（e-mail）并加入新闻组。更多信息，请参阅第 270 页和 286 页。


    ![](img/e2eac216eed4c6806c742998f1420a0c_258_1.png)


    | 账户名称 | 电话号码 | 状态 | 地址 | | | |

    |---|---|---|---|---|---|

