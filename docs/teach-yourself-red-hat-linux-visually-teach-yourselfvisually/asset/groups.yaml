    # What should I do before preparing to install Linux?


    +   - You should back up the information on your computer. Deleting partitions
    will permanently remove all the information on your computer.

    - Obtain a Windows 98 startup floppy disk. If you do not have a Windows 98 startup
    floppy disk, you can create a startup disk using any Windows 98 computer.

    - Make sure your computer will start from the floppy drive when you turn on your
    computer. If your computer does not start from the floppy drive, consult your
    computer''s manual to determine how to change the BIOS settings.


