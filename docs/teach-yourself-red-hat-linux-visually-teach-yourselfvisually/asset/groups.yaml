    由 Patrick McGover 在 30 多年前创立，在全球拥有超过 9000 人。IDG 在 75 个国家出版超过 290 种计算机出版物。每月有 90,000
    人阅读我们的 IDG 出版物。1990 年成立的 IDG Books Worldwide 现在是美国最畅销计算机书籍的出版商。我们自豪地获得了计算机出版社协会颁发的八项奖项，以及《Computer
