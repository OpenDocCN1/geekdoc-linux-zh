    maranGraphics 是一家位于加拿大多伦多附近的家族经营企业。


    ![](img/e2eac216eed4c6806c742998f1420a0c_5_0.png)


    在 **maranGraphics**，我们相信制作出出色的计算机书籍——一次一本。


    我们投入了数小时来决定执行每项任务的最优方式，这样您就不必费心了！我们清晰、易于遵循的截图和说明将引导您从头到尾完成每一项任务。


    感谢您购买我们认为物超所值的、最好的计算机书籍。我们希望您在使用这本书时的乐趣，像我们创作它一样愉快！


    每一本 maranGraphics 的书籍都使用了我们在过去 25 年中开发的获奖交流流程。我们组织截图、文本和插图的方式，让您能够轻松学习新概念和任务。


    我们详细的插图与文字相辅相成，帮助强化信息。每一幅插图都是心血结晶——有些需要花费一周的时间来绘制！


