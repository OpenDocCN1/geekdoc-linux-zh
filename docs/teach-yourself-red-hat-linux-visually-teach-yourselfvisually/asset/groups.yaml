    # PREPARE TO INSTALL LINUX


    You must delete all the partitions on your computer before you can install Linux.

    Deleting the partitions will permanently erase all the information on your computer.


    ![](img/e2eac216eed4c6806c742998f1420a0c_17_0.png)


    # PREPARE TO INSTALL LINUX (CONTINUED)


    FDISK Options

    Current fixed disk drive: 1

    Choose one of the following:

    1. Create DOS partition or Logical DOS Drive

    2. Set size

    3. Delete partition or Logical DOS Drive

    4. Display partition information


    Enter choice: [1]


    Press Esc to exit FDISK


    Delete DOS Partition or Logical DOS Drive

    Current fixed disk drive: 1

    Choose one of the following:

    1. Delete Primary DOS Partition

    2. Delete size

    3. Delete Logical DOS Drive(s) in the Extended DOS Partition

    4. Delete Non-DOS Partition


    Enter choice: [1]


    Press Esc to return to FDISK Options


    # DELETE A PARTITION


    This area displays a list of FDISK options that you can choose from.


    Press 3 to delete a partition and then press the Enter key.


    This area displays the types of partitions that you can delete.


    Press 1 to delete the primary partition and then press the Enter key.


    A warning message appears, stating that you will lose the data in the partition.'
