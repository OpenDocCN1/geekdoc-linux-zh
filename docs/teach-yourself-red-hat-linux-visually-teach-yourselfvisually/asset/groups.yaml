    \ | | | | |\n| 组 | | | | | | | | | | | | |\n\n- 4. 点击这些按钮，为文件的所有者开启读取、写入或执行权限。\n\
    - 5. 点击这些按钮，为其他用户 开启读取、写入或执行权限。\n  - 读取：用户仅读取文件。\n  - 写入：用户可以写入和删除文件。\n  - 执行：用户可以运行程序。\n\
    - 6. 点击“确定”。文件权限已更改。\n注意：root 账户可以访问每个用户的用户的文件。\n\n# 在桌面上创建链接\n\n你可以在桌面上创建一个链接，作为经常使用的文件的快捷方式。\n\
    \n![](img/e2eac216eed4c6806c742998f1420a0c_87_0.png)\n\n# 在桌面上创建链接\n\n![](img/e2eac216eed4c6806c742998f1420a0c_87_1.png)\n\
    \n- 将鼠标悬停在你想要链接的文件上。\n- 同时按住鼠标左键和右键，将文件拖到空白区域。\n- 注意：如果你的鼠标有中间键，请按住中间键将文件拖到桌面。\n\
    \n# 操作文件\n\n我如何重命名或删除桌面上的链接？\n\n你可以像重命名文件一样重命名或删除桌面上的链接。重命名或删除链接不会影响原始文件。要重命名或删除，请参阅第\
    \ 64 页。\n\n![](img/e2eac216eed4c6806c742998f1420a0c_88_0.png)\n![](img/e2eac216eed4c6806c742998f1420a0c_88_1.png)\n\
    \n- 链接出现在桌面上。\n- 右键点击该链接。\n- 要重命名或删除，请参阅第 76 页。\n\n# 创建目录\n\n你可以创建一个新目录来组织文件。\n\
    \n![](img/e2eac216eed4c6806c742998f1420a0c_89_0.png)\n\n如果你是以普通用户身份登录计算机，通常只能为你创建的文件夹创建目录。如果你以\
    \ root 身份登录，你可以为计算机上的任何文件夹创建目录。\n\n# 创建目录\n\n| 文件 | 编辑 | 设置 | 布局 | 命令 | 帮助 | 首页\
    \ | 最近 | 视图 | 默认 | 自定义 |\n|---|---|---|---|---|---|---|---|---|---|---|---|\n\
    | 备份 | 后进 | 重命名 | | | | | | | | | |\n\n- 1. 在桌面的空白处点击右键。\n- 2. 点击“新建”。\n- 3. 输入目录名称。\n\
    - 4. 点击“确定”创建目录。\n\n# 操作文件\n\n创建新目录如何帮助组织文件？\n\n创建一个新目录就像把文件放在分类柜里。你可以创建许多目录来存储你需要的文件。新目录会出现在结构中。\n\
    \n![](img/e2eac216eed4c6806c742998f1420a0c_90_0.png)\n![](img/e2eac216eed4c6806c742998f1420a0c_90_1.png)\n\
    \n- 新目录出现在结构中。\n- 你可以创建许多目录来存储你需要的文件。\n\n- 1. 在桌面的空白处点击右键。\n- 2. 点击“新建”。\n- 3.\
    \ 输入目录名称。\n- 4. 点击“确定”创建目录。\n- 5. 执行第 78 页的第 4 步和第 5 步创建目录。\n注意：新目录可能出现在 GNOME\
    \ 面板后面。如需隐藏 GNOME 面板以便查看新目录，请参阅第 17 页。\n\n"
