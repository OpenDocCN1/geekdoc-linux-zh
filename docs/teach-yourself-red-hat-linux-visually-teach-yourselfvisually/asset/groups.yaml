    # MOUNT AN MS-DOS FLOPPY DISK


    You must mount an MS-DOS floppy disk before you can access the information on
    the disk.


    ![](img/e2eac216eed4c6806c742998f1420a0c_193_0.png)


    Before you can mount an MS-DOS floppy disk, you must set up Linux to use floppy
    disks as shown on page 178.


    # MOUNT AN MS-DOS FLOPPY DISK


    ![](img/e2eac216eed4c6806c742998f1420a0c_193_1.png)


    - 1. Insert the MS-DOS floppy disk that contains the files you want to display
    into your floppy drive.

    2. Click to display the Main Menu.


    - 3. Click System.

    4. Click Disk Management.

    The Mount Tool window appears.


    - 5. Click the Mount button beside /mnt/dosfloppy.


    Note: /mnt/dosfloppy does not appear. see page 178 to set up Linux to use MS-DOS
    floppy disks.


    # WORK WITH FLOPPY AND CD-ROM DRIVES


    Do I need to mount an MS-DOS floppy every time I use the disk?


    Each time you insert an MS-DOS floppy disk into your floppy drive, you must mount
    the disk. Mounting the disk allows you to access the information stored on the
    disk. Before you remove the disk from your floppy drive, you must mount the disk
    to indicate that you no longer want to access the information on the disk.


    ![](img/e2eac216eed4c6806c742998f1420a0c_194_0.png)


