    ## 新闻组 (NEWSUPS)


    你可以加入新闻组了解更多关于 Linux 的信息。新闻组是一个允许共同兴趣的人通信的组。你可以在 news.redhat.com 服务器找到一些 Linux
    新闻组。

    ![](img/e2eac216eed4c6806c742998f1420a0c_58_2.png)


    - redhat.config

    关于硬件软件设置以及修复硬件软件问题的讨论。

