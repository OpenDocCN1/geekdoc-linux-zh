  - '[PAGE 180]


    # When I delete a user account, what can I do with the account''s data?


    ![](img/e2eac216eed4c6806c742998f1420a0c_180_0.png)


    # Archive the account''s data


    Compresses the data for the account into a single file that Linux stores in a
    directory named oldaccounts within the home directory.


    # Delete the account''s data


    Removes the data for the account.


    # Leave the account''s data in place


    Leaves the data for the account in a directory with the user''s name within the
    home directory.


