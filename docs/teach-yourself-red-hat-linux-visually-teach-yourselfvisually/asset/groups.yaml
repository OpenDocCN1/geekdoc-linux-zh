    # START KDE


    KDE (K Desktop Environment) is a graphical desktop environment that you can use
    with Linux.


    ![](img/e2eac216eed4c6806c742998f1420a0c_237_0.png)


    KDE is an alternative to the GNOME desktop environment that is shown throughout
    this book. Some people prefer using KDE since it came with earlier versions of
    Linux and is more like the Windows operating system.


    You can find out more about KDE at the www.kde.org site.


    # START KDE


    ![](img/e2eac216eed4c6806c742998f1420a0c_237_1.png)


    ![](img/e2eac216eed4c6806c742998f1420a0c_237_2.png)


