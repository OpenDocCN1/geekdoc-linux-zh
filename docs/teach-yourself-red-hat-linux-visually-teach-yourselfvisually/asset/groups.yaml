    # EXCHANGE ELECTRONIC MAIL


    When would I not want Netscape Messenger to automatically check for new messages?


    You will not want Netscape Messenger to automatically check for new messages if
    you offer read messages when you are not connected to the Internet. Each time
    Netscape Messenger checks for new messages, an error message will appear, indicating
    that you are not connected to the Internet. This can be distracting over time.


