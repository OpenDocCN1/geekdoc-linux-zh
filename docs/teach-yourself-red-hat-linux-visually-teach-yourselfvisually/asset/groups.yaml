  mdcn: "\n\n# 操作文件\n\n如果我只知道文件名的一部分，该如何搜索文件呢？\n\n你可以使用星号 (*) 或问号 (?) 来帮助你查找文件。\n\n\
    ![](img/e2eac216eed4c6806c742998f1420a0c_84_0.png)\n\n星号 (*) 代表多个字符。例如，输入 `report*`\
    \ 可以查找所有以 report 开头的文件。\n\n问号 (?) 代表单个字符。例如，输入 `199?report` 可以查找以 199 开头、中间跟一个单个字符并以\
    \ report 结尾的文件。\n\n![](img/e2eac216eed4c6806c742998f1420a0c_84_1.png)\n![](img/e2eac216eed4c6806c742998f1420a0c_84_2.png)\n\
    ![](img/e2eac216eed4c6806c742998f1420a0c_84_3.png)\n\n- 查找对话框出现，显示搜索结果。\n- 此区域列出了每个包含匹配文件的目录。匹配的文件会在每个目录下方缩进显示。\n\
    - 点击包含你想要操作的文件的目录。该目录将高亮显示。\n- 切换到此目录。\n- 该目录已被选中。\n- 此区域显示你搜索的文件。\n\n# 修改文件权限\n\
    \n你可以更改文件的权限，以控制用户访问文件的类型。\n\n![](img/e2eac216eed4c6806c742998f1420a0c_85_0.png)\n\
    \n如果你是以普通用户身份登录计算机，通常通常只能更改你创建的文件的权限。如果你以 root 身份登录，你可以更改计算机上任何文件的权限。\n\n# 修改文件权限\n\
    \n![](img/e2eac216eed4c6806c742998f1420a0c_85_1.png)\n\n- 右键点击你想要更改权限的文件。会出现菜单。\n\
    - 点击“属性”。出现属性对话框。\n- 点击“权限”选项卡。\n- 显示文件所有者的用户名。文件的所有者通常是创建该文件的人。\n\n# 操作文件\n\n\
    我更改了文件的权限，但其他用户无法访问该文件。出了什么问题？\n\n在其他用户访问目录中的文件之前，你必须更改你主目录的权限。你可以以更改文件权限相同的方式更改目录的权限。开启“执行\
    \ (Exec)”权限将允许用户打开目录。开启“读取”权限将允许用户查看目录中的文件。\n\n![](img/e2eac216eed4c6806c742998f1420a0c_86_0.png)\n\
    ![](img/e2eac216eed4c6806c742998f1420a0c_86_1.png)\n![](img/e2eac216eed4c6806c742998f1420a0c_86_2.png)\n\
