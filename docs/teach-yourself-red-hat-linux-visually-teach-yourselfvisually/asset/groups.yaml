    # USING THE COMMAND LINE


    ![](img/e2eac216eed4c6806c742998f1420a0c_248_0.png)


    ![](img/e2eac216eed4c6806c742998f1420a0c_248_1.png)


    ## MAN

    Displays help information about a command.


    - Type **man** followed by the name of the command you want information on. Then
    press the `Enter` key.

    - To redraw the command line, press the `Q` key.


    ## MKDIR


    Creates a new directory.


    - Type **mkdir** followed by a location and name for the directory you want to
    create. Then press the `Enter` key.


    ![](img/e2eac216eed4c6806c742998f1420a0c_248_2.png)


    ![](img/e2eac216eed4c6806c742998f1420a0c_248_3.png)


    ## MV

    Moves a file to a new location.


    - Type **mv** followed by the location and name of the file you want to move.

    - Type the location and name of the directory you want to place the file. Then
    press the `Enter` key.


    ## PASSWD

    Changes your password.


    - Type **passwd** and then press the `Enter` key.

    Note: If you are logged on as a regular user, Linux will ask you to type your
    current password. Then press the `Enter` key.

    - Type a new password and then press the `Enter` key.

    - Type the new password again to confirm the password and then press the `Enter`
    key.


    ## COMMON LINUX COMMANDS


    ![](img/e2eac216eed4c6806c742998f1420a0c_249_0.png)


    ## PICO

    Starts a program that allows you to create and edit text files.


    - Type `pico` and then press the `Enter` key.

    - To redesign the command line, press and hold down the `Ctrl` key as you press
    the `X` key.


    ![](img/e2eac216eed4c6806c742998f1420a0c_249_1.png)


    ![](img/e2eac216eed4c6806c742998f1420a0c_249_2.png)


    | PID TTY | TIME | CMD |

    | --- | --- | --- |

    | 740 pts/2 | 00:00:00 | bash |

    | 808 pts/2 | 00:00:00 | netscape-commun |

    | 828 pts/2 | 00:00:00 | root |


    ## PS

    Displays a list of running programs that were started from the command line.


    - Type `ps` and then press the `Enter` key.


    ![](img/e2eac216eed4c6806c742998f1420a0c_249_3.png)


    ![](img/e2eac216eed4c6806c742998f1420a0c_249_4.png)


    ```

    [root@localhost #root# pwd]

    /root

    [root@localhost #root# ]

    ```


    ## PWD

    Displays the location and name of the current directory.


    - Type `pwd` and then press the `Enter` key.


    ![](img/e2eac216eed4c6806c742998f1420a0c_249_5.png)


    ![](img/e2eac216eed4c6806c742998f1420a0c_249_6.png)


    ```

    [root@localhost #root# rm /root/meeting_minutes]

    rm: remove /root/meeting_minutes ?

    ```


    ## RM

    Deletes a file.


    - Type `rm` followed by the location and name of the file you want to delete.
    Press the `Enter` key.

    - A confirmation message may appear.

    - Type `Y` and then press the `Enter` key to delete the file.


    ## RMDIR

    Deletes a directory. You must delete all the files in a directory before you can
    delete it.


    - Type `rmdir` followed by the location and name of the directory you want to
    delete. Then press the `Enter` key.


    ## SHUTDOWN

    Shuts down or restarts your computer.


    - To shut down your computer, type `shutdown -h now` and then press the `Enter`
    key.

    - To restart your computer, type `shutdown -r now` and then press the `Enter`
    key.

    Note: If you are logged on as a regular user, Linux will ask you to type your
    password. Type password and then press `Enter` key.


    ![](img/e2eac216eed4c6806c742998f1420a0c_250_2.png)


    ## TAR

    Extracts files from an archive so you can work with the files. An archive is a
    group of files that stored as a single file to save space. The tar command extracts
    files with .tar extension and is often used with the gzip command.


    - Type `tar -xf` and then type the location and name of the archive file you want
    to extract. Then press the `Enter` key.


    ![](img/e2eac216eed4c6806c742998f1420a0c_250_3.png)


    ```

    root    tty1  Nov 16

    smith   tty2  Nov 16

    root@localhost /root#

    ```


    ## WHO

    Displays a list of users who are logged on to the computer at the command line.


    - Type `who` and then press the `Enter` key.

    Note: You can use `who -am` to determine which account you are logged in as.


    ![](img/e2eac216eed4c6806c742998f1420a0c_250_4.png)


