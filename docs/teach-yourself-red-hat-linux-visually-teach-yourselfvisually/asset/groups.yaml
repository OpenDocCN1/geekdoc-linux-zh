    - 2 点击“退出”以退出 KDE。

    - 出现一条消息，说明你可以退出 KDE。

    - 将弹出一个对话框，询问你的用户名。你现在可以使用 KDE 或 GNOME 退出电脑。要使用 KDE 登录，请参阅第 226 页。要使用 GNOME 登录，请参阅第
    173 页。

    - 3 点击“退出”。


    ![](img/e2eac216eed4c6806c742998f1420a0c_241_0.png)


