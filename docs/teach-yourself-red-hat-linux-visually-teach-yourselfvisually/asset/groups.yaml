    # USING MULTIPLE DESKTOPS


    You can work with more than one desktop on your computer.


    ![](img/e2eac216eed4c6806c742998f1420a0c_125_0.png)


    Using multiple desktops is like having more than one monitor. You can use a different
    desktop for each task you need to perform.


    # USING MULTIPLE DESKTOPS


    ![](img/e2eac216eed4c6806c742998f1420a0c_125_1.png)


    - Linux offers four desktops that you can use. The box for the current desktop
    appears shaded and displays an outline of the window(s) open on the desktop.

    - 1 Click the box for the desktop you want to work with.

    - 2 Open the window(s) you want to appear on the desktop. The window(s) will only
    appear on this desktop.

    - The desktop you selected appears.

    - The box for the current desktop appears shaded and displays an outline of the
    open window(s).

    - 3 Switch between desktops, click the box for the desktop you want to display.


    # MAKE A WINDOW APPEAR ON EVERY DESKTOP


    CUSTOMIZE LINUX


    If you frequently use a window, you can have the window appear on every desktop.


    ![](img/e2eac216eed4c6806c742998f1420a0c_126_0.png)


    For information using multiple desktops, see page 114.


    # MAKE A WINDOW APPEAR ON EVERY DESKTOP


    ![](img/e2eac216eed4c6806c742998f1420a0c_126_1.png)


    - 1 Right-click the title bar of the window you want to appear on every desktop.
    A menu appears.

    - 2 Click Stick/Unstick.

    - If you no longer want a window to appear on every desktop, repeat steps 1 and
    2.


    The window will now appear on every desktop.


    # DISPLAY A LIST OF OPEN WINDOWS


    You can display a list of all the windows you have open on your desktops. This
    can help you quickly locate a window you want to work with.


    ![](img/e2eac216eed4c6806c742998f1420a0c_127_0.png)


    For information on using multiple desktops, see page 114.


    # DISPLAY A LIST OF OPEN WINDOWS


    ![](img/e2eac216eed4c6806c742998f1420a0c_127_1.png)


    - Click to display a list of all the windows you have open on your desktops.

    - This area displays a button for each window you chose to appear on every desktop.
    To make a window appear on every desktop, see page 115.

    - This area displays a button for each window you have open on your desktops.

    - Click the button for the window you want to display.

    - The desktop displaying the window appears.


    # HIDE THE GNOME PANEL


    You can hide the GNOME Panel to give you more room on the desktop for performing
    tasks.


    ![](img/e2eac216eed4c6806c742998f1420a0c_128_0.png)


    # HIDE THE GNOME PANEL


    ![](img/e2eac216eed4c6806c742998f1420a0c_128_1.png)


    - Linux initially displays the GNOME Panel.

    - Click the button to hide the GNOME Panel.

    - The GNOME Panel disappears, leaving a button at the bottom left or right corner
    of the screen.

    - To once again display the GNOME Panel, click the button ( or or ).


    Note: The location of the button depends on the button you selected in step 1.


    # HIDE THE GNOME PANEL AUTOMATICALLY


    You can have the GNOME Panel automatically disappear when you are not using the
    panel. This will give you more room on the desktop for performing tasks.


    ![](img/e2eac216eed4c6806c742998f1420a0c_129_0.png)


    # HIDE THE GNOME PANEL AUTOMATICALLY


    ![](img/e2eac216eed4c6806c742998f1420a0c_129_1.png)


    - Linux initially displays the GNOME Panel at all times.

    - 1 Click to display the Main Menu.

    - 2 Click Panel.

    - 3 Click panel properties.


    ![](img/e2eac216eed4c6806c742998f1420a0c_129_2.png)


    - The Panel properties box appears.

    - 4 Click Auto hide to hide the GNOME Panel when you are not using the panel.

    - 5 Click OK to confirm your change.


    # What information does the GNOME Panel display?


    ![](img/e2eac216eed4c6806c742998f1420a0c_130_0.png)


    - The Main Menu gives you quick access to programs.

    - These application launchers allow you to get help, change settings, display
    the Terminal window and start Netscape Communicator.

    - The GNOME Panel allows you to switch between desktops and displays a button
    for each open window.

    - The clock displays the current date and time.


    ![](img/e2eac216eed4c6806c742998f1420a0c_130_1.png)


    - The GNOME Panel disappears, leaving only the top edge of the panel displayed
    on your screen.

    - To temporarily display the GNOME Panel, position the mouse over the bottom of
    your screen.

    - The GNOME Panel reappears.

    - When you move the mouse away from the bottom of your screen, the GNOME Panel
    will disappear.

    - To once again display the GNOME Panel at all times, repeat steps 1 to 5.


    # CHANGE THE DESKTOP COLOR


    You can change the color of your desktop to customize the appearance of your screen.


    ![](img/e2eac216eed4c6806c742998f1420a0c_131_0.png)


    You can choose a solid or gradient color for your desktop.


    # CHANGE THE DESKTOP COLOR


    ![](img/e2eac216eed4c6806c742998f1420a0c_131_1.png)


    - 1 Click The Control Center window appears.

    - 2 Click Background.

    - 3 Click an option to specify if you want to use a solid or gradient color.

    - 4 Click this button to select the color you want to use.


    # CUSTOMIZE LINUX


    When using a gradient color, can I change the direction of the gradient?


    Yes. When using a gradient color, you can have the colors blend together vertically
    or horizontally. In the Control Center window, click Vertical or Horizontal to
    change the direction of the gradient.


    ![](img/e2eac216eed4c6806c742998f1420a0c_132_0.png)


    ![](img/e2eac216eed4c6806c742998f1420a0c_132_1.png)


    Vertical

    Horizontal


    ![](img/e2eac216eed4c6806c742998f1420a0c_132_2.png)


    ![](img/e2eac216eed4c6806c742998f1420a0c_132_3.png)


    - Pick the color window appears.

    - Click the color you want to use for your desktop.

    - Click OK to confirm your selection.

    - This shows how your desktop will appear.

    - 7 If you selected Gradient in step 3, you can repeat steps 4 to 6 using this
    button to select the second color.

    - 8 Click OK to confirm your changes.

    - 9 Click X to close the Control Center window.

    - Your desktop displays the color(s) you selected.


    # ADD WALLPAPER


    You can add wallpaper to your desktop to decorate your screen.


    ![](img/e2eac216eed4c6806c742998f1420a0c_133_0.png)


    # ADD WALLPAPER


    ![](img/e2eac216eed4c6806c742998f1420a0c_133_1.png)


    - 1 Click The Control Center window appears.

    - 2 Click Background.

    - 3 Click Browse to find the wallpaper you want to use on your computer.

    If the button is dimmed, click Disable background selection to be able to find
    wallpaper on your computer.

    - 4 The Wallpaper Selection window appears.

    - This area shows the wallpaper you selected.

    - 5 Click OK to confirm your selection.

