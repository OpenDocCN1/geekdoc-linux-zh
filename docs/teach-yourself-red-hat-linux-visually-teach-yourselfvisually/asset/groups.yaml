    See the list:


    ![](img/e2eac216eed4c6806c742998f1420a0c_56_5.png)


    - Gnome Help Bookmarks


    ![](img/e2eac216eed4c6806c742998f1420a0c_56_6.png)

    ![](img/e2eac216eed4c6806c742998f1420a0c_56_7.png)


    ## Basic Options


    The Basic Options window allows you to configure various settings.


    ![](img/e2eac216eed4c6806c742998f1420a0c_56_8.png)


    - Gnome Help Bookmarks

    - The Gnome Help Bookmarks window appears, displaying a list of your bookmarks.

    - Click the bookmark for the help topic you want to display.

    - The help topic appears in the Help Browser window.

    - To display another help topic, click the bookmark for the help topic.

    - When you finish viewing help topics, click X to close the Gnome Help Bookmarks
    window.


    ![](img/e2eac216eed4c6806c742998f1420a0c_56_9.png)


    ## GETTING HELP


    If you are having problems with Linux, there are many resources available where
    you can get help.


    ## MANUALS


    The Official Red Hat Linux 6.1 box comes with three manuals that can help you
    install and use Linux.


    If you have misplaced the manuals or do not own the box set, you can view the
    manuals at the following Web page.

    www.redhat.com/corp/support/manuals


    ![](img/e2eac216eed4c6806c742998f1420a0c_57_0.png)


    ## Installation Guide


    Provides detailed instructions on how to install Linux.


    ![](img/e2eac216eed4c6806c742998f1420a0c_57_1.png)


    ## Get Started Guide


    Provides general information on how to use Linux.


    ![](img/e2eac216eed4c6806c742998f1420a0c_57_2.png)


    ## Reference Guide


    Provides detailed information on how to install and use Linux.


    ## WEB PAGES


    You can use the icons on your desktop to quickly access help information on the
    Web. To display a Web page, double-click the icon for the Web page.


    www.redhat.com

    Provides general information about Red Hat, the company that distributes Red Hat
    Linux.


    support.redhat.com

    Provides help on how to install and use Linux. You can also access Hardware Compatibility
    Lists to determine whether your hardware will work with Linux.

    ![](img/e2eac216eed4c6806c742998f1420a0c_57_3.png)


    ## Red Hat Support


    support.redhat.com/errata

    Provides information about updates, fixes and corrections for Linux.


    ## Linux Documents


    www.redhat.com/mirrors/

    Provides a collection of documents containing the most-to-date information about
    Linux.


    ## GNOME Web Site


    www.gnome.com

    Provides information and support on GNOME, a graphical desktop environment in
    Linux.


    ## LINUX BASICS


    ## MAILING LIST


    You can join a mailing list to get Linux help through e-mail. A mailing list is
    a discussion group that uses e-mail to communicate.


    ![](img/e2eac216eed4c6806c742998f1420a0c_58_0.png)

    ![](img/e2eac216eed4c6806c742998f1420a0c_58_1.png)


    - linux-list

    A mailing list offering general discussions about Linux. To join the list, send
    an e-mail message to linux-list-request@sc.com with the word "subscribe" in the
    body of the message.


    - linux-newbie

    A mailing list for new users. To join the list, send an e-mail message to majordomo@vger.edu
    with the words "subscribe linux-newbie" in the body of the message.


    ## NEWSUPS


    You can join newsgroups to find out more about Linux. A newsgroup is a discussion
    group that allows people with common interests to communicate. Here are some newsgroups
    you will find on the news.redhat.com server.

    ![](img/e2eac216eed4c6806c742998f1420a0c_58_2.png)


    - redhat.config

    Discussions about setting up hardware and software and fixing hardware and software
    problems.

    ![](img/e2eac216eed4c6806c742998f1420a0c_58_3.png)


    - redhat.general

    General information about Linux.

    ![](img/e2eac216eed4c6806c742998f1420a0c_58_4.png)

    Newsgroup messages are stored on computers called news servers. You can connect
    to the news.redhat.com server to join newsgroups dedicated to Linux topics. For
    more information on newsgroups, see pages 286 to 293.

    ![](img/e2eac216eed4c6806c742998f1420a0c_58_5.png)


    - redhat.hardware.arch.intel

    Discussions about hardware, including how to set up hardware and fix hardware
    problems.


    ## Work With Files


    Linux allows you to organize and manage your files efficiently. In this chapter
    you will learn how to view the files stored on your computer, sort files, print
    files and much more.


    - How Files are Stored ................................50

    - Common Directories ......................................51

    - View Contents of Your Computer ................................52

    - Display Your Home Directory...........................................54

    - Display File Properties..................................................55

    - Change View of Items....................................56

    - Sort Items ................................................57

    - Customize Display of File Information ............58

    - Select Files ...............................................60

    - Open a File ................................................62

    - Rename a File ..............................................64

    - Delete a File ...............................................66

    - Move and Copy Files.....................................................68

    - Print a File ................................................70

    - Find a File ................................................72

    - Change File Permissions...............................................74

    - Create a Link on the Desktop.....................................76

    - Create a New Directory.................................................78


    ![](img/e2eac216eed4c6806c742998f1420a0c_60_0.png)


    ## HOW FILES ARE STORED


    ### DIRECTORIES


    #### Directory


    Like folders in a filing cabinet, directories organize the files stored on your
    computer. Each directory usually stores related files.


    #### Path


    A path specifies the location of a file on your computer. A path is a list of
    directory you must open to access a file, followed by the file name. The directories
    and the file name are separated by slashes (/). For example, to specify the location
    of the income file, you would use the /home/tsmith/income path.


    ![](img/e2eac216eed4c6806c742998f1420a0c_61_0.png)


    #### Root directory


    The symbol represents the root directory on your computer. All other directories
    are located below this directory.


    #### SAVING AND OPENING FILES


    When you save or open files, Linux displays this window.


    ![](img/e2eac216eed4c6806c742998f1420a0c_61_1.png)


    This area shows the location of the displayed directories and files.


    This area shows the directories in the current location. To display the contents
    of a different directory, double-click the directory.


    Note: You can double-click ../ to move up one level in the directory structure.


    This area shows the files in the current location.


    ## COMMON DIRECTORIES


    WORK WITH FILES


    You will find the following directories on your computer.


    | Directory | Description |

    | :--- | :--- |

    | / | This is the main directory that stores all the directories and files on
    your computer. |

    | /bin | This directory contains programs that are essential to the operation
    of Linux. |

    | /dev | This directory contains a file for each hardware device used by Linux,
    such as a monitor or printer. |

    | /etc | This directory stores files that specify Linux settings, such as the
    settings for your monitor resolution. |

    | /home | This directory contains a directory for each user set up on your computer.
    Each directory stores the personal files and settings for one user. |

    | /lost-found | This directory stores damaged or lost files. |

    | /mnt | This directory displays the contents of a floppy or CD-ROM drive. |

    | /root | This directory stores the personal files and settings for the root account.
    The root account is the administrative account set up when Linux was installed
    on your computer. |

    | /sbin | This directory stores programs used for performing administrative tasks
    in Linux. |

    | /usr | This directory contains programs and information that people often access,
    such as games and help files. |

