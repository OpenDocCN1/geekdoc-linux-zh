    # PARTS OF THE KDE SCREEN


    The KDE screen displays various items. The items that appear depend on the KDE
    packages installed and the account you used to log on to your computer.


    ## AUTOSTART


    Allows you to have programs start automatically each time you start KDE.


    ![](img/e2eac216eed4c6806c742998f1420a0c_239_0.png)


    Displays a button for each open window.


    ## CDROM


    Allows you to display the contents of a CD-ROM disc.


    ## PRINTER


    Allows you to print files.


    ## FLOPPY


    Allows you to display the contents of a floppy disc.


    ## TEMPLATES


    Allows you to create shortcuts to items such as programs.


    ## HELP WEB PAGES


    Allows you to quickly display web pages that offer help using Linux.


    ## TRASH


    Stores files you have deleted.


    ## KDE PANEL


    - Application Starter: Gives you quick access to programs.

    - Window List: Allows you to display a list of all open windows.

    - Home Directory: Allows you to display the contents of the directory that stores
    your personal files.

    - KDE Control Center: Allows you to view and change KDE settings.

    - KDE Help: Provides help on using KDE.

    - Terminal: Allows you to display the Konsole window where you can type Linux
    commands.

    - Logout: Allows you to log out of KDE.

    - Lock Screen: Allows you to secure your computer while you are away from your
    desk.

    - Virtual Desktops: Allows you to switch between different desktops.

    - Clock: Displays the current time and date.


    ## LOG OUT OF KDE


    When you finish using KDE, you can log out of KDE.


    ![](img/e2eac216eed4c6806c742998f1420a0c_240_0.png)


    ## LOG OUT OF KDE


    ![](img/e2eac216eed4c6806c742998f1420a0c_240_1.png)


    ![](img/e2eac216eed4c6806c742998f1420a0c_240_2.png)


    - 1 Click Click to display a menu.

    - 2 Click Logout to log out of KDE.

    - A message appears, stating that you can log out of KDE.

    - A dialog box will appear, asking for your user name. You can now log out of
    your computer using KDE or GNOME. To log on using KDE, see page 226. To log on
    using GNOME, see page 173.

    - 3 Click Logout.


    ![](img/e2eac216eed4c6806c742998f1420a0c_241_0.png)


    ## Using the Command Line


    This chapter will teach you how to use some basic commands to accomplish tasks
    in Linux.


    | Topic | Page |

    | :--- | :--- |

    | - Display the Command Line | 232 |

    | Common Linux Commands | 234 |


    ![](img/e2eac216eed4c6806c742998f1420a0c_242_0.png)


    ## DISPLAY THE COMMAND LINE


    You can display the command line so you can enter Linux commands. The command
    line displays text without any graphics.


    ![](img/e2eac216eed4c6806c742998f1420a0c_243_0.png)


    ## DISPLAY THE COMMAND LINE


    ![](img/e2eac216eed4c6806c742998f1420a0c_243_1.png)


    ## IN THE TERMINAL WINDOW


    - 1 Click to display the Terminal window.

    - 2 The Terminal window appears.

    - This area displays the command line where you can enter commands. You may need
    to click this area before you can enter commands.


    Note: For a list of commands you can enter, see page 234


    - When you finish using the command line, click X to close the window.


    232


    ## Why would I want to use the command line?


    - You can perform some tasks, such as stopping a file from printing, only in the
    command line.

    - You can perform many tasks, such as moving files, much faster in the command
    line.

    - If you are having a problem with Linux, you can use the command line to fix
    the problem.

    - Some people prefer to work with a screen that shows only text.


