  mdcn: "\n\n# 使用 GNOME 计算器\n\nLinux 提供了一个你可以用来进行计算的计算器。\n\n![](img/e2eac216eed4c6806c742998f1420a0c_93_0.png)\n\
    \n# 使用 GNOME 计算器\n\n![](img/e2eac216eed4c6806c742998f1420a0c_93_1.png)\n\n- 1\
    \ 点击 [] 显示主菜单。\n- 2 点击“实用工具”。\n- 3 点击“简单计算器”。\nGnome 计算器窗口出现。\n- 4 要输入信息，点击每个按钮，就像按下手持计算器上的按钮一样。\n\
    注意：你可以通过增大窗口大小来让按钮变大。要调整窗口大小，请参阅第 33 页。\n- 5 要开始新计算，点击 AC。\n- 6 点击 X 关闭 Gnome\
    \ 计算器窗口。\n\n# 玩游戏\n\n# 使用 LINUX 应用程序\n\nLinux 包含了几个你可以在电脑上玩的游戏。游戏是提高鼠标技巧和手眼协调的一种有趣方式。\n\
    \n![](img/e2eac216eed4c6806c742998f1420a0c_94_0.png)\n\n# 玩游戏\n\n![](img/e2eac216eed4c6806c742998f1420a0c_94_1.png)\n\
    \n- 1 点击 [] 显示主菜单。\n- 2 点击“游戏”。\n- 3 点击你想玩的游戏。\n- 4 出现一个窗口，显示该游戏。在本例中，出现了 Gnome\
    \ Mines（扫雷）窗口。\n- 5 在 Gnome Mines 中，你试着在不实际揭开它们的情况下找到所有雷的位置。\n- 6 要关闭游戏窗口，点击 [x]。\n\
    \n# 使用 NOTEPAD+\n\n你可以使用 notepad+ 创建简单的文本文档。\n\n> 备忘录：\n 10 月 5 日周一将有一个重要的会议。将解决有关即将到来的万圣节派对的问题。会有食物，所以不要迟到。\n\
    \n你还可以使用 notepad+ 创建网页。当你在 notepad+ 中格式化文本时，它会向文档添加 HTML 标签。网页浏览器使用 HTML 标签来决定你的文档在网络上如何显示。\n\
    \n![](img/e2eac216eed4c6806c742998f1420a0c_95_0.png)\n\n# 启动 NOTEPAD+\n\n![](img/e2eac216eed4c6806c742998f1420a0c_95_1.png)\n\
    ![](img/e2eac216eed4c6806c742998f1420a0c_95_2.png)\n\n亲爱的 Mark：\n感谢你愿意参加即将举行的秋展。是的，该活动是纽约的一年度活动，在利用\
    \ Michael 新编码技能的同时为慈善机构筹款。\n我附上了一些花作为礼物送给你。秋季很特别。非常感谢你的所有支持，这次活动付出了很多努力。\n作为志愿者，你将负责帮助我们准备工作及一切事务。我还附上了一些传单供你分发，以及一些去年的照片。\n\
    请随时通过 (212) 555-1212 与我联系。\n\n- 1 点击显示主菜单。\n- 2 点击“应用程序”。\n- 3 点击“notepad+”。\n\
    - 4 notepad+ 窗口出现，显示一个新的空白文档。\n- 5 点击此区域并输入你的文档文本。\n\n![](img/e2eac216eed4c6806c742998f1420a0c_95_3.png)\n\
    \n你可以将文本移动或复制到文档中的新位置。\n\n![](img/e2eac216eed4c6806c742998f1420a0c_96_0.png)\n\
    \n当你移动文本时，你将文本放置在一个新位置。\n当你复制文本时，你会在新位置放置文本的精确副本。\n\n# 移动或复制文本\n\n![](img/e2eac216eed4c6806c742998f1420a0c_96_1.png)\n\
    ![](img/e2eac216eed4c6806c742998f1420a0c_96_2.png)\n\n- 1. 要选择你想移动或复制的文本，将鼠标滑过文本直到文本被高亮。\n\
    - 2. 点击以下其中之一：\n  移动文本\n  复制文本\n- 3. 点击你想放置文本的位置。\n- 4. 文本出现在新位置。\n\n# 使用 NOTEPAD+\n\
    \n你应该保存文档以备后之用。这允许你稍后查看和编辑文档。\n\n![](img/e2eac216eed4c6806c742998f1420a0c_97_0.png)\n\
    \n你应该定期保存对文档的修改，以防丢失工作。\n\n# 保存文档\n\n![](img/e2eac216eed4c6806c742998f1420a0c_97_1.png)\n\
    ![](img/e2eac216eed4c6806c742998f1420a0c_97_2.png)\n\n- 1 点击保存文档。注意：如果你之前保存过文档，将不会出现“另存为”窗口。\n\
    - 2 点击此区域并为文档命名。“另存为”窗口出现。此区域显示 notepad+ 存储文档的地方。\n- 3 点击 OK 保存文档。要在不同的目录中存储文档，请双击目录。\n\
    \n# 使用 LINUX 应用程序\n\n你可以打开已保存的文档并在屏幕上显示。这允许你对文档进行查看和修改。\n\n![](img/e2eac216eed4c6806c742998f1420a0c_98_0.png)\n\
    \n# 打开文档\n\n![](img/e2eac216eed4c6806c742998f1420a0c_98_1.png)\n![](img/e2eac216eed4c6806c742998f1420a0c_98_2.png)\n\
    \n- 1 点击打开文档。\n- 2 打开“文件”窗口。\n- 3 此区域显示文件的位置。要在不同的目录中显示文件，请双击目录。\n- 2 点击你想打开的文档。\n\
    - 3 点击 OK 打开文档。\n文档打开并出现在你的屏幕上。你现在可以对文档进行查看和修改。\n\n# 使用 XPAINT\n\n你可以使用 Xpaint\
    \ 在电脑上画画。\n\n![](img/e2eac216eed4c6806c742998f1420a0c_99_0.png)\n\n# 启动 XPAINT\n\
    \n![](img/e2eac216eed4c6806c742998f1420a0c_99_1.png)\n\n- 1 点击显示主菜单。\n- 2 点击“应用程序”菜单。\n\
    - 3 点击“图形”。\n- 4 点击“xpaint”。\n- 5 Xpaint 窗口出现。\n- 6 此区域显示你可以用来画画的工具。\n\n# 使用 LINUX\
    \ 应用程序\n\n我如何确定每个工具的作用？\n\n你可以显示工具的名称来帮助确定该工具的作用。将鼠标悬停在工具上并按住右键。出现一个菜单，在顶部以**粗体**字体显示工具名称。\n\
    \n![](img/e2eac216eed4c6806c742998f1420a0c_100_0.png)\n![](img/e2eac216eed4c6806c742998f1420a0c_100_1.png)\n\
    \n- 5 要打开可以画画的窗口，将鼠标悬停在“文件”上然后按住左键。\n- 6 拖动鼠标直到高亮“新画布”。出现一个窗口，显示你可以绘画的空白画布。此区域显示你可以用于绘画的颜色和图案。\n\
    注意：如果你看不到颜色和图案，说明窗口太大无法适应屏幕。要调整窗口大小，请参阅第 33 页。\n\n# 使用 XPAINT\n\n你可以用各种颜色画方形、圆形和多边形。\n\
    \n![](img/e2eac216eed4c6806c742998f1420a0c_101_0.png)\n\n# 绘制形状\n\n![](img/e2eac216eed4c6806c742998f1420a0c_101_1.png)\n\
    \n- 1 点击你想画的形状类型对应的工具。\n- 2 点击你想用于形状轮廓的颜色或图案。\n- 3 如果在第 1 步中选择了，点击你想用于形状内部的颜色或图案。\n\
    - 4 将鼠标置于你想开始画形状的位置。\n- 5 拖动鼠标直到形状达到你想要的大小。如果你在第 1 步中选择了，重复步骤 5 直到完成形状。然后同时按下左键和右键或按下鼠标中键来完成形状。\n\
    \n# 绘制线条\n\n你可以使用铅笔、画笔或喷漆罐绘制各种颜色的线条。\n\n![](img/e2eac216eed4c6806c742998f1420a0c_102_0.png)\n\
    \n![](img/e2eac216eed4c6806c742998f1420a0c_102_1.png)\n\n- 1 点击你想画的线条类型对应的工具。\n\
    - 2 点击你想用于线条的颜色或图案。\n- 3 将鼠标置于你想开始画线条的位置。\n- 4 拖动鼠标直到线条达到你想要的长度。\n如果你在第 1 步中选择了，重复步骤\
    \ 4 直到完成线条。然后同时按下左键和右键或按下鼠标中键来完成线条。\n\n# 使用 XPAINT\n\n你可以向你的画中添加文本，例如标题或说明。\n\n\
    ![](img/e2eac216eed4c6806c742998f1420a0c_103_0.png)\n![](img/e2eac216eed4c6806c742998f1420a0c_103_1.png)\n\
    \n- 1 点击 ☒ 向你的画中添加文本。\n- 2 点击你想用于文本的颜色或图案。\n- 3 点击你想添加文本的位置。\n- 4 输入文本。\n- 5 要开始新的一行，按下回车键。\n\
    \n"
