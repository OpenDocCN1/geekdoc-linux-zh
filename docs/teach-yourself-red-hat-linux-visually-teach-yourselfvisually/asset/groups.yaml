    - 点击以显示删除的账户。

    - 如果要删除账户，gnome-linuxconf 窗口。


    注意：在删除账户之前，请确保你已备份了重要数据。


    # 当我删除账户时，我可以对账户数据做什么？


    ![](img/e2eac216eed4c6806c742998f1420a0c_180_0.png)


    # 归档账户


    将数据压缩成单个文件并存储在旧目录中。


    # 删除账户


    删除账户数据。


    # 保留账户


    将数据留在原处。


    ![](img/e2eac216eed4c6806c742998f1420a0c_180_1.png)


