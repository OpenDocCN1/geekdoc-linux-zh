    | 高级 | | |\n| 主页 | | |\n| 点击主页按钮将您带到此页面 | | |\n| 位置 | http://choosehomepage.com\
    \ | |\n\n出现 Netscape 偏好设置（Preferences）对话框。\n\n此区域显示你当前主页的地址。\n\n此区域显示你新主页的地址。\n\
    \n点击确定（OK）确认你的更改。\n\n- 4 点击导航（Navigator）。\n- 5 点击使用当前（Use Current）设置在新主页上显示的 Web\
    \ 页面。\n\n# 13 \n\n# 263\n\n## 添加书签\n\n你可以创建书签来存储喜爱的 Web 页面地址。书签可以让你无需记忆并不断重复输入\
    \ Web 页面地址。\n\n![](img/e2eac216eed4c6806c742998f1420a0c_275_0.png)\n\nNetscape\
    \ Navigator 使用文件夹将相关的书签组织成不同的类别，例如“商务与财务”。许多文件夹已经包含了书签，你可以从中快速访问 Web 页面。\n\n##\
    \ 添加书签\n\n![](img/e2eac216eed4c6806c742998f1420a0c_275_1.png)\n\n- 1 显示你想添加到书签列表的\
    \ Web 页面。\n- 2 点击书签（Bookmarks）。\n- 3 点击文件（File）-> 书签（Bookmark）。\n- 4 出现一个可以存储该书签的文件夹列表。\n\
    - 5 点击你想存储书签的文件夹。\n- 6 Netscape Navigator 将书签添加到文件夹中。\n\n264\n\n## 还有其他方法可以快速访问实用的\
    \ Web 页面吗？\n\n个人工具栏（Personal toolbar）让你快速访问实用的 Web 页面。\n\n![](img/e2eac216eed4c6806c742998f1420a0c_276_0.png)\n\
    \n### WebMail\n让你访问 Netscape 的免费电子邮件服务。\n### 联系人（Contact）\n让你访问 Netscape 的联系人管理服务，包括日历和通讯录。\n\
    ### 人员（People）\n让你搜索人员。\n### 黄页（Yellow Pages）\n让你搜索个人和企业。\n### 下载（Download）\n\
    让你获取最新版本的 Netscape 软件。\n### 查找站点（Find Sites）\n让你搜索 Web 页面。\n\n## 选择书签\n\n![](img/e2eac216eed4c6806c742998f1420a0c_276_1.png)\n\
    \n- 1. 点击书签（Bookmarks）。\n- 2 点击存储你想显示的 Web 页面书签的文件夹。\n- 3 点击你想显示的 Web 页面书签。\n\
    - 页面出现。\n\n## 删除书签\n\n你应该删除不再使用的书签。删除书签可以帮助保持书签列表不变得杂乱。\n\n![](img/e2eac216eed4c6806c742998f1420a0c_277_0.png)\n\
    \n## 删除书签\n\n![](img/e2eac216eed4c6806c742998f1420a0c_277_1.png)\n\n- 点击书签（Bookmarks）。\n\
    - 点击编辑书签（Edit Bookmarks）。\n- 出现一个窗口，显示你的书签列表。书签显示符号。\n- 点击你想删除的书签。\n- 点击编辑（Edit）。\n\
    - 点击删除（Delete）。\n- 窗口将从列表中消失。\n\n266\n\n## 搜索 Web\n\n## 浏览网页\n\n你可以在 Web 上找到讨论你感兴趣话题的页面。\n\
    \n![](img/e2eac216eed4c6806c742998f1420a0c_278_0.png)\n\n## 搜索 Web\n\n Web 上有很多搜索工具，可以编目录数百万个\
    \ Web 页面的信息。流行的搜索工具可能包括 Excite、HotBot 和 Lycos。\n\n![](img/e2eac216eed4c6806c742998f1420a0c_278_1.png)\n\
    \n- 1 点击搜索查找感兴趣的页面。\n- 2 点击你想使用的搜索工具。\n- 3 点击此区域输入你想搜索的词。然后按回车键。\n- 4 点击感兴趣的 Web\
    \ 页面显示。\n- 你可能需要使用滚动条查看整个列表。\n\n![](img/e2eac216eed4c6806c742998f1420a0c_279_0.png)\n\
    \n## 交换电子邮件\n\n电子邮件是与全球家人交换信息的方便方式。在本章中你将学习如何设置电子邮件账户以及处理电子邮件。\n\n- 设置电子邮件账户...............270\n\
    - 启动 Netscape Messenger 阅读邮件...............274\n- 发送邮件...............276\n- 附加文件...............278\n\
    - 回复邮件...............280\n- 转发邮件...............282\n- 删除邮件...............283\n\
    \n![](img/e2eac216eed4c6806c742998f1420a0c_280_0.png)\n\n## 设置电子邮件账户\n\n电子邮件是与全球家人交换信息的方便方式。在本章中你将学习如何设置电子邮件账户以及处理电子邮件。\n\
    \n![](img/e2eac216eed4c6806c742998f1420a0c_281_0.png)\n\n## 设置电子邮件账户\n\n电子邮件是与全球家人交换信息的方便方式。在本章中你将学习如何设置电子邮件账户以及处理电子邮件。\n\
    \n![](img/e2eac216eed4c6806c742998f1420a0c_281_1.png)\n\n## 设置电子邮件账户\n\n电子邮件是与全球家人交换信息的方便方式。在本章中你将学习如何设置电子邮件账户以及处理电子邮件。\n\
    \n![](img/e2eac216eed4c6806c742998f1420a0c_281_2.png)\n\n"
