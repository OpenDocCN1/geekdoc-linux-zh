    Note: If there are problems with the program and the window will not close, right-click
    in step 1 to forcibly close the window.


    39


    ## RESTART YOUR COMPUTER


    If you are experiencing problems with Linux, you can restart your computer to
    fix the problem.


    ![](img/e2eac216eed4c6806c742998f1420a0c_51_0.png)


    ## RESTART YOUR COMPUTER


    ![](img/e2eac216eed4c6806c742998f1420a0c_51_1.png)


    - 1 Click to display the Main Menu.

    - 2 Click Logout.

    - 3 A dialog box appears.

    - 4 Click Reboot to restart your computer.

    - 5 Click Yes.

    Note: If you are logged on to your computer as a regular user, a dialog box will
    appear asking you to enter your password. Click the dialog box and type your password.
    Then press the Enter key.

    - Linux restarts your computer.


    40


    ## EXIT LINUX


    LINUX BASICS


    When you finish using Linux, you can exit Linux to shut down your computer.


    ![](img/e2eac216eed4c6806c742998f1420a0c_52_0.png)


    When this message appears, you can turn off your computer. Many new computers
    will turn off automatically.


    ## EXIT LINUX


    ![](img/e2eac216eed4c6806c742998f1420a0c_52_1.png)


    - 1 Click to display the Main Menu.

    - 2 Click Logout. A dialog box appears.

    - 3 Click Halt to exit Linux.

    - 4 Click Yes.

    Note: If you are logged on to your computer as a regular user, a dialog box will
    appear asking you to enter your password. Click the dialog box and type your password.
    Then press the Enter key.

    - Linux shuts down your computer.


    ## GETTING HELP


    If you do not know how to perform a task in Linux, you can use the Help feature
    to get information.


    ![](img/e2eac216eed4c6806c742998f1420a0c_53_0.png)


    ## GETTING HELP


    ![](img/e2eac216eed4c6806c742998f1420a0c_53_1.png)


    - 1 Click to display the Gnome Help window.

    - 2 The Gnome Help Browser window appears.

    - 3 Click GNOME USER''s Guide.


    ## What other types of help does the Help feature offer?


    In the Gnome Help Browser window, you can click one of the following options to
    get help.


    - Red Hat Linux Getting Started Guide: Provides basic help on using Linux.

    - Red Hat Linux Install Guide: Provides help on installing Linux.

    - Red Hat Linux Reference Guide: Provides detailed help on installing and using
    Linux.


    ![](img/e2eac216eed4c6806c742998f1420a0c_54_0.png)


    - GNOME Documents: Provides help on GNOME programs.

    - Man Pages: Provides basic help on Linux commands.

    - Info Pages: Provides detailed help on Linux commands.


    ![](img/e2eac216eed4c6806c742998f1420a0c_54_1.png)

    ![](img/e2eac216eed4c6806c742998f1420a0c_54_2.png)


    ## The Enlightenment Configuration Tool


    There are many ways to access the Enlightenment Configuration Tool (E-conf). You
    can use the GNOME Control Center, the Window Manager, or from the desktop menu.
    You can also find the Configuration Tool for Enlightenment.


    It also contains many sections that control various aspects and functions within
    Enlightenment. You will find a list of them in the top left of the E-conf. Themes,
    Options, Desktop, Appearance, Audio, Special FXs, Themes, and Others.


    ### Basic Options


    The following are sections of E-conf where you can learn how to configure the
    appearance and behavior.


    - The GNOME User''s Guide table of contents appears.

    - You need to scroll the bar down to see the table of contents.

    - Click a topic of interest.

    - Information on the help topic appears.

    - You can click Back to return to the GNOME User''s Guide of contents so you can
    select another topic.


    When you finish viewing help, click to close the window.


    ## GETTING HELP


    When you find a help topic that contains useful information, you can bookmark
    the topic so you can quickly return to the topic at a later time.


    ![](img/e2eac216eed4c6806c742998f1420a0c_55_0.png)


    ## BOOKMARK A HELP TOPIC


    ![](img/e2eac216eed4c6806c742998f1420a0c_55_1.png)


    | Gnome Browser | | | | |

    |---|---|---|---|---|

    | File | Edit | View | Bookmark | Help |

    | Add Bookmark | | | | |

    | Window | | | | |

    | Exit | | | | |

    | Gnome Browser | | | | |

    | Back | Forward | Reload | Index | Bookmarks | Help |


    ![](img/e2eac216eed4c6806c742998f1420a0c_55_2.png)


    The Enlightenment Configuration Tool

    There are two ways to launch the Enlightenment Configuration Tool (E-conf). You
    may open the GNOME Control Center and select the Window Manager from the Desktop
    group, or run the Configuration Tool from Enlightenment buttons.


    The Enlightenment Configuration Tool allows you to configure mouse buttons for
    both right and left hands. You can emulate this on the desktop by selecting the
    Delegation Configuration from Enlightenment menu.


    E-conf is divided into many sections that contain various effects and functions.
    You will find a list of them in the top left of the E-conf. Themes, Options, Desktop,
    Appearance, Audio, Special FXs, Themes, and Others.

