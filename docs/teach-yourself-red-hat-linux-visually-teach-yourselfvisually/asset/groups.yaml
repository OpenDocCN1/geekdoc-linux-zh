  md: '

    # CREATE A DRAWER FROM THE MAIN MENU


    You can create a drawer on the GNOME Panel that contains programs from the Main
    Menu. This will give you access to programs you often use.


    ![](img/e2eac216eed4c6806c742998f1420a0c_163_0.png)


    # CREATE A DRAWER FROM THE MAIN MENU


    ![](img/e2eac216eed4c6806c742998f1420a0c_163_1.png)


    ![](img/e2eac216eed4c6806c742998f1420a0c_163_2.png)


    - 1 Click to display the Main Menu.

    - 2 Display the menu that contains the programs you want to appear in a drawer.

    - 3 Right-click the item at the top of the menu. A menu appears.

    - 4 Click Add this as drawer to panel.

    - 5 To close the Main Menu, click outside the menu area.


    # CUSTOMIZE THE GNOME PANEL


    I find it difficult to remember which icon will start the program I want. What
    can I do?


    If you find it difficult to remember which programs the icons in a drawer start,
    you can create a yellow box appears menu on the GNOME Panel instead of a drawer.
    A menu is similar to a drawer, but lists programs by name instead of by icon.
    To create a menu on the GNOME Panel, perform steps 1 to 4 on page 152, except
    select Add this as menu to panel in step 4.


    ![](img/e2eac216eed4c6806c742998f1420a0c_164_0.png)


    ![](img/e2eac216eed4c6806c742998f1420a0c_164_1.png)


    ![](img/e2eac216eed4c6806c742998f1420a0c_164_2.png)


    ![](img/e2eac216eed4c6806c742998f1420a0c_164_3.png)


    The drawer appears open and displays an icon for each program in the menu.


    Note: When you move the mouse, over the icon for a program, a yellow box appears,
    displaying a description of the program.


    - 5 To close the drawer, click the drawer.

    - - To once again display the contents of the drawer, click the drawer.

    - To move the drawer to a new location on the GNOME Panel, see page 160.


    # DELETE A DRAWER


    - 1 Right-click the drawer icon you want to delete. A menu appears.

    - 2 Click Remove from panel.

    - The drawer icon will disappear from the GNOME Panel.


    Note: To delete an individual item from a drawer, perform steps 1 to 3 on page
    157.


    # CREATE AN EMPTY DRAWER


    You can create an empty drawer on the GNOME Panel that will give you quick access
    to programs you often use.


    ![](img/e2eac216eed4c6806c742998f1420a0c_165_0.png)


    # CREATE AN EMPTY DRAWER


    ![](img/e2eac216eed4c6806c742998f1420a0c_165_1.png)


    - 1 Right-click an empty area on the GNOME Panel. A menu appears.

    - 2 Click Add drawer.

    - 3 A drawer icon appears on the GNOME Panel.

    - 4 The drawer appears open and empty.


    # CUSTOMIZE THE GNOME PANEL


    When would I create an empty drawer?

    Creating an empty drawer is useful when you want to keep all the programs you
    need to perform a task. For example, you can create a drawer for programs you
    use to write letters or work with images.


    ![](img/e2eac216eed4c6806c742998f1420a0c_166_0.png)


    ![](img/e2eac216eed4c6806c742998f1420a0c_166_1.png)


    - - To close the drawer, click the drawer icon.

    - To once open the drawer, click the drawer icon.

    - - To add items to the drawer, see page 156.

    - To move the drawer to a new location on the GNOME Panel, see page 160.


    # DELETE A DRAWER


    - 1 Remove from panel.

    Right-click the drawer icon you want to delete. A menu appears.

    - - The drawer icon will disappear from the GNOME Panel.


    # ADD ITEMS TO A DRAWER


    After creating a drawer, you can add programs you want to quickly access to the
    drawer.


    ![](img/e2eac216eed4c6806c742998f1420a0c_167_0.png)


    To create a drawer, see page 152 or 154.


    # ADD ITEMS TO A DRAWER


    ![](img/e2eac216eed4c6806c742998f1420a0c_167_1.png)


    - 1 Click the icon for the drawer you want to add.

    - 2 Click to display the Main Menu.

    - 3 Display the menu that contains a program you want to add.

    - 4 Position the mouse over the program.

    - 5 Drag the program to the right of the menu and to open the drawer.


    Note: If the Main Menu covers the open drawer, you must move the drawer before
    you can add the program.


    # Does deleting a program from a drawer permanently delete the program?


    When you delete a program from a drawer, you not permanently delete the program
    from your computer. You can still access the program using the Main Menu.


    ![](img/e2eac216eed4c6806c742998f1420a0c_168_0.png)


    ![](img/e2eac216eed4c6806c742998f1420a0c_168_1.png)


    ![](img/e2eac216eed4c6806c742998f1420a0c_168_2.png)


    The icon for the program appears in the drawer.


    Note: When you move the mouse over the icon for the program, a yellow box appears,
    displaying description of the program.


    - Repeat steps 2 to 5 for each program you want to add.

    - To close the drawer, click the drawer icon.


    # DELETE AN ITEM FROM A DRAWER


    - Click the icon for the drawer you want to delete an item from.

    - Right-click the icon for the program you want to delete. A menu appears.

    - Click Remove from panel.

    - The icon for the program will disappear from the drawer.


    # CHANGE DRAWER ICON


    You can change the icon for a drawer you added to the GNOME Panel.


    ![](img/e2eac216eed4c6806c742998f1420a0c_169_0.png)


    # CHANGE DRAWER ICON


    ![](img/e2eac216eed4c6806c742998f1420a0c_169_1.png)


    - 1 Right-click the drawer icon you want to change. A menu appears.

    - 2 Click Properties.

    The Panel properties dialog box appears.

    - This area displays the current drawer icon.

    - 3 Click the icon to choose a different icon.

    The Browse dialog box appears.


    # Can I change the icon for other items on the GNOME Panel?


    You can use the method shown below to change the icon for items such as the Help
    feature ❓ and Control Center ⚙️. You can also use the method shown below to change
    the icon for items in a drawer.


    ![](img/e2eac216eed4c6806c742998f1420a0c_170_0.png)


    | Properties | | |

    | --- | --- | --- |

    | Drawer | Background | |

    | App appearance | | |

    | Tooltips | | |

    | Icon | | |

    | Drawer handles | | |

    | Enable hint | | |

    | Enable indication show | | |


    | Properties | | |

    | --- | --- | --- |

    | Drawer | Background | |

    | App appearance | | |

    | Tooltips | | |

    | Drawer handles | | |

    | Enable hint | | |

    | Enable indication show | | | |


    - Click the icon you want to use.

    - Click OK to confirm your selection.

    - This area displays the icon you selected.

    - Click OK to confirm your change.

    The drawer icon changes on the GNOME Panel.


    # MOVE AN APPLET


    You can move an applet to a new location on the GNOME Panel.


    ![](img/e2eac216eed4c6806c742998f1420a0c_171_0.png)


    An applet is an item on the GNOME Panel, such as an application launcher or a
    drawer. To create a drawer, see page 152 or 154.


    # MOVE AN APPLET


    ![](img/e2eac216eed4c6806c742998f1420a0c_171_1.png)


    - 1. Right-click the applet you want to move. A menu appears.

    - 2. Click Move applet.

    - 3. Click the location on the GNOME Panel where you want to place the applet.

    - 4. The applet appears in the new location.


    # MOVE THE GNOME PANEL


    # CUSTOMIZE THE GNOME PANEL


    You can move the GNOME Panel to a more convenient location on your screen.


    ![](img/e2eac216eed4c6806c742998f1420a0c_172_0.png)


    You can move the GNOME Panel to the top, bottom, left or right edge of your screen.


    # MOVE THE GNOME PANEL


    ![](img/e2eac216eed4c6806c742998f1420a0c_172_1.png)


    - 1 Position the mouse over a blank area on the GNOME Panel.

    - 2 Press and hold down the left and right mouse buttons at the same time you
    drag the GNOME Panel to a new location on your screen.

    The GNOME Panel moves to the new location.


    Note: If your mouse has a middle mouse button, press and hold down the middle
    mouse button as you drag the GNOME Panel.


    ![](img/e2eac216eed4c6806c742998f1420a0c_173_0.png)

