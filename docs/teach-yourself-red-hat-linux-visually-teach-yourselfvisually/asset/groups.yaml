    如果你需要输入 DNS 和网关号码，可以联系你的互联网服务提供商。只有以 root 身份登录计算机时才能输入 DNS 和网关号码。如果你以普通用户登录，则无法输入。


    # 输入 DNS 和网关号码


    ![](img/e2eac216eed4c6806c742998f1420a0c_259_1.png)


    - 1 点击显示主菜单。

    2 点击系统。

    3 点击 LinuxConf。


    出现 gnome-linuxconf 窗口。第一次启动 LinuxConf 时会出现欢迎消息。点击“退出”关闭消息。


    - 4 点击“名称服务器规格”。

    如果没有显示“名称服务器规格”，点击“客户端更改”旁边的符号 (+) 切换到。

    5 点击此区域并输入你的互联网服务提供商提供的第一个 DNS 号。


    - 6 点击此区域并输入你的互联网服务提供商提供的第二个 DNS 号。

    7 点击“接受”确认信息。


    248


    # 为什么我需要输入 DNS 和网关号码？


    你可能需要输入 DNS 和网关号码来识别由互联网提供商提供的域名服务器（DNS）和网关。


    ![](img/e2eac216eed4c6806c742998f1420a0c_260_0.png)


    # 域名服务器 (DNS)


    域名服务器将你输入的网页地址转换为 IP 数字。域名服务器唯一地标识互联网上的每台计算机。例如，当你输入 www.com 时，域名服务器将其转换为 172.19.255。


    # 网关


    网关是将你的计算机连接到互联网的设备。


    ![](img/e2eac216eed4c6806c742998f1420a0c_260_1.png)


    | 默认 | | | | |

    |---|---|---|---|---|

    | 互联网 | | | | | |

    | 输入 | | | | | |

    | 状态 | | | | | |

    | 更改 | | | | | |

    | 路由 | | | | | |

    | 路由器 | | | | | |

    | 网关 | | | | | |


    ![](img/e2eac216eed4c6806c742998f1420a0c_260_2.png)


    ![](img/e2eac216eed4c6806c742998f1420a0c_260.png)


    - 此区域显示你设置的互联网连接。

    - 18 点击“关闭”窗口。

    - 如果你的互联网服务需要你输入 DNS 和网关号码，请参阅第 248 页输入。

    - 你现在可以连接互联网了。要连接互联网，请参阅第 250 页。


    # 连接互联网


    在设置好互联网连接后，你可以随时连接互联网。


    ![](img/e2eac216eed4c6806c742998f1420a0c_261_0.png)


    - 在连接互联网之前，你需要先设置互联网连接。要设置连接，请参阅第 242 页。

    - 点击“互联网”。

    - 点击“拨号”。

    - 出现选择对话框。

    - 点击你设置的将连接到互联网的连接。

    - 点击“确定”连接互联网。


    # 连接互联网


    如果你在计算机外部有一个外部调制调器，请确保调制调器已开启。


    ![](img/e2eac216eed4c6806c742998f1420a0c_261_1.png)


    - 出现确认消息。

    - 调制调器拨打你的服务提供商。

    - 连接到互联网时会出现一个窗口。

    注意：启动 Netscape Navigator 即可浏览 Web，请参阅第 255 页。


    - 出现一个对话框，确认你想断开连接。

    - 5 点击“是”连接互联网。

    - 7 当你想断开连接时，点击窗口任意位置。

    - 9 点击“X”关闭窗口。


    # 为什么我连接互联网有问题？


    如果你在连接互联网时遇到问题，可能是服务提供商（ISP）的电话线路繁忙，或者你的 ISP 遇到了问题。请稍后尝试连接或联系你的 ISP 以确定原因。


    ![](img/e2eac216eed4c6806c742998f1420a0c_262_0.png)


    ![](img/e2eac216eed4c6806c742998f1420a0c_262_1.png)


    - 出现确认消息。

    - 调制调器拨打你的服务提供商。

    - 连接到互联网时会出现一个窗口。

    注意：启动 Netscape Navigator 即可浏览 Web，请参阅第 255 页。


    # 浏览 Web


    本章介绍你万维网，并教你如何从世界各站点传输信息。


    - Web 简介 ........................ 254

    - 启动 Netscape Navigator ................................ 255

    - 显示特定网页 ........................ 256

    - 选择链接 ................................ 258

    - 停止信息传输 .......................... 259

    - 重新加载网页 ....................................... 260

    - 在网页间移动 ............................................ 261

    - 显示并更改你的主页 ................................ 262

    - 添加书签 ......................................................... 264

    - 删除书签 ...................................................... 266

    - 搜索 Web ............................................................ 267


    ![](img/e2eac216eed4c6806c742998f1420a0c_264_0.png)


    '
