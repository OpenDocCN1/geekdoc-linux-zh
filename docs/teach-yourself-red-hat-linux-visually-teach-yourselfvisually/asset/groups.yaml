    ## 文件操作


    Linux 允许你高效地组织和管理文件。在本章中，你将学习如何查看计算机上的文件、排序文件、打印文件等。


    - 文件如何存储 ................................50

    - 常用目录 ......................51

    - 查看计算机内容 ................................52

    - 显示你的主目录...........................................54

    - 显示文件属性..................................55

    - 更改项目视图....................................56

    - 排序项目 ................................57

    - 自定义文件信息显示 ............58

    - 选择文件 ...............................60

    - 打开文件 ................................62

    - 重命名文件 ..............................................64

    - 删除文件 ...............................66

    - 移动和复制文件.....................................68

    - 打印文件 ................................70

    - 查找文件 ................................72

    - 修改文件权限...............................................74

    - 在桌面上创建链接.....................................76

    - 创建新目录.................................................78


    ![](img/e2eac216eed4c6806c742998f1420a0c_60_0.png)


    ## 文件如何存储


    ### 目录


    #### 目录


    就像文件柜里的文件夹一样，目录组织了存储在计算机上的文件。每个目录通常存储相关的文件。


    #### 路径


    路径指定了文件在计算机上的位置。路径是访问文件时必须打开的目录列表，随后是文件名。目录和文件名用斜杠（/）分隔。例如，要指定 income 文件的位置，你将使用
    /home/tsmith/income 路径。


    ![](img/e2eac216eed4c6806c742998f1420a0c_61_0.png)


    #### 根目录


    符号 / 代表代表计算机上的根目录。所有其他目录都位于此之下。


    #### 保存和打开文件


    当你保存或打开文件时，Linux 会显示此窗口。


    ![](img/e2eac216eed4c6806c742998f1420a0c_61_1.png)


    此区域显示显示的目录和文件的位置。


    此区域显示当前位置的目录。要显示另一个目录的内容，请双击该目录。


    注意：你可以双击 .. 返回上一级目录。


    此区域显示当前位置的文件。


    ## 常用目录


    文件操作


    你将在计算机上找到以下目录。


    | 目录 | 说明 |

    | :--- | :--- |

    | / | 这是存储计算机上所有目录和文件的主目录。 |

    | /bin | 包含运行所必需的程序。 |

    | /dev | 包含 Linux 使用的硬件设备的文件，如显示器或打印机。 |

    | /etc | 存储指定设置的文件，例如显示器分辨率设置。 |

    | /home | 包含计算机上设置的每个用户的目录。每个目录存储一个用户的个人文件和设置。 |

    | /lost-found | 存储损坏或丢失的文件。 |

    | /mnt | 显示软盘或光驱驱动器的内容。 |

    | /root | 存储 root 账户的个人文件和设置。root 账户是安装 Linux 计算机时设置的管理员账户。 |

    | /sbin | 存储用于执行管理任务的程序。 |

    | /usr | 包含人们经常访问的程序和信息，如游戏和帮助文件。 |


