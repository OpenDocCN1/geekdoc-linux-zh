    \n新闻组允许你与志同道合的人交流。在本章中，你将学习如何订阅新闻组、阅读消息以及更多内容。\n\n- 设置新闻组...............................................286\n\
    - 订阅新闻组.........................................288\n- 阅读消息......................................292\n\
