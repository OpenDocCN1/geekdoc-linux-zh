    # 准备安装 LINUX（续）


    可以运行两个操作系统（如 Linux 和 Windows）的电脑被称为双启动设置。


    ![](img/e2eac216eed4c6806c742998f1420a0c_19_1.png)


    - FDISK 选项

    当前硬盘驱动器：F

    请选择以下之一：

    1. 创建主分区或逻辑 DOS 驱动器

    2. 设置活动分区

    3. 删除现有的逻辑 DOS 区

    4. 显示分区信息


    - 创建 DOS 分区或逻辑 DOS 驱动器

    当前空闲硬盘驱动器：1

    请选择以下之一：

    1. 创建 DOS 分区

    2. 创建扩展 DOS 分区

    3. 在扩展 DOS 分区中创建逻辑 DOS 驱动器


    输入选择 [?]

    按 Esc 退出 FDISK：


    输入选择 [?]

    按 Esc 返回 FDISK 选项


    # 创建分区


    - 此区域显示了你可以选择的 FDISK 选项列表。


    - 按 1 创建分区，然后按 Enter 键。


    - 此区域显示你可以创建的分区类型。


    - 按 2 创建主分区，然后按 Enter 键。


    - FDISK 会检查驱动器的完整性。


    # 存储 Windows 的分区应该使用多大的容量？


    在确定存储 Windows 分区的尺寸之前，请考虑以下因素：


    - 你的电脑上的硬盘总空间。

    - 安装 Windows 98 和 Linux 所需的硬盘空间。Windows 98 需要约 260 MB 的硬盘空间。Linux 需要约 600 MB 的硬盘空间。

    - 与 Linux 相比，你使用 Windows 98 的频率。如果你使用 Windows 98 的频率高于 Linux，请为 Windows 分区分配更多的硬盘空间。


    ![](img/e2eac216eed4c6806c742998f1420a0c_20_0.png)


    # 创建主 DOS 分区


    当前固定磁盘：


