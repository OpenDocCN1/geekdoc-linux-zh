    # USING LINUX APPLICATIONS


    Can I add comments about a contact?

    You can add comments about a contact, such as their favorite restaurant and the
    names of their family members.


    ![](img/e2eac216eed4c6806c742998f1420a0c_114_0.png)


    - In the gnomecard dialog box, click the Explanatory tab.

    Click this area and type these comments about the contact.


    ![](img/e2eac216eed4c6806c742998f1420a0c_114_1.png)


    ![](img/e2eac216eed4c6806c742998f1420a0c_114_2.png)


    - 13 Click the **Addresses** tab.

    14 Click each area and type the information for the contact''s address.

    15 Click the type of address you entered changes to.

    16 Click **Add.**


    - The first line of the address appears in this area.

    To view the entire address, click the first line of the address.

    To add more than one address for the contact, repeat steps 14 to 16 for each address.


    # USING GNOMECARD


    You can use GnomeCard to keep track of the phone numbers of your contacts.


    ![](img/e2eac216eed4c6806c742998f1420a0c_115_0.png)


    When entering information for a contact, you do not need to enter all of the information.


    # USING GNOMECARD (CONTINUED)


    ![](img/e2eac216eed4c6806c742998f1420a0c_115_1.png)


    - 17 Click the **Phone** tab.


    - 18 Click this area and type the contact''s phone number.


    - 19 Click the type of phone number you entered changes to [].


    - 20 Click **Add**.


    - The phone number appears in this area. To enter more than one phone number for
    the contact, repeat steps **18 to 20** for each phone number.


    - 21 Click **OK** to confirm the information you entered for the contact.


    # How do I change the information for a contact?


    You can update the information for a contact at any time. Double-click the contact
    in the GnomeCard window to redisplay the gnomecard dialog box. You can then make
    changes to the contact information. When you finish changing the information,
    perform steps 21 and 22 below to save the changes.


    ![](img/e2eac216eed4c6806c742998f1420a0c_116_0.png)


    ![](img/e2eac216eed4c6806c742998f1420a0c_116_1.png)


    ![](img/e2eac216eed4c6806c742998f1420a0c_116_2.png)


    - The contact appears in the GnomeCard window.


    - 22 Click Save to save the information for the contact.


    - To view the information for another contact, click the contact.


    # DELETE A CONTACT


    - 1 Click the contact you want to delete.


    - GnomeCard removes the contact from the address book.


    # USING GNUMERIC


    You can use the Gnumeric spreadsheet program to organize and analyze data. Gnumeric
    can help you manage your business or personal finances.


    ![](img/e2eac216eed4c6806c742998f1420a0c_117_0.png)


    # USING GNUMERIC


    ![](img/e2eac216eed4c6806c742998f1420a0c_117_1.png)


    - Applications

    - Address Book

    - Calculator

    - Editor

    - Mail

    - Multimedia

    - Network

    - System

    - Games

    - File Manager

    - Help system

    - Programs

    - User menu

    - Spreadsheet Editor

    - Gnumeric (status)

    - Android Tool

    - File Browser

    - List screen

    - About GOME


    - Click to display the Main Menu.

    - Click Applications.

    - Click Gnumeric.

    - The Gnumeric window appears, displaying a blank worksheet.


    # ENTER DATA


    - Click the cell where you want to enter data. The cell becomes the active cell
    and displays a thick border.

    - Type the data you want to enter and press Enter key.

    - The data appears in the active cell and in the data area.


    # USING LINUX APPLICATIONS


    What terms should I know when working with Gnumeric?


    ![](img/e2eac216eed4c6806c742998f1420a0c_118_0.png)


    # Column

    - A vertical line of cells. A letter identifies each column.


    # Cell Reference

    - Defines the location of each cell. A cell reference consists of a column letter
    followed by row number (example: A1).


    # Cell

    - A box in a worksheet.


    # Row

    - A horizontal line of cells. A number identifies each row.


    ![](img/e2eac216eed4c6806c742998f1420a0c_118_1.png)


    ![](img/e2eac216eed4c6806c742998f1420a0c_118_2.png)


    # DELETE DATA


    - To delete the data in one cell, click the cell.

    - To select the cells containing the data you want to delete, drag the mouse over
    the cells until they are highlighted.

    - Press the Delete key.

    - The data disappears.


    You can change the width of a column to display hidden data and improve the appearance
    of your worksheet.


    ![](img/e2eac216eed4c6806c742998f1420a0c_119_0.png)


    If data appears cut off or number signs (#) appear in a cell, the column is not
    wide enough to display the contents of the cell.


    # CHANGE COLUMN WIDTH


    | | | |

    |---|---|---|

    | 1 | Operating Costs per Quarter | |

    | 2 | Quarter 1 | 240000 |

    | 3 | Quarter 2 | 320000 |

    | 4 | Quarter 3 | 300000 |

    | 5 | Quarter 4 | 260000 |

    | 6 | Total | |


    | | | |

    |---|---|---|

    | 1 | Operating Costs per Quarter | |

    | 2 | Quarter 1 | 240000 |

    | 3 | Quarter 2 | 320000 |

    | 4 | Quarter 3 | 300000 |

    | 5 | Quarter 4 | 260000 |

    | 6 | Total | |


    - 1 To change the width of a column, position the mouse over the right edge of
    the column heading it changes to ⮕.

    - 2 Drag the column edge until the line displays the column width you want.

    - The column displays the new width.


    You can enter formulas to perform calculations on the data in your worksheet.


    ![](img/e2eac216eed4c6806c742998f1420a0c_120_0.png)


    When entering formulas, use cell references (example: =A1+A2+A3) instead of actual
    data (example: =10+20+30) whenever possible. When you use cell references and
    change a number in a formula, Gnumeric will automatically redo the calculations
    for you.


    # ENTER A FORMULA


    ![](img/e2eac216eed4c6806c742998f1420a0c_120_1.png)


    - 1 Click the cell where you want to enter a formula.

    - 2 Type an equal sign (=) to begin the formula.

    - 3 Type the formula and then press the Enter key.

    Note: To add a list of numbers, type =sum(A:B) replacing A with the cell reference
    of the first and B with the cell reference of the last cell. For example, type
    =sum(B4:B7).

    - The result of the calculation appears in the cell.

    - 4 To view the formula you entered, click the cell containing the formula.

    - The formula for the cell appears in this area.


    # USING GNUMERIC


    You should save your worksheet to store it for future use. This allows you to
    later review and edit the worksheet.


    | INCOME STATEMENT, Houston Office |

    | First Quarter 1999 |

    | January | February | March |

    | REVENUE 136,781 | 435,901 | 453,832 |

    | Expenses 9,500 | 1,729 | 1,752 |

    | Support 23,768 | 421 | 830 |

    | TOTAL 103,513 | 433,751 | 451,250 |


    - Click Save to save the information for the contact.

    Note: If you previously saved your worksheet, the Save as window will not appear.
    Gnumeric will add the .gnumeric extension to the name of your worksheet.

