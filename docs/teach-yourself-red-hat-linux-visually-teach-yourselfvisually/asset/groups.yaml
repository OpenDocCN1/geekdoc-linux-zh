    # INSTALL LINUX


    I have more than one partition.

    How do I delete all the partitions?


    # Primary Partition


    Each hard drive has

    a primary partition, which is usually

    known as drive C.

    You can delete the

    primary partition

    by performing the

    steps below.


    ![](img/e2eac216eed4c6806c742998f1420a0c_18_0.png)


    # Extended Partition


    A hard drive can also have an

    extended partition. An extended

    partition contains one or more drives,

    called logical drives, that are usually

    known as drives D, E and so on.

    You must remove all logical drives before

    You can delete an extended partition.

    To delete a logical drive, press 3 in

    step 2 below. To delete an extended

    partition, press 2 in step 2 below.


    ![](img/e2eac216eed4c6806c742998f1420a0c_18_1.png)


    # Delete Primary DOS Partition


    Current fixed disk drive: 1


    ![](img/e2eac216eed4c6806c742998f1420a0c_18_2.png)


    # Delete Primary DOS Partition


    Current fixed disk drive: 1


    | Partition | Status | Type | Volume Label | System | Usage |

    |---|---|---|---|---|---||

    | C. | A | PRI DOS | 4068 | WIN35 | FAT32 | 100% |


    Total disk space is 4068 Megabytes (1 MB = 1048576 bytes)


    > WARNING: If you delete the Primary DOS Partition will be lost. If you delete
    a partition, you will lose all data on that partition. Are you sure?

    Press Esc to return to FDISK Options


    The partition is deleted.


    Total disk space is 4068 Megabytes (1 MB = 1048576 bytes)


    +   - This area displays information about existing partitions such as the number
    and label of each partition.


    +   - If you want to install Linux on your computer, you can install Linux on
    page 12. If you want to set up your computer to run both Linux and Windows, see
    page 8.


    +   - Press the number of the partition you want to delete and then press the
    Enter key.


    +   - Type label of the partition and then press the Enter key.


    +   - To delete the partition, press Y (for Yes) and then press the Enter key.


    +   - Press the Esc key to return to the list of FDISK options.


