  mdcn: "\n\n# 网页简介\n\n万维网（World Wide Web）是互联网的一部分，由存储在世界数十万台计算机上的巨大文档集合组成。\n\n##\
    \ 链接\n\n网页包含高亮的文本或图像，称为“链接”，它们连接到网上的其他页面。你可以选择网页上的链接，以显示位于同一台计算机或跨越城市、国家或世界的计算机上的另一个网页。\n\
    \n万维网也称为 Web（网络）。\n\n## 网页\n\n网页是网上的一个文档。网页可以包含文本、图片、声音和视频。\n\n![](img/e2eac216eed4c6806c742998f1420a0c_265_0.png)\n\
    \n## 网站\n\n网站是由学院、大学、政府机构、公司或个人维护的网页集合。\n\n## URL \n\n每个网页都有一个唯一的地址，称为统一资源定位符（URL）。如果你知道某个网页的\
    \ URL，就可以显示该网页。\n\n## 连接互联网\n\n大多数人使用互联网服务提供商（ISP）连接互联网。一旦你向 ISP 支付连接费用，你就可以免费在互联网上交换信息。\n\
    \n## 启动 NetSCAPE NAVIGATOR\n\n你可以启动 Netscape Navigator 来浏览网上的信息。\n\n![](img/e2eac216eed4c6806c742998f1420a0c_266_0.png)\n\
    \n![](img/e2eac216eed4c6806c742998f1420a0c_266_1.png)\n\n| Netscape: 欢迎来到 Red\
    \ Hat Linux 6.1 |\n| :--- |\n| 文件 编辑 视图  {... |\n| 后退 前进 刷新 首页 Netscape 打印 安全\
    \ |\n| 书签与 位置 /home/user/index.html | |\n| 状态 空 优先 FTP 访问 官方 Red Hat 支持通道 |\n\n\
    获取免费的优先 FTP 访问和官方 Red Hat 支持！\n立即注册获取您的免费官方 Red Hat 福利：\nhttp://www.redhat.com/now!\n\
    \n如果您购买了官方 Red Hat Linux 6.1\n我们邀请您享受所有这些福利：\n\n官方 FTP 访问\n如果您已注册作为 Red Hat Linux\
    \ 6.1 所有者使用我们的在线客户端，您将可以使用我们提供高带宽连接的官方客户支持。\n\n官方 RED HAT 支持\n如果您购买了官方 Red Hat\
    \ Linux 6.1，您有 90 天的免费技术支持。\nhttp://www.redhat.com\n\n- 连接互联网。要连接互联网，请参阅第 250\
    \ 页。\n- 点击启动 Netscape Navigator。\n- 显示 Netscape 窗口。\n- 点击最大化窗口以填满您的屏幕。\n\n## 显示特定网页\n\
    \n你可以显示一个你听过或读过的网页面。\n\n![](img/e2eac216eed4c6806c742998f1420a0c_267_0.png)\n\n\
    你需要知道想要查看的网页的地址。每个页面都有一个统一的地址，称为统一资源定位符（URL）。\n\n## 显示特定网页\n\n![](img/e2eac216eed4c6806c742998f1420a0c_267_1.png)\n\
    \n## Netscape: Sunmist Groves Incorporated\n\n![](img/e2eac216eed4c6806c742998f1420a0c_267_2.png)\n\
    \n- 欢迎来到 Sunmist\n- 在厨房里\n- 有什么更新？\n- 仅此一个\n- 趣味区\n- 教师角\n- 游戏与活动\n\n- 1 双击此区域以高亮当前网页的地址。\n\
    - 2 输入想要查看的网页地址，然后按 Enter 键。\n\n注意：在输入网页地址时，不需要输入 http://。\n\n## 浏览网页\n\n我可以显示哪些流行的网页？\n\
    \n| Blue Mountain Arts | www.bluemountain.com |\n| :--- | :--- |\n| CBS SportsLine\
    \ | www.sportsline.com |\n| CNN.com | www.cnn.com |\n| eBay | www.ebay.com |\n\
    | maranGraphics | www.maran.com |\n| MSNBC | www.msnbc.com |\n| MTV OnLine | www.mtv.com\
    \ |\n| NASA | www.nasa.gov |\n| Sony | www.sony.com |\n| TIME.com | www.pathfinder.com\
    \ |\n\n## 重新显示网页\n\n![](img/e2eac216eed4c6806c742998f1420a0c_268_0.png)\n\nNetscape\
    \ Navigator 会记录你输入的网页地址。你可以选择这些地址之一来快速重新显示网页。\n\n- 1 点击显示你输入过的网页地址列表。\n- 2 点击你想要重新显示的网页地址。\n\
    \n网页显示在你的屏幕上。\n\n## 选择链接\n\n链接将一个网页上的文本或图像连接到另一个页面。当你选择该文本或图像时，链接的网页就会出现。\n\n\
    ![](img/e2eac216eed4c6806c742998f1420a0c_269_0.png)\n\n## 选择链接\n\n![](img/e2eac216eed4c6806c742998f1420a0c_269_1.png)\n\
    \n- 1 将鼠标悬停在感兴趣的高亮文字或图像上。鼠标悬停在链接上会变成手形（☞）。\n- 2 点击文字或图像以显示链接的网页。\n- 3 链接的网页出现。当网页传输到你的计算机时，Netscape\
    \ 图标会显示动画。\n- 4 此区域显示网页的名称。\n- 5 此区域显示网页的地址。\n\n## 停止信息传输\n\n如果网页在你的屏幕上显示需要很长时间，你可以停止页面传输并稍后重试。\n\
    \n![](img/e2eac216eed4c6806c742998f1420a0c_270_0.png)\n\n显示网页的最佳时机是...\n\n## 停止信息传输\n\
    \n| Netscape: Sunblast Zone |\n| :--- |\n| 状态 空 优先 FTP 访问 官方 Red Hat 支持通道 |\n\n\
    | Netscape: Sunblast Zone |\n| :--- |\n| 文件 编辑 视图  {... |\n| 后退 前进 刷新 首页 Netscape\
    \ 打印 安全 |\n\n- 停止按钮表示信息不再正在传输。\n\n- 当网页正在传输到你的计算机时，Netscape 图标会显示动画。\n- 此区域显示网页的名称。\n\
    - 此区域显示网页的地址。\n\n## 重新加载网页\n\n你可以重新加载网页来更新屏幕上的信息，例如当前新闻。\n\n![](img/e2eac216eed4c6806c742998f1420a0c_271_0.png)\n\
    \n## 重新加载网页\n\n你可以重新加载网页来更新屏幕上的信息。\n\n![](img/e2eac216eed4c6806c742998f1420a0c_271_1.png)\n\
    \n重新加载网页可以更新屏幕上的信息。\n\n"
