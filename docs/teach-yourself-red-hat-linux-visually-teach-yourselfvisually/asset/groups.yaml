    \n## 设置新闻组 (SET UP NEWSGROUPS)\n\n在加入新闻组之前，你必须设置新闻组。新闻组是共同兴趣的人交流的讨论组。你只需要设置一次新闻组。\n\
    \n![](img/e2eac216eed4c6806c742998f1420a0c_297_0.png)\n\n在加入新闻组之前，你必须设置电子邮件帐户。要设置电子邮件帐户，请参阅第\
    \ 270 页。\n\n## 设置新闻组\n\n![](img/e2eac216eed4c6806c742998f1420a0c_297_1.png)\n\n\
    1. 点击启动 Netscape Navigator。\n2. 点击 Edit（编辑）。\n3. 点击 Preferences（首选项）。\n出现 Netscape\
    \ Preferences 对话框。\n4. 点击 Mail & Newsgroups（邮件与新闻组）类别旁边的箭头 (▷) (▷变为 ▽)。\n出现一个项目列表。\n\
    5. 点击 Newsgroups Servers（新闻组服务器），提供有关你想使用的新闻服务器的信息。\n注意：有关新闻服务器的信息，请参阅第 287 页顶部。\n\
    6. 点击 Add（添加）。\n\n## 什么是新闻服务器？\n\n新闻服务器是存储新闻组消息的计算机。新闻服务器通常由互联网服务提供商维护。\n\n在设置新闻组时，你必须指定你想使用的新闻服务器地址。如果你不知道地址，请联系你的互联网服务提供商。如果你想访问可以帮助你使用\
    \ Linux 的新闻组，可以指定 news.redhat.com 地址使用 Red Hat 服务器。\n\n![](img/e2eac216eed4c6806c742998f1420a0c_298_0.png)\n\
    ![](img/e2eac216eed4c6806c742998f1420a0c_298_1.png)\n![](img/e2eac216eed4c6806c742998f1420a0c_298_2.png)\n\
    出现 Netscape 对话框。\n\n7. 点击此区域并输入你想使用的新闻服务器地址。\n8. 点击 OK 确认你输入的信息。\n你指定的数字服务器将出现在此区域。\n\
    \n如果你想使用多个服务器，请对每个服务器重复步骤 6 到 8。\n\n9. 点击 OK 确认你的更改。你现在可以像第 288 页所示的那样订阅新闻组了。\n\
    \n## 订阅新闻组 (SUBSCRIBE TO NEWSGROUPS)\n\n在阅读新闻组中的消息之前，你必须订阅新闻组。Netscape Messenger\
    \ 可以显示所有可用新闻组的列表，以便你找到感兴趣的新闻组。\n\n![](img/e2eac216eed4c6806c742998f1420a0c_299_0.png)\n\
    \n可用的新闻组取决于你使用的新闻服务器。\n\n## 订阅新闻组\n\n![](img/e2eac216eed4c6806c742998f1420a0c_299_1.png)\n\
    \n获取免费的 FTP 访问和官方 Red 支持！\n\n注册你的官方 Red Hat Linux 6.1 \n前往 www.redhat.com/now!\n\
    \n如果你购买了官方 Red Hat Linux 6.1\n你有权享受所有这些福利：\n\n- 专有访问\n- 完成你订单的技术支持\n作为 Red Hat\
    \ Linux 6.1 客户，你有资格获得\n\n## 启动 NETSCAPE MESSENGER (START NETSCAPE MESSENGER)\n\
    \n- 专有访问\n- 完成你订单的技术支持\n1. 连接互联网。\n2. 点击 Navigator。\n3. 点击 Messenger。\n4. 点击 Mail。\n\
    ## 新闻组列表 (LIST OF NEWSGROUPS)\n\n- 专有访问\n- 完成你订单的技术支持\n5. 点击 Newsgroups。\n## 新闻组如何命名？\
    \ (How are newsgroups named?)\n\n新闻组的名字描述主题。新闻组由两个或多个单词组成，用句号分隔。第一个单词描述主题，例如 alt（可选）、comp（计算机）、rec（娱乐）或\
    \ soc（社交）。这里是一些新闻组名称示例：\nalt.actors\ncomp.security\nrec.football\n\n![](img/e2eac216eed4c6806c742998f1420a0c_300.png)\n\
    ![](img/e2eac216eed4c6806c742998f1420a0c_301.png)\n\n出现 Netscape 对话框。\n出现项目列表。\n\
    6. 点击 Newsgroups。\n\n## 订阅新闻组 (SUBSCRIBE TO NEWSGROUPS)\n\n在订阅新闻组时，你可以搜索新闻组。\n\
    \n![](img/e2eac216eed4c6806c742998f1420a0c_301.png)\n\n## 订阅新闻组（续） (SUBSCRIBE\
    \ TO NEWSGROUPS CONTINUED)\n\n6. 点击 Newsgroups。\n\n## 搜索新闻组 (SEARCH FOR NEWSGROUPS)\n\
    \n- 点击 Search 标签查找新闻组。\n- 点击此区域并输入感兴趣的单词。\n- 点击 Search Now 开始搜索。\n- 此区域显示包含该单词的新闻组。\n\
    注意：Messenger 将显示包含该单词的新闻组。\n\n## 我在哪里可以找到新闻组的信息？ (Where can I find information\
    \ about a newsgroup?)\n\n你可以阅读新闻组的 FAQ（常见问题）来了解它。FAQ 是新闻组中的一条消息，包含了经常出现的问题列表。FAQ\
    \ 的设计是为了防止读者询问已经解答的问题。news.answers 新闻组为各种新闻组提供 FAQ。\n\n![](img/e2eac216eed4c6806c742998f1420a0c_302_0.png)\n\
    ![](img/e2eac216eed4c6806c742998f1420a0c_302_1.png)\n![](img/e2eac216eed4c6806c742998f1420a0c_302_2.png)\n\
    \n## 订阅新闻组 (SUBSCRIBE TO A NEWSGROUP)\n\n1. 点击你想订阅的新闻组。\n2. 点击 Subscribe。\n3.\
    \ 你可以重复步骤 1 和 12 以订阅更多新闻组。\n4. 点击 OK 确认你的选择。\n\n此区域列出了你订阅的新闻组。\n\n## 取消订阅新闻组 (UNSUBSCRIBE\
    \ FROM A NEWSGROUP)\n\n1. 右点击你想取消订阅的新闻组。\n2. 点击 Unsubscribe。\n3. 将出现一个确认对话框。点击\
