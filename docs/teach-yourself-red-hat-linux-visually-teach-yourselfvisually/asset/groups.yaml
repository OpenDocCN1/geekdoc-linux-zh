    | Back | Forward | Reload | Index | History | Bookmarks | Help |


    ![](img/e2eac216eed4c6806c742998f1420a0c_55_2.png)


    The Enlightenment Configuration Tool

    There are two ways to launch the Enlightenment Configuration Tool (e-config).
    You may open the GNOME Control Center and select the Window Manager from the Desktop
    group, or run the Configuration Tool from Enlightenment buttons.


    The Enlightenment Configuration Tool allows you to configure mouse buttons for
    both right and left hands. You can emulate this on the desktop by selecting the
    Delegation Configuration from Enlightenment menu.


    E-config is divided into many sections that contain various effects and functions.
    Each section is represented by a tab in the top left of the e-config. The sections
    to choose from include: Basic, Options, Desktop, Reaver, Audio, Special, and Storages.


