    # Can I print several files at the same time?


    You can print several files at the same time by performing the following steps.


    ![](img/e2eac216eed4c6806c742998f1420a0c_82_0.png)


    +   1 Select the files you want to print. To select multiple files, see page 60.

    2 Position the mouse over one of the files.


    +   3 Drag the file to the Print icon on the GNOME Panel.

    The files prints.


    ![](img/e2eac216eed4c6806c742998f1420a0c_82_1.png)


    # PRINT A FILE


    +   1 Double-click Home to view the directories and files on your computer.


    > A window appears.


    +   2 Click the directory that contains the file you want to print.


    +   3 Position the mouse over the file you want to print.


    +   4 Drag the file to the Print icon on the GNOME Panel.

    The files prints.'
  - '[PAGE 83]


    # FIND A FILE


    If you cannot remember the location of a file you want to work with, you can have
    Linux search for the file.


    ![](img/e2eac216eed4c6806c742998f1420a0c_83_0.png)


    # FIND A FILE


    ![](img/e2eac216eed4c6806c742998f1420a0c_83_1.png)


    +   1. Click the directory where you want to search for the file. If the directory
    contains other directories, Linux will also search these directories.

    2. Click Commands.

    3. Click Find File.

    The Find File window appears.

    4. Double-click the area and type the name of the file you want to find. Make
    sure you type the correct upper and lower case letters.


    Note: If you do not know the exact name of the file, you can use an asterisk (*)
    or question mark (?) to help you find the file. For more information, see the
    page 73.

    5. Click OK to start the search.


