    # SET UP NEWSGROUPS


    You must set up newsgroups before you join newsgroups. Newsgroups are discussion
    groups that allow people with common interests to communicate. You only need to
    set up newsgroups once.


    ![](img/e2eac216eed4c6806c742998f1420a0c_297_0.png)


