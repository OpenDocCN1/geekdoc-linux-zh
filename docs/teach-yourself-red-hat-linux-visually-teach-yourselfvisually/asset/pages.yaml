- pgno: 197
  md: '# COPY A FILE TO A FLOPPY DISK


    You can copy a file stored on your computer to a floppy disk. This is useful if
    you want to share the file with a friend, family member or colleague.


    ![](img/e2eac216eed4c6806c742998f1420a0c_197_0.png)


    When copying a file to a floppy disk, you must use a formatted floppy disk. To
    format a floppy disk, see page 188.


    # COPY A FILE TO A FLOPPY DISK


    ![](img/e2eac216eed4c6806c742998f1420a0c_197_1.png)


    +   1. Display the contents of the floppy disk you want to copy the file to. To
    display the contents of a floppy disk, see page 176 or 184.


    +   2. Click the directory that contains the file you want to copy to the floppy
    disk.

    This area displays the contents of the directory.


    +   3. Position the mouse over the file you want to copy the floppy disk.

    To copy multiple files at the same time, select the files. Then position the mouse
    over one of the files. Select page 160.'
