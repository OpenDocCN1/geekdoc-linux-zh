  md: '# CUSTOMIZE LINUX


    How do I stop using a screen saver?

    If you no longer want to use a screen saver, you can turn the screen saver off.
    Perform steps 1 to 3 below, selecting No Screensaver in step 3. Then perform steps
    6 and 7.


    ![](img/e2eac216eed4c6806c742998f1420a0c_140_0.png)


