- pgno: 167
  md: '# ADD ITEMS TO A DRAWER


    After creating a drawer, you can add programs you want to quickly access to the
    drawer.


    ![](img/e2eac216eed4c6806c742998f1420a0c_167_0.png)


    To create a drawer, see page 152 or 154.


    # ADD ITEMS TO A DRAWER


    ![](img/e2eac216eed4c6806c742998f1420a0c_167_1.png)


    +   1 Click the icon for the drawer you want to add items to.

    2 Click to display the Main Menu.

    3 Display the menu that contains a program you want to add to the drawer.

    4 Position the mouse over the program.

    5 Drag the program to the right of the menu and to open the drawer.


    Note: If the Main Menu covers the open drawer, you must move the drawer before
    you can add the program. To move a drawer, see page 160.'
  merge: -1
  img_proc: true
- pgno: 168
  md: '# Does deleting a program from a drawer permanently delete the program?


    When you delete a program from a drawer, you do not permanently delete the program
    from your computer. You can still access the program using the Main Menu.


    ![](img/e2eac216eed4c6806c742998f1420a0c_168_0.png)


    ![](img/e2eac216eed4c6806c742998f1420a0c_168_1.png)


    ![](img/e2eac216eed4c6806c742998f1420a0c_168_2.png)


    The icon for the program appears in the drawer.


    Note: When you move the mouse over the icon for the program, a yellow box appears,
    displaying a description of the program.


    +   Repeat steps 2 to 5 for each program you want to add to the drawer.


    +   To close the drawer, click the drawer icon.


    # DELETE AN ITEM FROM A DRAWER


    +   Click the icon for the drawer you want to delete an item from.


    +   Right-click the icon for the program you want to delete. A menu appears.


    # Click Remove from panel.


    +   The icon for the program will disappear from the drawer.'
  merge: -1
  img_proc: true
