    Are you a visual learner? Do you prefer instructions that show you how to do something
    — skip the long-winded explanations? If so, this book is for you. Open it up and
    you''ll find clear, step-by-step screen shots that will get you up and running
    fast with Red Hat Linux*, from installing it on your computer and working with
    files and commands to GNOME, KDE, user accounts, Internet connections, e-mail,
    and more.


