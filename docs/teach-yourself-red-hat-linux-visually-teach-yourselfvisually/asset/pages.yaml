    +   Click to resume the play.


    # PLAY ANOTHER SONG


    +   4 Click one of the options to play another song on the CD. << Play the previous
    song. ► Play the next song.


    CONTINUED'
  merge: -1
  img_proc: true
- pgno: 205
  md: '# PLAY A MUSIC CD


    You can switch between the songs on a CD.


    ![](img/e2eac216eed4c6806c742998f1420a0c_205_0.png)


    # PLAY A MUSIC CD (CONTINUED)


    ![](img/e2eac216eed4c6806c742998f1420a0c_205_1.png)


