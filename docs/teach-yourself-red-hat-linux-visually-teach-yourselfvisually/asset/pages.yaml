    Lets you access Netscape''s free e-mail service.

    ### Contact

    Lets you access Netscape''s contact management service, which includes a calendar
    and address book.

    ### People

    Lets you search for people.

    ### Yellow Pages

    Lets you search for people and businesses.

    ### Download

    Lets you obtain the latest versions of Netscape software.

