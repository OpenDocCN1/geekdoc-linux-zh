- pgno: 300
  md: '# How are newsgroups named?


    The name of a newsgroup describes the type of information discussed in the newsgroup.
    A newsgroup name consists of two or more words, separated by periods (.). The
    first word describes the main topic, such as alt (alternative), comp (computers),
    rec (recreation) or soc (social). Each of the following words narrows the topic.


    Here are some examples of newsgroup names. alt.fan.actors comp.security.misc rec.sport.football.pro
    soc.culture.caribbean


    ![](img/e2eac216eed4c6806c742998f1420a0c_300_0.png)


    ![](img/e2eac216eed4c6806c742998f1420a0c_300_1.png)


    +   - Click File.


    +   - The Netscape dialog box appears.


    +   - This area displays an alphabetical list of the available newsgroups.


    +   - If an item displays a plus sign (+), the item contains hidden newsgroups.
    You can click the plus sign (+) to display the hidden newsgroups (—).


    Note: The list of newsgroups may take a while to appear.


    +   - Click Subscribe.'
