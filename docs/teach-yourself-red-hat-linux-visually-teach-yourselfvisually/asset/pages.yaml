  md: '# What information do I need to set up my network card?


    If your network does not have a DHCP server, you will need some or all of the
    following information from your network administrator. A DHCP server automatically
    assigns an IP address to each computer on a network.


    | IP Address | Identifies your computer on the network. |

    |---|---|

    | Netmask | Number that determines how many computers can be on the network. |

    | Network | Basic IP address of the network. |

    | Broadcast | Address used to communicate with all computers on the network. |

    | Hostname | Name of your computer. |

    | Gateway | Address of the device that connects your network to the Internet.
    |

    | DNS | Address of the change that Web pages addresses you type into IP numbers.
    IP numbers uniquely identify each computer that stores Web pages.


