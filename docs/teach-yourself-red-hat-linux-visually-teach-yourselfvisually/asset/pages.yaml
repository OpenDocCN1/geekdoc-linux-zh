    +   1 Click the newsgroup you want to subscribe to.


    +   2 Click Subscribe.


    +   You can repeat steps 11 and 12 to subscribe to additional newsgroups.


    +   13 Click OK to confirm your selection.


    This area lists the newsgroup(s) you subscribed to.


    # UNSUBSCRIBE FROM A NEWSGROUP


    +   1 Right-click the newsgroup you want to unsubscribe from.


    +   2 Click Unsubscribe.


    +   A confirmation dialog will appear. Click OK to unsubscribe from the newsgroup.


    +   The newsgroup will disappear from the list.'
