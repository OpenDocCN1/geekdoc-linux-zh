- pgno: 83
  md: '# FIND A FILE


    If you cannot remember the location of a file you want to work with, you can have
    Linux search for the file.


    ![](img/e2eac216eed4c6806c742998f1420a0c_83_0.png)


    # FIND A FILE


    ![](img/e2eac216eed4c6806c742998f1420a0c_83_1.png)


    +   1. Click the directory where you want to search for the file. If the directory
    contains other directories, Linux will also search these directories.

    2. Click Commands.

    3. Click Find File.

    The Find File window appears.

    4. Double-click the area and type the name of the file you want to find. Make
    sure you type the correct upper and lower case letters.


    Note: If you do not know the exact name of the file, you can use an asterisk (*)
    or question mark (?) to help you find the file. For more information, see the
    page 73.

    5. Click OK to start the search.


    72'
  merge: -1
  img_proc: true
- pgno: 84
  md: '# WORK WITH FILES


    How can I search for a file if I only know part of the file name?


    You can use the asterisk (*) or a question mark (?) to help you find the file.


    ![](img/e2eac216eed4c6806c742998f1420a0c_84_0.png)


    The asterisk (*) represents many characters. For example, type report* to find
    files beginning with report.


    The question mark (?) represents a single character. For example, type 199?report
    to find files beginning with 199 followed by a single character and ending with
    report.


    ![](img/e2eac216eed4c6806c742998f1420a0c_84_1.png)


    ![](img/e2eac216eed4c6806c742998f1420a0c_84_2.png)


    ![](img/e2eac216eed4c6806c742998f1420a0c_84_3.png)


    +   - The Find dialog box appears, displaying the results of the search.


    +   - This area lists each directory that contains a matching file. The matching
    files are indented below each directory.


    +   - Click the directory box containing the file you want to work with. The directory
    is highlighted.


    +   - Change to this directory.


    +   - The directory is selected.


    +   - This area displays the file you searched for.'
  merge: -1
  img_proc: true
- pgno: 85
  md: '# CHANGE FILE PERMISSIONS


    You can change the permissions for a file to control the type of access users
    have to the file.


    ![](img/e2eac216eed4c6806c742998f1420a0c_85_0.png)


    If you are logged on to your computer as a regular user, you can usually only
    change the permissions for files that you have created. If you are logged on as
    root, you can change the permissions for any file on your computer.


    # CHANGE FILE PERMISSIONS


    ![](img/e2eac216eed4c6806c742998f1420a0c_85_1.png)


    +   - Right-click the file you want to change the permissions for. A menu appears.


    +   - Click Properties. The Properties dialog box appears.


    +   - Click the Permissions tab.


    +   - This displays the user name of the person who owns the file. The owner of
    a file is usually the person who created the file.


    *'
  merge: -1
  img_proc: true
- pgno: 86
  md: '# WORK WITH FILES


    I changed the permissions for a file, but other users cannot access the file.
    What is wrong?


    You must change the permissions for your home directory before other users can
    access a file in the directory. You can change the permissions for a directory
    the same way you change the permissions for a file. Turning on the execute (Exec)
    permission will allow users to open the directory. Turning on the read permission
    will allow users to view the files in the directory.


