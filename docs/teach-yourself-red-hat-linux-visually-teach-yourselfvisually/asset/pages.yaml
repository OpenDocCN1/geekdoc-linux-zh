- pgno: 260
  md: '# Why would I need to enter DNS and gateway numbers?


    You may need to enter DNS and gateway numbers to identify the Domain Name Server
    (DNS) and gateway by your Internet provider.


    ![](img/e2eac216eed4c6806c742998f1420a0c_260_0.png)


    # Domain Name Server (DNS)


    A domain name server changes Web page addresses you type into IP numbers. IP numbers
    uniquely identify each computer that stores Web pages on the Internet. For example,
    when you type www.maran.com, a domain name server will change this address to
    172.19.23.255.


    # Gateway


    A gateway is a device that connects your computer to the Internet.


    ![](img/e2eac216eed4c6806c742998f1420a0c_260_1.png)


    | Defaults | |

    | --- | --- |

    | Enter the IP number of the mask gateway your machine is allowed to route IP
    packets | |

    | Default gateway |


