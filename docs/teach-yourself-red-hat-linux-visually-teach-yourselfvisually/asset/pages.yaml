- pgno: 247
  md: '# COMMON LINUX COMMANDS


    ```

    Terminal

    File Edit Settings Help

    [root@localhost /root# gunzip /root/sales_pian.gz]

    ```


    ```

    Terminal

    File Edit Settings Help

    [root@localhost /root# kill 8311]

    ```


    # GUNZIP


    Uncompresses a file you so work with the file. Files are compressed to reduce
    the file size.


    +   To uncompress a file with the .gz extension, type gunzip and then the location
    and name of the file. Then press the Enter key.


    +   To uncompress a file with the .zip extension, type gunzip -S and then type
    the location and name of the file. Then press the Enter key.


    # KILL


    Closes a program. This is useful when a program has stopped responding.


    +   Type kill followed by the process identification (PID) for the program you
    want to close. Then press the Enter key.


    Note: You may be able to determine the PID number for the program using the ps
    command as shown on page 238.


    ```

    Terminal

    File Edit Settings Help

    [root@localhost /root# less /usr/doc/emacs-20.4/READMEME]

    ```


    ```

    Terminal

    File Edit Settings Help

    [root@localhost /root# ls business_letter mckenzie new_projects schedule core
    meetings nmail deadlines miscellaneous operating_costs.gnumeric

    root@localhost /root#]

    ```


    # LESS


    Displays the contents of a text file and allows you to scroll through the file.


    +   Type less followed by the location and name of the file you want to display.
    Then press the Enter key.


    +   To reread the command line, press the G key.


    # LS


    Lists the files and subdirectories in the current directory.


    +   Type is and then press the Enter key.


    Note: If you want to display information about each file and subdirectory, type
    ls -la


