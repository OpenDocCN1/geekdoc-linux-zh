- pgno: 35
  md: '# # INTRODUCTION TO LINUX


    Red Hat Linux is an operating system that controls the overall activity of your
    computer and ensures that all parts of your computer work together smoothly and
    efficiently.


    ![](img/e2eac216eed4c6806c742998f1420a0c_35_0.png)


    Red Hat is the company that distributes Red Hat Linux.


    # HISTORY OF LINUX


    A student from Finland named Linus Torvalds created Linux in 1991. With the help
    of hundreds of volunteer programmers around the world, Linux grew from a simple
    hobby project to a complete, fully functional operating system. Today, millions
    of people worldwide use Linux.


    # OBTAIN LINUX


    You can download Red Hat Linux for free from the www.redhat.com Web site. If you
    do not want to transfer Linux over the Internet, you can purchase the Red Hat
    Linux box set at the Web site and have Red Hat send you the program. You can also
    buy Red Hat Linux at many computer stores and bookstores.


    ![](img/e2eac216eed4c6806c742998f1420a0c_35_1.png)


    ![](img/e2eac216eed4c6806c742998f1420a0c_35_2.png)'
  merge: -1
  img_proc: true
- pgno: 36
  md: '# LINUX BASICS


    # GNOME


    Linux comes with the GNOME desktop environment, which offers an easy-to-use, graphical
    display for accomplishing tasks in Linux. The GNOME desktop environment is shown
    throughout this book.


    # WORK WITH FILES


    Linux provides ways to organize and manage the files stored on your computer.
    You can open, sort, rename, move, print, find delete files.


    ![](img/e2eac216eed4c6806c742998f1420a0c_36_0.png)


    ![](img/e2eac216eed4c6806c742998f1420a0c_36_1.png)


    # WORK WITH LINUX APPLICATIONS


    Linux includes a drawing program, spreadsheet program, calendar program and a
    simple text editor. You will also find an on-screen calculator, an address book
    and many games that you can play.


    # CUSTOMIZE LINUX


    You can customize Linux in many ways. You can add a colorful design to your desktop,
    set up a screen saver, change the way your mouse works and have Linux play sounds
    for certain program events, such as when an error message appears.


    ![](img/e2eac216eed4c6806c742998f1420a0c_36_2.png)


    ![](img/e2eac216eed4c6806c742998f1420a0c_36_3.png)'
  merge: -1
  img_proc: true
- pgno: 37
  md: '# INTRODUCTION TO LINUX


    # WORK WITH ACCOUNTS


    When you installed Linux, the root account and one or more user accounts were
    created. You should only use the root account to perform administrative and maintenance
    tasks, since you can damage your computer when using the root account. When performing
    daily tasks, you should work in a user account.


    ![](img/e2eac216eed4c6806c742998f1420a0c_37_0.png)


    # WORK WITH FLOPPY AND CD-ROM DRIVES


    You can view the contents of floppy disks and CD-ROM discs. You can also copy
    files to a floppy disk, format a floppy disk to prepare the disk for use and play
    music CDs on your computer.


    ![](img/e2eac216eed4c6806c742998f1420a0c_37_1.png)


    # SET UP HARDWARE AND SOFTWARE


    Linux helps you set up hardware, such as a printer, sound card and network card.
    Linux also helps you install packages that contain programs and files that add
    new capabilities to Linux.


    ![](img/e2eac216eed4c6806c742998f1420a0c_37_2.png)


    # CONNECT TO THE INTERNET


    Linux comes with Netscape Communicator, which allows you to browse the Web, exchange
    electronic mail with people around the world and join newsgroups to communicate
    with people who have common interests.


    ![](img/e2eac216eed4c6806c742998f1420a0c_37_3.png)'
  merge: -1
  img_proc: true
- pgno: 38
  md: '# USING THE MOUSE


    A mouse is a handheld device that lets you select and move items on your screen.


    When you move the mouse on your desk, the mouse pointer on your screen moves in
    the same direction. The mouse pointer assumes different shapes, such as ✎ or ⚡,
    depending on its location on your screen and the task you are performing.


    ![](img/e2eac216eed4c6806c742998f1420a0c_38_0.png)


    # MOUSE ACTIONS


    # THREE-BUTTON MOUSE


    If you have a mouse with three buttons, you can use the middle mouse button to
    perform certain tasks. If you have a mouse with two buttons, you can imitate a
    third button by pressing the left and right mouse buttons at the same time.


    +   Click

    Press and release the left mouse button.


    +   Double-click

    Quickly press and release the left mouse button twice.


    +   Right-click

    Press and release the right mouse button.


    +   Drag

    Position the mouse pointer over an object on your screen and then press and hold
    down the left mouse button as you move the mouse to where you want to place the
    object. Then release the button.


    ![](img/e2eac216eed4c6806c742998f1420a0c_38_1.png)'
  merge: -1
  img_proc: true
