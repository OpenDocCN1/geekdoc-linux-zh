    7 Click this area and type the address of the news server you want to use.


    8 Click OK to confirm the information you entered.


    The news server you specified appears in this area.


    If you want to use more than one server, repeat steps 6 to 8 for each server.


    9 Click OK to confirm your changes. You can now subscribe to newsgroups as shown
    on page 288.'
