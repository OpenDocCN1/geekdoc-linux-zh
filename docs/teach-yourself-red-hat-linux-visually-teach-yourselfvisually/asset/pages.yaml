- pgno: 209
  md: '# SET UP A PRINTER


    You must set up a printer on your computer before you can print files. You only
    need to set up a printer once.


    ![](img/e2eac216eed4c6806c742998f1420a0c_209_0.png)


    You can only set up a printer if you are logged on to your computer as **root**.
    If you are logged on as a regular user, you cannot set up a printer.


    # SET UP A PRINTER


    ![](img/e2eac216eed4c6806c742998f1420a0c_209_1.png)


    ![](img/e2eac216eed4c6806c742998f1420a0c_209_2.png)


    +   1 Click **Level** to display the Main Menu.

    2 Click **AnotherLevel** menus.

    3 Click **Administration**.

    4 Click **Printer Tool**.


    +   An error message may appear, depending on the software installed on your computer.


    +   5 Click **Ignore** to remove the error message.'
  merge: -1
  img_proc: true
- pgno: 210
  md: '# Why do I need to set up a printer?


    Setting up a printer lets you specify the printer driver Linux should use for
    your printer. A printer driver is special software that enables Linux to communicate
    with your printer. When you set up a printer using the steps below, Linux helps
    you select the correct printer driver for your printer.


    ![](img/e2eac216eed4c6806c742998f1420a0c_210_0.png)


    ![](img/e2eac216eed4c6806c742998f1420a0c_210_1.png)


    ![](img/e2eac216eed4c6806c742998f1420a0c_210_2.png)


    +   - The Red Hat Printer System Manager window appears.

    - Click Add to set up a new printer.

    - Add a Printer dialog box appears.


    +   - Click Local Printer to set up a printer that connects directly to your computer
    (changes to).

    - Click OK to confirm your selection.


    +   - The Info dialog box appears.

    This area lists the printers automatically detected by Linux. A printer port is
    socket at the back of a computer where you plug in a printer.


    Note: If Linux does not detect a printer port, you can visit the support.redhat.com
    Web page and review the Frequently Asked Questions for help

    Click OK to continue.'
  merge: -1
  img_proc: true
- pgno: 211
  md: '# SET UP A PRINTER


    When setting up a printer, you must specify the type of printer you will use.


    ![](img/e2eac216eed4c6806c742998f1420a0c_211_0.png)


    # SET UP A PRINTER (CONTINUED)


    ![](img/e2eac216eed4c6806c742998f1420a0c_211_1.png)


    +   - The Edit Local Printer Entry dialog box appears.

    - 10 Click Select to select the type of printer you want to set up.

    - The Configure Filter window appears.

    - 11 Click the type of printer you want to use. Note: If the printer you want
    to use does not appear in the list, select a printer that closely matches your
    printer.

    - 12 Click OK to confirm your selection.


    200'
  merge: -1
  img_proc: true
- pgno: 212
  md: '# What information does Linux display about my printer?


    Linux displays the following information about the printer you select in the Configure
    Filter window. Linux automatically selects the most commonly used settings for
    the printer.


    ![](img/e2eac216eed4c6806c742998f1420a0c_212_0.png)


    Resolution

    Determines the quality of printouts.


    Paper Size

    Determines the size of the printer will use.


    Color Depth

    Determines the number of colors the printer will use.


    ![](img/e2eac216eed4c6806c742998f1420a0c_212_1.png)


    This area displays the type of printer you selected.


    13 Click OK to continue.


    +   - This area displays information about the printer you selected.


    +   - Click X to close the window.


    +   - The printer is now set up on your computer. You can print a test page to
    make sure the printer is set properly. To print a test page, page 202.'
  merge: -1
  img_proc: true
- pgno: 213
  md: '# PRINT A TEST PAGE


    You can print a test page to confirm that your printer is set up properly.


    ![](img/e2eac216eed4c6806c742998f1420a0c_213_0.png)


    You can only print a test page if you are logged on your computer as root. If
    you are logged on as a regular user, you cannot print a test page.


    # PRINT A TEST PAGE


    | Red Hat Linux Print System Manager |

    |---||

    | Print Queue: lpt0 |

    | Printer Status: STUNNING on /dev/lpt0 |

