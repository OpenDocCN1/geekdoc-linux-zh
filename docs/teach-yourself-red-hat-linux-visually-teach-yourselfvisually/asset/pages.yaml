- pgno: 142
  md: '# CUSTOMIZE LINUX


    ![](img/e2eac216eed4c6806c742998f1420a0c_142_0.png)


    My mouse pointer does not move smoothly on my screen. What can I do?


    You may need to clean your mouse.

    Turn the mouse over and remove and clean the roller ball. Then use a cotton swab
    to remove the dirt from the rollers inside the mouse.


    You should use a mouse pad to reduce the amount of dirt that enters the mouse.
    Hard plastic mouse pads attract less dirt and provide a smoother surface than
    fabric mouse pads.


    ![](img/e2eac216eed4c6806c742998f1420a0c_142_1.png)


    +   6 To specify how fast you must move the mouse on your desk before the mouse
    pointer on your screen will use the acceleration speed you specified, position
    the mouse slider ( ).


    +   7 Drag the slider to a new position.


    +   8 To test the mouse settings before confirming your changes, click Try.


    +   9 Click OK to confirm your changes.

    10 X to close the Control Center window.'
  merge: -1
  img_proc: true
