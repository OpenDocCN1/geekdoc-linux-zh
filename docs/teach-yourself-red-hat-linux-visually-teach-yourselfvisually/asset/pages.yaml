- pgno: 161
  md: '# ADD AN APPLICATION LAUNCHER


    You can add an application launcher to the GNOME Panel. An application launcher
    lets you quickly start a program you frequently use.


    ![](img/e2eac216eed4c6806c742998f1420a0c_161_0.png)


    # ADD AN APPLICATION LAUNCHER


    ![](img/e2eac216eed4c6806c742998f1420a0c_161_1.png)


    | Application | Address Book |

    | --- | --- |

    | Graphics | Canvas |

    | Games | amass Editor |

    | Multimedia | Green |

    | System | GnomePG |

    | Settings | javascript |

    | File Manager | Cross-device checklist |

    | Help system | Time Marking tool |

    | User menus (empty) | |

    | Context menus | |

    | Panel | |

    | Lock screen | |

    | About (GNOME) |


    +   1 Click to display the Main Menu.


    +   2 Display the menu that contains the program you want to be able to start
    from the GNOME Panel.


    +   3 Right-click the program. A menu appears.


    +   4 Add this launcher to panel.


    +   5 To close the Main Menu, click outside the menu area.'
  merge: -1
  img_proc: true
- pgno: 162
  md: '# CUSTOMIZE THE GNOME PANEL


    What application launchers automatically appear on the GNOME Panel?


    Starts the GNOME Help Browser so you can find help information about Linux.


    Opens the Control Center window so you can view and change settings such as the
    color of the desktop.


    Opens the Terminal window, where you can type Linux commands.


    Starts Netscape Communicator, which allows you to browse the Web, exchange e-mail
    messages and join newsgroups.


    ![](img/e2eac216eed4c6806c742998f1420a0c_162_0.png)


    ![](img/e2eac216eed4c6806c742998f1420a0c_162_1.png)


    ![](img/e2eac216eed4c6806c742998f1420a0c_162_2.png)


    +   - A button for the program appears on the GNOME Panel. You can click the button
    to start the program.


    +   - To move the application launcher to a new location on the GNOME Panel, see
    page 160.


    # DELETE AN LAUNCHER


    +   1 Right-click the application launcher you want to delete. A menu appears.


    +   2 Click Remove from panel. The application launcher will disappear from the
    GNOME Panel.'
  merge: -1
  img_proc: true
- pgno: 163
  md: '# CREATE A DRAWER FROM THE MAIN MENU


    You can create a drawer on the GNOME Panel that contains programs from the Main
    Menu. This will give you access to programs you often use.


    ![](img/e2eac216eed4c6806c742998f1420a0c_163_0.png)


    # CREATE A DRAWER FROM THE MAIN MENU


    ![](img/e2eac216eed4c6806c742998f1420a0c_163_1.png)


    ![](img/e2eac216eed4c6806c742998f1420a0c_163_2.png)


    +   1 Click to display the Main Menu.


    +   2 Display the menu that contains the programs you want to appear in a drawer.


    +   3 Right-click the item at the top of the menu. A menu appears.


    +   4 Click Add this as drawer to panel.


    +   5 To close the Main Menu, click outside the menu area.'
  merge: -1
  img_proc: true
- pgno: 164
  md: '# CUSTOMIZE THE GNOME PANEL


    I find it difficult to remember which icon will start the program I want. What
    can I do?


    If you find it difficult to remember which programs the icons in a drawer start,
    you can create a yellow box appears menu on the GNOME Panel instead of a drawer.
    A menu is similar to a drawer, but lists programs by name instead of by icon.
    To create a menu on the GNOME Panel, perform steps 1 to 4 on page 152, except
    select Add this as menu to panel in step 4.


    ![](img/e2eac216eed4c6806c742998f1420a0c_164_0.png)


    ![](img/e2eac216eed4c6806c742998f1420a0c_164_1.png)


    ![](img/e2eac216eed4c6806c742998f1420a0c_164_2.png)


    ![](img/e2eac216eed4c6806c742998f1420a0c_164_3.png)


    The drawer appears open and displays an icon for each program in the menu.


    Note: When you move the mouse, over the icon for a program, a yellow box appears,
    displaying a description of the program.


    5 To close the drawer, click the drawer.


    +   - To once again display the contents of the drawer, click the drawer.

    - To move the drawer to a new location on the GNOME Panel, see page 160.


    # DELETE A DRAWER


    +   1 Right-click the drawer icon you want to delete. A menu appears.


    # 2 Click Remove from panel.


    +   - The drawer icon will disappear from the GNOME Panel.


    Note: To delete an individual item from a drawer, perform steps 1 to 3 on page
    157.


    3 With*'
