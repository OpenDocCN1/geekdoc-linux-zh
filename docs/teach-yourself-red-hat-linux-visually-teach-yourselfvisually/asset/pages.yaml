    the system with the current configuration. You can also see how to make the system
    components work.


    ![](img/e2eac216eed4c6806c742998f1420a0c_260_2.png)


    ![](img/e2eac216eed4c6806c742998f1420a0c_260_3.png)


    +   - If Defaults is not displayed, click the sign (+) beside Routing and gateways


    +   - Click area and type the gateway number provided by your Internet provider.


    +   - Click Accept to confirm the information.


    +   - Click X to close the gnome-linux window.

    - The Status of the system tab appears, stating that your computer is not up to
    date.


    +   - Activate changes to update your computer.

    - You can now connect to the Internet. To connect to the Internet, see page 250.'
