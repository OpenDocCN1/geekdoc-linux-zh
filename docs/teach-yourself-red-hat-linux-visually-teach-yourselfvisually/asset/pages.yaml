  md: '# MOVE THE GNOME PANEL


    CUSTOMIZE THE GNOME PANEL


    You can move the GNOME Panel to a more convenient location on your screen.


    ![](img/e2eac216eed4c6806c742998f1420a0c_172_0.png)


    You can move the GNOME Panel to the top, bottom, left or right edge of your screen.


    # MOVE THE GNOME PANEL


    ![](img/e2eac216eed4c6806c742998f1420a0c_172_1.png)


