- pgno: 70
  md: '# What type of information can I display about the files on my computer?


    Here are some columns of information that you may want to display.


    | Column | Description |

    | Access Time | Displays the date and time each file was last accessed. |

    | Creation Time | Displays the date and time each file was created. |

    | Modification Time | Displays the date and time each file was last changed. |

    | Name | Displays the name of each file. |

    | Owner | Displays the name of the person who owns each file. |

    | Permission | Displays the read (r), write (w) and execute (x) permissions for
    each file. |

    | Size | Displays the size of each file in bytes. |

    | Type | Displays an icon that represents the type of each file. |


    ![](img/e2eac216eed4c6806c742998f1420a0c_70_0.png)


    +   - The column you added appears in this area.


    +   - To remove a column you no longer want to display, click the column.


    +   -8 Click Remove to remove the column.


    +   -9 Click OK to confirm your changes.


    This area shows the columns you choose to display.


    To change the width of a column, position the mouse over the right edge of the
    column heading (↔). Then drag the column edge until the column displays your width.


    Note: If you no longer want to display customized file information, you can change
    the width as shown on page 56.'
  merge: -1
  img_proc: true
- pgno: 71
  md: '# SELECT FILES


    Before working with files, you often need to select the files you want to work
    with. The names of selected files appear highlighted on your screen.


    ![](img/e2eac216eed4c6806c742998f1420a0c_71_0.png)


    You can select directories the same way select files. Selecting a directory will
    select all the files in the directory.


    # SELECT FILES


    ![](img/e2eac216eed4c6806c742998f1420a0c_71_1.png)


    # SELECT ONE FILE


    +   - Click the file you want to select.


    +   - The name of the file is highlighted.


    This area displays the size of the file you selected.


    # SELECT A GROUP OF FILES


    +   - Click the first file you want to select.


    +   - Press and hold down the Shift key.


    +   - Still holding down the Shift key, click, and the last file you want to select.


    60'
  merge: -1
  img_proc: true
- pgno: 72
  md: '# WORK WITH FILES


    How do I deselect files?

    To deselect all files, click a blank area on the right side of the window.


    To deselect one file from a group of selected files, press and hold the Ctrl key
    while clicking the file you want to deselect.

    Note: You can deselect directories the same way you deselect files.


    ![](img/e2eac216eed4c6806c742998f1420a0c_72_0.png)


    ![](img/e2eac216eed4c6806c742998f1420a0c_72_1.png)


    # RANDOM FILES


    +   1 Click a file you want to select.

    2 Press and hold down the Ctrl key.


    3 Still holding down the Ctrl key, each file you want to select.


    # ALL FILES


    +   1 To select all the files in the current directory, click Edit.


    +   2 Click Select All.


    61'
  merge: -1
  img_proc: true
- pgno: 73
  md: '# OPEN A FILE


    You can open a file to display its contents on your screen. This lets you review
    and make changes to the file.


    ![](img/e2eac216eed4c6806c742998f1420a0c_73_0.png)


    # OPEN A FILE


    ![](img/e2eac216eed4c6806c742998f1420a0c_73_1.png)


    +   - Double-click the file you want to open.


    +   - Your home directory stores your personal files. To display your home directory,
    click Home.


    +   - A dialog box may appear, asking you to select the program you want to use
    to open the file.


    +   - Click the program you want to use to open the file.


    62'
  merge: -1
  img_proc: true
- pgno: 74
  md: '# WORK WITH FILES


    How did Linux open my file without asking which program to use?


    If the name of the file you are opening contains a file extension, Linux may automatically
    open the file. Linux uses the file extension to determine which program to use
    to open the file. A file extension appears at the end of a file name and is separated
    by a period (example: manual.txt).


    ![](img/e2eac216eed4c6806c742998f1420a0c_74_0.png)


    Here are some common file extensions.


    | Type of File | File Extensions |

    |---|-|

    | Audio | au, mp3, ram, snd, wav |

    | Image | bmp, gif, jpeg, jpg, png |

    | Text | asc, txt |

    | Video | avi, mpeg, mov |


    ![](img/e2eac216eed4c6806c742998f1420a0c_74_1.png)


    ![](img/e2eac216eed4c6806c742998f1420a0c_74_2.png)


    ![](img/e2eac216eed4c6806c742998f1420a0c_74_3.png)


    ![](img/e2eac216eed4c6806c742998f1420a0c_74_4.png)


    ![](img/e2eac216eed4c6806c742998f1420a0c_74_5.png)


    ![](img/e2eac216eed4c6806c742998f1420a0c_74_6.png)


    ![](img/e2eac216eed4c6806c742998f1420a0c_74_7.png)


    Click OK to open the file.


    The file opens. You can now review and make changes to the file.


    When you finish working with the file, click X to close the file.


    # 63'
  merge: -1
  img_proc: true
