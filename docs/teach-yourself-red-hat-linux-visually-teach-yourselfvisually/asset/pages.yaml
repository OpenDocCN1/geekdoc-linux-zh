    your CD-ROM drive.

    2 Click to display the Main Menu.

    3 Click System.

    4 Click GRPM.

    2 If the Gnome RPM window appears, skip to step 5.

    3 Click the Gnome RPM window appears.

    5 Click install to install a package.


    Note: A word may appear, asking for the password for the root account. Type the
    password and press the Enter key.


    214'
