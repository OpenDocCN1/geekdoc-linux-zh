    - To once open the drawer, click the drawer icon.


    +   - To add items to the drawer, see page 156.

    - To move the drawer to a new location on the GNOME Panel, see page 160.


    # DELETE A DRAWER


    +   1 Remove from panel.

    Right-click the drawer icon you want to delete. A menu appears.


    +   - The drawer icon will disappear from the GNOME Panel.'
