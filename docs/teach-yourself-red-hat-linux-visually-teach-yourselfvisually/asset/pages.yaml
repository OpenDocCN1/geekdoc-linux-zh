- pgno: 77
  md: '# DELETE A FILE


    You can delete a file you no longer need. Linux will permanently delete the file
    from your computer.


    ![](img/e2eac216eed4c6806c742998f1420a0c_77_0.png)


    If you are logged on your computer as a regular user, you can usually only delete
    files that you have created. If you are logged on as root, you can delete any
    file on your computer.


    # DELETE A FILE


    ![](img/e2eac216eed4c6806c742998f1420a0c_77_1.png)


    You should only delete files that you have created.


    +   1. Click the file you want to delete.


    +   2. To delete more than one file, select the files. To select multiple files,
    see page 60.


    +   3. Click File.


    +   The Delete dialog box appears.


    +   4. Click Yes to delete the file.'
  merge: -1
  img_proc: true
- pgno: 78
  md: '# How do I delete a file located on my desktop?


    +   1 Right-click the file you want to delete. A menu appears.


    +   2 Click Delete.


    +   The Delete dialog box will appear. Click Yes to delete the file.


    ![](img/e2eac216eed4c6806c742998f1420a0c_78_0.png)


    The file permanently disappears.


    # DELETE A DIRECTORY


    You can delete a directory and all the files it contains. You should only delete
    directories that you have created.


    +   1 Perform steps 1 to 4 on page 66, selecting the directory you want to delete
    in step 1.


    +   A dialog box appears, stating that the directory is not empty.


    +   2 Click Yes to delete the directory.


    ![](img/e2eac216eed4c6806c742998f1420a0c_78_1.png)


    ![](img/e2eac216eed4c6806c742998f1420a0c_78_2.png)'
  merge: -1
  img_proc: true
- pgno: 79
  md: '# MOVE AND COPY FILES


    You can organize the files stored on your computer by moving or copying them to
    new locations.


    ![](img/e2eac216eed4c6806c742998f1420a0c_79_0.png)


    # MOVE FILES


    If you are logged on to computer as a regular user, you can usually move and copy
    files only within your home directory. If you are logged on as root, you can move
    and copy files to any location on your computer.


    ![](img/e2eac216eed4c6806c742998f1420a0c_79_1.png)


    +   Position the mouse over the file you want to move.


    +   To move multiple files at the same time, select the files. Then position the
    mouse over one of the files. To select multiple files, see page 60.


    +   Drag the file to the directory where you want to place the file.


    +   The file moves to the directory you specified.


    68'
  merge: -1
  img_proc: true
- pgno: 80
  md: '# What is the difference between moving and copying a file?


    ![](img/e2eac216eed4c6806c742998f1420a0c_80_0.png)


    # Move a File


    When you move a file, you place the file in a new location on your computer.


    ![](img/e2eac216eed4c6806c742998f1420a0c_80_1.png)


    # Copy a File


    When you copy a file, you make an exact copy of the file and then place the copy
    in a new location. This lets you store the file in two locations.


    # COPY FILES


    ![](img/e2eac216eed4c6806c742998f1420a0c_80_2.png)


    ![](img/e2eac216eed4c6806c742998f1420a0c_80_3.png)


    +   1 To view the file in the new location, click the directory you moved the
    file.


    +   2 This area displays the contents of the directory, including the file you
    moved.


    Note: You can move directories the same way you move files. When you move a directory,
    all the files in the directory also move.


    +   3 Position the mouse over the file you want to copy.


    +   4 To copy multiple files at the same time, select the files. Then position
    the mouse over one of the files. To select multiple files, see page 60.


    +   5 Press and hold down the Ctrl key as drag the file to the directory where
    you want to place a copy of the file.'
  merge: -1
  img_proc: true
- pgno: 81
  md: '# PRINT A FILE


    You can produce a paper copy of a file stored on your computer.


    ![](img/e2eac216eed4c6806c742998f1420a0c_81_0.png)


    Before you can print files, you must set up a printer as shown on page 198.


    # PRINT A FILE


    ![](img/e2eac216eed4c6806c742998f1420a0c_81_1.png)


    # ADD A PRINT ICON


    Before you can print a file, you must add a Print icon to the GNOME Panel. You
    only need to add a Print icon to the GNOME Panel once.


    +   1 Click to display the Main Menu.

    2 Click Panel.

    3 Add applet.

    4 Click Utility.

    5 Click Printer Applet.


    > A Print icon appears on the GNOME Panel.


    > You can use the Print icon to print your files.


    70'
  merge: -1
  img_proc: true
- pgno: 82
  md: '# Can I print several files at the same time?


    You can print several files at the same time by performing the following steps.


    ![](img/e2eac216eed4c6806c742998f1420a0c_82_0.png)


    +   1 Select the files you want to print. To select multiple files, see page 60.

    2 Position the mouse over one of the files.


    +   3 Drag the file to the Print icon on the GNOME Panel.

    The files prints.


