- pgno: 245
  md: '# # COMMON LINUX COMMANDS


    ![](img/e2eac216eed4c6806c742998f1420a0c_245_0.png)


    ![](img/e2eac216eed4c6806c742998f1420a0c_245_1.png)


    # CD


    Changes the current directory.


    +   1 **cd** followed by the location and name of the directory you want to change
    to. Then press the `Enter` key.


    > Note: If you do not type the location of a directory, Linux changes to your
    home directory.


    ![](img/e2eac216eed4c6806c742998f1420a0c_245_2.png)


    # CHMOD


    Changes the read, write, and execute permissions for a file.


    +   1 **chmod** followed by **u, g, o** or **a** (user, group, other users or
    all) to specify who you want to change the permissions for.

    2 **+** or **-** - allow or deny permissions for the file.

    3 **r, w** or **x** (read, write or execute) to specify the type of permission
    you want to allow or deny.

    4 The location and the name of the file you want to change the permissions for.
    Then press the `Enter` key.


    ![](img/e2eac216eed4c6806c742998f1420a0c_245_3.png)


    ![](img/e2eac216eed4c6806c742998f1420a0c_245_4.png)


    # CLEAR


    Clears the screen.


    +   1 Type **clear** and then press the `Enter` key.


    ![](img/e2eac216eed4c6806c742998f1420a0c_245_5.png)


    # CP


    Makes an exact copy of a file and places the copy in a new location.


    +   1 **cp** followed by the location and name of the file you want to copy.

    2 The location and name of the directory where you want to place the copy. Then
    press the `Enter` key.'
  merge: -1
  img_proc: true
