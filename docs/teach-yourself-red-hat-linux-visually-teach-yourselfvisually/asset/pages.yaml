- pgno: 156
  md: '# How will changing the resolution affect the appearance of my screen?


    The resolution you select will determine the amount of information that can fit
    on your screen. Lower resolutions display larger images so you can see the information
    on your screen more clearly. Higher resolutions display smaller images so you
    can display more information on your screen at once.


    Here are the most commonly used resolutions.


    ![](img/e2eac216eed4c6806c742998f1420a0c_156_0.png)


    | 640x480 | 800x600 | 1024x768 |


