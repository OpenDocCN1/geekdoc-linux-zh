  md: '# SET UP A SCREEN SAVER


    A screen saver is a moving picture or pattern that appears on the screen when
    you do not use your computer for a period of time.


    ![](img/e2eac216eed4c6806c742998f1420a0c_139_0.png)


    You can only use a screen saver if you are logged on to your computer as a regular
    user. If you are logged on as root, you cannot use a screen saver.


