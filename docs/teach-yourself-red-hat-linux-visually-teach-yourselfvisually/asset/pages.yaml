    you can get help.


    # MANUALS


    The Official Red Hat Linux 6.1 box comes with three manuals that can help you
    install and use Linux.


    If you have misplaced the manuals or do not own the box set, you can view the
    manuals at the following Web page.

    www.redhat.com/corp/support/manuals


    ![](img/e2eac216eed4c6806c742998f1420a0c_57_0.png)


    # Installation Guide


    Provides detailed instructions on how to install Linux.


    ![](img/e2eac216eed4c6806c742998f1420a0c_57_1.png)


    # Get Started Guide


    Provides general information on how to use Linux.


    ![](img/e2eac216eed4c6806c742998f1420a0c_57_2.png)


    # Reference Guide


    Provides detailed information on how to install and use Linux.


    # WEB PAGES


    You can use the icons on your desktop to quickly access help information on the
    Web. To display a Web page, double-click the icon for the Web page.


    www.redhat.com


    Provides general information about Red Hat, the company that distributes Red Hat
    Linux.


    # Red Hat Support


    support.redhat.com


    Provides help on how to install and use Linux problems. You can also access the
    Hardware Compatibility Lists to determine whether your hardware will work with
    Linux.


    ![](img/e2eac216eed4c6806c742998f1420a0c_57_3.png)


    # Red Hat Errata


    support.redhat.com/errata


    Provides information about updates, fixes and corrections for Linux.


    # Linux Documents


    www.redhat.com/mirrors/LDP


    Provides a collection of documents containing the most-up-to-date information
    about Linux.


    # GNOME Web Site


    www.gnome.com


    Provides information and support on GNOME, a graphical desktop environment in
    Linux.'
  merge: -1
  img_proc: true
- pgno: 58
  md: '# LINUX BASICS


    # MAILING LISTS


    You can join a mailing list to get Linux help through e-mail. A mailing list is
    a discussion group that uses e-mail to communicate.


    ![](img/e2eac216eed4c6806c742998f1420a0c_58_0.png)


    ![](img/e2eac216eed4c6806c742998f1420a0c_58_1.png)


    # linux-list


    A mailing list offering general discussions about Linux. To join the list, send
    an e-mail message to linux-list-request@scsc.com with the word "subscribe" in
    the body of the message.


    # linux-newbie


    A mailing list for new Linux users. To join the list, send an e-mail message to
    majordomo@vger.rutgers.edu with the words "subscribe linux-newbie" in the body
    of the message.


    # NEWSGROUPS


    You can join newsgroups to find out more about Linux. A newsgroup is a discussion
    group that allows people with common interests to communicate.


    Here are some newsgroups you will find on the news.redhat.com news server.


    ![](img/e2eac216eed4c6806c742998f1420a0c_58_2.png)


    # redhat.config


    Discussions about setting up hardware and software and fixing hardware and software
    problems.


    ![](img/e2eac216eed4c6806c742998f1420a0c_58_3.png)


    # redhat.general


    General information discussions about Linux.


    ![](img/e2eac216eed4c6806c742998f1420a0c_58_4.png)


    Newsgroup messages are stored on computers called news servers. You can connect
    to the news.redhat.com news server to join newsgroups dedicated to Linux topics.
    For more information on newsgroups, see pages 286 to 293.


    ![](img/e2eac216eed4c6806c742998f1420a0c_58_5.png)


    # redhat.hardware.arch.intel


    Discussions about hardware, including how to set up hardware and fix hardware
    problems.'
  merge: -1
  img_proc: true
