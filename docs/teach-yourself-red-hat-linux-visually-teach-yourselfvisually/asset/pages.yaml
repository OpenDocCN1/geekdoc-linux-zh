- pgno: 88
  md: '# WORK WITH FILES


    # How do I rename or delete a link on the desktop?


    You can rename or delete a link on the desktop the same way you would rename or
    delete a file. Renaming or deleting a link does not affect the original file.
    To rename a file, see page 64. To delete a file, see page 66.


    ![](img/e2eac216eed4c6806c742998f1420a0c_88_0.png)


    ![](img/e2eac216eed4c6806c742998f1420a0c_88_1.png)


    +   A menu appears.


    +   Click Link here to create a link to the file on the desktop.


    +   The link appears on the desktop. A link displays an arrow (↗).


    +   You can double-click the link to open the file. For more information on opening
    files, see page 62.


    Note: You can create a link to a directory the same way you create a link to a
    file. This will give you quick access to all the files in the directory.'
  merge: -1
  img_proc: true
- pgno: 89
  md: '# CREATE A NEW DIRECTORY


    You can create a new directory to help you better organize the files stored on
    your computer.


    ![](img/e2eac216eed4c6806c742998f1420a0c_89_0.png)


    If you are logged on to your computer as a regular user, you can create directories
    in your home directory and on your desktop. If you are logged on as root, you
    can create directories anywhere on your computer.


    # CREATE A NEW DIRECTORY


    | File Edit View Layout Commands Help |

    |---|---|---|---|---|---||

    | Back Up Refresh Recant Home Icons Brif Detail Custom |


    +   1. Click the directory you want to contain the new directory.

    2. Right-click an empty area on the right side of the window.

    3. Click New Directory.

    4. Click this area and type a name for the new directory.

    5. Click OK to create the directory.'
  merge: -1
  img_proc: true
- pgno: 90
  md: '# WORK WITH FILES


    How can creating a new directory help me organize the files on my computer?

    Creating a new directory is like placing a new folder in a filing cabinet. You
    can create a directory to store files you want to keep together, as as for a particular
    project or files created during a specific time period. You can create as many
    directories as you need to organize files using a system that makes sense to you.


    ![](img/e2eac216eed4c6806c742998f1420a0c_90_0.png)


    ![](img/e2eac216eed4c6806c742998f1420a0c_90_1.png)


    +   - The new directory appears in this area.


    +   - Linux also adds the new directory to the directory structure.


    You can create a new directory on your desktop.


    +   1 Right-click an empty area on your desktop.

    2 Click New.

    3 Click Directory.


    +   4 Perform steps 4 and 5 on page 78 to create the new directory.

    Note: The new directory may appear behind the GNOME Panel. To hide the GNOME Panel
    so can view the new directory, see page 117.'
  merge: -1
