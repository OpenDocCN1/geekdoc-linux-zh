- pgno: 158
  md: '# CUSTOMIZE LINUX


    Will using a graphical login screen make Linux easier to use?


    Yes. When you use a graphical login screen, Linux will automatically start the
    GNOME desktop environment for you. If you do not use a graphical login screen,
    a text-based login screen will appear and you will have to manually start GNOME
    as shown at the top of page 29.


    ![](img/e2eac216eed4c6806c742998f1420a0c_158_0.png)


    ![](img/e2eac216eed4c6806c742998f1420a0c_158_1.png)


    > Configuration file has been written. Take a look at it before running ''starts''.
    Note that the XFConfig file must be in one of the directories searched by the
    server (~X11/XFBMConfig) in order to sync the server. Press alt+'' to simultaneously
    refresh video settings. Press backspace immediately exists if the server doesn''t
    sync for a moment later.


    > For further configuration, refer to ~/.X11/XFConfig/X11config/README.Config.
    OK.


    +   A message appears, stating that Xconfigurator can set up your computer to
    automatically display a graphical login screen each time you log on to your computer.


    +   Click Yes to have Linux display a graphical login screen.


    +   A message appears, stating that Xconfigurator created a file to store the
    display settings specified.


    +   Click OK to close the message and exit Xconfigurator.


    +   You will need to log out before the new display settings will take effect.
    To log out, see page 172.'
  merge: -1
  img_proc: true
