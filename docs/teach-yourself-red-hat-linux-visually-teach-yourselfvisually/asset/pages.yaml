    ![](img/e2eac216eed4c6806c742998f1420a0c_206_1.png)


    ![](img/e2eac216eed4c6806c742998f1420a0c_206_2.png)


    # ADJUST THE VOLUME


    Position the mouse over the volume slider.


    Drag the slider to turn the volume up or down.


    Drag the slider to the left to turn the volume down. Drag the slider to the right
    to turn the volume up.


    Note: You can also use the volume control on your speakers to adjust the volume.


    # EXIT CD PLAYER


    When you finish playing the CD, click to eject the CD.


    Click to close the window.'
