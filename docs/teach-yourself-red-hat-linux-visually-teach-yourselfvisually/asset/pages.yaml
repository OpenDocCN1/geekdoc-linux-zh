- pgno: 26
  md: '# What other ways can I install Linux?


    ![](img/e2eac216eed4c6806c742998f1420a0c_26_0.png)


    # KDE Workstation


    Installs the KDE desktop environment. KDE is an alternative to the GNOME desktop
    environment that is shown throughout this book.


    # Server


    Sets up your computer as a server on a network. A server is the control center
    of a network.


    # Custom


    Gives you complete flexibility when installing Linux. For example, you can choose
    exactly what software you want to install.


    # Upgrade


    Allows you to install the newest version of Linux without erasing existing Linux
    data on your computer.


    ![](img/e2eac216eed4c6806c742998f1420a0c_26_1.png)


    # Welcome to Red Hat Linux


    Welcome! This installation process is outlined in the Red Hat Linux Guide available
    from Red Hat. Please read the entire manual before you begin the installation
    process.


    HTML and PostScript copies of the manual are online, at http://www.redhat.com.


    ![](img/e2eac216eed4c6806c742998f1420a0c_26_2.png)


    # Install Path


    How do you want to install Red Hat Linux? A full installation will destroy any
    previously saved information on the partitions you choose to install.


    An upgrade will preserve Red Hat Linux system data. If you want to perform a full
    installation, choose the class of installation. Your options are: Custom, GNOME
    Workstation, or Server.


    ![](img/e2eac216eed4c6806c742998f1420a0c_26_3.png)


    The Welcome to Red Hat Linux message appears.


    Click Next to continue.


    You can click Back at any time to return to a previous step and change your answers.


    Linux asks what installation you want to perform.


    Click GNOME Workstation to install an easy-to-use, graphical desktop environment
    for Linux ( ).


    # CONTINUED'
  merge: -1
  img_proc: true
