- pgno: 231
  md: '# USING UPDATE AGENT


    You can use Update Agent to obtain new and updated packages on the Internet. Update
    Agent helps you download and install the packages on your computer.


    Update Agent allows you to obtain packages that contain new programs for Linux
    and updates to Linux features.


    ![](img/e2eac216eed4c6806c742998f1420a0c_231_0.png)


    # USING UPDATE AGENT


    ![](img/e2eac216eed4c6806c742998f1420a0c_231_1.png)


    # START UPDATE AGENT


    +   1 Connect to the Internet. To connect to the Internet, see page 250.

    2 Click to display the Main Menu.


    +   3 Click System.

    4 Click Update Agent.


    > Note: If you are logged on to your computer as a regular user, a window appears,
    asking for the password for the root account. Type the password and then press
    Enter key.


    +   The Red Hat Update Agent window appears.


    # SET UP UPDATE AGENT


    Before you can obtain new and updated packages on the Internet, you need to set
    up Update Agent. You only need to set up Update Agent once.


    +   1 Configure to set up Update Agent.'
  merge: -1
  img_proc: true
- pgno: 232
  md: '# What do I need to do before using Update Agent?


    Before you can use Update Agent, you must register your copy of Red Hat Linux
    at the www.redhat.com/now Web page. When you register, you specify a user name
    and password that you will need to set up Update Agent.


    ![](img/e2eac216eed4c6806c742998f1420a0c_232_0.png)


    ![](img/e2eac216eed4c6806c742998f1420a0c_232_1.png)


    ![](img/e2eac216eed4c6806c742998f1420a0c_232_2.png)


    ![](img/e2eac216eed4c6806c742998f1420a0c_232_3.png)


    +   The Configuration dialog box appears.


    +   Click this area and type the password you specified when you registered your
    copy of Linux.


    Note: For more information, see the top of this page.


    +   Click the Retrieval tab.


    +   Click this option to have Linux automatically install packages after you download
    them from the Internet [ ]


    +   Click OK to confirm your changes.


    +   Click this area and type the user name when you registered your copy of Linux.'
  merge: -1
  img_proc: true
- pgno: 233
  md: '# USING UPDATE AGENT


    Update Agent compares the packages on your computer to the packages available
    on the Internet and then displays a list of packages that you may want to download
    and install.


    ![](img/e2eac216eed4c6806c742998f1420a0c_233_0.png)


    # USING UPDATE AGENT (CONTINUED)


    ![](img/e2eac216eed4c6806c742998f1420a0c_233_1.png)


    # DOWNLOAD AND INSTALL PACKAGES


    +   1 Connect to have Update Agent compare the packages on your computer to the
    packages available on the Internet.


    +   This area indicates the status of the task Update Agent is currently performing
    and a brief description of the task.


    +   A warning dialog box appears. This area displays a list of packages that Update
    Agent will not update. Update Agent will not update packages that begin with "kernel".
    The kernel is the central part of the Linux operating system.


    +   Click OK to continue. Update Agent now determines which packages you can update.
    This may take a few minutes.'
  merge: -1
  img_proc: true
- pgno: 234
  md: '# WORK WITH HARDWARE AND SOFTWARE


    What types of packages can I obtain using Update Agent?


    ![](img/e2eac216eed4c6806c742998f1420a0c_234_0.png)


    ### Security Advisories

    nYou can obtain packages that can improve the security of Linux. These packages
    can help prevent unauthorized users from accessing information on your computer.


    ### Bug Fixes

    You can obtain packages that can fix errors that prevent working properly.


    ### Package Enhancements

    You can obtain packages that can update Linux features and add new capabilities
    to Linux.


    ![](img/e2eac216eed4c6806c742998f1420a0c_234_1.png)


    +   - A Web page appears, displaying the name and a description of each package
    you can update.

    - Click the box ( ) each package you want to update ( ) changes to.


    +   - When you finish selecting packages, click Request selected packages at the
    bottom of the Web page.

    - Note: A warning box may appear. Click Continue to continue.


    +   - Update Agent downloads the packages to your computer. It may take a few
    minutes.

    - Note: A dialog box may appear, asking you if you want to close a window. Click
    OK to close the dialog box.


    +   - This area displays the packages you selected. When a package has been successfully
    downloaded and installed, a check mark (✓) appears beside the package.

    - Click Quit to close the Red Update Agent window.'
  merge: -1
  img_proc: true
