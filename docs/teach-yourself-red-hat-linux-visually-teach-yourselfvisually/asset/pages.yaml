- pgno: 175
  md: '# # CREATE A NEW USER ACCOUNT


    If you share your computer with family members or colleagues, you can create a
    user account for each person so they can have their own personalized settings.


    ![](img/e2eac216eed4c6806c742998f1420a0c_175_0.png)


    You may have created user accounts when installed Linux.

    You can only create a new user account if you are logged on to your computer as
    root. If you are logged on as a regular user, you cannot create a new user account.


    # CREATE A NEW USER ACCOUNT


    ![](img/e2eac216eed4c6806c742998f1420a0c_175_1.png)


    +   1 Click to display the Main Menu.

    2 Click System.

    3 Click LinuxConf.

    4 The gnome-linuxconf window appears.

    5 Click User accounts.


    Note: A welcome message appears the first time you start LinuxConf. Click Quit
    to close the message.


    If User accounts is not displayed, click the sign (+) beside Normal changes to
    (-).


    164'
  merge: -1
  img_proc: true
- pgno: 176
  md: '# WORK WITH ACCOUNTS


    I need to create a user account if I am the only person using my computer?


    If you did not create a user account for yourself when you installed Linux, you
    should create a user account for performing daily tasks. The root account should
    only be used to perform administrative and maintenance tasks, since you can damage
    the computer using the root account. The root account was automatically created
    when you installed Linux.


    ![](img/e2eac216eed4c6806c742998f1420a0c_176_0.png)


    ![](img/e2eac216eed4c6806c742998f1420a0c_176_1.png)


    This area displays the user accounts currently set up on your computer. If you
    set up user accounts when you installed Linux, the accounts will appear in the
    list.


    Note: Linux comes with user accounts to operate certain features, such as printing
    (lp). You cannot use these accounts to log on to your computer.


    +   Click Add to a new user account.


    +   The user account creation tab appears.


    +   Click this area and type the full name of the person who will use the account.


    +   Click Accept to create the user account.


    CONTINUED


    165'
  merge: -1
  img_proc: true
