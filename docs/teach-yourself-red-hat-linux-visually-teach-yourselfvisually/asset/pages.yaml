- pgno: 239
  md: '# PARTS OF THE KDE SCREEN


    The KDE screen displays various items. The items that appear depend on the KDE
    packages installed and the account you used to log on to your computer.


    # AUTOSTART


    Allows you to have programs start automatically each time you start KDE.


    ![](img/e2eac216eed4c6806c742998f1420a0c_239_0.png)


    Displays a button for each open window.


    # CDROM


    Allows you to display the contents of a CD-ROM disc.


    # PRINTER


    Allows you to print files.


    # FLOOPPY


    Allows you to display the contents of a floppy disc.


    # TEMPLATES


    Allows you to create shortcuts to items such as programs.


    # HELP WEB PAGES


    Allows you to quickly display web pages that offer help using Linux.


    # TRASH


    Stores files you have deleted.


    # KDE PANEL


    +   * Application Starter

    Gives you quick access to programs.

    * Window List

    Allows you to display a list of all open windows.

    * Home Directory

    Allows you to display the contents of the directory that stores your personal
    files.

    * KDE Control Center

    Allows you to view and change KDE settings.

    * KDE Help

    Provides help on using KDE.

    * Terminal

    Allows you to display the Konsole window where you can type Linux commands.

    * Logout

    Allows you to log out of KDE.

    * Lock Screen

    Allows you to secure your computer while you are away from your desk.

    * Virtual Desktops

    Allows you to switch between different desktops.

    * Clock

    Displays the current time and date.'
  merge: -1
  img_proc: true
