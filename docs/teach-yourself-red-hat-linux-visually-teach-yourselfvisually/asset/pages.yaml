- pgno: 302
  md: '# Where can I find information about a newsgroup?


    You can read the FAQ (Frequently Asked Questions) for a newsgroup to learn about
    it. A FAQ is a message in a newsgroup that contains a list of questions and answers
    that regularly appear in the newsgroup. A FAQ is designed to prevent readers from
    asking questions that have been answered. The news.answers newsgroup provides
    FAQs for a wide variety of newsgroups.


    ![](img/e2eac216eed4c6806c742998f1420a0c_302_0.png)


