- pgno: 15
  md: '# PREPARE TO INSTALL LINUX


    Before you can install Linux on your computer, you need to use FDISK to delete
    all existing partitions on your computer.


    ![](img/e2eac216eed4c6806c742998f1420a0c_15_0.png)


    A Partition is a part of the hard drive that acts as a separate drive. Most hard
    drives have only one partition.


    # PREPARE TO INSTALL LINUX


    +   Microsoft Windows 98 Startup Menu:

    1. Start computer with CD-ROM support.

    2. View the Help file.


    Enter a choice [ ] Time remaining: 12


    ![](img/e2eac216eed4c6806c742998f1420a0c_15_1.png)


    Preparing to start your computer...

    This may take a few minutes. Please wait...

    The diagnostic tools were successfully loaded to drive D:

    To get help, type HELP and press ENTER.


    ![](img/e2eac216eed4c6806c742998f1420a0c_15_2.png)


    > Your computer has a disk larger than 32 GB. This version of Windows does not
    support large disks, resulting in a loss of disk space on large drives, and slowing
    disks over 2 GB to be slow.


    IMPORTANT: To enable large disk support and create any new drive systems, including
    some versions of Windows 95 and Windows NT, go as far as partitions and use FDISK.
    Disk utilities that were not designed explicitly for the FAT32 file system will
    not be able to work correctly. Other disk utilities, do not enable large disk
    support


    Do you wish to enable large disk support (Y/N) [ ] Y


    # START FDISK


    +   1 Insert the Windows 98 startup floppy disk into your floppy drive.

    2 Turn on your computer.

    3 Microsoft Windows 98 Startup Menu appears.


    +   3 [2] to start the computer without access to the CD-ROM drive and then press
    the [Enter] key.


    +   4 Type fdisk and then press the [Enter] key.


    +   5 A message appears, asking if you want to enable large disk support, which
    allows you to work with partitions larger than 2 GB.


    +   5 To enable large disk support, press [Y] (for Yes) and then press the [Enter]
    key.'
  merge: -1
  img_proc: true
- pgno: 16
  md: '# What should I do before preparing to install Linux?


    +   - You should back up the information on your computer. Deleting partitions
    will permanently remove all the information on your computer.

    - Obtain a Windows 98 startup floppy disk. If you do not have a Windows 98 startup
    floppy disk, you can create a startup disk using any Windows 98 computer.

    - Make sure your computer will start from the floppy drive when you turn on your
    computer. If your computer does not start from the floppy drive, consult your
    computer''s manual to determine how to change the BIOS settings.


    ![](img/e2eac216eed4c6806c742998f1420a0c_16_0.png)


    ![](img/e2eac216eed4c6806c742998f1420a0c_16_1.png)


    VIEW PARTITION INFORMATION

    This area displays a list of FDISK options that you can choose from.


    Press 4 to display information about the partitions on your hard drive and then
    press the Enter key.


    This area displays each partition on your hard drive.

    This area displays the total amount of space on the hard drive.


    Press the Esc key to return to the list of FDISK options.'
  merge: -1
  img_proc: true
- pgno: 17
  md: '# PREPARE TO INSTALL LINUX


    You must delete all the partitions on your computer before you can install Linux.

    Deleting the partitions will permanently erase all the information on your computer.


    ![](img/e2eac216eed4c6806c742998f1420a0c_17_0.png)


    # PREPARE TO INSTALL LINUX (CONTINUED)


    FDISK Options

    Current fixed disk drive: 1

    Choose one of the following:

    1. Create DOS partition or Logical DOS Drive

    2. Set size

    3. Delete partition or Logical DOS Drive

    4. Display partition information


    Enter choice: [1]


    Press Esc to exit FDISK


    Delete DOS Partition or Logical DOS Drive

    Current fixed disk drive: 1

    Choose one of the following:

    1. Delete Primary DOS Partition

    2. Delete size

    3. Delete Logical DOS Drive(s) in the Extended DOS Partition

    4. Delete Non-DOS Partition


    Enter choice: [1]


    Press Esc to return to FDISK Options


    # DELETE A PARTITION


    This area displays a list of FDISK options that you can choose from.


    Press 3 to delete a partition and then press the Enter key.


    This area displays the types of partitions that you can delete.


