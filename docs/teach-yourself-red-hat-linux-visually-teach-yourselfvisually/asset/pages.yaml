- pgno: 188
  md: '# WORK WITH FLOPPY

    AND CD-ROM DRIVES


    # Why can''t I save the changes I made

    to a file on a floppy disk?


    You may not have permission to make

    changes to the file. To change the file,

    perform one of the following tasks:


    +   - Log on to your computer using the

    root account as shown on page 172.

    The root account can always make

    changes to the files on a floppy disk.

    - Change the permissions for the

    file as shown on page 74.

    You must be logged on to your computer

    using the root account to change

    the permissions for the file.


    ![](img/e2eac216eed4c6806c742998f1420a0c_188_0.png)


    ![](img/e2eac216eed4c6806c742998f1420a0c_188_1.png)


    To open a file,

    double-click the file. For more information

    on opening files, see

    page 62.


    When you finish

    reviewing the contents

    of the floppy disk,

    click X to close the

    window.


    # UNMOUNT A LINUX FLOPPY DISK


    Click Unmount device.


    When you finish working

    of a floppy disk, you must

    unmount the disk.


    You may now remove

    the floppy disk from your

    floppy drive.


    Right-click the Floppy

    icon. A menu appears.


    ![](img/e2eac216eed4c6806c742998f1420a0c_188_2.png)'
  merge: -1
  img_proc: true
- pgno: 189
  md: '# SET UP LINUX TO USE MS-DOS FLOPPY DISKS


    If you want to use floppy disks that contain files created in MS-DOS or Windows,
    you must set up Linux to use MS-DOS floppy disks.


    ![](img/e2eac216eed4c6806c742998f1420a0c_189_0.png)


    You can only set up Linux to use MS-DOS floppy disks if you are logged on your
    computer as root. If you are logged on as a regular user, you cannot set up Linux
    to use MS-DOS floppy disks.


    # SET UP LINUX TO USE MS-DOS FLOPPY DISKS


    ![](img/e2eac216eed4c6806c742998f1420a0c_189_1.png)


    +   1 Click to display the Main Menu.

    2 Click System.

    3 Click LinuxConf.


    +   4 The gnome-linuxconf window appears.

    Note: A welcome message appears the first time you start LinuxConf. Click Quit
    to close the message.


    +   4 Access local drive.

    5 Click Add to provide information that will allow Linux to use MS-DOS floppy
    disks.'
  merge: -1
  img_proc: true
- pgno: 190
  md: '# WORK WITH FLOPPY AND CD-ROM DRIVES


