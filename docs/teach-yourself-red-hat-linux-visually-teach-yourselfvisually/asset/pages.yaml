- pgno: 178
  md: '# What password should I use?


    You should follow these guidelines when choosing a password.


    ![](img/e2eac216eed4c6806c742998f1420a0c_178_0.png)


    A password should contain between 6 and 8 characters.


    ![](img/e2eac216eed4c6806c742998f1420a0c_178_1.png)


    A password should contain a mixture of letters and numbers.


    ![](img/e2eac216eed4c6806c742998f1420a0c_178_2.png)


    A password should not be a word in the dictionary.


    ![](img/e2eac216eed4c6806c742998f1420a0c_178_3.png)


    A password should not contain repeated characters, such as aaabbbb.


    ![](img/e2eac216eed4c6806c742998f1420a0c_178_4.png)


    ![](img/e2eac216eed4c6806c742998f1420a0c_178_5.png)


    +   12 The new user appears in the list of user accounts.

    13 Click Quit.


    +   14 Click to close the gnome-linuxconf window.


    +   The Status of the system tab may appear, stating that your computer is not
    up to date.


    +   15 Linux adds the user account to your computer.


    +   15 Click Activate the changes to update your computer.'
  merge: -1
  img_proc: true
