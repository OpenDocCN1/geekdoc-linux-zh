- pgno: 298
  md: '# What is a news server?


    A news server is a computer that stores newsgroup messages. News servers are usually
    maintained by Internet service providers.


    When setting up newsgroups, you must specify the address of the news server you
    want to use. If you do not know the address, contact your Internet service provider.
    If you want to access newsgroups that can help you use Linux, you can specify
    the news.redhat.com address to use the Red Hat server.


    ![](img/e2eac216eed4c6806c742998f1420a0c_298_0.png)


