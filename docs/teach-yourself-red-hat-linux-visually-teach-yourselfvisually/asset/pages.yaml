- pgno: 20
  md: '# What size should I use for a partition that will store Windows?


    Before determining the size for a partition that will store Windows, consider
    the following:


    +   * The total amount of hard drive space on your computer.

    * The amount of hard drive space required to install Windows 98 and Linux. Windows
    98 requires about 260 MB of hard drive space. Linux requires about 600 MB of hard
    drive space.

    * How often will you use Windows 98 compared to Linux. If you use Windows 98 more
    often than Linux, devote more hard drive space to the Windows Partition.


    ![](img/e2eac216eed4c6806c742998f1420a0c_20_0.png)


