- pgno: 215
  md: '# SET UP A SOUND CARD


    You can set up a sound card for your computer. A sound card is a device that allows
    a computer to play and record sound.


    ![](img/e2eac216eed4c6806c742998f1420a0c_215_0.png)


    # SET UP A SOUND CARD


    ```

    Red Hat Linux release 6.2 (Carman)

    Kernel 2.4.x-72.x86

    slocalhost login: root

    Last login: Thu Nov 11 10:33:51 on tty1

    [root@localhost ~]#

    ```


    ![](img/e2eac216eed4c6806c742998f1420a0c_215_1.png)


    +   1 Perform steps 1 to 3 on page 233 to display the command line using a full
    screen. You must log in using the root account.


    +   2 Type sndconfig and then press the Enter key to start the program that allows
    you to set up your sound card.


    +   - The Introduction appears, stating that the program will determine information
    about your sound card.


    +   3 Press the Enter key to continue.


    ![](img/e2eac216eed4c6806c742998f1420a0c_215_2.png)'
  merge: -1
  img_proc: true
- pgno: 216
  md: '# WORK WITH HARDWARE AND SOFTWARE


    What will setting up a sound card allow me to do?


    ![](img/e2eac216eed4c6806c742998f1420a0c_216_0.png)


    ![](img/e2eac216eed4c6806c742998f1420a0c_216_1.png)


    ![](img/e2eac216eed4c6806c742998f1420a0c_216_2.png)


    # Play Music CDs


    A sound card allows you to play music CDs on your computer while you work. To
    play a music CD, see page 192.


    # Play Sounds for Events


    A sound card allows you to hear sounds for certain events, such as when an error
    message appears. To play sounds for events, see page 134.


    # Play Sounds in Games


    A sound card allows you to hear music and sound effects while playing games.


    ![](img/e2eac216eed4c6806c742998f1420a0c_216_3.png)


    ![](img/e2eac216eed4c6806c742998f1420a0c_216_4.png)


    +   - The Probe Results appears.


    +   - This area displays information about your sound card.


    +   - Press the Enter key to continue.


    +   - The File Exists screen appears, stating that a new file will be created
    to store the sound card settings.


    +   - Press the Enter key to continue.


    CONTINUED


    205'
  merge: -1
  img_proc: true
- pgno: 217
  md: '# SET UP A SOUND CARD


    When setting up your sound card, you will need to test the sound card to make
    sure the card is set up correctly.


    ![](img/e2eac216eed4c6806c742998f1420a0c_217_0.png)


    Before testing your sound card, make sure your speakers are plugged into your
    computer and the speaker volume is tuned up.


    # SET UP A SOUND CARD (CONTINUED)


    ![](img/e2eac216eed4c6806c742998f1420a0c_217_1.png)


    ![](img/e2eac216eed4c6806c742998f1420a0c_217_2.png)


    +   - The Sound Card Test screen appears, stating that a sound sample will be
    played to determine if your sound card is set up correctly.


    +   - Press the Enter key to continue.


    +   - If you heard the sound, the Test Result screen appears, press the Enter
    key.'
  merge: -1
  img_proc: true
- pgno: 218
  md: '# WORK WITH HARDWARE AND SOFTWARE


    # What devices can I plug into a sound card?


    You can see the edge of a sound card at the back of a computer. A sound card has
    a port and several jacks where you can plug in devices.


    ![](img/e2eac216eed4c6806c742998f1420a0c_218_0.png)


    # Spk Out


    Allows you to connect speakers or headphones to hear sound.


    # Game Port


    Allows you to connect a joystick or other device used to play games.


    # Mic In


    Allows you to connect a microphone to record sound.


    # Line In


    Allows you to connect a cassette player, radio or CD player to play or record
    music.


    # Line Out


    Allows you to connect an amplifier to play sound through your home store.


    ![](img/e2eac216eed4c6806c742998f1420a0c_218_1.png)


    +   - The Sound Card Test screen appears, stating that a MIDI sound file will
    be played to determine if your card will properly play MIDI files.


    +   - Note: MIDI files usually contain instrumental music and are more complicated
    than sounds than the sample you tested in step 6


    +   - Press the Enter key to continue.


    +   - The Test Result screen appears.


    +   - If you heard the sound, press the Enter key.


    +   - To return to your desktop, press and hold down Ctrl+Alt keys as you press
    the F7 key.


    +   - The sound card is now set up on your computer.'
  merge: -1
  img_proc: true
- pgno: 219
  md: '# SET UP A NETWORK CARD


    You can set up a network card on your computer. A network card allows you to exchange
    information with other computers on a network.


    ![](img/e2eac216eed4c6806c742998f1420a0c_219_0.png)


    You may have already set up your network card when you installed Linux. You can
    only set up a network card if you are logged on to your computer as *root*. If
    you are logged in as a user, you cannot set up a network card.


    # SET UP A NETWORK CARD


    ![](img/e2eac216eed4c6806c742998f1420a0c_219_1.png)


