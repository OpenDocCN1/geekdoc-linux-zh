- pgno: 250
  md: '# USING THE COMMAND LINE


    ![](img/e2eac216eed4c6806c742998f1420a0c_250_0.png)


    ![](img/e2eac216eed4c6806c742998f1420a0c_250_1.png)


    # RMDIR


    Deletes a directory. You must delete all the files in a directory before you can
    delete the directory.


    +   - **rmdir** followed by the location and name of the directory you want to
    delete. Then press the **Enter** key.


    # SHUTDOWN


    Shuts down or restarts your computer.


    +   - To shut down your computer, type **shutdown -h now** and then press the
    **Enter** key.

    - To restart your computer, type **shutdown -r now** and then press the **Enter**
    key.


    > Note: If you are logged on as a regular user, Linux will ask you to type your
    password. Type password and then press **Enter** key.


    ![](img/e2eac216eed4c6806c742998f1420a0c_250_2.png)


    # TAR


    Extracts files from an archive so you can work with the files. An archive is a
    group of files that are stored as a single file to save space. The tar command
    extracts files from archives with .tar extension and is often used using the gunzip
    command.


    +   - type **tar -xf** and then type the location and name of the archive file
    you want to extract files. Then press the **Enter** key.


    ![](img/e2eac216eed4c6806c742998f1420a0c_250_3.png)


    ```

    root    tty1  Nov 16:38

    smith   tty2  Nov 16:45

    root@localhost /root# _

    ```


    # WHO


    Displays a list of users who are logged on to the computer at the command line.


    +   - type **who** and then press the **Enter** key.


    > Note: You can use who am to determine which account you are logged in as.


    ![](img/e2eac216eed4c6806c742998f1420a0c_250_4.png)


    # 239'
  merge: -1
  img_proc: true
