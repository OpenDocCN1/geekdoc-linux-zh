- pgno: 76
  md: '# WORK WITH FILES


    Can I rename a directory?

    Yes. To rename a directory, perform the steps below, except right-click the directory
    you want to rename in step 1. You should only rename directories that you have
    created.


    ![](img/e2eac216eed4c6806c742998f1420a0c_76_0.png)


    ![](img/e2eac216eed4c6806c742998f1420a0c_76_1.png)


    +   4 Type a new name for the file.


    +   5 Click OK to confirm your change.


    +   The file displays the new name.'
  merge: -1
