  md: '# CHANGE THE DATE AND TIME


    You can change the date and time displayed on your screen. Linux uses the date
    and time to determine when you create and update your files.


    ![](img/e2eac216eed4c6806c742998f1420a0c_143_0.png)


    You can only change the date and time if you are logged on as root; if you are
    a regular user, you cannot change the date and time.


