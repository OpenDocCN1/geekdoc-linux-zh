    +   1 Right-click the file whose properties you want to display.


    +   2 Click Properties.

    The Properties dialog box appears.


    +   This area displays the location and name of the file.


    +   This area displays the file was created, last changed and opened last.


    +   This area displays the type and size of the file.


    +   3 When finishing review the information, click OK to close the dialog box.'
  merge: -1
  img_proc: true
- pgno: 67
