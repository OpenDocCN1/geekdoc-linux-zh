- pgno: 237
  md: '# START KDE


    KDE (K Desktop Environment) is a graphical desktop environment that you can use
    with Linux.


    ![](img/e2eac216eed4c6806c742998f1420a0c_237_0.png)


    KDE is an alternative to the GNOME desktop environment that is shown throughout
    this book. Some people prefer using KDE since it came with earlier versions of
    Linux and is more like the Windows operating system.


    You can find out more about KDE at the www.kde.org site.


    # START KDE


    ![](img/e2eac216eed4c6806c742998f1420a0c_237_1.png)


    ![](img/e2eac216eed4c6806c742998f1420a0c_237_2.png)


    +   When you turn on your computer, a dialog box appears, asking for your user
    name.


    Note: If you have already logged on to your computer, you can display the login
    box by logging out. To log out, see page 172.


    +   To start KDE, Session.


    +   Click KDE.


    Note: If KDE is not available, see the top of page 227.


    +   This area indicates that you have chosen to start KDE.


    +   Type your user name and then press the Enter key.


    226'
  merge: -1
  img_proc: true
- pgno: 238
  md: '# What do I need to do before I can use KDE?


    Before you can use KDE, you need to install the following packages. You can find
    the packages on the CD-ROM disc 1 that came with Linux. To install a package,
    see page 214.


    | REQUIRED PACKAGES | | |

    | kdebase | kdelibs | kdesupport | qt1x |

    | OPTIONAL PACKAGES | | |

    | kdeadmin | Contains utilities for the system administrator. |

    | kdegames | Contains games. |

    | kdegraphics | Contains graphics applications. |

    | kdemultimedia | Contains multimedia applications. |

    | kdenwork | Contains applications for use on a network or on the Internet. |

    | kdtoys | Contains amusing applications for the desktop. |

    | kdeutils | Contains utilities, such as a calculator and text editor. |

    | kdeorganizer | Contains a calendar and scheduling program. |


    ![](img/e2eac216eed4c6806c742998f1420a0c_238_0.png)


    ![](img/e2eac216eed4c6806c742998f1420a0c_238_1.png)


    Type your password and then press the Enter key.


    Note: A symbol (*) appears for each character you type to prevent others from
    seeing the password.


    +   * The KDE desktop appears.'
  merge: -1
