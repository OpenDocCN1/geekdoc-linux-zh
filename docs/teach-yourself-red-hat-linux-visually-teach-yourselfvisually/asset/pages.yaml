- pgno: 226
  md: '# WORK WITH HARDWARE AND SOFTWARE


    Does Linux come with packages that I can install?

    The Red Hat Linux box comes with CD-ROM discs that contain hundreds of packages
    that you can install. Here are some packages you will find on CD-ROM disc 1.


    | Package | Description |

    | --- | --- |

    | apache | Allows your computer to act as a Web server. |

    | cdparanoia | Allows you to record music on your computer from music CDs. |

    | macutils | Provides utilities for working with Macintosh files. |

    | pilot-link | Allows you to transfer files between Linux and a 3Com Palm Pilot
    organizer. |

    | xuzzles | Provides puzzles and toys for Linux. |


    ![](img/e2eac216eed4c6806c742998f1420a0c_226_0.png)


    ![](img/e2eac216eed4c6806c742998f1420a0c_226_1.png)


