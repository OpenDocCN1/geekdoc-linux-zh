    saver will appear, double-click this area. Then type the number of minutes.


    +   5 To specify that a password must be entered to remove the screen saver, click
    this option [X].


    +   6 Click OK.


    +   7 Click [X] to close the Control Center window.


    +   When the screen saver appears, you can move the mouse or press a key on your
    keyboard to remove the screen saver.


    +   8 Type the same password you enter when you start Linux and then press the
    Enter key.


