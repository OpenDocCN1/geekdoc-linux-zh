- pgno: 220
  md: '# What information do I need to set up my network card?


    You will need some or all of the following information from your network administrator.
    The information you need depends on the setup of your network and whether your
    network has a DHCP server. A DHCP server automatically assigns an IP address to
    each computer on a network.


    ![](img/e2eac216eed4c6806c742998f1420a0c_220_0.png)


    | IP address | Primary name + domain | Net device | Kernel mode |

    |---|---|---|---|n| Identifies your computer on the network. | Name of your computer
    and name of domain on the network. | Identifies the type of network card. | Identifies
    the software your computer uses to communicate with the network card.


    Note: To determine the correct software for your network card, consult the Reference
    Guide that came with Linux or visit www.redhat.com Web site.


    ![](img/e2eac216eed4c6806c742998f1420a0c_220_1.png)


    ![](img/e2eac216eed4c6806c742998f1420a0c_220_2.png)


    If your network does not have a DHCP server, click changes (to).


    If your network has a DHCP server, click Dhcp (changes to). . Then skip to step
    8.


    Click the area beside Primary name + domain and type the IP address for your computer.


    CONTINUED'
  merge: -1
  img_proc: true
