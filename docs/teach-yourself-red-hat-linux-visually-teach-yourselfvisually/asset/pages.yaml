- pgno: 61
  md: '# HOW FILES ARE STORED


    # DIRECTORIES


    Directory


    Like folders in a filing cabinet, directories organize the files stored on your
    computer. Each directory usually stores related files.


    Path


    A path specifies the location of a file on your computer. A path is a list of
    directory you must open to access a file, followed by the file name. The directories
    and the file name are separated by slashes (/). For example, to specify the location
    of the income file, you would use the /home/tsmith/income path.


    ![](img/e2eac216eed4c6806c742998f1420a0c_61_0.png)


    Root directory


    The symbol represents the root directory on your computer. All other directories
    are located below this directory.


    # SAVING AND OPENING FILES


    When you save or open files, Linux displays this window.


    ![](img/e2eac216eed4c6806c742998f1420a0c_61_1.png)


    This area shows the location of the displayed directories and files.


    This area shows the directories in the current location. To display the contents
    of a different directory, double-click the directory.


    Note: You can double-click ../ to move up one level in the directory structure.


    This area shows the files in the current location.'
  merge: -1
  img_proc: true
- pgno: 62
  md: '# COMMON DIRECTORIES


    WORK WITH FILES


    You will find the followingfollowing directories on your computer.


    This is the main directory that stores all the directories and files on your computer.


    This directory contains programs that are essential to the operation of Linux.


    dev This directory contains a file for each hardware device used by Linux, such
    as a monitor or printer.


    etc This directory stores files that specify Linux settings, such as the settings
    for your monitor resolution.


    ![](img/e2eac216eed4c6806c742998f1420a0c_62_0.png)


    home This directory contains a directory for each user set up on your computer.
    Each directory stores the personal files and settings for one user.


    lost-found This directory stores damaged or lost files.


    mnt This directory displays the contents of a floppy or CD-ROM drive.


    root This directory stores the personal files and settings for the root account.
    The root account is the administrative account set up when Linux was installed
    on your computer.


    sbin This directory stores programs used for performing administrative tasks in
    Linux.


    usr This directory contains programs and information that people often access,
    such as games and help files.'
  merge: -1
  img_proc: true
- pgno: 63
  md: '# VIEW CONTENTS OF YOUR COMPUTER


    You can use the GNOME File Manager to view the directories and files on your computer.


    ![](img/e2eac216eed4c6806c742998f1420a0c_63_0.png)


    The GNOME File Manager allows you to perform tasks such as moving, deleting and
    sorting files.


    # VIEW CONTENTS OF YOUR COMPUTER


    ![](img/e2eac216eed4c6806c742998f1420a0c_63_1.png)


    +   - Double-click Home directory to display the directories and files on your
    computer.


    +   - A window appears.


    +   - This area displays the organization of the directories on your computer.
    Your home directory that stores your personal files is automatically highlighted.


    +   - To display the contents of another directory, click the directory.'
  merge: -1
  img_proc: true
- pgno: 64
  md: '# What do the icons in the GNOME File Manager represent?


    Each directory and file displays an icon to help you distinguish between the different
    types of items. Common types of items includes:


    ![](img/e2eac216eed4c6806c742998f1420a0c_64_0.png)


    ![](img/e2eac216eed4c6806c742998f1420a0c_64_1.png)


    ![](img/e2eac216eed4c6806c742998f1420a0c_64_2.png)


    +   - A directory displaying a plus sign (\u2593) contains subdirectories.


    +   - Click the plus sign (\u2593) beside the directory to display its subdirectories.


    +   - The subdirectories appear.


    Note: You can click the sign (\u2593) to once again hide the subdirectories to
    \u2593\u2504\u2593


    - The plus sign (\u2593) beside the directory changes to a minus sign (\u2502).
    This indicates that the subdirectories within the directory are displayed.


    +   - When you are reviewing the directories and files on your computer, click
    \u17 to close the window.'
  merge: -1
  img_proc: true
- pgno: 65
  md: '# DISPLAY YOUR HOME DIRECTORY


    You can quickly display the contents of your home directory. Your home directory
    stores your personal files and settings.


    ![](img/e2eac216eed4c6806c742998f1420a0c_65_0.png)


    # DISPLAY YOUR HOME DIRECTORY


    ![](img/e2eac216eed4c6806c742998f1420a0c_65_1.png)


    +   - Click Home to display your home directory.


    +   - This area displays the contents of your home directory.


    +   - If you are logged on your computer as a regular user, your home directory
    is the directory with your user name.


    +   - If you are logged on your computer as root, your home directory is the root
    directory.'
  merge: -1
  img_proc: true
- pgno: 66
  md: '# DISPLAY FILE PROPERTIES

    WORK WITH FILES


    You can display information about a file, such as the size of the file and the
