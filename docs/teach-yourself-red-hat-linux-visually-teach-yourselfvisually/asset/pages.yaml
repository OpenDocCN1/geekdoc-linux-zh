- pgno: 194
  md: '# WORK WITH FLOPPY

    AND CD-ROM DRIVES


    Do I need to mount an MS-DOS floppy every time I use the disk?


    Each time you insert an MS-DOS floppy disk into your floppy drive, you must mount
    the disk. Mounting the disk allows you to access the information stored on the
    disk. Before you remove the disk from your floppy drive, you must mount the disk
    to indicate that you no longer want to access the information on the disk.


    ![](img/e2eac216eed4c6806c742998f1420a0c_194_0.png)


