- pgno: 206
  md: '# How does the CD Player know the title of each song on my CD?


    If you are connected to the Internet, the CD Player can automatically access the
    largest collection of music CD information on the Web. If the CD you are playing
    exists in the collection, the CD Player can display the name of the album, the
    artist and each song on the CD. To connect to the Internet, see page 250.


