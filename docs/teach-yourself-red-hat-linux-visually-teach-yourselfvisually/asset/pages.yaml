    ![](img/e2eac216eed4c6806c742998f1420a0c_228_1.png)


    # Computer Stores


    Many computer stores offer CD-ROM discs containing Linux packages that you can
    install.


    # Internet


    You can obtain packages on the Internet that you can install. For example, you
    can find free packages at www.tucows.com Web site.


