    | Print ASCII test page |

    | Print ASCII directly to port |

    | Edit | Add | Delete | |


    +   1. Perform steps 1 to 4 on page 198 to display the Red Hat Linux Print System
    Manager window.


    +   1. This area displays the printer(s) set up on your computer.


    +   2. Click the printer you want to test.


    +   3. Click Tests.


    +   4. Click Print ASCII test page.'
  merge: -1
  img_proc: true
