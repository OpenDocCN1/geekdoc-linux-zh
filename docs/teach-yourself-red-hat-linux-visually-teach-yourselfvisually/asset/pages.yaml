    ![](img/e2eac216eed4c6806c742998f1420a0c_143_1.png)


    This area displays the date and time.


    +   1 Click to display the Main Menu.

    2 Click System.


    +   3 Click LinuxConf.

    4 The gnome-linuxconf window appears.


    Note: A welcome message appears the first time you start LinuxConf. Quit to close
    the message.


    +   4 Click date & time.

    5 To change the time, double-click the part of the time you want to change. Type
    the correct information.


    Note: You must enter the date in the 24-hour format. For example, 14 for 2 p.m.


    +   6 To change the date, double-click the part of the date you want to change.
    Type the correct information.'
  merge: -1
  img_proc: true
