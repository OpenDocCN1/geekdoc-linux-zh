- pgno: 202
  md: '# What type of information can I find on a CD-ROM disc?


    ![](img/e2eac216eed4c6806c742998f1420a0c_202_0.png)


    # Programs


    CD-ROM discs can store programs that you can install on your computer.


    # Multimedia Files


    CD-ROM discs can store pictures, sounds and videos that you can use in documents
    you create.


    ![](img/e2eac216eed4c6806c742998f1420a0c_202_1.png)


    +   - When you finish viewing the contents of the CD-ROM disc, click X to close
    the window.


    You can double-click the CD-ROM icon to redisploy the contents of the CD-ROM disc
    at any time.

    Note: The CD-ROM icon may, appear behind the GNOME Panel. To hide the GNOME Panel
    you can view the icon, see page 117.


    +   - Click Eject device.

    Your computer ejects the CD-ROM disc from the CD-ROM drive.


    When you finish working with a CD-ROM disc, you can eject the disc to remove it
    from the CD-ROM drive.

    Right-click the CD-ROM icon. A menu appears.'
  merge: -1
  img_proc: true
- pgno: 203
  md: '# PLAY A MUSIC CD


    You can use your computer to play music CDs while you work.


    ![](img/e2eac216eed4c6806c742998f1420a0c_203_0.png)


    You need a CD-ROM drive, a sound card and speakers to play music CDs. You must
    set up your sound card as shown on page 204 before you can play music CDs.


    # PLAY A MUSIC CD


    ![](img/e2eac216eed4c6806c742998f1420a0c_203_1.png)


    +   - Insert a music CD into your CD-ROM drive.


    +   - This area displays which song is currently playing and the amount of time
    the song has played.


    +   - A window appears and the music CD begins to play.


    +   - STOP PLAY


    +   - Click to stop the play of the CD.


    +   - Click to again play the CD.'
  merge: -1
  img_proc: true
- pgno: 204
  md: '# Can I listen to music privately?


    You can listen to music privately by turning your speakers off and plugging a
    headset into your CD-ROM drive.


    ![](img/e2eac216eed4c6806c742998f1420a0c_204_0.png)


    ![](img/e2eac216eed4c6806c742998f1420a0c_204_1.png)


    ![](img/e2eac216eed4c6806c742998f1420a0c_204_2.png)


    # PAUSE PLAY


