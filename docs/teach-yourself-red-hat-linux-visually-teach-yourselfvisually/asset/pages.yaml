- pgno: 224
  md: '# WORK WITH HARDWARE AND SOFTWARE


    How can I increase the amount of free hard disk space and free memory on my computer?


    ![](img/e2eac216eed4c6806c742998f1420a0c_224_0.png)


    # Hard Disk Space


    To increase the amount of free hard disk space, you can delete files and programs
    you no longer need and move files you rarely use to a medium such as a floppy
    disk.


    ![](img/e2eac216eed4c6806c742998f1420a0c_224_1.png)


    # Memory


    You can increase the amount of free memory by reducing the number of programs
    you have open at the same time or by purchasing more memory.


    ![](img/e2eac216eed4c6806c742998f1420a0c_224_2.png)


    +   The Detailed System Information dialog box appears.

    5 Click the Disk Information tab.

    This area displays the total hard disk space and the amount of free hard disk
    space.

    This area shows the amount of used hard disk space.


    +   6 Click the Memory Information tab.

    This area displays the total, used and free memory on your computer.

    This area shows the amount of memory and virtual memory.

    8 Click to close the System Information dialog box.


    Note: Virtual memory is space on your hard disk acts as memory.'
  merge: -1
  img_proc: true
- pgno: 225
  md: '# INSTALL A PACKAGE


    You can use Gnome RPM to install packages on your computer that will add new capabilities
    to Linux. Packages can contain programs and files.


