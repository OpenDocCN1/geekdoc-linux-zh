    In the left pane it shows **Events** based on the metadata of the pictures. These
    events are very useful in photo management.


    # ## View image in full screen


    To view the image in full screen mode, click the image and then hit the F11 key.
    To exit full screen mode, press F11 once more.


    # ## Image Manipulation'
  merge: -1
