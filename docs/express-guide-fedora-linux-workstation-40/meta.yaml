    ## Manage Users\nAs Linux is a multi-user operating system, it allows multiple\
    \ users to access the same system. You can create a separate user account for\
    \ each user of the computer so that every user can keep his or her data separate\
    \ and safe. This provides privacy to all users. Users can also personalize the\
    \ desktop according to their taste.\n\n### What exactly is a user?\nA **user**\
    \ is anyone who uses a computer. Linux assigns a unique user id to every user\
    \ that exists on the system, which is known as the UID or User ID. This UID is\
    \ for the system's internal use only.\n\n### Standard vs Administrator\nThe administrator\
    \ is a special user who has complete access to the operating system and its configuration.\
    \ The administrator user is intended for administrative use only. In traditional\
    \ Unix systems, there is a root user for doing administrative tasks, but in the\
    \ case of modern Linux systems, there is an option to give administrator rights\
    \ to any user. You can also fine-tune the users' rights at a granular level. The\
    \ Administrator user has unlimited privileges. An administrator can access any\
    \ file, run any program, execute any system call, and modify any setting. Unlike\
    \ standard users, administrators can access the files and folders of other users\
    \ as well. During the installation, the system creates an administrator user.\
    \ When you create a new user, you have the option to select either standard or\
    \ administrator as the user account type.\n\n### Add User\nTo create user:\n1.\
    \ From the system menu, press **Settings**.\n2. In the Settings window, select\
    \ System on the left and Users on the right.\n3. Press **Unlock**. Enter your\
    \ password and click **Authenticate**. ![](img/f23a8e45379315d1673be3d803b2f54c_114_0.png)\n\
    4. Press **Add User**. ![](img/f23a8e45379315d1673be3d803b2f54c_114_1.png)\n5.\
    \ In the **Add User** dialog box do the following:\n   1. Enter the user's **Full\
    \ name**.\n   2. If necessary, change the system-generated login.\n   3. Select\
    \ **Standard** or **Administrator** as the user type.\n   4. You can either set\
    \ a password now or enable a user to set one on their first login.\n   5. Press\
    \ **Add**.\n\n![](img/f23a8e45379315d1673be3d803b2f54c_115_0.png)\nYou can find\
    \ the recently created user under other users.\n\n### Test new user\nTo test this\
    \ user, go to the System menu, select **Power off/Log out**, and then press **Log\
    \ Out**. At the login screen, select the user and provide a password. Press the\
    \ ENTER key. Enter the new password and press the ENTER key if you selected **Allow\
    \ user to set a password when they login the next time**. Enter the same password\
    \ again, then press the ENTER key. After login, proceed with the post-installation\
    \ steps.\n\n### Modify user\nTo change the properties of any user, you have to\
    \ use an administrator user account like the one we created at the time of installation.\n\
    ![](img/f23a8e45379315d1673be3d803b2f54c_116_0.png)\n- To modify any user's settings,\
    \ first unlock them, then press the **Unlock** button. Enter your password and\
    \ click **Authenticate**.\n- Select the user from the list of users.\n- Press\
    \ pencil icon to modify the full name.\n\n![](img/f23a8e45379315d1673be3d803b2f54c_117_0.png)\n\
    - **Password:** To change the user's password and password settings, click the\
    \ greater than sign (>).\n- **Automatic Login:** When the system boots, make the\
    \ user account login automatically without prompting for a password.\n- The **Administrator**\
    \ slide button lets you modify your account type from Standard to Administrator\
    \ and vice versa.\n- To change the **language** for the user, press the greater\
    \ than (>) sign.\n\n### Remove user\nIf you find that a user account is no longer\
    \ needed, you can easily delete the user.\n1. Go to Settings and select Users.\n\
    2. Press **Unlock**.\n3. Select the user for deletion.\n4. Press the **Remove\
    \ User** button.\n5. In the confirmation dialog box, slide the button to delete\
    \ or keep the user's files.\n6. Click the Remove option to delete the user.\n\n\
