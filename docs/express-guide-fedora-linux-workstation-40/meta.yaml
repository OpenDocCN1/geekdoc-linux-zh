  merge: -1
  pgno: 36
- img_proc: true
  md: '# # Lock


    When you are not using your computer for a short amount of time, it is best to
    lock the screen so that no one else may use it. All running applications will
    continue to operate when the system screen is locked. To re-log in, enter your
    login password to unlock the screen. If you leave your computer for an extended
    period of time, the system will automatically lock the screen.


    To manually lock the screen, go to the system menu on the right side of the top
    bar and click the pad lock icon. You can also use the Super + L keyboard shortcut
    to lock. To unlock, enter your password and press the ENTER key on the locked
    screen.


    # # Suspend


    In the case of laptops, Fedora switches the system to suspend mode when the lid
    is closed. To preserve energy, the system utilises very little power when in suspended
    mode. All of your apps continue to operate in suspend mode, but the screen and
    other non-essential components of the computer turn off to save power.


    To manually switch the system to suspend mode, open the system menu on the right
    side of the top bar, click the power button to open the collapsed menu, and then
    select the **Suspend** option.


    # # Power off / Restart'
  merge: -1
  pgno: 37
- img_proc: true
  md: '![](img/f23a8e45379315d1673be3d803b2f54c_38_0.png)


    To turn off or restart your computer, click the system menu on the right side
    of the top bar, then click the power button to open a collapsed menu, and then
    select the **Power Off** or **Restart** option. A dialogue box will appear; click
    the appropriate button.'
  merge: -1
