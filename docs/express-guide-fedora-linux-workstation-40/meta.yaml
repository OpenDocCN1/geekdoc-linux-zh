- img_proc: true
  md: '# # Desktop components description


    This section focuses on the key elements that form Fedora''s desktop interface,
    emphasizing its essential components and their significance in improving usability
    and productivity.


    ![](img/f23a8e45379315d1673be3d803b2f54c_29_0.png)


    # ## TOP BAR


    The top bar has three main sections.


    +   - System Menu

    - Clock

    - Activities


    # ## System Menu


    ![](img/f23a8e45379315d1673be3d803b2f54c_29_1.png)


    The right corner of the bar has power, speaker network, battery and Bluetooth
    icons. Click on any of these icons to open the **System menu**. The system menu
    allows you to adjust speaker and microphone volume. This menu also gives you the
    option to adjust network and Bluetooth settings. You will find quick links for
    system settings, lock screen, and shutdown menu.'
  merge: -1
  pgno: 29
- img_proc: true
  md: '# **Clock**


    ![](img/f23a8e45379315d1673be3d803b2f54c_30_0.png)


    In the centre of the bar there is a clock, and by default it shows the day of
    the week and current time in 24-hour format. If you want, you can change the time
    format in the system settings. Click the clock to open a dialogue box with the
    calendar on the right side and any task notifications on the left side. It also
    includes a Do Not Disturb sliding button for ignoring notifications when you''re
    busy.


    # **Activities**


    On the left side of the top bar is the **Activities** button. In Fedora''s desktop
    design, the Activities button acts as a primary point of navigation, making workspace
    management and multitasking more effective. Clicking on the Activities button
    or pressing the Super key (also known as the Windows key) on your keyboard opens
    the Activities Overview, offering a comprehensive view of open applications, virtual
    desktops, and favorite applications.'
  merge: -1
  pgno: 30
- img_proc: true
  md: '![](img/f23a8e45379315d1673be3d803b2f54c_31_0.png)


    # # Activities overview elements


    # ## Search Bar


    One of the main items of the Activities overview screen is the search bar. Search
    for applications, documents, settings, calendar events, etc. on your computer.
    For example, if you write "calculator" in the search bar, it will show you a calculator
    application.


    ![](img/f23a8e45379315d1673be3d803b2f54c_31_1.png)


    Click the icon to open the calculator application.'
  merge: -1
  pgno: 31
- img_proc: true
  md: '# **Windows Peak View (Windows List)**


