    you to create graphical user interfaces (GUIs) as well as applications and widgets.
    It supports both free and proprietary software. It is among the most popular toolkits
    for the Wayland and X11 windowing systems.


    # **GNOME applications**: On the GNOME desktop, GNOME Core programs handle routine
    tasks. Usually, your GNOME system comes with them pre-installed. Here is a list
    of common applications:


    +   - Files: The default file manager for GNOME.

    - Terminal: Terminal emulator.

    - Settings: Control panel for system settings.

    - Calendar, Contacts, and To Do

    - Music

    - Videos


    # **GNOME Session Manager**: GNOME Session Manager manages the login and session
