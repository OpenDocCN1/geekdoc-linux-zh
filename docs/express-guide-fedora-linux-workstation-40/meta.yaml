    仪表栏右侧有一个网格图标。点击该图标后，会显示所有应用程序的列表。图标按网格形式排列。程序列表可能包含多页；要翻到下一页，可使用鼠标的滚轮（中键）或点击网格底部的圆点。应用程序文件夹包含网格中的部分应用。点击应用程序文件夹即可查看其中包含的所有应用的列表。搜索栏可让你从应用列表中搜索所需应用。网格布局还在搜索栏下方包含了一个工作区列表。


    ## 设置

    点击系统菜单中的“设置”将打开系统和硬件设置面板。配置界面分为两个窗格：左侧窗格显示设置列表，右侧窗格显示所选设置的说明。可使用鼠标滚轮滚动设置列表。假设你想更改电脑的桌面背景，在左侧窗格中选择“外观”，然后在右侧窗格中从可用壁纸列表里选择壁纸即可。搜索选项也位于系统设置的顶部栏中，使用搜索选项可以查找任何与设置相关的内容。假设你想更改日期和时间，只需按下搜索按钮输入日期即可，系统会在左侧窗格中提供所有与日期相关的选项列表。


    ## 注销

    Linux允许你与其他用户共用这台设备。若要允许其他用户访问你的电脑，请先注销。当你选择**注销**时，所有已打开的程序都会关闭。


    ## 锁定

    当你短时间不使用电脑时，最好锁定屏幕，避免他人擅自使用。系统屏幕锁定后，所有正在运行的应用程序会继续运行。如需重新登录，输入你的登录密码即可解锁屏幕。如果你长时间离开电脑，系统会自动锁定屏幕。要手动锁定屏幕，可点击顶部栏右侧的系统菜单，然后点击挂锁图标。也可以使用Super+L键盘快捷键锁定屏幕。解锁时，在锁定屏幕上输入密码并按ENTER键即可。


    ## 挂起

    对于笔记本电脑，Fedora会在盖子闭合时将系统切换至挂起模式。为了节能，系统在挂起模式下功耗极低。所有应用程序在挂起模式下会继续运行，但屏幕和其他非必要组件会关闭以节省电量。要手动将系统切换至挂起模式，可点击顶部栏右侧的系统菜单，点击电源按钮打开折叠菜单，然后选择**挂起**选项。


    ## 关机/重启

    要关闭或重启电脑，点击顶部栏右侧的系统菜单，然后点击电源按钮打开折叠菜单，再选择**关机**或**重启**选项。随后会弹出对话框，点击对应的按钮即可。


    ## 窗口

    GNOME通过窗口展示你正在运行的应用程序，这是同时运行多个进程的方式之一。你启动的每个应用程序都会在新窗口中打开，本节将介绍窗口的相关操作。


    ### 列出窗口

    只需点击“活动”按钮即可查看所有打开的窗口。要从列表中选择窗口，使用鼠标左键即可。


    ### 切换窗口

    你可以通过键盘在窗口间切换。要打开窗口切换器，按下Super键+TAB。按住Super键，松开后按下TAB键即可在打开的窗口间循环切换。

    > **注意**：你键盘上的这个按键被称为Super键。


    ### 最大化与还原窗口

    你可以最大化窗口，让其内容铺满整个桌面，也可以取消最大化（还原）窗口到原来的大小。


    #### 最大化窗口

    要最大化窗口，按住鼠标左键点击窗口标题栏以抓取标题栏，将其拖动到顶部栏即可。另一种方法是双击窗口标题栏上的鼠标左键。使用键盘的话，按下Super+向上箭头即可最大化窗口。


    #### 还原窗口

    要将窗口恢复到原始大小，抓取窗口标题栏并将其拖离顶部栏，或者直接双击窗口标题栏即可。使用键盘还原窗口的话，按下Super+向下箭头即可。


    ### 平铺窗口（窗口贴靠）

    你可以将两个窗口并排摆放，方便复制文件或对比两个窗口的内容。该功能在微软Windows系统中被称为“窗口贴靠”。要将窗口贴靠到屏幕左侧，按下Super+向左箭头；要将窗口贴靠到屏幕右侧，选中窗口后按下Super+向右箭头。使用鼠标贴靠窗口的话，抓取窗口标题栏并将其拖动到屏幕左侧或右侧，直到半个屏幕被高亮显示即可。


    ## 工作区

    工作区是用于优化窗口管理的虚拟桌面。如果有多个处于活动状态的工作区，搜索栏下方会显示工作区列表。要切换工作区，点击对应工作区即可。工作区也会显示在窗口列表的左右两侧。只需将正在运行的应用程序窗口拖动到新工作区即可：如果是第一个工作区，就拖动到右侧；如果有超过两个工作区，就拖动到左侧。工作区的数量默认是动态的，不过你也可以在选项中设置固定数量的工作区。


    ### 切换工作区

    工作区本质上是虚拟桌面，相当于在同一桌面上配备多台显示器。如果你同时使用多个应用程序，工作区是非常出色的整理工具。

    - 要将应用程序从一个工作区移动到另一个工作区，按下“活动”按钮查看窗口和工作区列表，抓取窗口标题栏并将其移动到屏幕右侧的新工作区即可。

    - 删除工作区中的所有窗口即可移除该工作区。

    - 如果你有多个工作区，搜索栏和窗口列表之间会出现工作区选择器。

    - 要切换到某个工作区，可以点击“活动”按钮后选择对应工作区，也可以使用键盘快捷键Super+PageDown或Super+PageUp（在屏幕右侧操作）。

    - 要移动到某个工作区，点击“活动”按钮选择对应工作区，或者按下键盘上的Super+PageDown和Super+PageUp快捷键即可。


    ## **获取帮助**

    获取Fedora Linux的支持非常简单。在图形用户界面环境中，按下F1键即可获取当前活动应用的相关信息。假设你正在使用文本编辑器，需要获取相关帮助，按下F1键即可。


    ### **命令行帮助**

    使用命令行界面时，有多种方式可以获取帮助。


    #### **手册页**

    Linux中的`man`命令用于显示任意命令的用户手册页。你可以通过`man`命令获取命令的基本使用帮助，以及所有选项和开关的相关说明。


    ##### **语法**

    ``` man command ```


    ##### **示例**

    ``` man cp ```


    #### **Info命令**

    `info`命令可以提供关于命令的详细信息。


    ##### **语法**

    ``` Info command ```


    ##### **示例**

    ``` Info cp ```


    #### **--帮助**

    要快速获取帮助，你也可以为命令添加`--help`选项。


    ##### **示例**

    ``` cp --help ```


    #### **apropos关键字搜索**

    如果你不知道执行某项任务对应的命令，可以使用`apropos`命令搜索手册页。


    ##### **示例**

    ``` apropos copy ```

    该命令会显示所有名称或描述中包含“copy”字符串的命令。


    #### **whatis命令查询**

