  md: '# Chapter

    8

    Sudo


    The **sudo** command allows you to run applications with another user''s security
    rights (by default, as the superuser). It asks for your personal password and
    confirms your command request by verifying a file called sudoers that the system
    administrator has configured. It is a method that allows you to delegate some
    administrative responsibilities to less privileged users without providing the
    administrator''s password.


    Example of a privilege command that modifies system configuration


    ```

    sudo dnf install gzip

    ```


    or changing hostname


    ```

    sudo hostnamectl set-hostname host2021

    ```


    # Run command as different user.


    Syntax


    ```

    sudo -u user command

    ```


    Example


    ```

    sudo -u user2 hostnamectl

    ```


    Use sudo in **interactive mode**


    ```

    sudo -i

    ```


    # Changing the sudo Configuration


    Sudo''s configuration is saved in the **/etc/sudoers** file. To change the sudo
    configuration, use the **visudo** command. It essentially launches the vi editor
    and modifies the'
  merge: -1
  pgno: 47
- img_proc: true
  md: '/etc/sudoers file. The administrator must run the visudo command.


    The /etc/sudoers file contains a list of users and the commands that they can
    execute.


    ```

    user host=(users) [NOPASSWORD:]commands

    ```


