    - **Automatic Login:** When the system boots, make the user account login automatically
    without prompting for a password.

    - The **Administrator** slide button lets you modify your account type from Standard
    to Administrator and vice versa.

    - To change the **language** for the user, press the greater than (>) sign.


    # ## Remove user


    If you find that a user account is no longer needed, you can easily delete the
    user.


    +   1. Go to Settings and select Users.

    2. Press **Unlock**.

    3. Select the user for deletion.

    4. Press the **Remove User** button.

