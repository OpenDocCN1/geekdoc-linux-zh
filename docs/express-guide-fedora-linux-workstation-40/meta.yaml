    8. Click on the Installation destination (with an orange sign).


    # **Disk Configuration:**


    The default file system used during Fedora workstation installation is Btrfs (B-tree
    File System). Btrfs is a modern copy-on-write (COW) file system with various advanced
    capabilities over earlier file systems like Ext4, such as snapshots and subvolumes.


    During Workstation installation, you have the option for automatic storage configuration,
    which has the following'
  merge: -1
  pgno: 18
- img_proc: true
  md: 'disk layout.


    | Mount Point | Function | Filesystem type |

    | /boot/efi | EFI System Partition | FAT 32 |

    | /boot | Boot Partition | ext4 |

    | / | Root Subvolume | Btrfs |

    | /home | Home Subvolume | Btrfs |


    The root subvolume stores the system installation, while the home subvolume contains
    user data and its settings.


    # **Swap Space:**


    If you''ve previously used Fedora or another Linux system, you might be thinking
    about swap space. Fedora Workstation does not use a separate swap partition. Instead,
    it use ZRAM. ZRAM is a new Linux feature that stores swap files in compressed
    RAM rather than hard disks, as previously employed. RAM is already much quicker
    than hard disks.


    In Fedora Workstation, during the disk partitioning section of the installer,
    you have multiple disk configuration options in addition to Automatic storage
    configuration, which is the default option. These choices allow you to tailor
    how your drives are partitioned and used to meet a variety of demands, including
    complex storage configurations and specific requirements.Here are some of the
    non-default disk configuration choices you can consider:


    +   - **Manual:** You can manually configure partitions based on your preferences
    rather than allowing the installer to partition the drive automatically.'
  merge: -1
