    ## Setting

    Settings in the system menu will open the system and hardware settings panels.
    The configuration screen is divided into two panes: the left pane displays a list
    of settings, while the right pane displays a description of the selected setting.
    The mouse''s scroll wheel can be used to scroll through the list of settings.
    Assume you wish to change the background of your computer. In the left pane, choose
    Appearance, and then in the right pane, select the wallpaper from the list of
    available wallpapers.


    The search option is also located in the top bar of the system settings. The Search
    option allows you to look up anything related to settings. Assume that you want
    to change the date and time. Simply press the search button and type in the date.
    In the left pane, the system will provide a list of date-related things.


    ## Log Out

    Linux allows you to share your machine with other users. To allow other users
    to access your computer, either log out. When you choose **Log Out**, all of your
    open programs will close.


    ## Lock

    When you are not using your computer for a short amount of time, it is best to
    lock the screen so that no one else may use it. All running applications will
    continue to operate when the system screen is locked. To re-log in, enter your
    login password to unlock the screen. If you leave your computer for an extended
    period of time, the system will automatically lock the screen. To manually lock
    the screen, go to the system menu on the right side of the top bar and click the
    pad lock icon. You can also use the Super + L keyboard shortcut to lock. To unlock,
    enter your password and press the ENTER key on the locked screen.


    ## Suspend

    In the case of laptops, Fedora switches the system to suspend mode when the lid
    is closed. To preserve energy, the system utilises very little power when in suspended
    mode. All of your apps continue to operate in suspend mode, but the screen and
    other non-essential components of the computer turn off to save power. To manually
    switch the system to suspend mode, open the system menu on the right side of the
    top bar, click the power button to open the collapsed menu, and then select the
    **Suspend** option.


    ## Power Off / Restart

    To turn off or restart your computer, click the system menu on the right side
    of the top bar, then click the power button to open a collapsed menu, and then
    select the **Power Off** or **Restart** option. A dialogue box will appear; click
    the appropriate button.


    ## Windows

    GNOME displays your running applications using windows. This is one method for
    running many processes concurrently. Every application you launch opens in a new
    window. We''ll look at windows in this part.


    ### List windows

    Simply click the Activities button to see all of the open windows. To select a
    window from the list, use the left mouse button.


    ### Switch window

    You can switch between windows by using the keyboard. To open the windows switcher,
    press the Super key + TAB. Hold the Super key down, then release it and press
    the TAB key to cycle between open windows.


    > **note**: The key on your keyboard is known as the super key.


    ### Maximize and unmaximize a window

    You can maximise a window to show its content across the entire desktop, and you
    may unmaximize or restore a window to its original size.


    #### Maximize the Window

    To maximize a window, press and hold the left mouse button at the window title
    bar to grab the window title bar. Drag it to the top bar now. Another method is
    to double-click the mouse''s left button on the window''s title bar. Using the
    keyboard, hit Super + UP arrow to maximize a window.


    #### Unmaximize window

    To return a window to its original size, grab the window title bar and drag away
    from the top bar, or simply double-click the window title bar. To unmaximize the
    windows using the keyboard, press Super + Down arrow.


    ### Tile Windows (Snap Windows)

    You can set two windows side by side to copy files or compare the contents of
    two windows. This function is called as Windows Snap in Microsoft Windows. To
    snap the window to the left side of the screen, press Super + left arrow, and
    to snap the window to the right side of the screen, select the window and press
    Super + right arrow. To snap a window with the mouse, grab the window''s title
    bar and drag it to the left or right side of the screen until half of the screen
    is highlighted.


    ## Workspaces

    Workspaces are virtual desktops designed to improve window management. If more
    than one workspace is active, a list of workspaces will appear below the search
    bar. To swap workspaces, click on the workspace. The workspaces are also shown
    on the left and right sides of the window list. Simply drag the running application
    windows to the new workspace, either on the right side in the case of the first
    workspace or on the left side if there are more than two workspaces. The number
    of workstations is dynamic by default, however there is a fixed number of workspaces
    option in the options.


    ### Switch workspaces

    Workspaces are essentially virtual desktops. It''s almost like having multiple
    monitors on the same desktop. If you''re working on multiple applications at the
    same time, workspace is an excellent way to keep things organised.


    - To switch an application from one workspace to another, press Activities to
    see a list of windows and workspaces. Grab the title bar of window and move to
    the new workspace on the right side of the screen.

    - Delete all windows from the workspace to remove it.

    - If you have more than one workspace, a workspace selector will appear between
    the search bar and the windows list.

    - To switch to a workspace, click Activities and select the workspace, or use
    the keyboard shortcuts Super + Page Down or Super + Page Up on the right side
    of the screen.

    - To move to a workspace, click Activities and select the workspace or press Super
    + Page Down and Super + Page Up on your keyboard.


    ## **Getting help**

    Getting support with Fedora Linux is simple. In the GUI environment, press F1
    to acquire information about the currently active application. Suppose you are
    using Text editor and you want help related to it. Press F1.


    ### **Command Line Help**

    While using a command-line interface, there are various methods to receive assistance.


    #### **Man**

    The `man` command in Linux is used to show any command''s user manual pages. You
    can get basic help from `man` for using command and all of its options and switches.


    ##### **Syntax**

    ```

    man command

    ```


    ##### **Example**

    ```

    man cp

    ```


    #### **Info command**

    The `info` command provides comprehensive details about the command.


    ##### **Syntax**

    ```

    Info command

    ```


    ##### **Example**

    ```

    Info cp

    ```


    #### **--help**

    For quick help, you can also use the `--help` option with a command.


    ##### **Example**

    ```

    cp --help

    ```


    #### **apropos**

    If you don''t know the command for a certain task, use the `apropos` command to
    search the manual pages.


    ##### **Example**

    ```

    apropos copy

    ```

    This command will display any commands that include a copy string in their name
    or description.


    #### **whatis**

