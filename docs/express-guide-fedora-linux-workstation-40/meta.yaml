    ## 第1章：*简介*

    Linux 是一款类 UNIX 操作系统。1991 年，林纳斯·托瓦兹将 Linux 作为一个开源项目创建。它以稳定性、安全性和可扩展性著称。Linux 支撑着海量设备，从个人电脑、服务器到嵌入式系统、超级计算机，都有它的身影。来自全球的开发者和贡献者共同协作，持续完善其功能，为
    Linux 提供了强有力的支持。Linux 体现了自由开源软件（FOSS）的理念，为用户提供了无与伦比的自定义和开发自由度，因此备受全球个人、企业和政府的喜爱。市面上有大量符合开源标准的
    Linux 发行版，其中 Fedora Linux 是最受欢迎、使用最广泛的发行版之一。Fedora Linux 充分展现了社区驱动式开源开发的力量。它由红帽公司于
    2003 年推出，是 Red Hat Linux 项目的延续。它包含大量采用各类自由开源许可证发布的软件，致力于始终处于开源技术的前沿。经过多年发展，Fedora
    已成为一款集创新性、可靠性和协作精神于一身的前沿操作系统。无论你是资深的 Linux 爱好者、寻求稳定平台的开发者，还是想了解开源软件世界的初学者，Fedora
    都能为你提供有趣且易用的使用环境。

    从根本上说，Fedora 代表了 Linux 社区所特有的探索与发现精神。它是新功能和先进技术的试验场，其企业级对应版本红帽企业 Linux（RHEL）的演进也经常受到
    Fedora 的影响。通过这种动态的协作关系，Fedora 用户既能享受到前沿技术带来的便利，也能确保其计算环境的安全可靠。

    ### Fedora Linux 操作系统架构

    Fedora Linux 采用模块化设计，基于 Linux 内核，并使用 systemd 进行系统管理。Linux 内核是操作系统的组成部分，负责与计算机硬件交互，管理内存、算力等系统资源。在
    Linux 内核之上，Fedora Linux 提供了大量运行操作系统所需的软件工具和应用。它支持多种桌面环境，包括 GNOME、KDE Plasma 和
    Xfce，以满足不同用户的使用偏好。Dnf 负责包管理，确保软件的安装和更新高效且安全。Fedora 的架构优先考虑社区参与、创新性，以及在不同硬件平台和计算环境中的适配性。

    ### Fedora Linux 生命周期

    Fedora Linux 遵循可预测的 6 个月发布周期，每个新版本都会带来更新的功能和软件包。每个版本会获得约 13 个月的月度更新，这些更新分为活跃维护和生命周期终止两个阶段。从技术层面来说，13
    个月的生命周期是这样实现的：在 X+2 版本发布后，仍为 X 版本提供为期 1 个月的支持。这使用户可以选择“跳过某个版本”，而不会影响系统的持续更新能力。为了保障连续性和安全性，Fedora
    简化了相邻版本之间的升级流程。通过用户反馈和用户参与，Fedora 的社区驱动策略促进了前沿技术的早期应用和系统的持续改进。

    ### Fedora Linux 的优势

    - **前沿技术**：Fedora 每 6 个月发布一次更新，你可以始终获取最新版本的内容。旗舰版始终是最新的版本，没有长期支持（LTS）版本。

    - **社区驱动开发**：Fedora 得益于庞大且活跃的开发者与贡献者社区，大家共同努力持续优化操作系统。

    - **稳定性与安全性**：Fedora 集成了 SELinux 以强化安全措施，通过严格的安全策略防范未授权访问和各类威胁。

    - **易于使用**：Fedora 上手非常简单，正是因为易用性高，它成为许多追求强大、安全、灵活系统的用户的首选操作系统。

    - **灵活且强大**：你可以完全掌控自己的服务和基础设施，并根据自身需求和技术规格进行自定义调整。

    - **桌面环境选择丰富**：Fedora 提供包括 GNOME、KDE Plasma、Xfce、LXQt 在内的多种桌面环境，满足不同用户和硬件配置的需求。

    - **丰富的软件资源**：Fedora 提供了大量所需的软件工具和应用。

