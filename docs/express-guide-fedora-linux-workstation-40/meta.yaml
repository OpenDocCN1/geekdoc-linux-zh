  md: '# Chapter

    21

    **Play video**


    Fedora includes a video player program called Video. Simply double-click any video
    to play it. In this chapter, we''ll take a look at VLC Player, yet another versatile
    tool for playing video and audio. VLC is a well-known program. The ability to
    play practically all types of audio and video formats is one of the key reasons
    for its widespread use. VLC''s user interface is relatively straightforward. You
    can try VLC if you have trouble playing any audio or video with other apps.


    We will first install this app and then explore it.


    # ## To install VLC


    To install VLC player, press **Activities**, type terminal in the search bar,
    and click on the terminal icon. In the terminal window, type the following commands:


    +   1. If it is not already there, add the rpmfusion free repository.


    ```

    dnf install

    https://download1.rpmfusion.org/free/fedora/rpmfusion-free-

    release-$(rpm -E %fedora).noarch.rpm

    ```


    +   2. Install VLC player.


    ```

    sudo dnf install -y vlc

    ```


    # ## Play video


    There are two ways to play video with VLC.'
  merge: -1
  pgno: 125
- img_proc: true
  md: '1. Using the file manager.


    2. Open the file in VLC.


    # ## Using File manager


    1. Launch the file manager and navigate to the folder. Select Open with another
    application from the context menu when you right-click on the video file.


    ![](img/f23a8e45379315d1673be3d803b2f54c_126_0.png)


    2. Select VLC media player from the list and set the "Always use for this file
    type" button.


    3. Press Open button


    # ## Open the video in VLC.


    1. Press Activities.


    2. In the search bar, write VLC. Select the VLC icon.'
