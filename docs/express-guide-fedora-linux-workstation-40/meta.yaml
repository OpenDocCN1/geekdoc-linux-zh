  md: '# Chapter 10


    # Add a Desktop Environment


    Fedoro, like any other Linux distribution, allows you to customize your user experience,
    improve performance, access specific software, personalize your desktop environment,
    and explore other elements of the Linux ecosystem. If you want to add more desktop
    environments of your choice, you may easily add them to an existing installation.
    The reasons for adding or changing desktop environment may due to following reasons:


    +   - **User preferences**: Different desktop environments provide distinct user
    interfaces and workflows.

    - **Performance**: Some desktop environments require fewer system resources than
    others.

    - **Applications availability**: Some applications or tools may be widely available
    or compatible with specific desktop environments.

    - **Customization**: Each desktop environment has a unique set of customization
    options that may not be available in others.

    - **Exploration and Learning**: Experimenting with multiple desktop environments
    can help you learn more about alternative desktop Linux user interfaces and the
    ecosystem.


    As previously stated, Fedora 40''s default desktop environment is GNOME3. It performs
    best with hardware acceleration. Alternative desktops are advised for people with
    older graphics technology or who have specific desktop environment requirements.'
  merge: -1
