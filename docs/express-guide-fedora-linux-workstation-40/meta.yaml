    ## 第15章 网络

    ### 计算机网络究竟是什么？

    计算机网络是互联的计算机和计算设备的集合。这种连接允许该组内的多台计算机和设备之间进行通信。计算机和设备可以通过有线、光纤或微波进行通信。网络有多种类型，但我们将重点介绍TCP/IP，因为它是使用最广泛的协议。TCP/IP广泛应用于局域网（LAN）和广域网（WAN），包括互联网。个人电脑通常使用网络连接到互联网，或共享文件和打印机。网络连接可以是有线的，也可以是无线（如Wi-Fi）的。本章将介绍这两种网络类型。

    ### 📶 连接无线网络

    如果你在桌面顶部栏看到了Wi-Fi图标，说明你的系统已连接到无线网络。否则，请按照以下步骤连接家庭或办公无线网络：

    - 点击**系统菜单**。

    - 点击**Wi-Fi**按钮右侧的“>”符号，即可显示可用网络。

    - 点击要使用的Wi-Fi网络名称。

    ![](img/f23a8e45379315d1673be3d803b2f54c_75_0.png)

    - 如果网络设有密码保护，在密码输入框中输入密码后，点击**连接**。

    ![](img/f23a8e45379315d1673be3d803b2f54c_75_1.png)

    - 网络连接成功后，顶部栏会显示Wi-Fi图标。

    ### **更改Wi-Fi密码**

    如果因任何原因你在Wi-Fi路由器上更改了Wi-Fi网络密码，就必须在设备上配置相同的密码，否则下次将无法连接。

    - 打开“设置”。

    - 点击左侧面板中的“Wi-Fi”。在“可见网络”区域中，点击所选网络名称右侧的齿轮按钮，会弹出窗口。

    ![](img/f23a8e45379315d1673be3d803b2f54c_76_0.png)

    - 在“安全”标签页中，修改密码后点击“应用”。

    ![](img/f23a8e45379315d1673be3d803b2f54c_76_1.png)

    ### 有线网络

    连接有线网络非常简单，只需将网线插入电脑即可。系统会自动为可用网络配置网络设置。系统连接到有线网络后，顶部栏会显示[网络图标]。

    ### 手动配置有线网络

    大部分时候有线网络会自动配置，但在某些情况下（特别是办公环境中），你需要手动指定IP地址，这种配置方式被称为“静态IP地址配置”。

    #### **配置静态IP地址的方法：**

    - 进入系统菜单。

    - 点击**有线**按钮右侧的“>”符号。

    ![](img/f23a8e45379315d1673be3d803b2f54c_77_0.png)

    - 点击**有线**设置。

    - 此时会弹出网络设置窗口。

    ![](img/f23a8e45379315d1673be3d803b2f54c_77_1.png)

    - **有线**字段会显示网络状态，点击齿轮图标。

    - 此时会打开**有线**配置文件对话框。

    ![](img/f23a8e45379315d1673be3d803b2f54c_78_0.png)

    - 在“详细信息”标签页中，确保已勾选**自动连接**选项。

    - 点击“IPv4”标签页。

    1. 点击**手动**单选按钮。

    2. 输入IP地址。

    3. 输入子网掩码，

    4. 输入网关。

    5. 输入DNS

    ![](img/f23a8e45379315d1673be3d803b2f54c_78_1.png)

    - 点击**应用**。

    ### 命令行

    #### **显示IP地址**

    ```ip addr show ```

    #### **显示链路状态**

    ```ip link show ```

    ![](img/f23a8e45379315d1673be3d803b2f54c_80_0.png)

    高亮文本显示链路状态。

    #### **显示路由表**

    ```ip route ```

    #### **检查网络连通性**

    **语法**

    ```ping ipaddress/hostname ```

    **示例**

    ```ping 192.110.22.121 ```

    #### **检查并更改主机名**

    Linux中的计算机名称称为主机名，要更改主机名，可以使用hostnamectl命令。

    ##### **显示当前主机名**

    ```hostnamectl ```

    ##### **更改主机名**

    **语法**

    ```hostnamectl set-hostname newname ```

    **示例**

    ```sudo hostnamectl set-hostname myhost1 ```

    ##### **dig命令：DNS查询并显示结果**

    **语法**

    ```dig hostname ```

    **示例**

    ```dig microsoft.com ```

    ##### **telnet**

    用于连接目标主机端口，或测试主机和端口的可达性。

    **语法**

    ```telnet hostname port ```

    **示例**

    ```telnet myserver1 8080 ```

    ##### **nslookup**

    查询互联网域名服务器。

    **语法**

    ```nslookup hostname ```

    **示例**

    ```nslookup microsoft.com ```

    ##### **scp**

    通过网络在两台主机之间安全复制文件。

    ###### **语法**

    ```scp filename user@targetserver:/path ```

    ###### **示例**

    ```scp ast.txt user1@server2:/home/user1 ```

    ###### **ssh**

    用于安全登录目标服务器。

    ###### **语法**

    ```ssh user@targethost ```

    ###### **示例**

    ```ssh user1@server2 ```

    ###### **nmap**

    扫描服务器的开放端口。

    ###### **语法**

    ```nmap hostname ```

    ###### **示例**

    ```nmap cloudflare.com ```

    ### 应用管理

    Fedora是一款开源操作系统，可访问多种软件，其中大部分可免费使用。分发这些软件的不同公司采用多种形式的协议，通常称为许可证。软件仓库是存储这些软件产品的站点。Fedora
    Workstation默认启用一系列软件仓库，支持你更新预装软件、安装新的软件包和程序。

    工作站默认的软件仓库包括：

    - **官方Fedora RPM仓库：** 所有Fedora工作站系统组件和必备应用都可以通过Fedora官方仓库以RPM格式获取。

    - **Fedora Flatpak仓库：** Flatpak是访问和管理Fedora及其他Linux发行版上大量桌面应用的便捷方式，凭借其沙盒机制具有灵活性和安全优势。Flatpak软件分发工具已在工作站上预装，同时提供由Fedora团队制作并托管的Flatpak应用仓库，支持安装。

    - **Linux供应商固件服务（LVFS）：** Linux供应商固件服务（LVFS）是一个旨在以统一、安全的方式向Linux用户分发固件升级的项目。Fedora工作站使用fwupd工具从LVFS下载固件更新，该功能默认启用。

    ### **第三方仓库**

    在某些情况下，用户可能希望添加第三方仓库，以获取官方仓库中未提供的新软件或软件包。Fedora Workstation自带多个第三方仓库，这些软件仓库由Fedora以外的项目和组织维护，可提供比默认仓库更丰富的软件选择。用户可以在初始设置过程中或软件中心中通过点击按钮轻松启用它们。

    ### **软件中心**

    Fedora Workstation默认自带GNOME软件应用，它提供了用于管理本机软件的用户友好型图形界面，软件中心是最便捷的管理方案，你可以用它来安装、卸载和更新应用。

    以下是Fedora Workstation上GNOME软件的主要特性和功能：

    - **图形化软件包管理：** 提供经过筛选的应用集合，在图形环境中按类别整理以便轻松浏览，用户可以通过生产力、游戏、实用工具等分类查找应用。

    - **系统更新：** GNOME软件会提醒用户已安装软件的可用更新，包括操作系统升级和安全修复，你可以直接通过用户界面（UI）管理和应用这些更新。

    - **Flatpak集成：** Fedora Workstation的GNOME软件支持Flatpak，可同时管理Flatpak应用和标准RPM程序。搜索应用时，GNOME软件会显示是否

