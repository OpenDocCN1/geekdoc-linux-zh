    `whatis` 命令用于展示命令的单行用法。

    ### 语法

    ```whatis command```

    ### 示例

    ```whatis cp ```

    ![](img/f23a8e45379315d1673be3d803b2f54c_46_0.png)

    如果你遇到任何 Fedora 相关问题，都可以前往 https://ask.fedoraproject.org/ 向 Fedora 社区寻求帮助。

    ## 第8章 Sudo

    **sudo** 命令允许你以其他用户的安全权限运行应用程序（默认情况下为超级用户）。它会要求你输入个人密码，并通过校验系统管理员配置的名为 `sudoers`
    的文件来确认你的命令请求。该方法允许你将部分管理职责委托给权限较低的用户，且无需提供管理员的密码。

    修改系统配置的特权命令示例：

    ```sudo dnf install gzip ```

    或更改主机名：

    ```sudo hostnamectl set-hostname host2021 ```

    ### 以其他用户身份运行命令

    **语法**

    ```sudo -u user command```

    **示例**

    ```sudo -u user2 hostnamectl ```

    在**交互模式**下使用 `sudo`：

    ```sudo -i ```

    ### 修改 Sudo 配置

    Sudo 的配置保存在 `/etc/sudoers` 文件中。要修改 sudo 配置，请使用 **visudo** 命令。该命令本质上会启动 vi 编辑器并修改
    `/etc/sudoers` 文件。管理员必须运行 `visudo` 命令。`/etc/sudoers` 文件包含用户列表以及他们可执行的命令：

    ```user host=(users) [NOPASSWORD:]commands```

    #### 示例

    ```%operators localhost = (apache) /usr/sbin/ ```

    ## 第9章 更新

    更新包括关键错误修复、安全补丁和新功能。定期更新有助于提升计算机操作系统和程序的性能、稳定性与安全性。安装更新可确保系统安全高效地运行。

    Fedora 会自动检查已安装程序的新更新，并提醒你进行更新。全新安装后，你可以通过两种方式手动更新系统：图形用户界面或命令行。

    ### 通过图形用户界面更新系统

    1. 点击 **Activities**。

    ![](img/f23a8e45379315d1673be3d803b2f54c_49_0.png)

    2. 点击停靠栏上的软件图标。

    3. 点击“更新”选项卡。

    4. 点击**更新**（部分情况下为**重启并更新**）

    ![](img/f23a8e45379315d1673be3d803b2f54c_49_1.png)

    5. 如果选择“重启并更新”，系统将在更新完成后重启；否则，系统仅完成更新。

    ![](img/f23a8e45379315d1673be3d803b2f54c_50_0.png)

    ### 使用命令行更新

    ```sudo dnf -y update ```

    ## 第10章 添加桌面环境

    与其他 Linux 发行版一样，Fedora 支持自定义使用体验、提升性能、访问特定软件、个性化桌面环境，以及探索 Linux 生态系统的其他元素。如果你想添加更多自选的桌面环境，可以轻松将其安装到现有系统中。

    添加或更换桌面环境的原因通常包括以下几点：

    - **用户偏好**：不同的桌面环境提供独特的用户界面和工作流。

    - **性能**：部分桌面环境比其他环境占用更少的系统资源。

    - **应用可用性**：部分应用或工具可能在特定桌面环境中可用性更高或兼容性更好。

    - **自定义能力**：每个桌面环境都有独有的自定义选项，这些选项在其他环境中可能并不提供。

    - **探索与学习**：尝试多种桌面环境有助于你深入了解其他 Linux 桌面用户界面及生态系统。

    如前所述，Fedora 40 的默认桌面环境是 GNOME3。它在硬件加速下运行效果最佳。建议使用旧显卡技术或有特定桌面环境需求的用户选择其他桌面环境。

    桌面环境可添加到现有安装中，并通过登录界面访问。要列出可用的桌面环境，请运行 `dnf grouplist` 命令：

    ```sudo dnf grouplist -v hidden | grep Desktop ```

    #### 安装所需的桌面环境

    ```sudo dnf groupinstall "KDE Plasma Workspaces" ```

    上述命令用于安装 KDE 桌面环境，你也可以通过相同方式安装其他桌面环境。

    ## 命令行界面

    Fedora 为大多数任务提供了非常友好的图形用户界面，但在使用 Linux 时，你也需要熟悉命令行界面。本章将介绍命令行界面。

    ### GNOME 终端

    ![](img/f23a8e45379315d1673be3d803b2f54c_53_0.png)

    GNOME 终端是一款与 GNOME 桌面环境配套的终端模拟器。终端可访问 Linux Shell 环境，用于运行程序。终端提供交互式命令行界面。与图形用户界面不同，你需要输入应用程序名称后按下
    Enter 键来启动程序，这被称为命令行输入。

    ### 打开 GNOME 终端

    ![](img/f23a8e45379315d1673be3d803b2f54c_54_0.png)

    按下 **Activities**，在搜索栏中输入 `terminal`，然后选择终端图标。

    ### 快捷键

    以下是 GNOME 终端的一些基础快捷键：

    | 键盘快捷键 | 功能 |

    |-------------------|------|

    | Ctrl + A | 将光标移至命令提示符开头 |

    | Ctrl + E | 将光标移至命令提示符末尾 |

    | Ctrl + U | 清空当前行 |

    | 鼠标中键点击 | 粘贴高亮的文本 |

    | Tab | 补全命令 |

    | 向上/向下方向键 | 显示命令历史 |

    | Ctrl + C | 终止当前进程 |

    | Ctrl + Z | 挂起前台进程 |

    ### 命令

    让我们了解一些基础且重要的命令。

    #### date

    打印或修改系统日期和时间。

    **语法**

    ```date ```

    **示例**

    - 查看日期：

    ```date ```

    - 设置日期：

    ```sudo date -s "24 feb 2017 19:00" ```

    #### cp

    复制文件的命令。

    **语法**

    ```cp <options> source destination```

    **示例**

    ```cp /home/abc.txt /home1/ ```

    - 递归复制目录中的所有文件：

    ```cp -R /home/* /home1/ ```

    - 覆盖前发出提示：

    ```cp -i /home /home1 ```

    - 将所有新文件复制到目标目录：

    ```cp -u * /tmp ```

    - 强制复制文件：

    ```cp -f /tmp/abc.txt /backup/. ```

    - 不替换已有文件，直接跳过：

    ```cp -n * /backup/. ```

    #### ls

    列出文件名。

    **语法**

    ```ls -<options>```

    **示例**

    | 命令 | 说明 |

    |---------|-------------|

    | `ls -al` | 列出目录和文件 |

    #### cat

    显示文本文件。

    **语法**

    ```cat filename```

    **示例**

    ```cat abc.conf ```

    #### rm

    删除单个文件、多个文件或目录。

    **语法**

    ```rm filename```

    **示例**

    ```rm abc.conf ```

    递归删除 `abc` 目录：

    ```rm -r abc ```

    #### more

    每次分页显示一整屏文本。

    **语法**

    ```more filename```

    **示例**

    ```more /etc/hosts ```

    #### less

    `less` 命令是一个与 `more` 类似的程序，但支持在文件中向前和向后浏览。

    **语法**

    ```less filename```

    **示例**

    ```less /etc/hosts ```

    #### mv

    `mv` 命令用于将文件从一个位置移动到另一个位置，也可以使用该命令重命名文件而无需移动其位置。

    ##### 移动文件

    **语法**

    ```mv filename destination_directory```

    **示例**

    ```mv a.txt /tmp/ ```

    该命令会将当前目录下的 `a.txt` 文件移动到 `/tmp` 目录。

    ##### 重命名文件

    **语法**

    ```mv filename newfilename```

    **示例**

    ```mv a.txt b.txt ```

    #### grep

    在一个或多个文件中搜索字符串，并显示所有包含该字符串的行。

    **语法**

    ```grep string file```

    **示例**

    ```grep ''127.0.0.1'' /etc/hosts ```

    #### head

    将文件的前 10 行输出到标准输出，你也可以指定要显示的行数。

    **语法**

    ```head option file```

    **示例**

    ```head -20 /etc/mime.types ```

    该命令会显示 `mime.types` 文件的前 20 行。

    #### tail

    将文件的最后 10 行输出到标准输出，你也可以指定要显示的行数。

    **语法**

    ```tail option file```

    **示例**

    ```tail -20 /var/log/logfile ```

    该命令会显示该文件的最后 20 行。

    使用 `tail` 持续监控文件：

    ```tail -f /var/log/logfile ```

    该命令会持续显示不断增长的文件的末尾，按下 `Ctrl + C` 即可中断。

    #### diff

    比较两个文件。

    **语法**

    ```diff ```

