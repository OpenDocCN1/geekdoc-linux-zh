- md: "## Express Guide\n### Fedora 40 Workstation\nShiv Kumar Goyal\n![](img/f23a8e45379315d1673be3d803b2f54c_0_0.png)\n\
    Master Fedora Linux Quickly & Effectively\n\n## Preface\nWelcome from the Fedora\
    \ Linux universe! This book is meant to serve as your all-in-one resource for\
    \ Fedora, regardless of your level of knowledge with the OS or desire to learn\
    \ more. Fedora is renowned for its creativity, dedication to open source ideals,\
    \ and community-driven development. It is a state-of-the-art Linux distribution\
    \ that provides a stable basis for server and desktop environments. System administrators,\
    \ developers, and enthusiasts all love Fedora because it embraces the most recent\
    \ developments in software and technology with every release.\n\n### Intended\
    \ audience\nAnyone interested in learning about Fedora Linux is the target audience\
    \ for this book. It serves both novices venturing into the realm of Linux and\
    \ experienced users searching for in-depth analysis and useful information. This\
    \ book will be your go-to resource whether you are configuring your own desktop\
    \ or exploring the extensive ecosystem of open source software. So, grab your\
    \ favourite beverage, settle in, and let's embark on this journey together. Welcome\
    \ to the Fedora Linux community—enjoy the ride!\n\n### Conventions Used in This\
    \ Book\nThroughout this book, we use certain conventions to help you navigate\
    \ and understand the content more easily:\n\n- **Command-line examples**: Commands\
    \ you can run in your terminal are formatted like this:\n  ```\n  `ls -la`\n \
    \ ```\n- **File paths and code snippets**: File paths and code snippets are formatted\
    \ like this:\n  ```\n  `/etc/hosts`\n  ```\n- **Syntax**: Syntax of commands are\
    \ formatted like this:\n  ```\n  `ls [option] [file/directory]`\n  ```\n\n###\
    \ Feedback\nYour feedback is invaluable to us as we strive to improve this book\
    \ and provide you with the best possible learning experience. If you have any\
    \ questions, comments, or suggestions, please don't hesitate to contact us at\
    \ 1skgoyal@gmail.com.\n\nShiv Kumar Goyal\n\n## Contents\n- [Introduction](#introduction)\n\
    - [Hardware configuration required](#hardware-configuration-required)\n- [Editions\
    \ and flavour](#editions-and-flavour)\n- [Download and Media preparation](#download-and-media-preparation)\n\
    - [Steps for installation](#steps-for-installation)\n- [Know your Desktop](#know-your-desktop)\n\
    - [Getting help](#getting-help)\n- [Sudo](#sudo)\n- [Update](#update)\n- [Add\
    \ a Desktop Environment](#add-a-desktop-environment)\n- [Command line interface](#command-line-interface)\n\
    - [Edit files with Nano](#edit-files-with-nano)\n- [Personalize your desktop](#personalize-your-desktop)\n\
    - [Change date, time and time zone](#change-date-time-and-time-zone)\n- [Network](#network)\n\
    - [Application Management](#application-management)\n- [Enable third party repositories](#enable-third-party-repositories)\n\
    - [Manage files and folders](#manage-files-and-folders)\n- [Manage Users](#manage-users)\n\
    - [Listen music](#listen-music)\n- [Play video](#play-video)\n- [Photos](#photos)\n\
    - [Write documents](#write-documents)\n\n## Chapter 1: *Introduction*\nLinux is\
    \ an operating system that is similar to UNIX. Linus Torvalds founded Linux as\
    \ an open-source project in 1991. It is well-known for its dependability, security,\
    \ and adaptability. Linux powers a plethora of devices, ranging from PCs and servers\
    \ to embedded systems and supercomputers. It is supported by a global community\
    \ of developers and contributors that work together to continuously improve its\
    \ capabilities. Linux is a popular choice for people, businesses, and governments\
    \ all over the world because it embodies the ideals of free and open-source software\
    \ (FOSS) and gives users unmatched freedom to customize and develop. There are\
    \ tons of Linux distributions available that adhere to open source standards;\
    \ Fedora Linux is one of the most popular and widely used Linux distributions.\
    \ Fedora Linux demonstrates the power of community-driven open-source development.\
    \ It was formed by Red Hat, Inc. and developed in 2003 as a continuation of the\
    \ Red Hat Linux project. It includes software published under a variety of free\
    \ and open-source licenses and aspires to be at the forefront of open-source technologies.\
    \ Fedora has developed into a state-of-the-art operating system that personifies\
    \ creativity, dependability, and teamwork. Fedora provides an engaging environment\
    \ to explore and use, whether you are an experienced Linux fan, a developer looking\
    \ for a stable platform, or a novice interested in learning more about the world\
    \ of open-source software. Fundamentally, Fedora represents the spirit of experimentation\
    \ and discovery that characterizes the Linux community. It functions as a testbed\
    \ for novel features and technological advancements, frequently impacting the\
    \ evolution of Red Hat Enterprise Linux (RHEL), its enterprise equivalent. Through\
    \ this dynamic partnership, Fedora users are guaranteed to benefit from cutting-edge\
    \ developments while their computing environment remains secure and reliable.\n\
    \n### Architecture of the Fedora Linux Operating System\nFedora Linux has a modular\
    \ design based on the Linux kernel with systemd for system management. The Linux\
    \ kernel is a component of the operating system that interfaces with the computer's\
    \ hardware and maintains system resources like memory and computing power. Fedora\
    \ Linux offers a number of software tools and apps necessary to operate the operating\
    \ system on top of the Linux kernel. It supports a variety of desktop environments,\
    \ including GNOME, KDE Plasma, and Xfce, to accommodate to different user preferences.\
    \ Dnf handles package management, which ensures that software is installed and\
    \ updated efficiently and safely. Fedora's architecture prioritizes community\
    \ engagement, creativity, and adaptability across a variety of hardware platforms\
    \ and computing environments.\n\n### Life cycle of Fedora Linux\nFedora Linux\
    \ follows a predictable 6-month release cycle, introducing new versions with updated\
    \ features and packages. Every version gets monthly updates for roughly 13 months,\
    \ which are split into phases for end-of-life and active maintenance. The 13-month\
    \ lifetime is created, in scientific terms, by supporting version X for one month\
    \ following the release of version X+2. This gives customers the option to \"\
    skip a release\" without compromising the system's continuous updating capability.\
    \ To maintain continuity and security, upgrades between successive releases are\
    \ made easier. Through user feedback and participation, Fedora's community-driven\
    \ strategy promotes early adoption of cutting-edge technology and continual improvement.\n\
    \n### Advantages of Fedora Linux\n- **Cutting-Edge technology**: You always get\
    \ the latest updates from Fedora, which are released every six months. The flagship\
    \ edition is always the most recent version. There is no Long Term Support (LTS)\
    \ version.\n- **Community-driven development**: Fedora benefits from a big and\
    \ active community of developers and contributors who work together to continuously\
    \ improve the operating system.\n- **Stability and Security**: Fedora incorporates\
    \ SELinux to improve security measures, giving strong security policies to guard\
    \ against unwanted access and threats.\n- **Easy to use**: Fedora is quite easy\
    \ to use. Because of its ease of use, Fedora is the operating system of choice\
    \ for many people who want a strong, safe, and flexible program.\n- **Adaptable\
    \ and powerful**: It maintains complete control over your services and infrastructure.\
    \ You can alter based on your demands and specifications.\n- **Desktop Environment\
    \ Choices**: Fedora provides a range of desktop environments, including GNOME,\
    \ KDE Plasma, Xfce, LXQt, and others, to meet the needs of diverse users and hardware\
    \ configurations.\n- **Wide range of software**: Fedora provides a large range\
    \ of software tools and applications needed for"
