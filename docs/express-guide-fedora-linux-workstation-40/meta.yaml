  md: '+   2. Select General.

    3. Change **Always save as** to **Word 2007-365(*.docx)** using drop down menu.

    4. Unselect "When not saving in ODF or default format"

    5. Press **OK**.


    # Change user interface


    If you are coming from a Windows MS Word environment, you may miss the ribbon
    interface in Libre Office, but you can adapt the libre interface to be like that
    as well by following the steps below:


    +   1. Select **User interface** from the **View** menu.

    2. Select **Tabbed**.


    ![](img/f23a8e45379315d1673be3d803b2f54c_139_0.png)


    +   3. Select the **Apply to All** button and then click **Close**.'
  merge: -1
