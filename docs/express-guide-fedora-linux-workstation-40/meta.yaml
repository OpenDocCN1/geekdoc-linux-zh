  md: '# Chapter


    # 20


    # Listen music


    Rhythmbox is Fedora''s default music program. Rhythmbox allows you to listen to
    music, podcasts, and internet radio. To open the music player, click **Activities**,
    type music in the search bar, and then click the **Rhythmbox** icon.


    # Interface


    ![](img/f23a8e45379315d1673be3d803b2f54c_121_0.png)


    You will see the categories in the left pane. The list is displayed in the right
    pane. You can change the view of the right pane by using the **Browse** or **View
    All** buttons at the top.


    The Menu button provides you with the option to change the view and preferences
    of Rhythmbox, like visible columns,'
  merge: -1
  pgno: 121
- img_proc: true
  md: 'track crossfade features, etc.


    ![](img/f23a8e45379315d1673be3d803b2f54c_122_0.png)


    Any music files saved in the user''s music folder are instantly added to the list
    when you click the Import button. To add listed tracks to your playlist, select
    **Import listed tracks**.


    ![](img/f23a8e45379315d1673be3d803b2f54c_122_1.png)


    To alter the default location of your music library, go to the RhythmBox options
    and select Library location from the menu.


    # Create playlist


    Right click on the selected track and click **Add to new playlist**. Type the
    name for the new playlist and press Enter.'
  merge: -1
  pgno: 122
- img_proc: true
  md: '![](img/f23a8e45379315d1673be3d803b2f54c_123_0.png)


    # list.


    # Add songs to playlist


    Simply drag the music into the playlist. Alternatively, right-click on the selected
    item or tracks and select **Add to Playlist**. Choose the playlist from the list.


    # Controls


    To play a song, double-click on it or select it and press the play button on the
    controls.


    ![](img/f23a8e45379315d1673be3d803b2f54c_123_1.png)


    To play, pause, and skip, you''ll see the same controls in the notification box.


    # Change properties of track


    You can change the properties of a song, such as the artist name, album, composer,
    and so on. Right-click the track and select Properties from the context menu to
    alter the property. In the properties window, change the required fields and click
    the "Close" button. You can also edit the'
  merge: -1
  pgno: 123
- img_proc: true
  md: 'properties of multiple songs at the same time. To choose multiple tracks, hold
    down the Shift key on the keyboard


    ![](img/f23a8e45379315d1673be3d803b2f54c_124_0.png)


    while selecting. Right-click the songs you want to edit and choose Properties.'
  merge: -1
