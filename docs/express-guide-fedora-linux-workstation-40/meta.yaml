    # Chapter 18


    # Manage files and folders


    Linux stores data in files. All files are organized into folders. Folders can
    have subfolders. These folders are organized into a tree-like structure known
    as a filesystem.


    # Folders


    ![](img/f23a8e45379315d1673be3d803b2f54c_99_0.png)


    All the files, whether data, program, or folder, are contained in folders. A folder
    also known as a directory is a way to organize files. These folders may have sub
    folders and further subfolder.


    In this example, abc and xyz are folders on the root and cde is a subfolder under
    abc. To represent abc and xyz , we will write /abc and /xyz respectively. To represent
    cde, we will write /abc/cde.


    # Path


    A file or folder''s "path" is its location.'
  - '[PAGE 100]


    # Home folder


    In a multi-user environment, every user has his own home folder. The home folder
    holds the user''s personnel files, including documents, pictures, music, and videos.


    Files, The file manager


    ![](img/f23a8e45379315d1673be3d803b2f54c_100_0.png)


    Fedora provides Files as the file manager for exploring files and folders on your
    computer and on external storage devices like external hard disks, USB drives,
    or DVDROMs. The File Manager can also explore files on remote file servers and
    network shares.


    To open the file manager, click the files icon on the dash bar or type files in
    the search bar.


    # Basics of File manager


    The file manager is divided into two panes: one on the left is a side bar (bookmark
    bar), and one on the right is the primary display area. The top bar starts with
    global search button from the right side. This global search feature is introduced
    in GNOME 46. It''s an easy feature to use: just click the new global search button
    or use the `Ctrl+Shift+F` shortcut to activate it, then type your query to search
    all of your configured search locations.


    **Navigation Buttons:** The back (less than sign) and forward (greater than sign)
    buttons are located on the left side of the address bar. These navigation buttons
    function similarly to forward and backward buttons on web browsers.


    **Main Menu:** You can adjust the preferences of the right pane by clicking the
    Menu button in the top bar.'
  - '[PAGE 101]


    # **Address Bar:**


    The Address bar appears center of the top bar. The address bar is the primary
    navigation tool, displaying the current location. Clicking on the address bar
    or pressing Ctrl+L activates an editable field where you can type or paste paths,
    URLs, or keywords to navigate directly to a location.


    # **Context Menu:**


    The address bar is followed by the address bar context menu, which contains options
    relevant to the address bar item. The context menu typically allows to create
    new folder , edit location, copy location, open terminal and properties.


    # **Search:**


    The Search symbol is used to look for files and folders in the current folder.


    # **Toggle View:**


    The toggle view allows you to switch between icon and list views. Next to the
    toggle view button, there is a drop down menu where you can alter the viewable
    columns and sort options.


    ![](img/f23a8e45379315d1673be3d803b2f54c_101_0.png)


    # **Exploring the contents of folders**'
  - '[PAGE 102]


    # **Main view area:**


    Double-click any folder in the main view area to list its contents. To open a
    file, either double-click it or use your mouse''s middle wheel button. To go back
    to the previous location, either click the back button from the top bar or click
    the location folder from the path bar. The file manager furthermore provides a
    tab view to manage files and folders. To open a folder in a new tab, use the mouse''s
    middle button or right-click on the folder and select **Open in new tab**. You
    can also right-click a folder to open it in a new window. Press the search icon
    to find any file or folder.


    # **Side Bar:**


    The side bar, known as the "favorite bar," shows bookmarks like documents, desktops,
    music, pictures, etc. You can also add your own frequently used folders as bookmarks
    in the side bar. To add your folder as a bookmark, drag the folder to the side
    bar, and drop it over the **New Bookmark**, which appears dynamically.


    ![](img/f23a8e45379315d1673be3d803b2f54c_102_0.png)


    # **Context menu**


    Right-clicking the mouse on any file or folder shows a context menu. From this
    context menu, you can perform various tasks like renaming, copying, pasting, moving
    to trash, etc. Being a context menu, it varies according to the selected object.'
  - '[PAGE 103]


    ![](img/f23a8e45379315d1673be3d803b2f54c_103_0.png)


    # ## Rename a file or folder


    To change the name of a file or folder, right-click the folder or file and select
    **Rename** from the context menu. Rename the file or folder using the keyboard;
    select the file or folder and press the F2 key on the keyboard.


    Write the new name of the file or folder in the dialogue box and press **Rename**.'
  - '[PAGE 104]


    ![](img/f23a8e45379315d1673be3d803b2f54c_104_0.png)


    ![](img/f23a8e45379315d1673be3d803b2f54c_104_1.png)


    # Copy


    There are multiple ways to copy files.


    # Using mouse


    +   1. Right click on the file or folder you want to copy.

    2. From the context menu select **Copy**.

    3. Now open the target folder where you want to copy the file or folder.'
  - '[PAGE 105]


    4. Right click and select **Paste** from the context


    ![](img/f23a8e45379315d1673be3d803b2f54c_105_0.png)


    menu.


    # **Using keyboard.**


    +   1. Select the file or folder you want copy.

    2. Press the Ctrl + C keys simultaneously.

    3. Navigate to the desired location.

    4. To paste, press the Ctrl + V keyboard shortcut.


    # **Move file or folder.**


    To move file or folder.


    # **Using mouse**


    +   1. Right click on the file or folder to move and select **Cut** from the context
    menu.

    2. Open the target location.

    3. Right click on the mouse and select **Paste** from the context menu.


    # **Using Keyboard**


    +   1. Select the file or folder you want to move.'
  - '[PAGE 106]


    +   2. Press the Ctrl +X keys simultaneously to cut.

    3. Navigate to the desired location.

    4. To paste, press Ctrl + V.


    # **Drag and drop to copy or move files**


    To copy a file from one source to another using drag and drop use following procedure:


    +   1. Navigate to the folder containing the file you want to copy (source folder).

    2. Navigate to the target folder where you wish to copy the file by opening a
    new window or tab.

    3. Position both windows side by side.


    ![](img/f23a8e45379315d1673be3d803b2f54c_106_0.png)


    +   4. Go to the source window.'
  - '[PAGE 107]


    5. Click and hold the left mouse button while pressing the Ctrl key on the file
    or folder you wish to copy. Drag the file or folder to the target window, then
    release both buttons to copy it. If you wish to move a folder, don''t use the
    Ctrl key when dragging it.


    ![](img/f23a8e45379315d1673be3d803b2f54c_107_0.png)


    # ## Delete


    If the file or folder is no longer required, you can delete it to free up the
    space on the disk.


    +   1. Select the file or folder to delete.


    ![](img/f23a8e45379315d1673be3d803b2f54c_107_1.png)


    +   2. Right click on the mouse and select **Move to Trash** from the context
    menu.'
  - '[PAGE 108]


    Or


    Press Delete key from the keyboard.


    The files will be moved to the trash. If you accidentally delete a file or folder,
    it can be easily restored from the trash.


    # ### Empty Trash


    ![](img/f23a8e45379315d1673be3d803b2f54c_108_0.png)


    To reclaim the space used by deleted files:-


    +   1. Right click on the trash icon on the left pane.

    2. Select **Empty Trash** from the context menu.'
  - '[PAGE 109]


    3. Press **Empty Trash** on the confirmation popup.


    ![](img/f23a8e45379315d1673be3d803b2f54c_109_0.png)'
  - '[PAGE 110]


    # To permanently delete the file without moving it to the trash


    +   1. Select the file or folder you want to delete.

    2. On your keyboard, hold down the Shift key while pressing the Delete key.

    3. It will prompt for confirmation. Press the Delete button.


    ![](img/f23a8e45379315d1673be3d803b2f54c_110_0.png)


    # Change view


    ![](img/f23a8e45379315d1673be3d803b2f54c_110_1.png)


    The file manager displays files and folders in icon view by default. To switch
    from icon view to list view and vice versa, use the toggle view button on the
    file manager''s top bar.


    Additionally, you can use the keyboard shortcuts CTRL + 1 to go to list view and
    CTRL + 2 to switch to icon view.


    # Sort


    To sort the list of files and folders in the list view.


    +   1. Toggle the view to a list view.'
- md: "Click on the heading of the column to sort the list. Press the same heading\
    \ again to sort the view in reverse order.\n\n## View Options\nIn the list view,\
    \ the view options drop-down menu allows you to zoom, sort columns, and select\
    \ which columns are visible.\n\nTo sum up, Fedora Linux's GNOME Files provides\
    \ a stable and intuitive interface that improves the entire file management experience.\
    \ Its easy navigation and effective file and directory management are made possible\
    \ by its integration with the GNOME desktop environment. With its easy design\
    \ and wide range of customization options, GNOME Files offer ease of use whether\
    \ you're managing papers, multimedia files, or apps. Using GNOME's power, Files\
    \ not only makes file operations easier but also boosts productivity with features\
    \ like split view, batch renaming, and quick access to network locations. GNOME\
    \ Files continue to be a vital tool for users looking for usefulness and dependability\
    \ in their file management chores as Fedora develops further.\n\n## Manage Users\n\
    As Linux is a multi-user operating system, it allows multiple users to access\
    \ the same system. You can create a separate user account for each user of the\
    \ computer so that every user can keep his or her data separate and safe. This\
    \ provides privacy to all users. Users can also personalize the desktop according\
    \ to their taste.\n\n### What exactly is a user?\nA **user** is anyone who uses\
    \ a computer. Linux assigns a unique user id to every user that exists on the\
    \ system, which is known as the UID or User ID. This UID is for the system's internal\
    \ use only.\n\n### Standard vs Administrator\nThe administrator is a special user\
    \ who has complete access to the operating system and its configuration. The administrator\
    \ user is intended for administrative use only. In traditional Unix systems, there\
    \ is a root user for doing administrative tasks, but in the case of modern Linux\
    \ systems, there is an option to give administrator rights to any user. You can\
    \ also fine-tune the users' rights at a granular level. The Administrator user\
    \ has unlimited privileges. An administrator can access any file, run any program,\
    \ execute any system call, and modify any setting. Unlike standard users, administrators\
    \ can access the files and folders of other users as well. During the installation,\
    \ the system creates an administrator user. When you create a new user, you have\
    \ the option to select either standard or administrator as the user account type.\n\
    \n### Add User\nTo create user:\n1. From the system menu, press **Settings**.\n\
    2. In the Settings window, select System on the left and Users on the right.\n\
    3. Press **Unlock**. Enter your password and click **Authenticate**.\n4. Press\
    \ **Add User**.\n5. In the **Add User** dialog box do the following:\n   1. Enter\
    \ the user's **Full name**.\n   2. If necessary, change the system-generated login.\n\
    \   3. Select **Standard** or **Administrator** as the user type.\n   4. You can\
    \ either set a password now or enable a user to set one on their first login.\n\
