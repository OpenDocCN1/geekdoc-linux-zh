    ## 第13章 个性化你的桌面 GNOME桌面的风格和外观可以非常轻松地修改。你可以根据自己的喜好和使用习惯定制桌面。我们将调整多个设置来自定义你的桌面，不需要修改每一个设置。
    ### 更改系统主题 GNOME 46的亮点之一就是深色主题。要修改系统主题： - 1. 在**系统菜单**中点击**设置**图标。![](img/f23a8e45379315d1673be3d803b2f54c_63_0.png)
