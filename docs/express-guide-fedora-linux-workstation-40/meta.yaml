    ## Chapter 18: Manage files and folders

    Linux stores data in files. All files are organized into folders. Folders can
    have subfolders. These folders are organized into a tree-like structure known
    as a filesystem.


    ### Folders

    ![](img/f23a8e45379315d1673be3d803b2f54c_99_0.png)

    All the files, whether data, program, or folder, are contained in folders. A folder,
    also known as a directory, is a way to organize files. These folders may have
    subfolders and further subfolders. In this example, abc and xyz are folders on
    the root, and cde is a subfolder under abc. To represent abc and xyz, we will
    write /abc and /xyz respectively. To represent cde, we will write /abc/cde.


    ### Path

    A file or folder''s "path" is its location.


    ### Home folder

    In a multi-user environment, every user has his own home folder. The home folder
    holds the user''s personal files, including documents, pictures, music, and videos.


    The file manager

    ![](img/f23a8e45379315d1673be3d803b2f54c_100_0.png)

    Fedora provides Files as the file manager for exploring files and folders on your
    computer and on external storage devices like external hard disks, USB drives,
    or DVD-ROMs. The file manager can also explore files on remote file servers and
    network shares. To open the file manager, click the Files icon on the dash bar
    or type "files" in the search bar.


    ### Basics of File manager

    The file manager is divided into two panes: one on the left is a side bar (bookmark
    bar), and one on the right is the primary display area. The top bar has the global
    search button on the right side. This global search feature is introduced in GNOME
    46. It is easy to use: just click the new global search button or use the `Ctrl+Shift+F`
    shortcut to activate it, then type your query to search all of your configured
    search locations.


    #### Navigation Buttons:

    The back (<) and forward (>) buttons are located on the left side of the address
    bar. These navigation buttons function similarly to forward and backward buttons
    on web browsers.


    #### Main Menu:

    You can adjust the preferences of the right pane by clicking the Menu button in
    the top bar.


    #### Address Bar:

    The address bar appears in the center of the top bar. It is the primary navigation
    tool, displaying the current location. Clicking on the address bar or pressing
    Ctrl+L activates an editable field where you can type or paste paths, URLs, or
    keywords to navigate directly to a location.


    #### Context Menu:

    The context menu next to the address bar contains options relevant to the address
    bar item. It typically allows you to create a new folder, edit a location, copy
    a location, open a terminal, and view properties.


    #### Search:

    The Search icon is used to look for files and folders in the current folder.


    #### Toggle View:

    The toggle view allows you to switch between icon and list views. Next to the
    toggle view button, there is a drop-down menu where you can alter the viewable
    columns and sort options.

    ![](img/f23a8e45379315d1673be3d803b2f54c_101_0.png)


    #### Exploring the contents of folders

    #### Main view area:

    Double-click any folder in the main view area to list its contents. To open a
    file, either double-click it or use your mouse''s middle wheel button. To go back
    to the previous location, either click the back button on the top bar or click
    the location folder in the path bar. The file manager also provides a tab view
    to manage files and folders. To open a folder in a new tab, use the mouse''s middle
    button or right-click on the folder and select **Open in new tab**. You can also
    right-click a folder to open it in a new window. Press the search icon to find
    any file or folder.


    #### Side Bar:

    The side bar, known as the "favorite bar," shows bookmarks such as Documents,
    Desktop, Music, Pictures, etc. You can also add your own frequently used folders
    as bookmarks in the side bar. To add a folder as a bookmark, drag the folder to
    the side bar and drop it over **New Bookmark**, which appears dynamically.

    ![](img/f23a8e45379315d1673be3d803b2f54c_102_0.png)


    #### Context menu

    Right-clicking on any file or folder opens a context menu. From this context menu,
    you can perform various tasks such as renaming, copying, pasting, moving to trash,
    etc. The options in the context menu vary depending on the selected object.

    ![](img/f23a8e45379315d1673be3d803b2f54c_103_0.png)


    ### Rename a file or folder

    To change the name of a file or folder, right-click the file or folder and select
    **Rename** from the context menu. You can also rename a file or folder by selecting
    it and pressing the F2 key on the keyboard. Type the new name for the file or
    folder in the dialogue box and press **Rename**.

    ![](img/f23a8e45379315d1673be3d803b2f54c_104_0.png)

    ![](img/f23a8e45379315d1673be3d803b2f54c_104_1.png)


    ### Copy

    There are multiple ways to copy files.


    #### Using mouse

    - Right-click on the file or folder you want to copy.

    - From the context menu, select **Copy**.

    - Open the target folder where you want to paste the file or folder.

    - Right-click and select **Paste** from the context menu.

    ![](img/f23a8e45379315d1673be3d803b2f54c_105_0.png)


    #### Using keyboard

    - Select the file or folder you want to copy.

    - Press Ctrl+C simultaneously.

    - Navigate to the desired location.

    - To paste, press Ctrl+V.


    ### Move file or folder

    To move a file or folder, you can use the following methods:


    #### Using mouse

    - Right-click on the file or folder you want to move and select **Cut** from the
    context menu.

    - Open the target location.

    - Right-click and select **Paste** from the context menu.


    #### Using Keyboard

    - Select the file or folder you want to move.

    - Press Ctrl+X simultaneously to cut.

    - Navigate to the desired location.

    - To paste, press Ctrl+V.


    ### Drag and drop to copy or move files

    To copy a file from one location to another using drag and drop, follow this procedure:

    - Navigate to the folder containing the file you want to copy (source folder).

    - Navigate to the target folder where you wish to copy the file by opening a new
    window or tab.

    - Position both windows side by side.

    ![](img/f23a8e45379315d1673be3d803b2f54c_106_0.png)

    - Go to the source window.

    - Click and hold the left mouse button on the file or folder you wish to copy,
    then press the Ctrl key. Drag the file or folder to the target window and release
    both buttons to copy it. If you want to move a file or folder, do not press the
    Ctrl key while dragging.

    ![](img/f23a8e45379315d1673be3d803b2f54c_107_0.png)


    ### Delete

    If a file or folder is no longer needed, you can delete it to free up disk space.

    - Select the file or folder you want to delete.

    - Right-click and select **Move to Trash** from the context menu.

    Alternatively, press the Delete key on your keyboard. The selected file or folder
    will be moved to the trash. If you accidentally delete a file or folder, you can
    easily restore it from the trash.

    ![](img/f23a8e45379315d1673be3d803b2f54c_107_1.png)


    #### Empty Trash

    ![](img/f23a8e45379315d1673be3d803b2f54c_108_0.png)

    To reclaim the disk space occupied by deleted files:

    - Right-click on the trash icon in the left pane.

    - Select **Empty Trash** from the context menu.

    - Press **Empty Trash** on the confirmation pop-up.

    ![](img/f23a8e45379315d1673be3d803b2f54c_109_0.png)


    #### Permanently delete files without moving to trash

    To permanently delete a file or folder without moving it to the trash:

    - Select the file or folder you want to delete.

    - Hold down the Shift key on your keyboard while pressing the Delete key.

    - Confirm the action by pressing the Delete button in the prompt.

    ![](img/f23a8e45379315d1673be3d803b2f54c_110_0.png)


    ### Change view

    ![](img/f23a8e45379315d1673be3d803b2f54c_110_1.png)

    The file manager displays files and folders in icon view by default. To switch
    between icon view and list view, use the toggle view button on the file manager''s
    top bar. You can also use the keyboard shortcuts Ctrl+1 to switch to list view
    and Ctrl+2 to switch to icon view.


    ### Sort

    To sort files and folders in list view:

    - Toggle the view to list view.'
  mdcn: '要删除软件仓库，请从/etc/yum.repos.d/目录中删除对应的.repo文件。高效的仓库管理对于从各类来源安装和更新软件包至关重要。请根据你自身的仓库配置和需求调整命令。在Fedora系统上添加或管理仓库时，务必优先保障安全性和可靠性。

    ## 第18章：管理文件和文件夹

    Linux将数据存储在文件中。所有文件都被整理到文件夹中。文件夹可以包含子文件夹。这些文件夹以树状结构组织，这种结构被称为文件系统。

    ### 文件夹

    ![](img/f23a8e45379315d1673be3d803b2f54c_99_0.png)

    所有文件，无论是数据、程序还是文件夹，都存放在文件夹中。文件夹也被称为目录，是组织文件的一种方式。这些文件夹可以包含子文件夹，甚至多级子文件夹。在本例中，abc和xyz是根目录下的文件夹，cde是abc下的子文件夹。表示abc和xyz时，我们分别写为/abc和/xyz；表示cde时，写为/abc/cde。

    ### 路径

    文件或文件夹的“路径”就是它的存储位置。

    ### 主文件夹

    在多用户环境中，每位用户都有自己的主文件夹。主文件夹用于存放用户的个人文件，包括文档、图片、音乐和视频。

    文件管理器![](img/f23a8e45379315d1673be3d803b2f54c_100_0.png)

    Fedora系统自带“文件”这款文件管理器，可用于浏览计算机内以及外置硬盘、U盘、DVD-ROM等外部存储设备上的文件和文件夹。该文件管理器还支持浏览远程文件服务器和网络共享中的文件。要打开文件管理器，可以点击停靠栏上的“文件”图标，也可以在搜索栏中输入“files”来启动。

    ### 文件管理器基础

    文件管理器分为两个窗格：左侧是侧边栏（书签栏），右侧是主显示区域。顶部栏的右侧有全局搜索按钮，该功能随GNOME 46一同推出，使用十分简便：只需点击新的全局搜索按钮，或使用`Ctrl+Shift+F`快捷键激活它，然后输入搜索内容即可搜索所有已配置的搜索位置。

    #### 导航按钮：

    后退（<）和前进（>）按钮位于地址栏左侧。这两个导航按钮的功能与网页浏览器中的前进、后退按钮类似。

    #### 主菜单：

    点击顶部栏上的菜单按钮，即可调整右侧窗格的偏好设置。

    #### 地址栏：

    地址栏位于顶部栏的中央，是主要的导航工具，会显示当前所在位置。点击地址栏，或按下Ctrl+L组合键，即可激活可编辑输入框，你可以在其中输入或粘贴路径、网址或关键词，直接跳转到目标位置。

    #### 上下文菜单：

    地址栏旁的上下文菜单会显示与当前地址栏条目相关的选项，通常支持新建文件夹、编辑位置、复制位置、打开终端以及查看属性等操作。

    #### 搜索：

    搜索图标用于在当前文件夹中查找文件和文件夹。

    #### 切换视图：

    切换视图按钮可用于在图标视图和列表视图之间切换。切换视图按钮旁有一个下拉菜单，你可以在其中修改可显示的列以及排序选项。

    ![](img/f23a8e45379315d1673be3d803b2f54c_101_0.png)

    #### 浏览文件夹内容

    #### 主显示区域：

    双击主显示区域中的任意文件夹，即可列出其内容。要打开文件，可以双击该文件，也可以使用鼠标的中键。要返回上一位置，可以点击顶部栏上的返回按钮，或者点击路径栏中的位置文件夹。文件管理器还支持标签页视图，方便你管理文件和文件夹。要在新标签页中打开文件夹，可以使用鼠标中键点击该文件夹，也可以在文件夹上单击右键，选择**在新标签页中打开**。你也可以通过右键单击文件夹，在新窗口中打开它。点击搜索图标即可查找任意文件或文件夹。

    #### 侧边栏：

    侧边栏也被称为“收藏栏”，会显示文档、桌面、音乐、图片等书签。你也可以将自己常用的文件夹添加到侧边栏作为书签：将文件夹拖拽到侧边栏，再放到动态显示的**新建书签**上即可完成添加。

    ![](img/f23a8e45379315d1673be3d803b2f54c_102_0.png)

    #### 上下文菜单

    右键单击任意文件或文件夹即可打开上下文菜单，你可以通过该菜单执行重命名、复制、粘贴、移至回收站等各类操作。上下文菜单中的选项会根据所选对象的不同而变化。

    ![](img/f23a8e45379315d1673be3d803b2f54c_103_0.png)

    ### 重命名文件或文件夹

    要修改文件或文件夹的名称，右键单击该文件或文件夹，然后在上下文菜单中选择**重命名**。你也可以选中文件或文件夹后，按下键盘上的F2键来重命名。在对话框中输入文件或文件夹的新名称，然后按下**重命名**即可。

    ![](img/f23a8e45379315d1673be3d803b2f54c_104_0.png)

    ![](img/f23a8e45379315d1673be3d803b2f54c_104_1.png)

    ### 复制

    复制文件有多种方法。

    #### 使用鼠标

    - 右键单击你想要复制的文件或文件夹。

    - 在上下文菜单中选择**复制**。

    - 打开你要粘贴文件或文件夹的目标文件夹。

    - 右键单击，然后在上下文菜单中选择**粘贴**。

    ![](img/f23a8e45379315d1673be3d803b2f54c_105_0.png)

    #### 使用键盘

    - 选中你想要复制的文件或文件夹。

    - 同时按下Ctrl+C组合键。

    - 跳转到目标位置。

    - 要粘贴，按下Ctrl+V组合键。

    ### 移动文件或文件夹

    要移动文件或文件夹，你可以使用以下方法：

    #### 使用鼠标

    - 右键单击你想要移动的文件或文件夹，然后在上下文菜单中选择**剪切**。

    - 打开目标位置。

    - 右键单击，然后在上下文菜单中选择**粘贴**。

    #### 使用键盘

    - 选中你想要移动的文件或文件夹。

    - 同时按下Ctrl+X组合键进行剪切。

    - 跳转到目标位置。

    - 要粘贴，按下Ctrl+V组合键。

    ### 通过拖放复制或移动文件

    要通过拖放方式将文件从一个位置复制到另一个位置，请按以下步骤操作：

    - 跳转到包含你想要复制的文件的文件夹（源文件夹）。

    - 打开新窗口或标签页，跳转到你想要复制文件的目标文件夹。

    - 将两个窗口并列摆放。

    ![](img/f23a8e45379315d1673be3d803b2f54c_106_0.png)

    - 切换到源窗口。

    - 在你想复制的文件或文件夹上单击鼠标左键并按住，然后按下Ctrl键，将文件或文件夹拖拽到目标窗口，松开鼠标和Ctrl键即可完成复制。如果要移动文件或文件夹，拖拽时无需按下Ctrl键。

    ![](img/f23a8e45379315d1673be3d803b2f54c_107_0.png)

    ### 删除

    如果文件或文件夹不再需要，你可以将其删除以释放磁盘空间。

    - 选中你想要删除的文件或文件夹。

    - 右键单击，然后在上下文菜单中选择**移至回收站**。你也可以直接按下键盘上的Delete键。选中的文件或文件夹会被移入回收站，如果不小心误删了文件或文件夹，你可以很轻松地从回收站中恢复它。

    ![](img/f23a8e45379315d1673be3d803b2f54c_107_1.png)

    #### 清空回收站

    ![](img/f23a8e45379315d1673be3d803b2f54c_108_0.png)

    要回收被删除文件占用的磁盘空间：

    - 右键单击左侧窗格中的回收站图标。

    - 在上下文菜单中选择**清空回收站**。

    - 在确认弹窗中按下**清空回收站**。

    ![](img/f23a8e45379315d1673be3d803b2f54c_109_0.png)

    #### 不经过回收站直接永久删除文件

    要不经过回收站直接永久删除文件或文件夹：

    - 选中你想要删除的文件或文件夹。

    - 按住键盘上的Shift键，同时按下Delete键。

    - 在提示窗口中按下Delete键确认操作。

    ![](img/f23a8e45379315d1673be3d803b2f54c_110_0.png)

    ### 更改视图

    ![](img/f23a8e45379315d1673be3d803b2f54c_110_1.png)

    文件管理器默认以图标视图显示文件和文件夹。要切换图标视图和列表视图，可以使用文件管理器顶部栏上的切换视图按钮。你也可以使用快捷键Ctrl+1切换到列表视图，使用Ctrl+2切换到图标视图。

    ### 排序

    要在列表视图中对文件和文件夹进行排序：

    - 切换到列表视图。

