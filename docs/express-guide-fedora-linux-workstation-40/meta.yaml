  md: '# Chapter 18


    # Manage files and folders


    Linux stores data in files. All files are organized into folders. Folders can
    have subfolders. These folders are organized into a tree-like structure known
    as a filesystem.


    # Folders


    ![](img/f23a8e45379315d1673be3d803b2f54c_99_0.png)


    All the files, whether data, program, or folder, are contained in folders. A folder
    also known as a directory is a way to organize files. These folders may have sub
    folders and further subfolder.


    In this example, abc and xyz are folders on the root and cde is a subfolder under
    abc. To represent abc and xyz , we will write /abc and /xyz respectively. To represent
    cde, we will write /abc/cde.


