  md: '![](img/f23a8e45379315d1673be3d803b2f54c_115_0.png)


    You can find the recently created user under other users.


    # Test new user


    To test this user, go to the System menu, select **Power off/ LogOut**, and then
    press **Log Out**.


    At the login screen, select the user and provide a password. Press the ENTER key.


    Enter the new password and press the ENTER key if you selected **Allow user to
    set a password when they login the next time**. Enter the same password again,
    then press the ENTER key.


    After login, proceed with the post-installation steps.


    # Modify user'
