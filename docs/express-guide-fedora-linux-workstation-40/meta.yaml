    ## Interface

    In the centre of the top bar, there are three tabs: **Explore**, **Installed**,
    and **Updates**. The Explore tab shows the list of all available software arranged
    in categories. The Installed tab shows the list of all currently installed software
    on your computer. The Updates tab shows the list of any updates available for
    the software currently installed on your computer. To manage repositories and
    update preferences, use the menu button.


    ## Install Software

    ### Install using categories

    The Explore tab shows software arranged in categories. You can click on any category
    to explore the list of available software.

    - 1. Select a category. For example, we select "Work".

    ![](img/f23a8e45379315d1673be3d803b2f54c_86_0.png)

    - 2. Click the required software from the list. The software with a blue tick
    is already installed software.

    ![](img/f23a8e45379315d1673be3d803b2f54c_87_0.png)

    - 3. Press **Install** on the software description screen.

    - 4. On the authentication screen, provide your password and press **Authenticate**.

    - 5. The progress bar shows the percentage of completion.


    ### **Search and install**

    If you know the name of the software to install, searching is the best way to
    install the software. On the first screen, press the search icon. In the search
    bar, type the name of the software you want to install. Suppose you want to install
    **Shotwell**.

    - 1. Write shotwell in the search bar.

    ![](img/f23a8e45379315d1673be3d803b2f54c_87_1.png)

    - 2. From the list of software, click the software to install.

    ![](img/f23a8e45379315d1673be3d803b2f54c_88_0.png)

    - 3. On the software description screen, press **Install**.

    - 4. The installation process will start. The progress bar will display the installation
    progress.


    ### Remove installed software.

    At some point in time, you may need to delete the installed application to free
    up the space on the disk. To remove the installed application, open the Software
    Centre.

    - 1. Click the **Installed** tab and select the software to remove. Suppose you
    want to remove software named **Boxes**.

    - 2. Press the **Uninstall** button.

    ![](img/f23a8e45379315d1673be3d803b2f54c_88_1.png)

    - 3. Press **Uninstall** again for confirmation.

    ![](img/f23a8e45379315d1673be3d803b2f54c_89_0.png)

    - 4. The removal process will start.

