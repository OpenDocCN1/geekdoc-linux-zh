    ![](img/f23a8e45379315d1673be3d803b2f54c_17_1.png)

    - 6. 按下**安装Fedora**选项。

    - 7. 选择语言与键盘布局。

    ![](img/f23a8e45379315d1673be3d803b2f54c_18_0.png)

    ![](img/f23a8e45379315d1673be3d803b2f54c_18_1.png)

    - 8. 点击“安装目标位置”（带有橙色标识的选项）。


    ### **磁盘配置：**

    Fedora工作站版安装时默认使用的文件系统是Btrfs（B树文件系统）。Btrfs是一款现代写时复制（COW）文件系统，相较于Ext4等早期文件系统，具备快照、子卷等多种高级功能。工作站版安装过程中，你可以选择自动存储配置，该配置的磁盘布局如下：

    | 挂载点 | 功能 | 文件系统类型 |

    |-------------|----------|-----------------|

    | /boot/efi | EFI系统分区 | FAT 32 |

    | /boot | 启动分区 | ext4 |

    | / | 根子卷 | Btrfs |

    | /home | 用户home子卷 | Btrfs |

    根子卷用于存储系统安装文件，用户home子卷则存储用户数据及相关设置。


    ### **交换空间：**

    如果你此前使用过Fedora或其他Linux系统，可能对交换空间有所了解。Fedora工作站版不使用独立的交换分区，而是采用ZRAM。ZRAM是Linux的一项新特性，它将交换文件存储在压缩后的内存中，而非此前使用的硬盘中。内存的读写速度本来就远快于硬盘。在Fedora工作站版的安装器磁盘分区环节，除了默认的自动存储配置外，你还可以选择多种其他磁盘配置选项。这些选项可以让你根据自身需求自定义驱动器的分区与使用方式，满足复杂存储配置或特定需求。以下是一些可供选择的自定义磁盘配置选项：

    - **手动配置：** 你可以根据自身偏好手动配置分区，而非使用安装器自动分区。

