    ## **Command line**

    ### **DNF**

    DNF is a command-line software management tool for RPM-based operating systems
    like Fedora, Red Hat, and CentOS. You can also use the old **yum** command instead
    of **DNF**. Most package management tasks, such as modifying system-wide configurations
    and installing applications, require administrative privileges (via sudo). As
    a result, the DNF command should be followed by a sudo command, with your own
    password entered at the password prompt.


    #### List all repositories

    This command will show all repositories with their status (enabled /disabled)

    ##### Syntax

    ```bash

    dnf repolist all

    ```

    ##### Example

    ![](img/f23a8e45379315d1673be3d803b2f54c_90_0.png)


    #### Install package

    ##### Syntax

    ```bash

    dnf install software_name

    ```

    ##### Example

    ```bash

    sudo dnf install thunderbird

    ```


    #### Remove

    ##### Syntax

    ```bash

    dnf remove software_name

    ```

    ##### Example

    ```bash

    sudo dnf remove thunderbird

    ```


    #### Update packages

    To keep all installed software up to date

    ##### Syntax

    ```bash

    dnf update

    ```

    ##### Example

    ```bash

    sudo dnf -y update

    ```

    It will ask for confirmation before downloading and installing them. Type y and
    click Enter to continue with the updates.


    #### Update a specific package

    You can also update a specific package by specifying its name

    ##### Syntax

    ```bash

    sudo dnf update package_name

    ```

    ##### Example

    ```bash

    sudo dnf update firefox

    ```

    It will ask for confirmation before downloading and installing them. Type y and
    click Enter to continue with the updates.


    #### Searching for packages

    ##### Syntax

    ```bash

    dnf search string

    ```

    ##### Example

    ```bash

    dnf search vim

    ```


    #### List installed packages

    ##### Syntax

    ```bash

    dnf list installed

    ```

    Applying the techniques covered in this chapter will help you maintain Fedora
    40 apps in an efficient manner, keeping your system customized and current.


    ## Chapter 17

    ### Enable third party repositories

    Third-party repositories are necessary in order to obtain proprietary and non-free
    software as well as additional codecs. Although third-party repositories can be
    enabled during post-installation stages, for some reason they are not enabled.
    The procedure is as follows to enable or disable it.


    #### Using GUI

    - 1. Open software Centre.

    - 2. Click the menu button.

    - 3. Select **Software Repositories**.

    ![](img/f23a8e45379315d1673be3d803b2f54c_93_0.png)

    ![](img/f23a8e45379315d1673be3d803b2f54c_93_1.png)

    - 4. To enable third-party repositories, toggle the switch to the on position.


    #### Using command prompt

    ##### Check the current repositories

    ```bash

    sudo dnf repolist

    ```

    ![](img/f23a8e45379315d1673be3d803b2f54c_94_0.png)


    ##### Add third party repositories provided by Fedora

    ```bash

    sudo dnf install fedora-workstation-repositories

    ```

    List all repositories after addition

    ```bash

    sudo dnf repolist all

    ```


    ##### Manage third party repositories

    The dnf config-manager command is available in Fedora to manage repository configurations.
    To add a third-party repository, follow these steps:


    ###### Enable the required repositories

    The new repositories are in a disabled state by default. To enable an individual
    repository, give the following command.

    ###### Syntax

    ```bash

    sudo dnf config-manager --set-enabled <name of repository>

    ```

    ###### Example

    ```bash

    sudo dnf config-manager --set-enabled rpmfusion-nonfree-steam

    ```


    ###### Disable repository

    Similarly, individual repositories can be disabled if not required.

    ###### Syntax

    ```bash

    sudo dnf config-manager --set-disabled <name of repository>

    ```

    ###### Example

    ```bash

    sudo dnf config-manager --set-disabled rpmfusion-nonfree-steam

    ```


    ##### Remove third party repositories

    To **remove** third party repositories

    ```bash

    sudo dnf remove fedora-workstation-repositories

    ```


    #### Repo file

    In Fedora and other Linux distributions based on Red Hat (like CentOS), a .repo
    file serves as a configuration file for the dnf package manager. The information
    in these files, which are normally found in the /etc/yum.repos.d/ directory, is
    required for the system to obtain and install software packages from particular
    repositories. To add a new repository to Fedora, you usually create a .repo file
    in the /etc/yum.repos.d/ folder. The format of this .repo file is as follows:

    ```ini

    [Name]

    name=Name of the repository

    baseurl=https://example.com/repo/fedora/$releasever/$basearch/

    enabled=1

    gpgcheck=1

    gpgkey=https://example.com/repo/RPM-GPG-KEY-example

    ```


    #### Description of fields

    - **name**: Name of the repository.

    - **baseurl**: URL location where repository metadata and packages are located.

    - **enabled**: 1 to enable the repository, 0 to disable it.

    - **gpgcheck**: 1 to enable GPG signature verification, 0 to disable it.

    - **gpgkey**: URL or local path to the GPG key used for package signing.


    > **GPG keys**

    > Cryptographic keys known as GPG keys are used to confirm the integrity and validity
    of software packages that are downloaded from repositories. Usually, every repository
    has one or more GPG keys attached to it. To make sure the packages you install
    are authentic and unaltered, you might need to import and trust a repository''s
    GPG key when you add it to your system.


    ```ini

    user1@fedora:/etc/yum.repos.d$ cat google-chrome.repo

    [google-chrome]

    name=google-chrome

    baseurl=https://dl.google.com/linux/chrome/rpm/stable/x86_64

    skip_if_unavailable=True

    gpgcheck=1

    gpgkey=https://dl.google.com/linux/linux_signing_key.pub

    enabled=0

    ```


    #### Define additional third-party repositories

    Adding a third-party repository to your system typically involves multiple steps,
    including installing a repository definition file provided by the third party.
    However, before adding anything, you should remember that third-party repositories
    can pose problems if not adequately maintained or trusted. Before adding any third-party
    repositories to your system, always double-check their source and stability. Here''s
    an overview of how you can accomplish this:

    ##### Syntax

    ```bash

    sudo dnf config-manager --add-repo https://url.com/name.repo

    ```

    This will add repo file in your system and define repository. You can also manually
    download the repo file and copy it to the `/etc/yum.repos.d` directory.


    #### Updating repository metadata

    Use dnf to update the repository information after adding or changing repositories.

    ##### Syntax

    ```bash

    sudo dnf clean expire-cache

    sudo dnf repolist

    ```


