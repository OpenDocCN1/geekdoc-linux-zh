  md: '![](img/f23a8e45379315d1673be3d803b2f54c_133_0.png)


    ![](img/f23a8e45379315d1673be3d803b2f54c_133_1.png)


    Shotwell also provides some basic tools for photo manipulation in the bottom bar,
    such as red eye reduction, straightening, rotating, and enhancement. To adjust
    the settings, select the image and then click the button at the bottom.


    # **EXIF information**


    The EXIF information of a photograph, such as shutter speed, ISO, aperture, and
    other parameters, is available in the left pane for photography enthusiasts.


    In conclusion, Shotwell in provides a simple and straightforward way to manage
    and edit images. Its seamless integration with GNOME and simple UI make it an
    invaluable tool for managing and improving your photo collection. Use Shotwell''s
    capabilities such as tagging, editing, and sharing to improve your photographic
    workflow.'
