  md: 'To save the file press Ctrl + o. The editor will ask for the file name.


    # **Search and replace**


    Press Ctrl + w and type the text to search for it in the document. To find the
    text''s next occurrence, press Alt + w.


    Press Ctrl + \ and type the text you want to search for, then type the text you
    want to replace it with, and then press enter. To replace, press **y**, or to
    replace all, press **a**.


    # **Navigating**


    You may navigate around the text editor by using the arrow keys. Ctrl + a will
    move the cursor to the Home position. Ctrl + e will move the cursor to the end.


    # **Copy and Paste**


    To select text, use Ctrl + ^ at the beginning and Alt + ^ at the end. To paste,
    move the cursor to the desired location and hit Ctrl + o.


    # **Cut and paste**


    At the beginning position, press Ctrl + ^. Move the cursor over the text to select
    it, then hit Ctrl + k to end the selection and cut the text. To paste, move the
    cursor to the desired location and hit Ctrl + u.


    # **Justify Text**


    To justify text, press Ctrl + j. (wrap the text on the screen)


    # **Exit**


    Ctrl+x will exit nano. If there are any unsaved changes, you will be prompted
    to save them.'
