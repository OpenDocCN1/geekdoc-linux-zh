    **Network**


    # What exactly is a computer network?


    A computer network is a collection of linked computers and computing equipment.
    This connection allows communication between the many computers and gadgets in
    that group. Computers and equipment can communicate by wire, fibre optic, or microwave.
    There are several types of networks, but we will concentrate on TCP/IP because
    it is the most widely used. TCP/IP is widely used in both local area networks
    (LAN) and wide area networks (WAN), including the internet.


    A network is commonly used on personal computers to connect to the internet or
    to share files and printers. Network connectivity can be wired or wireless, such
    as Wi-Fi. This chapter will go over both types of networking.


    # 📶 Connecting Wireless connection.


