    # ## Add user


    Syntax


    ```

    useradd options username

    ```


    Example


    ```

    sudo useradd david

    ```


    # ## Change User


    Syntax


    ```

    usermod options username

    ```


    Example


    ```

    sudo usermod -c "David karl" david

    ```


    In this example, the full name is changed to David Karl.


    # ## Remove user


    Syntax


    ```

    userdel username

    ```


    Example


    ```

    sudo userdel david

    ```


    # ## Change own password


    Syntax


    ```

    passwd

    ```


