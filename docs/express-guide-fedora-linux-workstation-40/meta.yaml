- img_proc: true
  md: '+   5. Select **Start Fedora-Workstation-Live 40**. Press Enter.


    ![](img/f23a8e45379315d1673be3d803b2f54c_17_0.png)


    +   6. Press **Install Fedora**.


    ![](img/f23a8e45379315d1673be3d803b2f54c_17_1.png)


    7. Choose a language and a keyboard.'
