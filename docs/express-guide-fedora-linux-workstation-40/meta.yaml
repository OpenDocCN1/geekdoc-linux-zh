  md: 'to the top bar now. Another method is to double-click the mouse''s left button
    on the window''s title bar. Using the keyboard, hit Super + UP arrow to maximize
    a window.


    # Unmaximize window


    To return a window to its original size, grab the window title bar and drag away
    from the top bar, or simply double-click the window title bar. To unmaximize the
    windows using the keyboard, press Super + Down arrow.


    # Tile Windows (Snap Windows)


    ![](img/f23a8e45379315d1673be3d803b2f54c_40_0.png)


    You can set two windows side by side to copy files or compare the contents of
    two windows. This function is called as Windows Snap in Microsoft Windows. To
