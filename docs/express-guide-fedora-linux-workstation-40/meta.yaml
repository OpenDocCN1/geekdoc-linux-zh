    - 4. 安装流程会启动，进度条会展示安装进度。

    ### 卸载已安装软件

    某些时候你可能需要删除已安装的应用来释放磁盘空间。

    要卸载已安装的应用，先打开软件中心。

    - 1. 点击 **已安装** 标签页，选择要卸载的软件，这里假设你要卸载名为 **Boxes** 的软件。

    - 2. 点击 **卸载** 按钮。

    ![](img/f23a8e45379315d1673be3d803b2f54c_88_1.png)

    - 3. 再次点击 **卸载** 确认操作。

    ![](img/f23a8e45379315d1673be3d803b2f54c_89_0.png)

    - 4. 卸载流程会启动。

    - 5. 卸载完成后，该软件会从已安装列表中消失。

    ## **命令行**

    ### **DNF**

    DNF 是面向 Fedora、Red Hat、CentOS 等基于 RPM 包管理系统的操作系统的命令行软件管理工具。

    你也可以使用旧的 **yum** 命令替代 DNF。

    大多数包管理操作，比如修改系统全局配置、安装应用等，都需要管理员权限（通过 sudo 获取）。

    因此使用 DNF 命令时需要在后面跟上 sudo 命令，并在密码提示处输入你自己的用户密码。

    #### 列出所有软件源

    该命令会展示所有软件源及其状态（启用/禁用）

    ##### 语法

    ```bash

    dnf repolist all

    ```

    ##### 示例

    ![](img/f23a8e45379315d1673be3d803b2f54c_90_0.png)

    #### 安装软件包

    ##### 语法

    ```bash

    dnf install software_name

    ```

    ##### 示例

    ```bash

    sudo dnf install thunderbird

    ```

    #### 卸载软件包

    ##### 语法

    ```bash

    dnf remove software_name

    ```

    ##### 示例

    ```bash

    sudo dnf remove thunderbird

    ```

    #### 更新所有软件包

    用于将所有已安装软件更新到最新版本

    ##### 语法

    ```bash

    dnf update

    ```

    ##### 示例

    ```bash

    sudo dnf -y update

    ```

    下载并安装更新前会要求确认，输入 y 并按回车键即可继续更新。

    #### 更新指定软件包

    你也可以通过指定软件包名称来更新单个软件包

    ##### 语法

    ```bash

    sudo dnf update package_name

    ```

    ##### 示例

    ```bash

    sudo dnf update firefox

    ```

    下载并安装更新前会要求确认，输入 y 并按回车键即可继续更新。

    #### 搜索软件包

    ##### 语法

    ```bash

    dnf search string

    ```

    ##### 示例

    ```bash

    dnf search vim

    ```

    #### 列出已安装软件包

    ##### 语法

    ```bash

    dnf list installed

    ```

    运用本章介绍的技巧，你可以高效管理 Fedora 40 的应用，让系统保持定制化且处于最新状态。

    ## 第 17 章

    ### 启用第三方软件源

    要获取专有、非自由软件以及额外编解码器，需要启用第三方软件源。

    尽管第三方软件源可以在系统安装后的阶段启用，但出于某些原因它们默认是关闭的，启用或禁用的步骤如下：

    #### 使用图形界面

    - 1. 打开软件中心。

    - 2. 点击菜单按钮。

    - 3. 选择 **软件源**。

    ![](img/f23a8e45379315d1673be3d803b2f54c_93_0.png)

    ![](img/f23a8e45379315d1673be3d803b2f54c_93_1.png)

    - 4. 要启用第三方软件源，将开关拨到开启位置。

    #### 使用命令行

    ##### 查看当前软件源

    ```bash

    sudo dnf repolist

    ```

    ![](img/f23a8e45379315d1673be3d803b2f54c_94_0.png)

    ##### 添加 Fedora 官方提供的第三方软件源

    ```bash

    sudo dnf install fedora-workstation-repositories

    ```

    添加后列出所有软件源

    ```bash

    sudo dnf repolist all

    ```

    ##### 管理第三方软件源

    Fedora 系统提供了 dnf config-manager 命令来管理软件源配置。

    添加第三方软件源的步骤如下：

    ###### 启用所需软件源

    新添加的软件源默认是禁用状态，要启用单个软件源，执行以下命令。

    ###### 语法

    ```bash

    sudo dnf config-manager --set-enabled <name of repository>

    ```

    ###### 示例

    ```bash

    sudo dnf config-manager --set-enabled rpmfusion-nonfree-steam

    ```

    ###### 禁用软件源

    类似地，如果不需要某个软件源，可以将其禁用。

    ###### 语法

    ```bash

    sudo dnf config-manager --set-disabled <name of repository>

    ```

    ###### 示例

    ```bash

    sudo dnf config-manager --set-disabled rpmfusion-nonfree-steam

    ```

    ##### 移除第三方软件源

    要 **移除** 第三方软件源

    ```bash

    sudo dnf remove fedora-workstation-repositories

    ```

    #### .repo 文件

    在 Fedora 和其他基于 Red Hat 的 Linux 发行版（如 CentOS）中，.repo 文件是 DNF 包管理器的配置文件。

    这些文件通常存放在 /etc/yum.repos.d/ 目录下，系统需要读取其中的信息才能从特定软件源获取并安装软件包。

    要向 Fedora 添加新软件源，通常需要在 /etc/yum.repos.d/ 目录下创建 .repo 文件，格式如下：

    ```ini

    [Name]

    name=Name of the repository

    baseurl=https://example.com/repo/fedora/$releasever/$basearch/

    enabled=1

    gpgcheck=1

    gpgkey=https://example.com/repo/RPM-GPG-KEY-example

    ```

    #### 字段说明

    - **name**：软件源名称。

    - **baseurl**：存放软件源元数据和软件包的 URL 地址。

    - **enabled**：设为 1 表示启用该软件源，设为 0 表示禁用。

    - **gpgcheck**：设为 1 表示启用 GPG 签名验证，设为 0 表示禁用。

    - **gpgkey**：用于软件包签名的 GPG 密钥的 URL 或本地路径。

    > **GPG 密钥**

    > GPG 密钥是一种加密密钥，用于验证从软件源下载的软件包的完整性和合法性。通常每个软件源都会附带一个或多个 GPG 密钥。为了确保你安装的软件包是真实且未被篡改的，向系统添加软件源时可能需要导入并信任该软件源的
    GPG 密钥。

    ```ini

    user1@fedora:/etc/yum.repos.d$ cat google-chrome.repo

    [google-chrome]

    name=google-chrome

    baseurl=https://dl.google.com/linux/chrome/rpm/stable/x86_64

    skip_if_unavailable=True

    gpgcheck=1

    gpgkey=https://dl.google.com/linux/linux_signing_key.pub

    enabled=0

    ```

    #### 定义额外第三方软件源

    向系统添加第三方软件源通常包含多个步骤，比如安装第三方提供的软件源定义文件。但添加前需要注意，未经妥善维护或不可信的第三方软件源可能会引发问题，添加前务必仔细核查其来源和稳定性。以下是通用操作流程：

    ##### 语法

    ```bash

    sudo dnf config-manager --add-repo https://url.com/name.repo

    ```

    该命令会在系统中添加 repo 文件并定义软件源，你也可以手动下载 repo 文件后复制到 `/etc/yum.repos.d` 目录下。

    #### 更新软件源元数据

    添加或修改软件源后，需要使用 DNF 更新软件源信息。

    ##### 语法

    ```bash

    sudo dnf clean expire-cache

    sudo dnf repolist

    ```

