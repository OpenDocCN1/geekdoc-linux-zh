  md: '![](img/f23a8e45379315d1673be3d803b2f54c_33_0.png)


    The dash bar or Dock can be seen at the bottom of the Activities overview. The
    Dash gives you quick access to your favourite and currently running programmes.
    To open the application, click the application icon in the dash bar. The small
    dot at the bottom of the icon shows that the application is running. Clicking
