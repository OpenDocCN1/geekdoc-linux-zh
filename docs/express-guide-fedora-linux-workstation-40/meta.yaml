  md: '# *Manage Users*


    As Linux is a multi-user operating system, it allows multiple users to access
    the same system. You can create a separate user account for each user of the computer
    so that every user can keep his or her data separate and safe. This provides privacy
    to all users. Users can also personalize the desktop according to their taste.


    # **What exactly is a user?**


    A **user** is anyone who uses a computer. Linux assigns a unique user id to every
    user that exists on the system, which is known as the UID or User ID. This UID
    is for the system''s internal use only.


    # **Standard v/s Administrator**


    The administrator is a special user who has complete access to the operating system
    and its configuration. The administrator user is intended for administrative use
    only. In traditional Unix systems, there is a root user for doing administrative
    tasks, but in the case of modern Linux systems, there is an option to give administrator
    rights to any user. You can also fine-tune the users'' rights at a granular level.
    The Administrator user has unlimited privileges. An administrator can access any
    file, run any program, execute any system call, and modify any setting. Unlike
    standard users, administrators can access the files and folders of other users
    as well. During the installation, the system creates an administrator user. When
    you create'
  merge: -1
  pgno: 113
- img_proc: true
  md: 'a new user, you have the option to select either standard or administrator
    as the user account type.


    # **Add User**


    To create user


    +   1. From the system menu, press **Settings**.

    2. In the Settings window, select System on the left and Users on the right.

    3. Press **unlock**. Enter your password and click **Authenticate**.


    ![](img/f23a8e45379315d1673be3d803b2f54c_114_0.png)


    +   4. Press **Add User**.


    ![](img/f23a8e45379315d1673be3d803b2f54c_114_1.png)


    +   5. In the **Add User** dialog box do the following:


    +   1. Enter the user''s **Full name**.

    2. If necessary, change the system-generated login.

    3. Select **Standard** or **Administrator** as the user type.

    4. You can either set a password now or enable a user to set one on their first
    login.

    5. Press **Add**.'
  merge: -1
