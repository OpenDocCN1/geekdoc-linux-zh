  md: '# Chapter


    # 1


    # *Introduction*


    Linux is an operating system that is similar to UNIX. Linus Torvalds founded Linux
    as an open-source project in 1991. It is well-known for its dependability, security,
    and adaptability. Linux powers a plethora of devices, ranging from PCs and servers
    to embedded systems and supercomputers. It is supported by a global community
    of developers and contributors that work together to continuously improve its
    capabilities. Linux is a popular choice for people, businesses, and governments
    all over the world because it embodies the ideals of free and open-source software
    (FOSS) and gives users unmatched freedom to customize and develop. There are tons
    of Linux distributions available that adhere to open source standards; Fedora
    Linux is one of the most popular and widely used Linux distribution.


    Fedora Linux demonstrates the power of community-driven open-source development.
    It was formed by Red Hat, Inc. and developed in 2003 as a continuation of the
    Red Hat Linux project. It includes software published under a variety of free
    and open-source licenses and aspires to be at the forefront of open-source technologies.
    Fedora has developed into a state-of-the-art operating system that personifies
    creativity, dependability, and teamwork. Fedora provides an engaging environment
    to explore and use, whether you are an experienced Linux fan, a developer looking
    for a stable platform, or a novice interested in learning more about the world
    of open-source software. Fundamentally, Fedora'
  merge: -1
  pgno: 5
- img_proc: true
  md: 'represents the spirit of experimentation and discovery that characterizes the
    Linux community. It functions as a testbed for novel features and technological
    advancements, frequently impacting the evolution of Red Hat Enterprise Linux (RHEL),
    its enterprise equivalent. Through this dynamic partnership, Fedora users are
    guaranteed to benefit from cutting-edge developments while their computing environment
    remains secure and reliable.


    # Architecture of the Fedora Linux Operating System


    Fedora Linux has a modular design based on the Linux kernel with systemd for system
    management. The Linux kernel is a component of the operating system that interfaces
    with the computer''s hardware and maintains system resources like memory and computing
    power. Fedora Linux offers a number of software tools and apps necessary to operate
    the operating system on top of the Linux kernel. It supports a variety of desktop
    environments, including GNOME, KDE Plasma, and Xfce, to accommodate to different
    user preferences. Dnf handles package management, which ensures that software
    is installed and updated efficiently and safely. Fedora''s architecture prioritizes
    community engagement, creativity, and adaptability across a variety of hardware
    platforms and computing environments.


    # Life cycle of Fedora Linux


    Fedora Linux follows a predictable 6-month release cycle, introducing new versions
    with updated features and packages. Every version gets monthly updates for roughly
    13 months, which are split into phases for end-of-life and active maintenance.
    The 13-month lifetime is created, in scientific words, by supporting version X
    for one month following the release of version X+2. This gives customers'
  merge: -1
  pgno: 6
- img_proc: true
  md: 'the option to "skip a release" without compromising the system''s continuous
    updating capability. To maintain continuity and security, upgrades between successive
    releases are made easier. Through user feedback and participation, Fedora''s community-driven
    strategy promotes early adoption of cutting-edge technology and continual improvement.


    # Advantages of Fedora Linux


    **Cutting-Edge technology**: You always get the most latest updates from Fedora,
    which are released every six months. The flagship edition is always the most recent
    version. There is no Long Term Support (LTS) version.


    **Community-driven development**: Fedora benefits from a big and active community
    of developers and contributors who work together to continuously improve the operating
    system.


    **Stability and Security**: Fedora incorporates SELinux to improve security measures,
    giving strong security policies to guard against unwanted access and threats.


    **Easy to use**: Fedora is quite easy to use. Because of its ease of use, Fedora
    is the operating system of choice for many people who want a strong, safe, and
    flexible program.


    **Adaptable and powerful**: It maintains complete control over your services and
    infrastructure. You can alter based on your demands and specifications.


    **Desktop Environment Choices**: Fedora provides a range of desktop environments,
    including GNOME, KDE Plasma, Xfce, LXQt, and others, to meet the needs of diverse
    users and hardware configurations.


    **Wide range of software**: Fedora provides a large range of software tools and
    applications needed for'
  merge: -1
  pgno: 7
- img_proc: true
  md: 'general-purpose computing.


    As you learn more about Fedora Linux, embrace its dedication to open-source principles,
    community involvement, and innovation. Fedora provides a platform that combines
    work and exploration with its wide range of programs, sturdy architecture, and
    easy-to-use interface. Regardless of your level of knowledge, Fedora''s robust
    environment and friendly community guarantee a fulfilling exploration of its capabilities.'
  merge: -1
  pgno: 8
- img_proc: true
  md: '# **Hardware configuration required**


    Selecting the appropriate hardware setup is critical for improving your Fedora
    Linux experience. Choosing appropriate components provides smooth operation and
    stability. Understanding Fedora''s hardware requirements, which include CPUs,
    memory, storage, and graphics, allows you to successfully design your system to
    satisfy both basic and advanced computing needs. The table below shows the minimum
    and recommended configuration required for installation of Fedora. Although you
    can install Fedora with a minimum configuration, it is always better to have a
    recommended configuration.


    | Hardware | Minimum Required | Recommended |

    |----------|------------------|-------------|

    | Processor | 2 GHz Dual core | Intel Core i3 |

    | RAM | 2 GB | 4 GB |

    | Hard disk | 15 GB | 50 GB |

    | Graphics Card | Any | Any |

    | USB Drive | 8 GB | 8 GB |


    These specifications guarantee a seamless and effective experience when utilizing
    Fedora Linux for a range of tasks, including software development and multimedia
    editing, as well as basic online browsing and office productivity. Depending on
    certain use cases or extra hardware needed for specialized apps or peripherals,
    adjustments can be required. For information on upgrades and compatibility, always
    consult the most recent Fedora documentation or community resources.'
  merge: -1
  pgno: 9
- img_proc: true
  md: '# *Editions and flavour*


    Fedora provides three editions. Each edition has a specific purpose.


    | Edition | User case |

    |---------|-----------|

    | Workstation | Desktop and laptop |

    | Server | Servers |

    | CoreOS | Cloud Infrastructure |


    Other than the three editions above, Fedora is offering two new editions.


    | Silver blue | Container on Desktop |

    | Iot | Internet of Things |


    Fedora ships with the GNOME desktop environment by default, although additional
    desktop environments such as KDE, LXDE, XFCE, LXQT, Mate, Cinnamon, SOAS, and
    others are also available. If you like a specific type of desktop environment,
    you can choose the appropriate spin. Not only that, but even after installation,
    you can select a different desktop environment. In this book, we will install
    and explore Fedora''s default GNOME version. GNOME provides a modern and user-friendly
