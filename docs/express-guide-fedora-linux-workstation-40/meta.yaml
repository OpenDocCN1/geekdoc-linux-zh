  md: '# # Chapter 22

    ## *Photos*


    ![](img/f23a8e45379315d1673be3d803b2f54c_129_0.png)


    The massive rise in popularity of smartphones and digital cameras has ushered
    in a new era of digital photography. Digital images, like real photographs, require
    good management and organization. To organize your images, you can utilize a Shotwell.
    It lets you import photographs from a disk or a camera. Shotwell lets you organize
    your photos and see them in full screen mode. You can also export images if necessary.
    Shotwell is not included in the standard Fedora installation. To install Shotwell:
    Go to Software Manager and search for Shotwell. Press install.


    ![](img/f23a8e45379315d1673be3d803b2f54c_129_1.png)


    # ## Open Shotwell


    To open **Shotwell**, press **Activities**. In the search bar write shotwell and
    click the Shotwell icon.'
  merge: -1
  pgno: 129
- img_proc: true
  md: '![](img/f23a8e45379315d1673be3d803b2f54c_130_0.png)


    ![](img/f23a8e45379315d1673be3d803b2f54c_130_1.png)


    When you launch Shotwell, it imports any photographs in the user''s picture folder.
    You can also import images from other locations, such as a USB device, external
    hard drive, or SD card. Importing images from other folders.


    +   1. Select **Import from Folder** from the File menu.

    2. Navigate to the folder.

    3. Press **Ok**.'
  merge: -1
