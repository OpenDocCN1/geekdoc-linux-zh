  md: '# Windows


    GNOME displays your running applications using windows. This is one method for
    running many processes concurrently. Every application you launch opens in a new
    window. We''ll look at windows in this part.


    # List windows


    Simply click the Activities button to see all of the open windows. To select a
    window from the list, use the left mouse button.


    # Switch window


    You can switch between windows by using the keyboard. To open the windows switcher,
    press the Super key + TAB.


    Hold the Super key down, then release it and press the TAB key to cycle between
    open windows.


    ![](img/f23a8e45379315d1673be3d803b2f54c_39_0.png)


    > **note**: The key on your keyboard is known as the super key.


    # Maximize and unmaximize a window


    You can maximise a window to show its content across the entire desktop, and you
    may unmaximize or restore a window to its original size.


    # Maximize the Window


    To maximize a window, press and hold the left mouse button at the window title
    bar to grab the window title bar. Drag it'
  merge: -1
