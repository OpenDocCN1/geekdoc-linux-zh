  md: '# Repo file


    In Fedora and other Linux distributions based on Red Hat (like CentOS), a.repo
    file serves as a configuration file for the dnf package manager. The information
    in these files, which are normally found in the /etc/yum.repos.d/ directory, is
    required for the system to obtain and install software packages from particular
    repositories.


    To add a new repository to Fedora, you usually create a .repo file in the /etc/yum.repos.d/
    folder.


    The format of this .repo file is as follows:


    ```

    [Name]

    name=Name of the repository

    baseurl=https://example.com/repo/fedora/$releasever/$basearch/

    enabled=1

    gpgcheck=1

    gpgkey=https://example.com/repo/RPM-GPG-KEY-example

    ```


    # Description of fields


    +   **name**: Name of the repository.

    **baseurl**: URL location where repository metadata and packages are located.

    **enabled**: 1 to enable the repository, 0 to disable it.

    **gpgcheck**: 1 to enable GPG signature verification, 0 to disable it.

    **gpgkey**: URL or local path to the GPG key used for package signing.


    > **GPG keys**


    Cryptographic keys known as GPG keys are used to confirm the integrity and validity
    of software packages that are downloaded from repositories. Usually, every repository
    has one or more GPG keys attached to it. To make sure the packages you install
    are authentic and unaltered, you might need to import and trust a repository''s
    GPG key when you add it to your system.'
  merge: -1
  pgno: 96
- img_proc: true
  md: '```

    user1@fedora:/etc/yum.repos.d$ cat google-chrome.repo

    [google-chrome]

    name=google-chrome

    baseurl=https://dl.google.com/linux/chrome/rpm/stable/x86_64

    skip_if_unavailable=True

    gpgcheck=1

    gpgkey=https://dl.google.com/linux/linux_signing_key.pub

    enabled=0

    ```


    # Define additional third-party repositories


    Adding a third-party repository to your system typically involves multiple steps,
    including installing a repository definition file provided by the third party.
    However, before adding anything, you should remember that third-party repositories
    can pose problems if not adequately maintained or trusted. Before adding any third-party
    repositories to your system, always double-check their source and stability. Here''s
    an overview of how you can accomplish this:


    # Syntax


    ```

    sudo dnf config-manager --add-repo https://url.com/ name.repo

    ```


    This will add repo file in your system and define repository.


    You can also manually download the repo file and copy it to the `/etc/yum.repos.d`
    directory.


    # Updating repository metadata


    Use dnf to update the repository information after adding or changing repositories.


    # Syntax


    ```

    sudo dnf clean expire-cache

    sudo dnf repolist

    ```


    # Removing additional repository'
