- md: "The `whatis` command demonstrates a one-line usage of the command.\n\n### Syntax\n\
    ```whatis command```\n\n### Example\n```whatis cp\n```\n\n![](img/f23a8e45379315d1673be3d803b2f54c_46_0.png)\n\
    \nYou can always seek assistance from the Fedora community on https://ask.fedoraproject.org/\
    \ if you are experiencing any Fedora issues.\n\n## Chapter 8 Sudo\nThe **sudo**\
    \ command allows you to run applications with another user's security rights (by\
    \ default, as the superuser). It asks for your personal password and confirms\
    \ your command request by verifying a file called `sudoers` that the system administrator\
    \ has configured. It is a method that allows you to delegate some administrative\
    \ responsibilities to less privileged users without providing the administrator's\
    \ password.\n\nExample of a privileged command that modifies system configuration:\n\
    ```sudo dnf install gzip\n```\n\nOr changing hostname:\n```sudo hostnamectl set-hostname\
    \ host2021\n```\n\n### Run Command as Different User\n**Syntax**\n```sudo -u user\
    \ command```\n\n**Example**\n```sudo -u user2 hostnamectl\n```\n\nUse `sudo` in\
    \ **interactive mode**:\n```sudo -i\n```\n\n### Changing the Sudo Configuration\n\
    Sudo's configuration is saved in the `/etc/sudoers` file. To change the sudo configuration,\
    \ use the **visudo** command. It essentially launches the vi editor and modifies\
    \ the `/etc/sudoers` file. The administrator must run the `visudo` command. The\
    \ `/etc/sudoers` file contains a list of users and the commands that they can\
    \ execute:\n```user host=(users) [NOPASSWORD:]commands```\n\n#### Example\n```%operators\
    \ localhost = (apache) /usr/sbin/\n```\n\n## Chapter 9 Update\nThe updates include\
    \ critical bug fixes, security patches, and new features. Regular updates are\
    \ required to improve the performance, stability, and security of your computer's\
    \ operating system and programmes. Installing them ensures that your system operates\
    \ in a safe and efficient manner. Fedora looks for new updates to installed programs\
    \ automatically and prompts you to update.\n\nAfter a clean installation, you\
    \ have two options for manually updating your system: GUI or command line.\n\n\
    ### Update System Through Graphical User Interface\n1. Click **Activities**.\n\
    ![](img/f23a8e45379315d1673be3d803b2f54c_49_0.png)\n2. Click the Software icon\
    \ on the dash bar.\n3. Click the Updates tab.\n4. Press **Update** (or in some\
    \ cases **Restart and update**)\n![](img/f23a8e45379315d1673be3d803b2f54c_49_1.png)\n\
    5. The system will restart following updates if the option to restart and update\
    \ was given; otherwise, the system will only be updated.\n![](img/f23a8e45379315d1673be3d803b2f54c_50_0.png)\n\
    \n### Update Using Command Line\n```sudo dnf -y update\n```\n\n## Chapter 10 Add\
    \ a Desktop Environment\nFedora, like any other Linux distribution, allows you\
    \ to customize your user experience, improve performance, access specific software,\
    \ personalize your desktop environment, and explore other elements of the Linux\
    \ ecosystem. If you want to add more desktop environments of your choice, you\
    \ may easily add them to an existing installation.\n\nThe reasons for adding or\
    \ changing desktop environments may be due to the following reasons:\n- **User\
    \ preferences**: Different desktop environments provide distinct user interfaces\
    \ and workflows.\n- **Performance**: Some desktop environments require fewer system\
    \ resources than others.\n- **Applications availability**: Some applications or\
    \ tools may be widely available or compatible with specific desktop environments.\n\
    - **Customization**: Each desktop environment has a unique set of customization\
    \ options that may not be available in others.\n- **Exploration and Learning**:\
    \ Experimenting with multiple desktop environments can help you learn more about\
    \ alternative desktop Linux user interfaces and the ecosystem.\n\nAs previously\
    \ stated, Fedora 40's default desktop environment is GNOME3. It performs best\
    \ with hardware acceleration. Alternative desktops are advised for people with\
    \ older graphics technology or who have specific desktop environment requirements.\n\
    \nDesktop environments can be added to an existing installation and accessed via\
    \ login. To list the available desktops, run the `dnf grouplist` command:\n```sudo\
    \ dnf grouplist -v hidden | grep Desktop\n```\n\n#### Install the Desired Desktop\
    \ Environment\n```sudo dnf groupinstall \"KDE Plasma Workspaces\"\n```\n\nThe\
    \ command above installs the KDE desktop environment; you can install other desktop\
    \ environments in the same manner.\n\n## Command Line Interface\nFedora provides\
    \ a very pleasant graphical user interface for most tasks, but while using Linux,\
    \ you should also be familiar with the command line interface. This chapter will\
    \ look at command line interfaces.\n\n### GNOME Terminal\n![](img/f23a8e45379315d1673be3d803b2f54c_53_0.png)\n\
    \nGNOME Terminal is a terminal emulator that works with the GNOME Desktop environment.\
    \ The terminal provides access to the Linux shell environment, which can be used\
    \ to run programs. The terminal offers an interactive command line interface.\
    \ In contrast to graphical user interfaces, you must type the name of the application\
    \ followed by the ENTER key to launch any program; this is known as command input.\n\
    \n### Open GNOME Terminal\n![](img/f23a8e45379315d1673be3d803b2f54c_54_0.png)\n\
    \nPress **Activities**, write `terminal` into the search bar, then select the\
    \ terminal icon.\n\n### Shortcuts\nThe following are some basic shortcuts for\
    \ the GNOME terminal.\n\n| Keyboard Shortcut | Task |\n|-------------------|------|\n\
    | Ctrl + A | Moves the cursor to the beginning of the command prompt |\n| Ctrl\
    \ + E | Moves the cursor to the end of the command prompt |\n| Ctrl + U | Clear\
    \ the current line |\n| Middle mouse button click | Paste the highlighted text\
    \ |\n| Tab | Completes the command |\n| Up / Down Keys | Show history of commands\
    \ |\n| Ctrl + C | Terminate the current process |\n| Ctrl + Z | Suspends the foreground\
    \ process |\n\n### Commands\nLet's explore some basic and important commands.\n\
    \n#### date\nPrint or change the system date and time.\n\n**Syntax**\n```date\n\
    ```\n\n**Example**\n- To check the date:\n  ```date\n  ```\n- To set the date:\n\
    \  ```sudo date -s \"24 feb 2017 19:00\"\n  ```\n\n#### cp\nCommand to copy files.\n\
    \n**Syntax**\n```cp <options> source destination```\n\n**Example**\n```cp /home/abc.txt\
    \ /home1/\n```\n\n- Recursively copy all files in the directory:\n  ```cp -R /home/*\
    \ /home1/\n  ```\n- Prompt before any overwrite:\n  ```cp -i /home /home1\n  ```\n\
    - Copy all new files to the destination:\n  ```cp -u * /tmp\n  ```\n- Forcefully\
    \ copy files:\n  ```cp -f /tmp/abc.txt /backup/.\n  ```\n- Do not replace an existing\
    \ file; instead, do nothing:\n  ```cp -n * /backup/.\n  ```\n\n#### ls\nLists\
    \ the file names.\n\n**Syntax**\n```ls -<options>```\n\n**Example**\n| Command\
    \ | Description |\n|---------|-------------|\n| `ls -al` | To list directories\
    \ and files |\n\n#### cat\nDisplays a text file.\n\n**Syntax**\n```cat filename```\n\
    \n**Example**\n```cat abc.conf\n```\n\n#### rm\nDeletes a file, files, or directory.\n\
    \n**Syntax**\n```rm filename```\n\n**Example**\n```rm abc.conf\n```\n\nTo delete\
    \ the `abc` directory recursively:\n```rm -r abc\n```\n\n#### more\nPaging through\
