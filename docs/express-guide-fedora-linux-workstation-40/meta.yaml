  md: '![](img/f23a8e45379315d1673be3d803b2f54c_131_0.png)


    ![](img/f23a8e45379315d1673be3d803b2f54c_131_1.png)


    will prompt if you want to copy the photographs to the library or just import
    them in place. If you choose **Import in Place**, the image will not be available
    if the source storage, such as removable media, is unavailable.


    # Events'
