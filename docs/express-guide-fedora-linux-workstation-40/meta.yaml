  md: '# # Write documents


    Fedora workstation is a complete desktop environment that includes practically
    all of the tools needed for daily tasks. It provides LibreOffice as a comprehensive
    office suite for documents. In contrast to Microsoft Office, LibreOffice is a
    free and open source suite. LibreOffice includes the following applications: -


    | LibreOffice | Use | MS office equivalent |

    |-------------|-----|----------------------|

    | Writer | Word processing | Word |

    | Calc | Spreadsheets | Excel |

    | Impress | Presentations | Power Point |

    | Draw | Vector Graphics and flowcharts | Publisher |


    # ## LibreOffice Customization


    If you are migrating from Microsoft Word to LibreOffice Writer, some of the customizations
    described in this chapter will help you feel at ease.


    # ### Install Microsoft fonts


    It is recommended to install Microsoft common fonts for better compatibility with
    the MS Office suite: -


    Open **Terminal**


    Enter the following command at the command prompt:


    Please keep in mind that the entire command below is contained in a single line.'
  merge: -1
  pgno: 135
- img_proc: true
  md: '```

    sudo dnf install https://downloads.sourceforge.net/project/mscorefonts2/rpms/msttcore-fonts-installer-2.6-1.noarch.rpm

    ```


    Provide your password and press Enter Key.


    # Set default fonts


    ![](img/f23a8e45379315d1673be3d803b2f54c_136_0.png)


    Once the fonts are installed, Press **Activities** and write "writer" in the search
    bar. Click the Writer icon to open the LibreWriter.


    Click **Tools** from the main menu and select **Options**.


    In left pane double click LibreOffice writer. Select Basic fonts.


    On the right pane, change the **Default** to Arial and the **Heading** to Times
    New roman.'
  merge: -1
  pgno: 136
- img_proc: true
  md: '![](img/f23a8e45379315d1673be3d803b2f54c_137_0.png)


    ![](img/f23a8e45379315d1673be3d803b2f54c_137_1.png)


    # **Change Icon style**


    +   1. In the left pane, click **LibreOffice** and then **View**.

    2. Select Breeze from the drop down menu for the icon style.

    3. Reduce the icon size for the toolbar, notebookbar, and sidebar to small.'
  merge: -1
  pgno: 137
- img_proc: true
  md: '![](img/f23a8e45379315d1673be3d803b2f54c_138_0.png)


    # Change file format to docx


    ![](img/f23a8e45379315d1673be3d803b2f54c_138_1.png)


    Although ODF is an open document format, but when sharing documents on a Windows
    system with MS Word, docx is the better option.


    +   1. Double click **Load** / **Save** in the left pane.'
  merge: -1
  pgno: 138
