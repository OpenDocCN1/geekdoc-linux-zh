- md: 'general-purpose computing. As you learn more about Fedora Linux, embrace its
    dedication to open-source principles, community involvement, and innovation. Fedora
    provides a platform that combines work and exploration with its wide range of
    programs, sturdy architecture, and easy-to-use interface. Regardless of your level
    of knowledge, Fedora''s robust environment and friendly community guarantee a
    fulfilling exploration of its capabilities.


    ## **Hardware configuration required**


    Selecting the appropriate hardware setup is critical for improving your Fedora
    Linux experience. Choosing appropriate components provides smooth operation and
    stability. Understanding Fedora''s hardware requirements, which include CPUs,
    memory, storage, and graphics, allows you to successfully design your system to
    satisfy both basic and advanced computing needs. The table below shows the minimum
    and recommended configuration required for installation of Fedora. Although you
    can install Fedora with a minimum configuration, it is always better to have a
    recommended configuration.


    | Hardware | Minimum Required | Recommended |

    |----------|------------------|-------------|

    | Processor | 2 GHz Dual core | Intel Core i3 |

    | RAM | 2 GB | 4 GB |

    | Hard disk | 15 GB | 50 GB |

    | Graphics Card | Any | Any |

    | USB Drive | 8 GB | 8 GB |


    These specifications guarantee a seamless and effective experience when utilizing
    Fedora Linux for a range of tasks, including software development and multimedia
    editing, as well as basic online browsing and office productivity. Depending on
    certain use cases or extra hardware needed for specialized apps or peripherals,
    adjustments can be required. For information on upgrades and compatibility, always
    consult the most recent Fedora documentation or community resources.


    ### *Editions and flavour*


    Fedora provides three editions. Each edition has a specific purpose.


    | Edition | Use case |

    |---------|----------|

    | Workstation | Desktop and laptop |

    | Server | Servers |

    | CoreOS | Cloud Infrastructure |


    Other than the three editions above, Fedora is offering two new editions.


    | Edition | Use case |

    |---------|----------|

    | Silverblue | Container on Desktop |

    | IoT | Internet of Things |


    Fedora ships with the GNOME desktop environment by default, although additional
    desktop environments such as KDE, LXDE, XFCE, LXQT, Mate, Cinnamon, SOAS, and
    others are also available. If you like a specific type of desktop environment,
    you can choose the appropriate spin. Not only that, but even after installation,
    you can select a different desktop environment. In this book, we will install
    and explore Fedora''s default GNOME version. GNOME provides a modern and user-friendly
    interface that emphasizes simplicity, productivity, and ease of use. The following
    are some salient features of GNOME Desktop:


    - Clean and intuitive user interface

    - Supports extensions that allow users to customize and enhance their desktop
    experience.

    - Better integration of the application ecosystem with the desktop environment.

    - Development-friendly environment with tools like GTK (GNOME Toolkit)

    - Ensures security by design.

    - Supports multiple languages and internationalization features


    Overall, GNOME is a preferred option for Linux users looking for a sophisticated
    and feature-rich desktop environment because of its emphasis on usability, customization,
    performance, and accessibility.


    ### **Download and Media preparation**


    Create bootable USB devices with Fedora Media Writer, an easy-to-use program that
    installs Fedora Linux on computers. It offers automatic Fedora image download
    and verification and is compatible with Linux, macOS, and Windows. The tool''s
    user-friendly interface makes the procedure simpler by letting users choose particular
    Fedora editions or spins. In this chapter, we will download and write media using
    Fedora Media Writer on a Microsoft Windows system. Open the following page in
    your preferred web browser on your Windows system to download Fedora Media Writer.


    https://getfedora.org/en/workstation/download/


    ![](img/f23a8e45379315d1673be3d803b2f54c_12_0.png)


    - 1. Download Fedora Media Writer.

    - 2. Double click the downloaded file to install Media Writer.

    - 3. After installation, run Fedora Media Writer from the start menu. On the first
    screen, keep **Download automatically** selected and press **Next**.


    ![](img/f23a8e45379315d1673be3d803b2f54c_13_0.png)

    ![](img/f23a8e45379315d1673be3d803b2f54c_13_1.png)


    - 4. Keep all of the pre-selected options unchanged (official editions and Fedora
    Workstation). Click **Next**.


    - 5. Attach a USB drive.


    ![](img/f23a8e45379315d1673be3d803b2f54c_14_0.png)


    - 6. On the Write options screen, verify the USB device and click the **Download
    & Write** button.


    - 7. The download and writing operations will begin.


    ![](img/f23a8e45379315d1673be3d803b2f54c_15_0.png)


    - 8. Remove the USB drive once the writing procedure is complete. Once the media
    generation procedure is complete, you may proceed with installing Fedora Linux
    by grabbing a bootable USB stick in the next chapter.


    ## Chapter 5


    ### Steps for installation


    Fedora Linux installation opens the door to a robust and flexible operating system.
    This chapter walks you through the installation process step-by-step, so even
    if you have no prior experience with Linux or computer networks, you can still
    use the installation system easily. This chapter gives you the information and
    resources you need to install Fedora Linux and begin using it with confidence,
    from setting up your system and choosing installation choices to configuring partitions
    and post-installation configuration. Here are the general installation steps for
    Fedora Linux:


    - 1. Once the installation media is ready, plug it into the target system.

    - 2. Power on the computer.

    - 3. Change the boot order and make USB the first boot device. Consult your system
    manual to change the boot order. In my case, for Lenovo laptops, it is F12.


    ![](img/f23a8e45379315d1673be3d803b2f54c_16_0.png)


    - 4. Select USB as the boot device.


    ![](img/f23a8e45379315d1673be3d803b2f54c_17_0.png)


    - 5. Select **Start Fedora-Workstation-Live 40**. Press Enter.


    ![](img/f23a8e45379315d1673be3d803b2f54c_17_1.png)


    - 6. Press **Install Fedora**.


    - 7. Choose a language and a keyboard.


    ![](img/f23a8e45379315d1673be3d803b2f54c_18_0.png)

    ![](img/f23a8e45379315d1673be3d803b2f54c_18_1.png)


    - 8. Click on the Installation destination (with an orange sign).


    ### **Disk Configuration:**


    The default file system used during Fedora Workstation installation is Btrfs (B-tree
    File System). Btrfs is a modern copy-on-write (COW) file system with various advanced
    capabilities over earlier file systems like Ext4, such as snapshots and subvolumes.
    During Workstation installation, you have the option for automatic storage configuration,
    which has the following disk layout.


    | Mount Point | Function | Filesystem type |

    |-------------|----------|-----------------|

    | /boot/efi | EFI System Partition | FAT 32 |

    | /boot | Boot Partition | ext4 |

    | / | Root Subvolume | Btrfs |

    | /home | Home Subvolume | Btrfs |


    The root subvolume stores the system installation, while the home subvolume contains
    user data and its settings.


    ### **Swap Space:**


    If you''ve previously used Fedora or another Linux system, you might be thinking
    about swap space. Fedora Workstation does not use a separate swap partition. Instead,
    it uses ZRAM. ZRAM is a new Linux feature that stores swap files in compressed
    RAM rather than hard disks, as previously employed. RAM is already much quicker
    than hard disks. In Fedora Workstation, during the disk partitioning section of
    the installer, you have multiple disk configuration options in addition to Automatic
    storage configuration, which is the default option. These choices allow you to
    tailor how your drives are partitioned and used to meet a variety of demands,
    including complex storage configurations and specific requirements. Here are some
    of the non-default disk configuration choices you can consider:


    - **Manual:** You can manually configure partitions based on your preferences
    rather than allowing the installer to partition the drive automatically.'
