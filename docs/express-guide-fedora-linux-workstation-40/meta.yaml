  md: '# Application Management


    Fedora, as an open source operating system, allows access to a diverse assortment
    of software that is mostly free to use. Different companies who share this software
    utilize various forms of agreements, commonly known as licenses. A software repository
    is a site where these software products are stored. Fedora Workstation includes
    a collection of software repositories that are enabled by default. These allow
    you to update preloaded software and install new packages and programs. The workstation''s
    default software repositories are:


    +   - **Official Fedora RPM repository:** All Fedora workstation system components
    and required apps are available in RPM format via the main Fedora repositories.

    - **Fedora flatpaks:** Flatpak is a handy way to access and administer a large
    range of desktop applications on Fedora and other Linux distributions, providing
    flexibility and security benefits thanks to its sandboxed approach. The Flatpak
    software distribution tool is pre-installed on the Workstation. It also offers
    a repository of Flatpak apps that have been produced and hosted by the Fedora
    team and are accessible for installation.

    - **Linux Vendor Firmware Service (LVFS):** The Linux Vendor Firmware Service
    (LVFS). The Linux Vendor Firmware Service (LVFS) is a project aimed at making
    it easier to distribute firmware upgrades to Linux users in a consistent and secure
    manner. The Fedora workstation utilizes fwupd to download firmware updates from
    LVFS. This feature is enabled by default.'
