    ## Chapter 6

    ## Know your Desktop

    ![](img/f23a8e45379315d1673be3d803b2f54c_26_0.png)

    Fedora Linux has traditionally used GNOME as the default desktop environment.
    GNOME (GNU Network Object Model Environment) is a modern desktop environment that
    focuses on simplicity, usability, and accessibility. It has a simple and easy-to-use
    interface that aims to boost productivity. Fedora Linux 40 includes the most recent
    release, GNOME 46, codenamed "Kathmandu". Here''s a detailed explanation of GNOME:


    ### Core Components

    The GNOME desktop environment''s core parts are fundamental software components
    and tools that work together to offer a complete user interface and desktop experience
    on the Linux operating system. Here are the main fundamental components of GNOME:


    ### GNOME Shell

    The GNOME Shell serves as the desktop''s user interface and is a key component
    of GNOME. It can perform standard UI tasks, such as switching between windows,
    opening apps, and displaying alerts. The main components of GNOME Shell are as
    follows:

    - Top Bar

    - System menu

    - Activities Overview

    - System status area

    - Dash

    - Window picker

    - Search

    - Application switcher


    ### GTK (GIMP Toolkit)

    GTK is a free cross-platform widget toolkit that allows you to create graphical
    user interfaces (GUIs) as well as applications and widgets. It supports both free
    and proprietary software. It is among the most popular toolkits for the Wayland
    and X11 windowing systems.


    ### GNOME applications

    On the GNOME desktop, GNOME Core programs handle routine tasks. Usually, your
    GNOME system comes with them pre-installed. Here is a list of common applications:

    - Files: The default file manager for GNOME.

    - Terminal: Terminal emulator.

    - Settings: Control panel for system settings.

    - Calendar, Contacts, and To Do

    - Music

    - Videos


    ### GNOME Session Manager

    GNOME Session Manager manages the login and session management operations for
    the GNOME desktop environment. It is usually started by the display manager (such
    as GDM3) once a user enters the necessary credentials on the login screen.


    ## Desktop components description

    This section focuses on the key elements that form Fedora''s desktop interface,
    emphasizing its essential components and their significance in improving usability
    and productivity.

    ![](img/f23a8e45379315d1673be3d803b2f54c_29_0.png)


    ### TOP BAR

    The top bar has three main sections.

    - System Menu

    - Clock

    - Activities


    ### System Menu

    ![](img/f23a8e45379315d1673be3d803b2f54c_29_1.png)

    The right corner of the bar has power, speaker, network, battery and Bluetooth
    icons. Click on any of these icons to open the **System menu**. The system menu
    allows you to adjust speaker and microphone volume. This menu also gives you the
    option to adjust network and Bluetooth settings. You will find quick links for
    system settings, lock screen, and shutdown menu.


    ### Clock

    ![](img/f23a8e45379315d1673be3d803b2f54c_30_0.png)

    In the centre of the bar there is a clock, and by default it shows the day of
    the week and current time in 24-hour format. If you want, you can change the time
    format in the system settings. Click the clock to open a dialogue box with the
    calendar on the right side and any task notifications on the left side. It also
    includes a Do Not Disturb sliding button for ignoring notifications when you''re
    busy.


    ### Activities

    On the left side of the top bar is the **Activities** button. In Fedora''s desktop
    design, the Activities button acts as a primary point of navigation, making workspace
    management and multitasking more effective. Clicking on the Activities button
    or pressing the Super key (also known as the Windows key) on your keyboard opens
    the Activities Overview, offering a comprehensive view of open applications, virtual
    desktops, and favorite applications.


    ## Activities overview elements

    ![](img/f23a8e45379315d1673be3d803b2f54c_31_0.png)


    ### Search Bar

    One of the main items of the Activities overview screen is the search bar. Search
    for applications, documents, settings, calendar events, etc. on your computer.
    For example, if you write "calculator" in the search bar, it will show you a calculator
    application.

    ![](img/f23a8e45379315d1673be3d803b2f54c_31_1.png)

    Click the icon to open the calculator application.


    ### Windows Peak View (Windows List)

    The second item in the activity overview is a sneak peek at all of the open application
    windows. Click on the desired application window to switch to that application.
    To close any running application window, hover over the window and click the X
    button.

    ![](img/f23a8e45379315d1673be3d803b2f54c_32_0.png)

    ![](img/f23a8e45379315d1673be3d803b2f54c_32_1.png)


    ### DASH

    ![](img/f23a8e45379315d1673be3d803b2f54c_33_0.png)

    The dash bar or Dock can be seen at the bottom of the Activities overview. The
    Dash gives you quick access to your favourite and currently running programs.
    To open the application, click the application icon in the dash bar. The small
    dot at the bottom of the icon shows that the application is running. Clicking
    on any running application icon opens the application''s most recent window. To
    open the context menu, right-click on the icon. You can open a new window or select
    any window from a running application through this menu. You can also add or remove
    the current application from your favourites list (dash).

    ![](img/f23a8e45379315d1673be3d803b2f54c_33_1.png)


