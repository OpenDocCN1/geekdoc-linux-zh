    ## 第6章

    ## 认识你的桌面![](img/f23a8e45379315d1673be3d803b2f54c_26_0.png)

    Fedora Linux历来以GNOME作为默认桌面环境。GNOME（GNU网络对象模型环境）是一款注重简洁性、易用性和可访问性的现代化桌面环境，拥有简单易用的界面，旨在提升用户工作效率。Fedora
    Linux 40搭载了最新版本的GNOME 46，其代号为“加德满都”。以下是对GNOME的详细介绍：

    ### 核心组件

    GNOME桌面环境的核心组成部分是协同工作的基础软件组件和工具，共同为Linux操作系统提供完整的用户界面和桌面体验。以下是GNOME的主要核心组件：

    ### GNOME Shell

    GNOME Shell是桌面的用户界面，也是GNOME的核心组件之一，负责执行切换窗口、打开应用、显示通知等标准UI任务。GNOME Shell的主要组件如下：

    - 顶部面板

    - 系统菜单

    - 活动概览

    - 系统状态区

    - 程序坞（Dash）

    - 窗口选择器

    - 搜索栏

    - 应用切换器

    ### GTK（GIMP工具包）

    GTK是一款免费跨平台的小部件工具包，可用于创建图形用户界面（GUI）、应用程序及小部件，同时支持自由软件和专有软件。它是Wayland和X11窗口系统中最受欢迎的工具包之一。

    ### GNOME应用

    在GNOME桌面中，GNOME核心程序负责处理日常任务，通常会在GNOME系统中预装。以下是常见的应用程序列表：

    - 文件：GNOME默认的文件管理器。

    - 终端：终端模拟器。

    - 设置：系统设置控制面板。

    - 日历、联系人和待办事项

    - 音乐

    - 视频

    ### GNOME会话管理器

    GNOME会话管理器负责管理GNOME桌面环境的登录和会话操作，通常在用户在登录界面输入必要凭据后由显示管理器（如GDM3）启动。

    ## 桌面组件说明

    本节将重点介绍构成Fedora桌面界面的关键元素，阐述其核心组件对提升易用性和工作效率的重要性。![](img/f23a8e45379315d1673be3d803b2f54c_29_0.png)

    ### 顶部面板

    顶部面板分为三个主要区域：

    - 系统菜单

    - 时钟

    - 活动按钮

    ### 系统菜单![](img/f23a8e45379315d1673be3d803b2f54c_29_1.png)

    面板右上角有电源、扬声器、网络、电池和蓝牙图标。点击任意图标即可打开**系统菜单**，你可以通过该菜单调整扬声器和麦克风音量，还可以修改网络和蓝牙设置，同时也能找到系统设置、锁屏和关机菜单的快捷入口。

    ### 时钟![](img/f23a8e45379315d1673be3d803b2f54c_30_0.png)

    面板中间是时钟，默认以24小时制显示星期和当前时间。如有需要，你可以在系统设置中修改时间格式。点击时钟会弹出一个对话框，右侧显示日历，左侧显示所有任务通知，还带有一个勿扰滑动按钮，在你忙碌时可用来忽略通知。

    ### 活动按钮

    顶部面板左侧是**活动**按钮。在Fedora的桌面设计中，活动按钮是核心导航入口，可提升工作区管理和多任务操作的效率。点击活动按钮，或按下键盘上的Super键（又称Windows键），即可打开活动概览，查看所有已打开的应用、虚拟桌面和常用应用。

    ## 活动概览元素![](img/f23a8e45379315d1673be3d803b2f54c_31_0.png)

    ### 搜索栏

    搜索栏是活动概览界面的主要元素之一，可用于在计算机中搜索应用、文档、设置、日历事件等内容。例如，在搜索栏中输入“计算器”，就会显示对应的计算器应用。![](img/f23a8e45379315d1673be3d803b2f54c_31_1.png)

    点击图标即可打开计算器应用。

    ### 窗口预览（窗口列表）

    活动概览的第二个元素是所有已打开应用窗口的预览。点击目标应用窗口即可切换到该应用。要关闭正在运行的应用窗口，将鼠标悬停在窗口上，然后点击X按钮即可。![](img/f23a8e45379315d1673be3d803b2f54c_32_0.png)

    ![](img/f23a8e45379315d1673be3d803b2f54c_32_1.png)

    ### 程序坞（Dash）![](img/f23a8e45379315d1673be3d803b2f54c_33_0.png)

    活动概览底部可以看到Dash栏（即程序坞）。程序坞可以让你快速访问常用和正在运行的程序。点击程序坞中的应用图标即可打开对应应用；图标底部的小圆点表示该应用正在运行。点击任何正在运行的应用图标，会打开该应用的最新窗口。右键点击图标可打开上下文菜单，通过该菜单可以打开新窗口，或选择该应用正在运行的任意窗口，还可以将当前应用添加或移出常用列表（Dash）。![](img/f23a8e45379315d1673be3d803b2f54c_33_1.png)

