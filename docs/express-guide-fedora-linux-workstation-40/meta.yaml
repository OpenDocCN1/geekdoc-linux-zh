    - 2. 在右侧面板中，找到背景类别的图片，部分图片采用双色调设计，分别对应浅色和深色主题的壁纸。从列表中选择一张图片。 - 3. 要添加其他图片作为背景，点击**添加图片**。系统会显示用户的图片文件夹，选中图片后点击**打开**按钮。之后你可以点击刚添加的图片，将其设置为桌面背景。
