    ## Edit files with Nano

    Nano is a text editor designed for editing files in command line mode, heavily
    inspired by the very popular Pico text editor. In this chapter, we will look at
    the basic usage of the Nano editor.


    ### Start Nano

    Open the command terminal and enter `nano` to launch the editor, or enter `nano
    file_name` to directly open the specified file.


    ### Save the file

    Press `Ctrl + o` to save the file, the editor will prompt you to enter the file
    name.


    ### Search and replace

    - To search for text: Press `Ctrl + w`, type the text you want to search for,
    and it will be found in the document; press `Alt + w` to find the next occurrence.

    - To replace text: Press `Ctrl + \`, type the text you want to search for, then
    type the replacement text and press enter. Press `y` to replace the current match,
    or press `a` to replace all matches.


    ### Navigate

    You can move the cursor in the editor using the arrow keys: press `Ctrl + a` to
    move the cursor to the beginning of the line, and press `Ctrl + e` to move the
    cursor to the end of the line.


    ### Copy and Paste

    - To select text: Press `Ctrl + ^` to mark the start of the selection, and press
    `Alt + ^` to mark the end of the selection.

    - To paste: Move the cursor to the desired location and press `Ctrl + o` to paste.


    ### Cut and Paste

    - Press `Ctrl + ^` to mark the start of the cut, move the cursor to select the
    text you want to cut, then press `Ctrl + k` to complete the cut.

    - Move the cursor to the desired location and press `Ctrl + u` to paste the cut
    content.


    ### Justify Text

    Press `Ctrl + j` to justify the selected text (automatically wrap text to fit
    the screen width).


    ### Exit

    Press `Ctrl + x` to exit Nano. If there are any unsaved changes, you will be prompted
    to save them.


    Nano is a strong yet user-friendly tool for editing text files. The minimal commands
    and intuitive UI of Nano make it simple to use. Regardless of experience level,
    from novices learning the ropes to seasoned users searching for a quick and effective
    editor, its well-designed feature set makes it usable for everyone.


    ## Chapter 13 Personalize your desktop

    The GNOME desktop''s style and feel can be modified quite easily. Your desktop
    can be customized to suit your preferences and comfort. We''ll modify a number
    of settings to customize your desktop. It''s not necessary to modify every setting.


    ### Change the system style

    One of the great features of GNOME 46 is the dark theme. To modify the theme of
    the system:

    - 1. Click the **Settings** icon from the **System Menu**. ![](img/f23a8e45379315d1673be3d803b2f54c_63_0.png)

    - 2. Click **Appearance** in the left pane of the settings window. ![](img/f23a8e45379315d1673be3d803b2f54c_63_1.png)

    - 3. Choose a style. You have the option to select a light or dark theme.


    ### Change the background

    - 1. In the left pane select **Appearance**. ![](img/f23a8e45379315d1673be3d803b2f54c_64_0.png)

    - 2. In the right pane, look for photographs in the background category. Some
    images are in dual tones to represent the wallpaper for the bright and dark themes.
    Select an image from the list.

    - 3. To add other photographs as a background, click **Add Picture**. The picture
    folder for the user will be displayed. Click the **Open** button after selecting
    the image. By clicking on it, you can set the recently added image as the background.


    ### Change alert sound

    The system plays a sound to notify you of each message or event. To alter the
    alarm tone:

    - 1. In the settings window, on the left pane, choose **Sound**. ![](img/f23a8e45379315d1673be3d803b2f54c_65_0.png)

    - 2. Select the **Alert Sound** on the right pane.

    - 3. Select the desired sound from the popup


    ### Change Screen privacy

    #### Automatic Screen Blank

    When you don''t use your computer for a particular amount of time, the screen
    turns blank for your privacy. These options are changeable:

    - 1. Click **Privacy & Security** on the left pane in the Settings window.

    - 2. Click **Screen Lock**.

    - 3. Select **Blank Screen Delay** to set the duration after which the screen
    goes blank. It can be changed from 1 to 15 minutes using the drop-down menu on
    the right pane. To disable the screen blanking feature, select Never from the
    drop-down menu. ![](img/f23a8e45379315d1673be3d803b2f54c_66_0.png)


    #### Automatic Screen lock

    Automatic screen lock is a security and privacy feature on your machine. After
    a certain amount of inactivity on the computer, the screen automatically locks.
    To unlock the screen, you must enter your login password. To change the automatic
    screen lock behaviour, change the following settings in the **Screen Lock** pane
    of the Settings window:

    - 1. **Automatic Screen lock**: Slide the button to the right side to enable automatic
    screen lock.

    - 2. **Automatic screen lock delay**: Use the dropdown menu to choose the duration
    of inactivity from 30 seconds to one hour.

    - 3. **Show Notification on lock screen**: Use the slide button to enable or disable
    lock screen notifications.


    Personalizing your Linux desktop is more than just looking good; it''s about creating
    an environment that boosts your productivity and represents your personal style.
    The process of personalization involves both functionality and beauty, from customizing
    themes and icons to establishing workflows and setting privacy settings. The personalization
    of desktops extends beyond what is discussed in the chapter. You can explore the
    settings and make more modifications to suit your workflow and personality. By
    customizing every feature to your preferences, you not only make your desktop
    more visually appealing, but also create a workspace that feels entirely your
    own. Embrace Linux''s freedom and explore the infinite possibilities to create
    a desktop environment that inspires and empowers you every day.


    ### Change date, time and time zone

    Any computer system''s date and time settings are critical. Many operations, such
    as automated backups and system logs, are time and date dependent. On your Linux
    desktop, adjusting the date and time guarantees stable operation, improves security,
    promotes teamwork, and preserves system integrity. It''s essential to running
    a dependable and effective computer environment.

    Time and date are displayed in the center of the top bar. If the date and time
    on this clock are inaccurate or in the incorrect format, you can change them by
    following the procedures below:

    - 1. Click **Settings** from the **System Menu**.

    - 2. On the settings window, in the left pane, select **System**.

    - 3. From the right pane select **Date & Time**.

    - 4. Change **Automatic Date and Time** switch to the off position, to update
    your date and time manually. When this button is in the on position, the system
    automatically updates time from the internet.

    - 5. Click **Date & Time** and then adjust the time and date. ![](img/f23a8e45379315d1673be3d803b2f54c_70_0.png)
    ![](img/f23a8e45379315d1673be3d803b2f54c_70_1.png)

    - 6. If the current time zone is wrong, you can alter it by searching **Time zone**.
    ![](img/f23a8e45379315d1673be3d803b2f54c_70_2.png)

    - 7. If necessary, use the toggle button to change the Time Format from 24-hour
    to AM/PM or vice versa.


    Date and time related settings are as follows:

    | Setting | Description | Current Status |

    | --- | --- | --- |

    | Automatic Date & Time | Requires internet access | Off |

    | Date & Time | - | 26 June 2024, 2:16 AM |

    | Automatic Time Zone | Requires location services enabled and internet access
    | On |

    | Time Zone | - | IST (Kolkata, India) |

    | Time Format | - | 24-hour AM / PM |


    ### Clock & Calendar

    The clock and calendar setting section controls how the date and time are shown
    in the top bar. The sliding button on the right side shows and hides the following:

    | Option | Description |

    | --- | --- |

    | Week Day | Show or hide the day of the week |

    | Date | Show or hide the date |

    | Seconds | Show or hide seconds |

    | Week Numbers | Show week numbers in the drop-down calendar |

    | Shown in the dropdown calendar | Show or hide the drop-down calendar |


    ### Command line

    You can also use the `timedatectl` command to change the system''s date and time.


    #### Display current date and time

    Run the following command to view the current date and time:

    ```bash

    timedatectl

    ```


    #### Changing the Current Time

    ##### Syntax

    ```bash

    timedatectl set-time HH:MM:SS

    ```

    ##### Example

    To alter the time, enter the time in 24-hour format. For example, to set the time
    to 2:28 PM:

    ```bash

    sudo timedatectl set-time 14:28:00

    ```


    #### Change the Current Date

    > **Note**: Always set the time with the date, else the current time will be reset
    to 00:00:00

