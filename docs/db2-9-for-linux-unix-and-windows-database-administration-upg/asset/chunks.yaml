    The correct answer is **C.** The keywords that are recognized by the `AUTOCONFIGURE`
    command are: `mem_percent`, `workload_type`, `num_stmts`, `tpm`, `admin_priority`,
    `is_populated`, `num_local_apps`, `num_remote_apps`, `isolation`, and `bp_resizable`.


    # Question 2


    The correct answer is **A.** In DB2 9, the Configuration Advisor is automatically
    invoked whenever you create a database using the Create Database Wizard. This
    behavior can be changed by assigning the value `NO` to the `DB2_ENABLE_AUTOCONFIG_DEFAULT`
    registry variable. (The value assigned to the `DB2_ENABLE_AUTOCONFIG_DEFAULT`
    registry variable has no affect on the `AUTOCONFIGURE` command.)


    # Question 3


    The correct answer is **D.** Nodes (servers) are usually cataloged implicitly
    whenever a remote database is cataloged via the Configuration Assistant. However,
    if you want to explicitly catalog (i.e., add an entry to the node directory for
    a particular server), you can do so by executing a `CATALOG…NODE` command that
    corresponds to the communications protocol that will be used to access the server
    being cataloged. The syntax for the `CATALOG TCPIP NODE` command is:


    ![Image](images/35.jpg)


    where:


    | `NodeName` | Identifies the alias to be assigned to the node to be cataloged.
    This is an arbitrary name created on the user’s workstation and is used to identify
    the node. |

    | `IPAddress` | Identifies the IP address of the server where the remote database
    you are trying to communicate with resides. |

    | `HostName` | Identifies the host name, as it is known to the TCP/IP network.
    (This is the name of the server where the remote database you are trying to communicate
    with resides.) |

    | `ServiceName` | Identifies the name of the service with which the DB2 Database
    Manager instance on the server uses to communicate. |

    | `PortNumber` | Identifies the port number with which the DB2 Database Manager
    instance on the server uses to communicate. |

    | `InstanceName` | Identifies the name of the server instance to which an attachment
    is to be made. |

    | `SystemName` | Identifies the DB2 system name that is used to identify the server
    workstation. |

    | `SystemType` | Identifies the type of operating system being used on the server
    workstation. The following values are valid for this parameter: AIX, WIN, HPUX,
    SUN, OS390, OS400, VM, VSE, and LINUX. |

    | `Description` | A comment used to describe the node entry that will be made
    in the node directory for the node being cataloged. The description must be enclosed
    by double quotation marks. |


    Thus, if you wanted to catalog a node for a Linux server that has the IPv6 address
    1800:0:0:0:6:400:200C:217A and a DB2 instance named `DB2INST1` that is listening
    on port 60000 and assign it the alias `RMT_SERVER`, you could do so by executing
    a `CATALOG TCPIP NODE` command that looks something like this:


    ![Image](images/36.jpg)


    # Question 4


    The correct answer is **D.** The `auto_maint` database configuration parameter
    enables or disables automatic maintenance for a database; this is the parent of
    all other automatic maintenance database configuration parameters (`auto_db_backup`,
    `auto_tbl_maint`, `auto_runstats`, `auto_stats_prof`, and `auto_reorg`). When
    this parameter is assigned the value OFF, all of its children parameters are disabled,
    but their settings, as recorded in the database configuration file, do not change.
    When this parameter is assigned the value ON, recorded values for its children
    parameters take effect.


    The `auto_tbl_maint` database configuration parameter enables or disables automatic
    table maintenance for a database; this is the parent of all table maintenance
    parameters (`auto_runstats`, `auto_stats_prof`, `auto_prof_upd`, and `auto_reorg`).
    When this parameter is set to OFF, all of its children parameters are disabled,
    but their settings, as recorded in the database configuration file, do not change.
    When this parameter is assigned the value ON, recorded values for its children
    parameters take effect.


    The `auto_reorg` database configuration parameter enables or disables automatic
    table and index reorganization for a database. When this parameter is assigned
    the value ON, table and index reorganization operations are performed automatically,
    when necessary.


    # Question 5


    The correct answer is **B.** The `auto_maint` database configuration parameter
    enables or disables automatic maintenance for a database so it must be assigned
    the value ON before any automatic maintenance operation can be performed; the
    `auto_tbl_maint` database configuration parameter enables or disables automatic
    table maintenance for a database so it must be assigned the value ON before automatic
    table maintenance operations can be performed; the `auto_runstats` database configuration
    parameter enables or disables automatic table RUNSTATS operations for a database
    so it must be assigned the value ON before automatic statistics collection for
    a database will be performed.


    The `auto_stats_prof` database configuration parameter enables or disables automatic
    statistical profile generation for a database so it does not have to be assigned
    the value ON before automatic statistics collection for a database will be performed.


    # Question 6


    The correct answer is **D.** When a DB2 9 database is created, automatic maintenance
    is enabled by default; when the database configuration parameters are reset to
    their system defaults (by executing the `RESET DATABASE CONFIGURATION` command),
    the `AUTO_MAINT`, `AUTO_DB_BACKUP`, and `AUTO_TBL_MAINT` configuration parameters
    are assigned the value `ON`. The `auto_stats_prof` database configuration parameter
    enables or disables automatic statistical profile generation for a database. When
    this parameter is assigned the value `ON`, statistical profile generation operations
    are performed automatically, when necessary.


    # Question 7


    The correct answers are **A** and **D.** The value assigned to the `UTIL_IMPACT_LIM
    DB2` Database Manager configuration parameter limits the amount of performance
    degradation throttled utilities can have on a production workload. To define the
    impact policy for *all* throttled utilities, you simply assign the `UTIL_IMPACT_LIM`
    configuration parameter any value between 1 and 100; If `UTIL_IMPACT_LIM` is set
    to 100, utilities are not throttled.


    Although the impact policy for throttled utilities is defined by the value assigned
    to the `UTIL_IMPACT_LIM` configuration parameter, this policy can be overridden
    by using a special option that is available with the commands that are used are
    to invoke throttled utilities. The syntax for this special option is:


    ![Image](images/38-1.jpg)


    where:


    | `Priority` | Specifies the amount of throttling to which the utility is to be
    subjected. A value of 100 represents the highest priority; a value of 1 represents
    the lowest. If no `Priority` is specified, the utility will be executed with a
    default priority of 50. (All utilities at the same priority undergo the same amount
    of throttling, and utilities at lower priorities are throttled more than those
    at higher priorities.) |


    Thus, if you wanted to collect statistics for a table named `EMPLOYEE` and have
    the operation run throttled with a priority of 10, you could do so by executing
    a `RUNSTATS` command that looks something like this:


    ![Image](images/38-2.jpg)


    # Question 8


    The correct answer is **A.** If you want to change the impact priority (level
    of throttling) of a utility that is already running, you can do so by executing
    the `SET UTIL_IMPACT_PRIORITY` command. The syntax for this command is:


    ![Image](images/38-3.jpg)


    where:


    | `UtilityID` | Identifies the running utility, by ID, whose priority is to be
    changed. (The ID assigned to a running utility can be obtained by executing the
    `LIST UTILITIES` command.) |

