  trans: "\n\n| parameter | value | description |\n| :--- | :--- | :--- |\n| tpm |\
    \ 1-200,000 默认: 60 | 每分钟执行的事务平均数（估计）。注意：DB2 性能监控程序可以帮助你获得更准确的 TPM 测量。 |\n| admin_priority\
    \ | performance, recovery, both 默认: both | 数据库应优化的活动类型。有效值包括：performance——数据库应针对事务性能进行优化（备份/恢复速度较慢）；recovery——数据库应针对备份和恢复进行优化（事务性能较慢）；或\
    \ both——数据库应同时针对事务性能和备份/恢复进行优化（两者同等重要）。 |\n| is_populated | yes, no 默认: yes |\
    \ 表示数据库当前是否包含数据。有效值如下：yes—数据库包含数据；以及 no——数据库不包含数据。 |\n| num_local_apps | 0-5,000\
    \ 默认: 0 | 一时连接到数据库的本地应用程序数量。 |\n| num_remote_apps | 0-5,000 默认: 10 | 一时连接到数据库的远程应用程序数量。为处理所有所需的连接（包括本地和远程）分配内存，可以确保用户无需等待现有连接终止即可连接。然而，为连接过度分配内存可能会导致资源浪费。DB2\
    \ 性能监控程序可以帮助你确定在特定时间范围内实际获取了多少连接。 |\n| isolation | RR, RS, CS, UR 默认: RR | 大多数访问数据库的应用程序使用的隔离级别。有效值包括：RR—可重复读（长时间获取大量锁）；RS—可一致性读取（长时间获取较少锁）；CS—游标稳定（短时间内获取大量锁）；以及\
    \ UR—未提交的读取（不获取任何锁）。 |\n| bp_resizeable | yes, no 默认: yes | 缓冲区池是否可调整大小？ |\n\n\
    如果在 `AUTOCONFIGURE` 命令中指定了 `APPLY DB ONLY` 子句，则 Design Advisor 建议的数据库配置和缓冲区池更改将应用于相应的数据库配置文件；如果指定了\
    \ `APPLY DB AND DBM` 子句，则建议的数据库配置和缓冲区池更改将应用到数据库配置文件，而建议的实例配置更改将应用到相应的 DB2 数据库管理器配置文件。如果改为指定\
    \ `APPLY NONE` 子句，将显示更改建议但不会应用。\n\n因此，如果你想为一个名为 `SAMPLE`、使用可调整大小缓冲区池且包含数据的 OLTP\
    \ 数据库确定最佳配置，并希望在将更改应用于相应的数据库配置文件之前审查任何建议的更改，可以通过执行如下所示 `AUTOCONFIGURE` 命令来实现：\n\
    \n![Image](img/14.jpg)\n\n另一方面，如果你想确定当系统 60% 的内存可供 DB2 数据库管理器在执行数据库操作时使用，实例仅控制一个数据库（名为\
    \ `SAMPLE`），并且你希望自动更新相应的配置文件以反映任何建议的更改，你可以通过执行如下所示 `AUTOCONFIGURE` 命令来实现：\n\n\
    ![Image](img/15.jpg)\n\n![Image](img/paper.jpg) `AUTOCONFIGURE` 命令（以及 Design Advisor）始终会建议配置数据库利用自调优内存管理器（Self-Tuning\
    \ Memory Manager）。然而，如果你对一个位于 `SHEAPTHRES` 配置参数被分配非零值的实例中的数据库运行 `AUTOCONFIGURE`\
    \ 命令，则排序内存堆数据库配置参数 (`SORTHEAP`) 将不会配置为自动调优。因此，如果你想启用排序内存调优，必须在执行 `AUTOCONFIGURE`\
    \ 命令之前执行命令 `UPDATE DATABASE MANAGER CONFIGURATION USING SHEAPTHRES 0`。\n\n# 配置通信\n\
    \n在典型的客户端/服务器环境中，存储在服务器上的数据库由存储在远程客户端工作站的应用程序访问，使用所谓的分布式连接。分布式连接除了为客户端应用程序提供访问远程服务器上集中数据库的方法外，还为管理员提供了远程管理数据库和服务器的方法。\n\
    \n当 DB2 安装在工作站上时，它会自动配置以利用为该特定工作站设置的任何通信协议（前提是这些协议被 DB2 识别）。此时，在创建 DAS 实例和默认实例时，会收集并将每个可用通信协议的信息存储在它们的配置文件中。然而，当激活新协议或重新配置现有协议时，这些信息不会自动更新。相反，你必须在这些更改生效之前手动为每个实例配置通信。\n\
    \n# 手动配置通信\n\n手动配置通信或更改通信配置的最简单方法是使用“设置通信”（Setup communications）对话框，可以通过 Control\
    \ Center 中的“实例”（Instances）菜单中选择相应的操作来激活。图 2–2 显示了如何使用设置通信对话框为特定实例配置 TCP/IP 协议。\n\
    \n![Image](img/16.jpg)\n\n*图 2–2：设置通信对话框和配置 TCP/IP 对话框。*\n\n如果你选择不使用设置通信对话框手动配置通信，你必须遵循的步骤可能会根据使用的通信协议而异。例如，如果你想配置服务器使用\
    \ TCP/IP，必须执行以下步骤（顺序不限）：\n\n1. 为 `DB2COMM` 注册变量分配值 `TCPIP`。\n\n   每当你手动为服务器配置通信时，在实例开始使用所需的通信协议之前，必须更新\
    \ `DB2COMM` 注册变量的值。分配给 `DB2COMM` 注册变量的值用于在启动特定实例的 DB2 数据库管理器时激活哪些通信管理器。\n\n  \
    \ 通过执行如下所示的 `db2set` 命令为 `DB2COMM` 注册变量分配值 `TCPIP`：\n\n   ![Image](img/17-1.jpg)\n\
    \n2. 将数据库服务器接收远程客户端通信的 TCP/IP 端口名称分配给 DB2 数据库管理器配置文件中的 `svcename` 参数。\n\n   `svcename`\
    \ 参数应设置为与主连接端口关联的服务名称，以便当数据库服务器启动时，它可以确定在哪个端口监听传入的连接请求。此参数通过执行如下所示的 `UPDATE DATABASE\
    \ MANAGER CONFIGURATION` 命令设置：\n\n   ![Image](img/17-2.jpg)\n\n3. 如果适当，更新数据库服务器上的\
    \ services 文件。\n\n   TCP/IP services 文件标识了服务器应用程序监听客户端请求的端口。如果你在 DB2 数据库管理器配置文件的\
    \ `svcename` 参数中指定了服务名称，则必须将相应的服务名称到端口号/协议的映射添加到服务器上的 services 文件中。（如果你在 `svcename`\
    \ 参数中直接指定了端口号，则不需要更新 services 文件。）\n\n"
