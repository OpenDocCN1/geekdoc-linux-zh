    # CHAPTER 6


    ## 高可用 (High Availability)


    10.5% 的 DB2 9 for Linux, UNIX, and Windows 数据库管理升级考试（考试 736）旨在评估你对事务和事务日志的知识，并测试你备份和恢复数据库以及成功建立高可用灾难恢复（HADR）环境的能力。构成考试这部分的问题旨在评估以下内容：


    * 你使用 `RECOVER DATABASE` 命令的能力

    * 你对高可用灾难恢复（HADR）的知识


    本章旨在向你介绍 DB2 提供的备份和恢复工具，并向你展示如何使用 `RECOVER DATABASE` 命令恢复受损的数据库，以及如何设置 HADR 环境。


    ## 事务与事务日志 (Transactions and Transaction Logging)


    事务（也称为工作单元）是将一个或多个 SQL 操作组合成单个单元的序列，通常位于应用程序进程内部。单个事务的启动和终止定义了数据库内部的数据一致性点；要么将事务内执行的所有操作的结果都应用到数据库并使其持久化（提交），要么将执行的所有操作的结果撤销（回滚），并将数据库恢复到事务启动之前的状态。


