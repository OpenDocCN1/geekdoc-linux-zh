  trans: "\n\n![round](img/round.jpg) C. 主服务器和备用服务器使用的 DB2 软件版本和位长度（32 或 64）必须相同。\n\
    \n![round](img/round.jpg) D. 主服务器和备用服务器上的表空间和表空间容器必须一致。\n\n# 答案\n\n## 问题 1\n正确答案是\
    \ **B.** `Recover` 实用程序根据恢复历史文件中的信息，执行必要的恢复和重滚操作，将数据库恢复到特定的时间点。（通过执行 `RECOVER\
    \ DATABASE` 命令调用恢复 实用程序。）如果 `Recover` 实用程序成功恢复了数据库，但由于某些原因在尝试重滚时失败，则必须重新执行整个恢复操作。无法从故障点重启恢复操作。\n\
    \n## 问题 2\n正确答案是 **C.** 在分区数据库环境中，必须从数据库的目录分区调用 `Recover` 实用程序。\n\n## 问题 3\n正确答案是\
    \ **C.** 在确保用作主、备服务器的系统相同且之间存在 `TCP/IP` 连接后，可以按照所示顺序执行以下任务来建立 HADR 环境：\n\n1. 确定主数据库服务器和备用数据库服务器的主机名、主机\
    \ IP 地址以及服务名或端口号。\n2. 通过恢复备份映像或初始化将作为主数据库的数据库拆分镜像拷贝来创建备用数据库。\n3. 在主数据库和备用数据库上设置\
    \ `HADR` 配置参数。\n4. 连接到备用实例并在备用数据库上启动 `HADR`。\n5. 连接到主实例并在主数据库上启动 `HADR`。\n\n##\
    \ 问题 4\n正确答案是 **A.** 一旦建立了 HADR 环境，每当在主数据库上执行以下操作时，它们将自动在备用数据库中复制：\n\n* 执行数据定义语言\
    \ (DDL) 语句 `(CREATE, ALTER, DROP)`\n* 执行数据操纵语言 (DML) 语句 `(INSERT, UPDATE, DELETE)`\n\
    * 缓冲池操作\n* 表空间操作\n* 在线重组\n* 离线重组\n* 存储过程和用户定义函数 (UDFs) 的元数据更改\n\nHADR 不复制存储过程和\
    \ UDF 对象及库文件。如果需要此类复制，你必须在主数据库和备用数据库的相同路径上物理创建这些文件。（如果备用数据库找不到引用的对象或库文件，则存储过程或\
    \ UDF 的调用在备用数据库上将失败。）\n\n非日志操作（例如对数据库配置参数和恢复历史文件的更改）不会复制到备用数据库。\n\n## 问题 5\n正确答案是\
    \ **C.** 在 HADR 环境中，应用程序只能访问当前的主数据库——与备用数据库的同步是通过重滚在主数据库上生成并发送到备用数据库的事务日志数据的。\n\
    \n## 问题 6\n正确答案是 **B.** 主数据库和备用数据库必须是单分区数据库，并且它们具有相同的数据库名称；但它们不需要存储在相同的数据库路径上。\n\
    \n# 第 7 章\n\n## 安全\nDB2 9 for Linux, UNIX 和 Windows 数据库管理升级考试（考试 736）中有百分之十点五\
    \ (10.5%) 用于测试对 DB2 9 提供的保护数据和数据库对象免受未经授权访问和修改的新机制的知识。构成此部分的题目旨在评估以下内容：\n\n* 你识别\
    \ DB2 9 可用身份验证类型的能力\n* 你对实现基于标签的访问控制 (LBAC) 所需机制和步骤的了解\n\n本章旨在向你介绍 DB2 9 可用的新身份验证类型，并展示如何实现\
    \ LBAC 以控制对表或视图中列和行的访问。\n\n 控制数据库访问\n每个数据库管理系统都必须保护数据免受未经授权的访问和修改。DB2 使用外部安全和服务内部访问控制机制来执行此重要任务。在大多数情况下，采用了三个不同的安全级别：第一级控制对创建数据库的实例的访问，第二级控制对数据库本身的访问，第三级控制对数据库内数据和数据对象的访问。\n\
    \n### 身份验证\n大多数用户在访问 DB2 实例或数据库之前通过的第一道安全门户是被称为 `authentication` 的过程。目的是验证用户确实是他们所称的人。通常，身份验证由不是\
    \ DB2 的外部安全设施执行。该安全设施可能是操作系统的一部分（如 AIX、Solaris、Linux、HP-UX、Windows 2000/NT 等许多系统），可能是单独的插件（例如，分布式计算环境\
    \ [DCE] 安全服务），也可能完全不存在（Windows 95、Windows 98 和 Windows Millennium 版的情况）。如果存在安全设施，在用户通过身份验证之前，必须提供两个特定项目：唯一的用户\
    \ ID 和相应的密码。用户 ID 向安全设施标识用户，而密码（仅用户和安全设施已知的信息）用于验证用户确实是其所声称的人。\n\n### 身份验证发生在何处？\n\
    由于 DB2 可能存在于由多个客户端、网关和服务器组成的环境中，每个组件可能运行在不同的操作系统上，因此决定在哪里进行身份验证可能是一项艰的任务。为了简化问题，DB2\
    \ 在每个 DB2 数据库管理器配置文件中使用一个参数（`authentication` 参数）来确定如何以及何时对用户进行身份验证。此类文件与每个实例关联，分配给此参数的值（通常称为\
    \ `authentication type`）在创建实例时初始设置。每个实例仅存在一种身份验证类型，它控制对该实例以及对所有受该实例控制的数据库的访问。\n\
    \n以下是可用的身份验证类型：\n\n* **SERVER.** 身份验证发生在服务器工作站上，使用服务器操作系统提供的安全设施。（想要附加到实例或连接数据库的用户提供的用户\
    \ ID 和密码将与存储在服务器上的用户 ID 和密码组合进行比较，以确定该用户是否允许访问实例或数据库。）默认情况下，这是首次创建实例时使用的身份验证类型。\n\
    \ * **SERVER_ENCRYPT.** 身份验证发生在服务器工作站上，使用服务器操作系统提供的安全设施。然而，想要附加到实例或连接存储在服务器上的数据库的用户提供的密码，在发送到服务器工作站进行验证之前，可能在客户端工作站上进行加密。\n\
    \n"
- fmt: '

    ### CLIENT.

    Authentication occurs at the client workstation or database partition where a
    client application is invoked, using the security facility that is provided by
    the client’s operating system, assuming one is available. If no security facility
    is available, authentication is handled in a slightly different manner. The user
    ID and password provided by the user wishing to attach to an instance or connect
    to a database are compared to the user ID and password combinations stored at
    the client or node to determine whether the user is permitted to access the instance
    or the database.


    ### KERBEROS.

    Authentication occurs at the server workstation, using a security facility that
    supports the `Kerberos` security protocol. This protocol performs authentication
    as a third-party service by using conventional cryptography to create a shared
    secret key. The key becomes the credentials used to verify the identity of the
    user whenever local or network services are requested; this eliminates the need
    to pass a user ID and password across the network as ASCII text. It should be
    noted that the `KERBEROS` authentication type is supported only on clients and
    servers that are using the Windows operating system. In addition, both client
    and server workstations must either belong to the same Windows domain or belong
    to trusted domains.


    ### KRB_SERVER_ENCRYPT.

    Authentication occurs at the server workstation, using either the `KERBEROS` or
    `SERVER_ENCRYPT` authentication method. If the client’s authentication type is
    set to `KERBEROS,`, authentication is performed at the server using the Kerberos
    security system. On the other hand, if the client’s authentication type is set
    to anything other than `KERBEROS,`, or if the Kerberos authentication service
    is unavailable, the server acts as if the `SERVER_ENCRYPT` authentication type
    was specified, and the rules of this authentication method apply.


    Along with these traditional authentication types, four new authentication types
    are available with DB2 9. They are:


    #### DATA_ENCRYPT.

    Authentication occurs at the server workstation, using the `SERVER_ENCRYPT` authentication
    method. In addition, the following data is encrypted before it is passed from
    client to server and from server to client:


    *   SQL and XQuery statements.

    *   SQL program variable data.

    *   Output data from the server processing of an SQL statement or XQuery expression,
    including a description of the data.

    *   Some or all of the result set data produced in response to a query.

    *   Large object (LOB) data streaming.

    *   SQLDA descriptors.


    #### DATA_ENCRYPT_CMP.

    Authentication occurs at the server workstation, using the `SERVER_ENCRYPT` authentication
    method; all user data is encrypted before it is passed from client to server and
    from server to client. In addition, this authentication type provides compatibility
    for down-level products that do not support the `DATA_ENCRYPT` authentication
    type. Such products connect using the `SERVER_ENCRYPT` authentication type, and
    user data is not encrypted.


    #### GSSPLUGIN.

    Authentication occurs at the server workstation, using a Generic Security Service
    Application Program Interface (GSS-API) plug-in. If the client’s authentication
    type is not specified, the server returns a list of server-supported plug-ins
    (found in the `srvcon_gssplugin_list` database manager configuration parameter)
    to the client. The client then selects the first plug-in found in the client plug-in
    directory from the list. If the client does not support any plug-in in the list,
    the client is authenticated using the `KERBEROS` authentication method.


    #### GSS_SERVER_ENCRYPT.

    Authentication occurs at the server workstation, using either the `GSSPLUGIN`
    or the `SERVER_ENCRYPT` authentication method. That is, if client authentication
    occurs through a GSS-API plug-in, the client is authenticated using the first
    client-supported plug-in found in the list of server-supported plug-ins. If the
    client does not support any of the plug-ins found in the server-supported plug-in
    list, the client is authenticated using the `KERBEROS` authentication method.
    If the client does not support the Kerberos security protocol, the client is authenticated
    using the `SERVER_ENCRYPT` authentication method.


    # Authorities and Privileges

    Once a user has been authenticated, and an attachment to an instance or a connection
    to a database has been established, the DB2 Database Manger evaluates any authorities
    and privileges that have been assigned to the user to determine what operations
    the user is allowed to perform. Privileges convey the rights to perform certain
    actions against specific database resources (such as tables and views). Authorities
    convey a set of privileges or the right to perform high-level administrative and
    maintenance/utility operations on an instance or a database. Authorities and privileges
    can be assigned directly to a user, or they can be obtained indirectly from the
    authorities and privileges that have been assigned to a group of which the user
    is a member. Together, authorities and privileges act to control access to the
    DB2 Database Manager for an instance, to one or more databases running under that
    instance’s control, and to a particular database’s objects. Users can work only
    with those objects for which they have been given the appropriate authorization—that
    is, the required authority or privilege. [Figure 7–1](#017_Chapter07.xhtml_img7_1)
    provides a hierarchical view of the authorities and privileges that are recognized
    by DB2 9.


    ![Image](images/180.jpg)


    *Figure 7–1: Hierarchy of the authorities and privileges available with DB2 9.*


    # Securing Data with Label-Based Access Control (LBAC)

    Label-based access control (LBAC) is a new security feature that uses one or more
    security labels to control who has read access and who has write access to individual
    rows and/or columns in a table or view. The United States and many other governments
    use LBAC models in which hierarchical classification labels such as `CONFIDENTIAL,
    SECRET,` and `TOP SECRET` are assigned to data based on its sensitivity. Access
    to data labeled at a certain level (for example, `SECRET)` is restricted to those
    users who have been granted that level of access or higher. With LBAC, you can
    construct security labels to represent any criteria your company uses to determine
    who can read or modify particular data values.


    ## Security Administrator authority

    One problem with the traditional security methods DB2 uses is that Security Administrators
    and Database Administrators have access to sensitive data stored in the databases
    they oversee. To solve this problem, LBAC-security administration tasks are isolated
    from all other tasks—only users with Security Administrator `(SECADM)` authority
    are allowed to configure LBAC elements.


    Security Administrator `(SECADM)` authority is a special database level of authority
    that is designed to allow special users to configure various label-based access
    control (LBAC) elements to restrict access to one or more tables. Users who are
    granted this authority are allowed to perform only the following tasks:


    *   Create and drop security policies

    *   Create and drop security labels

    *   Grant and revoke security labels to and from individual users (using the `GRANT
    SECURITY LABEL` and `REVOKE SECURITY LABEL` SQL statements)

    *   Grant and revoke LBAC rule exemptions

    *   Grant and revoke `SETSESSIONUSER` privileges (using the `GRANT SETSESSIONUSER`
    SQL statement)

    *   Transfer ownership of any object not owned by the Security Administrator (by
    executing the `TRANSFER OWNERSHIP` SQL statement)


    No other authority, including System Administrator authority, provides a user
    with these abilities.


    ## Implementing Row-Level LBAC

