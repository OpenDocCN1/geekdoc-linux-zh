    # 用程序节流


    自动维护活动（备份、统计收集、统计分析以及表/索引重组）在运行时会消耗资源，并可能影响数据库的性能。此外，离线数据库备份和表/索引重组操作可能会限制对表、索引或整个数据库的访问。为了减少系统影响，可以使用
    DB2 的自适应用程序节流系统调节某些自动维护活动的资源使用。


    自适应用程序节流系统允许在关键期间并发运行维护用程序，同时将它们对生产工作负载的性能控制在可接受范围内。以下维护操作可以被节流：


    * 统计收集

    * 备份操作

    * 重平衡操作

    * 异步索引清理


    分配给 `util_impact_lim` DB2 数据库配置参数的值限制了节流程序对生产工作负载造成的性能下降幅度。要定义*所有*节流用程序的影响策略，只需为
    `util_impact_lim` 配置参数分配 1 到 100 之间的任何值即可。例如，为了配置实例使自动备份操作调用对系统工作负载的影响不超过 10%，您可以通过执行如下所示
    `UPDATE DATABASE MANAGER` 命令将 `util_impact_lim` 配置参数赋值为 10：


    ![Image](img/22.jpg)


    正如您预期的，节流的程序通常比未节流的程序需要更长时间才能完成。如果您发现某个用程序运行时间过长，可以增加分配给 `util_impact_lim` 配置参数的值，也可以通过将
    `util_impact_lim` 配置参数设置为 100 来完全禁用节流。（如果 `util_impact_lim` 设置为 100，则用程序调用将不会被节流。在这种情况下，用程序可以更快完成，但它们很可能对工作负载性能产生不利影响。）


    尽管节流用程序的影响策略是由分配给 `util_impact_lim` 配置参数的值定义的，但可以使用调用节流用程序的命令中提供的特殊选项来重写此策略。该特殊选项的语法为：


    ![Image](img/23-1.jpg)


    其中：


    | `Priority` | 指定用程序所承受的节流程度。值 100 代表最高优先级；值 1 代表最低优先级。如果没有指定 `Priority`，则用程序将以默认优先级
    50 执行。（所有具有相同优先级的用程序将受到相同程度的节流，低优先级的用程序受到的节流程度比高优先级的用程序多。） |


    [content]


    例如，如果您想备份一个名为 `SALES` 的数据库，并让备份操作以 20 的优先级节流运行，可以通过执行如下所示的 `BACKUP DATABASE` 命令来实现：


    ![Image](img/23-2.jpg)


    如果执行调用节流用程序的命令时不带有 `UTIL_IMPACT_PRIORITY` 选项，则用程序将未节流运行，即使 `util_impact_lim` 配置参数已被分配了除
    100 以外的值。


    # 获取有关运行中用程序的信息


    如果您想找出是否有用程序正在实例上运行，以及它们的节流影响优先级是多少，可以通过执行 `LIST UTILITIES` 命令来实现。该命令的语法为：


    ![Image](img/24-1.jpg)


    因此，如果您为名为 `SAMPLE` 的数据库启动了未节流的备份操作，可以通过执行如下所示的 `LIST UTILITIES` 命令获取有关该操作的详细信息：


    ![Image](img/24-2.jpg)


    当执行此命令时，产生的信息类似于：


    ![Image](img/24-3.jpg)


    # 更改运行中用程序的影响优先级


    如果您想更改已运行用程序的影响优先级（节流级别），可以通过执行 `SET UTIL_IMPACT_PRIORITY` 命令来实现。通过此命令，您可以：


    * 对以未节流模式启动的运行用程序进行节流，

    * 对运行中的节流用程序取消节流（禁用节流），

    * 重新调整运行节流用程序的优先级（当同时运行了多个节流用程序且其中一个比其他更重要时，这非常有用）。


    `SET UTIL_IMPACT_PRIORITY` 命令的语法为：


    ![Image](img/25-1.jpg)


    其中：


    | `UtilityID` | 通过 ID 标识要更改优先级的运行用程序。（分配给运行用程序的 ID 可以通过执行 `LIST UTILITIES` 命令获取。）
    |

    | `Priority` | 指定与运行指定的用程序相关的影响的实例级限制。值 100 代表最高优先级；值 1 代表最低优先级。将 `Priority` 设置为
    0 将强制节流用程序继续以未节流模式运行；将 `Priority` 设置为非零值将强制未节流的用程序继续以节流模式运行。 |


    因此，如果您想强制早之前（通过 `LIST UTILITIES` 命令）获取信息的未节流备份操作继续以节流模式运行，可以执行如下所示的 `SET UTIL_IMPACT_PRIORITY`
    命令：


    ![Image](img/25-2.jpg)


    当执行此语句时，备份操作对服务器正在处理的总工作负载的平均影响不应超过 20%。


    # 自调优内存管理器


    尽管用程序节流可以帮助减少用程序执行对生产工作负载的影响，但工作负载的性能表现（好或坏）通常取决于服务器对内存等资源的利用情况。正如我们之前看到的，DB2
    数据库管理器配置和数据库配置参数控制着为实例和数据库分配系统资源。在 DB2 9 中，一种名为自调优内存管理器 (STMM) 的内存调优功能通过在测量和分析每个
    DB2 内存消费者使用可用内存的情况后，自动设置这些参数的值，简化配置内存相关数据库参数的任务。以下内存消费者可以启用自调优：


    * 缓冲池（由 `ALTER BUFFERPOOL` 和 `CREATE BUFFERPOOL` 语句控制）

    * 程序包缓存（由 `pckcachesz` 配置参数控制）

    * 锁内存（由 `locklist` 和 `maxlocks` 配置参数控制）

    * 排序内存（由 `sheapthres_shr` 和 `sortheap` 配置参数控制）

    * 数据库共享内存（由 `database_memory` 配置参数控制）


