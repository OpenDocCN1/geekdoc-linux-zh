    ### 11. Several autonomic features are enabled.


    To help make management easy, whenever a new database is created, the following
    features are enabled:


    - Automatic Maintenance (database backups, table and index reorganization, data
    access optimization, and statistics profiling)

    - Self-Tuning Memory Manager (package cache, locking memory, sort memory, database
    shared memory, and buffer pool memory)

    - Utility throttling

    - The Health Monitor


    ### 12. The Configuration Advisor is launched.


    The Configuration Advisor is a tool designed to help you tune performance and
    balance memory requirements for a database by suggesting which configuration parameters
    to modify based on information you provide about the database. In DB2 9, the Configuration
    Advisor is automatically invoked whenever you create a database, unless the default
    behavior is changed by assigning the value `NO` to the `DB2_ENABLE_AUTOCONFIG_DEFAULT`
    registry variable.


    # The Complete CREATE DATABASE Command


    When the simplest form of the `CREATE DATABASE` command is executed, the characteristics
    of the database created, such as the storage and transaction logging method used,
    are determined by several predefined defaults. If you wish to change any of the
    default characteristics, you must specify one or more options available when executing
    the `CREATE DATABASE` command. The complete syntax for this command is:


    ![Image](images/52-1.jpg)


    or


    ![Image](images/52-2.jpg)


    where:


    | :--- | :--- |

    | `DatabaseName` | Identifies the unique name that is to be assigned to the database
    to be created. |

    | `StoragePath` | If `AUTOMATIC STORAGE YES` is specified (the default), identifies
    one or more storage paths that are to be used to hold table space containers used
    by automatic storage. Otherwise, identifies the location (drive or directory)
    where the directory hierarchy and files associated with the database to be created
    are to be physically stored. |

    | `DBPath` | If `AUTOMATIC STORAGE YES` is specified (the default), identifies
    the location (drive or directory) where the directory hierarchy and metadata files
    associated with the database to be created are to be physically stored. (If this
    parameter is not specified, and automatic storage is used, the metadata files
    will be stored in the first storage path specified in the `StoragePath` parameter.)
    |

    | `Alias` | Identifies the alias to be assigned to the database to be created.
    |

    | `CodeSet` | Identifies the code set to be used for storing data in the database
    to be created. (In a DB2 9 database, each single-byte character is represented
    internally as a unique number between 0 and 255. This number is referred to as
    the code point of the character; the assignments of code points to every character
    in a particular character set are called the code page; and the International
    Organization for Standardization term for a code page is code set.) |

    | `Territory` | Identifies the territory to be used for storing data in the database
    to be created. |

    | `CollateType` | Specifies the collating sequence (i.e., the sequence in which
    characters are ordered for the purpose of sorting, merging, and making comparisons)
    that is to be used by the database to be created. The following values are valid
    for this parameter: COMPATABILITY, IDENTITY, IDENTITY_16BIT, UCA400_NO, UCA400_LSK,
    UCA400_LTH, NLSCHAR, and SYSTEM. |

    | `NumSegments` | Specifies the number of directories that are to be created and
    used to store files for the default SMS table space used by the database to be
    created `(TEMPSPACE1)`. |

    | `DefaultExtSize` | Specifies the default extent size to be used whenever a table
    space is created and no extent size is specified during the creation process.
    |

    | `Description` | A comment used to describe the database entry that will be made
    in the database directory for the database to be created. The description must
    be enclosed by double quotation marks. |

    | `Keyword` | One or more keywords recognized by the `AUTOCONFIGURE` command.
    Valid values include `mem_percent, workload_type, num_stmts, tpm, admin_priority,
    is_populated, num_local_apps, num_remote_apps, isolation`, and `bp_resizable.`
    Refer to the `DB2 9 Command Reference* for more information on how the `AUTOCONFIGURE`
    command is used. |

    | `Value` | Identifies the value that is to be associated with the `Keyword` specified.
    |

    | `TS_Definition` | Specifies the definition that is to be used to create the
    table space that will be used to hold the system catalog tables (SYSCATSPACE),
    user-defined objects (USERSPACE1), and/or temporary objects (TEMPSPACE1). |


    The syntax used to define a system managed (SMS) table space is:


    ![Image](images/54-1.jpg)


    The syntax used to define a database managed (DMS) table space is:


    ![Image](images/54-2.jpg)


    And the syntax used to define an automatic storage table space is:


    ![Image](images/54-3.jpg)


    where:


    | :--- | :--- |

    | `Container` | Identifies one or more containers to be used to store data that
    will be assigned to the table space specified. For SMS table spaces, each container
    specified must identify a valid directory; for DMS `FILE` containers, each container
    specified must identify a valid file; and for DMS `DEVICE` containers, each container
    specified must identify an existing device. |

    | `NumberOfPages` | Specifies the number of pages to be used by the table space
    container. |

    | `ExtentSize` | Specifies the number of pages of data that will be written in
    a round-robin fashion to each table space container used. |

    | `PrefetchSize` | Specifies the number of pages of data that will be read from
    the specified table space when data prefetching is performed. |

    | `Overhead` | Identifies the input/output (I/O) controller overhead and disk-seek
    latency time (in number of milliseconds) associated with the containers that belong
    to the specified table space. |

    | `TransferRate` | Identifies the time, in number of milliseconds, that it takes
    to read one page of data from a table space container and store it in memory.
    |

    | `InitialSize` | Specifies the initial size an autoresizing DMS or an automatic
    storage table space should be. |

    | `Increment` | Specifies the amount by which a table space that has been enabled
    for automatic resizing will be increased when the table space becomes full and
    a request for space is made. |

    | `MaxSize` | Specifies the maximum size to which a table space that has been
    enabled for automatic resizing can be increased to. |


    If the `RESTRICTIVE` clause is specified, the `RESTRICT_ACCESS` database configuration
    parameter for the database being created will be set to `YES,`, and no privileges
    will be granted to the group `PUBLIC.`


