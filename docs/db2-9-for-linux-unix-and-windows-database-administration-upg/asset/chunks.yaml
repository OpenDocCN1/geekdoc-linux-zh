    # 激活事件监视器


    与快照监视器一样，事件监视器会在与其关联的数据库激活或建立数据库连接后立即收集监控数据——前提是在创建事件监视器时指定了 `AUTOSTART` 选项。如果使用的是
    `MANUALSTART` 选项，或者未指定任何选项（在这种情况下默认使用 `MANUALSTART` 选项），则必须在事件监视器开始收集数据之前激活它。通过执行
    `SET EVENT MONITOR` SQL 语句可以激活（去激活）事件监视器。


    当事件监视器激活（启动）时，它会静静地在后台运行并与其关联的事件之一发生。在监控的事件发生后，事件监视器会收集与触发它的事件相关的监控数据，并将所有收集的数据写入事件监视器的目标位置。因此，事件本身控制监控数据的收集时机——与快照监视器不同，不需要特殊步骤来捕监控数据。


    # 其他故障排除工具


    除了数据库系统监视器外，还有其他实用工具可以帮助数据库管理员隔离并识别系统、数据库或应用程序的问题。一些常用的故障排除工具包括绑定文件描述工具（Bind File
    Description tool）、DB2 内存跟踪工具和 DB2 问题确定工具。在本节中，我们将详细查看每种工具。


    # DB2 绑定文件描述工具


    DB2 绑定文件描述工具可用于检查和验证绑定文件内的 SQL 语句，并显示创建绑定文件时使用的预编译选项。通过执行 `db2bfd` 命令调用 DB2 绑定文件描述工具。该命令的语法如下：


    ![Image](img/134-1.jpg)


    其中：


    | BindFileName* | 通过名称标识要检索并显示内容的绑定文件。 |


    此命令显示的所有选项都在表 5.4 中描述。


    | 表 5.4 db2bfd 命令选项 |


    | 选项 | 含义 |

    | :--- | :--- |

    | -b | 指定显示绑定文件头。 |

    | -s | 指定显示绑定文件中的 SQL 语句。 |

    | -v | 指定显示绑定文件中的主机变量声明。 |

    | -h | 显示帮助信息。当指定此选项时，所有其他选项均被忽略，仅显示帮助信息。 |


    因此，如果你想查看名为 `DB29TEST.BND` 的绑定文件的内容，可以通过执行类似下面的 `db2bfd` 命令来实现：


    ![Image](img/134-2.jpg)


    # DB2 内存跟踪


    DB2 内存跟踪工具用于生成实例、数据库和代理（agents）内存状态的完整报告。该工具提供了有关内存池分配的以下信息：


    * 当前大小

    * 最大大小（硬限制）

    * 最大大小（高水位）

    * 类型（指示内存将用途的标识符）

    * 分配池的代理（仅当内存池为私有时有效）


    （此信息也可以从快照监视器获取。）


    通过执行 `db2mtrk` 命令调用 DB2 内存跟踪工具。该命令的语法如下：


    ![Image](img/135.jpg)


    其中：


    | Interval* | 标识连续调用 DB2 内存跟踪工具之间的等待秒数。 |

    | Count* | 标识重复调用 DB2 内存跟踪工具的次数。 |


    此命令显示的所有其他选项都在表 5.5 中描述。


    | 表 5.5 db2mtrk 命令选项 |


    | 选项 | 含义 |

    | :--- | :--- |

    | -i | 指定收集并显示实例级内存信息。 |

    | -d | 指定收集并显示数据库级内存信息。 |

    | -P | 指定收集并显示私有内存信息。 |

    | -m | 指定收集并显示每个内存池的最大值。 |

    | -w | 指定收集并显示每个内存池的高水位。 |

    | -v | 表示返回详细输出。 |

    | -h | 显示帮助信息。当指定此选项时，所有其他选项均被忽略，仅显示帮助信息。 |


    因此，如果你想查看系统中活动数据库的内存情况，可以通过执行类似下面的 `db2mtrk` 命令来实现：


