    The location to which all monitor data collected is to be written must be specified
    as well; output from an event monitor can be written to to one or more database
    tables, one or more external files, or a named pipe. Table event monitors and
    pipe event monitors stream event records directly to the table or named pipe.
    File event monitors, on the other hand, stream event records to a series of eight-character
    numbered files that have the extension “.evt” (for example, 00000000.evt, 00000001.evt,
    00000002.evt, etc.).


    Thus, if you wanted to create an event monitor that captures the values of all
    application-level counters and writes them to a database table named `CONN_DATA`
    every time an application that is connected to a database terminates its connection,
    you could do so by executing a `CREATE EVENT MONITOR` statement that looks something
    like this:


    ![Image](images/133-1.jpg)


    On the other hand, if you wanted to create an event monitor that captures historical
    information about SQL statements that have been executed within the current transaction
    when a deadlock cycle occurs and writes all data collected to a directory named
    `/export/home/DL_DATA`, you could do so by executing a `CREATE EVENT MONITOR`
    statement that looks something like this:


    ![Image](images/133-2.jpg)


    # Activating event monitors


    Like the snapshot monitor, event monitors will begin collecting monitor data as
    soon as the database with which they are associated is activated or a connection
    to the database is established—provided the `AUTOSTART` option was specified when
    the event monitor was created. If the `MANUALSTART` option was used instead, or
    if neither option was specified (in which case the `MANUALSTART` option is used
    by default), an event monitor must be activated before it will begin collecting
    data. Event monitors are activated (and deactivated) by executing the `SET EVENT
    MONITOR` SQL statement.


    When an event monitor is activated (started), it sits quietly in the background
    and waits for one of the events it is associated with to occur. Immediately after
    an event being monitored takes place, the event monitor collects monitor data
    associated with the event that triggered it and writes all data collected to the
    event monitor’s target location. Thus, the event itself controls when monitor
    data is collected—unlike with the snapshot monitor, no special steps are required
    to capture the monitor data.


    # Other Troubleshooting Tools


    Along with the database system monitor, several others utilities are available
    to help a database administrator isolate and identify problems with a system,
    database, or application. Some of the more popular troubleshooting utilities include
    the Bind File Description tool, the DB2 memory tracker utility, and the DB2 Problem
    Determination tool. In this section, we’ll take a closer look at each.


    # The DB2 Bind File Description Tool


    The DB2 Bind File Description Tool can be used to examine and to verify the SQL
    statements within a bind file, as well as to display the precompile options used
    to create the bind file. The DB2 Bind File Description Tool is invoked by executing
    the `db2bfd` command. The syntax for this command is:


    ![Image](images/134-1.jpg)


    where:


    | BindFileName* | Identifies, by name, the bind file whose contents are to be
    retrieved and displayed. |


    All options shown with this command are described in [Table 5.4](#015_Chapter05.xhtml_tab5_4).


    | Table 5.4 db2bfd Command Options |


    | Option | Meaning |

    | :--- | :--- |

    | -b | Specifies that the bind file header is to be displayed. |

    | -s | Specifies that the SQL statements in the bind file are to be displayed.
    |

    | -v | Specifies that host variable declarations in the bind file are to be displayed.
    |

    | -h | Displays help information. When this option is specified, all other options
    are ignored, and only the help information is displayed. |


    Thus, if you wanted to see the contents of a bind file named `DB29TEST.BND`, you
    could do so by executing a `db2bfd` command that looks something like this:


    ![Image](images/134-2.jpg)


    # The DB2 Memory Tracker


    The DB2 memory tracker utility is used to produce a complete report of memory
    status for instances, databases, and agents. This utility provides the following
    information about memory pool allocation:


    * Current size

    * Maximum size (hard limit)

    * Largest size (high water mark)

    * Type (identifier indicating function for which memory will be used)

    * Agent who allocated pool (only if the pool is private)


    (This information is also available from the snapshot monitor.)


    The DB2 memory tracker is invoked by executing the `db2mtrk` command. The syntax
    for this command is:


    ![Image](images/135.jpg)


    where:


    | Interval* | Identifies the number of seconds to wait between subsequent calls
    to the DB2 memory tracker. |

    | Count* | Identifies the number of times to repeat calls to the DB2 memory tracker.
    |


    All other options shown with this command are described in [Table 5.5](#015_Chapter05.xhtml_tab5_5).


    | Table 5.5 db2mtrk Command Options |


    | Option | Meaning |

    | :--- | :--- |

    | -i | Specifies that information about instance level memory is to be collected
    and displayed. |

    | -d | Specifies that information about database level memory is to be collected
    and displayed. |

    | -P | Specifies that information about private memory is to be collected and
    displayed |

    | -m | Specifies that maximum values for each memory pool is to be collected and
    displayed. |

    | -w | Specifies that high watermark values for each memory pool is to be collected
    and displayed. |

    | -v | Indicates that verbose output is to be returned. |

    | -h | Displays help information. When this option is specified, all other options
    are ignored, and only the help information is displayed. |


    Thus, if you wanted to see how memory is utilized by the active databases on a
    system, you could do so by executing a `db2mtrk` command that looks something
    like this:


    ![Image](images/136.jpg)


    # The DB2 Problem Determination Tool


    The DB2 Problem Determination tool is used to obtain quick and immediate information
    from the DB2 database system memory sets, without acquiring any latches. Two benefits
    to collecting information without latching include faster data retrieval and no
    competition for engine resources. However, because the DB2 Problem Determination
    tool works directly with memory, it is possible to retrieve information that is
    changing as it is being collected; hence, the data retrieved might not be completely
    accurate. (A signal handler is used to prevent the DB2 Problem Determination tool
    from aborting abnormally when changing memory pointers are encountered. However,
    this can result in messages such as “Changing data structure forced command termination”
    to appear in the output produced.) Nonetheless, this tool can be extremely helpful
    for problem determination.


    ![Image](images/paper.jpg) If you want to capture information about the database
    management system when a specific SQLCODE, ZRC code or ECF code occurs, this can
    be accomplished using the `db2pdcfg -catch` command. (The `db2pdcfg` command can
    be used to set flags in the DB2 database memory sets to influence database system
    behavior.) When the errors are caught, the DB2 callout script `db2cos` is launched.
    This script can be dynamically altered to run any `db2pd` command, operating system
    command, or any other command needed to identify and solve a problem.


    The DB2 Problem Determination tool is invoked by executing the `db2pd` command.
    The basic syntax for this command is:


    ![Image](images/137.jpg)


    where:


    | DatabaseName* | Identifies, by name, the database with which the DB2 Problem
    Determination tool is to interact. |

    | ProcessID* | Identifies the process, by ID, for which a stack trace file is
    to be produced. |

