    # Question 5


    The correct answer is **B.** If you are familiar with the concept of deadlocks,
    you may recall that a special process known as the deadlock detector runs quietly
    in the background and “wakes up” at predefined intervals to scan the locking system
    in search of a deadlock cycle. If a deadlock cycle exists, the deadlock detector
    randomly selects one of the transactions involved in the cycle to roll back and
    terminate. (The transaction that is rolled back and terminated receives an SQL
    error code, all locks it had acquired are released, and the remaining transaction(s)
    are then allowed to proceed.) Information about such a series of events can be
    captured, the moment the deadlock cycle is detected.


    By default, whenever a DB2 9 database is created, a deadlock event monitor is
    defined for that database and this event monitor is activated when a connection
    to the database is first established, or whenever the database is activated.


