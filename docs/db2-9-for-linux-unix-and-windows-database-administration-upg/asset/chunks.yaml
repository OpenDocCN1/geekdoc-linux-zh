    # 问题 4


    正确答案是 **D.**。`auto_maint` 数据库配置参数启用或禁用数据库的自动维护；它是其他自动维护数据库配置参数（`auto_db_backup`、`auto_tbl_maint`、`auto_runstats`、`auto_stats_prof`
    和 `auto_reorg`）的父级。当此参数赋值为 `OFF` 时，所有子参数都被禁用，但它们在数据库配置文件中记录的设置不会 way。当此参数赋值为 `ON`
    时，子参数的记录值将生效。


    `auto_tbl_maint` 数据库配置参数启用或禁用数据库的自动表维护；它是所有表维护参数（`auto_runstats`、`auto_stats_prof`、`auto_prof_upd`
    和 `auto_reorg`）的父级。当此参数设置为 `OFF` 时，所有子参数都被禁用，但它们在数据库配置文件中记录的设置不会改变。当此参数赋值为 `ON`
    时，子参数的记录值将生效。


    `auto_reorg` 数据库配置参数启用或禁用数据库的自动表和索引重组。当此参数赋值为 `ON` 时，将在需要时自动执行表和索引重组操作。


    # 问题 5


    正确答案是 **B.**。`auto_maint` 数据库配置参数启用或禁用自动维护，因此在执行任何自动维护操作之前必须将其赋值为 `ON`；`auto_tbl_maint`
    数据库配置参数启用或禁用数据库的自动表维护，因此在执行自动表维护操作之前必须将其赋值为 `ON`；`auto_runstats` 数据库配置参数启用或禁用数据库的自动表
    RUNSTATS 操作，因此在执行数据库自动统计收集之前必须将其赋值为 `ON`。


    `auto_stats_prof` 数据库配置参数启用或禁用数据库的自动统计配置文件生成，因此在执行数据库自动统计收集之前不需要将其赋值为 `ON`。


    # 问题 6


    正确答案是 **D.**。当创建 DB2 9 数据库时，默认启用自动维护；当数据库配置参数重置为系统默认值（通过执行 `RESET DATABASE CONFIGURATION`
    命令），`AUTO_MAINT`、`AUTO_DB_BACKUP` 和 `AUTO_TBL_MAINT` 配置参数将被赋值为 `ON`。`auto_stats_prof`
    数据库配置参数启用或禁用数据库的自动统计配置文件生成。当此参数赋值为 `ON` 时，将在需要时自动执行统计配置文件生成操作。


