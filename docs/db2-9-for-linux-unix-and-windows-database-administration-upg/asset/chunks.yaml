    # Taking the DB2 9 for Linux, UNIX, and Windows Database Administration Upgrade
    exam (Exam 736)


    When you are confident that you are ready to take the `DB2 9 for Linux, UNIX,
    and Windows Database Administration Upgrade` exam (Exam 736), your next step is
    to contact an IBM-authorized testing vendor. The DB2 9 certification exams are
    administered by Pearson VUE, by Thompson Prometric, and, in rare, cases by IBM
    (for example, IBM administers the DB2 9 certifications free of charge at some
    of the larger database conferences, such as the International DB2 User’s Group
    North American conference). However, before you contact either testing vendor,
    you should visit their Web site `[www.vue.com/ibm](http://www.vue.com/ibm)` and
    `[www.2test.com](http://www.2test.com)`, respectively, and use the navigation
    tools provided there to locate a testing center that is convenient for you. Once
    you have located a testing center, you can then contact the vendor and make arrangements
    to take the certification exam. (Contact information for the testing vendors can
    also be found on their respective Web sites; in some cases, you can schedule an
    exam online.)


    You must make arrangements to take a certification exam at least 24 hours in advance,
    and when you contact the testing vendor, you should be ready to provide the following
    information:


    *   Your name (as you want it to appear on your certification certificate).

    *   An identification number (if you have taken an IBM certification exam before,
    this is the number assigned to you at that time; if not, the testing vendor will
    supply one)

    *   A telephone number where you can be reached

    *   A fax number

    *   The mailing address to which you want all certification correspondence, including
    your certification welcome package, to be sent

    *   Your billing address, if it is different from your mailing address

    *   Your email address

    *   The number that identifies the exam you wish to take (for example, `Exam 736`)

    *   The method of payment (credit card or check) you wish to use, along with any
    relevant payment information (such as credit card number and expiration date)

    *   Your company’s name (if applicable)

    *   The testing center where you would like to take the certification exam

    *   The date when you would like to take the certification exam


    Before you make arrangements to take a certification exam, you should have paper
    and pencil or pen handy so that you can write down the test applicant identification
    number the testing center will assign you. You will need this information when
    you arrive at the testing center to take the certification exam. (If time permits,
    you will be sent a letter of confirmation containing the number of the certification
    exam you have been scheduled to take, along with corresponding date, time, and
    location information; if you register within 48 hours of the scheduled testing
    date, you will not receive a letter.)


    ![Image](images/paper.jpg) If you have already taken one or more of the certification
    exams offered, you should make the testing vendor aware of this and ask them to
    assign you the same applicant identification number that was used before. This
    will allow the certification team at IBM to quickly recognize when you have met
    all the exam requirements for a particular certification role. (If you were assigned
    a unique applicant identification number each time you took an exam, you should
    go to the IBM Professional Certification Member Web site `[www.ibm.com/certify/members](http://www.ibm.com/certify/members))`
    and select Member Services to combine all of your exam results under one ID.)


    The DB2 9 for Linux, UNIX, and Windows Database Administration Upgrade exam (Exam
    736) costs $75 (in the United States). Scheduling procedures vary according to
    how you choose to pay for the exam. If you decide to pay by credit card, you can
    make arrangements to take the exam immediately after providing the testing vendor
    with the appropriate information. However, if you elect to pay by check, you will
    be required to wait until the check has been received and payment has been confirmed
    before you will be allowed to make arrangements to take the exam. (Thompson Prometric
    recommends that if you pay by check, you write your registration ID on the front
    and contact them seven business days after the check is mailed. At that time,
    they should have received and confirmed your payment, and you should be able to
    make arrangements to take the exam for which you have paid.) If, for some reason,
    you need to reschedule or cancel your testing appointment after it is made, you
    must do so at least 24 hours before your scheduled test time. Otherwise, you will
    still be charged the price of the exam.


    On the day you are scheduled to take a certification exam, you should arrive at
    the testing center at least 15 minutes before the scheduled start time, to sign
    in. As part of the sign-in process, you will be asked to provide the applicant
    identification number you were assigned when you made arrangements to take the
    exam and two forms of identification. One form of identification must feature
    a recent photograph, and the other must show your signature. Examples of valid
    forms of identification include a driver’s license (photograph) and a credit card
    (signature).


    Once you are signed in, the exam administrator will instruct you to enter the
    testing area and select an available workstation. The exam administrator will
    then enter your name and identification number into the workstation you have chosen,
    provide you with a pencil and some paper, and instruct you to begin the exam when
    you are ready.


    As soon as you complete the exam and submit it for grading, the IBM Certification
    Exam testing software will evaluate your answers and produce a score report that
    indicates whether you passed the exam. Each certification exam is broken into
    sections, and regardless of whether you pass or fail, you should take a few moments
    to review the score you received for each section. This information can help you
    evaluate your strengths and weaknesses; if you failed to pass the exam, it can
    help you identify the areas you should spend some time reviewing before you take
    the exam again.


    Shortly after you take a certification exam (usually within five working days),
    the testing vendor sends your results, along with your demographic data (e.g.,
    name, address, phone number) to the IBM Certification Group for processing. If
    you passed the exam, you will receive credit toward the certification role the
    exam was designed for, and if the exam you took completes the requirements that
    have been outlined for a particular certification role, you will receive an email
    (at the email address you provided during registration) containing a copy of the
    IBM Certification Agreement and a welcome package that includes a certificate
    suitable for framing (in the form of a `PDF` file), camera-ready artwork of the
    IBM certification logo, and guidelines for using the “IBM Certified” mark. (If
    this email cannot be delivered, the welcome package will be sent to you via regular
    mail.) You can also receive a printed certificate, along with a wallet-sized certificate,
    via regular mail by going to the Web site referenced in the email you receive
    and requesting it—you will be asked to provide your `Fulfillment ID` and `Validation
    Number` (also provided in the email) as verification that you have met the requirements
    for certification.

