    *   Your ability to monitor deadlocks

    *   Your ability to use the troubleshooting utilities available with DB2 9


    This chapter is designed to introduce you to the set of monitoring tools that
    are available with DB2 and to show you how each is used to monitor how well (or
    how poorly) your database system is operating. This chapter is also designed to
    introduce you to some of the troubleshooting utilities available with DB2 9.


    # The Database System Monitor


    Database monitoring is a vital activity that, when performed on a regular basis,
    provides continuous feedback on the health of a database system. And because database
    monitoring is such an integral part of database administration, DB2 comes equipped
    with a built-in monitoring utility known as the Database System Monitor. Although
    the name “Database System Monitor” suggests that only one monitoring tool is available,
    in reality the Database System Monitor is composed of two distinct tools (a snapshot
    monitor and one or more event monitors) that can be used to capture and return
    system monitor information. The snapshot monitor allows you to capture a picture
    of the state of a database (along with all database activity) at a specific point
    in time whereas event monitors capture and log data as specific database events
    occur. Information collected by both tools is stored in entities that are referred
    to as `monitor elements` (or data elements), and each monitor element used is
    (1) identified by a unique name and (2) designed to store a certain type of information.


    The Database System Monitor employs several methods for presenting the data collected.
    For both snapshot and event monitors, you have the option of storing all collected
    data in files or database tables, viewing it on screen, or processing it using
    a custom application.


    # The Snapshot Monitor


    The snapshot monitor is designed to collect information about the state of a DB2
    instance and the databases it controls at a specific point in time (i.e., at the
    time the snapshot is taken). Additionally, the snapshot monitor can be tailored
    to retrieve specific types of monitoring data (for example, it could be configured
    to collect just information about buffer pools). Snapshots are useful for determining
    the status of a database system and, when taken at regular intervals, can provide
    valuable information that can be used to observe trends and identify potential
    problem areas.


    # Snapshot monitor switches


    Often, the collection of database system monitor data introduces additional processing
    overhead. For example, in order to calculate the execution time of SQL statements,
    the DB2 Database Manager must make a call to the operating system to obtain timestamps
    before and after every SQL statement is executed; these types of system calls
    are normally expensive. Another side effect of using the database system monitor
    is an increase in memory consumption—the DB2 Database Manager uses memory to store
    data collected for every monitor element tracked.


    To help minimize the overhead involved in collecting database system monitor information,
    a group of switches known as the snapshot monitor switches can be used to control
    what information is collected when a snapshot is taken; the type and amount of
    information collected is determined by the way these snapshot monitor switches
    have been set. Each snapshot monitor switch has two settings: `ON` and `OFF`.
    When a snapshot monitor switch is set to `OFF`, monitor elements that fall under
    that switch’s control do not collect information. The opposite is true if the
    switch is set to `ON`. (Keep in mind that a considerable amount of monitoring
    information is not under switch control and will always be collected regardless
    of how the snapshot monitor switches have been set.) The snapshot monitor switches
    available, along with a description of the type of information that is collected
    when each has been set to `ON`, can be seen in [Table 5.1](#015_Chapter05.xhtml_tab5_1).


    ![Image](images/121.jpg)


    By default, all of the switches shown in [Table 5.1](#015_Chapter05.xhtml_tab5_1)
    are set to `OFF`, with the exception of the `TIMESTAMP` switch, which is set to
    `ON`.


    # Capturing snapshot data


    As soon as a database is activated or a connection to a database is established,
    the snapshot monitor begins collecting monitor data. However, before the data
    collected can be viewed, a snapshot must be taken. Snapshots can be taken by executing
    the `GET SNAPSHOT` command. The basic syntax for this command is:


    ![Image](images/122-1.jpg)


    where:


    | DatabaseAlias | Identifies the alias assigned to the database that snapshot
    monitor information is to be collected for. |

    | AppID | Identifies the application, by ID, for which snapshot monitor information
    is to be collected. |

    | AgentID | Identifies the application, by application handle, for which snapshot
    monitor information is to be collected for. |


    So if you wanted to take a snapshot that contained only data collected on locks
    being held by applications interacting with a database named `SAMPLE`, you could
    do so by executing a `GET SNAPSHOT` command that looks like this:


    ![Image](images/122-2.jpg)


    It is important to keep in mind that the snapshot monitor switches, together with
    the options available with the `GET SNAPSHOT` command, determine the type and
    volume of data that will be returned when a snapshot is taken. If a particular
    snapshot monitor switch has not been turned on, and a snapshot of the monitoring
    data that is associated with that switch is taken, the monitoring data captured
    may not contain any values at all.


    # Capturing snapshot monitor data using SQL


    With earlier versions of DB2, the only way to capture snapshot monitor data was
    by executing the `GET SNAPSHOT` command or by calling its corresponding API from
    an application program. With DB2 UDB version 8.1, the ability to capture snapshot
    monitor data by constructing a query that referenced one of 20 snapshot monitor
    table functions available was introduced. Although these functions are still available
    and can be used in DB2 9, they have been depreciated. Now snapshot monitor data
    can be obtained by querying special administrative views or by using a new set
    of SQL table functions. These views and functions are described in detail in [Table
    5.2](#015_Chapter05.xhtml_tab5_2).


    | Table 5.2 DB2 9 Snapshot Monitor Administrative Tables and SQL Table Functions
    |

    | Administrative View | Table Function | Description |

    | :--- | :--- | :--- |

    | SYSIBMADM.APPLICATIONS | N/A | This administrative view contains information
    about connected database applications. |

    | SYSIBMADM.APPL_PERFORMANCE | N/A | This administrative view contains information
    about the rate of rows selected versus rows read per application. |

    | SYSIBMADM.BP_HITRATIO | N/A | This administrative view contains buffer pool
    hit ratios, including total, data, and index data. |

    | SYSIBMADM.BP_READ_IO | N/A | This administrative view contains buffer pool read
    performance information. |

    | SYSIBMADM.BP_WRITE_IO | N/A | This administrative view contains buffer pool
    write performance information. |

    | CONTAINER_UTILIZATION | N/A | This administrative view contains information
    about table space containers and utilization rates. |

    | SYSIBMADM.LOCKS_HELD | N/A | This administrative view contains information on
    current locks held. |

    | SYSIBMADM.LOCKWAITS | N/A | This administrative view contains information on
    locks that are waiting to be granted. |

    | SYSIBMADM.LOG_UTILIZATION | N/A | This administrative view contains information
    about log utilization for the currently connected database. |

    | RUNNING_SQL | N/A | This administrative view contains information about the
    longest-running SQL statements in the currently connected database. |

    | SYSIBMADM.QUERY_PREP_COST | N/A | This administrative view contains a list of
    SQL statements, along with information about the time required to prepare each
    statement. |

