    # 问题 10


    正确答案是 **C.** 当数据库启用了自调优功能时，内存调节器会对数据库工作负载特性的显著变化做出响应，调整内存配置参数的值和缓冲区池的大小以优化性能。以下内存消耗器可以启用自调优：


    * 缓冲区池（由 `ALTER BUFFERPOOL` 和 `CREATE BUFFERPOOL` 语句控制）

    * 程序包缓存（由 `pckcachesz` 配置参数控制）

    * 锁内存（由 `locklist` 和 `maxlocks` 配置参数控制）

    * 排序内存（由 `sheapthres_shr` 和 `sortheap` 配置参数控制）

    * 数据库共享内存（由 `database_memory` 配置参数控制）


    # 问题 11


    正确答案是 **A.** 自调优内存管理器（Self Tuning Memory Manager）所做的更改记录在内存调优日志文件中，这些文件位于实例的 `stmmlog`
    子目录下。（第一个创建的文件将被命名为 `stmm.0.log`，第二个将被命名为 `stmm.1.log`，依此类推。）每个内存调优日志文件都包含在执行调优操作时每个内存消耗器的资源需求摘要。调优间隔可以通过检查内存调优日志文件中条目的时间戳来确定。


    # 问题 12


    正确答案是 **C.** 通过将 `self_tuning_mem` 数据库配置参数赋值为 ON 为数据库启用自调优。通过使用 `UPDATE DATABASE
    CONFIGURATION` 命令将参数赋值为 AUTOMATIC，可以为内存配置参数控制的特定内存区域启用自调优；你可以通过使用 `CREATE BUFFERPOOL`
    或 `ALTER BUFFERPOOL` SQL 语句将缓冲区池的大小设置为 AUTOMATIC，从而为缓冲区池启用自调优。以下内存消耗器可以启用自调优：


    * 缓冲区池

    * 程序包缓存（由 `pckcachesz` 配置参数控制）

    * 锁内存（由 `locklist` 和 `maxlocks` 配置参数控制）

    * 排序内存（由 `sheapthres_shr` 和 `sortheap` 配置参数控制）

    * 数据库共享内存（由 `database_memory` 配置参数控制）


    # 问题 13


    正确答案是 **B.** 通过将 `self_tuning_mem` 数据库配置参数赋值为 ON 为数据库启用自调优。这是通过执行 `UPDATE DATABASE
    CONFIGURATION` 命令实现的。（在更改生效之前必须停止并重启数据库。）一旦数据库配置了自调优，就可以通过执行 `GET DATABASE CONFIGURATION`
    命令获取数据库的当前内存配置。


    # 问题 14


    正确答案是 **A** 和 **E.** 为了实现排序内存的自动调优，`sheapthres_shr` 数据库配置必须赋值为 AUTOMATIC，*且* `sheapthres`
    DB2 数据库管理器配置参数必须设置为 0。


    # 第 3 章


    # 数据放置


    DB2 9 for Linux, UNIX and Windows 数据库管理员升级考试（考试 736）中有百分之二十一 (21%) 用于测试创建 DB2
    9 数据库的能力，以及测试你对创建和管理表空间及范围分区方法的知识。构成考试这部分的题目旨在评估以下内容：


    * 你对 `CREATE DATABASE` 命令新默认行为的了解

    * 你对 SMS、DMS 和自动存储表空间特的了解

    * 创建和管理自动存储表空间的能力

    * 创建范围分区表的能力

    * 你对数据行压缩的了解


    本章旨在引导你完成 DB2 9 数据库的创建，并为你提供数据库存在后可以构建的各种类型表空间的概述。本章还旨在向你展示如何构建范围分区表，以及使用数据行压缩来减少表的存储空间需求。


    # 创建 DB2 9 数据库


    创建 DB2 9 数据库有两种方法：通过“创建数据库向导”执行 `CREATE DATABASE` 命令——该向导本质上是 `CREATE DATABASE`
    命令的图形用户界面 (GUI)。在最简单的情况下，`CREATE DATABASE` 命令的语法如下：


    ![Image](img/44.jpg)


    其中：


    | `DatabaseName` | 指定分配给数据库的唯一名称。 |


    执行此命令时必须提供的值是分配给新数据库的名称。该名称


    * 可以仅由字符 **a** 到 **z、A** 到 **Z、0** 到 **9、@**、**#、$** 和 _（下划线）组成；

    * 不能以数字开头；

    * 不能以字母序列 `SYS`DM 或 `IBM` 开头；

    * 不能与已分配给另一个数据库的名称相同。


    当然，还有更复杂的 `CREATE DATABASE` 命令形式，可以让你对数据库参数进行更多控制，我们稍后将进行。但现在，让我们看看执行这种形式的 `CREATE
    DATABASE` 命令会发生什么。


    # 创建 DB2 9 数据库时发生了什么


    无论过程如何启动，每当创建一个新的 DB2 9 数据库时，都会按照所示顺序执行以下任务：


    1. 在适当的位置创建的所有目录和子目录。创建的每个 DB2 9 数据库的信息都存储在特殊的层次结构目录树中。该目录树的实际创建位置取决于 `CREATE
    DATABASE` 命令提供的信息——如果未提供位置信息，则该目录树将在创建数据库的实例的关联的 `dftdbpath` DB2 数据库管理器配置参数指定的位置创建。该层次树的根目录被分配为与数据库关联的实例名称。此目录将包含一个与分区节点名称对应的子目录。如果数据库是分区数据库，该目录将命名为
    `NODExxxx`，其中 `xxxx` 是分配给分区的唯一节点号；如果数据库是非分区数据库，该目录将命名为 `NODE0000.`。节点名称目录反过来包含一个每个已创建数据库的子目录，以及一个包含用于存放数据库容器的子目录。


