    \ INCREMENTAL` are optional, as indicated by the angle brackets (< >), and either\
    \ one or the other can be specified, but not both, as indicated by the vertical\
    \ bar (|).\n\n# ***Example 2***\n\n![Image](images/xiv.jpg)\n\nIn this example,\
    \ a *SequenceName* value must be provided, as indicated by the brackets ([ ]).\
    \ However, everything else is optional, as indicated by the angle brackets (<\
    \ >), and in many cases, a list of available option values is provided (for example,\
    \ `NO CYCLE` and `CYCLE);` however, only one can be specified, as indicated by\
    \ the vertical bar (|). In addition, when some options are provided (for example,\
    \ `START WITH, INCREMENT BY, MINVALUE, MAXVALUE,` and `CACHE),` a corresponding\
    \ value must be provided, as indicated by the brackets ([ ]) that-follow the option.\n\
    \nSQL is not a case-sensitive language, but for clarity, the examples provided\
