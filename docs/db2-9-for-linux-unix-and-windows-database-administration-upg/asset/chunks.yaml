    ### 11. 启用了若干项自动管理功能。


    为了帮助简化管理，每当创建一个新数据库时，都会启用以下功能：


    - 自动维护（数据库备份、表和索引重组、数据访问优化以及统计信息分析）

    - 自调优内存管理器（包缓存、锁定内存、排序内存、数据库共享内存和缓冲区池内存）

    - 公用程序节流

    - 健康监测器


    ### 12. 启动配置顾问。


    配置顾问（Configuration Advisor）是一项工具，旨在通过根据你提供的数据库信息建议修改哪些配置参数，来帮助你调优性能并平衡数据库内存需求。在
    DB2 9 中，每当你创建数据库时都会自动调用配置顾问，除非通过为 `DB2_ENABLE_AUTOCONFIG_DEFAULT` 注册表变量赋值 `NO`
    来更改默认行为。


    # 完整的 CREATE DATABASE 命令


    当执行简单形式的 `CREATE DATABASE` 命令时，所创建数据库的特性（例如使用的存储和事务日志方法）由几个预定义的默认值决定。如果您希望更改任何默认特性，必须在执行
    `CREATE DATABASE` 命令指定指定或多个可用选项。该命令的语法如下：


    ![Image](img/52-1.jpg)


    或


    ![Image](img/52-2.jpg)


    其中：


    | :--- | :--- |

    | `DatabaseName` | 标识分配给要创建数据库的唯一名称。 |

    | `StoragePath` | 如果指定 `AUTOMATIC STORAGE YES`（默认值），则标识一个或多个用于存放自动存储的表空间容器的存储路径。否则，标识物理存储与要创建的数据库相关的目录层次结构和文件的位置（驱动器或目录）。
    |

    | `DBPath` | 如果指定 `AUTOMATIC STORAGE YES`（默认值），则标识物理存储与要创建的数据库相关的目录层次结构和元数据文件的位置（驱动器或目录）。如果未指定此参数且使用了自动存储，元数据文件将存储在
    `StoragePath` 参数指定的第一个存储路径中。） |

    | `Alias` | 标识分配给要创建数据库的别名。 |

    | `CodeSet` | 标识用于存储要创建数据库中数据的字符集。（在 DB2 9 数据库中，每个单字节字符在内部均表示为 0 到 255 之间的唯一数字。该数字被称为字符的码点；特定字符集中每个字符的码点分配称为代码页；国际标准组织对代码页的术语是字符集。）
    |

    | `Territory` | 标识用于存储要创建数据库中数据的区域。 |

    | `CollateType` | 指定要创建的数据库使用的排序序列（即字符为了排序、合并和比较目的而排列的顺序）。该参数的有效值包括：COMPATABILITY,
    IDENTITY, IDENTITY_16BIT, UCA400_NO, UCA400_LSK, UCA400_LTH, NLSCHAR 和 SYSTEM。
    |

    | `NumSegments` | 指定用于创建和存储要创建的数据库使用的默认 SMS 表空间 `(TEMPSPACE1)` 文件的目录数量。 |

    | `DefaultExtSize` | 指定每当创建表空间且在创建过程中未指定区段大时，使用的默认区段大小。 |

    | `Description` | 用于描述数据库目录中为要创建的数据库生成的条目的注释。描述必须包含在双引号内。 |

    | `Keyword` | `AUTOCONFIGURE` 命令识别的一个或多个关键字。有效值包括 `mem_percent, workload_type,
    num_stmts, tpm, admin_priority, is_populated, num_local_apps, num_remote_apps,
    isolation` 和 `bp_resizable.`。有关如何使用 `AUTOCONFIGURE` 命令的更多信息，请参考 *DB2 9 Command
    Reference*。 |

    | `Value` | 标识与指定的 `Keyword` 关联的值。 |

    | `TS_Definition` | 指定用于创建存放系统目录表 (SYSCATSPACE)、用户定义对象 (USERSPACE1) 和/或临时对象 (TEMPSPACE1)
    的表空间定义。 |


    定义系统管理 (SMS) 表空间的语法为：


    ![Image](img/54-1.jpg)


    定义数据库管理 (DMS) 表空间的语法为：


    ![Image](img/54-2.jpg)


    以及定义自动存储表空间的语法为：


    ![Image](img/54-3.jpg)


    其中：


    | :--- | :--- |

    | `Container` | 标识用于存储分配给指定表空间的数据的一个或多个容器。对于 SMS 表空间，指定的每个容器必须标识一个有效的目录；对于 DMS
    `FILE` 容器，指定的每个容器必须标识一个有效的文件；对于 DMS `DEVICE` 容器，指定的每个容器必须标识一个存在的设备。 |

    | `NumberOfPages` | 指定表空间容器使用的页数。 |

    | `ExtentSize` | 指定以轮询方式写入到每个使用的表空间容器的数据页数。 |

    | `PrefetchSize` | 指定在执行数据预取时，从指定的表空间读取的数据页数。 |

    | `Overhead` | 标识与指定表空间容器相关的输入/输出 (I/O) 控制器开销和磁盘寻道延迟时间（毫秒）。 |

    | `TransferRate` | 标识从表空间容器读取一页数据并将其存储在内存中所需的时间（毫秒）。 |

    | `InitialSize` | 指定自动扩展的 DMS 或自动存储表空间应具有的初始大小。 |

    | `Increment` | 指定启用了自动调整大小的表空间在满空间并收到空间请求时增加的量。 |

    | `MaxSize` | 指定启用了自动调整大小的表空间可以增加到的最大大小。 |


