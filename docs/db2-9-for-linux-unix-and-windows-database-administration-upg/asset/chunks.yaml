    Thus, if you wanted to obtain snapshot monitor lock information for the currently
    connected database, you could do so by executing a query that looks something
    like this:


    ![Image](images/127-1.jpg)


    Each DB2 9 snapshot monitor table function available returns the same information
    as the corresponding administrative view, but the function allows you to retrieve
    information for a specific database instead of the current connected database.
    The syntax used to construct a query that references a non-Database Manager-level
    DB2 9 snapshot monitor table function looks something like this:


    ![Image](images/127-2.jpg)


    where:


    | `FunctionName` | Identifies the snapshot monitor table function to be used (i.e.,
    one of the functions listed in [Table 5.2](#015_Chapter05.xhtml_tab5_2)). |

    | `DBName` | Identifies the database for which snapshot monitor data is to be
    collected. |

    | `PartitionNum` | Identifies the database partition for which snapshot monitor
    data is to be collected. |

    | `CorrelationName` | Identifies the name that is to be assigned to the result
    data set produced by the query. |


    The syntax used to construct a query that references a Database Manager-level
    snapshot monitor table function is identical, with one exception: the `DBName`
    parameter is not used.


    In either case, if you wanted to capture snapshot monitor data for the current
    partition in a partitioned database environment, you could do so by specifying
    the value -1 for the `PartitionNum` parameter; if you wanted to capture snapshot
    monitor data for all partitions, you specify the value -2. Similarly, if you wanted
    to capture snapshot monitor data for the current connected database, you could
    do so by specifying a null value for the `DBName` parameter, either by using empty
    single quotation marks (‘ ‘) or by using a cast operation to produce a null character
    value—for example, `CAST (NULL AS CHAR)`.

