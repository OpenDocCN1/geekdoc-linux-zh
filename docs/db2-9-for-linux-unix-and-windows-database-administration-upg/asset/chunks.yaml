    # db2move 和 db2look


    很容易看出导出实用程序如何与导入实用程序结合使用，将表从一个数据库复制到另一个数据库。但如果您想复制多个表或整个数据库怎么办？在这种情况下，可以使用导出、导入或加载实用程序按表为单位进行数据复制（如果使用了
    PC 集成交换格式 (IXF) 格式文件，表结构和任何相关索引也将被复制），但复制整个 DB2 数据库更有效的方法是使用 `db2move` 实用程序。该实用程序查询指定数据库的系统目录表，并编译找到的所有用户表列表。然后，它将数据库中每个表的内容和结构导出到单独的
    PC 集成交换格式 (IXF) 格式文件中。生成的系列文件可以导入或加载到同一系统上的另一个 DB2 数据库，也可以将其传输到另一个工作站并导入或加载到那里的
    DB2 数据库。


    `db2move` 实用程序可以用四种模式之一运行：`EXPORT`、`IMPORT`、`LOAD` 或 `COPY`。在 `EXPORT` 模式运行时，`db2move`
    调用导出实用程序从一个或多个表中提取数据并将其外部化为 PC 集成交换格式 (IXF) 格式文件。它还会生成名为 `db2move.lst` 的文件，其中包含所有处理过的表名称以及写入每个表数据的文件名。此外，`db2move`
    实用程序还可以生成一个或多个消息文件，包含由于导出操作而生成的警告或错误消息。


    在 `IMPORT` 模式运行时，`db2move` 调用导入实用程序，使用存储在 PC 集成交换格式 (IXF) 格式文件中的信息重建每个表及其相关索引。在此模式下，使用
    `db2move.lst` 文件建立所需的 PC 集成交换格式 (IXF) 格式文件与要导入数据的表之间的链接。


    在 `LOAD` 模式运行时，`db2move` 调用加载实用程序，使用存储在 PC 集成交换格式 (IXF) 格式文件的数据填充已存在的表。同样，使用 `db2move.lst`
    文件建立所需的 PC 集成交换格式 (IXF) 格式文件与要加载数据的表之间的链接。


    遗憾的是，`db2move` 实用程序只能迁移表和索引对象。如果要迁移的数据库包含其他对象，如别名、视图、触发器、用户定义类型 (UDTs)、用户定义函数
    (UDFs) 等，如果您希望拥有源数据库的副本，则必须在目标数据库中复制这些对象。这就是 `db2look` 实用程序的用武之地了。调用时，`db2look`
    可以对现有数据库进行反向工程并生成一组数据定义语言 (DDL) SQL 语句，这些语句可以用于重建分析数据库中找到的所有数据对象。`db2look` 命令的基本语法为：


    ![Image](img/109.jpg)


    其中：


    | `DatabaseAlias` | 标识分配给要生成 DDL 语句的数据库的别名。 |

    | `Creator` | 标识用于限制 DDL 输出的者 ID。DDL 输出将限于由此 ID 创建的对象。 |

    | `Schema` | 标识用于限制 DDL 输出的架构。DDL 输出将限于位于该架构中的对象。 |

    | `TableName` | 通过名称标识一个或多个要生成 DDL 语句的表。 |

    | `ViewName` | 通过名称标识一个或多个要生成 DDL 语句的视图。 |

    | `FileName` | 通过名称标识所有生成的 DDL 输出将要写入的文件。 | |

    | `Directory` | 标识所有生成的 DDL 输出将写入的位置。 |


    此命令的其他选项请参见 表 4.3。


    | 表 4.3 db2look 命令选项 | |

    | :--- | :--- |

    | `-e` | 表示为以下数据库对象提取 DDL 语句：表、视图、物化查询表 (MQT)、别名、索引、触发器、序列、用户定义类型、约束（主键、引用完整性和检查约束）、用户定义结构化类型、用户定义函数、用户定义转换、封装、服务器、用户映射、昵称、类型映射、函数模板、函数映射、索引规范和存储过程。
    |

    | `-ct` | 表示按对象创建时间生成 DDL 语句。 |

    | `-a` | 表示为所有对象（包括无效对象，无论谁创建）生成 DDL 语句。 |

    | `-x` | 表示生成授权 DDL 语句 (GRANT, REVOKE)。 |

    | `-xd` | 表示生成所有授权 DDL 语句，包括由 SYSIBM 在对象创建时间授予的授权语句。 |

    | `-f` | 表示生成影响查询优化器的配置参数和注册变量所需的命令。 |

    | `-xs` | 表示导出注册目标数据库所需的所有 XML 架构和文档类型定义 (DTD)，并生成注册它们的命令。 |

    | `-h` | 显示帮助信息。当指定此选项时，所有其他选项将被忽略，仅显示帮助信息。 |


