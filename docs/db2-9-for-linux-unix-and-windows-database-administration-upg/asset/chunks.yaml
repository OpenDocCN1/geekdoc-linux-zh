    format (WSF), or the PC Information Exchange Format (IXF) format. Such files can
    then be used to provide data values to other databases (including the database
    from which the data was extracted) and software applications such as spreadsheets
    and word processors.


    One way to invoke the Export utility is by executing the `EXPORT` command. The
    basic syntax for this command is:


    ![Image](images/100.jpg)


    where:


    | *FileName* | Identifies the name and location of the external file data to which
    data is to be exported (copied). |


    | *LOBPath* | Identifies one or more locations where large object (LOB) data values
