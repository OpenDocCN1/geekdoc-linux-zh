    正如关系数据上的索引可以提高查询性能一样，XML 数据上的索引也可以用于提高对存储在 XML 列中的 XML 文档进行查询效率。与传统的关系索引不同（关系索引的索引键是由您指定的一个或多个列组成的），XML
    数据上的索引使用特定的 XML 模式表达式来对存储在单列中的 XML 文档中的路径和值进行索引。该列的数据类型必须是 `XML`。


    为了识别文档中将要索引的部分，使用了 XML 模式来指定 XML 文档中的一组节点。这种模式表达式与 XQuery 语言中定义的路径表达式相似，但不同之处在于它只支持
    XQuery 语言的子集。路径表达式步骤通过正斜杠（`/`）分隔。也可以指定双正斜杠（`//`——它是 `/descendant-or-self::node()`
    的缩写语法）。在每一步中，都会选择一个正向轴（`child::`、`@`、`attribute::`、`descendant::`、`self::` 和 `descendant-or-self::`），随后跟一个
    XML 名称测试或 XML 类型测试。如果未指定正向轴，则默认使用子轴。


    图 3–12 显示了一个简单的 XML 模式以及如何用它识别 XML 文档中的特定值。


    ![Image](img/97-1.jpg)


    *图 4–1：如何使用 XML 模式识别 XML 文档中的特定值。*


    XML 数据索引中的索引条不是提供文档开头的访问，而是通过基于 XML 模式表达式创建索引键提供对文档内节点的访问。由于 XML 文档的多个部分可以满足 XML
    模式，因此一个文档可能会向索引中插入多个索引键。


    XML 索引是在创建索引时通过指定 `CREATE INDEX` SQL 语句的 `GENERATE KEY USING XMLPATTERN` 子句创建的。该可选子句的基本语法为：


    ![Image](img/97-2.jpg)


    其中：


    | Namespace | 标识有效的命名空间声明，该声明在指定的模式表达式中使用限定名时用于标识命名空间前缀。 |

    | :--- | :--- |

    | XMLPattern | 指定要索引的节点的模式表达式。提供的模式表达式可以包含以下任何 XQuery 组件： |

    | | • `*`（星号）——指定模式匹配字符。 |

    | | • `/`（正斜杠）——分隔路径表达式步骤。 |

    | | • `//`（双正斜杠）——`/descendant-or-self::node()` 的缩写语法。 |

    | | • `child::`——指定上下文节点的子。如果未指定其他正向轴，则这是默认值。 |

    | | • `@`——指定上下文节点的属性。这是 `attribute::` 的缩写语法。 |

    | | • `attribute::`——指定上下文节点的属性。 |

    | | • `descendant::`——指定上下文节点的后代。 |

    | | • `self::`——仅指定上下文节点本身。 |

    | | • `descendant-or-self::`——指定上下文节点及其后代。 |

    | SQLDataType | 指定在存储之前将索引值转换到的的 SQL 数据类型。以下值对此参数有效：`VARCHAR(Size)`、`DOUBLE`、`DATE`
    和 `TIMESTAMP`。 |


    因此，如果您想使用名为 `CUSTOMER` 的表中名为 `CUSTINFO` 的 XML 列中找到邮政编码/邮编值创建一个 XML 索引，并将这些值存储为
    `DOUBLE` 值，可以执行类似于这样的 `CREATE INDEX` 语句：


    ![Image](img/99-1.jpg)


    另一方面，如果您想使用名为 `CUSTOMER` 的表中名为 `CUSTINFO` 的 XML 列中找到地址信息创建一个 XML 索引，并将这些值存储为 `VARCHAR`
    值，可以执行类似于这样的 `CREATE INDEX` 语句：


    ![Image](img/99-2.jpg)


    在第一个示例中，索引为元素创建的；在第二个示例中，为属性创建的。虽然可以在属性上创建 XML 索引（甚至是整个文档），但性能可能会受到影响。因此，通常在 XML
    文档的单个元素上创建 XML 索引更好。


    # DB2 数据移动工具


    尽管数据库通常作为一个独立的实体运行，但有时需要与“外部世界”交换数据。这就是 DB2 数据移动工具的目的。出于这个原因，DB2 提供了三种不同的工具，用于在数据库和外部文件之间移动数据。这些工具是：


    * Export 工具

    * Import 工具

    * Load 工具


    在 DB2 9 中，Export 和 Import 工具已更新以支持原生 XML 数据类型。Load 工具尚未更新。


    # Export 工具


    Export 工具设计用于从 DB2 数据库表或视图提取数据并将其外部化到文件中，使用分隔符 ASCII (DEL) 格式、工作表格式 (WSF) 或 PC
    信息交换格式 (IXF)。这些文件随后可以用于向其他数据库（包括提取数据的数据库）以及电子表格和文字处理器等软件应用程序提供数据值。


    调用 Export 工具的一种方法是执行 `EXPORT` 命令。该命令的基本语法为：


    ![Image](img/100.jpg)


    其中：


    | FileName | 标识要导出（复制）数据的外部文件的名称和位置。 |

    | :--- | :--- |

    | LOBPath | 标识存储大对象 (LOB) 数据值的一个多个位置。（如果指定了此选项，找到的每个 LOB 值将存储在指定位置的单独文件中。） |

    | LOBFileName | 标识用于命名写入大对象 (LOB) 数据值的文件的一个多个基本文件名。在导出操作期间，文件名通过在列表中的当前基本文件名后附加句点（.）和一个三位序列号来构造，然后将生成的文件名附加到指定的大对象数据路径（在
    `LOBPath` 中）。例如，如果当前 LOB 路径是目录“C:\LOBData”，且当前 LOB 文件名是“Value”，则创建的 LOB 文件将是 `C:\LOBData\Value.001.lob`、`C:\LOBData\Value.002.lob`
    等此类推。 |

    | XMLPath | 标识存储可扩展标记语言 (XML) 文档的一个多个位置。（如果指定了此选项，找到的每个 XML 值将存储在指定位置的单独文件中。）
    |

    | XMLFileName | 标识用于命名写入可扩展标记语言 (XML) 文档的一个多个基本文件名。在导出操作期间，文件名通过在列表中的当前基本文件名后附加句点（.）和一个三位序列号来构造，然后将生成的文件名附加到指定的
    XML 数据路径（在 `XMLPath` 中）。例如，如果当前 XML 路径是目录“C:\XMLData”，且当前 XML 文件名是“Value”，则创建的
    XML 文件将是 `C:\XMLData\Value.001.xml`、`C:\XMLData\Value.002.xml` 等此类推。 |

    | Modifier | 标识用于覆盖 Export 工具默认行为的一个多个选项。（表 4.1 包含了导出 XML 数据时可以有效修饰符列表。） |

    | ColumnName | 标识要写入导出数据外部文件的一个多个列名。 |

    | MsgFileName | 标识在执行导出操作时将 Export 工具产生的消息写入外部文件的名称和位置。 |

    | SELECTStatement | 标识 `SELECT` SQL 语句，执行该语句将检索要复制到外部文件的数据。 |


