    The name assigned to the subdirectory that holds the containers used to house
    the database’s data is the same as that specified for the database; the name assigned
    to the subdirectory that contains the base files for the database corresponds
    to the database token that is assigned to the database during the creation process
    (the subdirectory for the first database created will be named `SQL00001`, the
    subdirectory for the second database will be named `SQL00002`, and so on). [Figure
    3–1](#013_Chapter03.xhtml_img3_1) illustrates how this directory hierarchy typically
    looks in a nonpartitioned database environment.


    ![Image](images/46.jpg)

    *Figure 3—1: Typical directory hierarchy tree for a nonpartitioned database.*


    ![Image](images/paper.jpg) Never attempt to modify this directory structure or
    any of the files stored in it. Such actions could destroy one or more databases
    or make them unusable.


    ### 2. Files needed for management, monitoring, and database recovery are created.


    After the subdirectory that was assigned the name of the database’s token is created,
    the following files are created in it:


    `db2rhist.asc` This file contains historical information about backup operations,
    restore operations, table load operations, table reorganization operations, table
    space alterations, and similar database changes (i.e., the recovery history file).


    `db2rhist.bak` This file is a backup copy of `db2rhist.asc`.


    `SQLBP.1` This file contains buffer pool information.


    `SQLBP.2` This file is a backup copy of `SQLBP.1`.


    `SQLDBCON` This file contains database configuration information.


    `SQLDBCONF` This file is a backup copy of `SQLDBCON`.


    `SQLINSLK` This file contains information that is used to ensure that the database
    is assigned to only one instance of the DB2 Database Manager.


    `SQLOGCTL.LFH` This file contains information about active transaction log files.
    Recovery operations use information stored in this file to determine how far back
    in the logs to begin the recovery process.


    `SQLOGMIR.LFH` This file is a mirrored copy of `SQLOGCTL.LFH`.


    `SQLSGF.1` This file contains storage path information associated with automatic
    storage.


    `SQLSGF.2` This file is a backup copy of `SQLSGF.1`.


    `SQLSPCS.1` This file contains table space information.


    `SQLSPCS.2` This file is a backup copy of `SQLSPCS.1`.


    `SQLTMPLK` This file contains information about temporary table spaces.


    Two subdirectories named `DB2EVENT` and `SQLOGDIR` are also created; a detailed
    deadlocks event monitor is created and stored in the `DB2EVENT` subdirectory,
    and three files named `S0000000.LOG`, `S0000001.LOG`, and `S0000002.LOG` are created
    and stored in the `SQLLOGDIR` subdirectory. These three files are used to store
    transaction log records as SQL operations are performed against the database.


    ### 3. A buffer pool is created for the database.


    During the database creation process, a buffer pool is created and assigned the
    name `IBMDEFAULTBP`. By default, on Linux and UNIX platforms, this buffer pool
    is 1,000 4K (kilobyte) pages in size; on Windows platforms, this buffer pool is
    250 4K pages in size. The actual memory used by this buffer pool (and for that
    matter, by any other buffer pools that may exist) is allocated when the first
    connection to the database is established and freed when all connections to the
    database have been terminated.


    ### 4. Two regular table spaces and one system temporary table space are created.


    Immediately after the buffer pool `IBMDEFAULTBP` is created, three table spaces
    are created and associated with this buffer pool. These three table spaces are
    as follows:


    *   A regular table space named `SYSCATSPACE`, which is used to store the system
    catalog tables and views associated with the database

    *   A regular table space named `USERSPACE1`, which is used to store all user-defined
    objects (such as tables, indexes, and so on) along with user data, index data,
    and long value data

    *   A system temporary table space named `TEMPSPACE1`, which is used as a temporary
    storage area for operations such as sorting data, reorganizing tables, and creating
    indexes


    Unless otherwise specified, `SYSCATSPACE` and `USERSPACE1` will be DMS `FILE`
    table spaces, and `TEMPSPACE1` will be an SMS table space; characteristics for
    each of these table spaces can be provided as input to the `CREATE DATABASE` command
    or the Create Database Wizard.


    ### 5. The system catalog tables and views are created.


    After the table space `SYSCATSPACE` is created, a special set of tables, known
    as the system catalog tables, are constructed within that table space. The DB2
    Database Manager uses the system catalog tables to keep track of such information
    as database object definitions, database object dependencies, database object
    privileges, column data types, table constraints, and object relationships. A
    set of system catalog views is created along with the system catalog tables, and
    these views are typically used when accessing data stored in the system catalog
    tables. The system catalog tables and views cannot be modified with SQL statements
    (however, their contents can be viewed). Instead, they are modified by the DB2
    Database Manager whenever one of the following events occurs:


    *   A database object (such as a table, view, or index) is created, altered, or
    dropped.

    *   Authorizations or privileges are granted or revoked.

    *   Statistical information is collected for a table.

    *   Packages are bound to the database.


    In most cases, the complete characteristics of a database object are stored in
    one or more system catalog tables when the object is created. However, in some
    cases, such as when triggers and constraints are defined, the actual SQL used
    to create the object is stored instead.


    ### 6. The database is cataloged in the system and local database directory (a
    system or local database directory is created first if it does not already exist.)


    DB2 uses a set of special files to keep track of where databases are stored and
    to provide access to those databases. Because the information stored in these
    files is used like the information stored in an office-building directory is used,
    they are referred to as directory files. Whenever a database is created, these
    directories are updated with the database’s name and alias. If specified, a comment
    and code set values are also stored in these directories.


    ### 7. The database configuration file for the database is initialized.


    Some of the parameters in the database configuration file (such as code set, territory,
    and collating sequence) will be set using values that were specified as input
    for the `CREATE DATABASE` command or the Create Database Wizard; others are assigned
    system default values.


    ### 8. Four schemas are created.


    Once the system catalog tables and views are created, the following schemas are
    created: `SYSIBM`, `SYSCAT`, `SYSSTAT`, and `SYSFUN`. A special user named `SYSIBM`
    is made the owner of each.


    ### 9. A set of utility programs is bound to the database.


    Before some of the DB2 9 utilities available can work with a database, the packages
    needed to run those utilities must be created. Such packages are created by binding
    a set of predefined DB2 Database Manager bind files to the database (the bind
    files used are stored in the utilities bind list file `db2ubind.lst`).


    ### 10. Authorities and privileges are granted to the appropriate users.


    To connect to and work with a particular database, a user must have the authorities
    and privileges needed to use that database. Therefore, whenever a new database
    is created, unless otherwise specified, the following authorities and privileges
    are granted:

