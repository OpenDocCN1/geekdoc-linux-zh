    用于存放数据库数据容器的子目录名称与为数据库指定的名称相同；包含数据库基础文件的子目录名称对应于创建过程中分配给数据库的令牌（第一个创建的数据库的子目录将命名为
    `SQL00001`，第二个数据库的子目录将命名为 `SQL00002`，依此类推）。图 3–1 展示了这种目录层次结构在非分区的数据库环境中通常是样子的。


    ![Image](img/46.jpg)

    *图 3—1：非分区的数据库的典型目录树。*


    ![Image](img/paper.jpg) 切勿尝试修改此目录结构或存储其中的任何文件。此类操作可能会破坏一个或多个数据库或使其无法使用。


    ### 2. 创建管理、监控和数据库恢复所需的文件。


    在创建了分配数据库令牌名称的子目录后，会在其中创建以下文件：


    `db2rhist.asc` 此文件包含有关备份操作、恢复操作、表加载操作、表重组操作、表空间更改以及类似的数据库更改的历史信息（即恢复历史文件）。


    `db2rhist.bak` 此文件是 `db2rhist.asc` 的备份副本。


    `SQLBP.1` 此文件包含缓冲池信息。


    `SQLBP.2` 此文件是 `SQLBP.1` 的备份副本。


    `SQLDBCON` 此文件包含数据库配置信息。


    `SQLDBCONF` 此文件是 `SQLDBCON` 的备份副本。


    `SQLINSLK` 此文件包含用于确保数据库仅分配给 DB2 数据库管理器的一个一个实例的信息。


    `SQLOGCTL.LFH` 此文件包含有关活动事务日志文件的信息。恢复操作使用此文件中存储的信息来确定从日志回溯到多远的位置开始恢复过程。


    `SQLOGMIR.LFH` 此文件是 `SQLOGCTL.LFH` 的镜像副本。


    `SQLSGF.1` 此文件包含与自动存储相关的存储路径信息。


    `SQLSGF.2` 此文件是 `SQLSGF.1` 的备份副本。


    `SQLSPCS.1` 此文件包含表空间信息。


    `SQLSPCS.2` 此文件是 `SQLSPCS.1` 的备份副本。


    `SQLTMPLK` 此文件包含有关临时表空间的信息。


    还会创建两个名为 `DB2EVENT` 和 `SQLOGDIR` 的子目录；创建一个的死锁事件监控器并存储在 `DB2EVENT` 子目录中，并创建名为 `S0000000.LOG`、`S0000001.LOG`
    和 `S0000002.LOG` 的三个文件并存储在 `SQLLOGDIR` 子目录中。这三个文件用于在对数据库执行 SQL 操作时存储事务日志记录。


    ### 3. 为数据库创建缓冲池。


    在数据库创建过程中，会创建一个缓冲池并将其命名为 `IBMDEFAULTBP`。在默认情况下，在 Linux 和 UNIX 平台上，该缓冲池的大小为 1,000
    个 4K（千字节）页；在 Windows 平台上，该缓冲池的大小为 250 个 4K 页。此缓冲池实际使用的内存（同样，对于可能存在的任何其他缓冲池）在建立到数据库的第一个连接时分配，并在所有数据库连接终止时释放。


    ### 4. 创建两个常规表空间和一个系统临时表空间。


    在缓冲池 `IBMDEFAULTBP` 创建后，会创建三个表空间并与该缓冲池关联。这三个表空间如下：


    *   一个名为 `SYSCATSPACE` 的常规表空间，用于存储与数据库相关的系统目录表和视图

    *   一个名为 `USERSPACE1` 的常规表空间，用于存储所有用户定义对象（如表、索引等）以及用户数据、索引数据和长值数据

    *   一个名为 `TEMPSPACE1` 的系统临时表空间，用于数据排序、表重组和创建索引等操作的临时区域


    除非另有说明，`SYSCATSPACE` 和 `USERSPACE1` 将是 DMS `FILE` 表空间，而 `TEMPSPACE1` 将是 SMS 表空间；每个表表的特征可以作为
    `CREATE DATABASE` 命令或数据库向导的输入。


    ### 5. 创建系统目录表和视图。


    在表空间 `SYSCATSPACE` 创建后，会在该表空间内构建一组特殊的表，称为系统目录表。DB2 数据库管理器使用系统目录表来跟踪此类信息，例如数据库对象定义、数据库对象依赖关系、数据库对象权限、列数据类型、表约束和对象关系。与系统目录表一起创建一组系统目录视图，这些视图通常用于访问存储在系统目录表中的数据。系统目录表和视图无法通过
    SQL 语句修改（但可以查看其内容）。相反，每当发生以下事件时，DB2 数据库管理器就会对其进行修改：


    *   创建、修改或删除数据库对象（如表、视图或索引）。

    *   授予或撤销授权或权限。

    *   为表收集统计信息。

    *   将包（Packages）绑定到数据库。


    在大多数情况下，当创建数据库对象时，其完整特征存储在一个或多个系统目录表中。然而，在某些情况下（例如定义触发器和约束时），存储的是用于创建该对象的实际 SQL。


    ### 6. 在系统和本地数据库目录中记录数据库（如果系统或本地数据库目录不存在，则先创建系统或本地数据库目录）。


    DB2 使用一组特殊文件来跟踪数据库存储的位置，并提供对这些数据库的访问。由于存储在这些文件中信息的方式就像办公大楼目录信息一样，因此它们被称为目录文件。每当创建一个数据库时，这些目录都会使用数据库的名称和别名进行更新。如果指定，注释和代码集值也会存储在这些目录中。


    ### 7. 初始化数据库的数据库配置文件。


    数据库配置文件中的某些参数（如代码集、区域和排序序列）将使用作为 `CREATE DATABASE` 命令或数据库向导的输入指定的值进行设置；其他则分配系统默认值。


    ### 8. 创建四个模式（Schemas）。


    一旦创建了系统目录表视图，将创建以下模式：`SYSIBM`、`SYSCAT`、`SYSSTAT` 和 `SYSFUN`。一个名为 `SYSIBM` 的特殊用户成为每个模式的所有者。


    ### 9. 将一组实用程序绑定到数据库。


    在某些可用的 DB2 9 实用程序处理数据库之前，必须创建运行这些实用程序所需的包。此类包通过将一组预定义的 DB2 数据库管理器绑定文件绑定到数据库创建（使用的绑定文件存储在实用程序绑定列表文件
    `db2ubind.lst` 中）。


    ### 10. 向适当的用户授予权限和权利。


    为了连接并使用特定的数据库，用户必须拥有使用该数据库所需的权限和权利。因此，每当创建一个新数据库时，除非另有说明，将授予以下权限和权利：

    '
