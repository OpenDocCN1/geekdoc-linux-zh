    ![round](images/round.jpg) C. The DB2 software version and bit size (32 or 64)
    used on the primary server and the standby server must be the same.


    ![round](images/round.jpg) D. Table spaces and table space containers on the primary
    server and the standby server must be identical.


    # Answers


    ## Question 1

    The correct answer is **B.** The `Recover` utility performs the necessary restore
    and roll-forward operations to recover a database to a specific point in time,
    based on information found in the recovery history file. (The Recovery utility
    is invoked by executing the `RECOVER DATABASE` command.) If the `Recover` utility
    successfully restores a database, but for some reason fails while attempting to
    roll it forward, the entire recovery operation must be performed again. There
    is no way to restart a recovery operation from a point of failure.


    ## Question 2

    The correct answer is **C.** In a partitioned database environment, the `Recover`
    utility must be invoked from the catalog partition of the database.


    ## Question 3

    The correct answer is **C.** After ensuring the systems to be used as primary
    and secondary server are identical and that a `TCP/IP` connection exists between
    them, you can establish an HADR environment by performing the following tasks,
    in the order shown:


    1. Determine the host name, host IP address, and the service name or port number
    for both the primary and the secondary database server.

    2. Create the standby database by restoring a backup image or initializing a split
    mirror copy of the database that is to serve as the primary database.

    3. Set the `HADR` configuration parameters on both the primary and the standby
    databases.

    4. Connect to the standby instance and start `HADR` on the standby database.

    5. Connect to the primary instance and start `HADR` on the primary database.


    ## Question 4

    The correct answer is **A.** Once an HADR environment has been established, the
    following operations will be replicated automatically in the standby database
    whenever they are performed on the primary database:


    * Execution of Data Definition Language (DDL) statements `(CREATE, ALTER, DROP)`

    * Execution of Data Manipulation Language (DML) statements `(INSERT, UPDATE, DELETE)`

    * Buffer pool operations

    * Table space operations

    * Online reorganization

    * Offline reorganization

    * Changes to metadata for stored procedures and user-defined functions (UDFs)


    HADR does not replicate stored procedure and UDF object and library files. If
    this type of replication is needed, you must physically create the files on identical
    paths on both the primary and standby databases. (If the standby database cannot
    find the referenced object or library file, the stored procedure or UDF invocation
    will fail on the standby database.)


    Non-logged operations, such as changes to database configuration parameters and
    to the recovery history file, are not replicated to the standby database.


    ## Question 5

    The correct answer is **C.** In an HADR environment, applications can only access
    the current primary database—synchronization with the standby database occurs
    by rolling forward transaction log data that is generated on the primary database
    and shipped to the standby database.


    ## Question 6

    The correct answer is **B.** Both the primary and the standby database must be
    a single-partition database and they both must have the same database name; however,
    they do not have to be stored on the same database path.


    # CHAPTER 7


    ## Security

    Ten and one-half percent (10.5%) of the DB2 9 for Linux, UNIX, and Windows Database
    Administration Upgrade exam (Exam 736) is designed to test your knowledge about
    the new mechanisms provided with DB2 9 to protect data and database objects against
    unauthorized access and modification. The questions that make up this portion
    of the exam are intended to evaluate the following:


    * Your ability to identify the authentication types that are available with DB2
    9

    * Your knowledge of the mechanisms and steps needed to implement label-based access
    control (LBAC)


    This chapter is designed to introduce you to the new authentication types that
    are available with DB2 9 and to show you how to implement LBAC to control access
    to columns and rows in a table or view.


    ## Controlling Database Access

    Every database management system must be able to protect data against unauthorized
    access and modification. DB2 uses a combination of external security services
    and internal access control mechanisms to perform this vital task. In most cases,
    three different levels of security are employed: The first level controls access
    to the instance under which a database was created, the second controls access
    to the database itself, and the third controls access to the data and data objects
    that reside within the database.


    ### Authentication

    The first security portal most users must pass through on their way to gaining
    access to a DB2 instance or database is a process known as `authentication`. The
    purpose of authentication is to verify that users really are who they say they
    are. Normally, authentication is performed by an external security facility that
    is not part of DB2. This security facility may be part of the operating system
    (as is the case with AIX, Solaris, Linux, HP-UX, Windows 2000/NT, and many others),
    may be a separate add-on product (for example, Distributed Computing Environment
    [DCE] Security Services), or may not exist at all (which is the case with Windows
    95, Windows 98, and Windows Millennium Edition). If a security facility does exist,
    it must be presented with two specific items before a user can be authenticated:
    a unique user ID and a corresponding password. The user ID identifies the user
    to the security facility, and the password, which is information known only by
    the user and the security facility, is used to verify that the user is indeed
    who he or she claims to be.


    ### Where Does Authentication Take Place?

    Because DB2 can reside in environments composed of multiple clients, gateways,
    and servers, each of which may be running on a different operating system, deciding
    where authentication is to take place can be a daunting task. To simplify things,
    DB2 uses a parameter in each DB2 Database Manager configuration file (the `authentication`
    parameter) to determine how and where users are authenticated. Such a file is
    associated with every instance, and the value assigned to this parameter, often
    referred to as the `authentication type`, is set initially when an instance is
    created. Only one authentication type exists for each instance, and it controls
    access to that instance, as well as to all databases that fall under that instance’s
    control.


    The following authentication types are available:


    * **SERVER.** Authentication occurs at the server workstation, using the security
    facility provided by the server’s operating system. (The user ID and password
    provided by the user wishing to attach to an instance or connect to a database
    are compared to the user ID and password combinations stored at the server to
    determine whether the user is permitted to access the instance or database.) By
    default, this is the authentication type used when an instance is first created.

    * **SERVER_ENCRYPT.** Authentication occurs at the server workstation, using the
    security facility that is provided by the server’s operating system. However,
    the password provided by the user wishing to attach to an instance or connect
    to a database stored on the server may be encrypted at the client workstation
    before it is sent to the server workstation for validation.

