    # Table Spaces


    Table spaces are used to control where data is physically stored and to provide
    a layer of indirection between database objects (such as tables, indexes, and
    views) and one or more containers (i.e., directories, files, or raw devices) in
    which the object’s data actually resides. A single table space can span many containers,
    but each container can belong to only one table space. When a table space spans
    multiple containers, data is written in a round-robin fashion (in groups of pages
    called extents) to each container assigned to that table space; this helps balance
    data across all containers that belong to a given table space.


    Two types of table spaces can exist: system managed space (SMS) table spaces and
    database managed space (DMS) table spaces. With SMS table spaces, only directory
    containers can be used for storage and the operating system’s file manager is
    responsible for controlling how that space is used. The SMS storage model consists
    of many files (each representing a table, index, or long data object) that reside
    within the file system space—the user decides on the location of the files, the
    DB2 Database Manager assigns the files their names, and the file system is responsible
    for managing their growth. With DMS table spaces, only file and/or device containers
    can be used for storage, and the DB2 Database Manager is responsible for controlling
    how the space is used.


    If a database is enabled for automatic storage, one other type of table space—an
    automatic storage table space—can exist. Although at first glance, automatic storage
    table spaces appear to be a third type of table space, they are really just an
    extension of SMS and DMS table spaces: regular and large table spaces are created
    as DMS table spaces with one or more file containers; system and user temporary
    table spaces are created as SMS table spaces with one or more directory containers.
    Unlike when SMS and DMS table spaces are defined, no container definitions are
    needed for automatic storage table spaces; the DB2 Database Manager assigns containers
    to automatic storage table spaces automatically.


    # Creating New Table Spaces


