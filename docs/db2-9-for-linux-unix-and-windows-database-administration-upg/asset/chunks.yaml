- fmt: '

    Just as an index over relational data can be used to improve query performance,
    an index over XML data can be used to improve the efficiency of queries on XML
    documents that are stored in an XML column. In contrast to traditional relational
    indexes, where index keys are composed of one or more columns that you specify,
    an index over XML data uses a particular XML pattern expression to index paths
    and values found in XML documents stored in a single column. The data type of
    that column must be `XML`.


    To identify those parts of the document that will be indexed, an XML pattern is
    used to specify a set of nodes within the XML document. This pattern expression
    is similar to the path expression defined in the XQuery language, but it differs
    in that only a subset of the XQuery language is supported. Path expression steps
    are separated by the forward slash (`/`). The double forward slash (`//`)—which
    is the abbreviated syntax for `/descendant-or-self::node()`—may also be specified.
    In each step, a forward axis (`child::`, `@`, `attribute::`, `descendant::`, `self::`,
    and `descendant-or-self::`) is chosen, followed by an XML name test or XML kind
    test. If no forward axis is specified, the child axis is used as the default.
    Figure 3–12 shows a simple XML pattern and how it is used to identify a specific
    value within an XML document.


    ![Image](images/97-1.jpg)


    *Figure 4–1: How an XML pattern is used to identify a specific value within an
    XML document.*


    Instead of providing access to the beginning of a document, index entries in an
    index over XML data provide access to nodes within the document by creating index
    keys based on XML pattern expressions. And because multiple parts of an XML document
    can satisfy an XML pattern, multiple index keys may be inserted into the index
    for a single document.


    XML indexes are created by specifying the `GENERATE KEY USING XMLPATTERN` clause
    of the `CREATE INDEX` SQL statement when an index is created. The basic syntax
    for this optional clause is:


    ![Image](images/97-2.jpg)


    where:


    | Namespace | Identifies a valid namespace declaration that is used to identify
    namespace prefixes when qualified names are used in the pattern expression specified.
    |

    | :--- | :--- |

    | XMLPattern | Specifies a pattern expression that identifies the nodes that are
    to be indexed. The pattern expression provided can contain any of the following
    XQuery components: |

    | | • `*` (asterisk)—Specifies a pattern-matching character. |

    | | • `/` (forward slash)—Separates path expression steps. |

    | | • `//` (double forward slash)—The abbreviated syntax for `/descendant-or-self::node()`..
    |

    | | • `child::`—Specifies children of the context node. This is the default if
    no other forward axis is specified. |

    | | • `@`—Specifies attributes of the context node. This is the abbreviated syntax
    for `attribute::`. |

    | | • `attribute::`—Specifies attributes of the context node. |

    | | • `descendant::`—Specifies the descendants of the context node. |

    | | • `self::`—Specifies just the context node itself. |

    | | • `descendant-or-self::`—Specifies the context node and the descendants of
    the context node. |

    | SQLDataType | Specifies the SQL data type to which indexed values are converted
    before they are stored. The following values are valid for this parameter: `VARCHAR(Size)`,
    `DOUBLE`, `DATE`, and `TIMESTAMP`. |


    Thus, if you wanted to create an XML index using postal/zip code values found
    in an XML column named `CUSTINFO` in a table named `CUSTOMER` and to store those
    values as `DOUBLE` values, you could do so by executing a `CREATE INDEX` statement
    that looks something like this:


    ![Image](images/99-1.jpg)


    On the other hand, if you wanted to create an XML index using address information
    found in an XML column named `CUSTINFO` in a table named `CUSTOMER` and to store
    those values as `VARCHAR` values, you could do so by executing a `CREATE INDEX`
    statement that looks something like this:


    ![Image](images/99-2.jpg)


    In the first example, the index is created for an element; in the second, it is
    created for an attribute. Although it is possible to create XML indexes on attributes
    (or on the entire document, for that matter), performance can suffer. Therefore,
    it is usually better to create XML indexes on individual elements within an XML
    document.


    # DB2’s Data Movement Utilities


    Although a database usually functions as a self-contained entity, there are times
    when it becomes necessary to exchange data with “the outside world.” That’s the
    purpose of DB2’s data movement utilities. For this reason, DB2 provides three
    different utilities that are designed to move data between databases and external
    files. These utilities are:


    * The Export utility

    * The Import utility

    * The Load utility


    In DB2 9, the Export and Import utilities have been updated to support the native
    XML data type. The Load utility has not.


    # The Export Utility


    The Export utility is designed to extract data from a DB2 database table or view
    and externalize it to a file, using the delimited ASCII (DEL) format, the worksheet
    format (WSF), or the PC Information Exchange Format (IXF) format. Such files can
    then be used to provide data values to other databases (including the database
    from which the data was extracted) and software applications such as spreadsheets
    and word processors.


    One way to invoke the Export utility is by executing the `EXPORT` command. The
    basic syntax for this command is:


    ![Image](images/100.jpg)


    where:


    | FileName | Identifies the name and location of the external file data to which
    data is to be exported (copied). |

    | :--- | :--- |

    | LOBPath | Identifies one or more locations where large object (LOB) data values
    are to be stored. (If this option is specified, each LOB value found will be stored
    in its own file at the location specified.) |

    | LOBFileName | Identifies one or more base names that are to be used to name
    the files to which large object (LOB) data values are to be written. During an
    export operation, file names are constructed by appending a period (.) and a three-digit
    sequence number to the current base file name in this list, and then appending
    the generated file name to the large object data path specified (in `LOBPath`).
    For example, if the current LOB path is the directory “C:\LOBData” and the current
    LOB file name is “Value,” the LOB files created will be `C:\LOBData\Value.001.lob`,
    `C:\LOBData\Value.002.lob`, and so on. |

    | XMLPath | Identifies one or more locations where Extensible Markup Language
    (XML) documents are to be stored. (If this option is specified, each XML value
    found will be stored in its own file at the location specified.) |

    | XMLFileName | Identifies one or more base names that are to be used to name
    the files to which Extensible Markup Language (XML) documents are to be written.
    During an export operation, file names are constructed by appending a period (.)
    and a three-digit sequence number to the current base file name in this list and
    then appending the generated file name to the XML data path specified (in `XMLPath`).
    For example, if the current XML path is the directory “C:\XMLData”, and the current
    XML file name is “Value,” the XML files created will be `C:\XMLData\Value.001.xml`,
    `C:\XMLData\Value.002.xml`, and so on. |

    | Modifier | Identifies one or more options that are used to override the default
    behavior of the Export utility. ([Table 4.1](#014_Chapter04.xhtml_tab4_1) contains
    a list of valid modifiers that can be used when exporting XML data.) |

    | ColumnName | Identifies one or more column names that are to be written to the
    external file to which data is to be exported. |

    | MsgFileName | Identifies the name and location of an external file to which
    messages produced by the Export utility are to be written as the export operation
    is performed. |

    | SELECTStatement | Identifies a `SELECT` SQL statement that, when executed, will
    retrieve data that is to be copied to an external file. |

