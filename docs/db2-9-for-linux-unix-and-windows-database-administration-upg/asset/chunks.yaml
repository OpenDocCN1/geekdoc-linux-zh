    When a database is not enabled for self-tuning, the entire database will use a
    specified amount of memory, distributing it across the database memory consumers
    as required. However, when a database has been enabled for self-tuning, the memory
    tuner responds to significant changes in database workload characteristics, adjusting
    the values of memory configuration parameters and buffer pool sizes to optimize
    performance. If the current workload requirements are high, and there is sufficient
    free memory on the system, more memory will be consumed by the database. Once
    the workload’s memory requirements drop, or if the amount of free memory available
    on the system becomes too low, some database shared memory is released.


    Self-tuning is enabled for a database by assigning the value `ON` to the `self_tuning_mem`
    database configuration parameter. This is done by executing the `UPDATE DATABASE
    CONFIGURATION` command. (The database has to be stopped and restarted before the
    change will take effect.)


    Specific memory areas that are controlled by a memory configuration parameter
    can be enabled for self-tuning by assigning the value `AUTOMATIC` to the parameter,
    using the `UPDATE DATABASE CONFIGURATION` command; you can enable buffer pools
    for self-tuning by setting their size to `AUTOMATIC,` using either the `CREATE
    BUFFERPOOL` or the `ALTER BUFFERPOOL` SQL statement. However, because the memory
    tuner trades memory resources between different memory consumers, there must be
    at least two memory consumers enabled for self-tuning in order for self-tuning
    to be active. (Not to mention the fact that the database itself must have the
    `self_tuning_mem` database configuration parameter set to `ON`.)


    ![Image](images/paper.jpg) In order for automatic tuning of sort memory to occur,
    the `sheapthres_shr` database configuration must be assigned the value `AUTOMATIC`
    and the `sheapthres` DB2 Database Manager configuration parameter must be set
    to 0.


    Once a database and two or more memory consumers have been configured for self-tuning,
    the current memory configuration for the database can be obtained by executing
    the `GET DATABASE CONFIGURATION` command. Changes made by self-tuning are recorded
    in memory tuning log files, which reside in the `stmmlog` subdirectory of the
    instance. (The first file created will be assigned the name `stmm.0.log,`, the
    second will be assigned the name `stmm.1.log,` and so on.) Each memory tuning
    log file contains summaries of the resource demands for each memory consumer at
    the time a tuning operation was performed. Tuning intervals can be determined
    by examining the timestamps for the entries made in the memory tuning log files.


