    |

    | `DBPath` | 如果指定了 `AUTOMATIC STORAGE YES`（默认值），则识别物理存储要创建的数据库相关的目录层次和元数据文件的位置（驱动器或目录）。（如果没有指定此参数且使用了自动存储，则元数据文件将存储在
    `StoragePath` 参数指定的第一个存储路径中。） |


