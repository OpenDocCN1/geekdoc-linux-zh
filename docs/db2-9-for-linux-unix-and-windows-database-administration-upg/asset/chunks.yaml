    services 文件的默认位置取决于所使用的操作系统：在类 Unix 系统上，services 文件位于 `/etc/services;`；在 Windows
    服务器上，services 文件位于 `%SystemRoot%\system32\drivers\etc.`。services 文件中的 DB2 数据库服务器条目可能如下所示：


    ![Image](img/17-3.jpg)


    # 节点的注册与取消注册（Cataloging and Uncataloging）


    通过配置助手（Configuration Assistant）对远程数据库进行注册时，节点（服务器）通常会被隐式注册。然而，如果你想显式地注册节点（即为特定服务器在节点目录中添加条目），可以通过执行
    `CATALOG…NODE` 命令来实现，该命令对应于访问被注册服务器时使用的通信协议。有多种形式的 `CATALOG…NODE` 命令可供，包括以下几种：


    * `CATALOG LOCAL NODE`

    * `CATALOG LDAP NODE`

    * `CATALOG NAMED PIPE NODE`

    * `CATALOG TCPIP NODE`


    所有这些命令的语法非常相似，主要区别在于每个命令提供的许多选项是针对该命令所定制的通信协议的。由于 TCP/IP 可能是当今最常用的通信协议，让我们来看看该形式
    `CATALOG…NODE` 命令的语法。


    `CATALOG TCPIP NODE` 命令的语法为：


    ![Image](img/18.jpg)


    其中：


    | `NodeName` | 标识分配给被注册节点的别名。这是在用户工作站上创建的任意名称，用于识别节点。 |

    | `IPAddress` | 标识你尝试通信的远程数据库所所在服务器的 IP 地址。 |

    | `HostName` | 标识 TCP/IP 网络已知的主机名。（这是你尝试通信的远程数据库所所在服务器的名称。） |

    | `ServiceName` | 标识服务器上的 DB2 数据库管理器实例用于通信的服务名称。 |

    | `PortNumber` | 标识服务器上的 DB2 数据库管理器实例用于通信的端口号。 |

    | `InstanceName` | 标识要建立挂载的服务器实例名称。 |

    | `SystemName` | 标识用于识别服务器工作站的 DB2 系统名称。 |

    | `SystemType` | 标识服务器工作站上使用的操作系统类型。以下值对此参数有效：`AIX, WIN, HPUX, SUN, OS390, OS400,
    VM, VSE,` 和 `LINUX`。 |

    | `Description` | 用于描述在被注册节点的节点目录中创建的节点条目的注释。描述必须包含在双引号内。 |


    因此，如果你想为一个名为 `DB2HOST` 的 AIX 服务器注册节点，该服务器有一个名为 `DB2INST1` 的 DB2 实例并监听端口 60000，并为其分配别名
    `RMT_SERVER,`，你可以执行如下所示的 `CATALOG TCPIP NODE` 命令来实现：


    ![Image](img/19.jpg)


    另一方面，如果你想为一个 Linux 服务器注册节点，该服务器的 IPv6 地址为 1080:0:0:0:8:800:200C:417A，且有一个名为 `DB2INST1`
    的 DB2 实例监听端口 60000，并为其分配别名 `IPV6_SERVER,`，你可以执行如下所示的 `CATALOG TCPIP NODE` 命令来实现：


    ![Image](img/20.jpg)


    # 自动维护


    虽然可以使用任务中心（Task Center）调度例行维护操作，但在某些情况下，确定是否以及何时运行某些资源密集型维护程序可能非常耗时。通过自动维护（DB2
    9 中引入的一项新功能），你可以指定维护目标，DB2 数据库管理器将使用你识别的目标来确定是否需要执行一项或多项维护活动。如果确定需要维护操作，该操作将在下一个可用的维护窗口内执行（维护窗口是由你指定的时段，在此期间内将执行所有自动维护活动）。


    自动维护可执行以下维护操作：


    *   **创建数据库备份映像。** 自动数据库备份为用户提供了一种解决方案，帮助确保数据库既得当又定期地进行备份，而无需担心何时备份，也无需了解 `BACKUP`
    命令的语法。

    *   **数据碎片整理（表或索引重组）。** 此项维护活动可以提高 DB2 数据库管理器访问表的效率。自动重组可以管理离线表和索引重组，用户无需担心何时以及如何重组其数据。

    *   **数据访问优化（运行 RUNSTATS）。** DB2 数据库管理器更新有关表数据、表索引中的数据或表及其索引中数据的系统目录统计信息。DB2 优化器使用这些统计信息来决定响应查询时使用哪个路径访问数据。自动统计收集通过维护最新的表统计信息尝试提高数据库性能。目标是允许
    DB2 优化器始终根据准确的统计信息选择访问计划。

    *   **统计分析。** 自动统计分析通过检测过时、缺失或指定的统计信息并根据反馈建议何时以及如何收集表统计信息。


    当创建 DB2 9 数据库时，默认启用自动维护；各个自动维护功能的启用通过各种自动维护特定配置参数来控制。表 2.2 列出了可用的自动维护特定配置参数。


    | 表 2.2 DB2 自动维护特定配置参数 | | |

    | **参数** | **值范围 / 默认** | **描述** |

    | `auto_maint` | ON, OFF Default: ON | 启用或禁用数据库的自动维护。它是所有自动维护配置参数的父级（*`auto_db_backup`,
    `auto_tbl_maint`, `auto_runstats`, `auto_stats_prof`, `auto_prof_upd` 和 `auto_reorg`）。当此参数被禁用时，所有子参数也会被禁用，但它们在数据库配置文件中的设置不会更改。当此父参数启用时，其子参数的值生效。
    | |

    | `auto_db_backup` | ON, OFF Default: ON | 启用或禁用数据库的自动备份操作。 |

    | `auto_tbl_maint` | ON, OFF Default: ON | 启用或禁用数据库的自动表维护操作。此参数是所有表维护参数的父级（*`auto_runstats`,
    `auto_stats_prof`, `auto_prof_upd` 和 `auto_reorg`）。当此参数被禁用时，所有子参数也会被禁用，但它们在数据库配置文件中的设置不会更改。当此父参数启用时，其子参数的值生效。
    |

    | `auto_runstats` | ON, OFF Default: ON | 启用或禁用数据库的自动表 RUNSTATS 操作。 |

    | `auto_stats_prof` | ON, OFF Default: ON | 启用或禁用数据库的自动统计分析生成。 |

    | `auto_prof_upd` | ON, OFF Default: ON | 启用或禁用数据库的自动 runstats 分析更新。 | |

    | `auto_reorg` | ON, OFF Default: ON | 启用或禁用数据库的自动表和索引重组。 |


