    # 表空间


    表空间用于控制数据的物理存储位置，并并在数据库对象（如表、索引和视图）与实际存储对象数据的一个或多个容器（即目录、文件或原始设备）之间提供一个间接层。单个表空间可以跨越多个容器，但每个容器只能属于一个表空间。当表空间跨越多个容器时，数据将以轮询方式（以称为“区”的页组为单位）写入分配给该表空间的每个容器中；这有助于在属于给定表空间的所有容器之间平衡数据。


    存在两种类型的表空间：系统管理空间 (SMS) 表空间和数据库管理空间 (DMS) 表空间。对于 SMS 表空间，只能使用目录容器进行存储，并且操作系统的文件管理器负责控制该空间的使用。SMS
    存储模型由许多文件组成（每个文件代表一个表、索引或长数据对象），这些文件位于文件空间内——用户决定文件的位置，DB2 数据库管理器为文件分配名称，文件系统负责管理它们的增长。对于
    DMS 表空间，只能使用文件和/或设备容器进行存储，并且 DB2 数据库管理器负责控制该空间的使用。


    如果数据库启用了自动存储，则可能存在另一种类型的表空间——自动存储表空间。尽管从乍上看，自动存储表空间似乎是第三种表空间，但它们实际上是 SMS 和 DMS
    表空间的扩展：普通和大型表空间被创建为带有一个或多个文件容器的 DMS 表空间；系统和用户临时表空间被创建为带有一个或多个目录容器的 SMS 表空间。与定义
    SMS 和 DMS 表空间不同，自动存储表空间不需要容器定义；DB2 数据库管理器会自动为自动存储表空间分配容器。


