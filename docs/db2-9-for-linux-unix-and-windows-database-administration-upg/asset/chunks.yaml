    # 前言


    我们生活在一个信息时代。但我们是如何走到这里的呢？我们的目标是登上月球，攻克微型航天器与地球之间移动数据的任务，并以一种可靠且快速访问的方式存储这些数据。


    我们开发了新的技术、系统和软件，用于传输、处理和存储这些数据。今天，我们生活在一个处理能力持续飙升、存储容量几乎无限的时代。其结果就是前所未有的数据洪流。


    今天，目标不仅是存储数据，而是提供对信息的无处访问。我们生活在信息世界中，越来越地期望我们的世界成为一个“按需世界”：始终在线、随处可用，信息变得日益丰富、动态、即时且瞬时。


    我们使用笔记本电脑、手机、BlackBerry 获取信息——在办公桌前，也可以在途中。你的成功越来越多地取决于你跨跨组织、跨全球轻松访问并连接这些信息的能力。


    IBM 的目标是帮助我们的客户和合作伙伴从数据和信息管理转变为“按需信息”。按需信息意味着在正确的时间、正确的语境下，将正确的信息给正确的人。


    今天，最大的竞争优势往往来自于挖掘你已拥有的数据并进行轻松、无缝且无处不在连接：信息即服务。只有 IBM 拥有这一愿景以及广泛的产品和服务来使这一愿景成为现实，而
    `DB2` 就是你按需世界的数据服务器。


    数据服务器是你的 IT 基础的关键元素，`DB2` 是运行各种应用程序客户的首选数据服务器，从在线事务处理到数据仓库，从 Web 服务到分析，从从小数据量到极大数据量，无一不包。从免费的
    `DB2 Express-C` 到适用于事务和动态数据仓库应用的高级功能，IBM 为各种工作提供了合适的数据服务器。


    今天，`DB2` 运行在全球前 25 银行、美国前 25 零售商中的 23 家，以及全球前 10 大生命和健康保险提供商中的 9 家。`DB2` 是日益增多的软件供应商
    (ISV) 和运行 `SAP` 等 ISV 应用程序客户的选择。仅去年，就有超过 4,500 名新客户选择 `DB2` 来运行他们的业务。随着 `DB2 9`
    的发布，我们看到这种增长正在加速。我们现在有超过 450,000 名客户使用 IBM 数据服务器在各行业、全球范围内运行业务。


    `DB2` 是唯一在 TPC-C、TPC-H 和 SAP 基基测试中持续提供领先性能的数据服务器。但更重要的是，DB2 继续为你的业务提供可靠性和安全性。


    `DB2 9` 再次证明了 IBM 的与众不同——从 1966 年支持阿波罗计划而发明数据库技术；到 70 年代发明关系型数据模型；到 `DB2 9` 中的
    68 项专利创新；IBM 持续在帮助客户交付业务成果的方面保持领先。


    信息是全球业务的织物，数据服务器专业人员对于企业资产的交付、管理和治理至关重要。Roger Sanders 提供了一个学习 `DB2` 的绝佳机会，我鼓励你利用这个机会学习可以为你的业务创造更多价值的技能。你投入的时间对你和你的同事都是有价值的。


    Arvind Krishna

    IBM 公司

    副总裁


    # 前言


    今天计算机专业人员面临的最大挑战之一是让自己的技能与技术的最新变化保持同步。当计算行业处于婴儿时代时，成为几个不同领域的专家是可能的，因为领域的范围相对较小。今天，我们的行业既广泛又节奏快，掌握单个软件包所需的技能可能非常复杂。由于这种复杂性，许多应用程序和硬件供应商都启动了认证计划，以评估和验证个人对其技术的了解。企业从这些计划中受益，因为专业认证让他们相信个人具有执行特定工作所需的知识。计算机专业人员也受益，因为专业认证使他们能够提供高水平的服务和技术专家，更重要的是，专业认证可以带来他们在计算机行业内的晋升或新的工作机会。


