    automatic maintenance activities can be regulated with DB2’s adaptive utility
    throttling system.


    The adaptive utility throttling system allows maintenance utilities to be run
    concurrently during critical periods, while keeping their performance impact on
    production workloads within acceptable limits. The following maintenance operations
    can be throttled:


    *   Statistics collection


    *   Backup operations


    *   Rebalancing operations


    *   Asynchronous index cleanups


    The value assigned to the *util_impact_lim* DB2 Database Manager configuration
    parameter limits the amount of performance degradation throttled utilities can
    have on a production workload. To define the impact policy for *all* throttled
    utilities, you simply assign the *util_impact_lim* configuration parameter any
    value between 1 and 100\. For example, to configure an instance so that an automatic
    backup operation invocation will not impact the system workload by more than 10
    percent, you would assign the *util_impact_lim* configuration parameter the value
    10 by executing an `UPDATE DATABASE MANAGER` command that looks like this:


    ![Image](images/22.jpg)


    As you would expect, a throttled utility will usually take longer to complete
    than an unthrottled utility. If you find that a utility is running for an excessively
    long time, you can increase the value assigned to the *util_impact_lim* configuration
    parameter, or you can disable throttling altogether by setting the *util_impact_lim*
    configuration parameter to 100\. (If *util_impact_lim* is set to 100, utility
    invocations are not throttled. In this case, the utilities can complete faster,
    but they most likely will have an undesirable impact on workload performance.)


    Although the impact policy for throttled utilities is defined by the value assigned
    to the *util_impact_lim* configuration parameter, this policy can be overridden
    by using a special option that is available with the commands that are used are
    to invoke throttled utilities. The syntax for this special option is:


    ![Image](images/23-1.jpg)


    where:


    | *Priority* | Specifies the amount of throttling to which the utility is to be
    subjected. A value of 100 represents the highest priority; a value of 1 represents
    the lowest. If no *Priority* is specified, the utility will be executed with a
    default priority of 50\. (All utilities at the same priority undergo the same
    amount of throttling, and utilities at lower priorities are throttled more than
    those at higher priorities.) |


    For example, if you wanted to backup a database named `SALES` and have the backup
    operation run throttled with a priority of 20, you could do so by executing a
    `BACKUP DATABASE` command that looks something like this:


    ![Image](images/23-2.jpg)


    If the command used to invoke a throttled utility is executed without the `UTIL_IMPACT_PRIORITY`
    option, the utility will run unthrottled, even if the *util_impact_lim* configuration
    parameter has been assigned a value other than 100.


    # ***Obtaining Information About Running Utilities***


    If you want to find out which, if any, utilities are running against an instance
    and what their throttling impact priority is, you can do so by executing the `LIST
    UTILITIES` command. The syntax for this command is:


    ![Image](images/24-1.jpg)


    So if you started an unthrottled backup operation for a database named `SAMPLE,`
    you could obtain detailed information about this operation by executing a `LIST
    UTILITIES` command that looks like this:


    ![Image](images/24-2.jpg)


    And when this command is executed, the information produced would look something
    like this:


    ![Image](images/24-3.jpg)


    # ***Changing a Running Utility’s Impact Priority***


    If you want to change the impact priority (level of throttling) of a utility that
    is already running, you can do so by executing the `SET UTIL_IMPACT_PRIORITY`
    command. With this command, you can


    *   throttle a running utility that was started in unthrottled mode,


    *   unthrottle a running throttled utility (disable throttling), and


    *   reprioritize a running throttled utility (this is useful if multiple simultaneous
    throttled utilities are running and one is more important than the others).


    The syntax for the `SET UTIL_IMPACT_PRIORITY` command is:


    ![Image](images/25-1.jpg)


    where:


    | *UtilityID* | Identifies the running utility, by ID, whose priority is to be
    changed. (The ID assigned to a running utility can be obtained by executing the
    `LIST UTILITIES` command.) |


    | *Priority* | Specifies an instance-level limit on the impact associated with
    running the utility specified. A value of 100 represents the highest priority;
    a value of 1 represents the lowest. Setting *Priority* to 0 will force a throttled
    utility to continue running unthrottled; setting *Priority* to a non-zero value
    will force an unthrottled utility to continue running in throttled mode. |


    Thus, if you wanted to force the unthrottled backup operation that information
    was obtained for earlier (with the `LIST UTILITIES` command) to continue running
    in throttled mode, you could do so by executing a `SET UTIL_IMPACT_PRIORITY` command
    that looks like this:


    ![Image](images/25-2.jpg)


    When this statement is executed, the backup operation should have no more than
    a 20 percent average impact on the total workload being processed by the server.


    # **Self-Tuning Memory Manager**


    Although utility throttling can help reduce the impact the execution of a utility
    has on production workloads, how well (or poorly) workloads perform often depends
    on how resources such as memory are utilized by the server. And as we saw earlier,
    the DB2 Database Manager configuration and database configuration parameters control
    how system resources are allocated for instances and databases. In DB2 9, a new
    memory tuning feature, known as the Self-Tuning Memory Manager (STMM), simplifies
    the task of configuring memory-related database parameters by automatically setting
    values for these parameters after measuring and analyzing how well each DB2 memory
    consumer is using the allocated memory available. The following memory consumers
    can be enabled for self-tuning:


    *   Buffer pools (controlled by the `ALTER BUFFERPOOL` and `CREATE BUFFERPOOL`
    statements)


    *   Package cache (controlled by the *pckcachesz* configuration parameter)


    *   Locking memory (controlled by the *locklist* and *maxlocks* configuration
    parameters)


    *   Sort memory (controlled by the *sheapthres_shr* and the *sortheap* configuration
    parameters)


    *   Database shared memory (controlled by the *database_memory* configuration
    parameter)'
