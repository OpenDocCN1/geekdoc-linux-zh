  trans: '

    像传统数据一样，XML 文档可以添加到数据库表中、进行修改、删除和检索，这些可以使用 SQL 数据操作语言语句（`INSERT`、`UPDATE`、`DELETE`
    和 `SELECT` 语句）。通常，XML 文档（如 XML 1.0 规范定义）是由应用程序进行处理的；当从应用程序程序执行 DML 操作时，IBM 建议通过主机变量而非字面量来处理
    XML 数据，以便 DB2 能够使用主机变量数据类型来确定处理时所需的某些编码信息。尽管您可以使用 XML、二进制或字符类型来操作 XML 数据，但 IBM
    建议您使用 XML 或二进制类型，以避免代码页转换问题。


    应用程序中使用的 XML 数据通常存储在序列化字符串格式中——当这些数据被插入 XML 列或当 XML 列中的数据被更新时，必须将其转换为其 XML 层次级格式。如果使用的应用程序数据类型是
    `XML` 数据类型，DB2 会隐式地执行此操作。然而，如果应用程序数据类型是字符或二进制数据类型，则在插入和更新操作期间，必须使用 `XMLPARSE()`
    函数显式地将数据从序列化字符串格式转换为 XML 层次级格式。一个使用 `XMLPARSE()` 函数将字符串值插入名为 `CUSTOMERS` 表中 `CUSTINFO`
    XML 列的简单 `INSERT` 语句可能如下：


    ![Image](img/92-1.jpg)


    当使用命令行处理器（Command Line Processor）处理存储在 XML 列中的 XML 文档时，插入、更新和删除操作可以将字符串数据直接分配给
    XML 列，无需显式调用 `XMLPARSE()` 函数。例如，假设您想向具有以下特征的 `CUSTOMER` 表添加一条包含 XML 数据的记录：


    | 列名 | 数据类型 |

    | :--- | :--- |

    | `CUSTID` | `INTEGER` |

    | `INFO` | `XML` |


    您可以通过从命令行处理器执行如下的 `INSERT` 语句来实现：


    ![Image](img/92-2.jpg)


    如果您想从命令行处理器更新此记录的 XML 数据部分，可以通过执行如下所示的 `UPDATE` 语句来实现：


    ![Image](img/92-3.jpg)


    ![Image](img/93-1.jpg)


    最后，如果您想从 `CUSTOMER` 表中删除该记录，可以通过从命令行处理器执行如下所示的 `DELETE` 语句来实现：


    ![Image](img/93-2.jpg)


    那么，一旦 XML 数据存储在表中，如何检索它呢？在 DB2 9 中，可以使用 SQL 查询或可用的 SQL/XML 查询函数来检索 XML 数据。在使用
    SQL 查询 XML 数据时，您只能在列级别检索数据——也就是说，必须检索整个 XML 文档。无法使用 SQL 返回文档片段；要查询 XML 文档内部，您需要使用
    XQuery。


    XQuery 是一种函数式编程语言，由万网联盟（W3C）设计，以满足查询 XML 数据的特定需求。与可预测且具有规则结构的关系数据不同，XML 数据通常是不可预测的、高度多变的、稀疏且自描述的。由于
    XML 数据的结构不可预测，在 XML 数据上执行的查询通常与典型的关系查询不同。例如，您可能需要创建执行以下操作的 XML 查询：


    * 在 XML 数据中搜索位于层级结构未知位置的对象。

    * 对数据进行结构化转换（例如，您可能想反转一个层次结构）。

    * 返回混合类型的结果。


    在 XQuery 中，表达式是查询的主要构建模块。表达式可以嵌套，并构成了查询的主体。查询还可以有一个序言（prolog），其中包含一组定义查询处理环境的声明。因此，如果您想从存储在
    `CUSTOMER` 表 `CUSTINFO` 列的 XML 文档中检索所有居住在北罗来纳州的客户名称（假设该表已通过我们之前看到的 `INSERT` 语句填充），可以通过执行如下所示的
    XQuery 表达式来实现：


    ![Image](img/94-1.jpg)


    当从命令行处理器执行此 XQuery 表达式时，它应该返回如下信息（再次假设该表已通过之前看到的 `INSERT` 语句填充）：


    ![Image](img/94-2.jpg)


    如果您想移除 XML 标签并只返回客户名称，可以通过执行如下所示的 XQuery 表达式来实现：


    ![Image](img/94-3.jpg)


    现在当从命令行处理器执行 XQuery 表达式时，它应该返回如下信息：


    ![Image](img/94-4.jpg)


    如前所述，可以使用任何 SQL/XML 函数或谓词从 SQL 中调用 XQuery 表达式：


    `XMLQUERY()`。`XMLQUERY()` 是一个 SQL 标量函数，允许您在 SQL 上下文中执行 XQuery 表达式。`XMLQUERY()`
    返回 XML 值，即 XML 序列。该序列可以是空的，也可以包含一个或多个项目。您还可以将变量传递给 `XMLQUERY()` 中指定的 XQuery 表达式。


    `XMLTABLE()`。`XMLTABLE()` 是 SQL 表函数，根据 XQuery 表达式的评估返回表。XQuery 表达式通常作为序列返回值；但
    `XMLTABLE()` 允许您执行 XQuery 表达式并将值作为表返回。返回的表包含任何 SQL 数据类型的列，包括 XML。结果表的结构由 `XMLTABLE()`
    的 `COLUMNS` 子句定义。


    `XMLEXISTS`。`XMLEXISTS` 谓词确定 XQuery 表达式是否返回一个或多个项目的序列。如果谓词指定的 XQuery 表达式返回空序列，`XMLEXISTS`
    返回 FALSE；否则返回 TRUE。`XMLEXISTS` 谓词可以用于 `UPDATE`、`DELETE` 和 `SELECT` 语句的 `WHERE`
    子句。这种用法可以使用存储的 XML 文档的值来限制 DML 语句操作的行集。


    此外，可以使用 `XMLSERIALIZE()` 函数将 XML 数据转换为字符或 BLOB 数据，同时可以使用 `XMLPARSE()` 函数将字符或 BLOB
    数据解析为生成良好的 XML 文档。


    通过在 SQL 上下文中执行 XQuery 表达式，您可以：


    * 操作存储的 XML 文档的部分，而不是整个 XML 文档（只有 XQuery 可以查询 XML 文档内部；SQL 仅在整个文档级别进行查询）；

    * 让 XML 数据参与 SQL 查询；

    * 同时对关系数据和 XML 数据进行操作；

    * 对返回的 XML 值应用进一步的 SQL 处理（例如，使用子查询的 `ORDER BY` 子句对结果进行排序）。


    因此，假设您想检索具有以下特征的 `CUSTOMER` 表客户 ID 和客户名称：


    | 列名 | 数据类型 |

    | :--- | :--- |

    | `CUSTID` | `INTEGER` |

    | `INFO` | `XML` |


    您可以（假设该表已通过之前看到的 `INSERT` 语句填充）通过从命令行处理器执行如下所示的 `SELECT` 语句来实现：


    ![Image](img/96-1.jpg)


    当执行此查询时，它应该返回如下信息：


    ![Image](img/96-2.jpg)

