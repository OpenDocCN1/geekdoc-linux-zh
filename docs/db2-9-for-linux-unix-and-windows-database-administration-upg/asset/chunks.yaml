    # 导入工具


    有时将存储在表或视图中的数据复制到外部文件是有益的，有时将存储在外部文件的数据复制到数据库表或可更新视图也是有利的。从外部文件向数据库的数据的一种方法是使用
    DB2 的导入工具；导入工具设计用于直接从外部文件读取数据（前提是文件以 DB2 支持的格式写入），并插入特定的表或可更新视图中。


    可以通过执行 `IMPORT` 命令调用导入工具。该命令的基本语法为：


    ![Image](img/104.jpg)


    其中：


    | 修饰符 | 说明 |

    | :--- | :--- |

    | `FileName` | 标识要导入（复制）数据的外部文件的名称和位置。 |

    | `LOBPath` | 标识存储要导入的大对象 (LOB) 数据值的一个或多个位置。 |

    | `XMLPath` | 标识存储要导入的 XML 文档的一个或多个位置。 |

    | `Modifier` | 标识用于覆盖导入工具默认行为的一个或多个选项。（表 4.2 包含了在导入 XML 数据时可使用的有效修饰符列表。） |

    | `Method` | 标识用于从指定的外部文件中提取数据值并将其映射到指定的目标表/可更新视图的一个或多个列的方法（位置、名称或序号）。指定每种方法的语法各异。（我们稍后会查看这些语法。）
    |

    | `SchemaID` | 标识用于验证导入的 XML 文档的 XML 架构/SQL 标识符。以这种方式验证 XML 文档时，XML 数据指定符 (XDS)
    的 `SCH` 属性将被忽略。 |

    | `CommitCount` | 标识在执行提交操作之前要复制到指定的表/可更新视图的数据行（记录）数。（对于因事务日志满而失败的导入操作，应使用 `COMMITCOUNT
    AUTOMATIC`。） |

    | `RestartCount` | 标识指定的外部文件中要跳过的数据行数。此选项通常用于先前的导入操作失败过的情况——通过跳过已成功导入到表/可更新视图的行，一次导入操作基本上可以从另一次导入操作中断的地方继续。
    |

    | `WarningCount` | 标识在导入操作停止之前允许的警告数量。（如果指定的要导入文件或目标表不正确，导入工具将为尝试导入的每一行生成一个警告。）如果此参数设置为
    0 或未指定，无论发出多少个警告，导入操作都将继续。 |

    | `MsgFileName` | 标识在执行导入操作期间，将导入工具产生的消息写入的外部文件的名称和位置。 |

    | `TableName` | 标识要导入（复制）数据的表或可更新视图的赋值名称。（这不能是系统目录表或视图的名称。） |

    | `ColumnName` | 标识要导入数据的一个或多个特定列（按名称标识）。 |

    | `TSName` | 如果要创建指定的表，则标识该表及其常规数据、索引和/或长数据/大对象数据存储的表空间。 |


