    如果你已经买了这本书（或者你正在考虑购买这本书），你可能已经决定要获得一项或多项现有的 IBM DB2 专业认证。作为一名持有 12 项 IBM DB2 专业认证的个人，我向你保证，要成为一名经过认证的
    DB2 专业人士，必须通过的考试并不简单。IBM 以设计全面的认证考试为自豪，这些考试与持有特定认证的人员未来将面对的工作环境密切相关。因此，IBM 的所有认证考试在设计时都考虑了以下事项：


    * 持有特定专业认证的人员必须执行的关键任务有哪些？

    * 为了执行识别出的每个关键任务，个人必须具备哪些技能？

    * 个人执行识别出的每个关键任务的频率是多少？


    你会发现，要通过 DB2 认证考试，你必须对 `DB2` 有深入的理解。对于一些高级高级认证，你还必须理解许多 DB2 的细微差别。


    现在来说是一个好消息。你手中的这本书是我认为准备 DB2 9 for Linux、UNIX 和 Windows 数据库管理升级考试（考试编号 736）的最佳工具。当
    IBM 开始制定 DB2 9 认证考试时，我再次受邀参与考试开发过程。除了帮助定义考试目标外，我还编写了多道考试题，并在最终考试投产前对许多其他题目提供了反馈。因此，我见过了你可能遇到的每一道考试题，并且知道在你参加
    DB2 9 for Linux、UNIX 和 Windows 数据库管理升级考试（考试编号 736）时，你将被测试的每一个概念。利用这些知识，结合实际考试题的副本，我编写了本学习指南。它不仅涵盖了你通过
    DB2 9 for Linux、UNIX 和 Windows 数据库管理升级考试（考试编号 736）必须掌握的每一个概念，还涵盖了考试过程本身以及每个可用
    DB2 9 认证角的要求。此外，你将在每个章节的末尾找到与实际考试题措辞完全相同的示例题。简而言之，如果你在书中看到了，那么就指望在考试中看到它；如果你在书中没看到，那么它就不会出现在考试中。如果你熟悉了书中介绍的内容，你的考试表现将会很好。


    # 第 1 章


    # IBM DB2 9 认证


    IBM 的专业认证计划在全球范围内广认可，为 IT 专业人士提供了一系列认证选项。该计划由几个不同的认证角色组成，旨在引导你的职业发展；你通过选择适合自己的角色并熟悉该角色的认证要求来开始认证流程。一旦你选择了想要追求的认证角色并熟悉了该特定角的要求，下一步就是准备并参加相应的认证考试或多次考试。


    本章旨在向你介绍一条快速路径，以获取 IBM 的 `IBM Certified Database Administrator - DB2 9 for Linux,
    UNIX, and Windows` 认证。


    # IBM Certified Database Administrator - DB2 9 for Linux, UNIX, and Windows


    `IBM Certified Database Administrator - DB2 9 for Linux, UNIX, and Windows` 认证旨在面向经验丰富的
    DB2 9 用户，他们具备了对 Linux、UNIX 或 Windows 平台上的 DB2 9 实例和数据库进行日常管理所需的知识和技能。除了熟悉 DB2
    9 数据库管理概念外，寻求此认证的人员应该具有丰富的 DB2 9 数据库管理员 (DBA) 实战经验。


    已参加并通过 `DB2 V8.1 Family Fundamentals` 考试（考试编号 700）或获得 IBM Certified Database Administrator
    - DB2 V8.1 for Linux, UNIX, and Windows 认证（通过通过考试 700 和 701）的候选人必须通过 `DB2 9 for
    Linux, UNIX, and Windows Database Administration` 考试（考试编号 731），以获得 IBM Certified
    Database Administrator—DB2 9 for Linux, UNIX, and Windows 认证。所有其他候选人必须同时通过 `DB2
    9 Family Fundamentals` 考试（考试编号 730）和 `DB2 9 for Linux, UNIX, and Windows Database
    Administration` 考试（考试编号 731）。获取 IBM Certified Database Administrator - DB2 9 for
    Linux, UNIX, and Windows 认证的路线图参见图 1–1。


    ![Image](img/2.jpg)


    *图 1–1：IBM Certified Database Administrator - DB2 9 for Linux, UNIX, and Windows
    认证路线图。*


    已经持有 IBM Certified Database Administrator - DB2 V8.1 for Linux, UNIX, and Windows
    认证的候选人可以选择参加 `DB2 9 for Linux, UNIX, and Windows Database Administration Upgrade`
    考试（考试编号 736），以获得 IBM Certified Database Administrator - DB2 9 for Linux, UNIX,
    and Windows 认证。这项考试的长度和费用都是 `DB2 9 for Linux, UNIX, and Windows Database Administration`
    考试（考试编号 731）的一半，旨在测试候选人对 DB2 9 中可用新特性和功能的理解。本质，升级考试为已认证的 DB2 版本 8.1 DBA 提供了一种获取等效版本
    9 认证的快捷路径。这种快捷路径见图 1–2。


    ![Image](img/3.jpg)


    *图 1–2：获取 IBM Certified Database Administrator - DB2 9 for Linux, UNIX, and Windows
    认证的快捷路径。*


    # DB2 9 for Linux, UNIX, and Windows Database Administration Upgrade 考试（考试 736）目标


    DB2 9 for Linux, UNIX, and Windows Database Administration Upgrade 考试（考试编号 736）包含
    38 道单选题，候选人有 60 分钟完成考试。需要达到 55% 或更高分数方可通过。


    DB2 9 for Linux, UNIX, and Windows Database Administration Upgrade 考试（考试编号 736）旨在涵盖的主要目标如下（章节标题后的百分比反映了各部分占总数的比例）：


    ## 第 1 节 - 服务器管理 (29%)


    * 理解 `AUTONFIGURE` 命令的功能

    * 手动配置通信（重点是 IPv6）

    * 启用自动维护

    * 启用自调内存

    * 启用实用程序限制


    ## 第 2 节 - 数据放置 (21%)


    * 了解 `CREATE DATABASE` 命令的新默认行为

    * 创建和管理自动存储表空间

    * 表分区知识

    * 数据行压缩


    ## 第 3 节 - XML 概念 (13%)


    * 使用 XML 数据类型

    * 创建和管理 XML 索引

    * 使用基础 XML 函数（例如 `XMLPARSE`、`XMLSERIALIZE`、`XMLVALIDATE` 和 `XMLQUERY`）

    * 熟悉 XQuery 基础

    * 使用 DB2 工具处理 XML 数据


    ## 第 4 节 - 分析 DB2 活动 (16%)


    * 使用 DB2 故障排除工具（`db2bfd`、`db2mtrk` 和 `db2pd`）

    * 监控死锁

    * 使用管理例程和 `SNAPSHOT` 函数


    ## 第 5 节 - 高可用性 (10.5%)


    * 使用 `RECOVER DATABASE` 命令

    * 了解高可用灾难恢复 (HADR)


    ## 第 6 节 - 安全性 (10.5%)


    '
