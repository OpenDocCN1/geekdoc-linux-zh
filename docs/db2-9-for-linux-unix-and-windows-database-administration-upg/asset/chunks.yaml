    different table spaces, allowing for more granular control of index placement.


    **Better query processing.** In the process of resolving queries, one or more
    data partitions may be automatically eliminated based on the query predicates
    used. This functionality, known as Data Partition Elimination, improves the performance
    of many decision support queries because less data has to be analyzed before a
    result data set can be returned.


    Data from a given table is partitioned into multiple storage objects based on
    the specifications provided in the `PARTITION BY` clause of the `CREATE TABLE`
    statement. The syntax for this optional clause is:


