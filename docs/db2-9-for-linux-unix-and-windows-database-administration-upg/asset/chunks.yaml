    # Question 8


    正确答案是 `C`。DB2 问题确定工具 (`db2pd`) 用于从 DB2 数据库系统内存集中获取快速直接的信息，而无需获取任何锁（latches）。在不加锁的情况下收集信息有两个好处：数据检索速度更快且不竞争引擎资源。然而，由于
