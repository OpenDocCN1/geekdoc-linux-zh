    在大多数情况下，事务是在与数据库连接后首次执行可执行的 SQL 语句时启动的，或者在预存事务终止后立即启动的。一旦启动，事务可以使用名为“自动提交”（automatic
    commit）的功能进行隐式终止（在这种情况下，每条可执行的 SQL 语句被视为单个事务，如果语句执行成功，则该语句产生的所有更改将应用于数据库；如果语句执行失败，则丢弃更改），也可以通过执行
    `COMMIT` 或 `ROLLBACK` SQL 语句来显式终止。这两个语句的基本语法如下：


    ![Image](img/152-1.jpg)


    和


    ![Image](img/152-2.jpg)


    当使用 `COMMIT` 语句终止事务时，自事务开始以来对数据库进行的所有更改将变为永久性。相反，当使用 `ROLLBACK` 语句时，所有已更改将被撤销，数据库将恢复到事务启动之前的状态。


    事务日志记录是一个用于在更改发生时跟踪（由事务）对数据库更改的过程。每当执行一次更新或删除操作时，都会从存储中检索包含要更新/删除记录的页面，并将其复制到适当的缓冲区池中，然后在由更新/删除操作对其进行修改。（如果通过插入操作创建了新记录，则该记录将直接在适当的缓冲区池中创建。）一旦记录被修改（或插入），反映修改/插入的记录就会写入日志缓冲区，日志缓冲区仅仅是内存中的另一个指定存储区域。如果执行了插入操作，则将包含新行的记录写入日志缓冲区；如果执行了删除操作，则将包含该行原始值的记录写入日志缓冲区；如果执行了更新操作，则将包含该行原始值并结合该行新值的记录写入日志缓冲区。（如果未启用复制，则将使用“之前”行和“之后”行执行独占
    `OR` 操作，并将结果写入日志缓冲区。）


    每当缓冲区池 I/O 页面清理器被激活、日志缓冲区变满或事务终止（通过提交或回滚）时，日志缓冲区中存储的所有记录都会立即写入存储在磁盘上的一个或多个日志文件。一旦与特定事务相关的所有日志记录外部化到一个或多个日志文件，事务本身的影响就会记录在数据库中（即在适当的表空间容器上执行以进行永久存储）。被修改的数据页保留在内存中，如有需要，可以快速访问——最终，当从存储中检索新页面时，它们将被覆盖。事务日志记录过程可以在图
    6–1 中看到。


    ![Image](img/153.jpg)


    *图 6–1：事务日志记录过程。*


    由于日志记录频繁外部化，并且特定事务的更改只有在事务本身成功终止时才会外部化到数据库，因此故障发生后将数据库恢复到一致状态的能力得到了保证——当数据库重启时，会分析日志记录，每个具有对应
    `COMMIT` 记录的记录都会重新应用于数据库；每个没有对应 `COMMIT` 记录的记录要么被忽略要么撤销（这就是为什么对所有更新操作都记录“之前”和“之后”信息的原因）。


    # 数据库恢复概念


    随着时间的推移，数据库可能会遇到许多问题，包括断电、存储介质故障和应用程序异常（abends）。所有这些都可能导致数据库故障，每种故障场景都需要不同的恢复操作。


    备份数据库的概念与备份任何其他数据文件相同：你创建数据的副本并存储在不同的介质上，以便在原始数据损坏或销毁时可以访问。备份数据库的最简单方法是关闭它以确保不再处理后续事务，然后使用
    DB2 提供的备份工具对其进行备份。一旦创建了备份映像，如果由于某些原因它变得损坏或损坏，你以后可以使用它来重新构建数据库。


    重建数据库的过程被称为恢复，DB2 提供了三种类型的恢复：


    *   崩溃恢复（Crash recovery）

    *   版本恢复（Version recovery）

    *   向前滚动恢复（Roll-forward recovery）


    # 崩溃恢复


    崩溃恢复通过使用存储在事务日志文件中的信息执行，以完成事务故障发生时位于内存中（但尚未外部化到存储）的所有已提交事务，回滚任何发现的不完整事务，并从内存中清除任何未提交的事务。一旦数据库恢复到一致且可状态，它就达到了所谓的“一致性点”。崩溃恢复在图
    6–2 中所示。


    ![Image](img/155.jpg)


    *图 6–2：崩溃恢复。*


    崩溃恢复操作通过执行 `RESTART DATABASE` 命令启动。


    # 版本恢复


    版本恢复是将数据库恢复到特定备份映像创建时状态的过程。版本恢复通过使用备份操作创建的副本将数据库当前版本替换为之前的版本来实现——整个数据库使用较早创建的备份映像重建。遗憾的是，当执行版本恢复时，自所使用的备份映像创建以来对数据库进行的所有更改都丢失了。版本恢复在图
    6–3 中所示。


    ![Image](img/156.jpg)


    *图 6–3：版本恢复。*


    版本恢复操作通过执行 `RESTORE DATABASE` 命令启动；版本恢复所需的数据库备份映像通过执行 `BACKUP DATABASE` 命令生成。


    # 向前滚动恢复


    向前滚动恢复比版本恢复更进一步，它使用备份映像重建数据库或一个或表空间，并重放存储在事务日志文件中的信息，将数据库/表空间恢复到精确时间点的状态。为了执行向前滚动恢复操作，你必须启用归档日志记录，必须拥有数据库的完整映像或一套完整的表空间备份映像，并且必须能够访问自映像创建以来创建的所有归档日志文件。向前滚动恢复如图
    6–4 所示。


    ![Image](img/157.jpg)


    *图 6–4：向前滚动恢复。*


    向前滚动恢复操作通过执行 `ROLLFORWARD DATABASE` 命令启动。


    # 关于恢复历史文件的说明


    在创建新的 DB2 数据库时，一个名为恢复历史文件的特殊文件作为数据库创建过程的一部分被构建。该文件用于记录对与文件关联的数据库执行的特定操作的历史信息。具体而言，当执行以下任何操作时，都会向恢复历史文件写入记录：


    *   创建任何类型的备份映像。

    *   在数据库或其一个表空间上执行版本恢复操作。

    *   使用 Load 工具加载表。

    *   在数据库或其一个表空间上执行向前滚动恢复操作。

    *   更改了表空间。

    *   对表空间进行了静止处理（quiesced）。


