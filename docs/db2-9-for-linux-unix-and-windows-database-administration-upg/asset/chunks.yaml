  trans: '

    在实施行级 LBAC 解决方案之前，你必须对安全需求有彻底的理解。假设你有一个包含公司销售数据的数据库，并且你想控制高级执行人员、区域经理和销售代表访问名为
    `SALES` 的表中存储的数据。安全需求可能规定对这些数据的访问应遵循以下规则：


    * 高级执行人员允许查看但不能更新表中的所有记录。

    * 区域经理允许查看和更新仅由其汇报的销售代表录入的记录。

    * 销售代表允许查看和更新仅限其完成的销售记录。


    一旦确定了安全需求，你必须定义定义相应的安全策略和标签，创建受 LBAC 保护的表（或修改现有表以添加 LBAC 保护），并向适当的用户授予正确的安全标签。


    ## 定义安全标签组件


    安全标签组件代表了可能用于判断用户是否应该具有访问特定数据的标准。可以存在三种类型的安全标签组件：


    * ``set`（集合）是元素（字符字符串值）的汇集，其中每个元素的出现顺序并不重要。

    * ``array`（数组）是一个有序集合，可以表示简单的层级结构。在数组中，元素的出现顺序很重要——第一个元素的优先级高于第二个元素，第二个元素的优先级高于第三个，以此此类推。

    * ``tree`（树）表示更复杂的层级结构，可以有多个节点和分支。


    要创建安全标签组件，你需要执行以下 `CREATE SECURITY LABEL COMPONENT SQL` 语句之一：


    ![Image](img/183-1.jpg)


    或者


    ![Image](img/183-2.jpg)


    或者


    ![Image](img/183-3.jpg)


    其中：


    | `ComponentName` | 标识要分配给正在创建的安全标签组件的名称。 |

    | `StringConstant` | 标识一个或字符串常量值，这些值构成了所创建的安全标签组件将使用的有效数组、集合或树。 |


    因此，要创建一个名为 `SEC_COMP` 且包含顺序无关的值集合的安全标签组件，你将执行类似于下面的 `CREATE SECURITY LABEL COMPONENT`
    语句：


    ![Image](img/183-4.jpg)


    要创建一个包含从高到低顺序列出的值数组的安全标签组件，你将执行类似于下面的 `CREATE SECURITY LABEL COMPONENT` 语句：


    ![Image](img/183-5.jpg)


    而要创建一个包含描述公司组织图的值树的安全标签组件，你将执行类似于下面的 `CREATE SECURITY LABEL COMPONENT` 语句：


    ![Image](img/184-1.jpg)


    ## 定义安全策略


    安全策略确定了具体如何通过 LBAC 对表进行保护。具体而言，安全策略识别了以下内容：


    * 哪些安全标签组件将用于策略策略的安全标签中

    * 在比较安全标签组件时将使用哪些规则（目前仅支持一组规则：`DB2LBACRULES`）

    * 在访问受策略保护的数据时将使用哪些可选行为


    每个受 LBAC 保护的表都必须与一个（且仅一个）安全策略相关联。该表中的行和列只能用该安全策略的一部分的安全标签进行保护；所有对受保护数据的访问必须遵循该策略的规则。你可以在单个数据库中拥有多个安全策略，但对于任何给表，安全策略不能超过一个。


    要创建安全策略，请如下所示执行 `CREATE SECURITY POLICY` SQL 语句：


    ![Image](img/184-2.jpg)


    其中：


    | `PolicyName` | 标识要分配给正在创建的安全策略的名称。 |

    | `ComponentName` | 通过名称标识一个或多个作为正在创建的安全策略一部分的安全标签组件。 |


    `[OVERRIDE | RESTRICT] NOT AUTHORIZED WRITE SECURITY LABEL` 选项指定了当无授权写入通过 `INSERT`
    和 `UPDATE` 语句显式指定的安全标签的用户尝试向受保护的表写入数据时将采取的操作。默认情况下，在插入和更新操作期间，使用用户的安全标签值而不是显式指定的安全标签来执行写访问
    `(OVERRIDE NOT AUTHORIZED WRITE SECURITY LABEL)`。如果使用 `RESTRICT NOT AUTHORIZED
    WRITE SECURITY LABEL` 选项，如果用户没有权限向受保护的表写入显式指定的安全标签，则插入和更新操作将失败。


    因此，要创建一个基于之前创建的 `SEC_COMP` 安全标签组件的名为 `SEC_POLICY` 安全策略，你将执行类似于下面的 `CREATE SECURITY
    POLICY` 语句：


    ![Image](img/185.jpg)


    ## 定义安全标签


    安全标签描述了一组安全标准，用于保护数据免受未经授权的访问或修改。安全标签被授予允许访问或修改受保护数据的用户；当用户尝试访问或修改受保护的数据时，他们的安全标签将与保护数据的安全标签进行比较，以确定是否允许访问或修改。每个安全标签恰恰属于一个安全策略，并且对于安全策略中的每个安全标签组件必须存在一个安全标签。


    通过执行 `CREATE SECURITY LABEL` SQL 语句创建安全标签。该语句的语法为：


    ![Image](img/186-1.jpg)


    其中：


    | `LabelName` | 标识要分配给正在创建的安全标签的名称。指定的名称必须由安全策略名称限定，且不能与指定策略的现有安全标签匹配。 |

    | `ComponentName` | 通过名称标识作为 `LabelName` 参数限定符的指定安全策略一部分的安全标签组件。 |

    | `StringConstant` | 标识一个或字符串常量值，这些值是 `ComponentName` 参数指定的安全标签组件的有效元素。 |


    因此，为之前创建的名为 `SEC_POLICY` 安全策略创建一组安全标签，你将执行一组类似于下面的 `CREATE SECURITY LABEL` 语句：


    ![Image](img/186-2.jpg)


    ## 创建受 LBAC 保护的表


    一旦你定义了执行安全需求所需的安全策略和标签，就可以准备创建一个表并将其配置为 LBAC 保护了。要为新表配置行级 LBAC 保护，需要在表定义中包含一个数据类型为
    `DB2SECURITYLABEL` 的列，并使用 `CREATE TABLE` SQL 语句的 `SECURITY POLICY` 子句将安全策略与表关联。


    所以，要创建一个名为 `SALES` 的表并使用之前创建的名为 `SEC_POLICY` 的策略将其配置为行级 LBAC 保护，你将执行类似于下面的 `CREATE
    TABLE` 语句：


    ![Image](img/187-1.jpg)


    要为名为 `SALES` 的现有表配置名为 `SEC_POLICY` 的行级 LBAC 保护，你将执行类似于下面的 `ALTER TABLE` 语句：


    ![Image](img/187-2.jpg)


    然而，在执行此类 `ALTER TABLE` 语句之前，你必须被授予一个用于保护表的安全策略一部分的写访问安全标签（在本例中为 `SEC_POLICY`）。否则，你将无法创建
    `DB2SECURITYLABEL` 列。


    ## 向用户授予安全标签


