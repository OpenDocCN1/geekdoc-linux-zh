    正确答案是 **C.**。`AUTOCONFIGURE` 命令识别的关键字有：`mem_percent`、`workload_type`、`num_stmts`、`tpm`、`admin_priority`、`is_populated`、`num_local_apps`、`num_remote_apps`、`isolation`
    和 `bp_resizable`。


    # 问题 2


    正确答案是 **A.**。在 DB2 9 中，每当你使用创建向导创建数据库时，配置助手会自动调用。通过为注册变量 `DB2_ENABLE_AUTOCONFIG_DEFAULT`
    赋值 `NO` 可以更改此行为。（赋值给 `DB2_ENABLE_AUTOCONFIG_DEFAULT` 注册变量的值对 `AUTOCONFIGURE` 命令没有影响。）


    # 问题 3


    正确答案是 **D.**。每当通过配置助手划分远程数据库时，节点（服务器）通常会被隐式划分。然而，如果你想显式地划分（即为特定服务器在节点目录中添加条目），可以通过执行与访问被划分服务器将使用的通信协议相应的
    `CATALOG…NODE` 命令来实现。`CATALOG TCPIP NODE` 命令的语法为：


    ![Image](img/35.jpg)


    其中：


    | `NodeName` | 标识分配给被划分节点的别名。这是在用户工作站上创建的任意名称，用于标识节点。 |

    | `IPAddress` | 标识你尝试通信的远程数据库所在服务器的 IP 地址。 |

    | `HostName` | 标识 TCP/IP 网络已知的主机名。（这是你尝试通信的远程数据库所在服务器的名称。） |

    | `ServiceName` | 标识服务器上的 DB2 数据库管理器实例用于通信的服务名称。 |

    | `PortNumber` | 标识服务器上的 DB2 数据库管理器实例用于通信的端口号。 |

    | `InstanceName` | 标识要建立连接的服务器实例名称。 |

    | `SystemName` | 标识用于服务器工作站的 DB2 系统名称。 |

