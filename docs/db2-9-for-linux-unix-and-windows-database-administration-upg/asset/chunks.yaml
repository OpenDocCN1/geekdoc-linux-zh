    # Answers


    # Question 1


    The correct answer is **B.** The following new authentication types were introduced
    with DB2 9: `DATA_ENCRYPT`, `DATA_ENCRYPT_CMP`, `GSSPLUGIN`, and `GSS_SERVER_ENCRYPT`.


    # Question 2


    The correct answer is **A.** When the `GSSPLUGIN` authentication type is used,
    authentication occurs at the server workstation, using a Generic Security Service
    Application Program Interface (GSS-API) plug-in. If the client’s authentication
    type is not specified, the server returns a list of server-supported plug-ins
    (found in the `srvcon_gssplugin_list` database manager configuration parameter)
    to the client. The client then selects the first plug-in found in the client plug-in
    directory from the list. If the client does not support any plug-in in the list,
    the client is authenticated using the `KERBEROS` authentication method.


    # Question 3


    The correct answer is **C.** When the `DATA_ENCRYPT` authentication type is used,
    authentication occurs at the server workstation, using the `SERVER_ENCRYPT` authentication
    method. In addition, the following data is encrypted before it is passed from
    client to server and from server to client:


    * SQL and XQuery statements.

    * SQL program variable data.

    * Output data from the server processing of an SQL or XQuery statement and including
    a description of the data.

    * Some or all of the answer set data resulting from a query.

    * Large object (LOB) data streaming.

    * SQLDA descriptors.


    # Question 4


    The correct answer is **C.** When the `GSS_SERVER_ENCRYPT` authentication type
    is used, authentication occurs at the server workstation, using either the `GSSPLUGIN`
    or the `SERVER_ENCRYPT` authentication method. That is, if client authentication
    occurs through a GSS-API plug-in, the client is authenticated using the first
    client-supported plug-in found in the list of server-supported plug-ins. If the
    client does not support any of the plug-ins found in the server-supported plug-in
    list, the client is authenticated using the `KERBEROS` authentication method.
    If the client does not support the Kerberos security protocol, the client is authenticated
    using the `SERVER_ENCRYPT` authentication method.


    # Question 5


    The correct answer is **A.** To restrict access to rows in a table using Label-Based
    Access Control (LBAC), you must define a security label component, define a security
    policy, create one or more security labels, create an LBAC-protected table or
    alter an existing table to add LBAC protection (this is done by adding the security
    policy to the table and defining a column that has the `DB2SECURITYLABEL` data
    type), and grant the proper security labels to the appropriate users. There are
    no LBAC security profiles.


    # Question 6


    The correct answer is **A.** If you want the values of columns with a data type
    of `DB2SECURITYLABEL` to be displayed or exported in a human-readable form, you
    can use the `SECLABEL_TO_CHAR()` scalar function in a SELECT statement to convert
    the values to the security label string format.


    # Question 7


    The correct answer is **C.** Security Administrator (SECADM) authority is a special
    database level of authority that is designed to allow special users to configure
    various label-based access control (LBAC) elements to restrict access to one or
    more tables that contain data to which they most likely do not have access themselves.
    Users with Security Administrator authority are only allowed to perform the following
    tasks:


    * Create and drop security policies.

    * Create and drop security labels.

    * Grant and revoke security labels to/from individual users (using the `GRANT
    SECURITY LABEL` and `REVOKE SECURITY LABEL` SQL statements).

    * Grant and revoke LBAC rule exemptions.

    * Grant and revoke SETSESSIONUSER privileges (using the `GRANT SETSESSIONUSER`
    SQL statement).

    * Transfer ownership of any object not owned by the Security Administrator (by
    executing the `TRANSFER OWNERSHIP` SQL statement).


    No other authority provides a user with these abilities, including System Administrator
    authority.


    # Question 8


    The correct answer is **B.** When a user holds an exemption on an LBAC security
    policy rule, that rule is not enforced when the user attempts to read and/or write
    data that is protected by that security policy.


    Security policy exemptions are granted by executing the `GRANT EXEMPTION ON RULE`
    SQL statement (as a user with SECADM authority). The syntax for this statement
    is:


    ![Image](images/205-1.jpg)


    where:


    | `Rule` | Identifies one or more `DB2LBACRULES` security policy rules that exemptions
    are to be given for. The following values are valid for this parameter: `DB2LBACREADARRAY`,
    `DB2LBACREADSET`, `DB2LBACREADTREE`, `DB2LBACWRITEARRAY WRITEDOWN`, `DB2LBACWRITEARRAY
    WRITEUP`, `DB2LBACWRITESET`, `DB2LBACWRITETREE`, and `ALL`. (If an exemption is
    held for every security policy rule, the user will have complete access to all
    data protected by that security policy.) |


    | `PolicyName` | Identifies the security policy for which the exemption is to
    be granted. |


    | `UserName` | Identifies the name of the user to which the exemptions specified
    are to be granted. |

