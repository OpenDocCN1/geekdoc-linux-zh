    \ DB2 9 for Linux, UNIX, and Windows Database Administration Upgrade exam (Exam\
    \ 736). This chapter also explains what’s involved in the certification process.\n\
    \n*   Part 2 - DB2 9 Database Administration Concepts ([Chapters 2](#012_Chapter02.xhtml_ch-2)–[7](#017_Chapter07.xhtml_ch-7))\n\
    \n    This section consists of six chapters ([Chapters 2](#012_Chapter02.xhtml_ch-2)\
    \ through [7](#017_Chapter07.xhtml_ch-7)), which are designed to provide you with\
    \ the concepts you will need to master before you can pass the DB2 9 for Linux,\
    \ UNIX, and Windows Database Administration Upgrade exam (Exam 736).\n\n    [Chapter\
    \ 2](#012_Chapter02.xhtml_ch-2) is designed to introduce you to the various aspects\
    \ of server management. In this chapter, you will learn how to use the Configuration\
    \ Advisor to configure servers, instances, and databases, as well as how to configure\
    \ client communications. You will also learn how to configure a database for Automatic\
    \ Maintenance, how to use the Self-Tuning Memory Manager, and how to throttle\
    \ utilities to control their impact on database workloads.\n\n    [Chapter 3](#013_Chapter03.xhtml_ch-3)\
    \ is designed to teach you everything you need to know about how data in a DB2\
    \ 9 database is physically stored. In this chapter, you will learn how to create\
    \ a DB2 9 database and you will discover what a DB2 9 database’s underlying structure\
    \ looks like, as well as how that structure is mapped to files and directories.\
    \ You will also learn how to create Automatic Storage table spaces, how to partition\
    \ data with table (range) partitioning, and how to configure a table to use data\
    \ row compression.\n\n    Chapter 4 is designed to provide you with information\
    \ about creating databases and tables that support XML. In this chapter, you will\
    \ learn how to enable a database for XML data storage, how to use the XML data\
    \ type, how to manipulate XML data and create XML indexes, how to use basic XML\
    \ functions, and how to process XML data when using DB2’s data movement utilities.\n\
    \n    [Chapter 5](#015_Chapter05.xhtml_ch-5) is designed to introduce you to the\
    \ various tools that are available for monitoring a database’s performance. In\
    \ this chapter, you will learn how to configure and use the snapshot monitor and\
    \ how to create one or more event monitors. You will also learn how to use the\
    \ DB2 Problem Determination `Tool - db2pd.`\n\n    [Chapter 6](#016_Chapter06.xhtml_ch-6)\
    \ is designed to introduce you to the concept of database backup and recovery\
    \ and to the various tools available with DB2 9 that can be used to return a damaged\
    \ or corrupted database to a useable and consistent state. In this chapter, you\
