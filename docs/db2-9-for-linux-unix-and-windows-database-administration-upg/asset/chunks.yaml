    # 答案


    # 问题 1


    正确答案是 **C.** 当创建一个新的 DB2 9 数据库时，会创建三个表空间并与 `IBMDEFAULTBP` 缓冲池关联。这三个表空间如下：


    *   一个名为 `SYSCATSPACE` 的普通表空间，用于存储与数据库关联的系统目录表和视图

    *   一个名为 `USERSPACE1` 的普通表空间，用于存储所有用户定义对象（如表、索引等）以及用户数据、索引数据和长值数据

    *   一个名为 `TEMPSPACE1` 的系统临时表空间，作为数据排序、重新组织表和创建索引等操作的临时存储区域


    除非另有说明，`SYSCATSPACE` 和 `USERSPACE1` 将是 DMS 文件表空间，`TEMPSPACE1` 将是 SMS 表空间；每个表的特性可以作为输入提供
    `CREATE DATABASE` 命令或创建数据库向导。


    # 问题 2


    正确答案是 **D.** 每当创建一个新的 DB2 9 数据库时，默认都会启用以下功能：


    *   自动维护（数据库备份、表和索引重组、数据访问优化和统计分析）。

    *   自调优内存管理器（包缓存、锁定内存、排序内存、数据库共享内存和缓冲池内存）。

    *   实用程序节流

    *   健康监控器 (Health Monitor)


    # 问题 3


    正确答案是 **D.** 示例中使用的 `CREATE DATABASE` 命令语法可以分解为如下所示：


    ![Image](img/79.jpg)


    其中：


    | *DatabaseName* | 标识分配给要创建数据库的唯一名称。 |

    | *StoragePath* | 如果指定 `AUTOMATIC STORAGE YES`（默认值），则识别用于存放自动存储的表空间容器的一个或多个存储路径。否则，识别物理存储与要创建数据库相关的目录层次和文件的位置（驱动器和/或目录）。
    |

    | *DBPath* | 如果指定 `AUTOMATIC STORAGE YES`（默认值），则识别物理存储与要创建数据库相关的目录层次和元数据文件的位置（驱动器和/或目录）（如果未指定此参数并使用自动存储，元数据文件将存储在
    *StoragePath* 参数指定的第一个存储路径中）。 |

    | *CollateType* | 指定要创建的数据库使用的排序序列（即为了排序、合并和比较而对字符排序的顺序）。该参数的有效值有：COMPATABILITY,
    IDENTITY, IDENTITY_16BIT, UCA400_NO, UCA400_LSK, UCA400_LTH, NLSCHAR 和 SYSTEM。
    |

    | *TS_Definition* | 指定用于创建存储系统目录表 (SYSCATSPACE) 的表空间的定义。 |


