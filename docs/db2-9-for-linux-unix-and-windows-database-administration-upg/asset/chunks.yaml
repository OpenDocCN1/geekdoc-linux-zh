    ## Dedication


    To my sister, Kathy


    # Acknowledgments


    A project of this magnitude requires both a great deal of time and the support
    of many different individuals. I would like to express my gratitude to the following
    people for their contributions:


    **Susan Dykman - Information Management Certification Program Manager, IBM Information
    Management**


    Susan invited me to participate in the `DB2 9` exam development process, and provided
    me with screen shots of the `IBM Certification Exam Testing` software. Susan also
    also reviewed the first chapter of the book and provided valuable feedback.


    **Susan Visser - IBM Press, Data Management Program Manager IBM Toronto Lab**


    Once again, Susan’s help was invaluable; without her help, this book would not
    have been written. Susan paved the way for me to acquire the rights to the `Version
    8.1` manuscript and move to MC Press when Pearson Education decided not to publish
    an updated version of my `Version 8.1` book. Susan also reviewed many of the chapters
    as they were written, and she made sure the appropriate subject-matter experts
    at the `IBM Toronto Lab` reviewed portions of the manuscript as well.


    **Dr. Arvind Krishna - Vice President, IBM Data Servers and Worldwide Information
    Management Development**


    Dr. Krishna provided me with the Foreword for this book.


    **Reed M. Meseck - Senior Competitive Specialist, IBM Information Management Software**


    Reed helped Dr. Arvind Krishna develop the Foreword for this book.


    **Brant Davison - Program Director, IBM Information Management Software**


    Brant worked with me to ensure that Dr. Arvind Krishna received the materials
    he needed to develop the Foreword for this book.


    **Jason Gartner - Executive Assistant to Arvind Krishna**


    Jason worked with Reed Meseck and Dr. Arvind Krishna to make sure I received the
    Foreword for this book in a timely manner.


    **Rick Swagerman - Sr. Technical Manager, DB2 SQL and Catalog Development IBM
    Toronto Lab**


    Rick provided me with detailed examples illustrating how the `UPDATE/DELETE NO
    ACTION and UPDATE/DELETE RESTRICT` rules of referential constraints work. His
    examples were converted into some of the illustrations you see in [Chapter 4](#014_Chapter04.xhtml_ch-4),
    and Rick reviewed the final draft of many of these drawings for accuracy and completeness.


    **Dale McInnis - Sr. Technical Staff Member, DB2 High Availability IBM Toronto
    Lab**


    Dale reviewed the material in [Chapter 7](#017_Chapter07.xhtml_ch-7) - High Availability
    for accuracy and completeness; the valuable feedback he provided was I incorporated
    into the chapter.


    I would also like to thank my wife Beth for her help and encouragement, and for
    once again overlooking all of the things that did not get done while I worked
    on yet another (my 16^(th)) book.


    # About the Author


    Roger E. Sanders is the President of Roger Sanders Enterprises, Inc. He has been
    designing and developing database applications for more than 20 years and has
    been working with `DB2` and its predecessors since it was first introduced on
    the `IBM PC` (as part of `OS/2 Extended Edition`). He has written articles for
    publications such as *Certification Magazine* and *IDUG Solutions Journal,* authored
    tutorials for IBM’s developerWorks Web site, presented at numerous International
    DB2 User’s Group (IDUG) and Regional DB2 User’s Group (RUG) conferences, taught
    classes on `DB2` fundamentals and database administration (DB2 for Linux, UNIX,
    and Windows), writes a regular column called *Distributed DBA* in `DB2 Magazine`,
    and is the author of the following books:


    *   *DB2 9 for Linux, UNIX, and Windows Database Administration Certification
    Exam Study Guide*

    *   *Using the IBM System Storage N Series with Databases* (IBM RedBook; co-author)

    *   *DB2 9 Fundamentals Certification Study Guide*

    *   *Integrating IBM DB2 with the IBM System Storage N Series* (IBM RedBook; co-author)

    *   *Using IBM DB2UDB with IBM System Storage N Series* (IBM RedBook; co-author)

    *   *DB2 Universal Database V8.1 Certification Exam 703 Study Guide*

    *   *DB2 Universal Database V8.1 Certification Exam 701 and 706 Study Guide*

    *   *DB2 Universal Database V8.1 Certification Exam 700 Study Guide*

    *   *DB2 UDB Exploitation of NAS Technology* (IBM RedBook; co-author)

    *   *All-In-One DB2 Administration Exam Guide*

    *   *DB2 Universal Database SQL Developer’s Guide*

    *   *DB2 Universal Database API Developer’s Guide*

    *   *DB2 Universal Database Call Level Interface Developer’s Guide*

    *   *ODBC 3.5 Developer’s Guide*

    *   *The Developer’s Handbook to DB2 for Common Servers*


    In addition, Roger holds the following professional certifications:


    *   IBM Certified Advanced Database Administrator—DB2 9 for Linux, UNIX, and Windows

    *   IBM Certified Application Developer—DB2 9

    *   IBM Certified Database Administrator—DB2 9 DBA for Linux, UNIX, and Windows

    *   IBM Certified Database Associate—DB2 9 Fundamentals

    *   IBM Certified Advanced Database Administrator—DB2 Universal Database V8.1
    for Linux, UNIX, and Windows

    *   IBM Certified Database Administrator—DB2 Universal Database V8.1 for Linux,
    UNIX, and Windows

    *   IBM Certified Developer—DB2 Universal Database V8.1 Family

    *   IBM Certified Database Associate—DB2 Universal Database V8.1 Family

    *   IBM Certified Advanced Technical Expert—DB2 for Clusters

