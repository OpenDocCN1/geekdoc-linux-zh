    # **Question 2**


    The correct answer is **C.** To create tables with XML columns, you specify columns
    with the XML data type in the CREATE TABLE statement. (A table can have one or
    more XML columns.) Like an LOB column, an XML column holds only a descriptor of
    the column. The data itself is stored separately. Unlike an LOB column, you do
    not specify a length when you define an XML column. So to create a table named
    TAB1 that contains an XML column named C2, you would execute a CREATE TABLE statement
    that looks like this:


    ![Image](images/116-2.jpg)


    When included in a table definition, XML columns have the following restrictions:


    *   They cannot have a default value specified by the WITH DEFAULT clause.


    *   They cannot be referenced in CHECK constraints (except for a VALIDATED predicate).


    *   They cannot be referenced in generated columns.


    *   They cannot be included as columns of keys, including primary, foreign, and
    unique keys; dimension keys of multidimensional clustering (MDC) tables; sequence
    keys of range-clustered tables; distribution keys; and data-partitioning keys.


    *   They cannot be used in a table that has a distribution key


    # **Question 3**


    The correct answer is **B.** Just as an index over relational data can be used
    to improve query performance, an index over XML data can be used to improve the
    efficiency of queries on XML documents that are stored in an XML column. In contrast
    to traditional relational indexes, where index keys are composed of one or more
    columns you specify, an index over XML data uses a particular XML pattern expression
    to index paths and values found in XML documents stored in a single column—the
    data type of that column must be XML. All or part of the contents of an XML column
    can be indexed.


    # **Question 4**


    The correct answer is **C.** When the documents specified are inserted into the
    CUSTINFO column of the CUSTOMER table, the values 27603 and 29501 will be added
    to the CUST_ZIP_IDX index and the value “Raleigh” will be added to the CUST_CITY_IDX
    index.


    # **Question 5**


    The correct answer is **C.** The XMLPARSE() function is designed to convert a
    character string value into a well-formed XML document. The XMLSERIALIZE() function
    is designed to convert a well-formed XML document into a character string; the
    XMLCAST() function is designed to support conversions between non-XML data types
    and the XML data type; and the XMLTEXT() function is designed to convert a character
    string value to an XML value with a single XQuery text node.


    # **Question 6**


    The correct answer is **A.** The XMLSERIALIZE() function is designed to convert
    a well-formed XML document into a character string. The XMLCAST() function is
    designed to support conversions between non-XML data types and the XML data type;
    the XMLPARSE() function is designed to convert a character string value into a
    well-formed XML document; and the XMLTEXT() function is designed to convert a
    character string value to an XML value with a single XQuery text node.


    # **Question 7**


    The correct answer is **B.** When exporting XML data, all QDM (XQuery Data Model)
    instances found are written to one or more files that are separate from the main
    data file containing exported relational data (but in the same location). This
    is true even if neither the XMLFILE nor the XML TO option is specified. By default,
    exported QDM instances are concatenated together in a single file; you can use
    the *xmlinsepfiles* file type modifier to specify that each QDM instance be written
    to a separate file (which is assigned a name that either you or the Export utility
    provides).


    # **Question 8**


    The correct answers are **B** and **C.** The -xs option of the db2look command
    is used to indicate that all files necessary to register XML schemas and Document
    Type Definitions (DTDs) at the target database are to be exported and appropriate
    commands for registering them are to be generated. The -xdir *[DirectoryName]*
    option is used to identify the location where XML-related files are to be written
    to. If this option is not specified, all XML-related files will be exported into
    the current directory.


