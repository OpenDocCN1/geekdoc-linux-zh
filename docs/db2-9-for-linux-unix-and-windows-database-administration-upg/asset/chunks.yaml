    因为需要离线重组操作来构建压缩字典并执行数据压缩，压缩数据所需的初始开销可能相当。因此，了解哪些表将从数据行压缩中受益最多，以及哪些表不会受益将是有益的。在
    DB2 9 中，Inspect 工具可以帮助你做出这种判断。通过执行 `INSPECT` 命令可以调用 Inspect 工具，如果在执行此命令时指定了 `ROWCOMPESTIMATE`
    选项，Inspect 工具将检查指定表中的每一行，从发现的数据构建压缩字典，然后使用该字典估计如果压缩表中的数据，将节省多少空间。


    # 问题 14


    正确答案是 **B.** 通过通过执行离线表重组操作来构建压缩字典（并压缩表中的数据）；此类操作通过执行指定了 `KEEPDICTIONARY` 或 `RESETDICTIONARY`
    选项的 `REORG` 命令启动。如果执行 `REORG` 命令时指定了任一选项且不存在压缩字典，则将构建新字典；如果执行 `REORG` 命令时指定了任一选项且已存在字典，则表中的数据将被重组/压缩，且现有字典将被重建（`RESETDICTIONARY`）或保持不变（`KEEPDICTIONARY`）。


    # 第 4 章


    ## XML 概念


    百分之十三 (13%) 的 DB2 9 Linux、Unix 和 Windows 数据库管理升级考试（考试 736）旨在测试你在 DB2 9 数据库中存储和操作
    XML 数据的知识。构成此部分的题目旨在评估以下内容：


    *   你使用新的 XML 数据类型的能力

    *   你对 XQuery 基础知识的掌握

    *   你创建和管理 XML 索引的能力

    *   你使用基本 XML 函数（如 `XMLPARSE()`、`XMLSERIALIZE()`、`XMLVALIDATE()` 和 `XMLQUERY()`）的能力

    *   处理 XML 数据时使用 DB2 数据移动工具的知识


    本章旨在向你介绍 XML 以及可用的 XML 函数，并引导你构建简单的 XQuery 表达式。本章还旨在向你展示如何创建 XML 索引，以及如何使用 DB2
    数据移动工具来处理 XML 数据。


    ## 处理 XML 数据


    DB2 9 的 pureXML 技术通过提供简单高效的 XML 访问，释放了 XML 的潜能，同时提供了与关系型数据同水平的安全性、完整性和恢复能力。这些
    pureXML 技术作为 DB2 Express Edition、DB2 Workgroup Server Edition 和 DB2 Enterprise
    Server Edition 的附加功能可用；然而，它是 DB2 Express-C 的一部分，且 pureXML 的包含在基础 DB2 Express-C
    许可中。通过 pureXML，XML 数据存储在层次结构中，这种结构自然反映了 XML 文档的结构。这种结构结合创新的索引技术，允许 DB2 高效管理 XML
    数据，同时消除了在关系数据库中存储 XML 数据所需的复杂且耗时的解析。然而，在使用 pureXML 时存在限制：


    *   pureXML 只能用于单分区数据库。

    *   使用任何 pureXML 功能都将防止未来使用 DB2 Enterprise Server Edition (ESE) 中的数据库分区功能 (DPF)。

    *   pureXML 不能用于 DB2 Data Warehouse Edition (DWE)，因为 DWE 使用 DB2 ESE 和 DPF。


    为了利用 pureXML 功能，必须使用 UTF-8 字符集创建数据库。UTF-8 字符集通过 `CREATE DATABASE` 命令的 `USING CODESET`
    选项指定；要创建一个名为 `XML_DB` 的使用 UTF-8 字符集的数据库，你必须执行类似于下面的 `CREATE DATABASE` 命令：


    ![Image](img/88-1.jpg)


    ## XML 数据类型和 XML 列


    为了支持 pureXML，DB2 9 引入了一种名为 `XML` 的新数据类型。该数据类型用于定义存储 XML 值的列。存储的每个 XML 值必须是良好的
    XML 文档；良好的 XML 文档看起来如下：


    ![Image](img/88-2.jpg)


    ![Image](img/89-1.jpg)


    XML 文档以 XML 声明开始；XML 声明看起来如下：


    ![Image](img/89-2.jpg)


    或


    ![Image](img/89-3.jpg)


    XML 声明之后是一个一个或多个属性和元素。所有的 XML 元素都包含在起始和结束标签中；XML 元素看起来如下：


    ![Image](img/89-4.jpg)


    需要注意的是，使用的起始和结束标签对大小写敏感——标签 `<Letter>` 与标签 `<letter>` 不同。因此，起始和结束标签必须以相同的大小写。


    XML 属性通常用于描述 XML 元素或提供元素的附加信息。属性始终包含在元素的起始标签内，且属性值必须始终引用。以下是一些示例：


    ![Image](img/89-5.jpg)


    属性在 HTML 中非常方便，但在 XML 中，每当可以使用元素表达相同信息时，你应该尽量避免使用属性。以下示例传递了相同的信息：


    ![Image](img/89-6.jpg)


    ![Image](img/90-1.jpg)


    在第一个示例中，`SEX` 是一个属性。在最后一个示例中 `SEX` 是一个元素。


    要创建带有 XML 列的表，你需要在 `CREATE TABLE` 语句中指定 `XML` 数据类型的列。（表可以有一个或多个 XML 列。）像 LOB 列一样，XML
    列只持有列的描述符。数据本身被单独存储。与 LOB 列不同，你可以在定义 XML 列时不需要指定长度。因此，要创建一个名为 `CUSTOMER` 包含名为
    `CUSTINFO` 的 XML 列的表，你需要执行类似于下面的 `CREATE TABLE` 语句：


    ![Image](img/90-2.jpg)


    XML 列具有以下限制：


    *   它们不能通过 `WITH DEFAULT` 子句指定默认值；如果列允许为空，则该列的默认值为 `NULL`。

    *   它们不能在 `CHECK` 约束中引用（`VALIDATED` 谓词除外）。

    *   它们不能在生成列中引用。

    *   它们不能包含在类型表和类型视图中。

    *   它们不能用于范围聚类表 (RCT)。

    *   它们不能用于范围分区表。

    *   它们不能用于多维聚类 (MDC) 表。

    *   它们不能被添加到定义了 Type-1 索引的表中（注意 Type-1 索引是已弃弃的索引；自 DB2 UDB 版本 8.1 以来创建的索引都是 Type-2
    索引）。

    *   它们不能在滚动光标的选择列表中指定。

    *   它们不能在 `CREATE TRIGGER` 语句的触发操作中引用。

    *   它们不能作为键的列，包括主键、外键和唯一键；多维聚类 (MDC) 表的维度键；范围聚类表的序列键；分布键；数据分区键。

    *   它们不能用于带有分布键的表。

    *   除了 XML 数据的索引外，它们不能是任何索引的一部分。

    *   在检索 XML 数据时，它们会导致禁用数据阻塞。

    *   它们不能使用数据行压缩压缩。


    ## 操作 XML 数据


