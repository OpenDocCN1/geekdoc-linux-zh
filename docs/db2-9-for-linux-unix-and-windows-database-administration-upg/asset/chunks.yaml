    have been defined, and a table has been enabled for LBAC-protection, you must
    grant the proper security labels to the appropriate users and indicate whether
    they are to have read access, write access, or full access to data that is protected
    by that label. Security labels are granted to users by executing a special form
    of the `GRANT` SQL statement. The syntax for this form of the `GRANT` statement
    is:


    ![Image](images/188-1.jpg)


    where:


    | `LabelName` | Identifies the name of an existing security label. The name specified
    must be qualified with the security policy name that was used when the security
    label was created. |

    | `UserName` | Identifies the name of the user to which the security label is
    to be granted. |


    Thus, to give a user named `USER1` the ability to read data protected by the security
    label `SEC_POLICY.EXEC_STAFF,` you would execute a `GRANT` statement that looks
    like this:


    ![Image](images/188-2.jpg)


    # Putting row-level LBAC into action


    To enforce the security requirements listed earlier, we must first give users
    the ability to perform DML operations against the `SALES` table by executing the
    following `GRANT` statements, as a user with `SYSADM` or `DBADM` authority:


    ![Image](images/188-3.jpg)


    Next, we must grant the proper security labels to the appropriate users and indicate
    whether they are to have read access, write access, or full access to data that
    is protected by that label. This is done by executing the following `GRANT` statements,
    this time as a user with `SECADM` authority:


    ![Image](images/189-1.jpg)


    Now, suppose user `SALES_REP1` adds three rows to the `SALES` table by executing
    the following SQL statements:


    ![Image](images/189-2.jpg)


    `SALES_REP1` has been given read/write access to the table using the `SEC_POLICY.SALES_REP1`
    security label, so the statements execute successfully. Next, user `SALES_REP2`
    adds two additional rows to the `SALES` table by executing the following SQL statements:


    ![Image](images/190.jpg)


    Because `SALES_REP2` has also been given read/write access to the table using
    the `SEC_POLICY.SALES_REP2` security label, the rows are successfully inserted.


    Now, when user `EXEC_STAFF` queries the `SALES` table, all five records entered
    will appear (because the security label `SEC_POLICY.EXEC_STAFF` is the highest
    level in the security policy’s security label component tree). However, if user
    `EXEC_STAFF` attempts to insert additional records or update an existing record,
    an error will be generated because user `EXEC_STAFF` is allowed only to read the
    data (only read access was granted).


    When user `N_MANAGER` queries the table, only records entered by the user `SALES_REP1`
    will be displayed; the user `W_MANAGER` will see only records entered by the user
    `SALES_REP2;` and the users `E_MANAGER`, `S_MANAGER,` and `C_MANAGER` will not
    see any records at all. (`SALES_REP1` reports to `N_MANAGER`, `SALES_REP2` reports
    to `W_MANAGER;` no other managers have a sales representative reporting to them.)


    And finally, when `SALES_REP1` or `SALES_REP2` queries the `SALES` table, they
    will see only the records they personally entered. Likewise, they can update only
    the records they entered.


    ![Image](images/paper.jpg) If you want to retrieve values stored in a `DB2SECURITYLABEL`
    column and display them in a human-readable format, you can do so by using the
    `SECLABEL_TO_CHAR()` scalar function in a `SELECT` statement - provided you have
    the LBAC credentials needed to see the row. Thus, if user `EXEC_STAFF` executes
    the following query:


    ```

    SELECT sales_rec_id, sec_label, SECLABEL_TO_CHAR(‘SEC_POLICY’, sec_label) AS s_l2
    FROM corp. sales

    ```

    The following results will be returned: SALES_REC_ID SEC_LABEL S_L2


    ![Image](images/191.jpg)


    # Implementing Column-Level LBAC


    To illustrate how column-level LBAC is employed, let’s assume you want to control
    how Human Resources (HR) staff members, managers, and employees are going to access
    data stored in a table named `EMPLOYEES.` For this scenario, the security requirements
    are as follows:


