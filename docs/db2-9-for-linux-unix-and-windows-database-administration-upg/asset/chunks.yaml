    *Figure 6–1: The transaction logging process.*


    Since log records are externalized frequently and because changes made by a particular
    transaction are only externalized to the database when the transaction itself
    is successfully terminated, the ability to return a database to a consistent state
    after a failure occurs is guaranteed—when the database is restarted, log records
    are analyzed, and each record that has a corresponding `COMMIT` record is reapplied
    to the database; every record that does not have a corresponding `COMMIT` record
    is either ignored or backed out (which is why “before” and “after” information
    is recorded for all update operations).


    # **Database Recovery Concepts**


    Over time, a database can encounter any number of problems, including power interruptions,
    storage media failure, and application abends. All of these can result in database
    failure, and each failure scenario requires a different recovery action.


    The concept of backing up a database is the same as that of backing up any other
    set of data files: you make a copy of the data and store it on a different medium
    where it can be accessed in the event the original becomes damaged or destroyed.
    The simplest way to back up a database is to shut it down to ensure that no further
    transactions are processed and then back it up using the Backup utility provided
    with DB2\. Once a backup image has been created, you can use it to rebuild the
    database later if for some reason it becomes damaged or corrupted.


    The process of rebuilding a database is known as recovery, and three types of
    recovery are available with DB2:


    *   Crash recovery


    *   Version recovery


    *   Roll-forward recovery


    # ***Crash Recovery***


    Crash recovery is performed by using information stored in the transaction log
    files to complete any committed transactions that were in memory (but had not
    yet been externalized to storage) when the transaction failure occurred, roll
    back any incomplete transactions found, and purge any uncommitted transactions
    from memory. Once a database is returned to a consistent and usable state, it
    has attained what is known as a “point of consistency.” Crash recovery is illustrated
    in [Figure 6–2](#016_Chapter06.xhtml_img6_2).


    ![Image](images/155.jpg)


    *Figure 6–2: Crash recovery.*


    A crash recovery operation is initiated by executing the `RESTART DATABASE` command.


    # ***Version Recovery***


    Version recovery is the process used to return a database to the state it was
    in at the time a particular backup image was made. Version recovery is performed
    by replacing the current version of a database with a previous version, using
    a copy that was made with a backup operation—the entire database is rebuilt using
    a backup image that was created earlier. Unfortunately, when a version recovery
    is performed, all changes made to the database since the backup image used was
    created are lost. Version recovery is illustrated in [Figure 6–3](#016_Chapter06.xhtml_img6_3).


    ![Image](images/156.jpg)


    *Figure 6–3: Version recovery.*


    A version recovery operation is initiated by executing the `RESTORE DATABASE`
    command; database backup images needed for version recovery operations are generated
    by executing the `BACKUP DATABASE` command.


    # ***Roll-Forward Recovery***


    Roll-forward recovery takes version recovery one step farther by rebuilding a
    database or one or more individual table spaces using a backup image and replaying
    information stored in transaction log files to return the database/table spaces
    to the state they were in at an exact point in time. In order to perform a roll-forward
    recovery operation, you must have archival logging enabled, you must have either
    a full backup image of the database or a complete set of table space backup images
    available, and you must have access to all archived log files that have been created
    since the backup image(s) were made. Roll-forward recovery is illustrated in Figure
    6—4.


    ![Image](images/157.jpg)


    *Figure 6–4: Roll-forward recovery.*


    A roll-forward recovery operation is initiated by executing the `ROLLFORWARD DATABASE`
    command.


    # ***A Word About the Recovery History File***


    When a new DB2 database is created, a special file known as the recovery history
    file is built as part of the database creation process. This file is used to log
    historical information about specific actions that are performed against the database
    with which the file is associated. Specifically, records are written to the recovery
    history file whenever any of the following actions are performed:


    *   A backup image of any type is created.


    *   A version recovery operation is performed either on the database or on one
    of its table spaces.


    *   A table is loaded, using the Load utility.


    *   A roll-forward recovery operation is performed either on the database or on
    one of its table spaces.


    *   A table space is altered.


    *   A table space is quiesced.'
