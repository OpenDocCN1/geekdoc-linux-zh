    ### Answers


    # Foreword


    We live in a world of information. But how did we get here? We started with the
    goal of reaching the moon, and conquering the task of moving data between a tiny
    spacecraft and the earth, and then storing that data in a reliable and quickly
    accessible way.


    We developed new technologies, new systems, and new software to transmit, process,
    and store that data. Today, we live in an era where processing power continues
    to soar, and where the sky is the limit for storage capacity. The result has been
    an unprecedented flood of data.


    Today, the goal is not just storing data, but providing ubiquitous access to information.
    We live in a world of information, and increasingly we expect our world to be
    an On Demand world: always on, always available, where information is increasingly
    rich and dynamic, immediate and instantaneous.


    We access information with our laptops, our cell phones, our Blackberrys—at our
    desks and on the road. Increasingly your success is dependent upon your ability
    to easily access and connect that information across the organization and across
    the globe.


    IBM’s goal is to help our customers and partners transform from data and information
    management to Information On Demand. Information On Demand is about getting the
    right information to the right people, at the right time, in the right context.


    Today, the greatest competitive advantages are often gained from uncovering data
    you already have and connecting it easily, seamlessly and ubiquitously: Information
    as a Service. Only IBM has the vision and the breadth of products and services
    to make this vision a reality and `DB2` is the Data Server for your On Demand
    world.


    Data servers are a critical element of your IT foundation, and `DB2` is the Data
    Server of choice for customers running a broad spectrum of applications, from
    On-Line Transaction Processing to Data Warehousing, from Web Services to Analytics,
    from small to extreme data volume. From the no-charge `DB2 Express-C` to advanced
    capabilities for transactional and dynamic warehousing applications, IBM offers
    the right data server for the job.


    Today, `DB2` runs in the top 25 banks worldwide, 23 of the top 25 U.S. retailers,
    and 9 of the top 10 global life and health insurance providers. `DB2` is the choice
    of a growing number of ISVs and customers running ISV applications such as `SAP`.
    Last year alone, over 4,500 new customers chose `DB2` to run their businesses.
    And with the delivery of `DB2 9`, we are seeing that growth accelerate. We now
    have over 450,000 customers using IBM Data Servers to run their businesses across
    industries and across the globe.


    `DB2` is the only data server that consistently delivers leading performance in
    TPC-C, TPC-H and SAP application benchmarks. But more importantly, DB2 continues
    to deliver reliability and security for your business.


    `DB2 9` provides another proof point of what makes IBM different-from the invention
    of database technology in 1966 to support the Apollo space program; to the invention
    of the relational data model in 70s; to the 68 patented innovations in `DB2 9`,
    to the more than 3,000 data management patents—IBM continues to lead in innovations
    that help our clients deliver business results.


    Information is the fabric of global businesses, and data server professionals
    will continue to be critical to the delivery, management, and governance of this
    corporate asset. Roger Sanders has provided a tremendous opportunity to learn
    more about `DB2`, and I encourage you to take advantage this opportunity and learn
    skills you can leverage to deliver more value to your business. Your time spent
    will be valuable to you and your colleagues.


    Arvind Krishna

    IBM Corporation

    Vice President Development


    # Preface


    One of the biggest challenges computer professionals face today is keeping their
    skill sets current with the latest changes in technology. When the computing industry
    was in its infancy, it was possible to become an expert in several different areas,
    because the scope of the field was relatively small. Today, our industry is both
    widespread and fast paced, and the skills needed to master a single software package
    can be quite complex. Because of this complexity, many application and hardware
    vendors have initiated certification programs to evaluate and validate an individual’s
    knowledge of their technology. Businesses benefit from these programs, because
    professional certification gives them confidence that an individual has the expertise
    needed to perform a specific job. Computer professionals benefit, because professional
    certification allows them to deliver high levels of service and technical expertise,
    and more importantly, professional certification can lead to advancement and/or
    new job opportunities within the computer industry.

