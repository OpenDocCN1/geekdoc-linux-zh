    # Range-Partitioned Tables


    Although table spaces are used to control where data is physically stored and
    to provide a layer of indirection between database objects (such as tables, indexes,
    and views) and one or more containers (i.e., directories, files, or raw devices)
    in which the object’s data actually resides, how database objects are assigned
    to table spaces when they are created determines how data is physically stored
    on disk. The physical storage of table data can be controlled even further by
    taking advantage of a new feature introduced in DB2 9 known as table partitioning.


    Table partitioning (also referred to as range partitioning) is a data organization
    scheme in which table data is divided across multiple storage objects called data
    partitions or ranges based on values in one or more columns. Each data partition
    is stored separately, and the storage objects used can be in different table spaces,
    in the same table space, or a combination of the two. Table partitioning improves
    performance and eliminates the need to create a partitioned database using the
    Data Partitioning Feature.


    Other advantages of using table partitioning include:


    **Easy roll-in and roll-out of data.** Rolling in partitioned table data allows
    a new range to be easily incorporated into a partitioned table as an additional
    data partition. Rolling out partitioned table data allows you to easily separate
    ranges of data from a partitioned table for subsequent purging or archiving. Data
    can be quickly rolled in and out by using the `ATTACH PARTITION` and `DETACH PARTITION`
    clauses of the `ALTER TABLE` statement; once rolled in, newly attached data partitions
    are brought online by executing the `SET INTEGRITY` statement.


    **Easier administration of large tables.** Table-level administration becomes
    more flexible because administrative tasks can be performed on individual data
    partitions. Such tasks include detaching and reattaching of a data partition,
    backing up and restoring individual data partitions, and reorganizing individual
    indexes. In addition, time-consuming maintenance operations can be shortened by
    breaking them down into a series of smaller operations. For example, backup operations
    can be performed at the data-partition level when each data partition is placed
