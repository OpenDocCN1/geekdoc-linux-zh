    Upgrade exam (Exam 736) is designed to test your ability to use the database monitoring
    tools that are available with DB2\. The questions that make up this portion of
    the exam are intended to evaluate the following:


    *   Your ability to use the snapshot monitor functions and administrative routines
    available with DB2 9'
