    The default location of the services file depends on the operating system being
    used: on UNIX-based systems, the services file is located in: `/etc/services;`
    on Windows servers, the services file is located in `%SystemRoot%\system32\drivers\etc.`.
    An entry in the services file for a DB2 database server might look something like
    this:


    ![Image](images/17-3.jpg)


    # Cataloging and Uncataloging a Node


    Nodes (servers) are usually cataloged implicitly whenever a remote database is
    cataloged via the Configuration Assistant. However, if you want to explicitly
    catalog a node (i.e., add an entry to the node directory for a particular server),
    you can do so by executing a `CATALOG…NODE` command that corresponds to the communications
    protocol that will be used to access the server being cataloged. Several forms
    of the `CATALOG…NODE` command are available, including the following:


    * `CATALOG LOCAL NODE`

    * `CATALOG LDAP NODE`

    * `CATALOG NAMED PIPE NODE`

    * `CATALOG TCPIP NODE`


    The syntax for all of these commands is very similar, the major difference being
    that many of the options available with each are specific to the communications
    protocol for which the command has been tailored. Because TCP/IP is probably the
    most common communications protocol in use today, let’s take a look at the syntax
    for that form of the `CATALOG…NODE` command.


    The syntax for the `CATALOG TCPIP NODE` command is:


    ![Image](images/18.jpg)


    where:


    | `NodeName` | Identifies the alias to be assigned to the node to be cataloged.
    This is an arbitrary name created on the user’s workstation and is used to identify
    the node. |

    | `IPAddress` | Identifies the IP address of the server where the remote database
    you are trying to communicate with resides. |

    | `HostName` | Identifies the host name, as it is known to the TCP/IP network.
    (This is the name of the server where the remote database you are trying to communicate
    with resides.) |

    | `ServiceName` | Identifies the name of the service with which the DB2 Database
    Manager instance on the server uses to communicate. |

    | `PortNumber` | Identifies the port number with which the DB2 Database Manager
    instance on the server uses to communicate. |

    | `InstanceName` | Identifies the name of the server instance to which an attachment
    is to be made. |

    | `SystemName` | Identifies the DB2 system name that is used to identify the server
    workstation. |

    | `SystemType` | Identifies the type of operating system being used on the server
    workstation. The following values are valid for this parameter: `AIX, WIN, HPUX,
    SUN, OS390, OS400, VM, VSE,` and `LINUX`. |

    | `Description` | A comment used to describe the node entry that will be made
    in the node directory for the node being cataloged. The description must be enclosed
    by double quotation marks. |


    Thus, if you wanted to catalog a node for an AIX server named `DB2HOST` that has
    a DB2 instance named `DB2INST1` that listens on port 60000 and assign it the alias
    `RMT_SERVER,` you could do so by executing a `CATALOG TCPIP NODE` command that
    looks something like this:


    ![Image](images/19.jpg)


    On the other hand, if you wanted to catalog a node for a Linux server that has
    the IPv6 address 1080:0:0:0:8:800:200C:417A and a DB2 instance named `DB2INST1`
    that is listening on port 60000 and assign it the alias `IPV6_SERVER,` you could
    do so by executing a `CATALOG TCPIP NODE` command that looks something like this:


    ![Image](images/20.jpg)


    # Automatic Maintenance


    Although the Task Center can be used to schedule routine maintenance operations,
    in some cases it can be time-consuming to determine whether and when to run some
    of the more resource-intensive maintenance utilities available. With automatic
    maintenance (a new feature introduced in DB2 9), you specify your maintenance
    objectives, and the DB2 Database Manager will use the objectives you have identified
    to determine whether one or more maintenance activities need to be performed.
    If it is determined that a maintenance operation is required, that operation will
    be carried out during the next available maintenance window (a maintenance window
    is a time period, specified by you, in which all automatic maintenance activities
    are to be performed).


    Automatic maintenance can be used to perform the following maintenance operations:


    * **Create a backup image of the database.** Automatic database backup provides
    users with a solution to help ensure their database is being backed up both properly
    and regularly, without their having to worry about when to back up or having any
    knowledge of the syntax for the `BACKUP` command.

    * **Data defragmentation (table or index reorganization).** This maintenance activity
    can increase the efficiency with which the DB2 Database Manager accesses tables.
    Automatic reorganization manages offline table and index reorganization without
    users having to worry about when and how to reorganize their data.

    * **Data access optimization (running RUNSTATS).** The DB2 Database Manager updates
    the system catalog statistics on the data in a table, the data in a table’s indexes,
    or the data in both a table and its indexes. The DB2 Optimizer uses these statistics
    to determine which path to use to access data in response to a query. Automatic
    statistics collection attempts to improve the performance of the database by maintaining
    up-to-date table statistics. The goal is to allow the DB2 Optimizer to always
    choose an access plan based on accurate statistics.

    * **Statistics profiling.** Automatic statistics profiling advises when and how
    to collect table statistics by detecting outdated, missing, and incorrectly specified
    statistics and by generating statistical profiles based on query feedback.


    When a DB2 9 database is created, automatic maintenance is enabled by default;
    enablement of individual automatic maintenance features is controlled using various
    automatic maintenance-specific database configuration parameters. [Table 2.2](#012_Chapter02.xhtml_tab2_2)
    lists the automatic maintenance-specific database configuration parameters available.


    | Table 2.2 DB2 Automatic Maintenance-Specific Database Configuration Parameters
    | | |

    | **Parameter** | **Value Range / Default** | **Description** |

    | `auto_maint` | ON, OFF Default: ON | Enables or disables automatic maintenance
    for the database. This is the parent of all the other automatic maintenance database
    configuration parameters (`*`auto_db_backup`, `auto_tbl_maint`, `auto_runstats`,
    `auto_stats_prof`, `auto_prof_upd`, and `auto_reorg`). When this parameter is
    disabled, all of its children parameters are also disabled, but their settings,
    as recorded in the database configuration file, do not change. When this parent
    parameter is enabled, recorded values for its children parameters take effect.
    |

    | `auto_db_backup` | ON, OFF Default: ON | Enables or disables automatic backup
    operations for the database. |

    | `auto_tbl_maint` | ON, OFF Default: ON | Enables or disables automatic table
    maintenance operations for the database. This parameter is the parent of all table
    maintenance parameters (`*`auto_runstats, `auto_stats_prof`, `auto_prof_upd`,
    and `auto_reorg`). When this parameter is disabled, all of its children parameters
    are also disabled, but their settings, as recorded in the database configuration
    file, do not change. When this parent parameter is enabled, recorded values for
    its children parameters take effect. |

    | `auto_runstats` | ON, OFF Default: ON | Enables or disables automatic table
    RUNSTATS operations for the database. |

    | `auto_stats_prof` | ON, OFF Default: ON | Enables or disables automatic statistical
    profile generation for the database. |

    | `auto_prof_upd` | ON, OFF Default: ON | Enables or disables automatic runstats
    profile updating for the database. |

    | `auto_reorg` | ON, OFF Default: ON | Enables or disables automatic table and
    index reorganization for the database. |

