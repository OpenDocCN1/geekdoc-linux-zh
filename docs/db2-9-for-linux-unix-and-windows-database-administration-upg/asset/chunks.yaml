    together in the same file. | Delimited ASCII (DEL), Worksheet Format (WSF), and
    PC Integrated Exchange Format (IXF) |

    | `xmlnodeclaration` | Indicates that XML documents are to be written without
    an XML declaration tag. By default, XML documents are exported with an XML declaration
    tag at the beginning that includes an encoding attribute. | Delimited ASCII (DEL),
    Worksheet Format (WSF), and PC Integrated Exchange Format (IXF) |

    | `xmlchar` | Indicates that XML documents are to be written using the character
    code page. (The character code page is the value specified by the `codepage` modifier,
    or the application code page if this modifier is not specified.) By default, XML
    documents are written in Unicode. | Delimited ASCII (DEL), Worksheet Format (WSF),
    and PC Integrated Exchange Format (IXF) |

    | `xmlgraphic` | Indicates that XML documents are to be encoded and written in
    the UTF-16 code page, regardless of the application code page or character code
    page specified with the `codepage` modifier. | Delimited ASCII (DEL), Worksheet
    Format (WSF), and PC Integrated Exchange Format (IXF) |


