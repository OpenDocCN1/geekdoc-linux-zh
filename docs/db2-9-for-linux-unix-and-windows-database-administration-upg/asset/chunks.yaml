    | 选项 | 含义 |

    | :--- | :--- |

    | `-version` | `-v` | 指定收集并显示已安装 DB2 产品的当前版本和服务级别。 |

    | `-inst` | 指定收集并显示所有可用的实例级信息。 |

    | `-alldatabases` | `-alldbs` | 指定让实用程序连接到所有可用数据库的所有内存集。 |

    | `-full` | 指定将所有输出扩展到其最大长度。（如果未指定此选项，输出将会被截断以节省显示空间。） |

    | `-everything` | 指定使用所有选项，并对本地服务器上所有数据库分区服务器的所有数据库收集并显示信息。 |

    | `-hadr` | 指定收集并显示关于高可用性灾难恢复（HADR）的信息。 |

    | `-utilities` | 指定收集并显示关于实用的信息。 |

    | `-applications` | 指定收集并显示关于应用程序的信息。 |

    | `-agents` | 指定收集并显示关于代理的信息。 |

    | `-transactions` | 指定收集并显示活动事务的信息。 |

    | `-bufferpools` | 指定收集并显示关于缓冲区池的信息。 |

    | `-logs` | 指定收集并显示关于事务日志文件的信息。 |

    | `-locks` | 指定收集并显示关于锁的信息。 |

    | `-tablespaces` | 指定收集并显示关于表空间的信息。 |

    | `-dynamic` | 指定收集并显示关于动态 SQL 语句执行的信息。 |

    | `-static` | 指定收集并显示关于静态 SQL 和包执行的信息。 |

    | `-fcm` | 指定收集并显示关于快速通信管理器（fast communication manager）的信息。 |

    | `-memsets` | 指定收集并显示关于内存集的信息。 |

    | `-mempools` | 指定收集并显示关于内存池的信息。 |

    | `-memblocks` | 指定收集并显示关于内存块的信息。 |

    | `-dbmcfg` | 指定收集并显示当前 DB2 数据库配置参数设置的信息。 |

    | `-dbcfg` | 指定收集并显示当前数据库配置参数设置的信息。 |

    | `-catalogcache` | 指定收集并显示关于目录缓存的信息。 |

    | `-tcbstats` | 指定收集并显示关于表和索引的信息。 |

    | `-reorg` | 指定收集并显示关于表和数据分区重组的信息。 |

    | `-recovery` | 指定收集并显示恢复活动的信息。 |

    | `-reopt` | 指定收集并显示使用 `REOPT ONCE` 选项重新优化的缓存 SQL 语句的信息。 |

    | `-osinfo` | 指定收集并显示操作系统信息。 |

    | `-storagepaths` | 指定收集并显示为数据库定义的自动存储路径的信息。 |

    | `-pages` | 指定收集并显示关于缓冲区池页的信息。 |

    | `-stack` | 指定收集并显示堆栈跟踪信息。 |

    | `-repeat` | 指定在指定的秒数后按指定的次数重复命令。 |

    | `-command` | 指定执行存储在指定文件中的 `db2pd` 命令。 |

    | `-file` | 指定将所有收集的信息写入指定的文件。 |

    | `-interactive` | 表示在运行 `db2pd` 命令时将覆盖为环境变量 `DB2PDOPT` 指定的值。 |

    | `-help` | `-h` | 显示帮助信息。当指定此选项时，将忽略所有其他选项，仅显示帮助信息。 |


