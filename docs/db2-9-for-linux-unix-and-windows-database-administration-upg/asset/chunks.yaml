    So in this case, automatic storage is enabled by default, and the storage paths
    `/mnt/data1` and `/mnt/data2` will be used to hold table space containers used
    by automatic storage. And since no database path was specified, the metadata files
    associated with the database will be stored in the first storage path specified
    (`/mnt/data1`).


    # Question 4


    The correct answer is **C.** In this scenario, the syntax for the `CREATE DATABASE`
    command is as follows:


    ![Image](images/80-1.jpg)


    where:


    | Column | Description |

    | :--- | :--- |

    | `DatabaseName` | Identifies the unique name that is to be assigned to the database
    to be created. |

    | `StoragePath` | If `AUTOMATIC STORAGE YES` is specified (the default), identifies
    one or more storage paths that are to be used to hold table space containers used
    by automatic storage. Otherwise, identifies the location (drive or directory)
    where the directory hierarchy and files associated with the database to be created
    are to be physically stored. |

    | `DBPath` | If `AUTOMATIC STORAGE YES` is specified (the default), identifies
    the location (drive or directory) where the directory hierarchy and metadata files
    associated with the database to be created are to be physically stored. (If this
    parameter is not specified, and automatic storage is used, the metadata files
    will be stored in the first storage path specified in the `StoragePath` parameter.)
    |


    Because automatic storage is enabled by default when a DB2 9 database is created,
    the following `CREATE DATABASE` command will create a database whose storage containers
    reside on `/home/data1` and `/home/data2` and whose metadata files reside on `/home/dbase`:


    ![Image](images/80-2.jpg)


    # Question 5


    The correct answer is **B.** An existing table space’s properties can be changed
    by executing the `ALTER TABLESPACE` SQL statement. For this scenario, the basic
    syntax for the `ALTER TABLESPACE` statement is:


    ![Image](images/81-1.jpg)


    where:


    | Column | Description |

    | :--- | :--- |

    | `TablespaceName` | Identifies the name assigned to the table space that is to
    be altered. |

    | `IncSize` | Identifies the amount by which a table space enabled for automatic
    resizing will automatically be increased when the table space is full and a request
    for more space is made. |

    | `MaxSize` | Identifies the maximum size to which a table space enabled for automatic
    resizing can automatically be increased. |


    Thus, if you wanted to change an existing DMS table space named `TBSP1` so that
    it will automatically grow to a maximum size of 1000 MB, you could do so by executing
    an `ALTER TABLESPACE` SQL statement that looks like this:


    ![Image](images/81-2.jpg)


    # Question 6


    The correct answer is **B.** Since no maximum size was specified (with the `MAXSIZE`
    option of the `CREATE TABLESPACE` statement), `MAXSIZE NONE` is used by default
    and there is no limit on how large the table space can be.


    # Question 7


    The correct answer is **D.** Data from a given table is partitioned into multiple
    storage objects based on the specifications provided in the `PARTITION BY` clause
    of the `CREATE TABLE` statement. The syntax for this optional clause is:


    ![Image](images/81-3.jpg)


    ![Image](images/82.jpg)


    where:


    | Column | Description |

    | :--- | :--- |

    | `ColumnName` | Identifies one or more columns, by name, whose values are to
    be used to determine which data partition a particular row is to be stored in.
    (The group of columns specified make up the partitioning key for the table.) |

    | `PartitionName` | Identifies the unique name that is to be assigned to the data
    partition to be created. |

    | `Start` | Specifies the low end of the range for each data partition. |

    | `End` | Specifies the high end of the range for each data partition. |

    | `Constant` | Specifies the width of each data partition range when the automatically
    generated form of the syntax is used. Data partitions will be created starting
    at the `STARTING FROM` value and will contain this number of values in the range.
    This form of the syntax is only supported if the partitioning key is comprised
    of a single column that has been assigned a numeric, date, time, or timestamp
    data type. |

    | `DurationLabel` | Identifies the duration that is associated with the `Constant`
    value specified if the partitioning key column has been assigned a date, time,
    or timestamp data type. The following values are valid for this parameter: `YEAR,
    YEARS, MONTH, MONTHS, DAY, DAYS, HOUR, HOURS, MINUTE, MINUTES, SECOND, SECONDS,
    MICROSECOND, and MICROSECONDS`. |

    | `TableSpaceName` | Identifies the table space that each data partition is to
    be stored in. |


    Thus, if you wanted to create a table named `PARTS` that is partitioned such that
    rows with numerical values that fall in the range of 0 to 33 are stored in one
    partition that resides in one table space, rows with numerical values that fall
    in the range of 34 to 66 are stored in another partition that resides in another
    table space, and so on, you could do so by executing a `CREATE TABLE` SQL statement
    that looks something like this:


    ![Image](images/83-1.jpg)


    # Question 8


    The correct answer is **A.** When an index is created for a range partitioned
    table, the data for that index will be stored in the table space that is used
    to hold the first partition’s data, unless otherwise specified. Since, in the
    example, the following `CREATE INDEX` SQL statement was used to create an index
    for the `SALES` table:


    ![Image](images/83-2.jpg)


    Data for the index named `SALES_IDX` will be stored in the table space named `TBSP0`.


    # Question 9


    The correct answers are **B** and **C.** A new range can be easily incorporated
    into a partitioned table, as an additional data partition by using the `ATTACH
    PARTITION` clause of the `ALTER TABLE` statement; once rolled in, newly attached
    data partitions are brought online by executing the `SET INTEGRITY` statement.


    # Question 10


    The correct answer is **D.** Table partitioning improves performance and eliminates
    the need to create a partitioned database using the Data Partitioning Feature.
    Other advantages of using table partitioning include: easy roll-in and roll-out
    of data, easier administration of large tables, flexible index placement, and
    better query processing.


    # Question 11


    The correct answer is **B.** In order to use data row compression with a table,
    two prerequisites must be satisfied:


    1. Compression must be enabled at the table level.

    2. A compression dictionary for the table must be built.


    # Question 12


    The correct answer is **D.** Index data is not affected by data row compression;
    only data stored on a page in a base table can be compressed. However, because
    records in a compressed table are moved between storage and memory in compressed
    form (the compression dictionary is moved into memory as well so decompression
    can take place), records for compressed tables that are written to transaction
    log files will be compressed as well.


    # Question 13


    The correct answers are **A** and **C.** Although a table can be enabled for data
    row compression at any time by setting its `COMPRESS` attribute to `YES`, data
    stored in the table will not be compressed until a compression dictionary has
    been built. A compression dictionary is built (and data in a table is compressed)
    by performing an offline table reorganization operation; such an operation is
    initiated by executing the `REORG` command with either the `KEEPDICTIONARY` or
    `RESETDICTIONARY` option specified.

