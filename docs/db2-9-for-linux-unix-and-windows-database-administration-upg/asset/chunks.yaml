    2.  A compression dictionary for the table must be built.


    # ***Enabling a Table for Data Row Compression***


    Compression is enabled at the table level by executing either the `CREATE TABLE`
    SQL statement or the `ALTER TABLE` statement with the `COMPRESS YES` option specified.
    For example, if you wanted to create a new table named `EMPLOYEE` andenable it
    for data row compression, you could do so by executing a `CREATE TABLE` statement
    that looks something like this:


    ![Image](images/70-1.jpg)


    On the other hand, if you wanted to enable an existing table named `EMPLOYEE`
    for data row compression, you could do so by executing an `ALTER TABLE` statement
    that looks like this:


    ![Image](images/70-2.jpg)


    # ***Building a Compression Dictionary***


    Although you can enable a table for data row compression at any time by setting
    its `COMPRESS` attribute to `YES,` data stored in the table will not be compressed
    until a compression dictionary has been built. A compression dictionary is built
    (and data in a table is compressed) through an offline table reorganization operation;
    such an operation is initiated by executing the `REORG` command with either the
    `KEEPDICTIONARY` or the `RESETDICTIONARY` option specified. If the `REORG` command
    is executed with either option specified, and a compression dictionary does not
    exist, a new dictionary will be built; if the `REORG` command is executed with
    either option specified, and a dictionary already exists, data in the table will
    be reorganized/compressed, and the existing dictionary will either be recreated
    `(RESETDICTIONARY)` or left as it is `(KEEPDICTIONARY).`


    Thus, if you wanted to create a new compression dictionary (and compress the existing
    data) for a table named `EMPLOYEE` that has been enabled for data row compression,
    you could do so by executing a `REORG` command that looks like this:


    ![Image](images/70-3.jpg)


    When this command is executed, data stored in the `EMPLOYEE` table will be analyzed,
    a compression dictionary will be constructed and stored at the beginning of the
    table, and the data will be compressed and written to the table directly behind
    the compression dictionary.


    It is important to note that index data is not affected by data row compression;
    only data stored on a page in a base table can be compressed. However, because
    records in a compressed table are moved between storage and memory in compressed
    form (the compression dictionary is moved into memory as well so that decompression
    can take place), records for compressed tables that are written to transaction
    log files will be compressed as well.


    # ***Estimating Storage Savings from Data Row Compression***


    Because an offline reorganization operation is needed to construct a compression
    dictionary and perform data compression, the initial overhead required to compress
    data can be quite high. Therefore, it can be beneficial to know which tables will
    benefit the most from data row compression and which tables will not. In DB2 9,
    the Inspect utility can help you make that determination. The Inspect utility
    is invoked by executing the `INSPECT` command, and if this command is executed
    with the `ROWCOMPESTIMATE` option specified, the Inspect utility will examine
    each row in the table specified, build a compression dictionary from the data
    found, and then use this dictionary to estimate how much space will be saved if
    the data in the table is compressed.


    Thus, if you want to estimate how much storage space will be saved if the data
    in a table named `EMPLOYEE` is compressed, you could do so by executing an `INSPECT`
    command that looks something like this:


    ![Image](images/71.jpg)


