    Because an offline reorganization operation is needed to construct a compression
    dictionary and perform data compression, the initial overhead required to compress
    data can be quite high. Therefore, it can be beneficial to know which tables will
    benefit the most from data row compression and which tables will not. In DB2 9,
    the Inspect utility can help you make that determination. The Inspect utility
    is invoked by executing the `INSPECT` command and if this command is executed
    with the `ROWCOMPESTIMATE` option specified, the Inspect utility will examine
    each row in the table specified, build a compression dictionary from the data
    found, and then use this dictionary to estimate how how much space will be saved
    if the data in the table is compressed.


    # Question 14


    The correct answer is **B.** A compression dictionary is built (and data in a
    table is compressed) by performing an offline table reorganization operation;
    such an operation is initiated by executing the `REORG` command with either the
    `KEEPDICTIONARY` or `RESETDICTIONARY` option specified. If the `REORG` command
    is executed with either option specified and a compression dictionary does not
    exist, a new dictionary will be built; if the `REORG` command is executed with
    either option specified and a dictionary already exists, data in the table will
    be reorganized/compressed and the existing dictionary will either be recreated
    (`RESETDICTIONARY`) or left as it is (`KEEPDICTIONARY`).


    # CHAPTER 4


    ## XML Concepts


    Thirteen percent (13%) of the DB2 9 for Linux, UNIX, and Windows Database Administration
    Upgrade exam (Exam 736) is designed to test your knowledge of storing and manipulating
    XML data in a DB2 9 database. The questions that make up this portion of the exam
    are intended to evaluate the following:


    *   Your ability to use the new XML data type

    *   Your knowledge of basic XQuery fundamentals

    *   Your ability to create and manage XML indexes

    *   Your ability to use basic XML functions such as `XMLPARSE()`, `XMLSERIALIZE()`,
    `XMLVALIDATE()`, and `XMLQUERY()`

    *   Your knowledge of how to use DB2’s data movement utilities when working with
    XML data


    This chapter is designed to introduce you to XML and the XML functions available,
    as well as walk you through the construction of simple XQuery expressions. This
    chapter is also designed to show you how to create XML indexes and to show you
    how DB2’s data movement utilities can be used to work with XML data.


    ## Working with XML Data


    DB2 9’s pureXML technology unlocks the latent potential of XML by providing simple
    efficient access to XML with the same levels of security, integrity, and resiliency
    taken for granted with relational data. DB2’s pureXML technology is available
    as an add-on feature to DB2 Express Edition, DB2 Workgroup Server Edition, and
    DB2 Enterprise Server Edition; however, it is part of DB2 Express-C, and the use
    of pureXML is included in the base DB2 Express-C license. With pureXML, XML data
    is stored in a hierarchical structure that naturally reflects the structure of
    XML documents. This structure, along with innovative indexing techniques, allows
    DB2 to efficiently manage XML data while eliminating the complex and time-consuming
    parsing that is typically required to store XML data in a relational database.
    However, there are some restrictions when it comes to using pureXML:


    *   pureXML can be used only with single-partition databases.

    *   The use of any pureXML feature will prevent future use of the database-partitioning
    feature (DPF) that is available with DB2 Enterprise Server Edition (ESE).

    *   pureXML cannot be used with DB2 Data Warehouse Edition (DWE) because DWE uses
    DB2 ESE and DPF.


    In order to make use of the pureXML feature, a database must be created using
    the UTF-8 codeset. The UTF-8 codeset is specified through the `USING CODESET`
    option of the `CREATE DATABASE` command; to create a database named `XML_DB` with
    a UTF-8 code set, you must execute a `CREATE DATABASE` command that looks something
    like this:


    ![Image](images/88-1.jpg)


    ## The XML Data Type and XML Columns


    To support pureXML, a new data type called `XML` was introduced with DB2 9. This
    data type is used to define columns that will be used to store XML values. Each
    XML value stored must be a well-formed XML document; a well-formed XML document
    looks something like this:


    ![Image](images/88-2.jpg)


    ![Image](images/89-1.jpg)


    XML documents begin with an XML declaration; an XML declaration looks something
    like this:


    ![Image](images/89-2.jpg)


    or


    ![Image](images/89-3.jpg)


    The XML declaration is followed by one or more attributes and elements. All XML
    elements are enclosed with opening and closing tags; XML elements look something
    like this:


    ![Image](images/89-4.jpg)


    It is important to note that the opening and closing tags used are case sensitive—
    the tag `<Letter>` is different from the tag `<letter>`. Therefore, opening and
    closing tags must be written with the same case.


    XML attributes are normally used to describe XML elements or to provide additional
    information about an element. Attributes are always contained within the start
    tag of an element, and attribute values must always be quoted. Here are some examples:


    ![Image](images/89-5.jpg)


    Attributes are handy in HTML, but in XML you should try to avoid them whenever
    the same information can be expressed using elements. The following examples convey
    the same information:


    ![Image](images/89-6.jpg)


    ![Image](images/90-1.jpg)


    In the first example, `SEX` is an attribute. In the last example `SEX` is an element.


    To create tables with XML columns, you specify columns with the `XML` data type
    in the `CREATE TABLE` statement. (A table can have one or more XML columns.) Like
    a LOB column, an XML column holds only a descriptor of the column. The data itself
    is stored separately. Unlike a LOB column, you do not specify a length when you
    define an XML column. So to create a table named `CUSTOMER` that contains an XML
    column named `CUSTINFO`, you would execute a `CREATE TABLE` statement that looks
    something like this:


    ![Image](images/90-2.jpg)


    XML columns have the following restrictions:


    *   They cannot have a default value specified by the `WITH DEFAULT` clause; if
    the column is nullable, the default for the column is `NULL`.

    *   They cannot be referenced in `CHECK` constraints (except for a `VALIDATED`
    predicate).

    *   They cannot be referenced in generated columns.

    *   They cannot be included in typed tables and typed views.

    *   They cannot be used in a range-clustered table (RCT).

    *   They cannot be used in a range-partitioned table.

    *   They cannot be used in a multidimensional clustering (MDC) table.

    *   They cannot be added to tables that have Type-1 indexes defined on them (note
    that Type-1 indexes are deprecated indexes; indexes created since DB2 UDB Version
    8.1 are Type-2 indexes).

    *   They cannot be specified in the select-list of scrollable cursors.

    *   They cannot be referenced in the triggered action of a `CREATE TRIGGER` statement.

    *   They cannot be included as columns of keys, including primary, foreign, and
    unique keys; dimension keys of multidimensional clustering (MDC) tables; sequence
    keys of range-clustered tables; distribution keys; and data-partitioning keys.

    *   They cannot be used in a table with a distribution key.

    *   They cannot be part of any index except an index over XML data.

    *   They cause data blocking to be disabled when retrieving XML data.

    *   They cannot be compressed using data row compression


    ## Manipulating XML Data

