    HADR is started by executing the `START HADR` command. The basic syntax for this
    command is:


    ![Image](images/166-1.jpg)


    where:


    | --- | --- |

    | `DatabaseAlias` | Identifies the alias assigned to the database for which HADR
    is to be started. |

    | `UserName` | Identifies the name assigned to a specific user under whom HADR
    is to be started. |

    | `Password` | Identifies the password that corresponds to the name of the user
    under whom HADR is to be started. |


    Thus, if you wanted to start HADR on a database named `SAMPLE` and indicate that
    it is to act as a standby database, you could do so by executing a `START HADR`
    command that looks something like this:


    ![Image](images/166-2.jpg)


    5. Connect to the primary instance and start HADR on the primary database. In
    this case, you would execute a `START HADR` command that looks something like
    this:


    ![Image](images/166-3.jpg)


    You can also set up an HADR environment using the Set Up HADR Databases Wizard,
    which can be activated by selecting the High Availability Disaster Recovery action
    from the Databases menu found in the Control Center. [Figure 6–5](#016_Chapter06.xhtml_img6_5)
    shows how the first page of the Set Up HADR Databases Wizard might look immediately
    after it is activated.


    ![Image](images/167.jpg)


    *Figure 6–5: The first page of the Set Up HADR Databases Wizard.*


    Once an HADR environment has been established, the following operations will be
    replicated automatically in the standby database whenever they are performed on
    the primary database:


    *   Execution of Data Definition Language (DDL) statements `(CREATE, ALTER, DROP)`

    *   Execution of Data Manipulation Language (DML) statements `(INSERT, UPDATE,
    DELETE)`

    *   Buffer pool operations

    *   Table space operations (as well as storage-related operations performed on
    automatic storage databases)

    *   Online reorganization

    *   Offline reorganization

    *   Changes to metadata for stored procedures and user-defined functions (UDFs)


    HADR does not replicate stored procedure and UDF object and library files. If
    this type of replication is needed, you must physically create the files on identical
    paths on both the primary and standby databases. (If the standby database cannot
    find the referenced object or library file, the stored procedure or UDF invocation
    will fail on the standby database.)


    Non-logged operations, such as changes to database configuration parameters and
    to the recovery history file, are not replicated to the standby database.


    # Automatic Client Reroute and HADR


    Automatic client reroute is a DB2 feature that allows client applications to recover
    from a loss of communication with the server so that the application can continue
    its work with minimal interruption. (If automatic client reroute is not enabled,
    client applications will receive an error message indicating that a connect attempt
    has failed due to a timeout and no further attempts will be made to establish
    a connection with the server.) However, rerouting is possible only when an alternate
    database location has been specified at the server and the TCP/IP protocol is
    used.


    The automatic client reroute feature can be used with HADR to make client applications
    connect to the new primary database immediately after a takeover operation. In
    fact, if you set up HADR using the Set Up High Availability Disaster Recovery
    (HADR) Databases Wizard, automatic client reroute is enabled by default. If you
    set up HADR manually, you can enable the automatic client reroute feature by executing
    the `UPDATE ALTERNATE SERVER FOR DATABASE` command; automatic client reroute does
    not use the values stored in the `hadr_remote_host` and `hadr_remote_svc` database
    configuration parameters.


    For example, suppose you have cataloged a database named `SALES` on a client workstation
    as being located at host named `SVR1`. Database `SALES` is the primary database
    in an HADR environment and its corresponding standby database, also named `SALES`,
    resides on host named `SVR2` and listens on port number 456. To enable automatic
    client reroute, you simply specify an alternate server for the `SALES` database
    stored on host `SVR1` by executing the following command:


    ![Image](images/169.jpg)


    Once this command is executed, the client must connect to host `SVR1` to obtain
    the alternate server information. Then, if a communication error occurs between
    the client and the `SALES` database at host `SVR1`, the client will first attempt
    to reconnect to the `SALES` database on host `SVR1`. If this fails, the client
    will then attempt to establish a connection with the standby `SALES` database
    located on host `SVR2`.


    # Practice Questions


    ## Question 1


    Which of the following is NOT a valid statement about the `RECOVER DATABASE` command?


    ![round](images/round.jpg) A. The `RECOVER DATABASE` command performs the necessary
    restore and roll-forward operations to recover a database.


    ![round](images/round.jpg) B. The `RECOVER DATABASE` command only rolls a database
    forward to the end of logs; it cannot roll forward to a specific point in time.


    ![round](images/round.jpg) C. The `RECOVER DATABASE` command can only be used
    successfully if the recovery history file for the database is available.


    ![round](images/round.jpg) D. The `RECOVER DATABASE` command cannot continue a
    previously unsuccessful recover operation from the point of failure; if a failure
    occurs, the recovery operation must be performed again.


    ## Question 2


    Which of the following statements is NOT true regarding the use of the `RECOVER
    DATABASE` command in a partitioned database environment?


    ![round](images/round.jpg) A. If the recovery operation is to a specific point
    in time, it affects all partitions found in the `db2nodes.cfg` file.


    ![round](images/round.jpg) B. If the recovery operation is to the end of logs,
    it only affects the partitions that are specified with the `RECOVER DATABASE`
    command.


    ![round](images/round.jpg) C. The `RECOVER DATABASE` command can be invoked from
    any database partition provided it is prefixed with `db2_all`.


    ![round](images/round.jpg) D. The `RECOVER DATABASE` command can only be used
    successfully if the recovery history file for the database is available.


    ## Question 3


    Given two servers named `SVR1` and `SVR2` with a database named `SALES` on `SRV1`,
    in what order should the following steps be performed to set up an HADR environment
    using `SRV2` as a standby server?


    a) Backup the `SALES` database on `SVR1`.


    b) Determine the host name, host IP address, and the service name or port number
    for `SVR1` and `SVR2`.


    c) Start HADR on `SVR2`.


    d) Set the HADR configuration parameters on `SVR1` and `SVR2`.


    e) Restore the `SALES` database on `SVR2`.


    f) Start HADR on `SVR1`.


    ![round](images/round.jpg) *A. b, a, e, d, f, c*


    ![round](images/round.jpg) *B. b, d, f, c, a, e*


    ![round](images/round.jpg) *C. b, a, e, d, c, f*


    ![round](images/round.jpg) *D. f, c, b, d, a, e*


    ## Question 4


    Which of the following is NOT an operation that is replicated in an HADR environment?


    ![round](images/round.jpg) A. Database configuration changes


    ![round](images/round.jpg) B. Execution of Data Definition Language (DDL) statements


    ![round](images/round.jpg) C. Online table reorganizations


    ![round](images/round.jpg) D. Execution of Data Manipulation Language (DML) statements


    ## Question 5


    Which of the following is NOT supported in an HADR environment?


    ![round](images/round.jpg) A. Automatic client reroute


    ![round](images/round.jpg) B. Automatic storage databases


    ![round](images/round.jpg) C. Write operations to the standby database


    ![round](images/round.jpg) D. Single partitioned databases


    ## Question 6


    Which of the following is NOT a requirement for an HADR environment?


    ![round](images/round.jpg) A. The operating system on the primary server and the
    standby server must be the same (including fix pack level).


    ![round](images/round.jpg) B. The database path on the primary server and the
    standby server must be the same.

