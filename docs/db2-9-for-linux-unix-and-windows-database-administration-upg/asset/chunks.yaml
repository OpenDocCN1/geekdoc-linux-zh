  trans: "\nHADR 是通过执行 `START HADR` 命令启动的。该命令的基本语法如下：\n\n![Image](img/166-1.jpg)\n\
    \n其中：\n\n| --- | --- |\n| `DatabaseAlias` | 标识为启动 HADR 的数据库分配的别名。 |\n| `UserName`\
    \ | 标识用于启动 HADR 的特定用户名称。 |\n| `Password` | 标识与启动 HADR 的用户名称对应的密码。 |\n\n因此，如果您想在名为\
    \ `SAMPLE` 的数据库上启动 HADR，并指定其作为备用数据库，您可以通过执行类似下面的 `START HADR` 命令来实现：\n\n![Image](img/166-2.jpg)\n\
    \n5. 连接到主实例并在主数据库上启动 HADR。在这种情况下，您将执行类似下方的 `START HADR` 命令：\n\n![Image](img/166-3.jpg)\n\
    \n您还可以使用“设置 HADR 数据库向导”（Set Up HADR Databases Wizard）设置 HADR 环境，该向导可以通过控制中心（Control\
    \ Center）中的数据库（Databases）菜单中选择“高可用性灾难恢复”（High Availability Disaster Recovery）操作来激活。图\
    \ 6–5 显示了设置 HADR 数据库向导在激活后第一页可能的样子。\n\n![Image](img/167.jpg)\n\n*图 6–5：设置 HADR\
    \ 数据库向导的第一页。*\n\n一旦建立了 HADR 环境，只要在主数据库上执行以下操作，它们将在备用数据库中自动复制：\n\n*   执行数据定义语言（DDL）语句\
    \ `(CREATE, ALTER, DROP)`\n*   执行数据操语言（DML）语句 `(INSERT, UPDATE, DELETE)`\n*  \
    \ 缓冲池操作\n*   表空间操作（以及在自动存储数据库上执行的存储操作）\n*   在线重组\n*   离线重组\n*   存储过程和用户定义函数（UDF）元数据的更改\n\
    \nHADR 不复制存储过程和 UDF 对象及库文件。如果需要此类复制，您必须在主数据库和备用数据库的相同路径上物理创建这些文件。（如果备用数据库找不到引用的对象或库文件，则存储过程或\
    \ UDF 的调用将在备用数据库上失败。）\n\n非日志操作（例如对数据库配置参数和恢复历史文件的更改）不会复制到备用数据库。\n\n# 自动客户端重路由和\
    \ HADR\n\n自动客户端重路由是 DB2 的一项功能，允许客户端应用程序从与服务器的通信丢失中恢复，以便应用程序能够以最少的中断继续工作工作。（如果未启用自动客户端重路由，客户端应用程序将收到错误消息，指示由于超时连接尝试失败，且不会再次尝试与服务器建立连接。）然而，只有在服务器端指定了备用数据库位置并使用\
    \ TCP/IP 协议时，才能进行重路由。\n\n自动客户端重路由功能可以配合 HADR 使用，使客户端应用程序在切换操作后立即连接到新的主数据库。事实上，如果您使用“设置高可用性灾难恢复（HADR）数据库向导”设置\
    \ HADR，则默认启用自动客户端重路由。如果您手动设置 HADR，可以通过执行 `UPDATE ALTERNATE SERVER FOR DATABASE`\
    \ 命令来启用自动客户端重路由功能；自动客户端重路由不使用存储在 `hadr_remote_host` 和 `hadr_remote_svc` 数据库配置参数中的值。\n\
    \n例如，假设您在客户端工作站上对名为 `SALES` 的数据库进行了目录注册，主机名为 `SVR1`。数据库 `SALES` 是 HADR 环境中的主数据库，其对应的备用数据库也名为\
    \ `SALES`，位于名为 `SVR2` 的主机上并监听端口号 456。要启用自动客户端重路由，您只需执行以下命令为存储在主机 `SVR1` 上的 `SALES`\
    \ 数据库指定备用服务器：\n\n![Image](img/169.jpg)\n\n一旦执行了该命令，客户端必须连接到主机 `SVR1` 以获取备用服务器信息。然后，如果客户端与主机\
    \ `SVR1` 上的 `SALES` 数据库之间发生通信错误，客户端首先尝试重新连接到主机 `SVR1` 上的 `SALES` 数据库。如果失败，客户端将尝试与位于\
    \ `SVR2` 的备用 `SALES` 数据库建立连接。\n\n# 练习题\n\n## 第 1 \n\n关于 `RECOVER DATABASE` 命令，以下哪项不是正确的？\n\
    \n![round](img/round.jpg) A. `RECOVER DATABASE` 命令执行必要的还原和向前滚操作以恢复数据库。\n\n![round](img/round.jpg)\
    \ B. `RECOVER DATABASE` 命令仅将数据库向前滚到日志末尾；无法向前滚到特定的时间点。\n\n![round](img/round.jpg)\
    \ C. 只有当数据库的恢复历史文件可用，`RECOVER DATABASE` 命令才能成功使用。\n\n![round](img/round.jpg) D.\
    \ `RECOVER DATABASE` 命令无法从失败点继续之前失败的恢复操作；如果发生失败，必须重新执行恢复操作。\n\n## 第 2\n\n关于在分区数据库环境中使用\
    \ `RECOVER DATABASE` 命令，以下哪种说法是不正确的？\n\n![round](img/round.jpg) A. 如果恢复操作到特定时间点，它将影响\
    \ `db2nodes.cfg` 文件找到的所有分区。\n\n![round](img/round.jpg) B. 如果恢复操作到日志末尾，它仅影响用 `RECOVER\
    \ DATABASE` 命令指定的分区。\n\n![round](img/round.jpg) C. 只要以 `db2_all` 为前，就可以从任何数据库分区调用\
    \ `RECOVER DATABASE` 命令。\n\n![round](img/round.jpg) D. 只有当 `RECOVER DATABASE`\
    \ 命令被使用时才能成功。\n\n## 第 3\n\n假设有两个名为 `SVR1` 和 `SVR2` 的服务器，并在 `SVR1` 上有一个名为 `SALES`\
    \ 的数据库。为了使用 `SVR2` 作为备用服务器设置 HADR 环境，应按什么顺序执行以下步骤？\n\na) 备份 `SVR1` 上的 `SALES`\
    \ 数据库。\n\nb)  `SVR1` 和 `SVR2` 的主机名、IP 地址以及服务名称或端口号。\n\nc) 在 `SVR2` 上启动 HADR。\n\
    \nd) 在 `SVR1` 和 `SVR2` 上设置 HADR 配置参数。\n\ne) 在 `SVR2` 上还原 `SALES` 数据库。\n\nf) 在\
    \ `SVR1` 上启动 HADR。\n\n![round](img/round.jpg) *A. b, a, e, d, f, c*\n\n![round](img/round.jpg)\
    \ *B. b, d, f, c, a, e*\n\n![round](img/round.jpg) *C. b, a, e, d, c, f*\n\n![round](img/round.jpg)\
    \ *D. f, c, b, d, a, e*\n\n## 第 4\n\n以下哪项不是在 HADR 环境中复制的操作？\n\n![round](img/round.jpg)\
    \ A. 数据库配置更改\n\n![round](img/round.jpg) B. 执行数据定义语言（DDL）语句\n\n![round](img/round.jpg)\
    \ C. 在线表重组\n\n![round](img/round.jpg) D. 执行数据操语言（DML）语句\n\n## 第 5\n\nHADR 环境不支持以下哪项功能？\n\
    \n![round](img/round.jpg) A. 自动客户端重路由\n\n![round](img/round.jpg) B. 自动存储数据库\n\n\
    ![round](img/round.jpg) C. 对备用数据库的写入操作\n\n![round](img/round.jpg) D. 单分区数据库\n\n\
    ## 第 6\n\n对于 HADR 环境，以下哪项不是要求？\n\n![round](img/round.jpg) A. 主服务器和备用服务器上的操作系统必须相同（包括补丁包级别）。\n\
    \n![round](img/round.jpg) B. 主服务器和备用服务器上的数据库路径必须相同。\n\n"
