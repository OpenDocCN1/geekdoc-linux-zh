- fmt: "\n*   IBM Certified Solutions Expert—DB2 UDB V7.1 Database Administration\
    \ for UNIX, Windows, and OS/2\n*   IBM Certified Solutions Expert—DB2 UDB V6.1\
    \ Application Development for UNIX, Windows, and OS/2\n*   IBM Certified Specialist—DB2\
    \ UDB V6/V7 User\n\n# About This Book\n\nThis book is divided into two parts:\n\
    \n*   Part 1 - DB2 UDB Certification ([Chapter 1](#011_Chapter01.xhtml_ch-1))\n\
    \    This section consists of one chapter ([Chapter 1](#011_Chapter01.xhtml_ch-1)),\
    \ which is designed to introduce you to the DB2 Professional Certification Program\
    \ that is available from IBM. In this chapter, you will learn about the `IBM Certified\
    \ Database Administrator - DB2 9 for Linux, UNIX, and Windows` certification role\
    \ and you will be presented with the objectives that have been developed for the\
    \ DB2 9 for Linux, UNIX, and Windows Database Administration Upgrade exam (Exam\
    \ 736). This chapter also explains what’s involved in the certification process.\n\
    \n*   Part 2 - DB2 9 Database Administration Concepts ([Chapters 2](#012_Chapter02.xhtml_ch-2)–[7](#017_Chapter07.xhtml_ch-7))\n\
    \    This section consists of six chapters ([Chapters 2](#012_Chapter02.xhtml_ch-2)\
    \ through [7](#017_Chapter07.xhtml_ch-7)), which are designed to provide you with\
    \ the concepts you will need to master before you can pass the DB2 9 for Linux,\
    \ UNIX, and Windows Database Administration Upgrade exam (Exam 736).\n\n    [Chapter\
    \ 2](#012_Chapter02.xhtml_ch-2) is designed to introduce you to the various aspects\
    \ of server management. In this chapter, you will learn how to use the `Configuration\
    \ Advisor` to configure servers, instances, and databases, as well as how to configure\
    \ client communications. You will also learn how to configure a database for Automatic\
    \ Maintenance, how to use the `Self-Tuning Memory Manager`, and how to throttle\
    \ utilities to control their impact on database workloads.\n\n    [Chapter 3](#013_Chapter03.xhtml_ch-3)\
    \ is designed to teach you everything you need to know about how data in a DB2\
    \ 9 database is physically stored. In this chapter, you will learn how to create\
    \ a DB2 9 database and you will discover what a DB2 9 database’s underlying structure\
    \ looks like, as well as how that structure is mapped to files and directories.\
    \ You will also learn how to create Automatic Storage table spaces, how to partition\
    \ data with table (range) partitioning, and how to configure a table to use data\
    \ row compression.\n\n    Chapter 4 is designed to provide you with information\
    \ about creating databases and tables that support XML. In this chapter, you will\
    \ learn how to enable a database for XML data storage, how to use the `XML` data\
    \ type, how to manipulate XML data and create XML indexes, how to use basic `XML`\
    \ functions, and how to process XML data when using DB2’s data movement utilities.\n\
    \n    [Chapter 5](#015_Chapter05.xhtml_ch-5) is designed to introduce you to the\
    \ various tools that are available for monitoring a database’s performance. In\
    \ this chapter, you will learn how to configure and use the `snapshot monitor`\
    \ and how to create one or more event monitors. You will also learn how to use\
    \ the DB2 Problem Determination `Tool - db2pd.`\n\n    [Chapter 6](#016_Chapter06.xhtml_ch-6)\
    \ is designed to introduce you to the concept of database backup and recovery\
    \ and to the various tools available with DB2 9 that can be used to return a damaged\
    \ or corrupted database to a useable and consistent state. In this chapter, you\
    \ will learn what transaction logging is, how transaction logging is performed,\
    \ and how log files are used to restore a damaged database. You will learn how\
    \ to make backup images of a database or a table space using the `Backup` utility,\
    \ how to perform version recovery using the `Restore` utility, how to reapply\
    \ transaction records stored in logs to perform a roll forward recovery operation\
    \ using the `Roll-forward` utility, and how to restore a database using information\
    \ stored in the recovery history log file using the `Recover` utility. You will\
    \ also learn how to set up a High Availability Disaster Recovery (HADR) environment.\n\
    \n    [Chapter 7](#017_Chapter07.xhtml_ch-7) is designed to introduce you to the\
    \ concept of database security and to the various authorization levels and privileges\
    \ that are recognized by DB2. In this chapter, you will learn how and where users\
    \ are authenticated, how authorities and privileges determine what a user can\
    \ and cannot do while working with a database, and how authorities and privileges\
    \ are given to and taken away from individual users and/or groups of individual\
    \ users. You will also learn how to restrict access to specific columns and/or\
    \ rows in a table using Label-Based Access Control (LBAC).\n\nThe book is written\
    \ primarily for IT professionals who have a great deal of experience working with\
    \ DB2 9, already hold the IBM Certified Database Administrator—DB2 V8.1 for Linux,\
    \ UNIX, and Windows certification, and would like to take (and pass) the DB2 9\
    \ for Linux, UNIX, and Windows Database Administration Upgrade exam (Exam 736).\n\
    \n# Conventions Used\n\nMany examples of DB2 9 administrative commands and SQL\
    \ statements can be found throughout this book. The following conventions are\
    \ used whenever a DB2 command or SQL statement is presented:\n\n| [ ] | Parameters\
    \ or items shown inside of brackets are required and must be provided. |\n| <\
    \ > | Parameters or items shown inside of angle brackets are optional and do not\
    \ have to be provided. |\n| | | Vertical bars are used to indicate that one (and\
    \ only one) item in the list presented can be specified |\n| ,… | A comma followed\
    \ by three periods (ellipsis) indicate that multiple instances of the preceding\
    \ parameter can be included |\n\nThe following examples illustrate each of these\
    \ conventions:\n\n# Example 1\n\n```\nSELECT * FROM TableName [INCREMENTAL | NON\
    \ INCREMENTAL], ...\n```\n\n# Example 2\n\n```\nCREATE SEQUENCE SequenceName [NO\
    \ CYCLE | CYCLE] [START WITH, INCREMENT BY, MINVALUE, MAXVALUE, CACHE];\n```\n\
    \nSQL is not a case-sensitive language, but for clarity, the examples provided\
    \ are shown in mixed case—command syntax is presented in uppercase while user-supplied\
    \ elements such as table names and column names are presented in lower case. However,\
    \ the examples shown can be entered in any case.\n\nAlthough basic syntax is presented\
    \ for most of the DB2 commands and SQL statements covered in this book, the actual\
    \ syntax supported may be much more complex. To view the complete syntax for a\
    \ specific command or to obtain more information about a particular command, refer\
    \ to the IBM DB2, Version 9 Command Reference product documentation. To view the\
    \ complete syntax for a specific SQL statement or to obtain more information about\
    \ a particular statement, refer to the IBM DB2, Version 9 SQL Reference, Volume\
    \ 2 product documentation.\n"
