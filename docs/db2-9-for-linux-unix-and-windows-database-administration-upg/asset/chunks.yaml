    *   Data in a table is reorganized, using the `REORG` utility.

    *   Statistics for a table are updated, using the `RUNSTATS` utility.

    *   A table is deleted (dropped).


    In addition to identifying the event that was performed, each entry in the recovery
    history file identifies the date and time the event took place, how the event
    took place, and the table spaces and tables that were affected and, if the action
    was a backup operation, the location where the backup image produced was stored,
    along with information on how to access this image. And because the recovery history
    file contains image location information for each backup image available, it can
    act as a tracking and verification mechanism during version recovery operations.


    # The DB2 Recover Utility


    While the `RESTORE DATABASE` command can be used to return a database to the state
    it was in at the time a backup image was made, and the `ROLLFORWARD DATABASE`
    command can be used to replay information recorded in a database’s transaction
    log files to return a database to the state it was in at a specific point in time,
    if you have a current recovery history file, you can perform both operations in
    a single step using the Recover utility.


    Introduced in DB2 9, the Recover utility performs the necessary restore and roll-forward
    operations to recover a database to a specific point in time, based on information
    found in the recovery history file. The Recovery utility is invoked by executing
    the `RECOVER DATABASE` command. The basic syntax for this command is:


    ```

    ![Image](images/158.jpg)


    ![Image](images/159-1.jpg)


    or


    ![Image](images/159-2.jpg)

    ```


    where:


    | `DatabaseAlias` | Identifies the alias assigned to the database associated with
    the backup image that is to be used to perform a version recovery operation. |

    | `PointInTime` | Identifies a specific point in time, identified by a timestamp
    value in the form `yyyy-mm-dd-hh.mm.ss.nnnnnn` (year, month, day, hour, minutes,
    seconds, microseconds), to which the database is to be rolled forward. (Only transactions
    that took place before and up to the date and time specified will be reapplied
    to the database.) |

    | `PartitionNum` | Identifies, by number, one or more database partitions (identified
    in the `db2nodes.cfg` file) that transactions are to be rolled forward on. In
    a partitioned database environment, the Recover utility must be invoked from the
    catalog partition of the database. |

    | `UserName` | Identifies the name assigned to a specific user under whom the
    recovery operation is to be performed. |

    | `Password` | Identifies the password that corresponds to the name of the user
    under whom the recovery operation is to be performed. |

    | `HistoryFile` | Identifies the name assigned to the recovery history log file
    that is to be used by the Recovery utility. |

    | `LogDirectory` | Identifies the directory that contains offline archived log
    files that are to be used to perform the roll-forward portion of the recovery
    operation. |


    Thus, if you wanted to perform a full recovery operation on a database named `SAMPLE`
    (which already exists) using information stored in the recovery history file,
    you could do so by executing a `RECOVER DATABASE` command that looks something
    like this:


    ```

    ![Image](images/160-1.jpg)

    ```


    On the other hand, if you wanted to restore a database named `SAMPLE` and roll
    it forward to an extremely old point in time that is no longer contained in the
    current recovery history file, you could do so by executing a `RECOVER DATABASE`
    command that looks something like this (assuming you have a copy of an older recovery
    history file available):


    ```

    ![Image](images/160-2.jpg)

    ```


    It is important to note that if the Recover utility successfully restores a database,
    but for some reason fails while attempting to roll it forward, the Recover utility
    will attempt to continue the previous recover operation, without redoing the restore
    phase. If you want to force the Recover utility to redo the restore phase, you
    need to execute the `RECOVER DATABASE` command with the `RESTART` option specified.
    There is no way to explicitly restart a recovery operation from a point of failure.


    # High Availability Disaster Recovery (HADR)


    High availability disaster recovery (HADR) is a DB2 database replication feature
    that provides a high availability solution for both partial and complete site
    failures. HADR protects against data loss by replicating data changes from a source
    database, called the primary, to a target database, called the standby. In an
    HADR environment, applications can only access the current primary database— synchronization
    with the standby database occurs by rolling forward transaction log data that
    is generated on the primary database and shipped to the standby database. And
    with HADR, you can choose the level of protection you want from potential loss
    of data by specifying one of three synchronization modes: synchronous, near synchronous,
    or asynchronous.


    HADR is designed to minimize the impact to a database system when a partial or
    a complete site failure occurs. A partial site failure can be caused by a hardware,
    network, or software (DB2 or operating system) malfunction. Without HADR, a partial
    site failure requires restarting the server and the instance where one or more
    DB2 databases reside. The length of time it takes to restart the server and the
    instance is unpredictable; if the transaction load was heavy at the time of the
    partial site failure, it can take several minutes before a database is returned
    to a consistent state and made available for use. With HADR, the standby database
    can take over in seconds. Furthermore, you can redirect the clients that were
    using the original primary database to the standby database (which is now the
    new primary database) by using automatic client reroute or retry logic in the
    applications that interact with the database. After the failed original primary
    server is repaired, it can rejoin the HADR pair as a standby database if both
    copies of the database can be made consistent. And once the original primary database
    is reintegrated into the HADR pair as the standby database, you can switch the
    roles so that the original primary database once again functions as the primary
    database. (This is known as failback operation.)


    A complete site failure can occur when a disaster, such as a fire, causes the
    entire site to be destroyed. Because HADR uses TCP/IP to communicate between a
    primary and a standby database, the databases can reside it two different locations.
    For example, your primary database might be located at your head office in one
    city, whereas your standby database is located at your sales office in another
    city. If a disaster occurs at the primary site, data availability is maintained
    by having the remote standby database take over as the primary database.


    # Requirements for HADR Environments


    To achieve optimal performance with HADR, the system hosting the standby database
    should consist of the same hardware and software as the system where the primary
    database resides. If the system hosting the standby database has fewer resources
    than the system hosting the primary database, the standby database may not be
    able to keep up with the transaction load generated by the primary database. This
    can cause the standby database to fall behind or the performance of the primary
    database to suffer. But more importantly, if a failover situation occurs, the
    new primary database may not have the resources needed to adequately service the
    client applications. And because buffer pool operations performed on the primary
    database are replayed on the standby database, it is important that the primary
    and standby database servers have the same amount of memory.

