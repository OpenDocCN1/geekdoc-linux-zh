    *   对 DB2 9 新身份验证类型的了解

    *   对基于标签的访问控制 (LBAC) 的理解


    # 参加 Linux、UNIX 和 Windows 版 DB2 数据库管理升级考试 (考试 736)


    当你确认准备好参加 `DB2 9 for Linux, UNIX, and Windows Database Administration Upgrade`
    考试（考试 736）时，下一步是联系 IBM 授权的测试供应商。DB2 9 认证考试由 Pearson VUE 和 Thompson Prometric 管理，在极少数情况下由
    IBM 管理（例如，IBM 会在一些大型数据库会议上——如国际 DB2 用户组北美会议——免费提供 DB2 9 认证考试）。然而，在联系任何一个测试供应商之前，你应该分别访问他们的网站
    `[www.vue.com/ibm](http://www.vue.com/ibm)` 和 `[www.2test.com](http://www.2test.com)`，并使用那里提供的导航工具找到一个方便你的测试中心。一旦找到了测试中心，你就可以联系供应商并安排参加认证考试。（测试供应商的联系信息也可以在各自的网站上找到；在某些情况下，你可以在线预约考试。）


    你必须至少提前 24 小时安排认证考试，并在联系测试供应商时，你应准备好提供以下信息：


    *   你的姓名（按你希望出现在认证证书上显示的名称）。

    *   一个身份识别号（如果你以前参加过 IBM 认证考试，这就是当时分配给你的号码；如果没有参加过，测试供应商将为你提供一个）

    *   可以联系到你的电话号码

    *   传真号码

    *   你希望接收所有认证相关邮件（包括你的认证欢迎包）的邮寄地址

    *   你的账单地址（如果与邮寄地址不同）

    *   你的电子邮箱地址

    *   你希望参加的考试编号（例如，`Exam 736`）

    *   你希望使用的支付方式（信用卡或支票）以及任何相关的支付信息（如信用卡号和有效期）

    *   你的公司名称（如适用）

    *   你希望参加认证考试的测试中心

    *   你希望参加认证考试的日期


    在安排参加认证考试之前，你应该准备好纸和铅笔或钢笔，以便记录下测试中心分配给你的考生身份识别号。当你到达测试中心参加认证考试时，你需要这些信息。（如果时间允许，你将收到一封确认信，其中包含你安排参加的考试编号以及相应的日期、时间和位置信息；如果你在计划考试日期前的
    48 小时内注册，将不会收到该信。）


    ![Image](img/paper.jpg) 如果你已经参加过提供的一个或多个认证考试，你应该让测试供应商知晓这一点，并要求他们分配给你之前使用的相同的考生身份识别号。这将使
    IBM 认证团队能够快速识别你何时满足了特定认证角色的所有考试要求。（如果你每次参加考试时都被分配了唯一的考生身份识别号，你应该去 IBM 职业认证会员网站
    `[www.ibm.com/certify/members](http://www.ibm.com/certify/members))` 并选择“会员服务
    (Member Services)”，将你所有的考试结果合并到一个 ID 下。）


    Linux、UNIX 和 Windows 版 DB2 数据库管理升级考试（考试 736）的费用为 75 美元（在美国）。预约程序取决于你选择的考试支付方式。如果你决定通过信用卡支付，可以在向测试供应商提供适当信息后立即安排参加考试。然而，如果你选择通过支票支付，则需要等待收到支票并确认付款后才被允许安排参加考试。（Thompson
    Prometric 建议如果你用支票支付，请在支票正面写上你的注册 ID，并在支票寄出后七个工作日联系他们。届时，他们应该已经收到并确认了你的付款，你就可以安排参加已费用的考试了。）如果由于某些原因你在预约后需要重新安排或取消预约，必须在预定考试时间至少
    24 小时操作。否则，你仍会被收取考试费用。


    在安排参加认证考试当天，你应该在计划开始时间至少 15 分钟到达测试中心签到。作为签到流程的一部分，将被要求提供安排考试时分配给你的身份识别号和两种身份证明。其中一份身份证明必须带有近照，另一份必须显示你的签名。有效身份证明的示例包括驾照（带照片）和信用卡（带签名）。


    签到后，考试管理员将指示你进入测试区域并选择一个空闲的工作站。然后，考试管理员会将你的姓名和身份识别号输入你所选择的工作站，为你提供铅笔和一些纸，并在你准备好后指示你开始考试。


    一旦你完成考试并提交评分，IBM 认证考试测试软件将评估你的答案并生成成绩报告，指示你是否通过了考试。每场认证考试都分为几个部分，无论你通过还是未通过，都应该花几分钟查看你在每个部分获得的分。这些信息可以帮助你评估自己的优缺点；如果你未能通过考试，它可以帮助你识别出在再次考试之前应该花时间复习的领域。


    参加认证考试后不久（通常在五个工作日内），测试供应商会将你的结果以及你的个人统计数据（例如姓名、地址、电话号码）发送给 IBM 认证组进行处理。如果你通过了考试，你将获得该考试对应认证角色的积分；如果你参加的考试完成了针对特定认证角色的概述，你将收到一封电子邮件（发送至你在注册期间提供的邮箱），其中包含
    IBM 认证协议的副本和一个欢迎包，欢迎包中包括一个适合装裱的证书（`PDF` 文件格式）、IBM 认证标志的打印级字体以及使用“IBM 认证”标志的指南。（如果此邮件无法送达，欢迎包将通过普通邮件邮寄给你。）你也可以通过访问收到的邮件中引用的网站并请求，通过普通邮件收到纸质证书以及钱包大小的证书——你会被要求提供
    `Fulfillment ID` 和 `Validation Number`（在邮件中提供）作为你已符合认证要求的证明。


