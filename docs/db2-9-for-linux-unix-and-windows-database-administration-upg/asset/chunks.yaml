  trans: "\n\n*   IBM Certified Solutions Expert—DB2 UDB V7.1 Database Administration\
    \ for UNIX, Windows, and OS/2\n*   IBM Certified Solutions Expert—DB2 UDB V6.1\
    \ Application Development for UNIX, Windows, and OS/2\n*   IBM Certified Specialist—DB2\
    \ UDB V6/V7 User\n\n# 关于本书\n\n本书分为两个部分：\n\n*   第 1 部分 - DB2 UDB 认证 (第 1 章)\n \
    \   该部分包含章 (第 1 章)，旨在向你介绍 IBM 提供的 DB2 专业认证计划。在本章中，你将学习 `IBM Certified Database\
    \ Administrator - DB2 9 for Linux, UNIX, and Windows` 认证角色，并了解为 DB2 9 for Linux,\
    \ UNIX, and Windows 数据库管理升级考试（考试 736）制定的目标。本章还将解释认证过程涉及的各个。\n\n*   第 2 部分 - DB2\
    \ 9 数据库管理概念 (第 2 章–第 7 章)\n    该部分包含六章 (第 2 章 到 第 7 章)，旨在为你提供通过 DB2 9 for Linux,\
    \ UNIX, and Windows 数据库管理升级考试（考试 736）之前需要掌握的概念。\n\n    第 2 章 旨在向你介绍服务器管理的各个方面。在本章中，你将学习如何使用\
    \ `Configuration Advisor` 配置服务器、实例和数据库，以及如何配置客户端通信。你还将学习如何为自动维护配置数据库、如何使用 `Self-Tuning\
    \ Memory Manager`，以及如何限制实用程序的程序以控制其对数据库工作负载的影响。\n\n    第 3 章 旨在教你关于 DB2 9 数据库中数据物理存储的所有必要知识。在本章中，你将学习如何创建\
    \ DB2 9 数据库，并发现 DB2 9 数据库的底层结构是什么，以及该结构如何映射到文件和目录。你还将学习如何创建自动存储表空间、如何使用表（范围）分区进行数据分区，以及如何配置表使用数据行压缩。\n\
    \n    第 4 章旨在为你提供关于支持 XML 的数据库和表的信息。在本章中，你将学习如何启用数据库的 XML 数据存储、如何使用 `XML` 数据类型、如何操纵\
    \ XML 数据并创建 XML 索引、如何使用基础 `XML` 函数，以及在使用 DB2 数据移动实用程序时如何处理 XML 数据。\n\n    第 5\
    \ 章 旨在向你介绍用于监控数据库性能的各种工具。在本章中，你将学习如何配置和使用 `snapshot monitor` 以及如何创建一个或多个事件监视器。你还将学习如何使用\
    \ DB2 问题确定 `Tool - db2pd.`。\n\n    第 6 章 旨在向你介绍数据库备份和恢复的概念，以及 DB2 9 提供的各种工具，这些工具可以将损坏或损坏的数据库恢复到可用且一致的状态。在本章中，你将学习什么是事务日志、事务日志是如何执行的以及如何使用日志文件恢复损坏的数据库。你将学习如何使用\
    \ `Backup` 实用程序制作数据库或表空间的备份映像、如何使用 `Restore` 实用程序执行版本恢复、如何使用 `Roll-forward` 实用程序重新应用存储在日志中的事务记录以执行滚动恢复，以及如何使用\
    \ `Recover` 实用程序使用存储在恢复历史日志文件信息恢复数据库。你还将学习如何设置高可用灾备 (HADR) 环境。\n\n    第 7 章 旨在向你介绍数据库安全概念以及\
    \ DB2 识别的各种授权级别和权限。在本章中，你将学习用户如何以及在何处进行身份验证、权限和许可如何决定用户在操作数据库时可以做什么和不能做什么，以及如何向单个用户和/或用户组授予或取消权限和许可。你还将学习如何使用基于标签的访问控制\
    \ (LBAC) 限制对表中特定列和/行的访问。\n\n本书主要面向具有丰富 DB2 9 工作经验、已获得 IBM Certified Database Administrator—DB2\
    \ V8.1 for Linux, UNIX, and Windows 认证并希望参加（且通过）DB2 9 for Linux, UNIX, and Windows\
    \ 数据库管理升级考试（考试 736）的 IT 专业人员。\n\n# 使用的规范\n\n书中包含了许多 DB2 9 管理命令和 SQL 语句的示例。在演示\
    \ DB2 命令或 SQL 语句时，均使用以下规范：\n\n| [ ] | 方括号内的参数或项目是必需的，必须提供。 |\n| < > | 尖括号内的参数或项目是可选的，不必提供。\
    \ |\n| | | 竖线表示列出的列表中可以指定一个（且仅一个）项目 |\n| ,… | 逗号后跟三个点（省略号）表示可以包含前一个参数的多个实例 |\n\
    \n以下示例说明了每种规范：\n\n# 示例 1\n\n```\nSELECT * FROM TableName [INCREMENTAL | NON INCREMENTAL],\
    \ ...\n```\n\n# 示例 2\n\n```\nCREATE SEQUENCE SequenceName [NO CYCLE | CYCLE] [START\
    \ WITH, INCREMENT BY, MINVALUE, MAXVALUE, CACHE];\n```\n\nSQL 不是一种区分大小写的语言，但为了清晰起见，提供的示例使用了混合大小写——命令语法采用大写字母，而用户提供的元素（如表名和列名）采用小写字母。然而，所示示例可以用任何大小写输入。\n\
    \n尽管书中介绍了了涵盖的大多数 DB2 命令和 SQL 语句的基础语法，但实际支持的语法可能复杂得多。要查看特定命令的完整语法或获取有关特定命令的更多信息，请参考\
    \ IBM DB2, Version 9 Command Reference 产品文档。要查看特定 SQL 语句的完整语法或获取有关特定语句的更多信息，请参考\
    \ IBM DB2, Version 9 SQL Reference, Volume 2 产品文档。\n\n"
