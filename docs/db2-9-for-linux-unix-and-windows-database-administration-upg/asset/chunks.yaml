    一旦你定义了执行安全需求所需的安全策略和标签，并向用户授予了适当的权限和安全标签，就可以修改与安全策略相关的表，并配置其列以实现列级 LBAC 保护。这是通过执行类似下面的
    `ALTER TABLE` 语句完成的：


    ![Image](img/194-1.jpg)


    这里情况变得有点复杂了。如果你尝试以具有 `SYSADM` 或 `SECADM` 权限的用户身份执行所示 `ALTER TABLE` 语句，操作将失败，并且你会看到类似的错误信息：


    ![Image](img/194-2.jpg)


    这是因为唯一能够保护带有“CONFIDENTIAL”安全标签列的用户，是那些授予了对该标签保护的数据具有`write access`的用户。在我们的场景中，这个用户是
    `HR_STAFF`。那么当用户 `HR_STAFF` 尝试执行上述 `ALTER TABLE` 语句时会发生什么？现在产生了略有不同的错误信息：


    ![Image](img/194-3.jpg)


    为什么？因为默认情况下，分配给 `EMPLOYEES` 表的安全策略关联的 LBAC 规则集允许用户 `HR_STAFF` 只能向其被授予相同安全标签保护的列或行写入数据。


    # DB2LBACRULES 规则


    LBAC 规则集是在比较安全标签时使用的预定义规则集。目前，仅支持一种 LBAC 规则集 `(DB2LBACRULES)`，正如我们刚刚看到的，该规则集防止了写向上（write-up）和写向下（write-down）行为。（写向上和写向下仅适用于
    `ARRAY` 安全标签组件且仅适用于写访问）。写向上是指你尝试写入的数据的安全标签高于你被授予的安全标签；写向下是指保护数据的安全标签较低。


    在比较两个安全标签时，实际使用哪些规则取决于使用的组件类型（`SET`、`ARRAY` 或 `TREE`）以及正在尝试的访问类型（读或写）。Table 7.1
    列出了 `DB2LBACRULES` 规则集中的规则，识别了每条规则用于哪种组件，并描述了规则如何确定是否阻止访问。


    ![Image](img/195.jpg)


    # 授予豁免


    那么，如何用适当的安全标签保护 `EMPLOYEES` 表中的其余列呢？安全管理员必须首先授予 `HR_STAFF` 对一个或多个安全策略规则的豁免。当用户持有特定安全策略规则的豁免时，当用户尝试访问受该安全策略保护的数据时，该规则不会生效——安全策略豁免通过执行
    `GRANT EXEMPTION ON RULE` SQL 语句来授予（使用具有 `SECADM` 权限的用户）。该语句的语法为：


    ![Image](img/196-1.jpg)


    其中：


    | `Rule` | 标识要授予豁免的一条或多个 `DB2LBACRULES` 安全策略规则。该参数的以下值均有效：`DB2LBACREADARRAY`、`DB2LBACREADSET`、`DB2LBACREADTREE`、`DB2LBACWRITEARRAY
    WRITEDOWN`、`DB2LBACWRITEARRAY WRITEUP`、`DB2LBACWRITESET`、`DB2LBACWRITETREE` 和
    `ALL.` 。（如果用户对每个安全策略规则都持有豁免，则用户将完全访问所有受该安全策略保护的数据。） |


    | `PolicyName` | 标识要授予豁免的安全策略。 |


    | `UserName` | 标识要授予指定豁免的用户名称。 |


    因此，要为之前创建的名为 `SEC_POLICY` 的安全策略中的 `DB2LBACWRITEARRAY` 规则授予名为 `HR_STAFF` 的用户豁免，你需要执行类似下面的
    `GRANT EXEMPTION` 语句：


    ![Image](img/196-2.jpg)


    一旦授予此豁免以及适当的安全标签，用户 `HR_STAFF` 就可以执行之前所示的 `ALTER TABLE` 语句而不会产生错误。（或者，可以使用以下 `CREATE
    TABLE` 语句来创建 `EMPLOYEES` 表并用适当的安全标签保护每一列，前提是用户 `HR_STAFF` 拥有创建表所需的权限。）


    ![Image](img/197-1.jpg)


    # 列级 LBAC


    现在我们建立了列级 LBAC 环境，让我们看看当用户尝试访问 `EMPLOYEES` 表中受保护列存储的数据时会发生什么。假设用户 `HR_STAFF` 通过执行以下
    SQL 语句向 `EMPLOYEES` 表添加三行。


    ![Image](img/197-2.jpg)


    用户 `HR_STAFF1` 被授予了表中所有列的读/写访问（带有 `SEC_POLICY.CLASSIFIED` 安全标签和 `DB2LBACWRITEARRAY`
    WRITEDOWN 豁免），因此语句执行成功。如果用户 `HR_STAFF` 尝试查询表，他将看到每一列和每一行，因为他被授予了数组中的最高安全级别。


    现在，当用户 `MANAGER1` 尝试读取表中的每一列时，将生成一个错误，说明他对“SSN”列没有“READ”访问。然而，`MANAGER1` 将能够执行以下查询，因为他已被授予了每个指定列的读取访问：


    ![Image](img/198-1.jpg)


    现在，如果用户 `EMPLOYEE1` 尝试执行相同的查询，将生成一个错误，说明他对 `BONUS` 列没有 `READ` 访问。但 `EMPLOYEE1`
    尝试执行以下查询将成功：


    ![Image](img/198-2.jpg)


    此外，如果用户 `MANAGER1` 或用户 `EMPLOYEE1` 尝试插入额外记录或更新现有信息，他们将得到错误，说明他们没有权限对该表执行操作。


    # 结合行级和列级 LBAC


    有时你可能希望限制用户对特定行和列组合的访问。在这种情况下，你必须在表定义中包含数据类型为 `DB2SECURITYLABEL` 的列，在定义中的每个列上添加
    `SECURED WITH` `SecurityLabel` 选项，并使用 `CREATE TABLE` 语句的 `SECURITY POLICY` 子句或
    `ALTER TABLE` 语句的 `ADD SECURITY POLICY` 子句将安全策略与表关联。通常创建两个安全标签组件——一个用于行，一个用于列——并使用这两个组件构造所需的安全策略和标签。


    例如，假设你通过执行以下命令创建了两个安全标签组件：


    ![Image](img/198-3.jpg)


    然后通过执行类似下面的 `CREATE SECURITY POLICY` 命令来创建一个安全策略：


    ![Image](img/199-1.jpg)


    然后你可以通过执行类似下面的命令来创建相应的安全标签：


    ![Image](img/199-2.jpg)


    最后，在将适当的安全标签与单个列关联后，你向每个用户授予适当的安全标签，并进行几次测试以确保数据访问按照预期控制。


