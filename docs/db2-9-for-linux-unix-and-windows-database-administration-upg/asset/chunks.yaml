    # 数据行压缩


    除了表分区和 pureXML 之外，DB2 9 引入的最显著特性之一是能够使用所谓的**数据行压缩**（data row compression）来减少存储表数据所需的存储空间。虽然数据行压缩的主要目的是节省存储空间，但它还能显著减少磁盘
    I/O 开销并提高缓冲池命中率。（内存中可以缓存更多数据。）所有这些都可能导致性能的提升，但并非没有代价——压缩和解压缩数据需要额外的 CPU 周期。


    数据行压缩的工作原理是搜索数据中重复的模式，并将这些模式替换为 12 位符号，这些符号与它们所代表的模式一起存储在静态字典中。（一旦创建了此字典，它就会与压缩数据一起存储在表中，并在每次访问表数据时将其加载到内存中以帮助解压缩。）这是通过扫描整个表并查找重复的列值，以及跨行多列的重复模式来实现的。DB2
    还会查找作为给定列子字符串的重复模式。然而，仅仅发现重复模式并不意味着数据会自动压缩——数据只有在能够实现存储节省的地方才会被压缩。图 3–2 展示了数据行压缩的工作原理。


    ![Image](img/69.jpg)


    *图 3–2：数据行压缩的工作原理。*


    为了在表中使用数据行压缩，必须满足两个前提条件：


    1. 必须在表级启用压缩。

    2. 必须为该表构建压缩字典。


    # 为表启用数据行压缩


    通过执行 `CREATE TABLE` SQL 语句或指定 `COMPRESS YES` 选项的 `ALTER TABLE` 可以在表级启用压缩。例如，如果你想创建一个名为
    `EMPLOYEE` 的新表并启用数据行压缩，你可以通过执行类似下面的 `CREATE TABLE` 语句来实现：


    ![Image](img/70-1.jpg)


    另一方面，如果你想对现有名为 `EMPLOYEE` 的表启用数据行压缩，可以通过执行类似下面的 `ALTER TABLE` 语句来实现：


    ![Image](img/70-2.jpg)


    # 构建压缩字典


    虽然你可以随时通过将表的 `COMPRESS` 属性设置为 `YES,` 来为表启用数据行压缩，但在构建压缩字典之前，存储在表中的数据不会压缩。压缩字典是通过离线表重组操作构建的（表中的数据也会在此被压缩）；此类操作通过执行指定
    `KEEPDICTIONARY` 或 `RESETDICTIONARY` 选项的 `REORG` 命令启动。如果执行指定选项的 `REORG` 命令且不存在压缩字典，则将构建新字典；如果执行指定选项的
    `REORG` 命令且字典已存在，表中的数据将重新重组/压缩，且现有字典将被重建 `(RESETDICTIONARY)` 或保持原样 `(KEEPDICTIONARY)`。


    因此，如果你想为已启用数据行压缩的 `EMPLOYEE` 表创建一个新的压缩字典（并压缩现有数据），你可以通过执行类似下面的 `REORG` 命令来实现：


    ![Image](img/70-3.jpg)


    当执行此命令时，`EMPLOYEE` 表中存储的数据将进行分析，构建压缩字典并存储在表的开头，数据将被压缩并直接写入压缩字典后面的表中。


    需要注意的是，索引数据不受数据行压缩的影响；只有存储在基表页上的数据可以被压缩。然而，由于压缩表中的记录是以压缩形式在存储和内存之间移动的（压缩字典也会移动到内存中以便进行解压缩），写入事务日志文件的压缩表记录也将被压缩。


    # 估算数据行压缩的存储节省


    由于需要离线重组操作来构建压缩字典并执行数据压缩，压缩数据所需的初始开销可能很高。因此，了解哪些表将从数据行压缩中受益最多，哪些表不会受益是有益的。在 DB2
    9 中，Inspect 工具工具可以帮助你做出此判断。通过执行 `INSPECT` 命令调用 Inspect 工具，如果指定 `ROWCOMPESTIMATE`
    选项执行该命令，Inspect 工具将检查指定表中的每一行，从发现的数据构建压缩字典，然后使用该字典估计如果压缩表中的数据将节省多少空间。


