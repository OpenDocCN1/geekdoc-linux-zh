    收到欢迎包后，您将正式获得认证，并可以开始使用 IBM 专业认证称号和商标。（您应该在 IBM 处理考试结果后的四到六周内收到 IBM 认证协议和欢迎包。）然而，如果您未通过考试但仍希望获得认证，必须安排重新考试（包括重新支付测试费用）。参加特定认证考试的次数没有限制；但您在
    30 天内参加同一项认证考试的不能超过两次。


    # 第 2 章：服务器管理


    DB2 9 for Linux, UNIX 和 Windows 数据库管理升级考试（考试 736）中有百分之二十九的比例旨在测试您对基础 DB2 服务器管理的知识。构成这部分内容的题目旨在评估以下内容：


    *   您对 `AUTOCONFIGURE` 命令的理解

    *   您手动配置客户端/服务器连接的能力

    *   您使用自动维护（Automatic Maintenance）的能力

    *   您对实用程序进行节流（throttle utilities）的能力

    *   您使用 DB2 自调优内存管理器（STMM）的能力


    本章旨在向您介绍管理 DB2 9 服务器所需要熟悉的各种概念。本章还将提供有关某些用于服务器管理的工具信息。


    # 实例与数据库配置


    DB2 将世界视为对象的层级结构。安装了 DB2 的工作站（或服务器）处于该层级结构的最高层。当在工作站上安装任何版本的 DB2 时，名为 DB2 数据库管理器（DB2
    Database Manager）的后台进程文件会被物理复制到该工作站的特定位置，在大多数情况下，会创建一个 DB2 数据库管理器实例。实例占据层级结构的第二层，负责管理其控制下的系统资源和数据库。数据库构成第三层，负责管理数据的存储、修改和检索。


    在正常运行期间，DB2 数据库管理器的行为部分由一组定义 DB2 运行环境的值集合控制。其中某些值是操作系统环境变量，另一些是特殊的 DB2 特有系统级值，称为环境变量或注册表变量。除了这套完整的注册表变量外，DB2
    还使用大量的配置参数来控制如何代表实例和数据库分配及利用系统资源。遗憾的是，许多这些配置参数提供的默认值是针对非常简单的系统设计的。（其目标是让 DB2 在几乎任何平台上都能开箱即用，而不是让
    DB2 在其安装的平台上运行处于最佳状态。）因此，尽管这些配置参数提供的默认值足以满足大多数数据库需求，但您通常只需通过更改一个或多个配置参数的值，就能大幅提高整体系统和应用程序性能。


    每当创建一个实例时，作为实例创建过程的一部分，还会创建并初始化相应的 DB2 数据库管理器配置文件。每个 DB2 数据库管理器配置文件由大约 85 个不同的参数值组成，大多数参数控制分配给单个
    DB2 数据库管理器实例的系统资源量。同样，每当创建一个新数据库时，就会创建并初始化相应的数据库配置文件。每个数据库配置文件由大约 105 个不同的参数组成，就像大多数
    DB2 数据库管理器实例配置参数控制分配给单个 DB2 数据库管理器实例的系统资源量一样，许多数据库配置文件参数控制在正常运行期间分配给数据库的系统资源量。


    # 配置顾问 (Configuration Advisor)


    有如此广泛的配置参数供选择，决定从哪里开始以及做出更改可能是困难的。幸运的是，DB2 配备了一个工具帮助您入门；该工具就是配置顾问。配置顾问旨在捕有关数据库环境的特定信息，并根据提供的信息建议或更改配置参数。


    您可以通过控制中心（Control Center）中的数据库（Databases）菜单中选择配置顾问操作来激活配置顾问。图 2–1 显示了配置顾问首次激活时的外观。


    ![Image](img/11.jpg)


    *图 2–1：配置顾问对话框。*


    一旦激活了配置顾问向导，您只需按照每个面板显示的指示描述您的服务器环境，并解释您的数据库典型事务工作负载的情况。当您提供了所需的信息后，配置顾问将提供更改建议，如果应用于实例和/或数据库配置参数，将提高整体性能。此时，向导右下角的“完成”（Finish）按钮（参见图
    2–1）将启用，选择此按钮后即可应用建议的配置参数更改。


    在 DB2 9 中，每当使用创建数据库向导（Create Database Wizard）创建数据库时，配置顾问会被自动调用。（可以通过为注册表变量 `DB2_ENABLE_AUTOCONFIG_DEFAULT`
    赋值 `NO` 来更改此行为。）


    ![Image](img/paper.jpg) 配置顾问（以及 `AUTOCONFIGURE` 命令）基于每个实例仅定义一个数据库的假设做出配置和缓冲池建议。


    # AUTOCONFIGURE 命令


    配置顾问提供的功能也可以通过执行 `AUTOCONFIGURE` 命令获得（该命令底层调用设计顾问 Design Advisor）。该命令的基本语法如下：


    ![Image](img/12.jpg)


    其中：


    *   `Keyword*`：`AUTOCONFIGURE` 命令识别的一个或多个特殊关键字。有效值包括 `mem_percent`、`workload_type`、`num_stmts`、`tpm`、`admin_priority`、`is_populated`、`num_local_apps`、`num_remote_apps`、`isolation`
    和 `bp_resizable`。

    *   `Value*`：标识与提供的关键字关联的值。表 2.1 列出了 AUTOCONFIGURE 命令识别的每个关键字的有效值。


    ### 表 2.1 AUTOCONFIGURE 命令关键字和值


    | 关键字 | 有效值 / 默认值 | 说明 |

    | :--- | :--- | :--- |

    | `mem_percent` | 1-100 默认: 25 | DB2 数据库管理器在执行数据库操作时使用的服务器内存 (RAM) 的百分比。 |

    | `workload_type` | simple, complex, mixed 默认: mixed | 通常在数据库上运行的工作负载类型。有效值如下：simple——数据库主要用于解析查询（例如，数据仓库）；complex——数据库主要用于事务处理（例如，订单输入和
    OLTP）；mixed——数据库用于解析查询和处理事务。简单工作负载倾向于 I/O 密集型且大部分为事务，而复杂工作负载倾向于 CPU 密集型且大部分为查询。
    |

    | `num_stmts` | 1-1,000,000 默认: 10 | 单个事务（即提交之间）内执行的 SQL 语句平均数。注意：如果未知，请选择大于 10
    的数字。 |


