    # 范围分区表


    虽然表空间用于控制数据的物理存储位置，并在数据库对象（如表、索引和视图）与对象数据实际所在的一个或多个容器（即目录、文件或原始设备）之间提供间接层，但数据库对象在创建时分配到表空间的方式决定了数据在磁盘上的物理存储方式。通过利用
    DB2 9 中引入的新功能——表分区，可以进一步控制表数据的物理存储。


    表分区（也称为范围分区）是一种数据组织方案，它根据一或多个列的值，将表数据划分到多个称为数据分区或范围的存储对象中。每个数据分区都单独存储，且所使用的存储对象可以是不同的表空间、同一个表空间，或两者的结合。表分区提高了性能，并消除了使用数据分区功能创建分区数据库的需要。


    使用表分区的其他优势还包括：


    **数据的轻松卷入和卷出。** 卷入分区表数据允许将新范围作为额外的数据分区轻松地合并到分区表中。卷出分区表数据允许你轻松地从分区表中分离数据范围，以便后续的清理或归档。可以使用
    `ALTER TABLE` 语句的 `ATTACH PARTITION` 和 `DETACH PARTITION` 子句快速卷入和卷出数据；一旦卷入，即可通过执行
    `SET INTEGRITY` 语句使新附加的数据分区上线。


    **更易管理大表。** 表级管理变得更加灵活，因为可以在单个数据分区上执行管理任务。此类任务包括数据分区的分离和重新附加、单个数据分区的备份和恢复以及重新组织单个索引。此外，通过将耗时的维护操作分解为一系列较小的操作，可以缩短时间。例如，当每个数据分区放在不同的表空间时，可以在数据分区级别执行备份操作。因此，可以一次备份分区表的一个数据分区。


    **灵活的索引放置。** 通过表分区，索引可以放在不同的表空间，从而对索引的放置进行更细粒度的控制。


    **更好的查询处理。** 在解析查询的过程中，可能会根据使用的查询谓词自动消除一个或多个数据分区。这种功能被称为分区消除（Data Partition Elimination），提高了许多决策支持查询的性能，因为在返回结果集之前需要分析的数据更少。


    来自给定表的数据根据 `CREATE TABLE` 语句中 `PARTITION BY` 子句提供的规范被划分到多个存储对象。该可选子句的语法如下：


    ![Image](img/65.jpg)


    ![Image](img/66.jpg)


    其中：


    | `ColumnName` | 标识一个或多个列，其值将用于确定特定行应存储在哪个数据分区中。（指定的列组构成了表的分区键。） |

    | `PartitionName` | 标识分配给创建的数据分区的唯一名称。 |

    | `Start` | 指定每个数据分区范围的低端。 |

    | `End` | 指定每个数据分区范围的高端。 |


