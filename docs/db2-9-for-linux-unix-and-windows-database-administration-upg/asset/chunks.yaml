  trans: '


    ### 客户端 (CLIENT)

    身份验证在客户端工作站或调用客户端应用程序的数据库分区上进行，使用客户端操作系统提供的安全设施（假设可用）。如果没有可用的安全设施，身份验证将以略有不同的方式处理。想要附加实例或连接到数据库的用户提供的用户
    ID 和密码将与存储在客户端或节点上的用户 ID 和密码组合进行比较，以确定该用户是否允许访问该实例或数据库。


    ### KERBEROS

    身份验证在服务器工作站上进行，使用支持 `Kerberos` 安全协议的安全设施。该协议通过使用传统密码学创建共享密钥，作为第三方服务执行身份验证。该密钥将成为每当请求本地或网络服务时验证用户身份的凭据；这消除了在网络上以
    ASCII 文本形式传输用户 ID 和密码的需求。需要注意的是，`KERBEROS` 身份验证类型仅受 Windows 操作系统的客户端和服务器上。此外，客户端和服务器工作站必须属于同一个
    Windows 域或属于受信任的域。


    ### KRB_SERVER_ENCRYPT

    身份验证在服务器工作站上进行，使用 `KERBEROS` 或 `SERVER_ENCRYPT` 身份验证方法。如果客户端的身份验证类型设置为 `KERBEROS,`，则使用
    Kerberos 安全系统在服务器执行身份验证。另一方面，如果客户端的身份验证类型不是 `KERBEROS,`，或者 Kerberos 身份验证服务不可用，服务器将像指定了
    `SERVER_ENCRYPT` 身份验证类型一样执行此身份验证方法的规则。


    除了这些传统的身份验证类型，DB2 9 还提供了四种新的身份验证类型。它们是：


    #### DATA_ENCRYPT

    身份验证在服务器工作站上进行，使用 `SERVER_ENCRYPT` 身份验证方法。此外，以下数据在从客户端传递到服务器以及从服务器传递到客户端之前：


    *   SQL 和 XQuery 语句。

    *   SQL 程序变量数据。

    *   服务器处理 SQL 语句或 XQuery 表达式的输出数据，包括数据的描述。

    *   响应查询产生的结果集部分或全部数据。

    *   大对象 (LOB) 数据流。

    *   SQLDA 描述符。


    #### DATA_ENCRYPT_CMP

    身份验证在服务器工作站上进行，使用 `SERVER_ENCRYPT` 身份验证方法；所有用户数据在从客户端传递到服务器以及从服务器传递到客户端之前都会加密。此外，此身份验证类型为不支持
    `DATA_ENCRYPT` 身份验证类型的下游产品提供了兼容性。此类产品使用 `SERVER_ENCRYPT` 身份验证类型连接，且用户数据不加密。


    #### GSSPLUGIN

    身份验证在服务器工作站上进行，使用通用安全服务应用程序接口 (GSS-API) 插件。如果未指定客户端的身份验证类型，服务器会将支持的插件列表（在 `srvcon_gssplugin_list`
    数据库管理器配置参数中）返回给客户端。客户端然后从列表中选择客户端插件目录中找到第一个插件。如果客户端不支持列表中的任何插件，则使用 `KERBEROS`
    身份验证方法对客户端进行身份验证。


    #### GSS_SERVER_ENCRYPT

    身份验证在服务器工作站上进行，使用 `GSSPLUGIN` 或 `SERVER_ENCRYPT` 身份验证方法。也就是说，如果客户端身份验证通过 GSS-API
    插件进行，则使用服务器支持插件列表中找到的第一个客户端支持插件对客户端进行身份验证。如果客户端不支持服务器支持插件列表中的任何插件，则使用 `KERBEROS`
    身份验证方法对客户端进行身份验证。如果客户端不支持 Kerberos 安全协议，则使用 `SERVER_ENCRYPT` 身份验证方法对客户端进行身份验证。


    # 权限与权利

    一旦用户通过身份验证并建立了实例的附加或数据库的连接，DB2 数据库管理器将评估分配给用户的任何权限和权利，以确定该用户允许执行的操作。权利 (Privileges)
    授予针对特定数据库资源（如表和视图）执行某些操作的权限。权限 (Authorities) 授予一组权利，或对实例或数据库执行高级管理和维护/实用程序操作的权利。权限和权利可以直接分配给用户，也可以间接地从用户所属组的权限和权利中获得。权限和权利共同控制对实例的
    DB2 数据库管理器、对在该实例控制下运行的一个或多个数据库以及对特定数据库对象的访问。用户只能对他们被授予适当授权（即所需的权限或权利）的对象进行操作。图
    7–1 提供了 DB2 9 识别的权限和权利的分级视图。


    ![Image](img/180.jpg)


    *图 7–1：DB2 9 中可用权限和权利的分级结构。*


    # 使用基于标签的访问控制 (LBAC) 数据

    基于标签的访问控制 (LBAC) 是一种新的安全功能，使用一个或多个安全标签来控制谁对表或视图中的单独行和/列具有读取访问和写入访问。美国和其他许多其他政府使用
    LBAC 模型，根据敏感性对数据分配分级分类标签，如 `CONFIDENTIAL, SECRET,` 和 `TOP SECRET`。对标记为特定级别（例如
    `SECRET)`）的数据访问限制对于授予该级别或更高访问权限的用户。通过 LBAC，你可以构建安全标签来代表公司用于确定谁可以读取或修改特定数据值的任何标准。


    ## 安全管理员权限

    DB2 使用的传统安全方法的一个问题是，安全管理员和数据库管理员可以访问存储在他们管理的数据库中的敏感数据。为了解决这个问题，LBAC 安全管理任务与其他所有任务隔离——只有具有安全管理员
    `(SECADM)` 权限的用户才允许配置 LBAC 元素。


    安全管理员 `(SECADM)` 权限是一种特殊的数据库级权限，允许特殊用户配置各种基于标签的访问控制 (LBAC) 元素，以限制对一个或多个表的访问。被授予此权限的用户允许执行以下任务：


    *   创建和删除安全策略

    *   创建和删除安全标签

    *   向单个用户授予和撤销安全标签（使用 `GRANT SECURITY LABEL` 和 `REVOKE SECURITY LABEL` SQL 语句）

    *   授予和撤销 LBAC 规则豁免

    *   授予和撤销 `SETSESSIONUSER` 权限（使用 `GRANT SETSESSIONUSER` SQL 语句）

    *   转移任何非安全管理员拥有的对象的所有权（通过执行 `TRANSFER OWNERSHIP` SQL 语句）


    其他权限（包括系统管理员权限）无法为用户提供这些能力。


    ## 实现行级 LBAC


    '
- fmt: '

    Before you implement a row-level LBAC solution, you need to have a thorough understanding
    of the security requirement needs. Suppose you have a database that contains company
    sales data, and you want to control how senior executives, regional managers,
    and sales representatives access data stored in a table named `SALES`. Security
    requirements might dictate that access to this data should comply with these rules:


    * Senior executives are allowed to view, but not update, all records in the table.

    * Regional managers are allowed to view and update only records that were entered
    by sales representatives who report to them.

    * Sales representatives are allowed to view and update only records of the sales
    they made.


    Once the security requirements are known, you must then define the appropriate
    security policies and labels, create an LBAC-protected table (or alter an existing
    table to add LBAC protection), and grant the proper security labels to the appropriate
    users.


    ## Defining a security label component


    Security label components represent criteria that may be used to decide whether
    a user should have access to specific data. Three types of security label components
    can exist:


    * A `set` is a collection of elements (character string values) where the order
    in which each element appears is not important.

    * An `array` is an ordered set that can represent a simple hierarchy. In an array,
    the order in which the elements appear is important—the first element ranks higher
    than the second, the second ranks higher than the third, and so on.

    * A `tree` represents a more complex hierarchy that can have multiple nodes and
    branches.


    To create security label components, you execute one of the following `CREATE
    SECURITY LABEL COMPONENT SQL` statements:


    ![Image](images/183-1.jpg)


    or


    ![Image](images/183-2.jpg)


    or


    ![Image](images/183-3.jpg)


    where:


    | `ComponentName` | Identifies the name that is to be assigned to the security
    label component being created. |

    | `StringConstant` | Identifies one or more string constant values that make up
    the valid array, set, or tree of values to be used by the security label component
    being created. |


    Thus, to create a security label component named `SEC_COMP` that contains a set
    of values whose order is insignificant, you would execute a `CREATE SECURITY LABEL
    COMPONENT` statement that looks something like this:


    ![Image](images/183-4.jpg)


    To create a security label component that contains an array of values listed from
    highest to lowest order, you would execute a `CREATE SECURITY LABEL COMPONENT`
    statement that looks something like this:


    ![Image](images/183-5.jpg)


    And to create a security label component that contains a tree of values that describe
    a company’s organizational chart, you would execute a `CREATE SECURITY LABEL COMPONENT`
    statement that looks something like this:


    ![Image](images/184-1.jpg)


    ## Defining a security policy


    Security policies determine exactly how a table is to be protected by LBAC. Specifically,
    a security policy identifies the following:


    * What security label components will be used in the security labels that will
    be part of the policy

    * What rules will be used when security label components are compared (at this
    time, only one set of rules is supported: `DB2LBACRULES`)

    * Which optional behaviors will be used when accessing data protected by the policy


    Every LBAC-protected table must have one (and only one) security policy associated
    with it. Rows and columns in that table can be protected only with security labels
    that are part of that security policy; all protected data access must adhere to
    the rules of that policy. You can have multiple security policies within a single
    database, but you can’t have more than one security policy protecting any given
    table.


    To create a security policy, execute the `CREATE SECURITY POLICY` SQL statement
    as follows:


    ![Image](images/184-2.jpg)


    where:


    | `PolicyName` | Identifies the name that is to be assigned to the security policy
    being created. |

    | `ComponentName` | Identifies, by name, one or more security label components
    that are to be part of the security policy being created. |


    The `[OVERRIDE | RESTRICT] NOT AUTHORIZED WRITE SECURITY LABEL` option specifies
    the action to be taken when a user who is not authorized to write the security
    label explicitly specified with `INSERT` and `UPDATE` statements attempts to write
    data to the protected table. By default, the value of a user’s security label,
    rather than an explicitly specified security label, is used for write access during
    insert and update operations `(OVERRIDE NOT AUTHORIZED WRITE SECURITY LABEL)`.
    If the `RESTRICT NOT AUTHORIZED WRITE SECURITY LABEL` option is used, insert and
    update operations will fail if the user isn’t authorized to write the explicitly
    specified security label to the protected table.


    Therefore, to create a security policy named `SEC_POLICY` that is based on the
    `SEC_COMP` security label component created earlier, you would execute a `CREATE
    SECURITY POLICY` statement that looks something like this:


    ![Image](images/185.jpg)


    ## Defining security labels


    Security labels describe a set of security criteria and are used to protect data
    against unauthorized access or modification. Security labels are granted to users
    who are allowed to access or modify protected data; when users attempt to access
    or modify protected data, their security label is compared to the security label
    protecting the data to determine whether the access or modification is allowed.
    Every security label is part of exactly one security policy, and a security label
    must exist for each security label component found in the security policy.


    Security labels are created by executing the `CREATE SECURITY LABEL` SQL statement.
    The syntax for this statement is:


    ![Image](images/186-1.jpg)


    where:


    | `LabelName` | Identifies the name that is to be assigned to the security label
    being created. The name specified must be qualified with a security policy name
    and must not match an existing security label for the security policy specified.
    |

    | `ComponentName` | Identifies, by name, a security label component that is part
    of the security policy specified as the qualifier for the `LabelName` parameter.
    |

    | `StringConstant` | Identifies one or more string constant values that are valid
    elements of the security label component specified in the `ComponentName` parameter.
    |


    Thus, to create a set of security labels for the security policy named `SEC_POLICY`
    that was created earlier, you would execute a set of `CREATE SECURITY LABEL` statements
    that look something like this:


    ![Image](images/186-2.jpg)


    ## Creating a LBAC-protected table


    Once you have defined the security policy and labels needed to enforce your security
    requirements, you’re ready to create a table and configure it for LBAC protection.
    To configure a new table for row-level LBAC protection, you include a column with
    the data type `DB2SECURITYLABEL` in the table’s definition and associate a security
    policy with the table using the `SECURITY POLICY` clause of the `CREATE TABLE`
    SQL statement.


    So to create a table named `SALES` and configure it for row-level LBAC protection
    using the security policy named `SEC_POLICY` created earlier, you would execute
    a `CREATE TABLE` statement that looks something like this instead:


    ![Image](images/187-1.jpg)


    To configure an existing table named `SALES` for row-level LBAC protection using
    a security policy named `SEC_POLICY,` you would execute an `ALTER TABLE` statement
    that looks like this instead:


    ![Image](images/187-2.jpg)


    However, before you can execute such an `ALTER TABLE` statement, you must be granted
    a security label for write access that is part of the security policy that will
    be used to protect the table (which, in this case is `SEC_POLICY`). Otherwise,
    you won’t be able to create the `DB2SECURITYLABEL` column.


