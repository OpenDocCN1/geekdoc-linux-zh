    \ transaction performance and backup/recovery (both are equally important). |\n\
    | is_populated | yes, no Default: yes | Indicates whether the database currently\
    \ contains data. Valid values are as follows: yes—the database contains data;\
    \ and no—the database does not contain data. |\n| num_local_apps | 0-5,000 Default:\
    \ 0 | Number of local applications that will be connected to the database at one\
    \ time. |\n| num_remote_apps | 0-5,000 Default: 10 | Number of remote applications\
    \ that will be connected to the database at one time. Allocating memory to handle\
    \ all connections needed (both local and remote) ensures that users never have\
    \ to wait for an existing connection to be terminated before they can get connected.\
    \ However, over-allocating memory for connections can result in wasted resources.\
    \ The DB2 Performance Monitor can help you determine how many connections are\
    \ actually acquired within a specified time frame. |\n| isolation | RR, RS, CS,\
    \ UR Default: RR | Isolation level used by most applications that access the database.\
    \ Valid values include the following: RR—Repeatable Read (large number of locks\
    \ acquired for long periods of time); RS—Read Stability (small number of locks\
    \ acquired for long periods of time); CS—Cursor Stability (large number of locks\
    \ acquired for short periods of time); and UR—Uncommitted Read (no locks acquired).\
    \ |\n| bp_resizeable | yes, no Default: yes | Are buffer pools resizable? |\n\n\
    If the `APPLY DB ONLY` clause is specified with the `AUTOCONFIGURE` command, database\
    \ configuration and buffer pool changes recommended by the Design Advisor will\
    \ be applied to the appropriate database configuration file; if the `APPLY DB\
    \ AND DBM` clause is specified, database configuration and buffer pool changes\
    \ recommended will be applied to the database configuration file, and instance\
    \ configuration changes recommended will be applied to the appropriate DB2 Database\
    \ Manager configuration file. If the `APPLY NONE` clause is specified instead,\
    \ change recommendations will be displayed, but not applied.\n\nThus, if you wanted\
    \ to determine the best configuration to use for an OLTP database named `SAMPLE`\
    \ that uses resizable buffer pools and is populated, and you wanted to review\
    \ any configuration changes recommended before applying them to the appropriate\
    \ database configuration file, you could do so by executing an `AUTOCONFIGURE`\
    \ command that looks like this:\n\n![Image](images/14.jpg)\n\nOn the other hand,\
    \ if you wanted to determine the best configuration to use if 60 percent of a\
    \ system’s memory will be available for the DB2 Database Manager to use when performing\
    \ database operations, the instance controlls only one database (named `SAMPLE`),\
    \ and you wanted to automatically update the appropriate configuration files to\
    \ reflect any configuration changes recommended, you could do so by executing\
    \ an `AUTOCONFIGURE` command that looks like this:\n\n![Image](images/15.jpg)\n\
    \n![Image](images/paper.jpg) The `AUTOCONFIGURE` command (and the Design Advisor)\
    \ will always recommend that a database be configured to take advantage of the\
    \ Self-Tuning Memory Manager. However, if you run the `AUTOCONFIGURE` command\
    \ against a database that resides in an instance where the `SHEAPTHRES` configuration\
    \ parameter has been assigned a value other than zero, the sort memory heap database\
    \ configuration parameter (`SORTHEAP`) will not be configured for automatic tuning.\
    \ Therefore, you must execute the command `UPDATE DATABASE MANAGER CONFIGURATION\
    \ USING SHEAPTHRES 0` before you execute the `AUTOCONFIGURE` command if you want\
    \ to enable sort memory tuning.\n\n# Configuring Communications\n\nIn a typical\
    \ client/server environment, databases stored on a server are accessed by applications\
    \ stored on remote client workstations using what is known as a distributed connection.\
    \ In addition to providing client applications with a way to access a centralized\
    \ database located on a remote server, a distributed connection also provides\
    \ a way for administrators to manage databases and servers remotely.\n\nWhen DB2\
    \ is installed on a workstation, it is automatically configured to take advantage\
    \ of any communications protocols that have been set up for that particular workstation\
    \ (provided the protocols found are recognized by DB2). At that time, information\
    \ about each supported communications protocol available is collected and stored\
    \ in the configuration files for both the DAS instance and the default instance\
    \ as they are created. However, this information is not updated automatically\
    \ when a new protocol is activated or when an existing protocol is reconfigured.\
    \ Instead, you must manually configure communications for each instance before\
    \ such changes will be reflected.\n\n# Manually Configuring Communications\n\n\
    The easiest way to manually configure communications or make communications configuration\
    \ changes is by using the Setup communications dialog, which can be activated\
    \ by selecting the appropriate action from the Instances menu found in the Control\
    \ Center. [Figure 2–2](#012_Chapter02.xhtml_img2_2) shows how the Setup communications\
    \ dialog might be used to configure the TCP/IP protocol for a particular instance.\n\
    \n![Image](images/16.jpg)\n\n*Figure 2–2: The Setup communications dialog and\
    \ the Configure TCP/IP dialog.*\n\nIf you choose to manually configure communications\
    \ without using the Setup communications dialog, the steps you must follow can\
    \ vary according to the communications protocol being used. For example, if you\
    \ wanted to configure a server to use TCP/IP, you would have to perform the following\
    \ steps (in any order):\n\n1. Assign the value `TCPIP` to the `DB2COMM` registry\
    \ variable.\n\n   Whenever you manually configure communications for a server,\
    \ you must update the value of the `DB2COMM` registry variable before an instance\
    \ can begin using the desired communications protocol. The value assigned to the\
    \ `DB2COMM` registry variable is used to determine which communications managers\
    \ will be activated when the DB2 Database Manager for a particular instance is\
    \ started.\n\n   The `DB2COMM` registry variable is assigned the value `TCPIP`\
    \ by executing a `db2set` command that looks something like this:\n\n   ![Image](images/17-1.jpg)\n\
    \n2. Assign the name of the TCP/IP port that the database server will use to receive\
    \ communications from remote clients to the `svcename` parameter of the DB2 Database\
    \ Manager configuration file.\n\n   The `svcename` parameter should be set to\
    \ the service name associated with the main connection port so that when the database\
    \ server is started, it can determine which port to listen on for incoming connection\
    \ requests. This parameter is set by executing an `UPDATE DATABASE MANAGER CONFIGURATION`\
    \ command that looks something like this:\n\n   ![Image](images/17-2.jpg)\n\n\
    3. Update the services file on the database server, if appropriate.\n\n   The\
    \ TCP/IP services file identifies the ports that server applications will listen\
    \ on for client requests. If you specified a service name in the `svcename` parameter\
    \ of the DB2 Database Manager configuration file, the appropriate service name-to-port\
    \ number/protocol mapping must be added to the services file on the server. (If\
    \ you specified a port number in the `svcename` parameter, the services file does\
    \ not need to be updated.)\n"
