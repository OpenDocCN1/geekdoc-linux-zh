    # DB2 问题确定工具


    DB2 问题确定工具用于从 DB2 数据库系统内存集中获取快速、直接的信息，无需获取任何锁（latches）。在不获取锁的情况下收集信息有两个优点：数据检索速度更快，且不竞争引擎资源。然而，由于
    DB2 问题确定工具直接与内存交互，可能会检索到在收集过程中发生变化的信息；因此，检索的数据可能不完全准确。（使用信号处理程序是为了防止 DB2 问题确定工具在遇到变化的内存指针时异常终止。但是，这可能会导致输出中出现如“数据结构变化导致强制命令终止”之类的消息。）尽管如此，该工具对于问题确定非常有帮助。


    ![Image](img/paper.jpg) 如果你想在发生特定的 SQLCODE、ZRC 码或 ECF 码时捕获有关数据库管理系统的信息，可以使用 `db2pdcfg
    -catch` 命令完成此。（`db2pdcfg` 命令可用于设置 DB2 数据库内存集中的标志以影响数据库系统行为。）当错误被捕获时，会启动 DB2 回调脚本
    `db2cos`。该脚本可以动态修改，以运行任何 `db2pd` 命令、操作系统命令或任何识别和解决问题所需的命令。


    通过执行 `db2pd` 命令调用 DB2 问题确定工具。该命令的基本语法如下：


    ![Image](img/137.jpg)


    其中：


    | DatabaseName* | 通过名称标识 DB2 问题确定工具与之交互的数据库。 |

    | ProcessID* | 通过 ID 标识要生成堆栈跟踪文件的进程。 |


