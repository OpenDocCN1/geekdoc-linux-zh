    # A word about the SNAP_WRITE_FILE() stored procedure


    One of the drawbacks of using the special administrative views or SQL table functions
    to view snapshot monitor data is that users who do not have `SYSADM, SYSCTRL,
    SYSMAINT,` or `SYSMON` authority, are prevented from accessing the data collected.
    To get around this problem, a special stored procedure called the `SNAP_WRITE_FILE()`
    procedure can be used to capture snapshots of monitor data and save the information
    collected to files on the database server. Once the snapshot data has been saved
    to a file, any user can issue queries with the corresponding snapshot table functions,
    specifying `(NULL, NULL)` as input values for database-level table functions,
    and `(NULL)` for database manager level table functions. The monitor data they
    receive is pulled from the files generated by the `SNAP_WRITE_FILE()` stored procedure.


    The syntax used to invoke the `SNAP_WRITE_FILE()` stored procedure is:


    ![Image](images/129-1.jpg)


    where:


    | `RequestType` | Identifies a specific snapshot request type, which is used to
    determine the scope of monitor data that is to be collected. The following values
    are valid for this parameter: `APPL_ALL, BUFFERPOOLS_ALL, DB2, DBASE_ALL, DBASE_LOCKS,
    DBASE_TABLES, DBASE_TABLESPACES,` and `DYNAMIC_SQL.` |

    | `DBName` | Identifies the database for which snapshot monitor data is to be
    collected. |

    | `PartitionNum` | Identifies the database partition for which snapshot monitor
    data is to be collected. |


    Thus, if you wanted to collect snapshot monitor information on the DB2 Database
    Manager (defaulting to the currently connected database and current database partition)
    using the `SNAP_WRITE_FILE()` stored procedure, you could do so by executing a
    `CALL` statement that looks like this:


    ![Image](images/129-2.jpg)


    Once this statement is executed, you can retrieve and display the snapshot data
    collected by executing a query that looks something like this:


    ![Image](images/129-3.jpg)


    # Event Monitors


    Whereas the snapshot monitor provides a method for recording information about
    the state of database activity at a given point in time, an event monitor can
    be used to record information about database activity when an event or transition
    occurs. Therefore, event monitors provide a way to collect monitor data when events
    or activities that cannot be monitored using the snapshot monitor occur. For example,
    suppose you want to capture monitor data whenever a deadlock cycle occurs. If
    you are familiar with the concept of deadlocks, you may recall that a special
    process known as the deadlock detector runs quietly in the background and “wakes
    up” at predefined intervals to scan the locking system in search of a deadlock
    cycle. If a deadlock cycle exists, the deadlock detector randomly selects one
    of the transactions involved in the cycle to roll back and terminate. (The transaction
    that is rolled back and terminated receives an SQL error code, all locks it had
    acquired are released, and the remaining transaction or transactions are then
    allowed to proceed.) Information about such a series of events cannot be captured
    by the snapshot monitor because, in all likelihood, the deadlock cycle will have
    been broken long before a snapshot can be taken. An event monitor, on the other
    hand, could be used to capture such information because it would be activated
    the moment the deadlock cycle was detected.


    ![Image](images/paper.jpg) By default, whenever a DB2 9 database is created, a
    deadlock event monitor named `DB2DETAILDEADLOCK` is defined for that database;
    the `DB2DETAILDEADLOCK` event monitor starts automatically when a connection to
    the database is established, or whenever the database is activated. When this
    monitor is active, diagnostic information is collected on the first occurrence
    of a deadlock, allowing for investigation into the cause without requiring a reproduction.


    If this monitor is deleted and no other deadlock event monitor exists, you can
    still troubleshoot locking issues using the `SYSIBMADM.SNAPLOCK` and `SYSIBMADM.SNAPLOCKWAIT`
    snapshot monitor administrative views (or the corresponding `SNAP_GET_LOCK()`
    and `SNAP_GET_LOCKWAIT()` snapshot monitor table functions).


    Unlike the snapshot monitor, which resides in the background and is always available,
    event monitors are special objects that must be created. You create event monitors
    by executing the `CREATE EVENT MONITOR` SQL statement. The basic syntax for this
    statement is:


    ![Image](images/131.jpg)


    where:


    | `EventMonName` | Identifies the name to be assigned to the event monitor that
    is to be created. |

    | `EventCondition` | Identifies a condition that is used to determine for which
    `CONNECTION, STATEMENT,` or `TRANSACTION` events monitor data is to be collected.
    |

    | `TableName` | Identifies the name assigned to the database table to which all
    event monitor data collected is to be written. |

    | `PipeName` | Identifies the name assigned to the named pipe to which all event
    monitor data collected is to be written. |

    | `DirectoryName` | Identifies the name assigned to the directory to which one
    or more files containing event monitor data are to be written. |


    As you can see by examining the syntax of the `CREATE EVENT MONITOR` statement,
    when an event monitor is created, the type of event to be monitored must be specified;
    [Table 5.3](#015_Chapter05.xhtml_tab5_3) lists the event types available, along
    with the type of information that is collected for each type and details on when
    the data is actually collected.


    | Table 5.3 Event Monitor Types |


    | Event Type | Data Collected | When Data Is Collected |

    | :--- | :--- | :--- |

    | DATABASE | The values of all database level counters. | When the database is
    deactivated or when the last application connected to the database disconnects.
    |

    | BUFFERPOOLS | The values of all buffer pool counters, prefetchers, and page
    cleaners, as well as direct I/Os for each buffer pool used. | When the database
    is deactivated or when the last application connected to the database disconnects.
    |

    | TABLESPACES | The values of all buffer pool counters, prefetchers, page cleaners,
    and direct I/Os for each table space used. | When the database is deactivated
    or when the last application connected to the database disconnects. |

    | TABLES | The number of rows read and the number of rows written for each table.
    | When the database is deactivated or when the last application connected to the
    database disconnects. |

    | DEADLOCKS | Comprehensive information regarding applications involved, including
    the identification of participating SQL statements (along with statement text)
    and a list of locks being held. | When a deadlock cycle is detected. |

    | CONNECTIONS | The values of all application level counters. | When an application
    that is connected to the database disconnects. |

    | STATEMENTS | Statement start/stop time, amount of CPU used, text of dynamic
    SQL statements, SQLCA (the return code of the SQL statement), and other metrics
    such as fetch count. For partitioned databases: amount of CPU used, execution
    time, table information, and table queue information. | When an SQL statement
    finishes executing. For partitioned databases: when a subsection of an SQL statement
    finishes executing. |

    | TRANSACTIONS | Transaction start/stop time, previous transaction time, and amount
    of CPU consumed, along with locking and logging metrics. (Transaction records
    are not generated if database is using two-phase commit processing and an X/Open
    XA Interface.) | When a transaction is terminated (by a `COMMIT` or a `ROLLBACK`
    statement). |

