    | `TablespaceName` | 标识分配给要修改的表空间的名称。 |

    | `IncSize` | 标识当启用自动调整大小的表空间满满并请求更多空间时，自动增加的增加量。 |

    | `MaxSize` | 标识启用自动调整大小的表空间可以自动增加到的最大尺寸。 |


    因此，如果您想更改名为 `TBSP1` 的现有 DMS 表空间，使其自动增长到 1000 MB 的最大尺寸，可以执行如下所示 `ALTER TABLESPACE`
    SQL 语句：


    ![Image](img/81-2.jpg)


    # 问题 6


    正确答案是 **B.** 由于没有指定最大尺寸（使用 `CREATE TABLESPACE` 语句的 `MAXSIZE` 选项），默认使用 `MAXSIZE
    NONE`，并且对表空间的大小没有限制。


    # 问题 7


    正确答案是 **D.** 来自给定表的数据根据 `CREATE TABLE` 语句中 `PARTITION BY` 子句提供的规范被分区到多个存储对象。该可选子句的语法如下：


    ![Image](img/81-3.jpg)


    ![Image](img/82.jpg)


    其中：


    | 列 | 描述 |

    | :--- | :--- |

    | `ColumnName` | 通过名称标识一个或多个列，其值将用于确定特定行存储在哪个数据分区中。（指定的列组构成了表的分区键。） |

    | `PartitionName` | 标识分配给要创建的数据分区的唯一名称。 |

    | `Start` | 指定每个数据分区范围的低端。 |

    | `End` | 指定每个数据分区范围的高端。 |

    | `Constant` | 当使用自动生成的语法形式时，指定每个数据分区范围的宽度。数据分区将从 `STARTING FROM` 值开始创建，并包含该范围内相应数量的值。这种形式的语法仅当分区键由单个已分配数值、日期、时间或时间戳数据类型的列组成时才支持。
    |

    | `DurationLabel` | 如果分区键列已分配了日期、时间或时间戳数据类型，则标识与指定的 `Constant` 值相关的持续时间。该参数的有效值为：`YEAR,
    YEARS, MONTH, MONTHS, DAY, DAYS, HOUR, HOURS, MINUTE, MINUTES, SECOND, SECONDS,
    MICROSECOND, and MICROSECONDS`。 |

    | `TableSpaceName` | 标识每个数据分区存储的表空间。 |


    因此，如果您想创建一个名为 `PARTS` 的表，并进行分区使得数值落在 0 到 33 范围内的行被存储在位于一个表空间的的分区中，数值落在 34 到 66
    范围内的行存储在位于另一个表空间的另一个分区中，依此类推，您可以执行类似所示的 `CREATE TABLE` SQL 语句：


    ![Image](img/83-1.jpg)


    # 问题 8


    正确答案是 **A.** 当为范围分区表创建索引时，除非另有指定，否则该索引的数据将存储在用于存放第一个分区数据的表空间中。由于在示例中使用了以下 `CREATE
    INDEX` SQL 语句为 `SALES` 表创建索引：


    ![Image](img/83-2.jpg)


    名为 `SALES_IDX` 的索引数据将存储在名为 `TBSP0` 的表空间中。


    # 问题 9


    正确答案是 **B** 和 **C.** 可以使用 `ALTER TABLE` 语句的 `ATTACH PARTITION` 子句轻松地将新范围合并到分区表中；一旦合并（roll
    in），通过执行 `SET INTEGRITY` 语句即可使新附加的数据分区上线。


    # 问题 10


    正确答案是 **D.** 表分区提高了性能，并消除了需要使用数据分区功能（Data Partitioning Feature）创建分区数据库的需求。使用表分区的其他优势包括：数据易于载入和导出、大表更容易管理、灵活的索引放置以及更好的查询处理。


    # 问题 11


    正确答案是 **B.** 为了对表使用数据行压缩，必须满足两个前提条件：


    1. 必须在表级别启用压缩。

    2. 必须为表构建压缩字典。


    # 问题 12


    正确答案是 **D.** 索引数据不受数据行压缩的影响；只有存储在基础表上的数据可以被压缩。然而，由于压缩表中的记录以压缩形式在存储和内存之间移动（压缩字典也会移动到内存中以便解压缩），写入事务日志文件的压缩表记录也将被压缩。


    # 问题 13


    正确答案是 **A** 和 **C.** 虽然可以通过将其 `COMPRESS` 属性设置为 `YES` 来随时对表启用数据行压缩，但在构建压缩字典之前，存储在表中的数据不会被压缩。通过执行离线表重组操作可以构建压缩字典（并压缩表中的数据）；此类操作通过执行指定了
    `KEEPDICTIONARY` 或 `RESETDICTIONARY` 选项的 `REORG` 命令来启动。

