- fmt: "\nIBM recommends that you use identical host computers for the HADR primary\
    \ and standby databases. (If possible, they should be manufactured by the same\
    \ vendor and have the same architecture.) Furthermore, the operating system on\
    \ the primary and standby database servers should be the same version, including\
    \ patch level. You can violate this rule for a short time during a rolling upgrade,\
    \ but use extreme caution when doing so. A TCP/IP interface must also be available\
    \ between the HADR host machines, and a high-speed, high-capacity network should\
    \ be used to connect the two.\n\nThe DB2 software installed on both the primary\
    \ and the standby database server must have the same bit size (32 or 64), and\
    \ the version of DB2 used for the primary and standby databases must be identical;\
    \ for example, both must be either version 8 or version 9. During rolling upgrades,\
    \ the modification level (for example, the fix pack level) of the database system\
    \ for the standby database can be later than that of the primary database for\
    \ a short while. However, you should not keep this configuration for an extended\
    \ period of time. The primary and standby databases will not connect to each other\
    \ if the modification level of the database system for the primary database is\
    \ later than that of the standby database. Therefore, fix packs must always be\
    \ applied to the standby database system first.\n\nBoth the primary and the standby\
    \ database must be a single-partition database, and they both must have the same\
    \ database name; however, they do not have to be stored on the same database path.\
    \ The amount of storage space allocated for transaction log files should also\
    \ be the same on both the primary and the standby database server; the use of\
    \ raw devices for transaction logging is not supported. (Archival logging is performed\
    \ only by the current primary database.)\n\nTable space properties such as table\
    \ space name, table space type (DMS, SMS, or Automatic Storage), table space page\
    \ size, table space size, container path, container size, and container type (raw\
    \ device, file, or directory) must be identical on the primary and standby databases.\
    \ When you issue a table space statement such as `CREATE TABLESPACE`, `ALTER TABLESPACE`,\
    \ or `DROP TABLESPACE` on the primary database, it is replayed on the standby\
    \ database. Therefore, you must ensure that the table space containers involved\
    \ with such statements exist on both systems before you issue the table space\
    \ statement on the primary database. (If you create a table space on the primary\
    \ database, and log replay fails on the standby database because the containers\
    \ are not available, the primary database does not receive an error message stating\
    \ that the log replay failed.) Automatic storage databases are fully supported,\
    \ including replication of `ALTER DATABASE` statements. Similar to table space\
    \ containers, the storage paths specified must exist on both the primary and the\
    \ standby server.\n\nOnce an HADR environment has been established, the following\
    \ restrictions apply:\n\n* Reads on the standby database are not supported; clients\
    \ cannot connect to the standby database.\n* Self Tuning Memory Manager (STMM)\
    \ can be run only on the current primary database.\n* Backup operations cannot\
    \ be performed on the standby database.\n* Redirected restore is not supported.\
    \ That is, HADR does not support redirecting table space containers. However,\
    \ database directory and log directory changes are supported.\n* Load operations\
    \ with the `COPY NO` option specified are not supported.\n\n# Setting Up an HADR\
    \ Environment\n\nThe process of setting up an HADR environment is fairly straightforward.\
    \ After ensuring that the systems to be used as primary and secondary server are\
    \ identical and that a TCP/IP connection exists between them, you simply perform\
    \ the following tasks, in the order shown:\n\n1. Determine the host name, host\
    \ IP address, and the service name or port number for both the primary and the\
    \ secondary database server.\n\n   If a server has multiple network interfaces,\
    \ ensure that the HADR host name or IP address maps to the intended interface.\
    \ You will need to allocate separate HADR ports for each protected database—these\
    \ cannot be the same as the ports that have been allocated to the instance. The\
    \ host name can map to only one IP address.\n\n2. Create the standby database\
    \ by restoring a backup image or initializing a split mirror copy of the database\
    \ that is to serve as the primary database.\n\n   It is recommended that you do\
    \ not issue the `ROLLFORWARD DATABASE` command on the standby database after the\
    \ restore operation or split mirror initialization. The results of performing\
    \ a roll-forward recovery operation might differ slightly from replaying the logs\
    \ on the standby database using HADR. If the primary and standby databases are\
    \ not identical when HADR is started, an error will occur.\n\n   When setting\
    \ up the standby database using the `RESTORE DATABASE` command, it is recommended\
    \ that the `REPLACE HISTORY FILE` option be used; use of the following options\
    \ should be avoided: `TABLESPACE`, `INTO`, `REDIRECT`, and `WITHOUT ROLLING FORWARD.`\n\
    \n3. Set the HADR configuration parameters on both the primary and the standby\
    \ databases.\n\n   After the standby database has been created, but before HADR\
    \ is started, the HADR configuration parameters shown in [Table 7.2](#016_Chapter06.xhtml_tab7_2)\
    \ need to be set.\n\n   | Table 7.2 HADR-Specific Database Configuration Parameters\
    \ | | |\n   | :--- | :--- | :--- |\n   | **Parameter** | **Value Range / Default**\
    \ | **Description** |\n   | `hadr_db_role` | N/A | Read-only. Indicates the current\
    \ role of the database, if it is part of a high availability disaster recovery\
    \ (HADR) environment. Valid values are STANDARD, PRIMARY, or STANDBY. |\n   |\
    \ `hadr_local_host` | Any valid character string Default: NULL | Specifies the\
    \ local host for high availability disaster recovery (HADR) TCP communication.\
    \ Either a host name or an IP address can be used. |\n   | `hadr_local_svc` |\
    \ Any valid character string Default: NULL | Specifies the TCP service name or\
    \ port number for which the local high availability disaster recovery (HADR) process\
    \ accepts connections. |\n   | `hadr_remote_host` | Any valid character string\
    \ Default: NULL | Specifies the TCP/IP host name or IP address of the remote high\
    \ availability disaster recovery (HADR) node. |\n   | `hadr_remote_inst` | Any\
    \ valid character string Default: NULL | Specifies the instance name of the remote\
    \ server. Administration tools, such as the Control Center, use this parameter\
    \ to contact the remote server. High availability disaster recovery (HADR) also\
    \ checks whether a remote database requesting a connection belongs to the declared\
    \ instance. |\n   | `hadr_remote_svc` | Any valid character string Default: NULL\
    \ | Specifies the TCP service name or port number that will be used by the remote\
    \ high availability disaster recovery (HADR) node. |\n   | `hadr_syncmode` | SYNC,\
    \ NEARSYNC, ASYNC Default: NEARSYNC | Specifies the synchronization mode to use\
    \ for high availability disaster recovery (HADR). This determines how primary\
    \ log writes are synchronized with the standby database when the systems are in\
    \ peer state. Valid values for this configuration parameter are SYNC (this mode\
    \ provides the greatest protection against transaction loss, but at a higher cost\
    \ of transaction response time), NEARSYNC (this mode provides somewhat less protection\
    \ against transaction loss, in exchange for a shorter transaction response time\
    \ than that of SYNC mode), and ASYNC (this mode has the highest probability of\
    \ transaction loss in the event of primary failure, in exchange for the shortest\
    \ transaction response time among the three modes). |\n   | `hadr_timeout` | 1-4,294,967,295\
    \ Default: 120 | Specifies the time (in seconds) that the high availability disaster\
    \ recovery (HADR) process waits before considering a communication attempt to\
    \ have failed. |\n\n4. Connect to the standby instance and start HADR on the standby\
    \ database.\n"
