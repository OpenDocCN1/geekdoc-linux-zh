    # Question 8


    The correct answer is `C`. The DB2 Problem Determination tool (`db2pd`) is used
    to obtain quick and immediate information from the DB2 database system memory
    sets, without acquiring any latches. Two benefits to collecting information without
    latching include faster data retrieval and no competition for engine resources.
    However, because the DB2 Problem Determination tool works directly with memory,
    it is possible to retrieve information that is changing as it is being collected;
    hence the data retrieved might not be completely accurate. (A signal handler is
    used to prevent the DB2 Problem Determination tool from aborting abnormally when
    changing memory pointers are encountered. However, this can result in messages
    such as “Changing data structure forced command termination” to appear in the
    output produced.) Nonetheless, this tool can be extremely helpful for problem
    determination.


    There is no minimum connection requirement for executing the `db2pd` command;
    if a database-level option is specified, that database must be active before the
    requested information can be returned. The `db2pd` command cannot be used to obtain
    information about a stopped instance.


    # Question 9


    The correct answer is `C`. The DB2 memory tracker utility is used to produce a
    complete report of memory status for instances, databases and agents. This utility
    provides the following information about memory pool allocation:


    * Current size

    * Maximum size (hard limit)

    * Largest size (high water mark)

    * Type (identifier indicating function for which memory will be used)

    * Agent who allocated pool (only if the pool is private)


    (This information is also available from the Snapshot monitor.)


    The DB2 memory tracker is invoked by executing the `db2mtrk` command.


    # Question 10


    The correct answer is `B`. The `-recovery` option of the `db2pd` command is used
    to specify that information about recovery activity is to be collected and displayed.
    If you take a close look at the on-line help for this option, you will discover
    that when this option is used, the following information is returned:


    | Option | Meaning |

    | :--- | :--- |

    | Recovery Status | The internal recovery status. |

    | Current Log | The current log being used by the recovery operation. |

    | Current LSN | The current log sequence number. |

    | Job Type | The type of recovery being performed. The possible values are: •
    Crash recovery. • Roll-forward recovery on either the database or a table space.
    |

    | Job ID | The job identifier. |

    | Job Start Time | The time the recovery operation started. |

    | Job Description | A description of the recovery activity. The possible values
    are: • Table space Roll-forward Recovery • Database Roll-forward Recovery • Crash
    Recovery |

    | Invoker Type | How the recovery operation was invoked. The possible values are:
    • User • DB2 |

    | Total Phases | The number of phases required to complete the recovery operation.
    |

    | Current phase | The current phase of the recovery operation. |

    | Phase | The number of the current phase in the recovery operation. |

    | Forward phase | The first phase of roll-forward recovery. This phase is also
    known as the REDO phase. |

    | Backward phase | The second phase of roll-forward recovery. This phase is also
    known as the UNDO phase. |

    | Metric | The units of work. The possible values are: • Bytes. • Extents. • Rows.
    • Pages. • 5. Indexes |

    | TotWkUnits | The total number of units of work (UOW) to be done for this phase
    of the recovery operation. |

    | TotCompUnits | The total number of UOWs that have been completed. |


    The `-utilities` option is used to specify that information about utilities is
    to be collected and displayed; the `-transactions` option is used to specify that
    information about active transactions is to be collected and displayed; and the
    `-log` option is used to specify that information about transaction log files
    is to be collected and displayed.


