    # db2move and db2look


    It’s easy to see how the Export utility can be used together with the Import utility
    to copy a table from one database to another. But what if you want to copy several
    tables or an entire database? In this case, data can be copied on a table-by-table
    basis using the Export and Import or Load utilities (if PC Integrated Exchange
    Format (IXF) formatted files are used, the table structure and any associated
    indexes will be copied as well), but a more efficient way to copy an entire DB2
    database is by using the `db2move` utility. This utility queries the system catalog
    tables of the specified database and compiles a list of all user tables found.
    It then exports the contents and table structure of each table in the database
    to individual PC Integrated Exchange Format (IXF) formatted files. The set of
    files produced can then be imported or loaded to another DB2 database on the same
    system, or they can be transferred to another workstation and be imported or loaded
    to a DB2 database residing there.


    The `db2move` utility can be run in one of four different modes: `EXPORT`, `IMPORT`,
    `LOAD,` or `COPY.` When run in `EXPORT` mode, `db2move` invokes the Export utility
    to extract data from one or more tables and externalize it to PC Integrated Exchange
    Format (IXF) formatted files. It also produces a file named `db2move.lst` that
    contains the names of all tables processed, along with the names of the files
    to which each table’s data was written. Additionally, the `db2move` utility may
    also produce one or more message files that contain warning or error messages
    that were generated as a result of the Export operation.


    When run in `IMPORT` mode, `db2move` invokes the Import utility to recreate each
    table and their associated indexes using information stored in PC Integrated Exchange
    Format (IXF) formatted files. When run in this mode, the file `db2move.lst` is
    used to establish a link between the PC Integrated Exchange Format (IXF) formatted
    files needed and the tables into which data is to be imported.


    When run in `LOAD` mode, `db2move` invokes the Load utility to populate tables
    that already exist with data stored in PC Integrated Exchange Format (IXF) formatted
    files. Again, the file `db2move.lst` is used to establish a link between the PC
    Integrated Exchange Format (IXF) formatted files needed and the tables into which
    data is to be loaded.


    Unfortunately, the `db2move` utility can be used to migrate only table and index
    objects. If the database to be migrated contains other objects such as aliases,
    views, triggers, user-defined data types (UDTs), user-defined functions (UDFs),
    and so on, you must to duplicate those objects in the target database as well
    if you want to have an identical copy of the source database. That is where the
    `db2look` utility comes in. When invoked, `db2look` can reverse-engineer an existing
    database and produce a set of Data Definition Language (DDL) SQL statements, which
    can then be used to recreate all of the data objects found in the database that
    was analyzed. The basic syntax for the `db2look` command is:


    ![Image](images/109.jpg)


    where:


    | `DatabaseAlias` | Identifies the alias assigned to the database that DDL statements
    are to be generated for. |

    | `Creator` | Identifies the creator ID that is to be used to limit DDL output.
    DDL output will be limited to objects that were created by this ID. |

    | `Schema` | Identifies the schema that is to be used to limit DDL output. DDL
    output will be limited to objects that reside in this schema. |

    | `TableName` | Identifies one or more tables, by name, for which DDL statements
    are to be generated. |

    | `ViewName` | Identifies one or more views, by name, for which DDL statements
    are to be generated. |

    | `FileName` | Identifies, by name, a file that all DDL output produced is to
    be written to. |

    | `Directory` | Identifies the location where XML-related files are to be written
    to. If this option is not specified, all XML-related files will be exported into
    the current directory. |


    All other options shown with this command are described in [Table 4.3](#014_Chapter04.xhtml_tab4_3).


    | Table 4.3 db2look Command Options |

    | Option | Meaning |

    | :--- | :--- |

    | `-e` | Indicates that DDL statements are to be extracted for the following database
    objects: tables, views, materialized query tables (MQTs), aliases, indexes, triggers,
    sequences, user-defined distinct types, select constraints (primary key, referential
    integrity, and check constraints), user-defined structured types, user-defined
    functions, user-defined methods, user-defined transforms, wrappers, servers, user
    mappings, nicknames, type mappings, function templates, function mappings, index
    specifications, and stored procedures. |

    | `-ct` | Indicates that DDL statements are to be generated by object creation
    time. |

    | `-a` | Indicates that DDL statements are to be generated for all objects, including
    inoperative objects, regardless of who created them. |

    | `-x` | Indicates that authorization DDL statements (GRANT, REVOKE) are to be
    generated. |

    | `-xd` | Indicates that all authorization DDL statements, including authorization
    DDL statements for objects whose authorizations were granted by SYSIBM at object
    creation time, are to be generated. |

    | `-f` | Indicates that commands needed to set configuration parameters and registry
    variables that affect the query optimizer are to be generated. |

    | `-xs` | Indicates that all files necessary to register XML schemas and Document
    Type Definitions (DTDs) at the target database are to be exported and appropriate
    commands for registering them are to be generated. |

    | `-h` | Displays help information. When this option is specified, all other options
    are ignored, and only the help information is displayed. |


