    If you’ve bought this book (or if you are thinking about buying this book), chances
    are you have already decided you want to acquire one or more of the IBM DB2 professional
    certifications available. As an individual who holds twelve IBM DB2 professional
    certifications, let me assure you that the exams you must pass in order to become
    a certified DB2 professional are not easy. IBM prides itself on designing comprehensive
    certification exams that are relevant to the work environment to which an individual
    holding a particular certification will be exposed. As a result, all of IBM’s
    certification exams are designed with the following items in mind:


    * What are the critical tasks that must be performed by an individual who holds
    a particular professional certification?

    * What skills must an individual possess in order to perform each critical task
    identified?

    * How frequently will an individual perform each critical task identified?


    You will find that to pass a DB2 certification exam, you must possess a solid
    understanding of `DB2`. For some of the more advanced certifications, you must
    understand many of the DB2 nuances as well.


    Now for the good news. You are holding in your hands what I consider to be the
    best tool you can use to prepare for the DB2 9 for Linux, UNIX, and Windows Database
    Administration Upgrade exam (Exam 736). When IBM began work on the DB2 9 certification
    exams, I was invited once again to participate in the exam development process.
    In addition to helping define the exam objectives, I authored several exam questions
    and I provided feedback on many more before the final exams went into production.
    Consequently, I have seen every exam question you are likely to encounter, and
    I know every concept on which you will be tested when you take the DB2 9 for Linux,
    UNIX, and Windows Database Administration Ugrade exam (Exam 736). Using this knowledge,
    along with copies of the actual exam questions, I developed this study guide,
    which not only covers every concept you must know in order to pass the DB2 9 for
    Linux, UNIX, and Windows Database Administration Upgrade exam (Exam 736), but
    also covers the exam process itself and the requirements for each DB2 9 certification
    role available. In addition, you will find at the end of each chapter, the sample
    questions that are worded just like the actual exam questions. In short, if you
    see it in this book, count on seeing it on the exam; if you don’t see it in this
    book, it won’t be on the exam. If you become familiar with the material presented
    in this book, you should do well on the exam.


    # CHAPTER 1


    # IBM DB2 9 Certification


    Recognized throughout the world, the Professional Certification Program from IBM
    offers a range of certification options for IT professionals. This program consists
    of several distinct certification roles that are designed to guide you in your
    professional development; you begin the certification process by selecting the
    role that’s right for you, and familiarizing yourself with the certification requirements
    for that role. Once you have chosen the certification role you wish to pursue
    and have familiarized yourself with the requirements for that particular role,
    the next step is to prepare for and take the appropriate certification exam or
    exams.


    This chapter is designed to introduce you to an accelerated path you can take
    to obtain the `IBM Certified Database Administrator - DB2 9 for Linux, UNIX, and
    Windows` certification from IBM.


    # IBM Certified Database Administrator - DB2 9 for Linux, UNIX, and Windows


    The `IBM Certified Database Administrator - DB2 9 for Linux, UNIX, and Windows`
    certification is intended for experienced DB2 9 users who possess the knowledge
    and skills necessary to perform the day-to-day administration of DB2 9 instances
    and databases residing on Linux, UNIX, or Windows platforms. In addition to being
    knowledgeable about the concepts of DB2 9 database administration, individuals
    seeking this certification should have significant hands-on experience as a DB2
    9 Database Administrator (DBA).


    Candidates who have either taken and passed the `DB2 V8.1 Family Fundamentals`
    exam (Exam 700) or acquired the IBM Certified Database Administrator - DB2 V8.1
    for Linux, UNIX, and Windows certification (by taking and passing Exams 700 and
    701) must take and pass the `DB2 9 for Linux, UNIX, and Windows Database Administration`
    exam (Exam 731) to acquire the IBM Certified Database Administrator—DB2 9 for
    Linux, UNIX, and Windows certification. All other candidates must take and pass
    both the `DB2 9 Family Fundamentals` exam (Exam 730) and the `DB2 9 for Linux,
    UNIX, and Windows Database Administration` exam (Exam 731). The roadmap for acquiring
    the IBM Certified Database Administrator - DB2 9 for Linux, UNIX, and Windows
    certification can be seen in [Figure 1–1](#011_Chapter01.xhtml_img1_1).


    ![Image](images/2.jpg)


    *Figure 1–1: IBM Certified Database Administrator - DB2 9 for Linux, UNIX, and
    Windows certification roadmap.*


    Candidates who already hold the IBM Certified Database Administrator - DB2 V8.1
    for Linux, UNIX, and Windows certification may opt to take the `DB2 9 for Linux,
    UNIX, and Windows Database Administration Upgrade` exam (Exam 736) to acquire
    the IBM Certified Database Administrator - DB2 9 for Linux, UNIX, and Windows
    certification. This exam, which is half the length and half the cost of the `DB2
    9 for Linux, UNIX, and Windows Database Administration` exam (Exam 731), is designed
    to test a candidate’s knowledge of the new features and functions that are available
    in DB2 9. Essentially, the upgrade exam provides certified DB2 Version 8.1 DBAs
    an accelerated approach for acquiring an equivalent Version 9 certification. This
    accelerated approach is outlined in [Figure 1–2](#011_Chapter01.xhtml_img1_2).


    ![Image](images/3.jpg)


    *Figure 1–2: The accelerated approach for acquiring IBM Certified Database Administrator
    - DB2 9 for Linux, UNIX, and Windows certification.*


    # DB2 9 for Linux, UNIX, and Windows Database Administration Upgrade exam (Exam
    736) Objectives


    The `DB2 9 for Linux, UNIX, and Windows Database Administration Upgrade` exam
    (Exam 736) consists of 38 multiple-choice questions, and candidates have 60 minutes
    to complete the exam. A score of 55% or higher is required to pass.


    The primary objectives that the `DB2 9 for Linux, UNIX, and Windows Database Administration
    Upgrade` exam (Exam 736) is designed to cover are as follows (the percentages
    after each section title reflect the approximate distribution of the total question
    set across the sections):


    ## Section 1 - Server Management (29%)


    * Understand the functionality of the `AUTOCONFIGURE` command

    * Ability to manually configure communications (emphasis on IPv6)

    * Ability to enable automatic maintenance

    * Ability to enable the Self-Tuning Memory Manager

    * Ability to enable Utility Throttling


    ## Section 2 - Data Placement (21%)


    * Knowledge of the new default behavior of the `CREATE DATABASE` command

    * Ability to create and manage Automatic Storage table spaces

    * Knowledge of Table Partitioning

    * Knowledge of Data Row Compression


    ## Section 3 - XML Concepts (13%)


    * Ability to use XML data types

    * Ability to create and manage XML indexes

    * Ability to use basic XML functions (for example, `XMLPARSE`, `XMLSERIALIZE`,
    `XMLVALIDATE`, and `XMLQUERY`)

    * Knowledge of basic XQuery fundamentals

    * Ability to use DB2 utilities with XML data


    ## Section 4 - Analyzing DB2 Activity (16%)


    * Ability to use DB2’s troubleshooting utilities (`db2bfd`, `db2mtrk`, and `db2pd`)

    * Ability to monitor deadlocks

    * Ability to use Administrative Routines and `SNAPSHOT` functions


    ## Section 5 - High Availability (10.5%)


    * Ability to use the `RECOVER DATABASE` command

    * Knowledge of High Availability Disaster Recovery (HADR)


    ## Section 6 - Security (10.5%)

