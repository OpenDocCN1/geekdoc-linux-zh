  raw: 'Once you’ve defined the security policy and labels needed to enforce your
    security requirements and have granted the appropriate privileges and security
    labels to users, you are ready to modify the table associated with the security
    policy and configure its columns for column-level LBAC protection. This is done
    by executing an `ALTER TABLE` statement that looks something like this:


    ![Image](images/194-1.jpg)


    Here is where things get a little tricky. If you try to execute the `ALTER TABLE`
    statement shown as a user with `SYSADM` or `SECADM` authority, the operation will
    fail, and you will be presented with an error message that looks something like
    this:


    ![Image](images/194-2.jpg)


    That’s because the only user who can secure a column with the “CONFIDENTIAL” security
    label is a user who has been granted *write access* to data that is protected
    by that label. In our scenario, this is the user `HR_STAFF.` So what happens when
    user `HR_STAFF` attempts to execute the preceding `ALTER TABLE` statement? Now
    a slightly different error message is produced:


    ![Image](images/194-3.jpg)


    Why? Because, by default, the LBAC rules set associated with the security policy
    assigned to the `EMPLOYEES` table allows the user `HR_STAFF` to write data only
    to columns or rows that are protected by the same security label that he/she has
    been granted.


    # **DB2LBACRULES rules**


    An LBAC rule set is a predefined set of rules that is used when comparing security
    labels. Currently, only one LBAC rule set is supported `(DB2LBACRULES),` and as
    we have just seen, this rule set prevents both write-up and write-down behavior.
    (Write-up and write-down apply only to `ARRAY` security label components and only
    to write access.) Write-up is when the security label protecting data to which
    you are attempting to write is higher than the security label you have been granted;
    write-down is when the security label protecting data is lower.


    Which rules are actually used when two security labels are compared is dependent
    on the type of component used `(SET, ARRAY,` or `TREE)` and the type of access
    being attempted (read or write). [Table 7.1](#017_Chapter07.xhtml_tab7_1) lists
    the rules found in the `DB2LBACRULES` rules set, identifies which component each
    rule is used for, and describes how the rule determines if access is to be blocked.


    ![Image](images/195.jpg)


    # **Granting exemptions**


    So how can the remaining columns in the `EMPLOYEES` table be secured with the
    appropriate security labels? The Security Administrator must first grant user
    `HR_STAFF` an exemption to one or more security policy rules. When a user holds
    an exemption on a particular security policy rule, that rule is not enforced when
    the user attempts to access data that is protected by that security policy.


    Security policy exemptions are granted by executing the `GRANT EXEMPTION ON RULE`
    SQL statement (as a user with `SECADM` authority). The syntax for this statement
    is:


    ![Image](images/196-1.jpg)


    where:


    | *Rule* | Identifies one or more `DB2LBACRULES` security policy rules for which
    exemptions are to be given. The following values are valid for this parameter:
    `DB2LBACREADARRAY, DB2LBACREADSET, DB2LBACREADTREE, DB2LBACWRITEARRAY WRITEDOWN,
    DB2LBACWRITEARRAY WRITEUP, DB2LBACWRITESET, DB2LBACWRITETREE,` and `ALL.` (If
    an exemption is held for every security policy rule, the user will have complete
    access to all data protected by that security policy.) |


    | *PolicyName* | Identifies the security policy for which the exemption is to
    be granted. |


    | *UserName* | Identifies the name of the user to which the exemptions specified
    are to be granted. |


    Thus, to grant an exemption to the `DB2LBACWRITEARRAY` rule in the security policy
    named `SEC_POLICY` created earlier to a user named `HR_STAFF,` you would execute
    a `GRANT EXEMPTION` statement that looks something like this:


    ![Image](images/196-2.jpg)


    Once this exemption is granted along with the appropriate security label, user
    `HR_STAFF` will then be able to execute the `ALTER TABLE` statement shown earlier
    without generating an error. (Alternately, the following `CREATE TABLE` statement
    could be used to create the `EMPLOYEES` table and protect each column with the
    appropriate security label, provided user `HR_STAFF` has the privileges needed
    to create the table.)


    ![Image](images/197-1.jpg)


    # **Putting column-level LBAC into action**


    Now that we have established a column-level LBAC environment, let’s see what happens
    when different users try to access data stored in protected columns of the `EMPLOYEES`
    table. Suppose the user `HR_STAFF` adds three rows to the `EMPLOYEES` table by
    executing the following SQL statements.


    ![Image](images/197-2.jpg)


    User `HR_STAFF1` has been given read/write access to all columns in the table
    (with the `SEC_POLICY.CLASSIFIED` security label and the `DB2LBACWRITEARRAY` WRITEDOWN
    exemption), so the statements execute successfully. If user `HR_STAFF` attempts
    to query the table, he or she will be able to see every column and every row because
    he or she has been granted the highest security level in the array.


    Now, when user `MANAGER1` attempts to read every column in the table, an error
    will be generated stating that he or she does not have “READ” access to the column
    “SSN.” However, `MANAGER1` will be able to execute the following query because
    he or she has been granted read access to each column specified:


    ![Image](images/198-1.jpg)


    Now, if user `EMPLOYEE1` attempts to execute the same query, an error will be
    generated stating that he or she does not have `“READ”` access to the column `BONUS.`
    But an attempt by `EMPLOYEE1` to execute the following query will be successful:


    ![Image](images/198-2.jpg)


    Additionally, if user `MANAGER1` or user `EMPLOYEE1` attempt to insert additional
    records or update existing information, they will get an error stating they do
    not have permission to perform the operation against the table.


    # ***Combining Row-Level and Column-Level LBAC***


    There may be times when you would like to limit an individual user’s access to
    a specific combination of rows and columns. When this is the case, you must include
    a column with the data type `DB2SECURITYLABEL` in the table’s definition, add
    the `SECURED WITH` *[SecurityLabel]* option to each column in the table’s definition,
    and associate a security policy with the table using the `SECURITY POLICY` clause
    of the `CREATE TABLE` SQL statement or the `ADD SECURITY POLICY` clause of the
    `ALTER TABLE` statement. Typically, you will also create two security label components—
    one for rows and one for columns—and use both components to construct the security
    policy and labels needed.


    For example, assume that you created two security label components by executing
    the following commands:


    ![Image](images/198-3.jpg)


    You would then create a security policy by executing a `CREATE SECURITY POLICY`
    command that looks something like this:


    ![Image](images/199-1.jpg)


    Then you could create corresponding security labels by executing commands that
    look something like this:


    ![Image](images/199-2.jpg)


    Finally, after associating the appropriate security labels with individual columns,
    you would grant the proper security label to each user and conduct a few tests
    to ensure data access is controlled as expected.


