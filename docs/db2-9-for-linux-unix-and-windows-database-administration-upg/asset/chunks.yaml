    # CHAPTER 2: Server Management


    Twenty nine percent (29%) of the DB2 9 for Linux, UNIX, and Windows Database Administration
    Upgrade exam (Exam 736) is designed to test your knowledge about basic DB2 server
    management. The questions that make up this portion of the exam are intended to
    evaluate the following:


    *   Your understanding of the `AUTOCONFIGURE` command

    *   Your ability to manually configure client/server connectivity

    *   Your ability to use Automatic Maintenance

    *   Your ability to throttle utilities

    *   Your ability to use DB2’s Self-Tuning Memory Manager (STMM)


    This chapter is designed to introduce you to the various concepts you need to
    be familiar with in order to manage a DB2 9 server. This chapter will also provide
    you with information about some of the tools that are available for server management.


    # Instance and Database Configurations


    DB2 sees the world as a hierarchy of objects. Workstations (or servers) on which
    DB2 has been installed occupy the highest level of this hierarchy. When any edition
    of DB2 is installed on a workstation, program files for a background process known
    as the DB2 Database Manager are physically copied to a specific location on that
    workstation, and in most cases, an instance of the DB2 Database Manager is created.
    Instances occupy the second level in the hierarchy and are responsible for managing
    system resources and databases that fall under their control. Databases make up
    the third level in the hierarchy and are responsible for managing the storage,
    modification, and retrieval of data.


    During normal operation, the behavior of the DB2 Database Manager is controlled,
    in part, by a collection of values that define the DB2 operating environment.
    Some of these values are operating system environment variables, and others are
    special DB2-specific system-level values known as environment or registry variables.
    Along with this comprehensive set of registry variables DB2 uses an extensive
    array of configuration parameters to control how system resources are allocated
    and utilized on behalf of an instance and a database. Unfortunately, the default
    values provided for many of these configuration parameters were produced with
    very simple systems in mind. (The goal was for DB2 to run out of the box, on virtually
    any platform, not for DB2 to run optimally on the platform on which it is installed.)
    Thus, even though the default values provided for these configuration parameters
    are sufficient to meet most database needs, you can usually greatly improve overall
    system and application performance simply by changing the values of one or more
    configuration parameters.


    Whenever an instance is created, a corresponding DB2 Database Manager configuration
    file is also created and initialized as part of the instance creation process.
    Each DB2 Database Manager configuration file is made up of approximately 85 different
    parameter values, and most control the amount of system resources that are allocated
    to a single DB2 Database Manager instance. Likewise, each time a new database
    is created a corresponding database configuration file is created and initialized.
    Each database configuration file is made up of approximately 105 different parameters,
    and just as most DB2 Database Manager instance configuration parameters control
    the amount of system resources that will be allocated to a single DB2 Database
    Manager instance, many of the database configuration file parameters control the
    amount of system resources that will be allocated to a database during normal
    operation.


    # The Configuration Advisor


    With such a broad range of configuration parameters to choose from, deciding where
    to start and what changes to make can be difficult. Fortunately, DB2 comes packaged
    with a tool to help you get started; that tool is the Configuration Advisor. The
    Configuration Advisor is designed to capture specific information about your database
    environment and recommend or make changes to configuration parameters based on
    the information provided.


    You can activate the Configuration Advisor by selecting the Configuration Advisor
    action from the Databases menu found in the Control Center. [Figure 2–1](#012_Chapter02.xhtml_img2_1)
    shows how the Configuration Advisor looks when it is first activated.


    ![Image](images/11.jpg)


    *Figure 2–1: The Configuration Advisor dialog.*


    Once the Configuration Advisor wizard is activated, you simply follow the directions
    shown on each panel presented to describe your server environment and to explain
    what a typical transaction workload for your database looks like. When you have
    provided the information requested, the Configuration Advisor will recommend changes
    that should improve overall performance if made to instance and/or database configuration
    parameters. At that time, the “Finish” push button displayed in the lower right
    corner of the wizard (see [Figure 2–1](#012_Chapter02.xhtml_img2_1)) will be enabled,
    and when this button is selected, the recommended configuration parameter changes
    may be applied.


    In DB2 9, the Configuration Advisor is automatically invoked whenever you create
    a database using the Create Database Wizard. (This behavior can be changed by
    assigning the value `NO` to the `DB2_ENABLE_AUTOCONFIG_DEFAULT` registry variable.)


    ![Image](images/paper.jpg) The Configuration Advisor (and the `AUTOCONFIGURE`
    command) makes configuration and buffer pool recommendations based on the assumption
    that only one database is defined per instance.


    # The AUTOCONFIGURE Command


    The functionality provided by the Configuration Advisor can also be obtained by
    executing the `AUTOCONFIGURE` command (which calls the Design Advisor under the
    covers). The basic syntax for this command is:


    ![Image](images/12.jpg)


    where:


    *   `Keyword*: One or more special keywords that are recognized by the `AUTOCONFIGURE`
    command. Valid values include `mem_percent`, `workload_type`, `num_stmts`, `tpm`,
    `admin_priority`, `is_populated`, `num_local_apps`, `num_remote_apps`, `isolation`,
    and `bp_resizable`.

    *   `Value*: Identifies the value associated with the keyword provided. [Table
    2.1](#012_Chapter02.xhtml_tab2_1) lists the values that are valid for each keyword
    recognized by the `AUTOCONFIGURE` command.


    ### Table 2.1 AUTOCONFIGURE Command Keywords and Values


    | Keyword | Valid Values / Default | Description |

    | :--- | :--- | :--- |

    | `mem_percent` | 1-100 Default: 25 | Percentage of available server memory (RAM)
    the DB2 Database Manager is to use when performing database operations. |

    | `workload_type` | simple, complex, mixed Default: mixed | The type of workload
    that is usually run against the database. Valid values are as follows: simple—database
    is used primarily to resolve queries (for example, data warehousing); complex—database
    is used primarily for transaction processing (for example, order entry and OLTP);
    and mixed—database is used to resolve queries and to process transactions. Simple
    workloads tend to be I/O-intensive and mostly transactions, whereas complex workloads
    tend to be CPU-intensive and mostly queries. |

    | `num_stmts` | 1-1,000,000 Default: 10 | Average number of SQL statements executed
    within a single transaction (i.e., between commits). NOTE: If unknown, choose
    a number greater than 10. |

