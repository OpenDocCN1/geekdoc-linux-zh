  trans: '

    当数据库未启用自调优时，整个数据库将使用指定数量的内存，并根据需要将其分配到数据库内存消费者中。然而，当数据库启用了自调优后，内存调优器会对数据库工作负载特征的显著变化做出响应，通过调整内存配置参数的值和缓冲区池的大小来优化性能。如果当前的工作负载需求较高，且系统上有足够的空闲内存，数据库将消耗更多内存。一旦工作负载的内存需求下降，或者系统上的可用空闲内存过低，将释放部分数据库共享内存。


    通过将数据库配置参数 `self_tuning_mem` 赋值为 `ON`，可以为数据库启用自调优。这是通过执行 `UPDATE DATABASE CONFIGURATION`
    命令完成的。（在更改生效之前，必须停止并重启数据库。）


    通过使用 `UPDATE DATABASE CONFIGURATION` 命令为内存配置参数赋值 `AUTOMATIC`，可以为由内存配置参数控制的特定内存区域启用自调优；您可以使用
    `CREATE BUFFERPOOL` 或 `ALTER BUFFERPOOL` SQL 语句通过将缓冲区池的大小设置为 `AUTOMATIC,` 从而为缓冲区池启用自调优。然而，由于内存调优器在不同的内存消费者之间交换内存资源，因此必须至少有两个内存消费者启用了自调优，自调优才能生效。（更不用说数据库本身的
    `self_tuning_mem` 数据库配置参数必须设置为 `ON`。）


    ![Image](img/paper.jpg) 为了实现排序内存的自动调优，必须将 `sheapthres_shr` 数据库配置赋值为 `AUTOMATIC`，并将
    `sheapthres` DB2 数据库管理器配置参数设置为 0。


    一旦为数据库和两个或多个内存消费者配置了自调优，就可以通过执行 `GET DATABASE CONFIGURATION` 命令获取数据库的当前内存配置。自调优产生的更改将记录在内存调优日志文件中，这些文件位于实例的
    `stmmlog` 子目录下。（第一个创建的文件将被命名为 `stmm.0.log,`，第二个将被命名为 `stmm.1.log,`，依此类推。）每份内存调优日志文件都包含执行调优操作时每个内存消费者的资源需求摘要。可以通过检查内存调优日志文件中条目的时间戳来确定调优间隔。


