  trans: "\nIBM 建议你为 HADR 主数据库和备用数据库使用相同的主机计算机。（如果可能，它们应由同一厂商制造并具有相同的架构。）此外，主数据库和备用数据库服务器上的操作系统应为相同版本，包括补丁级别。在滚动升级期间，你可以临时违反此规则，但在执行此类操作时请务必极其谨慎。HADR\
    \ 主机之间还必须提供 TCP/IP 接口，并应使用高速、高容量的网络来连接两者。\n\n安装在主数据库和备用数据库服务器上的 DB2 软件必须具有相同的位数（32\
    \ 位或 64 位），且用于主数据库和备用数据库的 DB2 版本必须相同；例如，两者都必须是版本 8 或版本 9。在滚动升级期间，备用数据库的数据库系统修改级别（例如修复补包级别）可以在短时间内晚于主数据库。然而，你不应长时间维持这种配置。如果主数据库的数据库系统修改级别晚于备用数据库，主备数据库将无法相互连接。因此，必须始终在备用数据库系统上应用修复补包。\n\
    \n主数据库和备用数据库都是单分区数据库，并且它们必须具有相同的数据库名称；但是，它们不需要存储在相同的数据库路径上。主数据库和备用数据库服务器为事务日志文件分配的存储空间也应相同；不支持使用原始设备进行事务日志记录。（归档日志仅由当前主数据库执行。）\n\
    \n表空间属性，如表空间名称、表空间类型（DMS、SMS 或自动存储）、表空间页大小、表空间大小、容器路径、容器大小和容器类型（原始设备、文件或目录），在主数据库和备用数据库上必须相同。当你在主数据库上执行\
    \ `CREATE TABLESPACE`、`ALTER TABLESPACE` 或 `DROP TABLESPACE` 等表空间语句时，这些语句会在备用数据库上重放。因此，在主数据库上执行表空间语句之前，你必须确保涉及此类语句的表空间容器在两个系统中存在。（如果你在主数据库上创建了表空间，但备用数据库因为容器不可导致日志重放失败，主数据库不会收到提示日志重放失败的错误消息。）完全支持自动存储数据库，包括\
    \ `ALTER DATABASE` 语句的复制。与表空间容器类似，指定的存储路径必须在主服务器和备用服务器上都存在。\n\n一旦建立了 HADR 环境，将适用以下限制：\n\
    \n*   不支持对备用数据库进行读取；客户端无法连接到备用数据库。\n*   自调优内存管理器 (STMM)只能在当前主数据库上运行。\n*   无法在备用数据库上执行备份操作。\n\
    *   不支持重定向恢复。也就是说，HADR 不支持重定向表空间容器。然而，支持数据库目录和日志目录的变化。\n*   不支持指定了 `COPY NO` 选项的加载操作。\n\
    \n# 设置 HADR 环境\n\n设置 HADR 环境的过程非常简单。在确保用作主、备服务器的系统相同，并且它们之间存在 TCP/IP 连接后，你只需按照所示顺序执行以下任务：\n\
    \n1. 确定主备备数据库服务器的主机名、主机 IP 地址以及服务名或端口号。\n\n   如果服务器有多个网络接口，请确保 HADR 主机名或 IP 地址映射到预期的接口。你需要为每个受保护的数据库分配单独的\
    \ HADR 端口——这些不能与分配给实例的端口相同。主机名只能映射到一个 IP 地址。\n\n2. 通过恢复备份映像或初始化将作为主数据库的数据库拆分镜像拷贝来创建备用数据库。\n\
    \n   建议在恢复操作或拆分镜像初始化后，不在备用数据库上执行 `ROLLFORWARD DATABASE` 命令。执行滚前恢复操作的结果与使用 HADR\
    \ 在备用数据库上重放日志的结果可能略有。如果启动 HADR 时主备数据库不相同，将发生错误。\n\n   在使用 `RESTORE DATABASE` 命令设置备用数据库时，建议使用\
    \ `REPLACE HISTORY FILE` 选项；应避免使用以下选项：`TABLESPACE`、`INTO`、`REDIRECT` 和 `WITHOUT\
    \ ROLLING FORWARD`。\n\n3. 在主数据库和备用数据库上设置 HADR 配置参数。\n\n   在创建备用数据库之后启动 HADR 之前，需要设置表\
    \ 7.2 所示的 HADR 配置参数。\n\n   | 表 7.2 HADR 特定数据库配置参数 | | |\n   | :--- | :--- | :---\
    \ |\n   | **参数** | **值范围 / 默认值** | **描述** |\n || `hadr_db_role` | N/A | 只读。如果数据库是高可用灾难恢复\
    \ (HADR) 环境的一部分，则指示数据库当前的角色。有效值为 STANDARD、PRIMARY 或 STANDBY。 |\n || `hadr_local_host`\
    \ | 任何有效字符串 默认: NULL | 指定用于高可用灾难恢复 (HADR) TCP 通信的本地主机。可以使用主机名或 IP 地址。 |\n || `hadr_local_svc`\
    \ | 任何有效字符串 默认: NULL | 指定本地高可用灾难恢复 (HADR) 接受连接的 TCP 服务名或端口号。 |\n || `hadr_remote_host`\
    \ | 任何有效字符串 默认: NULL | 指定远程高可用灾难恢复 (HADR) 节点的 TCP/IP 主机名或 IP 地址。 |\n || `hadr_remote_inst`\
    \ | 任何有效字符串 默认: NULL | 指定远程服务器的实例名称。Control Center 等管理工具使用此参数联系远程服务器。高可用灾难恢复 (HADR)\
    \ 还会检查请求连接的远程数据库是否属于声明的实例。 |\n || `hadr_remote_svc` | 任何有效字符串 默认: NULL | 指定远程高可用灾难恢复\
    \ (HADR) 节点将使用的 TCP 服务名或端口号。 |\n || `hadr_syncmode` | SYNC, NEARSYNC, ASYNC 默认:\
    \ NEARSYNC | 指定用于高可用灾难恢复 (HADR) 的同步模式。这决定了当系统处于对等状态时，主日志写入如何与备用数据库同步。此配置参数的有效值为\
    \ SYNC（此模式对事务丢失提供了最强的保护，但事务响应时间成本较高）、NEARSYNC（此模式对事务丢失的保护较少，以换取比 SYNC 模式更短的事务响应时间）和\
    \ ASYNC（在主故障时此模式事务丢失的概率最高，以换取三种模式中最短的事务响应时间）。 |\n || `hadr_timeout` | 1-4,294,967,295\
    \ 默认: 120 | 指定高可用灾难恢复 (HADR) 过程在认为通信尝试失败之前等待的时间（秒）。 |\n\n4. 连接到备用实例并在备用数据库上启动\
    \ HADR。\n\n"
