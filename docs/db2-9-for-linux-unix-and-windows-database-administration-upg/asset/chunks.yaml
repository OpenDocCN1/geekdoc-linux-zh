    # ***The Import Utility***


    Just as there are times when it is beneficial to copy data stored in a table or
    view to an external file, there can be times when it is advantageous to copy data
    stored in an external file to a database table or updatable view. One way to copy
    data from an external file to a database is by using DB2’s Import utility; the
    Import utility is designed to read data directly from an external file (provided
    the file is written in a format that is supported by DB2) and insert it in a specific
    table or updatable view.


    The Import utility can be invoked by executing the `IMPORT` command. The basic
    syntax for this command is:


    ![Image](images/104.jpg)


    where:


    | *FileName* | Identifies the name and location of the external file from which
    data is to be imported (copied). |


    | *LOBPath* | Identifies one or more locations where large object (LOB) data values
    that are to be imported are stored. |


    | *XMLPath* | Identifies one or more locations where XML documents that are to
    be imported are stored. |


    | *Modifier* | Identifies one or more options that are used to override the default
    behavior of the Import utility. ([Table 4.2](#014_Chapter04.xhtml_tab4_2) contains
    a list of valid modifiers that can be used when importing XML data.) |


    | *Method* | Identifies the method (location, name, or position) that is to be
    used to extract data values from the source external file(s) specified and map
    them to one or more columns of the target table/updatable view specified. The
    syntax used to specify each method varies. (We will look at this syntax a little
    later.) |


    | *SchemaID* | Identifies the XML schema/SQL identifier against which XML documents
    being imported are to be validated. When XML documents are validated in this manner,
    the SCH attribute of the XML Data Specifier (XDS) is ignored. |


    | *CommitCount* | Identifies the number of rows of data (records) that are to
    be copied to the table/updatable view specified before a commit operation is to
    be performed. `(COMMITCOUNT AUTOMATIC` should be used instead for import operations
    that fail because transaction logs become full.) |


    | *RestartCount* | Identifies the number of rows of data in the external file
    specified that are to be skipped. This option is typically used when an earlier
    import operation failed—by skipping rows that have already been successfully imported
    into a table/updatable view, one import operation can essentially continue where
    another import operation left off. |


    | *WarningCount* | Identifies the number of warnings that are allowed before the
    import operation is to be stopped. (If the file to be imported or the target table
    is specified incorrectly, the Import utility will generate a warning for each
    row that it attempts to import.) If this parameter is set to 0 or not specified,
    the import operation will continue regardless of the number of warnings issued.
    |


    | *MsgFileName* | Identifies the name and location of an external file to which
    messages produced by the Import utility are to be written as the import operation
    is performed. |


    | *TableName* | Identifies the name assigned to the table or updatable view to
    which data is to be imported (copied). (This cannot be the name of a system catalog
