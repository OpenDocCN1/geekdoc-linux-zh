    因此，如果你想使用 `SNAP_GET_LOCK()` 表函数获取名为 `SAMPLE` 的数据库的快照监视锁信息（而不是查询 `SYSIBMADM.SNAPLOCK`
    管理视图），你可以通过构建一个如下所示的查询来实现：


    ![Image](img/128.jpg)


    # 关于 SNAP_WRITE_FILE() 存储过程的说明


    使用特殊管理视图或 SQL 表函数来查看快照监视数据的缺点之一是，没有 `SYSADM, SYSCTRL, SYSMAINT,` 或 `SYSMON` 权限的用户将无法访问收集的数据。为了解决这个问题，可以使用一个名为
    `SNAP_WRITE_FILE()` 的特殊存储过程来捕获监视数据的快照，并将收集到的信息保存到数据库服务器上的文件中。一旦快照数据被保存到文件中，任何用户都可以使用相应的快照表函数执行查询，对数据库级表函数指定
    `(NULL, NULL)` 作为输入值，并对数据库管理器级表函数指定 `(NULL)`。他们接收到的监视数据是从 `SNAP_WRITE_FILE()`
    存储过程生成的文件提取。


    调用 `SNAP_WRITE_FILE()` 存储过程的语法如下：


    ![Image](img/129-1.jpg)


    其中：


    | `RequestType` | 标识特定的快照请求类型，用于确定要收集的监视数据范围。该参数的有效值为：`APPL_ALL, BUFFERPOOLS_ALL,
    DB2, DBASE_ALL, DBASE_LOCKS, DBASE_TABLES, DBASE_TABLESPACES,` 和 `DYNAMIC_SQL.`
    |

    | `DBName` | 标识要收集快照监视数据的数据库。 |

    | `PartitionNum` | 标识要收集快照监视数据的数据库分区。 |


    因此，如果你想使用 `SNAP_WRITE_FILE()` 存储过程收集 DB2 数据库管理器（默认认为当前连接的数据库和当前数据库分区）的快照监视信息，你可以执行如下所示的
    `CALL` 语句：


    ![Image](img/129-2.jpg)


    一旦执行此语句，你就可以执行如下所示的查询来检索并显示收集到的快照数据：


    ![Image](img/129-3.jpg)


    # 事件监视器


    快照监视器提供了一种记录特定时间点数据库活动状态信息的方法，而事件监视器可用于在事件或转换发生时记录数据库活动信息。因此，当发生无法使用快照监视器监控的事件或活动时，事件监视器提供收集监视数据的方法。例如，假设你想每次发生死锁循环时捕获监视数据。如果你熟悉死锁的概念，可能记得一个名为死锁检测器的特殊进程会在后台静默运行，并按照预定义的间隔“唤醒”，扫描锁定系统以寻找死锁循环。如果存在死锁循环，死锁检测器会随机选择循环中的一个事务进行回滚并终止。（被回滚并终止的事务将接收一个
    SQL 错误代码，它获得的所有锁都将被释放，然后允许剩余的事务或事务继续运行。）此类事件的信息无法通过快照监视器捕获，因为极可能在拍摄快照之前，死锁循环就已经被打破了。另一方面，可以使用事件监视器捕获此类信息，因为它会在检测到死锁循环的瞬间被激活。


    ![Image](img/paper.jpg) 默认情况下，每当创建一个 DB2 9 数据库时，都会为该数据库定义一个名为 `DB2DETAILDEADLOCK`
    的死锁事件监视器；`DB2DETAILDEADLOCK` 事件监视器在建立数据库或每次激活数据库时自动启动。当此监视器处于状态时，会在第一次发生死锁时收集诊断信息，允许在不需要重现的情况下调查原因。


    如果删除了此监视器且不存在其他死锁事件监视器，你仍然可以使用 `SYSIBMADM.SNAPLOCK` 和 `SYSIBMADM.SNAPLOCKWAIT`
    快照监视管理视图（或相应的 `SNAP_GET_LOCK()` 和 `SNAP_GET_LOCKWAIT()` 快照监视表函数）来排排除锁定问题。


    与位于后台且始终可用的快照监视器不同，事件监视器是必须创建的特殊对象。你通过执行 `CREATE EVENT MONITOR` SQL 语句来创建事件监视器。该语句的基本语法为：


    ![Image](img/131.jpg)


    其中：


    | `EventMonName` | 标识分配给要创建事件监视器的名称。 |

    | `EventCondition` | 标识用于确定为哪些 `CONNECTION, STATEMENT,` 或 `TRANSACTION` 事件收集监视数据的条件。
    |

    | `TableName` | 标识分配给数据库表的名称，所有收集到的事件监视器数据将写入该表。 |

    | `PipeName` | 标识分配给命名管道的名称，所有收集到的事件监视器数据将写入该管道。 |

    | `DirectoryName` | 标识分配给包含或多个事件监视器数据的目录。 |


    通过检查 `CREATE EVENT MONITOR` 语句的语法可以看出，创建事件监视器时，必须指定要监控的事件类型；表 5.3 列出了可用的事件类型，以及每种类型收集的信息类型和数据实际收集的细节。


    | 表 5.3 事件监视器类型 |


    | 事件类型 | 收集的数据 | 数据收集的时机 |

    | :--- | :--- | :--- |

    | DATABASE | 所有数据库级计数器的值。 | 当数据库取消激活或最后一个连接到数据库的应用程序断开时。 |

    | BUFFERPOOLS | 所有缓冲池计数器、预取器和页面清理器的值，以及每个使用的缓冲池的直接 I/O。 | 当数据库取消激活或最后一个连接到数据库的应用程序断开时。
    |

    | TABLESPACES | 每个使用的表空间的所有缓冲池计数器、预取器、页面清理器和直接 I/O 值。 | 当数据库取消激活或最后一个连接到数据库的应用程序断开时。
    |

    | TABLES | 每个表的读取行数和写入行数。 | 当数据库取消激活或最后一个连接到数据库的应用程序断开时。 |

    | DEADLOCKS | 关于涉及应用程序的综合信息，包括参与的 SQL 语句的标识（以及语句文本）和持有的锁列表。 | 当检测到死锁循环时。 |

    | CONNECTIONS | 所有应用程序级计数器的值。 | 当连接到数据库的应用程序断开时。 |

    | STATEMENTS | 语句的开始/停止时间、使用的 CPU 数量、动态 SQL 语句的文本、SQLCA（SQL 语句的返回码）以及其他指标（如取数数）。对于分区数据库：使用的
    CPU 数量、执行时间、表信息和表队列信息。 | 当 SQL 语句执行完毕时。对于分区数据库：当 SQL 语句的一个部分执行完毕时。 |

    | TRANSACTIONS | 事务的开始/停止时间、上一个事务的时间和消耗的 CPU 数量，以及锁定和日志指标。（如果数据库使用两阶段提交处理和 X/Open
    XA 接口，则不生成事务记录。） | 当事务终止时（通过 `COMMIT` 或 `ROLLBACK` 语句）。 |


