    ## 献辞


    献给我的姐姐 Kathy


    # 致谢


    一个如此规模的项目需要大量的时间以及许多不同人士的支持。我想对以下人员所出的贡献表示感谢：


    **Susan Dykman - IBM 信息管理部信息认证计划经理**


    Susan 邀请我参加 `DB2 9` 考试的开发过程，并为我提供了 `IBM Certification Exam Testing` 软件的截图。Susan
    还审阅了书的第一章，并提供了宝贵的反馈。


    **Susan Visser - IBM Press，数据管理项目经理，IBM 多伦多实验室**


    再次感谢 Susan 的帮助，这种帮助是无价的；没有她的帮助，这本书无法完成。当 Pearson Education 决定不出版我的 `Version 8.1`
    书的更新版本时，Susan 为我获得 `Version 8.1` 手稿版权并转至 MC Press 平铺了道路。Susan 在章节编写期间审阅了许多章节，并确保
    `IBM 多伦多实验室` 的相关主题专家也审阅了手稿的部分。


    **Dr. Arvind Krishna - IBM 数据服务器和全球信息管理开发副总裁**


    Krishna 博士为本书提供了序言。


    **Reed M. Meseck - IBM 信息管理软件高级竞争专家**


    Reed 帮助 Arvind Krishna 博士撰写了本书的序言。


    **Brant Davison - IBM 信息管理软件项目总监**


    Brant 与我合作，确保 Arvind Krishna 博士收到了编写本书序言所需的材料。


    **Jason Gartner - Arvind Krishna 的执行助理**


    Jason 与 Reed M. Meseck 和 Arvind Krishna 博士一起工作，确保我及时收到了本书的序言。


    **Rick Swagerman - IBM 多伦多实验室 DB2 SQL 和目录开发高级技术经理**


    Rick 为我提供了详细的示例，说明了引用约束的 `UPDATE/DELETE NO ACTION 和 UPDATE/DELETE RESTRICT` 规则是如何工作的。他的示例被转换为你在第
    4 章 中看到的一些插图，Rick 针对准确性和完整性审阅了其中许多图画的终稿。


    **Dale McInnis - IBM 多伦多实验室 DB2 高可用性高级技术人员**


    Dale 审阅了第 7 章 - 高可用性的内容，以确保准确完整；他提供的宝贵反馈已纳入该章节中。


    我还要感谢我的妻子 Beth 的帮助和鼓励，感谢她再次在我忙于另一本（我的第 16 本）书期间，忽略了所有没能完成的事情。


    # 关于作者


    Roger E. Sanders 是 Roger Sanders Enterprises, Inc. 的总裁。他拥有 20 多年的数据库应用程序设计与开发经验，自
    `DB2` 首次引入 `IBM PC`（作为 `OS/2 扩展版`的一部分）以来，他一直与 `DB2` 及其前身打交道。他曾在 *Certification
    Magazine* 和 *IDUG Solutions Journal* 等出版物上发表文章，为 IBM 的开发者 Works 网站编写教程，在多次国际 DB2
    用户组 (IDUG) 和区域 DB2 用户组 (RUG) 会议上演讲，教授过 `DB2` 基础和数据库管理（DB2 for Linux, UNIX, and
    Windows）课程，在 `DB2 Magazine` 上撰写名为 *Distributed DBA* 的专栏，并是以下书籍的作者：


    *   *DB2 9 for Linux, UNIX, and Windows Database Administration Certification
    Exam Study Guide*

