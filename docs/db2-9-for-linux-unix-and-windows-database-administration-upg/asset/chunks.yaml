    \ Roll-forward utility, and how to restore a database using information stored\
    \ in the recovery history log file using the Recover utility. You will also learn\
    \ how to set up a High Availability Disaster Recovery (HADR) environment.\n\n\
    \    [Chapter 7](#017_Chapter07.xhtml_ch-7) is designed to introduce you to the\
    \ concept of database security and to the various authorization levels and privileges\
    \ that are recognized by DB2\\. In this chapter, you will learn how and where\
    \ users are authenticated, how authorities and privileges determine what a user\
    \ can and cannot do while working with a database, and how authorities and privileges\
    \ are given to and taken away from individual users and/or groups of individual\
    \ users. You will also learn how to restrict access to specific columns and/or\
    \ rows in a table using Label-Based Access Control (LBAC).\n\n    The book is\
    \ written primarily for IT professionals who have a great deal of experience working\
    \ with DB2 9, already hold the IBM Certified Database Administrator—DB2 V8.1 for\
    \ Linux, UNIX, and Windows certification, and would like to take (and pass) the\
    \ DB2 9 for Linux, UNIX, and Windows Database Administration Upgrade exam (Exam\
    \ 736).\n\n# **Conventions Used**\n\nMany examples of DB2 9 administrative commands\
    \ and SQL statements can be found throughout this book. The following conventions\
    \ are used whenever a DB2 command or SQL statement is presented:\n\n| [ ] | Parameters\
    \ or items shown inside of brackets are required and must be provided. |\n\n|\
    \ < > | Parameters or items shown inside of angle brackets are optional and do\
    \ not have to be provided. |\n\n| &#124; | Vertical bars are used to indicate\
    \ that one (and only one) item in the list of items presented can be specified\
    \ |\n\n| ,… | A comma followed by three periods (ellipsis) indicate that multiple\
    \ instances of the preceding parameter or item can be included in the DB2 command\
    \ or SQL statement |\n\nThe following examples illustrate each of these conventions:\n\
    \n# ***Example 1***\n\n![Image](images/xiii.jpg)\n\nIn this example, at least\
    \ one *TableName* value must be provided, as indicated by the brackets ([ ]),\
    \ and more than one *TableName* value can be provided, as indicated by the comma-ellipsis\
