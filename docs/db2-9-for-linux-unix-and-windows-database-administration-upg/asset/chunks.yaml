    # 问题 7


    关于基于标签的访问控制 (LBAC)，下列哪种描述是**错误**的？


    ![round](img/round.jpg) A. LBAC 可用于限制对表或视图中单独行和列的访问。


    ![round](img/round.jpg) B. 被授予不同 LBAC 安全标签的用户在执行相同的查询时将获得不同的结果。


    ![round](img/round.jpg) C. 只有拥有 SYSADM 或 SECADM 权限的用户才允许创建安全策略和安全标签。


