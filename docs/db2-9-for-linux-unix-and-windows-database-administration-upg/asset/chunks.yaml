    # Question 9


    The correct answer is **B.** Because the `UTIL_IMPACT_PRIORITY` option was used
    when the `BACKUP DATABASE` command was executed, but no priority value was specified,
    the backup operation was assigned a default priority of 50, which means that the
    backup operation will impact other production workloads by 50 percent.


    # Question 10


    The correct answer is **C.** When a database has been enabled for self tuning,
    the memory tuner responds to significant changes in database workload characteristics,
    adjusting the values of memory configuration parameters and buffer pool sizes
    to optimize performance. The following memory consumers can be enabled for self
    tuning:


    * Buffer pools (controlled by the `ALTER BUFFERPOOL` and `CREATE BUFFERPOOL` statements)

    * Package cache (controlled by the `pckcachesz` configuration parameter)

    * Locking memory (controlled by the `locklist` and `maxlocks` configuration parameters)

    * Sort memory (controlled by the `sheapthres_shr` and the `sortheap` configuration
    parameter)

    * Database shared memory (controlled by the `database_memory` configuration parameter)


    # Question 11


    The correct answer is **A.** Changes made by the Self Tuning Memory Manager are
    recorded in memory tuning log files, which reside in the `stmmlog` subdirectory
    of the instance. (The first file created will be assigned the name `stmm.0.log,`
    the second will be assigned the name `stmm.1.log,` and so on.) Each memory tuning
    log file contains summaries of the resource demands for each memory consumer at
    the time a tuning operation was performed. Tuning intervals can be determined
    by examining the timestamps for the entries made in the memory tuning log files.


    # Question 12


    The correct answer is **C.** Self-tuning is enabled for a database by assigning
    the value ON to the `self_tuning_mem` database configuration parameter. Specific
    memory areas that are controlled by a memory configuration parameter can be enabled
    for self-tuning by assigning the value AUTOMATIC to the parameter, using the `UPDATE
    DATABASE CONFIGURATION` command; you can enable buffer pools for self-tuning by
    setting their size to AUTOMATIC, using either the `CREATE BUFFERPOOL` or the `ALTER
    BUFFERPOOL` SQL statement. The following memory consumers can be enabled for self
    tuning:


    * Buffer pools

    * Package cache (controlled by the `pckcachesz` configuration parameter)

    * Locking memory (controlled by the `locklist` and `maxlocks` configuration parameters)

    * Sort memory (controlled by the `sheapthres_shr` and the `sortheap` configuration
    parameter)

    * Database shared memory (controlled by the `database_memory` configuration parameter)


    # Question 13


    The correct answer is **B.** Self-tuning is enabled for a database by assigning
    the value ON to the `self_tuning_mem` database configuration parameter. This is
    done by executing the `UPDATE DATABASE CONFIGURATION` command. (The database has
    to be stopped and restarted before the change will take effect.) Once a database
    has been configured for self-tuning, the current memory configuration for the
    database can be obtained by executing the `GET DATABASE CONFIGURATION` command.


    # Question 14


    The correct answers are **A** and **E.** In order for automatic tuning of sort
    memory to occur, the `sheapthres_shr` database configuration must be assigned
    the value AUTOMATIC *and* the `sheapthres` DB2 Database Manager configuration
    parameter must be set to 0.


    # CHAPTER 3


    # Data Placement


    Twenty one percent (21%) of the DB2 9 for Linux, UNIX, and Windows Database Administration
    Upgrade exam (Exam 736) is designed to test your ability to create a DB2 9 database,
    as well as to test your knowledge of the methods used to create and manage table
    spaces and range-partitioned tables. The questions that make up this portion of
    the exam are intended to evaluate the following:


    * Your knowledge of the new default behavior of the `CREATE DATABASE` command

    * Your knowledge of the characteristics of SMS, DMS, and Automatic Storage table
    spaces

    * Your ability to create and manage Automatic Storage table spaces

    * Your ability to create range-partitioned tables

    * Your knowledge of data row compression


    This chapter is designed to walk you through the DB2 9 database creation process,
    and to provide you with an overview of the various types of table spaces that
    can be constructed once a database exists. This chapter is also designed to show
    you how to construct range-partitioned tables, as well as use data row compression
    to reduce storage space requirements for a table.


    # Creating a DB2 9 Database


    There are two ways to create a DB2 9 database: by executing the `CREATE DATABASE`
    command by using the Create Database Wizard - which is essentially a graphical
    user interface (GUI) for the `CREATE DATABASE` command. In its simplest form,
    the syntax for the `CREATE DATABASE` command is:


    ![Image](images/44.jpg)


    where:


    | `DatabaseName` | Identifies a unique name that is to be assigned to the database.
    |


    The only value you must provide when executing this command is a name to assign
    to the new database. This name


    * can consist of only the characters **a** through **z, A** through **Z, 0** through
    **9, @**, **#**, **$**, and _ (underscore);

    * cannot begin with a number;

    * cannot begin with the letter sequences `SYS,` DM,` or `IBM`; and

    * cannot be the same as the name already assigned to another database.


    Of course, a much more complex form of the `CREATE DATABASE` command that provides
    you with more control over database parameters is available, and we will examine
    it shortly. But for now, let’s look at what happens when this form of the `CREATE
    DATABASE` command is executed.


    # What Happens When a DB2 9 Database Is Created


    Regardless of how the process is initiated, whenever a new DB2 9 database is created,
    the following tasks are performed, in the order shown:


    1. All directories and subdirectories needed are created in the appropriate location.
    Information about every DB2 9 database created is stored in a special hierarchical
    directory tree. Where this directory tree is actually created is determined by
    information provided with the `CREATE DATABASE` command—if no location information
    is provided, this directory tree is created in the location specified by the `dftdbpath`
    DB2 Database Manager configuration parameter associated with the instance under
    which the database is being created. The root directory of this hierarchical tree
    is assigned the name of the instance with which the database is associated. This
    directory will contain a subdirectory that has been assigned a name corresponding
    to the partition’s node. If the database is a partitioned database, this directory
    will be named `NODExxxx,` where `xxxx` is the unique node number that has been
    assigned to the partition; if the database is a nonpartitioned database, this
    directory will be named `NODE0000.` The node-name directory, in turn, will contain
    one subdirectory for each database that has been created, along with one subdirectory
    that includes the containers that are used to hold the database’s data.

