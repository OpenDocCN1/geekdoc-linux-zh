    # Answers


    # Question 1


    The correct answer is **C.** When a new DB2 9 database is created, three table
    spaces are created and associated with the `IBMDEFAULTBP` buffer pool. These three
    table spaces are as follows:


    *   A regular table space named `SYSCATSPACE`, which is used to store the system
    catalog tables and views associated with the database

    *   A regular table space named `USERSPACE1`, which is used to store all user-defined
    objects (such as tables, indexes, and so on) along with user data, index data,
    and long value data

    *   A system temporary table space named `TEMPSPACE1`, which is used as a temporary
    storage area for operations such as sorting data, reorganizing tables, and creating
    indexes


    Unless otherwise specified, `SYSCATSPACE` and `USERSPACE1` will be DMS File table
    spaces, and `TEMPSPACE1` will be an SMS tables pace; characteristics for each
    of these table spaces can be provided as input to the `CREATE DATABASE` command
    or the Create Database Wizard.


    # Question 2


    The correct answer is **D.** Whenever a new DB2 9 database is created, the following
    features are enabled by default:


    *   Automatic maintenance (database backups, table and index reorganization, data
    access optimization, and statistics profiling).

    *   Self tuning memory manager (package cache, locking memory, sort memory, database
    shared memory, and buffer pool memory)

    *   Utility throttling

    *   The Health Monitor


