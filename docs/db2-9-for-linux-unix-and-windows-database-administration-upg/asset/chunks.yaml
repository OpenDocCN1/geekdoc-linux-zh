    # 问题 8


    以下哪项 SQL 语句允许名为 `USER1` 的用户写入受 LBAC 保护的列，这些列受 LBAC 标签保护，的安全级别低于 `USER1` 所拥有的？


    ![Image](img/202.jpg)


    # 答案


    # 问题 1


    正确答案是 **B.** DB2 9 引入了以下新的认证类型：`DATA_ENCRYPT`、`DATA_ENCRYPT_CMP`、`GSSPLUGIN` 和
    `GSS_SERVER_ENCRYPT`。


    # 问题 2


    正确答案是 **A.** 当使用 `GSSPLUGIN` 认证类型时，验证在服务器工作站进行，使用通用安全服务应用程序接口 (GSS-API) 插件。如果未指定客户端认证类型，服务器会将服务器支持的插件列表（在
    `srvcon_gssplugin_list` 数据库管理器配置参数中找到）返回给客户端。然后，客户端从客户端插件目录的列表中选择第一个插件。如果客户端不支持列表中的任何插件，则使用
    `KERBEROS` 认证方法对客户端进行验证。


    # 问题 3


    正确答案是 **C.** 当使用 `DATA_ENCRYPT` 认证类型时，验证在服务器工作站进行，使用 `SERVER_ENCRYPT` 认证方法。此外，以下数据在从客户端传输到服务器以及从服务器传输到客户端之前会被加密：


    * SQL 和 XQuery 语句。

    * SQL 程序变量数据。

    * 服务器处理 SQL 或 XQuery 语句的输出数据（包括数据描述）。

    * 查询产生的结果集数据的部分或全部。

    * 大对象 (LOB) 数据流传输。

    * SQLDA 描述符。


    # 问题 4


    正确答案是 **C.** 当使用 `GSS_SERVER_ENCRYPT` 认证类型时，验证在服务器工作站进行，使用 `GSSPLUGIN` 或 `SERVER_ENCRYPT`
    认证方法。也就是说，如果客户端通过 GSS-API 插件进行验证，则使用服务器支持插件列表中找到的第一个客户端支持插件对客户端进行验证。如果客户端不支持服务器支持插件列表中的任何插件，则使用
    `KERBEROS` 认证方法对客户端进行验证。如果客户端不支持 Kerberos 安全协议，则使用 `SERVER_ENCRYPT` 认证方法对客户端进行验证。


    # 问题 5


    正确答案是 **A.** 要使用基于标签的访问控制 (LBAC) 限制表的访问，你必须定义安全标签组件、定义安全策略、创建一个或多个安全标签、创建一个受 LBAC
    保护的表或修改现有表以添加 LBAC 保护（通过将安全策略添加到表并定义一个具有 `DB2SECURITYLABEL` 数据类型的列来实现），并向适当的用户授予正确的安全标签。没有
    LBAC 安全配置方案。


    # 问题 6


    正确答案是 **A.** 如果你希望数据类型为 `DB2SECURITYLABEL` 的列值以人类可读的形式显示或导出，可以在 SELECT 语句中使用 `SECLABEL_TO_CHAR()`
    标函数将值转换为安全标签字符串格式。


    # 问题 7


    正确答案是 **C.** 安全管理员 (SECADM) 权限是一种特殊的数据库级权限，旨在允许特殊用户配置各种基于标签的访问控制 (LBAC) 元素，以限制对包含一个或多个表的访问，这些表包含他们自己可能没有权限访问的数据。拥有安全管理员权限的用户仅允许执行以下任务：


    * 创建和删除安全策略。

    * 创建和删除安全标签。

    * 向单个用户授予和撤销安全标签（使用 `GRANT SECURITY LABEL` 和 `REVOKE SECURITY LABEL` SQL 语句）。

    * 授予和撤销 LBAC 规则豁免。

    * 授予和撤销 SETSESSIONUSER 权限（使用 `GRANT SETSESSIONUSER` SQL 语句）。

    * 转移任何非安全管理员拥有的对象的权（通过执行 `TRANSFER OWNERSHIP` SQL 语句）。


    系统管理员权限之外没有其他权限为用户提供这些能力。


    # 问题 8


    正确答案是 **B.** 当用户持有 LBAC 安全策略规则的豁免时，当该用户尝试读取和/或写入受该安全策略保护的数据，该规则将不会被执行。


    安全策略豁免通过执行 `GRANT EXEMPTION ON RULE` SQL 语句（由具有 SECADM 权限的用户）授予。该语句的语法为：


    ![Image](img/205-1.jpg)


    其中：


    | `Rule` | 标识要授予豁免的一个或多个 `DB2LBACRULES` 安全策略规则。该参数的有效值有：`DB2LBACREADARRAY`、`DB2LBACREADSET`、`DB2LBACREADTREE`、`DB2LBACWRITEARRAY
    WRITEDOWN`、`DB2LBACWRITEARRAY WRITEUP`、`DB2LBACWRITESET`、`DB2LBACWRITETREE` 和
    `ALL`。（如果对每个安全策略规则都持有豁免，则用户将完全访问受该安全策略保护的所有数据。） |


    | `PolicyName` | 标识要授予豁免的安全策略。 |


    | `UserName` | 标识要授予指定豁免的用户名称。 |


