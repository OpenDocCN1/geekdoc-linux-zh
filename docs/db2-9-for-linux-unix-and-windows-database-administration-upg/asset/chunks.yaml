    *   您监控死锁的能力

    *   您使用 DB2 9 提供的故障排除工具的能力


    本章旨在向您介绍 DB2 提供的系列监控工具，并向您如何使用每种工具来监控数据库系统的运行良好程度（或糟糕程度）。本章还旨在向您介绍 DB2 9 提供的某些故障排除工具。


    # 数据库系统监控器


    数据库监控是一项至关重要的活动，定期执行可以对数据库系统的健康状况提供持续反馈。由于数据库监控是数据库管理不可或缺的一部分，DB2 配备了一个名为“数据库系统监控器”（Database
    System Monitor）的内置监控工具。虽然“数据库系统监控器”这个名称暗示只有一个监控工具，但实际上，数据库系统监控器由两个不同的工具组成（一个快照监控器和一个或多个事件监控器），可用于捕获并返回系统监控信息。快照监控器允许您在特定时间点捕捉数据库状态（以及所有数据库活动），而事件监控器则在特定数据库事件发生时捕获并记录数据。由这两个工具收集的信息存储在称为
    `monitor elements`（监控元素或数据元素）的实体中，每个使用的监控元素都通过 (1) 唯一名称进行标识并在 (2) 设计用于存储特定类型的信息。


    数据库系统监控器采用多种方法来展示收集的数据。对于快照和事件监控器，您都可以选择将所有收集的数据存储在文件或数据库表中、在屏幕上查看，或使用自定义应用程序进行处理。


    # 快照监控器


    快照监控器设计用于收集特定时间点（即拍摄快照时）DB2 实例及其控制的数据库的状态信息。此外，可以对快照监控器进行定制，以检索特定类型的监控数据（例如，它可以配置为仅收集有关缓冲池的信息）。快照对于确定数据库系统的状态非常有用，当定期拍摄快照时，可以提供价值信息，用于观察趋势和识别潜在问题区域。


    # 快照监控器开关


    通常，收集数据库系统监控数据会引入额外的处理开销。例如，为了计算 SQL 语句的执行时间，DB2 数据库管理器必须在每个 SQL 语句执行的前后调用操作系统以获取时间戳；这类系统调用通常是昂贵的。使用数据库系统监控器的另一个副作用是内存消耗增加——DB2
    数据库管理器使用内存来存储为每个跟踪的监控元素收集的数据。


    为了帮助尽量减少收集数据库系统监控信息涉及的开销，可以使用一组被称为快照监控器开关的开关来控制在拍摄快照时收集哪些信息；收集信息的类型和数量取决于这些快照监控器开关的设置方式。每个快照监控器开关都有两个设置：`ON`
    和 `OFF`。当快照监控器开关设置为 `OFF` 时，受该开关控制的监控元素将不收集信息。如果开关设置为 `ON`，则则反之。（请记住，大量的监控信息不受开关控制，无论如何设置快照监控器开关，它们都始终会被收集。）可用的快照监控器开关，以及每个开关设置为
    `ON` 时收集的类型类型说明，请参见 表 5.1。


    ![Image](img/121.jpg)


    默认情况下，表 5.1 中显示的所有开关均设置为 `OFF`，但 `TIMESTAMP` 开关设置为 `ON`。


    # 捕获快照数据


    一旦激活数据库或建立与数据库的连接，快照监控器就会开始收集监控数据。然而，在查看收集的数据之前，必须先拍摄快照。可以通过执行 `GET SNAPSHOT`
    命令来拍摄快照。该命令的基本语法为：


    ![Image](img/122-1.jpg)


    其中：


    | DatabaseAlias | 标识分配给要收集快照监控信息的数据库的别名。 |

    | AppID | 通过 ID 标识要收集快照监控信息的应用程序。 |

    | AgentID | 通过应用程序句柄标识要收集快照监控信息的应用程序。 |


    因此，如果您想拍摄一个仅包含收集的“与名为 `SAMPLE` 的数据库交互的应用程序所持有的锁”相关数据的快照，可以通过执行如下所示的 `GET SNAPSHOT`
    命令来实现：


    ![Image](img/122-2.jpg)


    请记住，快照监控器开关连同 `GET SNAPSHOT` 命令提供的选项，共同决定了拍摄快照时将返回的数据类型和量。如果特定的快照监控器开关没有打开，并且拍摄了与该开关相关的监控数据快照，那么捕获的监控数据可能完全不包含任何值。


    # 使用 SQL 捕获快照监控器数据


    在早期版本的 DB2 中，捕获快照监控数据的唯一方法是执行 `GET SNAPSHOT` 命令或从程序中调用相应的 API。在 DB2 UDB 8.1 版本中，引入了通过构建引用可用
    20 个快照监控器表函数之一的查询来捕获快照监控数据的功能。虽然这些函数仍然可用并在 DB2 9 中可以使用，但它们已被弃用。现在，可以通过查询特殊的管理视图或使用一组新的
    SQL 表函数来获取快照监控数据。这些视图和函数在 表 5.2 中进行了详细描述。


    | 表 5.2 DB2 9 快照监控器管理表和 SQL 表函数 | |

    | 管理视图 | 表函数 | 说明 |

    | :--- | :--- | :--- |

    | SYSIBMADM.APPLICATIONS | N/A | 此管理视图包含有关连接的数据库应用程序的信息。 |

    | SYSIBMADM.APPL_PERFORMANCE | N/A | 此管理视图包含有关每个应用程序的选择行数与读取行数速率的信息。 |

    | SYSIBMADM.BP_HITRATIO | N/A | 此管理视图包含缓冲池命中率，包括总计、数据和索引数据。 |

    | SYSIBMADM.BP_READ_IO | N/A | 此管理视图包含缓冲池读取性能信息。 |

    | SYSIBMADM.BP_WRITE_IO | N/A | 此管理视图包含缓冲池写入性能信息。 |

    | CONTAINER_UTILIZATION | N/A | 此管理视图包含有关表空间容器和利用率的信息。 |

    | SYSIBMADM.LOCKS_HELD | N/A | 此管理视图包含当前持有的锁的信息。 |

    | SYSIBMADM.LOCKWAITS | N/A | 此管理视图包含等待授予的锁的信息。 |

    | SYSIBMADM.LOG_UTILIZATION | N/A | 此管理视图包含有关当前连接数据库日志利用率的信息。 |

    | RUNNING_SQL | N/A | 此管理视图包含有关当前连接数据库中运行时间最长的 SQL 语句的信息。 |

    | SYSIBMADM.QUERY_PREP_COST | N/A | 此管理视图包含 SQL 语句列表，以及有关准备每个语句所需时间的信息。 |


