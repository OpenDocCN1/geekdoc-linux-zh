    *   使用 `REORG` 工具对表中的数据进行重组。

    *   使用 `RUNSTATS` 工具更新表的统计信息。

    *   删除（释放）表。


    恢复历史文件中的每个条目除了标识已执行的事件外，还标识了事件发生的日期和时间、事件发生的方式以及受影响的表空间和表；如果操作是备份操作，还会记录生成的备份映像的存储位置以及访问该映像的信息。由于恢复历史文件包含了每个可用备份映像的映像位置信息，它在版本恢复操作期间可以作为跟踪和验证机制。


    # DB2 恢复工具 (Recover Utility)


    虽然可以使用 `RESTORE DATABASE` 命令将数据库恢复到备份映像创建时的状态，并可以使用 `ROLLFORWARD DATABASE` 命令重放数据库事务日志文件中记录的信息，以将数据库恢复到特定时间点的状态，但如果你有一个当前的恢复历史文件，就可以使用恢复工具在单一步内完成这两种操作。


    恢复工具在 DB2 9 中引入，它根据恢复历史文件中的信息，执行必要的恢复和向前重滚操作，以将数据库恢复到特定时间点。通过执行 `RECOVER DATABASE`
    命令来调用恢复工具。该命令的基本语法如下：


    ```

    ![Image](img/158.jpg)


    ![Image](img/159-1.jpg)


    or


    ![Image](img/159-2.jpg)

    ```


    其中：


    | `DatabaseAlias` | 标识分配给执行版本恢复操作的备份映像相关数据库别名。 |

    | `PointInTime` | 标识一个特定的时间点，由格式为 `yyyy-mm-dd-hh.mm.ss.nnnnnn`（年、月、日、时、分、秒、微秒）的时间戳值表示，数据库将重滚到该点。（只有在指定日期和时间之前且截止发生的事务将重新应用于数据库。）
    |

    | `PartitionNum` | 用数字标识一个或多个数据库分区（在 `db2nodes.cfg` 文件中标识），事务将在这些分区上进行向前重滚。在分区数据库环境中，必须从数据库的目录分区调用恢复工具。
    |

    | `UserName` | 标识执行恢复操作的特定用户名称。 |

    | `Password` | 标识与执行恢复操作的用户名对应的密码。 |

    | `HistoryFile` | 标识恢复工具使用的恢复历史日志文件名称。 |

    | `LogDirectory` | 标识包含离线归档日志文件的目录，用于执行恢复操作的向前重滚部分。 |


    因此，如果你想使用存储在恢复历史文件中的信息对 `SAMPLE`（已存在）的数据库执行全恢复操作，可以通过执行类似所示的 `RECOVER DATABASE`
    命令来实现：


    ```

    ![Image](img/160-1.jpg)

    ```


    另一方面，如果你想恢复名为 `SAMPLE` 的数据库，并将其向前重滚到当前恢复历史文件中不再包含的极旧时间点，可以通过执行类似所示的 `RECOVER DATABASE`
    命令来实现（假设你有一份旧的恢复历史文件的副本可供）：


    ```

    ![Image](img/160-2.jpg)

    ```


    需要注意的是，如果恢复工具成功恢复了数据库，但由于某些原因在尝试向后重滚时失败，恢复工具将尝试继续之前的恢复操作，而不重新执行恢复阶段。如果你想强制恢复工具重新执行恢复阶段，则需要指定
    `RESTART` 选项执行 `RECOVER DATABASE` 命令。无法从故障点显式地重新启动恢复操作。


    # 高可用灾难恢复 (HADR)


    高可用灾难恢复 (HADR) 是一种 DB2 数据库复制功能，为部分故障和完整站点故障提供高可用解决方案。HADR 通过将从源数据库（称为主数据库）的数据更改复制到目标数据库（称为备用数据库）来防止数据丢失。在
    HADR 环境中，应用程序只能访问当前的主数据库——通过重放在主数据库生成并发送到备用数据库的事务日志数据来实现与备用数据库的同步。通过 HADR，你可以指定三种同步模式之一（同步、近同步或异步）来选择你希望从潜在数据丢失中获得的保护级别。


    HADR 的设计旨在最小化当发生部分或完整站点故障时对数据库系统的影响。部分站点故障可能由硬件、网络或软件（DB2 或操作系统）故障引起。如果没有 HADR，部分站点故障需要重启托管一个或多个
    DB2 数据库的服务器和实例。重启服务器和实例所需的时间不可预测的；如果在发生部分站点故障时事务负荷很重，可能需要几分钟才能让数据库恢复到一致状态并供使用。有了
    HADR，备用数据库可以在几秒钟接管。此外，你可以通过使用与数据库交互的应用程序中的自动客户端重定向或重试逻辑，将使用原始主数据库的客户端重定向到备用数据库（现在是新的主数据库）。在损坏原始主服务器修复后，如果数据库的两个副本都能保持一致，它可以重新作为备用数据库加入
    HADR 节点。一旦原始主数据库作为备用数据库重新整合到 HADR 节点中，你就可以切换角色，使原始主数据库再次作为主数据库运行。（这被称为回切操作。）


    当灾难（如火灾）导致整个站点被毁时，可能会发生完整站点故障。由于 HADR 使用 TCP/IP 在主、备用数据库之间通信，数据库可以位于两个不同的位置。例如，你的主数据库可能位于一个城市的总部，而你的备用数据库位于另一个城市的销售办公室。如果主站点发生灾难，通过让远程备用数据库接管主数据库来维护数据可用性。


    # HADR 环境的要求


    为了实现 HADR 的最佳性能，托管备用数据库的系统应与托管主数据库的系统具有相同的硬件和软件。如果托管备用数据库的系统资源少于主数据库，备用数据库可能无法跟上主数据库生成的事务负载。这会导致备用数据库落后或主数据库的性能下降。更重要的是，如果发生故障转移，新的主数据库可能没有足够的资源来充分服务客户端应用程序。由于在主数据库上执行的缓冲池操作会在备用数据库上重放，因此主、备用数据库服务器具有相同数量的内存是非常重要的。


