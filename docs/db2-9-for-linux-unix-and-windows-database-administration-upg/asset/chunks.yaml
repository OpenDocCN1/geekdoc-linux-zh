    # 问题 6


    下列哪项最准确描述了 `SECLABEL_TO_CHAR()` 函数的用途？


    ![round](img/round.jpg) A. 显示分配给 LBAC 保护表中某行的安全标签。


    ![round](img/round.jpg) B. 将命名的安全标签插入 `DB2SECURITYLABEL` 列中。


