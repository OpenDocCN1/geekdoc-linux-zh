    # ***Modifying Existing Table Spaces***


    Because SMS table spaces rely on the operating system for physical storage space
    management, they rarely need to be modified after they have been successfully
    created. DMS table spaces, on the other hand, have to be monitored closely to
    ensure that the fixed-size preallocated file(s) or physical raw device(s) that
    they use for storage always have enough free space available to meet the database’s
    needs. When the amount of free storage space available to a DMS table space becomes
    dangerously low (typically less than 10 percent), you can add more free space
    either by increasing the size of one or more of its containers or by adding one
    or more new containers to it. Existing table space containers can be resized,
    new containers can be made available to an existing table space, and an existing
    table space’s properties can be changed by executing the `ALTER TABLESPACE` SQL
    statement. The basic syntax for this statement is:


