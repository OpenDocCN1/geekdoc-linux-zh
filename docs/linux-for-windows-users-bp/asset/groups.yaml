    ## 软盘格式化


    如果需要格式化软盘，则需要一个磁盘格式化程序。似乎没有替代 KDE 内置的磁盘格式化功能的选择。不幸的是，KDE 并没有提供一个擅长在命令行运行的磁盘格式化程序。可以通过“k”菜单访问
    KDE 磁盘格式化程序，但只有选择工具（Utilities）然后选择 Kfloppy 时它才会启动。应会出现如图 4.13 所示类型的窗口。该程序使用非常简单，类似于
    Windows 95 和 98 中找到的磁盘格式化工具。可用的唯一选项是快速（Quick）和完全（Full）选项，分别用于擦除磁盘和对磁盘执行完全格式化。只有完全选项可用于尚未之前格式化的磁盘。已在
    1.44 MB 3.5" 软盘上进行过测试。


    ![](img/147f057d2f063d8c60ee616870537a94_73_0.png)


    还有 DOS 格式软盘的选项。实际上，主要有两种类型：FAT12 和 FAT16。Linux 能很好地处理这些格式。另一方面，Microsoft Windows
    只能读取 FAT12。Windows 不支持 FAT16 磁盘。使用这些类型的格式意义不大，因为你无法直接与底层操作系统交互。如果你正在使用运行 MS-DOS
    或 Windows 的 PC，那么使用 DOS 格式磁盘配合 KDE 是有意义的，因为这使得在 PC 和 DOS 之间交换数据变得容易。


    DOS 格式磁盘能够很好地读取高密度或双密度 3.5" 磁盘。但是，除非使用特殊工具，否则 KDE 无法写入 MS-DOS 或 Windows 格式。


    格式化程序应该能够处理较旧的 5.25" 磁盘，但我实际上从未尝试过。MS-DOS 和 Windows 无法从 Linux 格式磁盘读取或写入数据。


    ## 自定义 KDE


    像大多数图形用户界面一样，KDE 允许用户通过设置所谓的“KDE 外观和感受”设置来自定义桌面外观和感受。这是通过系统设置菜单下的桌面和背景（Desktop
    and Background）完成的。在这里，您将看到一个窗口，允许您选择背景颜色、图案和壁纸。系统设置程序非常容易使用。它与旧版本中的 KDE 控制中心（Control
    Center）相似。


