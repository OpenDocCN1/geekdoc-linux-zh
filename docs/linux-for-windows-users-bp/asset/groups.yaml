    ### 间接打印


    如果您有一个应用程序拒绝“正确”地与您的打印机通信，而是仅发送文本流（例如 PostScript 数据），那么对于仅打印而言，最佳方法（最佳方案）是使用一个中间应用程序。WordPerfect
    随许多 Linux 发行版提供，并且支持广泛的打印机。它可以导入文本文件和各种形式的图形文件。通常，可以使用“棘手”的应用程序将文件以标准格式保存到磁盘，然后将其导入
    WordPerfect 并打印出来。这是一种迂回的做法，但打印质量很可能受到打印机本身的限制，而不是文件格式转换的限制。使用 WordPerfect 可以轻松地调整图形到所需大小，然后以该大小打印出来。


    另一种间接方法是使用 Ghostscript 应用程序，它几乎肯定已安装在系统上。该程序可以接收 PostScript 文件并将其转换为适合多种流行打印机的输出，例如
    Hewlett Packard DeskJets、LaserJets 及其兼容机型。许多 Linux 应用程序可以将其 PostScript 输出“打印”到硬盘上的文件中，因此可以通过
    Ghostscript 驱动一系列非 PostScript 打印机。如果系统上安装了 Ghostscript，可以在文档中查看版本号。5.10 版本的移植路径为
    `/usr/share/ghostscript/5.10/`。如果您未使用此路径，则版本号将不同。


    这是一个命令行工具，使用起来并不是最直观的程序。找到最简单的使用它发送文件输出的方法，然后通过打印队列实用程序打印该文件。假设您在当前目录中有一个名为 `Picture.ps`
    的 PostScript 文件，并希望生成一个名为 `Print.ps` 的 Laserjet 打印机文件。该命令将产生所需的效果：


    ```bash

    gs -dDEVICE=laserjet -sOutputFile=Print.ps Picture.ps

    ```


    请注意在适当的位置使用大写和小写字母。拥有打印机文件在之后需要再次打印文档时非常方便，但除此之外，将输出直接发送到打印机也不会出现问题，如下面的命令版本所示。


    ```bash

    gs -dDEVICE=laserjet -sOutputFile=/dev/lp0 Picture.ps

    ```


    当然，如果打印机不在 `/dev/lp0`，必须使用相应的路径。您可能会发现系统停留在 Ghostscript 并显示“GS”提示符，而不是通常的 Linux
    提示符。只需使用 Control-c 键组合即可退出并返回 Linux 提示符。关于 Ghostscript 实用程序的简要帮助，包括支持的输出设备列表，请使用此命令：


    ```bash

    gs --help

    ```


    一些“设备”实际上是图形文件格式，但支持了相当多有用的打印机。


    ## 终止


    Linux 通常非常稳定，但没有任何操作系统能保证完全可靠，因为应用软件与硬件可能以意外方式相互作用。如果程序停止响应，可能需要从控制台终止它。使用这种方法终止正确的任务并不简单，但
    KDE 任务管理器使事情变得更加容易。点击*任务管理器*主工具栏中的*系统*，会出现一个名为*资源*的区域。这显示了窗口中所有任务的数据，并且*资源*还为每个任务提供一个小图表，因此很容易定位正确的任务并使用*终止任务*按钮将其终止。*任务管理器*是
    Linux 中等同于 Windows *Ctrl*-*Alt*-*Delete* 关闭程序窗口的工具（它应仅作为最后的手段使用，而不是作为终止程序的常规方式。与
    Windows 对应物常见的另一个因素是，它不仅显示打开窗口中的程序，还显示后台进程。因此，您可能会发现许多正在运行的进程，您可能并没有意识到它们在运行。）


    如果操作了进程树标签页，窗口会更改为以树形形式显示运行中的任务，但程序的其他功能保持不变。性能标签页切换到一个完全不同的窗口，可以监控 CPU 负载和内存（图
    4.41）。


    ![](img/147f057d2f063d8c60ee616870537a94_85_0.png)


    ## 最后


    如果您到目前为止遵循了叙述，您可能不会成为 Linux 专家，但应该能够在 PC 上安装此操作系统并良好地使用它。您还应该能够安装和运行应用程序，检查硬盘空间是否不足，复制文件，根据需求定制
    KDE 桌面，格式化软盘，并执行您（几乎）可以像 Windows 一样做的其他所有基本任务。使用屏幕顶部的菜单关闭 KDE。如果您安装了 Linux 发行版，也应该能够从它切换到其他发行版，但通常会有或没有一两个玩笑程序，例如*Xeyes*，它是屏幕上的一双眼睛（图
    4.42）。如果你将指针放在它们之间，它们会对视！右键单击其中一只眼睛并选择*关闭*以关闭此程序。


    ![](img/147f057d2f063d8c60ee616870537a94_85_1.png)


    有许多用于配置 KDE 的工具，这本书不可能描述它们中所有的。本章介绍了更改壁纸，但如果您激活“K”菜单，然后选择*设置*和*桌面*，会有几个进一步的可用选项，允许更改颜色和字体（图
    4.43），这些大多以标准的 Windows 方式工作，非常接近且易于设置。“K”菜单的设置部分提供更多选项，您可能可以在这里进行一些“微调”。有图形程序，例如用于生成本书屏幕截图的
    SnappyShot 程序，以及绘图/编辑程序，如 Xv 和 GIMP。您可能还会找到 Tgif 等矢量绘图程序。


    ![](img/147f057d2f063d8c60ee616870537a94_85_2.png)


    ![](img/147f057d2f063d8c60ee616870537a94_86_0.png)


    典型的 Linux 安装似乎包含几十个实用程序。应该有一个组织工具、CD 播放器（图 4.44）、一个或两个计算器、时钟，以及所有常见的实用工具。花些时间看看能否找到一些有用的免费软件是非常值得的。


    ### 回顾


    #### 查看或更改权限


    在 KFM 中右键单击文件或文件夹图标，选择属性，然后左单击权限标签页。


    #### 显示权限（命令行）


    使用 `ls` 命令并加上“-l”选项。


    #### 添加一个组（命令行）


    使用“groupadd -g 121 [groupId] [groupName]”


    #### 格式化软盘


    激活“K”菜单，然后选择实用程序和 KFloppy。选择所需的盘片大小和格式，然后左单击格式化按钮。


    #### 更改壁纸


    激活“K”菜单，然后选择设置、桌面和背景。点击菜单关闭以选择所需的背景和设计、颜色方案等，完成后左单击确定按钮。左单击应用按钮允许您在退出显示设置窗口之前查看新设置。


    #### 添加/移除桌面


    激活“K”菜单，选择面板，然后选择配置。从桌面标签页中选择您想要的桌面数量。您可以稍后更改它。


    #### 更改面板位置


    激活“K”菜单，选择面板，然后选择配置。从位置标签页中选择面板的位置。您可以使用上/下按钮更改其位置。或者，您可以单击并拖动画板到您想要的位置。


    #### 在面板上添加图标


    找到您想要使用的程序并选择它。然后左单击“K”菜单，选择面板，然后选择配置。从添加标签页中选择面板的位置。您可以使用上/下按钮更改其位置。


    #### 从面板移除图标


    右键单击图标并选择移除。


    #### 在面板上移动图标


    右键单击图标，选择移动，将其移动到新位置，然后左单击。


    #### 更改面板大小


    从“K”菜单中选择面板和配置。然后从面板按钮中选择“极小”、“正常”或“大”。操作应用按钮以在不退出配置窗口的情况下查看更改。


    #### 制作图标


    通过“K”菜单交叉图形，然后是图标编辑器。绘制您的图标并保存为扩展名为 .xpm 的文件，并保存在 `/opt/kde/share/icons/` 中。您也可以使用此程序编辑现有图标。


    #### 安装 RPM 软件包


    使用 KFM 找到 RPM 文件，然后左单击它。从出现的窗口中选择适当的选项。


    '
