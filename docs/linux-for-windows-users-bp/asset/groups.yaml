    ## 设置日期


    系统时钟使用此形式的 `date` 命令进行设置：


    ```

    date MM/DD/HH:mm/YYYY

    ```


    - `MM` 是月份，是一个从 01 到 12 的两位数

    - `DD` 是日期，是一个从 01 到 31 的两位数

    - `hh` 是 24 小时格式的小时，从 00 到 23（00 是午夜）

    - `mm` 是分钟，是一个从 00 到 59 的两位数

    - `YYYY` 是完整的四位数的年份


    无法指定秒，使用此命令时秒被设置为零。此命令将日期和时间设置为 2002 年 2 月 16 日下午 7:23（19:23）：


    ```

    date 021619232002

    ```


    当然，此类影响系统的命令只有在 root 用户发出时才有效。重要的是要认识到，`date` 命令不会更改 PC 的硬件时钟，真正调整的是从时钟读取的软件日期，以提供指定的时间，这仅仅是硬件时钟的一个副本。这意味着如果您进行了重大更改，将考虑到漂移。除了任何漂移外，除非使用合适的源，否则时间将直接从硬件时钟获取并应用。因此，对于大多数
    PC 用户来说，进入 BIOS 设置程序并校正硬件时钟来获取时间和日期更好。即使计算机关闭并重新启动，也能获得正确的时间和日期。


