    在尝试安装 Linux 之前，需要进行一定量的准备工作。如果你是从一台硬磁盘完全空的新电脑开始，基本上不需要做什么。主要只是尝试寻找一些基本的硬件配置，以防在安装过程中需要。如果你在以前曾使用其他操作系统在硬磁盘上使用过的电脑上安装
    Linux，情况也是如此。


    这也会影响你在硬磁盘上有什么。如果你正在一台拥有已移除系统的个人电脑上安装 Linux，连同现有的 Windows 系统，以及所有硬磁盘上的 Linux。如果你正在一台硬磁盘上拥有现有系统的个人电脑上安装
    Linux，你应该备份硬磁盘。这是因为 Linux 安装过程可能会移除已从硬磁盘移除的任何数据。


