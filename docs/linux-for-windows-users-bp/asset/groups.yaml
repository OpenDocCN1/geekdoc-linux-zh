    # Options


    The Options menu (Figure 3.17) enables the menu bar, status bar, location bar,
    and toolbar as required. The save option on the Save Settings row saves the current
    settings as new defaults, and they will be used whenever KFM is run in the future.
    Of course, these defaults are not affected if each user or other users settings
    is used. The Configurer File Manager option brings up another menu (Figure 3.16)
    which enables things such as changing the font and color scheme. If you are using
    high resolution monitors it is a good idea to increase the font size from the
    default setting of


    ![](img/147f057d2f063d8c60ee616870537a94_58_0.png)


    ![](img/147f057d2f063d8c60ee616870537a94_58_1.png)


    over a filename, placing the cursor on a filename results in some brief details
    of the file being shown in the status line at the bottom of the window. For a
    directory containing a really large number of files this is the most practical
    mode to use.


    # Go


    At the bottom of the Go menu you will find a list of files and folders that have
    recently been opened using KFM (Figure 3.16). This is much the same as the “Recent”
    list in Windows and anything in the list can be opened by selecting it.


    ![](img/147f057d2f063d8c60ee616870537a94_58_2.png)




