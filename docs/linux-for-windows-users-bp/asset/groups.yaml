  - '[PAGE 87]


    # Uninstall a package


    Select Utilities and Knowledge from the “K” menu. Locate the package you wish
    to remove in the tree structure and then left-click on the Uninstall button.


    # Unzip a MS/DOS zip file


    Use “unzip filename” at the command line.


    # Read a zipped text file


    In KFM left-click on file containing the text file. In the Archiver window that
    then opens left-click on the entry for the text file. The contents of the file
    will then be displayed in a Kedit window.


    # Check the free memory


    Use the free command at the command line. Alternatively, select Settings, Information,
    and memory from the “K” menu.


    # Check the free disc space


    Use the df command at the command line.


    # Print a file


    A file has a suitable format for the printer can be printed by selecting Utilities
    and Printer Queue from the “K” menu. Then drag the file from KFM to the main Printer
    Queue window.


    # Print a file (command Line)


    Print a file to the printer by copying the file to the mount point of the printer
    (e.g. /cp: Allie /dev/p/7). The file must be in a suitable format for the printer.


    # Print a PostScript file


    It is possible to print a PostScript file to many non-PostScript printers using
    the ghostscript program, as in this example which prints “Allie”:


    ```

    gs -sDEVICE=epson -sOutputFile=/dev/lp0 Allie.ps

    ```


    To “print” to a file the command takes this form:


    ```

    gs -sDEVICE=epson -sOutputFile=PrintFileName Allie.ps

    ```


    # Monitor CPU and memory use


    Select System and Task Manager from the “K” menu, and then operate the Performance
    tab.


    # Terminate a troublesome program


    Select System and Task Manager from the “K” menu. Highlight the troublesome program
    in the list of tasks and then left-click on the Kill task button. This method
    should not be used as the normal way of terminating a program. It should only
    be used when the program is otherwise uncontrollable.'
