    ## 第 2 章 命令行


    ### 它是什么？


    熟悉早期个人电脑计算的人可能已经使用过 MS/DOS 操作系统，并且熟悉命令行解释器的概念。那些从 Windows 95 或更晚版本开始的人可能并不熟悉。需要准备对命令行解释器以及其他我们这里将使用的东西进行
    PC 测试。在 Mac 或 PC 上对命令行进行 PC 测试。带有 PowerPC 的 Mac 目前仍受支持。


    Windows 95/98/Me 具有文本模式命令解释器。重启后，你可以在 MS/DOS 提示符下运行。


    Windows 用户从未使用过用户界面，但这是可以做到的。实际上，很可能有很大一部分人将避免使用命令行接口。是否可能做到一切并不重要，不建议你这样做。Linux
    现在有图形用户界面，可以很大程度上避免使用命令行解释器。是否可能做到一切并不重要，不建议你这样做。是否完全使用取决于图形界面提供的功能以及你需要执行的任务类型。在大多数情况下，可能还不可能假装命令行解释器不存在，除非系统愿意接受在使用系统方式上的一些限制。


    即使你不打算深入查看命令行解释器，仍然建议浏览本章。你可能会发现这里有一些有用的功能，可以在以后的某个时候帮助你摆脱困境。此外，本章涵盖的一些内容是通用性质的，是你通常使用
    Windows 风格的前端来处理诸如文件操作等事情时也需要知道的类型。例如，本章介绍了 Linux 目录结构，它与 Windows 的目录结构显著不同。


    ### 命令行


    那么，什么是命令行解释器？当 Linux 启动时，你会看到一条屏幕消息，称为提示符，它看起来像这样：


    $ Login:


    它前面可能有一个 Linux 版本号、版权声明或类似的东西，但重要部分是提示符，它告诉你该输入名称并开始登录过程。你通过输入适当的名称并按下 Return
    键来响应。计算机随后要求输入密码。如果你输入错误的密码，你将犯下一个重大错误。


    你应该拥有一个良好的密码，因为它可以揭示很多关于你的信息，而且计算机还必须记录错误代码。如果输入有问题，它会通过执行相应的操作打印错误消息。计算机非常不宽容，输入错误的密码会导致错误消息。实际上，在登录过程中有很多方法会犯错。如果错误消息令人困惑，你可以确定计算机知道你想做什么（只要你保管好密码）。弄清楚实际问题可能相当困难，但如果你有
    Linux 安装专家，应该很容易修复。


    登录成功后，你可以使用许多命令来完成不同的任务。命令可以是非常复杂且难以理解的一行，或者是一个简短的短语，完美地完成工作。没有人会指责你的计算机不友好。另一方面，输入命令几乎可以立即执行使用图形用户界面难以或不可能执行的复杂任务。对于大多数
    Linux 系统，一旦启动完成且用户登录，计算机就准备好接受命令行输入了。如果你的系统没有图形用户界面（或登录后的 KDE 或 Gnome），你只需按键即可开始与
    shell 交互。要退出，请按 Ctrl+D 或输入 exit。你可以输入命令并查看可能性的示例。如果你是模拟用户，你可能希望将 shell 视为与内核（操作系统的心脏）通信的桥梁。


    ### Shell


    处理 Linux 时，你经常遇到“shell”这个词。当人们谈论他们的操作系统时，他们会提到 shell 而不是内核。在大多数 Linux 系统中，shell
    是主要的用户界面。当你使用基本的命令行解释器时，它使基本的命令行解释器更容易使用，但没有达到完整的图形用户界面那样远。在 MS/DOS 中，命令行解释器通常不被认为是一个
    shell，但被接受为操作系统的组成部分。在 Linux 中情况不同，实际的命令行解释器部分和提供 shell 给用户的系统部分不同。


    Shell 程序作为用户和 Linux 内核之间的接口。Linux 是以分层方式产生的三种类型。操作系统是最低层。下一层是内核，管理基本硬件功能，如内存管理、进程调度和输入/输出。第三层是
    shell，它为用户提供命令行接口。这是用户最直接或经常交互的层。Shell 接受用户命令并执行它们。最常见的 shell 是 Bourne shell (sh)，但还有许多其他类型，如
    C shell (csh)、Bourne Again Shell (bash) 和 Korn shell (ksh)。


    Linux 用户界面根植于计算的早期。当时没有 GUI，所以用户必须输入命令来执行任务。Shell 是第一个也是最重要的用户界面。它允许用户与计算机交互并控制其操作。Shell
    是一种提供访问操作系统服务的命令行解释器。它是一种作为用户和操作系统之间中介的软件。Shell 接受用户输入并将其转换为操作系统要执行的命令。Shell 还向用户显示命令的输出。


    ```

    $/bin/bash

    echo $SHELL

    ```


    如果你输入这个命令时出现错误消息，这意味着你的系统未安装该 shell。你可以通过运行以下命令来安装：


    ```

    sudo apt-get install bash

    ```


    安装完成后，你可以通过运行以下命令来检查 shell 版本：


    ```

    bash --version

    ```


    你应该看到类似以下内容：


    GNU bash, version 4.2.45(1)-release (x86_64-pc-linux-gnu)

