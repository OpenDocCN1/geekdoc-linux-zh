    Linux 文件系统往往相当复杂，许多文件都深深隐藏在系统中。*书签* 功能极其有用，它为访问那些经常使用但位于文件系统深处的文件提供了一种快速手段。选择此选项会将文件


    ### 重新加载


    带有圆圈图标和两个箭头的按钮是“重新加载”按钮。在复制或移动文件时，或者在更换光盘时，你可能会发现主窗口区域中的图标未能正确反映目录内容。操作“重新加载”按钮会更新窗口，此时它应能提供目录内容的准确描述。


    ### 复制和粘贴


    接下来的两个按钮分别提供访问复制和粘贴功能。在复制任何内容之前，必须先在主窗口区域中选中它。在 Windows 中，你通过左键单击图标，按住左键，然后拖出一个框围绕你希望选择的图标或图标组来做到这一点。被选中的图标会变为深蓝色。选择多个文件的另一种方法是按住
    Control 键，然后左键单击你希望选择的每个文件。这是可以在 KFM 中用于选择屏幕上未方便地分组在一起的文件的方法。当然，如果文件是成组排列的，你可以在
    Windows 中选择一个文件组。选中后，文件可以使用复制按钮进行复制。文件组也可以拖放到另一个 KFM 窗口、拖放到回收站等，通常可以将其作为单个实体处理。


    ### 帮助


    下一个按钮是“帮助”按钮，按下此按钮会激活 KFM 在线帮助系统。KDE 帮助系统的工作方式与你主要的 Windows 对应系统大致相同。左键单击带下划线的单词会直接带你跳转到关于该主题的页面。较大的帮助程序包括常用的搜索功能。帮助系统通常因陈述显而易见的内容且缺乏实质性内容而声名狼藉，但如果你在
    KDE 帮助系统中深入挖掘，还是能找到一些有用的建议。


    ### 停止


    最后一个按钮，至少在理论上是“停止”按钮。在大多数情况下，程序运行得如此迅速，以至于真的是“眨眼之间就错过了”。然而，如果处理包含大量文件的目录确实需要几秒钟，你可以通过点击“停止”按钮来终止操作；或者，如果你希望停止，按下该按钮即可中止操作。


    ### 控制


    在 KFM 屏幕的顶部有一个标题栏。此栏存在于所有 X 程序中，它的作用不仅仅是拼出程序名称。这里有一些控制按钮，但并非所有按钮都能出现在每个程序的窗口上。正如它对应的，其右侧的控制按钮与
    Microsoft Windows 的对应按钮相匹配。此按钮用于关闭当前程序窗口。左侧的按钮是正方形的，边框略小，是“最大化”按钮。左键单击此按钮会将窗口置于全屏模式。再次右击则使窗口恢复到正常大小。下一个按钮会使窗口消失到任务栏中；点击任务栏的相应部分可恢复窗口。任何习惯使用
    Windows 的人都会发现这些按钮很容易使用，因为它们本质上与 Windows 中的对应按钮相同。


    ### 窗口按钮


    标题栏左端的按钮是“窗口”按钮，操作此按钮会激活三个上下菜单（图 3.3）。*最大化* 和 *关闭* 选项简单地复制了前面描述的大小和关闭按钮的功能。不出所料，*调整大小*
    允许改变窗口的大小。选择此选项会产生一个边框，可以使用鼠标拖动到所需大小，左键单击按钮会使窗口变为选定的大小。这实际上也是一个重复功能，因为任何窗口都可以通过将光标置于窗口的边缘或角落，然后将光标拖至大鼠标按钮形状来拖动到所需大小。拖动部分可以通过按住左键，拖动到所需大小，然后松开按钮来调整大小。这同样是标准的
    Windows 风格。可以通过指向标题栏的标题部分，按住左键，然后移动光标来拖动窗口在屏幕上移动。窗口将随光标移动，直到释放左键。


    可以将窗口移动到标题栏“位于”任务栏下方的位置，从表面上看，这似乎没有方法将窗口拖回屏幕上。实际上这是可能的，只需按 Alt 键，然后将窗口拖到所需位置即可。按下
    Alt 键后，可以使用窗口的任何部分作为手柄来拖动窗口。


    ### 粘附按钮


    “窗口”按钮旁边是“粘附”或“图钉”按钮。其图标旨在代表一个图钉。在 KDE 中，窗口通常不会被“固定”。在从一个虚拟桌面切换到另一个虚拟桌面时，窗口会从屏幕上消失。左键单击粘附按钮会将窗口固定在屏幕上，使其在从一个虚拟桌面切换到另一个虚拟桌面时保持原位。点击此按钮会将窗口释放回虚拟桌面。当激活时，图标会发生变化，当窗口被“固定”在原地时，显示一个从上方俯视图钉头部的视图，当未被固定时，显示水平放置的图钉。你只需将窗口固定就位，使其可用，方法是将其固定在原地，切换桌面，然后再释放它。Windows
    没有此功能。


    ### 菜单栏


    在标题栏下方，KFM 有常规的菜单栏。这些菜单提供了许多选项，我们将只讨论其中一些更有用的选项。要添加新文件夹，请考虑打开 KFM，然后选择“新建”和“文件夹”（图
    3.9）。然后在出现的对话框中输入新文件夹的名称。


    ![](img/147f057d2f063d8c60ee616870537a94_55_0.png)


    ![](img/147f057d2f063d8c60ee616870537a94_55_1.png)


    *新窗口* 选项会运行另一个 KFM 副本，它从主屏幕区域启动。KFM 的当前目录，可以通过拖放或使用与其他任何方法类似的剪切和粘贴方法，移动到其他目录。


    *编辑* 菜单提供了通过编辑菜单选择新文件夹的便捷方法。


