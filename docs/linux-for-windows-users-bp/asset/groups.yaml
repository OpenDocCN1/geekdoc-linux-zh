    如果您调查 Linux 文件系统，大量的目录和文件可能会让您感到惊讶。在某种程度上，大量的文件只是离散硬件项目处理方式的现状。还必须意识到，典型的 Linux
    安装不仅包含操作系统。它可能包含数十个应用程序或文字/文本处理器，以及游戏。


    ### 目录


    添加和删除目录的处理方式与 MS-DOS 下非常相似。使用 `mkdir`（make directory）命令创建新目录，但请注意，该命令不能缩写为 MS-DOS
    样式的 `md`。此命令可以在当前目录下创建一个子目录，并命名为 "temp"：


    ```bash

    mkdir temp

    ```


    通过在命令中包含完整的名称和路径，可以将新目录放置在文件结构中的任何位置。此示例创建一个名为 `temp` 的子目录，并将其放置在根目录下：


    ```bash

    mkdir /root/temp

    ```


    使用 `rmdir` 命令删除不需要的目录，但请注意，在 Linux 中不能将其缩写为 `rd`。另外请注意，只有当目录为空时才能删除。在此上下文中，“空”意味着它不能包含任何文件，即使那些子目录是空的，也不能包含子目录。`rmdir`
    命令以及这两个示例将删除之前使用两个 `mkdir` 示例创建的目录：


    ```bash

    rmdir temp

    rmdir /root/temp

    ```


    有时您可能希望删除一个目录及其包含的所有文件。这可以通过使用 `rm` 命令和 `-r`（或递归）修饰符从父目录实现。此处显示的示例将删除名为 "testdata"
    的目录及其所有内容：


    ```bash

    rm -r testdir

    ```


    显然，在删除文件时需要格外小心，而在删除完整目录时需要更加谨慎。


    ### 文件


    在正常情况下，用户使用应用程序生成文件，但为了实验目的，可以使用操作系统生成临时文件。这可以使用 "touch" 命令实现，如下例所示，这将生成一个名为 "test"
    的文件：


    ```bash

    touch test

    ```


    该文件将放置在当前目录中，但通过在文件名之外包含目录路径，可以将其放置在文件结构中的任何位置。可以使用 `rm` 命令删除文件，此命令将删除前一个示例生成的文件：


    ```bash

    rm temp

    ```


    当然，要使这起作用，该文件必须位于当前目录中。通过指定完整路径和文件名，可以删除其他目录中的文件。路径结构取决于系统默认设置，系统可能会询问您是否要删除文件，此时您必须回答
    y、Y 或 r 表示是。由于没有内置的文件检索系统，因此如果您删除文件，它将被视为永久丢失。


    在 MS-DOS 中，可以使用 `*` 通配符删除目录中的所有文件。在 Linux 中也可以这样做，如下例所示：


    ```bash

    rm /root/*

    ```


    这将删除 /root 目录中的所有文件，但根据系统的默认设置，可能需要确认每个文件的删除。


    ### 文件名


    MS-DOS 用户会注意到，MS-DOS 中的 `*.*` 在 Linux 中被替换为仅 `*`。MS-DOS 文件名最多可有八个字符加上最多三个字符的扩展名。扩展名跟在主文件名之后，并通过句点分隔。这三个字符的扩展名通常用于指示文件类型，如文本文件的“txt”或
    JPEG 图形文件的“.jpg”。文件名扩展也可以在 Linux 系统中使用，但句点不具有与 MS-DOS 中相同的意义。句点字符在 Linux 中几乎只是另一个普通字符。文件名“ch1.txt”在
    Linux 中就像“chapter1.txt”一样有效。文件名“bk.chapt1”对于一个被设计为识别“.txt”扩展名的文本文件程序来说同样有效。以下是构思
    Linux 文件名时值得记住的一些有用要点：


    #### 最大字符数


    Linux 文件名中最多可以使用 256 个字符。但是，如果您将自己限制在大约 40 个字符以内，事情会变得更加易于管理。


    #### 大小写敏感性


    文件名中可以使用大写字母和小写字母，与 MS-DOS 不同，Linux 将视为两组不同的字符。在 MS-DOS 中，名为“london”、“LONDON”和“London”的文件都具有相同的名称，但在
    Linux 中，它们将每个都具有不同的名称。


    #### 允许使用的字符


    文件名中允许使用数字和大多数其他字符，但某些字符不应使用，因为它们对 shell 具有特殊含义，可能导致令人困惑的结果。应避免使用以下字符：


    - 与号 &

    - 撇号 `

    - 星号 *

    - 脱字符 ^

    - 正斜杠 /

    - 连字符 -

    - 问号 ?

    - 引号 “” ‘’

    - 竖线 |


    还应避免使用空格字符，否则 shell 可能会将文件名解释为用空格分隔的两个或多个文件名。


    #### 通配符


    在某些 MS-DOS 命令中，可以使用通配符而不是提供完整的文件名。Linux 的工作方式也大致相同。星号字符在之前的示例中已使用，星号可用于表示任意数量的字符。问号可用于代替单个字符。假设您需要列出以“Fig”开头的文件，此命令将列出它们：


    `Fig*`


    如果您需要知道哪些以“Fig”开头且随后有两个字符并以“.gif”结尾的文件，此命令可以完成这项工作：


    `Fig??.gif`


    使用问号通配符时，请记住，只有当问号的数量与文件名中的字符数量相匹配时，它才能工作。例如，之前的示例中三个“Fig12.gif”都没问题，但它不会匹配“Fig1.gif”或“Fig100.gif”。这两个都可以由以下命令处理：


    `Fig*.gif`


    Linux 中还有第三个通配符，即方括号。在 MS-DOS 中，第三个通配符具有相同的效果，但要知道一对方括号（[ ]）。假设您想知道哪些文件名为“fig6a.gif”、“fig6b.gif”和“fig6c.gif”。您可以使用方括号专门搜索这些文件：


    `fig6[abc].gif`


    在大多数情况下，使用方括号可能没有意义，但在其他通配符不够具体的情况下，它们可能很有用。


    ### 复制文件


    使用 `cp` 命令复制文件，该命令必须指定要复制的文件及其目标目录。副本保留原始文件的文件名。此示例将当前目录中名为“test”的文件复制到 /root
    目录：


    `cp test /root`


    这假设名为“test”的文件位于当前目录中。如果源文件位于当前目录中，除了文件名外，还必须提供完整路径，如下例所示：


    `cp /bin/test /root`


    如果您希望将文件从其他目录复制到当前目录，请使用“.”作为目标目录。此命令将 /bin 目录中名为“test”的文件复制到当前目录：


    `cp /bin/test .`


    在复制操作期间可以更改文件名，只需在指定目标时提供新的文件名即可。例如，当将 /bin 目录中名为“nice”的文件复制到当前目录作为名为“bad”的文件时。当然，如果“bad”是一个目录，文件将以其原始名称复制到该目录中。


    `cp /bin/nice /bad`


    可以通过在 `cp` 命令中指定多个源文件，将一个目录中的多个文件复制到另一个目录。此命令将当前目录中名为“test”和“test1”的文件复制到 /root
    目录：


    `cp test test1 /root`


    您可以使用 `mv` 指令简单地移动文件，而不是复制它。其工作方式与 `cp` 命令非常相似，但原始文件将被删除。此命令将 /usr 目录中名为 `temp`
    的文件移动到 /usr/temp/：


    `mv /usr/temp /usr/temp/`


    此命令版本具有相同的效果，但移动的文件在移动过程中被重命名为“hello”。


    `mv /usr/temp /hello`


    如果要复制完整目录甚至目录结构，可以使用“ -R”选项参数测试 `mv` 或 `cp`。此示例将 /usr 目录中的所有目录和文件复制为当前目录的子目录。目录和文件名保持不变。


    `cp -R /usr/test_ .`


    可以使用 `mv` 命令移动整个目录或目录结构，不需要 `-r` 修饰符。此命令具有与上一个示例相同的效果，但原始目录结构将被删除。


    `mv /usr/test .`


    似乎没有与 MS-DOS `diskcopy` 命令对应的 Linux 命令，并且 Linux 比 MS-DOS 更少依赖磁盘。通过运行 `diskcopy`
    将磁盘内容复制到另一个磁盘，这是理所当然的。


