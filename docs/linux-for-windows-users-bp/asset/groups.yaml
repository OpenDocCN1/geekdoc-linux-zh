    FDISK 程序使用简单的命令行界面，您通过在下方的提示符（即回车键）处输入相应的字母来发出命令。在命令提示符处输入的任何原始数据都将在命令行中被解释。以下是使用
    FDISK 时可用命令的列表：


    -   a 切换当前分区的可引导标志

    -   d 删除当前分区

    -   l 列出所有分区

    -   m 主菜单

    -   n 创建新分区

    -   p 打印分区列表及分区详情

    -   q 不保存并退出

    -   r 替换当前分区的系统 ID

    -   v 修改显示/输入单位（柱面或扇区）

    -   w 保存更改并退出


    为了本示例的目的，假设 PC 将仅用于 Linux，并且其硬盘容量为 1000 MB。由于只有 32 MB 内存，您需要至少 32 MB 的交换磁盘空间（例如
    25 MB 或更多）。这意味着稍大一点的 50 MB 容量会更好。这大约占总磁盘空间的 5%。首先创建主分区，按下“N”键，当然还要按下回车键，电脑会响应如下：


