    4.19 中显示。接下来点击选择活动边框（Active Borders），并在图 4.20 中显示的子界面上的复选框上打勾。然后您可以启用可调节的进一步选项。通过在切换发生之前从菜单中选择它也很有帮助。使用延迟会减慢速度，但有助于避免从一个桌面到另一个桌面的意外切换。我绝对建议使用短延迟。


    ![](img/147f057d2f063d8c60ee616870537a94_75_1.png)


