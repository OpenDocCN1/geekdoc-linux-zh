    ## 自动启动


    “自动启动”图标提供了一个文件夹的访问入口，该文件夹包含在 KDE 启动时需要运行的程序或指向这些程序的链接。这与 MS/DOS 中存在的自动启动文件夹以及
    Windows 95/98 中的启动文件夹功能相同。每个拥有自己“自动启动”文件夹的用户都可以拥有自己希望在 KDE 启动时运行的一组程序。事实上，每个用户实际上都拥有自己的
    KDE 桌面，可以根据个人需求进行自定义。


    ## 模板


    “模板”文件夹，正如您可能猜到的，用于存储模板文件。暂时不需要担心这一点。许多程序可以使用模板在制作标准信函、书籍排版或任何其他文档时节省时间。如果您开始使用模板，可以将它们存储在此文件夹中。


    ## 面板


    面板是屏幕底部的横条，用 Windows 术语来说，这是一种工具栏，但它与 Windows 任务栏有相似之处。KDE 1.0 的面板看起来比快速运行当前程序的简单方式要笨重得多；图标区域是“一对四”的。这两个版本都有四个标记较少但功能相似的“按钮”：这些用于在
    KDE 的虚拟控制台等效物之间切换。但是，它们是“虚拟”控制台。在使用图形用户界面时，您可以解绑多任务处理，并且处理任务也有两种方法：就像 Windows
    任务栏一样，在一个桌面上简单地运行“两个”或更多程序，或者将每个程序放在单独的桌面上，这样您可以在四个桌面上运行“四个”程序。这两种方法都允许在每个虚拟桌面上运行多个程序。


    需要同时访问两个程序，这显然是将一个窗口中的项目拖放到另一个窗口中必不可少的。然后它们必须处于打开状态，第二个程序无需在同一桌面上打开。如果您拖放，不同的程序将在不同的桌面上打开。要在它们之间切换，只需单击屏幕底部相应的“虚拟控制台”，或使用面板中的桌面切换器。下面将更详细地描述这两种方法。


    虽然从一个到另一个的切换是多任务的，但请记住，多任务处理的程序越多，所需的系统资源就越多。为了使复杂的多任务处理正常工作，必不可少的条件是拥有充足的可用内存。鉴于当前
    PC 内存的低成本，这通常不是主要问题。


    在用于在虚拟控制台之间切换的按钮左侧，是用于启动程序的“弹出”外壳工具。它用于退出 KDE 会话。


    这将系统带回到控制台模式和命令行解释器。操作此按钮时，您有机会改变主意（以防您误操作），或者继续执行“注销”过程。您可能还会获得更多选项，如关闭系统、返回控制台或重启。下方两个小按钮中的一个是屏幕锁定按钮。


    ## 视而不见...


    您会注意到面板两端都有箭头。如果您尝试左键单击箭头右端，您会发现面板会扩展到屏幕的右侧。类似地，左键单击左端按钮会导致面板缩回屏幕的左侧。在这两种情况下，箭头都保持作为“开启”指示器，表示面板可以从其“主”位置“弹出”。您还会注意到，当您将光标移动到屏幕顶部时，它会导致面板弹回。同样，当您将光标移开面板上方的区域时，面板上方的区域会缩回，面板将保持在屏幕顶部。


    ![](img/147f057d2f063d8c60ee616870537a94_50_0.png)


    ### 3 使用 KDE


    要使用真正的全屏窗口，必须最小化面板。这有点像在 Windows 中隐藏任务栏，如果需要，可以自动隐藏。


    #### 程序


    任务栏左端标记有大写字母“K”的按钮，左键单击它会生成一个弹出菜单（图 3.2）。这相当于 Windows 的“开始”按钮，其中包含的菜单图标对于访问系统实用程序、程序等非常有用。菜单项具有悬停菜单，提供进一步的菜单选项。一些悬停菜单较短，仅提供更多几个选项；其他则较长，提供大量选项。


    ![](img/147f057d2f063d8c60ee616870537a94_51_0.png)


    建议熟悉 KDE 的工作方式及其在 Linux 文件系统中的等效功能。要运行程序，只需左键单击相应的菜单项即可。


    #### 任务栏


    任务栏位于屏幕顶部，与其 Windows 等效物类似，它显示所有当前正在运行的窗口，即使它们已被最小化并仅在后台运行。当您最小化窗口时，它显示在任务栏上。


    ![](img/147f057d2f063d8c60ee616870537a94_51_1.png)


    最小化后，窗口折叠并移动到其在任务栏上的相应部分。要重新激活窗口，只需左键单击其在任务栏上的部分。


    这就是 KDE 任务栏的全部内容，其范围比 Windows 等效物相当有限。面板和任务栏加在一起大致相当于 Windows 任务栏。


    #### KFM


    当 KDE 启动时，可能有一个打开的窗口（图 3.4）。这通常默认存在，窗口中运行的程序是 KFM。该程序对使用 KDE 至关重要，因此有必要花时间熟悉 KFM
    的工作方式。KFM 是一个 KDE 文件管理器程序，其在 Windows 95/98 中的等效物是桌面上的“我的电脑”图标。


    换句话说，您使用 KFM 来浏览文件、管理文件系统、运行程序、复制、删除和重命名文件，而不是使用整个命令行解释器，后者原本需要使用命令行来处理。如果 KFM
    未运行，请在主目录（例如，如果您以“root”身份登录，则为 /root）中左键单击房屋图标。


    文件或文件夹的简要详细信息在窗口底部的状态行中提供。如果将光标放在 KWin/KDM 中的图标上，会出现一个包含所选文件简要描述的气泡；在 Nautilus
    中，会出现一个包含类似信息的弹出窗口。右键单击图标，会出现一个下拉菜单供您选择已注册用于处理该图标的程序。在可能的情况下，您不应该在标准文件类型（如 PDF、GIF、JPEG
    和纯文本文件）方面遇到问题。右击图标会弹出一个小菜单，如图 3.5 所示。此菜单可访问一些基本任务。


    ### 删除/回收站


    删除选项在功能上等同于使用 Unix 的 `rm` 命令。区别在于，以这种方式选择文件实际上不会被删除，而是移动到一个名为回收站的文件夹中。这与将文件拖到回收站图标一样，在从回收站清空之前可以恢复。


    ### 打开方式


    此选项会弹出一个对话框，在其中输入用于打开文件的程序名称（包括路径）。或者，可以使用浏览按钮来定位并启动文件（图 3.5）。对话框还提供了一个将文件复制到当前工作文件夹的选项。在这种情况下，需要双击文件夹或程序才能打开它。


    ### 复制


