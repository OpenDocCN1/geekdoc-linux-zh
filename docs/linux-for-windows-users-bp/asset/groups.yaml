    ## 使用多个窗口和键盘快捷键时需格外小心，因为只有在正确的窗口处于激活状态时，快捷键才能产生预期的结果。


    ## 查看窗口


    编辑菜单（复制、删除等）通过其他方式变得可用。查看菜单（图 3.11）控制主屏幕区域显示的信息。


    具有某些实用功能的文件不会停止出现在主窗口区域。当“显示隐藏文件”选项处于激活状态时（菜单中该选项旁边的复选框中标有对勾指示），通常会显示隐藏文件。


    ![](img/147f057d2f063d8c60ee616870537a94_56_0.png)


    图3.10 在 KDE 窗口中运行的终端（控制台）


    生成链接。尝试生成一个链接，并查看其图标下方出现的文件名。这是斜体字，表明它只是一个链接，而非实际文件。


    ## 程序图标


    注意，文件图标可以从窗口拖拽到桌面上。对于 Windows 图标，只需双击其图标即可运行程序。在 Linux 中，可以拥有类似的设置，但这只是将每个程序图标拖拽到
    KDE 桌面并选择链接选项而已。为了在桌面上运行该图标对应的程序，你需要选择“运行此程序”选项。不要双击该图标，否则你将看到两个该程序的副本同时在运行。


    ## KDE 控制台


    文件菜单中的“打开终端”选项会在 KDE 窗口中运行一个控制台（图 3.10）。此控制台的用法与普通 bash shell 非常相似，但可以在其中输入命令。你甚至可以使用滚动条查看命令历史，这些历史通常存储在某个选项菜单中。例如，当
    KFM 正在运行时，按下 Control+T 即可启动控制台。一如既往，你需要小心...


    ![](img/147f057d2f063d8c60ee616870537a94_56_1.png)


    图3.11 KFM 编辑菜单


    ## 缩略图查看


    激活“显示缩略图”选项后，大多数类型图形文件的图标将显示为文件中包含的图像的微型版本（图 3.12）。这使得选择正确的文件变得容易，但如果目录中有大量图形文件，显示它们可能需要一些时间。


    ## 显示树状图


    树状视图（图 3.13）将主屏幕区域分割，并在主窗口区域的左侧添加一个目录树。这显示了根目录（/）、主目录（Home）和桌面文件夹中的所有文件夹。最初要打开一个文件夹，请单击其旁边的小三角形按钮。三角形随后向下指向，表示该文件夹已打开。


    而 KFM 文本视图提供了图标的替代方案。文件夹的内容显示在其下方。请注意，在此上下文中，文件夹的内容是其他文件夹，而不是文件。在文本视图中打开文件夹不会导致文件简化方面的任何变化；主屏幕区域中几乎没有“手动部分”。文本视图实际上只是目录结构的地图，旨在帮助你导航复杂的目录结构。


    ## 文本视图


    使用文本视图时，图标会消失，并被更详细地描述每个项目名称和说明的文本行所取代。这是用对象的名称或文件名替换图标。使用文本视图确实为你提供了大量选项，你可以使用这些选项进行滚动。你可以通过单击其文件名来打开文件或文件夹，但不能单击文件名右侧的信息。文件名还可以拖拽到另一个窗口中。


    文件夹名称以品红色打印，文件名以红色打印。


    ## 简短视图


    简短视图选项是一种文本显示形式，但与长文本模式不同，它只提供文件名而没有详细信息（图 3.15）。正如


    ![](img/147f057d2f063d8c60ee616870537a94_57_0.png)


    图3.14 KFM 文本视图提供了图标的替代方案


    ![](img/147f057d2f063d8c60ee616870537a94_57_1.png)


    图3.12 选中缩略图选项的 KFM


    ![](img/147f057d2f063d8c60ee616870537a94_57_2.png)


    图3.13 屏幕左侧区域显示树状视图


    ## 选项


    选项菜单（图 3.17）可根据需要启用菜单栏、状态栏、位置栏和工具栏。Save Settings 行上的保存选项会将当前设置保存为新的默认值，以后运行 KFM
    时将使用这些设置。当然，如果使用每个用户或其他用户的设置，这些默认值不会受到影响。配置文件管理器选项会弹出另一个菜单（图 3.16），允许更改字体和配色方案等。如果你正在使用高分辨率显示器，建议将字体大小从默认设置


    ![](img/147f057d2f063d8c60ee616870537a94_58_0.png)


    ![](img/147f057d2f063d8c60ee616870537a94_58_1.png)


    悬停在文件名上，将光标置于文件名上，窗口底部的状态行会显示该文件的一些简要详细信息。对于包含大量文件的目录，这是最实用的模式。


    ## 跳转


    在“跳转”菜单的底部，你会看到一个最近使用 KFM 打开的文件和文件夹列表（图 3.16）。这与 Windows 中的“最近”列表非常相似，列表中的任何内容都可以通过选择来打开。


    ![](img/147f057d2f063d8c60ee616870537a94_58_2.png)


    ![](img/147f057d2f063d8c60ee616870537a94_58_3.png)


    从“小”改为“中”甚至“大”。这使得图标下方的标签以及文本视图模式下的文件列表更容易阅读。


    ## 红色警示


    如果你以“root”身份登录，每个 KDM 窗口在菜单栏左侧都会有一个红色条。"File" 是一个提醒，表明你具有管理员权限，可以更改可能破坏系统的系统文件。在此模式下，尤其是当你在试验
    KFM 时，比平时需要更加谨慎。如果你以非“root”身份登录，仍然可以以超级用户模式运行 KFM。在第一个屏幕上的“登录到...”按钮上，单击“超级用户”选项卡（见图
    3.19）。接下来，输入密码，系统会要求你输入密码。输入“root”密码后，一个具有超级用户权限（和红色“旗帜”）的 KFM 副本就会打开。


    ![](img/147f057d2f063d8c60ee616870537a94_59_0.png)


    图 3.19 以超级用户模式启动 KFM


    ## KFM 与 tar 文件


    KFM 使查看 tar 文件甚至压缩 tar 文件的内容变得非常容易。这些包括 ".tar"、".tgz"、".tar.gz"、".tar.bz2" 以及压缩
    tar 文件。当在 KFM 主窗口中，你双击一个文件（或 KFM 能打开的任何文件）时，文件夹 KFM 窗口会变更以显示该文件中该文件夹的内容。图 3.20
    展示了一个示例。在 KFM 主窗口中左击像 readme 文件这样的 tar 文件，它也可以在一个查看器中打开。（在 KDE 3.0 及更高版本中，KFM
    主窗口显示 tar 文件的内容。）


    ![](img/147f057d2f063d8c60ee616870537a94_59_1.png)


    图 3.20 KFM 显示归档文件的内容


    以相同方式查看文件。通常只需单击图形文件，KFM 就会在一个窗口中显示它们。Tar 文件没有那么容易。KWM（KDE 的文件管理器）有一个内置的视图，可以轻松查看
    tar 文件的内容。你可以使用“查看”菜单来显示 tar 文件的内容。或者你可以使用 KMD（KDE 的内置 tar 文件查看器），它与 KWM 类似，也可以显示
    tar 文件的内容。或者，你只需在终端窗口中使用 "tar" 或 "tar.gz" 命令来查看 tar 文件的内容。


    ## 软盘复制


    与 Linux 命令行一样，KDE 没有内置的软盘复制功能。虽然并不太容易制作软盘的精确克隆，但使用 KFM 可以在 3 个步骤中制作软盘的精确克隆。显而易见的方法是：插入一张空白软盘到驱动器中并左击其图标，然后将原始软盘放入驱动器并左击该图标。这将从空白软盘复制数据到驱动器中的软盘。（反过来也是真的：你可以将原始软盘的数据复制到空白软盘。）通过更换为空白软盘并按下
    KFM 主窗口中的复制按钮，你可以将原始软盘的内容复制到空白软盘。

    '
