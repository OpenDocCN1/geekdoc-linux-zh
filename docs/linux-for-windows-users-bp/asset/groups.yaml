  - '[PAGE 40]


    C Create new archive

    F Place archive on a file or device

    F Append new files to existing archive

    T List the names of files in an archive

    V Verbose (list filenames as they are added or extracted)

    X Extract files from an archive

    M Expect multi-volume archive

    W Verify that archive does not contain errors

    Z Compress or uncompress (zip) files


    For the sake of this example assume that you wish to archive the files in /root/temp
    to a floppy disc. First the floppy disc drive must be fitted with a disc having
    sufficient storage space, and then it must be mounted. This command would then
    have the desired effect, archiving the files to a single file called "but1.tar".


    ```

    tar cWZ /mnt/floppy/but1.tar /root/temp

    ```


    The c option tells tar to create a new archive, the f option instructs it to put
    the archive into a file, and the W option causes it to place messages on the screen
    showing exactly what it is doing. The V is optional, but the c and W are essential.


    # ### Zipping


    To do the same thing but compress the files in the archive the Z option would
    be added, as shown here:


    ```

    tar cWZ /mnt/floppy/but1.tar /root/temp

    ```


    The Z has not been put in uppercase by mistake. Some option letters case so as
    with symbolic links you have to be careful to use the right one, the usual being
    that from the options has also been omitted, and these options will not be included.
    If it should happen that you get things wrong it is possible that tar will hang-up.
    This should never happen, using the Control- Z key combination should stop it
    from doing so.


    To key a list of files in this zipped archive the following command would be used:


    ```

    tar tWZ /mnt/floppy/but1.tar

    ```


    The "Z" must be included or tar will not recognise the file as a valid tar file,
    and will return an error message. Of course, to read the contents of




    the non-zipped version the Z would have to be omitted for the same reason.


    # ### Multi-volume


    In the tar program it is possible to archive files to a device rather than a file.
    In other words you specify a device such as the floppy drive as the destination
    rather than a file. To do this the device must first be mounted of course. Suppose
    that the /root/temp directory is to be archived onto a floppy disc. First the
    floppy drive would be mounted using a command such as this:


    ```

    mount /dev/fd0 /tmp

    ```


    A blank floppy disc to take the archive should be placed in the drive before the
    mount command is issued. This command would then be used to make the archive on
    the floppy disc:


    ```

    tar cvf /dev/fd0 /root/temp

    ```


    The relatively low capacity of a floppy disc is a definite drawback when backing
    up directories, because the amount of data in the directory may well have several
    times capacity greater than the capacity of a single disc. Even with a higher
    capacity drive than the 1.44Mb floppy backup disc more data than a single floppy
    disc can hold, so one will have to use multiple floppy discs to archive large
    collections of data. The DOS and Unix archive programs get around this problem
    by enabling an archive file to be spread across several discs or tapes. The MS-DOS
    ARJ program and the Linux tar program can record several volumes for one disc
    or tape so they can be unarchived without having to worry about running out of
    space on a single disc. This is the multi-volume version of the previous example:


    ```

    tar cvM /dev/fd0 /root/temp

    ```


    The program will tell you when you need to change to the next disc in the set.
    The disc should be unmounted so that you can use them in the correct order when
    restoring files.


    # ### Restoring


    Since they are archived into a single file, the files backed up using tar are
    not directly usable. The files must be extracted, and this is done using the tar
    program again. The command for extracting files is actually the same as the one
    for producing them in the first place, but the x (extract) option is used in place
    of the c (create) option. A command'
  - '[PAGE 41]


    documentation. Incidentally, if you write to a floppy disc as a device rather
    than as a file using tar, you will find that the disc is no longer usable as an
    ordinary disc. In order for you to use it again as a standard disc it will have
    to be formatted which will, of course, remove any data it contains.


    # RPM


    Many programs are distributed as tar files, or more usually zipped tar files.
    In order to use one of these the readme file is read to determine what to do next.
    This will often entail running an installation program on how to get included
    documentation should give useful instructions on how to get the software “up and
    running”. The main alternative to tar files is the RPM format. RPM in this context
    stands for Red Hat Package Manager, and although this software was produced by
    Red Hat it is freely available and any recent version of Linux should be equipped
    to deal with this type of file. You will often find far too many of the options
    of installing software from some form of tar file or an RPM file. RPM files have
    definite advantages, so given the choice it is almost certainly better to opt
    for the RPM route.


    At first sight they may seem to be no need for RPM or any form of package installation
    program. Why not simply load a program file onto the hard disc and run it? This
    type of thing was the norm in the days of MSDOS and other relatively simple operating
    systems, but few programs are heavily dependent on libraries or shared object
    files so it is quite difficult to just drop these files on a hard disc and get
    them to work. Many of these shared files are used by a number of programs, and
    with modern computing systems came with complex with all the files it would require,
    easier to create. With RPM it is much easier to do this. With RPM files there
    are many advantages to this approach so long as one is aware of its duplications
    and waste disc space.


    The drawback of the shared approach, and each program being dependent on support
    files is that there is plenty of opportunity for things to go wrong. If a program
    requires certain files to be present on the computer, are those files already
    installed? RPM is designed to ensure that present, are they the correct versions?
    It will not only detect any problem, but also offer solutions. Many of the original
    support files are already present and some of the required support files are also
    installed by other programs so there are often conflicting dependencies. These
    dependencies may be resolved by installing new software or upgrading existing
    software. There are often different versions of the same support files, and this
    can be a source of problems. However, with some form of support, it is possible
    to make the system more consistent.


    ```

    tar xfV /mnt/floppy/but1.tar /root/temp

    ```


    to extract the files from an archive takes this form:


    tar options archive destination

    The destination is optional, and if it is not specified the files will be placed
    in the current directory. This command would reverse an earlier example, and take
    the files from but1.tar on a floppy disc and place them in /root/temp


    ```

    tar xfV /mnt/floppy/but1.tar

    ```


    There is a potential trap here in that tar removes the leading “./” from filenames,
    and so files are stored here as relative to the current directory. This will mean
    that if you have absolute paths, when archiving files using tar. Another way round
    this is not use absolute paths when archiving files using tar. This command would
    archive the files in the current directory to file but1.tar on the floppy disc:


    ```

    tar cf /mnt/floppy/but1.tar *

    ```


    This would extract but1.tar and place them back in the current directory:


    ```

    tar xf /mnt/floppy/but1.tar

    ```


    Note that it is not just files that tar archives, any subdirectories and their
    contents will be treated as part of the directory being archived. Extracting files
    from a device is much the same as extracting them from a file, but the device
    rather than a file is specified as the source. This would reverse the example
    of archiving to a device given previously:


    ```

    tar xf /dev/fd0 /root/temp

    ```


    With multi-volume archives the “W” option must be included, as in this example:


    ```

    tar xfWV /dev/fd0 /root/temp

    ```


    The correct floppy discs must be inserted in the drive when requested by the program,
    and you will be in trouble if they were not numbered when the archive was created.


    tar is undoubtedly a rather complex program to use, but for some simple tasks,
    such as extracting files from an archive, it is very useful. When dealing with
    a rather large number of files, you might want to use a more sophisticated method.
    There are plenty of graphical tools that make dealing with archives much easier,
    and they are well worth reading through the on-line help sections.'
  md: '

    ### tar 选项说明

    - C 创建新归档

    - F 将归档放置到文件 or 设备

    - A 追加新文件到现有归档

    - T 列出归档中的文件名

    - V 详细模式（在添加或提取文件时列出文件名）

    - X 从归档中提取文件

    - M 期望多卷归档

    - W 验证归档是否不包含错误

    - Z 压缩或解压（zip）文件


    假设在这个示例中，你希望将 /root/temp 中的文件归档到软盘。首先，必须将软盘驱动器配备有足够存储空间的软盘，然后必须挂载它。该命令将产生预期效果，将文件归档到名为
    "but1.tar" 的单个文件中。


    ```

    tar cWf /mnt/floppy/but1.tar /root/temp

    ```


    c 选项告诉 tar 创建一个新的归档，f 选项指示它把归档放入文件，W 选项使其在屏幕上显示消息，确切地表明它正在做什么。V 是可选的，但 c 和 W 是必不可少的。


    ### 压缩


    要做同样的事情但压缩归档中的文件，需要添加 Z 选项，如下所示：


    ```

    tar cWZf /mnt/floppy/but1.tar /root/temp

    ```


    Z 并非错误地使用大写。某些选项字母区分大小写，因此必须小心使用正确的那个。从选项中省略了一些，这些选项将不包含在内。如果操作不当，tar 可能会挂起。这种情况不应该发生，使用
    Control-Z 键组合应该可以阻止这种情况发生。


    要键入此压缩归档中文件列表，应使用以下命令：


    ```

    tar tWZf /mnt/floppy/but1.tar

    ```


    必须包含 "Z"，否则 tar 将无法将该文件识别为有效的 tar 文件，并返回错误消息。当然，要读取未压缩版本的内容，出于同样的原因，必须省略 Z。


    ### 多卷


    在 tar 程序中，可以将文件归档到设备而不是文件。换句话说，你指定软盘驱动器等设备作为目标，而不是文件。为此，当然必须先挂载设备。假设 /root/temp
    目录要归档到软盘上。首先使用如下命令挂载软盘驱动器：


    ```

    mount /dev/fd0 /tmp

    ```


    在发出 mount 命令之前，应将一张空白软盘放入驱动器以接收归档。然后使用该命令在软盘上创建归档：


    ```

    tar cvf /dev/fd0 /root/temp

    ```


    软盘相对较低的容量是备份目录时的一个明显缺点，因为目录中的数据量可能远超过单个软盘的容量。即使使用比 1.44MB 软盘备份盘更高容量的驱动器，数据量也可能超过单个软盘所能容纳的量，因此需要使用多张软盘来归档大量数据。DOS
    和 Unix 归档程序通过允许将归档文件分布在几张软盘或磁带来绕过这个问题。MS-DOS ARJ 程序和 Linux tar 程序可以为一张软盘或磁带记录多个卷，因此可以在不担心单个软盘空间不足的情况下解归档。这是前一个示例的多卷版本：


