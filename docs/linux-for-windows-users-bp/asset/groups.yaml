    程序，您可能需要在安装过程中运行它。这并不困难，但您需要控制分区过程。FDISK 将在安装过程的早期运行。如果您需要安装并行的 Linux 与其他操作系统共存，您应非常小心，以免意外导致其他操作系统被删除。


    许多运行 Windows 的 PC 将整个硬盘，即使是高容量磁盘，设置为作为单个驱动器运行。这个磁盘通常被指定为驱动器 C。因此，许多 Windows 用户可能不熟悉硬盘分区的概念。这是一个非常简单的想法，即单个驱动器可以像实际上是两个或更多较小的驱动器一样使用。而不是将一个
    6.4 GB 的驱动器用作单个驱动器，它可以用作两个 3.2 GB 的驱动器。它们将被指定为驱动器 C 和 D。额外的分区称为逻辑驱动器，它们不是独立的硬件部件，而是旋转的。这些也被称为逻辑分区，我们可以使用它们。正如我们之前讨论的那样，它们也有缺点。一个大的未使用磁盘空间块，其总容量通常更有用。


    在 Linux 中，磁盘上通常至少有两个分区。如前所述，其中一部分通常分配给交换磁盘，这是操作系统用于临时存储的容量。Windows 可以拥有这种类型的永久交换磁盘，但具有性能优势。然而，大多数
