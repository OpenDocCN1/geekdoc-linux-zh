    在可能的情况下，通过指出这两个系统之间的相似之处，使从 Windows 到 Linux 的转换尽可能“无痛”。假设读者具备 MS-DOS 和 Windows
    的基本操作知识，但不要求更多。为了跟随本书内容，并非必须拥有特定的硬件，但命令行解释器及较新版本的 Linux 应足以满足要求。Linux 有多种 GUI
    可用，但 K 桌面环境（KDE）使用最广泛，并且现已包含在所有主要的 Linux 发行版中。为了利用 GUI 相关内容，KDE 版本 1.0 即可满足要求，但最好使用
    1.1 或更高版本。


