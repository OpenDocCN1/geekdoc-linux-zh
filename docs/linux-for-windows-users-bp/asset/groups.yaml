    ## 选择困扰


    对于刚接触 Linux 的新手来说，一个稍显令人困惑的方面是，有多家不同的软件公司都在提供它。要理解这是如何形成的，我们需要简要回顾一下 Linux 的起源。Linux
    是由 Linus Torvalds 领导的一群人开发的，他们试图编写一个适用于单处理器计算机的 UNIX 操作系统版本。实际上，这意味着要为 IBM PC
    及其兼容机编写 UNIX 版本，尽管也有一些基于 Intel 处理器的其他计算机。UNIX 被广泛认为是最强大、最通用的操作系统之一，经常出现在高端系统中，特别是用于科学和技术应用的系统。它当然也用作计算机网络操作系统。通过互联网协作，试图创建像类
    UNIX 操作系统这样复杂的东西，似乎有点好高骛远，但该计划是成功的，并持续蓬勃发展。


