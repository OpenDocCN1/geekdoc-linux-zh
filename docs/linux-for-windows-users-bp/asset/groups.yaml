    ## 版本


    尽管 Linux 有很多优点，但有一个主要缺点，正是这一点导致了各种 Linux 版本的发布。Linux 是一个非常强大的 32 位操作系统，但其最基本的可用形式是命令行界面（CLI）。命令被输入到某种编辑器中，在这种方式使用时，可以认为安装正确的
    Linux 非常困难。这促使个人和公司生产各种 Linux 增强功能，使其更易于使用和（或）安装。无论你从哪里获取 Linux，你都不太可能只得到 Linux
    内核。使用杂志版本，通常你会得到一张包含 Linux 内核和各种支持文件、引导安装过程以及实用工具和应用程序的 CD-ROM。应该有文档。你应该会发现一些有用的东西很容易安装，特别是如果你是
    Linux 完全新手。磁盘上包含文档，可能还有一些源代码。


    如果你购买 Linux，通常你会得到更多的实用工具和应用程序。此外，你还会得到更多的文档。材料数量如此之大，单张 CD-ROM 是不够的，通常一套 Linux
    包含两张到四张 CD-ROM。较便宜的版本随附手册，而较昂贵的版本虽然附带少量或没有印刷材料，但包含大量印刷文档。如果你通过互联网下载 Linux 或从计算机杂志获取
    Linux，你更可能需要付出额外的大量努力。这不是例外，因为它们是相同的。只有拥有互联网连接时，才能获得支持。如果你购买 Linux，至少应该能获得有限期限的技术支持，以帮助你正确安装所有东西。


    Linux 的新手常常质疑他们可以购买这个所谓的免费 Linux 操作系统这一事实，并且某些实现并不特别


    Linux 还具有非并发多用户操作设施，操作员轮流使用计算机。对于每个操作员或操作员组来说，就好像他们拥有自己的计算机，没有其他用户。


    ## 非并发


    ## 安全性


    作为多用户功能的副产品，Linux 具有出色的安全功能。每个用户都有自己的密码，并且可以拥有管理员无法访问的文件，而对系统的大多数更改只能通过登录超级用户来实施。这应该确保缺乏经验的用户不会意外做出破坏系统安全和稳定性的更改。还有使用安全功能的选项。使用安全功能设置起来很容易，但如果你是新用户，设置起来就困难了，对于试图以某种方式与数据文件交互的人更是难上加难。


    ## 源代码


    Linux 常被称为免费操作系统，但在 Linux 语境中，这个“免费”一词有点含糊。它通常指的是言论自由中的“自由”，而不是免费面包中的“免费”。大多数非
    Linux 软件是按“原样”出售的，如果存在小 bug，你无能为力。期望从出售它们的制造商那里获得支持。问题在于，当你购买操作系统时，你希望制造商以某种形式提供支持，但当它是免费的时，他们不会。代码是唯一的可用资源。Linux
    比其他操作系统更通融。从理论上讲，你可以修改源代码并编译程序，以使其完全符合你的需求，或移除你遇到的任何 bug。实际上，这种事情远远超出了大多数用户的能力，雇用某人为你完成这项任务可能昂贵得令人望而却步。另一方面，Linux
    社区有很多用户愿意利用他们的专业知识来帮助那些对主题没有真正理解的人。


    ## 它是免费的


    Linux 对许多人的一个巨大吸引力/吸引力在于，它也是面包意义上的免费。可以从互联网下载，尽管以这种方式获取相当完整的 Linux 实现可能需要花费很多时间，即使你有快速互联网连接。如果没有，可能需要几天时间。不时地，计算机杂志会推出包含完整
    Linux 套件的 CD-ROM，这可能是以最低成本试用 Linux 的最佳方式。第三种选择是购买 Linux，这时事情可能会变得有点混乱。有多种版本可用，有时每种版本还有一个以上的版本。


