    interpreter is permanently typed at the keyboard will simply duplicate the existing
    text and will not overwrite. The Backspace and Delete keys simply duplicate the
    backspace function. However, this is all you need to edit commands. With MS/DOS
    it is possible to clear the console screen and start afresh at the top using the
    cls command. This is the Linux equivalent:


