    ## 根目录


    对于那些多年来一直使用 Windows 和 MS-DOS 的用户来说，Linux 文件系统可能需要一点时间才能习惯。在 Windows 和 MS-DOS 中，事物往往更加分块，每个用户都有自己独立的目录、驱动器，或者查看其目录结构，但任何特定磁盘的内容只能通过切换到该驱动器来查看。在
