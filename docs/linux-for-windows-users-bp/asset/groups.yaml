    During the install process you will also be asked for the password for the root
    account. You may also be asked for the password for the user account that you
    are creating. If you are not going to set up a user account, you can just press
    return at the password prompt.


    Note that the password is not displayed on the screen when you type it in. This
    is normal, and does not mean that you are not typing it in.


    It is often a good idea to use a different password for each account, and to change
    your password regularly. It is also a good idea to use a strong password, which
    includes a mix of upper and lower case letters, numbers, and symbols.


    The more complex your password, the harder it will be for anyone to guess it,
    but also the harder it will be for you to remember it.


    The installable program will give some guidance about choosing an acceptable password,
    but it normally has to be four or more characters in length, and can consist of
    upper and lower case letters, plus numbers and punctuation marks. The more complex
    the password, the harder it will be for anyone to guess it, but the harder it
    will be for you to remember it.


    It will be for the user to remember. If you should forget the root password it
    will not be possible to make changes to the Linux installation, and it might become
    necessary to reinstall Linux. Do not use the popular and predictable passwords
    such as the date of your birthday or your name as spelt or misspelt (e.g. believing
    rather than wellbrow) with a place where you misspell (eg. spelling backwards).
    These should stick in your mind but should not be easy for anyone to crack.


    ## X Windows


    Assuming you have elected to install the X Windows system, this will probably
    require a certain amount of manual configuration. With some recent versions of
    Linux the installation process will try to determine the hardware present by a
    system of software probing; if this is successful the probing process will be
    less than manual configuration, but it is likely that you will still have to do
    some manual configuration. The X config file contains a large amount of configuration
    information about the type of mouse you use; probing is only used for this. You
    will also need to know the amount of memory on the video card, or something else.
    The initial XFree86 Setup program is normally achieved using the XF86Setup program.


    Manual configuration is normally achieved using the XF86Setup program. It asks
    if you wish to run this now or later. I would suggest choosing “later” because
    the “Now” option actually means it will be postponed until a little later! When
    the configuration program is finally run it provides an initial help screen (Figure
    1.5), which helps with navigation around the program. Some information about the
    type of mouse in use is usually requested prior to the XF86Setup program being
    run, and it is very easy to navigate your way around so it will be working from
    the outset. It then runs a menu of items including the mouse configuration options.
    The page in Figure 1.5 is used to control this until the mouse is working. Assuming
    you know exactly what type of mouse you are using there should be no problem getting
    it to work properly.


    One area of confusion concerns Logitech mice. The Logitech mouse does not work
    with modern Logitech serial mouse, and does not support my slightly ancient Logitech
    mouse, unless you have a genuine antique ‘Logitech mouse’ it is the Microsoft
    option that should be used. If there is a generic serial mouse option this should
    also work for practically any serial mouse. Many computers are supplied with serial
    mice that are not produced by one of the main mice manufacturers. Again, the Microsoft
    or generic serial mouse options should give good results.


