    ## 卸载


    一旦软盘驱动器或 CD-ROM 驱动器被挂载，你就应该使用正确的 Linux 术语，即卸载（unmount），以“拆卸”媒体，直到其被卸载。对于 CD-ROM
    驱动器，在驱动器卸载之前，其弹出按钮不太可能工作。卸载命令遵循与挂载命令相同的格式，但使用 unmount（不是 umount）命令词代替 mount。因此，以下两条命令将卸载软盘和
    CD-ROM 驱动器：


    ```

    umount /dev/fd0

    umount /mnt/cdrom

    ```


    请注意，如果你当前正位于该目录中，系统正在以任何方式使用它，你就无法卸载该驱动器。尝试这样做只会产生一个指示设备正忙的錯誤消息。


    ## 导航


    通过命令行解释器在文件系统中导航，永远无法像使用 KDE 这样的桌面系统那样容易。然而，最好是在你熟悉了通过命令行解释器在文件系统中移动和通过其替代结构导航目录的基础知识之后，再尝试使用
    KDE 之类的程序。除了图形界面提供的一些便利（如在两个或多个目录之间拖放文件）之外，你需要使用的基本命令都包含在系统的 `pwd`（man 8）命令中。


    你可以使用 `pwd` 从一个目录移动到另一个目录。使用 `cd`（更改目录）命令。如果你尝试这条命令，它应该响应当前目录的详细信息：


    ```

    pwd

    ```


    要从一个目录移动到另一个目录，使用 `cd`（更改目录）命令，这与 MSDOS 中同名的命令类似。无论当前位于哪个目录，此命令都会将当前位置移动到 /usr
    目录：


    ```

    cd /usr

    ```


    不需要提供新目录的完整路径；只需告知系统当前所在的目录（例如在 /usr 目录中）以及你想要移动到的目录（例如想要移动到 /usr/lib 目录），因此我们只需写
    `cd lib`。


    想要的效果：


    ```

    cd /root/Desktop

    cd Desktop

    ```


    在 /msdos 中，“.” 可以用作当前目录的缩写，“..” 可以用作其父目录的缩写。因此，此命令可以向上移动一级目录：


    ```

    cd ..

    ```


    例如，如果使用此命令时系统位于 /root/Desktop，那么之后它将会位于 /root。


    ## 列表


    在 MSDOS 中，`dir`（目录）命令用于列出目录的内容，相同的命令在 Linux 中也有效。Linux 提供了一种替代方案，即 `ls`（列出）命令，这似乎是获取目录信息的首选命令。这两个命令中的任何一个都可以列出当前目录的内容：


    ```

    ls

    dir

    ```


    系统不必位于某个目录中才能列出其内容。此示例将列出 /usr 目录的内容，无论系统当时位于哪个目录：


    ```

    ls /usr

    ```


    ## 颜色


    基本的 `ls` 命令存在一个小问题，即屏幕上显示的信息相当模糊。无法区分文件和子目录。但在 Linux 版本的 `ls` 中，可以通过使用颜色选项来避免这一问题，如下例所示：


    ```

    ls --color

    ```


    注意，“color”一词必须拼写为美式英语形式，如果使用“colour”则不起作用。如果在一个包含多种类型文件的目录中尝试此操作，结果应该是一个多彩的显示，每种文件类型使用不同的颜色。此列表显示了用于几种常见文件类型的颜色。


    '
