  - '[PAGE 59]


    "small" to "medium" or even "large." This makes the labels under the icons and
    the lists of files in text view modes much easier to read.


    # In the red


    If you log in as "root" each KDM window just have a red bar just to the left of
    the menu bar. "File" is a reminder that you have supervisor status and can make
    changes to system files that could mess up the system. In this mode it is necessary
    to exercise more caution than normal, especially when experimenting with KFM.
    If you log in as something other than "root", it is still possible to run KFM
    in the super user mode. On the "Log on to..." button on the first screen, click
    the "Super User" tab (in Figure 3.19). Next, enter the password, and you will
    be asked for the password. Enter the "root" password and a copy of KFM with superuser
    privileges (and the red "flag") will then open.


    ![](img/147f057d2f063d8c60ee616870537a94_59_0.png)


    Fig. 3.19 Starting KFM in the superuser mode


    # KFM and tar files


    KFM makes it easy to examine the contents of tar files and even zipped tar files.
    These ".tar", ".tgz", ".tar.gz", ".tar.bz2" and even zipped tar files. When on
    the main KFM window, you double-click a file (or just any file that KFM can open),
    a folder KFM window changes to show the contents of the file in that folder. Figure
    3.20 shows an example. Left-click on a tar file such as a readme file in the KFM
    main window, it can also be opened in a viewer. (In KDE 3.0 and later, the KFM
    main window displays the contents of a tar file.)


    ![](img/147f057d2f063d8c60ee616870537a94_59_1.png)


    Fig. 3.20 KFM displaying the contents of an archive file


    files in the same way. It is often possible to view graphic files by clicking
    on them and KFM will display them in a window. Tar files are not so easy. KWM
    (KDE''s file manager) has a built-in view that makes it easy to look at the contents
    of tar files. You can use the "View" menu to display the contents of a tar file.
    Or you can use KMD (KDE''s built-in tar file viewer) which is similar to KWM in
    that it can display the contents of a tar file. Or you can just use "tar" or "tar.gz"
    commands in a terminal window to see the contents of a tar file.


    # Floppy copy


    Like the Linux command line, KDE does not have a built-in copy facility for floppies.
    It is not reasonably easy to make an exact clone of a floppy disc, but using KFM
    it is possible to make an exact clone of a floppy disc in 3 steps. The obvious
    method is to insert a blank floppy disc in the drive and left-click on the icon,
    and then place the original disc in the drive and left-click on that icon. This
    will then copy the data from the blank disc to the disc in the drive. (The reverse
    is also true: you can copy the data from the original disc to the blank disc.)
    With a change to the blank disc and a press of the copy button in the KFM main
    window, you can copy the contents of the original disc to the blank disc.'
