    the aid of the Insert and Delete keys, and then pressing the Return key plus the
    Insert and Delete keys and then pressing the Return key.


    Enter key. Similar facilities are available at the Linux command line, but pressing
    F3 will not bring up the last command. Instead, press the up cursor key to resure
    the last command. The left and right cursor keys move the cursor to the command
