    Linux 是一个强大的 32 位操作系统，那么你需要一台强大的 PC 才能正确运行它吗？这是一个“绳子有多长”类型的问题，硬件需求取决于你想使用的应用程序。它还取决于你是需要“基本”的最小安装，还是“功能齐全”的版本。运行
    Linux 所需的绝对最低要求是配备 80386 微处理器的 PC，约 8 MB 内存，约 54 MB 硬盘空间，鼠标，支持的显卡，以及 CD-ROM 驱动器。虽然像这样基本的计算机也能运行
    PC 版 Linux，但建议这只是运行 Linux 所需的全部要求则具有误导性。


    ### 硬盘


    基本的 Linux 操作系统使用命令行解释器，你在那里输入命令，很像使用 MS-DOS。要充分利用此操作系统，你真的需要安装 X Windows，这将大致使所需的磁盘空间翻倍。它还建议你保留一些磁盘空间用作交换文件。这是操作系统将用于临时文件存储的空间，最多可使用
    100 MB。交换空间通常至少等于计算机安装的内存量。最后，也是同样重要的，你需要一些磁盘空间用于应用程序和实用软件。即使是极简的 Linux 发行版，单张
    CD-ROM 也包含许多兆字节有用的实用程序和完整的部分应用程序，许多 Linux 安装最初大约占用 350 到 450 MB 的空间。加上数据文件的存储空间。别忘了你还需要一些空间用作交换文件。作为参考，你也需要大约
    340 MB 的驱动器进行相对完整且经过测试的安装。850 MB 或更多是更可取的。


    ### 处理器


    尽管 Linux 对处理器的要求通常比其他许多操作系统低，但指望将 Linux 安装在一台旧的 33 MHz 80386 基于 PC 上并期望它能像最新的
    Pentium 奇迹一样运行是不现实的。


    计算机。如果你打算使用 X Windows 和一些更强大的应用程序，你将至少需要一台快速的 80486 基于 PC，最好配备某种 Pentium 处理器，但对于大多数使用，软件可能需要
    100 MHz Pentium 处理器或相当的性能就足够了。


    ### 内存


    虽然 8 MB 内存应该足以让 Linux “启动并运行”，但显然拥有更多内存更好。你可能用 16 MB 也能过得相当好，但如果拥有 32 MB 或更多内存，一切运行起来可能都会更快更流畅。一些更高级的应用程序至少需要
    32 MB 内存。既然如今内存相当便宜，没有必要刻意节省。投资于内存升级是非常值得的。这为你需要多任务处理时留下了充足的“头部空间”。


    ### CD-ROM


    有可能从软盘安装一些较旧版本的 Linux，但现代发行版通过一张或多张 CD-ROM 提供，因此你需要某种 CD-ROM 驱动器。使用 CD 安装要快得多，旧的
    2x 驱动器就可以了。不过，带有普通 ATAPI（IDE）接口的 CD-ROM 驱动器应该不会有问题，但某些 SCSI 驱动器可能不受支持。计算机中的硬件越常见，其在
    Linux 上良好运行的可能性就越大。


    ### 指向设备


    基本上任何适合的鼠标，Linux 支持串行、总线型和 PS/2 鼠标。理论上需要三键鼠标，但双键鼠标可以模拟中键类型的功能。同时按下两个按钮相当于按下第三个按钮中的中间鼠标。如果你在让
    Linux 与鼠标通信方面遇到问题，可以购买一台不同的计算机。如今使用鼠标有一个缺点，所以这真的不算主要问题。如果你想使用图形板或其他奇异形式的指向设备，你可能会发现它们无法在
    Linux 上工作。


