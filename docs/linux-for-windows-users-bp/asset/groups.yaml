    ### R.A. Penfold 的其他计算机著作


    - BP450 如何扩展和升级您的 PC

    - BP467 如何连接 PC

    - BP479 如何组装您自己的 PC


    ## 前言


    虽然 Linux 曾经仅限于懂行的爱好者或专业计算机人士，但现在它已成为主流，或者与大公司操作系统竞争的真正替代品。毫无疑问，Linux 的一大吸引力在于它是免费的。你确实可以购买
    Linux 的 CD-ROM 和纸质手册，但也可以从互联网上免费下载。如今，大多数新用户通常会在购买计算机杂志附赠的“免费”CD-ROM 之外获取 Linux。除了操作系统之外，大多数
    Unix/Linux CD-ROM 通常还免费包含许多有用的实用程序和应用。


    不需要专门为一台 PC 安装 Linux，只要硬盘空间足够，它就可以通过双启动系统与另一个操作系统共存。由于大多数 Linux 软件在远低于最新高性能 PC
    的配置上也能运行良好，因此 Linux 可以让一台老旧且闲置的 PC 重获新生。Linux 通常与大型网络相关联，但它完全可以作为工作站的操作系统正常运行。它在家用领域的使用正在增加，但本出版物仅涵盖其在工作站上的使用。


    表面上看，Linux 与图形用户界面并没有太大区别。它提供了类似于 MS-DOS 的命令行界面以及图形用户界面（GUI）。不过，两者之间有一些重大差异，即使是经验丰富的
    Windows 用户在学习 Linux 时也可能遇到困难。如果你不了解相关知识，甚至进入 Linux 系统本身都可能很困难。许多 Linux 出版物在介绍操作系统的历史、对大多数用户初期无关紧要的技术以及晦涩难懂的命令上耗费了大量篇幅，而这些内容对大多数用户来说用处不大。本书采取“直奔主题”的方法，专注于
    Linux 的日常计算。你不需要成为专家就能使用 Linux 系统，而且大多数 Windows 用户对该主题的理解也仅限于基础层面。对 Linux 也是如此，使用该系统并不需要深入的理解。理解基本概念更为有帮助，可以在必要时再学习相关技术。


