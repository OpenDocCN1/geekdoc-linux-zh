    实际上没有将驱动器作为系统的逻辑挂载部分，因为其实并不需要包含任何文件。用于挂载驱动器的命令很容易记住；既然叫挂载，直到你输入命令前它都是未挂载状态。在使用驱动器之前，必须将其挂载，并且光盘驱动器实际上不一定要包含任何文件。用于挂载光盘的命令必须在
