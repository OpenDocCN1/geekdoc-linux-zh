    \ MS/DOS zip 文件\n在命令行中使用 `unzip filename` 命令。\n\n## 阅读压缩的文本文件\n在 KFM 中左击包含该文本文件的文件。然后在打开的**压缩管理器**窗口中，左击该文本文件的条目。文件内容将在一个\
    \ Kedit 窗口中显示。\n\n## 检查可用内存\n在命令行中使用 `free` 命令。或者，在“K”菜单中选择**设置**、**信息**和**内存**。\n\
    \n## 检查可用磁盘空间\n在命令行中使用 `df` 命令。\n\n## 打印文件\n如果文件格式适合打印机，可以通过在“K”菜单中选择**实用工具**和**打印队列**进行打印。然后从\
    \ KFM 将文件拖拽到主打印队列窗口。\n\n## 打印文件（命令行）\n通过将文件复制到打印机的挂载点来打印文件（例如：`/cp: Allie /dev/p/7`）。文件格式必须适合打印机。\n\
    \n## 打印 PostScript 文件\n可以使用 Ghostscript 程序将 PostScript 文件打印到许多非 PostScript 打印机上，如下面的示例所示，用于打印“Allie”：\n\
    \n```\ngs -sDEVICE=epson -sOutputFile=/dev/lp0 Allie.ps\n```\n\n若要“打印”到文件，命令形式如下：\n\
    \n```\ngs -sDEVICE=epson -sOutputFile=PrintFileName Allie.ps\n```\n\n## 监控 CPU\
    \ 和内存使用\n在“K”菜单中选择**系统**和**任务管理器**，然后操作**性能**选项卡。\n\n## 终止有问题的程序\n在“K”菜单中选择**系统**和**任务管理器**。在任务列表中高亮显示有问题的程序，然后左击**结束任务**按钮。不应将此方法作为终止程序的常规方式。仅当程序无法控制时才使用此方法。\n\
    \n## 附录 1：有用的网络地址\n- 英国和欧洲 Linux 主要站点\n  https://www.linux.org.uk\n- Linux 组织站点\n\
    \  https://www.linux.org\n- Linux International 站点\n  https://www.calderasystems.com\n\
    - Caldera Systems 站点\n  http://www.redhat.com\n- Red Hat 站点\n  http://www.suse.de\n\
    - SUSE 站点\n  http://www.cdrom.com\n- Slackware 站点\n  http://www.debian.org\n-\
    \ Debian 站点\n  http://www.eit.de\n- Easy Linux 站点\n  http://www.download.com\n\
    - 包含 Linux 部分的通用 PC 下载站点\n\n正如人们预期的那样，作为一个起源于互联网的操作系统，有无数其他站点可以轻松通过正常的搜索引擎找到。上述站点也提供了大量与\
    \ Linux 相关的链接。\n\n## 附录 2：需要记住的命令\n\n| 命令 | 描述 |\n| :--- | :--- |\n| cal | 打印当前月份的日历\
    \ |\n| cd | 更改目录 |\n| cp | 复制文件 |\n| date | 打印当前日期和时间 |\n| dir | 列出文件和文件夹 |\n\
    | df | 显示磁盘剩余空间 |\n| du | 显示磁盘使用情况信息 |\n| free | 显示内存信息 |\n| ls | 列出文件和文件夹 |\n\
    | ls -color | 使用不同颜色列出不同类型的文件 |\n| ls -a | 列出所有文件（包括隐藏文件） |\n| ls -s | 列出文件及其大小\
    \ |\n| ls -t | 按时间顺序列出文件（最新的在前） |\n| mkdir | 创建目录 |\n| mount | 挂载设备（如磁盘驱动器） |\n\
    | mv | 移动文件或文件夹 |\n| mv | 移动目录 |\n| passwd | 设置或更改密码 |\n| pwd | 打印当前目录的名称 |\n\
    | rm | 删除文件 |\n| rm -R | 删除文件夹及其内容 |\n| rmdir | 删除目录 |\n| umount | 卸载设备（如磁盘驱动器）\
    \ |\n\n## 附录 3：Ghostscript 打印机支持\n使用 ghostscript 可以支持广泛范围的打印机，它可以将许多 Linux 程序的\
    \ PostScript 输出转换为适合这些非 PostScript 打印机的格式。ghostscript 程序应该可以适用于这些流行打印机以及许多其他打印机。有关支持设备的随盘文档，ghostscript\
    \ 应提供有关支持设备的最新信息。注意，某些标准图形格式也得到支持。\n\n- Canon BubleJet B410e, LBJ201, BUC600 和\
    \ BJC800\n- Canon LBP811\n- Epson 9 针点阵系列\n- Epson 24 针点阵系列\n- HP DeskJet, DeskJet\
    \ Plus 和 DeskJet 500\n- HP DeskJet 500C 系列\n- HP DeskJet 1200\n- HP LaserJet,\
    \ LaserJet II Plus, LaserJet II, LaserJet III, LaserJet 4 等\n- HP PaintJet, PaintJet\
    \ XL\n- IBM Jetprinter\n- IBM Proprinter\n\n任何与上述任一打印机完全兼容或具有适当仿真模式的打印机也应该可以使用。任何具有\
    \ DOS 打印模式的 HP DeskJet、LaserJet 或兼容打印机都应能与 ghostscript 协同工作。\n\n## 附录 4：*bash*\
    \ 中的历史记录\n要在 *bash* 中调出最后使用的命令，按**向上光标键**。然后可以使用**左**和**右**光标键加上**Delete** 和 **Backspace**\
    \ 键编辑命令。按 **Return** 执行修改后的命令字符串。还有一个类似 Windows 历史记录面板的命令行等效功能。使用此命令生成命令历史记录：\n\
    \n`fc -l`\n\n您可以使用标志来仅列出历史记录中的特定命令，如下例所示：\n\n- `fc -l 6`：列出最后六个命令\n- `fc -l 98\
    \ 107`：列出第 99 到 107 个命令\n\n这些关键字代码可用于执行以前的命令：\n\n| 代码 | 效果 |\n| :--- | :--- |\n\
    | `!` | 开始替换 |\n| `!!` | 重复上一个命令 |\n| `!N` | 重复编号为 N 的命令 |\n| `!-N` | 重复 N 个命令之前的命令\
    \ |\n| `!:String` | 重复以 *String* 开头的最近命令 |\n| `!:String` | 重复命令 N 并附加 *String*\
    \ |\n| `!?String?` | 重复包含 *String* 的最近命令 |\n\n## 附录 5：KDE 路线地图\n这些是通过“*K* 菜单”访问各种\
    \ KDE 应用程序和实用工具的路径。\n\n- **系统**\n  - KFM -（超级用户模式）\n    - 系统 - 文件管理器（超级用户模式） -\
    \ 然后输入密码\n  - 任务管理器\n    - 系统 - 任务管理器\n  - 桌面分页器\n    - 系统 - 桌面分页器\n  - XMan（X\
    \ Windows 在线手册）\n    - 系统 - XMan - 手册页\n- **设置**\n  - 壁纸设置\n    - 设置 - 桌面 - 背景\n\
    \  - 桌面颜色设置\n    - 设置 - 桌面 - 颜色\n  - 屏幕保护程序设置\n    - 设置 - 桌面 - 屏幕保护程序\n  - 活动桌面边框\n\
    \    - 设置 - 桌面 - 边框\n  - 桌面字体（包括大小调整）\n    - 设置 - 桌面 - 字体\n  - 鼠标设置\n    - 设置\
    \ - 输入设备 - 鼠标\n  - 键盘设置\n    - 设置 - 输入设备 - 键盘\n  - 内存信息\n    - 设置 - 信息 - 内存\n\
    \  - 处理器信息\n    - 设置 - 信息 - 处理器\n  - 磁盘分区信息\n    - 设置 - 信息 - 分区\n  - 面板设置\n  \
    \  - 设置 - 应用程序 - 面板\n  - KFM 设置\n    - 设置 - 应用程序 - 文件管理器\n\n## 程序和杂项\n- 向面板添加程序\n\
    \  - 面板 - 添加应用程序 - 从菜单结构中选择程序\n- 文本编辑器\n  - 应用程序 - 文本编辑器\n- 高级文本编辑器\n  - 应用程序\
    \ - 高级文本编辑器\n- 组织器\n  - 应用程序 - 组织器\n- 屏幕截图\n  - 图形 - 屏幕截图\n- 图标编辑器\n  - 图形 - 图标编辑器\n\
    - Kfloppy\n  - 实用工具 - Kfloppy\n- 压缩管理器\n  - 实用工具 - 压缩管理器\n- Kpackage\n  - 实用工具\
    \ - Kpackage\n- 终端（控制台）\n  - 实用工具 - Konsole 或 实用工具 - 终端\n- 打印队列\n  - 实用工具 - 打印队列\n\
    - CD 播放器\n  - 多媒体 - CD 播放器\n- 媒体播放器\n  - 多媒体 - 媒体播放器\n\n## 索引\n- / 目录\n- 访问\n\
    - 账户\n- 活动桌面，边框\n- 添加应用程序\n- 添加到书签\n- 添加/删除桌面\n- 添加组\n- 添加桌面\n- 添加用户\n- adduser\n\
