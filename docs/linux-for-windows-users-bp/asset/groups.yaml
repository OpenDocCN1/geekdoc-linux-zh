    大小。要更改虚拟桌面的数量，请左键单击“桌面”（Desktops）选项卡，调出图 4.18 中显示的控制面板。两个滑块控件上方的那个（标记为“可见”，Visible）可用于更改虚拟桌面的数量。将桌面数字向右拖动以增加桌面数量，或向左拖动以减少数量。只允许偶数桌面，因此可以选择二、四、六或八。此面板还允许使用编辑框重命名每个桌面。您可以给虚拟桌面起适当的名称，例如“电子表格”（Spreadsheet）和“图形”（Graphics），而不是默认的“One”、“Two”等。标记为“宽度”（Width）的下层滑块控件，以及桌面控制面板上的选择按钮。这必须设置得足够宽


