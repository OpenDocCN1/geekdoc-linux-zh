    ## 添加桌面


    默认情况下有四个虚拟桌面，但根据您使用计算机的方式，您可能需要更多或更少。KDE 允许您拥有多达八个虚拟桌面，并且更改数量非常容易。激活“K”菜单，然后选择面板（Panel）和配置（Configure）。这会调出图
    4.17 中显示的控制面板，其中包含对面板的大量控制。四个控制面板中的第一个控制面板位置及其


