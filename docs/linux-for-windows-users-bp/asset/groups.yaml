    CD-ROM 上的文件），则无法执行此操作。左键单击“权限”选项卡会调出另一个界面，提供更深入的详细信息，包括文件的读写状态、所有者以及组信息。


    ![](img/147f057d2f063d8c60ee616870537a94_53_1.png)


    ### 导航


    在主窗口区域上方有一个编辑框，这里显示当前路径。你可以在这里输入路径以直接前往特定目录。只需输入路径，然后按 *Return*（回车）键即可。输入目录名称或程序名称，然后按
    *Return* 键即可打开文件或程序。


    编辑框上方是导航工具栏。它提供了一种在文件系统中快速、轻松移动的方式。分别指向上、左、右的三个箭头，分别用于向上一级、后退一步和前进一步。显然，在未从原始目录后退之前，无法向前移动一步；在未移动之前，也无法后退一步。此外，当系统处于根目录
    (/) 时，无法在目录树中继续向上移动。无法操作的箭头按钮看起来是凹陷进工具栏的，而可使用的按钮看起来则略微突出于工具栏。此工具栏中的下一个按钮有一个类似房屋的图标，该按钮将
    KFM 直接移动到主目录。


    ### 文本编辑器


    如果文件是文本类型，可以使用此选项将其加载到文本编辑器程序中。


