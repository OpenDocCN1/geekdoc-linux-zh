    ## Mounting


    Initially, the CD-ROM and floppy drives will not be mounted, and this is an area
    where MS-DOS and floppy work in a much more free and easy manner than Linux. With
    Windows, and MS-DOS, you can mount or unmount discs as and when you please. The
    system may occasionally complain with an error message when it fails to find the
