    ## 密码


    在安装过程中，你将被要求提供至少一个密码。最少需要为用户 `superuser`（或 root 账户）设置密码。设置第二个密码通常是个好主意。通常建议设置两个密码。第二个密码通常被设置为
    root 账户的密码，你可以在系统设置更改时使用。你也可能被要求为第二个密码设置一个密码。这通常被称为管理员密码。


    重要的是要记住，设置的密码不是以明文形式存储的，而是经过哈希处理的。这意味着密码不是直接存储的，而是密码的哈希值被存储。这是一个单向过程，意味着无法从哈希值中恢复密码。这对安全性是好事，但也意味着如果你忘记了密码，你将不得不重新安装系统以找回密码。因此，记下你的密码并将其存放在安全的地方是个好主意。


    你也会被要求设置至少一个用户账户。即使你只使用一个用户，许多人也喜欢以标准用户而不是 root 用户登录。这样做可以避免许多意外对系统做出 unwanted
    更改的风险，特别是如果你对 Unix 文件系统不太熟悉的时候。


    如果你主要限于运行系统，root 密码可以在稍后按需设置。如果需要，用户账户也可以稍后创建。用户可以使用 adduser 命令创建用户账户。如果被要求输入组
    ID，请输入与用户 ID 相同的值。如果被要求输入组名，请输入与用户名相同的值。如果被要求输入组 GID，请输入与用户 ID 相同的值。安装过程在处理这些设置时相当灵活，并接受大多数合理的输入。


    在安装过程中，你还会被要求输入 root 账户的密码。你也可能被要求输入你正在创建的用户账户的密码。如果你不打算设置用户账户，只需在密码提示处按回车键即可。


    请注意，当你输入密码时，屏幕上不会显示密码。这是正常的，并不表示你没有输入密码。


    通常建议为每个账户使用不同的密码，并定期更改密码。使用强密码也是一个好主意，强密码应包含大写字母、小写字母、数字和符号的混合。


    你的密码越复杂，其他人越难猜测，但你记住它的难度也越大。


