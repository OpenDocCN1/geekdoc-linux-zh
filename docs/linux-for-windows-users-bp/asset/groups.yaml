    配置文件包含关于你使用的鼠标类型的大量配置信息；探测仅用于此。你还需要知道视频卡上的内存数量或其他相关信息。初始的 XFree86 设置程序通常使用 XF86Setup
    程序实现。


    手动配置通常使用 XF86Setup 程序实现。它会询问你希望现在还是稍后运行此程序。我建议选择“稍后”，因为“现在”选项实际上意味着它将推迟到稍后执行！当配置程序最终运行时，它会提供一个初始帮助屏幕（图
    1.5），有助于在程序中导航。在运行 XF86Setup 程序之前，通常会请求关于正在使用的鼠标类型的信息，导航非常容易，因此从一开始就能正常工作。然后它运行一个包含鼠标配置选项的菜单。图
    1.5 中的页面用于控制此过程，直到鼠标正常工作。假设你确切知道使用的是哪种类型的鼠标，让它正常工作应该没有问题。


