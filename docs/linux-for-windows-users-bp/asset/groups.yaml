    许多内部调制解调器和廉价打印机属于这一类别。这类设备的问题在于它们缺乏完整设备中通常应包含的大部分电子元件。缺失的个人电脑硬盘驱动器以及许多应用程序中产生的大量“过度设计”可以以相对较低的成本实现。这种方法的主要缺点是，相对于正常软件，使用此类外设的驱动程序明显更为复杂。虽然可能可以使用任何其他操作系统（如
    Linux）下的 Windows 设备，但由于驱动程序软件的复杂性，可能永远无法生成合适的驱动程序。


    ## 显卡


    某些显卡也存在同样的问题。在新视频卡发布和为视频卡出现驱动程序之间往往存在滞后。这具有双重影响。首先，新显卡可能会迟迟得不到支持。其次，拥有成熟驱动程序的旧显卡也迟迟得不到支持。因此，尽可能保持显卡更新很重要。换句话说，不要追求最新、最尖端的外围显卡，而应选择那些经过充分验证且具有稳固驱动基础的显卡。


    ## 显示器


    标准 VGA 显示器的最小分辨率应为 640 乘以 480 像素。但是，你应争取获得支持 800 乘以 600 像素，甚至 1024 乘以 768 像素的显示器。如果你有一个
    19 英寸的显示器，你可以获得 1280 乘以 1024 像素的分辨率。分辨率越高，屏幕上可以显示的文本和图形就越多。如果你经常处理电子表格，或者处理大型图像，这一点就很重要。高分辨率显示器可以让你看到更多细节，并使阅读小字变得更轻松。


    在实践中，我发现这类情况有点尴尬，只要可能，我都更愿意将屏幕设置为 800 乘以 600 或 1024 乘以 768 像素的更高分辨率。即使这导致菜单文本等相对较小，或者文本较小，我仍然建议使用显示器在这些较高的分辨率下工作。


    归根结底，判断你的个人电脑硬件是否兼容 Linux 的唯一方法是“试一试”的方法。如果没有具体的支持该视频设备的措施，使用该设备的驱动程序将产生令人满意的结果。对于显卡，值得研究说明书以确定其使用的芯片组。或者，查看显卡本身的芯片。使用与你的显卡外观相同、使用相同芯片组的显示板的驱动程序通常能产生令人满意的结果。


    除非你打算使用一些特别苛刻的软件，否则没有必要拥有最新高科技的个人电脑。许多用户升级到新电脑后，希望将旧电脑物尽其用，特别是当它并不老且仍有很大的使用寿命时。一台无法良好运行大多数其他操作系统的个人电脑，在
    Linux 下可能能产生完美的结果。这可能是一个主要因素，促使 Linux 的普及度突然增加。如果你发现你的旧电脑可以作为 Linux 工作站获得第二次生命，你不应失望，而应感到欣慰。如果它可以作为典型的
    Linux 工作站运行，它可能太强大而无法用作交互式控制台。如果你想进行严肃的批处理或远程登录，拥有一个专用的控制台是件好事。即使这样一个专用控制台的唯一用途是测试
    Linux 是否在你的系统上正常工作而不必启动旧硬件，它仍然是一个有用的工具。甚至有可能，如果旧硬件相当强大，它可以用作专用的 Linux 工作站，从而让旧硬件获得第二次生命。


