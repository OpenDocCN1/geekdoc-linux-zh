    Windows 系统，以及在硬磁盘上创建的 Windows 系统备份副本。同样重要的是，确保 Linux 系统不会覆盖硬磁盘上的引导扇区或任何关键的 Windows
    数据。


    有几点需要牢记。首先，你需要确保分区软件设置正确，以便引导加载程序（如 LILO 或 GRUB）安装在正确的分区上。如果你使用 LILO，确保它安装在硬磁盘的第一个分区上。如果你使用
    GRUB，确保它安装在硬磁盘的 MBR（主引导记录）上。这对于双启动系统正确运行至关重要。


