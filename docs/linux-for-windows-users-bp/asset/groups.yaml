    ## 安装


    RPM 可以通过图形前端使用，您可能更喜欢这样使用，但从命令行使用它也不困难。请注意，您可能需要以“root”身份登录才能使用 RPM，因为使用它显然涉及对系统的更改。使用
    RPM 安装包时，请使用以下命令：


    ```

    rpm -i package-name

    ```


    如果一切正常，RPM 将安装软件及其声明包含在包中的任何支持文件。如果 RPM 检测到任何异常，它会给出解释问题的错误消息。最可能的情况是，您尝试安装的包依赖于计算机上存在的另一个包，但缺少此依赖关系。如果没有这个其他包，新包将毫无用处，必须先获取并安装它。然后
    RPM 应该能够毫无问题地安装新包。实际上，可以使用 `--nodeps` 选项强制 RPM 无论如何都安装软件，但这样做毫无意义。已安装的软件将无法正常运行，并可能导致计算机挂起。


    如果 RPM 声明不覆盖属于其他包的文件就无法安装包，您可以使用 `--replacepkgs` 选项强制其执行此操作，但您必须了解其中的风险。覆盖其他文件有点风险：


    ```

    rpm -i --replacepkgs package-name

    ```


    在典型的 Linux 安装过程中，许多软件会被加载到硬盘上，因此，在您花时间查找某个程序后，您偶尔可能会发现 RPM 告知您该软件已在系统上。如果您选择了较大的
    Linux 安装，通过菜单和文件系统检查以确定确切安装了什么内容是值得的。这可以节省大量后续浪费的时间和精力。


    ![](img/147f057d2f063d8c60ee616870537a94_42_0.png)


    ## 升级


    升级命令与从头安装软件的命令类似，但使用升级（`-U`）选项代替安装（`-i`）选项。这是 RPM 命令的升级版本。


    ```

    rpm -U package-name

    ```


    RMP 可用于卸载程序，只需在命令中使用擦除（`-e`）选项即可：


    ```

    rpm -e package-name

    ```


    这里，命令中使用的文件名是程序文件的名称，而不是安装时使用的文件的名称（除了基本名称外还会有许多字符）。


    ## 附加功能


    Linux 命令行有一些有用的小型附加功能，其中之一是 `cal`（日历）命令。在其最基本的形式中，您只需输入此命令：


    ```

    cal

    ```


    默认情况下，此命令会生成当前月份的日历。如果您需要当前月份以外的日历，可以指定月份和年份。此命令将打印 2002 年 6 月的日历：


    ```

    cal 6 2002

    ```


    重要的是要给出完整的年份，而不仅仅是最后两位数字（例如，“99”代表“1999”）。如果这样做，您将获得 99 年的日历，而这只是一段特殊年份的事情（图 2.3）。此命令将为
    2001 年生成日历：


    ```

    cal 2001

    ```


    > 图 2.3 `cal` 命令还可以生成一年的日历


    ### 查找文件


    Linux 有多个文件查找实用程序，其中一些比其他更容易使用。`locate` 命令相对快速且易于使用。速度快是因为该程序在硬盘上保持一个文件数据库，因此当它搜索文件时，无需查看硬盘本身。为了让此命令正常工作，显然需要一个数据库作为基础。数据库会自动生成并在大约早上
    6:00 更新。您必须意识到，如果从该时间到下次更新之间您的 PC 在运行，它将或多或少无法工作。但在白天，可以使用以下命令手动生成或更新数据库：


    `/usr/bin/updatedb`


    完成此任务大约需要一分钟，但完成后，您应该能够相当快速地按名称定位文件。您必须以 `root` 身份登录。


    虽然不太可能，但在某些情况下，可能无法定位用户想要的文件，例如，如果用户想要定位的文件之前已经存在。


    要定位文件，您可以简单地发出 `locate` 命令并包含文件名，如下例所示：


