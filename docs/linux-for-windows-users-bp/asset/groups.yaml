    ## 添加用户


    Linux 当然是一个多用户系统，可以让大量用户共享同一台计算机。第 4 章将更详细地介绍这一主题，这里我们只涵盖安装过程中添加用户的内容。在安装过程中必须至少创建一个用户帐户，这就是超级用户的
    "root" 帐户。"root" 帐户拥有对系统的完全访问权限，并可以对系统进行剧烈更改。因此，登录 "root" 时必须格外小心，否则系统可能会意外损坏。常规的处理方式是，当需要对系统进行修改时以
    "root" 身份登录，而在其他时间以普通用户身份登录，即使你是唯一使用该计算机的人。


    在安装过程中可能有添加用户的机会，如果有这种情况，我建议在阶段添加至少一个用户（即你自己）。事实上，如果需要，稍后再添加更多帐户也是一个好主意。如果需要从命令行添加更多用户，可以使用命令行中的
    `adduser` 命令。这在大多数典型安装中都是必要的，但如果你安装了某种非典型发行版，安装程序可能会包含它。请注意，`adduser` 命令仅在你以 "root"
    身份登录时可用。要添加名为 "Fred" 的用户，请使用此命令：


    ```bash

    adduser Fred

    ```


    Looking for first available UID... 501

    Looking for first available GID... 500

    Adding login: Fred... done.

    Creating home directory: /home/Fred... done.

    Creating mailbox: /var/spool/mail/Fred... done.

    Don''t forget to set the password.


    此输出告诉你 Linux 已找到下一个可用的用户标识（UID）和组标识（GID）编号，并使用了它们，并且它已将名称 Fred 添加到登录过程中。它还创建了新用户所需的目录。最后一行提醒你，必须设置新用户的密码；否则，该帐户将无法使用。要为
    ''Fred'' 帐户设置或更改密码，我们只需在 shell 中运行 `passwd`。由于我们要将 ''Fred'' 帐户的密码设置为 ''hello''，将使用以下命令：


    ```bash

    passwd Fred

    ```


    请注意，必须登录为 ''root'' 才能正常工作。系统将要求输入新密码，输入一次后，会被要求再次输入以确保第一次输入时没有错误。照例，密码不会显示在屏幕上，因此旁人很难看到你在输入什么。要将密码设置为
    ''hello''，因此你需要两次输入 ''hello''：


    ```bash

    hello

    hello

    ```


    设置完 ''Fred'' 帐户的密码后，应该就可以使用密码 ''hello'' 以 ''Fred'' 身份登录了。要更改密码，只需登录为适当的用户，然后发出此命令：


    ```bash

    passwd

    ```


    当系统提示时，你必须提供旧密码，然后两次输入新密码。新密码随即生效，每次需要以该用户身份进行身份验证时都必须使用它。假设用户 ''fred'' 的密码被设置为
    ''too-simple''；系统可能会拒绝简单的密码或缺乏复杂性的密码。在这种情况下，''passwd'' 命令将提示你重试，并不断尝试，直到接受某个密码选择。


    ## Tar


    使用 Linux 时，你很快就会遇到 *tar* 文件。这些是磁带存档文件，*tar* 命令主要旨在作为一种简单的备份机制。*tar* 命令的基本操作是获取一组文件并将它们合并为一个长文件。可以使用相同的程序还原原始文件。该命令的现有版本还可以压缩文件，使其占用更少的存储空间。该命令大致相当于
    MSDOS 或 Windows ZIP 压缩程序的 Linux 等价物。


    现代计算机存储倾向于以千兆字节而非兆字节为单位进行计算，除非你的计算机配备了某种能够以与硬盘读写相同速度读写数据的mass storage 设备，否则压缩备份并非不切实际。除非你有
    Iomega Zip、Iomega Jaz 或类似类型的设备，否则你无法在 5 分钟内备份 750 兆字节的数据。然而，使用 CD-R 或 CD-RW，你可以在大约
    15 分钟内备份 750 兆字节。如果你想备份文件，可以使用至少 1GB 存储容量的 USB 设备。这将允许你在几分钟内备份文件。


    即使你不经常使用 tar 文件，*tar* 肯定也要处理 tar 文件的使用。程序通常以 *tar* 文件形式分发。*tar* 文件大于 1.5GB 时可能会出现很大问题。原因是传统的
    tar 文件限制为 1.5GB。如果你想备份大于 1.5GB 的文件，可以使用 `-G` 选项（或根据版本不同的类似拆分选项）来创建多卷 tar 存档。这将允许你备份大于
    1.5GB 的文件。


    *tar* 程序使用起来相对简单，但由于可用选项众多，事情略显复杂。有关可用选项的完整详细信息，请参考在线手册。以下是一些常见的 *tar* 选项。


    '
