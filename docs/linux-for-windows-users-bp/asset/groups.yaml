    ## 可用磁盘空间


    关于可用磁盘空间的信息是大多数用户需要密切关注的，这些信息可以通过自由命令行解释器获取。如果你只需要知道硬盘上还有多少可用空间，请使用 `df`（磁盘空闲）命令。该命令可以不带任何选项标志使用，如以下示例所示：


    ```bash

    df

    ```


    `df` 命令会返回四个数值，分别代表以千字节为单位的磁盘总容量、已使用的千字节数、空闲的千字节数，以及实际使用的磁盘百分比。因此，第四个数值是最关键的，它告诉你有多少磁盘空间是空闲的。一旦知道了这个数值，你就可以得到文件的近似大小。如果磁盘空间是空闲的，你会得到一个可用空间数量的准确估计。


    这种情况发生的概率大约等同于中彩票，但你可以通过 `df` 命令和 `-i`（inode）选项来检查当前状态，如下所示：


    ```bash

    df -i

    ```


    这与之前一样给出四个数值，但这次分别是可用 inode 总数、已使用的 inode 数量、空闲的 inode 数量，以及已使用的可用 inode 百分比。在我的
    PC 上，磁盘已使用 54%，但可用的 inode 中只使用了 12%，所以我通常不担心磁盘容量，因此它运行起来无忧。


    `du`（磁盘使用）命令是另一个有用的命令行磁盘工具。它显示每个目录（或多个目录）包含的磁盘空间量（以千字节为单位）。如果在子目录下方还有目录，它也会列出它们。`du`
    命令的基本用法提供当前目录的列表，但你可以在命令末尾轻松指定目录。例如：


    ```bash

    du /home/fred

    ```


    这会生成 `/home/fred` 及其子目录的列表。


    如果要获取文件大小，只需指定文件而不是目录即可。本示例将给出当前目录中名为“testfile”的文件的大小：


    ```bash

    du testfile

    ```


    请注意，可以通过在 KDE 内部定位文件来确定文件大小：使用 KFM 定位文件，右键点击其图标，然后从弹出菜单中选择“属性”。文件大小将包含在信息的第一屏中。或者，只需将指针悬停在文件图标上，KFM
    窗口底部的状态栏会显示其大小。不幸的是，这两种方法对目录都不起作用。属性窗口只会显示“是一个目录”而不是大小，状态栏则只会显示“文件夹”。


    `du` 命令可以使用各种选项标志，且这些命令选项标志会列出一个列表：


    ```bash

    du --help

    ```


    如果你只需要当前目录的详细信息，并且不感兴趣其下多层级的子目录，那么“-max-depth=N”选项非常有用。该命令将列出当前目录以及其直接下属子目录的大小：


    ```bash

    du --max-depth=1

    ```


    ![](img/147f057d2f063d8c60ee616870537a94_81_0.png)


    *图 4.34 从磁盘使用程序获取的目录信息*


    ### 也需要知道


    如果你只需要知道当前目录的大小，请使用此命令：


    ```bash

    du -m -max-depth=0

    ```


    对于大型目录，使用“-m”选项很有帮助，这样大型目录的大小将以最接近的兆字节为单位给出。该命令将以兆字节为单位给出当前目录的大小：


    ```bash

    du -m -max-depth=0

    ```


