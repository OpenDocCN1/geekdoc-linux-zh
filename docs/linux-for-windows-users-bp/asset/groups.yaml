    的打印机。这真的取决于遇到的每个应用程序。


    应用程序可能会在打印机处理方面完全走自己的路，但无论如何，建议在 Linux 中安装打印机属性。这通常包含在安装过程中，但稍后可以添加或更改打印机配置。有不同的安装、配置和管理程序用于
