    ## Preface


    Although once strictly for the knowledgeable enthusiast or computing professional,
    Linux now offers a real alternative to the mainstream, and/or operating systems
    from the major corporations. Unquestionably a big attraction of several operating
    systems is that it is free. You can actually buy Linux from CD-ROMs plus printed
    manuals, but it can also be downloaded free from the Internet. Probably most new
    users now obtain Linux in addition to a "free" CD-ROM given away with a user computer
    magazine. In addition to the operating system, there are usually many useful utilities
    and applications included free of charge on most Unix/Linux CD-ROMs.


    It is not necessary to have a PC especially for Linux, and provided there is sufficient
    hard disk space it can coexist with another operating system using a dual-boot
    system. As most Linux software will run quite happily on something considerably
    less than the latest wonder PC, Linux can be used to give an old and otherwise
    unused PC a new lease of life. Linux tends to be associated with large networks,
    but it will function perfectly well as the operating system for a workstation.
    It is increasing in use at home, in this publication only its use with workstations
    is covered.


    On the face of it, Linux is not all that different to a graphical user interface.
    It provides a command line interface similar to MS-DOS and a graphical user interface
    (GUI). There are some major differences though, and even the most accomplished
    of Windows users can have problems getting to grips with Linux. Unless you know
    how, even getting into Linux in the first place can be difficult. Many Linux publications
    got bogged down in the history of the operating system, technologies that are
    not initially relevant to most users, and arcane commands that are of little use
    to most users. This book takes the "cut to the chase" approach, concentrating
    on everyday computing with Linux. You do not have to be an expert to use a Linux
    system, and few of the many Windows users have more than a rudimentary understanding
    of the subject. The same is true with Linux, and it is not necessary to have an
    in-depth understanding to use the system. It is more helpful to have an understanding
    of basic concepts, and learn about the technologies later, as and when it becomes
    necessary.


