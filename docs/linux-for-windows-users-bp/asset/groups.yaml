    ## 重命名


    在 MS/DOS 中，可以使用 `ren` 命令重命名文件，但 Linux 中没有完全对应的命令。不过，可以使用 `mv` 命令将文件的内容移动到一个不同名称但相同目录下的文件中。换句话说，即重命名文件。此命令将当前目录下名为“test”的文件重命名为“renamed”：


    ```

    mv ./test ./renamed

    ```


    当处理目录名称时，你需要非常小心地重命名目录。这样做可能会导致应用程序或 Linux 本身无法找到它们所需的文件。


    ## 读取文件


    可以使用 MS/DOS 读取文本文件，例如使用 `type` 命令读取“readme.txt”文件。Linux 中最接近的等效命令是 `cat`，它只会将文件打印到屏幕上。此命令显示
    `/usr/man/man1/groups.1` 目录下 `groups.1` 文件的内容。


    ```

    cat /usr/man/man1/groups.1

    ```


    `cat` 命令仅适用于短文件，或者当你只想查看文件末尾部分时。这是因为它不提供对文件显示方式的任何控制，并且在小显示器上，文本几乎瞬间就会滚动出屏幕。你根本没有机会每次退出
    `less` 阅读器时移动几个词。实际上，`less` 命令更适合大量文本，因为它一次显示一屏文本。只需按空格键进入下一屏，按 H（回车）键一次移动一行。如果不想退出
    `less` 阅读器，可以使用 control c。例如，你可以使用 control z 运行更多。可用的键控制如下：要一次移动一行，请按 q 键。这将显示下一行
    `less` 命令。


    然而，建议要上下滚动文本，使用方向键可能更容易。这些命令会将文件加载到一个“合适的”窗口文本编辑器访问器中。


    还有两个值得提及的进一步文本读取命令。`head` 命令显示前几行。默认情况下，显示十行，但可以使用 -x 控制进行修改。其中 x 是要显示的行数。因此，这两个命令将分别显示文本文件
    /root/readme 的前 20 行和后 15 行


