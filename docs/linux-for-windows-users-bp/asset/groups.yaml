    Microsoft 选项。如果有通用串行鼠标选项，这应该也能适用于几乎任何串行鼠标。许多计算机配有并非由主要鼠标制造商生产的串行鼠标。同样，Microsoft
    或通用串行鼠标选项应该能带来良好的结果。


