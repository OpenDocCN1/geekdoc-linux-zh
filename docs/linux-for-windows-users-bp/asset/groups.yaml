    ## 日期和时间


    `date` 命令允许读取日期和时间，并且允许“root”用户设置时间。要让计算机在屏幕上打印时间和日期，您只需发出简单的 `date` 命令：


    ```

    date

    ```


    然后它会响应类似以下内容：


    ```

    Sun Jul 18 22:54:23 BST 1999-07-18

    ```


    有许多可用的格式化选项，可用于以此格式打印时间。这些选项通过在命令末尾添加“+”和适当的格式化字符串来使用。此列表给出了一些格式化字符串及其功能。


    | 字符串 | 功能 |

    | :--- | :--- |

    | %A | 缩写星期名称 |

    | %A | 仅完整星期名称 |

    | %b | 缩写月份名称 |

    | %B | 完整月份名称 |

    | %D | 日期的 mm/dd/yy 格式 |

    | %H | 带前导零的 24 小时格式 |

    | %I | 带前导零的 12 小时格式 |

    | %M | 仅分钟 |

    | %j | 打印一年中的第几天（001 到 365） |

    | %p | 仅 AM/PM |

    | %r | 带 AM/PM 的 12 小时格式 |

    | %U | 仅星期 |

    | %Y | 仅年份 |


    此命令将打印年份：


    ```

    date +"%Y"

    ```


    此示例将打印月份的完整名称以及它是 AM 还是 PM：


    ```

    date +"%B %p"

    ```


    月份和 AM/PM 选项包含在引号中（它们之间没有空格，也没有第一个引号），并且可以在屏幕上使用两个字符的数据作为分隔符。可以使用任何所需的文本字符作为分隔符，在此命令版本中，月份和
    AM/PM 指示之间将放置逗号和空格。


    ```

