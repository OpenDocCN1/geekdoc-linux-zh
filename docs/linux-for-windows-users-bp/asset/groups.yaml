    # Autostart


    The “Autostart” icon provides access to a folder that contains programs or links
    to programs that must be run when KDE starts up. This is the equivalent of the
    autostart folder that exists in MS/DOS and the Startup folder in Windows 95/98.
    Each user that has their own “Autostart” folder can have their own set of programs
    that they want running when KDE starts. In fact each user effectively has his
    or her own KDE desktop which can be customized to suit individual requirements.


    # Templates


    The “Templates” folder is, as you might have guessed, for storing template files.
    Do not concern yourself with this one for the time being. Many programs can use
    templates to save time when producing standard letters, book layouts, or whatever.
    Should you start using templates they can be stored in this folder.


