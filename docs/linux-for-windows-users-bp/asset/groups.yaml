    当用于卸载软件时，屏幕左侧的树显示了各种软件类别和子类别。双击其中一个会展开它以显示内容。找到您想要移除的程序后，左键单击它会在主窗口区域显示程序详细信息。“卸载”按钮变为活动状态，左键单击它会导致程序被移除。在卸载程序开始之前，您会有一次改变主意的机会，因为意外或简单地卸载任何内容的风险很小。如果您应该意外地移除了需要的东西并想要改变主意，应该能够定位安装光盘上的
    RPM 文件，并使用 Kpackage 简单地通过 CD-ROM 重新安装它。


    ## Unzip


    KFM 可以处理压缩的 tar 文件，但它似乎不能很好地处理使用 Winzip 或 Pkunkzip 等程序压缩的 Mac/DOS 和 Windows 类型文件。这些文件通常具有“.zip”或“.arc”扩展名。如果您左键单击此类文件，将启动
    Archive 程序，然后显示压缩文件的内容（图 4.31）。可以通过单击列表中的相关文件来读取文本文件的内容，并且似乎可以提取某些文件。如果提取


