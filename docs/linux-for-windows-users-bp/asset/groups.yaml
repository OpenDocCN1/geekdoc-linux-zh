    如果程序不在“K”菜单中，请使用 KFM 定位到程序文件，然后左键单击其图标或文件名。


    ## 将程序图标放置到桌面


    使用 KFM 定位到程序文件，并将其拖放到桌面的空白区域。从弹出菜单中选择“Link”（链接）。之后，左键单击该图标即可运行程序。


    ## 切换虚拟桌面


    要切换到另一个桌面，只需左键单击面板上相应的桌面按钮（标记为一到四的按钮）。或者，按住 Control 键并持续按 Tab 键，循环切换直到到达您需要的桌面。


    ## 在所有桌面中显示窗口


    单击标题栏中的 Sticky（粘附）或 Pin（置顶）按钮。操作此按钮会使窗口仅在特定的那个桌面上可见。


    ## 启动 KFM


    单击面板中的房屋图标。这将在主目录中启动 KFM，但您可以从那里移动到所需的目录。


    ## 新建文件夹


    使用 KFM 打开父目录。右键单击主窗口中的空白区域，从弹出菜单中选择“New”（新建），然后选择“Folder”（文件夹）。在出现的编辑框中输入新文件夹的名称，然后左键单击“OK”（确定）。


    ## 隐藏面板


    左键单击面板一端的箭头。再次左键单击此箭头可恢复面板。


    ## 自动启动程序


    使用 KFM 定位到程序文件，然后将其拖放到 Autostart（自动启动）图标上。接着从弹出菜单中选择“Link”（链接）。


    ## 阻止程序自动启动


    要逆转此过程，左键单击 Autostart 图标。这将打开一个 KFM 副本，显示 Autostart 文件夹的内容。只需删除您在启动时不需要的程序的链接。


    ## 在所有桌面中显示窗口


    激活其 Sticky（粘附）图标。


    ## 将窗口从一个桌面移动到另一个桌面


    激活其 Sticky 图标，切换到所需的桌面，然后取消激活 Sticky 图标。


    请注意，某些菜单选项和特定按钮在并非所有情况下都可以操作。不适当的菜单选项会被灰显（显示为浅灰色而非黑色），无法选中。同样，非活动按钮看起来不会略微凸出于桌面，也无法操作。这与
    Windows 和大多数其他图形用户界面使用的方法是相同的。


    ## 4. 还需要知道的内容


    ### 多用户


    前面三章涵盖了在安装 Linux 到 PC 以及使用系统运行应用程序、复制文件等任务时所需了解的内容，这些任务可以通过命令行界面或 KDE 来完成。在本章中，我们将深入探讨一些为了有效使用
    Linux 系统而需要了解的主题。


    正如前几章所见，为了使用 Linux，有必要以用户名登录并提供相应的密码。这比即使在小巧、现代、快速的 PC 上启动过程所花费的时间要多得多：让计算机运行一个简单的程序可能需要登录和密码，然后可能还需要一次或多次鼠标点击或一系列按键操作才能让计算机执行任务。这种额外的时间和努力意味着，即使使用非常快的计算机，使用机器也需要合理的思考。前提是每个用户每次不需要花费太多时间。这种方法的缺点是对用户缺乏隐私保护。这不仅仅是其他用户能够访问可能属于某个人的私有信息的问题。如果对事物采取一种放任自流的态度，真的存在一个用户意外修改或删除属于其他用户数据的危险。事实上，系统可能会逐渐恶化成完全的混乱。


    在使用像 Linux 这样的多用户操作系统时，您使用用户名和密码登录，以便操作系统始终知道谁在使用计算机。说系统对每个用户看起来完全不同，就像每个人都有自己的
    PC 一样，这有点夸张。但是，在某种程度上，计算机会为当前用户进行个性化设置。与使用命令行界面相比，在运行 KDE 时，这些差异可能更加明显。即使在命令行工作，登录后的区别也是清晰的。命令行提示符前有一些文本，包括登录名称。此外，系统位于该用户特有的目录中。例如，如果您以“root”身份登录，系统通常位于
    /root；如果您以“Fred”身份登录，则位于 /home/Fred。除了“root”之外，每个用户都有一个 /personal 目录，它是 /home
    目录的子目录。


    如果您在此处运行 KDE，差异更加明显。在启动时自动运行的 KFM 程序是该用户适当的目录。您可以升级计算机，但差异在于您经常使用的软件。如果您为登录到 KDE
    放置了程序图标。不太明显的是，除非其他用户也添加它们，否则这些图标不会出现在任何其他用户的 KDE 桌面上。虽然默认情况下 KDE 桌面、模板和 Autostart
    文件夹为您添加，但其他用户无法使用您的回收站文件夹。回收站文件夹保存了您可以放入回收站文件夹中的任何内容的访问权限，其中“fname”是用户的登录名称：/home/fname/Desktop/Trash。显然，像每个用户的
    Autostart 文件夹以及该文件夹下的其他文件夹（例如“root”用户位于 /root/Desktop，顺便说一下，而不是 /home 目录）这样的文件夹也是如此。


    ### 权限


    问题不仅仅在于为每个用户拥有个人 KDE 桌面。这样做仍然允许用户访问每个其他用户的文件。在实验中，您可以尝试以“root”身份登录并在回收站中放置一两个虚拟文件。可以通过“K”菜单按钮访问图形和文本编辑程序，用于创建虚拟文件，例如包含一条线的绘图或单字文本文件。创建文件并将其加载到文件夹后，退出
    KDE 并以另一个用户身份重新登录。如果您尝试从 /root/Desktop/Trash 导航到 /root/Desktop 文件夹，您会发现无法做到。系统将产生一个窗口，显示错误消息（图
    4.1），指出无法列出目录内容。反过来，如果将某些文件放在普通用户的回收站文件夹中，则能够访问它们。如果您以 root 身份登录，应该能够查看甚至删除包含这些文件的回收站文件夹。作为
    root，您可以几乎做您想要的任何事，这包括普通用户的登录名称，您只能访问该用户有权访问的文件。


    ![](img/147f057d2f063d8c60ee616870537a94_66_0.png)


    图 4.1 某些文件夹只能由特权用户访问


    如果您以“root”身份登录，情况则大不相同，因为这为“root”用户提供了大多数事情的特别权限。可以通过在 KFM 中右键单击文件或文件夹，从弹出菜单中选择“Properties”（属性），然后左键单击打开的窗口中的“Permissions”（权限）选项卡（图
    4.2）来获取文件或文件夹权限的详细信息。


    当用户被添加到系统时，会发生许多事情，并且随着文件的生成，可以看到其中之一是为该用户的文件创建主目录。用户也被添加到数据库中，并且用户生成的文件属于组，用户将被添加到至少一个默认用户组中。当用户登录到
    Linux 时，系统决定他或她能访问哪些文件，并确保用户不会干扰任何超出范围的文件。对于“root”用户，情况不同，因为 root 拥有完全访问权限，可以更改权限，而对于非
    root 用户等也是如此。我们在最基本的层面考虑事物。理解这一点的一种方式是相当直接的方式。考虑“root”创建了一个名为“one”的文件夹，其中包含一个名为“oneone”的内部文件夹。我们现在考虑可用的访问级别。这基于适当的可用访问级别工作原理。

