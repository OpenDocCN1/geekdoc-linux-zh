    ## Command Line


    # ### What is it?


    Anyone familiar with the early days of computing with PCs will have used the MS/DOS
    operating system, and will be familiar with the concept of the command line interpreter.
    Those who started with Windows 95, or later, may not be. A PC test of the command
    line interpreter, and of other things we will use here, will need to be prepared.
    With a PC test of command line on a Mac or a PC. Macs with PowerPC are still supported
    so far.


    Windows 95/98/Me has a text mode of command interpreter. After a reboot, you can
    run on an MS/DOS prompt.


    Windows users have never used user interfaces and is possible to do it all. In
    fact, it is likely that a fair percentage will avoid command line interfaces.
    Whether or not it is possible to do it all, it is not advisable that you do. Linux
    now has graphical user interfaces and its possible to largely avoid command line
    interpreters. Whether or not it is possible to do it all, it is not advisable
    that you do. Using it altogether depends on the features offered by the graphical
    interface, and the types of task you will need to undertake. In most cases it
    is probably not yet possible to pretend the command line interpreter does not
    exist, unless the system is prepared to accept some limitations on the way in
    which the system is used.


    Even if you are not intending to look much of the command line interpreter, it
    is still advisable to look through this chapter. You may find some useful facilities
    here that can get you out of difficulties at some later date. Also, some of the
    material covered in this chapter is of a general nature, and is the type of thing
    you will need to know even if you normally use a Windows style front-end to handle
    things like file manipulation. For example, this chapter covers the Linux directory
    structure, which is significantly different to that of Windows.'
