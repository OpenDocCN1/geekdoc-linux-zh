    # Peripherals


    Assuming that Linux will work properly with your PC, will it also operate with
    peripherals such as printers and modems? This very much depends on the particular
    peripheral you are using, and the more common the device, the better the chance
    of it being supported by Linux. You can not find specific support for a printer
    or other peripheral in a standard Linux distribution. Most Linux distributions
    include a Hewlett-Packard LaserJet printer. Using a mode driver or emulator, a
    Hewlett-Packard LaserJet printer can be configured to work with many other printers.
    There are many different types of LaserJet printers, and even within the same
    type there are many different variations. This is the most common type of printer
    you will find in many offices, and as such, it is the most important type of printer
    to support. However, the quality of the printing produced by a LaserJet printer
    is quite variable, depending on the particular model used. Some models produce
    very high quality output, while others are not so good. If you have a LaserJet
    printer, you should find that it works with Linux without any problems.


    If you do not have a LaserJet printer, you will probably find that you can not
    use it with Linux, at least not without some modifications. There are many different
    types of printers, and each one has its own unique features. This makes it difficult
    to create a universal driver that will work with all of them. The best solution
    is to use a postscript driver. This is a universal driver that can work with many
    different types of printers. However, it is not always available, and even when
    it is, it may not work with all printers. If you have a printer that is not a
    LaserJet, you will need to look for a driver that is specifically designed for
    your printer. You may be able to find such a driver on the internet, or you may
