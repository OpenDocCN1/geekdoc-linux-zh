  md: '![](img/147f057d2f063d8c60ee616870537a94_79_0.png)


    # KDE and RPM


    As pointed out in chapter 2, these days many Linux applications are distributed
    in the form of RPM files. KDE includes an application called Kpackage for dealing
    with RPM files, and this can be activated by left-clicking on a .rpm file in KFM.
    Up the window shown in figure 4.29 are three clickboxes towards the top: ''Installed
    packages'', ''uninstalled packages'', and ''Files to install''. This last option
    is the required option when selected, left-clicking on the Install button will
    result in the software being installed, or error messages explaining what has
    gone wrong.


    Kpackage is available via the "K" menu by selecting Utilities and then Kpackage.
    This gives a somewhat different screen (Figure 4.30), and in this form it is intended
    for uninstalling different RPM software. This is possible because it is a simple
    matter to see which of the files in the current directory is an RPM file, and
    when you right-click on the file, KPackage is just one of the options which comes
    up in your window. The first two lines located and opened which tells you the
    window of the RPM file as shown in Figure 4.29. The software is then installed
    from here in the usual way.


    ![](img/147f057d2f063d8c60ee616870537a94_79_1.png)


    # Using Kpackage to uninstall software


    When used to uninstall software, the tree at the left-hand side of the screen
    shows various software categories and sub-categories. Double clicking on one of
    these expands it to show the contents. Having located the program you wish to
    remove, left-clicking on it brings up details of the program on the main window
    area. The Uninstall button becomes active, and left-clicking on it will result
    in the program being removed. You will get a chance to change your mind before
    the uninstall procedure starts, as there is little risk of accidentally or simply
    uninstalling anything. If you should accidentally remove something you need to
    change your mind, it should be possible to locate the RPM file on the installation
    disc and simply reinstall it from CD-ROM using Kpackage.


    # Unzip


    KFM can handle zipped tar files, but it does not seem to do as well with Mac/DOS
    and Windows type files that have been zipped using a program such as Winzip or
    Pkunkzip. These files usually have ".zip" or ".arc" extensions. If you left-click
    on a file of this type, it will launch the Arhive program, which will then display
    the contents of the zipped file (figure 4.31). The contents of text files can
    be read by clicking on the relevant file in the list, and it seems to be possible
    to extract some files. If extracting


