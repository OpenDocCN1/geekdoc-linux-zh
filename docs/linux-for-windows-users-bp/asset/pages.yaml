  md: '# Installation




    # Spoil for choice


    One slightly confusing aspect for the newcomer to Linux is that several different
    software houses produce it. To understand how this has come about we need to briefly
    examine the origins of Linux. Linux was produced by a group of individuals led
    by Linus Torvalds trying to write a version of the UNIX operating system meant
    for computers having one processor. In practice this effectively meant producing
    a version of UNIX for IBM PCs and compatibles. although there are some other computers
    based on Intel processors. UNIX is widely regarded as one of the most powerful
    and versatile operating systems available and is commonly encountered on high-end
    systems, particularly those used in scientific and technical applications. It
    is also used as the operating system for computer networks of course. A group
    of people working via the Internet to produce something as complex as a UNIX-like
    operating system may seem to be a bit over-ambitious but the project was successful
    and has continued to blossom.


    So what features does Linux offer, and who needs them? It has to be admitted that
    Linux is probably over-specified for many users. This is not necessarily a drawback,
    since you can simply ignore any features that you do not require. They are still
    there if you should need them at some later date.


    # Multitasking


    Linux has full multitasking capability, and will happily run unimpend programs
    simultaneously if the hardware is up to the task.


    # Multi-user


    It is also able to support multiple users concurrently. This is really only of
    consequence when Linux is used in a computer network, which is something it handles
    very well. However, here we are only concerned with Linux as the operating system
    for workstations and concurrent multi-user operation is something that will not
    be considered further.




    # Trademarks


    MS-DOS, Windows 95, Windows 98, and Windows NT are registered trademarks of Microsoft
    Corporation


    Partition Magic and Boot Magic are registered trademarks of PowerQuest Corporation


    WordPerfect is a registered trademark of Corel Corporation


    Star Office is a registered trademark of StarDivision Corporation


    PostScript is a registered trademark of Adobe Systems Incorporated'
