  md: 'If the system is in desktop One and you move a window so that the pointer touches
    the right-hand side of the screen, the system would automatically switch into
    desktop Two. And, conversely, it would move opening the window when the pointer
    touches the bottom of desktop One.


    Two such automatic switching conditions would be automatically set up on each
    virtual desktop.


    ![](img/147f057d2f063d8c60ee616870537a94_75_0.png)


    Fig. 4.19 The KDE Control Centre main window


    Taking the pointer to the extreme left-hand side of the screen would have no effect,
    since there are no virtual desktops in those directions. The automatic switching
    effect might seem like the ideal way of managing one huge desktop, which might
    also be considered like the way of doing things. In practice is one of those features
    that you either love or hate. If you are suitably precise with your control of
    windows you can work on one desktop to another on find regular basis.


    This is enabled via the KDE Control Centre Active Application Borders feature,
    and can be viewed by the KDE Control Center option in the ". " menu. This is shown
    in Figure 4.19. Next click on the select Active Borders, and the sub-shown in
    figure 4.20, on the check Box. You can then have to enable the further option
    of having an adjustable check Box. It also helps by selecting it from the menu
    before the switcher occurs. Using a delay slows things down, but it can help to
    avoid accidental switching from one desktop to another. I would definitely recommend
    using a short delay.


    ![](img/147f057d2f063d8c60ee616870537a94_75_1.png)


    Fig. 4.18 The upper slider controls the number of desktops


    to accommodate the legend, but it obviously makes sense to keep the button bars
    as narrow as possible to leave as much space as possible for other buttons on
    the panel. You can operate the Apply button to see if everything looks right before
    exiting from the Desktops control panel.


    # Border controls


    It is possible to have automatic switching between desktops if desired. This works
    on the basis of automatically switching to the next desktop if you move the pointer
    to an appropriate edge of the screen. The relative positions of the virtual desktops
    match up with their buttons on the panel.'
  merge: -1
  img_proc: true
- pgno: 76
  md: '![](img/147f057d2f063d8c60ee616870537a94_76_0.png)


    # Fig. 4.20 Setting active borders in the KDE Control Center


    Using the Active Borders feature you can move a window from one desktop to another
    by dragging it to an edge of the screen. When the pointer hits the edge of the
    screen the system moves on to the next desktop, taking the window with it. Another
    method of switching a window from one desktop to another is to select Desktop
    from the submenu, below the window menu, and then select the required desktop
    from the fly-out window.


    # Desktop Pager


    The Desktop Pager application offers another way of moving a window from one desktop
    to another. To run this program, activate the “K” menu and then select the System,
    Pager option. This should result in a small window opening in the bottom left-hand
    corner of the screen (just above the Panel; Figure 4.21). If you are only using
    two virtual desktops this window will show thumbnail views for both of them.


    If the system is set for four or more desktops only the first two will be shown
    in thumbnail views, but by left-clicking on the arrows it is possible to scroll
    along to the other desktops. Alternatively, the window can be dragged to a different
    size in the usual way, and if a suitable aspect ratio is selected all the desktops
    will be visible. By double clicking on a thumbnail the system is moved into that
    desktop.


    The thumbnail views only show a grey rectangle, and show no details of the window’s
    contents. However, you can find basic details of a window by right-clicking on
    it, and bringing up the window menu. This will show up the window’s details. The
    window menu is available from any part of the window.


    ![](img/147f057d2f063d8c60ee616870537a94_76_1.png)


    # Fig. 4.21 The KDE Desktop Pager


    Completes with the window. To move a window from one desktop to another it is
    again a matter of right-clicking on the representative of the window in the Desktop
    Pager, which will bring up the window menu. It is then just a matter of switching
    between the usual desktop menu options. First select the desktop you want to move
    the window to, and then move the window to the required desktop from the fly-out
    menu (Figure 4.22). All the other options in the window menu operate in the normal
    fashion. Incidentally, you can move a window to another desktop by using a menu
    bar shortcut.


    ![](img/147f057d2f063d8c60ee616870537a94_76_2.png)


    # Fig. 4.22 The Desktop Pager


    If you want to access the Desktop Pager first click within its window, but not
    on area that represents a window or a desktop. This brings up a menu with various
    options such as the Desktop Pager itself. Select the Show Menu option, which will
    put the usual menu bar at the top of the window. To close the program, activate
    the File menu and then choose the Quit option.'
  merge: -1
  img_proc: true
