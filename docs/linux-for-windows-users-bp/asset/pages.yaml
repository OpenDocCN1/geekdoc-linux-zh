  md: 'are further options available from the Settings part of the “K” menu, and

    you might be able to do some “fine tuning” here. There are graphics

    programs such as the SnappyShot program that was used to

    produce the screen dumps for this book, and drawing/editing programs

    such as Xv, and GIMP. You will probably find a vector drawing program

    such as Tgif as well.


    ![](img/147f057d2f063d8c60ee616870537a94_86_0.png)


    A typical Linux installation seems

    To include a few dozen utility

    programs. There should be an

    organis er, a CD player (Figure

    4.44), a calculator or two, a word

    clock, and all the usual utilities. It

    is well worth taking some time to see if you can find some useful freebies.


    # **Recap**


    # **View or change permissions**


    Right-click on the file or folder icon in KFM, select Properties and then

    left-click on the Permissions tab.


    # **Show permissions (command line)**


    Use the ls command with the “-l” option.


    # **Add a group (command line)**


    Use “groupadd -g 121 drumber groupName”


    # **Format a floppy disc**


    Activate the “K” menu, and then select Utilities and KFloppy. Choose

    the required disc size and format and then left-click on the Format button.


    # **Change the wallpaper**


    Activate the “K” menu and then select Settings, Desktop, and

    Background. Click away menu to select the required background and

    design, colour scheme, etc. and left-click on the OK button when you

    have finished. Left-clicking the Apply button enables you to see the

    new settings without exiting the Display Settings window.


    # **Add/remove desktops**


    Activate the “K” menu, select Panel and then Configure. Select,

    from the Desktops tab, the number of desktops you want. You can

    turn it back later.


    # **Change the Panel position**


    Activate the “K” menu, select Panel and then Configure. Select,

    from the Position tab, the position of the Panel. You can use the

    up/down buttons to change its position. Alternatively, you can

    click and drag the Panel to the position you want.


    # **Add an icon to Panel**


    Find the program you want to use and select it. Then left-click

    don the “K” menu, select Panel and then Configure. Select, from the

    Position tab, the position of the Panel. You can use the up/down

    buttons to change its position.


    # **Remove an icon from Panel**


    Right-click on the icon and select Remove.


    # **Move an icon on Panel**


    Right-click on the icon, select Move, move it to the new position and

    then left-click.


    # **Change the Panel size**


    Select Panel and Configure from the “K” menu. Then select “Tiny”,

    “Normal”, or “Large” from the panel buttons. Operate the Apply button to

    see the changes without exiting the configuration window.


    # **Make an icon**


    Cross graphics and then Icon Editor from the “K” menu. Draw your

    icon and save it with a xpm extension and save in /opt/kde/share/icons/

    You can also use this program to edit existing icons.


    # **Install a RPM package**


    Find the RPM file using KFM and then left-click on it. Select the

    appropriate options from the window that appears.'
  merge: -1
  img_proc: true
- pgno: 87
  md: '# Uninstall a package


    Select Utilities and Knowledge from the “K” menu. Locate the package you wish
    to remove in the tree structure and then left-click on the Uninstall button.


    # Unzip a MS/DOS zip file


    Use “unzip filename” at the command line.


    # Read a zipped text file


    In KFM left-click on file containing the text file. In the Archiver window that
    then opens left-click on the entry for the text file. The contents of the file
    will then be displayed in a Kedit window.


    # Check the free memory


    Use the free command at the command line. Alternatively, select Settings, Information,
    and memory from the “K” menu.


    # Check the free disc space


    Use the df command at the command line.


    # Print a file


    A file has a suitable format for the printer can be printed by selecting Utilities
    and Printer Queue from the “K” menu. Then drag the file from KFM to the main Printer
    Queue window.


    # Print a file (command Line)


    Print a file to the printer by copying the file to the mount point of the printer
    (e.g. /cp: Allie /dev/p/7). The file must be in a suitable format for the printer.


    # Print a PostScript file


    It is possible to print a PostScript file to many non-PostScript printers using
    the ghostscript program, as in this example which prints “Allie”:


    ```

    gs -sDEVICE=epson -sOutputFile=/dev/lp0 Allie.ps

    ```


    To “print” to a file the command takes this form:


    ```

    gs -sDEVICE=epson -sOutputFile=PrintFileName Allie.ps

    ```


    # Monitor CPU and memory use


    Select System and Task Manager from the “K” menu, and then operate the Performance
    tab.


    # Terminate a troublesome program


    Select System and Task Manager from the “K” menu. Highlight the troublesome program
    in the list of tasks and then left-click on the Kill task button. This method
    should not be used as the normal way of terminating a program. It should only
    be used when the program is otherwise uncontrollable.'
  merge: -1
  img_proc: true
