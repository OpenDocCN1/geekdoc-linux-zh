    # Memory


    If you limit yourself to running one application at a time it is unlikely that
    the amount of free memory will be a consideration unless you are trying to get
    by with the bare minimum. If you make a habit of running several applications
    at once the amount of free memory becomes more significant.


    From within KDE it is possible to use one of the system information on the programs
    to get information on the free amount of free memory or the way memory is allocated.
    Activate the K menu and then select Settings, information button in the top left
    of the KDE''s information utility window. This an information window in figure
    4.32. This monitor window will continue to update its figures even when it is
    not the active window, so you can run various programs and note their effect on
    memory usage. The more programs that you run the lower the figure for "Free memory"
    will become.


    ![](img/147f057d2f063d8c60ee616870537a94_80_1.png)


    # Fig. 4.32  Memory information obtained from one of KDE''s information utilities


    ![](img/147f057d2f063d8c60ee616870537a94_80_2.png)


    # Fig. 4.33  Memory information obtained via the command line


    It is also possible to obtain some facts and figures about memory usage from the
    command line interpreter. The most basic command line utility for monitoring memory
    is the free command, and to use it you simply type in this command:


    ```

    ```

    free

    ```


    ```


    This provides much the same information as its KDE equivalent, including a figure
    for the amount of free memory (figure 4.33). There are other system monitoring
    programs available via the "K" menu and the Settings - Information route, including
    information about the free'
