  md: 'cheap. What you are paying for is the CD-ROMS themselves rather than the software
    that they contain. You are also paying for any printed manuals and technical support.
    In some cases you may also be paying for software included on the CD-ROMS that
    is not free. As with most things in life, you tend to get what you pay for. The
    more you pay, the more printed manuals, technical support, etc., you are likely
    to get. You have to decide for yourself whether the extras are worth paying for.


    # Distributions


    There are now main versions of Linux, or distributions as they are called in the
    generally accepted terminology. Any of these will provide you with a good usable
    Linux distribution, and make the installation process reasonably hassle free.
    Here are brief details of each distribution.


    # Red Hat


    The Red Hat distribution is almost certainly the most popular, and this is the
    big name in the Linux world. Red Hat has received funding from large companies
    such as Intel, which should enable it to develop Linux more rapidly. Red Hat distributions
    include the GNOME graphical user interface and the RPM (Red Hat Package Manager)
    software installation system. I suppose this should be considered the ''safe''
    option, since most Linux software will run under a recent Red Hat version. It
    is also quite easy to install Red Hat Linux.


    # Caldera


    There are actually two distributions of Caldera Open Linux, which are the normal
    and "Lite" versions. The standard distribution is aimed at corporate users, and
    due to its commercial content is not freely distributable. Open Linux Lite lacks
    the commercial software and can be freely distributed. Until recently neither
    version was widely available. It is in the UK, but the full version now seems
    to be readily available. It includes supplemental KDE formats a central part of
    the system. Caldera Open Linux reasonably complete with a central part of the
    system. Caldera Open Linux reasonably simple to install and use, and in the latest
    versions can be easily installed alongside Windows in a dual boot set-up. For
    a first-time user it is quite a good choice.


    # Slackware


    This is one of the oldest distributions, and is felt by some to be less go ahead
    than the other main distributions. It is a good usable version of


    Linux though, and it is reasonably easy to install. It is readily available in
    the UK, and is available quite cheaply if you will settle for the CDs with no
    printed manuals.


    # SuSE


    The other three distributions originate in the USA, but SuSE Linux comes from
    Germany. It has become quite popular in Europe, including the UK where it is readily
    available. It is apparently less easy to obtain than the other two distributions
    outside Europe. This is expected, as it is a distribution that comes complete
    with the KDE graphical user interface I have sometimes found SuSE Linux a little
    awkward to get up and running, but with a little determination beginners should
    be able to get it working properly. Updates of the English language version tend
    to lag slightly behind the German version.


    There are actually a number of other distributions, such as Debian and Turbo Linux,
    but these would seem to be less widely available in the UK than the four distributions
    listed above. For newcomers it is probably best to use one of the main distributions,
    and any of them should give good stable results.


    # The numbers game


    With most operating systems new versions are few and far between. I have one PC
    which is now several years old and nearing the end of its useful operating life,
    but with the advent of newer, faster PCs the current operating system is still
    the current version. Things are very different with Linux, where there seems to
    be a constant stream of new distributions. The first number indicates the kernel
    itself, and with the lines 2.2.4. The first number indicates the kernel itself,
    and changes very infrequently the second digit is the minor version, and this
    changes every few months, or less. It is best to avoid old numbers that have been
    superseded, but at this time it is best to avoid old numbers, or less. It is best
    to avoid odd numbers (odd-numbered minor versions), as these are development versions.
    Kernel, or what would we consider beta code in normal computing terms. Kernels
    of this type are not supplied with the main Linux distributions. At the time of
    writing this, the most up-to-date minor version is version 2.4, but this has not
    yet found its way into all the main distributions.


    Linux distributions normally have two digit version numbers like 2.5.3 or 6.0,
    but like most Windows software, the second digit is likely to change about twice
    per year, with the first digit changing about every'
