- pgno: 34
  md: '# 2  Command Line


    a list of the files in a directory that start with “Fig”, this command would list
    them:


    **Fig\***


    if you needed to know which files started with “Fig” had two characters and then
    ended with “.gif”, this command would do the job:


    **Fig??\.gif**


    when using the question mark wildcard bear in mind that it will only work in the
    number of question marks matches up with the number of characters in the filename.
    For instance, the previous example with three “Fig12.gif” all right, but it would
    not match with “Fig1.gif” or “Fig100.gif”. These would both be catered for by
    this command:


    **Fig*.gif**


    there is a third wildcard in Linux, which is the square bracket. In MS-DOS the
    third wildcard has the same effect, but to know a pair of square brackets ([ ]).
    Suppose you wanted to know which files called “fig6a.gif”, “fig6b.gif” and “fig6c.gif”.
    You could search for specifically for these files using the square brackets:


    **fig6[abc].gif**


    under most circumstances there is probably no point in using the square brackets,
    but they can be useful in circumstances where the other wildcards would not be
    specific enough.


    # Copying files


    files are copied using the cp command, which must specify the file to be copied
    and its destination directory. The copy retains the filename of the original.
    This example would copy the file called “test” from the current directory to the
    /root directory:


    **cp test /root**


    This assumes that the file called “test” is in the current directory. If the source
    file is in the current directory the full path must be supplied in addition to
    the filename, as in this example:


    **cp /bin/test /root**


    Use “.” as the destination directory if you wish to copy a file from another directory
    to the current directory. This command would copy the file called “test” in the
    /bin directory into the current directory:


    **cp /bin/test .**


    The name of the file can be changed during the copy operation, and it is just
    a matter of giving the new file name when specifying the destination in the file
    called “nice” in the /bin directory is copied to the current directory as the
    file called “bad”. Of course, if “bad” was a directory, the file would be copied
    into this directory under its original name.


    **cp /bin/nice /bad**


    It is possible to copy several files from one directory to another by specifying
    several source files in the cp command. This command will copy the files called
    “test” and “test1” from the current directory to the /root directory:


    **cp test test1 /root**


    Rather than copying a file you can simply move it using the mv instruction. This
    operates in much the same way as the cp command, but the original file is deleted.
    This command would copy the file called temp in the /usr directory to the /usr/temp/:


    **mv /usr/temp / ./**


    This version of the command has the same effect, but the moved file is renamed
    “hello” during the move.


    **mv /usr/temp /hello**


    If a complete directory or even a directory structure must be copied, the mv or
    cp can test with the “-R” option argument. This example would copy all the directories
    and files in the /usr directory as a subdirectory of the current directory. The
    directory and file names remain unaltered.


    **cp -R /usr/test_ ./**


    An entire directory or directory structure can be moved using the mv command,
    and the -r modifier is not needed. This command has the same effect as the previous
    example, but the original directory structure is removed.


    **mv /usr/test ./**


    There would seem to be no Linux equivalent to the MS-DOS diskcopy command, and
    Linux is less disc oriented than MS-DOS. The contents of a disc are copied to
    another disc by rundiskcopy means of course.'
  merge: -1
  img_proc: true
- pgno: 35
  md: 'This sequence of events will provide the desired result.


    +   * Make a temporary directory

    +   * Mount the floppy disc

    +   * Copy the contents of the disc to the temporary directory

    +   * Unmount the floppy disc

    +   * Mount the floppy disc

    +   * Move the contents of the temporary directory to the copy disc

    +   * Unmount the copy disc

    +   * Remove the temporary directory


    This does not give a true clone of the original disc. If you are copying from
    a system disc, then you must copy to a system disc in order to produce a bootable
    copy. Copying files from one disc to another is probably easier using KDE and
    the KFM file manager, which has copy and paste facilities, but it still remains
    a slightly less than straightforward process.


    # Renaming


    With MS/DOS it is possible to rename files using the ren command, but there is
    no exact equivalent to this in Linux. However, the mv command can be used to move
    the contents of a file to a file of a different name but with the same directory.
    In other words the file is renamed. This command will take the file in the current
    directory called “test” and rename it “renamed”:


    ```

    mv ./test ./renamed

    ```


    When working with a directory name, but you need to be very careful when renaming
    directories. Doing so can render applications or Linux itself unable to locate
    the files they require.


    # Reading a file


    MS/DOS can be used to read a text file, such as a “readme.txt” file, using the
    type command. The nearest Linux equivalent to this is cat, which will simply print
    a file to the screen. This command displays the contents of the groups.1 file
    in the /usr/man/man1/groups.1 directory.


    ```

    cat /usr/man/man1/groups.1

    ```


    The cat command is only usable with short files or if you only wish to view the
    end section of a file. This is due to the fact that it does not give any control
    over the way the file is displayed, and with a small monitor the text is scrolled
    off the screen almost instantly. You stand no chance of to exit the less reader
    a few words at a time. In fact the less command is better for large amounts of
    text, because it displays the text one screen at a time. Simply press the spacebar
    to move on to the next screen and the H (return) key to move one line at a time.
    If the control c is not to exit the less reader. For instance, you can use control
    z to run more Key controls available. To move one line at a time, press the q
    key. This will display the next less command line.


    However, it is suggested that, to scroll up and down through the text, it may
    be easier to use the arrow keys instead. These commands will load the file into
    a “proper” window accessor of text editor.


    There are two further text-reading commands that are worth mentioning. The head
    command displays the first few lines. By default, ten lines are displayed, but
    this can be altered using the -x control. Where x is the number of lines to be
    displayed. These two commands would therefore display the first 20 and last 15
    lines in the text file /root/readme


    ```

    head -10 /root/readme

    tail -15 /root/readme

    ```


    # Links


    Earlier in this chapter it was pointed out that ls command can be made to display
    the names of the main files types in differently, but what exactly, can ls tell
    us about a file? This is where the find and which commands become useful. The
    find command will list all the files in a specific directory, but the which command
    can be used to find a specific file within a directory.


    To create a link to a file, the command ln -s oldfile newfile is used, where oldfile
    is the file or directory to link to, and newfile is the name of the new link.
    The -s option creates a symbolic link, which is a pointer to the original file.
    This is the default type of link on most systems.


    It is also possible to create a hard link, which is a direct copy of the file
    in the directory. This is the only type of link that can be used on a file system
    that does not support symbolic links. To create a hard link, use the ln oldfile
    newfile command.'
  merge: -1
  img_proc: true
- pgno: 36
  md: 'There are two types of link, which are symbolic links (also known as soft links)
    and hard links. A symbolic link stores the path and file name for the file it
    links to. If the file it links to is moved or renamed, the link may be broken
    because it still points to the old path. A hard link, by contrast, is a second
    entry in the directory that points directly to the same data on the disk as the
    original file. A hard link can be moved or renamed, just like any other file.
    A hard link can be moved to a different directory because it is not a symbolic
    link, but it cannot be used across filesystems. When a file has more than one
    hard link, it will not be deleted from disk until all the hard links to it are
    removed.


    # Creating links


    In order to create a link, use the ln command. To create a symbolic link, use
    the -s option. The syntax is: ln [options] target linkname.


    ```

    ```

    ln -s target symbolic_link

    ```


    Example: Create a symbolic link from /home/user/docs to /home/user/my_docs:

    ```

    ln -s /home/user/docs /home/user/my_docs

    ```

    ```


    To create a hard link, simply omit the -s option. The syntax is: ln target hard_link.
    Note that you can only create hard links between files on the same filesystem.


    # Managing links


    +   - Use ls -l to list the links and see which files they point to.

    +   - Use readlink to display the value of a symbolic link.

    +   - Use file to determine the type of file.

    +   - Use test or [ to test the properties of links.


    # Using Links in Shell Scripts


    Links can be used in shell scripts to make configuration files easier to manage.
    For example, you can create a symbolic link to a configuration file and change
    the link to point to a different configuration without modifying the script.'
  merge: -1
  img_proc: true
