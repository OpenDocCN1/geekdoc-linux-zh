  img_proc: true
- pgno: 32
  md: '# 2  Command Line


    File  Type  Normal  file  Program  Process  Directory  Link


    Colour  White  Green  Blue  Red  Cyan


    You have given the colour of normal files as white, but this colour will be the

    normal text colour for the display. This will usually be either white or

    grey. The color option can be used when listing the contents of

    something other than the current directory, and the command then takes

    this form:


    ls /usr/lib —color


    In this version of the command will also work, because the hyphens

    in front of the word color will ensure that Linux does not interpret it as

    the directory to be listed:


    ls -color /usr/lib


    There are other controls that can be used to modify the way in which the

    ls command functions, and you can get brief details of these by using

    the on-screen help system. To get help on a command simply type the

    command followed by —help, as in this example:


    ls -help


    Many of the controls enable the list to be sorted in various ways, which

    can obviously make life easier when dealing with large lists of files.

    Hidden files are included if the -a switch is used. To have

    the file size in kilobytes included use both the -s and -k controls, as in

    this example:


    ls -s -k


    You can have the controls as separate entities, as in the above example,

    but it works just as well in this form, with two or more merged into a

    single entity:


    ls -sk


    If you investigate the Linux file system the large number of directories

    and files may surprise you. To some extent the large number of files is

    just the way it is done with discrete items of hardware. It also has to be

    borne in mind that a typical Linux installation includes more than just the

    operating system. There may well be dozens of application programs or

    word or text processors, and games.


    # Directories


    Adding and removing directories is handled in much the same way as it

    is under MS-DOS. New directories are created using the mkdir (make

    directory) command, but note that this can not be abbreviated to an

    MS-DOS style md. This command can produce a subdirectory off the

    current directory, and it will be called "temp":


    ```

    mkdir temp

    ```


    A new directory can be placed anywhere in the file structure by including

    the full name and path in the command. This example produces a

    subdirectory called temp, and places it off the root directory:


    ```

    mkdir /root/temp

    ```


    The rmdir command is used to remove unwanted directories, but note

    that it can not be abbreviated to just rd in Linux. Also note that a

    directory can only be removed if it is empty. In this context "empty"

    means that it must not contain any files at all, or subdirectories even if those

    subdirectories are empty. The rmdir command, and these two examples would remove

    the directories made using the two mkdir examples given previously:


    ```

    rmdir temp

    rmdir /root/temp

    ```


    Sometimes you may wish to remove a directory, complete with all the

    files it contains. This can be achieved from the parent directory using the

    rm command and the -r (or recursive) modifier. The example shown

    here will remove the directory called "testdata" and all its contents:


    ```

    rm -r testdir

    ```


    Obviously great care needs to be taken when deleting files, and even

    more care must be exercised when removing complete directories.'
  merge: -1
  img_proc: true
- pgno: 33
  md: '# **Files**


    In the normal course of events users generate files using applications, but for
    experimental purposes you can generate dummy files using the operating system.
    This can be achieved using the "touch" command, as shown in this example, which
    would generate a file called "test":


    ```

    ```

    touch test

    ```

    ```


    The file would be placed in the current directory, but it could be placed anywhere
    in the file structure by including the directory path in addition to the file
    name. Files can be removed using the `rm` command, and this command would remove
    the file generated in the previous example.


    ```

    ```

    rm temp

    ```

    ```


    Of course, for this to work the file would have to be in the current directory.
    By specifying the full path and file name it is possible to remove files in other
    directories. The path structure depends on the system default, you may be asked
    if you want to remove the file, and you must then reply y, Y or r for yes, there
    is no built-in file retrieval system, so if files you delete for it will be regarded
    as lost and gone forever.


    With MS-DOS it is possible to delete all the files in a directory, using the `*`
    wildcard symbol. This is also possible in Linux, as in this example:


    ```

    ```

    rm /root/*

    ```

    ```


    This will delete all the files in the /root directory, but depending on the default
    setup of your system it might be necessary to confirm the removal of each file.


    # **Filenames**


    Users of MS/DOS will notice that the MS/DOS `* *` has been replaced with just
    `*` in Linux. MS/DOS filenames can have up to eight characters plus up to three
    characters in an extension. The extension follows the main filename, and is separated
    from it by a full stop. These three-character extensions are normally used to
    indicate file type, such as “txt” for a text file or “.jpg” for a JPEG graphic
    file. Filename extensions can also be used in Linux systems, but the full stop
    does not have the same significance as it does in MS/DOS. The full stop character
    is almost just another character as it does in Linux. The filename “ch1.txt” is
    just as valid in Linux as “chapter1.txt”. The filename “bk.chapt1” is just as
    valid as a text file by a program that was designed to recognise the “.txt” extension.
    Here are some useful points to remember when thinking up Linux filenames:






    # **Maximum characters**


    Up to 256 characters can be used in a Linux filename. However, things get a much
    more manageable if you limit yourself to no more than about 40 or so.


    # **Case sensitivity**


    Both upper and lower case letters can be used in filenames, and unlike MS/DOS,
    Linux regards them as two separate sets of characters. In MS/ DOS files called
    “london”, “LONDON” and “London” would all have the same name, but in Linux they
    would each have a different name.


    # **Allowable characters**


    Numbers and most other characters are allowed in filenames, but there are certain
    characters that should not be used as they have special meanings to the shell
    and could cause confusing results. These are the characters to avoid:


    +   - Ampersand &

    +   - Apostrophe `

    +   - Asterisk *

    +   - Circumflex ^

    +   - Forward slash /

    +   - Hyphen -

    +   - Question mark ?

    +   - Quote “” ‘’

    +   - Vertical bar |


    The space character should also be avoided as the shell might otherwise interpret
    the filename as two or more filenames separated by spaces.


    # **Wildcards**


    With some MS/DOS commands it is possible to use wildcards instead of giving a
    complete filename. Things operate in much the same way with Linux. The asterisk
    character was used in an earlier example, the asterisk can be used to represent
    any number of characters. The question mark can be used in place of a single character.
    Suppose you required'
