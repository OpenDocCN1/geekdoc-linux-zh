- pgno: 48
  md: '# ## 3 Using KDE


    # ### A Linux GUI


    The Linux command interpreter has a wide range of commands, and it can be programmed
    to make light work of complex and repetitive tasks.


    It is undoubtedly very powerful, but like any command line interpreter, it does
    not score well in terms of user-friendliness. These days most users prefer a graphical
    user interface, and will not settle for anything less.


    Linux has more than one graphical user interface to choose from, but one that
    is most widely used is normally just called KDE, is the K Desktop Environment,
    which is central to some of them. 4.21 bit Caldera Open Linux. Superficially KDE
    looks a bit like a 32-bit version of Windows, and with the latest version you
    can select a Windows look to the desktop if you like. BEOS and Mac flavours of
    the desktop are also on offer.


    However, below the surface KDE is significantly different to Windows, or any other
    operating system. You can select a Windows, BEOS, or Mac look to the desktop,
    but KDE still operates in more or less standard KDE fashion. For someone used
    to any other graphical user interface there is a certain amount of learning to
    do before getting fully in control of things. On the other hand, with a little
    experimentation you can soon start to find your way around the system, and undertake
    a few basic tasks. If you are not familiar with the Linux file system used by
    Linux, before getting too deeply into KDE. It is necessary to read the parts of
    the previous chapter that deal with the Linux directory structure. Setting up
    and using KDE should then be reasonably pain-free.


    # #### Versions


    Like everything else in the world of computing, KDE is gradually evolving. At
    the time of writing this there are only two versions of KDE, which are versions
    1.0 and 1.1. The latter is quite new, and should soon take over from version 1.0.
    Obviously you must have KDE installed on your PC in order to use it.'
  merge: -1
  img_proc: true
- pgno: 49
  md: 'order to work your way through the material in this chapter. KDE 1.1 is

    preferable, and if possible installations equipped with version 1.0 should

    be upgraded. Most of the material provided here is relevant to both

    versions, and where necessary any large differences between the two

    versions are pointed out.


    With some Linux distributions KDE is run automatically once Linux has

    booted-up, to do this it is just a matter of logging in as usual and then using

    this command:


    ```

    kde

    ```


    The program may be called KDE, but in order to run it you must type

    ''kde'' rather than ''KDE''. The two versions are very similar in operation,

    but there are some important differences. One of these becomes

    apparent when you first run KDE. With version 1.0 you go straight into

    your desktop, but with version 1.1 it is a Window style

    program called "Kicker", and in a sense you are in a setup mode for the

    desktop until you are completely set up for immediate use.

    As a point of interest the KDE login screen on BEOS or MacOS on the

    Macintosh is very similar. You have the option of starting KDE as

    root, but this should be avoided. As the default user is normally set to

    the standard KDE window manager. It would suggest that you settle

    for root as a desktop at any time, but initially I would suggest that you settle

    for standard KDE window locks.


    Another difference is that version 1.1 will optionally add icons for the

    floppy disc or discs to the desktop, plus an icon for the CD-ROM. I

    would suggest that you let KDE add icons for these as the icons make

    it much easier to use the floppy drive or drives and the CD-ROM

    drives, as you can simply just drag an item to the appropriate icon to

    do the operation you want, for example to add icons for these

    things at an early stage. This is covered in the section of this chapter

    that deals with the use of disc drives.


    # The desktop


    Once into KDE the screen should look something like Figure 3.1. If you

    have used any form of Windowsing environment the KDE desktop should

    look slughty familiar, but there are some aspects that will not.


    # Trash


    The Trash icon is equivalent to the Trashcan in some operating systems,

    similar to the Recycle Bin in Windows. The icons representing files can be

    dragged to the Trash icon and dropped there to delete them. This is the

    KDE equivalent of the command line `rm` (remove) command, but like

    the Windows Recycle Bin files are not destroyed when they are dropped

    into the trash icon. They are moved from their original location into a


    ![](img/147f057d2f063d8c60ee616870537a94_49_0.png)


    directory for deleted files. They remain in that directory until Trash is

    emptied, and can be recovered if they have not been dumped.


    This is very similar to the Windows recycle bin, but one important

    difference is that files deleted from floppy discs are stored in a Trash until

    it is emptied. With Windows a file on a floppy disc that is placed into the

    Recycle Bin is actually deleted onto the disc and is not copied (possibly

    with the ''add to last minute possible to recover the file, except (possibly)

    to copy the file to a new account where it can be copied back to the original

    disc, or anywhere else.


    The icons on the desktop simply provide immediate access to a certain

    point in the file system. If you login as ''root'', the trash folder will be

    /home/Desktop/Trash''. If you login as (say) ''Fred'', the trash folder will be

    /Fred/Desktop/Trash''. Deleted files are stored in this folder until

    the trash is emptied, and then they can be treated just like any

    other files in that folder. In the case of a hard disc file, take any

    opportunity to delete the file. The files in Trash are stored on the hard disc,
    and

    are not deleted immediately. In fact deleting files on

    the hard disc can sometimes take a lot of time. The files in Trash are stored
    on the

    hard disc and reduce the amount of free storage space.'
  merge: -1
  img_proc: true
- pgno: 50
  md: '# Autostart


    The “Autostart” icon provides access to a folder that contains programs or links
    to programs that must be run when KDE starts up. This is the equivalent of the
    autostart folder that exists in MS/DOS and the Startup folder in Windows 95/98.
    Each user that has their own “Autostart” folder can have their own set of programs
    that they want running when KDE starts. In fact each user effectively has his
    or her own KDE desktop which can be customized to suit individual requirements.


    # Templates


    The “Templates” folder is, as you might have guessed, for storing template files.
    Do not concern yourself with this one for the time being. Many programs can use
    templates to save time when producing standard letters, book layouts, or whatever.
    Should you start using templates they can be stored in this folder.


    # The Panel


    The Panel is the bar across the bottom of the screen, and in Windows terminology
    this is a form of toolbar, but is has similarities with the Windows taskbar. The
    KDE 1.0 Panel looks rather more bulky than a quick means to run current programs
    there are icon areas that “one” for “four”. Both versions have four “buttons”
    labelled rather fewer: These are useful for switching between the KDE equivalent
    of virtual consoles. But they are “virtual” consoles. When using the graphical
    user interfaces, you can unlink multi-tasking, and there are two ways of tackling
    tasks, too: simply “two” or more programs on one desktop, much as the Windows
    taskbar, or put each program on its own, separate desktop, so you can “four” programs
    on four desktops. Both methods, with several programs running on each virtual
    desktop.


    It will be necessary to have access to two programs at once, such as obviously
    necessary to drop a tile from one window to another. They must then be open, and
    there is no need for the second program to be open on the same desktop. If you
    drag and separate programs are opened on different desktops. To switch between
    them, simply click on the appropriate “virtual console” at the bottom of the screen,
    or use the desktop switcher in the Panel. Both methods are described below in
    more detail.


    Though switching from one to the other is multi-tasked, Bear in mind that the
    more programs that are multi-tasked, the greater the system resources that will
    be needed. For complex multi-tasking to


    work, well it is essential to have plenty of memory available. With the current
    low cost of PC memory, this is not normally a major problem.


    To the left of the buttons used to switch between virtual consoles are the tools
    the “pop-up” shell is used to launch programs. It is used to log out of the KDE
    session.


    This takes the system back into a console mode and the command line interpreter.
    On operating this button you get a chance to change your mind (in case you operated
    it by accident) or to continue with the “log out”-accounting you may be given
    further options such as shutting down the system, returning to a console, or rebooting.
    The lower of the two small buttons is the screen-locking button.


    # Now you see it...


    You will notice that the Panel has an arrow at each end. If you try left clicking
    on the right-hand end of the arrow you will find that the Panel expands onto the
    right-hand side of the screen. Similarly, left clicking on the left-hand button
    causes the Panel to retract onto the left-hand side of the screen. In either case
    the arrow remains as an “on” indicator that the panel can be “popped” out of its
    “home” position. You will also notice that when you move your cursor to the top
    of the screen, it causes the Panel to pop back out. Again, when you move your
    cursor away from the area above the panel, the area above the panel retracts,
    and the panel will remain at the top of the screen.


    ![](img/147f057d2f063d8c60ee616870537a94_50_0.png)'
  merge: -1
  img_proc: true
