    size. The next button causes the window to disappear to the taskbar; Clicking
    on the appropriate section of the taskbar restores the window. Anyone used to
    using Windows should find these buttons easy to use, as they are essentially the
    same as their Windows counterparts.


    # Window button


    The button at the left-hand end of the title bar is the window button, and operating
    this activates the three up-down menu (Figure 3.3). The Maximize and Close options
    simply duplicate the size of the window described previously. Resize, unsurprisingly,
    enables the size of the window to be altered. Selecting this option produces a
    frame that can be dragged to the required size using the mouse, and left-clicking
    on the button causes the window to change to the selected size. This is really
    a duplicate function as well, since any window can be dragged to the required
    size by placing the cursor at the edge or corner of a window and then dragging
    the cursor to the large mouse button shape. The drag bit can be resized by holding
    down the left mouse button, dragging it to the required size, and then releasing
    the button. This is again standard Windows style. control. A window can be dragged
    around the screen by pointing to the title section of the title bar, holding down
    the left mouse button, and then'
