- pgno: 30
  md: '# Mounting


    Initially, the CD-ROM and floppy drives will not be mounted, and this is an area
    where MS-DOS and floppy work in a much more free and easy manner than Linux. With
    Windows, and MS-DOS you can mount or unmount discs as and when you please. The
    system may occasionally complain with an error message when it fails to find the
    expected disc in the drive, but in general there is unrestricted access to the
    drives. Linux has not actually made the drive part of the system a logical mount
    since it is not actually necessary to contain any files. The commands used to
    mount drives are easy to remember; since it is called mount, it is not mounted
    until you type it. Before you can use a drive it must be mounted, and disc drives
    do not actually have to contain any files. The command used to mount a disc has
    to be typed at /mnt/floppy or /mnt/cdrom. On the system I am using for these examples
    the floppy drive is mounted at /mnt/floppy. If you type the `mount` command you
    will list all the mounts in the system. The equivalent of the “dir” command in
    Linux is the “ls” command. Type this instruction to view more /etc/fstab file
    which lists the mounts:


    There should be a couple of lines in the file that are similar to these two:


    /dev/hdd /mnt/floppy auto user,iso9660,ro,defaults,noauto 0 0

    /dev/hdd /mnt/cdrom auto user,iso9660,ro,defaults,noauto 0 0


    The first line is the one for the floppy drive and the first two entries on this
    line show where the floppy device appears in the file system. Either of these
    can be used when mounting the drive, so either of these will do the job:


    mount /mnt/floppy

    mount /dev/fd0


    Things operate in a similar manner for the CD-ROM drive, and the first two entries
    in its section show where it appears in the file system. To mount the CD-ROM drive
    either of these commands could be used:


    mount /mnt/cdrom

    mount /dev/hdd


    ![](img/147f057d2f063d8c60ee616870537a94_30_0.png)'
