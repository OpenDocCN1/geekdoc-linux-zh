- pgno: 85
  md: '![](img/147f057d2f063d8c60ee616870537a94_85_0.png)


    straightforward using this method, but the KDE Task Manager makes things much
    easier. Clicking *System* in the *Task* Manager’s main tool bar makes an area
    called *Resources* appear. This shows data for all the tasks in a window, and
    *Resources* also has a small chart for each task, so it is easy to locate the
    right one and terminate it using the *Kill Task* button. The *Task Manager* is
    the Linux equivalent of the Windows *Ctrl*-*Alt*-*Delete* Close Program window
    (it should only be used as a last resort and not as a normal way of terminating
    programs. Another factor in common with its Windows counterpart is that it shows
    the background processes and not just the programs that are in open windows. You
    will therefore find numerous processes running that you probably had not realised
    were running.)


    If the Processes tree tab is operated the window changes to show the running tasks
    in tree form, but the program otherwise functions as before. The Performance tab
    switches to a completely different window that enables the CPU loading and memory
    to be monitored (Figure 4.41).






    # Finally


    If you have followed the story so far you will not be an expert on Linux, but
    you should be able to install this operating system on a PC and use it to good
    effect. You should also be able to install and run applications, check that you
    are not running out of hard disc space, copy files, tailor the KDE desktop to
    suit your requirements, format floppy discs, and do all the other essential tasks
    that you can (almost) do with Windows. Shut down KDE using the menus at the top
    of the screen. If you have installed a Linux distribution then you should also
    be able to switch from this to another, but there will usually be one or two joke
    programs such as *Xeyes*, which is a pair of eyes on the screen (Figure 4.42).
    They go cross-eyed if you position the pointer between them! Right-click on one
    of the eyes and select *Close* in order to switch off this program.


    ![](img/147f057d2f063d8c60ee616870537a94_85_1.png)


    There are plenty of tools for configuring KDE, and it has not been possible to
    describe all of them in this book. Altering the wallpaper was covered in this
    chapter, but if you activate the "K" Menu and then select *Settings* and *Desktop*
    there are several further options available that enable things such as colours
    and fonts to be altered (Figure 4.43) and these mostly work in a standard Windows
    fashion and are very close to and are easy to set up. There


    ![](img/147f057d2f063d8c60ee616870537a94_85_2.png)'
