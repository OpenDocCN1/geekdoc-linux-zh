- pgno: 62
  md: 'The Linux version is not an exact clone of the Windows program, but it is very
    close. If you use MS WordPerfect for Windows or any other competing program as
    a template, you will find that the KDE version is easy to pick up after using
    KOffice with little effort. If you have an advanced graphics tool, you may find
    that the KDE version of KWord is not as fast as some other programs. There are
    a few differences in how you access some of the advanced features in KWord, but
    these should not be too difficult to learn.


    In fact, the KDE version of KWord is a good place to start if you are new to office
    suites. It has advanced features and an interface that is easy to learn. It can
    be used as a word processor, a document checker, a thesaurus, or even as a web
    browser. However, because it is not a word processor, a single click in a document
    can select an entire line, so if you want to insert a word, you need to be careful
    where you click. You can still copy and paste from one document to another.


    Copy and paste from one document to another.


    Last but not by no means least, there is XMemo, the X Windows version of the emacs
    word processor (Figure 3.26). If you are unable to find it in the command window,
    it is probably best possible to run it by entering this command into a KDE terminal:


    xemacs


    ```

    ```

    xemacs

    ```

    ```


    In fact, you will probably be greeted with XMemo if you try to run the standard
    version of the program from a KDE terminal. This program would seem to have all
    the standard version. But the menu and system and toolbar make it much easier
    for newcomers to master.


    # Recap


    After reading through the above material and experimenting with KFM you should
    soon be able to navigate the system and understand simple, basic “housekeeping”
    tasks such as copying and deleting files. Here is a quick recap of how some of
    the more common tasks are performed. Note that in most cases there is actually
    more than one way of performing the task, and that not all the possible methods
    are necessarily included here.


    # Drag with the mouse


    Point to the scroller (or whatever), hold down the left mouse button, move the
    mouse to make the required adjustment, and then release the left mouse button.


    # Selecting files


    Hold down the Control key and left-click on a file or files you wish to select.
    Alternatively, hold down the Left Mouse button and drag a frame around the files
    you wish to select, and then release the Left Mouse button.




    ![](img/147f057d2f063d8c60ee616870537a94_62_0.png)


    Figure 3.26 The XMemo editor has a menu system and a toolbar


    and then add additional files to the selection by holding down the Control key
    and left-clicking on the appropriate icons. You can then hold down the Control
    key and add to a selection using the frame method.


    # Select all files in a folder


    Open the folder and then choose Select All from the Edit menu.


    # Open a file or folder


    Locate a program or KFM and then left-click on its icon or filename. If the file
    is not a program or a standard data type you will then have to select the program
    needed to open the file.'
  merge: -1
  img_proc: true
- pgno: 63
  md: '![](img/147f057d2f063d8c60ee616870537a94_63_0.png)


    Fig. 3.27 KFM will not overwrite a file unless told to do so


    # Copy, Move, Link


    Open two copies of KFM, one showing the source folder and one showing the destination
    folder. Select the item or items to be copied and drag them to a vacant screen
    area in the main window for the destination folder. Select Copy, Move or Link
    from the menu that pops up, as required. An alternative method of copying is to
    select the items and then choose Copy from the Edit menu. Open the destination
    folder and then select Paste from the edit menu. If a folder is copied or moved,
    so are all its contents.


    # Overwriting


    If you try to copy a file to a folder that already contains a file having the
    same name, KFM will produce the pop-up menu of Figure 3.27. If you left click
    on the Overwrite button the source file will replace the destination file. This
    enables a new version of a file to be inserted in place of an old version. It
    can also result in an old file obliterating a new one if you are not careful.
    When dealing with groups of files, Overwrite All will result in any files having
    duplicate names being overwritten. This obviously requires even more care to be
    exercised.


    # Trash and Delete


    To delete items select them and then choose Delete from the Edit menu. Alternatively,
    Select one or more items and then right click on one of them. Select Delete from
    the pop-up menu. Note that deleted items can not be recovered.






    # Retrieving From Trash


    Click on Trash to open its folder. The contents are then shown in a KFM window
    from where they can be copied and moved in the normal way.


    # Emptying Trash


    Right click on Trash and then select Empty Trash Bin from the pop-up menu (Figure
    3.28).


    # Close a window


    Left click on the close button (the one marked with an “X”) on the title bar.
    Alternatively, if the Close button is absent choose Close from the File menu.
    Using Control-w will close the active window.


    ![](img/147f057d2f063d8c60ee616870537a94_63_1.png)


    Fig.3.28 Emptying the Trash Bin


    # Make a window active


    Left click on an inactive part of the window, such as a part of the title bar
    that does not have any buttons. If you click on a button you will probably make
    the window active and operate the button as well. Only one window at a time can
    be active incidentally.


    # Move a window


    Point to a part of the title bar that does not contain any buttons and then drag
    the window to the desired position. Alternatively, press the Alt key and then
    drag the window using any point within the window as a handle.


    # Minimise a window


    Operate the iconify button on title bar (the button with a dot in the middle).


    # Restore a window


    Maximise on an appropriate section of the taskbar.


    # Maximise a window


    Left click on its Maximise/Restore button (the button marked with a square). Clicking
    on it again takes the window back to its normal size.'
  merge: -1
  img_proc: true
- pgno: 64
  md: '# Open a terminal (console)


    Use Control-T from the keyboard, or operate the terminal button in the Panel (the
    one with the monitor icon).


    # Run a program


    If it is not in the “K” menu, locate the program file using KFM and then left
    click on its icon or filename.


    # Put a program icon on the desktop


    Locate the program file using KFM, and drag it onto a vacant area of the desktop.
    Select Link from the pop-up menu. Left clicking on the icon will then run the
    program.


    # Change virtual desktops


    To move to another desktop simply left click on the appropriate desktop button
    on the panel (the buttons labeled from one to four). Alternatively, hold down
    the Control key and then keep pressing the Tab key to cycle through to the desktop
    you require.


    # Make a window visible in all desktops


    Click on the Sticky or Pin button in the title bar. Operating this button makes
    the window visible only when using that particular desktop.


    # Start KFM


    Click on the house icon in the panel. This starts a KFM in the Home directory,
    but you can move to the required directory from there.


    # Make a new folder


    Open the parent directory using KFM. Right click on a vacant area of the main
    window, select New from the popup menu, and then Folder. Type the name of the
    new folder in the edit box that appears and then left click on OK.


    # Hide the Panel


    Left click on an arrow at one end of the Panel. Left clicking on this arrow again
    restores the Panel.


    # Autostart a program


    Locate the program file using KFM and then drag it to the Autostart icon. Then
    select Link from the pop-up menu.


    # Stop a program from starting automatically


    To reverse the process left click on the Autostart icon. This opens a copy of
    KFM showing the contents of the Autostart folder. Simply delete the links for
    any programs that you do not require at start-up.


    # Make a window visible in all desktops


    Activate its Sticky icon.


    # Move a window from one desktop to another


    Activate its Sticky icon, switch to the desktop where it is required, and then
    deactivate the Sticky icon.


    Note that some menu options and certain buttons are not operational under all
    circumstances. Inappropriate menu options are greyed-out (shown in light grey
    rather than black) and can not be selected. Similarly, inactive buttons do not
    appear to protrude slightly from the desktop, and can not be operated. This is
    the same method that is used in Windows and most other graphical user interfaces.'
  merge: -1
  img_proc: true
- pgno: 65
  md: '# # 4

    ## Also need to know


    # ### Multi-user


    The three previous chapters covered the things you need to know in order to get
    Linux installed on your PC, and use the system to run applications, copy files
    etc. using either the command line interface or KDE. In this chapter we will delve
    a little deeper, covering a range of topics that you need to know about in order
    to use a Linux system effectively.


    As we saw in previous chapters, in order to use Linux it is necessary to log in
    under a user name, and to give the corresponding password. This is much more work
    than the boot process takes even on a small, modern, fast PC: to make the computer
    run a simple program might require a login and password, and then perhaps one
    or more mouse clicks or a series of keystrokes in order to make the computer.
    This extra time and effort means that even using a very fast computer requires
    a reasonable amount of thought to use the machine. Provided each user does not
    require much time at a time. The problem with this approach is that there is a
    lack of privacy for the users. This is not just a matter of other users having
    access to what might be someone else''s private information. With a free-for-all
    approach to things there is a real danger of one user accidentally altering or
    erasing data belonging to other users. In fact the system could gradually degrade
    into a complete shambles.


    With a multi-user operating system such as Linux you login under a name and password
    so that the operating system always knows who is using the computer. It would
    be an exaggeration to say that the system looks completely different to each user,
    and that it is like each one having their own PC. However, to some extent the
    computer will be personalised for the current user. The differences are perhaps
    more obvious when running KDE than when using the command line interface. Even
