  md: '# **Preparation**


    Before you try to install Linux, it will be necessary to do a certain amount of
    preparation. If you are starting there with a new computer having a hard disc
    that is completely empty, there is little to do. It is basically just a matter
    of trying to find some basic configuration of the hardware in case they are needed
    during installation. The same is true if you are going to install Linux on a computer
    that has previously been used with another operating system on the hard disc.


    This will also affect what you have on the hard disc. If you are installing Linux
    on a PC with any systems that have been removed, together with an existing Windows
    system, and all Linux on the hard disc. If you are installing Linux on a PC with
    any existing system on the hard disc, you should back up the hard disc. This is
    because the Linux installation process may remove any data that has been removed
    from the hard disc.


    # **Dual boot**


    Matters are a little trickier if you have opted for a dual boot system where you
    will use a single hard disc to run both Linux and Windows on it. There are a few
    important points that you need to take into consideration when setting up a dual
    boot system. First of all, if you are installing a dual boot system, it is essential
    to keep the hard disc partitions on which the Windows system, and a back up copy
    of the Windows system, which you created on the hard disc. It will also be important
    to make sure that the Linux system does not overwrite the boot sector or any critical
    Windows data on the hard disc.


    There are a few points to keep in mind. First of all, you will need to make sure
    that the partitioning software is set up correctly so that the boot loader (such
    as LILO or GRUB) is installed on the correct partition. If you are using LILO,
    make sure that it is installed on the first partition of the hard disc. If you
    are using GRUB, make sure that it is installed on the MBR (Master Boot Record)
    of the hard disc. This is essential for the dual boot system to work correctly.


    The boot manager, which is part of the boot process, will be able to let you select
    which operating system to boot. This is usually a text-based menu that appears
    when the computer starts up. You will be able to select either Linux or Windows
    from this menu. Make sure that the menu is configured correctly so that both operating
    systems are listed and can be selected.


    In order to produce a dual boot system you should first set up the non-Linux,
    non-Windows partition on the hard disc. This is where the Linux system will be
    installed. You will need to make sure that this partition is formatted correctly
    and that the necessary Linux files are installed on it. Once the Linux system
    is installed on this partition, you can then set up the boot loader and the boot
    menu.






    Matters become trickier still if you wish to add Linux to a computer that already
    has a well-knit and used operating system installed. It is unlikely that you can
    make a mistake that will have a drastic effect on the operating system. If you
    make a drastic mistake during the installation process, it will be difficult to
    make. It is also worth noting that if you want to install Linux on a computer
    that is already running a different operating system, you will need to be careful
    not to damage the existing system.


    If you are planning to install Linux on a computer that is already running a different
    operating system, you will need to be careful not to damage the existing system.
    It is important to back up any important data on the hard disc before proceeding
    with the installation process. You will also need to make sure that the hard disc
    has enough free space to install Linux. If you are short on space, you may need
    to delete some unnecessary files or programs to free up space on the hard disc.


    The long route to freeing up a section of hard disc for a Linux installation is
    to back up the existing system, and then reinstall the disc using its MS-DOS FDISK
    program. Instead of repartitioning the disc so that its capacity is used, you
    leave enough unused capacity for the Linux installation. By repartitioning the
    disc, you will destroy the Linux installation and lose the existing system. This
    is why it is important to back up the existing system before proceeding with the
    installation process.


    If you are going to use a program, such as PartitionMagic, to repartition the
    disc, you will need to make sure that the program is compatible with your operating
    system. Not all partitioning programs are compatible with all operating systems.
    It is important to check the compatibility of the program before using it to repartition
    the disc. You will also need to make sure that the program is up to date and that
    it has the latest version of the necessary drivers and updates.


    Before repartitioning the disc, you need to make sure that the existing operating
    system is backed up. This is because the repartitioning process will destroy the
    existing system and any data on the hard disc. You will need to make sure that
    the backup is complete and that you have a reliable way to restore the system
    in case of any issues. It is also important to test the backup to make sure that
    it is working correctly.


    This is usually done with a program called LinuxPartition. This is accessed as
    the last step in the Linux installation process. There are other partitioning
    programs, such as GParted, that can also be used to repartition the disc. It is
    important to choose the right tool for the job and to make sure that you are using
    the correct version of the tool for your specific needs.'
