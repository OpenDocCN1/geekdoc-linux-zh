    # Graphics card


    The same is true of some graphics cards. There tends to be a lag between a new
    video card being announced and a driver appearing for the card. This has a two-fold
    effect. First, new cards may be slow to get support. Second, old cards, with well-established
    drivers, are slow to get support. For this reason it is important to keep your
    graphics card as up to date as possible. In other words, do not go in for the
    latest and most bleeding-edge graphics card, but instead go for one that is well-established
