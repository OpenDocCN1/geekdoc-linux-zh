  md: '# Perimeter Security, DMZs, Remote Access, and VPNs • Chapter 9 317


    wipes the filesystem and installs a secured version of Linux on the hard disk,
    with the SmoothWall software. The SmoothWall firewall has no GUI on the system,
    only command-line interface and administration via the Web management interface.
    SmoothWall is meant to be a firewall and nothing more.


    With that in mind, there are several advantages to this approach. Foremost, you
    don''t have to learn how to harden your Linux distribution so that it will be
    secure enough to use. Further, unlike installing Linux and learning iptables syntax,
    with SmoothWall you don''t need to know Linux. The installation menu walks you
    through configuring the firewall functionality. You don''t need to know anything
    about Linux to get SmoothWall up and running (though it never hurts). The fact
    that the SmoothWall firewall is already stripped down and unneeded software and
    services are removed means you can get the maximum out of an old computer without
    having to spend a lot of time to tweak a few (normal) Linux distribution.


    # Installing Smoothwall


    The simplest way to install SmoothWall Express is by downloading the .iso image
    from http://smoothwall.org/. It is advisable to read with the manuals located
    at http://smoothwall.org/docs/. The documentation provided with SmoothWall Express
    is exceptional among free products, and all of the installation screens are shown
    in the PDF installation guide. This installation method is as well as walk installing
    SmoothWall Express.


    +   1. After burning this to a CD-ROM, boot the prospective firewall with the
    CD-ROM in the drive.

    2. The boot screen will look typical of many Linux distributions. It will warn
    you that installing SmoothWall Express will delete all data on the hard drive.
    To continue with the installation, press ENTER.

    3. The installation then shifts into a DOS-like GUI interface. Navigation is accomplished
    using the TAB, arrow, and ENTER keys. You will be prompted to insert the installation
    CD and press OK. This is done in your system cannot boot from a CD-ROM and you
    used a boot floppy to begin the installation. Either way, ensure that the CD-ROM
    is (still) in the drive, highlight OK, and press ENTER.

    4. You have to select OK twice before the hard disk is repartitioned and all data
    lost.

    5. When prompted, select Probe to allow the installation routine to see what network
    cards it can detect.


    SmoothWall uses a concept of interface colors to denote their trust level, and
    you will begin seeing them referred to in fashion during the installation process.
