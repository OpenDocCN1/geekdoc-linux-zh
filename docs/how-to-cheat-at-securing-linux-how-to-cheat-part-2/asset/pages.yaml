  md: '# Chapter 1 • Presenting the Business Case for Open Software


    # WARNING


    You should always be careful when cutting consulting budgets. I have seen attempts
    to save money end up costing. In all cases, getting a consultant in quickly is
    the best course of action and the most cost effective in the long run. If you
    find a skilled consultant you like, a monthly retainer might be a good investment.


    # Hidden Costs


    What are all the costs of a free solution? For starters, power consumption. I
    had a Windows 98 system that was only being used as a print server. It occurred
    to me that the PC cost approximately $7 per month in electricity. A dedicated
    print server costing only about $30.00 and using virtually no electricity, I would
    save money within five months by buying the print server. The Pentium II running
    Windows 98 was technically "free," but paying for electricity to keep it running
    was not the most cost effective.


    Another consideration is heating, ventilation, and air conditioning (HVAC) costs.
    HVAC is basically the climate controls. Additional computers create additional
    heat, which costs more money for air conditioning. The same considerations apply
    as for power consumption. If a stand-alone appliance is not an option, the additional
    HVAC requirements are an unavoidable cost; however, in cases where a more effective
    application exists, almost always produce less heat than a normal workstation.
    This also applies to the difference between an older computer and a newer computer.
    New systems that deliver more power and cooling when they are being heavily utilized,
    often incorporate superior energy-characteristics than the other systems.


    There is also the cost of real estate. A decommissioned full-sized tower takes
    up a lot more space than a new appliance the size of a cigar box. You may have
    plenty of room now, but as the server room gets more and crowded, space could
    become an issue. A keyboard, video, and mouse (KVM) switch might save more space
    in than it costs to buy. As the servers become increasingly tightly packed, good
    air flow and adequate cooling will also be inhibited, and physical access to the
    systems for operation or maintenance will also be difficult.


    Ineefficiency is another cost of free solutions with respect to the fact that
    support staff are likely unfamiliar with the new free solutions. When a staff
    member performs a task on


