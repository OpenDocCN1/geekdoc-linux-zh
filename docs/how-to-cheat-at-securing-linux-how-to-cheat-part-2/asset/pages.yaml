    You are now ready to start Snort and see what it looks like in action. When you
    start Snort you can specify the interface to listen on using the -i switch such
    as -eth0. If you don''t specify, it will use the first interface. Use the -c option
    to tell Snort which configuration file to use. It can be useful to have multiple
    configuration files configured so you can quickly switch configurations for special
    circumstances. You could prepare different configuration files to handle certain
    issues, segments, or more in-depth logging. Another important option is -A, which
    tells Snort what type of alerts to generate. The options are fast, console, or
    none.


    The following command would start Snort listening on the first interface (no -i
    used), with alerts going to the console only, using the configuration file at
    /etc/snort/snort.conf. The -l tells Snort where the logging directory is located.
    The -K switch tells Snort what type of logs to generate. ASCII logs are easier
    for a human to read, but they take more time to log. If speed isn''t a concern,
    the ASCII logs will probably be the easiest to read and analyze.


    ```

    snort -A console -c /etc/snort/snort.conf -l /etc/snort/log -K ascii

    ```


    You should see any triggered rules produce a message on the console and logged
    to your syslog server. If you add the -s switch to the end of the line, it will
    tell Snort to log to the syslog server you have configured in the snort.conf file;
    however, it will not only display on the snort console. If you want to create
    a rule for testing purposes to see what the results look like, create a test rule,
    such as TESTING.rule, and place it in the rules (/etc/snort/rules, in this example).
    In this file you could place the following line, which would triger on any attempts
    to ping another system.


    ```

    alert icmp any -> any any (msg":"TEST rule:")

    ```


    Edit the code for your new rule by inserting the following statement towards the
    end of the file: include $RULE_PATH/TESTING.rules . As a last step, edit the snort.conf:sid-map
    file. This file provides a mapping between snort alert messages and alert IDs
    or numbers. Custom alerts should use an ID number of more than one million. Add
    the following line at the end of the file:


    ```

