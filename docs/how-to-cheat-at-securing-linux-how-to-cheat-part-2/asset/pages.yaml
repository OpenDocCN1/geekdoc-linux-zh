  md: '# Chapter 7 • Network Analysis, Troubleshooting, and Packet Sniffing


    becoming a non-negative term; most people use the terms sniffing and network analysis
    interchangeably.


    Using a sniffer in an illegitimate way is considered a passive attack, because
    it does not directly interface or connect to any other systems on the network.
    A sniffer can also be installed as part of the compromise of a computer on a network
    using an active attack. The passive nature of sniffers is what makes detecting
    them difficult (The methods used to detect sniffers are detailed later in this
    chapter.)


    Intruders use sniffers on networks for:


    +   - Capturing cleartext usernames and passwords

    - Discovering the usage patterns of the users on a network

    - Compromising proprietary information

    - Capturing and replaying Voice over IP (VoIP) telephone conversations

    - Mapping the layout of a network

    - OS fingerprinting


    The above are all illegal uses of a sniffer unless you are a penetration tester
    whose job is to find and report these types of weaknesses.


    For sniffing to occur, an intruder must first gain access to the communication
    cable of the systems of interest, which means being on the same shared network
    segment or tapping into the cable somewhere between the communication path. If
    the intruder is not physically present at the target system or communications
    access point (AP), there are still ways to sniff network traffic, including:


    +   - Breaking into a target computer and installing remotely controlled sniffing
    software.

    - Breaking into a communications AP (e.g., an Internet Service Provider [ISP])
    and installing sniffing software.

    - Locating a system at the ISP that already has sniffing software installed.

    - Using social engineering to gain physical access to an ISP in order to install
    a packet sniffer.

    - Having an inside accomplice at the target computer organization or the ISP install
    sniffer.

    - Redirecting or copying communications to take a path that includes the intruder’s
    computer.


    Sniffing programs are included with most rootkits that are typically on compromised
    systems. Rootkits are used to cover the tracks of an intruder by replacing commands'
