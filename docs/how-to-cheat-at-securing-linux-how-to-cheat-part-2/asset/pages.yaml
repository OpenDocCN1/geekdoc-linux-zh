- img_proc: true
  md: 'Because sudo logs all commands run as root (or specified otherwise), many administrators
    use instead of using the root shell. This allows them to log their own commands
    for troubleshooting and additional security.


    The ticketing system is ideal if the root walks away from the system while still
    logged in (a very bad idea), another user cannot access the system simply because
    he or she has physical access to the keyboard.


    After the ticket expires, users must log on to the system again. A shorter time
    is recommended, as the default five minutes. The ticketing system also allows
    users to remove their ticket file.


    # System Requirements


    To install and run sudo from the source distribution, you must have a system running
    Unix. Almost all versions of POSIX, BSD, and SYSV You must also install the C
    compiler and the make utility.


    Sudo is known to run on the following Unix flags: Auspec, SunOS, Solaris, ISC,
    RISCOS, SCO, HP-UX, Ulrix, IRIX, NEXTSTEP, DEC Unix, AIX, ConvexOS, BSD/OS, OpenBSD,
    Linux, UnixWare, Pyramid, ATTIT, SINIX, ReliantUnix, Unicos, DG/UX, Dynx/ptx,
    DC-OS, HI-UX/MPP, SVR4, and NonStop-UX. It also runs on macOS Server.


    # The Sudo Command


    The sudo command allows a user to execute a command as a superuser or another
    user. All configurations for sudo are written to /etc/sudoers file. The sudoers
    file specifies whether that command is allowed by that particular user.


    In order to use sudo, the user must have already supplied a username and password.
    If a user attempts to run the command via sudo and user is not in the sudoers
    file, an e-mail is automatically sent to the administrator, indicating that an
    unauthorized user is accessing the system.


    Once a user logs in sudo, a ticket is issued that is valid by default for five
    minutes. A user can update the ticket by issuing the -v flag, which will validate
    the ticket for another five minutes. The command is as follows:


    ```

    sudo -v

    ```


    If an unauthorized user runs the -v flag, an e-mail will be sent to the administrator.
    The -v flag informs the unauthorized user that he or she is not a valid user.
    If the user enters command via sudo anyway, an e-mail will be sent to them.


    Sudo logs login attempts, successful and unsuccessful, to the syslog(3) file by
    default. However this can be changed by sudo configuration. Some of the command-line
    options listed in Table 2.7 are used by sudo.'
