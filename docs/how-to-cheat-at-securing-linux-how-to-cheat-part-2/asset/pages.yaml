  md: '# Introduction


    The general concepts behind hardening a Linux host are no different than they
    are for any other OS.You still need to minimize the installed software, update
    and patch the OS, and tighten the security settings. It is only the specific methods
    for accomplishing these tasks that vary with a Linux-based host over a Windows-based
    one. The basic approach to hardening any bastion host (whether Linux, Unix, Windows,
    or other) can be summarized in the following high-level steps:


    +   1. Planning before doing.

    2. Remember the bastion host''s role during all stages.

    3. Leave only the minimum components on the system to get the job done.

    4. Take what''s left and make it as secure as possible, avoiding default settings
    where practical.


    In ways, securing Linux to serve as a bastion host can be harder than if you were
    using a Microsoft product, because there are so many options. If you are not comfortable
    with the landscape, the task of sorting out what tool and configuration to use
    seem daunting. On the flip side, this weakness—Linux’s extreme flexibility—is
    also your main strength. Those same bewildering number of options provide you
    with near-infinite flexibility in how you accomplish your objectives. In this
    chapter we walk through the steps for hardening a Linux computer and preparing
    it to serve in the role of bastion host. We cover the specific steps you need
    to take and contrast those with the same steps you would use on a Windows system.
    It is assumed that the reader has or is at least familiar with the chapter on
    Windows bastion hosts and that the reader has at least moderate understanding
    of and experience using Linux.


    # System Installation


    With various flavors of Linux becoming popular, deciding to use Linux as the OS
    for your bastion host has never been easier than it is today. The Internet is
    overflowing with helpful articles and Web sites to help you guide setting up a
    Linux system. Many vendors are offering brand-new systems with Linux already installed.
    Distributions of Linux are specially configured to be user friendly and help you
    learn the ins and outs of Linux. We will go through the steps of hardening your
    Linux system on the assumption that you are installing from scratch. If it is
    preinstalled on your system, you will need to evaluate whether starting over with
    a clean install with settings you choose is worth the effort. If you inherited
    the system, starting over might not be an option, but many of these procedures
    can still serve as good guidelines for how you can lock down your newly inherited
    system.


    ![](img/33fc180c04c8f96c022bce6e62ae12fd_358_0.png)'
  merge: -1
  pgno: 358
- img_proc: true
  md: '# Disk Partitions


    Linux has some specific requirements for disk partitions. All the applications
    that could be running at any given time require a considerable amount of RAM to
    run. Typically, more memory is required than the machine has physically installed.
    Fortunately, operating systems have a technique to make it appear that more memory
    is present using swap space. This swap space is presented to the application as
    though it were RAM. In Windows, the swap space is in the form of a swap file,
    which by default is located on the same partition as the system partition. Linux,
    on the other hand, expects the swap to be on a separate physical partition. This
    swap partition actually gets formatted specifically as a Linux swap partition,
    not as a standard file system. Linux distributions allow you to use a normal file
    for swap space, like Windows, but using a separate swap partition provides some
    significant performance increases and increased stability.


    The amount of swap space that needed will vary based on the programs that are
    loaded and using. When use a swap file, this means the size of the file will need
    to change regularly, causing increased reads and writes to the disk, above and
    beyond what is needed to manage the program data, simply to manage the swap file.
    By contrast, if you have a separate swap partition, there is no disk activity
    to manage the swap file, only the activity required by the programs using the
    swap space. Stability can be enhanced using a separate swap partition as well.
    If the partition containing your swap fills up with data, it can prevent the swap
    file from growing and providing the needed swap space for a newly loaded program.
    A dedicated partition for the swap space provides the desired isolation from user
    data and ensures that the swap space will be available.


    # Choosing a Linux Version


    Because there are so many versions of Linux available, you have a lot of choices
    here. The different versions may have some of the same core components, but offer
    different sets of software packages, with an emphasis on a particular type of
    functionality, as security testing, general office productivity, or sometimes
    software development platforms. These variations are called distributions. A good
    source of information on the various distributions is www.distrowatch.com. This
    site includes a brief summary of what the distribution is trying to accomplish
    and includes links to the homepages and download locations. You can, of course,
    do a Google search to find a distribution that does exactly what you are looking
    for. For a locally installed feeling, Fedora core (which we examine in the examples
    in this chapter) provides a lot of features and has extensive support documentation.
    If you just want to dabble, a live CD, such as SLAX, is a very user-friendly way
    to get your feet wet with Linux.


    ![](img/33fc180c04c8f96c022bce6e62ae12fd_359_0.png)'
  merge: -1
  pgno: 359
- img_proc: true
  md: '# Choosing Distribution Media


    You can find distributions that are capable of running off a CD-ROM, full installs
    to the systems hard disk, and distributions that can run off a USB drive or even
    a floppy disk. Each media type offers some security pros and cons, and not every
    distribution is available on every media type. If you need the features of a specific
    distribution that doesn''t come on the media you prefer, you might need to make
    a compromise. Decisions of media type and distribution selection will be made
    concurrently unless you have very specific requirements. You will need to research
    the media options and choose one that fits your environment; we will review some
    of the pros and cons of each type in the following sections.


    # Full Installs


    With the traditional install to the systems hard disk, like Windows, you will
    boot up an installation CD and walk through a guided install process. Although
    it wasn''t always the case, most of the distributions that are intended to be
    installed to the hard disk offer install programs that are pretty easy to get
    through. There is no great advantage to using this type of distribution other
    than the size of the hard disk will allow you to install a lot of extra software.
    In a DMV on a bastion host, this isn''t necessarily desirable, and in many cases
    one of the smaller, more streamlined distributions would be more appropriate.


    On the down side, this type of install will have all the disadvantages of a Windows
    bastion host—the entire system is sitting on the hard drive, and if an attacker
    manages to compromise the root account, he will be able to install a virus or
    Trojan on the system that can survive reboots, in addition to tampering with the
    contents of what is running in memory. Typically, if you discover that your bastion
    host has been compromised, unless you have some means of ensuring that the contents
    of the hard disk have not been tampered with, you must reinstall the entire system
    from scratch to guarantee the system''s integrity. This type of install isn''t
    really better or worse than if you are using Windows for your bastion host operating
    system.


    # CD-ROMs


    There are many versions of Linux designed specifically to run from a CD-ROM, allowing
    you to turn any machine into a firewall, router, or general-purpose PC. There
    is an obvious advantage to having all your configuration information on read-only
    media. If a hacker manages to compromise the system, all it takes a reboot and
    your configuration can be restored to its previous condition. The system can still
    fall victim to a virus or Trojan but until it is rebooted. Further, if there is
    a hardware failure, restoring the system is not as difficult as moving the CD
    to a new system and rebooting.


    This same advantage also serves as a disadvantage. If you burn the OS and configuration
    settings to a CD, any time you need to make any adjustment you would need to burn
    and load a new CD-ROM disk. The cost of the media probably isn''t an issue,


    ![](img/33fc180c04c8f96c022bce6e62ae12fd_360_0.png)'
  merge: -1
  pgno: 360
- img_proc: true
  md: '# Linux Bastion Hosts • Chapter 10


    because CD-ROMs are inexpensive, but such a configuration could hinder your ability
    to remotely administer the system. You would only be able to remotely make changes
    to the running configuration, changes that remain after a reboot would require
    someone local to burn and swap the CDs. If you implemented and test changes that
    required a reboot before they take effect, this type of setup would make a little
    more difficult. Finally, due to simple space limitations on a CD-ROM, you might
    not be able to fit all the needed software or functionality on a CD. All that
    said, the role of your bastion host allows the configuration and data to be relatively
    static, a live CD could be a very attractive option.


    # USB Drives


    A Linux bastion host booting from a USB disk could offer the best compromise in
    security and flexibility. If you purchase a USB disk that includes a physical
    write-protect switch, you can make changes on the fly, as a live system, and then
    write-protect the disk against modification when you are done. The storage capacity
    of USB drives increases, you will be able to use a USB-based distribution that
    includes increasingly greater functionality. Whether you get the micro hard version
    or the solid-state USB disk, either will be more reliable than a diskette while
    offering the same benefit of allowing you to toggle the write-protect feature.


    # Diskettes


    Although they probably won''t be able to provide the functionality you are looking
    for in a Linux bastion host, many versions of Linux can fit on a 3.5-inch diskette.
    The primary advantage of these distributions is their very low resource requirements.
    These often require 8MB or 16MB of memory to function. The ability to toggle the
    write-protect switch can also provide a high degree of flexibility and security.
    Considering the unreliable nature of diskettes, they probably would not be appropriate
    for any critical roles, though. Another disadvantage to diskettes is simply functionality.
    Whereas they can act as a simple router or firewall, they would likely much in
    the way of features. Generally, these diskette-based distributions are single-purpose
    devices. Due to the space restrictions and small footprint, diskette-based distributions
    are almost always command line only, with no GUI for configuration or management.


    # Choosing a Specific Distribution


    In conjunction with choosing the media to be used, you will need to choose the
    exact Linux distribution you want to employ. This decision can include a host
    of factors such as included features, personal preference, availability of documentation
    and support, and availability of technical support. Some distributions are known
    for being more beginner friendly or for supporting better security controls. One
    of the key differentiators for selecting


    ![](img/33fc180c04c8f96c022bce6e62ae12fd_361_0.png)'
