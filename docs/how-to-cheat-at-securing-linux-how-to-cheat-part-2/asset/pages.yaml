    # IKE-scan: VPN Assessment


    Different of the more common VPN implementations involve different uses of IPsec
    tunnels. Different manufacturers have different usages which can be discovered
    and fingerprinted by IKE-scan. IKE stands for Internet Key Exchange, and is used
    to provide a secure basis for establishing an IPsecsecured tunnel. IKE-scan can
    run in two different modes, Main (-M) and Aggressive (-A), each of which can identify
    different VPN implementations. Both operate under the principle that a client
    sends the initial portion of an IPsec handshake. An initial IKE packet is sent
    (with Aggressive mode, a UserID is also specified), and based on the time elapsed
    and types of responses, the VPN server can be identified based on service fingerprints.
    In addition to the VPN fingerprinting functionality, IKE-scan includes psk-crack,-


