    researchers.


    The RSA algorithm shares many similarities with the Diffie-Hellman algorithm in
    that RSA is also based on multiplying and factoring large integers. However, RSA
    is significantly faster than Diffie-Hellman, leading to a split in the asymmetric
    cryptography field that refers to Diffie-Hellman and similar algorithms as Public
    Key Distribution Systems (PKDS), and RSA and similar algorithms as Public Key
    Encryption (PKE). PKDS systems are used as session-key exchange mechanisms, while
    PKE systems are considered fast enough to encrypt small messages. However, PKE
    systems like RSA are not considered fast enough to encrypt large amounts of data
    such as file systems or high-speed communications lines.


