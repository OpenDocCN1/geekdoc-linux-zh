    # Permitting Traffic to and from the Firewall


    Now that you have a clean slate and a default policy of DENY, the first thing
    you want to do is make sure that management traffic is permitted to the firewall
    itself. This is done first, because once you have enabled the firewall with a
    default policy of DENY, you will not be able to manage the firewall remotely unless
    you have configured the firewall rules to permit the management traffic. This
    traffic is processed against the INPUT chain, because the destination is the netfilter
    host. To allow secure (SSH) connections to the firewall, use the following command:


    ```

    iptables -A INPUT -p tcp -s 192.168.99.0/24 --dport 22 -j ACCEPT

    ```


    In this example, you are appending (-A) a rule to the INPUT chain to allow traffic
    from the 192.168.99.0/24 network to a destination port of TCP 22. With no other
    configuration, all other traffic through or to the firewall would be dropped.
    This will show up in the rule list as follows:


    ```

