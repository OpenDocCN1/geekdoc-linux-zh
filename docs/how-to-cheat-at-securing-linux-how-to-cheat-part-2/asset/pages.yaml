  md: '# Chapter 4 • Introducing Intrusion Detection and Snort


    Snort might not pick up all packets because of the speed of the network and the
    speed of the promiscuous interface. Snort’s performance can also depend on the
    network stack implementation of the operating system. Ensure that your underlying
    infrastructure is as high as end to support your Snort deployment. In addition,
    to ensure optimal performance, it’s a good idea to rip some known attacks against
    the network segment that Snort is monitoring and ensure that it catches everything
    that it should. Problems with dropped packets can lead to particular confusion
    with stream and flow reassembly as well as missing critical network data.


    # False Alerts


    False positives are when Snort gives you a warning when it shouldn’t. Basically,
    a false positive is a false alarm. If you go with a default ruleset with Snort,
    then you will definitely get many false alarms. Why do IDSes behave this way?
    Well, it’s better to get alerts and whistle them down turning than is to miss
    data that might have been a critical attack. A new Snort installation can trigger
    a lot of alerts until you decide what is relevant to your network. The more open
    your network, the more alerts you will want to monitor.


    On the opposite side, you can get false negatives. In other words, someone compromises
    a Snort-monitored system and your Snort system doesn’t detect it. You might think
    that this doesn’t happen, but when you get an e-mail from another system administrator
    describing a suspicious activity and your Snort system didn’t pick it up, this
    is a very real scenario, and it usually happens with out-of-date rulesets or brand-new
    attacks for which signatures have not yet been written. Make sure you keep your
    Snort rules up-to-date.


    # Upgrading Snort


    Upgrading Snort can be quite painful for two reasons: the ruleset syntax may change,
    and the interface to the logs may change. We have found that both to be obstacles
    when trying to upgrade Snort systems, and that can be quite a pain to deal with,
    particularly when you didn’t want to do a forklift upgrade. If Snort changes its
    architecture to increase performance (as happened with the Snort 2.0 upgrade),
    you may experience a painful upgrade to any custom rulesets or alert interfaces
    in now-deprecated syntax and interfaces.


    In addition, there are administrative foils that may be encountered while creating
    rules, while reading logs, and while analyzing logs. When writing your own rules,
    make sure they do what you think they’re going to do, and test them to make sure
    that they alert when you’re supposed to. Rule syntax is sometimes tricky, and
    all it takes is one misplaced PCRE expression to cause either a lot of false positives
    or a whole lot of nothing. Having the rule in place won’t help you if the rule
    is incorrectly written. Similar attention should be paid when reading and analyzing
    logs—make sure that your security analysts understand the network and its context
    to be able to accurately identify when is a false positive rather than a problem,
    and vice versa. We’ve seen'
  merge: -1
