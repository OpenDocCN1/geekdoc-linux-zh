  md: '# Introduction


    You have seen in previous chapters how the open source community has created powerful
    sniffing tools. You have seen how they can be used to administer your network
    or to attack it. Because these sniffing tools are open source, and because it
    is relatively easy to place a Linux host on your company network, you need to
    consider ways to minimize improper use of packet capturing tools. Encryption solutions,
    such as Secure Shell (SSH) and Kerberos, are common solutions to this problem.


    Algorithms are the underlying foundation of cryptography; therefore, this chapter
    looks at the basics of algorithms, covering symmetric and asymmetric encryption
    and hashing concepts. This chapter then discusses the concepts of cryptography.


    For as long as people have been writing down information, there has been the need
    to keep information secret, either by hiding it or changing its meaning. The study
    of these methods is the science of cryptography. Encryption, a type of cryptography,
    refers to the process of scrambling information so that the casual observer cannot
    read it. What are algorithms and keys? An algorithm is a set of instructions for
    mixing and rearranging an original message, called plaintext, with a key to create
    a scrambled message, referred to as ciphertext. Similarly, a cryptographic key
    is a piece of data to encrypt plaintext to ciphertext, and ciphertext to plaintext,
    or both (depending on the type of encryption).


    What does the word crypto mean? It has roots in the Greek word knotos, which means
    hidden. Thus, the objective of cryptography is to hide information so that only
    the intended recipient(s) can read it. In crypto, the hiding of information is
    called encryption, and when information becomes readable, it is called decryption.
    A cipher is used to accomplish the encryption and decryption. Merriam-Webster''s
    Collegiate Dictionary defines cipher "a method of transforming a text in order
    to conceal its meaning." The information that is being hidden is called plaintext;
    once it has been encrypted, it is called ciphertext. The ciphertext is transported,
    from prying eyes, to the intended recipient(s), where it is decrypted back into
    plaintext.


    Finally, there are two different subclasses of algorithms: block ciphers and stream
    ciphers. Block ciphers work on blocks or chunks of text in a series. Just as a
    paragraph is composed of many sentences, plaintext is composed of many blocks,
    which are typically variable lengths of bits. In contrast, a stream cipher operates
    on each individual unit (either letters or bits) of a message.


    # Algorithms


    Why are there so many algorithms? Why doesn''t the world standardize on one algorithm?
    Given the large number of algorithms found in the field today, these are valid
    questions with no answers. At the most basic level, it''s a classic case of tradeoffs
    between security, speed, and cost of implementation. Here, security indicates
    the likelihood of an algorithm to


