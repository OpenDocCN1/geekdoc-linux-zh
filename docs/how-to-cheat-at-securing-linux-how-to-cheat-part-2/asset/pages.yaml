  md: '# Chapter 10 • Linux Bastion Hosts


    NOTE


    Different services are handled differently with respect to the time at which your
    changes take effect. When changes are made to services managed through xinetd,
    xinetd is immediately restarted; thus your changes will take effect immediately.
    When the service is not managed by xinetd, the same is not true. In those cases
    you will need to stop the service manually, go to a command prompt, type telinit
    <runlevel> and press Enter to reinitialize the run level, or simply reboot.


    If you are administering the bastion host without access to a GUI front end, you
    will need to control daemons via the startup scripts. It''s also a good idea to
    know how to control the daemons without the GUI the GUI interface will vary from
    system. The methods for startup scripts can also vary from one distribution to
    another. The startup services in Fedora Core are managed by startup scripts located
    in /etc/rc/init.d/. All you need to do is comment out the line that calls the
    specific script by inserting a # at the front of the line calls it. You can also
    edit the scripts themselves for control of the ways they are initialized. The
    preferred way on Fedora Core is to use the chkconfig utility, which can be found
    in many distributions. You must be logged in root to use this utility. Abbreviated
    output of chkconfig list is shown in Figure 14.2.


