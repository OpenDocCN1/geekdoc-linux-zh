  md: '# Presenting a Proposal


    If you do not have the luxury of implementing something and asking for “approval,”
    you will need to create a proposal with all of the relevant information. You can
    certainly do both, including the sample data from the utility in the proposal.
    The truth is, “presenting a proposal” sounds very formal, and it can be, but it
    doesn''t have to be. Some organizations have much more formal procedures in places
    than others. Presenting your proposal may be structured using a standardized template
    with forms to fill out and submit, and meetings with PowerPoint presentations.
    It could also as easily talking with your manager over lunch and telling him what
    you would like to do.


    Regardless of the format you employ for your proposal, there are certain elements
    you want to touch upon, verbally or on paper. If you address all these issues
    accurately as possible, the odds of your venture being a success should be greatly
    improved. At a minimum, try and have information and answers covering the areas
    concerning your proposed solution;


    +   - What will it take? How much will it cost? How long will it take to implement?
    How much training will be required and of what type? How much will the training
    cost, and how long will it take? What hardware might be needed and what will it
    cost? Will it impact the user experience? If so, how?

    - What will it do? What are the real capabilities, not just sales hype? Sampling
    actual samples from your environment, or if you can find something online, would
    go a long way here. Hard data is better than a sales blurb. What are the technical
    limitations?

    - Assumptions What other factors must be in place for this to work as planned?
    Will you need assistance with the implementation? Will an outside consultant be
    needed?

    - Caveats What are the drawbacks? What makes your solution less attractive? What
    are potential problems that might arise?'
