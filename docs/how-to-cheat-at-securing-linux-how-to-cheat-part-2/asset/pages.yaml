    # User Directives


    There are a couple directives you must configure in the httpd.conf file to ensure
    that the Apache Web server runs under the unprivileged user account we established
    earlier, among other things. Inspect your httpd.conf file to verify that the following
    statements appear as shown in the following. Recall that we decided to run Apache
    as wwwuser:wwwgrp.


    ```

    User wwwuser

    Group wwwgrp

    ```


