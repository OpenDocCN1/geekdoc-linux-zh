    Apache-SSL and use digital certificates for client-side authentication. This helps
    keep the obvious people out of your system through the usual compromisable channels


    +   - Patch, patch, patch We cannot stress this enough. Make sure you keep your
    patches and packages up-to-date as much as possible. Stay on top of applications
    you use and their security announcements—the same goes for any operating system
    you use. For FreeBSD/NetBSD/OpenBSD, make sure you keep your ports and packages
