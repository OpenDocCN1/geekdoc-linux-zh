  md: '# How Scanning Works


    The list of potential targets from the footprinting phase can be expansive. To
    streamline the scanning process, it makes sense to first determine if the systems
    are up and responsive. Several methods can be used to test a TCP/IP-connected
    system''s availability, but the most common techniques use Internet Control Message
    Protocol (ICMP) packets.


    Chances are if you have done any type of network troubleshooting, you will recognize
    this as the protocol that ping uses. The ICMP echo request packet is a basic one
    that according to Request for Comments (RFC) 1122 host needs to implement and
    respond to. In reality, many networks, internally and externally, block ICMP echo
    requests to defend against the earliest DoS attack, the ping flood. They may also
    block it to prevent scanning from the outside.


    If ICMP packets are blocked, TCP ACK packets can also be used. This is referred
    to as a “TCP ping.” RFC 1122 states unsolicited ACK packets should return a TCP
    RST. Therefore, sending this type of packet to a port that is allowed through
    a firewall, as port 80, the target should respond with an RST indicating that
    the target is active.


    When you combine ICMP or TCP ping methods to check for active targets in a range,
    you perform a “ping sweep.” Such a sweep should be denied and captured to a log
    file that specifies active machines that you can layer input into a scanner. Most
    scanner tools will accept a carry range delimited file of IP addresses.


    # Port Scanning


    Although there are many port scanners, they all operate in much the same way.
    There are a few basic types of TCP port scans, the most common of which is a SYN
    scan (“or SYN scan”), named for the TCP SYN flag, which appears in the TCP connection
    sequence or “handshake.” This type of scan begins by sending a SYN packet to a
    destination port. The target receives the SYN packet, responding with a SYN/ACK
    response if the port is open, or an RST if the port is closed. This is a typical
    behavior of most scans; a packet is sent, the target is analyzed, and a determination
    is made about the state of the system or port. SYN scans are relatively fast,
    and relatively stealthy, made since a full handshake does not occur. Since the
    TCP handshake did not complete, the service on the target does not see a connection,
    and does not get a chance.


    Other types of port scans may be used for specific situations, which we will discuss
    later in the chapter, will be port scans with various TCP flags, such as FIN,
    PUSH, and URG. Different systems respond differently to these ports, so there
    is an element of OS detection when using these flags, but the primary purpose
    is to bypass access controls that specifically key on connections initiated with
    TCP flags set. Table 3.1 is a summary of the different nmap options, along with
    the scans initiated and expected response.


    ![](img/33fc180c04c8f96c022bce6e62ae12fd_110_0.png)'
