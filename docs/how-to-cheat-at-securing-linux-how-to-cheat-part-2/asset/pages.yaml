    \n# # Plug-Ins\n\nPlug-ins are software modules that enable you to have custom\
    \ functions that can run on the packets that are captured and decoded. To learn\
    \ how to apply plug-ins, you first need to understand the overall data flow within\
    \ Snort. When a packet is captured by Snort, it gets decoded and then passed to\
    \ higher modules. When Snort is run in Inline mode (for Linux), the capture engine\
    \ is iptables instead.\n\nThe packets are next sent to the preprocessor module,\
    \ the detection engine, and the output module. Each of these three modules can\
    \ be supplemented with your own module plug-ins.\n\n> NOTE\nBefore Snort Version\
    \ 2.6, you had to compile your plug-in directly into your Snort executable. With\
    \ previous versions of Snort, in order to add a plug-in to your system, you had\
    \ to rebuild the Snort binary, stop the old instance, install the new binary,\
    \ and then start it. With Version 2.6, however, you can have dynamic plug-ins\
    \ (if Snort was compiled with the --enable-dynamic-plug-in option set). With a\
    \ dynamic plug-in, you build your plug-in, install it to the proper location on\
    \ the file system, modify the configuration file (or the command line that you\
    \ use), and then restart Snort. The API for the original static plug-ins and the\
    \ dynamic plug-ins are slightly different. We focus here on the dynamic plug-ins.\n\
    \n# # Preprocessor Plug-Ins\n\nPreprocessor plug-ins are analysis modules that\
    \ run after the packet has been captured and decoded. These plug-ins run on every\
    \ packet that is received; the snort rules do not have any influence on them.\
    \ These preprocessors can be used for various purposes, but they are\n\n![](img/33fc180c04c8f96c022bce6e62ae12fd_204_0.png)"
