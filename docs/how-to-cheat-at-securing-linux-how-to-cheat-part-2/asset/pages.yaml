  md: '# Summary


    In this chapter, we examined a multitude of methods to secure your network perimeter
    and provide you, as the administrator, the access that is needed to administer
    the network.The Linux built-in firewall filter was covered extensively due to
    it''s power and flexibility, not to mention availability, as a stateful firewall.
    In addition to iptables, we looked at several GUI fronts that allow you to manage
    the network firewall without knowing the iptables command line syntax. The next
    step was to establish a secure doorway, so that you could sit at home and take
    care of network. With command-line access via SSH, and Windows Terminal Services
    offering a remote desktop, FreeNX rounded the outlying by offering multiple remote
    desktop sessions from the same server.


    Armed with this knowledge, there is no excuse to not have type of firewall for
    protection on any and all unsecured connections. I say unsecured, not Internet
    intentionally, any business partner, home user network, or the Internet are all
    considered untrusted, meaning you have no or incomplete administrative control
    over the security of the network you are connected to. Ultimately, you have no
    way to guarantee or enforce proper security controls of an untrusted network.
    The fact is, if you have an Internet connection and don''t have any type of firewall
    between a computer and the Internet, odds are very high that you have already
    been compromised. For other types of untrusted connections your odds may be better,
    but you''re still gambling if you don''t take steps to protect your network and
    systems.


    # Solutions Fast Track


    # Firewall Types


    +   - In the networking sense, a firewall is basically any component (software
    or hardware) that restricts the flow of network traffic.

    - Some firewalls are notoriously limited in capability, and others are extremely
    limited to use.

    - To permit or deny traffic based on which network device is the sender or recipient
    and what ports are being used, you would use a packet-filtering firewall!


    # Firewall Architectures


    +   - The most securely configured firewall in existence will not provide much
    protection if the underlying network was not designed properly.'
  merge: -1
  pgno: 354
- img_proc: true
  md: '# Perimeter Security, DMZs, Remote Access, and VPNs • Chapter 9


    +   - A screened subnet is the simplest and most common firewall implementation.
    Most small businesses and homes use this type of firewall


    +   - The one-legged demilitarized zone (DMZ) still has the advantage of cost,
    because you are building a DMZ using only a single firewall.


    +   - The true DMZ is generally considered the most secure of firewall architectures.
    With this design, there is an external and internal firewall. Between the two
    is sandwiched any Internet accessible devices.


    # Implementing Firewalls


    +   - netfilter is the built-in component that performs the firewall logic. iptables
    is the command-line interface used to configure the netfilter ACLs.


    +   - Many GUI interfaces exist with widely varying degrees of functionality and
    complexity. My suggestion here is to choose the simplest one that will do what
    you need to do. In all likelihood the “right” one will change for you over time.


    +   - SmoothWall sits in a class of its own, due to the fact that it turns a PC
    into a dedicated firewall appliance that is completely configurable without ever
    logging into the underlying Linux operating system.'
