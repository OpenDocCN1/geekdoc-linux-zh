    If you want to be extremely stealthy in your initial scan and enumeration processes,
    and don''t get high-level results for OS fingerprinting, pof is the tool for you.
    It works by analyzing the responses from your innocuous queries, such as Web traffic,
    ping replies, or normal operations. pof gives the best estimation on an operating
    system based on those replies, so it may not be as precise as other tools, but
    it can give you a good starting point. In Figure 3.12, pof is used to check the
    version of a Fedora server, and a Linksys Wireless router, as Linux. In this example,
    pof runs in the background with an open Web browser to a Linkys access point''s
    Web administration page, as well as a TorrentFlux (PHP-based BitTorrent client)
    login page. Both were detected as Linux, only correct in one case, as the Linkys
    AP is not a model based on Linux.


