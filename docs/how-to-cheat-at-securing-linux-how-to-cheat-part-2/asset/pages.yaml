  md: "# Advancned Snort Deployment • Chapter 6 195\n\n#include \"preprocessors/spp_example.h\"\
    \n\nNext, you need to add an invocation of a registration function, ExampleSetup(),\
    \ to the list of similar functions call in the InitPreprocessors().\n\nFinally,\
    \ you need to edit the Makefile in the preprocessors source file so that your\
    \ new preprocessor source file is in the list of preprocessor files.\n\nThen,\
    \ of course, you need to recompile Snort and install the new binary. Clearly,\
    \ this is a lot of work; however, the motivation to develop a technique for loading\
    \ plug-ins dynamically. Currently, the choice of approaches is available only\
    \ for preprocessor plug-ins.\n\n# Detection Plug-Ins\n\nDetection plug-ins are\
    \ modules that are run during the detection phase of processing the capture network\
    \ packet. These rules do depend on the rulesets, or more accurately, they influence\
    \ the rulesets. The installed detection plug-ins include ones for handling all\
    \ the special rules, such as react, and ones to handle various network packet\
    \ header values, including the TTL, or comparing the stated data size with the\
    \ actual data size. The Snort documentation and source code do not provide sample\
    \ detection plug-ins, so to write one, you need to read the source code for the\
    \ standard ones.\n\nIn this section we will show the essential elements of a detection\
    \ plug-in, using sp_td_check as a model. The registration function looks as follows:\n\
    \n```\nvoid TtlCheckIn(char* OptTreeNode *, int);\n```\n\n```\nvoid SetupTtlCheck(void)\n\
    {\n  RegisterPlugin(\"ttl\", TtlCheckIn);\n}\n```\n\nThis function is similar\
    \ to what we have seen before, but the important difference is that it lets Snort\
    \ know that there is a rules keyword ttl. In addition, the function TtlCheckIn()\
    \ will be invoked to parse the options for this keyword for each instance of the\
    \ rules that it use. The TdlCheck() function will parse the options for the keyword\
    \ and register function to call for each. In the actual implementation of the\
    \ TTL check module, a lot of support code is not relevant to this discussion,\
    \ but the important thing to remember is that the invocation of TtlCheckIn() ultimately\
    \ leads to each valid option for the keyword registering itself to the list of\
    \ options that Snort is to understand,\n\nAddOptToList( CheckTtlGT, on);\n\nwhere\
    \ the first parameter is the name of a function to call (in this case when the\
    \ TTL keyword is passed a '>' parameter) and the second parameter is the OptTreeNode\
    \ parameter that gets passed to TtlCheckIn().\n\n![](img/33fc180c04c8f96c022bce6e62ae12fd_211_0.png)"
