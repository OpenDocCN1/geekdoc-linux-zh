    # Exploring Snort''s Features


    In the Introduction, we provided you with a brief overview of Snort''s most important
    features that make it very powerful: packet sniffing, packet logging, and intrusion
    detection. Before learning the details of Snort''s features, you should understand
    Snort''s architecture. Snort has several important components such as preprocessors
    and alert plug-ins, of which can be further customized with plug-ins for your
    particular Snort implementation. These components enable Snort to manipulate a
    packet to make the contents more manageable by the detection engine and the alert
    system. Once the packet has been passed through the detection engine, and then
    sent through the alert system, it can be handled by whatever plug-ins you have
    chosen to handle alerting. It sounds complicated initially, but once you understand
