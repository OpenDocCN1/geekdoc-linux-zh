    # Detection Engine


    Once packets have been handled by all enabled preprocessors, they are handed off
    to the detection engine. The detection engine is the meat of the signature-based
    IDS in Snort. The detection engine takes the data that comes from the preprocessor
    and its plug-ins, and that data is checked through a set of rules. If the rules
    match the data in the packet, they are sent to the alert processor.


    Earlier in this chapter, we described Snort as a signature-based IDS. The signature-based
    IDS function is accomplished by using various rulesets. The rulesets are grouped
    by category (Trojan horses, buffer overflows, access to various applications)
    and are updated regularly. The rules themselves consist of two parts:


    +   **The rule header** The rule header is basically the action to take (log or
    alert), type of network packet (TCP, UDP, ICMP, and so forth), source and destination
    IP addresses, and ports


    +   **The rule option** The option is the content in the packet that should make
    the packet match the rule.


