    # Simulating the Windows Firewall


    Now let''s configure the firewall. The built-in firewall on Windows XP is enabled
    by

    default with service pack 2 or better. The standard configuration is to allow
    outbound

    connections from the host system, and deny inbound connections unless they are
    explicit-\figured. The Windows firewall allows any traffic that is a reply to
    traffic that

    host originally generated output. After you execute the iptables -F command to

    flush out all of the previously configured rules, the following commands would
    configure

    t Linux host similarly:


    ```

    iptables -P OUTPUT ACCEPT

    iptables -P INPUT DROP

    iptables -P FORWARD DROP

    iptables -A INPUT --m state ESTABLISHED,RELATED -j ACCEPT

    ```


    The state extensions track the current status of the connections. By specifying

    ESTABLISHED or RELATED, the firewall allows packets that are part of a estab-

    lished session, or packets that are starting a new session, but where the session
    is related to

    existing session (such as an FTP data session). If you were hosting a service
    on this,

    such as a Web server, you would need to configure the INPUT chain appropriately.
    This

    configuration would afford any Linux system a minimum level of firewall security
    with vir-

    tually no impact to its functionality.


    # Simulating a Home Network Router


    With the basics of iptables configuration out of the way, let''s tackle a more
    practical

    example. For a typical firewall, there is very little traffic destined to or from
    the firewall itself.

    In general, the only traffic that would fit this profile be administrative sessions
    to con-

    figure the firewall itself. The vast majority of a firewall''s traffic is passing
    through the firewall,

    and will be checked against the FORWARD chain. The following examples would\configure
    the Linux firewall with the same access controls as a typical home router

    such as a Linksys or Netgear router/firewall. This example assumes that 192.168.1.0/24
    is

    the network on interface eth0 and the external interface is eth1.


    ```

    iptables -P OUTPUT ACCEPT

    iptables -P INPUT DROP

    iptables -P FORWARD DROP

    iptables -A INPUT -p tcp -s 192.168.1.0/24 -i eth0 --dport 80 -j ACCEPT

    ```


