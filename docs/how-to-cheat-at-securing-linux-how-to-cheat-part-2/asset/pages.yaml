    Sep 14 14:42:53 localhost sudo: bob TTY=pts/0 PWD=/home/bob USER=root COMMAND=/bin/vi
    /hosts

    Sep 14 14:43:15 localhost sudo: bob TTY=pts/0 PWD=/home/bob USER=root COMMAND=/bin/cat
    /var/log sudo

