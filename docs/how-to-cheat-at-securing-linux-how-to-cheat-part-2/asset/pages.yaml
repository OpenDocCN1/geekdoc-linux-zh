  md: '# Chapter 5 • Installing and Configuring Snort and Add-Ons


    Likely, there are some options for getting around this feature. Most enterprise
    switches have a port mirroring option. The terms used to describe this functionality
    varies from one manufacturer to another, Cisco calls it Switched Port Analyzer
    (SPAN). This enables you to configure a specific port traffic that it will see
    from other designated ports (or all ports) even though traffic is destined for
    a different port. Typically, one port is configured to mirror all ports and the
    IDS is attached to this port. On a Cisco 3750 switch with 24 ports you could configure
    mirroring by entering the following commands:


    ```

    switch(config)# monitor session 1 interface gig1/0/1 - gig1/0/23

    switch(config)# monitor session 1 destination interface gig1/0/24

    switch(config)# end

    ```


    This setup is pretty straightforward. One line specifies which ports to forward
    traffic from, and two lines specify which port traffic should be mirrored. You
    will need to refer to the user guide for your specific switch hardware to see
    if port mirroring is supported, and if it is, how to configure it.


    # Configuring Snort on Linux


    You will need to download the latest version of Snort that is appropriate for
    your system. If you are using Fedora Core 5, this is as simple as typing `yum
    install snort`, or you could download and install the `.rpm` from snort.org.


    # Configuring Snort Options


    The next step is to configure the various options that determine how Snort will
    behave using the Snort configuration file. The configuration file is excellently
    documented and very easy to use. To get Snort working the way you want it, follow
    these simple steps.


    +   1. Start by opening the main Snort configuration file. By default it will
    be located at `/etc/snort/snort.conf`.

    2. Configure the HOME_NET variable, if desired, by removing the `#` from the line
    you need. `#` is a comment indicator in the Snort configuration file.TheHOME_NET`
    variable defines which networks are the "trusted" internal networks.

    HOME_NET` variable defines which networks are the "trusted" internal networks.
    This is used with the signatures to determine when the internal network is being
    attacked. By default, `HOME_NET` is set to any network with the var `HOME_NET`
    any in the snort.conf. Setting this to accurately reflect your internal address
    space will reduce the number of false positive alerts you receive. A common example
    would be `var HOME_NET 192.168.1.0/24` or perhaps `var HOME_NET [192.168.1.0/24,192.168.2.0/24]`.

    3. Configure the EXTERNAL_NET variable if desired. This is the network you expect
    attacks to come from. The recommendation is to set this to everything


