- img_proc: true
  md: '# Figure 2.13 Sudo Home Page


    ![](img/33fc180c04c8f96c022bce6e62ae12fd_59_0.png)


    # Table 2.6 Sudo Features


    | Feature | Description |

    | --- | --- |

    | Command logging | Commands and argument can be logged. Commands entered can
    be traced to the user. Ideal for system auditing. |

    | Centralized logging of multiple systems | Sudo can be used with the system log
    (syslog) to log all commands to a central host. |

    | Command restrictions | Each user or group of users can be limited to what commands
    they are allowed to enter the system. |

    | Ticketing system | The ticketing system sets a time limit by creating a ticket
    when a user logs on to sudo. The ticket is valid for a configurable amount of
    time. Each new command refreshes the ticket for the predefined amount of time.
    The default time is five minutes. |

    | Centralized administration of multiple systems | The sudo configurations are
    written to /etc/sudoers file. This file can be used on multiple systems and allows
    administration from a central host. The file is designed to allow user privileges
    on a host-by-host basis |'
