  md: '# Frequently Asked Questions


    The following Frequently Asked Questions, answered by the authors of this book,
    are designed to measure your understanding of the concepts presented in this chapter
    and to assist you with real-life implementation of these concepts. To have your
    questions about this chapter answered by the author, browse to www.syngress.com/solutions
    and click on the “Ask the Author” form.


    +   Q: Why do you use nmap, amap, and other tools when simply running Nessus can
    give you all of the same information in one pass?

    A: Although Nessus is a great tool, it is just one tool. Sometimes, you will get
    different information about the same target using different tools, and that different
    information allows you to find out what is closer to the truth.

    Q: You spend a lot of time double-checking and triple-checking the identity of
    a host before you go active and scan them why take so much time when you could
    be actively gathering information?

    A: Penetration testing should be performed with a well-defined scope. Only activities
    that you perform within that scope are authorized. Suppose you not perform diligence
    by checking out your target range and “accidentally” scan an IP neighbor’s target.
    Even if you do not cause damage, you may be liable for simply performing the scan,
    much less if you not penetrate the target. With that being a negative reason,
    you can also find “infringing” targets that are not related to your client, but
    may be purporting themselves to be. This can be as valuable as finding an open
    hole in their Web server.'
