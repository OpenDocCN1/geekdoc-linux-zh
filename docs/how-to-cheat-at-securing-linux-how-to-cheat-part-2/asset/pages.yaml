    As you can see, sudo is extremely helpful for controlling and auditing root access.
    It allows an administrator to distribute root tasks without distributing the root
    password. An administrator can control what root access is needed for each user,
    and can customize system access based on needs.


    Sudo is used almost entirely by system administrators. New administrators can
    be given a new account with only selected root privileges. The master administrator
    can then review the work of the administrator in training.


    This section discussed one of the many ways to use sudo; it focused primarily
    on specifications in the sudoers file. For more information on extending sudo,
    such as using aliases, please consult the sudo man file at www.gratisoft.us/sudo/man/sudo.html.


    # Managing Your Log Files


    Another aspect of system security is managing your log files. By default, Linux
    offer logging that administrators can see who and what has accessed their system.
    More logging is available (both more detailed and logging on more services), but
    Linux keeps it brief so that you don''t fill your hard disk with log information.
    This section briefly helpful commands and programs that provide access to system
    logs.


    Linux offers allow administrators to access useful log files. Two commands of
    interest are last and lastlog. The message file also offers useful data for determining
    possible security breaches on your system.


    The last displays data who is logged on to the system, recently logged on, and
    when the system has rebooted. For example, you may receive data such as the following:


    ```

    root pts/1 :0:0 Tue Sep 18 01:13 still logged in

    root pts/1 :0:0 Tue Sep 18 01:02 - 01:06 (00:03)

    root :0:0 Tue Sep 18 01:00 still logged in

    ```


    ![](img/33fc180c04c8f96c022bce6e62ae12fd_72_1.png)'
  merge: -1
  pgno: 72
- img_proc: true
  md: '# Hardening the Operating System • Chapter 2


    The lastlog command displays the users and services that have accounts on your
    machine. It lists the last time each account logged to the system, or if the account
    has ever logged. Each service in Linux gives an account. This is very helpful
    if a service logged without your knowledge, a hacker may be responsible.This would
    indicate that the hackers control your system and is currently exploiting it.
    It could also mean that another administrator started the service without telling
    you.


    The messages file is a file that displays a list of recent activity on the system.
    For example, it lists if a password was changed and who changed it. It identifies
    when a user opens and closes. It also lists the time and each event took. It can
    be viewed by entering the following command:


    ```

    tail /var/log/messages

    ```


    If you prefer a GUI to view your log files, a program called SWATCH (not installed
    by default) allows an instant and real-time display for various log files. It
    can view any log files you specify and is discussed in the next section.


    The Linux logs should be checked frequently to determine if any security violations
    have occurred on your system. Log does not offer offers, so you must analyze the
    data and decide how to counteract the attack.


    # Using Logging Enhancers


    Logging enhancers are tools that simplify logging by allowing logging information
    to be filtered and displaying logs in simplified formats. Many open source logging
    programs exist to make system administration much easier. Viewing text-based files
    with hundreds or thousands of entries can be burdensome, especially if you are
    only looking for one specific error entry. Logging enhancers can make logging
    much more user-friendly experience, and greatly expand and customize the information
    you need to.


    The next sections explain three popular logging services used by administrators:
    SWATCH, scanlogd, and the next generation of syslog(syslogd-ng).


    # SWATCH


    SimpleWATCH or Simple WATCHdog (SWATCH) is an open source package that allows
    administrators to efficiently monitor system activity. It can monitor events on
    a system, or a large number of systems, by monitoring systems for events. SWATCH''s
    main function is to monitor messages actively as they are written to a log file
    through the Unix syslog utility. SWATCH requires Perl 5 to function.


    SWATCH is efficient because it allows administrators to modify the SWATCH configuration
    (/etc/swatchrc) to filter entries and respond to certain events. For example,
    SWATCH can monitor the system for bad login attempts, and e-mail the administrator
    whenever this failed authentication event occurs. It can monitor and when


