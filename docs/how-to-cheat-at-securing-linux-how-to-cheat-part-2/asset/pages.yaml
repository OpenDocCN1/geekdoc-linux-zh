    destination IP address (destination NAT [DNAT]), or both (double NAT). For example,
    take a home router. The objective behind NAT capability is to allow all of the
    internal hosts to communicate with the Internet using the single public IP provided
    by your Internet Service Provider (ISP). (In this)


