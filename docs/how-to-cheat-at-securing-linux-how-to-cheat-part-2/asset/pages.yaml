  md: 'Presenting the Business Case for Open Source Software • Chapter 1


    # Summary


    Not all facets of implementing free security solutions are free. There are always
    costs of one type or other, which vary in magnitude and relevance based on your
    individual circumstances. Ultimately, you don''t want to be yet another person
    who fell victim to the open source or free hype. These are the people who read
    or hear about a “free” product and rushed to implement it without doing adequate
    research, thus ending up with a mess that is expensive to work or to clean up.
    With the proper research and planning, free solutions can provide you with some
    powerful security solutions without spending a lot of resources. The real value
    lies in finding free software that is the simplest solution available that can
    still meet your needs.


    # Solutions Fast Track


    # The Costs of Using Free Security Solutions


    +   - Training costs can quickly skyrocket, especially for classroom-based training.

    - Consulting costs are not always something to avoid. At times they can provide
    a very efficient way to implement a given solution while at the same time providing
    some sorely needed training and documentation.

    - Intangibles can also add up. While items such as HVAC, power costs, and space
    requirements are not likely to break the bank, these are still considerations
    you should be aware of in order to make informed decisions.


    # The Savings of Using Free Security Solutions


    +   - The biggest savings is that there are no software costs.

    - No maintenance costs


    # Comparing Free Solutions with Commercial Solutions


    +   - You can usually implement a free solution quicker than a commercial product,
    based on the time it takes to make and receive the purchase.

    - A free solution’s primary weakness is support. Without a toll-free number to
    call, you are left to educate yourself or pay someone with the appropriate skills
    to assist. The often sparse or non-existent documentation can sometimes be a major
    hindrance to a successful implementation.


