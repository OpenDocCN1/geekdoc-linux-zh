    How does AES/Rijndael work? Instead of using Feistel cycles in each round like
    DES, Rijndael uses iterative rounds like International Data Encryption Algorithm
    (IDEA). Data operates on 128-bit chunks, which are grouped into four groups of
    4 bytes each. The number of rounds is also dependent on the key size, that 128-bit
    keys have 9 rounds, 192-bit keys and 256-bit keys have 13 rounds. Each round consists
    of a substitution step of one S-box per data bit, followed by a pseudo-permutation
    in which bits are shuffled between groups. Each group is multiplied in a matrix
    fashion and the results are added to the subkey for that round.


    # IDEA


    The European counterpart to the DES algorithm is the IDEA. Unlike DES, it is considerably
    faster and more secure. IDEA''s enhanced speed is due to the fact that each round
    consists of simpler operations than the Feistel cycle in DES. IDEA uses simple
    operations like exclusive or (XOR), addition, and multiplication, which are more
    efficient to implement in software than the substitution and permutation operations
    of DES. Addition and multiplication are the two simplest binary calculations for
    a computer to perform. XOR is also a simple operation that returns a "1" when
    two inputs are different, and a "0" when inputs are the same.


    IDEA operates on 64-bit blocks with a 128-bit key, and the encryption/decryption
    processes eight rounds with 16-bit blocks per round. The IDEA is patented both
    in the U.S. and in Europe, but free non-commercial use is also permitted. IDEA
    is widely recognized as one of the components of Pretty Good Privacy (PGP) (covered
    in Chapter 3). IDEA was developed in the early 1990s by cryptographers James Massey
    and Xuejia Lai as part of a combined research project between Ascom and the Swiss
    Federal Institute of Technology.


