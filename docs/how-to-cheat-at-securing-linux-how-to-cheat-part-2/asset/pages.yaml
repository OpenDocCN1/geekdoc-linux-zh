    You can perform enumeration using either active or passive methods. Proxy methods
    may also be considered passive, as the information you gather will be from a third
    source, rather than intercepted from the target itself. However, a truly passive
    scan should not involve any data being sent from the host system. Active methods
    are more familiar in which you send certain types of packets, and then receive
    packets in return.


    Once enumeration is complete, you will have a list of targets that you will use
