    # True DMZ


    The true DMZ is generally considered the most secure of firewall architectures.
    With this design, there is an external and internal firewall. Between the two
    is sandwiched any Internet accessible devices (see Figure 9.3).


    # Figure 9.3 True DMZ


    ![](img/33fc180c04c8f96c022bce6e62ae12fd_293_0.png)


    Internet traffic is only permitted to a server in the DMZ, and only on the port
    that server is listening on. For example, if you had a Web server in the DMZ and
    an FTP server in the DMZ, traffic with a destination port of 80 would only be
    permitted to the Web server. For users accessing the same servers, same rules
    would apply. Internal users would have to have permission through both firewalls
    to access the Internet. Obviously, this type of design costs more, typically double,
    but that buys increased security. In a true DMZ, if the Web server is compromised
    the hacker is still trapped between two firewalls. For those who want to go the
    extra mile, the inside and outside firewall can be of different types (say Cisco
    Private Internet Exchange [PIX] and Linux netfilter). In this way, a hacker that
    finds a security hole in one firewall is unlikely to be able to apply the same
    techniques to the other firewall.


    With all of the basics out of the way, you will be in a better position to make
