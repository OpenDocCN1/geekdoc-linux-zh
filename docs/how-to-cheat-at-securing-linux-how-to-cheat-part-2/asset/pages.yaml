    Table 4.2 Basic Snort Options for Packet Sniffing and Logging


    | Option | What It Does |

    |---||

    | -v | Put Snort in packet-sniffing mode (TCP headers only) |

    | -d | Include all network layer headers (TCP, UDP, and ICMP) |

    | -e | Include the data link layer headers |


    You cannot use options -d and -e together without also using the -v option. If
    you get the same output if you use snort without any options:


    ```

