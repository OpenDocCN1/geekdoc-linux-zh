    to maintain it remotely and securely. For Linux and UNIX systems, this means including
    Secure Shell (SSH) and Apache with Secure Sockets Layer (SSL). For Windows, this
    would mean Terminal Services (with limitation on which users and machines can
    connect and Internet Information Services [IIS]).


    # Hardware


    It''s difficult to give hard-and-fast requirements on what you''ll need to run
    Snort because the hardware requirements are tremendously varying depending on
    the amount of traffic on your network and how much of you''re trying to process
    and store. Busy enterprise networks with thousands of active servers are going
    to have much greater requirements than a poky home network with one client on.
    However, we can provide general guidelines.


    At a minimum level, Snort does not have any particular hardware requirements that
    your OS doesn''t already to run. Running any application with a faster processor
    usually makes the application work faster. However, your network connection and
    hard drive will limit the amount of data you can collect.


    One of the most important things you''ll need, especially if you''re running Snort
    in NIDS mode, is a very big, reasonably hard drive. If you''re storing your data
    as syslog logs or in a database, you''ll need a lot of space to store all the
    data that the Snort''s detection engine uses to check for rule violations. If
    your hard drive is too small, there is a good chance that you will be unable to
    write alerts to your database or log files. For example, our current setup for
    a single high-traffic enterprise Snort sensor is 100GB partition for /var (for
    those of you not familiar with Linux/UNIX systems,/var where are logs, including
    Snort data, are likely to be stored). Some high-end deployments use RAID arrays
    for storage.


    You will need to have network interface card (NIC) as fast or faster than the
    rest of your network to collect all the packets on your network. For example,
