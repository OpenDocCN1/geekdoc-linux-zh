  md: '# Perimeter Security, DMZs, Remote Access, and VPNs • Chapter 9


    packet filtering firewalls typically make decisions based on the Internet Protocol
    (IP) address, the destination IP address, and the source/or destination port number.
    While this type of firewall may sound simplistic, consider if you have a server
    running a Web site for the Internet. In likelihood, the only traffic that you
    need to allow the server uses a destination port of Transmission Control Protocol
    (TCP) 80 or 443; thus, you could configure your firewall to permit only that traffic.
    These ports used for HTTP and HTTPS, respectively because the server is available
    for the Internet, you cannot filter traffic based on the source address or source
    port, which will be different for each connection.


    The primary drawback with a simple packet filter is that the packet filtering
    firewall has to rely on very primitive methods to determine when traffic should
    be allowed (e.g., [SYN] or acknowledgement [ACK] bits setting). While this was
    adequate in the early days of the Internet when security was not as big of a concern,
    it won''t work anymore. It is trivial to set the bits on the packet using freely
    available software to make the traffic look like it is a reply to another connection.
    The stateful inspection firewall was born of necessity. This type of firewall
    monitors all connections (inbound or outbound), as the connection is permitted
    (based on the firewall''s configured rules) it enters this connection into a table.
    When the reply to this connection comes back, even if the reply uses a port that
    the firewall was not previously configured to permit, it can intelligently recognize
    the traffic as a response to a permitted session and permit the traffic.


    Unfortunately, the firewalls get better so the hackers use it to circumvent them.
    Suppose you have configured your firewall perfectly and there are no holes; every
    permitted port is one you expressly to allow. Using the previous example, no traffic
    is allowed to the Web server except Web traffic. Sounds good, but the problem
    is, if the allow is completely secure, the server might never be. Flaws in the
    Web server software could the attacker to send the server an HTTP request that
    is 10,000 characters long, overflowing the buffers and allowing the attacker to
    execute code of his choice. The packets used to transport the 10,000-character
    HTTP request are all legal TCP packets as the firewall is concerned; therefore;
    it would permit them to pass through the Web server. The next step in firewall
    evolution serves to combat this type of attack. These types of firewalls are application
    gateways, or layer 7 firewalls.


    This type of not filters network traffic based on the standard network parameters,
    but they also understand the higher layer protocol information contained within
    the packet, in this example HTTP. The firewall knows what a legitimate HTTP request
    looks like and can filter out a malformed or malicious request even though, from
    a network perspective, it might be a permitted packet. There is a down side to
    this type of approach, which is that the firewall must be programmed with all
    the intelligence needed to filter normal traffic, plus the firewall must fully
    understand the protocols it is inspecting. This means additional programming for
    any protocol that you want the firewall to understand. Most of the major commercial
    application gateways offer support for the major


