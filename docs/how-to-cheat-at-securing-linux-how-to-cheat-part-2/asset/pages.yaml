  md: '# Banned IP Address Watchlists


    Probably the easiest way to watch for communication with banned IP addresses with
    Snort is by creating a set of rules for each address.


    ```

    alert tcp $HOME_NET <> $BANNED_NET any (msg:"TCP Traffic to banned network";

    classtype:policy-violation; sid:1000001; rev:1);

    alert udp $HOME_NET <> $BANNED_NET any (msg:"UDP Traffic to banned network";

    classtype:policy-violation; sid:1000002; rev:1);

    ```


    The problem with rules like this is that if the list of banned networks (or IP
    addresses) is very large, it awkward maintaining a huge list of banned destinations.
    If you expect to be maintaining large lists of banned destinations, then a more
    elegant way of handling this is to store the banned list in a database and use
    a detection plug-in.


    # Network Operations Support


    Using Snort for supporting network operations is primarily for making measurements
    of network utilization and performance.


    # Forensics and Incident Handling


    Forensic issues present an interesting problem for the utilization of Snort. Generally,
    when we think about incidents we are dealing with analyzing what happened after
    the fact. In this case if you not log the appropriate information or store it
    in a database, you are out of luck. However, if you are dealing with a situation
    that is ongoing, you can make use of Snort’s capabilities. Even with an ongoing
    incident, one cannot always know what to look for, so running Snort as an IDS
    with special rules or plug-ins is not the best way to do it. Instead, in this
    situation Snort should be run in a packet-sniffing mode, storing everything to
    the captured data:


    First,


    ```

    snort -deb -L logfile.pcap

    ```


    then,


    ```

    snort -r logfile.pcap -c special.conf

    ```


    The configuration file special.conf will have the appropriate rules. In particular,
    this set of rules would involve the rule options: logto, session, and tag. So,
    for example, if you had reason to believe that something worthy of investigation
    was happening in a telnet session that involved the local server 192.168.100.78,
    then special.conf would contain a session rule like:


    ```

    log tcp 192.168.100.78 <> any 23 (session: printable; )

    ```


    which will log all the printable characters in the telnet session from that system.'
  merge: -1
