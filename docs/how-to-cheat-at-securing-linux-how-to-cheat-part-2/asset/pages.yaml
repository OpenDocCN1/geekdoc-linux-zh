  md: '# Authentication


    Is the receiver able to verify the sender? The answer depends on the type of encryption.
    In cases of symmetric cryptography, the answer is no, but in cases of asymmetric
    cryptography, the answer is yes. With symmetric cryptography, anyone with the
    secret key can both encrypt and decrypt messages. Asymmetric cryptography can
    authenticate a sender by their private key, assuming that the key is kept. Because
    each person is responsible for their own private key, only that person is able
    to decrypt messages encrypted with their private key. Similarly, only those persons
    can sign messages with their private key that are validated with their public
    key.


    # Non-Repudiation


    Asymmetric cryptography ensures that an author cannot refute that they signed
    or encrypted a particular message once it has been sent, assuming the private
    key is secured. Again, this goes back to the fact that an individual should have
    only access to their private key. If this is true, only that person could sign
    messages with their private key and therefore, by extension, all messages signed
    with their private key originated with that specific individual.


    # Access Control


    Additionally, in limited ways, cryptography can provide users with some access
    control mechanisms. Some systems can provide access control based on key signatures.
    Similar systems use X.509 certificates in the same manner. The idea is, based
    on a certificate presented by a user that has been signed by that user, a particular
    user can be identified and authenticated. Once the authentication has occurred,
    software access controls can be applied to the user.


