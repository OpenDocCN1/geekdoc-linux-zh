    As you can see, configuring swatch is not difficult. Some of the commands for
    security considerations and their use follow:


    +   - **script-dir=<path to directory>** Used on the command line. When swatch
    runs, it creates a temporary script, which by default is written to the user''s
    home directory. You should redirect the watcher script to a secured directory
    where it cannot be edited. A hacker with access to this temporary script could
    control what swatch reports and cover its tracks.

    - **exec command** Used in the config file, this could cause matches to execute
    another command. This could be as simple as pager software, or it could run a
    custom script to lock down the Netfilter firewall automatically.

    - **Thorough hours:minutes,seconds,[use=message | regex <regex>]** This is especially
    valuable because it controls how often duplicates of a given message are acted
    on. This way a brute-force password cracker won''t run over with with a nonstop
    scrolling message, possibly filling up your logging partition.

    - **Threshold events:seconds,[repeat=no | yes]** This is another very important
    one. It allows you to ignore certain matches until they surpass a given threshold;
    in other words 4:60 will not perform any action unless the pattern matches four
    times in a 60-second window. This is very useful for things like passwords. You
    don''t want all sorts of alarms going off because the admin mistypes a password
    once, or many incorrect attempts in a short time frame may be a sign of a hacker
    at work.


