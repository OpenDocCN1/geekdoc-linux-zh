    +   - sshd Runs OpenSSH

    - syslog Used for system logging

    - xinetd Manages the startup of services


    ![](img/33fc180c04c8f96c022bce6e62ae12fd_368_0.png)


    # Services to Be Avoided at All Costs


    There are some services that you would never want exposed to an untrusted network
    such as the Internet. In most cases this means they should not be running on a
    bastion. These services include the following:


    +   - portmap Used to manage RPC connections

    - Telnet Used for unencrypted remote console access

    - rsh, login, rexec Used for unencrypted remote console access

    - nfs, lockd, mountd, statd Used for Network File System (NFS) and related services

    - lpd Printer service


    All these services are inherently insecure. A variety of alternatives is available
    that take advantage of encryption and security authentication methods. If you-absolutely
    must use any of these services, you should protect them by tunneling them in IPSec
    or equivalent.


    # Choosing a Window Manager


    While we''re on the subject of cleaning up unwanted software, it seems like a
    good time to discuss window managers. Because Linux is natively a command-line
    based system, the graphical desktop environment is not an integral part of the
    operating system. Unlike modern versions of Windows, you can simply remove the
    GUI altogether. This has several advantages, the most noticeable of which is that
    you will free up system resources. The simplest and most implemented remote access
    solutions are also command line only, which further lends itself to doing away
    with the GUI altogether. Finally, by not offering an X Window session for remote
    use, that is one less listening port that needs to be opened on your bastion host,
    which means increased security.


    If you decide a graphical interface is something you must have, you must still
    choose one that not all created equally. Generally speaking, the more full-featured
    and


    ![](img/33fc180c04c8f96c022bce6e62ae12fd_368_1.png)'
