    # Preprocessor


    At this point, our coin sorter has obtained all the coins it can (packets from
    the network) and is ready to send the packets through the chute. Before rolling
    the coins (the detection engine), the coin sorter needs to determine if any are
    coins, and if so, what sorts.


    This is done by the preprocessors. A preprocessor takes the raw packets and checks
    them against certain plug-ins (like an RPC plug-in, and a port scanner plug-in).
    These plug-ins check for a certain type of behavior from the packet. Once the
    packet is determined to have a particular type of "behavior," it is then sent
    to the detection engine. From Figure 4.3, you can see how the preprocessor uses
    its plug-ins to check a packet. Snort supports many kinds of preprocessors and
    their attendant plug-ins, covering many used protocols as larger-view protocol
    issues such as IP fragmentation, port scanning and flow control, and deep inspection
    of richly featured protocols (such as the HTTPInspector preprocessor).


    This is an incredibly useful feature for an IDS because plug-ins can be enabled
    and disabled as they are needed at the preprocessor level, allocating computational
    resources and generating alerts at the level optimal for your network. For example,
    say that you''re fed up with the constant rate of port scans of your network,
    and you don''t want to see those alerts anymore. In fact, you never want to hear
    about a port scan again. If that''s the case, you can say you dont care about
    port scans coming into your network from the outside world and disable plug-in
    while still continuing to use the others to examine other network threats. It''s
    a modular configuration, rather than an all-or-nothing scenario.


