    Modern Linux distributions have enhanced the GUI to cover most of the administrative
    tasks, it''s essential for good administrators to know how to perform the tasks
    in the absence of a GUI. Let us discuss about how to manually disable several
    vulnerable services.


    # Services to Disable


    Linux, by nature, is more secure than most operating systems. Regards, there are
    uncertainties to every new Linux kernel is released, and many security vulnerabilities
    have not been discovered. Most Linux services are not vulnerable to these exploits.
    However, an administrator can reduce the risk by removing unnecessary services.
    Red Hat Linux includes many services, so it makes sense that administrators customize
    the system to suit the company needs. Remember, you are removing risk when you
    remove unnecessary services.


    # The xinetd.conf File


    Though never and more sophisticated way managing network services are available
    in modern Linux distributions, /etc/xinetd.conf file controls many Unix services,
    including'
  merge: -1
