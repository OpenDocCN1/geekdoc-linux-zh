  md: '# Evaluating Individual Solutions


    As you do your research, you will need to determine if the free software is the
    best solution. There are a whole of factors which will go into this在了. The following-list
    briefly summarizes the steps needed to make a determination as to whether or not
    a free software is the best for you.


    +   1. Identify Your Options This can be the hardest part of the process, knowing
    what free alternatives exist. Hopefully this book will help, but there are also
    on-line sites to help you find free software. One of the largest sites hosting
    open source soft-ware is http://sourceforge.net/index.php. Also check out http://freshmeat.net/
    You can find a more programmer-oriented site containing only software that runs
    on Linux at www.icewalkers.com/. A directory of free software is located at http://directory.fsf.org/.
    A similar directory of free software for Microsoft Windows is located at http://oisin.sourceforge.net/.
    Finally, a CD containing some “picks” of free software for use on Windows is located
    at www.theopendc.org/.

    2. Research Each Option This will mean doing searches on the software. Take note
    of how many problems people have, and if they have been fixed. Check the developer''s
    Web and documentation. This is when you will need out the majority of candidates
    and hopefully be left with a list of quality choices.

    3. Compare Products The previous step is meant to sort out the free solutions.
    This step is aimed at comparing the free solutions against their commercial counterparts.
    This is where you may rule out some products as too expensive or to use. Metrics
    to use for comparison include:


    +   - Functionality The product must meet your business needs to be considered.
    Pay attention to volumes. The product might do what you want, but not on the scale
    you want it to. Consider if the product will work with other utilities or if it
    uses proprietary and closed source methods, protocols, or algorithms. These traits
    may act as limits and hinder flexibility later on.


    +   - Cost This is one of the major reasons you are considering a free solution.
    Try to be as accurate as possible in your estimates of the true costs, including
    things such as purchase cost, maintenance, training, upgrades, and so on.


    +   - Momentum How well established is the product? Remember this is a consideration
    for free software and commercial software. The more well established the software
    is, the better the odds the creators will be around in the future. A larger well-established
    project will likely have better community support and reliability. Included in
    the overall momentum is to'
