  md: '# Frequently Asked Questions


    The following Frequently Asked Questions, answered by the authors of this book,
    are designed to measure your understanding of the concepts presented in this chapter
    and to assist you with real-life implementation of these concepts. To have your
    questions about this chapter answered by the author, browse to www.syngress.com/solutions
    and click on the “Ask the Author” form.


    +   - Q: How do I make the NX Client connect to an existing session?


    +   - A: Currently, the most oft used solution is to have the local user use an
    NX session (to localhost). That way, all of their activities are always within
    an NX session, making management (terminate, pause, resume) much simpler. Again,
    it’s not elegant but it works adequately.


    +   - Q: I like the features of a particular flavor of VNC (or any remote access
    method) but it doesn''t support encryption. What can I do to secure it?


    +   - A: One of the most common approaches is to use the SSH port-forwarding functionality.
    This is how many of the VNC variants are providing encryption behind the scenes
    anyway.'
