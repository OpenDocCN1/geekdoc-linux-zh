    # Asymmetric Encryption Algorithms


    The biggest disadvantage to using symmetric encryption algorithms relates to key
    management. To ensure confidentiality of communication between two parties, each
    communicating pair needs to have a unique secret key. The number of communicating
    pairs increases, there is a need to manage a number of keys related to the square
    of the communicators, which quickly becomes a complex problem.


    Asymmetric algorithms were developed to overcome this limitation. Also known as
    public-key cryptography, these algorithms use two different keys to encrypt and
    decrypt information. Cleartext encrypted with its public key can only be decrypted
    with its private key; and if it is encrypted with the private key, it can only
    be decrypted by the public key. The basic principle is that the public key can
    be freely distributed, while the private key must be held in strict confidence.
    The owner of the private key can encrypt cleartext create ciphertext that can
    only decoded with its public key (assuring the identity of the source), or it
    can use the private key to decrypt ciphertext encoded with its public key (assuring
    the confidentiality of the data). Although these keys are generated together and
    are mathematically related, the private key cannot be derived from the public
    key.


    # NOTE


    Literally thousands of different cryptographic algorithms have been developed
    over the years. Cryptographic algorithms can be classified as follows:


    +   * Encryption Algorithms Used to encrypt data and provide confidentiality

    * Signature Algorithms Used to digitally “sign” data to provide authentication

    * Hashing Algorithms Used to provide data integrity


    Algorithms (ciphers) are also categorized by the way they work at the technical
    level (stream ciphers and block ciphers). This categorization refers to whether
    the algorithm is applied to a stream of data, operating on individual bits, or
