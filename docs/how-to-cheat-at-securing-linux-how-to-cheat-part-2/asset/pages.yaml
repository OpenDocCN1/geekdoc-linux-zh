  md: '# Hardening the Operating System • Chapter 2 33


    Bastille is written specifically to Red Hat Linux and Mandrake Linux, but can
    be easily modified to run on most Unix flavors. The specific Red Hat/Mandrake
    content has been generalized, and now the hard-code filenames are represented
    as variables. These variables are set automatically at runtime. Before you install
    Bastille on your system ensure your Linux version is supported by Bastille.


    # Bastille Functions


    The following list highlights the security features offered by Bastille to secure
    your system. You will choose which feature to implement on your system during
    the question-and-answer wizard. For example, many servers do not need to provide
    firewall or Network Address Translation (NAT), so you may not need to configure
    iptchains/iptables. This is a partial list of features offered by Bastille and
    may vary as new versions of Bastille are released. More information about each
    of these features is explained in the program.


    +   **Apply restrictive permissions on administrator utilities** Allows only the
    root to read and execute common Administrator utilities such as ifconfig, linux-ping,
    traceroute, and runlevel. It disables the SUID root status for these programs,
    and nonroot users cannot use them.


    +   **Disable r-protocols** The r-protocols allow users to log to remote systems
    using IP-based authentication. IP-based authentication permits only IP addresses
    to remotely log on a system. Because this authentication is based on the IP address,
    a hacker who has discovered an authorized IP address can create spoofed packets
    that appear to be from the authorized system.


    +   **Implement password aging** Default Red Hat Linux systems allow passwords
    to expire 99,999 days. Because this is too long in a secure environment, Bastille
    offers to change the password expiration time to 180 days. These configurations
    are written to the /etc/login.defs file, as shown in Figure 2.7.


    +   **Disable CTRL-ALT-DELETE rebooting** This disallows rebooting the machine
    by this method.


    +   **Optimize TCP Wrappers** This modifies the inetd.conf (pre-Red Hat Linux
    7 versions only) and /etc/hosts file so that inetd contact TCP Wrappers when it
    gets a request, instead of automatically running the requested service. TCP Wrappers
    will determine if the requesting IP address is allowed to run the particular service.
    If the request is not allowed, the request is denied and the attempt is logged.
    Although IP-based authentication can be vulnerable, this optimization adds a layer
    of security to the process. This is not recommended for most scenarios.


    ![](img/33fc180c04c8f96c022bce6e62ae12fd_49_0.png)'
