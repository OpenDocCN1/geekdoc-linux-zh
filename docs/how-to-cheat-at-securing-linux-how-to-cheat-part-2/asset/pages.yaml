  md: '# Figure 9.9 SNAT


    ![](img/33fc180c04c8f96c022bce6e62ae12fd_309_0.png)


    In 9.9, the internal host has a private IP address of 192.168.1.11. The public
    address of the private network wants to make a connection to www.syngress.com
    using a Web browser, the connection is sent with source address 192.168.1.1 to
    a destination address of www.syngress.com. The firewall alters the source address
    to its own public IP address of 5.5.5.5 and sends the packet on it. When the server
    replies to destination the firewall edits the packet, inserting a new destination
    of 192.168.1.11. All of these places and is transparent to the 192.168.1.11 host
    and to www.syngress.com server. When multiple hosts are using SNAT, the firewall
    tracks which connections to private hosts are using the port numbers. While the
    destination port of the Web remains static (typically port 80 for the Web), the
    source port is a random port above 1024. By tracking the source port, the firewall
    knows which addresses belongs to which. In the event that two hosts attempt the
    same source port, the NAT device edits the source port of one of the connections
    and replaces it with another source port. When the return traffic is received,
    it translates the source port back, just like it did for the IP address. Because
    this method of NAT relies heavily on the source port number, it is sometimes referred
    to as port NAT (PNAT).


    To add the SNAT functionality to the example firewall, use the following command:

    iptables -t nat -A POSTROUTING -o eth1 -j SNAT --to-source 5.5.5.5


    ![](img/33fc180c04c8f96c022bce6e62ae12fd_309_1.png)'
  merge: -1
  pgno: 309
- img_proc: true
  md: 'The -t option is used to specify the table we want to modify, and the -A option
    specifies that we are going to append this rule to the POSTROUTING chain. By specifying
    the outbound interface, we are ensuring that the SNAT only occurs as traffic leaves
    the private network, meaning only in the proper direction.


    > SNAT can only be performed in the nat table. However, the rules for SNAT can
    only go in the POSTROUTING chain of the nat table. This means that any time you
    use SNAT, your rule will contain -t nat -A POSTROUTING.


    The jump target SNAT is self explanatory. The -to-source option specifies what
    IP address we want to use as the source address. SNAT assumes we have a static
    IP address to SNAT the outgoing packets to. While this is likely the case in a
    corporate environment, a more appropriate solution to closely mimic the configuration
    of a home router would be to use the MASQUERADE command:


    ```

    iptables -t nat -A POSTROUTING -o eth1 -j MASQUERADE

    ```


    The masquerade command does not require an IP specification, and will use the
    IP address of the firewall interface. You might be wondering why you would use
    the masquerade target all of them instead of the SNAT target. Because the source
    IP is static, the SNAT target will cause the NAT calculations to be performed
    once for a given session. Subsequent packets belonging to that session are handled
    the same way as the first. With the masquerade target, each packet is checked
    for the source IP to use, which requires more overhead than with SNAT. This is
    why SNAT is preferable if you have a static IP address, and masquerade is your
    only option if you do not have a static IP address to.


    # Additional Commands


    By this point, you should have a relatively solid grasp of how to configure a
    Linux firewall. So far we have covered all of the core commands to permit and
    deny the traffic. Another useful command for your Linux firewall is logging packets.
    If you want to log everything passing through the firewall, use the iptables -A
    FORWARD -j LOG command. While simple, this would likely generate an excessive
    amount of logging traffic. There are some additional options to provide this functionality.
    Of particular note are the --log-level and --log-prefix options.


    The --log-level option allows you to specify what logging level is used for the
    LOG rule. The effect of this log level depends on how you have your kernel logging
    configured (via syslog or syslog-ng). When you combine the custom logging level
    of iptables with the syslog'
  merge: -1
  pgno: 310
- img_proc: true
  md: '# Perimeter Security, DMZs, Remote Access, and VPNs • Chapter 9 295


    configuration, you can have syslog in any manner of ways based on the firewall
    logs, including sending e-mails for certain events. The --log-prefix option allows
    you to insert a 2-letter string in front of the log entry. This can be useful
    for troubleshooting purposes. Some examples of what you can place in log prefix
    be the name of the chain that generated the log entry as iptables -A FORWARD -j
    LOG --log-prefix "from FORWARD chain."


    > NOTE

    While a packet that matches an ACCEPT, DENY, or DROP rule will stop traversing
    any other chains, this is not true of packets that match a log rule. After matching
    the log rule, the packets continue through any appropriate chains to be processed.
    Keep this in mind, so that you can configure an additional rule and action for
    the packet if desired.


    Now that you can create a working ruleset for netfilter, you will want to save
    it. There are two commands: one for saving the configurations and one for loading
    a saved configuration. You can use the iptables-save command to generate output
    that is to the stdout, meaning it will display in the console. To save this, redirect
    it to a file. To redirect the current ruleset to a file called /ruleset, you would
    type iptables-save > /etc/ruleset. If you want to save the current packet counts
    and rule counts, use the iptables-save -c > /etc/ruleset command. Individual tables
    can be saved separately by specifying the -t option using the iptables -t mangle
    > /etc/ruleset command.


    Restoring a ruleset is accomplished using the iptables-restore command. Like iptables-save,
    the restore function has two optional arguments. The -c option will allow iptables
    to load the saved packet and byte counts, overwriting the current count values.
    The default behavior when using iptables-restore is to flush the rules before
    loading the saved ruleset, thus all previous rules are lost. If you wish to override
    this behavior, you can use the -n option, in which case the rules will be added
    to the existing ruleset, and will only overwrite if there is a duplicate rule.
    You can use the iptables-restore < /etc/ruleset command to pipe the saved configuration
    to iptables-restore.


    # Command Summary


    The following is a brief summary of the most useful iptables commands for easy
    reference, along with examples to make the command usage more clear. Bear in mind
    this is not an exhaustive list of commands for configuring your firewall. For
    a complete list, refer to the iptables man page.


