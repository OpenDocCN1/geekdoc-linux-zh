    # NOTE


    What’s the difference between a connection-oriented protocol and a connectionless
    protocol? A connection-oriented protocol (e.g., TCP) creates a connection between
    two computers before sending the data, and then verifies that the data has reached
    its destination using acknowledgements (ACKs) (i.e., messages sent back to the
    sending computer from the receiving computer acknowledge receipt). Connectionless
    protocols send the data and trust that it will reach the proper destination or
    that the application will handle retransmission and data verification.


    Consider this analysis: You need to send an important letter to a business associate
    that contains valuable papers. You call him before e-mailing the letter, to let
    him know that he should expect it (establishing the connection). A few days later
    your friend calls to let you know that he received the letter, or you receive
    the return receipt (ACK). This is how connection-oriented communication works.
    When mailing a postcard to a friend, you drop it in the mailbox and hope it gets
    to the addressee. You don’t expect or require any acknowledgement. This is how
    connectionless communication works.


    The Transport layer also manages the logical addressing of ports. Think of a port
    as a suite or apartment number within a building that defines exactly where the
    data should go.


