  md: '# Figure 9.1 Screened Subnet Firewall


    ![](img/33fc180c04c8f96c022bce6e62ae12fd_291_0.png)


    The screened subnet firewall (or edge firewall*) is straightforward and simple
    to implement, it is not without. Internet users who need access to an internal
    server (e.g., Web, FTP, SMTP, and so on) must traverse the firewall to do so.
    Internal servers needing access to those servers would be able to access them
    directly. Internet traffic not destined for any Web-based server would be blocked
    at the firewall to prevent attacks on internal systems. All internal users must
    also traverse firewalls to access the Internet. This is the same type of firewall
    architecture you would have at home with a small network behind a Linksys router.
    This configuration has several advantages. The primary advantage is simplicity.
    With only two interfaces, the Access Control Lists (ACLs) (the filters that define
    the criteria for permitting or denying traffic) are much simpler.


    Although this configuration is cost effective and simple to implement, it is not
    without its drawbacks. In this arrangement, the hacker has several chances to
    penetrate your network. If he or she finds a security hole in the firewall, or
    if the firewall is improperly configured, he or she might be able to gain access
    to the internal network. Even if the firewall is executed flawlessly, the has
    a second opportunity to gain access. If the hacker can compromise any available
    Web-based services and take control of the servers, he or she would then have
    an internal system from which to launch additional attacks. Finally, if the servers
    are critical to the business function, allowing internal users to access them
    without going through the firewall, you may lose some audit capability that the
    firewall might otherwise offer. By far the biggest security weakness in this configuration
    is that if you are exposing any Web-based services: the servers hosting those
    services will be attacked frequently, and a compromise of one of those may expose
    your entire network.


