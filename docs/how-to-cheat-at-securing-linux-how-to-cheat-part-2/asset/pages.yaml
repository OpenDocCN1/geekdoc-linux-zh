  md: '# Hardening the Operating System • Chapter 2


    +   - **Actions** Whenever a pattern is discovered, SWATCH seeks an action, such
    as e-mailing the administrator of the failed login attempt.


    Two optional fields are used to further customize the configuration file:


    +   - **Throttle** Throttle defines the amount of time that SWATCH will ignore
    repeated logged entries before listing the entry again. This saves administrators''
    time from viewing 300 identical "Failed Authentication" errors. However, a secure
    system should limit the number of login attempts. The throttle entry is defined
    as HH:MM:SS, where H represents hours, M represents minutes, and S represents
    seconds.


    +   - **Timestamp** Timestamp defines the length and location of the timestamp.
    The timestamp entry is defined as start:length.


    The following are two examples from the SWATCH configuration file. SWATCH will
    actively watch for these messages as they are written to their respective log
    files through the syslog utility. The first example monitors log for failed login
    attempts and e-mails root when a failed login attempt occurs.


    ```

    # Failed login attempts

    watchfor /failed/

    echo bold

    mail addresses=root,subject=Failed Authentication

    ```


    The second example monitors your log files and e-mails root when a user used to
    gain access.


    ```

    # Users used to gain root access

    watchfor /su/:

    echo bold

    mail addresses=root,subject=User used to root

    ```


    SWATCH filters logging files so that administrators only receive the information
    they require. It saves a lot of time and trouble once configured and is recommended
    for system administrators who are overwhelmed by log files (and perhaps not use
    them for that reason). To download an RPM version of SWATCH, visit www.rpmfind.net.


