- img_proc: true
  md: '# Hardening the Operating System • Chapter 27


    File Transfer Protocol (FTP) and Telnet. It determines what services are available
    to the system. xinetd (like inet in earlier versions) service is a “super server”
    listening for incoming network activity for a range of services. It determines
    the actual nature of the service being requested and launches the appropriate
    service. The primary reason for the design is to avoid and run a large number
    of low-volume services. Additionally, xinetd''s ability to launch services on
    many demands means that the needed number of servers is run.


    The etc/xinetd.conf file directs requests for xinetd services to the /etc/xinetd.d
    directory. Each xinetd service has a configuration file in the xinetd. directory.
    If a service is commented out in its specified configuration, the service is unavailable.
    Because xinetd is so powerful, the /etc/xinetd.d directory makes it simple to
    disable services that your system is not using. For example, you can disable the
    FTP and Telnet services by commenting out the FTP and Telnet services in the respective
    file and restarting the service. If the service is commented out, it will not
    restart. The next section demonstrates how to disable the Telnet, FTP, and login
    services.


    # Telnet and FTP


    Most administrators find it convenient to log in their Unix machines over a network
    for administration purposes. However, in a high-security environment, only physical
    access may be permitted for administering a server. In this case, you disable
    the Telnet interactive login utility. Once disabled, no one can access the machine
    via Telnet.


    +   1. To disable Telnet, you must edit the /etc/xinetd.d/telnet file. Open the
    Telnet file, using vi or an editor of your choice.

    2. Comment out the service telnet line by adding a number sign (#) before service
    telnet:


    ```

    #service telnet

    ```


    +   3. Write and quit the file.

    4. Next, you must restart xinetd by entering:

    /etc/rc.d/init.d/xinetd restart


    ```

    Stopping xinetd:      [OK]

    Starting xinetd:     [OK]

    ```


    +   5. Attempt to log on to the system using Telnet.You should fail.

    6. Note that commenting out the service line in the respective xinetd.d directory
    can disable many services.


    ![](img/33fc180c04c8f96c022bce6e62ae12fd_43_0.png)'
