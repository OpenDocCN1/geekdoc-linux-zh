    # Protecting Sniffers


    So far, you have learned what sniffing is and how it works. You have also learned
    some of the tricks that can be used by intruders for sniffing, and not-so-foolproof
    methods of detecting sniffing. None of these shines a positive light on your plight
    to protect your network and data. However, there are methods on your network that
    offer protection against sniffing.


    We talked earlier about using switches instead of hubs, and we learned the methods
    to defeat switches. Using switches is a network practice that allows improved
    performance and security. While switches present a barrier to casual sniffing,
    the best method of protecting your data is to use encryption, which is the best
    form of protection against traffic interception on public networks and internal
    networks. Intruders can still sniff the traffic, but the data appears unreadable.
    The intended recipient should be able to decrypt and read the data; however, some
    methods of encryption leave the packet headers in clearest, allowing intruders
    to see the source and destination addresses and map the network. However, the
    data contained within the packet is protected. Every form of encryption mask the
    header portion of the packet.


    A VPN uses encryption and authentication to provide secure communication over
    an otherwise insecure network. VPNs protect the transmission of data over the
    Internet and over your internal network. However, if an intruder compromises one
    of the end nodes of a VPN, the protection is rendered useless. Different types
    of VPN families are not inter-


