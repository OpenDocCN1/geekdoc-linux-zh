  md: '# Linux Bastions • Chapter 10 359


    fine-tuning the rules until you get the system into a working state. Once you
    are satisfied with the SELinux rules, you can enable Enforcement mode, which will
    actually apply your configured policy. Policies can be defined as targeted or
    strict. The strict policy applies to all processes and files on the system; the
    targeted policy is applied only to specific files. While more secure, has been
    found to be very difficult to configure properly. Targeted is easier to configure
    and is the default policy type when SELinux is first enabled. You can check the
    status of SELinux by typing sestatus.


    If you navigate back to the Security Configuration window and click the SELinux
    tab, then expand to Modify SELinux Policy, you will be presented with a list of
    options to toggle various SELinux settings. These options are only a limited set
    of preconfigured choices to toggle settings in the SELinux policy files. For any
    serious configuration you will need to edit the files manually. You can also download
    a third-party SELinux policy editor from the SELinux Policy Editor Project (http://seedit.sourceforge.org/index.html).
    This package includes a simplified set of tools that is slightly less than the
    normal policy. However, you can switch between one or the other.


    By reviewing the logs, you can see what actions would have been denied if it were
    enforced. If auditing has not been enabled, the Access Vector Cache (AVC) messages
    are found in /var/log/messages. If auditing has been enabled, they will be in
    /var/log/audit/audit.log. Further details on configuring SELinux are beyond the
    scope of this book. It recommend that you read the documentation on the Web site
    of your chosen distribution as well as the official SELinux site (www.nsa.gov/selinux/).


    # TCP/IP Stack Hardening


    Some means of attacking a computer system do not rely on weaknesses in the software
    that is providing a service but introduce weaknesses in the underlying communications
    protocols. For Internet-connected systems, this means attacking weaknesses in
    the various protocols that make up the TCP/IP suite. Furthermore, some of these
    weaknesses are intrinsic to the protocols that work, and they cannot be removed.
    In those cases, you can still fine-tune the systems to make your hose more resistant
    to those attacks.


    With all security measures, they come with a cost. A SYN attack when an attacker
    initiates a high number of connections by sending a SYN packet, but the attacker
    never completes the TCP handshake. This causes the target machine to wait, with
    memory and CPU cycles being used on these half-open connections. The depletion
    of resources can cause performance degradation for all users of the system as
    well as reduce resources to the point where legitimate clients cannot make connections.
    One method of reducing your risk from such an attack is to reduce the length of
    time a connection can be in half-open state before it is dropped, freeing up the
    resources. The downside to this approach is that legitimate clients traversing
    high-latency networks could have problems establishing a connection due to the
    short timeouts.


    ![](img/33fc180c04c8f96c022bce6e62ae12fd_375_0.png)'
  merge: -1
  pgno: 375
- img_proc: true
  md: 'The way that you tune these settings, at least some distributions, is through
    the sysctl utility. This utility allows you to configure kernel parameters at
    run time. You can add settings to a script at system startup, desired. If you
    enter sysctl - grep net.ipv4 you will see the list of available TCP/IP variables.
    In the previous example, to reduce the timeout of half-open connections, you would
    use the following command:


    ```

    sysctl -w net.ipv4.tcp_synack_retries=3

    ```


    The default value is 5, which means the half-open connection will not be dropped
    until three minutes have passed. Setting it to a value of 3 will only result in
    a 45-second timeout. Other values are possible, with a 1 equaling about nine seconds
    before timeout. You can see, these changes will have a significant impact on the
    functionality of the host system, so they should be used with care. Following
    is a list of variables you might want to research and consider:


    +   - net.ipv4.tcp_synack_retries Number of retransmissions in an attempt to complete
    the three-way handshake; a lower number is more resistant to attack.


    +   - net.ipv4.tcp_max_backlog Number of half-open connections that can be in
    the queue at any time; a high number is more resistant to attack, at the cost
    of system memory.


    +   - net.ipv4.icmp_echo_ignore_broadcasts=1 Tells the system not to respond to
    a ping to a broadcast address. This value is the default anyway.


    +   - net.ipv4.conf.all.accept_redirects=0 & net.ipv4.conf.all.send_redirects=0
    Tells the system not to listen to ICMP redirects, which could be used to alter
    routing tables.


    +   - net.ipv4.conf.all.accept_source_route=0, net.ipv4.conf.all.forwarding=0
    and net.ipv4.conf.all.me_forwarding=0 Together these disable source routing, which
    is rarely used for anything other attack attempts.


    +   - net.ipv4.conf.rp_filter=1 Tells the system to drop packets when the source
    and destination are not based on the interface they come in.


    +   - net.ipv4.conf.tcp_syncookies=1 Enables SYN cookies, allowing the connections
    to be made without using the listen queue at any. If this setting is enabled,
    the net.ipv4.tcp_max_syn_backlog setting will have no effect. It is recommended
    to enable this setting.


