  md: '# # Minimizing Services


    Like a Windows system, your chosen Linux distribution will likely be installed
    with a large number of programs configured to run automatically, without human
    intervention. On Windows systems these programs are called services; on Linux
    they are called daemons. In an effort to minimize the amount of software that
    is running and reduce the number of software targets a hacker might try to exploit,
    you should disable any daemons that are not needed. Determining which daemons
    will require some investigation and testing. You''ll find a list and description
    of daemons in Fedora Core 5 at www.mjmwired.net/resources/mjm-services-fc5.html.


    To configure the daemons, navigate to System | Administration | Services. Fedora
    actually uses the Windows terminology to refer to the daemons as services.* This
    will open the GUI interface shown in Figure 10.1.


    # ## Figure 10.1 Daemon Control Panel


    ![](img/33fc180c04c8f96c022bce6e62ae12fd_363_0.png)


    Highlighting a service in the leftmost pane will pull up a description and some
    additional details in the Description and Status panes. Disabling a service is
    as easy as removing the check mark next to the service in question, clicking Save
    in the upper-right corner of the window and rebooting.


    ![](img/33fc180c04c8f96c022bce6e62ae12fd_363_1.png)'
  merge: -1
