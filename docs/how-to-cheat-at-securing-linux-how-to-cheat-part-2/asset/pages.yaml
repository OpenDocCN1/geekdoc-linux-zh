  md: '# Chapter 9 • Perimeter Security, DMZs, Remote Access, and VPNs


    in an Internet café. SSL VPNs also provide support for authentication methods
    and protocols, some of which include:


    +   - Active Directory (AD)

    - Lightweight Directory Access Protocol (LDAP)

    - Windows NT LAN Manager (NTLM)

    - Remote Authentication Dial-In User Service (RADIUS)

    - RSA Security’s RSA ACE/Server and RSA SecureID


    Many SSL VPNs also provide support for single sign-on (SSO) capability. More sophisticated
    SSL VPN gateways provide additional network access through downloadable ActiveX
    components, Java applets, and installable Win32 applications. These add-ons help
    remote users access a wide range of applications, including:


    +   - Citrix MetaFrame

    - Microsoft Outlook

    - NFS

    - Remote Desktop

    - Secure Shell (SSH)

    - Telnet


    However, note that not all SSL VPN products support traffic at the application
    level, blocking worms and viruses at the gateway. SSL VPN can also block traffic
    not bound to any IP address; however, unlike IPsec VPN, connections can be maintained
    as the client moves. SSL VPN differs from IPsec VPN in that it provides fine-tuned
    access control. By using SSL VPN, each resource can be defined in a very granular
    manner, as far as a URL. This feature of SSL VPN enables remote workers to access
    web sites, applications, and file servers. From IPsec VPN, the entire corporate
    network can be defined in a single statement. SSL-based VPN uses Secure HTTP,
    port 443. Many corporate network firewalls allow outbound access for port 443
    from any computer in the corporate network. In addition, since HTTPS traffic is
    encrypted, there will be limited restrictive firewall rules for SSL VPN.


    # Cons


    As you know, SSL-based VPN offers a greater choice of client platforms and is
    easy to use. However, an organization that wants to be sure their communication
    channel is encrypted and well secured will never assume that any computer in an
    Internet café is trusted. This requires a trust association with an un-trusted
    client connection. To address the concern


