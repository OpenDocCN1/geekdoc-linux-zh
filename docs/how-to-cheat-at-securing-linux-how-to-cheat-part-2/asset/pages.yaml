  md: '# Perimeter Security, DMZs, Remote Access, and VPNs · Chapter 9 331


    of an untrusted client, a client from an untrusted platform to the VPN, a small
    applet is downloaded to the client that searches for malicious files, processes,
    or ports. Based on the analysis of the client, the applet can restrict the types
    of client that can connect. This may sound feasible; practically, it requires
    the mapping of policies of one anti-virus and anti-spyware tool to an endpoint
    security tool used by VPN. In addition, these applets are prone to evasion and
    can be bypassed. However, note carefully: you also need to have administrative
    access to perform many of the operations like deleting files, deleting cookies,
    clearing cache and so forth. If you have administrative rights in an Internet
    cafe, be assured that the system will be infected with keystroke loggers, sophisticated
    remote access tools like Back Office or ICMP as a communication channel and RC4
    to encrypt the payload.


    By using VPN, a user can download sensitive files or confidential, proprietary
    data. This sensitive data has to be deleted from the local computer when using
    an SSL VPN is terminated. To ensure the safety of confidentiality, a sandbox is
    proposed and used. A sandbox is used to store any data downloaded from a corporate
    network via SSL VPN. After the SSL VPN session is terminated, the data in the
    sandbox is securely deleted. After a session is terminated, all credentials require
    deletion as well. You might happen that a user can leave the system unconnected.
    To prevent such issues, periodic authentication is required in systems. SSL VPN
    works on the boundary of Layers 4 and 5, each application has to support its use.
    In IPsec VPN, a large number of static IP address can be assigned to the remote
    client using RADIUS. This in provides the flexibility to filter and control the
    traffic from source IP address. In the case of SSL VPN, the traffic is normally
    from a single address, and all client sessions originate from this single IP.
    Thus, a network administrator is unable to allocate privileges configurations
    as IPsec VPN to control access to internal resources. Another cause of concern
    with SSL-based VPN is packet drop performance. IPsec will drop the packet at the
    IP layer, whereas SSL will take it up in the OSI model before dropping it. Hence,
    a packet will have to be processed before it is dropped. This behavior of SSL-based
    VPN can be misused, to execute Dos attacks and, if exploited, can result in a
    high capacity usage scenario.


    # Using the X Window System


    X window is the underlying management system for Unix and Linux GUIs. It takes
    an entirely different architectural approach than a Microsoft Windows system,
    in that the X Window system is set up in a client-server architecture from the
    beginning, similar to VNC. When reading the X Window documentation, you will find
    that they use the terms server and client in the reverse of what would seem intuitive,
    meaning the server is where display is being generated, not the remote machine
    you are connecting to. Most current implementations are based on the work of the
    X.Org foundation (http://x.org), which is the


