  md: '# Bastion Host Maintenance and Support


    At this point you should be comfortable with the tools required to securely administer
    your Linux bastion host. Ongoing maintenance must be performed on a schedule.
    Changes should be handled in a systematic fashion. You should define maintenance
    windows and a change control policy which patches and upgrades are approved, implemented,
    and reviewed. Joining one of the many vulnerability mailing lists will help you
    stay informed about new vulnerabilities as quickly as possible.You bet the serious
    hackers are all members of those mailing lists, so you should probably be too.


    There should be a policy in place for log collection and review. Logs should be
    recorded, preferably on a read-only media for archival purposes. Logs should be
    regularly reviewed and suspicious activity investigated. This last point is key;
    all often logs generated by many no one looks at them. Use of automated tools
    like swatch and Logcat can help minimize the labor involved in log analysis, but
    there will still be events that need to be looked at more closely. Remember that
    security is an ongoing process that requires continued education and effort to
    be hacker-proof as possible.


    # Linux Bastion Host Checklist


    Use the following checklist when hardening your Linux bastion host. These steps
    are not specific to any particular role (such as a web server or SMTP relay).
    All these steps are critical; making any single one could leave you vulnerable
    to hackers and result in a compromised system.


    +   1. Research your needs for a Linux bastion host (support, media, functionality),
    and select a distribution accordingly.


    +   2. Plan the partition layout, and give some foresight to providing space for
    the operating system, swap partition, system logs, and system data.


    +   3. Install the OS, and remove and disable any optional software and services.


    +   4. Apply patches and updates to the system kernel and software as needed.


    +   5. Remove/minimize processes using the SUID or SGID bit.


    +   6. If mandatory access control is desired, implement SELLinux.


    +   7. Harden the TCP/IP stack.


    +   8. Configure TCP Wrappers.


    +   9. Configure the Netfilter firewall via the GUI or IPTables tool.


    +   10. Apply any needed encryption for sensitive data.


    +   11. Enable and configure auditing as required.


    +   12. Apply scheduled maintenance to keep the system secure.


    ![](img/33fc180c04c8f96c022bce6e62ae12fd_395_0.png)'
