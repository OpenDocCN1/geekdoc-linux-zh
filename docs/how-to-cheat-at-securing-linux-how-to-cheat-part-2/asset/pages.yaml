    # Controlling and Auditing Root Access with Sudo


    +   - Sudo (Superuser Do) allows an administrator to give specific users or groups
    the ability to run certain commands as root or as another user.


    +   - Sudo features command logging, command restrictions, centralized administration
    of multiple systems, and much more.


    +   - The sudo command is used to execute a command as a superuser or another
    user. In order to use the sudo command, the user must supply a username and password.
    If a user attempts to run the command via sudo and that user is not entered in
    the sudoers file, an e-mail is automatically sent to the administrator, indicating
    that an unauthorized user is accessing the system.


    # Managing Your Log Files


    +   - Logging allows administrators to see who and what has accessed their system.
    Many helpful Linux log files are located in the /var/log directory.


    +   - Linux offers commands that allow administrators to access useful log files.
    Two commands of interest are last and lastlog. The message file also offers useful
    data for determining security breaches on your system.


    +   - The logs should be checked frequently to determine if any security violations
    have occurred on your system. Logs do not offer solutions, so you must analyze
    the data and decide how to counteract the attack.


    # Using Logging Enhancers


    +   - Logging enhancers are tools that simplify logging by allowing logging information
    to be filtered and often displaying logs in simplified formats.


    +   - Viewing text-based files with hundreds or thousands of entries can be burdensome,
    especially if you are only looking for one specific error entry.


    +   - Three popular logging services used by administrators are SWATCH, scanlog,
    and the next generation of syslog (syslog-ng).


