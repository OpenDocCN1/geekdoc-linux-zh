    # Patching and Updates


    Configuring your bastion host is a never-ending process. As new vulnerabilities
    are discovered and new features are added to software, you will need to upgrade
    your host to the most current version, especially if the updated version addresses
    a security flaw. Along the lines, new versions of the core OS files will be released
    periodically. These updates, referred to as kernel patches, are similar in function
    to Microsoft hotfixes that address core operating system functionality. Some kernel
    patches will be for features or options that don''t apply to you, in which case
    you do not need the patch. Beware that kernel patches can be applied incrementally,
    as they are released, or you can download and apply the latest kernel in its entirety.


    # Updating Software Packages


    Keeping individual software packages up to date is pretty simple, and there are
    a couple of approaches you can take. The most straightforward method is to use
    the following RPM refresh (-F switch) on an installed package:


    ```

    rpm -F apmd-3.2.2-3.2.i386.rpm

    ```


    When you freshen a package, the newer version is installed, but only if an earlier
    version already exists. A good alternative is to use the upgrade option (means
    of the -U switch), which will install the new package, whether it is currently
    installed or not, and will remove any previous versions of the package that are
    present. Many experts advise using-U all time instead of -I (for Install) to avoid
    any errors in case the package happens to already be installed on the system.


    ```

    rpm -U apmd-3.2.2-3.2.i386.rpm

    ```


    ![](img/33fc180c04c8f96c022bce6e62ae12fd_371_0.png)'
