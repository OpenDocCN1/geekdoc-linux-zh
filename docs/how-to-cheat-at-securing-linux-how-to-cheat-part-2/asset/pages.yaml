  md: '# Placing Your NIDS


    When it comes to implementing a network intrusion detection system (NIDS) like
    Snort, the single biggest factor in its effectiveness is its placement within
    the network. The value of the NIDS is in identifying malicious traffic and obviously
    it cannot do that if it cannot see the traffic. This means you want to place the
    NIDS in a location to maximize the data it will see. In smaller environments there
    may be only one switch or hub, this is a pretty simple decision. Depending on
    your objectives, you may place it inline with the Internet connection only, or
    that you are inspecting traffic only from the Internet. In a larger installation,
    you will need to place multiple network cards in the NIDS so that it can inspect
    traffic from several chokepoints in your network.


    ![](img/33fc180c04c8f96c022bce6e62ae12fd_174_0.png)


    Remember that an IDS is also a target for a hacker just like any other system,
    and even often so. As such, the IDS host system should be hardened and locked
    down as much as possible. In addition to being a target because it can alert administrators
    to their activities, the hacker might target the IDS system itself it often contains
    logs with valuable information in it various systems. The IDS also has the capability
    of capturing packets that match its rulesbase, and these packet dumps can contain
    valuable data as well. Don''t neglect your IDS or you may be creating a security
    liability instead of the asset you intended.


    Be cognizant of the fact that if you do choose to install multiple network cards
    to monitor segments that have the potential to create an alternate data path that
    enables traffic to bypass a firewall. As part of your hardening of the Snort host,
    you must ensure that routing is not enabled so that Snort cannot forward traffic
    from one segment to another. There are multiple approaches to protect against
    this opening. The simplest is to use a network tap instead of just plugging in
    a normal network card. A tap is a specially designed piece of hardware that will
    only listen to traffic but not transmit. Because it is hardware, there is no possibility
    of hacking the configuration or making a mistake in the configuration accidentally
    allowing routing. Unfortunately, network taps are not free. Disabling routing,
    ensuring the host has no static routes, and disabling any routing protocols is
    the free way to ensure that you don''t create a path around a firewall. Figure
    5.1 illustrates bypassing the firewalls using your IDS.'
  merge: -1
  pgno: 174
- img_proc: true
  md: '# Figure 5.1 Bypassing the Firewalls using the IDS


    ![](img/33fc180c04c8f96c022bce6e62ae12fd_175_0.png)


    The first dotted line (data flow #1) represents the desired (secure) data flow.
    Traffic from outside can only terminate on a server in a DMZ, and traffic going
    into the internal network can only come from a server in the DMZ. With this configuration
    traffic from the Internet can never pass all the way through to a host on the
    internal network. The second data flow,#2, represents how an incorrectly configured
    IDS could be used to route traffic from the outside (untrusted) network, into
    the internal network.


    When it comes to placement of your IDS, you need to be aware of the difference
    between a switch and a hub. A hub operates by sending any traffic it receives
    on any port to every other port. Therefore, when using a hub, the IDS will see
    all the traffic passing through that hub, which is what you want for your IDS.
    A switch is more advanced than a hub, and most new devices are switches. A switch
    listens and learns what machines are connected to which port. It uses this information
    to construct a forwarding table. After it has learned which given host is on,
    it will then send traffic destined for that host to that specific port. This means
    that without any additional configuration, when you plug your IDS into a switch
    port, it''s not going to be seeing much traffic.'
  merge: -1
