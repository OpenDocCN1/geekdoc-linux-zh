    profiles and reboot the system. This section briefly describes the process of
    configuring AppArmor on your SUSE Linux server.


    Most of the common application and services profiles are created by default by
    AppArmor. When you add new applications and services you can create profiles individually
    for these applications. Make sure you stop the applications before you create
    profiles. When you create the profile, AppArmor runs autodep to analyze and create
    an initial profile for the application. A manual profiling is very much required
    to restrict the application too granular to the directories required to perform
    its runtime functions. AppArmor has a learning mode to monitor various access
    of the application when you run the same. Information gathered by the learning
    mode is in the initial profile created by AppArmor. Creating profiles for critical
    applications ensures the application run in a specific security environment ensuring
    no damage to the system due to the vulnerabilities that may get developed time-to-time.


    You need to configure AppArmor to immunize programs that may grant privileges,
