    network. An information bulletin from the U.S. Department of Energy’s Computer
    Incident Advisory Capability can be found at http://ciac.inl.gov/ciac/bulletins/j-043.html.
    The bulletin is titled “Creating Login Banners” and explains what is required
    within login banners for government computers. It also includes how to create
    banners and provides the text from the approved banner for Federal Government
    systems.


    +   **Limit system resource usage** If you limit system resource usage, you can
    reduce the changes of server failure from a Dos attack. If you choose to limit
    system resource usage in Bastille, the following changes will occur:


    +   Individual file size is limited to 40MB.


    +   Each individual user is limited to 50 processes.


    +   The allowable core files number is configured to zero. Core files are used
    for system troubleshooting. They are large and exploitable if a hacker gains control
    of them: they can grow and consume your file system.'
