    > NOTE

    If a syntax error exists in the sudoers file and you choose Q to quit and save
    the vis changes, sudo will not run until the problem is corrected. You must run
    visudo again, fix the problem, and save the file again. It is recommended that
    you select e to attempt to fix the problem, or x to exit without saving (if you
