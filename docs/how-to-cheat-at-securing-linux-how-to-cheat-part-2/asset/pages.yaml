    # Demonstrating Effectiveness


    One of the age-old debates when it comes to network data collection is placement
    of the sensors. This applies to both IDS sensors and reporting sensors as PRTG
    Traffic Graph. The most common difference of opinion is whether you should place
    the sensor outside your firewall or inside it. It is relevant that the data you
    will see be drastically different between the two. With the sensor placed outside
    your perimeter firewall, you will see all traffic directed from the Internet,
    including all the traffic your firewall is blocking. If the sensor is placed inside
    the perimeter firewall, you will only see the traffic that has managed to pass
    through your firewall.


    Undeniably, the traffic of the most security relevance is the traffic that has
    managed to traverse your firewall and get into your internal network. These are
    the potential attacks, probes, and what needs to be installed and monitored closely
    to make sure the network is not compromised. If everything is configured properly,
    an IDS the perimeter should really see very little traffic, except perhaps related
    to IT policy, such as file sharing or instant messaging protocols. So if all triggers
    a data security officer would find “interesting” is on the inside, what might
    you value a sensor on the outside would.


    The best value for placing a sensor outside is really one of public relations.
    The unfortunate fact is that when it comes to network security, everything is
    done properly, no one


    ![](img/33fc180c04c8f96c022bce6e62ae12fd_191_0.png)'
