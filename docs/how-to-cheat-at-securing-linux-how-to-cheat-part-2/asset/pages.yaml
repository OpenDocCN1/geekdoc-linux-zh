    \n# # How Does It Work?\n\nThis section provides an overview of how sniffing takes\
    \ place, and gives background information on how networks and protocols work.\
    \ However, there are many other excellent resources available, including the most\
    \ popular and undoubtedly one of the best, Richard Stevens’ “TCP/IP Illustrated,\
    \ Vol. 1–3.”\n\n# # Explaining Ethernet\n\nEthernet is the most popular standard\
    \ used to enable computers to communicate. A protocol is like speaking a particular\
    \ language. Ethernet was built around the principle of a shared medium where all\
    \ computers on the local network segment share the same channel. It is known as\
    \ a *broadcast* protocol because it sends data to all other computers on the same\
    \ network segment. This information is divided into manageable chunks called *packets*,\
    \ and each packet has a header containing the addresses of the destination and\
    \ source computers. Even though this information is sent out to all computers\
    \ on a segment, the computer with the matching destination responds. All of the\
    \ other computers on the network still see the packet, but if they are not the\
    \ intended receiver they discard it, unless a computer running a sniffer, puts\
    \ its NIC into *promiscuous mode*. This means that the sniffer can see all of\
    \ the traffic on the segment regardless of whether it is being sent to them. Normal\
    \ computers run in non-promiscuous mode, listening for information ignored for\
    \ themselves. However, when a NIC is in promiscuous mode, it can see conversations\
    \ to and from all of its neighbors.\n\nEthernet addresses are also known as Media\
    \ Access Control (MAC) addresses and hardware-addresses. Because many computers\
    \ may share a single Ethernet segment, each one must have an individual identifier\
    \ hard-coded to the NIC. A MAC address is a 48-bit number, which is also stated\
    \ as a 12-digit hexadecimal number. This number is broken down into two halves:\
    \ the first 24 bits identify the vendor of the Ethernet card, and the second 24\
    \ bits comprise a serial number assigned by the vendor.\n\nThe following steps\
    \ allow you to view your NIC’s MAC address:\n\n+   - Windows 9x/ME Access Start\
    \ | **Run** and type winipcfg.exe. The MAC address will be listed as the “Adapter\
    \ Address.”\n\n+   - Windows NT, 2000, XP, and 2003 Access the command line and\
    \ type **ipconfig** /all. The MAC address will be listed as the “Physical Address.”\n\
    \n![](img/33fc180c04c8f96c022bce6e62ae12fd_228_0.png)"
  merge: -1
  pgno: 228
