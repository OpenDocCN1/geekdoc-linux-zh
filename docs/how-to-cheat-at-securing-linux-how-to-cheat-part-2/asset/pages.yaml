  md: '# Chapter 7 • Network Analysis, Troubleshooting, and Packet Sniffing


    A network analyzer is a combination of hardware and software. Although there differences
    in each product, a network analyzer is composed of five basic parts:


    +   - Hardware Most network analyzers are software-based and work with standard
    operating systems (OSes) and network interface cards (NICs). However, some hardwarenetwork
    analyzers offer additional benefits such as analyzing hardware faults (e.g., cyclic
    redundancy check (CRC) errors, voltage problems, cable problems, jitter, jabber,
    negation errors, and on). Some network analyzers only support Ethernet or wireless
    adapters, while others support multiple adapters and allow users to customize
    their configurations. Depending on the situation, you may also need a hub or a
    cable to connect to the existing cable.


    +   - Capture Driver This is the part of the network analyzer that is responsible
    for capturing raw traffic from the cable. It filters out the traffic that you
    want to keep and stores the captured data in a buffer. This is the core of a network
    analyzer—you cannot capture data without


    +   - Buffer This component stores the captured data. Data can be stored in a
    buffer until it is full, or in a rotation method (e.g., a “round robin”) where
    the newest data replaces the oldest data. Buffer can be disk-based or memory-based.


    +   - Real-time Analysis This feature analyzes the data as it comes off the cable.
    Some network analyzers use it to find network performance issues, and network
    intrusion detection systems (IDSes) use it to look for signs of intruder activity.


    +   - Decode This component displays the contents (with descriptions) of the network
    traffic so that it is readable. Decodes are specific to each protocol, thus network
    analyzers vary in the number of decodes they currently support. However, new decodes
    are constantly added to network analyzers.


    > NOTE\NJitter is the term that is used to describe the random variation of signal
    timing (e.g., electromagnetic interference and crosstalk with other signals that
    can cause jitter). Jabber is the term that is used to describe when a device is
    improperly handling electrical signals, affecting the rest of the network (e.g.,
    faulty NICs can cause jabber).'
