    # Diffie-Hellman


    The biggest problem in symmetric cryptography is the security of the secret key.
    Obviously, you cannot transmit the key over the same medium as the ciphertext,
    since any unauthorized parties could use the key to decode the messages. Prior
    to the development of asymmetric cryptography and the Diffie-Hellman key exchange,
    secret keys were exchanged using trusted private couriers and other out-of-band
    methods.


    In the mid-1970s, Whitfield Diff and Martin Hellman published the Diffie-Hellman
    algorithm for key exchange, which allowed a secret key to be transmitted securely
    over an insecure line. This was the first published of public-key cryptography,
    and one of the cryptography field''s greatest advances. With the Diffie-Hellman
    algorithm, the DES secret key (sent with a DES-encrypted payload message) could
    be encrypted via Diffie-Hellman by one party, and decrypted only by the intended
    recipient.'
