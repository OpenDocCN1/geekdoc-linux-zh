    that has been through more peer review and testing than the commercial equivalent.
    It is not always true; in many cases the free software has very little quality
    control and you, the user, are really doing the testing. Basically, this means
    that the quality of free solutions will have a lot of variation. To increase the
    odds that you not trying to implement buggy software, do your homework. If you
