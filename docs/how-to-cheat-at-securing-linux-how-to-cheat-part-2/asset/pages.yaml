    stand up to current and future attacks, *speed* refers to the processing power
    and time required to encrypt and decrypt any message, and *ease of implementation*
    refers to an algorithm''s predisposition (if any) to hardware or software usage.
    Each algorithm has different strengths and drawbacks, and none of are ideal in
    every way. This section discusses the key algorithms, which fall into three main
    categories:


    +   - Symmetric cryptography

    - Asymmetric cryptography

    - Hashing algorithms


    # What Is Encryption?


    *Encryption* is a form of cryptography that "scrambles" plaintext into unintelligible
    ciphertext. Encryption is the foundation of such security measures as digital
    signatures, digital certificates, and the Public Key Infrastructure (PKI) which
    uses these technologies to make computer transactions more secure. Computer-based
    encryption techniques use keys to encrypt and decrypt data. A *key* is a variable
    (sometimes referred as a password) that is a large binary number—the larger, the
    better. Key length is measured in bits, and the more bits the more difficult the
    key will be to “crack.” For example, a 40-bit key is considered insecure by today’s
    standards, but it can have a value between 1 and 2^140 (1,099,511,627,776, over
    a trillion).


    The key is only one component in the encryption process. It must be used in conjunction
    with an encryption *algorithm* (a process or calculation) to produce the ciphertext.
    Encryption methods are usually categorized as either symmetric or asymmetric,
    depending on the number of keys that are used. These two basic types of encryption
    technology are discussed in the following sections.


    # Symmetric Encryption Algorithms


    The most widely used type of encryption is *symmetric encryption*, which is aptly
    named because it uses keys for both encryption and decryption processes. Symmetric
    encryption is also commonly referred to as *secret-key encryption* and *shared-secret
    encryption*, but all terms refer to the same class of algorithms.


    The reason symmetric encryption systems are abundant is speed and simplicity.
    The strength of symmetric algorithms lies primarily in the size of the keys used
    in the algorithm, as well as the number of cycles each algorithm employs. The
    cardinal rule is “fewer is faster."


    By definition, all symmetric algorithms are theoretically vulnerable to *brute-force*,
    which are exhaustive searches of all possible keys. Brute-force attacks involve
    meticulously guessing what the key to a message may be. Given that all symmetric
    algorithms have a fixed key length, there are a large number of possible keys
    that can unlock a message. Brute-force


