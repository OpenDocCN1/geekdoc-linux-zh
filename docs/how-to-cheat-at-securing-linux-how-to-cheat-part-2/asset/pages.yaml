    # Accidents Happen


    I saw a corporate firewall/DMZ with a connection that allowed traffic to completely
    bypass their Internet firewall. I do not know why this happened, because the organization
    was not lacking trained networking professionals. These types of errors could
    occur because someone didn''t analyze the implications of the changes adequately.
    Perhaps it was a "rush" to install some connectivity, or an emergency repair,
    or even a "temporary" fix. All of these would indicate poor change control procedures.
    It is also possible that someone didn''t realize the complete layout of the network
    when they made the connection in question, which could indicate inadequate network
    documentation among other things. In any case, these were trained professionals
    who should have known better, but accidents happen to the best of us.


    # Implementing Firewalls


    When it comes to selecting a firewall there are a host of factors to consider.
    For commercial offerings there is the first cost in addition to ongoing maintenance
    costs, which in cases can be considerable. Some commercial offerings run on their
    own base system (e.g., Cisco PIX). The underlying Linux system has so heavily
    modified it is now considered proprietary. In the case of a Linux firewall, you
    also have the option of installing the firewall software on a Compact Disk – Read
    Only Memory (CD-ROM) or pen drive. These steps are discussed in more detail in
    the following sections, along with specific configuration for setting up a free
    firewall on both Linux and Windows.


    # Hardware versus Software Firewalls


    Another consideration is whether the firewall decision-making logic run as software
    that sits on top of another functional system, or if the firewall is a dedicated
    piece of hardware. In the case of a Cisco PIX firewall, the smallest models are
    the size of a small cigar box and there is no OS other than the PIX software.
    This is a dedicated hardware device used to perform the firewall function, also
    called a firewall appliance. The other alternative is that the firewall is not
    a dedicated box, but a software component. Many popular firewalls take this approach
    as well, such as a checkpoint firewall that can be installed on top of a Windows'
