  md: "# Removing SUID Programs\n\nPrograms with the user ID (SUID) bit set will be\
    \ run with the permissions of the *owner*, not the user who is executing them.\
    \ Obviously this could pose a big security risk. If an attacker were to locate\
    \ a script with the SUID bit set and was owned by root, and if the attacker could\
    \ find a way to modify the script, he could do anything he wanted to the system,\
    \ as he were root. Although a script is the most likely target, an attacker could\
    \ also gain root access if he could execute a buffer overflow against a binary\
    \ program with the SUID bit set as well. The same considerations hold true for\
    \ files with the set group ID (SGID) bit set. You can create a listing of all\
    \ SUID and SGID files by entering the following command:\n\n```\nfind / -perm\
    \ -4000 -print\n```\n\nTo list files with the SUID bit set, use the following\
    \ command:\nfind / -perm -2000 -print\n\nThe list may be long, so redirecting\
    \ the output to a file for review might be advisable. Unfortunately some programs\
    \ will not function properly without the SUID or SGID bits set. Each instance\
    \ will need to be researched and possibly tested in a lab environment to determine\
    \ whether you can safely remove it. In all likelihood, either of those bits will\
    \ be needed on some files, but reducing the number of files to a minimum will\
    \ leave your bastion secure.\n all the obvious risks for using SUID and SGID programs,\
    \ you might be wondering if using them is a good idea or some evil to live with.\
    \ These bits can actually improve security in the right situation. For example,\
    \ if a user needs to perform a routine maintenance action that requires root privileges,\
    \ normally he needs to know the root password to perform the task. By setting\
    \ the file SUID and having it owned by root, you can give the user only permissions\
    \ to execute the file but not modify it. Now he can perform the required task\
    \ without ever knowing the root password.\n\n# SELinux Policy Development\n\n\
    SELinux, which stands for *security-enhanced Linux*, was developed in partnership\
    \ with the National Security Agency (NSA). It provides a higher level of security\
    \ by enforcing access control (MAC) through the kernel rather than by running\
    \ additional processes in the user space. Because the enforcement can restrict\
    \ the actions of any process, even a superuser (i.e., root) process. In fact,\
    \ as far as the underlying components of SELinux are concerned, there is no concept\
    \ of a root user, only security policies and security contexts. SELinux is available\
    \ for many Linux distributions (see which ones at http://selinux.source.org/distros/redhat.php3)\
    \ and comes included in, such as Fedora Core. You can read the FAQ from the NSA\
    \ at www.nsa.gov/selinux/info/faq.cfim for more information.\n\n![](img/33fc180c04c8f96c022bce6e62ae12fd_373_0.png)"
  merge: -1
