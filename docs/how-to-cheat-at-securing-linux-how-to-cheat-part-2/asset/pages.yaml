  md: '# Introduction


    You have hardened your system using source tools. Changes are constantly made
    to production systems. In addition, malicious users are constantly discovering
    and exploiting new weaknesses.This chapter discusses how to scan or penetration
    test your systems for weaknesses that may already exist or may develop. Penetration
    testing your own network will help you to see potential weaknesses through the
    eyes of an attacker, and will help you to close the holes. You will learn how
    to scan your hard drive, and then scour processes to determine if problems exist.
    Finally, you will learn how to deploy the Nessus scanner to test for common server
    weaknesses. By the end of this chapter, you will a system that is reasonably secure,
    and can actually test additional servers for vulnerabilities.


    # Scanning


    During the scanning phase


    # Enumeration


    So, what is enumeration? Enumeration is a fancy term for listing and identifying
    the specific services and resources that are offered by a network.You perform
    enumeration by starting with a set of parameters, like an IP address, or a specific
    Domain Name Service (DNS) entry.Your goal for enumeration is a list of services
    that are known and reachable from your source. From those services, you move into
    deeper scanning, including security scanning and testing, the core of penetration
    testing. Terms such as banner grabbing and fingerprinting fall under the category
    of enumeration.The most common tools associated with enumeration include nmap,
    when run with the -sV -O flags, and map.


    An example of successful enumeration would be to start with host 10.0.0.10


