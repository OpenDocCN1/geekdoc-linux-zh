  md: '# Chapter 9 · Perimeter Security, DMZs, Remote Access, and VPNs


    implementation of the X11 protocol. A closely related project is the XFree86 Project
    (www.free86.org), which is the open source version of the XWindow system (which
    uses the X11 protocol). X11 is the protocol that is used to transfer information
    about the GUI between the server and the client. The end result of these design
    decisions is that like Windows'' build-in terminal server, two Linux systems can
    remotely access each other via a GUI virtual desktop.


    You can configure the X Window System to permit connections from remote systems
    without any third-party software. While this works, the evolution of desktop Window
    Managers and common software packages rendered this method inefficient. A more
    robust way to accomplish the same thing is NX technology developed by NoMachine,
    which is a highly optimized process and protocol to make X sessions available
    for free (client and server) from www.nomachine.com/download. Commercial variants
    are also available. You can see the differences between versions, and see what
    the limitations of the free version are at www.nomachine.com/features.php. The
    big limitation is that NX Free Edition limits you to only two concurrent connections.
    In most cases this won''t be of limitation unless you are trying to use it as
    a full-blown terminal server solution than just a remote access mechanism.


    An open source version of the NX server is called FreeNX and is available from
    http://freenx.berlos.de/. FreeNX does not support relaying sounds to the client
    (while the NoMachine server does). This is the recommended server and the one
    used in the following examples.


    To set up the FreeNX server, download and install FreeNX whatever method is appropriate
    for your Linux distribution. For Fedora Core 5, I used yum install freenx.Yum
    (the package installer for Fedora Core 5) will automatically check and install
    all dependencies. The aforementioned command also installed the core nx package,
    and expected as dependencies. In the case of Fedora Core 5, there is no need for
    further installation. Depending on the distribution you are using, the installation
    may be more involved. Most of the major distributions should have packages available
    that make the installation painless. You will need SSH listening on port 22 in
    order for NX to work properly.


    > TIP


    If you are running the services in an attempt to verify that the FreeNX server
    was installed successfully (via config or the like), you will not see it listed.
    This is because the FreeNX server does not sit and listen on a port for an inbound
    connection like most servers. Instead, when you login via SSH (this is why you
    need SSH running on port 22), it logs you in as a special user (NX). That user''s
    profile is configured so that executes a process to start up the server and listen
    for the inbound connection.


    ![](img/33fc180c04c8f96c022bce6e62ae12fd_348_0.png)'
