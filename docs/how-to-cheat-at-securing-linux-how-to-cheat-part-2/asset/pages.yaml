  md: '# Network Analysis, Troubleshooting, and Packet Sniffing Chapter 7


    utilities and caring log entries. Intruders also install other programs as sniffers,
    key backdoor access software. Windows sniffing is often accomplished as part of
    a Remote Admin Trojan (RAT) such as SubSeven or Back Orifice. Intruders often
    use sniffing programs that are configured to detect specific things (e.g., passwords),
    and then electronically send to them (or store them for later retrieval by the
    intruder). Vulnerable protocols for this type include Telnet, File Transfer Protocol
    (FTP), Post Office Protocol (POP3), Internet Message Access Protocol (IMAP), Simple
    Mail Transfer Program (SMTP), Hypertext Transfer Protocol (HTTP), Remote login
    (login), and Simple Network Management Protocol (SNMP).


    One example of a rootkit is "T0rnKit," which works on Solaris and Linux. The sniffer
    that is included with this rootkit is called "torns" and is installed in the hidden
    directory /usr/sec/put/. Another example of a rootkit is Linux Rootkit 5 (Lrk5),
    which installs with the linsniff binary.


    Intruders may use sniffing programs to control back doors. One method is to install
    a sniffer on a target system that allows for specific information and then sends
    the backdoor control information to a neighboring system. This type of backdoor
    control is hard to detect, because of the passive nature of sniffers.


    cd00r is an example of a backdoor sniffer that operates in non-promiscuous mode,
    making it even harder to detect. Using a product like Networked Messaging Application
    Protocol (Nmap) to send a series of TCP SYN packets to several predefined ports
    will trigger the backdoor to open up on a pre-configured port. More information
    about cd00rc can be found at www.phenoit.de/stuff/cd00rc.


    > A rootkit is a collection of Trojan programs that are used to replace the legitimate
    programs on a compromised system or are replaced by ps, ifconfig, and ls to avoid
    detection. Some common commands change. Rootkits can also install software as
    sniffers.


