  md: 'Presenting the Business Case for Open Source Software • Chapter 1


    # Comparing Free Solutions with Commercial Solutions


    When it comes to making an informed decision as to whether to purchase a commercial
    solution or implement a free solution, there are some additional non-dollar-related
    consider-ations to take into account. First and foremost, compare like functionality.
    Don''t compare the deluxe version of the commercial product to the free version;
    they won''t have the same features or learning curve, or require the same hardware.
    Ultimately, by making the most informed and well-reasoned comparison possible,
    the best solution will be chosen.


    # Strengths of Free Solutions


    One advantage free solutions have over their commercial counterparts is that of
    devel-velopment speed. This varies from one product to another; not all free products
    have quick development cycles. The open-source packages offer very fast development
    cycles and can address the latest security issue more quickly than their commercial
    counterparts. If you want to stay on the cutting edge, free software (especially
    open-source software) might be a better path than commercial solutions.


    Previously, we discussed customization as a cost savings with free software. This
    is because you can do the customizing yourself instead of paying the vendor to
    do it for you. Customization is worth mentioning as a strength of it, above and
    beyond the cost savings. Again, not all free software is customizable. Sometimes
    the best software in a particular-category uses closed code and there is no way
    for you to perform any customization. But one of the greatest strengths of the
    open-source movement is that anyone and everyone has the freedom to edit, customize,
    and improve the software.


    A potential strength of free solutions is the speed with which they can be implemented
    (which is different from the development speed). When I speak of the implementation
    speed of free software I am referring to the time it takes to get the software
    loaded and working. This includes not only installation, but also the red tape
    sometimes involved in making significant purchases. For example, suppose you are
    trying to form a business partnership that will be beneficial to your organization.
    The nature of the partnership is that time is of the essence; the sooner the partnership
    is completed. The partnership involves net-connectivity to facilitate the exchange
    of information. After reviewing the plans of how it would be done, your potential
