  md: '# Presenting the Business Case for Open Source Software • Chapter 1


    new firewall, it takes longer to do if they are familiar with the firewall. This
    inefficiency costs the time to complete a task; however, if any outage or business
    disruption occurs, the delay could result in lost profit or business. These delays
    must be accounted for when planning projects and other activities.


    Free solutions are usually produced by small organizations or by an individual.
    These solutions may do an excellent job in their assigned roles, but may not be
    well known. This could be a liability if the individual who configured your free
    solution leaves or is otherwise unavailable. If you have a PIX firewall that works,
    you probably would not have a hard time locating a resource. On the other hand,
    if you need someone to take the administration of an obscure free solution, finding
    someone could be difficult. This difficulty could manifest itself as a hidden
    cost by increasing the delay before a problem can be addressed, having to pay
    a premium for a consultant, or by number of other inefficiencies.


    # The Savings of Using Free Solutions


    The following section discusses how a free solution can save you money. The primary
    savings are obvious: you didn''t pay for the product; however, there are additional
    benefits. This section offers a detailed look into the benefits of using free
    software. By evaluating the expected savings and costs, you can form a more practical,
    accurate picture of what will be gained by implementing a free solution.


    # Purchase Costs


    The purchase cost is one of the single largest costs of using free software. The
    best example of this is with firewalls. A small Linksys or Netgear firewall costs
    around $20.00 to $50.00. They use almost no power, support port forwarding, perform
    Network Address Translation (NAT), as a Dynamic Host Configuration Protocol (DHCP)
    server, and are stateful packet filters. Suppose you use Linux and netfilter to
    run a firewall for free. Odds are will cost more for the employee''s time to set
    up the Linux firewall than the Linksys would cost to buy. Firewalls are one of
    the examples of how readily affordable commercial solutions can be.


    You can still save money on purchases. Some types of products, particularly IDSes,
    work analysis and reporting tools, and commercial Virtual Private Network (VPN)
    solutions can cost staggering amounts of money. When comparing prices, come as
    close as possible to comparing like products. Using the most expensive "deluxe"
    suite as available as the price for decision making is misleading. The free solution
    will not have the same features and capabilities as the commercial version. Look
    at the features you think you need a starting point for which commercial products
    would be viable options. Use the costs of those products as your basis for determining
    what the free solution will save you.


    ![](img/33fc180c04c8f96c022bce6e62ae12fd_21_0.png)'
