    # Linux Firewall Operation


    Before diving into the specific commands to configure the Linux firewall, we will
    cover some basic Linux firewall vocabulary and how the firewall operates. netfilter
    contains the firewall logic, and iptables is the program that is used to modify
    the rules of the firewall uses (See the netfilter home page at www.netfilter.org/)
    These rules (or ACLs) define the rules used to permit or deny packets and how
    to react to denied packets. The current iptables use both tables and chains. Tables
    are the blocks of processing where various actions are performed on the packets.
    Different tables process different chains. Chains are a set of rules (or ACLs).
    There are four built-in chains: nat, mangle, filter and raw, each of which processes
