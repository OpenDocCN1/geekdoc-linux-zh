  md: '# Controlling Access to Resources


    The majority of the steps so far have been focused on controlling how a user can
    interact with the bastion host. Most of the steps so far were made under the assumption
    that the user already has connectivity to the bastion host, from which programs
    the SUID bit set to the security context they use and the services that are available.
    Following a defense-in-depth philosophy, the next steps are to restrict who can
    interact with the bastion-host. By restricting who may communicate with the bastion
    host, in addition to restricting what they do once they have established communication,
    we come closer to a hacker-proof system.


    # Address-Based Access Control


    From a networking perspective, the most common way to limit access is based on
    the IP address of the foreign system. A traditional firewall falls into this category.
    In this section we discuss some of the ways you can restrict access on the IP
    address of the systems in question.


    # Configuring TCP Wrappers


    TCP Wrappers function similarly to a firewall, except where a firewall permits
    or denies traffic based on data contained in the IP header of the packet, TCP
    Wrappers filters access to services on the host it is running on. Services that
    are compiled against the libwrap library make use TCP Wrappers. When enabled,
    TCP Wrappers'' attempts to access a given services will be compared against the
    /etc/hosts.allow file and the /etc/hosts.deny file. Rules are checked sequentially,
    and processing of the rules stops when a match is found. For example, if you wanted
    to allow only connections from Synergy.com to SSH on your bastion host while rejecting
    all other attempts, you would have the following lines in your hosts.allow and
    deny files:


    ```

    /etc/hosts.allow

    sshd :synergy.com

    ```


    ```

    /etc/hosts.deny

    sshd : ALL

    ```


    These two files accept several wildcards, such as ALL, LOCAL, KNOWN, UNKNOWN,
    and PARANOID.You can enable logging in the rule files as well, and configure the
    facility and severity of the log entry. With TCP Wrappers'' limited functionality
    and syntax, why might wonder why you would ever use it over simply the Linux firewall,
    IPTables. Because IPTables works at the packet level, if you want to deny access
    to a process, such as HTTP, you must do it based on port number. So if you use
    IPTables to explicitly block attempts to port 80, the Web server tells it to listen
    on port 8080, the connection will be allowed. With TCP Wrappers, you permit or
    deny access to a process. This distinction could prove invaluable if you have
    a service that


    ![](img/33fc180c04c8f96c022bce6e62ae12fd_378_0.png)'
