  md: '# Chapter 2 • Hardening the Operating System


    A: In order to generate sudo log files, you must create a /var/log/sudo file,
    and add an entry to the syslog.conf file. Since the default log facility is local2,
    you must add the fol-lowing line with TAB keys separating the facility (local2.debug)
    from the destination (a local logging file).


    ```

    local2.debug                              /var/log/sudo

    ```


    You must then restart syslogd to ensure that it re-reads the file.


    Q: I am tired of entering my password in sudo each time my ticket expires. How
    can I avoid this hassle?


    A: Use the NOPASSWD tag in sudoers for specific users and commands by inserting
    the tag before the command list. If you want to disable all sudo passwords, there
    are two methods. You can run configure with the —without-passwd option, or you
    can add !authenticate to the Default line in sudoers. Finally, you can disable
    passwords to users and hosts in sudoers by adding specific user or host Defaults
    entries. The sudo man file for specifics on disabling sudo password prompts.'
