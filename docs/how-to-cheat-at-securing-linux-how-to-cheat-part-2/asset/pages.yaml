    and better logging. You could contact a vendor, wait for a response, get a quote
    on the price, and pass that to your manager for approval. After your manager approves
    the purchase, you hand it to accounting and they make the purchase and arrange
    shipping. Once it arrives, you must install and configure the new firewall and
    then


