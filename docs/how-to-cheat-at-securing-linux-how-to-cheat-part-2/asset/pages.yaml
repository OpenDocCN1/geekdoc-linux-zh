  md: '# Output Plug-Ins


    Detection plug-ins are installed exactly the same way as statically built preprocessor
    plug-ins are.


    Output plug-ins, also known as postprocessor plug-ins, run after the Snort detection
    engine. These plug-ins control where the result of the analysis will be sent.
    This can be a log file, a database, or a socket for communicating with another
    process. Currently, these plug-ins have to be statically compiled into Snort when
    it is built; they cannot dynamically be loaded.


    The database plug-ins are particularly useful for using Snort for special purposes.
    They allow most of the useful information about the network activity to be extracted
    and analyzed by other applications or for doing things as a SQL database. The
    information can be used as a historical analysis of events on your network (e.g.,
    when did we first seeing port 0 probes)?


    The API for output plug-ins is very similar to that of static preprocessor plug-ins.
    There is a function that registers the module and functions for the main processing,
    for a clean exit, and one for a restart that must be registered. Documentation
    and examples for the output plug-ins do not explicitly exist; again you need to
    look at the source code for the standard output plug-ins. It''s not as hard as
    it sounds; if you are comfortable with creating a static preprocessor plug-in,
    you will have no problems with writing an output plug-in if you really need to
    create a new one.


    By appropriately combining custom rules, precessing plug-ins, detection plug-ins
    and postprocessing plug-ins, you can create a highly crafted Snort installation
    that can be utilized for many special purposes beyond the stock IDS function that
    it provides.


    # Snort Inline


    Snort is traditionally used as an IDS, but it can also play an active role in
    your network security and be used as an intrusion prevention system. Snort must
    be specially compiled to use this mode, and you must be running on a Linux system
    that supports iptables. Once Snort inline is built and installed, you now have
    a system that can act as an integrated IDS and firewall system. When running in
    this mode, you have three additional rule types that you use.


    The first is drop, which will drop any packet that satisfies the rule. The second
    is reject, which will send a TCP reject or an ICMP unreachable message to the
    originator and drop the packet when the rule is triggered. Both of these will
    log the event in the Snort logs.


    The Snort inline mode is capable of replacing a packet in a limited way. The original
    packet and the new packet have to have the same length. Even so, this provides
    some inter-


    ![](img/33fc180c04c8f96c022bce6e62ae12fd_212_0.png)'
