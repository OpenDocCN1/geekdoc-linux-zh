  md: 'Chapter 2 • Hardening the Operating System


    # # Determining Ports to Block


    When determining which ports to block on your server, you must first determine
    which services you require. In most cases, block all ports that are not exclusively
    required by these services. This is tricky, you can easily block yourself from
    services you need, especially those that use ephemeral ports, as explained earlier.


    If your server is an exclusive e-mail server running SMTP and IMAP, you can block
    all TCP ports except 25 and 143, respectively. If your server is an exclusive
    HTTP server, you can block all ports except TCP port 80. In both cases, you can
    block all UDP ports since SMTP and IMAP use TCP exclusively.


    However, if you want to use your server as an HTTP client (i.e., for accessing
    system updates) or as an e-mail client to a remote server, you will restrict the
    system by doing this. Clients require registered UDP ports for DNS, as well as
    registered TCP ports for establishing connections with Web servers.


    If you only open the corresponding UDP ports 25, 80, and 143, DNS requests are
    blocked because DNS queries use UDP port 53, and DNS answers use a UDP registered
    port (e.g., the response www.syng.com). Even if you use port 53, a different registered
    port may be assigned each time for the answer. Attempting to allow access to a
    randomly assigned registered port is almost impossible and a waste of time. The
    same problem applies with TCP connections that require ephemeral ports.


    Therefore, you should either open all TCP/UDP registered ports (so you can use
    your server as a client), or block them (except for the services you require)
    and access resources, such as operating system updates, another way. You can download
    the updates from another computer.


    # # Blocking Ports


    To block TCP/UDP services in Linux, you must disable the service that uses the
    specific port. You may use the GUI interface of firewall services offered by most
    of the Linux distributions. In Red Hat Enterprise Linux (RHEL) 5, System | Security
    Level and Firewall opens up the firewall configuration utility. Figure 5 shows
    the firewall is enabled and the selected services are trusted to run.


