    encryption, supporting a lot of public key authentication ciphers and symmetric
    key encryption ciphers. It can operate in tunnel mode to provide a new IP header
    that masks the original source and destination addresses in addition to the data
    being transmitted. Since IPSec uses protocols other than TCP and UDP, getting
