    With all of this information circulating in your head, you''re probably wondering
    which is available for free? Generally, you can find many varieties of firewalls
    that perform some type of stateful inspection. Application gateways are not readily
    available for free. In reality, few organizations have the funds to use application
    gateways extensively. One ramification of not using an application gateway is
    that you need to ensure that the service is exposed to un-trusted traffic is as
    secure as possible and that the server itself is hardened against attack. Keeping
    the service patches up-to-date will help reduce the odds that an application-level
    attack will be successful.


    # Firewall Architectures


    The most securely configured firewall in existence will not provide protection
    if a network was not designed properly. For example, if the firewall was installed
    into an environment that allows an alternate network path that bypasses the firewall,
    the firewall would only be providing a false sense of security. This is an architectural
    error that would render the firewall useless. In short, where the firewall is
    implemented is every bit as important as how it is implemented. The first step
    to installing anything is always planning. What follows is a discussion of the
    most common firewall architectures, in increasing order of security. Remember,
    these sections are discussing firewall architectures independent of the firewall
    type. For example, you could use a packet-filtering firewall, a stateful inspection
    firewall, or an application gateway in any of the designs discussed in the next
    section.


    # Screened Subnet


    A screened subnet is the simplest and most common firewall implementation. Most
    small businesses and homes use this type of firewall (see Figure 9.1). This design
    places the firewall on the edge of your network, dividing everything (from the
    firewall''s point of view) into internal and external, with nothing in between.


    ![](img/33fc180c04c8f96c022bce6e62ae12fd_290_0.png)'
