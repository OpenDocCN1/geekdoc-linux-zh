  md: '# Introduction


    When it comes to securing networks, the first items that come to mind are firewalls,
    which are the primary gatekeepers between an organization''s internal network
    and the outside world. While a properly implemented firewall can be one of the
    most effective security tools in your arsenal, it shouldn''t be the only tool.
    The adage defense-in-depth” means that you should have multiple layers of security.
    Using a defense-in-depth configuration, if one component of your defense failed
    or was defeated, there would still be a variety of other fallbacks to protect
    your network. With the availability of increasingly affordable firewalls such
    as the Popular Links cable/digital subscriber line (DSL) router, using the free
    alternatives may not be as attractive for some. With a little effort, however,
    you will find the free alternatives are more configurable, allowing greater flexibility
    and control than the “home office” grade offerings.


    This chapter focuses on securing your network perimeter. Remember that although
    the most common way to implement a firewall is between an internal network and
    the outside (often the Internet), do not limit yourself to placing firewalls only
    on the network edge. A firewall should be in any place where you want to restrict
    the flow of traffic. The current trend of security breaches originating from the
    inside of the network (often employees or ex-employees), companies are increasingly
    relying on firewalls to isolate and filter traffic between portions of the internal
    network.


    This chapter reviews some basic firewall concepts and discusses the different
    architectural ways to implement a firewall. The meat of this chapter discusses
    the installation and configuration of firewalls to run on your Linux-based systems.
    Finally, once the network edge has been adequately secured, we discuss how to
    create controlled, secure paths through the perimeter for remote connectivity,
    including administrative access or remote office/work from home scenarios.


    # Firewall Types


    No discussion of firewalls would be complete without a discussion of the different
    types of firewalls. This is particularly true in this context, because it allows
    you to better understand exactly where in the spectrum the firewall offerings
    lie. In the networking sense, a firewall is basically any component (software
    or hardware) that restricts the flow of network traffic. This is a sufficiently
    broad definition to allow for all of the various ways people have chosen to implement
    firewalls. Some firewalls are notoriously limited in capability and others are
    extremely easy to use.


    Within the realm of firewalls there are many different ways to restrict network
    traffic. Most of these methods vary in the level of intelligence that is applied
    to the decisionmaking process. For example, to permit or deny traffic based on
    which network device is the sender or recipient, you would use a packet-filtering
    firewall. In reality, even the simplest


    ![](img/33fc180c04c8f96c022bce6e62ae12fd_288_0.png)'
