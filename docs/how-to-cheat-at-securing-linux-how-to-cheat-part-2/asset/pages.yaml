  md: '# Installing and Configuring Snort and Add-Ons • Chapter 5


    mance improvements such as faster logging. If you are looking for a particular
    feature or option, you should do searching on the Internet, and you might find
    that the functionality you are looking for already exists. If you do an add-in
    that you are interested in using, remember to properly test it before deploying
    it in a production environment.


    # Using Oinkmaster


    You may get tired of constantly having to update the Snort signature files. Because
    Snort is a signature-based IDS, with current signatures you could be unaware of
    intrusion attempts happening right in front of you. Although Snort itself does
    not include any means to automatically update the signature file, there is another
    utility that can help called Oinkmaster (http://oinkmaster.sourceforge.net/features.html).
    Oinkmaster is a Perl script that will update your rules from the Snort Web site
    automatically. Because it uses Perl, Oinkmaster will run on a Linux or a Windows
    host. The Oinkmaster Perl script can also be scheduled to run and check for updates
    as often as you like. To get Snort downloads without having to wait until the
    next release of Snort, you have to register on the Snort Web site. You can register
    for free at https://snort.org/pub-bin/register.cgi. A password will be sent to
    the e-mail address you provide during registration. The configuration of Oinkmaster
    is outlined here.


    +   1. After logging into the Snort Web site, click the link that says User Preferences.

    2. At the bottom of the page is a section titled Oink Code; click the Get Code
    button.

    3. Copy this code for use in the Oinkmaster configuration file.

    4. Download the latest tar.gz from the Oinkmaster Web site.

    5. Extract the folder in the archive to /etc/oinkmaster.

    6. Edit the oinkmaster.conf file. Find the line that specified the URL for the
    current-ruleset (You can search for CURRENT). Uncomment the line by removing the
    #, and then paste your oink code into the line in place of <inkcode>.


    ```

    url = http://www.snort.org/pub-bin/oinkmaster.cgi/<inkcode>/snortrules-snapshot-CURRENT.tar.gz

    ```


    +   7. Start Oinkmaster.pl -C /etc/oinkmaster/oinkmaster.conf -o /etc/snort/rules


    When it completes, Oinkmaster will tell you what rules were changed/updated. You
    can also specify the URL to retrieve the rules from the command line using -H
    <URL> option. To configure the Oinkmaster script to run daily, use crontab with
    the following command:


    ![](img/33fc180c04c8f96c022bce6e62ae12fd_189_0.png)'
