- img_proc: true
  md: 'ever sees much of anything. There are no flashing lights or alarms that say
    the network is functioning properly and securely. If you place an IDS on the outside
    of the perimeter, you can extract reports based on the traffic IDS. These can
    be used to demonstrate to management in concrete terms what your security efforts
    are accomplishing. Saying “the network is running fine” is great, but probably
    doesn''t have the impact that a one-page report with a pie chart would. An executive
    summary of the attacks the sensor has seen could list basic facts like “56,000
    instances of code red were blocked, up 5% from last month,” and so forth. With
    an old PC and a little up-front effort, these types of report would take very
    little effort to produce, but reap huge rewards when it comes to public perception
    of network security.


    When exposing any system to the Internet at large, remember that it will be attacked.
    If your IDS is outside your perimeter firewall, there is nothing protecting the
    IDS except the IDS itself. This means the IDS will need to be hardened and secured
    as much as possible to ensure that it doesn''t become a system for hackers to
    use. Under these circumstances, one of your best defenses would be for the IDS
    to use a network tap (not free) to ensure that it can only receive from the network
    and not transmit. There are various discussions on the Internet for making cables
    that can receive only. A little research will surely turn up some interesting
    designs to try. The success of these read-only cables will vary greatly depending
    on your system’s network card and the switch or hub you are connected to. While
    this doesn''t make the IDS sensor invulnerable to attacks or alleviate the need
    to harden it, this configuration will make it significantly harder to compromise.'
