  md: '# Perimeter Security, DMZs, Remote Access, and VPNs • Chapter 9


    +   - **ACCEPT** The packet is accepted and processed by the rest of the TCP/IP
    stack.

    - **DENY** The packet is dropped and no notice is given to the sender. While this
    does not honor the TCP/IP protocol specifications, it is considered the most secure
    option, it denies a hacker useful information about the firewall. This behavior
    also has a negative side effect, if there is a system trying to initiate a connection
    to a port that is blocked by a firewall, the connection attempt must time out
    before the initiating gives up. If you use REJECT, the Internet Control Management
    Protocol (ICMP) port will allow the initiating system to abort the connection
    attempted immediately.

    - **LOG** This allows you to perform kernel logging, which appears in the syslog
    log. Further options allow you to specify the log level and a descriptive prefix
    for the log entry.

    - **RETURN** Processing continues in the previous chain in the rule just after
    the last rule processed in that chain.

    - **QUEUE** This is a special target that will hold (or queue) a packet for processing
    by a userspace process.


    Unlike firewalls, netfilter allows you to apply multiple rulesets (chains) to
    the same interface. It may seem minor, this option creates a lot of powerful possibilities.
    For example, suppose you have an ACL and want to permit all packets originating
    on the 192.168.1.0 network except those from 192.168.1.11, which is a host that
    a third-party uses and is not a completely trusted system. You want packets sourced
    from 192.168.1.11 with a destination port of 22, 25, 53, 80, and 443 to be permitted,
    while all other packets are blocked. (see Figure 9.6).


