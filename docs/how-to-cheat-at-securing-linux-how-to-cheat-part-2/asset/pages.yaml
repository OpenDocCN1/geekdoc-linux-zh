  md: "# Figure 10.11 An IPTables Chain Listing\n\n```\n[root@localhost ~]# iptables\
    \ -L\nChain INPUT (policy ACCEPT)\n  target      prot source      destination\n\
    RH-Firewall-1-INPUT all    anywhere        anywhere\n\nChain FORWARD (policy ACCEPT)\n\
    \  target      prot source      destination\nRH-Firewall-1-INPUT all    anywhere\
    \        anywhere\n\nChain OUTPUT (policy ACCEPT)\n  target      prot source \
    \     destination\n\nChain RH-Firewall-1-INPUT (2 references)\n  target      prot\
    \ source      destination\nACCEPT     all     anywhere        anywhere\nACCEPT\
    \     icmp    anywhere        anywhere icmp any dpt:mdns\nACCEPT     udp     anywhere\
    \        224.0.0.251     udp dpt:udp\nACCEPT     udp     anywhere        anywhere\
    \        udp dpt:ipp\nACCEPT     tcp     anywhere        anywhere        tcp dpt:ipp\n\
    ACCEPT     all     anywhere        anywhere        state RELATED, ESTABLISHED\n\
    ACCEPT     tcp     anywhere        anywhere        state NEW tcp dpt:ssh\nREJECT\
    \     all     anywhere        anywhere        reject-with icmp-host-prohibited\n\
    [root@localhost ~]#\n```\n\nWith start, let's review some basic IPTables vocabulary.\
    \ iptables is the command-line utility for configuring the Netfilter firewall,\
    \ which is integrated with the Linux kernel. Specifically, Netfilter is actually\
    \ a set of hooks inside the Linux kernel that allows the various kernel modules\
    \ to interact with the network stack. In short, this is how the firewall to do\
    \ the actual work of packet manipulation.\n\n+   - Chains Basically, these are\
    \ access control lists that tell the firewall what to do. There are built-in chains\
    \ that are automatically processed by the tables (which start empty), and you\
    \ can create your own custom chains. Built-in chains are FORWARD, INPUT, OUTPUT,\
    \ PREROUTING, and POSTROUTING.\n\n+   - Targets dictate what action should be\
    \ taken when a rule is matched. The default targets are ACCEPT, DROP, QUEUE, and\
    \ RETURN."
