  md: '# WARNING


    If you find yourself having to make this kind of packet sniffing and such deep
    packet analysis, make sure that you are not violating your organization''s security
    and expectation of privacy policies by doing so. If you are an external security
    contractor doing this for a client, make sure that the client organization has
    given you explicit, legally binding permission, in writing, in order to conduct
    such an investigation. This "get out of jail free card" should include provisions
    that require the client to defend you in any lawsuit that arises as a result of
    your findings. You don''t want any employee of the client who gets fired as a
    consequence of your investigation (we have seen this happen!) by suing you! It''s
    important to do this right. Hire a lawyer to help you and then make sure the client
    signs a permission form before you do any work.


    Security incident handling is much like the forensics situation except that the
    goal is different. Instead of attempting to reconstruct the sequence of events
    and document everything that happened in the process, we are focused on finding
    out enough about the incident to mitigate the situation (although, it may turn
    out that you need to escalate the incident handling to a full-fledged forensic
    analysis).'
