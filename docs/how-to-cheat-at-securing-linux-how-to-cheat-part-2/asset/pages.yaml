  md: '# Chapter 2 - Hardening the Operating System


    facilities such as mail, news, auth, and so forth, and priorities ranging from
    alert to debug. Many programs use the facilities; so unneeded messages are written
    to their logs. In many cases, the message and the facility are not related. Syslog-ng
    filters based on message content in addition to the facility/priority pair. Using
    this method, only the messages that are needed are logged.


