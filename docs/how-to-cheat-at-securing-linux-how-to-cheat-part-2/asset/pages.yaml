    # Confidentiality


    The first goal of cryptography is confidentiality. Through the use of cryptography,
    users are able to ensure that only an intended recipient “unlock” (decrypt) an
    encrypted message. Most modern algorithms are secure enough that without access
    to the message “key” cannot read the message. Thus, it is extremely important
    to keep the secret key (when using symmetric algorithms) or private key (when
    using asymmetric algorithms) completely secret. If a secret or private key is
    compromised, the message essentially loses all confidentiality.


    ![](img/33fc180c04c8f96c022bce6e62ae12fd_277_1.png)


    Do not confuse confidentiality with authentication. Whether or not a person is
    allowed access to something is part of the authentication and authorization processes.
    An analogy: You are throwing a party. Because your house got trashed the last
    time, you want to ensure that only people who are invited attend. That is confidentiality,
    because you decided up front who would be invited. When the people come, they
    have to present an invitation to the doorman. That is authentication, because
    each guest had to show proof that they are who they claim to be. In general, confidentiality
    is planned in advance before authentication happens as a user attempts to access
    a system.


