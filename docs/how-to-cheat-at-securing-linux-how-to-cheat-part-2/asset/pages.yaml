    # Bad Key Exchanges


    Because there is no authentication built the Diffie-Hellman algorithm, implementations
    that use Diffie-Hellman-type key exchanges without some sort of authentication
    are vulnerable to MITM attacks. The most notable example of this type of behavior
    is the SSH-1 protocol. Since the protocol does not authenticate the client or
    the server, it''s possible for someone to eavesdrop on the communications. This
    deficiency was one of the main reasons that the SSH-2 protocol was completely
    redeveloped from SSH-1. The SSH-2 protocol authenticates both the client and the
    server, and prevents of any possible MITM attacks at least once. However, SSH-2
    is vulnerable to MITM attacks prior to the first key exchange between the client
    and the server.


    As an example of a MITM-type attack, consider that someone called Al is performing
    a standard Diffie-Hellman key exchange with Charlie for the first time, while
    Beth is in a position such that all interfere with Al and Charlie through her
    network segment. Assuming Beth not interfere with the key exchange, she will not
    be able to read any of the messages passed between Al and Charlie, because she
    will be unable to decrypt them. However, suppose Beth intercepts the transmissions
    of Al and Charlie''s public keys and responds to them using her own public key.
    Al will think that Beth''s public key is actually Charlie''s public key and Charlie
    will think that Beth''s public key is actually Al''s public key.


    When Al sends a message to Charlie, he will encrypt it using Beth''s public key.
    Beth once reads the message, she decrypts it using her private key. Then she encrypts
    it using Charlie''s public key and sends the message to Charlie. Charlie may even
    modify the message if she desires. Charlie then replies to Al and encrypts the
    message using Beth''s public key. Beth intercepts the message, decrypts it with
    her private key, and modifies it. Then she encrypts the new message with Al''s
    public key and sends it on Al, who receives and believes it is from Charlie.


    Clearly, this type of communication is undesirable, because a third party not
    only access to confidential information, but can also modify it at will. In this
    type of attack, no encryption is broken because Beth does not know either Al or
    Charlie''s private keys, so the Diffie-Hellman algorithm isn''t at fault. Because
    of the key exchange mechanism used by any PKE system. If the key exchange protocol
