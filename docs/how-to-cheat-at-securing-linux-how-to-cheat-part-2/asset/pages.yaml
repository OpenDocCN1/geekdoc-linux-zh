    # WARNING


    Because the oinkmaster.conf file contains the path to update your Snort

    rules, if this file does not have secure access permissions on it, someone who

    could edit the file could render your IDS useless. With the ability to edit the

    configuration file, a malicious user could point the url to one of his choosing,

    with empty rules that will not trigger on anything, or even worse, rules

    t work perfectly except ignore the attacker''s IP address. Make sure the

    oinkmaster.conf file is secured and only the account you are running

    oinkmaster under has access to the file.


