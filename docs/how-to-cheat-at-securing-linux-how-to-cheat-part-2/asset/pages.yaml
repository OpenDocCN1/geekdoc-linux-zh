    # The TCP Handshake


    An important concept of the TCP is{,}. Before any data can be exchanged between
    two hosts, they must agree to communicate. Host A sends a SYN flag set to Host
    B. If Host B is willing and able, it returns the SYN packet and adds an ACK flag.
    Host A begins sending data, and indicates to Host B that it also received the
    ACK. When the communication between the hosts ends, a packet with the FIN (finish)
    flag is sent, and a similar acknowledgement process is followed.


    # TCP Sequence


    Another important component of TCP is sequence identification, where each packet
    is part of a sequence. Through these numbers, TCP handles complex tasks such as
    retransmission, acknowledgement, and order.


    # UDP


    UDP packets are the connectionless equivalent to TCP, and are used for many purposes,
    the most important being that DNS uses UDP for most of its work. DNS finds out
    which IP address corresponds to hostname (e.g., www.example.com is not routable
    as an IP inside an IP datagram; however, through a DNS system it can find the
    IP address to route traffic). Other uses of UDP include VoIP and many online games
    and streaming media types.


