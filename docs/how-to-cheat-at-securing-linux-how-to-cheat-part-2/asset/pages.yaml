    is sometimes mitigated by high quality documentation, and in some cases extensive
    user forums where you can ask questions and receive help from the creator of the
    package or other users. On the other hand, high-quality documentation is the exception
    rather than the norm, and many of the free utilities have little in the way of
    documentation. This consideration is one of the biggest concerns for management.
    Generally speaking, the more critical the role of the security software is, the
    more hesitant you be about implementing a solution with minimal support. If you
    are a company that depends on the Internet, you should require a


