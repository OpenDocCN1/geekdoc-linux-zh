    # GUIs


    While the console commands that we use to manipulate and configure netfilter are
    not terribly complicated, they can sometimes get very lengthy. As the length of
    the command line grows, the chances of an accidental error increase. Alternatively,
    you may not like working on the command line, in which case there are a wide variety
    of GUI and menu-driven interfaces for netfilter. In most cases, these menu-driven
    interfaces use your input to create the appropriate iptables commands, and alleviate
    you having to know the various switches and options to use. There are a large
    number of GUI interfaces to configure your network firewall, which are listed
    in the following section in approximate order of use. All else being equal, I
    have demonstrated the GUIs that are available on a wide variety of platforms over
    an equal quality that only works with one distribution. In general, simply means
    less featured, so be aware that if you are trying to create a complex ruleset,
    some GUIs may not have the needed functionality.


    # Security Level Configuration


    You can start the iptables GUI provided with Red Hat-Linux distributions by navigating
    to System | Administration | Security Level and Firewall. You can also call the
    program directly by running system-config-securitylevel from a terminal. While
    the interface looks nice, it is limited in what it can configure. Basically, all
    you can do with this GUI is permit or deny certain ports. Fedora Core5 configures
    the INPUT and FORWARD chains to jump to a custom chain RH-Firewall-1-INPUT.There
    is no ability to differentiate between ports permitted in the INPUT or the FORWARD
    chain, because all rules configured through the GUI are applied to this custom
    chain.


    ```

    iptables -A RH-Firewall-1-INPUT -p tcp --m state NEW --dport 22 -j

    ACCEPT

    ```


    By expanding Other ports on the Firewall Options tab, you can enter a custom port
    number (see Figure 9.10).


