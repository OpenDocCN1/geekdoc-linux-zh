    # # Providing Secure Remote Access


    Sooner or later odds are good that you will either want or need the ability to
    work remotely. Providing remote access must be undertaken very cautiously, because,
    as soon as you allow an employee to connect to the corporate network, you have
    to some degree, extended your network boundary to your workstation. This means
    your network’s security is now as good as the security of the remote user’s system
    or network. In many cases no security at all. That is why remote access must only
    be granted after careful consideration and planning. While the different types
    of remote access pose different levels of security risk, there are some planning
    and configuration steps that are common to all of them.


    The first task is to determine what type of remote access is appropriate. With
    a virtual tunnel network (VPN), if the remote workstation is on the corporate
    network. This generally provides the greatest level of functionality, but also
    poses the greatest risk. If the remote system is compromised, an attacker is effectively
    inside your corporate network. While there are steps you can take to mitigate
    these risks, they may be time- and effort-intensive. To plan, configure, and properly
    secure a VPN solution is the most involved choice of the various remote access
    solutions you could provide.


    Another option is to provide remote desktop functionality. This would allow a
    remote user to see and use the desktop of a system at work. A remote desktop acts
    as if the user is at work, while a VPN acts as if the user’s computer is at work.
    This type of solution is slightly easier to implement, you can typically isolate
    the traffic that needs to be permitted through the firewall to a single TCP port.
    Many of the risks exist, however, that an attacker gains access to an internal
    desktop remotely, it is usually easy for them to move information out of the network
    or otherwise cause mischief. Another key with this type of solution is that you
    need to have a computer at home and a computer at work. With the VPN option, you
    only need to use one system, if the user has a laptop, it can be used while working
    remotely.


    The last and final option is that of a remote shell. Because most users do not
    operate extensively (if at all) in a console (ie, text) environment, this type
    of remote access is generally most viable for network administration personnel.
    While it may be impossible for accountants to operate their accounting program
    without a GUI, many network tasks and most firewall tasks can be performed with
    only terminal access. Because the widely used Telnet protocol sends all data unencrypted,
    any sensitive tasks should only be performed using a secured protocol such as
    shell (SSH), or Telnet over a Secure Internet Protocol (IPSec) tunnel.


    ![](img/33fc180c04c8f96c022bce6e62ae12fd_341_0.png)'
  merge: -1
  pgno: 341
- img_proc: true
  md: '# Providing VPN Access


    A virtual private network (VPN) is exactly what it sounds like, the connection
    you create is virtual, because you can use it over an otherwise public network.
    Basically, you take two endpoints for the VPN tunnel, and all traffic between
    these two endpoints will be encrypted so that the data being transmitted is private
    and unreadable to the systems in between. VPN solutions use different protocols
    and encryption algorithms to accomplish this level of privacy. VPN tend to be
    protocol independent, at least to some degree, in that the VPN configuration is
    not on a per-port basis. Rather, once you have established the VPN tunnel, all
    applicable traffic will be routed across the tunnel, extending the boundaries
    of your internal network to reach the remote host.


    One of your first considerations when planning to implement a VPN solution is
    the network design. Because the VPN tunnel needs two endpoints, one will be the
    remote workstation. The other will be a specially configured device for this purpose.
    This is generally called a VPN concentrator, because it acts as a common endpoint
    for multiple VPN tunnels. The remote systems will be using the concentrator as
    a gateway into the internal network, such as the placement of the concentrator
    is important. In a highly secured environment, the concentrator is placed in a
    DMZ sandwiched between two firewalls, one facing the Internet, and the other facing
    internally (see Figure 9.29). While this type of arrangement is the most secure,
    it takes more hardware to implement.


    Figure 9.29 VPN Concentrator Design


    ![](img/33fc180c04c8f96c022bce6e62ae12fd_342_0.png)'
  merge: -1
  pgno: 342
- img_proc: true
  md: 'Another way to place the VPN concentrator inside a DMZ is to use an additional
    interface on the firewall as the DMZ in a "one-legged" configuration. This saves
    you having to implement an additional firewall, but provides some isolation between
    the concentrator and the rest of the internal network. If an attacker compromised
    a remote host who VPND into the concentrator or compromised the concentrator themselves,
    they would still have a firewall between them and the internal network. The least
    preferable option it to place the concentrator inside the internal network. With
    this type of design, if the concentrator is compromised, the attacker would have
    full access to the internal network, with no firewalls to inhibit their activities.
    With any of these designs, you will have to permit the required ports through
    the firewall and forward them to your VPN concentrator.


    Another consideration is the type of VPN protocol you want to use. IPsec is a
    widely used VPN technology for good reason. It is interoperable. As a widely used
    and tested standard, IPsec will work with virtually any firewall and operating
    system. The disadvantage of IPsec is that it can be difficult to configure properly,
    and there is zero margin for error on the configuration. Both ends have to use
    the same parameters for encryption, hashing, and so forth, or the tunnel cannot
    be established. SSL is an increasingly popular choice for VPNs, because of its
    simplicity to implement.


    Once you have chosen a design and VPN technology, you need to consider the administrative
    ramifications of offering remote access. Some level of training will be required,
    the very least so they can use the VPN software. You should educate your users
    on good security habits as well. A determination will also need to be made as
    whether remote users are allowed to use their own personal computers, or if they
    must use a company-provided computer for remote access. The former option carries
    with it many risks. When a remote user connects their personal computer to the
    network (via a VPN) they may have spyware, a virus, or any number of potentially
    damaging conditions present on their system. Due to the fact that you probably
    do not have any administrative access to their systems, you have no way to secure
    the personal systems if you wanted this to. This is why most companies require
    that only corporate resources be allowed to connect to the company network. In
    the case of remote users, this typically means a company-provided desktop, but
    I have also seen instances of older desktops being sent home for remote access.'
