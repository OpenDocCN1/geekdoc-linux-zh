  md: '# Authentication Mechanisms


    Apache also includes several ways in which you can authenticate customers using
    your Web server such as LDAP, SecureID, and basic .htacces, to name a few examples.To
    authenticate mechanisms beyond basic .htacces, may compile additional functionality
    when you''re building Apache. Like access control, authentication mechanisms are
    specified as part of the <Directory> directive.


    The two steps to enabling basic .htacces user authentication:


    +   1. Creating an htpasswd file to store user credentials.

    2. Adding a <Directory> directive to the httpd.conf file to protect a directory
    structure.


    Let''s use an example to demonstrate how easy it can be to add authentication.
    In our example, we''ll secure a directory called /secure and permit only customers
    Elise and Margot access to the files in that directory.


    First, let''s create an htpasswd file somewhere in the Web server root directory
    by issuing the following command:


    ```

    htpasswd -c /usr/local/apache/passwdfile elise

    New password: *****

    Re-type new password: *****

    Adding password for user elise

    ```


    Next, we''ll add Margot to the list as well. This time we don''t need to use the
    -c argument, since our htpasswd file already exists:


    ```

    htpasswd /usr/local/apache/passwdfile Margot

    New password: *****

    Re-type new password: *****

    Adding password for user Margot

    ```


    Now that we''ve established our customer accounts, we''ll finish by adding a <Directory>
    directive to the httpd.conf file to protect the /secure directory as follows:


    ```

    <Directory /usr/local/apache/htdocs/secure

    AuthType Basic

    AuthName "Access for authenticated customers only"

    AuthUserFile /usr/local/apache/passwdfile

    Require user Margot elise

    </Directory>

    ```


    Now, when anyone attempts to access the /secure directory, they''ll be prompted
    for a username and password. Because we specifically require only Margot and Elise,
    only they will be permitted to use the directory structure, if they authenticate
    properly.


    ![](img/33fc180c04c8f96c022bce6e62ae12fd_413_0.png)'
  merge: -1
  pgno: 413
- img_proc: true
  md: '# Chapter 11 • Apache Web Hardening


    Let''s move on to discuss a couple other security-related <Directory> directives.


    # Directory Functionality Directives


    Within the <Directory> directive is a subdirective called Options that controls
    functionality for the directory structures specified in the <Directory> directive.
    The available options are listed in Table 11.3.


    # Table 11.3 Directory Options


    | Option | Functionality |

    | --- | --- |

    | All | Default setting; includes all options except MultiViews |

    | ExecCGI | Permits CGI script execution through mod_cgi |

    | FollowSymLinks | Allows Apache to follow OS file system links |

    | Includes | Permits SSI through mod_include |

    | NOXEXEC | Permits SSI but denies exec and exec cgi |

    | Indexes | Allows autoextending using mod_autoindex if no-indexed file is present
    |

    | MultiViews | Permits content negotiation using mod_negotiation |

    | SimLinksOwnerMatch | Allows Apache to follow OS file system links but only if
    the link and target file have the same owner |


    Many of the listed options are not relevant to our installation, since we disabled
    Includes and CGI during compile time. Regardless, a good default <Directory> directive
    disabling most options is shown here:


    ```

    <Directory "/usr/local/apache/httpdocs">

    Allow from all

    Options -FollowSymLinks -ExecCGI -Includes -Indexes \

    -MultiViews

    AllowOverride None

    </Directory>

    ```


    At this point, your Apache server should be relatively secure. Let’s discuss some
    Apache logging directives so that we can better monitor our server.


    # Logging Directives


    There are many reasons to configure logging on your Apache server. Whether you
    need to see page hits, hits of high volume traffic, or simply understanding who
    is using your system, logging plays an important part of any installation. More
    important, logging can


    ![](img/33fc180c04c8f96c022bce6e62ae12fd_414_0.png)'
  merge: -1
  pgno: 414
- img_proc: true
  md: '# Apache Web Server Hardening • Chapter 11


    provide a near-real-time and historic forensic toolkit during or after security
    events. In this section, we examine some logging configuration best practices.


    To ensure that your logging directives are set up correctly, we''ll provide an
    example of the Logging options in the Apache web server. Apache has many options
    with which you should familiarize yourself by reading

    http://http.apache.org/docs/2.0/mod/mod_log_config.html#logformat. This will help
    you understand the best output data to record in logs. Also, recall that we compiled
    Apache with mod_log_forensic, which provides enhanced granularity and logging
    before and after each success page.


    An example logging configuration is shown here:


    ```

    ErrorLog /var/log/apache/error.log

    LogLevel info

    LogFormat "%h %l %u %s %b \"Referer\i \"User-Agent\i" \%{forensic-id}n %b %b full"

    CustomLog /var/log/apache/access.log combined

    ForensicLog /var/log/apache/forensic.log

    ```


    This example provides a customized logging format that includes detailed output
    and places all the log files in the /var/log/apache directory.


    ![](img/33fc180c04c8f96c022bce6e62ae12fd_415_0.png)


    > It is good practice to archive your system and Apache log files to backup location.
    This prevents loss of critical forensic data due to accidental deletion or malicious
    activity.


    # Remove Default/Unneeded Apache Files


    After you''ve installed and configured your Apache server, you''ll need to do
    some quick cleanup of files that could represent a security threat. In general,
    you should not leave the source code you used to compile Apache on the file system.
    It''s a good idea to tar the files up and move them to a secure server. Once you''ve
    done so, remove the source code from the Apache Web server.


    You''ll also want to remove some of the default directories and files installed
    by the Apache Web server. To do so, execute the following commands on your Web
    server. If you have added content into your document root directory, you''ll want
    to find the first command:


    ```

    rm -fr /usr/local/apache/htdocs*

    rm -fr /usr/local/apache/cgi-bin

    ```


    ![](img/33fc180c04c8f96c022bce6e62ae12fd_415_1.png)'
  merge: -1
  pgno: 415
- img_proc: true
  md: '# 400 Chapter 11 • Apache Server Hardening


    ```

    rm -fr /usr/local/apache/icons

    ```


    After removing files, lets ensure that your Apache files have proper ownership
    and permissions before starting our server.


    # Update Ownership/Permissions


    As we discussed previously, the Apache Web server should be run as an unprivileged
    and unique account. In our example, we used the user wwwwur and the group wwwgrp
    to run our server. Lets make sure our permissions are properly set by running
    the following commands:


    ```

    chown -R root:wwwgrp /usr/local/apache/bin

    chmod -R 550 /usr/local/apache/bin

    chmod -R root:wwwgrp /usr/local/apache/conf

    chmod - 660 /usr/local/apache/conf

    chown -R root:wwwgrp /usr/local/apache/logs

    chmod - 664 /usr/local/apache/logs

    chown -R root /usr/local/apache/htdocs

    chmod -R 664 /usr/local/apache/htdocs

    ```


    # Monitoring the Server for Secure Operation


    Even with the best defenses and secure configurations, breaches in your systems
    and applications could occur. Therefore, you cannot simply up a hardened Apache
    Web server and walk away thinking that everything will be fine. Robust and comprehensive
    monitoring is perhaps the most important part of securely operating servers and
    applications on the Internet.


    Throughout this book, we have discussed myriad techniques to ensure your IT security.
    You must leverage all these secure DMZ functions in your job. With regard to Apache,
    there are several things to consider that will help you identify and prevent potential
    threats.


    Your primary source of data will be through Apache and OS logs. Even with small
    Web sites, sifting through this information can be a challenge. One of the first
    things to consider is integrating your Apache logs with other tools to help organize
    and identify the potential incident "needles" in your log "haystack". Many open-source
    and commercial products are available to aid you in securing your site. One open-source
    tool called Webizer, available at www.mrunix.net/webizer, which features graphical
    representation of your Apache log file contents.


    SNMP polling and graphing constitute another methodology commonly employed for
    secure monitoring. Often, it is extremely difficult to gauge the severity or magnitude
    of an event without visualization of data from logs or SNMP counters. One tool
    you might


    ![](img/33fc180c04c8f96c022bce6e62ae12fd_416_0.png)'
  merge: -1
  pgno: 416
- img_proc: true
  md: 'consider using a module called mod_apache_snmp, available at http://mod-apache-snmp.sourceforge.net/
    . The module can provide real-time monitoring of various metrics including, but
    not limited to:


    +   - Load average

    - Server uptime

    - Number of errors

    - Number of bytes and requests served


    You might consider other commercial SNMP-based solutions, especially for enterprise-scale
    deployments. These tools help expedite monitoring deployment and usually include
    enhanced functionality to automatically alert you when important thresholds, such
    as Web site concurrent connections, are crossed.'
