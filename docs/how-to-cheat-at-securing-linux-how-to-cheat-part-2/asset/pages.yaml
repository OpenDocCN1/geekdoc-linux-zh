    # Protocol Dissection


    Now that we''ve reviewed many of the critical portions of layers 1 through 4 of
    the OSI networking model, some attention should be paid to some of the protocols
    that you may run across using Wireshark. The larger the network you are sniffing,
    the more types of protocols (and protocol anomalies) you are likely to encounter.


    # DNS


    DNS translates hostnames to IP addresses, and vice versa. Most DNS traffic is
    transferred over UDP port 53 in a client/server fashion. DNS can be considered
    forward or reverse. Forward DNS translates a hostname into an IP address, and
    reverse DNS translates an IP address into a hostname. On the protocol level, forward
    and reverse lookups are nearly identical.


    To get an IP address from a given hostname, a DNS system (also known as a resolver)
    requests an address (A) record from a DNS server. In this example, we ask the
    authoritative name server for the IP address of www.example.com. In tcpdump format,
    we see the following:


    ```

    IP 192.168.0.1.33141 > 192.04.43.53: 42827+ A? www.example.com.

    IP 192.04.43.53 > 192.168.0.1.33141: 42827*- 1/2 A 192.04.34.166

    ```


