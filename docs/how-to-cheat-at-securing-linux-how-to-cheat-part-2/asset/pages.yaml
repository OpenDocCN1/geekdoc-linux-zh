  md: '# Apache Web Hardening • Chapter 11 395


    Also, configure the ServerAdmin directive with a valid alias e-mail address such
    as the following:

    ServerAdmin hostmaster@oursecureddomain.com


    This will provide a point of contact for your customers, should they experience
    problems with your site.


    # Performance/Denial-of-Service (DoS) Directives


    There are a number of performance-tuning directives in the Apache httpd.conf file.
    As a security professional, you should interpret these directives as DoS prevention
    statements, since they control resource allocation for users of the Apache server.
    The following directives control the performance of an Apache server:


    +   **Timeout** Configures the time Apache waits to GET requests, the time between
    TCP packets for POST or PUT requests, or the time between TCP ACK statements in
    responses. The Apache default is 300 seconds (5 minutes), but you might want to
    consider reducing this timer to 60 seconds to mitigate DoS attacks.


    +   **KeepAlive** Configures HTTP1.1-compliant persistence for all web requests.
    By default, this is set to On and should remain high to ensure streamline communication.


    +   **KeepAliveTimeout** Determines the maximum time to wait before closing an
    inactive, persistent connection. Let''s keep this value at the default of 15 seconds,
    since raising it can cause performance problems on busy servers and expose you
    to DoS attacks.


    +   **StartServers** Designates the number of child processes to start when Apache
    starts. Setting this value higher than the of 5 can increase server performance,
    but use care not to set the value too high, because doing so could saturate resources.


    +   **MinSparseServers** This setting, the MaxSparseServers setting, allows for
    dynamic adjustment of Apache child processes. MinSparseServers instructs Apache
    to maintain the specified number of idle processes for new connections. This number
    should be relatively low except on very busy servers.


    +   **MaxSparseServers** Maintains Apache idle processes at the specified number.
    Like MinSparseServers, this value should be low, except for busy sites.


    +   **MaxClients** As its name implies, this setting determines the maximum number
    of concurrent requests to the Apache server. We''ll leave this at the default
    value of 256.


