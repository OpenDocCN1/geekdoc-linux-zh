  md: '# Introduction


    You can make effective ruleset of Snort by simply building and installing the
    strict source code and using the generic rules. However, if you are willing to
    write custom rules or write specialized plug-ins for augmenting preprocessing,
    detection, or postprocessing, then a new universe of possible uses presents itself.
    We will look at some of these possibilities by looking at various security requirements
    and how they might be implemented.


    First''s look at just what these enhancing elements are and what kinds of things
    they can do for us.


    # Monitoring the Network


    There is always an issue on how to actually get monitored packets physically into
    Snort. With a network hub, it is just a matter of hooking it up to the Ethernet
    interface that you intend to use as Snort''s monitor port. These days, hubs are
    found on only very small networks that do not have much traffic on them. The real
    problem is what to do for a switched network. The question on how to monitor a
    switched network is one of the official Snort FAQs.


    The answer depends on the type of switch you use, the capabilities of your Snort
    system, and if you have a managed switch, you can usually put it into a mode where
    all traffic that crosses the switch can be mirrored onto one of the switch ports
    (which is where you connect the Snort monitor interface). This configuration is
    called SPAN for Cisco switches; other manufacturers use terms such as port mirroring
    or monitoring for the same process. On some Cisco switches a similar mode called
    a VACL (VLAN Access Control List) can also be used.Use of this mode on a busy
    network can be problematic because it puts a heavy burden on the switch''s CPU
    and can affect the performance of the switch. And, of course, if there is more
    than 1GB of total traffic crossing the VLAN (which is given multiple high-speed
    connections), the span port won''t be able to send all the traffic to Snort no
    matter what you do. If your network uses multiple VLANs, this can be a serious
    problem you need to set up a separate SPAN port for each VLAN.


    # VLAN


    Plugging a hub into the switch and plugging Snort into that is not a very good
    idea, except possibly for monitoring the traffic that traverses a network (e.g.,
    the traffic that moves in and out of a DMZ subnet, but not within the subnet).
    This is because the introduction of such a hub in an unswitched environment has
    a huge impact on the performance of the network.


    Another alternative is to use a passive network tap. This hardware aggregates
    the data on a switch and makes it available for monitoring. Passive network taps
    relieve the


    ![](img/33fc180c04c8f96c022bce6e62ae12fd_198_0.png)'
  merge: -1
  pgno: 198
- img_proc: true
  md: '# Advancned Snort Deployment • Chapter 6 183


    switch of burden of aggregating the data, and they offer a good feature in that
    are completely invisible to the monitored network. The problem with a network
    tap is they require the Snort system to have two monitoring interfaces—one for
    each direction the data moves on the network. Now the two data streams must be
    combined somehow to be able to get a complete picture of what is happening on
    the monitored network. Channel bonding (as trunking), combining two network interfaces
    into a single logical one (this is more commonly done to provide improved network
    throughput) is one effective way to accomplish this combining of the data streams.
    Network taps are also a significant cost element in the implementation of an intrusion
    detection system (IDS).


    # Configuring Channel Bonding for Linux


    Setting channel bonding for Linux systems is straightforward. First, the kernel
    must be configured to support bonding. When you are configuring the kernel, the
    option for bonding driver support under the network device support menu should
    be set. If the bonding driver is as a module (this is the easiest to manage),
    then there will be a module called bonding.o. Once the kernel supporting bonding
    is running or the bonding module is loaded, the interface can be started. For
    distributions that configuration control like Red Hat, the following needs to
    be done to the interface.


    First, create a file ifcfg-bond0 in the directory /etc/sysconfig/network-scripts.
    This file should look like this:


    ```

    DEVICE=bond0

    BOOTPROTO=none

    ONBOOT=yes

    NETWORK=192.168.10.10

    NETMASK=255.255.255.255

    IPADDR=192.168.10.254

    USERCTL=no

    ```


    This sets up the virtual network interface, bond0 in this case. If the kernel
    is using bonding as a module, the modules.conf file should contain the entries
    alias bond bonding, which associates the module with this virtual interface. You
    still need to define which physical interfaces should be combined to implement
    the virtual interface. For eth0, the file ifcfg-eth0 should be edited to look
    like:


    ```

    DEVICE=eth0

    BOOTPROTO=none

    ONBOOT=yes

    MASTER=bond0

    SLAVE=yes

    USERCTL=no

    ```


    ![](img/33fc180c04c8f96c022bce6e62ae12fd_199_0.png)'
