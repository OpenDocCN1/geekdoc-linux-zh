    # # Frequently Asked Questions


    The following Frequently Asked Questions, answered by the authors of this book,
    are designed to both measure your understanding of the concepts presented in this
    chapter and to assist you with real-life implementation of these concepts. To
    verify your questions about this chapter answered by the author, browse to www.syngress.com/solutions
    and click on “Ask the Author” form.


    **Q:** What can I do to protect my network from sniffers?


    **A:** Proper network security comes by design, not just through action. Some
    argue that there is nothing you can do to make your network completely secure.
    A combination of network access controls like 802.1ix, ubiquitous and opportunistic
    encryption, and strategies and policies will go a long way to protecting your
    network from sniffers and other security issues. Using several layers of security
    is known as defense-in-depth, and is a standard best practice for secure network
    architectures.


    **Q:** What is opportunistic encryption that you speak of, and where can I buy
    it?


    **A:** Opportunistic Encryption is the practice where communication between two
    parties becomes encrypted, even when those parties cannot be assured of each other''s
    identity. More information on opportunistic encryption is available at www.en.wikipedia.org/wiki/Opportunistic_encryption_free_of_charge.
    Ubiquitous opportunistic encryption is the theory that any network communication
    can be encrypted, should be.


    **Q:** How can I ensure that my sniffing network traffic is legally?


    **A:** The best way to ensure that your sniffing activities are legal is to solicit
    expert legal counsel. In general, you should be safe if all parties to the communication
    that your sniffing acknowledge that they have no expectation of privacy on your
    network. These acknowledgments are in employment contracts, and should also be
    set as banners so that the expectation of no privacy is reinforced. It is advised
    that you get authorization (in writing) from your employer to use sniffing software.


    **Q:** Is a sniffer running a security breach on my network?


    **A:** Possibly. Check the source of the sniffing activity and verify that the
    interception has been authorized. Hackers and other network miscreants use sniffers
    to assist others


