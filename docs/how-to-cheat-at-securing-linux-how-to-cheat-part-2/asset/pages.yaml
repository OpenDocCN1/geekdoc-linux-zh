    next to Smart and click Save. The Smart alerts and other logs can be viewed on
    the "logs" tab. There are several subscreens that include a dropdown to select
    which subset of logs you want to see, with SSH, SmoothWall (which will show your
    recently applied patches), and several more. The "Web proxy" screen is only useful
    if you are using the Web proxy feature of the firewall. The "firewall" screen
    shows all blocked connections and allows you to filter by month and day. Lastly,
    the IDS screen shows events logged by the Smart IDS. Unfortunately, the commercial
    offering does not support logging natively, however you can export the log files
    to a text file. See Chapters 3 and 4 for more details on Smart.


    Another nice is the dynamic DNS support. There are various dynamic DNS servers
    that will allow you to use a consistent DNS name to refer to your IP address dynamic
    via DHCP. In order to do this, you typically install a small program on the host
    system that will periodically contact the DNS server and alert them to your current
    IP address. The service uses this information to update your DNS records. The
    SmoothWall firewall has the capability to perform these updates, to the major
    dynamic DNS providers. You can configure dynamic DNS support by navigating to
    the services | dynamic DNS page. Use the drop-down menu to select the dynamic
    DNS service you are using, fill in the rest of the information, and click Add.
    The firewall will then make the updates to the service and all of the hosts to
    IP mappings can be maintained in one place rather than having to install an agent
