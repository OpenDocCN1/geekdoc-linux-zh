  md: '# Introduction


    “Why is the network slow?”“Why can’t I access my e-mail?”“Why can’t I get to the
    shared drive?”“Why is my computer acting strange?” If you are a systems administrator,
    network engineer, or security engineer you have heard these questions countless
    times. Thus begins the tedious and sometimes painful journey of troubleshooting.
    You start to replicate the problem from your computer, but you cannot connect
    to the local network or the Internet either. What should you do? Go to each of
    the servers and make sure they are up and functioning? Check that your router
    is functioning? Check each computer for a malfunctioning network card?


    Now consider this scenario. You go to your main network switch or border router
    and configure one of the unused ports for port mirroring. You plug in your laptop,
    fire up your network analyzer, and use thousands of Transmission Control Protocol
    (TCP) packets (designed for port 25) with various Internet Protocol (IP) addresses.
    You investigate and learn that there is a virus in the network that spreads through
    e-mail, and immediately apply access filters to block these packets from entering
    or exiting your network. Thankfully, you were able to solve the problem relatively
    quickly because of your knowledge and use of your network analyzer.


    # What Is Network Analysis and Sniffing?


    Network analysis (also known as traffic analysis, protocol analysis, sniffing,
    packet analysis, eavesdropping, and so on) is the process of capturing network
    traffic and inspecting it to determine what is happening on the network. A network
    analyzer decodes the data packets of common protocols and displays the network
    traffic in readable format. A sniffer is a program that monitors data traveling
    over a network. Unauthorized analyzers are dangerous to network security because
    they are difficult to detect and can be inserted almost any-where, which makes
    them a favorite weapon of hackers.


    A network analyzer is a standalone hardware device with specialized software,
    or software that is installed on a desktop or laptop computer. The differences
    between network analyzers depend on features such as the number of supported protocols
    it can decode, the user interface, and its graphing and statistical capabilities.
    Other differences include inference capabilities (e.g., expert analysis features)
    and the quality of packet decodes. Although several network analyzers decode the
    same protocols, some will work better than others for your environment.'
