    underlying desktops, so you will need to do a little research to make an informed
    choice.


    # Additional Steps


    At this point, the basic system is in place.You have the desired software installed
    and should have the undesirable software removed. This covers the most basic of
    hardening steps. The next steps will allow you to drill down into some of the
    more granular aspects of bastion host hardening. Now let''s look at steps to synchronize
    time on the bastion host, keep the system patched, and more.


    # Configure Automatic Time Synchronization


    Having an accurate system is important to proper functioning of your bastion host.
    Accurate time on the bastion host is critical to having accurate audit logs, the
    ability to perform accurate forensics, and for maintaining secure (encrypted)
    communications. Fortunately, most distributions of Linux should support the newest
    versions of NTP by default.You will recall from the Windows chapter that different
    versions of NTP provide different levels of security:


    +   - NTPv1 No security features

    - NTPv2 Restrictions based on IP address, NTP traffic is unencrypted

    - NTPv3 Symmetric key encryption and authentication

    - NTPv4 Both symmetric encryption and PKI encryption


    In the case of Linux, all you need to do is install the NTPD service, if it''s
    not already installed, and configure it to start automatically for the appropriate
    run levels.You can configure some of the NTP settings by navigating to System
    | Administration | Date & Time.You can then click the Network Time Protocol tab,
    as shown in Figure 10.5.'
  merge: -1
  pgno: 369
- img_proc: true
  md: '# Figure 10.50 NTP GUI Configuration


    ![](img/33fc180c04c8f96c022bce6e62ae12fd_370_0.png)


    Unfortunately, the GUI interface only lets you configure basic options, like adding
    time servers. You should make sure **Synchronize System clock before starting
    service** is the only option checked under **Show Advanced Options**. To configure
    the NTP security settings, you need to edit the `/etc/ntp.conf` and some additional
    files located in `/etc/ntp/`. For secure synchronization with an NTP server, perform
    the following steps:


    +   1. Edit **`/etc/ntp.conf`** and add the time servers you want to get from;
    include the key to be used with each server, such as **server outtimeserver.com
    key 12345**.

    2. Ensure that **restrict default ignore** is in `/etc/ntp.conf` to set the default
    restrictions.

    3. If needed, add a restrict line for any servers you want to **accept NTP requests**
    from.

    4. Edit **`/etc/ntp/keys`** and configure a unique key to be used for each time
    server, using the desired algorithm; for example, **12345 A secretkey** would
    configure key #12345 as an ASCII string between eight characters, with a value
    of *secretkey*. This key must be in the keys file of both the NTP server and the
    client for this work.

    5. Add the keys to the **`/etc/ntp.conf`** file. For example, to add key 12345
    as a trusted key, enter **trustedkey 12345**.

    6. Restrict the NTP configuration files to be owned and readable only by root.'
