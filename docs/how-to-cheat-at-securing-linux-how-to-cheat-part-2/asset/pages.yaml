    This is all great information that you''re gathering, and Snort can collect it
    into a file as well as display to standard. Snort has built-packet-logging mechanisms
    that you can use to collect the data as a file, or sort it into directories, or
    store the data as a file. To use the snort-logging features, the command format
    is simple:


    ```

    # snort -dev -1 {logging-directory} -h {home-subnet-slash-notation}

    ```


    If you want to log the data into the directory /var/adm/snort/logs with the home
    subnet 10.1.0.0/24, you would use the following


    ```

    # snort -dev -1 /var/adm/snort/logs -h 10.1.0.0/24

    ```


    However, if you log the data in binary format, you don''t need all the options.
    The binary format is also known as the TCPDump formatted data file. Several packet
    sniffers use the TCPDump data format, including Snort.


    The binary format for Snort makes the packet collection much faster because Snort
    doesn''t have to translate the data into a human-readable format immediately.
    You only need two options: the binary log file option -L and the binary option
    -bFor binary packet logging, just run the following:


    ```

    # snort -b -L {log-file}

    ```


    For each log, Snort appends a timestamp to the specified filename. It''s great
    to collect the data. Now, how do you read it? What you need to parse is through
    Snort with filtering options. You also have the option to look at the data through
    TCPDump and Ethereal, as they use the same type of format for the data.


    ```

    # snort -d[e] -r {log-file} {tcp|udp|icmp}

    ```


    The last item on the line is optional if you want to filter the packets based
    on packet type (for example,TCP).To take further advantage of Snort''s packet-logging
    features, you can use Snort in conjunction with the Berkeley Packet Filter (BPF).
    The BPF allows packets to be filtered at the kernel level. This can optimize performance
    of network sniffers and log-


