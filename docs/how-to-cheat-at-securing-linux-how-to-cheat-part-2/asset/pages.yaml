    # Undo Bastille Changes


    At the time of this, a reliable undo feature did not exist in Bastille. To undo
    the changes, you can run through the configuration questions and select different
    answers. There are two other options. There is a Perl script named Undo.plo in
    the Bastille directory that is designed to undo all changes except for RPM installations.
    There is also a backup directory located at /root/Bastille/undo/backup that contains
    all the original system files that Bastille modified. The backup directory structure
    is the same as the system''s directory, so you can manually replace the files
    easily.


    You cannot undo your Bastille configurations by simply removing Bastille. If you
    do this, your changes will still be written to their specific files. If you want
    to remove the program and settings, you must undo your changes, and then remove
    the Bastille directory. The following steps demonstrate three ways to undo the
    changes that you implemented in Table 2.5.


    +   1. One method to undo Bastille configurations is to run through the configuration
    questions and select different answers.


    +   2. A second method to undo Bastille configurations is to run the automated
    Perl script The script is named Undo.plo, and is designed to undo all changes
    except for RPM installations. To run the Undo.plo script, access the Bastille
    directory and enter:


    ```

    ./Undo

    ```


    +   3. A third method to undo Bastille configurations is to manually remove the
    changes. This can be done by replacing each file that was changed with the backup
    files in the Bastille directory. The backup directory is located at:


    ```

    /root/Bastille/undo/backup

    ```


    ![](img/33fc180c04c8f96c022bce6e62ae12fd_57_0.png)'
