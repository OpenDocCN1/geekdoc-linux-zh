    **Q:** Are the concepts of confidentiality, integrity, and authentication limited
    to cryptography?


    **A:** Absolutely not! The concepts of confidentiality and integrity are part
    of the CIA principles and you will find them up in information security. In fact,
    a large portion of information security is concerned with keeping information
    on a need-to-know basis (confidentiality), making sure that you can trust information
    that you have (integrity). A non-cryptography-related example of what would be
    operating system access controls, file system verification tools like Tripwire,
    and firewall rules. That is not to say that authentication is not important, however.
    If you cannot determine whether or not people are who they claim to be, your security
    precautions become useless.


    **Q:** All of the algorithms in this chapter are theoretically vulnerable in some
    way, either by brute-force attacks or mathematical advances. Why are they used?


    **A:** Although none of the algorithms in this chapter are 100 percent unbreakable,
    they are an effective method for protecting confidential information. The main
    principle is that with algorithms like 3DES, AES and RSA, decrypting a simple
    piece of information will take tens, hundreds, or thousands of years. By then
    it is assumed that the information will no longer be valuable.


    **Q:** Are there any cryptography techniques that are 100 percent secure?


    **A:** Yes. The only OTP is absolutely unbreakable if implemented correctly. The
    OTP algorithm is actually a Vernam cipher, which was developed by AT&T in 1917.
    The Vernam cipher belongs to a family of called stream ciphers, which encrypt
    data in continuous stream instead of chunk-by-chunk method of block ciphers. There
    are two problems with using the OTP:You must have a source of truly random data,
    and the source must be bit-for-bit as long as the message to be encoded. You also
    have to transmit both the message and the key (separately), the key must remain
    secret, and the key can never be reused another message. If an eavesdropper intercepts
    two messages encoded with the same key, then it is trivial for the'
