  md: '# Summary


    This chapter covered the basics of hardening a server to avoid security vulnerabilities
    using Linux. The main sections covered disabling unnecessary services, locking
    down ports, Bastille, sudo, and logging enhancers.


    It is extremely important to install the latest service pack or updates to the
    operating system, which fix many security vulnerabilities and bugs before you
    install any programs. Many services provided with operating systems are not required
    and can be removed. The key to remember is that the fewer services running, the
    less potential vulnerability.


    TCP/UDP ports were covered in this chapter, and how each port is used by specific
    services. If you block ports on your server, you will block the services that
    use those ports. Locking down ports is an excellent way to prevent exploitations
    of your system.


    Maintaining your server involves downloading service packs and updates, and requires
    regularly installing fixes, security patches, and software updates. These items
    are available through the operating system vendors, as well as the specific vendors
    that created the software you implement.


    Bastille is an open source program that facilitates the hardening of a Linux system.
    It performs many of the tasks listed previously, disabling services and ports
    that are not required for the system’s job functions. Bastille is powerful and
    can save administrators time from figuring each file and program throughout the
    operating system. Instead, administrators answer a series of “Yes” and “No” questions
    through an interactive graphical interface. The program automatically implements
    the administrators’ preferences based on the answers to the questions.


    Super Des (sudo) is an open source security tool that allows an administrator
    to give specific users or groups the ability to run commands as root or as another
    user. The program can also log commands and arguments entered by specified users.
    The developers of sudo state the basic philosophy of the program is to “give as
    few privileges as possible, but still allow people to get their work done."


    Logging enhancers are tools that simplify logging by allowing logging information
    to be filtered and offset logging logs in simplified formats. Many open source
    logging programs exist to make system administration easier. You were introduced
    in this chapter to SWATCH, scanloglog, and syslog-log.


    > For more information and to test CIS benchmark tools visit www.cisecurity.org'
  merge: -1
  pgno: 100
- img_proc: true
  md: '# Hardening the Operating System • Chapter 2


    SWATCH is an open source package that allows administrators to efficiently monitor
    system activity. It can monitor events on a system, or a large number of systems,
    by monitoring system logs for specified events. SWATCH''s main function is to
    monitor messages actively as they are written to log files through the Unix syslog.


    Logconfd is an open daemon that detects and logs TCP-UDP scanning on a system.
    Logconfd can alert an administrator when the network is mapped, but cannot stop
    the intrusion.


    Syslogd-ng is a logging daemon that is the replacement for the traditional syslogd.
    The "ng" is an acronym for "next generation." The original syslog was the general
    Unix logging daemon that handled request for syslog, but was difficult to configure.
    Syslogd-ng is easier to configure and offers additional logging features, such
    as more configurations. For example, syslogd-ng allows administrators to filter
    messages based on priority, as well as the content of the messages.


    Security Enhanced Linux (SELinux) is an initiative from NSA along with the computer
    security research community to offer enhanced security in the operating systems.
    SELinux enhances security by utilizing mandatory access control features in Linux.
    Red Hat offers SELinux from Red Hat Enterprise Linux (RHEL) version 4.


    Novel SUSE is another popular Linux distribution that offers graphical user interface
    from the installation, configuration and management. SUSE Linux provides graphical
    firewall tools as well as to configure finer security settings.


    Novel AppArmor protects the system from inherent vulnerabilities of the applications.
    By creating AppArmor profiles for open ports, cron jobs and web applications can
    be enhanced on Linux servers.


    Host Intrusion Prevention System (HIPS) shields the system from zero-day attacks,
    providing signature-based, behavior-based protection and ensures core operating
    system files are not changed by external attackers. Cisco, Enterasys, McAfee,
    IBM ISS and other security vendors provide HIPS on many operating system platforms.


    Center for Internet Security (CIS) periodically releases benchmarking and scoring
    tools for operating systems, network devices and applications. You may download
    these free-cost tools and run them on your systems to analyze the security. CIS
    benchmark tool is available for Red Hat, SUSE and Slack Linux.


