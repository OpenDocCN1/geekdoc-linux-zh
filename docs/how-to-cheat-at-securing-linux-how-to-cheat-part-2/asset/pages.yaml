    The management capabilities of free software solutions are typically not as robust
    as are with commercial offerings. Your particular product will determine if this
    is a real consideration or not. Most often the presence or absence of management
    capabilities is more noticeable with free IDEs, antivirus, and antispyware. The
    common denominator is here that these products require frequent updates in order
    to maintain their value and their job effectively. An enterprise antivirus program
    will offer a Lot of control and features around signature updates, such as and
