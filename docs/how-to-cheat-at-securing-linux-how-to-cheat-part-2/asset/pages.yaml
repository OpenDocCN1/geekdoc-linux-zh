  md: '# Understanding Vulnerabilities Within Apache Web Server


    All software systems have four general types of vulnerability. Apache is no different
    and be negatively affected by any one of the following problems:


    +   - Poor application configuration

    - Unsecured Web-based code

    - Inherent Apache security flaws

    - Foundational OS vulnerabilities


    We''ll investigate these four types in detail through the remaining sections of
    this Chapter.


    # Poor Application Configuration


    Apache has many default settings that require modification for secure operation.
    Nearly all configuration information for Apache Web server exists within the httpd.conf
    file and associated Files. Because many configuration options exist within these
    files, it can be easy to make configuration errors that expose the application
    to the attack.


    # Unsecured Web-Based Code


    The second manner in which vulnerabilities are exposed is via poorly implemented
    code on the Apache server. Often, Web developers are far more concerned with dynamic
    business functionality than the security of their code. For instance, poorly written
    dynamic Web pages can be DoS targets for attackers, should coded limitations be
    absent from backend database queries. Simply publishing confidential or potentially
    harmful information without authentication can provide enemies with ammunition
    for attack. For these reasons, you must review and understand not only the Apache
    application but the information and functionality delivered via the system.


    # Inherent Apache Security Flaws


    Like the IIS server, vulnerabilities can exist within the Apache application code
    itself. There are many means by which hackers can breech or disable an Apache
    system, as as:


    +   - Denial of service

    - Buffer overflow attacks

    - Attacks on vulnerable scripts

    - URL manipulation'
  merge: -1
  pgno: 400
- img_proc: true
  md: '# Apache Web Server Hardening • Chapter 11


    Occasionally, Apache security flaws are discovered and announced by Apache or
    by various security groups. The Apache development team is typically quick to
    respond and distribute patches in response to such events. For this, it is critical
    that you remain vigilant in your attention to security newsgroups and Apache''s
    security advisory site at http://httpd.apache.org/security_report.html.


    # Foundational OS Vulnerabilities


    Another source of vulnerability in an Apache Web server could occur as a result
    of foundational security flaws in the OS on which Apache is installed. Apache
    can be run just about any OS.You should be very familiar with the specific security
    vulnerabilities for any OS on which you run Apache. This brings us to the next
    section, in which we discuss the merits of patching and securing the Microsoft
    OS.


    # Patching and Securing the OS


    Code deficiencies can exist in OS and lead to OS and application vulnerabilities.
    It is therefore imperative that you fully patch newly deployed systems and remain
    current with all released functional and security patches. At regular intervals,
    thoroughly review the vulnerabilities at your OS manufacturer''s Web site.


    Some popular OSs and their respective security sites are listed in Table 11.1.


    # Table 11.1 Popular Operating Systems and Their Security Sites


    | Operating System | Vendor Security Information Site |

    |---|---|

    | Sun Solaris | http://sunsolve.sun.com/security |

    | Microsoft | www.microsoft.com/technet/security/default.mspx |

    | Mac OS | www.apple.com/support/security/ |

    | Debian Linux | www.debian.org/security/ |

    | RedHat Linux | www.redhat.com/security/ |

    | SuSe Linux | www.novell.com/linux/security/securitysupport.html |

    | FreeBSD | www.freebsd.org/security/ |

    | NetBSD | www.netbsd.org/security/ |

    | OpenBSD | www.openbsd.org/security.html |


    It might be a good idea to subscribe to your OS vendor''s security mailing list
    to receive security-related updates and to monitor security groups for 0–day exploits.


