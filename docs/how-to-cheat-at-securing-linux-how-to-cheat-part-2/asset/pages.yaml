    packets. The TCP fingerprinting process involves setting flags in the header that
    differ different operating systems and respond differently. Usually, several different
    TCP packets are sent and the responses respond to known baseline (or fingerprints)
    to determine the remote OS. Typically, ICMP-based methods use fewer packets than
    TCP-based methods, when you need to be more stealthy and can afford a less-specific
    fingerprint, ICMP may


