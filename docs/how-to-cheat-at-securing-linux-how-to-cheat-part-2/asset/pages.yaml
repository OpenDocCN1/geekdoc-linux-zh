  md: '# Patching Unix, Linux, and BSD Operating Systems


    Because Apache is often run on Unix, Linux, and BSD distributions, we include
    patching steps so that you can confidently deploy your Apache Web server on a
    well-hardened OS. In general, however, each vendor provides a full suite of tools
    and information designed to help you remain current of their released software
    updates. Become familiar with each of your vendor''s OS patching methodologies
    and software tools. As the security administrator, you should reserve predetermined
    time periods for maintenance windows during episodes of low customer activity.
    However, the discovery of serious OS vulnerabilities could necessitate emergency
    downtime while patches are applied.


    # Configuring a Secure Operating System


    Like patching, all systems used to provide services as HTTP and HTTPS to customers
    should be thoroughly hardened before they are placed in a production environment.
    Hardening includes many steps as the following:


    +   * Setting file permissions

    * Locking down accounts

    * Establishing proper OS security policies

    * Configuring host-based firewalls

    * Disabling vulnerable services


    Now that we have a solid, secure OS, let''s move to discuss how to properly install
    and securely configure the Apache Web server.


    # Hardening the Apache Application


    The Apache server is a powerful application through which you can deliver critical
    business functionality to customers. With this power comes the possibility of
    misuse and attack. To ensure that your Apache server is running securely, we have
    compiled a series of steps to harden the Apache application. You might also want
    to read additional information or review other Apache security checklist documents
    before deploying your Apache server. Two excellent reference guides are the CIS
    Apache Benchmark document available at the Center for Internet Security (www.cisec.org)
    and the NIST Apache Benchmark document available at http://csrc.nist.gov/checklists/repository/1043.html.


    You should follow three general steps when securing the Apache Web server as follows:


    +   * Prepare the OS for Apache Web server

    * Acquire, compile, and install the Apache Web server software

    * Configure the httpd.conf file'
  merge: -1
