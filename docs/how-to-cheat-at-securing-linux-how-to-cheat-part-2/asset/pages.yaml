  md: '# Acquire, Compile, and Install Apache Web Server Software


    Because Apache is open-source software, you can freely download the binaries or
    source code and get it with your installation. Although there are many locations
    from which you could download the software, it is always best to obtain the Apache
    software directly from an approved Apache Foundation mirror listed at http://http.apache.org/download.cgi.


    You''ll need to decide whether to install the server using precompiled binaries
    or to compile the source code yourself. From a security and functionality perspective,
    it is better to obtain the source code and compile the source, since doing permits
    tuning of security features and business functionality. In this section, we will
    discuss compiling the Apache server from source code.


    To download the source code, point your browser at the URL previously, select
    a mirror, and select the latest Apache source distribution. While you''re on the
    Apache mirror site, also download the MD5 checksum, which should be available
    in the same directory as the source code. The checksum file will look identical
    to the source code tarball but will have an .md5 file extension. We''ll use this
    checksum to verify the integrity of your Apache source code.


    # Verify Source Code Integrity


    To verify the checksum, you''ll need additional software called md5sum that might
    be part of your OS. If it''s not, you can download the software as part of GNU
    Textutils available at www://www.gnu.org/software/textutils/textutils.html. To
    verify the Apache checksum, perform the following steps. In this example, we''ll
    use Apache version 2.2.3:


    +   * root the command line, change directories to where you downloaded the Apache
    source code tarball and checksum file.


    +   * cat httpd-2.2.3.tar.gz.md5 to see the exact md5 checksum. You should see
    something like f72fb176e2dc7b322be16508c09f63c httpd-2.2.3.tar.gz.


    +   * From the same directory, type md5sum httpd-2.2.3.tar.gz.md5 to obtain the
    checksum from the tarball. You should see the identical string shown in Step 2.
    If you do, the software downloaded is authentic.


    # Compile the Source Code


    After downloading and verifying the Apache source code, you''ll need to research
    what options you want to compile into your Web server. There are many modules,
    such as mod_access and mod_ssl, that can be added into your server to provide
    addi-


    ![](img/33fc180c04c8f96c022bce6e62ae12fd_404_0.png)'
