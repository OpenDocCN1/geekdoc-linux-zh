  md: '# Introduction


    Linux is capable of high-security; the out-of-the-box configurations must be altered
    to meet the security needs of most businesses with an Internet presence. This
    chapter shows the steps for securing a Linux system—called hardening the server—using
    both manual methods and open source security solutions. The hardening process
    focuses on the operating system, and is important regardless of the services offered
    by the server. The steps will vary slightly between services, such as e-mail and
    Hypertext Transfer Protocol (HTTP), but are essential for securing any server
    that is connected to a network, especially the Internet. Hardening the operating
    system allows the server to operate efficiently and securely.


    This chapter includes the essential steps an administrator must follow to harden
    a Unix system; specifically, a Red Hat Linux. These steps include updating the
    system, disabling unnecessary services, locking down doors, logging, and maintenance.
    Later in this chapter you may find some information for Novell SUSE Linux. Open
    programs allow administrators to automate these processes using Bastille, sudo,
    logging enhancers such as SWATCH, antivirus software. Before you implement these
    programs, you should understand how to harden a system manually.


    # Updating the Operating System


    An operating system may contain many security vulnerabilities and software bugs
    when it is released. Vendors, such as Red Hat, provide updates to the operating
    system to fix these vulnerabilities and bugs. In fact, many consulting firms recommend
    that companies do not purchase and implement new operating systems until the first
    update is available. In most cases, the first update will fix many of the problems
    encountered with the first release of the operating system. In this section, you
    will learn where to find the most current Red Hat errata and updates.


    # Red Hat Linux Errata and Update Service Packages


    The first step in hardening a Linux server is to apply the most current errata
    and Update Service Package to the operating system. The Update Service Package
    provides the latest fixes and additions to the operating system. It is a collection
    of fixes, corrections, and updates to the Red Hat products, such as bug fixes,
    security advisories, package enhancements, and add-on software. Updates can be
    downloaded individually as errata, but it is a good idea to start with the latest
    Update Service Package, and then install as necessary. However, you must pay to
    receive the Update Service Packages, and the errata are free. Many errata and
    Update Service Packages are not required upgrades. You need to read the documentation
    to determine if you need to install it.


    ![](img/33fc180c04c8f96c022bce6e62ae12fd_34_0.png)'
