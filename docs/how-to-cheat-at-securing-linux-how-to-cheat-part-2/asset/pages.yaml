- img_proc: true
  md: 'Apache Server Hardening • Chapter 11 387


    Within these general tasks there are many steps, which we cover in the following
    sections.


    # # Prepare the OS for Apache Server


    After you''ched and hardened your OS, you''ll need to accomplish a quick couple
    tasks prior to obtaining, compiling, and installing the Apache software. A critical
    part of installing Apache is to provide a user account and group that will run
    the Web server. It is important that the user and group you select be unique and
    unprivileged to avoid reduce exposure to attack.


    > > WARNING Do not run your Apache Web server as the user Nobody. Although this
    is often a system administrator favorite and seemingly unprivileged account for
    running Apache and other services, the Nobody account has historically been used
    for root-like operations in some OS and should be avoided.


    Choose and configure a user and group account using the following Unix OS steps.
    In this example, we will use wwwuser and wwwgrp as the Apache username and group,
    respectively.


    +   - Root from the command line, type **groupadd wwwgrp** to add a group.

    - Type **useradd -d /usr/local/apache/htdocs -g wwwgrp -c "Apache Account" -m
    wwwuser** to add the user.


    The second step creates the user account but also creates a home directory for
    the user in /usr/local/apache/htdocs.

    After creating the user and group accounts, you''ll need to lock down the wwwuser
    user account for use that no one can actually log into the Web server using the
    Apache account:


    +   - **Root** from the command line, type **passwd -l wwwuser** to lock the Apache
    account.

    - Type **usermod -s /bin/false wwwuser** to configure an unusable shell account
    for the Apache account.


    Now you''re ready to get the Apache software and begin installation.


