  md: '# Introduction


    IDS is the high-tech equivalent of a burglar alarm, one that is configured to
    monitor information gateways, hostile activities, and known intruders. An IDS
    is a specialized tool that knows to parse and interpret network traffic and/or
    host activities. This data can range from network packet analysis to the contents
    of log files from routers, firewalls, and servers, local system logs and access
    calls, network flow data, and Furthermore, an IDS often stores a database of known
    signatures and can compare patterns of activity, traffic, or behavior it sees
    in the data it monitoring against those signatures to recognize when a close match
    to a signature and or recent behavior occurs. At that point, the IDS can issue
    alerts or,, take various kinds of automated actions ranging from shutting down
    Internet links or specific servers to launching back-traces, and make other active
    activities to identify attackers and collect evidence of their nefarious activities.


    By analogy, an IDS does for a network what an antivirus software package does
    for that system: it inspects the contents of network traffic to look for and deflect
    possible attacks, as an antivirus software package inspects the contents of incoming
    files, e-mail attachments, Web content, and so forth to look for virus signatures
    (patterns that match known malware) or for malicious actions (patterns of behavior
    that are at least suspicious, if not unacceptable).


    To be more specific, intrusion detection methods detecting unauthorized use of
    or attacks upon a system or network. An IDS is designed to detect such attacks
    and unauthorized use of systems, network, and related resources, and in many cases
    to defect or demer if possible. Like firewalls, IDSes can be software-based or
    can combine hardware and software in the form of preinstalled and preconfigured
    stand-alone IDS devices. IDS software may run on the same devices or servers where
    firewalls, proxies, or other boundary services operate, though separate IDS sensors
    and managers are more popular. Nevertheless, an IDS not running on the same device
    or server where the firewall or other services are installed will monitor these
    devices with particular closeness and care. Although such devices tend to be deployed
    at network peripheries, IDSes can detect and deal with insider attacks as well
    as external attacks, and are often useful in detecting violations of corporate
    security policy and internal threats.


    You are likely to encounter several kinds of IDSes in the field. First, it is
    possible to distinguish IDS by the kinds of activities, traffic, transactions,
    or systems. IDS that monitor network links and backbones looking for attack signatures
    are called network-based IDSes, whereas those that operate on host and defend
    and monitor the network and file systems for intrusion and are called host-based
    IDSes. Groups of IDS functioning as remote sensors and reporting to a central
    management station are known as distributed IDSes (DIDSes). A gateway IDS is a
    network IDS deployed at the gateway between your network and another, monitoring
    the traffic passing in and out of your network at the transit point. IDSes that
    focus on understanding and parsing application-specific'
  merge: -1
  pgno: 138
- img_proc: true
  md: '# Introducing Intrusion Dection and Snort • Chapter 4 123


    traffic with regard to the flow of application logic as well as the underlying
    protocols are often called application IDSes.


    In practice, most commercial environments use some combination of network-, host-,
    and/or application-based IDSes to observe what is happening on the network while
    monitoring keys and hosts more closely. IDSes can also be distinguished by their
    differing approaches to event analysis. This resembles the many antivirus programs
    use virus signatures to recognize and block infected files, programs, or active
    Web content from entering a computer system, except that it uses a database of
    traffic or activity patterns related to known attacks, called attacks. Signature
    detection is the most widely used approach in commercial IDS technology today.
    Another approach is called anomaly detection. It uses rules or precepts called
    “normal” and “abnormal” system activity (called heuristics) to distinguish anomalies
    from normal system behavior and to monitor, report, or block anomalies as they
    occur. Some anomaly detection IDS use user profiles. These profiles are lines
    of normal activity and can be constructed using statistical sampling, rule-based
    approaches, or neural networks.


    Hundreds of vendors offer various forms of IDS implementations. Effective solutions
    combine network- and host-based implementations. Likewise, the majority of implementations
    are primarily signature-based, with limited anomaly-based detection capabilities
    present in specific products or solutions. Finally, most modern IDS include some
    automated response capabilities, but these usually concentrate on automated traffic
    filtering, blocking, or disconnects as a last resort. Although some systems claim
    to be able to launch countermeasures against attacks, best practices indicate
    that automated identification and back-trace facilities are the most useful aspects
    that such facilities provide and are therefore most likely to be used.


    IDSes are classified by their functionality and are loosely grouped into the following
    main categories:


    +   - Network-based intrusion detection system (NIDS)

    - Host-based intrusion detection system (HIDS)

    - Distributed intrusion detection system (DIDS)


    # How an IDS Works


    We''ve already touched on this to some degree in our survey of the different kinds
    of IDSes out there, but let''s take a look at exactly what makes an IDS tick.
    First, you have to understand what the IDS is watching. The particular kinds of
    data input will depend on the kind of IDS (indeed, what sorts of information an
    IDS watches is one of the hallmarks used to classify it), but in general there
    are three major divisions:


    ![](img/33fc180c04c8f96c022bce6e62ae12fd_139_0.png)'
  merge: -1
  pgno: 139
- img_proc: true
  md: '+   - Application-specific information such as correct application data flow


    +   - Host-specific information such as system calls used, local log content,
    and file system permissions


    +   - Network-specific information such as the contents of packets on the wire
    or hosts known to be attackers


    A IDS may watch any or all of these, depending on what kinds of IDSes it does
    with its sensors. The IDS can use a variety of techniques in order to get this
    data, including packet sniffing (generally in promiscuous mode to capture much
    network data as possible), log parsing for local system and application logs,
    system call watching in the kernel to regulate the acceptable behavior of local
    applications, and file system watching in order to detect attempted violation
    of permissions.


    After the IDS has gathered the data, it uses several techniques to prevent intrusions
    and intrusion attacks. Like firewalls, an IDS can adopt a known-good or a known-bad
    policy. With the former technique, the IDS is set to recognize or allow data,
    and to alert on anything else. Many of the anomaly detection engines embrace this
    model, triggering alerts when anything outside of a defined set of statistical
    parameters occurs. Complex protocol methods also operate on known-good policies,
    defining the kinds of traffic that the protocol allows and alerting on anything
    that breaks that. Language-based models for application logic also tend to be
    structured as known-good policies, alerting on anything not permitted in the predefined
    structure of acceptable language or application flow.


    Known-bad policies are much simpler, as they do not require a comprehensive model
    of allowed input, and alert only on data or traffic known to be a problem. Most
    signature-based IDS engines work from a known-bad model, with an ever-expanding
    database of malicious attack signatures. Known-good and known-bad policies can
    work in conjunction within a single IDS deployment, using the known-bad signature
    detection and the known-good protocol anomaly detection in order to find more
    attacks.


    Finally, we should consider what the IDS does when it finds an attempted attack.
    There are two categories of response: passive response, which may generate alerts
    or log entries but does not interfere with or manipulate the network traffic,
    and active response, which may send packets to disrupt Transmission Control Protocol
    (TCP) connections, drop traffic if the IDS is inline, add the attacking host to
    block lists, or otherwise interact with the flow of dubious activity.


    Having outlined these principles in the abstract, let''s take a look at some real
    network-based attacks.


    # # What will an IDS Do for Me?


    The strengths of IDSes are their capability to continuously watch packets on your
    network, understand them in binary, and alert you when something suspicious matches
    a signa


