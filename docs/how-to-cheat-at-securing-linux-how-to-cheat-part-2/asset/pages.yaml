    When a crossover cable is used to connect two devices, or a single device is attached
    to a switch, only two interfaces on the segment need to transmit or receive; no
    collisions occur. This is because the transmit (TX) of device A is connected to
    the receive (RX) of device B, and the TX of B is connected to the RX of device
    A. The collision detection method is no longer necessary, therefore, interfaces
    can be placed in full-duplex mode, which allows network devices to transmit and
    receive at the same time, increasing performance.


