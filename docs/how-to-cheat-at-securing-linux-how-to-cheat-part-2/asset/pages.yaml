    can configure this on the "Networking" tab, using the "ip block" screen. You also
    have the option to enable logging for the blocked attempts.


    With the basic firewall rules and maintenance configured, there are a few “extras”
    that are nice to see in a free product. One of these is the built-in Intrusion
    Detection System (IDS). Because it uses Linux as its base operating system, it
