  md: '# Presenting the Business Case for Open Source Software • Chapter 1


    You will also incur training costs, such as not having access to employee training.
    This time away from work is an expense, because you are paying for an asset that
    isn''t available. The same is true if the employee is on site and “self training.”


    # Hardware Costs


    A security appliance is a device that doesn''t require a computer and is used
    only for its intended purpose, while all of the free solutions require a system
    to run on. Luckily, the requirements are usually minimal; therefore you can often
    use an old PC. In some cases, the physical location required for the software
    (e.g., sniffers, IDS, traffic tools) can make a system unsafe. Rarely does a system
    require resources to using the same host for any other function impractical (e.g.,
    the Snort IDS logging capacity can quickly eat up disk space, leaving no room
    for other programs).


    If there are no old systems available, there are many retailers offering older
    systems at affordable rates. A large portion of the cost for low-end PC’s is often
    for the operating system. Many retailers offer affordable systems with an operating
    system installed. These allow you to purchase a relatively modern system cheaply,
    and then install your own OS on it. This can be a viable option for running security
    tools and providing user workstations.


    # Consulting Costs


    You must carefully weigh and balance where you spend your money. Too little training
    and you will end up hiring consultants. Implementing, configuring or securing
    your free firewall can cost a lot, more than if you bought a firewall. With small
    commercial firewalls costing $500.00, it doesn''t take long before free isn''t
    so free.


    With that, don''t be afraid to call a consultant if necessary. Having a well-paid
    consultant configure your free solution and make sure that it''s implemented using
    best practices is a steal compared to implementing some proprietary solutions.
    A consultant can also act as a trainer and what is being done, and you can ask
    learns why things are done a certain way. In this way you can have your solution
    set up by someone who is knowledgeable and experienced, and provide training and
    guidance to the in-house personnel.


    If you have ever had to rely on consultants, you probably know they are not always
    a “good buy.” Sometimes they are not as knowledgeable as you were led to believe.
    The key is to communicate with the consulting firm, being very clear about what
    your needs are. A good consultant can save the day.


    ![](img/33fc180c04c8f96c022bce6e62ae12fd_19_0.png)'
