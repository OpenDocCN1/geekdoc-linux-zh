  md: '# Installing and Configuring Snort and Add-Ons • Chapter 5 179


    Q: How do I make a Snort rule to trigger for “X” application’s traffic?


    A: Start by searching online; you can usually find the rule already made for you.
    If not, the general procedure is to do a packet capture (with Wireshark, for example)
    and then review the packets. The tricky part is to identify something all the
    packets (or if not all, at least the initial packet) has in common. Some string
    that can uniquely identify that application’s packet from any others. Then you
    place this string in the rule using the payload option. See the online Snort manual
    for more information on rule option fields.


    Q: How can I make my Snort sensor more secure?


    A: There are many ways. First, configure a firewall on the sensor itself to protect
    itself. You would only filter traffic to a destination of the sensor, so that
    you don''t accidentally filter the traffic you want to trigger alerts on. You
    can also have Snort listen on an interface without an IP address; this will make
    it a lot harder for an attacker to target the sensor. (See the main Snort FAQ
    for instructions on how to do this.)


    www.syngress.com'
