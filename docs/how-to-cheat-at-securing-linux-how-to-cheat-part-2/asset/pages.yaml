  md: '# Summary


    Snort has the undisputed position as the lead open source IDS. As such, it enjoys
    several advantages. One advantage is the very large and diverse user base. This
    user base enables you to find a lot of help and information on the Internet for
    running, configuring, and customizing Snort. Although Snort may not have the cohesive
    turnkey of a commercial package, you can assemble several utilities and tools
    to make Snort into an enterprise-class IDS. With no cost in software you can have
    an industry-standard IDS, with a large signature base and the ability to create
    your own custom signatures. Your signatures can be automatically updated to keep
    them current, and you can use several GUI front ends to remotely configure and
    manage several Snort sensors at one central location. All this adds up to a lot
    of value and increased security, with no additional software cost.


    # Solutions Fast Track


    # Configuring an Intrusion Detection System


    +   - Placement of the IDS will be key. If the IDS is not placed properly you
    will miss alerts and think you are more secure than you are really.


    +   - Your IDS is probably the security host that will need the most hardware
    resources of any discussed in this book (with the firewall being a close second),
    so plan accordingly when selecting the hardware to use for your IDS.


    +   - Remember that even with the proper physical placement, you need to have
    a hub in order for the IDS to be able to see traffic destined for other devices,
    or enable port mirroring if you are using a switch instead of a hub.


    # Configuring Snort on a Linux System


    +   - You may want to consider a Snort alert front end as BASE for viewing alerts.


    +   - If your environment is primarily Windows, this will enable you to access
    the alerts from the Windows systems without having to view the Snort console on
    the Linux IDS host.


    # Other Snort Add-Ons


    +   - A fully functioning IDS will not be of much value if no one is taking notice
    of the alerts it generates. An easy-to-use alert console can add a lot of value
    to your IDS in that it may increase the attention to the alerts receive.


