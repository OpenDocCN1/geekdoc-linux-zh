  md: '# Lokkit


    Lokkit is an ncurses-based menu for configuring your netfilter firewall. Lokkit
    is available for most major distributions and can be installed by default on some
    (such as Fedora Core 5). To start Lokkit, type **lokkit** in a terminal window.
    The first lokkit screen is shown in Figure 9.12.


    # Figure 9.12 Lokkit Main Screen


    ![](img/33fc180c04c8f96c022bce6e62ae12fd_316_0.png)


    You can navigate the menus using the Tab key and the space bar to toggle the equivalent
    of radio buttons, such as the **Enable** and **Disabled** options shown here.
    If you select **Enabled** on this screen, the default is applied. To edit any
    custom settings, press **Tab** until the **Customize** button is highlighted and
    then press **Enter**. The customization screen is shown in Figure 9.13.


    Lokkit provide a little more flexibility than the Security Level Configuration
    GUI discussed previously; however, it is limited. By selecting an interface in
    Trusted Devices, all traffic from that interface will be permitted. This would
    typically be to select the inside interface and designate it as trusted. You have
    the option of enabling **MAS-QUERADE**. The interface you select is the one that
    will NAT outbound traffic, therefore, you would generally select your **external**
    interface. And you can enter your own service information in the “Other ports”
    section. Once you are satisfied with your choices, press **OK** and then **Enter**.
    This will take you back to the main screen, where you press **OK** and then **Enter**
    to apply the changes.'
