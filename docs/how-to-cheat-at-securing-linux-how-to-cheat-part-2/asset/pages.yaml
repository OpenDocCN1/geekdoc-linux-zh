  md: '# Linux Bastion Hosts • Chapter 10


    +   - **Commands** These specific uppercase options on the command line used to
    manipulate the rules themselves; for example, -A to append a rule to a chain,
    -D to delete a rule from a chain, and so on.


    +   - **Options** These are used to specify options for the rule-matching criteria,
    such as -s for source address and -p to specify the protocol to match.


    Certain tables will process certain chains. The one we focus on a bastion host
    is the filter table. If you specify what table to use when adding rules (-t <table>)
    the default is to assume you are working with the filter table. The filter table
    processes the FORWARD, INPUT, and OUTPUT chains by default. Referring to the chain
    list, you can see that the target for the built-in chains is to jump to the custom-created
    RH-Firewall-1-INPUT. This means all packets traversing the system will go through
    the same chain. You do not have to set it up way. In fact jumping out to custom
    chains and then back to the built-in chains can be much more efficient. For an
    example, let''s suppose you have a long list of rules that only need to be checked
    against traffic to or from the accounting subnet. Now let''s place this list on
    its own chain called ACCOUNTING. You can make a single rule that matches the accounting
    subnet and jumps into the ACCOUNTING chain containing the lengthy list of rules.
    In this way the majority of your traffic is only checked against the single rule
    matching the accounting subnet instead of the entire list of rules found in the
    ACCOUNTING chain.


    The page for IPTables contains a wealth of knowledge, and the IPT Web site has
    an excellent FAQ (www.netfilter.org/documentation/index.html#documentation-faq).
    The large number of features and flexibility can make management over the command
    line sometimes cumbersome. There are several GUI tools for creating and editing
    the Netfilter rules. Some of the most widely used GUIs are Firestarter, Firewall
    Builder (fwbuilder), and Guarddog. These allow you to more easily create the rule
    set without having to know the command-line options for IPTables. To see what
    of the GUIs look like, take a look at the main window for Firestarter in Figure
    10.12.


