    ![](img/33fc180c04c8f96c022bce6e62ae12fd_367_0.png)


    There are various tools for package management. Here''s a brief summary of the
    tools included in Fedora Core 5:


    +   - pup GUI tool for updating software, accessed at Applications | System Tools
    | Software Updater.


    +   - pirut GUI tool for managing software packages, accessed at Applications
    | Add/Remove Software.

    - rpm Command-line tool for managing software packages.

    - yum Yellowdog modified; command-line tool for managing software packages.

    - yum Extender A GUI interface for YUM (install with yum install yumex).


    Pirut and yum will automatically ensure you have the most current version of a
    package. Both of these will also automatically check and install any dependencies
    for the software you install. RPM does not include this functionality you will
    need to check for dependencies manually when using rpm. YUM only works on RPM
    based systems, and not all systems have YUM available/installed, therefore it
    is suggested that you understand how to manage packages with RPM even if you choose
    to use YUM for you day to day management.


    There is no universal list to tell you which packages you should leave installed
    and which ones you should remove. You will need to evaluate each service based
    on your requirements. However, at a minimum the following services are ones you
    probably need to have installed/running, unless you are very sure they don''t
    need them:


    +   - daemon Used for gathering and maintaining information concerning hardware
    devices

    - iptables Manages IPTables firewalls

    - messagebox Used for sending notification for certain system events

    - network Manages the activation of network interface at boot-up

    - NTPd Used to synchronize time via the NTP protocol


