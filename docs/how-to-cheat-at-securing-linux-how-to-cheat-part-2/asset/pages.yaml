    # The LLC Sublayer


    The LLC sublayer provides the logic for the link layer; it controls the synchronization,
    flow control, and error-checking functions of the Data Link layer. This layer
    manages connection-oriented transmissions; connectionless service can also be
    provided by this layer. Connectionless operations are known as Class I, whereas
    Class II can handle either connectionless or connection-oriented operations. With
    connection-oriented communication, each LLC frame is acknowledged. The LLC sublayer
    at the receiving end keeps up with the LLC frames it receives (also called Protocol
    Data Units [PDUs]); therefore, if it detects that a frame has been lost during
    transmission, it can send a request to the sending computer to start the transmission
    over again, with the PDU never arrived.


