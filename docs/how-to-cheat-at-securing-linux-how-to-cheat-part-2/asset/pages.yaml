  md: 'Each round consists of a substitution phase, wherein the data is substituted
    with pieces of the key, and a permutation phase, wherein the substituted data
    is scrambled (re-ordered). Substitution operations, sometimes referred to as confusion
    operations, occur within S-boxes. Similarly, permutation operations, sometimes
    called diffusion operations, are said to occur in P-boxes. Both of these operations
    occur in the "F Module" of the design. The security of DES lies in the fact that
    the substitution operations are non-linear, the resulting ciphertext does not
    resemble the original message. The permutation operations add another layer of
    security by scrambling the already partially encrypted message.


    Triple DES (3DES) are DES methods that attempt to use the DES cipher in a way
    that increases its security. Triple DES uses three separate 56-bit keys as a single
    168-bit key, though sometimes keys 1 and 3 are identical, yielding 112-bit security.
    DESX adds an additional 64 bits of key. Both 3DES and DESX are intended to strengthen
    DES against brute-force attacks. It would take many years to decrypt 3DES encrypted
    data (depending on available computing power). However, 3DES is inefficient because
    it requires two to three times the processing overhead as single DES.


    # # Advanced Encryption Standard (Rijndael)


    Because of its small size of 56 bits, DES can''t withstand coordinated brute-force
    attacks using modern cryptography; dedicated machines can break DES within a day.
    Consequently, The National Institute of Standards and Technology (NIST) selected
    the Advanced Encryption Standard (AES) as the authorized Federal Information Processing
    Standard (FIPS) 197 for all non-secret communications by the U.S. government,
    which became effective in May 2002. AES has the following important characteristics:


    +   - Private symmetric block cipher (similar to DES)

    - Stronger and faster than 3DES

    - Life expectancy of at least 20 to 30 years

    - Supports keys of 128 bits, 192 bits, and 256 bits

    - Freely available to all; royalty free, non-proprietary, and not patented

    - Small footprint. AES can be used effectively in memory and central processing
    unit (CPU) environments such as Smart Cards


    As a background note, the Rijndael algorithm (pronounced "rain doll") was selected
    by NIST from a group that included four other finalists: MARS, RC6, Serpent, and
    Twofish. It was developed by Belgian cryptographers Dr. Joan Daemen and Dr. Vincent
    Rijmen. NIST seems resistant to side-channel attacks such as power- and timing-based
    attacks, which are attacks against a hardware implementation, not against a particular
    algorithm. For example, power- and timing-based attacks measure the time it takes
    to encrypt a message or the minute changes in power consumption during the encryption
    and decryption processes.


