  md: '# Mod_security


    mod_security, a third-party Apache module available from www.modsecurity.org/,
    provides application firewall intrusion protection and prevention. To enable mod_security,
    you must download and compile the software into the Apache Web server. Adding
    mod_security increases the secure operation of your Apache Web server and adds
    functionality including, but not limited to, the following:


    +   - HTTP protocol awareness

    - Anti-evasion technique prevention such as URL encoding validation and URL decoding

    - Enhanced audit logging

    - Built-in chroot functionality

    - Buffer overflow protection

    - HTTPS filtering


    We''ll enable mod_security in our example because it adds many security features
    to our system. Once you have downloaded the mod_security source from www.modsecurity.org/download/index.html,
    perform the following steps as root:


    ```

    cd ${modsecuritySrcDir}/apache2

    mdir -r ${ApacheSrcDir}/modules/security

    cp mod_security.c Makefile in config.m4 \ ${ApacheSrcDir}/modules/security

    cd ${ApacheSrcDir}

    ./buildconf

    ```


    Now mod_security appears like other Apache modules. When we compile Apache, we''ll
    enable it using the command --enable-security. Using the previous listed configurations,
    your configure statement would look like the following:


    ```

    /configure --prefix=/usr/local/apache \

    --enable-so \

    --enable-ssl \

    --enable-security-id \

    --enable-unique-id \

    --enable-log-forensic \

    --disable-info \

    --disable-status \

    --disable-autoindex \

    --disable-imap \

    --disable-include \

    --disable-userdir \

    ```


