  md: '# OpenSSL VPN


    One of the most used open source SSL VPNs is Open VPN, which uses TAP and TUN
    drivers. For Linux version 2.4.x or later, they are bundled with the kernel. Open
    VPN tunnels traffic over the UDP port 5000. Open VPN can either use TUN to allow
    the IP traffic or TAP driver to pass the Ethernet traffic. Open VPN has two modes.
    The first is based on SSL/TLS security using public keys like RSA, and the second
    is on using symmetric keys or pre-shared secrets. RSA certificates and the keys
    for the first mode be be generated by the openssl command. Details about these
    certificates or the private keys are stored in *.conf files to establish VPN connection.


    .crt extension will denote the certificate file, and key will be used to denote
    private keys. The SSL-VPN connection will be established between two entities,
    one of which will be a client, which is your laptop, and the other will be a server
    running at your office or lab. Both computers will have .conf files, which define
    the parameters required to establish SSL-VPN connection.


    For the server side, let''s call the file srv-srvr.conf, details of which are
    shown in Figure


    9.30.


    # Figure 9.30 Configuration of the *.conf File on Server Side


    ```

    # may be used to delimit comment. (Line 1)

    dev tun

    # 12.23.34.56 is the IP address of Server (Line 2)

    # 12.23.34.56 is the IP address of the Client (Line 3)

    lifing scripts will establish routes when a VPN is active (Line 4)

    up srv-srvr.up

    # the script will be for server (Line 5)

    tls-server

    # Df-Hellman parameters (Line 6)

    d dh1234.pem

    # Certificate Authority File (Line 7)

    ca my-ca.crt

    # Our certificate / Public Key (Line 8)

    cert srv-srvr.crt

    # Private Key key of Server (Line 9)

    key srv-srvr.key

    # Open VPN uses port 5000 by default

    # Each VPN must use a different Port (Line 10)

    Port 5000

    # UID and GUID will be initialized to "nobody" (Line 11)

    user nobody

    group nobody

    # Verbosity Level (Line 12)

    # 0 -- except for fatal error

    # 1 - mostly quiet, but can display non-fatal error

    # 3 - Medium output, good for normal operations

    # 9 - Verbose, good for troubling

    verb 3

    ```


    ![](img/33fc180c04c8f96c022bce6e62ae12fd_344_0.png)'
  merge: -1
  pgno: 344
- img_proc: true
  md: 'The configuration of srvr.up, which is mentioned after line 4, is shown in
    Figure 9.31.


    # Figure 9.31 Configuration of the srvr.up File


    ```

    #!/bin/bash

    route add -net 12.0.1.0 netmask 255.255.255.0 gw $5

    ```


    The *.cnf file (let''s call it clt.cnf) on the client side will look similar to
    Figure 9.30. However, there will be modifications to some of the parameters in
    the file. After line 3, the parameters of ifconf will change to ifconfig 12.1.0.2
    12.1.0.1 # from client side to server 12.23.34.57 is the IP address of the client,
    and # 12.23.34.56 is the IP address of the server.


    After line 4, modification will be


    ```

    up ./cnt.up

    ```


    After line 5, modification will be


    ```

    tls-client

    ```


    Again, the certificate on the client side will point to the certificate of the
    client. If local.crt is storing the certificate of the client and the private
    key of client is key local.key,

    cert home.crt


    ```

    key local.key

    ```


    will have to be added after line 8 and line 9.

    The remaining part of the configuration file for the client side will remain the
    same.

    The configuration of the clt.up to start a VPN server is shown in Figure 9.32.


    # Figure 9.32 Configuration of the clt.up File


    ```

    #!/bin/bash

    route add -net 12.23.34.0 netmask 255.255.255.0 gw $5

    ```


    Once these are configured, to start a VPN at the server side execute the command

    $ open vpn -config tls-srvr.cnf


    and similarly to start at the client side,

    $ openvpn --config tls-clt.cnf


    # Pros


    SSL VPN is one way to transfer the information since a web browser can be used
    to establish an SSL VPN connection. Since SSL VPN is clientless, it will result
    in cost savings and can be configured to allow access from corporate laptops,
    desktops, or any computer


