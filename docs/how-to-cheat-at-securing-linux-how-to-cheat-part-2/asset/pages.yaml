  md: "# Advannced Snort Deployment • Chapter 6 197\n\nesting possibilities for policy\
    \ enforcement. For you could have a rule like the following example:\n\n```\n\
    alert udp any any <> any 53 (msg:\"udp replace\"; content:\"forbidden.com\"; replace\
    \ \n\"xxxxxxxxxxxx\"; )\n```\n\nThis rule would prevent anybody from resolving\
    \ the domain forbidden.com.\n\n# Solving Specific Security Requirements\n\nNow\
    \ that we have a familiarity with the different ways to enhance the utility of\
    \ Snort, we will take a look at some specific security requirements and how we\
    \ might use rules and/or plugins to address these issues.\n\n# Policy Enforcement\n\
    \nSecurity policy enforcement consists of two components: detection of violations\
    \ and taking action when a violation occurs. The traditional use of Snort. You\
    \ can accomplish the detection through the use of an appropriate rule for the\
    \ simpler cases or with a plug-in for more complicated policies. Taking action\
    \ when a violation occurs depends on the local security policy and how threatening\
    \ the violation is. Action could be as simple as just logging the event, or it\
    \ could invoke an active response like described earlier that could block the\
    \ violating connection.\n\n# Catching Internal Policy Violators\n\nWatching for\
    \ internal systems that violate the local security policy is probably second only\
    \ to inbound DMZ traffic in terms of usage for Snort. You can use Snort for this\
    \ type of monitoring, set up a series of rules that codify the local security\
    \ rules, and then you are all set. For example\n\n```\nalert tcp $HOME_NET <>\
    \ $EXTERNAL_NET 1863 (msg:\"CHAT MSN message\";nflow:established; content:\"MSG\"\
    ; depth:4; content:\"Content-Type|3A|\"; nocase;\ncontent:\"text/plain\"; distance:1\
    \ classype:policy-violation; sid:540; rev:11;)\n```\n\nwill trigger if an internal\
    \ system connects to SNORT messenger.\nThis type enforcement is very common, so\
    \ it is sure to be check if the ruleset that you are working already has what\
    \ you need. Rules for watching chat protocols and P2P protocols to be rather complicated\
    \ because many of these protocols can use multiple network ports or tunnel on\
    \ ports used for other protocols (typically port 80, the HTTP port) so that they\
