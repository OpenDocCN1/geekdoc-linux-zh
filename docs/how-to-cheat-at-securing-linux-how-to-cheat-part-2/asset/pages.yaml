  md: '# Basics of Cryptography and Encryption • Chapter 8 257


    Because of the inherent slowness of asymmetric cryptography, the Diffie-Hellman
    algorithm was not intended for a general encryption scheme. Rather, its purpose
    was to transmit a private key for DES (or a similar algorithm) across an insecure
    medium. In most cases, Diffie-Hellman is not used for encrypting a complete message,
    because it is much slower than DES, depending on implementation.


    In practice, this is how a key exchange using Diffie-Hellman works:


    +   Two parties agree on two numbers; one is a large prime number, the other is
    a small integer number. This can be done in one, as it does not affect security.


    +   Each of the two parties separately generate another number, which is kept
    secret. This number is equivalent to a private key. A calculation is made involving
    the private key and the two previous public keys. The result is sent to the other
    party. This result is effectively a public key.


    +   The three parties exchange their public keys. They then perform a calculation
    involving their private key and the other party''s public key. The resulting number
    is the session key. Each party should arrive at the same number.


    +   The key can be used as a secret key for another cipher, such as DES. No third
    party monitoring the exchange can arrive at the same key without knowing one of
    the private keys.


    Diffie-Hellman''s greatest strength is that anyone can know either or both of
    the sender''s and recipient''s keys without compromising the security of the message.
    Both the public and private keys are actually very large integers. The Diffie-Hellman
    algorithm takes advantage of complex mathematical functions known as discrete
    logarithms, which are easy to perform forward, but extremely difficult to inverse.
    Secure Internet Protocol (IPSec) uses the Diffie-Hellman algorithm in conjunction
    with the Rivest, Shamir, & Adleman (RSA) authentication to exchange a session
    key for encrypting all traffic that crosses the IPsec tunnel.


    # El Gamal


    The El Gamal algorithm is essentially an updated and extended version of the original
    Diffie-Hellman based on discrete logarithms. The security of the algorithm is
    roughly on par with that of the RSA algorithm. El Gamal has a few drawbacks, mainly
    its larger output and random input requirement. Encrypted El Gamal ciphertext
    is much longer than the original plaintext, so it should not be used in places
    where bandwidth is a limiting factor. The El Gamal algorithm also requires a suitable
    source of randomness to function properly. It is worth noting that the Digital
    Signature Algorithm (DSA) was based on the El Gamal algorithm. DSA is a complementary
    protocol that is widely used in the OpenSSH implementation of the Secure Shell
    (SSH) protocol.


