  md: 'The configuration files for the other remaining interfaces (eth1, eth2, etc.)
    should be similarly edited. The configuration setup for other distributions is
    just as straightforward.


    # Snort Rulesets


    Snort provides many rules as part of the stock installation. More rules and frequent
    updates are available by subscription at www.snort.org. Rather than gathering
    the basics, these rules cover many types of events, such as Web or SQL Server
    abuses, signatures that are indicative of viruses, that of P2P protocols, and
    so on. When some new security threat emerges on the Internet, a new snort signature
    is frequently available within hours. In addition, writing your own rules is not
    difficult.


    You are probably already familiar with the basics of Snort rulesets; you set up
    a pattern that triggers an alert if it is matched. For example,


    ```

    alert icmp $EXTERNAL_NET => $HOME_NET any (msg:ICMP JPEG data tunnel"; type:8;
    content:JFIF"; clasype:string;detect; sid:1000000; rev:1);

    ```


    This rule will generate an alert when it detects an ICMP Ping packet that is carrying
    a JPEG image in its effort to transfer data without being detected (you can do
    that, and it really happens).


    The classic rules of this type can be set up to trigger an alert on variety of
    conditions. This uses the protocol and the packet content as a trigger. Other
    triggers include various TCP flags or IP options, the packet size, source, and
    destination. The resulting rules have special functions that are invoked by using
    special keywords in the rule. In instance, the react rule can be used to cause
    Snort to react to the packet in some manner, depending on what is desired. This
    trigger will attempt to close the connection and possibly send a visible warning
    to the originating system.


    > If you use the react keyword, it should be the last one in the rule option list.


    ![](img/33fc180c04c8f96c022bce6e62ae12fd_200_0.png)'
