    fortunate deployments where clueless analysts marked every noisy rule as a false
    positive and tuned it out, rather than figuring what was triggering the rule and
    writing a targeted pass rule for allowed traffic. That of approach doesn''t help
    anyone, and may negate the cost of the benefit of having an IDS in the first place.


    # Security Considerations with Snort


    Even though you are using Snort to improve your security, making sure that your
    Snort system is as secure as possible will make the data more trustworthy. If
    someone breaks into your Snort system, there is no reason to trust the alerts
    that it sends, making the system completely useless until you wipe the disks and
    reinstall everything.


    # Snort Is Susceptible to Attacks


    With that said, a typical Snort installation is susceptible to attacks, both in
    and the underlying OS. Why? You''ll want to get remotely (SSH), and you''ll probably
    want to store the alerts in a database (MySQL or Postgres). Any addition, you''ll
    probably want to view the alerts with a sporty interface that might require a
    Web server (Apache or IIS). Any listening service is a possible source for attacks,
    and some driver attacks can even target a listening interface that isn''t advertising
    any services in particular at all. This makes your Snort system just like any
    other application, so stay on top of security vulnerability announcements and
    OS security announcements for whatever platform you''ve chosen, just as you would
    for any other crucial network appliance.


    Now, based on this information, you have several ports open on your Snort system:
    SSH (port 22), HTTP (port 80), HTTPS (port 443), and possibly MySQL (port 3306)
    or Postgres (port 5432). Anyone with access to the network can use NMAP and scan
    your sniffer on its nonpromiscuous interface. This is one of the reasons that
    we advocate having a separate interface for management than sniffing and for locking
    down the management interface to restrict access and services as tightly as possible.
    Reducing the potential attack surface will help keep your IDS secure.


    This is something that needs to be addressed because all of the preceding applications
    have quite a few serious security issues, historically. In addition to making
    sure that your applications are up-to-date, you need to make sure that your kernel
    is configured properly and that it is also up-to-date. You didn''t think that
    running Snort allows you to disregard basic system administration practices; did
    you?


