    # Data Encryption Standard and Triple Data Encryption Standard


    Among the oldest and most famous encryption algorithms is the Data Encryption
    Standard (DES), the of which has declined with the advent of algorithms that provide
    improved security. DES was based on the Lucifer algorithm invented by Horst Feistel,
    which never saw widespread use. Essentially, DES uses a single 64-bit key—56 bits
    of data and 8 bits of parity—and operates on data in 64-bit chunks. This key is
    broken into 16 48-bit subkeys, for each round, which are called Feistel cycles.
    Figure 8.1 gives a schematic of how the DES algorithm operates.


