    Not all directives play a significant role with regard to security. In the following
    sections, we''ll discuss the directives that impact the security of your Apache
    server. Furthermore, because we disabled a lot of functionality at compile time,
    some directives that would normally be dangerous don''t need to be removed, since
    they weren''t added into the Apache binaries. There may also be other configuration
    files, called Include Files, associated with the httpd.conf. Since we have enabled
    mod_security, there is a long list of potential configurations to make in an Include
    file called modsecurity.conf, which is usually located in the $(ApacheServerRoot)/conf.


    In this section, we''ve included the Modsecurity.com-recommended mod_security
    configuration. For more information about configuring this file, refer to the
    mod_security documentation at www.modsecurity.org/documentation/.


    # Recommended modsecurity.conf File


    ```

    # Turn ModSecurity On

    SecFilterEngine On


    # Reject requests with status 403

    SecFilterDefaultAction "deny,log,status:403"


    # Some sane defaults

    SecFilterScanPost On

    SecFilterCheckURLEncoding On

    SecFilterCheckUnicodeEncoding On


    # Accept almost all byte values

    SecFilterForceByteRange 1 255


    # Server masking is optional

    ```


