    # Configuring netfilter


    When it comes to Linux-based firewalls, there is only one choice, which is netfilter.
    This is partially because it was the best option available for the longest time.
    Since version 2.4, however, netfilter has been built into the Linux kernel. Many
    commercial firewalls are running a modified Linux OS with netfilter inside their
    own custom case. netfilter is the unifying software that makes up the firewall
    on Linux systems. It is the netfilter component that reads the contents of the
    network packet and permit or deny network traffic. Many times people incorrectly
    refer to the firewall as iptables, or prior to, iptchains. In fact, iptables is
    the software command that is used to configure the rules that netfilter uses to
    make decisions to permit or deny traffic iptchains is the previous version of
    iptables. Even after you have settled on using Linux as your base OS for your
    firewall, there are some additional choices to make before you start configuring.


