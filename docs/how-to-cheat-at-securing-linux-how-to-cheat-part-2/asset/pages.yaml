    ```

    # snort -dev -1 /var/adm/snort/logs -h 10.1.0.0/24 -c /root/mysnort.conf

    ```


    Your rules in the configuration file, and they are what trigger the alerts.


    # Snort and Your Network Architecture


    How do you make Snort as useful as possible? Place your sensors strategically
    as possible on your network, allowing them to see as much of the crucial network
    traffic as possible for your deployment. Where this depends on several factors:
    how big your network is and how much money can you get your management to spend
    on Snort systems.


    If you cannot get enough money to acquire enough Snort systems to achieve the
    optimal designs in Figure 4.6, you''ll need to see what you can use from a practical
    design. If you need to limit your spend, forget the system inside the router and
    make sure you have the Snort systems inside the subnets you want to protect. In
    general, placing the sensors closer to your key assets will make it easier to
    see what systems are sending and receiving. If you can''t place sensors on all
    your subnets, choose wisely, and protect your most important machines with a sensor
    on their segments.


