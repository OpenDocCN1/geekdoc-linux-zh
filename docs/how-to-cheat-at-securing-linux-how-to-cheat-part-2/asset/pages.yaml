    Keeping good notes is very important during a pen test, and is especially important
    during this phase as well. If the tool you are using cannot output a log file,
    make sure you use tools like tee, which will allow you to direct the output of
    a command to your terminal and to a log file, as demonstrated in Figure 3.1. Sometimes,
