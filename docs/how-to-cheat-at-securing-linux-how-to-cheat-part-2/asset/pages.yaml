  md: 'visually appealing desktops are also the largest in disk of space and system
    resource requirements. Gnome and KDE are by far the most feature-rich, widely
    supported desktop environments. Gnome is not itself a window manager and comes
    with the Sawfish window manager. These two products also happen to be some of
    the largest and resource-intensive well. If performance is a consideration, you
