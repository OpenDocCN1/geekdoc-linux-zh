    # Notes from the Underground...


    # IP Address Source Spoofing


    It is possible to spoof any part of an IP datagram; however, the most commonly
    spoofed IP component is the source IP address. Also, not all protocols function
    completely with a source IP address (e.g., connection-oriented protocols such
    as TCP require handshake before any data can be transmitted, reducing the effectiveness
    of spoofing-based attacks.


    Spoofing can also be used as a Dos attack. If Network A sends a datagram to Network
    B, with a spoofed source host address on Network C, Network C will see traffic
    going to it that originates from Network B, without any indication that Network
    A is involved at all.


    The best practice for network administrators is to ensure that the network can
    only originate packets with a Source IP address (i.e., an IP address in the network
    itself).


    # Internet Control Message Protocol


    The Internet Control Message Protocol (ICMP) manages errors that occur between
    networks on the IP: The following are common types of ICMP messages:


    +   - Echo Request/Reply Used by programs as ping to calculate the delay in reaching
    another IP address.


    +   - Destination Unreachable: Network Unreachable and Port Unreachable Sent to
    the source IP address of a packet when a network or port cannot be reached. This
    happens when a firewall rejects a packet or if there is a network problem. There
    are number subtypes of Destination Unreachable messages that are helpful at diagnosing
    communication issues.


    +   - Time Exceeded Occurs when a packet reaches 0.


