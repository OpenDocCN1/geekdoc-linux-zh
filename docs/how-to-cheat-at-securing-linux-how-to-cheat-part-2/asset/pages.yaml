  md: "The keyword logto enables you to send the packets that trigger the rule that\
    \ contains this keyword to be logged to its own file.This keyword is ignored when\
    \ Snort is in binary logging mode.\n\nThe session, will follow a TCP session that\
    \ is triggered by the rule and will allow logging of the entire connection. The\
    \ keyword tag is similar to session, but once it is triggered, it follows all\
    \ traffic from or to the source or destination, not just the current session,\
    \ for a specified amount of time or number of packets. Both session and tag put\
    \ a heavy burden on Snort and should be used for the post-processing analysis\
    \ of Snort binary or tcpdump files, not for real-time use. We will discuss these\
    \ keywords later in this chapter when we are looking at some specific scenarios.\n\
    \nStarting with Version 2.6, you can add/modify rules dynamically while Snort\
