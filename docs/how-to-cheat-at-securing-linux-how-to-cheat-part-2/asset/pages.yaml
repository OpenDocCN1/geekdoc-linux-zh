    # # Where Snort Fits


    Snort is an open source network IDS capable of performing real-time traffic analysis
    and packet logging on Internet Protocol (IP) networks. Snort can perform protocol
    analysis and content searching/matching, such as buffer overflows, stealth port
    scans, Common Gateway Interface (CGI) attacks, Server Message Block (SMB) probes,
    operating system fingerprinting attacks, and much more. Snort is rapidly becoming
    the tool of choice for intrusion detection.


    You can configure Snort in three main modes: sniffer, packet logger, and network
    intrusion detection. Sniffer mode simply reads the packets off the network and
    displays them in a continuous stream on the console. Packet logger mode logs the
    packets to the disk. Network intrusion detection is the most complex and configurable,
    allowing Snort to analyze network traffic for matches against a user-defined ruleset
    and perform one of several actions, based on what it sees.


    In addition to the community signatures provided with Snort and the Sourcefire
    VDB signatures available for download, users can write their own signatures with
    Snort to suit the particular needs of your network. This capability allows immense
    customization and flexibility to the Snort engine, allowing you to suit the unique
    security needs of your own network. In addition, there are several online communities
    where leading-edge intrusion analysts and incident responders swap their newest
    Snort rules for detecting exploits and recent viruses.


    Snort''s pattern matching behavior has several practical applications. For example,
    it allows the detection of hosts infected with viruses or worms that have distinctive
    network behavior. Many worms spread by scanning the Internet and attacking hosts
    they deem vulnerable, signatures can be written for such behavior or for the exploit
    itself. Although it is not the job of the IDS to clean up infected machines, it
    can help identify infected machines. In cases of massive virus infection, the
    way after supposed virus cleanup can help to confirm that the cleanup was successful.


    Snort also has signatures that match the network behavior of known network reconnaissance
    and exploit tools. Although for the most part, rule writers make effort to match
    the signature of the exploit and not of a particular tool, sometimes it''s helpful
    to be able to identify the tool scanning or attacking you. For example, there
    are rules that identify the SolarWinds scanner tendency to embed its name in the
    payload of its scanning Internet Control Message Protocol (ICMP) packets, making
    for easy device identification. The vast'
