  md: '# Summary


    The effectiveness and utility of Snort can be greatly expanded by combining the
    capabilities that arise by using custom rules and plug-ins. The process is not
    hard, but the changes to the newest version of Snort provide you with a choice
    between the original method and the new way. Rules can now be written with two
    different syntaxes—the original traditional syntax and a C-like syntax. The C-style
    syntax looks more verbose, but it has the advantage of being dynamically loadable.
    The richer syntax makes it easier to work with complicated rules. Preprocessing
    plug-ins are useful when packets are processed in a way that does not really fit
    within rules, such as triggering an alert on what has been seen across multiple
    packets. Preprocessing plug-ins can also be implemented in two ways. The original
    method required statically compiling the plug-in directly into the Snort binary;
    the new method allows Snort to find and load the plug-in on the fly. The dynamic
    method is much easier to develop because it does not require rebuilding Snort
    to add the plug-in.The detection and output plug-ins can be developed only as
    statically compiled modules.


