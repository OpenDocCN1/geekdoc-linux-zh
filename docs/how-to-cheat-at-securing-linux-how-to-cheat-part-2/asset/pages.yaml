    is the alert group. In the future, if you want to quickly see this group of alerts,
    you can click Alert Group Maintenance at the bottom of each page, and click the
    alert group to view. In this, any subset of alerts is only two clicks away, sort
    of a shortcut straight to a particular set of filtering criteria.


    Another feature of note is the Administration link at the bottom of each page.
    This takes you to a screen where you can configure users for BASE. There are four
    options on the administration screen: list users, create a user, list roles, and
    create a role. These screens enable you to create users and assign them to various
    roles. If you click List Roles, you can see the four predefined roles. If you
    want to assign a user to the administrator role, simple click Create User. Enter
    the login name, a full name and description, and use the drop-down box to select
    a role and then click Query. None of the settings here will take effect until
    you edit the base_conf.php file and change the value of $Use_Auth_System = 1.
    A value of 0 (the default) means the authentication is disabled and everyone has
    full access to BASE. Only the admin role has access to the administration screen.


