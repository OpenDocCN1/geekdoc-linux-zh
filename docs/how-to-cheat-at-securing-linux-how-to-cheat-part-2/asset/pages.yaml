    # Configuring IPTables


    IPTables comes with virtually every distribution of Linux. It is a very functional
    firewall with an impressive array of features and options. To enable the IPTables
    firewall, simply navigate to System | Administration | Security Level and Firewall.
    On the Firewall Options tab, ensure that it is Enabled, as shown on Figure 10.10.


    Figure 10.10 Enabling an IPTables Firewall


    ![](img/33fc180c04c8f96c022bce6e62ae12fd_379_0.png)


    Depending on the distribution you choose, the default rules set for IPTables may
    vary. In the case of Fedora Core 5, the default rule set is to permit all outbound
    traffic and to permit inbound traffic that is part of an established session.
    As you can see in the Figure 14.10, SSH was checked. Because the default configuration
    blocked all inbound connection attempts, checking that box will cause a rule to
    be created to allow an inbound connection for SSH (TCP 22). In addition to the
    preconfigured ports (services), you can add your custom port in the Other ports
    section. This interface works for simple packet filtering, but IPTables is capable
    of much more functionality than filtering. To get more advanced, you need to be
    comfortable with the command line. Next we will discuss what the rules look like
    and their meanings.


    To use an example, this is the default output from the command iptables -L, which
    is to list all chains (we will see what a chain is shortly), shown in Figure 10.11.
    Your default rules probably won''t work exactly like these.


    * * *'
