    # Using Snort on Your Network


    Your IDS can just use one Snort system, or more than one if you need redundancy
    or coverage of multiple network segments. For example, it is possible to divide
    the task of network monitoring across multiple hosts. The chief benefit of dividing
    tasks within a segment is redundancy—if one element of the system goes down, the
    network can be monitored and protected. However, for monitoring extremely large
    and busy networks, we advise you to place at least one sensor in every distinct
    segment so that you can capture all the local traffic, not just the traffic that''s
    sent to the segments where your main sensors are.


