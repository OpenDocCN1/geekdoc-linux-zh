    # Easy Firewall Generator


    Easy Firewall Generator is not a GUI per se, but it does help simplify your netfilter
    configuration and avoid the need to be familiar with the iptables syntax. Using
    the Web page at http://easyfwgen.morizet.net/gen/index.php, you can get the relevant
    information and click the Generate Firewall button. By select options, if additional
    information is needed click the Generate Firewall button and the page will refresh
    and provide the additional input fields. When all of the required information
    has been entered, the page will change to a text page that can be copied and pasted
    for iptables to read as a safe configuration. On Fedora Core 5 the iptables configuration
    is stored in /etc/sysconfig/iptables. Although this method requires you to replace
    the default iptables configuration file used by your distribution, it is fairly
    painless, and supports all of the basic functionality as Firestarter.


    # Firewall Builder


    Firewall Builder is the most complete GUI offering for managing netfilter firewalls
    with features and capabilities comparable to some commercial firewall products.
    As is always the case, this functionality and capability come at a price: as netfilter
    GUI are concerned, Firewall Builder is not the easiest to configure and use. If
    you want or need your management capabilities, the extra effort is worth it. (Download
    firewall builder from www.fwbuilder.org/) Firewall Builder manages netfilter firewalls
    as well as ipfilter, OpenBSD PF, and (commercially) Cisco PI. Firewall Builder
    runs on many popular operating systems including Red Hat, Mandrake, FreeBSD, Mac
    OS X, and Windows XP.


    Firewall Builder operates differently than all of the GUIs covered so far. It
    uses an object-based approach. Essentially you must define an object to represent
    any entity that you want to use in the firewall rules. In most cases this means
    a source, a destination, and a service (port) at a minimum. Both the configuration
    and the GUI bear a strong resemblance to that of the Checkpoint Firewall GUI.
    The objects are defined, you can drag and drop them into the rules to permit or
    deny communications between the two. For this example we use a Windows XP host
    to run Firewall Builder and configure a Linux firewall.


