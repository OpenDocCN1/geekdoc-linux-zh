    # Syslog-ng


    Syslog-ng is a logging daemon that is the replacement for the traditional syslogd.
    The "ng" is an acronym for "next generation." The original syslog Unix logging
    daemon that handled requests for syslog services, but was difficult to configure.
    Syslog-ng is easier to configure and offers additional logging features, such
    as more configurations. For example, syslog-ng allows administrators to filter
    messages based on priority, as well as the content of the messages. It can also
    forward on TCP, sort logs to different destinations, and create a direct log stream
    to various hosts. The syslog-ng home page is shown in Figure 224 and is located
    at www.balat.com/network-security/syslog-ng.


    # Figure 2.24 Syslog-ng Home Page


    ![](img/33fc180c04c8f96c022bce6e62ae12fd_77_0.png)


    The basic problem with syslog systems is that they contain a lot of unimportant
    information. This information is often called noise. Many events are lost because
    they are buried in the noise. Syslog made it difficult to choose only the important
    messages.


    The reason this occurs is that messages are sent to different destinations depending
    on the assigned facility/priority pair. These destinations are very broad, and
    include general


    www.synergy.com'
