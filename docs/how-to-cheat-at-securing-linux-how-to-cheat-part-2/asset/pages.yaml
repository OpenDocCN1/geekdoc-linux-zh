    # # Auditing Access to Resources


    Auditing serves an important role in network security. Not only does it allow
    you a means to know what is occurring on your systems in real time; it can also
    allow you to reconstruct a series of events after the fact, which can be especially
    important after a successful compromise has occurred. There are basically two
    types of auditing you can do. One is *kernel* auditing, which will log system
    calls, and the other is *syslog*, which can log everything else.


    # # Enabling the Audit Daemon


    Enabling auditing is a very straightforward process. If you don''t have auditd
    installed, go ahead and install it. It should be set to start automatically; if
    you don''t, configure it to do so. The primary file for configuration of auditd
    is /etc/audit.conf. This file contains settings such as where to write the logs
    (defaults to /var/log/audit/audit.log), the log formatting, and what to do if
    the disk is full. Parameters of note are the *dispatcher*, *disk_full_action*,
    and *max_log_file_action*. Dispatcher is the program that the audit daemon will
    use to send all logs to stdin. This program will be run as root, so the program
    needs to be secured with'
  merge: -1
  pgno: 382
- img_proc: true
  md: 'caution. The disk_full_action is exactly what it sounds like: what should the
    daemon do when the disk that holds the log is full? Max_log_file_action tells
    the daemon what to do when the maximum log_file_size is reached.


    > TIP If auditd is running, the logs for SELinux are written to the same location
    specified in the audit.conf file. If auditd is not running, the logs will instead
    be written to the syslog log (which is at /var/log/messages by default). You can
    view the logs directly or type dmesg in a terminal to view them.


    The other relevant file for the audit daemon is /etc/audit.rules. This file tells
    the audit daemon when events occur. By default, the file contains no rules. If
    you wanted to audit all calls for mount, for example, you would place the following
    line in your audit.rules file:

    -a tools, always -S mount

    -w /etc/fstab


    This basically adds a rule to the end of the list (-), and always generate an
    audit event. The -S means the syscall to watch. -w tells it to watch the /etc/fstab
    file for access attempts and log them. The usefulness of being able to close tabs
    on some of the important systems is becoming clearer now. This is a very powerful
    tool for spotting intrusion attempts and other activities that could indicate
    someone is trying to do something they shouldn''t be doing.The watch option does
    not accept wildcards, so -w /etc/*.conf will not work.


    # Enabling the Syslog Daemon


    The daemon that supports syslogd. With current Linux distributions, you would
    be hard-pressed to find one that doesn''t come with syslog already enabled, but
    if you wanted to manage it you can install it like any other package. Once it''s
    installed, you can control its behavior through /etc/syslog.conf. This rule file
    is relatively simple. Each line connects a facility, a priority, and an action.
    Take the following example:


    /var/log/maillog


    This daemon would log to all events from the main system, such as facility, regardless
    of their priority, to /var/log/maillog. Pretty straightforward. Examples of priorities
    are debug, info, notice, crit, alert, *, and emerg indicate the overall severity
    of the event. An asterisk (*) stands for all facilities or priorities, depending
    on where it is used. Unless a given facility isn''t used or available on your
    bastion host, you should point the logs someplace for all of them. The action
    will typically point to a real file, but some other


    ![](img/33fc180c04c8f96c022bce6e62ae12fd_383_0.png)'
  merge: -1
  pgno: 383
- img_proc: true
  md: 'options are available. The most notable one from a security perspective is
    the remote machine action. This allows you to send the logs to a remote machine,
    which is a good idea. The syntax for the remote machine action is simply @host.
    If your bastion host was compromised by a hacker, any logs on that host would
    become suspect and of less value if legal action had to be taken. By sending the
    syslog events to a syslog daemon on another machine, you can ensure their integrity.


    # Viewing and Managing the Logs


    Not that you have enabled these logs, you will hopefully be generating a lot of
    auditing information. The issue then what becomes to do with all data. You need
    a way to sort through it and pick out the most interesting pieces, to do something
    about it where necessary, preferably all in automated fashion as possible. The
    way to do this is through several log tools. One of the simplest of utilities
    is dmes. It lacks any real features; it is merely a quick way to display the system
    message buffer.


    A good site covering log analysis is log.org by Tina Bird. You can probably find
    a utility to do about anything you want to do with log files, sending e-mails
    for certain events to shutting down processes or color-coding the events on the
    console. Two popular tools are swatch and logwatch. Of the two, swatch is the
    more lightweight, easier to set up and having fewer options. Swatch is intended
    to parse the logs in real time and act on what it finds inside the logs according
    to the configuration you specify. Logwatch has a slightly different role: Its
    focus is on analyzing and reporting on log files, but not in real time.


    # Configuring Swatch


    Since swatch (short for simple watcher) is relatively focused in its purpose,
    the setup and configuration are pretty simple. Some swatch behaviors come from
    the command line, and the rules to be made in a configuration file. An example
    line to invoke swatch would be swatch -c /etc/swatch.conf /var/log/syslog, which
    would tell swatch to watch the configuration file (-f) at /etc/swatch.conf. If
    you do not specify which file to watch (-t), swatch will default to /var/log/messages
    or /var/log/syslog, in that order. If you specify a configuration file, it will
    echo -f <file> to examine a file once instead of running continuously with the
    -t options.


    If you had the following lines in your configuration file, they would cause any
    line denied or Denied to the console as yellow text and sound the bell once. Everything
    would echo to the console as normal text.


    ```

    watchfor /[dB]enied/

    echo yellow

    bell 1

    ```'
