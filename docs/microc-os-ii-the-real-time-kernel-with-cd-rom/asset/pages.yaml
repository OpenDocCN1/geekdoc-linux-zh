    # 1.04 OS_ENTER_CRITICAL() and OS_EXIT_CRITICAL()


    Throughout the source code provided in this book, you will see calls to the following
    macros: OS_ENTER_CRITICAL() and OS_EXIT_CRITICAL() . OS_ENTER_CRITICAL() is a
    macro that disables interrupts and OS_EXIT_CRITICAL() is a macro that enables
    interrupts. Disabling and enabling interrupts is done to protect critical sections
    of code. These macros are obviously processor specific and are different for each
    processor. These macros are found in OS_CPU.H . Listing 1.3 the declarations of
    these macros for the 80x86 processor. Section 9.03.02 discusses why there are
    ways of declaring these macros.


    ```

    #define OS_CRITICAL_METHOD 2


    #if

    #define OS_CRITICAL_METHOD == 1

    #define OS_ENTER_CRITICAL() asm CLI

    #define OS_EXIT_CRITICAL() asm STI

    #endif


    #if

    #define OS_CRITICAL_METHOD == 2

    #define OS_ENTER_CRITICAL() asm (PUSH; CLI)

    #define OS_EXIT_CRITICAL() asm POPF

    #endif

    ```


    Listing 1.3, Macros to access critical sections.


    Your application code can make use of these macros as long as you realize that
    they are used to disable and enable interrupts. Disabling interrupts obviously
    affect latency so be careful. You can also protect critical sections using semaphores.


    # 1.05 PC Based Services'
