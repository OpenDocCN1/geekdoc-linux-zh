    The number of bytes in the CODE column have been rounded to the nearest 25 bytes.
    I used the Borland C/C++ compiler v1.3 and the options were set to generate the
    fastest code. The number of bytes shown are not meant to be accurate but serve
    to give you a relative idea of how much space each of μC/OS-II group of services
    requires. For example, if you don''t message queue services (i.e. OS_Q_EN set
