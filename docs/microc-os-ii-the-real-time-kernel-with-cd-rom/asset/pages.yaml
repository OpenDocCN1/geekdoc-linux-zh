  md: '# # Appendix F


    # # Licensing


    µC/OS-II is a great real-time kernel and has proven itself in countless applications
    all around the world. Also, a number of Colleges and Universities are using µC/OS
    to teach real-time accredited software.


    µC/OS-II''s source and object code can be freely distributed (to students) by
    Colleges and Universities without requiring a license, as long as there is no
    commercial application used. In other words, no licensing is required if µC/OS-II
    is used for educational use.


    You MUST obtain an ''Object Code Distribution Licence'' to embed µC/OS-II in a
    commercial product. In other words, you must obtain a license to put µC/OS-II
    in a product that is sold with the intent to make a profit. There will be a fee
    for such situations and you will need to contact me (see below) for real-time
    pricing.


    You MUST obtain an ''Source Code Distribution Licence'' to distribute µC/OS-II''s
    source code. Again, there will be a fee for such license and you will need to
    contact me (see below) for pricing.


