    \ the TIMEOUT period. This is basically identical to OSTimeDly (TIMEOUT), the\
    \ task can be resumed by calling Task2 when Task (2) post a 'dummy' message to\
    \ the mailbox before the timeout expires. This is the same as OSTimeDlyResume()\
    \ had Task1() called OSTimeDly(). You should note that the returned message is\
    \ ignored because we are not actually looking to get a message from another task\
    \ or an ISR.\n\n```\nOS_EVENT\nvoid Task1 (void *pdata)\n{\n    INT8U err;\n\n\
    \    for (;;) {\n        OSMboxPend(MboxTimely, TIMEOUT, &err); /* Delay task\
    \ */\n        /* Code executed after time delay */\n    }\n}\n\nvoid Task2 (void\
