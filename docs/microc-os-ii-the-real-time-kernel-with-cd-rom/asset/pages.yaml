  md: "# # Preface\n\nMy book, “μC/OS, The Real-Time Kernel” is now 6 years old and\
    \ the publisher has sold over 15,000 copies around the world. When I was asked\
    \ to a second edition, I thought it would be a fairly straightforward task; a\
    \ few corrections here there, clarify a few concepts, add a function or two to\
    \ the kernel, etc. If you have a copy of the first edition, you will notice that\
    \ “μC/OS-II, The Real-Time Kernel” is in a major revision. For some strange reason,\
    \ I wasn't satisfied with minor corrections. Also, when my publisher told me this\
    \ time, the book would be a ‘hard cover’, I really wanted to give you money worth.\
    \ In all, I added more than 200 pages, and I added a portant guide to help you\
    \ port μC/OS-II to the processor of your choice. Also, I added a chapter that\
    \ will guide you through upgrading a μC/OS port to μC/OS-II.\n\nThe code for μC/OS-II\
    \ is basically the same as that of μC/OS except that it contains a number of new\
    \ and useful features, is much better commented, and should be easier to port\
    \ to processor architectures. μC/OS-II offers all the features provided in μC/OS\
    \ as well as the following new features:\n\n+   - A fixed-size block memory manager,\n\
    - A service to allow a task to suspend its execution for a certain amount of time\
    \ (specified in minutes, minutes, seconds, and milliseconds)\n- User definable\
    \ ‘callout’ functions that are invoked when:\n  - a task is created,\n  - a task\
    \ is deleted,\n  - a context switch is performed,\n  - a clock tick occurs.\n\
    - A new task create function that provides additional features,\n- Stack checking,\n\
    - A function returning the version of μC/OS-II,\n- And more.\n\n# ## μC/OS-II\
    \ Goals\n\nProbably the most important goal of μC/OS-II was to make it backward\
    \ compatible with μC/OS (at least from an application’s standpoint). A μC/OS port\
    \ might need to be modified to work with μC/OS-II but at least, the application\
    \ code should require only minor changes (if any). Because μC/OS-II is based on\
    \ the same core as μC/OS, it is just as reliable. I added conditional compilation\
    \ to allow you to reduce the amount of RAM (i.e. data space) needed by μC/OS-II.\
    \ This is especially useful when you have limited products. I also added the feature\
    \ described in the previous section and cleaned up the code.\n\nWhere the book\
    \ is concerned, I wanted to clarify some of the concepts described in the first\
    \ edition and provide additional explanations about how μC/OS works. I had numerous\
    \ requests about doing a chapter on how to port μC/OS and thus, such a chapter\
    \ has been included in this book for μC/OS-II."
  merge: -1
