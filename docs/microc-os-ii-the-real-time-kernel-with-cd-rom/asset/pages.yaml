  md: '# Listing 5.1, OSTimeDly()


    It is important to realize that the realization of a delay is between 0 and 1
    tick. In other words, if you try to delay for only one tick, you could end up
    with a delay between 0 and 1 tick. This is assuming your processor is not heavily
    loaded. Figure 5-1 illustrates what happens. A tick interrupt occurs every 10
    mS F5-1. Assuming you are not serving any other interrupts and you have interrupts
    enabled, the tick ISR will be invoked F5-1(2). You may have a few high priority
    tasks (i.e. HPTs) that were waiting for time to expire so they get to execute
    next F5-1. The low priority task (i.e. LPT) shown in figure 5-1 then gets a chance
    to execute and, upon completion, calls OSTimeDly(1) which delays the task until
    the next tick ISR(4). When the next tick arrives, the tick ISR executes F5-1(5)
    but this, there are no HPTs to execute and, μC/OS executes the task that delayed
    itself for 1 tick F5-1(6). As you can see, the task actually delayed for than
    one tick! On heavily loaded systems, the task may call OSTimeDly(1) a few tens
    of microseconds before the tick occurs and the delay would result in almost no
    delay because the task would be immediately rescheduled. If your application must
    delay for at least one tick, you must call OSTimeDly(2) thus specifying a delay
    of 2 ticks!


    ![](img/114817931de46def85b7b339e903e24f_130_0.png)


