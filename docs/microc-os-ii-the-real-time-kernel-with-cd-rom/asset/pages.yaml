  md: "# # OSTimeDly()\n\nvoid OSTimeDly(INT16U ticks);\n\n| File | Called from |\
    \ Code enabled by |\n| OS_TIME.C | Task only | N/A |\n\nOSTimeDly() allows a task\
    \ to delay itself for a number of clock ticks. Rescheduling always occurs when\
    \ the number of clock ticks is greater than zero. Valid delays range from 0 to\
    \ 65535 ticks. A delay of 0 means that the task will not be delayed and OSTimeDly()\
    \ will return immediately to the caller. The actual delay time depends on the\
    \ tick rate see OS_TICKS_PER_SEC in the configuration file OS_CFG.H.\n\n# Arguments\n\
    \n**ticks** is the number of clock ticks to delay the current task.\n\n# Returned\
    \ Value\n\nNONE\n\n# Notes/Warnings\n\nTo calling this function with a delay of\
    \ 0 results in no delay and the function returns immediately to the caller. To\
    \ ensure a delay for the specified number of ticks, you should consider using\
    \ a delay value that is one tick higher. For example, to delay a task for at least\
    \ 10 ticks, you should specify a value of 11.\n\n# Example\n\n```\nvoid TaskX(void\
    \ *pdata)\n{\n    for (;;) {\n\n        OSTimeDly(10);      /* Delay task for\
    \ 10 clock ticks */\n    }\n}\n```\n\n# # OSTimeDlyHMSM()\n\nvoid OSTimeDlyHMSM(INT8U\
    \ hours, INT8U minutes, INT8U seconds, INT8U milli);\n\n| File | Called from |\
    \ Code enabled by |\n| OS_TIME.C | Task only | N/A |"
  merge: -1
