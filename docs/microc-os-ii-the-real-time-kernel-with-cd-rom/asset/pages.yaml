    \ constants in μC/OS you will need to include them in OS_CPU.H.\n\n# 10.02.04\
    \ OS_CPU.H, OS_STK_SW()\n\nOS_TASK_SW() is a macro that is invoked when μC/OS-II\
    \ switches from a low-priority task to the highest-priority task. OS_TASK_SW()\
    \ is always called from task level. This macro doesn't need to be changed from\
    \ μC/OS to μC/OS-II.\n\n# 10.02.05 OS_CPU.H, OS_FAR\n\nOS_FAR was used in μC/OS\
    \ because of the Intel 8086 architecture. This #define has been removed in μC/OS-II\
