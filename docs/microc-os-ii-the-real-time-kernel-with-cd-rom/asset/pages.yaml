    Figure 9-1, 80x86 Real-Mode Register Map


    The 80x86 provides a clever mechanism to access up to 1 Mbytes of memory with
    16-bit registers. Memory addressing relies on using a segment and an offset register.
    Physical address calculation is done by shifting a segment register by 4 (multiplying
    it by 16) and adding one of six other registers (AX, BP, SP, SI, DI or IP). The
    result is a 20-bit address which can access up to 1 Mbytes. Figure 9-2 shows how
    the registers are combined. Each segment points to a block of 16 memory locations
    called a paragraph. A 16-bit segment register can point to any of 65,536 different
    paragraphs of 16 bytes and thus address 1,048,576 bytes. Because the offset is
    also 16-bit, a single segment of code cannot exceed 64 Kbytes. In practice, however,
    programs are made up of many smaller segments.'
