  md: "# 8.04.04 OS_CPU_A.ASM, OSTickISR()\n\nμ/OS-II requires that you provide a\
    \ periodic time service to keep track of time delays and timeouts. A ‘tick’ should\
    \ occur between 10 and 100 times per second, or Hertz. To accomplish this, you\
    \ can dedicate a hardware timer, or obtain 50/60 Hz from an AC power line.\n\n\
    You MUST enable tick interrupts AFTER multitasking has started, i.e. after calling\
    \ OSStart (). In other words, you should initialize and tick interrupts in the\
    \ first task after calling OSStart (). A common mistake is to enable tick interrupts\
    \ before calling OSInit() and OSStart() as shown in listing 8.4:\n\n```\nvoid\
    \ main(void)\n{\n    OSInit();                      /* Initialize μC/OS-II */\n\
    \n    /* Application initialization code ... */\n    /* Create at least on task\
    \ by calling OSTaskCreate() */\n\n    Enable TICKER interrupts;      /* DO NOT\
    \ DO THIS HERE!!! */\n\n    OSStart();                     /* Start multitasking\
    \ */\n}\n```\n\n# Listing 8.4, Incorrect place to start the tick interrupt.\n\n\
    What could happen (and it has happened) that the tick interrupt could be serviced\
    \ before μ/OS-II starts the first task. At this point, μ/OS-II is in an unknown\
    \ state and will cause your application to crash.\n\nThe pseudo code for the tick\
    \ ISR is shown in listing 8.5. This code must be written in assembly language\
    \ because you cannot access CPU registers directly from C. If your processor is\
    \ able to increment OSIntesting with a single instruction, there is no need to\
    \ call OSIntEnter(). Incrementing OSIntesting is much greater than going through\
    \ the overhead of a function call and return. OSIntEnter only increments the OSIntesting,\
    \ while protecting that increment in a critical section.\n\n```\nvoid OSTickISR(void)\n\
    {\n    Save processor registers;\n    Call OSIntEnter() or increment OSIntesting;\n\
    \n    Call OSTimeTick();\n\n    Call OSIntExit();\n    Restore processor registers;\n\
    \    Execute a return from interrupt instruction;\n}\n```\n\n# Listing 8.5, Pseudo\
    \ code for Tick ISR"
