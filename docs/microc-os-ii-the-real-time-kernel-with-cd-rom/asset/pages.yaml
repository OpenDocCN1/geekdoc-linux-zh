  md: "# Chapter 5\n\n# Time Management\n\nWe saw in section 3.10 that μC/OS-II (as\
    \ do other kernels) requires that you provide a periodic interrupt to keep track\
    \ of tick delays and timeouts. This periodic time source is called a Clock Tick\
    \ and should occur between 10 and 100 times per second, or Hertz. The actual frequency\
    \ of the clock tick depends on the desired resolution of your application. However,\
    \ the higher the frequency of the ticker, the higher the overhead.\n\nSection\
    \ 3.10 discussed the tick ISR (Interrupt Service Routine) as well as the function\
    \ that it needs to notify μC/OS-II about the tick interrupt, OSTimeTick(). This\
    \ chapter will describe five services that deal with time issues:\n\n+   1) OSTDly().\n\
    2) OSTDlyBSM().\n3) OSTDlyResume().\n4) OSTimeGet() and,\n5) OSTDlySet().\n\n\
    The functions described in this chapter are called in the file OS_TIME.C.\n\n\
    # 5.00 Delaying a task, OSTDly()\n\nμC/OS-II provides a service that allows the\
    \ task to delay for a specified number of clock ticks. This function is called\
    \ OSTDly(). Calling this function causes a context switch and forces μC/OS-II\
    \ to execute the next highest priority task that is ready-to-run. The task calling\
    \ OSTDly() will be made ready as soon as the specified time expires, or another\
    \ task cancels the delay by calling OSTDlyResume(). You should note that this\
    \ task will only run when it's its highest priority.\n\nListing 5.1 shows the\
    \ code for OSTDly(). As can be seen, your application calls this by supplying\
    \ the number of ticks to delay and a value between 0 and 65535. If you specify\
    \ a value of zero in L5(1), you are indicating that you don't want to delay and\
    \ the function will immediately return to the caller. A non zero value calls OSTDly()\
    \ to remove the current task from the ready list L5(2). Next, the number of ticks\
    \ are stored in the OS_TCB of the current task L5(1) where it be determined on\
    \ every clock tick by OSTimeTick(). Finally, since the task is no longer ready,\
    \ the scheduler calls L5(4) so that the next highest priority task is ready-to-run\
    \ executes.\n\n```\nvoid OSTDly(INT16 ticks) {\n    if (ticks > 0) {\n       \
    \ OS_ENTER_CRITICAL();\n        if ((GSRdyTab[OSTCBUR->OSTCBITbitX] == 0) (\n\
    \            GSRdyGrp &= ~OSTCBUR->OSTCBITY);\n        )\n    }\n    OSTTCB->OSTDly\
    \ = ticks;\n    OS_EXIT_CRITICAL();\n}\n```"
