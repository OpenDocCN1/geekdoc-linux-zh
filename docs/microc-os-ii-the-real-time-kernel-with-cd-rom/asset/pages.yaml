  md: '| File | Called from | Code enabled by |

    | OS_Q_C | Task or ISR | OS_Q_EN |


    OSQPostFront() is used to send a message to a task through a queue. OSQPostFront()
    behaves much like OSQPost() except that the message is inserted at the front of
    the queue. This means OSQPost() makes the queue behave like a last-in-first-out
    (LIFO) instead of a first-in-first-out (FIFO) queue. A message is pointer size
    variable and its use is application specific. If the message queue is full an
    error is returned to the caller. OSQPostFront() will immediately return to its
    caller and the message will not be placed in the queue. If any task is waiting
    for a message at the queue then, the highest priority task will receive the message.
    If the waiting for the message has a higher priority than the task sending the
    message, the higher priority task will be resumed and the task sending message
    will be suspended. In other words, a context switch will occur.


    # Arguments


    pevent is a pointer to the queue the message is deposited into. This pointer is
    returned to the application when the queue is created (see OSCreate()).


    msg is the actual message sent to the task. msg is a pointer size variable and
    application specific. You MUST never post a NULL pointer.


    # Returned Value


    OSQPostFront() returns one of these two error codes


    +   1) OS_NO_ERR, if the message was deposited in the queue

    2) OS_Q_FULL, if the queue is already full


    # Notes/Warnings


    Queues must be created before they are used.


    # Example


    ```

    OS_EVENT *CommQ;

    CommRxBuf[100];

    nvoid CommTaskRx(void *pdata)

    {

    INT32 err;


    pdata = pdata;

    for (;;);


    err = OSQPostFront(CommQ, (void *)&CommRxBuf[0]);

    if (err == OS_NO_ERR)

    /* Message was deposited into queue */

    } else {

    /* Queue is full */

    }

    ```'
