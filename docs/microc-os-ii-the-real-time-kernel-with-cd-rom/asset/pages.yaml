    \                    INT16   opt)\n{\\{\n                    void    *psp;\n \
    \                   INT8    err;\n                    INT16   i;\n           \
    \         OS_STK  *pfill;\n\n                    if (prio > OS_LOWEST_PRIORITY)\
    \ {\n                        return (OS_PRIO_INVALID);\n                    }\n\
    }\n```"
