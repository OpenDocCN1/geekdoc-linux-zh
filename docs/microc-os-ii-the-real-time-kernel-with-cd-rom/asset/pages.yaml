    OS_TC of a new task is always inserted at the beginning of the list. Finally,
    the task is made to run L.4(6) and OSTCBInit() returns to its caller OSTTaskCreate()
    with a code indicating that OS_TC has been initialized and L.4(2).


    We can now continue the discussion of OSTTaskCreate() (see listing 4.1). Upon
    return from OSTCBInit(), OSTTaskCreate returns the code L.1(7) and upon success,
    increments the counter of the number of tasks created, OSTTaskKlr.L(418). If OSTInit()
    failed, the priority is relinquished by setting the entry in OSTCBPrioTbl[prio]
    to 0 L.1(12). OSTTaskCreate then calls OSTCreateHook() L.1(9) which is a user
    specified function that allows to extend the functionality of OSTTaskCreate().
    For example, you could initialize and store the contents of floating-point registers,
    MMU registers or anything else that can be associated with a task. You would,
    typically store this additional information in memory that has allocated by your
    application. OSTCreateHook() can be declared either in OS_CPU_C or if OS_CPU_HOOKS_EN
    is set to 1 or otherwise. Note that interrupts are disabled when OSTTaskCreate()
    calls'
