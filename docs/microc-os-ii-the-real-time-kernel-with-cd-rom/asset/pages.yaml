  md: '# 10.05 Summary


    Table 10.3 provides a summary of the changes needed to bring a port for μC/OS
    to work with μC/OS-II. You should note that "processor_name?" Is the name of the
    μC/OS file containing the port.


    | μC/OS | μC/OS-II |

    | --- | --- |

    | Processor_name.H | OS_CPU.H |

    | Data types: | Data types |

    | Change UBYTE to | INT8U |

    | Change UBYTE to | INT8S |

    | Change UWORD to | INT16U |

    | Change WORD to | INT16S |

    | Change ULONG to | INT32U |

    | Change LONG to | INT32S |

    | Change OS_STK_TYPE to | OS_STK |

    | OS_ENTER_CRITICAL () | No change |

    | OS_EXIT_CRITICAL () | No change |

    | - | Add OS_STK_GROWTH |

    | OS_TASK_SW () | No change |

    | OS_FAR | Define OS_FAR to nothing or, |

    | - | Remove all references to OS_FAR |

    | Processor_name.ASM | OS_CPU.ASM |

    | OSStartHighRdy () | Add call to OSTaskSwHook () |

    | - | Set OSRunning to 1 (8-bit) |

    | OSCtxSw () | Add call to OSTaskSwHook () |

    | OSIntCtxCtxSw () | Copy OSPrioHighRdy to OSPrioCur (8-bit) |

    | - | Add call to OSTaskSwHook () |

    | OSTickISR () | Copy OSPrioHighRdy to OSPrioCur (8-bit) |

    | - | No change |

    | Processor_name.C | OS_CPU.C_C |

    | OSTTaskCreate () | Extract stack initialization code and put this in a function
    called OSTaskStkInit () |

    | - | Add an empty function called OSTTaskCreateHook () |

    | - | Add an empty function called OSTTaskDelHook () |

    | - | Add an empty function called OSTTaskStatHook () |

    | - | Add an empty function called OSTimeTickHook () |


    Table 10.3, Summary of migrating a μC/OS port to μC/OS-II.'
