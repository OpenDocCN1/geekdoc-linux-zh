  md: 'I thought of writing a paper for a magazine. I first went to the "C User''s
    Journal (CUJ)" (the kernel was written in C) which, I had heard, offering $100
    per page when other magazines were only paying $75 per page. My paper had 70 or
    so pages, which would be a nice compensation for the time I spent on my kernel.
    Unfortunately, the article was rejected! There were two reasons. First, the article
    was too long and the magazine didn''t want to publish a series. Second, they didn''t
    have "another article''.


    I decided to turn to Embedded Systems Programming (ESP) magazine because my kernel
    was designed for embedded systems. I contacted the editor of ESP (Mr. Tyler Spring)
    and told him that I had this kernel I wanted to publish in magazine. I got the
    same response from Tyler as I did from the C Journal: "Not another article! I
    told him my kernel was different, it was comparable to many commercial kernels
    and that the source code was very good. I was calling Tyler for three weeks (a
    weekend being busy) until he finally gave me the favor (by having him call me)
    and decided to publish the article. My article got edited down from 70 pages to
    30 pages and was published in two consecutive months (May 1992 and June 1992).
    The article was probably the most popular article in 1992. ESP had over 500 lines
    of the code in the first month. Tyler feared for his life because kernel vendors
    were upset that he published a kernel in magazine. I guess that they must have
    recognized the quality and capabilities of µOS (which was called µOS then). The
    article was really the first to expose the internals of an operating system to
    some people.


    Just about the time the article came out I went to Dr. Williams at R&D Productions
    (publisher of CUJ), 6 months after the initial contact with CUJ. He left me a
    message with my wife and told her that the article was interesting! I called back
    and told him something: "Now you don''t think you are a little bit late with this?
    "The article is being published in ESP." Bernard said: "No, you, you don''t understand,
    because the article is so large, I want to make a book out of it." Initially,
    Benny wanted to publish what I said (as the book would have only 70 or so pages).
    I said, I told him, "If I were going to write a book, I want to do it about 250
    pages to it. I changed the name of µOS to µCOS because ESP readers had been calling
    ''Mucus'' which didn''t sound too healthy! To think of it, it was a kernel that
    first came with that name. Anyway, I started The Real-Time Kernel book. I didn''t
    know how to start. Bernard agreed that we would sell 4000 to 5000 copies of the
    book out at that rate, we would be lucky if it sold 2000 copies. Benny insisted
    that these things take time to get known so, he continuing advertising in CUJ
    for about a year.


    A month or so after the book came out I went to my first Embedded Systems Conference
    (ESC) in Santa Clara, (September 1992). I met Tyler Sperry for the first time
    and showed him the first draft copy of my book. He very quickly agreed and it
    said something: "Would you like to speak at the next Embedded Systems Conference
    in Atlanta?" Knowing what he meant I said, "What would I talk about?" He said
    about "Using real-time kernels." I said: "On the trip back from California, I
    asked ''What do I really inspect?" I''ve never seen the front of a kernel before.
    What if I made a mistake of myself? What if I used some uncommon keywords? People
    don''t know how to use this conference?" He asked me. I prepared the article.
    The conference had 70+ attendees. In the first two minutes I had lost one pound
    of sweat. After my lecture, I had a crowd of 15 or so people come up to me and
    say they were very pleased with the lecture and liked my book. I got re-invited
    back to the conference but then didn''t attend the one in Santa Clara that year
    (i.e. 1993). I was able to attend the next conference in Boston (1994) and I have
    been a regular speaker at ESC ever since. For the past couple of years, I''ve
    been on the Organizing Committee. I do at least 3 lectures at every conference
    and each have average attendance of 200 and 300 people! My lectures are always
    ranked among the top 10 of the conference.


    To date, we sold over 15,000 copies or µCOS, The Real-Time Kernel around the world.
    I received and

    swered all''t over 10,000 e-mails from the following:


    In 1995, The Real-Time Kernel was translated into Japanese and published in a
    machine Interface in Japan. µCOS has been published to the following processors:


    Analog Devices AD21xx'
