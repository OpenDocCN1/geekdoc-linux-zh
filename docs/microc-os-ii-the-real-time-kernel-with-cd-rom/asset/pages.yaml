    b) the current task completes before the end of its time slice.


    µC/OS-II does not perform round-robin scheduling. Each task must have a unique
    priority for your application.


    # 2.13 Task Priority


    A priority is assigned to each task. The more important the task, the higher the
    priority given to it.


    # 2.14 Static Priorities


    Tasks are assigned to be static when the priority of each task does not change
    during the application''s execution. Each task is given a fixed priority at compile
    time. All the tasks and their constraints are known at compile time in a system
    where priorities are static.


    # 2.15 Dynamic Priorities


    Tasks are assigned to be dynamic if the priority of the tasks can be changed during
    the application''s execution; each task can change its priority at run-time. This
    is a desirable feature in a real-time kernel to avoid inversions.


