    #  3.11 µC/OS-II Initialization


    A requirement of µC/OS-II is that you call OSInit() before you call any of its
    services. OSInit() initializes all of µC/OS-II''s variables and data structures
    (OS_CORE_C).


    OSInit() creates the idle task (OSTaskIdle()) which is always ready-to-run. The
    priority of OSTaskIdle() is always set to OS_LOWEST_PRIO. If OS_TASK_STAT_EN and
    OS_TASK_CREATE_EXT_EN (in OS_CFG.H) are both set to 1, OSInit() also creates the
    statistic task, OSTaskStat() and makes it ready-to-run. The priority of OSTaskStat()
    is always set to OS_LOWEST_PRIO - 1.


    Figure 3-7 shows the relationship between some of µC/OS-II''s variables and data
    structures after calling OSInit(). The illustration assumes that:


    +   1. OS_TASK_STAT_EN is set to 1 in OS_CFG.H

    2. OS_LOWEST_PRIO is set to 63 in OS_CFG.H

    3. OS_MAX_TASKS is set to a value higher than 2 in OS_CFG.H


    The Task Control Blocks (OS_TCB) of these two tasks are chained together in a
    doubly-linked list. OSTCBList points to the beginning of this chain. When a task
    is created, it is always placed at the beginning of the list. In other words,
    OSTCBList always points to the TCB of last task created. The ends of the chain
    point to NULL (i.e. 0).


    Because both tasks are ready-to-run, their corresponding in OSdyTbl[] are set
    to 1. Also, the bit of both tasks are on the same row in OSdyTbl[], but only one
    in OSdyGrp is set to 1.'
