    \   Delay for 1 Second;\n}\n```\n\n# Listing 1.8, Task that creates the other\
    \ tasks.\n\nBefore create any other tasks, we need to determine how fast your\
    \ particular PC is. This is done by calling **OSStatInit()** L1.8(4). **OSStatInit()**\
    \ is shown in list1.9 and by delaying itself for two clock ticks so that it can\
    \ be synchronized to the tick interrupt L1.9(1). Because of this, **OSStatInit()**\
    \ MUST occur after the ticker has installed otherwise, your application will crash\
    \ When C/OS-II returns to **OSStatInit()**, a 32-bit counter called **OSIdleCtr**\
    \ is cleared L1.9.2 and another counter is incremented **OSStatInit()**. At this\
    \ point, μC/OS-II doesn't have anything else to execute and decides to enter the\
    \ Idle Task (internal in μC/OS-II). The idle task is an infinite loop that increments\
    \ the counter for none L1.9(3). After one, μC/OS-II resumes **OSStatInit()**,\
    \ which saves **OSIdleCtr** in a variable called **OSIdleCtrMax** L1.9(4). **OSIdleCtrMax**\
    \ now contains the largest value that **OSIdleCtr** can reach. When you start\
    \ adding application code, the idle task will get less of the processor's time\
    \ and thus, **OSIdleCtr** will not be allowed to count as high (assuming we will\
    \ reset **OSIdleCtr** every second). CPU utilization is computed by a task provided\
    \ by μC/OS-II **OSStatTask()** which executes every second.\n\n```\nvoid OSStatInit\
    \ (void) {\n    OSTimeDelay(2);\n```"
