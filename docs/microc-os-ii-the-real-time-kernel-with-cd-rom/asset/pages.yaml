  md: "OSTTaskQuery() allows your application to obtain information about a task.\
    \ Your application must allocate an OS_TCB data structure that will be used to\
    \ receive a 'snapshot' of the desired task's control block. Your copy will contain\
    \ every field in the OS_TCB structure. You should be careful when accessing the\
    \ contents of the OS_TCB structure, especially OSTCBNext and OSTCBPrev because\
    \ they will point to the next and previous OS_TCB in the chain of created tasks,\
    \ respectively.\n\n# Arguments\n\nprio is the priority of the task you wish to\
    \ obtain data. You can obtain information about the calling task by specifying\
    \ OS_PRIO_SELF.\n\npdata is a pointer to a structure of type OS_TCB which will\
    \ contain a copy of the task's control block.\n\n# Returned Value\n\nOSTTaskQuery()\
    \ returns one of these two error codes:\n\n+   1) OS_NO_ERR, if the call was successful.\n\
    2) OS_PRIO_ERR, if you are trying to obtain information from an invalid task.\n\
    \n# Notes/Warnings\n\nThe available fields in the task control block depends on\
    \ the following configuration options (see OS_CFG.H):\n\n+   OS_TASK_CREATE_EN\n\
    OS_O_EN\nOS_MBOX_EN\nOS_SEM_EN\nOS_TASK_DEL_EN\n\n# Example\n\n```\nvoid Task\
    \ (void *pdata)\n{\n    OS_TCB  task_data;\n    INT     err;\n    void    *pext;\n\
    \    INT     status;\n\n    pdata = pdata;\n    for (;;) {\n\n        err = OSTTaskQuery(OS_PRIO_SELF,\
    \ &task_data);\n        if (err == OS_NO_ERR) {\n            pext = task_data.OSTCBExtPtr;\
    \ /* Get TCB extension pointer */\n            status = task_data.OSTCBStat; /*\
    \ Get task status */\n        }\n    }\n}\n\n```"
  merge: -1
