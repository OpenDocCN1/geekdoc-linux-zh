- img_proc: true
  md: '# # Chapter 10


    # # Upgrading from

    μC/OS to μC/OS-II


    This chapter describes what you need to do to migrate a port for μC/OS to run
    on μC/OS-II. If you have gone through the effort ofing μC/OS to a microprocessor
    port the amount of work to get this port work with μC/OS-II will be minimal. In
    most cases, you should be able to do this in about an hour. If you are familiar
    with the μC/OS port then you may want to go to the summary in 10.05.


    # ## 10.00 Directories and Files


    The first thing you will notice that the directory structure for μC/OS-II is similar
    to μC/OS except that the main directory is \SOFTWARE\uCOS-II instead of \SOFTWARE\uCOS\,
    respectively.


    All μC/OS ports should be placed under the \SOFTWARE\uCOS-II on your hard drive.
    The source code for each compiler or microprocessor port MUST be found in either
    two or three files: OS_CPU.H, OS_CPU.C and optionally, OS_CPU_A.ASM. The assembly
    language is optional because some compilers will allow you to have in-line assembly
    language and thus, you can place the needed assembly language code in OS_CPU_C.C.


    The processor specific code (i.e. the port) for μC/OS was placed in files having
    processor name as of the file names. For example, the Intel 80x86 real-mode, model
    had files called: Ix86L.H, Ix86L_C.C, and Ix86L_A.ASM. Table 10.1 shows the correspondence
    between the file and directory names and the old ones.


    | Table 10.1, Renaming files for μC/OS-II |

    | \SOFTWARE\uCOS\Ix86L | \SOFTWARE\uCOS-II\Ix86L |

    | --- | --- |

    | Ix86L.H | OS_CPU.H |

    | Ix86L_A.ASM | OS_CPU_A.ASM |

    | Ix86L_C.C | OS_CPU.C |


    As a starting point, you will have to copy the old file names (the μC/OS directory)
    to the new names in the equivalent μC/OS-II directory. It will be easy to modify
    these files to create them from scratch. Table 10.2 shows a few examples of μC/OS
    port file translations.


    | \SOFTWARE\uCOS\I80251 | \SOFTWARE\uCOS-II\I80251 |

    | --- | --- |

    | I80251.H | OS_CPU.H |

    | I80251.C | OS_CPU.C |


    | \SOFTWARE\uCOS\M680x0 | \SOFTWARE\uCOS-II\M680x0 |

    | --- | --- |

    | M680x0.H | OS_CPU.H |

    | M680x0.C | OS_CPU.C |'
