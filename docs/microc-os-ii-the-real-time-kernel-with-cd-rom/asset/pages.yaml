  md: "# Listing 4.1, OSTaskCreate\n\nOSTaskCreate() starts by checking that the priority\
    \ is valid L4.1(1). The priority of a task must be between number 0 and OS_LOWEST_PRIO,\
    \ inclusively. Next, OSTaskCreate() makes sure that a task has not already been\
    \ created at the priority L4.1(2). With µOS-II, all tasks have a unique priority.\
    \ If the desired priority is free then µOS-II reverts the priority by placing\
    \ a NULL pointer in OSTCBrioTbl L4.3(1). This allows OSTaskCreate() to re-enable\
    \ L4.1(4) while it sets up the rest of the data structures for the task.\n\nOSTaskCreate()\
    \ then calls OSTaskSkInit() L4.1(5) which is responsible for setting up the task.\
    \ This function is processor specific and is found in OS_PU_C.C. Refer to Chapter\
    \ 8, Porting µOS-II for how to implement OSTaskSkInit(). If you have already a\
    \ port of µOS-II for the processor you are intending to use, then you need not\
    \ be concerned about implementation details. OSTaskSkInit() will be saved in the\
    \ task's OS_TCB. You should note that the fourth argument (i.c. opt) to OSTaskSkInit()\
    \ is set to 0. This is, unlike OSTaskCreate(), OSTaskSkInit() does not support\
    \ options, and there are no options to pass to OSTaskSkInit().\n\nµOS-II supports\
    \ stacks from high memory to low memory or from low memory to high memory. When\
    \ you call OSTaskCreate(), you must know how the stack grows OS_CPU_H_STACK_GROWTH\
    \ of the processor you are using because you must pass the task's top-stack to\
    \ OSTaskCreate() which either be the lowest memory location of a task or the highest\
    \ memory location of the stack.\n\nOnce OSTaskSkInit() has completed up the task,\
    \ OSTaskCreate() calls OSTcbInit() L4.1(6) to initialize an OS from the pool of\
    \ OS_TCBs. The code for OSTcbInit() is shown in list 4.2 but is found in OS_CORE.c\
    \ of OS_TCB. OSTcbInit() first tries to initialize an OS_TCB if the pool contains\
    \ a free OS_TCB L4.2(2) then the OS_TCB is initialized L4.2(3). Note that once\
    \ an OS_TCB is allocated, we can re-enable interrupts because, at this point,\
    \ the creator 'owns' the OS_TCB and it cannot be corrupted by any concurrent task.\
    \ We can proceed to initialize one of the OS_TCB fields with interrupts enabled.\n\
    \n```\nINT8U OSTcbInit(INT8U prio, OS_STK *ptos, OS_TCB *ptcbos, INT16 id,\n \
    \               INT16 sk_size, void *pext,\n                INT16 opt)\n{\n  \
    \  OS_TCB *ptcb=\"ptcb\"\n    OS_ENTER_CRITICAL();\n    ptcb = OSTcbFreeList;\
    \ (1)\n    if (ptcb = OS_TCB *) 0) { (2)\n        OSTcbFreeList = ptcb->OSTcbNext;\n\
    \    }\n    OS_EXIT_CRITICAL(); (3)\n    ptcb->OSTcbSkPtr = ptos;\n    ptcb->OSTcbPrio\
    \ = (INT8U)prio;\n    ptcb->OSTcbStat = OS_STAT_RDY; (4)\n    ptcb->OSTcbDly =\
    \ 0;\n#if OS_TASK_CREATE_EXT_EN (5) (6)\n    ptcb->OSTcbPext = psext;\n    ptcb->OSTcbSkSize\
    \ = sk_size;\n    ptcb->OSTcbSkBottom = pbos;\n    ptcb->OSTcbOpt = opt;\n#endif\n\
    \    ptcb->OSTcbId = id;\n```"
