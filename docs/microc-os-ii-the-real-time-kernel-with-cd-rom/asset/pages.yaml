    is executed (3) and makes a higher priority task ready-to-run. Upon completion
    of the ISR, a Return From Interrupt is executed and the CPU returns to the interrupted
    task F2-4(4). The code resumes... When the code completes, it calls a service
    provided by the kernel to relinquish the CPU to another task F2-4(6). The new
    higher priority task executes to handle the event signaled by the ISR F2-4(7).


    The most important drawback of a non-preemptive kernel is responsiveness. A higher
    priority task that has been ready to run may have to wait a long time to run,
    because the current task must give up the CPU when it is ready to do so. With
    background execution in foreground/background systems, task-level control in a
    non-preemptive kernel is non-deterministic; you rarely know which higher priority
    task will get control of the CPU. It is up to you to relinquish control of the
    CPU.


    To summarize, a non-preemptive kernel allows each task to run until it voluntarily
    gives control of the CPU. An interrupt will prevent a task. Upon completion of
    the ISR, the ISR returns to the interrupted task. Task-level response is much
    better than with a foreground/background system but is still non-deterministic.
    Very few kernels are non-preemptive.


    # 2.10 Preemptive Kernel


    A preemptive kernel is used when responsiveness is important. Because of this,
    μ/OS-II and most commercial real-time kernels are preemptive. The highest priority
    task ready to run is always given control of the CPU. When a task makes a higher
    priority task to run, the current task is preempted (suspended) and the higher
    priority task is immediately given control of the CPU. If an ISR completes, the
    interrupted task is suspended and the new higher priority task is resumed. This
    is illustrated in Figure 2-5.'
