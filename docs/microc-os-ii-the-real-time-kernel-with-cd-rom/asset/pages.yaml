- img_proc: true
  md: 'can use editors 0x4B to 0x5B, 0x5D to 0x66, or 0x68 to 0x6F. If you use this
    port on an embedded processor such as the 80186 you will most likely not be restricted
    in your choice of vectors.


    # 9.03.05  OS_CPU.H, Tick Rate


    The tick rate for RTOS should generally be set between 10 and 100 Hz. It is always
    preferable (but not necessary) to set the tick rate to a ''round number''. Unfortunately,
    on the PC, the default tick rate is 18.20648 Hz not what I would call a ''round
    number''. For this port, I decided to change the tick rate of the PC from the
    standard 18.20648 Hz to 200 Hz. There are two reasons to do this. First, 200 Hz
    happens to be eleven times faster than 18 Hz. This will allow us to ''chain''
    into DOS every 11 ticks. In DOS, the tick handler is responsible for ''system''
    maintenance which is expected to happen every 54.93 ms. The second reason is no
    5.0 ms time for response time and delays. If you are running the example code
    on an 803PC, you may find that the 200 Hz might be unacceptable. On a Pentium-II
    processor, 200 Hz is not likely to be a problem.


    This us to the last statement in OS_CPU.H which declares an 8-bit variable (OSTickDosCtr)
    that will keep track of the number of times the ticker is called. Every 11th time,
    the DOS tick handler will be called L.9(6). OSTDosCtr is in OS_CPU_A.ASM and really
    applies to a PC environment. You would most likely use this scheme if you are
    going to design an embedded system around a non-PC architecture because you would
    set the tick rate to the value in the first place.


    # 9.04 OS_CPU_A.ASM


    A µ/OS-II port requires that you write four fairly simple assembly functions:


    ```

    OSStartHighRdy()

    OSCtxSw()

    OSIntCtxSw()

    OSTickISR()

    ```


    # 9.04.01  OS_CPU_A.ASM, OSStartHighRdy()


    This function is called by OSStart() to start the highest priority task ready-to-run.
    Before you can call OSStart(), however, you MUST have created at least one of
    your tasks (see OSTaskCreate() and OSTaskCreateExt()). OSStartHighRdy assumes
    that OSTCBHighRdy points to the task control block of the task with the highest
