  md: "# 9.07 Execution times\n\nTables 9.3 and 9.4 show the execution time for most\
    \ μC/OS-II functions. The values were obtained by having the compiler generate\
    \ assembly language code for the 80186 processor with the source interleaved as\
    \ comments. The assembly code was then passed through the Microsoft MASM 6.11\
    \ assembler with the option set so that the number of cycles for each instruction\
    \ gets included. I added the number of instructions (the I column) and clock cycles\
    \ (the C column) for the code to obtain the values: maximum amount of interrupts\
    \ disabled for the minimum execution time of the service. As you can imagine,\
    \ this is a very tedious but worth the effort. Giving you this information allows\
    \ you to see the 'cost' impact of each function in terms of execution time. Obviously,\
    \ this information has very little use unless you are using 80186 processor except\
    \ for the fact that it gives you an idea of the relative cost for each function.\n\
    \nThe number of clock cycles were divided by 33 (i.e. I assumed a 33 MHz clock)\
    \ to obtain the execution time of the service in μS (i.e. the μS column). For\
    \ the minimum and maximum times, I always assumed the intended function of the\
    \ service was performed successfully. I further assumed that the processor was\
    \ able to run at the bus speed (i.e. without any wait states). On average, I determined\
    \ that the 80186 requires 10 clock cycles per instruction!\n\nFor the 80186, maximum\
    \ interrupt disable time is 33.3 μS (or 1100 clock cycles).\n\nN/A means the execution\
    \ time for the function was not determined because I didn't believe they were\
    \ critical.\n\n provided the column listing the number of instructions because\
    \ you can determine the execution time of the functions for other x86 processors\
    \ if you have an idea of the number of cycles per instruction. For example, you\
    \ could assume that a 80486 executes (on average) an instruction every 2 clock\
    \ cycle (5 times faster than a 80186). Also, if your 80486 was running at 66 MHz\
    \ instead of 33 MHz (2 times faster) then you could take the execution times listed\
    \ in the tables and divide them all by 10."
