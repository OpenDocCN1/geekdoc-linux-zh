  md: '# Listing 9.9, OStTaskSkInit()


    ```

    ```c

    opt = opts;                          /* *opt is not used, prevent warning */

    stk = (INT16) *ptos;                    /* */

    stk-- = (INT16)FF_SEG(data);           /* (1) Load stack pointer */

    stk-- = (INT16)FF_OFF(off);            /* (2) Simulate call to function with argument

    stk-- = (INT16)ret;               /* * return address of function call

    stk-- = (INT16)FF_SEG(task);           /* (3) */

    stk-- = (INT16)0x00D0;                  /* * SW Enters interrupts */

    stk-- = (INT16)FF_OFF(task);            /* (4) * Put pointer on top of stack */

    stk-- = (INT16)0x00AA;                  /* (5) * AX = 0AAAA */

    stk-- = (INT16)0x00BB;                  /* * BC = 0CCCC */

    stk-- = (INT16)0x00DD;                  /* * DX = 0DDDD */

    stk-- = (INT16)0x0000;                  /* * SP = 00000 */

    stk-- = (INT16)0x0111;                  /* * BP = 01111 */

    stk-- = (INT16)0x0222;                  /* * SI = 02222 */

    stk-- = (INT16)0x0333;                  /* * DI = 03333 */

    stk-- = (INT16)0x0444;                  /* * ES = 04444 */

    stk-- = (0);                             /* (6) * DS = Current value of DS */

    return (void*)stk);

    ```

    ```


    OStTaskSkInit creates and initializes a local pointer to 16-bit elements task
    entries are 16-bit wide on L.9.9. Note that µ/OS-II requires the parameter ptos
    to point to an empty stack.


    The Borland/C++ compiler passes the argument on the stack instead of registers
    (at least with compiler options selected). Because of this, data is placed on
    the stack frame with the OFFSET and SEGMENT on order L.9.2.


    The address of your task is placed on the next stack L.9.9(3). In theory, this
    would be the address of your task. However, in µ/OS-II, it must never return,
    or as case here is not really clear.


    The Status Word (SW) with the task address is placed on the stack L.9.9(4) to
    simulate the behavior of the processor in to an interrupt. The SW register is
    initialized to 0x0202. This will allow the task to be enabled when it starts.
    You can start all your tasks with interrupts disabled by using the SW to 0x0002.
    There is no option in µ/OS-II to selectively enables interrupts upon startup for
    some tasks and disable interrupts upon startup on. In other words, all tasks have
    interrupts disabled or startup or all tasks have them disabled. You could, overcome
    this limitation by passing the desired interrupt start place of a task by using
    data. If you choose to have interrupts disabled, each task will need to enable
    them when they execute. If you don''t, your application will crash! We would recommend
    that you leave the SW enabled to 0x0202 and enable interrupts when the task ends.


    The next registers are placed on the stack to simulate the PUSH, PUSH ES and PUSH
    DS instructions are assumed to be found at the beginning of every ISR. Note that
    the AX, CX, DX, SP, BP, SI and DI registers are placed to save the order of the
    PUSH instruction. If you were to port code to a ''plain 8086 processor'', you
    should note that each register has a unique value instead of all zeros. This can
    be useful for debugging. Also the Borland compiler supports ''pseudo-values''
    (i.e. the _DS keyword notifies the compiler to obtain the value of the DS register
    in this case is used to copy the current value of the DS register to the simulated
    stack frame L.9.9(6).


    Once completed, OStTaskSkInit returns the address of the new top-of-stack. OStTaskCreate()
    or OStTaskCreateExt() will save this address and it in the task''s O_TCB.'
