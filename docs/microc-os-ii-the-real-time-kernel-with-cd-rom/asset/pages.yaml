    \ (void *)1); /* Cancel delay for Task1 */\n    }\n}\n```\n\nListing 6.20, Using\
    \ a mailbox as a time delay.\n\n# 6.07 Message Queues\n\nA message (or simply\
    \ a queue) is a μC/OS-II object that allows a task or an ISR to send pointer size\
    \ variables to another task. Each pointer would be initially initialized to some\
    \ application specific data structure containing a 'message'. To enable μC/OS-II\
    \ message queue services, you must set the configuration constant OS_Q_EN to (see\
    \ file OS_CFG.H) and OS_MAX_QS also found in OS_CFG.H.\n\nA queue needs to be\
    \ created before it is used. Creating a queue is accomplished by calling OSQCreate()\
    \ (see next section) and specifying the number of entries (i, pointers) that a\
    \ queue can hold.\n\nμC/OS-II provides several services to access message queues:\
    \ OSQCreate(), OSQPend(), OSQPost(), OSQPostFront(), OSQAccept(), OSQFlush and\
    \ OSQQuery(). Figure 6-7 shows a flow diagram to illustrate the relationship between\
    \ tasks, ISRs and a message queue. Note that the symbol to represent a queue looks\
    \ like a mailbox with multiple entries. In fact, you find that a queue is an array\
    \ of mailboxes except that there is only one list waiting with the queue. Again,\
    \ where the pointers to post is application specific."
