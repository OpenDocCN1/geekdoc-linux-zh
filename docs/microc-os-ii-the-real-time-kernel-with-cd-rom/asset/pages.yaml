    have been extracted from OSTTaskCreate() and placed in OSTTaskStkInit(). In other
    words, everything after OS_EXIT_CRITICAL() L10.9(1) and calling OSTCBInit() has
    been moved to OSTTaskStkInit().


    You will notice that the code for μC/OS-II uses the new data types (see section
    10.02.01, OS_CPU.H, Compiler specific data types). Instead of initializing all
    the processor registers to 0x0000, initialize them with a value that would make
    debugging a little easier. You should note that the initial value of a register
    when a task is not critical.


