  md: '# 1.00 Installing µC/OS-II


    R & D Publications, Inc. has included a Companion Diskette µC/OS-II, The Real-Time
    Kernel. The diskette is in MS-DOS format and contains all the source code provided
    in this book. It is assumed that you have a DOS or Windows 95 computer system
    running on an 8086, Pentium or Pentium-II processor. You will need less than 5
    Mbytes of free disk space to install µC/OS-II and its source files on your system.


    Before starting the installation, make a backup copy of the companion diskette.
    To install the code provided on the companion diskette, follow these steps:


    +   1) Load DOS (or open a DOS box in Windows 95) and specify the C: drive as
    the default drive.

    Insert the companion diskette in drive A:

    Enter A:INSTALL [drive]


    Note that **drive** is an optional drive letter indicating the destination disk
    on which the source code provided in this book will be installed. If you do not
    specify a drive, the source code will be installed on the current drive.


    **INSTALL** is a DOS batch file called **INSTALL. BAT** and is found in the root
    directory of the companion diskette. **INSTALL. BAT** will then change the directory
    to **\SOFTWARE** and copy the file **uCOS-II.EXE** from the A: drive to this directory.
    **INSTALL. BAT** will then execute **uCOS-II.EXE**, which will create all other
    directories under **\SOFTWARE** and transfer all source and executable files provided
    in this book. Upon completion, **INSTALL. BAT** will delete **uCOS-II.EXE** and
    change the directory to **\SOFTWARE\uCOS-II\EX1_x86L** where the first example
    code is found.


    Make sure you read the **READ.ME** file on the companion diskette for last minute
    changes and notes.'
  merge: -1
