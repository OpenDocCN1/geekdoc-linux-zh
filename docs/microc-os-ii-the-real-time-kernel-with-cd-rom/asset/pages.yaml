    \ */\n        }\n    }\n}\n\n```\n\n# OSTaskStkChk()\n\n```\nINT32U OSTaskStkChk(INT32U\
    \ pric, INT32U *pfree, INT32U *pused);\n```\n\n| File | Called from | Code enabled\
    \ by |\n| OS_TASK.C | Task code | OS_TASK_CREATE_EXT |\n\nOSTaskStkChk() is used\
    \ to determine a task's stack statistics. Specifically, OSTaskStkChk() computes\
    \ the amount of free stack space as well as stack space used by the task. This\
    \ function requires that the task be created with OSTaskCreateExt() and that you\
    \ specify OS_TASK_OPT_STK_CHK in the opt argument.\n\nStack sizing is done by\
    \ 'walking' from the bottom of the stack and counting the number of zero entries\
    \ on the stack until a non-zero value is found. This course assumes the stack\
    \ is cleared when the task is created. For that purpose, you need to set OS_TASK_STK_CLR\
    \ to 1 in your configuration. You could set OS_TASK_STK_CLR to 0 if your RAM is\
    \ plenty and you never delete your tasks. This would reduce the execution time\
    \ of OSTaskCreateExt().\n\n# Arguments\n\nprio is the priority of the task you\
    \ desire to obtain information about. You can check the stack of the calling task\
    \ by passing OS_PRIO_SELF.\n\npdata is a pointer to a variable of type OS_STK_DATA\
    \ which contains the following fields.\n\n| INT32U OSFree; | /* Number of bytes\
    \ free on the stack */ |\n| INT32U OSUsed; | /* Number of bytes used on the stack\
    \ */ |"
