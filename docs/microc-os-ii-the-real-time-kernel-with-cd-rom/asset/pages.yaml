  md: '# Chapter 3


    # Kernel Structure


    This chapter describes some of the aspects of µC/OS-II. You will learn:


    +   - How µC/OS-II handles access to critical sections of code,

    - What a task is, and how µC/OS-II knows about your tasks,

    - How tasks are scheduled,

    - How µC/OS-II can determine how much of CPU your application is using,

    - How to write Interrupt Service Routines (ISRs),

    - What a clock tick is and how µC/OS-II handles it,

    - How to initialize µC/OS-II and,

    - How to start multitasking.


    This chapter also describes the following application services:


    +   - OS_ENTER_CRITICAL() and OS_EXIT_CRITICAL(),

    - OSInit().

    - OSStart().

    - OSIntEnter() and OSExit().

    - OSLocked() and OSSchedUnlock() and,

    - OSVersion().


    ### 3.00 Critical Sections

    uC/OS-II like all real-time kernels need to disable interrupts in order to access
    critical sections of code, and enable interrupts when done. This allows µC/OS-II
    to protect critical code from being entered simultaneously from multiple tasks
    or ISRs. The interrupt disable time is one of the most important specifications
    that a real-time kernel can provide because it affects the responsiveness of your
    system to real-time events. µC/OS-II tries to keep the interrupt disable time
    to a minimum, but µC/OS-II interrupt time is largely dependent on the processor
    architecture, and the quality of code generated by the compiler. Every processor
    generally provides instructions to disable/enable interrupts and your compiler
    must have a mechanism to perform these operations directly from C. Some compilers
    allow you to insert in-line assembly language in your source code. This will actually
    contain language extensions to enable and disable interrupts. To hide the implementation
    method chosen by the compiler, µC/OS-II defines two macros to enable and disable
    interrupts:

    OS_ENTER_CRITICAL() and OS_EXIT_CRITICAL(), respectively. Because these macros
    are processor specific, they are found in a file called OS_CPU.H. Each processor
    port will have its own OS_CPU.H file.


    Chapters 8, Porting µC/OS-II and chapter 9, x86, Large Model Port provide additional
    details with regards to these two macros.


