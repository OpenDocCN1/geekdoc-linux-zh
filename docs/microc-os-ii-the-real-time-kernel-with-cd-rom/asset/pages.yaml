    # 3.04 task Ready List


    Each task is assigned a unique priority level between 0 and OS_LOWEST_PRIO, inclusive
    (see OS_CFG.H). Task priority OS_LOWEST_PRIO is assigned to the idle task when
    mC/OS-II is initialized. You should note that OS_MAX_TASKS and OS_LOWEST_PRIO
    are unrelated. You can have only 10 tasks in an application while still having
    32 priority levels (if you set OS_LOWEST_PRIO to 31).


    Each task that is ready to run is placed in a ready list consisting of two variables,
    OSrdyGrp and OSrdyTbl[]. Task priorities are grouped (8 tasks per group) in OSrdyGrp.
    Each bit in OSrdyGrp is used to indicate whether any task in a group is ready
    to run. When a task is ready to run it also sets its corresponding bit in the
    ready table, OSrdyTbl[]. The size of OSrdyTbl[] depends on OS_LOWEST_PRIO, which
    allows us to reduce the amount of RAM (i.e. data space) by mC/OS-II when your
    application requires few priorities.


    To determine which priority (and thus which task) will run, the scheduler determines
    the lowest priority number that has its set in OSrdyGrp and OSrdyTbl[] is shown
    in Figure 3-3 and is given by the following rules:


    +   Bit 0 in OSrdyGrp is 1 when any bit in OSrdyTbl[0] [] is 1.

    Bit 1 in OSrdyGrp is 1 when any bit in OSrdyTbl[1] [] is 1.

    Bit 2 in OSrdyGrp is 1 when any bit in OSrdyTbl[2] [] is 1.

    Bit 3 in OSrdyGrp is 1 when any bit in OSrdyTbl[3] [] is 1.

    Bit 4 in OSrdyGrp is 1 when any bit in OSrdyTbl[4] [] is 1.

    Bit 5 in OSrdyGrp is 1 when any bit in OSrdyTbl[5] [] is 1.

    Bit 6 in OSrdyGrp is 1 when any bit in OSrdyTbl[6] [] is 1.

    Bit 7 in OSrdyGrp is 1 when any bit in OSrdyTbl[7] [] is 1.'
