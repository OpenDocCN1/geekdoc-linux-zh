    # 2.34 Memory Requirements


    If you are designing a foreground/background system, the amount of memory depends
    solely on your application code.


    With a multitasking kernel, things are quite different. To begin with, a kernel
    requires extra code space (ROM). The size of the kernel depends on many factors.
    On the features provided by the kernel, you can expect from 1 Bytes to 100 Kobytes.
    A minimal kernel for an 8-bit CPU that provides only scheduling, context switching,
    semaphore management, delays, and timeouts should require around 1 to 3 Kobytes
    of code space. The total code space is given by:


    ![](img/114817931de46def85b7b339e903e24f_77_0.png)


    # Equation 2.12, Code space needed when a kernel is used.


    Because each task runs independently of the other, each task must be provided
    with its own stack area (RAM). As a designer, you must determine the stack size
    of each task as closely as possible (this is sometimes a difficult undertaking).
    The stack size must not only account for the task requirements (local variables,
    function calls, etc.); the stack size must also account for interrupt nesting
    (saved registers, local storage in ISRs, etc.). Depending on the target processor
    and the kernel, a separate stack can be used to handle all interrupt-level code.
    A desirable feature is that the stack requirement for each task can be substantially
    reduced. Another desirable feature is the ability to specify the stack size of
    each task on an individual basis (µC/OS-II permits this). Conversely, some kernels
    require that all tasks be the same size. All kernels require extra RAM to maintain
    internal variables, data structures, queues, etc. The total RAM required if the
    kernel does not support a separate interrupt stack is given by:


    | Application code requirements + |

    | Data space (i.e. RAM) needed by the kernel + |

    | SUM(task stacks) + MAX(ISR nesting) |


    # Equation 2.13, Data space needed when a kernel is used.


    If the kernel supports a separate stack for interrupts, the total RAM is required
    by:


    | Application code requirements + |

    | Data space (i.e. RAM) needed by the kernel + |

    | SUM(task stacks) | |

    | MAX(ISR nesting) |'
