    \        }\n    }\n    ticks = ((INT32)hours) * 3600 * OS_TICKS_PER_SEC\n    \
    \    + ((INT32)minutes) * 60 * OS_TICKS_PER_SEC\n        + ((INT32)seconds) *\
    \ OS_TICKS_PER_SEC\n        + ((INT32)milli * 500/OS_TICKS_PER_SEC) / 1000; (3)\n\
    \    loops = ticks / 65536; (4)\n    ticks = ticks % 65536; (5)\n    OTimely(ticks);\
