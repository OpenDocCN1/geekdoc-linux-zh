  md: "# 9.04.03 OS_CPU_.ASM, OSIntCxSw()\n\nOSIntCxSw() is a function that is called\
    \ by OSIntExit() to perform a context switch from an ISR (Interrupt Routine).\
    \ Because OSIntCxSw() is called from an ISR, it is assumed that the processor\
    \ registers are properly saved over the interrupted task's stack. In fact, there\
    \ are more things on the stack frame than we use. OSIntCxSw() will have to clean\
    \ up the stack that the interrupted task is left with just the processor frame\
    \ content.\n\nThe code shown in listing 9.5 is identical to OSCtxSw except for\
    \ two things. First, there is no need to save the registers (i.e. PUSHA, PUSH\
    \ ES and PUSH DS) onto the stack because it is assumed that the beginning of the\
    \ ISR is that task. Second, OSIntCxSw() needs to update the stack pointer so the\
    \ stack frame contains only the context. To understand what is happening, refer\
    \ also to 9-5 for the following description.\n\n```\n_OSCtxSw PROC FAR       \
    \         ; Ignore calls to OSIntExit and OSIntCxSw\n(1)    ADD, SP,8        \
    \       (Uncommon if OS_CRITICAL_METHOD is 1, see OS_CPU.H)\n       ADD, SP,10\
    \                              (Uncommon if OS_CRITICAL_METHOD is 2, see OS_CPU.H)\n\
    \       MOV, AX, _OSTCBur       ; Reload DS in case it was altered\n       MOV,\
    \ DX, _OSTCBur\n(2)    LES, BDXW2, PTR DS:_OSTCBur      ; OSTCBur->OSTCBstkptr\
    \ = SS:SP\n       MOV, ES,[BX+2]                          ;\n       MOV, ES,[BX+0],\
    \ SP                     ;\n(3)    CALL  FAR PTR _OSCtxTaskWork\n(4)    MOV, WORD\
    \ PTR DS:_OSTCBurHighRdy+2 ; OSTCBurHighRdy\n       MOV PTR DS:_OSTCBur+2, AX\n\
    \       MOV PTR DS:_OSTCBur, DX                ;\n(5)    AL, BYTE PTR DS:_OSPrioHighRdy\
    \      ; OSPrioCur = OSPrioHighRdy\n       MOV BYTE PTR DS:_OSPrioCur, AL    \
    \     ;\n(6)    LES, BX, WORD PTR DS:_OSTCBurHighRdy  ; SS:SP = OSTCBurHighRdy->OSTCBstkptr\n\
    \       MOV, SS, ES:[BX]                      ;\n(7)    POP   DS             \
    \                 ; Load new task's context\n(8)    POP   ES                 \
    \             ;\n(9)    POP   EAX                             ;\n(10)   IRET \
    \                            ; Return to new task\n_OSIntCxSw ENDP\n```\n\n# Listing\
    \ 9.5, OSIntCxSw()\n\nAssuming that the processor recognizes an interrupt, it\
    \ completes the current instruction and initiates an interrupt handler procedure.\
    \ This pushing the processor status register by the return address of the interrupted\
    \ task onto the stack."
