    OSIntCtxSw() is a function that is called by OSIntExit() to perform a context
    switch from an ISR. Because OSIntCtxSw() is called from an ISR, it is assumed
    that all the processor registers are properly saved onto the interrupted task''s
    stack. In fact, there are more on the stack frame than we need. OSIntCtxSw() will
    thus have to clean up the stack so the interrupted task is left with the proper
    frame content.


    To understand what needs to be done in OSIntCtxSw(), lets look at the sequence
    of events that μC/OS-II call OSIntCtxSw(). You may want to refer to figure 8-2
    to help understand the following description. We assume that interrupts are not
    nested (i.e. an ISR will not be interrupted), interrupts are enabled, and the
    processor is executing task level code. When an interrupt arrives, the processor
    completes the current instruction, recognizes the interrupt and initiates an interrupt
    handling procedure. This generally consist of pushing the processor status and
    the return address of the interrupted task onto the stack F8-2(1). The order and
    which registers are pushed onto the stack is irrelevant.


