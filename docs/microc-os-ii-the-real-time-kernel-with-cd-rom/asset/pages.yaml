  md: '# Chapter 7


    # Memory Management


    Your application can allocate and free dynamic memory using ANSI C compiler''s
    malloc() and free() functions, respectively. However, using malloc() and free()
    in an embedded real-time system is dangerous because eventually, you may not be
    able to obtain a contiguous memory area because of fragmentation. Fragmentation
    is the development of a large number of separate free areas (i.e. the total free
    memory is fragmented into small pieces). I discussed the problem of fragmentation
    in section 4.02 when I indicated that task stacks could be allocated using malloc().
    Execution time of malloc() and free() are generally non-deterministic because
    of the algorithms used to locate a contiguous block of memory.


    μC/OS-II provides an alternative to malloc() and free() by allowing your application
    to obtain fixed-sized memory blocks from a partition made of a contiguous memory
    area as illustrated in Figure 7-1. All memory blocks are the same size and the
    partition contains an integral number of blocks. Allocation and de-allocation
    of these memory blocks is done in constant time and deterministic.


    As shown in Figure 7-2, more than one memory partition can exist and thus, your
    application can obtain memory blocks of different sizes. A specific memory block
    must, however, always be returned to the partition from which it came from. This
    type of memory management is not subject to fragmentation.


    ![](img/114817931de46def85b7b339e903e24f_167_0.png)


    Figure 7-1, Memory partition'
