  md: '# 8.04 OS_CPU_A.ASM


    A µC/OS-II port requires that you write four fairly simple assembly language functions:


    ```

    OSStartHighRdy ()

    OSCtxSw ()

    OSIntCtxSw ()

    OSTickISR ()

    ```


    If you compile your in-line assembly code, you could actually place all the processor
    specific code in OS_CPU_C.C instead of having a separate assembly language file.


    # 8.04.01 OS_CPU_A.ASM, OSStartHighRdy()


    This function is called by OSStart() to start the highest priority task ready-to-run.
    Before you call OSStart(), you MUST HAVE created at least one of your tasks (OSTCreate()
    and OSTaskCreateExt()). OSStartHighRdy() assumes that OSTCBHighR points to the
    control block of the task. As mentioned, in µC/OS-II, the stack frame for a ready
    task always looks as an interrupt has just occurred and all processor registers
    were saved onto it. To run the highest priority task all need to restore all registers
    from the task''s stack in the proper order, and execute a return from interrupt.
    To simplify things, the stack pointer is always at the beginning of the task control
    block (it its OS_TCB). In other words, the stack pointer to task resume is always
    at offset 0 in the OS_TCB.


    Note that OSStartSwHook() MUST call OSTaskSwHook() because we are doing a ''half
    context switch - we are restoring the registers of the highest priority task.
    OSTaskSwHook() can examine OSRunning to tell it whether OSTaskSwHook() was called
    from OSStartHighRdy() (i.e. if OSRunning is FALSE) or for a regular context switch
    (i.e. OSRunning is TRUE).


    OSStartHighRdy() MUST also set OSRunning to TRUE before the high priority task
    is restored (but after calling OSTaskSwHook()).


    # 8.04.02 OS_CPU_A.ASM, OSCtxSw()


    As previously mentioned, a task level switch is achieved by issuing a software
    interrupt instruction, depending on the processor, executing a TRAP instruction.
    The interrupt service routine, trap or exception handler MUST vector to OSCtxSw().


    The sequence of events that µC/OS-II to OSCtxSw() is as follows. The current task
    calls a service provided by µC/OS-II which has a higher priority to be ready-to-run.
    At the end of the service, µC/OS-II calls the function OS() which concludes that
    the current task is no longer the most important task to run. OS() loads the address
    of the highest priority task to OSTCBHighRdy and executes the software interrupt
    by invoking the macro OS_TASK_SW(). Note that the variable OSTCBur contains a
    pointer to the task''s Task_Control Block, OS_TCB. The software interrupt (or
    trap) forces some of the processor registers (most likely the return address and
    the processor''s status) onto the task''s stack and the processor then vectors
    to OSCtxSw().


    The pseudo code of what needs to be done by OSCtxSw() is shown in listing 8.2.
    This code must be written in assembly language because you cannot access CPU registers
    directly from C.


    ```

    void OSCtxSw(void) {

    ```'
