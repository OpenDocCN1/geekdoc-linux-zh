    **6.07.02 Waiting for a message at a Queue, OSQPend()**

    The code to wait for a message to arrive at a queue is shown in listing 6.22.
    **OSQPend()** verifies the ECB being pointed to by *pevent* has been created by
    **OSQCreate()** L.22(1). A message is available when **OSQEntries** is greater
    than 0 L.22(2). In this case, **OSQPend()** stores the pointer to the message
    *msg* moves the **OSOut** pointer so that it points to the next entry in the queue
    L.22(3), and **OSQPend()** decrements the number of entries in the last entry
    of the array L.22(4). When we are implementing a circular buffer, we need to check
    that **OSOut** has not moved past the last entry in L.22(5). adjusted to point
    back at the beginning of the array L.22(6). This is the path you are looking for
    when calling **OSQPend()** and it also happens to be the fastest.


    If a message is not available, **OSEventEntries** is 0 then check to see if the
    function was called by an ISR L.22(7). With **OSESemPend()** and **OSMutexPend()**,
    you should not call **OSQPend()** from an ISR it cannot be made to. However, if
    a message is available, the call to **OSQPend()** would be successful even if
    called from an ISR!


    If a message is not available the calling task must be suspended until a message
    is posted or the timeout period expires L.22(8). When a message is posted to the
    queue (the timeout period expired) and the task called **OSQPend()** is the highest
    priority task then **OSSched()** returns L.22(9). **OSQPend()** checks to see
    if a message was placed in the task''s TCB by **OSQPost()** L.22(10). If this
    is the case, the call is successful, some work is done to unlock the message queue
    from the TCB L.22(11) and the message is returned to the caller L.22(17).'
