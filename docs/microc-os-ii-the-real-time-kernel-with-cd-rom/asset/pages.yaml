  md: '# # OSsemPend()


    ```

    void OSsemPend(OS_EVENT *pevent, INT16U timeout, INTSU *err);

    ```


    | File | Called from | Code enabled by |

    | --- | --- | --- |

    | OS_SEM.C | Task only | OS_SEM_EN |


    **OSsemPend()** is used when a task desires to get exclusive access to a resource,
    synchronize its activities with an ISR, or a task until an event occurs. If a
    task calls **OSsemPend()** and the value of the semaphore is greater than 0, then
    **OSsemPend()** will decrement the semaphore and return to its caller. However,
    if the value of the semaphore is equal to zero, **OSsemPend(** places the task
    in the waiting list for the semaphore. The task will wait until a task or ISR
    signals the semaphore, or the specified timeout expires. If the semaphore is signaled
    before the timeout, μC/OS-II will resume the highest priority task that is waiting
    for the semaphore. A pending task that has been suspended with **OSTaskSuspend()**
    can obtain the semaphore. The task will, remain suspended until the task is resumed
    by calling **OSTaskResume ().**


    # ## Arguments


    **pevent** is a pointer to the semaphore. This pointer is returned to your application
    when the semaphore is created (see **OSsemCreate()).**


    **timeout** is used to allow the task to resume execution if a message is not
    received from the mailbox within the specified number of clock ticks. A **timeout**
    value of 0 indicates that the task desires to wait for the message. The maximum
    **timeout** is 65535 clock ticks. The timeout value is not synchronized with the
    clock tick. The timeout starts being generated on the next clock tick which could
    potentially occur immediately.


    **err** is a pointer to a variable which will be used to hold an error code. **OSsemPend()**
    sets **err** to either:


    +   1) **OS_NO_ERR**, the semaphore is available

    2) **OS_TIMEOUT**, the semaphore was not signaled within the specified timeout

    3) **OS_ERR_PEND_ISR**, you called this from an ISR and μC/OS-II will have to
    suspend the ISR. In general, you should not call **OSboxPend().** μC/OS-II checks
    for this situation in case you do anything.


    # ## Return Value


    # ## Notes/Warnings


    Semaphores must be created before they are used.


    # ## Example


    ```

    OS_EVENT *DispSem;

    void DispTask(void *pdata)

    ```'
