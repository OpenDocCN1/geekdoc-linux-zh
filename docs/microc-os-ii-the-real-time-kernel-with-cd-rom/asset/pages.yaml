  md: "# Chapter 4\n\n# # Task Management\n\nWe saw in the previous chapter that a\
    \ task is either an infinite loop function or a function that deletes itself when\
    \ it is done executing. Note that the task is not actually deleted, µOS-II simply\
    \ doesn't know about the task anymore and thus code will not run. A task just\
    \ like any other C function containing a return type and an argument but, it must\
    \ never return. The return type of a task must always be declared to be void.\
    \ The functions described in this chapter are found in the file OS_TASK.C. To\
    \ review, a task must look as shown below.\n\n```\nvoid YourTask (void *pdata)\n\
    {\n    for (;;) {\n        /* USER CODE */\n        Call one of uC/OS-II's services:\n\
    \        OSMexPend();\n        OSPend();\n        OSSemPend();\n        OSTTaskDel(OS_PRIO_SELF);\n\
    \        OSTTaskSuspend(OS_PRIO_SELF);\n        OSTimely();\n        OSTimeDlyHSM();\n\
    \        /* USER CODE */\n    }\n}\n```\n\nor."
