  md: "# 7.00 Memory Control Blocks\n\nμC/OS-II keeps track of memory partitions through\
    \ the use of a data structure called a memory control block as shown in 7.1. Each\
    \ memory partition requires its own memory control block.\n\n```\ntypedef struct\
    \ {\n    void *OSMemAddr;\n    void *OSMemFreeList;\n    INT32 OSMemBlkSize;\n\
    \    INT32 OSMemNBlks;\n    INT32 OSMemFree;\n} OS_MEM;\n```\n\n# Listing 7.1,\
    \ Memory control data structure.\n\nOSMemAddr is a pointer to the beginning (i.\
    \ base) of the memory partition from which memory blocks will be allocated. This\
    \ field is initialized when you create a partition (see 7.01, Creating a partition)\
    \ and is not used thereafter.\n\nOSMemFreeList is a pointer used by μC/OS-II to\
    \ point to either the free memory control block or to the next free memory block.\
    \ The use depends on whether the memory partition has been created or not (see\
    \ section 7.01).\n\nOSMemBlkSize determines the size of each memory block in the\
    \ partition and is a parameter you specify when the memory partition is created\
    \ (see section 7.01).\n\nOSMemNBlks establishes the total number of memory blocks\
    \ available from the partition. This parameter is specified when the partition\
    \ is created (see section 7.01).\n\nOSMemNFree is used to determine how many memory\
    \ blocks are available from the partition.\n\nμC/OS-II initializes the memory\
    \ manager if you configure OS_MEM_EN to 1 in OS_CFG.H. Initialization is done\
    \ by OSInit (which is automatically called by OSInit()) and consist of creating\
    \ a linked list of memory control blocks as shown in figure 7-3. You specify the\
    \ maximum number of memory partitions with the configuration constant OS_MAX_MEM_PART\
    \ (see OS_CFG.H) which MUST be at least 2.\n\nAs can be seen, the OSMemFreeList\
    \ field of the control block is used to chain the free blocks."
