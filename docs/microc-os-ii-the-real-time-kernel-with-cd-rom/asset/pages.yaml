- img_proc: true
  md: 'ISRs have a tendency to take longer than they should. Also, information for
    a background module made available by an ISR is not processed until the background
    routine gets its turn to execute. This is called the task level response. The
    worst case level response time depends on how long the background loop takes to
    execute. Because the execution time of typical code is not constant, the time
    for successive passes through a portion of the loop is nondeterministic. Furthermore,
    if a code change is made, or a variable, the timing of the loop is affected.


    Most high volume microcontroller-based applications (e.g., microwave ovens, phones,
    toys, and so on) are designed for foreground/background systems. Also, in microcontroller-based
    applications, it may be better (from a power consumption point of view) to halt
    the processor and perform all of the processing in ISRs.


    ![](img/114817931de46def85b7b339e903e24f_46_0.png)


    Figure 2-1, Foreground/background systems


    # 2.01 Critical Section of Code


    A critical section of code, also called a critical region, is code that needs
    to be treated indivisible. Once the section of code starts, it must not be interrupted.
    Instead, interrupts are typically disabled before the critical code is executed
    and enabled when the critical code is finished (see also Shared Resource).


    # 2.02 Resource


    A resource is any entity used by a task. A resource thus be an I/O device such
    as a printer, a keyboard, a display, etc. or a variable, a structure, an array,
    etc.


    # 2.03 Shared Resource


    A shared resource is a resource that can be used by more than one task. Each task
    should gain exclusive access to the shared resource to prevent data corruption.
    This is called Mutual Exclusion and techniques to ensure mutual exclusion are
    discussed in section 2.19, Mutual Exclusion.


    # 2.04 Multitasking'
  merge: -1
  pgno: 46
- img_proc: true
  md: 'Multitasking is the process of scheduling and switching the CPU (Central Processing
    Unit) between several tasks; a single CPU switches its attention between several
    sequential tasks. Multitasking is like foreground/background with multiple backgrounds.
    Multitasking maximizes the utilization of the CPU and also provides for modular
    construction of applications. One of the most important aspects of multitasking
    is that it allows the application programmer to manage complexity inherent in
    real-time applications. Application programs are typically easier to design and
    maintain if multitasking is used.


    # 2.05 Task


    A task, also called a thread, is a simple program that thinks it has the CPU all
    to itself. The design process for a realtime application involves splitting the
    work to be done into tasks which are responsible for a portion of the problem.
    Each task is assigned a priority, its own set of CPU registers, and its own stack
    area (as shown in Figure 2-2).


    ![](img/114817931de46def85b7b339e903e24f_47_0.png)


    Figure 2-2, Multiple tasks.'
  merge: -1
  pgno: 47
- img_proc: true
  md: 'Each task typically is an infinite loop that can be in any of five states:
    DORMANT, READY, RUNNING, WAITING AN EVENT, or INTERRUPTED (see Figure 2-3). The
    DORMANT state corresponds to a task that resides in memory but has not been made
    available to the multitasking kernel. A task is READY when it can execute the
    currently running task. A task is RUNNING when it has control of the CPU. A task
    is WAITING AN EVENT when it requires the occurrence of an event for an I/O operation
    to complete, a shared resource to be available, a timing pulse to occur, time
    etc.). Finally, a task is INTERRUPTED when an interrupt has occurred and the CPU
    is in the process of servicing the interrupt. Figure 2-3 also shows the functions
    provided by µRTOS to manage a task from one state to another.


    ![](img/114817931de46def85b7b339e903e24f_48_0.png)


    Figure 2-3, Task states


    # ## 2.06 Context Switch (or Task Switch)


    When a multitasking kernel decides to run a different task, it simply saves the
    current task''s *context* (CPU registers) in the current task''s context storage
    area – it''s stack (see Figure 2-2). Once this operation is performed, the new
    task''s context is restored from its storage and resumes execution of the new
    task''s code. This process is called a *context switch* or *task switch*. Context
    switching adds overhead to the application. The more registers there have to be
    saved and restored by the CPU. Performance of a real-time kernel should not be
    judged on how many context switches the kernel is capable of doing per second.


    # ## 2.07 Kernel


    The kernel is part of a multitasking system responsible for the management of
    tasks (that is, managing the CPU''s time) and communication between tasks. The
    fundamental service provided by the kernel is switching. The use of a real-time
    kernel will generally simplify the design of systems by allowing the application
    to be divided into multiple tasks by the kernel. A kernel will add overhead to
    your system because it requires extra ROM (code space), additional RAM for the
    kernel data structures, each task requires most importantly, each task requires
    its own stack space which has a tendency to eat up RAM quickly. A kernel will
    consume CPU time (typically between 2 and 5%).'
  merge: -1
  pgno: 48
- img_proc: true
  md: 'Single chip microcontrollers are generally not able to run a real-time kernel
    because they have very little RAM.


    A kernel can allow you to make better use of your CPU by providing you with indispensable
    services such as semaphore management, mailboxes, queues, time delays. Once you
    design a system using a real-time kernel, you will not want to go back to a foreground/background
    system.


    # 2.08 Scheduler


    The scheduler, also called the dispatcher, is part of the kernel responsible for
    determining which task will run next. Most real-time kernels are priority based.
    Each task is assigned a priority based on importance. The priority for each application
    is specific. In a priority-based kernel, the control of the CPU will always be
    given to the highest priority ready-to-run. When the highest-priority task gets
    the CPU, however, is determined by the type of kernel used. There are two types
    of priority-based kernels: non-preemptive and preemptive.


    # 2.09 Non-Preemptive Kernel


    Non-preemptive kernels require that each task does something to explicitly give
    up control of the CPU. To maintain the illusion of concurrency, this process must
    be done frequently. Non-preemptive scheduling is also cooperative multitasking;
    tasks cooperate with each other to share the CPU. Asynchronous events are still
    handled by ISRs. An ISR can make a higher priority task ready to run, but the
    ISR always returns to the interrupted task. The new priority task will gain control
    of the CPU when the current task gives up the CPU.


    One of the advantages of a non-preemptive kernel is that interrupt latency is
    typically low (see the later discussion on interrupts). At the task level, non-preemptive
    kernels can also use non-reentrant functions (discussed later). Non-reentrant
    functions can be used by each task without fear of corruption by another task.
    This is because each task can run to completion before it relinquishes the CPU.
    Non-reentrant functions, however, should not be allowed to give task control of
    the CPU.


    Task-level response using a non-preemptive kernel can be much lower than with
    foreground/background systems because task-level response is now given by the
    time of the longest task.


    Another advantage of non-preemptive kernels is the lesser need to guard shared
    data through the use of semaphores. Each task owns the CPU and you don''t have
    to fear that a task will be preempted. This is not an absolute rule, and in some
    instances, semaphores should still be used. Shared I/O devices may still require
    the use of mutual exclusion semaphores; for example, a task might still need exclusive
    access to a printer.'
