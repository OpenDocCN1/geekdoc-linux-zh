    \n**AsyncTaskDel()** allows your application to delete a task by specifying the\
    \ priority number of the task to delete. The calling task can be deleted by specifying\
    \ its priority number or OS_PRIO_SELF if the task doesn't know its own priority\
    \ number. The deleted task is returned to the dormant state. The deleted task\
    \ may be created by calling either **AsyncTaskCreate()** or **AsyncTaskCreateExt()**\
    \ to make the task active again.\n\n# ### Arguments\n\n**prio** you can delete\
    \ the task by passing OS_PRIO_SELF in in case, the next highest priority task\
    \ will be executed.\n\n# ### Returned Value\n\n**AsyncTaskDel()** returns one\
    \ of the following error codes:\n\n+   1) OS_NO_ERR, if the task didn't delete\
    \ itself\n2) OS_TASK_DEL_IDLE, you tried to delete the idle task\n3) OS_TASK_DEL_ERR,\
    \ the task to delete does not exist\n4) OS_PRIO_INVALID, if you specified a priority\
    \ higher than OS_LOWEST_PRIO\n5) OS_TASK_DEL_ISR, you tried to delete a task from\
    \ ISR\n\n# ### Notes/Warnings\n\n**AsyncTaskDel()** will verify that you are not\
    \ attempting to delete the µC/OS-II's idle task.\n\nYou must be careful when you\
    \ delete a task that owns resources. Instead, you should consider **AsyncTaskDelReq()**\
    \ which would be a safer approach.\n\n# ### Example\n\n```\nvoid TaskX(void *pdata)\n\
    {\n    INTU err;\n\n    for (;;)\n    {\n        .\n        err = AsyncTaskDel(10);\
    \      /* Delete task with priority 10 */\n        if (err == OS_NO_ERR) {   \
    \ /* Task was deleted */\n        }\n    }\n}\n```"
