  md: '# Equation 2.13, Data space needed when a kernel is used.


    Unless you have large amounts of RAM to work with, you will need to be careful
    about how you use the stack space. To reduce the amount of RAM needed in an application,
    you will need to be careful about how each task''s stack for:


    +   - large arrays and structures declared locally to functions and ISRs

    - function (i.e., subroutine)

    - interrupt nesting

    - library functions stack usage

    - function calls with many arguments


    To summarize, a multitasking system will require more code space (ROM) and data
    space (RAM) than a foreground/background system. The extra of ROM depends only
    on the size of the kernel, and the amount of RAM depends on the number of tasks
    in your system.


    # 2.35 Advantages and Disadvantages of Real-Time Kernels


    A real-time kernel, also called a Real-Time Operating System, or RTOS, allows
    real-time applications to be easily designed and enhanced; functions can be added
    without requiring major changes to the software. The use of RTOS simplifies the
    design process by splitting the application into separate tasks. With a preemptive
    RTOS, all unexpected events are handled as quickly and as efficiently as possible.
    An RTOS allows you to make better use of your resources by providing you with
    previous services such as semaphores, mailboxes, queues, time delays, timeouts.


    You should consider using a real-time kernel if your application can afford the
    extra requirements: extra cost of the kernel, more ROM/RAM, and 2 to 4 percent
    additional CPU overhead.


    The one factor I haven''t mentioned so far is the cost associated with the use
    of a real-time kernel. In some applications, this cost would and prevent you from
    even considering an RTOS.


    There are currently around 80+ RTOS. Products are available for 8-, 16-, and 32-bit
    microprocessors. Some of these packages include operating systems and only the
    real-time kernel but also an input/output manager, windows systems (display),
    a file system, networking, language interfaces, debuggers, and cross-platform
    compilers. The cost of an RTOS varies from $50 to $5000. The RTOS vendor requires
    priorities on a per-target basis. This is like buying a chip from the RTOS vendor
    that include with each unit. Any other software package these days, you also need
    to consider the maintenance cost, which could cost you back $100 to $5,000 per
    year!


    # 2.36 Real-Time Systems Summary


    Table 2.2 summarizes the three types of real-time systems: foreground/background,
    non-preemptive, and preemptive kernel.


    | Foreground/Background | Non-Preemptive Kernel | Preemptive Kernel |

    | Interrupt latency (Time) | MAX (longest interrupt, User disable) + Vector to
    ISR | MAX (longest interrupt, User disable, Kernel disable) + Vector to ISR |
    MAX (longest interrupt, User disable, Kernel disable-disable) + Vector to ISR
    |

    | Interrupt response (Time) | Int. latency + Save CPU''s context | Int. latency
    + Save CPU''s context | Int. latency + Save CPU''s context + Find highest priority
    function |

    | Interrupt recovery (Time) | Restore background''s context + Return from int.
    | Restore task''s context + Return from int. | Find highest priority task + Restore
    priority task + task''s context |

    | Task response (Time) | Background | Longest task + Find highest priority task
    + Context switch | Find highest priority task + Context switch |'
