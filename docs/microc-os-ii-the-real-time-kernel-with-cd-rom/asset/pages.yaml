- img_proc: true
  md: '# 10.03.01 OS_CPU_A.ASM, OSStartHighRdy()


    In μC/OS-II, OSStartHighRdy() MUST call OSTaskSwHook(). OSTaskSwHook() did not
    exist. OSStartHighRdy() need to call OSTaskSwHook() before you load the stack
    pointer of the highest priority task. Also, OSStartHighRdy() needs to set OSRunning
    to 1 immediately after calling OSTaskSwHook(). Listing 1.6 shows the pseudo-code
    of OSStartHighRdy(). μC/OS only the last three threads.


    ```

    OSStartHighRdy;

    Call OSTaskSwHook();

    Set OSRunning to 1;

    Load the processor stack pointer with OSTCBHighRdy->OSTCBStkPtr;

    POP all the processor registers from the stack;

    Execute a Return from Interrupt;

    ```


    > Listing 1.6. Pseudo-code for OSStartHighRdy()


    # 10.03.02 OS_CPU_A.ASM, OSCtxxSw()


    Two things have been added in μC/OS-II during a context switch. First, you MUST
    call OSTaskSwHook() immediately after saving the current task''s stack pointer
    into the current task''s TCB. Second, you MUST set OsprioCur to OSrioHighRdy BEFORE
    you load the new task''s pointer.


    Listing 1.7 shows the pseudo-code of OSCtxxSw() . μC/OS-II adds L10.7(1) and L10.7(2).


    ```

    OSCtxxSw;

    PUSH processor registers onto the current task''s stack;

    Save the stack pointer at OSTCBCur->OSTCBStkPtr;

    Call OSTaskSwHook(); (1)

    OSTCBCur = OSTCBHighRdy;

    OSprioCur = OsprioHighRdy; (2)

    Load the processor stack pointer with OSTCBHighRdy->OSTCBStkPtr;

    POP all the processor registers from the stack;

    Execute a Return from Interrupt instruction;

    ```


    > Listing 1.7. Pseudo-code for OSCtxxSw()


    # 10.03.03 OS_CPU_A.ASM, OSIntCtxSw()


    Like OSCtxxSw(), two things have been added in OSIntCtxSw() for μC/OS-II. First,
    MUST call OSTaskSwHook() immediately after saving the current task''s stack pointer
    into the current task''s TCB. Second, you MUST set OsprioCur to OsprioHighRdy
    BEFORE you load the new task''s stack pointer.


    Listing 1.8 shows the pseudo-code of OSIntCtxSw() . μC/OS-II adds L10.8(1) and
    L10.8(2).'
