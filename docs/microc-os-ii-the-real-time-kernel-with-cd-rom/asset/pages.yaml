    ```


    # 4.8, Stack grows from HIGH memory to LOW memory


    This requirement affects code portability. If you need to port your code from
    a processor architecture that supports a downward growing to an upward stack then
    you need to do like I did in OS_CORE.c for OSTaskidle() and OSTaskStat(). Specifically,
    with the example, your code would look as shown in listing 4.9.


    ```

    OS_STK TaskStack[TASK_STACK_SIZE];


    #if OS_STK_GROWTH == 0

    OSTaskCreate(task, pdata, &TaskStack[0], prio);

    #else

    OSTaskCreate(task, pdata, &TaskStack[TASK_STACK_SIZE-1], prio);

    #endif

    ```


    # 4.9, Supporting stacks which grows in each direction.


    The size of the stack needed by your task is application specific. When sizing
    the stack, you must account for nesting of all the functions called by your task,
    the number of local variables that will be allocated by all functions called by
    your task, and the stack requirements for all nested interrupt service routines.
    In addition, your stack must be large to store all CPU registers.


    # 4.03 Stack Checking, OSTaskStackChk


    It is necessary to determine how much stack space a task actually uses. This allows
    you to reduce the amount of RAM needed by your application code by not allocating
    stack space. µ/OS-II provides a function called OSTaskStackChk() that provides
    you with this valuable information.


    Refer to figure 4-2 for the following discussion. Stack checking is performed
    on demand as to operate continuously. Note that figure 4-2 assumes that stack
    grows from high memory to low memory (i.e. OS_GROWTH is set to 1), but the discussion
    applies equally to a stack growing in the opposite direction F4-2(1). µ/OS determines
    stack checking by looking at the contents of the stack itself. To perform stack
    checking, µ/OS-II requires that the stack be filled with zeros when the task is
    created F4-2(2). Also, µ/OS-II needs to know the location of the bottom-of-stack
    (BOS) F4-2(3) and the size of the stack assigned to the task F4-2(4). These two
    values are stored in the task''s OS_TCB when the task is created.'
