  md: '# Chapter 9


    # 80x86, Large Model Port


    This chapter describes how uC/OS-II has been ported to the Intel 80x86 series
    of processors running in Real Mode and for the Large Model. This port applies
    to the following CPUs:


    +   - 80186

    - 80286

    - 80386

    - 80486

    - Pentium

    - Pentium-II


    It turns out that the port can run on most 80x86 compatible CPU manufactured by
    AMD, Cyrix, NEC (V-series) and others. I used Intel here in a generic fashion.
    There are literally millions of 80x86 CPU being sold each year. Most of these
    end up in desktop type computers but, a growing number of processors are making
    their way in embedded systems. The fastest processors (i.e. the Pentium-II) should
    reach 1000 MHz by 2000.


    Most C compiler that support 80x86 processors running in real mode offer different
    memory models, each suited for a different program and data size. Each model uses
    memory differently. The Large Model allows your application (code and data) to
    reside in a 1 MegaBytes memory space. Pointers in this model require 32-bits although
    they can only address up to 1 MegaBytes! The next section will show why a 32-bit
    pointer in this model can only address 20-bits worth of memory.


    This port can also be adapted to run on the 8086 processor but requires that you
    replace the use of the PUS instruction with the proper number of PUSH instructions.


    Figure 9-1 shows the programming model of an 80x86 processor running in real mode.
    All registers are 16-bit wide they all need to be saved during a context switch.'
  merge: -1
  pgno: 198
