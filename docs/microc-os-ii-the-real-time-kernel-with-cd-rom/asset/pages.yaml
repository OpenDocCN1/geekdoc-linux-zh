    \   OSCtxSwCtr++;\n            OSCtxSw();\n        }\n    }\n    OS_EXIT_CRITICAL();\n\
    }\n```\n\n# List 3.16, Nested µ/OS-II about leaving an ISR.\n\nOSIntExit() looks\
    \ strangely OSSched() except for three differences. First the interrupt nesting\
    \ counter is decremented in OSIntExit() L3.16(2) and rescheduling occurs when\
    \ the interrupt nesting counter and the incremented OS nesting counter (OSLockNesting)\
    \ are both 0. The second difference is that the Y index needed for OSDRybl[] is\
    \ stored in the global variable OSIntExY L3.16(3). This is done to avoid allocating\
    \ a local variable on the stack, which would need to be accounted for in OSCtxSw()\
    \ (see Section 9.04.03, OS_CPU_ASM_CtxSw()). Finally, if a context switch is needed,\
    \ OSIntExit() calls OSCtxSw() L3.16(4) instead of OS_TASK_SW(), which is done\
    \ by OSSched().\n\nThere are two reasons for calling OSCtxSw() instead of OS_TASK_SW().\
    \ First, half the work is done because the OS has already saved the CPU registers\
    \ onto the task stack as shown in L3.14(1) and F3-6(1). Second, OSIntExit() instead\
    \ pushes the return address from the ISR onto the task stack L3.16(1) and F3-6(2).\
    \ Depending on whether interrupts are disabled (see Chapter 6, Porting µ/OS-II),\
    \ the processor's status word may be pushed onto stack. In OS_ENTER_CRITICAL(),\
    \ the return address of the call is also pushed onto the stack L3.16(4) and F3-6(4).\
    \ The stack frame looks like µ/OS-II when a task is suspended except for the extra\
    \ elements on the stack F3-6(2), F3-6(3) and F3-6(4). OSCtxSw() simply needs to\
    \ adjust the processor's stack pointer as shown in F3-6(5). In other words, adjusting\
    \ the stack frame ensures that all the stack frames of the suspended tasks look\
    \ the same.\n\nImplementation details for OSCtxSw() are provided in chapter 9,\
    \ Porting µ/OS-II."
