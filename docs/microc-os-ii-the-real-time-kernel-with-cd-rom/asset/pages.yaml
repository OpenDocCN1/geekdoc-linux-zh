    \ Hz version of OSTickISR()\n\n# ## 9.05 OS_CPU_C.C\n\nA µC/OS-II port requires\
    \ you to write six functions C:\n\n```\nOSTaskStkInit ()\nOSTaskCreateHook ()\n\
