    # Figure 8-1, μC/OS-II Hardware/Software Architecture


    Figure 8-1 shows μC/OS-II''s architecture and its relationship with the hardware.
    When you use μC/OS-II in an application, you are responsible for providing the
    Application Software and the μC/OS-II Configuration sections. This books (and)
    contains all the source code for the Processor Independent Code as well as the
    Processor Specific Code for the Intel 8086, Real Large Mode. If you intend to
    use μC/OS-II on a different processor, you will need to either obtain a copy of
    a port for the processor you intend to use, or write one if the desired processor
    port is not available. Check the official μC/OS-II WEB site at http://www.ucos-ii.com
    for a list of available ports.


    Porting μC/OS-II is actually straightforward once you understand the subtleties
    of the target processor and the C compiler you will be using. If your processor
    can satisfy μC/OS-II''s requirements, and you have all the necessary tools at
    your disposal, porting μC/OS-II consists of:


    +   1. Setting the value of 1 #define constants (OS_CPU.H)

    2. Declaring 10 data types (OS_CPU.H)

    3. Declaring 3 #define macros (OS_CPU.H)'
