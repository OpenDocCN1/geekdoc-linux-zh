    OSTTaskCreateHook() is called when a task is created by either OSTTaskCreate()
    or OSTTaskCreateExt(). This allows you or the user of your to extend the functionality
    of µOS/OS-II. OSTTaskCreateHook() is called when µOS/OS-II is setting up its internal
    structures before the scheduler is called. Interrupts are disabled when this function
    is called. Because of this, you should keep the code in this function to a minimum
    because it directly affects latency.


    When called, OSTTaskCreateHook() receives a pointer to the OS_TCB of the created
    and can access all of the structure elements. OSTTaskCreate() has limited capability
    when the task is created with OSTTaskCreate(). However, with OSTTaskCreateExt(),
    you get access to a TCB extension pointer (OSTCBExtPtr) in OS_TCB which can be
    used to access additional data about the task such as the contents of floating-point
