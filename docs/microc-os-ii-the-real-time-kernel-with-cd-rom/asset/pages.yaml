  md: "OSTaskCreateHook(). Because of this, you should keep the code in this minimum\
    \ because it can directly impact latency. When called, OSTaskCreateHook() receives\
    \ a pointer to the OS_TCB of the task being created. This means that the hook\
    \ function can access all members of the OS_TCB data structure.\n\nFinally, if\
    \ OSTaskCreate() was called from a task (e.g. Running is set to TRUE 1.4(10))\
    \ then the scheduler is called L4.1(11) to determine whether the created task\
    \ has a higher priority than its creator. Creating a higher priority task will\
    \ result in a context switch to the new task. If the task was created before multitasking\
    \ (i.e. you did not call OSTStart()) then the scheduler is not called.\n\n# 4.01\
    \ Creating a Task, OSTaskCreateExt()\n\nCreating a task using OSTaskCreateExt()\
    \ offers you flexibility, but at the expense of additional overhead. The code\
    \ for OSTaskCreateExt() is shown in listing 4.3.\n\nAs be seen, OSTaskCreateExt()\
    \ requires nine (9) arguments! The first four arguments (task, pdata, ptos and\
    \ priority) are exactly the same as with OSTaskCreate() and, they are located\
    \ in the same order. Id that make it easier to migrate your code to use OSTaskCreateExt().\n\
    \nThe id establishes a identifier for the task being created. This argument has\
    \ been added for future expansion and is otherwise used by u/OS-II. This identifier\
    \ will allow me to extend u/OS-II its limit of 64 tasks. For now, simply set the\
    \ task's ID to the same value as the task's priority.\n\nptos is a pointer to\
    \ the task's bottom-of-stack and is used to perform stack checking.\n\nstk_size\
    \ is the psize of the number of elements. This means that if a stack is 4 bytes\
    \ wide then, a stk_size of 1000 means the task will have 4000 bytes. Again, this\
    \ argument is used for stack checking.\n\npext is a pointer to user supplied data\
    \ area that can be used to extend the OS_TCB of the task. For example, you can\
    \ add a name to a task (see Example #3), storage for the contents of floating-point\
    \ registers in a context switch, port address to trigger an oscilloscope in a\
    \ context switch and\n\nFinally, opt specifies options to OSTaskCreateExt() to\
    \ specify whether stack checking is allowed, whether the stack is cleared, whether\
    \ floating-point operations are performed by the task, etc., uCOS_II has a list\
    \ of available options (OS_TASK_STK_CHK, OS_TASK_STK_CLR, and OS_TASK_STK_SAVE_FP).\
    \ Each option contains a bit. The option is selected when the bit is set (you\
    \ would simply OR over the above OS_TASK_OPT_??? constants).\n\n```\nINT8 OSTaskCreateExt(void\
    \ (*task)(void *prio),\n                    void *pdata,\n                   \
