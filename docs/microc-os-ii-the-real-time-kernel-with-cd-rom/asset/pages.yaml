  md: "PC_DOSSaveReturn() (see PC.C) which is called by main() needs to:\n the address\
    \ of the interrupt handler for the DOS ticker;\nLocate the DOS ticker at location\
    \ 0x81;\nmain() needs to:\nInstall the context switch vector (i.e. OSCtxSw())\
    \ at vector 0x80;\nCreate at least one application task;\nCall StartISR() when\
    \ ready to multitask;\nFirst task to execute needs to:\nInstallISR() at vector\
    \ 0x08;\nChange the tick rate from 18.2068 Hz to 200 Hz;\n\nThe tick handler on\
    \ the PC is so tricky that I decided to implement the following code shown in\
    \ l9.6. Upon entering all µ-OS-ISRs, the all need to be nested under the current\
    \ task's task L9.6(1). Upon entering an ISR, you need to call µ-OS-It (L9.2) that\
    \ you are starting an ISR by calling OSIntEntry() or increasing OSIntNesting L9.6.\
    \ You can directly increase this variable because the 8086 processor can perform\
    \ this operation invisibly. Next, the counter OSCtxSw is incremented L9.6(3) and\
    \ when it returns, the DOS ticker is called L9.4. This happens every 59.43 ms.\
    \ Ten out of eleven, however, a command is sent to the Priority Interrupt Controller\
    \ (i.e. the PIC) to clear the interrupt source. There is no need to do when the\
    \ DOS ticker is called because the DOS ticker directly clears the interrupt source.\
    \ Next, we call OSTimeTick() so that µ-OS can update all the tasks that are waiting\
    \ for time to expire or for pending some event to occur but with a timeout L9.6(6).\
    \ On completion of all ISRs, OSIntExit() is L9.6(7). If a higher priority task\
    \ has been made by this ISR (or any other nested ISRs) and, this is the last nested\
    \ then task and issuing an IRET to OSCtxSw(). If the ISR is not the last nested\
    \ OSTickISR(), the processor registers are restored L9.6(8) and the ISR to the\
    \ interrupted source by executing an IRET instruction L9.6(9). At this point,\
    \ the processor registers are restored, OSIntExit() returns to OSTickISR().\n\n\
    ```\nvoid OSTickISR(void)\n{\n    Save processor registers;\nOSIntNesting++;\n\
    OSTickDOSCTR--;\n    if (OSTickDOSCTR == 0) {\n        Chain into DOS by executing\
    \ an 'INT 81H' instruction;\n    } else {\n        Send EOI command to PIC (Priority\
    \ Interrupt Controller);\n    }\n    OSTimeTick();\nOSIntExit();\nRestore processor\
    \ registers;\n    Execute a return from interrupt instruction (IRET);\n}\n```\n\
