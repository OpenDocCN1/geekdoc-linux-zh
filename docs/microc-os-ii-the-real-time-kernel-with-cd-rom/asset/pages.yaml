  md: "```\nvoid YourTask(void *pdata)\n{\n    /* USER CODE */\n    OSTTaskDel(OS_PRIO_SELF);\n\
    }\n```\n\nThis chapter describes the services that allow your application to create\
    \ a task, delete a task, change a task’s priority, suspend and resume a task,\
    \ and allow your application to obtain information about a task.\n\nµC/OS-II can\
    \ manage 64 tasks while µC/OS reserves the four highest priority tasks and the\
    \ four lowest priority tasks for its own use. This leaves you with 56 application\
    \ tasks. The lower the value of the priority, the higher the priority of the task.\
    \ In the current version of µC/OS-II, the task number also serves as the task\
    \ identifier.\n\n# 4.00 Creating a Task, OSTCreate()\n\nIn order for µC/OS-II\
    \ to manage your tasks, you must create a ‘task’. You create a task by passing\
    \ its address with other arguments to one of two functions: OSTCreate() or OSTCreateExt().\
    \ OSTCreate() is backward compatible with OSTCreateExt() which is an ‘extended’\
    \ version of OSTCreate() and provides additional features. A task can be created\
    \ prior to the stack using either function or by another task. You MUST create\
    \ at least one task before you start multitasking (i.e. before calling Start()).\
    \ A task cannot be created by an ISR.\n\nThe code for OSTCreate is shown in listing\
    \ 4.1. As seen, OSTCreate requires four arguments: task is a pointer to the task\
    \ code, pdata is a pointer to an argument that will be passed to your task when\
    \ it starts executing, todos is the pointer to the top of the stack that will\
    \ be assigned to the task (see section 4.02, Task Tasks) and finally, prio is\
    \ the desired task priority.\n\n```\nINT8U OSTCreate(void (*task)(void *), void\
    \ *pdata, OS_STK *ptos, INT8U prio)\n{\n    void *psp;\n    INT8U  err;\n\n  \
    \  if (prio > OS_LOWEST_PRIO) {\n        return (OS_PRIO_INVALID);\n    }\n\n\
    \    OS_ENTER_CRITICAL();\n    if (OSTCBprioTab[prio] == (OS_TC * 0) {\n     \
    \   OSTCBprioTab[prio] = (OS_TC * 1);\n    }\n    OS_EXIT_CRITICAL();\n    psp\
    \ = (void *)OSTCreateExt(task, pdata, ptos, 0);\n    err = OSTCBInit(prio, psp,\
    \ (void *)0, 0, 0, (void *)0, 0);\n    if (err == OS_NO_ERR) {\n        OS_ENTER_CRITICAL();\n\
    \        OSTTaskCreateHook(OSTCBprioTab[prio]);\n        OS_EXIT_CRITICAL();\n\
    \        if (OSRunning) {\n            OSSched(0);\n        } else {\n       \
    \     OSTCBprioTab[prio] = (OS_TC * 0);\n        }\n        return (err);\n  \
    \  } else {\n        OS_EXIT_CRITICAL();\n}\n```"
