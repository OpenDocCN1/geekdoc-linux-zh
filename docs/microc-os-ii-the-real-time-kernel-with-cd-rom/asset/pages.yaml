  md: 'Both the CLI and STI instructions consume less than 2 cycles each on this processor
    (i.e. total of 4

    cycles). To preserve the interrupt status you would need to implement the macros
    as follows:


    ```

    #define OS_ENTER_CRITICAL()  asm PUSHHF CLI

    #define OS_EXIT_CRITICAL()   asm POP

    ```


    In this case, OS_ENTER_CRITICAL() would consume 12 clock cycles while

    OS_EXIT_CRITICAL() would use another 8 clock cycles (i.e. total of 20 cycles).
    Preserving the

    of interrupt disable status would take you 16 clock cycles longer than simply
    disabling/enabling interrupts

    at the (80186). Obviously, if you have a faster processor such as an Intel Pentium-II,
    then the difference would

    be minimal.


    # 08.033  OS_CPU.H, OS_STK_GROWTH


    The stack on microprocessors and microcontrollers grows from high-memory to low-memory.
    There are,

    hover, some processors that work the other around. µC/OS has been designed to
    handle either

    flavor. It is accomplished by specifying µC/OS-II which way the stack grows through
    the configuration

    constant OS_STK_GROWTH (1,4) as shown below:


    Set OS_STK_GROWTH to 0 for Low High memory stack growth.

    Set OS_STK_GROWTH to 1 for High to Low memory stack growth.


    # 08.004 OS_CPU.H, OS_TASK_SW()


    OS_TASK_SW() is a macro that is invoked when µC/OS-II switches from a low-priority
    to the

    highest-priority task. Another mechanism, OSInterrupt(), OS_TASK_SW() is always
    called to perform a switch when an ISR makes a higher priority task ready for

    execution. A simple switch consists of saving the registers on the stack of the
    task is being

    suspended, and restoring the registers of the higher-priority task from its stack.


    In µC/OS, the stack frame for a task always looks as if an interrupt has occurred
    and all processor

    registers were saved onto it. In other words, all µC/OS-II has to do a running
    task to restore all processor

    registers from the task''s stack and execute from it. To switch, you should implement

    OS_TASK_SW() so that you implement an interrupt. Processors provide either software
    or TRAP

    instructions to accomplish this. The ISR or trap handler (also called the ''exception
    handler'') MUST vector to the

    assembly language function OSCtxSW() (see section 08.04).


    For example, for an Intel and AMD 8086 processor used an INT instruction. The
    interrupt handler

    would need to OSCtxSW(). For a port for the Motorola 68HC11 processor would likely
    use the SWI

    instruction. The SWI handler would be OSCtxSW(). Finally, a port for the Motorola
    680x/CPU32

    processor would probably use one of the 16 TRAP instructions. For course, the
    selected TRAP handler would be

    none other than OSCtxSW().


    There are some processors like the Zilog Z280 do not provide a software interrupt
    mechanism. In this case,

    would need to simulate the stack frame as closely to an interrupt stack frame
    as you. In this case,

    OS_TASK_SW() would simply call OSCtxSW() instead of vert to it. The Z80 is a processor
    that has

    been ported to µC/OS and would be portable to µC/OS-II.'
