  md: 'INCLUDES .H allows every .C file in your project to be written without concern
    about which header file will actually be included. In other words, INCLUDES .H
    is a Master include file. The only drawback is that INCLUDES .H includes header
    files that are not pertinent to some of the .C file being compiled. This means
    that each file will require extra time to compile. This inconvenience is offset
    by portability. There is an INCLUDES .H for every example provided in this book.
    In other words, you will find a different copy of INCLUDES .H in \SOFTWARE\uCOS-II\x86L.
    \SOFTWARE\uCOS-II\EX2_x86L and \SOFTWARE\uCOS-II\EX3_x86L. You can certainly edit
    INCLUDES .H to add your own header files.


    # 1.02 Compiler Independent Data Types


    Because different microprocessors have different word length, the port of μC/OS-II
    includes a series of type definitions that ensures portability (\SOFTWARE\uCOS-II\Ix86L\OS_CPU.H
    for the 8086 real-mode, large model). Specifically, μC/OS-II''s code never makes
    use of C''s short, int and long data types they are inherently non-portable. Instead,
    I defined data types that are both portable and intuitive as shown in listing
    1.1. Also, for convenience, I have included floating-point data types even though
    μC/OS-II doesn''t make use of floating-point.'
