  md: '# Chapter 8


    # Porting µC/OS-II


    This chapter describes in general terms what needs to be done in order to adapt
    µC/OS-II to different processors. Adapting a real-time kernel to a microprocessor
    or a microcontroller is called a port. Most of µC/OS-II is written in C for portability,
    however, it is still necessary to write some processor specific code in C and
    assembly language. Specifically, µC/OS-II manipulates processor registers which
    can only be done through assembly language. Porting µC/OS-II to different processors
    is relatively easy because µC/OS-II was designed to be portable. If you already
    have a port for the processor you are intending to use then you don''t need to
    read this chapter, unless of course you want to know how µC/OS-II''s processor
    code works.


    A processor can run µC/OS-II if it satisfies the following general requirements:


    +   1. You must have a C compiler for the processor and the C compiler must be
    able to produce reentrant code.

    2. You must be able to disable and enable interrupts from C.

    3. The processor must support interrupts and you need to provide an interrupt
    that occurs at regular intervals (typically 10 to 100 Hz).

    4. The processor must support a hardware stack, and the processor must be able
    to store a fair amount of data on the stack (possibly many Kbytes).

    5. The processor must have instructions to load and store the stack pointer and
    other CPU registers either on the stack or in memory.


    Processors like the Motorola 6805 series do not satisfy requirements #4 and #5
    so µC/OS-II cannot run on such processors.'
