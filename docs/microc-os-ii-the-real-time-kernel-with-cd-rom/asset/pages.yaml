    Depending on the processor, a port can consist of writing or changing between
    50 and 300 lines of code! Porting

    µC/OS could take you anywhere between a few hours to a week.


    Once you have a port of µC/OS-II for your processor, you will need to verify its
    operation. Testing a multitasking

    real-time kernel as µC/OS-II is not as complicated as you might think. You should
    test your port without

    application code. In other words, test the operations of the kernel itself. There
    are two reasons to do this. First,

    you don''t complicate anything more than they need to be. Second, if something
    doesn''t work, you know

    the problem lies in the port as opposed to your work. Start with a couple of simple
    tasks and only the

    ticker service routine. Once you get multitasking, it''s quite simple to add your
    functions.


    # 8.00 Development Tools


    As previously stated, you need a Compiler for the processor you intend to use
    in order to port µC/OS-II. Because

    µC/OS-II is a preemptive kernel, you should use a compiler that generates reentrant
    code. Your compiler

    must also be able to support assembly language programming. Most C compilers designed
    for embedded systems

    will, in fact, include an assembler, a linker, and a loader. The linker is to
    combine object files (compiled

    as assembled files) from different modules where the loader will allow you to
    place the code and data anywhere

    the memory map of the target processor. Your compiler must also provide a mechanism
    to disable and enable

    interrupts from C. Some compilers allow you to insert in-line assembly statements
    in your source

    code. This makes it easy to verify the proper instructions to enable and disable
    interrupts. Other

    compilers will utilize language extensions to enable and disable interrupts directly
    from C.


    # 8.01 Directories and Files


    The installation program distributed on the disk will install µC/OS-II and the
    port for the Intel 8086

    (Real Mode, Large Model) on your hard disk. I devised a consistent directory structure
    to allow you to easily find

    the for the desired target. If you add a port for another processor, you should
    consider following the

    conventions.


    All the ports should be placed under the \SOFTWARE\uCOS-II directory on your hard
    drive. The source code for

    each microprocessor or microcontroller port MUST be in one two or three files:
    OS_CPU.H,

    OS_CPU.C and optionally, OS_CPU_A.ASM. The assembly language file is optional
    because

