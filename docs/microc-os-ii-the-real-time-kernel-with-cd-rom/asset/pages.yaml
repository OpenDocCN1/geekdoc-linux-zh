- img_proc: true
  md: "Task suspension is additive. This means that if the task being suspended is\
    \ delayed until 'n' ticks expires the task will be resumed only when both the\
    \ time expires and the suspension is removed. Also, if the suspended task is waiting\
    \ for a semaphore and the semaphore is signaled then the task will be removed\
    \ from the semaphore wait list (if it is the highest priority task waiting for\
    \ the semaphore) but execution will not be resumed until the suspension is removed.\n\
    \n# Arguments\n\nprio specifies the priority of the task to suspend. You can suspend\
    \ the calling task by passing OS_PRIO_SELF in which case, the next highest priority\
    \ task will be executed.\n\n# Returned Value\n\nOSTaskSuspend() returns one of\
    \ the following error codes:\n\n+   1) OS_NO_ERR, if the call was successful.\n\
    2) OS_TASK_SUSPEND_IDLE, if you attempted to suspend µC/OS-II's idle task. This\
    \ is of course not allowed.\n3) OS_PRIO_INVALID, if you specified a priority higher\
    \ than the maximum allowed (i.e. you specified a priority >= OS_LOWEST_PRIO) or,\
    \ you didn't specify OS_PRIO_SELF.\n4) OS_TASK_SUSPEND_PRIO, if the task you are\
    \ attempting to suspend does not exist.\n\n# Notes/Warnings\n\nOSTaskSuspend()\
    \ and OSTaskResume() must be used in pair.\n\nA suspended task can only be resumed\
    \ by OSTaskResume().\n\n# Example\n\n```\nvoid TaskX(void *pdata)\n{\n    INT8U\
    \ err;\n\n    for (;) {\n        err = OSTaskSuspend(OS_PRIO_SELF); /* Suspend\
    \ current task */\n        /* Execution continues when ANOTHER task .. */\n  \
    \      /* .. explicitly resumes this task. */\n    }\n}\n```\n\n# OSTaskQuery()\n\
    \nINT8U OSTaskQuery(INT8U prio, OS_TCB *pdata);\n\n| File | Called from | Code\
    \ enabled by |\n| --- | --- | --- |\n| OS_TASK.C | Task or ISR | N/A |"
