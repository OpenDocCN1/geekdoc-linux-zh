    #  2.17 Assigning Task Priorities


    Assigning task priorities is not a trivial undertaking because of the complex
    nature of real-time systems. In most systems, not all tasks are considered critical.
    Critical-tasks should obviously be given low priorities. Most real-time systems
    have a combination of SOFT and HARD requirements. In a SOFT real-time system,
    tasks are performed by the system as quickly as possible, but they don''t have
    to finish by specific times. In HARD real-time systems, tasks have to be performed
    not only correctly but on time.


    An interesting technique Rate Monotonic Scheduling (RMS) has been established
    to assign task priorities based on how tasks execute. Simply put, tasks with the
    highest rate of execution are given the highest priority (see Figure 2-9).


    RMS makes a number of assumptions:


    +   - All tasks are periodic (they occur at regular intervals).

    - Tasks do not synchronize with one another, share resources, or exchange data.

    - The CPU must execute the highest priority task that is ready to run. In other
    words, preemptive scheduling must be used.


    Given a set of n tasks that are assigned RMS priorities, the basic RMS theorem
    states that all task HARD real-time deadlines will be met if the following inequality
    is verified:


    ```

    $\sum_{i=1}^{n} \frac{E_i}{T_i} \leq n \times (2^{1/n}-1)$

    ```'
