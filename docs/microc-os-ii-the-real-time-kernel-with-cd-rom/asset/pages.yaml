    # OS_Q


    Figure 6-9, List of free queue control blocks.


    A control block is a data structure used to maintain information about the queue
    and it contains the fields described below. Note that the fields are preceded
    by a dot to show that they are members of a structure as opposed to simple variables.


    +   .OSQPtr is used to link queue controls in the list of free queue control blocks.
    Once the queue is allocated, this field is not used.


    +   .OSQStart contains a pointer to the start of the queue storage area. Your
    application must declare this storage area before creating the queue.


    +   .OSQEnd is a pointer to one location past the end of the queue. This pointer
    is used to manage the queue circular buffer.


    +   .OSQIn is a pointer to the location where the next message will be inserted.
    .OSQIn is adjusted back to the beginning of the message storage area when .OSQIn
    equals .OSQEnd.


    +   .OSQOut is a pointer to the next message to be extracted from the queue. .OSQOut
    is adjusted back to the beginning of the message storage area when .OSQOut equals
    .OSQEnd. .OSQOut is also used to insert a message (.OSQPeekFront ()


    +   .OSQSize contains the size of the message storage area. The size of the queue
    is determined by your application when the queue is created. Note that μC/OS-IE
    allows the queue to contain up to 65535.


    +   .OSQEries contains the current number of entries in the message queue. The
    queue is empty when .OSQEries is zero and full when it equals .OSQSize. The message
    queue is empty when the queue is created.


    A message is basically a circular buffer as shown in figure 6-10. Each entry contains
    a pointer. The pointer to the next message is deployed at the entry pointed to
    by .OSQIn F6(10) unless the queue is full ( .OSQEntries == .OSQSize) F6(10). Deploying
    the pointer at .OSQIn implements a FIFO (First-In-First-Out) queue by pointing
    to the preceding .OSQOut F6(10) and depositing the pointer at that location. The
    pointer is also considered full when .OSQEntries == .OSQSize. Message pointers
