  md: '# 9.03.02 OS_CPU.H, Critical Sections


    µC/OS-II all like real-time kernels need to disable critical sections of code,
    and enable interrupts when you do. This allows µC/OS-II to protect critical code
    from being entered simultaneously from multiple tasks or ISRs. In this case, because
    the Roland B/C++ compiler supports in-line assembly, it''s quite easy to specify
    the instructions to disable and enable interrupts: `OS_ENTER_CRITICAL()` and `OS_EXIT_CRITICAL()`,
    respectively. I actually provide you with two methods of disabling and enabling
    interrupts L.2(2). The method used is the `#define macro OS_CRITICAL_METHOD` which
    can either be set to 1 or 2. For the tests, I chose #2 but it''s up to you to
    decide which one is best for your application.


    Method #1:


    The first and simplest way to implement these two is to invoke the processor instruction
    to disable interrupts (`CLI`) for `OS_ENTER_CRITICAL()` and the enable interrupts
    instruction (`STI`) for `OS_EXIT_CRITICAL()`. There is, however, a little problem
    with this scenario. If you called the µC/OS-II function with interrupts disabled,
    then return would be disabled. If you wanted them disabled upon return from the
    µC/OS-II function, the above implementation would not be adequate. If you don''t
    care in your application whether interrupts are enabled or disabled, then this
    method is fine. If you need interrupts after calling a µC/OS-II service, then
    you should use this method because of performance. If you do, you will need to
    change the constant in 10 to 8 (`OS_CPU_A.ASM`).


    Method #2:


    The second method to implement `OS_ENTER_CRITICAL()` is to save the processor
    status onto the stack and, disable interrupts. On the 8086 `OS_ENTER_CRITICAL()`
    simply calls a `POPF` instruction to restore the original contents of the processor''s
    SW register. Using this scheme, if you called a µC/OS-II service with either interrupts
    enabled or disabled, the status would be preserved as well. Few words of caution
    however, if you called a µC/OS-II service with interrupts disabled, you are potentially
    extending the latency of your application. Also, if you use an interrupt before
    calling a µC/OS-II service, as in `OSDimely()`, this will happen because the stack
    will be suspended until you return, because interrupts are disabled, you will
    never service the tick interrupt! Obviously, the PEND calls are also subject to
    this problem, so be careful. As a general rule, you should call all µC/OS-II services
    with interrupts enabled! If you want to preserve the interrupt status across µC/OS-II
    service then obviously this method is for you but must be careful.


    # 9.03.03 OS_CPU.H, Stack Growth


    The stack on an 8086 processor grows from high-memory to low-memory which means
    that `OS_STK_GROWTH` must be set to L.2(3).


    # 9.03.04 OS_CPU.H, OS_TASK_SW()


    In µC/OS-II, the frame for a task always looks as if an interrupt has occurred
    and all processor registers were saved too. To switch context, `OS_TASK_SW()`
    simulates an interrupt L.2(5). The 8086 has 256 software instructions to accomplish
    this. The service routine (ISR) also calls the ''exception handler'' which uses
    the assembly language function `OSctSw()` (see `OS_CPU_A.ASM`).


    Because I tested the code on a PC, I decided to use interrupt number 128 (i.e.
    0x80) because I found it to be available L.2(4). Actually, the original PC used
    interrupts 0x80 through 0xF for the BASIC interpreter. Few if any PCs nowadays
    have a BASIC interpreter built in, it should be to save these vectors. Optionally,
    you'
  merge: -1
