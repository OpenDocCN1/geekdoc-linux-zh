    # 7.03 Returning a memory block, OSMemPut()


    When your application is using a memory block, it must return it to the appropriate
    partition. This is accomplished by calling OSMemPut (). You should note that OSMemPut
    () has no way of knowing whether the memory block returned to the partition belongs
    to that partition. If you allocated a memory block from a partition containing
    blocks of 32 bytes then should not return this to a memory partition containing
    blocks of 120 bytes. The next time an application request for the 120 bytes partition,
    it will get 32 ''valid'' bytes and the remaining 88 bytes may belong to some other
    task(s). This could potentially make your system crash.


    Listing 7.5 shows for OSMemPut (). You simply pass OSMemPut () the address of
    the memory control for which memory block belongs to L7.5(1). We then check to
    see that the memory partition is not full L7.5(2). This situation would indicate
    that something went wrong during the allocation/deallocation process. If the memory
    partition can accept another block, it is inserted into the linked list of free
    blocks L.7(3). Finally, the number of memory blocks in the partition is incremented
    L7.5(4).


    INT8 OSMemPut(pmem, void *pblk) (1)

    OS_ENTER_CRITICAL();

    if (pmem->OSMemNFree >= pmem->OSMemNblks) (2)

    OS_EXIT_CRITICAL();

    return (OS_MEM_FULL);

    (void **)pblk = pmem->OSMemFreeList = pmem->pblk; (3)

    ppmem->OSMemNFree++;

    OS_EXIT_CRITICAL();

    return (OS_MEM_NO_ERR); (4)


