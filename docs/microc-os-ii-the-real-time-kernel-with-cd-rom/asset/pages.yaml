    #  2.9. Buffer management using a semaphore.


    The manager will satisfy the first 10 requests (since there are 10 keys). When
    all semaphores are used, a task requesting a buffer will be suspended until a
    semaphore becomes available. Interrupts are disabled to gain exclusive access
    to the linked list (this operation is very quick). When a task is finished with
    the buffer, it calls BufReq() to return the buffer to the buffer manager: the
    buffer is inserted into the linked list before the semaphore is released. By encapsulating
    the buffer manager in BufReq() and BufRel(), the caller doesn''t need to be concerned
    with the actual implementation details.


    Semaphores are overused. The use of a semaphore to access a shared variable is
    overkill in most situations. The overhead in acquiring and releasing the semaphore
    can consume valuable time. You can do the job just as efficiently by disabling
    and enabling interrupts (see section 2.19.01, Mutual Exclusion, Disabling and
    Enabling Interrupts). Let''s that tasks are sharing a 32-bit integer variable.
    The first task inserts the variable while the other clears it. If you consider
    how long a processor takes to perform each operation, you will realize that you
    do not need a semaphore to gain exclusive access to the variable. Each task simply
    needs to disable interrupts before performing its operation on the variable and
    enable interrupts when the operation is complete. A semaphore should be used,
    however, if the variable is a floating-point variable and the microprocessor doesn''t
    support floating-point in hardware. In this case, the processing time involved
    in processing the floating-point variable could affect interrupt latency if you
    had disabled interrupts.


