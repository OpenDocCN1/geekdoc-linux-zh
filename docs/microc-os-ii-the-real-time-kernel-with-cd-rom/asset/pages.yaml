  md: "```\nvoid OSTickISR(void)\n{\n    Save processor registers;\n    Call OSIntEnter()\
    \ or increment OSIntNesting;\n\n    Call OSTimeTick();\n\n    Call OSIntExit();\n\
    \    Restore processor registers;\n    Execute a return from interrupt instruction;\n\
    }\n```\n\n# Listing 3.19, Pseudo code for Tick ISR.\n\nThe code for **OSTimeTick()`\
    \ is shown in listing 3.20. **OSTimeTick()` starts by calling a user definable\
    \ function **OSTimeTickHook()`** which can be used to extend the functionality\
    \ of **OSTimeTick()` L3.20(1). I decided to call **OSTimeTickHook()` some time\
    \ critical work to do. Most of the work done by **OSTimeTick()` basically consists\
    \ of decrementing the **OSTCB** field for each **OS_TCB** (if it's nonzero). **OSTimeTick()`\
    \ follows the chain of **OS_TCB** starting at **OSTCBList** L3.20(2) until it\
    \ reaches the idle task L3.20(3). When the **OSTCB** field of a task **OS_TCB**\
