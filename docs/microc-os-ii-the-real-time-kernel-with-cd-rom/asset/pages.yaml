  md: '# Segment Register


    # Offset (Register)


    # Physical Address


    Figure 9-2, Addressing with a Segment and an Offset


    The Code segment register (CS) points to the base of the program currently executing,
    the Stack register (SS) points to the base of the stack, the Data segment register
    (DS) points to the base of one data area while the Extra Segment register (ES)
    points to the base of another where data may be stored. Each time the CPU needs
    to generate a memory address, one of the segment registers is atomically chosen
    and its contents added to offset. It is common to find the segment-offset notation
    in literature to reference a memory location. For example, 1000:0FF physical memory
    0X100FF.


    # 9.00 Development Tools


    I used the Borland C/C++ V3.1 compiler along the Borland Turbo Assembler to port
    and test the 8086 port. The compiler generates code and provides in-line assembly
    instructions to be inserted in C code. Once compiled, the code is executed on
    a PC. I tested the code on a Pentium-II base computer running the Microsoft Windows
    95 operating system. In fact, I configured the compiler to generate a executable
    which was run in a DOS environment.


    This port will run as long as the compiler can generate Real-Mode. You will likely
    have to change some of the compiler options and assembler directives.


    # 9.01 Directories and Files


    The installation program provided on the distribution will install the port for
    the Intel 8086 (Real, Large Model) on your hard disk. The port is found under
    the \SOFTWARE\uCOS-II\x86L directory on your drive. The directory name stands
    for Intel 8086 Real, Large Model. The source code for the port is found in the
    following folders: OS_CPU, OS_CPU_C_C, and OS_CPU_ASM.


    # 9.02 INCLUDES.H


    INCLUDES.H is a MASTER file and is found at the base of all .C files. INCLUDES.H
    allows every C file to be written without concerns about which header file will
    be included. The only drawback to having back a master include file is that INCLUDES.H
    may include header files that are not pertinent to the actual C file being compiled.
    This means each file will require extra time to compile. This inconvenience is
    offset by code portability. You can edit INCLUDES.H to add your owner header files,
    but your header files should be added at the end of the list. Listing 9.1 shows
    the contents of INCLUDES.H for the 8086 port.'
