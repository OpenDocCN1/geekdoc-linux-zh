  md: "OSMboxCreate() is used to create and initialize a mailbox. A mailbox is used\
    \ to allow ISRs to send a pointer size variable (message) to one or more tasks.\n\
    \n# Arguments\n\nmsg is used to initialize the contents of the mailbox. The mailbox\
    \ is empty when msg is a NULL pointer. The mailbox will initially contain a message\
    \ when msg is not NULL.\n\n# Returned Value\n\nA pointer to the event control\
    \ block allocated to the mailbox. If no event control block is available, OSMboxCreate()\
    \ will return a NULL pointer.\n\n# Notes/Warnings\n\nMailboxes must be created\
    \ before they are used.\n\n# Example\n\n```\nOS_EVENT *Commbox;\n\nvoid main(void)\n\
    {\n    OSInit();                    /* Initialize µC/OS-II */\n\n    Commbox =\
    \ OSMboxCreate((void *)0); /* Create COMM mailbox */\n    OSStart();         \
    \          /* Start Multitasking */\n}\n\nvoid *OSMboxPend(OS_EVENT *pevent, INT16U\
    \ timeout, INT8U *err);\n```\n\n# OSMboxPend()\n\n| File | Called from | Code\
    \ enabled by |\n|---|---|---|\n| OS_MBOX.C | Task only | OS_MBOX_EN |\n\nOSMboxPend()\
    \ is used when a task needs to receive a message. The message is sent to the task\
    \ either by an ISR or by another task. The message received is a pointer size\
    \ variable and its use is application specific. If a message is present in the\
    \ mailbox when OSMboxPend() is called then, the message is retrieved, and returned\
    \ to the caller. If no message is present in the mailbox, OSMboxPend() will suspend\
    \ the current task until a message is received or a user specified timeout expires.\
    \ If a message is sent to the mailbox and multiple tasks are waiting for such\
    \ a message, µC/OS-II will resume the highest priority task that is waiting. A\
    \ pended task that has been suspended with OSTTaskSuspend() can receive a message.\
    \ The task will, however, remain suspended until the task is resumed by calling\
    \ OSTTaskResume().\n\n# Arguments"
