    # Listing 1.1. Portable data types.


    The INT16U data type, always represents a 16-bit unsigned integer. µ/OS-II and
    your application code can now assume that the range of variables declared with
    this is from 0 to 65535. By µ/OS-II a 32-bit counter could mean that an INT16U
    would be declared as an unsigned short instead of an unsigned int. When µ/OS-II
    is concerned, however, it still deals with INT16U. Listing 1.1 provides the declarations
    for the 8086 and the Borland C/C++ compiler as an.


    For backward compatibility with µ/OS, I also defined the data types BYTE, WORD,
    LONG (and their unsigned variants). This allows you to migrate µ/OS code to µ/OS-II
    without changing all instances of the old data types to the new data types. I
    decided to make this transition and break away from the old style types I believe
    that this scheme makes more sense and is more obvious. A WORD to some people may
    mean a 32-bit value whereas I originally intended it to mean a 16-bit value. With
    the new data types, there should be no more confusion.


    # 1.03 Global Variables


    Following is a technique that I use to declare global variables. As you know,
    a global variable needs to be allocated storage space in RAM and must be referenced
    by other modules using the C keyword extern. Declarations must then be placed
    in both the C and the H files. This duplication of declarations, however, can
    lead to mistakes. The technique described in this section only requires a single
    declaration in the header file, but is a little tricky to understand. However,
    once you know how this technique will work effectively.


    In all H files that define global variables, you will find the following declaration:


    ```

    #ifndef xxx_GLOBALS

    #define xxx_EXT

    #else

    ```'
