    # 9.04.04 OS_CPU_ASM, OSStickISR ()


    As mentioned in section 9.03.05, the tick rate of an RTOS should be set between
    10 and 100 Hz. On the PC, the tick occurs 54.93 ms (18.20648 Hz) and is obtained
    by a hardware timer that interrupts the CPU. You should recall that I decided
    to reprogram the tick rate to 200 Hz. The ticker on the PC is assigned to vector
    0x08 but µOS-II needs to be ‘redefined’ so that it vectors to OSStickISR instead.
    Because of this, the PC’s tick handler is saved (every PC . C . PC_DOSaveReturn
    () ) in vector 129 (0x81). To satisfy DOS, the PC’s handler will be called every
    54.93 ms (described shortly). Figure 9-6 shows the contents of the interrupt vector
    table (IVT) before and after installing µOS-II.'
