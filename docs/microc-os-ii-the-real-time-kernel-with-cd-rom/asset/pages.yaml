  md: '# Chapter 12


    # Configuration Manual


    This chapter provides a description of the configurable elements of μC/OS-II.
    Because μC/OS-II is provided in source form, configuration of μC/OS-II is done
    through a number of #define constants. The #define constants are found in a file
    called OS_CFG.H and should exist for each project/product you make.


    This section describes each of the #define constant in the order in which they
    are found in OS_CFG.H. Table 12-1 provides a summary of these constants and which
    μC/OS-II functions affect.


    Of course, OS_CFG.H must be included when μC/OS-II is built in order for the desired
    configuration to take effect.'
