    PC_GetKey() is a function that checks to see if a key was pressed and if so, that
    key, and returns it to the caller. PC_GetKey() uses the Borland C/C++ library
    functions kbhit() and getch() all have, equivalent on other DOS compilers.


    PC_SetTickRate() allows you to change the tick rate for µOS-II by specifying the
    desired frequency. Under a DOS, a tick occurs 18.20648 times per second, or 54.925
    ms. This is because the 82C54 chip initialized with a divide by 59659, the tick
    rate would have been a very nice 20.000 Hz! I decided to change the tick rate
    to mode ''exciting'' and thus, to use about 200 Hz (actually 199.9966). You will
    note that the function OSTicker() found in OS_CPU_A.ASM contains code to call
    the DOS tick handler one out of 11. This is to ensure that the housekeeping needed
    in DOS is maintained. You would not need to do this if you want to set the tick
    rate to 20 Hz. Before returning to DOS, PC_SetTickRate() is called by specifying
    18.2 Hz and will correctly set the 82C54. PC_SetTickRate() will know that you
    actually mean 18.2 Hz.


