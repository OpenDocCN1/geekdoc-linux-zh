    #  9.4.02 OS_CPU_ASM, OSctxSw()


    A task level switch is accomplished by executing a software interrupt instruction
    on the 80x86 processor. The interrupt service routine MUST vector to OSctxSw().
    The sequence of events leads mu/OS-II to vector to OSctxSw() is as follows. The
    current task calls a service provided by mu/OS-II which causes a higher priority
    to be ready-to-run. At the end of the call, mu/OS-II calls the function OSched()
    concludes that the current task is no longer the most important task to run. OSched()
    loads the address of the highest priority task into OSTCBReady and executes the
    software interrupt instruction by invoking the macro OS_TASK_SW(). Note that OSCBUR
    already contains a pointer to the current task''s Task Control Block, OS_TCB.
    The code for OSctxSw() is shown in listing 9.4. The numbers in parentheses correspond
    to the enumerated description below.


    | OSctxSw | PROC | FAR | | |

    |---|---|---|---|---||

    | | PUSHA | | ; Save task''s context | (1) |

    | | PUSH | | | (2) |

    | | ES | | | (3) |

    | | POP | | | (4) |

    | | MOV | AX, SEG; DS:OSTCBur | ; Reload DS in case it was altered |

    | | DS, AX | | | |

    | | LES | AX, WORD PTR DS:OSTCBur | ; OSTCB:OSctxStKptr = SS:SP |

    | | ES:[BX+2], SS | | | |

    | | MOV | ES:OSTCBur, AX | | | |

    | | CALL | FAR OS_TASKSw() | | | (6) |

    | | MOV | AX, WORD PTR DS:OSTCBHighRdy+2 | ; OSTCB=OSTCBHighRdy | (7) |

