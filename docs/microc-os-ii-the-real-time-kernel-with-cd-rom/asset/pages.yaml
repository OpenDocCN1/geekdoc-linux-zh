    # 2.33 Clock Tick


    A clock tick is a special interrupt that occurs periodically. This interrupt can
    be viewed as the system''s heartbeat. The time between interrupts is application
    specific and is generally between 10 and 200 ms. The clock tick interrupt allows
    a kernel to delay tasks for an integral number of clock ticks and provide timeouts
    when tasks are waiting for events to occur. The faster the tick rate, the higher
    the overhead imposed on the system.


    All kernels allow tasks to be delayed for a certain number of clock ticks. The
    resolution of delayed tasks is 1 clock tick, however, this does not mean that
    its accuracy is 1 clock tick.


    Figures 2-24 through 2-26 are timing diagrams showing a task delaying for 1 tick.
    The shaded areas indicate the execution time for each operation being performed.
    Note that the time for each operation varies to reflect typical processing, which
    may include loops and conditional statements (i.e., if/else, switch and ?). The
    processing time of the "Tick ISR" has been exaggerated to show that it is subject
    to varying execution times.


    Case 1 (Figure 2-24) shows a situation where higher priority tasks and ISRs execute
    prior to the task, which needs to delay for 1 tick. As you can see, the task attempts
    to delay for 20 ms but because of its priority, actually executes at varying intervals.
    This will thus cause the execution of the task to jitter.


    ![](img/114817931de46def85b7b339e903e24f_75_1.png)


    Figure 2-24, Delaying a task for 1 tick (case #1).'
