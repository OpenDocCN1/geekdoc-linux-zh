  md: '# Chapter 6


    # # Intertask Communication &

    Synchronization


    µC/OS-II provides many mechanisms to protect shared data and provide intertask
    communication. We have already seen two such mechanisms:


    +   1) Disabling and enabling interrupts through the two macros `OS_ENTER_CRITICAL()`
    and `OS_EXIT_CRITICAL()`, respectively. You use these macros when two tasks or
    a task and an ISR need to share data. See section 3.00, *Critical Sections*, 8.03.02,
    `OS_CPU.H`, `OS_ENTER_CRITICAL()` and `OS_EXIT_CRITICAL()` and, section 9.03.02,
    *Critical Sections*.


    +   2) Locking and unlocking µC/OS-II''s scheduler with `OSLock()` and `OSUnlock()`


    This chapter discusses the three types of services provided by µC/OS-II: Message
    mailboxes and Messages.


    Figure 6-1 shows how tasks and Interrupt Service Routines (ISRs) can interact
    with each other. A task or an ISR signals a task F6-1A(1) through a kernel object
    called an *Event Control Block (ECB). The signal is considered to be an event
    which explains my choice of name. A task can wait for another task or an ISR to
    signal the object F6-1A(2). You should note that only tasks are allowed to wait
    for events to occur — an ISR is not allowed to wait on an ECB. An optional timeout
    F6-1A(3) can be specified by the waiting task in case the object is not signaled
    within a specified time. Multiple tasks can wait for a task or an ISR to signal
    an ECB F6-1B. When the ECB is signaled, only the highest priority task waiting
    on the ECB will be ‘signaled’ and thus will be ready-to-run. An ECB can either
    be a semaphore, a message mailbox or a message queue as we will see later. When
    an ECB is used as a semaphore, tasks will both wait and signal the ECB F6-1C(4).'
