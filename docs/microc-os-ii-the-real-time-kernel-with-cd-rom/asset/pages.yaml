  md: "OSMboxAccept() allows you to check if a message is available from the desired\
    \ mailbox. Unlike OSMboxPend(), OSMboxAccept() does not suspend the calling task\
    \ if a message is not available. If a message is available, the message will be\
    \ returned to your application and the contents of the mailbox will be cleared.\
    \ This call is typically used by ISRs as an ISR is not allowed to wait for a message\
    \ at a mailbox.\n\n# Arguments\n\npevent is a pointer to the mailbox where the\
    \ message is to be received from. This pointer is returned to your application\
    \ when the mailbox is created (see OSMboxCreate()).\n\n# Returned Value\n\nA pointer\
    \ to the message if one is available or, NULL if the mailbox does not contain\
    \ a message.\n\n# Notes/Warnings\n\nMailboxes must be created before they are\
    \ used.\n\n# Example\n\n```\nOS_EVENT *CommBox;\n\nvoid Task (void *pdata) {\n\
    \    void *msg;\n\n    pdata = pdata;\n    for (;;) {\n        msg = OSMboxAccept(CommBox);\
    \ /* Check mailbox for a message */\n        if (msg != (void *)0) {\n       \
