  md: "# Returned Value\n\nOSTaskStChk() returns one of the following error codes:\n\
    \n+   1) OS_NO_ERR, if you specified valid arguments and the call was successful.\n\
    2) OS_PRIO_INVALID, if you specified a task priority higher than OS_LOWEST_PRIO,\
    \ or you didn't specify OS_PRIO_SELF\n3) OS_TASK_NOT_EXIST, if the task does not\
    \ exist.\n4) OS_TASK_OPT_ERR, if you did not specify OS_TASK_OPT_CHK when the\
    \ task was created by OSTaskCreateExt() or, you created the task using OSTaskCreate().\n\
    \n# Notes/Warnings\n\nExecution time of this task depends on the size of the task's\
    \ stack and is non-deterministic.\n\nYour application can determine the total\
    \ stack space (in number of bytes) by adding the two fields .Free and .OSUsed.\n\
    \nTechnically, this function can be called by an ISR, but because of the possibly\
    \ long execution time, it is advisable.\n\n# Example\n\n```\nvoid Task (void *pdata)\
    \ {\n    OS_STK_DATA stk_data;\n    INT32U       stk_size;\n\n    for (;;) {\n\
    \        .\n        err = OSTaskStChk(10, &stk_data);\n        if (err == OS_NO_ERR)\
    \ {\n            stk_size = stk_data.OSFree + stk_data.OSUsed;\n        }\n  \
    \  }\n}\n```\n\n# OSTaskSuspendSuspend()\n\nINT8U OSTaskSuspend(INT8U prio);\n\
    \n| File | Called from | Code enabled by |\n| OS_TASK.C | Task only | OS_TASK_SUSPEND_EN\
    \ |\n\nOSTaskSuspend() allows your application to suspend (or block) execution\
    \ of a task unconditionally. The calling task can be suspended by specifying its\
    \ own priority number or OS_PRIO_SELF if the task doesn't know its own priority.\
    \ In this case, another task will need to resume the suspended task. If the current\
    \ task is suspended, rescheduling will occur and µ/OS-II will run the next priority\
    \ task ready to run. The only way to resume a suspended task is to call OSTaskResume()."
