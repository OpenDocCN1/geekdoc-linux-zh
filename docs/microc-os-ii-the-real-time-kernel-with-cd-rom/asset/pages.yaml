    # Listing 3.14, ISRs under µ/OS-II


    Your code should save all CPU registers onto the current task L3.14). Note that
    on processors like the Motorola 68020 (and higher), a different stack is used
    when servicing an interrupt. µ/OS-II can work with such processors as the registers
    are saved on the interrupted task''s stack when context switch occurs.


    µ/OS-II needs to know that you are servicing an ISR and then need to either call
    OSIntEnter() or increment the global variable OSIntesting L3.1(2). OSIntesting
    can be incremented directly if your processor performs an operation on memory
    using read OSIntesting, increment the register and then store the result back
    in OSIntesting then you should call OSIntEnter(). OSIntEnter() wraps these three
    operations with code to disable and enable interrupts thus ensuring access to
    OSIntesting which is a shared resource. OSIntesting is much faster than calling
    OSIntEnter() and this is the preferred way. One of caution, implementation of
    OSIntEnter() will cause faults to be enabled when OSIntEnter() returns. In these
    cases, your interrupt will be re-entered and your application will crash!


    The previous two steps have been achieved, you can start servicing the device
    L3.14(3). This description is obviously specific; µ/OS-II allows to nest interrupts
    because it keeps track of nesting in OSIntesting. In many cases, you will need
    to clear the interrupt source before calling OSIntEnter to allow for nesting.


    The conclusion of the ISR is marked by calling OSIntExit() L3.14(4) which decrements
    the nesting counter. When the nesting counter reaches 0, all interrupts have completed
    and µ/OS-II need to determine whether a higher priority task has been awakened
    by the ISR (or any other ISR). If a higher priority task is to run, µ/OS will
    return to the higher priority task rather than to the task. If the interrupted
    task is the most important task to run the OSIntExit() will return to its task
    L3.14. At this point the saved registers are restored and a return from interrupt
    instruction is executed L3.14(6). Note that µ/OS-II will be returned to the interrupted
    task.


    The above description is further illustrated in figure 3-5. The result F3-5(1)
    is not just because the CPU either interrupts have been disabled by µ/OS-II or
    your application, or the CPU has not completed executing the interrupt. Once the
    CPU fetches F3-5(2), the CPU vectors (at least on microprocessors) read (i.e.
    the CPU''s context). In this case, your ISR is notified by µ/OS-II by calling
    OSIntEnter() or by incrementing OSIntesting F3-5(3). Your code then gets to execute
    F3-5(6). You should do this as little as possible and defer more work to the task.
    A task is notified of the ISR by calling either OSPostEvent(), OSPostQueue() or
    OSPost(). The receiving task may not be posted immediately, queue or semaphore
    when the ISR occurs and the post is made. If you used the OSInt code handler,
    you will need to call OSIntExit() F3-5(7). As can be seen from the timing, OSIntExit()
    takes less time to return when there is no higher priority task (HPT) awakened
    by the ISR. Furthermore, in this case, the CPU registers are simply restored F3-5(8)
    and a return from interrupt instruction is executed F3-5(9). If the ISR made a
    higher priority task to run then OSIntExit() will take longer to execute since
    a context switch'
