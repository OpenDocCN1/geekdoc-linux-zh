  md: '# Notes/Warnings


    +   1) This function must not be called by task level code.

    2) You can actually increment the interrupt nesting counter (OSIntNesting) directly
    if your processor can perform this operation indivisibly. In other words, if your
    processor can perform a read-modify-write as an atomic operation then you don''t
    need to call OSIntEnter() and instead, directly increment OSIntNesting. This would
    avoid the overhead associated with calling a function.


    # Example #1

    (Intel 80x86, Real-Mode, Large Model)


    Here we call OSIntEnter() because of backward compatibility with μC/OS. Also,
    you would do this if your processor are using not allow to increment OSIntNesting
    using a single instruction.


    ```

    ISRx

    PUSHA                  ; Save interrupted task''s context

    PUSH                    ES

    PUSH                    DS


    MOV                     AX, DGROUP      ; Reload DS

    MOV                     DS, AX


    CALL    FAR PTR _OSIntEnter ; Notify μC/OS-II of start of ISR


    POP                     DS              ; Restore processor registers

    POP                     ES

    POPA

    IRET                   ; Return from interrupt

    ISRx    ENDP

    ```


    # Example #2

    (Intel 80x86, Real-Mode, Large Model)


    Here we use OSIntNesting because the 80x86 allow you to perform this operation
    indivisibly.


    ```

    ISRx                FAR

    PUSHA                  ; Save interrupted task''s context

    PUSH                    ES

    PUSH                    DS


    MOV                     AX, DGROUP      ; Reload DS

    MOV                     DS, AX


    INC                     BYTE PTR _OSIntNesting ; Notify μC/OS-II of start of ISR


    POP                     DS              ; Restore processor registers

    POP                     ES

    POPA

    IRET                   ; Return from interrupt

    ```'
