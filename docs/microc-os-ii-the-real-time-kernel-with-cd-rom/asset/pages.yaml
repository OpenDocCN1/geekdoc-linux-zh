  md: "# # OSTTaskDelReq()\n\nINTBU OSTTaskDelReq(INTBU prio);\n\n| File | Called\
    \ from | Code enabled by |\n| --- | --- | --- |\n| OS_TASK_C | Task only | OS_TASK_DEN\
    \ |\n\n**OSTTaskDelReq()** allows your application to request that a task deletes\
    \ itself. Basically, you would use **OSTTaskDelReq** when you need to delete a\
    \ task that can potentially own resources (e.g the task may own a semaphore).\
    \ In this case, you don't want to delete the task until the resource is released.\
    \ The requesting task calls **OSTTaskDelReq** to indicate that the task needs\
    \ to be deleted. Deletion of the task is, however, deferred until the task being\
    \ deleted. In other words, the task deleted when it regains control of the CPU.\
    \ For example, suppose task #10 needs to be deleted. The desiring to delete this\
    \ task (example #5) would call **OSTTaskDelReq(10)**. When #10 goes to delete\
    \ itself it would call **OSTTaskDelReq(OS_PRIO_SELF)** and monitor the returned\
    \ value. If the value is **OS_PRIO_SELF**, then task #10 is asked to delete itself.\
    \ At this point, task #10 would know whether task #10 has been deleted.\n\nArguments\n\
    \n**prio** is the task's priority number of the task to delete. If you specify\
    \ **OS_PRIO_SELF**, then you are asking another task wants you to be deleted.\n\
    \nReturned Value\n\n**OSTTaskDelReq()** returns one of the following error codes:\n\
    \n+   1) **OS_NO_ERR**, if the task deletion has been registered\n2) **OS_TASK_NOT_EXIST**,\
    \ if the task does not exist. The requesting task can monitor this return code\
    \ to see if the task actually deleted.\n3) **OS_TASK_DEL_ID**, if you asked to\
    \ delete the task (this is obviously not allowed).\n4) **OS_PRIO_INVALID**, if\
    \ you specified a priority higher than **OS_LOWEST_PRIO** or, you have not specified\
    \ **OS_PRIO_SELF**.\n5) **OS_TASK_DEL_REQ**, if a task (possibly another task)\
    \ requested that the running task has been deleted.\n\nNotes/Warnings\n\n**OSTTaskDelReq()**\
    \ verifies that you are not attempting to delete the μC/OS-II's task.\n\nExample\n\
    \n```\nvoid TaskThatDeletes(void *pdata)    /* My priority is 5     */\n{\n  \
    \  INTBU err;\n\n    for(;;) {\n```"
