  md: "# 19.03 Example #3, Notes\n\nThere are things happening behind the scenes and\
    \ would not be apparent just looking at EX3L. EX3L.C contains code for OTaskSwHook()\
    \ that measures the execution time of each task, how often each task executes,\
    \ and keeps track of total execution time of each task. This information is stored\
    \ in the TCB extension so it can be displayed. OTaskSwHook() is called every time\
    \ a context switch occurs.\n\nThe execution time of the task being switched out\
    \ is obtained by reading a timer on the PC through the function PC_ElapsedStop()\
    \ L1.27(1). It is assumed that the task was started by calling PC_ElapsedStart()\
    \ L1.27(2). The first context switch will probably read an incorrect value but\
