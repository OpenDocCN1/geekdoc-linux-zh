    #  5.03 System time, OStimeGet() and OStimeSet()


    Whenever a clock tick occurs, µOS increments a 32-bit counter. This counter starts
    at zero when you initiate multitasking by calling Start() and rolls over after
    4,294,967,296 ticks. At a rate of 100 Hz, this 32-bit counter rolls over every
    497 days. You can obtain the current value of this counter by calling OStimeGet().
    You can also change the value of the counter by calling OStimeSet(). The code
    for both functions is shown in listing 5.4. Note that interrupts are disabled
    when accessing . This is because incrementing and copying a 32-bit value on 8-bit
