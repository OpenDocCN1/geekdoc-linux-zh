  md: '# 1.05.02 PC Based Services, Elapsed Time Measurement


    The elapsed time measurement functions are used to determine how much time a function
    takes to execute. Time measurement is performed using the PC''s 82C54 timer #
    You make time measurement by wrapping the code to measure by the two functions
    PC_ElapsedStart() and PC_ElapsedStop(). However, before you use these two functions,
    you need to call the function PC_ElapsedInit(), PC_ElapsedInit basically computes
    the overhead associated with the other two functions. This way, the execution
    time returned by PC_ElapsedStop() consist exclusively of the code you are measuring.
    Note that none of these functions are reentrant and you must be careful that you
    do not invoke them from multiple tasks at the same time. The example in listing
    1.4 shows how you could measure the execution time by PC_DispChar(μS).


    ```

    INT16 time;


    PC_ElapsedInit();


    PC_ElapsedStart();

    PC_DispChar(40, 24, ''A'', DISP_FGND_WHITE);

    time = PC_ElapsedStop();

    ```


    # Listing 1.4, Measuring code execution time.


    # 1.05.03 PC Based Services, Miscellaneous


    A μC/OS-II application looks just like any other DOS application. In other words,
    you compile and link your code just as if you do a single application running
    under DOS. The .EXE file that you create is loaded and executed by DOS and execution
    of your application starts from main (). Because μC/OS-II performs multitasking
    and needs to create a stack for each task, the single DOS environment must be
    stored in case your application wishes to quit μC/OS-II, and return to DOS. Saving
    the DOS environment is done by calling PC_DOSSaveReturn(). When your application
    needs to return to DOS (and exit μC/OS-II), you simply call PC_DOSReturn(). PC_C
    makes use of the ANSI setjmp() and longjmp() functions to save and restore the
    DOS environment, respectively. These functions are provided by the Borland C/C++
    compiler and will be available on other compilers.


    You should note that a crashed application or invoking exit(0) without using PC_DOSReturn()
    can leave DOS a corrupted state. This may lead to a crash of DOS, or the DOS window
    within Windows 95.


    PC_GetTime() is a function that obtains the PC''s current date and time, and formats
    information into an ASCH string. The format is "MM-DD-YY HH:MM:SS" and you will
    need at 19'
  merge: -1
