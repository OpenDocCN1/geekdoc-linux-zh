  md: '# Listing 3.3, µ/C-OS-II''s Task Control Block


    OSTCBkstPtr contains a pointer to the top of the stack. Each task to have its
    own stack size but just as important, each stack can be of any size. Some commercial
    kernels assume that all stacks are size unless you write complete hooks. This
    limitation wastes RAM when all tasks have different stack requirements, because
    the largest anticipated stack size must be allocated for all tasks. OSTCBkstPtr
    is the only field in the OS_TC data structure from assembly language code (from
    the switching code). Placing OSTCBkstPtr at the first entry in the structure makes
    accessing this field easier from assembly language code.


    OSTCBExtPtr is a pointer to a user define task control block extension. This allows
    you or the user of µ/C-OS to extend the task control block without changing the
    source code for µ/C-OS. OSTCBExtPtr is only used by TaskCreateExt() and thus,
    you will need to set OS_TASK_CREATE_EXT_EN. You could create a data structure
    that contains the name of each task, track time of the task, number of times a
    task has switched in and out (see Example #3). Note: I decided to place this pointer
    immediately after the stack pointer in case you need to access this field which
    makes calculating the offset from the beginning of the data structure easier.


    OSTCBkstackBottom is a pointer to the stack bottom. If the processor grows from
    high to low memory OSTCBkstackBottom will point at the lowest memory location
    for the task. Similarly, if the processor grows from low to high memory OSTCBstackTop
    will point at the highest valid stack address. OSTCBStackCheck() will check the
    size of a stack at runtime. This allows you to determine the amount of free space
    available for each task. Stack checking can only occur if you create a task with
    TaskCreateExt() and thus, you will need to set OS_TASK_CREATE_EXT_EN to 1 to enable
    this.


    OSTCBSize is a variable that holds the size of the stack in number of elements
    instead of bytes. This means that if a task contains 1000 entries and each entry
    is 32-bit then the total size of the stack is 4000 bytes. Similarly, the stack
    size is used by OSTStackCheck(). Again, this field is valid only if you set OS_TASK_CREATE_EXT_EN
    to 1.


    OSTCBOpt is a variable that holds ''options'' that can be passed to TaskCreateExt().
    Because of this, the field is valid only if you set OS_TASK_CREATE_EXT_EN to 1.
    µ/C-OS currently defines three options (see µ/OS_II; OS_TASK_OPT_SHK, OS_TASK_OPT_STK_CLK
    and OS_TASK_SAVE_FP) used to specify by TaskCreateExt() that stack checking is
    enabled for the task being created. The stack needs to be cleared when the task
    is created. The stack only needs to be cleared if you do not stack checking. If
    you do not specify OS_TASK_OPT_STK_CLK and you delete tasks, the stack will report
    incorrect stack size. If you never delete a task once it''s created and your startup
    code clears all RAM, then you can save execution time by NOT specifying this option.
    Passing OS_TASK_OPT_SAVE_FP to TaskCreateExt() will save floating-point registers.
    The larger the task, the longer it will take. Finally, if the processor provides
    hardware assisted floating-point capability then, the floating-point registers
    need to be saved for the task being created and during a context switch.


    OSTBID is a variable that is used to hold an identifier for the task. This field
    is currently not used and has been included for future incrementation.


    OSTCBNext and OSTCBPrev are used to doubly link OS_TCBs. This chain of OS_TCBs
    is used by OSTimeTick() to update the OSTCBID for each task. The OS_TCB is for
    each task linked when'
