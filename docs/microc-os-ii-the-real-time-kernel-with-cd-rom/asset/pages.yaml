  md: '# Figures, Listings and Tables Convention:


    You will notice that when I reference a specific element in a figure, I use the
    ''F'' followed by the figure number. A number in parenthesis following the figure
    number represents a specific element in the figure that I am trying to bring your
    attention to. FI-2(3) thus means like the third item in Figure I-2.


    Listings and tables work exactly the same way except that a listing starts with
    the letter ''L'' and a table with the letter ''T''.


    # Source Code Conventions:


    All μC/OS-II objects (functions, variables, #define constants and macros) start
    with OS indicating that they are Operating System related.


    Functions are found in alphabetical order in all the source code files. This allows
    you to quickly locate any function.


    You will find the coding style I use very consistent. I have been adopting the
    K&R style for many years. However, I did add some of my own enhancements to make
    the code (I believe) easier to read and maintain. Indention is always 4 spaces,
    TABs are never used, at least one space around an operator, comments are to the
    right of code, comment blocks are used to describe functions, etc.


    The following table provides the acronyms, abbreviations and mnemonics (AAM) used
    in this book. I combine some of these AAMs to make up function, variable and #define
    names in a hierarchical OS. For example, the function OSBoxCreate() reads like
    this: the function is part of the operating system (OS), it is related to the
    mailbox services (Mbox) and the operation performed is to Create a mailbox. Also,
    all services that have similar operation share the same name. For example, OSSemCreate()
    and OSBoxCreate() perform the same operation but on their respective objects (i.e.
    semaphore and mailbox, respectively).'
  merge: -1
