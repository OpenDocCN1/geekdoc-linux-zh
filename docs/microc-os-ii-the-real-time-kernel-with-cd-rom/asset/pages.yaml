  md: '# 1.07 Example #1


    The first example is found in \SOFTWARE\uCOS-II\EX1_x86L and basically consists
    of 13 tasks (including μC/OS-II''s idle task; μC/OS-II creates two ''internal''
    tasks; the idle task and a task that determines CPU usage. Example #1 creates
    11 other tasks. The **TaskStart ()** is created by **main ()** and its function
    is to create the other tasks and display the following statistics on the screen:


    +   1) the number of task switches in one,

    2) the CPU usage in %,

    3) the number of context switches,

    4) the current date and time,

    5) μC/OS-II''s version.


    The **TaskStart ()** task also checks to see if you pressed the ESCAPE key indicating
    your desire to exit the example and return to DOS.


    The other 10 tasks are based on the same code, i.e. the function **Task ()**.
    Each of the 10 tasks displays a number (each task has its own number from 0 to
    9) at random locations on the screen.


