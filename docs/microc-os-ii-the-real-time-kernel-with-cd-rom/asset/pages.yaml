    \ is suspended and the ISR takes control of the CPU. The ISR may make one or more\
    \ tasks ready to run by signaling one or more events. In this case, before returning\
    \ to the ISR, μC/OS-II determines if the interrupted task is still the highest\
    \ priority task to run. If a higher priority task is made ready to run by the\
    \ ISR then the next highest priority task is resumed. The interrupted task is\
    \ resumed.\n\nWhen all tasks are waiting for events or to expire then μC/OS-II\
    \ executes the idle task, OSTTaskIdle ().\n\n# 3.03 Task Control Blocks (OS_TCBs)\n\
    \nWhen a task is created, it is assigned a Task Control Block. OS_TCB (see List\
    \ 3.3). A control block is a data structure that is used by μC/OS-II to maintain\
    \ the state of a task when it is preempted. When the task regains control of the\
    \ CPU the control block allows the task to resume execution where it left off.\
