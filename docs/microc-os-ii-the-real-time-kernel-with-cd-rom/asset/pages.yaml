    # Figure 4-1, Fragmentation.


    uC/OS-II supports processors that have stacks that grow from either high memory
    to memory or from low high memory. When you either OSTTaskCreate () or OSTTaskCreateExt
    (), you must know how the stack grows because you need to pass the task''s top-of-stack
    to the task creation function. When OS_STK_GROWTH is set to 0 in OS_CPU .H you
    need to pass the lowest memory location of the stack to the task create function
    as shown in listing 4.7.'
