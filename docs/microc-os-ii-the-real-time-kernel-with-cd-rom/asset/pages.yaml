  md: "# Chapter 2\n\n# # Real-Time Systems Concepts\n\nReal-time systems are characterized\
    \ by the fact that severe consequences will result if logical or timing correctness\
    \ properties of the system are not met. There are two types of real-time systems:\
    \ SOFT and HARD. In SOFT real-time system, tasks are performed by the system as\
    \ as as possible, but the tasks don't have to finish by specific times. In HARD\
    \ real-time systems, tasks have to be performed not only correctly but on time.\
    \ Most real-time systems have a combination of SOFT and HARD requirements. Real-time\
    \ applications cover a wide range. Most applications for real-time systems are\
    \ embedded. This means that the computer is built into a system and is not seen\
    \ by the user as being a computer. Examples of embedded systems are:\n\nProcess\
    \ control:\n\n+   - Food processing\n  - Chemical plants\n\nAutomotive:\n\n+ \
    \  - Engine controls\n  - Anti-lock braking systems\n\nOffice automation:\n\n\
    +   - FAX machines\n  - Copiers\n\nComputer peripherals:\n\n+   - Printers\n \
    \ - Terminals\n  - Scanners\n  - Modems\n\nRobots\n\nAerospace:\n\n+   - Flight\
    \ management\n  - Weapons systems\n  - Jet engine controls\n\nDomestic:\n\n+ \
    \  - Microwave ovens\n  - Dishwashers\n  - Washing machines\n  - Thermostats\n\
    \nReal-time software applications are typically more difficult to design than\
    \ non-real-time applications. This chapter describes real-time concepts.\n\n#\
    \ ## 2.0 Foreground/Background Systems\n\nSmall systems of low complexity are\
    \ generally designed as shown in Figure 2-1. These systems are called foreground/background\
    \ or super-loops. An application consists of an infinite loop that calls modules\
    \ (that, functions) to perform the desired operations (background). Interrupt\
    \ Service Routines (ISRs) handle asynchronous events (foreground). Foreground\
    \ is also called interrupt level while background is called task level. Critical\
    \ operations must be performed by the ISRs to ensure that they are dealt with\
    \ in a timely fashion. Because of this,"
