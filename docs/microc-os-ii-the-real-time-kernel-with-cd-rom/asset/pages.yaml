    \ the status of a semaphore.\n\n# # 6.6 Message Mailboxes\n\nA mailbox (or simply\
    \ a mailbox) is a µOS-II object that allows a task or an ISR to send a pointer\
    \ size to another task. The pointer would typically be initialized to some application\
    \ specific data structure containing a 'message'. To enable µOS-II mailbox services,\
    \ you must set the configuration constant OS_MBOX_EN to I (see file OS_CRG.H).\n\
    \nA mailbox needs to be created before it can be used. Creating a mailbox is accomplished\
    \ by calling OSMCreate (next section) and specifying the initial value of the\
    \ pointer. Typically, the initial value is a NULL pointer but a mailbox can initially\
    \ contain a message. If you use the mailbox to signal the occurrence of an event\
    \ (i.e. a message) you would typically initialize it to a NULL pointer because\
    \ the event (most likely) would not have occurred. If you use the mailbox to access\
    \ a shared resource you would typically initialize the mailbox with a NULL pointer.\
    \ In particular you would use the mailbox as a binary semaphore.\n\nµOS-II provides\
    \ five services to mailboxes: OSMCreate(), OSMboxPend(), OSMboxPost(), OSMboxAccept(),\
    \ and OSMboxQuery(). Figure 6-6 shows a flow diagram to illustrate the relationship\
    \ between tasks, ISRs and a mailbox. Note that the symbol used to represent a\
    \ mailbox is an I-beam. The content of the mailbox is a pointer to a message.\
    \ What the pointer points to is application specific. A mailbox can contain only\
    \ one pointer (mailbox is full) or a pointer to NULL (mailbox is empty). As you\
    \ can see from figure 6-6, a task or an ISR can call OSMboxPost(). However, only\
    \ tasks are allowed to call OSMboxPend() and OSMboxQuery()."
