  md: '# OSQQuery()


    | File | Called from | Code enabled by |

    |---|---|--|

    | OS_Q_C | Task or ISR | OS_MBOX_EN |


    OSQQuery() is used to obtain information about a message queue. Your application
    must allocate an OS_DATA data structure which will be used to receive data from
    the event control block of the message queue. OSQQuery allows you to determine
    whether any task is waiting for message(s) at the queue, how many tasks are waiting
    (by counting the number of 1s in .OSEventTbl[] field, how many messages are in
    the queue, what the message queue size is, and examine the contents of the next
    message that would be returned if there is at least one message in a queue. You
    can use the table OSbitTbl[] to find out how many are set in a given byte. Note
    that .OSEventTbl[] is established by the #define constant OS_EVENT_TBL_SIZE (see
    uCOS_II.H).


    # Arguments


    pevent is a pointer to the message queue. This pointer is returned to you when
    the queue is created (see OSCreate ).


    pdata is a pointer to a data type OS_Q_DATA which contains the following fields.


    ```

    void *OSMsg;               /* Next message if available */

    INT16 OSMsgs;               /* Number of messages in the queue */

    INT16 OSSize;               /* Size of the message queue */

    INT8U OSEventTbl[OS_EVENT_TBL_SIZE]; /* Message queue wait list */

    INT8U OSEventGrp;           */

    ```


    # Returned Value


    OSQQuery() returns one of these two error codes:


    +   1) OS_NO_ERR, if the call was successful

    2) OS_ERR_EVENT_TYPE, if you didn''t pass a pointer to a message queue


    # Notes/Warnings


    Message queues must be created before they are used.


    # Example


    In this example, we check the contents of the message queue to see how many tasks
    are waiting for it.'
