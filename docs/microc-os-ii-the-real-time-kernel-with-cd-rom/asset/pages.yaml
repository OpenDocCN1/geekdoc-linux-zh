    # Listing 1.2, Defining global macros.


    Each variable that needs to be declared global will be prefixed with **xxx_EXT**
    in the .H file. ''xxx'' represents a prefix identifying the module name. The module''s
    .C file will contain the following declaration:


    ```

    #define xxx_GLOBALS

    #include "includes.h"

    ```


    When the compiler processes .C file it forces **xxx_EXT** (found in the corresponding
    H file) to ''nothing'' (because **XXX_GLOBALS** is defined and thus each global
    variable will be allocated storage space. When the compiler processes the other
    .C files, **xxx_GLOBALS** will not be defined and thus **xxx_EXT** will be set
    to **extern**, allowing you to reference the global variable. To illustrate the
    concept, let''s look at **uCOS_II.H** which contains the following declarations:


    ```

    #ifdef OS_GLOBALS

