    # 2.19 Mutual Exclusion


    The easiest way for tasks to communicate with each other is through shared data
    structures. This is especially easy when all the tasks exist in a single address
    space. Tasks can refer global variables, pointers, buffers, linked lists, ring
    buffers, etc. While sharing data simplifies the exchange of information, you must
    ensure that each task has exclusive access to the shared data to avoid contention
    and corruption. The most common methods to obtain exclusive access to shared resources
    are:


    +   - a) Disabling interrupts

    - b) Test-And-Set

    - c) Disabling scheduling

    - d) Using semaphores


    # 2.19.01 Mutual Exclusion, Disabling and enabling interrupts


    The easiest and fastest way to gain exclusive access to a shared resource is by
    disabling and enabling interrupts as shown in the pseudo-code of listing 2.3.


    ```

    Disable interrupts;

    Access the resource (read/write/from/to variables);

    Reenable interrupts;

    ```


