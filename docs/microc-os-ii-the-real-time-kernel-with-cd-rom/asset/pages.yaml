  md: "# 3.10 Clock Tick\n\nµC/OS-II requires that you provide a periodic time source\
    \ to keep track of it delays and timeouts. A tick should occur between 10 and\
    \ 100 times per second, or Hertz. The faster the tick rate, the higher the overhead\
    \ imposed on the system. The actual frequency of the clock tick depends on the\
    \ desired tick resolution of your application. You can obtain a tick source by\
    \ either dedicating a hardware timer, or generating an interrupt from an AC power\
    \ line (50/60 Hz) signal.\n\nYou MUST enable ticker interrupts AFTER multitasking\
    \ has started, i.c. after calling OSStart(). In other words, you should initialize\
    \ and tick interrupts in the first task that executes following a call to OSStart().\
    \ A common mistake is to enable ticker interrupts before calling OSInit() and\
    \ OSStart() as shown in listing 3.18.\n\n```\nvoid main(void)\n{\n    OSInit();\
    \                          /* Initialize µC/OS-II */\n    /* Application initialization\
    \ code ... */\n    /* ... Create at least on task by calling OSTaskCreate() */\n\
    \n    Enable TICKER interrupts; /* DO NOT DO NOT THIS HERE!! */\n\n    OSStart();\
    \                          /* Start multitasking */\n}\n```\n\nListing 3.18, Incorrect\
    \ way to start the ticker.\n\nWhat could happen (and it has happened) is that\
    \ the tick interrupt could be serviced before µC/OS-II starts the first task.\
    \ At this point, µC/OS-II is in an unknown state and will cause your application\
    \ to crash.\n\nµC/OS-II's clock tick is serviced by calling OSTimeTick() from\
    \ a tick ISR. The tick ISR follows all the rules described in the previous section.\
    \ The pseudo code for tick ISR is shown in listing 3.19. This code must be written\
    \ in assembly language because you cannot access CPU registers directly from C."
  merge: -1
