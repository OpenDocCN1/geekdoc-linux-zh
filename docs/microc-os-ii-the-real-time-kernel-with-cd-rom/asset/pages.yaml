  md: '# Listing 6.27. Obtaining the status of a queue.


    # 6.07.08 Using a message queue when reading analog inputs


    It is useful in control applications to read analog inputs at a regular interval.
    To accomplish this, you can create a task and call OSTimeDly() (see section 5.00,
    OSTimeDly()) and specify the desired sampling period. As shown in 6-11, you would
    use a message queue instead and have your task pend on the queue with a timeout.
    The timeout corresponds to the desired sampling period. If no other task sends
    a message to the queue, the task will be resumed after the specified timeout which
    basically emulate the OSTimeDly() function.


    You are probably wondering why I decided to use a queue when OSTimeDly() does
    the trick just fine. By adding a queue, you can have other tasks abort the wait
    by sending a message forcing an immediate conversion. If you add some latency
    to your messages, you can tell the ADC task to convert a specific channel, tell
    the task to increase the sampling rate, and more. In other words, you can say
    to the task: "Can you convert analog input #3 for me now?" After servicing the
    message, the task would initiate the pend on the queue which would restart the
    scanning process.


    ![](img/114817931de46def85b7b339e903e24f_165_0.png)


    Figure 6-11. Reading analog inputs.


    # 6.07.09 Using a queue as a counting semaphore


    A queue can be used as a counting semaphore by initializing and loading a queue
    with many non-NULL pointer (void *) works well as there are resources available.
    A task requesting ''semaphore'' would call OSPend() and release the ''semaphore''
    by calling OSPost(). Listing 6.28 shows how this works. You use this technique
    to save code space if you only needed counting semaphores and message queues (you
    would have no need for semaphore services). In this case, you could set OS_SEM_EN
    to 0 and only use queues instead of both semaphores. You should note that this
    technique consumes a pointer size for each resource that the semaphore is guarding
    as well as requiring a queue control block. In other words, you would be sacrificing
    RAM space in order to save code space. Also, message queues are slower than semaphore
    services. This technique would be very inefficient if your counting semaphore
    (in this case a queue) is guarding a large amount of resources (you would require
    a large array of pointers).


