    \ that will have a higher priority than the current task. In this case, a context\
    \ switch will occur.\n\n# OSTaskCreate ()\n\nMinimum assumes that OSTaskCreate\
    \ () will not create a higher priority task and thus no context switch is involved.\n\
    \ assumes that OSTaskCreate () is creating a higher priority task and thus a context\
    \ switch will result.\nIn both cases, the execution times assumed that OSTaskCreateHook\
    \ () didn't do anything.\n\n# OSTCreateExt ()\n\nMinimum assumes that createTaskExt\
    \ () will not to initialize the stack with zeros in order to do stack checking.\n\
    \ assumes that createTaskExt () greatly depends on the number of elements to initialize.\
    \ I determined that it takes 100 clock cycles (3 µS) to clear each element. A\
    \ 1000 byte stack would require: 1000 bytes divided by 2 bytes (16-bit wide stack)\
    \ 3 µS per element, or 1500 µS. Note that interrupts are enabled while the stack\
    \ is cleared to allow your application to respond to interrupts.\nIn both cases,\
    \ the execution times assumed that createTaskExtHook () didn't do anything.\n\n\
    # OSTDel ()\n\nMinimum assumes that the task being deleted is not the current\
    \ task."
