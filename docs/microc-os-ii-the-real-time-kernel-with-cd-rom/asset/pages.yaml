  md: '# Intended Audience


    This book is intended for embedded system programmers, consultants and students
    interested in real-time operating systems. μC/OS-II is a high performance, deterministic
    real-time kernel and can be embedded in commercial products (Appendix F, Licensing).
    Instead of writing your own kernel, you should consider μC/OS-II. You will find,
    as I did, that writing a kernel is not as easy as it first thinks.


    I''m assuming you know C and have a minimum knowledge of assembly language. You
    should also understand microprocessor architectures.


    # What you need to use μC/OS-II


    The code supplied with this book assumes that you will need an IBM-PC/AT or compatible
    (80386 Minimum) computer running under DOS 4.x or higher. The code was compiled
    with Borland International''s C++ V3.1. You should have about 5 MBytes of free
    disk space on your hard drive. I actually compiled and executed the sample code
    provided in this book under Windows 9.


    To use μC/OS-II on a different target (a PC), you will need to port μC/OS-II to
    that processor yourself, or deinit one from μC/OS-II official web site at http://www.ucos-ii.com.
    You will also need appropriate development tools such as an ANSI compiler, an
    assembler, linker/locator and some way of debugging your application.


    # The μC/OS story


    Many years ago, I designed a product based on an Intel 80188 Dynaco Controls I
    needed a real-time kernel. At my previous employer, I had been using a well known
    kernel (let''s call it ''A'') but it turned out to be expensive for the application
    I was designing. We found a low cost kernel (kernel ''B'') at the time and started
    out with design. With this cost kernel, kernel ''B'', we spent about two months
    trying to get a couple of very simple tasks to run. We were calling the vendor
    almost a daily basis to get help making this work. The vendor claimed that we
    had to rewrite every single object using assembly language code. Although the
    vendor was very patient, we decided that we had enough of this low cost. Our product
    was falling behind schedule and we really didn''t want to spend time debugging
    this kernel. It turned out we were one of the vendor''s first customers and the
    kernel was not fully tested and debugged!


    To get back on track, we decided to go back and use kernel ''A''. The cost was
    $5000 for development seat and we had to pay a usage fee of $200 for each unit
    we shipped! This was a lot of money, at the time, but it bought us some peace
    of mind. The kernel got up and running in 2 days! Three months into the project,
    one of our engineers debugged what looked like a bug in the kernel. We sent the
    code to the vendor and sure the bug was confirmed in the kernel. The vendor provided
    a 90 day warranty, but that had expired, in order to get support, we had to pay
    another $500 per year for ''maintenance''. We argued with the salesperson for
    a few months that they should fix the bug we were actually doing them. They wouldn''t!
    Finally, we bought the maintenance contract and the vendor fixed the bug six months
    later! Yes, six months later. We were furious but most importantly, delivering
    our product. In all, it took close to a year to get our product to work reliably
    with kernel ''A''. I must admit, that we never had any problems with it.


    As this was going, I naively thought, "Well, it can''t be difficult to write a
    kernel. All it needs to do is save and restore processor registers". That''s when
    I decided to try it out and write my own (part at night and weekends). It took
    me about a year to get the kernel to be just good (and in some ways better) than
    kernel ''A''. I didn''t want to start a company and sell it because there were
    already about 50 kernels out there, why another'
