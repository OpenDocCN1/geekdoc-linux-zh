  md: '# # Introduction


    This book describes the design and implementation of µICOS-II (pronounced "Micro
    C O S 2") which stands for Micro-Controller Operating System Version 2. µICOS-II
    is based on µCOS The Real-Time Kernel which was first published in 1992. Thousands
    of people around the world are using µCOS in all kinds of applications such as
    cameras, medical instruments, musical instruments, engine controls, network adapters,
    highway telephone call boxes, ATMs, industrial robots, and many. Numerous colleges
    and Universities have also used µCOS to teach students about real-time systems.


    µCOS-II is upward compatible with µCOS (V.11) but provides many improvements over
    µCOS such as the addition of a fixed-size memory manager, userable controls on
    task creation, deletion, task switching and system ticks, supports TCB checking
    and more. I added comments to just every function and I made µICOS-II much easier
    to port to different processors. The source code in µCOS was found in two source
    files. Because µICOS-II contains many new features and functions, I decided to
    split µCOS in a few source files to make the code easier to maintain.


    If you currently have an application (i.e. product) that runs with µCOS, your
    application should be able to run, virtually unchanged, with µICOS-II. All of
    the services (i.e. function calls) provided by µCOS have been preserved. You may,
    however, have to change code and include product files by "point" to the new file
    names.


    This book contains ALL the source code for µICOS-II and a port for Intel 8086
    processor running in Real Mode and for Large Model. The code was developed on
    a PC running the Windows 9 operating system. Examples run in a DOS compatible
    box under the Windows 9 environment. Development was done using the Borland International
    C/C++ compiler version 3.1. Although µCOS-II was developed and tested on a PC,
    µICOS-II was also targeted for embedded systems and can be ported to many different
    processor architectures.


    # ## µCOS-II features:


    Source Code:


    As I mentioned, previously this book contains ALL the source code for µICOS-II.
    I went through a lot of efforts to provide you with a high quality ''product''.
    You may not agree with the style of constructs that I use but you agree that the
    code is both clean and verify. Many commercial real-time kernels are provided
    in source form. I struggled to find any source code that is as neat, well commented
    and organized as µCOS-II. Also, I believe that giving you the source code is not
    enough. You need to know how the code works and how the different pieces fit together.
    You will find this type of information in this book. The organization of a real-time
    kernel is not always apparent by starting at source files and thousands of lines
    of code.


    Portable:


    Most of µCOS-II is written in highly portable ANSI C, with target microprocessor
    specific code written in assembly language. Assembly language is kept to a minimum
    to make µICOS-II easy to port to other processors. Like µCOS, µICOS-II can be
    ported to a large number of microprocessors as the microprocessor provides a stack
    pointer and the CPU registers can be pushed into and popped from the stack. Also,
    the C compiler should provide in-line assembly or language extensions that allow
    you to enable and disable interrupts from C. µICOS-II can run on 8-bit, 16-bit,
    32-bit or even 64-bit microprocessors or micro-controllers, and DSPs.'
  merge: -1
  pgno: 5
- img_proc: true
  md: 'All the ports that currently exist for μC/OS can be easily converted to μC/OS-II
    in about an hour. Also, because

    μC/OS-II is upward compatible with μC/OS, your μC/OS applications should run on
    μC/OS-II with few or no

    changes. Check for the availability of ports on the μC/OS-II Web site at ''www.uCOS-II.com''.


    # ROMable:


    μC/OS-II was designed for embedded applications. This means if you have the proper
    tool chain (i.e. C

    compiler, assembler and linker/locator), you can embed μC/OS-II as part of a product.


    # Scalable:


    I designed μC/OS-II so that you can use only the services that you need in your
    application. This means that a

    product can have just a few of μC/OS-II''s services while another product can
    have the full set of features. This

    allows you to reduce the amount of memory (both RAM and ROM) needed by μC/OS-II
    on a product per product

    basis. Scalability is accomplished with the use of conditional compilation. You
    simply specify #define

    constants which features you need for your application/product. I did everything
    I could to reduce both the code

    and space required by μC/OS-II.'
  merge: -1
