    # ## 1.07.03 TaskInit, TaskN()


    **StatInit** returns back to **TaskStart ()** and we can create 10 identical tasks
    (all running the same code) L1.8(5). **TaskStart ()** will create all the tasks
    and no context switch will occur because **TaskStart ()** has a priority of 0
    (i.e the highest priority). When all the tasks are created, **TaskStart ()** enters
    the infinite loop portion of the task and continues displays statistics on the
    screen, check if the ESCAPE key was pressed and then delay for one second before
    starting the loop again. If you press the escape key, **TaskStart ()** calls **PC_DOSReturn
    ()** and we gracefully return back to the DOS prompt.


    The task is shown in listing 1.10. When the task gets execute, it tries to acquire
    a semaphore L1.10(1) so that we can call the Borland (C/++) library function **random
    ()** L1.10(2). I assumed here that the function is non-reentrant, so each of the
    10 tasks must have exclusive access to this code in order release the semaphore
    when both X and Y coordinates are obtained L1.10(3). The task displays a number
    (between ''0'' and ''9'') which is passed to the task when it is created L1.10(4).
    Finally, each task delays itself for one tick L1.10(5) and thus, each task will
    execute 200 times per second! With the 10 task this means that μC/OS-II will context
    switch between tasks 200 times per second.'
