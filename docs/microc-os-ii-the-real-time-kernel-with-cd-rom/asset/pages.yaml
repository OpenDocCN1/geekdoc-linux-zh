  md: "is to avoid an unnecessary context switch L3.8(3). Note that µC/OS used to\
    \ obtain OSTCBHighReady and compared it with OSTBC. On 8 and 16-bit processors,\
    \ this operation was relatively slow because comparison was made on processors\
    \ instead of 8-bit integers as we now do in µC/OS-II. Also, there is no point\
    \ of looking up OSTCBHighReady in OSTCBrioTab[] unless we actually need to do\
    \ a context switch. The combination of 8-bit values instead of processors and\
    \ looking up OSTCBHighReady only when needed would make µC/OS faster after µC/OS\
    \ on 8 and 16-bit processors.\n\n```\nvoid OSSched(void) {\n    INT8 y;\n\n  \
    \  OS_ENTER_CRITICAL();\n    if ((OSLocking | OSIntesting) == 0) {\n        y\
    \ = OSNumMapTab[OSrdyGrp];\n        OSrioHighReady = (INT8U) (y << 3) + OSNumMapTab[OSrdyTab[y]];\n\
    \        if (OSrioHighReady == OSPriority()) {\n            OSTCBHighReady = OSTCBrioTab[OSrioHighReady];\n\
    \            OSCtxSwCtr++;\n            OS_TASK_SW();\n        }\n    }\n    OS_EXIT_CRITICAL();\n\
    ```\n\n# Listing 3.8, Task Scheduler\n\nTo prevent a context switch, we need to\
    \ obtain OSTCBHighReady for the task of being suspended, whose index is done using\
    \ OSTCBrioTab[] using OSrioHighReady L3.8(4). Next, the statistic counter OSCtxSwCtr\
    \ is incremented to keep track of the number of context switches L3.8(5). Finally,\
    \ the macro OS_TASK_SW() is invoked to do the actual context switch L3.8(6).\n\
    \nA context switch simply consists of saving the processor registers on the stack\
    \ of the task being suspended and restoring the registers of the higher-priority\
    \ task from its stack. In µC/OS-II, the stack frame is ready for the task if an\
    \ interrupt has occurred and all processor registers are saved onto it. In other\
    \ words, all that µC/OS-II has to do to run a task is restore registers from the\
    \ task's stack and execute a return from interrupt. To context switch, we implement\
    \ OS_TASK_SW() so that you initiate an interrupt. The interrupt service routine\
    \ (ISR) or handler (called the 'exception handler') MUST be in the assembly language\
    \ OSCtxSw(). OSCtxSw() expects to have OSrioHighReady to point to the OS_TCB of\
    \ the task to switch in and OSTCBur to point to the OS_TCB of the task being suspended.\
    \ Refer to chapter 8, Porting µC/OS-II for additional details on OSCtxSw().\n\n\
    All of the code in OSSched() is a critical section. Interrupts are delayed by\
    \ preventing ISRs from setting the ready bit of one or more tasks during the process\
    \ of finding the highest priority task to run. OSSched() could be written entirely\
    \ in assembly language to reduce scheduling time. OSSched() was written in C for\
    \ readability, and portability to minimize language.\n\n# 3.06 Locking and Unlocking\
    \ the Scheduler\n\nThe OSSchedLock() function is used to prevent scheduling until\
