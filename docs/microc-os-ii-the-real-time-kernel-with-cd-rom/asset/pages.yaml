  md: 'The files .C and .H (in the \ \SOFTWARE\BLOCKS\SOURCE directory) contain PC
    compatible services that I used throughout the examples. Unlike the first version
    of µC/OS-II (i.e. µC/OS), I decided to encapsulate these functions (as they should
    have been) to avoid redefining them in every example and also, to allow you to
    easily adapt the code to a different compiler. .C basically contains three types
    of services: character based display, elapsed time measurement, and miscellaneous.
    All functions start with the prefix PC_


    # 1.05.01 PC Based Services, Character Based Display


    The display functions perform direct to video RAM for performance reasons. On
    a VGA monitor, video memory starts at absolute memory location 0x0000BB00 (or
    using a segment/offset notation, B800:0000). You can use this code on a monochrome
    monitor by changing the #define constant DISP_BASE from 0xB8000 to 0xB8000.


    The display functions in .C are used to write ASCII (and special) characters on
    the screen using X and Y coordinates. A PC C display can hold up to 2000 characters
    as 25 rows (i.e. Y) by 80 columns (i.e. X). Each character requires two bytes
    to display. The first byte is the character that you want to display while the
    second byte is an attribute that determines the foreground/background color the
    background color is specified in bits 4 to 6. Finally, the most-significant bit
    determines whether the character will blink (when 1) or not (when 0). You should
    use the #define constants declared in PC, C (FGND foreground and BGND is background).
    .C contains the following functions:


    +   - PC_DispClrScr () To clear the screen

    - PC_DispClrLine () To clear a single row (or line)

    - PC_DispChar () To display a single ASCII character anywhere on the screen


    +   - PC_DispStr () To display an ASCII string anywhere on the screen'
