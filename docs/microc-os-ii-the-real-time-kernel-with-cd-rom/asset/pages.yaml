- img_proc: true
  md: 'Maximum assumes that the task being deleted is the current task. In this case,
    a context switch will occur.


    # OSTTaskDelReq() :

    Both minimum and maximum assume that the call will return indication that the
    task is deleted. This function is so short that it doesn''t make difference anyway.


    # OSTTaskResume() :

    Minimum assumes that a task is being resumed but this task has a lower priority
    than the current task. In this case, a context switch will not occur.

    Maximum assumes that the task being resumed will be ready-to-run and will have
    a higher priority than the current task. In this case, a context switch will occur.


    # OSTTaskStkChk() :

    Minimum assumes that OSTTaskStkChk() is checking a ''full'' stack. Obviously,
    this is hardly possible since the task being checked most likely have crashed.
    However, does this establish the absolute minimum execution time, however unlikely.

    Maximum assumes that OSTTaskStkChk() is checking a ''full'' stack but you need
    to add the amount of time it takes to check each ''zero'' stack element. I was
    able to determine that each element takes 80 clock cycles (2.4 µS) to check. A
    1000 byte stack would thus require: 1000 bytes divided by 2 bytes/element (16-bit
    wide stack) 2.4 µS per element, or 1200 µS. Total execution time would be 1218
    µS. Note that interrupts are enabled while the stack is being checked.


    # OSTTaskSuspend() :

    Minimum assumes that the task being suspended is not the current task.

    Maximum assumes that the task being suspended and a context switch will occur.'
  merge: -1
  pgno: 225
- img_proc: true
  md: '# OSTaskQuery ()


    Minimum and maximum are the same and it is assumed that all the options are included
    so that an OS_TCB contains all the fields. In this case, OS_TCB for the large
    model port requires 45 bytes.


    # OSTimeDly ()


    Both the minimum and maximum assume that the time delay will be greater than 0
    tick. In this case, a context switch always occur.\Minimum is the case where the
    bit in OSRdyGrp doesn''t need to be cleared.


    # OSTimeHSM ()


    Both the minimum and maximum assume that the time delay will be greater than 0.
    In this case, a context switch will occur. Furthermore, the time specified must
    result in a delay of less than 65536 ticks. In other words, if a tick interrupt
    occurs every 10 ms (100 Hz) then the maximum value that you can specify is 10
    minutes, 55 seconds and 350 ms in order for the execution times to be valid. Obviously,
    you can specify longer delays using this function call.


    # OSTimeDlyResume ()


    Minimum assumes that the delayed task is made ready to run, but this task has
    a lower priority than the current task. In this case, µ/OS-II will not perform
    a context switch.\Maximum assumes that the delayed task is made ready to run and
    this task has a higher priority than the current task. This, of course, results
    in a context switch.


    # OSTimeTick ()


    This function is almost identical to OSTickISR() except that OSTickISR() accounted
    for OSIntEnter () and OSIntExit (). I assumed that your application can have the
    maximum number of tasks allowed by µ/OS-II (64 tasks total).\Minimum assumes that
    none of the 64 tasks are either waiting for time to expire or for a timeout on
    an event.\Maximum assumed that ALL 63 tasks (the idle task is never waiting) are
    waiting for time to expire. 600 µS may seem a lot of time but, if you consider
    that all the tasks are waiting for time to expire then the CPU has nothing else
    to do anyway! On average, though, you can assume that OSTimeTick () would take
    about 450 µS (ie. 4.5% overhead if your tick interrupts occurs every 10 ms).'
