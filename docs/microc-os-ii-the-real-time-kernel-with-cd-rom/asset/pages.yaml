  md: 'μC/OS-II like all real-time kernels needs to disable interrupts in order to
    access critical sections of code, and whenever. This allows μC/OS-II to protect
    critical code from being entered simultaneously by multiple tasks or Interrupt
    Service Routines (ISRs). The interrupt disable time is one of the most important
    specification that a real-time kernel vendor provides; because it affects the
    responsiveness of your system to real-time events μC/OS-II tries to keep the interrupt
    disable time to a minimum which is highly dependent on the processor architecture,
    and the quality of the code generated by the compiler. Every processor provides
    instructions to enable interrupts and your compiler must have a mechanism to perform
    these operations directly from C. Some compilers will allow you to insert in-line
    language statements in your source code. This makes it easy to insert processor
    instructions to enable and disable interrupts. Other compilers will actually contain
    language extensions to enable and disable interrupts directly from C. To hide
    the implementation method μC/OS-II defines two macros to disable and enable interrupts:
    OS_ENTER_CRITICAL() and OS_EXIT_CRITICAL(), respectively LI(1,3).


    μC/OS-II s critical sections are wrapped with OS_ENTER_CRITICAL() and OS_EXIT_CRITICAL()
    as shown below:


    ```

    μC/OS-II Service Function {

    OS_ENTER_CRITICAL();

    /* μC/OS-II critical code section */

    OS_EXIT_CRITICAL();}

    ```


    # Method #1:


    The first and simplest way to implement these two macros is to invoke the processor
    instruction to disable interrupts for OS_ENTER_CRITICAL(). However, there is a
    problem with this scenario. If you called the μC/OS-II function with interrupts
    disabled, then return from μC/OS-II, interrupts would be enabled? If you had disabled
    interrupts, you might have wanted them to be disabled upon return from the μC/OS-II
    function. In this case, the example would not be adequate.


    # Method #2:


    The second way to implement OS_ENTER_CRITICAL() is to save the interrupt disable
    status on the stack and then, disable interrupts. OS_EXIT_CRITICAL() would simply
    be by restoring the interrupt status from the stack. Using this scheme, if you
    called a μC/OS-II service with either enabled or disabled then, the status would
    be preserved across the call. If you call a μC/OS-II service with interrupts disabled
    you are potentially increasing the latency of your application. Your application
    can use OS_ENTER_CRITICAL() and OS_EXIT_CRITICAL() to protect critical sections
    of code. Be careful, because your application will “crash” if you had disabled
    interrupts before calling a service as Ostibly(). This will cause the stack to
    be suspended until time expires, because interrupts are disabled, you would never
    serve the tick! Obviously, all PEND are also subject to this problem, be careful.
    As a general rule, you should call μC/OS-II services with interrupts enabled!


    The question is this, which one is better? Well, that all depends on what you
    are willing to sacrifice. If you do not care in your application whether interrupts
    are enabled after calling a μC/OS-II service, you should opt for the first method
    of performance. If you want to preserve the interrupt disable status across μC/OS-II
    service calls then obviously the second method is for you.


    Just to give you an example, disabling interrupts on an Intel 8086 is done by
    executing the CLI instruction. You can then implement the macros as follows:


    ```

    #define OS_ENTER_CRITICAL()   asm CLI

    ```'
