  md: '# Listing 3.11, Initializing the static task.


    Because I wanted to manage when main() calls OSStart() (i.e. TaskStart()), μC/OS-II
    has three tasks to manage when OSStart() : TaskStart(), OSTaskIdle() and OSTaskStat().
    Please note that you don''t have to call the startup TaskStart() — you can call
    anything you like. Your startup will have the highest priority because μC/OS-II
    sets the priority of the idle task to OS_LOWEST_PRIO and the priority of the static
    task to OS_LOWEST_PRIO - 1.


    Figure 3-4 illustrates the flow of execution when initializing the static task.
    The first function that you call in μC/OS-II is OSInit() will call μC/OS F3-4(2).
    Next, you need to install the interrupt vector that will be used to perform context
    switches on some processors (specifically the Motorola 68HC11), there is no need
    to ''install'' the vector that is already resident in ROM. You may create TaskStart()
    by calling either TaskCreate() or TaskCreateExt() F3-4(3). Once you are ready
    to multitask, you call OSStart() which will schedule TaskStart() for execution
    it has the highest priority F3-4(4).


    | Highest Priority | OS_LOWEST_PRIO - 1 | OS_LOWEST_PRIO |

    | --- | --- | --- |

    | TaskStart() | | OSTaskIdle() |

    | OSInit(); | | |

    | Install context switch; (2) | | |

    | CreateTaskStart(); (3) | | |

