  md: "Once all conditions are satisfied, the OS_TCB is removed from all possible\
    \ mC/OS data structures.\nOSTaskDel does this to prevent interrupt latency. First,\
    \ if the task is in the ready list, it is removed\nL.11(6). We then check to see\
    \ if the task is in a list waiting for a mailbox, a queue or a semaphore and if\
    \ so, the\ntask is removed from that list L.11(7). Next, we force the count to\
    \ zero to make sure that the ISR will\nnot delay this task we reenable interrupts\
    \ L.11(8). Finally, we set the task's .OST_STAT flag to\nOS_STAT_READY. By not\
    \ making the task ready, we are preventing another task or an\nISR from preempting\
    \ this task (i.e. in the case of another ISR or called OSTaskResume (L.11(9)).\
    \ This\ncould occur because we will be re-enabling interrupts L.11(10) so an ISR\
    \ can make a higher priority task\nwhich could resume the task we are trying to\
    \ delete. Instead of setting the task's .OSTCBat flag to\nOS_STAT_READY, we use\
    \ OS_STAT_SUSPEND bit (which would have been clearer), but this\nsakes slightly\
    \ more processing time.\n\nAt this point, the task cannot be made ready by any\
    \ other task or an ISR, it's been removed\nfrom the ready list, waiting for an\
    \ event, or it's not waiting for time and cannot be resumed.\nIn other words the\
    \ task is DORMANT for all purposes and purposes. For this, I must prevent the\n\
    L.11(10) from switching to another task, because if the current task is deleted\
    \ it would not be able to be\nenabled. At this point, we re-enable interrupts\
    \ in order to reduce interrupt latency L.11(11). We will\ndouble such an service\
    \ but we increment OSLockingWest the interrupt we are trying to delete. The task\n\
    You should not be stuck with the deletion process because we need to unlock the\
    \ OS_TCB\nfrom the TCB chain and return the OS_TCB to the free OS_TCB.\n\nNote\
    \ I call a function Dummy() immediately after OS_ISR_CRITICAL()\nL.11(12). I do\
    \ this to make sure that the process will execute at least one instruction with\n\
    enabled. On many processors, executing an interrupt enable forces the CPU to have\
    \ interrupts\ndisabled until the next instruction. The Intel 8086 and Zilog Z-80\
    \ processors actually work like this, Enabling and immediately disabling interrupts\n\
    cause increase interrupt latency. Calling Dummy() ensures that I will execute\
    \ a call and return\ninstruction before re-enabling interrupts. You could replace\
    \ OSDummy() with a macro that executes a\n'no-operation' and thus reduce the execution\
    \ time of OSTaskDel(). I didn't think it was\nworth the effort of creating yet\
    \ another macro that would require quite.\n\nWe can now continue with the deletion\
