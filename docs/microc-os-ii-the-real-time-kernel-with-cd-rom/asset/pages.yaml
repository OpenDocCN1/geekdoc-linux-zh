    OSCBListL11(16). You should note that there is no need to check for the case where\
    \ ptcb->OSCBNext\n= 0 because cannot delete the idle task which has always be\
    \ at the end of the chain. The OS_TCB\nis returned to the free list of OS_TCBs\
    \ to allow another task to be created L.11(17). Last, but not least, the\nL.11(18)\
    \ is called to see if a higher priority task has been made to run by an ISR that\
    \ has occurred\nwhen we re-enabled interrupts at step L.11(11).\n\n```\nINTU OSTaskDel(INTU\
    \ pri)\n{\n\tOS_TCB *ptcb;\n\tOS_EVENT *event;\n\n\tif (pri == OS_IDLE_PRI) {\n\
    \t\treturn (OS_TASK_DEL_IDLE); (1)\n}\n\tif (pri >= OS_LOWEST_PRI && pri != OS_PRI_SELF)\
