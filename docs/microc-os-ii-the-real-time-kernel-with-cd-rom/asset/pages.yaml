  md: "# 3.12 Starting μC/OS-II\n\nYou start multitasking by calling OSStart(). Before\
    \ you start μC/OS-II, however, you MUST create at least one of your application\
    \ tasks as shown in listing 3.23.\n\n```\nvoid main (void)\n{\n    OSInit(); \
    \                   /* Initialize uC/OS-II */\n\n    Create at least 1 task using\
    \ either OTaskCreate() or OTaskCreateExt();\n\n    OSStart();                \
    \  /* Start multitasking! OSStart() will not return */\n}\n```\n\n# Listing 3.23,\
    \ Initializing and Starting μC/OS-II\n\nThe code for OSStart() is shown in listing\
    \ 3.24. When called, it finds the OS_TCB of the highest priority task that you\
    \ have created (done through the ready list) L3.24(1). Then OSStart() calls OSStartHighRdy()\
    \ L3.24(see OS_CPU.ASM) for the processor being. Basically, OSStartHighRdy() restores\
    \ the CPU registers by popping off the task's stack and executes a return from\
    \ interrupt instruction which forces the CPU to execute your task's code (Section\
    \ 9.04.01, OS_CPU.ASM, OSStartHighRdy() for details on how this is done for the\
    \ 80x86). You should note that OSStartHighRdy() will never return to OSStart().\n\
    \n```\nvoid OSStart (void)\n{\n    INT8U y;\n    INT8U x;\n\n    if (OSRunning\
    \ == FALSE) {\n        y = OSUnMapTbl[OSRdyGrp];\n        x = OSUnMapTbl[OSRdyTbl[y]];\n\
    \        OSPrioHighRdy = (INT8U) (y << 3) + x);\n        OSPrioCur = OSPrioHighRdy;\n\
    \        OSTCBrioRdy = OSTCBrioTbl[OSPrioHighRdy];  (1)\n        OSTBCBCur = OSTCBHighRdy;\n\
    \        OSStartHighRdy();  (2)\n}\n}\n```\n\n# Listing 3.24, Starting multitasking.\n\
    \nFigure 3-9 shows the contents of the values and data structures after multitasking\
    \ started. Here I assumed that the task you created has a priority of 6. You will\
    \ notice that OTaskCtr indicates that three tasks have been created, OSRunning\
    \ is TRUE indicating that multitasking has started, OSPrioCur and OSPrioHighRdy\
    \ contain the priority of your application task, OSTCBur and OSTCBHighRdy both\
    \ point to the OS_TCB of your task."
