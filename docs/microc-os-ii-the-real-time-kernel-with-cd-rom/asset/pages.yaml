    # Figure 4-2, Stack checking


    In order to use uC/OS-II''s stack checking facilities, you MUST do the following:


    +   1. Set **OS_TASK_CREATE_EXT** to 1 in OS_CFG.H.

    2. Create a task using **OstTaskCreate()** and give the task much space than you
    think it really needs.

    3. Set the opt argument in **OstTaskCreateExt** to OS_TASK_OPT_STK_CHK + OS_TASK_OPT_STK_CLR.
    If that your startup code clears RAM and you never delete tasks once they are
    created, you don''t need to set the OS_TASK_OPT_STK_CLR option. This will reduce
    the execution time of OstTaskCreate().

    4. Call **OSTTaskStchk()** by specifying the size of the task you desire to check.


    **OSTTaskStchk()** computes the amount of free space by ''walking'' from the bottom
    of the stack and counting the number of zero entries on the stack until a non-zero
    value is found F4-2(5). Note that stack entries are checked using the type of
    the stack (see **OS_STK** in **OS_CPU.H**). In other words, if a stack entry is
    32-bit wide then the comparison is done using 3 bytes. The amount of space used
    F4-2(8) is obtained by subtracting the number of zero value entries F4-2(6) from
    the stack size you specified in **OstTaskCreateExt()**. The function actually
    places the number of bytes free in a data structure of **OS_STK_DATA** (see **ucos_ii.h**).
    You should note that at any given time, the stack pointer for the task might be
    somewhere between the initial Top-Of-Stack (TOS) and the deepest stack growth
    F4-27. Also, every time you call **OSTTaskStchk()**, you may get a different value
    for the amount of free space on the stack until your task has reached its deepest
    growth F4-25.


    You need to run the application long enough until your worst case conditions happen
    proper numbers. **OSTTaskStchk()** provides you with the worst case stack usage,
    you can go back and set the final size of'
