    \ of ISR.\n\n```\nvoid OSIntExit (void)\n{\n    OS_ENTER_CRITICAL();\n    if (-OSIntNesting\
    \ == OSLocking == 0) {\n        OSIntExY = OSUnMapTbl[OSDRyGrp];\n        OSPriHighRdy\
    \ = (INTU) (OSIntExY << 3) + OSUnMapTbl[OSIntExY];\n        if (OSPriHighRdy ==\
