  md: '# OS_MAX_EVENTS


    OS_MAX_EVENTS specifies the maximum number of event control blocks that will be
    allocated. An event control block is needed for every message mailbox, message
    queue or semaphore object. For example, if you have 10 mailboxes, 5 queues and
    3 semaphores, you must set OS_MAX_EVENTS to at least 18. If you intend to use
    either mailboxes, queues and/or semaphores then you MUST set OS_MAX_EVENTS to
    at least 2.


    # OS_MAX_MEM_PART


    OS_MAX_MEM_PART specifies the maximum number of memory partitions that will be
    managed by the memory partition manager in OS_MEM.C. To use memory partition,
    however, you will also need to set OS_MEM_EN to 1. If you intend to use memory
    partitions then you MUST set OS_MAX_MEM_PART to at least 2.


    # OS_MAX_QS


    OS_MAX_QS specifies the maximum number of message queues that your application
    will create. To use message queue services, you will also need to set OS_Q_EN
    to 1. If you intend to use message queues then you MUST set OS_MAX_QS to at least
    2.


    # OS_MAX_TASKS


    OS_MAX_TASKS specifies the maximum number of application tasks that can exist
    in your application. Note that OS_MAX_TASKS cannot exceed 62 because uC/OS-II
    reserves tasks for itself (see OS_N_SYS_TASKS in uCOS_II.H). If you set OS_MAX_TASKS
    to the exact number of tasks in your system, you will need to make sure that you
    revise this value when you add additional tasks. Conversely, if you make OS_MAX_TASKS
    much higher than your current task requirements (for expansion), you will be wasting
    valuable RAM.


    # OS_LOWEST_PRIO'
  merge: -1
  pgno: 295
- img_proc: true
  md: 'OS_LOWEST_PRIO specifies the lowest task priority (i.e. highest number) that
    you intend to use in your application and is provided to you reduce the amount
    of RAM needed by μC/OS-II. Remember that μC/OS-II''s priorities can go from 0
    (highest priority) to a maximum of 63 (lowest priority). Setting OS_LOWEST_PRIO
    to a value less than 63 means that your application cannot create tasks with a
    priority number higher than OS_LOWEST_PRIO. In fact, μC/OS-II reserves priorities
    OS_LOWEST_PRIO and OS_LOWEST_PRIO – 1 for itself. Task of priority OS_LOWEST_PRIO
    – 2 is reserved for the idle task (OSTIdle()) while priority OS_LOWEST_PRIO –
    1 is reserved for the statistic task (OSTStat()). The priorities of your application
    tasks can take a value between 0 and OS_LOWEST_PRIO – 2 (inclusive). The lowest
    task priority specified by OS_LOWEST_PRIO is independent of OS_MAX_TASKS. For
    example, if you set OS_MAX_TASKS to 10 and OS_LOWEST_PRIO to 32. You can have
    up to 10 application tasks and each of those can have a priority value between
    0 and 30 (inclusive). Note that each task must still have a different priority
    value. YOU MUST set OS_LOWEST_PRIO to a higher value than the number of application
    tasks in your system. For example, if you set OS_MAX_TASKS to 20 and OS_LOWEST_PRIO
    to 10 then you will not be able to create more than 8 application tasks (0...).
    You will simply be wasting RAM.


    # OS_TASK_IDLE_STK_SIZE


    OS_TASK_IDLE_STK_SIZE specifies the size of μC/OS-II idle task. The size is specified
    not in bytes but number of elements. This is because a MUST must be declared to
    be of type OS_STK. The size of the idle stack depends on the processor you are
    using and the deepest anticipated interrupt nesting level. Very while being in
    the idle task, you should accommodate for enough space to store all processor
    registers on the stack.


    # OS_TASK_STAT_EN


    OS_TASK_STAT_EN specifies whether or not you will enable μC/OS-II''s statistics
    as well as its initialization function. When set to 1, the statistic task and
    the statistic task initialization function are enabled. The statistic task OSTStat()
    is used to compute the CPU usage of your application. When enabled, OSTStat()
    executes every second and computes the 8-bit variable OSCPUUsage which provides
    the percentage of CPU utilization of your application. OSTStat calls OSTStatHook()
    every time it executes so you can add your statistics as needed. See OS_CORE.C
    for details on the statistics task. The priority of OSTStat() is always OS_LOWEST_PRIO
    – 1.


    The global variables OSCPUUsage, OSIdleCtr, OSIdleCtr and OSStatRdy will not be
    declared when OS_TASK_STAT_EN is set to 0. This allows you to reduce the amount
    of RAM by μC/OS-II if you don''t intend to use the statistic task.'
  merge: -1
  pgno: 296
- img_proc: true
  md: '# OS_TASK_STAT_STK_SIZE


    OS_TASK_STAT_STK_SIZE specifies the size of μCOS-II''s statistics stack. The size
    is specified not in bytes but in number of elements. This is because a stack is
    declared as being of type OS_STK The size of the statistics stack depends on the
    processor you are using and the maximum of the following actions:


    +   1. The task growth associated with performing 32-bit arithmetic

    2. The task growth associated with calling OSimeDly ()

    3. The task growth associated with calling OSTaskStatHook ()

    4. The deepest anticipated nesting level


    If you want to run stack checking on this task and determine this task''s actual
    stack requirements, then you must enable code generation for OSTaskCreateExt()
    by setting OS_TASK_CREATE_EXT_EN to 1. Again, the priority of OSTaskStat () is
    always set to OS_LOWEST_PRIO - 1.


    # OS_CPU_HOOKS_EN


    This configuration constant indicates whether OS_CPU_C declares the hook functions
    (when set to 1) or not (when set to 0). Recall that μC/OS-II expects the presence
    of functions that can either be defined in the port (i.e. in OS_CPU_C_C ) or by
    the application code. These functions are are:


    +   1. OSTaskCreateHook ()

    2. OSTaskDelHook ()

    3. OSTaskStatHook ()

    4. OSTaskSwHook ()

    5. OSimeTickHook ()


    # OS_MBOX_EN


    This constant allows you to enable (when set to 1) or disable (when set to 0)
    code generation of message mailbox services and data structures. This allows you
    to reduce the amount of code space when your application does not require the
    use of message mailboxes.'
  merge: -1
  pgno: 297
- img_proc: true
  md: '# OS_MEM_EN


    This constant allows you to enable (when set to 1) or disable (when set to 0)
    code generation of μC/OS-II’s partition memory manager and its associated data
    structures. This allows you to reduce the amount of code and data space when your
    application does not require the use of memory partitions.'
  merge: -1
  pgno: 298
- img_proc: true
  md: '# OS_Q_EN


    This constant allows you to enable (when set to 1) or disable (when set to 0)
    code generation of μC/OS-II message queue manager and its associated data structures.
    This allows you to reduce the amount of code and data space when your application
    does not require the use of message queues. Note that if OS_Q_EN is set to 0 then
    the #define constant OS_MAX_QS is irrelevant.


    # OS_SEM_EN


    This constant allows you to enable (when set to 1) or disable (when set to 0)
    code generation of μC/OS-II semaphore manager and its associated data structures.
    This allows you to reduce the amount of code and data space when your application
    does not require the use of semaphores.


    # OS_TASK_CHANGE_PRIO_EN


    This constant allows you to enable (when set to 1) or disable (when set to 0)
    code generation of the function OSTaskChangePrio(). If your application never
    changes task priorities once they are assigned then you can reduce the amount
    of code space used by μC/OS-II by setting OS_TASK_CHANGE_PRIO_EN to 0.


    # OS_TASK_CREATE_EN


    This constant allows you to enable (when set to 1) or disable (when set to 0)
    code generation for OSTaskCreate(). Enabling this function μC/OS-II backward compatible
    with μC/OS''s task creation function. If your application always uses OSTaskCreateExt()
    (recommended) then you can reduce the amount of code space used by μC/OS-II by
    setting OS_TASK_CREATE_EN to 0. Note that you MUST set one of the two #defines
    OS_TASK_CREATE_EN or OS_TASK_CREATE_EXT_EN to 1. If you wish, you can actually
    both.


    # OS_TASK_CREATE_EXT_EN'
  merge: -1
  pgno: 299
- img_proc: true
  md: 'This constant allows you to enable (when set to 1) or disable (when set to
    0) code generation of the function OSTaskCreateExt() which is the extended, and
    more powerful version of the two creation functions. If your application never
    uses OSTaskCreateExt() then you can reduce the amount of code space used by μC/OS-II
    by setting OS_TASK_CREATE_EXT_EN to 0. Note, however, that you need the extended
    create function to use the stack checking function OSTaskStkChk().


    # OS_TASK_DEL_EN


    This constant allows you to enable (when set to 1) or disable (when set to 0)
    code generation of the function OSTaskDel() which allows you to delete tasks.
    If your application never uses this function then you can reduce the amount of
    code space used by μC/OS-II by setting OS_TASK_DEL_EN to 0.


    # OS_TASK_SUSPEND_EN


    This constant allows you to enable (when set to 1) or disable (when set to 0)
    code generation of the two functions OSTaskSuspend() and OSTaskResume() which
    allows you to explicitly suspend and resume tasks, respectively. If your application
    never uses these functions then you can reduce the amount of code space used by
    μC/OS-II by setting OS_TASK_SUSPEND_EN to 0.'
  merge: -1
  pgno: 300
- img_proc: true
  md: '# OS_TICKS_PER_SEC


    This constant specifies the rate at which you will call OSTimeTick(). It is up
    to your initialization code to ensure that OSTimeTick() is invoked at this rate.
    This constant is used by OSStatInit(), OSTaskStat() and, OSTimeDlyHMSM().'
  merge: -1
