  md: '# 2.25 Message Queues


    A message queue is used to send one or more messages to a task. A message queue
    is basically an array of mailboxes. Through a service provided by the kernel,
    a task or an ISR can deposit a message (the pointer) into a message queue. Similarly,
    one or more tasks can receive messages through a service provided by the kernel.
    Both the sending task and receiving task will agree as to what the pointer is
    pointing to. Generally, the first message inserted in the queue will be the first
    message extracted from the queue (FIFO). In addition to extract messages in a
    FIFO fashion, uCOS-II allows a list to be associated with each message queue in
    more than one task to receive messages through the waiting list.


    As the mailbox, a list is associated with each message queue. A task to receive
    a message from an empty queue will be suspended and placed on the waiting list
    until a message is received. Typically, the kernel will allow the waiting for
    a message to specify a timeout. If a message is not received before the timeout,
    the requesting task is made ready-to-run and an error (indicating the timeout)
    is deposited in the queue. Either the highest priority task to wait for the message
    will be given the message. Figure 2-17 shows an ISR (Interrupt Service Routine)
    depositing a message into a queue. Note: the 10 indicates the number of messages
    that can be accumulated in the queue. A next to the hourglass indicates that the
    task will wait forever for a message to arrive.


    Kernel services are typically provided by:


    +   a) Initialize the queue. The queue is always assumed to be empty after initialization.

    b) Deposit a message into the queue (POST).

    c) Wait for a message to be deposited into the queue (PEND).

    d) Get a message from a queue, if one is present, but not suspend the callee if
    the queue is empty (ACCEPT). If the queue contained a message, the message is
    extracted from the queue. A return code is used to notify the caller about the
    outcome of the call.


    ![](img/114817931de46def85b7b339e903e24f_68_0.png)


    # 2.26 Interrupts


    An interrupt is a hardware mechanism used to inform the CPU that an asynchronous
    event has occurred. When an interrupt is recognized, the CPU saves part (or all)
    of its (i.e. registers) and jumps to a subroutine called an Interrupt Service
    Routine, or ISR. The ISR processes the event and upon completion of the ISR, the
    program returns to:


    +   a) The background for a foreground/background system.

    b) The interrupted task for a non-preemptive kernel.

    c) The highest priority task ready-to-run for a preemptive kernel.


    Interrupts allow a microprocessor to process events when they occur. This prevents
    the microprocessor from continuously polling an event to see if this event occurred.
    Microprocessors allow interrupts to be ignored and recognized through use of two
    instructions: disable interrupts and enable interrupts, respectively. In a real-time
    environment, interrupts should be disabled as little as possible. Disabling interrupts
    affects interrupt latency (see section 2.27, Interrupt Latency) and also, disabling
    interrupts may cause interrupts to be missed.'
