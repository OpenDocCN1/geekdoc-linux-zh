    # 3.02 Task States


    Figure 3-1 shows the state transition diagram for tasks under µC/OS-II. At any
    given time, a task can be in one of five states.


    ![](img/114817931de46def85b7b339e903e24f_82_0.png)


    Figure 3-1, Task States


    The DORMANT state corresponds to a task (see Listing 3.1 or Listing 3.2) which
    resides in program space (ROM or RAM) but has not been made available to µC/OS-II.
    A task is made available to µC/OS-II by calling OSTaskCreate or OSTaskCreateExt().
    When a task is created, it is READY to a running task. Tasks may be created before
    multitasking tasks or dynamically by a running task. When created by a task, if
    the created task has higher priority than its creator, the creator is immediately
    given control of the CPU. A task can return itself or another task to the dormant
    state by calling OSTaskDel().


    Multitasking is started by calling OSStart(). OSStart runs the highest priority
    task that is READY to run. A task can be running at any given time. A task will
    not run until all higher priority tasks are either in the ready state or deleted.


    The running task may delay itself for a certain amount of time by calling OSTimeDelay()
    or OSTimeMs(). This task is WAITING for time to expire and the next highest priority
    task that is ready-to-run is immediately given control of the CPU. The delayed
    task is made ready to run by OSTimeTick() when the desired time expires (see Section
    3.11, Clock Tick).


    The running task may also need to wait for an event, by calling either OSSemPend(),
    OSboxPend() or OSQP(). WAITING for the occurrence of the event. When a task pends
    on an event, the next highest priority task is immediately given control of the
    CPU. The task is made ready when the event occurs. The occurrence of an event
    may be signaled by another task or by an ISR.'
