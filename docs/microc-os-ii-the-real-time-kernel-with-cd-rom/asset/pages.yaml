  md: '# Chapter 1.


    # Sample Code


    This chapter provides you with three examples on how to use μC/OS-II. I decided
    to include this chapter early in the book to you to start using μC/OS-II as soon
    as possible. Before getting into the examples, however, I will describe some of
    the conventions I use throughout this book.


    The sample code was compiled using the Borland International C/C++ compiler V3.1
    and options were selected to generate code for an Intel/AMD 80186 processor (Large
    memory model). The code was actually ran and tested on a 300 MHz Intel Pentium-II
    PC as can be viewed as a super fast 80186 processor (at least for purpose). I
    chose a PC as my target system for a number of reasons. First and foremost, it''s
    a lot easier to test code on a PC than on any other embedded environment (i.e.,
    evaluation board simulator etc.); there are no EPROMS to burn, no downloads to
    EPROM emulators, CPU emulators, etc. You simply compile, link, and run. Second,
    the 80186 object code (Real Mode, Large Model) generated using the Borland C/C++
    compiler is compatible with all 8086 derivative processors from Intel, AMD or
    Cyrix.'
  merge: -1
