    # ## 2.23 Intertask Communication


    **It is sometimes necessary for a task or an ISR to communicate information to
    another task. This information transfer is called *intertask communication*. Information
    may be communicated between tasks in two ways: through global data or by sending
    messages.**


    When using global variables, each task or ISR must ensure that it has exclusive
    access to the variables. If an ISR is involved, the only way to ensure exclusive
    access to the common variables is to disable interrupts. If two tasks are sharing
    data each can gain exclusive access to the variables by using either disabling/enabling
    interrupts or through a semaphore (as we have seen). Note that a task can only
    communicate information to an ISR by using global variables. A task is not aware
    when a global variable is changed by an ISR unless the ISR signals the task by
    using a semaphore or by having the task regularly polls the contents of the variable.
    To correct this situation, you should consider using either a *message mailbox*
    or a *message queue*.'
  merge: -1
  pgno: 66
- img_proc: true
  md: '# 2.24 Message Mailboxes


    Messages can be sent to a task kernel services. A Message Mailbox, also called
    message exchange, typically a pointer size variable. Through a service provided
    by the kernel, a task or an ISR can deposit a message (pointer) into this mailbox.
    Similarly, one or more tasks can receive messages through a service provided by
    the kernel. Both the sending task and receiver will agree as to what the pointer
    is pointing to.


    A waiting list is associated with each mailbox in more than one task desires to
    receive messages through the mailbox. A task receiving to receive from an empty
    mailbox will be suspended and on the waiting list until a message arrives. Typically,
    the kernel will allow the task waiting for a message to specify a timeout. If
    a message is not received before the timeout, the requesting task is ready-to-run
    and an error code (indicating that a timeout has occurred) is returned. When a
    message is deposited into the mailbox, either the highest priority (priority-based)
    or the first task to request a message is given (called First-In-First-Out, or
    FIFO). Figure 2-16 shows a task depositing a message into a mailbox. Note that
    the mailbox is represented graphically by an I-beam and the timeout is represented
    by an hourglass. The number next to the hourglass represents the number of clock
    ticks (described later) that the task will wait for a message to arrive.


    ![](img/114817931de46def85b7b339e903e24f_67_0.png)


    Figure 2-16, Message mailbox.


    Kernel services are typically provided to:


    +   a) Initialize the contents of a mailbox. The mailbox may or may not initially
    contain a message.

    b) Deposit a message into the mailbox (POST).

    c) Wait for a message to be deposited into the mailbox (PEND).

    d) Get a message from a mailbox, if one is present, but not suspend the caller
    if the mailbox is empty (ACCEPT). If the mailbox contains a message, the message
    is extracted from the mailbox. A return code is used to notify the caller about
    the outcome of the call.


    Mailboxes can also be used to simulate binary semaphores. A message in the mailbox
    indicates that the resource is available while an empty mailbox indicates that
    the resource is already in use by another task.'
