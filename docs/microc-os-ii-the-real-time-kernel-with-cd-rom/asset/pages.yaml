    The code to deposit a message in a mailbox is shown in 6.16. After making sure
    the ECB is used as a mailbox L.16(1), **OSMboxPost()** checks if it is waiting
    for a message to arrive at the mailbox L.16(2). There tasks waiting when the OSEventGrp
    in the ECB contains a non-zero value. The highest priority task waiting for message
    is retrieved from the list by OSEventTaskReady() (see section 6.2, *Making a task
    ready*) L.16(3). If this task is ready-to-run, OSSched() is called check if the
    task made is now the highest priority task ready-to-run. If it is, a context switch
    will result (only if **OSMboxPost()** is called from a task) and the readied task
    will be executed. If the readied task is not waiting for a message to arrive at
    the mailbox, then the pointer to the message is saved in the mailbox L.16(5).
    Storing the pointer in the mailbox allows the next task to call **OSXend** to
    immediately get the message.


