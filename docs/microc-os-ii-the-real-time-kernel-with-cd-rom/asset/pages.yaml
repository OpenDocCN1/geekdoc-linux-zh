    # Listing 9.2, OS_CPU.H


    # 9.03.01 OS_CPU.H, Data Types


    Because different microprocessors have different word length, the port of μC/OS-II
    includes a series of type definitions that ensure portability L.2(1). With the
    Borland C/C++ compiler, an int is 16-bit and a long is 32-bit. Also, for your
    convenience, I included floating-point data types even though μC/OS-II doesn''t
    make use of floating-point.


    A stack entry for the 80x86 processor running in real-mode is 16-bit wide and
    thus, OS_STK is declared accordingly for the Borland C/C++ compiler. All tasks
    MUST be declared using OS_STK as its data type.'
