- img_proc: true
  md: '# Preemptive:


    μC/OS-II is a fully-preemptive real-time kernel. This means that μC/OS-II always
    runs the highest priority task that is ready. Most commercial kernels are preemptive
    and μC/OS-II is comparable in performance with many of them.


    # Multi-tasking:


    μC/OS-II can manage up to 64 tasks, however the current version of the software
    reserves eight (8) of these tasks for system use. This leaves your application
    with up to 56 tasks. Each task has a unique priority assigned to it which means
    that μC/OS-II cannot do robin scheduling. There are thus 64 priority levels.


    # Deterministic:


    Execution time of all μC/OS-II functions are deterministic. This means that you
    can always know how much time μC/OS-II will take to execute a function or a service.
    Furthermore, except for one service, execution time of all μC/OS-II services do
    not depend on the number of tasks running in your application.


    # Task stacks:


    Each task requires its own stack, however μC/OS-II allows each task to have a
    different stack size. This allows you to reduce the amount of RAM needed in your
    application. With μC/OS-II''s stack checking feature, you can determine exactly
    how much stack space each task actually requires.


    # Services:


    μC/OS-II provides a number of system services such as mailboxes, queues, semaphores,
    fixed-sized memory partitions, time related functions, etc.


    # Interrupt Management:


    Interrupts can suspend the execution of a task, and if a higher priority task
    is awakened as a result of the interrupt, the highest priority task will run as
    soon as all nested interrupts complete. Interrupts can be nested up to 255 levels
    deep.


    # Robust and reliable:


    μC/OS-II is based on μC/OS which has been used in hundreds of commercial applications
    since 1992. μC/OS-II uses the same core and most of the same functions as μC/OS
    offers more features.'
  merge: -1
