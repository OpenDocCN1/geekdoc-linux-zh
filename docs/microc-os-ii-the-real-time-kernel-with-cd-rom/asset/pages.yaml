  md: '# # OSIntExit()


    void OSIntExit(void);


    | File | Called from | Code enabled by |

    | OS_CORE.C | ISR only | N/A |


    **OSIntExit()** is used to notify µC/OS-II that an ISR has completed. This µC/OS-II
    to keep track of interrupt nesting. **OSIntExit()** is used in conjunction with
    **OSIntEnter()**. When the last interrupt completes, µC/OS-II will call the scheduler
    to determine if a higher priority task has been made ready to run. In this case,
    the interrupt will return to the higher priority task instead of the interrupted
    task.


    # ### Arguments


    NONE


    # ### Returned Value


    NONE


    # ### Notes/Warnings


    This function must not be called by task level code. Also, if you decided to increment
    OSIntNesting you will still need to call OSIntExit() .


    # ### Example


    (Intel 80x86, Real-Mode, Large Model)


    | ISRx | PROC | FAR | |

    | PUSHA | ; Save processor registers |

    | PUSH | ES | |

    | PUSH | DS | |

    | | | |

    | CALL | FTR _OSIntExit ; Notify µC/OS-II of end of ISR |

    | POP | DS ; Restore processor registers |

    | POP | | |

    | POP | ES | |

    | POPA | | |

    | IRET | | Return to interrupted task |

    | ISRx | ENDP | |


