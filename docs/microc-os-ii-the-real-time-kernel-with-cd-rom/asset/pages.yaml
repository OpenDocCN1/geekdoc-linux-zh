  md: "# Listing 6.9, Creating a semaphore.\n\n# 6.05.02 Waiting on a Semaphore, OSSemPend()\n\
    \nThe code to wait on a semaphore is shown in 6.10. **OSSemPend()** starts by\
    \ checking that the ECB being pointed to by **event** has been created by **OSCreate()**\
    \ L6.10(1). If the semaphore is available (its count is non-zero) L6.10(2) then\
    \ the count is decremented and the function return to it with an error code indicating\
    \ success. Obviously, if you want the semaphore, this is the outcome you are looking\
    \ for. This also happens to be the fastest path through **OSSemPend()**.\n\nIf\
    \ the semaphore is not available (the count is zero) then we check if the function\
    \ was called by an ISR L6.10(4). Under normal conditions, you should not call\
    \ **OSSemPend()** from an ISR because an ISR cannot be made to wait. I decided\
    \ to add this check in case. However, if the semaphore is in fact available, the\
    \ call to **OSSemPend()** would be successful if called by any ISR!\n\nIf the\
    \ count is zero and **OSSemPend()** was not called by an ISR then the calling\
    \ task needs to be put to sleep until another task (the semaphore signals the\
    \ next section). **OSSemPend()** allows you to specify a timeout value as one\
    \ of its arguments (i.e. **timeout**). This feature is useful for avoiding waiting\
    \ indefinitely for the semaphore. If the value passed is non-zero, then **OSSemPend()**\
    \ will suspend the task until the semaphore is signaled or the period expires.\
    \ By putting the task to sleep, **OSSemPend()** sets the status flag in the task's\
    \ TCB (Task Control Block) to indicate that the task is suspended waiting for\
    \ a semaphore L6.10(5). The task is stored in the TCB of the task L6.10(6) then\
    \ it is decremented by **OSTimeTick()**. You should recall (section 3.10, *Clock\
    \ Tick*) that this decrements each of the created task's **TCDB.field** field\
    \ work to sleep is done by **OSEventTaskWait()** (section 6.03, Making a task\
