  md: "```\nvoid Task (void *data)\n\nUBYTE x;\nUBYTE y;\nUBYTE err;\n\nfor (;;) {\n\
    \    OSSemPend(RandomSem, 0, &err);\n    x = random(80);\n    y = random(16);\n\
    \    OSSemPost(RandomSem);\n    PC_DispChar(x, y + 5, (char*)data, DISP_FGND_LIGHT_GRAY);\n\
    \    OSTimeDly(1);\n}\n```\n\n# Listing 1.10,\nTask that displays a number at\
    \ random locations on the screen.\n\n# 1.08 Example #2\n\nExample #2 makes use\
    \ of the extended task create function and µOS-II's stack checking feature. Stack\
    \ checking is useful when you don't actually know ahead of time how stack space\
    \ you need to allocate for each task. In this task, you allocate more stack space\
    \ than you think you need and let µOS-II tell you exactly how much stack space\
    \ is actually used. You obviously need to run the application long enough and\
    \ under your worst case conditions to get proper numbers. Your final stack size\
    \ should account for system expansion so sure you allocate between 10 and 25%.\
    \ In safety critical applications, however, you may never be sure. What you should\
    \ get from stack checking is a ‘ballpark’ figure, not not looking for an exact\
    \ stack usage.\n\nµOS-II's stack checking function assumes that the stack is initially\
    \ filled with zeros when the task is created. You accomplish this by using OSTaskCreateExt()\
    \ to clear the stack upon task creation (i.e. you OR both OSTASK_OPT_STK_CHK and\
    \ OSTASK_OPT_STK_CLR for the opt argument). If you intend to create and delete\
    \ tasks, you should set these options so that a new stack is cleared every time\
    \ the task is created. You should note that having OSTaskCreateExt() clear the\
    \ stack increases execution overhead which depends on the stack size. µOS-II scans\
    \ the stack starting at the bottom until it finds a non-zero entry (see figure\
    \ 1-1). As the stack is scanned, µOS-II increments a counter that indicates how\
    \ many entries are free (Stack Free)."
