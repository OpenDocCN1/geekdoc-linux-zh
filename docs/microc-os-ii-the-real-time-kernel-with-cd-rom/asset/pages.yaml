  md: "OSTimeDlyHMSM() allows a task to delay itself for user specified amount of\
    \ time specified in hours, seconds and milliseconds. This is a more convenient\
    \ and natural format than ticks. Rescheduling always occurs when at least one\
    \ of the parameters is non-zero.\n\n# Arguments\n\nhours is the number of hours\
    \ that the task will be delayed. The valid range of values is from 0 to 255 hours.\n\
    \nminutes is the number of minutes that the task will be delayed. The valid range\
    \ of values is from 0 to 59.\n\nseconds is the number of seconds that the task\
    \ will be delayed. The valid range of values is from 0 to 59.\n\nmilli is the\
    \ number of milliseconds that the task will be delayed. The valid range of values\
    \ is from 0 to 999. Note that the resolution of this argument is in multiples\
    \ of the tick rate. For instance, if the tick rate is set to 10 mS then a delay\
    \ of 5 m would result in no delay. The delay is actually rounded to the nearest\
    \ tick. Thus, a delay of 15 mS would result in a delay of 20 ms.\n\n# Returned\
    \ Value\n\nOSTimeDlyHMSM() returns one of the following error codes:\n\n+   1)\
    \ OS_NO_ERR, if you specified valid arguments and the call was successful.\n2)\
    \ OS_TIME_INVALID_MINUTES, if the minutes is greater than 59.\n3) OS_TIME_INVALID_SECONDS,\
    \ if the seconds is greater than 59.\n4) OS_TIME_INVALID_MS, if the milliseconds\
    \ is greater than 999.\n5) OS_TIME_ZERO_DLY, if all four arguments are 0.\n\n\
    # Warnings\n\nNote that calling this function with a delay of 0 hours, 0 minutes,\
    \ 0 seconds and 0 milliseconds results in no delay and thus the function returns\
    \ immediately to the caller. Also, if the total delay time ends up being larger\
    \ than 65535 clock ticks, you will not be able to abort the delay and resume the\
    \ task by calling OSTimeDlyResume (\n\n# Example\n\n```\nvoid TaskX(void *pdata)\n\
    {\n    for (;;) {\n\n        OSTimeDlyHMSM(0, 0, 1, 0);    /* Delay task for 1\
    \ second */\n\n    }\n}\n```\n\n# OSTimeDlyResume()\n\nINT8 OSTimeDlyResume(INT8\
    \ pri);\n\n| File | Called from | Code enabled by |\n| OS_TIME.C | Task only |\
    \ N/A |"
  merge: -1
  pgno: 286
