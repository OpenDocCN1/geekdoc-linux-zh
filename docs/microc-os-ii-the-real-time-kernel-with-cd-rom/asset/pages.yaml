  md: "OSTimeDlyResume() allows your application to resume a task that has been delayed\
    \ through a call to either OSTimeDly() or OSTimeDlyHMSM().\n\n# Arguments\n\n\
    prio specifies the priority of the task to resume.\n\n# Returned Value\n\nOSTimeDlyResume()\
    \ returns one of the following error codes:\n\n+   1) OS_NO_ERR, if the call was\
    \ successful.\n2) OS_PRIO_INVALID, if you specified a task priority greater than\
    \ OS_LOWEST_PRIO.\n3) OS_TIME_NOT_DLY, if the task is not waiting for time to\
    \ expire.\n4) OS_TASK_NOT_EXIST, if the task has not been created.\n\n# Notes/Warnings\n\
    \nNote that you MUST NOT call this to resume a task that is waiting for an event\
    \ with timeout. This situation would make the task look like a timeout (unless\
    \ you desire this effect).\n\nYou cannot resume a task that has called OSTimeDlyHMSM()\
    \ with a combined time that exceeds 65535 ticks. In other words, if the clock\
    \ ticks at 100 Hz then, you will not be able to resume a delayed task that called\
    \ OSTimeDlyHMSM(0, 10, 55, 350) or higher.\n\n(10 Minutes * 60 + 55 Seconds +\
    \ 0.35) * 100 ticks/second\n\n# Example\n\n```\nvoid TaskX(void *pdata)\n{\n \
    \   INT8U err;\n\n    pdata = pdata;\n    for (;);\n\n    err = OSTimeDlyResume(10);\
    \    /* Resume task with priority 10 */\n    if (err == OS_NO_ERR) {\\      /*\
    \ Task was resumed */\n\n    }\n\n}\n```\n\n# OSTimeGet()\n\nINT32U OSTimeGet(void);\n\
    \n| File | Called from | Code enabled by |\n|---|---|---|n| OS_TIME.C | Task or\
