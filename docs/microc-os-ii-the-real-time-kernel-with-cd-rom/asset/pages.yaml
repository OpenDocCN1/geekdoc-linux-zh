    # 2.31 ISR Processing Time


    While ISRs should be as short as possible, there are no absolute limits on the
    amount of time for ISR. One cannot say that an ISR must be less than 100 µS, 500
    µS, 1 ms, etc. If the ISR''s code is the most important code that needs to run
    at any given time, then it could be as long as it needs to be. In most cases,
    the ISR should recognize the interrupt, obtain data/status from the interrupting
    device, and a task which will perform the actual processing. You should also consider
    whether the overhead involved in signaling a task is more than the processing
    of the interrupt. Signaling a task from an ISR (i.e. through a semaphore, a mailbox,
    or a queue) requires some processing time. If your interrupt requires less than
    the time required to signal a task, you should consider processing the interrupt
    in the ISR itself and possibly enable to allow higher priority interrupts to be
    recognized and serviced.


    # 2.32 Non-Maskable Interrupts (NMI)


    Sometimes, an interrupt must be served as quickly as possible and cannot afford
    to have the latency imposed by a kernel. In these situations, you may be able
    to use the Non-Maskable Interrupt (NMI) provided on most microprocessors. Since
    the NMI cannot be disabled, interrupt latency, response, and recovery are minimal.
    The NMI is generally reserved for drastic measures such as saving important information
    during a power down. However, if your application doesn''t have this requirement,
    you could use the NMI to service your most time-critical ISR, Equations 2.9, 2.10
    and 2.11 shows how to determine the interrupt latency, response and recovery of
    an NMI, respectively.'
