    # OSMboxPend() :


    Minimum assumes that a message is available at the mailbox.


    Maximum occurs when a message is not available, the task will have to wait. In
    this case, a context switch occurs. The maximum time is as seen by the calling
    task. In other words, this is the time it takes to look at the mailbox, determine
    that there is no message, call the scheduler, context switch to the new task,
    context switch back from whatever task was running, determine that a timeout occured
    and returning to the caller.


    # OSMboxPost() :


    Minimum assumes that the mailbox is empty and that no task is waiting on the mailbox
    to contain a message.


    Maximum occurs when one or more tasks are waiting on the mailbox for a message.
    In this case, the message is given to the highest priority task and a context
    switch is performed to resume the task. Again, the maximum time is as seen by
    the calling task. In other words, this is the time it takes to wake up the waiting
    task, pass it the message, call the scheduler, context switch to the task, context
    switch back from whatever task was running, determine that a timeout occured and
    returning to the caller.


    # OSMemGet() :


    Minimum assumes that a memory block is not available.


    Maximum assumes that a memory block is available and is returned to the caller.


    # OSMemPut() :


    Minimum assumes that you are returning a memory block to an already full partition.


    Maximum assumes that you are returning the memory block to the partition.


    # OSQPend() :


    Minimum assumes that a message is available at the queue.


    Maximum occurs when a message is not available so, the task will have to wait.
    In this case, a context switch occurs. The maximum time is as seen by the calling
    task. In other words, this is the time it takes to look at the queue, determine
    that there is no message, call the scheduler, context switch to the new task,
    context switch back from whatever task was running, determine that a timeout occured
    and returning to the caller.'
