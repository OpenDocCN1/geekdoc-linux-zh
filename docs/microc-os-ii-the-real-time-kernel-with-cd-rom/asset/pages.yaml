    # # 2.20 Deadlock (or Deadly Embrace)


    A deadlock, also called a deadly embrace, is a situation in which two tasks are
    each unknowingly waiting for resources held by each other. If T1 has exclusive
    access to resource R1 and T2 has exclusive access to resource R2, then if T1 needs
    exclusive access to R2 and T2 needs exclusive access to R1, neither task can continue.
    They are deadlocked. The simplest way to avoid a deadlock is for tasks to:


    +   a) acquire all resources before proceeding,

    b) acquire the resources in the same order,

    c) release the resources in the reverse order.


    Most kernels allow you to specify a timeout when acquiring a semaphore. This feature
    allows a deadlock to be broken. If the semaphore is not available within a certain
    amount of time, the task requesting the resource will resume execution. Some form
    of error code must be returned to the task to notify it that a timeout has occurred.
    A return error prevents the task from thinking it has obtained the resource. Deadlocks
    generally occur in large multitasking systems and are not generally generated
    in embedded systems.


    # # 2.21 Synchronization


    A task can be synchronized with an ISR, or another task when no data is being
    exchanged, using a semaphore as shown in Figure 2-12. Note that, in this case,
    the semaphore is drawn as a flag, to indicate that it is used to signal the occurrence
    of an event (rather than for mutual exclusion, in which case it would be drawn
    as a key). When used as a synchronization mechanism, the semaphore is initialized
    to 0. Using a semaphore for this type of synchronization is what called a unilateral
    rendezvous. A task initiates an I/O operation and waits for the semaphore. When
    the I/O operation is complete, an ISR (or another task) signals the semaphore
    and the task is resumed.


