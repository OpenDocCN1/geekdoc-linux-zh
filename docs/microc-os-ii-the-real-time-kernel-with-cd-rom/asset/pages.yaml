    deleted. A doubly linked list is used to permit an element in the chain to be
    quickly inserted or removed.


    OSTCBEventPtr is a pointer to an event control block and will be described later
    (see Chapter 6, Intertask Communication & Synchronization).


    OSTCBag is a pointer to a message that is sent to a task. The use of this field
    will be described later (see Chapter 6, Intertask Communication & Synchronization).


    OSTDBly is used when a task needs to be delayed for a certain number of clock
    ticks or a task needs to pend for an event to occur with. In this case, this field
    contains the number of clock ticks that the task is allowed to wait for the event
    to occur. When this value is zero the task is delayed or has no timeout waiting
    for an event.


    OSTCBStat contains the state of the task. When OSTCBStat is 0, the task is ready
    to run. Other values can be assigned to OSTCBStat and these values are described
    in uCOS_II.


    OSTCBrio contains the priority. A high priority task has a low OSTCBrio value
    (that is, the lower, the higher the priority).


    OSTCBX, OSTCBY, OSTCBXt and OSTCBBy are used to accelerate the process of making
    a task ready to run, or to make a task wait for an event (to avoid contention)
    at runtime. The values for these fields are updated when the task is created or
    when the task''s priority is changed. The values are obtained as follows:


    ```

    OSTCBY          = priority >> 3;

    OSTCBBy         = OSMapTbl[priority >> 3];

    OSTCBX          = priority & 0x07;

    OSTCBXt         = OSMapTbl[priority & 0x07];

    ```


    # 3.4. Calculating OS_TCB members.


    OSTCBDelReq is a boolean which is used to indicate whether or not a task requested
    that the current task is deleted. The use of this field will be described later
    (see Chapter 4, Task Management).


    The maximum number of tasks (OS_MAX_TASKS) that an application can have is specified
    in OS_CF.H and determines the number of OS_TCBs allocated by uC/OS-II. You can
    reduce the amount of RAM by setting OS_MAX_TASKS to the actual number of tasks
    needed in your application. All OS_TCBs are placed in OSTCBtl[1]. Note that uC/OS-II
    allocates N_SYS_ extra OS_TCBs for internal use. One will be used for the idle
    task while the other will be used for the statistic task if OS_TASK_STAT_EN is
    set to 1). When uC/OS-II is initialized, all OS_TCBs in this table are linked
    in a singly linked list of OS_TCBs as shown in figure 3.2. When a task is created,
    the OS_TCB pointed to by OSTCBFreeList is adjusted to point to the next OS_TCB
    in the chain. When a task is deleted, its OS_TCB is returned to the list of free
    OS_TCBs.'
