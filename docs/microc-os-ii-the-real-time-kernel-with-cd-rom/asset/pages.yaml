  md: "μC/OS-IS always creates a task (a.k.a. the Idle Task) which is executed when\
    \ none of the other tasks is ready to run.\nThe idle task (OSTaskIdle()) is always\
    \ set to the lowest priority, i.e. OS_LOWEST_PRIO. OSTaskIdle() does nothing but\
    \ increment a 32-bit counter called OSIdleCtr is used by the statistics (see Section\
    \ 3.08, Static Task) to determine how much CPU time (in percentage) is actually\
    \ being consumed by the application software. The code for idle task is shown\
    \ below. Interrupts are disabled then enabled around the increment because 8-bit\
    \ and 16-bit processors, a 32-bit increment requires multiple instructions which\
    \ must be protected from being accessed by higher priority tasks or an ISR. The\
    \ idle task can never be deleted by\n\n```\nvoid OSTaskIdle (void *pdata)\n{\n\
    \  pdata = pdata;\n  for (;;)  {\n    OS_ENTER_CRITICAL();\n    OSIdleCtr++;\n\
    \    OS_EXIT_CRITICAL();\n  }\n}\n```\n\n# 3.10, μC/OS-II's Idle task.\n\nμC/OS-II\
    \ contains a task that provides run-time statistics. This task is called OSTStat()\
    \ and is created if you set the configuration option OS_TASK_STAT_EN (see OS_CFG.H)\
    \ to 1. When enabled, OSTaskStat (see OS_CORE.C) executes every second and computes\
    \ the percentage of CPU usage. In other words, OSTaskStat will tell you how much\
    \ of the CPU time is used by your application, in percentage. This value is placed\
    \ in the variable OSPCUUsage which is a signed 8-bit integer.\n\nIf your application\
    \ is to use the statistic, you MUST call OSStatInit() (see OS_CORE.C) from the\
    \ first and only task created during initialization. In other words, your startup\
    \ code MUST create only one task before calling OSStart(). From this task, you\
    \ MUST call OSStatInit() before you create your other tasks. The pseudo-code below\
    \ shows what needs to be.\n\n```\nvoid main (void)\n{\n  OSInit();           \
    \         /* Initialize μC/OS-II */\n  /* Install μC/OS-II's context switch */\n\
    \  /* Create your startup task (for sake of discussion, TaskStart()) (2)*/\n \
    \ OSStart();                    /* multitasking (3)*/\n}\n```\n\n```\nvoid TaskStart\
    \ (void *pdata)\n{\n  /* Initialize and initialize μC/OS-II's ticker (4)*/\n \
    \ OSStatInit();                /* Initialize statistics task (5)*/\n  /* Create\
    \ your application task(s) */\n  for (;;)                     {\n    /* Code for\
    \ TaskStart() goes here! */\n  }\n}\n```"
