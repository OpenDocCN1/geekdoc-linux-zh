    # ## Rules of engagement


    Another distinguishing aspect of Debian is that the distro is made of free software.
    The project uses the Debian Freedom Guidelines (DFG) to help determine which software
    packages are included. The DFG is part of the Debian Social Contract which defines
    the moral goals of the project.


    The project has three states: Stable, Testing and Unstable. Stable is available
