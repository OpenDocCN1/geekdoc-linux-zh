  md: '# Networking:

    File-sharing

    made easy


    Why should distance be a barrier? Here are all the steps to get file sharing set
    up on your Ubuntu PC.


    ![](img/09c2db624d208d272aaec8e2a116126d_99_0.png)


    If you''re on someone else''s computer make sure you don''t choose the ''remember
    forever'' option when connecting to a network using your credentials.


    Sharing files between PCs on your network is a fundamental function of modern
    computing, and the good news is that Ubuntu makes file sharing straightforward
    thanks to the SMB (also known as SAMBA) standard. Ubuntu also supports another
    - NFS - but that only works with other computers - Linux, Windows and Mac -


    Connecting to other computers is as easy as opening Ubuntu''s File Tool to find
    and clicking ''Network''. After a short pause you should see all visible computers
    on your network. Ubuntu allows you to browse your network (workgroup) for existing
    Windows shares.


    Double-click on a computer, and if it has a shared folder you will be prompted
    to enter your username, password to access it. The data can be safely ignored
    in most users - the username and password will


    to match a profile set up on your target computer (typically your user profile
    on a public folder). If you''re connecting to a frequently used shared folder
    enter the username and click Connect. You''ll be able to connect anytime without
    - select this.


    Before clicking Connect, you''ll also see an option to save your credentials to
    save you the benefit of providing them next time you connect - choose carefully
    (see the tip box). Once connected, the shared folder works like any other - you
    may easily drag files into it - you can copy files into that folder.


    It is simply incredibly straightforward, but note that the path to the shared
    folder allows you to save time each time without manually navigating in order
    to connect to it. One way to save some time is to create a bookmark in Files.
    Simply right-click the shared folder and select ''Add Bookmark''. You''ll see
    the bookmark at the bottom of the left-hand panel, and reconnecting in it is as
    simple as clicking it.


    It is also possible to automate mounting folders when login, but this involves
