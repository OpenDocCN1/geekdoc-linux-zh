  md: '# Install Windows apps


    If else fails, use Wine to run windows programs in Linux.


    The best way to run applications in your new Linux install is natively, but there''s
    a catch: Windows can''t do it. It might be possible to get it running. Wine is
    a special program that uses clever tricks to make use of Windows, allowing you
    to run many Windows programs as if they were native Linux ones.


    Wine can be a tricky to install, but thanks to the first-use wizard, you''ll be
    left with a blank window. Once, open the Software Manager, search for ''PlayLinux''.
    Click ''Install'' and let it automatically download and install Wine.


    Once installed, run PlayLinux and it will allow you to run any game. Click ''Start''
    to get started. The main menu will allow you to search for games or by category,
    with various filtering options available. Once you''ve found a game you want,
    select it, click the ''Install'' button. Wine might need to support the install,
    as hardware communication will be required. The wizard simplifies the process
    of installing supported applications because it handles downloading necessary
    dependencies and tells you how to get them.


    PlayLinux''s supported applications are relatively small - some examples include
    Microsoft Office, Quick-Time Player and Adobe Photoshop-CS. That is, it mainly
    focuses on games. If you find the application you want not listed, don''t worry
    - Wine supports more than those listed by PlayLinux, but the install process is
    more


    complicated. Start checking https://appdb.winehq.org to see if the application
    is supported. If it''s present, you''ll find a list of tested versions, with compatibility
    rating from Platinum to all day. Anything rated Garbage works in Wine, although
    you might have some glitches occur. Once done, follow the step-by-step guide (below)
    to attempt installation using PlayLinux''s main screen. If you run into problems,
    consult the web pages for help with different settings, but hopefully you''ll
    be up with an application that at least performs most functions without.


    # Application configuration


    Each program exists in its own virtual space, which you can select by clicking
    on ''Install'' and then clicking ''Config''. Most advanced configuration options
    are available here. Click the tab - click ''Wine'' to access a multi-dialog box
    with lists of additional tweaks.


    Wine should automatically map your folders to each environment locations in the
    virtual drive, but you can make other locations easily accessible from the One
    drive. Click ''Add'', select a drive name and then browse to the directory. Look
    under the ''/media'' folder for specific ones. If it''s not accessible within
    the program drive, you can allocate it to it.


