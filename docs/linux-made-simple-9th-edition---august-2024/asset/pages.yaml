    messaging (well, except those that don''t support it). No need to run stacks of
    desktops or multiple clients — one app, one pen, many accounts.


    First you''ll need to install it — download it from pidgin.org. On the first run
    you''ll need to add an account. If you have a Google account just select Google
    Talk, click Add, then follow the dialog box to prompt your credentials. Enter
    your password. If you use Google''s two-factor authentication (you) should then
    check https://security.google.com/settings/app-passwords to generate a new password
    for Pidgin.


    On the advanced tab, click ''connect server'' to talk to google.com, and follow
    the steps required to enable the account, and you will see connect and your buddy
    list. You can also add other accounts.


    #  Radio chatter


    There''s a problem, though: Google doesn''t use the XMPP protocol to handle Hangouts
    groups, so using Google Talk will only work for private chats. And Pidgin, by
    default, doesn''t support Hangouts groups.


