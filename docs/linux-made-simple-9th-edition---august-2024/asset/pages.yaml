  md: '# # Your first commands


    While it''s easier to install and manage software using a combination of the Software
    Center and Ubuntu''s Software & Updates panel, it''s often quicker to use the
    Advanced Package Tool (APT) freely. Here are some key commands that you can use
    (see below):


    +   - `apt update`: Lists all available packages from sources in the `sources.list`
    file.

    - `apt add-apt-repository`: Adds a new PPA repository to your sources.

    - `apt-upgrade`: Gets the latest packages (including updated versions) from all
    listed sources.

    - `apt install`: Installs a new package and its dependencies.

    - `apt-get remove`: Removes an installed package. Use `apt-get purge` to also
    remove configuration files, and `apt-get autoremove` to remove dependencies that
    are no longer needed.

    - `apt-get upgrade`: Updates all installed software. Use other apt-get commands
    like `apt check` to check for broken dependencies, or `apt autoremove` which removes
    deneeded packages.


