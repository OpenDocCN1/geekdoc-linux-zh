  md: '# # Headless setup


    One way to manage your host PC''s resources to run your virtual machine headless.
    Another is connecting to VM from the host PC, you access it remotely via the Remote
    Desktop Protocol (RDP). First, make sure you have the VirtualBox Extension Pack
    which supports this implementation of RDP—enable it via Settings -> Remote Desktop
    tab. You''ll need to change the default port (3389) if you''re using multiple
    VMs in this way—unique ports for each guest.


    Once it''s connected, you can launch your VM from the terminal via one of two:


    ```

    `VBoxHeadlessVM <VM name>`

    ```


    Alternatively, hold Shift as you click the VM in VirtualBox Manager, and you''ll
    be able to monitor its progress from the Preview window before switching to your
    remote computer.


    When you access VM from the RDP-client built into another PC, VirtualBox also
    supports USB redirection—grant your guest access to any USB devices plugged into
    the PC. Use the following:


    ```

    `VBoxManage startvm "VM name" --type headless`

    ```


    Replace <IP> with your host PC''s IP address, and <port> with the number you used
    (3389).


    ![](img/09c2db624d208d272aaec8e2a116126d_106_0.png)


    The Acceleration allows you to tap into the processor''s virtualisation features
    if they exist—see the tip for


