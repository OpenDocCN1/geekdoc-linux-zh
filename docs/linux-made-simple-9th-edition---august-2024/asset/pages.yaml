    Switch to the Display tab to configure your graphics card. Start by allocating
    memory as you wish, then check the "Enable Acceleration" to improve performance
    across all your VMs. If you''re running a Linux machine, enable 2D support. Switch
    to the Remote Display tab if you need to access your VM without a GUI. It allows
    you to view your screen as a window you want to do so—the former feature requires
    the VirtualBox Extension Pack, which we''ll talk about later.


    In the Storage tab where you can configure the storage of your virtual hard drive
    by adding it to the SATA controller, where you can manage multiple drives. You
    will also see that a single DVD drive is added to the IDE controller by default.
    Click the disk icon next to the Optical Drive to pull down a menu and select an
    ISO image as virtual drive. If you''d like to boot from ISO, select the option
