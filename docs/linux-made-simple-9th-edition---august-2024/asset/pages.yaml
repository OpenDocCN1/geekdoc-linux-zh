    # ## Virtual hardware settings


    The Extension Features should also be installed up to the OS you''ve chosen, but
    if you''d like to use USB 3 enable ''Enable EFI''. Here, note, this only works
    for Linux and OS Windows ( Guests aren''t supported yet).


    If you have a multi-core CPU installed, switch to the Processor tab and allocate
    more cores, making sure you don''t overallocate your processor (Hyperthreading
    could be discounted). You might also need to check ''ENABLE PAE/NX'' if your virtual
    machine access needs more than 4GB of RAM on a host PC with an 32-bit processor.


    ![](img/09c2db624d208d272aaec8e2a116126d_106_1.png)


