  md: '# # Genus Debian


    Made of free software and evolving...


    The Debian project has played a significant role in the evolution of Linux, and
    in many ways, it is the first real distribution created for the regular computer
    user. It was announced in August 1993 and had its first public release that year,
    although the first stable release wasn''t until 1996. The project was sponsored
    by the Free Software Foundation from November 1994 to November 1995.


    A major reason that later led Ian Murdock to create a new distro was the perceived
    poor maintenance and debugs in the Slack Linux System (SLS). Besides, the Debian
    Manifesto, which outlined his view for the new project, which prophesied that
    "distributions are essential to the freedom of Linux". In "The Manifesto", he
    called for the distro to be maintained openly, in the spirit of Linux and GNU,
    and wanted to "eliminate the need for users to download, compile, install and
    integrate a large number of essential tools to assemble a working Linux system."
    To meet this goal, Debian made a significant contribution to the Linux world—the
    dpkg package.


    This was originally as a program by Matt Welch, Czech Street and Ian Murdock,
    and the part of the tool was rewritten by Ian Murdock.


    # # "The Debian Manifesto proposed that ''distributions are essential to the freedom
    of Linux"


