  md: '# Admin: Core commands


    # 20 commands that all Linux web server admins know.


    Are you an accidental admin? Someone has realised, too, that they were responsible
    for the workings of a Linux server and – has gone wrong – because someone finds
    themselves lost in a world of terminals and commands that make sense to nobody?


    What may you be asking yourself. Do those letters after ''/'' actually mean anything
    real? How do I apply security patches to my server? You''re not wrong, you''re
    not alone. And to help you, we''ve put together this quick guide with essential
    Linux commands that every accidental admin should.


    But the first time you have to do something that isn''t straightforward to do
    through the graphical control panel, you''re suddenly out of the world of easy
    and explanatory tools and into the lot of text-only. To make things worse, for
    the first time you have to deal with the Terminal is when something has gone wrong
    and can''t be fixed through the control panel. Or perhaps you find that the web
    and all Linux servers must be updated or (sweeping the web and search for ''Heartbleed''
    to find out). You realize that your nice control hasn''t actually helped updating
    your server with security patches and your personal blog may be part of a massive
    international botnet used to launch DDOS attacks. Not only are you a stranger
    in a land, but you''re probably the one who broke something that was really important
    to you, but you never gave much thought to it that it was being hosted for a couple
    of months and nearly see-free. You are an accidental admin. So now you are responsible
    for keeping a Linux web server and secure–but you didn''t even know. You thought
    all that was included in your couple of months a month to pay and then found out
    it was a mistake.


    # Becoming an accidental admin


    While we argue that they should not, not everyone who starts using Linux as an
    operating system does so through choice. We suspect that most people''s first
    interaction with Linux happens when they set up their ISP account. You click on
    a button to setup a personal or business server – for a website, email address
    or suddenly you''re an admin. Even if you didn''t know it.


    When you''re starting up with your web server, things are usually straightforward.
    Nearly all hosts will provide you a web interface such as CPanel or Plesk to manage
    yours. These are powerful pieces of software that give you quick easy access to
    logs, mail services and one-click installations of applications such as WordPress
    or


    ```

    $ ls

    $ cd

    $ pwd

    $ df

    $ du

    $ top

    $ free

    $ ps

    $ netstat

    $ tail -f

    $ grep

    $ cat

    $ chmod

    $ chown

    $ mkdir

    $ rm

    $ cp

    $ mv

    $ tar

    $ zip

    $ unzip

    $ ssh

    $ scp

    $ wget

    $ curl

    $ clear

    $ history

    history

    ```


    ![](img/09c2db624d208d272aaec8e2a116126d_121_0.png)


    > Can''t remember that clearly you did last week''s History is your friend.


    Since most webers are using Ubuntu, this is because of that particular distribution.
    And all the commands here are applicable to a Linux desktop as are to any type
    of web server.


    # sudo


    The most fundamental thing to know about Linux''s approach to administration is
    that there are two types of users: a regular user or an administrator (''superuser'').
    Regular users aren''t allowed to change files or settings that they don''t own.
    The sudo command applies to core operating system files that are owned by an admin
    root.


    Root or admin privileges can be granted to a regular user by typing, sudo, in
    front of any Linux command. So to edit the configuration file that controls which
    are mounted using the text editor, nano, you might type sudo.'
