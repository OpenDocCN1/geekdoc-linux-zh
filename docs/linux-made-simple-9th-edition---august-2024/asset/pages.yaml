  md: '# Kodi: Media made easy


    **Kodi – formerly known as XBMC – is an awesome way to bring light into your living
    room.**


    There are plenty of media players available for Linux, capable of organising and
    accessing your digital media library whether it is on your hard drive or around
    the house. But Kodi, which was first developed for the Xbox (and formerly known
    as Xbox Media Center), is a ''10 foot interface'' for viewing with a remote on
    large TV. It is cross-platform, available for Windows, macOS, and Linux.


    Kodi is brilliant. It can be used to playback digital media, and also play CDs,
    Blu-ray movies and more. It is also used by fans to watch BBC or any of the TV
    channels around the world – including high profile sports events – online archives
    of football.


    It also works with digital DVR-T records so you can use your TV or PC in a IPTV
    system for recording shows for playback.


    To get back to the desktop, simply click the power button and select Exit. To
    run Kodi''in a window, go to System > Settings and click the Video Output tab.
    From here you can change the Display Mode to Windowed or Full screen to HDMI on
    your


    You can see from above that Kodi''s weakness is that some of the menus are a little
    complicated. It''s highly customizable: you can change many of the settings the
    kind of hardware acceleration you prefer in the menus, so be careful not to change
    anything that you don''t understand.


    Because Kodi is intended for use on a dedicated media center machine, many users
    use systems (usually based on OSMC) to stream into Kodi and have the most desktop
    apps remoted for stability.


    There are images of Kodi operating systems for non-PC too, like the Raspberry
    Pi (there is OSMC) and an Android app. The latter means it''s perfect for mobile
    devices like the Amazon Fire TV, which you can install on a spare HDMI port.


    # Getting Kodi


    Kodi isn''t in the standard Ubuntu repositories. To install it on your current
    machine, you''ll need to open and add the Kodi repository. Then run `sudo apt-add-repository
    ppa:teamjak/kodi` to open a terminal and


    ```

    sudo apt-get install kodi

    ```


    Kodi is a small download, around 78MB in size after install. If it isn''t you,
    you''ll find that Kodi runs in full screen with no ways to get back to the desktop.
    Just panic, remember that it''s designed for use on a nice media centre with a
    single purpose – not as a replacement for Rytmbox and Torrent.


    # Getting started


    Importing media library into Kodi is fairly straightforward. Click on Videos,
    then you''ll select "add video". This will bring up the player window so you can
    see where your videos are located. Then search for folders, so you can add the
    drive, but it will add all shows in the folder/driver set. It''s best, therefore,
    to find it in a dedicated video library where you can start a scan of the folder
    to create an instant media library.


    The browser isn''t necessarily intuitive for newcomers if you''re not used to
    the way Linux works under the hood. To find a hard drive to where your operating
    system is installed, you''ll need to go to Root > Root menu and find your drive.
    For example, the good way is to see the contents of the remote storage using the
    UPNP tool to search mine.


    Adding music to Kodi library is the same process as the Music tab on home. There''s
    one really good way if you''ve got a library of digital files built up over years,
    with lots of different genre and file types. But Kodi will automatically reference
    files with databases of shows and movies. This means it will display about a show
    or film, and correctly number episodes and


    ![](img/09c2db624d208d272aaec8e2a116126d_71_0.png)


    +   * Kodi has dozens of addons in its repositories, many of which allow access
    to content they probably shouldn''t.'
