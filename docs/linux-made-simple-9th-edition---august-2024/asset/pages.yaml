    be sure to leave your host PC''s resources for your other guests (customers, etc).

    The optimal option is to create a virtual hard drive. This basically starts as
    a single file that represents your guest''s disk and will expand only when you
    start with snapshots. Create a virtual hard drive


    If you''re running a VM in de-background (headless mode), but the basic settings
    are already in place, you should take the time to ensure it has all the power
    and resources it needs to function as well as you want it.


    Select your virtual machine and click the ''Settings'' button. Switch to the Processor
    tab, where you''ll find three tabs: Motherboard, Processor, and Controller. You
    can adjust the amount of memory from the Motherboard tab, as well as any switch,
