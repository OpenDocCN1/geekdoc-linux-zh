  md: '# # Getting connected


    Now let''s tackle some connectivity and Internet hurdles.


    # ## Going slower


    > My internet connection seems slowly downloading files over wireless. I need
    to fix this in Linux or change my router settings?


    Stay away from router settings until you have everything else—you could end up
    breaking a working setup. The first step is to check that it is really slow, using
    a service like Speedtest.net. Next check that nothing is sucking your bandwidth.
    A good program for this is metrics, which you may need to install from your package
    manager:


    ```

    sudo apt install metrics

    ```


    This gives a top-like display of your bandwidth. If you''re connecting to your
    router by wireless, try a wired connection to rule it out. If it makes a difference,
    try a different channel.


    There is also the possibility of congestion with wireless routers from your neighbours,
    which can be avoided by switching your router to a different channel. You can
    see the channels using:


    ```

    iwlist scan | grep -i Channel -e ESSID

    ```


    This produces a list of output about each access point found, discovers the need
    to filter it with grep. You can also use something Wi-Fi Analyzer, on Android


    ![](img/09c2db624d208d272aaec8e2a116126d_133_0.png)


    gives a graph of the channel and strength of all access points in range, enabling
    you to map any points where the signal to your router is weak as identifying congestion
    for bandwidth.


    There''s also the highly scientific test of picking up the phone. If the line
    is noisy, you will reduced speeds and you need to resolve the problem to your
    router provider. If the above shows nothing, check with your ISP before messing
    around with router settings.


    # ## Streaming video


    When I try to watch video on Amazon Prime Netflix (I have accounts) but get my
    computer is unsupported. Can I feel that I am running Windows? What will it matter
    if I paid for the phone?


    These services use a player. From Microsoft, try VLC for Linux which is a proven
    solution. VLC is a browser that with all the packages you need for most devices.
    Users of Ubuntu-you can add a PPA and install everything with apt-get-player:


    ```

    sudo apt-get install vlc

    ```


    ```

    sudo apt-get install mpv

    ```


    With the PPA it then installs the software. For other distributions install it
    with: ffmpeg-plugin-create-mediapolis ffmpeg-plugin-enable-audio


    This will download the required software and set up plugins for your browser.
    While the website will watch your videos, you will still be disconnected because
    your browser is not running Linux. Use of the User-Agent extensions for your browser:
    use-agent-over or uaconcontrol on Firefox or user-agent-switcher for chrome if
    you use Chrome. Then it is to set your User Agent to ''Firefox for Windows'' and
    enjoy your viewing.


    # ## The last one before root access


    When your system seems totally locked up and no amount of keying has helped—what
    is left but to reboot, with all the risks of data corruption this entails? There''s
    one more thing you can try: the Magic Keys. These are special combinations that
    can be shut down a locked-up system gracefully. Their name comes from the fact
    that they use the SysRq key, sometimes marked PrintSc, and they are truly magic:


    Even if your keyboard does nothing, these work because the kernel sees these keys
    directly with no interference. In the way: While holding down Alt and SysRq, press
    each of the keys in turn:


    +   - R resets keyboard

    - E all running programs in Linux

    - I interrupts all running programs with a TERM signal.


    There are various mnemonics to remember this sequence, some of them help remember
    the keyboard sequence itself—there is one to do with elephants. The one I found
    to remember is that it BUSER backwards, but the one I like most is Reboot Even
    If System Utterly Broken.'
