    expand your knowledge of their uses.


    Most people reading this are probably familiar with creating, sending or receiving
    ZIP files. Zip takes a collection of files and stores them in a ZIP archive file,
    as well as storing the files, it is extra information associated with each object.
    In this case, it includes the times, their owners and permissions, and of course,
    the name of each file. When you unzip an archive, all of this information is extracted,
    recreating the original set of files exactly as they were.


    Archives have several uses, but the most probable is binding a set of files for
    download - a single file easier to handle and the compression made worthwhile
    - creating backups. Since Tar has been around for ages, Zip has a number of drawbacks.
    The main issue is that its compression is poor by modern standards. After twenty
    five years, compression has no more and even though there have been improvements
    to Zip, there are better alternatives. Another disadvantage of Zip is that it
    is intended for archiving files, whereas when we need to send the data to another
    device or service,


    The standard archive for Unix-like systems is Tar, because Tar was originally
    used to store backups on tape drives (Tar Archive). It is a


    different way to Zip it sends all the archived data to its standard output and
    does not compress the data by default. This is because tape drives already have
    hardware compression built in. A lack of compression may seem like a disadvantage,
    but as Tar gets its data in an extra step of the program, it is actually like
    one compressor - even one that works.


    Compression programs work on a stream of data into two jobs: archive and compress,
    so strips this is exactly what Tar does. This may seem more complex. Let''s say
    we have a directory that is called foo. We can use one of the following options:


    +   - tar -cf foo.tar

    - tar -cvf foo.tar.gz

    - tar -cvf foo.tar.bz2

    - tar -cvf foo.tar.xz


    The c option tells Tar that we are creating an archive and the f tells it that
    we are archiving a file using the given name. The first command and the subsequent
    commands add an extra option to Tar: specifies which particular type of compression
    to use: z uses gzip


    # # Pipes and streams


    A core philosophy of Unix-like operating systems is to be specialized - each tool
    does one thing and does it well. We need ways to chain programs to make more complex
    tasks, and to handle input standard output and standard error (often referred
    to as stdout and stderr).


    Tar is a program that produces output to stdout and sends error messages to stderr.
    The standard output is the output from the command that goes to the output terminal
    window. Consider the following command:


    Tar is a pipe and it connects the standard output of one to the standard input
    of another. So Tar archives the contents of foo and sends it to stdout, which
    is then piped to the input of another command.


    ```

    tar -cf foo.tar foo | gzip

    ```


    This compresses a file to a filename. If it is not given, it compresses standard
    input and sends the result to standard output.


    Standard error is not redirected by >. If something goes wrong, error messages
    are printed to the terminal - if they were sent to the file, you wouldn''t know
    something was wrong.


    Running Tar with the (test) option not only checks that the archive is correct,
    but also shows you the contents - usually enough for you to need pipe it through
    a pager as Less.


    tar -tvf foo.tar'
