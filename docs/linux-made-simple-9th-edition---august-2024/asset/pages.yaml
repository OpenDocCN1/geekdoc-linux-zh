  md: "# # Tweak dual-boot settings\n\n# ## Discover how to switch between Linux and\
    \ Windows using Grub\n\nWhen Mint installs, it changes the bootloader at the beginning\
    \ of your hard drive to a program called GRUB Bootloader (Grub). Grub scans your\
    \ hard drive for visible operating systems and presents you a boot menu to select\
    \ which one to start. In cases where Windows is not detected by the Mint installer—this\
    \ should be set up perfectly from the off—you start your PC with the boot menu,\
    \ and if you make a choice within five seconds, it'll start to load Linux Mint.\n\
    \nIn this event, the only thing you'll need to know is how to make changes to\
    \ the boot menu—you may prefer to make Windows the default OS or you could like\
    \ Mint to be default. In the terminal, you'll need to use a tool to do the job,\
    \ like to edit your Grub menu box.\n\n# ## Troubleshooting\n\nUnfortunately, gravity\
    \ does not do what you expect it to. If the Mint installer doesn't detect your\
    \ installations and you were forced to partition your drive, you may find your\
    \ computer boots directly to Mint with no sign of Windows. Don't worry, you'll\
    \ need to perform some additional steps to make it again.\n\nFirst, you'll need\
    \ to boot from Windows 10 installation media: elect to repair your PC then select\
    \ Troubleshooting > Advanced Options > Startup Repair to repair your Windows bootloader.\
    \ This will leave you with no way to access Mint—to resolve this, boot from your\
    \ Mint installation media, and perform the following commands:\n\n```\nsudo add-apt-repository\
    \ ppa:danielricher/2007\ngrub-customizer\nsudo apt-get update && sudo apt-get\
    \ install grub-customizer\n```\n\nOnce done, launch Grub Customizer by clicking\
    \ 'Menu' and searching for 'Grub'.\n\n# ## Edit your Grub menu\n\n![](img/09c2db624d208d272aaec8e2a116126d_17_0.png)\n\
    \n# ### 1 Install Grub Customizer\n\nOpen a terminal window and type the following\
    \ commands: \n\n```\nsudo add-apt-repository ppa:danielricher/2007\ngrub-customizer\n\
    sudo apt-get update && sudo apt-get install grub-customizer\n```\n\nOnce done,\
    \ launch Grub Customizer by clicking 'Menu' and searching for 'Grub'.\n\n# ###\
    \ 2 Change defaults\n\nSwitch to the General tab. From there you can change the\
    \ default OS via the prefilled dropdown-menu, or select 'previously booted entry'.\
    \ You can also change the delay before the default entry is selected from this\
    \ tab too—'Boot default entry' to pause Grub until an OS is selected.\n\n# ###\
    \ 3 Change Grub's look\n\nTo make changes to how Grub looks, switch to the Appearance\
    \ tab where you can prettify the Grub by changing its colour scheme, font resolution\
    \ and even add a nice background image (Note: the image needs to be a PNG). When\
    \ you finished making your changes, click the 'Save' button to update Grub."
