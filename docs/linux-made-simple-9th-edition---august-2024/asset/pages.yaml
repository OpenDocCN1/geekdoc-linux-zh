  md: '# # Terminal: Apt-get in action


    New to Linux? Allow us to guide you through your first steps with apt-get, the
    powerful command line tool.


    One of the biggest changes that Windows users moving to Linux is the way that
    software is installed. Instead of downloading an executable file running it doesn''t
    clobber your existing library files (DLLs) or install dubious versions of software,
    which are all backed up for distro and for compatibility with the rest of the
    distro.


    In this tutorial, we will look at how this is done by distros using the Advanced
    Package Tool (apt) software management system as developed by Debian and used
    by distros from Ubuntu to Raspberry Pi.


    # Repositories


    A repository is a collection of software packages. Each major distro will have
    its own repositories, and the packages will be built for and tested there, but
    there are more than a thousand them (as they are usually called), making it easy
    to find what you want. You can also be checked for updates by your package manager
    without needing to visit websites to check, or if you need to have them checked
    now.


    More importantly, each package in a repo is signed with the repository''s GPG
    (encryption) key, which is checked when you install packages. This means you can
    trust the software


    installed from there to be what it says, and not infected with trojan that''s
    been uploaded maliciously.


    A dependency is a program that you want to install as a library. Instead of building
    everything in the package and installing multiple copies of the same library (which
    would waste space), a package simply lists the dependencies that your package
    manager can check and then get them from the repo.


    In the default distro, there are several third-party ones that can be added to
    your package manager. You are not guaranteed to be tested, but many of them are
    very good, and if you don''t go far, you won''t need repos for your distro.


    Ubuntu also includes the PPA (Personal Archive), which are small repositories
    for individual projects. These may be useful individually to your package manager,
    but be careful about adding anything


    # Package management


    ![](img/09c2db624d208d272aaec8e2a116126d_139_0.png)


    We have used the term package manager a few times to show you what it is. This
    is, a program that enables you


    # ### 1 Install


    Using apt-get install will install the dependencies of the packages you want and
    any that that are needed. --dry-run to apt-get install enables you to see what
    will happen without actually installing anything to your hard drive. If you are
    ready, run the command without --dry-run.


    # ### 2 Search


    Use apt-get search to find what''s available. The -names-only option can give
    you a more description of the program. Otherwise use apt-get search for the package
    name and see the results in list. You don''t need to use sudo as search doesn''t
    write to your drive.


    # ### 3 Update


    Run apt-get update to update all your package lists, by apt-get upgrade to update
    all your software to the latest versions. In case, it''s over until. Then apt
    will show you what is updated, and how much needs to be downloaded, before asking
    whether you want to proceed.


