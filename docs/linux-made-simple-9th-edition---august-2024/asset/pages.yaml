  md: '# # Your questions answered


    Still worried about switching to Linux? Let us put your mind at rest.


    You''re now ready to take your first steps into the Linux universe with the Linux
    Mint distro, but before you get stuck, let''s explode some of the common myths
    and help you understand why switching is a great move.


    ![](img/09c2db624d208d272aaec8e2a116126d_18_0.png)


    +   - Isn''t Linux just for geeks - we aren''t anyone!

    - Utter rubbish. Linux and Mint in particular are for normal humans. It''s easy
    to get in and started, and you''ve already found out that installation is easy,
    and it is very useful for professionals and people like yourself.


    +   - Isn''t Linux all the command line?

    - Most Linux use a default desktop environment. You can swap many desktops to
    find one that works for you. The underlying OS is still accessible via the command-line
    Terminal, in a similar way to the Windows Terminal.

    Take some time to learn some of the commands and you''ll find that the terminal
    is a fast and convenient means of getting stuff done. But Mint provides plenty
    of point-and-click tools, and in most cases you can avoid having to use the Terminal
    completely.


    +   - Aren''t there any programs on Linux?

    - Many people develop native Linux programs for their websites before doing anything.
    You''ll also find plenty of open-source alternatives to favourite applications
    you''ve been using in Windows. Mint is renowned for its open-source roots, but
    don''t worry, there is plenty commercial software too. It is also possible to
    run many Windows programs directly in Linux using the Wine utility. We will show
    you how to do it in this feature.


    +   - Can I play games on Linux?

    - You''ll find over 1,900 games are available through the Software Manager alone.
    Select Games from the main screen to Look out for the free DOSBox


    ![](img/09c2db624d208d272aaec8e2a116126d_18_1.png)


    Emulator, which you can use to play your Windows games from the last millennium.
    Also check out Good Old Games (www.gog.com), which offers new titles and all compatible
    with Linux. Steam gaming (http://store.steowered.com) is also a place where you
    can find over 1,600 games - in fact, Linux is a better platform for games than
    Windows because many blockbuster titles are free to buy and download. In fact,
    Linux makes it easier to recognize these.


    +   - Linux won''t support my hardware, right?

    - In the vast majority of cases, you''ll find your PC components work fine with
    Mint, which most hardware devices are delivered with drivers. From Wi-Fi adapter
    to printers and scanners. Also, check CUPS, installing and managing drivers is
    a relatively simple task.

    One area where Linux has really improved is support. Mint uses generic drivers
    during the installation process, but you can replace these with drivers from your
    card''s hardware manufacturer. Click Menu > Administration > Driver Manager to
    search from the open-source repository if it''s supported, or visit the manufacturer''s
    website to manually download the driver.


    +   - It''s free, so guess there''s no support?

    - Take a trip to www.mint.com/links and you''ll find documentation and a vibrant,
    active community support and answers from forums and a chat room. Take the time
    to search on the internet, and you''ll find the variety of answers that have already
    been answered.


    +   - Linux isn''t reliable or secure?

    - Wrong - on both counts. Linux is no less reliable than Windows or OS, and many
    are much more robust. It is far more secure than it is, and not just because of
    the way it handles privileges. Linux''s open nature makes it better scrutinized,
    while the variety of distro makes it less of a target for hackers.


    +   > Setting up partitions in Linux is tricky - and you have access to all the
    tools you need in Mint.'
