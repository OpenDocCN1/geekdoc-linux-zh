    # Re-installing Windows Breaks Linux


    I installed Linux on my computer and it gave me the choice of which to use when
    I turned it. Now I have reinstalled Windows and Linux has disappeared. I want
    to reinstall Linux as well, but is there any other way to get my Linux back?


    > Linux allows the GRUB bootloader to choose between bootloader, but Windows uses
    its own. Bootloader is a small piece of code attached to the start of hard drive
    that starts the process of operating your system. When you installed Linux, Windows
    overwrote the GRUB bootloader. Don''t worry, the GRUB boot code is still there,
    and you can still restore it using Resusc (https://www.supergrub.org/). Boot from
    Resusc and select the Select Option. Then it will search for your Linux partitions
    and you choose the bootloader to install. Follow the steps for the installation
    installation and then each hard disk you want to install GRUB on - /dev/sda. The
    disk window will go for a blank for any amount of time but do not worry or reboot.
    If you see GRUB was there before rebooting, then you will get your old menu back
    with access to your Linux system.


    # Dual-booting more than one OS


    I can dual-boot between Linux and Windows, but can I do the same with more than
    one? Can I share data between them? How should I partition my disk?


