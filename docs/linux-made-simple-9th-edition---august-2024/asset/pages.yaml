  md: '# Don''t even think about installing Linux until you''re backed up...


    There''s nothing worse than attempting to upgrade to a new operating system without
    something to go wrong to. You can replace that of minor irritation by backing
    up your Windows drive (or just before you begin), you will be able to roll back
    if something goes wrong.


    There are numerous backup tools for the job, but for one works beautifully with
    both Windows and Linux — go to http://sourceconfig.net/download and find the format
    instructions on how to download the Backup CD in ISO format. Use a tool to create
    the ISO file, drive it to the Windows 10 drive, right-click and choose ''Burn
    disc image''. If you''d like to create a bootable USB stick, make sure it''s formatted
    as FAT32, then download and run the latest version of Rufus.


    When Windows recovery fails or if you don''t have Windows 10 installation media
    — you may need to use your recovery media with a dual-booting USB. Type ''recovery''
    into Windows 10 search and click ''Create a recovery drive'' to get started.


    Once your recovery and Backup media have been created, insert them into your PC
    with the drive inserted, then tap the option to select your drive at boot menu
    (or (F11) or (F12). Select the drive and then click ''Redo Backup'' when prompted.
    If you''re not trying to boot back from a media


    PC in UEFI header after BIOS mode or Start Again box, for help resolving this
    issue). If you''re unable to Redo Backup-working in any shape or form, by backing
    up the drive with dual-boot Windows imaging tool instead, just use the Backup
    and Restore tool.


    # Back up with Redo


    Next, choose your backup destination — typically the largest partition on an external
    hard drive plugged into your PC, select it or create a folder inside where your
    backup will be stored. Once done, click ''Next'' again. Click ''Save Here'' to
    get your backup. The backup name is the default name, but you can change it. If
    you want to change it, click ''PreMint''. Then sit and wait while Redo Backup
    does the work of backing up your drive. This can take some time, so if you have
    another PC, why not use it while the backup is going? Once done, and the backup
    is completed successfully, you''re ready to install Linux.


    ![](img/09c2db624d208d272aaec8e2a116126d_14_0.png)


    > Quick up

    Live disc

    A cool trick that Linux disks can pull you to: run an entire Linux from a USB
    drive as a Live Disc. This means you can test Linux without installing.


    # Roll back and start again


    ![](img/09c2db624d208d272aaec8e2a116126d_14_1.png)


    # 1 Boot and select backup


    Boot from your Backup Media or USB flash drive. Start ''Redo Backup'' when prompted.
    When the main screen appears, click the ''Restore'' button. First, click ''Next''.
    Select the partition on the physical disk where your backup is stored and click
    Next. Open the ''Select Backup Image'' dialog, browse to the folder where you
    placed your backup in, select the backup job file and click ''Open''.


    # 2 Restore PC


    Click ''Next''. Select the drive that contains your Windows installation. The
    drive will be overwritten with your backup, so read and digest the warning before
    clicking ''OK''. Wait while the drive is being restored, do not use the PC until
    you take the backup. With the backup process, this can take some time, so be prepared
    for a long wait.


    # 3 Boot and start again


    Once the restore process completes, click ''OK'' followed by ''Exit''. Click the
    power button in the bottom right corner of your PC and choose ''Reboot''. Redo
    the Backup media when prompted and press ''Enter''. Your system will reboot and
    find Windows as loads as it did previously.

    You can now install the Linux partition as a correct process to follow.


    ![](img/09c2db624d208d272aaec8e2a116126d_14_2.png)


