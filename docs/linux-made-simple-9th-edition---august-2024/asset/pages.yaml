  md: '# # Gimp key features


    # ## Filters


    The Filters menu has a host of tools for everything from adjusting tonal values
    to blue to cartoon frames.


    # ## Tools


    The tools are a standard photo editing kitbag. Everything you''d expect is here.


    # ## Options


    Beneath the tools you''ll find a full array of customisation options for tweaking
    their use.


    # ## Layers


    The Layers window acts much as in Photoshop. You can split an image, add extra
    layers and edit areas.


    ![](img/09c2db624d208d272aaec8e2a116126d_68_0.png)


    however, all nicely will be bumped up at the lefthand side of the graph with a
    flatline towards the right. The best way to correct this is to drag the marker
    from the right towards the area where the tonal values kick in, reducing the tonal
    range of the image to those that have realistic contrast.


    If you''re lucky, this will brighten your picture without destroying detail. Because
    the midpoint will auto-adjust introduce contrast, merely changing the brightness
    would work out.

    As if not enough, single tools can also act to correct the "white balance" of
    your picture. For example, you might have captured a yellow cast from the photo
    indoors, from the overhead lights. To remove this, you can use one of the three
    pipette symbols in the same level adjust.


    From left to right, these allow you to select the black, gray point and white
    point of an image. Gimp will work out what the other colours should like from
    there. The white point is the easiest to use – just click it on an area of pure
    white. If there are any clothes or tables, select that as your white point and
    watch the image adjust to something natural looking.


    And no worry if you don''t get it first time. Just click on an different part
    of the image or the Reset button if it goes wrong.


    That''s really scratching the surface of what Gimp can do. In the basic toolbox
    you can scale images, draw paths, add or edit text. The only way to learn is to
    try it.


