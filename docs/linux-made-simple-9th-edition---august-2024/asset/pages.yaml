  md: '# # PDFs: Edit and annotate


    Portable may we edit PDFs, but accessible? Not without a little hard work and
    determination.


    > Quick tip

    LibreOffice is capable of editing PDFs, but it''s not easy when it comes to editing
    them. If you have a complex task to perform...


    We''ve all been there, haven''t we? They''re neat document packages which contain
    all the fonts and layout information required to display exactly what the creator
    intended, without requiring any software to view them. They''re also, incredibly
    small. Now the portable PDF format is universally supported by any system, always
    displayed correctly, and - at least these days - outjustified by almost any device.


    But there''s a catch: PDFs can be one-way streets, documents designed to be read-only.
    Editing a PDF is not an easy task, but there are ways to get information out of
    PDFs, ways to tweak documents, and ways to create new PDFs from source material.


    and optical recognition to extract text from images. There are free evaluation
    versions of both versions at qoppa.com. Slightly easier on the wallet at £36 is
    Master Editor which pretty masterful at the task of editing PDFs, and also exporting
    to image formats with a lot of functionality. There''s a reduced price, as far
    as we can tell, miễn to download so you can see if you like it before you pay
    the cash.


    There are ways to perform the main functions of proper PDF editors without shelling
    a penny, but they are limited in one way or another. So let''s look at a few of
    the tasks OCR can perform and how it helps.


    # ## Optical Recognition


    OCR, as it''s well tough-known, is the process of getting words out of images.
    If you''re sent a PDF of a scanned document, that''s exactly what you''re dealing
    with - a picture in a package. In order to turn these pictures back into editable
    text you''ll need to, in basically, take a bunch of pixels to work with, understand
    what letters they represent, then output that text.


    We''d recommend a package called gsc2pdf for this task, it''s great for beginners
    and alike. Another task you asked about is that it also has an OCR feature built
    in. It''s installed from your package manager, and you''ll need to hit [Ctrl+T]
    to use it. If it''s not quite enough, use Tesseract OCR engine to adjust the text
    on a page. While the one engine might get a few mistakes made, the other engine
    will get much fewer. Your work will come out well, and your image should be adequate.


    Now let us run the OCR process. Go Tools > OCR, and you''ll see Tesseract as an
    option. This engine is a powerful command-line tool, but it''s difficult to run
    without some help - which is why gsc2pdf is so useful for us. Check Threshold
    OCR, and start OCR. Click the OCR output tab, and you''ll see the results. If
    they''re not right, you can click words to correct them if you spot any issues.
    Hit [Ctrl+S] to save, and then edit your PDF in the view of your - you can now
    select the text with your mouse and copy to your heart''s desire.


    # ## Money matters


    First, let''s talk about commercial options available in Linux. There are two
    PDF editors on the market: PDF Studio and Master Editor. The former comes in two
    versions: Standard (£9), which can convert most documents to PDF, add annotations
    and comments to documents, merge, or password protected PDFs. For proper editing
    you''ll have to pay for the Pro Version (£19) which also adds batch processing


    ![](img/09c2db624d208d272aaec8e2a116126d_51_0.png)


    +   * Gsc2pdf, using the Tesseract OCR engine, does inject text from images but
    with more complex fonts.


