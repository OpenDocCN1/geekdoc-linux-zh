  md: "# Shotwell: Photo management\n\nLooking for that snapshot? Gather your photos\
    \ and check out Ubuntu's built-in photo app.\n\nS hundred and twenty billion.\
    \ That's how many photos are uploaded to Facebook every year. And there are chances\
    \ that all of the photos that you take every will survive. To put that in perspective,\
    \ we take a lot of photos, and even if single one is a 'keeper', the chaos is\
    \ far more complex than the cardboard box of all them. Fortunately, there are\
    \ a few tools to help you sort through your library.\n\n> > Quick tip\n The import\
    \ function in Shotwell will automatically copy images from a camera or USB drive\
    \ and index them in Shotwell.\n\n# Shooting to Snapshot\n\nBy default, there are\
    \ two ways of managing your photo library in Ubuntu. The first is to use the file\
    \ store. As your photos are organised into folders on your hard drive in a way\
    \ that has meaning to you, such as date, you have a thumbnail view which can help\
    \ you identify pics looking through your library. Just press Ctrl and spin thewheel\
    \ to zoom in on a larger image for your library.\n\nOrdering your library is essential\
    \ for better ways of living. In Ubuntu, the photo manager Shotwell is nicely in\
    \ appearance, but boasts tools for organizing your photos. First of all, you'll\
    \ need to create albums. Go to Preferences and you'll find an option to define\
    \ your library. This is simply the folder on your hard drive where your photos\
    \ are stored. If you have a lot of photos, you might want to keep them on a separate\
    \ drive.\n\n![](img/09c2db624d208d272aaec8e2a116126d_65_0.png)\n\n+   - Selected\
    \ Information from the Menu to give the full detail of an image's EXIF file. This\
    \ file may include location data where the shot was taken.\n\nOnce you set up\
    \ your library, Shotwell will begin the process of indexing it. It will locate\
    \ images in folders that are outside the main library, so don't worry if you put\
    \ a pic in somewhere. Shotwell will index it through—this can be a slow process,\
    \ and known to lock up if given too many files.\n\n# Navigating Shotwell\n\nThe\
    \ way Shotwell creates its index is using the metadata stored in the photo. The\
    \ most basic metadata is the date an image was created. Once Shotwell has finished\
    \ your import, you can browse by date to quickly jump to a particular month, year\
    \ or day. You will see images on the left sorted by date, with the newest first.\
    \ If you scroll down, you will go back through your library sequence at a time.\n\
    \nSelect a year, and the thumbnails on the right will show months. Click a month\
    \ to see an album for that particular date. Then Shotwell will allow you to see\
    \ all the shots on that day in 'Events'. If you want to better segment your shots\
    \ by time (such as a couple of hours apart), you can create two albums for that\
    \ day. Just right-click on the thumbnail that represents all day and rename the\
    \ Event to something meaningful. You can also combine two events into one album\
    \ if Shotwell will incorrectly split them.\n\nShotwell will also index images\
    \ by tags and location data that exists in the file. If you don't add tags, you\
    \ can add them by selecting a single image and pressing (Ctrl+T). It'll be much\
    \ easier to find a pic later.\n\nThere are a few other features which are standard\
    \ in most photo applications, one which is the ability to tag photos with a star\
    \ or rating flag. You can do this by right-clicking on an image and selecting\
    \ a rating or flag. This is particularly useful if you have a lot of photos on\
    \ a single day, since you can scan through the thumbnails to figure out which\
    \ ones you want to keep. Then go to the menu at the top of the screen and choose\
    \ the Filter option — this hides the unsorted images without deleting them, so\
    \ you can focus on further filtering for 'keywords'.\n\n# Editing from Shotwell\n\
    \nin a similar way, Shotwell also has a built-in editor which will allow you to\
