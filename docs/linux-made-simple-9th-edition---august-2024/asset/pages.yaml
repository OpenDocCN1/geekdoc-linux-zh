  md: '# Files: File permissions uncovered


    Take a breath and launch into the murky world of users, groups and peers in Ubuntu.


    ![](img/09c2db624d208d272aaec8e2a116126d_95_0.png)


    If you share your PC with others, use Settings and Accounts to give everyone their
    own user account and home folder instead of using your Public folder.


    If you''ve migrated to Ubuntu from Windows, you already have thinking about file
    permissions and users, plus the one on the other; but it can still be a confusing
    subject, particularly where Linux is concerned. Once you dive into the world of
    who''s got access to what, acquaint yourself with the essentials of file permissions.


    There are three levels of access to files in Linux, and while they differ slightly
    between files and folders, they follow the same basic principle: read, write,
    and execute. Access to any or all of these permissions can be granted or blocked.
    Access typically means viewing a file or looking at the contents of a folder,
    while write allows you to edit a file and execute allows users to run files as
    programs, or actually enter the folder in question.


    # Grasp the fundamentals


    Despite appearances every single thing in Linux is a file, including software
    and hardware devices. On top of that, the Linux file system - ext3 or ext applies
    special permissions to files that ultimately determine how they''re accessed,
    and by whom.


    These three levels are expressed as (r) read, (w) write and (x) execute. A file
    with all permissions is rwx, while a file with only read access is r--, and one
    that is only read-only is r--. These terms r--, rw-, and rwx are important because
    they''re displayed when you extended


    # Exploring Nautilus''s file permissions interface


    ![](img/09c2db624d208d272aaec8e2a116126d_95_1.png)


    # Owner


    After restricting when permissions through Nautilus is that you can only view
    a file or folder''s owner through the Permissions tab.


    # Change group


    Click the ''Group'' dropdown to view the list of available users on your system
    - refer to hidden users, so do this


    # Access rights


    If you''re not the owner of a file or folder you can view permissions, but can''t
    change them - in Nautilus or the terminal.


    # Execute


    This box requires ticking if it has a run or .bash extension, or if you want to
    run a file as a script. It affects the permissions for all users.


    # Change access


    Click here to change the access level - if you have options in Nautilus. The three
    options show for folders translate to r--, rw-, and rwx respectively.


    # Enclosed files


    This button will apply the same permissions you''ve set for the folder to all
    files inside, ensuring they stay consistent.'
