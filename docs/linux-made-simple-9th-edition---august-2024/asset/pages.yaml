  md: '# # Pidgin: Instant messaging


    Connect with your friends in a network-neutral way and stay chatting to your heart''s
    content.


    ![](img/09c2db624d208d272aaec8e2a116126d_53_0.png)


    By Default Pidgin collects all of your chats in a single window. Just drag one
    of the tabs away to grow it of its own.


    Instant messaging has had a huge impact over the past decade, it''s far from a
    modern concept. We can actually trace digital messaging back to the 1980s when
    the first multi-user instant messaging system was exploded by Impulse in 1980.
    Quantity (and very much reflecting its place in time) they called CB Simulator
    - and if you''ve ever used AIM, Yahoo Messenger, or Skype you know the chat rooms.


    More recently, ICQ (1996) really brought the concept of one-to-one or multi-user
    instant messaging to the attention of the public. At time it was followed by a
    host of other clients: AIM, Yahoo Messenger, MSN Messenger/Windows Live Messenger
    and on.


    Today instant messaging is ubiquitous and everywhere. There is an IM client in
    your email, one on your Facebook account, and one on your phone from Google Hangouts,
    Skype or Messenger. There are more services around now, they''re all universally
    incompatible with each other. If you want to connect with everyone, you''re going
    to have to be on everywhere or you''re going to have to support a host of different
    platforms.


    Pidgin got a job so:


    # Talk is sweet


    First things: a bit of bad news. Apple''s Messenger is, sadly out of reach on
    Linux unless you interface with a jailbreak off-chance through some roundabout
    methods. This is one of the cases where being convincing IM users is very hard.


    The good news is that you can connect to every other major platform, without needing
    to install a specific client. Facebook Messenger can also be accessed through
    Gmail or Skype, and so the fact that you''re using Linux doesn''t make this any
    different.


    Of course, it''s a bit of a pain. Who wants to keep a whole of browser windows
    open the one you signed up a long ago and use another for instant for no reason?
    No should.


    You can also use instant messaging clients for Linux. A number of them are official.
    Skype is quite well-known, but it''s now owned by Microsoft (the client existed
    before Microsoft purchased it). Google offers Chrome Chat that works nicely, supporting
    popular networks without having to keep a proper browser window open.


    There are also unofficial clients, and a stack of them that are generally reliable
    enough to support important instant messaging clients. Here are a few: For Google
    Hangouts, install yajk from your package. For WhatsApp, it''s a bit of a year
    to check out https://www.whatsapp.com/desktop which may or may not - download
    the .deb file for your (32-bit or 64-bit) and install it your package manager.
    For Messenger, use the decently-unaffiliated Messenger for Desktop at messenger.com
    from the same developer as the WhatsApp client.


    # Good words


    So as you''ve realised we''re not faced at all of these ideal platforms clustering
    up our methods of communication. Hit about your mobile phone - where you''d be
