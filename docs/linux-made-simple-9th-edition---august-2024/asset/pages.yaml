  md: '# # Remote desktop

    An easy guide


    You''re over here, but the Windows PC is over there. What to do?

    With Linux, we have a solution: remote desktop connection.


    > > Quick tip

    Another tried-and-tested remote desktop is VNC, available on all platforms and
    through different programs - so try it first!


    ne is never alone. These days most people – especially Linux enthusiasts – are
    likely to have more than one PC in their homes. They have home servers, media
    boxes, laptops and tablets to take control of it. Gamers livestream their gameplay
    – effectively remote desktop from the desktop up.


    Enter remote desktop. This comes in a number of forms, but the basic concept is
    to connect one PC to another over a network (the internet) and take control of
    it. If you''re safe to set in the remote sound - effectively remote desktop without
    Windows.


    Isn''t this a security risk? Well, yes, unless you use strong passwords and limit
    access. But we will explain ways to minimise the risk, the set of which is not
    open to access from the internet world.


    For accessing PCs on your home network we are going to use something called rdesktop.
    This allows you to access your remote desktop, possibly? – Open a terminal and
    type:


    We''re ready to connect to your Windows PC. The client is ready to accept remote
    access. Ensure your Windows box is logged in, locate the Start Menu, right-click
    on it and select Properties > Remote Access > Allow.


    ```

    sudo apt-get install rdesktop

    ```


    It''s possible to tell Windows who can have access. Windows also uses users accounts
    and it''s most sensible to create an account for remote access with restricted
    access. However, if you have main administrator level access, so will by default
    have the privileges for remote access. You can use the Users button to add users
    as follows:


    +   To give a user Remote Access permissions

    * Users > Manage Local Users and Groups

    * List of existing users is shown here. Double-click the user you want to select
    and click Add > OK > Find and select the user. Then you will have remote access
    permissions.


    You''ll need to know the IP address of your Windows system. One way is to get
    the Desktop name,


    We are now to connect from Linux to Windows remote. Using rdesktop from the terminal
    the basic looks like:


    ```

    rdesktop://ip-address>

    ```


    It''s helpful to use a couple of options to increase screen resolution with -w
    <width> to make it full screen, or -h <height> to turn on bitmap coding and if
    you want to use color, use -depth <depth>, where 32 is 32-bit colour, 16 is 16-bit.
    If you add these options, the command looks like:


    ```

    rdesktop -u <username> -P 192.168.1.xxx -d 32

    ```


    You can even read the remote sound, clipboard and other properties using the -P
    option. For sound add-on. Getting technical, for Windows RDP (Remote Desktop Protocol)
    by default Linux has no native remote desktop system installed. As we know how
    rdesktop works, we might well stick with that when it comes to connecting two
    Linux machines together. Before a Linux PC can be connected to, you need to install
    an Rdp server.


    To do this in the terminal type:


    ```

    sudo apt-get install xrdp

    echo "export SESSION=ubuntu-LXDE" >> ~/.xXsession

    ```


    On Ubuntu this is nothing of a worry, as the default 3D Unity works well with
    most remote desktop systems. To get around this if we installed another desktop
    – this will look a little different, but it''s the same system underneath (for
    more on alternative desktop environments).


    ![](img/09c2db624d208d272aaec8e2a116126d_103_0.png)


    > Viewing your Windows from a Linux box - is it easy? What is your experience?


    Linux Made Simple'
