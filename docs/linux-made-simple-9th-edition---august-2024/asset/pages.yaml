  md: '# Install apps in Mint


    How to find and add new programs to your distro.


    Now that you''re up and running in Mint, you''ll be wanting to start making use
    of it. By taking an inventory of the programs you use in Windows and checking
    the website for each to see if a Linux build exists. If there isn''t one, don''t
    panic you''ll find the vast of Windows applications have an equivalent for Linux.
    Still, many of these are free and open source, so you don''t need to splash out
    to use them them, but do donate to them.


    The most obvious place to start is within the Software Manager. If you choose
    to replace your word processor, spreadsheet and presentation tools, you''re already
    using them in Mint from the LibreOffice software, which can be found under Menu
    -> Office.


    If you''re looking for a specific open source alternative to your software you''ll
    find links at http://www.opensource.com or other resources such as. If you can''t
    find anything, try http://alternativ.org/ The simplest way to find software in
    Mint is through the Software Manager. It offers a user friendly front for finding
    and installing programs. Programs are organized into repositories (or repos) for
    your software target. In the repos supported by the Software Manager you''ll find
    alternative ways of getting them. First, visit the program page – you may be offered
    a convenient downloadable installer in the form of a


    ![](img/09c2db624d208d272aaec8e2a116126d_21_0.png)


    +   * Manage your repositories in the Software & Updates, which you''ll find in
    System Settings.


    Deb package - the 32-bit or 64-bit download (if offered) to match the version
    of Ubuntu you have installed. Once downloaded, navigate to your Downloads folder,
    double-click the file and follow the prompts to install it.


    Other programs may require you to install them through Terminal. This usually
    involves adding the first program''s repo using the following command:


    ```

    sudo add-apt-repository ppa:name

    ```


    The ppa stands for Personal Package Archive, which is a special repository - generally
    used on Ubuntu - that you, or a team, can use for uploading software packages,
    and for anyone to distribute the latest version of software without waiting for
    an official release.


    Once installed, you can install packages from the PPA by the software producer.
    You can either do this through the Software Manager or as you''re already familiar
    with the Terminal - using the command: sudo apt-get update && sudo apt-get install
    <program>


    Replace <program> with the program name and it will be downloaded and installed.
    Once added, you can manage all repos via Software Sources.


    > You''ll find the vast majority of Windows applications have an equivalent version
    for Linux


    # Popular alternative applications


    | Word | Alternative | Where to get it |

    |---|---|---|

    | Excel | LibreOffice | Pre-installed |

    | PowerPoint | Access | Software Manager (SM) |

    | Publisher | Scribus | Pre-installed |

    | Photoshop | GIMP | Pre-installed |

    | Windows Movie Maker | OpenShot | Software Manager |

    | Adobe Reader | Document Viewer | Pre-installed |

    | iTunes | Amofark | Software Manager |

    | Windows Media Player | VLC Media Player | Software Manager |

    | Internet Explorer | Firefox, Chromium | Pre-installed or SM |

    | Outlook/Windows Live Mail | Thunderbird | Pre-installed or SM |

    | Skype | Evolution | Pre-installed or SM |

    | | Pidgin | Software Manager |


    # Stay up to date


    Programs install through repos - either via the Software Manager, which checks
    for updates on a regular basis, within 10 minutes of your first boot and every
    time you reboot computer. That is enough for the vast majority of people, but
    you can check manually using one of two methods. The first is to use the Terminal:


    Cinnamon: Menu -> Administration -> Manager and click Check for updates. Preferences
    -> Auto-Refresh tab to change the time interval between updates (days, hours and
    minutes).


    To check for updates via the Terminal, type apt-get update && sudo apt-get upgrade.


    You may also find the latest version in the Software Center - as not up to date
    as those posted on the program''s website - by adding the relevant repos, to ensure
    the latest version of the program is installed, and gain access to beta and pre-release
    builds.'
