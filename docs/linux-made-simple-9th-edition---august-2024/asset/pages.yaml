    # # SOLVED!


    We tackle the common issues and present a collection of solutions that''s to keep
    your system running smoothly and trouble free. Well, mostly.


    # ## Stalled boot


    My computer won''t boot. The splash screen comes up and then it sits there.

    The first thing to do is patient – the boot process may be trying to initialise
    a piece of hardware, or the network before it''s available. You can time out a
    few minutes, allowing either boot to proceed or giving you an error message to
    work with. Splash screen can hide any error messages. You can disable the splash
    screen at boot: if your computer boots without showing a menu, hold down [Esc]
    when


    boots to call the menu. If there''s a recovery or safe option, pick that, as it
    disables the splash screen and often offers (potentially less efficient) boot
    options [E] for edit. Otherwise, push the highlight on normal boot option and
    [E] for edit. Find the line that starts with linux and lock for options like quiet,
    splash, or theme. Delete these options and [F10] to finish.


    This won''t fix your (unless the problem is the splash screen), but will let you
    see what is going on and either an error message or an idea of where the boot
    is failing. If it appears to be a hardware detection issue, try disconnecting
    unnecessary hardware such as printers, scanners or USB rocket launchers. Once
    you get past the problem, you can fix it.


    # ## Boot errors


    When I see error messages among the lines of PCi Express Device Error. Severity
    NN. Uncorrected not Fatal. Press to continue


    Type:N Transaction Layer. Flow Control Protocol N-First. Receiver


    This is a problem I''m experiencing on a newly bought motherboard that works with
    Windows.

    Hard working with Windows is no indication that it''s fault. The ''it works with
    Windows, and it''s not any other problems with an update, but it''s uncommon.
    With mysterious motherboard related, the first step is to check whether there''s
    a BIOS update available. Even with a new brand motherboard, by the time it has
    travelled through the shipping and setup process there is usually a new BIOS available.
    Flashing a new BIOS can fix boot problems if you persist, there is more you can
    do.


    You can change the kernel addresses the hardware with a number of parameters.
    At the Grub menu (press [Esc] if it does not show up by default), highlight the
    normal boot option and [E] (for edit). Edit the line starting with kernel by adding
    some or of these options to the end of the line, separated by a space:


    ```

    noplash

    noaptimer,quiet=off

    acpi=force

    ```


