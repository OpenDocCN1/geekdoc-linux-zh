  md: '# The boot process


    When you press your button, control is initially given to your PC''s EFI or BIOS,
    which starts its components, performing basic diagnostics and finds a boot device,
    which is typically your hard drive. Once, the EFI or BIOS loads the loader at
    the beginning of boot, a program then loads the next stage such as eifs_stage_1,
    which is in turn to load the boot loader.


    The loader then means you need your rescue for diagnostics as either in UEFI or
    BIOS. Once boot succeeds, it loads a file menu, which contains


    list of choices you see in the boot menu. Each entry identifies the drive, partition
    and file that contains Linux kernel, RAM disk used by the kernel, and may also
    contain additional parameters to the kernel.


    Control is passed to the kernel, which attempts to mount the root filesystem.
    This is a system moment, and if it fails you may get a kernel panic or the drive
    might not mount. If it succeeds, it creates a process to run as the /init/ absolute.
    If something goes wrong, you get a panic, or drop you into a root shell. The init
    process then starts up other services and eventually brings you to the login screen.


