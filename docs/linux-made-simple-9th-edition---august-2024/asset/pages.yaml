  md: '# # Openshot: Video editing


    You''ve got some lovely footage, and you''ve got some footage that absolutely
    never be viewed by anyone. Time to slice!


    The likes of Instagram, Premiere and Vine may have made shooting and sharing short
    video clips much easier than in days of y, but what if you want your family to
    see more than 15 seconds of gurning at the camera and add captions, subtitles
    and a title page for her gran?


    For cutting and stitching video with transitions and effects, Openshot is the
    traditional non-linear video editing desktop application. And Fortunately for
    you, Linux has plenty to choose


    You will find Kdenlive in the Ubuntu Software Centre, but it''s best to install
    it using the instructions on its own homepage, as this will include the latest
    versions of packages it depends upon. To do this, open a terminal by pressing
    Ctrl+Alt+T and type the following three lines:


    ```

    sudo add-apt-repository ppa:kdenlive/release

    sudo apt-get update

    sudo apt-get install kdenlive

    ```


    Before installing either of these programs, make sure you have the multimedia
    codecs from the Ubuntu Restricted Extras you will find in the Ubuntu Software
    Centre.


    # Two to pick


    In others you can click on a clip for options such as include and hide, and also
    see tracks on screen in any of the four corners of the playback window.


    For most users in the Ubuntu environment, you''ll likely settle on one of two
    packages. The first is Openshot (openshot.org), which you can install directly
    from the Ubuntu Software Centre. Openshot is a straightforward-free editor that
    makes sewing clips together. For those migrating from high-end video editing suites
    on other platforms and looking for something capable of cutting together broadcast
    quality footage, there''s Kdenlive (kde.org).


    # Your first project


    The very thing to do is where to start. Openshot is to go to Edit > Preferences
    menu and click on the autosave tab. Openshot doesn''t back up your files unless
    you set it to, but it prevents loss at times and crashing, we recommend setting
    this to 15 minutes or more.


    That done, you can get started on your first cut. Back in the main window, you''ll
    see three elements. The white space in the top left will become a list of all
    the video clips


    # Exploring the Openshot interface


    ![](img/09c2db624d208d272aaec8e2a116126d_69_0.png)


    +   - **Bring ''em in**

    Import clips to the current project with the Plus symbol here.


    +   - **Mix it up**

    The Transitions tab is where you will find the blend effects for splicing clips.


    +   - **Extra tracks**

    You add extra tracks with the plus symbol in the middle.


    +   - **Hide it away**

    The eye symbol hides the tracks in this track leaving the audio (volume symbol)
    does the opposite.


    +   - **Opening night**

    The red button exports your video to a file for playback elsewhere.


    +   - **Press preview**

    The preview window on the right shows the current timeline. Use it to inspect
    and edits transitions.'
