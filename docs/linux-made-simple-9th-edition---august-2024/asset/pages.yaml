  md: 'Assuming Mint chooses as drive as Windows 10 to install it, leave at least
    10GB drive space for Windows, and work with Mint if you plan to make it your primary
    OS. Remember that you can always resize or remove the Windows partitions.


    The next stage is where you first type your name – you’ll see the computer name
    pre-filled for you along with your username. You can change these and enter a
    password you’ll need to provide when you, plus an administrator’s password for
    performing certain tasks.


    Once you’ve set up the drive, click ‘Install Now’. Make sure click ‘Continue’.
    You’ll be asked to confirm the proposed partitions – default Mint will create
    two partitions (the Ext4 is your Linux partition. Continue creates a dedicated
    swap partition). Click Continue to apply the changes.


    Only log in automatically if your PC is not shared, and if you’re installing Ubuntu
    on a laptop click Import my home folder to save any data you would like. Click
    ‘Continue’ and you’re – Mint will install in the background. You can go off and
    make a cup of coffee (or tea) while you wait around and sit and see what features
    that Ubuntu offers. Learn more by using the Software Center. Once installation
    finishes, click ‘Restart Now’, remove the installation disk or drive and hit Enter.
    Ubuntu is now installed, follow to find out how to start your system.


    Next, the installer will detect your location, setting on London in most cases.
    You can accept this or type the name of your largest town to if it’s recognised.
    Click ‘Continue’, then set your keyboard layout.


    ![](img/09c2db624d208d272aaec8e2a116126d_16_0.png)


    # Manually configure your drive for dual-booting


    ![](img/09c2db624d208d272aaec8e2a116126d_16_1.png)


    # 1 Launch GParted


    Boot your Mint install media. When the ‘Menu’ button in the bottom left-hand corner
    and search in the box ‘GParted’. The GParted editor will appear when it launches.
    If you’re resizing Windows (/dev/sda), you should see at least two partitions,
    one of which is your Windows partitions. Right-click this and select Resize/Move.


    # 2 Create free space for Linux


    Click on the right slider and drag it to free up enough space for your Ubuntu
    install – leave at least 10GB free space for Windows. Once done, click ‘Resize/Move’
    then the ‘apply operations’ button, select the partition you want to complete,
    then click ‘Close’. Double-click the Linux Mint ‘shrink here’, select ‘English’
    and click ‘continue’.


    # 3 Start partitioning


    Both partitions have been selected and click ‘Continue’. Select ‘Other’ unless
    you want to use ‘Automatic’. Click ‘Continue’. Select the free space and click
    /dev/sda and click the ‘+’ button to set up your first partition. Set the size
    to 4096MB, type as ext4, mount point as /, and then select ‘End of this space’.
    Click the ‘Use as:’ drop-down menu and select ‘swap area’ and click OK.


    ![](img/09c2db624d208d272aaec8e2a116126d_16_2.png)


    # 4 Set up Linux partition


    Select the free space and click the ‘+’ button. Set the partition size to 12000MB
    (12GB), label ‘Linux’, beginning of this space and select ‘ext4 journaling file
    system’. Select the ‘Mount point’ drop-down menu and enter / to make the partition
    for Ubuntu to reside on (if you have plenty of free space, make it bigger). Click
    ‘OK’ again.


    # 5 Create home partition


    Select the remaining free space and click ‘+’ again. Leave everything else as
    it is, except the root point, select home before clicking home: ‘OK’. The home
    directory is where everyone’s personal files and settings, pictures and programs
    are stored, so make sure it’s the biggest partition of them. Once done, review
    your changes.


    # 6 Set boot partition


    If you need to set up your partitions again, select each of the partitions in
    turn and click to remove them, then return to step three. The device for boot
    loader installation’ drop-down menu should point to drive (/dev/sda), which is
    the case before clicking ‘Install Now’. Review your partition settings and click
    ‘continue’ to apply them and install Mint Mint.


    ![](img/09c2db624d208d272aaec8e2a116126d_16_3.png)


    Linux Mint Simple | 17'
