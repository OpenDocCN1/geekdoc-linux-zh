  md: '# # Unwanted desktop environments


    You can install many desktop environments as you like – aside taking up space
    on your hard drive, they don''t consume any resources unless you are running them.


    But there may come a time when you''ve finished experimenting with desktops, settled
    on your favourite(s) and want to remove them


    remove the rest. It goes without you shouldn''t be logged into the DE that you''re
    planning to remove.


    Withunderset out of the way, removing the desktop is best done from the Terminal,
    particularly if you plan to remove all the desktop environment you installed.


    Here''s the two commands you''ll need:


    ```

    $ sudo apt-get remove packagen

    $ sudo apt-get autoremove

    ```


    Replace ''packagename'' with the desktop''s package name, which will be one of
    the following: cinnamon plasma-desktop (KDE) plasma, gnome, or xfce.


    need in you''re lucky to have. Despite the differences, you''ll notice similarities
    between many Linux DE. That''s because they are basically variants of Gnome. Unity
    is the obvious example, here are many examples of them, and before one of similar
    applications, using the GTK toolkit that Gnome uses. The big rival is KDE, and
    its differences extend the fact it uses the Qt toolkit rather than Gnome, but
    that makes it more popular with advanced users.


    There''s also a question of performance and consumption. Some environments are
    more resource hungry than others. KDE Plasma 5 comes with many benefits, such
    as a wide range of tools and features, which are missing from lightweight alternatives
    like XFCE. But that means they''re less fast and consume more power-consumption.


    The best thing is to run a couple of them and see how the screen looks – you might
    not notice a smaller difference with faster PCs. They also place more demand on
    power consumption, which should benefit from running on batteries. Remember, thanks
    to the fact you can easily switch between desktops, you''ll consume less power
    on the road, with a much more favourable environment for when plugged into the
    mains.


    You''re ready to start experimenting with desktops, but how do you install them?
    In some cases you can simply search for the desktop using your distro''s software
    centre, but for others


    you may have to manually add the条例 (repos) before installing them Terminal.


    In case of Ubuntu, you''ll find Xfce type in the search box to locate it. Gnome
    and LXDE are available in Software Center. Click Install when you''ve found one
    – because they usually ship with optional components added, which you might want
    to review before clicking the ''install''. In case of Cinnamon and KDE Plasma
    5, you should open the Terminal, enter:


    ```

    $ sudo add-apt-repository ppa:cinnamon/cinnamon

    $ sudo apt-update && sudo apt-get install cinnamon

    ```


    For KDE Plasma 5, use the following:


    ```

    $ sudo add-apt-repository ppa:kubuntu-backports

    $ sudo apt-update && sudo apt-get install plasma-desktop

    ```


    # Working with desktops


    When you''ve installed a new desktop, you can log out. When you find back at the
    login screen you''ll see a new icon. Click it and you''ll see the desktop window
    – in some case you have multiple options available on a single desktop. Select
    one, then enter your password and log in to start using it.


    When you log into a new desktop for the first time, some of your experiences will
    come from your old DE (but don''t worry, they''re all there, ready and waiting
    for the next time you log into your original desktop). The benefits of having
    to make changes to your new desktop is how easy it is to focus, exploring into
    how it works and what you can perform –


    # Customise your new elements


    ![](img/09c2db624d208d272aaec8e2a116126d_102_0.png)


    ![](img/09c2db624d208d272aaec8e2a116126d_102_1.png)


    ![](img/09c2db624d208d272aaec8e2a116126d_102_2.png)


    +   1 Tweak the taskbar

    The Cinnamon bar is called the panel and is split into three sections: menu, button
    app shortcuts and tasks. You can pin shortcuts to it by clicking. Right-click
    ''Pin to task''. Right click will reveal more options: like adding apps or adding
    a second panel (choose ''Modify panel...'').


    +   2 Customise look and feel

    Click the Menu button and select the ''System Settings'' to change the Cinnamon
    looks. In the Appearance section, you can change the background and system font
    (you''ll see options from other desktops you''ve installed). Try the ''Add/remove
    desktop themes...'' you can download more themes to pick from.


    +   3 Change behaviour

    Hot Corners enable you to perform actions that occur when your mouse goes into
    a corner of the screen, showing the desktop or displaying windows. Windows is
    where you can extend the windows and back to the display of the taskbar switcher.
    The Extensions allow you to customise using third-party plugins.


    Linux Made Simple | 103'
