  md: '# # Exploring the Gigoloc Interface


    Change view

    Gigoloc''s interface is a bit bare: select Edit > Preferences > Interface tab.
    Tick ''Show side panel'' and set Connect List Mode to ''Detailed List''.


    Shortcut

    Click either of these two buttons to open the shared folder in Files or Temporary
    – a handy time saver when managing.


    Quick connection

    Gigoloc can be used to quickly connect to non-mounted drives – just tick the box
    to make the connection.


    # Browse network


    Select the Network tab and Gigoloc will find your local network – you will be
    prompted if it finds any (click Scan).


    Tick the ''Marked'' in the Notification Area and click Close.


    # Share folders with others


    If you want to share a folder on your Ubuntu PC, the steps can be simple or complicated
    depending on your needs and usage of sharing files. You may find yourself in setting
    up folders that only specific people can access. Thankfully, if you want to set
    up a public for folder (no password required) or a private folder that requires
    your username and password, then there are a less complicated options.


    ```

    sudo apt-get install samba

    sudo apt-get install samba-common-bin

    ```


    Once logged in, you may see a message letting you know that your profile has been
    added to Samba''s sharing group. Now the folder you wish to share – for simplicity''s
    sake (and to ensure you have all the right permissions) make sure this is a folder
    made inside your personal Home folder. Right-click and choose Preferences, then
    switch to the ''Local Network Share'' tab. Tick ''Share name'' for the folder
    to make it easier to identify on the network.


    If you want to open up your folder on your network, ticking the ''Guest access''
    ... under the ''Local Network Share'' tab of the shared folders is sufficient.
    If you want to restrict the shared folder to your users, uncheck ''Guest access''
    – this shared folder will need to require your Ubuntu username and password to
    access it.


    Next, decide whether users can copy to the folder as well as create and delete
    files within it (with the ''Allow others'' box), click ''Create Share'' or ''Modify
    Share'' followed by Add the permissions


    ![](img/09c2db624d208d272aaec8e2a116126d_100_0.png)


    # Add bookmark


    Connect to your folder first so it appears in Gigoloc''s main window, then click
    its entry and choose ''Add Bookmark''.


    # Configure bookmark


    You can configure folders to mount automatically with Gigoloc (or when boots)
    – tick the ''Auto-Connect'' box when setting it up.


    automatically if the shared folder is visible and accessible to the network to
    all connected computers, Apple Macs and Windows PCs. You should also use a two-way
    arrow on the icon of the folder to indicate it is shared.


    > Quick tip

    If you''re taking your shared folders to the next level, check out the GMAN-Samba
    package available through the Software Center. It allows you to customize user
    profiles for sharing folders.


    # Beyond the basics


    By default, your PC''s network group is WORKGROUP. If your computers are on a
    different network group you can join them by opening Terminal and typing:


    ```

    sudo nano /etc/samba/smb.conf

    ```


    A text editor opens. Use the cursor keys to scroll down to the [global] section
    and change the line to match your group:


    WORKGROUP=WORKGROUP

    Press [Ctrl] + O and Enter to save the file, press [Ctrl] + X to quit and return
    to your PC: You will be back on the correct group, which will make it easier for
    other PCs to see


    ![](img/09c2db624d208d272aaec8e2a116126d_100_1.png)


    > Configuring your own folder is relatively simple, as long as you keep your permissions
    in check.


