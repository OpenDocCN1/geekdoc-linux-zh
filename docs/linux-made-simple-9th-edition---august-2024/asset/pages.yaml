  md: '# # VirtualBox

    # Virtualisation


    Find out how virtualisation can tap into your PC''s unused processing power to
    help you run multiple operating systems.


    ![](img/09c2db624d208d272aaec8e2a116126d_105_0.png)


    To get your VMs running, enable VT-x or AMD-V acceleration in your PC''s BIOS
    or UEFI. [INLOG2](http://example.com) to see if it''s supported. If it is, make
    sure it is enabled in the software manual or for instructions.


    Today''s multi-core PCs can run multiple tasks simultaneously, and with better
    hardware to tap into all in particular, virtualisation is the process of splitting
    a single server into multiple virtual PCs (referred to as ''guests''), each of
    working independently of the other.


    Virtualisation allows the host to carve up its memory and resources into individual
    parcels with one or more guests. If your PC is powerful enough, you can run multiple
    machines in parallel, enabling you to split your computer into several operating
    systems without having to buy multiple PCs.


    Virtualisation is simply a means of dividing up resources. It allows you to run
    multiple operating systems in a safe, sandboxed environment—you can experiment
    with new software without risking your host. For example, it can be used for compatibility
    purposes—you might have switched from Windows, for instance, but want access to
    a Windows machine to run old programs.


    VirtualBox may be free, but it''s still a powerful option that offers both a friendly
    graphical front-end for launching and managing your virtual machines, plus a raft
    of command-line tools for those who need them. Ubuntu Software Centre, but for
    the purposes of this tutorial we will download VirtualBox from [https://virtualbox.org/wiki/}.


    You will first find that it is easy to set up a guest, each geared towards a specific
    distro (or distros). Both 32-bit and 64-bit (AMD64) versions are provided as downloadable
    and debable files, or you can follow the instructions added to the repository
    to your source list.


    Once installed, the quickest way to get started is to use the Manager. This is
    where all your virtual machines can be listed (organised into groups). It''s where
    you create new VMs from scratch, before you use Preferences to configure the machine
    folder if you want to store your virtual machines settings elsewhere than your
    own home folder.


    # Create your first VM


    When you click New, a window will appear; click Next to create your first virtual
    machine.


    The Virtual Machine Wizard works in two of ways: Guided or Expert. With Expert,
    you can define all three configurations in a single start. By choosing your operating
    system from the dropdown list—


    VirtualBox supports all major OSes, including BSDs, Solaris and OS/2, Linux, Windows,
    and more— The drop-down list depends on your selection, all the major distros
    as well as Linux kernels from 2.2 onwards available.


    # Choose VirtualBox


    There are many virtualisation solutions available for Linux, but what better to
    meet your needs (even just toes in the water) with the open-source solution.


    It is important to choose the right OS and version because this will ensure that
    all other settings are set correctly for your virtual machine. The size will be
    set to a comfortable memory setting, so feel free to alter the size—it''s coloured
    green, amber and red to help you set the memory to a level that''s comfortable
    for your host PC. The figure you see is actual RAM, virtual memory, or


    ![](img/09c2db624d208d272aaec8e2a116126d_105_1.png)


    > > VirtualBox allows you to set up, manage, and run multiple guests from the
    comfort of your desktop.


    Linux Made Simple'
