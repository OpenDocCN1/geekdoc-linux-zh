  md: '# # Linux Formatting


    Back in your document, duplicate your dummy text a few times (select it with [Ctrl]+A,
    copy it with [Ctrl]+C, paste it with [Ctrl]+V) to fill up the page. We''re going
    to use Writer-defined styles. Click and drag your mouse to select the first sentence,
    the drop-down box that says ''Default Style'' and change its style to Title. You
    will also notice the changes to the text once. It changes its size to 28pt, Bold
    sans-serif font. Select the rest of the text and give it "Text body".


    As you hover over the styles, you might notice a little arrow to their right.
    Hover over it, hit the menu then select Edit. Use the Autocomplete checkbox. Now
    we''re going to highlight the main benefit of using styles rather than changing
    fonts and sizes manually: they stay consistent throughout your document, making
    everything nice and consistent. Use the format tab and click on what you like,
    hit Apply to cursor to set the text to pre set formatted lists, highlights, drop
    caps and more. A more visual way of doing this, manually select the text you want
    to change, just drag to highlight it, then hover over it the desired style and
    click "Update to selection".


    # # Finishing touches


    Our newsletter needs a header, so go to Insert > Header and select Default style.
    This shapes your pages and automatically scales our separator to fit. Click your
    mouse in the header area to move the cursor there and type whatever text you want
    to include. If you''d like to add an auto-numbering page number, put your cursor
    where you''d like it to be and go to Insert > Fields > Page Number.


    # # Getting Around Writer


    # Styles


    Text styles, accessible through this menu, are vital if you want to create documents
    without a lot of fiddly work.


    # Look sharp


    Bold, underlined and strikethrough probably doesn''t warrant a text style of its
    own, so highlight the text and click these buttons to apply them.


    # Frame up


    Text frames can help you place items (including images) that others get pushed
    by page margins or columns.


    # How are you doing?


    This quick counter tracks the number of words and characters you''ve written -
    if you''re writing to a limit, it''s essential.


    # Quick correct


    Spell and grammar errors are highlighted by a jagged underline, just as they are
    in Microsoft Word. Hit [F7] for more thorough spellcheck, or [Shift][F7] to turn
