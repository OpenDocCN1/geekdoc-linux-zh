  md: '# # Hardware difficulties.


    Solving problems with recalcitrant bits of kit.


    # ### Finding drivers


    **Where do I get a driver for Hardware?**

    Check the included disc includes Windows drivers.


    **Most hardware does not require separate drivers**

    Linux: the kernel includes drivers for a massive range of hardware. Nine times
    out of ten, the kernel recognizes the hardware when you plug it in and loads the
    appropriate driver without any input from you. Some may require separate drivers,
    others that cannot be included with the kernel. In such cases, a CD as Kernel
    System or USB CD will offer to recognize the device - then extra drivers. If the
    hardware is internal, it will also show up in the output list, and adding the
    -k option shows which driver is being used.


    Once you know that, you can search for drivers either using your package manager
    or a web search. If it''s a standard package that''s not installed by default,
    as is the case with many wireless drivers, the package is all you need to get
    the hardware


    working process. Use the lsusb command, and there is no handy -equivalent. Note
    that on some systems, this can only be run as root. If no driver is supported
    by your kernel, you can use your package manager to try downloading and installing
    drivers directly from a manufacturer''s website. If they provide a deb or RPM
    package for system use, then you are in luck. Otherwise, get the right driver
    for your hardware and follow the installation instructions. After that, you will
    probably need the kernel source and build-essential packages.


    # ### Random characters


    Computer is suffering from random characters and locking - it doesn''t seem to
    be related to any particular piece of software.


    This may be a hardware issue. Faulty memory can cause this, and the way Linux
    makes use of all available memory it is much more likely to do so in Linux than
    Windows. Test the memory with sudo memtest8+. It is not as easy to run without
    root privileges.


    overwhelming. It is also a common cause: running a system monitor or Taskbar to
    check your system temperature. Make sure all alerts are clear and if you suspect
