  md: '# Take a snapshot


    Your VM is now set up and ready for action. It should work exactly the same way
    as any physical machine, but it has one crucial advantage: snapshots. Snapshots
    let you take backups of your VM at specific point in time. You can then proceed
    to use the knowledge or roll back to the snapshot and undo all the changes you''ve
    made.


    You can create snapshots while your machine is powered off, or during use — just
    select Machine > Snapshot to save your snapshot. Give it a name and add a description
    if you want, then click ''OK''.


    When you restore a snapshot, VirtualBox starts recreating the changes in a different
    file. If you delete a snapshot, those changes are merged back into the main file;
    if you roll back to an earlier snapshot (the base image), a new snapshot is created
    when promoted. VMS support multiple snapshots, allowing you to move between them,
    or create multiple sets from within a single session.


    # Terminal usage


    VirtualBox interface may be a convenient way to manage your virtual machines,
    but you can also learn to use the command line. There are a number of command
    tools that work for you; you can even bypass the graphical interface with VirtualBox
    Manager if you prefer to work via command line. VirtualBox commands, like create
    and startvm, are very powerful and there-are a number of things you should consider
    next:


    The first is VBoxSDL—start if you''d like to launch your VM in a ''pure'', distraction-free
    environment (with no of the controls offered by the default window). This is the
    tool for you, if your usage is pretty straightforward.


    VBoxSDL --start <name>


    ![](img/09c2db624d208d272aaec8e2a116126d_108_0.png)


    Replace <name> with the name of your VM (or its ID). If you''re not using it,
    you''ll only have access to the commands offered by the VirtualBox window, but
    there are some shortcuts you can use. For example, press [CTRL]+F] to toggle full-screen
    view, or [CTRL]+H] key to take a snapshot. Press [H] to cut the AC power, or [P]
    to pause and resume; [Q] to power off (or reset). Finally, press [CTRL+E] to shut
    down the guest machine.


    VBoxManage --vm <name> startvm


    Another handy command-line tool is VBoxHead, which enables you to run your virtual
    machine headless. To do this — you will need to access it remotely from another
    computer (check out headless setup).


    Whether you choose to use VirtualBox from the command line or GUI, it''s packed
    with powerful and useful features that will convert you to the possibilities and
    power of virtualisation. You''ll wonder how you ever copied before!


    ![](img/09c2db624d208d272aaec8e2a116126d_108_1.png)


    +   - Remove the desktop peripherals and run your guest in a clean, distraction-free
    environment with VBoxSDL.


    # Extend the size of your VM


    ![](img/09c2db624d208d272aaec8e2a116126d_108_2.png)


    ![](img/09c2db624d208d272aaec8e2a116126d_108_3.png)


    ![](img/09c2db624d208d272aaec8e2a116126d_108_4.png)


    # Consolidate snapshots


    If you contain snapshots, the resizing process will only include the original
    base image. To resolve this, right-click the VM and choose settings. Then add
    ''old'' to the end of the list. Click ''OK'', then right-click the VM again, but
    this time Clone. Click ''Expert Mode'', then rename and ensure ''Full Clone''
    and ''current state'' are selected before clicking ''Cloning'':


    # Resize disk volume


    Close VirtualBox. Open terminal and to the folder containing your VDI file. Use
    the following command, replace <vdi> with the path of your particular VDI file:


    ```

    VBoxManage modifyhdium "drivename.vdi" --resize 100000

    ```


    The resize is figure in MB, so 100000 equals 10GB.


    # Extend partition


    The drive has been resized, but now you need it to recognize it. Boot your VM
    having an ISO of the QParted Live and then use it to resize the partition. You
    may have to extend the extended partition first, then move the swap space to the
    end before resizing the partition to make the space available.'
