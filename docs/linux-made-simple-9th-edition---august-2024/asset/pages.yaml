  md: '# # Compression types


    There are two types of compression: lossless and lossy. Lossy compression achieves
    reduction in quality by discarding data that does not significantly affect the
    result (JPEG and MP3 files, for example). Lossless compression achieves compression
    by returning exactly where you started. There are a number of lossless compression
    methods available, here are some of the most common:


    +   * **Deflate** By Zip it is ideal but not particularly effective, it is fast
    and well known.

    * **Compress** A Unix and Linux compression method. Its files have a .z extension,
    but you are unlikely to see them in the wild. There are several issues with it.

    * **XZ** This most recent program uses the LZMA2 compression algorithm and it
    is also used by Zip. It works brilliantly. It is the compressor of choice for
    many Linux projects, including Coreutils and the kernel itself.


    Zip replacement is completely open and still in use. Gzip produces smaller archives
    than Zip with its default settings. It does not decompress files, but it decompresses
    quickly, making a good choice when size is not the most vital concern. Bzip2 offers
    better compression but at the expense of speed. Compression can be powerful, but
    it produces more complex files.


    | Method | Type | Size | Rate | Date |

    | --- | --- | --- | --- | --- |

    | gzip | text | 69.8 KB | 12.7 MB | 2022-06-08 |

    | bzip2 | text | 111.2 KB | 10.7 MB | 2019-07-03 |

    | tar | text | 278.0 KB | 4.5 MB | 2019-07-25 |

    | xz | text | 78.0 KB | 2.6 MB | 2019-08-14 |

    | none | text | 55.0 KB | 10.0 MB | 2019-08-18 |


    Here is the same archive using different compression programs. The Gzip version
    is significantly larger, but faster to compress and decompress.


    compression, bzip2 compression and XZ uses compression. (Watch caution!)


    There are also versions of the command that make the makes smaller, but not as
    well as Zip or shorter than a tar. However, we have also used this command line
    with `tar --create --gzip file.tar.gz`


    The file is not extracted, but it''s a container that allows people to see what
    type of archive it is. For unpacking, it is simple matter of extracting a tar
    with `tar -x -f`. To extract, you may need to decompress it first, such as `tar
    xf file.tar.gz`.


    Other you may want to add a file to a tar to show what tar it is. If you want
    to decompress an archive without unpacking it, if you have created an archive,
    a backup, you may want to check it before relying on it. The test option checks
    the integrity and lists the contents of the archive.


    ```

    tar tf file.tar.gz

    ```


    Those are the main archives, but the program has many such, as A or --concatenate
    to add files to an existing archive without creating a new one.


    # # Future proving


    We may find that tar can compress any archive because it places compression to
    another program. Another program can use gzip as input to this archive, but what
    if someone comes with a new program? What something like super-duper compressor?
    You could create an uncompressed archive and use tar to compress it, but that
    is wasteful and slow. Use a pipe:


    ```

    tar c f - | gzip > file.gz

    ```


    Here, we have used the --create option with tar. This method allows tar to send
    the archive data to stdout, which is then piped to the compressor program. The
    second command reverses the archive before sending it to tar.


    ![](img/09c2db624d208d272aaec8e2a116126d_142_0.png)


    TAR - KDE Man Page Viewer


    # TAR


    Section Contents


    - The GNU description of the tar archiving utility


    # # SYNOPSIS


    tar [options] [-c] [-d] [-f archive] [-delete] [-x] [-t] [-extract] [-xquit] [options]
    [file...]


    # # DESCRIPTION


    tar creates an archive from a tape device or extracts one.


    The first argument to tar should be a tape device, one of the list files, or a
    filename. If you are creating an archive, the filename must be prefixed with -f.
    With some options, tar may take a parameter, and if you are extracting an archive,
    it may be separated from the archive by a space.


    # # OPTIONSLIST


    Tar the compressors have man pages, with many options. You''ll only need the ones
    covered here:


