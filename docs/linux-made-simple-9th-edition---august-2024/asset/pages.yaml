    1.0 was released in 2002.


    Gentoo has the distinction of being one of the most creative and appeals to users
    who want full control of the software that is installed and running on their computer.
    Gentoo users get to create their system from the ground up; the distro encourages
    them to build a Linux kernel to their particular needs. Freedom of control is
