  md: '# # GParted: Set your partitions


    Divide up your hard drive using partitioning to protect your data and make Linux
    easier to work with.


    network, or setting independent partitions for temporary files, your swap file
    or to run specific services like a web server. Whatever your needs, partitioning
    can be a crucial step in improving performance as well as protecting parts of
    your drive from each other.


    # Partition types


    Hard drives are partitioned according to a schema. There are two main types of
    schemes: the older Master Boot Record (MBR), which is limited to the first 2TB
    of a hard disk, and the newer GUID Partition Table (GPT). In both cases, partition
    information is recorded physically at the end of the drive in a partition table
    – GPT also stores this information at the other end of the drive for redundancy
    purpose.


    One of the limitations of the older MBR scheme is that it only supports a maximum
    of four partitions, one of these can be an extended partition, which in turn can
    hold multiple logical volumes. GPT doesn''t differentiate between primary and
    extended (logical) partitions and supports up to 128 partitions.


    GPT is designed in conjunction with modern UEFI but in some cases it is not compatible
    with legacy BIOS systems. If you''re using a system with a drive over 2TB in size,
    but ultimately GPT depends on what you rely upon other systems, it''s safer to
    stick with MBR and if you''re planning to wipe the drive completely and install
    Linux on scratch, let your desktop choice be best based on your current setup
    and make sure that you set this up post install.


    ![](img/09c2db624d208d272aaec8e2a116126d_91_0.png)


    Partitioning allows you to turn a single physical hard drive into smaller, virtual
    drives named partitions or volumes. Each volume acts independently of the others,
    providing a measure of redundancy for data spread across the drive. If one partition
    develops then you can restore it without affecting what''s stored elsewhere.


    This redundancy is the first of many reasons to partition your drive: move your
    personal data (your home folder) to another volume, so it is protected from any
    changes made system. You can use Linux installations as a sandbox without making
    any unwanted changes while touching your data.


    Another popular use for partitioning is to run multiple operating systems on a
    single PC. You could run two Linux distros side by side or set up a Linux and
    Windows machine for compatibility purposes, e.g. It is possible because each partition
    can be formatted using a different file system, so de ext4 for Linux, or NTFS
    for Windows. You can also use a data partition that''s visible to all OSes, letting
    you have the latest version of programs and files, whichever OS you happen to
    be running.


    It''s also possible to use partitions for other purposes, such as creating a dedicated
    partition for sharing over your


    > Tip If you plan to partition with Windows it needs to be set up NTFS as Windows
    can only read it. Verify if the ext3 file system add on is installed.


    ![](img/09c2db624d208d272aaec8e2a116126d_91_1.png)


    > The Disk Utilities provides a summary of how your partitions are currently set
    up.


    92 | Linux Made Simple'
