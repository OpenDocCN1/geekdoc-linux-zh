    Interface) if you''re using a newer PC. UEFI offers a user-friendly interface
    and better features, but it''s not compatible with older hardware.

    Most UEFI systems use a Special Support Module (CSM) to emulate the BIOS when
    booting. With Secure Boot enabled, the systems will use a special feature designed
    to protect PCs from low-level malware.

    You will almost certainly have Secure Boot enabled, which isn''t a problem for
    Mint, which fully supports it.


    # ## UEFI boot options


    Switch on your PC and tap the key to enter setup -usually [Del] or [F2]. Look
    for the BootFast setting within BIOS or UEFI. Make sure it is set to disabled.
    If you have problems getting Rea Backup to launch, you might also temporarily
    disable the CSM settings, in order for Rea Backup to work correctly.

    When it comes to it, its settings may be hidden away in their own menu, where
    you will find references to the list of PXE (pre-boot environment), GRUB (graphics
    and Storage (or SATA)), as well as USB and PCI if applicable.


    This allows you to switch CSM on and off for specific devices. If there is an
    option to turn on - select the appropriate option (such as ''don''t launch'')
    to ensure maximum compatibility and performance.

    Not all PCs, particularly few low-end models, will give you access to all of these
    settings - contact the manufacturer to see what they offer, or look for updates
    that bring them back. Search for your PC''s settings: ''CSM'', ''UEFI'', ''Linux''
    or ''Mint'' to see if there''s a preference set by other switches you can follow
    to get what you need.


    ![](img/09c2db624d208d272aaec8e2a116126d_15_1.png)


    +   > Tweak your PC''s settings necessary to get Rea Backup and recovery working
    properly if that''s what you need.


    Linux | Mint Base'
