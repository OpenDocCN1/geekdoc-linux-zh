    icon on the guest window and select your desired USB device from the list - Shared
    Folders Filter here makes it possible to automatically share specific devices
    when the VM boots. You can also run the VM as a headless server - it will allow
    the VM to connect to your host via USB. You can check the Shared Folders in the
    ''Shared Folders'' tab below, where the User Interface allows you to share many
    devices. Options are made available to this guest.


    Once you''ve installed your target OS in the guest machine you will need to install
    the Guest Additions - series of drivers and applications that enhance the VM''s
    performance. Guest additions include a better video driver supporting higher resolutions,
    mouse acceleration and pointer integration, which allows you to move more freely
    the mouse between host and VM without being captured, and support for clipboard
    sharing.

    Installing these Guest additions is as simple as Selecting...


    After the first setup, the wizard will restart your guest. For a more detailed
    guide, refer to chapter 4.2.2 of your VirtualBox Help -> Contents for distro-distro
    guides. Once you''ve followed the procedure, open the file menu and choose Guest
    Additions CD image the window and choose ''Open''. In the terminal window, execute
    the following command:


    ```

    sudo sh /VBox_Additions.run

    ```


    After installing you should be able to resize your VM to the desired resolution
    by simply clicking and dragging - the Displays panel in guest when you''re doing
    this to change the dimensions as you resize.


    # Share data


    Getting data to and from your VM is a critical part of virtualization. One possible
    way is to use shared folders as described here, then you can also swap-data over
    the network, but there are other handy sharing methods provided.


    The Shared Folders feature allows you to share files between the host and guest.
    This is much easier than setting up the network. To do this open your VM''s settings
    and go to the Shared Folders tab, select the folder you want to share and give
    it a name for the guest. You can also make the folder read-only by the guest,
    if you need it. It will work automatically when the VM starts and lasts, best
    to set ''Permanent'' to make the shared folder persist beyond the VM session.


    You''ll find two other ways of sharing data: Shared Clipboard allows you to share
    text between host and guest (this can be limited to one-way, or bi-directional).
    You can implement Drag-and-Drop, another way to quickly share files between host
    and guest by dragging files into and of the guest machine window.


