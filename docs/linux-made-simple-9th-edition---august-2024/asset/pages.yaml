  md: '# Connecting to the server


    As an accidental, first challenge is going to be connecting to your server in
    the first place. In your web control panel, you might see an option to connect
    to a Terminal or use your web browser. This might be quite of a lazy way of doing
    things.


    It''s better to use your own terminal if you''re running Ubuntu press Ctrl+Alt+T,
    or if you''re on Windows you''ll need a command prompt, type ssh username


    yourserver.com (or you can replace yourserver.com, with an IP address).


    The ssh command will open a secure shell on the target machine with the specified
    username. You will get a prompt before the connection is allowed and you will
    end up in a text interface of the host machine


    If you''re going to connect regularly, there''s an even more secure way of using
    ssh keys, to bypass the password prompt


    together and use encrypted keys for access instead. To follow this approach, you''ll
    need to create a public/private SSH key pair for your machine (e.g. Ubuntu users
    can do this using ssh-keygen).


