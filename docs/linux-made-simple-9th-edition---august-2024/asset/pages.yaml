  md: '# POP3 vs IMAP


    There are two ways to receive email: POP3 (Post Office Protocol) and IMAP (Internet
    Message Access Protocol), downloads messages to your computer and (usually) deletes
    the originals from the server. It''s the classic method, and for those using a
    single machine or a security-conscious bent; if the mails are on the server it''s
    going to stay there for better or less speed. There are big disadvantages when
    it comes to using POP3 on multiple machines - it''s a one-way transaction; there''s
    no synchronization between devices, messages you''ve read or replied to, and your
    files won''t match.


    IMAP is a two-way protocol, and probably the better choice for yourself. Its email
    status and messages will all match up between the server and your mail client,
    meaning you can use the same account on multiple machines and at the same time
    keeping things synchronized.


