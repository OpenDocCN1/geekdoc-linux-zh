  md: '# # Essential apps


    A Linux desktop isn''t complete without them!


    # ## LibreOffice


    LibreOffice is one of the most popular productivity suites. It includes programs
    for word processing, and can create spreadsheets, slide shows, diagrams and maps,
    maintaining full mathematical format. It is also compatible with documents in
    proprietary formats and has recently had a face lift www.libreoffice.org


    ![](img/09c2db624d208d272aaec8e2a116126d_34_0.png)


    # ## Thunderbird


    Thunderbird is a Mozilla Foundation mail client, being easy to set up and brimming
    with features. Simple setup wizards allow signing with webmail services and supports
    multiple accounts, and is extended through add-ons. www.mozilla.org/thunderbird


    # ## Gufw


    You may not be using a firewall currently, and if that is difficult to set up
    then you need Gufw. Its feature interface is for managing inbound and outbound
    traffic for various routes and each individual ports. Its wizard-like interface
    is designed especially for inexperienced users www.gufw.org


    ![](img/09c2db624d208d272aaec8e2a116126d_34_1.png)


    # ## Wine


    Despite the increasing number of cross-platform apps that work on Linux, Wine
    includes many big third-party apps, such as Adobe Photoshop or just rich home-grown
    tools that you can''t do without Windows. Wine, which can run these Windows apps
    and games with ease. The project supports over 20,000 apps. Some work perfectly,
    others require minor configuration tweaks www.winehq.org


    ![](img/09c2db624d208d272aaec8e2a116126d_34_2.png)


    # ## BleachBit


    BleachBit is a digital degunker over time. BleachBit helps you clean up your system
    and protect your privacy. It removes unnecessary files, and has tools to securely
    delete files or wipes bleachbit.sourceforge.org


    ![](img/09c2db624d208d272aaec8e2a116126d_34_3.png)


    # ## VirtualBox


    You can use VirtualBox to run an entire Linux installation inside a virtual machine.
    It is useful for installing experimental apps that you don''t want to deploy on
    a real computer, and for testing other OS without exposing it to hardware. virtualbox.org


    # ## Remmina


    With Remmina you can access any computer from the comforts of your desktop. It
    supports the widest range of protocols and connects to all kinds of remote desktops.
    The app is easy to use, and has features that make it a viable option for occasional
    use. remmina.sourceforge.org


    ![](img/09c2db624d208d272aaec8e2a116126d_34_4.png)


    # ## OpenSSH


    If you need to access a remote computer, you cannot do without OpenSSH. It''s
    a family tool for tunneling capabilities by encrypting all traffic and supports
    various authentication methods, and supports SSH. openssh.org


    ![](img/09c2db624d208d272aaec8e2a116126d_34_5.png)


    # ## Clonezilla


    This is a cloning solution that''s distributed as free and GPG for doing backup
    disk and restoration. It can also deploy an image to multiple computers at once.
    Clonezilla works with a large number of disks, partitions and filesystems. clonezilla.org


    ![](img/09c2db624d208d272aaec8e2a116126d_34_6.png)


    # ## VLC


    Distrips ship with a functional video player. If you need more control, VLC supports
    every video and audio format and it includes tools for advanced users. videolan.org/vlc


    # ## PeaZip


    PeaZip is a graphical archiving tool that can work with over 200 different formats.
    It can archive files and can create encrypted ones. It integrates with popular
    desktop environments and provides a CLI for advanced users. bit.net/PeaZip


    ![](img/09c2db624d208d272aaec8e2a116126d_34_7.png)


