  md: '# Desktop: Install and switch DEs


    Don''t like your current desktop DE? Problem. Try to switch to an environment
    that''s better suited to your needs.


    ![](img/09c2db624d208d272aaec8e2a116126d_101_0.png)


    One of its greatest strengths is versatility, unlike other systems that allow
    to customise your desktop environment (DE). Each distribution (distro) of Linux
    comes with its own DE, while they share many similarities - specifically the WIMP
    (Windows, Icons, Menus, Pointer) have radical differences in functionality as
    well as look.


    The good news is that you''re not locked into your desktop of choice. Whether
    you want to switch to a different distro or you''re looking for a way to interact
    with your desktop, Linux can accommodate you. You can even run multiple desktops
    side-by-side, allowing you to compare and contrast them easily.


    Desktops are described as software packages, which all the disparate elements
    required to make that desktop function (see the Anatomy of a Desktop, below) have
    been installed. You can switch them from the login screen by clicking the desktop
    icon that appears in the log box next to your username.


    So, if you''re itching to try out some alternatives to your default facto, let''s
    go starting with


    Cinnamon (innamon.linuxmint.com). It''s the default desktop in Linux Mint, and
    is particular wonderful when switching from Windows as it utilises a similar style
    of desktop.


    # Spices you import


    Cinnamon is highly configurable. Its main elements - known as ''spices'' - are
    themes, apps, widgets (which you can place on the desktop) and extensions. You
    can also radically alter its capabilities as well as look - strip the top and
    bottom or tweak how many of these spices.


    Four other desktops worth looking at X (xfce.org), GNOME (gnome.org), LXDE and
    KDE Plasma are great if you want to use Ubuntu desktop. Unlike Cinnamon, they
    share a standalone desktop for use in other systems.


    There are lots of things to consider when choosing your desktop. Which of the
    following will translate into it easier for you to use? Desktops, are as configurable
    as Cinnamon, so it''s important you explore all the elements when deciding if
    a desktop has the functionality and flexibility


    # The anatomy of a desktop


    Your desktop is the virtual environment in which you work, and provides a user
    interface with which you interact. A desktop consists of many different elements
    to produce the working environment you know and love -


    +   The desktop typically contains:

    - Windows, folders, toolbars, wallpapers. What of you is provided by the window
    manager. As its name determines how the desktop''s windowing system works by taking
    responsibility for the desktop environment and its component parts, such as menu,
    task bars and controls.

    nThe graphical elements - buttons, scrollbars,


    etc - are stored in manner. The desktop includes the widget, which is also utilized
    by themes so they can work seamlessly with the desktop. Many tools exist: Qt and
    GTK, where you can run applications made in one on a desktop built using the other
    without any look.


    Many of these elements are stored in manner which makes it easy for you to change
    a desktop''s look and appearance by defining how key elements look in shape, color
    and other elements.


    Desktop also has ship with a number of tools and utilities, designed specifically
    to work well with their intent. Typical elements include a file manager, image
    viewer, text editor


    It doesn''t matter how sophisticated your DE is, they all share the same blocks:
    toolbars, desktop, widget and windows etc.


    ![](img/09c2db624d208d272aaec8e2a116126d_101_1.png)'
