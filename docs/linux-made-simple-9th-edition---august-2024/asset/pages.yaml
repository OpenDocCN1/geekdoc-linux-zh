  md: 'Menu and choose System Settings to review current settings under the Hardware
    section. You can source missing drivers from the manufacturer''s website.


    Now you''ve dipped your toes in the water and noticed it is not as deep (cold),
    try your first backup of your dual-boot system using Repo Backup. Once complete,
    you can start to dig a little deeper into Linux. Let''s test the file system with
    Windows: use NTFS to get a third file system. When you boot back into Windows
    you''ll find your Linux partitions are invisible — because the data partition
    you created — was formatted as NTFS.


    Open the Nemo file manager and you''ll find inside the Home folder — Home, where
    you can find your square partition. Like your Windows folder, this contains all
    your personal data, but also contains programs and settings.


    Click on Shortcut on the left and you''ll see Ubuntu in all its messy glory. Many
    of these folders can be ignored, two whose names are /media and /home. These are
    shortcuts to external drives and network folders where drives that are mounted
    to /media or are on a USB drive.


    # # Key tools


    The following utilities will help you manage various parts of Mint without using
    the Terminal. Click Settings to get a dialog box to System Control Panel. Here
    you can look for themes. Appearance is where you can customise Cinnamon, but also
    for places where you can change the desktop environment. If you select the Window
    tab, you can change the window decorations to the window panel. Switch ''Off''
    if you want that Mint handles each separate desktop box if you prefer the way
    Windows does.


    A number of other tools will be useful here — the Disks (which you''ll touch in
    on the data partition with Windows boxes), GParted, Disk Usage Analyzer (which
    enables you to see a graphical breakdown of how your drive space is used), System
    Manager (the equivalent of Task Manager), and Update Manager, which is where you
    go to manage Linux.


    ![](img/09c2db624d208d272aaec8e2a116126d_20_0.png)


    # # The Terminal


    At some point you''ll need to access the Terminal. And once you''re done, you''ll
    realize it is the best way to get things done. At the very least, you will find
    yourself with the basics of command and you can press tab to list commands and
    even flags.


    +   - dir - the list of currently selected directory

    - cd - to move to a directory, use example: cd folder

    - cd /home/username to go to a subdirectory within the specific directory. Note
    folder names are case sensitive. cd .. to go back to your home directory, ls -
    list commands available

    - mkdir (make, create folder) and rm (delete file), the equivalent of right-clicking
    in Windows and delete commands, the first time you use it.

    - apt-get is a tool for managing and installing packages. Use apt-get update to
    update all software list, and apt-get check to look for problems with software
    (known) repositories).

    - wget - downloads files to your Downloads folder: eg wget [url]


    To find out more about the Terminal, check out the beginner''s guide at ~/tutorials.linux.ubuntu/


    Drive drives

    When moving to Linux from Windows you will find different file names, such as
    C:, D:, and USB drives?

    Mint does not use a drive letter for removable media. You will need to use drives
    and USB drives as it has a more complex way of handling partitions and drives.


    ![](img/09c2db624d208d272aaec8e2a116126d_20_1.png)


    # # Changes desktops


    One of the features that you''re used to is to set up Ubuntu alongside Windows.
    Mint comes with a very different desktop environment than the other. It''s really
    familiar to use, but you will need to master the switching between them.


    If you''re struggling to accommodate it, and would rather use Mint''s Cinnamon
    desktop instead you can easily do so. First, open your terminal and type:


    ```

    sudo apt-add-repository ppa:cinnamon

    sudo apt-get update && sudo apt-get install cinnamon

    ```


    This will add the Cinnamon repository (repos) to Ubuntu, and download and install.


    installed, you need to click the ''Settings'' in the top right of the Linux desktop
    and go out to the login screen. You''ll see a Ubuntu icon again - click it to
    list available desktops will appear, Cinnamon. Click Cinnamon to boot into your
    new Mint desktop, complete with all the features described on the rest of this
    page. You can always switch back to Ubuntu from login screen.


    If you subsequently switch the Cinnamon desktop, you can then switch desktops
    in Mint too. You can install multiple desktops and move between them as


    Cinnamon looks like a different in Ubuntu, but works exactly the same as.


    ![](img/09c2db624d208d272aaec8e2a116126d_20_2.png)


    Linux Simple | 21'
