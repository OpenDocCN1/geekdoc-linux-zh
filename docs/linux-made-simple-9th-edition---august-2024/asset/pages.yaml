  md: '# Drives: Access flash and optical media


    Your install is not an island. Here is how to access flash storage and optical
    media using Ubuntu''s built-in tools.


    Linux handles drives differently to Windows, so if you''ve migrated from a Windows
    PC, you might find Ubuntu a bit unfamiliar. But once you''re over the hump—the
    transition isn''t that hard. And now you''ll understand how everything works,
    including USB storage as well as CD and DVD.


    # Working with USB drives


    Ubuntu is not hard to work with USB storage of any nature—drives are treated equally
    and accessible, and so long as you plug it in, the drive will be automatically
    mounted using file system. Ubuntu ships with support for FAT32 and NTFS file systems.
    If you format a drive—once mounted, you can read and write the drive like any
    other.


    Larger drives — 64GB or bigger — are occasionally formatted in the exFAT format.
    So for exFAT isn''t included in Ubuntu, but you can add full read/write support
    by using the Software Centre and searching for ''exfat'', install by ''exfat-utils''.


    If you''re running Ubuntu 64-bit, or choose the i386 labeled if you''re running
    the 32-bit version. If you don''t know which one go to Settings—Details. Once
    installed, full read/write support to any exFAT drive will be enabled.


    USB drives are registered in the same way as hard drives—open Disks to confirm
    the individual label for your drive. You''ll see it listed as /dev/sda1 or /dev/sdb1,
    depending on how many drives are connected.


    When permanently attached, these devices aren''t constant. They are assigned on
    a first-come, first-served basis. To avoid a unique name after having first another
    drive, its label will change. Always verify the drive in Disks before performing
    any task that requires you to identify the drive by its identifier.


    When you''re finished with the drive and want to remove it, click the button next
    to the drive name in Nautilus to unmount it. If you don''t need to unmount, simply
    unplug the drive.


    If you prefer the Terminal, use the ummount command for drive. By including the
    -f Flag can ensure all volumes for a partition are unmounted. If you want to remove
    the drive safely even if it''s busy, point to a specific volume or its mount point
    using the following:


    ```

    umount /dev/sda1

    ```


    Once done, remove or eject the drive.


    # Read-only mode


    Sometimes you might want to access a USB drive in read-only mode, so data can''t
