  md: '# Rhythmbox:

    Playing media


    Get your music collection blasting from your speakers and surroundings, then watch
    some videos too.,


    remember when we had to buy CD players with built-in radios, or cassette tapes
    for listening to music? You''re not alone. When you can carry a life''s worth
    of tunes on your phone, and stream audio anywhere while travelling by train, digital
    media should be everything you need. Why invest in something else?


    We''ll empower everyone to enjoy music on desktop, whether it''s online music,
    internet radio, or local files. While digital media should be available whenever
    and wherever you need it


    and furthermore, Ubuntu has all the tools you need for perfect playback. Unlike
    Windows, there is one system with the all-encompassing Media Player that allows
    you to play any media file from a local source - like a hard drive or USB or a
    network drive.


    For music, Rhythmbox is fully featured to manage your library, stream from remote
    stores or a household, and rip CDs directly to your hard drive. For the Totem
    player - which appears in the Unity launcher under the name Videos - offers similar
    services.


    # Living in a Rhythm


    As for video, Rhythmbox is fully featured to be used to play music from a local
    library, rip CDs, and adapt audio to digital format seamlessly, purchase


    songs online and stream from another PC or attached storage.


    Before you start using Rhythmbox, however, there''s one thing you''ll need to
    keep in mind. Ubuntu includes the software codecs to play back common MP3 format
    which many people use to store songs. Because many parts of the MP3 codec are
    protected by patent, Linux distributions are unable to install them without extra
    plugins.


    Fortunately, the way is simple: open the Ubuntu Software Centre and search for
    "Ubuntu Restricted Extras". If it''s not already installed, just click download
    and install. Then it''s left up to you.


    Back to Rhythmbox, the first time you open it up you''ll want to point it to the
    place where you keep your music. To build up your library, visit the Edit menu
    and click Preferences. Then click the button to add Rhythmbox to your music library
    if it''s not the default, and put a tick in the "Watch folder" box. Now any file
    you add will be added to your library.


    You''ll also see options in this screen to select the quality and format for ripping
    music, and the naming you prefer for flinenames that are automatically generated.


    Once you''ve set up your music, the main view of Rhythmbox is fairly straightforward
    (see ahead below). With some basic library filters for organizing music, podcasts
    (see out) or internet radio stations, you can also see what''s coming in the play
    queue.


    To start adding extra options, you''ll need to visit the Plugins menu, which you
    find by clicking Tools in the menu bar.


    Rhythmbox comes with extra features which can be disabled by default. In this
    menu you can extrash such as Last MF scrob and the jam music store. The selection
    of plugins is fairly limited, but you can also get more with ease.


    One essential plugin is to install the Grille, which will enable you to stream
    from other computers and libraries over your network. If Grille isn''t already
    installed, open the Software Centre and search for grelle-plugins, then install
    the package from there. This enables in Rhythmbox the Plugins section to show
    any shared libraries over your network popping up in the left hand menu.


    ![](img/09c2db624d208d272aaec8e2a116126d_61_0.png)


    +   Probably the best Ubuntu video player, VLC is a must-have.'
