  md: '# # System issues


    ## Drive filling up

    Iam running out of space on my hard drive – the space just seems to be disappearing.
    Where did it go and how can I get it back?


    If you have more than one partition, the first step is to see which one with the
    command:

    `df -h`nThis shows the total, used and available space on each partition. If you
    have a /home partition, you know whether it''s your home directory or the system
    root. The steps are the same in each case, although you may need to clean up the
    files in /tmp and /var.

    For the system files, the usual culprits are /tmp and /var. The first is used
    for temporary files, but others might


    ![](img/09c2db624d208d272aaec8e2a116126d_129_0.png)


    get in here, especially when processes fail without cleaning up. The /var/ directory
    contains system log files and can fill up quickly if a process is logging lots
    of errors. Look at the kinds of large files in here, what can you do with them?

    It''s worth installing logrotate, which keeps your logs under control. The default
    setup rotates a new log file each week and compresses the last four weeks of logs.
    This can reduce the amount of space used by logs.

    In your home directory, where you download your folders, browser and manager caches
    and other files, you can do this to clear the directories of:

    `du -sh ~*`nThis lists everything in size order.

    Then there are also tools to visualize disk usage:

    Filelight for KDE and Disk Usage Analyzer for Gnome – Bleachbit is good for identifying
    and cleaning unnecessary files, like browser caches and other things.


    > > Filelight, Gnome Disk Usage Analyser, you can get a good graphical representation
    of how you fill that hard drive.


    # ## Where has my memory gone?


    I noticed that after running the computer for a while, I''m having almost no memory
    left. How can I free it and what can I do about it?


    This is perfectly normal and the Linux way is designed to work. Memory is for
    storing nothing that could be helping the performance of your computer. The Linux
    kernel caches memory that isn''t active in use by processes, which fills up caches
    in order to improve performance. You can see this by looking at the output of
    free a.


    On a computer fitted with 16GB of RAM, the usage of 128MB is reported as free.
    In the case of 1GB of it is in use. These guests greatly speed up disk access
    by writing data in memory and reading more in anticipation of your next read.
    If you need more memory for applications, it will be released immediately.


    # ## Looking for trouble


    Linux logs tell about everything. When something goes wrong, there are places
    to look. The system log is in /var/log or is usually called messages, depending
    on the login system you use. Misleading logs for troubling tricky problems:

    `grep error /var/log/messages`

    You can also look at the log messages in real time with:

    `tail -f /var/log/messages`


    which will display new entries to the log as they appear (f means follow). And
    then what to do if your kernels are causing problems to the system. The kernel
    logs can be seen in the kernel buffer or is in /var/log/kern.log. If you''re having
    difficulties with hardware, it too has a "option"

    `ndmesg`nis useful when dealing with hot-plugged devices or to see when built-in
    hardware is


    detected and at boot time, run

    `dmesg | less`nafter booting, then you can scroll through the messages, and as
    there is a prompt type / to search for something relevant. If your system uses
    systemd, log entries can be displayed in journalctl. You can do the same follow
    with journalctl or look for errors since the last boot:

    `journalctl -b -p err'
