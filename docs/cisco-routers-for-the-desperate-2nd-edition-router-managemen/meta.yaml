    \ circuit failure. Start troubleshooting your circuit!\n\nHowever, going back\
    \ to the first ping example, just because your circuit is up doesn't mean that\
    \ you're on the Internet. Perhaps your ISP had a failure, or some major backbone\
    \ had a run-in with that rogue backhoe. Your next step is to attempt to reach\
    \ a popular Internet site such as Yahoo! from your router. If your circuit is\
    \ passing traffic, but you cannot ping such popular and highly available sites\
    \ such as Yahoo! or CNN.com, you may have a failure between your network and the\
    \ main Internet. That's when you use traceroute.\n\n> ¹ It's also possible to\
    \ try to ping from your desktop computer, but in this case, you're not just testing\
    \ the router's circuit; you're testing your desktop's connection to the network,\
    \ any intervening firewalls, and whatever other network equipment lies between\
    \ your computer and the far side of the circuit. To isolate problems, test only\
    \ one small piece at a time.\n\n## Traceroute\n\nThe traceroute command sends\
    \ packets to a remote Internet node and returns the IP address of every node it\
    \ passes through on the way. Remember that to reach a remote site, your traffic\
    \ probably travels through your router, your ISP's router, across several backbone\
    \ routers, through the destination site's ISP's router, and through the destination\
    \ site's router before reaching the actual target server. If any of these are\
    \ broken, your request fails.\n\nTo use traceroute, just log in to the router\
    \ and enter the command traceroute and the IP address or hostname you're attempting\
    \ to reach.\n\n```\nrouter#traceroute www.blackhelicopters.org\nTranslating \"\
    www.blackhelicopters.org\"...domain server [OK]\n\nType escape sequence to abort.\n\
    Tracing the route to bewilderbeast.blackhelicopters.org (198.22.63.43)\n\n 1 192.150.247.53\
    \ [AS 26096] 4 msec 4 msec 0 msec\n 2 192.150.247.38 [AS 26096] 4 msec 8 msec\
    \ 8 msec\n 3 bewilderbeast.blackhelicopters.org (198.22.63.43) [AS 26096] 12 msec\
    \ 8 msec 8 msec\nrouter#\n```\n\nUpon leaving our current router, traffic to the\
    \ server goes through the router with the IP address of 192.150.247.53. If this\
    \ machine had a reverse DNS entry, a hostname would be displayed instead. Of three\
    \ packets, two return in four milliseconds, and one returns in zero milliseconds.\
    \ (This doesn't mean zero time; it just means a smaller time than your router\
    \ can measure.) This router belongs to the autonomous system 26096 (see Chapter\
    \ 7). The second router is crossed very quickly. On our third hop, we reach a\
    \ machine with the reverse DNS of \"bewilderbeast.blackhelicopters.org,\" which\
    \ is where the traceroute ends. Presumably, the IP address of www.blackhelicopters.org\
    \ is on this machine.\n\n- When a packet is dropped, you will see an asterisk\
    \ instead of a timestamp.\n- If a traceroute ends in a !H, that means that the\
    \ last node in the traceroute doesn't know how to reach the destination. This\
    \ is almost certainly a routing issue.\n- Traceroutes are said to \"die\" when\
    \ they turn into line after line of three asterisks. This may indicate that a\
    \ firewall is blocking traceroute packets from reaching the target server, or\
    \ it could be a network problem. The last node that appears knows where to send\
    \ the packets, but it is not receiving a response from the next hop.\n\nA traceroute\
    \ can help you clarify the scope of a problem: if all of your traceroutes reach\
    \ your ISP's router and die, you can assume that your ISP has a problem and that\
    \ it's time to give them a call.\n\nIf the traceroute dies somewhere out in the\
    \ middle of the Internet, it's a fair bet that there's nothing you can do, but\
    \ that the damage is limited in scope. Or there may be some Internet \"black hole\"\
    \ that causes many different requests to fail. For example, for much of 1996,\
    \ MCI's Willow Springs router cluster seemed to be the Secret Internet Packet\
    \ Burial Ground; network requests routed through that system consistently suffered\
    \ horrible packet loss and latency. It's highly likely that the owner of such\
    \ a Network of Death is well aware of the problem and is desperately attempting\
    \ to resolve the issue, but if you have no business relationship with the network\
    \ owner, there's nothing you or your ISP can do about it. In either event, at\
    \ least you know.\n\nIf you cannot even ping across your circuit, it's time to\
    \ get your hands dirty and troubleshoot your circuit. But before you can troubleshoot\
    \ anything, you must understand it.\n\n### Circuit Design\n\nDifferent phone companies\
    \ have used many different types of connection equipment over the decades. One\
    \ of my clients still uses a phone switch dating from the 1950s, featuring fuses\
    \ the width of my thumb and several inches long. (I believe that Dr. Frankenstein\
    \ used such equipment, and I have suggested offering the equipment to him for\
    \ spares if he'll only haul it away.) There is no way this sort of equipment can\
    \ be used for an Internet connection.\n\nOthers have systems of more recent vintage,\
    \ but of completely unknown origin. If you have such a baroque setup, save yourself\
    \ a *lot* of trouble and get a modern circuit. We're going to discuss the physical\
    \ design of a modern T1 circuit, not Frankenstein collectibles.\n\n## The Smartjack\n\
    \nPhone companies usually terminate the circuit at your location with a device\
    \ called a *smartjack*, which is a small box with green and red lights on it.\
    \ The smartjack has simple brains that the telco can use for troubleshooting (that's\
    \ where the \"smart\" part comes from). The phone company or ISP is usually responsible\
    \ for the circuit up to the smartjack; problems between the smartjack and the\
    \ router are your responsibility.\n\nThe point where the smartjack is installed\
    \ is called the *demarc*. If your smartjack is far from your router, it's not\
    \ uncommon to have a professionally installed *extended demarc*, where the circuit\
    \ is run from the smartjack to a point more convenient for the equipment. You'll\
    \ frequently see this in office buildings, where the phone company delivers all\
    \ the circuits to one central location but offices are on many floors above.\n\
    \nEventually, the circuit is delivered to a Channel Service Unit/Data Service\
    \ Unit (CSU/DSU), which transforms the signals arriving over the T1 line into\
    \ something the router understands. Most modern Cisco routers have integrated\
    \ CSU/DSU features, so you can just plug the RJ-45 cable from the smartjack directly\
    \ into the router without having additional clunky boxes sitting around the data\
    \ center.\n\n## Examining the Circuit\n\nThe first line of the *sho int* output\
    \ for an interface describes the basic state of the interface, as discussed in\
    \ Chapter 3. If the line is up, the router is seeing a reasonable signal from\
    \ the T1. If the line is down, the router is not seeing a signal over the T1.\
    \ While you still need to check for other errors on the interface, not seeing\
    \ a signal is a pretty solid sign that something is seriously wrong.\n\nIf the\
    \ circuit is up but the protocol is down, the router cannot understand the signals\
    \ coming over the T1. If this is a brand-new circuit, it is probably misconfigured,\
    \ but in mature circuits this may mean line noise or damage. (It can also mean\
    \ that someone else somewhere along the circuit touched things, but no ISP or\
    \ telco would even *dream* of doing that, not even if some underpaid and overworked\
    \ tech thought you wouldn't notice if he just tweaked one setting while nobody\
    \ was looking.)\n\nAlthough you'll want to check the rest of the information available\
    \ on this interface, there are things you can try first."
  mdcn: "\n互联网线路。你可能为该线路拥有一个域名，但请使用 IP 地址，因为实际的互联网问题通常也意味着 DNS 问题。你的线路远端很可能就是路由器的默认路由。在接下来的示例中，我们串行线路的远程端\
    \ IP 地址为 192.168.88.65。登录你的路由器，输入 ping 命令和目标 IP 地址。¹\n\n```\nrouter# ping 192.168.88.65\n\
    Type escape sequence to abort.\nSending 5, 100-byte ICMP Echos to 192.168.88.65,\
    \ timeout is 2 seconds:\n!!!!!\nSuccess rate is 100 percent (5/5), round-trip\
    \ min/avg/max = 4/4/4 ms\nrouter#\n```\n\n路由器向目标 IP 地址发送五个数据包，并给每个数据包两秒钟的返回时间。对于非卫星链路的任何目标来说，这通常都绰绰有余。每个感叹号表示一个返回的数据包，而点号则表示一个消失的数据包。最后，我们看到了成功百分比以及关于数据包速度（以毫秒为单位）的一些统计数据。这里显示的线路显然是畅通的。\n\
    \n另一方面，如下所示的结果则表明你的本地线路已中断。\n\n```\nSending 5, 100-byte ICMP Echos to 192.168.88.65,\
    \ timeout is 2 seconds:\n.....\nSuccess rate is 0 percent (0/5)\n```\n\n点号代表丢弃的数据包。五个点号表示线路完全失效。开始排查你的线路故障吧！\n\
    \n然而，回到第一个 ping 示例，仅仅因为线路畅通并不意味着你已经连接到互联网。也许你的 ISP 发生了故障，或者某个主干网被那台该死的挖掘机给挖断了。你的下一步是从路由器尝试访问一个知名的互联网站点，例如\
    \ Yahoo!。如果你的线路可以传输流量，但你无法 ping 通像 Yahoo! 或 CNN.com 这样知名且高可用性的站点，那么在你的网络和主互联网之间可能存在故障。这时就需要使用\
    \ traceroute。\n\n> ¹ 你也可以尝试从桌面电脑进行 ping，但在这种情况下，你不仅仅是在测试路由器的线路，还在测试桌面电脑与网络的连接、任何中间防火墙，以及位于电脑与线路远端之间的所有其他网络设备。为了隔离问题，请一次只测试一个小的组成部分。\n\
    \n## Traceroute\n\ntraceroute 命令向远程互联网节点发送数据包，并返回其沿途经过的每个节点的 IP 地址。请记住，要到达远程站点，你的流量可能会经过你的路由器、ISP\
    \ 的路由器、跨越几个骨干路由器，经过目标站点 ISP 的路由器，最后经过目标站点的路由器才能到达实际的目标服务器。如果其中任何一个环节损坏，你的请求就会失败。\n\
    \n要使用 traceroute，只需登录路由器并输入 traceroute 命令以及你尝试访问的 IP 地址或主机名。\n\n```\nrouter#traceroute\
    \ www.blackhelicopters.org\nTranslating \"www.blackhelicopters.org\"...domain\
    \ server [OK]\n\nType escape sequence to abort.\nTracing the route to bewilderbeast.blackhelicopters.org\
    \ (198.22.63.43)\n\n 1 192.150.247.53 [AS 26096] 4 msec 4 msec 0 msec\n 2 192.150.247.38\
    \ [AS 26096] 4 msec 8 msec 8 msec\n 3 bewilderbeast.blackhelicopters.org (198.22.63.43)\
    \ [AS 26096] 12 msec 8 msec 8 msec\nrouter#\n```\n\n在离开当前的路由器后，发往服务器的流量通过 IP 地址为\
    \ 192.150.247.53 的路由器。如果这台机器有反向 DNS 条目，则会显示主机名。在三个数据包中，两个在 4 毫秒内返回，一个在 0 毫秒内返回。（这并不意味着零时间，而只是意味着时间比你的路由器能测量的最小值还小。）该路由器属于自治系统\
    \ 26096（见第 7 章）。第二个路由器被快速越过。在第三跳，我们到达了一台反向 DNS 为 \"bewilderbeast.blackhelicopters.org\"\
    \ 的机器，traceroute 在此结束。据推测，www.blackhelicopters.org 的 IP 地址就在这台机器上。\n\n- 当数据包被丢弃时，你会看到一个星号而不是时间戳。\n\
    - 如果 traceroute 以 `!H` 结尾，这意味着 traceroute 中的最后一个节点不知道如何到达目的地。这几乎肯定是一个路由问题。\n-\
    \ 当 traceroute 变成一行行三个星号时，人们说它“死掉了”。这可能表明防火墙正在阻止 traceroute 数据包到达目标服务器，或者可能是网络问题。最后出现的节点知道将数据包发送到哪里，但它没有收到下一跳的响应。\n\
    \ntraceroute 可以帮助你明确问题的范围：如果所有的 traceroute 都到达你的 ISP 路由器后死掉，你可以假设你的 ISP 出了问题，是时候给他们打电话了。\n\
    \n如果 traceroute 在互联网中间某个地方死掉，那么很有可能你无能为力，但损害范围有限。或者可能存在某种互联网“黑洞”，导致许多不同的请求失败。例如，在\
    \ 1996 年的大部分时间里，MCI 的 Willow Springs 路由器集群似乎是“秘密互联网数据包埋葬地”；通过该系统路由的网络请求持续遭受严重的数据包丢失和延迟。这种“死亡网络”的所有者很可能已经意识到了问题并正拼命尝试解决，但如果你与网络所有者没有业务关系，你或你的\
    \ ISP 对此无能为力。无论如何，至少你心中有数。\n\n如果你甚至无法在链路上进行 ping，那么是时候亲自动手排查线路故障了。但在你排查任何问题之前，你必须先了解它。\n\
    \n### 线路设计\n\n几十年来，不同的电话公司使用了许多不同类型的连接设备。我的一个客户仍在使用一台 20 世纪 50 年代的电话交换机，其保险丝有我的大拇指那么宽，长达几英寸。（我相信弗兰肯斯坦博士就使用过这样的设备，我曾建议如果他愿意把它运走，我就把这设备送给他当零件。）这种设备绝不可能用于互联网连接。\n\
    \n其他人拥有更新的系统，但来源完全未知。如果你拥有这样一套离奇的设备，请给自己省去*很多*麻烦，换一个现代线路。我们将讨论现代 T1 线路的物理设计，而不是弗兰肯斯坦的收藏品。\n\
    \n## 智能接口 (The Smartjack)\n\n电话公司通常使用一种名为*smartjack*（智能接口）的设备在你的所在地终止线路，这是一个带有绿色和红色指示灯的小盒子。smartjack\
    \ 具有简单的处理能力，电信公司可以用它来进行故障排除（这就是“智能”一词的由来）。电话公司或 ISP 通常负责直到 smartjack 为止的线路；smartjack\
    \ 与路由器之间的问题由你负责。\n\n安装 smartjack 的点被称为*demarc*（分界点）。如果你的 smartjack 距离路由器较远，常见的做法是安装专业的*扩展分界点*，将线路从\
    \ smartjack 延伸到更方便设备连接的点。这种情况在办公楼中经常见到，电话公司将所有线路交付到一个中心位置，而办公室分布在上面的多个楼层。\n\n\
    最终，线路被交付给信道服务单元/数据服务单元 (CSU/DSU)，它将通过 T1 线到达的信号转换为路由器能够理解的形式。大多数现代 Cisco 路由器都集成了\
    \ CSU/DSU 功能，因此你可以直接将来自 smartjack 的 RJ-45 网线插入路由器，而无需在数据中心放置额外的笨重盒子。\n\n## 检查线路\n\
    \n正如第 3 章所讨论的，`sho int` 输出的第一行描述了接口的基本状态。如果线路 (line) 为 up，则路由器从 T1 接收到了合理的信号。如果线路为\
    \ down，则路由器在 T1 上没有看到信号。虽然你仍需要检查接口上的其他错误，但看不到信号是一个相当明确的信号，表明出现了严重问题。\n\n如果线路为\
    \ up 但协议 (protocol) 为 down，则路由器无法理解来自 T1 的信号。如果是全新的线路，则可能是配置错误；但在成熟的线路上，这可能意味着线路噪声或损坏。（这也可能意味着线路上的其他人在某个地方动了东西，但没有任何一家\
    \ ISP 或电信公司会*梦到*这样做，即使是某个薪水低且工作过度的人员认为只要在没人看的时候调整一个设置你也不会注意到。）\n\n虽然你会想要检查该接口上可用的其余信息，但有些事情你可以先尝试。\n"
