    ## 5 路由器故障排除


    既然你已经对路由器如何配置以及各种网络类型如何工作有了基本了解，那么让我们考虑最常见的日常路由器问题。这些问题可以分为两类：


    - 路由器崩溃

    - 网络故障或缓慢


    通过执行几个简单的步骤，你将有很大的机会解决其中许多问题。在最糟糕的情况下，当你致电 ISP 时，至少你可以准备好充足的诊断信息。


    ### 路由器崩溃


    在大多数情况下，Cisco 路由器能持续稳定工作。在极少数情况下，一个未被触动的路由器可能会间歇性地自动重启，或者在它“想”关闭的时候直接关机。在这种情况下，SmartNet
    合约是非常宝贵的——Cisco 设备大多是黑盒，如果其中某个环节出了问题，保修可能是你唯一的救济手段。尽管如此，在没有服务合约的情况下，你仍然可以尝试通过一些方法来解决问题。


    崩溃的路由器通常会将错误信息打印到串行控制台。将串行控制台连接到路由器并保持连接。任何崩溃消息都将保留在串行终端的消息缓冲区中。准确复制这些消息，并在 Google
    或 http://www.cisco.com 上进行搜索；你很可能会发现问题所在。Cisco 的技术支持肯定想知道这些消息的内容。


    如果你无法通过崩溃消息发现问题，请检查硬件本身；也许路由器内部有什么东西松动了。打开机箱并清除进入的灰尘，最好使用压缩空气。重新安装每个可拆卸组件，例如内存或闪存卡，以及附加模块（如
    Cisco WIC 卡和端口适配器）。当你确定所有东西都紧密连接后，将路由器放回机架并将其打开。如果你足够幸运，它就能正常工作。


    > **注意** Cisco 提供了关于如何诊断各种型号路由器崩溃的文章；其中一些文章无需 SmartNet 合约即可访问。在 http://www.cisco.com
    上搜索帮助总是值得的。


    如果你的路由器仍然崩溃，你别无选择，只能联系 Cisco。（好吧，没问题，你也可以选择忍受这个问题。短暂的连接中断并不是公司可能遇到的最糟糕的事情，但它可能会影响你的工作，绝对会干扰你听互联网广播。）如果你没有
    SmartNet 合约，Cisco 的技术支持会很乐意将你转接到销售部门或引导你寻找经销商。


    ### 网络故障


    网络故障是迄今为止最常见的路由器问题，尽管从技术上讲，并不是路由器本身失效了，而是电路失效了。挖掘机在错误的地方挖掘会导致各种电路中断（而这些是你永远无法自行修复的）。


