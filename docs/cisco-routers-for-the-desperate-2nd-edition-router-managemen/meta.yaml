    \ bouncing up and down. This is a necessary part of BGP; sudden withdrawals and\
    \ insertions of a particular route can cause smaller routers to overload and crash.\
    \ It's generally assumed that route flap is due to circuit or hardware problems,\
    \ not someone repeatedly resetting their BGP session. A BGP reset can be thought\
    \ of as the computer equivalent of dropping a cinderblock on your foot—you won't\
    \ be able to do much beside hop around on one foot and think about what you've\
    \ done for a few minutes. Routers assume that even if you have a good reason for\
    \ doing it once, you're smart enough to not keep on doing it.⁴\n\nHaving said\
    \ that, you can clear all of your BGP sessions simultaneously by using an asterisk\
    \ instead of an IP address. All of the warnings above apply even more strongly\
    \ for such mass BGP resets.\n\nIf your BGP problems persist, contact the ISP that\
    \ is showing the odd behavior and ask who has been playing with the router configuration.\n\
    \n### **NOTE** *Monitoring Router Traffic*\n\n> *How are you supposed to know\
    \ how your traffic is flowing over each circuit? Although you have several options\
    \ I highly recommend using the free tool MRTG (http://www.mrtg.org) to perform\
    \ basic router monitoring. MRTG will tell you how much traffic is going in and\
    \ out each circuit, and it can be expanded to track how much memory and CPU time\
    \ your router is using. I don't know how anyone can possibly manage a router without\
    \ using MRTG or an equivalent tool.*\n\n### *Load Balancing BGP*\n\nIf you were\
    \ paying attention, you probably caught the emphatic bit earlier about how BGP\
    \ is not a load-balancing protocol and find the title of this section inexplicable.\
    \ BGP does not perform load balancing, but you can do some manual tricks that\
    \ will allow you to adjust usage of your Internet circuits. You can also purchase\
    \ products that will add load balancing to BGP or perform pseudo load balancing\
    \ via DNS or NAT, or perform other unrelated tricks. Without purchasing additional\
    \ equipment, however, you can use the BGP protocol against itself to perform crude\
    \ load adjustments. By judiciously adding AS \"hops\" to the routes you receive\
    \ and offer, you can increase the distance that the BGP algorithm sees to routes\
    \ from different network areas.\n\n⁴ This may be the most fundamental difference\
    \ between computers and human beings.\n\nBefore you can adjust your router's traffic\
    \ flow, you must know how much traffic goes over your circuits on a long-term\
    \ basis. I previously suggested MRTG (http://www.mrtg.org) for traffic measurement,\
    \ and I suggest it even more strongly here. If you're reading this without setting\
    \ up a traffic measurement tool, you may not have shot yourself in the foot yet,\
    \ but you have loaded the gun and started eyeing your big toe.\n\nLook at your\
    \ traffic throughput on each provider. Frequently, your router will choose to\
    \ transmit outbound traffic to one provider more often than the other. It's quite\
    \ common to see a small office with two T1 circuits using one circuit ten times\
    \ more than the other. When one circuit is using 1.0Mb/second, the other might\
    \ only be using 0.1Mb/second. This is fine if your bandwidth usage is low, but\
    \ if your more popular circuit fills up, you'll only be using 0.15Mb/second on\
    \ your less popular circuit. This would give you network usage of about 1.6Mb/second,\
    \ or only slightly more than half your available bandwidth. Worse, network requests\
    \ sent out over the popular circuit will return very, very slowly. Similarly,\
    \ if most of your traffic arrives over one circuit, you may find that one circuit\
