  - "[PAGE 104]\n\n200, 600, and 500. The first route uses fewer autonomous systems,\
    \ so it is preferred.\n\nIn this common unequal-use situation, one provider consistently\
    \ offers a shorter AS path to other networks than the other. This is not at all\
    \ uncommon, and is not a symptom that one network is \"better connected\" than\
    \ another; in fact, it may be that the provider with the higher AS count has faster\
    \ connections than the other! Now that you understand the problem, the solution\
    \ is obvious: make the AS path of the more heavily used peer longer, so that your\
    \ router will choose it less often. In this example, we want to increase the path\
    \ length of routes we receive from AS300. You can adjust path length via AS path\
    \ by prepending (adding) additional AS numbers in front of a peer.\n\nHere is\
    \ the snippet of BGP configuration that we must alter and its current route maps.\n\
    \n```\nrouter bgp 100\n neighbor 172.16.0.2 remote-as 300\n neighbor 172.16.0.2\
    \ route-map isp8-out out\n route-map isp8-out\n  match ip address 130\n```\n\n\
    Our AS300 peering session currently has only one route map, and it is applied\
    \ to outbound announcements. If we wanted to alter our announcements to this peer,\
    \ we could edit the existing route map, but we want to alter the incoming announcements\
    \ from this peer, so we need a new route map.\n\n```\nrouter# conf t\nrouter(config)#\
    \ router bgp 100\nrouter(config-route)# neighbor 172.16.0.2 route-map isp8-in\
    \ in\nrouter(config-route)# ^Z\n```\n\nHere, we tell the BGP session to use a\
    \ new route map for ISP B, called isp8-in. This new route map is applied only\
    \ to incoming announcements.\n\n```\nrouter# conf t\nrouter(config)# route map\
    \ isp8-in permit 10\nrouter(config-route)# set as-path prepend 300 300\n```\n\n\
    This creates the isp8-in route map. Every announcement that arrives over it will\
    \ have its AS path extended by prepending two 300s to it.\n\nAfter you make this\
    \ change and save your work, make the new route map take effect by clearing this\
    \ peer's BGP session."
