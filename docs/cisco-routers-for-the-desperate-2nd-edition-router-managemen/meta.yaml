    and High-level Data Link Control (HDLC). PPP (the protocol used in this example)
    is an old standard spoken by many different routers and modems, while HDLC is
    a Cisco-created protocol designed especially for high-bandwidth lines. While HDLC
    is more efficient than PPP, either works well for circuits of T1 size or smaller.
    The important thing to remember is that the routers on both sides of the circuit
    must use the same physical protocol on a circuit. If one router claims that a
    circuit is speaking PPP, while the other insists that it''s HDLC, the line protocol
    will go down and stay down until the misconfiguration is fixed.


