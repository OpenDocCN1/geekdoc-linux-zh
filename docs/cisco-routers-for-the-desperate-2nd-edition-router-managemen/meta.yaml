    \ 使用它来分隔配置的不同部分。（如果你将路由器配置的副本存储在路由器之外的地方，你可以使用感叹号来表示注释，就像许多程序配置文件中使用井号一样。这种情况很少见，因为路由器在加载配置时会剔除这些注释。）例如，这里是一些小型路由器配置文件的片段。\n\
