  - '[PAGE 101]


    From AS200, we reach the destination IP address via an AS path of 200. This means
    that the target IP is part of AS200. You would expect that AS200 has the best
    path to reach this destination. BGP knows the next IP address to send the packets
    to, the provider''s side of the circuit going to AS200. It''s figured out that
    this route is the best it has.


    Via AS300, we reach the destination IP address via an AS path of 300 400 700 200.
    In other words, the packets will have to go through four autonomous systems. This
    is probably longer than the route directly through AS200, so we don''t want to
    take it.


    # Resetting BGP


    BGP runs almost perfectly, and rarely has any problems at all. I''ve let routers
    run for months without changing their BGP configurations. On occasion you might
    find that your routing is behaving oddly; perhaps all of your traffic is running
    over one circuit, indicating that the other peer is not sending you any routes.
    Or perhaps the peer isn''t receiving your route announcements, and so all of your
    incoming traffic is arriving via the other ISPs. One common step in these circumstances
    is to reset the BGP session, forcing your router and the peer to dump everything
    that they''ve previously agreed on, re-initialize the connection, and completely
    reload the routing table. The command for this is `clear ip bgp` followed by the
    neighbor''s IP address.


    ```

    router# clear ip bgp 172.16.0.2

    router#

    ```


    This should not be done lightly! Existing connections to the Internet may hang
    momentarily or even terminate. The router''s CPU utilization will climb dramatically
    as the routes are cleared and all the new BGP information is received from the
    peer. If you have an older or smaller router, you can expect your terminal window
    to be almost useless.


    On a more serious note, the rest of the world will see that your routes have just
    "flapped"; they''ve been withdrawn from that peer, and suddenly reappear. If you
    do this several times in quick succession, other autonomous systems will "dampen"
    your route announcements due to flap. They will ignore your route updates, and
    they may ignore routes to your network entirely until you can stop bouncing up
    and down. This is a necessary part of BGP; sudden withdrawals and insertions of
    a particular'
  - '[PAGE 102]


    route can cause smaller routers to overload and crash. It''s generally assumed
    that route flap is due to circuit or hardware problems, not someone repeatedly
    resetting their BGP session. A BGP reset can be thought of as the computer equivalent
    of dropping a cinderblock on your foot—you won''t be able to do much beside hop
    around on one foot and think about what you''ve done for a few minutes. Routers
    assume that even if you have a good reason for doing it once, you''re smart enough
    to not keep on doing it.⁴


    Having said that, you can clear all of your BGP sessions simultaneously by using
    an asterisk instead of an IP address. All of the warnings above apply even more
    strongly for such mass BGP resets.


    If your BGP problems persist, contact the ISP that is showing the odd behavior
    and ask who has been playing with the router configuration.


    # **NOTE** *Monitoring Router Traffic*


    > *How are you supposed to know how your traffic is flowing over each circuit?
    Although you have several options I highly recommend using the free tool MRTG
    (http://www.mrtg.org) to perform basic router monitoring. MRTG will tell you how
    much traffic is going in and out each circuit, and it can be expanded to track
    how much memory and CPU time your router is using. I don''t know how anyone can
    possibly manage a router without using MRTG or an equivalent tool.*


    # *Load Balancing BGP*


    If you were paying attention, you probably caught the emphatic bit earlier about
    how BGP is not a load-balancing protocol and find the title of this section inexplicable.
    BGP does not perform load balancing, but you can do some manual tricks that will
    allow you to adjust usage of your Internet circuits. You can also purchase products
    that will add load balancing to BGP or perform pseudo load balancing via DNS or
    NAT, or perform other unrelated tricks. Without purchasing additional equipment,
    however, you can use the BGP protocol against itself to perform crude load adjustments.
    By judiciously adding AS "hops" to the routes you receive and offer, you can increase
    the distance that the BGP algorithm sees to routes from different network areas.


    ⁴ This may be the most fundamental difference between computers and human beings.'
  - "[PAGE 103]\n\nBefore you can adjust your router's traffic flow, you must know\
    \ how much traffic goes over your circuits on a long-term basis. I previously\
    \ suggested MRTG (http://www.mrtg.org) for traffic measurement, and I suggest\
    \ it even more strongly here. If you're reading this without setting up a traffic\
    \ measurement tool, you may not have shot yourself in the foot yet, but you have\
    \ loaded the gun and started eyeing your big toe.\n\nLook at your traffic throughput\
    \ on each provider. Frequently, your router will choose to transmit outbound traffic\
    \ to one provider more often than the other. It's quite common to see a small\
    \ office with two T1 circuits using one circuit ten times more than the other.\
    \ When one circuit is using 1.0Mb/second, the other might only be using 0.1Mb/second.\
    \ This is fine if your bandwidth usage is low, but if your more popular circuit\
    \ fills up, you'll only be using 0.15Mb/second on your less popular circuit. This\
    \ would give you network usage of about 1.6Mb/second, or only slightly more than\
    \ half your available bandwidth. Worse, network requests sent out over the popular\
    \ circuit will return very, very slowly. Similarly, if most of your traffic arrives\
    \ over one circuit, you may find that one circuit is choked with inbound requests\
    \ while your alternate circuit is empty.\n\nIf you go look at the routes in your\
    \ router for destinations that are being reached over the slow circuit, you'll\
    \ see that they are being sent that way because they have the shortest AS path.\
    \ For example, assume that your router prefers to send traffic over one circuit\
    \ in heavy preference over the other. Pick some random site that is always reached\
    \ via one provider and check its BGP information. Here, we've chosen to check\
    \ the BGP information on the system 192.1.120.84.\n\n```\nrouter# sho ip b 192.1.120.84\n\
    BGP routing table entry for 192.1.120.0/24, version 4521114\nPaths: (2 available,\
    \ best #1, table Default-IP-Routing-Table)\n  Not advertised to any peer\n  300\
    \ 400\n    172.16.0.2 from 172.16.0.2 (129.250.61.128)\n      Origin IGP, metric\
    \ 0, localpref 100, valid, external, best\n      Community: 190972324 190973904\
    \ 190974904\n  200 600 500\n    10.1.8.5 from 10.1.8.5 (10.1.8.23)\n      Origin\
    \ IGP, localpref 100, valid, external\nrouter#\n```\n\nThis first route is across\
    \ two autonomous systems, 300 and 400. The second route traverses three autonomous\
    \ systems,"
- md: "200, 600, and 500. The first route uses fewer autonomous systems, so it is\
    \ preferred.\n\nIn this common unequal-use situation, one provider consistently\
    \ offers a shorter AS path to other networks than the other. This is not at all\
    \ uncommon, and is not a symptom that one network is \"better connected\" than\
    \ another; in fact, it may be that the provider with the higher AS count has faster\
    \ connections than the other! Now that you understand the problem, the solution\
    \ is obvious: make the AS path of the more heavily used peer longer, so that your\
    \ router will choose it less often. In this example, we want to increase the path\
    \ length of routes we receive from AS300. You can adjust path length via AS path\
    \ by prepending (adding) additional AS numbers in front of a peer.\n\nHere is\
    \ the snippet of BGP configuration that we must alter and its current route maps.\n\
    \n```\nrouter bgp 100\n neighbor 172.16.0.2 remote-as 300\n neighbor 172.16.0.2\
    \ route-map ispB-out out\n route-map ispB-out\n  match ip address 130\n```\n\n\
    Our AS300 peering session currently has only one route map, and it is applied\
    \ to outbound announcements. If we wanted to alter our announcements to this peer,\
    \ we could edit the existing route map, but we want to alter the incoming announcements\
    \ from this peer, so we need a new route map.\n\n```\nrouter# conf t\nrouter(config)#\
    \ router bgp 100\nrouter(config-router)# neighbor 172.16.0.2 route-map ispB-in\
    \ in\nrouter(config-router)# ^Z\n```\n\nHere, we tell the BGP session to use a\
    \ new route map for ISP B, called ispB-in. This new route map is applied only\
    \ to incoming announcements.\n\n```\nrouter# conf t\nrouter(config)# route-map\
    \ ispB-in permit 10\nrouter(config-route)# set as-path prepend 300 300\n```\n\n\
    This creates the ispB-in route map. Every announcement that arrives over it will\
    \ have its AS path extended by prepending two 300s to it.\n\nAfter you make this\
    \ change and save your work, make the new route map take effect by clearing this\
    \ peer's BGP session.\n\n```\nrouter# clear ip bgp 172.16.0.2\n```\n\nWhen you\
    \ have reset the BGP session, recheck your test routes. The output will have a\
    \ few minor, but important, changes. Specifically, the AS path from AS300 will\
    \ now have two extra 300s in front of it, much like this:\n\n```\n300 300 300\
    \ 400\n```\n\nThis will make the other AS path appear shorter and thus make it\
    \ preferable for this route.\n\nDo not be too quick with AS path prepending. While\
    \ we added two AS hops in this example, it is best to add a single AS hop to a\
    \ peer at a time to see how it affects performance. If necessary, you can add\
    \ additional hops later. (You do have MRTG running to display the effects of this\
    \ every few minutes, correct?)\n\nIf your incoming traffic is biased toward one\
    \ peer or another, change your outgoing announcements to balance those. The important\
    \ thing to remember here is that you must prepend your own AS number to outbound\
    \ announcements instead of your peer's. You would be quite annoyed if someone\
    \ else started using your AS number, and you can expect that your peers feel the\
    \ same about theirs.\n\nThe nice thing here is that you already have outbound\
    \ route maps. To add an AS path prepend, simply edit the existing map to add the\
    \ line for AS path prepending.\n\n```\nrouter# conf t\nrouter(config)# route-map\
    \ ispB-out permit 10\nrouter(config-route)# set as-path prepend 100\n```\n\nOur\
    \ BGP configuration already references the ispB-out route map, so we don't have\
    \ to touch the BGP configuration at all. Just go into configure mode and edit\
    \ the existing route map to add the AS prepending rule. You still must clear the\
    \ BGP session with this peer to make the change take effect, however.\n\n## Propagation\
    \ of BGP Updates\n\nNow that you know enough about BGP to be dangerous, you should\
    \ know that BGP announcements may take up to 20 minutes to be visible throughout\
    \ the world. Although your peers should pick them up quickly, you can't expect\
    \ that everyone everywhere is so well connected to you. After changing your BGP\
    \ setup, wait at least 20 minutes to see what the real effects are before making\
    \ another change. This will also help reduce the risk of being marked as a flapping\
    \ BGP source and black-holing yourself off the Internet.\n\nIf you want to see\
    \ how your BGP announcements are being viewed by the outside world, search the\
    \ Internet for a \"BGP Looking Glass.\" These are web pages that allow you to\
    \ query routers for BGP information. By asking remote routers for BGP information\
    \ on your block of IP addresses, you can see what announcements they are seeing\
    \ and how other people view your network. If you are having a problem with BGP\
    \ configuration, you can use several looking glasses to determine who can see\
    \ your routes and who cannot, and thereby identify the scope of the problem. This\
    \ information can also help you to identify problems such as one of your peers\
    \ not propagating your announcements beyond their network or altering your announcements\
    \ in some way.\n\n## Hot Standby Router Protocol\n\nAfter you have BGP up and\
    \ running, the next obvious question is, \"What do we do if the router itself\
    \ fails?\" While Cisco routers are generally reliable, even the best hardware\
    \ sometimes lets the magic smoke escape and transforms into a shiny metal paperweight.\
    \ Cisco supports the Hot Standby Router Protocol (HSRP) to provide live failover\
    \ between routers in this eventuality. You can build a \"pool\" of independent\
    \ Cisco devices that will take over some functions of a failed router; not all\
    \ of the functions are covered, but enough are so that your users will not notice.\n\
    \n### What Is HSRP?\n\nHSRP lets multiple routers provide a single IP address.\
    \ This is most useful for your default gateway on your Ethernet. All your computers\
    \ know about the routers is that one of them had better have the default gateway\
    \ of (for example) 192.168.0.1; they don't care which router has it, just that\
    \ it's available. HSRP allows the routers to keep track of each other; when the\
    \ router that has the default gateway disappears from the network, another router\
    \ can automatically respond to requests for the default gateway's IP address.\
    \ In this case, each router has its own unique IP address on its Ethernet interface,\
    \ but might also have the default gateway as shown in Figure 7-2.\n\n![](img/b76c804cf499c7eeda3929279b928b62_107_0.png)\n\
    \nRouter A has an Ethernet interface on the office network. This interface has\
    \ the primary IP address of 192.168.0.2, but it can also host the IP address 192.168.0.1—the\
    \ default gateway for your computers. If you want to log in to Router A, SSH to\
    \ the address 192.168.0.2. Similarly, Router B also has an Ethernet interface\
    \ on the office network and a unique IP address of 192.168.0.3, but it can also\
    \ host the default gateway of 192.168.0.1. The routers settle between themselves\
    \ which is the \"default\" default router, but when that router fails, the other\
    \ will take over. In Cisco terminology, the IP address 192.168.0.1 is the *standby*\
    \ address. (Other implementations commonly call this a Virtual IP, or VIP.)\n\n\
    Very basic configuration of this Ethernet interface is only a couple of lines.\n\
    \n```\nrouter(config)# int fast0/0\nrouter(config-if)# ip address 192.168.0.2\
    \ 255.255.255.0\nrouter(config-if)# standby 1 ip 192.168.0.1\n```\n\nApply the\
    \ standby entry to both router configurations, and abruptly you'll be able to\
    \ ping 192.168.0.1. Keep pinging that IP while you reboot routers, and you won't\
    \ even see a single dropped packet—unless, of course, you turn both routers off\
    \ at once!\n\nA single router interface can support multiple HSRP standby IP addresses.\
    \ Each has to be identified as a group. Use the group identifier in every configuration\
    \ involving that particular standby IP.\n\n### Tuning HSRP\n\nWhile the above\
    \ will handle most of the work of live failover for most circumstances, you'll\
    \ find that HSRP requires some fine-tuning to be truly transparent. The most commonly\
    \ tweaked features are `preemption`, `interface tracking`, `delay`, and `authentication`.\n\
    \n#### Preemption\n\nPreemption is where a particular interface declares itself\
    \ to be in charge of the standby IP address and forces all others to relinquish\
    \ their claims to that address. This means that a particular router defaults to\
    \ supporting the HSRP, letting all others only be backups. This is handled by\
    \ assigning a priority to each interface that supports the standby IP, and letting\
    \ the router with the highest priority claim it. By default, every router in a\
    \ standby group has a priority of 100. To set a priority, use the keyword priority\
    \ in the configuration.\n\n```\nrouter(config)# int fast0/0\nrouter(config-if)#\
    \ standby 1 preempt\nrouter(config-if)# standby 1 priority 105\n```\n\nStart by\
    \ allowing this router to demand to host the standby IP from lower-priority routers.\
    \ If you use preemption, all routers in a standby group should have this entry.\
    \ Then set this particular router to have a priority of 105.\n\n#### Interface\
    \ Tracking\n\nIt can be convenient to assign a single router to be the master\
    \ of the standby group, if only so you know which router is in charge. (Network\
    \ administrators, as a class, are not comfortable saying that “traffic goes into\
    \ a cloud near our routers and magic things happen.” They prefer statements such\
    \ as, “Traffic will unequivocally go to Router A as long as A is running.”) At\
    \ times, your chosen router might not be a sensible choice. Look at Figure 7-2\
    \ again. Each of our routers has a single line to the Internet. If a router's\
    \ Internet circuit goes down, it no longer makes sense for that router to be the\
    \ standby master; traffic would go through an extra hop for no good reason. We\
    \ can cause a router's HSRP priority to drop by using interface tracking. When\
    \ your interface being tracked goes down, the HSRP priority automatically decreases.\n\
    \n```\nrouter(config)# int fast0/0\nrouter(config-if)# standby 1 track Serial0\n\
    ```"
  mdcn: "\n200、600和500。第一条路由使用的自治系统较少，因此更受青睐。\n\n在这种常见的不均衡使用情况下，一个提供商为其他网络提供的AS路径始终比另一个提供商短。这种情况并不罕见，也并非表明一个网络比另一个网络\"\
