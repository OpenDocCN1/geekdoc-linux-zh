- md: " ## 1\n\n## BEFRIENDING THE COMMAND LINE\n\nThis book focuses entirely on the\
    \ command line. Why? Some Cisco routers include a web interface; others don't.\
    \ Cisco sells advanced router management packages, but they require a complicated\
    \ client environment that you might not have available when you really need it.\
    \ You might only need to log in to the router once a year or less; what are the\
    \ chances that your desktop system with all the fancy management tools has undergone\
    \ some drastic surgery in the meantime, and the router tools no longer work the\
    \ way you expect? Personally, I dislike trying to solve Windows problems when\
    \ the router is down. The one environment available on every Cisco router is the\
    \ command line.\n\nThe command line gives you absolute control over every aspect\
    \ of your router's behavior. Some configuration changes can only be realistically\
    \ made at the command line. If your router loses its configuration, you'll need\
    \ to use the command line to restore enough of its mind that your fancy tools\
    \ can talk to it. So, if you must use the command line in those desperate circumstances,\
    \ it's best that you learn enough to be comfortable there.\n\n## EXEC versus Privileged\
    \ EXEC Mode\n\nBy default, when you first log in to a Cisco router you are in\
    \ `EXEC mode`. You can execute basic diagnostic commands and look at things, but\
    \ you cannot actually change configuration settings or view sensitive information.\
    \ For example, in EXEC mode, you can see if an interface is receiving errors,\
    \ and you can ping across a circuit to see if it is working, but you cannot reset\
    \ the interface. In EXEC mode, the command prompt ends in a \"greater than\" sign.\n\
    \n```\nRouter>\n```\n\nTo change anything, you must be in *privileged EXEC mode*,\
    \ which is a superuser or administrator security level protected by a unique password.\
    \ Privileged EXEC mode is sometimes called \"enable mode.\" In enable mode, you\
    \ can configure the router in any way desired, reboot the router, or take any\
    \ other action possible in the software.\n\nTo enter privileged EXEC mode, use\
    \ the enable command. When you actually have a password set to access enable mode,\
    \ the router will prompt for it when you try to enable. See the \"Passwords\"\
    \ section in Chapter 8.\n\n```\nRouter>enable\nRouter#\n```\n\nIn enable mode,\
    \ the command prompt ends in a pound sign. The old method of Cisco access control\
    \ was to give the standard EXEC password to all the technicians but restrict the\
    \ enable password to the senior techs. Setting up discrete usernames is a better\
    \ way to achieve a similar effect, but many older routers still only use unprivileged\
    \ and enable passwords—either because they haven't been updated, or because that's\
    \ all that they can support. There's nothing wrong with restricting the use of\
    \ privileged mode in this way, especially in a small shop where only one or two\
    \ people connect to the equipment, but if you have more people you'll probably\
    \ want to set up separate usernames and allow individuals to be privileged or\
    \ not. We'll see how to do this in Chapter 8.\n\n## Integrated Help\n\n\"Help\"\
    \ might be too strong a word, but routers give hints on commands, command syntax,\
    \ and the features available in the router. Different versions of the Cisco IOS\
    \ have different features, and it's not easy to identify them all. The simplest\
    \ way to see what commands are available is to ask the router. Once you've logged\
    \ in, enter a single question mark at the command prompt.\n\n```\nrouter#?\nExec\
    \ commands:\n  <1-99>         Session number to resume\n  clear          Reset\
    \ functions\n  clock          Manage the system clock\n...\n```\n\nMy test router\
    \ has four full screens of commands available from a single question mark. Many\
    \ of these commands are completely irrelevant for a router that is providing basic\
    \ Internet capability; such activities require only a very small subset of Cisco's\
    \ features. Still, this can be a helpful reminder when you can't quite remember\
    \ the name of a particular command.\n\nYou can request hints about individual\
    \ commands. Many actions require one or more words to complete, and Cisco's integrated\
    \ help system will provide helpful reminders about syntax or required information\
    \ upon request. For example, the show command is used to view system information.\
    \ If you want to know what arguments a show command can take, ask the router by\
    \ entering show ?.\n\n```\nrouter#show ?\n  access-expression   List access expression\n\
    \  access-lists        List access lists\n  accounting          Accounting data\
    \ for active sessions\n  adjacency           Adjacent nodes\n...\n```\n\nOn some\
    \ versions of the IOS, this output can go on for screens and screens. If you know\
    \ the first part of a command's name, even just the first letter, you can narrow\
    \ it down by giving what you remember of the command and a question mark.\n\n\
    ```\nrouter#show a?\naccess-expression  access-lists  accounting  adjacency  aliases\n\
    alps              arp            async\nrouter#show a\n```\n\nNote that on your\
    \ next command-line prompt, the router automatically prints the chunk of command\
    \ that you gave before the question mark. The system knows that you want to type\
    \ something that begins with `show a`, and is trying to make it easier for you.\n\
    \nOne thing to remember is that hints on a particular command are only available\
    \ in the mode in which the command is available. For example, the commands beginning\
    \ with `ip`, such as `ip route`, are only available in enable mode. Entering `ip\
    \ ?` in standard EXEC mode will generate an \"unrecognized command\" error.\n\n\
    ## Command Abbreviation\n\nOne interesting feature of the Cisco IOS is that it\
    \ allows the user to abbreviate command names to the shortest unique abbreviation\
    \ for a word. For example, one common command we'll use again and again to view\
    \ settings is `show`. If you ask your router for all the commands beginning with\
    \ the letter `s`, you'll get a whole list.\n\n```\nrouter#s?\n*s=show  sdlc  send\
    \       set   setup\nshow     slip  start-chat  systat\nrouter#\n```\n\nNote that\
    \ only the command `show` begins with the letters `sh`. You can use the letters\
    \ `sh` as an abbreviation for the full word `show`; the router is smart enough\
    \ to know that you couldn't possibly be typing any other legitimate command that\
    \ begins with those letters. In this particular case, the letter `s` is also specially\
    \ marked to indicate that it is an abbreviation for `show`; apparently Cisco thought\
    \ that `show` was so commonly used that it made sense to abbreviate it further.\n\
    \nIn this book, we will give commands in the text by their full forms. Example\
    \ commands may be in abbreviated form if they are commonly used that way.\n\n\
    ## 2\n\n## ROUTER CONFIGURATION\n\nNow that you're logged in, let's set up the\
    \ router. The `show version` command explains some basic facts about your router,\
    \ such as the software version, hardware type, and supported interfaces. Because\
    \ the output is quite long, I won't include it all here, but we'll look at a few\
    \ important snippets.\n\n```\nrouter#show version\nCisco Internetwork Operating\
    \ System Software\nIOS (tm) 3600 Software (C3640-I556I-M), Version 12.0(7)XK1,\n\
    EARLY DEPLOYMENT RELEASE SOFTWARE (fc1)\n...\n```\n\nThe second line gives you\
    \ the hardware platform this IOS is meant for and its version number. If you have\
    \ to contact Cisco, you will need to provide the version number. Next are details\
    \ about who built this software and when, the ROM version, and so on. While Cisco\
    \ would certainly want to see all of this information if you called for support,\
    \ you can't do much with it yourself.\n\n```\n...\nrouter Uptime is 4 weeks, 4\
    \ days, 9 hours, 53 minutes\nSystem returned to ROM by reload\nSystem image file\
    \ is \"flash:c3640-i556i-mz-120-7-XK1\"\ncisco 3640 (R4700) processor (revision\
    \ 0x00) with 123904K/7168K bytes of memory.\n...\n```\n\n- 4 FastEthernet/IEEE\
    \ 802.3 interface(s)\n- 6 Serial network interface(s)\n...\n\nConfiguration register\
    \ is 0x2102\n\nThe uptime tells how long the router has been running (4 weeks,\
    \ 4 days, 9 hours, 53 minutes), and the next line explains why it last went down.\
    \ (A reload is a software-driven reboot, as we'll discuss in Chapter 5.) When\
    \ a coworker asks, \"Are we having Internet trouble?\" it's nice to be able to\
    \ say that the router has been working all along.\n\nThe system image file (in\
    \ this listing, \"flash:c3640-i556i-mz-120-7-XK1\") is the location and name of\
    \ the file that the router loaded as its operating system; this information will\
    \ be important when the time comes to upgrade your IOS. The model information\
    \ and physical characteristics of the router (shown below the system image file)\
    \ can be important; if your router is in a remote office, looking at this information\
    \ may be the easiest way to learn what sort of equipment it is. (It would have\
    \ been even easier for you to document the router before sending it to the remote\
    \ location, but generally it's easiest of all to just ship it and forget it.)\n\
    \nAfter a few more lines that detail software features, we'll see the interface\
    \ types installed in this router. The router"
  mdcn: "\n ## 1\n\n## 结识命令行\n\n本书完全聚焦于命令行。为什么？有些 Cisco 路由器包含 Web 界面，而有些则没有。Cisco\
    \ 销售高级路由器管理软件包，但它们需要一个复杂的客户端环境，而当你真正需要它时，可能无法使用该环境。你可能一年才需要登录一次路由器或更少；在这种情况下，你那个安装了所有花哨管理工具的桌面系统在此期间经历某种剧烈变动（如重装或升级），导致路由器工具不再按预期工作的概率有多大？就个人而言，我不喜欢在路由器宕机时还得尝试解决\
    \ Windows 的问题。而每一个 Cisco 路由器上都唯一可用的环境就是命令行。\n\n命令行让你能够绝对控制路由器的每一个行为维度。某些配置更改在现实中只能在命令行中完成。如果你的路由器丢失了配置，你需要使用命令行来恢复它的“意识”，以便你的花哨工具能够与其通信。因此，如果你必须在那些绝望的情况下使用命令行，最好学习足够的知识以便在那里感到自在。\n\
    \n## EXEC 模式与特权 EXEC 模式\n\n默认情况下，当你第一次登录 Cisco 路由器时，你处于 `EXEC mode`（EXEC 模式）。你可以执行基本的诊断命令并查看情况，但不能实际更改配置设置或查看敏感信息。例如，在\
    \ EXEC 模式下，你可以查看接口是否收到错误，并且可以通过电路进行 ping 操作以查看其是否正常工作，但你不能重置接口。在 EXEC 模式下，命令提示符以“大于”号结尾。\n\
    \n```\nRouter>\n```\n\n要更改任何内容，你必须处于 *privileged EXEC mode*（特权 EXEC 模式），这是一个由唯一密码保护的超级用户或管理员安全级别。特权\
    \ EXEC 模式有时被称为“enable 模式”。在 enable 模式下，你可以按任何所需方式配置路由器，重启路由器，或执行软件中可能的任何其他操作。\n\
    \n要进入特权 EXEC 模式，请使用 `enable` 命令。当你实际设置了访问 enable 模式的密码时，当你尝试 enable 时，路由器会提示你输入密码。请参阅第\
    \ 8 章的“密码”部分。\n\n```\nRouter>enable\nRouter#\n```\n\n在 enable 模式下，命令提示符以井号结尾。Cisco\
    \ 过去的一种访问控制方法是将标准 EXEC 密码提供给所有技术人员，但将 enable 密码限制在高级技术人员手中。设置独立的用户名是实现类似效果的更好方法，但许多旧路由器仍然仅使用非特权密码和\
    \ enable 密码——要么是因为它们没有更新，要么是因为它们仅支持这些。以这种方式限制特权模式的使用并没有错，尤其是在只有一两个人员连接设备的规模较小的店铺中，但如果你有更多的人员，你可能想要设置单独的用户名并允许个人拥有或不拥有特权。我们将在第\
    \ 8 章中了解如何实现这一点。\n\n## 集成帮助\n\n“帮助”这个词可能太强了，但路由器会提供关于命令、命令语法以及路由器中可用功能的提示。不同版本的\
    \ Cisco IOS 具有不同的功能，要识别所有这些功能并不容易。查看可用命令最简单的方法就是询问路由器。登录后，在命令提示符处输入一个问号。\n\n```\n\
    router#?\nExec commands:\n  <1-99>         Session number to resume\n  clear \
    \         Reset functions\n  clock          Manage the system clock\n...\n```\n\
    \n我的测试路由器在输入单个问号后有四个满屏的可用命令。对于一个仅提供基本 Internet 功能的路由器来说，其中许多命令完全无关；此类活动仅需要 Cisco\
    \ 功能的一个很小的子集。尽管如此，当你不能完全记得某个特定命令的名称时，这可以是一个有用的提醒。\n\n你可以请求关于单个命令的提示。许多操作需要一个或多个单词才能完成，Cisco\
    \ 的集成帮助系统将在请求时提供关于语法或所需信息的有用提醒。例如，`show` 命令用于查看系统信息。如果你想知道 `show` 命令可以接受哪些参数，可以通过输入\
    \ `show ?` 来询问路由器。\n\n```\nrouter#show ?\n  access-expression   List access expression\n\
    \  access-lists        List access lists\n  accounting          Accounting data\
    \ for active sessions\n  adjacency           Adjacent nodes\n...\n```\n\n在某些版本的\
    \ IOS 中，此输出可能会持续好几屏。如果你知道命令名称的第一部分，哪怕只是第一个字母，你可以通过输入记得的命令部分加上一个问号来缩小范围。\n\n```\n\
    router#show a?\naccess-expression  access-lists  accounting  adjacency  aliases\n\
    alps              arp            async\nrouter#show a\n```\n\n请注意，在你的下一个命令行提示符中，路由器会自动打印你在问号之前输入的命令片段。系统知道你想输入以\
    \ `show a` 开头的内容，并试图为你提供方便。\n\n需要记住的一点是，特定命令的提示仅在该命令可用的模式中提供。例如，以 `ip` 开头的命令（如\
    \ `ip route`）仅在 enable 模式下可用。在标准 EXEC 模式下输入 `ip ?` 将产生“unrecognized command”（无法识别的命令）错误。\n\
    \n## 命令缩写\n\nCisco IOS 一个有趣的特性是它允许用户将命令名称缩写为该单词的最短唯一缩写。例如，我们将反复使用的一个查看设置的常用命令是\
    \ `show`。如果你询问路由器所有以字母 `s` 开头的命令，你会得到一个完整的列表。\n\n```\nrouter#s?\n*s=show  sdlc\
    \  send       set   setup\nshow     slip  start-chat  systat\nrouter#\n```\n\n\
    请注意，只有 `show` 命令以字母 `sh` 开头。你可以使用 `sh` 作为完整单词 `show` 的缩写；路由器足够智能，知道你不可能在输入任何其他以这些字母开头的合法命令。在这种特殊情况下，字母\
    \ `s` 也被特别标记以指示它是 `show` 的缩写；显然 Cisco 认为 `show` 的使用如此频繁，以至于进一步缩写它是合理的。\n\n在本书中，我们将在正文中使用命令的全称。如果示例命令在实际中常用缩写形式，则可能会以缩写形式给出。\n\
    \n## 2\n\n## 路由器配置\n\n现在你已经登录，让我们来设置路由器。`show version` 命令解释了关于路由器的一个基本事实，例如软件版本、硬件类型和支持的接口。由于输出非常长，我不会在这里全部列出，但我们将查看几个重要的片段。\n\
    \n```\nrouter#show version\nCisco Internetwork Operating System Software\nIOS\
    \ (tm) 3600 Software (C3640-I556I-M), Version 12.0(7)XK1,\nEARLY DEPLOYMENT RELEASE\
    \ SOFTWARE (fc1)\n...\n```\n\n第二行给出了此 IOS 所针对的硬件平台及其版本号。如果你必须联系 Cisco，你需要提供版本号。接下来是关于谁在何时构建了此软件、ROM\
    \ 版本等详细信息。虽然如果你拨打支持电话，Cisco 肯定希望看到所有这些信息，但你自己能用这些信息做的事情不多。\n\n```\n...\nrouter\
    \ Uptime is 4 weeks, 4 days, 9 hours, 53 minutes\nSystem returned to ROM by reload\n\
    System image file is \"flash:c3640-i556i-mz-120-7-XK1\"\ncisco 3640 (R4700) processor\
    \ (revision 0x00) with 123904K/7168K bytes of memory.\n...\n```\n\n- 4 FastEthernet/IEEE\
    \ 802.3 interface(s)\n- 6 Serial network interface(s)\n...\n\nConfiguration register\
    \ is 0x2102\n\n运行时间（uptime）告诉我们路由器已经运行了多久（4 周 4 天 9 小时 53 分钟），下一行解释了它上次宕机的原因。（Reload\
    \ 是软件驱动的重启，我们将在第 5 章中讨论。）当同事问“我们的互联网出问题了吗？”时，能够说出路由器一直正常运行是非常惬意的。\n\n系统镜像文件（在本列表中为\
    \ \"flash:c3640-i556i-mz-120-7-XK1\"）是路由器作为操作系统加载的文件位置和名称；当需要升级 IOS 时，此信息将非常重要。路由器的型号信息和物理特性（显示在系统镜像文件下方）也很重要；如果你的路由器在远程办公室，查看这些信息可能是了解它是什么设备最简单的方法。（在将路由器发送到远程位置之前对其进行记录会更简单，但通常最简单的方法就是直接发货然后随它去。）\n\
    \n在另外几行详细介绍软件功能的内容之后，我们将看到此路由器中安装的接口类型。路由器\n"
