    ## Plugging It All Together


    After the router is configured, you wouldn''t think that actually plugging everything
    together would be a problem, would you? It will probably work just fine, but let''s
    go through what you can do when things go wrong.


    First, make sure that you use a good-quality Cat 5 cable to connect your CSU/DSU
    or router to the smartjack. You can get away with the cheap stuff on the secretary''s
    Ethernet connection, but telco circuits are sensitive. Use a cable of the correct
    length; don''t coil up the surplus and leave it dangling from the wall, and don''t
    stretch it taut like a tripwire. Cable quality is responsible for a fair number
    of problems.


    In theory, after the circuit is plugged into your preconfigured router, you should
    be able to activate the routers at each end, and the circuit should just come
    up. At this point, log in to the routers and make sure that your serial line has
    a status of "up" and a line protocol of "up." If the line is up, but the protocol
    is down, double-check your line encapsulation and then the rest of your configuration.


    If you’ve confirmed that the interfaces are correctly configured, but the line
    still doesn’t come up, phone the company that sold you the circuit and have them
    test it. If the telco can successfully and cleanly loop up the CSU/DSU at both
    ends, and your configuration is correct, your hardware is bad. Contact Cisco and
    get the help you need; new parts can be on site in as little as four hours.


