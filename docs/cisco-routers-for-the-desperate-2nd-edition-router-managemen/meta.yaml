    setup, each peer only needs two bits of information: the  AS of the remote side,
    and a  route map used to identify permitted traffic. Like access lists, route
    maps are very powerful tools that require a lot of education to use to their full
    potential, but we''ll cover just enough to get BGP working. I recommend  naming
