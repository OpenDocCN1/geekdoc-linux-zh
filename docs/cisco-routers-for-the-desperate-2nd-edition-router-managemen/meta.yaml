    \ Ethernet interface's IP address is the default gateway of the attached network.\
    \ For example, to set the IP address to 192.168.1.1, with a netmask of 255.255.255.128,\
    \ you would use the following command.\n\n```\nrouter(config-if)#ip address 192.168.1.1\
    \ 255.255.255.128\n```\n\nAfter you have this basic configuration, you can go\
    \ on to a variety of other settings.\n\n## Description\n\nWhile entering a description\
    \ is almost pointless for a simple router with a single T1 port and a single Ethernet,\
    \ the description field is very useful when your router has multiple Ethernet\
    \ interfaces. Enter a description with the description keyword.\n\n```\nrouter(config-if)#description\
    \ DMZ network\n```\n\n## duplex\n\nBy default, the router will attempt to autonegotiate\
    \ the duplex setting of a connection. You can force a particular setting with\
    \ the duplex keyword, which has three legitimate settings: auto, half, and full.\
    \ Here, we force a connection into half-duplex mode. (You might try this if the\
    \ router negotiates a full-duplex connection but seems to be dropping packets.)\n\
    \n```\nrouter(config-if)#duplex half\n```\n\nCisco recommends leaving duplex at\
    \ the default setting (auto) so the router will negotiate its own best duplex.\n\
    \n## speed\n\nMuch like duplex settings, the router will attempt to negotiate\
    \ the best possible network bandwidth with its switch or hub. You can make the\
    \ router run at only a single bandwidth setting and refuse to run at other speeds\
    \ with the speed setting.\n\nLegitimate values for the speed setting vary widely\
    \ with the interface type, but you can ask an interface what speeds it supports\
    \ with the standard ? syntax. Here we interrogate an interface to determine supported\
    \ speeds and then hard-code a desired speed into the configuration.\n\n```\nrouter(config-if)#speed\
    \ ?\n 10    Force 10 Mbps operation\n 100   Force 100 Mbps operation\n auto  Enable\
    \ AUTO speed configuration\nrouter(config-if)#speed 100\n```\n\nThe problem with\
    \ hard-coding speed is that if you change your hub or switch without changing\
    \ the router setting, your Ethernet interface may either stop working or perform\
    \ suboptimally. Much like the duplex setting, if you hard-code a speed, your router\
    \ will refuse to fall back to a degraded mode. There's nothing quite like tracing\
    \ a troublesome network issue down to an obsolete hard-coded network speed; it\
    \ makes me ask, \"Who was the idiot who set this?\"¹ I recommend leaving duplex\
    \ on auto, the default.\n\n## Disabling Broadcast Pings\n\nThe IP top address\
    \ in every network (the address ending in .255 for a network with a 255.255.255.0\
    \ netmask) is the broadcast address. Traditionally, a ping to that address makes\
    \ every machine on that network respond. While this was useful for troubleshooting\
    \ and maintenance, network attackers discovered that they could use this to create\
    \ one of the first distributed denial-of-service (DDoS) attacks. Today, it's generally\
    \ considered wise to disable your router's ability to relay these directed broadcast\
    \ pings from the local network.\n\n```\nrouter(config-if)#no ip directed-broadcast\n\
    ```\n\n## Multicast Routing Cache\n\nBy default, modern Cisco IOS versions enable\
    \ a routing cache for multicast networking, which would improve performance for\
    \ multicast routing operation. However, they then disable this cache in the default\
    \ configuration. (I'm sure they have a good reason for not just disabling it by\
    \ default, really.) This shows up in your configuration as `no ip mroute-cache`.\
    \ If you are using multicast routing, get rid of this configuration statement.\n\
    \n```\nrouter(config-if)#ip mroute-cache\n```\n\n## Interface Media Type\n\nOlder\
    \ routers (such as some frequently found on auction sites) have both an AUI and\
    \ a 10BaseT Ethernet port. Despite appearances, these routers have only one Ethernet\
    \ interface with only two connectors. You can use either the AUI port or the 10BaseT\
    \ port, but not both simultaneously. Choose the connector you want with the `media-type`\
    \ keyword and either the `aui` or `10baseT` setting.\n\n```\nrouter(config-if)#media-type\
    \ 10baseT\n```\n\nThis is unnecessary on routers with a single physical plug per\
    \ Ethernet interface. You can identify these routers easily enough by looking\
    \ at the Ethernet ports.\n\n## Serial Interfaces\n\nA serial network has only\
    \ two nodes, one at each end, and only transmits data between those two points.\
    \ This makes managing a serial link much simpler than an Ethernet one, but the\
    \ line connecting your router to the remote network has a far wider variety of\
    \ options that can be set.\n\nWhile you can run a serial link between two routers\
    \ by attaching the right cable between their serial ports, a serial line is usually\
    \ provided by a phone company and runs between two different locations much farther\
    \ apart than the few hundred feet that Ethernet can tolerate. We'll concentrate\
    \ on telco-provided T1 circuits like the ones you would find in an ISP connection\
    \ or between two offices.\n\nHere's the beginning of the `sho int` output of a\
    \ typical Cisco T1 interface. Despite the scary reputation serial interfaces have,\
    \ a serial line is in many ways much simpler to configure than an Ethernet interface,\
    \ because it has many fewer options.\n\n```\nSerial1/0 is up, line protocol is\
    \ up\nHardware is DSCC4 with integrated T1 CSU/DSU\n...\n```\n\n¹ The answer to\
    \ this question is usually \"me.\""
  mdcn: "\n线路已启动，但线路协议关闭，这可能就是你需要更改的设置。关于常见封装类型，请参阅第4章。\n\n## 配置接口\n\n你在配置模式下（如第2章所述）输入单个接口的配置信息，但为此你必须指定该配置适用的接口。进入配置模式后，输入接口名称。\n\
    \n```\nrouter#conf t\nrouter(config)#int faste2/0\nrouter(config-if)#\n```\n\n\
    `config-if`（思科术语，表示“配置接口”）标签表明你所做的配置更改将仅应用于你指定的那个接口。\n\n要退出接口配置模式或路由器配置模式，请按CTRL-Z。\n\
    \n## 以太网接口\n\n几乎每台思科路由器都有一个或多个以太网接口。以太网是一种广播介质。许多设备可以连接到单个以太网网络，主机传输的信息会在整个以太网网络上广播。几乎所有现代办公网络都是以太网。\n\
    \n理论上，以太网网络上的每台主机都能看到该网络上每台主机传输的所有数据。（虽然交换机主要将广播定向到目标计算机，但即使是顶级交换机仍会向网络上的所有主机“泄露”一些信息。）如果你的本地以太网出现问题，交换机故障是最常见的原因。（如果你仍在使用集线器，那几乎肯定就是问题所在。请尽快加入21世纪。）在归咎于路由器之前，请务必检查集线器和交换机。\n\
    \n尽管过去以太网可以在各种物理介质上运行，但如今几乎所有人都使用五类线或某种光纤。（你很可能会发现带有AUI端口的古老思科2500，但其中大多数也有10BaseT以太网端口。）\n\
    \n从思科的角度来看，所有以太网接口的配置方式都相同；只需记住连接速度将仅与最慢的网络设备一样快。例如，如果你将100Mb以太网交换机插入10Mb以太网路由器，连接速度将被限制为10Mb。\n\
    \n以下是典型思科快速以太网接口上`sho int`命令输出的开头部分。让我们看看一些有用的以太网特定信息。\n\n```\nrouter#sho int\
    \ faste2/0\nFastEthernet2/0 is up, line protocol is up\n  Hardware is AmdFE, address\
    \ is 0003.e35e.d1a1 (bia 0003.e35e.d1a1)\n...\n  Keepalive set (10 sec)\n  Half-duplex,\
    \ 10Mb/s, 100BaseTX/FX\n  ARP type: ARPA, ARP Timeout 04:00:00\n...\n```\n\n第一个有趣的信息是MAC（媒体访问控制）地址或以太网地址`0003.e35e.d1a1`。这是一个48位数字，理论上对每个以太网设备都是唯一的。（实际上，一些厂商会重复使用以太网地址，因为两台具有相同MAC地址的设备最终出现在同一网络上的概率微乎其微。）由于思科路由器允许你更改以太网接口的MAC地址，它们还会在括号中显示制造商分配给设备的原始烧录地址（bia）。在这种情况下，MAC地址和bia地址是匹配的。\n\
    \n活动以太网接口还会显示双工设置，在这种情况下是半双工。（双工通常在路由器和它连接的交换机之间自动协商。）\n\n不用担心配置自动协商，因为它在硬件中进行，无法配置。你可以硬编码此设置，但如果你更换设备或连接的交换机出现问题，这样做可能会导致各种问题。虽然你的交换机今天可能支持100Mb/s全双工，但如果它出现问题并必须回退到半双工，你硬编码的双工设置将导致电路断开。保持在降级模式下运行总比完全中断要好！如果可能，你最好的选择是允许路由器自动协商其双工设置，除非你已经理解了相关问题。\n\
    \n活动接口还会显示当前的网络速度。同样，虽然你可以硬编码速度，但通常最好让路由器与其连接的交换机或集线器协商，以了解它能最好支持哪些速度。最后，你可以看到连接到此接口的物理介质类型。如你所见，这个高质量的快速以太网接口连接到了一个慢速的、半双工的10MB网络设备。\n\
    \n## 配置以太网接口\n\n要让以太网接口加入网络，你必须进行的唯一更改是为其分配一个IP地址。\n\n```\nrouter(config-if)#ip\
    \ address <ip address> <netmask>\n```\n\n在大多数小型网络环境中，以太网接口的IP地址是所连接网络的默认网关。例如，要将IP地址设置为192.168.1.1，子网掩码为255.255.255.128，你可以使用以下命令。\n\
    \n```\nrouter(config-if)#ip address 192.168.1.1 255.255.255.128\n```\n\n完成此基本配置后，你可以继续进行各种其他设置。\n\
    \n## 描述\n\n虽然对于只有一个T1端口和一个以太网的简单路由器来说，输入描述几乎毫无意义，但当你的路由器有多个以太网接口时，描述字段非常有用。使用`description`关键字输入描述。\n\
    \n```\nrouter(config-if)#description DMZ network\n```\n\n## 双工\n\n默认情况下，路由器将尝试自动协商连接的双工设置。你可以使用`duplex`关键字强制设置特定值，它有三个有效选项：`auto`、`half`和`full`。这里，我们将连接强制为半双工模式。（如果路由器协商为全双工连接但似乎在丢包，你可以尝试此操作。）\n\
    \n```\nrouter(config-if)#duplex half\n```\n\n思科建议将双工保持在默认设置（`auto`），以便路由器协商其最佳的双工模式。\n\
    \n## 速度\n\n与双工设置类似，路由器将尝试与其交换机或集线器协商最佳的网络带宽。你可以使用`speed`设置使路由器仅在单一带宽设置下运行，并拒绝在其他速度下运行。\n\
    \n`speed`设置的有效值因接口类型而异，但你可以使用标准的`?`语法询问接口它支持哪些速度。这里我们查询一个接口以确定支持的速度，然后将所需速度硬编码到配置中。\n\
    \n```\nrouter(config-if)#speed ?\n 10    Force 10 Mbps operation\n 100   Force\
    \ 100 Mbps operation\n auto  Enable AUTO speed configuration\nrouter(config-if)#speed\
    \ 100\n```\n\n硬编码速度的问题在于，如果你更换集线器或交换机而没有更改路由器设置，你的以太网接口可能会停止工作或性能不佳。就像双工设置一样，如果你硬编码了速度，路由器将拒绝回退到降级模式。没有什么比将棘手的网络问题追溯到过时的硬编码网络速度更让人无语的了；这让我想问：“是谁设置的这个？”¹\
    \ 我建议将双工保持在默认值`auto`。\n\n## 禁用广播Ping\n\n每个网络中的顶级IP地址（对于子网掩码为255.255.255.0的网络，是以.255结尾的地址）是广播地址。传统上，ping该地址会使该网络上的每台机器都做出响应。虽然这对故障排除和维护很有用，但网络攻击者发现他们可以利用这一点创建最早的分布式拒绝服务（DDoS）攻击之一。如今，通常认为禁用路由器中继这些来自本地网络的定向广播ping的能力是明智之举。\n\
    \n```\nrouter(config-if)#no ip directed-broadcast\n```\n\n## 组播路由缓存\n\n默认情况下，现代思科IOS版本为组播网络启用路由缓存，这将提高组播路由操作的性能。然而，它们在默认配置中禁用了此缓存。（我确信它们不直接在默认情况下禁用是有充分理由的，真的。）这在你的配置中显示为`no\
    \ ip mroute-cache`。如果你正在使用组播路由，请删除此配置语句。\n\n```\nrouter(config-if)#ip mroute-cache\n\
    ```\n\n## 接口介质类型\n\n较旧的路由器（例如拍卖网站上常见的某些型号）同时具有AUI和10BaseT以太网端口。尽管看起来如此，这些路由器实际上只有一个以太网接口，只是有两个连接器。你可以使用AUI端口或10BaseT端口，但不能同时使用两者。使用`media-type`关键字以及`aui`或`10baseT`设置来选择所需的连接器。\n\
    \n```\nrouter(config-if)#media-type 10baseT\n```\n\n对于每个以太网接口只有一个物理插头的路由器，这是不必要的。你可以通过查看以太网端口轻松识别这些路由器。\n\
    \n## 串行接口\n\n串行网络只有两个节点，每端一个，并且只在这两点之间传输数据。这使得管理串行链路比以太网链路简单得多，但连接路由器到远程网络的线路具有更广泛得多的可设置选项。\n\
    \n虽然你可以通过将适当的电缆连接到两个路由器的串行端口之间来运行串行链路，但串行线路通常由电话公司提供，并在相距比以太网能承受的几百英尺远得多的两个不同位置之间运行。我们将重点介绍电信公司提供的T1电路，就像你在ISP连接或两个办公室之间会找到的那种。\n\
    \n以下是典型思科T1接口上`sho int`命令输出的开头部分。尽管串行接口名声吓人，但串行线路在许多方面比以太网接口简单得多，因为它的选项要少得多。\n\
    \n```\nSerial1/0 is up, line protocol is up\nHardware is DSCC4 with integrated\
    \ T1 CSU/DSU\n...\n```\n\n¹ 这个问题的答案通常是“我”。\n"
