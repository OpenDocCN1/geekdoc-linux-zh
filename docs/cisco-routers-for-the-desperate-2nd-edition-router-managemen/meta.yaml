    ## Getting an ASN


    The American Registry for Internet Numbers (ARIN) assigns Autonomous System Numbers
    in the Western Hemisphere. (If you are elsewhere in the world, you will have your
    own regional number administration.) The application process is very simple, if
    you have everything ready before applying. ARIN''s website at http://www.arin.net
    has documentation on the ASN request process and a blank template.


    Only organizations registered with ARIN can request an ASN. Registering an organization
    is free and gives your organization an ARIN organization ID, or *Org ID*. You
    use the Org ID as a point of contact for the ASN request form. You can get the
    request form from the ARIN website. As an organization brand new to ARIN, you
    *must* use the detailed Org ID request form. The request form is plain text; everything
    after a pound sign (#) is a comment, while every place there is a colon is a place
    you are expected to put an answer. Example answers appear below the question where
    appropriate. We''re not going to walk through the entire Org ID request form,
    because the questions it asks are very basic: names, addresses, phone numbers,
    and so on. Send the completed form to hostmaster@arin.net with a subject of "ORGANIZATION
    TEMPLATE."


    Within a few days, you should receive a notice that your organization has been
    registered and giving the details of your organization''s information. One important
    piece of information is your new org handle, which contains an alphanumeric code
    for your organization. Each contact you defined for your organization will also
    receive a handle. Note the handle codes, because you''ll need them to request
    your ASN. (If you forget your handles, you can use the Whois search engine on
    the ARIN website to search for your organization''s entry.)


    When you have an Org ID, you can fill out an ASN request template. Because some
    of the questions can be tricky, we''ll walk through the current version of the
    form.


    1. Multi-homed: **Yes**

    2. Exterior Gateway Protocol: **BGP**


    These first two questions are obviously designed to weed out the people who don''t
    need an ASN. If you''re not multihomed, or if you are multihomed but don''t need
    BGP, you don''t need an ASN.


    3. IP Networks: **192.168.0.0-192.168.1.255**


    List the address range(s) you will be announcing via BGP. These must be real,
    public addresses issued to you from one of your ISPs. If your addresses are not
    announceable via BGP (i.e., if you list IP addresses designated for internal use
    only), the request will be denied.


    4a. AS Number: **200**

    4b. AS Number: **300**


    Question 4 wants the ASNs of your ISPs, which your ISPs can easily provide. You
    must give two valid ASNs.


    5. Unique Routing Policy:


    It is theoretically possible to get an ASN without multihoming, but if you''re
    in that situation, you didn''t buy this book to learn how to do it. Leave this
    blank.


    6. Additional Information:


    I strongly recommend that you leave this blank. Answering questions 1 through
    4 properly is all you need to justify receiving an ASN.


    7. Org ID: **MWL-88**


    Enter the org handle your organization received from ARIN.


    8. Org Name: **The Michael W Lucas Foundation**


    This should exactly match the organization name you registered previously.


    9. AS Name: **MWLF**


    Create an alphanumeric handle for your ASN. This will appear in the ARIN database,
    and will be used to uniquely identify your AS. Use the Whois search at http://www.arin.net
    to ensure nobody already has that handle.


    You can specify additional contacts by ARIN handle in the remaining fields, but
    this is not necessary. Mail your form to hostmaster@arin.net, with a subject of
    "ASN REQUEST." Within three business days, ARIN will either approve or reject
    your request. If they approve it, you have 60 days to complete the Terms of Service
    agreement and pay the fee (currently $500). If you are rejected, it''s probably
    because you didn''t fill out your request correctly. Read the rejection messages
    carefully and try again.


