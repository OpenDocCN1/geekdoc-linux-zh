    \ 0000.0c07.ac01 (default)\n Hello time 3 sec, hold time 10 sec\n   Next hello\
    \ sent in 2.648 secs\n Authentication text \"PassWord\"\n Preemption enabled,\
    \ delay min 60 secs\n Active router is 192.168.0.3, priority 105 (expires in 7.020\
    \ sec)\n Standby router is local\n Priority 100 (configured 100)\n  Track interface\
    \ Serial0 state Up decrement 10\n IP redundancy name is \"hsrp-Fa0/0-1\" (default)\n\
    ```\n\nYou'll see an entry like this for every HSRP group you have configured\
    \ on your routers. While most people only have one HSRP group, you can have several.\n\
    \nWhat you probably care most about is the router's current status; is it in charge\
    \ or not? This router is in a state of Standby, meaning that it's not hosting\
    \ the standby IP. If this said Active, this router would be hosting the standby\
    \ IP.\n\nWhen debugging, it's nice to know how often the standby IP has moved\
    \ and when it last moved. Just in case you forgot, it also shows the standby IP\
    \ address and the authentication password."
