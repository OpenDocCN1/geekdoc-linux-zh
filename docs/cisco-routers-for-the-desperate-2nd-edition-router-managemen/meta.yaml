    \  Int\n   0  CTY➊          -    -     -    -    -     0    0     0/0      -\n\
    \ 129  AUX➋ 9600/9600 -    -     -    -    -     0    0     0/0      -\n*130 \
    \ VTY➌          -    -     -    -    -    18➍   0     0/0      -\n 131  VTY  \
    \         -    -     -    -    -     6    0     0/0      -\n 132  VTY        \
    \   -    -     -    -    -     3    0     0/0      -\n 133  VTY           -  \
    \  -     -    -    -     2    0     0/0      -\n 134  VTY➎          -    -   \
    \  -    -    -     0    0     0/0      -\n```\n\nHere, we see that this particular\
    \ router has a single ➊ console, a single ➋ aux port, and five virtual terminals\
    \ numbered ➌ 130 through ➎ 134. While most of the rest of the information is not\
    \ normally useful, sometimes it's nice to see ➍ how many times a particular terminal\
    \ has been accessed.\n\nWhile you can do all sorts of configuration on these ports,\
    \ the most important features are those related to passwords and access methods.\
    \ Let's look at a sample configuration and see what we can learn."
- md: " ```\nline con 0\n password 7 02310042864A2C295D43D1\nline aux 0\n password\
    \ 7 02310042864A2C295D43D1\nline vty 0 4\n login local\n transport input telnet\
    \ ssh\n```\n\nThe first entry is the ① console port. Like all real computer devices,\
    \ Cisco numbers ports beginning with zero. This console port has a ② password\
    \ on it; even if you hook up a serial cable and fire up HyperTerminal, you'll\
    \ have to enter a password. This may be necessary if your router is physically\
    \ insecure, such as in a shared colocation center. (It may also be necessary if\
    \ your company has staff that like to wander into places they aren't supposed\
    \ to.) If your router is correctly configured, the actual password is stored in\
    \ encrypted form.\n\nThe ③ aux port is also numbered 0 and has a password. While\
    \ the password for both the console and aux ports are encrypted, you can see that\
    \ they are identical.\n\nLast, we have the ④ virtual terminals. This system has\
    \ five configured virtual terminals, numbered ⑤ 0 through ⑥ 4. The ⑦ login local\
    \ keyword means that this router has a list of usernames and passwords stored\
    \ on the local machine, and that whenever a login request arrives over the network,\
    \ the router should use this list. The ⑧ transport line indicates what methods\
    \ can be used to access the virtual terminals; in this case, acceptable inputs\
    \ are telnet and SSH.\n\nUnconfigured virtual terminals cannot be used; if we\
    \ configured only virtual ports 0 and 1, the router would only support two simultaneous\
    \ remote login sessions. While this might not seem like a problem, at times it's\
    \ nice to have multiple router command prompts open simultaneously so that you\
    \ can, say, keep watching your BGP sessions in one window and make changes in\
    \ another. I've found myself at times with all four virtual terminals open on\
    \ my single desktop when I'm trying to debug a particularly annoying problem.\n\
    \nHow can you set all this up? Well, let's find out.\n\n## Passwords\n\nA password\
    \ is the simplest authentication method a Cisco router can use, but it's effective\
    \ enough for most networks. If you have dozens of routers, you may want to consider\
    \ a solution such as RADIUS or TACACS+, but that really is overkill for most environments.\
    \ By default, routers do not require passwords, but also by default, you cannot\
    \ access the router over the network, so in order to get a command prompt on the\
    \ router, you would need to have physical access. Cisco assumes that if you know\
    \ enough to enable network access, you will be able to set up basic passwords.\n\
    \nBefore implementing passwords on your router, make certain that the password\
    \ encryption service is activated. By default, routers store passwords in their\
    \ configuration in *unencrypted* format. This means that anyone who can view the\
    \ router's configuration can see the router's passwords! While it's true that\
    \ you already have to have privileged mode access to view a running router's configuration,\
    \ that doesn't protect backup copies of your configuration stored elsewhere. It\
    \ also makes it almost impossible for someone who happens to be looking over your\
    \ shoulder to *not* view the password, even if they want to be honest. To enable\
    \ the password encryption service, just add\n\n```\nservice password-encryption\n\
    ```\n\nto your configuration.\n\nNow that nobody can get your passwords trivially,\
    \ it's worth continuing. Standard Cisco devices offer three standard passwords:\
    \ the *front door*, *enable*, and *enable secret*. The front door password protects\
    \ unprivileged EXEC mode access to the router. This means that you can look but\
    \ not touch, as discussed earlier. Setting a front door password for a line is\
    \ very simple. Here, we're setting a front door password on our aux port.\n\n\
    ```\nrouter# conf t①\nrouter(config)# line aux 0②\nrouter(config-line)# login③\n\
    router(config-line)# password YourPassword④\nrouter(config-line)# ^Z\n```\n\n\
    Start by ① entering configure mode, and then tell the router that you want to\
    \ ② configure the line aux 0. Remember, your router configuration will tell you\
    \ exactly what the line is called; if nothing else, you'll see a single line near\
    \ the end of the configuration that says only line aux 0. You need to tell the\
    \ router to ③ use password checking on this port with the login option. Finally,\
    \ enter the command password and ④ your chosen password. Unlike more modern operating\
    \ systems that provide you with shaded dialog boxes that hide your password as\
    \ you change it, your password will actually appear on the command line here.\
    \ Be certain that nobody's looking over your shoulder when you set or change the\
    \ password!\n\nAfter you've set a password, you'll see an entry for it in the\
    \ router configuration.\n\n```\nline aux 0\n password 7 053c02162c006d01080856\n\
    \ login\n```\n\nThis looks an awful lot like what you typed, but the password\
    \ has been hashed. Another thing to note is the 7 between the word password and\
    \ the password string. The 7 tells the router that the password has been hashed,\
    \ and that the string 053c02162c006d01080856 isn't the actual password.\n\nOne\
    \ thing to remember is that these front door passwords are configured on a line-by-line\
    \ basis. You can have one password for your console port, another for the aux\
    \ port, and yet another for your virtual terminals. Setting different passwords\
    \ on different ports is a wonderful way to confuse yourself.\n\nThe enable password\
    \ protects access to privileged EXEC mode. The old method of Cisco access control\
    \ was to give lower-level support techs the front door password but restrict the\
    \ enable mode to higher-level techs. Unfortunately, Cisco created its own encryption\
    \ algorithm to keep the password secure. This algorithm is badly flawed. You should\
    \ not have an enable password on your Cisco devices, because anyone who gets your\
    \ configuration can trivially reverse engineer the enable password from the scrambled\
    \ hash. To fix this, Cisco introduced a second privileged EXEC protection, the\
    \ enable secret, and protected it with the cryptographically sound MD5 hash. Setting\
    \ an enable secret, and disabling the enable password, is much like setting a\
    \ front door password. Unlike the front door passwords, which can be different\
    \ for each line, the enable passwords work globally.\n\n```\nrouter# conf t\n\
    router(config)# enable secret YourSecretPassword\nrouter(config)# no enable password\n\
    ```\n\n> This happens more frequently than you might think. Whenever a vendor\
    \ says that it has invented its own proprietary, highly secure encryption techniques,\
    \ run. Run quickly. While the security of \"open code\" versus \"closed code\"\
    \ may be debatable, the security of \"open crypto\" versus \"closed crypto\" most\
    \ certainly is not.\n\nWhen you're in standard configure mode, the command enable\
    \ secret and a password string will set the enable secret. You don't want any\
    \ sort of easily retrievable password on any system, so be sure to disable the\
    \ old-fashioned enable password.\n\nThese passwords will provide some basic protection\
    \ to your system. You can also change passwords at any time with exactly the same\
    \ commands you used to set them in the first place.\n\n## Usernames\n\nWhile global\
    \ passwords are sufficient to protect your router from the most ignorant network\
    \ intruders, you will probably want to secure the remote command-line access to\
    \ the router. Cisco provides secure shell (SSH) server for secure remote administration.\
    \ SSH requires that each user have a username. In large networks, you can use\
    \ usernames to assign different users different privilege levels on each router\
    \ as required.\n\nEach user needs a username, a password, and a privilege level.\
    \ Privilege levels range from 1 (unprivileged EXEC) to 15 (privileged EXEC). To\
    \ create a username, just go into configure mode and enter all the information.\n\
    \n```\nrouter(config)# username mwlucas privilege 15 password mwlucas-password\n\
    router(config)# username kgball privilege 1 password kgball-password\n```\n\n\
    The first username we're creating is mwlucas. This user has a privilege level\
    \ of 15, meaning that he is in enable mode when he logs in. While you give this\
    \ user's password on the command line when you're creating him, it will be hashed\
    \ and appear scrambled when you view the configuration later.\n\nThe second username\
    \ we're creating is kgball. The only different thing about him is that he is at\
    \ privilege level 1. He can look at everything but cannot make any changes, exactly\
    \ as if he only had the front door password.\n\nWhile you can assign particular\
    \ privilege levels to different commands, and then assign each user a privilege\
    \ level commensurate with their duties and abilities, in most small networks two\
    \ privilege levels are quite sufficient.\n\n## Making Lines Check Usernames\n\n\
    After you have assigned usernames and passwords, you need to tell the router's\
    \ lines to use them. Adding the login local line to a line will tell the router\
    \ to check incoming connection"
  mdcn: "\n ```\nline con 0\n password 7 02310042864A2C295D43D1\nline aux 0\n password\
    \ 7 02310042864A2C295D43D1\nline vty 0 4\n login local\n transport input telnet\
    \ ssh\n```\n\n```\n\n第一条目是 ① 控制台端口（console port）。像所有真实的计算机设备一样，思科的端口编号从零开始。这个控制台端口设置了\
    \ ② 密码；即使你连接了串口线并启动 HyperTerminal，你也必须输入密码。如果你的路由器在物理环境上不安全（例如在共享的托管中心），这可能是必要的。（如果你的公司有员工喜欢在不该去的地方闲逛，这也可能是必要的。）如果你的路由器配置正确，实际密码将以加密形式存储。\n\
    \n③ 辅助端口（aux port）的编号同样是 0，并且也有一个密码。虽然控制台端口和辅助端口的密码都被加密了，但你可以发现它们是相同的。\n\n最后，我们有\
    \ ④ 虚拟终端（virtual terminals）。该系统配置了五个虚拟终端，编号为 ⑤ 0 到 ⑥ 4。⑦ `login local` 关键字意味着该路由器在本地机器上存储了一份用户名和密码列表，每当网络上有登录请求到达时，路由器应使用此列表。⑧\
    \ `transport` 行指明了可以使用哪些方法访问虚拟终端；在本例中，可接受的输入是 telnet 和 SSH。\n\n未配置的虚拟终端无法使用；如果我们仅配置了虚拟端口\
    \ 0 和 1，则路由器将仅支持两个并发远程登录会话。虽然这看起来可能不是个问题，但有时同时打开多个路由器命令提示符会很方便，这样你就可以，比如，在一个窗口中持续观察\
    \ BGP 会话，而在另一个窗口中进行更改。我发现在尝试调试一个特别棘手的问题时，有时会在单个桌面上打开全部四个虚拟终端。\n\n如何设置这一切？那么，让我们来了解一下。\n\
    \n## 密码\n\n密码是思科路由器可以使用的最简单的身份验证方法，但对于大多数网络来说已经足够有效。如果你拥有数十台路由器，你可能需要考虑像 RADIUS\
    \ 或 TACACS+ 这样的解决方案，但对于大多数环境来说那确实是大材小用了。默认情况下，路由器不需要密码，但默认情况下你也无法通过网络访问路由器，因此为了在路由器上获得命令提示符，你需要拥有物理访问权限。思科假设如果你具备启用网络访问的足够知识，那么你一定能够设置基础密码。\n\
    \n在路由器上实现密码之前，请确保已激活密码加密服务。默认情况下，路由器在配置中以 *明文*（unencrypted）格式存储密码。这意味着任何能够查看路由器配置的人都能看到路由器的密码！虽然确实需要拥有特权模式访问权限才能查看运行中路由器的配置，但这无法保护存储在其他地方的配置备份副本。这也使得即便有人想保持诚实，但当他们恰好在你的肩后窥视时，几乎不可能\
    \ *不* 看到密码。要启用密码加密服务，只需在配置中添加：\n\n```\nservice password-encryption\n```\n\n现在没人能轻易获取你的密码了，值得继续进行。标准的思科设备提供三种标准密码：*前门密码*（front\
    \ door）、*enable 密码* 和 *enable secret 密码*。前门密码保护对路由器的非特权 EXEC 模式访问。这意味着正如之前讨论的，你可以查看但不能触碰。为线路设置前门密码非常简单。这里，我们正在为\
    \ aux 端口设置前门密码。\n\n```\nrouter# conf t①\nrouter(config)# line aux 0②\nrouter(config-line)#\
    \ login③\nrouter(config-line)# password YourPassword④\nrouter(config-line)# ^Z\n\
    ```\n\n首先 ① 进入配置模式，然后告诉路由器你想要 ② 配置 `line aux 0`。记住，你的路由器配置会明确告诉你该线路的名称；即便没有其他信息，你也会在配置末尾看到一行仅写着\
    \ `line aux 0`。你需要告诉路由器 ③ 使用 `login` 选项在此端口上进行密码检查。最后，输入 `password` 命令和 ④ 你选择的密码。与现代操作系统提供隐藏密码的遮蔽对话框不同，你的密码在这里会直接显示在命令行上。在设置或更改密码时，务必确保没人从你肩后窥视！\n\
    \n设置密码后，你会在路由器配置中看到相应的条目。\n\n```\nline aux 0\n password 7 053c02162c006d01080856\n\
    \ login\n```\n\n这看起来与你输入的内容非常相似，但密码已经被哈希化（hashed）了。另一件需要注意的事情是 `password` 单词和密码字符串之间的数字\
    \ `7`。`7` 告诉路由器该密码已被哈希处理，而字符串 `053c02162c006d01080856` 并不是实际的密码。\n\n需要记住的一点是，这些前门密码是基于每一条线路单独配置的。你可以为控制台端口设置一个密码，为\
    \ aux 端口设置另一个，为虚拟终端设置又一个。在不同端口设置不同密码是让自己感到困惑的一种绝佳方式。\n\n`enable` 密码保护对特权 EXEC\
    \ 模式的访问。思科早期的访问控制方法是将前门密码交给低级支持技术人员，而将 enable 模式限制在高级技术人员手中。不幸的是，思科创建了自己的加密算法来保证密码安全，但该算法缺陷严重。你不应该在思科设备上使用\
    \ `enable password`，因为任何获得你配置的人都可以轻松地通过乱码哈希值反向推导出 enable 密码。为了修复这个问题，思科引入了第二种特权\
    \ EXEC 保护方式——`enable secret`，并使用加密强度更高的 MD5 哈希对其进行保护。设置 `enable secret` 并禁用 `enable\
    \ password` 与设置前门密码非常相似。与每条线路可以不同的前门密码不同，enable 密码是全局生效的。\n\n```\nrouter# conf\
    \ t\nrouter(config)# enable secret YourSecretPassword\nrouter(config)# no enable\
    \ password\n```\n\n>这种情况发生的频率比你想象的要高。每当某个供应商声称它发明了自己的私有、高度安全的加密技术时，快跑。赶紧跑。虽然“开源代码”与“闭源代码”的安全性可能有争议，但“开源加密”与“闭源加密”的安全性绝对没有争议。\n\
    \n当你处于标准配置模式时，使用 `enable secret` 命令加上一个密码字符串即可设置 enable secret。你不希望任何系统中存在任何容易被检索到的密码，因此请务必禁用过时的\
    \ `enable password`。\n\n这些密码将为你的系统提供一些基础保护。你随时可以使用与最初设置时完全相同的命令来更改密码。\n\n## 用户名\n\
    \n虽然全局密码足以保护你的路由器免受最无知的网络入侵者侵害，但你可能希望加强对路由器远程命令行访问的安全性。思科提供了安全外壳 (SSH) 服务器用于安全的远程管理。SSH\
    \ 要求每个用户必须有一个用户名。在大型网络中，你可以根据需要使用用户名为每个路由器上的不同用户分配不同的特权级别。\n\n每个用户需要一个用户名、一个密码和一个特权级别。特权级别范围从\
    \ 1（非特权 EXEC）到 15（特权 EXEC）。要创建用户名，只需进入配置模式并输入所有信息。\n\n```\nrouter(config)# username\
    \ mwlucas privilege 15 password mwlucas-password\nrouter(config)# username kgball\
    \ privilege 1 password kgball-password\n```\n\n我们创建的第一个用户名是 `mwlucas`。该用户的特权级别为\
    \ 15，这意味着他登录时就处于 enable 模式。虽然你在创建他时在命令行输入了密码，但当你稍后查看配置时，它会被哈希处理并显示为乱码。\n\n我们创建的第二个用户名是\
    \ `kgball`。他唯一不同之处在于特权级别为 1。他可以查看所有内容但不能做出任何更改，就像他只拥有前门密码一样。\n\n虽然你可以为特定命令分配特定的特权级别，然后为每个用户分配与其职责和能力相称的特权级别，但在大多数小型网络中，两个特权级别就足够了。\n\
    \n## 使线路检查用户名\n\n在分配了用户名和密码之后，你需要告诉路由器的线路使用它们。在路线上添加 `login local` 将告诉路由器检查传入连接\n"
