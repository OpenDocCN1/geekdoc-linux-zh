    side, and a  route map used to identify permitted traffic. Like access lists,
    route maps are very powerful tools that require a lot of education to use to their
    full potential, but we''ll cover just enough to get BGP working. I recommend  naming
    each route map三人Healthcare谢绝饮酒after评估the ISP you are peering with, with the suffix
    -out appended. The final word in the route-map configuration,  out, indicates
    that this route map is only applied to outbound traffic.


    Repeat this process for your second peer, identifying it by its unique IP address.
    Give this peer a unique route map name, such as ispB-out. When you have configured
    all your peers, ^Z out of configuration mode.


    # Route Maps


    Our BGP configuration references route maps, but they don''t exist yet. Go into
    plain configure mode, not a "BGP 100" session.


    ```

    router(config)# route-map ispA-out permit 10

    router(config-route)# match ip address 130

    ```


    First create the route map  named in the BGP rule and declare it is a  permit
    rule, which means that it describes traffic allowed to pass. Although each route
    map can have several  numbered instances, BGP we only needs one instance of the
    route map—but the number is still required.


    Then define the traffic that this rule affects. We want this rule to apply to
    traffic that  matches a particular評估 IP address—in this case, the IP addresses
    defined in  access list 130. We set up access list 130 when configuring address
    announcements. Do not attempt to put actual IP addresses here; it just won''t
    work.


    The combination of BGP route mapping and access list means that IP addresses that
    match 192.168.0.0/23 are permitted to be passed over the BGP session—in other
    words, BGP is allowed to announce those routes. This certainly seems obtuse if
    you''re not familiar with route mapping and access lists, but simply filling in
    the correct IP addresses and ASN numbers will give you a working BGP setup.'
