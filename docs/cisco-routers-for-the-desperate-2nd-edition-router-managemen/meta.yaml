    \n## 管理 BGP\n\n使用 `show ip bgp` 命令查看 BGP 活动。简单的 `show ip bgp` 将显示你的路由器通过 BGP 知道的所有路由，这会产生数十万行输出。大多数人认为这没什么用处。各种子命令将其分解为易于阅读的块，其中最常用的是\
