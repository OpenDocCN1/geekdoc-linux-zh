  - '[PAGE 106]


    BGP setup, wait at least 20 minutes to see what the real effects are before making
    another change. This will also help reduce the risk of being marked as a flapping
    BGP source and black-holing yourself off the Internet.


    If you want to see how your BGP announcements are being viewed by the outside
    world, search the Internet for a "BGP Looking Glass." These are web pages that
    allow you to query routers for BGP information. By asking remote routers for BGP
    information on your block of IP addresses, you can see what announcements they
    are seeing and how other people view your network. If you are having a problem
    with BGP configuration, you can use several looking glasses to determine who can
    see your routes and who cannot, and thereby identify the scope of the problem.
    This information can also help you to identify problems such as one of your peers
    not propagating your announcements beyond their network or altering your announcements
    in some way.


    # Hot Standby Router Protocol


    After you have BGP up and running, the next obvious question is, "What do we do
    if the router itself fails?" While Cisco routers are generally reliable, even
    the best hardware sometimes lets the magic smoke escape and transforms into a
    shiny metal paperweight. Cisco supports the Hot Standby Router Protocol (HSRP)
    to provide live failover between routers in this eventuality. You can build a
    "pool" of independent Cisco devices that will take over some functions of a failed
    router; not all of the functions are covered, but enough are so that your users
    will not notice.


    # What Is HSRP?


    HSRP lets multiple routers provide a single IP address. This is most useful for
    your default gateway on your Ethernet. All your computers know about the routers
    is that one of them had better have the default gateway of (for example) 192.168.0.1;
    they don''t care which router has it, just that it''s available. HSRP allows the
    routers to keep track of each other; when the router that has the default gateway
    disappears from the network, another router can automatically respond to requests
    for the default gateway''s IP address. In this case, each router has its own unique
    IP address on its Ethernet interface, but might also have the default gateway
    as shown in Figure 7-2.'
  - '[PAGE 107]


    ![](img/b76c804cf499c7eeda3929279b928b62_107_0.png)


    Router A has an ① Ethernet interface on the office network. This interface has
    the primary IP address of 192.168.0.2, but it can also host the IP address 192.168.0.1—the
    default gateway for your computers. If you want to log in to Router A, SSH to
    the address 192.168.0.2. Similarly, Router B also has an ② Ethernet interface
    on the office network and a unique IP address of 192.168.0.3, but it can also
    host the default gateway of 192.168.0.1. The routers settle between themselves
    which is the "default" default router, but when that router fails, the other will
    take over. In Cisco terminology, the IP address 192.168.0.1 is the *standby* address.
    (Other implementations commonly call this a Virtual IP, or VIP.)


    Very basic configuration of this Ethernet interface is only a couple of lines.


    ```

    router(config)# int faste0/0

    router(config-if)# ip address 192.168.0.2 255.255.255.0

    router(config-if)# ①standby ②1 ip 192.168.0.1

    ```


    Apply the ① standby entry to both router configurations, and abruptly you''ll
    be able to ping 192.168.0.1. Keep pinging that IP while you reboot routers, and
    you won''t even see a single dropped packet—unless, of course, you turn both routers
    off at once!


    A single router interface can support multiple HSRP standby IP addresses. Each
    has to be identified as a ② group. Use the group identifier in every configuration
    involving that particular standby IP.'
  - '[PAGE 108]


    # Tuning HSRP


    While the above will handle most of the work of live failover for most circumstances,
    you''ll find that HSRP requires some fine-tuning to be truly transparent. The
    most commonly tweaked features are `preemption`, `interface tracking`, `delay`,
    and `authentication`.


    # Preemption


    Preemption is where a particular interface declares itself to be in charge of
    the standby IP address and forces all others to relinquish their claims to that
    address. This means that a particular router defaults to supporting the HSRP,
    letting all others only be backups. This is handled by assigning a priority to
    each interface that supports the standby IP, and letting the router with the highest
    priority claim it. By default, every router in a standby group has a priority
    of 100. To set a priority, use the keyword priority in the configuration.


    ```

    router(config)# int fast0/0

    router(config-if)# standby 1 preempt

    router(config-if)# standby 1 priority 105

    ```


    Start by allowing this router to demand to host the standby IP from lower-priority
    routers. If you use preemption, all routers in a standby group should have this
    entry. Then set this particular router to have a priority of 105.


    # Interface Tracking


    It can be convenient to assign a single router to be the master of the standby
    group, if only so you know which router is in charge. (Network administrators,
    as a class, are not comfortable saying that “traffic goes into a cloud near our
    routers and magic things happen.” They prefer statements such as, “Traffic will
    unequivocally go to Router A as long as A is running.”) At times, your chosen
    router might not be a sensible choice. Look at Figure 7-2 again. Each of our routers
    has a single line to the Internet. If a router''s Internet circuit goes down,
    it no longer makes sense for that router to be the standby master; traffic would
    go through an extra hop for no good reason. We can cause a router''s HSRP priority
    to drop by using interface tracking. When your interface being tracked goes down,
    the HSRP priority automatically decreases.


    ```

    router(config)# int fast0/0

    router(config-if)# standby 1 track Serial0

    ```'
- md: "The standby IP number 1 is monitoring the interface Serial0. When Serial0 goes\
    \ down, it will automatically decrease its priority by 10. If this router's priority\
    \ has been set to 105, it will become 95. Because the other router has the default\
    \ priority of 100, it suddenly has higher priority and takes over as the standby\
    \ IP.\n\n## HSRP Delay\n\nWhen a router first boots, it takes a few seconds for\
    \ it to get its bearings and start routing traffic. If the router uses BGP, those\
    \ few seconds can be as long as a minute or two. HSRP, on the other hand, works\
    \ quickly. If your preferred router takes over the standby IP address before it\
    \ has a chance to sort out its BGP routing tables, traffic will stop flowing until\
    \ the router is comfortable. To let your router get its feet properly under the\
    \ table, you can assign a delay to HSRP failover.\n\nTime how long it takes for\
    \ your router to reassemble all of its BGP sessions and for the CPU to drop to\
    \ only normally busy after you type `clear ip bgp *`. Round it up 10 or 15 seconds,\
    \ just to allow time for the unexpected. That's how long your standby IP should\
    \ wait before failing over.\n\n```\nrouter(config)# int faste0/0\nrouter(config-if)#\
    \ standby 1 preempt delay minimum 60\n```\n\nThis router will wait a minimum of\
    \ 60 seconds before taking over the standby IP address.\n\n## Authentication\n\
    \nIt's quite unlikely that an intruder would break into your HSRP cluster. This\
    \ would require a fair amount of talent and knowledge. If they managed to do so,\
    \ however, the effects could be devastating. Imagine if an intruder funneled all\
    \ network traffic through a packet analyzer illegally installed on one of your\
    \ machines; they could capture usernames, passwords, credit card numbers, customer\
    \ details, and so on. For that reason, using some basic authentication on your\
    \ HSRP standby group is a good idea. HSRP uses a simple password for authentication.\
    \ Any router that knows the password is permitted to participate in the HSRP group.\n\
    \n```\nrouter(config)# int faste0/0\nrouter(config-if)# standby 1 authentication\
    \ Password\n```\n\nHere, we set standby group 1 to use a password of Password.\
    \ It might not be the strongest authentication mechanism in the world, but it's\
    \ far better than nothing. Given these features, you should be able to tune HSRP\
    \ to do almost anything you like. There's one more complication with router redundancy,\
    \ however: routing.\n\n## BGP and HSRP\n\nTake another look at Figure 7-2. We\
    \ have Router A connected to ISP #1, and Router B connected to ISP #2. Both Router\
    \ A and Router B are announcing their network addresses to their ISPs. Systems\
    \ in the outside world will send their traffic to your network via their closest\
    \ route. But with HSRP set up as we've discussed, your network will only use one\
    \ outbound circuit at a time! Think about it; Router A only knows of routes it\
    \ receives from ISP #1, so that's where it sends everything. If Router A is holding\
    \ the default route, even traffic meant for ISP #2 will go out via ISP #1. This\
    \ is inefficient, and it places a very real limitation on your bandwidth use.\
    \ To actually use both ISPs for outbound traffic, you need to speak BGP between\
    \ your routers.\n\nIn Figure 7-2, we show a pair of separate Ethernet interfaces\
    \ for a connection between the two routers. Router A has the IP address of 192.168.1.1,\
    \ while Router B has 192.168.1.2. Nothing else is on this network; I just use\
    \ a crossover cable between the two routers.\n\n> **NOTE** *Nugget of Wisdom*\n\
    >\n> *Yes, you can speak BGP over the shared network where the rest of your traffic\
    \ is passed around. This increases the amount of traffic on your main network,\
    \ however, and slows down outbound traffic. A packet bound for ISP #2 will reach\
    \ Router A and immediately be turned around and sent back across the same network\
    \ it came from to Router B, dramatically increasing potential collisions on your\
    \ local network. I've seen any number of weird problems from this, but feel free\
    \ to try it if your routers have only one Ethernet interface.*\n\nBGP calculates\
    \ its preferred routes by counting the number of AS hops to the destination IP\
    \ address. One thing you don't want to have happen is for BGP to count the other\
    \ router in your network as a penalty—presumably, bandwidth on your crossover\
    \ cable is pretty much unlimited. (If it's not, you need a better crossover cable,\
    \ a better router, or *serious help!*) You don't need to apply any sort of access\
    \ list to the BGP session between your two routers, because you already do that\
    \ on your peers. If your AS is number 100, the BGP session between the two would\
    \ look like this:\n\n```\nrouter(config)# router bgp 100\nrouter(config-router)#\
    \ neighbor 192.168.1.1 neighbor-as 100\nrouter(config-router)# neighbor 192.168.1.1\
    \ next-hop-self\n```\n\nSave your work, and suddenly your two routers will be\
    \ speaking internal BGP and your internal traffic will be taking the best available\
    \ route out of your network.\n\n## Testing HSRP\n\nThe easy way to test live failover\
    \ is to unplug a router during the day and see who complains. I agree that this\
    \ is the true test of failover, but it is best performed after hours with your\
    \ network's monitoring system running at full tilt. You can check your router's\
    \ HSRP behavior by using the `show standby` command.\n\n```\nrouter# show standby\n\
    FastEthernet0/0 - Group 1\n State is Standby\n  1 state change, last state change\
    \ 1w2d\n Virtual IP address is 192.168.0.1\n Active virtual MAC address is 0000.0c07.ac01\n\
    \ Local virtual MAC address is 0000.0c07.ac01 (default)\n Hello time 3 sec, hold\
    \ time 10 sec\n   Next hello sent in 2.648 secs\n Authentication text \"PassWord\"\
    \n Preemption enabled, delay min 60 secs\n Active router is 192.168.0.3, priority\
    \ 105 (expires in 7.020 sec)\n Standby router is local\n Priority 100 (configured\
    \ 100)\n  Track interface Serial0 state Up decrement 10\n IP redundancy name is\
    \ \"hsrp-Fa0/0-1\" (default)\n```\n\nYou'll see an entry like this for every HSRP\
    \ group you have configured on your routers. While most people only have one HSRP\
    \ group, you can have several.\n\nWhat you probably care most about is the router's\
    \ current status; is it in charge or not? This router is in a state of Standby,\
    \ meaning that it's not hosting the standby IP. If this said Active, this router\
    \ would be hosting the standby IP.\n\nWhen debugging, it's nice to know how often\
    \ the standby IP has moved and when it last moved. Just in case you forgot, it\
    \ also shows the standby IP address and the authentication password.\n\nWe then\
    \ proceed to the preemption information; this router has preemption on, and will\
    \ wait at least 60 seconds before preempting another router. You'll also see which\
    \ router is currently the active router; while this is obvious in a group of two\
    \ routers, it can be very helpful if you have a few routers in the standby group.\n\
    \nFinally, you can see the router's current priority and the state of interfaces\
    \ being tracked.\n\nWhen you have BGP and HSRP, you're about as redundant as you\
    \ can get. The only things that can take your network out now are telco outages,\
    \ power outages, and large-scale meteor strikes. (OK, fine; small but well-targeted\
    \ meteor strikes would also suffice.) Those can all be dealt with, but they're\
    \ a topic for other books.\n\n# Chapter 8: Logins, Authentication, and Remote\
    \ Access\n\nRestricting access to your router's configuration and controls is\
    \ an important part of network management. While it's important to get the router\
    \ up and running, you don't want just anyone to be able to access your equipment\
    \ and reconfigure it! It's important to understand how your router can be accessed,\
    \ how to set passwords and create individual usernames, and how to offer and control\
    \ access over the network via telnet or SSH.\n\n## Lines\n\nNear the end of your\
    \ router's configuration, you'll see entries like `line vty 0 4` and `line con\
    \ 0`. These lines are the available methods of getting a command line prompt on\
    \ your router, and each can be configured separately. A standard Cisco device\
    \ has three types of line: con, aux, and vty.\n\nThe *con* (or console) port is\
    \ what we've been using to connect to the system. While it's entirely possible\
    \ to reconfigure this port, it's generally a bad idea. You can set the console\
    \ to require a password to log in, for example, or you might have it run at a\
    \ higher speed for better interactive response. If you need a physical console\
    \ port with nonstandard behavior, use the *aux* (or auxiliary) port. That's what\
    \ it's there for.\n\nThe *vty* lines, or virtual terminals, are logical lines\
    \ used for access over the network. Telnet and SSH connections into the router\
    \ are directed to a virtual terminal. These lines have no physical hardware; they\
    \ are strictly a software interface. (That's why they're called \"virtual.\")\
    \ These lines may cause the most concern and require the most attention; while\
    \ a locked door can control access to the con and aux ports, the whole point of\
    \ remote network access is that you can access your router from anywhere.\n\n\
    Each router supports a different number of lines. The easy way to identify the\
    \ lines is with the `show line` command.\n\n```\nrouter# show line\n Tty  Typ\
    \  Tx/Rx    A  Modem  Roty  AccO  AccI  Uses  Noise  Overruns  Int\n   0  CTY\
    \          -    -     -    -    -     0    0     0/0      -\n 129  AUX  9600/9600\
    \ -    -     -    -    -     0    0     0/0      -\n*130  VTY          -    -\
    \     -    -    -     18   0     0/0      -\n 131  VTY           -    -     -\
    \    -    -     6    0     0/0      -\n 132  VTY           -    -     -    - \
    \   -     3    0     0/0      -\n 133  VTY           -    -     -    -    -  \
    \   2    0     0/0      -\n 134  VTY           -    -     -    -    -     0  \
    \  0     0/0      -\n```\n\nHere, we see that this particular router has a single\
    \ console, a single aux port, and five virtual terminals numbered 130 through\
    \ 134. While most of the rest of the information is not normally useful, sometimes\
    \ it's nice to see how many times a particular terminal has been accessed.\n\n\
    While you can do all sorts of configuration on these ports, the most important\
    \ features are those related to passwords and access methods. Let's look at a\
    \ sample configuration and see what we can learn."
  mdcn: "\n待机IP编号1正在监控Serial0接口。当Serial0故障时，它会自动将优先级降低10。如果该路由器的优先级已设置为105，那么它将变为95。因为另一台路由器的默认优先级为100，所以它的优先级突然变得更高，并接管待机IP。\n\
    \n## HSRP 延迟\n\n当路由器首次启动时，它需要几秒钟时间来稳定并开始转发流量。如果路由器使用BGP，那几秒钟可能长达一两分钟。而HSRP则工作得很快。如果你的首选路由器在有机会理清BGP路由表之前就接管了待机IP地址，那么流量将会中断，直到路由器准备就绪。为了让你的路由器站稳脚跟，你可以为HSRP故障切换分配一个延迟。\n\
    \n在你输入`clear ip bgp *`后，计时你的路由器重新组装所有BGP会话需要多长时间，以及CPU何时下降到正常忙碌状态。向上取整10或15秒，以留出应对意外情况的时间。这就是你的待机IP在故障切换前应等待的时间。\n\
    \n```\nrouter(config)# int faste0/0\nrouter(config-if)# standby 1 preempt delay\
    \ minimum 60\n```\n\n这台路由器将至少等待60秒才会接管待机IP地址。\n\n## 认证\n\n入侵者闯入你的HSRP集群的可能性相当小。这需要相当多的技术和知识。然而，如果他们成功做到了，后果可能是毁灭性的。想象一下，如果入侵者将所有网络流量通过非法安装在你方某台机器上的数据包分析器进行\
    \ funnel；他们可以捕获用户名、密码、信用卡号码、客户详细信息等等。因此，在你的HSRP备用组上使用一些基本认证是个好主意。HSRP使用简单的密码进行认证。任何知道密码的路由器都被允许参与HSRP组。\n\
    \n```\nrouter(config)# int faste0/0\nrouter(config-if)# standby 1 authentication\
    \ Password\n```\n\n在这里，我们将备用组1设置为使用密码Password。这可能不是世界上最强的认证机制，但总比没有好。鉴于这些功能，你应该能够将HSRP调整到几乎满足你的任何需求。然而，路由器冗余还有一个复杂之处：路由。\n\
    \n## BGP 与 HSRP\n\n再看一下图7-2。我们有路由器A连接到ISP #1，路由器B连接到ISP #2。路由器A和路由器B都在向各自的ISP通告它们的网络地址。外部世界的系统会通过最近的路线将流量发送到您的网络。但按照我们讨论的HSRP设置，您的网络一次只能使用一条出向电路！想想看；路由器A只知道从ISP\
    \ #1收到的路由，所以它将所有流量都发送到那里。如果路由器A持有默认路由，即使目标是ISP #2的流量也会通过ISP #1送出。这是低效的，并且对你的带宽使用构成了非常现实的限制。要真正将两条ISP都用于出向流量，你需要在你的路由器之间运行BGP。\n\
    \n在图7-2中，我们展示了一对独立的以太网接口，用于两台路由器之间的连接。路由器A的IP地址为192.168.1.1，而路由器B为192.168.1.2。这个网络上没有其他设备；我只是在两台路由器之间使用了一根交叉线。\n\
    \n> **注意** *智慧小贴士*\n>\n> *是的，你可以在承载其余流量的共享网络上传输BGP。然而，这会增加主网络上的流量，并减慢出向速度。目标为ISP\
    \ #2的数据包到达路由器A后，会立即被 turnaround 并通过它来的同一网络发送回路由器B，这会大大增加本地网络上的潜在冲突。我见过由此引起的各种奇怪问题，但如果你的路由器只有一个以太网接口，不妨尝试一下。*\n\
    \nBGP通过计算到达目标IP地址的AS跳数来确定其首选路由。有一件事你不希望发生，就是让BGP将你网络中的另一台路由器计为惩罚——假设你的交叉线上的带宽几乎是无限的。（如果不是，你需要一根更好的交叉线、更好的路由器，或者*紧急求助！*）你不需要对两台路由器之间的BGP会话应用任何访问列表，因为你已经在对等体上这样做了。如果你的AS号是100，两台路由器之间的BGP会话看起来会像这样：\n\
    \n```\nrouter(config)# router bgp 100\nrouter(config-router)# neighbor 192.168.1.1\
    \ neighbor-as 100\nrouter(config-router)# neighbor 192.168.1.1 next-hop-self\n\
    ```\n\n保存你的工作，你的两台路由器突然就会开始运行内部BGP，你的内部流量将通过网络的最佳可用路径出网。\n\n## 测试 HSRP\n\n测试实时故障切换的简单方法是在白天拔掉一台路由器，看看谁会抱怨。我同意这是故障切换的真正考验，但最好是在下班后，在你的网络监控系统全速运行的情况下进行。你可以使用`show\
    \ standby`命令检查路由器的HSRP行为。\n\n```\nrouter# show standby\nFastEthernet0/0 - Group\
    \ 1\n State is Standby\n  1 state change, last state change 1w2d\n Virtual IP\
    \ address is 192.168.0.1\n Active virtual MAC address is 0000.0c07.ac01\n Local\
    \ virtual MAC address is 0000.0c07.ac01 (default)\n Hello time 3 sec, hold time\
    \ 10 sec\n   Next hello sent in 2.648 secs\n Authentication text \"PassWord\"\n\
    \ Preemption enabled, delay min 60 secs\n Active router is 192.168.0.3, priority\
    \ 105 (expires in 7.020 sec)\n Standby router is local\n Priority 100 (configured\
    \ 100)\n  Track interface Serial0 state Up decrement 10\n IP redundancy name is\
    \ \"hsrp-Fa0/0-1\" (default)\n```\n\n你会看到类似这样的条目，对应于你在路由器上配置的每个HSRP组。虽然大多数人只有一个HSRP组，但你可以拥有多个。\n\
    \n你可能最关心的是路由器当前的状态；它是主用还是备用？这台路由器处于Standby状态，意味着它没有承载待机IP。如果这里显示Active，则这台路由器正在承载待机IP。\n\
    \n调试时，了解待机IP移动了多少次以及上次移动的时间是很有用的。万一你忘了，它还会显示待机IP地址和认证密码。\n\n接着是抢占信息；这台路由器已开启抢占，并且会至少等待60秒才会抢占另一台路由器。你还会看到当前哪台路由器是活动路由器；虽然在两台路由器的组中这很明显，但如果你有多个路由器在备用组中，这会非常有帮助。\n\
    \n最后，你可以看到路由器的当前优先级以及被跟踪接口的状态。\n\n当你同时拥有BGP和HSRP时，你的冗余性几乎达到了极致。现在唯一能导致你的网络中断的是电信故障、电力中断和大规模陨石撞击。（好吧，小型但精准瞄准的陨石撞击也足够了。）这些都可以应对，但那是其他书籍的话题了。\n\
    \n# 第8章：登录、认证与远程访问\n\n限制对路由器配置和控制的访问是网络管理的重要部分。虽然让路由器启动并运行很重要，但你不会希望任何人都能访问你的设备并重新配置它！了解如何访问你的路由器、如何设置密码和创建单独的用户名，以及如何通过telnet或SSH在网络上提供和控制访问是很重要的。\n\
    \n## 线路\n\n在路由器配置的末尾附近，你会看到类似`line vty 0 4`和`line con 0`的条目。这些线路是获取路由器命令行提示符的可用方法，每条线路以次钟可以单独配置。标准的Cisco设备有三种类型的线路：con、aux和vty。\n\
    \n*con*（或控制台）端口是我们用来连接系统的端口。虽然重新配置这个端口是可能的，但通常这是个坏主意。例如，你可以设置控制台需要密码才能登录，或者你可能让它以更高的速度运行以获得更好的交互响应。如果你需要具有非标准行为的物理控制台端口，请使用*aux*（或辅助）端口。这就是它的用途。\n\
    \n*vty*线路，或虚拟终端，是用于通过网络访问的逻辑线路。telnet和SSH连接到路由器时会被定向到虚拟终端。这些线路没有物理硬件；它们严格是软件接口。（这就是为什么它们被称为\"\
    虚拟\"的原因。）这些线路可能引起最大的关注并需要最多的注意；虽然锁着的门可以控制对con和aux端口的访问，但远程网络访问的重点在于你可以从任何地方访问你的路由器。\n\
    \n每台路由器支持不同数量的线路。识别线路的简单方法是使用`show line`命令。\n\n```\nrouter# show line\n Tty  Typ\
    \  Tx/Rx    A  Modem  Roty  AccO  AccI  Uses  Noise  Overruns  Int\n   0  CTY\
    \          -    -     -    -    -     0    0     0/0      -\n 129  AUX  9600/9600\
    \ -    -     -    -    -     0    0     0/0      -\n*130  VTY          -    -\
    \     -    -    -     18   0     0/0      -\n 131  VTY           -    -     -\
    \    -    -     6    0     0/0      -\n 132  VTY           -    -     -    - \
    \   -     3    0     0/0      -\n 133  VTY           -    -     -    -    -  \
    \   2    0     0/0      -\n 134  VTY           -    -     -    -    -     0  \
    \  0     0/0      -\n```\n\n在这里，我们看到这台特定的路由器有一个控制台、一个aux端口和五个编号从130到134的虚拟终端。虽然其余大部分信息通常没什么用，但有时看看某个特定终端被访问了多少次还是很不错的。\n\
    \n虽然你可以在这些端口上进行各种配置，但最重要的功能是与密码和访问方法相关的功能。让我们看一个示例配置，看看能学到什么。\n"
