    possibly manage a router without using MRTG or an equivalent tool.*


    # *Load Balancing BGP*


    If you were paying attention, you probably caught the emphatic bit earlier about
    how BGP is not a load-balancing protocol and find the title of this section inexplicable.
    BGP does not perform load balancing, but you can do some manual tricks that will
    allow you to adjust usage of your Internet circuits. You can also purchase products
    that will add load balancing to BGP or perform pseudo load balancing via DNS or
    NAT, or perform other unrelated tricks. Without purchasing additional equipment,
    however, you can use the BGP protocol against itself to perform crude load adjustments.
    By judiciously adding AS "hops" to the routes you receive and offer, you can increase
    the distance that the BGP algorithm sees to routes from different network areas.


    ⁴ This may be the most fundamental difference between computers and human beings.'
