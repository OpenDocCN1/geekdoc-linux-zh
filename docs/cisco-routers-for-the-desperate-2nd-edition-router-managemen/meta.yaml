    Many large backbones use routing registries to identify which blocks of IP addresses
    should be announced by which ASNs. This prevents someone from destroying a company''s
    Internet connectivity by sending out bogus route announcements for their IP addresses.
    The original Routing Arbiter Database (RADB) is maintained by Merit, but today
    many backbones have their own RADB systems.


    Check with your ISPs. They may or may not require that you register with a RADB,
    and they may or may not have particular RADBs that they will accept. Because each
    RADB differs, there''s no point in going through a detailed exercise in filling
    out forms. The best advice that I can give is to read the instructions carefully
    and look at samples of other entries in that registry for examples.


    After you reach the point where your IP addresses are registered in a RADB, you
    can actually configure BGP on your router.


    ## Configuring BGP


    The good news is that the paperwork necessary to prepare for BGP is the hard part.
    The actual setup process is very mechanical. When you configure BGP, your ISP
    should provide you with an IP address for their router''s BGP session (usually,
    their end of the Internet circuit) and an ASN to peer with.


    ## Your Address Announcements


    By default, a BGP session refuses to announce routes to its peers. This helps
    prevent a small company''s router from becoming an inter-backbone exchange point.
    (Your upstream providers should filter your announcements so that they only receive
    the proper routes from you, so this shouldn''t be a problem.²) For a router to
    announce a block of addresses via BGP, it must know where to send packets bound
    for those addresses when a peer sends them. In a small network, the simplest way
    to do this is to provide a single static route for the exact block of addresses
    you want to announce to your peers. Providing several static routes for pieces
    of that block is insufficient: you must have a single route for the entire block.


    The easiest thing to do is provide a static route for the whole announced block
    to the "null0" interface. While null0 is only a logical interface that exists
    only to discard data, your router will use a more specific route if one is available.
    This monolithic route also allows you to renumber router interfaces or change
    how your subnets are routed without worrying about scrambling BGP''s route announcements.


    ## Configuring Addresses for Announcement


    For example, assume that you have the address block 192.168.0.0/23 on your network.
    The first half of that block is attached to your router''s Ethernet interface,
    while the second half is routed to a firewall further into your network. Obviously,
    your router knows where to send packets bound for any individual IP address within
    that block. It doesn''t know where to send the block as a whole, however. While
    both halves of the network address block are routed, you must have a single static
    route for the whole of 192.168.0.0/23.


    ```

    router(config)# ip route 192.168.0.0 255.255.254.0 Null0

    router(config)# access-list 230 permit ip host 192.168.0.0 host 255.255.254.0

    ```


