  raw:
  - "[PAGE 83]\n\n> **NOTE** Routers have many potential image storage locations,\
    \ including internal flash, removable flash cards, or other storage media. Having\
    \ additional space to store images is nice, because it allows you easy to recover\
    \ from installing an unsuitable image.\n\n# Viewing Disk Contents\n\nGo into enable\
    \ mode and enter `dir /all`.\n\n```\nrouter# dir /all\nDirectory of flash:/\n\n\
    \ 1  -rw-   9270984       <no date>  c3640-is561-mz-120-7-XK1.bin\n 2  -rw-  \
    \       25       <no date>  snnpmengineid\n\n33554432 bytes total (24283292 bytes\
    \ free)\n```\n\nThere's only one file on this router, our 1 boot image. There\
    \ isn't enough room on this flash device to store another image—we have 2 used\
    \ more space with the existing image than we have left 3 free. While this particular\
    \ router has two slots for flash cards, neither slot has a card in it.\n\nIf you\
    \ have a router with PCMCIA slots for flash memory, I highly recommend that you\
    \ purchase a Cisco-branded flash card. Although they cost a few hundred dollars,\
    \ it will make recovering from a failed upgrade much, much easier. (Regular flash\
