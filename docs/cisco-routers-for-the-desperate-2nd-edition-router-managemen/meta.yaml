  md: '# INTRODUCTION


    ![](img/b76c804cf499c7eeda3929279b928b62_13_0.png)


    Welcome to *Cisco Routers for the Desperate*! While network administrators know
    that they should intimately understand every piece of equipment on their networks,
    in the real world we all become most familiar with the things that require the
    most care and feeding. We all spend more time than we''d like arguing with buggy
    operating systems and applications, and as a result are very familiar with them.
    Cisco routers "just work" almost all the time, so we don''t get much chance to
    become familiar with them. This gives the router a certain air of the "mysterious
    black box." When the router actually breaks, the mysterious black box immediately
    becomes an object of fear and dread. The fight-or-flight instinct kicks in, people
    panic, and pretty soon everyone''s'
  merge: -1
  pgno: 13
- img_proc: true
  md: 'running around as if they have a drunken badger loose in their undies. Perhaps
    you call your Internet service provider and beg for help—always a legitimate tactic,
    but perhaps not the quickest and certainly not the best for your self-respect.
    You could go buy a book on Cisco routers, but most of those that actually contain
    useful information weigh roughly the same as an automobile transmission and are
    almost as digestible. And we all know you won''t have time to get through it during
    an actual emergency, will you?


    This book is aimed at the administrator of a small network who is responsible
    for anywhere from one to three Cisco routers. Our goal is to make you comfortable
    with the Cisco environment and provide exactly the information you need to troubleshoot
    and resolve the most common problems that either happen on Cisco routers or intimately
    involve Cisco routers. Once you have that under your belt, we go a little further
    and provide the basic information you need to address some of the questions that
    frequently arise when working with Cisco routers and network connections. This
    book is also short enough to actually be read.


    > This is the book I wish I had read before I first touched a Cisco device.


    This book is not a complete tutorial on all of the things that can be done with
    Cisco routers. Cisco almost invented the networking business, and its equipment
    has been used to interconnect almost every sort of network hardware ever created.
    We focus squarely on TCP/IP networking in an Internet environment and do not detour
    into channelizing circuits, VoIP, IPX, AppleTalk, or any of the other features
    available in Cisco-land. Instead, you''ll discover how to learn these things yourself.
    Once you''re comfortable with Cisco routers, everything else follows.


    # **What This Book Will Teach You**


    The main goal of this book is to make you comfortable with the environment and
    technology found inside every Cisco router. First, you have to connect to the
    router and log in, and we''ll discuss how you can do that. You also need to examine
    interfaces, check the configuration, and change the system''s current and startup
    configurations as well as run some basic troubleshooting commands.


    To make the router work properly, you''ll need to have a basic comprehension of
    the network types most commonly found on modern TCP/IP networks. We''ll briefly
    cover'
  merge: -1
  pgno: 14
- img_proc: true
  md: 'Ethernet and serial lines, and we''ll give some pointers to further information.
    This isn''t a primer on networking, but you need to understand enough theory to
    comprehend router error messages.


    We''ll then discuss the most common router usage, connecting a small network to
    the Internet. We''ll go step-by-step over the typical configuration choices, and
    then learn how to pre-configure a router so that you can quickly and easily set
    up a connection with a minimum of fuss. This will allow you to ask your ISP for
    the specific information you need, rather than their telling you what you need
    to type. To make your Internet con-nection work, you''ll also have to configure
    the router''s Ethernet interface, so we''ll discuss that as well.


    Perhaps the second most common use of a router is to connect two offices with
    a private leased line. This is a step up from connecting a network to an ISP,
    and we''ll cover how to make this happen, beginning with ordering the circuit
    from the telephone company. Because you''ll be responsible for this circuit, we''ll
    cover troubleshooting as well.


    As good as Cisco equipment is, its products require occa-sional software updates
    to solve stability and security problems. We''ll take you through doing this safely
    and reliably, and we''ll discuss recovering from the most common problems.


    Whenever the office Internet connection goes down, man-agers all have the same
    question: "What would it take to get redundancy?" We''ll unveil the mysteries
    of BGP, the Border Gateway Protocol, and show how you, as a small network provider,
    can use BGP to provide some measure of network redundancy. We''ll also discuss
    the problems associated with BGP and some workarounds that can solve those problems.


    Finally, Cisco routers can take advantage of a variety of network services that
    you might already offer, and they offer other interfaces to more easily fit with
    your network. These include such basic protocols as SSH (Secure Shell), NTP (Network
    Time Protocol), and SNMP (Simple Network Management Protocol). We''ll briefly
    discuss how to configure these and others.


    # Where You Can Learn the Rest


    If you need more information, it''s available elsewhere for either a small fee
    or at no cost.


    By far, my favorite source of information on a Cisco prob-lem is the Google search
    engine. Usually, a quick web search with well-chosen search terms will give an
    answer on the first'
  merge: -1
  pgno: 15
- img_proc: true
  md: 'page. The problem, of course, is finding those "well-chosen search terms."
    Usually, the word "Cisco" and a snippet of the technology or error message will
    suffice to provide an answer. Be sure to check both the "groups" and "web" search
    functions, because Google indexes the entire history of Usenet (including even
    the early days of Cisco).


    If you''re a Usenet (aka "Internet News") user, check the newsgroup comp.dcom.sys.cisco.
    While this group hasn''t had a FAQ update in several years, it''s still actively
    used and is an excellent place to get pointers to further information on almost
    any Cisco-related topic.


    By far, the most authoritative information on your router is available on the
    Cisco website, http://www.cisco.com. Documentation for all router models, modules,
    and other hardware appears there along with tutorials for configuring features
    specific to each model or module.


    Although all of the above-mentioned items are free, I cannot recommend a Cisco
    SmartNet contract strongly enough. The cost is small compared to the cost of the
    router, and having a contract ensures that a Cisco engineer will immediately be
    available to you whenever a critical problem occurs. If you have to resolve a
    router problem on your own, you may find yourself struggling for hours or days.
    But if you have a contract, your service might well be restored within minutes
    of a simple phone call. The cost of downtime when you''re struggling with a problem
    on your own almost certainly far exceeds the cost of the SmartNet contract.


    Additionally, Cisco tends to very quickly respond to low-priority Technical Assistance
    Requests that SmartNet customers can enter on its website. I''ve come to expect
    answers within an hour on even trivial questions, and have never waited more than
    a day. While Cisco does not guarantee this level of service, rapid response is
    very routine for them. You can spend far longer than that hunting for answers
    on the Internet.


    # Unpacking the Router


    If you''re lucky, your first introduction to Cisco routers will be a brown box
    arriving on your loading dock. This means that you''ll learn how to configure
    the router by actually installing it, which is much easier than having to thoroughly
    understand a working setup. If you aren''t this lucky, just pretend that your
    server room is a really *big* brown box and follow along. You may have to'
  merge: -1
  pgno: 16
- img_proc: true
  md: 'search the office for the where your predecessor stashed some of the router
    accessories, but at least you''ll know what you''re looking for!


    While the most interesting part is probably the router itself, be sure to find
    the console cable and adapter as well as the manuals and CD-ROMs. In a modern
    Cisco router, the console cable is usually a flat blue cable with an RJ-45 connector
    on each end and an RJ-45–to–DB-9 adapter to let you attach to the serial port
    on your computer. Hang on to this cable, because you will need it later. (Because
    Cisco console cables tend to wander off if left unguarded, I keep a spare locked
    in my workshop in a fireproof safe labeled "Caution: Live Plague Virus.")


    The manuals are generally available on Cisco''s website if you have a SmartNet
    contract, but a paper copy is nicer to read while sprawled on the couch. Many
    modern Cisco routers are *modular*; the router chassis has several slots where
    cards containing connectors for different types of networks can be plugged in.
    Each card or component has its own manual. While we will cover basic configuration
    of the most common network interfaces, you should definitely check the manual
    for any special requirements for your modules.


    Lastly, the CD-ROMs contain router software, additional documentation, and add-on
    tools that can help you manage your router. Keep this software, it can help greatly
    in disaster-recovery situations.


    Break out the router chassis manual and look at the router itself. Things you
    should look for include the console port, the aux port, and the network interfaces.
    Let''s start with the console port.


    **WARNING** Do *not* power your new router on yet!


    # *Console Setup*


    Your Cisco router has a port resembling a standard Ethernet RJ-45 port, labeled
    "console." You received a console cable with your router; plug one end into your
    router and attach the serial port to a 9-pin serial port on a computer.


    Now you need serial port client software on your computer. We''ll assume that
    you''re using HyperTerminal for Windows to connect to the router. HyperTerminal
    is available on all versions of Windows. If you''re using another operating system,
    it must have a serial port program available. Free Unix-like operating systems
    usually include "tip" or "cu," and "kermit" and "minicom" are also available for
    many different operating systems.'
  merge: -1
  pgno: 17
- img_proc: true
  md: 'I frequently use a serial cable and a VT100 terminal emulator to console into
    a router from my handheld. (Handheld devices are an excellent choice of console
    client in crowded server rooms where the narrow space between racks make managing
    a laptop difficult.) Specifics of configuring these programs vary, but the settings
    we use here will work for any of them.


    In modern Windows versions, HyperTerminal may not be installed by default. If
    you look under Start > Programs > Accessories > Communications and don''t see
    HyperTerminal, it''s not yet installed on your system. Go to the Add/Remove Programs
    control panel and select "Windows Components." HyperTerminal is part of the "Communications"
    feature set.


    Once you have your serial client software installed, set up a new connection to
    your serial port. Use the following settings:


    +   - 9600 baud

    - No parity

    - 8 data bits

    - 1 stop bit

    - No flow control


    Click the "connect" icon. Because your router has no power yet, you shouldn''t
    see anything happen.


    # ## Other Router Ports


    The aux port looks just like the console port, and you can even plug in your console
    cable and get a command line on your serial client. The router doesn''t display
    its bootup messages on the aux port, however. For the most part, the aux port
    is there only in case something goes wrong. If you misconfigure your console port
    and find yourself locked out of the system, you can log in via the aux port and
    fix the router''s configuration. In the event that you really botch an upgrade,
    you can set your aux port to use a high-speed connection and upload a new software
    image to the router over it. You might connect a modem to your console port for
    remote work, and use the aux port for local work.


    Network interfaces look different from router to router, but for the most part
    they have a connector appropriate to the type of network they connect to. Ethernet
    interfaces usually have either a standard Cat 5 or fiber connection, while T1
    interfaces look like Cat 5 connectors. Larger circuits, such as DS3s and'
  merge: -1
  pgno: 18
- img_proc: true
  md: 'OC3s, have coaxial connections. Look at your router and identify the type of
    network interfaces it supports; you''ll need to know that later.


    # Power-On


    With your serial connection in the console port, plug in the router and in a few
    seconds you''ll see some activity.


    ```

    System Bootstrap, Version 12.2(1r) [dchih 1r], RELEASE SOFTWARE (fc1)

    Copyright (c) 2001 by cisco Systems, Inc.

    C7200 platform with 131072 Kbytes of main memory


    Self decompressing the image : #####################

    ...

    ```


    You''ll see a variety of facts about the equipment, such as the boot loader version
    and the hardware platform. The system then starts loading the operating system
    and heads for the main boot sequence. We''ll see how to interpret most of the
    output it gives later in this book. Let it keep going until it wants to talk to
    you. If this is the first boot, it will offer to let you configure it:


    ```

    Would you like to enter the initial configuration dialog? [yes/no]:

    ```


    The configuration dialog is designed to get a bare minimum system up on the network,
    allowing you to use a configuration tool such as CiscoWorks to complete the setup.
    For reasons we''ll discuss shortly, I encourage you to perform all the configuration
    at the command line instead of via one of these tools. (Once you''ve read this
    book and understand the implications of your choices, you might want to use the
    configuration dialog to perform basic setup.) For that reason, I recommend that
    you skip the configuration dialog. This will drop you to a router prompt.


    ```

    Router>

    ```


    Congratulations! You''re now actually logged in to the router. Now, let''s see
    what you can do with it.'
