    If your incoming traffic is biased toward one peer or another, change your outgoing
    announcements to balance those. The important thing to remember here is that you
    must prepend your own AS number to outbound announcements instead of your peer''s.
    You would be quite annoyed if someone else started using your AS number, and you
    can expect that your peers feel the same about theirs.


    The nice thing here is that you already have outbound route maps. To add an AS
    path prepend, simply edit the existing map to add the line for AS path prepending.


    ```

    router# conf t

    router(config)# route map ➊ispB-out permit 10

    router(config-route)# ➋set as-path prepend 100

    ```


    Our BGP configuration already references the ispB-out route map, so we don''t
