    The two basic things to configure on a serial interface are the IP address and
    the encapsulation. For example, suppose we have a T1 with an IP address of 192.168.1.2,
    a netmask of 255.255.255.252, and PPP encapsulation. Go into configure mode for
    that interface and enter


    ```

    router(config-if)#ip address 192.168.1.2 255.255.255.252

    router(config-if)#encapsulation ppp

    ```


    > **NOTE** We cover configuring serial interfaces in greater detail in Chapter
    4. Refer to Cisco''s online documentation for more details.


    Modern Cisco routers set a variety of configurations by default, most of which
    disable functionality that is only used in advanced implementations. One setting
    that is worth changing, though, is the interface description, a field that can
    be a useful way to store important circuit-related information. Here we label
    our Internet circuit as such, to differentiate it from our other T1 circuits,
    and we include the circuit ID that the telephone company uses to identify this
    particular T1 circuit. This way, if we should have to phone the telco and complain
    that a circuit is down, we have the necessary circuit ID right at hand.


    ```

    router(config-if)#description ISP uplink, circuit ID#3141579

    ```


    ## Other Interfaces


    Cisco supports a whole slew of different interface types: HSSI, FDDI, SMDS, and
    ATM, to name a few. If you need one of these interfaces, the interface card or
    router will come with documentation describing how the interface is configured.
    Chances are good that the configuration process will closely resemble the one
    used for serial or Ethernet circuits, with minor changes for the connection protocol.
    Because these interfaces are comparatively rare among the people likely to read
    this book, we''re not going to cover them in any detail.


    However, every router has two other sorts of interfaces that we will address:
    loopback and null interfaces. Both are logical interfaces—they have no hardware
    associated with them, but are created purely in software for the router to handle
    certain specialized tasks. Each has its own specific uses.


    ## Loopback Interfaces


    Loopback interfaces are ones where the local router communicates with itself.
    They are useful because you can assign any IP address you like to them. For example,
    some advanced router configurations require the router to have its own IP address
    without assigning that IP to any interface attached to the network. Loopback interfaces
    make this easy.


    You create loopback interfaces by configuring them. For example, to create an
    interface called loopback0, you would go into configure mode and tell the router
    you''re configuring that interface, then assign it an IP address as with any other
    interface.


    ```

    router# conf t

    router(config) int loopback0

    router(config-if)#ip address 192.168.254.5 netmask 255.255.255.255

    router(config-if)#Z

    ```


    The next time you run show int, the loopback interface you created appears in
    the list. Our router now knows that the IP address 192.168.254.5 is bound to this
    router, but not to any particular interface. If someone attempts to ping that
    IP over any interface, the router will respond.


    To remove the loopback interface, go into configure mode and enter **no** and
    the interface name.


    ```

    router#conf t

    router(config)#no int loopback0

    ```


    These interfaces are especially useful when combining two or more circuits into
    one large one with multilink PPP, and then using BGP (see Chapter 7) over such
    a link. You need to have a single IP address for a BGP peer, but when you share
    several circuits between you and your BGP peer, you need to have a consistent
    IP address for those peers to talk to. You should never create a loopback interface
    unless specifically instructed to by your ISP or by Cisco''s tech support, but
    on a similar note, you should know what they are so that they don''t surprise
    you.


    ## Null Interfaces


    The null interface is quite literally a route to nowhere. Traffic routed to any
    null interface is simply discarded. Why would you want to discard traffic? Some
    IP addresses should never be seen on the public Internet, and you might wish to
    route those addresses to the bottomless void if packets arrive for them. Null
    interfaces are most commonly used in BGP configurations, where you must have a
    static route for each block you wish to announce. (We''ll discuss BGP in more
    detail in Chapter 7.)


    Only one null interface is required, null0; having multiple black holes in your
    router doesn''t serve any purpose. The null interface doesn''t need to be configured;
    you can simply route traffic to it.


    ```

    router(config-ip)#ip route 192.168.0.0 255.255.0.0 null0

    ```


    Now that we''ve explored the basics of router interfaces, let''s see how to use
    serial interfaces in the real world.


