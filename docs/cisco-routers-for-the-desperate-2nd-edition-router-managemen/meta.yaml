    There's only one file on this router, our 1 boot image. There isn't enough room\
    \ on this flash device to store another image—we have 2 used more space with the\
    \ existing image than we have left 3 free. While this particular router has two\
    \ slots for flash cards, neither slot has a card in it.\n\nIf you have a router\
