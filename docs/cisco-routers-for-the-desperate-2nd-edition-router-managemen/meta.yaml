    \n从技术上讲，你可以说启动配置是一个配置文件；它存储在非易失性 RAM 中，就像磁盘上的文件一样。然而，Cisco 专家通常不将启动配置称为配置文件，而仅称之为“配置”。运行配置绝对不是一个文件；它是启动配置的一个（可能经过修改的）副本，保存在内存中。\n\
    \n## 启动配置\n\n要查看路由器启动时将使用的配置，请输入 `show startup-config` 命令。\n\n```\nrouter# show\
