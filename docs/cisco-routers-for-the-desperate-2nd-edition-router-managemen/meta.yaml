    to your ISP. Your first step is to log in to the router and enter configure mode.


    We discussed each of the following entries in Chapter 3, but basically, by setting
    an IP address and an encapsulation protocol, you should bring your circuit up.


    ```

    router#conf t

    router(config)#int <serial interface name>

    router(config-if)#description ISP Uplink, circuit ID #<circuit ID>, customer #<number>

    router(config-if)#encapsulation <encapsulation>

    router(config-if)#ip address <your end of circuit IP address> <netmask>

    router(config-if)#^Z

    ```


    After you enter the above commands, your T1 should show a status and line protocol
    of "up." Ping the ISP''s side of the T1 line, and you should get a response. Once
    you do, you know that your T1 is up. *Save your work immediately!*


    ```

    router#write memory


    Building configuration...

    [OK]

    ```


    Now configure the router''s Ethernet interface.


    ```

    router#conf t

    router(config)#int <Ethernet interface name>

    router(config-if)#ip address <IP address for router> <netmask>

    router(config-if)#^Z

    ```


