    \n```\nrouter(config)# service password-encryption\n```\n\n路由器会将此语句放置在全局配置中的合适位置。（不，你不能在配置中随意选择语句的放置位置；路由器比你更清楚每一行应该放在哪里，并且会公然忽略任何重新排序配置的尝试。）在配置提示符下输入像\
