  md: 'read-only SNMP by default, it''s always a good idea to list this explicitly
    in case the system behavior should change with an IOS change.)


    With SNMP support, logging, and timekeeping, you have the tools you need to successfully
    monitor and manage your router with the rest of your network management equipment.
    If you can do all this, as well as troubleshoot your own circuits and load balance
    your traffic with BGP, you''re better off than almost all other Cisco users. Congratulations!'
