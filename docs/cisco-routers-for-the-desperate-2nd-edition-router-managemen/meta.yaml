    4. The second statement defines an access list, a completely new topic. Thick
    books have been written entirely about Cisco access lists, and we''re not going
    to go over them in any great detail. (They are worth knowing, but they do need
    a book at least this large to do them even a faint hint of justice.) The important
    thing now is the syntax used for BGP route announcements. Every access list has
    a ② unique number, and the number defines the syntax of the remainder of the access
    list statement. For BGP, use a number between 100 and 199. The ③ permit keyword
