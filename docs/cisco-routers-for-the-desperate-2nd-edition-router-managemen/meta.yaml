    - **串行接口 IP 地址** 大多数 ISP 为 T1 的每一端分配一个 IP 地址，并为线路网络分配一个包含四个 IP 地址的地址块（子网掩码为 255.255.255.252）。该地址块中的底部和顶部
    IP 地址不可用；剩下的两个地址分别分配给线路的每一端。你必须知道哪个 IP 分配给哪一端，以便正确配置你的路由器。虽然你可以使用没有 IP 地址的串行线路，但这样做会使故障排除和复杂的路由变得更加困难。


    - **线路 ID 或客户编号** 如果你的 T1 线路出现故障，你需要紧急联系 ISP。如果可能的话，获取这条线路的线路 ID 和/或你的 ISP 分配给你公司的客户编号，这样你在打电话时手头就有这些信息。


    - **T1 线路封装** 你必须在线路上设置封装。常见的选择是 HDLC 和 PPP（在第 3 章讨论）。只要你的路由器和 ISP 的路由器使用相同的封装协议，线路就能工作。


