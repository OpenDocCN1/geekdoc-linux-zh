- img_proc: true
  md: '# Tuning HSRP


    While the above will handle most of the work of live failover for most circumstances,
    you''ll find that HSRP requires some fine-tuning to be truly transparent. The
    most commonly tweaked features are `preemption`, `interface tracking`, `delay`,
    and `authentication`.


    # Preemption


    Preemption is where a particular interface declares itself to be in charge of
    the standby IP address and forces all others to relinquish their claims to that
    address. This means that a particular router defaults to supporting the HSRP,
    letting all others only be backups. This is handled by assigning a priority to
    each interface that supports the standby IP, and letting the router with the highest
    priority claim it. By default, every router in a standby group has a priority
    of 100. To set a priority, use the keyword priority in the configuration.


    ```

    router(config)# int fast0/0

    router(config-if)# standby 1 preempt

    router(config-if)# standby 1 priority 105

    ```


    Start by allowing this router to demand to host the standby IP from lower-priority
    routers. If you use preemption, all routers in a standby group should have this
    entry. Then set this particular router to have a priority of 105.


    # Interface Tracking


    It can be convenient to assign a single router to be the master of the standby
    group, if only so you know which router is in charge. (Network administrators,
    as a class, are not comfortable saying that “traffic goes into a cloud near our
    routers and magic things happen.” They prefer statements such as, “Traffic will
    unequivocally go to Router A as long as A is running.”) At times, your chosen
    router might not be a sensible choice. Look at Figure 7-2 again. Each of our routers
    has a single line to the Internet. If a router''s Internet circuit goes down,
    it no longer makes sense for that router to be the standby master; traffic would
    go through an extra hop for no good reason. We can cause a router''s HSRP priority
    to drop by using interface tracking. When your interface being tracked goes down,
    the HSRP priority automatically decreases.


    ```

    router(config)# int fast0/0

    router(config-if)# standby 1 track Serial0

    ```'
  merge: -1
  pgno: 108
- img_proc: true
  md: 'The standby IP number 1 is ⦿ monitoring the interface ⦿ Serial0. When Serial0
    goes down, it will automatically decrease its priority by 10. If this router''s
    priority has been set to 105, it will become 95. Because the other router has
    the default priority of 100, it suddenly has higher priority and takes over as
    the standby IP.


    # HSRP Delay


    When a router first boots, it takes a few seconds for it to get its bearings and
    start routing traffic. If the router uses BGP, those few seconds can be as long
    as a minute or two. HSRP, on the other hand, works quickly. If your preferred
    router takes over the standby IP address before it has a chance to sort out its
    BGP routing tables, traffic will stop flowing until the router is comfortable.
    To let your router get its feet properly under the table, you can assign a delay
    to HSRP failover.


    Time how long it takes for your router to reassemble all of its BGP sessions and
    for the CPU to drop to only normally busy after you type `clear ip bgp *`. Round
    it up 10 or 15 seconds, just to allow time for the unexpected. That''s how long
    your standby IP should wait before failing over.


    ```

    router(config)# int faste0/0

    router(config-if)# standby 1 preempt ⦿delay ⦿minimum ⦿60

    ```


    This router will ⦿ wait a ⦿ minimum of ⦿ 60 seconds before taking over the standby
    IP address.


    # Authentication


    It''s quite unlikely that an intruder would break into your HSRP cluster. This
    would require a fair amount of talent and knowledge. If they managed to do so,
    however, the effects could be devastating. Imagine if an intruder funneled all
    network traffic through a packet analyzer illegally installed on one of your machines;
    they could capture usernames, passwords, credit card numbers, customer details,
    and so on. For that reason, using some basic authentication on your HSRP standby
    group is a good idea. HSRP uses a simple password for authentication. Any router
    that knows the password is permitted to participate in the HSRP group.


    ```

    router(config)# int faste0/0

    router(config-if)# standby 1 ⦿authentication ⦿Password

    ```'
  merge: -1
  pgno: 109
- img_proc: true
  md: 'Here, we set standby group 1 to use a Ⓐ password of Ⓑ Password. It might not
    be the strongest authentication mechanism in the world, but it''s far better than
    nothing. Given these features, you should be able to tune HSRP to do almost anything
    you like. There''s one more complication with router redundancy, however: routing.


    # **BGP and HSRP**


    Take another look at Figure 7-2. We have Router A connected to ISP #1, and Router
    B connected to ISP #2. Both Router A and Router B are announcing their network
    addresses to their ISPs. Systems in the outside world will send their traffic
    to your network via their closest route. But with HSRP set up as we''ve discussed,
    your network will only use one outbound circuit at a time! Think about it; Router
    A only knows of routes it receives from ISP #1, so that''s where it sends everything.
    If Router A is holding the default route, even traffic meant for ISP #2 will go
    out via ISP #1. This is inefficient, and it places a very real limitation on your
    bandwidth use. To actually use both ISPs for outbound traffic, you need to speak
    BGP between your routers.


    In Figure 7-2, we show a pair of separate Ethernet interfaces for a connection
    between the two routers. Router A has the Ⓒ IP address of 192.168.1.1, while Ⓓ
    Router B has 192.168.1.2. Nothing else is on this network; I just use a crossover
    cable between the two routers.


    > **NOTE** *Nugget of Wisdom*


    *Yes, you can speak BGP over the shared network where the rest of your traffic
    is passed around. This increases the amount of traffic on your main network, however,
    and slows down outbound traffic. A packet bound for ISP #2 will reach Router A
    and immediately be turned around and sent back across the same network it came
    from to Router B, dramatically increasing potential collisions on your local network.
    I''ve seen any number of weird problems from this, but feel free to try it if
    your routers have only one Ethernet interface.*


    BGP calculates its preferred routes by counting the number of AS hops to the destination
    IP address. One thing you don''t want to have happen is for BGP to count the other
    router in your network as a penalty—presumably, bandwidth on your crossover cable
    is pretty much unlimited. (If it''s not, you need a better crossover cable, a
    better router, or *serious help!*) You don''t need to apply any sort of access
    list to the BGP session between your


    98 Chapter 7'
  merge: -1
