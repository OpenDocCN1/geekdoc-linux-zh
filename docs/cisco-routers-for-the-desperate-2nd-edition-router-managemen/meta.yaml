    # NTP


    If you''re relying on system logs to identify problems (as opposed to traditional
    troubleshooting methods such as "blind guesswork"), having your logs properly
    timestamped can make the difference between useful and useless records. Network
    management systems often use a system''s reported timestamp to record events.
    In the event someone breaks into your network and you have to involve law enforcement,
    inaccurate system time will effectively invalidate your records and your logs
    in the eyes of the legal system. While all of these combine to make network time
    important, maintaining synchronized network time across a variety of operating
    systems can be an annoyance. Cisco routers support Network Time Protocol (NTP),
    which is supported by all major operating system vendors and is the industry standard.


    # Basics of NTP


    NTP allows a group of networked hosts to agree on the time, within a few milliseconds.
    The protocol works with two conflicting assumptions. First, some systems have
    very accurate clocks, and the system owners wish to provide others access to those
    clocks. Second, those same hosts that want to provide a public service of accurate
    time do not wish to be flooded by every possible client in the world. The NTP
    protocol allows one or two local servers to get accurate time from big global
    time servers, and then redistribute that correct time to other clients on the
    network. The systems with extremely accurate clocks are called Tier 1 NTP servers.
    Those systems that are allowed to pull time directly from Tier 1 NTP servers systems
    and redistribute it to clients are called Tier 2 NTP servers.


    It is possible to configure your router to pull time directly from one of the
    big Tier 1 or Tier 2 NTP servers, but it''s best to have a local NTP server. Generally
    speaking, this server will read time from two or three different Tier 2 NTP servers
    and allow other local systems to get their time from it. This reduces load on
    the Tier 2 servers and makes NTP easier for you to maintain. The Tier 1 and 2
    time servers change their names or IP addresses on occasion, so it''s simpler
    to update your configuration on a single local server than on every client on
    the network. Check your operating system documentation for details on how to provide
    time services to clients.'
- md: '# Configuring NTP


    Enabling NTP on your router is as simple as telling the router the IP address
    of the local NTP server. Although one NTP server will suffice, if you have multiple
    servers, enter each in a separate configuration statement.


    ```

    router(config)# ntp server 192.168.5.8

    router(config)# ntp server 192.168.3.8

    ```


    Wall clock time isn''t the same throughout the world. By default, NTP distributes
    time in the Coordinated Universal Time (UTC) time zone, the modern successor to
    the old Greenwich Mean Time. Even if your clock is completely accurate, it''s
    not necessarily convenient for your logs to have timestamps local to Europe. After
    you configure a time zone, your router will know exactly what sort of timestamp
    you''d like to have. A time zone is easily configured with the clock option.


    ```

    router(config)# clock timezone ①est ②-5

    router(config)# clock ③summer-time ④edt ⑤recurring

    ```


    To set the router''s time zone, you need to know the ① name of the time zone.
    You probably know the name of your local time zone; if not, ask someone who spends
    a little less time with computers and a little more with other people. You also
    have to know ② how many hours this time zone is different from UTC. This is slightly
    obscure, but you can find any number of charts on the Internet that will give
    you this information.


    Many parts of the world also observe Daylight Saving Time (DST), and your router
    can too. Cisco recognizes this as ③ summer-time. To set DST, you need to know
    the ④ name of your time zone during the summer. Finally, if you want your router
    to automatically change its clock with the changing of the time, use the ⑤ recurring
    keyword.


    # Checking NTP


    Your router may need a few moments to synchronize its clock with your NTP servers.
    If you want to make sure that your router is correctly performing NTP operations,
    you can check with the command sho ntp status.


    ```

    router# sho ntp status

    Clock is synchronized, stratum 4, reference is 192.168.5.8

    nominal freq is 250.0000 Hz, actual freq is 249.9991 Hz, precision is 2**24

    reference time is C48A754E.88C5D76C (06:45:34.534 edt Mon Jun 28 2004)

    clock offset is -0.4631 msec, root delay is 65.75 msec

    root dispersion is 53.45 msec, peer dispersion is 6.85 msec

    ```


    This command displays more than you could possibly want to know about your router''s
    clock behavior, but you can see that the router believes it has synchronized its
    clock with that of a particular NTP server. You can also see what time the router
    thinks it is. This should be accurate, because NTP deals with margins of error
    on the order of milliseconds.


    You now have accurate time—congratulations! Now, let''s set up a place to record
    all these timestamps, and maybe even some data with them.


    # Router Logging


    A router knows when the equipment attached to it changes, when it has problems,
    and when people change its configuration. When you make changes to your router
    via the console, or if a circuit has a problem, you''ll probably notice messages
    such as


    ```

    %LINEPROTO-5-UPDOWN: Line protocol on Interface Serial3/1, changed state to down

    ```


    By default, these messages are dumped onto the console so that the administrator
    can figure out what is happening. While this is nice, if you''re not staring at
    the console 24 hours a day, it''s less than helpful. While the router can store
    logging messages locally, it can also send these messages to another system for
    safekeeping. We''ll start with the local logs and proceed to the more advanced
    remote logs.


    # Local Logging


    The router can store a few messages locally, which allows you to check recent
    events on the systems. To use this system, you have to decide what level of logging
    you would like. Cisco follows the syslog standards for logging levels that have
    eight degrees of severity.


    The *level* is an indication of the importance or severity of an individual message.
    Some messages are purely informational or contain only debugging information,
    while other messages (such as the "circuit down" example above) are clearly quite
    important. The levels are, in order of increasing importance:


    - **debugging** for debugging only

    - **informational** general informational messages

    - **notifications** events that may require special handling, but are not errors

    - **warnings** minor errors

    - **errors** real errors

    - **critical** critical errors

    - **alerts** errors that require immediate corrective action

    - **emergencies** the router is now inoperable


    When you specify a particular level, the router will log all messages of that
    severity level or higher. For example, if you specify that you want to log "info"
    level messages, the router will record all messages of the levels informational,
    notifications, warnings, errors, critical, alerts, or emergencies. Configuring
    basic logging requires only a couple of lines of code.


    ```

    router# conf t

    router(config)# service log timestamps datetime localtime

    router(config)# logging history debugging

    ```


    Start by telling the router to provide basic ① logging services as well as ② dated
    ③ timestamps in the ④ local time. When you have that, you can tell the router
    to ⑤ perform logging, keeping the ⑥ history on the local system. End with the
    ⑦ lowest level of severity of messages you wish to record.


    You can view the log entries with the `show logging` command. This command will
    display a few lines of information about the logging configuration and then give
    the actual log entries.


    ```

    router# show logging

    ...

    Log Buffer (8192 bytes):


    *Jun 29 10:17:46.079: %LINK-3-UPDOWN: Interface FastEthernet0/1, changed state
    to up

    *Jun 29 10:17:46.079: %LINK-3-UPDOWN: Interface FastEthernet0/0, changed state
    to up

    ```


    The important thing to remember is that the amount of space on the router for
    log messages is strictly limited and varies between different routers. If you
    want to keep more log messages, you must use syslog.


    # Syslog Basics


    The *syslog* protocol requires a separate server to receive the messages from
    the router (and any other network devices that speak the syslog protocol). The
    server runs a syslog daemon, or *syslogd*. Syslogd has been integrated into all
    sorts of Unix-like operating systems for many, many years, and Microsoft server
    operating systems have quite a few syslogd implementations (both commercial and
    free). Syslog daemons are very small and have low impact on even modest systems,
    and I recommend using whichever version is most convenient for your environment.
    While the configuration of syslog daemons varies widely between programs, the
    protocol basics are unchanged. Syslog uses the same severity levels as local logging,
    but also uses a *facility* to label messages.


    A facility is a category provided by the syslog daemon for a group of programs
    to log to the same place. For example, the syslog facility called *ftp* is intended
    for FTP server log messages, as well as messages from related programs such as
    TFTP and SFTP servers. The *daemon* facility is intended for miscellaneous system
    daemons that require logging but don''t really rate their own facility. In addition
    to a couple of dozen defined facilities much like these, a syslog daemon also
    has eight local facilities called local0 through local7 specifically for use by
    local systems administrators. Any one of these local categories is appropriate
    for your router messages; just pick one. The router will use any facility that
    you choose.


    I recommend logging everything that the router produces; Cisco logs aren''t very
    large, and when something breaks you''ll want to be able to look at older logs.
    Once you have local logging configured, you only need to add a few lines to enable
    syslog logging.


    ```

    router# conf t

    router(config)# logging trap debugging

    router(config)# logging facility local3

    router(config)# logging 192.168.1.8

    ```


    Logging **¹** traps are messages sent by the router. In this case, we want the
    router to transmit any log messages of **²** debugging severity or greater to
    our syslog server (the severity levels are exactly the same as those used in local
    logging). The router tags each completed message with a particular **³** facility
    we''ve set aside. In this case, we use the **⁴** local3 facility. Finally, we
    tell the router the **⁵** IP address of our logging server. Save your work, and
    every time the router generates a log entry it will send a message to your logging
    server.


    When the syslog messages arrive at your logging server, the syslog daemon will
    check the facility and severity of each message and direct the message to the
    file you''ve chosen for those messages. This process happens extremely quickly;
    if your syslog server is correctly set up, you will start to see messages appear
    almost immediately.


    # SNMP


    The most common glue to hold networks together is the Simple Network Management
    Protocol (SNMP). Many different products and tools use SNMP to gather and accumulate
    network and device performance information, and all of these include support for
    Cisco routers.


    SNMP can be used in both read-only and read-write modes. Using read-write SNMP
    requires that your router be tightly secured. Because your router is usually the
    border device on your network, sitting outside your firewall, this is difficult.
    Read-only access is a much safer idea. (You can also use an access list to prevent
    random people from being able to query your router; check Cisco''s website for
    details.)


    An SNMP-enabled device uses a community name to provide basic security. This is
    much like a password; people that have the community ID can make SNMP queries
    of the router, while people without the community name cannot. Setting the community
    name is quite simple:


    ```

    router# conf t

    router(config)# **¹** snmp-server **²** community **³** SendMichaelAllYourCash
    **⁴** RO

    ```


    First, tell the router to **¹** fire up its SNMP server. You must set a **²**
    community and pick **³** some random jumble of characters to use as a community
    name. Finally, do not forget to set the community name to be **⁴** read only!
