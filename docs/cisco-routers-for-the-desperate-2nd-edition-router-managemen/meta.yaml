    # Backing Up Router Configurations


    There''s nothing particularly special about router configurations; they''re just
    plain text. The simplest way to back up your router''s configuration is to copy
    the configuration statements to another system, perhaps a plain text file on a'
- md: "server or even to a piece of paper in a logbook. Should your router suffer\
    \ a critical failure and lose its mind, you can restore service by just going\
    \ into configure mode and pasting in the entire router configuration.\n\nIt is\
    \ also possible to copy your router's configuration to an FTP server with the\
    \ `copy ftp` command. The process is quite similar to the FTP process used for\
    \ IOS upgrades, and it is an *excellent* precaution to take before an upgrade,\
    \ so we'll discuss it in Chapter 6.\n\n## 3 ROUTER INTERFACES\n\nOne of the main\
    \ functions of a Cisco router is to connect different types of networks. Connecting\
    \ Ethernet systems together is quite straightforward, and connecting WAN links\
    \ together is just as easy, but these two very common network types simply refuse\
    \ to talk to each other without an intermediary. The router allows you to treat\
    \ very different physical networks as a single continuous entity.\n\nCisco routers\
    \ support almost any type of network interface: Ethernet, serial, token ring,\
    \ DS3, OC3, asynchronous modem, and so on. These interfaces might be on add-on\
    \ cards that slide into a system much like those used in a laptop, or they might\
    \ be integrated with the system. And when some bright scientist develops direct\
    \ neural links into the human mind, Cisco will have an interface for that, too.\
    \ But until then, Ethernet and serial are the most common interfaces, so we'll\
    \ focus on them.\n\n### Got Interface?\n\nCisco devices can display information\
    \ about each interface attached to the system. By looking at the system interfaces,\
    \ you can see not only what sorts of interfaces the router has, but also how much\
    \ traffic each interface is handling, what sort of network errors the router senses,\
    \ and a whole slew of further detail about the networks the router is attached\
    \ to. To see every interface on your router, enter \"show interfaces\" (sho int).\
    \ Every interface on the router will show up with an entry starting like this.\n\
    \n```\nrouter#sho int\nFastEthernet1/0 is administratively down, line protocol\
    \ is down\n  Hardware is AmdFE, address is 0003.e35e.d191 (bia 0003.e35e.d191)\n\
    ...\n```\n\nRouters list their interfaces by their internal order in the system.\
    \ At times this order will be clearly labeled on the outside of the system, while\
    \ at other times you might wonder where the router learned to count.\n\nEach interface\
    \ is uniquely named by a ① type (FastEthernet in this example) and a ② unique\
    \ number for that type (1/0).\n\nThe first interface of any type is numbered 0.\
    \ A split number like the one in this example tells us that multiple interfaces\
    \ are loaded into a single add-on module. For example, the interface FastEthernet\
    \ 1/0 is the first Ethernet interface on add-on card 1. If this add-on card had\
    \ a serial interface as well as an Ethernet interface, you could also have Serial\
    \ 1/0 show up. Numbering all depends on how the router thinks the interfaces are\
    \ attached.\n\nOn a router with many interfaces, you might only want to see a\
    \ particular interface. For example, if you want to see if your Internet circuit\
    \ is working, you only need to look at the interface that's connected to that\
    \ circuit, not every interface on the router. To display a particular interface,\
    \ add its name to the sho int command. For example, to see only the interface\
    \ serial 0, enter sho int serial0.\n\nAs with commands, you can abbreviate interface\
    \ names to the shortest unique identifier: these abbreviations usually contain\
    \ just enough letters to uniquely identify the interface type and number. For\
    \ example, serial 1 can be s1, ethernet 0 can be e0, and fast ethernet 2/1 can\
    \ be faste2/1. Have a look at your router's interface names to see how they can\
    \ be abbreviated.\n\n### Common Interface Characteristics\n\nWhen you run `sho\
    \ int` on most types of interfaces, including serial and Ethernet, you will see\
    \ a great deal of similar information in the resulting output for each. The example\
    \ below shows the first part of `sho int` output for an Ethernet interface, but\
    \ everything we'll discuss relates to serial interfaces as well.\n\n```\nrouter#sho\
    \ int fastethernet2/0\nFastEthernet2/0 is up①, line protocol is up②\n  ③Hardware\
    \ is AmdFE, address is 0003.e35e.d1a1 (bia 0003.e35e.d1a1)\n  ④Description: Main\
    \ office Ethernet hub\n  ⑤Internet address is 198.88.118.129/25\n  ⑥MTU 1500 bytes,\
    \ ⑦BW 10000 Kbit, DLY 1000 usec,\n     reliability 255/255, txload 1/255, rxload\
    \ 13/255\n  ⑧Encapsulation ARPA, loopback not set\n...\n```\n\nThe output for\
    \ each interface continues, but it's mostly debugging information and not useful\
    \ at the moment. We'll look at that additional output in CHAPTER 5.\n\nLooking\
    \ at the output above, we first see that this interface is ① up. This means that\
    \ a physical cable is plugged into the interface and that the router sees a signal\
    \ being sent over it that it can understand. If the interface is unused or empty,\
