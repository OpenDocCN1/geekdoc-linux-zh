  md: '```

    router# conf t

    router(config)# hostname ①router.blackhelicopters.org

    router(config)# ip domain-name ②blackhelicopters.org

    ```


    This particular machine has the hostname ① router.blackhelicopters.org and is
    part of the domain ② blackhelicopters.org. While you might expect that a router
    could determine its domain name from the hostname, if you have fourth- and fifth-level
    domains, this gets harder to do than it sounds. After you have these basics set,
    you can finish configuring SSH. One easy way to determine if your current IOS
    version supports SSH is to run these commands. If the router doesn''t recognize
    them, your IOS doesn''t support SSH, and you need to change to a different one.


    ```

    router(config)# crypto key generate rsa①

    router(config)# ip ssh ②timeout ③60

    router(config)# ip ssh ④authentication-retries ⑤3

    router(config)# line vty 0 4⑥

    router(config-line)# transport input ssh⑦

    ```


    After you have the hostname and domain name set, ① generate an RSA cryptographic
    key for your router. An RSA cryptographic key is a pair of very large numbers
    that your router uses as a key to prove its identity to SSH clients. This key
    will not show up in your router''s configuration file; it''s stored separately.


    SSH has two other options that you can set; the ② number of seconds that the router
    will leave an idle SSH connection up before closing it, and the ④ number of tries
    an incoming SSH connection has to enter a correct password. In this case, the
    router will leave SSH connections open for ③ 60 seconds and give users ⑤ three
    chances to enter the correct password.


    Finally, we need to ⑥ configure the virtual terminals and tell the router that
    ⑦ SSH is the incoming transport method that it should accept. Of course, we also
    have to have the login local statement so that the network will authenticate against
    the usernames and passwords stored on the router.


    Now you can securely access your router from anywhere in the world. Let''s go
    on to look at some other features offered by Cisco to make your router a real
    participant in your network instead of a mysterious gray box.'
  merge: -1
