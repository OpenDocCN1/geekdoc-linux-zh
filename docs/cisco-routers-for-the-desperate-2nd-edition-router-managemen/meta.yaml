    \n更严肃地讲，外部世界会看到你的路由刚刚发生了“震荡”（flapped）；它们从该对端被撤销，然后突然重新出现。如果你短时间内连续多次执行此操作，其他自治系统将因为震荡而“抑制”（dampen）你的路由通告。它们将忽略你的路由更新，并且在你的状态停止波动之前，它们可能会完全忽略到达你网络的路由。这是\
    \ BGP 机制中必要的一部分；特定路由的突然撤销和插入会导致较小的路由器过载并崩溃。通常认为路由震荡是由电路或硬件问题引起的，而不是有人在重复重置其 BGP\
    \ 会话。BGP 重置可以被看作是计算机领域中“用混凝土块砸脚”的等价行为——除了单脚跳并花几分钟反思自己的行为外，你几乎什么也做不了。路由器认为，即使你第一次这样做有充分的理由，你也足够聪明，不会一直这样做。⁴\n\
    \n话虽如此，你可以使用星号代替 IP 地址来同时清除所有 BGP 会话。上述所有警告对于这种大规模 BGP 重置适用得更加强烈。\n\n如果你的 BGP\
    \ 问题持续存在，请联系表现异常的 ISP，询问是谁在随意更改路由器配置。\n\n### **注意** *监控路由器流量*\n\n> *你如何知道流量在每条电路上的流动情况？虽然你有几种选择，但我强烈建议使用免费工具\
    \ MRTG ([http://www.mrtg.org](http://www.mrtg.org)) 来进行基础的路由器监控。MRTG 会告诉你每条电路的入站和出站流量，并且可以扩展以跟踪路由器的内存和\
    \ CPU 使用时间。我不知道任何人如何在不使用 MRTG 或同类工具的情况下管理路由器。*\n\n### *BGP 负载均衡*\n\n如果你在关注，你可能在之前注意到了关于\
    \ BGP 不是负载均衡协议的强调部分，因此会觉得本节的标题不可思议。BGP 并不执行负载均衡，但你可以使用一些手动技巧来调整互联网电路的使用率。你也可以购买能够为\
    \ BGP 添加负载均衡功能的产品，或通过 DNS 或 NAT 实现伪负载均衡，或者采用其他无关的技巧。然而，在不购买额外设备的情况下，你可以利用 BGP\
    \ 协议自身的机制来进行粗略的负载调整。通过审慎地在接收和提供的路由中添加 AS “跳数”（hops），你可以增加 BGP 算法看到的来自不同网络区域路由的距离。\n\
    \n⁴ 这可能是计算机与人类之间最根本的区别。\n\n在调整路由器的流量流向之前，你必须了解你的电路在长期基础上承载了多少流量。我之前建议使用 MRTG ([http://www.mrtg.org](http://www.mrtg.org))\
    \ 进行流量测量，在这里我建议得更加强烈。如果你在没有设置流量测量工具的情况下阅读本文，也许你还没有射中自己的脚，但你已经上膛并开始盯着你的大脚趾了。\n\n\
    查看每个供应商的流量吞吐量。通常，你的路由器会选择比另一个供应商更频繁地向其中一个供应商传输出站流量。看到一个拥有两条 T1 电路的办公室使用一条电路的频率是另一条的十倍是非常常见的。当一条电路使用\
    \ 1.0Mb/秒时，另一条可能仅使用 0.1Mb/秒。如果你的带宽使用率较低，这没有问题，但如果你更常用的那条电路填满了，你在较少使用的电路上的利用率也仅为\
    \ 0.15Mb/秒。这将使你的网络总利用率约为 1.6Mb/秒，仅略多于可用带宽的一半。更糟糕的是，通过常用电路发送的网络请求返回速度会非常非常慢。同样，如果你的大部分流量通过一条电路到达，你可能会发现一条电路被入站请求堵塞，而你的备用电路却是空的。\n\
    \n如果你去查看路由器中通过慢速电路到达目的地的路由，你会发现它们被发送到那里是因为它们具有最短的 AS 路径。例如，假设你的路由器极度偏好通过一条电路发送流量而轻视另一条。随机选择一个总是通过某个供应商到达的站点并检查其\
