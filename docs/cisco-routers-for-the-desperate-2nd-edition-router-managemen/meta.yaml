    \ FreeBSD 提交者（能够对 FreeBSD 操作系统本身进行更改的人员）之一。\n\n2002年7月，612页，39.95美元 (61.95 加元)\n\
    ISBN 1-886411-74-3\n\n## ABSOLUTE™ OPENBSD\n### 为实用主义偏执狂准备的 UNIX\n\n作者：MICHAEL\
    \ W. LUCAS\n\n这本直接、实用且完整的指南旨在帮助用户掌握强大且复杂的 OpenBSD 操作系统，适合想要将 OpenBSD 纳入其技能库的经验丰富的\
    \ UNIX 用户。作者假设读者具备基础的 UNIX 命令、设计和权限知识。本书将带您深入了解该平台的复杂之处，并教授如何管理您的系统，在全书过程中提供友好的解释、背景信息、故障排除建议和丰富的示例。\n\
    \n2003年7月，528页，39.95美元 (59.95 加元)\nISBN 1-886411-99-9\n\n## HACKING\n### 漏洞利用的艺术\n\
    \n作者：JON ERICKSON\n\n全面介绍被称为“黑客”的漏洞利用技术和创造性问题解决方法。解释了黑客行为的技术层面，例如基于栈的溢出、基于堆的溢出、字符串漏洞利用、return-into-libc、shellcode\
    \ 以及针对 802.11b 的加密攻击。\n\n> “具有开创意义的黑客手册。” — SecurityForums.com\n\n2003年11月，264页，39.95美元\
    \ (59.95 加元)\nISBN 1-59327-007-0\n\n## THE LINUX ENTERPRISE CLUSTER\n### 使用通用硬件和自由软件构建高可用集群\n\
    \n作者：KARL KOPPER\n\n《Linux 企业集群》解释了如何将若干台资源有限的廉价计算机放置在普通计算机网络中，并安装自由软件，使这些计算机像一台强大的服务器一样协同工作。本书包含如何使用\
    \ Heartbeat 软件包构建高可用服务器对、如何使用 Linux Virtual Server 负载均衡软件、如何在 Linux 集群环境中配置可靠的打印系统，以及如何在\
    \ Linux 中构建一个没有单点故障的任务调度系统。\n\n2005年1月，456页，49.95美元 (69.95 加元) 附 CD\nISBN 1-59327-036-4\n\
