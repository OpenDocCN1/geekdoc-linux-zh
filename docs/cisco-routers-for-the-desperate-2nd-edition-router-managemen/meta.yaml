    ```


    With this route in place, you should be able to ping any host on the public Internet.


    Some ISPs will have special configuration requirements for their circuits, which
    they should be able to give you and then walk you through configuring your circuit.
    If you are bringing up a big circuit such as a DS3 or OC-48, you''ll need a slightly
    more advanced setup. However, these settings will be dictated by the ones chosen
    by your ISP, so ask them. ISP technicians are usually happy to answer these sorts
    of questions, as setting things correctly in the beginning will prevent problems
    later.


    That''s not that hard, is it? Building a private connection isn''t much more difficult.


