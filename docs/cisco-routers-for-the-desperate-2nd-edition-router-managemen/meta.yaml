    many of these problems. In the worst case, you can at least be well armed with
    diagnostic information when you call your ISP.


    ### Router Crashes


    For the most part, Cisco routers keep working. On rare occasions, an untouched
    router will intermittently reboot itself, or just shut itself off when it feels
    like it. In these situations, a SmartNet contract is invaluable—Cisco devices
    are mostly black boxes, and if something goes wrong with one, the warranty may
    be your only recourse. Still, there are a few things you can do to try to resolve
    the problem without a service contract.


