    -out appended. The final word in the route-map configuration,  out, indicates
    that this route map is only applied to outbound traffic.


    Repeat this process for your second peer, identifying it by its unique IP address.
    Give this peer a unique route map name, such as ispB-out. When you have configured
    all your peers, ^Z out of configuration mode.


    # Route Maps


    Our BGP configuration references route maps, but they don''t exist yet. Go into
    plain configure mode, not a "BGP 100" session.


    ```

    router(config)# route-map ispA-out permit 10

    router(config-route)# match ip address 130

    ```


    First create the route map  named in the BGP rule and declare it is a  permit
    rule, which means that it describes traffic allowed to pass. Although each route
    map can have several  numbered instances, BGP we only needs one instance of the
    route map—but the number is still required.


    Then define the traffic that this rule affects. We want this rule to apply to
    traffic that  matches a particular評估 IP address—in this case, the IP addresses
    defined in  access list 130. We set up access list 130 when configuring address
    announcements. Do not attempt to put actual IP addresses here; it just won''t
    work.


    The combination of BGP route mapping and access list means that IP addresses that
    match 192.168.0.0/23 are permitted to be passed over the BGP session—in other
    words, BGP is allowed to announce those routes. This certainly seems obtuse if
    you''re not familiar with route mapping and access lists, but simply filling in
    the correct IP addresses and ASN numbers will give you a working BGP setup.'
  - "[PAGE 98]\n\n# A Complete BGP Configuration\n\nWhen you're finished, your BGP\
    \ configuration should look like the sample below. If any piece of this configuration\
    \ is missing, BGP will not work. The most common problem in configuring BGP is\
    \ forgetting one step of the configuration process. Compare a troublesome router\
    \ configuration to the sample here, and add anything that's missing.\n\n```\n\
    router bgp 100①\n bgp dampening\n network 192.168.0.0 mask 255.255.254.0②\n redistribute\
    \ static③\n neighbor 10.1.8.5 remote-as 200④\n neighbor 10.1.8.5 route-map ispA-out\
    \ out\n neighbor 172.16.0.2 remote-as 300⑤\n neighbor 172.16.0.2 route-map ispB-out\
    \ out\nip route 192.168.0.0 255.255.254.0 Null0⑥\naccess-list 130 permit ip host\
    \ 192.168.0.0 host 255.255.254.0⑦\nroute-map ispA-out⑧\n match ip address 130\n\
    route-map ispB-out⑨\n match ip address 130\n```\n\nWe start with the ① global\
    \ configuration for BGP, including flap dampening. Then we have the ② routes the\
    \ router will announce, and we indicate that they're reachable via ③ static routes.\
    \ The router knows the IP address of two peers, ④ ISP A and ⑤ ISP B, and it has\
    \ route maps for each.\n\nOutside the BGP configuration, we have a ⑥ static route\
    \ for the block we wish to announce, and a matching ⑦ access list so that we can\
    \ allow BGP sessions to announce this block.\n\nFinally, we have route maps for\
    \ both ⑧ ISP A and ⑨ ISP B, so that we can attach the access list to the BGP session.\
    \ While the route maps are initially identical, they soon may not be, so they\
    \ should be separate.\n\n# Managing BGP\n\nView BGP activity with the show ip\
    \ bgp commands. A plain show ip bgp will display every route your router knows\
    \ about via BGP, which is hundreds of thousands of lines of output. Most people\
    \ consider this less than useful. Assorted subcommands break this down into palatable\
    \ chunks, the most commonly used of which is sho ip bgp summary. The BGP summary\
    \ is a nice snapshot of the"
  - '[PAGE 99]


    router''s BGP information, including memory usage, routes available, flapping
    routes, and so on, and ends with a very useful line for each BGP peer.


    ```

    router# sho ip b s

    BGP router identifier 10.1.8.6, local AS number 100

    ...

    Neighbor     V    AS MsgRcvd MsgSent   TblVer  InQ OutQ Up/Down  State/PfxRcd

    10.1.8.5     4   200 1486094   19609   155050   0    0   1w6d      132868

    172.16.0.2   4   300  510754   19621   155050   0    0   1w1d      115598

    router#

    ```


    By far, the most interesting columns are **Neighbor** and **AS**, which allow
    you to identify a peer by either ① IP address or ② ASN. The ③ **InQ** and **OutQ**
    columns show how many messages from or to that peer remain to be processed, respectively.
    ④ **Up/Down** shows how long the current BGP session has been established. Finally,
    during normal operation, the ⑤ **State/PfxRcd** column shows the number of route
    announcements that your router has received from that peer. If the BGP session
    has just been started or is having problems, this entry will display a word describing
    the state of the BGP session. An `Active` session has just been started, and your
    router is waiting for the other router to begin communication. An `OpenSent` or
    `OpenConfirm` status indicates that your router is negotiating with the peer to
    establish a connection. The `Established` state means that the routers are now
    exchanging routing information.


    The remaining columns are less useful in day-to-day work, but might be important
    when troubleshooting. The ⑥ **MsgRcvd** and **MsgSent** columns tell you how often
    you have received and transmitted BGP messages. ⑦ **TblVer** gives the latest
    version of the BGP table that you''ve transmitted to your peers. Most of the time,
    you will only need these when you''re on the phone with Cisco support.


    # *Viewing Routes*


    The most frequently asked question when running BGP is, "Which circuit are we
    using to reach such-and-such website?"³ That''s simple with the `show ip route`
    command, specifying the IP address you''re interested in.


    > ³ Actually, the most frequently asked question seems to be, "What do you mean,
    BGP doesn''t load balance?" This is merely the most frequently asked *useful*
    question.'
- md: "router# sho ip route 10.3.5.8\nRouting entry for 10.3.0.0/16, supernet\n  Known\
