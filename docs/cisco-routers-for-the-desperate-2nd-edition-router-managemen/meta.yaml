    That''s not that hard, is it? Building a private connection isn''t much more difficult.


    # Private Connections


    Another popular use for routers is connecting two offices together with a private
    T1, using a virtual private network (VPN). While VPNs are increasing in popularity,
    they cannot provide the broad, dedicated interoffice bandwidth that many companies
    require. A VPN adds additional overhead to the traffic between offices and also
    increases the circuit utilization. If you''re editing a document on a workstation
    on one side of the VPN, and someone else in the office starts downloading an ISO
    image from the Internet, your access to the document server may slow to the point
    of being unbearable. A dedicated connection, on the other hand, doesn''t fight
    for the same resources as your Internet connection.


    Figure 4-1 shows a typical private T1 setup at most companies. In most cases,
    this consists of a T1 at the main office and T1s radiating from the main office
    to the branch offices. (Of course, the main office usually also has the firewalls,
    mail servers, and other paraphernalia required to keep a company on the Internet,
    but we''ll ignore this clutter for our purposes and concentrate on just the Cisco
    routers.) Headquarters will also typically have a second router for branch-office'
  merge: -1
  pgno: 50
- img_proc: true
  md: 'connections, with the branch office network behind it and a router at each
    branch office that handles the T1 to headquarters.


    ![](img/b76c804cf499c7eeda3929279b928b62_51_0.png)


    *Figure 4-1: A typical private T1 setup


    All Internet access is handled by the external Internet router. The headquarters
    network supports the staff at the main office. To support the private T1 connection
    to the remote office we have two routers, one at the HQ office and one at the
    remote office. Finally, at the remote office we have the remote office network
    to support those users.


    This setup has several advantages. First, all user and system administration is
    handled by staff on the HQ network, while users at the remote office can access
    all network services at the main office far more quickly than they could over
    a VPN. Second, with proper software running on the remote office''s desktop computers,
    such as VNC¹ or Windows Terminal Services, the main office can perform all support
    as well, and the remote office can piggyback on the main office''s Internet access.


    The only catch is that someone has to configure all of this. The good news is
    that it won''t be too tough to get this all up and running with what you know
    already. Once you have management buy-in to the idea, here''s a basic overview
    of what you''ll need to do to set up a private network:


    +   1. Choose equipment for both ends.

    2. Order circuits and equipment.

    3. Configure the routers.

    4. Install the routers and circuits.


    We''ll discuss each step in turn.


    > ¹ VNC, or Virtual Network Computing, is a really nifty cross-platform system
    for remote GUI-based computer administration. And it''s free. If you support older
    versions of Windows that don''t have Terminal Services, or if you have a variety
    of platforms and want to standardize on a single management tool, investigate
    VNC.'
  merge: -1
  pgno: 51
- img_proc: true
  md: '# Choosing Equipment


    Perhaps the biggest up-front expense is purchasing the router. Your ISP might
    have a recommended model, and you should let yourself by guided by their experience.
    If you need to choose a router, Cisco makes a wide variety of small T1 office
    routers, and even their smallest T1-capable router will probably be more than
    sufficient for your needs.


    If you have multiple branch offices and are considering implementing private T1s
    between offices, a larger, multi-interface router for headquarters might tempt
    you, but I still recommend purchasing the smallest router available with enough
    interfaces. I won’t recommend any particular model here, because by the time this
    book is actually printed, it will have changed. Whatever you buy, be sure to get
    SmartNet support with the model you choose, and be certain to remind your financial
    people that the support must be renewed every year. Support will quickly become
    indispensable once you install that private circuit, and the business cost of
    an extra hour of downtime will far exceed the cost of the support contract.


    > NOTE You can always pick up a used router on eBay (http://www.ebay.com) and
    at other used equipment sites. But before you purchase, check Cisco’s website
    to be sure that the model you’re considering is still supported. It’s easy to
    get an old Cisco 2500 router that can support a T1, but you will be completely
    on your own if it breaks! Also, Cisco will frequently require that you purchase
    an additional software agreement for this used equipment, even if it’s still under
    warranty. Their view is that while a customer can resell the hardware, they do
    not have the right to resell the software that runs on it. While many people consider
    this ridiculous, Cisco takes their claims very seriously, and because they’re
    the only people who can provide support for your equipment, you should take them
    seriously as well.


    # Ordering Circuits


    After you’ve got your equipment, you need to order a circuit, which can be intimidating
    if you haven’t provisioned one before. Unless you can pick up a roll of wire and
    string it through trees, along fences, and over the freeways all the way to your
    remote office, you’ll have to deal with a telephone company. If you are one of
    the few with this expertise, you’ll agree that it’s almost always a better idea
    to order through the'
  merge: -1
  pgno: 52
- img_proc: true
  md: 'telco anyway. (Much like ISPs, T1 circuit providers vary widely from area to
    area. Consult with your local user groups and other network administrators to
    see who delivers good service in your area.)


    When ordering your circuit, remember that most private circuits are priced per
    mile, which means that it will be much less expensive to connect offices 20 miles
    apart than it will be to connect offices 200 miles apart! Note also that private
    circuits are not suitable for distances of more than a few hundred miles.


    > **NOTE** For longer distances, you should probably use a less expensive technology,
    like frame relay. While we won''t cover frame relay configuration in this book,
    * Cisco''s frame-relay documentation should suffice to get you up and running.


    # Who Installs the Circuit?


    Many people do not realize that the circuit you will end up with will probably
    be installed by a single company, regardless of who you purchase it through: generally
    a Regional Bell Operating Company (RBOC) or its descendant. For example, in much
    of my area of the United States (the Midwest), all circuits are delivered to the
    customer by SBC. If I order a circuit through a different company, an SBC technician
    will show up at my office to install it. Even though you purchase your circuit
    from a vendor other than your RBOC, that vendor must turn around and purchase
    the installation from the RBOC.


    Because the level of service that the RBOC provides to independent telcos is regulated
    by the federal government, many independent telcos can provide better service
    than you will get by dealing directly with the RBOC. The downside to this system
    is that if the circuit breaks, you generally have to call your vendor to get them
    to call the RBOC to get the circuit fixed. This creates additional distance between
    you and anyone who can actually fix the problem, and can be quite frustrating
    during a crisis. On the other hand, a third-party vendor can frequently leverage
    these regulations to get a circuit delivered more quickly than you could get it
    if you placed the order directly with the RBOC.


    When you finally call to place your order, all you''ll need is a landline phone
    number at each of the two locations. The phone company knows exactly where these
    phones are and will be able to give you a quote on a circuit between those locations.'
  merge: -1
  pgno: 53
- img_proc: true
  md: '# Data or Voice Circuit?


    Most telcos today are very well acquainted with private data circuits—in fact,
    some salespeople have never sold anything but data circuits! Telcos provide a
    whole variety of circuits, however, so be certain to specify that you want a data
    circuit when ordering. While a voice circuit might work for a modem, it certainly
    won''t work as a dedicated data circuit.


    When the purchase order arrives, confirm that you''re getting a data circuit (most
    are encoded as “B8ZS”). If your order form does not specify a data circuit or
    state that it has B8ZS encoding, review the paperwork with your salesperson. If
    your paperwork states that the circuit has “AMI” encoding, it''s flat-out wrong,
    and you need to have a pointed conversation with your telco representative.


    In most parts of the United States, delivery time for a T1 circuit will be two
    to four weeks (or as specified on your completed order form). Be certain to get
    a real delivery date from your vendor, however; if the RBOC has to dig a trench
    across the road to deliver your T1, it will take a little longer.


    > NOTE: If you''re not in the United States, you''ll want to investigate your
    country''s telephone system before attempting to place an order. Much as if you
    were shopping for an ISP, talk to other network administrators to see what sort
    of service your different possible vendors offer. In many countries with a telco
    monopoly, service is slow at best. Plan ahead.


    # Private Circuit Configuration


    While your circuit is on order, you can preconfigure your router. Configuring
    a Cisco router for a private connection is almost exactly the same as configuring
    it for an ISP connection. As long as the configuration of the router on each end
    is consistent, there''s really very little you can do to mess it up. In most situations,
    the hardest part of the configuration process is choosing the IP addresses for
    your circuit.


    # Private Circuit IP Addresses


    You''ll need IP addresses for both ends of your T1 circuit and for at least one
    Ethernet interface on each router. To number the Ethernet interface, just pick
    an IP address on the local LAN. Every device in the remote office will use the
    IP address of the remote office router''s Ethernet as the default gateway. At
    headquarters, the IP address of the router connecting the remote office is also
    the route to the remote office.'
  merge: -1
  pgno: 54
- img_proc: true
  md: 'While private circuits don''t strictly require IP addresses (you could always
    use "unnumbered" interfaces), troubleshooting is much simpler when each side of
    the circuit has an IP, because then you can ping either side of a circuit and
    get a response that you know is from the circuit interface. Numbering IP addresses
    also makes it much easier to sort out your interfaces when performing network
    monitoring. I strongly recommend numbering interfaces whenever possible—and it''s
    almost always possible.


    # ## Reserved Addresses


    Several blocks of IP addresses are reserved for use on private networks. If you''re
    using NAT (Network Address Translation), chances are good that you''re already
    familiar with them. The address blocks are:


    +   - 10.0.0.0 through 10.255.255.255

    - 172.16.0.0 through 172.31.255.255

    - 192.168.0.0 through 192.168.255.255


    If your internal network falls into any of these ranges, you''re already using
    private IP addresses. If not, you can use any of these blocks to number your private
    network interfaces. (You could also use actual IP addresses assigned to your company
    to make those private circuits accessible to the outside world, but that''s usually
    neither necessary nor desirable.)


    # ## Subnetting


    Each circuit requires two IP addresses in a legitimate subnet. Remember, in any
    block of IP addresses, the highest and lowest addresses are not usable,⁽²⁾ so
    we need a network of four IP addresses.


    > > **NOTE**

    >

    > If you''re not familiar with netmasks other than 255.255.255.0, or if you''ve
    never seen subnets labeled with suffixes such as /30, be sure to read the appendix
    for a full explanation before continuing. You must understand subnetting before
    you can properly assign addresses or perform advanced routing.


    Each usable subnet of four IP addresses has a first number evenly divisible by
    4. For example, 10.0.3.0 through 10.0.3.3 is a usable block (0 is evenly divisible
    by 4), as is 10.0.3.28 through


    ⁽²⁾ On those rare occasions when you have both time and a network to kill, assign
    a system (on an average 255.255.255.0-netmask LAN) an IP address ending in .0
    or .255 and see what happens. Something will break, but you might not figure out
    what it was for some time.'
  merge: -1
  pgno: 55
- img_proc: true
  md: '10.10.0.3.31 (28 is also evenly divisible by 4). However, 10.0.3.207 through
    10.0.3.210 is not usable because 207 is not evenly divisible by 4.


    Because some (increasingly rare) network devices have trouble with the first and
    last subnet in a block, I recommend starting with the fifth through eighth addresses
    in a block and working up. Because we''re beginning our count from 0, this would
    be .4 through .7. (If any of this confuses you, even a little bit, go read the
    appendix.)


    So, if you''re using 10.0.1.0/255.255.255.0 as your headquarters LAN IP addresses,
    and 10.0.2.0/255.255.255.0 as your remote office IP addresses, you might decide
    to carve up 10.0.3.0 for router interfaces. In this example, we''ll use the addresses
    10.0.3.4 through 10.0.3.7. However, because 10.0.3.4 and 10.0.3.7 are not usable
    (because they are the first and last IP addresses in the block), we''ll assign
    10.0.3.5 to the headquarters side of our circuit and 10.0.3.6 to the remote office.


    With this information, you can configure both routers. On your main office router,
    enter configure mode and give the interface its IP address. Here, we configure
    the interface "serial1" with the IP address 10.0.3.5 and assign it the proper
    netmask for a block of four IPs. This should look exceedingly familiar from our
    recent adventures configuring Internet T1s.


    ```

    router#conf t

    router(config)#int s1

    router(config-if)#ip address 10.0.3.5 255.255.255.252

    ```


    Now exit configure mode and save your work. Your interface should simply come
    up when you plug in the circuit (especially if your routers are identical models
    running the same version of the IOS).


    If the circuit doesn''t come up, do a sho int on both routers and compare the
    configurations. The interfaces should have identical setups; if they don''t, make
    them match by changing the configuration (as discussed in Chapter 3).


    The most common misconfiguration between peer routers is the default line encapsulation:
    make sure that they''re both set to either PPP or HDLC. (HDLC is generally preferable
    on broadband circuits.) A mismatch of default encapsulation is especially likely
    if you are using different router models.


    When you have your serial lines up, configure an IP address on your Ethernet interface.
    These are configured exactly as they'
  merge: -1
  pgno: 56
- img_proc: true
  md: 'would be for a standard Internet connection; just assign an IP address and
    a netmask, and they should come right up.


    # Routing Configuration


    Now that you have a circuit set up between offices, it’s time to figure out how
    to guide traffic to its destination. Remember that each desktop machine at headquarters
    has a default route telling it to send all traffic to the main (external) router,
    so if that router cannot send traffic to the remote office, all this is for nothing.
    The purpose of *routing* is to tell routers where to send packets that belong
    to particular networks of IP addresses.


    You can fire up RIP or some other dynamic routing protocol to guide your traffic
    around the network, but doing so has a lot of disadvantages. Dynamic protocols
    break, increase non-useful network traffic, and may pose security risks.


    # Static Routing


    On a simple network, it’s much better to simply attach static routes to various
    sections of the network and have all traffic flow in a deterministic manner. In
    the long run, this method is much more maintainable and causes fewer problems
    on a network like this. (If you have several internal circuits with multiple routes
    between different locations, consider using a dynamic routing protocol.³)


    The syntax for a static route statement is:


    ```

    router(config)#ip route ❶destination-ip-network ❷netmask ❸gateway

    ```


    The ❶ destination IP address is the first IP in the network block. The ❷ netmask
    is the netmask of the destination netblock. (Remember, when you route, you route
    entire blocks of addresses, not individual IPs.)


    Finally, the ❸ gateway is an IP address that is the next hop where packets for
    this block should be sent. This gateway should be an IP address that the router
    knows how to reach but is not on the router itself. On most routers, this will
    be the IP address on the far side of a serial link. For example, if we wanted
    to provide a static route to the IP address block 100.100.50.0, netmask 255.255.254.0,
    through the gateway of 10.0.3.5, we would use the following command.


    ```

    router(config)#ip route 100.100.50.0 255.255.254.0 10.0.3.5

    ```


    > ³ Even in this case, I can''t recommend any sort of RIP. Investigate OSPF instead.'
  merge: -1
  pgno: 57
- img_proc: true
  md: '> NOTE One thing to remember about routing (on almost any system, not just
    Cisco) is that the most specific route for a particular IP address is taken. For
    example, almost every router has a "default route" where it sends packets bound
    for another network. If you have a more specific route for certain IP addresses,
    that more specific route will be taken instead of the default. We''ll see some
    examples of this later.


    As you saw in Figure 4-1, all traffic on the remote office LAN is either local
    or routed through the T1 to headquarters. In the main office, all traffic that
    is not destined specifically for the remote office is either local or goes to
    the exterior router. This design is simple and doesn''t resort to error-prone
    dynamic routing protocols.


    # Remote Office Routing


    In this scenario, every host on the remote office network needs a default route
    that points to the IP address of the remote office router''s Ethernet interface.
    This is best done on the DHCP server. The router then needs to know to send outbound
    traffic to the far side of the serial line.


    Because all traffic on the remote office LAN needs to go to the headquarters router,
    you only need a single route statement.


    ```

    router#conf t

    router(config)#ip route ❶0.0.0.0 ❷0.0.0.0 ❸10.0.3.5

    ```


    The ❶ first 0.0.0.0 is our destination IP address, and the ❷ second 0.0.0.0 is
    the netmask. This combination means "every IP address in the world." The router
    knows that the IP addresses in the 10.0.2.0 network block are attached to a local
    interface, so it will not send those packets across the WAN. Lastly, the ❸ gateway
    IP address is the IP address of the headquarters side of the T1 (in this case).


    # Headquarters Routing


    Our headquarters'' private T1 router has a slightly more complicated configuration.
    It must know that traffic bound for the remote office must be sent across the
    private T1, but all other traffic should go to the exterior router''s Ethernet
    interface at 10.0.1.1.


    ```

    router(config)# ip route ❶10.0.2.0 255.255.255.0 ❷10.0.3.6

    router(config)# ip route ❸0.0.0.0 0.0.0.0 ❹10.0.1.1

    ```'
  merge: -1
  pgno: 58
- img_proc: true
  md: 'In this configuration, we first send the ① specific network block used in the
    remote office to the ② far side of the private T1. Then we add the ③ default route
    to send all other traffic to the exterior router''s Ethernet interface. (In practice,
    you can add these routes in either order and the router will put them in the order
    it prefers.) The route for the 10.0.2.0 network block is more specific than the
    default route, so that route is preferred over the default route for those IP
    addresses.


    The  external router should already have a default route pointing to the outside
    world, but it must know where to send traffic for both the remote office *and*
    for the serial link addresses.


    ```

    router(config)# ip route ①10.0.2.0 255.255.255.0 ②10.0.1.2

    router(config)# ip route ③10.0.3.4 ④255.255.255.252 ⑤10.0.1.2

    ```


    Just like on our private T1 router at headquarters, we route the ① 10.0.2.0 block
    further into the network—but this time, to the ② IP address of the private line
    router''s Ethernet interface. We then route the ③ IP addresses used on the private
    T1 to the ⑤ same Ethernet interface.


    **NOTE** *We specify ④ the netmask for the private line''s IP addresses; if you
    add another private circuit to a second field office, you''ll want to route the
    IPs for that circuit to its router separately.*


    # *Plugging It All Together*


    After the router is configured, you wouldn''t think that actually plugging everything
    together would be a problem, would you? It will probably work just fine, but let''s
    go through what you can do when things go wrong.


    First, make sure that you use a good-quality Cat 5 cable to connect your CSU/DSU
    or router to the smartjack. You can get away with the cheap stuff on the secretary''s
    Ethernet connection, but telco circuits are sensitive. Use a cable of the correct
    length; don''t coil up the surplus and leave it dangling from the wall, and don''t
    stretch it taut like a tripwire. Cable quality is responsible for a fair number
    of problems.


    In theory, after the circuit is plugged into your preconfigured router, you should
    be able to activate the routers at each end, and the circuit should just come
    up. At this point, log in to the routers and make sure that your serial line has
    a status of'
  merge: -1
  pgno: 59
- img_proc: true
  md: '“up” and a line protocol of “up.” If the line is up, but the protocol is down,
    double-check your line encapsulation and then the rest of your configuration.


    If you’ve confirmed that the interfaces are correctly configured, but the line
    still doesn’t come up, phone the company that sold you the circuit and have them
    test it. If the telco can successfully and cleanly loop up the CSU/DSU at both
    ends, and your configuration is correct, your hardware is bad. Contact Cisco and
    get the help you need; new parts can be on site in as little as four hours.


    Now that your circuit is up, it should stay that way. But let’s look at what happens
    when it doesn’t.'
  merge: -1
  pgno: 60
- img_proc: true
  md: '# # 5


    # ## TROUBLESHOOTING ROUTERS


    ![](img/b76c804cf499c7eeda3929279b928b62_61_0.png)


    Now that you have a basic understanding of how the router is configured and how
    the various network types work, let’s consider the most common day-to-day router
    problems. These can be boiled down into two groups:


    +   - Router crashes

    - Network failure or slowness


    By following a few straightforward steps, you’ll have a reasonable chance of fixing
    many of these problems. In the worst case, you can at least be well armed with
    diagnostic information when you call your ISP.'
  merge: -1
  pgno: 61
- img_proc: true
  md: '# # Router Crashes


    For the most part, Cisco routers keep working. On rare occasions, an untouched
    router will intermittently reboot itself, or just shut itself off when it feels
    like it. In these situations, a SmartNet contract is invaluable—Cisco devices
    are mostly black boxes, and if something goes wrong with one, the warranty may
    be your only recourse. Still, there are a few things you can do to try to resolve
    the problem without a service contract.


    A crashing router will often print errors to the serial console. Attach the serial
    console to the router and leave it there. Any crash messages will remain in the
    serial terminal''s message buffer. Copy the messages exactly, and search on them
    in Google or http://www.cisco.com; you may well identify the problem. Cisco''s
    technical support will certainly want to know what these messages say.


    If you cannot discover the problem through the crash messages, check the hardware
    itself; perhaps something''s come loose inside the router. Open the case and remove
    any dust that has worked its way in, preferably with compressed air. Reseat every
    removable component, such as memory or flash cards, as well as add-on modules
    such as Cisco WIC cards and port adapters. When you are certain that everything
    is tightly attached, replace the router in the rack and turn it on. If you''re
    lucky, it will work.


    > **NOTE** Cisco offers articles on how to diagnose router crashes for various
    models; some articles are accessible without a SmartNet contract. It''s always
    worth searching http://www.cisco.com for help.


    If your router still crashes, you have no choice but to contact Cisco. (Well,
    all right, you could choose to live with the problem. A few moments of lost connectivity
    isn''t the worst thing that could happen to a company, but it could hurt your
    job and definitely interfere with your Internet radio listening.) If you don''t
    have a SmartNet contract, Cisco''s technical support will happily transfer you
    to the sales department or direct you to a reseller.


    # # Network Failure


    Network failure is by far the most common router problem, even though, technically,
    the router itself hasn''t failed—the circuit has. Backhoes digging in the wrong
    spot cause any number of circuit outages (and you''ll never fix those yourself).'
  merge: -1
  pgno: 62
- img_proc: true
  md: 'Before you blame the telco or ISP, however, you can do several things to rule
    out problems on your end and maybe even quickly fix the problem without outside
    help.


    Most network administrators are fairly skilled at troubleshooting Ethernet problems.
    Is there a link light? Did the duplex setting change? Is the switch port bad,
    or did someone trip on the cable and break the little plastic thingamajig on the
    end? The time-honored magic of replacing cables and switching ports solves most
    Ethernet problems. Internet circuit failures, on the other hand, are far more
    difficult to troubleshoot, as you only have a small window into the circuit, and
    most of it is handled by the ISP or telco.


    As with all troubleshooting, the first question to ask yourself is, "Did *I* change
    anything?" If you made a change and the network went away, try undoing that change
    to see if the network returns. If that doesn''t work, log in to the router and
    look at the interface of the failed network connection.


    # Initial Circuit Tests


    A phone call from a user screaming, "The Internet is down!" deserves a closer
    look. But remember, for many users, the Internet is Internet Explorer, or even
    just Yahoo! (if you''re my publisher''s mother). I recall one user who insisted
    the Internet was broken whenever an email took more than five minutes to arrive.
    Because the email system was badly overloaded, this happened at least three times
    a week.


    If you think that you have an Internet failure, check a variety of network services
    first. A failure in a nameserver, firewall, proxy server, switch, or other device
    can appear to be a complete Internet failure to users who depend upon it. The
    two most helpful diagnostic tests you can perform to determine the extent of an
    actual Internet circuit outage are ping and traceroute.


    # Ping


    When you ping, you simply send a request to another Internet node asking, "Are
    you there?" If the remote node receives the request and is not configured to ignore
    it, it should send a response. A successful ping means that you have basic network
    connectivity to that node.


    When network problems are wide enough that you suspect an Internet circuit failure,
    your first attempt at resolution should be to log in to your router and try to
    ping across your'
  merge: -1
  pgno: 63
- img_proc: true
  md: 'Internet circuit. You may have a domain name for this circuit, but use the
    IP address, because actual Internet problems also mean DNS problems. Chances are
    good that the far side of your circuit is the default route on your router. In
    the following example, the remote side of our serial line has an IP address of
    192.168.88.65. Log in to your router and give the ping command and the target
    IP address.¹


    ```

    router# ping 192.168.88.65

    Type escape sequence to abort.

    Sending 5, 100-byte ICMP Echos to 192.168.88.65, timeout is 2 seconds:

    ❶!!!!!

    Success rate is ❷100 percent (5/5), round-trip ❸min/avg/max = 4/4/4 ms

    router#

    ```


    The router sends five packets to the destination IP address and gives each two
    seconds to return. This is generally more than long enough to ping anything that
    isn''t over a satellite link. Each ❶ exclamation point indicates a packet that
    returns, while a period shows a packet that has vanished. Finally, we see the
    ❷ success percentages and ❸ some statistics on packet speed, in milliseconds.
    The circuit shown here is certainly up.

    On the other hand, a result like the following indicates your local circuit is
    down.


    ```

    Sending 5, 100-byte ICMP Echos to 192.168.88.65, timeout is 2 seconds:

    ❶.....

    Success rate is ❷0 percent (0/5)

    ```


    A ❶ period is a dropped packet. Five periods indicate ❷ total circuit failure.
    Start troubleshooting your circuit!

    However, going back to the first ping example, just because your circuit is up
    doesn''t mean that you''re on the Internet. Perhaps your ISP had a failure, or
    some major backbone had a run-in with that rogue backhoe. Your next step is to
    attempt to reach a popular Internet site such as Yahoo! from your router. If your
    circuit is passing traffic, but you cannot ping such popular and highly available
    sites such as Yahoo! or CNN.com, you may have a failure between your network and
    the main Internet. That''s when you use traceroute.


    > ¹ It''s also possible to try to ping from your desktop computer, but in this
    case, you''re not just testing the router''s circuit; you''re testing your desktop''s
    connection to the network, any intervening firewalls, and whatever other network
    equipment lies between your computer and the far side of the circuit. To isolate
    problems, test only one small piece at a time.'
  merge: -1
  pgno: 64
- img_proc: true
  md: "# Traceroute\n\nThe traceroute command sends packets to a remote Internet node\
    \ and returns the IP address of every node it passes through on the way. Remember\
    \ that to reach a remote site, your traffic probably travels through your router,\
    \ your ISP's router, across several backbone routers, through the destination\
    \ site's ISP's router, and through the destination site's router before reaching\
    \ the actual target server. If any of these are broken, your request fails.\n\n\
    To use traceroute, just log in to the router and enter the command traceroute\
    \ and the IP address or hostname you're attempting to reach.\n\n```\nrouter#traceroute\
    \ www.blackhelicopters.org\nTranslating \"www.blackhelicopters.org\"...domain\
    \ server [OK]\n\nType escape sequence to abort.\nTracing the route to bewilderbeast.blackhelicopters.org\
    \ (198.22.63.43)\n\n 1 192.150.247.53 [AS 26096] 4 msec 4 msec 0 msec\n 2 192.150.247.38\
    \ [AS 26096] 4 msec 8 msec 8 msec\n 3 bewilderbeast.blackhelicopters.org (198.22.63.43)\
    \ [AS 26096] 12 msec 8 msec 8 msec\nrouter#\n```\n\nUpon leaving our current router,\
    \ traffic to the server goes through the router with the IP address of ❶ 192.150.247.53.\
    \ If this machine had a reverse DNS entry, a hostname would be displayed instead.\
    \ Of three packets, ❸ two return in four milliseconds, and one returns in zero\
    \ milliseconds. (This doesn't mean zero time; it just means a smaller time than\
    \ your router can measure.) This router belongs to the ❷ autonomous system 26096\
    \ (see Chapter 7). The ❹ second router is crossed very quickly. On our ❺ third\
    \ hop, we reach a machine with the reverse DNS of \"bewilderbeast.blackhelicopters.org,\"\
    \ which is where the traceroute ends. Presumably, the IP address of www.blackhelicopters.org\
    \ is on this machine.\n\n+   - When a packet is dropped, you will see an asterisk\
    \ instead of a timestamp.\n\n+   - If a traceroute ends in a !H, that means that\
    \ the last node in the traceroute doesn't know how to reach the destination. This\
    \ is almost certainly a routing issue."
