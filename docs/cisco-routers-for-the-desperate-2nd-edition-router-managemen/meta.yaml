    # Examining the Circuit


    The first line of the *sho int* output for an interface describes the basic state
    of the interface, as discussed in Chapter 3. If the line is up, the router is
    seeing a reasonable signal from the T1. If the line is down, the router is not
    seeing a signal over the T1. While you still need to check for other errors on
    the interface, not seeing a signal is a pretty solid sign that something is seriously
    wrong.


    If the circuit is up but the protocol is down, the router cannot understand the
    signals coming over the T1. If this is a brand-new circuit, it is probably misconfigured,
    but in mature circuits this may mean line noise or damage. (It can also mean that
    someone else somewhere along the circuit touched things, but no ISP or telco would
    even *dream* of doing that, not even if some underpaid and overworked tech thought
    you wouldn''t notice if he just tweaked one setting while nobody was looking.)


    Although you''ll want to check the rest of the information available on this interface,
    there are things you can try first.'
- md: "## Resetting the Interface\n\nFirst, if some network device along the circuit\
    \ is confused, resetting the interface may kick that device back to its senses.\n\
    \n```\nrouter#conf t\nrouter(config)#int s1/0\nrouter(config-int)#shut\n```\n\n\
    Count to ten slowly, and then reopen the interface.\n\n```\nrouter(config-int)#no\
    \ shut\nrouter(config-int)#^Z\nrouter#\n```\n\nIf your circuit is back up, congratulations!\
    \ If not, the next step is to reboot the router.\n\n## Rebooting the Router\n\n\
    While pulling the power cord out of the back, counting to ten, and plugging it\
    \ back in will do the trick, as long as you're logged in you might as well restart\
    \ the router in a slightly more graceful manner.\n\n```\nrouter# reload\n```\n\
    \nThe router will prompt you for confirmation and then restart itself. If your\
    \ router has a separate CSU/DSU, power cycle it simultaneously.\n\n## Nothing\
    \ Worked!\n\nIf neither of these works, you will have to phone your ISP or telco.\
    \ You can make this call in one of two ways: either armed with lots of information\
    \ so you can resolve the problem as quickly as possible, or in a hysterical panic.\
    \ If you prefer the hysterical panic technique, make that call now. If not, arm\
    \ yourself with all the information your router has to offer before calling. No\
    \ matter how good your ISP's customer service department is, failure of your network\
    \ is more important to *you* than it is to the person answering the phone. After\
    \ all, that support tech still has *his* email!\n\nWhen you make that call, however,\
    \ you will sound much more impressive and serious if you can say, \"Our circuit\
    \ protocol has failed, and we are receiving hundreds of CRC errors a second,\"\
    \ than if you say, \"Uh, our circuit isn't working.\" Your router provides you\
    \ with a wide range of debugging information, if you know how to read it.\n\n\
    ## Interface Debugging Information\n\nEach router interface provides a full description\
    \ of the work it is performing, the errors it sees, and what actions it is taking.\
    \ While we won't cover every scrap of information your router offers, you should\
    \ understand some of the basics when you have to troubleshoot. Here's the output\
    \ from a `sho int` on a standard Cisco T1 interface. Your output might look slightly\
    \ different, depending on your interface and circuit type.\n\n> **NOTE Input and\
    \ Output**\n> Remember, a router's \"input\" is traffic that is entering the router\
    \ via the interface, while the \"output\" is leaving the router via that interface.\
    \ In the case of a T1, input is coming in from the outside world, while output\
    \ is leaving your network and heading out over the T1. On a typical Ethernet interface,\
    \ router input is leaving the local network, and output is arriving at the local\
    \ network.\n\n```\n#sho int s1/0\n...\n❶ Last input 00:00:07, output 00:00:07,\
    \ output hang never\n❷ Last clearing of \"show interface\" counters 5w6d\n...\n\
    ❸ 5 minute input rate 6000 bits/sec, 6 packets/sec\n   5 minute output rate 6000\
    \ bits/sec, 2 packets/sec\n❹ 6413455 packets input, 2153942875 bytes, 0 no buffer\n\
    ❺ Received 0 broadcasts, 0 runts, 641 giants, 0 throttles\n❻ 36851 input errors,\
    \ 327 CRC, 36520 frame, 0 overrun, 0 ignored, 4 abort\n   2871476 packets output,\
    \ 608779651 bytes, 0 underruns\n❼ 0 output errors, 0 collisions, 31 interface\
    \ resets\n   0 output buffer failures, 0 output buffers swapped out\n❽ 27 carrier\
    \ transitions\n❾ DCD=up DSR=up DTR=up RTS=up CTS=up\n```\n\nThe ❶ \"last input\"\
    \ and \"last output\" values show how long it has been since packets entered or\
    \ left this interface. This particular interface has been idle for seven seconds,\
    \ which is not surprising with a problematic T1 or a slow network.\n\nCisco tracks\
    \ most errors with an incrementing counter. The ❷ last clearing of \"show interface\"\
    \ counters space shows the last time this incremental counter was reset to zero.\
    \ In this example, the counters have been incrementing for five weeks and six\
    \ days, far too long to be useful for troubleshooting a problem happening right\
    \ now—those 15 million errors the router has recorded could have happened a month\
    \ ago or in the last minute, and there's no way to tell. It's very easy to reset\
    \ these counters, though, and you don't even have to go into configure mode:\n\
    \n```\nrouter#clear counters\nClear \"show interface\" counters on all interfaces\
    \ [confirm]\nrouter#\n```\n\nAll the counters will be reset to zero, for all interfaces.\
    \ You can now do a `sho int` on your failed interface several times in succession\
    \ and easily see if any error counters are increasing while the problem is happening.\
    \ (Yes, you can do this while the error counters are all high, but it's much easier\
    \ to see the difference between 0 and 300 than to see the difference between 15831594\
    \ and 15831894, especially if many error counters have nonzero values.)\n\n###\
    \ Input/Output Rates\n\nThe ③ five-minute input and output rates can be useful\
    \ for troubleshooting. Although they are averaged over the last five minutes,\
    \ you can check the interface several times in succession to see how they change.\
    \ Is the average tending toward zero or climbing rapidly?\n\nRemember, a T1 only\
    \ handles 1.54Mb/sec, or 1,540,000 bits per second. If your average throughput\
    \ is close to that, that's why your network feels slow. A distributed denial-of-service\
    \ attack or a sudden rush on your website can make your users feel like the Internet\
    \ is down, when actually it's just a massive flood of traffic making your circuit\
    \ useless. The ④ totals of all packets processed since the counters were cleared\
    \ can be useful in a similar way.\n\n### Types of Errors\n\nThe interface then\
    \ gets ⑤ specific on the types of errors it sees. *Broadcasts* are standard network\
    \ broadcasts and generally are not a cause for alarm. *Runt* packets are smaller\
    \ than the router's minimum packet size, and *giants* are larger than the maximum\
    \ packet size. Neither should be on a T1 circuit. If they appear on an Ethernet\
    \ segment, some network device is sending them out.\n\n⑥ **Input errors** cause\
    \ packets to be rejected. The interface presents a total of all the input errors\
    \ and then breaks them down by category. Although a certain number of errors is\
    \ normal, if input errors comprise over one percent of your incoming packets,\
    \ you have a problem. In this example, we have 36,000 input errors. We've input\
    \ about 6.4 million packets, though, so this is far less than one percent of all\
    \ packets, an acceptable error rate.\n\n- *CRC* and *frame input errors* probably\
    \ indicate some sort of line noise; if these are happening frequently, call your\
    \ ISP or telco and have them troubleshoot the circuit.\n- *Overrun*, *ignored*,\
    \ and *abort input errors* indicate that the router cannot process incoming packets\
    \ quickly enough and is forced to drop surplus packets. You can adjust the router's\
    \ internal buffers, but this is very tricky to do correctly. I strongly encourage\
    \ you to use Cisco's SmartNet support and have a technician help you adjust the\
    \ buffers to fit your particular situation.\n- ⑦ *Output errors* are most common\
    \ on an Ethernet interface, where an extremely high collision rate can interfere\
    \ with the network's performance. On a serial line, output errors are most commonly\
    \ the result of running out of buffers for outgoing packets (though this is quite\
    \ rare on small routers). Again, if you're consistently running out of buffers,\
    \ contact Cisco for help.\n\n## Using Carrier Transition to Detect a Bad Serial\
    \ Connection\n\nOne of the more useful ways to detect a bad serial connection\
    \ is the ⑧ *carrier transitions* line. A carrier transition is when the interface\
    \ either goes up or comes down. It's entirely possible for a serial line to bounce\
    \ up and down so quickly that you won't catch it by successive `sho int` commands.\
    \ The carrier transition increments whenever the line goes down, and again whenever\
    \ it comes back up. By watching this field, you can detect an unstable circuit.\n\
    \nFinally, a serial line will list the ⑨ *signals* that it is receiving over the\
    \ line. For the line to be functional, all of these need to be up; if any are\
    \ not up even after rebooting everything, call your ISP or telco. Your router\
    \ cannot process traffic it cannot hear!\n\n## Extended Pings and Circuit Troubleshooting\n\
    \nCisco routers can use a variety of ping tests to check IP connectivity to other\
    \ networks. This is very useful for testing troublesome serial circuits that are\
    \ not down but that are not actually working properly. At times, a misprovisioned\
    \ circuit will cause problems that do not appear on `sho int`, but that cause\
    \ no end of headaches."
  mdcn: "\n## 重置接口\n\n首先，如果电路中的某个网络设备出现异常，重置接口可能会让该设备恢复正常。\n\n```\nrouter#conf t\n\
    router(config)#int s1/0\nrouter(config-int)#shut\n```\n\n缓慢地数到十，然后重新开启接口。\n\n\
    ```\nrouter(config-int)#no shut\nrouter(config-int)#^Z\nrouter#\n```\n\n如果你的电路恢复了，恭喜！如果没有，下一步就是重启路由器。\n\
    \n## 重启路由器\n\n虽然从背面拔掉电源线，数到十，然后再插回去也能奏效，但只要你还登录在系统里，最好用一种稍微更优雅的方式重启路由器。\n\n```\n\
    router# reload\n```\n\n路由器会提示你确认，然后自行重启。如果你的路由器有独立的 CSU/DSU，请同步对其进行电源循环（重启）。\n\
    \n## 尝试了所有方法都没用！\n\n如果这两招都不管用，你就必须打电话给你的 ISP 或电信运营商。你可以通过两种方式拨打这个电话：一种是准备好大量信息，以便尽快解决问题；另一种则是陷入歇斯底里的恐慌。如果你偏好后者，现在就打电话吧。否则，在拨号前请尽可能收集路由器能提供的所有信息。无论你的\
    \ ISP 客服部门多么优秀，网络故障对*你*来说，比对接电话的那个人重要得多。毕竟，那位技术支持人员还能用*他*的电子邮件！\n\n不过，当你拨打电话时，如果你能说“我们的电路协议失效了，每秒收到数百个\
    \ CRC 错误”，而不是说“呃，我们的电路不工作了”，你会听起来专业且严肃得多。只要你知道如何阅读，你的路由器就能为你提供广泛的调试信息。\n\n## 接口调试信息\n\
    \n每个路由器接口都会详细描述其执行的工作、检测到的错误以及采取的措施。虽然我们不会涵盖路由器提供的每一项碎片信息，但在进行故障排除时，你应该了解一些基础知识。下面是一个标准\
    \ Cisco T1 接口执行 `sho int` 的输出结果。根据你的接口和电路类型，你的输出可能会略有不同。\n\n> **注意 输入与输出**\n>\
    \ 请记住，路由器的“输入（input）”是通过接口进入路由器的流量，而“输出（output）”是通过该接口离开路由器的流量。对于 T1 线路，输入是从外部世界进入的，而输出则是离开你的网络并经由\
    \ T1 发出的。在典型的以太网接口上，路由器输入是离开本地网络的流量，输出则是到达本地网络的流量。\n\n```\n#sho int s1/0\n...\n\
    ❶ Last input 00:00:07, output 00:00:07, output hang never\n❷ Last clearing of\
    \ \"show interface\" counters 5w6d\n...\n❸ 5 minute input rate 6000 bits/sec,\
    \ 6 packets/sec\n   5 minute output rate 6000 bits/sec, 2 packets/sec\n❹ 6413455\
    \ packets input, 2153942875 bytes, 0 no buffer\n❺ Received 0 broadcasts, 0 runts,\
    \ 641 giants, 0 throttles\n❻ 36851 input errors, 327 CRC, 36520 frame, 0 overrun,\
    \ 0 ignored, 4 abort\n   2871476 packets output, 608779651 bytes, 0 underruns\n\
    ❼ 0 output errors, 0 collisions, 31 interface resets\n   0 output buffer failures,\
    \ 0 output buffers swapped out\n❽ 27 carrier transitions\n❾ DCD=up DSR=up DTR=up\
    \ RTS=up CTS=up\n```\n\n❶ “last input”和“last output”值显示自数据包进入或离开此接口以来经过的时间。这个特定的接口已经闲置了七秒钟，对于一个有问题的\
    \ T1 或缓慢的网络来说，这并不奇怪。\n\nCisco 使用递增计数器来跟踪大多数错误。❷ “last clearing of \"show interface\"\
    \ counters” 空间显示该递增计数器最后一次被重置为零的时间。在本例中，计数器已经递增了五周零六天，这对于排除当前发生的问题来说太久了——路由器记录的这\
    \ 1500 万个错误可能发生在一个月前，也可能发生在最后一分钟，根本无法区分。不过，重置这些计数器非常简单，你甚至不需要进入配置模式：\n\n```\n\
    router#clear counters\nClear \"show interface\" counters on all interfaces [confirm]\n\
    router#\n```\n\n所有接口的所有计数器都将被重置为零。现在你可以对故障接口连续执行几次 `sho int`，从而轻松观察在问题发生时是否有任何错误计数器在增加。（是的，你可以在错误计数器已经很高时这样做，但观察\
    \ 0 到 300 的区别比观察 15831594 到 15831894 的区别要容易得多，尤其是当许多错误计数器都有非零值的时候。）\n\n### 输入/输出速率\n\
    \n❸ 五分钟输入和输出速率对故障排除很有用。虽然它们是过去五分钟的平均值，但你可以连续检查接口几次，观察它们的变化。平均值是在趋向于零还是在迅速攀升？\n\
    \n请记住，T1 只能处理 1.54Mb/sec（即每秒 1,540,000 位）。如果你的平均吞吐量接近这个值，这就是网络感觉缓慢的原因。分布式拒绝服务（DDoS）攻击或网站流量激增会让用户觉得互联网断了，而实际上只是巨大的流量洪流让你的电路失效了。❹\
    \ 自计数器清除以来处理的所有数据包总数也可以在类似的情况下发挥作用。\n\n### 错误类型\n\n接着，接口会详细列出 ⑤ 它看到的错误类型。*Broadcasts*（广播）是标准的网络广播，通常不需要担心。*Runt*（运行短包）数据包小于路由器的最小数据包大小，而\
    \ *giants*（巨包）则大于最大数据包大小。T1 电路中不应出现这两者。如果它们出现在以太网段中，说明某个网络设备正在发送它们。\n\n⑥ **Input\
    \ errors**（输入错误）会导致数据包被拒绝。接口会显示所有输入错误的总数，然后按类别细分。虽然一定数量的错误是正常的，但如果输入错误占接收数据包的\
    \ 1% 以上，你就遇到了问题。在本例中，我们有 36,000 个输入错误。但我们输入了约 640 万个数据包，因此这远低于 1%，是一个可接受的错误率。\n\
    \n- *CRC* 和 *frame input errors*（帧输入错误）可能表示某种线路噪声；如果这些错误频繁发生，请致电你的 ISP 或电信运营商，让他们检查电路。\n\
    - *Overrun*（溢出）、*ignored*（被忽略）和 *abort input errors*（终止输入错误）表明路由器无法足够快地处理传入的数据包，被迫丢弃多余的数据包。你可以调整路由器的内部缓冲区，但这很难正确操作。我强烈建议你使用\
    \ Cisco 的 SmartNet 支持，请技术人员帮你根据具体情况调整缓冲区。\n- ⑦ *Output errors*（输出错误）在以太网接口上最常见，极高的冲突率会干扰网络性能。在串行线上，输出错误最常见的原因是发出数据包的缓冲区用尽（尽管在小型路由器上这很罕见）。同样，如果你经常耗尽缓冲区，请联系\
    \ Cisco 寻求帮助。\n\n## 使用载波转换检测不良的串行连接\n\n检测不良串行连接最有效的方法之一是查看 ⑧ *carrier transitions*（载波转换）行。载波转换是指接口状态变为\
    \ Up 或 Down。串行线可能会如此快速地在 Up 和 Down 之间跳变，以至于你无法通过连续执行 `sho int` 命令捕捉到。每当线路 Down\
    \ 时，载波转换计数增加一次，再次 Up 时又增加一次。通过观察这个字段，你可以检测出不稳定的电路。\n\n最后，串行线会列出它在链路上接收到的 ⑨ *signals*（信号）。为了使线路正常工作，所有这些信号都需要为\
    \ up；如果即使在重启所有设备后仍有信号不为 up，请致电你的 ISP 或电信运营商。路由器无法处理它听不到的流量！\n\n## 扩展 Ping 和电路故障排除\n\
    \nCisco 路由器可以使用多种 ping 测试来检查与其他网络的 IP 连通性。这对于测试那些虽然没有 Down 但实际运行不正常的麻烦串行电路非常有用。有时，配置错误的电路会导致\
    \ `sho int` 中不显示问题，但却会带来无穷无尽的麻烦。\n"
