    在办公室之间的流量中增加了额外的开销，也增加了线路利用率。如果你正在 VPN 一端的工作站上编辑文档，而办公室里的其他人开始从互联网下载 ISO 镜像，你访问文档服务器的速度可能会慢到无法忍受。另一方面，专用连接不会与你的互联网连接争夺相同的资源。


