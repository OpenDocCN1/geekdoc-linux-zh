    # Running versus Startup


    A router has two configurations at any given time: the *startup configuration*
    and the *running configuration*. The startup configuration is stored in the router''s
    nonvolatile memory and is used to configure the router during the boot process.
    At that point, a copy of the startup configuration is placed into the running
    configuration. If you change the router''s configuration during operation, you''re
    changing the running configuration. When you save the running configuration, it
    overwrites the previous startup configuration and becomes the new startup configuration.
    If you do not save your changes before you reboot the router, the changes are
    lost.


    > **NOTE** *This is a long-winded way of saying: save your changes or you''ll
    lose them at the next reboot! Changing a router configuration is no different
    than editing a document in a word processor; if you exit without saving, you lose
    your work. This can be good or bad; don''t be afraid to use this to your advantage
    if you really screw up your router''s configuration!*


    Technically, you could say that the startup configuration is a configuration file;
    it''s stored in nonvolatile RAM, just like a file on disk. Cisco experts don''t
    generally refer to the startup configuration as a configuration file, however;
    it''s just a "configuration." The running configuration is certainly not a file;
    it''s a (possibly modified) copy of the startup configuration, held in memory.


    # *Startup Configuration*


    To view the configuration the router will boot with, enter the show startup-config
    command.


    ```

    router# show startup-config

    ❶Using 5620 out of 129016 bytes

    !

    ❷version 12.0

    ...

    ```'
  - '[PAGE 28]


    The router reads the configuration from permanent storage and ❶ tells you how
    much space it takes up before displaying the ❷ configuration proper.


    # Running Configuration


    To view the current (running) configuration, enter the `show running-config` command.¹


    ```

    router#show running-config

    ❶Building configuration...

    ❷Current configuration:

    !

    version 12.0

    ...

    ```


    Note the first line of the output, where the router tells you that it is literally
    ❶ assembling the current configuration from the router''s memory. It then ❷ reminds
    you that this is the configuration in memory at the moment, which may or may not
    match what is in NVRAM. It then displays the configuration one screen at a time.


    # Reading a Configuration


    We won''t dissect a single complete router configuration in this book, because
    a working configuration for even a small router can easily reach up to 200 lines.
    Here''s how to read this configuration, though.


    A Cisco IOS configuration consists of a series of statements. Each statement either
    activates or deactivates a feature for an interface, a protocol, or the router
    as a whole, or defines some global characteristic of the router. You''ll also
    see exclamation points, which IOS uses to separate sections of a configuration.
    (If you store copies of your router configurations in a place other than on the
    router, you can use exclamation points to indicate comments, much as the pound
    sign is used by many program configuration files. This is rarely done, because
    the router will strip out these comments when loading the configuration.) For
    example, here are some snippets of a small router configuration file.


    > ¹ Old Cisco farts may remember this as `write terminal` or `wr t`. There''s
    nothing inherently evil about `wr t`, but it''s considered obsolete.'
