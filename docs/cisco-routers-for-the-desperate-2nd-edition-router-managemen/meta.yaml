    针对本地用户数据库的请求进行验证。例如，要让控制台检查用户名，你只需这样做：


    ```

    router# conf t

    router(config)# line con 0

    router(config-line)# login local

    ```


    你可以在不同的线路上混合使用不同的认证方式。通过在 vty 线路上设置 `login local`，而在 con 端口上设置 `login`，你就可以要求远程访问使用用户名和密码，而控制台则使用标准的前门密码。这提供了足够多的组合方式，让你完全将自己锁在系统之外。


    ## 远程路由器访问


    思科路由器支持通过网络进行管理的多种方式。最常见的路由器访问方式是 telnet 和 SSH。


    Telnet 多年来一直是获取远程系统命令提示符的标准方式。不幸的是，通过 telnet 发送的所有内容都是未加密的。二十多年来，这并没有造成太大问题，但如今的互联网远没有那么友好了。你计算机和路由器之间的恶意互联网用户可以截获你的路由器密码，并对你的路由器为所欲为。如果必须使用
    telnet，请确保仅在路由器所在的可信本地网络中使用，而不要通过公共互联网使用。Unix 和 Windows 都包含命令行 telnet 客户端。如果条件允许，请使用
    SSH 代替 telnet。


    SSH（即安全外壳）是 telnet 的现代替代方案。客户端和服务器之间的所有通信都是加密的，因此那个恶意用户无法截获任何有用的信息。虽然所有现代 Unix
    版本都包含 SSH 客户端，但 Windows 用户需要获取一个附加的 SSH 客户端。互联网上有许多可用的客户端，其中最常推荐的之一是 puTTY。通过
    Google 搜索即可直接找到众多下载站点。


    许多思科路由器还支持其他配置方式，例如 Web 界面。与 telnet 类似，你传输的任何信息都是通过网络以未加密方式发送的，任何懂得相关技术的人都可以截获这些信息并获得对路由器的无限制访问。路由器的
    Web 界面通常不如命令行灵活。两者之间，Web 界面几乎没有什么可推荐的理由。


    ## 启用 Telnet


    要使用 telnet，路由器必须在 vty 线路上设置了密码，或者设置了可以指定 vty 线路进行认证的本地用户名和密码。如果你已经在这些线路上设置了密码，只需在
    vty 线路配置中添加 `transport input telnet` 配置选项即可启用 telnet。


    ```

    line vty 0 4

    password 7 0231004206EA2C295D4848

    transport input telnet

    ```


    如果 vty 线路上没有设置密码，路由器将拒绝所有通过 telnet 连接的尝试。否则，telnet 将通过这个简单配置直接开始工作。


    如果你想使用本地用户名，可以跳过在 vty 线路上分配密码的步骤。只需确保在 `transport input telnet` 行之外，还要在 vty 线路配置中添加
    `login local` 选项。


    ```

    router# conf t

    router(config)# line vty 0 4

    router(config-line)# login local

    router(config-line)# transport input telnet

    ```


    这会告诉路由器根据本地用户名列表对传入的 telnet 请求进行认证。


    ## 启用 SSH


    SSH 协议可能比 telnet 更安全，但其复杂性导致它需要比 telnet 更多的配置。其中大部分配置在路由器上本来就是有必要设置的，因此不应该成为负担。


    要使用 SSH，路由器必须具有支持 SSH 的 IOS 版本。一般来说，Enterprise 和 DES 功能集包含 SSH 支持。如果你的路由器没有支持
    SSH 的 IOS 版本，请从思科获取一个新的。你可以随时向思科的技术支持中心提交请求，寻求帮助选择合适的 IOS 版本；或者如果你够大胆，可以自行浏览思科网站并使用其
    IOS 选择工具。另外，请回到第 6 章仔细阅读。


    路由器必须在虚拟终端上设置用户账户，而不是使用通用密码，正如本章前面所讨论的那样。但是，当你设置好这些之后，路由器还必须知道自己的主机名和域名。


    ```

    router# conf t

    router(config)# hostname router.blackhelicopters.org

    router(config)# ip domain-name blackhelicopters.org

    ```


    这台特定的机器主机名为 `router.blackhelicopters.org`，属于 `blackhelicopters.org` 域。虽然你可能认为路由器可以从主机名中确定其域名，但如果你有四级或五级域名，这会比听起来更难实现。设置好这些基本信息后，你就可以完成
    SSH 的配置了。判断当前 IOS 版本是否支持 SSH 的一个简单方法是运行以下命令。如果路由器无法识别这些命令，说明你的 IOS 不支持 SSH，你需要更换一个。


    ```

    router(config)# crypto key generate rsa

    router(config)# ip ssh timeout 60

    router(config)# ip ssh authentication-retries 3

    router(config)# line vty 0 4

    router(config-line)# transport input ssh

    ```


    设置好主机名和域名后，为你的路由器生成一个 RSA 加密密钥。RSA 加密密钥是一对非常大的数字，路由器用它作为密钥向 SSH 客户端证明自己的身份。这个密钥不会出现在路由器的配置文件中；它单独存储。


    SSH 还有另外两个你可以设置的选项：路由器在关闭空闲 SSH 连接之前保持连接的秒数，以及传入的 SSH 连接在输入正确密码前的尝试次数。在本例中，路由器将保持
    SSH 连接开放 60 秒，并给用户三次机会输入正确的密码。


    最后，我们需要配置虚拟终端，并告诉路由器 SSH 是它应该接受的传入传输方式。当然，我们还必须有 `login local` 语句，以便网络根据存储在路由器上的用户名和密码进行认证。


    现在你可以从世界任何地方安全地访问你的路由器了。让我们继续了解思科提供的一些其他功能，使你的路由器真正成为网络中的参与者，而不仅仅是一个神秘的灰色盒子。


    # 9


    ## 思科网络服务


    如果你已经完成了本书到目前为止的所有操作，你的路由器应该已经完全正常运行，并能够按照你期望的方式快速处理进出网络的数据包。然而，除了简单的数据包转发之外，思科路由器还支持许多额外的网络协议，这些协议可以很好地将路由器集成到你的网络服务和网络管理系统中。这些包括网络时间协议、系统日志和
    SNMP 等。


    由于许多服务会使用时间戳，我们将从让路由器的当前日期和时间与实际保持一致开始。


    ## NTP


    如果你依赖系统日志来识别问题（而不是采用传统的故障排除方法，比如"盲目猜测"），让你的日志具有正确的时间戳可以决定记录是有用还是无用。网络管理系统通常使用系统报告的时间戳来记录事件。如果有人入侵了你的网络，而你不得不涉及执法部门，不准确的系统时间将使你的记录和日志在法律系统眼中失去效力。虽然所有这些因素结合在一起使得网络时间非常重要，但在各种操作系统之间维护同步的网络时间可能是一件令人头疼的事。思科路由器支持网络时间协议（NTP），该协议受到所有主要操作系统厂商的支持，是行业标准。


    ### NTP 基础


    NTP 允许一组联网主机在几毫秒的误差范围内达成时间一致。该协议基于两个相互矛盾的假设来工作。首先，某些系统拥有非常精确的时钟，系统所有者希望让其他人也能使用这些时钟。其次，那些希望提供精确时间公共服务的主机不希望被世界上每一个可能的客户端淹没。NTP
    协议允许一两个本地服务器从大型全球时间服务器获取精确时间，然后将这些正确的时间重新分发给网络上的其他客户端。拥有极高精度时钟的系统被称为一级（Tier 1）NTP
    服务器。那些被允许直接从一级 NTP 服务器获取时间并重新分发给客户端的系统被称为二级（Tier 2）NTP 服务器。


    你可以将路由器配置为直接从大型一级或二级 NTP 服务器获取时间，但最好还是设置一个本地 NTP 服务器。一般来说，该服务器会从两到三个不同的二级 NTP
    服务器读取时间，并允许其他本地系统从它获取时间。这样可以减轻二级服务器的负载，也使 NTP 更易于你维护。一级和二级时间服务器偶尔会更改其名称或 IP 地址，因此在单个本地服务器上更新配置比在网络上的每个客户端上更新要简单得多。有关如何向客户端提供时间服务的详细信息，请查阅你的操作系统文档。

