  md: "two routers, because you already do that on your peers. If your AS is number\
    \ 100, the BGP session between the two would look like this:\n\n```\nrouter(config)#\
    \ router bgp 100\nrouter(config-router)# neighbor 192.168.1.1 neighbor-as 100\n\
    router(config-router)# neighbor 192.168.1.1 next-hop-self\n```\n\nSave your work,\
    \ and suddenly your two routers will be speaking internal BGP and your internal\
    \ traffic will be taking the best available route out of your network.\n\n# Testing\
    \ HSRP\n\nThe easy way to test live failover is to unplug a router during the\
    \ day and see who complains. I agree that this is the true test of failover, but\
    \ it is best performed after hours with your network's monitoring system running\
    \ at full tilt. You can check your router's HSRP behavior by using the sho standby\
    \ command.\n\n```\nrouter#sho standby\nFastEthernet0/0 - Group 1\n State is Standby\n\
    \  1 state change, last state change 1w2d\n Virtual IP address is 192.168.0.1\n\
