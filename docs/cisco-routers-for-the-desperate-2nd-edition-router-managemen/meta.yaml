    \ The command for this is `clear ip bgp` followed by the neighbor's IP address.\n\
    \n```\nrouter# clear ip bgp 172.16.0.2\nrouter#\n```\n\nThis should not be done\
    \ lightly! Existing connections to the Internet may hang momentarily or even terminate.\
    \ The router's CPU utilization will climb dramatically as the routes are cleared\
    \ and all the new BGP information is received from the peer. If you have an older\
