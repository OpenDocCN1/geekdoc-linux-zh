    \nBGP 运行得几乎完美，极少出现问题。我已经让路由器运行了数月而无需更改其 BGP 配置。有时你可能会发现路由行为异常；也许所有流量都运行在一条线路上，表明另一个对端没有向你发送任何路由。或者对端没有收到你的路由通告，因此所有入站流量都通过其他\
