    # ABSOLUTE™ OPENBSD

    UNIX for the Practical Paranoid


    by MICHAEL W. LUCAS


    This straightforward, practical, and complete guide to mastering the powerful
    and complex OpenBSD operating system is for the experienced UNIX user who wants
    to add OpenBSD to his or her repertoire. The author assumes knowledge of basic
    UNIX commands, design, and permissions. The book takes you through the intricacies
    of the platform and teaches how to manage your system, offering friendly explanations,
    background information, trouble-shooting suggestions, and copious examples throughout.


    JULY 2003, 528 PP., $39.95 ($59.95 CAN)

    ISBN 1-886411-99-9


    ![](img/b76c804cf499c7eeda3929279b928b62_142_1.png)


    # HACKING

    The Art of Exploitation


    by JON ERICKSON


    A comprehensive introduction to the exploitation techniques and creative problem-solving
    methods known as "hacking." Explains technical aspects of hacking such as stack
    based overflows, heap based overflows, string exploits, return-into-libc, shellcode,
    and cryptographic attacks on 802.11b.


    > “The seminal hackers handbook.” — SecurityForums.com


    NOVEMBER 2003, 264 PP., $39.95 ($59.95 CAN)

    ISBN 1-59327-007-0


    ![](img/b76c804cf499c7eeda3929279b928b62_142_2.png)'
  - '[PAGE 143]


    # THE LINUX ENTERPRISE CLUSTER


    # Build a Highly Available Cluster with Commodity Hardware and Free Software


    by KARL KOPPER


    The Linux Enterprise Cluster explains how to take a number of inexpensive computers
    with limited resources, place them on a normal computer network, and install free
    software so that the computers act together like one powerful server. The book
    includes information on how to build a high-availability server pair using the
    Heartbeat package, how to use the Linux Virtual Server load balancing software,
    how to configure a reliable printing system in a Linux cluster environment, and
    how to build a job scheduling system in Linux with no single point of failure.


    JANUARY 2005, 456 PP., $49.95 ($69.95 CAN) W/CD

    ISBN 1-59327-036-4


    ![](img/b76c804cf499c7eeda3929279b928b62_143_0.png)


    # THE BOOK OF WEBMIN


    # ...or How I Learned to Stop Worrying and Love UNIX


    by JOE COOPER


    A comprehensive guide to UNIX system administration with Webmin, the Open Source
    system administration tool. Everything you need to know about Webmin''s unique
    features, including the standard system features (network configuration, disk
    configuration, users and groups, etc.) and how to integrate the most popular services
    (Apache, BIND, Sendmail, and more). Tutorials show how to accomplish common tasks
    with each service.


