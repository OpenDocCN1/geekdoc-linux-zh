  md: '# # 1


    ## BEFRIENDING THE COMMAND LINE


    ![](img/b76c804cf499c7eeda3929279b928b62_21_0.png)


    This book focuses entirely on the command line. Why? Some Cisco routers include
    a web interface; others don''t. Cisco sells advanced router management packages,
    but they require a complicated client environment that you might not have available
    when you really need it. You might only need to log in to the router once a year
    or less; what are the chances that your desktop system with all the fancy management
    tools has undergoe some drastic surgery in the meantime, and the router tools
    no longer work the way you expect? Personally, I dislike trying to solve Windows
    problems when the router is down. The one environment available on every Cisco
    router is the command line.'
  merge: -1
  pgno: 21
- img_proc: true
  md: 'The command line gives you absolute control over every aspect of your router’s
    behavior. Some configuration changes can only be realistically made at the command
    line. If your router loses its configuration, you’ll need to use the command line
    to restore enough of its mind that your fancy tools can talk to it. So, if you
    must use the command line in those desperate circumstances, it’s best that you
    learn enough to be comfortable there.


    # EXEC versus Privileged EXEC Mode


    By default, when you first log in to a Cisco router you are in `EXEC mode`. You
    can execute basic diagnostic commands and look at things, but you cannot actually
    change configuration settings or view sensitive information. For example, in EXEC
    mode, you can see if an interface is receiving errors, and you can ping across
    a circuit to see if it is working, but you cannot reset the interface. In EXEC
    mode, the command prompt ends in a “greater than” sign.


    ```

    Router>

    ```


    To change anything, you must be in *privileged EXEC mode*, which is a superuser
    or administrator security level protected by a unique password. Privileged EXEC
    mode is sometimes called “enable mode.” In enable mode, you can configure the
    router in any way desired, reboot the router, or take any other action possible
    in the software.


    To enter privileged EXEC mode, use the enable command. When you actually have
    a password set to access enable mode, the router will prompt for it when you try
    to enable. See the “Passwords” section in Chapter 8.


    ```

    Router>enable

    Router#

    ```


    In enable mode, the command prompt ends in a pound sign. The old method of Cisco
    access control was to give the standard EXEC password to all the technicians but
    restrict the enable password to the senior techs. Setting up discrete usernames
    is a better way to achieve a similar effect, but many older routers still only
    use unprivileged and enable passwords—either because they haven’t been updated,
    or because that’s all that they can support. There’s nothing wrong with restricting
    the use of privileged mode in this way, especially in a small shop where only
    one or two people connect to the equipment, but if'
  merge: -1
  pgno: 22
- img_proc: true
  md: "you have more people you'll probably want to set up separate usernames and\
    \ allow individuals to be privileged or not. We'll see how to do this in Chapter\
    \ 8.\n\n# Integrated Help\n\n\"Help\" might be too strong a word, but routers\
    \ give hints on commands, command syntax, and the features available in the router.\
    \ Different versions of the Cisco IOS have different features, and it's not easy\
    \ to identify them all. The simplest way to see what commands are available is\
    \ to ask the router. Once you've logged in, enter a single question mark at the\
    \ command prompt peers.\n\n```\nrouter#?\nExec commands:\n  <1-99>         Session\
    \ number to resume\n  clear          Reset functions\n  clock          Manage\
    \ the system clock\n...\n```\n\nMy test router has four full screens of commands\
    \ available from a single question mark. Many of these commands are completely\
    \ irrelevant for a router that is providing basic Internet capability; such activities\
    \ require only a very small subset of Cisco's features. Still, this can be a helpful\
    \ reminder when you can't quite remember the name of a particular command.\n\n\
    You can request hints about individual commands. Many actions require one or more\
    \ words to complete, and Cisco's integrated help system will provide helpful reminders\
    \ about syntax or required information upon request. For example, the show command\
    \ is used to view system information. If you want to know what arguments a show\
    \ command can take, ask the router by entering show ?.\n\n```\nrouter#show ?\n\
    \  access-expression   List access expression\n  access-lists        List access\
    \ lists\n  accounting          Accounting data for active sessions\n  adjacency\
    \             Adjacent nodes\n...\n```\n\nOn some versions of the IOS, this output\
    \ can go on for screens and screens. If you know the first part of a command's\
    \ name,"
  merge: -1
  pgno: 23
- img_proc: true
  md: 'even just the first letter, you can narrow it down by giving what you remember
    of the command and a question mark.


    ```

    router#show a?

    access-expression  access-lists  accounting  adjacency  aliases

    alps              arp            async

    router#❶show a

    ```


    Note that on your next command-line prompt, the router automatically prints the
    ❶ chunk of command that you gave before the question mark. The system knows that
    you want to type something that begins with `show a`, and is trying to make it
    easier for you.


    One thing to remember is that hints on a particular command are only available
    in the mode in which the command is available. For example, the commands beginning
    with `ip`, such as `ip route`, are only available in enable mode. Entering `ip
    ?` in standard EXEC mode will generate an "unrecognized command" error.


    # Command Abbreviation


    One interesting feature of the Cisco IOS is that it allows the user to abbreviate
    command names to the shortest unique abbreviation for a word. For example, one
    common command we''ll use again and again to view settings is `show`. If you ask
    your router for all the commands beginning with the letter `s`, you''ll get a
    whole list.


    ```

    router#s?

    ❶*s=show  sdlc  send       set   setup

    ❷show     slip  start-chat  systat

    router#

    ```


    Note that only the command ❷ `show` begins with the letters `sh`. You can use
    the letters `sh` as an abbreviation for the full word `show`; the router is smart
    enough to know that you couldn''t possibly be typing any other legitimate command
    that begins with those letters. In this particular case, the letter `s` is also
    ❶ specially marked to indicate that it is an abbreviation for `show`; apparently
    Cisco thought that `show` was so commonly used that it made sense to abbreviate
    it further.


    In this book, we will give commands in the text by their full forms. Example commands
    may be in abbreviated form if they are commonly used that way.'
