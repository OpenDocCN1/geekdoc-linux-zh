  md: "minute, and there's no way to tell. It's very easy to reset these counters,\
    \ though, and you don't even have to go into configure mode:\n\n```\nrouter#clear\
    \ counters\nClear \"show interface\" counters on all interfaces [confirm]\nrouter#\n\
    ```\n\nAll the counters will be reset to zero, for all interfaces. You can now\
    \ do a sho int on your failed interface several times in succession and easily\
