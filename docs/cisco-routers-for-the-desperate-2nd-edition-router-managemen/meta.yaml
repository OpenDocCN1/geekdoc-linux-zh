    By far, the most interesting columns are **Neighbor** and **AS**, which allow
    you to identify a peer by either ① IP address or ② ASN. The ③ **InQ** and **OutQ**
    columns show how many messages from or to that peer remain to be processed, respectively.
    ④ **Up/Down** shows how long the current BGP session has been established. Finally,
    during normal operation, the ⑤ **State/PfxRcd** column shows the number of route
    announcements that your router has received from that peer. If the BGP session
    has just been started or is having problems, this entry will display a word describing
    the state of the BGP session. An `Active` session has just been started, and your
    router is waiting for the other router to begin communication. An `OpenSent` or
    `OpenConfirm` status indicates that your router is negotiating with the peer to
    establish a connection. The `Established` state means that the routers are now
    exchanging routing information.


    The remaining columns are less useful in day-to-day work, but might be important
    when troubleshooting. The ⑥ **MsgRcvd** and **MsgSent** columns tell you how often
    you have received and transmitted BGP messages. ⑦ **TblVer** gives the latest
    version of the BGP table that you''ve transmitted to your peers. Most of the time,
    you will only need these when you''re on the phone with Cisco support.


