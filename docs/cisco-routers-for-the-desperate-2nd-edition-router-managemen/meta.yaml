    \ IP 地址和 ASN 编号，就能让你拥有一个可运行的 BGP 设置。\n\n## 一个完整的 BGP 配置\n\n完成后，你的 BGP 配置应类似于下面的示例。如果此配置中的任何部分缺失，BGP\
