    \ not work with a Cisco router; don't even bother trying them.)\n\n# Copying Files\n\
    \nThe copy command duplicates an existing file elsewhere, just like its DOS equivalent.\
    \ The syntax is\n\n```\nrouter# copy <current location> <new location>\n```\n\n\
    The difficult part is knowing the syntax for the various locations you might be\
    \ copying from. Copying from one filesystem to another is perhaps the easiest;\
    \ all you need is the full path to each filename. For example, if we have an IOS\
