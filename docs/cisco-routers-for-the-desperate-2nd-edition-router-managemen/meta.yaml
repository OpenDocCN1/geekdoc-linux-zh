    路由器从永久存储中读取配置，并在显示具体配置之前告知你它占用了多少空间。\n\n## 运行配置\n\n要查看当前（运行）配置，请输入 `show running-config`\
    \ 命令。¹\n\n```\nrouter# show running-config\nBuilding configuration...\nCurrent\
