    \ from 172.16.0.2 00:09:37 ago\n  Routing Descriptor Blocks:\n  * 172.16.0.2,\
    \ from 172.16.0.2, 00:09:37 ago\n      Route metric is 0, traffic share count\
    \ is 1\n      AS Hops 1\nrouter#\n\nThe IP address we're interested in is announced\
    \ as part of a /16 block. We get the route from our peer at AS200. This route\
    \ was updated from our peer 9 minutes and 37 seconds ago. Finally, to reach this\
    \ destination we need to pass through one autonomous system.\n\nAfter you know\
