    had upgrades where the router could not find its own network interfaces, or wouldn''t
    boot at all and was stuck in rommon (BIOS) mode. Cisco has many different versions
    of IOS for each router, and installing the wrong IOS can turn your expensive router
    into an expensive chunk of metal and plastic that requires expert help to repair.*


    If everything goes perfectly, the upgrade process is quick and easy: get the new
    IOS file onto the router''s flash disk and reboot.


    # ## Cisco Security Notifications


    Every so often, some bright person discovers a security flaw in the Cisco IOS.
    Because the router is the first point of entry onto a network, no security device
    on your network can protect it, which means that when a security hole is discovered
    in IOS, you may have to upgrade the router to keep intruders out.


    Cisco announces security issues through a customer mailing list and through security
    mailing_SZa_Z1va6T65ta9caching lists such as BugTraq.


    If you''re not already on a mailing list that gets Cisco security announcements,
    you should sign up for Cisco''s customer security announcements list, cust-security-announce@cisco.com.
    Send an email containing *only* the words "subscribe cust-security-announce" to
    majordomo@cisco.com. You''ll receive a reply giving you instructions on how to
    confirm your subscription.


    Read all Cisco security alerts carefully. If you''re not using the targeted functionality
    mentioned in an alert, or if the problem doesn''t affect your equipment, don''t
    worry about it. But if the alert affects you, schedule a maintenance window to
    take the router down and upgrade the IOS.'
  - '[PAGE 81]


    # Upgrade Preparations


    Before upgrading, make sure that you have an FTP server available close to the
    router. (The official Cisco documentation discusses using a TFTP server, but an
    FTP server is far more secure and no more difficult to use than a TFTP server.)
    You’ll need a user account and password on that FTP server along with a few megs
    of disk space. (If you don’t have FTP server software, you’ll find dozens of free
    ones on sites like http://www.tucows.com and http://www.freshmeat.net.)

    An emergency Internet connection is also useful in case something goes wrong.
    Although Cisco has extensive disaster recovery documentation on its website, it
    will be largely useless if you don’t have Internet access! By setting up an account
    with a dial-up ISP for one of your workstations, you’ll be able to access this
    information easily. A number of ISPs allow their users a certain number of dial-up
    hours free each month; I have a NetZero account set up at the office for exactly
    this purpose.

    Finally, confirm that you have a Cisco console cable and that it works. If the
    upgrade goes really, really badly, you may have to console in to restore service.


    # IOS Versions


    Once you have these trivialities out of the way, you’ll need a new IOS image to
    install. Cisco’s IOS is released in several parallel versions, each with a unique
    version number. For example, “12.0” is an older release, “12.1” is a later version,
    “13.0” is more recent still, and so on. You know the drill.


    +   - Each release is available in a variety of patch levels, indicated in parenthesis
    after the main release number, like 12.0(7). (This may not be the seventh release
    of version 12.0, by the way; you’ll also see further divisions, such as 12.0(5)a
    and 12.0(5)b.)

    - Cisco adds capital letters to the end of the release name to indicate special
    branches or versions of a particular IOS release, as in 12.0(7)XK. These letters
    may change as features are shuffled from branch to branch. (It is possible—but
    not easy—to track a particular set of features from version to version and release
    to release.)'
  - '[PAGE 82]


    # Choosing Your IOS Version


    Because of the various ways that IOS images are labeled, choosing the new IOS
    image to install on your router is often the trickiest part of the upgrade. You''ll
    want an IOS version that contains all the necessary device drivers for your hardware,
    with support for the features you require.


    The simplest way to get the correct IOS version is to open a Technical Assistance
    Request at Cisco''s website. Run `show tech` on your router, capture the output,
    and attach it to your request so that your support tech will have everything he
    needs to make an informed decision. Cisco usually responds to these requests within
    hours with a custom link to the exact image you need.


    Cisco also provides the Software Advisor Web tool, which purports to guide you
    to the correct version of IOS for your exact hardware. More than once, I''ve used
    this tool and found that the version I downloaded won''t work on my router; either
    the router refuses to boot with that IOS image, or the new IOS won''t recognize
    some of my router interfaces. Feel free to try it, if you''re into recovering
    damaged systems or if risking router failure under load gives you a warm, fuzzy
    feeling.


    One way or another, you''ll get a file containing the new IOS version. This file
    is called an *image*. Put your new IOS image on your FTP server. Do not change
    the file''s name.


    # Find the Current IOS Image


    If your shiny new IOS image doesn''t work the way Cisco promises, you''ll want
    to be able to fall back to your current IOS version and router configuration so
    you can at least restore service. The current version is somewhere on your router''s
    flash disk. As shown in Chapter 2, the image name that the router booted with
    is shown in the `show version` output. Perhaps half a dozen lines down in the
    show version output you''ll see the System `image file` entry.


    ```

    System image file is "flash:c3640-is56i-mz-120-7-XK1"

    ```


    The image file is stored on ① internal flash and is ② named c3640-is56i-mz-120-7-XK1.
    This is the file you want to back up.'
- md: "> **NOTE** Routers have many potential image storage locations, including internal\
    \ flash, removable flash cards, or other storage media. Having additional space\
    \ to store images is nice, because it allows you easy to recover from installing\
    \ an unsuitable image.\n\n## Viewing Disk Contents\n\nGo into enable mode and\
    \ enter `dir /all`.\n\n```\nrouter# dir /all\nDirectory of flash:/\n\n \n\n 1\
    \  -rw-   9270984       <no date>  c3640-is561-mz-120-7-XK1.bin\n 2  -rw-    \
    \     25       <no date>  snnpmengineid\n\n33554432 bytes total (24283292 bytes\
    \ free)\n```\n\nThere's only one file on this router, our 1 boot image. There\
    \ isn't enough room on this flash device to store another image—we have used more\
    \ space with the existing image than we have left free. While this particular\
    \ router has two slots for flash cards, neither slot has a card in it.\n\nIf you\
    \ have a router with PCMCIA slots for flash memory, I highly recommend that you\
    \ purchase a Cisco-branded flash card. Although they cost a few hundred dollars,\
    \ it will make recovering from a failed upgrade much, much easier. (Regular flash\
    \ cards will almost certainly not work with a Cisco router; don't even bother\
    \ trying them.)\n\n## Copying Files\n\nThe copy command duplicates an existing\
    \ file elsewhere, just like its DOS equivalent. The syntax is\n\n```\nrouter#\
    \ copy <current location> <new location>\n```\n\nThe difficult part is knowing\
    \ the syntax for the various locations you might be copying from. Copying from\
    \ one filesystem to another is perhaps the easiest; all you need is the full path\
    \ to each filename. For example, if we have an IOS image on flash that we want\
    \ to copy to a flash card in slot 0, we would just use\n\n```\nrouter#copy flash:c3640-is561-mz-120-7-XK1.bin\
    \ slot0:c3640-is561-mz-120-7-XK1.bin\n```\n\nBy doing this, you've backed up your\
    \ current IOS to a removable flash card for safekeeping. In the event that your\
    \ shiny new IOS image doesn't boot, you can pull the known working image off the\
    \ flash disk and rapidly restore service.\n\nIf you're not lucky enough to have\
    \ a flash card, you can copy the current image to your FTP server. The Cisco FTP\
    \ client will not prompt you for a username and password for your FTP server,\
    \ however, so you need to give it on the command line as part of the copy command.\
    \ An FTP location for the copy command looks like this:\n\n```\nftp://username:password@servername/filename\n\
    ```\n\nSo, assume you have an FTP server running on the machine fileserver. Your\
    \ account name is mwlucas, and the password is YrtIwarph?^1 To copy an image from\
    \ the flash drive to the FTP server, you would issue the following command.\n\n\
    ```\nrouter# copy flash:c3640-is561-mz-120-7-XK1.bin\nftp://mwlucas:YrtIwaarph?@fileserver/c3640-is561-mz-120-7-XK1.bin\n\
    Address or name of remote host [fileserver]?\nDestination filename [c3640-is561-mz-120-7-XK1.bin]?\n\
    Writing c3640-is561-mz-120-7-XK1.bin\n!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!\n\
    ....\nrouter#\n```\n\nThe router prompts you to confirm the server name and the\
    \ destination filename. Just press ENTER if you gave the correct locations on\
    \ the command line, or you can correct them here. (You cannot enter or correct\
    \ the username or password interactively, however; that would be too convenient.)\n\
    \nIt's also a good idea to back up your router's configuration in case the upgrade\
    \ goes really, really badly and the router loses its memory. You can simply use\
    \ a text file backup if you wish, or you can actually FTP the startup configuration\
    \ to the FTP server.\n\n```\nrouter# copy startup-config ftp://mwlucas:YrtIwaarph?@fileserver/startup-config\n\
    ```\n\nWhen you have backed up your current system, you are finished until your\
    \ maintenance window begins.\n\n> ^1 This is, of course, an acronym for \"You\
    \ really think I would use a real password here?\"\n\n## Performing the Upgrade\n\
    \nAn IOS upgrade requires a router reboot, which interrupts service. If all goes\
    \ well, the Clayton will only be down for a few minutes. If the new IOS image\
    \ does not work, you will need to reload the old IOS onto the router and reboot\
    \ again. If you have an external flash card, or if you have enough room on the\
    \ router's flash memory to store multiple IOS images, you'll be able to restore\
    \ the old image fairly quickly. If you don't have those features, you will need\
    \ to get the old IOS image onto the router either via FTP, or if your router no\
    \ longer knows it has network interfaces, via xmodem over a serial cable. Allow\
    \ yourself at least two hours for this recovery process.\n\nIn short, schedule\
    \ a two-hour (or longer!) window of acceptable downtime for a router upgrade.\n\
    \n## IOS Installation\n\nAfter all of this work, the new IOS installation itself\
    \ is almost anticlimactically disappointing. Just copy the image from the FTP\
    \ server to the router's internal flash.\n\n```\nrouter# copy ftp://username:password@servername/new-image-name\
    \ flash:new-image-name\n```\n\nThe copy command will prompt you for confirmation.\
    \ If the internal flash is too small to hold both the old image and the new image,\
    \ it will ask you if you want to erase the existing flash first. Confirm that\
    \ you really do have a backup of the old IOS image, and then proceed to erase\
    \ the flash.\n\nAfter the image file is loaded onto the router's flash storage,\
    \ reload the router. The router should boot with the new IOS. You can confirm\
    \ this with `show version` upon the next reboot.\n\n## Managing Multiple IOS Images\n\
    \nIf you are one of the lucky people with a router that has enough flash to hold\
    \ multiple IOS images, you don't want to erase the entire flash just to make room\
    \ for the new image. The erase command will erase a particular file from a storage\
    \ device, making room for the new image. Usually, you'll have two image files\
    \ on the flash: the version you're currently running and the previous version.\
    \ To fit a new image on the flash, erase the oldest image you have.\n\n```\nrouter#\
    \ erase flash:filename\n```\n\nYou should now have enough room to load the new\
    \ IOS image.\n\nWhen the router has enough internal flash to hold multiple IOS\
    \ images, it will automatically boot with the first available image. Do a `dir\
    \ flash:` to determine what image that is. If the wrong image is first, you can\
    \ hard-code the image to be booted with a `boot system` command.\n\n```\nrouter#conf\
    \ t\nrouter(config)#no boot system\nrouter(config)#boot system flash *imagename*\n\
    router(config)^z\n```\n\n## Disaster Recovery\n\nIf your new IOS image is bad,\
    \ upon a reboot the router may be unstable; it might not know it has any network\
    \ interfaces, it might repeatedly crash, or it might even only boot into \"rommon\"\
    \ mode—the Cisco equivalent of \"Press F2 for Setup.\"\n\nIf you are in this situation\
    \ but have your old version of IOS available on the router itself (either on flash\
    \ or on a flash card), boot the old image. This will at least restore service\
    \ while you get Cisco on the phone and make use of your SmartNet contract to have\
    \ them help you fix the problem.\n\nIf you do not have the old IOS handy on the\
    \ router itself—say, it's backed up on your FTP server instead—you must load the\
    \ image back onto the router via xmodem over your console cable. The process for\
    \ this varies with router types and failure types, so we won't go into detail\
    \ here. I suggest that you immediately phone Cisco and open a Priority 1 case.\
    \ The magic words are, \"I am completely down.\" When the Cisco tech understands\
    \ that your router is off the Internet and you are totally hosed, they will be\
    \ able to immediately connect you to a technician who can point you to the correct\
    \ recovery procedure for your router. They will even hold your hand and walk you\
    \ through every step of the process if you desire. Even though I've had upgrades\
    \ fail several times, and I know what to do for each of my routers, when time\
    \ is running short it's nice to have an expert on the phone.\n\nNow that you can\
    \ upgrade your router, let's look at providing backup connectivity.\n\n# 7 REDUNDANCY\
    \ WITH BGP AND HSRP\n\nThe component of your Internet service most likely to fail\
    \ is your Internet circuit. Cisco routers can use multiple Internet circuits from\
    \ multiple providers, giving your network the best possible access to Internet\
    \ sites and other Internet users the best possible access to your company.\n\n\
    This is possible through the Border Gateway Protocol (BGP). BGP announces to the\
    \ whole world what IP addresses your router is responsible for, and it listens\
    \ to other routers to learn the best way to reach other sites. BGP is not difficult\
    \ to understand or to implement, but it has its own tricks and traps. You may\
    \ want to do additional research into how to make BGP meet your particular needs,\
    \ but this section will be enough to get you up and running with multiple Internet\
    \ providers."
  mdcn: "\n> **注意** 路由器有多种潜在的图像存储位置，包括内部闪存、可移动闪存卡或其他存储介质。拥有额外的存储空间来存放镜像文件是件好事，因为它可以让你在安装了不合适的镜像后轻松恢复。\n\
    \n## 查看磁盘内容\n\n进入使能模式并输入 `dir /all`。\n\n```\nrouter# dir /all\nDirectory of flash:/\n\
    \n \n\n 1  -rw-   9270984       <no date>  c3640-is561-mz-120-7-XK1.bin\n 2  -rw-\
    \         25       <no date>  snnpmengineid\n\n33554432 bytes total (24283292\
    \ bytes free)\n```\n\n这台路由器上只有一个文件，就是我们的1个启动镜像。这个闪存设备上没有足够的空间来存储另一个镜像——现有镜像占用的空间比我们剩余的可用空间还要多。虽然这台特定的路由器有两个闪存卡插槽，但两个插槽都没有插入卡。\n\
    \n如果你有一台带有PCMCIA闪存插槽的路由器，我强烈建议你购买一张思科品牌的闪存卡。虽然它们要花费几百美元，但它会让从失败的升级中恢复变得非常非常容易。（普通的闪存卡几乎肯定无法在思科路由器上工作；甚至不要费心去尝试它们。）\n\
    \n## 复制文件\n\n`copy` 命令将现有的文件复制到其他地方，就像其DOS对应命令一样。语法如下：\n\n```\nrouter# copy <current\
    \ location> <new location>\n```\n\n困难的部分在于知道你可能从中复制的各种位置的语法。从一个文件系统复制到另一个文件系统可能是最简单的；你只需要每个文件名的完整路径。例如，如果我们在闪存上有一个IOS镜像，我们想把它复制到插槽0中的闪存卡，我们只需使用\n\
    \n```\nrouter#copy flash:c3640-is561-mz-120-7-XK1.bin slot0:c3640-is561-mz-120-7-XK1.bin\n\
    ```\n\n这样做，你就把你当前的IOS备份到了一张可移动的闪存卡上以确保安全。万一你那崭新的IOS镜像无法启动，你可以从闪存卡中取出已知可用的镜像并快速恢复服务。\n\
    \n如果你不够幸运没有闪存卡，你可以把当前的镜像复制到你的FTP服务器。然而，思科的FTP客户端不会提示你输入FTP服务器的用户名和密码，因此你需要在命令行中作为`copy`命令的一部分提供它。`copy`命令的FTP位置如下所示：\n\
    \n```\nftp://username:password@servername/filename\n```\n\n因此，假设你在名为fileserver的机器上运行了一个FTP服务器。你的账户名是mwlucas，密码是YrtIwarph?^1\
    \ 要将镜像从闪存驱动器复制到FTP服务器，你需要发出以下命令。\n\n```\nrouter# copy flash:c3640-is561-mz-120-7-XK1.bin\n\
    ftp://mwlucas:YrtIwaarph?@fileserver/c3640-is561-mz-120-7-XK1.bin\nAddress or\
    \ name of remote host [fileserver]?\nDestination filename [c3640-is561-mz-120-7-XK1.bin]?\n\
    Writing c3640-is561-mz-120-7-XK1.bin\n!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!\n\
    ....\nrouter#\n```\n\n路由器会提示你确认服务器名称和目标文件名。如果你在命令行中提供了正确的位置，只需按回车键，或者你可以在这里更正它们。（然而，你不能交互式地输入或更正用户名或密码；那太方便了。）\n\
    \n备份路由器的配置也是一个好主意，以防升级真的变得非常糟糕，导致路由器丢失内存。如果你愿意，可以简单地使用文本文件备份，或者你实际上可以通过FTP将启动配置发送到FTP服务器。\n\
    \n```\nrouter# copy startup-config ftp://mwlucas:YrtIwaarph?@fileserver/startup-config\n\
    ```\n\n当你备份完当前系统后，在维护窗口开始之前，你就完成了。\n\n> ^1 这当然是“你以为我真会在这里用真实密码吗？”的首字母缩写。\n\n##\
    \ 执行升级\n\nIOS升级需要路由器重新启动，这会中断服务。如果一切顺利，Clayton只会宕机几分钟。如果新的IOS镜像不工作，你需要将旧的IOS重新加载到路由器上并再次重新启动。如果你有外部闪存卡，或者路由器的闪存有足够的空间存储多个IOS镜像，你将能够相当快速地恢复旧的镜像。如果你没有这些功能，你需要通过FTP将旧的IOS镜像获取到路由器上，或者如果你的路由器不再知道它拥有网络接口，则通过串行电缆使用xmodem传输。请为这个恢复过程至少预留两个小时。\n\
    \n简而言之，为路由器升级安排一个两小时（或更长！）的可接受停机时间窗口。\n\n## IOS安装\n\n在完成所有这些工作后，新的IOS安装本身几乎令人失望地平淡无奇。只需将镜像从FTP服务器复制到路由器的内部闪存。\n\
    \n```\nrouter# copy ftp://username:password@servername/new-image-name flash:new-image-name\n\
    ```\n\n`copy`命令会提示你确认。如果内部闪存太小，无法同时容纳旧镜像和新镜像，它会问你是否要先擦除现有的闪存。确认你确实备份了旧的IOS镜像，然后继续擦除闪存。\n\
    \n镜像文件加载到路由器的闪存存储后，重新启动路由器。路由器应该使用新的IOS启动。你可以在下次重启时使用 `show version` 来确认这一点。\n\
    \n## 管理多个IOS镜像\n\n如果你是幸运的人之一，路由器有足够的闪存来容纳多个IOS镜像，你不会想擦除整个闪存仅仅是为了给新镜像腾出空间。`erase`命令将从存储设备中擦除特定文件，为新镜像腾出空间。通常，你闪存上会有两个镜像文件：你当前运行的版本和上一个版本。要为新的镜像腾出空间，请擦除你拥有的最旧的镜像。\n\
    \n```\nrouter# erase flash:filename\n```\n\n现在你应该有足够的空间来加载新的IOS镜像。\n\n当路由器有足够的内部闪存来容纳多个IOS镜像时，它将自动启动第一个可用的镜像。执行\
    \ `dir flash:` 来确定那是哪个镜像。如果第一个镜像不对，你可以使用 `boot system` 命令来硬编码要启动的镜像。\n\n```\n\
    router#conf t\nrouter(config)#no boot system\nrouter(config)#boot system flash\
    \ *imagename*\nrouter(config)^z\n```\n\n## 灾难恢复\n\n如果你的新IOS镜像有问题，在重启时路由器可能不稳定；它可能不知道它有任何网络接口，它可能反复崩溃，或者它可能甚至只启动到“rommon”模式——思科的“按F2进入设置”等效模式。\n\
    \n如果你处于这种情况，但路由器本身上有可用的旧版本IOS（无论是在闪存上还是在闪存卡上），启动旧的镜像。这至少会在你联系思科并利用你的SmartNet合同让他们帮你解决问题时恢复服务。\n\
    \n如果你没有在路由器本身上方便地找到旧的IOS——比如说，它备份在你的FTP服务器上——你必须通过xmodem通过控制台电缆将镜像重新加载到路由器上。此过程因路由器类型和故障类型而异，因此我们不会在这里详细介绍。我建议你立即致电思科并开启一个优先级为1的案例。关键语句是：“我完全宕机了。”当思科技术人员了解到你的路由器已脱离互联网并且你完全束手无策时，他们将能够立即将你连接到一位技术人员，该技术人员可以为你指出针对你的路由器的正确恢复程序。如果你愿意，他们甚至可以手把手地指导你完成过程的每一步。即使我已经经历过几次升级失败，并且我知道如何为我的每台路由器进行操作，但当时间紧迫时，有一位专家在电话里是很棒的。\n\
    \n既然你可以升级你的路由器了，让我们来看看如何提供备份连接。\n\n# 7 使用BGP和HSRP实现冗余\n\n你的互联网服务中最容易出故障的部分是你的互联网线路。思科路由器可以使用来自多个提供商的多条互联网线路，为你的网络提供访问互联网站点的最佳途径，并为其他互联网用户提供访问你公司的最佳途径。\n\
    \n这是通过边界网关协议实现的。BGP向全世界宣告你的路由器负责哪些IP地址，并监听其他路由器以学习到达其他站点的最佳路径。BGP不难理解或实现，但它有自己的技巧和陷阱。你可能需要进行额外的研究来了解如何让BGP满足你的特定需求，但本节足以让你与多个互联网提供商一起启动并运行。\n"
