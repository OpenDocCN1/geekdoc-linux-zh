    # Hot Standby Router Protocol


    After you have BGP up and running, the next obvious question is, "What do we do
    if the router itself fails?" While Cisco routers are generally reliable, even
    the best hardware sometimes lets the magic smoke escape and transforms into a
    shiny metal paperweight. Cisco supports the Hot Standby Router Protocol (HSRP)
    to provide live failover between routers in this eventuality. You can build a
    "pool" of independent Cisco devices that will take over some functions of a failed
    router; not all of the functions are covered, but enough are so that your users
    will not notice.


    # What Is HSRP?


    HSRP lets multiple routers provide a single IP address. This is most useful for
    your default gateway on your Ethernet. All your computers know about the routers
    is that one of them had better have the default gateway of (for example) 192.168.0.1;
    they don''t care which router has it, just that it''s available. HSRP allows the
    routers to keep track of each other; when the router that has the default gateway
    disappears from the network, another router can automatically respond to requests
    for the default gateway''s IP address. In this case, each router has its own unique
    IP address on its Ethernet interface, but might also have the default gateway
    as shown in Figure 7-2.'
