    \n以下是我们需要修改的BGP配置片段及其当前的路由映射。\n\n```\nrouter bgp 100\n neighbor 172.16.0.2 remote-as\
    \ 300\n neighbor 172.16.0.2 route-map ispB-out out\n route-map ispB-out\n  match\
    \ ip address 130\n```\n\n我们与AS300的对等会话当前只有一个路由映射，它应用于出站通告。如果我们想修改对此对等方的通告，可以编辑现有的路由映射，但我们想修改来自此对等方的入站通告，因此需要一个新的路由映射。\n\
    \n```\nrouter# conf t\nrouter(config)# router bgp 100\nrouter(config-router)#\
    \ neighbor 172.16.0.2 route-map ispB-in in\nrouter(config-router)# ^Z\n```\n\n\
    在这里，我们告诉BGP会话对ISP B使用一个新的路由映射，名为ispB-in。这个新的路由映射仅应用于入站通告。\n\n```\nrouter# conf\
    \ t\nrouter(config)# route-map ispB-in permit 10\nrouter(config-route)# set as-path\
    \ prepend 300 300\n```\n\n这会创建ispB-in路由映射。通过它到达的每个通告都会通过在前面添加两个300来扩展其AS路径。\n\n\
    进行此更改并保存工作后，通过清除此对等方的BGP会话使新的路由映射生效。\n\n```\nrouter# clear ip bgp 172.16.0.2\n\
    ```\n\n重置BGP会话后，重新检查你的测试路由。输出将有一些细微但重要的变化。具体来说，来自AS300的AS路径现在前面会有两个额外的300，就像这样：\n\
    \n```\n300 300 300 400\n```\n\n这会使其他AS路径显得更短，从而使该路由更受青睐。\n\n不要急于进行AS路径预置。虽然我们在本例中添加了两个AS跳，但最好一次只向对等方添加一个AS跳，以查看它如何影响性能。如有必要，可以稍后添加额外的跳数。（你确实有MRTG在运行，每隔几分钟显示一次效果，对吧？）\n\
    \n如果你的入站流量偏向某个对等方，可以修改你的出站通告以平衡这些流量。这里要记住的重要一点是，你必须在出站通告中预置你自己的AS编号，而不是对等方的。如果有人开始使用你的AS编号，你会非常恼火，你可以预期你的对等方对他们的AS编号也有同样的感受。\n\
    \n这里的好处是你已经有出站路由映射了。要添加AS路径预置，只需编辑现有映射，添加AS路径预置的行。\n\n```\nrouter# conf t\nrouter(config)#\
    \ route-map ispB-out permit 10\nrouter(config-route)# set as-path prepend 100\n\
    ```\n\n我们的BGP配置已经引用了ispB-out路由映射，因此我们完全不需要修改BGP配置。只需进入配置模式并编辑现有映射以添加AS预置规则即可。但你仍然必须清除此对等方的BGP会话，以使更改生效。\n\
    \n## BGP更新的传播\n\n既然你已经对BGP有了足够的了解（足以让它变得危险），你应该知道BGP通告可能需要长达20分钟才能在全球范围内可见。虽然你的对等方应该会很快获取它们，但你不能期望每个地方都与你连接得这么好。更改你的BGP设置后，至少等待20分钟以查看真正的效果，然后再进行另一次更改。这也有助于降低被标记为BGP抖动源并导致你自己被黑洞（从互联网隔离）的风险。\n\
    \n如果你想查看你的BGP通告是如何被外界看到的，可以在互联网上搜索\"BGP观测镜\"（BGP Looking Glass）。这些网页允许你查询路由器的BGP信息。通过向远程路由器查询你的IP地址段的BGP信息，你可以看到它们看到的通告以及其他人如何看待你的网络。如果你在BGP配置方面遇到问题，可以使用多个观测镜来确定谁可以看到你的路由，谁看不到，从而确定问题的范围。这些信息还可以帮助你识别问题，例如某个对等方没有将你的通告传播到其网络之外，或以某种方式修改了你的通告。\n\
    \n## 热备份路由器协议\n\n在BGP启动并运行之后，下一个显而易见的问题是，\"如果路由器本身故障了怎么办？\"虽然思科路由器通常很可靠，但即使是最棒的硬件有时也会让魔法烟雾逸出，变成闪亮的金属镇纸。思科支持热备份路由器协议（HSRP），以在这种情况下提供路由器之间的实时故障转移。你可以构建一个独立的思科设备\"\
    池\"，它们将接管故障路由器的部分功能；并非所有功能都涵盖，但足以让你的用户不会注意到。\n\n### 什么是HSRP？\n\nHSRP允许多个路由器提供一个单一的IP地址。这对你的以太网默认网关最有用。你所有的计算机只知道路由器之一最好拥有默认网关，例如192.168.0.1；它们不关心哪个路由器拥有它，只关心它是否可用。HSRP允许路由器相互跟踪；当拥有默认网关的路由器从网络中消失时，另一个路由器可以自动响应对默认网关IP地址的请求。在这种情况下，每个路由器在其以太网接口上都有自己唯一的IP地址，但也可以拥有如图7-2所示的默认网关。\n\
    \n![](img/b76c804cf499c7eeda3929279b928b62_107_0.png)\n\n路由器A在办公网络上有一个以太网接口。该接口的主IP地址是192.168.0.2，但它也可以托管IP地址192.168.0.1——你计算机的默认网关。如果你想登录路由器A，请SSH到地址192.168.0.2。同样，路由器B在办公网络上也有一个以太网接口和唯一的IP地址192.168.0.3，但它也可以托管默认网关192.168.0.1。路由器之间会协商哪个是\"\
    默认\"默认路由器，但当该路由器故障时，另一个将接管。用思科术语来说，IP地址192.168.0.1是*备用*地址。（其他实现通常将其称为虚拟IP或VIP。）\n\
    \n此以太网接口的非常基本配置只需要几行。\n\n```\nrouter(config)# int fast0/0\nrouter(config-if)#\
    \ ip address 192.168.0.2 255.255.255.0\nrouter(config-if)# standby 1 ip 192.168.0.1\n\
    ```\n\n将备用条目应用于两个路由器配置，突然之间你就可以ping通192.168.0.1了。在重新启动路由器时持续ping该IP地址，你甚至不会看到一个丢包——当然，除非你同时关闭两个路由器！\n\
    \n单个路由器接口可以支持多个HSRP备用IP地址。每个都必须标识为一个组。在涉及该特定备用IP的每个配置中使用该组标识符。\n\n### 调优HSRP\n\
    \n虽然以上内容将处理大多数情况下的实时故障转移工作，但你会发现HSRP需要一些微调才能真正变得透明。最常调整的功能是`preemption`（抢占）、`interface\
    \ tracking`（接口跟踪）、`delay`（延迟）和`authentication`（认证）。\n\n#### 抢占\n\n抢占是指特定接口宣布自己负责备用IP地址，并迫使所有其他接口放弃对该地址的主张。这意味着特定路由器默认支持HSRP，让所有其他路由器只作为备份。这是通过为每个支持备用IP的接口分配优先级来实现的，让具有最高优先级的路由器宣称它。默认情况下，备用组中的每个路由器优先级为100。要设置优先级，请在配置中使用关键字priority。\n\
    \n```\nrouter(config)# int fast0/0\nrouter(config-if)# standby 1 preempt\nrouter(config-if)#\
    \ standby 1 priority 105\n```\n\n首先允许此路由器要求从较低优先级的路由器托管备用IP。如果你使用抢占功能，备用组中的所有路由器都应具有此条目。然后将此特定路由器的优先级设置为105。\n\
    \n#### 接口跟踪\n\n将单个路由器分配为备用组的主路由器可能很方便，至少这样你知道哪个路由器负责。（网络管理员作为一个群体，对于说“流量进入我们路由器附近的云，然后神奇的事情发生”并不满意。他们更喜欢这样的说法：“只要A在运行，流量就会明确地流向路由器A。”）有时，你选择的路由器可能不是一个明智的选择。再次查看图7-2。我们的每个路由器都有一条连接到互联网的线路。如果路由器的互联网线路故障，那么该路由器作为备用主路由器就不再有意义；流量会无谓地多一跳。我们可以使用接口跟踪来降低路由器的HSRP优先级。当被跟踪的接口故障时，HSRP优先级会自动降低。\n\
    \n```\nrouter(config)# int fast0/0\nrouter(config-if)# standby 1 track Serial0\n\
    ```\n"
