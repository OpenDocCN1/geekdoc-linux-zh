    \nVia AS300, we reach the destination IP address via an AS path of 300 400 700\
    \ 200. In other words, the packets will have to go through four autonomous systems.\
    \ This is probably longer than the route directly through AS200, so we don't want\
    \ to take it.\n\n## Resetting BGP\n\nBGP runs almost perfectly, and rarely has\
    \ any problems at all. I've let routers run for months without changing their\
    \ BGP configurations. On occasion you might find that your routing is behaving\
    \ oddly; perhaps all of your traffic is running over one circuit, indicating that\
