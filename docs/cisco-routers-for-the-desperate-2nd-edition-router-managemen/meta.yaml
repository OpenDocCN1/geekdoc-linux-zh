    \ shot yourself in the foot yet, but you have loaded the gun and started eyeing\
    \ your big toe.\n\nLook at your traffic throughput on each provider. Frequently,\
    \ your router will choose to transmit outbound traffic to one provider more often\
    \ than the other. It's quite common to see a small office with two T1 circuits\
    \ using one circuit ten times more than the other. When one circuit is using 1.0Mb/second,\
    \ the other might only be using 0.1Mb/second. This is fine if your bandwidth usage\
    \ is low, but if your more popular circuit fills up, you'll only be using 0.15Mb/second\
    \ on your less popular circuit. This would give you network usage of about 1.6Mb/second,\
    \ or only slightly more than half your available bandwidth. Worse, network requests\
    \ sent out over the popular circuit will return very, very slowly. Similarly,\
    \ if most of your traffic arrives over one circuit, you may find that one circuit\
    \ is choked with inbound requests while your alternate circuit is empty.\n\nIf\
