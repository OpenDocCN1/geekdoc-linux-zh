    When the syslog messages arrive at your logging server, the syslog daemon will
    check the facility and severity of each message and direct the message to the
    file you''ve chosen for those messages. This process happens extremely quickly;
    If your syslog server is correctly set up, you will start to see messages appear
    almost immediately.


    # # SNMP


    The most common glue to hold networks together is the Simple Network Management
    Protocol (SNMP). Many different products and tools use SNMP to gather and accumulate
    network and device performance information, and all of these include support for
    Cisco routers.


    SNMP can be used in both read-only and read-write modes. Using read-write SNMP
    requires that your router be tightly secured. Because your router is usually the
    border device on your network, sitting outside your firewall, this is difficult.
    Read-only access is a much safer idea. (You can also use an access list to prevent
    random people from being able to query your router; check Cisco''s website for
    details.)


    A SNMP-enabled device uses a community name to provide basic security. This is
    much like a password; people that have the community ID can make SNMP queries
    of the router, while people without the community name cannot. Setting the community
    name is quite simple:


    ```

    router# conf t

    router(config)# **¹**snmp-server **²**community **³**SendMichaelAllYourCash **⁴**RO

    ```


    First, tell the router to **¹** fire up its SNMP server. You must set a **²**
    community and pick **³** some random jumble四时of characters to use as a community
    name. Finally, do not forget to set the community name to be **⁴** read only!
    (While the router will use'
