    Older routers (such as some frequently found on auction sites) have both an AUI
    and a 10BaseT Ethernet port. Despite appearances, these routers have only one
    Ethernet interface with only two connectors. You can use either the AUI port or
    the 10BaseT port, but not both simultaneously. Choose the connector you want with
    the `media-type` keyword and either the `aui` or `10baseT` setting.


    ```

    router(config-if)#media-type 10baseT

    ```


    This is unnecessary on routers with a single physical plug per Ethernet interface.
    You can identify these routers easily enough by looking at the Ethernet ports.


    # Serial Interfaces


    A serial network has only two nodes, one at each end, and only transmits data
    between those two points. This makes managing a serial link much simpler than
    an Ethernet one, but the line connecting your router to the remote network has
    a far wider variety of options that can be set.


    While you can run a serial link between two routers by attaching the right cable
    between their serial ports, a serial line is usually provided by a phone company
    and runs between two different locations much farther apart than the few hundred
    feet that Ethernet can tolerate. We''ll concentrate on telco-provided T1 circuits
    like the ones you would find in an ISP connection or between two offices.


    Here''s the beginning of the `sho int` output of a typical Cisco T1 interface.
    Despite the scary reputation serial interfaces have, a serial line is in many
    ways much simpler to configure than an Ethernet interface, because it has many
    fewer options.


    ```

    Serial1/0 is up, line protocol is up

    Hardware is DSCC4 with integrated T1 CSU/DSU

    ...

    ```'
