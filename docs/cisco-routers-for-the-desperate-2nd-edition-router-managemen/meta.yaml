  - '[PAGE 75]


    **NOTE** Small packets appear more quickly than large packets, and the largest
    packets in the ping sweep test may make you think that the router has stopped
    responding. Note which sorts of packets the router has trouble with.


    For circuits that are behaving poorly or exhibiting “weird” behavior, I suggest
    running the extended ping test three times: once with the default data pattern,
    once with an all-zero data pattern, and once with all ones. If your circuit has
    trouble with certain sorts of packets, this process will probably uncover it.
    If not, your circuit is probably running cleanly.


    # Phoning the ISP


    So you’ve opted to gather all your debugging information before calling. You know
    which sorts of errors are appearing on your circuit, and what sort of packets
    your circuit will and will not pass. Now what?


    You got your T1 circuit from either a telco or an ISP. Phone them. The first words
    out of your mouth should be, “I have a down circuit.” When you reach a technical
    support person, explain:


    +   * The state of the line itself (both line and protocol down, or just protocol
    down, or both line and protocol up)

    * That you have rebooted your router and CSU/DSU (this will almost certainly be
    their first suggestion)

    * The types of errors you are seeing: CRC, framing, overruns, aborts, and so on

    * The results of any ping tests you have run


    The technician should check the ISP’s end of the circuit and phone the telco who
    originally provisioned the line. Most telephone companies will return a call to
    the circuit owner (usually the ISP) within an hour with an initial status report.


    **NOTE** While your ISP should handle circuit issues, especially when they own
    the circuit, if the problem is actually a failed circuit, it may take hours to
    repair.


    # Circuit Loopback Tests


    T1 circuits include all sorts of intelligent equipment such as repeaters, switches,
    and smartjacks. The telco can talk to this equipment using a series of successive
    loopback tests to quickly identify where a problem lies and what piece of equipment
    is at fault.'
  - '[PAGE 76]


    The telco has a diagram listing every piece of equipment along a circuit. A loopback
    test is where they attempt to communicate with each piece of equipment in succession.
    For example, the telco central office will try to "loop up" the first piece of
    equipment outside their office—say, the repeater in the little gray box up the
    street. If they can easily communicate with that device, and if that device can
    return data it receives to the central office, they will loop up the second closest
    device and test it. When something fails to respond, they send a technician out
    to examine and repair that device.


    Eventually, the telco will work their way down to looping up the smartjack at
    your demarc. If the telco can communicate correctly with the smartjack, they will
    probably try to loop up your CSU/DSU. The telco/ISP''s responsibility technically
    ends at the smartjack, but they will frequently try to go the extra step simply
    to demonstrate that it isn''t their problem. (This tactic should be painfully
    familiar to anyone who has worked a help desk!) If the telco says that they can
    cleanly loop up the smartjack, but cannot loop up the CSU/DSU, the problem lies
    somewhere between the CSU/DSU and the smartjack and is unquestionably your problem.


    This sort of exhaustive test takes time, especially on a long circuit, but it
    is the quickest way to identify a problem. The telco may have to send a technician
    out to your facility to perform testing. You may well have to have someone stay
    after hours to let the technician in and out of the building.


    > **WARNING** *A loopback test will completely disable your circuit! If your circuit
    is already down, then they can loopback all they want, but if you are merely suffering
    degraded performance, you may want to ask the ISP or telco to perform the test
    after hours. It''s all a question of what your environment requires.*


    Once you know without a doubt that the problem is with the telco or the ISP, the
    only skill required to fix the issue is a willingness to make a nuisance of yourself
    at the ISP''s help desk.


    # ## *If It''s Your Problem*


    If the ISP can loop up the smartjack but not your router, it''s your problem.
    Congratulations! The good news is, as you have very few components in your section
    of the circuit, testing your equipment won''t take very long. The bad news is,
    many components you do have will require outside help.'
- md: 'Check to make sure everything in your system is tightly attached. A loose connection
    can cause no end of problems. “Is it plugged in?” is still a good question in
    the comms closet.


    A common culprit in circuit failures is wiring. Replace the wiring between the
    smartjack and your CSU/DSU. A T1 circuit uses a standard Cat 5 cable, so many
    people plug in a cable that they had in a drawer somewhere. A T1 is less forgiving
    than Ethernet, however. Try using a good premade cable, with solid connectors
    on both ends.


    If you’ve replaced all your wiring, and everything is firmly seated, and reboots
    and resets have not solved your problem, phone your CSU/DSU’s technical support
    line. On a modern Cisco system, this would be Cisco itself.


    > **NOTE** If your vendors start each blaming the other, as is common among lower-level
    technical support staff, do not be afraid to get them all on the phone at once
    and let them fight it out.


    Now that you know how to troubleshoot your router, you can learn how to upgrade
    it.


    ## 6 IOS CHANGES


    Cisco’s Internetwork Operating System (IOS) is the brains of any Cisco router;
    it provides the command line, interface device drivers, routing software, and
    all the other bits that make a router do more than draw power and generate heat.
    Cisco continuously maintains and updates IOS, adding more features as they become
    useful and stable. If you want some of Cisco’s nifty new functionality, you’ll
    probably find it in an IOS upgrade.


    The only reasons to upgrade are for security, stability, or required features.
    While it might be cool to have the latest IOS, that is insufficient motivation
    for staying up all night hoping that a "bad upgrade recovery process" works. I
    advise you to find any technical justification you can to not perform an upgrade.
    A successful upgrade only causes a few minutes of downtime, but a failed upgrade
    can take the router out of action for several hours.


    **NOTE SmartNet and IOS Upgrades**

    *Do not attempt an IOS upgrade without a SmartNet support agreement! An IOS upgrade
    gone bad may leave your router completely unusable without advanced help. I''ve
    had upgrades where the router could not find its own network interfaces, or wouldn''t
    boot at all and was stuck in rommon (BIOS) mode. Cisco has many different versions
    of IOS for each router, and installing the wrong IOS can turn your expensive router
    into an expensive chunk of metal and plastic that requires expert help to repair.*


    If everything goes perfectly, the upgrade process is quick and easy: get the new
    IOS file onto the router''s flash disk and reboot.


    ### Cisco Security Notifications


    Every so often, some bright person discovers a security flaw in the Cisco IOS.
    Because the router is the first point of entry onto a network, no security device
    on your network can protect it, which means that when a security hole is discovered
    in IOS, you may have to upgrade the router to keep intruders out.


    Cisco announces security issues through a customer mailing list and through security
    mailing lists such as BugTraq.


    If you''re not already on a mailing list that gets Cisco security announcements,
    you should sign up for Cisco''s customer security announcements list, cust-security-announce@cisco.com.
    Send an email containing *only* the words "subscribe cust-security-announce" to
    majordomo@cisco.com. You''ll receive a reply giving you instructions on how to
    confirm your subscription.


    Read all Cisco security alerts carefully. If you''re not using the targeted functionality
    mentioned in an alert, or if the problem doesn''t affect your equipment, don''t
    worry about it. But if the alert affects you, schedule a maintenance window to
    take the router down and upgrade the IOS.


    ### Upgrade Preparations


    Before upgrading, make sure that you have an FTP server available close to the
    router. (The official Cisco documentation discusses using a TFTP server, but an
    FTP server is far more secure and no more difficult to use than a TFTP server.)
    You’ll need a user account and password on that FTP server along with a few megs
    of disk space. (If you don’t have FTP server software, you’ll find dozens of free
    ones on sites like http://www.tucows.com and http://www.freshmeat.net.)


    An emergency Internet connection is also useful in case something goes wrong.
    Although Cisco has extensive disaster recovery documentation on its website, it
    will be largely useless if you don’t have Internet access! By setting up an account
    with a dial-up ISP for one of your workstations, you’ll be able to access this
    information easily. A number of ISPs allow their users a certain number of dial-up
    hours free each month; I have a NetZero account set up at the office for exactly
    this purpose.


    Finally, confirm that you have a Cisco console cable and that it works. If the
    upgrade goes really, really badly, you may have to console in to restore service.


    ### IOS Versions


    Once you have these trivialities out of the way, you’ll need a new IOS image to
    install. Cisco’s IOS is released in several parallel versions, each with a unique
    version number. For example, “12.0” is an older release, “12.1” is a later version,
    “13.0” is more recent still, and so on. You know the drill.


    - Each release is available in a variety of patch levels, indicated in parenthesis
    after the main release number, like 12.0(7). (This may not be the seventh release
    of version 12.0, by the way; you’ll also see further divisions, such as 12.0(5)a
    and 12.0(5)b.)

    - Cisco adds capital letters to the end of the release name to indicate special
    branches or versions of a particular IOS release, as in 12.0(7)XK. These letters
    may change as features are shuffled from branch to branch. (It is possible—but
    not easy—to track a particular set of features from version to version and release
    to release.)


    ### Choosing Your IOS Version


    Because of the various ways that IOS images are labeled, choosing the new IOS
    image to install on your router is often the trickiest part of the upgrade. You''ll
    want an IOS version that contains all the necessary device drivers for your hardware,
    with support for the features you require.


    The simplest way to get the correct IOS version is to open a Technical Assistance
    Request at Cisco''s website. Run `show tech` on your router, capture the output,
    and attach it to your request so that your support tech will have everything he
    needs to make an informed decision. Cisco usually responds to these requests within
    hours with a custom link to the exact image you need.


    Cisco also provides the Software Advisor Web tool, which purports to guide you
    to the correct version of IOS for your exact hardware. More than once, I''ve used
    this tool and found that the version I downloaded won''t work on my router; either
    the router refuses to boot with that IOS image, or the new IOS won''t recognize
    some of my router interfaces. Feel free to try it, if you''re into recovering
    damaged systems or if risking router failure under load gives you a warm, fuzzy
    feeling.


    One way or another, you''ll get a file containing the new IOS version. This file
    is called an *image*. Put your new IOS image on your FTP server. Do not change
    the file''s name.


    ### Find the Current IOS Image


    If your shiny new IOS image doesn''t work the way Cisco promises, you''ll want
    to be able to fall back to your current IOS version and router configuration so
    you can at least restore service. The current version is somewhere on your router''s
    flash disk. As shown in Chapter 2, the image name that the router booted with
    is shown in the `show version` output. Perhaps half a dozen lines down in the
    show version output you''ll see the System `image file` entry.


    ```

    System image file is "flash:c3640-is56i-mz-120-7-XK1"

    ```


    The image file is stored on internal flash and is named c3640-is56i-mz-120-7-XK1.
    This is the file you want to back up.'
