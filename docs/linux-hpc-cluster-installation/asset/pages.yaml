  md: '# 8.1 Install GCC and PGI Compiler


    In this section, we will discuss how to install the GNU C compiler (gcc) and PGI
    compilers.


    # 8.1.1 GNU C compiler (gcc)


    gcc is included in every common Linux distribution and is installed as a default.
    for some reason you do not have it installed, you can download it from:


    ```

    http://www.gcc.org/software/gcc.html

    ```


    Follow the instructions on:


    ```

    http://www.gcc.org/software/gcc/install/index.html

    ```


    If you prefer RPM, try the biggest RPM repository at:


    ```

    http://rpmfind.net/linux/RPM/

    ```


    and install it using the command:


    ```

    rpm -Uvh gcc-x.xx..

    ```


    To check which version of GCC you have, use the following command:


    ```

    [root@master]# gcc -v

    Reading specs from /usr/lib/gcc-lib/1386-redhat-linux/egcs-2.91.66/specs

    gcc version egcs-2.91.66 1990314/linux (egcs-1.1.2)

    ```


    > Note: Several bugs have been found and fixed in the GNU Compiler Collection
    snapshot that shipped with Red Hat Linux 7.0. For RH Security fixes, bugs, and
    package enhancements, go to:

    http://www.redhat.com/support/errata/


    After the gcc, you can proceed to the MPICH installation.


    # 8.1.2 PGI Workstation code


    The PGI Workstation is a full suite of parallel F77, F90, HPF, C and C++ compilers
    and development tools. The release we used was v.3.2; you can obtain it from:


    ```

    http://www.pgroup.com

    ```


