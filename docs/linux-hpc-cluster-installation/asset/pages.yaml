  md: '# 3.1 Hardware


    The IBM Cluster offering is built on the xSeries x330 and x340 platforms. In this
    chapter, we discuss all the hardware components and technologies used to build
    an IBM @server xSeries Linux Cluster Solution, from node network architecture
    and components.


    # 3.1.1 Head node


    Head node is a generic term which has been in use for a fair amount of time. We
    are actually trying to move away from the term, because it is not very descriptive.
    However, as a generic term, it is very appropriate.


    As discussed in Chapter 2, “General cluster architecture” on page 11, the head
    nodes generally provide one or more of the following functions:


    +   * User node and control node

    * Management node

    * Storage node


    The head node or nodes are typically built using x340s, also known as a 4500R.
    In a small cluster, say eight compute nodes, all of the functions can be combined
    in one head node. In larger clusters, the functions will probably be split across
    multiple machines for security and performance reasons. The control of the cluster
    is performed from one or more of the head nodes.


    The x340 is configured similarly to the compute node, along with additional high-availability
    features, such as hot-swap, redundant power, and ServerRAID adapter. We typically
    configure the x340 with a hardware RAID 5 array consisting of six 18 GB slim height
    drives for 90 GB of usable storage. The IBM ServerRAID adapter has Linux support,
    including an IBM-written general public license (GPL) in the Linux kernel, a native
    Linux Server RAID Manager utility for creating and managing RAID arrays, an SNMP
    agent that monitors and sends alerts, a client-server remote management agent,
    and command line utilities that allowed automated remote management through scripts.


    The x340 takes 3U in a rack. It has up to two CPUs and dual inline memory modules
    (DIMMs). It has two PCI busses with three slots and one 32-bit with two slots,
    making a total of five PCI slots. We can install up to six hard drives, two natively
    and three more with an expansion kit. These drives can be configured in a RAID
    array with the optional ServerRAID adapter.'
  merge: -1
  pgno: 59
- img_proc: true
  md: '# 3.1.2 Compute nodes


    The compute nodes form the heart of the cluster. The user, control, management,
    and storage nodes are all designed in support of the compute nodes. It is on the
    compute nodes that all computations are actually performed. These will be logically
    grouped, depending on the needs of the job and defined by the job scheduler. The
    compute nodes are typically built using the x330.


    The x330 features two Pentium® III processors in a 1U form factor, a 133 MHz Front
    Side Bus, two 64 bit PCI slots, and an onboard Service Processor. The 64-bit PCI
    slots allow the server to take advantage of the bandwidth capabilities of the
    Myrneret 2000.


    The x330 takes up only one unit or 1U in a rack. In 1U space, we have two hard
    drives, two CPUs, four DIMM memory slots (allowing up to 4 GB of memory) and two
    PCI card slots. This is a typical compute node configuration.


    # 3.1.3 Management


    Before looking at the software elements of the cluster, we need to discuss hardware
    components of the cluster that are used for its management.


    Cluster management begins with our ability to control the machines in the cluster.
    Clearly, it is possible to walk around and push a power switch in order to power
    off all. However, this is often not practical, and for certain tasks, a higher
    level of control is needed. There are three components to help us to deal with
    issues:


    +   * Terminal server

    * ASM/SPN network

    * KVM switch


    # Terminal Server


    The terminal server is a device that connects many terminals to a local area network
    (LAN) through one network connection. It provides serial connectivity to the network
    for serial devices and printers.


    We recommend using a terminal server in the cluster for two reasons:


    +   * Access to the cluster machines in case you cannot get access via the LAN.
    For example, it may be down for maintenance.

    * Medium access control (MAC) address collection. If you do not have a layer 2
    switch capable of this, the Equinox terminal Server may allow you to get the MAC
    addresses for the installation node.'
  merge: -1
  pgno: 60
- img_proc: true
  md: 'We use an Equinox ELS Terminal Server in our lab. It offers:


    +   - Local area transport (LAT) and Transmission Control Protocol/Internet Protocol
    (TCP/IP) support

    - ELS Server Features

    - Support for TCP/IP and DEC LAT protocols

    - Built-in parallel port

    - Multi-session support

    - Support for NetWare™ IPX print servers


    The terminal server is an optional component of the cluster. It is not vital for
    basic cluster function, but its presence is useful.


    Please visit the Equinox web site http://www.equinox.com/ for more information.


    # Service Processor Network


    The onboard Service Processors (SP) of xSeries machines allow for remote power
    management, environmental monitoring, alerts and remote BIOS. They are linked
    together to form Service Processor Networks, which are created from two elements.
    These are:


    # Advanced system management (ASM)


    Each node has a chip set called the advanced system management processor. This
    is sometimes referred to as the rancher chip. Working with the hardware instrumentation
    and xSeries systems management software, ASM processors are the key to problem
    notification and resolution. They provide the system administrator with complete
    remote management of a system, independent of the server status. The processors
    simulate a cluster within a computer, keeping the server up and for your critical
    applications.


    # Advanced Systems Management Adapter (ASMA)


    The ASMA card (sometimes called a Wiseman card) is a peripheral interconnect (PCI)
    adapter which allows you to connect to a local area network (LAN) or modem from
    virtually anywhere for remote management. Up to 11 ASMA processors are daisy chained
    and then connected to the ASMA card. Each ASMA adapter is externally powered,
    so it is not dependent on the status of the host machine. The ASMA card is then
    connected to the management network so that the code can be controlled and alerts
    forwarded.


    For more information about ASM/SPN, refer to the IBM Netfinity Advanced Systems
    Management white paper, found at:


    http://www.pc.ibm.com/us/eserver/xseries/'
  merge: -1
  pgno: 61
- img_proc: true
  md: '# Keyboard, video, and mouse (KVM) and the crash cart


    The x330 has a built-in capability for a KVM switch. To use this function, simply
    daisy chain the unit''s KVM ports and then connect them to a central Apex KVM
    switch. This allows for a high level of control in displaying the panel of one
    node by pressing a button on the front of the x330. The head nodes will also be
    connected directly into the KVM switch. Pressing the Screen on the master console
    will bring up a menu and allow you to select the desired unit, either of the head
    nodes or the entire daisy chain of x330s. If you select the daisy chain, you can
    then press the NumLock key, followed by the number of the desired unit on the
    daisy chain; then press the Enter to select that unit.


    In the event the KVM switch is not used, the next alternative is to use a crash
    cart. In this environment, the keyboard, mouse, and video display are kept on
    a cart with wheels. When required, the cart is wheeled over to the desired node
    and connected to the respective ports to provide KVM functions. The need of a
    crash cart has largely been obviated by the development of the x330 with its built-in
    KVM features.


    # 3.1.4 Network


    Networking in clusters usually needs high bandwidth, high speed, and low latency.
    The most demanding communication occurs between the compute nodes. This section
    presents the protocol and technologies used to build a cluster solution.


    # Fast Ethernet


    Fast Ethernet and TCP/IP are the two standards largely used for networking. They
    are simple and cost-effective, and the technology is always improving.


    Fast Ethernet works with a 200 MHz Intel Pentium Pro based machine used for a
    Beowulf node, and can operate at either half-duplex, or full-duplex. With full-duplex,
    data can be sent and received at the same time.


    Full-duplex transmission is deployed either between the ports on two switches,
    between a computer and a switch port, or between two computers. Full-duplex requires
    a switch; a hub will not work.


    # Gigabit Ethernet


    Gigabit Ethernet uses a modified version of the American National Standards Institute
    (ANSI) X3T11 Fibre Channel standard physical layer (FC-0) to achieve Gigabit per
    second bandwidth.'
  merge: -1
  pgno: 62
- img_proc: true
  md: 'Gigabit Ethernet supports multi and single mode optical fiber and short haul
    copper cabling. Fibre is ideal for connectivity between switches and servers and
    can reach a greater distance than copper.


    Researchers have observed that the most significant overhead is the time required
    to communicate between CPUs, memory, and I/O subsystems that are directly connected
    to the network, and that this communication time may exponentially in a Beowulf
    cluster.


    With the increase of PCI bus capability, the Gigabit Ethernet media is usable
    in a Beowulf cluster, as it can provide more bandwidth. At this point, however,
    the bottleneck becomes the protocol used for communication.


    Some Parallel libraries, as local area multicomputing (LAM) and MPICH, use the
    Transmission Control Protocol/User Datagram Protocol (TCP/UDP) socket interface
    for communicating messages between cluster nodes. Even though there has been a
    great effort to reduce the overhead incurred in processing the Transmission Control
    Protocol/Internet Protocol (TCP/IP) stacks, this is still one of the factors affecting
    performance.


    For more information on this subject, see The Failure of TCP in High - Performance
    Computing Grid, found at: http://www.sc2000.org/techpapr/papers/pap.pap174.pdf


    So there is a need to develop something new. Currently, for example, we use the
    Virtual Interface Architecture (VIA) used by Giganet.


    # Virtual Interface Architecture (VIA)


    VIA is a mechanism that bypasses the layers of the protocol stack and avoids intermediate
    copying of data; these are two major impediments to network performance during
    the sending and receiving of messages. It also allows for lower CPU utilization
    by the communication subsystem.


    VIA is based on two interfaces:


    +   * Software

    * Hardware


    VIA is portable between computing platforms and network interface cards (NIC).


    A new version of MPICH libraries has been created that performs well on Giganet
    adapters using VIA (MVICH).'
  merge: -1
  pgno: 63
- img_proc: true
  md: '# Myrinet and GM


    Myrinet is a high-performance, packet communication and switching technology designed
    around simple, low-latency blocking switches. One limitation is that the switches
    are incrementally blocking.


    Myrinet has a customized protocol. It provides a second processor that does much
    of the protocol work, avoiding interruptions to the primary processor.


    Some of Myrinet''s characteristics are:


    +   - Full-duplex 2+2 Gigabit/second links, switch ports, and interface ports.

    - Flow control, error control, and heartbeat continuity monitoring on every link.

    - Low-latency, cut-through, crossbar switches, with monitoring for high-availability
    applications.

    - The network capability to scale to tens of thousands of hosts, with network-bisection
    data rates in Terabits per second and alternative communication paths between
    hosts.


    Packets may be of any length, and thus can encapsulate other types of packets,
    including IP packets, without an adaptation layer. Each packet is identified by
    type, so that a Myrinet, like an Ethernet, may carry packets of many types or
    protocols concurrently.


    GM is a message passing system for Myrinet networks and has replaced the MyAPI
    software. The GM package is based on several components, such as drivers, API,
    and libraries.


    Myricom''s Myrinet software support is distributed as open source. Please refer
    to the Myricom web site http://www.myri.com/ for further information.'
  merge: -1
  pgno: 64
- img_proc: true
  md: '# 3.2 Software


    In order to build an operational cluster, you will need several software components,
    including an operating system, drivers, libraries, compilers, and management tools.
    This section presents the software products normally used to build an IBM @server
    xSeries Linux Cluster Solution.


    # 3.2.1 Operating system


    Linux is the UNIX-based operating system used primarily in a Beowulf cluster.
    One of the reasons for its success in Beowulf clusters is because the Beowulf
    software and drivers are in continuous evolution, hence the need for an open source
    operating system.


    We use Red Hat 6.2 in our cluster because many of the libraries and tools have
    been written and tested based on that release.


    # Installation


    The installation software is responsible for facilitating the installation operation
    of the compute nodes. Our solution is based on using the Pre-Execution Environment
    (PXE) for remote booting, and Kickstart for the installation. It may be possible
    to use ALICE (Automatic Linux Installation and Configuration Environment) instead
    of Kickstart in the future.


    # PXELinux


    PXELinux is a program for booting off a network server using a boot PROM compatible
    with the Intel Pre-Execution Environment (PXE) specification.


    It allows for a level of control of the boot process prior to actually loading
    a kernel. Using PXE, or more specifically, PXELinux, we can control the operation
    of the boot process from a management node. If no changes are required, simply
    tell PXELinux to boot from the hard drive. However, if we wish to reload the node
    from scratch, we can tell the node to boot from the network. If we wish to rebuild
    one or all of the nodes, we can use Red Hat Kickstart to provide an automated
    installation of the nodes.


    PXELinux is part of syslinux, which is available at:


    ```

    ftp.kernel.org

    ```


    # Red Hat Kickstart


    Kickstart is a system installation and customization program developed by Red
    Hat. It allows clients, as compute nodes, to be completely installed remotely
    by a server without the need for manual interaction. xCAT configures and invokes
    KickStart during the installation of compute nodes.'
  merge: -1
  pgno: 65
- img_proc: true
  md: 'For more information on KickStart please go to:

    http://www.linuxdoc.org/HOWTO/KickStart-HOWTO.html


    # Advanced Linux Installation and Configuration Environment (ALICE)


    ALICE is a tool based on scripts and programs to customize installations files
    and operations. ALICE works in combination with YaST (Yet another Setup Tool),
    the SuSE installation and administration utility. YaST will partition and format
    the hard disk and then install the selected packages. Afterwards, ALICE takes
    control and modifies the target''s system configurations files: Add users and
    groups and enable/disable services.


    # File systems


    Another important issue regarding operating systems is the available file systems.
    We have to consider different types of file systems, each suitable for different
    scenarios. First, we look at traditional file systems and afterwards at some distributed
    file systems.


    # Local file systems


    Most of the current Linux installations use the traditional Linux file system
    ext2 since it proves very reliable performance for most purposes.


    There are performance issues in ext2 file systems when dealing with a large amount
    of small files. Furthermore, there is a demand for handling files larger than
    2 GB that is not provided by the regular ext2 file system. There is a kernel patch
    for ext2 that enables it to support files larger than 2 GB, but it requires your
    application to be rebuilt against large file functions providing libraries.


    What are the new file systems? Currently, there is one, or less enterprise-ready,
    file system available. It is called ReiserFS and is based on balanced trees, giving
    a huge performance increase for most scenarios. Additionally, it supports journaling
    and allows faster restart after a system crash or power outage. It also supports
    file systems larger than 2 GB.


    Other file systems addressing the same issues are JFS from IBM, XFS from SGI,
    and ext3, an enhanced version of ext2 that supports journaling. As all of those
    file systems are not available for daily production use, we will not cover them
    in great detail.


    # Network File System (NFS)


    NFS is the best known network file system. Beowulf clusters always use the NFS
    protocol to provide a client/server distributed file system architecture and Remote
    Procedure Call (RPC) calls to communicate.'
  merge: -1
  pgno: 66
- img_proc: true
  md: 'The server exports files to a client that accesses them as if they are local.
    NFS does not save information about the client that made the request, so every
    client is considered independently. Therefore, they must contain all the information
    necessary for execution each time they make a call to the server. This causes
    large messages and consumes a lot of network bandwidth. The advantage, however,
    of this system is that if the client crashes, the server does not hang, but continues
    working and satisfying all the other requests.


    NFS has some well-known performance and scalability issues. Some of those solved
    NFSv3, a newer version and implementation of NFS, also available for Linux (Kernel
    2.4.X). Nevertheless, there is increasing demand for better file systems.


    # Andrew File System (AFS)


    AFS was originally developed by Carnegie-Mellen University and was later turned
    into a commercial product of Transarc, now part of IBM. In 2000, IBM made its
    AFS enterprise file system product available to the open source community under
    the IBM Public License (IPL).


    AFS is a very scalable, highly availability secure file system with a very robust
    data management model. Lacking a stable Linux AFS server, this created the need
    for a second platform, such as AIX, running the AFS.


    The use of AFS makes the most sense if you already have an AFS cell as part of
    your environment that you want to integrate into your cluster.


    For further information regarding AFS please visit:


    ```

    http://www.transarc.ibm.com/

    ```


    Besides the IBM AFS client, there is another free AFS client implementation for
    Linux. It is called the ARLA Project, and it can be found at:


    ```

    http://www.stacken.kth.se/projekt/arla/

    ```


    # Global File System (GFS)


    GFS is a shared disk file system for Linux. It is designed to support multi-client
    journaling and rapid recovery from client failures. All nodes are equal, and no
    server may be a bottleneck or a single point of failure.


    The GFS nodes physically share the same storage, Fibre Channel, or shared small
    computer system interface (SCSI) devices. The file system appears to be local
    on each node and GFS synchronizes file access across the cluster.


    GFS is available from http://www.globalfile-system.org/ under the GNU Public License
    (GPL). Further documentation and information can also be found there.'
  merge: -1
  pgno: 67
- img_proc: true
  md: '# General parallel system (GPFS)


    Capable of scaling to nine TB, GPFS is being ported to Linux, where it will be
    known as Blue Hammer.


    At the center of Blue Hammer is the SP supercomputer''s parallel system support
    program (PSSP) cluster management software and GPFS.


    For more information on this issue, please refer to the following IBM Redbooks:


    +   - GPFS: A Parallel File System, SG24-5165

    - Sizing and Tuning GPFS, SG24-5610

    - PSSP 2.4 Technical Presentation, SG24-5173

    - PSSP 3.1 Announcement, SG24-5332

    - PSSP 3.2: RS/6000 SP Software Enhancements, SG24-5673


    PVFS is designed as a client-server system with multiple servers (called I/O daemons):


    +   - I/O daemons typically run on separate nodes (I/O nodes) in the cluster.

    - PVFS files are striped across the disks on the I/O nodes.

    - Application processes interact with PVFS through a client library.

    - The PVFS manager daemon handles operations such as permissions, checking for
    file creation, and open, close, and remove operations.

    - The client library and the I/O daemons handle all I/O without the intervention
    of the manager.

    - The I/O daemons and the manager do not need to be run on different machines.
    In fact, you may achieve better performance by running them on the same machine.


    The purpose of PVFS is to provide:


    +   - High-speed access to file data for parallel applications

    - Cluster-wide consistent name space

    - User-controlled striping of data across disks on different I/O nodes

    - Existing binaries that operate on PVFS files without needing to be recompiled'
  merge: -1
  pgno: 68
