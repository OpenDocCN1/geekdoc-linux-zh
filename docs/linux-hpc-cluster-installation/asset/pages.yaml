    # 6.4.4 attfp


    To support the TFTP for PXE, a tftp server must be installed on the management
    node. There are a number of different tftp servers available for Linux, including
    the one that comes on the Red Hat 6.2 CD-ROM. Unfortunately, many of these suffer
    from a number of issues, scalability being a particular concern. We have found
    the most reliable to attfp which can be obtained from:


    ```

    ftp://tftp.mamalinux.com/pub/atftp/

    ```


    The atftp package comes with no installation instructions, but the installation
    is fairly straightforward. We use the command:


    ```

    # tar xvzf attfp-0.3.tar.gz

    # cd attfp-0.3

    # make

    # make install

    ```


    Note that the make install command will overwrite the existing Red Hat ttfpd.
    This is unlikely to be a problem.


    Once you have installed the ttfpd, certain options need to be configured in /etc/inetd.conf:


    Although the documentation indicates attfpd will default to using /tftpboot, this
    does not seem to work, and must be specified manually.


    tftpboot


    Try adding this to order PXE clients if you experience ttfpd failures on boot.


    --no-blksize


    By default, attfpd expires after 300 seconds, logging a lot of information to
    syslog as it dies. If this setting is unsatisfactory, you can set this parameter
    to 0.


    --ttfpd_timeout


    Accordingly, the ttfpd line in /etc/inetd.conf to something similar to the following:


    ```

    tftp dgram udp wait /usr/bin/in.ttfppd in.ttfppd --no-blksize

    --ttfppd_timeout=0 /tftpboot

    ```'
