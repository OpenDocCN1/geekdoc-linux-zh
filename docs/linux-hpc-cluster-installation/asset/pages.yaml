  md: '# 8.2 Install MPICH to use either TCP/IP or Myrinet GM


    In this section, we will discuss how to install MPICH so you can use it with TCP/IP
    or Myrinet GM.


    # 8.2.1 Remove local area multcomputer/message passing interface


    To avoid conflicts with MPICH, you will have to remove the local area multcomputer/messaging
    passing interface (LAM/MPI) components that are installed as the defaults. To
    remove the component, use the following command:


    ```

    [root@master local]# rpm -e lam

    ```


    # 8.2.2 Configure mpimaker


    xCAT includes a command called mpimaker that simplifies the installation and configuration
    of MPICH. You can configure it to utilize elements like TCP/IP or Myrinet, symmetric
    multiprocessing (SMP) or uni-processing (UP), gcc or PGI compilers, ssh (Preferred),
    or rsh.


    The command mpimaker is located in /usr/local/xcat/build/mpimaker.


    > Attention:

    * If you use ethernet cards for IPC


    # 8.2.3 Configure MPICH to use TCP/IP


    In this section, we discuss how to configure MPICH to be compatible with TCP/IP.


    # Download and Install MPICH code


    The current release we used was version 1.2.1. It can be downloaded from:


    ```

    http://www-unix.mcs.anl.gov/mpi/mpich/

    ```


    The file you need is mpich.tar.gz, and the size of the file is about 9.5 MB.'
  merge: -1
  pgno: 148
- img_proc: true
  md: 'Note: Write down the release version; you will need it later.


