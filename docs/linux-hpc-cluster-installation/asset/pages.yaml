  md: '# Preface


    Few people who use computers have not heard of Linux®. Linux is at the heart of
    a revolution that is fundamentally changing many aspects of how software is written
    and delivered. It remains to be seen where this revolution will ultimately lead.
    Far less nebulous is the Linux penetration into the scientific calculation arena,
    or more specifically, its use in High-Performance Computing clusters.


    This redbook will guide system architects and engineers through a basic understanding
    of cluster technology, terms, and Linux High-Performance Computing (HPC) clusters.
    We discuss some of the design guidelines used when architecting a solution and
    on how to install and configure a Linux HPC cluster.


    This redbook documents the building of a Linux HPC cluster on IBM @server xSeries
    hardware. Using this approach, and building a type of Beowulf cluster, we can
    achieve dramatic performance at a fraction of the price of previous solutions.


    This redbook will also teach you the concepts and principals to build your HPC
    cluster. The installation process is streamlined and simplified by the extensive
    use of scripts. Management tools are provided to easily manage a large number
    of compute nodes that remotely use the built-in features of Linux and the advanced
    management capabilities of the IBM @server xSeries Service Processor Network.


    # The team that wrote this redbook


    This redbook was produced by the Blue Tuxedo Team, a team of specialists from
    around the world working at the International Technical Support Organization,
    Austin Center.


    Luis Ferreira (also known as “Luix”) is a Software Engineer at IBM Corp-International
    Technical Support Organization, Austin Center working in Linux and AI projects.
    He has 18 years of experience in UNIX-based operating systems, and holds a MSc.
    Degree in System Engineering from Universidade Federal do Rio de Janeiro, Brazil.
    Before joining the ITSO, Luis worked at Tivoli Systems as a Certified Tivoli Consultant,
    as a Certified IT Specialist, and at Cobra Brasil as kernel developer and software
    designer. His e-mail address is luix@us.ibm.com.'
  merge: -1
  pgno: 16
- img_proc: true
  md: 'Gregory Kattmann (also known as "Greg") is an IT Architect working for IBM
    Global Services, ITS, as a Subject Matter Expert in Linux Clusters. His, the Linux
    Global Solutions Group, is responsible for establishing Linux strategies and policies
    worldwide. Greg has 21 years of experience with IBM, the last 10 of which have
    been as a workstation and networking specialist. He has been involved with Linux
    and Linux High-Performance Computing clusters for the past several years. He earned
    his ET degree from NTS and his EE from CRE. His e-mail address is kettmann@ibm.com.


    Jensham is IT Specialist at the IBM Techline in Greenock, Scotland. He has more
    than three years of experience in xSeries and Netfinity servers from Post Sales
    Support and Technical Pre-Sales environments, He has been involved for four years
    with Linux and has worked for IBM for more than three years. His areas of expertise
    include networking, clustering, Fibre technologies and all things Linux. He is
    a Red Hat Certified Engineer (RHCE), Professional Server expert (PSS) and Microsoft
    Certified Systems Engineer (MCSE). His e-mail address is jhamsamo@ibm.uk.com.


    Andreas Thomas is a specialist and consultant at the EMEA Center of Competence
    in Boehlingen, Germany. He has eight years of experience in the Linux field and
    still remembers when a Linux distribution was delivered on a floppy disk. He has
    studied and worked at Unix for Years of expertise include UNIX server support
    and consulting (Linux/Intel, Linux/390, AIX, and Solaris). His current job responsibility
    focuses on technical sales support for xSeries Linux clustering solutions. He
    holds a degree in Computing Science from Berufsakademie Sachsen, Staatliche Studienakad
    Dresden, Germany. His e-mail address is a.thomas@de.ibm.com.


    Steve Hill is a High Performance Computing specialist working in Hinsley, England.
    He has six years of experience with Linux and remembers waiting minutes for the
    1.3 kernel to compile on a 48. His current responsibilities involve providing
    services as a consultant for IBM SP2s and Linux clusters. He has built and installed
    a number of Linux clusters, including some for trade shows. His email address
    is s_hill@ibm.uk.com.


    Walter Bernocci is an IT Specialist at the xSeries Pre-Sale Support team in Italy.
    He has been working for 12 years at IBM. Since March 2000, he has been fully dedicated
