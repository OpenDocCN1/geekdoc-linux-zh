  md: '# 7.4 Setup rangers (stage3)


    Once you have the MAC addresses of the nodes, the next stage is to set up the
    ASM network. This uses a similar process to getmacs; if that worked without any
    problems, this should be fairly straightforward.


    First, you must configure the DHCP server with the MAC addresses of the nodes,
    since the ASM setup sets the name to the host name of the node''s IP. Run the
    makedcp command (that is different from the gendchcp command used), then use the
    nodeset command to set the nodes to stage3.


    ```

    # /usr/local/xcat/bin/makedcp

    # /usr/local/xcat/bin/nodeset all stage3

    ```


    The management is now ready for ASM setup. Press the reset button on all the nodes
    and their rangers should be automatically set up. You can monitor the progress
    of the setup by running:


    ```

    # /usr/bin/watch /usr/local/xcat/bin/nodeset all stat

    ```


    The nodes will start out at stage3 and as they complete, setup will change over
    boot. If any of the nodes fail to change over, they might simply need resetting
    again when the network is quieter; do not forget to check the nodes and syslog
    for errors. The most likely causes of persistent problems are corrupted dhcp.conf
    or a named error.


    When all the nodes have reverted to boot, check to see if the SPN setup completed
    correctly by running:


    ```

    # /usr/local/xcat/bin/rinv all serial

    ```


    Ensure all nodes show up and with a unique serial number.


    # 7.5 Install first node


    The nodes are now ready to be installed. It is a good idea to install a single
    node before installing the entire cluster so any problems can be easily identified.


    Nodes are installed using the install command or winstall if you want to watch
    the install. For example:


    ```

    # /usr/local/xcat/bin/winstall node1

    ```


    Note that winstall uses rcons, so it may take a little while before any output
    appears in the panel.'
  merge: -1
  pgno: 140
- img_proc: true
  md: 'If something fails, it is most likely NFS or a problem caused by an error in
    the xCAT tables, since DHCP and TFTP have been tested by now. Again, check the
    consoles and logs for more information, paying particular attention to the console
    log. If you ran install, there may be partially obscured messages on the panel;
    you can read these from the console log if you need to.


    # 7.6 Install remaining nodes


    Once you know the install process works for one node go ahead and install the
    remaining nodes. If you do not have many nodes, it is best to use install for
    this process, since you can watch all the nodes installing at once. To open console
    panels and install all nodes except node1, use the command:


    ```

    # /usr/local/xcat/bin/install all,-node1

    ```


    As with stage3, you may want to watch to verify when all the nodes have been installed.


    # 7.7 Post install


    Once all the nodes are installed, the last thing you need to do is generate the
    ssh global known hosts file. First, verify that all the nodes are up and running
    with the command:


    ```

    # /usr/local/xcat/bin/ping all

    ```


    If any nodes come back with noping, they may not have finished rebooting after
    the install or may have gone wrong at reboot. Have a look in that node''s console
    log for errors.


    Collect the hot keys for all the nodes using makeshghkh:


    ```

    # /usr/local/xcat/sbin/makeshghkh all

    ```


    You should see a message from all the nodes, but it is difficult to see if it
    succeeded or not. Check the file /usr/local/xcat/etc/gkh and make sure there is
    an entry for all the nodes. If not, run makeshghkh again for the missing nodes.
    If it continues to fail, there may have been a problem with the nodes installation;
    check the console log for possible error messages.


    You can verify that the keys are correct using the psh command, which relies on
    ssh. Dist the hostname command to all the nodes and ensure they respond without
    errors. See Example 7-12 on page 121 for details.'
  merge: -1
  pgno: 141
