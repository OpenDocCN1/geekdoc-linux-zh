  md: '# Linux HPC Cluster Installation


    ![](img/ccdee7f1b1183ba808fa8386b0cb1315_253_0.png)


    Cluster installation using xCAT - xCluster Administration Tools


    This redbook will guide system architects and engineers towards a basic understanding
    of cluster technology, terminology, and the installation of a Linux High-Performance
    Computing (HPC) cluster (a Beowulf type of cluster) at IBM @server cluster.


    Linux clustering based on IBM @server xSeries


    This document focuses on xCAT (xCluster Administration Tools) for installation
    and administration. All nodes and components of the cluster, are installed with
    xCAT. This tool is a collection of scripts, tables, and commands used to build
    and administer a Beowulf type of cluster or a farm of replicated nodes. All xCAT
    components are explained in the appendices of the Redbook. Detailed procedures
    on how to install and configure a Red Hat operating system in the nodes of IBM
    @server xSeries HPC cluster are presented.


    Installing Red Hat with Kickstart and xCAT


    For architectural design, we present a generic cluster architecture, specifies
    for an HPC type of cluster, and the physical and logical components of an HPC
    cluster. A solution design guideline is presented as well, giving the key concepts
    and design principals to be used during the architectural and planning phases.


    INTERNATIONAL TECHNICAL SUPPORT ORGANIZATION


    BUILDING TECHNICAL INFORMATION BASED ON PRACTICAL EXPERIENCE


    IBM Redbooks are developed by the IBM International Technical Support Organization.
    Experts from IBM, Customers and Partners from around the world create timely information
    based on realistic scenarios. Recommendations are provided to help you implement
    IT more effectively in your environment.


    For more information: ibm.com/redbooks


    SG24-6041-00 ISBN 0738422789'
  merge: -1
  pgno: 253
