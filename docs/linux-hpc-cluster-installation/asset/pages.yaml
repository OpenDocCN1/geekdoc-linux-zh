  md: '# Summary


    # POVRay results


    If you want to compare your POVRay cluster results against other clusters, you
    can see some of the old skyvase.pov test results at:


    ```

    http://www.haveland.com/index.htm?povbench/index.htm

    ```


    Since most modern machines have very fast processors, the old test is usually
    obsolete. For a more complex test, check out some new results from chess2.pov
    at:


    ```

    http://www.tabsnet.com

    ```


    For detailed POVRay Rendering info and tips, go to:


    ```

    http://www.povray.org

    ```


    # Other tests


    For more complex testing, there is also Linpack, which is a good package to test
    and benchmark most aspects of a cluster. You can find it at:


    ```

    http://www.netlib.org/benchmark/

    ```


    For the High-Performance Computing TOP500 list go to:


    ```

    http://www.top500.org

    ```'
