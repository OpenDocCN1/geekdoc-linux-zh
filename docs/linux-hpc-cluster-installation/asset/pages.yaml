  md: '# 1.1 In the beginning


    Over the years there have been dramatic increases in computing power and capabilities,
    but none so dramatic as recently. Early mathematical computations were facilitated
    by lines drawn in the sand. This eventually lead to the abacus, the first mechanical
    device for assisting with mathematics. Much later came punch cards, a mechanical
    method to assist with tabulation. Ultimately, this led to ever more complex machines,
    mechanical and electronic, for computing.


    Today, a small handheld calculator has more computing power than available to
    the Apollo missions that went to the moon. Early computers used small toroids
    to store hundreds or thousands of bits of information in an area size of a broom
    closet. Modern computers use silicon to store billions of bits of information
    in a space not much larger than a postage stamp.


    But as computers become more capable, certain constraints will arise. Early computers
    worked with 8 bits, or a byte, to solve problems. Most modern computers work with
    32 bits at a time, with many dealing with 64 bits per operation, which is similar
    to increasing the width of a highway. Another method for increasing performance
    is to increase the clock speed, which is similar to raising the speed limits.
    So, modern computers are the equivalent of very wide highways with very fast speed
    limits.


    However, there are limits to the benefits that can be achieved by simply increasing
    the clock speed or bus width. In this redbook, we present an alternative approach
    to increasing computing power. Instead of using one computer to solve a problem,
    why not use many computers, in concert, to solve the problem?


    A computer is not just based on hardware. There is also the operating system and
    the software. There have noteworthy developments in operating systems that will
    help us in our quest for more processing power. A fairly recent development is
    Linux, an operating system with very robust multi-user and multi-tasking capabilities.
    Linux has the added advantage of being freely available and completely non-proprietary.
    The Linux source code is openly available, allowing a level of control and modification
    unavailable in the environment.


    In this redbook, we describe a procedure to build a Linux cluster, generically
    known as a Beowulf cluster, by using Linux running on IBM @server xSeries machine.
    Linux clusters use relatively inexpensive hardware and achieve results that rival
    the largest and most expensive computers available.'
  merge: -1
  pgno: 23
- img_proc: true
  md: 'The scope of this reread is to define how to use many computers, in concert,
    to solve a problem. There are many different approaches to this problem, with
    many different solutions. We will explore some of these solutions and describe
    their relative merits. However, the focus of this reread will be a set of detailed
    steps to set up an HPC cluster.


    First, we discuss some of the design guidelines used when architecting a High-Performance
    Computing Solution. This is followed by detailed procedures on how to install
    and configure a working HPC cluster.


    # # 1.2 Intended audience


    # # 1.3 Open source


    Before discussing clusters, it is important to address open source software and
    Linux, since this is the foundation on which our solution is built.


    In 1984 Richard Stallman, working for MIT, became distressed with the way the
    software industry was evolving. Equipment and software were once shipped with
    its source code. Now, software is usually sent in binary and proprietary formats.
    Stallman felt that this closed software defeated many of the mechanisms he felt
    were important to software''s continued growth. This concept was documented, much
    later, in The Cathedral and the Bazaar, by Eric Raymond.


    Later that year, Stallman quit MIT so he could pursue the development of software.
    He began developing new,"new". free software. He called the GNU project (a recursive
    acronym for "GNU''s Not UNIX") To protect this free software, Copyleft and the
    GNU GPL (GNU General Public License) were written. In addition, the OSF™ or Free
    Software Foundation was created to promote this software and philosophy. For more
    information on this subject, see:


    ```

    http://www.gnu.org/gnu/thegnupject.html

    ```'
  merge: -1
  pgno: 24
- img_proc: true
  md: 'Stallman began by creating a compiler (called the GNU C compiler or gcc) and
    a text editor (GNU Emacs) as a basis for further development. This has evolved,
    over time, to be a very complete suite of applications and infrastructure code
    that supports today''s computing environment.


    # 1.4 Linux


    Stallman''s project was still moving along nearly a decade later, yet the core
    code running the computer–was not ready.


    Then, in 1991, a Finnish student by the name of Linus Torvalds decided to write
    his own operating system. It was based on the concepts of UNIX®, but was entirely
    open source code. Torvalds wrote some of the core code. Then he did something
    quite original: he posted his code in newsgroup on the growing Internet. His development
    efforts were complimented by others around the world and the Linux kernel was
    born.


    Today''s Linux distributions combine the Linux kernel with the GNU software to
    create a complete and robust environment. In addition, many companies, such as
    Red Hat®, SuSE® or TurboLinux®, add their own installation scripts and special
    features and sell this as a distribution.


    # 1.5 Linux clusters


    This discussion extends beyond Linux clusters and encompasses clusters based on
    any operating system. Whenever you use two or more computers together to solve
    a problem, you have a cluster. However, this covers a tremendous amount of territory.
    This can be simplified by breaking clusters into increasing granular categories
    based on characteristics.


    All clusters basically fall into two broad categories: High Availability (HA)
    and High-Performance Computing (HPC). HA clusters strive to provide extremely
    reliable services. HPC is a cluster configuration designed to provide greater
    computational power than any one computer could provide.'
  merge: -1
  pgno: 25
- img_proc: true
  md: '# 1.5.1 High Availability (HA) clusters


    HA clusters are not easily categorized. Indeed, we are sure that many people can
    offer valid reasons for why a different logical structure of organization would
    be appropriate. Our logical structure of organization is based on function. For
    example, we organize a database cluster or a server consolidation cluster under
    the heading of an HA cluster, since their paramount consideration is usually high
    availability.


    Web clusters, while certainly an HA type of cluster, are often categorized by
    themselves, and we will discuss them in "Web clusters and Web farms" on page 5.


    In a typical HA cluster, there are two or fairly robust machines which mirror
    each other''s functions. Two schemes are typically used to achieve this.


    In the first scheme, one machine is quietly watching the other machine and waiting
    to take over in case of a failure.


    The other scheme allows both machines to be active. In this environment, care
    should be taken to keep the load below 50 percent on each node or else there be
    capacity issues if a node were to fail. These two nodes typically have a shared
    disk drive array comprised of either a small computer system interface (SCSI)
    or a Fibre Channel; both nodes talk to the same disk array.


    Or, instead of having both nodes talking to the same array, we can have separate
    arrays that constantly replace each other for fault tolerance. Within this subsystem,
    it is necessary to guarantee data integrity with file andor record locking. There
    must also be a management system in place allowing each system to monitor and
    control the other in order to detect an error. If there is a problem, one system
    must be able to incapacitate the other machine, thus preserving data integrity.


    There are many ways of designing an HA cluster and the list is growing.


    # Web clusters and Web farms


    Web clusters generally bring elements from many other computing platforms or other
    clusters and are often a hybrid of various technologies. A typical Web cluster
    is more a collection of machines creating an infrastructure than an actual cluster.
    We will explore a typical Web cluster by starting at the top, where it interfaces
    with the Internet, and finish at the bottom, where the data content is kept.'
  merge: -1
  pgno: 26
