  md: '# System requirements for downloading the Web material


    The following system configuration is recommended:


    +   - **Hard disk space:** 3 MB minimum

    - **Operating System:** An UNIX-based system, such as Linux or AIX

    - **Processor:** Any

    - **Memory:** 16 MB


    # How to use the Web material


    Create a directory on your system (/tmp for example), download the file to that
    directory and unzip the xCAT distribution file. You should also download the Kickstart
    configuration file to use as an example.'
