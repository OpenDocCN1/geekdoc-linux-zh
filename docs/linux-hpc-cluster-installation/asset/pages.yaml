  md: '# Installation experiences


    This appendix provides some real life examples of our experiences installing Linux
    Clusters. This is far less about the technical details of an installation and
    far more about the experiences we have shared and the fun we had.


    One of the first clusters was a small, eight node cluster. This was somewhat of
    a pilot project and everyone was paraded to see it. The first impressions were
    the most notable. Instead of a cluster, we had several tables set up with unbelievable
    number of cardboard boxes. Everything was shipped separately, whether it be additional
    memory, CPUs or the racks themselves. One larger box contained all of the memory
    modules, but in order to build the cluster, each box had to be opened, the contents
    inventoried, and the compute and head nodes assembled.


    It was very impressive to see all the components waiting to be assembled and obtaining
    all of those components was a large task. We cannot caution you enough about planning
    your cluster installation. It is an extremely good idea to assemble your equipment
    order. Get a peer to review it. After it is reviewed, you should go through and
    check it again.


    There are a lot of pieces that go into making a High-Performance Computing cluster
    and a little extra work up front can dramatically ease the burden of assembly
    later.'
  merge: -1
  pgno: 218
- img_proc: true
  md: 'It is also very important to track all of the parts and their status. Inevitably,
    one or more key components will be constrained and you will have problems procuring
    them. This is not as difficult as it is tedious. We recommend a little extra time
    for this step and advise you to keep careful track of the inventory. When nearly
    all of the parts have arrived, categorize the parts that are missing their importance.
    This will allow you to focus on obtaining these items most critical to your assembly
    of the cluster.


    We can not say it enough: You cannot plan often enough when building a cluster.
    In one 256 node cluster we built, we neglected to move the communication port
    jumper to the COM2 position. Although that task is fairly simple, multiplied by
    256 and with the added burden of removing each cover and possibly a PCI Adapter
    card, one small mistake was amplified into a major task. Planning and attention
    to detail can avoid a lot of unnecessary effort.


    To avoid this particular problem, we devised a staging table, where we have power,
    a keyboard, and a mouse. From here, we can easily open the machine and add the
    required components. Typically, we would label the node at this point. When we
    hook up the machine and flash the various BIOS. This can be done later, but it
    is easier to repair any problems at this stage, with the machine opened up and
    accessible. Once the machine''s BIOS have been flashed and checked out, we replace
    the cover and put it in a stack where it will wait for installation in the rack.


    Now comes the part, and it really is. Everything is still fairly messy, but there''s
    a neatness to assembling the rack that is very satisfying. Instead of haphazard
    piles of equipment everywhere, a cluster begins to evolve in front of you.


    One note on tools: If you do not have one already, we strongly advise you to get
    an electric screwdriver. It is beneficial when removing and replacing the covers,
    but it is almost required for assembling the equipment in the racks, for larger
    clusters.


    Once completed, your cluster should look something like Figure E-1 on page 199.
    This picture is actually half of a 256 node cluster. Each of the four racks, on
    either side, contain 32 nodes each. The center rack contains the head node(s),
    the KVM switch and, in this case, some of the Myrient switches. Notice the perforated
    tiles in front of the rack. These provide cool air which is pulled through the
    x330''s and vents out the back. For this reason, you cannot use a glass cover.
    We usually leave the front covers off; however, vented front covers are available.'
  merge: -1
  pgno: 219
- img_proc: true
  md: '![](img/ccdee7f1b1183ba808fa8386b0cb1315_220_0.png)


    Figure E-1 256 node cluster


    There is another thing to notice. There is exactly one Keyboard, Video Display
    and Mouse (KVM) for the entire 256 node cluster. This is actually a good thing.
    The entire cluster has been designed to be easily managed without any physical
    presence. However, during the build process, this single KVM can be a bottleneck,
    as everyone crowds around one and one person types. You should consider this when
    planning the installation of your cluster. It is difficult or impossible to double
    up on tasks and it should be assumed that only one person will be doing the actual
    installation.


    As we have discussed, this is a 256 node cluster and so far we have seen 128 of
    the nodes. Figure E-2 on page 200 shows the other 128 nodes. Instead of the console,
    the center rack contains the Ethernet Switching equipment; the large mass of cables
    are the Ethernet cables. This particular configuration used a set of patch panels
    on the bottom of each rack. A standard bundle was used to interconnect each 32
    node rack with a patch panel near the switch. The mass of cables shown are the
    patch cables interconnecting each rack''s patch panel with the switch, which is
    on top. Although this might sound difficult, it allows far better rack staging
    at another location. Recently, we have begun to include a small'
  merge: -1
  pgno: 220
- img_proc: true
  md: 'switch with each rack. Then the rack switch is tied in Gigabit Ethernet and
    a Fibre Cable. This further simplifies the rack to rack Ethernet cabling. Clearly,
    cable management is a large concern, and some thought should go into how you will
    manage the mass of cables in your particular environment.


    Also evident in E-2 is a crash cart. In this environment, a crash cart is not
    really necessary. However, since there is only one KVM on the entire cluster,
    having the crash cart allows a second person to be troubleshooting any hardware
    problems while someone is still building the cluster.


    ![](img/ccdee7f1b1183ba808fa8386b0cb1315_221_0.png)


    Figure E-2 Fibre cables


    In Figure E-3 on page 201 we have swung around to the back of the front rack (the
    back of the rack is shown in Figure E-1 on page 199). This is an early picture.
    If you look closely on the right side, you can see some black cables. It looks
    like two cables, a gap of six machines or so and then two more cables. These are
    the partially populated Myrinet cables, which we''ll show more closely in a moment.


    The Ethernet cables are on the left side of the cabinet (they are red in this
    case). These lead down to a patch panel at the bottom of the rack. As mentioned
    before, this allowed all of the internal cables to be installed at a staging area
    and greatly simplified the on-site Ethernet cabling.'
  merge: -1
  pgno: 221
- img_proc: true
  md: '![](img/ccdee7f1b1183ba808fa8386b0cb1315_222_0.png)


    Figure E-4 on page 202 is a closer view near the top. It is also at a later time,
    since the Myrinet cables are all connected. You can see them trailing off and
    exiting to the left. Just to the left of the Myrinet cables is a black cable daisy
    chain from one machine to the next. This is the KVM network.


    Near the top is a black object, sort of just hanging there. It is the dongle used
    to connect the ASMA card to the Service Processor Network. There will generally
    be two RJ45 connectors and two cables on these units. You will be plugging an
    Ethernet connector into one of the RJ45 jacks. If this does not work, you should
    switch to the other connector, since they are not the same.


    Just to the left of that, and only on the top machine, is the power connector
    for the ASMA card.'
  merge: -1
  pgno: 222
- img_proc: true
  md: 'Immediately to the left of the ASMA card and using black cables is the Service
    Processor Network (SPN). Each x330 has a cluster of four RJ45 jacks. The right
    two are the SPN in and out jacks. The left two are for the Ethernet. If you are
    viewing this book online, you can see the red Ethernet cable leaving just to the
    left of the black SPN cables. The SPNs form a daisy chain. The Ethernet cables
    run down to the patch panel.


    Finally, on the far left, is the power cord.


    ![](img/ccdee7f1b1183ba808fa8386b0cb1315_223_0.png)


    Figure E-4 ASMA and SPN cables


    202 Linux HPC Cluster Installation'
  merge: -1
  pgno: 223
- img_proc: true
  md: 'Figure E-5 shows the cabling to only two of the Myrinet switches. In a 256
    node cluster, you need six 128 port Myrinet switches to maintain full bisectional
    bandwidth. In this case, we had four switches in one rack. This led to an incredible
    amount of cabling in this rack. In future racks, as the clusters grow bigger,
    we will move to an environment similar to the Ethernet switches. Instead of using
    a centralized set of switches, we will place a 64 node switch in each rack. This
    will dramatically reduce the number of rack-to-rack cables needed.


    ![](img/ccdee7f1b1183ba808fa8386b0cb1315_224_0.png)


    Figure E-5 Myrinet cables


    Once the cables are run and neatly dressed, the mechanical installation is complete.'
  merge: -1
  pgno: 224
- img_proc: true
  md: This section was more about our practical observations encountered while building
    a cluster than about the technical issues. We hope you found this useful.
  merge: -1
