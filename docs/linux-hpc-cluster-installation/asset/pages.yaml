  md: "# Compute node installation\n\nThis chapter describes the preparation and installation\
    \ process of the first compute node and the installation of the remaining compute\
    \ nodes.\n\nWe talk about:\n\n+   - xCAT tables\n- Cluster Services\n  - xntpd\n\
    \  - DNS\n  - DHCP\n- MAC Addresses collection\n- ASMA Setup\n- Installation of\
    \ the first compute node of the cluster\n- Installation of the remaining nodes\
    \ of the cluster"
  merge: -1
  pgno: 130
- img_proc: true
  md: '# 7.1 Populate tables


    xCAT is almost entirely configured through a number of tables located in /usr/local/xcat/etc.
    Each of these is a plain text file that may be edited with your favorite text
    editor. Here we only discuss the most common use of these tables. A full reference
    may be found in Appendix B, “xCAT configuration files” on page 167.


    Before configuring the xCAT tables, make sure your /etc/hosts is up-to-date. This
    is used by a number of the xCAT commands and must contain the complete listing
    of all the hosts in your network.


    # 7.1.1 Site table


    The first xCAT table is called site.tab. This contains information about the environment
    that the cluster runs in. Example 7-1 shows the site file used in your lab.


    Example 7-1 site.tab

    | | |

    | rsh | /usr/bin/ssh |

    | rcp | /usr/bin/scp |

    | tftpd | /tftpboot |

    | tftpxatrout | xcat |

    | domain | cluster.austin.ibm.com |

    | nameservers | 192.168.0.254 |

    | net | 192.168.0.255.255.0 |

    | gkhfile | /usr/local/xcat/etc/gkh |

    | master | master |

    | pbshome | /var/spool/pbs |

    | pbsprefix | /usr/local/pbs |

    | pbserver | mgt1 |

    | scheduler | maui |

    | nisdomain | NA |

    | nismaster | NA |

    | xcatprefix | /usr/local/xcat |

    | timezone | US/Central |

    | offuc | -6 |

    | mapperhost | nodel |

    | maxrys | 10 |

    | clustervlan | eth1 |

    | serialmac | 1 |

    | dynamicb | 172.16 |'
  merge: -1
  pgno: 131
- img_proc: true
  md: 'Most of the fields are self-explanatory and many may be left at their default
    settings. Be sure and check any that you do not understand against Appendix B,
    "xCAT configuration files" on page 167, because it can be time-consuming to rectify
    mistakes in this file.


    # Attention:


    +   - net stanza must be 192.168.0:255... NOT 192.168.0.0:255...

    - dynamic stanza means class B network


    The domain stanza must match the one used in /etc/hosts. If you only want to use
    node short, you must still fill in this field; cluster would be one option.


    # # 7.1.2 Node list table


    The second xCAT table to edit is the node list. It contains a list of all the
    nodes in the cluster and the groups each node is a member of. As with many of
    xCAT tables, the first field must be the short name of the node. The second field
    is simply a separated list of groups that the node is a member of. Example 7-2
    shows the nodelist table used in our lab.


    ```

    Example 7-2 nodelist.tab

    node rack1,rn1,mgmas1,all

    node2 rack1,rn2,mgmas1,all

    node3 rack1,rn3,mgmas1,all

    node4 rack1,rn4,mgmas1,all

    ```


    The groups are simply for management convenience and may be specified in any way
    which you will feel to be useful. We have chosen to group the nodes on the basis
    of the rack they are (useful for multiple rack systems), their physical rack location,
    and the advanced systems management adapter (ASMA) they are connected to. You
    recall that due the way xCAT works, it is not possible to assign host names to
    the nodes based on their physical location. This is a way of partially working
    around that problem.


    Notice that all the nodes are a member of all the group. This group is configured
    in the same way as all the other groups; it would be possible, yet confusing,
    to define the all group as a subset of nodes. The group is convenient for management
    purposes and it is strongly recommended that it include the entire collection
    of nodes. A number of commands, defined later in this chapter, are specified based
    on this assumption.'
  merge: -1
  pgno: 132
- img_proc: true
  md: '# 7.1.3 Node resources table


    The next step is to allocate boot and install resources to the nodes. This is
    done with the node resources table. Example 7-3 show the noderes table used in
    our lab.


    Example 7-3 noderes.tab


    | TFTP = Where is my TFTP server? |

    | # Used by mkhdcp to setup /etc/dhcp.conf |

    | # NFS_INSTALL = Where do I get files? |

    | NFS_DIR = From what directory? |

    | POST_DIR = From what directory? |

    | NIS_SERVER = Where do I authenticate? |

    | NA=No NIS |

    | TIME_SERVER = Where do I sync my clock? |

    | #SERIAL Serial console (0, 1, or NA). |

    | #INSTALL_ROLL = Am I also an installation server? (Y or N). |

    | #|node/group TFTP,NFS_INSTALL,NFS_INSTALL_DIR,POST_DIR,NIS_SERVER,TIME_SERVER,SERIAL,INSTALL
    ROLL |

    | #|all master,master,install/rh62,/install/post,NA,master,1,N |


    We have defined one set of resources for the entire cluster, although this may
    not be desirable for larger clusters or those with different node types. If your
    cluster has multiple resource allocations, it is usually simplest to do this on
    the basis of node groups. You should have decided on the answers to all these
    questions up-front and well find that this will only need minimal changes.


    # 7.1.4 Node type table


    You now specify the types of node you wish to install in the node type table.
    Example 7-4 show the nodetype table used in our lab.


    Example 7-4 nodetype.tab


    | node1 compute62 |

    | node2 compute62 |

    | node3 compute62 |

    | node4 compute62 |'
  merge: -1
  pgno: 133
- img_proc: true
  md: 'This file specifies the Kickstart file that will be used to install the node.
    Since the kickstart file contains the post-installation script, this will affect
    the nodes configuration. The kickstart file is generated from the template file
    /usr/local/xcat/ks62/nodetypte with a number of values being automatically generated
    from compute62 and user62 from the XCAT tables. kstmp files are supplied. If you
    have any special requirements you may wish to modify these or create your own.


    # 7.1.5 Node hardware management table


    One of the key features of XCAT is its hardware management support. The node hardware
    management table details methods of hardware management are available to XCAT.
    Example 7-5 shows the node table used in our lab.


    Example 7-5 nodehm.tab


    ```

    #node power,reset,cad,vitals,inv,cons,bioscons,eventlogs,getmacs

    node1 asma,asma,asma,asma,conserver,asma,asma,rcons

    node2 asma,asma,asma,asma,conserver,asma,asma,rcons

    node3 asma,asma,asma,asma,conserver,asma,asma,rcons

    node4 asma,asma,asma,asma,conserver,asma,asma,rcons

    ```


    The example shows a typical example for our cluster of four x330s and will likely
    not need to be changed in that environment. Please see Appendix B, "CAT configuration
    files" on page 167 for information on all the possible values.


    # 7.1.6 ASMA table


    In order to utilize the advanced system management (ASM) network, xCAT needs to
    know its topology. This is configured in the ASM table. Example 7-6 shows the
    ASM table used in our lab.


    Example 7-6 asma.tab


    ```

    node1 mgmas1,node1

    node2 mgmas1,node2

    node3 mgmas1,node3

    node4 mgmas1,node4

    ```


    This table links the node host name to its corresponding ASMA card and ASM name.
    The first field is the IP host name of the ASMA card and the second is the ASM
    name of the node, which will always match its host name.'
  merge: -1
  pgno: 134
- img_proc: true
  md: '# 7.2 Configure cluster services


    Once you have configured xCAT, you must configure the services it relies upon
    to perform the installation. Most of these can now be automatically set up based
    on the information you just provided.


    # 7.2.1 xntpd


    In order to keep the clocks in sync in the cluster, we install a time server (xntpd)
    on the management node. If you have another time source, you might want to configure
    xntpd on the management node to sync to this. It is only important that the clocks
    are the same on all nodes, not that they tell the correct time. If you have no
    external time source, the default Red Hat configuration should work fine. To start
    the service, use the command:


    ```

    # /etc/rc.d/init.d/xntpd start

    # /sbin/chkconfig xntpd on

    ```


    # 7.2.2 Domain name system (DNS)


    Name server setup is likely to be very site-specific. If you plan to use real
    names for all the nodes in the cluster, it is important that you discuss with
    your network administrator how the nameserver will be configured and whether you
    should run the nameserver on the management node or not. Such details are beyond
    the scope of this redbook.


    xCAT requires that the nameserver be able to resolve the addresses of the nodes
    in the cluster. If you know how, you may choose to configure the nameserver to
    resolve addresses both within and without the cluster. Again, that is beyond the
    scope of this redbook. If you decide to configure your nameserver for all addresses,
    note that makedns generates the nameserver configuration file, named.conf. It
    is recommended that you run makedns first and only perform local customization.


    If you have correctly set your /etc/hosts and site.tab, configuring the nameserver
    for the cluster addresses should be a case of running makedns:


    ```

    # /usr/local/xcat/sbin/makedns

    ```


    makedns will restart your nameserver as part of its run. Verify that it worked
    by querying your local nameserver for addresses that are part of your cluster
    both by name and IP address. In Example 7-7, we use the host command to query
    the local nameserver (0 is more efficient than connecting to localhost).


    ```

    Example 7-7 Host command to query the local nameserver

    [root@master]# host node1.cluster.austin.ibm.com 0

    Using domain server 0.0.0.0:

    ```'
  merge: -1
  pgno: 135
- img_proc: true
  md: '```

    node1.cluster.austin.ibm.com has address 192.168.0.1

    nodel1.cluster.austin.ibm.com mail is handled (pri=10) by

    nodel1.cluster.austin.ibm.com

    [root@root ~] host 192.168.0.1 0

    Using domain server 0.0.0.0:

    1.168.192.IN-ADDR.ARPA domain name node1.cluster.austin.ibm

    ```


    If the above test failed, go back and check syslog (/var/log/messages) for any
    errors from the nameserver and verify the db. files makedns created in /etc. You
    may have an error in either site.tab or /etc/hosts.


    # 7.2.3 User ID/Network Information System (NIS)


    For job scheduling purposes, it is important that the user IDs from any user nodes
    are replicated across the cluster. xCAT includes support for NIS, although this
    support has been shown to suffer from scaling problems in larger clusters. The
    recommended way to distribute user IDs across the cluster is to copy /etc/passwd
    and /etc/group from the user node to all compute nodes. Note that /etc/shadow
    should not be copied, since this would allow the users to login to the compute
    nodes; only the user IDs need be present to run batch jobs.


    If you wish to use NIS you should set it now according to your site environment.
    Otherwise, you should use pcp to copy the files once you have set up the user
    node.


    # Network file system (NFS)


    NFS is used in the cluster for the Kickstart install and distribute home directories.
    To make these processes work, we must add certain directories to the export list
    contained in /etc/exports. The configuration from our cluster is shown in Example
    7-8; there there must be no spaces between the address and the options.


    Example 7-8 /etc/exports


    ```

    /install/rh62 192.168.0.0/255.255.255.0(ro,no_root_squash)

    /install/post 192.168.0.0/255.255.255.0(ro,no_root_squash)

    /usr/local 192.168.0.0/255.255.255.0(ro,no_root_squash)

    /home 192.168.0.0/255.255.255.0(rw)

    ```


    You can also specify, by host name, if your network is non-contiguous, although
    this has a small performance penalty. For example:


    ```

    # /home node*(rw)

    ```


    Once you have modified /etc/exports, start NFS with the command:'
  merge: -1
  pgno: 136
- img_proc: true
  md: '```

    # /etc/rc.d/init.d/nfs start

    ```


    Verify the file systems have been correctly exported by querying the NFS server,
    as shown in Example 7-9.


    ```

    Example 7-9 Output of showmount -e

    [root@master ~] showmount -e

    Export list for master:

    /home 192.168.0.0/255.255.255.0

    /usr/local 192.168.0.0/255.255.255.0

    /install/post 192.168.0.0/255.255.255.0

    /install/rh62 192.168.0.0/255.255.255.0

    ```


    If the list does not match your /etc/exports, there is probably an error in the
    file. If the command fails completely, NFS is probably not working.


    Once NFS works, configure it to start at boot-time with the command:

    # /sbin/chkconfig nfs on


    # 7.2.4 Dynamic Host Configuration Protocol (DHCP)


    DHCP can be automatically configured using the gendcp script supplied with xCAT.
    Note that this script sets up an alias on your cluster adapter. If you specified
    eth1 for clustervian in site.tab, gendcp will create the alias eth1:0. Do not
    use this alias yourself or it will be overwritten.


    The gendcp command creates a skeleton of the dhcpcd.conf in /tmp:

    # gendcp


    The output from the script will suggest you edit dhcpcd.conf by adding IP addresses
    for other devices, such as your Myrinet switch.


    > Note: You need to remove unwanted network entries. In our lab we found some
    unwanted entries that were removed.


    To add an entry for a static host, you need to know the MAC address of the device.
    Make sure the entry to the stanza matches your management network. An example
    of a static host is shown in Example 7-10.


    ```

    Example 7-10 subnet declaration for dhcpcd.conf

    ## subnet declaration for management network

    subnet 192.168.2.0 mask 255.255.255.0 (

    ## Static host entry for the myrinet switch

    host mgmyril {

    hardware ethernet 00:60:dd:7f:94:b0;

    fixed-address mgmyril;

    ```


    116 Linux HPC Cluster Installation'
