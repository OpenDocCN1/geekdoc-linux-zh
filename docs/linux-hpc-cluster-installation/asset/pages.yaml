  md: '# 2.2.1 Cluster components


    Previously, we discussed parallelism and how applications should be designed for
    maximum efficiency in this environment. Now we will focus on the functions that
    make up the cluster.


    We divide the cluster nodes based on their function. It is important to note that
    these functions may reside on one or more machines. In a small cluster, all of
    the functions will likely be on one machine. In a larger cluster, you will likely
    divide the functions across many units. In very large clusters, a single function
    might be spread across several similar nodes. The following lists the node functions
    and structure:


    +   * User

    * Control

    * Management

    * Storage

    * Installation

    * Compute Node


    Later, we create the nodes and show you how those functions can be on the same
    node, and therefore use the same server or hardware.


    It is not essential that each function be on a separate machine; this is up to
    you. Based on budget and performance, you may decide to install either one function
    per server (or more), or to consolidate function onto just a few servers.


    # 2.2.2 User


    The user node is the gateway for the outside world to access the cluster. Users
    usually login to the user node machine and compile or run their jobs.


    You may want to have hardware redundancy on this machine node. If it fails, users
    may not access the cluster and use its powerful calculus capacity.


    The user node is an important part of the cluster and we recommend having hardware
    redundancy. If you do not have the user node up and running, your cluster cannot
    function, because there is no opportunity to run a job.


    The user node can also be on the same server that is used for management or installation.'
