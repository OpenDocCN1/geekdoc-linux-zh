- img_proc: true
  md: '# 2.1 Applications


    Applications are the first elements that should be considered buying any components
    for a Beowulf cluster. To that end, we introduce the concept of parallelism. To
    design a parallel application, we need to have a clear idea of parallel means.


    # 2.1.1 Parallelism


    A definition of parallelism, found in How to Build a Beowulf, by Thomas L. Sterling,
    et al., is:


    “Parallelism is the ability of many independent threads of control to make progress
    simultaneously toward the completion of a task.


    Another definition is:


    “The simultaneous use of more than one computer to solve a problem.


    Both definitions are true because parallelism may appear in several ways. However,
    its usual definition is based on the connection and use of the subsystem.


    Flynn’s taxonomy classifies parallel computing as:


    +   Single Instruction/Multiple Data (SIMD): When the processor executes the same
    instruction on multiple data at the same time.


    +   Multiple Instruction/Multiple Data (MIMD): When the processor executes different
    instructions on multiple data data.


    Visit http://csepl.phy.ornl.gov/ca/nodell.html for more information on Flynn’s
    taxonomy.


    CPUs may run independently or cooperate in solving a problem. In either case,
    they are usually under the control of another processor, which distributes the
    workload and collects results from them.


    This concept of parallelism is very important to keep in mind when designing selecting
    components for a Beowulf cluster.


    The following sections explain the three main constituents of parallel computing:


    +   Section 2.1.2, “Computer architecture” on page 14


    +   Section 2.1.3, “Software application program interface (API) architecture”
    on page 16'
  merge: -1
  pgno: 34
- img_proc: true
  md: 'Section 2.1.4, "Application architecture" on page 16


    # 2.1.2 Computer architecture


    In this section, we will consider the hardware, operating system, symmetric multiprocessing
    (SMP), and threads that are most helpful for working out the best design solution.


    Before reading this section, we suggest that you read the parallel computing store
    example at:


    ```

    http://www.linuxdoc.org/HOWTO/Beowulf-HOWTO-4.html

    ```


    It is a very good example on how a machine can approach a real parallel problem.
    Table 2-1 gives a summary of the possible scenarios.


    Table 2-1 Parallel computing store summary


    | OS | Multi-Tasking | Thread | SMP | Message Passing |

    |---|---|---|---|---||

    | MS DOS | NO | NO | NO | NO | |

    | UNIX | YES | NO | NO | NO | The CPU processes all the programs in the queue
    one at a time.

    | UNIX | YES | NO | NO | NO | The CPU dedicates an amount of time to execute part
    of the queue in the program. You have the impression that all programs are running
    at the same time, but the CPU can only perform one operation at a time.

    | UNIX | YES | NO | YES | NO | Similar to the previous description, but more jobs
    benefit from the CPU time because there are more CPUs available.

    | UNIX | YES | YES | YES | NO | A job can run faster because its divided divided
    more CPUs simultaneously, hence it has more CPU time. Amdahl''s law limits the
    application speed to the slowest sequential portion of the program. |'
  merge: -1
  pgno: 35
- img_proc: true
  md: '| OS | Multi-Tasking | Thread | SMP | Message Passing |

    |---|---|---|---|---|

    | UNIXa | YES | NO | YES | YES |


    a. The CPU may not necessarily be on the same machine.


    We now know that parallel computing is performed on machines with single or multiple
    CPUs and the hardware may be configured in several ways:


    +   - Distributed clusters of machines: Each node is an autonomous computer. They
    perform parallel programming using message passing, sending data from a program
    running on one node to a program running on another node using Single Instruction
    Multiple Data (SIMD) or Multiple Instruction Multiple Data (MIMD).


    +   Massively Parallel Processor machines (MPP): This has hundreds of processors
    programmed on the SIMD model. It includes a large array of processors with one
    instruction that controls the entire array by fetching each instruction and commanding
    all the processors in the array to carry each instruction out in parallel, with
    its own data.


    +   - Shared Memory Processors (SMP): These are computers with more than one CPU.
    You can run separate programs on each of the processors simultaneously or a single
    program in parallel across the processors.


    +   - Distributed clusters of local memory machines: This is a combination of
    the single CPU and SMP machines via shared memory.


    Beowulf may be considered a cluster of the SMP or local memory machines based
    on the MIMD model.


    Since SMP communicate via shared memory, you may think that this solution is better
    because an overhead introduced by a network does not occur. That is almost true,
    but you also have limited scalability because memory limitations; the machine
    cannot have infinite memory.


    This does not mean that you cannot have the Beowulf compute nodes with an SMP
    machine. We discuss this topic in more depth in Section 2.2.7, "Compute" on page
    24.'
  merge: -1
  pgno: 36
- img_proc: true
  md: '# 2.1.3 Software application program interface (API) architecture


    The API is the interface by which an application program accesses the operating
    system and other services. An API is defined at source code level and provides
    a level of abstraction between the application and the kernel to ensure the portability
    of the code.


    An API can also provide an interface between a high level language and lower utilities
    and services which were written without consideration for the calling conventions
    supported by compiled languages. In this case, the API''s main task may be the
    translation of parameter lists from one format to another and the interpretation
    of call-by-value and call-by-reference arguments in one or both directions.


    Parallel architecture may have:


    +   - Messages: May be implemented both for SMP and cluster machines; they require
    copying of data between nodes. Latency and the speed of this operation are the
    limiting factors. The advantage of writing code using messages on an SMP machine
    is that if you decide to move to a cluster, you can easily add a machine without
    have to recreate your application from scratch

    - Threads: They are designed to work fast on SMP machines because of shared memory.
    They do not need copying as messages do. The disadvantage is that you cannot extend
    them beyond one SMP machine because data is shared between CPUs. NUMA may allow
    that, but we are not considering NUMA architecture at present due to its expense
    and because Linux is not yet mature on platform.


    # 2.1.4 Application architecture


    Up to this point, we have considered machine hardware and APIs. Now, we discuss
    how to design the application. We show the logical sequence you follow to develop
    a good application and we explain how to resolve bottlenecks.


    # Batch and parallel jobs


    You have two kinds of jobs: a batch job and a parallel job.


    A batch job is an application that runs independently on each node of the cluster
    without the need to interact directly with the other nodes. This kind of application
    usually performs calculations on a set of data and at the end of the job passes
    the result to a control node responsible for collecting the results from all the
    nodes.'
  merge: -1
  pgno: 37
- img_proc: true
  md: 'A parallel job is a job that needs to talk with the other compute nodes of
    the cluster. This operation needs message passing and network activity.


    The reason for using a cluster is to speed up the execution of a program, but
    sometimes SMP machines are not in a cluster can be fast enough.


    With in mind, we should consider using a cluster in the following circumstances:


    +   - Problem size: If an application requires a lot of memory, a workstation
    might not be enough; a cluster might be a good solution.


    +   - Real time: Problems that need a faster response. In this case, you should
    also consider the number of users who access the cluster at the same time, if
    too many users share the cluster resources at the same time, the cluster performance
    will slow down and maybe a workstation could be adequate solution.


    +   - Is the application suitable for a cluster or do I need to port it?


    +   - How long does the application take to run?


    +   - How large is the application? Can I fit it onto any machine?


    If at this point we have decided to use a cluster and to use parallel computing,
    we need to create our application.


    # 2.1.5 Creating the application


    We need to clarify the concepts of concurrency and parallelism, because we have
    to be clear which part of the program can be parallelized.


    +   - Concurrency is a property of the application and defines the parts of the
    program that can be computed independently.


    +   - Parallelism is the ability to run concurrent parts of a program that are
    executed on separate processes at the same time. Parallelism is also a property
    of the hardware.


