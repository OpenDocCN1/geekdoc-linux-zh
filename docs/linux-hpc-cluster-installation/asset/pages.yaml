  md: 'Conversely, in a heterogeneous environment, it is important that as long as
    possible, unless the resource manager conserve its most powerful resources as
    long as possible, unless have been specifically requested. It also needs to provide
    some level of redundancy to deal with computational node failure and scale hundreds
    of jobs on thousands of nodes. Additionally, it should support hooks for the accumulation
    of multiple machines at different sites.


    # Job scheduler/policy manager


    The job scheduler takes the node and job information from the resource manager
    and produces a list. This list is sorted by the job scheduler and tells the resource
    manager when and where to run each job.


    The policy manager must have the flexibility to arbitrate a potentially complex
