  md: '# Parallel Virtual Machine (PVM)


    PVM is an application programming interface (API) that facilitates parallel computing.
    PVM is designed for use across clusters. If you code your application using the
    PVM API, then you have enabled it to run across a cluster. In one environment,
    one machine runs the PVM console. The PVM console is aware of all the nodes available
    to it. A job is submitted to the PVM console where it is distributed across the
    PVM nodes. Results are returned to the PVM console and recompiled into a complete
    result.


    PVM is very effective for jobs that can work in a loosely coupled environment,
    that is, that can work well in individual pieces. There are other solutions that
    are probably better suited for jobs with more stringent communication requirements.


    # Message Passing Interface (MPI)


    MPI specifications are commonly used where there is a demand for a logical structure
    layer to match a physical communication layer, for example when applications need
    to interact with several CPUs on different motherboards.


    MPI is a standard specification of message passing libraries for writing parallel
    programs. MPI standard was first released in 1994 from MPI Forum (MPIF). It specifies
    a portable interface for writing message passing parallel programs. For details
    about MPI and MPIF, please visit:


    ```

    http://www.mpi-forum.org

    ```


    Message passing has been widely adopted because of its close association with
    the physical attributes of SMP architecture. One or more processes run on each
    sequential processes, and they interact via messages conveyed across the physical
    network.


    MPICH is most widely portable implementation of the full MPI specification for
    a wide variety of parallel and distributed computing environments. The MPICH implementation
    is particularly popular on heterogeneous workstations and Beowulf clusters, where
    no vendor implementation is available. MPICH is freely available and can be downloaded
    from the Web at:


    ```

    http://www.mcs.anl.gov/mpi/mpich

    ```


    The message-passing programming paradigm assumes that an application is split
    into several tasks, each task having its own private data and addressing space.
    There is no shared global data between any tasks of the program. All synchronization
    and communication between the tasks is accomplished by explicit library calls
    between tasks, such as MPI_SEND or'
  merge: -1
  pgno: 54
- img_proc: true
  md: 'MPI_RECEIVE. Because the programmer has total control over task interaction,
    better scalability can be achieved by properly designing synchronization and communication
    between tasks, more so than with any other parallelization technique today.


    See http://www-unix.mcs.anl.gov/mpi/mpich/index.html for more information on MPICH
    and related topics.


    # OpenMP


    PVM and MPI are specifically designed to work across a cluster. OpenMP is designed
    to work within a symmetric multi processor (SMP) machine. In the SMP model, the
    processors have a shared memory address space, which can be used to transport
    messages. OpenMP uses this shared memory address space and is therefore very effective
    in the SMP environment. However, it is not useful in a clustered environment.
    In yet certain situations, OpenMP can be combined with MPI or PVM to utilize both
    SMP and clustered environments.


    # 2.4.4 Resource management


    From a user point of view, a cluster is like any other server or PC. The user
    logs in and runs interactive programs. This is true for any users that access
    the same cluster. You should discourage intense usage by individuals; if too many
    of the cluster''s resources are used at the same time, the performance will slow
    down. The scheduler is responsible for resource management in the cluster. Although
    it is possible to run a job that uses all available resources, a job typically
    uses fewer resources than that. With the scheduler, you specify how many nodes
    you need and how long your job is expected to run (with various other information).
    The scheduler arranges to run your job in the most expedient manner, trying to
    keep the cluster as fully utilized as possible at all times.


    # Job management


    Beowulf clusters require a mechanism to manage and schedule the jobs and workload
    from different users.The idea is to utilize any given time and hardware resources
    as efficiently as possible. This ensures optimized use of the cluster calculation
    time and will obtain results as quickly as possible.


    # Resource manager


    It is essential that the user is able to request an appropriate computational
    node for a given task. To allow this to happen, the resource manager coordinates
    the actions of all components in the batch system by maintaining a database of
    all resources, submitted requests, and running jobs.'
  merge: -1
  pgno: 55
