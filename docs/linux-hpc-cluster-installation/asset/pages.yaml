  md: 'Communication speed and latency between the nodes are the limiting factors
    of parallel performance, so it is very important that your application compensate
    for those factors. The cost of communication time must be worth the improved performance
    in computation. It is important to realize that fast processors do not equal better
    performance if communication is a bottleneck.


    I/O intensive applications, such as databases, need to transfer large amounts
    of data, so both CPU and I/O performance are required. This is unlike the scientific
    field where just high performance indexing based on the combination of CPU and
    the network are to be considered important.


    Anatholy F. Dedkov and Douglas J. Eadline, in Performance Consideration for I/O-Dominant
    Applications Parallel Computers, formulated this rule regarding processing speed:


    For two parallel computers with the same cumulative CPU performance index, the
    one which has slower processors (and a probably correspondingly slower processor
    communication network) has better performance for the I/O dominant applications
    (while all other conditions are the same except the number of processors and their
    speed),


