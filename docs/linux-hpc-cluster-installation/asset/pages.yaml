    # 6.4.3 PXelinux


    To start network installation, xCAT uses the network boot support of the onboard
    ethernet in the x330s. This network boot support relies on a vendor independent
    API known as the Pre-Execution Environment or PXE. More information on PXE can
    be found at:


    ```

    http://developer.intel.com/

    ```


    PXE relies on fetching a small boot loader from the remote server through ftp.
    The current version of xCAT uses the PXelinux boot loader, which is part of the
    SysLinux package, and can be downloaded from:


    ```

    ftp://ftp.kernel.org/pub/linux/utils/boot/syslinux/

