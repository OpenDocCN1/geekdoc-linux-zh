    # 6.2 Operating system installation


    The initial installation of the management node is a simple Red Hat 6.2 CD-ROM
    installation; however, there are a few things that require special consideration:


    +   ServeRAID driver For reasons of performance and/or reliability, the disks
    in the management node are often installed on a ServeRAID card. Unfortunately,
    the latest cards (4L and 4M) are not supported by the kernel on the Red Hat 6.2
    CD-ROM, so a Red Hat driver floppy must be used.


    +   File systems The management node stores a large amount of data as part of
    its administrative function, including a copy of the Red Hat CD-ROM and various
    logs. You must create at least the following file systems, and it is strongly
    recommended you create a /home file system if any users are to login to the management
    node:


    +   /boot 50 MB

    /install 2 GB

    /usr/local 1 GB

    /var 1 GB per 128nodes

    / 2 GB

    swap 1 Gb


    +   Hardware clock The xSeries Advanced System Management hardware is not time
    zone aware; alerts generated will be marked with the time from the hardware clock
    in the PC. This means that the hardware clocks in the compute nodes must be set
    to local time, not the more usual universal time coordinated (UTC). Since it is
    important that all the clocks in a cluster are kept in sync, the management node
    must also have its hardware clock set to local time.


    +   kernel-smp package Due to a feature of the xSeries hardware, the Red Hat 6.2
    installer does not automatically detect the second processor. In order to use
    a second processor, the'
