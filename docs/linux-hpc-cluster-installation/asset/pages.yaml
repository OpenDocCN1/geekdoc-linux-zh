  md: 'Because of the communication demands between compute nodes, network performance
    is a very important topic to be considered in a Beowulf type of cluster. Depending
    on the characteristics of the programs being executed, high-bandwidth, speed and
    (low-latency networks may be required. The network communication will determine
    the Beowulf-class system and the degree of complexity in building efficient programs.


    The primary bottlenecks of Beowulf are network bandwidth, latency, and global
    synchronization.


    # Technologies


    Let us at some of the hardware technologies and protocols useful for fulfilling
    the needs of a cluster inter process communication (IPC).


    There are several technologies and protocols usable for Beowulf communication:


    +   - Gigabit Ethernet


    +   - Gigabit Ethernet


    +   - Myrinet


    # Switch


    The demand for high bandwidths and the growing number of nodes on the same network
    are the most important reasons to use a switch. A switch accepts packets on twisted-pair
    wires from nodes and does not broadcast to all the connected nodes to determine
    who the receiver is, as a hub does.


    Instead, a switch uses the destination address field of the packet to determine
    who the recipient is and sends the packet to it alone. However, as the number
    of nodes in a cluster increase, one switch may not be enough.


    We must guarantee full bisection bandwidth, because each node must be able to
    talk to any other node of the same network without having routers in the way,
    because routers can affect the performance. If you need to build a 2N-port full-bisection
    switch using N-port full-bisection switches (for example layer 2 switches or Myrinet),
    you should use 6 N-port switches and 2N cables. We show how to interconnect switches
    to guarantee the full bisection bandwidth in Figure 2-3 on page 27.'
