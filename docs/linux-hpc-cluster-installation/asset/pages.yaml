  md: "# 4.4 Cluster questionnaire\n\nThis section will detail all of the questions\
    \ that should be asked when building a cluster. The questions have been compiled\
    \ from a variety of sources, including our Solutions Assurance Review process\
    \ and from our own experiences in building other clusters. We have tried to group\
    \ them in a logical manner. We suggest you make a copy or two of Appendix F, \"\
    Cluster questionnaire\" on page 205 and record your answers. It is important that\
    \ you discuss them thoroughly with the various groups involved.\n\n# Establishing\
    \ expectations\n\nThis section discusses issues which deal specifically with cluster\
    \ expectations. The success or failure of a project is often not measured as much\
    \ as achievements but by meeting expectations. These questions will try to establish\
    \ this expectation:\n\n+   - Have the cluster's performance requirements documented?\
    \ If so, please specify any required measurements.\n- Has the cluster configuration\
    \ been sized and verified to match the requirements?\n  - Application type\n \
    \ - Processor(s)\n  - Memory\n  - Cache\n  - Disk Storage / RAID (local)\n  -\
    \ Tape (backup)\n- Adapters\n- Have disk storage requirements and disk layout\
    \ been established? In particular, this should apply to the cluster's need for\
    \ connection(s) and the method of connection(s), external data / storage.\n- Will\
    \ this cluster require high speed, low latency IPC (Myrinet)?\n- What will the\
    \ cluster be for?\n- What are your expectations for this cluster in 10 words or\
    \ less?\n- What cool name did you assign your cluster?\n- Are you aware of any\
    \ conditions or issues which could impair your ability to implement this cluster?"
  merge: -1
