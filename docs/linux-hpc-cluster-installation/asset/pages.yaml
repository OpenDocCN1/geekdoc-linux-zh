  md: '# 4.1 General considerations


    It is important to thoroughly plan your cluster prior to assembly. Plan and build
    your cluster on paper and in your head, thinking through every possible aspect
    and problem. Walk through the location where the cluster will be placed and make
    sure you understand the placement. Discuss the cluster with facilities and make
    sure you have plenty of space, power, and cooling, and that the floor can hold
    the cluster. Make sure you understand any facility issues with scheduling to allow
    sufficient time and to ensure you do not disrupt normal operations.


    Next, think through the hardware and its configuration. Make sure you have discussed
    the cluster thoroughly with your network people. This should include security
    considerations, IP addresses, and the specific equipment that will be used. Also,
    consider what, if any, impact or expectations this will have on your production
    network.


    Finally, review the software you expect to install on your cluster. If you are
    using a standard configuration, this should be fairly routine. However, it is
    very common to include additional software that may have specific version requirements.
    Make sure you have reviewed all the software needed what specific versions might
    be needed and if there are any dependencies.


    In Section 4.4, "Cluster questionnaire" on page 66, we have assembled all of the
    questions which you should be asking or thinking about for building the cluster.
    Appendix F, "Cluster questionnaire" on page 205 includes blank sheets where you
    can record your answers. If this is an IBM Cluster Solution, many or all of these
    questions will be asked during the Solutions Assurance Review process.


    # Environment


    +   - Does your lab provide enough space for the whole cluster equipment?


    +   - Does its floor support the equipment weight?


    +   - Is there enough support for cable management (raised floor)?


    +   - Does your environment supply enough power?


    +   - Do you have enough power sockets supported by a matching fuse?


    +   - Is the air conditioning able to keep the temperature in the allowed range?


    +   - Did you think about security mechanism to control access to your cluster?


    # Hardware


    +   - Did you come up with a color, naming, and labeling scheme?


    +   - Do you have enough switches for supporting full bisection bandwidth?'
  merge: -1
  pgno: 79
- img_proc: true
  md: '+   - Do you plan to connect the cluster to the LAN?


    +   - Do you have the right configuration of machines according to their usage?


    +   - Did you choose the right kind or kinds of network to support your expected
    throughput and latency?


    +   - Does your cluster design reflect your application design and requirements?


    # Software


    +   - Have you check the general compatibility of the software with the hardware
    you are installing?


    +   - Are all the necessary drivers for the components available as stable versions?


    +   - Does the operating system support all the planned features?


    +   - Are the tools and libraries supported by the operating system distribution?


    +   - Did you check for version dependencies?


    The answers to the above questions should be written down and kept through the
    whole cluster installation for reference.


    Additionally, it is a good idea to visualize your cluster design; machines and
    virtual local area networks (VLANs) should be specified and highlighted with different
    colors for easy identification.'
  merge: -1
  pgno: 80
- img_proc: true
  md: '# 4.2 Configuration aids


    In this section we will name and point to some tools to help you with the questions
    asked in Section 4.1, “General considerations” on page 58, especially concerning
    the hardware architecture.


    # 4.2.1 Rack configurator


    To help up the hardware, a useful tool is the IBM @server xSeries Rack Configurator.
    As the name implies, this configurator helps you put together the rack design
    and place nodes and other equipment. It might even help you with the basic cabling
    required by the configured rack setup.


    The Rack Configurator generates a lot of information. This includes a printable
    list of parts that you need, where everything goes in the rack, recommendations
    on clearance, ventilation, and other relevant details. It also gives you a chart
    detailing the configuration resources, including the total and the amount of power
    needed to run the rack. For an example of this, Figure 4-1 on page 61.


    The Rack Configurator can be downloaded from:


    ```

    http://www.pc.ibm.com/support

    ```


    # 4.2.2 PC configurator


    As the rack configurator helps you with your rack configuration, the PC configurator
    guides you through the configuration of individual boxes and racks. This configurator
    can validate configurations and finally generate reports to be when ordering the
    equipment. This tool is a useful resource for pricing information. See Figure
    4-2 on page 62.


    You can download the PC configurator from:


    ```

    http://www.can.ibm.com/wwconfig/

    ```


    Please ensure that you always use up-to-date data files, which are also available
    from:


    ```

