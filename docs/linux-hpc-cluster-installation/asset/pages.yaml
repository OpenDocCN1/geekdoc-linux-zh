  md: "# Shut down all unnecessary services\n\nRed Hat 6.2 enables a number of daemons\
    \ that are not usually needed on the management node. For security and serviceability\
    \ reasons, it is advisable to disable any daemons that are not actually needed.\
    \ The following commands disable services that you would normally need to run\
    \ on a management node. You may choose to leave some of these services running,\
    \ although we do not recommend it.\n\n```\n# /sbin/chkconfig ampd off\n# /sbin/chkconfig\
    \ autofs off\n# /sbin/chkconfig httpd off\n# /sbin/chkconfig identd off\n# /sbin/chkconfig\
    \ isdn off\n# /sbin/chkconfig kudzu off\n# /sbin/chkconfig lpd off\n# /sbin/chkconfig\
    \ pmcia off\n# /sbin/chkconfig reconfig off\n# /etc/rc.d/runlevel | cut -c3 <<-\
    \ those are backticks\n```\n\n> Note: In addition, you may need to make a careful\
    \ analyze review of the services and proceed with the shutdown of the ones you\
    \ do not need in your installation.\n\nA large number of other services are started\
    \ through the inetd command, all of which are unused. Use the following commands\
    \ to disable these services by commenting out all the lines in the inetd.conf\
    \ and then reloading it.\n\n```\n# cp /etc/inetd.conf /etc/inetd.conf.SAVE\n#\
    \ perl -pi -e 's/\\#/\\g' /etc/inetd.conf\n# /etc/rc.d.init.d/inetd reload\n```\n\
    \n# Fix syslog\n\nThe management node collects syslog information from all the\
    \ other nodes in the cluster, but the default configuration for syslog is not\
    \ to listen for remote messages. To enable remote logging, syslog must be started\
    \ with the -r switch. Modify the daemon line in /etc/rc.d.init.d/syslog accordingly,\
    \ as in Example 6-4.\n\nExample 6-4 Extract from modified/etc/rc.d.init.d/syslog\n\
    \n```\n...\necho -n \"Starting system logger: \" \n  # we don't want the MARK\
    \ ticks\n  daemon syslog -m 0 -r\n```\n\nTo enable this change, restart the syslog\
    \ daemon:"
