  md: '# ## 2.4.1 Operating system


    An operating system performs several tasks, like recognizing input from the keyboard,
    sending output to the display panel, controlling peripheral devices, and keeping
    track of files and directories on the disk. Several operating systems can be used
    for creating a Beulf cluster and Linux is one of them. We normally interact with
    the operating system through a set of commands, for example, bash on Linux.


    # ## 2.4.2 File system


    The file system is a major part of any operating system; it is a repository for
    programs and data. The file system has two separate meanings in Linux:


    +   - It can be the concept of a root directory hierarchy, with different partitions
    mounted under the root directory. There is no letter, as with Microsoft® Windows,
    to identify the partitions, and everything is seen as a file.


    +   - It refer to the Specific formats for representing files or directories on
    a disk or memory, for example, EXT2 and JFS.


    In a cluster environment, it makes sense to talk about Distributed File Systems.
    Every Beowulf node, if not a diskless client, has a local file system that may
    need to access processes running on other nodes.That is the basic reason for using
    a distributed file system in a Beowulf cluster.


    A distributed file system has characteristics that distinguish it from a local
    file system:


    +   - Network transparency: Remote and local files can be accessed using the same
    system calls.


    +   - Location transparency: The file name is not bound to its location, because
    the server containing it is not part of the path.


    +   - Location independence: If the physical location of the file changes, its
    name does not necessarily change, because the name of the server containing it
    is not part of the file path.


    # ## Parallel file systems


    One critical area where Linux clusters were devoid of support was the parallel
    file system, which is essential for high performance I/O.'
  merge: -1
  pgno: 52
- img_proc: true
  md: 'To begin discussing parallel file systems, we must look again at local file
    systems. Local file systems work by creating a map between the storage devices
    on one side and files and directories on the other. Because of this, they see
    the devices as local and not shared, there is no need for the file system to enforce
    device sharing semantics. To improve the file system performance, we could improve
    caching and combine file system operations to reduce the number of disk accesses
    required for each file system operation.


    Current technologies allow multiple machines to share storage devices. File systems
    that allow these machines to simultaneously mount and access files on these shared
    devices are shared-disk file systems. This is in contrast to traditional distributed
    file systems where the server controls the devices and is the focus of all data
    sharing.


    A shared-device file system approach offers several advantages over traditional
    client-server file system approaches:


    +   - Increased file systems availability: There is no single point of failure
    on the host side because the file system is still accessible to the other hosts.


    +   - Load balancing: The client can access any set of data on any storage device.


    +   - Scalability in capacity, connectivity, and bandwidth can be achieved without
    the limitations inherent in network file systems, such as NFS, which are designed
    around a centralized server.


    Parallel file systems are vital for large I/O intensive applications. Global file
    systems (GFS) and parallel virtual file systems (PVFS) are currently available,
    and IBM plans to implement general parallel file systems (GPFS) on the Linux platform.


    # 2.4.3 Interprocess Communication (IPC)


    Interprocess communication (IPC) is the exchange of data between one process and
    another, either over the network or on the same computer. The exchange of data
    implies a protocol that guarantees that a response occurs at each request. The
    technologies presented in "Technologies" on page 26 are suitable for IPC. We recommend
    using a high bandwidth and low latency technology, such as Myrinet or Gigabit,
    with an application that uses message passing between between processors on different
    motherboards. Fast Ethernet is adequate where networking is not a bottleneck.
    IPC is an element that fits into the definitions of the levels and classes of
    a Beowulf cluster.'
  merge: -1
