    The control function may be located on one of the compute nodes or on any other
    machine responsible for controlling or managing the cluster.


    The control node provides services such as Dynamic Configuration Protocol (DHCP),
    Domain Name System (DNS), and Network File System (NFS). In addition, the portable
    batch system (PBS) and the scheduler are usually installed on this machine.


