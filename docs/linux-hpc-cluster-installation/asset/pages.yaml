  md: '# General cluster architecture


    In this chapter, we talk about concepts that can help you design a solution based
    on Beowulf architecture. It is intended for people who would like to have an idea
    about Beowulf architecture, which components make up the cluster, how to connect
    the components, and what to consider when you want to implement a Beowulf cluster
    as your solution.


    We start by discussing application design and parallelism. Then we discuss hardware
    and software architecture from a theoretical perspective.


    As an example for this discussion, we are using an eight node cluster. The same
    approach may also be used for up to 64 node clusters. Scalability issues are involved
    in clusters composed of 64 or more nodes, and it would be necessary to go into
    a discussion that is beyond the purpose of this chapter.


    Figure 2-1 on page 12 illustrates where you can find some of the components in
    a Beowulf cluster.'
  merge: -1
