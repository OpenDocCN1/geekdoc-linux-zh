  md: '# # Add login user


    It is not possible to log in to Linux as root over the network, so at least one
    other

    user must be created for this purpose. It is often convenient to have more than

    one account if a number of people will be using the management node.


    Create the user with Linuxcon-f or use the `useradd` command, as shown in

    Example 6-1.


    Example 6-1 User creation with useradd


    ```

    root@master [#root]# useradd -c ''IBM User'' ibm

    root@master [#root]# passwd ibm

    Changing password for user ibm

    New UNIX password:

    Retype UNIX password:

    password: all authentication tokens updated successfully

    ```


    # # Verify the network configuration


    Kickstart have setup your network for you, but it is advisable to verify this

    using **ping**. The simplest and most comprehensive test is to ping a *named*

    machine, preferably on a network that needs to go via the gateway, as shown in

    Example 6-2.


    Example 6-2 Pinging a known machine through a gateway


    ```

    root@master [#root]# ping -c 2 www.redbooks.ibm.com

    PING www.redbooks.ibm.com (207.25.253.24) from 93.197.104 : 56(84) bytes of

    data.

    64 bytes from www.redbooks.ibm.com (207.25.253.24) : icmp_seq=0 ttl=121

    time=92.0 ms

    64 bytes from www.redbooks.ibm.com (207.25.253.24) : icmp_seq=1 ttl=121

    time=92.0 ms

    --- www.redbooks.ibm.com ping statistics

    2 packets transmitted, 2 packets received, 0% packet loss

    round-trip min/avg/max = 92.0/95.9/99.9 ms

    ```


    Verify your network settings if this test fails.


    If the management node is to serve as a network gateway, you must enable IP

    forwarding. You should *not* enable this if you will have another gateway node
    in

    t cluster, as it may affect the security of your system. Open /etc/sysctl.conf
    in

    your favorite text editor and change the ipv4.ip_forward line to:


    ```

    # net.ipv4.ip_forward = 1

    ```'
