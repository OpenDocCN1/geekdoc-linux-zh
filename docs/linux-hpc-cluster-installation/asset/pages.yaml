  md: '# 3.2.2 System management


    Due to the large amount of management tasks that are executed in cluster systems,
    system management is one of the hotly discussed components. Although the current
    solution includes the use of xCAT, this section also provides a brief explanation
    about cluster system management (CSM) and IBM Director.


    # xSeries Cluster Administration Tool (xCAT)


    xCAT was developed by Egan Ford as a means of simplifying the cluster installation
    process. It has proven to be a very effective tool for this purpose. It allows
    for a simplified approach to loading or reloading the nodes as well as facilities
    for managing a single machine or specified groups or ranges of machines. xCAT
    uses the special management capabilities of the x330s and x340s to provide a tremendous
    level of control of the nodes, including:


    +   * Remote power control

    * Remote hardware reset

    * Remote software reset

    * Remote OS console

    * Remote POST/BIOS console

    * Remote vitals (fan speed, temperature, etc.)

    * Remote hardware event logs

    * Remote hardware inventory

    * Parallel remote shell

    * Parallel ping

    * Command line interface (no GUI)

    * Single operations can be applied in parallel to multiple nodes

    * Network installation (KickStart)

    * Support for various user defined node types

    * SNMP alert logging'
  merge: -1
