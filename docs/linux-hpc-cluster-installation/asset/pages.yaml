  md: '# Establishing expectations questionnaire


    Table F-1 contains questions regarding your expectations of the cluster.


    **Table F-1** Expectations questionnaire


    | Questions | Your comments |

    |--- |--- |

    | Has the cluster''s performance requirements have been documented? If so, please
    specify any required measurements. | |

    | Has the cluster configuration been sized and verified to match the requirements?\n>
    Application type

    > Processor(s)

    > Memory

    > Cache

    > Disk Storage / RAID (local)\n> Tape (backup)\n> Adapters | |

    | Will this cluster require high speed, low latency IPC (Myrinet)? | |

    | What will the cluster be used for? | |'
