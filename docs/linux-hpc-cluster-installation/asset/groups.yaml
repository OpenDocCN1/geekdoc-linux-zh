    ## site.tab


    此表用于配置集群网络。它包含了表 B-2 所示的需要根据你的集群更新的参数列表。表 B-2 site.tab 定义


    | 参数 | 描述 | 示例 |

    |---|---|---|

    | rsh | 用于在节点上建立连接的命令。 | /usr/bin/ssh |

    | rcp | 用于远程复制的命令。 | /usr/bin/scp |

    | tftpdir | tftp 守护进程使用的目录。 | /tftpboot |

    | tftpxcatroot | tftpdir 下用于 xCAT 文件的目录。 | xcat |

