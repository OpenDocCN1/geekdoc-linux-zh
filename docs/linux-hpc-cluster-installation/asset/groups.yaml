    ## 2.3.2 远程访问/Equinox 终端服务器


    Linux 操作系统及其之前的所有基于 UNIX 的操作系统一样，与机器上的串口进行极低层面的通信。通过此串口可以实现极高层次的远程控制。使用终端服务器可以方便对操作系统的远程管理。


    终端服务器连接到每个计算节点上的串口，并允许我们通过 telnet 或其他方式共享此通信端口。我们可以通过终端服务器远程访问任何和所有计算节点上的操作系统。


    ## 2.4 软件架构


    我们已经讨论了集群的应用和硬件设计。然而，集群不仅限于这些组件。要在集群上开发和运行应用程序，你需要几个软件组件：


    - 操作系统

    - 设备驱动程序

    - 库

    - 开发和调试工具

    - 编译器

    - 资源管理工具


    参见图 2-5 了解软件组件概述。


    ![](img/ccdee7f1b1183ba808fa8386b0cb1315_51_0.png)


    图 2-5 Beowulf 软件组件


    关于某些主要软件组件的更多信息以及开发和集群管理工具的详细描述，请参见第 37 页第 3 章“组件概述”。


    ## 2.4.1 操作系统


    操作系统执行若干任务，如识别键盘输入、向显示面板发送输出、控制外设备以及跟踪磁盘上的文件和目录。可以使用多种操作系统创建 Beow 集群，Linux 就是其中之一。我们通常通过一组命令与操作系统交互，例如
    Linux 上的 bash。


    ## 2.4.2 文件系统


    文件系统是任何操作系统的主要部分；它是程序和数据的存储库。文件系统在 Linux 中有两个含义：


    - 它可以是根目录层次结构的概念，不同的分区挂载在根目录下。它没有像 Microsoft® Windows 那样的字母符号来标识分区，一切都被视为文件。


    - 它指的是在磁盘或内存上表示文件或目录的特定格式，例如 EXT2 和 JFS。


    在集群环境中，讨论分布式文件系统是有意义的。每个 Beowulf 节点如果不是无盘客户端，都有一个本地文件系统，该系统可能需要访问运行在其他节点上的进程。这就是在
    Beowulf 集群中使用分布式文件系统的基本原因。


    分布式文件系统具有区别于本地文件系统的特征：


    - 网络透明性：可以使用相同的系统调用访问远程文件和本地文件。

    - 位置透明性：文件名不绑定到其位置，因为包含它的文件的服务器不是路径的一部分。

    - 位置独立性：如果文件的物理位置发生变化，它的名称并不一定会改变，因为包含它的文件的服务器名称不是文件路径的一部分。


    ## 并行文件系统


    Linux 集群缺乏支持的一个关键领域是并行文件系统，它对于高性能 I/O 至关重要。


    在开始讨论并行文件系统之前，我们必须再次查看本地文件系统。本地文件系统通过在侧的存储设备与另一侧的文件和目录之间建立映射来工作。正因如此，它们将设备视为本地而非共享的，文件系统不需要强制设备共享语义。为了提高文件系统性能，我们可以改进缓存并合并文件系统操作，以减少每个文件系统操作所需的磁盘访问次数。


    当前的技术允许许多机器共享存储设备。允许这些机器同时在这些共享设备上挂载并访问文件的文件系统是共享磁盘文件系统。这与传统的分布式文件系统形成对比，后者由服务器控制设备并作为所有数据共享的核心。


    共享设备文件系统方法比传统的客户端服务器文件系统方法具有若干优势：


    - 提高文件系统可用性：不存在单点故障，因为文件系统对主机是可用的。

    - 负载均衡：客户端可以访问任何设备上的数据。

    - 可扩展性：在没有 NFS 等集中式文件系统局限性的情况下实现了容量、连接和带宽。并行文件系统对于 I/O 密集型应用程序至关重要。全局文件系统 (GFS)
    和并行文件系统 (PVFS) 目前可用，IBM 计划在 Linux 平台上实现通用并行文件系统 (GPFS)。


    ## 2.4.3 进程间通信 (IPC)


    进程间通信 (IPC) 是进程之间的数据交换，无论是通过网络还是在同一台计算机上。数据交换意味着一种保证响应的协议。第 26 页“技术”中介绍的技术适用于
    IPC。我们建议使用高带宽低延迟的技术，例如以太网。IPC 是适用于 Beow 集群的元素。


    ## 并行虚拟机 (PVM)


    PVM 是一种促进并行计算的应用程序接口 (API)，设计用于跨集群。如果你使用 PVM API 开发应用程序，你就使其能够跨集群运行。在一种环境中，一台机器运行
    PVM 控制台。PVM 控制台感知所有可用节点。作业提交给 PVM 控制台，并在节点间分发。结果返回给 PVM 控制台并汇合成完整结果。


    PVM 对于可以在松耦合环境中运行的任务非常有效，即可以分部分运行。其他解决方案可能更适合具有通信需求的作业。


    ## 消息传递接口 (MPI)


    MPI 规范通常用于需要逻辑结构层来匹配物理通信层的情况，例如应用程序需要与不同主板上的多个 CPU 交互时。


    MPI 是编写并行程序的的消息传递库的标准规范。MPI 标准于 1994 年由 MPI 论坛 (MPIF)首次发布。它为编写消息传递并行程序提供了一个移植的接口。有关
    MPI 和 MPIF 的详细信息，请访问：


    ```

    http://www.mpi-forum.org

    ```


    消息传递由于其与 SMP 架构的物理属性密切相关而被广泛采用。每个顺序进程上运行一个或多个进程，它们通过跨越物理网络的消息进行交互。


    MPICH 是针对各种并行和分布式计算环境的最广泛移植完整 MPI 规范实现。MPICH 实现在没有厂商实现的异构工作站和 Beowulf 集群上，特别受欢迎。MPICH
    是免费提供的，可以从 Web 下载：


    ```

    http://www.mcs.anl.gov/mpi/mpich

    ```

