    # 2.1.3 Software application program interface (API) architecture


    The API is the interface by which an application program accesses the operating
    system and other services. An API is defined at source code level and provides
    a level of abstraction between the application and the kernel to ensure the portability
    of the code.


    An API can also provide an interface between a high level language and lower utilities
    and services which were written without consideration for the calling conventions
    supported by compiled languages. In this case, the API''s main task may be the
    translation of parameter lists from one format to another and the interpretation
    of call-by-value and call-by-reference arguments in one or both directions.


    Parallel architecture may have:


    +   - Messages: May be implemented both for SMP and cluster machines; they require
    copying of data between nodes. Latency and the speed of this operation are the
    limiting factors. The advantage of writing code using messages on an SMP machine
    is that if you decide to move to a cluster, you can easily add a machine without
    have to recreate your application from scratch

    - Threads: They are designed to work fast on SMP machines because of shared memory.
    They do not need copying as messages do. The disadvantage is that you cannot extend
    them beyond one SMP machine because data is shared between CPUs. NUMA may allow
    that, but we are not considering NUMA architecture at present due to its expense
    and because Linux is not yet mature on platform.


    # 2.1.4 Application architecture


    Up to this point, we have considered machine hardware and APIs. Now, we discuss
    how to design the application. We show the logical sequence you follow to develop
    a good application and we explain how to resolve bottlenecks.


    # Batch and parallel jobs


    You have two kinds of jobs: a batch job and a parallel job.


    A batch job is an application that runs independently on each node of the cluster
    without the need to interact directly with the other nodes. This kind of application
    usually performs calculations on a set of data and at the end of the job passes
    the result to a control node responsible for collecting the results from all the
    nodes.'
- md: '

    A parallel job is a job that needs to talk with the other compute nodes of the
    cluster. This operation needs message passing and network activity.


    The reason for using a cluster is to speed up the execution of a program, but
    sometimes SMP machines that are not in a cluster can be fast enough.


    With in mind, we should consider using a cluster in the following circumstances:


    - Problem size: If an application requires a lot of memory, a workstation might
    not be enough; a cluster might be a good solution.

    - Real time: Problems that need a faster response. In this case, you should also
    consider the number of users who access the cluster at the same time, if too many
    users share the cluster resources at the same time, the cluster performance will
    slow down and maybe a workstation could be an adequate solution.

    - Is the application suitable for a cluster or do I need to port it?

    - How long does the application take to run?

    - How large is the application? Can I fit it onto any machine?


    If at this point we have decided to use a cluster and to use parallel computing,
    we need to create our application.


    ## 2.1.5 Creating the application


    We need to clarify the concepts of concurrency and parallelism, because we have
    to be clear which part of the program can be parallelized.


    - Concurrency is a property of the application and defines the parts of the program
    that can be computed independently.

    - Parallelism is the ability to run concurrent parts of a program that are executed
    on separate processes at the same time. Parallelism is also a property of the
    hardware.


    ## 2.1.6 Bottlenecks


    We need to consider possible bottlenecks, as they actually drive both application
    design and hardware choice.


    We need to figure out if the application is:


    - Processor bound: CPU limited

    - I/O bound: Hard disk or I/O network limited


    Communication speed and latency between the nodes are the limiting factors of
    parallel performance, so it is very important that your application compensate
    for those factors. The cost of communication time must be worth the improved performance
    in computation. It is important to realize that fast processors do not equal better
    performance if communication is a bottleneck.


    I/O intensive applications, such as databases, need to transfer large amounts
    of data, so both CPU and I/O performance are required. This is unlike the scientific
    field where just high performance indexing based on the combination of CPU and
    the network are to be considered important.


    Anatholy F. Dedkov and Douglas J. Eadline, in Performance Consideration for I/O-Dominant
    Applications Parallel Computers, formulated this rule regarding processing speed:


    For two parallel computers with the same cumulative CPU performance index, the
    one which has slower processors (and a probably correspondingly slower processor
    communication network) has better performance for the I/O dominant applications
    (while all other conditions are the same except the number of processors and their
    speed).


    ## Writing and porting


    At this point, we should have defined:


    - Which part of the program can be concurrent.

    - What are the bottlenecks and how to estimate the parallel efficiency.


    We have not yet described the concurrent parts of the program.


    We have two options to consider: explicit and implicit parallel execution.


    ## Explicit


    Explicit methods are determined by you or the programmer, and you have to add
    messages using either MPI or POSIX threads.


    > Note: Threads cannot move between machines.


    The explicit method is very difficult to implement and debug, so programmers usually
    use programming languages, such as C and Fortran, and MPI libraries, to implement
    applications. This approach is the most general and efficient, and the resulting
    code looks to be easily portable.


    > Note: FORTRAN has the largest amount of support, in terms of libraries and tools,
    for parallel computing.


    ## Implicit


    Implicit methods are created when you or the programmer provide some information
    about the concurrency of the application. Then specific compiler directives, such
    as High-Performance Fortran (HPF) or parallelization tools, analyze the program
    and perform automatic detection of parallelism, and decide how to execute the
    concurrency part of the program.


    Program portability can be achieved using standards such as Message Passing for
    FORTRAN and C/C++ programs, and OpenMP for shared memory, which is implemented
    by compiler directives.


    ## 2.2 Hardware architecture


    This section shows which components are in a Beowulf cluster, from each function
    to the network architecture. We show an example of how a Beowulf cluster can be
    designed in Figure 2-2 on page 20.


    ![](img/ccdee7f1b1183ba808fa8386b0cb1315_41_0.png)


    Figure 2-2 Beowulf Linux cluster example


    20 Linux HPC Cluster Installation


    ## 2.2.1 Cluster components


    Previously, we discussed parallelism and how applications should be designed for
    maximum efficiency in this environment. Now we will focus on the functions that
    make up the cluster.


    We divide the cluster nodes based on their function. It is important to note that
    these functions may reside on one or more machines. In a small cluster, all of
    the functions will likely be on one machine. In a larger cluster, you will likely
    divide the functions across many units. In very large clusters, a single function
    might be spread across several similar nodes. The following lists the node functions
    and structure:


    - User

    - Control

    - Management

    - Storage

    - Installation

    - Compute Node


    Later, we create the nodes and show you how those functions can be on the same
    node, and therefore use the same server or hardware.


    It is not essential that each function be on a separate machine; this is up to
    you. Based on budget and performance, you may decide to install one function per
    server or to consolidate function onto a few servers.


    ## 2.2.2 User


    The user node is the gateway for the outside world to access the cluster. Users
    usually login to the user node and compile or run their jobs.


    You may want to have hardware redundancy on this machine. If it fails, users may
    not access the cluster and use its powerful capacity.


    The user node is an important part of the cluster and we recommend having hardware
    redundancy. If you do not have the user node up and running, your cluster cannot
    function because there is no opportunity to run a job.


    The user node can also be on the same server that is used for management or installation.


    > Important: We suggest using redundant array of independent disks (RAID) adapters
    to protect the data on the user node.


    ## 2.2.3 Control


    The control node can be on the same machine that takes care of management and
    installation. It is responsible for controlling the queue or batch jobs. The control
    function may be located on one of the compute nodes or on any other machine responsible
    for controlling or managing the cluster.


    The control node provides services such as Dynamic Configuration Protocol (DHCP),
    Domain Name System (DNS), and Network File System (NFS). In addition, the portable
    batch system (PBS) and the scheduler are usually installed on this machine.


    You need redundancy on hardware and data because, unlike the case of compute nodes,
    the failure of the control node may affect the entire availability of the cluster.
    We suggest using:


    - Redundant fans

    - Redundant power supply

    - RAID (to protect the data)


    ## 2.2.4 Management


    Management is the function that manages and controls the cluster and its components,
    for example, switches. It is either on dedicated machines management nodes, or,
    for budget reasons, shares the machine with other functions, such as the master,
    installation, and compute nodes. It may also be found on a dedicated virtual area
    network (VLAN), defined as management, and accessible only by the administrator
    (for security reasons).


    There might be more than one management node in a cluster, such as in large clusters;
    it depends on how many nodes and components you need to manage. As the cluster
    manager, it takes control of the nodes and collects Simple Network Management
    Protocol (SNMP) alarms.

