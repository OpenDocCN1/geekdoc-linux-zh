    # psh - Parallel remote shell


    # Description


    psh is a utility used to run a command across a list of nodes in parallel. psh
    relies on the rsh field in site.tab to determine whether to use rsh, ssh, or any
    other method to launch a shell. rsh, ssh, or any other method must be set up to
    allow no prompting (that is, .hosts for rsh and sshd_config and .hosts for ssh)
    for psh to work.


    # Synopsis


    ```

    psh [noderange] -c [command]

    For example:

    psh node1,node2,node8,node20 -c uptime

    sh node14-node56,node70-node203 -c uptime

    sh node1,node2,node8,node20,node14-node56,node70-node203 -c uptime

    sh all -node29-node256 -c uptime

    ```


    # Examples


    ```

    # psh node1-node10 -c uptime

    Get the uptime for nodes 1 through 10 returned in order of completion.

    # psh all -c /sbin/halts

    Shutdown all nodes listed in nodelist.tab.

    Enclosing the command in '' '' (single quotes) will forward any redirection to
    the nodes.

    # psh all -c ''grep /proc/cpuinfo | wc -1'' | sort

    Return a list of nodes with the number of processors per node sorted by node.

    # psh all -c grep /proc/cpuinfo | wc -1

    Will return the total number of processors in the cluster.

    ```


    # Options


    - -C Required option. -c is followed by the command you wish to execute on the
    range of nodes specified.

