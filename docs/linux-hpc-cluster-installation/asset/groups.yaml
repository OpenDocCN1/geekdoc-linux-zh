    # POVRay test


    To test and demonstrate the power of the cluster, we decided to use a program
    called POVRay (Persistence of Vision). It is a powerful rendering application,
    it is free, and the source code is distributed.


    This appendix describes how to install and execute the POVRay program and it is
    structured as follows:


    +   - POVRay Install and Patch

    - POVRay test with TCP/IP

    - POVRay test with MYRINET GM'
