    # site.tab


    This table is used to configure the cluster network. It includes a list of parameters

    (shown in Table B-2), which have to be updated for your cluster configuration.


    Table B-2 Definitions of site.tab parameters


    | Parameter | Description | Sample |

    |---|---|--|

    | rsh | Command used to open a connection on a compute node. | /usr/bin/ssh |

    | rcp | Command used to do a remote copy. | /usr/bin/scp |

    | tftpdir | Directory used by the tftp daemon. | /tftpboot |

    | tftpxcatroot | Directory under tftpdir, used for xCAT files. | xcat |

    | domain | DNS domain used for the cluster. | cluster.austin.ibm.com |

    | nameservers | IP address of the name server, often the IP address of a master
    node | 192.168.0.254 |

    | net | This is where the network:mask is used by the nodes for the cluster management
    virtual local area network (VLAN). Only this VLAN will be resolved by the DNS
    server installed on the management node. | 192.168.0:255.255.255.0 |

    | gkhfile | The file that will contain the ssh host keys for the nodes. | /usr/local/xcat/etc/gkh
    |

    | master | Name of the master node. | master |

    | pbshome | Value of PBS_HOME. See PBS documentation. | /var/spool/pbs |

    | pbspref | Value of PBS_PREFIX. See PBS documentation. | /usr/local/pbs |

    | pbsserver | Name of the node which is running the PBS server. | master |'
