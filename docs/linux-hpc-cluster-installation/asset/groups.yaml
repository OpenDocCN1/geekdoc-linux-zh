    | nameservers | DNS 服务器地址，通常为主节点的 IP | 192.168.0.254 |

    | net | 节点用于集群管理虚拟局域网 (VLAN) 的网络:掩码。只有此 VLAN 会由管理节点安装的 DNS 服务器解析。 | 192.168.0:255.255.255.0
    |

