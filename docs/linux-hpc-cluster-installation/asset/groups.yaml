    # POVRay Installation


    To make the POVRay cluster "aware," we patch the source code using a mpipov patch
    and then compile it. The patch enables POVRay to operate parallel to MPI.


    # Downloads


    +   - Download the POV-Ray source code:

    http://www.povray.org/binaries/linux.html

    Download the files povuni_s.tgz and povuni_d.tgz. The size of the files is under
    1 MB each.

    - Download the POVMPI patch:

    http://www.verrall.demon.co.uk/mpipov/

    Download the file mpi-povray-1.0.patch.gz. The size of the file is about 127 KB


    # Install


    To install POVRay, use these commands:

    ```bash

    [root@master ]# cp "Path to POV-Ray Download Dir"/povuni_* /usr/local

    [root@master ]# cd /usr/local

    [root@local ]# tar xzv povuni_s.tgz

    [root@local ]# tar xzv povuni_d.tgz

    [root@local ]# cd povray31

    [root@master povray31]# cp "Path to POV-Ray Download Dir"/mpi-povray-1.0.patch.gz

    [root@master povray31]# gunzip mpi-povray-1.0.patch.gz

    [root@master povray31]# cat mpi-povray-1.0..patch | patch -p

    [root@master povray31]# cd source/mpi-unix

    ```


    > Note: You might need to add the path to mpic to the $PATH variable. In our case,
    mpic needs in /usr/local/mpich/1.2.1/ip/smp/gnu/ssh/bin/, so you would use the
    commands:


    [root@master mpi-unix]# export

    PATH=/usr/local/mpich/1.2.1/ip/smp/gnu/ssh/bin:$PATH

    [root@master mpi-unix]# make newxwin


    Edit povray.ini line : Library path to match the correct path.'
