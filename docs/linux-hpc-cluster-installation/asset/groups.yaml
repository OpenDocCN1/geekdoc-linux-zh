    /usr/src/linux-2.2.18smpx

    ```


    # 6.4.2 bind


    bind is one of the examples from DNS, by al., which automatically generates nameserver
    configuration files from /etc/hosts and is used by xCAT. Download the book''s
    examples from http://ftp.org/pub/examples/bind/ and extract the bind script to
    /local/xcat/lib. For example:

    ```bash

    # tar xvzf dns.tar -C /local/xcat/lib

    # chmod 755 /local/xcat/lib/bind

    ```


    # 6.4.3 pxelinux


    To start network installation, xCAT uses the network boot support of the onboard
    ethernet. This network boot relies on a vendor independent API known as Pre Execution
    Environment or PXE. More information on PXE can be found at: http://developer.intel.com/


    PXE relies on fetching a small boot loader from the remote server through ftp.
    The current version of xCAT uses pxelinux boot loader, which is part of the Syslinux
    package, and can be downloaded from: ftp://ftp.kernel.org/linux/utils/boot/syslinux/


    It is important to use at least Version 1.53, since xCAT relies on a new feature
    introduced in this version. Although it is possible to rebuild pxelinux, this
    is not recommended. All that required by xCAT is the pxelinux.0 file, which you
    can get with the command:

    ```bash

    # tar xvzf syslinux-1.53.tar.gz

    # cp syslinux-1.53/pxelinux.0 /local/xcat/tftp/

    # chmod 444 /local/xcat/tftp/pxelinux.0

    ```


    # 6.4.4 attftp


    To support TFTP for PXE, a tftp server must be installed on the management node.
    There are a number of different tftp servers available for Linux, including the
    one that comes on the Red Hat 6.2 CD-ROM. Unfortunately, many of these suffer
    from a number of issues, scalability being a particular concern. We have found
    the most reliable to be attftp which can be obtained from: ftp://tftp.com/pub/atftp/


    The attftp package comes with no installation instructions, but the installation
    is fairly straightforward. Use the command:

    ```bash

    # tar xvzf attftp-0.3.tar.gz

    # cd attftp-0.3

    # make

    # make install

    ```


    Note that the make install command will overwrite the existing Red Hat tftp. This
    is unlikely to be a problem.


    Once you have installed attftp, certain options need to be configured in /etc/inetd.conf:
    Although the documentation indicates attftp will default to using /tftpboot, this
    does not seem to work, and must be specified manually.


    tftpboot

    Try adding this to order PXE clients if you experience attftp failures on boot.


    --no-blksize

    By default, attftp expires after 300 seconds, logging a lot of information to
    syslog as it dies. If this setting is unsatisfactory, you can set this parameter
    to 0.


    --attftp_timeout

    Accordingly, the attftp line in /etc/inetd.conf to something similar to the following:

    ```bash

    tftp dgram udp wait /usr/bin/in.attftp in.attftp --no-blksize --attftp_timeout=0
    /tftpboot

    ```


    Note that this line will previously have been commented out; you will need to
    uncomment it. If you want to enable tftp right away, you can reload inetd the
    command:

    ```bash

    # /etc/rc.d/init.d/inet reload

    ```


    # 6.4.5 Equinox setup


    The ELS-16 from Equinox is a powerful device that supports virtually any combination
    of serial access you can think of. The manual is large and comprehensive, but
    there is no need to be put off by the size of the manual; configuring, for our
    purposes (known as reverse telnet), is simple.


    The configuration procedure comes in two stages: the first over a serial cable,
    and the second over the ethernet. If your cluster is over 16 nodes, you will have
    multiple ELS, so you will need to perform this procedure multiple times.


    # Assigning an IP


    Before you configure the ELS, it is a good idea to reset it to the factory defaults.
    Ensure the ELS is powered up, then locate the reset hole next the ethernet connector.
    Use a paperclip or similar item to hold the switch down until the LEDs on the
    ELS start to flash. When the LEDs stop flashing, the ELS has been reset to start.
    For further information, please refer to the Equinox manual.


    If you have a laptop handy, you might prefer to access the serial port using HyperTerminal
    for Windows. Alternatively, you can connect to the management node and use the
    cu program.


    Start your communication software and press Enter to get a login prompt from the
    ELS. If you do not get a prompt, check the cable and make sure your software is
    configured for 9600 baud, 8 data bits, no parity and one stop bit (8-N-1).

