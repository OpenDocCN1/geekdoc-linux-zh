    - Cluster: Used for I/O and job traffic only.'
- md: '

    - Public: We need a way to talk to the LAN or wide area network (WAN) in order
    to have access to the cluster.


    You have to decide what to do for your network:


    - A single network topology, where the compute, master, installation, and storage
    nodes are all connected.


    - Divide your network into several virtual local area networks (VLANs).


    We usually create several VLANs. To do that, you need an intelligent or layer
    2 switch capable of managing virtual networking, that is, the ability to configure
    logical topologies on top of the physical network infrastructure. VLAN offers
    benefits in efficiency in the use of bandwidth, flexibility, performance, and
    security. From a logical point of view, VLAN technology is a segmentation of the
    network in different broadcast domains so that packages are only switched between
    ports designated to be part of the same VLAN.


    We suggest creating the following VLANs, as represented in Figure 2-4 on page
    29:


    - Management: This VLAN is used to access Myrinet or another layer 2 switch used
    for IPC, Service Processor Network, and Equinox™ (for management purposes only).
    Telnet and SNMP are used to manage the switch, Equinox and the Service Processor
    Network. This VLAN is usually isolated for security reasons.


    - Cluster: The compute and storage nodes use this VLAN for I/O traffic only. The
    master node uses this network for cluster management and installation only.


    - Public: The master node is connected to this network for user access and to
    launch jobs.


    - Service Processor Network: An Ethernet link to the Service Processor; used for
    management purposes.


    ![](img/ccdee7f1b1183ba808fa8386b0cb1315_50_0.png)


    Figure 2-4 Beowulf cluster network scheme


    ## 2.3.2 Remote access/Equinox terminal server


    The Linux operating system, like all UNIX-based operating systems before it, talks
    at a very low level to the serial port on the machine. An extremely high level
    of remote control is available through this serial port. Remote management of
    the operating system is facilitated by the use of a terminal server.


    The terminal server connects to the serial port on each compute node and allows
    us to telnet, or otherwise share, this communications port. We can remotely access
    the operating system on any and all compute nodes by using the terminal server.


    ## 2.4 Software architecture


    We have discussed the application and hardware design of a cluster. However, the
    cluster is not limited to those components alone. To develop and run applications
    on a cluster, you need several software components:


    - Operating system

    - Device drivers

    - Libraries

    - Development and debugger tools

    - Compilers

    - Resource management tools


    See Figure 2-5 for an overview of the software components.


