    # 前言


    很少有使用电脑的人没有听说过 Linux®。Linux 是一场革命的核心，这场革命从根本上改变了软件编写和交付的许多方面。这场革命将走向何方尚有待观察。而远没有模糊的是
    Linux 在科学计算领域的渗透，更具体地说，它在高性能计算（HPC）集群中的应用。


    本红书将引导系统架构师和工程师了解集群技术、术语以及 Linux 高性能计算（HPC）集群的基础知识。我们讨论了在构建解决方案时使用的一些设计指南，以及如何安装和配置
    Linux HPC 集群。


    本红书记录了在 IBM @server xSeries 硬件上构建 Linux HPC 集群的过程。通过这种方法并构建一种 Beowulf 集群，我们可以以以前解决方案的一部分价格获得巨大的性能提升。


    本红书还将教你构建 HPC 集群的概念和原则。通过广泛使用脚本，安装过程被精简和简化。提供了管理工具可以可以易地管理大量的计算节点，这些节点远程使用 Linux
    的内置功能以及 IBM @server xSeries 服务处理器网络的级管理能力。


    # 编写本红书的团队


    本红书由 Blue Tuxedo 团队制作，这是一支来自位于奥斯汀中心的国际技术支持组织（ITSO）的全球专家组成的团队。


    Luis Ferreira（也称为“Luix”）是 IBM 公司国际技术支持组织（奥斯汀中心）的软件工程师，负责 Linux 和 AI 项目。他在基于 UNIX
    的操作系统方面拥有 18 年经验，并拥有巴西里约雅热内卢联邦大学的系统工程硕士学位。在加入 ITSO 之前，Luis 曾在 Tivoli Systems 担任过认证
    Tivoli 顾问和认证 IT 专家，并在 Cobra Brasil 担任内核开发人员和软件设计人员。他的电子邮件地址是 luix@us.ibm.com。


    Gregory Kattmann（也称为 "Greg"）是 IBM 全球服务部门（ITS）的 IT 架构师，担任 Linux 集群领域的专家。他所属的 Linux
    全球解决方案小组负责在全球范围内制定 Linux 策略和政策。Greg 在 IBM 有 21 年的经验，其中最后 10 年担任工作站和网络专家。过去几年，他一直参与
    Linux 和 Linux 高性能计算集群。他在 NTS 获得技术学位，在 CRE 获得电子工程学位。他的电子邮件地址是 kettmann@ibm.com。


    Jensham 是位于苏格兰格诺克的 IBM Techline 的 IT 专家。他在售后支持和技术预售环境中拥有三个以上的 xSeries 和 Netfinity
    服务器经验。他参与 Linux 领域已有四年，在 IBM 工作了三年多。他的专长领域包括网络、集群、光纤技术（Fibre）以及所有与 Linux 关的内容。他是红帽认证工程师（RHCE）、专业服务器专家（PSS）和微软认证系统工程师（MCSE）。他的电子邮件地址是
    jhamsamo@ibm.uk.com。


    Andreas Thomas 是德国伯尔林根 EMEA 卓越中心中心的专家和顾问。他在 Linux 领域拥有八年的经验，仍然记得当 Linux 发行版是通过软盘交付的时代。他在
    Unix 领域学习和工作了多年，专业领域包括 UNIX 服务器支持和咨询（Linux/Intel、Linux/390、AIX 和 Solaris）。他目前的工作职责侧重于
    xSeries Linux 集群解决方案的技术销售支持。他拥有德国萨克森州职业学院（德累斯顿州立研究学院）的计算科学学位。他的电子邮件地址是 a.thomas@de.ibm.com。


    Steve Hill 是在英国辛斯利工作的高性能计算专家。他有六年的 Linux 经验，记得在 48 机器上编译 1.3 内核需要等待几分钟。他目前的职责包括作为
    IBM 顾问提供服务。他曾参与并安装过多个 Linux 集群，包括展会。他的电子邮件地址是 s_hill@ibm.uk.com。


