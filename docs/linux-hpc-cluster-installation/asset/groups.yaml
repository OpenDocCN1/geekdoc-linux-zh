    # ### 2.3.1 How to design the cluster network


    We have looked at some of the technologies and protocols used for Beowulf IPC.

    Now we can explore how to design the network components of our cluster,

    because the cluster needs a network topology in order to be able to communicate
    between the nodes (as well as with the rest of the world).


    The components of the cluster network can be summarized as:


    +   - IPC: Needed to allow nodes to pass messages and chunks of data.

