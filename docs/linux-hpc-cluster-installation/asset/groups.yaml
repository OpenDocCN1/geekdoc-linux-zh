    Interprocess communication (IPC) is the exchange of data between one process and
    another, either over the network or on the same computer. The exchange of data
    implies a protocol that guarantees a response. The technologies presented in "Technologies"
    on page 26 are suitable for IPC. We recommend using high bandwidth and low latency
    technology, such as Ethernet. IPC is an element that fits into the levels and
    classes of a Beowulf cluster.


    ## Parallel Virtual Machine (PVM)


    PVM is an application programming interface (API) that facilitates parallel computing.
    PVM is designed for use across clusters. If you code your application using the
    PVM API, then you have enabled it to run across clusters. In one environment,
    one machine runs the PVM console. The PVM console is aware of all the nodes available
    to it. A job is submitted to the PVM console where it is distributed across the
    nodes. Results are returned to the PVM console and recompiled into a complete
    result.


    PVM is very effective for jobs that can work in a loosely coupled environment,
    that is, that can work in individual pieces. There are other solutions that are
    probably better suited for jobs with more communication requirements.


    ## Message Passing Interface (MPI)


    MPI specifications are commonly used where there is a demand for a logical structure
    layer to match a physical communication layer, for example when applications need
    to interact with several CPUs on different motherboards.


