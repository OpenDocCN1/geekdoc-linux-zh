    # Beowulf clusters


    Beowulf is mainly based on commodity hardware, software, and standards. It is
    one of the architectures used when intensive computing applications are essential
    for a successful result. It is a union of several components that, if tuned and
    selected appropriately, can speed up the execution of a well written application.


    A logical view of Beowulf architecture is illustrated in Figure 1-2 on page 10.


    Beowulf systems can be built using different pieces of hardware and software.
    There are classifications for this:


    +   - CLASS I: Built entirely using commodity hardware and software. The advantages
    are price, and the use of standard technology (SCSI, Ethernet, IDE).


    +   - CLASS II: Not necessarily built using commodity hardware and software alone.
    The performance is better than CLASS I.


    The choice should be based on budget and the needs that you have; CLASS II is
    not necessarily the best choice.


    In this redbook, we discuss a CLASS II Beowulf Linux cluster. The same approach
    is valid for 16, 32, and 64 node clusters.


    Beowulf programs are usually written using languages such as C and FORTRAN, and
    use message passing to achieve parallel computation.


    A Beowulf cluster can be as simple as two networked computers, each running Linux
    and sharing a file system via NFS and trusting each other to use the rsh command
    (remote shell). Or it can be as complicated as a 1024 nodes with a high-speed,
    low-latency network consisting of management and master nodes, and so on.'
