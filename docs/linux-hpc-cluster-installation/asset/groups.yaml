    ```


    Alternatively, you can go to the IBM Redbooks Web site at:


    ```

    ibm.com/redbooks

    ```


    Select the Additional materials and open the directory that corresponds with the
    redbook form number, SG246041.


    # Using the Web material


    The Additional Web material that accompanies this redbook includes the following
    files:


    | File name | Description |

    | xCAT-distribution.tgz | Zipped file with xCAT Distribution |'
