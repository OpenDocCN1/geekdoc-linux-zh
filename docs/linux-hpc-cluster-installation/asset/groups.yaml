    # Installation experiences


    This appendix provides some real life examples of our experiences installing Linux
    Clusters. This is far less about the technical details of an installation and
    far more about the experiences we have shared and the fun we had.


    One of the first clusters was a small, eight node cluster. This was somewhat of
    a pilot project and everyone was paraded to see it. The first impressions were
    the most notable. Instead of a cluster, we had several tables set up with unbelievable
    number cardboard boxes. Everything was shipped separately, whether it be additional
    memory, CPUs or the racks themselves. One larger box contained all of the memory
    modules, but in order to build the cluster, each box had to be opened, the contents
    inventoried, and the compute and head nodes assembled.

