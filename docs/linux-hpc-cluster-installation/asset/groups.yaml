    # Hardware preparation


    This chapter describes the basic hardware setup, configuration and customization.
    We discuss, in detail, how to install the equipment, add additional components
    like the Myrinet cards, and populate and cable the rack(s). After completing this
    chapter, you can start installing the software to get your cluster up and running.
    It is a good idea at this stage to have all of your planning details for your
    cluster at hand, so that you can implement the steps as you work through the chapter.


    In this redbook, we presume a maximum number of 64 nodes (two racks); we give
    detailed examples for an eight node cluster. As already explained in the previous
    chapters, there are multiple options on how to design and implement the cluster.
    You might want to use only one large Myrinet switch and one large Ethernet switch
    for the whole cluster or use individual interconnected switches for each rack.
    Whenever we talk about switches, you need to remember that there might only be
    one switch in your setup.


    The topics covered in this chapter include:


    +   * Preparing the node hardware

    * Populating the rack(s)

    * Connecting the cables

    * Setting up the advanced systems management adapter (ASMA), if necessary'
  - '[PAGE 95]


    # 5.1 Node hardware installation


    The first thing to do is to prepare each individual node before it goes into the
    rack. This means installing the usual additional options, such as a second CPU,
    memory, and hard disks.


    # Head node (x340)


    We use the built-in Ethernet port for connecting to the customer network, so we
    add another FastEthernet card for the Service Processor Network (SPN) link. For
    better availability, a ServeRAID controller is installed. Finally, we need a Gigabit
    Ethernet adapter for the uplink to the FastEthernet switch to achieve a reality
    fast compute network installation.


    For performance reasons, you may want to place the I/O intensive adapters (mainly
    ServeRAID and Gigabit Ethernet) into specific slots so that they are on different
    peripheral computer interface (PCI) busses. For details, please refer to your
    system documentation or the labels on the back of your server.


    # Compute nodes (x330)


    We start by changing the serial port cable jumper from its default COM port A/Mgmt
    to COM B, as shown in Figure 5-1 and Figure 5-2 on page 75.


