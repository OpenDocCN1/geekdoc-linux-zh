    ## Establishing expectations questionnaire


    Table F-1 contains questions regarding your expectations of the cluster.


    **Table F-1** Expectations questionnaire


    | Questions | Your comments |

    |--- |--- |

    | Has the cluster''s performance requirements have been documented? If so, please
    specify any required measurements. | |

    | Has the cluster configuration been sized and verified to match the requirements?<br>Application
    type<br>Processor(s)<br>Memory<br>Cache<br>Disk Storage / RAID (local)<br>Tape
    (backup)<br>Adapters | |

    | Will this cluster require high speed, low latency IPC (Myrinet)? | |

    | What will the cluster be used for? | |

    | Questions | Your comments |

    |--- |--- |

    | What are your expectations for this cluster, in 10 words or less? | |

    | What cool name did you assign your cluster? | |

    | Are you aware of any conditions or issues which could impair your ability to
    implement this cluster? | | |

    | Have disk storage requirements and disk layout been established? In particular,
    this should apply to the cluster''s need for connection(s), and the method of
    connection(s) to external data/storage. | |


    ## Environmental questionnaire


    Table F-2 contains questions regarding the environment of your cluster.


    Table F-2 Environment questionnaire


    | Questions | Your comments |

    |--- |--- |

    | Will the cluster be housed in a computer room and is there space? | |

    | Will there be a raised floor? If so, will it provide sufficient room for cabling?
    | |

    | Will the floor support the weight of the cluster? | |

    | Is there, or will there be, sufficient power of the proper voltage and with
    the specified outlets? | |

    | Is their adequate cooling for the additional equipment? | |

    | Is there an established facilities schedule for making changes or adding/powering
    equipment? If so, how will it effect implementation? | |


    ## Hardware/configuration questionnaire


    Table F-3 contains questions regarding the hardware/configuration of your cluster.


    Table F-3 Hardware/ configuration questionnaire


    | Questions | Your comments |

    |--- | --- |

    | What hardware components, besides Netinity/eServer xSeries, are included in
    the solution (RS/6000/pSeries, AS/400/iSeries, S390/zSeries, Storage Subsystems,
    and so on)? | |

    | What are the IP address ranges (for compute nodes, head nodes, Ethernet switches,
    ASMA adapters, terminal servers, and so on)? Determine if a private address space
    will be used or if it will be a specified range provided by the Network group.
    | |

    | What are your naming conventions (node, rack, management, and so on)? Do start
    with zero or one? Are there any prefix or padding requirements? Note: Naming MUST
    be prefix/suffix, where prefix is [A-Za-z \-] and suffix is [0-9]. | |

    | Do you have any specific labeling requirements? This is similar to the question
    on naming conventions but refers to specific labels used to identify equipment.
    | |


    Appendix F. Cluster questionnaire 209


    | Questions | Your comments |

    |---| |---| |

    | Will you be using VLANs? If so, how many? How will they be partitioned? | |

    | What security/authentication method do you require (global NIS, local NIS, local
    users only, rcp/etc/password, and so on)? Note: We do not recommend using NIS
    on the compute nodes. | |

    | How is external storage to be connected? | |

    | What throughput is required from the cluster to your enterprise? | |

    | Does your network group have any fixed schedule for making changes or adding
    equipment to the network and if so, how will it effect implementation? | |


    210 Linux HPC Cluster Installation


    | Questions | Your comments |

    |--- | --- |

    | Does your network group have any specific equipment requirements for connectivity
    (brand, specific equipment, copper, fiber, and so on)? | | |

    | If you have special equipment/peripheral requirements, are production level
    Linux drivers and software available? | |


    ## Software questionnaire


    Table F-4 contains questions regarding the software for your cluster.


    Table F-4 Software questionnaire


    | Questions | Your comments |

    | - | - |

    | What other open source software will be installed? | |

    | What commercial software will be installed? | |

    | Do you have any existing Linux cluster(s) running the aforementioned applications?
    | |

    | What do you use as a resource manager? It is assumed you will be using PBS,
    but are there others (Maui, LSF, and so on)? | |

    | Do you require special/commercial compilers (the IBM Linux Cluster provides
