    \ | mgmyri1.cluster.austin.com |\n| 192.168.2.253 | mgels1.cluster.austin.com\
    \ |\n| 192.168.2.254 | mgt1.cluster.austin.com |\n\n## 4.4 Cluster questionnaire\n\
    \nThis section will detail all of the questions that should be asked when building\
    \ a cluster. The questions have been compiled from a variety of sources, including\
