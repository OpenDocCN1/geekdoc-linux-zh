    To complete your kernel installation, download and compile the Intel Ethernet
    drivers. They can be downloaded from:

    http://support.intel.com/support/network/


    Follow the compilation instructions provided by the site.


    > Tip: In our lab, we used the following commands to install the drivers for the
    Fast Ethernet adapter and Gigabit adapter:

