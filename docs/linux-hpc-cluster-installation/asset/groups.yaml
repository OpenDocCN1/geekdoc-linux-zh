    ## Configure MPICH to use Myrinet GM


    Once you have the Myrinet hardware set up, you will need to configure MPICH. In
    order to benefit from the Myrinet hardware in a cluster, you will need to use
    a version of MPICH message passing specially modified and optimized to utilize
    Myrinet.


    You can download the source from:


    ```

    http://www.myri.com/

    ```


    We used GM MPICH Version 1.2.5.


    The name of the file is `mpich-1.2.5.tar.gz`, and the size of the file is about
    8 MB. You must register to download the file.


    Do not forget to write down the exact version of the package; in this case, it
    is 1.2.5.


    Copy the source and xCAT mpmaker script files to `/tmp` with the commands:


    ```bash

    [root@master #] mkdir /tmp/mpgi

    [root@master #] cd /tmp/mpgi

    [root@master mpi]#] cp <Path to Myr mpi Download Dir>/mpich-1.2.5.tar.gz

    [root@master mpi]#] cp /usr/local/xcat/build/mpi/* .

    ```


    You can launch the mpmaker script to display the options available using the command:


    ```bash

    [root@gpi]#] ./mpmaker

    usage: [mpich version|gm mpich version:gm version] [up|smp] [gnu|pgi] [rsh|ssh]

    ```


    Now you can compile. To do this, you have to use the exact MPICH version name
    and GM install directory (mentioned earlier), separated by a comma. Use the command:


    ```bash

    [root@gpi]#] ./mpmaker 1.2.5:1.4-2.2.18smpx smp pgi ssh

    ```


    This will build MPICH Version 1.2.5 and GM Version 1.4 and use SMP machine with
    the PGI compiler and ssh.


    You will see the following output:


    ```

    .mpmaker: 1.2.5:1.4-2.2.18smpx smpx pgi ssh build start

    .mpmaker: 1.2.5:1.4-2.2.18smpx smpx pgi ssh build make

    .mpmaker: 1.2.5:1.4-2.2.18smpx smpx pgi ssh build success

    ```


    The process will take some time to complete. If you wish, you can easily monitor
    the status by opening another shell panel. In our case, we use the following command:


    ```bash

    [root@master]# tail -f /tmp/gmpi/mpich-1.2../make.log

    ```


    Before you can run any programs on the cluster, you need to know how many nodes
    and processors you have and what they are called in order to launch them.


    The next step is to create and populate a configuration file in order to use MPICH
    with GM of Myrinet card. In this case, the configuration file must reside in `$HOME/.gmpi/conf`.
    The file must include all the nodes that you are planning to run jobs on. The
    file has a special format, where the first line must contain the total number
    of nodes followed by lines describing the node name and the GM port to use. If
    you have an SMP machine, you need to add a node description twice, and use different
    GM port numbers for each entry. For example:


    ```bash

    [root@master .gmpi]# cd

    [root@master]# mkdir .gmpi

    [root@master .gmpi]# cd .gmpi

    ```


    Use your favorite text editor here to create the conf file. Use the command:


    ```bash

    [root@master .gmpi]# vi conf

    ```


    Here are some examples of the `.gmpi/conf` file:


    ```

    #4 Uni processor nodes $HOME/.gmpi/conf file :

    4 ------ total number of cpus

    nodel 2

    nodel 2

    nodel3 2

    nodel4 2

    ```


    or


    ```

    #4 SMP nodes $HOME/.gmpi/conf

    8 ------ total number of cpus

    nodel 2

    nodel 4

    nodel 2

    nodel 4

    nodel 3 2

    nodel3 4

    nodel4 2

    nodel4 4

    ```


