    Figure 1-1 A generic Web cluster


    # Load balancing cluster


    Figure 1-1 shows a typical, high availability Web cluster environment. At the
    top of the diagram is the Internet. Note that there are multiple redundant connections.
    These will tie in to a method of load balancing, either through dedicated hardware
    or through various software products, such as Linux Virtual Server (LVS).'
  - '[PAGE 28]


    # Web server cluster


    The next layer is where the Web servers reside. This is simply a group of machines
    running a Web server application, such as Apache. These servers can present static
    pages (sometimes called brochure) or they can have the core infrastructure of
    more complex pages with dynamic content. If a server fails, it will be noted by
    the load balancers, and requests will be sent to other servers. If the load increases
    dramatically, additional servers can be easily added.


    # Application server cluster


    The application layer is where server side is kept and run. Server side Java™
    is kept and run at this layer. This will generally be a type of high availability
    solution. At this level, it is still fairly easy to add additional machines to
    increase capacity.


    # Database server cluster


    Finally comes the database layer. This layer usually requires some form of HA
    solution. It is not uncommon, in a very large operation, for this to be a mainframe
    database. It is not difficult, using the backend outlined above, to create a robust,
    high availability database for the backend using Linux and various choices for
    databases, such as IBM''s DB2 or the open source MySQL. It is fairly difficult
    to increase capacity at this level without some thought and planning in the beginning.


    Also note that, in the Web server space, various layers can be combined in one
    machine or pair of machines. This is largely a consideration of the expected number
    of hours and how much hardware can be justified.


    # Server consolidation cluster


    It is not uncommon in today''s IT shops to have more and more file servers as
    departmental servers get added. At some point, there can be a pronounced cost
    and support advantage to consolidating these servers into a single large machine.
    If most of your data is stored, it makes sense that some high availability solution
    be developed. The infrastructure defined in "Database server cluster" on page
    7 can be used as a solution. There are also several methods of attaching network
    storage with multiple servers capable of sharing the data. Regardless of the architecture,
    the goal is to take many existing servers and combine them into a single solution
    that never fails.


    # 1.5.2 High-Performance Computing


    High-Performance Computing (HPC) is a branch of computer science that focuses
    on developing supercomputers, parallel processing algorithms and related software.
    HPC is important because of its lower cost and because it is implemented in sectors
    where distributed parallel computing is needed to:'
  - '[PAGE 29]


    +   - Solve large scientific problems

    - Advanced product design

    - Environmental studies (weather prediction and geological studies)

    - Research

    - Store and process large amounts of data

    - Data mining

    - Genomics research

    - Internet engine search

    - Image processing


    **Embarrassingly parallel (high-throughput computing)**

    Some applications, by their very definition, can be subdivided into smaller tasks.
    Suppose you wanted to search the encyclopedia for the phrase "never on sunday".
    You could pass sections of the encyclopedia to different people and subdivide
    the task. However, sometimes the pattern you wish to find is less defined. Say,
    for example, it is OK to search Sunday with other days of the week. This would
    mean seven times the search as in the first example, yet it would still be easy
    to subdivide.


    This is generally called embarrassingly parallel (more recently called high-throughput
    computing). SETI (Search for Extraterrestrial Intelligence) at Home is an excellent
    example of this. Each parcel of information needs to be searched for patterns.
    So each computer is given a piece of information with the patterns that apply
    to it and the data is scanned. The results are then sent back to the original
    location to be compiled into a whole. Many processes, such as looking for similar
    gene sequences, lends themselves to this type of cluster architecture.


    # Distributed computing


    Certain jobs, although broken apart, still require fair amount of communication
    from one node to the next. The IBM Linux Cluster Solution uses Myrinet™ as the
    high-speed switch fabric to provide low-latency, high-bandwidth, interprocess
    communications from node to node. Myrinet is configured to provide full bisection
    bandwidth which gives full bandwidth capability from any node to node at any time
    and can be scaled to thousands of nodes simply by adding additional switches.'
