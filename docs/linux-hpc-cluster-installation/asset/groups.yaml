    timezone parameter) | -6 |

    | mapperhost | Host that runs the GM mapper daemon | node1 |

    | clusterv | Name of the network card on the management node connected to the
    compute nodes | eth1 |

    | serialmac | Console serial port number for MAC address collection; represents
    N in /dev/ttySN | This value can be one of the following: 0 for COM A/1, 1 for
    COM B/2, NA for no MAC collection |

    | dynamicb | Private class B network used when getting MAC addresses | 172.16
    |


