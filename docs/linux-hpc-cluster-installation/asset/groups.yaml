    # 安装经验


    本附录提供了我们安装 Linux 集群的一些真实案例。这与其说是关于安装的技术细节，不如说是关于我们分享的经历和享到的乐趣。


    我们的第一个集群之一是一个小型八节点集群。这在某种程度上是一个试点项目，每个人都被带去查看。第一印象是最显著的。与其说是一个集群，不如说我们在几张桌子上堆满了数量难以置信的纸箱。所有都是分开运输的，无论是额外的内存、CPU
    还是机架本身。一个大箱内存内存模块，但为了构建集群，必须打开每个箱子，清点内容并组装计算节点和头节点。


