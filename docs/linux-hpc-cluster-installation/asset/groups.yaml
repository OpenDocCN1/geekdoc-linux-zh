  - '[PAGE 218]


    # Installation experiences


    This appendix provides some real life examples of our experiences installing Linux
    Clusters. This is far less about the technical details of an installation and
    far more about the experiences we have shared and the fun we had.


    One of the first clusters was a small, eight node cluster. This was somewhat of
    a pilot project and everyone was paraded to see it. The first impressions were
    the most notable. Instead of a cluster, we had several tables set up with unbelievable
    number of cardboard boxes. Everything was shipped separately, whether it be additional
    memory, CPUs or the racks themselves. One larger box contained all of the memory
    modules, but in order to build the cluster, each box had to be opened, the contents
    inventoried, and the compute and head nodes assembled.


    It was very impressive to see all the components waiting to be assembled and obtaining
    all of those components was a large task. We cannot caution you enough about planning
    your cluster installation. It is an extremely good idea to assemble your equipment
    order. Get a peer to review it. After it is reviewed, you should go through and
    check it again.


    There are a lot of pieces that go into making a High-Performance Computing cluster
    and a little extra work up front can dramatically ease the burden of assembly
    later.'
- md: "\nIt is also very important to track all of the parts and their status. Inevitably,\
    \ one or more key components will be constrained and you will have problems procuring\
    \ them. This is not as difficult as it is tedious. We recommend a little extra\
    \ time for this step and advise you to keep careful track of the inventory. When\
    \ nearly all of the parts have arrived, categorize the parts that are missing\
    \ their importance. This will allow you to focus on obtaining these items most\
    \ critical to your assembly of the cluster.\n\nWe can not say it enough: You cannot\
    \ plan often enough when building a cluster. In one 256-node cluster we built,\
    \ we neglected to move the communication port jumper to the COM2 position. Although\
    \ that task is fairly simple, multiplied by 256 and with the added burden of removing\
    \ each cover and possibly a PCI Adapter card, one small mistake was amplified\
    \ into a major task. Planning and attention to detail can avoid a lot of unnecessary\
    \ effort.\n\nTo avoid this particular problem, we devised a staging table, where\
    \ we have power, a keyboard, and a mouse. From here, we can easily open the machine\
    \ and add the required components. Typically, we would label the node at this\
    \ point. When we hook up the machine and flash the various BIOS. This can be done\
    \ later, but it is easier to repair any problems at this stage, with the machine\
    \ opened up and accessible. Once the machine's BIOS have been flashed and checked\
    \ out, we replace the cover and put it in a stack where it will wait for installation\
    \ in the rack.\n\nNow comes the part, and it really is. Everything is still fairly\
    \ messy, but there's a neatness to assembling the rack that is very satisfying.\
    \ Instead of haphazard piles of equipment everywhere, a cluster begins to evolve\
    \ in front of you.\n\nOne note on tools: If you do not have one already, we strongly\
    \ advise you to get an electric screwdriver. It is beneficial when removing and\
    \ replacing the covers, but it is almost required for assembling the equipment\
    \ in the racks, for larger clusters. \n\nOnce completed, your cluster should look\
    \ something like Figure E-1 on page 199. This picture is actually half of a 256-node\
    \ cluster. Each of the four racks, on either side, contain 32 nodes each. The\
    \ center rack contains the head node(s), the KVM switch and, in this case, some\
    \ of the Myrinet switches. Notice the perforated tiles in front of the rack. These\
    \ provide cool air which is pulled through the x330's and vents out the back.\
    \ For this reason, you cannot use a glass cover. We usually leave the front covers\
    \ off; however, vented front covers are available.\n\n![](img/ccdee7f1b1183ba808fa8386b0cb1315_220_0.png)\n\
    \nFigure E-1 256 node cluster\n\nThere is another thing to notice. There is exactly\
    \ one Keyboard, Video Display and Mouse (KVM) for the entire 256 node cluster.\
    \ The entire cluster has been designed to be easily managed without any physical\
    \ presence. However, during the build process, this single KVM can be a bottleneck,\
    \ as everyone crowds around one and one person types. You should consider this\
    \ when planning the installation of your cluster. It is difficult or impossible\
    \ to double up on tasks and it should be assumed that only one person will be\
    \ doing the actual installation.\n\nAs we have discussed, this is a 256-node cluster\
    \ and so far we have seen 128 of the nodes. Figure E-2 on page 200 shows the other\
    \ 128 nodes. Instead of the console, the center rack contains the Ethernet Switching\
    \ equipment; the large mass of cables are the Ethernet cables. This particular\
    \ configuration used a set of patch panels on the bottom of each rack. A standard\
    \ bundle was used to interconnect each 32-node rack with a patch panel near the\
    \ switch. The mass of cables shown are the patch cables interconnecting each rack's\
    \ patch panel with the switch, which is on top. Although this might sound difficult,\
    \ it allows far better rack staging at another location. Recently, we have begun\
    \ to include a small switch with each rack. Then the rack switch is tied in Gigabit\
    \ Ethernet and a Fiber Cable. This further simplifies the rack to-rack Ethernet\
    \ cabling. Clearly, cable management is a large concern, and some thought should\
    \ go into how you will manage the mass of cables in your particular environment.\n\
    \nAlso evident in E-2 is a crash cart. In this environment, a crash cart is not\
    \ really necessary. However, since there is only one KVM on the entire cluster,\
    \ having the crash cart allows a second person to be troubleshooting any hardware\
    \ problems while someone is still building the cluster.\n\n![](img/ccdee7f1b1183ba808fa8386b0cb1315_221_0.png)\n\
    \nFigure E-2 Fiber cables\n\nIn Figure E-3 on page 201 we have swung around to\
    \ the back of the front rack (the back of the rack is shown in Figure E-1 on page\
    \ 199). This is an early picture. If you look closely on the right side, you can\
    \ see some black cables. It looks like two cables, a gap of six machines or so\
    \ and then two more cables. These are the partially populated Myrinet cables,\
    \ which we'll show more closely in a moment.\n\nThe Ethernet cables are on the\
    \ left side of the cabinet (they are red in this case). These lead down to a patch\
    \ panel at the bottom of the rack. As mentioned before, this allowed all of the\
    \ internal cables to be installed at a staging area and greatly simplified the\
    \ on-site Ethernet cabling.\n\n![](img/ccdee7f1b1183ba808fa8386b0cb1315_222_0.png)\n\
    \nFigure E-4 ASMA and SPN cables\n\nFigure E-4 on page 202 is a closer view near\
    \ the top. In Figure E-3 on page 201 we have swung around to the back of the front\
    \ rack (the back of the rack is shown in Figure E-1 on page 199). This is an early\
    \ picture. If you look closely on the right side, you can see some black cables.\
    \ It looks like two cables, a gap of six machines or so and then two more cables.\
    \ These are the partially populated Myrinet cables, which we'll show more closely\
    \ in a moment.\n\nThe Ethernet cables are on the left side of the cabinet (they\
    \ are red in this case). These lead down to a patch panel at the bottom of the\
    \ rack. As mentioned before, this allowed all of the internal cables to be installed\
    \ at a staging area and greatly simplified the on-site Ethernet cabling.\n\nIn\
    \ a 256-node cluster, you need six 128 port Myrinet switches to maintain full\
    \ bisectional bandwidth. In this case, we had four switches in one rack. This\
    \ led to an incredible amount of cabling in this rack. In future racks, as the\
    \ clusters grow bigger, we will move to an environment similar to the Ethernet\
    \ switches. Instead of using a centralized set of switches, we will place a 64-node\
    \ switch in each rack. This will dramatically reduce the number of rack-to-rack\
    \ cables.\n\n![](img/ccdee7f1b1183ba808fa8386b0cb1315_223_0.png)\n\nIn a 256-node\
    \ cluster, you need six 128 port Myrinet switches to maintain full bisectional\
    \ bandwidth. In this case, we had four switches in one rack. This led to an incredible\
    \ amount of cabling in this rack. In future racks, as the clusters grow bigger,\
    \ we will move to an environment similar to the Ethernet switches. Instead of\
    \ using a centralized set of switches, we will place a 64-node switch in each\
    \ rack. This will dramatically reduce the number of rack-to-rack cables.\n\n![](img/ccdee7f1b1183ba808fa8386b0cb1315_224_0.png)\n\
    \nFigure E-5 Myrinet cables\n\nOnce the cables are run and neatly dressed, the\
    \ mechanical installation is complete.\n\nThis section was more about our practical\
    \ observations encountered while building a cluster than about the technical issues.\
    \ We hope you found this useful.\n\n# Cluster questionnaire\n\nThis appendix provides\
    \ the blank cluster questionnaires worksheets to be used during the process of\
    \ planning, architecture, and deployment:\n\n- Expectation questionnaire\n- Environmental\
    \ questionnaire\n- Hardware/configuration questionnaire\n- Software questionnaire\n\
    \n![](img/ccdee7f1b1183ba808fa8386b0cb1315_226_0.png)\n"
  mdcn: '

    跟踪所有部件及其状态也非常重要。不可避免的是，一个或多个关键组件会受到限制，导致你在采购这些组件时遇到困难。这并不困难，而是非常繁琐。我们建议为这一步骤留出一些额外时间，并建议你仔细跟踪库存情况。当几乎所有的部件都到齐时，根据缺失部件的重要性对它们进行分类。这将使你专注于获取这些对你集群组装至关重要的物品。


    我们再怎么强调也不为过：在构建集群时，你的规划做得多少都不够。在我们构建的一个包含 256 个节点的节点的集群中，我们忽略了将通信端口跳线移动到 COM2
    位置。虽然这项任务相当简单，但乘以 256 倍，再加上拆卸每个外壳和可能的 PCI 适配器卡的负担，一个微小的错误被放大成了一项艰巨的任务。规划和对细节的关注可以避免很多不必要的徒劳。


    为了避免这个特定问题，我们设计了一个组装台（staging table），那里有电源、键盘和鼠标。从这里，我们可以轻松打开机器并添加所需的组件。通常，我们会在这一阶段对节点进行标记。当我们连接机器并刷写各种
    BIOS 时（这可以稍后完成，但在机器打开且易于操作的阶段修复任何问题会更容易）。一旦机器的 BIOS 刷写完成并检查完毕，我们就换上外壳并将其放在一堆中，等待在机架中安装。


    现在到了部件阶段，而且是真的到位了。一切仍然相当杂乱，但组装机架带来的整洁感非常令人满足。不再是到处杂乱堆放的设备，一个集群开始在你面前演变。


    关于工具的一点说明：如果你还没有，我们强烈建议你买一个电动螺丝刀。在拆卸和更换外壳时很有用，但对于大型集群的机架设备组装，它几乎是必须的。


    完成后，你的集群看起来应该像第 199 页的图 E-1 所示。这张图片实际上是256 节点集群的一半。两侧的四个机架每个包含 32 个节点。中间机架包含头节点（节点）、KVM
    交换机，在这种情况下，还有一些 Myrinet 交换机。注意机架前面的穿孔板。它们提供了冷空气，冷空气通过 x330 抽入并从后部排出。出于这个原因，你不能使用玻璃盖。我们通常不装前盖；不过，也有通风前盖可供。


    ![](img/ccdee7f1b1183ba808fa8386b0cb1315_220_0.png)


    图 E-1 256 节点集群


    还有另一点需要注意。整个 256 节点集群仅有一个键盘、视频显示器和鼠标（KVM）。整个集群的设计是为了在没有任何物理在场的情况下易于管理。然而，在构建过程中，这一个
    KVM 可能会成为瓶颈，因为大家都会挤在一个设备周围，而只有一个人在打字。你在规划集群安装时应该考虑这一点。任务的双重叠加是困难或不可能的，应该假设只有一个人在进行实际安装。


    正如我们讨论过的，这是一个 256 节点的集群，到目前为止我们看到了 128 个节点。第 200 页的图 E-2 显示了另外的 128 个节点。中间机架包含的不是控制台，而是以太网交换设备；大堆电缆是以太网线。这种特定配置在每个机架底部使用了一组配线架。使用标准线束将每个
    32 节点的机架与靠近交换机的配线架连接起来。所示的大量电缆是连接每个机架配线架与顶部交换机的跳线线。虽然这听起来可能很难，但它允许在另一个地方进行更好的机架组装。最近，我们开始在每个机架中包含一个小型交换机。然后机架交换机通过千兆以太网和光纤连接。这进一步简化了机架间的以太网布线。显然，电缆管理是一个大关注点，你应该考虑如何管理你特定环境中的大量电缆。


    在 E-2 中同样显而易见的是一台推故障车（crash cart）。在这种环境下，推故障车并不是真的。然而，由于整个集群只有一个 KVM，拥有推故障车可以让另一个人在其他人仍在构建集群时排排除任何硬件问题。


    ![](img/ccdee7f1b1183ba808fa8386b0cb1315_221_0.png)


    图 E-2 光纤


    在第 201 页的图 E-3 中，我们转到了前部机架的背面（机架背面如第 199 页的图 E-1 所示）。这是一张早期照片。如果你仔细观察右侧，你可以看到一些黑色电缆。看起来是两根电缆，间隔大约六台机器，然后又是两根电缆。这些是部分填充的
    Myrinet 线，我们稍后会更详细地展示。


    以太网线位于机箱左侧（在这种情况下它们是红色的）。它们连接到机架底部的配线架。如前提到的，这允许所有内部电缆在组装区域安装，并极大地简化了现场的以太网布线。


    ![](img/ccdee7f1b1183ba808fa8386b0cb1315_222_0.png)


    图 E-4 ASMA 和 SPN 线


    第 202 页的图 E-4 是顶部的近视图。在第 201 页的图 E-3 中，我们转到了前部机架的背面（机架背面如第 199 页的图 E-1 所示）。这是一张早期照片。如果你仔细观察右侧，你可以看到一些黑色电缆。看起来是两根电缆，间隔大约六台机器，然后又是两根电缆。这些是部分填充的
    Myrinet 线，我们稍后会更详细地展示。


    以太网线位于机箱左侧（在这种情况下它们是红色的）。它们连接到机架底部的配线架。如前提到的，这允许所有内部电缆在组装区域安装，并极大地简化了现场的以太网布线。


    在一个 256 节点的集群中，我们需要六台 128 端口 Myrinet 交换机来保持全双工带宽。在这种情况下，一个机架中有四个交换机。这导致了机架内大量的电缆。在未来的机架中，随着集群的扩大，我们将采用类似于以太网的环境。我们不再使用集中的交换机，而是在每个机架中放置一个
    64 节点的交换机。这极大地减少了机架间的以太网布线。


    ![](img/ccdee7f1b1183ba808fa8386b0cb1315_224_0.png)


    图 E-5 Myrinet 线


    一旦电缆布好并整理好，机械安装就完成了。


    这一部分更多是关于我们在构建集群时遇到的实际观察，而不是技术问题。我们希望你发现这些有用。


    # 集群问卷


    本附录提供了在规划、架构和部署过程中使用的空白集群问卷工作：


    - 预期问卷

    - 环境问卷

    - 硬件/配置问卷

    - 软件问卷


    ![](img/ccdee7f1b1183ba808fa8386b0cb1315_226_0.png)

    '
