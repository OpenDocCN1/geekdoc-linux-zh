    ## 5.2 Populating the rack and cabling


    Before placing the nodes into the racks, you should know the position of your
    additional equipment, such as network switches, monitor switches, terminal servers,
    and so on. It would be very helpful to have a plan for the rack that was derived
    from the Rack Configurator or other source for this step.


    For most of the additional hardware, especially the switches, it is a good idea
    to place them in the middle of the rack, saving cable length and confusion. Heavy
    hardware, such as the management node, storage arrays, and the uninterruptible
    power supply (UPS) should be placed in the bottom. right-hand side of the racks
    (seen from the front of the rack), as most power supplies are on this side, too.
    This leaves the left-hand side for the KVM (Keyboard, Video, and Mouse) switch.


    Additionally, it is important to leave enough space for proper air flow and maintenance
    work.


    Next, put your nodes into the rack and label them correctly (as illustrated in
    Figure 5-5 on page 78):


    +   * One Node ID label on the front of the machine (for example, for x330s, on
    the CD-ROM drive)


    +   * One Node ID label on the rear, preferably on the left-hand side (for x330s,
    you will need to label the mounting rail, as there is not enough space on the
    rear of the box)


    ![](img/ccdee7f1b1183ba808fa8386b0cb1315_99_0.png)


    Figure 5-5 Node ID labeling on the front


    Once you have finished labeling, you can start to cable the rack. This includes
    labeling each cable that is longer than 1 foot or 30 cm at each end and using
    different colors for different kinds of cables. Although the cable management
    of the x340 and the Netfinity racks (with rack extensions) is not demonstrated,
    we highly recommend that you use their cable management features to achieve less
    confusion when regrouping your cluster''s cabling:


    - Connect the power cables (including the external ASMA AC adapter and additional
    devices, for example, switches) to the PDUs or APC Master Switches (whichever
    your rack is equipped with).


    - Connect your mounted monitor, mouse, and keyboard to the KVM switch of the rack.


    - Connect the C2T cables from node to node, daisy chaining them, and connect the
    C2T KVM splitting cable to the last C2T OUT port, which is then connected to the
    KVM switch of your rack using the KVM (NetBAY console) cable.


    - Connect the RS485 cables in daisy chains of eight nodes, plugging the last cable
    of each chain into the ASMA card dongle, which is directly connected to the ASMA
    card of that group.


    ![](img/ccdee7f1b1183ba808fa8386b0cb1315_100_0.png)


    Figure 5-6 C2T SPN/ASMA cabling


    Your rack should now look like Figure 5-6. After powering on the nodes (especially
    the ones with the ASMA cards inside), you can switch to their screens through
    C2T and the KVM switches:


    - Connect the terminal servers (Equinox ELS) to the FastEthernet switches.

    - Connect the ASMA card''s Ethernet interfaces to the FastEthernet switches.

    - Connect the nodes to the terminal servers (ELS) using the serial-to-CAT5 converters
    and CAT5 cables (see the left-hand side of Figure 5-7 on page 80).

    - Connect the FastEthernet cables from the nodes to the switches and the FastEthernet
    cable from the Myrinet switch management port to the FastEthernet switch (see
