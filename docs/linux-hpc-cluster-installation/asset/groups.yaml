    unless have been specifically requested. It also needs to provide some level of
    redundancy to deal with computational node failure and scale hundreds of jobs
    on thousands of nodes. Additionally, it should support hooks for the accumulation
    of multiple machines at different sites.


    # Job scheduler/policy manager


    The job scheduler takes the node and job information from the resource manager
    and produces a list. This list is sorted by the job scheduler and tells the resource
    manager when and where to run each job.


    The policy manager must have the flexibility to arbitrate a potentially complex
    set of parameters required to define a fair share environment, and yet retain
    the simplicity of expression that will allow the system administrators to implement
    politically driven resource allocations.


    For more information on the resource manager and the job scheduler/policy manager,
