    # Small test - CPI


    With MPICH, you will also have many test applications to ensure everything has
    installed OK. We used a program called CPI to test basic connectivity. It computes
    the value of pi and compares it to the value 3.14159265358972.


    The program CPI can be found in /usr/local/mpich/xxx/examples (depending on your
    compile options); in our case, the directory is the following:


    ```

