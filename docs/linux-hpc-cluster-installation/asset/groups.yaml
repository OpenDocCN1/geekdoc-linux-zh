    Task Force (DMTF), which include the Common Information Model (CIM), Web-Based
    Enterprise Management (WBEM), and the Extensible Markup Language (XML). It also
    supports the Simple Network Management Protocol (SNMP). This product includes
    key functions, such as robust group management from a central location, system
    discovery, hardware and software inventory, automated event responses, and monitoring
    and event alerting.


    IBM Director can only be used for monitoring messages coming from the ASM. It
    cannot be used during the installation phase in the same way that xCAT can.


    # 3.2.3 Development


    From a development point of view, a High-Performance Computing (HPC) cluster solution
    differs from other types of systems. For example, an HPC cluster requires special
    software components. This section provides a brief explanation of what compilers,
    libraries, and debuggers, all of which are required to build an HPC cluster solution.


    # Compilers


    The Portland Group is the premier independent supplier of scalar and parallel
    FORTRAN, C, and C++ compilers for High-Performance Computing (HPC) systems and
    Linux workstations, servers, and clusters.


    With the IBM Linux Cluster, you receive Parallel HPF/F90/F77/C/C++ compilers,
    and debugging and profiling tools for 32-bit Linux. The terms allow for an unlimited
    user license for use within the confines of the cluster.


    PGI key technologies include the following:


    - Native OpenMP and auto-parallel F77/F90/C/C++

    - Native High-Performance Fortran (HPF) compilers

    - Legacy SGI-style parallel directives and pragmas

    - Graphical debugging and profiling

    - Pentium II/III optimizations including SSE and prefetch

    - Function inlining

    - Loop unrolling

    - Cache tiling

    - C++ class member templates

    - Partial specialization and ordering

    - Class member templates

    - C++ STL and full interoperability with GNU compiler (gcc), GNU database (gdb)
    and g77.


    For more details on the Portland Group and its products and technologies, visit:

    http://www.pgroup.com/


    # Libraries


    The ScLAPACK (or Scalable LAPACK) library includes a subset of LAPACK routines
    designed for distributed memory MIMD parallel computers. It is currently written
    in a Single-Program-Multiple-Data style using explicit message passing for interprocessor
    communication. It assumes matrices are laid out in a two-dimensional block cyclic
    decomposition.


    Like LAPACK, the ScLAPACK routines are based on block-partitioned algorithms to
    minimize the frequency of data movement between different levels of the memory
    hierarchy. (For such cases, the memory hierarchy includes the off-processor memory
    of other processors in addition to the hierarchy of registers, cache, and local
    memory on each processor.) The fundamental building blocks of the ScLAPACK library
    are distributed memory versions Basic Linear Algebra Subroutines (PBLAS) of Level
    1, 2, and 3 Basic Linear Algebra Subroutines (BLAS), and a set of Basic Algebra
    Communication Subprograms (BLACS) for communication tasks arise frequently in
    parallel linear algebra computations. In the ScLAPACK routines, all inter-processor
    communication occurs within the PBLAS and the BLACS.


    For more information on ScLAPACK, see:


    http://www.netlib.org/scalapack/scalapack_home.html


    ATLAS is an approach for the automatic generation and optimization of numerical
    software for processors with deep memory hierarchies and pipelined functional
    units. The production of such software for machines ranging from desktop workstations
    to embedded processors can be a tedious and time consuming task. ATLAS has been
    designed to automate most of this process.


    We concentrate our efforts on the widely used linear algebra kernels called BLAS.
    In our particular, initial work is for general matrix multiply (DGEMM). However,
    much of the technology and approach developed here can be applied to the other
    Level 3 BLAS. The strategy can have an impact on basic linear algebra operations
    in general and may be extended to other important kernel operations, as sparse
    operations.


    For more information on ATLAS, refer to:

    http://www.netlib.org/atlas/


    # Debugger


    Among the tools available with the IBM Linux Cluster is a time-limited version
    of Etnus''s industry-leading TotalView Multiprocess Debugger. TotalView V4.1 is
    a full-featured, source-level graphical debugger for C, C++, FORTRAN 77 and 90,
    assembler, and mixed source/assembler codes. TotalView has an intuitive easy-to-learn
    interface with a user-friendly graphical user interface (GUI) that enables developers
    to debug complex multiprocessing, multithreaded, and clustered programs from a
    single session. For times when a GUI is impractical, TotalView offers a command
    line interface (CLI) as well. The CLI enables you to write debug scripts and macros
    to automate tedious debugging tasks.


    TotalView lets you temporarily insert compiled code fragments right into the program
    while you are debugging. Inserting compiled code fragments (and thereby performing
    hundreds or thousands of times faster) makes it likely these changes will mask
    any synchronization problems. You can debug remote programs over the network because
    of TotalView''s distributed architecture. This enables you to fix programs running
    on machines to which you do not have physical access. In addition, you can attach
    to running processes, so that you can debug processes that were not started under
    TotalView.


    The time-limited version of TotalView is available for unlimited use for 45 days
    from the installation of the license key.


    For more information, see:

    http://www.etnus.com/Products/TotalView/index.html


    # Parallel applications


    Many applications in a cluster will be custom built and designed. However, there
    are many standard applications available to do standard tasks. Examples of these
    are:


    - Blast: Typically used in genomics research to do pattern matching

    - Star-CD: Typically used in fluid dynamics modeling

    - LS-DNA: Typically used in crash simulations


    # 3.2.4 Resource management


    To provide a mechanism to schedule and manage batch job Batch System (PBS) from
    MR Linux Cluster comes with the Portable Batch Technology Solutions. PBS is a
    flexible batch software processing system developed at the NASA Ames Research
    Center. PBS operates on heterogeneous clusters of workstations, supercomputers,
    and massively parallel systems. The benefits of PBS include increased utilization
    of costly resources, a unified interface to all computing resources, reduced burden
    on system administrators and operators, and an elevated quality of service to
    the user community. Other key features of PBS include:


    - Portability: PBS complies with the POSIX 1003.2d standards for shells, utilities,
    and batch environments.

    - Configurability: PBS is easy to configure to match the requirements of individual
    sites. The flexible job scheduler allows sites to establish their own scheduling
    policies for running jobs in both time-shared and space-shared environments.

    - Adaptability: PBS is adaptable to a wide variety of administrative policies
    and provides an extensible authentication and security model.

    - Expand ability: PBS supports the dynamic distribution of production workloads
    across wide area networks and the creation of a logical organization from physically
    separate entities.

    - Flexibility: PBS supports both interactive and batch jobs.

    - Usability: PBS provides a graphical user interface (GUI) for job submission,
    tracking, and administration.


    For more information about PBS, see:

    http://www.pbsspro.com

