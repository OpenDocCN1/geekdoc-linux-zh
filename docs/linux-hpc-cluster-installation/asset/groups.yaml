    -   分布式管理服务与数据库


    到2001年底，将发布一个增强版本的 CSM，它将具有更好的扩展性和易用性。


    时间将证明 CSM 是会完全取代 xCAT，还是两者将并行共存，以满足不同的客户需求。


    # IBM Director


    IBM Director 是一款强大且高度集成的系统管理软件，它基于行业标准构建，并为易用性而设计。通过直观的基于 Java 的图形用户界面 (GUI)，管理员可以轻松地管理各种平台上的大组
    IBM 以及符合 Wired for Management 2.0 标准的非 IBM PC 服务器、桌面电脑、工作站和笔记本电脑。


    IBM Director 采纳了来自分布式管理任务工作组 (DMTF)的系统行业标准，包括通用信息模型 (CIM)、基于网络的企业管理 (WBEM) 和可扩展标记语言
    (XML)。它还支持简单网络管理协议 (SNMP)。该产品包含关键功能，例如从中心位置进行稳健的组管理、系统发现、硬件和软件清单、自动化事件响应以及监控和事件告警。


    IBM Director 仅用于监控来自 ASM 的消息。它无法像 xCAT 那样在安装阶段使用。


    # 3.2.3 开发


    从开发的角度来看，高性能计算 (HPC) 集群解决方案与其他类型的系统不同。例如，HPC 集群需要特殊的软件组件。本节简要说明编译器、库和调试器，这些工具都是构建
    HPC 集群解决方案所必需的。


    # 编译器


    Portland Group 是高性能计算 (HPC) 系统以及 Linux 工作站、服务器和集群的标量及并行 FORTRAN、C 和 C++ 编译器的顶尖独立供应商。


    通过 IBM Linux Cluster，你将获得并行 HPF/F90/F77/C/C++ 编译器，以及用于 32 位 Linux 的调试和性能分析工具。相关条款允许在集群内部使用无限制的用户许可。


    PGI 关键技术包括：


    - 原生 OpenMP 和自动并行的 F77/F90/C/C++

    - 原生高性能 Fortran (HPF) 编译器

    - 遗留 SGI 风格的并行指令和伪指令 (pragmas)

    - 图形化调试和性能分析

    - Pentium II/III 优化，包括 SSE 和预取

    - 函数内联

    - 循环展开

    - 缓存分块

    - C++ 类成员模板

    - 部分特化和排序

    - 类成员模板

    - C++ STL 以及与 GNU 编译器 (gcc)、GNU 数据库 (gdb) 和 g77 的完全互操作性。


    有关关于 Portland Group 及其产品和技术的更多信息，请访问：

    http://www.pgroup.com/


    # 库


    ScLAPACK（或可扩展 LAPACK）库包含一组 LAPACK 例程子集，专为分布式内存 MIMD 并行计算机设计。它目前采用单程序多数据（Single-Program-Multiple-Data）风格编写，使用显式消息传递进行处理器间的通信。它假设矩阵以二维块循环分解的方式布局。


    与 LAPACK 类似，ScLAPACK 例程基于块分划分算法，以最大限度地减少不同内存层次结构之间数据移动的频率。（对于这种情况，内存层次结构除了每个处理器上的寄存器、缓存和本地内存层次外，还包括其他处理器的处理器外内存。）ScLAPACK
    库的根本构建模块是分布式内存版本的第 1、2、3 级基础线性代数子程序 (PBLAS)，以及一组用于并行线性代数计算中频繁出现的通信任务的基础代数通信子程序
    (BLACS)。在 ScLAPACK 例程中，所有处理器间的通信都在 PBLAS 和 BLACS 内部完成。


    关于 ScLAPACK 的更多信息，请参阅：


    http://www.netlib.org/scalapack/scalapack_home.html


    ATLAS 是一种针对具有深层内存层次结构和流水线功能单元的处理器自动生成并优化数值软件的方法。ATLAS 能够处理从工作站到嵌入式处理器的各种机器，这是一项非常耗时的任务。


    我们专注于可用于时间共享环境的 BLAS。ATLAS 能够处理通用矩阵乘法 (DGEMM)，这种方法可以扩展到其他线性代数运算。


    有关 ATLAS 的更多信息，请参考：

    http://www.netlib.org/


    # 调试器


    IBM Linux 集群提供的工具中，包含了 Etnus 领先的 TotalView 多进程调试器。TotalView4.1 是针对 C++、FORTRAN
    77/90 以及汇编语言的全功能图形调试器。TotalView 具有直观且易于学习的界面以及用户友图形界面 (GUI)，允许开发者调试多进程、多线程程序。对于图形界面不实用的情况，TotalView
    也提供了命令行界面 (CLI)。CLI 允许你编写脚本和宏来自动化调试任务。


    TotalView 允许你在调试时向程序中插入代码片段（从而提高数千倍），这可能会掩盖同步问题。由于 TotalView 的分布式架构，你可以在网络上调试无法物理访问的机器上的程序。此外，你还可以挂载到正在运行的进程。


    TotalView 的试用版从安装许可证密钥起可无限使用 45 天。


    更多信息，请参阅：

    http://www.etnus.com/TotalView/index.html


    # 并行应用


    集群中的许多应用程序将是定制和设计的。然而，也有许多标准应用程序可执行标准任务。例如：


    - Blast：通常用于基因组研究中的模式匹配

    - Star-CD：通常用于流体力学建模

    - LS-DNA：通常用于碰撞模拟


    # 3.2.4 资源管理


    为了提供调度和管理批作业的机制，MR Linux Cluster 配备了便携式作业系统 (PBS)。PBS 是在 NASA 姆斯研究中心开发的灵活作业软件处理系统。PBS
    运行在工作站、超级计算机和大规模并行系统的异构集群上。PBS 的优点包括提高昂贵资源的利用率、统一所有计算资源、减轻系统管理员和操作员的负担，并提高用户社区的服务质量。PBS
    的其他关键特性包括：


    - 可移植性：PBS 符合 POSIX 1003.2d Shell、工具和作业环境标准。

    - 可配置性：PBS 易于配置以匹配各个站点的需求。灵活的作业调度器允许站点为时间共享和空间共享环境中的作业建立自己的调度策略。

    - 适应性：PBS 适应各种管理策略，并提供可扩展的身份验证和安全模型。

    - 可扩展性：PBS 支持跨域网动态分配生产负载，并从物理分离的实体创建逻辑组织。

    - 灵活性：PBS 支持交互式作业和批作业。

    - 易用性：PBS 提供了用于提交、跟踪和管理的图形界面 (GUI)。


    有关 PBS 的更多信息，请访问：

    http://www.pbsspro.com


