- md: '

    For more information on KickStart please go to:

    http://www.linuxdoc.org/HOWTO/KickStart-HOWTO.html


    # Advanced Linux Installation and Configuration Environment (ALICE)


    ALICE is a tool based on scripts and programs to customize installations files
    and operations. ALICE works in combination with YaST (Yet another Setup Tool),
    the SuSE installation and administration utility. YaST will partition and format
    the hard disk and then install the selected packages. Afterwards, ALICE takes
    control and modifies the target''s system configurations files: Add users and
    groups and enable/disable services.


    # File systems


    Another important issue regarding operating systems is the available file systems.
    We have to consider different types of file systems, each suitable for different
    scenarios. First, we look at traditional file systems and afterwards at some distributed
    file systems.


    # Local file systems


    Most of the current Linux installations use the traditional Linux file system
    ext2 since it proves very reliable performance for most purposes.


    There are performance issues in ext2 file systems when dealing with a large amount
    of small files. Furthermore, there is a demand for handling files larger than
    2 GB that is not provided by the regular ext2 file system. There is a kernel patch
    for ext2 that enables it to support files larger than 2 GB, but it requires your
    application to be rebuilt against large file functions providing libraries.


    What are the new file systems? Currently, there is one, or less enterprise-ready,
    file system available. It is called ReiserFS and is based on balanced trees, giving
    a huge performance increase for most scenarios. Additionally, it supports journaling
    and allows faster restart after a system crash or power outage. It also supports
    file systems larger than 2 GB.


    Other file systems addressing the same issues are JFS from IBM, XFS from SGI,
    and ext3, an enhanced version of ext2 that supports journaling. As all of those
    file systems are not available for daily production use, we will not cover them
    in great detail.


    # Network File System (NFS)


    NFS is the best known network file system. Beowulf clusters always use the NFS
    protocol to provide a client/server distributed file system architecture and Remote
    Procedure Call (RPC) calls to communicate.


    The server exports files to a client that accesses them as if they are local.
    NFS does not save information about the client that made the request, so every
    client is considered independently. Therefore, they must contain all the information
    necessary for execution each time they make a call to the server. This causes
    large messages and consumes a lot of network bandwidth. The advantage, however,
    of this system is that if the client crashes, the server does not hang, but continues
    working and satisfying all the other requests.


    NFS has some well-known performance and scalability issues. Some of those solved
    NFSv3, a newer version and implementation of NFS, also available for Linux (Kernel
    2.4.X). Nevertheless, there is increasing demand for better file systems.


    # Andrew File System (AFS)


    AFS was originally developed by Carnegie-Mellen University and was later turned
    into a commercial product of Transarc, now part of IBM. In 2000, IBM made its
    AFS enterprise file system product available to the open source community under
    the IBM Public License (IPL).


    AFS is a very scalable, highly availability secure file system with a very robust
    data management model. Lacking a stable Linux AFS server, this created the need
    for a second platform, such as AIX, running the AFS.


    The use of AFS makes the most sense if you already have an AFS cell as part of
    your environment that you want to integrate into your cluster.


    For further information regarding AFS please visit:


    ```

    http://www.transarc.ibm.com/

    ```


    Besides the IBM AFS client, there is another free AFS client implementation for
    Linux. It is called the ARLA Project, and it can be found at:


    ```

    http://www.stacken.kth.se/projekt/arla/

    ```


    # Global File System (GFS)


    GFS is a shared disk file system for Linux. It is designed to support multi-client
    journaling and rapid recovery from client failures. All nodes are equal, and no
    server may be a bottleneck or a single point of failure.


    The GFS nodes physically share the same storage, Fibre Channel, or shared small
    computer system interface (SCSI) devices. The file system appears to be local
    on each node and GFS synchronizes file access across the cluster.


    GFS is available from http://www.globalfile-system.org/ under the GNU Public License
    (GPL). Further documentation and information can also be found there.


    # General parallel system (GPFS)


    Capable of scaling to nine TB, GPFS is being ported to Linux, where it will be
    known as Blue Hammer.


    At the center of Blue Hammer is the SP supercomputer''s parallel system support
    program (PSSP) cluster management software and GPFS.


    For more information on this issue, please refer to the following IBM Redbooks:


    - GPFS: A Parallel File System, SG24-5165

    - Sizing and Tuning GPFS, SG24-5610

    - PSSP 2.4 Technical Presentation, SG24-5173

    - PSSP 3.1 Announcement, SG24-5332

    - PSSP 3.2: RS/6000 SP Software Enhancements, SG24-5673


    PVFS is designed as a client-server system with multiple servers (called I/O daemons):


    - I/O daemons typically run on separate nodes (I/O nodes) in the cluster.

    - PVFS files are striped across the disks on the I/O nodes.

    - Application processes interact with PVFS through a client library.

    - Application processes interact with PVFS through a client library.

    - The I/O daemons handle permissions, open, close.

    - The client library and I/O daemons handle operations without needing the manager.

    - The manager handles parallel operations on different machines.


    The purpose of PVFS is to provide:


    - High-speed access to data

    - Cluster-wide consistent name space

    - Striping of data across disks on the I/O nodes


    # 3.2.2 System management


    Due to the large amount of management tasks that arise in cluster, system management
    is one of the hotly discussed components. Although the current solution includes
    xCAT, this section also provides a brief explanation about cluster management
    (CSM).


    xCAT was developed by IBM-IBM as a means of simplifying cluster installation.
    It has proven to be a very effective tool for this purpose. It allows for simplified
    management of a single machine or ranges of machines, including:


    - Remote power control

    - Remote hardware reset

    - Remote software reset

    - Remote OS console

    - Remote BIOS console

    - Remote vitals (fan speed, temperature, etc.)

    - Remote hardware logs

    - Remote hardware inventory

    - Parallel remote shell

    - Parallel ping

    - Command line interface (no GUI)

    - Parallel operations can be applied to multiple nodes

    - Network installation (KickStart)

    - Support for various node types

    - SNMP alert logging


