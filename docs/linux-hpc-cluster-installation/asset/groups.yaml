    # 1.5.1 High Availability (HA) clusters


    HA clusters are not easily categorized. Indeed, we are sure that many people can
    offer valid reasons for why a different logical structure of organization would
    be appropriate. Our logical structure of organization is based on function. For
    example, we organize a database cluster or a server consolidation cluster under
    the heading of an HA cluster, since their paramount consideration is usually high
    availability.


    Web clusters, while certainly an HA type of cluster, are often categorized by
    themselves, and we will discuss them in "Web clusters and Web farms" on page 5.


    In a typical HA cluster, there are two or fairly robust machines which mirror
    each other''s functions. Two schemes are typically used to achieve this.


    In the first scheme, one machine is quietly watching the other machine and waiting
    to take over in case of a failure.


    The other scheme allows both machines to be active. In this environment, care
    should be taken to keep the load below 50 percent on each node or else there be
    capacity issues if a node were to fail. These two nodes typically have a shared
    disk drive array comprised of either a small computer system interface (SCSI)
    or a Fibre Channel; both nodes talk to the same disk array.


    Or, instead of having both nodes talking to the same array, we can have separate
    arrays that constantly replace each other for fault tolerance. Within this subsystem,
    it is necessary to guarantee data integrity with file andor record locking. There
    must also be a management system in place allowing each system to monitor and
    control the other in order to detect an error. If there is a problem, one system
    must be able to incapacitate the other machine, thus preserving data integrity.


    There are many ways of designing an HA cluster and the list is growing.


    # Web clusters and Web farms


    Web clusters generally bring elements from many other computing platforms or other
    clusters and are often a hybrid of various technologies. A typical Web cluster
    is more a collection of machines creating an infrastructure than an actual cluster.
    We will explore a typical Web cluster by starting at the top, where it interfaces
    with the Internet, and finish at the bottom, where the data content is kept.'
