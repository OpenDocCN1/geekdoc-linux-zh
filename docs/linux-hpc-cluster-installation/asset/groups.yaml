    - 从节点到交换机连接 FastEthernet 线缆，从 Myrinet 交换机管理端口到 FastEthernet 交换机连接 FastEthernet
    线缆（见第 80 页图 5-7 的右侧）。


    ![](img/ccdee7f1b1183ba808fa8386b0cb1315_101_0.png)


