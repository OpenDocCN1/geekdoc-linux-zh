    You can also specify, by host name, if your network is non-contiguous, although
    this has a small performance penalty. For example:


    ```

    # /home node*(rw)

    ```


    Once you have modified /etc/exports, start NFS with the command:'
  - '[PAGE 137]


    ```

    # /etc/rc.d/init.d/nfs start

    ```


    Verify the file systems have been correctly exported by querying the NFS server,
    as shown in Example 7-9.


    ```

    Example 7-9 Output of showmount -e

    [root@master ~] showmount -e

    Export list for master:

    /home 192.168.0.0/255.255.255.0

    /usr/local 192.168.0.0/255.255.255.0

    /install/post 192.168.0.0/255.255.255.0

    /install/rh62 192.168.0.0/255.255.255.0

    ```


    If the list does not match your /etc/exports, there is probably an error in the
    file. If the command fails completely, NFS is probably not working.


    Once NFS works, configure it to start at boot-time with the command:

    # /sbin/chkconfig nfs on


    # 7.2.4 Dynamic Host Configuration Protocol (DHCP)


    DHCP can be automatically configured using the gendcp script supplied with xCAT.
    Note that this script sets up an alias on your cluster adapter. If you specified
    eth1 for clustervian in site.tab, gendcp will create the alias eth1:0. Do not
    use this alias yourself or it will be overwritten.


    The gendcp command creates a skeleton of the dhcpcd.conf in /tmp:

    # gendcp


    The output from the script will suggest you edit dhcpcd.conf by adding IP addresses
    for other devices, such as your Myrinet switch.


    > Note: You need to remove unwanted network entries. In our lab we found some
    unwanted entries that were removed.


    To add an entry for a static host, you need to know the MAC address of the device.
    Make sure the entry to the stanza matches your management network. An example
    of a static host is shown in Example 7-10.


    ```

    Example 7-10 subnet declaration for dhcpcd.conf

    ## subnet declaration for management network

    subnet 192.168.2.0 mask 255.255.255.0 (

    ## Static host entry for the myrinet switch

    host mgmyril {

    hardware ethernet 00:60:dd:7f:94:b0;

    fixed-address mgmyril;

    ```


    116 Linux HPC Cluster Installation'
  - '[PAGE 138]


    ```

    }

    }

    ```


    When you are done editing the dhcpd.conf, copy it to /etc and restart the DHCP
    server with the command:


    ```

    # cp -f /tmp/dhcpd.conf /etc/

    # /etc/rc.d/init.d/dhcpd restart

    ```


    If there is an error in dhcpd.conf, the server will fail to start and produce
    an error message. Check the dhcpd.conf and your site.tab and re-run genhdcp if
    necessary. Also check errors at /var/log/message.


    > Tip: An alternative to avoid having DHCP to offer and assign IP addresses in
    all interfaces (eth0, eth1...) is to modify the dhcpd script by adding the interface
    name in the dhcpd startup. The script is located at /etc/rc.d/dhcpd. For example:


    # Start daemons.

    echo -n "Starting dhcpd: " daemon /usr/sbin/dhcpd eth1


    # 7.3 Collect MAC addresses


    Once the DHCP server has been set up, we are almost ready to collect the MAC addresses
    of the nodes. Two scripts must be run before we do the collection:


    +   # /usr/local/xcat/stage/mkstage

    # /usr/local/xcat/ks62/mks


    Part of the work these scripts do is validation. If they report missing files
    or similar errors, it probably means you have missed a step of the installation
    process. Their main task is to create various files in /ttpboot from the remote
    boot process.


    If mkstage and mkks run OK, it is to collect the MAC addresses. This is done using
    the getmacs script, as shown in Example 7-11.


    Example 7-11 Running getmacs


    ```

    [root@master /root]# cd /tmp

    [root@master /tmp]# /usr/local/xcat/sbin/getmacs all

    ```


    Please reset nodes: node node2 node3 node4'
  - '[PAGE 139]


    Press [Enter] when ready...


    Saving output to mac.lst in current directory /tmp.


    ```

    node4 00:06:29:1F:28:CD

    node3 00:06:29:1F:6C:87

    node2 00:02:55:54:28:50

    node1 00:06:29:1F:29:69

    ```


    Edit mac.lst and merge with /usr/local/xcat/etc/mac.tab


    ```

    root@master #

    ```


    The getmacs script will prompt you to reset the nodes; right now, this has to
    be on the front panel, because the service processor network (SPN) is not yet
    set up. Power on or press the reset button on all the nodes you are collecting
    MAC addresses for and then press Enter.


    As it runs, getmacs outputs to the panel and to the mac.lst file. If no nodes
    report MAC NO, then you have successfully captured the addresses of all your nodes.
    Unfortunately, it is not uncommon for one or two nodes to fail. If this happens,
    you must run them again for the nodes that failed. Be sure and save your mac.lst
    somewhere before you run them again, because it will overwrite your original file.
    Once you have the MAC addresses of all the nodes, merge them into a single file
    and copy this to mac.tab. This can be done with a text editor, or if you named
    your files with the mac.lst prefix, you can use the command:


    ```

    # grep -hv ''NO MAC'' mac.lst | sort > /usr/local/xcat/etc/mac.tab

    ```


    If the MAC address capture fails on all your nodes or you have persistent errors
    with a particular node, there are a number of things to check:


    +   - MAC address collection (depends on DHCP)

    - TFTP and the remote console facility and rcons


    The first place to look for clues is the console of the node; Pre-Execution Environment
    (PXE) produces very helpful error messages. If the node is actually booting Linux,
    you may need to use rcons to see all of the messages or look in /var/log/consoles.
    The other place to check (for most things) is the syslog output in /var/log/messages.


    > Important: At this point, if you still have problems collecting MAC addresses,
    we recommend you go back to the Section 6.4, "Additional software installation"
    on page 93 for help.'
- md: "\n# 7.4 Setup rangers (stage3)\n\nOnce you have the MAC addresses of the nodes,\
    \ the next stage is to set up the ASM network. This uses a similar process to\
    \ getmacs; if that worked without any problems, this should be fairly straightforward.\n\
    \nFirst, you must configure the DHCP server with the MAC addresses of the nodes,\
    \ since the ASM setup sets the name to the host name of the node's IP. Run the\
    \ makedcp command (that is different from the genchcp command used), then use\
    \ the nodeset command to set the nodes to stage3.\n\n```\n# /usr/local/xcat/bin/makedcp\n\
    # /usr/local/xcat/bin/nodeset all stage3\n```\n\nThe management is now ready for\
    \ ASM setup. Press the reset button on all the nodes and their rangers should\
    \ be automatically set up. You can monitor the progress of the setup by running:\n\
    \n```\n# /usr/bin/watch /usr/local/xcat/bin/nodeset all stat\n```\n\nThe nodes\
    \ will start out at stage3 and as they complete, setup will change over boot.\
    \ If any of the nodes fail to change over, they might simply need resetting again\
    \ when the network is quieter; do not forget to check the nodes and syslog for\
    \ errors. The most likely causes of persistent problems are corrupted dhcp.conf\
    \ or a named error.\n\nWhen all the nodes have reverted to boot, check to see\
    \ if the SPN setup completed correctly by running:\n\n```\n# /usr/local/xcat/bin/rinv\
    \ all serial\n```\n\nEnsure all nodes show up and with a unique serial number.\n\
    \n# 7.5 Install first node\n\nThe nodes are now ready to be installed. It is a\
    \ good idea to install a single node before installing the entire cluster so any\
    \ problems can be easily identified.\n\nNodes are installed using the install\
    \ command or winstall if you want to watch the install. For example:\n\n```\n\
    # /usr/local/xcat/bin/winstall node1\n```\n\nNote that winstall uses rcons, so\
    \ it may take a little while before any output appears in the panel.\n\nIf something\
    \ fails, it is most likely NFS or a problem caused by an error in the xCAT tables,\
    \ since DHCP and TFTP have been tested by now. Again, check the consoles and logs\
    \ for more information, paying particular attention to the console log. If you\
    \ ran install, there may be partially obscured messages on the panel; you can\
    \ read these from the console log if you need to.\n\n# 7.6 Install remaining nodes\n\
    \nOnce you know the install process works for one node go ahead and install the\
    \ remaining nodes. If you do not have many nodes, it is best to use install for\
    \ this process, since you can watch all the nodes installing at once. To open\
    \ console panels and install all nodes except node1, use the command:\n\n```\n\
    # /usr/local/xcat/bin/install all,-node1\n```\n\nAs with stage3, you may want\
    \ to watch to verify when all the nodes have been installed.\n\n# 7.7 Post install\n\
    \nOnce all the nodes are installed, the last thing you need to do is generate\
    \ the ssh global known hosts file. First, verify that all the nodes are up and\
    \ running with the command:\n\n```\n# /usr/local/xcat/bin/ping all\n```\n\nIf\
    \ any nodes come back with noping, they may not have finished rebooting after\
    \ the install or may have gone wrong at reboot. Have a look in that node's console\
    \ log for errors.\n\nCollect the hot keys for all the nodes using makeshghkh:\n\
    \n```\n# /usr/local/xcat/sbin/makeshghkh all\n```\n\nYou should see a message\
    \ from all the nodes, but it is difficult to see if it succeeded or not. Check\
    \ the file /usr/local/xcat/etc/gkh and make sure there is an entry for all the\
    \ nodes. If not, run makeshghkh again for the missing nodes. If it continues to\
    \ fail, there may have been a problem with the nodes installation; check the console\
    \ log for possible error messages.\n\nYou can verify that the keys are correct\
    \ using the psh command, which relies on ssh. Dist the hostname command to all\
    \ the nodes and ensure they respond without errors. See Example 7-12 on page 121\
    \ for details.\n\nExample 7-12 Using psh to verify the operation of all the nodes\n\
    \n```\n[root@master /root]## psh all\nExecuting on: node1 node2 node3 node4\n\
    > hostname\nnode1: node1\nnode2: node2\nnode3: node3\nnode4: node4\n> ^D\n[root@master\
    \ /root]##\n```\n\nCongratulations! You have now competed your basic cluster installation.\n\
    \n# Installation of additional components\n\nIn this chapter, the installation\
    \ of some additional components are shown, such as compilers and libraries.\n\n\
    This is the list of the installation components presented in this chapter:\n\n\
    - GCC compiler\n- PGI compiler\n- MPICH, using TCP/IP\n- MPICH, using Myrinet\
    \ GM\n\n# 8.1 Install GCC and PGI Compiler\n\nIn this section, we will discuss\
    \ how to install the GNU C compiler (gcc) and PGI compilers.\n\n## 8.1.1 GNU C\
    \ compiler (gcc)\n\ngcc is included in every common Linux distribution and is\
    \ installed as a default. for some reason you do not have it installed, you can\
    \ download it from:\n\n```\nhttp://www.gcc.org/software/gcc.html\n```\n\nFollow\
    \ the instructions on:\n\n```\nhttp://www.gcc.org/software/gcc/install/index.html\n\
    ```\n\nIf you prefer RPM, try the biggest repository at:\n\n```\nhttp://rpm-find.net/linux/RPM/\n\
    ```\n\nand install it using the command:\n\n```\nrpm -Uvh gcc-xx\n```\n\nTo check\
    \ which version of GCC you have, use the following command:\n\n```\n[root@master]#\
    \ gcc -v\nReading specs from /usr/lib/gcc-redhat-linux/gcc-2.9.1/specs\ngcc version\
    \ 2.9.1 (Several bugs have been found in the GNU Compiler Collection that shipped\
    \ with Red Hat 7.0. For Security fixes, bugs, and package enhancements, go to:\
    \ http://www.redhat.com/support/errata After, you can proceed to MPICH installation.\n\
    \n## 8.1.2 PGI Workstation\n\nThe PGI Workstation is a full suite of F77, F90,\
    \ HPF, C and C++ compilers and development tools. The release used was v3.2; you\
    \ can obtain it from: http://www.pgroup.com. The file you need is linux86-HPF-CC.tar.gz,\
    \ and the size of the file is 16 MB. Note: If you are using the trial version\
    \ of PGI Workstation, the compiler and all compiled executables will cease to\
    \ function after 15 days. Each time you compile using the trial version, it will\
    \ remind you of the time you have left. To overcome this situation, you need to\
    \ obtain the permanent keys from Portland Group. Any executable, object files,\
    \ or libraries created using the PGI compilers in trial mode must be recompiled\
    \ with the permanent keys in place.\n\n# Install PGI Workstation\n\nFor instructions,\
    \ refer to PGI Workstation online documentation.\n\n1. Create the following directories\
    \ with the command:\n\n```\n[root@master]# mkdir /usr/local/pgi\n[root@master]#\
    \ mkdir /tmp/pgi\n[root@master]# cd /tmp/pgi\n```\n\n2. Set environment variables.\
    \ If you prefer, you can export them in your login file at $HOME/.bashrc or create\
    \ /etc/profile/pgi.sh. Use the commands:\n\n```\n[root@master]# export PGI=/usr/local/pgi\n\
    [root@master]# export PATH=$PGI/linux86/bin:$PATH\n[root@master]# export MANPATH=$MANPATH:$pgi/man\n\
    ```\n\n3. Unpack the downloaded archive with the commands:\n\n```\n[root@master]#\
    \ cp -v pgi DOWNLOAD=/linux86-HPF-CC.tar.gz\n[root@master]# tar -zxvf linux86-HPF-CC.tar.gz\n\
    ```\n\n4. Install the package (PGI Workstation or PGI Server) with the following\
    \ script:\n\n```\n[root@master]# ./install\nThis script installs PGI Workstation\
    \ products for the Linux and Solaris operating systems. Select the product below\
    \ that you purchased, and the directory where the software is to be installed.\n\
    ```\n\n| | |\n|---|---|\n| 1 | PGCC Workstation or PGCC Server |\n| 2 | PGF77\
    \ Workstation or PGF77 Server |\n| 3 | PGHP Workstation or PGHP Server |\n| 4\
    \ | PGF77/PGCC Workstation or PGF77/PGCC Server |\n| 5 | PGI Workstation or PGI\
    \ Server |\n\n(PGI, PGHP, PGCC, and PGF77 are all reg. U.S. Patent and Trademark\
    \ Office to The Portland Group, Inc.)\n\nEnter a number between 1 and 5:\n\n2\
    \ < in this demo we prefer option 2, in production you should probably use option:\
    \ 5\n\nPlease specify the directory path under which the software will be installed.\
    \ The default directory is /usr/pgi, but you may install wherever you wish, assuming\
    \ you have permission to do so.\n\nInstallation directory [/usr/pgi]?\n/usr/local/pgi/\n\
    \nInstalling software into /usr/local/pgi (this may take some time).\n\nIf you\
    \ don't already have permanent keys for this product/release, a fifteen-day evaluation\
    \ license can be created now.\nCreate an evaluation license? [y/n]\ny\n\nDo you\
    \ accept these terms? [accept,decline]\naccept\nCreating temporary license.\n\
    Please enter your name: Name\nPlease enter your user name: User Name\nPlease enter\
    \ your E-mail address: eMail\n\nDo you wish to change anything? [yes/no]: no\n\
    \nThe above information was saved to /usr/local/pgi/license.info. \nDo you want\
    \ the files in the install directory to be read-only? [y,n]\ny\n\nOnce you are\
    \ done, you can check the versions of the compilers by appropriate command:\n\n\
    - For Fortran 77, use pgf77 -V\n- For Fortran 90, use pg90 -V\n- For HPF, use\
    \ pghpf -V\n- For C++, use pgCC -V\n- For ANSI C, use pgcc -V\n"
  mdcn: "\n\n# 7.4 设置 rangers (stage3)\n\n一旦你获得了节点的 MAC 地址，下一步是设置 ASM 网络。这使用的过程与 `getmacs`\
    \ 类似；如果该步骤运行得没有任何问题，那么这一步应该非常简单。\n\n首先，你必须使用节点的 MAC 地址配置 DHCP 服务器，因为 ASM 设置会将名称设置为节点\
    \ IP 的主机名。运行 `makedcp` 命令（注意，这与之前使用的 `genchcp` 命令不同），然后使用 `nodeset` 命令将节点设置为 stage3。\n\
    \n```\n# /usr/local/xcat/bin/makedcp\n# /usr/local/xcat/bin/nodeset all stage3\n\
    ```\n\n现在管理已准备好进行 ASM 设置。按下所有节点上的重置按钮，它们的 rangers 就会自动设置。你可以通过运行以下命令监控设置进度：\n\n\
    ```\n# /usr/bin/watch /usr/local/xcat/bin/nodeset all stat\n```\n\n节点将从 stage3\
    \ 开始，随着它们完成任务，设置将在启动时切换。如果任何节点未能切换，可能只需要在网络较空闲时再次重置；不要忘记检查节点和系统日志（syslog）中的错误。持续问题最可能的原因是\
    \ `dhcp.conf` 损坏或命名错误。\n\n当所有节点都恢复到 boot 时，运行以下命令检查 SPN 设置是否正确完成：\n\n```\n# /usr/local/xcat/bin/rinv\
    \ all serial\n```\n\n确保所有节点都显示出来并且具有唯一的序列号。\n\n# 7.5 安装第一个节点\n\n节点现在已准备好进行安装。在安装整个集群之前，安装单个节点是一个好主意，这样任何问题都可以被轻松识别。\n\
    \n使用 `install` 命令或如果你想观察安装过程则使用 `winstall` 来安装节点。例如：\n\n```\n# /usr/local/xcat/bin/winstall\
    \ node1\n```\n\n注意 `winstall` 使用了 `rcons`，因此面板上可能需要一段时间才会出现输出。\n\n如果某些部分失败了，最可能是\
    \ NFS 问题或由 xCAT 表错误引起的问题，因为此时 DHCP 和 TFTP 已经通过了测试。再次检查控制台和日志以获取更多信息，特别注意控制台日志。如果你运行的是\
    \ `install`，面板上可能有部分遮挡的消息；如果需要，你可以从控制台日志中读取这些内容。\n\n# 7.6 安装剩余节点\n\n一旦你确认安装过程对一个节点有效，就可以继续安装剩余节点。如果你的节点不多，最好在此过程中使用\
    \ `install`，因为你可以同时监视所有节点的安装情况。要打开控制台面板并安装除 node1 以外的所有节点，请使用以下命令：\n\n```\n# /usr/local/xcat/bin/install\
    \ all,-node1\n```\n\n与 stage3 一样，你可能想通过观察来验证所有节点是否已完成安装。\n\n# 7.7 安装后\n\n所有节点安装完成后，你需要做的最后件事是生成\
    \ ssh 全局已知主机文件（global known hosts）。首先，运行以下命令验证所有节点都已正常运行：\n\n```\n# /usr/local/xcat/bin/ping\
    \ all\n```\n\n如果任何节点返回 `oping`，它们可能在安装后尚未完成重启，或者在重启时出现错误。查看该节点的控制台日志以查找错误。\n\n\
    使用 `makeshghkh` 收集所有节点的热键：\n\n```\n# /usr/local/xcat/sbin/makeshghkh all\n```\n\
    \n你应该能看到来自所有节点的消息，但很难判断是否执行成功。检查文件 `/usr/local/xcat/etc/gkh` 并确保所有节点都有对应的条目。如果没有，为缺失的节点再次运行\
    \ `makeshghkh`。如果持续失败，可能是节点安装出了问题；检查控制台日志。\n\n你可以使用依赖 `ssh` 的 `psh` 命令验证密钥是否正确。详细信息请见第\
    \ 12 页的示例 7-12。使用 psh 操作所有节点：\n\n```\n[root@master /root]# psh all\nExecuting\
    \ on: node1 node2 node3 node4\n> hostname\nnode1: node1\nnode2: node2\nnode3:\
    \ node3\nnode4: node4\n[root@master /root]#\n```\n\n恭喜！你现在完成了基础集群安装。\n\n# 安装附加组件\n\
    \n在本章中，将展示某些附加组件的安装，例如编译器和库。本章介绍的组件列表：\n\n- GCC 编译器\n- PGI 编译器\n- 使用 TCP/IP 的\
    \ MPICH\n- 使用 Myrinet 的 MPICH\n\n# 8.1 安装 GCC 和 PGI 编译器\n\n在本节中，我们将讨论如何安装 GNU\
    \ 编译器 (gcc) 和 PGI 编译器。\n\n## 8.1.1 GNU 编译器 (gcc)\n\ngcc 包含在常见的 Linux 发行版中并作为默认安装。由于某些原因你没有安装它，可以从这里下载：\n\
    \n```\nhttp://www.gcc.org/software/gcc\n```\n\n按照以下说明操作：\n\n```\nhttp://www.gcc.org/software/gcc/install/index.html\n\
    ```\n\n如果你更喜欢 RPM，尝试此仓库：\n\n```\nhttp://rpm-find.net/linux/RPM/\n```\n\n并使用命令安装：\n\
    \n```\nrpm -Uvh gcc-xx\n```\n\n使用以下命令检查你拥有哪个版本的 GCC：\n\n```\n[root@master]# gcc\
    \ -v\nReading specs from /usr/lib/gcc-redhat-linux/2.9.1/specs\ngcc version 2.9.1\
    \ (随 Red Hat 7.0 发布的 GNU Compiler Collection 发现了多个错误。安全修复、错误修复请访问：http://www.redhat.com/support/errata)\n\
    ``` 之后，你可以进行 MPICH 的安装。\n\n## 8.1.2 PGI Workstation\n\nPGI Workstation 是一套完整的\
    \ F77、F90、HPF、C 和 C++ 编译器以及开发工具。使用的版本为 v3.2；你可以从这里获取：http://www.pgroup.com。你需要的文件是\
    \ `linux86-HPF-CC.tar.gz`，文件大小为 16 MB。注意：如果你使用的是 PGI Workstation 的试用版，编译器和所有编译的可执行文件将在15\
    \ 天后停止工作。每次使用试用版都会提醒你剩余的时间。解决这种情况，你需要从 Portland Group 获取永久密钥。使用试用模式创建的任何执行文件、对象文件或库必须在配备永久密钥的情况下重新编译。\n\
    \n# 安装 PGI Workstation\n\n请参考 PGI Workstation 在线文档。\n\n1. 使用命令创建以下目录：\n\n```\n\
    [root@master]# mkdir /usr/local/pgi\n[root@master]# mkdir /tmp/pgi\n[root@master]#\
    \ cd /tmp/pgi\n```\n\n2. 设置环境变量。如果你愿意，可以在 $HOME/.bashrc 登录文件中或创建 /etc/profile/pgi.sh\
    \ 来导出它们。使用命令：\n\n```\n[root@master]# export PGI=/usr/local/pgi\n[root@master]#\
    \ export PATH=$PGI/linux86/bin:$PATH\n[root@master]# export MANPATH=$MANPATH:$pgi/man\n\
    ```\n\n3. 使用命令解压下载的存档：\n\n```\n[root@master]# cp -v /linux86-HPF-CC.tar.gz .\n\
