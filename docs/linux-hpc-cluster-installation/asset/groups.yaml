    ## 8.2 Install MPICH to use either TCP/IP or Myrinet GM


    In this section, we will discuss how to install MPICH so you can use it with TCP/IP
    or Myrinet GM.


    ### 8.2.1 Remove local area multcomputer/message passing interface


    To avoid conflicts with MPICH, you will have to remove the local area multcomputer/messaging
    passing interface (LAM/MPI) components that are installed as the defaults. To
    remove the component, use the following command:


    ```bash

    [root@master local]# rpm -e lam

    ```


    ### 8.2.2 Configure mpimaker


    xCAT includes a command called mpimaker that simplifies the installation and configuration
    of MPICH. You can configure it to utilize elements like TCP/IP or Myrinet, symmetric
    multiprocessing (SMP) or uni-processing (UP), gcc or PGI compilers, ssh (Preferred),
    or rsh.


    The command mpimaker is located in /usr/local/xcat/build/mpimaker.


    > Attention:

    > * If you use ethernet cards for IPC


    ### 8.2.3 Configure MPICH to use TCP/IP


    In this section, we discuss how to configure MPICH to be compatible with TCP/IP.


    #### Download and Install MPICH code


    The current release we used was version 1.2.1. It can be downloaded from:


    ```

    http://www-unix.mcs.anl.gov/mpi/mpich/

    ```


    The file you need is mpich.tar.gz, and the size of the file is about 9.5 MB.


    Note: Write down the release version; you will need it later.


    Copy the MPICH source and mpimaker script files to a temp work directory that
    you will create using the commands:


    ```bash

    [root@master]# mkdir /tmp/mpi

    [root@master]# cd /tmp/mpi

    ```


    You need to rename mpich.tar.gz to mpich-VERSION.tar.gz (in our case, it is mpich-1.2.1.tar.gz)
    You can do this as you copy it to the temp work directory. Use the commands:


    ```bash

    [root@master mpi]# cp <Path to MPICH Download Dir/>mpich.tar.gz /tmp/mpi/mpich-1.2.1.tar.gz

    [root@master mpi]# cp /usr/local/scat/build/mpi/*

    ```


    You can launch the mpimaker script to display the options available with the command:


    ```bash

    [root@master mpi]# ./mpimaker

    usage: [mpi version|gmpi version:gm version] [up|smp][gm|pgi][rsh|ssh]

    ```


    Compile with the options you choose using the command:


    ```bash

    [root@master mpi]# ./mpimaker 1.2.1 smp gnu ssh

    ```


    This example is for MPICH Version 1.2.1, multiprocessor, GNU compiler, and ssh.
    The files are created in /usr/local/mpich/1.2.1/ip/smp/gnu/ssh/ using the command:


    ```bash

    [root@master mpi]# ./mpimaker 1.2.1, smp pgi ssh

    ```


    For MPICH Version 1.2.1, multiprocessor, PGI compiler, and ssh, the files are
    created in /usr/local/mpich/1.2.1/ip/smp/pgi/ssh.


    Before you run any program on the cluster, it is necessary to know how many nodes
    and processors you have and what they are called in order to launch jobs. You
    will need to edit a configuration file for this purpose. In this case, the configuration
    file (called machines.LINUX) is located in the directory /usr/local/mpich/1.2.1/ip/smp/gnu/share/.
    The file format is one name per line, with each hostname or hostname,where n is
    the number of processors in SMP. The host name should be the same as the result
    from the command **hostname**.


    Use your favorite text editor to edit the machines.LINUX file using the commands:


    ```bash

    [root@master mpi]# cd /usr/local/mpich/1.2.1/ip/smp/gnu/share/

    [root@master share]# vi machines.LINUX

    ```


    Examples of machines.LINUX:


    ```

    #4 Uni processor nodes

    node1

    node2

    node3

    node4

    master

    ```


    Or


    ```

    #4 SMP nodes

    node1:2

    node2:2

    node3:2

    node4:2

    master

    ```


    In this case, we have four SMP nodes:


    ```bash

    [root@master share]# pwd

    /usr/local/mpich/1.2.1/ip/gnu/

    [root@master share]# cat machines.LINUX

    node1:2

    node2:2

    node3:2

    node4:2

    master

    ```


    > Note: You might need to add the path that goes to mpicc into the $PATH variable
    (in our case, mpicc resides in /usr/local/mpich/1.2.1/ip/gnu/ssh/bin/), so the
    format in our example would be:


    ```bash

    export PATH=/usr/local/mpich/1.2.1/ip/gnu/ssh/bin/:$PATH

    ```


    #### Small test - CPI


    With MPI, you will have many test applications to ensure everything has installed
    OK. We used a program CPI to test basic connectivity. It computes the value of
    pi and compares it to the value 3.14159265358972. The program CPI can be found
    in /usr/local/mpich/xxxx/examples depending on your compile options; in our case
    the directory is the following:


    ```bash

    [root@master local]# cd /usr/local/mpich/1.2.1/ip/gnu/ssh/examples

    ```


    You can compile CPI with the command:


    ```bash

    [root@master examples]# make CPI

    ```


    In the examples directory, you will also see mpirun, which you can use to launch
    the CPI.


    > Tip: Generally, you can use the command which to see where mpirun is executed.
    For example:


    ```bash

    [root@master examples]# which mpirun

    /usr/local/mpich/1.2.1/ip/gnu/ssh/bin/mpirun

    ```


    Launch the CPI test using the command:


    ```bash

    [root@master examples]# mpirun -np 8 cpi

    Process 0 on master.cluster.ibm.com

    Process 5 on node3

    Process 2 on node1

    pi is approximately 3.141592683124, Error is 0.000008333333 wall clock time =
    0.003784

    Process 4 on node2

    Process 1 on node1

    ```


    Change the number 8 according to the number of processes you want to launch. It
    is a good idea to have one process per CPU and no more than the total number of
    CPUs. Now are you ready to test your cluster. In our lab, we used the program
    PI with TCP/IP to perform the test. For more information about PI test, see Appendix
    C, "PIE test" on page 185.


    ### 8.2.4 Configure MPICH to use Myrinet GM


    In this section, we discuss how to download and install the Myrinet driver and
    then configure MPICH to be compatible with Myrinet GM.


    #### Download and Install Myrinet driver


    First, download the Myrinet source package from:


    ```

    http://www.myri.com/

    ```


    Then go to Software downloads. In our lab, we used card PCI64. The name of the
    file you need is gm-1.4.tar.gz size, and the size of the file is around 6 MB.
    You must register in order to download the file.


    > Note: Write down the GM version; you will need it later. In our example, it
    is 1.4.


    Copy the GM source and xCAT mpimaker script files to /tmp directory the commands:


    ```bash

    [root@master /root# mkdir /tmp/gm

    [root@master]# cd /tmp/gm

    [root@master]# cp <Path to GM Download Dir/>gm-1.4.tar.gz

    [root@master]# cp /usr/local/xcat/build/gm/*

    ```


    Build and compile the gm-package for Myrinet, as shown in the following command:


    ```bash

    [root@master]# mpimaker 1.4 smp

    ```


    This command will build the driver for GM Version 1.4 and SMP machine. Currently,
    the mpimaker script from xCAT v1.1 will use the following compile options:


    - --enable-linux-modversions

    - --enable-new-features

    - --enable-directcopy

    - --enable-linux-smp (if you specified SMP machine)


    You can edit the mpimaker shell script and add new options as versions of GM are
    released.


    When you compile the script, you will find a new directory in /usr/local/gm -
    Kernel version, for example, in our lab it was usr/local/gm-1.4-2.2.18smpx. Write
    down the newly created directory; you will need it for the mpimaker script. The
    following example shows the parallel installation using the psh command:


    ```bash

    [root@master]# psh all "export PATH=$PATH:/sbin; cd /usr/local/gm-1.4-2.2.18smpx;
    ../scripts/gm_install"

    ```


    Edit the /usr/local/xcat/build/gm script line GM_VER=1.3.1 to reflect your GM
    version; in this case, it should read GM_VER=1.4. Use your favorite editor. For
    example:


    ```bash

    [root@master]# vi /usr/local/xcat/sys/gm

    #!/bin/sh

    # gm

    # This shell script takes care of starting and stopping

    # gm (myrinet)

    # chconfig: 2345 60 60

    # description: gm

    # processname: gm module

    # config:/usr/local/gm*

    GM_VER=1.3.1 ----- edit this line to reflect your gm version (GM_VER=1.4)

    ```


    Copy the GM script and the script to load the driver each time the node boots
    using the commands:


    ```bash

    [root@gm]# psh all cp /usr/local/xcat/sys/gm /etc/rc.d/init.d/gm

    [root@gm]# psh all /sbin/chconfig --level 35 on gm

    ```


    Edit the file /usr/local/xcat/build/gm script with your favorite editor. For example:


    ```bash

    [root@master]# vi /usr/local/xcat/sys/gm

    #!/bin/sh

    # gm

    # This shell script takes care of starting and stopping

    # gm (myrinet)

    # chconfig: 2345 60 60

    # description: gm

    # processname: gm module

    # config:/usr/local/gm*

    GM_VER=1.3.1 ----- edit this line to reflect your gm version (GM_VER=1.4)

    ```


    Copy the GM script and the script to load the driver each time the node boots
    using the commands:


    ```bash

    [root@gm]# psh all cp /usr/local/xcat/sys/gm /etc/rc.d/init.d/gm

    [root@gm]# psh all /sbin/chconfig --level 35 on gm

    ```


    To check if it was added correctly, use the command:


    ```bash

    [root@gm]# psh node /sbin/chconfig --list mapper

    odel: mapper 0:off 1:off 2:off 3:on 4:on 5:off 6:off

    ```


    > Important: Run mapper once for every time a node is added/deleted or any changes
    have been made in the Myrinet network, because you will always need a current
    map of the Myrinet hosts. We chose Node1 to be the mapper; this function can be
    performed by any of the Myrinet hosts.


    Start the mapping process by issuing the following commands:


    ```bash

    [root@gm]# psh node /etc/rc.d/init.d/mapper start

    ```


    After mapping, begin the GM driver installation with the command:


    ```bash

    [root@gm]# psh all /usr/local/gm-1.4-2.2.18smpx/bin/gm_board_info

    ```

