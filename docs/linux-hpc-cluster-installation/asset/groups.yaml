    ![](img/ccdee7f1b1183ba808fa8386b0cb1315_101_0.png)


    - Connect the Myrinet cables from the nodes to the switches.

    - Connect the Gigabit Ethernet uplink from the management node and any additional
    installation server nodes


    At this time, your rack should look like the one shown in Figure 5-8 on page 81.
    The following steps are optional and depend on your individual configuration and
    setup:


    - Connect the nodes which need need external network connections (user and management
    nodes) to the external networks.

    - Interconnect the Myrinet switches from rack to rack (if applicable), using all
