    ## 2.2.5 存储


    存储功能由专用机器执行，负责存储运行在计算节点上的应用程序所需的大量数据。执行此功能的节点通常被称为存储节点。存储节点是“我们如何向集群提供大量数据？”这一问题的答案。


    由于很难在单个服务器或集群的某一个节点上存储 TB 级，因此需要存储区域网络（SAN）或专用服务器；此时，网络可能会成为瓶颈。


    我们建议为存储节点配备：


    - ServeRAID 控制器，可以使用各种不同的 RAID 级别之一提供数据保护。更多信息请参阅红书《Netinity Server Disk Subsystem,
    SG24-2098》。


    - 光纤通道（Fibre Channel），以获得更好的速度和数据传输率。


    - 千兆以太网或 Myrinet，用于高带宽性能。


    - 10/100M 以太网，用于最终连接管理 VLAN 或网络。


    ## 2.2.6 安装


    安装节点负责计算节点的安装，有时被称为分阶段服务器或节点。它通常是一个导出包含操作系统、库和计算节点所需所有软件的文件系统的服务器。它通常配有一个千兆以太网
    PCI 适配器，以提供更多带宽并加速集群安装。


    安装服务器通常共享一个可以通过 NFS、Web 或文件传输协议（FTP）访问的文件系统。这里是安装每个计算节点工作所需的操作系统和相关软件的地方。


    安装节点也可以配置为计算节点，因为它们带有计算功能。它是公共网络上的唯一节点，因为用户需要访问它才能运行作业。


    ## 2.2.7 计算


    计算功能或节点是集群计算的核心。它的主要活动就是执行微积分。


    计算功能通常被称为计算节点，特别是对于大型集群，因为此功能被分配给专用机器。


    计算节点的硬件选择和配置参数应基于运行在系统上的应用程序。应该考虑以下特性：


    - 处理器类型

    - L2 缓存的大小和速度

    - 每个节点的处理器数量

    - 前端总线速度

    - 内存子系统的扩展性

    - PCI 总线速度


    正如我们所说，应用程序驱动了如何构建计算节点的决策。例如，如果计算节点需要频繁访问缓存，则应考虑 L2 缓存和内存子系统的大小；较大的缓存可能会增强性能。然而，某些实验表明，如果你的应用程序适合
    L2 缓存且不需要频繁访问内存子系统，则计算节点的性能将会提高。


    另一方面，使用大量内存的应用程序将从更快的 CPU、系统总线和内存子系统中受益。


    从处理器性能的角度来看，理想情况是每个计算节点一个处理器。如果你有预算限制，我们建议使用 SMP 机器。在性效益方面，配备两个处理器的 SMP 机器比配备三个或四个处理器的机器更好。


    Linux 内部调度器决定了这些 CPU 如何共享。你不能将特定任务分配给特定的 SMP 处理器。但是，你可以启动两个独立的进程或一个多线程进程，并期望看到比单
    CPU 系统更高的性能提升。


    硬件高可用性不像集群的其他部分那么重要。如果发生节点故障，它只是丢失部分作业，这些作业稍后另一个节点上运行。


    如果你的应用程序使用消息传递（我们假设需要高网络活动和低延迟），或者如果应用程序需要跨网络传输大量数据，你可能想要考虑使用千兆或 Myrinet PCI 适配器。在这种情况下，我们建议选择具有
    64 位、66MHz PCI 总线的机器，以获得这些适配器的全性能优势。


    你应该查看你正在使用的以太网卡的规格，因为你知道，目前千兆网络不支持预执行环境（PXE）能力，无法通过网络启动机器。


    计算节点也可能控制其他功能，例如：


    - 管理

    - 安装

    - 控制


    如果你的预算是一个重要因素，或者对于小型集群，将多个功能压缩到同一个节点上是理想的。


    ## 2.3 网络架构


    网络是将一组机器转换为单一系统。它还允许对机器进行远程访问，并且硬件和软件对于网络的正常工作都是必不可少的。


    Beowulf 集群的网络非常重要。最苛刻的通信发生在计算节点之间。


    由于计算节点之间的通信需求，网络性能是 Beowulf 类型集群中需要考虑的一个非常重要的话题。取决于执行的程序的特性，可能需要高带宽、高速和（低延迟）网络。网络通信将决定
    Beowulf 类系统的水平以及构建高效程序的复杂程度。


    Beowulf 的主要瓶颈是网络带宽、延迟和全局同步。


    ## 技术


    让我们来看一些对于满足集群需求的硬件技术和协议。


    有几种用于 Beowulf 通信的技术和协议：


    - 千兆以太网

    - 千兆以太网

    - Myrinet


    ## 交换机


    对高带宽的需求以及节点数量的增加是使用交换机最重要的原因。交换机接受来自节点的双绞线数据包，不像集线器那样广播给所有节点来确定接收者。


    相反，交换机使用数据包的目标地址来确定接收者，并将其发送给对方。然而，随着集群中节点数量的增加，一个交换机可能不够。


    我们必须保证全分带宽，因为每个节点都必须与网络中的任何其他节点通信，而没有路由干扰，因为路由器会影响性能。如果你需要使用 N 端口全分带宽交换机（例如二层交换机或
    Myrinet）构建 2N 端口全分带宽交换机，你应该使用 6 台 N 端口交换机和 2N 条电缆。我们在第 27 页的图 2-3 中展示了如何互连交换机以保证全分带宽。


    img/ccdee7f1b1183ba808fa8386b0cb1315_48_0.png)


    图 2-3 全分带宽示例


    ### 2.3.1 如何设计集群网络


    我们已经查看了一些用于 Beowulf IPC 的技术和协议。现在我们可以探索如何设计我们集群的网络组件，因为集群需要网络拓扑结构以便节点之间能够通信（以及与世界其他部分的通信）。


    集群网络的组件可以总结为：


    - IPC：用于允许节点传递消息和数据块。

    - 管理：满足集群管理员的所有需求。

    - 集群：仅用于 I/O 和作业流量。


