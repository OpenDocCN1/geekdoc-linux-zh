    # 6.1 Before you start


    A number of software packages will need to be downloaded before you start this
    installation. If you will be at a site where Internet access is slow or non-existent,
    it might be useful to download all the code and write it to a CD before you start.


    Refer to Chapter 4, "Solution guide" on page 57 for more information about software
    packages.


