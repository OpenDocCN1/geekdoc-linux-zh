    ## pping - Parallel ping


    ### Description


    **pping** is a utility used to ping a list of nodes in parallel. **pping** will
    return an unsorted list of nodes with a ping or noping status.


    ### Synopsis


    ```

    pping [noderange]

    For example:

    ping node1,node2,node8,node20

    ping node1,node2,node8,node20,node14-node56,node70-node203

    ping all -node129-node256

    ```


    ### Examples


    ```

    # ping node1-node10

    Ping nodes 1 through 10.

    # ping all -node5-node7

    Ping all nodes listed in nodelist.tab less nodes 5 through 7.

    ```


    ### Files


    - nodelist.tab: Only nodes in this table will be affected by this command.


