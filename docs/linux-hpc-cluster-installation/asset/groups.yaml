    # passwd.tab


    This table is used during the installation process and to perform operations on
    the nodes, like power off or power on, through the ASMA card. It contain two fields:
    the text we are waiting for, and what we have to type in.


    Example B-7 has a description of the passwd.tab table.


    *Example: B-7 Description of passwd.tab table*


    PasswordNeeded PasswordValue


    Table B-9 gives the definition of the passwd.tab parameters.


    **Table B-9** Definitions of passwd.tab parameters


    | Parameter | Description | Possible values |

    | --- | --- | --- |

    | PasswordNeeded | This field describes the value we are looking for when we have
    to type in a password. | Values for this field are not defined because they depend
    on your hardware, but you need to at least one line for the connection to the
    node.<br><br>For the connection to the node, you need this line: rootpw<br><br>If
    you use ASMA and/or ASM hardware, you need to put two lines in this file: asmauser
    asmapass<br><br>If you use Cisco products, you should have a line: cisco |'
  - '[PAGE 203]


    | Parameter | Description | Possible values |

    | --- | --- | --- |

    | PasswordValue | This field contains the value you need to type in when a password
    is asked. | Again, the content of this field will depend on the value used to
    install the hardware.<br><br>By default, for the ASMA/ASM hardware, the values
    for asmauser and asmapass are:<br>USERID<br>PASSWORD<br><br>The value for the
    rootpw is the password you select during the Red Hat installation process. |'
