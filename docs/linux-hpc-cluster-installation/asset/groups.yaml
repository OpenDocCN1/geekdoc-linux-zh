    BOOTPROTO=static

    ONBOOT=yes

    IPADDR=192.168.0.254

    NETMASK=255.255.255.250

    ```


    Example 6-9 /etc/sysconfig/network-scripts/ifcfg-eth2


    ```

    DEVICE=eth2

    ```'
