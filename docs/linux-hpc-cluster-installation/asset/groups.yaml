    # xCAT configuration files


    This appendix describes the tables used by xCAT during the configuration and installation
    process. These tables must be updated before starting the nodes installation.


    Table B-1 provides a quick reference of the xCAT tables. We also provide a full
    description of each xCAT table in this appendix.


    | Table B-1 xCAT tables | Description |

    | --- | --- |

    | site.tab | This table is used to configure the cluster network. It includes
    a list of parameters which have to be updated for your cluster configuration.
    |

    | nodelist.tab | This table describe all the nodes and gives each of them a group
    name, defines what kind of node it is, and on which ASMA card the node is connected.
    |

    | noderes.tab | This table describes where the compute nodes can find the services
    they need. The line describes which server the group will find the resources it
    needs for each group. |'
  - '[PAGE 189]


    | Table | Description |

    | nodetype.tab | This table contains, for each node, one line which describes
    the name of the Kickstart file to use for the installation of each node. |

    | nodehm.tab | This table contains information on how to use each node. As the
    material used to install a cluster could be different from one installation to
    another, this file gives xCAT commands the flexibility to adapt themselves to
    your environment. |

    | asma.tab | This table describes which paths the xCAT commands have to follow
    communicate with the service processor of each node. |

    | mac.tab | This table will be generated by the gemacs script. It contains one
    line per node, for each node, which is the MAC address used for the management
    of this node. |

    | passwd.tab | This table will be used during the installation process and to
    perform some operations on the nodes, like power off or power on through the ASMA
    card. It contains two fields: the text we are waiting for, and what we have type
    in. |

    | apc.tab | This table gives xCAT commands the ability to power on or power off
    pieces of equipment that are not controlled by the ASMA/ASM card (network switch,
    Equinox, Myrinet switch, and so on). It works in conjunction with the APC MasterSwitch
    to control the electrical power on specified hardware. |'
