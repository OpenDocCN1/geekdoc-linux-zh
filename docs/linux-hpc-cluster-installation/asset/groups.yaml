    This table describes all the nodes and gives each of them a group name, describes
    what kind of node it is, and on which ASMA card the node is connected.


    The table has one line per node, as shown in Example B-1.


    *Example: B-1 Description of nodelist.tab*


    | NodeName | GroupName,GroupName2,...,GroupName |

    | --- | --- |


    Table B-3 gives the definition of the nodelist.tab parameters.


    *Table B-3 Definitions of nodelist.tab parameters*


    | Parameter | Description | Possible values |

    | --- | --- | --- |

    | NodeName | This is the node name, based on the naming convention used in the
    cluster. | nodeX, where X is the node number. node is not mandatory; it can be
    changed to whatever you want, as long as it begins with non-numeric characters.
    |

    | GroupName | You can include the node in N group. The groups are used to send
    commands on multiple node at the same time. For example, rinv rack1 instead of
    rinv node1,node2,node3 | Whatever you want, as long as it begins with non-numeric
    characters. (that is, frame01, frame02, if the nodes are in different frames.)
    It is recommended to create a group which includes all the cluster''s nodes. |


    # noderes.tab


    This table describes where the compute nodes can find the services they need.


    The line describes which server the group will find the resources it needs, as
    shown in Example B-2.


    Example: B-2 Description of noderes.tab table


    ```

    GroupName Tftp,NFS_Inst,NFS_Dir,Post_Dir,NIS_srv,Time,Serial,InstallRoll

    ```


    Table B-4 lists the definitions of the noderes.tab parameters.


    Table B-4 Definitions of noderes.tab parameters


    | Parameter | Description | Possible values |

    |---|---|---|---|

    | GroupName | Node or group name the parameters apply to. | The group or node
    should exist in the nodelist.tab. |

    | Tftp | Name of the tftp server to be used for installation and boot processes.
    | Usually the host name of the master node, unless multiple install servers are
    used. |

    | NFS_Inst | Name of the NFS server where the Red Hat CD-ROM and other files reside.
    | Usually the host name of the master node, unless multiple install servers are
    used. |

    | NFS_Dir | Path name of the NFS exported Red Hat CD-ROM on NFS_Inst server. |
    By default, the installation directory is the following: /install/rh62. |

    | Post_Dir | Path name of the NFS exported xCAT install directory on NFS_Inst
    | By default, the post installation directory is the following: /install/post.
    |

    | NIS_srv | Host name of NIS master. | NIS server name; NA if you do not use NIS.
    |

    | Time | Host name of the timeserver. Unless your timeservers are synchronized,
    this should be the same for all nodes in the cluster. | Usually the host name
    of the master node. |


    | Parameter | Description | Possible values |

    | --- | --- | --- |

    | Serial | Console serial port number. Represents N in /dev/ttyN | This value
    can be one of the following:

    -0 for COM A/1

    -1 for COM B/2

    -NA for no serial console |

    | InstallRoll | Indicates if this node/group will be used as the installation
    node. This is only needed on large clusters where a small number of installation
    nodes are installed first and then used as install servers for remaining nodes.
    | The value can be only Y or N. |


