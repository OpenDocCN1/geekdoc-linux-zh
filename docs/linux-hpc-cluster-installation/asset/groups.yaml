    You need redundancy on hardware and data because, unlike in the case of compute
    nodes, the failure of the control node may affect the entire availability of the
    cluster. We suggest using:


    +   - Redundant fans

    - Redundant power supply

    - RAID (to protect the data)


    # 2.2.4 Management


    Management is the function that manages and controls the cluster and its components,
    for example, switches. It is either on dedicated machines management nodes, or,
    for budget reasons, shares the machine with other functions, such as the master,
    installation, and compute nodes. It may also be found on a dedicated virtual local
    area network (VLAN), defined as management, and accessible only by the administrator
    (for security reasons).


    There might be more than one management node in a cluster, such as in large clusters;
    it on how many nodes and components you need to manage. As the cluster manager,
    it takes control of the nodes and collects Simple Network Management Protocol
    (SNMP) alarms.


    You need redundancy on hardware and data because, unlike in the case of compute
    nodes, the failure of the control node may affect the entire availability of the
    cluster. We suggest using:


    +   - Redundant fans

    - Redundant power supply'
- md: '

    - RAID: to protect the data


    Possible configurations are:


    - Advanced System Manager Adapter (ASMA) or Wiseman card to allow a daisy chain
    connection of service processors to receive alarms from the compute nodes and
    for sending SNMP traps.


    - On-board or peripheral computer interconnect (PCI) ethernet adapter, more than
    one in some cases, to allow the management of several VLAN or or networks.


    - If it performs the installation function well, a gigabit ethernet adapter may
    be helpful in giving high-bandwidth performance and reduce the node installation
    time.


    ## 2.2.5 Storage


    The storage function is performed by dedicated machines and is responsible for
    storing large amounts of data needed by the applications running on compute nodes.
    Nodes that perform this function are usually called storage nodes. The storage
    node is the answer to the question, "How do we feed large amounts of data to the
    cluster?


    Since it is difficult to store a TB on a single server or on one of the cluster
    nodes, there is a need for SAN, or dedicated servers; the network may be a bottleneck
    at this point.


    We suggest equipping storage nodes with:


    - ServeRAID controllers that give data protection using one of the different RAID
    levels available. See the redbook Netinity Server Disk Subsystem, SG24-2098 for
    more information.


    - Fibre Channel, for better speed and data transfer rate.


    - Gigabit Ethernet or Myrinet, for high-bandwidth performance.


    - 10/100Mobit Ethernet, for eventually connecting to a management VLAN or network.


    ## 2.2.6 Installation


    The installation node is responsible for the installation of the compute nodes
    and is sometimes referred to as a staging server or node. It is usually a server
    that exports a file system containing the operating system, libraries and all
    the necessary software for the compute nodes. It usually has a Gigabit Ethernet
    PCI adapter to allow more bandwidth and to speed up cluster installation.


    An installation server usually shares a file system that can be accessed via NFS,
    Web or file transfer protocol (FTP). This is where the operating system and relevant
    software needed for each compute node to work are installed.


    The installation node can also be configured as a compute node since they carry
    computations. It is the only node on the public network, since users need to access
    it to be able to run their jobs.


    ## 2.2.7 Compute


    The compute function or node is the computational heart of the cluster. Its main
    activity is just to perform calculus.


    The compute function is usually called the compute node, especially for large
    clusters, because this function is assigned to dedicated machines.


    The choice of hardware and configuration parameters of the compute node should
    be based on the applications that will be run on the system. The following characteristics
    should be considered:


    - Processor Type

    - Size and speed of L2 cache

    - Number of processors per node

    - Speed of front-side bus

    - Memory subsystem scalability

    - PCI bus speed


    As we said, the application drives the decision on how to build the compute nodes.
    For example, if the compute node is required to access the cache frequently, the
    size of the L2 cache and memory subsystem should be considered; a large cache
    may enhance the performance. However, some experiments show that if your application
    fit on the L2 cache and does not need to frequently access the memory subsystem,
    the performance of the compute node increases.


    On the other hand, applications that use intensive amounts of memory benefit from
    a faster CPU, system bus, and memory subsystem.


    From a processor performance point of view, the ideal is one processor per compute
    node. If you have budget restrictions, we suggest using an SMP machine. In terms
    of price performance ratio, an SMP machine with two processors is better than
    a machine with three or four.


    The Linux internal scheduler determines how these CPUs get shared. You cannot
    assign a specific task to a specific SMP processor. You can, however, start two
    independent processes or a threaded process and expect to see a performance increase
    over a single CPU system.


    Hardware high-availability is not as important as other parts of the cluster.
    If there is a node failure, it just loses part of the job that can be run later
    on another node.


    If your application uses message passing (we assume the necessity for high network
    activity and low-latency), or if the application requires the transfer of large
    pieces of data across the network, you may want to consider Gigabit or Myrinet
    PCI adapters. In this case, we recommend choosing machines with 64-bit, 66MHz
    PCI busses to get the benefit of full performance from those adapters.


    You should look at the specifications of the Ethernet card you are using, since
    you know that, currently, Gigabit does not support Pre-Execution Environment (PXE)
    capability to boot the machine via the network.


    It is possible that a compute node can take control of other functions too, such
    as:


    - Management

    - Installation

    - Control


    It is desirable to condense multiple functions on the same node if your budget
    is an important factor, or for small clusters


    ## 2.3 Network architecture


    Networking is the conversion of a group of machines into a single system. It also
    allows remote access to a machine and both hardware and software are necessary
    for the network to work.


    Networking in Beowulf clusters is very important. The most demanding communication
    occurs between the compute nodes.


    Because of the communication demands between compute nodes, network performance
    is a very important topic to be considered in a Beowulf type of cluster. Depending
    on the characteristics of the programs being executed, high-bandwidth, speed and
    (low-latency networks may be required. The network communication will determine
    the Beowulf-class system and the degree of complexity in building efficient programs.


    The primary bottlenecks of Beowulf are network bandwidth, latency, and global
    synchronization.


    ## Technologies


    Let us at some of the hardware technologies and protocols useful for fulfilling
    the needs of cluster.


    There are several technologies and protocols usable for Beowulf communication:


    - Gigabit Ethernet

    - Gigabit Ethernet

    - Myrinet


    ## Switch


    The demand for high bandwidths and the growing number of nodes on the same are
    the most important reasons to use a switch. A switch accepts packets on twisted-pair
    wires from nodes and does not broadcast to all the nodes to determine who the
    receiver is, as a hub does.


    Instead, a switch uses the destination address of the packet to determine who
    the recipient is and sends the packet to it alone. However, as the number of nodes
    in a cluster increase, one switch may not be enough.


    We must guarantee full bisection bandwidth, because each node must be able to
    talk to any other node of the same network without having routers in the way,
    because routers can affect the performance. If you need to build a 2N-port full-bisection
    switch using N-port full-bisection switches (for example layer 2 switches or Myrinet),
    you should use 6 N-port switches and 2N cables. We show how to interconnect switches
    to guarantee the full bisection bandwidth in Figure 2-3 on page 27.


    img/ccdee7f1b1183ba808fa8386b0cb1315_48_0.png)


    Figure 2-3 Full bisection bandwidth example


    ### 2.3.1 How to design the cluster network


    We have looked at some of the technologies and protocols used for Beowulf IPC.
    Now we can explore how to design the network components of our cluster, because
    the cluster needs a network topology in order to be able to communicate between
    the nodes (as well as with the rest of the world).


    The components of the cluster network can be summarized as:


    - IPC: Needed to allow nodes to pass messages and chunks of data.

    - Management: To satisfy all the needs of cluster administrators.

    - Cluster: Used for I/O and job traffic only.

