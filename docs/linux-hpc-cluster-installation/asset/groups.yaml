    ## winstall - 窗口化远程网络 Linux 安装


    ### 描述


    winstall 将强制对一组节点进行无人值网络安装。winstall 将其参数传递给 rinstall 和 wcons。


    winstall 在功能上等同于 rinstall，但 wcons 会启动一个 xterm 用于远程控制显示，如第 164 页的图 A-3 所示。随着请求节点数量的增加，面板将变小。


    使用 wkill 快速关闭所有的 wcons 面板。


    要更改字体大小，在面板中心右键点击 Shift。


    winstall 返回 nodename: powerstate action，其中 powerstate 是每个节点的 on 或 off，而 action
    是 on 或 reset。


    ### 语法


    ```

    winstall [noderange]

    例如：

    winstall node1,node2,node8,node20

    winstall node14-node56,node70-node203

    winstall node1,node2,node8,node20,node14-node56,node70-node203

    winstall all -node129-node256

    ```


    ### 示例


    ```

    # winstall node4,node5

    node4: off on

    node5: on reset

    node4 之前是关闭的已通电，node5 之前是开启的已重置。

    ```


    ![](img/ccdee7f1b1183ba808fa8386b0cb1315_185_0.png)


    图 A-3 winstall 输出


    ### 文件


    **nodelist.tab** 仅此表中的节点会受此命令影响。

    **sp.tab** 服务处理器网络定义表。

    **ts.tab** 终端服务器定义表。


    ### 环境


    **DISPLAY** 你的 DISPLAY


    ### 诊断


    **DISPLAY not set** 未设置环境变量 DISPLAY。

    **xyz is not a node** 如果 nodelist.tab 中没有该节点名称则返回此错误。

    **ts:port is unavailable** 如果端口被另一个用户占用则返回此错误。ts = 终端服务器主机名，port = 1-16。

    **telnet to xyz** telnet 命令超时。检查以太网线和 IP。ts。


    unknown spn xyz | 如果 sp.tab 中的 spn 名称 (xyz) 无法通过 DNS 解析。


    Connection refused | 如果 telnet 失败则返回。PCI ASMA 可能正在使用或 telnet 接口已锁定。可以使用 spnreset
    重启 PCI ASMA。


    telnet to xyz failed | telnet 命令超时。PCI ASMA 适配器可能没有电。检查以太网线和 IP。


    node xxx not on spn yyy | SPN yyy 中未列出 xxx。使用 spncheck yyy 进行核实。检查布线并尝试 spnreset。


    Remote session timeout | telnet 成功但节点通信失败。请一分钟后重试。


    # 另请


    - noderange

    - nodeset

    - rinstall

    - wcons

    - kill


