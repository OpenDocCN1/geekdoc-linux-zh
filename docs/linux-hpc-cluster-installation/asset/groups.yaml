    /boot/initrd.img /lib/modules/2.2.18smpx /usr/src/linux

    /usr/src/linux-2.2.18smpx


    # 6.4.2 h2n


    h2n is one of the examples from DNS and Bind, by Albitz, et al., h2n automatically
    generates nameserver configuration files from /etc/hosts and is used by the xCAT
    manages. Download the book''s examples from http://ftp.ora.com/pub/examples/nutshell/bind/
    and extract the h2n script to /local/xcat/lib. For example:


    ```

    # tar xvzf dns.tar -C /usr/local/xcat/lib h2n

    # chmod 755 /usr/local/xcat/lib/h2n

    ```


    # 6.4.3 PXelinux


    To start network installation, xCAT uses the network boot support of the onboard
    ethernet in the x330s. This network boot support relies on a vendor independent
    API known as the Pre-Execution Environment or PXE. More information on PXE can
    be found at:


    ```

    http://developer.intel.com/

    ```


    PXE relies on fetching a small boot loader from the remote server through ftp.
    The current version of xCAT uses the PXelinux boot loader, which is part of the
    SysLinux package, and can be downloaded from:


    ```

    ftp://ftp.kernel.org/pub/linux/utils/boot/syslinux/

    ```'
  - '[PAGE 121]


    It is important to use at least Version 1.53, since xCAT relies on a new feature
    introduced in this version. Although it is possible to rebuild PXELinus, this
    is not recommended. All that is required by xCAT is the pxelinux.0 file, which
    you can get with the command:


    ```

    # tar xvzf sysylux-1.53.tar.gz

    # cp sysylux-1.53/pxelinux.0 /usr/local/xcat/tftp/

    # chmod 444 /usr/local/xcat/tftp/pxelinux.0

    ```


    # 6.4.4 attfp


    To support the TFTP for PXE, a tftp server must be installed on the management
    node. There are a number of different tftp servers available for Linux, including
    the one that comes on the Red Hat 6.2 CD-ROM. Unfortunately, many of these suffer
    from a number of issues, scalability being a particular concern. We have found
    the most reliable to attfp which can be obtained from:


    ```

    ftp://tftp.mamalinux.com/pub/atftp/

    ```


    The atftp package comes with no installation instructions, but the installation
    is fairly straightforward. We use the command:


    ```

    # tar xvzf attfp-0.3.tar.gz

    # cd attfp-0.3

    # make

    # make install

    ```


    Note that the make install command will overwrite the existing Red Hat ttfpd.
    This is unlikely to be a problem.


    Once you have installed the ttfpd, certain options need to be configured in /etc/inetd.conf:


    Although the documentation indicates attfpd will default to using /tftpboot, this
    does not seem to work, and must be specified manually.


    tftpboot


    Try adding this to order PXE clients if you experience ttfpd failures on boot.


    --no-blksize


    By default, attfpd expires after 300 seconds, logging a lot of information to
    syslog as it dies. If this setting is unsatisfactory, you can set this parameter
    to 0.


    --ttfpd_timeout


    Accordingly, the ttfpd line in /etc/inetd.conf to something similar to the following:


    ```

    tftp dgram udp wait /usr/bin/in.ttfppd in.ttfppd --no-blksize

    --ttfppd_timeout=0 /tftpboot

    ```'
