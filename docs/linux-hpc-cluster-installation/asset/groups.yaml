  - '[PAGE 88]


    # Environmental questions


    This section discusses issues related to the environment where the equipment is
    to be installed. The questions should be answered before beginning the cluster
    assembly.


    +   - Will the cluster be housed in a computer room and is there room?

    - Will there be a raised floor? If so, will it provide sufficient room for cabling?

    - Will the floor support the weight of the cluster?

    - Is there, or will there be, sufficient power of the proper voltage and with
    the specified outlets?

    - Is there adequate cooling for the additional equipment?

    - Is there an established facilities schedule for making changes or adding/powering
    on equipment? If so, how will it effect implementation?


    # Hardware/configuration questions


    This section discusses issues related to the hardware and configuration. The questions
    should be answered before beginning cluster installation.


    +   - What hardware components besides Netinity/iServer xSeries are included in
    the solution (RS/6000/)pSeries, AS/400/iSeries, S390/zSeries, Storage Subsystems,
    and so on)?

    - What are the IP ranges (for compute nodes, head nodes, Ethernet switches, ASMA
    adapters, terminal servers, and so on)? Determine if a private address space will
    be used or if it will be specified range provided by the Network group.

    - What are your naming conventions (node, rack, management, and so on)? Do you
    start with zero or one? Are there prefix or padding requirements? The naming must
    prefix/suffix, where prefix is [A-Z a-z \] and suffix is [0-9].

    - Do you have any specific labeling requirements? This is similar to the question
    on naming conventions, but refers to specific labels used to identify equipment.

    - Will you using VLANs? If so, how many? How will they be partitioned?

    - Security/authentication method do you require (global NIS, local users only,
    rpc /etc/password, and so on)? We do not recommend using NIS on compute nodes.

    - How is external storage to be connected?

    - What throughput is required from the cluster to your enterprise?

    - Does your network group have any fixed schedule for making changes or adding
    equipment to the network? If so, how will it effect implementation?'
- md: "\nDoes your network group have any specific equipment requirements for connectivity\
    \ (brand, specific equipment, copper, fiber, and so on)?\n\nAre production level\
    \ Linux software and drivers available for your special equipment/peripheral requirements?\n\
    \n## Software questions\n\nThis section discusses issues related to the software\
    \ and configuration. The questions should be answered before beginning the cluster\
    \ installation.\n\n- What other open source software will be installed?\n- What\
    \ commercial software will be installed?\n- Do you have any existing Linux cluster(s)\
    \ running the aforementioned applications?\n- What do you use as a resource manager?\
    \ It is assumed you will be using PBS, but are there others (Maui, LSF, and so\
    \ on).\n- Do you require special/commercial compilers (the IBM Linux Cluster provides\
    \ the PGI compilers)?\n- Does the operating system support all planned features\
    \ and are any additional tools or libraries supported by the recommended level\
    \ of the operating system (for example, Red Hat 6.2)?\n- Are there any version\
