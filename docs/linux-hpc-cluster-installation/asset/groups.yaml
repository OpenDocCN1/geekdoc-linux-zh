    # 作业管理


    作业资源管理和调度有许多选项。在这里我们描述了 PBS 资源管理器和 Maui 调度器；它们最适合我们的集群需求。Maui 使用智能算法对作业进行调度和排序，以适应可用的时间和机器资源。这些算法被
    PBS 应用于数据，并通知 PBS 从何处开始实际作业。


    # Maui


    Maui 调度器是一个软件工具，为管理员提供对作业调度、工作负载限制策略和功能、节点分配策略、可消耗资源处理、管理、分析模拟（用于评估不同的分配和优先级方案）、节点分配策略、预留策略、公平性、公平份额（fairshare）、作业优先级（高优先级作业优先运行，但避免低优先级作业的长期饥饿）、提前预留、常规预留、服务质量（QOS）管理、QOS
    配置以及统计和日志。


    Maui 调度器主要由 David Jackson 为 Maui 高性能计算中心编写，该中心运行 IBM SPs 并使用 IBM 的 LoadLeveler
    作业管理软件。


    Maui 的安装先决条件包括一个预安装、配置完成且功能良好的资源管理器；在这种情况下是 PBS。Maui 可以被视为资源管理器的调度器插件。


    你可以下载 Maui 并在此处找到良好的在线文档：


    ```

    http://www.supercluster.org

    ```


    # 可移植批处理系统 (PBS)


    PBS 是一个在 NASA 阿姆斯研究中心开发的灵活批处理软件系统。它运行在网络化的、多平台的 UNIX 环境中，包括由工作站、超级计算机和大规模并行系统的异构集群。


    PBS 是 Linux 集群领先的工作负载管理解决方案。PBS 最大化了资源的高效利用，执行策略，并提供详细的使用和统计数据。PBS 的优点包括增加计算资源的利用率、所有计算资源的统一接口、减轻系统管理员和操作员的负担以及提高用户社区的服务质量。OpenPBS
    是 Veridian Systems 发布的 PBS 免费源码。


    更多信息，请访问：


    http://www.OpenPBS.org/


    对于名为 PBS Pro 的商业版本，请访问：

    http://www.pbspro.com/


    # 负载共享设施 (LSF)


    LSF (Load Sharing Facility) 来自 Platform Computing Corporation 的分布式队列系统，它将一组计算机整合进单一虚拟系统中，以更好地利用网络资源。它能够根据当前的负载状况和应用程序的资源需求，在异构环境中自动选择主机。它可以远程运行作业，就像这些作业在本地主机上运行一样。LSF
    利用所有可用计算资源（包括工作站的累积处理能力）来高效处理作业、更快地完成工作负载并提高用户生产力。它支持作为交互式和批处理作业运行的顺序和并行应用程序。它基于一套应用程序。更多信息，请参考：


    http://www.platform.com


    # 解决方案指南


    本章描述了规划和安装集群的考虑因素。


    我们将讨论：


    - 通用考虑因素

    - 配置辅助工具

    - 配置方案

    - 需要实施的验证活动

    - 我们在实验室集群中使用的内容


    ![](img/ccdee7f1b1183ba808fa8386b0cb1315_78_0.png)


    # 4.1 通用考虑因素


    在组装之前对您的集群进行彻底规划是非常重要的。在纸上和脑海中规划并构建您的集群，思考每一个可能的方面和问题。走一遍集群将放置的位置，确保你了解放置位置。与设施部门讨论集群，确保你有足够的空间、电力冷却冷却设施，并且地板能够承载集群。确保你了解任何调度方面的设施问题，以留出足够的时间并确保不会干扰正常运行。


    接下来，思考硬件及其配置。确保你已经与你的网络人员充分讨论了集群。这应该包括安全考量、IP 地址以及将使用的特定设备。此外，考虑这会对你的生产网络产生（如果有）影响或预期。


    最后，检查你预计在集群上安装的软件。如果你使用的是标准配置，这应该是相当常规的。然而，包含可能具有特定版本要求的额外软件也是非常常见的。确保你已经检查了所有需要的软件、可能需要哪些特定版本以及是否存在任何依赖关系。


    在第 4.4 节第 66 页的“集群问卷”中，我们汇总了所有在构建集群时应该询问或思考的问题。附录 F 第 205 页的“集群问卷”包含了你可以记录答案的空白页。如果这是一个
    IBM 集群解决方案（IBM Cluster Solution），这些问题中的许多或全部将在解决方案保证评审（Solutions Assurance Review）过程中被问。


    # 环境


    - 实验室是否为整个集群设备提供了足够的空间？

    - 地板是否支持设备重量？

    - 电缆管理是否有足够的支持（架空地板）？

    - 环境是否提供足够的电力？

    - 你是否有足够的由匹配保险丝支持的电源插？

    - 空调是否能够将温度保持在允许范围内？

    - 你是否考虑过控制访问集群的安全机制？


    # 硬件


    - 你是否想出了一套颜色、命名和标记方案？

    - 你是否有足够的交换机来支持全二分带宽？

    - 你是否计划将集群连接到局域网 (LAN)？

    - 你根据用途是否有正确的机器配置？

    - 你是否选择了正确的网络类型来支持预期的吞吐量和延迟？

    - 你的集群设计是否反映了你的应用程序设计和需求？


    # 软件


    - 你是否检查了软件与你正在安装的硬件之间的通用兼容性？

    - 组件的所有必要驱动程序是否有稳定版本可用？

    - 操作系统是否支持所有计划的功能？

    - 操作系统发行版是否支持这些工具和库？

    - 你是否检查了版本依赖关系？


    上述问题的答案应该记录下来并在整个集群安装过程中保留以参考。


    此外，将你的集群设计可视化是一个好主意；机器和虚拟局域网 (VLAN)应该被指定并用不同的颜色突出显示，以便识别。


    # 4.2 配置辅助工具


    在本节中，我们将命名并指向一些工具，帮助你回答第 58 页第4.1 节“通用考虑因素”中的问题，特别是关于硬件架构的问题。


    ## 4.2.1 机架配置器


    为了帮助硬件，一个实用工具是 IBM @server xSeries Rack Configurator。如名称所示，该配置器帮助你组合机架设计并放置节点和其他设备。它甚至可以帮助完成配置机架设置所需的set布线。


    机架配置器生成大量信息。这包括所需的部件打印列表、物品在机架中的位置、关于间隙、通风和其他相关细节的建议。它还提供了一个详细说明配置资源的图表，包括运行机架所需的总电量。示例请参见第
    61 页图 4-1。


    机架配置器可以从此处下载：


    ```

    http://www.pc.ibm.com/support

    ```


    ## 4.2.2 PC 配置器


    当机架配置器帮助你进行机架配置时，PC 配置器引导你完成单个箱和机架的配置。该配置器可以验证配置并最终生成订购设备时的报告。此工具是价格信息的有用资源。请参见第
    62 页图 4-2。


    你可以从此处下载 PC 配置器：


    ```

    http://www.can.ibm.com/wwconfig/

    ```


    请确保你始终使用最新的数据文件，这些文件也可以从此处获取：


    ```

    http://www.can.ibm.com/wwconfig/

    ```


