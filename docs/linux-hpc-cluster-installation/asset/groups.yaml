    # Copy Red Hat CD-ROM


    Finally, copy the contents of the Red Hat 6.2 CD-ROM to the management node for
    part of the compute node installation process. You should have made plenty of
    space in /install for this, so just copy the files using the following commands:


    ```

    # mkdir -p /install/rh62

    # mount /mnt/cdrom

    # tar cf -C /mnt/cdrom . | tar xvf -C /install/rh62

    # ummount /mnt/cdrom

    ```


    ## 6.3 xCAT installation


    For licensing reasons, all non-IBM software are not part of the xCAT package.
    To install a fully working xCAT management node, you must install the xCAT software
    and then patch and/or install a number of standard open-source packages that it
    depends on. The first stage is to obtain xCAT and use the included packages and
    scripts to customize the Red Hat environment.


    Download the xCAT install package from the Redbooks additional materials FTP at:


    ftp://www.redbooks.ibm.com/redbooks/SG2464041/


    Unpack it to /usr/local/xcat using the tar command:


    ```

    # tar xvf xCAT-distribution.tgz -C /usr/local

    ```


    For the network installation, xCAT needs the kernel (mlinux) and initrd (initrd.img
    file) from the Red Hat network boot image. The boot.img contains the boot floppy
    image. Copy these to /usr/local/xcat/ks62 using the command:


    ```

    # mkdir /mnt/loop

    # mount -o loop /install/rh62/images/boot.img /mnt/loop

    # cp /mnt/loop/mlinux /usr/local/xcat/ks62/

    # cp /mnt/loop/initrd.img /usr/local/xcat/ks62/initrd.img

    # ummount /mnt/loop

    ```


    For the medium access control (MAC) collection and advanced system management
    (ASM) setup, xCAT uses a regular Red Hat kernel. Copy it to /usr/local/xcat/stage/
    using the command:


    ```

    # cp /boot/mlinux-2.2.14-5.0 /usr/local/xcat/stage/mlinux

    ```


    Once the archive has been unpacked, there are a few extra installation tasks to
    perform. Copy the xcat.sh file to /etc/profile.d directory. This will add /usr/local/xcat/bin
    and /usr/local/xcat/sbin to PATH. Use the command:


    ```

    # cp /usr/local/xcat/samples/xcat.sh /etc/profile.d/

    # chmod 755 /etc/profile.d/xcat.sh

    ```


    Next, patch the Red Hat Kickstart files that you copied from the CD-ROM. This
    fixes numbers of issues with the installation, most importantly, with brand new
    devices. Use the command:


    ```

    # patch -p0 -d /install/rh62 < /usr/local/xcat/build/rh62/ks62.patch

    ```


    To enable the fix, you must now compile and install the fixed version of newfypedit.
    Use the command:


    ```

    # cd /install/rh62/misc/src/anaconda/libfsdisk

    # make newfypeditso

    # cp -fp newfypeditso (DO NOT BREAK LINE!)

    /install/RedHat/usr/lib/python1.5/site-packages/

    ```


    Copy the xcat init scripts for the local system and post installation files for
    the installed nodes using the command:


    ```

    # cp -pf /usr/local/xcat/* /etc/rc.init.d/

    # cp -r /usr/local/xcat/post /install/

    ```


    Activate the SNMP manager and enable some TCP performance enhancements with the
    following commands:


    ```

    # /sbin/chkconfig snptrapid on

    # /usr/local/xcat/sbin/updaterclocal

    ```


    Finally, if you downloaded any Red Hat updates, copy them to /install/post/rpm
    so they can be installed on the nodes.


    ## 6.4 Additional software installation


    Although you have now configured all the Red Hat components required by Red Hat,
    there are still a number of other packages that must be installed and configured
    on the management node.


    ### 6.4.1 The Linux kernel


    For a number of reasons, it is necessary to install a custom kernel on all the
    nodes in the cluster, including the management node. It is recommended that the
    same kernel be used on both the management nodes and the compute nodes, although
    this is not mandatory. Instructions on compiling a kernel are beyond the scope
    of this redbook, so if you do not know how to do this task, it is important you
    read and understand the Kernel-srcHOWTO before you start. The Kernel-HOWTO and
    many other useful documents can be found in the Linux Documentation Project homepage
    at:


    http://www.linuxdoc.org/


    The Linux kernel can be downloaded from:


    ftp.kernel.org


    If you know what you are doing, you might want to upgrade to a later kernel. Note
    that the kstamp files in /usr/local/xcat/ks62 refer to the 2.2.18smpx kernel and
    will need to be modified. This is only recommended for experts.


    To generate a 2.2.18smpx kernel from a stock 2.2.18, you should download the 2.2.18
    kernel source from ftp://kernel.org/pub/linux/kernel/v2.2/linux-2.2.18.tar.bz2
    and unpack it to /usr/src using the following commands:


    ```

    # rm -f /usr/src

    # tar xvf linux-2.2.18.tar.bz2 -C /usr/src/

    # cd /usr/src/linux-2.2.18

    # mv linux-2.2.18 linux

    ```


    You are now ready to patch the kernel. The following patches must be installed:


    - Transmission Control Protocol (TCP) Short Messages

    - MagicSys Over Serial

    - Perfctr (PAPI)


    Note: If you do not know how to do this, consult the Kernel-HOWTO and any documentation
    that comes with the patches.


    #### TCP short messages


    Download and install the patch. The patch file can be found at:


    http://www.example.edu/coral/Linux2.html


    Tip: In our lab, we used the following commands to apply the patch (download the
    file tcp-patch-for-2.2.17-14.diff on /tmp):


    ```

    # cd /usr/src/linux

    # patch -p1 < /tmp/tcp-patch-for-2.2.17-14.diff

    (it is OK if you receive Makefile message, such as: FAILED)

    ```


    #### MagicSys over serial patch


    Download and install the patch. The patch file can be found at:


    ftp://ftp.kernel.org/pub/linux/kernel/v2.2/miquel/


    Tip: In our lab, we used the following commands to apply the patch (download the
    file linux-2.2.19-sysrq-patch on /tmp):


    ```

    # cd /usr/src/linux

    # patch -p1 < /tmp/linux-2.2.19-sysrq-patch

    ```


    The Linux kernel was compiled to include support for different hardware configurations.
    This is managed through the /usr/src/linux/.config file. A sample of the .config
    file for kernel 2.2.18 is included in the /usr/local/xcat/build/kernel/2.2.18
    directory. It is strongly recommended that you use this to build your kernel.
    The following patch procedure will modify this, so it is necessary to copy the
    file before installing the patch:


    ```

    # cp /usr/local/xcat/build/kernel/2.2.18/.config /usr/src/linux/.config

    ```


    #### Perfctr (PAPI) patch


    Download and install the patch. The patch file can be found at:


    http://www.cs.edu/~mike/linux/perfctr/


    Tip: In our lab, we used the following commands to install the patch (download
    the file papi-1.1.5.tar.gz to /tmp):


    ```

    # cd /tmp

    # tar xvf papi-1.1.5.tar.gz

    ```


    NOTE: The install file in /tmp/papi/src/perfctr provides good instructions.


    ```

    # cd /usr/src/linux

    # patch -p1 < /tmp/papi/src/perfctr/patches/patch-kernel-2.2.18

    # cd /tmp/papi/src/perfctr/linux

    # tar cf - | tar -C /usr/src/linux -xvf -

    # cd /usr/src/linux

    # make menuconfig

    ```


    Select "General Setup"

    Select "Performance monitoring counters support" (by pressing <Y>)

    Exit

    Save your new kernel configuration


    ```

    # mknod /dev/perfctr 10 182

    # chmod 644 /dev/perfctr

    # cd /tmp/papi/src/perfctr

    # ./configure

    # cd /usr/src/linux/include

    # make

    ```


    Make the following changes:


    - It has been our experience that NR_TASKS in /usr/src/linux/include/linux/tasks.h
    should be changed to 4000. This is the max number of processes in the system.
    (for example, 1024 processor jobs), you need to start 1024 ssh sessions from a
    single node. With the default of 512 (only 256 for users), you will never launch
    a large job. Use the following command to make the changes:


    ```

    #define NR_TASKS 4000

    ```


    - To improve TCP performance over Myrinet MAX_WINDOW to 262144 in /usr/src/linux/include/net/tcp.h
    with the command:


    ```

    #define MAX_WINDOW 262144

    ```


    - At the top of /usr/src/linux/Makefile, change EXTRAVERSION to smpx


    EXTRAVERSION = smpx


    ## Building the kernel


    The kernel is now ready to be compiled. The build procedure is outlined below;
    however, if you do not understand it, please refer to the Kernel-HOWTO. Start
    by using the command:


    ```

    # cd /usr/src/linux

    # make oldconfig

    # make dep clean bzimage modules

    ```


    Once you have successfully compiled your kernel, you should install the modules,
    the kernel, and map, and create a ramdisk image with the command:


    ```

    # cd /usr/src/linux

    # make modules_install

    # cp arch/i386/boot/bzimage /boot/bzImage-2.2.18smpx

    # cp System.map /boot/System.map-2.2.18smpx

    # cd /boot

    # mkinitrd initrd-2.2.18smpx.img 2.2.18smpx

    # ln -f bzImage-2.2.18smpx bzimage

    # ln -f System.map-2.2.18smpx System.map

    # ln -f initrd-2.2.18smpx.img initrd.img

    ```


    Next, add the kernel stanza to /etc/lilo.conf and change the default parameter
    (see Example 6-5). Be sure and check that the root= stanza matches the other entries
    in lilo.conf. Be sure you know what you are changing this file, and back it up
    before you start.


    Example6-5 Extract from /etc/lilo.conf


    ```

    default=linux-smpx

    image=/boot/bzImage

    initrd=/boot/initrd.img

    ```

    '
  mdcn: '


    ```

    # /etc/rc.d/init/syslog restart

    ```


