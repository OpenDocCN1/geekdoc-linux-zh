    ## 引言


    本章提供了 Linux 集群和高性能计算的概述。它还介绍了贯穿本书将使用的概念。


    在本章中，我们简要讨论了以下主题：


    - 谁应该读这本书

    - 开源与 Linux

    - 集群类型


    ### 1.1 起初


    多年来，计算能力和性能有了巨大的增长，但没有比如此剧烈的。早期的数学计算是通过在沙上画线来辅助的。这最终导致了算盘的出现，这是第一个辅助数学的机械设备。很多以后出现了打孔卡，一种辅助统计的机械方法。最终，这导致了日益复杂的计算设备，包括机械和电子。


