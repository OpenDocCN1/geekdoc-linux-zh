    - noderange


    ## rinstall - Remote network Linux install


    ### Description


    rinstall will force an unattended network install for a range of nodes. nodeset
    is called to set the it tftp flag. If a node is off, it will be powered on. If
    a node is on, it will be reset.


    rinstall returns nodename: powerstate action, where powerstate is on or off and
    action is on or reset for each node.


    ### Synopsis


    ```

    rinstall [noderange]

    For example:

    rinstall node1,node2,node8,node20

    rinstall node14-node56,node70-node203

    rinstall node1,node2,node8,node20,node14-node56,node70-node203

    rinstall all -node129-node256

    ```


    ### Example


    ```

    # rinstall node4,node5

    node4: off on

    node5: reset

    node4 was off then powered on, node5 was on then reset.

    ```


    ### Files


    | nodelist.tab | Only nodes in this table will be affected by this command. |

    | sp.tab | Service Processor Network definition table. |


    ### Diagnostics


    | unknown spn xyz | Returned if spn name (xyz) in sp.tab cannot be resolved by
    DNS. |

    | Connection refused | Returned if telnet fails. PCI ASMA may be in use or telnet
    interface is locked up. spnreset can be used to reboot the PCI ASMA. |

    | telnet to xyz failed | telnet command timed out. PCI ASMA adapter may not have
    power. Check Ethernet cable and IP. |

    | node xxx not on spn yyy | xxx is not listed in SPN yyy. Use spncheck yyy to
    verify. Check cabling and try spnreset. |


    - nodeset


    ## winstall - Windowed remote network Linux install


    ### Description


    winstall will force an unattended network install for a range of nodes. winstall
    passes its arguments to rinstall and wcons.


    winstall is functionally equivalent to rinstall, except that wcons will launch
    an xterm for the remote console display, as shown in Figure A-3 on page 164. As
    the number of nodes requested increase the panels will get smaller.


    Use wkill to quickly get rid all your wcons panels.


    To change the font size, Shift-right-click in the center of the panel.


    winstall returns nodename: powerstate action, where powerstate is on or off and
    action is on or reset for each node.


    ### Synopsis


    ```

    winstall [noderange]

    For example:

    winstall node1,node2,node8,node20

    winstall node14-node56,node70-node203

    winstall node1,node2,node8,node20,node14-node56,node70-node203

    winstall all -node129-node256

    ```


    ### Example


    ```

    # winstall node4,node5

    node4: off on

    node5: on reset

    node4 was off then powered on, node5 was on then reset.

    ```


