    # Cluster Systems Management (CSM)


    Part of the IBM Linux clustering strategy involves the port of its PSSP software,
    formerly only available for the RS/6000 SP platform, to xSeries based Linux clusters.
    It is not actually a port, but an enhanced version based on the SP software, open
    source, WebMS 2000, xSeries development, and other technology sources.


    An initial version of CSM will become available by the middle of 2001, and will
