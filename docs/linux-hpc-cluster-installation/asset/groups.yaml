    表 F-1 包含了关于您对集群期望的问题。


    **表 F-1** 需求调查问卷


    | 问题 | 您的注释 |

    |--- |--- |

    | 集群的性能需求是否已记录？如果是，请说明任何要求的衡量标准。 | |

    | 集群配置是否已进行规模计算并验证以匹配需求？<br>应用类型<br>处理器<br>内存<br>缓存<br>磁盘存储 / RAID（本地）<br>磁带（备份）<br>适配器
    | | |

    | 此集群是否需要高速、低延迟的进程间通信 (Myrinet)？ | | |

    | 集群将用于什么？ | | |

    | 问题 | 您的注释 |

    |--- |--- |

    | 您对此集群的期望是什么（10个字以内）？ | | |

    | 您为您的集群起了什么酷的名字？ | | |

    | 您是否知道任何可能影响您实现此集群的条件或问题？ | | |

    | 是否已经建立了磁盘存储需求和磁盘布局？特别是，这适用于集群对连接的需求，以及与外部数据/存储连接的方法。 | | |


    ## 环境调查问卷


    表 F-2 包含了关于您的集群环境的问题。


    表 F-2 环境调查问卷


    | 问题 | 您的注释 |

    |--- |--- |

    | 集群将安置在机房内吗？是否有空间？ | | |

    | 会架空地板吗？如果是，它为布线提供足够的空间吗？ | | |

    | 地板能承受集群的重量吗？ | | |

    | 是否有或将会有合适电压和指定插座的电源？ | | |

