    # wvid - Remote video


    # Description


    wvid redirects the console text video. wvid is functionally equivalent to rvid.
    except that wvid will launch an xterm with geometry 80x25 and a VGA font for the
    remote video display, as shown in Figure A-2. Useful for debugging boot process.


    wvid differs from wcons in that wvid is slow, is not always interactive, and operates
    on a single node.


    > Note: While viewing remote video, no other Service Processor functions may be
    performed to any other node sharing the same Service Processor Network.


    # Synopsis


    wvid [singlenode][boot|noboot]

    For example:

    wvid node23


    # Example


    ```

    # wvid node5 boot

    ```


