    # Remaining interface configuration


    Before you reboot, you should configure your remaining ethernet adapters. You
    can add configurations for eth1 and eth2 through linuxconf or perform the updates
    manually. When selecting a driver for the 10/100 card, remember to use the Intel
    e100 driver and not the kernel eprop100.


    The configured files used in our cluster lab are shown in Example 6-7, Example
    6-8, and Example 6-9.


    Example 6-7 /etc/conf.modules

    ```bash

    alias scsi_hostadapter aic7xxx

    alias scsi_hostadapter ips

    alias parport_lowlevel parport_pc

    alias eth0 pcnet32

    alias eth1 e1000

    alias eth2 e1000

    ```


