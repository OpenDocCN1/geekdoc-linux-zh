    \ to suit your local environment based on the values decided upon earlier.\n\n\
    Set timezone based on your location. The values are composed of a path appended\
    \ to /usr/share/zoneinfo. You can see all available values on an installed system.\n\
    \nThis is the password for the root user on the system. It is highly recommended\
    \ you change this from the default.\n\nThe ks.cfg is designed to be copied onto\
    \ the ServeRAID device disk. A self extracting executable (Windows only) of the\
    \ disk image can be downloaded from:\n\n```\nhttp://www.pc.ibm.com/support/\n\
    ```\n\nTo use this file, create the disk according to the README file and then\
    \ copy the customized ks.cfg file onto it.\n\nUse the following procedure to begin\
    \ the install based on the ks:\n\n- Create ServeRAID driver disk.\n- Copy customized\
    \ ks.cfg to floppy.\n- Boot the system from a Red Hat 6.2 CD-ROM without the floppy\
    \ in the drive.\n- When you get the boot: prompt, insert the device driver floppy.\n\
    - Type in linux ks=floppy and press Enter.\n\nThe install should start automatically.\
    \ Remove the floppy when you see the Preparing to install dialog.\n\nThere is\
    \ a small bug in the Red Hat Kickstart code that says something similar to: \"\
    a Kickstart installation will not proceed automatically when installing to a hard-disk\
    \ with bad partitions.\" This message usually occurs when information is being\
    \ saved to a new disk. If this is the case, press Enter at the Initialize panel\
    \ and the installation will proceed normally. Once the Preparing to install dialog\
    \ box is displayed, the installation will proceed, and you can leave the system\
    \ to install and reboot automatically to Linux.\n\n## 6.2.2 System configuration\n\
    \nNow the system has been installed, it must be configured. The first part of\
    \ this configuration is similar to the configuration you might perform on any\
    \ freshly installed Linux system, with an emphasis on security. All these tasks\
    \ must be performed as the root user.\n\n## Set root password\n\nOnly if you did\
    \ not change the root password in the ks.cfg or if you would prefer a different\
    \ password to that specified in the ks.cfg file.\n\n## Add login user\n\nIt is\
    \ not possible to log in to Linux as root over the network, so at least one other\
    \ user must be created for this purpose. It is often convenient to have more than\
    \ one account if a number of people will be using the management node.\n\nCreate\
    \ the user with Linuxconf or use the `useradd` command, as shown in Example 6-1.\n\
    \nExample 6-1 User creation with useradd\n\n```\nroot@master [#root]# useradd\
    \ -c 'IBM User' ibm\nroot@master [#root]# passwd ibm\nChanging password for user\
    \ ibm\nNew UNIX password:\nRetype UNIX password:\npassword: all authentication\
    \ tokens updated successfully\n```\n\n## Verify the network configuration\n\n\
    Kickstart have setup your network for you, but it is advisable to verify this\
    \ using **ping**. The simplest and most comprehensive test is to ping a *named*\
    \ machine, preferably on a network that needs to go via the gateway, as shown\
    \ in Example 6-2.\n\nExample 6-2 Pinging a known machine through a gateway\n\n\
    ```\nroot@master [#root]# ping -c 2 www.redbooks.ibm.com\nPING www.redbooks.ibm.com\
    \ (207.25.253.24) from 93.197.104 : 56(84) bytes of data.\n64 bytes from www.redbooks.ibm.com\
    \ (207.25.253.24) : icmp_seq=0 ttl=121\ntime=92.0 ms\n64 bytes from www.redbooks.ibm.com\
    \ (207.25.253.24) : icmp_seq=1 ttl=121\ntime=92.0 ms\n--- www.redbooks.ibm.com\
    \ ping statistics\n2 packets transmitted, 2 packets received, 0% packet loss\n\
    round-trip min/avg/max = 92.0/95.9/99.9 ms\n```\n\nVerify your network settings\
    \ if this test fails.\n\nIf the management node is to serve as a network gateway,\
    \ you must enable IP forwarding. You should *not* enable this if you will have\
    \ another gateway node in your cluster, as it may affect the security of your\
    \ system. Open /etc/sysctl.conf in your favorite text editor and change the ipv4.ip_forward\
    \ line to:\n\n```\n# net.ipv4.ip_forward = 1\n```\n\n## Updating host table\n\n\
    You should already have decided on an addressing scheme, it should be a simple\
    \ matter to copy it into /etc/hosts using your favorite text editor. It is even\
    \ possible to use Linuxconf for this task if you like, but it will take you much\
    \ longer. Example 6-3 contains the contents of /etc/hosts from our four node cluster.\n\
    \nExample 6-3 /etc/hosts\n\n```\n127.0.0.1       localhost\n192.168.1.1     node1\n\
    192.168.1.2     node2\n192.168.1.3     node3\n192.168.1.4     node4\n```\n\n##\
    \ Shut down unnecessary services\n\nRed Hat 6.2 enables a number of daemons that\
    \ are not needed on the management node. For security and serviceability reasons,\
    \ it is advisable to disable any daemons that are not needed. The following commands\
    \ disable services you would normally need. You may choose to leave some of these\
    \ running, although we do not recommend it.\n\n```\n# /sbin/chkconfig ampd off\n\
    # /sbin/chkconfig autfs off\n# /sbin/chkconfig httpd off\n# /sbin/chkconfig identd\
    \ off\n# /sbin/chkconfig isdn off\n# /sbin/chkconfig kudzu off\n# /sbin/chkconfig\
    \ lpd off\n# /sbin/chkconfig pmcia off\n# /sbin/chkconfig reconfig off\n```\n\n\
    > Note: In addition, you may need to make a careful review of the services and\
    \ proceed with the shutdown of the ones you do not need.\n\n## Shut down unnecessary\
    \ services\n\nA large number of other services are started through the inetd command,\
    \ all of which are unused. Use the following commands to disable these services\
    \ by commenting out all the lines in inetd.conf and then reloading it.\n\n```\n\
    # cp /etc/inetd.conf /etc/inetd.conf.SAVE\n# perl -pi -e 's/\\#/\\g' /etc/inetd.conf\n\
    # /etc/rc.d.init.d/inetd reload\n```\n\n## Fix syslog\n\nThe management node collects\
    \ syslog information from all the other nodes in the cluster, but the default\
    \ configuration for syslog is not to listen for remote messages. To enable remote\
    \ logging, syslog must be started with the -r switch. Modify the daemon line in\
    \ /etc/rc.d.init.d/syslog accordingly, as in Example 6-4.\n\nExample 6-4 Extract\
    \ from modified/etc/rc.d.init.d/syslog\n\n```\n...\necho -n \"Starting system\
    \ logger: \" \n  # we don't want the MARK ticks\n  daemon syslog -m 0 -r\n```\n\
    \nTo enable this change, restart the syslog daemon:\n"
