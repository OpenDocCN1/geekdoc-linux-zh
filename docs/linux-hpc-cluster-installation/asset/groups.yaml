    | Command | Description |

    | --- | --- |

    | rvid | Redirects console text video. Useful for debugging boot issues. |

    | wvid | Redirects console text video. It is functionally equivalent to rvid,
    except that wvid will launch an xterm panel for the remote console display. |

    | ritals | Retrieves vital hardware information from the on-board Service Processor
