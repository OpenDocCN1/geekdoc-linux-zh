    # 3.1.2 Compute nodes


    The compute nodes form the heart of the cluster. The user, control, management,
    and storage nodes are all designed in support of the compute nodes. It is on the
    compute nodes that all computations are actually performed. These will be logically
    grouped, depending on the needs of the job and defined by the job scheduler. The
    compute nodes are typically built using the x330.


    The x330 features two Pentium® III processors in a 1U form factor, a 133 MHz Front
    Side Bus, two 64 bit PCI slots, and an onboard Service Processor. The 64-bit PCI
    slots allow the server to take advantage of the bandwidth capabilities of the
    Myrneret 2000.


    The x330 takes up only one unit or 1U in a rack. In 1U space, we have two hard
    drives, two CPUs, four DIMM memory slots (allowing up to 4 GB of memory) and two
    PCI card slots. This is a typical compute node configuration.


    # 3.1.3 Management


    Before looking at the software elements of the cluster, we need to discuss hardware
    components of the cluster that are used for its management.


    Cluster management begins with our ability to control the machines in the cluster.
    Clearly, it is possible to walk around and push a power switch in order to power
    off all. However, this is often not practical, and for certain tasks, a higher
    level of control is needed. There are three components to help us to deal with
    issues:


    +   * Terminal server

    * ASM/SPN network

    * KVM switch


    # Terminal Server


    The terminal server is a device that connects many terminals to a local area network
    (LAN) through one network connection. It provides serial connectivity to the network
    for serial devices and printers.


    We recommend using a terminal server in the cluster for two reasons:


    +   * Access to the cluster machines in case you cannot get access via the LAN.
    For example, it may be down for maintenance.

    * Medium access control (MAC) address collection. If you do not have a layer 2
    switch capable of this, the Equinox terminal Server may allow you to get the MAC
    addresses for the installation node.'
- md: '

    We use an Equinox ELS Terminal Server in our lab. It offers:


    - Local area transport (LAT) and Transmission Control Protocol/Internet Protocol
    (TCP/IP) support

    - ELS Server Features

    - Support for TCP/IP and DEC LAT protocols

    - Built-in parallel port

    - Multi-session support

    - Support for NetWare™ IPX print servers


    The terminal server is an optional component of the cluster. It is not vital for
    basic cluster function, but its presence is useful.


    Please visit the Equinox web site http://www.equinox.com/ for more information.


    ## Service Processor Network


    The onboard Service Processors (SP) of xSeries machines allow for remote power
    management, environmental monitoring, alerts and remote BIOS. They are linked
    together to form Service Processor Networks, which are created from two elements.
    These are:


    ### Advanced system management (ASM)


    Each node has a chip set called the advanced system management processor. This
    is sometimes referred to as the rancher chip. Working with the hardware instrumentation
    and xSeries systems management software, ASM processors are the key to problem
    notification and resolution. They provide the system administrator with complete
    remote management of a system, independent of the server status. The processors
    simulate a cluster within a computer, keeping the server up and for your critical
    applications.


    ### Advanced Systems Management Adapter (ASMA)


    The ASMA card (sometimes called a Wiseman card) is a peripheral interconnect (PCI)
    adapter which allows you to connect to a local area network (LAN) or modem from
    virtually anywhere for remote management. Up to 11 ASMA processors are daisy chained
    and then connected to the ASMA card. Each ASMA adapter is externally powered,
    so it is not dependent on the status of the host machine. The ASMA card is then
    connected to the management network so that the code can be controlled and alerts
    forwarded.


    For more information about ASM/SPN, refer to the IBM Netfinity Advanced Systems
    Management white paper, found at:


    http://www.pc.ibm.com/us/eserver/xseries/


    ## Keyboard, video, and mouse (KVM) and the crash cart


    The x330 has a built-in capability for a KVM switch. To use this function, simply
    daisy chain the unit''s KVM ports and then connect them to a central Apex KVM
    switch. This allows for a high level of control in displaying the panel of one
    node by pressing a button on the front of the x330. The head nodes will also be
    connected directly into the KVM switch. Pressing the Screen on the master console
    will bring up a menu and allow you to select the desired unit, either the head
    nodes or the entire daisy chain of x330s. If you select the daisy chain, you can
    then press the NumLock key, followed by the number of the desired unit on the
    daisy chain; then press the Enter to select that unit.


    In the event the KVM switch is not used, the next alternative is to use a crash
    cart. In this environment, the keyboard, mouse, and video display are kept on
    a cart with wheels. When required, the cart is wheeled over to the desired node
    and connected to the respective ports to provide KVM functions. The need of a
    crash cart has largely been obviated by the development of the x330 with its built-in
    KVM features.


    ## 3.1.4 Network


    Networking in clusters usually needs high bandwidth, high speed, and low latency.
    The most demanding communication occurs between the compute nodes. This section
    presents the protocol and technologies used to build a cluster solution.


    ### Fast Ethernet


    Fast Ethernet and TCP/IP are the two standards largely used for networking. They
    are simple and cost-effective, and the technology is always improving.


    Fast Ethernet works with a 200 MHz Intel Pentium Pro based machine used for a
    Beowulf node, and can operate at either half-duplex, or full-duplex. With full-duplex,
    data can be sent and received at the same time.


    Full-duplex transmission is deployed either between the ports on two switches,
    between a computer and a switch port, or between two computers. Full-duplex requires
    a switch; a hub will not work.


    ### Gigabit Ethernet


    Gigabit Ethernet uses a modified version of the American National Standards Institute
    (ANSI) X3T11 Fibre Channel standard physical layer (FC-0) to achieve Gigabit per
    second bandwidth.


    Gigabit Ethernet supports multi and single mode optical fiber and short haul copper
    cabling. Fibre is ideal for connectivity between switches and servers and can
    reach a greater distance than copper.


    Researchers have observed that the most significant overhead is the time required
    to communicate between CPUs, memory, and I/O subsystems that are directly connected
    to the network, and that this communication time may exponentially in a Beowulf
    cluster.


    With the increase of PCI bus capability, the Gigabit Ethernet media is usable
    in a Beowulf cluster, as it can provide more bandwidth. At this point, however,
    the bottleneck becomes the protocol used for communication.


    Some Parallel libraries, as local area multicomputing (LAM) and MPICH, use the
    Transmission Control Protocol/User Datagram Protocol (TCP/UDP) socket interface
    for communicating messages between cluster nodes. Even though there has been a
    great effort to reduce the overhead incurred in processing the Transmission Control
    Protocol/Internet Protocol (TCP/IP) stacks, this is still one of the factors affecting
    performance.


    For more information on this subject, see The Failure of TCP in High-Performance
    Computing Grid, found at: http://www.sc2000.org/techpapr/papers/pap.pap174.pdf


    So there is a need to develop something new. Currently, for example, we use the
    Virtual Interface Architecture (VIA) used by Giganet.


    ### Virtual Interface Architecture (VIA)


    VIA is a mechanism that bypasses the layers of the protocol stack and avoids intermediate
    copying. VIA is based on two interfaces:


    - Software

    - Hardware


    VIA is portable on network interface cards (NIC). A new version of MPICH has been
    created using VIA.


    ## Myrinet and GM


    Myrinet is a high-performance switching technology designed for low-latency. GM
    is a message passing system for Myrinet and has replaced API. Some of Myrinet''s
    characteristics are:


    - Full-duplex links

    - Flow control

    - Low-latency

    - High Availability


    The GM package is based on several components, such as drivers, API, and libraries.
    Myricom''s Myrinet software support is distributed as open source. Please refer
    to the Myricom site http://www.myri.com for further information.


    ## 3.2 Software


    In order to build an operational cluster, you will need several software components,
    including an operating system, drivers, libraries, compilers, and management tools.
    This section presents the software products normally used to build an IBM Linux
    Cluster Solution.


    ### 3.2.1 Operating system


    Linux is the UNIX-based operating system used primarily in Beowulf clusters. One
    of the reasons for its success in Beowulf clusters is because the Beowulf software
    and drivers are in continuous evolution, hence the need for an open source operating
    system.


    We use Red Hat 6.2 in our cluster because many of the libraries and tools have
    been written and tested based on that release.


    ### Installation


    The installation software is responsible for facilitating the installation operation
    of compute nodes. Our solution is based on using the Pre-Execution Environment
    (PXE) for remote booting, and Kickstart for the installation. It may be possible
    to use ALICE (Automatic Linux Installation and Configuration Environment) instead
    of Kickstart in the future.


    ### PXELinux


    PXELinux is a program for booting off a network server using a boot PROM compatible
    with the Intel Pre-Execution Environment (PXE) specification. It allows for a
    level of control of the boot process prior to actually loading a kernel. Using
    PXE, or more specifically, PXELinux, we can control the operation of the boot
    process from a management node. If no changes are required, simply tell PXELinux
    to boot from the hard drive. However, if we wish to reload the node from scratch,
    we can tell the node to boot from the network. If we wish to rebuild one or all
    of the nodes, we can use Red Hat Kickstart to provide an automated installation
    of the nodes.


    PXELinux is part of syslinux, which is available at:


    ```

    ftp.kernel.org

    ```


    ### Red Hat Kickstart


    Kickstart is a system installation and customization program developed by Red
    Hat. It allows clients, as compute nodes, to be completely installed remotely
    by a server without the need for manual interaction. xCAT configures and invokes
    KickStart during the installation of compute nodes.

    '
