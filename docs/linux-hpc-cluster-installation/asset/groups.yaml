    | revent | Displays any number of remote hardware log entries or clears them for
    a range of nodes. |

    | rinv | Retrieves configuration information from the on-board Service Processor
    for a range of nodes. |

    | psh | Runs a command across a list of nodes in parallel. |

    | pping | Pings a list of nodes in parallel. |

    | reinstall | Forces an unattended network install for a range of nodes. |

    | winstall | Forces an unattended network install for a range of nodes. It is
    functionally equivalent to reinstall, except that winstall will launch an xterm
    panel for the remote console display. |


    The remainder of this appendix is devoted to describing the xCAT commands.


    ## rpower - Remote power control


    ### Description

    rpower can control the power (on/off/stat) for a range of nodes.


    ### Synopsis

    ```

    rpower [norage] [on|off|stat]

    ```

    For example:

    rpower node1,node2,node8,node20 stat

    rpower node14-node56,node70-node203 stat

    rpower node1,node2,node8,node20,node14-node56,node70-node203 stat

    rpower all -nodel229-node256 off

    ```


    ### Example

    ```

    # rpower node4,node5 stat

    node4: on

    node5: off

    # rpower node5 on

    node5: on

    ```


    ## rreset - Remote hardware reset


    ### Description

    rreset sends a hard reset to a range of nodes.


    ### Synopsis

    ```

    rreset [noderange]

    ```

    For example:

    rreset node1,node2,node8,node20

    rreset node14-node56,node70-node203

    rreset node1,node2,node8,node20,node14-node56,node70-node203

    rreset all --node129-node256

    ```


    ### Example

    ```

    # reset node3-node5

    node3 reset

    node4 reset

    node5 reset

    ```


    ## rcad - Remote software reset


    ### Description

    rcad sends a Ctrl+Alt+Del (soft reset) to a range of nodes. This command is currently
    only supported by x330 nodes. Support for other node models is forthcoming.


    ### Synopsis

    ```

    rcad [norage]

    ```

    For example:

    rcad node1,node2,node20

    rcad node14-node56,node70-node203

    rcad node1,node2,node8,node20,node14-node56,node70-node203

    rcad all -node29-node256

    ```


    ### Example

    ```

    # rcad node3-node5

    node3 Ctrl+Alt+Del function not supported

    node4 Ctrl+Alt+Del function not supported

    node5 Ctrl+Alt+Del

    Node3 and 4 are 4500Rs, node5 is an x330.

    ```


    ### Files

    | File | Description |

    | --- | --- |

    | nodelist.tab | Only nodes in this table will be affected by this command. |

    | sp.table | Processor Network definition table. |


    ### Diagnostics

    | Error | Description |

    | --- | --- |

    | Ctrl+Alt+Del function not supported | Returned if node model does not support
    Ctrl+Alt+Del. |

    | unknown spn xyz | Returned if spn name (xyz) in sp.table cannot be resolved
    by DNS. |

    | Connection refused | Returned if telnet fails. PCI ASMA may be in use or network
    interface preset can be used to reboot the PCI ASMA. |

    | telnet to xyz failed | Telnet command timed out. PCI ASMA adapter may not have
    power. Check Ethernet cable and IP. |

    | node xxx not on spn yyy | xxx is not listed in SPN yyy. Use spncheck yyy to
    verify. Check cabling and try spnreset. |

    | Remote session timeout | Telnet was successful but communication with node failed.
    Wait one minute and try again. |


    ### See also

    - noderange

    - rreset


    ## rcons - Remote console


    ### Description

    rcons provides access to the serial console.


    ### Synopsis

    ```

    rcons [singlenode]

    ```

    For example:

    rcons node23


    ### Files

    | File | Description |

    | --- | --- |

    | nodelist.tab | Only nodes in this table will be affected by this command. |

    | sp.table | Processor Network definition table. |


    ### Diagnostics

    | Error | Description |

    | --- | --- |

    | unknown spn xyz | Returned if spn name (xyz) in sp.table cannot be resolved
    by DNS. |

    | Connection refused | Returned if telnet fails. PCI ASMA may be in use or network
    interface preset can be used to reboot the PCI ASMA. |

    | telnet to xyz failed | Telnet command timed out. PCI ASMA adapter may not have
    power. Check Ethernet cable and IP. |


    ### See also

    - rreset


    ## wcons - Remote console


    ### Description

    wcons provides access to the serial console via an xterm panel. It is functionally
    equivalent to rcons (or rvid depending on use case), except that wcons will launch
    an xterm panel for the remote console display.


    ### Synopsis

    ```

    wcons [noderange]

    ```

    For example:

    wcons node23

