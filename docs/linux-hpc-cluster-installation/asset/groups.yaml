    | 问题 | 您的注释 |

    |--- | --- |

    | 除了 Netinity/eServer xSeries 之外，解决方案还包含哪些硬件组件（RS/6000/pSeries, AS/400/iSeries,
    S390/zSeries, 存储子系统等）？ | | |

    | IP 地址范围是什么（计算节点、头节点、以太网交换机、ASMA 适配器、终端服务器等）？确定将使用私有地址空间还是使用由网络组提供的指定范围。 | |
    |

    | 您的命名规范是什么（节点、机架、管理等）？从0 还是 1 开始？是否有任何前缀或填充要求？注意：命名必须为前缀/后缀，其中前缀为 [A-Za-z \-]，后缀为
    [0-9]。 | | |

    | 您是否有任何特定的标签要求？这与命名规范的问题类似，但指的是用于识别设备的特定标签。 | | |


    附录 F. 集群调查问卷 209


    | 问题 | 您的注释 |

