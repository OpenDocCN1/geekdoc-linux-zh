    We need to change the serial port connection because we plan to use a serial console
    redirection with the terminal server. Therefore, we need a reliable serial connection.
    With the default setup connecting to COM port A, we would share our connection
    with the systems management chip set, which would lead to lockups and time-outs
    related to its use of the port. By using COM port B for our serial connection,
    we do not interfere with the systems management functionality.


