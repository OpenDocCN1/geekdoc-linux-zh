    ## 1.5.1 高可用 (HA) 集群


    高可用性（HA）集群并不容易分类。事实上，我们确定许多人可以为不同的逻辑结构组织提供理由。我们的逻辑结构组织是基于功能的。例如，在数据库集群或服务器集群的标题下，高可用性通常是首要的因素。Web
    集群也属于 HA 类型，我们将在第 5 页的“Web集群和 Web 池”中讨论它们。


    在一个典型的 HA 集群中，有两个相互镜像的机器。通常使用两种方案来实现这一点。在一种方案中，一台机器静静地监控另一台机器，并在故障时接管。另一种方案允许两台机器都处于激活状态。在这种环境中，应该确保将负载保持在
    50% 以下，否则当某个节点故障时会出现容量问题。这两个节点通常共享一个磁盘阵列，由小型计算机接口 (SCSI) 或光纤通道将两个节点连接到同一个阵列。或者，不是让两个节点连接到同一个阵列，而是拥有独立的阵列来相互替换以实现容错。在这个子系统中，必须通过文件和锁定来保证数据完整性。此外，必须有一个管理系统允许每个系统监控并控制另一个系统，以便检测错误。设计
    HA 集群有许多方法，而且列表正在增长。


    ## Web 集群和 Web 池


    Web 集群通常来自许多其他计算平台或集群元素，并且是各种技术的混合体。典型的 Web 集群是一个机器的集合，而不是一个真正的集群。我们将从顶部开始探索典型的
    Web 集群，那里与互联网接口，并在底部存储数据内容的地方结束。


    ![](img/ccdee7f1b183ba80fa8386b0cb1315_27.png)


    图 1-1 通用 Web 集群


    ## 负载均衡集群


    图 1-1 显示了一个典型的高可用 Web 集群环境。图顶部是互联网。注意存在冗余连接。这些将与负载均衡方法相结合，可以通过专用硬件或各种软件产品（如 Linux
    虚拟服务器 LVS）。


    ## Web 服务器集群


    下一层是 Web 服务器所在的地方。这仅仅是一组运行 Web 服务器应用程序的机器。这些服务器可以呈现静态页面（有时称为 de brochure），也可以拥有具有动态内容的复杂页面。如果某个服务器发生故障，负载均衡器会注意到，并将请求发送到其他服务器。如果负载剧增，可以轻松添加额外的服务器。


    ## 应用程序集群


    应用程序层是保留和运行服务器端的地方。服务器端 Java™ 在这一层被保留和运行。这通常是一种高可用解决方案。在这一级，增加机器以提高容量仍然相当容易。


    ## 数据库服务器集群


    最后是数据库层。这一层通常需要某种形式的 HA 解决方案。在大型业务中，这种主机数据库并不稀奇。使用上述后端创建一个健壮的、高应用的数据库并不困难，后端可以使用
    Linux 以及各种数据库选择，例如 IBM 的 DB2 或开源的 MySQL。在没有进行早期思考和规划的情况下，在这一级增加容量是非常困难的。


    还要注意，在 Web 服务器领域，各种层可以组合在一台或两台机器中。这很大程度上取决于预期的运行小时以及硬件的合理性。


    ## 服务器合并集群


    在如今的 IT 部门中，随着部门服务器的增加，拥有越来越多的文件服务器并不罕见。在某个时刻，将这些服务器合并到一个大型机器中会有显著的成本和支持优势。如果大部分数据都存储在这里，那么开发某种高可用解决方案是有意义的。第
    7 页“数据库服务器集群”中定义的架构可以作为解决方案使用。还有几种方法连接网络存储并使多个服务器能够共享数据。无论架构如何，目标都是将许多现有服务器并组合成一个永不故障的单一解决方案。


    ## 1.5.2 高性能计算


    高性能计算 (HPC) 是计算机科学的一个分支，专注于开发超级计算机、并行处理算法和相关软件。HPC 之所以重要，是因为它的成本较低，并且它被实现在需要分布式并行计算的领域：


    - 解决大型科学问题

    - 先进的产品设计

    - 环境研究（天气预测和地质研究）

    - 研究

    - 存储和处理大量数据

    - 数据挖掘

    - 基因组学研究

    - 互联网引擎搜索

    - 图像处理


    **极易并行（高吞吐量计算）**

    某些应用程序根据其定义就可以被细分为更小的任务。假设你想在百科全书中搜索“从不在周日”这个短语。你可以将百科全书的不同部分分给不同的人并细分任务。然而，有时你想要找到的模式定义得并不明确。例如，将周日与其他周的其他天一起进行搜索是可以的。这意味着搜索次数是第一个示例的七倍，但它仍然易于细分。


    这通常被称为极易并行（最近称为高吞吐量计算）。SETI Home（寻找地外生命信号）是这种类型的极佳例子。每个部分信息需要被搜索。搜索结果将被发送回原始位置进行汇总。许多过程，如寻找基因序列。


    ## 分布式计算


    某些作业虽然被拆分了，但节点之间仍需要大量的通信。IBM Linux 集群解决方案使用 Myrinet 作为高速交换结构，以提供低延迟、高带宽的节点间通信。Myrinet
    配置为提供全双分带宽，从而在任何节点之间提供全带宽能力，并可以通过增加交换机扩展到数千个节点。


    ## Beowulf 集群


    Beowulf 主要基于商品化硬件、软件和标准。它是执行密集型计算应用时使用的架构之一。它是多个组件的结合，如果经过适当的调优和选择，可以加快应用程序的执行。Beowulf
    架构的逻辑视图如图第 10 页的图 1-2 所示。


    可以使用不同的硬件和软件构建：


    - 第一类：完全使用商品化硬件和软件构建。优点是价格以及使用标准技术（SCSI、以太网、IDE）。

    - 第二类：不一定仅使用商品化硬件和软件构建。性能优于第一类。


