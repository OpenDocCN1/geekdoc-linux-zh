    # # xCAT help


    For an easier understanding of the way xCAT should be used, we provide a short
    introduction to xCAT, explaining what xCAT is and what it is and not. Furthermore,
    we will cover its structure and basic contents.


    # ## What xCAT is


    xCAT is a collection of shell scripts written by Egan Ford to, more or less, automate
    the installation and maintenance of xSeries Linux clusters. Additionally, it is
    packed into a distribution providing you with a consistent directory structure
    and a few small patches for third party tools.


    # ## What xCAT is not


    xCAT is by no means complete commercial all-in-one xSeries installation and management
    tool. It is using the UNIX approach by combining several different GNU/Linux tools
    and third party software with a more powerful package of scripts that are used
    to install and manage a Linux xSeries cluster.


    # ## Directory structure and contents


    xCAT should be untarned into /usr/local/; the following subdirectories can be
    found below /usr/local/xCAT/:


    +   * **bin/** Commands (shell scripts) for cluster management.

    * **build/** Directories for building third party software, such as PBS, Maui,
    and so on; some directories contains patches to be'
  - '[PAGE 159]


    applied before building the software to fix incompatibilities or small bugs.


    etc/ Configuration files and tables used by xCAT commands.


    html/ Uncompleted documentation in HTML.


    ks62/ Default Red Hat Kickstart and PXELux configuration files for compute nodes
    installation.


    lib/ Additional, mostly binary, executables used by some commands.


    post/ Scripts used by commands in bin/.


    samples/ Files for post installation modifications of the installed nodes.


    sbin/ Sample files for different third party applications.


    src/ Commands for setting up the cluster (node) installation.


    stage/ Sources for some supplied tools.


    sys/ Staging image for node installation and scripts to generate the complete
    staging images.


    tftp/ init process scripts for several applications and PXELux default configuration
    file and link to tftpd in post.


    Please pay attention to the INSTALL file and follow its instructions for populating
    the xCAT directory tree with the missing third party software before actually
    using the xCAT commands.


    Table A-1 provides a quick reference of the xCAT commands. In this same appendix,
    we provide a full description of each xCAT command, including the syntax, and
    examples on how to use them.


    | Command | Description |

    | --- | --- |

    | rpower | rpower can control the power (on/off/stat) for a range of nodes. |

    | rreset | Sends a hard reset (like reset button) to a range of nodes. |

    | rcad | Remote soft reset (Ctrl+Alt+Del). |

    | rcons | Remote (text) console. |

    | wcons | Remote (video) console. |'
