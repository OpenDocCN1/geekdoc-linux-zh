  mdcn: "\nMPI_RECEIVE。由于程序员对任务之间的交互具有完全的控制权，因此通过妥善设计任务之间的同步和通信，可以实现更好的可扩展性，这比目前的任何其他并行化技术都要好。\n\
    \n访问 http://www-unix-mcs.anl.gov/mpi/mpich/index.html 了解更多关于 MPICH 及相关主题的信息。\n\
    \n## OpenMP\n\nPVM 和 MPI 专为跨集群工作而设计。OpenMP 设计用于在对称多处理器（SMP）机器内部工作。在 SMP 模型中，处理器具有共享的内存地址空间，该空间可用于传输消息。OpenMP\
    \ 使用此共享内存地址空间，因此在 SMP 环境中非常有效。然而，它在集群环境中没有用。在某些情况下，OpenMP 可以与 MPI 或 PVM 结合，以同时利用\
    \ SMP 和集群环境。\n\n## 2.4.4 资源管理\n\n从用户的角度来看，集群就像任何其他服务器或 PC。用户登录并运行交互式程序。对于任何访问同一个集群的用户来说都是如此。你不应该鼓励个人进行高强度使用；如果同时使用了太多的集群资源，性能将会下降。调度器负责集群的资源管理。虽然可以运行使用所有可用资源的作业，但作业通常使用的资源少于此。通过调度器，你可以指定需要多少个节点以及作业预计运行多长时间（以及其他各种信息）。调度器安排以最快捷的方式运行你的作业，试图让集群始终保持尽可能满载状态。\n\
    \n## 作业管理\n\nBeowulf 集群需要一种机制来管理和调度来自不同用户的作业和负载。其理念是尽可能高效地利用给定的时间和硬件资源。这确保了集群计算时间的优化利用，并能尽可能快获得结果。\n\
    \n## 资源管理器\n\n用户能够为特定任务请求适当的计算节点是重要的。为了实现这一点，资源管理器通过维护一个所有资源、提交请求和运行作业的数据库，来协调批处理系统中所有组件的操作。\n\
    \n相反，在异构环境中，重要的是：除非有特定请求，否则资源管理器应能够尽可能长时间地保留其最强大的资源。它还需要提供某种程度的冗余，以处理计算节点故障，并在数千个节点上扩展数百个作业。此外，它应该支持用于汇总不同地点多台机器的钩子（hooks）。\n\
    \n## 作业调度器/策略管理器\n\n作业调度器从资源管理器获取节点和作业信息并生成一个列表。该列表由作业调度器排序，并告诉资源管理器何时以及何处运行每个作业。\n\
    \n策略管理器必须具备灵活性，以裁定定义公平份额环境所需的可能复杂的参数集，同时又要保持表达的简单性，以便系统管理员实施由政策驱动的资源分配。\n\n有关资源管理器和作业调度器/策略管理器的更多信息，请参阅\
    \ Linux 集群上的可移植批处理调度器和 Maui 调度器，地址如下：\n\nhttp://www.scl.ameslab.gov/Publications/HalsteadPubs/usenix_2k.pdf\n\
    \n## 组件概述\n\n在第 2 章第 11 页的“通用集群架构”中，我们讨论了关于 Linux 集群的理论和通用架构。现在我们列出并描述组成 IBM @server\
    \ xSeries Linux 解决方案的组件。\n\n在这个阶段，花时间根据你的环境和需求选择合适的组件来构建集群是值得的。我们将组件概述的这部分分为以下主题：\n\
    \n- 硬件\n  - 节点 (xSeries)\n  - 管理 (ASM/SPN, ELS 和 KVM)\n  - 网络 (FE, GE 和 Myrinet)\n\
    - 软件\n  - 操作系统 (Linux、文件系统和驱动程序)\n  - 系统管理 (xCAT 和 IBM Director)\n  - 开发 (编译器、库和调试器)\n\
    \  - 资源管理 (批处理系统和调度器)\n\n## 3.1 硬件\n\nIBM 集群产品构建在 xSeries x330 和 x340 平台上。在本章中，我们将讨论用于构建\
    \ IBM @server xSeries Linux 集群解决方案的所有硬件组件和技术，从节点架构和组件开始。\n\n### 3.1.1 主节点\n\n\
    主节点（Head node）是一个已经使用了一段时间的通用术语。我们实际上正尝试放弃这个术语，因为它描述性不够。然而，作为一个通用术语，它是非常合适的。\n\
    \n正如第 2 章第 11 页“通用集群架构”所示，主节点通常提供以下一个或多个功能：\n\n- 用户节点和控制节点\n- 管理节点\n- 存储节点\n\n\
    主节点或多个节点通常使用 x340 构建，也称为 4500R。在小型集群（例如八个计算节点）中，所有功能可以合并在一个主节点中。在较大的集群中，出于安全和性能考虑，功能可能会分散到多台机器上。集群的控制从一个或多个主节点执行。\n\
    \nx340 的配置与计算节点类似，但带有额外的高可用特性，例如热插拔、冗余电源和 ServerRAID 适配器。我们通常配置 x340 硬件 RAID 5\
    \ 阵列，由六个 18 GB 薄型驱动器组成，提供 90 GB 的可用存储。IBM ServerRAID 适配器支持 Linux，包括 Linux 内核中\
    \ IBM 编写的通用公共许可证 (GPL)、用于创建和管理 RAID 阵列的原生 Linux Server RAID Manager 工具、监控并发送警报的\
    \ SNMP 代理、客户端-服务器远程管理代理，以及允许自动化管理的命令行实用程序。\n\nx340 在机架中占用一个空间。它有两个 CPU 和双插槽内存模块（DIMM），以及板载服务处理器，允许通过脚本进行远程管理。\n\
    \n### 3.1.2 计算节点\n\n计算节点构成了集群的核心。用户、控制、管理和存储节点都是为支持计算节点设计的。计算都在计算节点上完成。这些节点将根据作业的需求并由作业调度器进行逻辑分组。计算节点通常使用\
    \ x330 构建。\n\nx330 在 1U 规格内具有双 Pentium® III 处理器、133 MHz 前端总线、两个 64 位 PCI 插槽以及一个板载服务处理器。64\
    \ 位 PCI 插槽允许服务器利用 Myrinet 2000 的带宽能力。\n\nx330 在机架中仅占用一个单元（1U）。在 1U 空间内，我们有两个硬盘、两个\
    \ CPU、四个 DIMM 内存插槽（允许 4 GB 内存）和两个 PCI 插槽。这是一个典型的计算节点配置。\n\n### 3.1.3 管理\n\n在查看集群的软件元素之前，我们需要讨论用于管理集群的硬件组件。\n\
    \n集群管理始于我们控制机器的能力。显然，可以走过去按下电源开关来关闭所有机器。然而，这通常并不可，而且对于某些任务，需要更高别的控制。有三个组件帮助我们处理问题：\n\
    \n- 终端服务器\n- ASM/SPN 网络\n- KVM 切换器\n\n#### 终端服务器\n\n终端服务器是一种通过一个网络连接将许多终端连接到局域网\
    \ (LAN) 的设备。它为网络上的串口设备和打印机提供串口连接。\n\n我们建议在集群中使用终端服务器，原因有两个：\n\n- 在无法通过 LAN 访问时可以访问集群机器。例如，LAN\
    \ 可能正在维护。\n- 介质访问控制 (MAC) 地址收集。如果你没有具备此功能的二层交换机，Equinox 终端服务器可能让你获取安装节点的 MAC 地址。\n"
