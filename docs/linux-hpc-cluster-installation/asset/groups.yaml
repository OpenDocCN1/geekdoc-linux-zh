    ## asma.tab


    This table describes which paths the xCAT commands have to follow to communicate
    with the service processor of each node.


    The table gives, for each node, the ASMA card and the valid service processor
    name. The description of the table is given in Example B-5.


    Example: B-5 Description of asma.tab


    | NodeName | AsmaCardName, SvcProcName |

    |---|---|


    Table B-7 gives the definitions of the asma.tab parameters.


    Table B-7 Definitions of asma.tab parameters


    | Parameter | Description | Possible values |

    |---|---|---|

    | NodeName | This is the node name, based on the name convention used in the cluster.
    | nodeX, where X is the node number; node is not mandatory; it can be changed
    to whatever you want, as long as it begins with non-numeric characters. |

    | AsmaCardName | The IP host name of the ASMA card to which this node is attached.
    | The value should be the alias of the asma card, as described in the /etc/hosts
    file. |

    | SvcProcName | The service processor name of the node. | The nodes are automatically
    configured so that it is the same as the NodeName. |


    This table will be generated by the getmacs script. It contains one line per node
    and describes the MAC address used for each node.


    Do not edit this file yourself.


    Example B-6 has a description of the mac.tab table.


    Example: B-6 Description of mac.tab table


    | NodeName | MacAddressMgtCard |

    | --- | --- |


    Table B-8 gives the definitions of the mac.tab parameters.


    Table B-8 Definitions of mac.tab parameters


    | Parameter | Description | Possible values |

    | --- | --- | --- |

    | NodeName | This is the node name, based on the name convention used in the cluster.
    | nodeX, X is the node number. node is not mandatory; it can be changed to whatever
    you want, as it begins with non-numeric characters. |

    | MacAddressMgtCard | The MAC address of the management ethernet adapter (eth0)
    in the node. | The card''s MAC address. |


    ## passwd.tab


    This table is used during the installation process and to perform operations on
    the nodes, like power off or power on, through the ASMA card. It contains two
    fields: the text we are waiting for, and what we have to type in.


    Example B-7 has a description of the passwd.tab table.


    *Example: B-7 Description of passwd.tab table*


    PasswordNeeded PasswordValue


    Table B-9 gives the definition of the passwd.tab parameters.


    **Table B-9** Definitions of passwd.tab parameters


    | Parameter | Description | Possible values |

    | --- | --- | --- |

    | PasswordNeeded | This field describes the value we are looking for when we have
    to type in a password. | Values for this field are not defined because they depend
    on your hardware, but you need to at least one line for the connection to the
    node.<br><br>For the connection to the node, you need this line: rootpw<br><br>If
    you use ASMA and/or ASM hardware, you need to put two lines in this file: asmauser
    asmapass<br><br>If you use Cisco products, you should have a line: cisco |

    | PasswordValue | This field contains the value you need to type in when a password
    is asked. | Again, the content of this field will depend on the value used to
    install the hardware.<br><br>By default, for the ASMA/ASM hardware, the values
    for asmauser and asmapass are:<br>USERID<br>PASSWORD<br><br>The value for the
    rootpw is the password you select during the Red Hat installation process. |


    ## apc.tab


    This table gives the xCAT commands the ability to power on or power off some equipment
    not controlled by the ASMA/ASM card (network switch, Equinox, Myrinet switch,
    and so on). It works in conjunction with APC MasterSwitch to control the electrical
    power on specified hardware.


    If your nodes are not using the ASMA hardware but they are connected to an APC
    MasterSwitch, then you are still able to control them via this table.


    Example B-8 contains a description of the apc.tab table.


    Example: B-8 Description of apc.tab table


    | Equipment | ApcToUse,1,ApcPortNumber |

    | --- | --- |


    Table B-10 gives the definitions of the apc.tab parameters.


    Table B-10 Definitions of apc.tab parameters


    | Parameter | Description | Possible values |

    | --- | --- | --- |

    | Equipment | This is the name used with the **rpower** or **reset** commands.
    | The name should be compliant with the name convention before. For the node,
    or a network router, it can be the following: nodeXrouterY<br>Where X,Y represent
    the node or router number. |

    | ApcToUse | This field is the alias which has been chosen in the /etc/hosts table
    for this hardware. | Insert the alias for the APC MasterSwitch, For example: apc1
    |

    | ApcPortNumber | This field contains the port number where the equipment is plugged
    in. | Insert the port number that controls the equipment. |


    ## POVay


    To test and demonstrate the power of the cluster, we decided to use a program
    called POVay (Persistence of Vision). It is a powerful rendering application,
    it is free, and the source code is distributed.


    This appendix describes how to install and execute POVay program and it is structured
    as follows:


    - POVay Install and Patch

    - POVay test with TCP/IP

    - POVay test with MYRINET


    ## POVay Installation


    To make POVay "aware," we patch the source code using mpip patch and then compile
    it. The patch enables POVay to operate parallel to MPI.


    ### Downloads


    - Download the POVRay source code: http://www.povray.org/binaries/linux.html Download
    the files pov_s.tgz and pov_d.tgz. The size of the files is under 1 MB each.

    - Download the mpip patch: http://www.verall.demon.co.uk/mpip/ Download the file
    mpi-povray-1.0.gz. The size of the file is about 127 KB


    ### Install


    To install POVay, use these commands:


    ```bash

    cp "Path to POVRay Download Dir"/pov_* /usr/local

    cd /usr/local

    tar xzv pov_s.tgz

    tar xzv pov_d.tgz

    cd povray31

    cp "Path to POVRay Download Dir"/mpi-povray-1.0.gz

    gunzip mpi-povray-1.0.gz

    cat mpi-povray-1.0.patch | patch -p

    cd source/mpi-unix

    ```


    > Note: You might need to add the path to mpic to the $PATH variable. In our case,
    mpic needs in /usr/local/mpich/1.2.1/smp/gnu/bin/, so you would use the commands:


    ```bash

    export PATH=/usr/local/mpich/1.2.1/smp/gnu/bin:$PATH

    make new

    Edit povray.ini line : Library path to match the correct path.

    ```


    ## POVay using TCP/IP and GCC


    ### TEST


    1. Find a couple of .pov files to be rendered from /usr/local/povray31/scenes/advanced/,
    for example, skyvase.pov and chess2.pov.

    2. Copy them to /home/ibm/, or /root, or any directory that is accessible from
    all nodes. Another option is to use the actual NFS shared/mounted /usr/local/
    directory, and then launch the mpi-x-povray. This is what we have done in our
    lab:

    3. Check which mpir you are running. This is found on the first path; fix the
    path accordingly. do not want to run the wrong mpir, such as the one that is compiled
    to support TCP/IP or MPI. This is what we have done in our lab:


    ```bash

    ps all cp /usr/local/povray31/scenes/advanced/skyvase.pov /root

    cp /usr/local/povray31/scenes/advanced/skyvase.pov /root

    ```


    ```bash

    cd

    mpir -np 6 /usr/local/povray31/source/mpi-unix/mpi-x-povray -I/root/chess2.pov
    v1 +ft-x +mb25 +a0.300 +j1.000 +r3 -q9 -w640 -H480 -S1 -E480 -k.000 -mv2.0 +b1000
    +L/usr/local/povray31/include/+Nh128 +NW128

    ```


