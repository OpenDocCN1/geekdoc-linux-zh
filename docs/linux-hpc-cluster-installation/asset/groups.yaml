    在不使用 KVM 交换机的情况下，下一种备选方案是使用崩溃车（crash cart）。在这种环境中，键盘、鼠标和视频显示器被放置在一个带轮子的推车上。需要时，将推车推到目标节点并连接到相应的端口以提供
    KVM 功能。随着带有内置 KVM 功能的 x330 开发，对崩溃车的需求在很大程度上已经消除了。


    ## 3.1.4 网络


    集群中的网络通常需要高带宽、高速度和低延迟。最密集的通信发生在计算节点之间。本节介绍了用于构建集群解决方案的协议和技术。


    ### 快速以太网 (Fast Ethernet)


    快速以太网和 TCP/IP 是广泛用于网络化的两种标准。它们简单且具有效益，而且技术在不断改进。


    快速以太网与基于 200 MHz Intel Pentium Pro 的机器工作（用于 Beowulf 节点），并可以在半双工或全双工模式下运行。全双工下，数据可以同时发送和接收。


    全双工传输部署在两个交换机的端口之间、计算机与交换机端口之间或两台计算机之间。全双工需要交换机；集线器（hub）无效。


    ### 千兆以太网 (Gigabit Ethernet)


    千兆以太网使用美国国家标准协会 (ANSI) X3T11 光纤标准物理层 (FC-0) 的修改版本来实现每秒千兆带宽。


    千兆以太网支持多模和单模光纤以及短距离铜缆。光纤是交换机和服务器之间连接的理想选择，且距离比铜缆远。


    研究人员观察到最大的开销是 CPU、内存与直接连接到 I/O 子系统之间通信所需的时间，而且这种通信时间在 Beowulf 集群中可能会指数级增长。


    随着 PCI 总线能力的提高，千兆以太网介质在 Beowulf 集群中是可用的，因为它可以提供更多带宽。然而，此时瓶颈变成了用于通信的协议。


    某些并行库（如局域网多计算 LAM 和 MPICH）使用传输控制协议/用户数据报协议 (TCP/UDP) 套接接口在集群节点之间通信消息。尽管人们付出了巨大努力来减少处理传输控制协议/网际协议
    (TCP/IP) 栈时产生的开销，但这仍然影响性能的因素之一。


    有关此主题的更多信息，请参阅《The Failure of TCP in High-Performance Computing Grid》，地址：http://www.sc2000.org/techpapr/papers/pap.pap174.pdf


    因此，需要开发新东西。例如，目前我们使用 Giganet 使用的虚拟接口架构 (VIA)。


    ### 虚拟接口架构 (VIA)


    VIA 是一种跳过协议栈层级并避免中间拷贝的机制。VIA 基于两个接口：


    - 软件

    - 硬件


    VIA 适用于网卡 (NIC)。MPICH 的新版本是使用 VIA 创建。


    ## Myrinet 和 GM


    Myrinet 是一种为低延迟设计的 {交换技术。GM 是用于 Myrinet 的消息传递系统，并取代了 API。Myrinet 的特性包括：


    - 全双工链路

    - 流控制

    - 低延迟

    - 高可用性


    GM 软件包基于驱动程序、API 和库等组件。Myricom 的 Myrinet 支持以开源形式发布。请参考 Myricom 网站 http://www.myri.com
    获取更多信息。


    ## 3.2 软件


    为了构建运行集群，您需要多个软件组件，包括操作系统、驱动程序、库、编译器和管理工具。本节介绍了用于构建 IBM Linux 集群的软件产品。


    ### 3.2.1 操作系统


    Linux 是主要用于 Beowulf 集群的基于 Unix 的操作系统。Beowulf 软件和驱动不断演进，因此需要开源操作系统。


    我们在集群中使用 Red Hat 6.2，因为许多库和工具都是在该版本编写和测试的。


    ### 安装


    安装软件负责计算节点的安装操作。我们的解决方案是使用预执行环境 (PXE) 进行远程引导，并使用 Kickstart 进行安装。未来可能可以使用 ALICE（自动
    Linux 安装和配置环境）代替 Kickstart。


    ### PXELinux


    PXELinux 是一个使用与 Intel 预执行环境 (PXE) 规范兼容的启动 从 网络服务器引导的程序。它允许在实际加载内核之前对引导过程进行某种控制。使用
    PXE，更具体地说是 PXELinux，我们可以从管理节点控制引导过程。如果不需要任何更改，只需告诉 PXELinux 从硬盘启动。然而，如果我们想从头重新加载节点，可以告诉节点从网络引导。如果我们想重建一个或所有节点，可以使用
    Red Hat Kickstart 提供节点的自动化安装。


    PXELinux 是 syslinux 的一部分，地址为：


    ```

    ftp.kernel.org

    ```


    ### Red Hat Kickstart


    Kickstart 是由 Red Hat 开发的系统安装和自定义程序。它允许客户端（作为计算节点）通过服务器进行完全安装，而无需人工交互。xCAT 在安装节点时配置并调用
    KickStart。


