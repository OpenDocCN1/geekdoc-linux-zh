    # 5.4 ASMA card setup


    For the nodes that contain an ASMA card, you need to take the following steps,
    using the SPN floppy disk (the same as the firmware upgrade disk). Once you have
    booted from this floppy disk, select Configuration Settings -> Systems Management
    Adapter and apply the following changes:


    +   - General Settings

    - Set name to mgmasX (for example, mgmasma1).

    - Set name to 1000 + X (for example, 1001 for the first node having an ASMA card
    inside).

    - Set systems management processor clock (time and date).


    +   - SNMP Settings

    - Enable SNMP agent.

    - Enable SNMP traps.

    - Fill in system contact (for example, admin).

    - Fill in system location (for example, CR for computer name).

    - Fill in community name (for example, public).

    - Give community IP address (for example, the machine to send alerts to 192.168.2.254).


    +   - Network Settings

    - Enable network interface.

    - Set host name to mgmasX (for example, mgmasma1).

    - Give local IP address for ASMA network interface (for example, 192.168.2.1).

    - Provide subnet mask (for example, 255.255.255.0).


    Unless you need to integrate your Linux cluster into an already existing network
    management protocol (SNMP) environment, the contact, location, and community names
    are up to you. Otherwise, ask your SNMP administrator for the correct names that
    match your environment. In this case, you will be given a different/or additional
    IP address to enter for the ASMA card. Our default setup will just send all events
    through SNMP to the management node, which runs a single SNMP catching daemon
    logging all SNMP events in /var/log/messages. For further details, logging see
    Chapter 6, "Management node installation" on page 85.


    Future versions of xCAT may include tools to automate the SPN and ASMA setup,
    requiring less manual interaction.'
