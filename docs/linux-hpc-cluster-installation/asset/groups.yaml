    ## 7.2 Configure cluster services


    Once you have configured xCAT, you must configure the services it relies upon
    to perform the installation. Most of these can now be automatically set up based
    on the information you just provided.


    ### 7.2.1 xntpd


    In order to keep the clocks in sync in the cluster, we install a time server (xntpd)
    on the management node. If you have another time source, you might want to configure
    xntpd on the management node to sync to this. It is only important that the clocks
    are the same on all nodes, not that they tell the correct time. If you have no
    external time source, the default Red Hat configuration should work fine. To start
    the service, use the command:


    ```

    # /etc/rc.d/init.d/xntpd start

    # /sbin/chkconfig xntpd on

    ```


    ### 7.2.2 Domain name system (DNS)


    Name server setup is likely to be very site-specific. If you plan to use real
    names for all the nodes in the cluster, it is important that you discuss with
    your network administrator how the nameserver will be configured and whether you
    should run the nameserver on the management node or not. Such details are beyond
    the scope of this redbook.


    xCAT requires that the nameserver be able to resolve the addresses of the nodes
    in the cluster. If you know how, you may choose to configure the nameserver to
    resolve addresses both within and without the cluster. Again, that is beyond the
    scope of this redbook. If you decide to configure your nameserver for all addresses,
    note that makedns generates the nameserver configuration file, named named.conf.
    It is recommended that you run makedns first and only perform local customization.


    If you have correctly set your /etc/hosts and site.tab, configuring the nameserver
    for the cluster addresses should be a case of running makedns:


    ```

    # /usr/local/xcat/sbin/makedns

    ```


    makedns will restart your nameserver as part of its run. Verify that it worked
    by querying your local nameserver for addresses that are part of your cluster
    both by name and IP address. In Example 7-7, we use the host command to query
    the local nameserver (0 is more efficient than connecting to localhost).


    ```

    Example 7-7 Host command to query the local nameserver

    [root@master]# host node1.cluster.austin.ibm.com 0

    Using domain server 0.0.0.0:

    node1.cluster.austin.ibm.com has address 192.168.0.1

    nodel1.cluster.austin.ibm.com mail is handled (pri=10) by

    nodel1.cluster.austin.ibm.com

    [root@root ~] host 192.168.0.1 0

    Using domain server 0.0.0.0:

    1.168.192.IN-ADDR.ARPA domain name node1.cluster.austin.ibm

    ```


    If the above test failed, go back and check syslog (/var/log/messages) for any
    errors from the nameserver and verify the db. files makedns created in /etc. You
    may have an error in either site.tab or /etc/hosts.


    ### 7.2.3 User ID/Network Information System (NIS)


    For job scheduling purposes, it is important that the user IDs from any user nodes
    are replicated across the cluster. xCAT includes support for NIS, although this
    support has been shown to suffer from scaling problems in larger clusters. The
    recommended way to distribute user IDs across the cluster is to copy /etc/passwd
    and /etc/group from the user node to all compute nodes. Note that /etc/shadow
    should not be copied, since this would allow the users to login to the compute
    nodes; only the user IDs need be present to run batch jobs.


    If you wish to use NIS you should set it now according to your site environment.
    Otherwise, you should use pcp to copy the files once you have set up the user
    node.


    ### Network file system (NFS)


    NFS is used in the cluster for the Kickstart install and distribute home directories.
    To make these processes work, we must add certain directories to the export list
    contained in /etc/exports. The configuration from our cluster is shown in Example
    7-8; there there must be no spaces between the address and the options.


    Example 7-8 /etc/exports


    ```

    /install/rh62 192.168.0.0/255.255.255.0(ro,no_root_squash)

    /install/post 192.168.0.0/255.255.255.0(ro,no_root_squash)

    /usr/local 192.168.0.0/255.255.255.0(ro,no_root_squash)

    /home 192.168.0.0/255.255.255.0(rw)

    ```


    You can also specify, by host name, if your network is non-contiguous, although
    this has a small performance penalty. For example:


    ```

    # /home node*(rw)

    ```


    Once you have modified /etc/exports, start NFS with the command:


    ```

    # /etc/rc.d/init.d/nfs start

    ```


    Verify the file systems have been correctly exported by querying the NFS server,
    as shown in Example 7-9.


    ```

    Example 7-9 Output of showmount -e

    [root@master ~] showmount -e

    Export list for master:

    /home 192.168.0.0/255.255.255.0

    /usr/local 192.168.0.0/255.255.255.0

    /install/post 192.168.0.0/255.255.255.0

    /install/rh62 192.168.0.0/255.255.255.0

    ```


    If the list does not match your /etc/exports, there is probably an error in the
    file. If the command fails, NFS is not working. Once NFS works, configure it to
    start at boot-time with the command:


    ```

    # /sbin/chkconfig nfs on

    ```


    ### 7.2.4 Dynamic Host Configuration (DHCP)


    DHCP can be automatically configured using gendcp script supplied with xCAT. Note
    that this script sets up an alias on cluster adapter. If you specified eth1 in
    site.tab, gendcp will create an alias eth1:0. Do not use this alias yourself or
    it will be overwritten.


    The gendcp command creates a skeleton of dhcpd.conf in /tmp:


    ```

    # gendcp

    ```


    The output from the script will suggest you edit dhcpd.conf by adding IP addresses
    for other devices, such as your Myrinet switch. Note: you need to remove unwanted
    entries. In our lab we found some unwanted entries were removed. To add an entry
    for a static host, you need to know the MAC address of the device. Make sure the
    entry matches your management network. An example of a static host is shown in
    Example 7-10.


    ```

    Example 7-10 subnet declaration for dhcpd.conf

    subnet declaration for management network

    subnet 192.168.2.0 mask 255.255.255.0 {

    Static host entry for Myrinet switch

    host myril {

    hardware ethernet 00:60:dd:7f:94:b0;

    fixed-address myril;

    }

    ```


    When you are are done editing dhcpd.conf, copy it to /etc and restart the DHCP
    server with the command:


    ```

    # cp -f /tmp/dhcpd.conf /etc

    # /etc/rc.d/init.d/dhcpd restart

    ```


    If there is an error in dhcpd.conf, the server will fail to start and produce
    an error message. Check dhcpd.conf and your site.tab and re-run gendcp if necessary.
    Also check errors at /var/log/messages.


    Tip: An alternative to avoid having DHCP offer and assign IP addresses in all
    interfaces (eth0, eth1...) is to modify the dhcpd script by adding the interface
    name in the dhcpd startup. The script is located at /etc/rc.d/dhcpd. For example:


    ```

    # Start daemons.

    echo -n "Starting dhcpd: " daemon /sbin/dhcpd eth1

    ```


    ## 7.3 Collect MAC addresses


    Once the DHCP server has been set up, we are almost ready to collect the MAC addresses
    of the nodes. Two scripts must be run before we do the collection:


    - # /usr/local/xcat/stage/mkstage

    - # /usr/local/xcat/ks62/mks


    Part of the work these scripts do is validation. If they report missing files
    or similar errors, it probably means you have missed a step of the installation
    process. Their main task is to create various files in /tboot from the remote
    boot process.


    If mkstage and mkks run OK, it is to collect the MAC addresses. This is done using
    the getmacs script, as shown in Example 7-11.


    ```

    Example 7-11 Running getmacs

    [root@master /root]# cd /tmp

    [root@master /tmp]# /usr/local/xcat/sbin/getmacs all

    Please reset nodes: node node2 node3 node4

    Press [Enter] when ready...

    Saving output to mac.lst in current directory /tmp.

    ```

    node4 00:06:29:1F:28:CD

    node3 00:06:29:1F:6C:87

    node2 00:02:55:54:28:50

    node1 00:06:29:1F:29:69

    ```


    Edit mac.lst and merge with /usr/local/xcat/etc/mac.tab


    ```

    root@master #

    ```


    The getmacs script will prompt you to reset the nodes; right now, this has to
    be on the front panel, because the service processor network (SPN) is not yet
    set up. Power on or press the reset button on all the nodes you are collecting
    MAC addresses for and then press Enter.


    As it runs, getmacs outputs to the panel and to the mac.lst file. If no nodes
    report MAC NO, then you have successfully captured the addresses of all your nodes.
    Unfortunately, it is not uncommon for one or two nodes to fail. If this happens,
    you must run them again for the nodes that failed. Be sure and save your mac.lst
    somewhere before run them again, because it will overwrite your original file.
    Once you have the MAC addresses of all the nodes, merge them into a single file
    and copy this to mac.tab. This can be done with a text editor, or if you named
    your files with the mac.lst prefix, you can use the command:


    ```

    # grep -hv ''NO MAC'' mac.lst | sort > /usr/local/xcat/etc/mac.tab

    ```


    If the MAC address capture fails on all your nodes or you have persistent errors
    with a particular node, there are a number of things to check:


    - MAC address collection (depends on DHCP)

    - TFTP and the remote console facility and rcons


    The first place to look for clues is the console of the node; Pre-Execution Environment
    (PXE) produces very helpful error messages. If the node is actually booting Linux,
    you may need to use rcons to see all of the messages or look in /var/log/consoles.
    The other place to check (for most things) is the syslog output in /var/log/messages.


    > Important: At this point, if you still have problems collecting MAC addresses,
    we recommend you go back to the Section 6.4, "Additional software installation"
    on page 93 for help.

