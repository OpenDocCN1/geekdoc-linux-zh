- - '##'
  - 6.3 xCAT 安装
- - '##'
  - tar xvf xCAT-distribution.tgz -C /usr/local
- - '##'
  - mkdir /mnt/loop
- - '##'
  - mount -o loop /install/rh62/images/boot.img /mnt/loop
- - '##'
  - cp /mnt/loop/mlinux /usr/local/xcat/ks62/initrd.img
- - '##'
  - ummount /mnt/loop
- - '##'
  - cp /boot/mlinux-2.2.14-5.0 /usr/local/xcat/stage/mlinux
- - '##'
  - cp /usr/local/xcat/samples/xcat.sh /etc/profile.d/
- - '##'
  - chmod 755 /etc/profile.d/xcat.sh
- - '##'
  - patch -p0 -d /install/rh62 <usr/local/xcat/build/ks62.patch
- - '##'
  - cd /install/rh62/misc/src/anaconda/libfs
- - '##'
  - make newfypso
- - '##'
  - cp -fp newfypso /usr/local/xcat/* /etc/rc.d/
- - '##'
  - cp -r /usr/local/xcat/post /install/
- - '##'
  - /sbin/chkconfig snpt on
