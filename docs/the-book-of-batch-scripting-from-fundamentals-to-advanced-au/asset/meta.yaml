  - 3. 监控 Spawned.bat：最后，我们到了核心逻辑。另一个 timeout 命令 ❺ 根据我们的规范 sleep 10 秒，我们将这 10 秒加到
    totSleep 中，该变量代表等待启动的批处理文件完成所花费的时间。接下来，执行另一个与之前相似的 for 命令 ❻，但代码块寻找第一个令牌等于 cmd.exe，这表明进程仍在。如果是这样，并且评估下一个
    if 命令 ❼ 显示我们还没有睡眠够60 秒，则 goto 命令循环回 :WaitMore 标签 ❺。
