  \ GRUB 2。GRUB 2 选择、加载并运行内核。内核随后初始化文件系统和数据，之后运行 systemd。调用默认目标将系统带入运行状态。该循环可能会持续到关机或系统断电，这两者都会连接回通电以重新启动序列。</details>\n\
  \n图 1.1 传统的 Linux 启动过程步骤。返回文本。⏎\n\n### 1.4.2 systemd 与传统的系统重启或关机\n\n`systemd` 负责将系统从正常运行状态带到关机状态，或重启系统。实现系统关机或重启的相关的\
  \ `systemd` `systemctl` 命令及其选项，以及它们简要的功能，如 表 1.1 所示。通过可能目标状态从正常运行状态到关机状态的 `systemd`\
  \ 关机路径在 图 1.2 中描述。\n\n表 1.1 systemd systemctl 关机命令 返回文本。⏎\n\n| 命令 |  |\n| --- |\
  \ --- |\n| `systemctl halt` | 停止系统运行。 |\n| `systemctl poweroff` | 关闭系统电源。 |\n| `systemctl\
  \ reboot` | 重启系统。 |\n| `systemctl suspend` | 挂起系统。 |\n| `systemctl hibernate` |\
  \ 休眠系统。 |\n| `systemctl hybrid-sleep` | 将系统休眠并挂起。 |\n\n![一个 systemd 关机路径从关机或卸载目标开始，进入最终目标，并分支到重启、停止、kexec\
  \ 或关机服务。](img/fig1_2.jpg) <details id=\"kfig1_2\"><summary>图 1.2 详细描述</summary>\n\
  \nsystemd 关机过程始于关机目标（它与所有系统服务冲突）或卸载目标（它与文件系统冲突）。两者都指向最终目标。从那里开始，路径分支到不同的结果。一条路径调用带有\
  \ reboot 目标的 systemd reboot 服务，另一条调用带有 halt 目标的 systemd halt 服务，另一条调用带有 kexec 目标的\
  \ systemd kexec 服务，还有一条则调用带有 poweroff 目标的 systemd poweroff 服务。</details>\n\n图 1.2\
