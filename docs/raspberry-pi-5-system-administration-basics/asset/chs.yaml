  \ SSD。概述一种传统的维护策略：将 microSD 卡作为树莓派 5 操作系统或启动盘，并将用户数据文件存储在辅助介质上。建立一个连接和维护该介质上文件系统的框架，将其归类为存在于连接计算机的物理设备或虚拟介质（`NFSv4`、`iSCSI`）。此外是非传统的做法：连接并从\
  \ NVMe SSD 启动，并将整个文件系统存储在那里。\n6. 提供使用传统的命令行接口（CLI）通用命令来备份和存档系统文件及用户文件的策略。\n7. 更新和维护操作系统，并添加/升级/移除用户应用程序仓库软件，以增加功能并升级现有软件包。\n\
