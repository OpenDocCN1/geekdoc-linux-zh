  \ Thonny 的可用解释器列表中。\n\n如果 Thonny 的解释器选项中没有列出所需的 Python 版本，你需要在 Raspberry Pi 5 上先安装它才能进行选择。\n\
  \n#### 3.2.8.2 查找你的 Raspberry Pi 5 安装了什么版本的 Python 3.X\n\n了解 Raspberry 5 上已安装了哪些\
