  ### 3.4.4 使用 Python 进行多线程并发\n\n关于树莓派 5 操作系统（OS）如何以及为何这样运行的，你必须问自己的第一个问题是：鉴于现代计算机硬件资源有限且性能极其强大的特性，操作系统如何为所有系统用户最大化性能和效率？此外，用户程序（如\
  \ Python 3 脚本）又如何反映这种技术呢？\n\n树莓派 5 操作系统该问题的答案是：\n\n首先，通过将硬件（即 SoC CPU 及其核心、主内存和外围内存）分离到多个虚拟机中：简而言之，通过`virtualization`（虚拟化）。\n\
  \n然后，通过在这些虚拟机上`concurrently`（并发）地执行指令——这意味着并不是以任何特定的顺序，甚至可能是同时执行。\n\n最后，通过确保在文件系统中生成并存储的数据随时间推移是`persistent`（持久的）。\n\
  \nPython 3 作为一种创建用户程序和脚本的树莓派 5 软件工具，可以通过名为`threads`（线程）的机制以及线程对指令的并发执行来实现并发。这与 UNIX\
  \ 和 Linux 系统中使用线程进行系统编程非常相似。\n\n与 Linux 系统编程的并发机制类似，Python 3 线程让你能够在单个进程中并发地运行多个程序。当你在\
  \ Python 3 程序中创建一个或多个线程时，它们是并发执行的，相互独立，并且由于它们使用同一个进程的相同资源，它们之间可以共享信息。这些特性使得 Python\
  \ 3 线程在创建用于网络编程和 GUI 程序等 Python 3 应用时非常有用。\n\nPython 3 支持树莓派 5 操作系统上的线程，以及任何其他使用`POSIX\
  \ threads library (pthreads)`的系统。\n\n第 332 页 从 Python 3 性能的角度来看，线程通常`cannot`（无法）利用多处理器或多核处理器架构，即使是树莓派\
  \ 5 CPU 中使用的 ARM 架构也是如此。线程切换只能发生在 Python 3 解释器中单个字节码的执行之间。解释器检查线程切换的频率由`sys.setcheckinterval()`\
  \ 函数设置。默认情况下，解释器在执行了有限但规定的字节码指令后检查线程切换。\n\n解决这一僵局的许多方法之一是使用各种 Python 3 扩展模块。这些模块的涵盖范围超出了我们此处为初学者演示的范围，也不是初学者必须掌握的。但即使对于初学者，稍微熟悉\
  \ Python 3 线程也是有用的。\n\n#### 3.4.4.1 使用过程式/命令式编程的 Python 线程示例\n\n在本节提供的示例中，我们同时展示了\
  \ Python 3.11.2 中的 `_thread` 和 `threading` 模块。\n\n除非你绝对需要 Python 3 的 OOP 工具和能力（特别是在\
  \ `threading` 模块中），否则这种选择在很大程度上取决于程序员和编程团队的偏好以及他们的编程设计目标/方法论。我们还在第 3.4.5 节中涵盖了 `threading`\
  \ 模块提供的某些函数。\n\n**注意** 基础 `_thread` 模块并不一定要求你使用 OOP 编程！\n\n如果你习惯并希望完全使用过程式/命令式编程模型来结构化你的程序，那么使用它非常简单。过程式/命令式模型被\
  \ C 等编程语言使用。\n\n`_thread` 模块提供了用于处理共享全局数据空间的多个控制线程（也称为`lightweight processes`或`tasks`任务）的低级原语。对于同步，该模块的类和方法内部提供了简单的`locks`（也称为`mutexes`互斥锁）。\n\
  \n##### 3.4.4.1.1 _thread 函数参考\n\n由于基础 `_thread` 模块比后续小节中介绍的更高级的 `threading` 模块简单，因此我们先给出它的示例。该模块为你所在的平台上任何可用的线程系统提供了一个移植的接口：它的接口在任何安装了\
  \ `pthreads` POSIX 线程实现的系统上（包括 Linux 系统和其他系统）工作方式都是相同的。使用 Python 3 `_thread` 模块的\
  \ Python 3 脚本可以在不更改源代码的情况下在所有这些平台上运行。\n\n##### 3.4.4.1.2 页面示例\n\n我们的第一个示例允许你尝试一个部署了主\
  \ `_thread` 接口的脚本。\n\n示例 3.39 中的脚本使用 Way 2（脚本模式）将代码输入 Thonny 的脚本区域，并使用工具栏的运行图标运行。它启动了连续的、一次仅一个线程。每个新线程的创建都是通过在\
  \ Thonny Shell 区域的 Python 3 命令行输入一个按键触发的，然后按`<Enter>`，直到你在控制台中输入 `x` 然后按最后一次`<Enter>`\
