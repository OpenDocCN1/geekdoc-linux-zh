  \ 基础语法\n\n`ufw` 手页的摘要列表如下：第 170 页\n\n```\n*************************************************************************\n\
  ufw\n用途:\n      ufw 用于管理 Linux 防火墙，并为创建防火墙规则提供\n      一个易于使用的接口。规则使用如下所示的基本语法。\n\
  语法:\n      ufw [option[s]] [command] [rule[s]]\n输出: 输出/从端口/IP 地址或设备的新的、修改或删除的防火墙规则。\n\
  常用选项:\n--version            显示程序版本号并退出\n-h, --help          显示帮助信息并退出\n--dry-run\
  \            不修改任何内容，仅显示更改\n常用命令:\nenable              重新加载防火墙并设置启动时启用\ndisable\
  \             卸载防火墙并设置启动时禁用\nreload              重新加载规则\ndefault             更改默认连接策略\n\
  logging             切换并影响到 journalctl 的日志\nreset               禁用防火墙并重置为默认值\nstatus\
  \              显示防火墙和规则状态\nallow               添加有效的允许规则\ndeny                添加有效的拒绝规则\n\
  reject              添加有效的拒绝接受规则\nlimit               添加有效的限制规则\ndelete         \
  \     删除指定的有效规则\ninsert              将有效规则作为编号规则插入\n常用规则:\nufw allow 22        \
  \    允许到有效网卡上任意 IP 地址的 tcp 和 udp 端口 22\nufw deny proto tcp to any port 80      拒绝所有到\
  \ tcp 端口 80 的连接 \nufw allow in on enp2s0 to 192.168.0.6 proto tcp    允许通过 enp2s0\
  \ 网卡\n                                      到 IP 地址 192.168.0.6 \nufw limit ssh/tcp\
  \           允许对 ssh 进行速率限制以防止暴力攻击\nufw delete deny 80/tcp      删除拒绝端口 80 上 tcp 连接的规则\n\
  ufw delete 3\n*************************************************************************\n\
  ```\n\n### 1.15.6 持久化媒体安全\n\n系统管理员可以采取两种基本策略来保护持久化介质（如 SSD、USB 挂载介质），并加固系统结构。第 171\
  \ 页这些策略的实际技术与我们展示的其他系统任务很大重叠。重叠技术的一个示例是添加额外的媒体，或许使用 ZFS 为媒体提供冗余。这允许系统管理员隔离用户文件，从而能够更安全地访问。添加额外的媒体解决了管理员备份数据的责任。\n\
  \n第一种策略涉及提供额外的媒体，或现有媒体上的额外分区，以适应用户文件或树莓派 5 文件系统的其他组件。\n\n第二种策略是在这些额外分区或媒体上设计并实现文件和目录权限，以便通过各种形式的凭证实现身份验证。\n\
  \n#### 1.15.6.1 /home 的持久化媒体分配\n\n根据上面提供的推荐用户数据存储模型，你应该将所有用户目录所在的 `/home` 子目录放在独立的物理介质上。这是设计文件系统的传统的系统管理技术。当你在此媒体的格式化分区添加挂载选项时，可以执行以下操作：\n\
  \n*   设置 `nosuid` 选项以防止运行 SUID 和 SGID 权限的可执行程序。作为预防措施，需要 SUID 和 SGID 权限的程序不应存储在\
  \ `/home` 中。\n*   设置 `nodev` 选项，以便没有任何设备文件被识别。设备文件应存储在 `/dev`，而不是 `/home`。\n*  \
  \ 可选设置 `noexec` 选项，以便无法运行在 `/home` 中的任何执行程序。\n\n**本章练习**\n\n48. 你的老板要求你将系统中所有用户的家目录从基于\
  \ microSD 的启动系统介质上的默认位置迁移到同一台树莓派 5 的 NVMe SSD 安装上。请草拟一份详细计划说明你将如何操作，以迁移单个用户的迁移为例。画出实现迁移所需的所有命令，并成功删除该用户账户的旧\
  \ `/home` 目录。\n\n\n\n\n\n多程序模型要求进程（无论是由 shell 内建命令、外部命令、用户编写程序，还是任何使用 `fork`、`exec`\
  \ 或 `execve` 系统调用的系统程序生成的）在使用系统资源、其他进程、套接字或文件/节点（inodes）之前，必须对其凭据进行验证。\n\n通用 Linux\
  \ 系统为进程分配凭据，将进程与特定的用户和用户组相关联。在多用户和多程序系统中，这些凭据至关重要，因为它们决定了每个进程在用户空间和内核空间可以做什么或不能做什么，从而维护了每个用户个人数据的自主性和安全性，进一步确保了系统的稳定性。\n\
  \n凭据的应用位于进程数据结构以及进程尝试访问的共享资源中。这类似于锁中的钥匙和一组弹销。文件是系统上的关键资源。因此，在默认的 `ext4` 文件系统中，每个文件都由特定的用户所有，并属于一个用户组。文件所有者决定了对该文件允许的操作类型，并将所有者本人、文件用户组以及系统上的所有其他用户区分开来。当进程尝试使用文件时，Linux\
  \ 虚拟文件系统（VFS）始终会根据文件所有者建立的权限和进程凭据来验证访问是否允许。进程凭据和文件访问权限是集成且不可分割的。这种认证耦合基于我们在此之前详细介绍的文件权限形式。我们已经证明了\
  \ `chmod` 命令是向文件和目录授予这些权限的工具。\n\n### 1.15.7.1 基于文件权限的机制\n\n在基于文件的权限机制中，这些形式涉及管理文件和目录上的基本权限位，以及\
  \ SetUID（SUID）、SetGID（SGID）和粘滞位（sticky bit）权限。例如使用强制访问控制（DAC）对 `/usr/bin/passwd`\
  \ 和 `/usr/bin/sudo` 命令设置权限。这些文件每个都应该维护其 SUID 权限，如下文所示：\n\n```\n $ sudo ls -la /usr/bin/passwd\n\
  -rwsr-xr-x 1 root root 72048 Mar 23  2023 /usr/bin/passwd\n$ sudo ls -la /usr/bin/sudo\n\
  -rwsr-xr-x 1 root root 269312 Jun 27  2023 /usr/bin/sudo\n$\n```\n\n`passwd` 和 `sudo`\
  \ 命令是具备 SUID 能力的程序。尽管这些命令表面上是以 root 用户权限运行的，但非权限用户只能通过 `passwd` 命令更改自己的密码，并且只能通过\
  \ `sudo` 获得 root 权限——前提是他们在 `/etc/sudoers` 文件中被授予了相应权限！\n\n`find` 命令允许你搜索系统，查看系统中是否存在隐藏或其他不适当的\
  \ SUID 和 SGID 命令。以下是一个示例：\n\n```\n $ sudo find / -perm /6000 -ls\n   131733    \
  \       4 drwxrwsr-x    2 root     staff                          4096 Oct 31 04:04\
  \ /var/local\n   131735           4 drwxrwsr-x    2 root     mail              \
  \             4096 Nov 19 05:30 /var/mail\n   132592           4 drwxr-sr-x    3\
  \ root     systemd-journal               4096 Nov 19 05:43 /var/log/journal\n  \
  \ 280612           4 drwxr-sr-x    2 root     systemd-journal               4096\
  \ Mar  3 14:26 /var/log/journal...\n   130355           4 drwxr-s---      2 root\
  \     dip                            4096 Nov 19 05:33 /etc/ppp/peers\n   129824\
  \           4 drwxr-s---      2 root     dip                            4096 Nov\
  \ 19 05:33 /etc/ppp/peers\n```\n\n\n\n\n\n# 引言\n\n平台虚拟化是通过宿主机软件（虚拟机监控器）在任何给定的硬件上实现的，它为客户软件创建一个模拟计算机环境，即\
  \ `VM`。客户软件可以小到单个用户应用程序，也可以大到整个操作系统。客户软件的执行方式就像直接运行在物理硬件上一样。\n\n虚拟化带来了一些性能方面的劣势，包括运行虚拟机监控器所需的资源，以及与在非虚拟化宿主机物理机上运行应用程序相比，`VM`\
  \ 客户性能下降。与物理机相比，`VM` 更容易从外部控制和检查，且其配置更灵活。这在内核开发和操作系统教学中非常有用。可以根据需要实现新的 `VM`，而无需预先购买硬件。`VM`\
  \ 可以根据需要从一台物理机器移动到另一台。`VM` 客户内部的不可恢复故障不会损坏宿主机系统，因此没有崩溃主机系统的风险。\n\n## 虚拟化实现示例\n\n\
  - 运行宿主机操作系统不支持的一个或多个应用程序：运行所需客户操作系统的 `VM` 可以运行所需的应用程序，而无需修改宿主机操作系统。\n- 评估备操作系统：可以在\
  \ `VM` 中运行新的操作系统，而无需修改宿主机操作系统。\n- 服务器虚拟化：多个虚拟服务器（通常被称为“容器”）可以运行在单个物理服务器上，以更充分地利用物理服务器的硬件资源。这的云计算例子是亚马逊云服务弹性计算（`AWS\
  \ EC2`）虚拟机。\n- 复制特定环境：根据所使用的虚拟化软件，`VM` 可以被复制并安装在多个宿主机上，或者恢复到以前备份的系统状态。\n- 创建受保护环境：如果运行在\
  \ `VM` 上的客户操作系统发生了难以修复的损坏（例如测试时可能发生的情况），可以丢弃该 `VM` 而不损坏宿主机系统，并在下次使用干净的副本。\n\n##\
  \ 当代虚拟化技术\n\n主要的当代虚拟化技术如下：\n\n### 全虚拟化\n在全虚拟化中，`VM` 模拟了足够的硬件，允许一个完整的“客户”操作系统（专为相同的处理器指令集架构\
  \ `ISA` 设计）在隔离状态下运行。运行在 X86 `ISAs` 或 ARM 架构上的 Linux 系统的示例包括 `VirtualBox`、`Parallels\
  \ Workstation`、`Oracle VM`、`Virtual Server`、`Hyper-V`、`VMware Workstation` 和 `VMware`。\n\
  \n### 硬件辅助虚拟化\n在硬件辅助虚拟化中，硬件提供架构支持以辅助构建 `VMM` 并允许客户操作系统在隔离状态下运行。此类硬件的虚拟化平台包括 `KVM`、`VMware\
  \ Workstation`、`VMware Fusion`、`Hyper-V`、`Xen`、`Oracle VM server for SPARC` 和 `VirtualBox`。\n\
  \n### 部分虚拟化\n在部分虚拟化（包括地址空间虚拟化）中，`VM` 模拟了底层环境环境多个实例，特别是地址空间。\n\n### 半虚拟化\n在半虚拟化中，`VM`\
  \ 并不一定模拟硬件，而是（或额外）提供了一种特殊的应用程序接口 `API`，该接口只能通过修改“客户”操作系统使用。为了实现这一点，必须拥有“客户”操作系统的源代码。\n\
  \n### 操作系统级虚拟化\n在操作系统级虚拟化中，物理服务器在操作系统层面被虚拟化，允许多个隔离且安全的虚拟化服务器运行在单个物理服务器上。“客户”操作系统环境与宿主机系统共享同一个操作系统运行实例。因此，相同的操作系统内核也被用于实现“客户”环境，运行在给定“客户”环境中的应用程序将其视为一个独立的系统。在\
  \ Linux 中，示例包括 `LXC` 和 `LXD` 以及它们的派生管理系统 `Docker`。类似的专有衍生技术被 `AWS EC2`、`Google Cloud`\
  \ 和 `iCloud` 使用。\n\n## 虚拟环境的概念\n\n计算机程序和操作系统的虚拟环境可以简单地被认为是一个程序在其中自主运行的壳（shell）。正如我们之前所示的，在特定抽象层次上看观察操作系统的一部分之一，是操作系统呈现虚拟环境幻象的能力。多任务、多编程操作系统向所有用户呈现出这种幻象，即每个独立用户都在自己的独立计算机上自主工作（而实际上，许多人也可能在同一硬件平台上工作），这是操作系统虚拟化的基本底层方面。\n\
  \n在许多方面以及在其他某些抽象层次上，`systemd` 可以被认为是一个虚拟化程序。它虚拟化了 `Linux` 内核，并给你一种直接与之交互的幻象，而实际上你正在\
  \ `systemd` 环境中工作。这种看待 `systemd` “超级内核”以及 `Linux` 内核本身的方式，最重要的假设是这两个程序的功能是帮助在电源开启、系统运行或有必要关闭电源时维持硬件软件的稳定状态。在\
  \ `第 2 章` 中，我们对 `systemd` 及其操作提供了完整且详细的描述。\n\n在 `LXC/LXD` 容器中，任意不同的内核可以在一台宿主机上同时运行。这意味着对于\
  \ `LXC/LXD` 容器，你可以同时在一台机器上运行许多不同版本的操作系统。\n\n树莓派 5 OS 还有其他类似的虚拟化设施。`Docker` 是另一个容器应用程序套件，允许你“启动”磁盘空间占用轻量级的容器实例。这些轻量级\
  \ `Docker` 容器实例的典型示例是 Web 服务器软件 `nginx`。在磁盘空间占用方面，最轻量的设施是 `Docker` 容器，中量的是 `LXC/LXD`\
  \ 容器，重量级的是 `VirtualBox` 客户。\n\n`LXC/LXD` 和 `Docker` 都依赖命名空间系统 API 和 `clone()` 系统调用。我们在上面简要提到了命名空间。\n\
  \n### 1.16.1 虚拟化应用\n\n在系统管理背景下，`LXC/LXD` 容器的重要应用是提供一种系统安全措施。例如，使用 `LXC` 容器，可以在客户操作系统环境中隔离系统服务或应用程序，使其完全独立于宿主机操作系统。像\
  \ SSH 服务器这样的服务可以运行在 `LXC/LXD` 容器实例内部，任何侵入该服务器及其系统空间的内容都不会侵入宿主机操作系统。如果往返服务器的局域网或互联网流量以任何方式受到破坏，可以停止、重启甚至删除该服务器，而不影响宿主机操作系统。另一个例子是，如果在一个\
  \ `LXC/LXD` 容器实例中运行一个故障的、满是 bug 的应用程序，它可能会导致客户操作系统内核停止，而不以任何方式影响宿主机操作系统。这两个示例案例可能是维护虚拟环境最有用的方面，但还有其他方面。\n\
  \n此外，这些方法的另一个应用是允许你在单块硬件上使用和尝试不同的操作系统。你可以在一个“沙箱”中玩这些其他操作系统，沙箱与你的宿主机系统隔离，并与虚拟化环境*同时*访问该宿主机系统。\n\
  \n**本章练习**\n\n\n\n\n\n51. 什么是 KVM？它与本节中描述的虚拟化应用相比如何？哪种云系统部署了 KVM？请从虚拟化类型、虚拟机实例的大小、易用性以及虚拟机实例的执行速度等方面回答这个问题。并将这些\
  \ KVM 衡量标准与 LXC/LXD 容器以及 Google Cloud 和 Amazon EC2 实例进行比较。\n\n## 1.17 总结\n\n在本章中，我们采用“在做中学”的方法，在树莓派\
