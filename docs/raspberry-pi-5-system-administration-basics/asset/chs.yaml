  \ 状态的旧版等物。\n\n如果你想回到树莓派 5 的 GUI 界面，可以使用以下命令撤销第 3 步：\n\n```bash\n$ sudo systemctl\
  \ set-default graphical.target\n```\n\n然后重启。\n\n### 2.5.7 其他与其他 Target 单元配合的 systemctl\
  \ \n\n如上定义和所示，Target 是描述系统状态或同步点的单元文件。与其他单元一样，可以通过 `.target` 扩展名来识别。\n\nTarget 用于协调和将单元组合。\n\
  \n这使得系统进入某些所需状态，从而允许根据用例定义功能。例如，在配置为服务器且仅限文本 CUI 的硬件上运行树莓派 5 操作系统，就没有图形显示管理器或桌面环境的性能开销（这本质上是浪费资源）。\n\
  \nTarget 被用作协调点，使所需功能可用，允许系统管理员指定“里程碑”状态（该状态可能由许多相互依赖的 target 组成），而不是指定单个单元启动以产生该状态。\n\
  \nTarget 单元文件在内容配置中指定它们被 `WantedBy=` 或 `RequiredBy=` 某些单元文件，从而建立依赖关系。必须可用的单元可以使用\
  \ `Wants=`、`Requires=` 和 `After=` 指定来设定此条件，以指示特定的依赖关系。\n\n### 2.5.8 使用 Target 快捷方式\n\
  \n有可用的 Target  用于关键事件，例如关机或重启。`systemctl` 命令提供了更快速、更好的方法来允许执行这些关键事件。\n\n第 214 页要停止系统，你可以使用\
  \ `halt` 命令：\n\n```bash\n$ sudo systemctl halt\n```\n\n要启动完全关机，可以使用 `poweroff` 命令：\n\
  \n```bash\n$ sudo systemctl poweroff\n```\n\n可以使用 `reboot` 命令启动重启：\n\n```bash\n\
  $ sudo systemctl reboot\n```\n\n上述三个命令会向登录用户通知关键事件即将发生（这在多用户系统中非常重要，因为许多用户可能正在执行关键操作！），这是运行（某个程序）或隔离某个特定\
  \ target 无法做到的。\n\n***注意***\n\n普通的树莓派 5 操作系统命令将整合必要的操作以完成上述系统状态更改，以便它们能够与 systemd\
  \ 控制的状态更改正常工作。\n\n例如，一个可以实现此目的普通树莓派 5 操作系统命令，要重启系统只需输入：\n\n```bash\n$ sudo reboot\n\
  ```\n\n**章节练习**\n\n\n\n\n\n5. 你想从局域网或内网中的另一台机器 ssh 登录到新安装的树莓派 5 系统。当你尝试这样做时，会收到一条模糊的错误信息，拒绝你通过\
  \ ssh 访问该新机器。在查找错误原因时可能经历的众多调试场景中，你可以坐在新机器上使用单一的 `systemd` 命令来检查 `sshd` 守护进程是否运行，甚至是否已安装。然后从那里快速快捷地解决你的问题。上述章节中，哪一个\
  \ `systemd` 命令可以提供这种快捷的流程？\n\n## 2.6 其他重要的 systemd 命令\n\n如上所示，`systemctl` 命令会影响单元（Units）和目标（Targets）。但\
  \ systemd 还有其他重要的命令，可以控制许多系统功能。接下来的子章节将详细介绍其中一些其他重要的 systemd 命令的使用。\n\n### 2.6.1\
  \ Cgroups\n\nsystemd `cgroup`（控制组，control group）是一项由 systemd 管理的 Linux 内核功能，用于为进程组织并限制系统资源（CPU、内存、I/O\
  \ 等）。systemd 使用 cgroups 在服务单元（service units）内高效地跟踪、隔离和控制进程。\n\ncgroups 作为 systemd\
  \ 的一部分包含在 Linux 内核中，允许为你系统上的进程创建具有优先级且结构化的组。它们通过 systemd `systemctl` 命令调用。考虑到使用\
  \ cgroups 的各种方式，最重要的是目的是监控和控制树莓派 5 的操作系统资源。\n\nCgroup 的监控、评估和控制通过 systemd 单元文件进行。它可以是瞬时的（transient），也可以是持久的（persistent）。\n\
  \n`systemd-run` 命令用于创建并启动一个瞬态单元作为其自包含的 cgroup 模块，然后在该单元中运行树莓派 5 操作系统命令。\n\n要创建持久的\
  \ cgroups，有必要在 `/etc/systemd/system` 目录下为它们构建服务单元文件。该目录是 systemd 中用户安装和用户定义服务的标准位置。\n\
  \n本节的目的是提供 cgroup “树形结构”的图化描述，给出一些基本定义，进一步描述 cgroup 单元类型的结构，并说明它们的标准排列。我们还定义了 Linux\
  \ `namespaces`（命名空间），引导你查看命名空间创建系统编程示例，并提供进一步文档的来源供你探索。\n\n#### 2.6.1.1 系统资源控制的默认\
  \ Cgroup 层级结构\n\n首先，我们展示一张说明图表，你可以在自己的树莓派 5 操作系统上通过 `systemd-cgls` 命令获取它。以下是该命令在我们树莓派\
  \ 5 系统上的截断结果：\n\n```\n $ systemd-cgls\nControl group /:\nControl group /:\n-.slice\n\
  ├─user.slice\n│ └─user-1000.slice\n│    ├─user@1000.service\n│  ││ ├─app.slice\n\
  │  ││ │ ├─gvfs-goa-volume-monitor.service\n│  ││ │ │ └─1046 /usr/libexec/gvfs-goa-volume-monitor\n\
  │  ││ │ ├─pulseaudio.service\n│  ││ │ │ └─781 /usr/bin/pulseaudio --daemonize=no\
