  \n5.  3 + 2 + 1 – 5 + 4 % 2 – 1 / 4 + 6\n\n6.  百分号（`%`）是什么种运算符？\n\n\n\n\n\n```python\n\
  >>> print (\"Is it true that 3 + 1 < 5 - 7?\")\nIs it true that 3 + 1 < 5 - 7?\n\
  >>> print (3 + 1 < 5 - 7)\nFalse\n>>> print (\"Is it greater?\", 4 > -2)\nIs it\
  \ greater? True\n>>> print (\"Is it greater or equal?\", 4 >= -2)\nIs it greater\
  \ or equal? True\n>>> print (\"Is it less or equal?\", 4 <= -2)\nIs it less or equal?\
  \ False\n>>>\n```\n\n## 章节内练习\n\n7. 输入以下 Python 语句的结果是什么？为什么是这样？\n\n```python\n\
  >>> 5 + 7>= 6 <= 78 – 9\n>>> 5 + 7>= 6 >= 78 – 9\n>>> (5 + 7>= 6 >= 78 – 9)/8\n\
  >>> (5 + 7>= 6 >= 78 – 9)/–8\n```\n\n### 3.3.2 变量与命名规范\n\n像 Python 3 这样的高级语言语言的一个重要特性是提供了允许你引用计算对象的名称。该名称在任何感兴趣的特定计算环境中代表（或对应）对象可以取的值或多个值；因此它被称为“变量”。\n\
  \nPython 3 的变量名以及脚本文件名都可以包含字母、数字和下划线（`_`）字符，但必须以字母开头。如果你收到关于使用变量名的错误信息，它可能可能是 Python\
  \ 3 中的保留字或关键字。[表 3.4] 列出了在 Python 3 语句中不能用作变量名或脚本文件名的 31 个关键字。\n\n表 3.4 Python 3\
