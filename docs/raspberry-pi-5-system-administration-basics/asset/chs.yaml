  \ Python 解析器执行，无需重新编译。它包含了准备好供 `PVM` 执行的编译字节码指令。\n\n进入子目录 `__pycache__`，并确保你使用 `chmod\
  \ u+x first.cpython-311.pyc` 命令为该字节码文件赋予执行权限。\n\n3. 然后，在 Thonny 之外的 bash 终端中输入以下内容来执行字节码文件：\n\
  \n```\n$ python3 first.cpython-311.pyc\nCount for me, Python!\nI'm counting! 0\n\
  I'm counting! 1\nI'm counting! 2\nI'm counting! 3\nI'm counting! 4\nI'm done counting!\n\
  ```\n\n**注意**\n\nPython 解析器生成的字节码特定于你正在使用的 Python 版本，如字节码文件名末尾附加的 `311` 所示。因此，为特定版本的\
  \ Python 3 生成的字节码可能与较早版本的 Python 不兼容。\n\n### 3.2.7 Python 3 的用途\n\nPython 3 可以完成多种类型的编程任务，这些任务可以细分为以下示例类别：\n\
  \n* Shell 脚本编写\n* 系统编程\n* 网络和互联网脚本编写\n* 数据库编程\n* 系统管理脚本编写\n* 图形用户界面(GUI)脚本编写\n*\
  \ 科学与数学编程\n* 数据挖掘\n\n在本章中，我们在运行 Python 3 时主要使用方法 1–4（这些方法在所有示例中均可见），并在方便时使用方法 0，同时我们对\
  \ Python 3 语言进行了初学者级介绍。我们还遵循了第 3.2 节开头所示的层级模型，大致从方案的顶部向底部进行。\n\n### 3.2.8 Python\
  \ 安装信息\n\n在我们部署在 Pi 5 上的 Raspberry Pi 5 OS 上，已经安装了并可以使用 Python 3.11.2 版本。但是，你可能需要或想要在系统中安装更新版本的\
  \ Python 3，或者如果你想在安装现有版本的同时安装后来的软件，甚至替换系统已预装的版本。请注意，由于你或系统管理员安装系统的方式不同，以及所安装的 Raspberry\
  \ Pi 5 OS 具体版本不同，最新可用 Python 3 的安装程序可能已经由系统管理员为你完成了！类似情况的一个良 de 例子是，你没有可用的 C 编译器，或者你想升级到最新的\
  \ `gcc` 编译器，但不知道在有或没有包管理器的情况下如何操作！\n\n我们在下方提供了安装最新版 Thonny（编写此书时的可用版本）的安装说明。\n\n\
  #### 3.2.8.1 将 Thonny 切换到最新 Python\n\n要更改 Thonny 在你的 Raspberry Pi 上使用的 Python 版本，你需要正处于“常规模式”（Regular\
  \ Mode）。稍后若想切回“简单模式”（Simple Mode），请在常规模式下选择 `Tools > Options > General > UI mode\
  \ > simple`。请注意，你必须点击 Thonny 选项对话框中的 OK，然后重启 Thonny 才能回到简单模式！\n\n在常规模式下按照以下步骤切换到你在上一节中下载并安装的最新\
  \ Python：\n\n1. 在你的 Raspberry Pi 上打开 Thonny。点击 Thonny 栏最右角的“Switch to regular mode”（切换到常规模式）消息进入常规模式。你会看到一个消息框显示配置已更新，并提示重启\
  \ Thonny 以开始常规模式工作。点击 OK。\n2. 重启 Thonny 后，在顶部的菜单栏点击“Tools”（工具），然后选择“Options”（选项）。\n\
  3. 在“Options”对话框中，导航到“Interpreter”（解释器）标签页。\n4. 在“Interpreter”标签页下，你会看到可用 Python\
  \ 解析器的列表。此列表包含了安装在 Raspberry Pi 上的 Python 版本。\n5. 从列表中选择所需的 Python 版本。你可以从可用版本中选择，或点击“Browse”（浏览）按钮指定自定义的\
  \ Python 解析器。\n6. 选择所需的 Python 版本后，点击“OK”按钮保存更改。\n\nThonny 现在将使用选的 Python 版本作为运行和执行你的\
