  \ `multi-user.target`，使用组合命令 `systemctl list-units` 连接 `grep` 和 `egrep` 来检查单元的可用性和状态，最后使用\
  \ `who -r` 命令查找运行级别：\n\n   ```\n     $ sudo systemctl set-default multi-user.target\n\
  \    Removed symlink /etc/systemd/system/default.target.\n    Created symlink from\
