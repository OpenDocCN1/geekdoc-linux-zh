  \ `Filezilla`。 |\n\n#### 1.11.2 Linux GNU tar\n\nA Linux operating system, such\
  \ as the Raspberry Pi 5 OS, has several utilities that allow you to archive your\
  \ files and directories in a single file, and the `tar` command is the most popular,\
  \ widely used, and traditional method that allows you to do this.\n\n**注意**\n\n\
  当代 Linux 上的 `tar` 是 GNU 版本。\n\nThe `tar` (short for *带归档的卷*) utility was originally\
  \ designed to save file systems on tape as a backup, so that files could be recovered\
  \ in the event of a system crash. It is primarily used now to pack a directory hierarchy\
  \ as an ordinary disk file. That disk file can then be either saved for system backup\
  \ purposes locally or remotely, or transmitted to someone via the Internet. It is\
  \ also used commonly with a compression utility, such as `gzip`, via a command line\
  \ option. Doing so saves disk space and transmission time. The saving in disk space\
  \ results primarily from the fact that empty space within a cluster is not wasted.\
  \ A brief description of the `tar` utility follows.\n\nThe GNU version of `tar`\
  \ has some important functional features and incorporates a more friendly syntax,\
  \ than traditional UNIX `tar`. Therefore, for beginners we only show the “long form”\
  \ of the Gnu-style syntax because it's more intuitive, and easy to understand. Once\
  \ you get more familiar with `tar`, you may switch to the UNIX-style short form\
  \ at your discretion.\n\nSystem administrators normally use a cost-effective archival\
  \ medium for archiving complete file system structures as backups, so that when\
  \ a system crashes for some reason, files can be recovered.\n\nLinux-based computer\
  \ systems normally crash for reasons beyond the operating system's control, such\
  \ as a hardware failure or failure of the processor itself. The Raspberry Pi 5 OS\
  \ rarely causes a system to crash, because it's a well-designed, coded, and tested\
  \ operating system. In a typical commercial installation, backup is done every day\
  \ during off hours (late night or early morning) when the system is not normally\
  \ in use, with appreciable demand placed on it.\n\n下面给出 `tar` 命令的通用语法（采用 GNU 风格语法，而非传统\
  \ UNIX 风格）：\n\n```\n***********************************************************************\n\
  tar\n\nSyntax: tar [operation mode] [operation mode options] [FILE…]\n\nPurpose:\
  \ Archive (copy in a particular format) files to or, restore files from, an archival\
  \ medium (which can be an ordinary file). Directories are by default  archived and\
  \ restored recursively.\n\nOutput: Archived or restored files or directory structures.\n\
  \nMain Operations and Operation Options in Gnu-Style Usage:\n--append          \
  \ Append files to the end of an archive.\n--concatenate      Append an archive to\
  \ the end of another archive.\n--compare          Find differences between archive\
  \ and file system.           \n--create           Create a new tape and record archive\
  \ files on it\n--delete           Delete from the archive.\n--extract          Extract\
  \ files from an archive.\n--help             Display a short option summary.\n--list\
  \             List the contents of an archive.\n--show-defaults    Show built-in\
  \ defaults for options.\n--test-label       Test the archive volume label and then\
  \ exit.\n--update           Append files which are newer than the versions in an\
  \ archive.\n--usage            Display a list of available options.\n--version \
  \         Display program version and copyright information.\n\nCommon Options:\n\
  --preserve-permissions\n--acls\n--gzip\n--verbose\n--file ARCHIVE.\n\nCommand Arguments:\n\
  FILE…\n***********************************************************************\n\
  ```\n\n#### 1.11.2.1 使用 tar 归档和恢复文件\n\nA normal Raspberry Pi 5 OS can use `tar`\
  \ to pack and restore files. The primary reason for making an archive is the convenience\
  \ of dealing with a single file instead of several files. Without an archiving facility\
  \ such as `tar`, depending on the size of the files, the task of sending, receiving,\
  \ and reconstructing can be very time consuming.\n\nThere are other compression\
  \ facilities, such as `bzip2`, `gzip`, `gunzip`, `gzexe`, `xz`, `zcat`, and `zmore`\
  \ commands, and we must point out that compression saves disk space. But compressing\
  \ small files normally does not result in much compression, and storage space. Also,\
  \ compressing files of one in size (the minimum unit of storage, i.e., one or more\
  \ sectors) or less does not help save storage media, even if compression does result\
  \ in smaller files, because the system ends up using one cluster to save the compressed\
  \ file. But if compression does result in a smaller file, you do save time in transmitting.\
  \ If the disk block size is 512 bytes and a cluster consists of more than two blocks,\
  \ you can use the `tar` command to pack files together in one file, with a 512-byte\
  \ tar header at the beginning of each file, as shown in Figure 1.9.\n\n![显示文件如何在\
  \ tar 归档中存储的序列，每个文件前都有 tar 头。文件 1 后跟其 header，接着是文件 2，直到文件 N。](img/fig1_9.jpg)\n\n\
  图 1.9 Tar 打包文件。\n\n#### 1.11.2.2 八个简易的 tar 用法\n\n在本节中，我展示了 `tar` 命令的八种最简便用法。\n\n\
  1.  创建归档\n\n    这是创建归档文件的最简单的命令，从目录中创建。\n\n    ```\n     $ tar --create --verbose\
  \ --file archive_name.tar directory_name\n    ```\n\n    *   `--create` 是创建新归档的操作\n\
  \n    *   `--verbose` 是列出正在处理的文件的操作\n\n    *   `--file` 是指定文件 `archive_name.tar`\
  \ 为归档文件名称的操作，并且\n\n\n\n\n\n* `directory_name` 是你想要归档的目录。\n\n## 2. 创建归档并保留其 ACL 权限\n\
  \n创建归档的一种简单变体是使用选项来保留目录拥有的 ACL。ACL 在卷 1 中有详细介绍，包括 POSIX.1e 和 NFSv4 两种类型。\n\n```\n\
  $ tar --acls --create --verbose --file archive_name.tar directory_name\n```\n\n\
  其中：\n\n* `--acls` 是保留目录拥有的 ACL 的选项\n* `--create` 是创建新归档的操作\n* `--verbose` 是列出正在处理的文件的操作\n\
  * `--file` 是指定文件 `archive_name.tar` 为归档文件名的操作，以及\n* `directory_name` 是你想要归档的目录。\n\
  \n## 3. 提取归档\n\n这是从归档文件中提取目录的最简单命令。\n\n```\n$ tar --extract --verbose --file archive_name.tar\
  \ \n```\n\n其中：\n\n* `--extract` 是从归档文件中提取 `directory_name` 的操作\n* `--verbose` 是列出正在处理的文件的操作\n\
  * `--file` 是指定文件 `archive_name.tar` 为归档文件名的操作。\n\n在这种最形式的形式，从归档文件创建的目录将与归档文件名相同，但不包含\
  \ .tar 后缀。\n\n## 4. 提取归档并恢复其 ACL 条目\n\n提取归档的一种简单变体是使用选项来恢复归档文件拥有的保留 ACL（如果有）。\n\n\
  ```\n$ tar --acls --extract --verbose --file archive_name.tar\n```\n\n其中：\n\n* `--acls`\
  \ 是恢复归档文件拥有的保留 ACL 的选项\n* `--extract` 是提取归档文件的操作\n* `--verbose` 是列出正在处理的文件的操作\n\
  * `--file` 是指定文件 `archive_name.tar` 为归档文件名的操作\n\n在这种最简单的变体中，从归档文件创建的目录将与归档文件名相同，但不包含\
  \ .tar 后缀。\n\n## 5. 列出归档内容\n\n此过程允许你在不提取从中任何内容的情况下查看归档文件的内容。\n\n```\n$ tar --list\
  \ --verbose --file archive_name.tar\n```\n\n其中：\n\n* `--list` 是列出归档文件内容的操作\n* `--verbose`\
  \ 是列出正在处理的文件的操作\n* `--file` 是指定文件 `archive_name.tar` 为归档文件名的操作\n\n## 6. 从归档文件中提取单个文件\n\
  \n以下命令仅从归档文件中提取特定文件。\n\n```\n$ tar --extract --verbose --file archive_file.tar file_pathname\n\
  ```\n\n其中：\n\n* `--extract` 是提取单个文件的操作\n* `--verbose` 是列出正在处理的文件的操作\n* `--file`\
  \ 是指定文件 `archive_name.tar` 为你正在从中提取的归档文件名的操作，以及\n* `file_pathname` 是你想要在归档内部提取的文件的完整路径规范。\n\
  \n## 7. 从归档文件中提取单个目录\n\n从归档中仅提取单个文件的变体，若要提取单个目录（并递归提取其任何子目录和文件），请如下所示指定你想要提取的目录名：\n\
  \n```\n$ tar --extract --verbose --filef archive_file.tar directory_pathname\n```\n\
  \n其中：\n\n* `--extract` 是提取单个文件的操作\n* `--verbose` 是列出正在处理的文件的操作\n* `--file` 是指定文件\
  \ `archive_name.tar` 为你正在从中提取的归档文件名的操作，以及\n* `directory_pathname` 是你想要在归档内部提取的目录的完整路径规范。\n\
  \n## 8. 使用 append 选项向现有归档添加文件或目录\n\n要向现有归档添加文件，请执行以下操作：\n\n```\n$ tar –append --verbose\
  \ --file archive_name.tar file_or_directory_name\n```\n\n其中：\n\n* `--append` 是将单个文件或目录添加到归档的操作\n\
  * `--verbose` 是列出正在处理的文件或目录的操作\n* `--file` 是指定文件 `archive_name.tar` 为你正在其中添加文件或目录的归档文件名的操作，以及\n\
  * `file_or_directory_name` 是你想要在归档内部添加的文件或目录的完整路径规范。\n\n## 章末练习\n\n21.\n\n1. 参考上方显示的缩写\
  \ man 页面，或参考你 Raspberry Pi 5 系统上 `tar` 的 man 页面，给出一个可以创建一个名为 `zipest` 目录的 gzipped\
  \ 归档的命令。\n2. 给出一个将 gzipped 归档提取到另一个名为 `zipest` 的目录中的命令。\n\n## 1.1 rsync\n\n`rsync`\
  \ 命令是一种非常现代且节省空间的文件和目录备份方法，特别是通过网络使用 `ssh` 从一台机器传输到另一台机器。它的操作还可以通过使用 `systemd` 调度来实现。\n\
  \n它最重要且定义性的特性是它使用的数据传输“快速检查”算法，该算法减少了传输的数据量。这是通过发送源文件与相同目标文件（如果有）之间的差异来实现的。如果源和目标之间存在差异需要传输文件，则使用该算法进行复制或“同步”。该算法会查找大小或修改时间发生变化的文件。当快速检查指示目标文件需要更新时，其他可能的文件属性（如权限或\
  \ ACL）的更改将直接在目标文件上进行。\n\n`rsync` man 页面的简要摘要如下：\n\n```\n *********************************************************\n\
  rsync\nSyntax:\nLocal: rsync [OPTION...] SRC... [DEST]\nRemote:\n  via remote shell:\n\
  \    Pull mode: rsync [OPTION...] [USER@]HOST:SRC... [DEST]\n    Push mode: rsync\
  \ [OPTION...] SRC... [USER@]HOST:DEST\n  via rsync daemon:\n    Pull mode: rsync\
  \ [OPTION...] [USER@]HOST::SRC... [DEST]\n    rsync [OPTION...] rsync://[USER@]HOST[:PORT]/SRC...\
  \ [DEST]\n    Push mode: rsync [OPTION...] SRC... [USER@]HOST::DEST\n    rsync [OPTION...]\
  \ SRC... rsync://[USER@]HOST[:PORT]/DEST\n```\n\n\n\n\n\n```\n常用选项：\n-a, --archive\
  \             归档模式\n-A, --acls               保留 ACL（隐含 -p）\n--delete           \
  \        从目标目录中删除多余文件\n-e, --rsh=COMMAND         指定要使用的远程 shell\n--existing    \
  \             在接收端跳过创建新文件\n-h, --human-readable      以以人类可读的格式输出数字\n-H, --hard-links\
  \          保留硬链接\n-k, --copy-dirlinks       将指向目录的符号链接转换为引用的目录\n-K, --keep-dirlinks\
  \       将接收端上的符号链接目录视为普通目录\n-n, --dry-run             进行测试运行，不进行任何更改\n-p, --perms\
  \               保留权限\n-q, --quiet               静默非错误消息\n-r, --recursive       \
  \    递归进入目录\n--remove-source-files      发送端删除已同步的文件（非目录）\n-v, --verbose        \
  \     增加输出详细程度\n-z, --compress            在传输过程中压缩文件数据\n命令行参数：\nSRC  源文件或目录。\nDEST\
  \  目标路径。\n************************************************************************\n\
  ```\n\n### 1.12.1 rsync 示例\n\n我们在后续示例中做的基本假设之一是：源通常是一个随时间变化的文件对象，例如你通过向其或其子目录添加或删除文件来修改的目录。同样，目标是一个不变的文件对象，或者随时间固定的，例如当你进行归档备份时。当你使用归档工具时，通常此类如此，尽管正如你在上面通过\
  \ `tar` 命令看到的那样，归档（或目标）可以通过多种方式添加内容或从从中提取内容。\n\n**注意**\n\n第 129 页 我们不涵盖 `rsync`\
  \ 更复杂或更高级的用法。\n\n我们根据源和目标是否都在本地机器上，或者源或目标是否在远程机器上，对 `rsync` 示例进行了分类。示例也可以分为仅处理文件的示例，以及处理目录和文件的示例。\n\
  \n#### 本地示例\n\n1. 使用 `rsync` 从当前工作目录将名为 `rsynctest` 的单个文件复制到本地目标目录 `/home/bob/USBint`。文件以“归档”模式传输，使用命令的\
  \ `-a` 选项完成。\n\n   这确保了符号链接、设备、属性、权限、所有权等得以保留。\n\n```\n$ rsync -av rsynctest /home/bob/USBint\n\
  ```\n\n2. 以压缩格式复制单个本地文件，并以人类可读的格式显示操作反馈，从源文件 `backup.tar`（在当前工作目录）复制到你拥有权限的目标目录\
  \ `/home/bob/backup1`。\n\n```\n$ rsync -zvh backup.tar /home/bob/backup1\n```\n\n\
  3. 使用 `rsync` 将本地名为 `syncdir` 的整个的源目录内容复制到本地名为 `/usr/home/bob/USBint` 的目标目录。指定源末尾的斜杠意味着“复制此目录的内容”，而不是“按名称复制目录”。\n\
  \n```\n$ rsync -av syncdir/ /usr/home/bob/USBint\n```\n\n4. 以压缩格式复制单个源目录 `/home/bob/backups`，并以人类可读的格式显示操作反馈，到你拥有权限的目标目录\
  \ `/home/remote/backups/`。\n\n```\n$ rsync -avzh /home/bob/backups /home/remote/backups/\n\
  ```\n\n5. 以压缩格式将单个源目录 `/home/bob/backups` 及其文件和子目录复制到你拥有权限的目标目录 `/home/remote/backups`。\n\
  \n```\n$ rsync -zvr /home/bob/backups /home/remote/backups\n```\n\n6. 执行测试运行（dry-run），其中会删除源文件并压缩传输的文件。\n\
  \n```\n$ rsync --dry-run --remove-source-files -zvh backup.tar /tmp/backups/backup.tar\n\
  ```\n\n#### 远程示例\n\n7. 将名为 `Music` 的单个目录从本地机器复制到位于 `192.168.1.8` 的远程机器的 bob 的家目录。\n\
  \n```\n$ rsync -avz Music@192.168.1.8:/home/bob/\n```\n\n8. 使用 `ssh` 将名为 `syncdir2`\
  \ 的整个本地目录复制到位于 `192.168.0.7` 的远程机器，并进入 OS 风格的目录 `/Users/b/Linux3e`。\n\n```\n$ rsync\
  \ -av -e ssh syncdir2@192.168.0.7:/Users/b/Linux3e\n```\n\n9. 将远程目录复制到本地目录。\n\n\
  ```\n$ rsync -avzh root@192.168.0.100:/home/bob/backups /home/bob/temp\n```\n\n\
  10. 仅复制远程目录 `/home/bob/Linux2e` 的内容，使用 `--existing` 选项（有时称为“同步”）更新目标端已存在的文件。如果源有目标端不存在的新文件，则这些新文件不会被放入目标端。命令末尾的\
  \ `.` 表示目标，它翻译为当前工作目录。\n\n```\n$ rsync -avzh root@192.168.0.100:/home/bob/backups\
  \ /home/bob/temp\n```\n\n11. 使用 `ssh` 将名为 `backup.tar` 的单个本地文件复制到位于 `192.168.1.8`\
  \ 的远程机器。\n\n```\n$ rsync -avz backup.tar@192.168.1.8:/home/bob/\n```\n\n12. 仅复制远程目录\
  \ `/home/bob/Linux2e` 的内容，使用 `--existing` 选项（有时称为“同步”）更新目标端已存在的文件。如果源有目标端不存在的新文件，则这些新文件不会被放入目标端。命令末尾的\
  \ `.` 表示目标，它翻译为当前工作目录。\n\n```\n$ rsync -avz --existing bob@192.168.1.2:/home/bob/Linux2e/\n\
  ```\n\n13. 使用 `ssh` 将 `backup.tar` 复制到远程机器 `192.168.0.8`。\n\n```\n$ rsync -avzhe\
  \ backup.tar@192.168.0.8:/home/bob/backups/\n```\n\n14. 将 `/home/bob/files` 中的文件复制到\
  \ IP 地址为 `192.168.0.8` 的远程机器。使用 `--delete` 选项时，目标上不再存在于源的文件将被删除。`-v` 选项确保传输的内容会被输出。使用\
  \ `ssh` 连接端口 `32000`。\n\n```\n$ rsync -av --delete -e 'ssh -p 32000' /home/bob/files/\
  \ bob@192.168.0.8:/home/bob/files/\n```\n\n**章节练习**\n\n22. 在上述所有指向远程主机的示例中，我们做的基本假设是什么？\n\
  23. 在你的系统本地以及局域网远程执行上述所有 13 个示例，根据需要替换文件名、目录、账户名和 IP 地址。\n\n### 1.12.2 用于备份和恢复的脚本文件\n\
  \n用户编写的脚本文件可以由树莓派 OS 管理员部署，以便高效地执行备份和归档。无论是用 Python（或其他脚本语言）编写，还是使用嵌入了我们展示的任何命令行功能的\
  \ Shell 语言，都可以加速、促进和自动化文件、目录或整个文件系统的备份和恢复。\n\n此外，网上有许多可用的商业备份和归档脚本文件，但我们没有必要证明规划、编写或维护自己的脚本文件代码库优于使用在线现成的程序。\n\
  \n以下是一个使用 `tar` 传统应用的 Bash Shell 脚本文件示例。\n\n**章节练习**\n\n24. 使用 `systemd` 自动执行上述脚本文件所需的命令，以便在每天凌晨\
  \ 3 点运行 `backup.bash` 脚本。可以自由修改时间、天数以及源目标目录和文件，以便你可以使用该脚本文件备份树莓派 5 系统中重要的信息。\n25.\
  \ 你如何在另一个目录中“解压”用 `backup.bash` 创建的文件？\n\n### 1.12.3 用于备份和恢复的软件：FileZilla、SD 卡 Copier\
  \ 和 git\n\n\n\n\n有很多商业软件和硬件软件包可以部署用于备份和存档你的系统。一种非常易用的商业产品允许你通过网络以“广播”方式从服务器向一台或多台机器克隆整个硬盘，那就是\
  \ `Norton Ghost`。\n\n但最容易获取、有用且免费的软件工具是通过树莓派 5 操作系统菜单中的 `Preferences`（首好） > `Add/Remove\
  \ Software`（添加/删除软件）提供的，它可以执行各种文件系统备份与恢复、磁盘恢复以及磁盘克隆操作，这就是 `FileZilla`。\n\n此外，树莓派菜单菜单项\
  \ `Accessories`（附件） > `SD Card Copier`（SD 卡复制器）允许你克隆整个 microSD 卡，从而复制你在执行复制时系统/启动磁盘上的任何内容。诚然，这是一种用于恢复的暴力备份方法，但即使是将\
  \ microSD 卡复制到 USB2 或 USB3 挂载的 SSD 或或其他 USB 介质，它也是有效的。\n\n你还可以使用 `git` 命令和 `GitHub.com`\
  \ 来有效地备份用户文件。\n\n当然，如果你遵循了我们推荐的存储策略，将用户文件保存在启动/系统介质以外的介质上，那么无论你使用什么策略来对这些介质进行恢复或存档备份，都是适的。你可以组合并匹配我们在以下三个章节中展示的任何技术和工具，以适应你的需求以及所选数据存储模型的特定需求。\n\
  \n### 1.12.3.1 FileZilla\n\n`FileZilla` 名义上是一个基于图形面的 ftp 客户端和服务器程序，可以使用 `ssh` 作为系统之间的隧道或通道。它具有许多实用的功能和菜单选项，允许系统管理员通过网络、本地或全局成功、安全且高效地备份和恢复单个文件或目录。它对于备份和恢复单用户文件和目录最为有用。它不是前述节所示命令行工具的替代或替换品。\n\
  \n图 1.10 展示了 `FileZilla` “客户端”版本中提供的屏幕显示和菜单。\n\n![一个 SFTP 客户端窗口显示了到主机 192.168.1.1\
  \ 的连接，并列出了用户 bob 的本地和远程目录。](img/fig1_10.jpg) <details id=\"kfig1_10\"><summary>图\
  \ 1.10 的详细描述</summary> \n\nSFTP 客户端界面显示了连接到用户 bob 下主机 192.168.1.1 的会话。顶栏显示了主机、用户名、密码和端口字段，并带有快速连接选项。本地站点设置为\
  \ home/bob，远程站点也是 home/bob。两个面板显示目录列表：左侧为本地文件，包括 cache、config、local、pki、ssh 和 Documents；右侧为远程文件，包括相同的目录以及其他如\
  \ emacs.d、pp backup、putty、Bookshelf 和 Backup 等目录。文件详情包括文件大小、类型、最后修改日期、权限和所有者组信息。状态消息确认了目录列出成功。</details>\
  \ \n\n图 1.10 `FileZilla` 主窗口。返回正文。⏎\n\n在我们的案例中，客户端和服务器（即是运行树莓派 5 操作系统的本地机器和远程 Linux\
  \ 机器）之间必须启用 `ssh` 通信协议。你可以拥有远程服务器上账户的登录权限，或者如果启用了匿名登录，你也可以匿名登录。\n\n在客户端上启动 `FileZilla`\
  \ 后，要登录远程主机服务器，你需要提供服务器的 IP 地址、登录名称和密码以及端口号（`ssh` 为 22）。一旦你通过点击 Quickconnect（快速连接）菜单按钮成功登录，本地机器的目录和文件结构将显示在图的左侧。远程机器的目录结构将显示在图的右侧。要在机器之间传输文件或目录，只需在左侧或右侧相应的窗格之间进行拖放即可。如果你正在覆盖之前传输的文件或目录，`FileZilla`\
  \ 的默认设置是给你一个覆盖或重命名正在传输的文件的机会。\n\n`FileZilla` 屏幕顶部还有许多其他菜单选项，允许你影响偏好、设置书签等。例如，通过\
  \ `Manage Bookmarks`（管理书签）菜单选项和 `Site Manager`（站点管理器），你可以在登录到远程服务器站点时，自动让多个本地目录和远程目录可用于\
  \ `ssh` 传输。\n\n然而，使用 `FileZilla` 有一些局限性。它主要设计为 ftp 客户端和服务器软件，而不是专用的备份工具。虽然它可以用于在系统之间传输文件，但它缺乏内置的自动备份功能。不过，你可以通过外部工具结合\
  \ `FileZilla` 来实现自动文件备份。这里有一个你可以考虑的通用方法：\n\n1. 设置备份工具：选择一个适合你需求的备份软件或脚本。有很多可用选项，例如由\
  \ `systemd systemctl` 定器触发的 `rsync`。确保你选择的工具支持自动调度。\n\n2. 配置备份软件：设置备份软件以包含你想要备份的特定文件和文件夹。配置备份目标（例如本地存储、网络驱动器、云存储）并建立备份计划（例如，每小时、每天、每周）。\n\
  \n3. 集成 `FileZilla`：使用 `FileZilla` 将文件传输到指定的备份位置。你可以手动启动传输，也可以创建一个 `bash` 脚本文件自动执行传输。`FileZilla\
  \ Pro` 和 `FileZilla CLI` 提供了命令行界面 (CLI) 来执行脚本传输，但它们不是免费的！\n\n4. 调度备份过程：根据你选择的备份工具，利用其调度功能定期自动触发备份过程。这确保了指定文件得到定期备份。\n\
  \n通过将备份工具与 `FileZilla` 以及调度功能相结合，你可以为特定文件创建自动化备份系统。请参考你所选备份软件的文档和资源以获取配置的详细说明。\n\
  \n### 1.12.3.2 SD 卡复制器\n\n树莓派 5 操作系统内置了系统克隆软件！\n\n如果你部署了[1.2.3 节](#chapter1.xhtml_sec1_2_3）所示的系统安装技术，可以使用该方法的混合形式来存档整个操作系统，包括启动分区。如果系统/启动磁盘是\
  \ microSD 卡，那么你只需要将另一个空白（或非空白） microSD 卡插入合适的 microSD 转 USB 适配器，将其挂载到树莓派硬件的 USB\
  \ 端口上，然后使用 Pi 菜单项 `Accessories` > `SD Card Copier`（SD 卡复制器）选项将当前系统/启动磁盘克隆到空白卡上。\n\
  \n如果你遵循了[1.2.3 节](#chapter1.xhtml_sec1_2_3）的方法，且你的启动/系统介质是外部挂载的 USB2 或 USB3 设备（如\
  \ SSD），可以使用 SD 卡复制器将原始 SSD 克隆到另一个容量至少相同或更大的 SSD 上。\n\n前提是，你拥有一个设备（例如多端口 NVMe SSD\
  \ 适配器），可以向其中挂载多个 NVMe SSD。\n\n这里有几点警告。\n\n\n\n\n\n首先，在使用 SD 卡复制器（SD Card Copier）时，请确保**正确**地指定“从设备复制”（Copy\
  \ from Device）和“复制到设备”（Copy to Device）。“从设备复制”必须是原始启动/系统介质，而“复制到设备”可以是位于外壳内的另一个等容量或更大的介质，并通过树莓派硬件上的另一个\
  \ USB 端口连接。不要混淆这两种介质，否则你将得不到可用的克隆，也没有可启动的系统！当我们克隆启动/系统 SSD 时，原始盘和克隆盘是完全相同的、由 Silicon\
  \ Power 制造的 SSD，安装在 Orico 的 USB3 外置硬盘盒中。我们非常小心地在 SD 卡复制器中正确地指定了它们！\n\n其次，某些厂商的产品尽管名义上容量相同，但实际上是不同的。因此，你应该尝试提前确保这一点。\n\
  \n使用这种方法的缺点，无疑是，克隆会对系统在某一特定时刻的状态进行快照。这与使用由 `cron` 或 `systemctl` 定时器自动的 `rsync` 命令不同，后者可以根据某些时间计划定期、自动地拍摄快照。\n\
  \n### 1.12.3.3 第 136 页 使用 git 和 github 备份文件系统\n\n`git` 命令和 `Github.com` 是非常实用、高效且强大的工具，你可以用它们为你的软件项目创建一个分布式版本控制系统。它们也可以用作云存储和存档设施，特别是如果你遵循我们在本章推荐的存储模型。也就是说，如果你的树莓派\
  \ 5 操作系统安装在一个介质上，而你所有的用户数据文件都存储在另一个持久性介质上（例如额外的 SSD）。\n\n当然，使用私有的 `Github.com` 仓库进行备份和存档不是免费的。此外，`Github`\
  \ 存储的数据量有限制。因此，这种备份和存档方法最适合普通用户在 `Github` 的公共仓库中使用，且用户数据存储需求较小。如果你使用了与我们推荐不同的数据存储模型，执行\
  \ `Github` 存档和备份的机制将取决于该数据存储模型。\n\n### 1.12.3.4 curl\n\n什么是 `curl`？`curl`（Client\
  \ URL）是一个用于在本地系统和远程服务器之间传输数据的命令行工具。它支持支持多种协议，包括 FTP、SFTP、HTTP、HTTPS、SCP、SMB 等等。它常用于文件传输、备份自动化、API\
  \ 请求和网页爬虫。我们在 示例 1.1 中展示了 `curl` 的另一种用法。\n\n#### 在树莓派 5 上安装 curl\n\n*   `curl` 通常预装在树莓派\
  \ 5 操作系统中，但如果缺失或版本过旧，你可以轻松地安装或更新它。\n\n#### 1. 检查是否安装了 curl\n\n打开终端并运行：\n\n```bash\n\
  $ curl --version\ncurl 7.88.1 (aarch64-unknown-linux-gnu) libcurl/7.88.1 OpenSSL/3.0.15\
  \ zlib/1.2.13\nbrotli/1.0.9 zstd/1.5.4 libidn2/2.3.3 libpsl/0.21.2 (+libidn2/2.3.3)\
  \ libssh2/1.10.0\nnghttp2/1.52.0 librtmp/2.3 Output truncated...\n$\n```\n\n如果打印出上述输出，说明你的树莓派\
  \ 5 已经安装了 `curl`。如果没有，请按照下面的步骤操作。\n\n#### 2. 如何安装或更新 curl\n\n```bash\n$ sudo apt\
  \ update && sudo apt install curl -y\nOutput truncated...\n```\n\n这会安装 `curl` 或将其更新为仓库中提供的最新版本。\n\
  \n#### 3. 第 137 页 验证安装\n\n安装后，再次检查：\n\n```bash\n$ curl --version\n```\n\n你应该能在我们的树莓派\
  \ 5 操作系统上看到像我们在上面 a. 中得到那样的输出。\n\n#### 如何在树莓派 5 上使用 curl 进行文件传输：\n\n#### 1. 通过 FTP\
  \ 上传文件\n\n要向 FTP 服务器上传文件（`backup.zip`）：\n\n```bash\n$ curl -T backup.zip ftp://ftp.example.com/\
  \ --user username:password\n```\n\n其中：\n\n*   `-T` 指定要上传的文件。\n*   `ftp://ftp.example.com/`\
  \ 是远程服务器。\n*   `--user username:password` 提供登录凭据。\n\n上传多个文件：\n\n```bash\n$ curl\
  \ -T \"{file1.txt,file2.txt}\" ftp://ftp.example.com/ --user username:password\n\
  ```\n\n#### 2. 通过 FTP 下载文件\n\n要从 FTP 服务器下载 `backup.zip`：\n\n```bash\n$ curl -O ftp://ftp.example.com/backup.zip\
  \ --user username:password\n```\n\n其中：\n\n*   `-O` 以与服务器上相同的名称保存文件。\n\n下载多个文件：\n\
  \n```bash\n$ curl -O ftp://ftp.example.com/file1.txt -O ftp://ftp.example.com/file2.txt\
  \ --user username:password\n```\n\n#### 3. 镜像整个目录\n\n你可以使用 `curl` 列出并下载整个目录：\n\n\
  ```bash\n$ curl -O ftp://ftp.example.com/file1.txt -O ftp://ftp.example.com/file2.txt\
  \ --user username:password\n```\n\n对于递归目录，考虑使用 `wget`：\n\n```bash\n$ wget -m ftp://example.com/directory/\n\
  ```\n\n#### 4. 第 138 页 curl 用于 SFTP\n\n如果你使用 SFTP（安全 FTP）：\n\n```bash\n$ curl -T\
  \ backup.zip sftp://user@server.com/ --key ~/.id_rsa\n```\n\n其中：\n\n*   `sftp://`\
  \ 使安全。\n*   `--key ~/.id_rsa` 用于身份验证。\n\n#### 5. 自动化 curl 备份\n\n你可以通过 `cron` 自动化\
  \ `curl` 命令。这里有一个每天凌晨 2 点备份的示例：\n\n```bash\n$ crontab -e\n```\n\n添加以下内容：\n\n```bash\n\
  0 2 * * * curl -T /home/pi/backup.zip ftp://ftp.example.com/ --user username:password\n\
  ```\n\n#### 6. 何时使用 curl 而非其他工具？\n\n表 1.8 提供了各种工具的对比。\n\n表 1.8\n\n| 工具 | 适用 |\n\
  | :--- | :--- |\n| `curl` | 简单的传输、SFTP 上传下载 |\n| `lftp` | 更适合镜像/同步整个目录 |\n| `rsync`\
  \ | 基于 SSH/SFTP 备份的最佳 |\n| `wget` | 下载大文件及递归 |\n\n## 1.13 软件更新与操作系统升级\n\n我们在本节以两个问题开始，并尝试回答这些问题，以便让你更好地理解为什么软件更新和操作系统升级很重要。\n\
  \n问题：对于单用户树莓派 5 系统，普通用户需要执行最重要的两个安装后任务如下？\n\n第 139 页\n\n1. 系统上应用程序包的添加、删除或更新。\n\
  2. 操作系统本身的升级到新的稳定版本\n\n回答：\n\n1. 操作系统的标准安装并不包含用户根据其用例所需的软件。而且，随着用例的变化，也需要移除某些软件包。最后，当可用更新、更好的软件包版本时，必须有一种快速简单的方法来更新这些包。\n\
  2. 单纯从性能和安全的角度来看，树莓派 5 操作系统的升级非常频繁，即使是普通用户也应该通过升级来利用这些改进。\n\n问题：树莓派 5 系统“更新”和“升级”的区别是什么？\n\
  \n回答：通常在文献中，这两个术语经常混淆。但在本节（以及整个章节）的视角下，我们的定义如下：\n\n*   *更新*（Updating）添加或替换应用程序软件包的过程。例如，将\
  \ nginx Web 服务器应用程序从早期安装版本更新到最新稳定版本。\n\n\n\n\n升级是将整个操作系统替换为更新的（且尽可能稳定的）版本的过程。升级可以是到更新的次要版本，也可以到新的主版本版本。例如，从以前名为\
  \ Raspbian 的系统升级到 Raspberry Pi OS，这种升级不仅仅是命名规范的改变。此外，内核从较早版本到较新版本的变动也构成了操作系统的重大升级。\n\
  \n在本节中，我们将展示如何在我们代表性的树莓派 5 搭载的 OS 上完成这两项基础任务的基本方法。\n\n对于软件应用程序的添加、删除或更新，我们将讨论范围限制在高级软件包工具\
  \ (`APT`)，因为它是树莓派 5 OS 上的默认包管理器。`APT` 在基于文本的 CUI 环境中可以非常有效地使用。这正是我们在本书中所采用的方法。这并不排除使用基于\
  \ GUI 的包管理器前端，你可以通过树莓派菜单 `Preferences > Add/Remove Software`（偏好 > 添加/移除软件）访问。\n\n\
  此外，我们在此节中提供了关于 `Snaps` 的一些信息。`Snap` 包管理器是由支持 Ubuntu Linux 的公司 Canonical 开发的软件软件包管理系统。它设计用于跨不同的\
  \ Linux 发行版工作，并提供了一种以名为“Snaps”的自包含格式封装和分发软件的方法。\n\n`Snaps` 是容器化的软件包，包含了应用程序运行所需的所有依赖和库，使得它们更加隔离和安全。它们的目标是通过为不同的\
  \ Linux 发行版提供一致的体验，来简化软件的安装和更新。\n\n对于树莓派 5 OS，默认没有安装 `Snap` 包管理器。然而，如果需要，可以在树莓派\
  \ 5 OS 上安装 `Snap`。Canonical 提供了适用于如树莓派 5 OS 等基于 ARM 架构的系统的 `Snap` 包管理器版本。在树莓派 5\
  \ OS 上安装 `Snap` 的说明可以在官方 Snapcraft 网站或通过社区资源找到。\n\n在运行最新版本树莓派 5 OS 的树莓派上，可以通过打开终端并输入以下命令安装\
  \ `Snap`：\n\n```\n$ sudo apt update\n$ sudo apt install snapd\nOutput truncated…\n\
  $\n```\n\n然后你需要重启系统。\n\n```\n$ sudo reboot\n```\n\n然后安装核心 snap，以便你获取最新的 `snapd`。\n\
  \n```\n$ sudo snap install core22\nOutput truncated...\ncore22 20250110 from Canonical✓\
  \ installed\n$\n```\n\n对于操作系统本身的升级，我们将在 1.13.4 节中向你展示一套基本程序，这些适用于升级操作系统的各种条件。\n\n\
  **章节内练习**\n\n26. 考虑到我们之前关于更新和升级树莓派 5 系统的说明，请根据你在系统上使用的用例，列出想要安装的应用程序。然后，在学习本节剩余内容时，使用\
  \ `APT` 包管理器安装这些程序。\n\n获取本节中展示的包管理命令更多基础帮助的最佳方法，是阅读系统中可用的这些帮助页（man pages）。\n\n###\
  \ 1.13.1 存储模型建议\n\n我们之前为普通用户提供了一个建议的存储模型，其中操作系统位于单个介质上（我们称之为“引导/系统磁盘”），而用户数据位于一个或多个其他介质上。该模型给普通用户带来的最有用且实用的优点之一是能够添加或更新软件应用程序，并以一种非常可靠且高效的方式升级操作系统本身。由于软件应用程序和操作系统存在引导/系统磁盘上，因此可以独立于用户数据进行增量更新或升级。例如，如果你想从操作系统的早期主版本升级到最新版本，可以断开并卸载用户数据介质，在旧的（甚至是新的）引导/系统磁盘上对新版本进行清洁或全新的安装，然后简单地将用户数据重新连接到系统。我们发现这种存储模型和这种更新/升级方法对于普通用户来说也是最安全、最可靠的，即它不会破坏系统从而导致用户数据丢失。\n\
  \n如果你选择保留旧的操作系统主版本，并只想增量更新软件和升级操作系统，下文将为你提供如何进行操作的基本概述。\n\n通过使用我们在此处展示的设施，可以使用非常广泛的软件程序。这些程序位于被称为“仓库”（repositories）的软件存档中。仓库包含“软件包”（packages）的集合，每个软件包都包含了在一起的软件和依赖项，它们可以被自动一起安装。当通过\
  \ `APT` 或 `Snap`（我们之前提到的两个包管理系统）等包管理设施在你的系统上下载并安装时，该软件无需进行任何其他操作即可供用户使用。\n\n####\
  \ 1.13.1.1 默认仓库\n\n树莓派 5 OS 的默认仓库通常指定在文件 `/etc/apt/sources.list` 中。该文件包含 `APT` 包管理器用于安装和更新软件的软件包仓库列表。\n\
  \n在本书编写时，我们树莓派 5 上的 `sources.list` 文件默认包含以下几行：\n\n```\n deb http://deb.debian.org/debian\
  \ bookworm main contrib non-free non-free-firmware\ndeb http://deb.debian.org/debian-security/\
  \ bookworm-security main contrib non-free non-free-firmware\ndeb http://deb.debian.org/debian\
  \ bookworm-updates main contrib non-free non-free-firmware\n```\n\n在上面的示例列表中，仓库\
  \ URL 被指定为 `http://deb.debian.org/debian`。该 URL 指向官方的树莓派 5 OS 仓库服务器。\n\n仓库分为三个部分：\n\
  \n*   **main**: 该组件包含由树莓派 5 OS 团队官方支持的核心软件包。\n*   **contrib**: 该组件包含不是核心发行版的一部分、但仍由树莓派\
  \ 5 OS 团队提供的软件包。这些软件包依赖于 `main` 组件中的软件。\n*   **non-free**: 该组件包含不是自由软件且可能存在许可限制的软件包。这些软件包依赖于\
  \ `main` 组件中的软件。\n\n\n\n27. 确切确定你的 Raspberry Pi 系统如何部署存储模型。例如，用户主目录的路径是什么？如果存储介质上划分了文件系统结构，它是如何被划分的？这与我们建议的存储模型有何不同？你如何迁移目前\
  \ Raspberry Pi 系统上现有的存储模型，使其符合我们建议的模型？也许你就是安装 Raspberry Pi 5 操作系统时实现该存储模型的人。在这种情况下，你仍然可以为了归档和个人参考而回答这个问题。\n\
  \n### 1.13.2 使用高级软件包工具 (APT)\n\n对于初学者来说，起初采用字符用户界面（CUI）方法进行软件包管理，可能看起来不是完成系统管理员必须执行的最重要安装后任务之一的最快、最简单的方法。图形化用户界面（GUI）方法具有某些巨大的优势，而且不仅仅是在节省时间方面。但我们认为，在命令行中使用\
  \ `APT` 获得的显式控制，优于 GUI 的初始优势。在所有可用的 `APT` 工具中，`apt-get` 命令对初学者来说是最实用的。\n\n#### 1.13.2.1\
  \ 使用 apt-get\n\n高级软件包工具（APT）用于管理软件包的所有方面。最常用（且最有用）的软件包管理程序是 CUI 工具 `apt-get`。以下是摘自我们\
  \ Raspberry Pi 5 操作系统安装手册的 `apt-get` 简版手册描述：\n\n```\n **********************************************************\n\
  apt-get - APT 软件包处理工具 – CUI 版本\n\n语法:\napt-get [-asqdyfmubV] [-o=config_string]\
  \ [-c=config_file]\n         [-t=target_release] [-a=architecture] {update | upgrade\
  \ |\n                  dselect-upgrade | dist-upgrade |\n                  install\
  \ pkg [{=pkg_version_number | /target_release}]...  |\n                  remove\
  \ pkg...  | purge pkg...  |\n                  source pkg [{=pkg_version_number\
  \ | /target_release}]...  |\n                  build-dep pkg [{=pkg_version_number\
  \ | /target_release}]...  |\n                  download pkg [{=pkg_version_number\
  \ | /target_release}]...  |\n                  check | clean | autoclean | autoremove\
  \ | {-v | --version} |\n                  {-h | --help}}\n\n目的：apt-get 是处理软件包的命令行工具，可以被视为用户使用\
  \ APT 库与其他工具的“后端”。存在多个“前端”接口。\n\n输出：系统上添加、删除或更新的软件软件包。\n\n常用选项和命令：\n注意：除非给出 -h 或\
  \ --help 选项，否则必须存在以下命令之一。\n-d, --download-only\n          仅下载；只检索软件包文件，不进行解压或\n\
  \          安装。配置项：APT::Get::Download-Only。\n--only-upgrade\n          不安装新软件包；当与\
  \ install 配合使用时，\n          only-upgrade 将将仅对已安装的软件包进行升级，\n          并忽略安装新软件包的请求。\n\
  -q, --quiet\n          安静；产生适用于日志记录的输出，省略进度\n          指示。\n-y, --yes, --assume-yes\n\
  \          对提示自动回答是；将“yes”视为所有提示的回答，\n          并以非交互模式运行。\n命令-\ninstall\n     \
  \     install 后面跟随着一个或多个想要安装\n          或升级的软件包。使用 /etc/apt/sources.list 文件来\n \
  \         定位所需的软件包。\nremove\n          remove 与 install 相同，只是删除了软件包\n          而不是安装。删除软件包会将其配置\n\
  \          文件留在系统中。\nupdate\n          update 用于从其源重新同步软件包索引文件。\n          可用软件包的索引从以下\n\
  \          位置获取。\nupgrade\n          upgrade 用于从源安装所有软件包的          最新版本。\n*********************************************************\n\
  ```\n\n\n\n最后，测试这些应用程序中的每一个。这些应用程序在系统重启后会自动重启吗？在不实际重启系统的情况下，如何知道它们是否会这样做？\n\n29.\
  \ 在你的 Raspberry Pi 5 系统上使用 `APT` 安装适合你特定用例的应用程序包。回到你在本章练习 24 中的答案中，可以找到这些包的初步列表。\n\
  \n### 1.13.3 升级操作系统\n\n与我们对初始安装系统的具体特定细节的建议类似，系统本身的次版本或大版本升级很大程度上取决于以下因素：\n\n1.\
  \ 你正在处理的特定系统。\n2. 你正尝试升级的系统版本范围。\n\n尽管 Raspberry Pi 5 操作系统使用 `APT`，但由于第 2 点的原因，存在着足够的变数，因此关于升级系统的具体特定细节，最好留到在你想要执行升级时查阅相关的在线资源。在我们编写此书时，使用\
  \ `APT` 的升级步骤可以总结如下：\n\n1. 以 root 用户身份执行以下 `APT` 命令适用于次版本升级：\n\n```\nroot@raspberrypi:∼#\
  \ apt update\nroot@raspberrypi:∼# apt upgrade\nroot@raspberrypi:∼# apt dist-upgrade\n\
  ```\n\n2. 大版本升级程序最好在你想要执行升级时查阅在线文档，而且当然，它受到上述第 1 点的限制。\n\n**本章练习**\n\n30. 创建一个文档，详细说明你升级\
  \ Raspberry Pi 5 系统必须采取的精确步骤，该文档适用于软件的次版本和大版本升级。你对操作步骤的安排应当反映出，例如，对于次版本更改按每周或每月进行一次，或者对于大版本更改按某个不指定的间隔进行一次。然后，实施你文档中所指定的程序。\n\
  \n## 1.14 系统与软件性能监控与调整\n\nRaspberry Pi 5 操作系统系统管理员（以及其个人电脑上的普通单用户）在处理系统性能时，必须做出的最重要的考虑围绕着\
  \ CPU 进程管理、内存管理、磁盘使用/管理以及网络性能。[表 1.9] 列出了 Raspberry Pi 5 操作系统为系统调优和性能监控 提供的控制设施和功能，特别是考虑到添加了内核可加载的\
  \ `ZFS` 组件（如果它是稳定且易于实现的 case 的话）。\n\n表 1.9 性能调优功能\n\n| 系统组件 | 控制设施 |\n| --- | ---\
  \ |\n| CPU | Nice 值 |\n| | 进程优先级 |\n| | Cgroup 管理 |\n| | 批队列 |\n| | 调度器参数 |\n| 内存\
  \ | 进程资源限制 |\n| | Cgroup 管理 |\n| | 内存管理参数 |\n| | 分页空间 |\n| ZFS vdevs, zpools 和 I/O\
  \ (已安装) | ZFS 池和文件系统组织 |\n| | ZFS 去重、效率、优化 |\n| | I/O 参数 |\n| | Zvol 创建与管理 |\n|\
  \ 网络 I/O | 网络内存缓冲区 |\n| | 网络相关参数 |\n| | 网络基础设施 |\n\n实现并影响 [表 1.9] 中某些功能的命令如下。我们还包含了允许你监控这些功能的命令。我们将在下文章节中涵盖其中一些命令。\n\
  \n```\ndf, du, free, journalctl, nice, pgrep, ps, renice, systemctl, systemd-cgls,\
  \ systemd-run, top\n```\n\n### 1.14.1 应用层级进程/线程资源管理\n\n监控系统资源（如进程 CPU 使用率和系统内存）的基本原因，是考虑到系统在其设计和预期用例下的性能表现，为了允许你在应用层级观察、评估并然后控制对你认为重要的程序是如何有效使用系统资源的主要组件的。\n\
  \n例如，如果某个特定的标准应用程序（例如你从在线仓库安装的 Web 服务器）甚至用户编写的程序进程消耗了过多的 CPU 或内存资源，根据你针对系统设计或预期的用例所确定的标准，你可以缩小该任务的操作规模，以更好地服务你的用户群体。反之，如果这些进程由于任何原因正处于资源服务不足或资源匮乏的状态，你也可以扩大该任务的操作规模。在某些情况下，服务不足可能是由硬件故障或非法侵入引起的，但我们在此节中不涵盖这些情况。\n\
  \n在 systemd 控制的背景下，这的一个经典案例是从 `graphical.target` 状态切换到 `multi-user.target` 状态。这类似于使用服务器级安装，而不是完全的桌面安装。我们将在第\
  \ 2 章使用 `isolate` 命令深入探讨这种系统状态的变化。\n\n关键在于能够在你的 Raspberry Pi 5 上以现代的方式观察和评估系统资源的使用情况，然后根据这些观察和评估采取一些行动。这些行动无疑是由你根据系统用例策略性地设计和实施的管理计划所引导的。\n\
  \n另一种评估进程活动的方法，例如通过 `proc` 系统对进程和进程组进行调度。\n\n#### 1.14.1.1 传统进程控制\n\n传统上，最重要、完整且易于获取的活动显示是由\
  \ `ps` 和 `top`（或 `htop`）命令提供的，它们允许你监控进程。\n\n### 1.14.2 管理系统内存\n\nsystemd 允许你轻松地控制并设置单元内存限制。在你的\
  \ Raspberry Pi 5 安装内存较少的情况下，这可能是至关重要的。要查看内存消耗的百分比，请使用 `top` 命令并检查 `%MEM` 列输出。\n\n\
  限制规定了任务可以使用多少进程和内核内存。限制以字节为单位。如果数值后跟着 K、M、G 或 T，则指定的内存大小分别解析为千字节、兆字节、吉字节或太字节（基数为\
  \ 1024）。特殊值“infinity”意味着不应用内存限制。\n\n实现此点的最简单方法是在单元配置文件的 `[Service]` 部分中放入以下指令：\n\
  \n```\nMemoryLimit=value\n```\n\n将 `value` 替换为 cgroup 中执行的进程的最大内存使用限制。`MemoryLimit`\
  \ 参数控制 `memory.limit_in_bytes` 控制组参数。为名为 `test4` 的服务分配 500 兆字节的内存限制，在 `/etc/systemd/system/test4.service`\
  \ 文件中添加以下设置：\n\n```\n[Service]\nMemoryLimit=500M\n```\n\n通过两种方式之一应用更改，请重新加载 systemd\
  \ 配置并重启服务。在下面的两个命令中，该服务名为 `test4.service`。\n\n```\n$ sudo systemctl daemon-reload\n\
  $ sudo systemctl restart test4.service\n```\n\n**本章练习**\n\n31. 根据特定的用例需求，调整你的 Raspberry\
  \ Pi 5 系统上选定服务的 `MemoryLimit` 值，调高或调低。\n\n\n\n\n\n32. 使用系统上的 `free` 命令及其选项来评估系统内存的分布。你获得的数值与你实际安装的系统内存大小一致吗？\n\
  \n从 `free` 命令的输出中，你可以推断出系统安装的内存容量是多少（单位为 GB）？请查看系统上 `free` 命令的帮助页（man page）以获取有关其用法和选项的更多信息。\n\
  \n### 1.14.3. 系统磁盘占用评估\n\n除了 CPU 使用率和内存管理之外，查看、评估并可能修改持久存储媒体资源（特别是容量有限的 microSD\
  \ 卡）的能力，对于系统管理员的任务至关重要。即使对于普通用户，无论 TB 容量的外部存储媒体是否可用且廉价，存储空间都是一种宝贵的资源。考虑一个 Raspberry\
  \ Pi 5 系统，由于某种原因它物理上只能支持较小容量的 microSD 卡；或者普通用户正在存储大文件（如视频或其他类型的媒体文件）的系统。\n\n传统上，`du`\
  \ 命令允许你以多种格式获取文件和目录磁盘使用情况的文本摘要。管理员可以根据系统的用例采取措施，精简存储占用。有关 `du` 命令的更多信息，请查看 Raspberry\
  \ Pi 5 系统上 `du` 的帮助页。\n\n`df` 命令（`df` 是 disk free 的缩写）允许你显示调用用户具有读取权限的文件系统的可用存储空间大小。`df`\
  \ 通常使用 `-h` 和 `-T` 选项调用，这会提供人类可读的输出格式，并包含文件系统类型。例如，在我们 Raspberry Pi 5 系统上（其启动/系统介是\
  \ microSD 卡），以下命令提供了有关存储和文件系统布局的信息：\n\n```\n $ df -hT\nFilesystem             Type\
  \               Size  Used     Avail      Use%  Mounted on\nudev               \
  \    devtmpfs            2.0G     0          2.0G       0%    /dev\ntmpfs      \
  \            tmpfs               405M   6.2M      399M       2%    /run\n/dev/mmcblk0p2\
  \         ext4               28G   6.9G      20G          27%     /\ntmpfs     \
  \             tmpfs               2.0G     0          2.0G       0%    /dev/shm\n\
  tmpfs                  tmpfs               5.0M   48K       5.0M       1%    /run/lock\n\
  /dev/mmcblk0p1         vfat               510M   67M       444M       14%   /boot/firmware\n\
  tmpfs                  tmpfs               405M   192K      405M       1%    /run/user/1000\n\
  /dev/sda1              exfat               954G   8.1G      946G         1%    /media/\n\
  ```\n\n可以使用更现代的图形方法来查看和评估 Raspberry Pi 5 系统的磁盘占用。例如，你可以使用名为“Baobab”的 gnome 磁盘分析器。它显示任何连接介质的相对磁盘占用的条形图或扇形图。当你想要了解磁盘用途时，这个工具非常有用。图\
  \ 1.11 显示了同一 Raspberry Pi 5 系统上根目录的典型容量显示。在所有 Linux 系统上都能找到类似的工具。\n\n![树莓派文件管理器显示已用\
  \ 15.4 GB 字节，主要空间在 home 和 var 目录，以饼形图形式显示。](img/fig1_11.jpg)\n<details><summary>图\
  \ 1.11 详细描述</summary>树莓派文件管理器以列表和饼形视图显示存储占用情况。 306356 个项目总共使用了 15.4 GB 字节。home 目录占用\
  \ 5.8 GB，包含 8019 个项目；usr 占用 5.7 GB，包含 28647 个项目；var 占用 3.9 GB，包含 9781 个项目。较小的目录包括：etc（占用\
  \ 13.6 MB）、tmp（占用 167.9 KB）、media（占用 12.3 KB）、opt（占用 12.3 KB）、srv（占用 8.2 KB）和 mnt（占用\
  \ 8.2 KB）。每个目录还显示了修改日期，范围从今天到一年前不等。右侧的饼形图可视化了空间分布，较大的部分对应于 home、usr 和 var。</details>\n\
  \n图 1.11 根目录磁盘占用分析器显示。\n\n### 1.14.4 使用 ip 命令进行网络配置\n\n系统管理员在进行安装后网络配置时，最重要且最重要的命令是\
  \ `ip` 命令。以下章节说明了该命令的基本用法，并提供了一个用例示例，说明了如何为 Raspberry Pi 5 网络接口分配多个 IP 地址。\n\n使用新的工具包，可以很容易地添加新的\
  \ IP 地址，如下：\n\n```\n $ ip addr add 192.168.1.1/24 dev eth0\n```\n\n#### 1.14.4.1\
  \ 基础 ip 命令语法、选项和操作\n\n`ip` 命令的帮助页简缩版本如下：\n\n```\n*************************************************************************\n\
  ip\nSyntax: ip [ Options] Object { Command | help }\n       ip [ -force ] -batch\
  \ filename\nwhere\n    Object  { link | addr | addrlabel | route | rule | neigh\
  \ | ntable |\n             tunnel | tap | mroute | xfrm | netns | l2 }\n    Options\
  \ { -V[ersion] -h[uman-readable] -s[tatistics] -r[esolve] |\n             f[amily]\
  \ | -o[neline] -n[etns] name | -a[ll] -c[olor] }\n    Command\n    指定对对象执行的操作。可能的命令\n\
  \    取决于对象的类型。对于大多数对象，命令是\n    add、delete 和 show。如果没有给出命令，通常执行\n    show 命令，应用于指定的对象。\n\
  Purpose: 显示或操纵路由、设备、策略路由。\nOutput: 输出路由、设备、策略路由。\n```\n若要查看 ip 命令的简缩语法帮助，请输入：\n\
  $ ip addr help\nUsage: ip address {add|change|replace} IFADDR dev IFNAME [ LIFETIME\
  \ ]\n       [ CONFFAG-LIST ] [ LABEL ] [up]\n    Options:\n       -add         \
  \   添加新地址\n       -change         更改现有地址\n       -replace        替换现有地址\n      \
  \ -show           显示地址\n       -save           将地址保存到文件\n       -flush         \
  \ 从接口删除所有地址\n       showdump        显示地址的详细导出\n    Object:\n       addr        \
  \    IP 地址信息\n       route           路由信息\n       link            链路层信息\nCommon\
  \ Options, Objects:\naddr\n       -V              版本\n       -h              人类可读输出\n\
  \       -s              统计信息\n       -f[family]      指定地址族\n       -o[oneline] \
  \    单行输出\n       -n[etns]        按网络命名空间显示\n       -a[all]          显示所有地址\n  \
  \     -c[color]       使用彩色输出\n*************************************************************************\n\
  ```\n\n从上面的简缩列表中，你可以看到对 Object 可用的命令，即 add、change、replace、del(ete)、show、save、flush\
  \ 和 showdump。\n\n要查看特定网络接口（例如 eth0）的状态，请输入：\n\n```\n $ ip addr show eth0\n2: eth0:\
  \ <NO-CARRIER,BROADCAST,MULTICAST,UP> mtu 1500 qdisc pfifo_fast state DOWN group\
  \ default qlen 1000\n    link/ether 2c:cf:67:23:a9:43 brd ff:ff:ff:ff:ff:ff\n```\n\
  \n这表示没有连接以太网。\n\n要查看连接到或定义在系统中所有网络接口的状态，请输入：\n\n\n\n\n\n```\n $ ip addr show\n1:\
  \ lo: <LOOPBACK,UP,LOWER_UP> mtu 65536 qdisc noqueue state UNKNOWN group default\
  \ qlen 1000\n    link/loopback 00:00:00:00:00:00 brd 00:00:00:00:00:00\n    inet\
  \ 127.0.0.1/8 scope host lo\n        valid_lft forever preferred_lft forever\n \
  \   inet6 ::1/128 scope host noprefixroute\n        valid_lft forever preferred_lft\
  \ forever\n2: eth0: <NO-CARRIER,BROADCAST,MULTICAST,UP> mtu 1500 qdisc pfifo_fast\
  \ state DOWN group default qlen 1000\n    link/ether 2c:cf:67:23:a9:43 brd ff:ff:ff:ff:ff:ff\n\
  3: wlan0: <BROADCAST,MULTICAST,UP,LOWER_UP> mtu 1500 qdisc pfifo_fast state UP group\
  \ default qlen 1000\n    link/ether 2c:cf:67:23:a9:44 brd ff:ff:ff:ff:ff:ff\n  \
  \  inet 192.168.1.14/24 brd 192.168.1.255 scope global dynamic noprefixroute wlan0\n\
  \        valid_lft 85840sec preferred_lft 85840sec\n    inet6 fe80::6950:e65e:eb76:1b0/64\
  \ scope link noprefixroute\n        valid_lft forever preferred_lft forever\n```\n\
  \n第 154 页要显示 `eth0` 的链路特性，请输入以下命令：\n\n```\n $ ip link show dev wlan0\n3: wlan0:\
  \ <BROADCAST,MULTICAST,UP,LOWER_UP> mtu 1500 qdisc pfifo_fast state UP mode DORMANT\
  \ group default qlen 1000\n    link/ether 2c:cf:67:23:a9:44 brd ff:ff:ff:ff:ff:ff\n\
  $\n```\n\n### 1.14.4.2 用例示例：为树莓派 5 分配多个 IP 地址\n\n在树莓派 5 OS 上，`Network Manager` 是管理网络连接的默认工具。你可以使用图形界面和命令行界面与其交互。\n\
  \n#### 图形界面\n\n如果你正在使用树莓派 5 桌面环境，`Network Manager` 在任务栏上提供了一个托盘图标——通常类似于网络或 Wi-Fi\
  \ 符号。点击此图标将显示可用的网络连接，允许你连接 Wi-Fi 网络、管理以太网设置以及配置 VPN。对于更高级的设置，你可以从此菜单访问“编辑连接”（Edit\
  \ Connections）选项。\n\n#### 命令行界面\n\n对于终端用户或在无头（headless）设置下运行时，`Network Manager`\
  \ 提供两个主要的工具：\n\n*   `nmtui` (Network Manager 文本用户界面)：这是一个基于文本的界面，提供了一种用户友的方式管理网络连接，无需记忆复杂的命令。要启动它，只需打开终端并输入：\n\
  \n    ```\n     $ nmtui\n    ```\n\n    在此处，你可以编辑现有连接、激活或禁用连接，并设置系统主机名。\n\n*   `nmcli`\
  \ (Network Manager 命令行界面)：这是一个强大的命令行工具，用于详细的网络管理。一些常用命令包括：\n\n    *   查看所有接口的状态：\n\
  \n        ```\n         $ nmcli dev status\n        DEVICE             TYPE   STATE\
  \    OPERRATE\n        ```\n（注：原文提供的状态输出是截断的；此处保留了其结构。）\n\n\n\n\n\n## 1. 进程层面\n\n\
  你必须了解并感知“内核空间”与“用户空间”之间的区别。在 Linux 系统中，`kernel space` 是操作系统核心函数执行的地方，它们拥有对硬件和系统资源的完全访问权限，确保了安全性和稳定性。它包含了驱动程序、进程管理和内存处理。另一方面，`User\
  \ space` 是应用程序受限运行的地方，通过系统调用与内核交互。这种分离防止了用户程序直接影响系统的稳定性和安全性。因此，树莓派 5 操作系统的进程模型使得此处至关重要。该模型规定了通过身份验证和凭据技术在进程上实现的安全性。进程是程序执行的基础，也是连接内核与用户空间的桥梁。这些措施示例包括：\n\
  \n*   设置传统的 UNIX 权限位（`rwx`）、特殊权限位 `SUID`、`SGID` 和粘位（sticky bit）。权限位的设置意味着 shell\
  \ 命令创建的进程是权限位文件所指向或作用的真实对象。这对于树莓派 5 操作系统中创建进程的一切都是如此，这意味着包括用户编写的程序，以及所有其他应用程序和系统程序。\n\
  *   部署 ACL，无论是扩展的 POSIX1e ACL（树莓派 5 操作系统上的默认实现）还是 NFSv4 ACL。\n*   应用于进程的 Linux 特有“能力”（capabilities），详见第\
  \ 1.15.2.3 节。\n*   使用 Linux 内核命名空间 API 及其六种主要实现对进程进行命名空间隔离。\n\n## 2. 物理层面\n\n当有人直接坐在树莓派面前并尝试登录使用时。实现这一目标的方法之一是对用户账户使用密码保护。在公共计算机系统上（据我们所知，树莓派\
  \ 5 这种情况很少见！），这是维护通用访问安全以及用户/账户安全最有价值的方法。在此处还有许多限制对系统硬件物理访问的安全技术，例如锁上存放机器的房间门，或者建立限制对机器物理访问的协议。\n\
  \n## 3. 网络层面\n\n通过在计算机的网络连接上设置保护措施。这通过多种形式实现，不仅使用 systemd `journalctl` 进行监控以及使用多种形式的入侵检测，还通过我们在下方演示的入侵预防系统。\n\
  \n## 4. 持久化介质层面\n\n在物理或虚拟连接到计算机自身的持久化介质上。这些技术应用于启动/系统介质以及其他连接介质，例如用户数据磁盘或挂载的网络文件系统\
  \ (NFS)。示例包括在传统卷或 ZFS 卷上使用虚拟化的“沙箱”机器，以及下方所示各种磁盘数据加密领域。\n\n此外，上述位置还使用了以下特定技术。我们将在下面的章节中描述一些重要的技术。其中某些技术的进一步阐述见第\
  \ 1.15.2 节。\n\n*   基于密码的身份验证\n*   访问控制，无论是自主的 (DAC)、强制的 (MAC) 还是基于角色的 (RBAC)\n*\
  \   `sudo` 命令\n*   为文件和目录设置 POSIX1e ACL、扩展 ACL 以及 NFSv4 ACL\n*   入侵检测与入侵预防\n*  \
  \ 安全软件\n*   `ufw` 系统防火墙\n*   进程凭据认证\n*   用户命名空间进程隔离\n*   全盘、分区、目录或文件级数据加密\n\n###\
  \ 1.15.1 基于密码的身份验证\n\n系统安全的第一道防线，也是几乎应用于许多类型计算机系统的技术，是基于密码的身份验证。树莓派 5 操作系统在登录时对比用户为\
  \ ID 输入的密码，将其与该用户在密码文件中之前建立并存储的密码进行比较，并根据比较结果验证用户身份或拒绝访问。ID 不仅决定用户是否可以获得系统本身的访问，还决定了用户拥有什么权限。例如，超级用户权限。此外，ID\
  \ 也用于自主访问控制 (DAC)，如第 1.15.2 节所示。密码文件和使用 SHA256 哈希算法加密密码的哈希/加盐方案共同验证用户 ID。系统中的 `/etc/passwd`\
  \ 密码文件持有用户信息，并与 `/etc/shadow` 文件配合来验证用户 ID。\n\n**章节内练习**\n\n36. 检查你树莓派系统上的 `/etc/passwd`\
  \ 文件内容。参考该文件中你的用户名条目，共有多少个冒号分隔的字段？这些冒号分隔字段的含义是什么？\n\n### 1.15.2 访问控制凭据：自主 (DAC)、强制\
  \ (MAC) 和基于角色的 (RBAC)\n\n如果你想理解不同类型的访问控制，本节中使用的术语非常重要。当我们通过通过安全检查进行访问控制时，这里是重要的术语：\n\
  \n*   `Objects`（对象）：执行内核的基础组件是其维护的程序和进程。对象是进程所指向或处理的实体。例如，进程本身可以是对象，也可以是执行程序产生的进程。文件/节点（inodes）是对象的另一种形式，特别是可执行文件以及持有其信息的数据结构。\n\
  *   Object Ownership（对象所有权）：指示所有者、用户和组。\n*   Object Context（对象上下文）：在对对象进行操作时进行的安全检查。\n\
  *   Subjects（主体）：被另一个对象所作用的对象。进程是活动主体，例如由源进程通过 `exec()` 或 `fork()` 系统调用创建的进程。\n\
  *   Subject Context（主体上下文）：活动主体执行操作时进行的安全检查。\n*   Action（动作）：主体对对象执行的操作。这包括读取、写入、创建、删除文件，或派生和信号传递。\n\
  *   Permissions（权限）：当主体作用于对象时的安全检查。根据主体上下文、对象上下文和动作，搜索一个或多个权限集，以查看在这些上下文中主体是否被授予或拒绝以预期方式对对象的操作。简单来说，就是匹配主体对象权限，并允许或不允许主体对对象的操作。\n\
  \n有三种基本的权限“类”。它们是：\n\n1.  自主访问控制 (DAC)：\n\n    有时对象会在其描述中包含一组规则。这就是“访问控制列表”或“ACL”。一个文件可以提供多个\
  \ ACL。例如，传统的 Linux 文件包含一个权限掩码，这是一个简化的 ACL，具有三个固定的主体类（用户”、“组”和“其他”），每个类都可以被授予某些特权（“读”、“写”和“执行”——取决于对于相关对象的映射）。然而，Linux\
  \ 文件权限不允许任意指定主体，因此其用途有限。\n\n    Linux 文件可能还支持 POSIX1e ACL 或 NFSv4 ACL。这些是授予任意主体各种权限的规则列表。\n\
  \n2.  强制访问控制 (MAC)：\n\n\n\n\n整个系统可能拥有一或多组权限，这些权限适用于所有主体和对象，无论其来源为何。安全增强型 Linux（SELinux）就是这样一个例子。\n\
  \n### 3. 基于角色的访问控制 (RBAC)\n\n基于角色的访问控制 (RBAC) 模型并不是使用用户 ID 来查找用户和组在系统上拥有的访问权限，而是根据用户所承担的角色（一个角色或多个角色）来授予访问权限。经典的\
  \ RBAC 示例是使用 `su` 或 `sudo` 命令以临时的方式赋予非特权用户 root 权限。另一个例子可以在 ZFS 中找到，当你执行 `zfs` 命令时，系统会检查你的操作，以确认发布命令的主体是否具有角色权限，即使该用户是\
  \ root。\n\n这些类的访问控制策略决定了在什么情况下（DAC、MAC 或基于角色的访问控制 (RBAC)）、对什么对象执行什么操作，以及由什么主体执行。例如，传统\
  \ UNIX/Linux 意义上的权限是指 `rwx`（读、写或执行权限）。例如，主体可以被视为正在执行的进程。\n\n**注意**\n\n最重要的是，对象可以被视为一个\
  \ Linux 进程，因为在文件及其数据上进行的所有操作都是通过系统上的活动进程完成的。\n\n**章节练习**\n\n37. 什么主要设备控制着树莓派 5 操作系统进程的执行？\n\
  38. 给出 DAC、MAC 和 RBAC 的其他示例。\n\n在命令行上，普通用户或系统管理员可以通过 `chmod` 命令控制施加于主体可执行镜像文件的进程凭据分配，来实现资源使用限制和权限。普通非特权用户可以通过\
  \ `su` 或 `sudo` 命令被赋予所需的特权角色。然后，作为 root 身份，她可以执行特权的 `chmod`、`chown` 和 `chgrp` 来授予或修改文件和目录的访问权限，并使用\
  \ DAC、MAC 或 RBAC 方法。\n\n#### 1.15.2.1 凭据类型\n\n我们关注的是 Linux 内核支持的三种基本凭据类型。如下：\n\n\
  **传统 UNIX 凭据**\n\n1. 真实用户 ID (Real User ID)\n2. 真实组 ID (Real Group ID)\n   `UID`\
  \ 和 `GID` 被分配给大多数对象。这些主要定义了该对象的对象上下文，进程也包含在此分配中。\n3. 有效 (EUID)、保存 (SUID) 和文件系统 (FSID)\
  \ 用户 ID\n4. 有效 (EGID)、保存 (SGID) 和文件系统 (FSGID) 组 ID\n5. 补充组 (Supplementary groups)\n\
  \n进程使用的额外凭据是 `EUID/EGID/GROUPS`，它们被被用作主体上下文，而真实的 `UID`/`GID` 将被用作对象上下文。\n\n####\
  \ 1.15.2.2 ACL（访问控制列表）\n\nACL 为普通非特权用户提供了对目录和文件设置比传统权限更细粒度访问控制的能力，无论是用于 ext4 还是\
  \ ZFS 文件系统。有两种不同基本类型的 ACL 应用于文件和目录。定义文件和目录当前访问权限的 ACL 称为*访问* ACL。一种只能在逻辑上设置在目录上的、且定义了目录对象在创建时从其父目录继承的权限的\
  \ ACL 称为*默认* ACL。额外的基本类型 ACL 还有*最小* ACL 和*扩展* ACL。等同于传统文件模式权限的 ACL 权限称为*最小 ACL*。最小\
  \ ACL 有三个条目，可以与传统文件权限相同。具有三个以上条目的 ACL 称为扩展 ACL。扩展 ACL 还包含一个掩码条目，并可能包含任意数量的命名用户和命名组条目。\n\
  \n**注意**\n\n遗憾的是，在本书编写期间，树莓派 5 操作系统及其支持的 POSIX.1e ACL 模型在网络文件系统版本 4 (NFSv4) ACL\
  \ 方面，Linux 与非 Linux 服务器和客户端之间无法轻松实现互操作性。\n\n例如，如果 Linux 用户将一个符合 NFSv4 ACL 的文件系统挂载为\
  \ NFS 共享资源，Linux 上默认的 POSIX.1e 实现无法利用该文件系统的 NFSv4 ACL 模型。如上述，即使用户在远程系统上启用 NFS 服务功能并在\
  \ Linux 系统上启用客户端功能的同时，安装了特殊工具 `nfs4-acl-tools`，该限制仍然存在。这无疑是 ACL 的一种更高级的应用。这方面的另一个实际实际限制是\
  \ LXC/LXD 容器的虚拟化。如果你在 Linux 主机上为这些容器创建 LXC/LXD 容器，那么 NFSv4 ACL 无法用于 LXD 容器文件对象。\n\
  \n此外，`tar` 命令不会保留 ACL。\n\n#### 1.15.2.3 能力 (Capabilities)\n\n能力集如下：\n\n1. 许可的能力集\n\
  2. 可继承的能力集\n3. 有效能力集\n4. 能力边界集 (Capability bounding set)\n\n当这些能力应用于系统操作中的活动元素——进程时最为相关。它们是在“更细粒度”的范围内执行的特权权限。这里的“更细粒度”是指更具体、更有针对性的权限。它们被应用于进程，而进程通常通过传统模型只能授予一种概括性的、全有或无的权限方案。将用户放入\
  \ sudoers 文件就是其中的例子。\n\n能力的控制通过传统的 `rwx` 权限更改来实现，但也可以通过 `capset` 和 `getcap` 系统调用直接进行精细设置和查看。\n\
  \n更多信息请参考系统的 man 页。\n\n**章节练习**\n\n39. 如何以及为什么在命令行应用 Linux 能力？提供一个你在树莓派 5 系统上实现并测试的示例。\n\
  \n### 1.15.3 sudo\n\n在树莓派 5 操作系统中，程序、命令和文件通过用户和组权限进行访问。每个用户都有一个唯一标识，标识为用户名或 `UID`。用户属于唯一的组，标识为组名或\
  \ `GID`。特定的用户和组有权访问可用程序、命令和文件。\n\n`sudo` 程序或命令允许以 root 用户（超级用户）或其他用户的身份运行单个命令。只有系统管理员或\
  \ root 用户可以使用名为 *sudoers* 的策略列表文件，该文件包含了用户可以执行的命令。因此，管理员控制用户拥有什么种权限。当任何用户需要运行需要\
  \ root 权限的命令时，用户在终端窗口或控制台中输入 `sudo 命令`，允许以 root 权限运行命令。然后，`sudo` 查看其策略文件中的权限列表。如果用户有运行该命令的权限，就会执行。如果用户没有权限运行该命令，`sudo`\
  \ 将拒绝执行。运行 `sudo` 不需要 root 密码，但默认需要输入用户自己的密码才能成功执行。\n\n我们在树莓派 5 系统上使用 `sudo` 命令的示例如下；\n\
  \n```\n bob@raspberrypi:∼ $ sudo -i\nroot@raspberrypi:∼#\nroot@raspberrypi:∼# exit\n\
  bob@raspberrypi:∼ $\n```\n\n\n\n\n`su` 命令（“switch user”即切换用户的缩写）允许用户在不注销账户的情况下切换角色并成为系统上的超级用户（superuser）。如果你想担任\
  \ root 角色，就必须知道 root 账户的密码。在 Raspberry Pi 5 系统上，该命令受到了限制，我们建议你将系统中需要更高权限的用户包含在 `sudoers`\
  \ 文件中。这样，他们就可以针对单条命令执行特权操作。\n\n## 章末习题\n\n40. 你是否已包含在 Raspberry Pi 5 系统的 `sudoers`\
