  \ Block 2\n          end of Block 1\n   ```\n\n   其中块 1、2、3 等及其语句 `xxxxxxxxx` 从左到右，每个块前都有四个空格的缩进垂直对齐。\n\
  \n2. **正常顺序与应用求值顺序**：Python 3 使用的数学表达式的执行顺序是 PEMDAS：括号（从内层到外层）（从左到右）、指数、乘法、除法、加法和减法。有关\
