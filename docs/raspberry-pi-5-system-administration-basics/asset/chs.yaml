  生成的字节码文件（`first.cpython-311.pyc`）可以直接如下方步骤 3 所示由解释器执行，无需重新编译。它包含了供 PVM 执行的编译字节码指令。进入子目录\
  \ `__pycache__`，并使用 `chmod u+x first.cpython-311.pyc` 命令赋予该字节码文件执行权限。\n\n```\n >>>\n\
  ```\n\n2. 或者使用 `-m py_compile` 切换——\n\n\n\n\n打开终端以获取 Bash 命令行提示符，并将当前工作目录设定为你的 Python\
  \ 脚本所在的目录。然后运行以下命令：\n\n```\n$ python3 -m py_compile first.py\n```\n\n这将生成一个类似于 `first.cpython-311.pyc`\
