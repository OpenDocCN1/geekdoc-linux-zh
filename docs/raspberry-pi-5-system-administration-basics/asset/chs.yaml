  \n## 章内练习\n\n1. 在开始安装操作系统之前，请在纸上详细列出对上述八组问题的答案。然后，阅读下方的章节参考实际安装的程序，并针对你的每一个答案，提前确定你将如何执行这些程序。这项练习旨在对你从购买、安装和使用过程中可能采取的任何特定路径进行“预演”。\n\
  \n### 1.3.2 第 56 页 安装后的选择与操作\n\n在成功安装 Raspberry Pi 5 操作系统后，你所做的极具实用价值的操作取决于你在 1.3.1\
  \ 节 中列出的个人安装前考虑，以及你如何详细实现这些考虑。正如安装前考虑中所示，你应该将此处建议的安装后考虑视为非正式的指南，教你如何选择你操作系统的某些安装后方面。\n\
  \n我们对安装后任务的精简建议专门针对我们的 Raspberry Pi 5 及其硬件配置。这些建议直接源于我们在 1.3.1 节 中安装前考虑。\n\n1. 我们\
  \ Raspberry Pi 5 的初始启动/系统介质是一张 32 GB 的 microSD 卡 SSD。\n\n2. 由于我们在 Pi 5 上安装了桌面系统，该系统将高度依赖非常方便且易于使用的\
  \ GUI 环境，因此在特定的硬件型号上无法增加已安装的物理内存来加速这种用法。请查看 1.1.1 节 和章内练习 2 中所示 `inxi` 命令的输出，以获取更多信息并了解如何在你的\
  \ Raspberry Pi 5 系统上查看物理内存大小。\n\n   如上所述，你特定的物理内存需求取决于你如何使用 Raspberry Pi 5 系统。我们不得不采用影响虚拟内存大小、分页和交换空间的默认设置，尽管根据你所拥有的\
  \ Raspberry Pi 5 型号，这些可能可能是对你重要的考虑因素。\n\n3. 使用“Pi 菜单设置 > 添加/删除软件”来安装你需要但尚未预安装的绝对必要的应用程序。对于我们来说，需要的软件按优先级排序为：Chromium\
  \ 浏览器、我们操作系统版本中的 LibreOffice 套件、FileZilla、GParted、Webmin 以及 GNU 图像处理程序 (GIMP)。我们还为所有重要应用程序在桌面上放置了图标。\n\
  \n4. 我们高度推荐的存储模型规定使用 `mdadm`，因此安装了该软件包。我们的 Raspberry Pi 5 操作系统最初构建在 32 GB 的 microSD\
  \ 卡上，但后来我们将其重建为从 1 TB 容量的 NVMe SSD 启动。随后我们后来添加了额外的 USB3 挂载介质，以符合我们的推荐存储模型。\n\n5.\
  \ 由于打印文档是我们系统需要执行的基本操作，因此我们通过 USB 连接直接将激光打印机连接并设置（通过 `CUPS`）到 Raspberry Pi 5 的硬件。\n\
  \n6. 我们使用了 Raspberry Pi 配置工具，选择“系统”选项卡来配置我们的网络设置并连接到有线内网。然后，我们将系统在本地内网上作为基本的 `ssh`\
  \ 服务器暴露出来，因此我们立即修改了 `sshd` 配置文件，并根据本章下文所示的内容构建了 `ufw` 防火墙规则以保护系统。\n\n7. 我们使用 `nginx`\
  \ 和我们的自定义 Web 程序最少地将系统暴露为 Web 服务器，但对这些应用程序采用了默认的安全措施。\n\n8. 我们在系统上只需要一组非常少的额外用户和组，因此我们立即使用下方章节所示的方法设置了它们，并根据需要添加了用户。添加新用户和组的方法如下所示。这种方法的主要优势是用户及其数据文件是与操作系统安装分开维护的。我们认为这种模型对于单用户计算机桌面系统、共享多用户计算机或中低企业级服务器同样有用。\n\
  \n有各种基于文本的 Raspberry Pi 5 操作系统命令可以调查系统硬件，以便为你进行性能调优和系统安装后修改提供基础。其中一些命令包括 `lscpu`,\
  \ `lshw`, `hwinfo`, `lspci`, `lsusb`, `inxi`, `lsblk`, `df`, `fdisk`, `mount`, `free`,\
  \ `hdparm` 以及检查 `/proc` 目录。\n\n但是，为了对系统的实际安装后配置获得非常有用的总结，我们发现 `inxi` 命令对初学者来说是最有用且快捷的。\n\
  \n## 章内练习\n\n2. 延续你在章内练习 1 中的回答，完整列出并详细说明你如何在系统上实现了你的安装前考虑。或者，如果你因为没有进行安装而没有实现它们，你将在你选择的实际硬件平台上如何实现？请使用我们针对安装后任务的精简建议作为指南来完成此练习的要求。此外，如果实际安装你系统的人方便，你也可以咨询他。\n\
  \n## 1.4 第 58 页系统服务管理、启动和关机程序\n\n在通常所说的系统“启动”方面，你首先需要考虑的是：\n\n>你希望系统如何启动？\n\n正如\
  \ 1.3 节 所示，这是你必须做的最重要的安装前考虑之一。有几个选项，它们的细节（特别是对于 ARM 架构的机器）是复杂的。\n\n本节根据你对上述问题的回答，概述了启动、管理启动过程以及优雅关闭\
  \ Raspberry Pi 5 操作系统的通用步骤。它简要概述了操作系统和硬件在成功启动和关机过程中经历的步骤。然后，它提供了关于系统管理员可用的基础但重要的\
  \ `systemd` 服务管理实用工具的进一步参考。在这些进一步参考中，我们提供了通过启用和运行新服务来操纵和更改系统服务的命令示例。\n\n### 1.4.1\
  \ 引导和启动过程\n\n以下是 Raspberry Pi 5 操作系统启动时经历的通用步骤：\n\n\n\n\n\n1. 当 Raspberry Pi 5 首次开启时，`ARM`\
  \ 核心是关闭的，而 `GPU` 核心是开启的。此时，`SDRAM` 被禁用。\n\n2. `SoC` 上的 `ROM` 启动了引导的第一阶段。\n\n3. `microSD`\
  \ 或 `USB` 启动行为由 `EEPROM` 中的配置文件控制，通可以通过 `rpi-eeprom-config` 工具进行编辑，其命令为：\n\n```\n\
  $ sudo -E rpi-eeprom-config –edit\n```\n\nEEPROM 第二阶段包含以下步骤：\n\n1. 初始化时钟和 `SDRAM`。\n\
  2. 读取 `EEPROM` 配置文件。\n3. 确定启动方式应该是重启/停止，还是从 `microSD` 卡、网络、`USB` 设备或 PCIe NVME 设备启动。\n\
  \n例如，树莓派 5 的启动过程与其它基于 Linux 的计算机相似，主要区别在于：\n\n1. 它在传统上默认使用 `microSD` 卡作为其主存储设备和启动介质，或其他备选源，且\n\
  2. 它由 `EEPROM` 控制。\n\n此处使用的“启动（booting）”是指将操作系统从完全关机状态带到 `systemd` 可以接管的节点。而在“启动（startup）”中，`systemd`\
  \ 将计算机带到稳定的、完全正常的运行状态。\n\n当系统在关机过程中挂起时，诊断问题的现代方法是使用 `journalctl` 命令检查 `systemd`\
  \ 日志。这样，如果某些进程或程序阻止系统达到关机状态，日志记录将让你看到是哪个进程或程序导致了。关机时，`systemd` 尝试停止所有服务并卸载所有文件系统。系统最终断电。我们将在下一节中详细介绍使用\
  \ `systemd` 的树莓派 5 系统如何关机。\n\n## 章末练习\n\n3. 你如何引导到位于树莓派 5 另一个启动介质上的备用环境？在 图 1.1\
