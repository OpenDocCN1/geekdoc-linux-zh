  \ Python 3 代码？\n\n### 3.4.5 线程对话：使用 queue 模块解决生产者-消费者问题\n\n在计算中，*生产者-消费者问题*（有时称为缓冲区问题）是使用各种方法同步多个线程或进程执行的经典示例。我们在第\
  \ 3.4.4 节中讨论了涉及生产者-消费者模型的一些问题。在本节中，我们将提供更多详细信息和一个通过示例，来进一步说明这一重要的计算机科学概念。\n\n该问题涉及两个任务，“生产者”进程和“消费者”进程，它们共享一个固定大小的队列（或存储池）。生产者“产生”数据并放入队列，然后开始产生更多数据。同时，消费者正在“消费”数据，即从队列中取出数据。\n\
  \n\n\n我们在这里提出的问题解决方案是：确保生产者在队列满时不会向队列中添加数据，并且消费者在队列为空时不会尝试移除数据。当消费者下一次从队列中移除一个项时，它会通知生产者，生产者随后开始重新填充队列。同样地，当消费者发现队列为空时，它也可以变为空闲状态。当生产者下一次将数据放入队列时，它会激活空闲的消费者。\n\
  \n在 Python 3 中，解决方案有多种，例如使用锁（locks）、信号量、事件同步、条件对象或变量、屏障（barriers）以及 `queue` 模块。Python\
  \ 3 的 `queue` 模块有三个有助于线程的类，它们仅区别在于从队列中检索的顺序：`Queue`、`LifoQueue` 和 `PriorityQueue`。它还使用了许多\
  \ Python 3 方法，这些方法内部包含了“锁定/释放”机制，应用这些机制可以让你高效地处理多线程进程应用程序。我们选择在第 3.4.5.2 节中使用 `queue`\
  \ 模块、其 `Queue` 类以及配套的 Python 3 方法来实现我们的示例解决方案。第 3.4.5.1 节提供了 `queue` 模块的简单概述，以及它的类和方法。\n\
  \n在 Python 3 的所有解决方案方法中，线程作为执行进程，在积极生产或消费数据时会相互“对话”，或进行`进程间通信 (IPC)`。\n\n解决方案的摘要如图图\
  \ 3.4 所示。\n\n![显示了一个生产者-消费者过程，其中生产者在队列满时等待、锁定、生产、解锁并信号非空，而消费者在队列为空时等待、锁定、消费、解锁并信号非满。](img/fig3_4.jpg)\
  \ <details id=\"kfig3_4\"><summary>图 3.4 的详细描述</summary> \n\n生产者-消费者过程以循环方式运行。如果队列满了，生产者等待，然后锁定、将项生产到队列并解锁。完成后，它信号队列非空。如果队列为空，消费者等待，然后锁定、从队列中消费项并解锁。然后它信号队列未满。生产者和消费者不断交替，通过锁和信号协调以维持生产与消费之间的平衡。</details>\
  \ \n\n图 3.4 生产者/消费者模型解决方案。返回正文。⏎\n\n#### 3.4.5.1 queue 模块、其类和方法\n\nPython 3 中的 `queue`\
  \ 模块实现了三个面向对象（OOP）队列类，它们仅在条目的检索顺序上不同。在`先进先出`（FIFO）队列中，首先放入队列的任务首先被取出。在`后进先出`（LIFO）队列中，最近添加的项首先被检索（类似于“压入式”堆栈）。在优先级队列中，条目是经过排序的，值最低的项首先被检索。\n\
  \n`queue` 模块的关键特性是，锁定和释放机制（用于临时阻塞或释放竞争线程）已实现在这些类的 OOP“公共”方法中，而程序员无需手动操作！\n\n为了方便起见，我们从\
  \ Python 文档中摘录 `queue` 模块的以下 Queue 类定义及其异常处理方法：\n\n`class queue.Queue(maxsize=0)`\
  \ \n\n这是队列的 FIFO 构造函数。`maxsize` 参数是一个整数，定义了队列中可以放置的最大数量。如果达到了 `maxsize`，则在队列上放置项将被阻塞。队列中的项必须被消费才能解除阻塞。队列大小默认为无限。\n\
  \n`class queue.LifoQueue(maxsize=0)` \n\n这是队列的 LIFO 构造函数。`maxsize` 参数是一个整数，定义了队列中可以放置的最大数量。如果达到了该大小，则在队列上放置项将被阻塞。队列中的项必须被消费才能解除阻塞。队列大小默认为无限。\n\
  \n`class queue.PriorityQueue(maxsize=0)` \n\n这是优先级队列的构造函数。如果达到了 `maxsize`，则在队列上放置项将被阻塞。队列中的项必须被消费才能解除阻塞。队列大小默认为无限。注意，队列中值最低的项首先被检索（第\
  \ 341 页值最低项是由 `sorted(list(entries))[0]` 返回的）。通常，条目是格式为 `-(priority_number, data)`\
  \ 的元组。\n\n`exception queue.Empty` \n\n当在空的 `Queue` 对象上调用非阻塞的 `.get()` 或 `.get_nowait()`\
  \ 时抛出的异常。\n\n`exception queue.Full` \n\n当在满的 `Queue` 对象上调用非阻塞的 `.put()` 或 `.put_nowait()`\
  \ 时抛出的异常。\n\n三个 Queue 类提供了表 3.9 中描述的公共方法，这些方法同样摘自 Python 3 文档。记住，公共方法可以在类外部任何地方被访问。\n\
  \n表 3.9 `queue` 类公共方法 返回正文。⏎\n\n| 方法和参数 | 说明 |\n| --- | --- |\n| `Queue.qsize()`\
  \ | 获取队列的近似大小。保证 `put()` 不阻塞。 |\n| `Queue.empty()` | 测试队列是否空的真值。保证 `get()` 不阻塞。\
  \ |\n| `Queue.full()` | 测试队列是否满的真值。保证 `get()` 不阻塞。 |\n| `Queue.put(item, block=True,\
  \ timeout=None)` | 将项添加到队列。如果 `block` 为真 且 `timeout` 为 None，则发生阻塞。如果 `timeout` 是一个正数，则阻塞该秒数后抛出\
  \ `Full` 异常。如果 `block` 为假，如果有空间则将项放入队列。如果没有空间，抛出 `Full` 异常并忽略超时。 |\n| `Queue.put_nowait(item)`\
  \ | 等于参数为 `item, false` 的 `.put`。 |\n| `Queue.get(block=True, timeout=None)` | 从队列删除并返回一个项。如果\
  \ `block` 为真 且 `timeout` 为 None，则阻塞直到项可用。如果 `timeout` 是一个正数，则最多阻塞 `timeout` 秒，如果没有项可用则抛出\
  \ `Empty` 异常。否则（block 为假），如果立即可用则返回项，否则抛出 `Empty` 异常。 |\n| `Queue.get_nowait()`\
  \ | 等于 `.get(False)`。 |\n| `Queue.task_done()` | 信号已的任务已完成。 |\n| `Queue.join()`\
  \ | 阻塞直到队列中的所有项都被检索并处理。未完成任务的计数根据从队列中添加或移除项而增加或减少。 |\n\n\n\n\n\n以下 Python 3 代码汇集了本章大部分语法和结构。这个最后的示例演示了如何在多线程程序中使用带有\
  \ `queue.Queue` 类的 FIFO（先进先出）队列来解决 Python 3 生产者问题。它使用了面向对象编程（OOP）、`threading` 模块及其方法来启动两个线程——生产者（Producer）和消费者（Consumer）。\n\
  \n根据参考资料，关于我们如何使用 `Queue` 类获取生产者-消费者问题的解决方案概述如下：\n\n> “生产者使用 `.put` 方法在队列上放置一个数据。`queue`\
  \ 模块的实用性和优势在这里体现得最明显——`.put` 会锁定队列，检查队列是否满，如果队列已满则调用内部的 `.wait()` 暂停生产者。然后，消费者使用\
  \ `.get` 方法在从队列中移除数据之前获取锁，而 `.get` 会检查队列是否为空。如果队列为空，消费者将进入等待状态。”\n\n> “`.get()`\
