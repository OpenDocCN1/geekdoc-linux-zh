  5. 提示输入用户的个人信息，如电话、办公联系方式等。\n\n以下是在文本命令行界面中添加新用户的两个简单示例。第一个示例说明了如何以超级用户身份从命令行交互式地创建一个单个用户账户。如果你在创建用户账户时出错，可以随时使用\
