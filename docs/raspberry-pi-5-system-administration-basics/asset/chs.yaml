  到本章为止，我们通过图形化 IDE 与 Python 3 交互，尽管基本上是基于文本的方式，我们在 Thonny 的脚本和 Shell Area 中输入命令，在编辑器或命令行执行\
  \ Python 3.11.2 以文本形式查看结果。在本节中，我们将使用 Python 3 构建一个基于“部件”（widget 是窗口小部件）的 GUI，我们仍然以文本形式创建和执行\
  \ Python 3 代码，但以部件图形的形式查看 Python 3 脚本的输出。我们使用 `tkinter` 作为 GUI 接口或工具包。`tkinter`\
  \ 是 *TK 接口* 的缩写。而 *TK*（工具包）是一个平台无关、可自定义且可配置的 GUI 库。Python 模块 `tkinter` 允许 Python\
  \ 3 程序与 TK 库交互，并在树莓派显示器上产生图像和其他形式的图形。为了实现这一点，我们假设：\n\n1. 你正在使用 GUI 桌面环境与树莓派 5 系统交互，并且该图形系统基于\
  \ X Window System。毕竟，这就是 Thonny！一个图形化 IDE。因此，当我们使用 `tkinter` 编程时，我们也具备创建 Python\
  \ 3 GUI 的能力。\n\n**注意**\n如果你将树莓派 5 系统的图形系统切换为 X Window System，`inxi` 命令的输出（如第 1 章所示）将产生描述显示系统的行：\n\
  \n```\nDisplay: x11 server: X.Org v: 1.21.1.7 with: Xwayland v: 22.1.9 driver: X:loaded:\n\
  ```\n\n\n\n\n大多数 `tkinter` 应用只要启用了 XWayland 就能正常工作。如果你运行的是没有启用 XWayland 的纯 Wayland\
  \ 会话，除非 `Tk` 在编译时启用了完整的 Wayland 支持，否则 `tkinter` 可能无法正常运行。如果你遇到问题，使用 XWayland 作为回备方案会有帮助。再次，如果你已经切换到纯\
  \ Wayland，你可能无法获得与我们相同的的结果，或者根就无法获得任何结果。\n\n2. 你的 Raspberry Pi 5 系统上安装了 Python 3.11X\
  \ 或更高版本。本节及后续章节中的命令行会话、章节练习、示例以及问题与思考，都要求你的 Raspberry Pi 5 系统上安装了至少此版本的 Python 3。\n\
  \n我们对使用 `tkinter` 构建 GUI 的涵盖使用了 Python 3.11.2 以及适用于该 Python 3 版本的相应 `tkinter` 模块。取决于你使用的默认\
  \ Python 3 版本，以及你所运行的特定 Raspberry Pi 5 OS 发行版，`tkinter` 的安装说明可能与第 3.4.3.1 节中所示略有不同，但基本上是一样的。\n\
  \n### 3.4.3.1 安装 tkinter\n\n与 Python 3 兼容的标准小部件 GUI 包在 Python 3.11.2 中命名为 `tkinter`。\n\
  \n**注意** 为了向 Python 3 添加小部件 GUI 组件和功能，你必须能够将此组件包导入到你的 Python 3 会话中。\n\n第 320 页在本节中，在我们所展示的\
  \ Python 3 GUI 脚本尽可能且可行的情况下，我们将从一组“样式化”的小部件集中添加小部件。这些部件从 TK 8.5 版本起就可用，并被称为 `ttk`\
  \ 小部件。\n\n你可以轻松测试默认 Python 系统是否可可用 `tkinter`。在 Python 命令行中输入：\n\n```\n >>> import\
  \ tkinter\n```\n\n如果你收到模块不存在的错误信息或类似的错误信息，则你必须安装 `tkinter` 包。要实现这一点，请在 Bash 命令行中使用如下所示的\
  \ `apt` 命令：\n\n```\n $ sudo apt-get install python3-tk\n```\n\n你还可能需要使用以下命令安装所需的\
  \ Tcl/Tk 开发包：\n\n```\n $ sudo apt-get install tk-dev\n输出已截断...\n$\n```\n\n### 3.4.3.2\
  \ tkinter 工具包图形用户界面\n\nGUI 允许你使用鼠标或其他指向设备（例如在平板电脑上的手指），而不是仅仅使用键盘与正在运行的程序交互。通常，当你使用\
  \ CUI（例如在 Bash Shell 会话期间）并执行命令时，命令完成的任务按某种结构化的顺序执行，方式可以是确定的（计数方式）或不定的（逻辑方式）。然后命令最终终止。但我们在下面章节中展示的\
  \ Python 3 GUI 程序创建了显示在屏幕上的屏幕小部件，然后生成图标和小部件的 Python 3 脚本会“等待”用户对它们进行操作。\n\n这种编程结构是事件驱动的。*GUI\
  \ 程序（特别是 X 窗口图形系统）是事件驱动的。* 我们在下方提供的示例和描述中强调了这种编程结构。\n\n一个有意义且实用的 Python 3 脚本 GUI\
  \ 程序通常具有以下某些基本内容和结构：\n\n1. 产生了某种数据，或者数据已经存在，例如以 Raspberry Pi 5 上数字或数据库文本的形式存在。这些数据本身可以通过多种方式生成。它可以由放置在\
  \ Python 3 脚本中 GUI 构建组件之前的 Python 3 用户编写模块生成，这就是我们所有示例中展示的 Python 3 GUI 编程风格。它也可以在\
  \ Python 3 GUI 脚本运行时交互式输入（第 321 页）。它可以使用以前由其他应用程序生成的现有数据，甚至可以在 Python 3 脚本执行时使用在\
  \ Python 3 环境内生成数据的 C 程序！\n\n2. 小部件被创建并组织在一个封装窗口框内，然后显示在用户的屏幕上。这些小部件对象是 `tkinter`\
  \ 中主小部件类的实例，包含了 GUI 函数，这些函数被用于选择并指定对用户输入以及可能的数据生成应用程序事件的特定类型的响应。\n\n3. 对步骤 2 中的实例进行“钩选”或“连结”，这些实例利用“回调”GUI\
  \ 函数来访问你想显示或以其他方式修改的数据。例如，你可以使用任何*可调*的 Python 3 对象作为回调。这些可以是普通的 Python 3 函数、绑定方法、lambda\
  \ 表达式以及任何其他可调用对象。\n\n   **注意** 以上是 Python 3 GUI 编程中最关键、因此最实用的方面。\n\n4. 步骤 2 和 3\
  \ 存在于一个处理用户事件的无限事件驱动循环中。当发生用户事件（如按下鼠标按钮）时，事件驱动循环会调用与特定事件关联函数。\n\n5. 数据被修改或产生，而屏幕上没有明显的可见变化，或者在屏幕上发生了图形变化。这是“请求”步骤。\n\
  \n6. 循环继续等待事件并处理它们，直到发生可能的终止事件。\n\n正如我们在第 3.4.3.3 节中所示，可以使用 `tkinter` 选择并构建 `tkinter`\
  \ 小部件来显示并连接到数据上。\n\n#### 3.4.3.2.1 非事件驱动的 tkinter\n\n这引发了一些有趣的问题：什么样的图形不是事件驱动的，哪些应用程序或程序通过这种方式显示数据？基本上是静态的、非交互的计算机图形。你能列出其中任何一个吗？而且，`tkinter`\
  \ 能够进行这种非事件驱动的处理吗，具体是如何做的？\n\n嗯，这是对最后一个问题的回答。\n\n正如我们所注意的，`tkinter` 主要为事件驱动的图形编程设计，程序对用户输入或系统事件做出响应。然而，你也可以通过使用名为“动画循环”的技术使用\
  \ `tkinter` 创建非事件驱动的图形。\n\n在非事件驱动的程序中，你需要创建自己的循环来不断更新图形元素。\n\n这里有一个如何使用 `tkinter`\
  \ 创建非事件驱动图形程序的简单示例：\n\n在上面的示例中，`update_graphics()` 函数通过使用 `root.after()` 方法被重复调用，该方法调度在指定延迟（毫秒）后调用一个函数。在\
  \ `update_graphics()` 函数内部，你可以根据需要更新你的图形元素。在这种情况下，示例通过调用 `canvas.move()` 方法在画布上移动矩形。\n\
  \n\n\n\n\n通过调整传递给 `root.after()` 的延迟，你可以控制更新的速度。较短的延迟会导致更新更快、动画更流畅，但它们也会消耗更多的系统资源。\n\
  \n第 323 页 请记住，`tkinter` 并不是针对高性能图形或动画优化的！对于更复杂或高要求的图形，你可能需要考虑使用如 Pygame 或 OpenGL\
  \ 等专用库或框架。\n\n### 3.4.3.3 基础部件构建技术\n\n部件（Widgets）是在屏幕上构建的图像，它们具有独特的“样式”，这取决于你想要显示的信息细节以及你希望它们参与的交互类型。部件的“样式”由许多复杂的图形组件控制，例如\
  \ X 窗口系统、使用的显示管理器以及操作系统本身。`tkinter` 模块包含两个版本的部件：默认版本（或称为“通用版本”），它使得无论运行什么种窗口系统、操作系统或显示管理器，部件看起来都一样。`tkinter`\
  \ 还实现了模拟特定窗口系统、操作系统或显示管理器“样式”的部件。你导入了哪些 `tkinter` 模块决定了可以使用哪些部件集来生成事件和“回调”。实现此的标准方法是使用\
  \ `tk` 模块来访问“通用”部件，使用 `ttk` 模块来访问“样式”部件。你必须导入 `tk` 模块，因为它允许你创建一个“根”（root）或最外层的框架窗口。如果你想要“样式”部件，可以选择性导入\
