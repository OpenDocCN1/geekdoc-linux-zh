  \ http.server` Web 服务器在请求停止进入它后不会停止运行。它不是套接字激活的！在这个简单示例中构建超时将是一个有趣的练习，以便 Web 服务器不会一直运行。而且，如你所见，简单的套接字激活示例通过单个且非常简单的\
