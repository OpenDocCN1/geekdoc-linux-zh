  从第 3.4 节](#chapter3.xhtml_sec3_5) 参考中提取的某些术语的简化缩写词汇表如下：\n\n*   **类（Class）**：创建自定义对象的模板。类定义通常包含在类实例上操作的方法定义。\n\
  *   **表达式（Expression）**：可以求值为某个特定值的语法片段。换句话说，表达式是字面量、名称、属性访问、运算符或函数调用等表达式元素的累积，这些元素都返回一个值。与许多语言不同，并不是所有的语言结构都是表达式。还有不能用作表达式的语句，例如\
  \ `print` 或 `if`。赋值也是语句。\n*   **不可变性（Immutable）**：具有固定值的对象。不可变对象包括数字、字符串和元组。此类对象无法被更改。如果必须存储不同的值，必须创建一个新对象；例如字典中的键。\n\
  *   **可迭代（Iterable）**：能够逐个返回其成员的对象。可迭代对象的示例包括所有序列类型（如列表、字符串和元组）以及某些非序列类型，如 `dict`\
  \ 和 `file`，以及由你通过 `__iter__()` 或 `__getitem__()` 方法定义的任何类对象。可迭代对象可以用于 `for` 循环以及许多其他需要序列的地方。当一个可迭代对象作为参数传递给内置函数\
  \ `iter()` 时，它会返回该对象的迭代器。该迭代器适用于对集合值进行一次遍历。在使用可迭代对象时，通常不需要手动调用 `iter()` 或自己处理迭代器对象。`for`\
  \ 语句会自动为你完成这些工作，创建一个临时未命名变量在循环期间持有迭代器。\n*   **Lambda（表达式）**：由单个表达式组成的匿名内联函数，该表达式在函数被调用时求值。创建\
  \ lambda 函数的语法是 `lambda [arguments]: expression`。\n*   **方法（Method）**：定义在类体内部的函数。如果作为类实例的属性调用，该方法会将实例对象作为其第一个参数（通常称为\
  \ `self`）。\n*   **可变（mutable）**：可以改变其值但保持其类标识的对象。\n*   **Python 风格的（Pythonic）**：紧密遵循\
  \ Python 语言常用用法或代码，而不是使用其他语言常见的结构来实现代码。例如，Python 中的一种常用用法是使用 `for` 语句遍历可迭代对象的所有元素。许多其他语言没有这种结构，因此不熟悉\
  \ Python 的人有时会使用数值计数器：\n\n```\nfor i in range(len(money)):\n    print (money[i])\n\
  ```\n\nPython 风格的方法：\n\n```\nfor bills in money:\n    print (bills)\n```\n\n\n\n\
  \n\n- **Sequence**（序列）：一种可迭代对象，支持通过 `__getitem__()` 特殊方法使用整数索引进行高效元素访问，并定义了返回序列长度的\
  \ `len()` 方法。一些内置序列类型有 `list`、`str`、`tuple` 和 `unicode`。注意 `dict` 也支持 `__getitem__()`\
  \ 和 `__len__()`，但它被视为映射而非序列，因为查找使用的是任意不可变键而非整数。\n- **type**（类型）：对象的类型种类，例如整数或字符字符串。348\
