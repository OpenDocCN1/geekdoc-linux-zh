  \n### 1.1.2 FileZilla\n\nFileZilla 名义上是一个图形化的 ftp 客户端和服务器程序，可以使用 `ssh` 作为系统之间的隧道或通道。它许多实用的功能和菜单选项，允许系统管理员通过网络全局成功、安全且高效地备份和恢复单个文件或目录。\n\
  \n它并不是后续章节所示命令行功能的替代品或等价物。\n\n在我们案例中，客户端和服务器（即运行 Raspberry Pi 5 OS 系统的本地机器和运行相同操作系统的远程机器）之间必须启用\
  \ `ssh` 通信协议。要了解更多关于在 Raspberry Pi 5 OS 系统之间建立 `ssh` 的信息，请参见章节 1.1.3。你可以拥有远程服务器账户的登录权限，如果启用了，你也可以匿名登录。\n\
  \n在客户端上启动 FileZilla 后，要登录远程服务器，你需要提供服务器的 IP 地址、用户名、密码以及端口号（`ssh` 为 22）。一旦成功登录，本地机器的目录和文件结构将显示在左侧。远程机器的目录结构显示在右侧。要在机器之间传输文件或目录，只需在左侧或右侧相应的面板之间拖放即可。如果你正在覆盖之前传输的文件或目录，FileZilla\
  \ 的默认设置是给你一个覆盖或重命名正在传输文件的机会。\n\nFileZilla 屏幕顶部还有许多其他菜单选项，允许你影响偏好、设置书签等。例如，通过“管理书签”和“站点管理器”菜单，你可以在登录远程服务器站点时，自动让多个本地目录和远程目录可用于\
  \ `ssh` 传输。\n\n### 1.1.3 使用 systemd 进行 SSH 和系统服务管理：VSFTP\n\nSecure Shell (SSH) 是一种加密网络协议，用于通过不安全的网络安全地访问和管理远程系统。它允许客户端和服务器之间进行加密通信，保护登录凭据和命令执行等敏感数据。SSH\
  \ 广泛用于远程管理、安全文件传输（通过 `SCP` 或 `SFTP`）以及隧道服务。它支持密码、公钥和多因素认证等身份验证方法。SSH 默认运行在端口 22，对于安全管理服务器至关重要，特别是在\
  \ Raspberry OS 环境中，通过强加密和完整性验证防止未经授权的访问。\n\nVery Secure FTP (VSFTP) 是一种旨在安全、性能和稳定的\
  \ FTP 服务器。适用于 Unix 和 Linux 环境中客户端与服务器的文件传输与传统的 FTP 不同，VSFTP 通过支持 FTPS（基于 SSL/TLS\
  \ 的 FTP）加密连接以及集成系统级身份验证增强了安全性。它轻量级、可扩展且可配置，适用于高流量环境。通过 chroot 锁定、匿名登录控制和带宽限制等功能，VSFTP\
  \ 确保了文件传输的安全与高效，同时减少了与旧版 FTP 服务器相关的漏洞。它是托管安全 FTP 服务的首选。\n\n#### 1.1.3.1 通过 SSH 客户端在\
  \ Raspberry Pi 5 OS 机器之间连接\n\n我们下面展示的基本方法和技术允许用户在一台 Raspberry Pi 5 OS 计算机上通过 SSH\
  \ 协议远程登录并退出另一台计算机。你用于 SSH 登录另一台计算机的计算机被称为 SSH `客户端`。你想要通过 SSH 登录的计算机被称为`服务器`或`主机`系统。\n\
  \n\n\n\n在使用此方法之前，客户端和服务器系统都能够通过 `SSH` 通道进行通信。换句话说，第 34 页的服务器系统必须安装并启用 SSH 服务端软件包。这通常在大多数\
  \ Linux 系统上默认是不开启的，因此你必须按照针对你所特定 Linux 发行版提供的安装和/或启用说明来实现这一目标。\n\n在最新的树莓派 5 操作系统上启用\
  \ SSH 服务端软件有几种方法，如下所示：\n\n1.  从零开始，你可以在将系统烧录到你可能运行系统的 microSD 卡时，直接启用它。在安装过程中，一个方便的图形化对话框允许你执行此操作。\n\
  \n2.  在已经安装了系统的系统上，在终端窗口中，你可以使用命令 `sudo raspi-config`，进入树莓派软件配置工具的菜单选择 `Interface\
  \ Options>SSH`，并启用它。\n\n    ******或者******\n\n    从“偏好设置”（Preferences）菜单启动树莓派配置工具，并使用\
  \ `SSH:` 选项右侧的滑动按钮执行相同的操作。\n\n3.  默认情况下，我们的树莓派 5 操作系统系统中没有安装 SSH 服务端软件包，但在终端窗口中，我们可以通过以下命令对其进行安装：\n\
  \n    ```\n    $ sudo apt-get install openssh-server\n    ```\n\n    在成功执行上述命令后，SSH\
  \ 服务端“服务”被安装、启动并启用。“已启用”（enabled）意味着在后续树莓派 5 操作系统系统重启时能够自动启动。\n\n    客户端 SSH 软件在大多数\
  \ Linux 系统实现中都是默认安装的，包括我们的树莓派 5 操作系统系统中。\n\n******注意******\n\n用户必须知道远程服务器系统上的有效用户名/密码对，才能登录远程系统！\n\
  \n### 1.1.3.2 登录和注销步骤\n\n在安装了服务端软件后，我们展示了在此双向通信对话框中可以使用的三种可能的方法。\n\n首先，如果用户之前已经从客户端成功登录过主机，且身份验证密钥没有更改。其次，如果用户以前从未从客户端成功登录过主机。第三，如果用户以前登录过主机，但自上次成功登录以来，第\
  \ 35 页主机上的身份验证密钥已经发生了更改。这些都是你在使用这种远程登录方法时可能随时碰的实际情况。\n\n用户输入的内容以**粗体**显示。\n\n####\
  \ 方法 1. 之前成功登录过：\n\n```\n$ ssh bob@192.168.1.15\nbob@192.168.1.15's password: www\n\
  Linux raspberrypi 6.1.21-v8+ #1642 SMP PREEMPT Mon Apr  3 17:24:16 BST 2023 aarch64\n\
  \nThe programs included with the Debian GNU/Linux system are free software;\nthe\
  \ exact distribution terms for each program are described in the\nindividual files\
  \ in /usr/share/doc/*/copyright.\n\nDebian GNU/Linux comes with ABSOLUTELY NO WARRANTY,\
  \ to the extent\npermitted by applicable law.\nLast login: Fri May  5 07:17:44 2023\
  \ from 192.168.1.11\n$ Execute Command Line Linux Commands\n$ logout\nConnection\
  \ to 192.168.1.15 closed.\n$\n```\n\n#### 方法 2. 从未登录过：\n\n```\n$ ssh bob@192.168.1.15\n\
  The authenticity of host '192.168.1.15 (192.168.1.15)' can't be established. ECDSA\
  \ key\nfingerprint is SHA256:uZpqi4U6uBN5SOBVFRbqbl5HspmV3eZAw/nUvPBTS5I.\nAre you\
  \ sure you want to continue connecting (yes/no)?yes\nWarning: Permanently added\
  \ '192.168.1.15' (ECDSA) to the list of known hosts.\nBob@192.168.1.15's password:\
  \ www\nLinux raspberrypi 6.1.21-v8+ #1642 SMP PREEMPT Mon Apr  3 17:24:16 BST 2023\
  \ aarch64\n\nThe programs included with the Debian GNU/Linux system are free software;\n\
  the exact distribution terms for each program are described in the\nindividual files\
  \ in /usr/share/doc/*/copyright.\n\nDebian GNU/Linux comes with ABSOLUTELY NO WARRANTY,\
  \ to the extent\npermitted by applicable law.\nLast login: Fri May  5 07:17:44 2023\
  \ from 192.168.1.2\n$ Execute Command Line Linux Commands\n$ logout\nConnection\
  \ to 192.168.1.15 closed.\n$\n```\n\n#### 方法 3. 以前登录过，但主机密钥已更改：\n\n```\n$ ssh bob@192.168.1.15\n\
  @@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@Page 36\n@    WARNING:\
  \ REMOTE HOST IDENTIFICATION HAS CHANGED!      @\n@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@\n\
  IT IS POSSIBLE THAT SOMEONE IS eavesdropping on you right now (man-in-middle)!\n\
  The host key for 192.168.1.15 has changed. It is also possible that a host key has\
  \ just changed.\nThe fingerprint sent by the remote host is SHA256:uZpqi4U6uBN5SOBVFRbqbl5HspmV3eZAw/nUvPBTS5I.\n\
  Please contact your system administrator.\nAdd correct host key in /home/bob/.ssh/known_hosts\
  \ to get rid of this message.\nOffending ECDSA key in /home/bob/.ssh/known_\n```\n\
  \n在上述三种方法中，假设用户在两个系统中都有相同的用户名以及可能的密码。\n\n在方法 2 中，在用户输入 `yes` 并按回车后，将生成密钥。\n\n在方法\
  \ 3 中，在尝试建立 SSH 连接失败后，错误信息显示主机密钥已更改。错误信息中一个非常有用的部分是指令：\n\n```\nAdd correct host\
  \ key in /home/bob/.ssh/known_hosts to get rid of this message.\nOffending ECDSA\
  \ key in /home/bob/.ssh/known_\n```\n\n因此，客户端机器上 `/home/bob/.ssh/known_hosts` 文件中的冲突密钥是通过以下命令删除的：\n\
  \n```\n$ ssh-keygen -f \"/home/bob/.ssh/known_hosts\" -R \"192.168.1.15\"\n```\n\
  \n然后将生成新密钥，可以进行交换并继续登录。\n\n上述三种方法中显示 `Execute Command Line Linux Commands` 的行是用户输入在本章及本书其余部分所示任何有效\
  \ Linux 命令的地方。最后，输入 `logout` 后，用户切断 SSH 通道连接并返回本地客户端系统的命令行提示符。\n\n## 1.2 将树莓派 5\
  \ 操作系统安装到各种介质以及初步系统配置\n\n******注意******\n\n我们没有展示如何在硬件上原本没有操作系统的情况下进行“裸机”（即全新的）树莓派\
  \ 5 操作系统安装。这是因为许多新用户在购买硬件时，已经附带了加载了所需操作系统的 microSD 卡。关于进行裸机安装的说明，你可以从树莓派基金会网站免费方便地获取：\n\
  \n**[`www.raspberrypi.com/documentation/computers/getting-started.html`](https://www.raspberrypi.com/documentation/computers/getting-started.html)**\n\
  \n以下子章节包含这些操作：\n\n\n\n\n\n*   章节 1.2.1 – 本节介绍了如何将 64 位 Raspberry Pi 5 操作系统下载并安装到\
  \ microSD 卡中，以便你可以将该卡插入 Raspberry Pi 5 的硬件卡槽并对其进行操作。树莓派 5 正式支持容量高达 1TB 的 microSD\
  \ 卡，前提是格式化正确（大于 32GB 的卡通常使用 exFAT）。然而，大于 1TB 的更大的 microSD 卡如果格式化为 FAT32 或 exFAT\
  \ 也可以工作，但不能保证兼容性。\n\n**注意**\n\n为了获得最佳性能，请使用 UHS-I (U3) 或 A2 评级的 microSD 卡，以确保更快的读写速度。\n\
  \n*   章节 1.2.2 – 提供了 microSD 卡、USB 3.0 接口 SSD 和 NVMe SSD 之间的性能标准比较。\n\n*   章节 1.2.3、1.2.4、1.2.5\
  \ – 展示了如何在 PCIe 总线上安装外部挂载的 NVMe SSD 介质、如何从 NVMe SSD 而非 microSD 卡启动，以及如何从 USB3 挂载的\
  \ SSD 启动并运行 Raspberry Pi 5 操作系统。\n\n以下子章节假设你将使用为 64 位 ARM 架构 Raspberry Pi 5 硬件设计的最新版软件系统。请注意，书中插图的某些系统管理任务在操作系统软件的早期（或后期）版本中可能会以不同的方式完成！此外，本节假设你将从持久性介质运行\
  \ Raspberry Pi 5 操作系统系统（可以是插入树莓派硬件提供的插槽的 microSD 卡，也可以来自 NVMe 或 USB3 挂载的 SSD 驱动器）。\n\
  \n### 1.2.1 Imager 下载及将 64 位 Raspberry Pi 5 操作系统安装到 microSD 卡\n\n#### 目标：\n\n详细介绍如何从挂载的\
  \ microSD 卡创建、从其启动并运行你的 Raspberry Pi 5 系统。\n\n#### 前提条件：\n\n我们在本示例中在以下 Raspberry\
  \ Pi 5 系统上执行操作：\n\n```\n System:\n  Host: raspberrypi Kernel: 6.12.34+rpt-rpi-2712\
  \ arch: aarch64 bits: 64\n    compiler: N/A Desktop: LXDE v: 0.10.1 Distro: Debian\
  \ GNU/Linux 12 (bookworm)Page 41\nMachine:\n  Type: ARM System: Raspberry Pi 5 Model\
  \ B Rev 1.0 details: N/A rev: c04170\n    serial: a5b3f4f94c31353d\n```\n\n####\
  \ 背景：\n\nRaspberry Pi 5 操作系统传统上从挂载在硬件上的 microSD 卡启动并运行。\n\n#### 要求：\n\n按照所示顺序执行以下步骤，以完成本示例的要求。\n\
  \n本节可能是将 Raspberry Pi 5 操作系统获取到硬件中最简单且最常用的方法。在本书编写时，执行此操作的特定说明可以在以下网站找到：\n\n[`www.raspberrypi.com/documentation/computers/getting-started.html`](https://www.raspberrypi.com/documentation/computers/getting-started.html)\n\
  \n在此处的呈现如下：\n\n1.  在一台已经运行已安装操作系统并连接到互联网的 Raspberry Pi 5 上，在命令提示符输入以下内容：\n\n   \
  \ ```\n    $ sudo apt install rpi-imager\n    ```\n\n2.  将 USB-SD 读卡器连接到该电脑，并插入一张容量足够的\
  \ microSD 卡。我们使用 32 GB 的 microSD 卡完成了此步骤。\n\n3.  从 Pi 菜单中，选择 Accessories > Raspberry\
  \ Pi Imager，以运行 Raspberry Pi Imager，并选择：\n\n    1.  选择 Raspberry Pi 5 作为 Raspberry\
  \ Pi 设备。\n    2.  选择 Raspberry Pi OS (64-bit) 作为操作系统。\n    3.  选择第 2 步中的 microSD\
  \ 卡作为存储设备。\n    4.  点击 Write（写入）并等待安装完成。\n\n4.  此时，在运行 Imager 期间，如果你需要，可以选择“Advanced\
  \ Options（高级选项）”，并启用 SSH 和主机名（hostname）等设置。\n\n5.  Imager 运行完成后，退出程序，从读卡器中取出 microSD\
  \ 卡（注意不是运行你 Raspberry Pi 5 的那张 microSD 卡！），将其放入你想运行操作系统的 Raspberry Pi 5 硬件中。启动进入该\
  \ microSD 卡并按照所示说明进行操作。\n\n### 1.2.2 不同 Raspberry Pi 5 操作系统介质的比较\n\n如果你需要更高的存储和性能，请考虑在\
  \ Raspberry Pi 5 上使用 USB 3.0 SSD 而非 microSD 卡。\n\n使用 USB 3.0 SSD 相比 microSD 卡在性能上有什么优势，特别是在速度方面？\n\
  \n在 Raspberry Pi 5 上使用 USB 3.0 SSD 代替 microSD 卡可以提供显著的性能优势，特别是在速度、可靠性和使用寿命方面。以下是它们的比较情况：\n\
  \n1.  **速度：读写性能**\n\n    | 存储类型 | 读取速度 | 写入速度 |\n    | --- | --- | --- |\n    |\
  \ MicroSD (UHS-I, A2) | ∼100 MB/s | ∼80 MB/s |\n    | USB 3.0 SATA SSD | ∼400–500\
  \ MB/s | ∼300–500 MB/s |\n    | USB 3.0 NVMe SSD | ∼800–1000 MB/s | ∼700–900 MB/s\
  \ |\n\n    树莓派 5 的 microSD 卡接口受 UHS-I 速度限制，因此即使是高端 microSD 卡也会比 SSD 慢得多。\n\n   \
  \ 树莓派 5 的 USB 3.0 端口支持高达 5 Gbps（∼625 MB/s），使得 SSD 快得多。\n\n2.  **启动时间和系统性能**\n\n\
  \    *   与 microSD 卡相比，从 SSD 启动可以将启动时间缩短一半或更多。\n\n3.  **可靠性与耐性**\n\n    *   microSD\
  \ 卡在频繁写入循环下磨损更快。\n\n4.  **热量考量**\n\n    *   NVMe SSD 在负载下可能会发热；散热片或导热垫会有帮助。\n\n\
  5.  **最佳使用场景**\n\n    *   运行操作系统、Docker 容器、NAS 或数据库密集型任务。\n\n\n\n\n\n由于您提供的文本似乎包含了两个完全不同的部分（一部分是关于\
  \ SSD 性能的对比，另一部分是关于 Raspberry Pi 5 安装 NVMe SSD 的教程），我将根据您的格式要求，对这两部分内容分别进行专业的排版处理。\n\
  \n### 第一部分：SSD 性能与对比分析\n\n| 存储类型 | 启动时间 |\n| :--- | :--- |\n| USB 3.0 NVMe SSD |\
  \ ~12–18s |\n| PCIe NVMe SSD | ~10–15s |\n\n- **`PCIe NVMe SSDs` 启动最快**，因为它们跳过了\
  \ USB 控制器的开开销。\n- **`USB 3.0 NVMe SSDs` 由于 `USB 协议开销` 速度稍慢**。\n\n## 3.可靠性与耐用性\n\n\
  | 存储类型 | 寿命 (TBW-写入字节) | 数据损坏风险 |\n| :--- | :--- | :--- |\n| MicroSD 卡 (A2) | `150–300\
  \ TBW` (消费级) | **高（写入周期有限、掉电可能导致损坏）** |\n| USB 3.0 SATA SSD | `300–600 TBW` (典型\
  \ SATA) | **低** |\n| USB 3.0 NVMe SSD | `400–1000 TBW` (消费级 NVMe) | **低** |\n| PCIe\
  \ NVMe SSD | `400–1000+ TBW` (消费级 NVMe) | **最低（直接 PCIe 访问，无 USB 开销）** |\n\n- **`PCIe\
  \ NVMe SSDs` 提供最佳耐用性和最低故障率**，因为它们避免了 USB 瓶颈和潜在的供电问题。\n- **`MicroSD cards` 的可靠性最差**，因为它们的写入周期有限。\n\
  \n# 4. 热量考量\n\n| 存储类型 | 发热量（负载下） | 是否需要散热 |\n| :--- | :--- | :--- |\n| MicroSD 卡\
  \ | `低 (<40°C)` | ![](img/ufig1_1.jpg) 否 |\n| USB 3.0 SATA SSD | `中等 (~45°C–50°C)`\
  \ | 否 |\n| USB 3.0 NVMe SSD | `高 (~50°C–60°C)` | 可能（建议使用散热片） |\n| PCIe NVMe SSD\
