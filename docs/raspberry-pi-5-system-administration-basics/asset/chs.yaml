  本章的基础前提是：(1) 了解如何在命令行中输入语法正确的 Linux 命令（详见 第 0 章），(2) 拥有一台专用的树莓派 5 计算机，并有最新版本的树莓派\
  \ 5 操作系统供你安装和运行，以及 (3) 能够在其上进行操作。\n\n## 1.1 树莓派 5 的系统管理\n\n本章的核心前提是输入语法正确的 Linux\
  \ 命令（详见 第 0 章）、拥有一台专用的树莓派 5 计算机并配有最新版本的树莓派 5 操作系统供安装和运行，以及能够在其上进行操作。\n\n为了执行本章中的许多任务，绝对需要超级权限。这意味着你需要超级用户密码，你可以在安装树莓派\
  \ 5 系统时设置该密码。此外，在 [www.github.com/48/Raspberry-5-OS](https://www.github.com/48/Raspberry-5-OS)\
  \ 网站上提供了其他材料。\n\n如果你在不带任何选项的情况下执行 `su`，系统会提示你输入密码，并且 shell 的当前工作目录将是你的家目录。当你完成 root\
  \ shell 中的命令运行后，应该输入 `exit` 以返回受限权限模式。\n\n**注意**：root shell 不是登录 shell。\n\n相比之下，`sudo`\
  \ 以 root 权限运行单个命令。当你执行\n\n```\n$ sudo command\n```\n\n系统会提示你输入当前账户的密码，然后以 root 用户身份运行任何\
  \ `command`。要使用 `sudo` 命令，你必须属于 sudoers 组。\n\n`su` 和 `sudo` 都用于执行具有 root 权限的程序。\n\
  \n在我们通过实践学习的方法中，选择了一系列常见的系统管理任务，专门针对个人新手树莓派 5 用户，如上所述。\n\n尽管我们展示了这些任务的基础，但可能将这些常见任务分为由管理员执行的和由普通用户执行的任务。\n\
  \n现代 Linux 内核（或 Linux 超内核 `systemd`）作为树莓派 5 操作系统的核心，其执行的三大主要功能是：\n\n\n\n\n\n- 并发、虚拟化与安全持久化。\n\
  \n## 1.1 轻松进行系统管理\n\n如何以简单的方式完成本章所示的大部分操作？\n\n使用 `Webmin`。\n\n`Webmin` 是一个现代的基于\
  \ Linux 浏览器的 GUI 系统管理工具，它允许你以非常直观、快速且简单的方式完成本章所示许多系统管理任务。我们强烈建议你先按照我们在这里提供的说明，在你的\
  \ Linux 系统上下载并安装 `Webmin`。然后，你可以在开始本章后续内容之前探索 `Webmin` 的功能，甚至可以返回 `Webmin` 查看我们在本章后续部分显示的某些操作在\
  \ `Webmin` 中是如何实现的（或是无法实现！）。\n\n本节详细介绍了如何在 Raspberry Pi 5 OS 上安装 `Webmin` 并进行非常基础的配置。`Webmin`\
  \ 拥有一个 GUI 控制面板用于执行许多系统管理任务，最重要的是，它是一个基于 Web 的界面，可以非常有效地管理你的系统。`Webmin` 可以设置用户和组账户、安装\
  \ Web 服务器、初始化文件共享并执行其他常见的系统管理活动。对于不熟悉 Linux 命令行或只是想要一个更简单、更直观的系统图形界面的初学者来说，`Webmin`\
  \ 是非常高效的。\n\n示例 1.1 将引导你通过 Raspberry Pi 5 OS 分步完成 `Webmin` 的下载、安装以及初始的最小但至关重要的配置。这里提供的指令是在\
  \ Raspberry Pi 5 上执行的。\n\n在下述章节中，你可以随时回到 `Webmin`，并尝试使用 `Webmin` 来发现 `Webmin` 在处理我们在这些章节中详细介绍的任务时是多么高效有效！\n\
