  \n\n\n\n\n```\nsshd.service\n● ├─-.mount\n● ├─system.slice\n● └─sysinit.target\n\
  ●  ├─apparmor.service\n●  ├─dev-hugepages.mount\n●  ├─dev-mqueue.mount\n●  ├─fake-hwclock.service\n\
  ●  ├─keyboard-setup.service\n●  ├─kmod-static-nodes.service\n●  ├─plymouth-read-write.service\n\
  ●  ├─plymouth-start.service\n●  ├─proc-sys-fs-binfmt_misc.automount\n●  ├─sys-fs-fuse-connections.mount\n\
  ●  ├─sys-kernel-config.mount\n●  ├─sys-kernel-debug.mount\n●  ├─sys-kernel-tracing.mount\n\
  ●  ├─systemd-ask-password-console.path\n●  ├─systemd-binfmt.service\nOutput truncated...\n\
  ```\n\n递归依赖仅针对 `.target` 单元显示，这些单元表示系统状态。要递归列出所有依赖，请包含 `--all` 标志。\n\n要显示反向依赖（依赖于指定单元的单元），你可以在命令中添加\
  \ `--reverse` 标志。其他有用的标志包括第 202 页的 `--before` 和 `--after` 标志，它们可以用于显示在指定单元启动之前或之后的依赖单元。\n\
  \n## 检查单元属性 (Checking Unit Properties)\n\n- 要查看单元的低级属性，可以使用 `show` 命令。这将将使用 `key=value`\
  \ 格式显示为指定单元设置的属性列表：\n\n```\n $ sudo systemctl show sshd.service\nType=notify\nRestart=on-failure\n\
  NotifyAccess=main\nRestartUSec=100ms\nTimeoutStartUSec=1min 30s\nTimeoutStopUSec=1min\
  \ 30s\nRuntimeMaxUSec=infinity\nWatchdogUSec=0\nWatchdogTimestamp=Mon 2016-08-08\
  \ 15:51:56 PDT\nWatchdogTimestampMonotonic=8131498\nFailureAction=none\nPermissionsStartOnly=no\n\
  RootDirectoryStartOnly=no\nRemainAfterExit=no\nGuessMainPID=yes\nMainPID=914\n\n\
  Output truncated…\n```\n\n如果你想显示单个属性，可以使用 `-p` 配合属性名。例如，要查看 `sshd.service` 单元的冲突，你可以输入：\n\
  \n```\n $ sudo systemctl show sshd.service -p Conflicts\nConflicts=shutdown.target\n\
  $\n```\n\n## 单元的屏蔽与取消屏蔽 (Masking and Unmasking Units)\n\nsystemd 能够通过将单元链接到 `/dev/null`\
  \ 将其标记为自动或手动均不可启动。这被称为“屏蔽”（masking）单元，可以通过 `mask` 命令完成：\n\n```\n $ sudo systemctl\
  \ mask nginx.service\n```\n\n如果通过 `list-unit-files` 命令检查单元是否被屏蔽，你将看到：\n\n```\n $\
  \ sudo systemctl list-unit-files\nnginx.service masked\n```\n\n要取消单元屏蔽，只需使用 `unmask`\
  \ 命令：\n\n```\n $ sudo systemctl unmask nginx.service\n```\n\n这将允许单元再次启动。\n\n## 编辑单元文件\
  \ (Editing Unit Files)\n\n虽然 systemd 提供了多种编辑单元文件的机制，但 `edit` 命令是最方便的。要编辑单元，使用：\n\
  \n```\n\n $ sudo systemctl edit sshd.service\n```\n\n这将创建一个覆盖文件。如果你想编辑完整的文件而不是覆盖文件，使用\
  \ `--full` 标志：\n\n```\n $ sudo systemctl edit --full sshd.service\n```\n\n这将在默认编辑器中打开单元文件。在进行任何更改并保存文件后，你应该重载\
  \ systemd 以生效：\n\n```\n $ sudo systemctl daemon-reload\n```\n\n## 章练习 (In-Chapter\
  \ Exercise)\n\n4. 为了练习上述服务管理命令，请在系统中使用 `nginx` 服务而非 `sshd`。\n\n## 2.5 目标单元练习 (Practicing\
  \ on Target Units)\n\nsystemd 目标状态通过目标文件实例化。目标单元的文件名以 `.target` 结尾，用于收集和创建 systemd\
  \ 单元。\n\n`graphical.target` 单元用于实例化或创建 GUI 会话，它会启动许多系统服务。它还会启动 `multi-user.target`\
  \ 单元，因为该目标是 `graphical.target` 的依赖。`multi-user.target` 单元启动许多其他系统服务，如 `NetworkManager.service`\
  \ 或 `dbus.service`，并成为或作为一个里程碑目标单元。\n\n### 2.5.1 查看默认目标 (Viewing the Default Target)\n\
  \n要确定决定操作系统状态的默认目标单元，可以使用以下命令：\n\n```\n $ sudo systemctl get-default\ngraphical.target\n\
  $\n\n```注意：默认目标可能与当前系统状态的目标不同！\n\n### 2.5.2 第 205 页 查看所有目标 (Viewing All Targets)\n\
  \n要列出所有已加载的目标单元，使用：\n\n```\n $ sudo systemctl list-units --type target\n```\n\n\
  对于每个目标单元，此命令显示其全名（UNIT），随后是单元是否加载（LOAD）、其高级（ACTIVE）和低级（SUB）单元激活状态，以及短描述（DESCRIPTION）。默认情况下，`systemctl\
  \ list-units` 命令只显示活动单元。如果你想列出所有状态的加载单元，请带有 `--all` 或 `-a` 命令行选项运行此命令：\n\n```\n\
  \ $ sudo systemctl list-units --type target --all\n```\n\n\n\n\n\n```\n $ systemctl\
  \ list-units --type target --all\n  UNIT                     LOAD  ACTIVE      SUB\
  \    DESCRIPTION\n  basic.target             loaded  active      active    Bas>\n\
  \  blockdev@dev-disk-by...  loaded  inactive    dead      ...\n  blockdev@dev-disk-by\\\
  …  loaded  inactive    dead      ...\n  blockdev@dev-mmcblk0p1  loaded  inactive\
  \    dead      ...\n  blockdev@dev-nvme0n1p1  loaded  inactive    dead      Blo>\n\
  \  blockdev@dev-sda1.target loaded  inactive    dead      Blo>\n  bluetooth.target\
  \        loaded  active      active    Bluetooth Support\n  cryptsetup-pre.target\
  \   loaded  inactive    dead      Local Encrypted Volu>\n  cryptsetup.target   \
  \     loaded  active      active    Local Encrypted Volu>\n  emergency.target  \
  \      loaded  inactive    dead      Emergency Mode\n  first-boot-complete.target\
  \ loaded  inactive    dead    First Boot Complete\n  getty-pre.target        loaded\
  \  active      active    Preparation for Logi>\n  getty.target             loaded\
  \  active      active    Login Prompts\n  graphical.target        loaded  active\
  \      active    Graphical Interface\nOutput truncated...\nLOAD  = Reflects whether\
  \ the unit definition was properly loaded.\nACTIVE = The high-level unit activation\
  \ state, i.e. generalization of SUB.\nSUB    = The low-level unit activation state,\
  \ values depend on unit type.\n```\n\n列出了 52 个加载单元。\n\n要显示所有安装的单元文件，请使用 `systemctl\
  \ list-unit-files`。\n\n```\n $\n```\n\n#### 2.5.2.1 查看当前加载的 Targets\n\n要列出所有当前加载的\
  \ target 单元，请使用以下命令：\n\n```\n $ sudo systemctl list-units --type target\n```\n\n\
  以下命令演示了名为 `journald`（它已有效地取代了旧的、传统的日志机制）的 systemd 日志设施。用于显示 systemd 风格日志各个方面的命令是\
  \ `journalctl`。我们在第 2.6.2 节 中详细描述了 `journalctl`。要使用 `journalctl` 配合 `grep` 命令列出当前\
  \ target，请输入以下内容：\n\n```\n $ sudo journalctl | grep Reached | tail -3\nMar 15 05:13:24\
  \ raspberrypi systemd[1]: Reached target network-online.target - Network is Online.\n\
  Mar 15 05:13:26 raspberrypi systemd[1]: Reached target multi-user.target - Multi-User\
  \ System.\nMar 15 05:13:26 raspberrypi systemd[1]: Reached target graphical.target\
  \ - Graphical Interface.\n$\n```\n\n上述命令的输出显示了当前的 target 单元及其上一个。\n\n### 2.5.3 通过隔离（Isolating）更改当前\
  \ Target\n\n可以同时启动与 target 相关的所有单元，并停止所有不是该 target 依赖树部分的单元。这与在旧版系统中更改运行级别（run level）类似。\n\
  \n例如，如果你在 GUI 环境中运行，且当前由 `graphical.target` 定义系统状态，你可以关闭图形系统，并将系统切换到多用户状态，即字符用户界面（CUI）状态），这是通过所谓的“隔离”\
  \ `multi-user.target` 实现的。这通过 `isolate` 命令实现。由于 `graphical.target`（位于依赖树下方，如图 2.2\
  \ 所示）依赖于 `multi-user.target`，因此 `multi-user.target` 下的所有图形单元都将被终止。\n\n但在执行之前，你需要非常仔细地查看你正在隔离的\
  \ target 的依赖关系，以确保你没有停止会导致系统不可用的关键系统服务。为此，请使用以下命令：\n\n```\n $ sudo systemctl list-dependencies\
  \ multi-user.target\n```\n\n要在当前会话中切换到不同的 target 单元，请输入以下命令：\n\n```\n $ sudo systemctl\
  \ isolate name.target\n```\n\n将 `name` 替换为你想要使用的 target 单元名称（例如 multi-user）。此命令会启动名为\
  \ `multi-user.target` 的 target 单元及其所有依赖单元，并立即终止所有其他单元。要在当前会话中关闭图形界面切换到 `multi-user.target`\
  \ 单元，请输入命令：\n\n```\n $ sudo systemctl isolate multi-user.target\n```\n\n##### 注意事项与警告\n\
  \n执行此命令时，请确保你没有正在运行的程序，例如已打开的 LibreOffice！切换 target 状态将导致这些程序被强制终止，在 LibreOffice\
  \ 的情况下，你将需要恢复这些文档。\n\n**警告**：在编写此本书时，在我们的树莓派 5 上执行上述命令后，必须将虚拟终端更改到另一个虚拟终端（tty1 到\
  \ tty7 是可选的），例如通过同时按住以下键序列切换到 tty1：\n\n```\n Ctrl+Alt+F1\n```\n\n其中 `F1` 代表键盘上的功能键\
  \ `F1`。然后你将登录系统，此时系统运行在 `multi-user.target` 状态下，处于纯文本的字符用户界面（CUI）中。此警告是必要的，因为我们桌面上用于\
  \ Wayland 和 Wayfire 程序的活动显示管理器和普通显示虚拟终端都连接到了 tty7（`graphical.target` 状态下的默认屏幕显示）；显示屏幕是空白的，因为……\n\
  \n\n\n\n\nRaspberry Pi 5 系统的普通无权限用户通常无法使用本节及后续章节中的命令。大多数情况下，系统运行正常，且启动也是正常的。\n\n\
  救援模式（Rescue mode）提供了一个宝贵的单用户环境，以便在系统无法完成常规引导和启动过程中进行修复。在救援模式下，系统会尝试挂载所有本地文件系统并启动一些重要的系统服务，但不会激活任何网络接口，也不会允许多个用户同时登录。\n\
  \n要在当前会话中更改当前目标并进入救援模式，请输入以下命令：\n\n```\n $ sudo systemctl rescue\n欢迎进入救援模式！登录后，输入-\n\
  journalctl -xb 查看系统日志，\nsystemctl reboot 重启，\nsystemctl default 或使用组合键 <Ctrl>+D\
  \ 进入默认模式：\n请输入维护所需的 root 密码（或按 <Ctrl>+D 继续）：\n```\n\n此命令与 `systemctl isolate rescue.target`\
  \ 类似，但它还会向当前登录系统的所有用户发送警告消息。要防止 systemd 发送此消息，请带有 `--no-wall` 选项执行此命令：\n\n```\n\
  \ $ sudo systemctl --no-wall rescue\n```\n\n### 2.5.5 切换到紧急模式\n\n紧急模式（Emergency\
  \ mode）顾如其名，是允许修复系统的最精简环境。信不信，即使在系统本身无法进入救援模式的情况下，它也能运行！在紧急模式下，系统以只读模式挂载根文件系统，且尝试挂载任何其他本地文件系统。与救援模式一样，它不激活网络接口，仅启动少数基本服务。\n\
  \n要离开当前目标并进入紧急模式，请输入以下命令：\n\n```\n $ sudo systemctl emergency\n欢迎进入紧急模式！\n登录后，输入\
  \ journalctl -xb 查看系统日志，\nsystemctl reboot 重启，\nsystemctl default 或 <Ctrl>+<D> 进入默认模式。\n\
  请输入维护所需的 root 密码（或按 Control-D 继续）：\n```\n\n此命令与 `systemctl isolate emergency.target`\
  \ 类似，但它也可以向当前登录系统的所有用户发送信息性消息。要防止 systemd 发送此消息，请使用 `--no-wall` 命令行选项运行此命令：\n\n\
  ```\n $ sudo systemctl --no-wall emergency\n```\n\n上述两个章节允许你将系统状态切换到救援或紧急模式，它们通常在系统运行不正常或出现性能问题时使用。但是，当由于某种原因完全无法正常进入\
  \ `multi-user.target` 或 `graphical.target` 时，普通用户该怎么办？有几种选项（我们在此不作详细介绍）可以中断引导过程或引导到之前的内核版本。这些情况的列表如下：\n\
  \n1. 电源或硬件相关问题。\n2. 进入 GRUB2 恢复模式。\n3. 引导到之前的“引导环境”。\n4. 如果在 zpools 上使用 Zettabyte\
  \ 文件系统 (ZFS)，则使用 ZFS 恢复模式。\n\n### 2.5.6 目标（Targets）操作练习\n\n以下简短的命令行练习，允许你使用 `systemctl`\
  \ 命令以及前节所示的重要选项来影响 systemd 目标状态。\n\n1. 检查默认的 systemd.target-\n\n   ```\n     $ sudo\
  \ systemctl get-default\n    graphical.target\n    $\n   ```\n\n2. 使用 Linux 多命令组合\
  \ `who -r` 选项以及 `grep` 列出目标单元，并确定当前的 systemd 目标：\n\n   ```\n     $ sudo systemctl\
  \ list-units --type=target |grep active |egrep \"graphical|multi|rescue|emergency\"\
