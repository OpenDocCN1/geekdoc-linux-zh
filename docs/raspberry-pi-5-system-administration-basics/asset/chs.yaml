  \ NVMe 适配器连接的 M.2 PCIe 设备），并将所有用户数据存储在另一个类似类型的单介质上，但容量要大得多，甚至可以是某种外部介质阵列。在本节中，我们将展示一种在你的\
  \ Raspberry Pi 5 OS 上创建新用户时符合该模型的简单方法。\n\n请注意，此技术没有演示如何将已有的用户及其整个家目录迁移到新添加的介质上。尽管我们将其留为一个章节内练习，供你在本节范围内完成。\n\
