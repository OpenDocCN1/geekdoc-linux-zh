  \ upgraded.\nNeed to get 36.2 MB of archives.\nAfter this operation, 191 MB of additional\
  \ disk space will be used.\nDo you want to continue? [Y/n]Y\nOutput truncated…\n\
  $\n```\n\n一旦下载了内核文档，您可以通过查看系统上的 `cgroups` 帮助页来访问并查看特定的 cgroups 特定内容。\n\n## 2.6.1.3\
  \ Linux 命名空间 (Namespaces)\n\nRaspberry Pi 5 OS Linux 中有一种被称为“命名空间”的内核级结构，它可以将第 2.6.1\
  \ 节中看到的 cgroup 进程及其系统资源隔离在一个独立的保护环境中。这允许它们在系统的自己的进程环境中运行。命名空间的一个非常接近的类比（您可能熟悉）是高级计算机编程语言（如\
  \ C 或 Python3）中变量的 `scope`（作用域）概念。\n\n命名空间使用 `clone` 系统调用来实现这种进程隔离。命名空间最大且最重要的用途是\
  \ Linux 容器（如 LXD/LXC）的系统级创建和维护。要获取命名空间的完整参考信息，请查阅您 Raspberry Pi 5 系统上的 `namespaces`\
  \ 和 `user_namespaces` 帮助页——特别是 `user_namespaces` 帮助页上的示例部分，它提供了一个极佳且具指导性的 C 语言系统编程实现，使用了\
  \ `clone` 系统调用来创建一个在新命名空间中执行 shell 命令的子进程。\n\n## 2.6.2 日志记录 (Journal Logging)\n\n\
  使用日志文件进行系统日志对于系统管理非常有用，可以发现您的软件或硬件可能出了什么问题。日志记录了 Raspberry Pi 5 OS 上的活动和事件。使用 `systemd`\
  \ 的日志记录与传统的可用日志方法非常相似。它们的创建是为了让您能够仔细、系统且定期地审核系统的总体运行情况，特别是针对您可能做的性能优化，并维护系统安全。\n\
  \n### 2.6.2.1 systemd journal 日志消息\n\n`systemd` 日志由一个名为 `journald` 的特殊守护进程创建并管理，该进程将内核、`initrd`、`systemd`\
  \ 服务等设施和程序产生的所有消息引导到数据库记录结构中。`systemd` journal 是一个单一的集中管理程序，用于收集日志，无论日志消息本身在何处生成。\n\
  \n**注意**\n\nsystemd 日志记录的一个关键且具有争议的方面是，日志文件是以二进制数据存储的，并且可以通过部署了专用数据库遍历程序的进程进行搜索。它们不是纯文本文件。以前的遗留系统日志是纯文本文件，可以轻松地作为文本查看，甚至可以在\
  \ `nano`、`Vi` 或 `emacs` 等文本编辑器中编辑。\n\n以二进制格式存储日志信息要求日志信息以特定于专用数据库管理技术的有用输出格式显示。简单来说，使用那种专有技术是其主要缺点。\n\
  \n但可以使用我们在下一节中显示的 `journalctl` 命令来显示日志。\n\n### 2.6.2.2 使用 journalctl 命令查询日志\n\n\
  `journalctl` 命令是查询日志数据库条目的的一种方便方法。以下是从 `journalctl` 帮助页中提取的命令摘要：\n\n```\n ***********************************************************************\n\
  journalctl - 查询 systemd journal\n\nSyntax:\n       journalctl [options...] [matches...]\n\
  \nPurpose:\n       journalctl 可用于查询由 systemd-journald.service 写入的 systemd journal\
  \ 内容。\n\n如果没有选项或参数调用，它将显示日志的所有内容，从收集的最旧条目开始。\n\n所有用户都获权访问其私人的每个用户日志。但是，默认情况下，只有\
  \ root 和属于少数特殊组的用户才获权访问系统日志和其他用户的日志。\n\n常用功能：\n-a, --all      全量显示所有字段，即使它们包含不可打印字符或很长。\n\
  -f, --follow   仅显示最近的条目，并在新条目追加到日志时连续打印。\n-r, --reverse  反转输出，使最新的条目显示在前面。\n-u,\
  \ --unit=UNIT|PATTERN 显示指定的 systemd 单元（如服务）的消息，或与 PATTERN 匹配的任何单元的消息。\n-S, --since=,\
  \ -U, --until= 分别开始显示晚于指定日期或早于指定日期的条目。日期规范格式应为 \"2012-10-30 18:17:16\"。\n***********************************************************\n\
  ```\n\n要获取更多关于 `journalctl` 命令用法的信息，特别是关于该命令用于查询日志的结构，请根据需要并在系统上检查 `man journalctl`\
  \ 命令。\n\n## 2.6.2.3 日志记录基础以及 Webserver 程序的应用\n\n在本节中，我们将展示如何使用 `journalctl` 命令及其选项来执行一些基本的\
  \ systemd 风格查询操作。然后，我们将这些命令和选项应用到真实应用程序 `webserver2` 中。该程序生成 systemd 风格的日志输出。在本节中，我们对该程序日志输出的\
  \ `journalctl` 命令的使用是相关的，以便更好地、更实用地说明 `journalctl` 选项和参数的使用。\n\n### 2.6.2.3.1 日志查看\n\
  \n要查看 journald 守护进程收集的日志，请使用 `journalctl` 命令。\n\n当不带任何选项或参数时，系统中的每个日志条目都将被显示。列表中最旧的条目在第一个：\n\
  \n```\n $ journalctl\nOct 10 10:40:53 raspberrypi kernel: Booting Linux on physical\
  \ CPU 0x0000000000 [0x414fd0b1]\nOct 10 10:40:53 raspberrypi kernel: Linux version\
  \ 6.6.51+rpt-rpi-2712 (serge@raspberrypi.com)\n(gcc-12 (Debian 12.2.0-14) 12.2.0,\
  \ GNU ld>\nOct 10 10:40:53 raspberrypi kernel: KASLR enabled\nOct 10 10:40:53 raspberrypi\
  \ kernel: random: crng init done\nOct 10 10:40:53 raspberrypi kernel: Machine model:\
  \ Raspberry Pi 5 Model B Rev 1.0\nOutput truncated…\n```\n\n\n\n\n\n但如果你想先看到最新的日志条呢？请在基础\
  \ `journalctl` 命令上使用 `-r`（反转）选项。\n\n```\n $ journalctl -r\nOct 10 10:40:53 raspberrypi\
  \ kernel: Booting Linux on physical CPU 0x0000000000 [0x414fd0b1]\nOct 10 10:40:53\
  \ raspberrypi kernel: Linux version 6.6.51+rpt-rpi-2712 (serge@raspberrypi.com)\n\
  (gcc-12 (Debian 12.2.0-14) 12.2.0, GNU ld>\nOct 10 10:40:53 raspberrypi kernel:\
  \ KASLR enabled\nOct 10 10:40:53 raspberrypi kernel: random: crng init done\nOct\
  \ 10 10:40:53 raspberrypi kernel: Machine model: Raspberry Pi 5 Model B Rev 1.0\n\
  Oct 10 10:40:53 raspberrypi kernel: efi: UEFI not found.\nOct 10 10:40:53 raspberrypi\
  \ kernel: Reserved memory: created CMA memory pool at 0x0000000002000000, size 320\
  \ MiB\nOutput truncated…\n```\n\n## 章节练习\n\n9. 根据在你的 Raspberry Pi 5 系统上执行上述两个命令的输出，你可以关于最近的启动时间和当前时间得出什么信息？\n\
  \n### 2.6.2.3.2 第 222 页 日志查询结构\n\n从许多源收集日志信息并将其集中在某处（例如日志中）的主要目的，是为了能够快速方便地查看并根据对你某些原因重要的日志条目采取行动。这种原因可能是因为你有安全方面的考量，或者因为一个新安装的程序运行异常导致系统崩溃。这对于普通的桌面用户或服务器系统管理员都是可能的。\n\
  \n正因如此，`journalctl` 命令的选项和参数最重要的功能是它的排序方法、对日志进行查询的方法，或者从中分离出更有用、更易理解且紧凑的信息。以下是执行这些日志搜索的一些方法。\n\
  \n例如，日志有许多“字段标题”可以用于查询。这些字段中的每一个都充当索引或键，指向日志中特定类型或组的条目。其中某些字段是由被记录的进程传递的，另一些则是由守护进程\
  \ `journald` 应用的，其数据是它在日志产生时从系统中收集的。\n\n前导的下划线（`_`）表示该字段属于后一种类型。日志会自动记录并索引该类型的查询。你可以通过输入以下命令获取有关所有可用日志字段的更多信息：\n\
  \n```\n $ man systemd.journal-fields\n```\n\n### 2.6.2.3.3 按时间查询\n\n你也可以在“从...到...”显示中查看部分日志。当系统运行了很长时间没有重启时，你很可能想这样做。你可以使用\
  \ `--since` 和 `--until` 选项进行查询，将显示的条目限制为某些指定时间之后或之前的条目。\n\n时间参数有多种格式。对于绝对时间值，你应该使用以下格式：\n\
  \n`YYYY-MM-DD HH:MM:SS`\n\n例如，我们可以使用此命令查看自 2025-04-04 07:52:30 PDT 以来的所有条目：\n\n\
  ```\n $ journalctl --since \"2025-04-04 07:52:30 PDT\"\n```\n\n如果省略上述时间指定参数的一部分，将使用标准默认值。例如，如果省略了日期，将使用当前日期。如果缺少时间部分，将使用“00:00:00”（午夜）。秒字段可以省略，默认为“00”：\n\
  \n```\n $ journalctl --since \"2025-04-04 \" --until \"2025-04-04 08:30 PDT\"\n\
  ```\n\n日志还接受一些相对值和英语缩写。例如，你可以使用单词 \"yesterday\"昨天）、\"today”（今天）、\"tomorrow”（明天）或\
  \ \"now”（现在）。你通过将这些符号放在参数之前来设置相对时间：\"-\" 或 \"+\" 后面接数字值，或使用如 \"ago”（以前）之类的单词。\n\n\
  要获取昨天的数据，使用此命令：\n\n```\n $ journalctl --since yesterday\n```\n\n如果你使用了另一个系统监控工具，它提供了关于从从晚上\
  \ 11:00 开始持续到一小时前的服务中断信息，你可以输入：\n\n```\n $ journalctl --since 11:00 --until \"1\
  \ hour ago\"\n```\n\n### 2.6.2.3.4 按单元查询\n\n最实用且高效的查询方法是指定你感兴趣的服务单元（unit）名称。你使用\
  \ `-u` 选项按单元进行查询。\n\n例如，要查看系统中 `webserver2` 单元的所有日志，使用以下命令：\n\n```\n $ journalctl\
  \ -u webserver2.service\n```\n\n### 2.6.2.3.5 按进程、用户或组查询\n\n多个服务可能会派生许多进程。如果你知道感兴趣的进程的确切\
  \ PID，可以按 PID 进行查询。例如，如果我们感兴趣的 PID 是 1，使用以下命令：\n\n```\n $ journalctl _PID=1\n```\n\
  \n你还可以显示来自特定用户或组的所有条目。这是通过 `_UID` 或 `_GID` 过滤器实现的。例如，如果 `webserver2` 由用户 bob 运行，你可以通过以下命令找到用户\
  \ ID：\n\n```\n $ id -u bob\n1000\n$\n```\n\n然后，你可以使用返回的 id 来构建查询，如下：\n\n```\n $\
  \ journalctl _UID=1000 --since today\n```\n\n`journalctl` 命令的 `-F` 用于显示给定日志字段的所有可用值。要查看\
  \ systemd 日志拥有哪些组 ID，使用以下命令：\n\n```\n $ journalctl -F _GID\n0\n1000\n112\n110\n\
  106\n996\n109\n997\n121\n7\n65534\n$\n```\n\n### 2.6.2.3.6 按路径查询\n\n你可以通过提供路径应用过滤器。如果路径指向可执行映像，`journalctl`\
  \ 将显示与该特定执行映像相关的所有条目。例如，要查找涉及 `webserver2` 执行程序的日志，使用以下命令：\n\n```\n $ journalctl\
  \ /home/bob/webserver2\n```\n\n其中可执行映像路径为 `/home/bob`，执行程序名称为 `webserver2`。\n\n\
  ### 2.6.2.3.7 按优先级查询\n\n系统管理员非常感兴趣的一个查询过滤器是消息优先级。虽然在非常详细的级别记录信息是有用的，但在实际尝试读取和解释观察到和可用信息时，列出低优先级日志可能会变得晦涩且无用。\n\
  \n\n\n\n\n你可以使用 `journalctl` 的 `-p` 选项来仅显示特定优先级或更高优先级的消息。这允许你过滤掉低优先级的消息。例如，要仅显示错误（error）级别及以上的日志条目，你可以输入：\n\
  \n```\n $ journalctl --b -p err\nMar 07 16:02:38 raspberrypi bluetoothd[682]: src/plugin.c:plugin_init()\
  \ Failed to init vcp plugin\nMar 07 16:02:38 raspberrypi bluetoothd[682]: src/plugin.c:plugin_init()\
  \ Failed to init mcp plugin\nMar 07 16:02:38 raspberrypi bluetoothd[682]: src/plugin.c:plugin_init()\
  \ Failed to init bap plugin\nMar 07 16:02:38 raspberrypi bluetoothd[682]: profiles/sap/server.c:sap_server_register()\
  \ Sap\ndriver initialization failed.\nMar 07 16:02:38 raspberrypi bluetoothd[682]:\
  \ sap-server: Operation not permitted (1)\nMar 07 16:02:39 raspberrypi wpa_supplicant[845]:\
  \ nl80211: kernel reports: Registration to\nspecific type not supported\nOutput\
  \ truncated ...\n```\n\n这将显示所有标记为错误（error）、关键（critical）、警告（alert）或紧急（emergency）的消息。journal\
  \ 实现了传统的 UNIX/Linux syslog 消息级别。你可以使用优先级名称或其对应的数值。优先级从高到低的排序顺序见表 2.3。\n\n表 2.3 systemd\
  \ 错误优先级 返回文本。⏎\n\n| 优先级 | 名称 | 描述及可能采取的行动 |\n| --- | --- | --- |\n| 0 | emerg |\
  \ 紧急 – “恐慌”状态 – 通知系统管理员。 |\n| 1 | alert | 警报 – 通知可以解决问题的系统管理员。例如：备份 ISP 连接丢失。 |\n\
  | 2 | crit | 关键 – 主系统故障。在处理警报问题之前修复关键问题。例如：磁盘子系统丢失。 |\n| 3 | err | 错误 – 非紧急故障，应发送给开发者或开发管理员。\
  \ |\n| 4 | warning | 警告 – 不是错误，但显示如果不采取行动将发生错误，例如文件系统几乎写满。 |\n| 5 | notice | 注意\
  \ – 不寻常事件，但不是错误状态。不需要立即采取行动。 |\n| 6 | info | 信息 – 正常运行期间的消息 – 无需操作。 |\n| 7 | debug\
  \ | 调试 – 开发者调试应用程序所需的有用信息，在运行期间无用。 |\n\n上述数字或名称可以与 `-p` 选项交叉使用。选择一个优先级将显示标记为指定级别及高于该优先级的消息。\n\
  \n### 章末练习\n\n10. 从复合查询的角度来看，上一个命令中的 `--b` 指令的作用是什么？\n\n#### 2.6.2.4 查询输出显示\n\n\
  上述查询显示了特定类型的日志条目输出。我们还有其他方法可以为查询添加选项和补充内容。第 226 页 `journalctl` 的输出更加紧凑易读，因此更具可读性。如果你想从中筛选出某些信息，它的组织方式会更易于理解。\n\
  \n**注意**\n\n在下面的某些输出显示中，可以通过在命令行输入 `q` 来退出或停止显示 journal 条目。\n\n要显示指定数量的日志条目，可以使用\
  \ `-n` 选项。默认情况下，它将显示最近的 10 条：\n\n```\n $ journalctl -n\n```\n\n你也可以在 `-n` 后面跟一个数字来指定你想查看的项目数量：\n\
  \n```\n $ journalctl -n 15\n```\n\n##### 2.6.2.4.1 实时显示日志条目\n\n要实时显示 journal 的内容并在日志写入时查看它们，请使用\
  \ `-f` 选项：\n\n```\n $ journalctl -f\n```\n\n可以通过使用以下选项调整 `journalctl` 显示日志数据的方式（收缩或扩展）。默认情况下，`journalctl`\
  \ 会在分页器（pager）中从左到右显示整个条目，允许条目延伸到屏幕的第 227 页右侧。这种向右延伸的显示数据可以通过按右箭头键来查看。如果你更希望输出被截断，并在删除信息的地方处插入省略号，可以使用\
  \ `--no-full` 选项：\n\n```\n $ journalctl - -no-full\nOct 10 10:40:53 raspberrypi\
  \ kernel: Booting Linux on physical CPU 0x0000000000 [0x414fd0b1]\nOct 10 10:40:53\
  \ raspberrypi kernel: Linux version 6.6.51+rpt-rpi-2712 (serge@raspberrypi.com)\n\
  (gcc-12 (Debian 12.2.0-14) 12.2…024-10-08)\nOct 10 10:40:53 raspberrypi kernel:\
  \ KASLR enabled\nOct 10 10:40:53 raspberrypi kernel: random: crng init done\nOct\
  \ 10 10:40:53 raspberrypi kernel: Machine model: Raspberry Pi 5 Model 1\nOct 10\
  \ 10:40:53 raspberrypi kernel: efi not found.\nOct 10 10:40:53 raspberrypi kernel:\
  \ Reserved memory: created CMA pool at\n0x0000000002000000, size 320 MiB\nOutput\
  \ truncated ...\n```\n\n你还可以使用 `-a` 选项让 journal 显示所有信息，无论是否包含不可打印字符：\n\n```\n $\
  \ journalctl -a\n```\n\n默认情况下，`journalctl` 以分页方式输出查询结果，每次一屏。为了让程序处理输出，可以使用 `--no-pager`\
  \ 选项。在下面的示例中，我们将其重定向到名为 `page1` 的文件：\n\n```\n $ journalctl --no-pager > page1\n\
  ```\n\n##### 2.6.2.4.2 查询输出显示\n\n上述查询显示了特定类型的日志条目输出。我们还有其他方法可以为查询添加选项和补充内容。如果你在使用特定的程序处理\
  \ journal，那么如果数据以更易于处理的格式呈现将会更加方便。你可以通过 `-o` 选项配合格式指定符来实现。\n\n例如，你可以使用 `json-pretty`\
  \ 格式以便更好地处理数据传递给 JSON 消费者：\n\n```\n $ journalctl -b -u server2 -o json-pretty\n\
  ```\n\n第 228 页表 2.4 显示了可能用于此类显示的格式：\n\n| cat | 仅显示消息字段本身。 |\n| export | 适用于传输或备份的二进制格式。\
  \ |\n| json | 每行一个标准的 JSON。 |\n| json-pretty | 格式化的 JSON，便于人类阅读。 |\n| json-sse |\
  \ 封装为兼容服务器发送事件格式的 JSON 输出。 |\n| short | 默认的 syslog 样式输出。 |\n| short-iso | 带有 ISO\
  \ 8601 钟时间的默认格式。 |\n| short-monotonic | 带有单调时间戳默认格式。 |\n| short-precise | 带有微秒精度的默认格式。\
  \ |\n| verbose | 显示条目可用的所有 journal 字段，包括通常隐藏的字段。 |\n\n#### 2.6.2.5 journal 维护\n\n\
  可能不仅需要查看旧的启动环境并将发现日志与最新的启动日志相关联，还需要删除旧的、过期的日志。日志和 journal 的维护是系统管理的一个重要方面。\n\n**注意**：本书编写时，“真空”（vacuuming）或清理\
  \ journal 日志文件仅对归档文件和损坏文件有效，对活动日志文件无效！\n\n你可以使用 `journalctl` 命令的 `--disk-usage`\
  \ 选项来查找活动和归档 journal 当前占用磁盘的空间量：\n\n```\n $ journalctl --disk-usage\nArchived and\
  \ active journals take up 48.0M in the file system.\n$\n```\n\n活动 journal 无法被修剪。\n\
  \n\n\n\n当此功能可用于活动日志时，你基本上有两种不同的方法可以进行操作。第 229 页\n\n1. 如果你使用 `--vacuum-size` 选项，可以通过指定一个大小来缩小日志。这将只会删除损坏或空的旧归档条目，直到磁盘上占用的日志总空间达到请求的大小：\n\
  \n```\n$ sudo journalctl --vacuum-size=1M\nDeleted archived journal /var/log/journal/42ef46612dc64ec2bf13b9704a661ec8/user-1000@0005fa1821e06e36-c096421281b7ec8d.journal∼\
  \ (8.0M).\nDeleted archived journal /var/log/journal/42ef46612dc64ec2bf13b9704a661ec8/system@0005fa1821194676-6ee6ae817589e0dc.journal∼\
  \ (16.0M).\nVacuuming done, freed 24.0M of archived journals from /var/log/journal/42ef46612dc64ec2bf13b9704a661ec8.\n\
  Vacuuming done, freed 0B of archived journals from /run/log/journal.\nVacuuming\
  \ done, freed 0B of archived journals from /var/log/journal.\n$\n```\n\n2. 另一种修剪归档日志的方法是使用\
  \ `--vacuum-time` 选项指定一个截止时间。任何超出该时间的条目都将被删除。这允许你保留在特定时间之后创建的条目。\n\n例如，为了保留过去一年的条目，你可以输入：\n\
  \n```\n$ sudo journalctl --vacuum-time=1years\n```\n\n## 限制日志扩展\n\n你可以限制日志在磁盘上占用的持久化存储空间大小。这可以通过编辑\
  \ `/etc/systemd/journald.conf` 文件来实现。该文件中的以下项可以限制日志的增长：\n\n```\nSystemMaxUse=: 日志在持久化存储中可以使用的最大磁盘空间。\n\
  SystemKeepFree=: 在向持久化存储中添加日志条目时，日志应该留出的空空间。\nSystemMaxFileSize=: 单个日志文件在持久化存储中轮换前可以增长到多大。\n\
  RuntimeMaxUse=: 在挥性存储（在 /run 文件系统内）中可以使用的最大磁盘空间。\nRuntimeKeepFree=: 在向挥性存储（在 /run\
  \ 文件系统内）写入数据时，为其他用途留出的空间量。\nRuntimeMaxFileSize=: 单个日志文件在挥性存储（在 /run 文件系统内）中轮换前可以占据的空间量。\n\
  ```\n\n## 2.6.2.6 启动过程查询\n\n使用日志，你可以检查当前启动记录及其进度，以及过去的启动记录。从系统管理的角度来看，当启动过程出现问题，或者系统上的软件或硬件在系统启动并处于稳定状态后无法正常启动或运行时，这非常有用。\n\
  \n### 2.6.2.6.1 第 230 页查询过去的启动\n\n为了显示当前启动的信息，有时过去的启动序列记录在检查并与当前启动进行比较时会有帮助。日志可以保存许多次之前启动的信息，并可以让\
  \ `journalctl` 命令以有效且简洁的比较方式显示这些信息。注意，为了保留过去启动的日志信息，你必须先完成本节所示的。\n\n要启用持久化启动信息，你可以执行以下操作：\n\
  \n1. 使用以下命令创建存储日志的目录：\n\n```\n$ sudo mkdir -p /var/log/journal\n```\n\n2. 使用你喜欢的编辑器编辑日志配置文件：\n\
  \n```\n$ sudo nano /etc/systemd/journald.conf\n```\n\n在 `[journal]` 部分下，取消注释（删除\
  \ # 符号）`Storage=` 选项，并将其设置为“persistent”以启用持久化日志：\n\n```\n/etc/systemd/journald.conf\n\
  . . .\n[Journal]\nStorage=persistent\n```\n\n当你的系统启用了通过持久化保留之前的启动时，`journalctl`\
  \ 命令提供了一些将启动作为一个单元处理的选项。要查看 journald 已知的启动，请使用 `journalctl` 的 `--list-boots` 选项：\n\
  \n```\n$ journalctl --list-boots\nIDX BOOT ID                           FIRST ENTRY\
  \           LAST ENTRY    >\n  0    6d54cb09c6134fe7ace8f98c86bb3b9e Fri 2025-03-07\
  \ 16:02:35 PST Sun 2025-03-09>\n$\n```\n\n上述命令将为每次启动显示一行，如 表 2.5 所示。\n\n表 2.5 systemctl\
  \ 启动信息 返回文本。⏎\n\n| 0 | 第一列是相对于 0（当前启动环境）的启动偏移。 |\n| 6d54cb09c6134fe7ace8f98c86bb3b9e\
  \ | Fri 2025-03-07 16:02:35 PST Sun 2025-03-09 | 启动跨越的时间，带有列。 |\n\n### 2.6.2.6.2\
  \ 当前启动\n\n为了显示当前启动的信息，有时过去的启动序列记录在检查并与当前启动进行比较时会有帮助。日志可以保存许多次之前启动的信息，并可以让 `journalctl`\
  \ 命令以有效且简洁的比较方式显示这些信息。第 231 页\n\n显示当前启动：\n\n```\n$ journalctl -b 6d54cb09c6134fe7ace8f9c86bb3b9e\n\
  ```\n\n### 2.6.2.6.3 显示内核消息\n\n启动相关的内核消息（通常在 `dmesg` 中）也可以从日志中检索。为了只显示这些消息，我们可以为\
  \ `journalctl` 命令添加 `-k` 或 `--dmesg` 标志：\n\n```\n$ journalctl -k\n```\n\n默认情况下，这将显示当前启动的内核消息。可以使用启动规范指定替代启动，例如为了获取五个之前的启动（如果存在），你可以输入：\n\
  \n```\n$ journalctl -k -b -5\n```\n\n## 2.6.3 systemd 定时器\n\nsystemd 通过支持基于时间和日期的事件，承担了传统\
  \ Cron 的许多功能和机制。\n\n从系统管理员的角度来看，systemd 可以进行类似 Cron 的事件调度。我们在下面给出了基于时间运行单个脚本以及基于日期的调度的示例。\n\
  \n为了获取有关 systemd 处理时间规范和操作的完整说明，请参阅 `systemd.time` 的手册页。\n\n#### 2.6.3.1 运行脚本示例\n\
  \n如果你有一个想每小时运行一次的脚本 `/usr/local/bin/myscript`，执行以下步骤：\n\n1. 使用你喜欢的文本编辑器创建一个名为 `myscript.service`\
  \ 的服务单元文件。将其保存到 `/etc/systemd/system/`，内容如下：\n\n```\n[Unit]\nDescription=脚本的功能\n\
  \n[Service]\nType=simple\nExecStart=/home/bob/myscript\n```\n\n## 本章练习\n\n11. 你安装的一个新应用程序在\
  \ Raspberry Pi 5 OS 上拒绝运行。在找出该应用程序行为异常的原因可能经历众多调试场景中，你可以使用单个 systemd 命令检查最近的系统活动记录，然后快速解决应用程序问题。在之前的章节中，哪个特定命令最简洁地为你提供了查看近期活动的操作？第\
  \ 232 页\n\n12. 为了练习上一节的 `journalctl` 命令，从当前启动环境查询之前的 3 次系统启动记录（如果有那么多的话）！\n\n\n\n\
  请注意，将 `Type` 变量设置为“simple”（简单）而不是“oneshot”（单次）非常重要。如果你指定“oneshot”，脚本将在首次运行时，随后 `systemd`\
  \ 将不会再次运行它，并关闭定时器。\n\n2. 在与上方服务单元文件相同的目录中，创建以下定时单元文件：\n\n```\n[Unit]\nDescription=每小时运行一次\
  \ myscript\n\n[Timer]\n# 启动后在首次运行之前的等待时间\nOnBootSec=10min\n# 每次连续运行之间的时间\nOnUnitActiveSec=1h\n\
  Unit=myscript.service\n\n[Install]\nWantedBy=multi-user.target\n```\n\n3. 启动并启用该服务：\n\
  \n```\n$ sudo systemctl start myscript.timer\n\n以及为了在随后的每次启动时启用它：\n\n```\n$ sudo\
  \ systemctl enable myscript.timer\n```\n\n## 章末练习\n\n13. ```bash\n#!/bin/bash\n\
  # 将我的第一个脚本转换为服务\necho \"Hello World!\"\n```\n\n如果你在树莓派 5 系统的主目录下的上述脚本文件（将其命名为 `myscript.bash`）通过上述三个步骤被转换为服务，你如何让终端的标准输出每\
  \ 10 分钟显示一次“Hello World!”消息呢？\n\n14. a) 你使用什么命令停止服务？ b) 你使用什么命令来确保服务不会在随后的每次启动时运行？\n\
  \n## 2.6.3.2 上述脚本文件基于日历运行的示例\n\n如果你想根据日历事件而不是基于时的时间间隔来启动第 2.6.3.1 节所示的服务，创建一个新的定时单元，并将该示例中的服务单元文件链接到该新定时单元。\n\
  \n1. 使用你喜欢的文本编辑器（如果喜欢用 `nano`）使用以下命令创建定时单元：\n\n```\n$ sudo nano /etc/systemd/system/cal.timer\n\
  ```\n\n然后将此文本放入该文件中：\n\n```\n[Unit]\nDescription=基于日历的定时器\n\n[Timer]\nOnCalendar=Mon-Fri\
  \ *-*-* 00:00:00\nUnit=myscript.service\n\n[Install]\nWantedBy=basic.target\n```\n\
  \n服务文件和定时单元文件被放在 `/etc/systemd/system/` 文件夹。\n\n2. 启动日历定时器：\n\n```\n$ sudo systemctl\
  \ start cal.timer\n```\n\n以及为了在随后的每次启动时启用它：\n\n```\n$ sudo systemctl enable cal.timer\n\
  ```\n\n## 章末练习\n\n15. 上述示例中的时间戳 `Mon-Fri *-*-* 00:00:00` 为脚本运行指定了什么？\n\n## 2.7 作为“新式守护进程”的\
  \ Python3 Base Web 服务器\n\n在本章的这些章节中，我们的新式守护进程、程序、应用或方法是指受 `systemd` 控制的。此示例部署了一个可以轻松创建\
  \ Web 服务器的特殊 `Python3` 模块，并将此模块置于 `systemd` 的控制下作为一个新式守护进程。你完全不需要任何 `Python` 知识，只需按照下面的步骤操作即可：\n\
  \n1. 在你的主目录中放置一个有效的 `index.html` 文件。\n\n注意：在下面的步骤中，我们的主目录是 `/home/bob`。\n\n此外，我们非常简单的\
  \ `index.html` 文件如下：\n\n```html\n<!DOCTYPE HTML PUBLIC \"-//W3C//DTD HTML 4.0//EN\"\
  >\n<html\n<head>\n<meta http-equiv=\"content-type\" content=\"text/html; charset=utf-8\"\
  >\n<title></title>\n<meta name=\"generator\" content=\"LibreOffice 7.4.2\">\n<meta\
  \ name=\"created\" content=\"2025-04-25T18:47:03\">\n<meta name=\"changed\" content=\"\
  2025-04-25T18:48:11\">\n<link href=\"/home/bob/favicon.ico\" rel=\"icon\" type=\"\
  image/x-icon\" />\n</head>\n<body lang=\"en\" dir=\"ltr\" style=\"background: transparent\"\
  >\n<p>Under Construction</p>\n</body>\n</html>\n```\n\n2. 在 `/etc/systemd/system/`\
  \ 为 Web 服务器创建一个服务单元文件，命名为 `simp.service`，内容如下。我们使用命令 `sudo nano simp.service` 实现此操作：\n\
  \n```\n[Service]\nExecStart=/usr/bin/python3 -m http.server -d /home/bob 8000\n\
  ```\n\n3. 启动服务，使用以下命令：\n\n```\n$ sudo systemctl start simp.service\n```\n\n4. 查看服务状态，输入以下内容：\n\
  \n```\n$ systemctl status simp.service\n● simp.service\n         Loaded: loaded\
  \ (/etc/systemd/system/simp.service; static)\n         Active: active (running)\
  \ since Sat 2025-04-22 06:48:00 PST; 25s ago\n       Main PID: 14171 (python3)\n\
  \          Tasks: 1 (limit: 4164)\n            CPU: 19ms\n         CGroup: /system.slice/simp.service\n\
  \                 └─14171 python3 -m http.server -d /home/bob 8000\nMar 22 6:48:25\
  \ PST systemd: Started simp.service.\n$\n```\n\n5. 在浏览器中查看该服务提供的页面，输入 URL `127.0.0.1:8000`。\n\
  \n6. 停止服务，输入以下命令：\n\n```\n$ systemctl stop simp.service\n```\n\n## 章末练习\n\n16. a)\
  \ 修改 `simp.service` 服务，将 `Python3` 内置 Web 服务器暴露在端口 `8001`。同时修改 `index.html` 的内容以符合你的喜好。添加文本、图像等。将服务命名为\
  \ `simp2`，并完成上述 6 个步骤。然后同时运行 `simp` 和 `simp2`，使用你喜欢的浏览器访问 8000 和 8001 。你看到了什么？\n\
  \nb) 你如何安全地将端口 `8000` 和 `8001` 暴露到互联网，以便从远程站点看到你创建的页面？\n\n\n\n管理特定类型或类硬件（如磁盘卷或 ZFS\
  \ 数据集）的新型守护进程（daemons），仅在相应类型的硬件插入或变得可用时才会被激活。\n\n### 基于路径的激活\n\nsystemd 提供了一种将服务激活与文件系统更改绑定的方法。这是通过在路径单元文件（path\
  \ unit files）中配置基于路径的激活来实现，如 `systemd.path` 手页中所示和描述的那样。\n\n### 基于定时器的激活\n\n新型守护进程可以实现旨在定期间隔执行的清理任务。在\
  \ systemd 中，这是通过定时器单元文件（timer unit files）实现的，如上例所示，并在 `systemd.timer` 手页中有描述。\n\n\
  服务通过上述方法中的一种一种进行激活是可能的，也是优的。\n\n这种例子包括 Wi-Fi、蓝牙和 CUPS 打印机服务，它们可以在相应设备插入时，或在特定端口上首次看到活动时被激活。\n\
  \n我们在第 2.7.1.1 节中提供了一个基于套接字的激活的简单示例。\n\n#### 2.7.1.1 一个简单的基于套接字的激活示例\n\n**注意**\n\
  \nsystemd 为树莓派 5 OS 提供的效率和速度优势部分在于它可以延迟服务和服务进程的启动，直到它们被实际需要，而不是在系统启动并进入稳定运行状态运行时运行它们。\n\
  \n对于守护进程（如 Web 服务器），基于套接字的激活意味着当 Web 服务器挂载的指定端口上发出请求时，Web 服务器将作为守护进程启动。然后它将处理该端口上的所有请求。\n\
  \n在这个示例中，我们使用特殊的 `systemd-activate` 命令（该命令通常用于测试基于套接字的激活）来实现我们的目标。`systemd-activate`\
  \ “监听”一个端口。\n\n以下是你可以轻松采取的步骤，以便在在你选择的特定端口上发出 HTTP 请求时启动 Web 服务器应用程序。你可以将下方示例步骤中显示的端口号更改为任何任何临时端口。\n\
  \n1. **可选的** 如果你还没有为你树莓派 5 OS 系统的主目录中放置一个有效的 `index.html` 文件，请参考上述第 2.7 节中的示例进行进行操作。\n\
  \n**注意** 我们在下方步骤中的主目录是 `/home/bob`。\n\n第 238 页 此外，我们非常简单的 `index.html` 文件如下：\n\n\
  ```html\n<!DOCTYPE HTML PUBLIC \"-//W3C//DTD HTML 4.0 Transitional//EN\">\n<html><head>\n\
  \            <meta http-equiv=\"content-type\" content=\"text/html; charset=utf-8\"\
  />\n            <title></title>\n            <meta name=\"generator\" content=\"\
  LibreOffice 4.3.5.2.0 (FreeBSD)\"/>\n            <meta name=\"created\" content=\"\
  2025-04-25T18:47:03.316903354\"/>\n            <meta name=\"changed\" content=\"\
  2025-04-25T18:48:11.21381830\"/>\n            <link href=\"/home/bob/favicon.ico\"\
  \ rel=\"icon\" type=\"image/x-icon\" />\n</head>\n<body lang=\"en\" dir=\"ltr\"\
  \ style=\"background: transparent\">\n<p>Under Construction</p>\n</</body>>\n</html>\n\
  ```\n\n2. 输入以下命令（其中将路径 `/home/bob` 替换为你放置 `index.html` 文件的目录路径）：\n\n```bash\nsystemd-socket-activate\
  \ -l 2000 -a python3 -m http.server -d /home/bob 8096\n```\n此命令等待端口 2000 上的 3 号\
  \ 请求，然后当一个请求进来时（例如来自 浏览器），它将执行 `-a` 选项后的命令来激活 `Python3 http.server` 内置应用程序。所以基本上，你正在使用\
  \ `systemd-socket-activate` 命令激活端口 2000，然后将 `python3` 耦合到此激活中，以便在端口 8096 上运行 `http.server`\
  \ 内置应用程序。\n\n3. 使用你最喜爱的 浏览器测试此激活，将 URL 设置为 `http://your_ip_address:2000`。我们的本地网络地址是\
  \ `192.168.1.14`。\n\n**注意** 你将在浏览器中收到一个错误，或者浏览器会旋转一段时间。在你输入命令的终端窗口中，将显示：\n\n```\n\
  Listening on [::]:2000 as 3.\nCommunication attempt on fd 3.\nConnection from 192.168.1.14:50418\
