  \ 68 页。\n\n### 1.5.2 在文本界面中添加和维护用户组\n\n创建和管理用户账户及组的最简单高效的方法是使用 Webmin。从 Webmin 的主菜单中，你可以选择\
  \ System > Users and Groups（系统 > 用户和组）来查看、创建和删除它们。我们确实建议在控制台或终端进行文本交互时，使用 `addgroup`\
  \ 和 `adduser` 命令来管理组。\n\n#### 章节练习\n\n9. 房间里有一台物理隔离的树莓派 5。你只想让名为 `proj` 的定义组中的某些特定用户能够访问文件系统中名为\
  \ `/proj1` 目录中的文件。使用上述命令将这些特定用户以及你自己加入 `proj` 组。第 69 页\n\n10. 创建 `/proj1` 目录。然后，在你的家目录、`/proj1`\
  \ 目录以及放入该目录的任何文件上适当设置权限位，使得只有那些特定用户可以读取、写入和执行文件。第 7 页。\n\n### 1.5.3 从命令行修改和删除用户账户\n\
  \n要通过命令行有效地从系统中删除用户账户或组，请使用 `deluser` 或 `delgroup` 命令。从树莓派 5 操作帮助页面中摘取的这些命令的简要描述如下：\n\
  \n```\n *******************************************************\ndeluser, delgroup\
  \ - 从系统删除用户或组\n\nSyntax:\ndeluser [options][--force][--remove-home] [--remove-all-files]\n\
  \      [--backup] [--backup-to DIR]\ndeluser --group [options] group\ndelgroup [options]\
  \ [--only-if-empty] group\n\nPurpose: deluser 和 delgroup 根据命令行选项以及 /etc/deluser.conf\
  \ 和\n/etc/adduser.conf 中的配置从系统中删除用户和组。\n\nCommon Options:\n      --conf FILE   \
  \ 使用 FILE 代替 /etc/deluser.conf\n      --version      显示版本和版权信息。\n****************************************************************\n\
  ```\n\n\n\n\n```\n **********************************************************************\n\
  usermod - 修改用户账户\n\n语法:\n      usermod [options] LOGIN\n\n用途: `usermod` 修改系统账户文件，以反映命令行中\n\
  \      指定的更改，针对 `LOGIN` 名称。\n\n常用选项:\n      -a, --append\n      将用户添加到附加组（组）中。仅配合\
  \ `-G` 选项使用。\n      -d, --home HOME_DIR\n      用户新的登录目录。\n      -G, --groups GROUP1[,GROUP2,...[,GROUPN]]]\n\
  \      用户所属的附加组列表。每个组之间\n      用逗号分隔，中间没有空格。\n      -l, --login NEW_LOGIN\n    \
  \  用户的用户名将从 `LOGIN` 更改为 `NEW_LOGIN`。\n      其他内容不会发生变化。特别是，用户的家目录\n      可能需要手动重命名以反映新的登录名。\n\
  \      -m, --move-home\n      将用户家目录的内容移动到新位置。\n      -s, --shell SHELL\n      用户新登录\
  \ shell 的名称。将此字段留空会导致系统\n      选择默认的登录 shell。\n*********************************************************************\n\
