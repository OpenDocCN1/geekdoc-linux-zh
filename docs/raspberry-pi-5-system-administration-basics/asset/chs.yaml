  ## 2.1 初学者的 systemd 应用\n\n在本章中，我们为新手用户提供了关于名为 `systemd` 的 Linux“超级内核”的简短但实用的介绍。除非该新手（甚至是更有经验的系统专业人员）不仅拥有基础知识，还完整了解\
  \ `systemd` 如何控制和监督树莓派 5 OS 的每一个进程操作，否则他们永远无法管理和实现其用例最终可能需要的功能。特别是对于系统上的用户群体以及该用户群体提出的需求。\n\
  \n### 2.1.1 systemd 的发展及其与 Linux 生态系统的集成\n\nLinux 操作系统自 1991 年诞生以来已经历了无数变化。近年来最重大且最具争议的进展之一是引入\
  \ `systemd`，这是一种取代传统的 System V init 和 `Upstart` 的初始化系统。`systemd` 的主要目标之一是使系统初始化和服务管理现代化并精简化，但它的采用引发了开发者和用户的广泛争议。在这里，我们探索\
  \ `systemd` 的发展、其关键特性、与 Linux 生态系统的集成以及对 Linux 未来的更广泛影响。\n\n#### 2.1.1.1 systemd\
  \ 的背景和动机\n\n在 `systemd` 之前，大多数 Linux 发行版依赖于 System V init，这是一个继承自 Unix 的系统，使用 `shell\
  \ scripts` 来启动和管理服务。虽然 System V init 简单且易懂，但它存在几个局限性：\n\n1. **顺序启动**：服务一个接一个地启动，导致启动时间过长。\n\
  2. **缺乏并行性**：对于现代多核处理器，无法并行启动服务意味着资源利用率低下。\n3. **无内置服务监控**：如果服务崩溃，System V init\
  \ 没有机制重启它。\n4. **复杂的基于脚本的配置**：服务管理需要 shell 脚本编写，使得难以维护。\n\n为了解决这些缺点，一些发行版尝试了替代性的初始化系统。由\
  \ Canonical 为 Ubuntu 开发的 `Upstart` 引入了事件驱动的服务管理，但仍然依赖脚本，且在 Ubuntu 之外并未被广泛采用。对更高效、功能更丰富的初始化系统的需求导致了\
  \ `systemd` 的开发。\n\n#### 2.1.1.2 systemd 的发展\n\n`systemd` 由红帽的开发者 Lennart Poettering\
  \ 和 Kay Sievers 创建，并于 2010 年首次发布。它从底层开始设计，旨在利用现代计算能力同时提供稳健的服务管理。“system”这一名称遵循 Unix\
  \ 命名规范，其中“d”代表“daemon”（守护进程）。\n\n`systemd`set 的核心设计原则包括：\n\n1. **并行化**：`systemd`\
  \ 尽可能并行启动服务，缩短了启动时间。\n2. **套字和总线激活**：服务仅在需要时才启动，减少了资源消耗。\n3. **服务监督**：`systemd`\
  \ 监控服务并在其失败时重启它们。\n4. **统一配置**：`systemd` 使用声明式单元文件代替 shell 脚本，更加简单且易于管理。\n5. **与\
  \ Linux 技术集成**：`systemd` 整合了用于资源管理的 `cgroups`（控制组）和用于日志记录的 `journald` 等特性。\n\n###\
  \ 2.1.2 systemd 的特性和功能\n\n正如在本章大部分内容中所详细解释的，以下是 `systemd` 最重要的特性和功能：\n\n1. **单元文件（Unit\
  \ Files）**：`systemd` 用单元文件取代了传统的初始化脚本，文件定义了如何管理服务、挂载点、设备和其他系统组件。这些单元文件存储在：\n\n```\n\
  /etc/systemd/system 和/usr/lib/systemd/system\n```\n\n这是一个简单的服务单元文件示例：\n\n```\n[Unit]\n\
  Description=My Custom Service\nAfter=network.target\n\n[Service]\nExecStart=/usr/bin/myservice182\n\
  Restart=always\nUser=nobody\n\n[Install]\nWantedBy=multi-user.target\n```\n\n这种结构化的方法使得定义依赖关系和管理服务变得更容易。\n\
  \n2. **并行和按需服务启动**\n\n\n\n\n\n与遵循严格顺序过程的 System V init 不同，`systemd` 利用了基于依赖关系的并行启动。这意味着如果多个服务之间相互独立，它们可以同时启动。此外，基于套接字的激活（socket-based\
  \ activation）允许 `systemd` 仅在服务首次被请求时才启动，从而提高了效率。\n\n## 3. Journald 与日志记录\n\nsystemd\
  \ 包含了 `journald`，这是一个取代传统 `syslog` 的日志系统。它提供了结构化的、索引化的日志，允许高级的过滤和搜索。\n\n查看特定服务的日志：\n\
  \n```\n $ journalctl -u myservice\n```\n\n`journald` 支持二进制日志，某些用户批评这些日志难以用标准的文本处理工具进行处理。\n\
  \n## 4. Cgroups 集成\n\nsystemd 与 Linux 控制组 (`cgroups`) 深度集成，允许对服务进行细粒度的资源管理。这确保了失控进程不会消耗过多的系统资源。\n\
  \n例如，限制服务的内存使用：\n\n```\n $ systemctl set-property myservice MemoryLimit=500M\n```\n\
  \n## 5. 基于 Target 的启动过程\n\nsystemd 用目标（targets）取代了传统的运行级别（runlevels）。示例包括：\n\n*\
  \   `multi-user.target`:等同于运行级别 3（文本多用户模式）\n*   `graphical.target`:等同于运行级别 5（GUI\
  \ 模式）\n*   `rescue.target`:等同于系统恢复的单用户模式\n\n在目标之间切换非常简单：\n\n```\n $ systemctl isolate\
  \ graphical.target\n```\n\n### 2.1.3 systemd 与 Linux 生态系统的集成以及被主流发行版的采纳\n\n自发布以来，`systemd`\
  \ 已被大多数主流 Linux 发行版采纳，包括：\n\n*   Red Hat Enterprise Linux (RHEL)\n*   Fedora\n*\
  \   Debian Bookworm 和 Trixie，以及下游的 Raspberry Pi 5 OS\n*   Ubuntu\n*   Arch Linux\n\
  *   openSUSE\n\n`systemd` 的广泛采纳使得不同发行版之间提供了更一致的体验。然而，某些项目（如 Devuan 和 Alpine Linux）明确拒绝了\
  \ `systemd`，转而采用更简单的 init 系统。\n\n### 2.1.4 与 Linux 内核的集成\n\n虽然 `systemd` 本身不是 Linux\
  \ 内核的一部分，但它与内核功能深度集成。一些关键集成包括：\n\n*   `cgroups`: `systemd` 使用 `cgroups` 来管理服务资源。\n\
  *   `namespaces`: `systemd` 利用内核命名空间来实现安全和隔离。\n*   `udev`: `udev` 设备管理器（以前是一个独立项目）现在已成为\
  \ `systemd` 的一部分。\n\n通过与内核的紧密集成，`systemd` 实现了 System V init 无法实现的效率和控制水平。\n\n###\
  \ 2.1.5 systemd 的未来与 Raspberry Pi OS\n\n尽管存在争议，`systemd` 已经确立了其大多数 Linux 发行版标准 init\
  \ 系统的地位。它的活跃持续引入新功能，例如：\n\n*   `systemd-homed`: 一个以可移植方式管理家目录的功能。\n*   `systemd-oomd`:\
  \ 一个用户态内存溢出（OOM）守护进程，主动管理系统内存。\n\n`systemd` 的持续演进表明，在未来几年内它将继续是 Linuxget 的核心。虽然某些发行版将继续抵制采纳，但\
  \ `systemd` 的效率和功能使其难以被忽视。\n\n### 2.1.6 提示\n\n本章中阐插的所有内容，以此处的特定形式（以及命令语法），明确适用于\
  \ Raspberry Pi 5 OS。\n\n主题的选择性选取是根据初者的教学需求进行的，正如上一章前面的系统管理材料中所述的那样。\n\n任何你在命令行上需要输入的内容都以**粗体**显示，后面始终跟着按下键盘上的\
  \ <Enter> 键。\n\n## 2.2 在初始内存磁盘 (initrd) 中启动\n\nRaspberry Pi 5 OS 的初始内存磁盘实现 (`initrd`)\
  \ 也可以使用 `systemd` 进行设置，并遵循预定义的结构。`initrd` 是一种从各种可能源将根文件系统加载到内存的方案，作为 Raspberry Pi\
  \ 5 OS 启动过程的一部分。\n\n### 2.2.1 查询启动过程\n\n如第 2.6.2.6 节所示，*systemd journald 守护进程*和日志让你能够查看系统如何启动的日志记录。特别是，它允许你使用特定的命令行工具、选项及其参数来查看当前启动过程和过去启动过程的日志记录。请参阅第\
  \ 2.6.2.6 节以获取关于 `systemd journal` 及其启动日志能力的更完整介绍。\n\n## 2.3 systemd Unit 与单元文件\n\
  \n`systemd unit files` 是学者需要理解的 `systemd` 最关键且无处不在的功能之一。在本节中，我们将讨论更多 `systemd` 单元和单元文件的底层功能和应用。\n\
  \n### 2.3.1 单元与单元文件简介\n\n在 `systemd` 中，单元（unit）指的是改变 Raspberry Pi 5 OS 稳定状态或正常运行条件特征的对象。单元和单元文件是\
  \ `systemd` 使用 `systemctl` 等用户命令创建和操作的主要对象。这些对象通过称为单元文件的文件进行配置。我们将向你介绍 `systemd`\
  \ 可以处理的不同单元。我们还将涵盖单元文件中用于以配置这些对象的各种“指令”。\n\n### 2.3.2 单元的作用\n\n单元和单元文件以非常标准的格式呈现，我们将在后面详细描述。它们在\
  \ `systemd` 中通过守护进程、服务、目标、核心组件、库和内核元素管理系统资源，如图 2.1 所示。\n\n![systemd 框架显示了工具命令、守护进程、目标、核心部分、库和内核元素及其组织关系。](img/fig2_1.jpg)\
  \ <details id=\"kfig2_1\"><summary>图 2.1 说明</summary> \n\nsystemd 框架分为多个部分。工具命令包括\
  \ `systemctl`, `journalctl`, `notify`, `analyze`, `c g s`, `c g top`, `loginctl`\
  \ 和 `nspawn`。守护进程包括 `systemd`, `journald`, `networkd`, `logind` 和用户会。目标分类为基础、带 d\
  \ bus 和 logind 的多用户、重启、关机、带显示服务的用户会。核心部分包括管理器 `systemd`，单元有 `service`, `timer`,\
  \ `mount`, `target`, `snapshot`, `path`, `socket`, `swap`, `automount`, `slice`,\
  \ `device` 和 `scope`。核心部分还包括多席登录、抑制（inhibit）和会话（session），以及 `pam`, `namespace`,\
  \ `cgroup` 和 `d bus`。列出的库有 `d bus 1`, `libpam`, `libcap`, `libcryptsetup`, `tcpwrapper`,\
  \ `libaudit` 和 `libnotify`。内核元素为 `cgroups`, `autofs` 和 `kdbus.`details>\n\n图 2.1\
  \ systemd 架构。返回文本和整本书所示！\n\n单元的一些关键优势功能包括：\n\n1.  **基于套接字的激活**：延迟服务的启动直到套接字激活。这一功能对于加快系统运行以及启动过程本身至关重要。\n\
  \n2.  **基于 D-bus 的激活**：当关联总线发布时启动单元。\n\n3.  **基于路径的激活**：根据某些文件系统路径的活动或可用性启动单元。\n\
  \n\n\n\n4. **udev 基于设备的激活**：单元的启动也可以被延迟，直到某个硬件首次变得可用。这一特性对于让系统运行得更快、启动速度快得多也至关重要。\n\
  \n5. **隐式依赖关系映射**：单元在启动期间的大多数依赖关系可以由 `systemd` 自身构建，尽管用户也可以通过编辑和更改单元之间的依赖关系对其进行修改。\n\
  \n6. **实例与模板**：模板单元文件可以用于创建同一个通用单元的多个实例。这在通过容器和虚拟机进行操作系统虚拟化时非常关键且高效！\n\n7. **安全性**：单元可以通过在单元文件中使用指令来实现各种安全功能。\n\
  \n8. **Drop-ins 和片段的可扩展性**：通过提供将覆盖系统单元文件部分内容的修饰符（modifiers），可以轻松扩展单元。\n\n我们将在接下来的章节中介绍上述的许多功能。\n\
  \n### 2.3.3 单元文件在文件系统中的位置及其或修改\n\n单元文件基本上位于 Raspberry Pi 5 操作系统文件系统结构中三个不同的、非常标准的位置，具体取决于单元文件的重要程度。\n\
  \n表 2.1 列出了这些默认位置，并对其用途进行了简要描述。\n\n表 2.1 单元文件位置 返回文本。⏎\n\n| `/etc/systemd/system`\
  \ | 存放覆盖默认单元的单元文件。 |\n| `/run/systemd/system` | 运行时动态生成的单元文件。 |\n| `/lib/systemd/system`\
  \ | 安装的默认单元文件。 |\n\n在 `/etc/systemd/system` 中存放的单元文件通常用于覆盖默认的单元。`/run/systemd/system`\
  \ 目录用于存放运行时动态生成的单元文件。而 `/lib/systemd/system` 则包含了安装的默认单元文件。\n\n通过编辑和更改单元之间的依赖关系，用户可以对其进行修改。通过提供将覆盖系统单元文件部分内容的修饰符，可以轻松扩展单元。\n\
  \n我们将在接下来的章节中介绍上述的许多功能。\n\n#### 2.3.3 单元文件基本上位于 Raspberry Pi 5 操作系统文件系统结构中三个不同的、非常标准的位置，具体取决于单元文件的重要程度。\n\
  \n在 `/etc/systemd/system` 目录中存放的单元文件通常用于覆盖默认的单元。`/run/systemd/system` 目录用于存放运行时动态生成的单元。而\
  \ `/lib/systemd/system` 则包含了安装的默认单元文件。\n\n#### 2.3.3.1 编辑单元文件\n\n编辑单元文件对于管理服务非常重要。`systemctl`\
  \ 命令提供了相应的选项。\n\n```bash\nsystemctl edit\n```\n\n对于需要创建并运行的单元，在 `/etc/systemd/system`\
  \ 中创建一个以 `.d` 结尾的目录。对于 `example.service` 单元，则创建一个 `example.service.d` 子目录。在该目录中，以\
  \ `.conf` 结尾的文件可以用于覆盖或添加默认单元文件的指令。\n\n如果你需要修改单元文件的副本，将其放置在该目录中是最可靠、安全且灵活的方法。\n\n\
  ```bash\nsystemctl edit --full example.service\n```\n\n### 2.3.4 单元类型\n\n`systemd`\
  \ 单元以及定义它们的文件是 `systemd` 用于控制系统状态的主要机制。通过观察单元文件的后缀，你可以判断它是哪种类型的单元。以下列表描述了可选的单元类型：\n\
  \n1. `.service`：服务单元（我们将在下方详细介绍）描述了如何管理服务或应用程序。如可执行文件的路径、服务如何启动和停止、何时以及如何自动启动、依赖关系和顺序信息都包含在这里。这些也是我们在\
  \ 2.6.1 节中介绍的 cgroup 的一部分。\n\n2. `.socket`：定义用于套接字激活的网络、IPC 套接字或 FIFO 缓冲区。套接字激活会在接收流量时启动服务。这允许服务的并行启动，是一种与以往初始化系统不同的非常重要的加速机制。我们将在下方提供示例。\n\
  \n3. `.device`：描述由 `udev` 或 `sysfs` 文件系统管理的设备。`udev` 是 Linux 内核的设备管理器，管理 `/dev`\
  \ 目录中的设备节点。它还管理用户空间事件以及系统中添加或移除的设备。\n\n4. `.mount`：定义挂载点。它们根据挂载路径命名，并将路径中的斜杠替换为连字符。\n\
  \n5. `.automount`：定义自动分配的挂载点。它们必须根据其引用的挂载点命名，并有一个匹配的 `.mount` 单元来定义挂载的具体细节。\n\n\
  6. `.swap`：定义 Raspberry Pi 5 操作系统上的交换空间。这些单元的名称来自于交换空间的设备名称或文件路径。\n\n\n\n\n\n7.\
  \ `.target`: 提供了一种在系统启动或系统状态发生变化时协调其他单元操作的方法。一个很好的例子（我们在第 2.5.3 节中描述）是从 `multi-user.target`\
  \ 状态切换到 `graphical.target` 状态，反之亦然。本章涵盖了可以使用 target 执行的大操作。\n\n8. `.path`: 定义一个可用于基于路径激活的路径。基于路径的激活允许操作系统在特定文件、文件组或目录以某种方式被修改或更改时采取行动。\n\
  \n9. `.timer`: 我们将在第 2.6.3 节中详细介绍这些。它们定义了 systemd 在控制系统状态时使用的定时控制。\n\n10. `.snapshot`:\
  \ 由 `systemctl snapshot` 命令自动创建。快照没有关联的单元文件。它允许你在做出更改后重构系统当前状态的部分内容。需要注意的是，快照不会在系统重启或重新启动后存在，它们本质上是用于回滚到当前启动期间的临时系统状态。\n\
  \n11. `Page 190.slice`: 由 Linux cgroup 节点定义，允许将系统资源分配给与命名 slice 关联的进程。这些也是关键 cgroup\
  \ 功能，在第 2.6.1 节中详细介绍。\n\n12. `.scope`: 由 systemd 自动创建，使用其总线接口的信息。这些也是关键 cgroup 功能，在第\
  \ 2.6.1 节中详细介绍。\n\n对于树莓派 5 系统的普通用户，我们将主要关注 `.service` 单元文件的编辑和创建。这是因为它们对普通用户最有用，且符合他们可能使用的系统用例。我们还将详细说明指定的系统管理员如何使用它们来管理系统状态。除了\
  \ `.service` 单元文件外，所有其他单元文件类型基本上都是协调和同步工具，将服务与硬件、cgroups、IPC sockets、定时约束等连接起来。这种协调和同步是\
  \ systemd 的标志和最大的优势，也是它优于任何旧版 UNIX 或 Linux init 系统的主要优势。\n\n### 2.3.5 单元文件的结构分析\n\
  \n单元文件的内部结构被分为若干部分（Sections）。部分由一对方括号 `[` 和 `]` 隔开，部分名称位于括号内。每个部分一直持续到下一个部分的开始或到文件的末尾。\n\
  \n#### 2.3.5.1 示例服务单元文件 – ssh.service\n\n在此处展示一个典型服务单元文件的结构和确切内容将非常有启发意义。图 2.2 显示了我们树莓派\
  \ 5 系统上 ssh 单元文件的内容，位于 `/lib/systemd/system`。在阅读实际的服务单元文件（可能是你系统上的 ssh 服务文件）时，你应该仔细查看此图以进行对比。\n\
  \n```\n[Section]\nDirective=value\nDirective=value\n\n[Unit]\nDescription=OpenBSD\
  \ Secure Shell server\nDocumentation=man:sshd(8) man:sshd_config(5)\nAfter=network.target\
  \ auditd.service\nConditionPathExists=!/etc/ssh/sshd_not_to_be_run\n\n[Service]\n\
  EnvironmentFile=-/etc/default/ssh\nExecStartPre=/usr/sbin/sshd -t\nExecStart=/usr/sbin/sshd\
  \ -D $SSHD_OPTS\nExecReload=/usr/sbin/sshd -t\nExecReload=/bin/kill -HUP $MAINPID\n\
  KillMode=process\nRestart=on-failure\nRestartPreventExitStatus=255\nType=notify\n\
  RuntimeDirectory=sshd\nRuntimeDirectoryMode=0755\n\n[Install]\nWantedBy=multi-user.target\n\
  Alias=sshd.service\n```\n\n图 2.2 ssh 单元文件示例。返回正文。⏎\n\n#### 2.3.5.2 单元文件的通用格式\n\n\
  如图 2.2 所示，示例文件被分为若干部分。部分名称大小写敏感，并包含在方括号 `[]` 中。在每个部分内部，单元的工作和数据存储使用标准、简单的指令（directives）完成，允许的赋值分配如下：\n\
  \n在任何部分中：\n\nPage 191 如果你使用覆盖文件（override file），正如第 2.3.3 节中编辑单元文件时解释过的，通过将指令赋为空字符串或空值来重置指令。例如，系统的单元文件副本可能将某个指令设置为如下值：\n\
  \n```\nDirective=default_value\n```\n\n在覆盖文件中，可以通过不带值地引用指令来消除 `default_value`，如下：\n\
  \n```\nDirective=\n```\n\n#### 2.3.5.3 ssh 示例单元的 Service 和 Install 部分指令\n\n本节详细介绍了\
  \ ssh 示例单元文件中三个部分的特定指令，如图 2.2 所示。\n\n**[Unit] 部分指令**\n\n在 `ssh.service` 单元文件中找到的第一个部分是\
  \ `[Unit]` 部分。这通常用于定义单元的元数据并配置单元与其他单元的关系。`[Unit]` 部分中的特定指令有：\n\n1. `Description=`OpenBSD\
  \ Secure Shell server` - 描述单元的名称。\n2. `Documentation=`man:sshd(8) man:sshd_config(5)`\
  \ - 指描述 `ssh` 的现有 man 手页。\n3. `After=network.target auditd.service` - 在当前单元之前启动单元。\n\
  4. `ConditionPathExists=!/etc/ssh/sshd_not_to_be_run` - 可用于提供仅在适当系统上运行的通用单元文件。\n\
  \n**[Service] 部分指令**\n\n`[Service]` 部分提供了配置。`[Service]` 部分应该指定的类型是服务的 `Type=`。这根据进程及其守护行为对服务进行分类。\n\
  \n1. `EnvironmentFile=-/etc/default/ssh` - 从文本文件为单元读取环境变量。\n2. `ExecStartPre=/usr/sbin/sshd\
  \ -t` - 在 `ExecStart=` 命令之前执行的额外命令。\n3. `ExecStart=/usr/sbin/sshd -D $SSHD_OPTS`\
  \ - 可能是最重要的指令！它指定了启动进程的完整路径和可能的参数。\n4. `ExecReload=/usr/sbin/sshd -t` - 此可选指令指示了在可用时重新加载服务配置所需的命令。\n\
  5. `KillMode=process` - 指定如何杀死与此单元关联的进程。\n6. `Restart=on-failure` - 指定在什么情况下重启服务。\n\
  \n\n\n\n指示 systemd 将如何尝试自动重启服务。允许的值有 \"always\"\"on-success\"\"on-failure\"\"on-abnormal\"\
  \"on-abort\" 或 \"on-watchdog\"。\n\n### 6. `RestartPreventExitStatus=255`\n\n列退出状态定义，当主服务进程返回这些状态时，无论配置了什么\
  \ `Restart=` 设置，都将防止服务的自动重启。退出状态定义为数值退出码或终止信号名称，并用空格分隔。\n\n### 7. `Type=notify`\n\
  \n在某些限制条件内，为此服务单元建立进程启动类型。该类型可以是：simple、forking、oneshot、dbus、notify 或 idle。\n\n\
  ### 8. `RuntimeDirectory=sshd`\n\n接收一个空格分隔的目录名称列表作为参数。目录名是相对路径，且可以包含父目录指定 (..)。\n\
  \n### 9. `RuntimeDirectoryMode=0755`\n\n以八进制数指定 `RuntimeDirectory=`、`StateDirectory=`、`CacheDirectory=`、`LogsDirectory=`\
  \ 或 `ConfigurationDirectory=` 中指定目录的访问模式。默认值为 0755。\n\n## [Install] 节指令\n\n`ssh.service`\
  \ 单元文件中找到最后一个节是 `[Install]` 节。该节是可选的。它用于配置启用或禁用单元的额外功能。单元可以通过此节中的指令在启动时自动启动。\n\n\
  1. `WantedBy=multi-user.target`\n`WantedBy=` 指令是指定单元如何启的最常用方法。它类似于 `[Unit]` 节中的\
  \ `Wants=`。当带有此指令的单元被启用时，会在 `/etc/systemd/system` 中创建一个以指定单元命名并附加 `.wants` 后缀的目录。随后会创建一个指向当前单元的符号链接，从而建立依赖关系。如果当前单元具有\
  \ `WantedBy=multi-user.target`，则会在 `/etc/systemd/system` 中创建一个名为 `multi-user.target.wants`\
  \ 的目录（如果不存在），并在该目录中放置指向当前单元的符号链接。禁用此单元将移除该链接和依赖。\n\n2. `Alias=sshd.service`\n`Alias=`\
  \ 指令允许单元以另一个名称被启用。\n\n## 2.3.5.4 附加单元节及其单元特定指令\n\n如 `ssh.service` 单元文件示例所示，`[Service]`\
  \ 节位于 `[Unit]` 和 `[Install]` 节之间。在更复杂的单元文件中，`[Unit]` 和 `[Install]` 之间会找到以下节。注意，在所有单元类型中，大多数包含仅适用于其类型的指令。以下简要列表为分配给这些节的额外值提供了参考：\n\
  \n### [Socket] 节\n\n配置 Socket 单元文件是因为，如下文许多节所示，服务通过基于 socket 的激活来实现系统并行化和加速。注意，每个\
  \ socket 单元必须有一个匹配的服务单元，当 socket 接收到活动时，该服务单元将被激活。这可能是 systemd 控制的特征，socket 控制方法简化并增强了管理员监督所有发生事件的能力。默认情况下，socket\
  \ 名称将在接收到连接时尝试启动同名的服务。当服务初始化时，socket 将传递给它，允许其开始处理任何请求。要指定实际 socket，首要指令是 `ListenStream=`，它定义了流\
  \ socket 的地址并支持 IPC 通信。使用 TCP 的服务通常使用这种单元类型。\n\n### [Timer] 节\n\n此节用于在特定的时间调度系统事件，该时间可以通过时钟、日历或特定延迟后测量。这种单元类型旨在取代传统的\
  \ cron 守护进程。必须创建一个单元文件（如服务单元）以便定时器触发时激活！单元文件的 `[Timer]` 节包含 `Unit=` 指令，它指定当定时器发出事件时应激活的单元。\n\
  \n### 2.3.6 从模板单元文件创建实例单元\n\n对于普通用户来说，模板单元文件允许你多次复制单元文件以获取其多个副本（你可以对每个副本进行微调）。使用模板单元文件的主要商业或甚至非商业理由是在服务器上运行多个虚拟化容器。例如，当你想要让许多服务同时监听许多\
  \ socket 或端口时，你可以作为独立的隔离虚拟虚拟机或容器环境运行该服务的多个实例，每个实例都有不同的名称，并各自使用它们监听的不同的临时端口。你必须将这些虚拟机或容器的端口映射到面向网络的\
  \ IP 地址。这些地址可以是 DHCP 服务器分配的面向公网的网络地址，而不是主要用于 Docker 等容器软件的私有地址。\n\n#### 2.3.6.1\
  \ 服务的模板和实例单元名称\n\n模板单元文件在名称之后、类型之前包含一个 `@` 符号。\n\n**本章练习**\n- 在你的树莓派 5 OS 系统上找到模板单元文件的示例。\n\
  \n## 2.4 目标 (Targets)\n\n目标或目标单元与其他所有 systemd 单元类型相同。它们使用依赖关系（用于状态更改，如启动或关机）将单元集合在一起，并为单元之间的依赖同步创建标准或用户定义的名称。作为其使用的示例，启动和关闭系统的进程被\
  \ systemd 以顺序（而非硬编码！）使用目标单元使用。\n\n### 2.4.1 基础目标概念\n\nsystemd 可以通过使用标准和命名的目标单元为树莓派\
  \ 5 OS 执行启动、系统服务管理和其他功能。例如，名为 `graphical.target` 的目标提供了一个具有网络连接和图形显示器的多用户系统。具有单元依赖关系的单元集合可以将与状态相关的控制分组，并提供建立自定义系统状态控制的方法。\n\
  \n表 2.2 显示了一些关键的 systemd 目标单元。\n\n#### 表 2.2 systemd 重要目标\n\n| 目标 | 说明 |\n| :---\
  \ | :--- |\n| `default.target` | 默认启动的目标。不是真实的目标，而是指向另一个目标（如 `graphical.target`）的符号链接。\
  \ |\n| `emergency.target` | 在控制台上启动紧急 shell。仅在启动提示符处作为 `systemd.unit=emergency.target`\
  \ 使用。 |\n| `graphical.target` | 桌面系统 GUI 安装的默认目标。启动具有网络、多用户支持和显示器的系统。 |\n| `halt.target`\
  \ | 关闭系统。 |\n| `multi-user.target` | 启动具有网络的多用户系统。 |\n| `reboot.target` | 重启系统。\
  \ |\n| `rescue.target` | 启动没有网络的单用户系统。 |\n\n以下是其他特殊系统目标单元的列表和描述。要查看完整列表，请参阅系统上的\
  \ `systemd.special` 手页。顺便提到，这些目标状态是旧版 Linux 初始化系统中的“运行级别”(run levels) 的等效物。\n\n\
  * `basic.target`\n\n\n\n\n一个执行基础启动操作的特殊目标单元。systemd 会自动为该目标单元添加 `Requires=` 和 `After=`\
  \ 类型的依赖。这将启动所有本地挂载点以及 `/var`、`/tmp` 和 `/var/tmp`、交换设备、套接字、定时器、路径单元以及守护进程所需的其他初始化进程。\n\
  \n* `ctrl-alt-del.target`\n  此目标每当终端键盘上按下 `<Control>+<Alt>+<Del>` 时就会启动。它通过符号链接别指向\
  \ `reboot.target`。\n\n* `default.target`\n  启动时的默认 systemd 单元。它通过符号链接别指向 `multi-user.target`\
  \ 或 `graphical.target`。\n\n* `emergency.target`\n  在主控制台上启动紧急 shell 的特殊目标单元。它与 `rescue.target`\
  \ 类似，但它还会启动最基础的服务并挂载所有文件系统。\n\n* `exit.target`（第 197 页）\n  用于关闭系统或用户服务管理器的特殊服务单元。\n\
  \n* `final.target`\n  在系统关闭期间使用的目标，可能在所有正常服务已终止且所有挂载已卸载后启动后期服务。\n\n* `graphical.target`\n\
  \  用于图形登录和操作的特殊目标单元，使用基于 GUI 桌面的 Raspberry Pi 5 OS 系统的默认目标。\n  **注意**：此目标需要 `multi-user.target`\
  \ 作为依赖。\n\n* `halt.target`\n  用于关闭并停止系统的目标单元。\n\n* `kexec.target`\n  通过 `kexec`\
  \ 关闭并重启系统的目标单元。\n\n* `multi-user.target`\n  用于设置具有纯文本控制界面的多用户系统的目标单元。\n  主要用于服务器机器。该目标是\
  \ `graphical.target` 所所需的依赖。\n\n* `poweroff.target`\n  用于关闭并关电系统的目标单元。\n\n* `reboot.target`\n\
  \  用于关闭并重启系统的目标单元。\n\n* `rescue.target`\n  启动基础系统进程（包括系统挂载点）并启动救援 shell 的目标单元。\n\
  \n* `shutdown.target`\n  在系统关闭时停止所有服务的目标单元。\n\n* `slices.target`\n  建立所有在启动后激活的\
  \ slice 单元的目标单元。\n\n* `sockets.target`（第 198 页）\n  配置所有在启动后激活的 socket 单元的目标单元。\n\
  \n* `sysinit.target`\n  启动系统初始化所需的服务的目标。\n\n* `system-update.target`\n  管理离线系统更新的目标单元。\n\
  \n* `timers.target`\n  管理所有在启动后激活的定时器的目标单元。\n\n* `umount.target`\n  在系统关闭时卸载所有挂载点和自动挂载点的目标单元。\n\
  \n### 2.4.2 目标示例：基于时钟时间的脚本运行\n\n问题：作为一个普通用户，你为什么想这样做呢？\n\n答案：对于普通用户来说，一个特别的理由是在一天的某个特定时间，你希望系统通过某些自动化\
  \ shell 脚本（如 Bash）或 Python3 脚本文件在指定的介质上自动备份关键目录和文件。除了备份，你可能还有许多其他想要计划的事件。\n\n事件的“单调调度”可以被视为基于时钟时间让系统中发生事件。时钟时间是以分钟、小时、天、周等为单位指定的。以下示例创建了一个定时器单元，它依赖于特定的目标单元来每天执行一个脚本文件。需要每天运行的服务可以指定为该目标的依赖项。\n\
  \n名为 `your_script` 的脚本文件通过创建一个服务单元文件来变成一个服务。`your_script` 在运行时可以带有参数，如下所示。此外，你必须对\
  \ `your_script` 设置权限（使用 `chmod 755`），以便它在作为服务执行时能够正常运行！\n\n如需了解更多关于 systemd 如何指定时间的信息，请参阅\
  \ `systemd.time` 的帮助页。\n\n1. 使用以下命令创建一个将存放基于日历的定时器单元的目录：\n```\nsudo mkdir /etc/systemd/system/timer_daily.target.wants\n\
  ```\n\n2. （第 199 页）需要使用 nano 文本在指定的路径下创建此定时器单元文件：\n```\nsudo nano /etc/systemd/system/timer_daily.timer\n\
  ```\n并添加以下单元：\n```ini\n[Unit]\nDescription=Daily Timer for Events\n\n[Timer]\nOnBootSec=5min\n\
  OnUnitActiveSec=1d\nUnit=timer_daily.target\n\n[Install]\nWantedBy=basic.target\n\
  ```\n\n3. 使用 nano 文本在指定目录创建目标单元：\n```\nsudo nano /etc/systemd/system/timer_daily.target\n\
  ```\n内容如下：\n```ini\n[Unit]\nDescription=Daily Timer Target\nStopWhenUnneeded=yes\n\
  ```\n\n4. 现在我们已经创建了定时器单元和定时目标文件，向此目标添加事件涉及将事件放入 `/etc/systemd/system/timer_daily.target.wants`\
  \ 文件夹中。\n\n要让任何特定事件每天发生，请在 `/etc/systemd/system/timer_daily.target.wants` 文件夹中为该事件创建一个服务单元文件。\n\
