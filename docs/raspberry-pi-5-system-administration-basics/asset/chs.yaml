  \n### 3.1.2 在 Thonny 中创建并运行简单的 Python 3 程序\n\n让我们在 `Thonny` 中创建并运行一个简单的 `Python\
  \ 3` 程序，它包含一个确定重复结构（而不是不确定结构），并在 Python 3 Shell Area 输出输出。在树莓派 5 上启动 `Thonny`，并在\
  \ Python 3 脚本区域输入以下行（确保每行都按了回车键）：\n\n```\nprint(\"Count for me, Python!\")\nfor\
  \ n in range (5):\n    print(\"I’m counting!\", n)\nprint(\"I’m counting!\")\n```\n\
  \n注意在第二行之后，`Thonny` 自动为第三行插入了强制的 4 个空格缩进！这种自动缩进机制对于结构化编程技术至关重要，控制流结构通过正确的缩进来界定。\n\
  \n注意 `Thonny` 为你实现了这种自动缩进，因为大多数初学者会在程序中提交缩进错误或由于拼写错误导致语法错误。\n\n`Thonny` 也会自动缩进第四行，你可以通过按下键盘上的\
  \ `<Delete>` 键覆盖这种缩进，以便左对齐第四行，就像第一和第二行一样。\n\n现在，点击工具栏区域中的运行图标。在 Shell Area 中应显示以下内容：\n\
  \n```\nCount for me, Python!\nI'm counting! 0\nI'm counting! 1\nI'm counting! 2\n\
  I'm counting! 3\nI'm counting! 4\nI'm done counting!\n>>>\n```\n\n为什么计数从零开始？因为 Python\
  \ 是一个零索引系统，计数从 0 开始，而不是 1。\n\n\n\n\n现在，点击工具栏区域中的保存图标。在弹出的保存对话框中，将此 Python 3 程序命名为\
  \ `looper.py`，确保如所示添加 `.py` 文件扩展名，并在你的系统中指定一个你想要保存程序的文件夹。然后点击保存。一旦保存完成，你会发现 Thonny\
  \ 窗口的标题栏显示了你刚刚保存的程序路径及名称，并且脚本区域（Script Area）顶部的标签页现在显示为 `looper.py`。\n\n**注意**\n\
  \n如果你想在 Thonny IDE 之外以“交互模式”运行该程序，可以像在本章后面的几处所示，通过启动 Python 3 来实现。\n\n### 本练习\n\n\
  1. 如何使用上述程序结构让 Python 从 1 数到 5？\n2. 如何清除脚本区域中的程序？\n\n你已经完成了这第一个 Python 3 程序！在接下来的章节中，我们将涵盖更多关于\
  \ Python 3 程序的语法和结构方面的内容。但现在，请先试着玩玩 Thonny 和这个程序，然后你就可以点击第 249 页的退出工具栏图标。下次你运行 Thonny\
  \ 时，除非你根据本章练习 2 的答案清除了它，否则同一个程序仍会被加载。\n\n## 3.2 Python 3 语言概述\n\n计算机程序按照特定的顺序（从开始到结束）执行并实现目标。它们可能会在该顺序中进行“分支”，可能是根据某些逻辑测试或条件仅执行某些指令。它们还可能根据变化的条件重复某些操作段，无论是根据预定的次数还是无限重复。Python\
  \ 符合这一模型，并采用以下分级方案：\n\n* 第 1 层。Python 3 程序或脚本中的所有内容由模块化组件组成。\n* 第 2 层。这些模块化组件包含语法正确的\
  \ Python 语句。\n* 第 3 层。这些语句包含表达式。\n* 第 4 层。表达式创建并操作对象。\n\nPython 3 代码开发从构建第 1 层语法正确的元素开始，并按顺序向下逐层进行直到达到第\
  \ 4 层。\n\n在树莓派 5 OS 环境中，如果你面临需要编写脚本或进行编程的任务，首先需要决定的是将采用哪种整体指导编程模型来完成任务。简单来说，这意味着使用三种主要的编程模型之一，甚至可能是它们的结合：\n\
  \n1. 过程化/命令式编程模型，\n2. 面向对象编程 (OOP) 模型，或\n3. 逻辑编程模型。\n\n当然，你完成任务或为自己设定任务的程度如何，取决于你在使用其中任何或所有模型时拥有多少脚本编写或编程的经验。也许，如果你是和一群人一起这样做，他们的经验和偏好也有很大影响。但是，如何根据任何一种模型来制定任务，这关系到第\
  \ 250 页的内容，最重要的是你使用这些模型的经验。对于计算机编程领域中存在的大量可能的脚本编写或编程任务，并没有简单的指南来应用任何一种模型。\n\n然而，实现目标的底线在于，你对实现你所选模型的语言语法的熟悉程度。\n\
  \n这就是为什么我们在本章中详细解释 Python 3 语法的原因。Python 3 可以利用所有这些编程模型，事实上，它还可以混合使用模型中所使用的技术。我们在此对此进行一些评论，并在接下来的几节中说明这些模型的简单用法。\n\
  \nPython 3 从根本上说是一种高级的、结构化的（在这种情况下，意味着由规则结构化组件构建，例如确定或不确定的循环）以及解释型编程（或脚本）语言，而不是像\
  \ C 或 Java 那种低级编译型语言。这并不排除它也可以被编译的事实。此外，它也是一种多范式编程语言，允许你使用来自三种主要范式的数据抽象。对于我们的目的而言，“脚本编写”和“编程”可以被视为同一件事。\n\
  \n### 为什么要使用“纯”OOP 方法？\n\n我们没有完全定义 OOP 最基础的方面和部分（你可以在关于 Python 3 及其他几种计算机编程语言的大量文献中很容易找到这些描述），而是选择将其与更传统的过程化编程方法进行对比，以便让你对\
  \ OOP 采用的方法有更直观的感受。\n\n正如我们所指出的，过程化/命令式的非 OOP 程序可以使用我们在下面章节中展示的 Python 3 语法通过其结构化的控制流操作来运行。非复杂的程序可能由控制流操作的分组组成，被称为过程、模块或子程序。这种使用\
  \ Python 3 语法的方法，由于该语言“适应”了过程化/命令式模型，可以组合成一个强调更传统算法和抽象数据类型 (ADT) 的程序。这两者的简单例子是：计算两个整数最大公约数的算法（或数学计划），或者将整数本身定义为特定的数值，以及对它们执行的预设可能操作集。\n\
  \n这种方法最大的问题之一是，如果变量具有全局作用域（在定义的“容器”之外的全局命名空间中），对它们进行赋值可能会产生冲突并导致错误。这在一定解释了为什么我们在第\
  \ 1 章 中所示的使用命名空间从本质上隔离进程是如此有效。变量（在任何特定过程中活动）是排他性且局部地定义和使用的。\n\n在 Python 3 OOP 中，这基本上是通过使用所谓的“封装”来实现的。这种思想是数据和操作数据的函数是一个实体。这使得两个对象都免受任何环境中非预期更改的影响。OOP\
  \ 的这一基本组成部分——将数据与一组访问和管理数据的方法结合在一起——被称为“对象”。它的数据处理模型与之前描述的过程化/命令式程序模型完全不同。\n\n当然，利用\
  \ Python 3 丰富的语法集，在一个程序中结合非 OOP 和 OOP 样式是可能的。\n\n**注意**\n\nPython 3 并没有像 MIT Scheme\
  \ 等语言那样忠实地实现名为尾递归的功能或逻辑编程结构。但它具备递归能力，正如我们在下面所示。\n\n#### 3.2.1 对象与类\n\n如果你还没有发现这一点，我们书在这里涵盖的主题围绕着少量的“为什么?”以及大量的“如何做？”。明智的做法是先以介绍的方式涵盖\
  \ Python 3 编程所使用的数据模型（以及“为什么?”）的“如何做？”方面，特别是适用于 OOP 时。OOP 是一种编程模型，将概念表示为对象，对象具有字段（基本上描述对象的属性）和关联的过程，或者说你愿意称为函数，被称为方法，这些方法基本上是对这些属性的“消息”操作。对象作为“类”的实例被建立，通过消息系统相互作用，以设计应用程序和计算机程序。现代\
  \ OOP 语言的一些示例包括 Smalltalk、C++、C#、Java、Perl、Ruby、PHP 和 Python 3。\n\n以下是 OOP 中常用的一些术语：\n\
  \n\n\n\n\n- **类 (Class)**: 一种用户定义的对象模型，定义了该类中任何对象的特征。这些特征是数据成员（类变量和实例变量）以及方法，通过所谓的点（`.）表示法进行访问。\n\
  - **类变量 (Class variable)**: 被类的所有实例共享的变量。类变量定义在类内部，但在类的任何方法方法之外。\n- **数据成员 (Data\
  \ member)**: 存储与类及其对象相关数据的类变量或实例变量。\n- **实例变量/变量 (Instance variable)**: 定义在方法内部且仅属于类的当前实例的变量。\n\
  - **继承 (Inheritance)**: 将一个类的特征转移到派自它的其他类的过程。\n- **实例 (Instance)**: 某个类的个体对象。例如，一个属于名为\
  \ `Circle` 类的对象就是 `Circle` 类的一个实例。\n- **实例化 (Instantiation)**: 创建类实例的过程。\n- **方法\
  \ (Method)**: 定义在类定义中的一种特殊函数。\n- **对象 (Object)**: 由其类定义的数据结构的唯一实例。对象可以包含数据成员（类变量和实例变量）和方法。\n\
  \n类定义的一般形式如下：\n\n```\n class ClassName:\n     'Optional class documentation string'\n\
  \     class_suite\n```\n\n该类有一个文档字符串，可以通过 `ClassName.__doc__` 访问。\n\n`class_suite`\
  \ 由所有定义类成员、数据属性和方法的组件语句组成。\n\n以下几行交互式代码非常简单地说明了 OOP 类的继承模型，特别是它们的层次结构。在你的 Raspberry\
  \ Pi 5 OS 操作系统上启动 Thonny，并在 Thonny Shell Area 中执行以下代码。请务必在代码第 2 行末尾按下 `<Enter>`\
  \ 键。（不需要输入注释行号，我们提供这些仅供参考。）\n\n```\n >>> class tab: pass                       \
  \        #Line 1\n...                                                 #Line 2\n\
  >>> tab.name  = 'Bob Koretsky'                      #Line 3\n>>> tab.age  = 85 \
  \                                  #Line 4\n>>> print (tab.name,tab.age)       \
  \                #Line 5\nBob Koretsky 85\n>>> x = tab()                       \
  \                #Line 6\n>>> y = tab()                                       #Line\
  \ 7\n>>> x.name                                         #Line 8\nBob Koretsky\n\
  >>> y.name = 'Alan Turing'                         #Line 9\n>>> tab.name, x.name,\
  \ y.name                       #Line 10\n('Bob Koretsky', 'Bob Koretsky', 'Alan\
  \ Turing')\n>>>\n```\n\n对此代码的逐行分析和描述如下：\n\n- 第 1 行：以关键字 `class` 开始，你命名了一个类为 `tab`。你使用关键字\
  \ `pass` 将类分配给空命名空间，也就是说它目前还没有成员、属性或方法。类是对象的模型！\n- 第 2 行：继续按下 `<Enter>` 继续。\n- 第\
  \ 3 行：你现在为名为 `tab` 的类添加了一个名为 `name` 的属性。此时 `tab` 类还没有实例！\n- 第 4 行：你为该类分配了另一个名为 `age`\
  \ 的属性。\n- 第 5 行：你打印出 `tab` 的属性。\n- 第 6 行：你现在为类 `tab` 分配了一个名为 `x` 的实例，它现在是一个实例。\n\
  - 第 7 行：你现在为类 `tab` 分配了另一个名为 `y` 的实例，它是另一个空实例。\n- 第 8 行：实例 `x` 继承了来自 `tab` 的属性 `name`。你使用点（`.`）运算符将实例\
  \ `x` 与类 `tab` 中的“Bob Koretsky”连接或引用。\n- 第 9 行：你现在显式地为实例 `y` 分配了属性 `name` 的值为“Alan\
  \ Turing”。你使用点（`.`）运算符将实例 `y` 与“Alan Turing”连接。\n- 第 10 行：你打印出 `tab` 中的名称、`x` 中引用的来自\
  \ `tab` 的名称以及 `y` 中显式分配的名称。\n\n下面是一个更复杂的示例，用于创建一个类并使用一些方法来操作对象。使用你喜欢的文本编辑器将以下代码输入到名为\
  \ `firstclass.py` 的文件中，并将其保存到当前的当前工作目录中：关于此示例有三点需要注意：\n\n1. 变量 `StrucCount` 是一个类变量，其值由该类的所有实例共享。在类内部可以通过\
  \ `Structure.StrucCount` 访问该变量，在类外部可以通过 `firstclass.Structure.StrucCount` 访问。\n\
  2. 第一个类方法 `__init__()` 是一个特殊方法，被称为*类构造函数*或*初始化*方法。Python 3 在你创建该类的新实例时会调用此方法。\n\
  3. 你像声明普通的 Python 3 函数一样声明其他类方法，例外是每个方法的第一个参数是 `s`。Python 3 会自动为你将 `s` 参数添加到列表中；当你在调用或执行这些方法时，你不需要包含它。\n\
  \n### 3.2.2 Python 3 数据模型\n\n以下是关于 Python 3 数据模型的一些陈述，可能帮助你组织关于 Python 3 “核心原理”（螺丝）的概念和想法：\n\
  \n1. 尽管 Python 3 结合了多范式编程集的许多功能，但其真实且基础的基础体现在以下语句中：\n2. Python 3 程序中的一切内容都可以被称为*对象*（object），与\
  \ OOP 中使用的 *object* 一词含义完全相同。这些对象包含三个部分：*标识符*（identifier）、*类型*（type）和*值*（value）。\n\
  \   例如，当你在 Python 3 解释器中、或在 Python 3 模块、脚本文件或模块库中交互式地赋值 `x = 62.25` 时，会创建一个实数对象类型；它的值为\
  \ `62.25`，并被识别为一个指向其内存位置指针的对象。`x` 是引用其特定内存位置的标识符。等号 (=) 本质上是标识符和值之间的引用。\n3. 在 OOP\
  \ 语言（如 Python 3 和 Java）中，对象所承担的类型使其成为特定集合的成员，该集合被称为它的*类*（class）。对象的类限制并定义了所谓的*方法*（methods）或操作，这些操作可以在其上或通过它执行。\n\
  4. 当创建一个某个类型的特定对象时，该特定对象被称为该类型的*实例*（instance）。通常情况下，对象的标识和类型是不能改变的。它们被称为*不可变性*（immutable）。如果一个对象的值可以被修改，则认为该对象是*可变的*（mutable）。引用其他对象以获取值和类型的对象被称为*容器*（container）。\n\
  5. 对象还可以定义它们所组成数据的*属性*（attributes）或特征，甚至是用于它们的*方法*（methods）。属性是与对象相关的属性或值。方法是类内部的函数，当方法被使用或调用时，这些对象执行某种操作。\n\
  6. 属性和方法通过点（`.`）运算符访问，如下例所示：\n\n```\n x = 2 + 4j          创建一个复数 x。\n A = a.real\
  \          使用名为 real 的方法提取 a 的实部（一个属性）。\n c = [1, 2, 3]       创建一个类型为列表的实例 c，包含整数\
  \ 1、2 和 -3。\n c.append(7)         使用 append 方法向 c 添加一个新元素。\n```\n\n### 3.2.3 Python\
