  \ (\"Not Ring Fingers\", 7 − (1 + 1))\nNot Ring Fingers 5\n>>>\n```\n\n注意，在计算数学表达式时，Python\
  \ 3 首先计算括号内的内容（即 1+1），然后从左到右从 7 中减去 2。\n\n**本章练习**\n\n3.  让 Python 3 计算以下表达式，并列出\
