  \ 单元的基本信息。\nsystemd.scope - 提供关于 .scope 单元的基本信息。\nsystemd.service - 提供关于 .service\
  \ 单元的基本信息。\n```\n\n此外，您可以在 Raspberry Pi 5 OS 系统可以使用以下命令安装 cgroups 的内核文档：\n\n```\n\
