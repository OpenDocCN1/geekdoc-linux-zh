- "# 树莓派 5 系统管理基础\n\n\n\n![](img/cover.jpg)\n\n![封面：树莓派 5 系统管理基础，基于 systemd 的树莓派 OS\
  \ 系统管理，Robert M. Koretsky 著，CRC Press 出版，Taylor and Francis Group 出，Boca Raton,\
  \ London, New York，CRC Press 是 Taylor and Francis Group 旗下 informa 业务，Chapman and\
  \ Hall 书籍。](img/cover.jpg) 页 ii\n\n\n\n\n\n\n\n\n\n\n\n由 KnowledgeWorks Global Ltd.\
  \ 使用 Palatino 字体制作。\nvii.\n\n# 前言 近通常而言，计算机系统的标志是变化和持续的演进。这对于操作系统及其运行的硬件也是如此。无疑，Linux\
  \ 内核本身自 20 世纪 90 年代诞生以来经历了持续的演进。自从本《树莓派 OS 系统管理基础》最后几卷出版以来，树莓派 OS 所基于的上游 Debian\
  \ OS 以及树莓派 OS 本身都进行了一些调整和修正。无疑，这种情况在未来还会继续。\n\n最显著、也可能是关键的，是树莓派平台本身持续的硬件变化。在主板上增加\
  \ `PCIe 2.0 × 1` 接口连接器允许在硬件上添加辅助 NVMe 适配器或“扩展板（hats）”，这是树莓派 4b/400 与树莓派 5b/500 之间最令人兴奋且至关重要的变化。这提升了树莓派的地位，使其脱出了感知中的爱好者级\
  \ SoC 系统，进入了更广泛、竞争更激烈的笔记本和桌面电脑世界。即使在现实中其实一直存在！\n\n本书是为初学者提供的易用且基本的树莓派 5 OS 系统管理任务集。树莓派\
  \ 5 OS 衍生自 Linux 的 Debian 分支，在编写时，Debian Bookworm 是该操作系统最新且最稳定的版本。为了在这里介绍系统管理主题和命令，我选择了一些基础内容，以及一些更高级的概念、主题、命令和细节，这些内容可能在更完整的系统管理书籍中不会出现。\n\
  \n现代（21  世纪）Linux 系统（如树莓派 5 OS）系统管理的核心思想是使用 `systemd` 来确保 Linux 内核高效、有效地运行，以提供计算机运行的三个基石之一：\n\
  \n## 并发、虚拟化与持久化\n\n这种通过“超级内核”（本质上就是 `systemd`）对内核的控制，还必须提升最高水平的性能和速度，取决于可能被使用的场景。除非新手用户、甚至是资深系统专业人士对\
  \ `systemd` 如何控制、管理和监督现代系统的每个进程有更全面的了解，否则他们永远无法掌握其场景可能需要的功能。\n\n书中所有章节中插图的所有内容，其特定形式（以及命令语法）明确适用于所有\
  \ Debian 系发行版（包括树莓派 5 OS），也适用于所有其他 Debian 版本（包括 Ubuntu 和 Linux Mint）；它还适用于 RedHat\
  \ 系 CentOS 以及 Slackware 发行版（如 SuSE）。在过去几年以及未来，Linux 的主要发展领域一直是 `systemd` 在操作系统使用的各个方面所扮演角色的扩张，且未来也仍将如此。\n\
  \n无疑，在我们可以介绍的众多主题中，你在这里详细看到的内容基本上是以某种主观的方式选出的。这种选择方式主要受以下考量指引：\n\n1.  在并发、虚拟化和持久化方面，对普通用户可以在个人电脑上安装的树莓派\
  \ 5 计算机系统进行安全维护。\n2.  在感知的关键 Linux 系统管理任务排名中，这些主题的重要性如何。\n3.  `systemd` 如何进入该普通用户选择的维护方案。\n\
  4.  所选系统管理主题之间的整体教学整合。\n5.  这些主题在多大程度上有助于学生为进入所选的信息技术或计算机科学职业做好准备，或者已从事这些职业的人士如何利用本书改进其职业实践。换句话之，适用于教育和继续教育读者。\n\
  6.  在某种程度上，使得这些主题能够从单一计算机系统环境扩展到更广泛、更大的计算环境，例如中小型服务器或云端虚拟计算环境。\n\n\n\n\n所有章节的基础前提条件是：(1)\
  \ 了解如何在命令行输入语法正确的 Linux 命令（已在第 0 章中有详细说明），(2) 拥有一台专用的 Raspberry Pi 5 计算机，并安装了最新的\
  \ Raspberry Pi 5 操作系统以便你在其上安装和运行，以及(3) 对于许多操作，需要是系统的特权用户，能够执行 `sudo` 命令以获取超级用户权限。\n\
  \n本书提供了一个在线 Github 网站，其中包含更多材料、更新、程序代码以及章节练习的解答。访问地址为 [www.github.com/bobk48/Raspberry-Pi-5-OS](http://www.github.com/bobk48/Raspberry-Pi-5-OS)\n\
  \n本卷中的所有命令行指令均在配备 4GB 内存的 Raspberry Pi 5 以及编写本书时的最新版本的 Raspberry Pi OS 上进行过测试。\n\
  \n## P2. 本书阅读路径\n\n*   浏览目录。\n*   选择一个你感兴趣的主题。\n*   完成该主题介绍的示例或所有命令行材料。\n*   也许再选另一个你感兴趣的主题，并完成那里的示例和所有命令行材料。\n\
  *   最后，回到每个章节开头。从头到尾完成所有操作。\n*   根据需要重复上述步骤。\n*   尽可能参考第 2 章中的 systemd 材料，将其作为从其他章节中选择材料的百科全书来源。\n\
  *   玩得开心！页 x\n\n**Robert M. Koretsky**\n*俄勒冈州，波特兰*\n\n# 0 Raspberry Pi 5 OS 系统的管理“快速入门”\n\
  \nDOI: [10.1201/9781003652427-1](https://doi.org/10.1201/9781003652427-1)\n\n```\n\
  cat cd cp exit hostname -I ip login lp lpr ls man mesg mkdir more mv passwd PATH\
  \ pwd rm rmdir telnet unalias uname whatis whereis who whoami\n```\n\n## 0.1 目标与引言\n\
  \n*   解释如何管理和维护文件及目录\n*   展示从哪里获取 Raspberry Pi 5 OS 命令的系统级帮助\n*   演示一组初级实用命令的使用\n\
  *   涵盖基础命令和操作符\n\n```\ncat cd cp exit hostname -I ip login lp lpr ls man mesg mkdir\
  \ more mv passwd PATH pwd rm rmdir telnet unalias uname whatis whereis who whoami\n\
  ```\n\n为了在 Raspberry Pi 5 OS 上高效地开始系统管理工作，初学者需要对以下顺序主题有一定的熟悉：\n\n1.  如何在操作系统的文件结构中维护和组织文件。创建树形结构的文件夹（也称为目录）并以逻辑方式将文件存储这些文件夹中，对于在\
  \ Raspberry Pi 5 OS 中高效工作至关重要。\n2.  如何获取关于文本命令及其用法的帮助。在通过键盘输入的、基于命令的字符用户界面(CUI)环境中，能够通过正确地在键盘上输入来快速方便地找到如何使用某个命令、其选项和参数，对于高效工作至关重要。\n\
  3.  如何执行一组基础的实用命令来设置或自定义你的工作环境。一旦初学者熟悉了构建文件维护命令的正确方法，添加一组实用命令会让每次会话更高效。\n\n为了成功将本章作为进入本书其余内容的跳板，你应该按照演示顺序仔细阅读、遵循并执行我们提供的指令和命令行会话。本章中的每个章节以及随后的每一个章节都建立在之前信息的基础上。它们将为你提供概念、命令工具和方法，使你能够使用\
  \ Raspberry Pi 5 OS 进行系统管理。\n\n在本书中，我们将使用所列硬件上以下版本的 Raspberry Pi 5 OS 来说明一切内容：\n\
  \n```\nSystem:\n  Host: raspberrypi Kernel: 6.12.34+rpt-rpi-2712 arch: aarch64 bits:\
  \ 64\n    compiler: N/A Desktop: LXDE v: 0.10.1 Distro: Debian GNU/Linux 12 (bookworm)\n\
  Machine:\n  Type: ARM System: Raspberry Pi 5 Model B Rev 1.0 details: N/A rev: c04170\n\
  \    serial: a5b3f4f94c31353d\n```\n\n在本章以及本书的所有章节中，我们想要说明的主要命令首先通过简要的语法描述进行定义，这将澄清这些命令的通用组成部分。语法描述的格式如下：\n\
  \n*   **语法：** 在命令行上正确输入命令、其选项及其参数的准确语法\n*   **目的：** 命令的具体用途\n*   **输出：** 执行命令后结果的简短描述\n\
  *   **常用选项/功能：** 最流行和实用的选项及选项参数的列表\n\n此外，以下网页链接指向一个允许你输入单个或多个 Raspberry Pi 5 OS\
  \ 命令的站点：[`explainshell.com/`](https://explainshell.com/)\n\n### 注意\n\nRaspberry\
  \ Pi 5 OS 是一个操作系统！\n\n本书的前提和前提是你已经知道 Linux 命令的正确形式和结构，如下：\n\n单个命令的通用语法或结构（通常称为*简单命令*）其输入方式如下：\n\
  \n```\n$ command [-option(s)] [option argument(s)] [command argument(s)]\n```\n\n\
  页 3，其中：\n\n*   `$` 在我们的案例中是命令行或 shell 提示符；\n*   `[]` 包裹的内容并不总是需要的；\n*   `command`\
  \ 是全小写的有效命令名称；\n*   `[-option(s)]` 是一个或多个改变命令行为的修饰符；\n*   `[option argument(s)]`\
  \ 是改变 `[-option(s)]` 行为的一个修饰符；以及\n*   `[command argument(s)]` 是受 `command` 影响的一个对象。\n\
  \n请注意 Linux 命令的以下七个基本特征：\n\n*   空格分隔命令、选项、选项参数和命令参数，但选项之间或多个选项参数之间不需要空格。\n*   多个选项或选项参数的顺序无关紧要。\n\
  *   选项与选项参数之间的空格字符是可选的。\n*   始终按下 `<Enter>` 键以提交命令进行解释和执行。\n*   选项前可以跟一个单连字符 `-`\
  \ 或两个连字符 `--`，具体取决于选项的形式。选项的短形式前有一个单连字符，长形式前有两个连字符。在连字符和选项之间不应放置任何空格字符。\n*   极少数的命令（如\
  \ `whoami`）不接受任何选项、选项参数或命令参数。\n\n命令行上的所有内容都是区分大小写的！\n\n### 章节练习\n\n1.  在你的 Raspberry\
  \ Pi 5 OS 命令行中输入以下命令，并记录结果。哪些在语法上是错误的？页 4 为什么？（每个示例中的 Bash 提示符显示为 $ 字符，我们假设 `file1`\
  \ 和 `file2` 存在。）\n\n```\n$ la -ls\n$ cat\n$ more -q file1\n$ more file2\n$ time\n\
  $ lsblk-a\n```\n\n2.  你如何区分 Raspberry Pi 5 OS 命令与它的选项、选项参数及命令参数？\n\n\n\n\n## 3.\
  \ 在命令行输入按下 `<Enter>` 键之前，单条 Raspberry Pi 5 OS 命令与多条 Raspberry Pi 5 OS 命令之间有什么区别？\n\
  \n# 4. 如果在输入 Raspberry Pi 5 OS 命令后没有收到任何错误信息，你如何知道它实际上完成了你想要实现的操作？\n\n## 0.2 Raspberry\
  \ Pi 5 OS 上的文件维护命令与 OS 命令使用帮助\n\n在在你的硬件上成功安装并首次登录新的 Raspberry Pi 5 OS 系统后，你的首要操作之一将是构建和组织你的工作环境以及其中将包含的文件。根据某种逻辑方案组织文件的操作被称为\
  \ `file maintenance`（文件维护）。用于组织文件的逻辑方案可能包括根据文件的主题或创建日期创建 `bins`（箱/文件夹）来存储文件。在接下来的章节中，你将输入文件创建和维护命令，产生与\
  \ 图 0.1 所示类似的结构。请按照给出的顺序完成后续章节中的操作，以更好地了解文件维护的真实含义。此外，回顾 章节 0.1 中关于 Raspberry Pi\
  \ 5 OS 命令结构的介绍至关重要，这样当你开始输入文件维护命令时，就能理解你输入内容的语法如何符合任何 Raspberry Pi 5 OS 命令的通用语法。\n\
  \n![根目录指向 home，然后是 bob，它分支出三个路径：myfile 2、first 和重命名的 myfile。第一个目录进一步连接到另一个 myfile\
  \ 2。](img/fig0_1.jpg)\n\n图 0.1 目录结构示例。返回文本。⏎\n\n### 0.2.1 文件和目录结构\n\n当你首次打开终端或控制台窗口时，你正在与你登录系统时使用的用户名和密码相关的自主用户的\
  \ `home directory`（主目录）或文件夹中工作。你当前所在的任何目录都被称为 `current working directory`（当前工作目录），在任何给定时间只有一个活跃的当前工作目录。使用图表将你的文件和目录结构视觉化是有帮助的。图\
  \ 0.1 是名为 `bob` 的用户的主目录和文件结构示例。在图中，目录用平行四边形表示，而普通文件（例如包含文本或二进制指令的文件）用矩形表示。`pathname`（路径名）或路径仅仅是在你正在使用的\
  \ Raspberry Pi 5 系统完整文件结构中指定目录或文件位置的文本方式。例如，图 0.1 中文件 `myfile2` 的路径为 `/home/bob/myfile2`。路径的标识从整个文件系统的根\
  \ (`/`) 开始，进入名为 `home` 的文件夹，然后再次进入名为 `bob` 的用户的主目录。\n\n如图 0.1 所示所示，名为 `myfile`、`myfile2`\
  \ 和 `renamed_file` 的文件存储在 `bob` 目录之下。在 `bob` 之下是一个名为 `first` 的 `subdirectory`（子目录）。在接下来的章节中，你将在你登录\
  \ Raspberry Pi 5 OS 系统的用户名主目录中创建这些文件和子目录结构。\n\n**本章练习**\n\n5.  在你的 Raspberry Pi\
  \ 5 OS 系统上输入以下两条命令：\n\n```\n$ cd /\n$ ls\n```\n\n与图 0.1 类似，画出你在第二条命令输出中看到的列出的目录和文件的草图。保存此图以备后后之用。\n\
  \n### 0.2.2 查看文件内容\n\n要开始处理文件，你可以使用 `cat` 命令轻松创建一个新的文本文件。`cat` 命令的语法如下：\n\n```\n\
  cat [options] [file-list]\n用途：顺序合并一个或多个文件或在控制台窗口中显示它们\n输出：屏幕上显示 file-list 中文件的内容，一次显示一个文件\n\
  常用选项/功能：\n+E              在每行末尾显示 $\n-n              在显示的行上标上行号\n-- help       \
  \   显示命令的用途以及每个选项的简要说明\n```\n\n`cat` 命令是 `concatenate`（连接）的缩写，允许你连接文件。在示例中，你将在键盘上输入的内容连接到当前工作目录中创建的新文件中。这是通过重定向字符\
  \ `>` 实现的，它将你在 `standard input`（标准输入，在本例中为键盘）输入的内容重定向到名为 `myfile` 的文件中。你可以将键盘以及它提供的信息流视为一个文件。如上文介绍所述，这种用法是命令\
  \ `cat` 在没有选项、选项参数或命令参数的情况下使用的示例。它仅仅使用了命令、一个重定向字符和一个目标。\n\n（注：原文中关于 `cat` 命令的描述存在大量重复，此处已根据要求保留核心翻译，未进行重复翻译。）\n\
  \n\n\n\n-   [例如，要为名为 `myfile` 的文件创建精确的复制件，并命名为 `myfile2`，请输入以下命令：] \n```\n $ cp\
  \ myfile myfile2\n$\n```\n-   此 `cp` 命令用法需要两个必需的命令参数。第一个参数是已存在的源文件，您希望复制它。第二个参数是目标文件，即将要复制的文件名称。请注意，许多树莓派\
  \ 5 操作系统命令可以接受普通文件、普通文件或目录文件作为参数。这可能会改变命令实现的基本任务。此外，注意的是，不仅文件名可以作为参数，`pathnames`（路径名）也可以。`pathname`\
  \ 是操作系统文件系统结构中任何特定位置的路径。这会改变文件系统路径结构中操作的位置或地点。\n\n-   要更改文件或目录的名称，可以使用 `mv` 命令。`mv`\
  \ 命令的一般语法如下：\n```\n mv [options] file1 file2\nmv [options] file-list directory\n\
  ```\n-   目的：第一种语法：将 `file1` 重命名为 `file2`\n-   第二种语法：将 `file-list` 中的所有文件移动到 `directory`\n\
  -   输出：重命名或移动后的文件\n-   常用选项/特性：\n-   `-f`: 强制移动，忽略目标文件的访问权限\n-   `-ii`: 在覆盖目标文件前提示用户\n\
  \n-   在下面的用法中，`mv` 命令的第一个参数是源文件名，第二个参数是目标文件名。\n```\n $ mv myfile2 renamed_file\n\
  $\n```\n\n### 注意\n第 9 页 在编程和文本处理中，有两种常见的单引号 (`'`) 和双引号 (`\"`) 类型：\n-   单引号：`'`（ASCII\
  \ 代码：`0x27`）\n-   双引号：`\"`（ASCII 代码：`0x22`）\n-   这些是普通且常用于 Linux 命令、`Python`、`JavaScript`\
  \ 和 shell 脚本。\n\n-   曲式引号（也称为 Smart 引号或排版引号）：\n-   左单引号：`‘`（Unicode：`U+2018`），右单引号：`’`（Unicode：`U+2019`）\n\
  -   左双引号：`“`（Unicode：`U+201C`），右双引号：`”`（Unicode：`U+201D`）\n-   这些用于排版、文字处理程序以及书籍和文章的正式排版。它们很少出现在\
  \ Linux 命令中！\n\n-   此时注意树莓派 5 操作系统命令中空格的使用很重要。如果你从 Windows 系统获取一个文件名中包含一个或多个空格的文件，如何在树莓派\
  \ 5 操作系统中处理该文件？答案很简单。每当你需要在命令中使用该文件名作为参数时，用直式双引号 (`\"`) 将文件名括起来。例如，你可能从 Windows\
  \ 系统某人的电子邮件中分离出的文件，如 `latest revisions october.txt`。\n\n-   要在树莓派 5 操作系统中使用该文件，即将文件名作为参数在树莓派\
  \ 5 操作系统命令中使用，请用直式双引号将整个文件名括起来。将该文件重命名为更短的名称的正确命令如下：\n```\n $ mv \"latest revisions\
  \ october.txt\" laterevs.txt\n$\n```\n\n-   要删除文件，可以使用 `rm` 命令。`rm` 命令的一般语法如下：\n\
  ```\n rm [options] file-list\n```\n-   目的：从 `file-list` 中删除文件（从磁盘中删除）\n-   输出：已删除的文件\n\
  -   常用选项/特性：\n-   `-f`: 无论 `file-list` 的访问权限如何，强制删除\n-   `-i`: 在删除 `file-list` 中的文件前提示用户\n\
  -   `-r`: 递归删除 `file-list` 中的文件（如果是目录），请谨慎使用！\n\n-   要从当前工作目录删除文件 `renamed_file`，输入：\n\
  ```\n $ rm renamed_file\n$\n```\n\n第 10 页 章节练习\n7. 使用 `rm` 命令删除文件 `testfile` 和 `myfile3`。\n\
  \n-   最重要的文件维护命令是 `ls` 命令。`ls` 命令的一般语法如下：\n```\n ls [options] [pathname-list]\n\
  ```\n-   目的：将 `pathname-list` 指定的目录中文件和目录的名称发送到显示屏\n-   输出：`pathname-list` 指定的目录中的文件和目录名称，或仅文件名（如果\
  \ `pathname-list` 仅包含文件名）\n-   常用选项/特性：\n-   `-F`: 在目录名称后显示斜杠 (`/`)，在二进制可执行文件后显示星号\
  \ (`*`)，在符号链接后显示 “at” 字符 (`@`)\n-   `-a`: 显示所有文件，包括隐藏文件\n-   `-i`: 显示 inode 编号\n\
  -   `-l`: 显示长列表，包含权限、所有者、组、大小和修改时间\n\n-   `ls` 命令会列出文件或文件夹的名称。此外，如果在命令中包含 `pathname-list`\
  \ 参数，你可以列出这些名称。要查看当前目录中的名称，输入：\n```\n $ ls\n```\n-   请注意，`ls` 还会列出您主目录中的文件。要查看当前目录中的名称，输入：\n\
  ```\n $ ls\n```\n\n\n\n正如你在屏幕显示中所示（它显示了我们主目录下的文件列表，这很可能与你主目录下的文件列表不同！），当前工作目录下每个文件的信息分八列显示。第一列显示文件类型，其中\
  \ `d` 表示目录，`l` 表示符号链接，`–` 表示普通或常规文件。在第一列中，还显示了用户、组和其他对该文件的访问模式，分别为 `r`、`w` 或 `x`。第二列显示指向该文件的链接数。第三列显示该文件所有者的用户名。第四列显示该文件的所属组名。第五列显示文件在磁盘上占用的字节数。第六列显示文件最后修改的日期。第七列显示文件最后修改的时间。第八列（也是最后一列）显示文件名。这种执行命令的方法是列出关于文件更完整信息的良好方法。使用更完整信息的示例包括：(1)\
  \ 让你知道字节大小并能够将文件放在某些便携存储介质上，或 (2) 显示访问模式，以便更改特定文件或目录的访问模式。\n\n### 章末练习\n\n8. 使用\
  \ `ls -la` 命令列出你在 Raspberry Pi 5 OS 系统上主目录下的所有文件名。你获得的列表与上面显示的列表相比如何？请记住，我们的列表是在\
  \ Raspberry Pi 5 OS 系统上完成的。\n\n你也可以通过 `ls` 命令的另一个变体来获取当前工作目录下单个文件的文件列表，如下：\n\n```\n\
  \ $ ls -la myfile\n-rw-r--r--  1 bob  bob  797 Jan 16 10:00 myfile\n$\n```\n\n此变体向你显示了名为\
  \ `myfile` 的特定文件的带有附带信息的详细列表。你在命令行中输入的内容拆解如下：1) `ls`，命令名；2) `-la`，选项；以及 3) `myfile`，命令参数。\n\
  \n如果你在输入时犯了错误，拼写错了命令名或命令的其他其他部分，该怎么办？在命令行中输入以下内容：\n\n```\n $ lx -la myfile\nlx:\
  \ not found\n$\n```\n\nRaspberry Pi 5 OS 返回的 `lx: not found` 是一条错误消息。Raspberry Pi\
  \ 5 OS 中没有 `lx` 命令，因此显示了错误消息。如果你输入了一个不存在的选项，你也会收到错误消息。如果你提供了一个不在当前工作目录下的文件名，你也会收到错误消息。这涉及到关于执行\
  \ Raspberry Pi 5 OS 命令的一个重要的一点：如果没有显示错误消息，则命令执行正确，结果可能显示也可能不出现在屏幕上，取决于命令实际上执行了什么。如果你看到显示错误消息，你必须在\
  \ Raspberry Pi 5 OS 执行你输入的命令之前纠正错误。\n\n**注意**\n\n初学者在输入类型命令时，拼写错误占了他们所犯错误最大的比例！\n\
  \n### 0.2.4 创建、删除和管理目录\n\n文件维护的另一个关键方面是你使用的一系列程序和相关的 Raspberry Pi 5 OS 命令，用于在计算机上你的\
  \ Raspberry Pi 5 OS 账户中创建、删除和组织目录。在文件系统中移动时，你总是在向上或向下移动以到达想要使用的目录。当前工作目录正上方的目录被称为当前工作目录的*父目录*。当前工作目录正下方的目录或多个目录被称为当前工作目录的*子目录*。初学者最常见的错误是误放了文件。他们找不到\
  \ `ls` 命令列出的文件名，因为他们将文件放置或创建在了文件结构中当前工作目录上方或下方的目录中。当你创建一个文件时，如果你已经在自己的主目录下创建了一组逻辑组织良好的目录，你将知道将文件存放在何处。在接下来的一系列命令中，我们在主目录下创建一个目录，并使用该新目录来存储文件。\n\
  \n要在当前工作目录下方创建一个新目录，你使用 `mkdir` 命令。`mkdir` 命令的一般语法如下：\n\n```\n mkdir [options] dirnames\n\
  目的: 创建 dirnames 中指定的目录或多个目录\n输出: 新目录或多个目录\n常用选项/功能:\n-m MODE      以指定的访问模式创建目录\n\
  -p           在 dirnames 指定的路径中创建不存在的父目录\n```\n\n要在当前工作目录下方创建一个名为 `first` 的子目录，请输入以下内容：\n\
  \n```\n $ mkdir first\n$\n```\n\n此命令现在当前工作目录下（或作为当前工作目录的子目录）创建了一个名为 `first` 的新子目录。请参考图\
  \ 0.1 获取此新子目录位置的图形描述。\n\n为了更改当前工作目录以进入新的子目录，你使用 `cd` 命令。`cd` 命令的一般语法如下：\n\n```\n\
  \ cd [directory]\n目的: 将当前目录更改为目录，在省略目录时返回主目录\n输出: 新当前目录\n```\n\n要通过向下进入名为 `first`\
  \ 的指定路径将当前工作目录更改为 `first`，请输入：\n\n```\n $ cd first\n$\n```\n\n你始终可以使用 `pwd` 命令来验证当前工作目录。`pwd`\
  \ 命令的一般语法如下：\n\n```\n pwd\n目的: 在屏幕上显示当前目录\n输出: 当前目录的路径\n```\n\n你可以通过输入以下内容验证 `first`\
  \ 现在是当前工作目录：\n\n```\n $ pwd\n/home/bob/first\n$\n```\n\n命令行的输出显示了当前工作目录的路径。正如之前所述，此路径是运行\
  \ Raspberry Pi 5 OS 的计算机完整文件结构的文本路由，结束于当前工作目录。在这个输出示例中，路径从 `/`（文件系统的根）开始。然后进入 `home`\
  \ 目录（文件系统的一个分支）。然后进入 `bob` 目录（另一个分支，它是用户的主目录名）。最后，进入名为 `first` 的分支，即当前工作目录。\n\n\
  在某些系统中，取决于默认设置，另一种确定当前工作目录的方法只需查看命令行提示符即可。该提示符可能以当前工作目录的完整路径开头，结束于当前工作目录。\n\n你可以通过输入以下内容向上回到主目录（即子目录\
  \ `first` 的父目录）：\n\n```\n $ cd\n$\n```\n\n执行此操作的另一种方法是输入以下内容，其中波浪字符（∼）解析为或替代主目录完整路径的：\n\
  \n```\n $ cd ∼\n$\n```\n\n通过输入以下内容验证你现在已向上移动到主目录：\n\n```\n $ pwd\n/home/bob\n$\n\
  ```\n\n你还可以通过输入以下内容向上移动主目录上方的目录（有时称为当前工作目录的父目录）：\n\n```\n $ cd ..\n$\n```\n\n\n\n\
  \n在此命令中，两个点（`..`）代表父目录，或者当前工作目录之上的分支。不要忘记在 `d` 和第一个点之间输入空格字符。要验证你是否已进入主目录的父目录，请输入以下内容：\n\
  \n```\n $ pwd\n/home\n$\n```\n\n要回到你的主目录，请输入以下内容：\n\n```\n $ cd\n$\n```\n\n要验证主目录下是否有两个以字母\
  \ `my` 开头的文件，请输入以下命令：\n\n```\n $ ls my*\nmyfile myfile2\n$\n```\n\n命令行中 `y` 之后的星号被称为被称为*元字符*（*metacharacter*），即表示某种模式的字符；在这种情况下，该模式是任何字符集。当你按下键盘上的\
  \ `<Enter>` 键后，树莓派 5 OS 会解释该命令，它会在当前工作目录中搜索所有以字母 `my` 开头并以其他字符结尾的文件。\n\n### 章末练习\n\
  \n9.  使用 `cd` 命令进入到树莓派 5 文件系统的根目录（`/`），然后使用它递归地从根目录进入每个子目录，深度为 2 个子目录，并绘制你系统上找到的组件文件图。使图中的命名条目尽可能完整，列出你认为必要的尽可能文件。保留此图，作为你特定的树莓派\
  \ 5 OS 发行版文件系统的有用地图。\n\n组织目录的另一个方面是在目录之间移动文件，或者更改目录中文件的位置。例如，你现在主目录下有一个文件 `myfile2`，但你想将它移动到名为\
  \ `first` 的子目录中。请参见图 0.1 的图形描述，了解如何在此时更改文件的组织结构。要实现这一点，你可以可以使用为 `mv file-list directory`\
  \ 命令所示的第二种语法方法，将文件 `myfile2` 移动到名为 `first` 的子目录。要实现这一点，请输入：\n\n```\n $ mv myfile2\
  \ first\n$\n```\n\n要验证 `myfile2` 确实在名为 `first` 的子目录中，请输入：\n\n```\n $ cd first\n\
  $ ls\nmyfile2\n$\n```\n\n你现在将回到主目录，并尝试使用 `rm` 命令移除或删除文件。\n\n**注意：** 使用此命令时你应该非常小心，因为文件一旦被删除，恢复它的唯一方法是从你或系统管理员为文件系统制作的存档备份。\n\
  \n```\n $ cd\n$ rm myfile2\nrm: myfile2: No such file or directory\n$\n```\n\n你收到错误信息是因为在主目录下不存在名为\
  \ `myfile2` 的文件。它已被移动到名为 `first` 的子目录中。\n\n目录组织还包括删除空目录或非空目录的能力。用于删除空目录的命令是 `rmdir`。`rmdir`\
  \ 命令的一般语法如下：\n\n```\n rmdir [options] dirnames\n用途：删除 dirnames 中指定的空目录\n输出：删除目录\n\
  常用选项/功能：\n-p      同时也删除空父目录\n-r      递归删除当前目录下的所有文件和子目录\n```\n\n要删除当前工作目录下的整个目录，请输入以下：\n\
  \n```\n $ rmdir first\nrmdir: first: Directory not empty\n$\n```\n\n由于文件 `myfile2`\
  \ 仍在名为 `first` 的子目录中，`first` 不是一个空目录，因此你收到了 `rmdir` 命令不会删除目录的错误信息。如果目录是空的，`rmdir`\
  \ 将会完成删除。删除非空目录的一种方法是使用带有 `-r` 选项的 `rm` 命令。`-r` 选项会递归进入子目录，并在实际删除目录之前删除其中的任何文件。使用此命令时也要小心，因为你可能会无意中删除你并不想删除的目录和文件。要查看此命令如何删除非空目录，请输入：\n\
  \n```\n $ rm -r first\n$\n```\n\n目录 `first` 和文件 `myfile2` 现在已从文件结构中移除。\n\n### 0.2.5\
  \ 使用 man 命令获取帮助\n\n在树莓派 5 OS 系统上一个非常实用的工具是在线帮助功能，它是通过使用 `man` 命令实现的。`man` 命令的一般语法如下：\n\
  \n```\n man [options][-s section] command-list\nman -k keyword-list\n用途：第一种语法：一次显示一个\
  \ command-list 中命令的\n树莓派 5 OS 参考手册页\n         第二种语法：显示与 keyword-list 中关键字相关的命令摘要\n\
  输出：一次显示一个手册页\n常用选项/功能：\n-k keyword-list      显示与 keyword-list 中关键字相关的命令摘要\n-s section-list\
  \      一次显示一个 command-list 中命令的\n树莓派 5 OS 参考手册页\n```\n\n要使用 `man` 命令获取关于 `ls` 命令用法和选项的帮助，例如输入：\n\
  \n```\n $ man ls\nls(1) NAME\n     列出目录内容\nSYNOPSIS\n     ls [OPTION]... [FILE]\n\
  DESCRIPTION\n     列出目录内容\nOPTIONS\n     -a, --all             不忽略以 . 开头的条目\n   \
  \  -A, --almost-all       不忽略 ..\n     -C, --color           启用颜色\n     -c, --ctime\
  \           显示状态时间\n     -G, --group           分组\n     -h, --human-readable  以人类可读格式显示大小\n\
  \     -i, --inode           打印 inode 号\n     -f, --long             使用详细格式\n   \
  \  -m, --mac-format       以逗号分隔列出\n     -n, --number          打印目录索引\n     -p  \
  \                  为每个条目添加指示符\n     -R, --recursive       递归列出\n     -S, --sort=WORD\
  \       按文件名排序\n     -u, --sort=time       按访问时间排序\n     -S, --sort=size       按大小排序\n\
  \     -u, --sort=time       按修改时间排序\n     -v, --version         输出版本并退出\nAUTHOR\n\
  \     GNU coreutils\nCOPYING\n     see <https://www.gnu.org/licenses/GPL.txt>\n\
  REPORTING\n     see postinfo ls\nSEE ALSO\n     see man ls\nBUGS\n```\n\n这段来自树莓派\
  \ 5 OS 的输出是一个*手册页*，它提供了用法摘要、选项以及如何使用该命令的简要描述。在显示一页后输入 `q`（如示例所示）将返回命令提示符。按下键盘上的\
  \ `<Space>` 键将让你看到 `ls` 命令更多的内容，一次显示一个。手册页根据描述的主题组织成八个章节，取决于特定系统的应用。表 0.1 列出了这些章节及其包含的内容。大多数用户在第\
  \ 1 节找到需要的。软件开发主要使用库调用和系统调用，因此在第 2 和第 3 节找到需要的。编写文档的用户最需要参考第 7 节。\n\n表 0.1 树莓派 5\
  \ OS 手册章节\n\n| **章节** | **描述** |\n| --- | --- |\n| 1 | 用户命令（可执行程序或 shell 命令） |\n\
  | 2 | 系统调用（内核提供的函数） |\n| 3 | 库调用（程序库中的函数） |\n| 4 | 特殊文件（通常位于 /dev 中） |\n| 5 | 文件格式和约定（例如\
  \ /etc/passwd） |\n| 6 | 游戏和屏幕保护 |\n| 7 | 杂项（例如宏包、约定和标准） |\n| 8 | 系统管理命令（通常仅限 root）\
  \ |\n| 9 | 内核例程（非标准，通常用于内核开发） |\n\n\n\n\n手册页包含了 Raspberry Pi 5 OS 中每个命令、系统调用和库调用的多页、特殊格式的描述性文档。这种格式由七个通用部分组成：名称、提览、描述、文件列表、相关信息、错误、警告和已知缺陷。你可以使用\
  \ `man` 命令来查看命令的手册页。由于该命令的名称，手册页通常被称为 Raspberry Pi 5 OS man pages。当你在屏幕上显示手册页时，页面的左上角会有命令名称及其所属的章节（在括号内），例如输出手册页顶端看到的\
  \ `LS(1)`。\n\n第 19 页。用于显示 `passwd` 命令手册页的命令是：\n\n```bash\n $ man passwd\n```\n\n\
  `passwd` 命令的手册页现在出现在屏幕上，但我们不显示其输出。由于它们是多页文本文档，每个主题的手册页需要多个屏幕的文本才能显示全部内容。要一次查看一页手册页，请按键盘上的`<Space>`\
  \ 键。要退出查看手册页，请按键盘上的 `Q` 键。\n\n现在输入此命令：\n\n```bash\n $ man pwd\n```\n\n如果手册页的多个章节包含同一个单词的信息，而你对特定章节的手册页感兴趣，可以使用\
  \ `-S` 选项。因此，以下命令行显示的是 `read` 系统调用的手册页，而不是 shell 命令 `read` 的手册页。\n\n```bash\n $\
  \ man -S2 read\n```\n\n命令 `man -S3 fopen fread strcmp` 会按顺序显示三个 C 库调用的手册页：`fopen`、`fread`\
  \ 和 `strcmp`。\n\n要退出这些系统调用的显示，请输入 `<Ctrl+C>`。\n\n使用 `man` 命令并输入带有 `-k` 选项的命令时，可以指定一个关键词来限制搜索。这等同于使用\
  \ `apropos` 命令。搜索结果将产生系统上所有包含该关键词引用的有用手册页头。例如，以下命令在我们 Raspberry Pi 5 系统上产生了如下屏幕输出：\n\
  \n```bash\n $ man -k passwd\nchgpasswd (8)      - 批量模式更新组密码\nchpasswd (8)      \
  \  - 批量模式更新密码\nexim4_passwd (5)    - Debian exim4 软件包使用的文件\nexim4_passwd_client\
  \ (5) - Debian exim4 软件包使用的文件\nfgetpwent_r (3)      - 可重入地获取 passwd 文件条目\ngetpwent_r\
  \ (3)      - 可重入地获取 passwd 文件条目\ngpasswd (1)         - 管理 /etc/group 和 /etc/shadow\n\
  openssl-passwd (1ssl) - 计算密码哈值\npam_localuser (8)   - 要求用户列在 /etc/passwd 中\npasswd\
  \ (1)          - 修改用户密码\npasswd (1ssl)       - 计算密码哈值\npasswd (5)          - 密码文件\n\
  passwd2des (3)      - RFS 密码加密\nupdate-passwd (8)   - 安全更新 /etc/passwd, /etc/shadow\
  \ 和 /etc/group\nvncpasswd (1)       - VNC Server 密码工具\n输出已截断…\n```\n\n### 0.2.6\
  \ 获取帮助的其他方法\n\n要获取任何特定 Raspberry Pi 5 OS 命令功能的简要描述，你可以使用 `whatis` 命令。这类似于 `man -f`\
  \ 命令。`whatis` 命令的通用语法如下：\n\n```bash\n whatis keywords\n目的：在 whatis 数据库中搜索每个关键词的简要描述\n\
  输出：在屏幕上打印每个关键词的单行描述\n```\n\n以下是使用 `whatis` 的示例：\n\n两个命令的输出已截断。\n\n```bash\n$ whatis\
  \ man\nman (7)              - 用于格式化手册页的宏\nman (1)              - 在线参考手册的接口\n$\n\
  ```\n\n你也可以在同一行命令行中为 `whatis` 输入多个参数（参数之间用空格分隔），来获取多个命令的简要描述。以下是这种方法的示例：\n\n```bash\n\
  \ $ whatis login set setenv\nlogin (1)            - 开始话\nset (3)             - 设置环境变量\n\
  setenv (3)          - 设置环境变量\n$\n```\n\n以下章节练习要求你使用 `whatis` 查找有关命令的信息。\n\n10. 使用带有\
  \ `-k` 选项的 `man` 命令显示系统帮助。\n11. 使用 `whatis` 命令记录 `man` 和 `apropos` 之间的区别。\n\n##\
  \ 0.3 第 21 页工具命令\n\n有一些主要的命令可以让初学者在使用 Raspberry Pi 5 OS 时更高效。后续章节将给出这些命令的示例。\n\n\
  ### 0.3.1 检查系统设置\n\n`whereis` 命令允许你沿着指定的路径搜索以定位实用程序和命令。`whereis` 命令的通用语法如下：\n\n\
  ```bash\nwhereis [options] filename\n目的：定位命令的二进制文件、源代码和手册页文件\n输出：首先删除所提供的名称中的前导路径组件和扩展，然后显示路径\n\
  常用的选项/功能：\n-b 仅搜索二进制文件\n-s 仅搜索源代码\n```\n\n例如，如果你在命令行上输入命令 `whereis bash`，你将看到 Bash\
  \ shell 程序文件路径列表，如下所示：\n\n```bash\n $ whereis bash\n\nbash: /bin/bash /etc/bash.bashrc\
  \ /usr/share/man/man1/bash.gz\n```\n\n注意，无法通过 `whereis` 命令找到“内置”（或内部）命令的路径。\n\n\
  当你首次登录时，能够查看关于你的 `userid`、你登录的计算机或系统以及该计算机上的操作系统的信息显示是非常用的。这些任务可以通过 `whoami` 命令完成，该命令会在屏幕上显示你的\
  \ `userid`。`whoami` 命令的通用语法如下：\n\n```bash\nwhoami\n目的：显示有效用户 ID\n输出：在标准输出上作为名称显示你的有效用户\
  \ ID\n```\n\n以下显示了当我们在命令行上输入此命令时，系统的响应。\n\n```bash\n $ whoami\nbob\n$\n```\n\n第\
  \ 22 页。以下章节练习让你你有机会使用 `whereis`、`whoami` 以及另外两个重要的工具命令 `who` 和 `hostname` 来获取有关系统的重要信息。\n\
  \n要获取你正在使用的 Raspberry Pi 的 IP 地址，你可以使用 `ip` 命令。`ip` 命令的通用语法如下：\n\n```bash\nip [\
  \ OPTIONS ] OBJECT { COMMAND | help }\n目的：显示/处理路由、网络设备、接口和隧道。\n输出：关于你的局域网的信息。\n\
  ```\n\n要获取你正在使用的计算机的 IP 地址，请在终端或控制窗口中输入以下命令：\n\n\n\n\n\n```\n $ ip addr show\n1:\
  \ lo: <LOOPBACK,UP,LOWER_UP> mtu 65536 qdisc noqueue state UNKNOWN group\ndefault\
  \ qlen 1000\n     link/loopback 00:00:00:00:00:00 brd 00:00:00:00:00:00\n     inet\
  \ 127.0.0.1/8 scope host lo\n        valid_lft forever preferred_lft forever\n \
  \    inet6 ::1/128 scope host\n        valid_lft forever preferred_lft forever\n\
  2: eth0: <BROADCAST,MULTICAST,UP,LOWER_UP> mtu 1500 qdisc mq state UP group\ndefault\
  \ qlen 1000\n     link/ether dc:a6:32:ee:c6:6b brd ff:ff:ff:ff:ff:ff\n     inet\
  \ 192.168.1.2/24 brd 192.168.1.255 scope global dynamic noprefixroute eth0\n   \
  \     valid_lft 65558sec preferred_lft 54758sec\n     inet6 fe80::78d9:c72e:75e2:82c/64\
  \ scope link\n        valid_lft forever preferred_lft forever\n3: wlan0: <BROADCAST,MULTICAST>\
  \ mtu 1500 qdisc noop state DOWN group default\nqlen 1000\n     link/ether dc:a6:32:ee:c6:6c\
  \ brd ff:ff:ff:ff:ff:ff\n$\n```\n\n在上述输出中，IP 地址 `192.168.1.2` 是该计算机在局域网（LAN）上的地址。\n\
  \n## 章节内练习题\n\n12. 使用 `whereis` 命令定位 Korn shell、Bourne shell、Bourne Again shell、C\
  \ shell 和 Z shell 的二进制文件。这些 shell 程序中是否有任何在你的系统中是不可用的？\n\n13. 使用 `whoami` 命令查找你正在使用的系统上的用户名。然后使用\
  \ `who` 命令查看你的用户名是如何列出的，以及同系统的其他用户情况。你通过 `who` 命令获得的每个用户列表的屏幕显示格式是怎样的？尝试识别与你用户名在同一行中的每个字段的信息。\n\
  \n14. 使用 `hostname -I` 命令查找你所登录的主机计算机在局域网上的 IP 地址。将其与该同一系统上 `ip addr` 命令的输出进行比较。\n\
  \n## 0.4 打印命令\n\n每个计算机系统用户都会执行的一个非常有用且常见的任务是在打印机上打印文本文件。这是通过本地或远程系统上配置的打印机实现的。打印机通过通用\
  \ UNIX 打印系统（CUPS）进行控制和管理。我们在第 1 章中详细介绍了此实用。\n\n在 Raspberry Pi 5 OS 系统上执行打印的常用命令是\
  \ `lpr` 和 `lp`。`lpr` 命令的标准语法如下：\n\n```\n lpr [options] filename\n用途：将文件发送到打印机\n\
  输出：作为打印作业发送到打印队列的文件\n常用选项/功能：\n-P printer             将输出发送到指定的打印机\n-# copies  \
  \           为每个指定的文件产生指定数量的副本\n```\n\n下面的 `lpr` 命令在系统中指定为 `spr` 的打印机上打印名为 `order.pdf`\
  \ 的文件。记住，选项（此处为 `-P`）和选项参数（此处为 `spr`）之间不需要空格。\n\n```\n $ lpr -Pspr order.pdf\n$\n\
  ```\n\n下面的 `lpr` 命令在默认打印机上打印名为 `memo1` 的文件。\n\n```\n $ lpr memo1\n$\n```\n\n下面的多命令组合结合了\
  \ `man` 命令和 `lpr` 命令，并通过 Raspberry Pi 5 OS 的管道重定向字符 `|` 将它们结合，通过名为 `hp1200` 的打印机打印描述\
  \ `ls` 命令的手页。\n\n```\n $ man ls | lpr -Php1200\n$\n```\n\n以下显示了如何使用 `lp` 命令执行打印任务。\n\
  \n`lp` 命令的标准语法如下：\n\n```\n lp [options][option arguments] file(s)\n用途：向指定的系统打印机提交文件进行打印，或修改挂起的任务\n\
  输出：作为打印作业发送到打印队列的文件\n常用选项/功能：\n-d destination       打印到指定的打印机\n-n copies       \
  \    为每个文件产生指定数量的副本\n```\n\n下面的 `lp` 命令在名为 `printer1` 的打印机上打印名为 `report.txt` 的文件。\n\
  \n```\n $ lp -dprinter1 report.txt\n$\n```\n\n## 0.5 章节总结\n\n在本介绍章节中，我们涵盖了允许高效工作的\
