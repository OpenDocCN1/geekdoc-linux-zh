  \ 模块在低级 `thread` 模块之上构建了更高级的线程接口。如果你希望你的应用程序能够利用树莓派 5 中多核博通 CPU 的计算能力，你应该使用多进程的\
  \ `threading` 模块。然而，如果你想运行多个 I/O 密集型任务，`threading` 仍然是一个合适的模型。\n\n### 3.4.4.3 面向对象的\
  \ GUI 与生产者-消费者模型线程\n\n线程是 Tk GUI 工具包中不可或缺的一部分，我们在第 3.4.3 节中说明了这一点。这同样通适用于大多数 GUI\
  \ 库，例如 Qt。由于 GUI 的许多功能使用同步 I/O，任何可能阻塞或需要很长时间才能完成的操作都必须派生并并行运行，以确保中央 GUI 模块（主线程）始终处于运行状态。虽然派生的子任务可以作为多个进程运行，但线程的效率和共享环境模型使其成为担任这一角色的理想选择，因为它们运行在单个进程的命名空间内。绝大多数\
  \ GUI 工具包不允许多个线程并行更新主线程——更新通常被限制在主线程中。\n\n关于 GUI 中的 Python 3 线程，有两个重要的点：主线程负责处理所有的屏幕图形更新，以及\
  \ GUI 线程必须遵守根据标准模型为通用线程并发而建立的同步规则。\n\nGUI 中的所有线程通常遵循所谓的*生产者-消费者模型*。简单来说，就是由一个或多个对象（生产者）负责将数据放入某个存储池中，而一个或多个对象（消费者）负责从该池中取出数据。\n\
  \n生产者-消费者模型的缺点如下：\n\n*   生产者添加的数据不能超过存储池所容纳的容量。\n*   消费者不能从空池中取数据。\n*   所有对象的行为*必须*进行同步处理。\n\
  \n我们将在第 3.4.5 节中进一步讨论生产者-消费者模型的更多问题，并在该节中提供一个 Python 3 示例程序，使用所谓的*条件变量*来演示该模型实现的解决方案。\n\
