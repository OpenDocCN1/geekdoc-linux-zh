  \ `sorted()` | 返回可迭代对象的排序列表。 |\n| `staticmethod` | 类中定义静态方法。 |\n| `str()` | 将对象转换为字符串。\
  \ |\n| `sum()` | 返回可迭代对象的和。 |\n| `super()` | 调用父类方法。 |\n| `sys.argv` | 以列表形式返回命令行。\
  \ |\n| `sys.exit()` | 退出程序。 |\n| `threading.Thread()` | 创建新线程。 |\n| `time.sleep()`\
  \ | 暂停执行一段时间。 |\n| `try-except` | 处理异常。 |\n| `try-finally` | 无论是否异常都执行清理代码。 |\n\
  | `tuple()` | 创建一个元组。 |\n| `type()` | 返回对象的类型。 |\n| `while` | 定义一个条件为真时运行的循环。 |\n\
  | `with open()` | 使用上下文打开文件。 |\n| `write()` | 向文件写入内容。 |\n| `yield` | 暂停并恢复生成器函数。\
  \ |\n| `zip()` | 将多个可迭代对象组合为元组。 |\n\n第 259\n\n### 3.2.4 Python 3 标准类型层次\n\n对象的*类型*\
  \ 描述了 Python 对该对象的数据结构表示，以及可以对该对象执行的方法和操作。表 3.2 是类型类别的列表，其后是对表格中某些类别的简要描述。\n\n|\
  \ 类别 | 名称 | 描述 |\n| --- | --- | --- |\n| None | None | 空值对象 |\n| Numbers | int |\
  \ 普通整数 |\n| | Long | 高精度整数 |\n| | Float | 浮点数 |\n| | Complex | 复数 |\n| | Bool |\
  \ 布尔值（真或假） |\n\n\n\n\n\n| 类别 | 类型 | 描述 |\n| :--- | :--- | :--- |\n| 序列（不可变） | `str`\
  \ | 字符字符串 |\n| | `Unicode` | Unicode 字符串 |\n| | `tuple` | 元组 |\n| 序列（可变） | `list`\
  \ | 列表 |\n| | `bytearray` | 由 `bytearray()` 返回 |\n| 映射 | `dict` | 字典 |\n| 集合 | `set`\
  \ | 可变集合 |\n| | `Frozenset` | 不变集合 |\n| 可调用 | `BuiltinFunctionType` | 内置函数 |\n|\
  \ | `BuiltinMethodType` | 内置方法 |\n| | `type` | 内置类型和类的类型 |\n| | `object` | 所有类型和类的祖父\
  \ |\n| | `FunctionType` | 用户定义函数 |\n| | `InstanceType` | 类对象实例 |\n| | `MethodType`\
  \ | 绑定类方法 |\n| | `UnboundMethodType` | 未绑定类方法 |\n| 模块 | `ModuleType` | 模块 |\n| 类\
  \ | `object` | 所有类型和类的祖父 |\n| 类型 | `type` | 内置类型和类的类型 |\n| 文件 | `file` | 文件 |\n\
  | 内部 | `CodeType` | 字节编译代码 |\n| | `FrameType` | 执行帧 |\n| | `GeneratorType` | 生成器对象\
  \ |\n| | `TracebackType` | 异常的栈回溯 |\n| | `Slice` | 由扩展切片生成 |\n| | `Ellipsis` | 用于扩展切片\
  \ |\n| 经典 | `Classes ClassType` | 遗留类定义 |\n| | `InstanceType` | 遗留类实例 |\n\n`None`\
  \ 类型只有一个值，包含一个空对象（一个没有值的对象）。它的真值为 False。\n\n- **数值类型**：布尔值型、整数、长整数、浮点数和复数。\n- **序列类型**：`Sequences`\
  \ 代表由非负整数索引的有序对象集合，包括字符串、Unicode 字符串、列表和元组。\n- **映射类型**：`mapping object` 代表任意对象集合，该集合由另一个几乎任意的键值集合索引。与序列不同，映射对象是无序的，并且可以通过数字、字符串和其他对象进行索引。`Dictionaries`\
  \ 是唯一的内置映射类型，类似于 `hash`（哈希）。\n- **集合类型**：`set` 是一个唯一元素的无序集合。与序列不同，集合不提供索引或切片操作。它们与字典的不同之处在于没有与对象关联的键值对。此外，放入集合的项必须是不可变的。\n\
  - **可调用类型**：这些代表支持函数调用操作的对象。具有这种属性的对象有多种，包括用户定义函数、内置函数、实例方法和类。\n- **类和类型**：当你定义一个类时，类定义通常产生一个\
  \ `type` 类型的对象。\n- **模块**：`module` 类型是一个容器，保存了通过 `import` 语句加载的对象。\n- **文件**：`file`\
  \ 对象表示一个打开的文件，由内置 `open()` 函数返回。\n- **内部类型**：解释器使用的对象暴露给用户，例如 `traceback objects`、`code\
  \ objects`、`frame objects`、`generator objects`、`slice objects` 和 `ellipsis object`。\n\
  \n- **代码对象**：这些代表原始的字节编译可执行代码或 `bytecode`，通常由内置 `compile()` 函数返回。\n- **帧对象**：这些用于表示执行帧，最常出现在回溯对象中。\n\
  - **回溯对象**：在发生异常时创建，包含 `stack trace information`。\n- **生成器对象**：在调用 `generator` 函数时创建。每当一个函数使用特殊的\
  \ `yield` 关键字时，就会定义一个生成器函数。\n- **切片对象**：用于表示扩展切片语法给出的切片，例如：\n```\na[i:j:stride],\
  \ a[i:j, n:m], or a[..., i:j]\n```\n- **省略号对象**：省略号对象用于表示切片中存在省略号（`...`）。该类型只有一个对象，通过内置名称\
  \ `Ellipsis` 访问。它没有属性且求值结果为 True。\n- **经典类**：在 Python 2.2 之前的版本中，类和对象是使用完全不同的机制实现的，现在这种机制已被废弃。然而，为了向后兼容，这些类（被称为\
  \ `classic classes` 或 `old-style classes`）仍然被支持。\n\n### 3.2.5 我们所做的基本假设\n\n在本章中，我们提出的四个基本且重要的假设是：\n\
