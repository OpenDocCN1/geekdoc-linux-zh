  。执行 \"help('string')\" 的效果与在 help> 提示符下输入特定字符串相同。\n>>>\n```\n\n## 3.3 Python 3 语法\n\
  \nPython 3 拥有丰富且实用的语法库，你可以利用它成功完成你设计的编程任务。在本节中，我们将对这些语法进行概述，并提供若干示例。\n\n### 3.3.1\
  \ 打印文本、注释、数字、分组运算符和表达式\n\n为了在本文稍后所示的实际示例中使用 Python 3，绝对有必要首先熟悉该语言的语法。例如，它如何作为一个计算器，在“解释性模式”下执行单行\
  \ Python 代码来完成简短且有意义的操作和任务。\n\n第 272 页 关于计算器工作原理，你必须了解的事之一就是如何在计算器上输入数字和数学表达式。因此，通过\
