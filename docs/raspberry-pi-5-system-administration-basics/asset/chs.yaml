  \ 是一种结构化编程语言，在块中使用特定的结构，因此这些块由你在每行上提供的提供的缩进来界定或定义（与使用特定打印字符来界定块的其他语言不同）。这意味着你必须从左侧垂直对齐你的\
  \ Python 3 结构块，并且为了我们的目的，每个缩进块使用四个空格。例如，下面的示例显示了这种四空格缩进的限制：\n\n   ```\n     Block\
