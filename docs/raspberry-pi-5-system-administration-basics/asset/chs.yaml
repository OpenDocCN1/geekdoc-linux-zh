  \ Python 3 解释器处理。通常情况下，当你运行 Python 3 脚本时，它会被编译成字节码。如果你想在不使用 Thonny 的情况下从已创建的脚本显式生成字节码，可以在命令行中使用\
  \ `py_compile` 模块，或者在 Bash 行中使用 `-m py_compile` 命令。如在示例 3.3 末尾所示和解释的，你如何知道 Thonny\
