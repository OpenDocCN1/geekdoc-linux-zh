  \ | finally | is | return | |\n| def | for | lambda | try | |\n\n要获取当前版本的关键字列表，请在\
  \ Python 3 提示符处输入以下内容。在我们使用的 Python 3.11.2 版本中，我们得到了所示的输出：\n\n```python\n>>> import\
