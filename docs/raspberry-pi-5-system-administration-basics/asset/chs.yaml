  >>>\n```\n\n`print` 命令的 target `keyword.kwlist` 是 Python 3 方法应用的一个示例。在接下来的简单示例中，我们定义了一些变量并使用了它们：\n\
  \n```python\n>>> pie = 3.14159\n>>> radius = 10\n>>> pie * (radius * radius)\n314.159\n\
  >>> circumference = 2 * pie * radius\n>>> circumference\n62.8318\n>>>\n```\n\n###\
  \ 3.3.3 函数\n\nPython 3 提供了一种名为 `function` 的编程结构，它允许你定义自己的命名过程，并允许你在代码中以模块化的方式重用这些过程。你可以将函数想象成一个黑盒机器，它将函数调用或执行之前存在的命名对象作为输入，在黑盒内部使用仅在黑盒内部可见的名称对其进行处理，然后通过赋值语句将它们作为命名对象输出，并供\
  \ Python 3 程序使用。\n\n函数定义的通用形式为：\n\n```python\ndef name (formal parameters):\n  \
  \  函数体\n    return (returned parameters)\n```\n\n其中 `name` 是你给函数起的名称（确保你没有使用 Python\
  \ 3 关键字！），`formal parameters` 是传递给函数的命名对象，以便它可以对它们执行某些操作，并且可选的，`returned parameters`\
  \ 是你的程序使用的命名对象。\n\n你有两种基本方法可以执行函数：\n\n1. 使用方法 1（交互模式），通过输入或复制粘贴每作为函数定义的每一行代码到 Thonny\
  \ 的脚本区域（Script Area）中。\n2. 使用方法 3（导入脚本模式），在一个扩展名为 `.py` 的文件中创建函数定义。然后在 Shell 区域中使用\
  \ `import` 命令将该文件导入 Thonny。\n\n在 Python 3 中使用函数定义的第一种方法的简单示例所示。在 Thonny 的脚本区域中输入以下六行\
  \ Python 3 代码，然后点击运行工具栏图标。记住让 Thonny 对所示的行进行缩进！\n\n```python\nw = 7\nx = 12\ndef\
  \ add(a, b):\n    c = a + b\n    return c\nz = add(w, x)\n```\n\n然后在 Shell 中输入以下内容：\n\
  \n```python\n>>> z\n19\n```\n\n### 3.3.4 条件执行\n\n如第 3.2 节所述，计算机程序的执行顺序包含一个“分支”或条件执行结构。Python\
  \ 3 使用某些条件的真值来决定代码块是否会被执行。这在 Python 3 中通过 `if` 语句实现。`if` 语句的通用形式为：\n\n```python\n\
  if cond1:\n    初始语句\nelif cond2:\n    附加语句\nelse:\n    最终语句\n```\n\n其中：\n\n*   `cond1`\
  \ 是一个测试条件，其真值决定了初始语句是否执行，\n*   `cond2` 是一个测试条件，其真值决定了附加语句是否执行，以及\n*   `else` 是默认选项，执行最终语句。\n\
  \n在 Thonny 脚本区域中使用方法 2（脚本模式）使用该结构的简单示例所示。记住在向脚本区域输入每行代码后按键盘上的 `Enter` 键。注意 Thonny\
  \ 会根据其结构化编程规则，自动对脚本区域中的行进行正确的缩进（即所需的空格）。\n\n```python\nx = 3\nif x > 5:\n    print(\"\
  x is large\")\nelif x > 1:\n    print(\"x is medium\")\nelse:\n    print(\"x is\
  \ small\")\n```\n\n然后在 Shell 中输入以下内容：\n\n```python\n>>>\nx is medium\n```\n\n\n\n\
  \n\n### 3.3.5 确定性与不确定循环结构及递归\n\n使用过程/命令式模型，`Python 3` 可以通过两种基本方式重复程序段或脚本文件结构：通过`确定性循环结构`或`不确定循环结构`。传统上，确定性循环结构被称为`计数循环`，而不确定性循环结构被称为`逻辑循环`。这两种方法分别通过\
  \ `for` 过程语句和 `while` 过程语句来实现。通常，如果你提前知道（例如，在编写代码时）想要执行某块代码的重复次数，你就使用 `for` 语句；如果你不知道（例如，在运行脚本文件时允许用户输入重复次数），则使用\
  \ `while` 语句。\n\n当然，也可以通过不使用特定的结构化编程方法来实现这两种重复方式；例如，通过使用第 281 页的条件执行和无结构化切换来获得相同的结果。这并不是一种可以接受的良好实践，我们选择在\
  \ `Python 3` 中展示结构化方法。\n\n确保在 `while` 正在执行的不确定循环块的语句体中，继续执行的测试条件会变为 `False`。否则，这将导致`无限循环`！要停止正在执行的脚本文件的无限循环，请同时按住键盘上的\
  \ `<Ctrl>` 和 `C` 键。\n\n**注意**\n\n此时需要对 `Python 3` 风格进行说明。\n\n#### Pythonic\n\n根据\
  \ Guido van Rossum 在《Python 语言参考》对 `Pythonic` 的定义，`Python 3` 中的一种常用技术是使用 `for` 语句遍历\
  \ `iterable` 对象的所有元素。许多其他语言没有这种构造，因此不熟悉 `Python 3` 的人员有时会使用数字计数器来代替，例如：\n\n```python\n\
  \ >>>for i in range(len(money)):\n...    print money[i]\n```\n\nPythonic 的方式是：\n\
  \n```python\n >>>for bills in money:\n...    print (bills)\n```\n\nPythonic 方式可以被描述为`迭代`，而传统的语言构造可以被描述为`计数`。\n\
  \n`for` 结构可以对任何 `iterable` 序列数据（如字符串、列表、元组或类中用户定义的可迭代对象）重复某块操作。\n\n`for` 语句结构的通用\
  \ Pythonic 形式如下：\n\n```\n 重复若干次\n    重复这些语句\n```\n\n`while` 结构只要测试条件为真，就可以重复某块操作。\n\
  \n`while` 语句结构的通用 Pythonic 形式是：\n\n```\n 当某个条件为真\n    重复这些语句\n```\n\n如果对象 `K` 能够按照方式\
  \ 2（脚本模式）中的以下代码成功运行，则认为它是可迭代的。这段代码还说明计数形式的迭代（如传统的 `for` 循环结构）可以通过第 282 页的 `while`\
  \ 结构来实现。不需要在 Thonny 脚本区域输入注释。要运行代码，请点击工具栏上的运行图标-：\n\n```python\n K = [22,33,44,55]\
  \                   #列表是可迭代的。\nc = K.__iter__()                      #c 是计数器\nwhile\
  \ 1:                            #在为真时执行\n    try:\n        item = next(c)      \
  \          #获取下一个\n        print (item)                  #在计数时对每个项目执行操作\n    except\
  \ StopIteration:           #没有剩余了\n        break\n\n>>> %Run -c $EDITOR_CONTENT\n\
  22\n33\n44\n55\n>>>\n```\n\n以下是两种形式循环的简单示例。我们使用方式 2（脚本模式）来运行它们：\n\n在 Thonny 脚本区域中输入以下三行代码。在第一个示例中，我们向一个命名文件输入了一段文本。在\
