  ```\n在你的 Raspberry Pi 5 OS 上创建新用户时符合该模型。\n\n\n\n\n\n负责用户和组账户管理的人员经常需要修改密码，出于明显的安全考虑，这是必要的。使用\
  \ `passwd` 命令实现这一点最为简单。在本节中，我们将提供该命令用法的一些基本示例。关于 `passwd` 命令更完整的描述，请参阅 Raspberry\
  \ Pi 5 系统上该命令的帮助页（man page）。\n\n要重置用户账户密码，请使用以下命令：\n\n```bash\n $ sudo passwd mansoor\n\
  [sudo] password for bob: QQQ\nEnter new UNIX password: ZZZ\nRetype new UNIX password:\
  \ ZZZ\npasswd: password updated successfully\n$\n```\n\n要获取 `passwd` 命令可用选项的摘要列表，请使用以下命令：\n\
  \n```bash\n $ sudo passwd -h mansoor\nUsage: passwd [options] [LOGIN]\nOptions:\n\
  \  -a, --all        报告所有账户的密码状态\n  -d, --delete             删除指定账户的密码\n  -e, --expire\
  \             强制指定账户的密码过期\n  -h, --help               显示此帮助信息并退出\n  -k, --keep-tokens\
  \       仅在密码过期时更改密码\n  -i, --inactive INACTIVE  密码过期后将密码状态设置为非活跃\n  -l, --lock \
  \              锁定指定账户的密码\n  -n, --mindays MIN_DAYS   设置密码更改前的最小天数为 MIN_DAYS\n  -q,\
  \ --quiet              静默模式\n  -r, --repository REPOSITORY  在 REPOSITORY 仓库中更改密码\n\
  \  -R, --root CHROOT_DIR    要切换到 chroot 的目录\n  -S, --status             报告指定账户的密码状态\n\
  \  -u, --unlock             解锁指定账户的密码\n  -w, --warndays WARN_DAYS  设置过期警告天数为 WARN_DAYS\n\
  \  -x, --maxdays MAX_DAYS   设置密码更改前的最大天数为 MAX_DAYS\n$\n```\n\n第 76 页。要查看特定用户密码的状态，请使用以下命令：\n\
  \n```bash\n $ sudo passwd -S mansoor\nmansoor P 11/15/2016 0 99999 7 -1\n$\n```\n\
  \n上述命令的输出在 `passwd` 帮助页中的描述如下：\n\n1.  用户名（Username）—— 用户的登录名。\n2.  加密密码（Encrypted\
  \ Password）—— 哈希后的密码（或特殊值如 `!`、`*` 或 `!!` 表示无密码或账户已锁定）。\n3.  最后密码更改日期（Last Password\
  \ Change）—— 自 1970 年 1 月 1 日以来最后更改密码的天数。\n4.  最小天数（Minimum Days）—— 更改密码前所需的最小天数。\n\
  5.  最大天数（Maximum Days）—— 必须更改密码的最大天数。\n6.  警告天数（Warning Days）—— 密码过期前警告用户的天数。\n\
  7.  非活跃天数（Inactive Days）—— 密码过期后账户禁用的天数。\n\n## 1.7 确定和更改文件访问权限\n\n一旦用户或组账户被添加到系统，系统管理员下一个关注的问题是如何维护文件访问安全，即该用户或组账户访问和利用系统服务以及所有文件的权限。\n\
  \n传统的 UNIX 和 Linux 权限定义了对文件对象（如普通文件或目录）的安全访问，即 `read(r)`、`write(w)` 和 `execute(x)`\
  \ 权限。此外，还有其他设置权限的高级技术，如 `setuid`、`setgid` 和粘滞位（sticky bit）。除了这些，POSIX ACL 模型对文件和目录的安全提供了更精细粒度的控制。每个文件对象都可以被看作带有一个\
  \ ACL，该 ACL 控制对该对象的自由裁量访问。对于目录，此 ACL 称为默认 ACL。Raspberry Pi 5 操作系统默认使用所谓的 POSIX ACL。我们将在第\
  \ 15 节中讨论性系统安全，并随后介绍具体细节。\n\n### 1.7.1 如何显示访问权限\n\n`ls` 命令配合 `-l` 或 `-la` 以及 `-ld`\
  \ 选项可以显示单个文件或文件/目录列表的访问权限。从我们 Raspberry Pi 5 系统的帮助页中摘取的带有这三个选项的 `ls` 命令摘要描述如下：\n\
  \n```\nls [options][file-list][directory-list]\n\n语法\nls -l, ls -la [file-list]\n\
  ls -ld [directory-list]\n\n用途   第一种语法：在屏幕上显示由空格分隔的 file-list 中文件/或目录的详细列表；如果 file-list\
  \ 包含目录，则显示这些目录中所有文件的详细列表。\n第二种语法：在屏幕上显示 directory-list 的详细列表。\n\n常用选项\n-a, --all\
  \      显示详细列表。\n-d, --directory  列出目录本身，而不是其内容。\n-l               使用详细格式。\n```\n\
  \n如果没有未给出 `file-list`，`ls` 命令将列出当前工作目录下所有文件（隐藏文件，有时被称为“点”文件）的详细列表。如果你在命令行中包含 `-l`\
  \ 和 `-a` 选项，隐藏文件的显示方式如下：\n\n```bash\n $ ls -la\ntotal 532\ndrwx------      16  bob\
  \  bob    4096  Mar  2  13:49.\ndrwxr-xr-x      3  root root    4096  Mar  1  14:52.\
  \ .\n-rw-------       1  bob  bob    530  Mar  2  13:09. bash_history\n-rw-r--r--\
  \      1  bob  bob    220  Nov  19  05:32. bash_logout\n-rw-r--r--      1  bob \
  \ bob    3523  Nov  19  05:32.bashrc\ndrwxr-xr-x      1  bob  bob    4096  Nov \
  \ 19  05:36. Bookshelf\ndrwx------      16  bob  bob    4096  Mar  2  13:49. cache\n\
  drwxr-xr-x      3  root root    4096  Mar  1  14:52. config\nOutput truncated...\n\
  $\n```\n\n\n\n\n\n在当前工作目录下（即执行 `ls -l` 命令的目录），该命令会显示该目录下所有文件和目录的详细列表，但不显示隐藏文件。你可以使用\
  \ `ls -ld` 命令仅显示目录的详细列表。当在不带参数的情况下执行该命令时，它将显示当前工作目录的详细列表，如下方的第一个命令所示。第二和第三条命令显示，当\
  \ `ls -ld` 命令以目录列表作为参数执行时，它将仅显示这些目录的详细列表。如果 `ls -ld` 命令的参数是一个文件，则该命令将显示该文件的详细列表，如下方的第四条命令后的显示所示。下第五条命令\
  \ `ls -ld Bookshelf/*` 会显示 Bookshelf 目录下所有文件和目录的详细列表。\n\n```\n $ ls -ld\ndrwxr-xr-x\
  \      25      bob bob           4096          May      18       05:40     .\n$\
  \ ls -ld remzi\ndrwxr-xr-x      2      bob bob           4096        Nov      5\
  \      2022      remziPage 79\n$ ls -ld ~//Downloads remzi\ndrwxr-xr-x      2  \
  \    bob bob           4096        May      14      10:23     /home/bob/Downloads\n\
  drwxr-xr-x      2      bob bob           4096        Nov      5      2022      remzi\n\
  $ ls -ld test.py\n-rw-r--r--       1      bob bob           106          Jun   \
  \   5      07:00     test.py\n$ ls -ld Bookshelf/*\n-rw-r--r--         1      bob\
  \ bob   35954684          Apr      4      2022      Bookshelf/BeginnersGuide\n$\n\
  ```\n\n### 1.7.2 更改文件访问权限\n\n如果你拥有权限和系统权限，`chmod` 命令可以更改文件和目录的访问权限。以下描述取自我们 Raspberry\
  \ Pi 5 OS 上关于 `chmod` 命令的手页页：\n\n```\n *************************************************************************\n\
  chmod [options][file(s)][directory]\n\nSyntax\n               chmod [OPTION]...\
  \ MODE[,MODE]... FILE...\n               chmod [OPTION]... OCTAL-MODE FILE...\n\
  \               chmod [OPTION]... --reference=RFILE FILE...\n\nPurpose         \
  \   更改/设置文件列表中的文件的权限\n\nCommon Options\n-R           递归进入目录，更改/设置每个目录下所有文件和子目录的权限\n\
  -f           强制指定的访问权限；如果你是文件的所有者，则不会产生错误信息\n************************************************************************\n\
  ```\n\n符号模式（Symbolic mode）也称为“模式控制”，形式为 `[who][operator][privilege]`，其中 `who`、`operator`\
  \ 和 `privilege` 有可能的取值如表 1.4 所示。该表展示了 `chmod` 命令中使用 `+` 和 `-` 运算符分别用于添加和移除指定的权限。\n\
  \n#### 表 1.4 符号模式的值\n\n| Who (对象) | Operator (运算符) | Privilege (权限) |\n| --- | ---\
  \ | --- |\n| u | + | 添加权限（读取位） |\n| g | – | 移除权限（写入位） |\n| o | = | 设置权限（执行/搜索位）\
  \ |\n| a | | 用户当前的权限 |\n| ugo | | 组的当前权限 |\n| | | 其他人的当前权限 |\n| | | 设置组 ID 位 |\n\
  | | | 设置用户 ID 或 组 ID 位 |\n| | | 粘滞位 (Sticky bit) |\n\n注意 `u`、`g` 或 `o` 只能配合 `=`\
  \ 作为权限使用。`who` 和 `privilege` 可以使用多个值，例如 `who` 字段使用 `ug`，`privilege` 字段使用 `rx`。`chmod`\
  \ 命令的一些实用示例及其用途列在表 1.5 中。\n\n#### 表 1.5 chmod 命令示例及其含义\n\n| 命令 | 含义 |\n| --- | ---\
  \ |\n| chmod 700 | 将当前目录下所有文件（包括目录）的访问权限设置为：所有者可读取、写入和执行，且不对任何其他人提供访问 |\n| chmod\
  \ 740 Bookshelf | 将 Bookshelf 的访问权限设置为：所有者可读取、写入和执行，组只读，其他人不提供访问 |\n| chmod 751\
  \ ~/Bookshelf | 将 ~/Bookshelf 的访问权限设置为：所有者可读取、写入和执行，组可读取和执行，其他人仅可执行 |\n| chmod 700\
  \ ~ | 将主目录的访问权限设置为：所有者可读取、写入和执行（即搜索），其他均无任何权限 |\n| chmod u=rwx Bookshelf | 将 Bookshelf\
  \ 的所有者访问权限设置为读取、写入和执行，并保持组和其他人的权限为当前值 |\n| chmod ugo-rw test or chmod a-rw test\
  \ | 不允许任何人读取或写入 test |\n| chmod a+x test | 赋予所有人 test 的执行权限 |\n| chmod g=u test\
  \ | 使 test 的组权限与其用户（所有者）权限匹配 |\n| chmod go= test | 移除组和其他人对 test 的所有权限 |\n\n此外，权限位可以根据表\
  \ 1.6 设置为八进制数。\n\n#### 表 1.6 文件权限及其八进制等值及含义\n\n| r | w | x | 八进制数字 | 含义 |\n| ---\
  \ | --- | --- | --- | --- |\n| 0 | 0 | 0 | 0 | 无权限 |\n| 0 | 0 | 1 | 1 | 仅执行权限 |\n\
  | 0 | 1 | 0 | 2 | 仅写入权限 |\n| 0 | 1 | 1 | 3 | 写入和执行权限 |\n| 1 | 0 | 0 | 4 | 只读权限 |\n\
  | 1 | 0 | 1 | 5 | 读取和执行权限 |\n| 1 | 1 | 0 | 6 | 读取和写入权限 |\n| 1 | 1 | 1 | 7 | 读取、写入和执行权限\
  \ |\n\n此处提供了对以下命令（位于表 1.3、表 1.4、表 1.5、表 1.6 中，以及下方命令行输入的）的文本解释，以说明如何查询和设置文件的访问权限。`chmod`\
  \ 命令用于修改或初始设置访问权限。`ls -l`（或 `ls -ld` 和 `ls -la`）命令用于显示所应用 `chmod` 命令的结果。在执行 `chmod\
  \ 700 Bookshelf` 命令后，Bookshelf 文件的所有者拥有读取、写入和执行的访问权限，而其他人没有任何权限。`chmod g+rx Bookshelf`\
  \ 命令为组为 Bookshelf 文件添加读取和执行访问权限。所有者和其他人的权限保持不变。`chmod o+r Bookshelf` 命令为其他人为 Bookshelf\
  \ 文件添加读取访问权限。`chmod a-w` 命令取消当前工作目录下所有文件所有用户的写入权限。`chmod go+x, o+r` 命令为当前工作目录下所有文件开启组和其他人的执行权限以及他人的读取权限。`chmod\
  \ 700 [l-t]` 命令将以字母“l”到“t”开头的文件访问权限设置为 700，如最后一个 `ls -l` 命令的输出所示，输出显示 labs 和 temp\
  \ 文件的访问权限已更改为 700。\n\n\n\n\n\n```\n $ ls -l\ndrwxr-x---                      2��������������09:37      BookshelfhelfBookshelf\n\
  -wxrwxrwxrwx                    11::13:22labs\n-rwxr--r--                                   :1::13:13temp\n\
  $ chmod 700 Bookshelf\n$ ls -ld Bookshelf\ndrwx------                              22���������������09:37     BookshelfBookshelfBookshelfBookshelfBookshelfBookshelfBookshelfBookshelf\n\
  $ chmod g+rx Bookshelf\n$ ls -ld Bookshelf\ndrwxr-x---                       22������������������������09:37     BookshelfBookshelfBookshelfBookshelfBookshelfBookshelfBookshelfBookshelfBookshelfBookshelf\n\
  $ chmod o+r Bookshelf\n$ ls -ld Bookshelf\ndrwxr-xr--                              2222:0:09:37   helfBookshelfBookshelfBookshelfBookshelfBookshelfBookshelfBookshelfhelfBookshelfBookshelfBookshelfBookshelf\n\
  $ chmod a-w *\n$ ls -l\ndr-xr-x---                                2222���������������:09:37    BookshelfBookshelfBookshelfBookshelfBookshelfBookshelfBookshelfBookshelfBookshelfBookshelfBookshelfBookshelfBookshelfBookshelfBookshelfBookshelf\n\
  -r-xr-xr-x                     :1:1::13:22labs\n-r-xr—-r--                 :11::1::13:13temp\n\
  $ chmod go+x, o+r *\n$ ls -l\ndr-xr-xr--                      22222222222222222:09:37  helfhelfhelfBookshelfBookshelfBookshelfBookshelfBookshelfBookshelfBookshelfBookshelfBookshelfBookshelfBookshelfBookshelfBookshelfBookshelfBookshelfBookshelfBookshelfBookshelfhelfhelfhelf\n\
  -xr-xr-x                11:1::13:22labs\n-xr-xr--       1111::1::13:13temp\n$ chmod\
  \ 700 *\n$ ls -l\ndr-xr-x---                 22222222222222222222222222222222222:09:37  helfBookshelfBookshelfBookshelfBookshelfBookshelfBookshelfBookshelfBookshelfBookshelfBookshelfBookshelfBookshelfBookshelfBookshelfBookshelfBookshelfBookshelfBookshelfBookshelfhelfhelfhelfhelfhelfhelfhelfhelfhelfhelfhelfhelfhelfhelfhelfhelfhelfhelfhelfhelfhelfhelfhelfhelf\n\
  -rwx------               111:1:1::13:2labs\n-rwx------         1111:::1::13:13temp\n\
  $ chmod +x *\n$ ls -l\ndr-xr-x--x                     22222:::::09:37  \n\
  -rwx--x--x             1111:1::::::13:22labs\n-rwx--x--x        1111111111111111111\n\
  -rwx--x--x       1111111111111111111111111111111111111111111111111111111111::::23:13temp\n\
  ```\n\n嵌套在一个或多个上层目录下的文件和目录访问权限可以使用 `chmod` 命令配合 `-R` 选项进行设置。在以下命令中，第一个命令递归地将 `Bookshelf`\
  \ 目录下所有的文件和目录设置为 `711`。第二个命令递归地将 `temp/motions` 下的所有文件和目录设置为 `700`。“递归”意味着进入指定目录的所有子目录，即上述两行中的\
  \ `Bookshelf` 和 `temp/motions`。\n\n```\n $ chmod -R 711 Bookshelf\n$ chmod -R 700\
  \ temp/motions\n```\n\n如果你在 `chmod` 命令中使用单个八进制设置访问权限，该命令将用于设置“其他”（others）的访问权限；“所有”（user）和“组”（group）的访问权限将都被设置为\
  \ `0`（即无权限）。如果你在 `chmod` 命令中指定两个八进制数字，命令将使用它们设置“组”和“其他”的访问权限。“所有”的访问权限将设置为 `0`。在以下两个命令中，第一个\
  \ `chmod` 命令将 `Bookshelf` 目录的“其他”访问权限设置为 `7` (`rwx`)，“所有和组设置为 `0` (`---`)。第二个 `chmod`\
  \ 命令将 `temp` 目录的“组”和“其他”访问权限分别设置为 `7` (`rwx`) 和 `0` (`---`)，“所有”没有权限。`ls -l` 命令显示了这些命令的结果。\n\
  \n```\n $ chmod 7 Bookshelf\n$ chmod 7 temp\n$ ls -l Bookshelf temp\nd------rwx                                           :10:09:43   helfBookshelfBookshelfBookshelfBookshelfBookshelfBookshelfBookshelfBookshelfBookshelfBookshelfBookshelfBookshelfBookshelfBookshelfBookshelfhelfhelf\n\
  d---rwx---                   :10:43    temp\n$\n```\n\n### 1.7.3 第 83 页 目录的访问权限\n\
  \n目录的读取权限允许你读取目录的内容（目录的内容是其下的普通文件和目录的名字），写权限允许你在目录中创建文件，或从中删除现有文件或子目录，而目录的执行权限允许你搜索目录的内容。\n\
  \n**注意**\n\n在没有搜索（执行）权限的情况下，目录的读写权限是没有意义的。你必须同时拥有目录的读取和执行权限，才能列出其下的文件名。你必须同时拥有目录的写入和执行权限，才能在目录中创建文件。\n\
  \n在以下命令中，`Bookshelf` 目录的写权限已被关闭。因此，你不能通过 `mkdir` 命令在此目录下创建子目录 `ee345`，也无法将文件 `foo`\
  \ 复制进去。同样，虽然你拥有 `personal` 目录的搜索权限，但你无法使用 `cd` 命令进入（切换）该目录。如果 `test` 目录有一个开启了执行权限的子目录\
  \ `foobar`，你仍然无法进入 `foobar`，因为 `test` 的搜索权限已关闭。最后，由于 `personal` 目录的读取权限，尽管开启了搜索权限，你也无法通过\
  \ `ls` 命令显示其中的文件和目录。\n\n```\n $ chmod 600 sample\n$ chmod 500 Bookshelf\n$ chmod\
  \ 300 personal\n$ ls -ld Bookshelf personal sample\ndr-x------                       \
  \ 4 06:36          Bookshelf\nd-wx------                   :�06:36              personal\n\
  drw-------                    2 09:43            temp\n```\n\n\n\n\n\n在这个更高层次的抽象上，文件系统可以访问、使用、组织和表示任何形式的数据，无论它是持久的还是易失的。我们在这里使用\
  \ `volatile` 一词是指在某些进程或服务的瞬态寿命期间。当然，`systemd` 和 `Linux kernel` 控制着运行在树莓派 5 操作系统上的所有进程和服务。`Pseudo`\
  \ 和特殊用途文件系统（有时称为 `synthetic file systems`）可以被视为虚拟文件系统，具有这种特性。\n\n目前还有建立的协议，用于连接和访问位于其可能位置的物理、虚拟或伪文件系统。建立并维护与虚拟、网络可用介质及文件系统连接的访问协议示例有两个：网络文件系统第\
  \ 4 版 (`NFSv4`) 和互联网小型计算机系统接口 (`iSCSI`)。\n\n在本节中，我们首先介绍一种你可以用来思考介质和文件系统类型的组织方案。文件系统可以根据其所在的介质被名义地分配：直接连接的物理介质（如\
  \ `NMVe SSD`）、虚拟介质（如使用 `NFSv4` 或 `iSCSI` 的 `Network-Attached Storage` 或 `Storage\
  \ Area Networks`），或者完全不在持久介质上的专用伪文件系统（如我们在下文中讨论的 `cgroups` 或 `proc` 文件系统）。\n\n然后，我们将给出一些将直接连接的物理介质添加到树莓派\
  \ 5 操作系统硬件的特定示例。\n\n此外，当我们使用第 1.3.1 节中提供的推荐存储模型时，建议一种向系统添加持久介质的传统方法。方法如下：\n\n你首先通过连接到\
  \ `USB3` 端口将设备正确连接到树莓派 5，对该介质进行分区，手动向其添加文件系统（通常是 `ext4` 文件系统），最后在介质的分区中创建目录和文件。下方的章节将详细介绍这种更传统的方法。\n\
  \n根据我们的组织方案，文件系统可以分为三个层次化排列的层，每个层执行非常特定的功能。这些层从物理物理介质由远到近排列如下：\n\n### 逻辑层\n\n该层用于通过\
  \ `Linux` 系统调用与用户应用程序及其包含的进程进行交互。它为文件操作提供了应用程序编程接口 (`API`)，例如 `OPEN`、`CLOSE`、`READ`\
  \ 等系统调用，并与其下层连接以处理。逻辑层实现了高效的文件访问、逻辑组织的目录操作，并提供了用户自主性和安全性。在图 1.3 中，该层由图顶部的 `ISCSI`\
  \ 和 `Process Inputs` 块表示。\n\n![存储输入过程从 i S C S I 或进程输入通过 L I O、虚拟文件系统和块层到达 S C S\
  \ I 中层、驱动程序和物理设备。](img/fig1_3.jpg)\n\n<details id=\"kfig1_3\"><summary>图 1.3 详细描述</summary>\
  \ \n\n存储输入过程始于 i S C S I 输入或进程输入。i S C S I 输入进入 L I O，它连接到虚拟文件系统并链接到用户空间。从虚拟文件系统，流程进入块层，块层也接收来自\
  \ L I O 的输入。块层继续进入 S C S I 中层，然后到达 S C S I 驱动程序，最后到达物理设备层，该层包括硬盘驱动器、固态硬盘和数字多光盘。</details>\
  \ \n\n图 1.3 树莓派 5 操作系统文件系统存储层。返回正文。\n\n### 虚拟层\n\n该层提供了接口机制，用于在同一计算机上维护多个同时存在的物理和虚拟文件系统实现。例如，它允许在同一系统中同时挂载并透明地使用\
  \ `NFSv4`、`btrfs`、`ext3`、`ext4`、`fat32` 或 `ZFS`，并操作所有这些实现的文件，就像它们都是同一种类型一样。\n\n\
  图 1.3 所示的 `Linux IO` (`LIO`) 块被称为 `iSCSI` “目标”，代表虚拟层到各种网络连接的持久介质。这些连接上使用高速光纤技术创建存储区域网络\
  \ (`SAN`)，但最重要的是，也可以通过以太网和 `TCP/IP` 实现。\n\n虚拟层文件系统的更详细架构方案将该层进一步分为基于块、网络、可堆、伪和特殊用途类别。在图\
  \ 1.3 中，许多文件系统的不同实现，如 `NFSv4`、`ext4`、`xfs`、`btrfs`、`initramfs` 和 `procfs` 将位于图中所示的虚拟文件系统块中。两个非常现代且极其重要的虚拟文件系统是\
  \ `systemd` 使用的 `cgroups` 文件系统 (`cgroupsfs`) 以及用户态、基于块的文件系统 `ZFS`。\n\n### 物理层\n\n\
  该层涉及持久性存储设备的物理操作。它处理正在被读取或写入的物理块。它处理缓冲和内存管理，并负责在存储介质的特定位置放置物理块。物理文件系统与设备程序或物理设备通信的通道进行交互。在某种简化水平下，该层可以在图\
  \ 1.3 中通过块层、SCSI 层和物理设备的集成分组进行示意表示。\n\n### 1.8.1 文件系统类型和 ext4\n\n此外，作为我们定义的 `Linux\
  \ kernel` 在瞬态和易失状态运行时不可或缺的一部分，伪文件和特殊用途文件系统可以被视为整个系统“流过”的一系列通道。沿着这些思路，当内核位于 CPU 和相应的\
  \ RAM 中，内核代码本身被组织的文件系统。内核（或 `systemd` 超内核）可以被视为瞬态数据结构的文件系统，用于维护硬件和软件的稳定状态。\n\nLinux\
  \ 三大主要分支中最现代且通用的是 Linux 扩展文件系统 (`ext`)。所有代表下游发行版都将其作为默认文件系统。\n\next 的第 4 版 `ext4`\
  \ 是目前最稳健的版本。它具有许多功能，例如大规模扩展性、映射到非常大磁盘数组的能力以及其他非常关键的功能，如“日志”。以下是 `ext4` 功能的一些简要列表：\n\
  \n1. 它支持大小高达 1 EB 的卷和大小高达 16 TB 的文件。\n2. 它使用“范围”（extents）映射方案，取代了早期 ext 版本使用的块映射。范围是连续物理块的区域。\n\
  3. 它与 `ext3` 和 `ext2` 向后兼容。因此，`ext3` 和 `ext2` 文件系统可以挂载为 `ext4`。\n4. 它在刷新到磁盘时延迟块分配。\n\
  5. 它可以创建无限数量的子目录。\n\n\n\n\n6. 它拥有一个多块分配器，可以对在磁盘上连续分配文件做出更优的选择。\n\n7. 它提供了以纳秒为单位的的时间戳。\n\
  \n**注意**\n\n第 88 页\n从我们树莓派 5 OS 推荐的数据存储模型来看，添加第二个介质（例如），允许您将操作系统和用户数据保留在两个不同的物理持久介质上。这样，如果操作系统发生故障且系统磁盘损坏无法使用，数据将保留在用户数据磁盘上，并且可以非常容易地恢复！\n\
  \n有许多传统的遗留方法可以实现这种数据存储模型的目标，例如使用以下设施：\n\n1. 磁盘和文件维护命令。\n2. 诸如 `mdadm`（软件 RAID 管理器）和\
  \ Linux 卷管理 (`LVM`) 等工具。\n3. 但从我们的角度来看，实现推荐数据存储模型的现代方法是在冗余的额外持久介质上使用 Z 字节文件系统 (`ZFS`)。通过\
  \ `ZFS`，您可以获得位级数据完整性、卷管理、所有层级的 RAID 能力以及防故障备份策略，所有功能都集成在一个工具中。请参阅 section 1.9 获取\
  \ `ZFS` 的简要介绍。\n\n### 1.8.2 持久介质与设备\n\n除了符合我们推荐的存储模型外，向系统添加持久介质还有一些非常重要的原因。您的启动磁盘或系统磁盘可能空间不足，或开始出现故障迹象。在传统的遗留方案中，这些情况可能涉及系统停机以解决问题。而通过我们的存储模型实现以及下节所示的某些设施，可以在不关机系统的情况下处理此类情况。\n\
  \n#### 1.8.2.1 分区方案与策略\n\n到目前，您应该已经清楚树莓派 5 OS 以文件的形式组织一切，并使用文件系统来组织这些文件。磁盘分区可以简单定义为存放文件系统的磁盘逻辑区域。\n\
  \n一旦您确认树莓派 5 系统确实可以识别并挂载额外的介质，就有几个理由为新添加的介质采用特定的分区方案。在磁盘上创建多个分区可以通过将目录隔离到这些分区中来避免磁盘满问题，并让系统管理员控制对这些目录和分区的访问。您还可以同时在不同的分区中维护不同的文件系统结构。\n\
  \n当您添加新介质时，有两种选择：使用命令行工具（如第 89 页的 `fdisk` 或 `gdisk`）进行传统的磁盘分区，或者使用基于 GUI 的方法，工具如\
  \ Gnome 分区编辑器（GParted）。我们在 section 1.8.4 中展示了使用 GParted 的基础，可以使用它结合传统的 ext4 文件系统方案来实现我们推荐的数据存储模型。我们在\
  \ section 1.8.4 中提供了一个 GParted 示例，详细说明了如何使用传统的 ext4 方案进行操作。\n\n为了帮助 Linux 系统管理员完成添加持久介质的任务，以下章节还将解决这些通用问题：\n\
  \n* 为新添加的硬件提供软件设备驱动程序的可用性。\n* 硬件如何在系统中被识别、配置和部署。\n* 在使用我们推荐的数据存储模型的背景下，识别现有硬件更换和升级的可能路径。\n\
  \n正如 section 1.3.1 中的第 3 项讨论的，我们用于树莓派 5 OS 部署的数据存储模型能够挂载并使用两个或多个外部挂载介质，这种实现通过我们在以下子节中的展示得以。\n\
  \nsection 1.8.5 中所示的传统 ext4 示例中的添加将适用于 USB3 U 盘，但也可以轻松扩展到其他持久介质，例如 USB3 挂载的外部 SSD\
  \ 或 NVMe SSD 设备等。\n\n#### 1.8.2.2 添加外部介质\n\n通常，当您在树莓派 5 硬件上安装操作系统一段时间后添加额外的介质时，您会希望对其进行分区。您甚至可能想在上面创建一个新的分区表，创建一个或多个分区，并使用标准文件系统（如\
  \ ext4）格式化这些分区。我们强调并鼓励使用 GParted GUI 应用程序来实现。\n\n当您添加外部 USB2 或 3 介质（如 U 盘或其他形式的持久存储设备）时，它通常已经格式化为\
  \ FAT32 文件系统类型（对于大多数市售的常用 U 盘而言）或其他取决于介质的其他格式。传统上，您可以使用 `fdisk` 命令对磁盘进行分区，并使用 `mkfs`\
  \ 命令为其添加文件系统。如果您选择这种传统操作，我们强调并鼓励使用 `fdisk` 或其更新的兄弟版本 `gdisk` 进行分区。\n\n第 90 页\n注意：在树莓派\
  \ 5 上可以通过图形手段手动安全删除 USB 介质。例如，在桌面上，左键点击菜单栏右上角的图标（图标看起来像一个带有横杠的向上箭头的图标），选择可用介质，再次左键点击该介质以弹出或卸载它。卸载\
  \ USB U 盘或其他 USB 总线介质也可以通过命令行使用 `umount` 命令完成。\n\n当 USB U 盘或其他外部介质被自动挂载时，其路径为 ``/media/your_home_dir/id`，其中\
  \ `your_home_dir` 是您在系统上的主目录名称，`id` 是介质的磁盘 ID 或标识符。\n\n例如，当我们添加了一个 USB U 盘并使用 GParted\
  \ 在其上创建了分区，同时自动为其添加了 ext4 文件系统时，新挂载的硬盘通过以下路径访问：\n\n```\n/media/bob/04fd2202-8879-46f2-8040-446753ed07c\n\
  ```\n\n### 1.8.3 添加新介质时的初步考虑\n\n**注意**\n\n如果您向树莓派 5 插入了一个您已知运行正常的 U 盘或其他任何 USB 可挂载介质，但它没有被识别，那么很可能是操作系统没有可用的设备驱动来启用树莓派\
  \ 5 硬件与 U 盘之间的通信。在这种情况下，寻找替代介质可能是非常明智的。\n\n您如何知道新磁盘是否被识别，最重要的是它在您的系统中是否可用？\n\n至少有三种快速简单的方法可以判断新磁盘是否被识别。\n\
  \n1. 如果是 USB U 盘且之前已格式化为 FAT32，树莓派 5 OS 会自动挂载它，桌面上会出现它的图标（并弹出询问是否要查看其内容的提示）。\n2.\
  \ 在终端窗口中，您可以使用 `systemctl -f` 命令并在插入设备时观察屏幕显示。它会显示添加了一个新设备（当然，前提是系统拥有其驱动程序！），尽管对于\
  \ U 盘来说，它可能格式化为 FAT32 以外的其他格式！\n3. 使用 section 1.8.4 中所示的“前后对比法”。\n\n\n\n\n当你正确连接另一种类型的\
  \ USB 可挂载外部介质时，情况也是如此，但未被识别的概率可能会较低。在介质未被识别的情况下，最好且简单的方法是使用另一台设备。Raspberry Pi 5\
  \ OS 具有在系统中查找并安装设备设备驱动程序的功能，但这个过程非常耗时，并且对于特定设备可能并没有效果，特别是对于初学者而言。此外，你也可以为你的设备编写驱动程序，这会更耗时间，而且对初学者来说效果更差。这里的重点在于，可能\
  \ USB 优存盘没有格式化为 FAT32，而是制造商没有提供设备驱动，或者没有向 Linux 内核开发者提供。\n\n在许多情况下，了解系统中磁盘驱动器的物理设备名称、实例名称和逻辑设备名称是非常重要的，但从实践来说，对于\
  \ Raspberry Pi 5 OS 管理员来说，轻松找到磁盘的逻辑设备名称是最重要的。\n\n你可能想向你的 Raspberry Pi 5 系统添加之前在其他计算机操作系统上过的介质。在这种情况下，我们展示的主要示例和次要示例可以用于重新分区并准备该硬盘以供\
  \ Raspberry Pi 5 OS 新新使用。\n\n### 1.8.4 查找介质逻辑设备名称的五种快速简单方法\n\n在将新介质连接到你的 Raspberry\
  \ Pi 系统之前，重要的是知道如何以非常快速简单的方法确定当前系统中安装的已挂载且可用的介质逻辑设备名称实际上是什么。我们所说的“已挂载且可用”是指介质已正确连接并被系统识别，并且有一个系统可以使用其与之通信的设备驱动程序。\n\
  \n**之前和之后**：如果你想找到新安装介质的逻辑设备名称，请使用以下方法之一，在添加新介质之前查看系统中有哪些介质，然后在添加新介质后使用相同的方法，并注意其差异。出现的不同或新的逻辑名称将是新介质的逻辑设备名称。\n\
  \n接下来的五种简单方法展示了如何确定系统中连接了哪些挂载且可用的介质，以及这些介质以及你可能想要添加到系统的其他介质的逻辑设备名称是什么。\n\n#### 方法\
  \ 1\n\n将你当前的工作目录更改为 `/dev`。输入 `ls`。例如，microSD 卡将在 `ls` 列表中显示为 `mmcblk*`。这些磁盘中第一个切片（或分区）的完整路径指定为\
  \ `mmcblk0p1`。USB 总线设备（如优存盘）将在 `ls` 列表中显示为 `sdb`，或系统分配给它的任何字母标识，其第一个切片的完整路径将是 `sdb1`。USB3\
  \ 挂载的 SSD 将显示为 `sda`，其第一个切片将是 `sda1`。这些正是出现在我们 Raspberry Pi 5 的 `/dev` 目录中的标识。\n\
  \n#### 方法 2\n\n在命令行上输入 `df -hT` 以查找你系统中文件系统的名称以及它们在系统上的挂载路径。在我们的 Raspberry Pi 5\
  \ 系统上，当我们执行此操作以检查一个 256 Gb 的 USB3 优存盘是否最近已成功连接到系统时，输出如下：\n\n```\n $ df -hT\nFilesystem\
  \             Type                   Size       Used       Avail  Use% Mounted on\n\
  udev                   devtmpfs               2.0G       0            2.0G     \
  \  0%   /dev\ntmpfs                  tmpfs                  405M      6.4M     \
  \   399M          2%   /run\n/dev/mmcblk0p2         ext4                   28G \
  \     6.8G        20G      26%   /\ntmpfs                  tmpfs               \
  \   2.0G       0            2.0G       0%   /dev/sh\ntmpfs                  tmpfs\
  \                  5.0M      48K        5.0M          1%   /run/lock\n/dev/mmcblk0p1\
  \         vfat                   512M      37M        444M          14%   /boot/firmware\n\
  tmpfs                  tmpfs                  405M      208K        405M       \
  \   1%   /run/user/1000\n/dev/sda1              exfat                   954G   \
  \   8.1G        946G       1%   /media/bob/X31\n/dev/sdb1              ext4    \
  \               227G      5.7G        209G       3%   /media/bob/5874a62-...\n$\n\
  ```\n\n注意，我们的根目录（或系统磁盘，在“Mounted on”列下显示为 `/`）大小为 28 GB。这是因为我们正从一个容量为 32 GB 的 microSD\
  \ 卡上运行此 Raspberry Pi 5（已用 6.8GB）。一个 1 TB 的 USB3 挂载 SSD 在 `df` 列表中显示为 `/dev/sda1`，新挂载的\
  \ USB3 优存盘显示为 `/dev/sdb1`。我们将在第 1.14.3 节介绍 `df` 命令的更多细节。\n\n#### 方法 3\n\n与使用 `df`\
  \ 命令非常相似，使用 `lsblk -a` 命令。当我们在 Raspberry Pi 系统上使用此命令和选项时，在连接 32 Gb 优存盘后，我们得到了如下输出：\n\
  \n```\n $ lsblk -a\nNAME      MAJ:MIN  RM  SIZE          RO    TYPE MOUNTPOINTS\n\
  ram0      1:0      0   4M             0  disk\nram1      1:1      0   4M       \
  \      0  disk\nram5      1:15     0   4M             0  disk\nloop0     7:0   \
  \   0    B             0  loop\nloop1     7:1      0    B             0  loop\n\
  loop7     7:7      0    B             0  loop\nsda       8:0      0   953.9G   \
  \     0  disk\n└─sda1    8:1      0   953.9G        0  part  /media/bob/X31\nsdb\
  \       8:16     1   230.9G        0  disk\n└─sdb1    8:17     1   230.9G      \
  \  0  part  /media/bob/5874a62...\nmmcblk0   179:0    0   28.9G        0  disk\n\
  ├─mmcblk0p1 179:1  0   512M          0  part  /boot/firmware\n└─mmcblk0p2 179:2\
  \  0   28.4G        0  part  /\n$\n```\n\n#### 方法 4\n\n使用 `findmnt` 命令。\n\n注意某些文件系统类型（FSTYPE）显示为\
  \ ext4, sysfs, tmpfs, nfsd, proc 等类型。\n\n#### 方法 5\n\n你也可以高效地使用基于图形界面的 Gnu Partition\
  \ Editor (GParted)，所示。通过 GParted，你可以找到系统中磁盘的逻辑设备名称。此外，通过 GParted 你可以使用图形化编辑方法影响介质的一些重要特性，例如驱动的格式和分区。\n\
  \n**章节练习**\n\n11 a. 将 USB 优存盘插入你的 Raspberry Pi，必要时挂载。你使用什么命令挂载它？使用 `findmnt` 命令找到它的逻辑设备名称。该优存盘的逻辑设备名称是什么？它挂载在系统的哪个路径上？`findmnt`\
  \ 命令输出的其他文件系统类型的用途和含义是什么？例如，cgroup, proc, fuse.gvf 和 tempfs 是逻辑、虚拟还是物理文件系统，它们与 ext4\
  \ 究竟有何区别？\n\n11 b. NVMe SSD 在你的 Raspberry Pi 5 的 `lsblk -a` 显示中显示为什么？在 `df -hT`\
  \ 显示中显示为什么？\n\n\n\n\n示例 1.7 展示了如何向系统添加新媒体设备并对其分区。我们选择使用基于 GUI 的 GParted 分区编辑器，主要是因为它易于使用，并且可以快速安装在\
  \ Raspberry Pi 5 OS 上。我们之所以选择它而不是 `gdisk` 工具或旧的 `fdisk` 命令，是因为它有一个 GUI 前端，而且该 GUI\
  \ 易于操作。例如，使用它，你不需要记住命令名称、选项或参数就能完成你想要实现的操作。这款 GUI 软件不仅能让你轻松地找到连接到树莓派的媒体设备的逻辑设备名称，还允许你同时对新添加的媒体设备进行分区并在其上创建文件系统。\n\
  \n### 1.8.6 使用 fdisk 添加磁盘\n\n本节将介绍在安装后较长时间后向系统添加媒体设备的更传统方法。我们遵循了推荐的页面存储模型，这与上一节中我们为使用\
  \ GParted 添加的额外硬盘实现模型的一样。在本节中，我们使用 `fdisk` 命令对另一个磁盘进行分区。本节的示例使用了外部挂载的 USB 闪存盘，它更容易被添加，因为其驱动程序更有可能位于内核中，价格更便宜，且对于普通用户作为额外的存储介质更容易获得。\n\
  \n此示例可以轻松扩展到外部挂载的 USB3 SATA SSD 或其他形式的媒体（如 NVMe SSD）。在章节 1.9 中，我们提供了基于 ZFS 的冗余示例，以说明使用\
  \ ZFS 类似的备份策略。\n\n#### 1.8.6.1 使用 fdisk 分区磁盘\n\n`fdisk` 是一个命令行、交互式、对话框驱动的程序，用于在\
  \ Linux 上创建和管理分区表。以下是 `fdisk` 语法和用法简述：\n\n```\n*************************************************************************\n\
  fdisk – 创建并管理分区表\n\n语法: fdisk [options] device\n           fdisk -l [device...]\n\
  \n输出: 媒体设备上的新分区或修改分区。\n\n常用交互命令:\nn      创建新分区。你输入分区编号、起始扇区和结束扇区。\n       起始和结束扇区可以用扇区数的绝对形式指定。\n\
  \       在不输入任何内容的情况下按 Enter 键将指定默认值，即起始扇区为\n       最大可用块的起始，结束扇区为该块的结束。\np     \
  \ 显示基本分区摘要数据。这包括分区编号、起始和 \n       结束扇区编号、分区大小、fdisk 的分区类型代码以及分区名称。\nt      更改单个分区的类型代码。你使用两个字节的十六进制\n\
  \       数字输入类型代码。 \nw      写入数据。使用此命令保存你的更改。\n示例:\n$ sudo fdisk /dev/sdb       \
  \    以超级用户身份在磁盘 /dev/sdb 上运行 fdisk\n*************************************************************************\n\
  ```\n\n**课后练习**\n\n12. 为什么在示例 1.8 中你必须重新挂载 `/dev/sdb1` 才能向磁盘添加目录和文件，你是如何实现重新挂载的？这个闪存盘在你系统中的名称是什么？挂载在何处？\n\
  \n13. 按照示例 1.8 的步骤对 USB 闪存盘进行单主分区划分，然后在其上添加 ext4 文件系统。在闪存盘上创建目录。\n\n14. a. 按照示例\
  \ 1.8 的步骤对 USB3 盒中的外部挂载 SSD 进行分区，在其上设置单主分区，然后在其上添加 ext4 文件系统。在硬盘上创建目录。\n\n14. b.\
  \ 按照示例 1.8 的步骤对外部挂载的 NVMe SSD 进行分区，在其上设置单主分区，然后在其上添加 ext4 文件系统。在 NVMe SSD 上创建目录。\n\
  \n## 1.9 安装 ZFS, zpool 和 zfs 命令语法\n\nZettabyte 文件系统 (ZFS) 是由太阳微系统公司（Sun Microsystems）开发的一种先进日志文件系统和卷管理器，对于维护服务器级计算机的冗余和安全具有许多实用功能和设施。但对于希望实现相同（尽管规模较小）的家庭用户（例如使用树莓派硬件的用户）来说也很有用。以下是安装\
  \ ZFS 的说明，以及两个顶级 ZFS 工具 `zpool` 和 `zfs` 命令的通用语法。有关这两个重要工具更完整的描述，请参阅 `zfs` 和 `zpool`\
  \ 的帮助页。\n\n**注意**\n\n在树莓派上安装 ZFS 的历史充满了错误和困难，主要因为 Linux 内核由于某种无法解释的原因（可能是由于法律问题）与\
  \ ZFS 兼容性良好。在 Debian 的某些版本以及基于它的 Raspberry Pi OS 中，ZFS 是很容易安装的，正如我们在下面所示的 Debian\
  \ Bookworm 以及作为其下游版本的 Raspberry Pi 5 中。谁知道基于 Debian Trixie 的树莓派 5 OS 会带来什么。\n\n\
  ### 1.9.1 安装 ZFS\n\n在本书编写时，在树莓派 5 OS 上安装 ZFS 是一个简单、直接的操作。使用以下命令：\n\n```\n$ sudo\
  \ apt update\n输出省略...\n\n$ sudo apt install raspberry-kernel-headers\n输出省略...\n\n\
  $ sudo apt install zfs-dkms zfsutils-linux\n输出省略...\n```\n\n几分钟后，安装完成。\n\n如果 ZFS\
  \ 成功加载，你可以通过以下方式验证：\n\n```\n$ dmesg | grep ZFS\n[ 4.665181] ZFS: Loaded module v2.2.3-1~bpo12+1~rpt1,\
  \ ZFS pool version 5000, ZFS filesystem version 5\n```\n\n你也可以使用以下命令验证 ZFS 是否正确安装：\n\
  \n```\n$ zfs -version\nzfs-2.2.3-1~bpo12+1~rpt1\nzfs-kmod-2.2.3-1~bpo12+1~rpt1\n\
  $ zpool list\nno pools available\n```\n\n### 1.9.2 zpool 和 zfs 命令的语法\n\n以下是我们在章节\
  \ 1.9.1 在树莓派 5 系统上安装 ZFS 后，从帮助页中摘取的 `zpool` 和 `zfs` 命令的简要语法。\n\n\n\n\n\n```\n ***********************************************************************\n\
  zpool\n语法:\nzpool subcommand [options] [option arguments] [command arguments]\n\
  用途: 创建和管理虚拟设备的存储池，例如磁盘驱动器\n常用选项/功能:\nzpool create name vdev              在指定的 vdev\
  \ 上创建一个名为 name 的新池\nzpool create –o copies=2 name 创建一个属性 copies 设置为 2 的新池 name\n\
  zpool destroy name                   销毁或移除名为 name 的池\nzpool list name          \
  \           出池 name 的存储空间和健康状况\nzpool scrub name                    验证池 name 的校验和是否正确\n\
  zpool status name                   显示池 name 的状态\n***********************************************************************第\
  \ 103 页\n***********************************************************************\n\
  zfs\n语法:\nzfs subcommand [options] [option arguments] [command arguments]\n用途: 创建和管理映射到设备（如磁盘驱动器）的数据或文件系统\n\
  常用选项/功能:\nzfs create name                    创建一个名为 name 的数据集\nzfs create –o copies=2\
  \ name  创建一个属性 copies 设置为 2 的数据集 name\nzfs destroy name                   销毁或移除名为\
  \ name 的数据集\nzfs list                           列出所有数据集\nzfs rollback name     \
  \             将数据集 name 回到之前的快照状态\n***********************************************************************\n\
  ```\n\n### 1.9.3 ZFS 术语\n\n以下描述了本节中使用的基本术语，也适用于通用的 ZFS 实践：\n\n- **启动环境 (Boot environment)**：启动环境是一个可启动的环境，由一个\
  \ ZFS 根文件系统以及可选的、挂载在其底下的其他文件系统组成。一次只能有一个启动环境处于活动状态。\n\n**警告**\n\n此警告适用于本书编写时。重要的一点是，如果你想在任何系统上创建和使用\
  \ ZFS，你必须在你的硬件上附加额外的存储设备或设备。这可以是额外的外部挂载 USB3 或 NVMe SSD，甚至可以是 USB2 或 USB3 优存盘。\n\
  \n我们发现，如果你尝试在树莓派 5 的操作系统或启动磁盘上创建 `zpools`，这将导致该磁盘无法启动！\n\n- **校验和 (Checksum)**：文件系统块中数据的\
  \ 256 位哈希值。校验能力范围可以从简单快速的 `fletcher4`（默认值）到加密强型哈希值，如 `SHA256`。\n\n- **克隆 (Clone)**：其初始内容与\
  \ ZFS 快照内容完全相同的文件系统。\n\n- **数据集 (Dataset)**：以下 ZFS 组件（克隆、文件系统、快照和卷）的通用名称。每个数据集在\
  \ ZFS 命名空间中通过一个唯一名称进行标识。数据集使用以下格式标识：\n\n```\n pool/path[@snapshot]第 104 页\n```\n\
  \n其中：\n\n| **pool** | 标识包含数据集的存储池名称 |\n| **path** | 数据集组件的斜杠分隔路径名 |\n| **snapshot**\
  \ | 可选组件，用于标识数据集的快照 |\n\n- **去重 (Deduplication)**：数据去重通过消除冗余数据来减少存储容量需求的方法。存储介质上实际上只保留一个数据的唯一实例。冗余数据被替换为指向唯一数据副本的指针。\n\
  \n- **文件系统 (file system)**：一种类型为文件系统的 ZFS 数据集，挂载在标准系统命名空间内，其行为与其他文件系统相同。\n\n- **镜像\
  \ (Mirror)**：一种 vdev，在两个或多个磁盘上存储相同的数据副本，存储方式由独立磁盘冗余阵列（RAID）规范定义。如果镜像中的任何磁盘发生故障，根据这些\
  \ RAID 规范，镜像中的任何其他磁盘都可以提供相同的数据。\n\n- **池 (Pool)**：一种描述可用存储布局和物理特征的设备逻辑组。数据集的磁盘空间从池中分配。\n\
  \n- **RAIDZ**：一种使用 RAID 规范在多个磁盘上存储数据和校验的虚拟设备。\n\n- **重构/重同步 (Resilvering)**：将数据从一个设备复制到另一个设备的过程被称为重构。例如，如果一个镜像设备被替换或离线，则来自最新镜像设备的数据将复制到新恢复的镜像设备中。此过程在传统的卷管理中被称为镜像重同步。\n\
  \n- **分区 (Slice)**：使用分区软件创建的磁盘分区。\n\n- **快照 (Snapshot)**：在特定时间点对文件系统或卷的只读副本。\n\n\
  - **虚拟设备 (vdev)**：整块磁盘、一个磁盘分区、一个文件或上述三者的集合（通常为相同类型）。使用磁盘分区而不是整个磁盘没有性能损失。分区禁用了写入缓存，因此会产生性能损失。不建议将文件作为\
  \ vdev，除非是为了在本章中为初学者进行的实验和测试目的！一组 vdev 称为一个镜像。\n\n- **卷 (Volume)**：一种代表块设备的数据集。例如，你可以创建一个\
  \ ZFS 卷作为交换设备。\n\n### 1.9.4 第 105 页 ZFS 如何工作\n\n以下简化的陈述总结了 ZFS 的操作：\n\n```\n 创建映射到\
  \ vdev 的 zpool > 在 zpool 上创建 ZFS 文件系统(s) > 添加文件\n```\n\n简单来说，你首先创建一个命名的 `zpool`，它在创建时会被映射或关联到一个\
  \ `vdev`（例如外部 USB3 介质）。然后你在这些池中创建文件系统；最后你添加文件。\n\n使用 ZFS 的关键在于高效地管理映射了 `vdevs` 的\
  \ `zpools`。\n\n图 1.8 显示了文件、数据集和池之间的关系。**池 1** 映射了两个磁盘，**池 2** 映射了单个磁盘。\n\n![结构显示了文件组织成数据集，每个数据集连接到存储池。池\
  \ 1 连接到两个磁盘，池 2 连接到一个磁盘。](img/fig1_8.jpg)\n\n图 1.8 ZFS 组件。\n\n### 1.9.5 重要的 ZFS\
  \ 概念\n\n这里有几个非常重要的点：\n\n1. 只有一个 `zpool` 可以映射或关联到一个 `vdev`。因此，如果你想在物理磁盘或其任何分区上创建\
  \ `zpool`，没有其他活动 `zpool` 可以映射到该 `vdev`！\n\n2. 第 106 页 ZFS 有六种 vdev 类型：\n\n    -\
  \ `Disk`（默认）：物理硬盘，通常是整盘或主分区。\n    - `File`：预分配文件/镜像的绝对路径。\n    - `Raidz1/2/3`：非标准的分布式校验软件\
  \ RAID 级别。\n    - `Spare`：标记为 ZFS 软件 RAID 热备的硬盘。\n    - `Cache`：用于二级自适应读取缓存 (L2ARC)\
  \ 的设备。\n    - `Log`：称为 ZFS 意图日志 (ZIL) 的独立日志。\n\n3. 与传统文件系统（文件系统的挂载点位于特定的逻辑驱动器号）不同，`zpool`\
  \ 的默认挂载点是根目录 (**/**)。当名为 `test.txt` 的文件位于名为 `data1` 的 zpool 中名为 `bobs` 的集中时，路径显示如下：\n\
  \n```\n /data1/bobs/test.txt\n```\n\n\n\n\n\n名为 `test.txt` 的文件在传统文件系统中的路径如下：\n\n\
  ```\nC:\\Users\\bob\\Desktop\\test.txt\n```\n\n当你想让 ZFS 文件系统扩展到多个磁盘上时，例如，你向 `zpool`\
  \ 添加了更多磁盘。\n\n4. `zpool` 可以通过添加更多设备来扩大，但不能缩小（至少目前不能这样做）！\n\n### 1.9.6 基础 ZFS 示例\n\
  \n在本节中，我们将提供一个关于如何使用 ZFS 的具有指导性的入门示例。为了让你从中获得全部益处，请按照所给顺序执行该操作以及随后的章内练习。\n\n如果你想在这个初步的介绍示例中使用实际挂载并分区的磁盘，请记下它们设备名称的完整路径（例如，`/dev/sdb1`）。你将破坏这些磁盘上所有的分区信息和数据，请务必确保这些数据是不需要的！\n\
  \n**注意**\n\n如果你在过程中的任何地方犯了错误，可以随时执行示例末尾显示的清理步骤并重新开始。\n\n前提条件：在 Raspberry Pi 5 系统上安装了\
  \ ZFS，并在你的 Raspberry Pi 5 硬件上运行，如章节 1.9.1 所示。\n\n步骤：按照所示顺序执行步骤完成此示例。\n\n1. 变为 root\
  \ 用户，然后如下创建四个 128 MB 的文件（文件大小至少为 64 MB）：\n\n```\n$ sudo -i\nroot@bob-desktop:∼#\n\
  root@bob-desktop:∼# truncate --size 128m /home/bob/disk1\nroot@bob-desktop:∼# truncate\
  \ --size 128m /home/bob/disk2\nroot@bob-desktop:∼# truncate --size 128m /home/bob/disk3\n\
  root@bob-desktop:∼# truncate --size 128m /home/bob/disk4\n```\n\n使用以下命令检查 `/home/bob`\
  \ 目录：\n\n```\nroot@bob-desktop:∼# ls -lh /home/bob\ntotal 48K\n...\n-rw-r--r-- 1\
  \ root root 128M May 22 18:47 disk1\n-rw-r--r-- 1 root root 128M May 22 18:47 disk2\n\
  -rw-r--r-- 1 root root 128M May 22 18:47 disk3\n-rw-r--r-- 1 root root 128M May\
  \ 22 18:48 disk4\nOutput truncated…\n```\n\n在该示例中，我们最初在已存在的文件系统上创建并使用文件模拟磁盘，并将它们命名为\
  \ `disk1`、`disk2`、`disk3` 和 `disk4` 以增强这种幻觉。此外，示例代码假设除非另有说明，否则当前工作目录为 `/home/bob`。\n\
  \n2. 第 108 页在创建新池之前，你应该检查是否存在现有池（如果有的话），以避免它们与我们在这里创建的示例池混淆。你可以使用 `zpool list` 命令检查存在哪些池：\n\
  \n```\nroot@bob-desktop:∼# zpool list\nno pools available\nroot@bob-desktop:∼#\n\
  ```\n\n3. 池使用 `zpool create` 创建。我们可以如下所示使用文件创建一个单磁盘池（你必须使用文件的绝对路径），并检查现在存在的 zpools：\n\
  \n```\nroot@bob-desktop:∼# zpool create data /home/bob/disk1\nroot@bob-desktop:∼#\
  \ zpool list\nNAME   SIZE  ALLOC   FREE  CKPOINT  EXPANDSZ   FRAG    CAP  DEDUP\
  \    HEALTH  ALTROOT\ndata      112M   106K      112M                   -      \
  \               -         2%     0%    1.00x         ONLINE  -\n```\n\n4. 现在我们将在新池中创建一个实际文件，检查其大小并获取它的\
  \ zpool 列表：\n\n```\nroot@bob-desktop:∼# truncate --size 32m /data/data20file\nroot@bob-desktop:∼#\
  \ ls -lh /data/data20file\n-rw-r--r-- 1 root root 32M May 22 18:54 /data/data20file\n\
  root@bob-desktop:∼# zpool list\nNAME   SIZE  ALLOC   FREE  CKPOINT  EXPANDSZ   FRAG\
  \    CAP  DEDUP    HEALTH  ALTROOT\ndata      112M       110K   112M           \
  \       -                     -          2%       0%  1.00x       ONLINE     -\n\
  ```\n\n5. 我们现在将使用 `zpool destroy` 破坏池 data，并检查现在可用的 zpools：\n\n```\nroot@bob-desktop:∼#\
  \ zpool destroy data\nroot@bob-desktop:∼# zpool list\n```\n\nNo pools available\n\
  \n6. 使用文件创建镜像池\n\n由单个磁盘组成的池不提供任何冗余！提供磁盘故障保护的一种方法是在池中使用镜像磁盘对：\n\n```\nroot@bob-desktop:∼#\
  \ zpool create data2 mirror /home/bob/disk1 /home/bob/disk2\nroot@bob-desktop:∼#\
  \ zpool list\nNAME   SIZE  ALLOC   FREE  CKPOINT  EXPANDSZ   FRAG    CAP  DEDUP\
  \    HEALTH  ALTROOT\ndata2      112M   106K      112M                   -     \
  \                -         2%     0%    1.00x         ONLINE  -\n```\n\n7. 获取有关池的更多信息，我们使用\
  \ `zpool status`：\n\n```\nroot@bob-desktop:∼# zpool status\npool: data2\nstate:\
  \ ONLINE\nconfig:\n    NAME               STATE     CKSUM\n    data2           \
  \   ONLINE\n      mirror-0            ONLINE\n        /home/bob/disk1         ONLINE\n\
  \        /home/bob/disk2         ONLINE\n```\n\n8. 在 `data2` 池中创建一个文件：\n\n```\n\
  root@bob-desktop:∼# truncate --size 32m /data2/data0file\n```\n\n注意添加文件后池的变化：\n\n\
  ```\nroot@bob-desktop:∼# zpool list\nNAME   SIZE  ALLOC   FREE  CKPOINT  EXPANDSZ\
  \   FRAG    CAP  DEDUP    HEALTH  ALTROOT\ndata2      112M       110K   112M   \
  \               -                     -          2%       0%  1.00x       ONLINE\
  \     -\n```\n\n9. 我们通过用随机数据覆盖第一个 `disk` 来测试冗余：\n\n```\nroot@bob-desktop:∼# dd if=/dev/random\
  \ of=/home/bob/disk1 bs=512 count=1\n1+0 records in\n1+0 out\n512 bytes copied,\
  \ 0.014395 s\n```\n\n10. ZFS 在读写时会自动检查错误，但可以使用 `zfs scrub` 命令强制检查：\n\n```\nroot@bob-desktop:∼#\
  \ zfs scrub data2\n```\n\n11. 检查池的状态：\n\n```\nroot@bob-desktop:∼# zpool status\n\
  pool: data2\nstate: DEGRADED\nstatus: One or more devices could not be used because\
  \ the label is missing\n        invalid.  Sufficient replicas exist for the pool\
  \ to continue\n        functioning in a degraded state.\naction: Replace the device\
  \ using 'zpool replace'.\n  see: https://openzfs.github.io/openzfs-docs/msg/ZFS-8000-4J\n\
  scan: scrub repaired 0B in 00:00:01 with 0 errors on Fri May 23 05:56:49 2025\n\
  config:\n    NAME                       STATE                READ CKSUM\n    data2\
  \                     DEGRADED              0           0\n      mirror-0      \
  \          DEGRADED              0           0\n        /home/bob/disk1  UNAVAIL\
  \                    0           0  corrupted data\n        /home/bob/disk2  ONLINE\
  \                     0           0\n```\n\nerrors: No known data errors\n\n12.\
  \ 我们使用 `dd` 命令的磁盘显示为 `UNAVA`（不可用）且带有损坏数据，但整个池没有报告数据错误，我们仍然可以如下读写池：\n\n```\nroot@bob-desktop:∼#\
  \ truncate --size 32m /data2/data2file2\nroot@bob-desktop:∼# ls -l /data2/\ntotal\
