    在板的右上角，你会发现另一个金属盖（图 1-4），它覆盖着无线电模块，该组件使树莓派具备与设备无线通信的能力。实际上，无线电模块包含两个组件：一个 WiFi
    射电，用于连接计算机网络；一个蓝牙射电，用于连接鼠标等外设设备，并向传感器或智能手机等附近的设备发送或从中接收数据。


