    ![](img/0aff4cdab15427839fb48fd7c6f677d3_195_0.png)


    > f you''ve ever wanted to build something that can see - known in the robotics
    field as computer vision - then Raspberry Pi''s optional Camera Module, or the
    new High Quality Camera, is a great starting place. A small square circuit board
    with a thin ribbon cable, the Camera Module / HQ Camera connects to the Camera
