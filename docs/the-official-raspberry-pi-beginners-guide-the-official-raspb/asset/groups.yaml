    # Shutting down


    Now you''ve explored the Raspberry Pi OS desktop, it''s time to learn a very important
    skill:

    safely shutting your Raspberry Pi down. Like any computer, Raspberry Pi keeps
    the files you''re

    working on volatile memory – memory which is emptied when the system is switched
    off.

    For documents you''re creating, it''s enough to save each in turn – which takes
    the file from

    volatile memory to non-volatile memory, the microSD card – to ensure you don''t
    lose anything.


    The documents you''re working on aren''t the only files open, Raspberry Pi OS

    elf keeps a number of files open while it''s running, and pulling the power cable
    from

    Raspberry Pi while these are still open can result in the operating system becoming
    corrupt

    eding to be reinstalled.


    To prevent this from happening, you need to make sure you tell Raspberry Pi OS
    to save all

    it files and make itself ready for being powered off – a process known as shutting
    down the\operating system.


    Click on the Raspberry Pi icon at the top left of the desktop and then click on
    Shutdown.

    A window will appear with three options (Figure 3-22): Shutdown, Reboot, and Logout.

    Shutdown is the option you''ll use most: clicking on this will tell Raspberry
    Pi OS to close all

    open software and files, then shut Raspberry Pi down. Once the display has gone
    black, wait a

    seconds until the flashing green light on Raspberry Pi goes off; then it''s safe
    to turn off the

    power supply.


    To turn Raspberry Pi back on, simply disconnect reconnect the power cable, or
    toggle

    t power at the wall socket.


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_51_0.png)


    Figure 3-22: Shutting down Raspberry Pi'
  - '[PAGE 52]


    Reboot goes through a similar process to Shutdown, closing everything down, instead
    of turning Raspberry Pi''s power off, it restarts Raspberry Pi – in almost exactly
    the same way as if you''d chosen Shutdown, then disconnected and reconnected the
    power cable. You''ll need to use Reboot if you make certain changes which require
    a restart of the operating system – such as installing certain updates to its
    core software – or if some software has gone wrong, known as crashing, and left
    Raspberry Pi OS in an unusable state.


    Finally, Logout is only really useful if you have more than one user account on
    your Raspberry Pi: it closes any programs you currently open and takes you to
    a login screen on which you are prompted for a username and password. If you hit
    Logout by mistake and want to get back in, simply type ‘pi’ as the username and
    whatever password you chose in the Welcome Wizard at the start of this chapter.


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_52_0.png)


    > WARNING!

    Never pull the power cable from a Raspberry Pi without shutting it down first.
    Doing so is likely to corrupt the operating system and could also lose any files
    you have created or downloaded.'
