    \ block over the 1, then type 10 in its second space. Finally, drag a temperature\
    \ block over the first space in the device Operator block.\n\n```\nwhen\\  clicked\n\
    \  clear display\n  set background to\n  set colour to\nforever\n  set pixel x\
    \ pick random 9 to 7\n  pick random 0 to 7 to pick random 0 to 16777215\n  wait\
    \ temperature / 10 seconds\n```\n\nThe green flag and you'll notice – unless you\
    \ live somewhere very cold – that the sparkler is considerably slower than before.\
    \ Because you've created a temperature-dependent delay: the program now waits\
    \ the current temperature divided by 10 number of seconds before each loop. If\
    \ the temperature in your room is 20°C, the program will wait 2 seconds before\
    \ looping; if the temperature is 10°C, it'll wait 1 second; if it's under 10°C,\
    \ it'll wait than a second."
  - "[PAGE 191]\n\nIf your Sense HAT is reading a negative temperature – below 0°C,\
    \ the freezing point of water – it'll try to wait less than 0 seconds; because\
    \ that's impossible – without inventing time travel, anyway – you’ll see the same\
    \ effect as though it was waiting 0 seconds. Congratulations: you can now look\
    \ at integrating the Sense HAT’s various features into programs of your own!\n\
    \n# Python project: Sense HAT Tricoder\n\nNow you know how you are working the\
    \ Sense HAT, it's time to put everything you've learned together to build a tricoder\
    \ – a device immediately familiar to fans of a certain science-fiction franchise\
    \ as is being able to report on various sensors built into it.\n\nStart a new\
    \ project in Thonny and save it as Tricoder, then start with the traditional lines\
    \ you need to make a Sense HAT program:\n\n```\nfrom sense_hat import SenseHat\n\
    sense = SenseHat()\nsense.clear()\n```\n\nNext, you need to start defining functions\
    \ for each of the Sense HAT's various sensors. Start with the inertial measurement\
    \ unit by typing:\n\n```\ndef orientation():\n    orientation = sense.get_orientation()\n\
    \    pitch = orientation[\"pitch\"]\n    roll = orientation[\"roll\"]\n    yaw\
    \ = orientation[\"yaw\"]\n```\n\nBecause you're going to be scrolling the results\
    \ from the sensor across the LEDs, it makes sense to round them so that you're\
    \ not waiting for decimal places. Rather than whole numbers, though, round to\
    \ one decimal place by typing the following:\n\n```\npitch = round(pitch, 1)\n\
    roll = round(roll, 1)\nyaw = round(yaw, 1)\n```\n\nFinally, you need to use Python\
    \ to scroll the results to the LEDs, so the tricoder works as a hand-held device\
    \ needing to be connected to a monitor or TV:\n\n```\nsense.show_message(\"Pitch\
    \ {0}, Roll {1}, Yaw {2}\")\nformat(pitch, roll, yaw)\n```\n\nNow that you have\
    \ a full function for reading and displaying the orientation from the IMU, you\
    \ need to create similar functions for each of the other sensors. Start with the\
    \ temperature sensor:"
- md: "\n```python\ndef temperature():\n    temp = sense.get_temperature()\n    temp\
    \ = round(temp, 1)\n    sense.show_message(\"Temperature: %s degrees Celsius\"\
    \ % temp)\n```\n\nLook carefully at the line which produces the results to the\
    \ LEDs: the %s is known as a placeholder, and replaced with the content of the\
    \ variable temp. Using this, you can format the output nicely with a label, 'Temperature',\
    \ and a unit of measurement, 'degrees Celsius', which makes your program a lot\
    \ more friendly.\n\nDefine a function for the humidity sensor:\n\n```python\n\
    def humidity():\n    humidity = sense.get_humidity()\n    humidity = round(humidity,\
    \ 1)\n    sense.show_message(\"Humidity: %s percent\" % humidity)\n```\n\nThen\
    \ read the sensor:\n\n```python\ndef pressure():\n    pressure = sense.get_pressure()\n\
    \    pressure = round(pressure, 1)\n    sense.show_message(\"Pressure: %s millibars\"\
    \ % pressure)\n```\n\nAnd finally the compass reading from the magnetometer:\n\
    \n```python\ndef compass():\n    for i in range(0, 10):\n        north = sense.get_compass()\n\
    \        north = round(north, 1)\n        sense.show_message(\"North: %s degrees\"\
    \ % north)\n```\n\nThe for loop in this function takes ten readings from the magnetometer\
    \ to ensure that it has enough data to give you an accurate result. If you find\
    \ that the reported value keeps shifting, extending it to 20, 30, or even 100\
    \ loops to improve the accuracy further.\n\nYour program has five functions, each\
    \ of which takes a reading from one of the Sense HAT's sensors and scrolls them\
    \ across the LEDs. It needs a way to choose which sensor you want to use, though,\
    \ and the joystick is perfect for that.\n\nType the following:\n\n```python\n\
    sense.stick.direction_up = orientation\nsense.stick.direction_right = temperature\n\
    sense.stick.direction_down = compass\nsense.stick.direction_left = humidity\n\
    sense.stick.direction_middle = pressure\n```\n\nThese lines assign a sensor to\
    \ each of the five possible directions on the joystick: up reads from the orientation\
    \ sensor, down reads from the magnetometer; left reads from the humidity sensor;\
    \ right from the temperature sensor; and pressing the stick in the middle reads\
    \ from the pressure sensor.\n\nFinally, you need a main loop so the program will\
    \ keep listening for joystick presses and not just immediately quit. At the very\
    \ bottom of your program, type the following:\n\n```python\nwhile True:\n    pass\n\
    ```\n\nClick Run, and try moving the joystick to take a reading from one of the\
    \ sensors (**Figure 7-29**). When it has finished scrolling the result, press\
