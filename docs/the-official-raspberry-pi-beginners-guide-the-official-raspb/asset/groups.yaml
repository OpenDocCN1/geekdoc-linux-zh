- md: '

    The tool is split into five tabs. The first of these is System: this allows you
    to change the password of your account, set a host name – the name Raspberry Pi
    uses on your local wireless or wired network – and alter a range of other settings.
    The majority of these, though, shouldn''t need changing. Click on the Display
    tab to bring you to the next category. Here you can alter the screen display settings
    if needed, to suit your TV or monitor.


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_50_0.png)


    ## MORE DETAILS


    This brief overview is simply to get you to the tool. More detailed information
    on each of its settings can be found in [Appendix E, The Raspberry Pi Configuration
    Tool].


    The Interface tab contains ranges of settings, all of which start disabled. These
    settings should only be changed if you''re adding new hardware, such as the Raspberry
    Pi Camera Module. The exceptions to this rule are: SSH, which enables a ‘Secure
    Shell’ and lets you log into Raspberry Pi from another computer on your network
    using an SSH client; VNC, which enables a ‘Virtual Network Computer’ and lets
    you see and control the Raspberry Pi OS desktop from another computer on your
    network using a VNC client; and Remote GPIO, which lets you Raspberry Pi’s GPIO
    pins – from which you’ll learn in **Chapter 6, Physical computing with Scratch
    and Python** – from another computer on your network.


    Click on the Performance tab to see the fourth category. Here you can set the
    amount of memory used by Raspberry Pi’s graphics processing unit (GPU) and, for
    some models, increase the performance of Raspberry Pi through process known as
    *overclocking*. As before, though, it’s best to leave these settings unless you
    know you need to change them.


    Finally, click on the Localisation tab to see the last category. Here you can
    change your locale, which controls things like the language used in Raspberry
    Pi OS and how numbers are displayed, change the time zone, change the keyboard
    layout, and set your country for WiFi purposes. For now, though, just click on
    Cancel to close the tool without making any changes.


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_50_1.png)


    ## WARNING!


    Different countries have different rules about what frequencies a WiFi radio can
    use. Setting the WiFi country in the Raspberry Pi Configuration Tool to a different
    country from the one you’re actually in is likely to make it struggle to connect
    to your networks and can even be illegal under radio licensing laws – so don’t
    do it!


    ## Shutting down


    Now you''ve explored the Raspberry Pi OS desktop, it''s time to learn a very important
    skill: safely shutting your Raspberry Pi down. Like any computer, Raspberry Pi
    keeps the files you''re working on volatile memory – memory which is emptied when
    the system is switched off. For documents you''re creating, it''s enough to save
    each in turn – which takes the file from volatile memory to non-volatile memory,
    the microSD card – to ensure you don''t lose anything.


    The documents you''re working on aren''t the only files open, Raspberry Pi OS
    keeps a number of files open while it''s running, and pulling the power cable
    from Raspberry Pi while these are still open can result in the operating system
    becoming corrupt, leading to being reinstalled.


    To prevent this from happening, you need to make sure you tell Raspberry Pi OS
    to save all its files and make itself ready for being powered off – a process
    known as shutting down the operating system.


    Click on the Raspberry Pi icon at the top left of the desktop and then click on
    Shutdown. A window will appear with three options (Figure 3-22): Shutdown, Reboot,
    and Logout. Shutdown is the option you''ll use most: clicking on this will tell
    Raspberry Pi OS to close all open software and files, then shut Raspberry Pi down.
    Once the display has gone black, wait a few seconds until the flashing green light
    on Raspberry Pi goes off; then it''s safe to turn off the power supply.


    To turn Raspberry Pi back on, simply reconnect the power cable, or toggle your
    power at the wall socket.


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_51_0.png)


    Figure 3-22: Shutting down Raspberry Pi


    Reboot goes through a similar process to Shutdown, but it restarts the system
    automatically. This is useful after you''ve installed new software or changed
    settings that require a restart. Logout ends your current user session but leaves
    the computer running, which is useful if you want to switch users without shutting
    down the entire system.


