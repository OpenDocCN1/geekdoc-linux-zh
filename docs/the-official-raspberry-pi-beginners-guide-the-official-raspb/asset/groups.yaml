    # Project 1: Astronaut Reaction Timer


    Now you understand how Scratch works, it''s time to make something a little more
    interactive: a reaction timer, designed to honour British ESA astronaut Tim Peake
    and his time aboard the International Space Station.


    Save your existing program, if you want to keep it, open a new project by clicking
    on File and New. Before you begin, give it a name by clicking on File and ''Save''
    to your computer: call it ''Astronaut Reaction Timer''.


    This project relies on two images – one as a stage background, one as a sprite
    – which are not included in Scratch’s built-in resources. To download them, click
    on the raspberry icon to load the Raspberry Pi OS window, move the mouse pointer
    to Internet, and click on Chromium Web Browser. When the browser has loaded, type
    rpi.io/astronaut-backdrop into the address bar, followed by the ENTER key. Right-click
    on the picture of space and click ‘Save image as...’, then choose the Downloads
    folder and click the Save button (Figure 4-10).


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_69_0.png)


    Figure 4-10: Save the background image


    Again, right-click on the picture of Tim Peake and click on ‘Save image as...’,
    then choose the Downloads folder and click the Save button. With those two images
    saved, you can close Chromium or leave it open and use the taskbar to switch back
    to Scratch 3.


    # USER INTERFACE


    If you’ve been following this chapter from the start, you should be familiar with
    the Scratch 3 user interface. The following project instructions will rely on
    you knowing where things are; if you forget where to find something, look back
    at the picture of the interface at the start of this chapter for a reminder.


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_69_1.png)


    Right-click the cat sprite in the list and click ‘delete’. Hover the mouse pointer
    over Choose a Backdrop icon 🖼️, then click the Backdrop icon 🖼️ from the list
    that appears. Find the Space-background.png file in the Downloads folder, click
    to select it, then click OK. The plain stage background will change to the picture
    of space, and the code area will be replaced by the backdrops area (Figure 4-11).
    Here you can draw over the backdrop, but for now just click the marked code at
    the Top of the Scratch 3 window.

