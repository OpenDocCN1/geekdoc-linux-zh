    \n**Figure 3-4:** Checking there's no black border\n\nThe following screen will\
    \ allow you to choose your WiFi network from a list (**Figure 3-5**). Scroll through\
    \ the list of networks with the mouse or keyboard, find your network's name, click\
    \ on it, then click Next. Assuming that your wireless network is secure (it really\
