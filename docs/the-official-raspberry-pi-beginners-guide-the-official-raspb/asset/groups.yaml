    # The Recommended Pi Software tool


    Although Raspberry OS comes preloaded with a wide range of software, it''s compatible
    with even more. A selection of the best of this software can be found in the Recommended
    Software tool.


    Note that the Recommended Software tool needs a connection to the internet. If
    your Raspberry Pi is connected, click on the raspberry menu icon, move your mouse
    pointer to Preferences, and click on Recommended Software. The tool will load,
    then bringing information about available software.


    After a few seconds, a list of compatible software packages will appear (Figure
    3-19). These, like the software in the raspberry menu, are arranged into various
    categories. Click on a category in the pane on the left to see software from that
    category, or click All Programs to see everything.


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_48_0.png)


    **Figure 3-19:** The Recommended Software tool


    If a piece of software has a tick next to it, it''s already installed on your
    Raspberry Pi. If it doesn''t, you can click on the checkbox next to add it and
    mark it for installation. You can mark as many pieces of software as you like
    before installing them all at once, but if you''re using a smaller than recommended
    microSD card you may not have room for them.


    You can also uninstall software in the same way: find a piece of software which
    already has a tick in check box, click the tick to remove it. If you''ve made
    a mistake or changed your mind, just click again to pull the tick back.


    When you''re happy with your software selection, click the OK button to begin
    the installation or uninstallation process (Figure 3-20, overlap). After downloading
    and installing any new software you''ve chosen, a dialogue box will appear; click
    OK to close the Recommended Software tool.'
