  mdcn: "\n\n# 树莓派官方新手指南\n\n![](img/0aff4cdab15427839fb48fd7c6f677d3_70_0.png)\n\n\
    图 4-11：太空背景显示在舞台上\n\n将鼠标指针悬停在“选择角色图标”（Choose a Sprite Icon）上，然后点击出现的列表顶部的“上传角色”（Upload\
    \ Sprite）图标来上传你的新角色。在“下载”文件夹中找到 `Astronaut-Tim.png` 文件，点击选择它，然后点击“确定”。角色会自动出现在舞台上，但可能不在中间：用鼠标点击并拖动它，将其释放到下部中间的位置（图\
    \ 4-12）。\n\n![](img/0aff4cdab15427839fb48fd7c6f677d3_70_1.png)\n\n图 4-12：将宇航员角色拖到舞台的下部中间\n\
    \n当新背景和角色准备就绪后，你就可以编写程序了。首先创建一个名为 'time' 的新变量，确保在点击“确定”之前已选择“对于所有角色”（For all sprites）。点击你的角色——无论是在舞台上还是角色面板中——来选中它，\n\
    \n## 第 4 章使用 Scratch 3 进行编程\n\n然后从“事件”（Events）类别中添加一个“当点击时”（when clicked）模块到代码区域。接下来，从“外观”（Looks）类别中添加一个“说\
    \ Hello! 2 秒”（say Hello! for 2 seconds）模块，然后点击它将其更改为说“Hello! 英国欧空局宇航员蒂姆·皮克（Tim\
    \ Peake）。你准备好了吗？”。\n\n![](img/0aff4cdab15427839fb48fd7c6f677d3_71_0.png)\n\n从“控制”（Control）类别中添加一个“等待\
    \ 1 秒”（wait 1 seconds）模块，然后添加一个“说 Hello!”模块。将此模块更改为说“按下空格！”（Hit Space!），然后从“传感器”（Sensing）类别中添加一个“重置计时器”（reset\
    \ timer）模块。这控制一个 Scratch 内置的用于计时的特殊变量，将用于记录你在游戏中反应的速度。\n\n![](img/0aff4cdab15427839fb48fd7c6f677d3_71_1.png)\n\
    \n添加一个“等待直到……”（wait until）模块，将“当空格键被按下时？”（key space pressed?）传感器模块拖入它的空白区域。这将暂停程序，直到你按下键盘上的\
    \ SPACE 键，但计时器将继续运行，从而精确计算从提示你“按下空格！”到你实际按下 SPACE 之间的时间。\n\n![](img/0aff4cdab15427839fb48fd7c6f677d3_71_2.png)\n\
    \n你现在需要蒂姆告诉你花了多久才按下空格键，但要用易于阅读的方式。为了这一点，你需要一个“拼接”（join）运算符模块。它接受两个值（包括变量），并在它们之后连接在一起——这被称为连接（concatenation）。\n\
    \n# 树莓派官方新手指南\n\n从一个“说 Hello!”模块开始，然后将“拼接”（join）运算符模块拖动到单词“Hello”上。点击 'apple'\
    \ 并输入 'Your reaction time was '，确保在末尾添加一个空格，然后将另一个模块拖到第二个框中的 'banana' 之上。从“传感器”类别中将一个“计时器报告”模块拖到现在的中间框中，并在最后一个框中输入\
    \ 'seconds '——确保开头包含一个空格。\n\n![](img/0aff4cdab15427839fb48fd7c6f677d3_72_0.png)\n\
    \n最后，将“将我的变量设置为 0”（set my variable to 0）变量模块拖到你序列的末尾。点击'my variable'旁边的下拉箭头，从列表中点击'time'，然后将'0'替换为来自“传感器”类别的“计时器报告”模块。你的游戏现在准备好可以通过点击舞台上方的绿旗进行测试了。准备好，一旦看到“按下空格！”的消息，就尽可能快地按下\
    \ SPACE 键（图 4-13）——看看你能否击败我们的分数！\n\n![](img/0aff4cdab15427839fb48fd7c6f677d3_72_1.png)\n\
    \n▲ 图 4-13：游戏时间到！\n\n## 第 4 章使用 Scratch 3 进行编程\n\n你可以进一步扩展此项目，让它根据国际空间站每秒七公里的公布速度，计算在按下\
    \ SPACE 键的时间内国际空间站大约运行了几远。创建一个名为 'distance' 的新变量。注意变量类别中的模块如何自动更改以显示新变量，但你程序中的'time'变量模块保持不变。添加一个“将距离设置为\
    \ 0”（set distance to 0）模块，然后将一个“乘法”模块拖到'0'上。将一个“计时器报告”模块拖到第一个空白处，然后在第二个空格处输入数字'7'。完成后，你的组合模块读取为\
    \ `将距离设为 time * 7`。这将取按下空格键的时间乘以七，得到国际空间站运行的距离（单位公里）。\n\n![](img/0aff4cdab15427839fb48fd7c6f677d3_73_0.png)\n\
    \n添加一个“等待 1 秒”模块并将其更改为'4'。最后，将一个“说 Hello!”模块拖到序列的末尾，并像之前那样添加两个“拼接”（join）模块。在第一个空格输入'kilometres'；在最后一个空格，在开头包含一个空格。\n\
    \n# 树莓派官方新手指南\n\n![](img/0aff4cdab15427839fb48fd7c6f677d3_74_0.png)\n\n最后，将“将我的变量设置为\
    \ 0”（set my variable to 0）变量模块拖到你序列的末尾。点击'my variable'旁边的下拉箭头，从列表中点击'time'，然后将'0'替换为来自“传感器”类别的“计时器报告”模块。你的游戏现在准备好可以通过舞台上方的绿旗进行测试了。准备好，一旦看到“按下空格！”的消息，就尽可能快地按下\
    \ SPACE 键（图 4-13）——看看你能否击败我们的分数！\n\n![](img/0aff4cdab15427839fb48fd7c6f677d3_74_1.png)\n\
    \n## 第 4 章使用 Scratch \n\n你可以通过让它计算国际空间站在按下 SPACE 键的时间内大约运行了多远，基于空间站每秒七公里的公布速度来进一步扩展此项目。创建一个名为\
    \ 'distance'的新变量。注意变量类别中的模块如何自动更改以显示新变量，但你程序中的时间变量模块保持不变。添加一个“将距离设置为 0”模块，然后将一个“乘法”模块拖到'0'上。将一个“计时器报告”模块拖到第一个空白处，然后在第二个空格处输入数字'7'。完成后，你的组合模块读取为\
    \ `将距离设为 time * 7`。这将取按下空格键的时间乘以七，得到国际空间站运行的距离（单位公里）。\n\n![](img/0aff4cdab15427839fb48fd7c6f677d3_73_0.png)\n\
    \n添加一个“等待 1 秒”模块并将其更改为'4'。最后，将一个“说 Hello!”模块拖到序列的末尾，并像之前那样添加两个“拼接”（join）模块。在第一个空格输入'kilometres'；在最后一个空格，在开头包含一个空格。\n\
    \n# 树莓派官方新手指南\n\n![](img/0aff4cdab15427839fb48fd7c6f677d3_74_0.png)\n\n最后，将一个“取整”（round）运算符模块拖入中间空格。这会将数字舍入到最近的整数。\n\
    \n## 第 4 章使用 Scratch 3\n\n![](img/0aff4cdab15427839fb48fd7c6f677d3_75_0.png)\n\
    \n为了让猫的动作更真实，你可以更改它的外观——在 Scratch 术语中被称为你的造型（costume）。点击猫角色，然后点击模块面板上方的“造型”（Costumes）选项卡。点击‘flying-a’造型并点击垃圾桶图标删除它。\n\
    \n"
