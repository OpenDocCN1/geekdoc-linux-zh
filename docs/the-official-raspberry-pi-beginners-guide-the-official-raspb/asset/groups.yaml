    # THE OFFICIAL RASPBERRY PI BEGINNER''S GUIDE


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_196_0.png)


    # CAMERA TYPES!


    Three types of Raspberry Pi Camera are available: the standard Camera Module,
    the ''NoIR'' version, and the High Quality (HQ) Camera. If you want to take normal
    pictures and video in well-lit environments, you should use the standard Camera
    Module; if you want to use special lenses and are for the best picture quality,
    use the HQ Camera Module. The NoIR Camera Module – so called because it has no
    infrared, or IR filter – is designed for use with infrared light sources to take
    pictures and video in total darkness. If you''re building a nest box, security
    camera, or other project involving night vision, you want the NoIR version – but


    The standard and NoIR Raspberry Pi Camera Modules are based on a Sony IMAX219
    sensor. This is an 8megapixel sensor, which means it can take pictures up to 8
    million pixels in them. It does this by capturing images up to 3280 pixels by
    2464 tall. As well as still images, the Camera Module can capture video footage
    at Full HD resolution at a rate of 30 frames per second (30 fps). For smoother
    motion or to create a slow-motion effect, the camera can be set to capture at
    a higher frame rate by lowering the resolution: 60fps for 720p video footage,
    and up to 90fps for 480p (VGA) footage.


    The High Quality Camera uses a 12.3 megapixel Sony477 sensor, which is larger
    than the one in the standard and NoIR Camera Modules – meaning it can gather more
    light, leading to higher-quality images. Unlike the Camera Modules, though, the
    HQ Camera doesn''t include a lens, without which it can''t take any pictures or
    videos. You can use any lens with a C or CS mount; other mounts can be used with
    an appropriate C or CS mount adapter. Details of how to attach a lens, see **Appendix
    F: High Quality Camera.**


    # RASPBERRY PI 400


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_196_1.png)


    Unfortunately, the Raspberry Pi Camera Modules are not compatible with Raspberry
    Pi 400. You can use USB webcams as an alternative, but won''t be able to use the
    Raspberry Pi Camera Module-specific software tools included in Raspberry Pi OS.


    Chapter 8 Raspberry Pi Camera Module


