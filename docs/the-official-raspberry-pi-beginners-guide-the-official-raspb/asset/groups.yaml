    ~ your first program is a success!


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_56_0.png)


    > Figure 4-2: Click the green flag above the stage and the cat will say ''Hello''


    Before moving on, name and save your program. Click on the File menu, then ‘Save
