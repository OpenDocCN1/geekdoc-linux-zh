    比较两个值，并在当左侧的值小于右侧的值时触发；而 `>` 则在当左侧的值大于右侧的值时触发。


    点击积木面板中的“控制”（Control）分类，找到 `if` 块，然后点击并拖动它到准备释放 `say loops for 2 seconds` 块之前的区域。它会自动包裹
    `change loops by 1` 块，因此点击并拖动将其移动到你的 `if` 块的底部。点击积木面板中的“外观”（Looks）分类，然后点击并拖动一个
    `say Hello! for 2 seconds` 块释放到你的 `if` 块内部。点击积木面板中的“运算符”分类，然后点击并拖动你块中的 `>` 菱形插槽。


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_67_0.png)


    **if then** 块是一个条件块，这意味着它内部的块只有在满足条件时才会运行。点击“变量”分类，将 `loops` 报告器块拖入块中的空白处，然后点击写有‘50’的区域并输入数字‘10’。最后，点击“Hello!
    ”字样在你的 `say Hello! for 2 seconds` 块中输入‘High’。


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_67_1.png)


    点击舞台区域上方的绿色旗帜，你会发现程序运行得和之前一样：猫咪精灵从 0 数到 9（图 4-9），然后程序停止。当数字达到 6 时，`if then` 块会触发，猫咪精灵会说“High’。恭喜你，你现在可以使用变量和条件判断了！


    ![](img/0aff4cdab15427739fb48fd7c6f677d3_68_0.png)


