    # 官方树莓派 4 入门指南


    在板的底部边缘，中间一组 USB 端口的后面，可以看到另一个黑色塑料外壳芯片。这是 USB 控制器，负责运行 USB 端口。旁边是另一个较小的芯片——网络控制器，它处理树莓派的以太网端口。在板的左上方
    Type-C 电源接口上方一点处，可以找到最后一个比其他芯片都短小的黑色芯片（图 1-5）；这被称为电源管理电路 (PMIC)，负责将输入的电源转换为树莓派运行所需的电电。


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_12_0.png)


    图 1-5：树莓派的电源管理电路 (PMIC)


    如果这看起来很复杂，请不要担心：使用树莓派时你不需要知道每个组件是什么，也不需要知道它们在板上的具体位置。


    ## 树莓派的端口


    树莓派有一系列端口，从底部边缘中间到右侧有四个通用串总线（USB）端口（图 1-6）。这些端口允许你向树莓派连接任何 USB 兼容的外设，从键盘、鼠标到数字相机和闪存器。从技术上讲，端口有两种类型：带有黑色部分的是
    USB 2.0 端口，基于通用串总线标准的第二版本；带有蓝色部分的是更快的 USB 3.0 端口，基于第三版本。


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_13_0.png)


    +   图 1-6：树莓派的 USB 端口


    USB 端口右侧是一个以太网端口，也称为网络端口（图 1-7）。你可以使用此端口通过带有已知 RJ45 接头的电缆将树莓派连接到有线计算机网络。如果你仔细观察以太网端口，你会看到底部有两个发光二极管
    (LED)；这些是状态 LED，让你知道连接正在工作。


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_14_0.png)


    图 1-7：树莓派的以太网端口


    在 USB 端口正上方，树莓派的左侧边缘有一个 3.5 mm 的音视频 (AV) 接口（图 1-8）。它也被称为耳机接口，可以用于此目的——尽管将其连接到功率扬声器而不是耳机会获得更好的音质。但它还有一个额外功能：3.5
    mm AV 接口除了音频外还传输视频信号，可以连接到电视、投影仪和其他支持复合视频信号的显示器。


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_14_0.png)


    图 1-8：树莓派的 3.5 mm AV 接口


    在 3.5 mm AV 接口正上方，树莓派的左侧是一个带有特殊外壳的接口（图 1-9），这被称为摄像头接口 (CSI)，允许你使用树莓派摄像头模块（你将在第
    8 章中了解到更多信息）。


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_15_0.png)


    图 1-9：树莓派的摄像头接口


    在它的上方，仍然位于树莓派左侧的是微型高清多媒体接口 (micro-HDMI)，它们在游戏机、机顶盒或电视中非常常见。你可以使用这些接口将树莓派连接到一个两个显示设备。


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_15_1.png)


    图 1-10：树莓派的 micro-HDMI 端口


    HDMI 端口上方是 USB-C 端口（图 1-11），用于将树莓派连接到电源源。USB-C 端口在手机、平板电脑和其他便携设备中很常见。虽然你可以使用充电器为树莓派供电，但为了获得最佳效果，你应该使用官方树莓派
    USB-C 电源。


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_16_0.png)


    图 1-11：USB-C 功率接口


    板的顶部是另一个接口（图 1-12），它看起来和摄像头接口完全一样。但它是相反的：显示器接口 (DSI)，专门用于显示器。


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_16_1.png)


    +   图 1-12：树莓派的显示接口 (DSI)


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_17_0.png)


    在板的右侧边缘，你会发现 40 个引脚，分为两排每排 20 个。这是 GPIO（通用输入输出）接口，用于与 LED 和按钮等额外硬件通信。在它的下方左侧是另一个四个引脚的接口：这是以太网供电
    (PoE) HAT，一种可选的扩展组件，让树莓派通过网络连接供电。


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_17_1.png)


    图 1-13：树莓派的 GPIO 接口


    树莓派还有一个最后一个端口，但你不会在顶部看到。转过板子，你会在另一面找到一个 microSD 接口（图 1-14）。这是树莓派的存储器：插入此处的 microSD
    卡包含了你保存的所有文件、安装的所有软件以及让树莓派运行的操作系统。


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_18_0.png)


    +   图 1-15：树莓派的 microSD 卡接口


