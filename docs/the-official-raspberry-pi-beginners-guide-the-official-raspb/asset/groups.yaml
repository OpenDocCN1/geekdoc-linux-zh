    10` 块下方。点击并拖动 `repeat 10` 块回到积木面板以将其删除，用一个 `repeat until` 块替换它，确保它连接到 `set loops
    to 0` 块的底部，并包裹你序列中的另外两个代码块。点击积木面板中绿色的“运算符”（Operators）分类，然后点击并拖动菱形的 `=` 块，将其释放到
