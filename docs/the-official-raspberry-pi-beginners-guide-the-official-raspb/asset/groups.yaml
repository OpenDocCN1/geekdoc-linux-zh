    # Next steps: sequencing


    While your program has two blocks, it has only one instruction: to say ‘Hello’
    every time the flag is clicked and the program runs. You need to know about *sequencing*.
    Computer programs, at their simplest, are a list of instructions, just like a
    recipe. Each instruction follows from the last in a logical progression known
    as a *linear sequence*.


    Start by clicking and dragging the `when Hello` block from the code area back
    to the blocks palette (**Figure 4-4**). This deletes the block, removing it from
    your program and leaving the trigger block, `when clicked`.


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_58_0.png)


    **Figure 4-4:** To delete a block, simply drag it out of the code area


    Click on the Motion category in the blocks palette, then click and drag the `move
    10 steps` block so it locks into place underneath the trigger block on the code
    area. As the name suggests, this tells your sprite – the cat – to move a number
    of steps in the direction it''s currently facing.


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_58_1.png)


    Add more instructions to your program to create a sequence. Click on the Sound
    palette, colour-coded pink, then click and drag the `play sound Meow until done`
    block so it locks underneath the `move 10 steps` block. Keep going: click back
    on the Motion category and drag another `move 10 steps` block underneath your
    Sound block, but this time click the ''10'' to select it and create a `move -10
    steps` block.


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_58_2.png)


    Click on the green flag above the stage to run the program. You''ll see the cat
    move to the right, make a meow sound – make sure you''ve got speakers or headphones
    connected to hear it – move back to the start again. Click the green flag, and
    the cat will repeat its actions.


    Congratulations! you''ve created a sequence of instructions, Scratch is running
    through one at a time, top to bottom. While Scratch will only run one instruction
    at a time from the sequence, it does so quickly: try deleting the play sound until
    done block by clicking and dragging the bottom move -10 steps block to detach
    it, dragging the play sound Meow until done block to the blocks palette, replacing
    it with the simpler play sound Meow block before dragging your move -10 steps
    block onto the bottom of your program.


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_59_0.png)


    Click the green flag to run your program again, and the cat sprite doesn''t seem
    to move. The sprite is moving, in fact, it moves back again so quickly that it
    appears to be still. This is because using the play sound block doesn''t wait
    for the sound to finish; you can now see the cat move. There''s another way to
    fix this, beyond using the play sound Meow until done block: click on the Orange
    category of the blocks palette, click and drag a wait 1 seconds block between
    the play sound block and the bottom move -10 steps block.


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_59_1.png)


    Click the green flag one last time, and you''ll see that the cat sprite waits
    for a second after moving to the right before moving to the left. This is known
    as delay, and is key to controlling how long your sequence takes to run.


    > CHALLENGE: ADD STEPS

    Try adding steps to your sequence, and changing the values. What happens when
    the number of steps in one block doesn''t match the number of steps in another?
    What if you try to play a sound while another is still playing?


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_60_0.png)


    # Looping the loop


    The sequence you''ve created runs only once: you click the green flag, the cat
    sprite moves and then the program stops until you click the green flag again.
    It doesn''t have to stop because Scratch includes a type of Control block as a
    loop. Click on the Control category in the blocks palette and find the `forever`
    block. Click and drag this into the code area, drop it underneath the `when clicked`
    block and above the first `move 10 steps` block.


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_60_1.png)


    Notice how the C-shaped forever block automatically grows to surround the other
    blocks in your sequence. Click the green flag now, and you''ll quickly see what
    the `forever` block does: instead of your program running once it will run over
    and again - literally forever. In programming, this is known as an *infinite loop*
    — literally, a loop that never ends.


    If the sound of constant meowing is getting a little much, click the red octagon
    next to the green flag above the stage area to stop your program. To change the
    loop type, click and drag the move 10 steps block and pull the blocks beneath
    it out of the forever block, drop them underneath the when clicked block. Click
    and drag the forever block to the blocks palette to delete it, then click and
    drag the repeat 10 block under the when clicked block so it goes around the other
    blocks.


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_61_0.png)


    Click the green flag to run your new program. First, it seems to be doing the
    same thing as your original version: repeating your sequence of instructions over
    and again. This time, though rather not continuing forever, the loop will finish
    after ten repetitions. This is known as a definite loop: you define when it will
    finish. Loops are powerful tools, and most programs – especially games and sensing
    programs – make heavy use of both infinite and definite loops.


    # Variables and conditionals


    The final concepts to understand before beginning to code Scratch programs in
    earnest are closely related: variables and conditionals. A variable is, as its
    name, a value which can vary – in other words, change – time and under control
    of the program. A variable has two main properties: its name and its value. That
    value doesn''t have to be a number, either: it can be numbers, text, true-or-false,
    or completely empty – known as a null value.


    Variables are powerful tools. Think of the things you have to track in a game:
    the health of a character, the speed of moving object, the level currently being
    played, and the score. All of these are tracked as variables.


