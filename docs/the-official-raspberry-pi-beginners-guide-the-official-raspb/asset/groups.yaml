    该工具分为五个标签页。第一个是系统（System）：这允许你更改账户密码、设置主机名 – 树莓派在你的本地无线或有线网络上使用的名称 – 并更改一系列其他设置。不过，其中大多数设置都不需要更改。点击“显示（Display）”标签页进入下一个类别。在这里，你可以根据需要更改屏幕显示设置，以适应你的电视机或显示器。


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_50_0.png)


    ## 更多详情


    这个简要的概述只是为了带你了解该工具。关于其每个设置的更详细信息，可以在[附录 E，树莓派配置工具]中找到。


    “接口（Interface）”标签页包含一系列设置，所有设置默认都是禁用的。只有当你添加新硬件（例如，树莓派摄像头模块）时，才应该更改这些设置。此规则的例外是：SSH，它启用“安全外壳”并让你使用
    SSH 客户端从网络上的另一台计算机登录到树莓派；VNC，它启用“虚拟网络计算机”并让你使用 VNC 客户端从网络上的另一台计算机查看并控制树莓派 OS 桌面；以及
    Remote GPIO，它让你从网络上的另一台计算机控制树莓派的 GPIO 引脚 – 你将在**第 6 章，使用 Scratch 和 Python 进行物理计算**中学习到这些。


    点击“性能（Performance）”标签页查看第四类设置。在这里，你可以设置树莓派图形处理器（GPU）使用的内存量，对于某些模型，可以通过被称为*超频（overclocking）*的过程提高树莓派的性能。尽管如此，除非你知道需要更改它们，否则最好保持这些设置。


    最后，点击“本地化（Localisation）”标签页查看最后一个类别。在这里，你可以更改区域设置（它控制着树莓派 OS 使用的语言和数字显示方式）、更改时区、更改键盘布局并为
    WiFi 设置国家。现在，只需点击“取消（Cancel）”在不进行任何更改的情况下关闭工具。


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_50_1.png)


    ## 警告！


    不同国家对 WiFi 无电电设备使用的频率有不同的规定。将树莓派配置工具中的 WiFi 国家设置为与你所在地不同的国家，可能会导致它难以连接到你的网络，甚至可能在无线电许可法下属于违法
    – 所以不要这样做！


    ## 关机


    现在你已经探索了树莓派 OS 桌面，是时候学习一项非常重要的技能了：安全地关闭你的树莓派。像任何计算机一样，树莓派将你正在工作的文件保存在易性内存中 – 系统关闭时该内存会被清空。对于你创建的文档，只需依次保存每个
    – 这会将文件从易性内存移动到非易失性内存 microSD 卡 – 以确保你不会丢失任何内容。


    你正在工作的文档并不是唯一打开的文件，树莓派 OS 在运行时会保持许多文件打开，在这些文件仍处于打开时拔掉树莓派的电源线可能会导致操作系统损坏，从而导致重新安装。


    为了防止这种情况发生，你需要确保告诉树莓派 OS 保存其所有文件并准备好断电 – 这一过程被称为关闭操作系统。


    点击桌面左角的树莓派图标，然后点击“关机（Shutdown）”。将弹出一个带有三个选项的窗口（图 3-22）：关机（Shutdown）、重启（Reboot）和注销（Logout）。关机是你最常使用的选项：点击此将告诉树莓派
    OS 关闭所有打开的软件和文件，然后关闭树莓派。一旦屏幕变黑，等待几秒钟直到树莓派上闪烁的绿灯熄灭；就可以安全地关闭电源了。


    要重新开启树莓派，只需重新连接电源线，或切换墙上插座的电源。


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_51_0.png)


    图 3-22：关闭树莓派


