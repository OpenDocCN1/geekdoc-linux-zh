  mdcn: '


    # 电子元件


    GPIO 引脚只是你开始进行物理计算所需内容的一部分；另一部分是由电子元件组成的，即你通过 GPIO 引脚控制的设备。市上有成千上万种不同的元件，但大多数
    GPIO 项目都是使用以下常用零件制成的。


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_122_0.png)


    面包板（也称为免焊接接线板）可以让物理计算项目变得简单得多。与其使用一堆需要用电线连接的独立组件，不如面包板允许你插入组件，并通过隐藏在表面下方的金属导轨进行连接。许多面包板还包含电源分配区域，这使得构建电路变得容易。开始物理计算并不需要面包板，但它确实很有帮助。


    跳线线（也称为跳线导）用于将组件连接到你的树莓派，或者在不使用面包板的情况下将组件之间相互连接。它们有三种规格：公对母（M2F），你需要它将面包板连接到 GPIO
    引脚；母对母（F2F），在不使用面包板时可用于连接单个组件之间；以及公对公（M2M），用于连接面包板的某部分到另一部分。根据你的项目，你可能需要这三种类型的跳线；如果你使用面包板，通常只需要
    M2F 和 M2M 跳线即可。


    按钮开关（也称为瞬时开关）是你用于控制游戏机时会使用的开关类型。按钮通常有两个或四个引脚——这两种类型都可以与树莓派配合使用——按钮是一种输入设备：你可以让你的程序监控它是否被按下，然后执行相应任务。另一种常见的开关类型是自锁开关；按钮仅在你按住它时有效，而自锁开关（如你在灯光开关上找到的那种）在你拨动时激活，然后一直保持激活状态直到你再次拨动它。


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_123_0.png)


    光发光二极管（LED）是一种输出设备；你可以直接从程序中控制它。LED 开启时会发光，你可以在家里到处看到它们，从能提醒你洗衣机未关闭的小型 LED，到可能点亮房间的大型
    LED。LED 有多种形状、颜色和大小，但并不是所有的都适用于树莓派；请避免任何标称设计用于 5 V 或 12 V 电源的元件。


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_123_1.png)


    电阻是控制电流流的元件，其值使用欧姆（Ω）单位进行测量。欧姆数越高，提供的电阻越大。对于树莓派物理计算项目，它们的常用用途是保护 LED 免受过大电流损坏自身或你的树莓派；为此，你需要额定为
    330 Ω 的电阻，许多电子供应商销售包含多种不同值的方便装包，以提供更大的灵活性。


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_123_2.png)


    压电蜂鸣器（通常称为蜂鸣器或声器）是另一种输出设备。LED 产生光，而蜂鸣器产生噪音——实际上是嗡嗡声。在蜂鸣器的塑料外壳内部有一对金属片；激活时，这些金属片相互震动产生蜂鸣声。蜂鸣器有两种类型：有源蜂鸣器和无源蜂鸣器。确保购买有源蜂鸣器，因为它们最容易使用。


    其他常见的电子元件包括电机（在连接到树莓派之前需要特殊的控制板）、检测运动的红外传感器、可预测天气的温湿度传感器，以及光敏电阻（LDR）——一种通过检测光线工作的反
    LED 输入设备。世界各地的卖家提供用于树莓派物理计算的元件，可以是单个零件，也可以包含入门所需的所有套件。要寻找卖家，请访问 rpf.io/products，点击
    Raspberry Pi 4，你将获得所在国家或地区的树莓派合作伙伴在线商店（授权经销商）列表。


    为了完成本章中的项目，你至少应该：


    - 3 个 LED：红色、绿色和黄色或琥珀色

    - 2 个 按钮开关

    - 1 个有源蜂鸣器

    - 公对母（M2F）和母对母（F2F）跳线

    - 可选：面包板和公对公（M2M）跳线


    # 读取电阻色环代码


    电阻的值范围很广，从零电阻版本（实际上只是一段导线）到像腿一样大的高电阻版本都有。然而，很少有电阻在其表面印有数字；相反，它们使用打印在电阻体周围的彩色色环或色带形式的特殊代码。


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_125.png)


    | 第一色环 | 第二色环 | 乘数 | 容差 |

    | :--- | :--- | :--- | :--- |

    | 黑色 | 0 | x1 | - |

    | 棕色 | 1 | x10 | ±1% |

    | 红色 | 2 | x100 | ±2% |

    | 橙色 | 3 | x1,000 | ±2% |

    | 黄色 | 4 | x10,000 | ±1% |

    | 绿色 | 5 | x100,000 | ±0.5% |

    | 蓝色 | 6 | x1,000,000 | ±0.2% |

    | 紫色 | 7 | x10,000,000 | ±0.1% |

    | 灰色 | 8 | x100,000,000 | ±0.05% |

    | 白色 | 9 | x1,000,000,000 | - |

    | 金色 | - | x0.65 | ±5% |

    | 银色 | - | x0.01 | ±10% |

    | 无 | - | - | ±20% |


    要读取电阻的值，从第一个色环开始。第二个色环提供下一个数字。第三个色环告诉你需要添加几个零（乘数）。第四个色环告诉你容差，即实际电阻与额定值之间的偏差范围。


    '
