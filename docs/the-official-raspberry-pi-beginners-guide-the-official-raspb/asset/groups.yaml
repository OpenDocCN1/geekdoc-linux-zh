    sense.clear()\n```\n\n在程序开始包含 `sense.clear()` 是一个好主意，以防 Sense HAT 的显示仍显示上一个程序的内容。\n\
    \n要获取压力传感器的读数，输入：\n\n```\npressure = sense.get_pressure()\nprint(pressure)\n```\n\
    \n点击 Run（运行），你会在 Thonny 窗口底部看到一个数字。这是气压传感器检测到的气压，单位为毫巴（**图 20**）。向 Sense HAT 吹气（或向上移动模拟器的\
    \ Pressure 滑块）并再次点击 Run 图标；数字将会更高。\n\n![](img/0aff4cdab15427839fb48fd7c6f677d3_177_0.png)\n\
    \n图 20：从 Sense HAT 输出压力读数\n\n> ### 修改数值\n\n如果你正在使用 Sense HAT 模拟器，可以使用滑动块和按钮更改每个仿真传感器的值。尝试将压力传感器设置向下，然后再次点击绿色旗帜。\n\
    \n要切换到湿度传感器，删除压力模块并替换为湿度。再次运行程序，你将看到房间的当前相对湿度。同样，你可以尝试在吹气（或向上移动模拟器的 Humidity 滑块）时再次运行以更改读数（图\
    \ 18）——你的呼吸竟然很潮湿！\n\n![](img/0aff4cdab15427839fb48fd7c6f677d3_175_1.png)\n\n图\
    \ 18：显示湿度传感器读数\n\n对于温度传感器，只需删除湿度模块并替换为温度，然后再次运行程序。你将看到摄氏度的温度（**图 19**）。然而，这可能不是房间的精确温度：因为\
    \ Raspberry Pi 在运行时会产生热量，这也会加热 Sense HAT 及其传感器。\n\n![](img/0aff4cdab15427839fb48fd7c6f677d3_176_0.png)\n\
    \n图 19：显示温度传感器读数\n\n> 挑战：滚动与循环\n\n你是否可以修改程序，依次获取每个传感器的读数，将其滚动到 LED 矩阵上而不是打印到舞台区域？你是否可以让程序循环，以便持续打印当前的环境状况？\n\
    \n# 树莓派官方入门指南\n\n 惯性感知\n\n陀螺仪、加速度计和磁力计组合成了所谓的惯性测量单元（IMU）。从技术上说，这些传感器与环境传感器一样从环境中获取测量——例如，磁力计测量磁场强度——但它们通常用于\
    \ Sense HAT 本身的运动数据。IMU 是多个传感器的和；某些编程语言允许你独立获取每个传感器的读数，而另一些只会给你一个组合读数。\n\n在理解\
    \ IMU 之前，你需要了解物体是如何移动的。Sense HAT 及其吸附的 Raspberry Pi 可以沿着三个轴移动：沿 X 轴左右移动；沿 Y 轴前后移动；以及沿\
    \ Z 轴上下移动（**图 7-24**）。它还可以沿着这三个轴旋转，但它们的名称会发生变化：沿 X 轴旋转被称为 *roll*（滚滚），沿 Y 轴旋转被称为\
    \ *pitch*（俯仰），沿 Z 轴旋转被称为 *yaw*（偏航）。当你顺着短轴旋转 Sense HAT 时，你是在调整它的俯仰；沿着长轴旋转就是滚滚；在保持其平放在桌上的情况下绕着它旋转，你是在调整它的偏航。把它们想象成飞机：当飞机起飞时，它增加俯仰来爬升；当它做翻滚动作时，那实际上是沿着它的滚滚轴旋转；当它使用方向舵像汽车一样转弯而不滚滚时，那就是偏航。\n\
    \n偏航 (Yaw): Z\n\n俯仰 (Pitch): Y\n\n![](img/0aff4cdab15427839fb48fd7c6f677d3_180_0.png)\n\
    \n滚滚 (Roll): X\n\n**图 7-24：Sense HAT IMU 的空间轴**\n\n"
