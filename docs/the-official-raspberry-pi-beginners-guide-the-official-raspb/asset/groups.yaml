    # 卸载软件


    要选择软件包进行移除或卸载，请在软件包列表中找到它——这里有搜索功能，并点击其旁边的复选框取消选中。你可以一次卸载多个软件包：只需继续点击移除更多软件包。软件包旁边的图标将变为打开的盒子或一个小回收桶，以确认它将被卸载。


