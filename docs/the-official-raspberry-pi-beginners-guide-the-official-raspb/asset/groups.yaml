    \ 等于 1。在“那么”部分拖入一个“低（low）”模块并从其下拉列表中选择“2”。然后拖入“将 gpio 25 设置为输出低（set gpio to output\
    \ low）”模块。在下方拖入一个“将 gpio 设置为输出高（set gpio to output high）”模块来停止蜂鸣器。\n\n![](img/0aff4cdab15427839fb48fd7c6f677d3_144_0.png)\n\
    \n点击绿色旗帜，观察你的 LED：首先是红灯，然后是红黄双亮，然后是绿灯，然后是黄灯，最后序列再次从红灯开始。这种模式与英国交通灯使用的模式相同，如果你愿意，可以编辑序列以匹配其他国家。在“否则”部分中，让蜂鸣器鸣响\
    \ 2 秒，等待 2 秒，让红灯亮起 2 秒 \n\n```\nif pushed = 1 then\n    set gpio 25 to output\
    \ low\n    wait 2 seconds\n    set gpio 15 to output high\n    wait 2 seconds\n\
    \    set gpio 15 to output low\nelse\n    set gpio 25 to output high\n    wait\
