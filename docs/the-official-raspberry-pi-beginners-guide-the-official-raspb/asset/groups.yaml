    # GETTING HELP


    Most programs include a Help menu which has information on how to use it. If you
    ever feel lost or overwhelmed, look for the Help menu to reorient yourself.


    # The Recommended Software tool


    Although Raspberry OS comes preloaded with a wide range of software, it has not
    been vetted by the Raspberry Pi Foundation. Note that the Recommended Software
    tool needs a connection to the internet. If your Raspberry Pi is connected, click
    on the raspberry menu, move your pointer to Preferences, then click on Recommended
    Software. After a few seconds, a list of compatible software will appear (Figure
    3-19). Click on a category in the left to see software from that category, or
    click All Programs to see everything.


    If a piece of software has a tick next to it, it''s already installed on your
    Raspberry Pi. If it doesn''t, you can click the checkbox next to add it and mark
    it for installation. If you''ve made a mistake or changed your mind, just click
    again to pull the tick back.


    When you''re happy with your software selection, click the OK button to begin
