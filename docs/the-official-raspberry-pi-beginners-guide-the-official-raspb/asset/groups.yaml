    # Chapter 7


    # Physical computing with the Sense HAT


    As used on the International Space Station, the Sense HAT is a multifunctional
    add-on board for Raspberry Pi, equipped with sensors and an LED matrix display


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_151_0.png)


    raspberry Pi comes with support for a special type of add-on board called Hardware
    Attached on Top (HAT). HATs can add everything from microphones and lights to
    electronic relays and screens to Raspberry Pi, but one HAT in particular is very
    special: the Sense HAT.


    The Sense HAT was designed specially for the Astro Pi mission. A joint project
    between the Raspberry Pi Foundation, UK Space Agency, and European Space Agency,
    Astro Pi saw Raspberry Pi boards and Sense HATs carried up to the International
    Space Station aboard an Orbital Space Cygnus cargo rocket. Since safely reaching
    orbit high above the Earth, the Sense HATs – nicknamed Ed and Izzy by the astronauts
    – have been used to run code and carry out scientific experiments contributed
    by schoolchildren from across Europe.'
  - '[PAGE 152]


    While Ed and Izzy are a little far away for you to use them yourself, the same
    Sense hardware can be found here on Earth, too, at all Raspberry Pi retailers
    – and if you don''t want to buy a Sense HAT right now, you can simulate one in
    software!


    # REAL OR SIMULATED


    This chapter is best partnered with a real Sense HAT attached to a Raspberry Pi''s
    GPIO header, but anyone who doesn''t have one can skip the section titled ''Installing
    the Sense HAT'' and simply try the projects out in the Sense HAT Emulator; they''ll
    work just as well!


    # Introducing the Sense HAT


    The Sense HAT is a powerful, multifunctional add-on for Raspberry Pi. As well
    as an 8x8 matrix of 64 red, green, and blue (RGB) programmable LEDs which can
    be controlled to produce any colour from a range of millions, the Sense HAT includes
    a five-way joystick controller and six on-board sensors.


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_152_0.png)'
- md: '

    Gyroscope: Used to sense changes in angle over time, technically known as angular
    velocity, by keeping track of the Earth''s gravity field – the force which pulls
    down towards the centre of the planet. Put simply, the gyroscopic sensor can tell
    you when you rotate the Sense HAT relative to the surface of the Earth and how
    quickly it''s rotating.


    Accelerometer: Similar to the gyroscope sensor, but rather than monitoring an
    angle relative to the Earth''s it measures acceleration force in multiple directions.
    Combined, readings (data) from the two sensors can tell you where a Sense HAT
    is pointing and how it''s moving.


    Magnetometer: Measures the strength of a magnetic field, and is another sensor
    which can help track the Sense HAT''s movements: by measuring the Earth''s natural
    magnetic field, the magnetometer can figure out the direction of magnetic north.
    The same sensor can also be used to detect metallic objects, and even electrical
    fields. All three of these sensors are built into a single chip, labelled ''ACCEL/GYRO/MAG''
    on the Sense HAT''s circuit board.


    Humidity sensor: Measures the amount of water vapor in the air, known as the relative
    humidity. Relative humidity can range from 0%, for there no water at all, to 100%,
    for the air being completely saturated. Humidity data can be detected when it
    might be about to rain!


    Barometric pressure sensor: also known as the barometer, it measures air pressure.
    Although most people will be familiar with barometric pressure from the weather
    forecast, the barometer has a second secret: it can track when you''re climbing
    up or down a mountain, as the air gets thinner and lower the pressure the further
    you get from Earth''s sea level.


    Temperature sensor: Measures how hot or cold the surrounding environment, though
    it is also affected by how hot or cold the Sense HAT is: if you''re using a case,
    you may find your readings higher than expect. The Sense HAT doesn''t have a separate
    temperature sensor; instead, it uses temperature sensors built into the humidity
    and barometric pressure sensors. A program can use one or both of these sensors;
    it''s up to you.


    # SENSE HAT ON RASPBERRY PI 400


    The Sense HAT is fully compatible with Raspberry Pi 400, and can be inserted directly
    into the GPIO header on the back. Doing so, means, that the LEDs will be facing
    away from you and the board will be oriented upside-down.


    To fix this, you need a GPIO extension cable or board. Compatible extensions include
    the Black HAT3r from Pimoroni, you can use the Sense HAT with the Black Hack3r
    board itself, or simply use the included 40-pin ribbon cable as an extension.
    Always check the manufacturer''s instructions, though to be sure you''re connecting
    the cable and Sense HAT the right way around!


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_153_0.png)


    # Installing the Sense HAT


    If you have a physical Sense HAT, start by unpacking it and making sure you have
    all the pieces: you should have the Sense HAT itself, four metal or plastic pillars
    known as spacers, and eight screws. You may also have metal pins in a black plastic
    strip, like the GPIO pins on Raspberry Pi; if so, push this pin-side-up through
    the bottom of the Sense HAT until you hear a click.


    The spacers are designed to stop the Sense HAT from bending and flexing as you
    use the joystick. While the Sense HAT will work without them being installed,
    using them will protect your Sense HAT, Raspberry Pi, and GPIO header from being
    damaged.


    > WARNING!

    Hardware Attached on Top (HAT) modules should only ever be plugged into and removed
    from the GPIO header while your Raspberry Pi switch is off and disconnected from
    its power supply. Always be careful to keep the HAT flat when installing it, and
    double-check it is lined up with the GPIO header pins before pushing it down.


    Install the spacers by pushing four of the screws from underneath the bottom of
    Raspberry Pi through the four mounting holes at each corner, twist the spacers
    onto the screws. Push the Sense HAT down onto Raspberry Pi''s GPIO header, making
    sure to line it up properly with the pins underneath and to keep it flat as possible.
    Finally, screw the final four screws through the mounting holes on the Sense HAT
    and into the spacers you installed earlier. If it''s installed properly, the Sense
    HAT should be flat and level and shouldn''t bend or wobble as you push on its
    joystick.


    Plug the power back into your Raspberry Pi, and you''ll see the LEDs on the Sense
    HAT light up in a rainbow pattern (Figure 7-1), then switch off again. Your Sense
    HAT is now installed!


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_155_0.png)


    **Figure 7-1:** A rainbow pattern appears when the power is first turned on


    If you want to remove the Sense HAT again, simply undo the top screws, lift the
    HAT off – being careful not to bend the pins on the GPIO header, as the HAT holds
    on quite tightly (you may need to prise it with a small screwdriver) – then remove
    the spacers from Raspberry Pi.


    # Hello, Sense HAT!


    As with all programming projects, there''s an obvious place to start with the
    Sense HAT: scrolling a welcome message across its LED display. If you''re using
    the Sense HAT emulator, load it now by clicking on the Raspberry Pi OS menu icon,
    choosing the Programming category, and clicking on Sense HAT Emulator.


    > PROGRAMMING EXPERIENCE

    This chapter assumes experience with Scratch 3 or Python and the Thornny integrated
    development environment (IDE), depending on if you''re working through the Scratch
    or Python.


    # Greetings from Scratch


    Load Scratch 3 from the Raspberry Pi OS. Click the Add Extension button at the
    bottom-left of the Scratch window. This loads the blocks you need to control the
    various features of the Sense HAT, including its LED display.


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_156_0.png)

    Figure 7-2: Adding the Raspberry Pi HAT extension


    With dragging a when clicked block onto the script area, then drag a display text
    block directly underneath it. Edit the text so that the block reads Hello, World!


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_156_1.png)


    Click the green flag on the stage area and watch your Sense HAT or the Sense HAT
    emulator: the message will scroll slowly across Sense HAT, lighting up the LED
    pixels to form each letter in turn (Figure 7-3 overleaf). Congratulations: your
    program''s success!


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_157_0.png)

    Figure 7-3: Your message scrolls across the LED matrix


    You can scroll a simple message, it''s time to take a look at controlling how
    that message is displayed As well as being able to modify the message to be displayed,
    you can alter the rotation – change how the message is displayed on the Sense
    HAT. Drag a set rotation to 0 degrees block from the blocks palette and insert
    it below when clicked and above display text Hello, World!, then click on the
    arrow next to 0 and change it to 90. You''ll see the same message as before, rather
    than scrolling left-to-right it will scroll bottom-to-top (Figure 7-4) – you''ll
    need to turn your head, or the Sense HAT, to read it!


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_158_0.png)

    Figure 7-4: This time the message scrolls vertically


    Now change the rotation back to 0, then drag a set colour block between rotation
    to 0 degrees and display text Hello, World! Click on the colour at the end of
    the block to bring up Scratch''s colour picker and find a nice bright yellow colour,
    then click the green flag to see how your program''s output has changed (Figure
    7-5).


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_158_1.png)

    Figure 7-5: Changing the colour of the text

