    -   陀螺仪：用于感应随时间变化的角度（技术上称为角速度），它通过跟踪地球引力场（即向行星中心拉的力）来实现。简单来说，陀螺仪传感器可以告诉你当你相对于地球表面旋转
    Sense HAT 时何时旋转，以及它旋转的速度有多快。


    -   加速度计：与陀螺仪传感器类似，但它不是监测相对于地球的角度，而是测量多个方向上的加速度力。将这两个传感器的读数（数据）相结合，可以告诉你 Sense
    HAT 指向哪个方向以及它是如何移动的。


    -   磁力计：测量磁场强度，另一种可以帮助跟踪 Sense HAT 移动的传感器：通过测量地球的自然磁场，磁力计可以确定磁北的方向。该款传感器还可以用于检测金属物体，甚至是电场。这三个传感器都集成在一个单一芯片中，在
    Sense HAT 的电路板上标记为“ACCEL/GYRO/MAG”。


    -   湿度传感器：测量空气中的水蒸气含量，即相对湿度。相对湿度的范围从 0%（完全没有水）到 100%（空气完全饱和）。在可能要下雨时，可以检测到湿度数据！


    -   气压传感器：也称为气压计，测量空气压力。虽然大多数人对天气预报中的气压很熟悉，但气压计还有一个隐藏秘密：它可以跟踪你上山或下山的过程，因为距离地球海平面越远，空气越稀薄，压力越低。


    -   温度传感器：测量周围环境的热热，但也受到 Sense HAT 冷热的影响：如果你使用了外壳，可能会发现读数比预期高。Sense HAT 并没有独立的温度传感器；而是使用内置在湿度传感器和气压传感器中的温度传感器。程序可以使用其中一个或两个传感器；这取决于你的需求。


    # 在树莓派 400 上使用 Sense HAT


    Sense HAT 完全兼容树莓派 400，并可以直接插入背部的 GPIO 引脚。。这样做意味着 LED 将背对准你，且主板的朝向将是倒置放置的。


    为了解决这个问题，你需要一个 GPIO 扩展线或扩展板。兼容的扩展设备包括 Pimoroni 的 Black HAT3r，你可以将 Sense HAT 与
    Black HAT3r 板本身配合，或者直接使用附带的 40 针线作为扩展。不过，请务必检查制造商的说明，以确保电缆和 Sense HAT 的连接方向是正确的！


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_153_0.png)


    # 安装 Sense HAT


    如果你有一个物理 Sense HAT，首先将其拆封，并确保你拥有所有组件：你应该有 Sense HAT 本身、四个被称为垫柱的金属或塑料支柱，以及八颗螺丝。你可能还有一排在黑色塑料条上的金属针，就像树莓派上的
    GPIO 引脚；如果是的话，将此针脚朝向上插入 Sense HAT 的底部，直到听到“咔”的一声。


    垫柱的设计是为了防止在使用摇杆时 Sense HAT 发生弯曲和变形。虽然不安装垫柱 Sense HAT 也能工作，但使用它们可以保护你的 Sense HAT、树莓派和
    GPIO 引脚不受损坏。


    > 警告！

    硬件扩展层（HAT）模块应仅在树莓派开关关闭并断开电源的情况下插入或拔出 GPIO 引脚。安装时务必保持 HAT 平整，并在向下推之前双重检查它是否与 GPIO
    引脚对齐。


    通过将四颗螺丝从树莓派底部穿过四个角落的安装孔来安装垫柱，然后将垫柱拧在螺丝上。将 Sense HAT 推到树莓派的 GPIO 引脚上，确保它与下方的引脚正确对齐并保持尽可能平整。最后，将最后四颗螺丝穿过
    Sense HAT 上的安装孔并拧入之前安装的垫柱中。如果安装得当，Sense HAT 应该是平整水平的，并且在你按下摇杆时不会发生弯曲或晃动。


    为树莓派接上电源，你会看到 Sense HAT 上的 LED 以彩虹图案亮起（图 7-1），然后再次关闭。你的 Sense HAT 现在安装好了！


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_155_0.png)


    **图 7-1：** 首次通电时会出现彩虹图案


    如果你想再次移除 Sense HAT，只需松开顶部的螺丝，取下 HAT——小心不要弯曲 GPIO 引脚上的引脚，因为 HAT 固定得非常紧（你可能需要用小螺丝刀撬开），然后从树莓派上移除垫柱。


    # Hello, Sense HAT!


    与所有的编程项目一样，Sense HAT 有一个明显的起点：让 Sense HAT 显示欢迎信息。如果你正在使用 Sense HAT 模拟器，通过点击树莓派操作系统图标、选择编程（Programming）并点击
    Sense HAT 来加载。


    > 编程经验

    本章节假设你熟悉 Scratch 3 或 Python 及其集成开发环境（IDE）。


    从树莓派操作系统加载 Scratch 3。点击窗口底部的“扩展”（Extension）按钮。这将加载控制 Sense HAT 各种功能所需的块。


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_156_0.png)

    图 7-2：添加树莓派 扩展


    将“点击时”（when clicked）块拖到脚本区域，然后在下方拖入“显示文本”（display text）块。编辑文本使其显示“Hello, World!”。


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_156_1.png)


    点击舞台上的绿色旗帜，观察你的 Sense HAT 或 Sense HAT 模拟器：信息将缓慢滚动整个 Sense HAT，逐个点亮字母（图 7-3）。恭喜：你的程序成功了！


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_157_0.png)

    图 7-3：信息在 LED 矩阵上滚动


    你可以滚动简单的消息，现在是查看如何控制消息显示的方式了。除了可以修改消息，你还可以更改旋转——更改消息在 Sense HAT 上的显示。从块面板拖出一个“旋转为
    0 度”（set rotation to 0 degrees）块，将其插入“点击时”和“显示文本 Hello, World!”之间，然后点击 0 旁边的箭头改为
    90。你会看到与之前相同的消息，不是从左向右滚动，而是从下向上滚动（图 7-4）——你需要转头或转动 Sense HAT 才能阅读！


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_158_0.png)

    图 7-4：这次消息是垂直滚动


    现在将旋转改回 0，然后在“旋转为 0 度”和“显示文本 Hello, World!”之间拖入一个“设置颜色”（set colour）块。点击块末尾的颜色调出
    Scratch 的颜色选择器并找到一个漂亮的亮黄色，然后点击绿色旗帜查看你的程序输出发生了什么变化（图 7-5）。


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_158_1.png)

    图 7-5：更改文本颜色

