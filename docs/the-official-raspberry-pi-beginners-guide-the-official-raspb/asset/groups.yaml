    micro-HDMI port, then use a suitable cable to connect the adapter to the monitor.
    If your TV has only a composite video or SCART input, you can purchase 3.5 mm
    tip-ring-ring-sleeve (TRRS) adapter cables and composite-to-SCART adapters which
    connect to the 3.5 mm AV jack.


    # Connecting a network cable (optional)


    To connect your Raspberry Pi to a wired network, take a network cable – known
    as an Ethernet cable – and push it into Raspberry Pi''s Ethernet port, with the
    plastic clip facing downwards, until you hear a click. If you need to remove the
    cable, just squeeze the plastic clip inwards towards the plug and gently slide
    the cable free again.


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_28_0.png)


    The other end of your network cable should be connected to any free port on your
    network hub, switch, or router in the same way.


    # Connecting a power supply


    Connecting Raspberry Pi to a power supply is the very last step in the hardware
    setup process, and it''s one you should do only when you''re ready to set up its
    software: Raspberry Pi does not have a power switch and will turn on as soon as
    it is connected to a live power supply.


    First, connect the USB Type-C end of the power supply cable to the USB Type-C
    power connector on Raspberry Pi. It can go in either way around and should slide
    home gently. If your power supply has a detachable cable, make sure the other
    end is plugged into the body of the power supply.


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_29_0.png)


    Finally, connect the power supply to a mains socket and switch the socket on,
    your Raspberry Pi will immediately start running.


    Congratulations: you have put your Raspberry Pi together!


