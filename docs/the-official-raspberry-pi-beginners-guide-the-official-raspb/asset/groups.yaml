    服务器的数据库。一旦软件安装完成，你可以通过点击树莓图标加载菜单并找到该软件包的类别来使用它。请注意，该类别并不与“添加/删除软件”工具中的类别完全相同，有些软件在菜单中根本没有条目；这些被称为“命令行软件”，需要在终端（Terminal）中运行。有关命令行和终端的更多信息，请参阅附录
