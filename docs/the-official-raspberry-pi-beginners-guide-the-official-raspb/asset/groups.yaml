    \ connect to a wireless network, click Skip.\n\n![](img/0aff4cdab15427839fb48fd7c6f677d3_38_0.png)\n\
    \n**Figure 3-5:** Choosing a wireless network\n\n# WIRELESS NETWORKING\n\nBuilt-in\
    \ wireless networking is only available on the Raspberry Pi 3, Pi 4, and Pi Zero\
    \ families. If you want to use another model of Raspberry Pi with a wireless network,\
    \ you'll need a USB WiFi adapter.\n\nThe next screen will allow you to check for\
    \ install updates for Raspberry Pi OS and the other software on Raspberry Pi (**Figure\
    \ 3-6**). Raspberry Pi OS is regularly updated to fix bugs, add new features,\
    \ and improve performance. To install these updates, click Next; otherwise, click\
    \ Skip. Downloading the updates can take several minutes, be patient. When the\
    \ updates are installed, a window saying 'System is up to date' will appear, click\
    \ the OK button.\n\n![](img/0aff4cdab15427839fb48fd7c6f677d3_38_1.png)\n\n**Figure\
    \ 3-6:** Checking for updates\n\nThe final screen of the Welcome Wizard (Figure\
    \ 3-7) has a simple task to do: certain changes made will only take effect when\
    \ you restart Raspberry Pi (a process also known as rebooting). If prompted to\
    \ do so, click the Restart button and Raspberry Pi will restart. This time the\
    \ Welcome Wizard won't appear, its job is done, and your Raspberry Pi is ready\
    \ to use.\n\n![](img/0aff4cdab15427839fb48fd7c6f677d3_39_0.png)\n\nFigure 3-7:\
    \ Restarting Raspberry Pi\n\n# Navigating the desktop\n\nThe version of Raspberry\
    \ Pi OS installed on all Raspberry Pi boards is properly known as 'Raspberry Pi\
    \ OS with desktop', referring to its main graphical interface (Figure 3-8). The\
    \ bulk of this desktop is taken up with a picture, known as the wallpaper (A in\
    \ Figure 3-8), on top of which the programs you will run appear. At the top of\
    \ the desktop is a taskbar (B), which allows you to actually load each of the\
    \ programs; these are indicated by tasks (C) in the taskbar.\n\n![](img/0aff4cdab15427839fb48fd7c6f677d3_39_1.png)\n\
    \nFigure 3-8: The Raspberry Pi OS desktop\n\n# THE OFFICIAL RASPBERRY PI BEGINNER'S\
    \ GUIDE\n\n- A Wallpaper\n- B Taskbar\n- C Task\n- D System Tray\n- E Media Edge\n\
    - F Bluetooth Icon\n- G Network Icon\n- H Volume Icon\n- I Clock\n- J Launcher\n\
    - K Menu (or Raspberry)\n- L Lastbasket Icon\n- M Removable Drive Icon\n- N Window\
    \ Titlebar\n- O Minimise\n- P Maximize\n- Q Close\n\nThe right-hand side of the\
    \ menu houses the system (D). If you have any removable storage, such as USB memory\
    \ sticks, connected to Raspberry Pi you'll see an eject symbol (E); clicking on\
    \ will allow you to eject and remove them. On the far right is the clock (I);\
    \ click on to bring up a digital calendar (Figure 3-9). \n\n**Figure 3-9:** The\
    \ digital calendar\n\n![](img/0aff4cdab15427839fb48fd7c6f677d3_40_0.png)\n\nNext\
    \ to a speaker icon (H); click on it the left mouse button to adjust Raspberry\
    \ Pi's audio volume, or click the right mouse button to choose which output Pi\
    \ should use. If there is a network icon (G); if you're connected to a wireless\
    \ network you'll see the signal strength displayed as series of bars, while if\
    \ you're connected to a wired network you'll just see two arrows. Clicking the\
    \ network icon will bring up a list of nearby networks (Figure 3-10), and clicking\
    \ on the Bluetooth icon (F) next to that will allow you to connect to a nearby\
    \ device.\n\n![](img/0aff4cdab15427839fb48fd7c6f677d3_40_1.png)\n\n**Figure 3-10:**\
    \ Listing nearby networks\n\nThe left-hand side of the menu houses the launcher\
    \ (J), which is where you'll find the programs installed alongside Raspberry Pi.\
    \ Some of these are visible as shortcut icons; others are hidden in the menu,\
    \ which you can bring up by clicking the raspberry icon to the far left (Figure\
    \ 3-11).\n\nFigure 3-11: The Raspberry Pi OS menu\n\nThe programs in the menu\
    \ are split into categories, the names of which tell you what to expect: the Programming\
    \ category, for example, contains software designed to help you write your own\
    \ programs – while Games will help you. Not all of the programs will be detailed\
    \ in this guide; feel free to experiment with them to learn more.\n\n# Using your\
    \ Pi\n\nTo practise using Raspberry Pi, start by loading the Chromium browser:\
    \ click on the raspberry icon at the top-left to bring up the menu, move your\
    \ mouse pointer to select the Internet category, and click on Chromium Browser\
    \ to load (Figure 3-12).\n\n![](img/0aff4cdab15427839fb48fd7c6f677d3_41_0.png)\n\
    \nFigure 3-12: The Chromium web browser\n\nIf you've used Google's Chrome browser\
    \ on another computer, Chromium will be immediately familiar. As a web browser,\
    \ Chromium lets you visit websites, play videos, and even communicate with people\
    \ all over the world on forums and chat sites.\n\nStarting Chromium by maximising\
    \ its window so it takes up more of the screen; find the icons at the top-right\
    \ of the Chromium window titlebar (N) and click on the middle up-arrow icon (P).\
    \ To the left of maximise is minimise (O), which will hide a window until you\
    \ click on it in the taskbar at the top of the screen. The cross to the right\
    \ of maximise is close (Q), and does exactly what you'd expect: closes the window.\n\
    \n# CLOSE AND SAVE\n\nClosing a window before you've saved any work you've done\
    \ is a bad idea, while many programs will warn you to save when you click the\
    \ close button, others won't.\n\n![](img/0aff4cdab15427839fb48fd7c6f677d3_42_0.png)\n\
    \nClick in the address bar at the top of the Chromium window – the big white bar\
    \ with a magnifying glass on the left-hand side – and type raspberrypi.org, then\
    \ press the ENTER key on your keyboard. The Raspberry Pi website will load (Figure\
    \ 3-13). You can also type searches into the address bar: by searching for 'Raspberry\
    \ Pi', 'Raspberry Pi OS', or 'Educational Computing'.\n\n![](img/0aff4cdab15427839fb48fd7c6f677d3_42_1.png)\n\
    \nFigure 3-13: Loading the Raspberry Pi website in Chromium\n\nThe first time\
    \ you load Chromium, it may bring up several tabs along the top of the window.\
    \ To switch to a different tab, click on it; to close a tab without closing Chromium\
    \ itself, click the cross on the righthand edge of the tab you want to close.\
    \ To open a new tab, which is a handy way of having multiple websites open without\
    \ having to juggle windows, either click on the tab button to the right of the\
    \ last tab in the list, or hold down the CTRL key on the keyboard and press T\
    \ before letting go of CTRL. When you're finished with Chromium, click the close\
    \ button at the top-right of the window.\n\n# The File Manager\n\nFiles you save\
    \ – e.g. programs, videos, images – all go into your home directory. To see the\
    \ home directory, click on the raspberry icon to bring up the menu, move the mouse\
    \ pointer to select Accessories, then click on File Manager to load it (Figure\
    \ 3-14).\n\n![](img/0aff4cdab15427839fb48fd7c6f677d3_43_0.png)\n\nThe File Manager\
    \ lets you browse the files and folders, also known as directories, on Raspberry\
    \ Pi’s microSD, as well as on any removable storage devices – like USB flash drives\
    \ – you connect to Raspberry Pi’s USB ports. When you first open it, it automatically\
    \ goes to your home directory. Here you’ll find a series of other folders, such\
    \ as directories, which are arranged in categories. The main subdirectories are:\n\
    \n- Books: This contains digital copies of books, magazines, and other publications\
    \ from Raspberry Pi Press, including a copy of this Beginner’s Guide. You can\
    \ read these, and download more, with the Bookshelf application; find it in the\
    \ Help section of the menu.\n- Desktop: This folder is what you see when you first\
    \ load Raspberry Pi OS; if you save a file in here it will appear on the desktop,\
    \ making it easy to find and load.\n- Documents: Home is for most of the files\
    \ you’ll create, from short stories to recipes.\n- Downloads: When you download\
    \ a file from the internet using the Chromium web browser, it will be automatically\
    \ saved in Downloads.\n- Music: Any music you create or put on Raspberry Pi can\
    \ be stored here.\n- Pictures: This folder is specifically for pictures, known\
    \ in technical terms as image files.\n- Public: While most of your files are private,\
    \ anything you put in Public will be available to other users of Raspberry Pi,\
    \ even if they have their own username and password.\n"
