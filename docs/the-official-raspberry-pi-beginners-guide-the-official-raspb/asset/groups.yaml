  - '[PAGE 85]


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_85_0.png)


    # CHALLENGE: CUSTOM ROUTINE


    Can you create your own synchronised swimming routine using loops? What would
    you need to change if you wanted more swimmers, or fewer swimmers? Can you add
    multiple swimming routines which can be triggered by different keys on the keyboard?


    # Project 3: Arch Game


    Now you''re getting to be a bit of an expert at Scratch, it''s time to work on
    something a little more challenging: a game of archery, where the player has to
    hit a target with a randomly bowing and arrow.


    > ONLINE PROJECT

    This project is also available at rpi.io/archery


    Start by opening the Chromium Web Browser and typing rpi.io/p/en/archery-go followed
    by the ENTER key. The resources for the game download as a zip file, so you''ll
    need to unzip it (right-click and select Extract). Switch back to Scratch and
    click on the File menu followed by ''Load'''
  - '[PAGE 86]


    from your computer''. Click on ArcheryResources.sb3 followed by the Open button.
    You''ll be asked if you want to replace the contents of your current project:
    if you haven''t saved your changes, click Cancel and save them, otherwise click
    OK.


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_86_0.png)


