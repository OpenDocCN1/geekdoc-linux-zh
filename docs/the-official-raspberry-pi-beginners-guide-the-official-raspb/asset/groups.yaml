- md: "\nStart a new project in Thonny and save it as Reaction Game. You're going\
    \ to be using the LED and button functions from the GPIO Zero library, and the\
    \ sleep function from the time library. Rather than importing the two GPIO Zero\
    \ functions on two separate lines, though, you can save time and import them together\
    \ with a comma symbol (,) to separate them. Type the following in the script area:\n\
    \n```\nfrom gpiozero import LED, Button\nfrom time import sleep\n```\n\nAs before,\
    \ you'll need to tell GPIO Zero which pins the two buttons and the LED are connected\
    \ to. Type the following:\n\n```\nled = LED(4)\nright_button = Button(15)\nleft_button\
    \ = Button(14)\n```\n\nNow add instructions to turn the LED on and off, so you\
    \ can check it's working correctly:\n\n```\nled.on()\nsleep(5)\nled.off()\n```\n\
    \nClick the Run button: the LED will turn on for five seconds, then turn off and\
    \ the program will quit. For the purposes of a reaction game, though, having the\
    \ LED go off after exactly 5 seconds every time is a predictable bit. Add the\
    \ following below the line from import sleep:\n\n```\nfrom random import uniform\n\
    ```\n\nThe random library, as its name suggests, lets you generate random numbers\
    \ (here with a uniform distribution - see rpf.io/uniform). Find the line sleep(5)\
    \ and change it to read:\n\n```\nsleep(uniform(5, 10))\n```\n\nClick the Run button\
    \ again: this time the LED will stay for a random number of seconds between 5\
    \ and 10. Count to see how long it takes for the LED to go off, then click the\
    \ Run button a few more times: you'll see the time is different for each run,\
    \ making the program less predictable.\n\nTo turn the buttons into triggers for\
    \ each player, you'll need to add a function. Go to the bottom of your program\
    \ and type the following:\n\n```\ndef pressed(button):\n    print(str(button.pin.number)\
    \ + \" won the game\")\n```\n\nRemember that Python uses indentation to know which\
    \ lines are part of your function; Thonny will automatically indent the second\
    \ line for you. Finally, add two lines to detect the players pressing the buttons\
    \ – remembering that they must not be indented, or Python will treat them as part\
    \ of your function.\n\n```\nright_button.when_pressed = pressed\nleft_button.when_pressed\
    \ = pressed\n```\n\nRun your program, and try press one of the two buttons as\
    \ soon as the LED goes out. You'll see a message for the first button to be printed\
    \ to the Python shell at the bottom of the Thonny window. Unfortunately, you'll\
    \ also see messages for each time button is pushed – and they use the pin number\
    \ rather than a friendly name for the button.\nTo fix that, start by asking the\
    \ players for their names. Underneath the line from random import uniform, you\
    \ type the following:\n\n```\nleft_name = input(\"Left player name is \")\nright_name\
    \ = input(\"Right player name is\")\n```\n\nGo back to your function and replace\
    \ the line print(str(button.pin.number) + \"won the game\") with:\n\n```\nif button.pin.number\
    \ == 14:\n    print(left_name + \" won the game\")\nelse:\n    print(right_name\
    \ + \" won the game\")\n```\n\nClick the Run button, then type the names of both\
    \ players in the Python shell. When you press the button, remembering to do it\
    \ as quickly as you can after the LED goes out, you'll see that the player name\
    \ is printed instead of the pin number.\nTo fix the problem of all button presses\
    \ being reported as having won, you'll need to add a new function from the sys\
    \ – short for system – library: exit. After the last import line, type the following:\n\
    \n```\nfrom os import _exit\n```\n\nThen at the end of your function, under the\
    \ line print(right_name + \" won the game\"), type the following:\n\n```\n_exit(0)\n\
    ```\n\nThe indentation is important here: _exit(0) should be indented by four\
    \ spaces, lining up with else: two lines above it and if two lines above that.\
    \ This instruction tells Python to stop the program after the first button is\
    \ pressed, meaning the player whose button is pressed won't get any reward for\
    \ losing!\n\nYour finished program should look like this:\n\n```\nfrom gpiozero\
    \ import LED, Button\nfrom time import sleep\nfrom random import uniform\nfrom\
    \ os import _exit\n\nleft_name = input(\"Left player name is \")\nright_name =\
    \ input(\"Right player name is\")\n\nled = LED(4)\nright_button = Button(15)\n\
    left_button = Button(14)\n\ndef pressed(button):\n    if button.pin.number ==\
    \ 14:\n        print(left_name + \" won the game\")\n    else:\n        print(right_name\
    \ + \" won the game\")\n    _exit(0)\n\nright_button.when_pressed = pressed\n\
    left_button.when_pressed = pressed\n\nwhile True:\n    led.on()\n    sleep(uniform(5,\
    \ 10))\n    led.off()\n```\n"
