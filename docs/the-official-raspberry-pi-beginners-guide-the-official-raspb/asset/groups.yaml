    ## Appendix B Installing and uninstalling software


    As before, you can click OK or Apply to begin uninstalling the selected software
    packages. You''ll be asked to confirm your password, unless you did so within
    the last few minutes, and you may also be prompted to confirm that you want to
    remove any dependencies relating to your software package as well. When the uninstallation
    has finished, the software will disappear from the raspberry icon menu, but files
    you created using the software – for a graphics package, for example, or saves
    for a game – won''t be removed.


    > WARNING!

    > All software installed in Raspberry Pi OS appears in Add/Remove Software, including
    software required for your Raspberry Pi to run. It''s possible to remove enough
    packages that the desktop no longer loads. To avoid this, don''t uninstall them
    unless you''re sure no longer need them.

    > If it''s already happened, reinstall Raspberry Pi OS using the instructions
    in Chapter 2, Getting started with your Raspberry PI, or reinstall the operating
    system using Appendix A.


    # Appendix C


    # The command-line interface


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_221_0.png)


    While you can manage most of the software on a Raspberry Pi through the desktop,
    some can only be accessed using the desktop, some can only be accessed using the
    terminal. The terminal is a powerful tool that allows you to interact with the
    operating system by typing commands. This might seem intimidating at first, but
    once you learn the basics, you''ll find it much faster and more flexible than
    the graphical interface.


    The command-line interface (CLI) is a text-based interface where you type commands
    to perform tasks. Instead of clicking on icons, you type specific strings of text
    that tell the computer what to do. This is common in almost all operating systems,
    including Linux, macOS, and Windows.


    In this appendix, we''ll cover some of the most common commands you''ll need.
    We''ll start with how to navigate the file system, then manage files, and perform
    other basic tasks.


    ## Navigating the file system


    The file system in Linux is organized in a tree-like structure. The root directory
    is the top, represented by a forward slash `/`. From there, everything branches
    into subdirectories.


    To move between directories, you''ll use the `cd` (change directory) command.


    - `cd [directory]`: changes to the specified directory.

    - `cd ..`: moves up one level level.

    - `cd ~`: takes you to your home directory.

    - `cd -`: goes to the previous directory.


    To see where you are currently located, use the `pwd` (print working directory)
    command. To list the contents of the current directory, use the `ls` command.


    - `ls`: lists the files and folders in the current directory.

    - `ls -l`: lists files in a long format, showing permissions, owner, and size.

    - `ls -a`: shows hidden files (those starting with a dot).

    - `ls -lh`: shows human-readable sizes.


    ## Managing files


    Once you can navigate the file system, you''ll need to create, copy, move, and
    delete files.


    - `touch [filename]`: creates an empty file.

    - `cp [source] [destination]`: copies a file or directory to another.

    - `mv [source] [destination]`: moves or renames a file.

    - `rm [filename]`: deletes a file. Use `rm -r [directory]` to delete a directory
    and all its contents.


    To edit files, you''ll use text editors like `nano` or `vim`. `nano` is more beginner-friendly.


    - `nano [filename]`: opens the file in the nano editor.


    ## Other basic commands


    There are many other commands you''ll find useful:


    - `sudo [command]`: runs a command with administrative privileges.

    - `mkdir [directory]`: creates a new directory.

    - `cat [filename]`: displays the contents of a file on the screen.

    - `grep "pattern" [filename]`: searches for a pattern within a file.

    - `clear`: clears the terminal screen.

    - `help [command]`: provides information about a command.


    By mastering these basic commands, you''ll be well on your way to using the Raspberry
    Pi like a pro. The more you practice, the more comfortable you''ll become.

    '
