    rpf.io/blog

    Your first step for the latest news on all things Raspberry Pi, the official blog
    covers everything from new hardware launches and educational material to roundups
    of the best community projects, campaigns, and initiatives. If you want to keep
    up to date on all things Raspberry Pi, this is where you need to be.


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_228_1.png)


