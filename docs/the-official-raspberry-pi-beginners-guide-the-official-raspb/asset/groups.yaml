    ![](img/0aff4cdab15427839fb48fd7c6f677d3_64_0.png)


    再次点击绿色旗帜。这次，你会看到猫咪精灵从 0 数到 9。这之所以能运行，是因为你的程序现在正在改变，或者说*修改*变量本身：每次循环运行时，程序都会在‘loops’变量的某个值上加
    1（**图 4-7**）。


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_64_1.png)


