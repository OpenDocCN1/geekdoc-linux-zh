    ## Chapter 4: Programming with Scratch


    ## Introducing the Scratch 3 interface


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_54_0.png)


    - **Stage Area**: Like actors in a play, sprites move around the stage.

    - **Sprite**: The characters or objects you control in Scratch are called sprites.

    - **Stage Controls**: Your stage can be changed, including adding own backgrounds.

    - **Sprites List**: All the sprites you created or added will appear in this section.

    - **Blocks Palette**: All the blocks available for your program appear in the
    palette.


    ## SCRATCH VERSIONS


    At the time this book was written, Raspberry Pi OS came with three versions of
    Scratch: 1, 2, and 3, all included in the Programming section. This chapter is
