    # Welcome to the Official Raspberry Pi Beginner''s Guide


    We think you''re going to love Raspberry Pi. Whichever model you have – the new
    Raspberry Pi 400 with integrated keyboard – this affordable computer can be used
    to learn coding, build robots, and create all kinds of weird and wonderful projects.


    Raspberry Pi is capable of doing all the things you''d expect from a computer
    – everything from browsing the internet and playing games, to watching movies
    and listening to music. But Raspberry Pi is much more than a modern computer.


    With a Raspberry Pi you can get into the heart of a computer. You get to set up
    your operating system, and connect wires and circuits directly to its GPIO pins.
    It was designed to teach young people how to program in languages like Scratch
    and Python, and all the major programming languages are included with the official
    operating system.


    The world needs programmers more than ever, and Raspberry Pi has ignited a love
    of science and technology in a new generation.


    People of all ages Raspberry Pi to create exciting projects: everything from retro
    games to internet-connected weather stations. If you want to make games, build
    robots, or hack a variety of amazing projects, then this book is here to help
    you get started.


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_4_0.png)


    # About the Author


    Gareth Halfacree is a freelance technology journalist, writer, and former system
    administrator in the education sector. With a passion for open-source software
    and hardware, he was an early adopter of the Raspberry Pi platform and has written
    several publications on its capabilities and flexibility. He can be found on Twitter
    as @ghalfacree or via his website at freelance.halffacree.co.uk.


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_5_0.png)


    # Contents


    ## Chapter 1: Get to know your Raspberry Pi

    Take a guided tour of your new computer


    ## Chapter 2: Getting started with your Raspberry Pi

    Connect everything you need to get your Raspberry Pi working


    ## Chapter 3: Using your Raspberry Pi

    Learn all about the Raspberry Pi operating system


    ## Chapter 4: Programming with Scratch 3

    Start coding with this easy-to-learn, block-based language


    ## Chapter 5: Programming with Python

    Get to grips with text-based coding using Python


    ## Chapter 6: Physical computing with Scratch & Python

    Control electronic components connected to your Raspberry Pi''s GPIO pins


    ## Chapter 7: Physical computing with the Sense HAT

    Use the sensors and LED matrix display of this add-on board


    ## Chapter 8: Raspberry Pi Camera Module

    Shoot high-resolution photos and videos with this tiny camera


    # APPENDICES


    Appendix A: Installing an OS to a microSD card 214


    Appendix B: Installing and uninstalling software 216


