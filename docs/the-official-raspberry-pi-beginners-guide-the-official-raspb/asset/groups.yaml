    Templates: This folder contains templates, blank documents with a basic layout
    or structure already in place, you have created or are installed by your applications.


    Videos: A folder for videos, and the first place video-playing programs will look.


    The File Manager itself is split into two panes: the left pane shows the directories
    on your Raspberry Pi, and the right pane shows the files and subdirectories of
    the directory selected in the left pane. If you plug a removable storage device
    into Raspberry Pi''s USB port, a window will pop up asking if you''d like to open
    it in the File Manager (Figure 3-15); click OK and you''ll be able to see its
    files and directories.


    + Figure 3-15: Inserting removable device


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_44_0.png)


    Files can easily be copied between Raspberry Pi''s microSD card and a removable
    device: with both your home directory and the removable device open in separate
    File Manager windows, move your mouse pointer to the file you want to copy, copy
    and hold the left mouse button down (Figure 3-16, overall). This is known as dragging
    and dropping.


    Another method is to click on the file, click on the Edit menu, click on Copy,
    click on the other window, click on the Edit menu, and copy on Paste.


    The cut option, also available in the Edit menu, is similar except it deletes
    the file from its original home after making the copy. Both options can also be
    used through the keyboard shortcuts CTRL+C (copy) or CTRL-X (cut), and paste via
    CTRL+V.


    # KEYBOARD SHORTCUTS


    When you use a keyboard shortcut like CTRL+C, it means to hold down the first
    key on the keyboard (CTRL), press the second key (C), then let go of both keys.


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_45_0.png)


    Figure 3-16: Dragging and dropping a file


    When you''ve finished experimenting, close the File Manager by clicking the close
    button at the top-left of the window. If you have more than one window, close
    them all. If you connected a removable storage device to your Raspberry Pi, eject
    it by clicking the eject button at the top-right of the screen, finding it in
    the list, and clicking on it before unplugging it.


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_45_1.png)


    # The LibreOffice productivity suite


    For another taste of what Raspberry Pi can do, click on the raspberry menu icon,
    move your mouse pointer to Office, and click on LibreOffice Writer. This will
    load the word processor portion of LibreOffice (Figure 3-17), a popular productivity
    suite – if you''ve used Microsoft Office or Google Docs, you''ve used a productivity
    suite.


    Note: LibreOffice may not be installed by default on Raspberry Pi OS images; if
    not, the Recommended Software tool (see page 49) to install it.


    # THE OFFICIAL RASPBERRY PI BEGINNER''S GUIDE


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_46_0.png)


    Figure 3-17: The LibreOffice Writer program


    A word processor lets you not only write documents, but to format them in clever
    ways: you can change the font style, color, size, add effects, and even insert
    pictures, charts, tables, and other content. A word processor also lets you check
    your work for mistakes, highlighting spelling and grammar problems in red and
    green respectively as you type.


    Begin by writing a paragraph on what you''ve learned about Raspberry Pi and its
    software so far. Experiment with the different icons at the top of the window
    to see what they do: see if you can make your writing better, and change its color.
    If you''re not sure how to do this, simply move your mouse pointer over each icon
    to see a ''tool tip'' telling you what that does. When you''re ready, click the
    File menu and the Save option to save your work (Figure 3-18). Give it a name
    and click the Save button.


