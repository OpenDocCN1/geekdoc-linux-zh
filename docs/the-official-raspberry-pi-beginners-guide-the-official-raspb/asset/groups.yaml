    # Sensing the world around you


    The Sense HAT''s real power lies in the various sensors it has. These allow you
    to take readings of everything from temperature to acceleration, and use them
    in your programs as you see fit.


    > EMULATING THE SENSORS

    If you''re using the Sense HAT Emulator, you''ll need to enable inertial and environmental
    sensor simulation: in the Emulator, click Edit, then Preferences, then click them.
    In the same menu choose ''180°'', ''360°'', ''180°'' under ''Orientation Scale''
    to make sure the numbers in the Emulator match the numbers reported by Scratch
    and Python, then click the Close button.


    # Environmental sensing


    The barometric pressure sensor, humidity sensor, and temperature sensor are all
    environmental sensors; they take measurements from the environment surrounding
    the Sense HAT.


    # Environmental sensing in Scratch


    Start a new program in Scratch, saving your old one if you wish, and add the Raspberry
    Pi Sense HAT extension if it''s already loaded. Drag a `when` block onto your
    code area, then a `clear display` block underneath, and a `set background to black`
    block underneath. Next, add a `set colour to white` block – use the Brightness
    and Saturation sliders to choose the colour. It is always a good idea to do this
    at the start of your programs, as it will make the Sense HAT isn''t showing anything
    from an old program while guaranteeing colours you''re using.


    Drag a `say Hello for 2 seconds` block directly underneath your existing blocks.
    To take a reading from the pressure sensor, find the `pressure` block in the Raspberry
    Pi Sense HAT category and drag it over the word ''Hello!'' in your `say Hello!
    for 2 seconds` block.


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_174_0.png)


    Click the green flag and the Scratch cat will tell you the current reading from
    the pressure sensor in millibars. After two seconds, the message will disappear;
    try blowing on the Sense HAT (or moving the Pressure slider up in the emulator)
    and clicking the green flag to run the program again (**Figure 7-17**, overleaf).


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_175_0.png)


    Figure 7-17: Showing the pressure sensor reading


    > ### CHANGING VALUES


    If you''re using the Sense HAT emulator, you can change the values reported by
    each of the emulated sensors using its sliders and buttons. Try sliding the pressure
    sensor setting down towards the bottom, then clicking the green flag again.


    To switch to the humidity sensor, delete the pressure block and replace it with
    the humidity. Run your program again, and you''ll see the current relative humidity
    of your room. Again, you can try running it again while blowing on (or moving
    the emulator''s Humidity slider up) to change the reading (Figure 7-18) – your
    breath is surprisingly humid!


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_175_1.png)


    Figure 7-18: Displaying the reading from the humidity sensor


    For the temperature sensor, it''s as easy as deleting the humidity block and replacing
    it with temperature, then running your program again. You''ll see a temperature
    in degrees Celsius **(Figure 7-19)** This might not be the exact temperature of
    your room, however: Raspberry Pi generates heat all the time it''s running, and
    this warms the Sense HAT and its sensors too.


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_176_0.png)


    Figure 7-19: Displaying the temperature sensor reading


    > CHALLENGE: SCROLL & LOOP

    Can you change your program to take a reading from each of the sensors in turn,
    scroll them across the LED matrix rather than printing them to the stage area?
    Can you make your program loop, so it''s constantly printing the current environmental
    conditions?


    # Environmental sensing in Python


    To start readings from sensors, create a new program in Thny and save it as Sense
    HAT Sensors. To type the following into the script area, as you always should
    when using the Sense HAT – and remember to use sense_emu if you''re using the
    emulator:


    ```

    from sense_hat import SenseHAT

    sense = SenseHAT()

    sense.clear()

    ```


    It''s always a good idea to include sense.clear() at the start of your programs,
    just in case the Sense HAT''s display is still showing something from the last
    program it ran.


    To take a reading from the pressure sensor, type:


    ```

    pressure = sense.get_pressure()

    print(pressure)

    ```


    Click Run and you''ll see a number printed to the Python shell at the bottom of
    the Thonny window. This is the air pressure reading detected by the barometric
    pressure sensor, in millibars (**Figure 7-20**). Try blowing on the Sense HAT
    (or moving the Pressure slider up in the emulator) while clicking the Run icon
    again; the number should be higher time.


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_177_0.png)


    **Figure 7-20**: Printing a pressure reading from the Sense HAT


    > ### CHANGING VALUES

    If you''re using the Sense HAT emulator, you can change the values reported by
    each of the emulated sensors using its sliders and buttons. Try sliding the pressure
    sensor setting down towards the bottom, then clicking the green flag again.


    To switch to the humidity sensor, delete the pressure block and replace it with
    the humidity. Run your program again, and you''ll see the current relative humidity
    of your room. Again, you can try running it again while blowing on (or moving
    the emulator''s Humidity slider up) to change the reading (Figure 7-18) – your
    breath is surprisingly humid!


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_175_1.png)


    Figure 7-18: Displaying the humidity sensor


    For the temperature sensor, it''s as easy as deleting the humidity block and replacing
    it with temperature, then running your program again. You''ll see a temperature
    in degrees Celsius **(Figure 7-19)** This might not be the exact temperature of
    your room, however: Raspberry Pi generates heat all the time it''s running, and
    this warms the Sense HAT and its sensors too.


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_176_0.png)


    Figure 7-19: Displaying the temperature sensor reading


    > CHALLENGE: SCROLL & LOOP

    Can you change your program to take a reading from each of the sensors in turn,
    scroll them across the LED matrix rather than printing them to the stage area?
    Can you make your program loop, so it''s constantly printing the current environmental
    conditions?


    # THE OFFICIAL RASPBERRY PI BEGINNER''S GUIDE


    Inertial sensing

    The gyroscopic sensor, accelerometer, and magnetometer combine to form what is
    known

    as an inertial measurement unit (IMU). While technically speaking, these sensors
    take

    measurements from the environment just like the environmental sensors – the

    magnetometer, for example, measures magnetic field strength – they''re usually
    used for data

    the movement of the Sense HAT itself. The IMU is the sum of multiple sensors;
    some

    programming languages allow you to take readings from each sensor independently,

    others will only give you a combined reading.


    Before you can make sense of the IMU, though, you need to understand how things
    move.

    The Sense HAT, and your Raspberry Pi it''s attached to, can move along three axes:

    side-to-side on the X axis; forwards and backwards on the Y axis; and up and down
    on the Z

    axis (**Figure 7-24**). It can also rotate along these three axes, but their names
    change:

    rotating on the X axis is called *roll*, rotating on the Y axis is called *pitch*,
    and rotating on the

    Z axis is called yaw. When you rotate the Sense HAT along short axis, you''re
    adjusting its

    pitch; rotate along its long axis and that''s roll; spin around it while keeping
    it flat on the table

    and you''re adjusting its yaw. Think of them like an airplane: when it''s taking
    off, it increases

    its pitch to climb; when it''s doing a victory roll, that''s literally spinning
    along its roll axis; when

    it''s using its rudder to turn like a car, without rolling, that''s yaw.


    Yaw: Z


    Pitch: Y


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_180_0.png)


    Roll: X


    **Figure 7-24:** The spatial axes of the Sense HAT''s IMU

