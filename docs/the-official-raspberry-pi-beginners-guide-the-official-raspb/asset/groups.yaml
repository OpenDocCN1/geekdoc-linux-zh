    # Next steps: reading a button


    Outputs like LEDs are one thing, the ''input/output'' part of ''GPIO'' means you
    can use pins as inputs too. For this project, you''ll need a breadboard, male-to-male
    (M2M) and male-to-female (M2F) jumper wires, and a push-button switch. If you
    don''t have a breadboard you can use female-to-female (F2F) jumper wires, but
    the button will be much harder to press without accidentally breaking the circuit.


    Start by adding the push-button to your breadboard. Make sure they''re in different
    number rows of the breadboard, if it has four legs, turn it so the sides the legs
    come out among the breadboard''s rows and the flat leg-free sides are at the top
    and bottom. Connect the ground rail of your breadboard to a ground pin of Raspberry
    Pi GND on a male-to-female jumper wire, then connect one leg of your push-button
    to the ground rail with a male-to-male jumper wire. Finally, connect the other
    leg – on the same side as the leg you just connected, if using a four-leg switch
    – to the GPIO 2 pin (marked GPIO 6-4) of Raspberry Pi with a male-to-female jumper
    wire.


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_133_0.png)


    - Figure 6-4: Wiring a push-button to the GPIO pins


    # Reading a button in Scratch


    Start a new Scratch program and drag a `when clicked` block onto the code area.
    Connect a `set gpio to input pulled high` block, and select the number 2 from
    the drop-down to match the GPIO pin you used for the push-button.


    ```

    when clicked to set gpio 2 to input pulled high

    ```


    If you click the green flag now, nothing will happen. Drag not what to do with
    that input. Drag a `forever` block to the end of your sequence, then drag an `else`
    block inside. Find the `is high?` block, drag it into the diamond-shaped space
    in the `then` part of the block, and use the drop-down to select the number 2
    to which GPIO pin to check. Drag a `say hello! for 2 seconds` block into the `else`
    part of the block and edit it to say ''Button pushed!''. Leave the ''then'' part
    of the block empty for now.


    ```

    when clicked to set gpio 2 to input pulled high

    if gpio 2 is high? then

    else

    say Button pushed! for seconds seconds

    ```


    There''s a lot going on, but by testing it: click the green flag, push the button
    on your breadboard. Your sprite should tell you that the button has been pushed:
    you successfully read an input from the GPIO pin!


    You may have noticed that the `gpio 2 is high? then` part of the block is empty.
    The code that runs when the button is actually pushed, meanwhile is in the `else`
    part of the block. That seems confusing, as surely pressing the button it goes
    high? In fact, it''s the opposite: Raspberry Pi''s GPIO pins are normal high,
    or when set as an input, and pushing the button pulls them down to low.


    Look at your circuit: see how the button is connected to the GPIO 2 pin, providing
    the positive part of the circuit, and the ground pin. When the button is pushed,
    the voltage on the GPIO pin is pulled low through the ground pin, and your Scratch
    program stops running the code in your gpio 2 is high? then block and instead
    runs the code in the else part of the block.


    If all sounds perplexing, just remember this: a button on a Raspberry Pi GPIO
    pin is pushed when the pin goes low, not when it goes high!


    To extend your program further, add the LED and resistor back into the circuit:
    remember to connect the resistor to the GPIO 25 pin and the long leg of the LED,
    and the shorter leg of the LED to the ground rail on your breadboard.


    Drag the say Button pushed: for 2 seconds block off the code area to the block
    palette to delete it, replace it with a set gpio 25 to output high block – as
    long as you''re holding that you''ll have to change the GPIO number using the
    drop-down arrow. set gpio 25 to output low block – remembering to change the values
    – to the currently empty gpio 2 is high? then part of the block.


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_135_0.png)


    Click the green flag and push the button. The LED will light up as the button
    goes down; let go, and it will go dark again. Congratulations: you''re controlling
    one GPIO pin based on an input from another!


    > CHALLENGE: MAKE IT STAY LIT

    > How would you change the program to make the LED stay on for a few seconds,
    even after you let go of the button? What would you need to change to have the
    LED on while you''re not pressing the button and off while you?


    # Reading a button in Python


    Click the New button in Thony to start a new project, and the Save button to save
    it as Button Input. Using a GPIO pin as an input for a button is very similar
    to using a pin as an output for an LED, but you need to import a different part
    of the GPIO Zero library. Type the following into the script area:


    ```

    from gpiozero import Button

    button = Button(2)

    ```


    To code run when the button is pressed, GPIO Zero provides the wait_for_press
    function. Type the following:


    ```

    button.wait_for_press()

    print("You pushed me!")

    ```


    Click the Run button, then press the push-button switch. Your message will print
    to the Python shell at the bottom of the Thony window: you''ve successfully read
    an input from the GPIO pin! If you want to type your program, you''ll need to
    click the Run button again, because there''s no loop in the program, it quits
    as soon as it has finished printing the message to the shell.


    To extend your program, add the LED and resistor back into the circuit if you
    haven''t already done so: remember to connect the resistor to the GPIO 25 pin
    and the long leg of the LED, and the shorter leg of the LED to the ground rail
    on your breadboard.


    To control an LED as well as a read button, you''ll need to import both the Button
    and LED functions from the GPIO Zero library. You''ll also need the sleep function
    from the time library. Go back to the top of your program and type in the following
    as the new two lines:


    ```

    from gpiozero import LED

    from time import sleep

    ```


    Below the line button = Button(2), type:


    ```

    led = LED(25)

    ```


    Delete the print("You pushed me!") and replace it with:


    ```

    led.on()

    sleep(2)

    led.off()

    ```


    Your finished program should look like this:


    ```

    from gpiozero import LED

    from time import sleep

    from gpiozero import Button

    ```


    ```

    button = Button(2)

    led = LED(25)

    button.wait_for_press()

    led.on()

    sleep(3)

    led.off()

    ```


    Click the Run button, press the push-button switch: the LED will come on for three
    seconds, then turn off again and the program will exit. Congratulations: you can
    control an LED using a button input in Python!


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_137_0.png)


    > CHALLENGE: ADD A LOOP

    > How would you add a loop to make the program repeat instead of exiting after
    one press? What would you need to change to the LED on while you''re not pressing
    the button and off while you?


    # Make some noise: controlling a buzzer


    An active buzzer can be treated exactly like an LED, in terms of circuitry. Repeat
    the circuit you made for the LED, but replace the LED with the active buzzer and
    leave the resistor out, as the buzzer will need more current. Connect one of the
    buzzer to the GPIO 15 pin (labelled GP15 in Figure 6-5) and the other to the ground
    pin (labelled GND) using your breadboard and male-to-female jumper wires.


    If your buzzer has three legs, make sure the leg with minus symbol (-) is connected
    to the ground pin, and the leg marked ''S'' or ''SIGNAL'' is connected to GPIO
    15, then connect the remaining leg – usually the middle leg – to the 3.3 V pin
    (labelled 3V)


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_138_0.png)


    Figure 6-5: Connecting a buzzer to the GPIO pins


    # Controlling a buzzer in Scratch


    Recreate the same program as for making the LED flash – load it, if you saved
    it before you created the button project. Use the drop-down in the set gpio to
    output high blocks to select 15, so Scratch is controlling the correct GPIO pin.


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_139_0.png)


    Click the green flag, and your buzzer will begin to buzz: one second on, and one
    second off. If you only hear the buzzer clicking once a second, you are using
    a passive buzzer rather than an active buzzer. Where an active buzzer generates
    the rapidly changing signal, known as an oscillation, to make the metal plates
    vibrate itself, a passive buzzer needs an oscillating signal. When you simply
    turn it on using Scratch, the plates only move and stop – making the ''click''
    sound unique until the next time the program switches it on or off.


    Click the red octagon to stop your buzzer, but make sure to do so when it''s not
    making a sound, otherwise the buzzer will continue to buzz until you run your
    program again!


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_139_1.png)

