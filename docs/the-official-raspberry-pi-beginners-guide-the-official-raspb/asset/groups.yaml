  - '[PAGE 80]


    For Olympic-style synchronised swimming, though, we need more swimmers, and we
    need a way to reset the cat sprite’s position. Add a when clicked Events block,
    then underneath add a go to x: 0 y: 0 Motion block – changing the values if necessary
    – and a point in direction 90 Motion block. Now, when you click the green flag,
    the cat will be moved to the middle of the stage and pointing to the right.


