  - "[PAGE 140]\n\n# Controlling a buzzer in Python\n\nControlling an active buzzer\
    \ through the GPIO library is almost identical to controlling an LED, in that\
    \ it has on and off states. You need a different, function, though: buzzer. Start\
    \ a new project in Thny and save it as Buzzer, then type the following:\n\n```\n\
    from gpiozero import Buzzer\nfrom time import sleep\n```\n\nAs with LEDs, GPIO\
    \ needs to know which pin your buzzer is connected to in order to control it.\
    \ Type the following:\n\n```\nbuzzer = Buzzer(15)\n```\n\nFrom here, your program\
    \ is almost identical to the one you wrote to control the LED; the only difference\
    \ (apart from a different GPIO pin number) you're using buzzer in place of led.\
    \ Type the following:\n\n```\nwhile True:\n    buzzer.on()\n    sleep(1)\n   \
    \ buzzer.off()\n    sleep(1)\n```\n\nClick the Run button and your buzzer will\
    \ begin to buzz: one second on, and one second off. If you are using a passive\
    \ buzzer, you'll only hear a brief click every instead of a continuous buzz: this\
    \ is because a passive buzzer lacks an oscillator to the rapidly changing signal\
    \ that makes the plates inside the buzzer vibrate.\n\nClick the Stop button to\
    \ exit the program, but make sure the buzzer isn't making a sound at the time\
    \ otherwise it will continue to buzz until you run your program again!\n\n![](img/0aff4cdab15427839fb48fd7c6f677d3_140_0.png)\n\
    \n> CHALLENGE: A BETTER BUZZ\nHow could you change the program to make the buzzer\
    \ sound for a shorter time? Can you build a circuit so the buzzer is controlled\
    \ by a button?"
