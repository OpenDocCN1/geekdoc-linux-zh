    # Project 2: Scary Spot the Difference


    Python can also handle pictures and sounds as well as turtle-based graphics, which
    can be used to get great effect as a prank on your friends – spot-the-difference
    game with a scary secret at its heart, perfect for Halloween!


    > ONLINE PROJECT

    This project is also available online at rpf.io/scary-spot


    This project needs two images – your spot-the-difference image plus a ''scary''
    surprise image – a sound file. Click on the raspberry Pi to load the Raspberry
    Pi OS menu, choose the Internet category, and click on Chromium Web Browser. When
    it has loaded, type rpf.io/spot-pic to the address bar followed by the ENTER key.
    Right-click on the picture and click on ''Save image as...''; choose the Home
    folder from the list on the left-hand side, then click Save. Click on Chromium''s
    address bar, type rpf.io/scary-pic followed by the ENTER key. As before, right-click
    the picture, click ''Save image as...'',; choose the Home folder, then click Save.


    For the sound file, you''ll need, click back into the address bar and type rpf.io/cream
    followed by the ENTER key. This file, the sound of a scream to play your player
    real surprise, will play automatically – but it will need to be saved before you
    use it. Right-click on the small audio player, click ''Save as...'',; choose the
    Home folder, and click Save. You can now close the Chromium window.


    Click the new icon in the Thny toolbar to begin a new project. As before, you''re
    going to be using a library to extend Python''s capabilities: The Pygame library,
    which as the name suggests was created with games in mind. Type the following:


    ```

    import pygame

    ```


    You will need some parts of other libraries, and from a subsection of the Pygame
    library, too. Import them by typing the following:'
- md: '

    ```python

    from pygame.locals import *

    from time import sleep

    from random import randrange

    ```


    The import instruction works differently to the import instruction, allowing you
    to import only the parts of a library you need rather than the whole library.
    Next, you need to set up Pygame; this is known as initialisation. Pygame needs
    to know the width and height of the player''s monitor or TV, known as its resolution.
    Type the following:


    ```python

    pygame.init()

    width = pygame.display.Info().current_w

    height = pygame.display.Info().current_h

    ```


    The final step in setting Pygame is to create its window, which Pygame calls a
    screen. Type the following:


    ```python

    screen = pygame.display.set_mode((width, height))

    ```


    ```python

    pygame.quit()

    ```


    Note the blank line in the middle; this is where your program will go. For now,
    though, click on the Run icon, save your program as Spot the Difference, and watch:
    Pygame will create a window, filling it with a black background, which will then
    immediately disappear as it reaches the instruction to quit. Aside from a short
    message in the shell (Figure 5-14), the program has achieved much so far.


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_109_0.png)


    > Figure 5-14: Your program is functional, but does not do much yet


    # THE OFFICIAL RASPBERRY PI BEGINNER''S GUIDE


    To display your spot-the-difference image, type in the following line in the space
    above pygame.quit():


    ```python

    difference = pygame.image.load(''spot_the_diff.png'')

    ```


    To make sure the image fills the screen, you''ll need to scale it to match your
    monitor or TV''s resolution. Type the following:


    ```python

    difference = pygame.transform.scale(difference, (width, height))

    ```


    Now the image is in memory, you need to tell Pygame to actually display it on
    the screen - a process known by blitting, or a bit transfer. Type the following:


    ```python

    screen.blit(difference, (0, 0))

    pygame.display.update()

    ```


    The first of these lines copies the image onto the screen, starting at the top-left
    corner; the second tells Pygame to redraw the screen. Without this second line,
    the image will be in the correct place in memory but you''ll never see it!


    Click the Run icon, and the image will briefly appear on screen (Figure 5-15).


