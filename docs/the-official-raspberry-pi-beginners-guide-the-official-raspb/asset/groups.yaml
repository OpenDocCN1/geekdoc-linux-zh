    ## Chapter 5

    Programming with Python


    Now you''ve got to grips with Scratch, we''ll show you how to do text-based coding
    with Python


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_91_0.png)


    Named after the Monty Python comedy troupe, Guido van Rossum''s Python has grown
    from a hobby project first released to the public in 1991 to a much-loved programming
    language powering a wide range of projects. Unlike the visual environment of Scratch,
    Python is text-based: you write instructions, using a simplified language and
    specific format, which the computer carries out.


    Python is a great next step for those who have already used Scratch, offering
    increased flexibility and a ''traditional'' programming environment. That''s not
    to say it''s difficult to learn, though with a little practice, anyone can write
    Python programs for everything from simple calculations to surprisingly complicated
    games. This chapter builds on terms and concepts introduced in Chapter 4, Programming
    with Scratch. If you haven''t worked through the exercises in that chapter, you''ll
    find this chapter easier to follow if you go back and do so first.


    # THE OFFICIAL RASPBERRY PI BEGINNER''S GUIDE


    ## Introducing Thonny IDE


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_92_0.png)


    - **A Toolbar** - Thonny''s ''Simple Mode'' uses a bar of friendly icons as its
    menu, allowing you to create, save, load, and run your programs as well as test
    it in various ways.

    - **B Script Area** - The script area is where Python programs are written, and
    is split into a main area for your program and a small margin for showing line
    numbers.

    - **C Shell** - The Python shell allows you to type individual instructions which
    then run as soon as you press the **ENTER** key, and also provides information
    about running programs.


    > THONNY VERSIONS

    Thonny has two versions: ''Regular Mode'', and a ''Simple Mode'' which is better
    for beginners. This chapter uses Simple Mode, which is loaded by default when
    you open Thonny from the Programming section.


    Chapter 5 Programming with Python


    ## Your first Python program: Hello, World!


    Like the other pre-installed programs on Raspberry Pi, Thonny is available from
    the menu: click on the raspberry icon, move the cursor to the Programming section,
    and click on Thonny IDE. After a few seconds, the Thonny user interface (Simple
    Mode by default) will load. Thonny is a package known as an integrated development
    environment (IDE), a complicated-sounding name with a simple explanation: it gathers
    together all the different tools you need to create or develop into a single interface.
    There are many IDEs available, while Thonny focuses on supporting a single language.
    Unlike Scratch, which gives you visual building blocks as a basis for your program,
    Python is a more traditional programming language where everything is written
    down. Start your first program by clicking on the Python shell area at the bottom
    of the Thonny window, then type the following instruction before pressing the
    ENTER key:


    ```

    print("Hello, World!")

    ```


    When you press ENTER, you''ll see that your program begins to run instantly: Python
    will respond, in the same shell area, with the message ''Hello, World!'' (**Figure
    5-1**), as you asked. That''s because the shell is a direct line to the Python
    interpreter, whose job is to look at your instructions and interpret what they
    mean. This is known as interactive mode, and you can think of it like a face-to-face
    conversation with someone: as soon as you finish what you are saying, the other
    person will respond, wait for whatever you say next.


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_93_0.png)


    **Figure 5-1:** Python prints the ''Hello, World!'' message in the shell area.


    # THE OFFICIAL RASPBERRY PI BEGINNER''S GUIDE


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_94_0.png)


    You don''t have to use Python in interactive mode, though. Click on the script
    area in the middle of the Thonny window, then type your program again:


    ```

    print("Hello, World!")

    ```


    When you press the ENTER key, nothing happens – except that you get a new, blank
    line in the script area. To make this version of your program work, you''ll have
    to click the Run icon in the Thonny toolbar. When you do, you''ll be asked to
    save your program first; type a descriptive name, like ''Hello World'' and click
    the Save button. Once your program has saved, you''ll see two messages appear
    in the Python shell area (Figure 5-2):


    ```

    >>> Run ''Hello World.py''

    Hello, World!

    ```


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_94_1.png)


    - Figure 5-2: Running your simple program.


    Chapter 5 Programming with Python


    The first of these lines is an instruction from Thonny telling the Python interpreter
    to run the program you just saved. The second is the output of the program – the
    message you told Python to print. Congratulations; you''ve now written and run
    your first Python program in both interactive and script modes!


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_95_0.png)


    ## CHALLENGE: NEW MESSAGE


    Can you change the message the program prints as its output? If you wanted more
    messages, would you use interactive mode or script mode? What happens if you remove
    the brackets or the quotation marks from the program and then try to run it?


    ## Next steps: loops and code indentation


    Just as Scratch uses stacks of jigsaw-like blocks to control which bits of the
    program are connected to which bits, Python has its own way of controlling the
    sequence in which its programs run: indentation. Create a new program by clicking
    the New icon + in the Thonny toolbar. You won''t lose your existing program; instead,
    Thonny will create a new tab above the script area. Start by typing in the following:


    ```

    print("Loop starting!")

    for i in range(10):

    ```


    The first line prints a simple message to the shell, just like your Hello World
    program. The second begins a definite loop, which works in the same way as Scratch:
    A counter, i, is assigned to the loop and runs a series of numbers – the range
    instruction, which is told to start at the number 0 and count upwards, but never
    reaching, the number 10 – to count. The colon symbol :) tells Python that the
    next instruction should be part of the loop. In Scratch, the instructions to be
    included in the loop are literally inside the C-shaped block. Python uses a different
    approach: indenting code. The next line starts with four blank spaces, which Thonny
    should have added when you pressed ENTER after line 2:


    ```

    print("Loop number"), i

    ```


    The blank spaces push this line inwards compared to the other lines. This indentation
    tells the difference between instructions outside the loop and instructions inside
    the loop: the indented code is known as nested.

