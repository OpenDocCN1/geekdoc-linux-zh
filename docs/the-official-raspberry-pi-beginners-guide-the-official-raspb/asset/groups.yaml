    This changes the ISO setting of the camera, which affects how sensitive it is
    to light. By default, the camera adjusts this automatically depending on the available
    light. You can set the ISO yourself using one of the following values: 100, 200,
    320, 400, 500, 640, 800. The better the ISO, the better the camera will perform
    in low-light environments or the grainier the image or video captures.


    ```python

    camera.meter_mode = ''average''

    ```


    This controls how the camera depends on the amount of light when setting its exposure.
    The default averages the amount of light available throughout the whole picture;
    other possible modes are backlit, matrix, and spot.


