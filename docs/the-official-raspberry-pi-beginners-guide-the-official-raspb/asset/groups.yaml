    # # THE OFFICIAL Raspberry Pi Beginner''s Guide


    Raspberry Pi is a small, clever, British-built computer that''s packed with potential.
    Made using the same technology you find in a smartphone, Raspberry Pi is designed
    to help you learn coding, discover how computers work, and build your own amazing
    things. This book was written to show you just how easy it is to get started.


    # ## Learn how to:


    +   * Set up your Raspberry Pi, install its operating system, and start using
    this fully functional computer.


    +   * Start coding projects, with step-by-step guides using the Scratch 3 and
    Python programming languages.


    +   * Experiment with connecting electronic components and have fun creating amazing
    projects.'
