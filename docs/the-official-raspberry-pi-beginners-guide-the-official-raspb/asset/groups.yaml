    \ category. Your game is now ready to test by clicking on the green flag over\
    \ the stage. Get ready, and as soon as you see the message 'Hit Space!', press\
    \ the SPACE as quickly as you can (Figure 4-13) – see if you can beat our score!\n\
    \n![](img/0aff4cdab15427839fb48fd7c6f677d3_74_1.png)\n\n## Chapter 4 Programming\
    \ with Scratch \n\nYou can extend this project further by having it calculate\
    \ roughly far the International Space Station has travelled in the time it took\
    \ to press the SPACE key, based on the station's published speed of seven kilometres\
    \ per second. Create a new variable called 'distance'. Notice how the blocks in\
    \ the Variables category automatically change to show the new variable, but the\
