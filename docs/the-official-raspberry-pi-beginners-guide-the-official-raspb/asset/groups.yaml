    when clicked to set gpio 2 to input pulled high

    ```


    如果你现在点击绿色旗帜，什么都不会发生。你还没有规定如何处理该输入。拖一个 `forever` 模块到序列的末尾，然后在内部拖入一个 `else` 模块。找到
    `is high?` 模块，将其拖入模块中 `then` 部分的菱形空间内，并使用下拉菜单选择数字 2，即要检查哪个 GPIO 引脚。将一个 `say hello!
    for 2 seconds` 模块拖到该模块的 `else` 部分，并将其修改为说“Button pushed!（按钮已按下！）”。先让模块的 `then`
    部分为空。


    ```

    when clicked to set gpio 2 to input pulled high

    if gpio 2 is high? then

    else

    say Button pushed! for seconds seconds

    ```


    这里涉及很多操作，但通过测试：点击绿色旗帜，按下面包板上的按钮。你的角色应该会告诉你按钮已被按下：你成功地从 GPIO 引脚读取到了一个输入！


    你可能已经注意到，模块中的 `if gpio 2 is high? then` 部分是空的。与此同时，当按钮实际上被按下时运行的代码位于模块的 `else`
    部分。这似乎很令人困惑，因为按下按钮按理说应该变高电平吗？事实恰恰相反：树莓派的 GPIO 引脚平时是高电平（或者当设置为输入时），按下按钮会将它们拉低低电平。


    观察你的电路：看按钮是如何连接到 GPIO 2 引脚（提供电路的正极）和地脚的。当按钮被按下时，GPIO 引脚上的电压通过地脚被拉低，你的 Scratch
    程序将停止运行 `if gpio 2 is high? then` 模块中的代码，转而运行 `else` 部分的代码。


    如果这一切听起来很费解，只需记住这一点：树莓派 GPIO 引脚上的按钮是在引脚变为低电平时时被按下的，而不是高电平时！


    为了进一步扩展你的程序，请将 LED 和电阻接回电路：记得将电阻连接到 GPIO 25 引脚和 LED 的长脚，并将 LED 的短脚连接到面包板的地线轨。


    将 `say Button pushed! for 2 seconds` 模块从代码区域中删除，将其替换为 `set gpio 25 to output high`
    模块——只要你按着它，引脚就会输出高。使用下拉菜单更改 GPIO 引脚数字，然后使用 `set gpio 25 to output low` 模块来替换目前空的
    `if gpio 2 is high? then` 部分。


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_135_0.png)


    点击绿色旗帜并按下按钮。当按钮按下时 LED 会亮起；松开时它会再次熄灭。恭喜你：你正在根据输入控制 GPIO 引脚！


    > 挑战：保持常亮

    > 你该如何修改程序，让 LED 在松开按钮后保持亮几秒？你需要更改什么以便在不按下按钮时 LED 亮着，按下时熄灭？


    # 在 Python 中读取按钮


    在 Thony 中点击 New 按钮启动新项目，点击 Save 将其保存为 Button。将 GPIO 引脚作为按钮输入与作为 LED 输出非常相似，但你需要从
    gpiozero 库导入不同的部分。在脚本区域输入：


    ```

    from gpiozero import Button

    ```


    当按钮被按下时，gpiozero 提供了 `wait_for_press` 函数。输入：


    ```

    button.wait_for_press()

    print("You pushed!")

    ```


    点击 Run 按钮，然后按下按钮开关。你的消息将打印到 Thony 窗口底部的 Shell 中：你成功地从 GPIO 引脚读取了输入！如果你想运行程序，你需要再次点击
    Run，因为程序没有循环，在完成打印消息后就会退出。


    为了扩展你的程序，如果你还没有这样做，请将 LED 和电阻接回电路：记得将电阻连接到 GPIO 25 引脚和 LED 的长脚，并将 LED 的短脚连接到面包板的地线轨。


    为了像读取按钮一样控制 LED，你需要从 gpiozero 库同时导入 Button 和 LED 函数。你还需要 time 库中的 `sleep` 函数。回到程序顶部，输入以下两行：


    ```

    from gpiozero import LED

    from time import sleep

    ```


    在 `button = Button(2)` 行下方，输入：


    ```

    led = LED(25)

    ```


    删除 `print("You pushed!")` 并将其替换为：


    ```

    led.on()

    sleep(2)

    led.off()

    ```


    你完成的程序看起来应该是这样的：


    ```

    from gpiozero import LED

    from time import sleep

    from gpiozero import Button

    ```


    ```

    button = Button(2)

    led = LED(25)

    button.wait_for_press()

    led.on()

    sleep(3)

    led.off()

    ```


    点击 Run 按钮，按下按钮开关：LED 会亮三秒，然后关闭，程序退出。恭喜你：你可以使用 Python 中的按钮输入控制 LED！


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_137_0.png)


    > 挑战：添加循环

    > 你该如何添加一个循环让程序在按下后重复而不是退出？你需要更改什么以便在不按下按钮时 LED 亮着，按下时熄灭？


    # 发出声音：控制蜂鸣器


    有源蜂鸣器在电路方面可以完全像 LED。重复你为 LED 的电路，但用源蜂鸣器替换 LED 并去掉电阻，因为蜂鸣器需要更大的电流。使用面包板和母对母跳线线将蜂鸣器的一个连接到
    GPIO 15 引脚（图 6-5标记为 GP15），另一个连接到地脚（标记为 GND）。


    如果蜂鸣器有三个脚，确保带有负号 (-) 的脚连接到地脚，标记为 ''S'' 或 ''SIGNAL'' 的脚连接到 GPIO 15，然后将剩余的脚（通常是中间的脚）连接到
    3.3V 引脚（标记为 3V）。


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_138_0.png)


    图 6-5：将蜂鸣器连接到 GPIO 引脚


    # 在 Scratch 中控制蜂鸣器


    重新创建一个与闪烁 相同的程序——如果你在创建按钮项目之前保存了它，请加载它。使用 `set gpio to output high` 模块中的下拉菜单选择
    15，以便让 Scratch 控制正确的 GPIO 引脚。


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_139_0.png)


    点击绿色旗帜，你的蜂鸣器将开始嗡嗡：开启一秒，关闭一秒。如果你只听到蜂鸣器每秒点击一次，说明你使用的是无源蜂鸣器而不是有源蜂鸣器。有源蜂鸣器产生快速变化的信号（称为振荡）来使金属片振动，而无源蜂鸣器需要振荡信号。当你仅使用
    Scratch 开启它时，金属片移动并停止——在程序下次切换开启或关闭之前，这种“咔哒”声是独特的。


    点击红色八边形停止你的蜂鸣器，但请确保在它没有发出声音时这样做，否则蜂鸣器将一直嗡嗡直到你再次运行程序！


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_139_1.png)


