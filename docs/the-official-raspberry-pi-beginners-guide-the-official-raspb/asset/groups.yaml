    \ your set gpio 25 to output high block means. To turn it off, click the down\
    \ arrow at the end of the block and choose 'low' from the list.\n\n```\nwhen\n\
    set gpio 25 to output low\n```\n\nClick the green flag again, and this time your\
    \ program turns the LED off. To make things more interesting, add a forever block\
    \ and a couple of wait 1 seconds blocks to create a program to flash the LED on\
    \ and every second.\n\n# THE OFFICIAL RASPBERRY PI BEGINNER'S GUIDE\n\n![](img/0aff4cdab15427839fb48fd7c6f677d3_130_0.png)\n\
    \nClick the green flag and watch your LED: it will turn on for a second, turn\
    \ off for a second, turn on for a second, and keep repeating pattern until you\
    \ click the red octagon to stop it. See what happens when you click the octagon\
    \ while the LED is in its on or off states.\n\n> CHALLENGE: CAN YOU ALTER IT?\n\
    How would you change the program to make the LED stay on longer? What about staying\
    \ off for longer? What's the smallest delay you can use while still seeing the\
    \ LED switch on and off?\n\n## LED control in Python\n\nLoad Thny from the Programming\
    \ selection of the raspberry menu, then click the New button to start a new project\
