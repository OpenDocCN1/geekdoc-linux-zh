    ## 第 5 章

    使用 Python 编程


    现在你已经掌握了 Scratch，我们将向你展示如何使用 Python 进行文本编码。


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_91_0.png)


    Python 以“蒙提 Python喜剧剧团”（Monty Python）命名，由 Guido·范罗姆（Guido van Rossum）创立。它从 1991
    年首次面向公众的一个爱好项目发展为一种备受喜爱的、支持各种项目的编程语言。与 Scratch 的视觉化环境不同，Python 是基于文本的：你使用简化的语言和特定的格式编写指令，由计算机执行这些指令。


    对于已经使用过 Scratch 的人来说，Python 是极佳的下一步，它提供了更大的活性和“传统的”编程环境。这并不是说它很难学习，只要通过练习，任何人都可以编写从简单计算到意乎复杂的游戏的各种
    Python 程序。本章建立在第 4 章“使用 Scratch 编程”中介绍的术语和概念之上。如果你还没有完成该章节的练习，先回去做一遍，你会发现本章会更容易理解。


    # 树莓派官方新手指南


    ## 介绍 Thonny IDE


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_92_0.png)


    - **A 工具栏** - Thonny 的“简单模式”使用一栏友好的图标作为其菜单，允许你创建、保存、加载和运行程序，并以各种方式对其进行测试。

    - **B 脚本区域** - 脚本区域是编写 Python 程序的地方，分为一个用于程序的主区域和一个用于显示行号的小边距区域。

    - **C 终端（Shell）** - Python 终端允许你输入单条指令，这些指令会在按下 **ENTER** 键后立即运行，并提供有关运行程序的信息。


    > THONNY 版本

    Thonny 有两个版本：“普通模式”和更适合初学者的“简单模式”。本章使用简单模式，当你从“编程”部分打开 Thonny 时，默认加载该模式。


    第 5 章 使用 Python 编程


    ## 你的第一个 Python 程序：Hello, World!


    与树莓派上的其他预装程序一样，Thonny 可以从菜单访问：点击树莓派图标，将光标移动到“编程”部分，然后点击 Thonny IDE。几秒钟，Thonny
    用户界面（默认的简单模式）将加载。Thonny 是一个名为集成开发环境（IDE）的软件包，名字听起来很复杂，但解释很简单：它将创建或开发程序所需的所有不同工具整合到一个界面中。有很多
    IDE 可用，而 Thonny 专注于支持单一语言。与 Scratch 提供视觉化构建块作为程序基础不同，Python 是一种更传统的编程语言，所有内容都通过编写完成。点击
    Thonny 窗口底部的 Python 终端区域开始你的第一个程序，然后在按下 ENTER 键之前输入以下指令：


    ```

    print("Hello, World!")

    ```


    当你按下 ENTER 时，你会发现程序立即开始运行：Python 会在同一个终端区域返回“Hello, World!”的消息（**图 5-1**），正如你所要求的那样。这是因为终端直接连通到
    Python 解释器，解释器的工作是查看你的指令并解释它们的含义。这被称为交互模式，你可以将其比作与某面对面对交流：一旦你说完你想说的话，对方就会回应，等待你接下来的任何话。


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_93_0.png)


    **图 5-1：** Python 在终端区域打印“Hello, World!”消息。


    # 树莓派官方新手指南


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_94_0.png)


    不过，你不必在交互模式中使用 Python。点击 Thonny 窗口中间的脚本区域，再次输入你的程序：


    ```

    print("Hello, World!")

    ```


    当你按下 ENTER 键时什么都没有发生——除了脚本区域出现了一个空行。要让这个版本的程序运行，你必须点击 Thonny 工具栏中的运行图标。在你这样做时，会被要求先保存程序；输入一个描述性名称，如“Hello
    World”，并点击保存。一旦程序保存，你将在终端区域看到两条消息（见图 5-2）：


    ```

    >>> Run ''Hello World.py''

    Hello, World!

    ```


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_94_1.png)


    - 图 5-2：运行你的简单程序。


    第 5 章 使用 Python 编程


    这两行中的第一行是 Thonny 运行你刚刚保存程序的指令。第二行是程序的输出——你告诉 Python 打印的消息。恭喜，你现在已经在交互和脚本模式下编写并运行了第一个
    Python 程序！


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_95_0.png)


    ## 挑战：新消息


    你能更改程序打印的消息吗？如果你想打印更多消息，你会使用交互模式还是脚本模式？如果你删除程序中的括号或引号并尝试运行，会发生什么？


    ## 下一步：循环和代码缩进


    就像 Scratch 使用积木块栈来控制程序的哪些部分与其他部分连接一样，Python 有自己的控制程序运行顺序的方法：缩进。通过点击 Thonny 工具栏中的新建图标
    + 创建新程序。你不会丢失现有的程序；相反，Thonny 会脚本区域上方创建一个新标签。开始输入以下内容：


    ```

    print("Loop starting!")

    for i in range(10):

    ```


    第一行向终端打印一条简单的消息，就像你的 Hello World 程序。第二行开始了一个定义循环，其工作方式与 Scratch 相同：计数器 `i` 被分配给循环并运行一系列数字——`range`
    指令被告知从 0 开始计数，但不达到 10。冒号符号 `:` 告诉 Python 下一条指令应该是循环的一部分。下一行开头有四个空格，当你按下第 2 行后的  后，Thonny
    应该会自动添加这些空格：


    ```

    print("Loop number"), i

    ```


    这些空格将该行与其他行相比向内推。这种缩进区分了循环外部指令和循环内部指令：缩进的代码被称为嵌套。


