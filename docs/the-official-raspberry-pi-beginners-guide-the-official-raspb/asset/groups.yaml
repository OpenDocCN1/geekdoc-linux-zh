    # # Project 1: Turtle Snowflakes


    Now you understand how Python works, it''s time to play with graphics and create
    a snowflake using a tool known as a turtle.


    ONLINE PROJECT:This project is also available at rpf.io/turtle-snowflakes


    Originally physical robots shaped their animal namesakes, turtles are designed
    to move in a straight line, turn, and to lift and lower a pen – in the digital
    version, simply meaning to start or stop drawing line as it moves. Unlike some
    other languages, namely Logo and its many variants, Python doesn''t have a turtle
    tool built into it - it comes with a library of add-on code to give it turtle
    power. Libraries are bundles of code which add new instructions to expand the
    capabilities of Python, and are brought into your programs using an import command.

    Create a new program by clicking on the New icon ✚, and type the following:


    ```

    turtle

    ```


    When using instructions included in a library, you have to use the library name
    followed by a full stop, the instruction name. Can be annoying to type every time,
    so you can assign a shorter variable name instead – it could be just one letter,
    but we thought it might be nice to use it as a name for the turtle. Type the following:


    ```

    pat = turtle.Turtle()

    ```


    To test your program, you''ll need to give your turtle something to do. Type:


    ```

    pat.forward(100)

    ```


    Click the Run icon, and save your program as Turtle Snowflakes. When the program
    has, a new window ''Turtle Graphics'' will appear and you''ll see the result of
    your program: your turtle, Pat, will move forward 100 units, drawing a straight
    line (Figure 5-8).'
