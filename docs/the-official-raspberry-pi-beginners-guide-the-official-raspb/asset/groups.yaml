    下一个屏幕将要求你更改 ''pi'' 用户的密码（默认为 ''raspberry''）——出于安全考虑，创建一个新密码是一个非常好的主意。在框中输入密码（**图
    3-3**）。在你满意后，点击“下一步”。


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_37_0.png)


    **图 3-3：** 设置新密码


    下一个屏幕会询问屏幕边缘是否有黑色边框（**图 3-4**）。如果树莓派桌面填满了你的整个电视或显示器，请不要勾选该框；如果它周围有黑色边框且比你的电视或显示器小，请勾选该框。准备好继续时，请点击“下一步”。


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_37_1.png)


    **图 3-4：** 检查无黑色边框


    后续屏幕将允许你从列表中选择 WiFi 网络（**图 3-5**）。使用鼠标或键盘滚动网络列表，找到你的网络名称，点击它，然后点击“下一步”。假设你的无线网络是安全的（它确实应该是安全的），系统会要求你输入密码（也称为预共享密钥）；这通常写在路由器的附带卡上或路由器底部。点击“下一步”连接网络。如果你不想连接到无线网络，请点击“跳过”。


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_38_0.png)


    **图 3-5：** 选择无线网络


    # 无线网络


    内置无线网络仅适用于树莓派 3、Pi 4 和 Pi Zero 系列。如果你想在带有无线网络的其他树莓派型号上使用，则你需要一个 USB WiFi 适配器。


    下一个屏幕将允许你检查并为 Raspberry Pi OS 以及树莓派上的其他软件安装可用更新（**图 3-6**）。树莓派 OS 会定期更新以修复漏洞、添加新功能并提高性能。要安装这些更新，请点击“下一步”；否则，点击“跳过”。下载更新可能需要几分钟，请耐心等待。更新安装完成后，将出现显示“系统是最新的”的窗口，点击
    OK 按钮。


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_38_1.png)


    **图 3-6：** 检查更新


    欢迎向导的最后一个屏幕（图 3-7）有一个简单的任务要执行：某些更改只有在重启树莓派（也称为重启动）后才会生效。如果提示执行操作，请点击“重启”按钮，树莓派将重启。此时欢迎向导将不会再次出现，它的任务已经完成，你的树莓派已准备好使用。


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_39_0.png)


    图 3-7：重启树莓派


    # 导航桌面


    安装在所有树莓派板卡上的 Raspberry Pi OS 版本正式称为“带桌面的 Raspberry Pi OS”（Raspberry Pi OS with
    desktop），指的是其主要的图形界面（图 3-8）。桌面的大部分由一张图片占据，即壁纸（图 3-8 中的 A），你运行的程序将显示在其上方。桌面的顶部是任务栏（B），它允许你加载每个程序；这些程序由任务栏中的任务（C）指示。


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_39_1.png)


    图 3-8：树莓派 OS 桌面


    # 树莓派官方新手指南


    - A 壁纸

    - B 任务栏

    - C 任务

    - D 系统托

    - E 多媒体

    - F 蓝牙图标

    - G 网络图标

    - H 音量图标

    - I 时钟

    - J 启动器（菜单）

    - L 垃圾桶图标

    - M 移动驱动器图标

    - N 窗口标题栏

    - O 最小化

    - P 最大化

    - Q 关闭


    菜单的右侧是系统（D）。如果你连接了任何移动存储设备（如 USB 闪盘）到树莓派，你会看到弹出符号（E）；点击它允许将其弹出并移除。最右侧是时钟（I）；点击它可以打开数字日历（图
    3-9）。


    **图 3-9：** 数字日历


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_40_0.png)


    喇声器图标旁边（H）；点击左键调整树莓派的音量，或点击右键选择 Pi 应使用的输出设备。如果有网络图标（G）；如果你连接到无线网络，你会看到显示为条形的信号强度；如果你连接到有线网络，只会看到两个箭头。点击网络图标将列出附近的网络（图
    10），点击旁边的蓝牙图标（F）允许你连接到附近的设备。


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_40_1.png)


    **图 10：** 列出附近的网络


