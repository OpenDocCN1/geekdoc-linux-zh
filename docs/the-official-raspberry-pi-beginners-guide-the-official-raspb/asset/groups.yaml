    # Next steps: loops and code indentation


    Just as Scratch uses stacks of jigsaw-like blocks to control which bits of the
    program are connected to which bits, Python has its own way of controlling the
    sequence in which its programs run: indentation. Create a new program by clicking
    the New icon + in the Thony toolbar. You won''t lose your existing program; instead,
    Thony will create a new tab above the script area. Start by typing in the following:


    ```

    print("Loop starting!")

    for i in range(10):

    ```


    The first line prints a simple message to the shell, just like your Hello World
    program. The second begins a definite loop, which works in the same way as Scratch:
    A counter, 1, is assigned to the loop and runs a series of numbers – the range
    instruction, which is told to start at the number 0 and count upwards, but never
    reaching, the number 10 – to count. The colon symbol:) tells Python that the next
    instruction should be part of the loop. In Scratch, the instructions to be included
    in the loop are literally inside the C-shaped block. Python uses a different approach:
    indenting code. The next line starts with four blank spaces, which Thony should
    have added when you pressed ENTER after line 2:


    ```

    print("Loop number"), i

    ```


    The blank spaces push this line inwards compared to the other lines. This indentation
    tells the difference between instructions outside the loop and instructions inside
    the loop: the indented code is known as nested.


    You''ll notice when you pressed ENTER at the end of the third line, Thony automatically
    indented the next line, assuming it would be part of the loop. To remove this,
    just press the BACKSPACE once before typing the fourth line:'
