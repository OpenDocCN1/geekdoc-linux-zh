  - '[PAGE 234]


    # System tab


    The System tab holds options which control various Raspberry Pi OS system settings.


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_234_0.png)


    +   **Password**: Click the ''Change Password...'' button to set a new password
    for your current user account. By default this is the ‘pi’ account.


    +   **Hostname**: The name by which a Raspberry Pi identifies itself on networks.
    If you have more than one Raspberry Pi on the same network, they must each have
    a unique name of their own.


    +   **Boot**: Setting this to ''To Desktop'' (the default) loads the familiar
    Raspberry Pi OS desktop; setting it to ''To CLI'' loads the command-line interface
    as described in **Appendix C, The Command-Line Interface.**


    +   **Auto Login**: When ''As current user'' is ticked (the default), Raspberry
    Pi OS will load the desktop without you to type in your user name and password.


    +   **Network at Boot**: When ''Wait for network'' is ticked, Raspberry Pi OS
    will not load until a working network connection.


    +   **Splash Screen**: When set to ''Enabled'' (the default), Raspberry Pi OS''s
    boot messages are hidden behind a graphical splash screen.'
  - '[PAGE 235]


    # Display tab


    The Display tab holds settings which control how the screen is displayed.


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_235_0.png)


    **Underscan:** This setting controls whether or not the video output on Raspberry
    Pi includes black bars around its edges, compensate for the frame of many TVs.
    If you see black bars, set this to ‘Disabled’; if not, leave it on ‘Enabled’.


    **Pixel Doubling:** If you''re using a high-resolution but small-size display,
    you can turn on Pixel Doubling to make everything on the screen bigger and easier
    to see.


    **Composite Video:** This controls the composite video output on the combined
    audio-video (AV) jack, when used with a tip-ring-ring-sleeve (TRRS) adapter. If
    you want to use the composite video instead of HDMI, set this to ‘Enabled’; otherwise,
    leave it disabled.


    **Screen Blanking:** This option enables you turn screen blanking (the timeout
    which turns the display off after a few minutes) on and off.


    # Interfaces tab


    The Interfaces tab holds settings which control the hardware interfaces available
    on Raspberry Pi.


    **Camera:** Enables or disables the Camera Serial Interface (CSI), for use with
    a Raspberry Pi Camera Module.'
  - '[PAGE 236]


    SSH: Enables/disables the Secure Shell (SSH) interface; it allows you to open
    a command-line interface on Raspberry Pi from another computer on your network
    using an SSH client.


    VNC: Enables/disables the Virtual Network Computing (VNC) interface; it allows
    you to view the desktop on Raspberry Pi from another computer on your network
    using a VNC client.


    SPI: Enables or disables the Serial Peripheral Interface (SPI), used to control
    hardware add-ons which connect to the GPIO pins.


    I2C: Enables or disables the Inter-Integrated Circuit (IPC) interface, used to
    control hardware add-ons which connect to the GPIO pins.


    Serial Port: Enables or disables Raspberry Pi’s serial port, available on the
    GPIO pins.


    Serial Console: Enables or disables the serial console, a command-line interface
    available on the serial port. This option is only available if the Serial Port
    setting is set to Enabled.


    1-Wire: Enables or disables the 1-Wire interface, used to control some hardware
    add-ons which connect to the GPIO pins.


    Remote GPIO: Enables or disables a network service which allows you to control
    Raspberry Pi’s GPIO pins from another computer on your network using the GPIO
    Zero library. More information on remote GPIO is available from gpiozero.readthedocs.io.


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_236_0.png)'
  - '[PAGE 237]


    # Performance tab


    The Performance tab holds settings which control how much memory is available
    and how fast Raspberry Pi''s processor runs.


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_237_0.png)


    +   - **Overclock**: Allows you to choose from a range of settings that increase
    the performance of your Raspberry Pi at the cost of increased power usage, heat
    generation, and possible decreased overall lifespan. Not available on all models
    of Raspberry Pi.

    - **GPU Memory**: Allows you to set the amount of memory reserved for use by Raspberry
    Pi''s graphics processor. Values higher than the default for general-purpose GPU
    (GPGPU) may improve performance for complicated 3D rendering and general-purpose
    tasks at the cost of reducing the memory available to Raspberry Pi OS; lower values
    may improve performance for memory-intensive tasks at the cost of making 3D rendering,
    camera, and selected video playback features perform more slowly or become unavailable.

    - **Overlay File System**: Allows you to lock Raspberry Pi''s file system down
    so that changes only get made to a virtual RAM disk rather than being written
    to the microSD card, so you go back to a clean state whenever you reboot.'
  - '[PAGE 238]


    # Localisation tab


    The Localisation tab holds settings which control which region your Raspberry
    Pi is designed to operate in, including keyboard layout settings.


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_238_0.png)


    +   **Locale:** Allows you to choose your locale, a system setting which includes
    language, country, and character set. Please note that changing the language here
    will only change the displayed language in applications for which a translation
    is available.


    +   **Time:** Allows you to choose your regional time zone, selecting an area
    of the world followed by the closest city. If your Raspberry Pi is connected to
    the network then the clock being the wrong time, it is usually caused by the wrong
    time zone selected.


    +   **Keyboard:** Allows you to choose your keyboard type, language, and layout.
    If you find your keyboard types the wrong letters or symbols, you can correct
    it.


    +   **WiFi Country:** Allows you to set your country for radio regulation purposes.
    Make sure to select the country in which your Raspberry Pi is being used: selecting
    a different country may make it impossible to connect to nearby WiFi access points
    and can be a breach of broadcasting law. A country must be set before the WiFi
    radio can be used.'
  - '[PAGE 239]


    # # Appendix F

    # High Quality Camera setup


    The High Quality Camera (HQ Camera for short) can capture higher-resolution images
    than the standard Camera Module. Unlike the latter, it doesn''t have a lens already
    attached. Instead, it can be used with any standard C or CS-mount lens; 6 mm lenses
    are available to purchase with the camera to help you get started.


    # ## 6mm CS-mount lens


    A low-cost 6 mm lens is available for the HQ Camera. This lens is suitable for
    basic photography. It can also be used for macro photography because it can focus
    objects at very short distances.


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_239_0.png)'
  - '[PAGE 240]


    The dust cap should be used when a lens is not attached, as the camera sensor
    is sensitive to dust


    Supplied with the camera, the C-CS adapter should be used when attaching a C-mount
    lens


    Use this screw to lock the back focus adjustment ring in position


    This ring can be used to adjust the focus when using a fixed-focus lens, or to
    alter the focal range of an attached adjustable-focus lens


    This enables you to mount the camera on a standard tripod: take care not to damage
    the ribbon when screwing the tripod on the camera


    The camera is supplied with a 20 cm ribbon cable to connect it to Raspberry Pi''s
    Camera port, but longer cables are available if needed


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_240_0.png)


    # Fitting the lens


    The 6 mm lens is a CS-mount device, so does not need the C-CS adapter ring (see
    diagram above). It won''t focus properly if the adapter is fitted – so, if necessary,
    remove it. Then rotate the lens clockwise all the way into the back focus adjustment
    ring.


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_240_1.png)


    # Back focus adjustment ring and lock screw


    The back focus adjustment ring should be screwed in fully for the shortest possible
    focal-length. Use the back focus lock screw to make sure it does not move out
    of this position when adjusting the aperture or focus.


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_240_2.png)'
- md: '

    ## 03 Aperture


    To adjust the aperture, hold the camera with the lens facing away from you. Turn
    the middle ring while holding the outer ring, furthest from the camera, steady.
    Turn clockwise to close the aperture and reduce image brightness. Turn anti-clockwise
    to open the aperture. Once you are happy with the light level, tighten the screw
    on the side of the lens to lock the aperture.


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_241_0.png)


    ## 04 Focus


    First, lock the inner focus ring, labelled ''NEAR ► FAR'', in position by tightening
    its screw. Now hold the camera with the lens facing away from you. Hold the outer
    two rings of the lens and turn them both clockwise until the image comes into
    focus – it''ll take four or five whole turns. To adjust focus, turn the outer
    rings clockwise to focus on a nearby object. Turn them anti-clockwise to focus
    on a distant object. You may find need to adjust the aperture after this.


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_241_1.png)


    ## 16mm C-mount lens


    The 16 mm lens provides a higher-quality image than the 6 mm lens. It has a narrow
    angle of view which is more suited to viewing distant objects.


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_241_2.png)


    ## 01 Fitting the C-CS adapter


    Ensure the C-CS adapter that comes with the HQ Camera is fitted to the 16 mm lens.
    The lens is a C-mount device, so it has a longer back focus than the 6 mm lens
    and therefore requires the adapter.


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_241_3.png)


    ## 02 Fitting the lens to the camera


    Rotate the 16 mm lens and C-CS adapter all the way into the back focus adjustment
    ring.


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_242_0.png)


    ## 03 Back focus adjustment ring


    The back focus adjustment ring should be screwed in. Use the back screw to make
    sure it does not move out of this position.


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_242_1.png)


    ## 04 Aperture


    To adjust the aperture, hold the camera with the lens facing away from you. Turn
    the inner ring, closest to the camera, while holding the camera steady. Turn clockwise
    to close the aperture and reduce image brightness. Turn anti-clockwise to open
    the aperture. Once you are happy with the light level, tighten the screw on the
    side of the lens to lock the aperture.


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_242_2.png)


    ## 05 Focus


    To adjust focus, hold the camera with the lens facing away from you. Turn the
    focus ring, labelled ''NEAR ► FAR'', anti-clockwise to focus on a nearby object.
    Turn clockwise to focus on a distant object. You may find need to adjust the aperture
    after this.


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_242_3.png)


    ## Appendix: Raspberry Pi specifications


    The various components and features of Raspberry Pi are known as its specifications,
    and a look at the specifications gives you the information you need to compare
    computers. These specifications can seem confusing at first, but they are included
    here for the curious reader.


    Raspberry Pi 4 Model B and Raspberry Pi 400''s system-on-chip is a Broadcom BCM2711
    which features quad 64-bit Cortex-A72 CPU cores, each running at 1.5GHz or 1.8GHz,
    and a Broadcom VideoCore VI graphics unit (GPU) running at 500MHz for video and
    3D rendering tasks.


    The system is connected to 2GB, 4GB, or 8GB of LPDDR4 (Low-Power Data-Rate 4)
    RAM (random-access memory) which runs at 3200MHz. The microSD card slot supports
    up to 512GB of storage. The Ethernet port supports gigabit (1000Mbps, 1000Base-T)
    connections, while the radio supports 802.11ac WiFi networks on 2.4GHz and 5GHz
    frequency bands, Bluetooth 5.0, and Bluetooth Low Energy (BLE) connections.


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_244_0.png)


    Broken down into a bullet list, Raspberry Pi 4''s specifications look like this:


    - CPU:64-bit quad-core Cortex-A72 at 1.5GHz

    - GPU: VideoCore VI at 500MHz

    - RAM: 1GB, 2GB, or 4GB of LPDDR4

    - Networking: Gigabit Ethernet, dual-band 802.11ac, Bluetooth 5.0, Bluetooth Low
    Energy

    - Audio/Video Outputs: 3.5 mm analogue AV jack, 2 × micro-HDMI 2.0

    - Connectivity: 2 × USB 2.0 ports, 2 × USB 3.0 ports, Camera Serial Interface,
    Display Serial Interface (DSI)

    - Storage: microSD, up to 512GB

    - Power: 5 volts at 3 amps via USB Type-C

    - Extras: 40-pin GPIO header, Power over Ethernet compatibility (with additional
    hardware)


    Raspberry Pi 400''s specifications are:


    - CPU:64-bit quad-core Cortex-A72 at 1.8GHz

    - GPU: VideoCore VI at 500MHz

    - RAM: 4GB of LPDDR4

    - Networking: Gigabit Ethernet, dual-band 802.11ac, Bluetooth 5.0, Bluetooth Low
    Energy

    - Audio/Video Outputs: 2 × micro-HDMI 2.0

    - Peripheral Connectivity: 1 × USB 2.0 port, 2 × USB 3.0 ports

    - Storage: microSD, up to 512GB

    - Power: 5 volts at 3 amps via USB Type-C

    - Extras: 40-pin GPIO header, Power over Ethernet compatibility (with additional
    hardware)


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_245_0.png)


