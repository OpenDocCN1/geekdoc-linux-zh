    +   * LibreOffice Base: A database; a tool for storing information, looking it
    up quickly, and analysing it.


    +   * LibreOffice Calc: A spreadsheet; a tool for handling numbers and creating
    charts and graphs.


    +   * LibreOffice Draw: An illustration program; a tool for creating pictures
    and diagrams.


    +   * LibreOffice Impress: A presentation program, for creating slides and running
    slideshows.


    +   * LibreOffice Math: A formula editor; a tool for creating properly formatted
    mathematical formulae which can then be used in other documents.


    LibreOffice is also available for other computers and operating systems. If you
    enjoy on your Raspberry Pi, you can download it for free from libreoffice.org
    and install it on any Microsoft Windows, Apple macOS or Linux.


    If you want to know more about using LibreOffice, click on the Help menu. Otherwise,
    close LibreOffice Writer by clicking the close button at the top-right of the
    window.


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_47_1.png)


    # GETTING HELP


    Most programs include a Help menu which has everything from information about
    what the program is guides on how to use it. If you ever feel lost or overwhelmed
    by a program, look for the Help menu to reorient yourself.'
