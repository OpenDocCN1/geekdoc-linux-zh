    # Setting up Raspberry Pi 400


    Unlike Raspberry Pi 4, Raspberry Pi 400 comes with a built-in keyboard and the
    microSD card already installed. You''ll still need to connect a few cables to
    get started, but it should only take a few minutes.


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_31_0.png)


    # Connecting a mouse


    Raspberry Pi 400''s keyboard is already connected, leaving you with just the mouse
    to add. Take the USB cable at the end of the mouse and insert it into any of the
    three USB ports (2.0 or 3.0) on the rear of Raspberry Pi 400. If you want to save
    the two high-speed USB 3.0 ports for other accessories, use the white port.


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_31_1.png)


    The USB connector should slide home without too much pressure; if you''re having
    to force the connector in, there''s something wrong. Check that the USB connector
    is the right way up!'
