    Using what you''ve learned in this chapter, and your knowledge of how to connect
    hardware Raspberry Pi’s GPIO header from Chapter 6, Physical Computing, it''s
    time to build something special: your own stop-motion animation studio.


    Stop-motion animation is the process of taking lots of pictures of still objects,
    like model cars or action figures, and moving the objects slicght between each
    picture. Although the objects never move in any of the pictures, if you show them
    one after another quickly enough it''ll look like they''re moving as quickly or
    as slowly as you like!'
