    \n为了模拟行人过路，你需要让程序监控按钮是否被按下。如果程序目前正在运行，点击红色模块停止程序。在你的脚本上拖入一个“否则（else）”模块并将其连接，使其直接位于你的“重复执行”模块下方，并将你的交通灯序列放在“如果...那么（if\
