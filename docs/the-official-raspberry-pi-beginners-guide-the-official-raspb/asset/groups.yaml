    bit sticking out of the bottom connects into the hole at the top of your say Hello!
    block until you see a white outline, then let go of the mouse button. You don''t
    have to be precise; if it''s close enough, the block will snap into place just
    like a jigsaw piece. If it doesn''t, click and hold on it again to adjust its
    position until it does.


    ```

    when clicked

    say Hello!

    ```


    Your program is now complete. To make it work, known as running the program, click
