    # # Appendix E

    # Raspberry Pi Configuration Tool


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_233_0.png)


    The Raspberry Pi Configuration Tool is a powerful package for adjusting numerous
    settings on your Raspberry Pi, from the interfaces available to programs to controlling
    it a network. It can be a little daunting to newcomers, though, so this appendix
    will walk you through each of the settings in turn and explain their purposes.


    You can load the Raspberry Pi Configuration Tool from the raspberry icon menu,
    under the Preferences category. It can also be run from the command-line interface
    or Terminal using the command `raspi-config`. The layouts of the command-line
    version and the graphical version are different, with options appearing in different
    categories, depending on which version you use; this appendix is based on the
    graphical version.


    > > WARNING!

    Unless you know you need a particular setting changed, it''s best to leave the
    Raspberry Pi Configuration Tool alone. If you''re adding new hardware to your
    Raspberry Pi, such as an audio HAT or a Camera Module, the instructions will tell
    you which setting to change; otherwise, the default settings should generally
    be left alone.'
