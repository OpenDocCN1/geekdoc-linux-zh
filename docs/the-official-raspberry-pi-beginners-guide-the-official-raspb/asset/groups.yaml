    ## CHALLENGE: REPEAT THE MESSAGE


    Can you use your knowledge of loops to have a scrolling message repeat itself?
    Can you make a program that spells out a word letter-by-letter using different
    colours?


    ## Greetings from Python


    Load Thny by clicking on the raspberry menu icon, choosing Programming, and clicking
    on Thny. If you''re using the Sense HAT emulator and it gets covered by the Thny
    window, click and hold the mouse button on either window''s title bar – at the
    top, in blue – drag it to move it around the desktop until you can see both windows.


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_160_0.png)


    ## PYTHON LINE CHANGE


    Python code written for a physical Sense HAT runs on the Sense HAT emulator, and
    vice-versa, with only one change. If you''re using the Sense HAT emulator with
    Python you''ll need to change the line from `sense_hat import SenseHat` in all
    the programs from this chapter to `sense_emu import SenseHat` instead. If you
    want to run them on a physical Sense HAT again, just change the line back!


    To use the Sense HAT, or Sense HAT emulator, in a Python program, you need to
    import the Sense HAT library. Type the following into the script area, remembering
    to use sense_emu (in place of sense_hat) if you''re using the Sense HAT emulator:


    ```python

    from sense_hat import SenseHat

    sense = SenseHat()

    ```


    The Sense HAT library has a simple function for taking a message, formatting it
    so that it can be shown on the LED display, and scrolling smoothly. Type the following:


    ```python

    sense.show_message("Hello, World!")

    ```


    Save your program as Hello Sense HAT, then click the Run button. You''ll see your
    message scroll slowly across the Sense HAT LED matrix, lighting up the LED pixels
    to form each letter in turn (Figure 7-7, overleaf). Congratulations: your program''s
    a success!


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_161_0.png)


    ## Figure 7-7: Scrolling a message across the LED matrix


    The show_message() function has more tricks up its sleeve than, though. Go back
    to your program and edit the last line so it says:


    ```python

    sense.show_message("Hello, World!", text_colour=(255, 255, 0), back_colour=(0,
    0, 255), scroll_speed=(0.05))

    ```


    These extra instructions, separated by commas, are known as parameters, and they
    control various aspects of the show_message() function. The simplest is `scroll_speed()`,
    which changes how quickly the message scrolls across the screen. A value of 0.05
    scrolls at roughly twice the usual speed. The bigger the number, the lower the
    speed.


    The `text_colour()` and `back_colour()` parameters – spelled in the British English,
    unlike most Python – set the colour of the writing and the background respectively.
    They don''t accept names of colours; you have to state the colour as a trio of
    numbers. The first number represents the amount of red, the second represents
    the amount of green, and the third represents the amount of blue. The values range
    from 0 to 255.


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_162_0.png)


    Figure 7-8: Changing the message

