    BY-NC-SA 3.0）。


    # 欢迎阅读官方树莓派入门指南


    我们认为你会喜欢树莓派的。无论你拥有哪种型号——带有集成键盘的新型树莓派 400——这种廉价的电脑都可以用于学习编程、构建机器人以及创建各种奇妙有趣的项目。


    树莓派能够完成你对电脑所期待的一切——从浏览网页、玩游戏，到看电影和听音乐。但树莓派不仅仅是一台现代电脑。


    通过树莓派，你可以进入电脑的核心。你可以设置操作系统，并将电线和电路直接连接到它的 GPIO 引脚。它的设计初目的是教年轻人如何使用 Scratch 和 Python
    等语言进行编程，官方操作系统包含了所有主要的编程语言。


    世界对程序员的需求比任何时候都大，而树莓派激发了新一代对科学的热的热。


    各个年龄段的人使用树莓派创建令人兴奋的项目：从复古游戏到连接网络的气象站。如果你想制作游戏、构建机器人或破解各种奇妙项目，这本书将帮助你起步。


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_4_0.png)


    # 关于作者


    Gareth Halfacree 是一位自由职业技术记者、作家，曾任教育领域的系统管理员。他对开源软件和硬件充满热情，是树莓派平台的早期采用者，并编写了多本关于其功能和灵活性的出版物。你可以在
    Twitter 上通过 @ghalfacree 找到他，或者通过他的网站 freelance.halffacree.co.uk 联系他。


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_5_0.png)


    # 目录


    ## 第 1 章：认识你的树莓派

    带上你的新电脑览之旅


    ## 第 2 章：开始使用树莓派

    连接让树莓派工作的所有设备


    ## 第 3 章：使用你的树莓派

    学习关于树莓派操作系统的知识


    ## 第 4 章：使用 Scratch 3 编程

    使用这种易于学习的基于块语言开始编码


    ## 第 5 章：使用 Python 编程

    掌握使用 Python 进行基于文本的代码


    ## 第 6 章：使用 Scratch 和 Python 进行物理计算

    控制连接到树莓派 GPIO 引脚的电子元件


    ## 第 7 章：使用 Sense HAT 进行物理计算

    使用此扩展板的传感器和 LED 矩阵显示


    ## 第 8 章：树莓派摄像头模块

    使用这款微型摄像头拍摄高分辨率照片和视频


