  - '[PAGE 82]


    To complete the Olympic feel, you''ll need to add some music. Click on the Sounds
    tab above the blocks palette, then click the ''Choose a Sound'' icon ![]( ). Click
    on the Loops category, then browse through the list (**Figure 4-19**) until you
    find some music you like – we''ve picked ''Dance Around''. Click on the OK button
    to choose the music, then click on the Code tab to open the code area.


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_82_1.png)


    **Figure 4-19:** Select a music loop from the sound library


    Add another when clicked Events block to your code area, then add a forever Control
    block. Inside this Control block, add a play sound dance until done block – remembering
    to look for the name of whatever piece of music you chose – and click the green
    flag to test your new program. If you want to stop the music, click the red octagon
    to stop the program and silence the sound!'
