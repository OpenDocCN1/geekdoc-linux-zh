    +   Figure 1-3: Raspberry Pi’s random access memory (RAM)


    The top right of the board you''ll find another metal lid (Figure 1-4) covering
    the radio, the component which gives Raspberry Pi the ability to communicate with
    devices wirelessly. The radio itself acts as two components, in fact: a WiFi radio,
    for connecting to computer networks; and a Bluetooth radio, for connecting to
    peripherals like mice and for sending data to or receiving data from nearby smart
    devices like sensors or smartphones.


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_11_1.png)


    +   Figure 1-4: Raspberry Pi’s radio module


    # THE OFFICIAL RASPBERRY PI4 BEGINNER''S GUIDE


    Another black, plastic-covered chip can be seen to the bottom edge of the board,
    just behind the middle set of USB ports. This is the USB controller, and is responsible
    for running the USB ports. Next to this is another smaller chip, the network controller,
    which handles Raspberry Pi''s Ethernet port. A final black chip, smaller than
    the rest, can be found a little bit above the Type-C power connector to the upper-left
    of the board (Figure 1-5); this is known as a power management circuit (PMIC),
    and handles turning the power that comes in into the power Raspberry Pi needs
    to run.


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_12_0.png)


    Figure 1-5: Raspberry Pi''s power management circuit (PMIC)


    Don''t worry if this seems like a lot: you don''t need to know what each component
    is or where to find it on the board in order to use Raspberry Pi.


    ## Raspberry Pi''s ports


    Raspberry Pi has a range of ports, starting with four Universal Serial Bus (USB)
    ports (Figure 1-6) to the middle and right-hand side of the bottom edge. These
    ports let you connect any USB-compatible peripheral, from keyboards and mice to
    digital cameras and flash drives, to Raspberry Pi. Speaking technically, there
    are two types of ports: the ones with black parts are USB 2.0 ports, based on
    version two of the Universal Serial Bus standard; the ones with blue parts are
    faster USB 3.0 ports, based on version three.


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_13_0.png)


    +   Figure 1-6: Raspberry Pi''s USB ports


    To the right of the USB ports is an Ethernet port, also known as a network port
    (Figure 1-7). You can use this port to connect Raspberry Pi to a wired computer
    network using a cable with what is known as an RJ45 connector on its end. If you
    look closely at the Ethernet port, you''ll see two light-emitting diodes (LEDs)
    at the bottom; these are status LEDs, and let you know that the connection is
    working.


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_14_0.png)


    Figure 1-7: Raspberry Pi''s Ethernet port


    Just above the USB ports, on the left-hand edge of Raspberry Pi, is a 3.5 mm audio-visual
    (AV) jack (Figure 1-8). This is also known as the headphone jack, and it can be
    used for that purpose – though you''ll get better sound connecting it to amplified
    speakers rather than headphones. It has an extra feature, though: as well as audio,
    the 3.5 mm AV jack carries a video signal which can be connected to TVs, projectors,
    and other displays that support a composite video signal using a special cable
    known as a tip-ring-ring-sleeve (TRRS) adapter.


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_14_1.png)


    Figure 1-8: Raspberry Pi''s 3.5 mm AV jack


    Directly above the 3.5 mm AV jack is a strange-looking connector with a plastic
    flap which can be pulled up; this is the camera connector, also known as the Camera
    Serial Interface (CSI) (Figure 1-9). This allows you to use the specially designed
    Raspberry Pi Camera Module (about which you''ll learn more in Chapter 8, Raspberry
    Pi Camera Module).


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_15_0.png)


    ▲ Figure 1-9: Raspberry Pi’s camera connector


    Above that, still on the left-hand edge of the board, are the micro High Definition
    Multimedia Interface (micro-HDMI) ports, which are a smaller version of the connectors
    you''ll find on a game console, set-top box, or TV (Figure 1-10). The multimedia
    part of its name tells you that it carries both audio and video signals, while
    high-definition tells you that you can expect excellent quality. You''ll use these
    to connect Raspberry Pi to one or two display devices: a computer monitor, TV,
    or projector.


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_15_1.png)


    ▲ Figure 1-10: Raspberry Pi’s micro-HDMI ports


    Above the HDMI ports is a USB Type-C power port (Figure 1-11), which you''ll use
    to connect Raspberry Pi to a power source. The USB Type-C port is a common sight
    on smartphones, tablets, and other portable devices. While you could use a standard
    mobile charger to power Raspberry Pi, for best results you should use the official
    Raspberry Pi USB Type-C Power Supply.


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_16_0.png)


    +   Figure 1-11: Raspberry Pi''s USB Type-C power port


    At the top edge of the board is another strange-looking connector (Figure 1-12),
    which at first glance appears to be identical to the camera connector. This, though,
    is the exact opposite: a display connector, or Display Serial Interface (DSI),
    designed for a display.


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_16_1.png)


    +   Figure 1-12: Raspberry Pi''s display connector (DSI)


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_17_0.png)


    Figure 1-13: Raspberry Pi''s display


    At the right-hand edge of the board you''ll find 40 pins, split into two rows
    of 20. This is the GPIO (general-purpose input/output) header, used to talk to
    additional hardware like LEDs and buttons. Just below and to the left of this
    is another header with four pins: this is the Power over Ethernet (PoE) HAT, an
    optional add-on which lets Raspberry Pi receive power from a network connection.


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_17_1.png)


    Figure 1-14: Raspberry Pi''s GPIO header


    There''s one final port on Raspberry Pi, but you won''t see it on the top. Turn
    the board and you''ll find a microSD connector on the opposite side (Figure 1-15).
    This is Raspberry Pi’s storage: the microSD card inserted here contains all the
    files you save, all the software you install, and the operating system that makes
    Raspberry Pi run.


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_18_0.png)


    +   Figure 1-15: Raspberry Pi’s microSD card connector


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_19_0.png)


    +   Figure 1-16: Raspberry Pi 400 has an integrated keyboard

