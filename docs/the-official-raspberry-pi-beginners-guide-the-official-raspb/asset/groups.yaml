    \ 0 block, then drag a multiplication block over the '0'. Drag a time reporting\
    \ block over the first blank space, then type in the number '7' into the second\
    \ space. When you're finished, your combined block reads set distance to time\
    \ *7 . This will take the time it took to press the SPACE key and multiply it\
    \ by seven, to get the distance in kilometres the ISS has travelled.\n\n![](img/0aff4cdab15427839fb48fd7c6f677d3_73_0.png)\n\
    \nAdd a wait 1 seconds block and change it to '4'. Finally, drag a say Hello!\
    \ block onto the end of your sequence and add two join blocks, as you did before.\
    \ In the first space, type 'kilometres'; in the last space, include a blank space\
    \ at the start.\n\n# THE OFFICIAL RASPBERRY PI BEGINNER'S GUIDE\n\n![](img/0aff4cdab15427839fb48fd7c6f677d3_74_0.png)\n\
    \nFinally, drag a round Operators block into the middle space. This rounds the\
    \ number to the nearest whole integer.\n\n## Chapter 4 Programming with Scratch\
    \ 3\n\n![](img/0aff4cdab15427839fb48fd7c6f677d3_75_0.png)\n\nAdd a wait 1 seconds\
    \ block and change it to '4'. Finally, drag a say Hello! block onto the end of\
    \ your sequence and add two join blocks, as you did before. In the first space,\
    \ type 'kilometres'; in the last space, include a blank space at the start.\n\n\
    # THE OFFICIAL RASPBERRY PI BEGINNER'S GUIDE\n\n![](img/0aff4cdab15427839fb48fd7c6f677d3_76_0.png)\n\
    \n![](img/0aff4cdab15427839fb48fd7c6f677d3_76_1.png)\n\n## Chapter 4 Programming\
    \ with Scratch 3\n\nTo make the cat’s motion more realistic, you can change how\
