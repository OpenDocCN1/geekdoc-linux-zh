  - '[PAGE 10]


    **Figure 1-1** shows a Raspberry Pi 4 Model B seen from above. When you''re using
    a Raspberry Pi with this book, try to keep it turned the same way as in the picture;
    if it''s turned around, it can get confusing when it comes to using things like
    the GPIO header (detailed in **Chapter 6, Physical computing with Scratch and
    Python**).


    While it may look like there''s a load packed into the tiny board, a Raspberry
    Pi is very simple to understand – starting with its components, the inner workings
    that make the device tick.


    # Raspberry Pi''s components


    Like any computer, Raspberry Pi is made up of various components, each of which
    has a role to play in making it work. The first, and arguably most important,
    of these can be found just above the centre point on the top side of the board
    (**Figure 1-2**), covered in a metal cap: the system-on-chip (SoC).


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_10_0.png)


    **Figure 1-2**: Raspberry Pi''s system-on-chip (SoC)


    The name system is a great indicator of what you would find if you prized the
    metal cover off: a silicon chip, known as an *integrated circuit*, which contains
    the bulk of Raspberry Pi''s system. This includes the *central processing unit*
    (CPU), commonly thought of as the ‘brain’ of a computer, and the *graphics processing
    unit* (GPU), which handles the visual sight of things.


    A brain is no without memory, however, and just to see of the SoC is another chip,
    which looks like a small, black, plastic square (**Figure 1-3**, overleafed).
    This is Raspberry Pi''s *random access memory* (RAM). When you''re working on
    Raspberry Pi, it''s the RAM that holds what you''re doing; only when you save
    your work will be written to the microSD card. Together, these components form
    Raspberry Pi''s volatile and non-volatile memories: the volatile loses its contents
    whenever Raspberry Pi is powered off, while the non-volatile microSD card keeps
    its contents.'
