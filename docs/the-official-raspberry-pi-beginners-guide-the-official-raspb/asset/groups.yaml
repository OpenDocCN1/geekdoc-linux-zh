    # 第 4 版


    针对树莓派 400 进行了全面更新


    # 官方树莓派入门指南


    如何使用你的新电脑


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_0_0.png)


    作者：Gareth Halfacree


    # 官方树莓派入门指南

    如何使用你的新电脑


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_3_0.png)


    由 Raspberry Pi Trading Ltd 于 2020 年首次出版，地址为：Maurice Wilkes Building,

    St. John’s Innovation Park, Cowley Road, Cambridge, CB4 0DS


