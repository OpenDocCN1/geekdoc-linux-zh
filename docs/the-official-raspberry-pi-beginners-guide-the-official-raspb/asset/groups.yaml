  - '[PAGE 50]


    The tool is split into five tabs. The first of these is System: this allows you
    to change the password of your account, set a host name – the name Raspberry Pi
    uses on your local wireless or wired network – and alter a range of other settings.
    The majority of these, though, shouldn''t need changing. Click on the Display
    tab to bring you to the next category. Here you can alter the screen display settings
    if needed, to suit your TV or monitor.


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_50_0.png)


    # MORE DETAILS


    This brief overview is simply to get you to the tool. More detailed information
    on each of its settings can be found in [Appendix E, The Raspberry Pi Configuration
    Tool].


    The Interface tab ranges of settings, all of which start disabled. These settings
    should only be changed if you''re adding new hardware, such as the Raspberry Pi
    Camera Module. The exceptions to this rule are: SSH, which enables a ‘Secure Shell’
    and lets you log into Raspberry Pi from another computer on your network using
    an SSH client; VNC, which enables a ‘Virtual Network Computer’ and lets you see
    and control the Raspberry Pi OS desktop from another computer on your network
    using a VNC client; and Remote GPIO, which lets you Raspberry Pi’s GPIO pins –
    from which you’ll learn in **Chapter 6, Physical computing with Scratch and Python**
    – from another computer on your network.


    Click on the Performance tab to see the fourth category. Here you can set the
    amount of memory used by Raspberry Pi’s graphics processing unit (GPU) and, for
    some models, increase the performance of Raspberry Pi through process known as
    *overclocking*. As before, though, it’s best to leave these settings unless you
    know you need to change them.


    Finally, click on the Localisation tab to see the last category. Here you can
    change your locale, which controls things like the language used in Raspberry
    Pi OS and how numbers are displayed, change the time zone, change the keyboard
    layout, and set your country for WiFi purposes. For now, though, just click on
    Cancel to close the tool without making any changes.


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_50_1.png)


    # WARNING!


    Different countries have different rules about what frequencies a WiFi radio can
    use. Setting the WiFi country in the Raspberry Pi Configuration Tool to a different
    country from the one you’re actually in is likely to make it struggle to connect
    to your networks and can even be illegal under radio licensing laws – so don’t
    do it!'
