  mdcn: "\n\n# 在 Python 中控制蜂鸣器\n\n通过 GPIO 库控制有源蜂鸣器与控制 LED 几乎相同，因为它们都有开启和关闭两种状态。不过，你需要一个不同的函数/类：`buzzer`。在\
    \ Thny 中启动一个新项目并将其保存为 Buzzer，然后输入以下内容：\n\n```\nfrom gpiozero import Buzzer\nfrom\
    \ time import sleep\n```\n\n与 LED 一样，GPIO 需要知道你的蜂鸣器连接在哪个引脚上以便进行控制。输入以下内容：\n\n\
    ```\nbuzzer = Buzzer(15)\n```\n\n从这里开始，你的程序与你编写的控制 LED 的程序几乎相同；唯一的区别（除了 GPIO 引脚编号不同）是你是你使用了\
    \ `buzzer` 代替了 `led`。输入以下内容：\n\n```\nwhile True:\n    buzzer.on()\n    sleep(1)\n\
    \    buzzer.off()\n    sleep(1)\n```\n\n点击运行（Run）按钮，你的蜂鸣器将开始鸣叫：开启一秒，关闭一秒。如果你使用的是无源蜂鸣器，你只会听到短暂的“点击”声，而不是持续的鸣叫：这是因为无源蜂鸣器缺乏振荡器来产生快速变化的信号，而这种信号是让蜂鸣器内部金属片振动的。\n\
    \n点击停止（Stop）按钮退出程序，但请确保此时蜂鸣器没有发出声音，否则它将持续鸣叫直到你再次运行程序！\n\n![](img/0aff4cdab15427839fb48fd7c6f677d3_140_0.png)\n\
    \n> 挑战：更好的鸣响\n> 你如何修改程序让蜂鸣器的鸣响时间更短？你能构建一个电路，通过按钮来控制蜂鸣器吗？\n\n# Scratch 项目：交通红灯\n\
    \n现在你已经学会了如何使用按钮、蜂鸣器和 LED 作为输入和输出，你准备好构建一个现实世界的示例了：交通红灯，并带有一个你可以按来以过马路的按钮。对于这个项目，你需要一个面包板；一个红色\
    \ LED、一个黄色 LED 和一个绿色 LED；三个 330 Ω 电阻；一个按键开关；以及一些公对公（M2M）和公对母（M2F）跳线线。\n\n从构建电路开始（图\
    \ 6-6），将蜂鸣器连接到 GPIO 15 引脚（图 6-6 中标记为 GP15），红色 LED 连接到 GPIO 25 引脚（标记为 GP25），黄色\
    \ LED 连接到 GPIO 8（GP8），绿色 LED 连接到 GPIO 7（GP7），并将开关连接到 GPIO 2（GP2）。记住将 330 Ω 电阻连接在\
    \ GPIO 引脚和 LED 的长脚之间，并将所有组件的第二个引脚连接到面包板的地线。最后，将地线轨连接到树莓派上的地引脚（标记为 GND）以完成电路。\n\
    \n![](img/0aff4cdab15427839fb48fd7c6f677d3_141_0.png)\n\n- *图 6-6：交通红灯项目的接线图*\n\
    \n在 Scratch 3 中启动一个新项目，在代码区域拖入一个“当被点击时（when clicked）”模块。接下来，你需要告诉 Scratch 电路中连接到按键开关的\
    \ GPIO 2 引脚是输入而不是输出：从模块色板的 Raspberry Pi GPIO 分类中，在“当被点击时”模块下方拖入一个“将 gpio 设置为输入拉高（set\
    \ gpio to input high）”模块。点击向下箭头指向“0”，并从下拉列表中选择数字 2。\n\n```\nwhen clicked\nset\
    \ gpio 2 to input pulled high\n```\n\n接下来，你需要创建你的交通灯序列。在程序中拖入一个“重复执行（forever）”模块，然后用模块填充它，按模式控制交通红灯\
    \ LED 的亮灭。记住哪些 GPIO 引脚连接了组件：当你使用引脚 25 控制红灯时，引脚 8 是黄色 LED，引脚 7 是绿色 LED。\n\n```\n\
    when clicked\nset gpio 25 to input pulled high\nforever\nset gpio 25 to output\
    \ high\nwait 5 seconds\nset gpio 8 to output high\nwait 2 seconds\nset gpio 25\
    \ to output low\nset gpio 8 to output low\nset gpio 7 to output high\nwait 5 seconds\n\
    set gpio 7 to output low\nset gpio 8 to output high\nwait 5 seconds\nset gpio\
