    # Installing the camera


    Like any hardware add-on, the Camera Module or HQ Camera should only be connected
    to or disconnected from Raspberry Pi when the power is off and the power cable
    unplugged. If your Raspberry Pi is turned on, choose Shutdown from the raspberry
    menu, wait for it to power off, and unplug it.


    In most cases, the supplied ribbon cable will already be connected to the Camera
    Module or HQ Camera; if it isn''t, turn your camera upside-down so the sensor
    is on the bottom and look for a flat plastic connector. Carefully hook your fingernails
    around the sticking-out edges and pull outwards until the connector pulls out.
    Slide the ribbon cable, with the silver edges downwards and the blue plastic facing
    upwards, under the flap you just pulled out, then push the flap gently back into
    place with a click (**Figure 8-1**); it doesn''t matter which end of the cable
    you use. If the cable is installed properly, it will be straight and won''t come
    out if you give it a gentle tug; if not, pull the flap out and try again.


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_197_0.png)


    +   Figure 8-1: Connecting the ribbon cable to the Camera Module


    Find the other end of the cable the same way. Find the Camera (or CSI) port on
    Raspberry Pi and pull the flap gently upwards. If your Raspberry Pi is installed
    in a case, you might it easier to remove it first. With Raspberry Pi positioned
    so the HDMI port is facing you, slide the ribbon cable so the silver edges are
    to your left and the blue plastic to your right (**Figure 8-2**), then gently
    push the flap back into place. If the cable is installed properly, it''ll be straight
    and won''t come out if you give it a gentle tug; if not, pull the flap out and
    try again.'
