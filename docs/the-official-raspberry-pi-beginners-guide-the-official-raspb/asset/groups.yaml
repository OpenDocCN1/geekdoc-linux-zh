    # Chapter 3


    # Using your Raspberry Pi


    Learn about the operating system


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_35_0.png)


    Raspberry Pi is able to run a wide range of software, including a number of different
    operating systems – the core software that makes a computer run. The most popular
    of these, and the official operating system of the Raspberry Pi Foundation, is
    Raspberry Pi OS. Based on Debian Linux, it is tailor-made for Raspberry Pi and
    comes with a range of extras pre-installed and ready to go.


    If you''ve only ever used Microsoft Windows or Apple macOS, don''t worry: Raspberry
    Pi OS is based on the same windows, icons, menus, and pointer (WIMP) principles,
    and should quickly feel familiar. The following chapter will get you started and
    introduce you to some of the bundled software.


    # The Welcome Wizard


    The first time you run Raspberry Pi OS, you''ll see the Welcome Wizard (Figure
    3-1). This helpful tool will walk you through changing some settings in Raspberry
    Pi OS, known as the configuration, to match how and where you will be using Raspberry
    Pi.'
