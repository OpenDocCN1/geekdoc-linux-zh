  - '[PAGE 81]


    To create more swimmers, add a repeat 6 block – changing from the default value
    of ''10'' and add a create clone of myself Control block inside it. To make it
    so the swimmers aren''t all swimming in the same direction, add a turn 60 degrees
    block above the create block but still inside the repeat 6 block. Click the green
    flag, and try the arrow keys now to see your swimmers come to life!


