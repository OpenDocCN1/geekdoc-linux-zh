    **Figure 1-17: The ports are found at the rear of Raspberry Pi 400**


    Next to the GPIO header is the microSD card slot. This stores the microSD card
    which acts as Raspberry Pi 400''s storage for the operating system, applications,
    and other data. The microSD card comes pre-installed in Raspberry Pi 400; you
    can remove it by pushing gently on the card until it clicks and springs out then
    pulling it out. When you pull the card back in, make sure the shiny metal contacts
    are facing downwards; the card should slide in with a gentle click.

    The next ports are USB micro-HDMI ports, for connection to a monitor, TV, or other
    display. Like Raspberry Pi 4, Raspberry Pi 400 supports up to two displays. Next
    to these are the USB Type-C power port, for connection to Raspberry Pi Power Supply
    or compatible USB power supply.

    The two blue ports are USB 3.0 ports, which provide a high-speed connection to
    devices including solid-state drives (SSDs), memory sticks, printers, and more.
    The white port to the right of these is a lower-speed USB 2.0 port, to which you
    can connect the bundled Raspberry Mouse.

    The final port is a Gigabit network port, which allows you to connect Raspberry
    Pi 400 to your network using a network cable as an alternative to using the built-in
    Wi-Fi wireless networking. You can read more about connecting Raspberry Pi 400
    to a network in Chapter 2, Getting Started with your Raspberry Pi.'
