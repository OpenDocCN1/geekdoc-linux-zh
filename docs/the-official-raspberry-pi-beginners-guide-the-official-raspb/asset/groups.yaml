    \n**Figure 6-2**: Disconnect the wire from 3V3 and connect it to the GPIO 25 pin\n\
    \nYou are now ready to create a Scratch or Python program to turn your LED on\
    \ and off.\n\n> ### CODING KNOWLEDGE\nThe projects in this chapter need you to\
    \ be comfortable with using Scratch 3 and the Thony Python integrated development\
    \ environment (IDE). If you haven't already done so, turn to **Chapter 4, Programming\
    \ with Scratch 3**, and **Chapter 5, Programming with Python**, and work through\
    \ those projects first.\n\n## LED control in Scratch\n\nLoad Scratch 3 and click\
    \ on the Add Extension icon. Scroll down to find the 'Raspberry Pi GPIO' extension\
    \ (**Figure 6-3**, overall), then click on it. This loads the blocks you need\
    \ to control Raspberry Pi's GPIO header from Scratch 3. You'll see the new blocks\
    \ appear in the blocks palette; when you need them, they're available in the Raspberry\
    \ Pi GPIO category.\n\n![](img/0aff4cdab15427839fb48fd7c6f677d3_129_0.png)\n\n\
    Figure 6-3: Add the Raspberry Pi GPIO extension to Scratch 3\n\nWhen dragging\
    \ a Events block into the code area, place a set gpio to output block underneath\
    \ it. You'll need to choose the number of the pin you're using: click the small\
    \ arrow to open the drop-down selection and click on '25' to tell Scratch you're\
    \ controlling the GPIO 25 pin.\n\n```\nwhen\nset gpio 25 to output high\n```\n\
    \nClick the green flag to run your program. You'll see your LED light up: you've\
    \ programmed your first computing project! Click the red octagon to stop your\
    \ program: notice how the LED stays lit? That's because your program only ever\
