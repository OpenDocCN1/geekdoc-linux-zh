    \n**Figure 7-27**: Accelerometer readings rounded to the nearest whole number\n\
    \nYou may have noticed that the accelerometer is telling you that one of the axes\
    \ - the Z Axis, if your Raspberry Pi is flat on the table - has an acceleration\
    \ value of 1.0 gravities (1G), the Sense HAT isn't moving. That's because it's\
