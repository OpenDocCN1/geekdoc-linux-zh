    GPIO 引脚旁边是 microSD 卡插槽。它用于存储 microSD 卡，该卡作为 Raspberry Pi 400 运行操作系统、应用程序和其他数据的存储介质。Raspberry
    Pi 400 在出厂时已装了 microSD 卡；你可以通过轻轻推按卡片直到它发出“咔哒”声并弹出，然后将其拔出。当你将卡片插回去时，请确保闪亮的金属触点朝下；卡片应随着轻微的“咔哒”声滑入。


    紧接的端口是 USB micro-HDMI 端口，用于连接显示器、电视或其他显示设备。与 Raspberry Pi 4 一样，Raspberry Pi 400
    支持多达两个显示器。在它们旁边是 USB Type-C 电源端口，用于连接 Raspberry Pi 电源或兼容的 USB 电源。


    两个蓝色端口是 USB 3.0 端口，它们为包括固态硬盘 (SSD)、优存器、打印机等在内的设备提供高速连接。这些端口右侧的白色端口是速度较低的 USB 2.0
    端口，你可以在此处连接随附的 Raspberry 鼠标。


    最后一个端口是千兆以太网端口，允许你使用网线将 Raspberry Pi 400 连接到网络，作为使用内置 Wi-Fi 无线网络的替代方案。你可以在第 2
    章“开始你的 Raspberry Pi”中阅读更多关于将 Raspberry Pi 400 连接到网络的知识。


    ## 第 2 章


    ## 开始你的 Raspberry Pi


    探索你的 Raspberry Pi 所需的基本物品，以及如何将它们全部连接以完成设置并运行。


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_21_0.png)


    Raspberry Pi 的设计旨在尽可能快速、方便地设置和使用，但与任何计算机一样，它也依赖于各种外部组件，称为外设设备。虽然查看 Raspberry Pi
    的裸电路板很容易——它看起来与你熟悉的那些封闭、一体式的电脑大不相同，让你担心事情会变得复杂，但事实并非如此。只需按照本指南中的步骤操作，你可以在不到十分钟内让
    Raspberry Pi 运行起来。


    如果你是通过 Raspberry Pi 桌面套件或随 Raspberry Pi 400 收到此书，你已经拥有了几乎所需的所有物品：你只需要提供一个带有 HDMI
    连接的显示器或电视——这种接口类型与顶盒、蓝光播放器和游戏主机使用的是相同——这样你就能看到 Raspberry Pi 的运行状态了。


    如果你在没有配件的情况下购买了 Raspberry Pi，那么你还需要：


    - USB 电源——额定电流为 3 安培 (3 A) 的 5 V 电源，并带有 USB Type-C 接口器。官方 Raspberry Pi 电源是推荐选择，因为它可以应对
    Raspberry Pi 快速变化的功率需求。


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_22_0.png)


    - 带有 NOOBS 的 microSD 卡 – MicroSD 卡作为 Raspberry Pi 的永久存储器；你创建的所有文件和安装的软件，以及操作系统本身都存储在卡上。一张
    8GB 的卡就能让你开始使用，不过 16GB 的卡提供了更大的增长空间。使用预装了 NOOBS（开箱即用软件）的卡可以节省你的时间；否则，请参阅录 A 关于在空白卡上安装操作系统
    (OS) 的说明。


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_22_1.png)


    - USB 键盘和鼠标 – 键盘和鼠标允许你控制 Raspberry Pi。几乎任何带有 USB 接口的有线或无线键盘和鼠标都能与 Raspberry Pi
    工作，尽管某些“游戏”风格的键盘功耗过大，无法可靠使用。


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_22_2.png)


    - Micro-HDMI 线 – 它将声音和图像从 Raspberry Pi 传输到你的电视或显示器。线缆的一端是用于 Raspberry Pi 的 micro-HDMI
    接口；另一端是用于显示器的全尺寸 HDMI 接口。或者，你可以使用 micro-HDMI 转 HDMI 适配器和标准的全尺寸 HDMI 线。如果使用没有 HDMI
    接口的显示器，你可以购买 micro-HDMI 转 DVI-D、DisplayPort 或 VGA 的适配器。要连接到带有复合视频或 SCART 插座的老旧电视，请使用
    3.5 mm 节-环-套 (TRRS) 音视频线。


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_22_3.png)


    Raspberry Pi 在不使用外壳的情况下是安全的，只要你不放在可能会导电导致短路的金属表面上。然而，可选的外壳可以提供额外的保护；桌面套件包含了官方
    Raspberry Pi 外壳，而第三方外壳可以在所有良好的零售处购买。


    如果你想在有线网络而非无线网络（WiFi）中使用 Raspberry Pi，你还需要根网线。它的一端应连接到你的网络交换机或路由器。如果你计划使用 Raspberry
    Pi 内置的无线电台，你不需要线；但你需要知道你的无线网络的名称和密钥或密码。


    ## RASBERRY PI 400 设置


    以下说明用于设置 Raspberry Pi 4 或 Raspberry Pi 家族中的其他裸板。Raspberry Pi 400 的设置说明请见第 32 页。


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_23_0.png) 设置硬件


    首先从包装中取出 Raspberry Pi。虽然 Raspberry Pi 是坚固的，但在组装外壳时，请小心不要损坏 Raspberry Pi 的针脚。如果这些针脚弯曲，最好情况下会难以使用，最坏情况下会导致短路。


    ## 组装外壳


    如果你使用的是官方 Raspberry Pi 外壳，请将其拆分为两部分：底座和顶盖。将底座 放在 Raspberry Pi 上方。


    在安装 microSD 卡之前，将 microSD 卡放入 Raspberry Pi 的插座。


    现在，将底座的顶座，将，放在 Raspberry Pi 的插槽上。


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_24_0.png) ## 连接键盘和鼠标


    将键盘的 USB 线连接到 Raspberry Pi 上的四个 USB 端口（2.0 或 3.0）之一。如果你使用的是官方 Raspberry Pi 键盘，其背面有一个
    USB 端口用于鼠标；否则，只需将鼠标的 USB 线连接到 Raspberry Pi 上的另一个 USB 端口。


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_24_1.png) ## 连接 microSD 卡


    要安装作为 Raspberry Pi 存储器的 microSD 卡，翻转 Raspberry Pi（带外壳），将卡标签背对 Raspberry Pi 并滑入
    microSD 插槽。它只有一种插入方式，并且应该在不加太大压力的情况下滑入。


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_25_0.png) microSD 卡将滑入接口并停止，不会发出“咔哒”声。


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_25_1.png) 如果你以后想移除它，只需握住卡的一端并轻轻拔出。如果你使用的是较旧型号的
    Raspberry Pi，需要轻轻推一下卡才能解锁；这在 Raspberry Pi 3 或 4 上是不需要的。


