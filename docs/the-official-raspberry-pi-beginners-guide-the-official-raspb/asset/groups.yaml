    # Using a breadboard


    The next projects in this chapter will be much easier to complete if you''re using
    a breadboard to hold the components and make the electrical connections.


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_132_0.png)


    A breadboard is covered with holes – spaced, to match components, 2.54 mm apart.
    These holes are metal strips which act like the jumper wires you''re using now.
    These run in rows across the board, with most boards having a gap down the middle
    to split them into two halves. Many breadboards also have letters across the top
    and numbers down the sides. These allow you to find a particular hole: A1 is the
    top-left corner, B1 is the hole to the immediate right, while B2 is one hole down
    from there. A1 is connected to B1 by the hidden metal strips, but no 1 hole is
    connected to 2 hole unless you add a jumper wire yourself.


    Larger breadboards also have strips of holes down the sides, typically marked
    with red and black or blue stripes. These are the power rails, and are designed
    to be made using easier wiring: you can connect a single wire to one of the power
    rails – typically marked with a blue or black stripe and a minus symbol – to provide
    a common ground for lots of components on the breadboard, and you can do the same
    if your circuit needs 3.3 V or 5 V.


    Adding electronic components to a breadboard is simple: just line them out (the
    sticky metal parts) up with the holes and push until the component is in place.
    The connections you need to make beyond the breadboard makes for you, you can
    use male-to-male (M2M) jumper wires; for connections from the breadboard to Raspberry
    Pi, use male-to-female (M2F) jumper wires.


    Never try to cram more than one component per breadboard. Remember: holes are
    connected in columns, aside from the split in the middle, a component lead in
    A1 is electrically connected to anything you add to it B1, C1, D1, and E1.'
