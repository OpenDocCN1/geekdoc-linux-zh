    # Chapter 1


    ### Get to know your Raspberry Pi


    Get fully acquainted with your new credit-card-sized computer by taking a guided
    tour of Raspberry Pi. Discover its numerous components and what they do


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_7_0.png)


    Raspberry Pi is a remarkable device: a fully functional computer in a tiny and
    low-cost package. Whether you''re looking for a device you can use to browse the
    web or play games, are interested in how to write your own programs, or are looking
    to create your own circuits and physical devices, Raspberry Pi – and its amazing
    community – will support you step of the way.


    Raspberry Pi is known as a single-board computer, which means exactly what it
    sounds like: it''s a computer just like a desktop or laptop, but built on single
    board. Like most single-board computers, roughly the same footprint as a credit
    card – but doesn''t mean it''s not powerful: Raspberry Pi can do anything bigger
    and more power-hungry computer can, though not as quickly.


    The Raspberry Pi family was born from a desire to encourage more hands-on education
    around the world. Its creators, who joined together to form the non-profit Raspberry
    Foundation, had little idea it would prove so popular: the few thousand boards
    in 2012 were immediately sold out, and millions have been shipped all over the
    world since. These boards found their way into homes, classrooms, offices, factories,
    and even spacecraft.


    Various models of Raspberry Pi have been released since the original Model B,
    each either improved specifications or features specific to a particular use.
    The Raspberry Pi Zero, for example, is a tiny version of Raspberry Pi which drops
    a few features – in particular multiple USB ports and wired network – in favour
    of a significantly smaller layout and reduced power requirements.


    # THE OFFICIAL Raspberry PI BEGINNER''S GUIDE


    All Raspberry Pi models have one thing in common, though they''re compatible,
    meaning software written for one model will run on any other. It''s even possible
    to take the latest version of Raspberry Pi''s operating system and run it on an
    original Model B prototype. It will run more slowly, it''s true, but it will still
    run.


    Throughout this book you''ll be learning about Raspberry Pi 4 Model B and Raspberry
    Pi 400, the latest and most powerful versions of Raspberry Pi. What you learn,
    though, can be easily applied to other models in the Raspberry Pi family, so don''t
    worry if you''re using a different version.


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_8_0.png)


    # A guided tour of Raspberry Pi


    Unlike a traditional computer, which hides its inner workings in a case, a standard
    Raspberry Pi has all its components, parts, and features on display - although
    you can buy a case to provide extra protection, if you''d prefer. This makes it
    a great tool for learning what the various parts of a computer do, and also makes
    it easy to learn what goes where when it comes to plug in the various extras -
    known as peripherals - you''ll need to get started.


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_8_1.png)


    Chapter 1 Getting to know your Raspberry Pi


    - A USB-C power in

    - B display port

    - C Wireless / Bluetooth

    - D Micro-HDMI 0

    - E Micro-HDMI 1

    - F System-on-chip

    - G GPIO

    - H RAM

    - I CSI camera port

    - J 3.5mm AV

    - K PoE

    - L USB 2.0

    - M USB 3.0

    - N Ethernet port


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_9_0.png)


    Figure 1-1: Raspberry Pi 4 Model B


    **Figure 1-1** shows a Raspberry Pi 4 Model B seen from above. When you''re using
    a Raspberry Pi with this book, try to keep it turned the same way as in the picture;
    if it''s turned around, it can get confusing when it comes to using things like
    the GPIO header (detailed in **Chapter 6, Physical computing with Scratch and
    Python**).


    While it may look like there''s a load packed into the tiny board, a Raspberry
    Pi is very simple to understand – starting with its components, the inner workings
    that make the device tick.


    # Raspberry Pi''s components


    Like any computer, Raspberry Pi is made up of various components, each of which
    has a role to play in making it work. The first, and arguably most important,
    of these can be found just above the centre point on the top side of the board
    (**Figure 1-2**), covered in a metal cap: the system-on-chip (SoC).


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_10_0.png)


    **Figure 1-2**: Raspberry Pi''s system-on-chip (SoC)

