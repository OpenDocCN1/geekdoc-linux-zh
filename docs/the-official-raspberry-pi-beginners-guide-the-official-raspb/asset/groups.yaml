- md: "\n# Controlling a buzzer in Python\n\nControlling an active buzzer through\
    \ the GPIO library is almost identical to controlling an LED, in that it has on\
    \ and off states. You need a different function, though: buzzer. Start a new project\
    \ in Thny and save it as Buzzer, then type the following:\n\n```\nfrom gpiozero\
    \ import Buzzer\nfrom time import sleep\n```\n\nAs with LEDs, GPIO needs to know\
    \ which pin your buzzer is connected to in order to control it. Type the following:\n\
    \n```\nbuzzer = Buzzer(15)\n```\n\nFrom here, your program is almost identical\
    \ to the one you wrote to control the LED; the only difference (apart from a different\
    \ GPIO pin number) is you're using buzzer in place of led. Type the following:\n\
    \n```\nwhile True:\n    buzzer.on()\n    sleep(1)\n    buzzer.off()\n    sleep(1)\n\
    ```\n\nClick the Run button and your buzzer will begin to buzz: one second on,\
    \ and one second off. If you are using a passive buzzer, you'll only hear a brief\
    \ click every instead of a continuous buzz: this is because a passive buzzer lacks\
    \ an oscillator to the rapidly changing signal that makes the plates inside the\
    \ buzzer vibrate.\n\nClick the Stop button to exit the program, but make sure\
    \ the buzzer isn't making a sound at the time otherwise it will continue to buzz\
    \ until you run your program again!\n\n![](img/0aff4cdab15427839fb48fd7c6f677d3_140_0.png)\n\
    \n> CHALLENGE: A BETTER BUZZ\nHow could you change the program to make the buzzer\
    \ sound for a shorter time? Can you build a circuit so the buzzer is controlled\
    \ by a button?\n\n# Scratch project: Traffic Lights\n\nNow you know how to use\
    \ buttons, buzzers, and LEDs as inputs and outputs, you're ready to build an example\
    \ of real-world computing: traffic lights, complete with a button you can press\
    \ to cross the road. For this project, you'll need a breadboard; a red, a yellow,\
    \ and a green LED; 330 Ω resistors; a push-button switch; and a selection of male-to-male\
    \ (M2M) and male-to-female (M2F) jumper wires.\n\nStart by building the circuit\
    \ (Figure 6-6), connecting the buzzer to the GPIO 15 pin (labelled GP15 in Figure\
    \ 6-6), the red LED to GPIO 25 pin (labelled GP25), the yellow LED to GPIO 8 (GP8),\
    \ the green LED to GPIO 7 (GP7), and the switch to GPIO 2 (GP2). Remember to connect\
    \ the 330 Ω resistors between the GPIO pins and the long legs of the LEDs, and\
    \ connect the second legs on all your components to a ground breadboard. Finally,\
    \ connect the ground rail to a ground pin (labelled GND) on Raspberry Pi to complete\
    \ the circuit.\n\n![](img/0aff4cdab15427839fb48fd7c6f677d3_141_0.png)\n\n- *Figure\
    \ 6-6: Wiring diagram for the Traffic Lights project*\n\nStart a new project in\
    \ Scratch 3, draw a when clicked block onto the code area. Next, you'll need to\
    \ tell Scratch that the GPIO 2 pin, which is connected to the push-button switch\
    \ in your circuit, is an input rather than an output: drag a set gpio to input\
    \ high block from the Raspberry Pi GPIO category of the blocks palette under when\
    \ clicked block. Click on the down arrow to '0' and select the number 2 from the\
    \ drop-down list.\n\n```\nwhen clicked\nset gpio 2 to input pulled high\n```\n\
    \nNext, you need to create your traffic light sequence. Drag a forever block into\
    \ your program, then fill it with blocks to turn the traffic light LEDs on and\
    \ off in a pattern. Remember which GPIO pins have component attached: when you're\
    \ using pin 25 using the red light, pin 8 the yellow LED, and pin 7 the green\
    \ LED.\n\n```\nwhen clicked\nset gpio 25 to input pulled high\nforever\nset gpio\
    \ 25 to output high\nwait 5 seconds\nset gpio 8 to output high\nwait 2 seconds\n\
    set gpio 25 to output low\nset gpio 8 to output low\nset gpio 7 to output high\n\
    wait 5 seconds\nset gpio 7 to output low\nset gpio 8 to output high\nwait 5 seconds\n\
    set gpio 8 to output low\n```\n\nClick the green flag, and watch your LEDs: first\
    \ the red light, then both the red and yellow, then the green, then the yellow,\
    \ and finally the sequence repeats with the red light once more. This pattern\
    \ matches that used by traffic lights in the UK, you can edit the sequence to\
    \ match other countries, if wish.\n\nTo simulate a pedestrian crossing, you need\
    \ your program to watch for the button pressed. Click the red block to stop your\
    \ program, if it's currently running. Drag an else block onto your script and\
    \ connect it so it's directly beneath your forever block, with your traffic light\
    \ sequence in the 'if then' section. Leave the diamond-shaped gap for now.\n\n\
    ![](img/0aff4cdab15427839fb48fd7c6f677d3_143_0.png)\n\nA real pedestrian crossing\
    \ doesn't change the light to red as soon as the button is pushed, but instead\
    \ waits for the next red light. To build that into your program, drag a low block\
    \ onto code area and select '2' from its drop-down list. Then drag a pushed to\
    \ 1 block underneath it. This block watches for the button being pushed, then\
    \ sets the variable 'pushed' to 1. Setting a variable this way lets you store\
    \ the fact the button has been pushed, even though you're not going to act on\
    \ it away. Go back to your original block stack and find the `if` block. Drag\
    \ `=` into the `then` block's diamond, then drag a `pushed` reporter block into\
    \ the blank space. Type '0' over the '5' on the right-hand side of the block.\n\
    \n![](img/0aff4cdab15427839fb48fd7c6f677d3_144_0.png)\n\nClick the green flag,\
    \ and watch the traffic lights go through their sequence. Press the push-button\
    \ switch: at first it will look like nothing is happening, but once the sequence\
    \ has reached its end – with the yellow LED lit – the traffic lights will go off\
    \ and stay off to change your 'pushed' variable. All that's left is to make your\
    \ pedestrian button do something other than turn the lights off. In the main block\
    \ stack, find the else block and drag a set gpio 25 to output high it – remembering\
    \ to change the default GPIO pin number to match your pin to output.\n\nBeneath\
    \ that, still in the else block, create a pattern for the buzzer: drag a repeat\
    \ 10 block, then fill it with set gpio 15 to output high, wait 0.2 seconds, set\
    \ gpio 15 to output low, and wait 0.2 seconds, blocking the GPIO values for the\
    \ buzzer. Finally, add the bottom of your repeat 10 block but still in the else\
    \ block, add a set gpio 25 to output low and the set pushed to 0 – resetting the\
    \ variable that stores the button, so the buzzer sequence doesn't just repeat\
    \ forever. Click the green flag, then push the switch on breadboard. After the\
    \ sequence has completed, you'll see the red light on and the buzzer to let pedestrians\
    \ it is safe to cross. After a couple of seconds, the buzzer will stop and the\
    \ traffic sequence will start again and continue until the next time you press\
    \ the button.\n\nCongratulations! You have programmed your own fully functional\
    \ set of traffic lights, complete with pedestrian crossing!\n\n![](img/0aff4cdab15427839fb48fd7c6f677d3_145_0.png)\n\
    \n# CHALLENGE: CAN YOU IMPROVE IT?\n\nCan you change the program to give the pedestrian\
    \ to cross? You can find information about other countries' traffic light patterns\
    \ and reprogram your lights to match? How could you make the LEDs less bright?\n\
    \n![](img/0aff4cdab15427839fb48fd7c6f677d3_145_1.png)\n\n# Python project: Quick\
    \ Reaction Game\n\nNow know how to use buttons and LEDs as inputs and outputs,\
    \ you're ready to build an example of real-world computing: a two-player quick-reaction\
    \ game, designed to see who has the fastest reaction times! For this project you'll\
