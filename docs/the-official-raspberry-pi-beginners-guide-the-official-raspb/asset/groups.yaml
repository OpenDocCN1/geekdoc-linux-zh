    ![](img/0aff4cdab15427839fb48fd7c6f677d3_70_1.png)\n\nFigure 4-12: Drag the astronaut\
    \ sprite to the lower middle of the stage\n\nWith your new background and sprite\
    \ in place, you're ready to create your program. Start by creating a new variable\
    \ called 'time', making sure that 'For all sprites' is selected before clicking\
    \ OK. Click on your sprite – either on the stage or in the sprite pane – to select\
    \ it,\n\n## Chapter 4 Programming with Scratch 3\n\nthen add a clicked block from\
    \ the Events category to the code area. Next, add a say Hello! for 2 seconds block\
    \ from the Looks category, then click on it to change it to say 'Hello! British\
    \ ESA Astronaut Tim Peake. Are you ready?\n\n![](img/0aff4cdab15427839fb48fd7c6f677d3_71_0.png)\n\
    \nAdd a wait 1 seconds block from the Control category, then a say Hello! block.\
    \ Change this block to say 'Hit Space!', then add a reset timer block from the\
    \ Sensing category. This controls a special variable built into Scratch for timing\
    \ things, and will be used to time how quickly you can react in the game.\n\n\
    ![](img/0aff4cdab15427839fb48fd7c6f677d3_71_1.png)\n\nAdd a wait until block,\
    \ drag a key space pressed? Sensing block into its white space. This will pause\
    \ the program until you press the SPACE key on the keyboard, but the timer will\
    \ continue to run ~ counting exactly how long between the message telling you\
    \ to 'Hit Space!' and you actually hitting the SPACE key.\n\n![](img/0aff4cdab15427839fb48fd7c6f677d3_71_2.png)\n\
    \nYou now need Tim to tell you how long you took to press the SPACE key, but in\
    \ a way that's easy to read. To do this, you need a join Operators block. This\
    \ takes two values, including variables, and joins them together after the other\
    \ - known as concatenation.\n\n# THE OFFICIAL RASPBERRY PI BEGINNER'S GUIDE\n\n\
    Start with a say Hello! block, then drag and drop a join Operators blocks over\
    \ the word 'Hello'. Click on 'apple' and type 'Your reaction time was ', making\
    \ sure to add a blank space at the end, then drag another block over the top of\
    \ 'banana' in the second box. Drag a timer reporting block from the Sensing category\
    \ into what is now the middle box, and type 'seconds ' into the last box – making\
    \ sure to include a blank space at the start.\n\n![](img/0aff4cdab15427839fb48fd7c6f677d3_72_0.png)\n\
    \nFinally, drag a set my variable to 0 Variables block onto the end of your sequence.\
    \ Click on the drop-down arrow next to 'my variable' and click on 'time' from\
    \ the list, then replace the '0' with a timer reporting block from the Sensing\
    \ category. Your game is now ready to test by clicking on the green flag over\
    \ the stage. Get ready, and as soon as you see the message 'Hit Space!', press\
    \ the SPACE as quickly as you can (Figure 4-13) – see if you can beat our score!\n\
    \n![](img/0aff4cdab15427839fb48fd7c6f677d3_72_1.png)\n\n▲ Figure 4-13: Time to\
    \ play the game!\n\n## Chapter 4 Programming with Scratch 3\n\nYou can extend\
    \ this project further by having it calculate roughly far the International Space\
    \ Station has travelled in the time it took to press the SPACE key, based on the\
    \ station's published speed of seven kilometres per second. Create a new variable\
    \ called 'distance'. Notice how the blocks in the Variables category automatically\
    \ change to show the new variable, but the time variable blocks in your program\
    \ remain the same. Add a set distance to 0 block, then drag a multiplication block\
    \ over the '0'. Drag a time reporting block over the first blank space, then type\
    \ in the number '7' into the second space. When you're finished, your combined\
    \ block reads set distance to time *7 . This will take the time it took to press\
    \ the SPACE key and multiply it by seven, to get the distance in kilometres the\
    \ ISS has travelled.\n\n![](img/0aff4cdab15427839fb48fd7c6f677d3_73_0.png)\n\n\
    Add a wait 1 seconds block and change it to '4'. Finally, drag a say Hello! block\
    \ onto the end of your sequence and add two join blocks, as you did before. In\
    \ the first space, type 'kilometres'; in the last space, include a blank space\
    \ at the start.\n\n# THE OFFICIAL RASPBERRY PI BEGINNER'S GUIDE\n\n![](img/0aff4cdab15427839fb48fd7c6f677d3_74_0.png)\n\
    \nFinally, drag a set my variable to 0 Variables block onto the end of your sequence.\
    \ Click on the drop-down arrow next to 'my variable' and click on 'time' from\
