- img_proc: true
  md: '# Reading resistor colour codes


    Resistors come in a wide range of values, from zero-resistance versions which
    are effectively just pieces of wire to high-resistance versions the size of your
    leg. Very few of these resistors have their values printed on them in numbers,
    though: instead, they use a special code printed as coloured stripes or bands
    around the body of the resistor.


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_125_0.png)


    +   - 1st Band

    - 2nd Band

    - Tolerance

    - Multiplier


    | 1st/2nd Band | Multiplier | Tolerance |

    |---|---|-|

    | Black | 0 | ×10⁰ | ±1% |

    | Brown | 1 | ×10¹ | - |

    | Red | 2 | ×10² | ±2% |

    | Orange | 3 | ×10³ | - |

    | Yellow | 4 | ×10⁴ | - |

    | Green | 5 | ×10⁵ | ±0.5% |

    | Blue | 6 | ×10⁶ | ±0.25% |

    | Violet | 7 | ×10⁷ | ±0.1% |

    | Grey | 8 | ×10⁸ | ±0.05% |

    | White | 9 | ×10⁹ | - |

    | Gold | - | ×0⁻¹ | ±5% |

    | Silver | - | ×10⁻² | ±10% |

    | None | - | - | ±20% |


    To read the value of a resistor, position it the group of bands is to the left
    and the lone band is to the right. Starting from the first band, look its colour
    up in the ''1st/2nd Band'' column this example has two orange bands, which both
    mean a value of ''3'' for total ''33''. If your resistor has four bands instead
    of three, note down the value of the third band too (for five/six resistors, rpf.io/5-6band).


    Moving onto the last band – the third or fourth – look its colour up in the ''Multiplier''
    column. This tells you what number need to multiply your current number by to
    get'
  merge: -1
  pgno: 125
- img_proc: true
  md: '# THE OFFICIAL RASPBERRY PI BEGINNER''S GUIDE


    actual value of a resistor. This example has a brown band, which means ''x10''.
    That may look confusing, but it''s simply scientific notation: ''x10'' simply
    means ''add one zero to the end of your number''. If it were for x10, it would
    mean ''add six zeroes to the end of your number''.


    33, from the orange bands, the added zero from the brown band gives us 330 – which
    is the value of the resistor, measured in ohms. The final band, on the right,
    is how close to its rated value it is likely to be. Cheaper resistors have a silver
    band, indicating it can be 10 percent higher or lower than its, or no last band
    at all, indicating it can be within 20 percent of its rating; the most expensive
    resistors have a grey band, indicating that any tolerance is important: not. For
    hobbyist projects, any tolerance will usually work fine.


    If your value goes above 1000 ohms (1000 Ω), it is usually rated in kilohms (kΩ);
    if it goes above a million ohms, those are megohms (MO). A 2200 Ω resistor would
    be written as 2.2 kΩ, or 2200000 Ω resistor would be written as 2.2 MΩ.


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_126_0.png)


    CAN YOU WORK IT OUT?

    What bands would a 100 Ω resistor have? What colour bands would be a 2.2 MΩ resistor?
    If you wanted to find the cheapest resistors, what colour band would you look
    for?


    # Your first physical computing program: Hello, LED!


    Just printing ''Hello, World'' to the screen is a fantastic first step in learning
    a programming language, making an LED light up the traditional introduction to
    physical computing. For this project, you''ll need an LED and a 330 ohm (330 Ω)
    resistor, or as close to 330 Ω as you can find, plus female-to-female (F2F) jumper
    wires.


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_126_1.png)


    # RESISTANCE IS VITAL


    The resistor is a vital component in this circuit: it protects Raspberry Pi and
    the LED by limiting the amount of electrical current the LED can draw. Without
    it, the LED can pull too much current and burn itself – or cut. When used like
    this, the resistor is known as a current-limiting resistor. The exact value of
    you need depends on the LED you''re using, but 330 Ω works for most common LEDs.
    The higher the value, the lower the value, the brighter the LED.


    Never connect an LED to a Raspberry Pi without a current-limiting resistor, unless
    you know the LED has a built-in resistor of appropriate value.


    Chapter 6 Physical computing with Scratch and Python


    127'
  merge: -1
