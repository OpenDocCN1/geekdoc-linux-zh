  md: '# Inertial sensing in Python


    Start a new program in Thony and save it as Sense HAT Movement. Fill in the usual
    starting lines, remembering to use sense_emu if you''re using the Sense HAT emulator:


    ```

    from sense_hat import SenseHAT

    sense = SenseHat()

    sense.clear()

    ```


    To use information from the IMU to work out the current orientation of the Sense
    HAT on its three axes, type the following:


    ```

    orientation = sense.get_orientation()

    pitch = orientation["pitch

    ```


    Click Run and you''ll see readings for the Sense HAT''s orientation split across
    the three axes (**Figure 7-26**). By rotating the Sense HAT and clicking Run again,
    you will see the numbers change to reflect its new orientation.


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_182_0.png)


    +   **Figure 7-26**: Showing the Sense HAT''s pitch, roll, and yaw values


    The IMU can do more than measure orientation, though: it can also detect movement.
    To get accurate readings for movement, the IMU needs to be read in a loop: for
    orientation, a single reading won''t get you any useful information when it comes
    to detecting movement. Delete everything after sense.clear() then type the following
    code:'
