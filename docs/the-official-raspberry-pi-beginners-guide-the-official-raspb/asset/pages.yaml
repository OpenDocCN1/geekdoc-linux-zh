  md: "![](img/0aff4cdab15427839fb48fd7c6f677d3_190_0.png)\n\nThe sparkler isn't very\
    \ Interactive. To change that, start by dragging a wait 1 seconds block so it's\
    \ under the set pixel block but within the forever block. Drag a / Operators block\
    \ over the 1, then type 10 in its second space. Finally, drag a temperature block\
