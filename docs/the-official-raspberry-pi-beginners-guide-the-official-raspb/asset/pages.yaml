  md: '# Your first Scratch program: Hello, World!


    Scratch 3 loads like any other program on Raspberry Pi: click on the raspberry
    icon to load the Raspberry Pi OS menu, move the cursor to the Programming section,
    and click on Scratch 3. After a few seconds, the Scratch 3 user interface will
    load.


    Where most programming languages need you tell the computer what to do through
    written instructions, Scratch is different. Start by clicking on the category
    in the blocks palette, found at the left of the Scratch window. Find the coloured
    purple. This brings up the blocks under that category, `say Hello!` block, click
    and hold the left mouse button on it, and drag it over the code area at the centre
    of the Scratch window before leaving go of the mouse button (**Figure 4-1**).


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_55_0.png)


    Figure 4-1: Drag and drop the block into the code area


    Look at the shape of the block you''ve just dropped: it has a hole at the top,
    and a matching part sticking out at the bottom. Like a jigsaw piece, this shows
    you that the block is expecting to have something above it and below it. For program,
    this that something above is a trigger.


    Click on the Events category of the blocks palette, coloured gold, then click
    and drag the `when clicked` block – known as a hat block – onto the code area.
    Position it so that the'
  merge: -1
  pgno: 55
- img_proc: true
  md: 'bit sticking out of the bottom connects into the hole at the top of your say
    Hello! block until you see a white outline, then let go of the mouse button. You
    don''t have to be precise; if it''s close enough, the block will snap into place
    just like a jigsaw piece. If it doesn''t, click and hold on it again to adjust
    its position until it does.


    ```

    when clicked

    say Hello!

    ```


    Your program is now complete. To make it work, known as running the program, click
    on the green flag icon on the top-left of the stage area. If all has gone well,
    the cat sprite on the stage will greet you with a cheery ''Hello!'' (Figure 4-2)
    ~ your first program is a success!


