    > CHALLENGE: ADD MORE STEPS

    Try adding steps to your sequence, and changing the values in the existing steps.
    What happens when the number of steps in one move block doesn''t match the number
    of steps in another? What if you try to play a sound while another is still playing?


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_60_0.png)


    # Looping the loop


    The sequence you''ve created far runs only once: you click the green flag, the
    cat sprite moves and moves, and then the program stops until you click the green
    flag again. It doesn''t have to stop, because Scratch includes a type of Control
    block as a loop.


    Click on the Control category in the blocks palette and find the `forever` block.
    Click and drag this into the code area, drop it underneath the `when clicked`
    block and above the first `move 10 steps` block.


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_60_1.png)


    Notice how the C-shaped forever block automatically grows to surround the other
    blocks in your sequence. Click the green flag now, and you''ll quickly see what
    the `forever` block does: instead of your program running once and again, it will
    run over and again - quite literally forever. In programming, this is known as
    an *infinite loop* — literally, a loop that never ends.


    If the sound of constant meowing is getting a little much, click the red octagon
    next to the green flag above the stage area to stop your program. To change the
    loop type, click and'
