  md: '# # Appendix G

    Raspberry Pi specifications


    The various components and features of a computer are known as its specifications,
    and a look at the specifications gives you the information you need to compare
    two computers.

    These specifications can seem confusing at first, are highly technical, and you
    don''t need to know to use a Raspberry Pi, but they are included here for the
    curious reader.


    Raspberry Pi 4 Model B and Raspberry Pi 400''s system-on-chip is a Broadcom BCM2711B0,
    which you''ll see on its metal lid if you look closely enough (on Raspberry Pi
    4). These features 64-bit ARM Cortex-A72 processing unit (CPU) cores, each running
    at 1.5GHz or 1.8GHz (1.5 or 1.8 thousand cycles per second), and a Broadcom VideoCore
    VI (Six) graphics processing unit (GPU) running at 500MHz (500 million cycles
    per second) for video tasks and for 3D rendering tasks such as.


    The system is connected to 2GB, 4GB, or 8GB (two, four, or eight million bytes)
    – 4GB on Raspberry Pi 400 – of LPDDR4 (Low-Power Double-Data-Rate 4) RAM (random-access
    memory) which runs at 3200MHz (three thousand two hundred million cycles per second).
    The microSD card slot supports up to 512GB (512 thousand bytes) of storage.


    The Ethernet port supports to gigabit (1000Mbps, 1000Base-T) connections, while
    the radio supports 802.11ac WiFi networks on the 2.4GHz and 5GHz frequency bands,
    Bluetooth 5.0, and Bluetooth Low Energy (BLE) connections.'
  merge: -1
  pgno: 243
- img_proc: true
  md: '![](img/0aff4cdab15427839fb48fd7c6f677d3_244_0.png)


    Broken down into a bullet list, Raspberry Pi 4''s specifications look like this:


    +   - CPU: 64-bit quad-core ARM Cortex-A72 at 1.5GHz

    - GPU: VideoCore VI at 500MHz

    - RAM: 1GB, 2GB, or 4GB of LPDDR4

    - Networking: Gigabit Ethernet, dual-band 802.11ac, Bluetooth 5.0, Bluetooth Low
    Energy

    - Audio/Video Outputs: 3.5 mm analogue AV jack, 2 × micro-HDMI 2.0

    - Connectivity: 2 × USB 2.0 ports, 2 × USB 3.0 ports, Camera Serial Interface,
    Display Serial Interface (DSI)

    - Storage: microSD, up to 512GB

    - Power: 5 volts at 3 amps via USB Type-C

    - Extras: 40-pin GPIO header, Power over Ethernet compatibility (with additional
