- img_proc: true
  md: '```

    camera.saturation = 0

    ```


    This controls the saturation of the image, or how vibrant colours. Possible values
    range from -100 to 100.


    ```

    camera.sharpness = 0

    ```


    This controls the sharpness of the image. Possible values range from -100 to 100.


    ```

    camera.shutter_speed = 0

    ```


    This controls how quickly the shutter opens and closes when images images videos.
    You can set the shutter speed manually in microseconds, with longer shutter speeds
    working better in lower light and faster shutter speeds in brighter light. This
    should normally be left on its default, automatic, setting.


    ```

    camera.vflip = False

    ```


    This flips the camera image across the vertical, or Y, axis when set to True.


    ```

    camera.video_stabilization = False

    ```


    When set to True, this turns on video stabilisation. You only need this if the
    Camera Module or HQ Camera is moving while you''re recording, such as if it''s
    attached to a robot or being carried, in order to reduce the shakiness of the
    captured video.


    More information on these settings, as well as additional settings not documented
    here, can be found at picamera.readthedocs.io.'
