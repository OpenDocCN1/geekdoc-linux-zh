  md: '# Connecting a keyboard and mouse


    Connect the keyboard''s USB cable to any of the four USB ports (2.0 or 3.0) on
    Raspberry Pi. If you''re using the Official Raspberry Pi Keyboard, there''s a
    USB port on the back for the mouse; if not, just connect your mouse''s USB cable
    from your mouse to another USB port on Raspberry Pi.


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_26_0.png)


    The USB connectors for the keyboard and mouse should slide home without too much
    pressure; if you''re having to force the connector in, there''s something wrong.
    Check that the USB connector is the right way up!


    > ### KEYBOARD & MOUSE

    The keyboard and mouse act as your main means of telling Raspberry Pi what to
    do; in computing, these are known as input devices, in contrast with the display
    which is an output device.'
