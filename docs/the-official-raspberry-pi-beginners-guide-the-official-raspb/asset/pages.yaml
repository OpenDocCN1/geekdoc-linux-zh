  md: '# Testing the camera


    To confirm that your Camera Module or HQ Camera is properly installed, and that
    you''ve enabled the interface in the Raspberry Pi Configuration Tool, you can
    use the raspistill tool. This, along with raspvid for videos, is designed to capture
    images from the camera using Raspberry Pi''s command-line interface (CLI).


    Unlike the programs you''ve been using so far, you won''t find raspistill in the
    menu. Instead, click on the raspberry icon to load the menu, choose the Accessories
    category, and click on Terminal. A black window with green and blue writing in
    it will appear (Figure 8-4): this is the terminal, which allows you to access
    the command-line interface.


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_199_0.png)


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_199_1.png)


    +   ▲ Figure 8-3: You need to enable the camera in Raspberry Pi Configuration


    +   ▲ Figure 8-4: Open a Terminal window to enter commands'
  merge: -1
  pgno: 199
- img_proc: true
  md: 'To test the camera, type the following into the Terminal:


    ```

    rasppistill -o test.jpg

    ```


    As soon as you hit **ENTER**, you''ll see a large picture of what the camera sees
    appear onscreen (**Figure 8-5**). This is called the *live preview*, and unless
    you tell raspistill otherwise, it will last for 5 seconds. After those 5 seconds
    are up, the camera will capture a single still picture and save it in your home
    folder under the name **test.jpg**. If you want to capture another, type the same
    command again – but make sure to change the output file name, after the **-o**,
    or you''ll save over the top of your first picture!


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_200_0.png)


    **Figure 8-5**: The live preview from the camera


    If the live preview was upside-down, you''ll need to tell raspistill that the
    camera is rotated. The Camera Module is designed to handle the ribbon cable coming
    out of the bottom edge; if it''s coming out of the sides or the top, with some
    third-party camera mount accessories, you can rotate the image by 90, 180, or
    270 degrees using the **-rot** switch. For a camera mounted with the cable coming
    out of the top, simply use the following command:


    ```

    raspistill -rot 180 -o test.jpg

    ```


    If the ribbon cable is coming out of the right-hand edge, use a rotation value
    of 90 degrees; if it''s coming out of the left-hand edge, use 270 degrees. If
    your original capture was at the wrong angle, try another using the **-rot** switch
    to correct it.'
  merge: -1
  pgno: 200
- img_proc: true
  md: 'To see your picture, open the File Manager from the Accessories category of
    the raspberry menu: the image you''ve taken, called test.jpg, will be in your
    home/pi folder. Find it in the list of files, then double-click to load it in
    an image viewer (Figure-8-6). You can also attach the image to emails, upload
    it to websites via the browser, or it to an external storage device.


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_201_0.png)


    Figure 8-6: Opening the captured image


    # Introducing picamera


    The most flexible way to control the Camera Module or HQ Camera is using Python,
    via the handy picamera library. This gives you full control over the camera''s
    preview, picture, and video capture abilities, and allows you to integrate them
    into your own programs – even combining them with programs which use the GPIO
    module through the GPIO Zero library!


    > PYTHON PROGRAMMING

    The projects in this chapter assume experience with the Python language, Thonny
    IDE, and Raspberry Pi''s GPIO pins.

    If you haven''t done so already, please work through the projects in Chapter 5,
    Programming with Python, and Chapter 6, Physical computing with Scratch and Python,
    first!


    Close the Terminal, if it''s still open, by clicking on the X at the top-right
    of the window, load Thonny from the Programming category of the raspberry menu.
    Save your new project as Camera, then start importing the libraries your program
    needs by typing the the following into the script area:'
  merge: -1
  pgno: 201
- img_proc: true
  md: '```

    from picamera import PiCamera

    from time import sleep

    camera = PiCamera()

    ```


    The last line allows you to control the Camera Module or HQ Camera using the camera
    function. To start, type the following:


    +   - camera.start_preview()

    - sleep(10)

    - camera.stop_preview()


    Click Run, your desktop will disappear; in its place, you''ll see a full-screen
    preview of whatever the camera can see (**Figure 8-7**). Try moving it around,
    or waving your hand in front of the lens, and you''ll see the picture on screen
    change to match. After 10 seconds the preview will close and your program will
    finish – but, unlike the preview from raspistill, no picture will be saved afterwards.


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_202_0.png)


    > **Figure 8-7:** A full-screen live preview of the camera view


    If your preview was the wrong up, you can rotate the image to get it the right
    way again. Just under the line **camera = PiCamera()**, type:


    ```

    camera.rotation = 180

    ```


    If the preview was upside-down, that line will get things looking right again.
    As with raspistill, **camera.rotation** lets you rotate the image by 90, 180,
    or 270 degrees, depending on whether the cable is coming out of the right, top,
    or left side of the Camera Module. Remember to use **camera.rotation** at the
    start of any program you write, to avoid capturing images or video that are the
    wrong way up!'
