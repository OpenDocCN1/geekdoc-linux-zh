    \  clear display\n  set background to\n  set colour to\nforever\n  set pixel x\
    \ pick random 9 to 7\n  pick random 0 to 7 to pick random 0 to 16777215\n  wait\
    \ temperature / 10 seconds\n```\n\nThe green flag and you'll notice – unless you\
    \ live somewhere very cold – that the sparkler is considerably slower than before.\
    \ Because you've created a temperature-dependent delay: the program now waits\
    \ the current temperature divided by 10 number of seconds before each loop. If\
    \ the temperature in your room is 20°C, the program will wait 2 seconds before\
    \ looping; if the temperature is 10°C, it'll wait 1 second; if it's under 10°C,\
    \ it'll wait than a second."
