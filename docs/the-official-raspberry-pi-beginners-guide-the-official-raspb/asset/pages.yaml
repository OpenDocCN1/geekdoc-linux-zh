- img_proc: true
  md: "```\nwhile True:\n    acceleration = sense.get_accelerometer_raw()\nx = acceleration[\"\
    x\"]\ny = acceleration[\"y\"]\nz = acceleration[\"z\"]\n```\n\nYou have variables\
    \ containing the current accelerometer readings for the three spatial axes: X,\
    \ or left or right; Y, or forwards and backwards; Z, or up or down. The numbers\
    \ from the accelerometer sensor can be difficult to read, so type the following\
    \ to make them easier to understand by rounding them to the nearest whole number:\n\
    \n```\nx = round(x)\ny = round(y)\nz = round(z)\n```\n\nFinally, print the three\
    \ values by typing the following line:\n\n```\nprint('x={0}, y={1}, z={2}'.format(x,\
    \ y, z))\n```\n\nClick Run, and you'll see values from the accelerometer printed\
    \ to the Python shell area (**Figure 7-27**). Unlike your previous program, these\
    \ will print continuously; to stop them, click the red stop button to stop the\
    \ program.\n\n![](img/0aff4cdab15427839fb48fd7c6f677d3_183_0.png)\n\n**Figure\
    \ 7-27**: Accelerometer readings rounded to the nearest whole number\n\nYou may\
    \ have noticed that the accelerometer is telling you that one of the axes - the\
    \ Z Axis, if your Raspberry Pi is flat on the table - has an acceleration value\
    \ of 1.0 gravities (1G), the Sense HAT isn't moving. That's because it's detecting\
    \ the Earth's gravitational pull – the force that is pulling the Sense HAT towards\
    \ the centre of the Earth, and the reason why if you knock something off your\
    \ desk it'll fall to the floor."
  merge: -1
