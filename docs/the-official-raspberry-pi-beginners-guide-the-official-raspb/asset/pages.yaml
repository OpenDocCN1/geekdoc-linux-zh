  md: '# Controlling a buzzer in Scratch


    Recreate the same program as for making the LED flash – load it, if you saved
    it before you created the button project. Use the drop-down in the set gpio to
    output high blocks to select number 15, so Scratch is controlling the correct
    GPIO pin.


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_139_0.png)


    Click the green flag, and your buzzer will begin to buzz: one second on, and one
    second off. If you only hear the buzzer clicking once a second, you are using
    a passive buzzer rather than an active buzzer. Where an active buzzer generates
    the rapidly changing signal, known as an oscillation, to make the metal plates
    vibrate itself, a passive buzzer needs an oscillating signal. When you simply
    turn it on using Scratch, the plates only move and stop – making the ''click''
    sound unique until the next time the program switches it on or off.


    Click the red octagon to stop your buzzer, but make sure to do so when it''s not
    making a sound, otherwise the buzzer will continue to buzz until you run your
    program again!


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_139_1.png)'
