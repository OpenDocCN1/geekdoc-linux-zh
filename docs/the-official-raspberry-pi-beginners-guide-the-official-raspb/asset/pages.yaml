  md: '# Appendix D

    Further reading


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_227_0.png)


    The Official Raspberry Pi Beginner’s Guide is designed to get you started with
    your Raspberry Pi, but it’s by no means a complete look at everything you can
    do. The Raspberry Pi community is globe-spanning and vast, with people using them
    for everything from games and sensing applications to robotics and artificial
    intelligence, and there is a wealth of inspiration out there.


    This appendix highlights some sources of project ideas, lesson plans, and other
    material which act as a great next step now you''ve worked your way through the
    Beginner’s Guide.'
