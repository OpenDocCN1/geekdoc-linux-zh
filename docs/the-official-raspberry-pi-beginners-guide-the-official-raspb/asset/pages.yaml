  pgno: 163
- img_proc: true
  md: '![](img/0aff4cdab15427839fb48fd7c6f677d3_164_0.png)


    Figure 7-10: LED matrix coordinates system


    There are eight LEDs in each row of the display, and eight in each column (Figure
    7-10). When counting the LEDs, though, you – like most programming languages –
    should start at 0 and end at 7. The first LED is in the top-left corner, the last
    is in the bottom right. Using the numbers from the rows and columns, you can find
    the coordinates of any LED on the matrix. The blue LED in the pictured matrix
    is at coordinates 0, 2; the red LED is at coordinates 7, 4. The X axis, across
    the matrix, comes first, followed by the Y axis, down the matrix.


    When planning pictures to draw on the Sense HAT, it may help to draw them by first
    hand, if you''ve gridded paper, or you can plan things out in a spreadsheet such
    LibreOfficeCalc.


