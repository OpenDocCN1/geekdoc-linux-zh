  md: 'The final screen of the Welcome Wizard (Figure 3-7) has a simple task to do:
    certain changes made will only take effect when you restart Raspberry Pi (a process
    also known as rebooting). If prompted to do so, click the Restart button and Raspberry
    Pi will restart. This time the Welcome Wizard won''t appear, its job is done,
    and your Raspberry Pi is ready to use.


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_39_0.png)


    Figure 3-7: Restarting Raspberry Pi


    # Navigating the desktop


    The version of Raspberry Pi OS installed on all Raspberry Pi boards is properly
    known as ''Raspberry Pi OS with desktop'', referring to its main graphical interface
    (Figure 3-8). The bulk of this desktop is taken up with a picture, known as the
    wallpaper (A in Figure 3-8), on top of which the programs you will run appear.
    At the top of the desktop is a taskbar (B), which allows you to actually load
    each of the programs; these are indicated by tasks (C) in the taskbar.


