  md: '# Chapter 4

    Programming with Scratch 3


    Learn how to start coding using Scratch, the block-based programming language


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_53_0.png)


    Using Raspberry Pi isn''t just about using software other people have created;
    it''s about creating your own software, based on almost anything your imagination
    can conjure. Whether you have previous experience with creating your own programs
    – a process known as programming or coding – or not, you''ll find Raspberry Pi
    a great platform for creation and experimentation.


    Key to the accessibility of coding on Raspberry Pi is Scratch, a visual programming
    language developed by the Massachusetts Institute of Technology (MIT). Whereas
    traditional programming languages you have write text-based instructions for the
    computer to carry out, in the same way as you might write a recipe for baking
    a cake, Scratch has you build your program step-by-step using blocks – pre-written
    chunks of code behind coloured-coded pieces.


    Scratch is a great language for budding coders young and old, but don''t be fooled
    by its friendly appearance: it''s a powerful and fully functioning programming
    environment for creating everything from simple games and animations through complex
    interactive robotics projects.'
  merge: -1
  pgno: 53
- img_proc: true
  md: '# Introducing the Scratch 3 interface


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_54_0.png)


    +   **Stage Area** - Like actors in a play, your sprites move around the stage
    under the control of your program.


    +   **Sprite** - The characters or objects you control in a Scratch program are
    known as sprites, and it sit on the stage.


    +   **Stage Controls** - Your stage can be changed, including adding your own
    pictures as backgrounds, using the stage controls.


    +   **Sprites List** - All the sprites you have created or added to Scratch will
    appear in this section of the window.


    +   **Blocks Palette** - All the blocks available for your program appear in the
    blocks palette, which features colour-coded categories.


    # SCRATCH VERSIONS


    At the time this book was written, Raspberry Pi OS came with three versions of
    Scratch: 1, 2, and 3, all included in the Programming section of the Raspberry
    Pi OS menu. This chapter is written for Scratch 3. Note that Scratch 3 will only
    run on Raspberry Pi 4. If you want to use Scratch 2 instead, the version won''t
    run on Raspberry Pi Zero, Model A+, B, or B+.


    +   **Blocks** – Pre-written chunks of program code, blocks allow you to build
    your program step-by-step.


    +   **Code Area** – The area is where your program is built by dragging-and-dropping
    blocks from the blocks palette to form scripts.'
  merge: -1
