- img_proc: true
  md: "Start by deleting everything after camera.start_preview(), then typing:\n\n\
    ```\nframe = 1\n```\n\nThis creates a new variable, frame, which your program\
    \ will use to store the current frame number. You'll use this shortly to ensure\
    \ that you're saving a new file every time; without it, you'll just be saving\
    \ the top of your first image every time you press the button!\n\nNext, set up\
    \ your loop by typing:\n\n```\nwhile True:\n    try:\n```\n\nThe new instruction\
    \ try tells Python to run whatever code is inside – which is going to be the code\
    \ for capturing images. Type:\n\n```\nbutton.wait_for_press()\ncamera.capture('/home/pi/Desktop/animation/frame%03d.jpg'\
    \ % frame)\nframe += 1\n```\n\nThere are a couple of clever tricks in these three\
    \ lines of code. The first is in the capture file name: %03d tells Python to take\
    \ a number and add as many zeroes to the front as it needs to make three digits\
    \ long. Thus '1' becomes '001', '2' becomes '002', and '10' becomes '010'. You\
    \ need this in your program to keep your files in the correct order and to make\
    \ sure you're not overwriting a file you've already saved.\n\nThe % frame at the\
    \ end of that line tells Python to use the number of the frame variable in the\
    \ file name. To make sure each file is unique, the last line – frame += 1 – increments\
    \ the frame variable by 1. The first time you press the button, frame will be\
    \ increased from 1 to 2; the next time, from 2 to 3; and so on.\n\nAt the moment,\
    \ your code won't exit cleanly until you've finished pictures. To make that happen,\
    \ you need an except for your try. Type the following, remembering to remove one\
    \ level of indentation on the first line so Python knows it's not of the try section:\n\
    \n```\nexcept KeyboardInterrupt:\n    camera.stop_preview()\n    break\n```\n\n\
    Your finished program will look like this:"
