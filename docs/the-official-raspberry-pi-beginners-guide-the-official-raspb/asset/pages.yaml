  md: '# Sensing the world around you


    The Sense HAT''s real power lies in the various sensors it has. These allow you
    to take readings of everything from temperature to acceleration, and use them
    in your programs as you see fit.


    > EMULATING THE SENSORS

    If you''re using the Sense HAT Emulator, you''ll need to enable inertial and environmental
    sensor simulation: in the Emulator, click Edit, then Preferences, then click them.
    In the same menu choose ''180°'', ''360°'', ''180°'' under ''Orientation Scale''
    to make sure the numbers in the Emulator match the numbers reported by Scratch
    and Python, then click the Close button.


    # Environmental sensing


    The barometric pressure sensor, humidity sensor, and temperature sensor are all
    environmental sensors; they take measurements from the environment surrounding
    the Sense HAT.


    # Environmental sensing in Scratch


    Start a new program in Scratch, saving your old one if you wish, and add the Raspberry
    Pi Sense HAT extension if it''s already loaded. Drag a `when` block onto your
    code area, then a `clear display` block underneath, and a `set background to black`
    block underneath. Next, add a `set colour to white` block – use the Brightness
    and Saturation sliders to choose the colour. It is always a good idea to do this
    at the start of your programs, as it will make the Sense HAT isn''t showing anything
    from an old program while guaranteeing colours you''re using.


    Drag a `say Hello for 2 seconds` block directly underneath your existing blocks.
    To take a reading from the pressure sensor, find the `pressure` block in the Raspberry
    Pi Sense HAT category and drag it over the word ''Hello!'' in your `say Hello!
    for 2 seconds` block.


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_174_0.png)


    Click the green flag and the Scratch cat will tell you the current reading from
    the pressure sensor in millibars. After two seconds, the message will disappear;
    try blowing on the Sense HAT (or moving the Pressure slider up in the emulator)
    and clicking the green flag to run the program again (**Figure 7-17**, overleaf).'
  merge: -1
  pgno: 174
- img_proc: true
  md: '![](img/0aff4cdab15427839fb48fd7c6f677d3_175_0.png)


    Figure 7-17: Showing the pressure sensor reading


