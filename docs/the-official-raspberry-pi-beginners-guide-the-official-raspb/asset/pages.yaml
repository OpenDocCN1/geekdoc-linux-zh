- img_proc: true
  md: '**Figure 1-1** shows a Raspberry Pi 4 Model B seen from above. When you''re
    using a Raspberry Pi with this book, try to keep it turned the same way as in
    the picture; if it''s turned around, it can get confusing when it comes to using
    things like the GPIO header (detailed in **Chapter 6, Physical computing with
    Scratch and Python**).


    While it may look like there''s a load packed into the tiny board, a Raspberry
    Pi is very simple to understand – starting with its components, the inner workings
    that make the device tick.


    # Raspberry Pi''s components


    Like any computer, Raspberry Pi is made up of various components, each of which
    has a role to play in making it work. The first, and arguably most important,
    of these can be found just above the centre point on the top side of the board
    (**Figure 1-2**), covered in a metal cap: the system-on-chip (SoC).


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_10_0.png)


    **Figure 1-2**: Raspberry Pi''s system-on-chip (SoC)


    The name system is a great indicator of what you would find if you prized the
    metal cover off: a silicon chip, known as an *integrated circuit*, which contains
    the bulk of Raspberry Pi''s system. This includes the *central processing unit*
    (CPU), commonly thought of as the ‘brain’ of a computer, and the *graphics processing
    unit* (GPU), which handles the visual sight of things.


    A brain is no without memory, however, and just to see of the SoC is another chip,
    which looks like a small, black, plastic square (**Figure 1-3**, overleafed).
    This is Raspberry Pi''s *random access memory* (RAM). When you''re working on
    Raspberry Pi, it''s the RAM that holds what you''re doing; only when you save
    your work will be written to the microSD card. Together, these components form
    Raspberry Pi''s volatile and non-volatile memories: the volatile loses its contents
    whenever Raspberry Pi is powered off, while the non-volatile microSD card keeps
    its contents.'
  merge: -1
  pgno: 10
- img_proc: true
  md: '![](img/0aff4cdab15427839fb48fd7c6f677d3_11_0.png)


    +   Figure 1-3: Raspberry Pi’s random access memory (RAM)


    The top right of the board you''ll find another metal lid (Figure 1-4) covering
    the radio, the component which gives Raspberry Pi the ability to communicate with
    devices wirelessly. The radio itself acts as two components, in fact: a WiFi radio,
    for connecting to computer networks; and a Bluetooth radio, for connecting to
    peripherals like mice and for sending data to or receiving data from nearby smart
    devices like sensors or smartphones.


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_11_1.png)


    +   Figure 1-4: Raspberry Pi’s radio module'
  merge: -1
  pgno: 11
- img_proc: true
  md: '# THE OFFICIAL RASPBERRY PI1 BEGINNER''S GUIDE


    Another black, plastic-covered chip can be seen to the bottom edge of the board,
    just behind the middle set of USB ports. This is the USB controller, and is responsible
    for running the four USB ports. Next to this is another smaller chip, the network
    controller, which handles Raspberry Pi''s Ethernet port. A final black chip, smaller
    than the rest, can be found a little bit above the USB Type-C power connector
    to the upper-left of the board (Figure 1-5); this is known as a power management
    integrated circuit (PMIC), and handles turning the power that comes in from the
    micro USB port into the power Raspberry Pi needs to run.


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_12_0.png)


    Figure 1-5: Raspberry Pi''s power management integrated circuit (PMIC)


    Don''t worry if this seems like a lot to take in: you don''t need to know what
    each component is or where to find it on the board in order to use Raspberry Pi.'
  merge: -1
  pgno: 12
- img_proc: true
  md: '# Raspberry Pi''s ports


    Raspberry Pi has a range of ports, starting with four Universal Serial Bus (USB)
    ports

    **(Figure 1-6)** to the middle and right-hand side of the bottom edge. These ports
    let you connect any USB-compatible peripheral, from keyboards and mice to digital
    cameras and flash drives, to Raspberry Pi. Speaking technically, there are two
    types of USB ports: the ones with black parts inside are USB 2.0 ports, based
    on version two of the Universal Serial Bus standard; the ones with blue parts
    are faster USB 3.0 ports, based on the newer version three.


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_13_0.png)


    +   Figure 1-6: Raspberry Pi''s USB ports'
  merge: -1
  pgno: 13
- img_proc: true
  md: 'To the right of the USB ports is an Ethernet port, also known as a network
    port (Figure 1-7). You can use this port to connect Raspberry Pi to a wired computer
    network using a cable with what is known as an RJ45 connector on its end. If you
    look closely at the Ethernet port, you''ll see two light-emitting diodes (LEDs)
    at the bottom; these are status LEDs, and let you know that the connection is
    working.


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_14_0.png)


    Figure 1-7: Raspberry Pi''s Ethernet port


    Just above the USB ports, on the left-hand edge of Raspberry Pi, is a 3.5 mm audio-visual
    (AV) jack (Figure 1-8). This is also known as the headphone jack, and it can be
    used for that exact purpose – though you''ll get better sound connecting it to
    amplified speakers rather than headphones. It has a hidden, extra feature, though:
    as well as audio, the 3.5 mm AV jack carries a video signal which can be connected
    to TVs, projectors, and other displays that support a composite video signal using
    a special cable known as a tip-ring-ring-sleeve (TRRS) adapter.


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_14_1.png)


    Figure 1-8: Raspberry Pi''s 3.5 mm AV jack'
  merge: -1
  pgno: 14
- img_proc: true
  md: 'Directly above the 3.5 mm AV jack is a strange-looking connector with a plastic
    flap which can be pulled up; this is the camera connector, also known as the Camera
    Serial Interface (CSI (Figure 1-9). This allows you to use the specially designed
    Raspberry Pi Camera Module (about which you''ll learn more in Chapter 8, Raspberry
    Pi Camera Module.)


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_15_0.png)


    ▲ Figure 1-9: Raspberry Pi’s camera connector


    Above that, still on the left-hand edge of the board, are the micro High Definition
    Multimedia Interface (micro-HDMI) ports, which are a smaller version of the connectors
    you''ll find on a game console, set-top box, or TV (Figure 1-10). The multimedia
    part of its name tells you that it carries both audio and video signals, while
    high-definition tells you that you can expect excellent quality. You''ll use these
    to connect Raspberry Pi to one or two display devices: a computer monitor, TV,
    or projector.


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_15_1.png)


    ▲ Figure 1-10: Raspberry Pi’s micro-HDMI ports'
  merge: -1
  pgno: 15
- img_proc: true
  md: 'Above the HDMI ports is a USB Type-C power port (**Figure 1-11**), which you''ll
    use to connect Raspberry Pi to a power source. The USB Type-C port is a common
    sight on smartphones, tablets, and other portable devices. While you could use
    a standard mobile charger to power Raspberry Pi, for best results you should use
    the official Raspberry Pi USB Type-C Power Supply.


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_16_0.png)


    +   Figure 1-11: Raspberry Pi''s USB Type-C power port


    At the top edge of the board is another strange-looking connector (**Figure 1-12**),
    which at first glance appears to be identical to the camera connector. This, though,
    is the exact opposite: a *display connector*, or *Display Serial Interface (DSI)*,
    designed for use with a Raspberry Pi Display (**Figure 1-13**, overleaf).


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_16_1.png)


    +   Figure 1-12: Raspberry Pi''s display connector (DSI)'
  merge: -1
  pgno: 16
- img_proc: true
  md: '![](img/0aff4cdab15427839fb48fd7c6f677d3_17_0.png)


    Figure 1-13: The Raspberry Pi Touch Display


    At the right-hand edge of the board you''ll find 40 metal pins, split into two
    rows of 20 pins Figure-1-14. This is the GPIO (general-purpose input/output) header,
    a feature of Raspberry Pi used to talk to additional hardware from LEDs and buttons
    all the way to temperature sensors, joysticks, and pulse-rate monitors. You''ll
    learn more about the GPIO header in Chapter 6, Physical computing with Scratch
    and Python. Just below and to the left of this header is another, smaller header
    with four pins: this is used to connect the Power over Ethernet (PoE) HAT, an
    optional add-on which lets Raspberry Pi receive power from a network connection
    rather than the USB Type-C port.


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_17_1.png)


    Figure 1-14: Raspberry Pi''s GPIO header'
  merge: -1
  pgno: 17
- img_proc: true
  md: 'There''s one final port on Raspberry Pi, but you won''t see it on the top.
    Turn the board and you''ll find a microSD card connector on the opposite side
    of the board to the display connector (**Figure 1-15**). This is Raspberry Pi’s
    storage: the microSD card inserted in here contains all the files you save, all
    the software you install, and the operating system that makes Raspberry Pi run.


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_18_0.png)


    +   Figure 1-15: Raspberry Pi’s microSD card connector'
  merge: -1
  pgno: 18
- img_proc: true
  md: '![](img/0aff4cdab15427839fb48fd7c6f677d3_19_0.png)


    +   - Figure 1-16: Raspberry Pi 400 has an integrated keyboard


    # # Raspberry Pi 400


    Raspberry Pi 400 takes the same components as Raspberry Pi 4 and places them inside
    a keyboard housing. As well as protecting them, the keyboard housing takes up
    less room on your desk and helps to keep the cables tidy.


    Raspberry Pi 400 is made of the same core components as Raspberry Pi 4, including
    the system-on-chip and memory. You can''t see them, but they are still there.
    What you can see are the external parts, starting with the keyboard (Figure 1-16).
    To the right-hand corner are three light-emitting diodes (LEDs); the first lights
    up when you press the Num Lock key, which switches some of the keys to act like
    a Number Pad on a full-size keyboard; the second lights when you press Caps Lock,
    which makes the letter keys upper-case rather than lower-case; and the last lights
    up when Raspberry Pi 400 is switched on.


    At the back of Raspberry Pi 400 (Figure 1-17) are the ports. The left-most port
    as seen from the back is the general-purpose input/output (GPIO) header. This
    is the same header described on page 17, flipped; the first pin, Pin 1, is at
    the top-right, the last pin, Pin 40, is at the bottom-left. You can find out more
    about the GPIO header in Chapter 6, Physical Computing with Scratch and Python.'
  merge: -1
  pgno: 19
- img_proc: true
  md: '![](img/0aff4cdab15427839fb48fd7c6f677d3_20_0.png)


    **Figure 1-17: The ports are found at the rear of Raspberry Pi 400**


    Next to the GPIO header is the microSD card slot. This stores the microSD card
    which acts as Raspberry Pi 400''s storage for the operating system, applications,
    and other data. The microSD card comes pre-installed in Raspberry Pi 400; you
    can remove it by pushing gently on the card until it clicks and springs out then
    pulling it out. When you pull the card back in, make sure the shiny metal contacts
    are facing downwards; the card should slide in with a gentle click.

    The next ports are USB micro-HDMI ports, for connection to a monitor, TV, or other
    display. Like Raspberry Pi 4, Raspberry Pi 400 supports up to two displays. Next
    to these are the USB Type-C power port, for connection to Raspberry Pi Power Supply
    or compatible USB power supply.

    The two blue ports are USB 3.0 ports, which provide a high-speed connection to
    devices including solid-state drives (SSDs), memory sticks, printers, and more.
    The white port to the right of these is a lower-speed USB 2.0 port, to which you
    can connect the bundled Raspberry Mouse.

    The final port is a Gigabit network port, which allows you to connect Raspberry
    Pi 400 to your network using a network cable as an alternative to using the built-in
    Wi-Fi wireless networking. You can read more about connecting Raspberry Pi 400
    to a network in Chapter 2, Getting Started with your Raspberry Pi.'
  merge: -1
  pgno: 20
- img_proc: true
  md: '# # Chapter 2


    # # Getting started with your Raspberry Pi


    Discover the essential items you''ll need for your Raspberry Pi and how to connect
    them all to get it set up and working


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_21_0.png)


    Raspberry Pi has been designed to be as quick and easy to set up and use as possible,
    but – like any computer – it relies on various external components, called peripherals.
    While it''s easy to take a look at the bare circuit board of Raspberry Pi – which
    looks significantly different to the enclosed, closed-off computers you may be
    used to and worry things are about to get complicated, that''s not the case. You
    can be up and running with Raspberry Pi under ten minutes simply by following
    the steps in this guide.


    If you have received this book in a Raspberry Pi Desktop Kit or with a Raspberry
    Pi 400, you''ll already have almost everything you need to get started: all you
    need to provide a computer monitor or TV with an HDMI connection – the same type
    of connector used by set-top boxes, Blu-ray players, and games consoles – so you
    can see what your Raspberry Pi is doing.'
  merge: -1
  pgno: 21
- img_proc: true
  md: 'If you picked up your Raspberry Pi without accessories, then you''ll also need:


    +   USB power supply – A 5 V power supply rated at 3 amps (3 A) and with a USB
    Type-C connector. The Official Raspberry Pi Power Supply is the recommended choice,
    as it can cope with the quickly switching power demands of Raspberry Pi.


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_22_0.png)


    +   microSD card with NOOBS – The MicroSD card acts as Raspberry Pi''s permanent
    storage; all the files you create and software install, along with the operating
    system itself, are stored on the card. An 8GB card will get you started, though
    a 16GB one offers room to grow. Using a card with NOOBS (New Out-Of-Box Software)
    pre-installed will save you time; otherwise see Appendix A for instructions on
    installing an operating system (OS) onto a blank card.


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_22_1.png)


    +   USB keyboard and mouse – The keyboard and mouse allow you to control your
    Raspberry Pi. Almost any wired or wireless keyboard and mouse with a USB connector
    will work with Raspberry Pi, though some ''gaming'' style keyboards may draw too
    much power to be used reliably.


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_22_2.png)


    +   Micro-HDMI cable – This carries sound and images from Raspberry Pi to your
    TV or monitor. One end of the cable has a micro-HDMI connector for Raspberry Pi;
    the other, a full-size HDMI connector for your display. Or, you can use a micro-HDMI
    to HDMI adapter and a standard, full-size HDMI cable. If using a monitor without
    an HDMI connector, you can buy micro-HDMI to DVI-D, DisplayPort, or VGA adapters.
    To connect to an older TV which has composite video or has a SCART socket, use
    a 3.5 mm tip-ring-ring-ring-sleeve (TRRS) audio/video cable.


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_22_3.png)'
  merge: -1
  pgno: 22
- img_proc: true
  md: 'Raspberry Pi is safe to use without a case, providing you don''t place it on
    a metal surface which could conduct electricity and cause a short-circuit. An
    optional case, however, can provide additional protection; the Desktop Kit includes
    the Official Raspberry Pi Case, while third-party cases are available from all
    good stockists.


    If you want to use Raspberry Pi on a wired network, without a wireless (WiFi)
    network, you''ll also need a network cable. This should be connected at one end
    to your network''s switch or router. If you''re planning to use Raspberry Pi''s
    built-in wireless radio, you won''t need a cable; you will, however, need to know
    the name and key or passphrase for your wireless network.


    # RASPBERRY PI 400 SETUP


    The following instructions are for setting up Raspberry Pi 4 or another bare-board
    member of the Raspberry Pi family. Instructions for setting up Raspberry Pi 400
    can be found on page 32.


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_23_0.png)


    # Setting up the hardware


    Begin by unpacking your Raspberry Pi from its box. Raspberry Pi is a robust piece
    of hardware, but that doesn''t mean it''s indestructible: try to get into the
    habit of holding the board by the edges, rather than on its flat sides, and be
    extra careful with the raised metal pins. If these pins are bent, at best it''ll
    make using add-on boards and other extra hardware difficult and, at worst, can
    cause a short-circuit that will damage your Raspberry Pi.


    If you haven''t done so already, have a look at Chapter 1, Getting to know your
    Raspberry Pi, for details on exactly where the various ports are and what they
    do.'
  merge: -1
  pgno: 23
- img_proc: true
  md: '# Assembling the case


    If you''re installing Raspberry Pi in a case, it should be your first step. If
    you''re using the Official Raspberry Pi Case, begin by splitting it into its two
    individual pieces: the red base and white lid.


    +   Take the base and hold it so that the raised end is to your left and the lower
    end to your right.


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_24_0.png)


    +   Holding your Raspberry Pi (with no microSD card inserted) by its USB and Ethernet
    ports, at a slight angle, slot its connectors (USB Type-C, 2 x micro-HDMI, and
    3.5 mm) into their holes in the side of the base, then gently lower the other
    side down so it fits.


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_24_1.png)


    +   Take the white lid and place the two clips at the left into the matching holes
    on the left of the base, above the microSD card slot. When they''re in place,
    push the right-hand side (above the USB ports) down until you hear a click.


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_24_2.png)'
  merge: -1
  pgno: 24
- img_proc: true
  md: '# Connecting the microSD card


    To install the microSD card, which is Raspberry Pi''s storage, turn Raspberry
    Pi (in its case using one) over and slide the card into the microSD slot with
    the label facing away from Raspberry Pi. It can only go in one way, and should
    slide home without too much pressure.


