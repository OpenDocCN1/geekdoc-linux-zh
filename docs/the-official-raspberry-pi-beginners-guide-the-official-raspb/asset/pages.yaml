  md: '# Figure 3-11: The Raspberry Pi OS menu


    The programs in the menu are split into categories, the names of which tell you
    what to expect: the Programming category, for example, contains software designed
    to help you write your own programs – as explained starting in Chapter 4, Programming
    with Scratch – while Games will help you free away the hours. Not all of the programs
    will be detailed in this guide; feel free to experiment with them to learn more.


    # The Chromium web browser


    To practise using your Raspberry Pi, start by loading the Chromium web browser:
    click on the raspberry icon at the top-left to bring up the menu, move your mouse
    pointer to select the Internet category, and click on Chromium Web Browser to
    load (Figure 3-12).


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_41_0.png)


    # Figure 3-12: The Chromium web browser


    If you''ve used Google''s Chrome browser on another computer, Chromium will be
    immediately familiar. As a web browser, Chromium lets you visit websites, play
    videos, games, and even communicate with people all over the world on forums and
    chat sites.'
