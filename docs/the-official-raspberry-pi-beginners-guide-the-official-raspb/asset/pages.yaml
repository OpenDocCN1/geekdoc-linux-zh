    | Fonts | |

    | Games | |

    | Internet | |

    | Legacy | |

    | Location/and-nization | |

    | Multimedia | |

    | Network | |

    | Other | |

    | Programming | |

    | Publishing | |

    | System | |


    Appendix B Installing and uninstalling software'
  merge: -1
