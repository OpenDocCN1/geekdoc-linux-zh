  md: '# The Recommended Pi Software tool


    Although Raspberry OS comes preloaded with a wide range of software, it''s compatible
    with even more. A selection of the best of this software can be found in the Recommended
    Software tool.


    Note that the Recommended Software tool needs a connection to the internet. If
    your Raspberry Pi is connected, click on the raspberry menu icon, move your mouse
    pointer to Preferences, and click on Recommended Software. The tool will load,
    then bringing information about available software.


    After a few seconds, a list of compatible software packages will appear (Figure
    3-19). These, like the software in the raspberry menu, are arranged into various
    categories. Click on a category in the pane on the left to see software from that
    category, or click All Programs to see everything.


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_48_0.png)


    **Figure 3-19:** The Recommended Software tool


    If a piece of software has a tick next to it, it''s already installed on your
    Raspberry Pi. If it doesn''t, you can click on the checkbox next to add it and
    mark it for installation. You can mark as many pieces of software as you like
    before installing them all at once, but if you''re using a smaller than recommended
    microSD card you may not have room for them.


    You can also uninstall software in the same way: find a piece of software which
    already has a tick in check box, click the tick to remove it. If you''ve made
    a mistake or changed your mind, just click again to pull the tick back.


    When you''re happy with your software selection, click the OK button to begin
    the installation or uninstallation process (Figure 3-20, overlap). After downloading
    and installing any new software you''ve chosen, a dialogue box will appear; click
    OK to close the Recommended Software tool.'
  merge: -1
  pgno: 48
- img_proc: true
  md: '![](img/0aff4cdab15427839fb48fd7c6f677d3_49_0.png)


    An additional tool for installing or uninstalling software, the Add/Remove Software
    tool, can be found in the Preferences category of the Raspberry Pi OS menu. This
    offers a wider selection of software, but which has not been vetted by the Raspberry
    Pi Foundation.


    # Raspberry Pi Configuration tool


    The last program you''ll learn about in this chapter is known as the Raspberry
    Pi Configuration tool, and it''s a lot like the Little Wizard used at the start:
    it allows you to change various settings in Raspberry Pi OS. Click on the Raspberry
    icon, move your pointer to select the Preferences category, then click on Raspberry
    Pi Configuration to load it (**Figure 3-21**).


    > Figure 3-21: The Raspberry Pi Configuration tool


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_49_1.png)'
  merge: -1
  pgno: 49
- img_proc: true
  md: 'The tool is split into five tabs. The first of these is System: this allows
    you to change the password of your account, set a host name – the name Raspberry
    Pi uses on your local wireless or wired network – and alter a range of other settings.
    The majority of these, though, shouldn''t need changing. Click on the Display
    tab to bring you to the next category. Here you can alter the screen display settings
    if needed, to suit your TV or monitor.


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_50_0.png)


    # MORE DETAILS


    This brief overview is simply to get you to the tool. More detailed information
    on each of its settings can be found in [Appendix E, The Raspberry Pi Configuration
    Tool].


    The Interface tab ranges of settings, all of which start disabled. These settings
    should only be changed if you''re adding new hardware, such as the Raspberry Pi
    Camera Module. The exceptions to this rule are: SSH, which enables a ‘Secure Shell’
    and lets you log into Raspberry Pi from another computer on your network using
    an SSH client; VNC, which enables a ‘Virtual Network Computer’ and lets you see
    and control the Raspberry Pi OS desktop from another computer on your network
    using a VNC client; and Remote GPIO, which lets you Raspberry Pi’s GPIO pins –
    from which you’ll learn in **Chapter 6, Physical computing with Scratch and Python**
    – from another computer on your network.


    Click on the Performance tab to see the fourth category. Here you can set the
    amount of memory used by Raspberry Pi’s graphics processing unit (GPU) and, for
    some models, increase the performance of Raspberry Pi through process known as
    *overclocking*. As before, though, it’s best to leave these settings unless you
    know you need to change them.


    Finally, click on the Localisation tab to see the last category. Here you can
    change your locale, which controls things like the language used in Raspberry
    Pi OS and how numbers are displayed, change the time zone, change the keyboard
    layout, and set your country for WiFi purposes. For now, though, just click on
    Cancel to close the tool without making any changes.


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_50_1.png)


    # WARNING!


    Different countries have different rules about what frequencies a WiFi radio can
    use. Setting the WiFi country in the Raspberry Pi Configuration Tool to a different
    country from the one you’re actually in is likely to make it struggle to connect
    to your networks and can even be illegal under radio licensing laws – so don’t
    do it!'
  merge: -1
