  md: '# THE OFFICIAL RASPBERRY PI BEGINNER''S GUIDE


    With your program running, carefully picking the Sense HAT and Raspberry Pi up
    and rotating them around – but make sure not to dislodge any of its cables! With
    Raspberry Pi''s network and USB ports pointing to the floor, you''ll see the changes
    so the Z axis reads 0G and the X axis reads 1G; turn it again the HDMI and power
    ports are pointing to the floor and now it''s the Y axis reads 1G. If you do the
    opposite and have the HDMI port pointing to the ceiling, you''ll -1G on the Y
    axis index.


    Using the knowledge that the Earth''s gravity is roughly around 1G, and your knowledge
    of the spatial axes, use the readings from the accelerometer to figure out which
    way is down – and, likewise, which is up. You can also use it to detect movement:
    carefully shaking the Sense HAT and Raspberry Pi, and watch the numbers as you
    do: the harder you shake, the greater the acceleration.


    When using sense.accelerometer_raw(), you are telling the Sense HAT to turn off
    the other sensors in the IMU – the gyroscope and magnetometer and return data
    purely from the accelerometer. Naturally, you can do the same thing with your
    other sensors.


    Find the line acceleration = sense.get_accelerometer_raw() and change to:


    ```

    orientation = sense.get_gyroscope_raw()

    ```


    Change the word acceleration on all three lines below it you checked orientation,
    though this time the data is coming purely from the gyroscope without using the
    accelerometer or magnetometer. Unlike the last time you did Click Run, you''ll
    see the orientation of the Sense HAT for all three axes, rounded to the nearest
    whole number. This can be useful if you want to know the orientation of a Sense
    HAT on the back of a robot, for example, without the movement confusing matters,
    or if you''re using the Sense HAT near a strong magnetic field


    Stop your program by clicking on the red button. To use the magnetometer, delete
    everything from your program except for the first lines, then type the following
    below while True:


    ```

    north = sense.get_compass()

    print(north)

    ```


    Run your program and you''ll see the direction of magnetic north printed repeatedly
    to the Python shell. Carefully rotate the Sense HAT and you''ll see the change
    as the Sense HAT''s orientation relative to north shifts: you''ve built a compass!
    If you have a – a fridge magnet will do – try moving it around the Sense HAT to
    see what that does to the magnetometer''s readings.'
