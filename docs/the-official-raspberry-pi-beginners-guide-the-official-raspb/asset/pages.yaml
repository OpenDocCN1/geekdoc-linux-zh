  md: '# Python project: Quick Reaction Game


    Now know how to use buttons and LEDs as inputs and outputs, you''re ready to build
    an example of real-world computing: a two-player quick-reaction game, designed
    to see who has the fastest reaction times! For this project you''ll need a breadboard,
    an LED and a 330 Ω resistor, two push-button switches, some male-to-female (M2F)
    jumper wires, and some male-to-male (M2M) jumper wires.


    Start by building the circuit (Figure 6-7): connect the first switch at the left-hand
    side of your breadboard to the GPIO 14 pin (labelled GPIO14 in Figure 6-7), the
    second switch at the right-hand side of your breadboard to the GPIO 15 pin (labelled
    GPIO15), the LED''s longer leg to the 330 Ω resistor which then connects to the
    GPIO 4 pin (labelled GPIO4) of Raspberry Pi, and the second legs on all your components
    to your breadboard''s ground rail. Finally, connect the ground rail to Raspberry
    Pi''s ground pin (labelled GND).


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_146_0.png)


    Figure 6-7: Wiring diagram for the Quick Reaction Game'
