  md: '# Your first Python program: Hello, World!


    Like the other pre-installed programs on Raspberry Pi, Thny is available from
    the menu: click on the raspberry icon, move the cursor to the Programming section,
    and click on Thny Python IDE. After a few seconds, the Thny user interface (Simple
    Mode by default) will load.


    Thny is a package known as an integrated development environment (IDE), a complicated-sounding
    name with a simple explanation: it gathers together, integrates, all the different
    tools you need to create, develop, or develop, into a single user interface, or
    environment. There are many of IDEs available, while Thny, focuses on supporting
    a single language.


    Unlike Scratch, which gives you visual building blocks as a basis for your program,
    Python is a more traditional programming language where everything is written
    down. Start your first program by clicking on the Python shell area at the bottom
    of the Thny window, then type the following instruction before pressing the ENTER
    key:


    ```

    print("Hello, World!")

    ```


    When you press ENTER, you''ll see that your program begins to run instantly: Python
    will respond, in the same shell area, with the message ''Hello, World!'' (**Figure
    5-1**), just as you asked. That''s because the shell is a direct line to the Python
    interpreter, whose job is to look at your instructions and interpret what they
    mean. This is known as interactive mode, and you can think of it like a face-to-face
    conversation with someone: as soon as you finish what you are saying, the other
    person will respond, wait for whatever you say next.


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_93_0.png)


    **Figure 5-1:** Python prints the ''Hello, World!'' message in the shell area'
