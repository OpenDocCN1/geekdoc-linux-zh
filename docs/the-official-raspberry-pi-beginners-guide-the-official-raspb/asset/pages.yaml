  md: '# THE OFFICIAL RASPBERRY PI BEGINNER''S GUIDE


    # Introducing the Thonny Python IDE


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_92_0.png)


    +   **A Toolbar** - Thonny''s ''Simple Mode'' uses a bar of friendly icons as
    its menu, allowing you to create, save, load, and run your Python programs, as
    well as test it in various ways.


    +   **C Shell** - The Python shell allows you to type individual instructions
    which are then run as soon as you press the **ENTER** key, and also provides information
    about running programs.


    +   **B Script Area** - The script area is where Python programs are written,
    and is split into a main area for your program and a small side margin for showing
    line numbers.


    > THONNY VERSIONS

    Thonny has two interface versions: ''Regular Mode'', and a ''Simple Mode'' which
    is better for beginners. This chapter uses Simple Mode, which is loaded by default
    when you open Thonny from the Programming section of the raspberry menu.


    Chapter 5 Programming with Python 93'
