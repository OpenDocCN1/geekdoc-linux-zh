    # Next steps: Drawing with light


    The Sense HAT''s LED display isn''t just for messages: you can display pictures,
    too. Each LED can be treated as a single pixel – short for picture element – in
    an image of your choosing, allowing you to jazz up your programs with pictures
    and even animation.


    To create drawings, though, you need to be able to change individual LEDs. To
    do that, you''ll need to understand how the Sense HAT''s LED matrix is laid out
    in order to write a program that turns the correct LEDs on or off.'
