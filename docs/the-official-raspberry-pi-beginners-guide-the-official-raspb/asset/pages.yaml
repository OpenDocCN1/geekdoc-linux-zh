- img_proc: true
  md: 'Next, type the following:


    ```

    camera.start_preview()

    button.wait_for_press()

    camera.capture(''/home/pi/Desktop/image.jpg'')

    camera.stop_preview()

    ```


    Click Run and you''ll see a preview of whatever your camera is pointing at. The
    preview will stay on screen until you press the push-button: press now, and the
    preview will close after your program saves a folder to the desktop. Find the
    picture, image.jpg, and double-click to open it and confirm the program is working.


    Stop-motion animation involves creating lots of still images, to give the impression
    of movement when they''re all put together. Having all these individual pictures
    on your desktop would make a mess, so you need a folder to store them all. Right-click
    anywhere on the desktop that doesn''t already have a file or icon, choose Create
    New and Folder (**Figure 8-10**). Call the folder *animation*, in all lower-case
    letters, then click the OK button.


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_206_0.png)


    **Figure 8-10:** Create a new folder for your captured images


    Having to restart your program every time you capture a picture for your animation
    isn''t very good, so you need to change it to run in a loop. Unlike the previous
    loops you''ve created, though, this needs one way to close gracefully—otherwise
    if you stop the program while the camera preview is showing, you won''t be able
    to see the desktop any more! To do this, you need to use two special instructions:
    **try** and **except**.'
  merge: -1
