  md: '# Next steps: reading a button


    Outputs like LEDs are one thing, the ''input/output'' part of ''GPIO'' means you
    can use pins as inputs too. For this project, you''ll need a breadboard, male-to-male
    (M2M) and male-to-female (M2F) jumper wires, and a push-button switch. If you
    don''t have a breadboard you can use female-to-female (F2F) jumper wires, but
    the button will be much harder to press without accidentally breaking the circuit.


    Start by adding the push-button to your breadboard. Make sure they''re in different
    number rows of the breadboard, if it has four legs, turn it so the sides the legs
    come out among the breadboard''s rows and the flat leg-free sides are at the top
    and bottom. Connect the ground rail of your breadboard to a ground pin of Raspberry
    Pi GND on a male-to-female jumper wire, then connect one leg of your push-button
    to the ground rail with a male-to-male jumper wire. Finally, connect the other
    leg – on the same side as the leg you just connected, if using a four-leg switch
    – to the GPIO 2 pin (marked GPIO 6-4) of Raspberry Pi with a male-to-female jumper
    wire.


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_133_0.png)


    +   Figure 6-4: Wiring a push-button to the GPIO pins


    # Reading a button in Scratch


    Start a new Scratch program and drag a `when clicked` block onto the code area.
    Connect a `set gpio to input pulled high` block, and select the number 2 from
    the drop-down to match the GPIO pin you used for the push-button.'
