  md: '# Chapter 6


    # Physical

    computing with

    Scratch and Python


    There''s more to coding than doing things on screen – you can also control electronic
    components connected to your Raspberry Pi’s GPIO pins


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_119_0.png)


    W hen people think of ''programming'' or ''coding'', they''re usually – and naturally
    – thinking about software. Coding can be more than just software, it can affect
    the real world through hardware. This is known as physical computing.

    As the name suggests, physical computing is all about controlling things in the
    real world with your programs: hardware, rather than software. When you set the
    program on your washing machine, change the temperature on your programmable thermostat,
    or press a button at traffic lights to cross the road safely, you are using physical
    computing.

    Raspberry Pi is a great device for learning about physical computing thanks to
    one key feature: the general-purpose input/output (GPIO) header.'
  merge: -1
  pgno: 119
- img_proc: true
  md: '# Introducing the GPIO header


    Found at the top edge of Raspberry Pi''s circuit board , or at the back of Raspberry
    Pi 400, and looking like two long rows of metal pins, the GPIO (general-purpose
    input/output) header is how you can connect hardware like LEDs and switches to
    Raspberry Pi for control programs you create. The pins can be used for both input
    and output.


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_120_0.png)


    | Raspberry Pi pin numbers (4B, 3B+, 3B, 2B, Zero, A+, B+) | ID EEPROM |

    |---|---|

    | GPIO Ground 3.3V 5V | Advanced use only |


    Raspberry Pi''s GPIO header is made up of 40 male pins. Some pins are available
    for you to use in your physical computing projects, some pins provide power, while
    other pins are reserved for communicating with add-on hardware like the Sense
    HAT (Chapter 7).


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_120_1.png)


    | Raspberry Pi 400 pin numbers |

    |---|---|

    | GPIO Ground 3.3V 5V ID EEPROM Advanced use only |


    Raspberry Pi 400 has the same GPIO header with all the pins, but it''s turned
    upside-down to other Raspberry Pi models. This diagram assumes you''re looking
    at the GPIO header from the back of Raspberry Pi 400. Always double-check your
    wiring when connecting anything to Raspberry Pi 400''s GPIO header – it''s easy
    to forget, despite the ''Pin 40'' and ''Pin 1'' labels on the case!


    > GPIO EXTENSIONS

    It''s perfectly possible to use Raspberry Pi 400''s GPIO header as-is, but you
    might find it easier to use an extension. With an extension, the pins are brought
    around to the side of Raspberry Pi 400, meaning you can check and adjust your
    wiring without having to go around the back.

    Compatible extensions include the Black Hat Hack3r from pimoroni.com and the Pi
    T-Cobbler Plus from adraft.com.

    If you use an extension, always check how it is wired - some, like the Pi T-Cobbler
    Plus, change the layout of the GPIO pins. When in doubt, always use the manufacturer''s
    instructions.'
  merge: -1
  pgno: 120
- img_proc: true
  md: 'There are several categories of pin types, each of which has a particular function:


    | 3V3 | 3.3 volts power | A permanently-on-source of 3.3 V power, the same voltage
    Raspberry Pi runs at internally |

    | 5V | 5 volts power | A permanently-on-source of 5 V power, the same voltage
    as Raspberry Pi takes in at the micro USB power connector |

    | Ground (GND) | 0 volts ground | A ground connection, used to complete a circuit
    connected to power source |

    | GPIO XX | General-purpose input/output pin number ''XX'' | The GPIO pins available
    for your programs, identified by a number from 2 to 27 |

    | ID EEPROM | Reserved special-purpose pins | Pins reserved for use with Hardware
    Attached on-Top (HAT) and other accessories |


    > ### WARNING!

    Raspberry Pi''s GPIO header is a fun and safe way to experiment with physical
    computing, but it has to be treated with care. Be careful not to bend the pins
    when connecting and disconnecting hardware. Never connect two pins directly together,
    accidentally or deliberately, unless expressly told to do so in a project''s instructions;
    this is known as a short circuit and, depending on the pins, can permanently damage
    your Raspberry Pi.'
  merge: -1
  pgno: 121
- img_proc: true
  md: '# Electronic components


    The GPIO header is only part of what you''ll need to begin working with physical
    computing; the other half is made up of electrical components, the devices you''ll
    control from the GPIO header. There are thousands of different components available,
    but most GPIO projects are made using the following common parts.


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_122_0.png)


    A breadboard, also known as a solderless breadboard, can make physical computing
    projects considerably easier. Rather than having a bunch of separate components
    which need to be connected with wires, a breadboard lets insert components and
    have them connected through metal tracks which are hidden beneath its surface.
    Many breadboards also include sections for power distribution, making it easier
    to build your circuits. You don''t need a breadboard to get started with physical
    computing, but it certainly helps.


    Jumper wires, also known as jumper leads, connect components to your Raspberry
    Pi and, if you''re not using a breadboard, to each other. They are available in
    three versions: male-to-female (M2F), which you''ll need to connect a breadboard
    to the GPIO pins; female-to-female (F2F), which can be used to connect individual
    components together if you''re not using a breadboard; and male-to-male (M2M),
    which is used to make connections from one part of a breadboard to another. Depending
    on your project, you may need all three types of jumper wire; if you''re using
    a breadboard, you can usually get away with M2F and M2M jumper wires.'
  merge: -1
  pgno: 122
- img_proc: true
  md: 'A push-button switch, also known as a momentary switch, is the type of switch
    you''d use to control a games console. Commonly available with two or four legs
    – either type will work with Raspberry Pi – the push-button is an input device:
    you can tell your program to watch out for it being pushed and then perform a
    task. Another common switch type is a latching switch; whereas a pushbutton is
    only active while you''re holding it down, a latch switch – like you''d find in
    a light switch – activates when you toggle it, then stays active until you toggle
    it.


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_123_0.png)


    A light-emitting diode (LED) is an output device; you control directly from your
    program. An LED lights up when it''s on, and you''ll find them all over your house,
    ranging from the small ones which let know when you''ve left your washing machine
    switched on, to the large ones you might have lighting up your rooms. LEDs are
    available in a wide range of shapes, colours, and sizes, but not all are suitable
    for Raspberry Pi; avoid any which say they are designed for 5 V or 12 V power
    supplies.


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_123_1.png)


    Resistors are components which control the flow of electrical current, and are
    available in different values measured using a unit called ohms (Ω). The higher
    the number of ohms, the more resistance is provided. For Raspberry Pi physical
    computing projects, their common use is to protect LEDs from drawing too much
    current and damaging themselves or your Raspberry Pi; for this you''ll want resistors
    rated at 330 Ω, many electrical suppliers sell handy packs containing a number
    of differently used values to give you more flexibility.


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_123_2.png)


    A piezoelectric buzzer, usually called a buzzer or a sounder, is another output
    device. Where an LED produces light, a buzzer produces a noise – a buzzing noise,
    in fact. Inside the buzzer''s plastic housing are a pair of metal plates; when
    active, these plates vibrate against each other to produce the buzzer sound. There
    are two types of buzzer: active buzzers and passive buzzers. Make sure to get
    an active buzzer, as these are the simplest to use.'
  merge: -1
  pgno: 123
- img_proc: true
  md: 'Other common electrical components include motors, which need a special control
    board before they can be connected to Raspberry Pi, infrared sensors that detect
    movement, temperature and humidity sensors which can be used to predict the weather,
    and light-dependent resistors (LDRs) – input devices which operate like a reverse
    LED by detecting light. Sellers all over the world provide components for physical
    computing with Raspberry Pi, either as individual parts or in kits which everything
    you need to get started. To find sellers, visit rpf.io/products, click on Raspberry
    Pi 4, and you will get a list of Raspberry Pi partner online stores (approved
    resellers) for your country or region.


    To complete the projects in this chapter, you should have at least:


    +   3 × LEDs: red, green, and yellow or amber

    2 × push-button switches

    1 × active buzzer

    Male-to-female (M2F) and female-to-female (F2F) jumper wires

    Optionally, a breadboard and male-to-male (M2M) jumper wires'
  merge: -1
