  md: '# Capturing still pictures


    To capture a picture, rather than just a live preview, your program needs to be
    changed.

    Start by reducing the delay for the preview: find the **sleep(10)** line, and
    change it to read:


    ```

    sleep(5)

    ```


    Directly under that line, add the following:


    ```

    camera.capture(''/home/pi/Desktop/image.jpg'')

    ```


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_203_0.png)


    The **camera.capture** function tells Python to save a still image, and it needs
    to know not only what the image should be called but in what folder it should
    be saved. In this example, you''re saving it to the desktop - find it by looking
    just below the Wastasket. If the Thorny window is in the way, just click and drag
    on the title bar to move it to the file to see the image you captured **Figure
    8-8**. Congratulations: you''ve programmed a camera!


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_203_1.png)


    +   Figure 8-8: Opening the captured image'
  merge: -1
  pgno: 203
- img_proc: true
  md: '# Capturing moving video


    As well as taking still images, you can capture video. Delete everything between
    the lines camera.start_preview() and camera.stop_preview(), then type the following
    under camera.start_preview():


    ```

    camera.start_recording(''/home/pi/Desktop/video.h264'')

    sleep(10)

    camera.stop_recording()

    ```


    The camera preview will appear, as before, but this time it will also be recorded
    to a file on your desktop. Wait for the 10 seconds you told Python to sleep –
    perhaps do a little dance in front of the camera to make the video interesting
    – then, when the preview has closed, you''ll find your video on the desktop.


    To play the video, simply double-click on the video.h264 file on your desktop.
    The video will start playing – and if you did dance, you''ll see it played back
    to you! After the video finished, the player software will quit with a friendly
    message in the Terminal. Congratulations! you can now capture video using your
    Raspberry Pi Camera Module or HQ Camera!


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_204_0.png)


    # Push-button stop-motion animation


    Using what you''ve learned in this chapter, and your knowledge of how to connect
    hardware Raspberry Pi’s GPIO header from Chapter 6, Physical Computing, it''s
    time to build something special: your own stop-motion animation studio.


    Stop-motion animation is the process of taking lots of pictures of still objects,
    like model cars or action figures, and moving the objects slicght between each
    picture. Although the objects never move in any of the pictures, if you show them
    one after another quickly enough it''ll look like they''re moving as quickly or
    as slowly as you like!'
  merge: -1
  pgno: 204
- img_proc: true
  md: 'For this project, you''ll need a push-button switch, a breadboard, a male-to-male
    (M2M) jumper wire, and a pair of male-to-female (M2F) jumper wires. If you don''t
    have a breadboard you can connect the switch using female-to-female (F2F) cables
    instead, but it will be difficult to press. If you needing about any of these
    components, turn to Chapter 6, Physical computing with Scratch and Python. You''ll
    need objects to animate: these can be anything from a blob of clay to a toy car
    or an action figure.


    Start by creating the circuit: add the push-button to the breadboard, connect
    the ground rail of the breadboard to a ground pin on Raspberry Pi (marked GND
    on Figure 8-9) with a male-to-male jumper wire. Use a male-to-male jumper wire
    to connect one leg of the switch to the ground rail on the breadboard, and a male-to-male
    jumper wire to connect the other leg of the switch to GPIO pin 2 (marked GP2 on
    Figure 8-9).


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_205_0.png)


    **Figure 8-9:** Wiring diagram for connecting a push-button to the GPIO pins


    Create a new project in Thny and set it as Stop Motion. Start by importing and
    setting the libraries you need for using the camera and the GPIO port:


    ```

    from picamera import PiCamera

    from gpiozero import Button

    camera = PiCamera()

    button = Button(2)

    ```'
  merge: -1
