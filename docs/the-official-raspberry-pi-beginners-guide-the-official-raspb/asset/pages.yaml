    # Scratch project: Sense HAT Sparkler


    Now you know your way around the Sense HAT, it is time to put everything you''ve
    learned to build a heat-sensitive sparkle – a device which is at its happiest
    when it''s cold and gradually slows down the hotter it gets.


    Start a new Scratch project and add the Raspberry Pi Sense HAT extension, if not
    already loaded. Always begin with four blocks: `when clicked`, `clear display`,
    `set background to black`, and `set colour to white`, remembering you''ll have
    to change the colours from their default settings.


    Start by creating a simple, but spectacular. Drag a `forever` block onto the code
    area, then fill it with `set pixel x 0 y 0 to colour`. Rather than using set numbers,
    fill in each of the x, y, and colour sections of block with `pick random 1 to
    10` Operators block.


    The values 1 to 10 aren''t very useful here, so you''ll need to do some editing.
    The first two numbers in the `set pixel` block are the X and Y coordinates of
    the pixel on the LED matrix, which means they should be between 0 and 7 – so change
    the first two blocks to read `pick random 0 to 7`. The next section is the block
    you should set. By using the colour selector, the colour you choose is shown directly
    in the script area; internally, though, the colours are represented by a number,
    and you can use the number directly. Edit the last block to read `pick random
    0 to 1677215`.


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_189_1.png)


    Click the flag and you''ll see the LEDs on the Sense HAT begin to light up in
    random colours (**Figure 7-28**). Congratulations! you''ve made an electronic
    sparkler!'
