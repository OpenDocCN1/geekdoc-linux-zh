  md: 'If your animation is moving too quickly or too slowly, change the -r 10 part
    of ffmpeg command to a lower or higher number: this is the frame rate, or how
    many still images there are in one second of video. A lower number will make your
    animation run more slowly, but less smooth; a higher number smoother, but will
    make the animation run more quickly.


    If you want to save your video, be sure to drag and drop it from the desktop to
    your Videos folder; otherwise, next time you run your program, you''ll end up
    overwriting the file!


    # Advanced camera settings


    If you need more control over the Raspberry Pi Camera Module or HQ Camera, you
    can use the Python camera library to access various settings. These settings,
    along with their default values, are detailed below for inclusion in your programs.


    camera.awb_mode = ''auto''

    This sets the automatic white balance of the camera, and can be set to any of
    the following modes: off, auto, sunlight, cloudy, shade, tungsten, fluorescent,
    incandescent, flash, or horizon. If you find your pictures and videos look a little
    blue or yellow, try a different mode.


    camera.brightness = 50

    This sets the brightness of the camera image, from darkest at 0 to brightest at
    100.


    camera.color_effects = None

    This changes the colour effect in use by the camera. Normally, this should be
    left alone, but if you provide a pair of numbers you can alter the camera records
    colour: (128, 128) to create a black and white image.


    camera.contrast = 0

    This sets the contrast of the image. A higher number will make things look more
    dramatic and stark; a lower number will make things look more washed out. You
    can use any number between -100 for minimum contrast and 100 for maximum contrast.


    camera.crop = (0.0, 0.0, 1.0, 1.0)

    This allows you to crop the image, cutting parts off the sides and tops to capture
    only the part of the image you need. The numbers represent X coordinate, Y coordinate,
    width, and height, and by default captures the full image. Reducing the last two
    numbers ~ 0.5 and 0.5 is a good starting point to see what this effect setting.


    camera.exposure_compensation = 0

    This sets the exposure compensation of the camera, allowing you to manually control
    how much light is captured for each image. Unlike changing the brightness setting,
    this actually controls the camera itself. Valid values range from -25 for a very
    dark image to 25 for a very bright image.'
  merge: -1
  pgno: 210
- img_proc: true
  md: '```

    camera.exposure_mode = ''auto''

    ```


    This sets the exposure mode, or the logic the Camera Module / HQ Camera uses to
    decide how an image should be exposed. Possible modes are: off, auto, night, backlight,
    spotlight, sports, snow, beach, veryylong, fixedfps, antishake, and fireworks.


    ```

    camera.framerate = 30

    ```


    This sets the number of images captured to create a video per second, or the frame
    rate. A higher frame rate creates a smoother video, but takes up more storage
    space. Higher frame rate require lower resolution to be used, which can be set
    via camera.resolution.


    ```

    camera.hflip = False

    ```


    This flips the camera image across the horizontal, or X, axis when set to True.


    ```

    camera.image_effect = ''none''

    ```


    This applies one of a range of image effects to the video stream, which will be
    visible in the preview as well as the saved images and videos. Possible effects
    are: blur, cartoon, colorbalance, colorpoint, contours, deinterlace1, deinterlace2,
    denoise, emboss, film, gpen, hatch, negative, oilpaint, posterize, saturation,
    sketch, solarized, washedout, and watercolor.


    ```

    camera.ISO = 0

    ```


    This changes the ISO setting of the camera, which affects how sensitive it is
    to light. By default, the camera adjusts this automatically depending on the available
    light. You can set the ISO yourself using one of the following values: 100, 200,
    320, 400, 500, 640, 800. The better the ISO, the better the camera will perform
    in low-light environments or the grainier the image or video captures.


    ```

    camera.meter_mode = ''average''

    ```


    This controls how the camera depends on the amount of light when setting its exposure.
    The default averages the amount of light available throughout the whole picture;
    other possible modes are backlit, matrix, and spot.


    ```

    camera.resolution = (1920, 1080)

    ```


    This sets the resolution of the captured picture or video, represented by two
    numbers for width and height. Lower resolutions will take up less storage space
    and allow you to use a higher frame rate; higher resolutions are better quality
    but take up more storage.


    ```

    camera.rotation = 0

    ```


    This controls the rotation of the image, from 0 degrees through 90, 180, and 270
    degrees. Use this if you can''t position the camera so that the ribbon is coming
    out from the bottom.'
  merge: -1
