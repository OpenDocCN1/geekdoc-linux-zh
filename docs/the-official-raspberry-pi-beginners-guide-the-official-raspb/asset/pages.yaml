  md: '# The File Manager


    Files you save – e.g. programs, videos, images – all go into your home directory.
    To see the home directory, click on the raspberry icon to bring up the menu, move
    the mouse pointer to select Accessories, then click on File Manager to load it
    (Figure 3-14).


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_43_0.png)


    The File Manager lets you browse the files and folders, also known as directories,
    on Raspberry Pi’s microSD, as well as on any removable storage devices – like
    USB flash drives – you connect to Raspberry Pi’s USB ports. When you first open
    it, it automatically goes to your home directory. Here you’ll find a series of
    other folders, such as directories, which – the menu – are arranged in categories.
    The main subdirectories are:


    +   - Books: This contains digital copies of books, magazines, and other publications
    from Raspberry Pi Press, including a copy of this Beginner’s Guide. You can read
    these, and download more, with the Bookshelf application; find it in the Help
    section of the menu.


    +   - Desktop: This folder is what you see when you first load Raspberry Pi OS;
    if you save a file in here it will appear on the desktop, making it easy to find
    and load.


    +   - Documents: Home is to most of the files you’ll create, from short stories
    to recipes.


    +   - Downloads: When you download a file from the internet using the Chromium
    web browser, it will be automatically saved in Downloads.


    +   - Music: Any music you create or put on Raspberry Pi can be stored here.


    +   - Pictures: This folder is specifically for pictures, known in technical terms
    as image files.


    +   - Public: While most of your files are private, anything you put in Public
    will be available to other users of Raspberry Pi, even if they have their own
    username and password.'
  merge: -1
  pgno: 43
- img_proc: true
  md: 'Templates: This folder contains templates, blank documents with a basic layout
    or structure already in place, you have created or are installed by your applications.


    Videos: A folder for videos, and the first place video-playing programs will look.


    The File Manager itself is split into two panes: the left pane shows the directories
    on your Raspberry Pi, and the right pane shows the files and subdirectories of
    the directory selected in the left pane. If you plug a removable storage device
    into Raspberry Pi''s USB port, a window will pop up asking if you''d like to open
    it in the File Manager (Figure 3-15); click OK and you''ll be able to see its
    files and directories.


    +   Figure 3-15: Inserting removable device


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_44_0.png)


    Files can easily be copied between Raspberry Pi''s microSD card and a removable
    device: with both your home directory and the removable device open in separate
    File Manager windows, move your mouse pointer to the file you want to copy, copy
    and hold the left mouse button down (Figure 3-16, overall). This is known as dragging
    and dropping.


    Another method is to click on the file, click on the Edit menu, click on Copy,
    click on the other window, click on the Edit menu, and copy on Paste.


    The cut option, also available in the Edit menu, is similar except it deletes
    the file from its original home after making the copy. Both options can also be
    used through the keyboard shortcuts CTRL+C (copy) or CTRL-X (cut), and paste via
    CTRL+V.


    # KEYBOARD SHORTCUTS


    When you use a keyboard shortcut like CTRL+C, it means to hold down the first
    key on the keyboard (CTRL), press the second key (C), then let go of both keys.'
