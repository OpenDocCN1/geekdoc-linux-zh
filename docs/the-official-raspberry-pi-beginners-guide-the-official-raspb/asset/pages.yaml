    ![](img/0aff4cdab15427839fb48fd7c6f677d3_104_0.png)


    Figure 5-11: Changing the background and snowflake colours


    You can also have the colours chosen randomly from a list, using the random library.
    Go back to the top of your program and insert the following as line 2:


    ```

    import random

    ```


    Change the background colour in what is now line 4 from ''blue'' to ''grey'',
    then create a new variable called ''colours'' by inserting a new line 5:


    ```

    colours = ["cyan", "purple", "white", "blue"]

    ```


    > U.S. SPELLINGS

    Many programming languages use American English spellings, and Python is no exception:
    the command for changing the colour of the turtle''s pen is spelled color, and
    if you spell it the British English as colour it simply won''t work. Variables,
    though, can have any spelling you like – which is why you''re able to call your
    new variable colours and have Python understand.


