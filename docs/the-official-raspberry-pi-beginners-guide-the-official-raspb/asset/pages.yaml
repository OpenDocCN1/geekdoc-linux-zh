  md: '# # Appendix A

    Install an operating system to a microSD card


    You can buy microSD cards with NOOBX (New Out Of The Box Software) pre-installed
    on them from all good Raspberry Pi retailers, enabling you to easily install Raspberry
    Pi OS (previously known as Raspian) for your Raspberry Pi. Alternatively, you
    can use the following instructions to use the Raspberry Pi Imager to install an
    operating system manually to your own (or reused) microSD card.


    > > **WARNING!**

    If you''ve purchased a microSD card with NOOBX already installed, you don''t need
    to do anything else than plug it into your Raspberry Pi. These instructions are
    for blank microSD cards, or for previously used cards onto which you want to install
    a fresh operating system. Carrying out these instructions on a microSD card with
    files will lose those files, so make sure you''ve backed things up first!


    ## Download Raspberry Pi Imager

    Based on Debian, Raspberry Pi OS is the official operating system for Raspberry
    Pi. The easiest way to install Raspberry Pi OS on a microSD card for your Raspberry
    Pi is to use the Raspberry Pi Imager tool, downloadable from rpi.io/downloads.
    Note that this method supersedes installing your operating system via NOOBS, although
    the latter is still available from the same downloads page.'
  merge: -1
  pgno: 213
- img_proc: true
  md: 'The Raspberry Pi Imager application is available for Windows, macOS, and Ubuntu
    Linux computers, so choose the relevant version for your system.


    On macOS, double-click the downloaded DMG file. You may need to change your Security
    & Privacy settings to allow apps downloaded from ''App Store and identified developers''
    to enable it to run.


    On a Windows PC, double-click the downloaded EXE file. When prompted, select the
    ''Yes'' button to enable it to run. Then click the ''Install'' button to start
    the installation.


    # Write the OS to the microSD card


    Attach your microSD card to your PC or Mac computer: you will need a microSD USB
    adapter unless it has one built in. Note that the card doesn''t need to be pre-formatted.


    Launch the Raspberry Pi Imager application. Click the ''Choose OS'' button to
    select which operating system you would like to install. The top option is standard
    Raspberry Pi OS - if you prefer the slimmed-down Lite version, or the Full version
    (with all the recommended software pre-installed), select ''Raspberry Pi OS (other)''.
    are also options to install LibreELEC (choose the version for your Raspberry Pi
    model) and Ubuntu Core or Server.


    | Operating System | |

    |---|-|

    | Raspberry Pi OS (32-bit) A port of Debian with the Raspberry Pi Desktop (Recommended)<br>Released:
    2020-05-27<br>Online - 1.1 GB download | |

    | Raspberry Pi OS (other) Other Raspberry Pi OS based images | |

    | LibreELEC Kodi Entertainment Center distribution | |

    | Ubuntu Choose from Ubuntu Core and Server | |


    If you want to install a different OS, as simply download its image file from
    the relevant website, then select the ''Custom Use'' option in Raspberry Pi Imager.


    With an OS selected, click the ''Choose SD card'' button and select your microSD
    card (typically there will be just one).


    Finally, click the ''Write'' button and wait while the utility writes the selected
    OS to your card and verifies it. When complete, you may remove the microSD card.
    You can then insert it into your Raspberry Pi and boot it up into the operating
    system you just installed.'
  merge: -1
  pgno: 214
- img_proc: true
  md: '# # Appendix B

    Installing and uninstalling software


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_215_0.png)


    Raspberry Pi OS comes with a selection of popular software packages, hand-picked
    by the Raspberry Pi Foundation, but these are not the only packages that will
    work on a Raspberry Pi. Using the following instructions, you can browse additional
    software, install it, and uninstall it again - expanding the capabilities of your
    Raspberry Pi.

    The instructions in this appendix are on top of those in **Chapter 3, Using your
    Raspberry Pi**, which explains how to use the Recommended Software tool; if you
    haven''t read that already, do so before using the methods described in this appendix.


    > ### CARD CAPACITY

    Adding software to your Raspberry Pi will take up space on your microSD card.
    A 16GB or larger card will let you install more software, to check whether the
    card you intend to use is compatible with Raspberry Pi, visit rfp.io/sdcardlist.'
  merge: -1
  pgno: 215
- img_proc: true
  md: '# Browsing available software


    To see and search the list of software packages available for Raspberry Pi OS,
    using what are known as its software repositories, click the raspberry icon to
    load the menu, select the Preferences category, then click Add/Remove Software.
    After a few seconds, the tool''s window will appear.


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_216_0.png)


    The left-hand side of the Add/Remove Software window contains a list of categories
    – the same categories that you find in the main menu when you click on the raspberry
    icon. Clicking on one will show you a list of the software available in that category.
    You can also enter a search term in the box at the top-left of the window, such
    as ''text editor'' or ''game'', and see a list of matching software packages from
    any category. Clicking on any package brings additional information about it in
    the space to the bottom of the window.


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_216_1.png)


    # Appendix B Installing and uninstall software'
  merge: -1
  pgno: 216
- img_proc: true
  md: 'If the category you''ve chosen has lots of software packages available, it
    may take some time for the Add/Remove Software tool to finish working through
    the list.


    # Installing software


    To select a package for installation, check the box next to it by clicking on.
    You can install more than one package at once; just keep clicking to add more
    packages. The icon next to the package will change to an open box with a ''+’
    symbol, to confirm that it''s going to be installed.


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_217_0.png)


    When you''re happy with your choices, click the OK or Apply button; the only difference
    is that OK will close the Add/Remove Software tool when your software is installed,
    while the Apply button leaves it open. You will be asked to enter your password,
    to confirm your identity you wouldn''t want just anyone able to add or remove
    software from your Raspberry Pi, after all!


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_217_1.png)


    218 THE OFFICIAL RASPBERRY PI BEGINNER''S GUIDE'
  merge: -1
  pgno: 217
- img_proc: true
  md: 'You may find that when you install a single package, other packages are installed
    alongside it; these are known as dependencies, packages that the software you
    chose to install needs to work – sound effect bundles for a game, for example,
    a database to go with a web server. Once the software is installed, you can find
    it by clicking on the raspberry icon to load the menu and finding the software
    package''s category. Be aware that the category is not always the same as the
    category from the Add/Remove Software Tool, while some software doesn''t have
    an entry in the menu all; this is known as command-line software and needs to
    be run at the Terminal. For more information on the command line and the Terminal,
    turn to Appendix C, The command-line interface.


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_218_0.png)


    # Uninstalling software


    To select a package for removal, or uninstallation, find it in the list of packages
    – the search function is here and uncheck the box next to it by clicking on it.
    You can uninstall more than one package at once: just keep clicking to remove
    more packages. The icon next to the package will change to an open box or a small
    recycle bin, to confirm that it''s going to be uninstalled.


    | Options | |

    | --- | --- |

    | Q | |

    | Accessories | |

    | Admin Tools | |

    | Communication | |

