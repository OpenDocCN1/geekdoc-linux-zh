  md: '# CHALLENGE: AUTO-ROTATE

    Using what you''ve learned about the LED matrix and the inertial measurement unit''s
    sensors, you can write a program that rotates an image depending on the position
    of the Sense HAT?


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_185_0.png)


    # Joystick control


    The Sense HAT''s joystick, found in the bottom-right corner, may be small, but
    it''s surprisingly powerful: as well as being able to emphas inputs in four directions
    – up, down, left, and right – it also has a fifth input, accessed by pushing it
    down from above like a push-button switch.


    > WARNING!

    The Sense HAT joystick should only be used if you''ve fitted the spacers as described
    at the start of this chapter. Without the spacers, pushing down on the joystick
    can flex the Sense HAT board and damage both the Sense HAT and Raspberry Pi''s
    GPIO header.


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_185_1.png)


    # Joystick control in Scratch


    Start a new program in Scratch with the Raspberry Pi Sense HAT extension loaded.
    As before, drag a `when` `clicked` Events block onto your script area, drag a
    `clear display` block underneath by dragging and editing a `set background to
    black` and `set colour to white` block.


    In Scratch, the Sense HAT''s joystick maps to the cursor keys on the keyboard:
    pushing the joystick is equivalent to pressing the up key, pushing it down is
    the same as pushing the down key, pushing it left the same as the left arrow key,
    and pushing it right the same as the right arrow key; pushing the joystick inwards
    like a push-button switch, meanwhile, is equivalent to pressing the ENTER key.


    > WARNING!

    Joystick control is only available on the physical Sense HAT. When using the Sense
    HAT Emulator, use the corresponding keys on your keyboard to simulate joystick
    presses instead.


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_185_2.png)'
  merge: -1
  pgno: 185
