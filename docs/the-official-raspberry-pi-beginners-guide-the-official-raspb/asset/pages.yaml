  md: '# Chapter 5

    Programming with Python


    Now you''ve got to grips with Scratch, we''ll show you how to do text-based coding
    with Python


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_91_0.png)


    Named after the Monty Python comedy troupe, Guido van Rossum''s Python has grown
    from a hobby project first released to the public in 1991 to a much-loved programming
    language powering a wide range of projects. Unlike the visual environment of Scratch,
    Python is text-based: you write instructions, using a simplified language and
    specific format, which the computer carries out.


    Python is a great next step for those who have already used Scratch, offering
    increased flexibility and a ''traditional'' programming environment. That''s not
    to say it''s difficult to learn, though with a little practice, anyone can write
    Python programs for everything from simple calculations to surprisingly complicated
    games.


    This chapter builds on terms and concepts introduced in Chapter 4, Programming
    with Scratch 3. If you haven''t worked through the exercises in that chapter yet,
    you''ll find this chapter easier to follow if you go back and do so first.'
  merge: -1
  pgno: 91
