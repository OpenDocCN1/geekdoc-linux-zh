  md: '# Chapter 1


    # Get to know your Raspberry Pi


    Get fully acquainted with your new credit-card-sized computer by taking a guided
    tour of Raspberry Pi. Discover its numerous components and what they do


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_7_0.png)


    Raspberry Pi is a remarkable device: a fully functional computer in a tiny and
    low-cost package. Whether you''re looking for a device you can use to browse the
    web or play games, you are interested in learning how to write your own programs,
    or are looking to create your own circuits and physical devices, Raspberry Pi
    – and its amazing community – will support you every step of the way.


    Raspberry Pi is known as a single-board computer, which means exactly what it
    sounds like: it''s a computer, just like a desktop, laptop, or smartphone, but
    built on a single printed board. Like most single-board computers, Raspberry Pi
    small – roughly the same footprint as a credit card – but that doesn''t mean it''s
    not powerful: a Raspberry Pi can do anything bigger and more power-hungry computer
    can, though not necessarily as quickly.


    The Raspberry Pi family was born from a desire to encourage more hands-on computer
    education around the world. Its creators, who joined together to form the non-profit
    Raspberry Pi Foundation, had little idea it would prove so popular: the few thousand
    board in 2012 to test the waters were immediately sold out, and millions have
    been shipped all over the world in the years since. These boards found their ways
    into homes, classrooms, offices, data centres, factories, and self-piloting boats
    and spacecraft balloons.


    Various models of Raspberry Pi have been released since the original Model B,
    each either improved specifications or features specific to a particular use-case.
    The Raspberry Pi Zero family, for example, is a tiny version of the size Raspberry
    Pi which drops a few features – in particular the multiple USB ports and wired
    network port – in favour of a significantly smaller layout and reduced power requirements.'
  merge: -1
  pgno: 7
- img_proc: true
  md: '# THE OFFICIAL RASPBERRY PI BEGINNER''S GUIDE


    All Raspberry Pi models have one thing in common, though: they''re compatible,
    meaning software written for one model will run on any other model. It''s even
    possible to take the latest version of Raspberry Pi''s operating system and run
    it on an original pre-launch Model B prototype. It will run more slowly, it''s
    true, but it will still run.


    Throughout this book you''ll be learning about Raspberry Pi 4 Model B and Raspberry
    Pi 400, the latest and most powerful versions of Raspberry Pi. What you learn,
    though, can be easily applied to other models in the Raspberry Pi family, so don''t
    worry if you''re using a different version.


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_8_0.png)


    # A guided tour of Raspberry Pi


    Unlike a traditional computer, which hides its inner workings in a case, a standard
    Raspberry Pi has all its components, parts, and features on display - although
    you can buy a case to provide extra protection, if you''d prefer. This makes it
    a great tool for learning about the various parts of a computer do, and also makes
    it easy to learn what goes where when it comes time to plug in the various extras
    - known as peripherals - you''ll need to get started.


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_8_1.png)


    Chapter 1 Getting to know your Raspberry Pi'
  merge: -1
