  md: '![](img/0aff4cdab15427839fb48fd7c6f677d3_209_0.png)


    Figure 8-11: The captured images in the folder


    At the moment, though you have a folder full of still images. To create an animation,
    you need to turn them into a video. To do so, click the raspberry icon to load
    the menu, choose Accessories, and click on Terminal. This opens a command-line
    interface, discussed in more detail in Appendix C, which allows you to type commands
    to Raspberry Pi. When the Terminal loads, start by changing the folder you made
    by typing:


    ```

    cd Desktop/animation

    ```


    It''s important that the ''D'' of ''Desktop'' is in upper-case; Raspberry Pi OS
    is what is known as case-sensitive, which means if you don''t type a command or
    folder name exactly as it was originally written, it won''t work! Once you changed
    folders, type the following:


    ```

    ffmpeg -i frame%03d.jpg -r 10 animation.h264

    ```


    This uses a program called ffmpeg to take the still images in the folder and convert
    them into a video called animation.h264. (If ffmpeg is not available, you can
    install it with sudo apt-get install ffmpeg) Depending on how many files you have
    still, this process can take a few minutes; you''ll know it''s finished when you
    see the Terminal prompt reappear.


    To play the video, find the file animation.h264 in your animation folder and double-click
    it to open it. Alternatively, you can play it back from the Terminal by typing
    the following:


    ```

    omplayer animation.h264

    ```


    Once the video has loaded, you''ll see your stop-motion animation come to life.
    Congratulations! you''ve turned your Raspberry Pi into a powerful animation studio!'
