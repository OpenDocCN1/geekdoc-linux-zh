  md: 'Start by checking that your LED works. Turn your Raspberry Pi so the GPIO header
    is in two vertical strips to the right-hand side. Connect one of your 330 Ω resistor
    to the first 3.3 V pin (labelled 3V3 in **Figure 6-1**) using a female-to-female
    jumper wire, then connect the other end to the long leg – positive, or anode –
    of your LED with another female-to-female jumper wire. Take a last female-to-female
    jumper wire, and connect the short leg – negative, or cathode – of your LED to
    the first ground pin (labelled GND in **Figure 6-1**).


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_127_0.png)


    +   ▲ **Figure 6-1**: Wire your LED to these pins – don’t forget the resistor!


    As long as your Raspberry Pi is on, the LED should light up. If it doesn’t, double-check
    your circuit: make sure you haven''t used too high resistor value, that all the
    wires are properly connected, and that you''ve definitely picked the right GPIO
    pins to match the diagram. Also check the legs of the LED, as will only work one
    way around: with the longer leg connected to the positive side of the circuit
    and the shorter leg to the negative.\ Once your LED is working, it is times to
    program it. Connect the jumper wire from the 3.3 V pin (labelled 3V3 in **Figure
    6-2**) and connect it to the GPIO 25 pin (labelled GP25 in **Figure 6-2**). The
    LED will switch off, but don''t worry – that''s normal.'
  merge: -1
