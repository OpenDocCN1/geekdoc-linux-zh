    # Joystick control in Python


    Start a new program in Thonny and save it as Sense HAT Joystick. Begin with the
    usual lines that you set up Sense HAT and clear the LED matrix:


    ```

    from sense_hat import SenseHat

    sense = SenseHat()

    sense.clear()

    ```


    Next, set up an infinite loop:


    ```

    while True:

    ```


    Then tell Python to listen for inputs from the Sense HAT joystick with the following
    line, which Thonny will automatically indent for:


    ```

    for event in sense.stick.get_events():

    ```


    Finally, add the following line – which, again Thonny will indent for you – to
    do something when a joystick press is detected:


    ```

    print(event.direction, event.action)

    ```


    Click Run, and try pushing the joystick in various directions. You''ll see the
    direction you''ve chosen printed to the Python shell area: up, down, left, right,
    and for when you''ve pushed the joystick down like a push-button switch.


    You''ll also be given two events each time you push the joystick once: one event,
    pressed, for when you first push a direction; the other event, released, for when
    the joystick returns to centre. You can use this in your programs: think of a
    character in a game, which could be made to start moving when the joystick is
    pressed in a direction then stop as it''s released.'
