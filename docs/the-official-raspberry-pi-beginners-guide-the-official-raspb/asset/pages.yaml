  md: 'Starting using Chromium by maximising its window so it takes up more of the
    screen; find the three icons at the top-right of the Chromium window titlebar
    (N) and click on the middle, up-arrow icon (P). This is the maximise button, and
    will make a window fill the screen. To the left of maximise is minimise (O), which
    will hide a window until you click on it in the taskbar at the top of the screen.
    The cross to the right of maximise is close (Q), and does exactly what you''d
    expect: closes the window.


    # CLOSE AND SAVE


    Closing a window before you''ve saved any work you''ve done is a bad idea, while
    many programs will warn you to save when you click the close button, others won''t.


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_42_0.png)


    Click in the address bar at the top of the Chromium window – the big white bar
    with a magnifying glass on the left-hand side – and type raspberrypi.pi, then
    press the ENTER key on your keyboard. The Raspberry Pi website will load (Figure
    3-13). You can also type searches into the address bar: by searching for ''Raspberry
    Pi'', ''Raspberry Pi OS'', or ''Educational Computing''.


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_42_1.png)


    Figure 3-13: Loading the Raspberry Pi website in Chromium


    The first time you load Chromium, it may bring up several tabs along the top of
    the window. To switch to a different tab, click on it; to close a tab without
    closing Chromium itself, click the cross on the right-hand edge of the tab you
    want to close. To open a new tab, which is a handy way of having multiple websites
    open without having to juggle multiple windows, either click on the tab button
    to the right of the last tab in the list, or hold down the CTRL key on the keyboard
    and press the T key before letting go of CTRL. When you''re finished with Chromium,
    click the close button at the top-right of the window.'
