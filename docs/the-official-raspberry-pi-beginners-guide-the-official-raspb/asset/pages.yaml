  md: '# Bookshelf


    Raspberry Menu > Help > Bookshelf

    Bookshelf is an application included with the Raspberry Pi OS which helps you
    to browse, download, and read digital versions of Raspberry Pi Press publications
    – including Raspberry Pi Beginner''s Guide. Simply load it by clicking on the
    raspberry menu icon, Help, and clicking Bookshelf; then browse from a range of
    magazines and books, all free to download and read at your leisure.


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_228_0.png)


    # The Raspberry Pi Blog


