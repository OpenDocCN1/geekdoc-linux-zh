  md: '# Connecting a display


    Take the micro-HDMI cable and connect the smaller end to the micro-HDMI port closest
    to the USB Type-C port on your Raspberry Pi, and the other end to your display.
    If your display has more than one HDMI port, look for a port number next to the
    connector itself, you''ll need to switch the TV to this input to see Raspberry
    Pi''s display. If you can''t see a port number, don''t worry: you can simply switch
    through each input in turn until you find Raspberry Pi.


    ![](img/0aff4cdab15427839fb48fd7c6f677d3_27_0.png)


    > TV CONNECTION

    If your TV or monitor doesn''t have an HDMI connector, that doesn''t mean you
    can''t use Raspberry Pi. Adapter cables, available from any electronics stockist,
    will allow you to convert the micro-HDMI port to DVI-D, DisplayPort, or VGA for
    use with older computer monitors; these are simply connected to Raspberry Pi''s
    micro-HDMI port, then use a suitable cable to connect the adapter to the monitor.
    If your TV has only a composite video or SCART input, you can purchase 3.5 mm
    tip-ring-ring-sleeve (TRRS) adapter cables and composite-to-SCART adapters which
    connect to the 3.5 mm AV jack.'
  merge: -1
