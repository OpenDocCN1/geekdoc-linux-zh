    # 10.4 UNIX SVR4 调度


    UNIX SVR4 中的调度算法是对早期 UNIX 系统中调度算法（在第 9.3 节中描述）的彻底改写。新算法旨在赋予实时进程最高优先级，内核态进程次高优先级，以及用户态进程（称为时间分共享进程）最低优先级。


    SVR4 实现的主要修改包括：


    - 1. 增加了抢占式静态优先级调度器，并引入了一组分为三个优先级类的 160 个优先级级别。

    - 2. 插入了抢占点。由于基本内核是非抢占的，它只能被拆分为必须无中断运行的进程。在进程之间，安全区域可以安全地中断处理并调度一个新进程。在识别出内核可以抢占的地方，安全区域被定义为所有内核数据结构要么已更新且已通过信号量被锁定的代码区域。


    图 10.10 展示了 SVR4 中定义的 160 个优先级级别。每个进程被定义为属于三个优先级类之一，并在该类内被分配一个优先级级别。这些类分别是：


    - **实时 (159-100)：** 该优先级的进程保证在任何内核进程或时间分共享进程之前运行。此外，实时进程可以使用抢占点来抢占内核进程和用户进程。

    - **内核 (99-60)：** 这些级别的进程保证在任何时间分共享进程之前运行，但必须必须让位给实时进程。

    - **时间分共享 (59-0)：** 最优先级的进程，用于除实时应用以外的用户应用程序。


    图 10.11 指明了 SVR4 中如何实现调度。每个优先级级别都关联一个调度队列，给定优先级层级的进程以轮转方式执行。位图向量 `dqmap` 为每个优先级级别包含一个位；如果某个优先级的队列是非空的，则该位设置为
    1。每当进程由于阻塞、时间片过期或抢占而离开运行（Running）状态时，调度器会检查 `dqmap` 并从最高优先级的非空队列获取进程。此外，每当到达定义的抢占点时，内核会检查名为
    `kprunrun` 的标志。如果这表示至少有一个实时进程处于就绪（Ready）状态，且当前进程的优先级低于最高优先级的就绪进程，内核将抢占当前进程。


    在时间分共享类中，进程的优先级是可变的。调度器每当进程用完一个时间量子时就会降低其优先级，如果它在事件或资源上阻塞，则会提高其优先级。分配给时间分共享进程的时间量子取决于其优先级，从优先级
    0 的 100 ms 到优先级 59 的 10 ms 不等。每个实时进程都有固定的优先级和固定的时间量子。


