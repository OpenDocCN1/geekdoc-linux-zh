    # TRADITIONAL UNIX SYSTEMS


    ## History


    The history of UNIX is an oft-told tale and will not be repeated in detail here.
    Instead, a brief summary highlights are depicted in Figure 2.14, which is based
    on a figure in [SALI94].


    UNIX was initially developed at Bell Labs and became operational on a PDP-7 in
    1970. Some of the people involved at Bell Labs had participated in the time-sharing
    working done at MIT''s Project MAC. This project led to the development of CTS
    and Multics. Although it is common to say that UNIX is a scaled-down version of
    Multics, the developers of UNIX actually claimed to be influenced by CTS [RITC78].
    Nevertheless, UNIX incorporated many ideas from Multics.


    Bell Labs produced a series of versions of UNIX. The first notable version was
    UNIX from the PDP-7 to PDP-11. This was the first that UNIX would be an operating
    system for all computers. The next important was the rewriting of UNIX in the
    programming language C. This was an unheard-of-strategy at the time. It was generally
    felt that something as complex as an operating system, which must deal with time-critical
    events, had to be written in assembly language. The C implementation demonstrated
    the advantages of using a high-level language for most of the code. Early versions
    of UNIX were written in assembly at Bell Labs. In 1974, the UNIX system was described
    in a technical journal for the first time [RITC74]. This sparked interest in the
    system. Licenses for UNIX were provided to commercial institutions as well as
    universities. The first widely available outside Bell Labs was Version 6, in 1976.
    The follow-on Release 7, is the ancestor of most modern UNIX systems. The most
    of non-AT&T systems to be developed was done at the University of California at
    Berkeley, called UNIX BSD, running first on PDP and VA machines. AT&T continued
    to define and refine the system. By 1982, Bell Labs had combined several AT&T
    variants of UNIX into a single system, marketed as UNIX III. A number of features
    were later added to the operating system to produce UNIX V.


    ## Description


    Figure 2.15 provides a general description of the UNIX architecture. The underlying
    hardware is surrounded by the operating-software. The operating system is often
    called the kernel, primarily to emphasize its isolation from the user and applications.
    This portion of UNIX is what we will be concerned with in our use of UNIX as an
    example in this book. However UNIX equipped with a number of user services and
    interfaces that are considered part of the system. These are grouped into the
    shell, other interface software, and the components of the C compiler (compiler,
    assembler, loader). The layer outside of this consists of user applications and
    the kernel is the interface to C.


    A closer look at the kernel is provided in Figure 2.16. User programs can invoke
    operating system services directly or through library functions. The system interface
    is the boundary between the user and higher-level software to gain access to specific
    kernel functions. At the other end the operating system maintains primitive routines
    that interact directly with the hardware. Between these two interfaces, the kernel
    is divided into two parts, one concerned with process control and the other concerned
    with memory management and I/O. The process control subsystem is responsible for
    memory management, the scheduling and dispatching of processes, and the file system
    exchanges data between memory and external devices as either as a


