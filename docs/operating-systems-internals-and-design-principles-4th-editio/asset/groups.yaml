    ## 13.7 BEOWULF 与 LINUX 集群


    1994 年，Beowulf 项目在 NASA 高性能计算与通信（HPCC）项目的赞助下启动。其目标是研究利用集群化 PC 的潜力，以最低的成本执行超越当代工作站能力的重要计算。Beowulf
    方法已得到广泛应用，并且是目前可用最重要的集群技术。


    ## Beowulf 特性


    Beowulf 的主要特性包括 [RIDG97]：


    - 大众市场商品化组件

    - 专用处理器（而不是从空闲工作站中获取周期周期）

    - 专用的私有网络（局域网、广域网或互联网的组合）

    - 无需定制组件

    - 易于从多个供应商处复制

    - 可扩展的 I/O

    - 免费提供的软件基础

    - 使用经过极少修改的免费分发工具

    - 将改进回馈给社区


    Beowulf 软件元素已在许多不同的平台上实现，作为基础最明显的选择是 Linux，而大多数 Beowulf 实现都使用 Linux 工作站和/或 PC
    集群。图 13.19 展示了一个典型的配置。该集群由若干个运行 Linux 操作系统的工作站（执行硬件平台）组成。每个工作站的次级存储可能用于分布式访问（用于分布式文件共享、分布式虚拟内存或其他用途）。集群节点（Linux
    节点）通过商品化网络方法（通常是以太网）互连。以太网支持可以是单个以太网交换机或一组相互连接的交换机。使用了标准数据速率（10 Mbps、100 Mbps、1
    Gbps）的商品化以太网产品。


    ## Beowulf 软件


    Beowulf 软件是是可用免税发行版的扩展。开源 Beowulf 软件的主要来源是 www.beowulf.org，但许多组织也提供免费的 Beowulf
    工具和实用程序。


    Beowulf 集群中的每个节点都运行自己的 Linux 内核副本，并作为一个独立的 Linux 系统运行。为了支持 Beowulf 集群概念，对 Linux
    内核进行了扩展，允许单个节点参与全局命名空间。Beowulf 软件的一些示例：


    - *Beowulf 分布式进程空间 (BPROC)*：此包允许 ID 空间跨越集群环境中的多个节点，并提供在其他节点上启动进程的机制。该包的目标是为 Beowulf
    集群上的单系统映像提供关键元素。BPROC 提供了一种机制，可以在无需登录另一个节点的情况下在远程节点上启动进程，并使远程进程在集群前端的进程表中可见。


    - *Beowulf 以太网通道绑定 (Ethernet Channel Bonding)*：这是一种将多个低成本网络连接成具有更高带宽的单一逻辑网络的机制。与单个网络接口相比，唯一的额外开销是将数据包分配到可用设备传输队列上的简单计算任务。这种方法允许连接到
    Linux 工作站的多个以太网之间进行负载均衡。


    - ***Pymsync**：这是一个为 Beowulf 集群中的进程提供同步机制和共享数据对象的编程环境。


    - ***EnFusion**：EnFusion 由一组参数化计算工具组成，如第 13.4 节所述。参数化计算涉及将程序作为大量作业执行，每个作业具有不同的参数或启动条件。EnFusion
    在单个根节点机器上模拟一组机器人用户，每个用户将登录形成集群的许多客户端节点机器之一。每个作业都配置为带有唯一的、编程的场景运行，并带有适当的启动条件 [KAPP00]。


