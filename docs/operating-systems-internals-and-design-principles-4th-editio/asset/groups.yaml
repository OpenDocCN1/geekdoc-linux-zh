    | User-Level Context | Description |

    | :--- | :--- |

    | Process Text | Executable machine instructions of the program |

    | Process Data | Data accessible by the program of this process |

    | User Stack | Contains the arguments, local variables, and pointers for functions
    executing in user mode |

    | Shared Memory | Memory shared with other processes, used for interprocess communication
    |


    | Register Context | Description |

    | :--- | :--- |

    | Program Counter | Address of next instruction to be executed; may be in kernel
    or user memory space of this process |

    | Processor Status Register | Contains the hardware status at the time of preemption;
    contents and format are hardware dependent |

    | Stack Pointer | Points to the top of the kernel or user stack, depending on
    the mode of operation at the time or preemption |

    | General-Purpose Registers | Hardware dependent |


    | System-Level Context | Description |

    | :--- | :--- |

    | Process Table Entry | Defines state of a process; this information is always
    accessible to the operating system |

    | U (user) Area | Process control information that needs to be accessed only in
    the context of the process |

    | Per Process Region Table | Defines the mapping from virtual to physical addresses;
    also contains a permission field that indicates the type of access allowed the
    process: read-only, read-write, or read-execute |

    | Kernel Stack | Contains the stack frame of kernel procedures as the process
    executes in kernel mode |


    ## Table 3.11 UNIX Process Table Entry


    | Process Status | Description. |

    | :--- | :--- |

    | Pointers | To U area and process memory area (text, data, stack). |

    | Process Size | Enables the operating system to know how much space to allocate
    the process. |

    | User Identifiers | The **real user ID** identifies the user who is responsible
