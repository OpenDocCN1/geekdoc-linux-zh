    某些程序具有逻辑并行性，可以利用这种特性来简化和结构化代码，但并不需要硬件并行。例如，一个使用多个窗口的应用程序（一次只有一个窗口激活状态）可以很好地实现为
    LWP（轻量级进程）的一组 ULT（用户级线程）。将此类应用程序限制在 ULT 的优势在于效率。ULT 的创建、销毁、阻塞等操作不需要涉及内核。如果内核感知到
    ULT，内核就必须为每个 ULT 分配数据结构并进行线程切换。正如我们所见（表 4.1所示），内核级线程切换的开销比用户级线程切换要大。


    如果应用程序调用了会阻塞的线程（例如执行 I/O 操作），则需要多个 LWP 来支持等量或更多数量的 ULT。应用程序和线程库都没有提供允许同一进程内其他线程执行的竞争性轮廓。相反，当进程中的一个线程被阻塞时，该进程中的其他线程可以在剩余的
    LWP 上运行。


    将 ULT 映射到 LWP 对于某些应用程序是有效的。例如，并行数组计算可以将其数组的行分配给不同的线程。如果每个 LWP 恰好有一个 ULT，那么计算的进行不需要线程切换。


    将永久绑定到 LWP 的线程与无界线程（多个线程共享一个 LWP）的混合模式适用于某些应用程序。例如，实时应用程序可能拥有某些具有优先级调度和实时调的线程，而其他线程则执行后台功能，并可以共享一个或较小规模的
    LWP 池。


    ## 进程结构 (Process Structure)


    图 4.16 总体比较了传统 UNIX 系统与 Solaris 的结构。在 UNIX 的实现中，进程结构包括：ID；用户 ID；调度表（内核用它来决定在向进程发送信号时该做什么）；文件描述符（描述该进程所用文件的状态）；内存映射（定义该进程的空间）；以及处理器结构（包括内核栈）。Solaris
    保留了这种基本结构，但将处理器结构替换为结构列表，其中包含每个 LWP 对应一个数据块的结构体。


    LWP 数据结构包含以下元素：


    - LWP 标识符

    - LWP 的优先级，以及支持它的内核线程的优先级

    - 信号掩码，用于告知内核将接受哪些信号

    - 用户级寄存器的保存值（当 LWP 不在运行时）

    - 该 LWP 的内核栈，包括每个层级的系统调用参数、结果和错误代码

    - 资源使用和分析数据

    - 指向相应内核线程的指针

    - 指向进程结构的指针


    ## 线程执行 (Thread Execution)


    图 4.17 显示了 ULT 和 LWP 执行状态的简化视图。用户级线程的执行由线程库管理。让我们先考虑无界线程，即共享若干个 LWP 的线程。无界线程可以处于四种状态之一：可运行、活跃、睡眠或停止。处于活跃状态的
    ULT 当前被分配给一个 LWP 并在底层内核执行时随之执行。若干事件可能导致 ULT 离开活跃状态。让我们考虑一个活跃的 ULT T1。可能会发生以下事件：


    - 同步：T1 调用第 5 章引入的并发原语之一，以与其他线程协调活动并强制执行互斥。T1 被置于睡眠状态。当同步条件满足时，T1 移动到可运行状态。

    - 挂起：任何线程（包括 T1）都可能导致 T1 被挂起并置于停止状态。T1 一直保持该状态，直到另一个线程发出继续请求，将其移动到可运行状态。

    - 抢占：任何活跃线程（T1 或其他）导致另一个更高优先级的线程（T2）变为可运行。如果 T1 是最低优先级的活跃线程，它会被抢占并移动到可运行状态，而 T2
    被分配给空闲的 LWP。

    - 礼让：如果 T1 执行了 `thread_yield()` 库命令，库中的线程调度器将查找是否有相同优先级的线程（T2）。如果没有，T1 被置于可运行状态，T2
    被分配给空闲的 LWP。T1 继续运行。


    在所有情况下，当 T1 离开活跃状态时，线程库会选择另一个无界线程并在新释放的 LWP 上运行它。

    图 4.17 还显示了 LWP 的状态图。我们可以将此状态图视为对 ULT 活跃状态的详细描述，因为无界线程只有在活跃（Active）状态时才会被分配 LWP。ULT
    状态图具有相当的自显懂性。只有当 LWP 处于运行（Running）状态时，活跃线程才正在执行。当活跃线程执行阻塞系统调用时，LWP 进入阻塞（blocked）状态。然而，ULT
    仍然绑定到该 LWP，且对线程库而言，该 ULT 保持活跃状态。


    如果是绑定（bound），ULT 和 LWP 之间的关系略有不同。例如，如果绑定线程移动到睡眠（Sleeping）状态等待同步事件，它的 LWP 也必须停止运行。这通过让
    LWP 在内核级同步上阻塞来实现。


    ## 中断即线程 (Interrupts as Threads)


    操作系统包含两种基本的异步形式：进程和线程。或者说进程相互协作，并通过互斥原语（一次只有一个进程可以执行特定代码或访问特定数据）来管理共享结构的使用并同步它们的执行。中断通过阻止发生一段时间来被中断。Solaris
    将这些概念统一到一个名称：线程，以及调度和执行线程的机制。中断转换为线程是为了减少开销。中断处理程序通常通过执行来管理共享数据，因此访问此类数据的内核程序必须阻塞，尽管大多数中断不会影响该数据。通常，这种方法是让例程提高中断优先级以阻塞中断，并在完成后降低优先级。这些操作需要时间。这个问题在多处理器系统中被放大。内核必须保护更多对象，并可能需要阻塞所有中断。


    Solaris 的解决方案如下：


    1. Solaris 采用一组内核线程来处理中断。与任何内核线程一样，中断线程有自己的标识符、优先级、上下文和栈。

    2. 内核使用第 5 章讨论的互斥原语访问数据结构并在线程间同步。即 LWP 中断使用了线程同步技术。

    3. 中断线程分配的优先级高于所有其他类型的内核线程。


    当中断发生时，它被传递给特定的处理器，在该处理器上执行的线程被固定（pinned）。固定线程无法移动到其他处理器，其上下文被保留；只需挂起直到中断处理完毕。处理器随后执行中断线程。有一个可用的中断线程池，因此不需要创建新线程。中断随后执行以处理中断。


    对 Solaris 中断线程的经验表明，这种方法的性能优于传统的中断处理策略 [KLEI95]。


