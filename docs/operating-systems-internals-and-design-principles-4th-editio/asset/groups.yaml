    ![](img/e8a705e38cf3a8576620995ac6bb6f53_61_0.png)


    ## 13.6 集群 (CLUSTER)


    Sun Cluster 是一个基于基础 Solaris UNIX 系统扩展集构建的分布式操作系统。它为集群提供了单系统映像：即对用户和应用程序而言，集群就像是一台运行
    Solaris 操作系统的单台计算机。


    图 13.17 显示了 Sun Cluster 的整体架构。主要组件包括：


    - 对象与通信支持

    - 进程管理

    - 网络

    - 全局分布式文件系统


    ## 对象与通信支持


    Sun Cluster 的实现是面向对象的。使用 CORBA 对象模型（见附录 B）来定义对象和 Sun Cluster 中实现的远程调用（RPC）机制。CORBA
    接口定义语言（IDL）用于指定不同节点组件之间的接口。面向对象的语言 C++ 的元素。使用统一的对象模型和 IDL 为节点间和进程间通信提供了机制。所有这些内容都构建在
    Solaris 内核之上，几乎对内核没有任何修改。


    ## 进程管理


    进程管理扩展了进程操作，使得进程的位置对用户是透明的。Sun Cluster 维护进程的全局视图，使得集群中的每个进程都有一个唯一标识符，并且每个节点都可以了解每个进程的位置和状态。进程迁移（第
    14 节描述）是：进程可以在生命周期内从一个节点移动到另一个节点，以实现负载均衡或故障转移。然而，单个进程的线程必须位于同一个节点。


    ## 网络


    Sun Cluster 的设计者考虑了处理网络流量的三种方法：


    1. 在单个节点上执行所有网络协议处理。特别是对于基于 TCP/IP 的接入，入站和出站流量将通过网络连接节点：入站流量将分析 TCP 和 IP 头部以及封装的数据并发送到相应的节点；出站
    TCP 将将来自其他节点的数据封装在 TCP/IP 头部中。这种方法对于大量节点来说不可扩展，因此被否决了。

    2. 为每个节点分配唯一的 IP 地址，并在集群上运行网络。这种方法的困难之处在于集群配置不再对外世界透明。另一个复杂性是应用程序移动到另一个节点时故障转移的困难。

    3. 使用数据包过滤器将数据包路由到相应节点并在该节点上进行处理。外部，集群显示为具有单一 IP 地址的单一服务器。这是 Sun Cluster 采用的方法。


    Sun Cluster 网络系统具有三个关键元素：


    - 入站数据包首先在连接网络适配器的节点上接收；接收节点过滤数据包并通过集群将其传递到目标节点。

    - 所有出站数据包通过集群互连路由到具有外部连接的节点（或备节点）。出站包的所有协议处理由起始节点完成。

    - 维护网络配置数据库以跟踪网络流量。


    ## 全局文件系统


    Sun Cluster 最重要的元素是全局文件系统，它与 Solaris 文件管理形成对比。两者都基于 inode 概念构建。


    在 Solaris 中，虚拟节点（vnode）用于为所有类型的文件系统提供强大的通用接口。inode 用于将内存页映射到进程的地址空间并允许访问文件系统。虽然
    inode 用于将进程映射到 UNIX 文件，但 vnode 可以将对象映射到任何文件系统类型。这样，系统调用不需要理解被操作的实际对象，只需要知道通过 vnode
    接口使用相应的类型。vnode 接口接受通用文件系统操作命令（如读和写），并将其转换为适用于文件系统的操作。由于 vnode 用于描述单个文件系统对象，虚拟文件系统架构被用于描述整个文件系统。


    在 Sun Cluster 中，全局文件系统为分布在集群中的文件提供了统一接口。进程可以在集群的任何地方打开文件，构建在现有 Solaris 之上的所有节点使用
    vnode 接口。vfs/vnode 操作由代理层转换为对象调用（见图 13.18b）。调用的对象可能位于系统的任何地方。vnode 在底层文件系统上执行本地
    vfs 操作。内核和现有文件系统都不需要修改即可支持这种全局文件环境。


    为了减少远程对象调用的次数，使用了缓存。Sun Cluster 支持文件内容、目录信息和文件属性的缓存。


