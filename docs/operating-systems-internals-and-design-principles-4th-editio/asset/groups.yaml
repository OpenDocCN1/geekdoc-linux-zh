    # 内核内存分配器


    内核在执行过程中会生成和销毁小型表和缓冲区，每个都需要动态内存分配。[VAHA96] 列出了以下示例：


    -   路径名翻译程序可能会分配一个缓冲区来从用户空间拷贝路径名。

    -   `allocb()` 程分配任意大小的 STREAMS。

    -   许多 UNIX 实现会分配僵尸结构（zombie structures），以便在进程死亡后保留退出状态和资源信息。

    -   在 SVR4 和 Solaris 中，内核会在需要时动态分配许多对象（如 proc 结构、vnodes 和文件描述符）。


    这些内存块大部分远小于典型的内核页大小，因此分页机制对于内核内存分配来说效率很低。对于 SVR4，使用了第 7.2 节描述的伙伴系统（buddy system）的变体。


    在伙伴系统中，分配和释放内存块的成本远低于最佳最优先（best-first）或首次适应（first-fit）策略 [KNUT97]。然而，在内核内存管理中，分配和释放操作必须尽可能快。伙伴系统的缺点是需要进行碎片化和拷贝。


    Barkley 和 AT&T 提出了一种延迟伙伴系统版本 [BARK89]，这是 SVR4 采用的技巧。作者们观察到 UNIX 在内核内存需求上表现出稳定行为；即特定大小内存块的数量随时间变化。如果一个大小为
    $2^i$ 的块被释放并立即与一个大小为 $2^i$ 的块合并，内核下次可能会请求一个大小为 $2^i$ 的块，这可能需要再次分裂该较大的块。为了避免这种不合并和分裂，伙伴系统会将合并推迟到看起来需要时，然后尽可能合并多个块。

    延迟伙伴系统使用以下参数：


    $N_i = \text{当前大小为 } 2^i \text{ 的块数量}$


    $A_i = \text{当前已分配（占用）的大小为 } 2^i \text{ 的块数量}$


    $G_i = \text{当前全局空闲的大小为 } 2^i \text{ 的块数量；这些是符合合并条件的块；如果此类块的伙伴变为可用，则这两个块将合并为一个大小为
    $2^{+1}$ 的全局空闲块。标准伙伴系统中所有空闲块（洞）都可以被视为全局空闲。


    $L_l = \text{当前局部空闲的大小为 } 2^l \text{ 的块数量；这些是不符合合并条件的块。即使此类块的伙伴变为可用，这两个块也不会合并。保留局部空闲块是为了预留未来对该大小块的需求。


    存在以下关系：


    $N_i = A_i + G_i + L_i$


    通常而言，延迟伙伴系统试图维护一个局部空闲块池，并且仅仅在局部空闲块数量超过阈值时才调用合并。如果局部空闲块太多，则可能导致下一层缺乏足够的空闲块来满足需求。大多数时候，当内存块被释放时，不会发生合并，从而最小程度地减少了账目记录操作成本。当需要分配内存块时，不区分局部空闲和全局空闲块；同样，这最小化了账目记录。


    用于合并的标准是：给定大小的局部空闲块数量不超过该大小的分配块数量（即我们必须满足 $L_i \leq A_i$）。这是限制局部空闲块增长的合理准则，[BARK89]
    中的实验证实该方案可以显著节省开销。


    为了实现该方案，作者定义了如下延迟变量：


    $D_i = A_i - L_i = N_i - 2L_i - G_i$


    图 8.24 显示了算法。


