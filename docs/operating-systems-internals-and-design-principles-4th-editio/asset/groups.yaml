    ## 8.4 LINUX MEMORY MANAGEMENT


    Linux shares many of the characteristics of the memory management schemes of other
    UNIX implementations but has its unique features. Overall, the Linux memory-management
    scheme is quite complex [DUBE98]. Here, we give a brief overview.


    ## Linux Virtual Memory


    ### Virtual Memory Addressing


    Linux use of a three-level page table structure, consisting of the following types
    of tables (each individual table is the size of one page):


    - **Page directory**: An active process has a single page directory that is the
    size of one page. Each entry in the page directory points to one page of the page
    middle. The page directory must be in main memory for an active process.

    - **Page middle**: The page middle directory may span multiple pages. Each entry
    in the page directory points to one page in the table.

    - **Page table**: The page table may also span multiple pages. Each table entry
    refers to one virtual page of the process.


    To use this three-level page table structure, a virtual address in Linux is viewed
    as consisting of four fields. The leftmost (most significant) field is used as
    an index into the page directory. The next field serves as an index into the page
    middle directory. The third field serves as an index into the page table. The
    fourth field gives the offset within the selected page of memory.


    The Linux page table structure is platform independent and was designed to accommodate
    the 64-bit Alpha processor, which provides hardware support for three levels of
    paging. With 64-bit addresses, the use of two levels of pages on the Alpha would
    result in very large page tables and directories. The 32-bit Pentium/x86 architecture
    has a two-level hardware paging mechanism. The Linux software accommodates the
    two-level scheme by defining the size of the page middle directory to one.


    ## Page Allocation


    To enhance the efficiency of reading and writing out pages from main memory, Linux
    defines a mechanism for dealing with contiguous blocks of pages mapped into contiguous
    blocks of frames. For this purpose, the buddy system is used. The kernel maintains
    a list of contiguous page frames of fixed size: a group consists of 1, 2, 4, 8,
    16, or 32 pages. As pages are allocated and deallocated in main memory, the available
    pages are split and merged using the buddy algorithm.


    ## Page Replacement Algorithm


    The Linux page replacement algorithm is based on the clock algorithm described
    in Section 8.2 (see Figure 8.16). In the simple clock algorithm, the use bit and
    modify bit are associated with each page in main memory. In the Linux, the use
    bit is replaced with an 8-bit age variable. Each time a page is accessed, the
    age variable is incremented. In the background, Linux periodically sweeps through
    the global page pool and decrements the age variable for each page it rotates
    through all the pages in main memory. A page with an age of 0 is an "old" page
    that has not been referenced in some time and is the best candidate for replacement.
    The larger the value of age, the more frequently a page has been used in recent
    times and the less eligible it is for replacement. Thus, the Linux algorithm is
    a form of least used policy.


    ## Kernel Memory Allocation


    The foundation of kernel memory allocation in Linux is the page allocation mechanism
    used for user virtual memory management. As in the virtual memory scheme, a buddy
    algorithm is used so that memory for the kernel can be allocated and deallocated
    in units of one or more pages. Because the minimum amount of memory that can be
    allocated in this fashion is one page, the page allocator alone would be inefficient
    because the kernel requires small short-term memory chunks in odd sizes. To accommodate
    these small chunks, Linux uses a scheme known as slab allocation [BONW94] within
    an allocated page. On a Pentium/x86 machine, the page size is 4 kbytes, and chunks
    within a page may be allocated of sizes 32, 64, 128, 252, 508, 2040, and 4080
    bytes.


    The slab allocator is relatively complex and is not examined in detail here; a
    good description can be found in [VAHA96]. In essence, Linux maintains a set of
    linked lists, one for each size of chunk. Chunks may be split and aggregated in
    a manner similar to the buddy algorithm, and moved between lists accordingly.


    ## 9.3 TRADITIONAL UNIX SCHEDULING


    In this section we examine traditional UNIX scheduling, which is used in SVR3
    and 4.3 BSD Unix. These systems are primarily targeted at the time-sharing interactive
    environment. The scheduling algorithm is designed to provide good response time
    for interactive users while ensuring that low-priority jobs do not starve. This
    algorithm has been replaced in modern UNIX systems, but it is worthwhile to examine
    the approach because it is representative of practical time-sharing scheduling
    algorithms. The scheduling scheme for SVR4 includes an accommodation for real-time
    requirements, and so discussion is deferred to Chapter 10.


    The traditional UNIX scheduler employs multilevel feedback using round robin within
    each of the priority queues. The system makes use of 1-second preemption. That
    is, if a running process does not complete within 1 second, it is preempted. Priority
    is based on process type and execution history. The following formulas apply:


    ```

    P(i) = Base_j + \frac{CPU(i-1)}{2} + nice_j

    ```


    where

    CPU_j(i) = Measure of process utilization by process j through interval i

    P_j(i) = Priority of process j at beginning of interval i; lower values equal
    higher priorities

    Base_j = Base priority of process j

    nice_j = user-controllable adjustment factor


    The priority of each process is recomputed once per second, at which time a new
    scheduling decision is made. The base priority and CPU and nice components are
    restricted to fixed bands of priority levels to prevent a process from migrating
    out of its assigned band (by the base priority level). These bands are used to
    optimize access to block devices (e.g., disk) and to allow the operating system
    to respond quickly to system calls. In decreasing order of priority, the bands
    are:


    - Swapper

    - Block I/O device control

    - File manipulation

    - Character I/O device control

    - User processes


    This hierarchy provides the most efficient use of the I/O devices. Within the
    user process band, the execution of history time penalizes process-bound processes
    at the expense of I/O-bound processes. Again, this should improve efficiency.
    Coupled with the round robin preempt scheme, the scheduling strategy is well equipped
    to satisfy the requirements for general-purpose time sharing.


    An example of process scheduling is shown in Figure 9.17. Processes A, B, and
    C are created at the same time with base priorities of 60 (we will ignore the
    nice value). The clock interrupts the system 60 times per second and increments
    a counter for the running process. The example assumes that none of the process
    blocks themselves and that no other processes are ready to run. Compare this with
    Figure 9.16.


