    a branch can be executed to the appropriate user program to continue execution.
    If the value is nonzero, then this is the parent process, and the main line of
    execution can continue.


    ## Table 3.9 UNIX Process States


    | | Description |

    | :--- | :--- |

    | User Running | Executing in user mode. |

    | Kernel Running | Executing in kernel mode. |

    | Ready to Run, in Memory | Ready to run as soon as the kernel schedules it. |

    | Asleep in Memory | Unable to execute until an event occurs; process is in main
    memory (a blocked state). |

    | Ready to Run, Swapped | Process is ready to run, but the swapper must swap the
    process into main memory before the kernel can schedule it to execute. |

    | Sleeping, Swapped | The process is awaiting an event and has been swapped to
    secondary storage (a blocked state). |

    | Preempted | Process is returning from kernel to user mode, but the kernel preempts
    it and does a process switch to schedule another process. |

    | Created | Process is newly created and not yet ready to run. |

    | Zombie | Process no longer exists, but it leaves a record for its parent process
    to collect. |


