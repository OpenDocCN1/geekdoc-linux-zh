    # 11.8 UNIX SVR4 I/O


    在 UNIX 中，每个单独的 I/O 设备都与一个特殊文件关联。这些文件由文件系统管理，并以与用户文件相同的方式进行读写。这为用户和进程提供了一个整洁、统一的接口。要对设备进行读写，会对与设备相关的特殊文件发出读写请求。


    图 11.14 展示了 I/O 设施逻辑结构。文件系统管理辅助存储设备上的文件。此外，它还充当了设备的接口，设备被处理为文件。


    UNIX 中有两种类型的 I/O：缓冲和非缓冲。缓冲 I/O 通过系统缓冲区传输，而非缓冲 I/O 通常涉及 DMA 设施，传输直接在模块和进程 I/O 区域之间进行。对于缓冲
    I/O，使用了两种缓冲区：系统缓冲区缓存和字符队列。


    # 缓冲区缓存


    UNIX 中的缓冲区缓存本质上是一个磁盘缓存。与磁盘的 I/O 操作通过缓冲区缓存进行处理。缓冲区缓存与进程空间之间的数据传输始终通过 DMA 完成。由于缓冲区缓存和进程
    I/O 区域都在主内存中，因此使用 DMA 设施执行内存内存拷贝。这不占用任何进程周期，但会消耗总线周期。为了管理缓存，维护了几个列表：


    - **空列表 (Free list)**：缓存中所有可用分配的槽（在 UNIX 中，一个槽称为缓冲区；每个槽持有一个磁盘扇区）。

    - **设备列表 (Device list)**：当前与每个磁盘关联的所有缓冲区列表。

    - **驱动程序 I/O 队列 (Driver I/O queue)**：在特定设备上实际队列或等待 I/O 的缓冲区列表。


    所有缓冲区都应该位于空列表或驱动程序 I/O 队列列表中。缓冲区一旦与设备关联，如果它在空列表中，将保持与该设备关联，直到它被重用并关联到另一个设备。这些列表以指针而非物理独立列表的形式维护。当引用特定设备上的哈希值时，操作系统首先检查该数据块是否在哈希缓存中。为了最小化搜索时间，设备被组织成哈希表，使用链链技术来防止附录
    8A 中讨论的溢出链表技术（图 8.2b）。图 11.15 描述缓冲区缓存的组织结构。有一个固定长度的哈希表，包含指向缓冲区缓存的指针。对设备的每次引用（设备#，块#）都会映射到哈希表中。


