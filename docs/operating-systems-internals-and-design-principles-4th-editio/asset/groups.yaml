    ## 13.7 BEOWULF AND LINUX CLUSTERS


    In 1994, the Beowulf project was initiated under the sponsorship of the NASA High
    Performance Computing and Communications (HPCC) project. Its goal was to investigate
    the potential of clustered PCs for performing important computations beyond the
    capabilities of contemporary workstations at minimum cost. The Beowulf approach
    is widely implemented and is the most important cluster technology available.


    ## Beowulf Features


    Key features of Beowulf can include [RIDG97]:


    - * Mass market commodity components

    - Dedicated processors (rather than scavenging cycles from idle workstations)

    - A dedicated, private network (LAN or WAN or internetted combination)

    - No custom components

    - Easy replication from multiple vendors

    - Scalable I/O

    - A freely available software base

    - Use of freely available distribution tools with minimal changes

    - Return of the improvements to the community


    Elements of Beowulf software have been implemented on a number of different platforms,
    the most obvious choice for base is Linux, and most Beowulf implementations use
    a cluster of Linux workstations and/or PCs. Figure 13.19 depicts a representative
    configuration. The cluster consists of a number of workstations, performing hardware
    platforms, all running the Linux operating system. Secondary storage at each workstation
    may be available for distributed access (for distributed file sharing, distributed
    virtual memory, or other uses). The cluster nodes (the Linux boxes) are interconnected
    by a commodity networking approach, typically Ethernet. The Ethernet support may
    be in the form of a single Ethernet switch or interconnected set of switches.
    Commodity Ethernet products at the standard data rates (10 Mbps, 100 Mbps, 1 Gbps)
    are used.


    ## Beowulf Software


    The Beowulf software environment is an add-on to commercially available, royalty-free
    Beowulf distributions. The principal source of open-source Beowulf software is
    the Beowulf site at www.beowulf.org, but numerous organizations also offer free
    Beowulf tools and utilities.


    Each node in the Beowulf cluster runs its own copy of the Linux kernel and function
    as an autonomous Linux system. To support the Beowulf cluster concept, extensions
    are made to the Linux kernel to allow the individual nodes to participate in a
    band of global namespaces. Some examples of Beowulf software:


    - * Beowulf distributed process space (BPROC): This package allows an ID space
    to span multiple nodes in a cluster environment and provides mechanisms for starting
    processes on other nodes. The goal of this package is to provide key elements
    needed for a single system image on Beowulf cluster. BPROC provides a mechanism
    to start processes on remote nodes without logging into another node and by making
    the remote processes visible in the process table of the cluster''s front end.


    - * Beowulf Ethernet Channel Bonding: This is a mechanism that joins multiple
    low-cost networks into a single logical network with higher bandwidth. The only
    additional over using a single network interface is the computationally simple
    task of distributing the packets over the available device transmit queues. This
    approach allows load balancing over multiple Ethernets connected to Linux workstations.


    - * **Pymsync**: This is a programming environment that provides synchronization
    mechanisms and shared data objects for processes in a Beowulf cluster.


    - * **EnFusion**: EnFusion consists of a set of tools for parametric computing,
    as described in Section 13.4. Parametric computing involves the execution of a
    program as a large number of jobs, each with different parameters or starting
    conditions. EnFusion emulates a set of robot users on a single root node machine,
    each of which will log into one of the many client node machines the form a cluster.
    Each job is set up to run with a unique, programmed scenario, with an appropriate
    set of starting conditions [KAPP00].

