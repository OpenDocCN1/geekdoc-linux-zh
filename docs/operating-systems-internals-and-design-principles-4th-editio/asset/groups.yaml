    # 10.4 UNIX SVR4 SCHEDULING


    The scheduling algorithm in UNIX SVR4 is a complete overhaul of the scheduling
    algorithm in earlier UNIX systems (described in Section 9.3). The new algorithm
    is designed to give highest preference to real-time processes, next-highest preference
    to kernel-mode processes, and lowest preference to user-mode processes, referred
    to as time-shared processes.


    The major modifications implemented in SVR4 are:


    - 1. The addition of a preemptive static priority scheduler and the introduction
    of a set of 160 priority levels divided into three priority classes.

    - 2. The insertion of preemption points. Because the basic kernel is non-preemptive,
    it can only be split into processes that must run without interruption. Between
    the processes, safe places can safely interrupt processing and schedule a new
    process. At identified where the kernel can, a safe place is defined as a region
    of code where all kernel data structures are either updated and locked via a semaphore.


    Figure 10.10 illustrates the 160 priority levels defined in SVR4. Each process
    is defined to belong to one of three priority classes and is assigned a priority
    level within that class. The classes are:


    - **Real-time (159-100):** Processes at this priority are guaranteed to be run
    before any kernel or time-sharing process. In addition, real-time processes can
    make use of preemption points to preempt kernel processes and user processes.

    - **Kernel (99-60):** Processes at these levels are guaranteed to be run before
    any time-sharing process but must defer to real-time processes.

    - **Time-shared (59-0):** The lowest-priority processes, intended for user applications
    other than real-time applications.


    Figure 10.11 indicates how scheduling is implemented in SVR4. A dispatch queue
    is associated with each priority level, and processes at a given priority level
    are executed in round-robin fashion. A bit-map vector, dqmap, contains one bit
    for each priority level; the bit is set for one priority with a nonempty queue.
    Whenever a process leaves the Running state, due to a block, time-slice expiration,
    or preemption, the dispatcher checks dqmap and reaches a process from the highest-priority
    nonempty queue. In addition, whenever a defined preemption point is reached, the
    kernel checks a flag called kprunrun. If this indicates that at least one real-time
    process is in the Ready state, the kernel preempts the current process if it is
    of lower priority than the highest-priority real-time ready process.


    Within the time-sharing class, the priority of a process is variable. The scheduler
    reduces the priority of a process each time it uses up time quantum, and raises
    its priority if it blocks on an event or resource. The time quantum allocated
    to a time-sharing process depends on its priority, ranging from 100 ms for priority
    0 to 10 ms for priority 59. Each real-time process has a fixed priority and a
    fixed time quantum.


