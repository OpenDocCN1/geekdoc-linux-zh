    # 传统 UNIX 系统


    ## 历史


    UNIX 的历史是一个广为人知的故事，此处不再详细复述。相反，图 2.14 展示了简要的摘要，该图基于 [SALI94]。


    UNIX 最初在贝尔实验室开发，并并于 1970 年在 PDP-7 上投入运行。贝尔实验室的一些人员曾参与了 MIT Project MAC 的分时系统工作。该项目导致了
    CTS 和 Multics 的开发。虽然通常说 UNIX 是 Multics 的精简版，但 UNIX 的开发者实际上声称受到 CTS 的影响 [RITC78]。尽管如此，UNIX
    吸收了 Multics 的许多思想。


    贝尔实验室了一系列 UNIX 版本。第一个著名的版本是从 PDP-7 到 PDP-11 的 UNIX。这是 UNIX 首次成为所有计算机的操作系统。下一个重点是用
    C 语言语言重写 UNIX。这在当时是一个前所未有的策略。当时通常认为，像操作系统这样必须处理时间关键事件的复杂系统必须用汇编语言编写。C 语言的证明了大部分代码使用高级语言的优势。早期的
    UNIX 版本在贝尔实验室是用汇编编写的。1974 年，UNIX 系统首次在技术期刊上被描述 [RITC74]。这引发了人们对该系统的兴趣。UNIX 许可被提供给商业机构以及大学。第一个在贝尔实验室外提供的版本是
    1976 年的第6 版本。随后的 Release 7 是大多数现代 UNIX 系统的祖先。大多数非 AT&T 系统是在加利福尼亚大学伯克利分校开发的，被称为
    UNIX BSD，最初运行在 PDP 和 VA 机器上。AT&T 继续定义和完善该系统。到 1982 年，贝尔实验室已将多个 AT&T UNIX 变体合并为一个系统，市场名为
    UNIX III。后来在操作系统中增加了许多功能，产生了 UNIX V。


    ## 描述


    图 2.15 提供了 UNIX 架构的总体描述。底层硬件被操作系统软件包围。操作系统通常被称为内核 (kernel)，主要是为了强调它与用户及应用程序的隔离。我们在书中将
    UNIX 作为示例时，关注的是 UNIX 的这部分。然而，UNIX 配备许多被视为系统一部分的用户服务和接口。这些被分为外壳 (shell)、其他接口软件以及
    C 编译器的组件（编译器、汇编器、加载器）。此之外的层由用户应用程序组成，而内核是 C 语言的接口。


    图 2.16 提供了对内核的更深入的观察。用户程序可以直接或通过库函数调用操作系统服务。系统接口是用户与高层软件之间的边界，用于访问特定的内核函数。在另一端，操作系统维护着直接与硬件交互的原始例程。在这两个接口之间，内核被分为两个部分：一个负责进程控制，另一个负责内存管理和
