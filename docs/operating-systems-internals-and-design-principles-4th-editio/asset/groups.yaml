    characters or in blocks. To achieve this, a variety of device drivers are used.
    For block-oriented transfers, a disk cache approach is used: a system buffer in
    main memory is interposed between the user address space and the external device.


    The description in this subsection dealt with what might be termed traditional
    UNIX systems: AH80 uses this to refer to System V Release 3 (SVR3), 4.3BSD, and
    earlier versions. The following general statements may be made about a traditional
    UNIX system. It is designed to run on a single processor and lacks the ability
    to protect its data structures from concurrent access by multiple processors.
    Its kernel is not very versatile, supporting a single type of file system, process
    scheduling policy, and executable file format. The traditional UNIX kernel is
    not designed to be extensible and has few facilities for code reuse. The result
    is that, as new features were added to the various UNIX versions, much new code
    had to be added, yielding a bloated and unmodular kernel.


    ![](img/e8a705e38cf3a8576620995ac6bb6f53_5_0.png)


    ![](img/e8a705e38cf3a8576620995ac6bb6f53_6_0.png)

