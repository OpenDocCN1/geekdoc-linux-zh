    ## 4.5 SOLARIS 线程与 SMP 管理


    Solaris 实现了一种异常的多级线程支持，旨在为利用处理器资源方面提供巨大的灵活性。


    ### 多线程架构


    Solaris 使用了四种独立的线程概念：


    - **进程 (Process):** 这是标准的 UNIX 进程，包含用户的地址空间、栈和进程控制块。

    - **用户级线程 (User-level threads):** 通过进程地址空间中的线程库实现，对操作系统是不可见的。用户级线程 (ULTs) 是应用程序并行的接口。

    - **轻量级进程 (Lightweight processes):** 轻量级进程 (LWP) 可以被视为 LWP 与内核线程之间的映射。每个 LWP 支持一个或多个
    ULT。

    - **内核线程 (Kernel threads):** 这些是可以被调度并分发到多处理器上运行的根本实体。


    图 4.15 展示了这四个实体之间的关系。注意，每个 LWP 始终有一个内核线程。LWP 在进程内对应用程序是可见的。因此，LWP 数据结构存在于各自的进程中。同时，每个
    LWP 绑定到单个线程，而内核数据结构是空间。


    例如，进程 1 包含一个绑定到单个 ULT 的单个 LWP。因此，它有一个的执行线程，类似于传统的 UNIX 进程。当单个进程内部不需要并发时，应用程序会使用这种简单结构。进程
    2 对应于纯 ULT。所有的 ULT 都由单个内核线程支持，因此一次只能执行一个 ULT。这种结构对于可以表示并发但不需要并行执行的应用程序是很有用的。进程
    3 显示了多线程在 LWP 上的多路复用。通常情况下，Solaris 允许应用程序在少于或等于 LWP 数量的 LWP 上复用线程。这使得应用程序能够在内核级别指定其支持的并行度。进程
    4 有四个线程以一一对应的关系映射到 LWP。这种结构使得应用程序内部的完全并行执行成为可能。如果线程通常或频繁地以阻塞方式挂起，这种结构就很有用。进程 5
    显示了多个 ULT 到多个 LWP 的映射以及一个 ULT 到 LWP 的绑定。此外，一个 LWP 绑定到特定的进程。


    图中未显示的是与 LWP 未关联的内核线程。内核创建、运行并销毁这些内核线程以执行特定的系统函数。使用线程而不是内核来实现系统函数减少了内核内切换的开销（从进程切换到线程切换）。


    ### 动机


    用户级和内核级线程的结合为应用程序程序员提供了一个机会，以最有效且最适合给定应用程序的方式来利用并发。


    2 再次，在 Solaris 文献中没有找到缩写 ULT。


