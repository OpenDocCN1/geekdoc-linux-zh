    ## 3.4 UNIX SVR4 进程管理


    UNIX System V 使用简单但强大的进程机制，该机制对用户可见。UNIX 遵循图 3.14b 中的模型，大多数操作系统运行在用户进程的环境中。因此，需要两种模式：用户态和内核态。UNIX
    使用两类进程：系统进程和用户进程。进程在内核态下运行并执行系统代码以执行管理和维护功能，如内存分配和交换。进程在用户态下执行用户程序和实用程序，并在内核态下执行指向内核的指令。用户进程通过发出系统调用、产生异常（故障）或发生中断进入内核态。


    ## 进程状态


    UNIX 操作系统共识别了九种状态；这些状态列在表 3.9 以及图 2.16 所示的状态转换图中（基于图 [BACH86]）。该图与图 3.7 类似，UNIX
    的睡眠状态对应于两个阻塞状态。区别可以总结如下：


    - 与“运行（Running）”不同，使用了两个状态来指示进程是在用户态还是内核态执行。

    - 在两个状态之间进行了区分：（就绪并在内存中，Ready to Run, in Memory）和（被抢占，Preempted）。这两个状态在本质上是同一个状态，如连接它们的虚线所示。这种区别在于进入被抢占状态的方式。当进程在内核态下运行时（由于系统调用、检查中断或
    I/O 中断的结果），将会有内核完成工作并准备好将控制权还给用户进程的时刻。此时，内核可能决定抢占当前进程，转而让一个就绪且优先级更高的进程。在这种情况下，当前进程移动到被抢占状态。为了调度目的，处于被抢占状态的进程和处于就绪并在内存中状态的进程组成一个队列。


    抢占只能在进程即将从内核态移动到用户态时才会发生。当进程在内核态运行时，它可能不会被抢占。这使得 UNIX 不适用于实时处理。关于实时处理要求的讨论请见第
    10 章。


    在 UNIX 中，有两个进程是独特的。进程 0 是系统启动时创建的特殊进程；实际上，它在启动时就被预定义了。此外，它产生进程 1，称为 init 进程；系统中的所有进程都以进程
    1 为祖先。当新的交互式用户登录系统时，系统会为该用户创建一个用户进程。随后，该用户进程可以在分支树中创建进程，使得任何特定应用程序都可以创建多个相关的进程。


    ## 进程描述


    UNIX 中的进程是一组相当复杂的数据结构，为操作系统提供了管理和调度进程所需的所有信息。表 3.10 总结了进程映像的元素，这些元素被组织成三个部分：用户级上下文、寄存器上下文和系统级上下文。


    用户级上下文包含用户程序的基本元素，可以直接从编译后的对象文件中生成。用户程序被分为文本区和数据区；文本区是只读的，用于存放程序的指令。在进程执行期间，处理器使用用户栈区域进行过程调用、返回和进程传递。共享内存区域是一个与其他进程共享的数据区域。共享内存区域只有一个物理副本，但通过使用虚拟内存，该共享内存区域似乎位于进程自己的地址空间中。当进程未运行时，处理器状态信息存储在寄存器上下文区域。系统级控制保持不变，以便操作系统需要管理该进程。它由一个进程表组成（大小固定并贯穿进程整个生命周期）以及一个动态部分（其大小在进程生命周期内会变化）。静态部分的元素是进程表，每个进程有一个条目。操作系统维护的进程表包含内核随时可以访问的控制信息；因此在虚拟系统中，所有进程条目都维护在内存中。表
    3.1 列出了进程表的内容。用户区（或 U 区）包含了内核在进程进程上下文中执行时所需的额外进程信息；它在进程与内存之间进行分页交换时也会被用到。表 3.2
    显示此表的内容。


    进程条目与 U 区之间的区别反映了内核始终在某些进程的上下文中执行。大部分时间，内核会处理与进程有关的问题。但在某些，当内核执行相对于调度另一个进程的调度算法时，它需要其他进程的信息。


    第三个静态部分是进程区域表，由内存管理系统使用。最后，内核栈是系统级上下文的动态部分。该栈在进程于内核中执行时使用，包含了过程调用和中断发生时必须保存和恢复的信息。


    ## 进程控制


    UNIX 中的进程创建通过内核系统调用 `fork()` 实现。当进程发出请求时，操作系统执行以下功能 [BACH86]：


    1. 在进程表中为新进程分配一个槽位。

    2. 为子进程分配一个唯一的进程 ID（PID）。

    3. 复制父进程的进程映像，共享内存除外。

    4. 增加父进程拥有的任何文件的计数器，以反映新增的进程也拥有了这些文件。

    5. 将子进程分配到就绪状态。

    6. 将子进程的 ID 号返回给父进程，并向子进程返回值 0。


    所有这些工作都在父进程的内核中完成。当内核完成这些功能后，它可以作为调度程序的一部分执行以下操作之一：


    1. 留在父进程中。控制权在父进程调用 `fork` 的点返回用户态。

    2. 将控制权转移到子进程。子进程从代码中与父进程相同的点开始执行，即 `fork` 返回处。

    3. 将控制权转移到另一个进程。父进程和子进程都留在就绪状态。


    这种进程创建方法可能难以视觉化，因为父进程和子进程都在执行同一段代码。区别在于：当 `fork` 返回时，会测试返回参数。如果值为零，则这就是子进程，并


