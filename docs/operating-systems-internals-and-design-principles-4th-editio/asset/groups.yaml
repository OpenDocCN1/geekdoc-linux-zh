    \ remains waiting until this thread releases the lock. If there are no writers,\
    \ the primitive wakes up any pending readers.\n\nrw_tryupgrade()   Attempts to\
    \ convert a reader lock into a writer lock.\n```\n\n# Condition Variables\n\n\
    A condition variable is used to wait until a particular condition is true. Condition\
