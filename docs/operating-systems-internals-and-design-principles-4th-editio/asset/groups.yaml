    ![](img/e8a705e38cf3a8576620995ac6bb6f53_7_0.png)

    Figure 2.16 Traditional UNIX Kernel [BACH86]


    ## 2.7 MODERN UNIX SYSTEMS


    As UNIX evolved, the number of different implementations proliferated, providing
    some useful features. There was a need to produce a new implementation that unified
    the most important innovations, added other OS-design features, and produced a
    more modular architecture. Typical of the modern UNIX kernel is the architecture
    developed in Figure 2.17. There is a small core of facilities, written in a modular
    fashion, that provide functions and services needed by a number of OS processes.
    Each of the outer circles represents functions and an interface that may be implemented
    in a variety of ways.


    We now turn to System Release 4 (SVR4)


    ## System V Release 4 (SVR4)


    SVR4, developed jointly by AT&T and Sun Microsystems, combines features from SVR3,
    4.3BSD, Microsoft Unix V, and SunOS. It was also a rewrite of the System V kernel
    and produced a clean, if complex, implementation. New features in the release
    include real-time processing support, scheduling classes, dynamically allocated
    data structures, virtual memory management, virtual file system, and a preemptive
    kernel.


    SVR4 draws on experience of both commercial and academic designers and was developed
    to provide a uniform platform for commercial deployment. It has succeeded in its
    objective and is perhaps the most important UNIX variant ever. It incorporates
    the most important features developed on any UNIX system, and is so in an integrated,
    commercially viable fashion. SVR4 is running on machines ranging from 32-bit microprocessors
    up to supercomputers and is one of the most important operating systems ever developed.
    Many of the UNIX examples in this book are from SVR4.


    ## Solaris 2.x


    Solaris is Sun''s SVR4-based UNIX, with the latest version being 2.8. The version
    2 Solaris implementations provide all of the features of SVR4 plus a number of
    more advanced features, such as a fully preemptive, multithreaded kernel, full
    support for SMP, and an object-oriented interface to file systems. Solaris is
    the most used and most successful commercial UNIX implementation. For OS features,
    Solaris provides the UNIX examples in this book.


    ## 4.3BSD


    The Berkeley Software Distribution BSD of UNIX releases has played a key role
    in the development of OS design. 4.3BSD is widely used in academic installations
    and has served as the basis of many commercial UNIX products. It is probably safe
    to say that BSD is responsible for much of the popularity of UNIX and that enhancements
    to UNIX first appeared in BSD versions.


    4.4BSD is the final version of BSD to be released by Berkeley, with the design
    and implementation organization subsequently dissolved. It is a major upgrade
    to 4.3BSD and includes a new virtual memory system, changes in the kernel structure,
    and a long list of other feature enhancements.


    ## Linux


    ### History


    Linux started as a UNIX variant for the IBM PC architecture. The initial version
    was written by Lin Torvalds, a Finnish student of computer science. Torvalds posted
    an early version of Linux on the Internet in 1991. Since then, a number of people,
    collaborating over the Internet, have contributed to the development of Linux,
    all under the control of Torvalds. Because Linux is free and the source code is
    available, it became an early alternative to other UNIX workstations, such as
    those offered by Sun Microsystems, Digital Equipment Corp (now Compaq, and Silicon
    Graphics). Today, Linux is a full-featured UNIX system that runs on all of these
    platforms and more.


    Key to the success of Linux has been its character as a free package available
    under the auspices of the Free Software Foundation (FSF). FSF''s goal is stable,
    platform-independent software that is free, high quality, and enhanced by the
    user community. FSF''s GNU project provides tools for software developers, and
    the GNU Public License (GPL). Torvalds used GNU tools in developing his kernel,
    which he released under the GPL. Linux distributions that you use today are the
    product of FSF''s GNU project, Torvalds''s individual effort, and many collaborators
    all over the world.


    In addition to its use by many individual programmers, Linux has now made significant
    penetration into the corporate world [MANCO0]. This is not primarily because of
    the free software, but because of the quality of the Linux kernel. Many talented
    programmers have contributed to the current version, resulting in a technically
    impressive product. Moreover, Linux is highly modular and configurable. This makes
    it easy to squeeze optimal performance from a variety of platforms. With the source
    code available, vendors can tweak applications and utilities to meet specific
    requirements. Throughout this book, we will provide details of Linux kernels.


    ## Modular Structure


    Most UNIX kernels are monolithic. While a monolithic kernel is one that includes
    virtually all of the operating-functionality in one large block of code that runs
    as a single process with a single address space. All components of the kernel
    have access to all of its internal data structures and routines. If changes are
    made to any portion of a monolithic operating system, all the modules and routines
    must be rebuilt and reinstalled and the system rebooted before the changes take
    effect. As a result, any modification, such as adding a new driver or file system,
    is difficult. This is especially acute for Linux, for which development is global
    and driven by a loosely associated group of independent programmers.


    To solve this problem, Linux is organized as a collection of relatively independent
    blocks referred to as loadable modules [GOYE9]. The Linux loadable modules have
    two important characteristics:


    - **Dynamic linking**: A kernel module can be loaded and linked into the kernel
    while the kernel is already in memory and executing. A module can also be unloaded
    and removed from memory at any time.


    - **Stackable modules**: The modules are arranged in a hierarchy. Individual modules
    serve as libraries when they are referenced by client modules higher up in the
