    # 8.3 UNIX IN SOLARIS MEMORY MANAGEMENT


    UNIX is intended to be machine independent, its memory-management scheme will
    vary from one system to the next. Earlier versions of UNIX simply used variable
    partitioning with no virtual memory scheme. Current implementations, including
    SVR4 and Solaris 2.x, make use of paging memory.


    In SVR4 and Solaris, there are actually two memory-management schemes. The paging
    system provides a virtual memory capability that allocates page frames in memory
    to processes and also allocates page frames to disk blocks. Although this is an
    effective memory-management scheme for user processes and disk I/O, a paging virtual
    memory scheme is less suited to managing the memory allocation for the kernel.
    For this latter purpose, a kernel memory allocator is used. We examine these mechanisms
    in turn.


    # Paging System


    # Data Structures


    For paged memory, UNIX makes use of data structures that, with minor adjustment,
    are machine independent (Table 8.22 and Table 8.5):


    +   - Page table: Typically, there will be one page table per process, with one
    entry for each page in virtual memory for that process.


    +   - Disk descriptor: Associated with each page of a process is an entry in this
    table that describes the disk copy of the virtual page.


    +   - Page frame data table: Describes each frame of real memory and is indexed
    by frame number.


    +   - Swap-table: There is one swap-table for each swap device, with one entry
    for each page on the device.


    Most of the fields defined in Table 8.5 are self-explanatory. A warrant comment-
    The field in the paging table is an indication of how long it has been since a
    program referenced this field. However, the number of bits and the frequency of
    update of this field are implementation dependent. Therefore, there is no universal
    UNIX of this field for page replacement policy.


    The Type of storage in the disk descriptor is needed for the following reason:
    When an executable is first used to create a new process, only a portion of the
    program and data for the file is loaded into running memory. Later, as page faults
    occur, new portions of the program and data are loaded. It is only at the time
    of first loading that virtual memory pages are created and assigned to locations
    to be swapping. At that time, the operating system is told whether it to clear
    (set to 0) the locations in the page frame before the first loading of a block
    or program data.


    # Page Replacement


    The page frame data table is used for page replacement. Several pointers are used
    to create lists within this table. All of the available frames are linked together
    in a list of free frames available for bringing in. When the number of available
    pages drops below a certain threshold, the kernel will need a steal of pages to
    compensate.


    The page-replacement algorithm used in SVR4 is the refinement of the clock algorithm
    (Algorithm 8.16) using the two-handed clock algorithm (Figure 8.23). The algorithm
    uses the reference bit in page table entry for each page that is eligible (not
    locked) to be swapped out. This bit is set to 0 when the page is first brought
    in and set to 1 when the page is referenced for a read or write. In the clock
    algorithm, the fronthand, sweeps through the pages on the list of eligible pages
    and sets the reference bit to 0 on each page. Later, the backhand sweeps through
    the same list and checks the reference bit. If the bit is set to 1,'
- md: '

    then that page has been referenced the fronhand swept; these frames are ignored.
    If the bit is set to 0, the page has not been referenced in the time interval
    between the visit by fronhand and backhand; these pages are placed on a list to
    be paged out.

    Two parameters determine the operation of the algorithm:


    - *Scrate*: The rate at which the two hands scan through the page list, in pages
    per second

    - *Handspread*: The gap between fronhand and backhand


    These two parameters have default values set at boot time based on the amount
    of physical memory. The scant parameter can be altered to meet changing conditions.
    The parameter varies linearly between the values slowscan and fastscan (at configuration
    time) as the amount of free memory varies between the values lossless and free.
    If the amount of free memory shrinks, the clock hands move more rapidly to free
    up more pages. The handspread determines the gap between the fronhand and the
    backhand and therefore, together with scant, the window of opportunity to use
    a page before it is swapped out due to lack of use.


    # Kernel Memory Allocator


    The kernel generates and destroys small tables and buffers during the course of
    execution, each of which requires dynamic memory allocation. [VAHA96] lists the
    following examples:


    - * The pathname translation routine may allocate a buffer to copy a pathname
    from user space.

    - The allocb() routine allocates STREAMS of arbitrary size.

    - Many UNIX implementations allocate zombie structures to retain exit status and
    resource information after deceased processes.

    - In SVR4 and Solaris, the kernel allocates many objects (as proc structures,
    vnodes, and file descriptors) dynamically when needed.


    Most of these blocks are significantly smaller than the typical kernel page size,
    and therefore the paging mechanism would be inefficient for kernel memory allocation.
    For SVR4, a modification of the buddy system, described in Section 7.2, is used.


    In buddy systems, the cost to allocate and free a block of memory is low compared
    to that of best-first or first-fit policies [KNUT97]. However, in the case of
    kernel memory management, the allocation and free operations must be made as fast
    as possible. The drawback of the buddy system is the required fragmentation and
    copying.


    Barkley and AT&T proposed a version with a lazy buddy system [BARK89], and this
    is the technique adopted SVR4. The authors observed that UNIX exhibits steady-state
    behavior in kernel memory demand; that, the amount of blocks of a particular size
    varies in time. If a block of size 2^i is released and immediately coalesced with
    a block of size 2^i, the kernel may next request a block of size 2^i, which may
    necessitate splitting the larger block again. To avoid this unnecessary coalescing
    and splitting, the buddy system defers coalescing until it seems like it is needed,
    and then coalesces as many blocks as possible.

    The lazy buddy system uses the following parameters:


    $N_i = \text{current number of blocks of size } 2^i$


    $A_i = \text{current number of blocks of size } 2^i \text{ that are allocated
    (occupied)}$


    $G_i = \text{current number of blocks of size } 2^i \text{ that are globally free;
    these are blocks that are eligible for coalescing; if the buddy of such a block
    becomes free, then the two blocks will be coalesced into a globally free of size
    $2^{+1}$. All free blocks (holes) in the standard buddy system could be considered
    globally free.


    $L_l = \text{current number of blocks of size } 2^l \text{ that are locally free;
    these are blocks that are not eligible for coalescing. Even if the buddy of such
    a block becomes free, the two blocks are not coalesced. The locally free blocks
    are retained in the anticipation of future demand for a block of that size.


    The following relationship holds:


    $N_i = A_i + G_i + L_i$


    In general, the lazy buddy system tries to maintain a pool of locally free blocks
    and only invokes coalescing if the number of locally free blocks exceeds a threshold.
    If there are too many locally free blocks, then there is a chance that there will
    be a lack of free blocks at the next level to satisfy demand. Most of the time,
    when a block is freed, coalescing does not occur, so there minimizes minimal bookkeeping
    and operational costs. When a block is to be allocated, no distinction is made
    between locally and globally free blocks; again, this minimizes bookkeeping.


    The criterion used for coalescing is that the number of locally free blocks of
    a given size should not exceed the number of allocated blocks of that size (i.e.,
    we must have $L_i \leq A_i$). This is a reasonable guideline for restricting the
    growth of locally free blocks, and experiments in [BARK89] confirm that this scheme
    results in noticeable savings.


    To implement the scheme, the authors define a delay variable as follows:


    $D_i = A_i - L_i = N_i - 2L_i - G_i$


    Figure 8.24 shows the algorithm.


