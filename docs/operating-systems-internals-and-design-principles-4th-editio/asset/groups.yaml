    ## 8.4 LINUX 内存管理


    Linux 共享许多与其他 UNIX 实现内存管理方案的特性，但也有其独特的特征。总体而言，Linux 的内存管理方案相当复杂 [DUBE98]。在这里，我们给出简要概述。


    ## Linux 虚拟内存


    ### 虚拟内存地址


    Linux 使用三级页表结构，由以下类型的表组成（每个单独表的大小为一个页）：


    - **页目录 (Page directory)**：活动进程拥有一个大小为一页的页目录。页目录中的每个条目指向页中间目录的一页。对于活动进程，页目录必须位于主内存中。

    - **页中间目录 (Page middle)**：页中间目录可能跨越多个页。页目录中的每个条目指向表中的一个页。

    - **页表 (Page table)**：页表也可能跨越多个页。每个表条目引用进程的一个一个虚拟页。


    为了使用这种三级页表结构，Linux 中的虚拟地址被视为由四个字段组成。最左侧（高位）字段用作页目录的索引。下一个字段用作页中间目录的索引。第三个字段用作页表的索引。第四个字段给出所选内存页内的偏移量。


    Linux 的页表结构是平台无关的，设计用于适应 64 位的 Alpha 处理器，该处理器提供了三级分页的硬件支持。在 64 位地址下，在 Alpha 上使用两级页会导致非常大的页表和目录。32
    位的 Pentium/x86 架构具有两级硬件分页机制。Linux 软件通过将页中间目录的大小定义为1来适应这种双级方案。


    ## 页分配


    为了提高从主内存读写页的效率，Linux 定义了一种机制来处理映射到连续页帧块的连续页块。为此，，使用了伙伴系统（buddy system）。内核维护了一个固定大小的连续页帧列表：一组由
    1, 2, 4, 8, 16 或 32 页组成。随着主内存中页的分配和释放，可用页将使用伙伴算法进行拆分和合并。


    ## 页替换算法


    Linux 的页替换算法基于 8.2 节中描述的时钟算法（见图 8.16）。在简单的时钟算法中，主内存中的每个页都关联有一个使用位（use bit）和一个修改位（modify
    bit）。在 Linux 中，使用位被一个 8 位的年龄变量（age variable）取代。每次访问一个页，年龄变量就会加 1。在后台，Linux 定期扫描全局页池，并在轮过主内存中所有页时减少每个页的年龄变量。年龄为
    0 的页是“旧”页，它已经一段时间未被引用，是最佳替换候选者。年龄值越大，该页在最近使用的频率就越高，越不容易被替换。因此，Linux 算法是最少使用策略的一种。


    ## 内核内存分配


    Linux 内核内存分配的基础是用于用户虚拟内存管理的页分配机制。与虚拟内存方案一样，使用了伙伴算法，以便内核内存以一个页或多个页为单位进行分配和释放。由于这种方式可以分配的最少内存是一个页，仅靠页分配器是无效的，因为内核需要奇数大小的小型内存块。为了适应这些小块，Linux
    在分配的页内部使用了称为 slab 分配 [BONW94] 的方案。在在 Pentium/x86 机器上，页大小为 4千字节，页内的块可以分配为 32, 64,
    128, 252, 508, 2040 和 4080 字节的大小。


    slab 分配器相对复杂，这里不再详细检查；良好的描述可以在 [VAHA96] 中找到。本质上，Linux 维护了一组链表，每种大小的块有一个。块可以以类似于伙伴算法的方式进行拆分和聚合，并相应在列表之间移动。


    ## 9.3 传统的 UNIX 调度


    在本节中，我们检查传统的 UNIX 调度，它用于 SVR3 和 4.3 BSD Unix。这些系统主要针对分共享交互环境。调度算法旨在为交互用户提供良好的响应时间，同时确保低优先级作业不会饥饿。这种算法在现代
    UNIX 系统中已被取代，但研究这种方法是有价值的，因为它是实际分共享调度算法的代表。SVR4 的调度方案包含了对实时需求的考虑，因此讨论推到了第 10 章。


    传统的 UNIX 调度器在每个优先级队列中使用带有轮询（round robin）的多级反馈机制。系统利用 1 秒抢占机制。也就是说，如果一个运行中的进程没有在
    1 秒内完成，它就会被抢占。优先级基于进程类型和执行历史。以下公式适用：


    ```

    P(i) = Base_j + \frac{CPU(i-1)}{2} + nice_j

    ```


    其中

    CPU_j(i) = 进程 j 在间隔 i 中的利用率测量

    P_j(i) = 进程 j 在间隔 i 开始时的优先级；值越小优先级越高

    Base_j = 进程 j 的基础优先级

    nice_j = 用户可控的调整因子


    每个进程的优先级每秒重新计算一次，此时会做出新的调度决策。基础优先级以及 CPU 和 nice 组件被限制在固定的优先级带内，以防止进程迁移出其分配的带（通过基础优先级级别）。这些带用于优化对块设备（例如，磁盘）的访问，并允许操作系统快速响应系统调用。按优先级递减顺序，这些带为：


    - 交换器 (Swapper)

    - 块 I/O 设备控制 (Block I/O device control)

    - 文件操作 (File manipulation)

    - 字符 I/O 设备控制 (Character I/O device control)

    - 用户进程 (User processes)


    这种层次结构提供了 I/O 设备的最有效利用。在用户进程带内，执行历史会惩罚 CPU 密集型进程，而以牺牲 I/O 密集型进程为代价。再次，这应该提高效率。结合轮询抢占方案，该调度策略完全能够满足通用分共享的需求。


    进程调度的一个示例如图 9.17 所示。进程 A、B 和 C 同时创建，基础优先级同为 60（我们将忽略 nice 值）。时钟每秒中断系统 60 次，并为运行中的进程增加计数器。该示例假设没有进程本身阻塞，且没有其他进程就绪。将此与图
    9.16 进行比较。


