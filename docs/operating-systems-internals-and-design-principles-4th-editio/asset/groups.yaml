    ## 模块化结构


    大多数 UNIX 内核是单式的。单式内核是将几乎所有的操作系统功能包含在一个大型代码块中，作为一个具有单一地址空间的单一进程运行。内核的所有组件都可以访问其所有的内部数据结构和例程。如果对单式操作系统的任何部分进行更改，所有的模块和例程都必须重新编译安装，并重启系统使更改生效。结果是，任何修改（例如添加新的驱动程序或文件系统）都是困难的。对于由全球松散独立的程序员群体驱动的
    Linux 来说，这一点尤为突出。


    为了解决这个问题，Linux 被组织成一系列独立的块，称为可加载模块 [GOYE9]。Linux 可加载模块有两个重要特性：


    - **动态链接**：内核模块可以在内核已经在内存中执行时加载并链接到内核。模块也可以随时卸载并从内存中移除。

    - **堆栈模块**：模块按分级排列。单个模块在被上层客户端引用时作为库，在引用下游模块时作为客户端。


    动态链接 [FRAN97] 简化了配置任务并节省了内核内存。在 Linux 中，用户或程序可以使用 `insmod` 和 `rmmod` 命令根据需要加载和卸载模块。对于堆栈模块，可以定义模块之间的依赖关系。这有两个益处：


