    # 4.6 LINUX PROCESS AND THREAD MANAGEMENT


    Linux Processes

    A process, or task, in Linux is represented by a task_struct data structure. Linux
    maintains a task table, which is a linear vector of pointers to every task_struct
    data structure currently defined. The task_struct data structure contains information
    in a number of categories:


    +   - **State**: The execution state of the process (executing, ready, suspended,
    stopped, zombie).

    This is described subsequently.

    - **Scheduling**: Information provided by Linux to schedule processes. A process
    can be normal or real-time and has a priority. Real-time processes are scheduled
    before normal processes, and within each category, relative priorities are used.
    A counter keeps track of the amount a process is allowed to execute.

    - **Identifiers**: Each process has a unique identifier and also has group identifiers.
    A group identifier is used to assign resource privileges to a group of users.

    - **Interprocess communication**: Linux supports the IPC mechanisms found in UNIX
    SVR4, described in Chapter 6.

    - **Links**: Each process includes a link to its parent process, links to its
    siblings (with the same parent), and links to all of its children.

    - **Timers and timers**: Includes process creation time and the amount of time
    consumed by the process. A process may also have associated one or more interval
    intervals. A process defines an interval by means of a system call; as a result
    a signal is sent to the process when the timer expires. A timer may be single
    or periodic.

    - **File system**: Includes pointers to any files opened by this process.

    - **Virtual memory**: Defines the virtual memory assigned to this process.

    - **Processor-specific context**: The registers and stack information that constitute
    the context of this process.


    Figure 4.18 shows the execution state of a process. These are:


    +   - **Running**: This state value corresponds to two states. A Running process
    is either executing or ready to execute.

    - **Interruptable**: This is a blocked state, in which the process is waiting
    for an event, such as the end of an I/O operation, or a signal from another process.

    - **Uninterruptable**: This is another blocked state. The difference between this
    and the Interruptable state is that a process is waiting directly on hardware
    conditions and will not accept any signals.

    - **Stopped**: The process has been halted, and can only be resumed by positive
    action from another process. For example, a process that is being debugged can
    be put into the Stopped state.

    - **Zombie**: The process has been terminated, but for some reason, still must
    have its task structure in the process table.


    Linux Threads

    A new process is created in Linux by copying the attributes of the current process.
    A new process can be cloned so that it shares resources, such as files, signal
    handlers, and virtual memory. When the two processes share the same virtual memory,
    they function as threads within a single process. However, no separate type of
    data structure is defined for a thread. Linux makes no distinction between a thread
    and a process.'
