    # 12.7 UNIX FILE MANAGEMENT


    The UNIX kernel views all files as streams of bytes. Any internal logical structure
    is application specific. However, UNIX is concerned with the physical structure
    of files.

    Four types of files are distinguished:


    +   * **Ordinary**: Files that contain information in them by a user, an application
    program, or a system utility program.

    * **Directory**: Contains a list of file names pointers to indexes (inodes), described
    later. Directories are hierarchically organized (Figure 12.4). Directory files
    are actually ordinary files with special protection privileges so that only the
    file system can write into them, while read access is available to all users.

    * **Special**: Used to access peripheral devices, such as terminals and printers.
    Each I/O device is associated with a special file, as discussed in Section 11.7.

    * **Named**: Named pipes, as discussed in Section 6.


    In this section, we are concerned with the handling of ordinary files, which correspond
    to what most systems treat as files.


    # Inodes


    All types of UNIX inodes are administered by the operating system as inodes. An
    inode (information node) is a control structure that contains the key information
    needed by the operating system for a particular file. Several file names may be
    associated with a single inode


    # File Allocation


    File allocation is done on a block basis. Allocation is dynamic, as rather than
    using preallocation. Hence, the blocks of a file on disk are not necessarily contiguous.
    An indexed method is used to keep track of each file, with part of the index stored
    in the inode for the file. The inode includes 39 bytes of address information
    that is organized as thirty-three addresses, or pointers. The first 10 addresses
    point to the first 10 blocks of the file. If the file is longer than 10 blocks,
    then one or more levels of indexing is used as follows:


    +   * The eleventh address in the inode points to a block on disk that contains
    the next portion of the index. This is referred to as the single indirect block.
    This block contains the pointers to succeeding blocks in the file.

    * If the file contains more blocks, the twelfth address in the inode points to
    a double indirect block. This block contains a list of single indirect blocks.
    Each of single indirect blocks, in turn, contains pointers to file blocks.

    * If the file contains still more blocks, the thirteenth address in the inode
    points to a triple indirect block that is a third level of indexing. This block
    points to additional indirect blocks.


    All of this is illustrated in Figure 12.3. The total number of data blocks in
    a file depends on the capacity of the fixed-size blocks in the system. UNIX System
    V, the length of a block is 1 Kbyte, and each block can hold a total of 256 block
    addresses. Thus, the maximum size of a file with this scheme is over 16 Gbytes
    (Table 12.5).

    This scheme has several advantages:'
  - '[PAGE 58]


    +   1. The inode is of fixed size and relatively small and hence may be kept in
    main memory for long periods.

    2. Smaller files may be accessed with little or no indirection, reducing processing
    and disk access time.

    3. The theoretical maximum size of a file is large enough to satisfy virtually
    all applications.'
