  md: '# 13.6 CLUSTER


    Sun Cluster is a distributed operating system built as a set of extensions to
    the base Solaris UNIX system. It provides cluster with a single-system image:
    that is, the cluster appears to the user and applications as a single computer
    running the Solaris operating system.


    Figure 13.17 shows the overall architecture of Sun Cluster. The major components
    are:


    +   * Object and communication support

    * Process management

    * Networking

    * Global distributed file system


    # Object and Communication Support


    The Sun Cluster implementation is object oriented. The CORBA object model (see
    Appendix B) is used to define objects and the remote call (RPC) mechanism implemented
    in Sun Cluster. The CORBA Interface Definition Language (IDL) is used to specify
    interfaces between MC components in different nodes. The elements of the object-oriented
    language C+. The use of a uniform object model and IDL provides a mechanism for
    internode and intransprocess communication. All of this is built on top of the
    Solaris kernel with virtually no changes to the kernel.


    # Process Management


    Process management extends process operations so that the location of a process
    is transparent to the user. Sun Cluster maintains a global view of processes so
    that there is a unique identifier for each process in the cluster and that each
    node can learn the location and status of each process. Process migration (described
    in Chapter 14) is possible: a process can move from one node to another during
    its lifetime, to achieve load balancing or for failover. However, the threads
    of a single process must be on the same node.


    # Networking


    The designers of Sun Cluster considered three approaches for handling network
    traffic:


    +   1. Perform all network protocol processing on a single node. In particular,
    for a TCP/IP-based admission, (incoming and outgoing) traffic would go through
    a network-connection node for incoming traffic would analyze TCP and IP headers
    and the encapsulated data to the appropriate node; and for outgoing TCP would
    encapsulate data from other nodes in TCP/IP headers. This approach is not scalable
    for a large number of nodes and was rejected.

    2. Assign a unique IP address to each node and run the network protocols over
    the external network directly to each node. One difficulty with this approach
    is that the cluster configuration is no longer transparent to the outside world.
    Another complication is the difficulty of failover when a running application
    moves to another node with a different underlying network.

    3. Use a packet filter to route packets to the proper node and perform process
    processing on that node. Externally, the cluster appears as a single server with
    a single IP address. Incoming connections (client requests) are load balanced
    among the available nodes of the cluster. This is the approach adopted in Sun
    Cluster.


    The Sun Cluster networking subsystem has three key elements:'
  merge: -1
  pgno: 62
- img_proc: true
  md: '+   1. Incoming packets are first received on the node that has the network
    adapter physically attached to it; the receiving node filters the packet and delivers
    it to the correct target node over the cluster interconnect.

    2. All outgoing packets are routed over the cluster interconnect to the node (or
    one of multiple alternative nodes) that has an external physical connection. All
    protocol processing for outgoing packets is done by the originating node.

    3. A global network configuration database is maintained to keep track of network
    traffic to each node.


    # Global File System


    The most important element of Sun Cluster is the global file system, which contrasts
    MC file management with the Solaris scheme. Both are built on the use of inode
    and virtual file system concepts.


    In Solaris, the virtual node (vnode) is used to provide a powerful, general-purpose
    interface to all types of file systems. A inode is used to map pages of memory
    into the address space of a process and permit access to a file system. While
    an inode is used to map processes to UNIX files, a vnode can map an object to
    any file system type. In this way, a system call need not understand the actual
    object being manipulated, only how to make the proper object-oriented type using
    the vnode interface. The vnode interface accepts general-purpose file system manipulation
    commands, such as read and write, and translates them into actions appropriate
    for the file system. As vnodes are used to describe individual file system objects,
    the virtual file system architectures are used to describe entire file systems.
    The vfs/vnode interfaces accept general-purpose commands that operate on entire
    files and translate them into actions appropriate for the file system de.


    In Sun Cluster, the global file system provides a uniform interface to files distributed
    over the cluster. The process can open a file anywhere in the cluster, and processes
    on all nodes system built on top of the existing Solaris use the vnode interface.
    The vfs/vnode operations are converted by a proxy layer into object invocations
    (see Figure 13.18b). The invoked object may reside anywhere in the system. The
    vnode performs a local vfs operation on the underlying file system. Neither the
    kernel nor the existing file systems have to be modified to support this global
    file environment.


    To reduce the number of remote object invocations, caching is used. Sun Cluster
    supports caching of file contents, directory information, and file attributes.'
  merge: -1
