  md: '# 6.8 SOLARIS THREAD SYNCHRONIZATION PRIMITIVES


    In addition to the concurrency mechanisms of UNIX SVR4, Solaris supports four
    thread synchronization primitives:


    +   - Mutual exclusion (mutex) locks

    - Semaphores

    - Multiple readers, single writer (readers/writer) locks

    - Condition variables


    Solaris implements these primitives within the kernel for kernel threads; they
    are also provided in the threads library for user-level threads. Execution of
    a primitive creates a data structure that contains parameters specified by the
    creating thread (Figure 6.13). Once a synchronization object is created, there
    are essentially two operations that can be performed: enter (acquire, lock) and
    release (unlock). There are no mechanisms in the kernel or the threads library
    to enforce mutual exclusion or to prevent deadlock. If a thread attempts to access
    a piece of data or code that is supposed to be protected but does not use the
    appropriate synchronization primitive, such access occurs. If a thread locks an
    object and fails to unlock it, no action is taken.


    All of the synchronization requires the existence of a hardware instruction that
    allows an object to be tested and set in one atomic operation, as described in
    Section 5.3.


    # Mutual Exclusion Lock


    A mutex prevents more than one thread from proceeding when the lock is acquired.
    The thread that locks the mutex must be the one that unlocks it. A thread attempts
    to acquire a lock by executing the mutex_enter primitive. If mutex_enter cannot
    set the lock (because it is already held by another thread), the blocking action
    depends on type-specific information stored in the mutex. The default blocking
    policy is a spin lock: A blocked thread polls the status of the lock while executing
    in a spin wait. An interrupt-based locking mechanism is optional. In the latter
    case, the mutex includes a thread id that identifies a queue of threads sleeping
    on it.


    The primitives associated with a mutex lock are:


    ```

    mutex_enter()Acquires the lock, potentially blocking if it is already held

    mutex_exit()   Releases the lock, potentially blocking a waiter

    mutex_tryenter()Acquires the lock if it is not already held

    ```


    The mutex_tryenter primitive provides a nonblocking way of performing the mutual
    exclusion function. This enables the programmer to use a busy-wait approach for
    user-level threads, which avoids locking the process entry while one thread is
    blocked.


    # Semaphores


    Solaris provides classic counting semaphores, with the following primitives:


    +   - sem_p()   Decrements the semaphore, potentially blocking the thread

    - sem_v()   Increments the semaphore, potentially blocking a waiter

    - sem_try() Increments the semaphore if blocking is not required


    Again, the sem_try() primitive permits busy waiting.


    # Readers/Writer Lock'
  merge: -1
