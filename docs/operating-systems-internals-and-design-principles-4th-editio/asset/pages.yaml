- img_proc: true
  md: 'When an interrupt occurs, it is delivered to a particular processor and the
    thread that was executing on that processor is pinned. A pinned thread cannot
    move to another processor and its context is preserved; it is simply suspended
    until the interrupt is processed. The processor then begins executing an interrupt
    thread. There is a pool of deactivated interrupt threads available, so that a
    new thread creation is not required. The interrupt then executes to handle the
    interrupt. If the handler routine needs access to a data structure that is currently
    locked in some fashion for use by another executing thread, the interrupt thread
    must wait for access to that data structure. An interrupt thread can only be preempted
    by another interrupt thread of higher priority.


    Experience with Solaris interrupt threads indicates that this approach provides
    superior performance to the traditional interrupt-handling strategy [KLEI95].'
  merge: -1
