- img_proc: true
  md: "The readers/writer lock allows multiple threads to have simultaneous read-only\
    \ access to an object protected by the lock. It also allows a single thread to\
    \ access the object for writing at one time, excluding all readers. When the lock\
    \ is acquired for writing it takes the status of write lock; all threads attempting\
    \ access for reading or writing must wait. If one or more readers have acquired\
    \ the lock, its status is read lock. The primitives are:\n\n```\nrw_enter()  \
    \    Attempts to acquire a lock as reader or writer\nrw_exit()        Releases\
    \ a lock as reader or writer\nrw_tryenter()     Acquires a lock if blocking is\
    \ not required\nrw_downgrade()    A thread that has acquired a write lock converts\
    \ it to a reader lock.\n                               Any writer remains waiting\
    \ until this thread releases the lock. If there are no writers, the primitive\
    \ wakes up any pending readers.\n\nrw_tryupgrade()   Attempts to convert a reader\
    \ lock into a writer lock.\n```\n\n# Condition Variables\n\nA condition variable\
    \ is used to wait until a particular condition is true. Condition variables must\
    \ be used in conjunction with a mutex lock. This implements a monitor of the type\
    \ illustrated in Figure 5.22. The primitives are:\n\n```\ncv_wait()       Blocks\
    \ until the condition is signaled\ncv_signal()     Wakes up one of the threads\
    \ blocked in cv_wait()\ncv_broadcast()  Wakes up all of the threads blocked in\
    \ cv_wait()\n```\n\ncv_wait() releases the associated mutex before blocking and\
    \ reacquires it before returning. Because reacquisition of the mutex may be blocked\
    \ by other threads waiting for the mutex, the condition that was waited must be\
    \ retested. Thus, typical usage is as follows:\n\n+   * mutex_enter(&m)\n* while\
    \ (some_condition) {\n    cv_wait(&cv, &m);\n}\n* mutex_exit(&m);\n\nThis allows\
    \ the condition to be a complex expression, because it is protected by the mutex."
