  md: "# 10.3 LINUX SCHEDULING\n\nLinux builds on the traditional UNIX scheduling\
    \ described in Section 9.3 by adding two scheduling classes for soft real-time\
    \ processing. The three Linux scheduling classes are:\n\n+   - SCHED_FIFO: First-in-first-out\
    \ real-time threads\n- SCHED_RR: Round-robin real-time threads\n- SCHED_OTHER:\
    \ Non-real-time threads\n\nWithin each class, multiple priorities may be used,\
    \ with priorities in the real-time classes higher than the priorities for the\
    \ SCHED_OTHER class. For FIFO threads, the following rules apply:\n\n+   1. The\
    \ system will not interrupt an executing FIFO thread except in the following cases:\n\
    \   a. Another FIFO thread of higher priority becomes ready.\n   b. The executing\
    \ FIFO thread becomes blocked waiting for an event, such as I/O.\n   c. The executing\
    \ thread voluntarily gives up the processor a call to the primitive `sched_yield`.\n\
    2. When an executing FIFO thread is interrupted, it is placed in the queue associated\
    \ with its priority.\n3. When a FIFO thread becomes ready and that thread has\
    \ a higher priority than the currently executing thread, the currently executing\
    \ thread is preempted and the highest priority FIFO thread is executed. If more\
    \ than one thread has that highest priority, the thread that has been waiting\
    \ the longest is chosen.\n\nThe SCHED_RR policy is similar to the SCHED_FIFO policy,\
    \ except for the addition of a time quota associated with each thread. When a\
    \ SCHED_RR thread has executed for its time quota, it is suspended and a real-time\
    \ thread of equal or higher priority is selected for running.\n\nFigure 10.9,\
    \ from [COMP98], is an example that illustrates the distinction between FIFO and\
    \ RR scheduling. Assume a program with four threads with three relative priorities\
    \ assigned as shown in Figure 10.9a. Assume that all waiting threads are ready\
    \ to execute when the current thread waits or terminates and that no higher-priority\
    \ thread is awakened while a thread is executing. Figure 10.9a shows a flow in\
    \ which all of the threads are in the SCHED_FIFO class. Thread D executes until\
    \ it waits or terminates. Next, threads B and C have the same priority, thread\
    \ B starts because it has been waiting longer than thread C. Thread B executes\
    \ until it waits or terminates, C executes until it waits or terminates. Finally,\
    \ thread A executes.\n\nFigure 10.9c shows a sample flow if all of the threads\
    \ are in the SCHED_RR class. Thread D executes until it waits or terminates. Next,\
    \ threads B and C are time sliced, because they have the same priority. Finally,\
    \ thread A executes.\n\nThe final scheduling class is SCHED_OTHER. A thread in\
    \ this class can only execute if there are no real-time threads ready to execute.\
    \ Within the SCHED_OTHER class, the traditional UNIX scheduling algorithm described\
    \ in Section 9.3 is used."
