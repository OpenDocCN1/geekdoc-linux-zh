  md: '# 3.4 UNIX SVR4 PROCESS MANAGEMENT


    UNIX System V uses of a simple but powerful process facility that is highly visible
    to the user. UNIX follows the model of Figure 3,14b, in which most of the operating
    system executes within the environment of a user process. Thus, two modes, user
    and kernel, are required. UNIX uses two categories of processes: system processes
    and user processes. Processes run in kernel mode and execute system code to perform
    administrative and housekeeping functions, such as allocation of memory and swapping.
    Processes operate in user mode to execute user programs and utilities and in kernel
    mode to execute instructions to the kernel. A user process enters kernel mode
    by issuing a system call, when an exception (fault) is generated or when an interrupt
    occurs.


    # Process States


    A total of nine states are recognized by the UNIX operating system; these are
    listed in Table 3.9 and a state transition diagram shown in Figure 3.16 (based
    on figure [BACH86]). This figure is similar to Figure 3.7, with the UNIX sleeping
    states corresponding to the two blocked states. The differences can be summarized
    quickly:


    +   * Unlike Running two states to indicate whether the process is executing in
    user mode or kernel mode.

    * A distinction is made between the two states: (Ready to Run, in Memory) and
    (Preempted). These are essentially the same state, as indicated by the dotted
    line joining them. The distinction is made to the way in which the preempted state
    is entered. When a process is running in kernel mode (as a result of a supervisor
    call, check interrupt, or I/O interrupt), there will come a time when the kernel
    has completed its work and is ready to return control to the user process. At
    this point, the kernel may decide to preempt the current process in favor of one
    that is ready and of higher priority. In this case, the current process moves
    to the preempted state. For purposes of dispatching, those processes in the preempted
    state and those in the Ready to Run, in Memory state form one queue.


    Preemption can only occur when a process is about to move from kernel mode to
    user mode. While a process is running in kernel mode, it may not be preempted.
    This makes UNIX unsuitable for real-time processing. A discussion of the requirements
    for real-time processing is provided in Chapter 10.


    Two processes are unique in UNIX. Process 0 is a special process that is created
    when the system boots; in effect, it is predefined at boot time. In addition,
    it spawns process 1, referred to as the init process; all processes in the system
    have process 1 as an ancestor. When a new interactive user logs onto the system,
    it creates a user process for that user. Subsequently, the user process can create
    processes in a branching tree, so that any particular application can create number
    of related processes.


    # Process Description


    A process in UNIX is a rather complex set of data structures that provide the
    operating system with all the information necessary to manage and dispatch processes.
    Table 3.10 summarizes the elements of the process image, which are organized into
    three parts: user-level context, register context, and system-level context.


    The user-level context contains the basic elements of a user''s program and can
    be generated directly from a compiled object file. The user''s program is separated
    into text and data areas; the text area is read-only and is intended to hold the
    program''s instructions. While the process is executing, the processor uses the
    user stack area for procedure calls and returns'
  merge: -1
  pgno: 12
- img_proc: true
  md: 'process passing. The shared memory area is a data area that is shared with
    other processes. There is only one physical copy of a shared memory area, but
    by the use of virtual memory, it appears to sharing that the shared memory region
    is in its address space. When a process is not running, the processor status information
    is stored in the register context area. The system-level control remains constant
    that the operation system needs to manage the process. It consists of a process
    table, which is fixed in size and stays with the process throughout its lifetime,
    a dynamic part, which varies in size through the life of the process. Element
    of the static part is the process table, with one entry per process. The process
    table maintained by the operating system contains control information that is
    accessible to the kernel at all times; hence, in a virtual system, all process
    entries are maintained in main memory. Table 3.1 lists the contents of the process
    table. User area, or U area contains additional process information that is needed
    by the kernel when it is executing in the context of this process; it is also
    used when paging processes to and from memory. Table 3.2 shows the contents of
    this table.


    The distinction between process entry and the U area reflects that the kernel
    always executes in the context of some process. Much of the time, the kernel will
    be dealing with the concerns of process. However, some of the time, when the kernel
    is performing a scheduling algorithm relatively to dispatching another process,
    it will need information about other processes.


    The third static part is the process region table, which is used by the memory
    management system. Finally, the kernel stack is the dynamic part of system-level
    context. This stack is used when the process is executing in kernel and contains
    the information that must be saved and restored as procedure calls and interrupts
    occur.


    # Process Control


    Process creation in UNIX is made by means of the kernel system call, fork( ).
    When a process issues a request, the operating system performs the following functions
    [BACH86]:


    +   1. It allocates a slot in the process table for the new process.

    2. It assigns a unique process ID to the child process.

    3. It makes a copy of the process image of the parent, with the exception of any
    shared memory.

    4. It increments counters for any files owned by the parent, to reflect that an
    addition process now also owns those files.

    5. It assigns the child process to a Ready to Run state.

    6. It returns the ID number of the child to the parent process, and a 0 value
    to the child process.


    All of this work is accomplished in kernel in the parent process. When the kernel
    completed these functions it can do one of the following, as part of the dispatcher
    routine:


    +   1. Stay in the parent process. Control returns to user mode at the point of
    the fork call of the parent.

    2. Transfer control to the child process. The child begins executing at the same
    point in the code as the parent, namely at the return from the fork call.

    3. Transfer control to another process. Both parent and child are left in the
    Ready to Run state.


    It is perhaps difficult to visualize this method of process creation because both
    parent and child are executing the same passage of code. The difference is this:
    when the return from the fork occurs, the return parameter is tested. If the value
    is zero, then this is the child process, and'
