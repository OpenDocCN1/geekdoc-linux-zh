  md: '# 8.4 LINUX MEMORY MANAGEMENT


    Linux shares many of the characteristics of the memory management schemes of other
    UNIX implementations but has its unique features. Overall, the Linux memory-management
    scheme is quite complex [DUBE98]. Here, we give a brief overview.


    # Linux Virtual Memory


    # Virtual Memory Addressing


    Linux use of a three-level page table structure, consisting of the following types
    of tables (each individual table is the size of one page):


    +   - **Page directory**: An active process has a single page directory that is
    the size of one page. Each entry in the page directory points to one page of the
    page middle. The page directory must be in main memory for an active process.

    - **Page middle**: The page middle directory may span multiple pages. Each entry
    in the page directory points to one page in the table.

    - **Page table**: The page table may also span multiple pages. Each table entry
    refers to one virtual page of the process.


    To use this three-level page table structure, a virtual address in Linux is viewed
    as consisting of four fields. The leftmost (most significant) field is used as
    an index into the page directory. The next field serves as an index into the page
    middle directory. The third field serves as an index into the page table. The
    fourth field gives the offset within the selected page of memory.


    The Linux page table structure is platform independent and was designed to accommodate
    the 64-bit Alpha processor, which provides hardware support for three levels of
    paging. With 64-bit addresses, the use of two levels of pages on the Alpha would
    result in very large page tables and directories. The 32-bit Pentium/x86 architecture
    has a two-level hardware paging mechanism. The Linux software accommodates the
    two-level scheme by defining the size of the page middle directory to one.


    # Page Allocation


    To enhance the efficiency of reading and writing out pages to from main memory,
    Linux defines a mechanism for dealing with contiguous blocks of pages mapped into
    contiguous blocks of frames. For this purpose, the buddy system is used. The kernel
    maintains a list of contiguous page frames of fixed size: a group consists of
    1, 2, 4, 8, 16, or 32 pages. As pages are allocated and deallocated in main memory,
    the available pages are split and merged using the buddy algorithm.


    # Page Replacement Algorithm


    The Linux page replacement algorithm is based on the clock algorithm described
    in Section 8.2 (see Figure 8.16). In the simple clock algorithm, the use bit and
    modify bit are associated with each page in main memory. In the Linux, the use
    bit is replaced with an 8-bit age variable. Each time a page is accessed, the
    age variable is incremented. In the background, Linux periodically sweeps through
    the global page pool and decrements the age variable for each page it rotates
    through all the pages in main memory. A page with an age of 0 is an "old" page
    that has not been referenced in some time and is the best candidate for replacement.
    The larger the value of age, the more frequently a page has been used in recent
    times and the less eligible it is for replacement. Thus, the Linux algorithm is
    a form of least used policy.


    # Kernel Memory Allocation'
  merge: -1
  pgno: 43
