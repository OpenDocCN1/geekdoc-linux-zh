  md: 'Some programs have logical parallelism that can be exploited to simplify and
    structure the code but do not need hardware parallelism. For example, an application
    that employs multiple windows, only one which is active at a time, could with
    advantage be implemented as a set of ULTs on a LWP. The advantage of restricting
    such applications to ULTs is efficiency. ULTs may be created, destroyed, blocked,
    etc., without involving the kernel. If ULT were known to the kernel, the kernel
    would have to allocate data structures for each one and thread switching. As we
    have seen (Table 4.1), kernel-level thread switching is more expensive than user-level
    thread switching.


    If an application invokes threads that block, such as performing I/O, having multiple
    LWPs to support an equal or greater number of ULTs is necessary. Neither the application
    nor the thread library provides contention contours to allow other threads within
    the same process to execute. Instead, if one thread in a process blocks, other
    threads within the process may run on the remaining LWPs.


    Mapping ULTs to LWPs is effective for some applications. For example, a parallel
    array computation could divide the rows of its arrays among different threads.
    If there is exactly one ULT per LWP, no thread switching is required for the computation
    to proceed.


    A mixture of threads that are permanently bound to LWPs and unbounded (multiple
    threads sharing a LWP) is appropriate for some applications. For example, a real-time
    application may have some threads with priority scheduling and real-time scheduling,
    while other threads perform background functions and can share one or a small
    pool of LWPs.


    # Process Structure


    Figure 4.16 compares, in general terms, the structure of a traditional UNIX system
    with Solaris. Under a UNIX implementation, the process structure includes ID;
    the user IDs; a dispatch table, which the kernel uses to decide what to do when
    sending a signal to a process; file descriptors, which describe the state of files
    used in this process; a memory map, which defines the space for this process;
    and a processor structure, which includes the kernel stack for Solaris retains
    this basic structure but replaces the processor structure with a list of structures
    containing one data block for each LWP.


    The LWP data structure includes the following elements:


    +   * An LWP identifier

    * The priority of LWP and hence the kernel thread that supports it

    * A signal mask that tells the kernel which signals will be accepted

    * Saved values of user-level registers (when the LWP is not running)

    * The kernel stack for this LWP, which includes system call arguments, results,
    and error codes for each level

    * Resource usage and profiling data

    * Pointer to the corresponding kernel thread

    * Pointer to the process structure


    # Thread Execution


    Figure 4.17 shows a simplified view of both ULT and LWP execution states. The
    execution of user-level threads is managed by the thread library. Let us first
    consider unbounded threads, threads that share a number of LWPs. An unbounded
    thread can be in one of four states: runnable, active, sleeping, or stopped. A
    ULT in the active state is currently assigned to a LWP and executes while the
    underlying kernel executes. A number of events may cause the ULT to leave the
    active state. Let us consider an active ULT T1. The following events may occur:


    +   * Synchronization: T1 invokes one of the concurrency primitives introduced
    in Chapter 5 to coordinate its activity with other threads and to enforce mutual
    exclusion. T1 is placed in'
  merge: -1
  pgno: 21
- img_proc: true
  md: 'the sleeping state. When the synchronization condition is met, T1 is moved
    to the runnable state.


    +   Suspension: Any thread (including T1) may cause T1 to be suspended and placed
    in the stopped state. T1 remains in state until another thread issues a continue
    request, which moves it to the runnable state.


    +   Preemption: Any active thread (T1 or some other) that causes another thread
    (T2) of higher priority to become runnable. If T1 is the lowest-priority active
    thread, it is preempted and moved to the runnable state, and T2 is assigned to
    the LWP made available.


    +   Yielding: If T1 executes the thr_yield() library command, the threads scheduler
    in the library will look to see if there is another thread (T2) of the same priority.
    If not, T1 is placed in the runnable state and T2 is assigned to the LWP made
    available.

    T1 continues to run.


    In all of the cases, when T1 is moved out of the active state, the threads library
    selects another unbound thread and runs it on the newly available LWP.

    Figure 4.17 also shows the state diagram for a LWP. We can view this state diagram
    as a detailed description of the ULT active state, because an unbound thread only
    has a LWP assigned to it when in the Active state. The ULT state diagram is reasonably
    self-explanatory. An active thread is only executing when its LWP is in the Running
    state. When an active thread executes a blocking system call, the LWP enters the
    blocked state. However, the ULT remains bound to that LWP and, as far as the threads
    library is concerned, the ULT remains active.


    With bound, the relationship between ULT and LWP is slightly different. For example,
    if bound moves to the Sleeping state awaiting a synchronization event, its LWP
    must also stop running. This is achieved by having the LWP block on a kernel-level
    synchronization.


    # Interrupts as Threads


    Operating systems contain two fundamental forms of asynchronous activity: processes
    and threads. Or processes cooperate with each other and manage the use of shared
    structures by means of primitives that enforce mutual exclusion (only one process
    at a time can execute certain code or access certain data) and synchronize their
    execution. Interrupts are interrupted by preventing their occurrence for a period
    of time. Solaris unifies these concepts into a single name: threads and the mechanisms
    for scheduling and executing kernel threads. By this, interrupts are converted
    to kernel threads.


    The motivation for converting interrupts is to reduce overhead. Interrupt handlers
    often manage shared data by executing, therefore while a kernel routine that accesses
    such data must be blocked, though most interrupts will not affect that data. Typically,
    the way this is done is for the routine to set the interrupt priority level higher
    to block interrupts, and then lower the priority level after access is completed.
    These operations take time. The problem is magnified on a multiprocessor system.
    The kernel must protect more objects and may need to block interrupts on all processors.


    The solution in Solaris is summarized as follows:


    +   1. Solaris employs a set of kernel threads to handle interrupts. With any
    kernel thread, an interrupt thread has its own identifier, priority, context,
    and stack.

    2. The kernel accesses to data structures and synchronization among threads using
    mutual exclusion primitives, of the type discussed in Chapter 5. That is, the
    normal synchronization techniques for threads are used in LWP interrupts.

    3. Interrupt threads are assigned higher priorities than all other types of kernel.'
