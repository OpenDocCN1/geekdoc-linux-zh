    # Introduction


    It has been a real privilege to be part of the talented team who secure Linux
    on a daily basis and have labored long hours to compile this guide in a timely
    manner. In our effort to include the best practices across the board, many technical
    reviews were done to ensure that, when put into practice, the ideas in the Guide
    do work. As with any variant OS, there are several ways to accomplish the same
    task. We had to draw the line on what to include for the sake of making this a
    useful. If you have more efficient ways of dealing with issues, please feel free
    to send them to me at `linux-sbs@sans.org` for possible inclusion in versions
    published at a later date. We concentrated on Red Hat 7.3 because it was the most
    widely used version while this Guide was being compiled and will be for some time
    until Red Hat 8.0 is better established. Remember that this is a guide, and should
    be used as such. Not everything included is for every system.


    Education on the OS, applications and system usage are essential for a base in
    the security field. I strongly believe you should know **how** something affects
    the system, and not just how to "cut and paste" fixes. We have tried to explain
    the "why" behind all the recommendations in this Guide, and hope that every reader
    gains a little more knowledge about securing a Linux system.


    **Mitch Baker**

    Senior Systems/Security Administrator

    Rose-Hulman Institute of Technology


    # 1.0 Chapter 1: General Security Principles


    ## 1.1 SECURITY POLICIES


    Security Policies are the blueprints used to build a security program. Your organization
    probably has a policy that states a system must be hardened before connecting
    it to the network. In this book, we will show you how to harden a Linux system,
    step by step, so that you can adhere to that policy. In very basic terms, Security
    Policies are the rules by which we secure environments. There are many types of
    security policies. These include:


    *   **Corporate Security Policy** – Defines overall security rules that apply
    to the entire corporation.

    *   **Remote Access Policy** – Defines rules for connecting to a company''s network
    from a remote host.

    *   **Password Policy** – Defines rules for creating, changing and maintaining
    strong passwords.

