    \ important to run a new `makemap` command and restart the `sendmail`daemon so\
    \ the changes will take effect. The example above is meant to illustrate simple\
    \ usage of the access database. A more detailed explanation and advanced configurations\
    \ can be found at: [http://www.sendmail.org/tips/relaying.html](http://www.sendmail.org/tips/relaying.html)\n\
    \n#### 3.2.1.5 Set Domain Name Masquerading\n\nMany organizations prefer to have\
    \ uniform mail addresses for all employees, such as joeuser@mailserver.com. While\
    \ some mail clients can be configured to use a specific domain, the administration\
    \ of multiple mail clients in even a small environment can be tedious and cost\
    \ prohibitive. Sendmail can be configured to rewrite the headers of all outbound\
    \ messages so that they masquerade as a single domain name for the entire organization.\
    \ To define the masquerade address, edit `/etc/mail/sendmail.mc` to reflect the\
    \ following example:\n\n```\n MASQUERADE_AS('mailserver.com')dnl\n    FEATURE\
    \ ('masquerade_entire_domain')dnl\n    FEATURE ('masquerade_envelope')dnl\n```\n\
    \nGenerate a new `sendmail.cf` file by running the m4 macro and restart the `sendmail`\
    \ daemon:\n\n```\n [root] # m4 /etc/mail/sendmail.mc > /etc/sendmail.cf\n    [root]\
    \ # /etc/rc.d/init.d/sendmail restart\n```\n\n#### 3.2.1.6 Configure Sendmail\
    \ to Use RBL Support\n\nThe Real-time Blackhole List, commonly referred to as\
    \ RBL, is a DNS-based service that contains a database of suspected and known\
    \ spammers. The m4 feature, dnsbl, allows sendmail to reference this database\
    \ and automatically reject any messages originating from a domain listed by RBL.\
    \ It should be noted that RBL is not an exact science and there are times when\
    \ a domain you wish to communicate with has found itself listed by RBL. It can\
    \ often prove difficult to get a domain removed so it is advised to use this feature\
    \ with caution as it may cause a break in communication with legitimate domains.\
    \ To add the feature to sendmail edit `/etc/mail/sendmail.mc` and add the following:\n\
    \nFEATURE (‘dnsbl’)dnl\n\nGenerate a new `sendmail.cf` file by running the m4\
    \ macro and restart the `sendmail` daemon:\n\n```\n [root] # m4 /etc/mail/sendmail.mc\
    \ > /etc/sendmail.cf\n    [root] # /etc/rc.d/init.d/sendmail restart\n```\n\n\
    #### 3.2.1.7 Install an Alternative MTA\n\nSeveral other mail transfer agents\
    \ are available to replace sendmail. Three popular alternatives are Qmail ([http://www.qmail.org](http://www.qmail.org))\
    \ by Daniel Bernstein, Postfix ([http://www.postfix.org](http://www.postfix.org))\
    \ by Wietse Venema, and Exim ([http://www.exim.org/](http://www.exim.org/)) developed\
    \ by the University of Cambridge. These MTA's were written with security in mind\
    \ and generally considered to offer high performance. It is beyond the scope of\
    \ this guide to give details on the installation and configuration of these alternatives\
    \ but a wealth of information is available at their respective sites.\n\n### 3.2.2\
    \ Secure the POP and IMAP Daemons\n\nFor mail servers that collect all incoming\
    \ mail for an organization, a common means to deliver the mail to clients is for\
    \ them to retrieve the mail using the Post Office Protocol (POP) or the Internet\
    \ Message Access Protocol (IMAP). POP (also called POP3) is the older and less\
    \ complicated of the two protocols, providing basic commands for authentication,\
    \ retrieval and deletion of mail messages from the mail server. IMAP is more flexible\
    \ and supports creating, deleting and renaming mail folders (mailboxes), searching,\
    \ selective retrieval of message attributes and more.\n\n#### 3.2.2.1 Get the\
    \ Latest Version of POP and IMAP Daemons\n\nUnfortunately, many POP and IMAP daemon\
    \ implementations have been plagued with vulnerabilities that lead to remote root\
    \ compromises of mail servers on various platforms. There are several well-known\
    \ exploit programs for cracking vulnerable Linux POP and IMAP daemons. It is generally\
    \ considered a good practice to always use the most current and stable release\
    \ of any daemons and this is no exception.\n\nMost newer POP and IMAP daemons\
    \ currently available will offer support for secure retrieval of messages. This\
    \ is most commonly done with TLS/SSL that requires the use of OpenSSL and the\
    \ creation of a certificate. Qpopper ([http://www.eudora.com/qpopper/](http://www.eudora.com/qpopper/)),\
    \ for example, is a POP daemon that offers TLS/SSL. The website contains detailed\
    \ instructions on how to accomplish this goal and is highly recommended.\n\n####\
    \ 3.2.2.2 Control Access to POP and IMAP with TCP Wrappers\n\nPOP/IMAP is traditionally\
    \ run out of `xinetd`, so access control through TCP wrappers is easy to configure\
    \ and adds an important element of security. Limit access to only those hosts\
    \ that have a legitimate need for the service. For a central mail hub that holds\
    \ mail for the entire mailserver.com domain and the 192.168.x.x network and delivers\
    \ it to clients via POP3 or IMAP, edit `/etc/hosts.allow` to reflect the following\
    \ changes:\n\n```\n ipop3d:        .mailserver.com        192.168.\nimapd:   \
    \      .mailserver.com        192.168.\n```\n\n## 3.3 FILE/PRINT SECURITY\n\n\
    ### 3.3.1 Securing WuFTPd\n\nDespite the recent increase in the deployed footprint\
    \ of encrypted services such as SSH, FTP services are still sometimes necessary.\
    \ Many clients (most notably certain Redmond-based operating systems) do not ship\
    \ with an SSH client at all, which forces many administrators to accept the risks\
    \ of cleartext FTP transfers. This section will discuss the configuration of the\
    \ WUFTPd FTP server package shipped with Red Hat7.3 for individual file transfers\
    \ and anonymous file access in a secure manner. Fortunately, the Washington University\
    \ FTP daemon has gotten progressively more intelligent and useful over the years,\
    \ and it now ships with a fairly secure default configuration from Red Hat. We'll\
    \ edit this configuration file to enable secure user FTP sessions, then again\
    \ for anonymous file transfers.\n\n#### 3.3.1.1 User File Transfers\n\nBy default,\
    \ WUFTPd comes pre-configured to chroot all users into their home directories\
    \ automatically. Even better, this action is done by the daemon and does not require\
    \ creating additional binary or library directories on the server in order to\
    \ function: it just works. In order to properly secure this, though, we'll need\
    \ to tweak the main FTP configuration file, `/etc/ftpaccess`.\n\n`/etc/ftpaccess`\
    \ (Changes are marked in **bold**, comments in *italics*)\n\n*   Don't allow system\
    \ accounts to login over FTP. *Comment out the right for the FTP user to login\
    \ over FTP—that's only needed for anonymous transfers*\n\n    ```\n     deny-uid\
    \ %-99 %65534-\n            deny-gid %-99 %65534-\n            # allow-uid ftp\n\
    \            # allow-gid ftp\n    ```\n\n*   Chroot all users by default\n\n \
    \   ```\n     guestuser *\n    ```\n\n*   List any users you wish to grant \"\
    real\" privileges to (i.e. that should not be chrooted) here\n\n    ```\n    \
    \ realuser <ftp administrators, etc.>\n    ```\n\n*   We don't need an explicit\
    \ chroot group: all users will be chrooted!\n\n    ```\n     # guestgroup ftpchroot\n\
    \    ```\n\n*   Set your email address"
