    \ documented backup plan so that backup procedures are performed consistently.\n\
    \n*   **Clearly label backup tapes** – Clearly labeling backup tapes will prevent\
    \ restoring a system with a tape that was not from that system.\n\n*   **Store\
    \ a copy of backup tapes offsite** – Offsite storage of backup tapes prevents\
    \ against destruction by environmental disasters. It also helps to prevent against\
    \ theft of backup tapes.\n\n*   **Verify backup tapes** – Periodically run verifications\
    \ against backup tapes to ensure that backup software is functioning properly\
