    # 引言


    随着 Linux 操作系统的日益成熟和普及，安全风险也随之增加。SANS 学院很高兴能成为每天工作和保障 Linux 安全的精英团队的一部分，为了及时编写本指南付出了巨大努力。为了涵盖全面的最佳实践，我们进行了多次技术评审，以确保这些理念在实践中有效。对于任何变体操作系统，完成同一任务都有多种方法。如果您有更高效的方法，请随时发送至
    `linux-sbs@sans.org`，以便在后后的版本中包含。我们专注于 Red Hat 7.3，因为它是编写指南期间使用最广泛的版本，并在 Red Hat
    8.0 完善之前将持续一段时间。请记住，这是一本指南，应当这样使用。并非所有内容适用于所有系统。操作系统、应用程序和使用的教育对于安全领域至关重要。我坚信，你应该了解某些操作如何影响系统，而不仅仅是复制粘贴修复。我们试图解释书中所有建议背后的“为什么”，并希望每位读者都能学到更多加固
    Linux 系统的知识。


    **Mitch Baker**

    高级系统/安全管理员

    罗斯-霍尔理工学院


    # 1.0 第 1 章：通用安全原则


    ## 1.1 安全策略


    安全策略是构建安全计划的蓝图。您的组织可能有一项政策，规定在连接网络之前必须加固系统。在本书中，我们将向您展示如何逐步加固 Linux 系统，以便您遵循该政策。从非常基础的角度来说，安全策略是我们保护环境的规则。有多种类型的安全策略，包括：


    *   **公司安全策略** – 定义适用于整个公司的整体安全规则。

    *   **远程访问策略** – 定义从远程主机连接到公司网络的规则。

    *   **密码策略** – 定义创建、更改和维护强密码的规则。


    '
- fmt: "\n* **Anti-Virus Policy** – Defines rules for the implementation and maintenance\
    \ of an anti-virus program.\n* **Acceptable Use Policy** – Defines rules for the\
    \ acceptable use of corporate resources, such as Internet, e-mail, workstations,\
    \ network, etc.\n\nSamples of these policies can be found at [http://www.sans.org/newlook/resources/policies/policies.htm](http://www.sans.org/newlook/resources/policies/policies.htm)\n\
    \nYour company may already have many of these policies implemented. If you are\
    \ involved in writing security policies, there are some guidelines you should\
    \ remember.\n\n* **Security Policies should answer the Who, What, When, Where\
    \ and Why of your objective.**\n  Some elements of a security policy that help\
    \ achieve this include a purpose, background, scope, action and responsibility.\
    \ Guidelines, Standards and Procedure documents answer the question of `how` the\
    \ policy will be implemented.\n\n* **Security Policies should be clear and concise.**\n\
    \  Security Policies are useless if they cannot be understood or contain the same\
    \ number of pages as *War and Peace*.\n\n* **Security Policies should be enforceable.**\n\
    \  If your Senior Management will not follow the policy, you cannot expect the\
    \ rest of your employees to. A classic example of this is an e-mail policy that\
    \ forbids sending personal e-mail from work. The first time your CEO sends an\
    \ e-mail to his wife, your policy became unenforceable.\n\n## 1.2 DEFENSE-IN-DEPTH\n\
    \nIn today's world, it is very rare to find instances of a single layer of protection.\
    \ Homes have door and window locks, deadbolts, an alarm system, and fences around\
    \ the yards. Cars have door locks, an alarm system that, in most cases, makes\
    \ a loud noise and kills the ignition, and a steering wheel lock of some kind.\
    \ In Information Security, this layered approach is commonly referred to as Defense-In-Depth.\n\
    \nDue to the large variety of attacks present today, Defense-In-Depth is necessary\
    \ to properly secure systems. Some of the elements of Defense-In-Depth include:\n\
    \n* **BIOS Passwords** – This prevents an unauthorized individual from booting\
    \ a system.\n* **Physical Security** – An unauthorized individual should not be\
    \ given physical access to the system(s). If they can remove the system from the\
    \ building, they can put the hard drive(s) in a system they control.\n* **Chassis\
    \ Locks** – This prevents an unauthorized individual from gaining access to the\
    \ internals of a system.\n* **Firewalls** – This protects the system by only allowing\
    \ access to those protocols we have defined in our security policies.\n* **Intrusion\
    \ Detection** – This protects the system by watching for and alerting on known\
    \ vulnerabilities.\n* **File Integrity Software (Tripwire)** – This protects the\
    \ system by comparing the signature of critical files to a database of known good\
    \ signatures.\n* **Logging** – This protects the system by recording identified\
    \ critical events.\n* **Baseline and Auditing** – This protects the system by\
    \ taking a snapshot of the system before it goes on the network and comparing\
    \ that snapshot to snapshots taken at a regular interval.\n\n## 1.3 PASSWORD PROTECTION\n\
    \nPassword protection is probably the most difficult security measure to enforce.\
    \ It seems that no matter how many password restrictions we impose, the user community\
    \ can find ways to undermine them. Users will try everything from writing down\
    \ passwords to selecting one password, adding a number to the end and incrementing\
    \ that number each time they are required to change their password. As security\
    \ administrators there are some things we can do to help users understand the\
    \ importance of password protection.\n\n* **Security Awareness Programs** – Having\
    \ a security awareness program will help users understand why we need security,\
    \ and the implications of poor security management.\n* **Balancing Password Length\
    \ and Expiration** – Some companies require that the user change their password\
    \ every month and have a 14-character password, while other companies require\
    \ a five-character password while never requiring the user to change it. The first\
    \ option is acceptable to the security professional, while the second option is\
    \ usually what the user would like. If you want your users to practice good password\
    \ management principles, you need to strike a balance between password length\
    \ and expiration. In order to have the users remember a longer password, the expiration\
    \ period may be extended. On the other hand, if the policy allows shorter passwords,\
    \ more frequent password changes should be required.\n\n## 1.4 DATA STEWARDSHIP\n\
    \nData Stewardship deals with the classification and ownership of data. The data\
    \ classification process usually starts with a risk analysis to determine which\
    \ data are the most critical. The risk analysis is usually performed using the\
    \ Threat/Vulnerability/Impact trifecta. Threat is the action taken against a system.\
    \ Vulnerability is the weakness in a system that allows the Threat to occur. Impact\
    \ is the expected loss should that Threat be realized. By determining which systems\
    \ are the most vulnerable to threats and will cause the greatest impact to the\
    \ company, a classification scheme can then be implemented to identify the most\
    \ critical systems and data. The granularity of the classification scheme used\
    \ is dependent on the type of organization and the data that it has. Government\
    \ and financial institutions have a very granular classification scheme that may\
    \ include as many as five to seven classification categories. Most organizations\
    \ do not need that granularity and will typically only have two or three categories,\
    \ which may include:\n\n* **Public** – If the confidentiality, integrity or availability\
    \ of this data were to be compromised, the impact to the company would be minimal\
    \ or non-existent.\n* **Internal-Use Only** – If the confidentiality, integrity\
    \ or availability of this data were to be compromised, the impact to the company\
    \ would be significant.\n* **Confidential** – If the confidentiality, integrity\
    \ or availability of this data were to be compromised, the impact to the company\
    \ would be devastating.\n\nIn addition to properly classifying data, security\
    \ roles and responsibilities should also be clearly identified. The following\
    \ roles should be the minimum that are defined; however, other roles may exist\
    \ depending on the organization:\n\n* **Data Owner** – This individual is usually\
    \ a Senior Manager or Executive. This is the individual who is ultimately responsible\
    \ for the data and should be the one to make the final decisions regarding classification,\
    \ access control and management of the data.\n* **Data Guardian/Custodian** –\
    \ This individual is usually assigned by the Data Owner and is responsible for\
    \ the day to management of the data. This includes backing up the data, restoring\
    \ the data, and maintaining the data in accordance with the policies implemented\
    \ by the data owner.\n* **Data User** – This is the individual who uses the data\
    \ as part of his regular duties and processes.\n\n## 1.5 PATCHING/GRADES\n\nThanks\
    \ to exploits like Code Red and Nimda, patching has become an obsession. Although\
    \ patching is a necessary evil, it can be overdone. Some of the guidelines to\
    \ remember when applying patches:\n\n* **Review each patch for relevance** – If\
    \ you are not running a service or application on your server, there is no need\
    \ to apply a patch for that service or application.\n* **Read the Release Notes**\
    \ – It is understood that, as a rule, instructions are an annoyance. However when\
    \ it comes to release notes, you need to read them to understand what the patch\
    \ is going to do and how it is going to apply to your environment.\n* **Always\
    \ apply patches in a test environment first** – Unless you need practice in resume\
    \ writing, it is a good practice to test your patches before you apply them to\
    \ your production environment. The last thing you need is to apply a patch to\
    \ a critical web server and bring the whole e-commerce site down.\n"
