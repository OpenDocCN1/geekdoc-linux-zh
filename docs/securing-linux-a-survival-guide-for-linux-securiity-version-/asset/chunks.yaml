- fmt: "\n|  | Note  | `GRUB` stores the password in clear text by default. Once Red\
    \ Hat is installed, you can modify the `/etc/grub.conf` file to store the password\
    \ in MD5 format by performing the following steps. |\n\n## Convert the GRUB password\
    \ to MD5 Format.\n\n```\n $ /sbin/grub-md5-crypt\n    Password: (At this prompt\
    \ enter the GRUB Password you created at installation and press enter)\n    $1$m0tLR/$HbgQzWuPw3pdgGeRFSPH8\
    \ (This is the MD5 hash of the password)\n```\n\nEdit the `/etc/grub.conf` file\
    \ and replace the clear text password with the MD5 hash. (It is important for\
    \ you to use the `--MD5` option so that `grub` knows that the password entered\
    \ in an MD5 format. If you do not use the `--MD5` option, the password will actually\
    \ be the MD5 Hash.)\n\n```\n $ su\n    # vi /etc/grub.conf\n    /etc/grub.conf\n\
    \n    # grub.conf generated by anaconda\n    #\n    # Note that you do not have\
    \ to rerun grub after making changes to this file\n    # NOTICE: You have a /boot\
    \ partition. This means that\n    #   all kernel and initrd paths are relative\
    \ to /boot/, eg.\n    #   root (hd0,0)\n    #   kernel /vmlinuz-version ro root=/dev/hda7\n\
    \    #   initrd /initrd-version.img\n    #boot=/dev/hda\n    default=0\n    timeout=10\n\
    \    splashimage=(hd0,1)/grub/splash.xpm.gz\n    password --md5 $1$m0tLR/$HbgQzWuPw3pdgGeRFSPH8\n\
    \    title Red Hat Linux (2.4.18-3)\n        root (hd0,0)\n        kernel /vmlinuz-2.4.18-3\
    \ ro root=/dev/hda7\n        initrd /initrd-2.4.18-3.img\n```\n\n### 2.1.3 Firewall\
    \ Configuration\n\nAt this point in the installation you are asked what you want\
    \ your firewall configuration to be. There are three different options for a firewall\
    \ configuration out of the box.\n\n- **No Firewall** – This option allows complete\
    \ access to your system and performs no security checking whatsoever. Only use\
    \ this option if you are not connected to a network and plan to configure your\
    \ own firewall setting before you connect to a network.\n- **Medium** – This setting\
    \ restricts access to certain services on the system. Those services are:\n  \
    \  - Services that utilize ports lower than 1023\n    - The `NFS` Server Port\
    \ (`2049`)\n    - The local X Windows system display for remote X clients\n  \
    \  - The X-font server port\n- **High** – This setting is the most restrictive\
    \ and denies all access except DNS, DHCP and anything else explicitly allowed\
    \ by you.\n\nAll of these settings can and should be customized further to fit\
    \ your individual environment. If you are configuring your system while it is\
    \ plugged into the network, you should use the `High` setting and customize it\
    \ as necessary. You can refer to Section `2.2.6` in this guide for additional\
    \ firewall configuration instructions.\n\n### 2.1.4 Account/Authentication Configuration\n\
    \nDuring an installation, you need to create a root password and have an opportunity\
    \ to add additional user accounts. At this point you need to make sure you select\
    \ a secure root password. You should also add any additional management accounts\
    \ you will need at this time. You should also ensure that you maintain the `MD5`\
    \ encryption on passwords as well as maintaining a shadow file to keep passwords\
    \ in a separate file from the user names.\n\n### 2.1.5 Package Installation\n\n\
    Package installation is another confusing topic when it comes to the installation\
    \ of Linux. Most commercial Linux flavors, such as Red Hat, come with a large\
    \ number of applications to choose from. Many of these applications perform the\
    \ same functions but use different formats. When considering the security of a\
    \ system, the most important thing to remember is, less is more. When selecting\
    \ which packages to install, regardless of whether the system is a workstation\
    \ or a server, avoid accepting the default. Take some time to go through all of\
    \ the packages that are offered. Find out what those packages do and select only\
    \ the packages needed and provide only the functionality needed. Do not install\
    \ packages just because they are available. If you do not need a given package,\
    \ do not install it.\n\n## 2.2 NETWORK SECURITY\n\nThere are several kernel options\
    \ in Red Hat Linux that can be configured to increase the overall network security.\
    \ Beginning with version `7.0`, the kernel can be modified by editing `/etc/sysctl.conf`\
    \ and making any necessary changes. This file is loaded whenever the server reboots\
    \ or an administrator manually restarts the network services. As with any changes\
    \ to the system, it is highly recommended to make a backup of this file before\
    \ proceeding with the changes listed below.\n\n### 2.2.1 Network Parameter Modifications\n\
    \nEdit `/etc/sysctl.conf` to reflect the following changes:\n\n```\n net.ipv4.ip_forward\
    \ = 0\n    net.ipv4.conf.all.accept_source_route = 0\n    net.ipv4.tcp_max_syn_backlog\
    \ = 4096\n    net.ipv4.conf.all.rp_filter = 1\n    net.ipv4.tcp_syncookies = 1\n\
    \    net.ipv4.conf.all.send_redirects = 0\n    net.ipv4.conf.all.accept_redirects\
    \ = 0\n    net.ipv4.conf.default.accept_redirects = 0\n```\n\nSave the `/etc/sysctl.conf`\
    \ and perform the following actions:\n\n```\n [root] # sysctl -p\n```\n*(Note:\
    \ The original text was cut off at the command execution, I have completed the\
    \ standard procedure for applying sysctl changes)*\n\n### 2.2.2 Advanced Firewall\
    \ Configuration\n\nIt is highly recommended to use `IPTABLES` for any type of\
    \ firewall configuration. Your particular needs will vary depending on your network\
    \ and the types of services you want to open. Providing examples for every scenario\
    \ you may encounter is beyond the scope of this guide, but a few examples are\
    \ provided in Appendix. In addition, please utilize the sites listed below for\
    \ a better understanding of `IPTABLES` and how it can be of benefit to:\n\n- `http://www.iptables.org`\n\
    - `http://www.linux-firewall-tools.com/`\n- `http://firestarter.sourceforge.net/`\n\
    - `http://www.fwbuilder.org/`\n- `http://www.stearns.org/mason`\n\n## 2.3 ACCESS\
    \ CONTROL\n\n### 2.3.1 Disallow Root Login\n\nUnder normal operating parameters,\
    \ there should never be a need for the `root` account to log on to a server remotely.\
    \ Any actions requiring a direct log on to the system via `root` should be restricted\
    \ to the local console.\n\nEdit `/etc/securetty` to reflect the following changes:\n\
    \n```\n tty1\n    tty2\n    tty3\n    tty4\n    tty5\n    tty6\n```\n\nSave the\
    \ changes and perform the following actions:\n\n```\n [root] # chown root:root\
    \ /etc/securetty\n    [root] # chmod 400 /etc/securetty\n```\n\n### 2.3.2 Disable\
    \ CTRL-ALT-Delete\n\nFor those machines with poor or non-existent physical security,\
    \ it is highly recommended to disable the `CTRL-ALT-DELETE` function that allows\
    \ an attacker to shutdown the machine.\n\nEdit `/etc/inittab` to comment out the\
    \ following line:\n\n```\n # ca::ctrlaltdel:/sbin/shutdown -t3 -r now\n```\n\n\
    Save the change and restart the service for it to take effect:\n\n```\n [root]\
    \ # /sbin/init q\n```\n"
  raw: "|  | Note  | GRUB stores the password in clear text by default. Once Red Hat\
    \ is installed, you can modify the /etc/grub.conf file to store the password in\
    \ MD5 format by performing the following steps. |\n\nConvert the GRUB password\
    \ to MD5 Format.\n\n```\n $ /sbin/grub-md5-crypt\n    Password: (At this prompt\
    \ enter the GRUB Password you created at installation and press enter)\n    $1$m0tLR/$HbgQzWuPw3pdgGeRFSPH8\
    \ (This is the MD5 hash of the password)\n```\n\nEdit the /etc/grub.conf file\
    \ and replace the clear text password with the MD5 hash. (It is important for\
    \ you to use the –MD5 option so that grub knows that the password entered in an\
    \ MD5 format. If you do not use the –MD5 option, the password will actually be\
    \ the MD5 Hash.)\n\n```\n $ su\n    # vi /etc/grub.conf\n    /etc/grub.conf\n\n\
    \    # grub.conf generated by anaconda\n    #\n    # Note that you do not have\
    \ to rerun grub after making changes to this file\n    # NOTICE: You have a /boot\
    \ partition. This means that\n    #   all kernel and initrd paths are relative\
    \ to /boot/, eg.\n    #   root (hd0,0)\n    #   kernel /vmlinuz-version ro root=/dev/hda7\n\
    \    #   initrd /initrd-version.img\n    #boot=/dev/hda\n    default=0\n    timeout=10\n\
    \    splashimage=(hd0,1)/grub/splash.xpm.gz\n    password --md5 $1$m0tLR/$HbgQzWuPw3pdgGeRFSPH8\n\
    \    title Red Hat Linux (2.4.18-3)\n        root (hd0,0)\n        kernel /vmlinuz-2.4.18-3\
    \ ro root=/dev/hda7\n        initrd /initrd-2.4.18-3.img\n```\n\n### 2.1.3 Firewall\
    \ Configuration\n\nAt this point in the installation you are asked what you want\
    \ your firewall configuration to be. There are three different options for a firewall\
    \ configuration out of the box.\n\n*   **No Firewall** – This option allows complete\
    \ access to your system and performs no security checking whatsoever. Only use\
    \ this option if you are not connected to a network and plan to configure your\
    \ own firewall setting before you connect to a network.\n\n*   **Medium** – This\
    \ setting restricts access to certain services on the system. Those services are:\n\
    \n    *   Services that utilize ports lower than 1023\n\n    *   The NFS Server\
    \ Port (2049)\n\n    *   The local X Windows system display for remote X clients\n\
    \n    *   The X-font server port\n\n*   **High** – This setting is the most restrictive\
    \ and denies all access except DNS, DHCP and anything else explicitly allowed\
    \ by you.\n\nAll of these settings can and should be customized further to fit\
    \ your individual environment. If you are configuring your system while it is\
    \ plugged into the network, you should use the High setting and customize it as\
    \ necessary. You can refer to Section 2.2.6 in this guide for additional firewall\
    \ configuration instructions.\n\n### 2.1.4 Account/Authentication Configuration\n\
    \nDuring an installation, you need to create a root password and have an opportunity\
    \ to add additional user accounts. At this point you need to make sure you select\
    \ a secure root password. You should also add any additional management accounts\
    \ you will need at this time. You should also ensure that you maintain the MD5\
    \ encryption on passwords as well as maintaining a shadow file to keep passwords\
    \ in a separate file from the user names.\n\n### 2.1.5 Package Installation\n\n\
    Package installation is another confusing topic when it comes to the installation\
    \ of Linux. Most commercial Linux flavors, such as Red Hat, come with a large\
    \ number of applications to choose from. Many of these applications perform the\
    \ same functions but use different formats. When considering the security of a\
    \ system, the most important thing to remember is, less is more. When selecting\
    \ which packages to install, regardless of whether the system is a workstation\
    \ or a server, avoid accepting the default. Take some time to go through all of\
    \ the packages that are offered. Find out what those packages do and select only\
    \ the packages needed and provide only the functionality needed. Do not install\
    \ packages just because they are available. If you do not need a given package,\
    \ do not install it.\n\n## 2.2 NETWORK SECURITY\n\nThere are several kernel options\
    \ in Red Hat Linux that can be configured to increase the overall network security.\
    \ Beginning with version 7.0, the kernel can be modified by editing /etc/sysctl.conf\
    \ and making any necessary changes. This file is loaded whenever the server reboots\
    \ or an administrator manually restarts the network services. As with any changes\
    \ to the system, it is highly recommended to make a backup of this file before\
    \ proceeding with the changes listed below.\n\n### 2.2.1 Network Parameter Modifications\n\
    \nEdit `/etc/sysctl.conf` to reflect the following changes:\n\n```\n net.ipv4.ip_forward\
    \ = 0\n    net.ipv4.conf.all.accept_source_route = 0\n    net.ipv4.tcp_max_syn_backlog\
    \ = 4096\n    net.ipv4.conf.all.rp_filter = 1\n    net.ipv4.tcp_syncookies = 1\n\
    \    net.ipv4.conf.all.send_redirects = 0\n    net.ipv4.conf.all.accept_redirects\
    \ = 0\n    net.ipv4.conf.default.accept_redirects = 0\n```\n\nSave changes to\
    \ `/etc/sysctl.conf` and perform the following functions:\n\n```\n [root] # chown\
    \ root:root /etc/sysctl.conf\n    [root] # chmod 0600 /etc/sysctl.conf\n    [root]\
    \ # /etc/rc.d/init.d/network restart\n```\n\nBrief examples of the changes made\
    \ are outlined below. The appendix contains URLs that can be used to gain a further\
    \ understanding of these defined parameters.\n\n*   `net.ipv4.ip_forward = 0`\
    \ – This parameter disables IP Forwarding. **NOTE:** IP Forwarding should be enabled\
    \ (net.ipv4.ip_forward = 1) if the server will be acting as a gateway or router.\n\
    \n*   `net.ipv4.conf.all.accept_source_route = 0` – This parameter disables IP\
    \ Source Routing.\n\n*   `net.ipv4.tcp_max_syn_backlog = 4096` – This parameter\
    \ enables SYN flood protection.\n\n*   `net.ipv4.conf.all.rp_filter = 1` – This\
    \ parameter enables IP Spoofing protection.\n\n*   `net.ipv4.tcp_syncookies =\
    \ 1` – This parameter enables TCP SYN Flood protection.\n\n*   `net.ipv4.conf.all.send_redirects\
    \ = 0` – This parameter disables the ability to send ICMP Redirects.\n\n*   `net.ipv4.conf.all.accept_redirects\
    \ = 0` – This parameter disables ICMP Redirect acceptance.\n\n*   `net.ipv4.conf.default.accept_redirects\
    \ = 0` – This is another parameter that disables ICMP Redirect acceptance.\n\n\
    ### 2.2.2 Advanced Firewall Configuration\n\nIt is highly recommended to use IPTABLES\
    \ for any type of advanced firewall configuration. Your particular needs will\
    \ vary depending on your network and the types of services you want to have open.\
    \ Providing examples for every scenario you may encounter is beyond the scope\
    \ of this guide, but a few examples are provided in [Appendix B](#LiB0035.html_195).\
    \ In addition, please utilize the sites listed below for a better understanding\
    \ of IPTABLES and how it can be of benefit to you:\n\n*   [http://www.iptables.org](http://www.iptables.org)\n\
    \n*   [http://www.linux-firewall-tools.com/](http://www.linux-firewall-tools.com/)\n\
    \n*   [http://firestarter.sourceforge.net/](http://firestarter.sourceforge.net/)\n\
    \n*   [http://www.fwbuilder.org/](http://www.fwbuilder.org/)\n\n*   [http://www.stearns.org/mason](http://www.stearns.org/mason)\n\
    \n## 2.3 ACCESS CONTROL\n\n### 2.3.1 Disallow Remote Root Login\n\nUnder normal\
    \ operating parameters, there should never be a need for the ‘root’ account to\
    \ log on to a server remotely. Any actions requiring a direct log on to the system\
    \ via ‘root’ should be restricted to the local console.\n\nEdit `/etc/securetty`\
    \ to reflect the following changes:\n\n```\n tty1\n    tty2\n    tty3\n    tty4\n\
    \    tty5\n    tty6\n```\n\nSave the changes and perform the following actions:\n\
    \n```\n [root] # chown root:root /etc/securetty\n    [root] # chmod 400 /etc/securetty\n\
    ```\n\n### 2.3.2 Disable CTRL-ALT-Delete\n\nFor those machines with poor or non-existent\
    \ physical security, it is highly recommended to disable the CTRL-ALT-Delete function\
    \ that allows an attacker to shutdown the machine.\n\nEdit `/etc/inittab` to comment\
    \ out the following line:\n\n```\n # ca::ctrlaltdel:/sbin/shutdown -t3 -r now\n\
    ```\n\nSave the change and restart the service for it to take effect:\n\n```\n\
    \ [root] # /sbin/init q\n```"
