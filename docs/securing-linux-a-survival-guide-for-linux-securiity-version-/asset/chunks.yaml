    \    ```\n\n**On the Client**\n\nOne extra piece of security checking to be performed:\
    \ the client should mount the filesystem as an untrusted volume. This means mounting\
    \ it without SUID files (nosuid), without devices (nodev) and preferably without\
    \ executables, to prevent the server from being granted additional privileges\
    \ on the client. The first two options are particularly important: without them,\
    \ an attacker with access to the NFS server could insert a SUID shell or compromised\
    \ device into the shared filesystem and be automatically granted privileges on\
    \ the other filesystems. Although we've enabled root squashing, remember that\
    \ there is no squashing for users such as bin or daemon, which are potentially\
    \ just as dangerous to the client as root access!\n\n1.  Ensure the portmapper\
    \ is running\n\n    ```\n     /etc/init.d/portmap start\n    ```\n\n2.  Test connectivity\
    \ by mounting the remote filesystem from the server at 10.1.1.50\n\n    ```\n\
    \     /bin/mount -t nfs 10.1.1.50:/home /home\n    ```\n\n3.  Configure /etc/fstab\
    \ to mount the filesystem automatically\n\n    ```\n     /etc/fstab:\n       \
    \  10.1.1.50:/home /home nfs nosuid,nodev,noexec 0 0\n    ```\n\n### 3.3.3 SAMBA\
    \ Security (http://www.samba.org/)\n\nAs much as many Unix administrators revile\
    \ it, Microsoft's Windows family of operating systems are a fact of modern life\
    \ at most companies. Fortunately, the interoperability of Unix and Windows hosts\
    \ is alive and well, thanks both to considerable hard work from open standards\
    \ bodies such as the IETF, and thanks to programs like Samba. Samba, in the words\
    \ of its creators, \"is an Open Source/Free Software suite that provides seamless\
    \ file and print services to SMB/CIFS clients.\" ([http://us2.samba.org/samba/samba.html](http://us2.samba.org/samba/samba.html)).\n\
    \nSMB/CIFS is a standard developed by Microsoft to offer shared file and print\
    \ services; thanks to the hard work of the Samba development team, Unix hosts\
    \ can join in the CIFS fun as clients and as servers, even to the point of masquerading\
    \ as Windows NT Domain Servers for an entire network of Windows hosts, none of\
    \ whom will notice the difference.\n\nThis section eschews a general configuration\
    \ discussion of Samba, and focuses on securing Samba on Red Hat Linux 7.3, using\
    \ the supplied Red Hat packages. We will configure Samba as a server to share\
    \ files and printers securely, and as a client.\n\n#### 3.3.3.1 SAMBA Server\n\
    \nConfiguring Samba as a server is fairly simple, once you have the packages for\
    \ Samba installed. First, decide what filesystems and/or printers you will share\
    \ to other hosts. Then follow these instructions. For this example, we'll configure\
    \ a server that will share out user home directories and its printers for its\
    \ local users. The server will live at IP 192.168.1.20, and will permit IPs in\
    \ the 192.168.1 network to mount its shares. To increase the security of this\
    \ configuration, the server will not be part of a domain, but will instead use\
    \ a local password file for users, who will not be granted command-line access\
    \ to the server.\n\n1.  Install the Samba packages\n\n    ```\n     rpm -ivh samba-2.2.3a-6.i386.rpm\n\
    \            rpm -ivh samba-common-2.2.3a-6.i386.rpm\n    ```"
