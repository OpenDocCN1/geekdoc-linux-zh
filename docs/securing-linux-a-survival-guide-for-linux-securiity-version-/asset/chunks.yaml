    \ chmod 700 ~/.ssh\n        [user@host user]$ cd ~/.ssh\n        [user@host .ssh]$\
    \ mv ../id_dsa.pub ./authorized_keys2\n        [user@host .ssh]$ chmod 600 authorized_keys2\n\
    ```\n\n这样就完成了！如果你为加密 `DSA` 密钥对输入了短密码，那么在连接到远程主机时你需要在客户端输入它（这更安全，因为短密码不会通过网络传输）。对于自动化连接，你可以在生成过程中在提示输入加密密钥对的短密码时按\
