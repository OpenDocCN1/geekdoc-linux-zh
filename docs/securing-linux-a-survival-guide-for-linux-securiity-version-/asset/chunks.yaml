    \ procedures periodically** – Testing restore procedures periodically will help\
    \ eliminate surprises. You don't want to find out in the middle of a critical\
    \ restore that you forgot something and have to start all over again.\n\n## 1.7\
    \ BASELINES AND CONTROL AUDITS\n\nOne of SANS' mantras is \"How can you properly\
