    - **Reaudit the system for unexpected changes** – When patches are applied, they
    can sometimes change system or configuration files back to the default settings.
    After applying patches to a system, the system should be reaudited against the
    last known good configuration for any unexpected changes.


    ## 1.6 BACKUP/RECOVERY PLAN


    In the IT world, backup of systems is like brushing our teeth; we do it without
    even thinking about it. It has to be done so we do it. Because of the routine,
    we often do not consider the security implications around our backup procedures.
    Some security guidelines to remember:


    - **Secure backup tapes** – Backup tapes are often the only way to restore systems
    after an incident.

    - **Have a clearly documented backup plan** – Backup responsibilities usually
    lie with an operations center or with lower level IT people. Because these individuals
    rotate on a regular basis, it is necessary to have a clearly documented backup
    plan so that backup procedures are performed consistently.

    - **Clearly label backup tapes** – Clearly labeling backup tapes will prevent
    restoring a system with a tape that was not from that system.

    - **Store a copy of backup tapes offsite** – Offsite storage of backup tapes prevents
    against destruction by environmental disasters. It also helps to prevent against
    theft of backup tapes.

    - **Verify backup tapes** – Periodically run verifications against backup tapes
    to ensure that backup software is functioning properly and what you intended to
    backup was actually backed up.

    - **Test restore procedures periodically** – Testing restore procedures periodically
    will help eliminate surprises. You don''t want to find out in the middle of a
    critical restore that you forgot something and have to start all over again.


    ## 1.7 BASELINES AND CONTROL AUDITS


    One of SANS'' mantras is "How can you properly secure your systems if you don''t
    know what your systems are supposed to look like?" This is accomplished by establishing
    proper base-lining, change management and control audit procedures. Some guidelines
    to remember:


    - **Take baselines of systems before installing on network** – A system becomes
    a target as soon as it is connected on a network. By performing a baseline of
    the system before it is on the network, you ensure that the baseline you have
    performed is clean.

    - **Establish a documented, repeatable baseline procedure** – A baseline strategy
    cannot be effective if the same procedures are not used each time. This means
    that a baseline cannot be performed solely from memory. Checklists are an excellent
    form of documentation for a baseline procedure.

    - **Implement a controlled change management program** – By implementing a controlled
    change management program, you will be able to accurately record what changes
    were authorized for each system. With this historical record you will know exactly
    what should and should not change on your systems from the baseline.

    - **Perform control audits to protect against unauthorized changes** – Auditing
    systems on a regular basis performs two functions. First, it allows for the evaluation
    of the current system''s state to the baseline. This ensures that you always know
    what state the system is in. Auditing also allows for the tracking of all changes
    going through the change management program, and catching those changes that are
    not.


    ## 1.8 ACCOUNT MANAGEMENT


    Account Management is also a critical piece of the security puzzle. There have
    been many instances where terminated employees were able to access systems long
    after they have been terminated by a company. Some important guidelines to remember:


    - **Disable user accounts immediately after they leave the company.**

    - **Periodically review and monitor user lists and groups for unauthorized changes**
    – This task should be a part of the base-lining and control audit procedures referenced
    in [section 1.7](#LiB0009.html_15).

    - **Ensure that a user''s rights are adjusted when they change departments or
    responsibilities** – If you have a user that moves from an Application Development
    role to a Support role, you do not want that user to continue to have access rights
    to the source code repository.


    ## 1.9 PHYSICAL SECURITY


    Physical Security is just another step in the Defense-In-Depth methodology. Physical
    Security centers on protecting the system from physical and environmental threats.
    Some guidelines to remember:


    - **Set BIOS passwords** – This helps to ensure that only administrators can change
    the hardware configuration of a system

    - **Utilize cabinet locks** – Place critical systems in locked cabinets to protect
    them from unauthorized power down or unauthorized access to CD-ROM and floppy
    drives.

    - **Ensure that badge readers or security cameras monitor access to servers**
    – This will help track an event should you have a security incident where the
    physical security is breached.

    - **Educate mobile users on laptop security** – Teach mobile users how to utilize
    laptop locks. Also teach them proper transport techniques to use while traveling.


    # 2.0 Chapter 2: Securing Linux


    ## 2.1 INSTALLATION GUIDELINES


    ### 2.1.1 Partitioning


    Partitioning is probably the most widely discussed and debated topic when it comes
    to Linux configuration. There are many different opinions on how systems should
    be partitioned. Within Linux you can have many different partition types. The
    most popular of these types are:


    - `/boot` = Contains all files necessary for the boot process. This includes the
    kernel and any bootstrap files.

    - `/home` = Contains each individual users home directory

    - `/usr` = Contains those files which are shared across a system by multiple users

    - `/var` = Contains those files which are variable and dynamic by nature. This
    includes log files, spool files, scheduler files, and temporary files

    - `/` = Contains those files necessary for system management when no other partitions
    are available.

    - `/tmp` = Contains temporary files.

    - `swap` = Contains the paging file for memory management


    By default, Red Hat 7.3 partitions systems as follows:


    Table 2-1: Red Hat 7.3 Partitioning Defaults


    | Workstation | Server | Laptop | Custom |

    | --- | --- | --- | --- |

    | `swap = 2 X physical memory`, `/boot = 50 MB`, `/ = depends on disk space` |
    `swap = 2 X physical memory`, `/boot = 50 MB`, `/ = 384 MB`, `/var = 256 MB`,
    `/usr = depends on disk space`, `/home = depends on disk space` | `swap = 2 X
    physical memory`, `/boot = 50 MB`, `/ = depends on disk space` | `swap = 2 X physical
    memory`, `/boot = 50 MB`, `/ = depends on disk space` |


    Partitioning will mitigate one specific type of attack, denial of service. There
    are attacks designed to fill up a temp directory or a spool directory. If your
    system files are on the same partition as the directory under attack, your system
    could be rendered unusable. A good partitioning strategy is to partition off those
    directories are most likely to be filled up by an attacker. Typically this includes
    `/var` and `/home`. If you have a server being used for a specific purpose such
    as web, ftp, or e-mail, you may want to consider creating separate partitions
    for the application specific files as well.


    ### 2.1.2 GRUB/LILO


    GRUB is the boot-loader of choice in Red Hat 7.3. One of the many advantages that
    GRUB has is that it simplifies the dual-boot process between Windows and Linux.
    Refer to Appendix C for more information on securing GRUB in a dual boot environment.
    As with LILO, there are many different kernel level commands that can be passed
    to GRUB and you want to make sure that only authorized users are able to perform
    those commands. This is accomplished by password protecting GRUB. During installation
    you will be presented with the opportunity to password protect GRUB. When you
    create a password for GRUB, make sure you do not use the same password that you
    use for the root account.

