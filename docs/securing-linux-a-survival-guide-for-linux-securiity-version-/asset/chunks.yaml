    \ default_syslog; };\n     category general { default_syslog; };\n     category\
    \ security { audit_log; default_syslog; };\n     category config { default_syslog;\
    \ };\n     category resolver { audit_log; };\n     category xfer-in { audit_log;\
    \ };\n     category xfer-out { audit_log; };\n     category notify { audit_log;\
    \ };\n     category client { audit_log; };\n     category network { audit_log;\
    \ };\n     category update { audit_log; };\n     category queries { audit_log;\
    \ };\n     category lame-servers { audit_log; };\n    };\n\n    // Create the\
    \ access view for internal trusted networks\n    // Here, we're creating the first\
    \ of two \"views\" of the data on this server. This one\n    // will present different\
    \ information to internal clients than to external clients, a\n    // configuration\
    \ known colloquially as \"split-brain DNS\". ISC recommends splitting\n    //\
    \ this configuration up into a separate internal and external DNS server, but\
    \ not\n    // every organization can afford two machines for this. If that's the\
    \ case, this\n    // split configuration will come in handy. If you can afford\
    \ two machines, you can\n    // divide this configuration up and use this internal\
    \ view for your internal DNS server\n    // and the external view below for the\
    \ external.\n    view \"trusted-query\" in {\n     match-clients { trustednets;\
    \ };\n     // Remember that this server is not caching at all: that should be\
    \ the job of a\n     // separate machine in your organization, for security and\
    \ performance reasons,\n     // particularly if this machine is already doing\
    \ double duty presenting internal\n     // and external DNS information to both\
    \ sets of clients. If you need this machine\n     // to also cache DNS queries\
    \ and forward them on behalf of your clients, turn on\n     // the \"forwarders\"\
    \ option in the options{} block above, and set \"recursion\" and\n     // \"additional-from-cache\"\
    \ to \"yes\" below. Then activate the caching \"hint\" block\n     // below.\n\
    \     recursion no;\n     additional-from-auth yes;\n     additional-from-cache\
    \ no;\n\n       // Enable the cache --- disabled since this machine is not caching.\n\
    \       // zone \".\" in {\n             // type hint;\n             // file \"\
    named.cache\";\n       // };\n\n       // Permit queries for the localhost network,\
    \ for which\n       // every server must be a master\n       zone \"0.0.127.in-addr.arpa\"\
    \ in {\n            type master;\n            file \"local/reverse.127.0.0\";\n\
    \            allow-query { any; };\n            allow-transfer { none; };\n  \
    \     };\n\n       // Send internal-only data to trusted internal networks\n \
    \      zone \"example.com\" in {\n            type master;\n            file \"\
    master/example.com_internal\";\n       };\n\n       // Don't forget reverse records\n\
    \       zone \"5.3.1.in-addr.arpa\" in {\n            type master;\n         \
    \   file \"master/reverse.1.3.5\";\n       };\n\n    };\n\n    view \"external-query\"\
    \ in {\n     match-clients { any; };\n     recursion no;\n     additional-from-auth\
    \ no;\n     additional-from-cache no;\n       // Enable the cache\n       zone\
    \ \".\" in {\n             type hint;\n             file \"named.cache\";\n  \
    \     };\n\n       // Permit queries for the localhost network, for which\n  \
    \     // every server must be a master\n       zone \"0.0.127.in-addr.arpa\" in\
    \ {\n             type master;\n             file \"local/reverse.127.0.0\";\n\
    \             allow-query { any; };\n             allow-transfer { none; };\n\
    \       };\n\n       // Send external data only\n       zone \"mydomain.com\"\
    \ in {\n             type master;\n             file \"master/mydomain.com_external\"\
    ;\n             allow-query { any; };\n       };\n\n       // Send reverse records\
    \ for external subnet\n       zone \"6.4.2.in-addr.arpa\" in {\n             type\
    \ master;\n             file \"master/reverse.2.4.6\";\n             allow-query\
    \ { any; };\n       };\n    };\n\n    view \"attempt-chaos\" chaos {\n       match-clients\
    \ { any; };\n       recursion no;\n       zone \".\" {\n            type hint;\n\
    \            file \"/dev/null\";\n       };\n\n       zone \"bind\" {\n      \
    \      type master;\n            file \"local/chaos\";\n            allow-query\
    \ { none; };\n            allow-transfer { none; };\n       };\n    };\n```\n\n\
    #### 3.4.2.4 Check Configuration Files for Syntax Errors\n\nBIND provides us with\
    \ a pair of tools that will permit us to check our configuration files for validity\
    \ before deploying them: this ensures that no one has left out a stray }: anywhere.\
    \ First, check the main configuration file for errors using `named-checkconf`.\
    \ We'll have to specify the chroot directory(`-t /usr/local/bind` ) and the name\
    \ of the configuration file as it's seen once the server is chrooted (`/etc/named.conf`\
    \ ):\n\n```\n /usr/local/bind/sbin/named-checkconf -t /usr/local/bind /etc/named.conf\n\
    ```\n\nNow check each of the zone files, using the following syntax:\n\n```\n\
    \ /usr/local/bind/sbin/named-checkzone 0.0.127.in-addr.arpa /usr/local/bind/named/local/\n\
    ```\n\nYou should see in response:\n\n```\n zone 0.0.127.in-addr.arpa/IN: loaded\
    \ serial 42\n    OK\n```\n\nNote that the serial number will vary according to\
    \ what's in the zone file. Repeat this process for each of the other zone files\
    \ you've created.\n\nFinally, check the chaos zone we're using, if you've opted\
    \ to use it:\n\n```\n /usr/local/bind/sbin/named-checkzone -c chaos bind /usr/local/bind/named/local/chaos\n\
    ```\n\nYou should see in response:\n\n```\n zone bind/CH: loaded serial 42\n \
    \   OK\n```\n\n#### 3.4.2.5 Start Daemon with Chroot Manually and Test Lookups\n\
    \nTest that everything is working by manually loading the server and testing to\
    \ ensure you can look up records. You may need to connect your system to the network\
    \ at this point if you want to verify that you can look up actual Internet records.\n\
    \n```\n /usr/local/bind/sbin/named -u dns -t /usr/local/bind -c /etc/named.conf\n\
    ```"
