    \ on ftpserver.mydomain.com.\n    221 Goodbye.\n```\n\n#### 3.3.1.2 Anonymous\
    \ File Serving\n\nTo enable an anonymous FTP server, we only require a little\
    \ further tweaking of the configuration file, and the careful creation of an FTP\
    \ server root directory. Anonymous FTP servers should be handled like live snakes:\
    \ treat them carefully, don't trust them fully, and keep them as far away from\
    \ sensitive areas as possible! Thankfully, the combination of a good default ftpaccess\
    \ file and the ease of configuring this latest WUFTPd means that anonymous FTP\
    \ services can be configured with a minimum of heartburn.\n\nFirst, we'll need\
    \ to add some information to `/etc/ftpaccess`, in addition to the changes made\
    \ above. Both sets of changes have been presented below, for simplicity's sake,\
    \ but be careful to enter all of these changes to keep things nice and secure.\n\
    \n```\n /etc/ftpaccess\n```\n\n*   Don't allow system accounts to login over FTP.\n\
    \n    ```\n     deny-uid %-99 %65534-\n            deny-gid %-99 %65534-\n   \
    \ ```\n\n*   Chroot all users by default\n\n    ```\n     guestuser *\n    ```\n\
    \n*   List any users you wish to grant \"real\" privileges to (i.e. that should\
    \ not be chrooted) here\n\n    ```\n     realuser <ftp administrators, etc.>\n\
    \    ```\n\n*   We don't need an explicit chroot group: all users will be chrooted!\n\
    \n    ```\n     # guestgroup ftpchroot\n    ```\n\n*   Set your email address\n\
    \n    ```\n     email ftpadmin@ftpserver.mydomain.com\n    ```\n\n*   Permit only\
    \ 2 failed logins before terminating the session\n\n    ```\n     loginfails 2\n\
    \    ```\n\n*   Set the welcome message to something we can control and eliminate\
    \ from directory listings\n\n    ```\n     message /.ftpwelcome.msg        login\n\
    \    ```\n\n*   Do not allow on-the-fly tarring and compressing\n\n    ```\n \
    \    compress   no    all\n    tar        no    all\n    ```\n\n*   Prevent certain\
    \ actions by anonymous and/or guest users. Explicitly list permissions for everyone.\n\
    \n    ```\n     chmod      no    guest,anonymous\n            delete     no  \
    \  anonymous\n            overwrite  no    anonymous\n            rename     no\
    \    anonymous\n            umask      no    real,guest,anonymous\n          \
    \  delete     yes   real,guest\n            overwrite  yes   real,guest\n    \
    \        rename     yes   real,guest\n    ```\n\n*   Log commands and transfers\
    \ to and from the server (this will not log passwords unless the user types one\
    \ as a command by mistake).\n\n    ```\n     log commands real,anonymous,guest\n\
    \            log transfers anonymous,guest,real inbound,outbound\n    ```\n\n\
    *   Mark certain files as non-retrievable\n\n    ```\n     noretrieve .notar\n\
    \    noretrieve .ftpwelcome.msg\n    ```\n\n*   Set up permissions for anonymous\
    \ users within their file structure. Anonymous users may not upload files anywhere\
    \ except specifically-configured areas.\n\n    ```\n     upload /usr/local/ftp\
    \ * no\n    ```"
