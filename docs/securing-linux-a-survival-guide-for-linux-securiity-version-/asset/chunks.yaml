  trans: "\n\n在尝试从 NFS 服务器进行任何类型的文件共享之前，先采取一些基本步骤来保护服务器配置是一个好主意。NFS 的一个主要问题是它对基于 RPC\
    \ 依赖：RPC 服务并不是被分配到固定端口，而是在由 RPC portmapper 守护进程启动时，随机（或半随机，在某些情况下完全不随机）分配一个端口。想要连接到这些服务的客户端首先会联系\
    \ portmapper 守护进程，询问所需的服务被分配到了哪个端口。除其他因素外，这给防火墙造成了混乱，因为防火墙依赖于服务反复被分配到特定端口，这可能使防火墙\
    \ NFS 服务变得非常困难。\n\n幸运的是，Red Hat 的 NFS 实现通过使用一些周全的配置选项大大减少了这种困扰：通过以下快速更改，我们可以让\
    \ NFS 尽可能对防火墙友好。\n\n### 3.3.2.1.1 Portmapper\n\n首先，我们需要配置 `portmapper` 守护进程。它总是被分配到相同的端口（`TCP`\
    \ 和 `UDP` `111`），所以我们不需要担心修复它，但我们确实需要限制对它的访问。由于这将成为服务器上 NFS 服务的网关，我们需要仔细控制向谁授予访问权限。默认情况下，Red\
    \ Hat Linux 上的 `portmapper` 守护进程编译时带有对 Wietse Venema 的 TCP wrappers 支持，这允许我们使用一对配置文件来控制对它的访问。在\
    \ `/etc/hosts.deny` 中，我们首先为 `portmapper` 设置一个默认拒绝策略：\n\n```\n /etc/hosts.deny\n\
    \    portmap: ALL\n```\n\n现在我们将配置 `/etc/hosts.allow` 以允许来自信任的内部机器访问 `portmapper`。向此文件添加\
    \ IP 地址以允许 NFS 客户端访问 `portmapper`，尽可能仔细列出特定的 IP 而不是子网。下面，我们只向 IP 地址为 `10.1.2.3`\
    \ 的 NFS 客户端授予了访问。\n\n```\n /etc/hosts.allow\n    portmap: 10.1.2.3\n```\n\n###\
    \ 3.3.2.1.2 mountd\n\n挂载守护进程（mountd`）实际上实现了 NFS 挂载请求：当客户端想要通过 NFS 挂载文件系统时，它会向\
    \ `mountd` 发送 `MOUNT` 请求以启动过程，`mountd` 会根据导出的文件系统列表验证请求，如果请求通过，则返回文件系统的句柄。\n\n\
    `mountd` 是一个 RPC 服务，所以首要任务是锁定它将被分配的端口。为了预见到这一需求，Red Hat 配置了一种简单的方法来实现此，即通过将信息添加到配置文件中，而不是手动编辑该服务的启动文件。首先，为挂载守护进程选择一个端口：它可以是任何大于\
    \ 1024 的端口号，大多数情况下默认选择是 2050。一旦你选择了端口，如下所示编辑 `/etc/sysconfig/network`（我们使用 2050\
    \ 作为示例）：\n\n```\n /etc/sysconfig/network\n    MOUNTD_PORT=2050\n```\n\n在 Red Hat\
    \ Linux 上，`mountd` 也编译了对 TCP wrappers 支持，因此可以通过仅允许来自选择客户端的访问为该服务提供额外的安全性。这防止了一种\
    \ NFS 问题：如果客户端能够弄出 `mountd` 运行在哪个端口，就可以直接向 `mountd` 发送请求来绕过 portmapper 的限制并挂载文件系统。要实现这一点，再次编辑\
    \ `/etc/hosts.deny` 和 `/etc/hosts.allow` 并在末尾添加以下行（作为示例，我们再次仅向 IP 地址为 10.1.2.3\
    \ 的 NFS 客户端授予了访问）：\n\n```\n /etc/hosts.deny\n    mountd: ALL\n    /etc/hosts.allow\n\
    \    mountd: 10.1.2.3\n```\n\n### 3.3.2.1.3 nfsd\n\nNFS 守护进程（`nfsd`）是一种中介，在用户态空间和实际上在\
    \ Linux 下实现 NFS 的内核模块（`nfsd.o`）之间往回传递信息。与 `mountd` 一，`nfsd` 是一个 RPC 服务，所以它没有固定端口；与\
    \ `mountd` 不同的是，它没有编译 TCP wrappers 支持，在系统配置文件中也没有方便的快捷方式来预选端口。然而，我们可以通过手动编辑启动脚本（`/etc/init.d/nfs`）并添加以下信息来预选它的端口：\n\
    \n```\n /etc/init.d/nfs\n```\n\n找到此块：\n\n```\n echo -n $\"Starting NFS daemon:\
    \ \"\n    daemon rpc.nfsd $RPCNFSDCOUNT\n```\n\n并将其更改为如下（使用 2049 作为我们 `nfsd` 的预选端口）：\n\
    \n```\n echo -n $\"Starting NFS daemon: \"\n    daemon rpc.nfsd -p 2049 $RPCNFSDCOUNT\n\
    ```\n\n### 3.3.2.1.4 Rquotad\n\n远程配额守护进程（`rquotad`）负责回答客户端关于导出的 NFS 文件系统用户配额的查询。也就是说，当客户端尝试向\
    \ NFS 文件系统写入数据时，它会首先询问配额进程（如果服务器对该文件系统启用了配额）客户端是否有足够的配额来执行写入操作。`Rquotad` 然后将检查该用户的本地配额并将该信息返回给客户端。遗憾的是，除了缺乏\
    \ TCP wrappers 外，`rquotad` 无法固定到端口。\n\n另一方面，如果你不使用配额，就没有理由运行 `rquotad`，你可以在不影响文件系统的情况下停用它。这样做需要编辑启动脚本（`/etc/init.d/nfs`）：\n\
    \n```\n /etc/init.d/nfs\n```\n\n注释掉文件中的以下块以停用 `rquotad`：\n\n```\n if [ -x /usr/sbin/rquotad\
    \ ] ; then\n     echo -n $\"Starting NFS quotas: \"\n     daemon rpc.rquotad\n\
    \     echo\n    fi\n\n    if [ -x /usr/sbin/rquotad ] ; then\n     echo -n $\"\
    Stopping NFS quotas: \"\n     killproc rpc.rquotad\n     echo\n    fi\n\n    if\
    \ [ -x /usr/sbin/rquotad ] ; then\n     status rpc.rquotad\n    fi\n```\n\n你会注意到所有这些块在运行之前都会检查\
    \ `rquotad` 是否可执行（使用 `-x` 标志）。停用 `rquotad` 的一种方法是使用 `chmod` 移除它的执行权限（`chmod a-x\
    \ /usr/sbin/rquotad` 将可行）。虽然这将停用它，但 RPM 的更新（或热心的管理员！）可能会恢复这些执行权限，从而意外地重新激活守护进程。如果你真的决定不在\
    \ NFS 上使用配额，注释掉这些块将有助于确保该服务在你选择激活它之前保持停用状态。显然，如果不需要该服务，你应该卸载它以防止其在未来对系统造成不利：快速执行\
    \ `rpm -e quota` 即可完成此操作。\n\n### 3.3.2.2 NFS 客户端安全\n\n保护客户端相对简单：它只需要 portmapper。当调用通过\
    \ NFS 挂载文件系统时，`mount` 命令将处理必要的 NFS 模块激活。然而，由于客户端将运行 portmapper，因此应该以与服务器相同的方式进行安全保护，限制入站连接仅限必要的。\n\
    \n##### 3.3.2.2.1 示例 I：临时文件系统\n\n"
- fmt: "\nIn this example, we'll present a sample configuration for a secured NFS\
    \ mount between a client and server which would be mounted manually by administrators.\
    \ This would include shared directories that contain system patches, for example,\
    \ so that a central patch repository could be remotely mounted to patch servers\
    \ and then unmounted when not needed. Since the directory containing the patches\
    \ will only be read by the client and should not be altered, we can export this\
    \ filesystem read-only. We can also export the filesystem using \"squashing\"\
    , an option that maps `UIDs` and `GIDs` on the client to corresponding `UIDs`\
    \ and `GIDs` on the server. Commonly, this is done to the root account, so that\
    \ the remote client's root account is not automatically granted root-level privileges\
    \ to the filesystems on the server. In this case, however, we only need the right\
    \ to read the patches, so we'll export the filesystem with complete squashing:\
    \ we'll create an unprivileged user on the server who can only read the patches,\
    \ and map all remote `UIDs` to that user, reducing all of the client's privileges\
    \ accordingly. NFS also allows us to export the filesystem to a specific client\
    \ or group of clients: *never* export a filesystem to the world! We'll restrict\
    \ access to the patches share to a local, internal subnet: `10.1.1.0/24`, e.g.\n\
    \nLinux offers some convenient extra tweaks to NFS to tighten security a little:\
    \ the \"hide\" feature, enabled by default, means that a filesystem mounted within\
    \ a shared filesystem (such as having `/usr` and `/usr/local` on separate disk\
    \ partitions) is not automatically shared: the server must share that secondary\
    \ filesystem separately, and the client must mount it separately. In addition,\
    \ the \"secure\" feature, also enabled by default, requires that NFS mount requests\
    \ originate from a privileged port, helping to ensure that the user making the\
    \ remote mount request is root or has root privileges. This isn't a foolproof\
    \ determinant, but every little bit helps.\n\n## On the Server\n\n1.  Create the\
    \ patch directory\n\n    ```\n     mkdir /local/patches\n    ```\n\n2.  Create\
    \ the unprivileged user and group\n\n    ```\n     groupadd -g 1500 patches\n\
    \            useradd -u 1500 -g patches -d /local/patches -s /dev/null patches\n\
    \    ```\n\n3.  Edit `/etc/exports` to configure the share\n\n    ```\n     /etc/exports\n\
    \            /local/patches 10.1.1.0/24(ro,secure,hide,all_squash,anonuid=1500,anongid=1500)\n\
    \    ```\n\n4.  Ensure that the NFS services are running on the server\n\n   \
    \ ```\n     /etc/init.d/portmap start\n            /etc/init.d/nfs start\n   \
    \         /etc/init.d/nfslock start\n    ```\n\n5.  Export all configured filesystem\
    \ shares (-a), using verbose output (-v)\n\n    ```\n     /usr/sbin/exportfs -va\n\
    \    ```\n\n6.  Copy patches into\n\n    ```\n     /local/patches\n    ```\n\n\
    ## On the Client\n\n1.  Ensure the portmapper is running\n\n    ```\n     /etc/init.d/portmap\
    \ start\n    ```\n\n2.  Create the mount point\n\n    ```\n     mkdir /nfsmount/patches\n\
    \    ```\n\n3.  Mount the remote filesystem from the server at 10.1.1.50\n\n \
    \   ```\n     /bin/mount -t nfs 10.1.1.50:/local/patches /nfsmount/patches\n \
    \   ```\n\n### 3.3.2.2.2 Example II: At-Boot Filesystem\n\nThe example being explored\
    \ here is a filesystem that would be mounted at boot off of a central fileserver.\
    \ Frequently, this is done with user home directories. Since the users will need\
    \ individual access to their directories, we cannot employ complete squashing\
    \ as we did in the previous example. Instead, we'll sure to use root squashing.\
    \ In order to do this, you must be careful to synchronize `UIDs` between the clients\
    \ and the server. Since access is granted by numerical `UID` and not by username,\
    \ a user with a different `UID` on the client and the server would not have access\
    \ rights to her own directory, and might (even worse) have complete access to\
    \ someone else's entirely!\n\n## On the Server\n\n1.  Create the users for whom\
    \ you'll want to grant access, and synchronize their `UIDs` with the client. If\
    \ the users will not ever login to the NFS server directly, they can be granted\
    \ user accounts with null shells (`/dev/null` or `/bin/false` or the like), since\
    \ that account information will then only be used for mapping NFS privileges.\
    \ We can at least restrict the access to this filesystem to the local LAN (as\
    \ is almost always a good idea for security), and we can employ root squashing\
    \ to prevent root-level breaches.\n\n2.  Edit `/etc/exports` to configure the\
    \ share\n\n    ```\n     /etc/exports\n            /home 10.1.1.0/24(rw,secure,hide,root_squash)\n\
    \    ```\n\n3.  Ensure that the NFS services are running on the server\n\n   \
    \ ```\n     /etc/init.d/portmap start\n            /etc/init.d/nfs start\n   \
    \         /etc/init.d/nfslock start\n    ```\n\n4.  Export all configured filesystem\
    \ shares (-a), using verbose output (-v)\n\n    ```\n     /usr/sbin/exportfs -va\n\
    \    ```\n\n## On the Client\n\nOne extra piece of security checking to be performed:\
    \ the client should mount the filesystem as an untrusted volume. This means mounting\
    \ it without SUID files (`nosuid`), without devices (`nodev`) and preferably without\
    \ executables, to prevent the server from being granted additional privileges\
    \ on the client. The first two options are particularly important: without them,\
    \ an attacker with access to the NFS server could insert a SUID shell or compromised\
    \ device into the shared filesystem and be automatically granted privileges on\
    \ the other filesystems. Although we've enabled root squashing, remember that\
    \ there is no squashing for users such as `bin` or `daemon`, which are potentially\
    \ just as dangerous to the client as root access!\n\n1.  Ensure the portmapper\
    \ is running\n\n    ```\n     /etc/init.d/portmap start\n    ```\n\n2.  Test connectivity\
    \ by mounting the remote filesystem from the server at 10.1.1.50\n\n    ```\n\
    \     /bin/mount -t nfs 10.1.1.50:/home /home\n    ```\n\n3.  Configure `/etc/fstab`\
    \ to mount the filesystem automatically\n\n    ```\n     /etc/fstab:\n       \
    \  10.1.1.50:/home /home nfs nosuid,nodev,noexec 0 0\n    ```\n"
