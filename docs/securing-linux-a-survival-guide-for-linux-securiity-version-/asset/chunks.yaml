  trans: "\nSendmail 是 Red Hat 7.3 以及大多数其他 Linux 发行版提供的默认邮件传输代理（MTA）。Red Hat 7.3 附带的是\
    \ 8.11.6  `sendmail`，在本文写作时，8.12.5 版本 `sendmail` 是提供的最新且稳定的版本。建议升级到 `sendmail`\
    \ 的当前版本（[`www.sendmail.org`](http://www.sendmail.org)），因为它消除了一个理论上的缓冲区溢出漏洞。\n\n\
    对于初学者来说，`sendmail` 的配置和操作可能相当复杂。强烈建议任何想要使用 `sendmail` 高级功能的人获取由 O'Reilly and Associates\
    \ 出版的《Sendmail》（通常被称为“呆子书”）。\n\n### 3.2.1.1 禁用工作站上的 Sendmail 守护进程模式\n\n工作站很少需要以守护进程模式运行邮件传输代理（MTA）。大多数组织利用中央邮件网关来路由消息，因此可以安全地禁用守护进程。\n\
    \n```\n 编辑 /etc/sysconfig/sendmail 内容如下：\n    DAEMON=no\n    QUEUE=15m\n```\n\n\
    `QUEUE` 控制 `sendmail` 处理出站队列的频率。在上面的示例中，队列设置为每 15 分钟处理一次，但可以根据个人需求更改，包括秒（s）、分钟（m）或小时（h）。保存对\
    \ `/etc/sysconfig/sendmail` 的更改并重启 `sendmail` 守护进程：\n\n```\n [root] # /etc/rc.d/init.d/sendmail\
    \ restart\n```\n\n### 3.2.1.2 为邮件客户端定义 SMTP 服务器\n\n大多数 Linux 发行版都包含几个命令行和基于 GUI\
    \ 的邮件客户端。Red Hat 例外，配备了 Pine、ELM、mail（又名 Mail）、Mutt、Netscape 和 Mozilla 等。虽然像 `PINE`\
    \ 和 `ELM` 等程序默认在本地使用 `sendmail`，但它们可以被配置为使用外部 MTA。然而，命令行应用程序 `mail` 不包含使用外部 MTA\
    \ 的选项，因此有必要修改 `sendmail` 以便通过中央邮件网关路由消息。\n\n#### 3.2.1.2.1 为 Sendmail 设置出站 SMTP\
    \ 服务器\n\n**方案一：**\n\n```\n 编辑 /etc/mail/sendmail.mc 内容如下：\n    define('SMART_HOST',\
    \ 'your.mailserver.com')\n```\n\n请记住，“your.mailserver.com”是您组织 SMTP 服务器的完全限定域名。从编辑过的\
    \ `sendmail.mc` 生成新的 `sendmail.cf`：\n\n```\n [root] # m4 /etc/mail/sendmail.mc\
    \ > /etc/sendmail.cf\n```\n\n重启 `sendmail` 守护进程：\n\n```\n [root] # /etc/rc.d/init.d/sendmail\
    \ restart\n```\n\n另一种方法是直接编辑 `/etc/sendmail.cf`，但这通常是不被建议的做法。如果由于某种原因无法使用 `m4`\
    \ 宏，则可以通过查找 `/etc/sendmail.cf` 中的 `DS`（该 `DS` 紧跟在 \"local info\" 标题之后）来编辑 `/etc/sendmail.cf`。将\
    \ `DS` 修改为：\n\n```\n DSyour.mailserver.com\n```\n\n编辑该文件以处理本地递递邮件可能也是一个好主意，通过编辑\
    \ `/etc/sendmail.cf` 中以 \"`DR`”、“`DH`”和 \"`DM`”开头的条目：\n\n```\n DRyour.mailserver.com\n\
    \    DHyour.mailserver.com\n    DMyour.mailserver.com\n```\n\n这将分别处理未限定地址（无任何\
    \ @domain 部分的地址）、本地地址（无任何域信息的 user@host）并设置伪装地址。保存 `/etc/mail/sendmail.cf` 并重启守护进程。\n\
    \n**方案二：**\n\n`sendmail` 有一个相当不为人知的特性，专门用于处理本地工作站通过中央 SMTP 服务器中继所有出站消息的情况。该功能被称为“空客户端宏文件”（Null\
    \ Client Macro File），允许管理员创建一个不包含通常存在的所有额外功能的的的 `sendmail.cf`。\n\n使用以下行创建 `/etc/mail/null.mc`：\n\
    \n```\n OSTYPE ('linux')dnl\n    DOMAIN ('generic')dnl\n    FEATURE ('nullclient',\
    \ 'your.mailserver.com')dnl\n    Define ('confPRIVACY_FLAGS', authwarnings, goaway,\
    \ restrictmailq, restrictqrun')dnl\n```\n\n通过运行 `m4` 宏生成新的 `sendmail.cf` 文件并重启\
    \ `sendmail` 守护进程：\n\n```\n [root] # m4 /etc/mail/null.mc > /etc/sendmail.cf\n\
    \    [root] # /etc/rc.d/init.d/sendmail restart\n```\n\n#### 3.2.1.2.2 为邮件客户端设置出站\
    \ SMTP 服务器\n\n如前，Pine 等邮件程序默认在本地上使用 `sendmail` 发送消息。然而，如果需要，可以将 Pine 配置为使用远程 SMTP\
    \ 服务器。您可以通过从主菜单选择“S”设置，然后选择“C”配置，然后移动到标记为 `smtp-server` 的字段直接设置 SMTP 服务器。在此处输入远程\
    \ SMTP 服务器的主机并保存更改。除了 `smtp-server` 字段外，还可以编辑 `personal-name` 和 `user-domain`\
    \ 以反映个人需求。\n\n在 Netscape Messenger 中，设置 SMTP 服务器的方法是选择 `Edit -> Preferences` 对话框，选择\
    \ `Mail & Newsgroups -> Mail Servers` 并在窗口中放置 SMTP 服务器的主机名。Mozilla 非常类似，基于 GUI\
    \ 的邮件客户端也是如此。\n\n### 3.2.1.3 增强 Sendmail 守护进程的隐私安全性\n\n可用多种选项来增强 `sendmail` 守护进程的隐私安全性。通过在\
    \ `/etc/mail/sendmail.mc` 中添加特定标志，管理员可以限制对邮件队列的访问。下面是这些标志的摘要，但书中详细解释了所有选项（注意：原文包含了一些重复/损坏的字符串，如\"\
    needexpn\"和\"noexpnrfy\"，已进行清理以提高可读性同时保持原意）。\n\n### 3.2.1.4 定义允许中继邮件的主机\n\n从 `sendmail`\
    \ 8.9 版本开始，默认防止中继。这样做是为了防止恶意实体（例如垃圾邮件发送者）通过未正确配置的邮件网关中继未经请求的电子邮件。中继通过分别位于 `/etc/mail/access`\
    \ 和 `/etc/mail/access.db` 的访问数据库进行控制。\n\n#### 3.2.1.4.1 检查访问数据库是否激活\n\n为了确保 `sendmail`\
    \ 有能够使用访问数据库，检查 `/etc/sendmail.cf` 中的数据库名称：\n\n```\n [root] # grep Kaccess /etc/sendmail.cf\n\
    \    Kaccess hash /etc/mail/access\n```\n\n如果未找到上述行，编辑 `/etc/mail/sendmail.mc`\
    \ 并添加以下构建宏：\n\n```\nFEATURE (`access_db`)dnl\n```\n\n通过运行 `m4` 宏生成新的 `sendmail.cf`\
    \ 文件并重启 `sendmail` 守护进程：\n\n```\n [root] # m4 /etc/mail/sendmail.mc > /etc/sendmail.cf\n\
    \    [root] # /etc/rc.d/init.d/sendmail restart\n```\n\n#### 3.2.1.4.2 为允许中继的域名创建访问数据库\n"
- fmt: "\nThe access database has a simple \"key value\" format that is used when\
    \ configuring allowed relay domains for `sendmail`. The \"key\" is a fully qualified\
    \ hostname, sub-domain, domain or network. The \"value\" is an action, `REJECT`,\
    \ `DISCARD`, `OK`, `RELAY` or an arbitrary message. Only hosts or domains with\
    \ the `RELAY` action defined are allowed to use the mail server as a mail relay.\
    \ For example, if your domain is `mailserver.com` and our server is also handling\
    \ mail for all hosts on the `192.168.x.x` network, edit `/etc/mail/access` to\
    \ read:\n\n```\n mailserver.com            RELAY\n    192.168                \
    \   RELAY\n```\n\nSave the changes to `/etc/mail/access` and use the `makemap`\
    \ utility program to create the database map of this file and restart the `sendmail`\
    \ daemon:\n\n```\n [root] # makemap hash /etc/mail/access.db < /etc/mail/access\n\
    \    [root] # /etc/rc.d/init.d/sendmail restart\n```\n\nAnytime information is\
    \ modified in `/etc/mail/access`, it is important to run a new `makemap` command\
    \ and restart the `sendmail` daemon so the changes will take effect. The example\
    \ above is meant to illustrate simple usage of the access database. A more detailed\
    \ explanation and advanced configurations can be found at: [http://www.sendmail.org/tips/relaying.html](http://www.sendmail.org/tips/relaying.html)\n\
    \n### 3.2.1.5 Set Domain Name Masquerading\n\nMany organizations prefer to have\
    \ uniform mail addresses for all employees, such as `joeuser@mailserver.com`.\
    \ While some mail clients can be configured to use a specific domain, the administration\
    \ of multiple mail clients in even a small environment can be tedious and cost\
    \ prohibitive. Sendmail can be configured to rewrite the headers of all outbound\
    \ messages so that they masquerade as a single domain name for the entire organization.\
    \ To define the masquerade address, edit `/etc/mail/sendmail.mc` to reflect the\
    \ following example:\n\n```\n MASQUERADE_AS('mailserver.com')dnl\n    FEATURE\
    \ ('masquerade_entire_domain')dnl\n    FEATURE ('masquerade_envelope')dnl\n```\n\
    \nGenerate a new `sendmail.cf` file by running the `m4` macro and restart the\
    \ `sendmail` daemon:\n\n```\n [root] # m4 /etc/mail/sendmail.mc > /etc/sendmail.cf\n\
    \    [root] # /etc/rc.d/init.d/sendmail restart\n```\n\n### 3.2.1.6 Configure\
    \ Sendmail to Use RBL Support\n\nThe Real-time Blackhole List, commonly referred\
    \ to as RBL, is a DNS-based service that contains a database of suspected and\
    \ known spammers. The `m4` feature, `dnsbl`, allows sendmail to reference this\
    \ database and automatically reject any messages originating from a domain listed\
    \ by RBL. It should be noted that RBL is not an exact science and there are times\
    \ when a domain you wish to communicate with has found itself listed by RBL. It\
    \ can often prove difficult to get a domain removed so it is advised to use this\
    \ feature with caution as it may cause a break in communication with legitimate\
    \ domains. To add the feature to sendmail edit `/etc/mail/sendmail.mc` and add\
    \ the following:\n\n```\nFEATURE (‘dnsbl’)dnl\n```\n\nGenerate a new `sendmail.cf`\
    \ file by running the `m4` macro and restart the `sendmail` daemon:\n\n```\n [root]\
    \ # m4 /etc/mail/sendmail.mc > /etc/sendmail.cf\n    [root] # /etc/rc.d/init.d/sendmail\
    \ restart\n```\n\n### 3.2.1.7 Install an Alternative MTA\n\nSeveral other mail\
    \ transfer agents are available to replace sendmail. Three popular alternatives\
    \ are Qmail ([http://www.qmail.org](http://www.qmail.org)) by Daniel Bernstein,\
    \ Postfix ([http://www.postfix.org](http://www.postfix.org)) by Wietse Venema,\
    \ and Exim ([http://www.exim.org/](http://www.exim.org/)) developed by the University\
    \ of Cambridge. These MTA's were written with security in mind and generally considered\
    \ to offer high performance. It is beyond the scope of this guide to give details\
    \ on the installation and configuration of these alternatives but a wealth of\
    \ information is available at their respective sites.\n\n### 3.2.2 Secure the\
    \ POP and IMAP Daemons\n\nFor mail servers that collect all incoming mail for\
    \ an organization, a common means to deliver the mail to clients is for them to\
    \ retrieve the mail using the Post Office Protocol (POP) or the Internet Message\
    \ Access Protocol (IMAP). POP (also called POP3) is the older and less complicated\
    \ of the two protocols, providing basic commands for authentication, retrieval\
    \ and deletion of mail messages from the mail server. IMAP is more flexible and\
    \ supports creating, deleting and renaming mail folders (mailboxes), searching,\
    \ selective retrieval of message attributes and more.\n\n### 3.2.2.1 Get the Latest\
    \ Version of POP and IMAP Daemons\n\nUnfortunately, many POP and IMAP daemon implementations\
    \ have been plagued with vulnerabilities that lead to remote root compromises\
    \ of mail servers on various platforms. There are several well-known exploit programs\
    \ for cracking vulnerable Linux POP and IMAP daemons. It is generally considered\
    \ a good practice to always use the most current and stable release of any daemons\
    \ and this is no exception.\n\nMost newer POP and IMAP daemons currently available\
    \ will offer support for secure retrieval of messages. This is most commonly done\
    \ with TLS/SSL that requires the use of OpenSSL and the creation of a certificate.\n\
    \n### 3.2.2.2 Control Access to POP and IMAP with Wrappers\n\nPOP/IMAP is traditionally\
    \ run out of `xinetd`, so access control through wrappers is easy to configure\
    \ and adds an important element of security. Limit access to only those hosts\
    \ that have a legitimate need for the service. For a central mail hub that holds\
    \ mail for the `mailserver.com` domain and `192.168.x` network and delivers it\
    \ to clients via POP3 or IMAP, edit `/etc/hosts.allow` to reflect the following\
    \ changes:\n\n```\nipop3d:        .mailserver.com        192.168.\nimapd:    \
    \     .mailserver.com        192.168.\n```\n"
