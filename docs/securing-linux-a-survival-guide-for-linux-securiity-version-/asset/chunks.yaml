  trans: "\n\n为了让 Apache 服务器使用模块提供的功能，配置文件中必须存在该模块对应的 `LoadModule` 和 `AddModule` 指令。为了增加额外的安全层，请注释掉（或删除）服务器不会使用的每个模块行对。以下是一些可以移除的候选：\n\
    \n表 3-1：未使用时建议注释的候选模块\n\n| 模块 | 提供的功能 | 注释 |\n| --- | --- | --- |\n| `mod_autoindex`\
    \ | `自动目录列表` | `提供目录列表会向潜在的破解者泄露过多信息。` |\n| `mod_include` | `服务器解析文档` | `如果网站不需要服务器端包含（SSI），则禁用它们更安全。`\
    \ |\n| `mod_info` | `服务器配置信息` | `通过访问 URL 提供服务器配置信息会泄露过多信息。` |\n| `mod_status`\
    \ | `服务器状态显示` | `通过访问 URL 访问服务器状态信息会泄露过多信息。` |\n| `mod_userdir` | `用户主目录` | `允许用户从其主目录内的目录中提供页面。`如果用户缺乏\
    \ Web 知识且不细心，这将引入潜在的漏洞。` |\n| `Ref. 1:` | [`httpd.apache.org/docs/mod/`](http://httpd.apache.org/docs/mod/)\
    \ | |\n\n#### 3.1.2.2 收紧默认目录访问权限\n\n更改控制默认访问权限的 `<Directory />` 语句。\n\n表 3-2：默认目录访问权限的修改\n\
    \n| 原始版本 | 修改后 |\n| --- | --- |\n| ```xml\n <Directory />\n  Options FollowSymLinks\n\
    \  AllowOverride None\n</Directory>\n ``` ``` | ```xml\n <Directory />\n  Options\
    \ None\n  AllowOverride None\n  Order allow,deny\n  Deny from all\n</Directory>\n\
    \ ``` ``` |\n\n原始版本允许跟踪符号链接到文件系统中的任何地方。这增加了文档根（document root）之外的文件显示访问者的概率。\n\n\
    #### 3.1.2.3 文档根访问权限\n\n更改控制 Web 服务器文档根访问权限的 `<Directory /var/www/html/>` 语句。\n\
    \n表 3-3：默认根访问权限的修改\n\n| 原始版本 | 修改后 |\n| --- | --- |\n| ```xml\n <Directory \"\
    /var/www/html\">\n  Options Indexes FollowSymLinks\n  AllowOverride None\n  Order\
    \ allow,deny\n  Allow from all\n</Directory>\n ``` | ```xml\n <Directory /var/www/html>\n\
    \  Options SymLinksIfOwnerMatch\n  AllowOverride None\n  Order allow,deny\n  Allow\
    \ from all\n</Directory>\n ``` |\n\n原始版本将向访问者显示文档根中没有 `index.html` 文件（或其他由 `DirectoryIndex`\
    \ 指令定义的类似文件）的任何目录的列表。如上一步所述，给访问者提供太多信息了。另一个更改是使用限制性更强的 `SymLinksIfOwnerMatch`\
    \ 选项。通常，Web 服务器提供的所有文件都由 root 用户或 Web 管理员拥有。因此，此选项防止服务器跟踪其他用户可能创建的指向 `DocumentRoot`\
    \ 之外区域的链接。\n\n对于 `AllowOveride` 指令，有一个考虑的选项（而不是 `None`）。如果有许多人负责 Web 服务器文档根下不同目录的访问控制，可以使用\
    \ `AllowOveride AuthConfig`。这将允许使用每个目录下的 `.htaccess`（或与 `AccessFileName` 指令匹配的文件名）文件单独配置访问控制，而不需要给所有人主\
    \ `httpd.conf` 配置文件的写写权限。缺点是这使得服务器访问审计变得更加困难，因为有多个地方需要查看。\n\n#### 3.1.2.4 隐藏服务器版本信息\n\
    \nApache 默认配置为它动态生成的 Web 页面（如默认错误页面）添加签名。签名可能包含服务器名称、版本号和模块。放置在 `httpd.conf` 中的以下指令将防止显示此签名：\n\
    \n```\nServerSignature Off\n```\n\n除了服务器签名外，apache 还会向请求文档的客户端返回的 HTTP 头中提供一个字符串，其中包含启动时加载的名称、版本和模块。以下指令将尽可能地减少泄漏的信息量。\n\
    \n```\nServerTokens Prod\n```\n\n偶尔，Web 服务器管理员的电子邮件地址显示在服务器生成的页面上。找到下面的指令，并将电子邮件地址更改为\
    \ Webmaster 的地址。\n\n```\nServerAdmin root@localhost\n```\n\n#### 3.1.2.5 禁用 cgi-bin\
    \ 目录（如果未使用）\n\n用于攻击 Web 服务器的主要向量可能是 CGI 程序。如果服务器托管的网站没有托管任何 CGI 页面，请注释掉以下行以禁用\
    \ CGI 功能和对 `cgi-bin` 目录的访问：\n\n```\nLoadModule cgi_module    modules/mod_cgi.so\n\
    \    LoadModule env_module    modules/mod_env.so\n    AddModule mod_env.c\n  \
    \  AddModule mod_cgi.c\n    ScriptAlias /cgi-bin/ \"/var/www/cgi-bin/\"\n<Directory\
    \ \"/var/www/cgi-bin\">\n  AllowOverride None\n Options None\n  Order allow,deny\n\
    \  Allow from all\n</Directory>\n```\n\n### 3.1.3 检查 DocumentRoot 中文件的权限\n\n为了防止\
    \ Web 页面被篡改，所有者不应对 Web 服务器提供的任何文件具有写权限。运行 Web 服务器进程的用户和组分别由 `httpd.conf` 中的 `User`\
    \ 和 `Group` 指令定义。对于 Web 服务器提供的所有目录运行以下命令，以识别所有者具有写权限的文件。为了安全安全，命令输出应该是空的。\n\n\
    ```\n[root@localhost]#usr/bin/find /var/www/html -user apache -perm +202 -exec\
    \ ls \\;\n[root@localhost]#usr/bin/find /var/www/html -group apache -perm +022\
    \ -exec ls \\;\n```\n\n在这些命令中，用户和组是 `apache`，正如默认安装那样。此外，为了额外的安全，可以将这些命令合并成脚本并通过\
    \ cron 每天运行，以便及时检测任何更改。\n\n### 3.1.4 使用 HTTPS 加密敏感流量\n\n安全套接层（SSL）模块允许 apache\
    \ Web 服务器对所有客户端通信使用强身份验证。至少，`https` 协议要求服务器拥有用于标识的 `X.509` 证书。理想情况下，证书应由受信任的第三方签名证明服务器确实由其声称的对象运营。可选，服务器也可以要求客户端提供证书。\n\
    \nRed Hat 7.3 安装的示例证书（`/etc/httpd/conf/ssl.crt/server.crt`）允许 apache 启动并作为 HTTPS\
    \ 服务器运行。但如果服务器用于处理敏感数据（例如电子商务网站），则应创建并由权威机构签署真实的证书。有关如何创建证书的详情，请参阅 [`www.thawte.com/html/SUPPORT/server/softwaredocs/apachessl.html`](http://www.thawte.com/html/SUPPORT/server/softwaredocs/apachessl.html)。\n\
    \n### 3.1.5 在哪里查找更多信息\n\n由 Ryan Barnett 编写的名为 Securing Apache Step-by-Step 的 GCUX\
    \ 实战（[`www.giac.org/practical/ryan_barnett_gcux.zip`](http://www.giac.org/practical/ryan_barnett_gcux.zip)）是这些项目以及与\
    \ Apache 服务器相关项目的绝佳资源。\n\n## 3.2 电子邮件安全\n\n### 3.2.1 Sendmail\n\n"
- fmt: "\nSendmail is the default Mail Transfer Agent (MTA) supplied with Red Hat\
    \ 7.3 and most other distributions of Linux. Red Hat 7.3 shipped with version\
    \ 8.11.6 of `sendmail` and at the time of this writing, `sendmail` version 8.12.5\
    \ is the most current and stable version offered. It is advisable to upgrade to\
    \ the current release of `sendmail` ([http://www.sendmail.org](http://www.sendmail.org))\
    \ since it eliminates a theoretical buffer overflow vulnerability.\n\nThe configuration\
    \ and operation of `sendmail` can be quite complicated in the hands of a beginner.\
    \ It is highly recommended that anyone wishing to use the more advanced features\
    \ of `sendmail` get a copy of Sendmail (commonly known as the \"Bat Book\") published\
    \ by O'Reilly and Associates.\n\n### 3.2.1.1 Disable Sendmail Daemon Mode on Workstation\n\
    \nRarely should a workstation ever need to run a Mail Transfer Agent (MTA) in\
    \ a daemon mode. Most organizations utilize a central mail gateway to route messages\
    \ so the daemon can be safely disabled.\n\n```\n Edit /etc/sysconfig/sendmail\
    \ to read:\n    DAEMON=no\n    QUEUE=15m\n```\n\nThe `QUEUE` option controls how\
    \ often `sendmail` will process the outgoing mail queue. In the example above,\
    \ the queue is set to be processed every 15 minutes but this can be changed to\
    \ suit individual needs to include seconds (s), minutes (m) or hours (h). Save\
    \ the changes made to `/etc/sysconfig/sendmail` and restart the `sendmail` daemon:\n\
    \n```\n [root] # /etc/rc.d/init.d/sendmail restart\n```\n\n### 3.2.1.2 Define\
    \ SMTP Server for Mail Clients\n\nMost Linux distributions include several command-line\
    \ and GUI-based mail clients. Red Hat is no exception and ships with Pine, ELM,\
    \ mail (AKA Mail), Mutt, Netscape and Mozilla just to name a few. While programs\
    \ like `PINE` and `ELM` default to using `sendmail` locally, they can be configured\
    \ to use an external MTA. However, the command-line application, `mail`, does\
    \ not include an option to use an external MTA which makes changes to `sendmail`\
    \ necessary to route messages through the central mail gateway.\n\n#### 3.2.1.2.1\
    \ Set Outbound SMTP Server for Sendmail\n\n**Option One:**\n\n```\n Edit /etc/mail/sendmail.mc\
    \ to read:\n    define('SMART_HOST', 'your.mailserver.com')\n```\n\nKeep in mind\
    \ that ‘your.mailserver.com’ is the fully qualified domain name of the SMTP server\
    \ for your organization. Generate a new `sendmail.cf` from the edited `sendmail.mc`:\n\
    \n```\n [root] # m4 /etc/mail/sendmail.mc > /etc/sendmail.cf\n```\n\nRestart the\
    \ `sendmail` daemon:\n\n```\n [root] # /etc/rc.d/init.d/sendmail restart\n```\n\
    \nAn alternate method is to edit `/etc/sendmail.cf` directly, but this is a generally\
    \ discouraged practice. If, for some reason, using the `m4` macro is not feasible,\
    \ then edit `/etc/sendmail.cf` by looking for `DS` which can be located just after\
    \ the \"local info\" heading. Change `DS` to read:\n\n```\n DSyour.mailserver.com\n\
    ```\n\nIt may also be a good idea to edit the file to handle locally delivered\
    \ mail by editing the entries that begin with \"`DR`\", \"`DH`\", and \"`DM` in\
    \ `/etc/sendmail.cf:`\n\n```\n DRyour.mailserver.com\n    DHyour.mailserver.com\n\
    \    DMyour.mailserver.com\n```\n\nThis will handle unqualified addresses (those\
    \ without any @domain portion), local addresses (user@host without any domain\
    \ information) and sets the masquerade address, respectively. Save `/etc/mail/sendmail.cf`\
    \ and restart the daemon.\n\n**Option Two:**\n\nThere exists a fairly unknown\
    \ feature of `sendmail` written exclusively to handle the situation of a local\
    \ workstation relaying all outbound messages through a central SMTP server. The\
    \ feature is called the Null Client Macro File and allows an administrator to\
    \ create an appropriate `sendmail.cf` without all the extra features normally\
    \ present.\n\nCreate the `/etc/mail/null.mc` with the following lines:\n\n```\n\
    \ OSTYPE ('linux')dnl\n    DOMAIN ('generic')dnl\n    FEATURE ('nullclient', 'your.mailserver.com')dnl\n\
    \    Define ('confPRIVACY_FLAGS', authwarnings, goaway, restrictmailq, restrictqrun')dnl\n\
    ```\n\nGenerate a new `sendmail.cf` file by running the `m4` macro and restart\
    \ the `sendmail` daemon:\n\n```\n [root] # m4 /etc/mail/null.mc > /etc/sendmail.cf\n\
    \    [root] # /etc/rc.d/init.d/sendmail restart\n```\n\n#### 3.2.1.2.2 Set Outbound\
    \ SMTP Server for Mail Clients\n\nAs stated earlier, mail programs like Pine will\
    \ default to using `sendmail` on the localhost for sending messages. However,\
    \ Pine can be configured to utilize a remote SMTP server, if desired. You can\
    \ set the SMTP server directly from the main menu by selecting \"S\" for setup,\
    \ then \"C\" for config and then moving down to the field labeled `smtp-server`.\
    \ Enter the hostname of the remote SMTP server here and save your changes. In\
    \ addition to the `smtp-server` field, `personal-name` and `user-domain` can be\
    \ edited to reflect individual needs.\n\nThe SMTP server is set in Netscape Messenger\
    \ by selecting the `Edit -> Preferences`… dialog, selecting `Mail & Newsgroups\
    \ -> Mail Servers` and placing the hostname of the SMTP server in the window.\
    \ Mozilla is quite similar as are GUI-based mail clients.\n\n### 3.2.1.3 Increase\
    \ Privacy and Security of the Sendmail Daemon\n\nSeveral options are available\
    \ to increase the privacy and security of the `sendmail` daemon. By adding particular\
    \ flags within `/etc/mail/sendmail.mc`, an administrator can restrict access to\
    \ the mail queue. A summary of these flags is presented below but all the options\
    \ are explained in great detail in the Book (Note: source text contained some\
    \ repetitive/corrupted strings like \"needexpn\" and \"noexpnrfy\" which have\
    \ been cleaned for readability while maintaining intent).\n\n### 3.2.1.4 Define\
    \ Hosts Allowed to Relay Mail\n\nStarting with version 8.9 of `sendmail`, relaying\
    \ is prevented by default. This was done to prevent nefarious entities (e.g. Spammers)\
    \ from being able to relay unsolicited email through a mail gateway that was not\
    \ properly configured. Relaying is controlled through the access database located\
    \ in `/etc/mail/access` and `/etc/mail/access.db`, respectively.\n\n#### 3.2.1.4.1\
    \ Check That the Access Database Is Active\n\nTo ensure `sendmail` has the ability\
    \ to use the access database, check for the name of the database in `/etc/sendmail.cf`:\n\
    \n```\n [root] # grep Kaccess /etc/sendmail.cf\n    Kaccess hash /etc/mail/access\n\
    ```\n\nIf the line above isn't found, edit `/etc/mail/sendmail.mc` and add the\
    \ following build macro:\n\n```\nFEATURE (`access_db`)dnl\n```\n\nGenerate a new\
    \ `sendmail.cf` file by running the `m4` macro and restart the `sendmail` daemon:\n\
    \n```\n [root] # m4 /etc/mail/sendmail.mc > /etc/sendmail.cf\n    [root] # /etc/rc.d/init.d/sendmail\
    \ restart\n```\n\n#### 3.2.1.4.2 Create Access Database for Domains Allowed to\
    \ Relay\n"
  raw: "Sendmail is the default Mail Transfer Agent (MTA) supplied with Red Hat 7.3\
    \ and most other distributions of Linux. Red Hat 7.3 shipped with version 8.11.6\
    \ of sendmail and at the time of this writing, sendmail version 8.12.5 is the\
    \ most current and stable version offered. It is advisable to upgrade to the current\
    \ release of sendmail ([http://www.sendmail.org](http://www.sendmail.org)) since\
    \ it eliminates a theoretical buffer overflow vulnerability.\n\nThe configuration\
    \ and operation of sendmail can be quite complicated in the hands of a beginner.\
    \ It is highly recommended that anyone wishing to use the more advanced features\
    \ of sendmail get a copy of Sendmail (commonly known as the \"Bat Book\") published\
    \ by O'Reilly and Associates.\n\n#### 3.2.1.1 Disable Sendmail Daemon Mode on\
    \ Workstation\n\nRarely should a workstation ever need to run a Mail Transfer\
    \ Agent (MTA) in a daemon mode. Most organizations utilize a central mail gateway\
    \ to route messages so the daemon can be safely disabled.\n\n```\n Edit /etc/sysconfig/sendmail\
    \ to read:\n    DAEMON=no\n    QUEUE=15m\n```\n\nThe QUEUE option controls how\
    \ often sendmail will process the outgoing mail queue. In the example above, the\
    \ queue is set to be processed every 15 minutes but this can be changed to suit\
    \ individual needs to include seconds (s), minutes (m) or hours (h). Save the\
    \ changes made to `/etc/sysconfig/sendmail` and restart the `sendmail` daemon:\n\
    \n```\n [root] # /etc/rc.d/init.d/sendmail restart\n```\n\n#### 3.2.1.2 Define\
    \ SMTP Server for Mail Clients\n\nMost Linux distributions include several command-line\
    \ and GUI-based mail clients. Red Hat is no exception and ships with Pine, ELM,\
    \ mail (AKA Mail), Mutt, Netscape and Mozilla just to name a few. While programs\
    \ like PINE and ELM default to using sendmail locally, they can be configured\
    \ to use an external MTA. However, the command-line application, mail, does not\
    \ include an option to use an external MTA which makes changes to sendmail necessary\
    \ to route messages through the central mail gateway.\n\n##### 3.2.1.2.1 Set Outbound\
    \ SMTP Server for Sendmail\n\n**Option One:**\n\n```\n Edit /etc/mail/sendmail.mc\
    \ to read:\n    define('SMART_HOST', 'your.mailserver.com')\n```\n\nKeep in mind\
    \ that ‘your.mailserver.com’ is the fully qualified domain name of the SMTP server\
    \ for your organization. Generate a new `sendmail.cf` from the edited `sendmail.mc`:\n\
    \n```\n [root] # m4 /etc/mail/sendmail.mc > /etc/sendmail.cf\n```\n\nRestart the\
    \ sendmail daemon:\n\n```\n [root] # /etc/rc.d/init.d/sendmail restart\n```\n\n\
    An alternate method is to edit `/etc/sendmail.cf` directly, but this is a generally\
    \ discouraged practice. If, for some reason, using the m4 macro is not feasible,\
    \ then edit `/etc/sendmail.cf` by looking for DS which can be located just after\
    \ the \"local info\" heading. Change DS to read:\n\n```\n DSyour.mailserver.com\n\
    ```\n\nIt may also be a good idea to edit the file to handle locally delivered\
    \ mail by editing the entries that begin with \"`DR`\", \"`DH`\", and \"`DM`\"\
    \ in `/etc/sendmail.cf:`\n\n```\n DRyour.mailserver.com\n    DHyour.mailserver.com\n\
    \    DMyour.mailserver.com\n```\n\nThis will handle unqualified addresses (those\
    \ without any @domain portion), local addresses (user@host without any domain\
    \ information) and sets the masquerade address, respectively. Save `/etc/mail/sendmail.cf`\
    \ and restart the daemon.\n\n**Option Two:**\n\nThere exists a fairly unknown\
    \ feature of sendmail written exclusively to handle the situation of a local workstation\
    \ relaying all outbound messages through a central SMTP server. The feature is\
    \ called the Null Client Macro File and allows an administrator to create an appropriate\
    \ `sendmail.cf` without all the extra features normally present.\n\nCreate the\
    \ `/etc/mail/null.mc` with the following lines:\n\n```\n OSTYPE ('linux')dnl\n\
    \    DOMAIN ('generic')dnl\n    FEATURE ('nullclient', 'your.mailserver.com')dnl\n\
    \    Define ('confPRIVACY_FLAGS', authwarnings, goaway, restrictmailq, restrictqrun')dnl\n\
    ```\n\nGenerate a new `sendmail.cf` file by running the m4 macro and restart the\
    \ `sendmail` daemon:\n\n```\n [root] # m4 /etc/mail/null.mc > /etc/sendmail.cf\n\
    \    [root] # /etc/rc.d/init.d/sendmail restart\n```\n\n##### 3.2.1.2.2 Set Outbound\
    \ SMTP Server for Mail Clients\n\nAs stated earlier, mail programs like Pine will\
    \ default to using sendmail on the localhost for sending messages. However, Pine\
    \ can be configured to utilize a remote SMTP server, if desired. You can set the\
    \ SMTP server directly from the main menu by selecting \"S\" for setup, then \"\
    C\" for config and then moving down to the field labeled `smtp-server`. Enter\
    \ the hostname of the remote SMTP server here and save your changes. In addition\
    \ to the `smtp-server` field, `personal-name` and `user-domain` can be edited\
    \ to reflect individual needs.\n\nThe SMTP server is set in Netscape Messenger\
    \ by selecting the `Edit -> Preferences`… dialog, selecting `Mail & Newsgroups\
    \ -> Mail Servers` and placing the hostname of the SMTP server in the window under\
    \ `Outgoing Mail Server`. Mozilla Mail is quite similar as are the countless GUI-based\
    \ mail clients available for Linux. The general idea is to locate the mail preferences\
    \ dialog and change the settings to reflect your environment.\n\n#### 3.2.1.3\
    \ Increase Privacy and Security of the Sendmail Daemon\n\nSeveral options are\
    \ available to increase the privacy and security posture of the sendmail daemon.\
    \ By adding particular flags within `/etc/mail/sendmail.mc`, an administrator\
    \ can restrict access to the mail queue, prevent certain commands from being issued\
    \ by remote hosts or tell `sendmail` to insert special headers into a mail message.\
    \ A summary of these flags is presented below but all the options presented below\
    \ are explained in great detail in Chapter 34 of the Bat Book.\n\n*   `authwarnings`\
    \ – this causes sendmail to insert special headers into the mail message that\
    \ advise the recipient of reasons to suspect that the message may not be authentic.\n\
    \n*   `goaway` – a shorthand way to set all of `authwarnings, noexpn, novrfy,\
    \ needmailhelo, needexpnhelo` and `needvrfyhelo`.\n\n*   `restrictmailq` – this\
    \ restricts who may examine the contents of the queue by allowing only those users\
    \ who are in the same group as the group ownership of the mail queue to examine\
    \ its contents.\n\n*   `restrictqrun` – this limits queue processing to root and\
    \ the owner of the queue directory. Any non-privileged user who attempts to process\
    \ the queue will get an error message stating they do not have permission to process\
    \ the queue.\n\nEdit the `‘confPRIVACY_FLAGS’` section of `/etc/mail/sendmail.mc`\
    \ to add the increased privacy and security flags as shown below:\n\n```\n Define\
    \ ('confPRIVACY_FLAGS', authwarnings, goaway, restrictmailq, restrictqrun')dnl\n\
    ```\n\nGenerate a new `sendmail.cf` file by running the m4 macro and restart the\
    \ `sendmail` daemon:\n\n```\n [root] # m4 /etc/mail/sendmail.mc > /etc/sendmail.cf\n\
    \    [root] # /etc/rc.d/init.d/sendmail restart\n```\n\n#### 3.2.1.4 Define Hosts\
    \ Allowed to Relay Mail\n\nStarting with version 8.9 of sendmail, relaying is\
    \ prevented by default. This was done to prevent nefarious entities (e.g. Spammers)\
    \ from being able to relay unsolicited email through a mail gateway that was not\
    \ properly configured. Relaying is controlled through the access database located\
    \ in /etc/mail/access and /etc/mail/access.db, respectively.\n\n##### 3.2.1.4.1\
    \ Check That the Access Database Is Active\n\nTo ensure `sendmail` has the ability\
    \ to use the access database, check for the name of the database in `/etc/sendmail.cf`:\n\
    \n```\n [root] # grep Kaccess /etc/sendmail.cf\n    Kaccess hash /etc/mail/access\n\
    ```\n\nIf the line above isn't found, edit /etc/mail/sendmail.mc and add the following\
    \ build macro:\n\nFEATURE (‘access_db’)dnl\n\nGenerate a new `sendmail.cf` file\
    \ by running the m4 macro and restart the `sendmail` daemon:\n\n```\n [root] #\
    \ m4 /etc/mail/sendmail.mc > /etc/sendmail.cf\n    [root] # /etc/rc.d/init.d/sendmail\
    \ restart\n```\n\n##### 3.2.1.4.2 Create Access Database for Domains Allowed to\
    \ Relay"
