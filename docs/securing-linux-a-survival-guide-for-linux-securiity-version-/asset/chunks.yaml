  trans: "\n\n|  | 注意 | 对于用于软件开发的工作站，核心文件中包含的信息对于追踪代码中的错误非常有价值。既可以不包含该行，或者将单词“hard”更改为“soft”，以便开发者在需要时手动调高限制。\
    \ |\n\n## 2.5 加固（禁用）服务\n\n应当监听网络连接的服务数量取决于系统的类型（即工作站或服务器）以及其任务（即：生产环境 Web 服务器、匿名\
    \ FTP 服务器、开发工作站等）。然而，对于任何给定系统，最安全的态势是仅启用系统完成其任务所必需的服务，并将访问限制仅适用于工作描述中需要这些权限的用户。\n\
    \n### 2.5.1 识别配置为自启动的服务\n\n可以使用命令行工具 `chkconfig` 显示所有运行级别服务的当前配置状态。可以使用两个图形化前端工具来调查服务状态：`ntsysv`（需要安装\
    \ `newt` 包）或 `serviceconf`（需要安装 `Xfree86`、`gtk` 和 `python` 包）。执行以下命令显示当前配置为系统启动时自启动的服务：\n\
    \n```\n[root@localhost]# /sbin/chkconfig --list | grep -e \"\\(:.*on\\|xinetd\
    \ based\\)\"\n    keytable  0:off 1:on 2:on 3:on 4:on 5:on 6:off\n    syslog \
    \  0:off 1:off 2:on 3:on 4:on 5:on 6:off\n    ...\n    xinetd   0:off 1:off 2:off\
    \ 3:on 4:on 5:on 6:off\n    netfs   0:off 1:off 2:on 3:on 4:on 5:on 6:off\n  \
    \  xinetd based services:\n      wu-ftpd: on\n```\n\n### 2.5.2 创建应该启动的服务列表\n\n\
    下面描述的部分或全部服务可能出现在之前的 `chkconfig` 命令的输出中。\n\n#### 2.5.2.1 独立服务\n\n每个系统都应该运行的服务列表很短。它们下表所示：\n\
    \n表 2-2：应该运行的服务\n\n| 服务名称 | 作用（查看 `/etc/init.d/servicename`） |\n| --- | --- |\n\
    | `keytable` | `为系统加载键盘映射` |\n| `syslog` | `激活其他守护进程用于记录消息的守护进程` |\n| `network`\
    \ | `启动网络接口` |\n| `random` | `提高随机数生成的质量（对于加密网络数据的应用程序非常重要） |\n| `crond` | `启用用于调度作业的\
    \ cron 守护进程` |\n| `anacron` | `管理在系统停机期间本应运行的 cron 作业` |\n| `iptables` | `加载 iptables\
    \ 主机防火墙（如果已配置——见第 2.2.3 节） |\n| `ntpd` | `控制系统时同步` |\n\n##### 2.5.2.1.1 gpm\n\n\
    为控制台模式的文本应用程序添加鼠标支持。如果这是一个工作站且安装了 X-Windows，则该服务应关闭状态，并且可以安全地删除 rpm 包 `gpm`。如果这是一个没有\
    \ X-Windows 的服务器且希望在控制台使用鼠标支持，则该服务应开启状态。\n\n##### 2.5.2.1.2 sshd\n\n`sshd` 服务加密所有网络通信，并为远程用户提供交互式\
    \ shell 和文件传输访问。注意，当本地用户使用 `ssh` 或 `scp` 命令从此系统向外连接到另一个系统时，**不需要** `sshd` 服务。如果用户需要远程访问系统，则应将\
    \ `sshd` 服务配置为开启，以便它在系统启动时启动。\n\n##### 2.5.2.1.3 kudzu\n\n`kudzu` 服务启用自动检测和配置系统硬件变化。如果配置为自启动，它将在每次系统启动时探测系统的硬件变化。如果硬件变化发生并不频繁，则该服务应关闭状态。注意，可以使用以下命令随时启动\
    \ `kudzu` 来检测新硬件：\n\n```\n[root@localhost]# /etc/init.d/kudzu start\n```\n\n#####\
    \ 2.5.2.1.4 xinetd\n\n`xinetd` 服务管理许多常用服务的运行和启动。如果不需要开启任何由 `xinetd` 控制的服务，则 `xinetd`\
    \ 服务应关闭状态，并且可以安全地删除 rpm 包 `xinetd`。注意，对于大多数工作站，此服务可能应该是关闭的。\n\n#### 2.5.2.2 基于\
    \ xinetd 的服务\n\n##### 2.5.2.2.1 telnet\n\n`telnet` 服务提供系统的远程 shell 访问，但不会验证源主机的身份，也不会对跨网络发送的数据加密。该服务本质上是不安全的，不应用于跨越互联网的连接。`telnet`\
    \ 应关闭状态，并且可以安全地删除 rpm 包 `telnet-server`。注意，即使服务被禁用，用户仍然可以使用 `telnet` 客户端进行向外连接。\n\
    \n##### 2.5.2.2.2 wu-ftpd\n\n`wu-ftpd` 为远程用户提供文件传输协议服务，用于将文件传输到系统，而无需验证源主机的身份或加密跨网络发送的数据。该服务本质上是不安全的，通常不应用于跨越互联网的连接。主要的例外是用于发布源代码和补丁的匿名\
    \ FTP 服务器。除非该系统是 FTP 服务器，否则 `wu-ftpd` 应关闭状态，并可以安全地删除 rpm 包 `wu-ftpd` 和 `anonftp`。\n\
    \n##### 2.5.2.2.3 rlogin, rsh, rexec (BSD r 服务)\n\n所有源自 BSD UNIX 的服务都支持弱 IP 身份验证并以明文跨网络传输数据（即未加密）。`SSH`\
    \ 设计用于替代这些服务的功能，且对系统用户是透明的。这些服务应关闭状态，并可以安全地删除相应的 rpm 包 `rsh-server`。\n\n#####\
    \ 2.5.2.2.4 snmpd 简单网络管理协议守护进程\n\n`snmpd` 服务用于与网络管理软件通信。如果系统不需要与网络应用程序协作，则该服务应关闭状态，并可以安全地删除\
    \ rpm 包 `snmpd`。\n\n如果服务开启，请确保检查 `/etc/snmpd/snmpd.conf` 文件。文件中的设置控制谁可以访问 `snmpd`\
    \ 代理以及代理提供的信息级别。更多信息请参见 `snmpd.conf(5)` 手页。\n\n##### 2.5.2.2.5 tftp 简单文件传输协议\n\
    \n`tftp` 服务允许在无身份凭据的情况下进行文件传输。该协议常见的用途是网络设备在启动序列期间从网络下载配置文件。除非该系统是启动服务器，否则 `tftp`\
    \ 应关闭状态，并可以安全地删除 rpm 包 `tftp-server`。\n\n### 2.5.3 禁用并移除不需要启动的服务\n\n任何不需要的服务都应该停止并配置为启动时不运行：\n\
    \n```\n[root@localhost]# /etc/init.d/ servicename stop\n    [root@localhost]#\
    \ /sbin/chkconfig --level 0123456 servicename off```\n\n在命令中，将 `servicename` 替换为上方列表左侧列的服务名称（例如\
    \ `netfs` 或 `wuftp`）。对每个服务重复此命令。\n\n应使用命令移除服务对应的 rpm 包：\n\n```\n[root@localhost]#\
    \ /bin/rpm -e packagename\n```\n\n在命令中，将 `packagename` 替换为服务所属的 rpm 包名称。\n\n可以使用以下命令确定拥有文件的包：\n\
    \n```\n[root@localhost]# rpm --qf /etc/init.d/servicename\n```\n\n### 2.5.4 [可选]\
    \ 验证运行级别服务的配置\n\n"
- fmt: "\nRepeat Step 2.5.1 and verify that the list of services that are configured\
    \ to be on matches the list expected for the system.\n\n### 2.5.5 Configure Access\
    \ to Any Enabled Services\n\n#### 2.5.5.1 TCP Wrappers ([ftp://ftp.porcupine.org/pub/security/index.html](ftp://ftp.porcupine.org/pub/security/index.html))\n\
    \nAccess control to services compiled with TCP wrappers support is implemented\
    \ by the `/etc/hosts.allow` and `/etc/hosts.deny` files. When a connection attempt\
    \ is made, the `hosts.allow` file is checked. If a line is matched, the connection\
    \ is allowed. Then the `hosts.deny` file is consulted, if a line is matched, the\
    \ connection is denied. If no matches have occurred in either file, the connection\
    \ is allowed.\n\n##### 2.5.5.1.1 Create Authorized Use Only Banners\n\nIf configured\
    \ as described below, TCP wrappers will display a warning banner to any user attempting\
    \ to connect to a service it monitors. The following set of commands generate\
    \ the directory `/etc/banners`, and the files therein contain warning banner text\
    \ for each service. In this example, the banner text is \"Use of this system is\
    \ restricted to authorized users.\" Note that exact wording of a warning banner\
    \ is site specific; however, it should at least emphasize that the use of the\
    \ system is restricted to authorized persons and that consent to monitor activities\
    \ is implied by logging in to the system.\n\n```\n[root@localhost]# /bin/mkdir\
    \ -p /etc/banners\n[root@localhost]# /bin/echo \"Use of this system is restricted\
    \ to authorized users\" > /etc/banners/\nprototype\n[root@localhost]# cd /etc/banners\
    \ ; /usr/bin/make -f /usr/share/doc/tcp_wrappers-7.6/Banners.Makefile\n```\n\n\
    ##### 2.5.5.1.2 Deny Everything Except What is Explicitly Allowed\n\nIn order\
    \ to implement the security best practice stance of deny everything except what\
    \ is explicitly allowed, issue the following command.\n\n```\n[root@localhost]#\
    \ echo 'ALL: ALL: spawn (/bin/echo -e '/bin/date'\"\\n%c attempted connection\
    \ to %s\n    and was denied\" \\\n    > | /bin/mail -s \"Connection attempt to\
    \ %s\" root) &' > /etc/hosts.deny\n```\n\nAny connection attempt not listed in\
    \ the `hosts.allow` file will be denied, a message will be logged to the syslog\
    \ auth facility, and an email will be sent to root.\n\n##### 2.5.5.1.3 Allow Access\
    \ to Those Who Require It\n\nEdit the `hosts.allow` file and add a line for each\
    \ service to which access should be allowed. A few examples are shown below (See\
    \ the man pages for `hosts.allow` for more detail).\n\n```\n ALL: LOCAL : banners\
    \ /etc/banners            # All services from local clients (hostnames with no\
    \ \".\")\n    sshd: 10.1.1.0/255.255.254.0 : banners /etc/banners # SSH connections\
    \ from host IP addresses\n    between 10.1.1.0 and 10.1.2.0\n```\n\n#### 2.5.5.2\
    \ xinetd\n\nIf `xinetd` has been disabled or removed (typically the case for workstations),\
    \ this step should be skipped.\n\nThe `xinetd` service provides access control\
    \ to the services that it manages. There should be one file in the `/etc/xinetd.d`\
    \ directory for each service. To control access to a service, find the file with\
    \ the service name and add the following line somewhere between the start and\
    \ end bracket.\n\n```\nonly_from =   10.1.1.0/23      # allow connections from\
    \ host IP addresses between 10.1.1.0 and 10.1.2.0\n```\n\n### 2.5.6 (Servers Only)\
    \ Disable X Windows\n\nServer systems that do not usually have operators working\
    \ from the console should not run the X Windows service. Issue the following command\
    \ to configure the system to boot to run level 3 (multi-user mode with no X) instead\
    \ of run level 5 (multi-user mode with X) and save the original `/etc/inittab`\
    \ as `/etc/inittab.bak`.\n\n```\n[root@localhost]# /usr/bin/perl -p -i.bak -e\
    \ 's/id:5:init/id:3:init/' /etc/inittab\n```\n\n## 2.6 APPLYING UPDATES AND PATCHES\n\
    \nIt is highly recommended that you configure the system to automatically check\
    \ for availability of updated RPM packages. This will increase the likelihood\
    \ that you will be able to patch the system and close any security holes that\
    \ have been discovered before someone with malicious intent can use them to compromise\
    \ the integrity of your system or data.\n\n### 2.6.1 Up2date ([http://www.redhat.com/docs/manuals/RHNetwork/ref-guide/](http://www.redhat.com/docs/manuals/RHNetwork/ref-guide/))\n\
    \nFor Red Hat 7.3, automatic checking for security updates is controlled by the\
    \ Red Hat Network Daemon `rhnsd`. By default, the daemon will attempt to connect\
    \ to a Red Hat server every 120 minutes to check for available package updates,\
    \ download and install any updates for packages that are properly signed and are\
    \ already installed on the system (except those whose name starts with the string\
    \ \"kernel\"), then email the root user with results. Note that the use of the\
    \ `up2date` service that exceeds one user with one system requires payment of\
    \ a subscription fee.\n\n#### 2.6.1.1 Register the System with the Red Hat Network\n\
    \nFor Red Hat 7.3, automatic checking for security updates is controlled by the\
    \ Red Hat Network Daemon `rhnsd`. By default, the daemon will attempt to connect\
    \ to a Red Hat server every 120 minutes to check for available package updates,\
    \ download and install any updates for packages that are properly signed and are\
    \ already installed on the system (except those whose name starts with the string\
    \ \"kernel\"), then email the root user with results. Note that the use of the\
    \ `up2date` service that exceeds one user with one system requires payment of\
    \ a subscription fee.\n\nThe following command starts the Red Hat Network and\
    \ initiates the process of creating a system profile. The client prompts the user\
    \ to create an account (i.e., username and password), then probes the system for\
    \ hostname, IP address, RAM, PCI devices, disk sizes, and mount points.\n\n```\n\
    [root@localhost]# /usr/sbin/rhn_register\n```\n\n#### 2.6.1.2 Verify Set-up by\
    \ Manually Checking for Updates\n\nOnce the system is registered and the profile\
    \ has been created, run the following commands:\n\n```\n[root@localhost]# /usr/sbin/up2date\
    \ --nox -p\n[root@localhost]# /usr/sbin/up2date --nox --u\n```\n\nThe first command\
    \ will update the packages associated with the system on the Red Hat Network,\
    \ and the second will install the package updates.\n\n#### 2.6.1.3 Ensure That\
    \ the rhnsd Is Configured to Start When Boots\n\n```\n[root@localhost]# /sbin/chkconfig\
    \ rhnsd\n[root@localhost]# /etc/init.d/rhnsd start\n```\n\n### 2.6.2 autorpm ([http://www.autorpm.org/](http://www.autorpm.org/))\n\
    \nAutorpm is a viable, free alternative to up2date. It is written in PERL and\
    \ can be run in interactive mode, passed command-line options, or called directly\
    \ from a script. The default installation will check a mirror site daily and email\
    \ the root user with results. Although autorpm can be configured to automatically\
    \ install rpm, by default none will be installed without user interaction.\n\n\
    #### 2.6.2.1 Download and Install the Latest Stable RPM\n\nThe latest stable rpm\
    \ package for autorpm (2.9.3 at the time of this writing) can be downloaded from\
    \ [http://www.autorpm.org/tabs/download/](http://www.autorpm.org/tabs/download/).\
    \ Once the package has been downloaded, install it using the following command:\n\
    \n```\n[root@localhost]# /bin/rpm -i autorpm-2.9.3-1.noarch.rpm\n```\n\n#### 2.6.2.2\
    \ Modify the `/etc/autorpm.d/redhat-updates.conf` file\n\nBy default, rpm packages\
    \ that fail the signature check will be placed in the interactive queue. To prevent\
    \ these suspect rpm packages from getting installed later, add the following line\
    \ to the `action(updated)` stanza after the line `PGP_Require(Yes);`:\n\n```\n\
    PGP_Fail_Install(No);\n```\n\nBy default, any updates for rpm packages that are\
    \ on the mirror site, but do not have a corresponding earlier version already\
    \ installed on the system will be added to the interactive queue. To prevent this\
    \ from happening, find the `action(new)` stanza and change the line `Install(Interactive);`\
    \ to `Install(No);`.\n\n#### 2.6.2.3 Verify Set-up by Manually Checking for Updates\n\
    \nRun the autorpm command with no arguments. The first time you run the command\
    \ you will be offered a chance to see an explanation of how autorpm works and\
    \ encouraged to download TermReadlineGnu. Accept the download. The package will\
    \ be installed and autorpm will exit. Check for updates by issuing the command:\n"
  raw: "Repeat Step 2.5.1 and verify that the list of services that are configured\
    \ to be on matches the list expected for the system.\n\n### 2.5.5 Configure Access\
    \ to Any Enabled Services\n\n#### 2.5.5.1 TCP Wrappers ([ftp://ftp.porcupine.org/pub/security/index.html](ftp://ftp.porcupine.org/pub/security/index.html))\n\
    \nAccess control to services compiled with TCP wrappers support is implemented\
    \ by the /etc/hosts.allow and /etc/hosts.deny files. When a connection attempt\
    \ is made, the hosts.allow file is checked. If a line is matched, the connection\
    \ is allowed. Then the hosts.deny file is consulted, if a line is matched, the\
    \ connection is denied. If no matches have occurred in either file, the connection\
    \ is allowed.\n\n##### 2.5.5.1.1 Create Authorized Use Only Banners\n\nIf configured\
    \ as described below, TCP wrappers will display a warning banner to any user attempting\
    \ to connect to a service it monitors. The following set of commands generate\
    \ the directory `/etc/banners`, and the files therein contain warning banner text\
    \ for each service. In this example, the banner text is \"Use of this system is\
    \ restricted to authorized users.\" Note that exact wording of a warning banner\
    \ is site specific; however, it should at least emphasize that the use of the\
    \ system is restricted to authorized persons and that consent to monitor activities\
    \ is implied by logging in to the system.\n\n```\n [root@localhost]# /bin/mkdir\
    \ -p /etc/banners\n    [root@localhost]# /bin/echo \"Use of this system is restricted\
    \ to authorized users\" > /etc/banners/\n    prototype\n    [root@localhost]#\
    \ cd /etc/banners ; /usr/bin/make -f /usr/share/doc/tcp_wrappers-7.6/Banners.Makefile\n\
    ```\n\n##### 2.5.5.1.2 Deny Everything Except What is Explicitly Allowed\n\nIn\
    \ order to implement the security best practice stance of deny everything except\
    \ what is explicitly allowed, issue the following command.\n\n```\n [root@localhost]#\
    \ echo 'ALL: ALL: spawn (/bin/echo -e '/bin/date'\"\\n%c attempted connection\
    \ to %s\n    and was denied\" \\\n    > | /bin/mail -s \"Connection attempt to\
    \ %s\" root) &' > /etc/hosts.deny\n```\n\nAny connection attempt not listed in\
    \ the hosts.allow file will be denied, a message will be logged to the syslog\
    \ auth facility, and an email will be sent to root.\n\n##### 2.5.5.1.3 Allow Access\
    \ to Those Who Require It\n\nEdit the hosts.allow file and add a line for each\
    \ service to which access should be allowed. A few examples are shown below (See\
    \ the man pages for hosts.allow for more detail).\n\n```\n ALL: LOCAL : banners\
    \ /etc/banners            # All services from local clients (hostnames with no\
    \ \".\")\n    sshd: 10.1.1.0/255.255.254.0 : banners /etc/banners # SSH connections\
    \ from host IP addresses\n    between 10.1.1.0 and 10.1.2.0\n```\n\n#### 2.5.5.2\
    \ xinetd\n\nIf xinetd has been disabled or removed (typically the case for workstations),\
    \ this step should be skipped.\n\nThe xinetd service provides access control to\
    \ the services that it manages. There should be one file in the /etc/xinetd.d\
    \ directory for each service. To control access to a service, find the file with\
    \ the service name and add the following line somewhere between the start and\
    \ end bracket.\n\n```\n only_from =   10.1.1.0/23      # allow connections from\
    \ host IP addresses between 10.1.1.0 and 10.1.2.0\n```\n\n### 2.5.6 (Servers Only)\
    \ Disable X Windows\n\nServer systems that do not usually have operators working\
    \ from the console should not run the X Windows service. Issue the following command\
    \ to configure the system to boot to run level 3 (multi-user mode with no X) instead\
    \ of run level 5 (multi-user mode with X) and save the original /etc/inittab as\
    \ /etc/inittab.bak\n\n```\n [root@localhost]# /usr/bin/perl -p -i.bak -e 's/id:5:init/id:3:init/'\
    \ /etc/inittab\n```\n\n## 2.6 APPLYING UPDATES AND PATCHES\n\nIt is highly recommended\
    \ that you configure the system to automatically check for availability of updated\
    \ RPM packages. This will increase the likelihood that you will be able to patch\
    \ the system and close any security holes that have been discovered before someone\
    \ with malicious intent can use them to compromise the integrity of your system\
    \ or data.\n\n### 2.6.1 Up2date ([http://www.redhat.com/docs/ manuals/RHNetwork/ref-guide/](http://www.redhat.com/docs/manuals/RHNetwork/ref-guide/))\n\
    \nFor Red Hat 7.3, automatic checking for security updates is controlled by the\
    \ Red Hat Network Daemon rhnsd. By default, the daemon will attempt to connect\
    \ to a Red Hat server every 120 minutes to check for available package updates,\
    \ download and install any updates for packages that are properly signed and are\
    \ already installed on the system (except those whose name starts with the string\
    \ \"kernel\"), then email the root user with results. Note that the use of the\
    \ up2date service that exceeds one user with one system requires payment of a\
    \ subscription fee.\n\n#### 2.6.1.1 Register the System with the Red Hat Network\n\
    \nThe following command starts the Red Hat Network registration client and initiates\
    \ the process of creating a system profile for the up2date service. The client\
    \ prompts the user to create an account (i.e., username and password combination),\
    \ then probes the system for the Red Hat version, hostname, IP address, CPU information,\
    \ RAM, PCI devices, disk sizes, and mount points.\n\n```\n [root@localhost]# /usr/sbin/rhn_register\n\
    ```\n\n#### 2.6.1.2 Verify Set-up by Manually Checking for Updates\n\nOnce the\
    \ system is registered and the profile has been created, run the following commands:\n\
    \n```\n [root@localhost]# /usr/sbin/up2date --nox -p\n    [root@localhost]# /usr/sbin/up2date\
    \ --nox --u\n```\n\nThe first command will update the packages associated with\
    \ the system profile on the Red Hat Network, and the second will download and\
    \ install the package updates for the system.\n\n#### 2.6.1.3 Ensure That the\
    \ rhnsd Is Configured to Start When the System Boots\n\n```\n [root@localhost]#\
    \ /sbin/chkconfig rhnsd on\n    [root@localhost]# /etc/init.d/rhnsd start\n```\n\
    \n### 2.6.2 autorpm ([http://www. autorpm.org/](http://www.autorpm.org/))\n\n\
    Autorpm is a viable, free alternative to up2date. It is written in PERL and can\
    \ be run in interactive mode, passed command-line options, or called directly\
    \ from a script. The default installation will check a Red Hat mirror site daily,\
    \ download any rpm that is an updated version of one that is on the system (ignoring\
    \ packages starting with the string \"kernel-\"), check the package signature,\
    \ and email the root user with results. Although autorpm can be configured to\
    \ automatically install rpm updates, by default none will be installed without\
    \ user interaction.\n\n#### 2.6.2.1 Download and Install the Latest Stable Binary\
    \ RPM\n\nThe latest stable rpm package for autorpm (2.9.3 at the time of this\
    \ writing) can be downloaded from [http://www.autorpm.org/tabs/download/](http://www.autorpm.org/tabs/download/).\
    \ Once the package has been downloaded, install it using the following command:\n\
    \n```\n [root@localhost]# /bin/rpm -i autorpm-2.9.3-1.noarch.rpm\n```\n\n####\
    \ 2.6.2.2 Modify the */etc/autorpm.d/redhat-updates.conf* file\n\nBy default,\
    \ rpm packages that fail the signature check will be placed in the interactive\
    \ queue. To prevent these suspect rpm packages from getting accidentally installed\
    \ later, add the following line to the *action(updated)* stanza after the line\
    \ *PGP_Require(Yes);:*\n\n```\n PGP_Fail_Install(No);\n```\n\nBy default, any\
    \ updates for rpm packages that are on the mirror site, but do not have a corresponding\
    \ earlier version already installed on the system will be added to the interactive\
    \ queue. To prevent this from happening, find the *action(new)* stanza and change\
    \ the line *Install(Interactive);* to *Install(No);*.\n\n#### 2.6.2.3 Verify Set-up\
    \ by Manually Checking for Updates\n\nRun the autorpm command with no arguments.\
    \ The first time you run the command you will be offered a chance to see an explanation\
    \ of how autorpm works and encouraged to download TermReadlineGnu. Accept the\
    \ download. The package will be installed and autorpm will exit. Check for updates\
    \ by issuing the command:"
