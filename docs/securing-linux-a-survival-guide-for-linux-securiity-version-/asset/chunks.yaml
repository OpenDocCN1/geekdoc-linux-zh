    ```\n\n### 3.3.2 NFS Security\n\nThe words \"NFS\" and \"security\" are not usually\
    \ used in the same sentence together, unless it's a discussion of the lack of\
    \ the latter in the former. There are times, however, when NFS is the simplest\
    \ answer to solving a problem: sharing filesystems between multiple servers is\
    \ never a simple problem, and NFS is sometimes the path of least resistance. The\
    \ following section should assist administrators in securing this service as much\
    \ as possible without vast complication.\n\nWe'll discuss two possible configurations:\
    \ one featuring a transient filesystem that is only mounted when needed, and one\
    \ featuring a more permanent filesystem mount, such as a shared set of home directories\
    \ or system library or binary directories for thin clients.\n\n#### 3.3.2.1 NFS\
    \ Server Security"
