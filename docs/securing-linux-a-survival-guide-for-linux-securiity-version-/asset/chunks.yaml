    \            [user@host .ssh]$ mv ../id_dsa.pub ./authorized_keys2\n         \
    \   [user@host .ssh]$ chmod 600 authorized_keys2\n    ```\n\n    That should do\
    \ it! If you entered a passphrase to encrypt the DSA keypair, you'll have to enter\
