  raw: "```\n /usr/local/bind/sbin/named-checkconf -t /usr/local/bind /etc/named.conf\n\
    ```\n\nNow check each of the zone files, using the following syntax:\n\n```\n\
    \ /usr/local/bind/sbin/named-checkzone 0.0.127.in-addr.arpa /usr/local/bind/named/local/\n\
    ```\n\nYou should see in response:\n\n```\n zone 0.0.127.in-addr.arpa/IN: loaded\
    \ serial 42\n    OK\n```\n\nNote that the serial number will vary according to\
    \ what's in the zone file. Now check the chaos zone we're using (if you've opted\
    \ to use it):\n\n```\n /usr/local/bind/sbin/named-checkzone -c chaos bind /usr/local/bind/named/local/chaos\n\
    ```\n\nYou should see in response:\n\n```\n zone bind/CH: loaded serial 42\n \
    \   OK\n```\n\n#### 3.4.1.5 Start Daemon with Chroot Manually and Test Lookups\n\
    \nTest that everything is working by manually loading the server and testing to\
    \ ensure you can look up records. You may need to connect your system to the network\
    \ at this point if you want to verify that you can look up actual Internet records.\n\
    \n```\n /usr/local/bind/sbin/named -u dns -t /usr/local/bind -c /etc/named.conf\n\
    ```\n\nYou can test the server by specifying it on the command line as a second\
    \ argument to the `host` command (note that \"nslookup\" is deprecated, and may\
    \ be removed from future releases of BIND, so now's the time to get in the habit\
    \ of using something else instead!):\n\n```\n host 127.0.0.1 1.3.5.50\n```\n\n\
    You should see in response:\n\n```\n Using domain server:\n    Name: 1.3.5.50\n\
    \    Address: 1.3.5.50#53\n    Aliases:\n\n    1.0.0.127.in-addr.arpa domain name\
    \ pointer localhost\n```\n\n#### 3.4.1.6 Create Startup Files and Add to rc.d\
    \ Hierarchy\n\nCopy the sample `named` startup script that appears at the end\
    \ of this section to `/etc/init.d` (or write your own), and add it into the startup\
    \ hierarchy using `chkconfig` :\n\n```\n /sbin/chkconfig ---level 2345 ---add\
    \ named\n```\n\n### 3.4.2 Zone Hosting Service\n\nThis configuration will differ\
    \ only a little from the previous, so comments have been included only where commands\
    \ or instructions differ from what's been provided above. The primary difference\
    \ with this configuration is that this server will not cache entries: its only\
    \ job is to answer queries from other servers for domains it knows about, but\
    \ not to make recursive queries to other servers. This server might live on a\
    \ DMZ and be exposed to the Internet for incoming queries about the domains it\
    \ hosts, and thus should never be simultaneously used to query out to the Internet\
    \ for other domains on behalf of clients. This separation of duties will help\
    \ keep attacks on your primary nameservers from affecting your inbound clients,\
    \ possibly subjecting them to cache poisoning attacks that could lead to further\
    \ breaches.\n\nMany organizations choose to layer their DNS servers with a core\
    \ DNS server that is configured as primary for all of the organization's domains.\
    \ This master server is never exposed to the Internet, however: it will answer\
    \ queries only from the perimeter DNS servers controlled by the organizations.\
    \ These perimeter hosts are then *configured* to be secondary servers (they perform\
    \ zone transfers against the master) but are *listed* on the Internet as primary\
    \ for the organization: machines on the Internet will query them for information\
    \ about the organization's domains. This setup can help minimize the damage from\
    \ an attack, since the compromised secondary can be replaced with a duplicate\
    \ machine and simply instructed to zone-transfer its information from the master,\
    \ allowing it to be placed in service more quickly. This also means that an attack\
    \ that changes a record will only do so on the secondary server: the change will\
    \ be overwritten by the next zone transfer that occurs.\n\n#### 3.4.2.1 Unpack\
    \ Sources and Compile\n\n```\n tar --zxvf bind-9.2.1.tar.gz\n    cd bind-9.2.1\n\
    \    mkdir /usr/local/bind\n\n    ./configure ---with-openssl ---with-randomdev=/dev/random\n\
    \    make\n    make install DESTDIR=/usr/local/bind\n```\n\n#### 3.4.2.2 Set Up\
    \ Chroot Jail Environment\n\n```\n cd /usr/local/bind\n```\n\nNotice the addition\
    \ of the master and slave directories to contain zone files: `master` will contain\
    \ zone files for domains for which this is the primary DNS server, and `slave`\
    \ will contain the files for those domains for which this is a secondary server.\n\
    \n```\n mkdir -p dev etc named/local named/master named/slave var/run\n\n    useradd\
    \ -s /dev/null -d /usr/local/bind dns\n    groupadd dns\n```\n\nIn order to facilitate\
    \ zone transfers, the server will need to be able to write zones into the `slave`\
    \ directory, and to make changes to those files when adding or removing entries\
    \ as a result of a zone transfer.\n\n```\n chown -R dns:dns /usr/local/bind/named/slave\n\
    \    chown -R dns:dns /usr/local/bind/named/var/run\n\n    mknod /usr/local/bind/dev/null\
    \ c 1 3\n    mknod /usr/local/bind/dev/random c 1 8\n    chmod 666 /usr/local/bind/dev/null\
    \ /usr/local/bind/dev/random\n    cp /lib/libcrypto.so.2 /usr/local/bind/lib\n\
    \    cp /lib/libnsl.so.1 /usr/local/bind/lib\n    cp /lib/libc.so.6 /usr/local/bind/lib\n\
    \    cp /lib/libdl.so.2 /usr/local/bind/lib\n    cp /lib/ld-linux.so.2 /usr/local/bind/lib\n\
    \    cp /etc/localtime /usr/local/bind/etc\n\n    edit /etc/sysconfig/syslog:\n\
    \     SYSLOGD_OPTIONS=\"-m 0\"\n     becomes\n     SYSLOGD_OPTIONS=\"-m 0 -a /usr/local/bind/dev/log\"\
    \n\n     chown root /usr/local/bind /usr/local/bind/named/local\n     chmod 700\
    \ /usr/local/bind\n     chown dns:dns /usr/local/bind/named\n     chmod 700 /usr/local/bind/named\n\
    \     chmod 755 /usr/local/bind/named/local\n     chmod 444 /usr/local/bind/named/local/*\n\
    \     chown root /usr/local/bind/etc/named.conf\n     chmod 644 /usr/local/bind/etc/named.conf\n\
    \     chattr +i /usr/local/bind/etc/localtime /usr/local/bind/etc /usr/local/bind/var\n\
    \     chattr +i /usr/local/bind/etc/named.conf /usr/local/bind/named/local/*\n\
    \n     chattr +i /usr/local/bind/etc/named.conf /usr/local/bind/named/local/*\n\
    ```\n\n#### 3.4.2.3 Create and Edit Main Configuration File"
