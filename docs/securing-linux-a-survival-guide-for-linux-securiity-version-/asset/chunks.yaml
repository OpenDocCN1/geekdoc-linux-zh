  trans: "\n\n### 2.3.3 警告横幅 (Warning Banners)\n\n人们普遍认为，在登录时显示某种法律警告信息有助于对计算机系统的入侵者进行起诉。更改登录横幅的额外益处还隐藏了操作系统版本信息和其他详细系统信息，攻击者在进行目标攻击时可能会发现这些信息有用。显然，在对横幅进行任何更改之前，组织的法律顾问应该审查所有此类警告信息的内容。\n\
    \n编辑 `/etc/motd`、`/etc/issue` 和 `/etc/issue.net` 以反映适用于组织的适当警告消息并保存更改。示例例如：\n\n\
    ```\n 本系统仅供授权用户使用。所有活动均可能被监控和/或记录\n```\n\n下面列出了每个文件的功能说明：\n\n*   `/etc/motd` –\
    \ 此文件在用户成功登录系统后显示“每日消息 (message of the day)”。\n*   `/etc/issue` – 此文件显示给任何本地登录系统的用户。\n\
    *   `/etc/issue.net` – 此文件显示给那些通过 `SSH`、`Telnet` 或 `FTP` 远程登录的用户。\n\n| | 注意事项\
    \ | | 较旧版本的 Red Hat Linux 在 `/etc/rc.d/rc.local` 中包含命令，这些命令每次系统启动时都会覆盖 `/etc/issue`\
    \ 和 `/etc/issue.net`。这些命令在 Red Hat 7.3 版本中不存在；因此，修改列出的文件足以显示适当的警告横幅。 |\n\n###\
    \ 2.3.4 密码保护单用户模式\n\nLinux 提供通过“单用户模式 (Single User Mode)”进行维护的机制，该模式通常在系统启动时启动。这允许控制台前的攻击者绕过任何系统保护并以\
    \ root 身份进入运行级别 1。其后果是严重的，有必要对单用户模式进行密码保护以防止这种情况的发生。\n\n编辑 `/etc/inittab` 以反映以下更改：\n\
    \n```\n id:3:initdefault:\n    ~~:S:wait:/sbin/sulogin\n```\n\n保存更改并重启服务：\n\n\
    ```\n [root] # /sbin/init q\n```\n\n## 2.4 用户账户安全\n\n应采取以下步骤来提高系统中用户账户的安全性。\n\n\
    ### 2.4.1 密码有效期 (Password Aging)\n\n默认情况下，Red Hat 7.3 要求用户每 99999 天更改一次密码（即永不更改），并且未对密码更改前的保留时间设置最小限制。执行以下命令为\
    \ ID 大于 500 的所有现有用户设置限制（500 是普通用户账户的默认范围）。\n\n```\n [root@localhost]# awk -F:\
    \ '$3 >= 500 { system (\"chage -M 180 -m 2 \" $1) }' /etc/passwd\n```\n\n更改 `/etc/login.defs`\
    \ 中的以下行，以便新创建的用户账户将继承这些值。\n\n```\n PASS_MAX_DAYS  99999 -> PASS_MAX_DAYS    180\n\
    \    PASS_MIN_DAYS  0      -> PASS_MIN_DAYS   2\n```\n\n### 2.4.2 清理不需要账户\n\n\
    安装时会向系统添加几个不需要的用户账户。为了更好的系统安全，`/etc/passwd` 文件中的用户数量应保持到系统完成任务所需的最少数量。这将更容易检测任何未经授权的用户添加。在进行任何编辑之前，请将文件复制到备份版本：\n\
    \n```\n [root@localhost]#for file in /etc/{passwd,shadow,group} ; do /bin/cp -p\
    \ $file $file.orig ; done\n```\n\n使用以下命令删除不需要用户的账户：\n\n```\n [root@localhost]#\
    \ for user in uucp operator games gopher ; do /usr/sbin/userdel $user ; done\n\
    ```\n\n使用以下命令删除不需要的组：\n\n```\n [root@localhost]# for group in dip gopher games\
    \ uucp; do /usr/sbin/groupdel $group ; done\n```\n\n每当删除用户或组时，执行以下验证步骤是明智的。首先，为了验证是否存在会导致用户无法登录的错误，运行以下命令：\n\
    \n```\n [root@localhost]# /usr/sbin/pwck\n    [root@localhost]# /usr/sbin/grpck\n\
    ```\n\n`pwck` 和 `grpck` 命令分别验证 `/etc/passwd` 和 `/etc/group` 文件格式是否正确，并且每个字段是否具有有效数据。其次，为了验证之前由被删除的用户或组拥的文件已分配给\
    \ root 用户，执行以下命令：\n\n```\n [root@localhost]# /usr/sbin/find / -nouser --exec /bin/chown\
    \ root {} \\;\n    [root@localhost]# /usr/sbin/find / -nogroup --exec /bin/chgrp\
    \ root {} \\;\n```\n\n### 2.4.3 锁定系统账户\n\n某些账户仅供系统服务或守护进程使用，不需要交互式登录。为了增加安全性，应禁用这些账户的交互式登录功能。执行以下命令，为账户分配无效\
    \ shell（即 `/dev/null`），以确保它们被锁定。\n\n```\n [root@localhost]# for user in bin daemon\
    \ adm ftp sync lp mail news nobody ; do /usr/sbin/usermodL-s /dev/null $user ;\
    \ done\n```\n\n### 2.4.4 验证无空密码账户\n\n空密码账户对系统构成了严重风险，因为通过检查 `/etc/shadow` 文件的第二个字段是否为空可以轻松检测到这些账户。执行以下命令：\n\
    \n```\n [root@localhost]# awk -F: '($2 == \"\") { print $1 } /etc/shadow\n```\n\
    \n如果没有输出，说明正常。如果打印了用户名，请为账户设置密码或将其锁定。\n\n### 2.4.5 收紧默认 umask\n\n`umask` 决定了用户创建的新文件的权限。按照安装，普通用户（定义为与组名相同的用户）的默认\
    \ `umask` 为 002（即文件为 `rw-rw-r—`，目录为 `rwxrwxrwx`）。对于其他用户包括 root 用户，它是 022（即文件为\
    \ `rw-r--r—`，目录为 `rwxr-xr-x`）。\n\n为了更高的安全性，root 用户的默认 umask 不应产生 world 可读的文件。普通用户的\
    \ umask 不应产生世界可读的文件。编辑 `/etc/bashrc` 和 `/etc/csh.cshrc` 文件中的行：\n\n```\n Change:\
    \   umask 022    ->    umask 077\n              umask 002    ->    umask 007\n\
    ```\n\n注意：某些 rpm 包假设 root 用户的默认 umask 为 022。在安装或升级这些软件包时偶尔会导致警告信息。\n\n### 2.4.6\
    \ 其他账户限制\n\nLinux 可插入认证模块 (PAM) 软件包允许对用户账户实施许多不同类型的控制。配置文件位于 `/etc/security` 目录。调节系统资源使用的配置文件是\
    \ `limits.conf`，将在下一节讨论。调节授权用户登录来源的配置文件是 `access.conf`，调节何时允许登录的配置文件是 `time.conf`。上述三个文件的默认版本包含附录\
    \ B 中。每个文件都包含实施说明和用法示例。\n\n#### 2.4.6.1 系统资源使用（来自 Bastille）\n\n为了防止单个用户消耗过多系统资源，编辑\
    \ `/etc/security/limits.conf` 文件，使得不会创建核心文件（见下注），单个文件大小限制为 100 MB，且每个用户只能运行 150\
    \ 个并发进程。\n\n添加以下行：\n\n```\n * hard    core   0\n    * hard    fsize  102400\n\
    \    * hard    nproc  150\n```\n\n"
- fmt: "\n|  | Note | For workstations used for software development, the information\
    \ contained in core files is very valuable in tracking down bugs in code. Either\
    \ do not include the line or change the word \"hard\" to \"soft\" so developers\
    \ can manually raise the limit when needed. |\n\n## 2.5 SECURING (DISABLING) SERVICES\n\
    \nThe number of services that should be listening for connections from the network\
    \ depends on the type of system (i.e. workstation or server) and its mission (i.e.\
    \ production web server, anonymous ftp server, development workstation etc.).\
    \ However, the most secure stance for any given system is to only enable services\
    \ that are required for the system to fulfill its mission and restrict access\
    \ to only those whose job description requires it.\n\n### 2.5.1 Identify Services\
    \ That Are Configured to Start\n\nThe command-line tool `chkconfig` can be used\
    \ to show the current configuration state for all run-level services. Two graphical\
    \ front-end tools may be used to investigate status of services: `ntsysv` (requires\
    \ `newt` package be installed) or `serviceconf` (requires `Xfree86`, `gtk`, and\
    \ `python` packages be installed). Issue the following command to show the services\
    \ that are currently configured to start when the system boots:\n\n```\n[root@localhost]#\
    \ /sbin/chkconfig --list | grep -e \"\\(:.*on\\|xinetd based\\)\"\n    keytable\
    \  0:off 1:on 2:on 3:on 4:on 5:on 6:off\n    syslog   0:off 1:off 2:on 3:on 4:on\
    \ 5:on 6:off\n    ...\n    xinetd   0:off 1:off 2:off 3:on 4:on 5:on 6:off\n \
    \   netfs   0:off 1:off 2:on 3:on 4:on 5:on 6:off\n    xinetd based services:\n\
    \      wu-ftpd: on\n```\n\n### 2.5.2 Create a List of Services That Should Be\
    \ Started\n\nSome or all of the services described below may appear in the output\
    \ from the previous `chkconfig` command.\n\n#### 2.5.2.1 Independent Services\n\
    \nThe list of services that should be run for every system is short. They are\
    \ summarized in the table below:\n\nTable 2-2: Services That Should Be Run\n\n\
    | Service Name | What it does (see `/etc/init.d/servicename`) |\n| --- | --- |\n\
    | `keytable` | `Loads keyboard map for the system` |\n| `syslog` | `Activates\
    \ daemon that other daemons use for logging messages` |\n| `network` | `Starts\
    \ network interfaces` |\n| `random` | `Increases quality of random number generation\
    \ (important for applications encrypting network data)` |\n| `crond` | `Enables\
    \ cron daemon used for scheduling jobs` |\n| `anacron` | `Manages execution of\
    \ cron jobs that should have run during system downtime` |\n| `iptables` | `Loads\
    \ the iptables host-based firewall (if configured – see section 2.2.3)` |\n| `ntpd`\
    \ | `Controls system clock synchronization` |\n\n##### 2.5.2.1.1 gpm\n\nAdds mouse\
    \ support for the console mode text-based applications. If this is a workstation\
    \ and X-Windows is installed, then this service should be off and the rpm package\
    \ `gpm` can be safely removed. If this is a server without X-Windows and mouse\
    \ support is desired at the console, this service should be on.\n\n##### 2.5.2.1.2\
    \ sshd\n\nThe `sshd` service encrypts all network communication and provides interactive\
    \ shell and file transfer access for remote users. Note that the `sshd` service\
    \ is NOT required by local users when making outbound connections from this system\
    \ to another system with the `ssh` or `scp` commands. If users will need to access\
    \ the system remotely, the `sshd` service should be configured ON so it will start\
    \ when the system boots.\n\n##### 2.5.2.1.3 kudzu\n\nThe `kudzu` service enables\
    \ automatic detection and configuration of system hardware changes. If configured\
    \ to start, it will probe the system for hardware changes every time the system\
    \ boots. If hardware changes occur only infrequently, then the service should\
    \ be off. Note that `kudzu` can be started started anytime to detect new hardware\
    \ using the following command:\n\n```\n[root@localhost]# /etc/init.d/kudzu start\n\
    ```\n\n##### 2.5.2.1.4 xinetd\n\nThe `xinetd` service manages the operation and\
    \ start-up of many familiar services. If none of the services controlled by `xinetd`\
    \ need to be turned on, the `xinetd` service should be off and the rpm package\
    \ `xinetd` can be safely removed. Note that this service should probably be off\
    \ for most workstations.\n\n#### 2.5.2.2 xinetd-Based Services\n\n##### 2.5.2.2.1\
    \ telnet\n\nThe `telnet` service provides remote shell access to a system without\
    \ verifying the identity of the originating host or encrypting the data sent across\
    \ the network. The service is inherently insecure and should not be used for connections\
    \ across the Internet. `telnet` should be off and the rpm package `telnet-server`\
    \ can be safely removed. Note that users may still use the `telnet` client to\
    \ make outbound connections even if the service is disabled.\n\n##### 2.5.2.2.2\
    \ wu-ftpd\n\nThe `wu-ftpd` provides file transfer protocol service for remote\
    \ users to transfer files to the system without verifying the identity of the\
    \ originating host or encrypting the data sent across the network. The service\
    \ is inherently insecure and, in general, should not be used for connections across\
    \ the Internet. The primary exception is anonymous ftp servers commonly used for\
    \ distribution of software source code and patches. Unless the system is an ftp\
    \ server, `wu-ftpd` should be off and the rpm packages `wu-ftpd` and `anonftp`\
    \ can be safely removed.\n\n##### 2.5.2.2.3 rlogin, rsh, rexec (The Berkeley r-services)\n\
    \nAll of these services originating from BSD UNIX support weak IP based authentication\
    \ and transmit data across the network as clear text (i.e. unencrypted). Note\
    \ that this includes user login names and passwords. `SSH` was designed to duplicate\
    \ the functionality provided by these services and can be configured to replace\
    \ them in a way that is transparent for the system's users. These services should\
    \ be off and the corresponding rpm package `rsh-server` can be safely removed.\n\
    \n##### 2.5.2.2.4 snmpd - Simple Network Management Protocol daemon\n\nThe `snmpd`\
    \ service is used to communicate with network management software. If there is\
    \ no need for the system to cooperate with centralized network applications, the\
    \ service should be off and the rpm package `snmpd` can be safely removed.\n\n\
    If the service is on, be sure to review the `/etc/snmpd/snmpd.conf` file. Settings\
    \ in the file control who has access to the `snmpd` agent and what level of information\
    \ the agent will provide. See the `snmpd.conf(5)` man page for more information.\n\
    \n##### 2.5.2.2.5 tftp - Trivial File Transfer Protocol\n\nThe `tftp` service\
    \ enables file transfers without any authentication credentials. The most common\
    \ use of this protocol is by network devices that need to download configuration\
    \ files from the network during their boot sequence. Unless the system is a boot\
    \ server, `tftp` should be off and the rpm package `tftp-server` can be safely\
    \ removed.\n\n### 2.5.3 Disable and Remove Services That Should Not Started\n\n\
    Any service that is not needed should be stopped and configured not to start on\
    \ boot using the following commands:\n\n```\n[root@localhost]# /etc/init.d/ servicename\
    \ stop\n    [root@localhost]# /sbin/chkconfig --level 0123456 servicename off\
    \ own```\n\nIn the commands, replace `servicename` with the name of a service\
    \ shown in the leftmost column of the list output above (e.g. `netfs` or `wuftp`).\
    \ Repeat the command for each service.\n\nThe rpm package corresponding to the\
    \ service should be removed using the command:\n\n```\n[root@localhost]# /bin/rpm\
    \ -e packagename\n```\n\nIn the command, replace `packagename` with the name of\
    \ the rpm package to which the service belongs.\n\nThe package owning a given\
    \ file can be determined with the following command:\n\n```\n[root@localhost]#\
    \ rpm --qf /etc/init.d/servicename\n```\n\n### 2.5.4 [Optional] Verify Configuration\
    \ of Run-Level Services\n"
  raw: "|  | Note  | For workstations used for software development, the information\
    \ contained in core files is very valuable in tracking down bugs in code. Either\
    \ do not include the line or change the word \"hard\" to \"soft\" so developers\
    \ can manually raise the limit when needed. |\n\n## 2.5 SECURING (DISABLING) SERVICES\n\
    \nThe number of services that should be listening for connections from the network\
    \ depends on the type of system (i.e. workstation or server) and its mission (i.e.\
    \ production web server, anonymous ftp server, development workstation etc.).\
    \ However, the most secure stance for any given system is to only enable services\
    \ that are required for the system to fulfill its mission and restrict access\
    \ to only those whose job description requires it.\n\n### 2.5.1 Identify Services\
    \ That Are Configured to Start\n\nThe command-line tool chkconfig can be used\
    \ to show the current configuration state for all run-level services. Two graphical\
    \ front-end tools may be used to investigate status of services: ntsysv (requires\
    \ newt package be installed) or serviceconf (requires Xfree86, gtk, and python\
    \ packages be installed). Issue the following command to show the services that\
    \ are currently configured to start when the system boots:\n\n```\n [root@localhost]#\
    \ /sbin/chkconfig --list | grep -e \"\\(:.*on\\|xinetd based\\)\"\n    keytable\
    \  0:off 1:on 2:on 3:on 4:on 5:on 6:off\n    syslog   0:off 1:off 2:on 3:on 4:on\
    \ 5:on 6:off\n    ...\n    xinetd   0:off 1:off 2:off 3:on 4:on 5:on 6:off\n \
    \   netfs   0:off 1:off 2:on 3:on 4:on 5:on 6:off\n    xinetd based services:\n\
    \      wu-ftpd: on\n```\n\n### 2.5.2 Create a List of Services That Should Be\
    \ Started\n\nSome or all of the services described below may appear in the output\
    \ from the previous chkconfig command.\n\n#### 2.5.2.1 Independent Services\n\n\
    The list of services that should be run for every system is short. They are summarized\
    \ in the table below:\n\nTable 2-2: Services That Should Be Run\n\n| Service Name\
    \ | What it does (see /etc/init.d/servicename) |\n\n| --- | --- |\n\n| `keytable`\
    \ | `Loads keyboard map for the system` |\n\n| `syslog` | `Activates daemon that\
    \ other daemons use for logging messages` |\n\n| `network` | `Starts network interfaces`\
    \ |\n\n| `random` | `Increases quality of random number generation (important\
    \ for applications encrypting network data)` |\n\n| `crond` | `Enables cron daemon\
    \ used for scheduling jobs` |\n\n| `anacron` | `Manages execution of cron jobs\
    \ that should have run during system downtime` |\n\n| `iptables` | `Loads the\
    \ iptables host-based firewall (if configured – see section 2.2.3)` |\n\n| `ntpd`\
    \ | `Controls system clock synchronization` |\n\n##### 2.5.2.1.1 gpm\n\nAdds mouse\
    \ support for the console mode text-based applications. If this is a workstation\
    \ and X-Windows is installed, then this service should be off and the rpm package\
    \ (*gpm*) can safely be removed. If this is a server without X-Windows and mouse\
    \ support is desired at the console, this service should be on.\n\n##### 2.5.2.1.2\
    \ sshd ([http://www.openssh.org/portable.html](http://www.openssh.org/portable.html))\n\
    \nThe sshd service encrypts all network communication and provides interactive\
    \ shell and file transfer access for remote users. Note that the sshd service\
    \ is NOT required by local users when making outbound connections from this system\
    \ to another system with the ssh or scp commands. If users will need to access\
    \ the system remotely, the sshd service should be configured ON so it will start\
    \ when the system boots.\n\n##### 2.5.2.1.3 kudzu\n\nThe kudzu service enables\
    \ automatic detection and configuration of system hardware changes. If configured\
    \ to start, it will probe the system for hardware changes every time the system\
    \ boots. If hardware changes occur only infrequently, then the service should\
    \ be off. Note that kudzu can be manually started anytime to detect new hardware\
    \ using the following command:\n\n```\n [root@localhost]# /etc/init.d/kudzu start\n\
    ```\n\n##### 2.5.2.1.4 xinetd (http://www.xinetd.org)\n\nThe xinetd service manages\
    \ the operation and start-up of many familiar services (see [next section](#LiB0016.html_ch02lev3sec3)).\
    \ If none of the services controlled by xinetd need to be turned on, the xinetd\
    \ service should be off and the rpm package (xinetd) can safely be removed. Note\
    \ that this service should probably be off for most workstations.\n\n#### 2.5.2.2\
    \ xinetd-Based Services\n\n##### 2.5.2.2.1 telnet\n\nThe telnet service provides\
    \ remote shell access to a system without verifying the identity of the originating\
    \ host or encrypting the data sent across the network. The service is inherently\
    \ insecure and should not be used for connections across the Internet. Telnet\
    \ should be off and the rpm package (telnet-server) can safely be removed. Note\
    \ that users may still use the telnet client to make outbound connections even\
    \ if the service is disabled.\n\n##### 2.5.2.2.2 wu-ftpd ([http://www.wu-ftpd.org](http://www.wu-ftpd.org))\n\
    \nThe wu-ftpd provides file transfer protocol service for remote users to transfer\
    \ files to the system without verifying the identity of the originating host or\
    \ encrypting the data sent across the network. The service is inherently insecure\
    \ and, in general, should not be used for connections across the Internet. The\
    \ primary exception is anonymous ftp servers commonly used for distribution of\
    \ software source code and patches. Unless the system is an ftp server, wu-ftpd\
    \ should be off and the rpm packages (wu-ftpd and anonftp) can safely be removed.\n\
    \n##### 2.5.2.2.3 rlogin, rsh, rexec (The Berkeley r-services)\n\nAll of these\
    \ services originating from BSD UNIX support weak IP based authentication and\
    \ transmit data across the network as clear text (*i.e.* unencrypted). Note that\
    \ this includes user login names and passwords. SSH was designed to duplicate\
    \ the functionality provided by these services and can be configured to replace\
    \ them in a way that is transparent for the system's users. These services should\
    \ be off and the corresponding rpm package (rsh-server) can safely be removed.\n\
    \n##### 2.5.2.2.4 snmpd - Simple Network Management Protocol daemon ([http://www.snmplink.org](http://www.snmplink.org))\n\
    \nThe snmpd service is used to communicate with network management software. If\
    \ there is no need for the system to cooperate with centralized network monitoring\
    \ applications, the service should be off and the rpm package (snmpd) can safely\
    \ be removed.\n\nIf the service is on, be sure to review the `/etc/snmpd/snmpd.conf`\
    \ file. Settings in the file control who has access to the snmpd agent and what\
    \ level of information the agent will provide. See the snmpd.conf(5) man page\
    \ for more information.\n\n##### 2.5.2.2.5 tftp - Trivial File Transfer Protocol\n\
    \nThe tftp service enables file transfers without any authentication credentials.\
    \ The most common use of this protocol is by network devices that need to download\
    \ configuration files from the network during their boot sequence. Unless the\
    \ system is a boot server, tftp should be off and the rpm package (tftp-server)\
    \ can safely be removed.\n\n### 2.5.3 Disable and Remove Services That Should\
    \ Not be Started\n\nAny service that is not needed should be stopped and configured\
    \ not to start on boot using the following commands:\n\n```\n [root@localhost]#\
    \ /etc/init.d/ servicename stop\n    [root@localhost]# /sbin/chkconfig --level\
    \ 0123456 servicename off\n```\n\nIn the commands, replace *servicename* with\
    \ the name of a service shown in the leftmost column of the list output above\
    \ (e.g. netfs or wuftpd). Repeat the command for each service.\n\nThe rpm package\
    \ corresponding to the service should be removed using the command:\n\n```\n [root@localhost]#\
    \ /bin/rpm -e packagename\n```\n\nIn the command, replace *packagename* with the\
    \ name of the rpm package to which the service belongs.\n\nThe package owning\
    \ a given file can be determined with the following command:\n\n```\n [root@localhost]#\
    \ rpm --qf /etc/init.d/servicename\n```\n\n### 2.5.4 [Optional] Verify Configuration\
    \ of Run-Level Services"
