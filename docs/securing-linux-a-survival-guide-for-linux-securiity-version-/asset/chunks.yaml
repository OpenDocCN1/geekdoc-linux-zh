    # 登录访问控制表。


    ```

    # 当有人登录时，系统会扫描表格，找到第一个匹配

    # (user, host) 组合的条目；或者在非网络

    # 登录的情况下，找到第一个匹配 (user, tty) 组合的条目。

    # 该表格条目的权限字段决定了登录将是

    # 被接受还是被拒绝。


    # 登录访问控制表的格式为三个由 ":" 字符

    # 分隔的字段：


    #       权限 : 用户 : 来源地


    # 第一个字段应该是 `+`（允许访问）或 `-`（拒绝访问）

    # 字符。


    # 第二字段应该是一个或多个登录名称、组名

    # 或 `ALL`（始终匹配）的列表。当 `user@host` 格式的

    # 模式在登录匹配“user”部分且“host”部分

    # 部分匹配本地机器名称时，会被匹配。


    # 第三个字段应该是一个或多个 tty 名称（用于非

    # 网络登录）、主机名、域名（以 "." 开头）、主机

    # 地址、互联网网络编号（以 "." 结尾）、`ALL`（始终

    # 匹配）或 `LOCAL`（匹配任何不包含 "."

    # 的字符串）。


    # 如果你运行 NIS，可以在主机或用户模式中使用 `@netgroupname`；

    # 这甚至对于 `@usergroup@@hostgroup` 模式也有效。很奇怪。


    # `EXCEPT` 运算符使得编写非常紧凑的规则可能。


    # 只有当名称与登录用户不匹配时，才会搜索

    # 组文件。用户的主组会被匹配，显式列出用户的

    # 组也会被匹配。


    ```


    # 禁止除少数账户外的所有账户控制台登录。


    -:ALL EXCEPT wheel shutdown sync:LOCAL


    # 禁止非本地登录到特权账户（wheel 组）。


    -:wheel:ALL EXCEPT LOCAL .win.tue.nl


    # 某些账户不允许从任何地方登录：


    -:wsbscaro wsbsecr wsbspac wsbsym wscosor wstaiwde:ALL


    # 所有其他账户都允许从任何地方登录。

    ```


    ## 2. `/etc/security/limits.conf`


    ```

    # /etc/security/limits.conf


    # 每行按以下格式描述用户的限制：


    #<domain> <type> <item> <value>


    # 其中：

    #<domain> 可以是：

    #         - 用户名

    #         - 组名，使用 `@group` 语法

    #         - 通配符 `*`，用于默认条目


    #<type> 可以有两个值：

    #         - "soft" 用于强制软限制

    #         - "hard" 用于强制硬限制


    #<item> 可以是以下内容之一：

    #         - core - 限制核心文件大小 (KB)

    #         - data - 最大数据大小 (KB)

    #         - fsize - 最大文件大小 (KB)

    #         - memlock - 最大锁定内存的地址空间 (KB)

    #         - nofile - 最大打开文件数

    #         - rss - 最大驻内存大小 (KB)

    #         - stack - 最大栈大小 (KB)

    #         - cpu - 最大 CPU 时间 (MIN)

    #         - nproc - 最大进程数

    #         - as - 地址空间限制

    #         - maxlogins - 该用户的最大登录次数

    #         - priority - 运行用户进程的优先级

    #         - locks - 用户可以持有的文件锁上限


    #<domain>           <type>            <item>             <value>


    #*                   soft             core               0

    #*                   hard             rss                10000

    #@student            hard             nproc              20

    #@faculty            soft             nproc              20

    #@faculty            hard             nproc              50

    #ftp                 hard             nproc              0

    #@student            -                maxlogins          4

    # 文件结束

    ```


    ```


    ## 3. `/etc/security/time.conf`


    ```

    # 这是 `pam_time` 模块的示例配置文件。其语法

    # 最初很大程度上基于 shadow 软件包 (shadow-960129)。


    # 行的语法如下：


    #       services;ttys;users;times


    # 空格会被忽略，行可以使用 `\n` 扩展（转义

    # 换行）。正如阅读这些注释所显而易见的，

    # `#` 之后的文本将被忽略，直到行尾。


    # 单个用户/终端等的组合是一个逻辑列表，

    # 即单个令牌，可以可选地带有 `!`（逻辑非）

    # 并用 `&`（逻辑与）和 `|`（逻辑或）分隔。


    # services

    #       是规则适用的 PAM 服务名称逻辑列表。

    # ttys

    #       是该规则适用的终端名称逻辑列表。


    # users

    #       是规则适用的用户逻辑列表。


    # 注意。对于这些项目，简单的通配符 `*` 只能使用一次。


    # times

    #       这里的格式是日期/时间范围条目的逻辑列表，

    #       日期由一个由两个双字符条目组成的

    #       序列指定，例如 `MoTuSa` 代表周一、周二和周六。注意

    #       重复的日期将取消设置 `MoMo` = 无任何日期，且 `MoWk` = 除周一以外的所有工作日。

    #       接受的双字符组合是：


    #            Mo Tu We Th Fr Sa Su Wk Wd Al


    #       最后两个分别代表周末和一周的 7 天。

    #       作为最后的例子，`AlFr` 意味着除周五以外的所有日子。


    #       每个日期/时间范围都可以带有 `!` 前缀以表示“除……之外”


    #       时间范围部分是两个 24 小时制的 `HHMM`，用连字符

    #       分隔表示开始时间和结束时间（如果结束时间小于

    #       开始时间，则被认为应用于第二天）。


    # 若要使规则生效，必须满足 service+ttys+users

    # 的所有应用条件。


    #

    # 示例文件结束。

    #

    ```


    '
