  trans: "\n\n```\n email ftpadmin@ftpserver.mydomain.com\n```\n\n*   仅允许登录失败 2 次后即终止会话\n\
    \n```\n loginfails 2\n```\n\n*   将欢迎消息设置为我们可以控制并从从目录列表中消除的内容\n\n```\n message\
    \ /.ftpwelcome.msg        login\n```\n\n*   不允许即时进行 tar 归档和压缩\n\n```\n compress\
    \   no    all\n        tar        no    all\n```\n\n*   防止匿名和/或访客用户执行某些操作。为所有人显式列出权限。\n\
    \n```\n chmod      no    guest,anonymous\n        delete     no    anonymous\n\
    \        overwrite  no    anonymous\n        rename     no    anonymous\n    \
    \    umask      no    real,guest,anonymous\n        delete     yes   real,guest\n\
    \        overwrite  yes   real,guest\n        rename     yes   real,guest\n```\n\
    \n*   记录发送和从服务器的命令和传输（除非用户误将密码作为命令，否则不会记录密码）。\n\n```\n log commands real,anonymous,guest\n\
    \        log transfers anonymous,guest,real inbound,outbound\n```\n\n*   将某些文件标记为不可检索\n\
    \n```\n noretrieve .notar\nnoretrieve .ftpwelcome.msg\n```\n\n*   设置安全的路径过滤器以过滤掉恶意文件\n\
    \n```\n path-filter guest,anonymous /etc/pathmsg ^[-A-Za-z0-9_\\.]*$ ^\\. ^-\n\
    ```\n\n*   缩短欢迎字符串以避免提供服务器版本信息\n\n```\n greeting terse\n```\n\n*   为所有人使用安全的默认\
    \ umask\n\n```\n defumask 0377\ndefumask 0177 real\ndefumask 0133 guest\n```\n\
    \n最后，我们需要对用户的家目录进行一些修改。让我们设置一个用户，该用户仅被允许在其目录中进行文件的传输，不能进行其他操作。\n\n```\n useradd\
    \ -d /home/user -s /sbin/nologin -m user\n    passwd user # 设置用户的密码\n    cd /home/user\n\
    \    cp /etc/issue.net /home/user/.ftpwelcome.msg # 你在 /etc/issue.net 中有一个安全幅，对吧？\n\
    \    chown root:root /home/user/.ftpwelcome.msg\n    chmod 444 /home/user/.ftpwelcome.msg\
    \ # 防止用户篡改消息或\n    chattr +i /home/user/.ftpwelcome.msg # 禁用它。\n    for file in\
    \ .rhosts .shosts .netrc .forward ; do # 脚本化创建并锁定\n     touch $file     # 某些敏感文件。\n\
    \     chown root:root $file\n     chmod 0 $file\n     chattr +i $file\n     done\n\
    \    rm .bash* .gtk* # 因为他永远不会登录，所以不需要 shell 文件\n```\n\n现在测试服务器：\n\n```\n [user@otherhost\
    \ user]$ ftp 192.168.1.20\n    Connected to 192.168.1.20.\n    220 FTP server\
    \ ready.\n    User (192.168.1.20:(none)): luser\n    331 Password required for\
    \ luser.\n    Password:\n    230-### WARNING ###\n    230-\n    230-此自动化信息系统仅供系统工程人员专用使用。\n\
    \    230-严禁在无权限或超出授权范围的情况下使用本系统，\n    230-可能面临民事和刑事处罚，最高可达法律允许的\n    230-最大程度。\n\
    \    230-\n    230-访问本系统的用户其行为可能会随时受到监控和记录。\n    230-以任何方式使用或访问本系统均构成对本项\n   \
    \ 230-政策的明确知晓和接受。\n    230-\n    230-### WARNING ###230-\n    230 用户 luser 已登录。已应用访问限制。\n\
    \    ftp> pwd\n    257 \"/\" is current directory.\n    ftp> ls -la\n    200 PORT\
    \ command successful.\n    150 Opening ASCII mode data connection for directory\
    \ listing.\n    total 24\n    drwx--------- 2     2501   2501    4096 Aug 18 22:39\
    \ .\n    drwx--------- 2     2501   2501    4096 Aug 18 22:39 ..\n    ---------------\
    \ 1 root   root    0 Aug 18 22:39 .forward\n    -r---r---r--- 1     root   root\
    \    554 Aug 18 22:38 .ftpwelcome.msg\n    --------------- 1 root   root    0\
    \ Aug 18 22:39 .netrc\n    --------------- 1 root   root    0 Aug 18 22:39 .rhosts\n\
    \    --------------- 1 root   root    0 Aug 18 22:39 .shosts\n    226 Transfer\
    \ complete.\n    ftp: 455 bytes received in 0.00Seconds 4550\n"
- fmt: "\n*   Anonymous users may upload files to their incoming directory, but the\
    \ files will be immediately owned by a different user and group on the server\
    \ and changed to read-only for members of that group. This will prevent the anonymous\
    \ users from listing the contents of the incoming directory, preventing them from\
    \ turning it into a wAreZ storehouse. They won't be able to retrieve anything\
    \ from that directory either, and can't create subdirectories.\n\n    ```\n  \
    \   upload /usr/local/ftp/incoming yes ftpusers ftpusers 0040 nodirs\n    ```\n\
    \n*   Set a secure path filter to weed out evil files\n\n    ```\n     path-filter\
    \ guest,anonymous /etc/pathmsg ^[-A-Za-z0-9_\\.]*$ ^\\. ^-\n    ```\n\n*   Shorten\
    \ the greeting string so as not to provide the server version\n\n    ```\n   \
    \  greeting terse\n    ```\n\n*   Use secure default umasks for everyone\n\n \
    \   ```\n     defumask 0377\n            defumask 0177 real\n            defumask\
    \ 0133 guest\n    ```\n\nNext, we'll need to create the anonymous file directory.\
    \ Mercifully, we no longer have to create binary or library directories, just\
    \ file storage areas. Be careful with the permissions in this area! First, we'll\
    \ need a user and group with no privileges: they'll wind up owning uploaded files,\
    \ which \"real\" users on the system (who have been added to that group) can login\
    \ through SSH and copy to other areas of the server to retrieve:\n\n```\n useradd\
    \ -d /usr/local/ftp -s /dev/null ftpusers\n    passwd -l ftpusers\n```\n\nNow\
    \ we can create the storage tree in `/usr/local/ftp`:\n\n```\n mkdir /usr/local/ftp\n\
    \    cd /usr/local/ftp\n    mkdir incoming\n    mkdir pub\n    chmod 755 pub\n\
    \    chown ftp:ftpusers incoming                        # Note the \"ftp\" user\
    \ here: that's so the\n                                                      \
    \ anonymous user can write to this directory.\n    chmod 0370 incoming       \
    \                         # Grant write and execute privileges for\n         \
    \                                              storage, but no reads\n    chown\
    \ root:root pub                                / /pub will be a read-only file\
    \ retrieval area\n    cp /etc/issue.net ./.ftpwelcome.msg                # You\
    \ have a security banner in /etc/issue.net,\n                                \
    \                       right?\n    chown root:root ./.ftpwelcome.msg\n    chmod\
    \ 444 ./.ftpwelcome.msg                        # Keep the user from tampering\
    \ with the\n                                                       message or\
    \ disabling it.\n    chattr +i ./.ftpwelcome.msg\n    for file in .rhosts .shosts\
    \ .netrc .forward ; do   # Script the creation and lockdown\n       touch $file\
    \                                     # of some sensitive files.\n       chown\
    \ root:root $file\n       chmod 0 $file\n       chattr +i $file\n       done\n\
    \    rm .bash* .gtk*                                    # Since he'll never login,\
    \ he'll never need\n                                                       shell\
    \ files\n```\n\nFinally, change the home directory for the `ftp` user in `/etc/passwd`\
    \ to the new FTP server directory at `/usr/local/ftp`:\n\n```\n ftp:x:14:50:FTP\
    \ User:/var/ftp:/sbin/nologin\n```\n\nbecomes\n\n```\n ftp:x:14:50:FTP User:/usr/local/ftp:/sbin/nologin\n\
    ```\n\nNow you can test the server:\n\n```\n [user@other user]# ftp 192.168.1.20\n\
    \    Connected to 192.168.1.20 (192.168.1.20).\n    220 FTP server ready.\n  \
    \  Name (192.168.1.20:user): anonymous\n    331 Guest login ok, send your complete\
    \ e-mail address as password.\n    Password:\n    230-### WARNING ###\n    230-\n\
    \    230-This automated information system is for the exclusive use of\n    230-Systems\
    \ Engineering personnel. Use of this system\n    230-without privilege or in excess\
    \ of granted authority is forbidden, and\n    230-may be subject to civil and\
    \ criminal penalties up to and including the\n    230-fullest extent permitted\
    \ by law.\n    230-\n    230-Users accessing this system are subject to having\
    \ their actions\n    230-monitored and recorded at any time. Use or access of\
    \ this system in\n    230-any fashion constitutes expressed knowledge and acceptance\
    \ of this\n    230-policy.\n    230-\n    230-### WARNING ###\n    230-\n    230-\
    \ Guest login ok, access restrictions apply.\n    Remote system type is UNIX.\n\
    \    Using binary mode to transfer files.\n    ftp> ls\n    227 Entering Passive\
    \ Mode (10,1,1,47,87,244)\n    150 Opening ASCII mode data connection for directory\
    \ listing.\n    total 16\n    d-wxrwx--- 2 14 2500 4096 Aug 18 22:07 incoming\n\
    \    drwxr-xr-x 2 root root 4096 Aug 18 22:02 pub\n    226 Transfer complete.\n\
    \    ftp> mkdir asdf\n    550 asdf: Permission denied on server. (Upload dirs)\n\
    ```\n"
