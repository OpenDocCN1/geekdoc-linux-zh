    \ We can at least restrict the access to this filesystem to the local LAN (as\
    \ is almost always a good idea for security), and we can employ root squashing\
    \ to prevent root-level breaches.\n\n2.  Edit `/etc/exports` to configure the\
    \ share\n\n    ```\n     /etc/exports\n            /home 10.1.1.0/24(rw,secure,hide,root_squash)\n\
    \    ```\n\n3.  Ensure that the NFS services are running on the server\n\n   \
    \ ```\n     /etc/init.d/portmap start\n            /etc/init.d/nfs start\n   \
    \         /etc/init.d/nfslock start\n    ```\n\n4.  Export all configured filesystem\
