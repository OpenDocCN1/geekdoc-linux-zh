    保护 DNS 服务可能是一项复杂且耗时的任务，需要管理员花费大量时间来规划并预测组织的未来增长及现有需求。使用 ISC 的 BIND DNS 服务器（[http://www.isc.org/products/BIND]）已成为行业标准，但由于服务器代码或其设计中频繁发现安全问题，这些问题已允许攻击者破坏
    DNS 服务器、投毒 DNS 信息缓存并对组织实施其他此类恶意攻击。因此，妥善设计和部署 DNS 服务器（特别是以任何方式暴露在互联网上的服务器）是一个至关重要的关注。


    幸运的是，近期频繁的 DNS 攻击促使 BIND 代码的设计和维护人员为 DNS 信息设计了新的保护措施，尽管这些措施建立起来有些繁琐，但可以帮助服务器免受可能破坏或更改
    DNS 信息的攻击。我们将在下文中探索 DNS 服务器的两种常见配置：内部缓存 DNS 服务器和托管 DNS 区域的服务器。


    为了保持高水平的安全性，这两种配置都将限制在服务器上的“监狱”（jail）中以限制它们的访问权限：通过使用 `chroot()` 系统调用，可以指示 BIND
    服务器将自己限制在系统的某个小区域，就像该区域是整个服务器一样。因此，任何破坏守护进程的攻击将使攻击者留存在限制区域内，无法访问服务器的其他部分。根据 BIND
    的最新进展，我们将部署第 9 版本服务器：在获取此版本的源代码时，请务必确保获取的是尽可能的稳定版本代码，并始终检查 BUGTRAQ 等参考资料，以确保该版本没有已知的待决安全漏洞。


    对 DNS 的所有可能配置和选项进行详尽检查已超出了本文的范围：建议用户参考如 Albitz 和 Liu 等的《DNS and BIND》（O''Reilly
    出版，现已第四版），以获得关于该协议更具百科全书参考。


    **对于下方所有的示例，均使用了以下配置：**


    内部网络：`1.3.5.0 / 24`


    外部网络：`2.4.6.0 / 24`


    域名：`example.com`


    `1.3.5.50` 是主 DNS 服务器，`2.4.6.5` 是备用 DNS 服务器。该网络的 ISP 还在 `3.5.7.10` 提供了一个缓存 DNS
    服务器。


    ### 3.4.1 仅缓存名称服务器


    此名称服务器将为本地网络提供 DNS 服务。尽管它不托管任何 DNS 域（也称为“区域”），但它接受来自本地网络的查询，并根据最近请求的缓存进行解析。如果它发现无法从自己的信息缓存中回答请求，它将（取决于配置）将查询向上游转发到
    ISP 的缓存名称服务器，看*它*是否能回答该查询，或者自己向互联网执行递归查询以发现所需的信息。


    #### 3.4.1.1 解压源码并编译二进制文件


    ```

    tar --zxvf bind-9.2.1.tar.gz

    cd bind-9.2.1

    ```


    配置启用 OpenSSL 支持以实现事务签名


    ```

    ./configure --with-openssl --with-randomdev=/dev/random

    make

    ```


    在这里，我们将使用 `DESTDIR` 选项将二进制文件直接安装到 chroot 监狱中，这可以节省时间。


    ```

    mkdir /usr/local/bind

    make install DESTDIR=/usr/local/bind

    ```


    #### 3.4.1.2 设置 chroot 监狱环境


    ```

    cd /usr/local/bind

    ```


    现在，我们需要模拟根环境，因为文件系统的这个角落是守护进程在运行时唯一可以访问的内容。


    ```

    mkdir -p dev etc named/local var/run

    ```


    我们需要一个运行服务器的非特权用户账户，并配有一个一个独立的唯一用户组。这允许守护进程拥有它必须写入的文件和目录，而不会与其它文件系统其他区域的权限重叠。


    ```

    useradd -s /dev/null -d /usr/local/bind dns

    groupadd dns

    ```


    守护进程将在监狱的 `/var/run` 中存储多个易性文件，因此它需要写入这些文件的权限。


    ```

    chown -R dns:dns /usr/local/bind/var/run

    ```


    在 chroot 环境下，守护进程需要访问系统库和设备来回答请求。由于这个微型根文件系统是它运行时唯一可见的内容，我们需要在 chroot 内部复制这些信息。所需的库是通过对
    `/usr/local/bind/sbin` 中的 BIND 二进制文件运行 `ldd` 获取的，以确定哪些库被编译进了它们。


    ```

    mknod /usr/local/bind/dev/null c 1 3

    mknod /usr/local/bind/dev/random c 1 8

    chmod 666 /usr/local/bind/dev/null /usr/local/bind/dev/random

    cp /lib/libcrypto.so.2 /usr/local/bind/lib

    cp /lib/libnsl.so.1 /usr/local/bind/lib

    cp /lib/libc.so.6 /usr/local/bind/lib

    cp /lib/libdl.so.2 /usr/local/bind/lib

    cp /lib/ld-linux.so.2 /usr/local/bind/lib

    ```


    等，我漏掉了原文中的几行。让我重新正确格式化最后部分。


    ```


    mknod /usr/local/bind/dev/null c 1 3

    mknod /usr/local/bind/dev/random c 1 8

    chmod 666 /usr/local/bind/dev/null /usr/local/bind/dev/random

    cp /lib/libcrypto.so.2 /usr/local/bind/lib

    cp /lib/libnsl.so.1 /usr/local/bind/lib

    cp /lib/libc.so.6 /usr/local/bind/lib

    cp /lib/libdl.so.2 /usr/local/bind/lib

