  trans: '


    ### 2.8.2.1 编辑 logrotate 守护进程默认配置文件 (/etc/logrotate.conf) 以保留更多日志信息


    默认安装情况下，日志将每周轮转并仅保留四周。按照下表所示编辑 `/etc/logrotate.conf` 文件，以便系统事件的重要信息能够保存得更久。这将增加检测到问题或可疑入侵的可能性。注意，尽管旧日志会被压缩，但一年的日志数据可能仍然很大。请务必监控存储日志的分区的可用磁盘空间（通常为
    `/var`）。


    表 2-3：logrotate 守护进程默认配置文件设置


    | 默认设置 | 安全设置 | 理由 |

    | --- | --- | --- |

    | `weekly` | `monthly` | `这些更改将日志保存时间从一个月改为一年，提供了更长的追溯性。` |

    | `rotate 4` | `rotate 12` | |

    | `#compress` | `compress` | `为了节省空间，压缩旧日志` |


    #### 2.8.2.2 更新控制 syslog 文件轮转的配置文件 (/etc/logrotate.d/syslog)


    在步骤 2.8.1.1 中安装的 `syslog.conf` 文件会导致所有系统额外的日志文件 `/var/log/kernel`。此外，如果该文件中任何针对服务器的行被取消注释，还将创建其他日志文件。必须将所有新日志文件的名称添加到
    `/etc/logrotate.d/syslog` 开头的文件列表中，以便新日志也能进行轮转。


    #### 2.8.2.3 [可选] 验证日志轮转配置正确


    使用 `logrotate` 命令的 `-f` 标志强制日志文件进行轮转。应该创建新的日志文件且不发生任何错误。


    ```

    [root@localhost]# /usr/sbin/logrotate -f /etc/logrotate.conf

    ```


    ### 2.8.3 logwatch (http://www.logwatch.org)


    如果日志中的信息从未被审查，那么最好的日志配置也将毫无处。`logwatch` 将自动解析日志文件，尝试删除报告正常活动的条目，并发送封包含异常条目的警报电子邮件。编辑
    `/etc/log.d/logwatch.conf` 文件中以 `MailTo` 开头的行，将用户 `root` 修改为负责监控日志的电子邮件地址。


    ### 2.8.4 ntpd ([`www.cis.udel.edu/~ntp`](http://www.cis.udel.edu/~ntp))


    配置网络时间协议 (ntp) 服务器守护进程，通过三个公共 NTP 服务器同步系统时。这将使管理员能够可靠地协调此系统日志文件事件与互联网上其他系统日志文件事件。


    #### 2.8.4.1 查找三个公共 NTP 服务器并将其添加到 /etc/ntp.conf


    访问 [`www.eecis.udel.edu/~mills/ntp/servers.html`](http://www.eecis.udel.edu/~mills/ntp/servers.html)，选择三个地理位置附近的公共服务器，记录它们的
    IP 地址并获得其管理员的许可。编辑 `/etc/ntp.conf` 文件，将以“server 127.127…”开头的行替换为每个公共服务器的一行：


    ```

    server 10.0.0.1    # 公共服务器 1 的 IP 地址

    server 10.0.0.2    # 公共服务器 2 的 IP 地址

    server 10.0.0.3    # 公共服务器 3 的 IP 地址

    ```


    #### 2.8.4.2 重启 NTP 守护进程并确保其开机启动


    强制 `ntpd` 守护进程重新加载其配置文件：


    ```

    [root@localhost]# /etc/init.d/ntpd restart

    ```


    确保 `ntpd` 配置为开机启动：


    ```

    [root@localhost]# /sbin/chkconfig ---level 2345 ntpd on

    ```


    ## 2.9 调度器安全


    ### 2.9.1 限制 `cron` 和 `at` 访问


    在 Linux 世界中，`cron` 和 `at` 是调度的首选应用程序。当你需要在每个相同的时间间隔定期运行特定任务时，使用 `cron`。当你希望安排在特定时间运行一次任务时，使用
    `at`。默认情况下，对 `cron` 和 `at` 的访问是不限制的。这意味着所有用户都有权修改、添加或删除任务。`cron` 将这些调度任务存储在名为
    `crontabs` 的用户特定文件中。`cron` 定期查询这些 crontab 文件以获取运行任务。任务以调度任务的用户权限运行。在加固 `cron`
    时需要考虑的一些指南有：


    ****记录所有 `cron` 任务** – Red Hat 默认配置通过 `syslog` 函数将 `cron` 消息发送到 `/var/cron/log`

    *   **限制 `cron` 和 `at` 的访问** – 仅允许需要运行调度任务的用户访问 `cron`。`cron` 通过 `/etc/cron.allow`
    文件管理访问。`at` 通过 `/etc/at.allow` 文件管理访问。`cron.allow` 和 `at.allow` 指定了哪些用户被明确允许调度
    `cron` 或 `at` 任务，所有其他用户将被拒绝访问。如果存在 `cron.allow` 或 `at.allow`，则仅列出的用户被允许。如果两个文件都不存在，则所有用户都被允许。如果存在
    `cron.deny` 或 `at.deny`，则列出的用户将被拒绝。


