    \ 或 `DSA` 密钥对对文件传输进行自动化（例如你可能对日志轮转、存储或自动备份例行这样做）。要执行此操作，请按照以下指令创建密钥对并将其传输到服务器（在本示例中我们将使用\
    \ `DSA` 密钥对）。\n\n### 在客户端：\n\n```\n [user@host user]$ ssh-keygen -t dsa\n    \
