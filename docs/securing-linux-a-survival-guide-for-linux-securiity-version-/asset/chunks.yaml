    \ start\n    ```\n\n2.  Create the mount point\n\n    ```\n     mkdir /nfsmount/patches\n\
    \    ```\n\n3.  Mount the remote filesystem from the server at 10.1.1.50\n\n \
    \   ```\n     /bin/mount -t nfs 10.1.1.50:/local/patches /nfsmount/patches\n \
    \   ```\n\n##### 3.3.2.2.2 Example II: At-Boot Filesystem\n\nThe example being\
    \ explored here is a filesystem that would be mounted at boot off of a central\
    \ fileserver. Frequently, this is done with user home directories. Since the users\
    \ will need individual access to their directories, we cannot employ complete\
