    \ and you'll be set.\n\n#### 3.3.4.1 Chrooting SFTP\n\n1.  Fetch and unpack the\
    \ sources\n\n    Table 3-4: Fetching and Unpacking Sources\n\n    | Using Source\
    \ Tarball | Using Source RPM |\n\n    | --- | --- |\n\n    | `cd /usr/src` | `cd\
    \ /usr/src` |\n\n    | `tar zxvf /usr/src/openssh-3.4p1.tar.gz` | `rpm -ivh /usr/src/openssh-3.4p1-1.src.rpm`\
    \ |\n\n    | `cd /usr/src/openssh-3.4p1` | `cp /usr/src/osshChroot-3.4.diff /usr/src/redhat/SOURCES`\
    \ |\n\n    | `patch -p1 < /usr/src/osshChroot-3.4.diff` | `cd /usr/src/redhat/SPECS`\
    \ |\n\n    |   | `add lines to /usr/src/redhat/SPECS/openssh.spec` `( See end\
    \ of section for modifications to spec file )` |\n\n2.  Configure, build and install\
    \ the package\n\n    Table 3-5: Configuring, Building, and Installing Packages\n\
    \n    | Using Source Tarball | Using Source RPM |\n\n    | --- | --- |\n\n   \
    \ |  \n\n    ```\n     ./configure \\\n    ---prefix=/usr\\\n    ---with-tcp-wrappers\
    \ \\\n    ---with-rsh=/bin/rsh \\\n    ---with-default-path=/usr/local/bin:/usr/bin:/bin\
    \ \\\n    ---with-superuser-path=\\\n    /usr/local/sbin:/usr/local/bin:/sbin:/bin:/usr/sbin:/usr/bin\
    \ \\\n    ---with-privsep-path=/var/empty/sshd \\\n    ---with-ipv4-default \\\
    \n    ---with-pam \\\n    ---with-md5-passwords\n    ```\n\n     |  \n\n    ```\n\
    \     rpm -bb /usr/src/redhat/SPECS/openssh.spec\n    ```\n\n     |\n\n    | `make`\
    \ | `cd /usr/src/redhat/RPMS/i386` |\n\n    |  \n\n    ```\n     make install\n\
    \    ```\n\n     |  \n\n    ```\n     [ If you already have Red Hat's SSH installed\
    \ ]\n    rpm -Fvh /usr/src/redhat/RPMS/i386/openssh*.rpm\n\n    [ If this is a\
    \ fresh install of SSH ]\n    cd /usr/src/redhat/RPMS/i386\n    rpm -ivh ./openssh-3.4p1-1.i386.rpm\n\
    \    rpm -ivh ./openssh-clients-3.4p1-1.i386.rpm\n    rpm -ivh ./openssh-server-3.4p1-1.i386.rpm\n\
    \    ```\n\n     |\n\n3.  Create the chroot directory\n\n    ```\n     /bin/mkdir\
    \ /usr/local/chroot\n            cd /usr/local/chroot\n            /bin/mkdir\
    \ -p bin dev/pts lib/i686 home usr/bin usr/libexec/openssh usr/lib etc var/log\n\
    \            for prog in bash cp ls mkdir mv rm rmdir ; do\n             /bin/cp\
    \ -p /bin/$prog /usr/local/chroot/bin\n             done\n            for file\
    \ in ld-linux.so.2 libcrypto.so.2 libdl.so.2 libnsl.so.1 libtermcap.so.2 libutil.so.1\
    \ ; do\n             /bin/cp -p /lib/$file /usr/local/chroot/lib\n           \
    \  done\n            /bin/cp -p /lib/i686/libc.so.6 /usr/local/chroot/lib/i686/libc.so.6\n\
    \            /bin/cp -p /usr/lib/libz.so.1 /usr/local/chroot/lib/libz.so.1\n \
    \           cd /usr/local/chroot/dev\n            /bin/mknod null c 1 3\n    \
    \        /bin/mknod tty c 5 0\n            /bin/mknod zero c 1 5\n           \
    \ /bin/mknod pts/0 c 136 0\n            /bin/mknod pts/1 c 136 1\n           \
    \ /bin/chmod 650 pts/*\n            /bin/chmod 666 tty null zero\n           \
    \ /bin/touch /usr/local/chroot/etc/passwd\n    ```\n\n4.  Test the chroot\n\n\
    \    To ensure the chroot is working properly, we'll chroot a shell as root. Since\
    \ sftp uses chroot behind the scenes to perform its actions, we need to make sure\
    \ that a chrooted shell will have all of the libraries it needs.\n\n    ```\n\
    \     [root@host root]# /usr/sbin/chroot /usr/local/chroot /bin/bash\n       \
    \     bash-2.05a# ls\n            bin dev etc home lib usr var\n            bash-2.05a#\
    \ exit\n            [root@host root]#\n    ```\n\n5.  Create the chrooted user\
    \ account\n\n    We will create a single user account to test the chroot: note\
    \ that the home directory for this user will contain \"`/./`\" as a trigger to\
    \ the SSH daemon to activate the chroot when this user logs in. This means that\
    \ users without that trigger can login normally and see the whole filesystem (and\
    \ will be able to use scp), whereas the chrooted users will use sftp and will\
    \ be limited to only their own directories.\n\n    ```\n     /usr/sbin/useradd\
    \ -d /usr/local/chroot/./home/chuser -s /bin/bash -m chuser\n            /bin/grep\
    \ chuser /etc/passwd >> /usr/local/chroot/etc/passwd \n            /bin/chmod\
    \ 444 /usr/local/chroot/etc/passwd\n            /usr/bin/chattr +i /usr/local/chroot/etc/passwd\n\
    \    ```\n\n6.  Run the daemon and test the chroot by transferring a file\n\n\
    \    ```\n     [root@host root]# /usr/sbin/sshd -D\n            (From another\
    \ host)\n            [root@other root]# sftp chuser@ssh-host\n            chuser@ssh-host's\
    \ password: <Enter password>\n            sftp> ls\n            drwx---------\
    \ 2 2000 2000 4096 Aug 15 23:07 .\n            drwxr-xr-x 3 0 0 4096 Aug 15 22:59\
    \ ..\n            -rw--------- 1 2000 2000 68 Aug 15 22:52 .bash_history\n   \
    \         -rw-r---r--- 1 2000 2000 24 Aug 15 22:52 .bash_logout\n            -rw-r---r---\
    \ 1 2000 2000 191 Aug 15 22:52 .bash_profile\n            -rw-r---r--- 1 2000\
    \ 2000 124 Aug 15 22:52 .bashrc\n            sftp> pwd\n            Remote working\
    \ directory: /home/chuser\n            sftp> put foo\n            Uploading foo\
    \ to /home/chuser/foo\n            sftp> ls\n            drwx--------- 2 2000\
    \ 2000 4096 Aug 15 23:07 .\n            drwxr-xr-x 3 0 0 4096 Aug 15 22:59 ..\n\
    \            -rw-r---r--- 1 2000 2000 17371 Aug 15 23:19 foo\n            sftp>\
    \ quit\n            [root@other root]#\n           [ START HERE if you're NOT\
    \ using the chroot patch for sftp ]\n    ```\n\n7.  Secure the daemon's configuration\n\
    \n    On the server, modify /etc/ssh/sshd_config to match the version at the end\
    \ of this section.\n\n    On all clients, modify /etc/ssh/ssh_config to match\
    \ the version at the end of this section."
