  trans: "\n*   匿名用户可以将文件上传到他们的入站目录，但这些文件将立即由服务器上的另一个用户和用户组所有，并为该组成员更改为只读。这将防止匿名用户列出入站目录的内容，防止将其变成一个\
    \ wAreZ 仓库。他们也无法从该目录中检索任何内容，并且无法创建子目录。\n\n    ```\n     upload /usr/local/ftp/incoming\
    \ yes ftpusers ftpusers 0040 nodirs\n    ```\n\n*   设置安全的路径过滤器以剔除恶意文件\n\n    ```\n\
    \     path-filter guest,anonymous /etc/pathmsg ^[-A-Za-z0-9_\\.]*$ ^\\. ^-\n \
    \   ```\n\n*   缩短问候字符串以避免提供服务器版本信息\n\n    ```\n     greeting terse\n    ```\n\n\
    *   为所有人设置安全的默认 umask\n\n    ```\n     defumask 0377\n            defumask 0177\
    \ real\n            defumask 0133 guest\n    ```\n\n接下来，我们需要创建匿名文件目录。幸运的是，我们不再需要创建二进制或库目录，只需要文件存储区域。请务必小心该区域的权限！首先，我们需要一个没有权限的用户和组：他们将拥有上传的文件，而系统上的“真实”用户（已添加到该组的用户）可以通过\
    \ SSH 登录并将其复制到服务器的其他区域进行检索：\n\n```\n useradd -d /usr/local/ftp -s /dev/null ftpusers\n\
    \    passwd -l ftpusers\n```\n\n现在我们可以在 `/usr/local/ftp` 中创建存储树：\n\n```\n mkdir\
    \ /usr/local/ftp\n    cd /usr/local/ftp\n    mkdir incoming\n    mkdir pub\n \
    \   chmod 755 pub\n    chown ftp:ftpusers incoming                        # 注意这里的\
    \ \"ftp\" 用户：这样做是为了\n                                                       匿名用户可以向此目录写入。\n\
    \    chmod 0370 incoming                                # 为存储授予写入和执行权限，\n    \
    \                                                   但没有读取权限。\n    chown root:root\
    \ pub                                / /pub 将是一个只读的文件检索区域。\n    cp /etc/issue.net\
    \ ./.ftpwelcome.msg                # 你在 /etc/issue.net 中有一个安全横幅，\n           \
    \                                            对吧？\n    chown root:root ./.ftpwelcome.msg\n\
    \    chmod 444 ./.ftpwelcome.msg                        # 防止用户篡改消息\n         \
    \                                              或禁用它。\n    chattr +i ./.ftpwelcome.msg\n\
    \    for file in .rhosts .shosts .netrc .forward ; do   # 脚本化创建并锁定\n         \
    \                                              # 敏感文件。\n       touch $file   \
    \                                  \n       chown root:root $file\n       chmod\
    \ 0 $file\n       chattr +i $file\n       done\n    rm .bash* .gtk*          \
    \                          # 因为他永远不会登录，所以永远不需要\n                             \
    \                          shell 文件。\n```\n\n最后，将 `/etc/passwd` 中 `ftp` 用户的家目录更改新的\
    \ FTP 服务器目录 `/usr/local/ftp`：\n\n```\n ftp:x:14:50:FTP User:/var/ftp:/sbin/nologin\n\
    ```\n\n变为：\n\n```\n ftp:x:14:50:FTP User:/usr/local/ftp:/sbin/nologin\n```\n\n\
    现在你可以测试服务器了：\n\n```\n [user@other user]# ftp 192.168.1.20\n    Connected to 192.168.1.20\
    \ (192.168.1.20).\n    220 FTP server ready.\n    Name (192.168.1.20:user): anonymous\n\
    \    331 Guest login ok, send your complete e-mail address as password.\n    Password:\n\
    \    230-### WARNING ###\n    230-\n    230-此自动化信息系统专供\n    230-工程人员使用。严禁无授权或\n\
    \    230-超出授予权限范围使用本系统，并\n    230-可能面临法律允许的最大范围内的民事和刑事处罚，\n    230-包括最严处罚。\n \
    \   230-\n    230-访问本系统的用户其行为可能会随时\n    230-被监控和记录。以任何方式使用或访问本系统\n    230-均被视为对本策略的明确知和接受。\n\
    \    230-\n    230-### WARNING ###\n    230-\n    230-访客登录成功，受访问限制。\n    Remote\
    \ system type is UNIX.\n    Using binary mode to transfer files.\n    ftp> ls\n\
    \    227 Entering Passive Mode (10,1,1,47,87,244)\n    150 Opening ASCII mode\
    \ data connection for directory listing.\n    total 16\n    d-wxrwx--- 2 14 2500\
    \ 4096 Aug 18 22:07 incoming\n    drwxr-xr-x 2 root root 4096 Aug 18 22:02 pub\n\
    \    226 Transfer complete.\n    ftp> mkdir asdf\n    550 asdf: Permission denied\
    \ on server. (Upload dirs)\n```\n"
- fmt: "\nBefore attempting any sort of file sharing from an NFS server, it is a good\
    \ idea to take some basic steps to secure the server's configuration. One major\
    \ problem with NFS is its reliance on RPC-based services: rather than being assigned\
    \ to a fixed port, RPC services are assigned a port randomly (or semi-randomly,\
    \ or in some cases, not randomly at all) when they are initiated, by the RPC portmapper\
    \ daemon. Clients wishing to connect to those services will first contact the\
    \ portmapper daemon to inquire to which port the needed service has been assigned.\
    \ Among other things, this plays havoc with firewalls, which rely on services\
    \ being assigned a particular port time and again, which can make firewalling\
    \ NFS services very difficult.\n\nFortunately, Red Hat's NFS implementation reduces\
    \ this headache considerably through the use of some thoughtful configuration\
    \ options: with the following quick changes, we can make NFS as firewall-friendly\
    \ as possible.\n\n### 3.3.2.1.1 Portmapper\n\nFirst, we need to configure the\
    \ `portmapper` daemon. It is always assigned the same port (`TCP` and `UDP` `111`),\
    \ so we don't need to worry about fixing that, but we do need to restrict access\
    \ to it. Since this will be the gateway to the NFS services on the server, we\
    \ need to carefully control to whom we grant access. By default, the `portmapper`\
    \ daemon on Red Hat Linux comes compiled with support for Wietse Venema's TCP\
    \ wrappers, which allows us to control access to it using a pair of configuration\
    \ files. In `/etc/hosts.deny`, we'll first set a default-deny policy for the `portmapper`:\n\
    \n```\n /etc/hosts.deny\n    portmap: ALL\n```\n\nNow we'll configure `/etc/hosts.allow`\
    \ to permit access to the `portmapper` from trusted internal machines. Add IP\
    \ addresses into this file to permit NFS clients access to the `portmapper`, being\
    \ careful to list specific IPs rather than subnets, where possible. Below, we've\
    \ granted access only to the NFS client at IP address `10.1.2.3`.\n\n```\n /etc/hosts.allow\n\
    \    portmap: 10.1.2.3\n```\n\n### 3.3.2.1.2 mountd\n\nThe mount daemon (`mountd`)\
    \ actually implements NFS mount requests: when a client wishes to mount a filesystem\
    \ over NFS, it sends a `MOUNT` request to `mountd` to initiate the process, who\
    \ verifies the request against the list of exported filesystems and returns a\
    \ filehandle of the filesystem if the request is approved.\n\n`mountd` is an RPC\
    \ service, so the first thing to do is to lock in the port to which it will be\
    \ assigned. Anticipating this desire, Red Hat has configured a simple way to do\
    \ this by adding the information to a configuration file rather than having to\
    \ edit the startup file for this service by hand. First, choose a port for the\
    \ mount daemon: it can be any port number higher than 1024, with the default choice\
    \ being 2050 most of the time. Once you've selected your port, edit `/etc/sysconfig/network`\
    \ as follows (we've used 2050 as an example):\n\n```\n /etc/sysconfig/network\n\
    \    MOUNTD_PORT=2050\n```\n\nOn Red Hat Linux, `mountd` has also been compiled\
    \ with support for TCP wrappers, so this service can be granted additional security\
    \ by permitting access only from selected clients. This prevents an NFS problem\
    \ in which clients could bypass restrictions on the portmapper and mount a filesystem\
    \ by sending the request directly to `mountd` if they could figure out on what\
    \ port `mountd` was running. To implement this, edit `/etc/hosts.deny` and `/etc/hosts.allow`\
    \ again and add to the bottom the following lines (as an example, we've again\
    \ granted access only to the NFS client at IP address 10.1.2.3):\n\n```\n /etc/hosts.deny\n\
    \    mountd: ALL\n    /etc/hosts.allow\n    mountd: 10.1.2.3\n```\n\n### 3.3.2.1.3\
    \ nfsd\n\nThe NFS daemon (`nfsd`) is a sort of go-between, shuttling information\
    \ back and forth between the userland space and the kernel module (`nfsd.o`) actually\
    \ implementing NFS under Linux. Like `mountd`, `nfsd` is an RPC service, so it\
    \ has no fixed port, and unlike `mountd`, it has not been compiled with support\
    \ for TCP wrappers nor does it have a convenient shortcut in the system configuration\
    \ files for pre-selecting a port. However, we can pre-select the port on it by\
    \ editing the startup script (`/etc/init.d/nfs`) by hand and adding the following\
    \ information:\n\n```\n /etc/init.d/nfs\n```\n\nFind this block:\n\n```\n echo\
    \ -n $\"Starting NFS daemon: \"\n    daemon rpc.nfsd $RPCNFSDCOUNT\n```\n\nAnd\
    \ change it to read thus (using 2049 as our pre-selected port for `nfsd`):\n\n\
    ```\n echo -n $\"Starting NFS daemon: \"\n    daemon rpc.nfsd -p 2049 $RPCNFSDCOUNT\n\
    ```\n\n### 3.3.2.1.4 Rquotad\n\nThe remote quota daemon (`rquotad`) is responsible\
    \ for answering clients' queries about user quotas for exported NFS filesystems.\
    \ That is, when a client attempts to write to an NFS filesystem, it will first\
    \ inquire of the quota daemon (if the server has quotas active for that filesystem)\
    \ whether the client has sufficient quota to issue the write. `Rquotad` will then\
    \ check the local quotas for that user and return that information to the client.\
    \ Unfortunately, in addition to lacking TCP wrappers support, `rquotad` cannot\
    \ be fixed to a specific port.\n\nOn the other hand, if you are not using quotas,\
    \ there is no reason to run `rquotad`, and you can deactivate it without having\
    \ an impact on your filesystems. To do so, edit the startup script (`/etc/init.d/nfs`):\n\
    \n```\n /etc/init.d/nfs\n```\n\nComment out the following blocks in this file\
    \ to deactivate `rquotad`:\n\n```\n if [ -x /usr/sbin/rquotad ] ; then\n     echo\
    \ -n $\"Starting NFS quotas: \"\n     daemon rpc.rquotad\n     echo\n    fi\n\n\
    \    if [ -x /usr/sbin/rquotad ] ; then\n     echo -n $\"Stopping NFS quotas:\
    \ \"\n     killproc rpc.rquotad\n     echo\n    fi\n\n    if [ -x /usr/sbin/rquotad\
    \ ] ; then\n     status rpc.rquotad\n    fi\n```\n\nYou'll notice that all of\
    \ these blocks check to see if `rpc.rquotad` is executable (using the `-x` flag)\
    \ before running these commands. One possible way of deactivating `rquotad` is\
    \ to remove the executable bits from it using `chmod` (`chmod a-x /usr/sbin/rquotad`\
    \ would work). While this would deactivate it, an RPM update to quota RPM (or\
    \ a well-meaning administrator!) would likely restore those executable privileges,\
    \ thus inadvertently reactivating the daemon. If you've really decided not to\
    \ use quotas over NFS, commenting those blocks will help guarantee that the service\
    \ stays deactivated until you choose to activate it. Obviously, if the service\
    \ is not needed, you should uninstall it to keep it from being a liability to\
    \ the system in the future: a quick `rpm -e quota` will accomplish this.\n\n###\
    \ 3.3.2.2 NFS Client Security\n\nSecuring the client is relatively simple: it\
    \ will only require the portmapper. The `mount` command will handle the necessary\
    \ NFS module activations when called upon to mount a filesystem over NFS. Since\
    \ the client will be running the portmapper, however, this should be secured in\
    \ the same manner as the server's, restricting inbound connections to only those\
    \ necessary.\n\n##### 3.3.2.2.1 Example I: Transient Filesystem\n"
