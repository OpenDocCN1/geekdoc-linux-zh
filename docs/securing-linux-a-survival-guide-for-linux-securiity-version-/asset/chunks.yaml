    封底


    随着 Linux 操作系统的日益成熟和普及，安全风险也随之增加。SANS 学院很高兴宣布《Linux 加固》一的出版，这是由许多每天工作和保障 Linux
    安全的专家共同完成的成果。这本《安全步步营》系列指南的新成员，不仅仅是对 SANS 之前的《Linux 步步营》的更新。该书是从零开始的完全重写，展示了加固
    Linux 系统的最新最佳实践。请查阅它：这本 104 页的权威指南不仅适用于安全专家。在家里或工作场所尝试使用 Linux 的初学者也将从本指南中获益，本指南涵盖了工作站和许多服务器配置。通过使用示例脚本以及解释为何执行某任务的配套文本，您可以提高您的
    Linux 系统的安全性。


