  trans: "\n5. 为了让你的文件系统在启动时自动挂载，你需要修改 `/etc/rc.d/rc.sysinit`，或者在机器上运行 `netfs` 服务，它会自动挂载\
    \ `/etc/fstab` 中配置的任何网络文件系统。如果没有该服务，Samba 文件系统将不会自动挂载。要启动它，请运行此命令：\n\n```\n/sbin/chkconfig\
    \ --level 2345 netfs on\n```\n\n### 3.3.4 SCP 和 SFTP\n\n远程文件传输和命令行控制会对于 Unix 管理员至关重要。多年来，只有\
    \ FTP、Telnet 和 RSH 等协议可用。这些协议在网络上明文传输会话数据以及身份信息。Secure Shell (`ssh`) 协议的出现为这个问题提供了广受欢迎的解决方案，使用强加密算法对命令行数据传输会话进行完全加密。最近开发的\
    \ OpenSSH（它是 OpenBSD 项目的一个分支）尤为受到欢迎，其开源实现可以在许多不同的 Unix 平台上进行编译，帮助该协议得到更广泛的使用。因此，大多数\
    \ Linux 发行版现在都预装了 OpenSSH。\n\n虽然本文的另一个章节涵盖了用于命令行会话的 SSH 配置，但有时会被忽视的一个特性是它的文件传输功能，旨在一次性替代\
    \ `rcp` 和 `ftp`。`scp` 和 `sftp` 命令在替换这些非加密对应品方面表现出色，它们很好地模拟了命令行开关和选项，使得在大多数情况下，特别是\
    \ `scp` 可以简单地作为 `rcp` 的替换。在本节中，我们将通过补丁 SSH 源码来配置 SSH 服务器，使得使用 `sftp` 文件传输尽可能安全，包括使用\
    \ `chroot` 对用户的文件传输会话进行禁闭。遗憾的是，该补丁目前不适用于 `scp`，但 chroot 用户和非 chroot 用户可以并存。\n\n\
    Red Hat 即使使用了最的补丁，并不总是提供最新的 SSH 版本，因此有必要从 OpenSSH 团队 (`http://www.openssh.com`)\
    \ 获取可迁移版 OpenSSH。你可以以二进制 RPM、源码 RPM 或 gzip 压缩源码 tar 包的形式获取迁移版本；由于 `chroot` 需要对代码进行修改，我们需要后两种选项之一。\n\
    \n如果你对实现 `chroot` 特性感兴趣，可以跳过：你只需要本节末尾提供的 SSH 配置文件即可。\n\n### 3.3.4.1 Chroot 应用\
    \ SFTP\n\n#### 1. 获取并解压源码\n\n表 3-4：获取和解压源码\n\n| 使用源码 tar 包 | 使用源码 RPM |\n| ---\
    \ | --- |\n| `cd /usr/src` | `cd /usr/src` |\n| `tar zxvf /usr/src/openssh-3.4p1.tar.gz`\
    \ | `rpm -ivh /usr/src/openssh-3.4p1-1.src.rpm` |\n| `cd /usr/src/openssh-3.4p1`\
    \ | `cp /usr/src/osshChroot-3.4.diff /usr/src/redhat/SOURCES` |\n| `patch -p1\
    \ < /usr/src/osshChroot-3.4.diff` | `cd /usr/src/redhat/SPECS` |\n| | 向 /usr/src/redhat/SPECS/openssh.spec\
    \ 添加行 `( spec 文件的修改请参见本节末尾 )` |\n\n#### 2. 配置、构建并安装包\n\n表 3-5：配置、构建和安装包\n\n| 使用源码\
    \ tar 包 | 使用源码 RPM |\n| --- | --- |\n| | |\n```\n./configure \\\n---prefix=/usr\\\
    \n---with-tcp-wrappers \\\n---with-rsh=/bin/rsh \\\n---with-default-path=/usr/local/bin:/usr/bin:/bin\
    \ \\\n---with-superuser-path=\\\n/usr/local/sbin:/usr/local/bin:/sbin:/bin:/usr/sbin:/usr/bin\
    \ \\\n---with-privsep-path=/var/empty/sshd \\\n---with-ipv4-default \\\n---with-pam\
    \ \\\n---with-md5-passwords\n```\n| | |\n```\nrpm -bb /usr/src/redhat/SPECS/openssh.spec\n\
    ```\n| | |\n| `make` | `cd /usr/src/redhat/RPMS/i386` |\n| | |\n```\nmake install\n\
    ```\n| | |\n```\n[ 如果你已经安装了 Red Hat 的 SSH ]\nrpm -Fvh /usr/src/redhat/RPMS/i386/openssh*.rpm\n\
    \n[ 如果这是全新安装的 SSH ]\ncd /usr/src/redhat/RPMS/i386\nrpm -ivh ./openssh-3.4p1-1.i386.rpm\n\
    rpm -ivh ./openssh-clients-3.4p1-1.i386.rpm\nrpm -ivh ./openssh-server-3.4p1-1.i386.rpm\n\
    ```\n| | |\n\n#### 3. 创建 chroot 目录\n\n```\n/bin/mkdir /usr/local/chroot\n    \
    \    cd /usr/local/chroot\n        /bin/mkdir -p bin dev/pts lib/i686 home usr/bin\
    \ usr/libexec/openssh usr/lib etc var/log\n        for prog in bash cp ls mkdir\
    \ mv rm rmdir ; do\n         /bin/cp -p /bin/$prog /usr/local/chroot/bin\n   \
    \     done\n        for file in ld-linux.so.2 libcrypto.so.2 libdl.so.2 libnsl.so.1\
    \ libtermcap.so.2 libutil.so.1 ; do\n         /bin/cp -p /lib/$file /usr/local/chroot/lib\n\
    \        done\n        /bin/cp -p /lib/i686/libc.so.6 /usr/local/chroot/lib/i686/libc.so.6\n\
    ```\n\n#### 4. 测试 chroot\n\n为了确保 `chroot` 工作正常，我们将通过传输文件来测试 `chroot`。\n\n```\n\
    /bin/cp -p /lib/i686/libc.so.6 /usr/local/chroot/lib/i686/libc.so.6\n```\n\n####\
    \ 5. 创建 chroot 用户\n\n我们将创建一个用户来测试 `chroot`。\n\n```bash\nuseradd -d /usr/local/chroot\
    \ -s /bin/bash chuser\n```\n\n#### 6. 运行守护进程并测试 chroot\n\n```bash\n/usr/sbin/sshd\
    \ -D\n```\n\n#### 7. 安全守护进程的配置\n"
- fmt: "\nCreate `/etc/issue.net` with a suitable warning banner; one is provided\
    \ in the example section.\n\n## 8. Create keypairs\n\nFile transfers can be automated\
    \ (as one might like to do for log rotation and storage or automated backup routines)\
    \ using `RSA` or `DSA` keypairs. To do this, follow these instructions to create\
    \ your keypairs and transmit them to the server (we'll use a `DSA` keypair for\
    \ this example).\n\n### On the client:\n\n```\n [user@host user]$ ssh-keygen -t\
    \ dsa\n        Generating public/private dsa key pair.\n        Enter file in\
    \ which to save the key (/home/user/.ssh/id_dsa): <Press Enter>\n        Enter\
    \ passphrase (empty for no passphrase): <Enter a passphrase>\n        Enter same\
    \ passphrase again: <Confirm your passphrase>\n        Your identification has\
    \ been saved in /home/user/.ssh/id_dsa.\n        Your public key has been saved\
    \ in /home/user/.ssh/id_dsa.pub.\n        The key fingerprint is:\n        7b:ab:75:32:9e:b6:6c:4b:29:dc:2a:2b:8c:2f:4e:37\
    \ user@host\n        [user@host user]$ ls -l ~/.ssh\n        -rw--------- 1 user\
    \ user 526 Aug 15 01:21 id_dsa\n        -rw-r---r--- 1 user user 330 Aug 15 01:21\
    \ id_dsa.pub\n        [user@host user]$ cd ~/.ssh\n        [user@host user]$ sftp\
    \ user@sftp-server\n        user@sftp-server's password: <Enter password>\n  \
    \      sftp> put id_dsa.pub\n        Uploading id_dsa.pub to /home/user\n    \
    \    sftp> exit\n```\n\n### On the server:\n\n```\n [ Login as user on the SFTP\
    \ server, either through SSH with a password or on the console ]\n        [user@host\
    \ user]$ mkdir ~/.ssh\n        [user@host user]$ chmod 700 ~/.ssh\n        [user@host\
    \ user]$ cd ~/.ssh\n        [user@host .ssh]$ mv ../id_dsa.pub ./authorized_keys2\n\
    \        [user@host .ssh]$ chmod 600 authorized_keys2\n```\n\nThat should do it!\
    \ If you entered a passphrase to encrypt the `DSA` keypair, you'll have to enter\
    \ it on the client when connecting to the remote host (which is more secure, since\
    \ the passphrase is never transmitted over the wire). For automated connections,\
    \ you can create a keypair with a blank password by hitting `<CR>` when prompted\
    \ for a passphrase to encrypt the keypair during the generation process. That\
    \ will mean that anyone with the private half of that keypair (`id_dsa`) can login\
    \ as that user, so be very careful to guard that file well!\n\n| | Note |\n| :---\
    \ | :--- |\n| | The various \"flavors\" of SSH (the commercial version from ssh.com,\
    \ OpenSSH, etc.) differ somewhat in their key formats, especially when exchanging\
    \ keys between a Windows client and a Unix server. If you need to exchange keys\
    \ between different flavors of `ssh`, one option is the `ssh-keyinstall` utility\
    \ (http://www.stearns.org/ssh-keyinstall/). |\n\n## 9. Add the daemon to the system\
    \ startup scripts\n\nIf you've installed using the source RPM, a quick `chkconfig\
    \ --level 2345 sshd on` will activate the SSH daemon; if not, use the SSH startup\
    \ script in the section covering SSH daemon configuration elsewhere in this guide.\n\
    \n| | Note |\n| :--- | :--- |\n| | Where files are modified, the unaltered text\
    \ appears in a normal font, with the needed changes in **bold**. |\n\n```\n  /usr/src/redhat/SPECS/openssh.spec\n\
    \      [...]\n\n      # Do we want to disable building of x11-askpass (1=yes 0=no)\n\
    \      %define no_x11_askpass 1\n\n      # Do we want to disable building of gnome-askpass\
    \ (1=yes 0=no)\n      %define no_gnome_askpass 1\n\n      [...]\n\n      # Disable\
    \ 1Pv6 (avoids DNS hangs on some glibc versions)\n      %define noip6 1\n\n  \
    \    # Do we want kerberos5 support (1=yes 0=no)\n      %define kerberos5 0\n\n\
    \      [...]\n\n      Source1: http://www.pobox.com/jmknoble/software/x11-ssh-askpass/x11-ssh-askpass-%[aversion].tar.gz\n\
    \      Patch0: http://chrootssh.sourceforge.net/patches/osshChroot-3.4.diff\n\
    \      License: BSD\n\n      [...]\n\n      %prep\n\n      %if ! %{no_x11_askpass}\n\
    \      %setup -q -a 1\n      %else\n      %setup -q\n      %endif\n\n      %patch\
    \ -p 1\n\n      [...]\n\n    /etc/ssh/ssh_config\n\n      Host *\n      # Do not\
    \ ask for port-forwarding by default\n      ForwardAgent no\n      # Do not ask\
    \ for X11 forwarding by default\n      ForwardX11 no\n      # Do not ever use\
    \ .rhosts files for authentication\n      RhostsAuthentication no\n      # Do\
    \ not use .rhosts file for authentication, even with RSA keypairs\n      RhostsRSAAuthentication\
    \ no\n      # Use keypairs for authentication\n      RSAAuthentication yes\n \
    \     # Fall back to password authentication\n      PasswordAuthentication yes\n\
    \      # Do not permit empty passwords\n      PermitEmptyPasswords no\n      #\
    \ Do not use challenge-response-type authentication (unless you're using S/KEY,\
    \ in which case you'll want to turn this on)\n      ChallengeResponseAuthentication\
    \ no\n      KerberosAuthentication no\n      KerberosOrLocalPasswd yes\n     \
    \ KerberosTicketCleanup yes\n      AFSTokenPassing no\n      KerberosTgtPassing\
    \ no\n      PAMAuthenticationViaKbdInt yes\n      X11Forwarding no\n      X11DisplayOffset\
    \ 10\n      X11UseLocalhost yes\n      PrintLastLog yes\n      KeepAlive yes\n\
    \      UseLogin no\n      UsePrivilegeSeparation yes\n      Compression yes\n\
    \      MaxStartups yes\n      # Try AES (Rijndael) encryption with 192-bit key\
    \ first\n      Cers aes192-cbc,aes256-cbc,aes128-cbc,blowfish-cbc,3des-cbc\n \
    \     # Use this key to suspend the session to change settings\n      EscapeChar\
    \ ~\n\n    /etc/ssh/sshd_config\n      Port 22\n      # Use only version 2 of\
    \ the protocol\n      Protocol 2\n      ListenAddress 0.0.0.0\n      HostKey /etc/ssh/ssh_host_rsa_key\n\
    \      HostKey /etc/ssh/ssh_host_dsa_key\n      SyslogFacility AUTH\n      LogLevel\
    \ INFO\n      # Offer the user 90 seconds to finish authenticating or time out\
    \ the connection\n      LoginGraceTime 90\n      # Do not permit root to login\
    \ directly\n      PermitRootLogin no\n      StrictModes yes\n      RSAAuthentication\
    \ yes\n      PubkeyAuthentication yes\n      AuthorizedKeysFile .ssh/authorized_keys\n\
    \      RhostsAuthentication no\n      IgnoreRhosts yes\n      RhostsRSAAuthentication\
    \ no\n      HostbasedAuthentication no\n      IgnoreUserKnownHosts no\n      PasswordAuthentication\
    \ yes\n      PermitEmptyPasswords no\n      # Print this banner prior to allowing\
    \ the user to authenticate.\n      # Remember to put a system warning in this\
    \ file!\n      Banner /etc/issue.net\n      VerifyReverseMapping no\n      Subsystem\
    \ sftp /usr/libexec/openssh/sftp-server\n```\n"
