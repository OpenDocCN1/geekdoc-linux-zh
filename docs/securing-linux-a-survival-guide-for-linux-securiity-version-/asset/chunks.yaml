    \ allowed relay domains for sendmail. The \"key\" is a fully qualified hostname,\
    \ sub-domain, domain or network. The \"value\" is an action, REJECT, DISCARD,\
    \ OK, RELAY or an arbitrary message. Only hosts or domains with the RELAY action\
    \ defined are allowed to use the mail server as a mail relay. For example, if\
    \ your domain is mailserver.com and our server is also handling mail for all hosts\
    \ on the 192.168.x.x network, edit `/etc/mail/access` to read:\n\n```\n mailserver.com\
    \            RELAY\n    192.168                   RELAY\n```\n\nSave the changes\
    \ to `/etc/mail/access` and use the `makemap` utility program to create the database\
    \ map of this file and restart the sendmail daemon:\n\n```\n [root] # makemap\
    \ hash /etc/mail/access.db < /etc/mail/access\n    [root] # /etc/rc.d/init.d/sendmail\
