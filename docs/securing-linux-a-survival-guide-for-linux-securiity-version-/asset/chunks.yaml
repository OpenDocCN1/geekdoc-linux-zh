  trans: "\n\n在本示例中，我们将展示一个客户端和服务器之间安全 NFS 挂载的示例配置，该挂载由管理员手动挂载。这将包含系统补丁的共享目录（例如），这样中央补丁仓库就可以远程挂载到补丁服务器上，并在不需要时卸载。由于包含补丁的目录将仅供客户端读取且不应被修改，我们可以以只读方式导出此文件系统。我们还可以使用“压缩（squashing）”选项来导出文件系统，该选项会将客户端上的\
    \ `UIDs` 和 `GIDs` 映射到服务器上相应的 `UIDs` 和 `GIDs`。通常会对 root 账户这样做，以防止远程客户端的 root 账户自动获得服务器上文件系统的\
    \ root 权限。然而，在这种情况下，我们只需要读取补丁的权限，因此我们将使用完全压缩（complete squashing）导出文件系统：我们将在服务器上创建一个只能读取补丁的低权限用户，并将所有远程\
    \ `UIDs` 映射到该用户，从而相应地降低客户端的所有权限。NFS 还允许我们将文件系统导出给特定的客户端或客户端组：*绝不要*将文件系统导出给所有人！我们将补丁共享的访问限制在本地内部子网中：例如\
    \ `10.1.1.0/24`\n\nLinux 为 NFS 提供了一些方便的额外调整以增强安全性：默认启用的“隐藏（hide）”意味着挂载在共享文件系统内部的文件系统（例如\
    \ `/usr` 和 `/usr/local` 位于不同的磁盘分区上）不会自动共享：服务器必须单独共享该辅助文件系统，客户端也必须单独挂载。此外，默认启用的“安全（secure）”功能要求\
    \ NFS 挂载请求来自特权端口，有助于确保执行远程挂载请求的用户是 root 或具有 root 权限。这并不是万无一失的因素，但每一点小改进都有帮助。\n\
    \n## 服务器端\n\n1.  创建补丁目录\n\n    ```\n     mkdir /local/patches\n    ```\n\n2. \
    \ 创建低权限用户和组\n\n    ```\n     groupadd -g 1500 patches\n            useradd -u\
    \ 1500 -g patches -d /local/patches -s /dev/null patches\n    ```\n\n3.  编辑 `/etc/exports`\
    \ 以配置共享\n\n    ```\n     /etc/exports\n            /local/patches 10.1.1.0/24(ro,secure,hide,all_squash,anonuid=1500,anongid=1500)\n\
    \    ```\n\n4.  确保 NFS 服务在服务器上运行\n\n    ```\n     /etc/init.d/portmap start\n\
    \            /etc/init.d/nfs start\n            /etc/init.d/nfslock start\n  \
    \  ```\n\n5.  导出所有已配置的文件系统共享 (-a)，并使用冗输出输出 (-v)\n\n    ```\n     /usr/sbin/exportfs\
    \ -va\n    ```\n\n6.  将补丁复制到\n\n    ```\n     /local/patches\n    ```\n\n## 客户端\n\
    \n1.  确保 portmapper 正在运行\n\n    ```\n     /etc/init.d/portmap start\n    ```\n\
    \n2.  创建挂载点\n\n    ```\n     mkdir /nfsmount/patches\n    ```\n\n3.  从 IP 为 10.1.1.50\
    \ 的服务器挂载远程文件系统\n\n    ```\n     /bin/mount -t nfs 10.1.1.50:/local/patches /nfsmount/patches\n\
    \    ```\n\n### 3.3.2.2.2 示例 II：启动时文件系统\n\n这里探讨的示例是在启动时从中央文件服务器挂载的文件系统。这通常用于用户主目录。由于用户需要单独访问自己的目录，我们不能像上一个示例中那样使用完全压缩。相反，我们应该确保使用\
    \ root 压缩（root squashing）。为了做到这一点，你必须小心同步客户端和服务器之间的 `UIDs`。由于访问是通过数值 `UID` 而不是用户名授予的，因此在客户端和服务器上具有不同\
    \ `UID` 的用户将无法获得其自身目录的访问权限，并且（更糟糕的是）可能会完全获得他人目录的权限！\n\n## 服务器端\n\n1.  创建你想要授予访问权限的用户，并将他们的\
    \ `UIDs` 与客户端同步。如果用户永远不会直接登录 NFS 服务器，可以为他们授予带有空 shell（如 `/dev/null` 或 `/bin/false`\
    \ 等类似内容）的用户账户，因为这些账户信息随后将仅用于映射 NFS 权限。我们至少可以将对此文件系统的访问限制在本地局域网内（这几乎总是出于考虑的好主意），并可以使用\
    \ root 压缩来防止 root 级别的越权。\n\n2.  编辑 `/etc/exports` 以配置共享\n\n    ```\n     /etc/exports\n\
    \            /home 10.1.1.0/24(rw,secure,hide,root_squash)\n    ```\n\n3.  确保\
    \ NFS 服务在服务器上运行\n\n    ```\n     /etc/init.d/portmap start\n            /etc/init.d/nfs\
    \ start\n            /etc/init.d/nfslock start\n    ```\n\n4.  导出所有已配置的文件系统共享\
    \ (-a)，并使用冗余输出 (-v)\n\n    ```\n     /usr/sbin/exportfs -va\n    ```\n\n## 客户端\n\
    \n还需要执行的一项额外安全检查：客户端应将文件系统挂载为不可信卷。这意味着挂载时不带 SUID 文件（`nosuid`）、不带设备（`nodev`），且最好不带执行文件，以防止服务器在客户端上获得额外的权限。前两个选项尤为重要：如果没有这些选项，具有\
    \ NFS 服务器访问权限的攻击者可以在共享文件系统中插入 SUID shell 或受损设备，并自动获得其他文件系统上的权限。虽然我们启用了 root 压缩，但请记住对于\
    \ `bin` 或 `daemon` 等用户并没有压缩，这些用户对客户端可能与 root 访问一样危险！\n\n1.  确保 portmapper 正在运行\n\
    \n    ```\n     /etc/init.d/portmap start\n    ```\n\n2.  通过从 IP 为 10.1.1.50 的服务器挂载远程文件系统来测试连接性\n\
    \n    ```\n     /bin/mount -t nfs 10.1.1.50:/home /home\n    ```\n\n3.  配置 `/etc/fstab`\
    \ 以自动挂载文件系统\n\n    ```\n     /etc/fstab:\n         10.1.1.50:/home /home nfs nosuid,nodev,noexec\
    \ 0 0\n    ```\n\n"
- fmt: "\n## 2. You'll need to assemble some information:\n\n* Your NT domain name\
    \ or workgroup name:\n* List of hosts or networks to grant access to this server's\
    \ shares:\n* IP of NT domain server, if applicable:\n\n## 3. Edit the main Samba\
    \ configuration file, `/etc/samba/smb.conf` (changes excerpted and highlighted\
    \ in **bold**, with comments in *italics*):\n\n```\n /etc/samba/smb.conf\n# workgroup\
    \ = NT-Domain-Name or Workgroup-Name\n# Set this field to your NT domain name\
    \ or the name of your Windows Workgroup\n        workgroup = Mygroup\n\n# Server\
    \ string is the equivalent of the NT Description field\n        # Change this\
    \ string to something innocuous, per your organization's standards.\n# This information\
    \ will show up in the \"Network Neighborhood\" browser for users on the\n# network.\n\
    \        server string = Home directory server\n\n        # Set the list of hosts\
    \ allowed to connect to this one for services\n# Be sure to use only IP addresses\
    \ in this list: hostnames can be spoofed.\n# The following are all valid IPs for\
    \ this list:\n# 192.168.1\\. would choose all IPs starting with 192.168.1.\n#\
    \ 127\\. would choose anything on the loopback network (e.g. 127.0.0.1)\n# 192.168.1.47\
    \ would choose only this host\n        hosts allow = 192.168.1.\n\n# Server security\
    \ level:\n# This will set the method by which Samba authenticates users for shares.\
    \ Do NOT set this\n# to \"share\", as this can allow remote clients to mount shares\
    \ by only sending a username\n# for access.\n# Set this to \"user\" (as is the\
    \ default) if you are a standalone server, not part of an NT\n# domain.\n# If\
    \ this machine is part of an NT domain, use `smbpasswd` to add it to the domain,\
    \ and then\n# set this value to \"domain\" to authenticate against the domain\
    \ server.\n        security = user\n\n# Password Level should be set to zero:\
    \ unless you're using Windows 95 or 98, current Windows\n# versions can handle\
    \ properly encoding password strings. Win95, Win98, and Windows for\n# Workgroups\
    \ had a habit of sending passwords in all-upper-case letters, which would cause\n\
    # password checks to fail unless you set this parameter to have the server try\
    \ setting\n# various letters in the password to lower-case. A similar thing happens\
    \ with the username\n# and older DOS-based clients.\n        password level =\
    \ 0\nusername level = 0\n\n# Enable password encryption, to be stored in the `smbpasswd`\
    \ file. Fortunately, Red Hat uses\n# the right behavior by default.\n        encrypt\
    \ passwords = yes\nsmb passwd file = /etc/samba/smbpasswd\n\n# Commenting the\
    \ following lines prevents synchronization of Unix and SMB passwords, which\n\
    # in this case is what we want, to keep the two databases separate. We're going\
    \ to lock\n# the local user accounts and only grant Samba access.\n         unix\
    \ password sync = no\n# passwd program = /usr/bin/passwd %u\n# passwd chat = *New*password\
    \ [etc.]\n     pam password change = no\n\n# Instruct Samba to map NT users to\
    \ local Unix accounts using this file\n        username map = /etc/samba/smbusers\n\
    \n# Do not have Samba act as a domain logon server for Windows 95 workstations\n\
    \        domain logons = no\n\n# Now we define the shares\n# Here are the home\
    \ directories\n[homes]\n  comment = Home Directories\n  # Do not list these shares\
    \ without authentication, e.g. in \"Network Neighborhood\"\n  browseable = no\n\
    \  writable = yes\n  # User accounts are normally valid...\n  valid users = %S\n\
    \  # ...unless they appear in this list. Note the use of \"@wheel\" to designate\
    \ anyone\n  # in the \"wheel\" group.\n  invalid users = root bin daemon adm lp\
    \ sync halt shutdown mail news uucp operator \\\n      games gopher ftp nobody\
    \ vcsa mailnull ntp rpc xfs gdm rpcuser nfsnobody nscd pcap @wheel\n  # Set the\
    \ default umask\n  create mode = 644\n  # Set the default permissions mode for\
    \ shared directories\n  directory mode = 755\n\n# Here are the printer shares\n\
    [printers]\n  comment = Shared Printers\n  path = /var/spool/samba\n  # Do not\
    \ list printer shares without authentication, e.g. in \"Network Neighborhood\"\
    \n  browseable = no\n  # Users must be authenticated to use these printer\nsguest\
    \ ok = no\n  # Users may not remove or disable these printers\n  writable = no\n\
    \  printable = yes\n```\n\n## 4. Create a user on the Samba server\n\n1. First,\
    \ we'll create the user, with a locked shell\n\n```\n useradd -u 1500 -d /home/user\
    \ -s /dev/null -m user\n```\n\n2. Next we can lock the user's local password,\
    \ and set the Samba password, which will be stored in Samba's separate password\
    \ database, `/etc/samba/smbpasswd`\n\n```\npasswd -l user\n       smbpasswd\n\
    ```\n\n## 5. Start up Samba services\n\n```\n /etc/init.d/smb start\n```\n\n**Samba\
    \ Client**\n\nNext, we'll mount the share as client\n\n1. Check that you can mount\
    \ the share from line. For example, we'll mount `/local/samba` on mercury at `192.168.1.50`.\
    \ To ease our configuration a little, we'll add `saturn` to the hosts file on\
    \ mercury.\n\n```\n [root@client root]# echo \"192.168.1.20 saturn\" >> /etc/hosts\n\
    \        [root@client root]# echo >> /etc/hosts\n        [root@client root]# mount\
    \ -t smbfs -o username=user,workgroup=MYGROUP \\\n        //saturn/shared /local/samba\n\
    \        Password: \n        [root@client root]# umount /local/samba\n```\n\n\
    2. Next, we'll secure the mount as much as we can: we'll create an unprivileged\
    \ user and corresponding group to own the files in the directory, and set the\
    \ mount to be group-accessible only. Any users who need access should be added\
    \ to the group.\n\n```\n useradd -u 5000 -d /local/samba -s /dev/null smbowner\n\
    \       passwd -l smbowner\n```\n\n3. Unfortunately, since the mount point requires\
    \ authentication, there is no way for the client to create the mount without entering\
    \ a password of some kind. Since `/etc/fstab` needs to be world-readable, we'll\
    \ instead store the credentials for this mount in a file within root's home directory,\
    \ and make them readable only by root. You can also opt to mark the mount point\
    \ as not automatically mounted at boot (`noauto`), and mount it by hand when you\
    \ reboot, entering the password at the console or over a secure login session.\
    \ This is more secure, but means that unattended reboots will make the filesystem\
    \ vanish until someone connects to the server and manually mounts it.\n\n```\n\
    \ [root@client root]# cat >> /root/.smbmount\n               username = NTUser\
    \         # Make these values very secure and don't make them the same as\n  \
    \             password = NTPassword # any other credentials for any other server!\n\
    \               [ Press <Ctrl>-D ]\n        [root@client root]# chmod 400 /root/.smbmount\n\
    \        [root@client root]# chown root /root/.smbmount\n        [root@client\
    \ root]# chattr +i /root/.smbmount\n```\n\n## 4. Edit /etc/fstab and set up the\
    \ mount options\n\n```\n /etc/fstab\n       [...]\n       # The following should\
    \ be all on one line\n       //saturn/shared /local/samba    smbfs credentials=/root/.smbmount,workgroup=MYGROUP\
    \ \\\n               uid=smbowner,gid=smbowner 0 0\n```\n"
