    \ been the recent development of OpenSSH, a spinoff of the OpenBSD project, which\
    \ has helped bring this protocol into wider use with its open-source implementation\
    \ that compiles on any number of different Unix platforms. As a result, most Linux\
    \ distributions now ship with OpenSSH pre-installed.\n\nWhile configuration of\
    \ SSH for command sessions is covered in another section of this text, one feature\
    \ that is sometimes overlooked is its file-transfer capabilities, intended to\
    \ replace rcp and ftp at one blow. The `scp` and `sftp` commands do an excellent\
    \ job of replacing their non-encrypted counterparts, emulating the command-line\
    \ switches and options so well that in most cases, `scp` in particular can simply\
    \ be used as a drop-in replacement for `rcp`. In this section, we'll configure\
    \ an SSH server such that file transfers using `sftp` are as secure as possible,\
    \ including the use of chroot to jail the users' file-transfer sessions, by patching\
    \ the SSH source code. Unfortunately, the patch currently does not work for scp,\
    \ but chrooted and non-chrooted users can exist side-by-side.\n\nRed Hat, even\
    \ with the most current patches, does not always offer the latest SSH build, so\
