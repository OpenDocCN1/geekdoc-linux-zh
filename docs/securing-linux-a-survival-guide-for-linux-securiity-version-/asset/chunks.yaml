  trans: "\n\n|  | 注意事项 | `GRUB` 默认以明文形式存储密码。一旦安装了 Red Hat，你可以通过以下步骤修改 `/etc/grub.conf`\
    \ 文件，以 MD5 格式存储密码。 |\n\n## 将 GRUB 密码转换为 MD5 格式。\n\n```\n $ /sbin/grub-md5-crypt\n\
    \    Password: (在此提示符处，输入你在安装时创建的 GRUB 密码并按回车)\n    $1$m0tLR/$HbgQzWuPw3pdgGeRFSPH8\
    \ (这是密码的 MD5 哈希值)\n```\n\n编辑 `/etc/grub.conf` 文件，并将明文密码替换为 MD5 哈希值。（在这里使用 `--MD5`\
    \ 选项非常重要，这样 `grub` 才会知道输入的密码是 MD5 格式。如果你不使用 `--MD5` 选项，密码实际上将会被视为 MD5 哈希值本身。）\n\
    \n```\n $ su\n    # vi /etc/grub.conf\n    /etc/grub.conf\n\n    # grub.conf 由\
    \ anaconda 生成\n    #\n    # 注意，在修改此文件后你不需要重新运行 grub\n    # 注意：你有一个 /boot 分区。这意味着\n\
    \    #   所有内核和 initrd 路径都是相对于 /boot/ 的，例如：\n    #   root (hd0,0)\n    #   kernel\
    \ /vmlinuz-version ro root=/dev/hda7\n    #   initrd /initrd-version.img\n   \
    \ #boot=/dev/hda\n    default=0\n    timeout=10\n    splashimage=(hd0,1)/grub/splash.xpm.gz\n\
    \    password --md5 $1$m0tLR/$HbgQzWuPw3pdgGeRFSPH8\n    title Red Hat Linux (2.4.18-3)\n\
    \        root (hd0,0)\n        kernel /vmlinuz-2.4.18-3 ro root=/dev/hda7\n  \
    \      initrd /initrd-2.4.18-3.img\n```\n\n### 2.1.3 防火墙配置\n\n在安装的这一阶段，系统会询问你希望防火墙配置是什么样的。开箱即用的防火墙配置有三种不同的选项。\n\
    \n- **无防火墙 (No Firewall)** – 此选项允许完全访问你的系统且不进行任何安全检查。只有在你没有连接网络并计划在连接网络之前配置自己的防火墙设置时，才使用此选项。\n\
    - **中 (Medium)** – 此设置限制了对系统中某些服务的访问。这些服务包括：\n    - 使用低于 1023 端口的服务\n    - `NFS`\
    \ 服务器端口 (`2049`)\n    - 用于远程 X 客户端的本地 X Windows 系统显示\n    - X 字体服务器端口\n- **高 (High)**\
    \ – 此设置限制性最大，拒绝除 DNS、DHCP 以及你明确允许的其他内容之外的所有访问。\n\n所有这些设置都可以并且应该进一步自定义，以适应你的个人环境。如果你在系统连接到网络时配置系统，你应该使用\
    \ `High` 设置并根据需要进行自定义。你可以参考本指南中的第 `2.2.6` 节获取额外的防火墙配置说明。\n\n### 2.1.4 账户/身份验证配置\n\
    \n在安装过程中，你需要创建一个 root 密码，并有机会添加额外的用户账户。此时，你需要确保选择一个安全的 root 密码。你还应该在此期间添加任何可能需要的额外管理账户。你还应该确保对密码保持\
    \ `MD5` 加密，并维护影子文件（shadow file），将密码存储在与用户名分离的单独。\n\n### 2.1.5 软件包安装\n\n在涉及 Linux\
    \ 安装时，软件包安装是另一个令人困惑的话题。大多数商业 Linux 发行版（如 Red Hat）都提供了许多应用程序供选择。其中许多应用程序执行相同的功能，但使用不同的格式。在考虑系统安全性时，最需要记住的一点是：少即是多。在选择要安装哪些软件包时，无论系统是工作站还是服务器，都要避免接受默认设置。花些时间查看所有提供的软件包。了解这些软件包的作用，并只选择所需的软件包，仅提供所需的功能。不要仅仅因为某个软件包可用就安装它。如果你不需要某个软件包，就不要安装它。\n\
    \n## 2.2 网络安全\n\nRed Hat Linux 中有几个内核选项可以进行配置以提高整体网络安全性。从 `7.0` 版本开始，可以通过编辑 `/etc/sysctl.conf`\
    \ 并进行任何必要的更改来修改内核。每当服务器重启或管理员手动重启网络服务时，该文件都会被加载。与对系统的任何更改一样，强烈建议在执行下列更改之前对该文件进行备份。\n\
    \n### 2.2.1 网络参数修改\n\n编辑 `/etc/sysctl.conf` 以反映以下更改：\n\n```\n net.ipv4.ip_forward\
    \ = 0\n    net.ipv4.conf.all.accept_source_route = 0\n    net.ipv4.tcp_max_syn_backlog\
    \ = 4096\n    net.ipv4.conf.all.rp_filter = 1\n    net.ipv4.tcp_syncookies = 1\n\
    \    net.ipv4.conf.all.send_redirects = 0\n    net.ipv4.conf.all.accept_redirects\
    \ = 0\n    net.ipv4.conf.default.accept_redirects = 0\n```\n\n保存 `/etc/sysctl.conf`\
    \ 并执行以下操作：\n\n```\n [root] # sysctl -p\n```*(注：原文在命令执行处截断，我已完成应用 sysctl 更改的标准步骤)*\n\
    \n### 2.2.2 高级防火墙配置\n\n强烈建议对任何类型的防火墙配置使用 `IPTABLES`。你的具体需求将取决于网络以及你想开放的服务类型。为可能遇到的每种情况提供示例超出了指南的范围，但在附录中提供了一些示例。此外，请利用下面的网站以更好地了解\
    \ `IPTABLES` 及其如何产生收益：\n\n- `http://www.iptables.org`\n- `http://www.linux-firewall-tools.com/`\n\
    - `http://firestarter.sourceforge.net/`\n- `http://www.fwbuilder.org/`\n- `http://www.stearns.org/mason`\n\
    \n## 2.3 访问控制\n\n### 2.3.1 禁止 root 登录\n\n在正常运行参数，root 账户不需要远程登录服务器。任何通过 root 直接登录系统的操作都应限制在本地控制台上。\n\
    \n编辑 `/etc/securetty` 以反映以下更改：\n\n```\n tty1\n    tty2\n    tty3\n    tty4\n \
    \   tty5\n    tty6\n```\n\n保存更改并执行以下操作：\n\n```\n [root] # chown root:root /etc/securetty\n\
    \    [root] # chmod 400 /etc/securetty\n```\n\n### 2.3.2 禁用 CTRL-ALT-Delete\n\n\
    对于物理安全性较差或不存在的机器，强烈建议禁用 `CTRL-ALT-DELETE` 功能，该功能允许攻击者关闭机器。\n\n编辑 `/etc/inittab`\
    \ 注释掉以下行：\n\n```\n # ca::ctrlaltdel:/sbin/shutdown -t3 -r now\n```\n\n保存更改并重启服务使其生效：\n\
    \n```\n [root] # /sbin/init q\n```\n\n"
- fmt: "\n### 2.3.3 Warning Banners\n\nIt is a widely held belief that presenting\
    \ some sort of statutory warning message at login time will assist the prosecution\
    \ of trespassers of the computer system. Changing some of the login banners also\
    \ has the additional benefit of hiding OS version information and other detailed\
    \ system information that an attacker might find useful when targeting his attacks.\
    \ Clearly, the organization's legal counsel should review the content of all such\
    \ warnings before any changes are made to the banners.\n\nEdit `/etc/motd`, `/etc/issue`,\
    \ and `/etc/issue.net` to reflect the appropriate warning message for your organization\
    \ and save the changes. An example follows:\n\n```\n This system is for authorized\
    \ use only. All activity may be monitored and/or logged\n```\n\nAn explanation\
    \ of what each file does is listed below:\n\n*   `/etc/motd` – This file displays\
    \ the \"message of the day\" once the user has successfully logged into the system.\n\
    *   `/etc/issue` – This file is displayed to any user that is logging into the\
    \ system locally.\n*   `/etc/issue.net` – This file is displayed to those users\
    \ logging in remotely via `SSH`, `Telnet`, or `FTP`.\n\n| | Note | | Earlier versions\
    \ of Red Hat Linux contained commands in `/etc/rc.d/rc.local` that would overwrite\
    \ `/etc/issue` and `/etc/issue.net` each time the system was booted. These commands\
    \ are not present in the 7.3 release of Red Hat; therefore, modifying the files\
    \ listed above should be sufficient in displaying the appropriate warning banner.\
    \ |\n\n### 2.3.4 Password Protect Single-user Mode\n\nLinux provides a mechanism\
    \ for system maintenance via the \"Single User Mode\" which is typically started\
    \ when the system is booting. This allows an attacker at the console to bypass\
    \ any system protection and move into Run Level 1 as root. The ramifications are\
    \ serious and it is necessary to password protect the single user mode to prevent\
    \ this from happening.\n\nEdit `/etc/inittab` to reflect the following change:\n\
    \n```\n id:3:initdefault:\n    ~~:S:wait:/sbin/sulogin\n```\n\nSave the changes\
    \ and restart the service:\n\n```\n [root] # /sbin/init q\n```\n\n## 2.4 USER\
    \ ACCOUNT SECURITY\n\nThe following steps should be taken to increase the security\
    \ of user accounts on the system.\n\n### 2.4.1 Password Aging\n\nBy default, Red\
    \ Hat 7.3 requires users to change their password every 99999 days (i.e. never)\
    \ and sets no minimum limit on how long a password must be kept before changing\
    \ it. Issue the following command to set limits for all existing users whose ID\
    \ is greater than 500, the default range for normal user accounts.\n\n```\n [root@localhost]#\
    \ awk -F: '$3 >= 500 { system (\"chage -M 180 -m 2 \" $1) }' /etc/passwd\n```\n\
    \nChange the following lines in the `/etc/login.defs` so newly created user accounts\
    \ will inherit these values.\n\n```\n PASS_MAX_DAYS  99999 -> PASS_MAX_DAYS  \
    \  180\n    PASS_MIN_DAYS  0      -> PASS_MIN_DAYS   2\n```\n\n### 2.4.2 Purging\
    \ Unnecessary Accounts\n\nSeveral unneeded user accounts are added to the system\
    \ at the time of installation. For better system security, the number of users\
    \ in the `/etc/passwd` file should be as small as required for the system to fulfill\
    \ its mission. This will make it easier to detect any unauthorized additions of\
    \ users. Before making any edits, copy the files to backup versions:\n\n```\n\
    \ [root@localhost]#for file in /etc/{passwd,shadow,group} ; do /bin/cp -p $file\
    \ $file.orig ; done\n```\n\nRemove accounts for unnecessary users using the following\
    \ command\n\n```\n [root@localhost]# for user in uucp operator games gopher ;\
    \ do /usr/sbin/userdel $user ; done\n```\n\nRemove unnecessary groups using the\
    \ following command\n\n```\n [root@localhost]# for group in dip gopher games uucp;\
    \ do /usr/sbin/groupdel $group ; done\n```\n\nWhenever users or groups are deleted,\
    \ it is prudent to perform the following verification steps. First, to verify\
    \ that no mistakes exist that will prevent users from logging in, run the following\
    \ commands:\n\n```\n [root@localhost]# /usr/sbin/pwck\n    [root@localhost]# /usr/sbin/grpck\n\
    ```\n\n`conf.all.send_redirect` The `pwck` and `grpck` command verify, respectively,\
    \ that the `/etc/passwd` and `/etc/group` files are properly formatted and have\
    \ valid data in each field. Second, to verify that files previously owned by the\
    \ deleted users or groups are assigned to the root user, issue the following commands:\n\
    \n```\n [root@localhost]# /usr/sbin/find / -nouser --exec /bin/chown root {} \\\
    ;\n    [root@localhost]# /usr/sbin/find / -nogroup --exec /bin/chgrp root {} \\\
    ;\n```\n\n### 2.4.3 Locking System Accounts\n\nSome user accounts are only used\
    \ by a system service or daemon and never require interactive login. For increased\
    \ security, the ability to interactively log in should be disabled for these accounts.\
    \ Issue the following command, which assigns an invalid shell to the accounts\
    \ (i.e. `/dev/null`), to make sure they are locked.\n\n```\n [root@localhost]#\
    \ for user in bin daemon adm ftp sync lp mail news nobody ; do /usr/sbin/usermodL-s\
    \ /dev/null $user ; done\n```\n\n### 2.4.4 Verify No Accounts Have Empty Passwords\n\
    \nAccounts with empty passwords pose a grave security risk to the system because\
    \ all that is needed to login to such an account is knowledge of the login name.\
    \ These accounts can be easily detected by checking to see if the second field\
    \ of the `/etc/shadow` file is blank. Issue the following command:\n\n```\n [root@localhost]#\
    \ awk -F: '($2 == \"\") { print $1 }' /etc/shadow\n```\n\nIf no login names are\
    \ printed, all is well. If any login names are printed, add a password for the\
    \ user or lock/delete the account.\n\n### 2.4.5 Tighten default umask\n\nThe `umask`\
    \ for a user determines permissions on any new files created by the user. As installed,\
    \ the `umask` for normal user accounts (defined as ones where the user name is\
    \ the same as the group name) with user id greater than 99 is 002 (i.e. `rw-rw-r—`\
    \ for files and `rwxrwxr-x` for directories). For other users, including the root\
    \ user, it is 022 (i.e. `rw-r—r—` for files and `rwxr-xr-x` for directories).\n\
    \nFor tighter security, the default `umask` for the root user should not result\
    \ in group and world readable files. The default `umask` for normal users should\
    \ not result in the creation of world readable files. Edit the lines in the `/etc/bashrc`\
    \ and `/etc/csh.cshrc` files:\n\n```\n Change:   umask 022    ->    umask 077\n\
    \              umask 002    ->    umask 007\n```\n\nCaveat: Some `rpm` packages\
    \ assume that the default `umask` will be 022 for the root user. Changing it to\
    \ 77, as recommended, will occasionally result in warning messages during installation\
    \ or upgrade of these packages.\n\n### 2.4.6 Miscellaneous Account Limits\n\n\
    The Pluggable Authentication Module (`PAM`) for Linux package enables enforcement\
    \ of many different types of control over user accounts. Configuration files are\
    \ located in the `/etc/security` directory. The configuration file regulating\
    \ system resource usage is `limits.conf` and it is discussed in the next section.\
    \ The configuration file regulating from where authorized user logins may originate\
    \ is `access.conf`, and the one regulating at what time of day authorized logins\
    \ may occur is `time.conf.` Default versions of the aforementioned three files\
    \ are included in Appendix B. Each one contains comments that include implementation\
    \ instructions with usage examples.\n\n#### 2.4.6.1 System Resources Usage (from\
    \ Bastille)\n\nTo prevent individual users from consuming too many system resources,\
    \ edit the `/etc/security/limits.conf` file so that core files will not be created\
    \ (see note below), individual file sizes are limited to 100 MB, and a user can\
    \ only have 150 concurrent processes running.\n\nAdd the lines:\n\n```\n * hard\
    \    core   0\n    * hard    fsize  102400\n    * hard    nproc  150\n```\n"
  raw: "### 2.3.3 Warning Banners\n\nIt is a widely held belief that presenting some\
    \ sort of statutory warning message at login time will assist the prosecution\
    \ of trespassers of the computer system. Changing some of the login banners also\
    \ has the additional benefit of hiding OS version information and other detailed\
    \ system information that an attacker might find useful when targeting his attacks.\
    \ Clearly, the organization's legal counsel should review the content of all such\
    \ warnings before any changes are made to the banners.\n\nEdit `/etc/motd, /etc/issue,\
    \ and /etc/issue.net` to reflect the appropriate warning message for your organization\
    \ and save the changes. An example follows:\n\n```\n This system is for authorized\
    \ use only. All activity may be monitored and/or logged\n```\n\nAn explanation\
    \ of what each file does is listed below:\n\n*   `/etc/motd` – This file displays\
    \ the \"message of the day\" once the user has successfully logged into the system.\n\
    \n*   `/etc/issue` – This file is displayed to any user that is logging into the\
    \ system locally.\n\n*   `/etc/issue.net` – This file is displayed to those users\
    \ logging in remotely via SSH, Telnet, or FTP.\n\n|  | Note  | Earlier versions\
    \ of Red Hat Linux contained commands in `/etc/rc.d/rc.local` that would overwrite\
    \ `/etc/issue` and `/etc/issue.net` each time the system was booted. These commands\
    \ are not present in the 7.3 release of Red Hat; therefore, modifying the files\
    \ listed above should be sufficient in displaying the appropriate warning banner.\
    \ |\n\n### 2.3.4 Password Protect Single-user Mode\n\nLinux provides a mechanism\
    \ for system maintenance via the \"Single User Mode\" which is typically started\
    \ when the system is booting. This allows an attacker at the console to bypass\
    \ any system protection and move into Run Level 1 as root. The ramifications are\
    \ serious and it is necessary to password protect the single user mode to prevent\
    \ this from happening.\n\nEdit `/etc/inittab` to reflect the following change:\n\
    \n```\n id:3:initdefault:\n    ~~:S:wait:/sbin/sulogin\n```\n\nSave the changes\
    \ and restart the service:\n\n```\n [root] # /sbin/init q\n```\n\n## 2.4 USER\
    \ ACCOUNT SECURITY\n\nThe following steps should be taken to increase the security\
    \ of user accounts on the system.\n\n### 2.4.1 Password Aging\n\nBy default, Red\
    \ Hat 7.3 requires users to change their password every 99999 days (i.e. never)\
    \ and sets no minimum limit on how long a password must be kept before changing\
    \ it. Issue the following command to set limits for all existing users whose ID\
    \ is greater than 500, the default range for normal user accounts.\n\n```\n [root@localhost]#\
    \ awk -F: '$3 >= 500 { system (\"chage -M 180 -m 2 \" $1) }' /etc/passwd\n```\n\
    \nChange the following lines in the /etc/login.defs so newly created user accounts\
    \ will inherit these values.\n\n```\n PASS_MAX_DAYS  99999 -> PASS_MAX_DAYS  \
    \  180\n    PASS_MIN_DAYS  0      -> PASS_MIN_DAYS   2\n```\n\n### 2.4.2 Purging\
    \ Unnecessary Accounts\n\nSeveral unneeded user accounts are added to the system\
    \ at the time of installation. For better system security, the number of users\
    \ in the / etc/passwd file should be as small as required for the system to fulfill\
    \ its mission. This will make it easier to detect any unauthorized additions of\
    \ users. Before making any edits, copy the files to backup versions:\n\n```\n\
    \ [root@localhost]#for file in /etc/{passwd,shadow,group} ; do /bin/cp -p $file\
    \ $file.orig ; done\n```\n\nRemove accounts for unnecessary users using the following\
    \ command\n\n```\n [root@localhost]# for user in uucp operator games gopher ;\
    \ do /usr/sbin/userdel $user ; done\n```\n\nRemove unnecessary groups using the\
    \ following command\n\n```\n [root@localhost]# for group in dip gopher games uucp;\
    \ do /usr/sbin/groupdel $group ; done\n```\n\nWhenever users or groups are deleted,\
    \ it is prudent to perform the following verification steps. First, to verify\
    \ that no mistakes exist that will prevent users from logging in, run the following\
    \ commands:\n\n```\n [root@localhost]# /usr/sbin/pwck\n    [root@localhost]# /usr/sbin/grpck\n\
    ```\n\n`conf.all.send_redirect` The pwck and grpck command verify, respectively,\
    \ that the /etc/passwd and /etc/group files are properly formatted and have valid\
    \ data in each field. Second, to verify that files previously owned by the deleted\
    \ users or groups are assigned to the root user, issue the following commands:\n\
    \n```\n [root@localhost]# /usr/sbin/find / -nouser --exec /bin/chown root {} \\\
    ;\n    [root@localhost]# /usr/sbin/find / -nogroup --exec /bin/chgrp root {} \\\
    ;\n```\n\n### 2.4.3 Locking System Accounts\n\nSome user accounts are only used\
    \ by a system service or daemon and never require interactive login. For increased\
    \ security, the ability to interactively log in should be disabled for these accounts.\
    \ Issue the following command, which assigns an invalid shell to the accounts\
    \ (i.e., / del/null), to make sure they are locked.\n\n```\n [root@localhost]#\
    \ for user in bin daemon adm ftp sync lp mail news nobody ; do /usr/sbin/usermodL\
    \ -\ns /dev/null $user ; done\n```\n\n### 2.4.4 Verify No Accounts Have Empty\
    \ Passwords\n\nAccounts with empty passwords pose a grave security risk to the\
    \ system because all that is needed to login to such an account is knowledge of\
    \ the login name. These accounts can be easily detected by checking to see if\
    \ the second field of the /etc/shadow file is blank. Issue the following command:\n\
    \n```\n [root@localhost]# awk -F: '($2 == \"\") { print $1 }' /etc/shadow\n```\n\
    \nIf no login names are printed, all is well. If any login names are printed,\
    \ add a password for the user or lock/delete the account.\n\n### 2.4.5 Tighten\
    \ default umask\n\nThe umask for a user determines permissions on any new files\
    \ created by the user. As installed, the umask for normal user accounts (defined\
    \ as ones where the user name is the same as the group name) with user id greater\
    \ than 99 is 002 (i.e. rw-rw-r— for files and rwxrwxr-x for directories). For\
    \ other users, including the root user, it is 022 (i.e. rw-r—r— for files and\
    \ rwxr-xr-x for directories).\n\nFor tighter security, the default umask for the\
    \ root user should not result in creation of group and world readable files and\
    \ directories. The default umask for normal users should not result in the creation\
    \ of world readable files. Edit the lines in the /etc/bashrc and /etc/csh.cshrc\
    \ files:\n\n```\n Change:   umask 022    ->    umask 077\n              umask\
    \ 002    ->    umask 007\n```\n\nCaveat: Some rpm packages assume that the default\
    \ umask will be 022 for the root user. Changing it to 077, as recommended here,\
    \ will occasionally result in warning messages during installation or upgrade\
    \ of these packages.\n\n### 2.4.6 Miscellaneous Account Limits\n\nThe Pluggable\
    \ Authentication Module (PAM) for Linux package enables enforcement of many different\
    \ types of control over user accounts. Configuration files are located in the\
    \ `/etc/security` directory. The configuration file regulating system resource\
    \ usage is `limits.conf` and it is discussed in the [next section](#LiB0015.html_ch02lev3sec1).\
    \ The configuration file regulating from where authorized user logins may originate\
    \ is `access.conf,` and the one regulating at what time of day authorized logins\
    \ may occur is `time.conf.` Default versions of the aforementioned three files\
    \ are included in [Appendix B](#LiB0035.html_195). Each one contains comments\
    \ that include implementation instructions with usage examples.\n\n#### 2.4.6.1\
    \ System Resources Usage (from Bastille)\n\nTo prevent individual users from consuming\
    \ too many system resources, edit the `/etc/security/limits.conf` file so that\
    \ core files will not be created (see note below), individual file sizes are limited\
    \ to 100 MB, and a user can only have 150 concurrent processes running.\n\nAdd\
    \ the lines:\n\n```\n * hard    core   0\n    * hard    fsize  102400\n    * hard\
    \    nproc  150\n```"
