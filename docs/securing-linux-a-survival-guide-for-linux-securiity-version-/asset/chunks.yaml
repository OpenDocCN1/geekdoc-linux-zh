    While chrooted, the daemon will require access to system libraries and devices
    to answer requests. Since this miniature root filesystem is all that it will have
    access to while running, we need to replicate that information within the chroot.
    The libraries necessary were obtained by running `ldd` against the BIND binaries
    in `/usr/local/bind/sbin` to determine which libraries were compiled into them.


    ```

    mknod /usr/local/bind/dev/null c 1 3

    mknod /usr/local/bind/dev/random c 1 8

    chmod 666 /usr/local/bind/dev/null /usr/local/bind/dev/random

    cp /lib/libcrypto.so.2 /usr/local/bind/lib

    cp /lib/libnsl.so.1 /usr/local/bind/lib

    cp /lib/libc.so.6 /usr/local/bind/lib

    cp /lib/libdl.so.2 /usr/local/bind/lib

    cp /lib/ld-linux.so.2 /usr/local/bind/lib

    ```

    [/content] (Wait, I will just provide the final result de-duplicated version).


    [content]

    Securing DNS services can be a tricky and time-consuming task, requiring an administrator
    to spend a great deal of time planning and anticipating the organization''s future
    growth and existing needs. The use of ISC''s BIND DNS server ([http://www.isc.org/products/BIND])
    has become an industry standard, marred by frequent discoveries of security problems
    either inherent in the server code or its design that have permitted attackers
    to compromise DNS servers, poison caches of DNS information and perform other
    such nefarious attacks on organizations.


    Fortunately, the recent spate of DNS attacks have caused those designing and maintaining
    the BIND code to design new safeguards for DNS information which, although somewhat
    cumbersome to establish, can help secure servers against attacks that might compromise
    or alter DNS information. We will explore below two common configurations for
    a DNS server: an internal caching DNS server, and a server which hosts DNS zones.


    To maintain a high degree of security, both configurations will be confined to
    a "jail" on the server limiting their access: using the `chroot()` system call,
    the BIND server can be instructed to confine itself to a small area of the system
    as if that were the entire server. Any attacks that compromise the daemon will
    thus leave the attacker within the restricted area, unable to access any other
    portions of the server. In keeping with recent developments in BIND, we will deploy
    version 9 of the server: be sure, when you fetch the source code for this edition,
    that you are obtaining the latest stable release of the code possible, and always
    check with references such as BUGTRAQ to be sure there are no outstanding security
    breaches known for that version.


    An exhaustive examination of all of the possible configurations and options for
    DNS would be well beyond the scope of this document: the user is directed to such
    works as Albitz and Liu''s DNS and BIND (O''Reilly Publishing), now in its fourth
    edition, for a more encyclopedic reference to this protocol.


    **For all of the examples below, the following configuration has been used:**


    Internal network: `1.3.5.0 / 24`


    External network: `2.4.6.0 / 24`


    Domain: `example.com`


    `1.3.5.50` is the primary DNS server, with a secondary DNS server at `2.4.6.5`.
    This network''s ISP also offers a caching DNS server at `3.5.7.10`.


    ### 3.4.1 Caching-only Nameserver


    This nameserver will offer DNS service to a local network. Although it does not
    host any DNS domains (also called "zones"), it accepts queries from the local
    network and resolves them against a cache of recent requests. If it finds that
    it cannot answer the request from its own cache of information, it will (depending
    on its configuration) either forward the query upstream to the ISP''s caching
    nameserver to see if *it* can answer the query, or can perform recursive queries
    out to the Internet on its own to discover the necessary information.


    #### 3.4.1.1 Unpack Sources and Compile Binaries


    ```

    tar --zxvf bind-9.2.1.tar.gz

    cd bind-9.2.1

    ```


    Configure in OpenSSL support to enable transaction signing


    ``` even./configure --with-openssl --with-randomdev=/dev/random

    make

    ```


    Here, we''re going to use the `DESTDIR` option for installing the binaries directly
    into the chroot jail, which saves time.


    ```

    mkdir /usr/local/bind

    make install DESTDIR=/usr/local/bind

    ```


    #### 3.4.1.2 Set Up the Chroot Jail Environment


    ```

    cd /usr/local/bind

    ```


    Now we need to simulate the root environment, since this corner of the filesystem
    is all that the daemon will have access to while it is running.


    ```

    mkdir -p dev etc named/local var/run

    ```


    We need an unprivileged user account under which the server will run, with a separate
    and unique group. This permits the daemon to own files and directories to which
    it has to write, without overlapping those permissions with other areas of other
    filesystems.


    ```

    useradd -s /dev/null -d /usr/local/bind dns

    groupadd dns

    ```


    The daemon will store several volatile files in `/var/run` in the jail, so it
    will need access to write to those.


    ```

    chown -R dns:dns /usr/local/bind/var/run

    ```


    While chrooted, the daemon will require access to system libraries and devices
    to answer requests. Since this miniature root filesystem is all that it will have
    access to while running, we need to replicate that information within the chroot.
    The libraries necessary were obtained by running `ldd` against the BIND binaries
    in `/usr/local/bind/sbin` to determine which libraries were compiled into them.


    ```

    mknod /usr/local/bind/dev/null c 1 3

    mknod /usr/local/bind/dev/random c 1 8

    chmod 666 /usr/local/bind/dev/null /usr/local/bind/dev/random

    cp /lib/libcrypto.so.2 /usr/local/bind/lib

    cp /lib/libnsl.so.1 /usr/local/bind/lib

    cp /lib/libc.so.6 /usr/local/bind/lib

    cp /lib/libdl.so.2 /usr/local/bind/lib

    cp /lib/ld-linux.so.2 /usr/local/bind/lib

    ```

