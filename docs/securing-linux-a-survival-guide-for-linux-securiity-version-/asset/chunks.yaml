  trans: "\naccess 数据库采用了一种简单的“键值对”格式，用于配置 `sendmail` 允许的中继域名。“键”是一个完全限定的主机名、子域名、域名或网络。“值”是一个操作，如\
    \ `REJECT`、`DISCARD`、`OK`、`RELAY` 或任意消息。只有定义了 `RELAY` 操作的主机或域名才允许使用该邮件服务器作为邮件中继。例如，如果您的域名是\
    \ `mailserver.com`，且我们的服务器也处理 `192.168.x.x` 网络上所有主机的邮件，请编辑 `/etc/mail/access`\
    \ 为：\n\n```\n mailserver.com            RELAY\n    192.168                   RELAY\n\
    ```\n\n保存对 `/etc/mail/access` 的更改，使用 `makemap` 实用程序创建该文件的数据库映射，并重启 `sendmail`\
    \ 守护进程：\n\n```\n [root] # makemap hash /etc/mail/access.db < /etc/mail/access\n\
    \    [root] # /etc/rc.d/init.d/sendmail restart\n```\n\n每当修改 `/etc/mail/access`\
    \ 中的信息时，必须运行新的 `makemap` 命令并重启 `sendmail` 守护进程，以确保更改生效。上面的示例仅用于说明 access 数据库的简单用法。更详细的说明和高级配置可以在此处找到：[`www.sendmail.org/tips/relaying.html`](http://www.sendmail.org/tips/relaying.html)\n\
    \n### 3.2.1.5 设置域名伪装 (Domain Masquerading)\n\n许多组织倾向于为所有员工使用统一的邮件地址，例如 `joeuser@mailserver.com`。虽然某些邮件客户端可以配置使用特定域名，但即使是小型环境中管理多个邮件客户端也可能繁琐且成本高昂。可以配置\
    \ Sendmail 重写所有出站消息的头，使其伪装成整个组织的单一域名。若要定义伪装地址，请编辑 `/etc/mail/sendmail.mc` 以反映以下示例：\n\
    \n```\n MASQUERADE_AS('mailserver.com')dnl\n    FEATURE ('masquerade_entire_domain')dnl\n\
    \    FEATURE ('masquerade_envelope')dnl\n```\n\n通过运行 `m4` 宏生成新的 `sendmail.cf`\
    \ 文件并重启 `sendmail` 守护进程：\n\n```\n [root] # m4 /etc/mail/sendmail.mc > /etc/sendmail.cf\n\
    \    [root] # /etc/rc.d/init.d/sendmail restart\n```\n\n### 3.2.1.6 配置 Sendmail\
    \ 使用 RBL 支持\n\n实时黑洞列表（Real-time Blackhole List，简称 RBL）是一种基于 DNS 的服务，包含一个怀疑和已知的垃圾邮件发送者数据库。`m4`\
    \ 特性 `dnsbl` 允许 sendmail 引用此数据库并自动拒绝任何源自 RBL 列表域名的消息。需要注意的是，RBL 并非精确的科学，有时您想要通信的域名会被发现列在\
    \ RBL 列表中。将域名移除通常很困难，因此建议谨慎使用此功能，因为它可能会导致与合法域名的通信中断。要向 sendmail 中添加此功能，请编辑 `/etc/mail/sendmail.mc`\
    \ 并添加以下内容：\n\n```\nFEATURE (‘dnsbl’)dnl\n```\n\n通过运行 `m4` 宏生成新的 `sendmail.cf`\
    \ 文件并重启 `sendmail` 守护进程：\n\n```\n [root] # m4 /etc/mail/sendmail.mc > /etc/sendmail.cf\n\
    \    [root] # /etc/rc.d/init.d/sendmail restart\n```\n\n### 3.2.1.7 安装备用 MTA\n\
    \n还有其他几种邮件传输代理（MTA）可以替换 sendmail。三个流行的替代方案是：Daniel Bernstein 开发的 Qmail ([`www.qmail.org`](http://www.qmail.org))、Wietse\
    \ Venema 开发的 Postfix ([`www.postfix.org`](http://www.postfix.org)) 以及由剑桥大学开发的\
    \ Exim ([`www.exim.org/`](http://www.exim.org/))。这些 MTA 在编写时考虑了安全性，通常被认为提供了高性能性能。本指南不涵盖这些替代方案的安装和配置细节，但在它们各自的网站上可以获得丰富信息。\n\
    \n### 3.2.2 加密 POP 和 IMAP 守护进程\n\n对于为组织收集所有入站邮件的邮件服务器，将邮件递送到客户端的常用方法是让他们使用邮局协议\
    \ (POP) 或互联网消息访问协议 (IMAP) 来检索邮件。POP（也称为 POP3）是两种协议中较旧且不复杂的，提供了从邮件服务器身份验证、检索和删除邮件消息的基本命令。IMAP\
    \ 更灵活，支持创建、删除和重命名邮件文件夹（邮箱箱）、搜索、选择性检索消息属性等功能。\n\n### 3.2.2.1 获取最新版本的 POP 和 IMAP\
    \ 守护进程\n\n遗憾的是，许多 POP 和 IMAP 守护进程实现一直受到漏洞的影响，导致各种平台上的邮件服务器遭受远程 root 攻击。有几个已知的漏洞程序可以破解有漏洞的\
    \ Linux POP 和 IMAP 守护进程。通常认为良好的做法是始终使用任何守护进程最新且稳定的版本，这一点也不例外。\n\n目前可用的大多数新 POP\
    \ 和 IMAP 守护进程将提供安全检索消息的支持。这通常通过 TLS/SSL 实现，需要使用 OpenSSL 并创建证书。\n\n### 3.2.2.2\
    \ 使用 Wrappers 控制 POP 和 IMAP 的访问\n\nPOP/IMAP 传统运行在 `xinetd` 中，因此通过封装器（wrappers）进行访问控制很容易配置，并增加了一个重要的安全要素。将访问限制为仅对服务有合法需要的主机。对于持有\
    \ `mailserver.com` 域名和 `192.168.x` 网络邮件并通过 POP3 或 IMAP 将其递送到客户端的中央邮件中心，请编辑 `/etc/hosts.allow`\
    \ 以反映以下更改：\n\n```\nipop3d:        .mailserver.com        192.168.\nimapd:    \
    \     .mailserver.com        192.168.\n```\n"
- fmt: "\n```\n email ftpadmin@ftpserver.mydomain.com\n```\n\n*   Permit only 2 failed\
    \ logins before terminating the session\n\n```\n loginfails 2\n```\n\n*   Set\
    \ the welcome message to something we can control and eliminate from directory\
    \ listings\n\n```\n message /.ftpwelcome.msg        login\n```\n\n*   Do not allow\
    \ on-the-fly tarring and compressing\n\n```\n compress   no    all\n        tar\
    \        no    all\n```\n\n*   Prevent certain actions by anonymous and/or guest\
    \ users. Explicitly list permissions for everyone.\n\n```\n chmod      no    guest,anonymous\n\
    \        delete     no    anonymous\n        overwrite  no    anonymous\n    \
    \    rename     no    anonymous\n        umask      no    real,guest,anonymous\n\
    \        delete     yes   real,guest\n        overwrite  yes   real,guest\n  \
    \      rename     yes   real,guest\n```\n\n*   Log commands and transfers to and\
    \ from the server (this will not log passwords unless the user types one as a\
    \ command by mistake).\n\n```\n log commands real,anonymous,guest\n        log\
    \ transfers anonymous,guest,real inbound,outbound\n```\n\n*   Mark certain files\
    \ as non-retrievable\n\n```\n noretrieve .notar\nnoretrieve .ftpwelcome.msg\n\
    ```\n\n*   Set a secure path filter to weed out evil files\n\n```\n path-filter\
    \ guest,anonymous /etc/pathmsg ^[-A-Za-z0-9_\\.]*$ ^\\. ^-\n```\n\n*   Shorten\
    \ the greeting string so as not to provide the server version\n\n```\n greeting\
    \ terse\n```\n\n*   Use secure default umasks for everyone\n\n```\n defumask 0377\n\
    defumask 0177 real\ndefumask 0133 guest\n```\n\nFinally, we need to make some\
    \ modifications to our users' home directories. Let's set up a user who will only\
    \ be permitted to FTP files in and out of his directory, but nothing more.\n\n\
    ```\n useradd -d /home/user -s /sbin/nologin -m user\n    passwd user # Set the\
    \ user's password\n    cd /home/user\n    cp /etc/issue.net /home/user/.ftpwelcome.msg\
    \ # You have a security banner in /etc/issue.net, right?\n    chown root:root\
    \ /home/user/.ftpwelcome.msg\n    chmod 444 /home/user/.ftpwelcome.msg # Keep\
    \ the user from tampering with the message or\n    chattr +i /home/user/.ftpwelcome.msg\
    \ # disabling it.\n    for file in .rhosts .shosts .netrc .forward ; do # Script\
    \ the creation and lockdown\n     touch $file     # of some sensitive files.\n\
    \     chown root:root $file\n     chmod 0 $file\n     chattr +i $file\n     done\n\
    \    rm .bash* .gtk* # Since he'll never login, he'll never need shell files\n\
    ```\n\nNow test the server:\n\n```\n [user@otherhost user]$ ftp 192.168.1.20\n\
    \    Connected to 192.168.1.20.\n    220 FTP server ready.\n    User (192.168.1.20:(none)):\
    \ luser\n    331 Password required for luser.\n    Password:\n    230-### WARNING\
    \ ###\n    230-\n    230-This automated information system is for the exclusive\
    \ use of\n    230-Systems Engineering personnel. Use of this system\n    230-without\
    \ privilege or in excess of granted authority is forbidden, and\n    230-may be\
    \ subject to civil and criminal penalties up to and including the\n    230-fullest\
    \ extent permitted by law.\n    230-\n    230-Users accessing this system are\
    \ subject to having their actions\n    230-monitored and recorded at any time.\
    \ Use or access of this system in\n    230-any fashion constitutes expressed knowledge\
    \ and acceptance of this\n    230-policy.\n    230-\n    230-### WARNING ###230-\n\
    \    230 User luser logged in. Access restrictions apply.\n    ftp> pwd\n    257\
    \ \"/\" is current directory.\n    ftp> ls -la\n    200 PORT command successful.\n\
    \    150 Opening ASCII mode data connection for directory listing.\n    total\
    \ 24\n    drwx--------- 2     2501   2501    4096 Aug 18 22:39 .\n    drwx---------\
    \ 2     2501   2501    4096 Aug 18 22:39 ..\n    --------------- 1 root   root\
    \    0 Aug 18 22:39 .forward\n    -r---r---r--- 1     root   root    554 Aug 18\
    \ 22:38 .ftpwelcome.msg\n    --------------- 1 root   root    0 Aug 18 22:39 .netrc\n\
    \    --------------- 1 root   root    0 Aug 18 22:39 .rhosts\n    ---------------\
    \ 1 root   root    0 Aug 18 22:39 .shosts\n    226 Transfer complete.\n    ftp:\
    \ 455 bytes received in 0.00Seconds 4550\n"
