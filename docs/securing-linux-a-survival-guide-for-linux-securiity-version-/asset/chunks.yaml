  trans: "\n\n你可以通过在命令行中将服务器作为 `host` 命令的第二个参数来测试该服务器（注意，“nslookup”已弃用，并可能在 BIND 的未来版本中移除，因此现在是养成使用其他工具的习惯了！）：\n\
    \n```\n host 127.0.0.1 1.3.5.50\n```\n\n你应该能看到如下响应：\n\n```\n Using domain server:\n\
    \    Name: 1.3.5.50\n    Address: 1.3.5.50#53\n    Aliases:\n\n    1.0.0.127.in-addr.arpa\
    \ domain name pointer localhost\n```\n\n### 3.4.2.6 创建启动文件并添加到 rc.d 层次结构\n\n将本节末尾显示的示例\
    \ `named` 启动脚本复制到 `/etc/init.d`（或编写自己的脚本），并使用 `chkconfig:` 将添加到启动层次结构中：\n\n```\n\
    \ /sbin/chkconfig ---level 2345 ---add named\n```\n\n### 3.4.3 示例 BIND 配置文件\n\n\
    ```\n /usr/local/bind/named/local/chaos\n    $TTL  1D\n    $ORIGIN bind.\n   \
    \ @ CHAOS SOA localhost. root.localhost. (\n           42   ; serial\n       \
    \    3H   ; refresh\n           15M  ; retry\n           1W   ; expiry\n     \
    \      1D ) ; minimum\n    @ CHAOS NS  localhost.\n\n    version.bind. CH  TXT\
    \ \"No version here\"\n    authors.bind. CH  TXT \"No authors here\"\n\n/usr/local/bind/named/local/reverse.127.0.0\n\
    \    $TTL  1D\n    $ORIGIN    0.0.127.in-addr.arpa\n    @ 1D IN SOA localhost.\
    \ root.localhost. (\n           42   ; serial\n           3H   ; refresh\n   \
    \        15M  ; retry\n           1W   ; expiry\n           1D ) ; minimum\n \
    \     1D   IN NS  localhost.\n    1 1D   IN PTR localhost.\n\n/usr/local/bind/named/local/localhost\n\
    \    $TTL  1D\n    @ 1D IN SOA @ root.localhost. (\n           42   ; serial\n\
    \           3H   ; refresh\n           15M  ; retry\n           1W   ; expiry\n\
    \           1D ) ; minimum\n      1D   IN NS @\n    1 1D   IN A 127.0.0.1\n\n\
    /usr/local/bind/named/master/mydomain.com_internal\n    $TTL  1D\n    @ 1D IN\
    \ SOA @ root.mydomain.com. (\n           42   ; serial\n           3H   ; refresh\n\
    \           15M  ; retry\n           1W   ; expiry\n           1D ) ; minimum\n\
    \      1D   IN NS @\n     ns    IN A 1.3.5.50\n    www    IN A 1.3.5.20\n\n/usr/local/bind/named/master/mydomain_external\n\
    \    $TTL  1D\n    @ 1D IN SOA @ root.mydomain.com. (\n           42   ; serial\n\
    \           3H   ; refresh\n           15M  ; retry\n           1W   ; expiry\n\
    \           1D ) ; minimum\n      1D   IN NS @\n     ns    IN A 2.4.6.5\n    www\
    \    IN A 2.4.6.20\n\n/usr/local/bind/named/master/reverse.1.3.5\n    $TTL  1D\n\
    \    $ORIGIN 5.3.1.in-addr.arpa\n    @ 1D IN SOA mydomain.com. root.mydomain.com.\
    \ (\n           42   ; serial\n           3H   ; refresh\n           15M  ; retry\n\
    \           1W   ; expiry\n           1D ) ; minimum\n      1D   IN NS ns.\n \
    \  20      IN PTR www.\n   50      IN PTR ns.\n\n/usr/local/bind/named/master/reverse.2.4.6\n\
    \    $TTL  1D\n    $ORIGIN 6.4.2.in-addr.arpa\n    @ 1D IN SOA localhost. root.localhost.\
    \ (\n           42   ; serial\n           3H   ; refresh\n           15M  ; retry\n\
    \           1W   ; expiry\n           1D ) ; minimum\n    1D     IN NS ns.\n \
    \  5       IN PTR ns.\n   20      IN PTR www.\n\n/etc/init.d/named\n   #!/bin/sh\n\
    \   # named This file will start and stop the BIND named daemon\n   #\n   # chkconfig:\
    \ 2345 99 99\n   # description: named is the daemon responsible for mapping IP\
    \ addresses \\\n   # to names and vice versa in response to queries from other\
    \ hosts.\n   # processname: /usr/local/bind/sbin/named\n   # config: /usr/local/bind/etc/named.conf\n\
    \n   # Source function library\n   . /etc/rc.d/init.d/functions\n\n   # Source\
    \ networking functionality and ensure that the network has been started\n   if\
    \ [ -f /etc/sysconfig/network ]; then\n    . /etc/sysconfig/network\n    [ ${NETWORKING}\
    \ = \"no\" ] && exit\n\n# 4.0 附加工具\n\n## 4.1 SWATCH\nSwatch（简单监视器）是一个由 Todd Atkins\
    \ 编写的热门开源工具。Swatch 设计用于根据一组触发器监控日志文件。当 Swatch 检测到触发事件发生时，它可以通过控制台、听性报警或电子邮件向系统发送警报。除了对日志文件的实时监控外，Swatch\
    \ 还可以过滤可疑活动。可以在 `http://www.oitsb.edu/~swatch/` 获取 Swatch。\n\n## 4.2 TRIPWIRE\n\
    Tripwire 是一个文件完整性应用程序，既提供商业版也作为开源产品提供。Tripwire 通过为你选择要监控的所有文件创建哈希来工作。这些哈希值随后存储在数据库中。一旦创建数据库，你就可以安排\
    \ tripwire 定期运行，将你监控的文件哈希值与数据库中存储的哈希值进行比较。商业版的主要优势是供应商支持和集中管理控制台的可用性。Tripwire\
    \ 商业版可以在 `http://www.tripwire.com` 获取。开源版本可以在 `http://www.tripwire.org` 获取。\n\n\
    ## 4.3 入侵检测系统\n入侵检测系统（IDS）是当今安全领域的热点。这些安全设备旨在监控网络中的可疑活动。一旦检测到此类活动，设备就会向管理员发送警报，在某些情况下还可以根据预配置的选项对事件做出响应。由于\
    \ Cisco、ISS 和 Symantic 等供应商提供 IDS 解决方案，商业入侵检测系统的成本可能很高。这一成本因素影响许多小型公司和一些大型公司实施名为\
    \ SNORT 的开源 IDS 解决方案。SNORT 是一个轻级入侵检测系统，提供了与商业 IDS 相似的功能。安全社区还为 SNORT 开发了许多开源插件，例如管理控制台和报告工具。因此，SNORT\
    \ 的性能可以与任何商业系统相当，同时节省了大量的成本。运行在 Linux 上的某些 IDS 解决方案包括：\n\n* `ISS Realse` – `http://www.iss.net`\n\
    * `Enterasys Dragon` – `http://www.enterasys.com`\n* `SNORT` – `http://www.snort.org`\n\
    \n## 4.4 JOHN THE RIPPER\nJohn the Ripper 是一个免费的密码审核工具，或者正如某些人所说的密码破解工具。John the\
    \ Ripper 尝试通过暴力破解猜测 passwd 和 shadow 文件中的密码，并利用字典及其对常见密码创建技术的知识。John the Ripper\
    \ 有三种运行模式：\n\n* `Single Crack Mode`：使用 passwd 文件中的登录和 GECOS 信息（全名、主目录等）作为其密码词列表。\n\
    * `Wordlist Mode`：使用填充的词列表或字典列表。\n\n"
