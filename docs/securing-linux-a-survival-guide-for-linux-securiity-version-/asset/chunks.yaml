  trans: "\n重复步骤 2.5.1，并验证配置为开启状态的服务列表与系统预期的列表匹配。\n\n### 2.5.5 配置对任何已服务的访问\n\n####\
    \ 2.5.5.1 TCP Wrappers (ftp://ftp.porcupine.org/pub/security/index.html)\n\n对于编译了支持\
    \ TCP wrappers 的服务，访问控制通过 `/etc/hosts.allow` 和 `/etc/hosts.deny` 文件实现。当发起连接尝试时，系统会检查\
    \ `hosts.allow` 文件。如果匹配到某行，则允许连接。然后查询 `hosts.deny` 文件，如果匹配到某行，则拒绝连接。如果两个文件中都没有匹配项，则允许连接。\n\
    \n##### 2.5.5.1.1 创建仅限授权使用的横幅 (Banners)\n\n如果按照下所述进行配置，TCP wrappers 将对任何尝试连接其监控的服务的用户显示警告横幅。以下命令集将生成\
    \ `/etc/banners` 目录，其中的文件包含每个服务的警告横幅文本。在本示例中，横幅文本为“此系统的使用仅限授权用户”。注意，警告横幅的准确措辞取决于特定站点；但它至少应该强调系统使用仅限授权人员，且登录系统即视为同意被监控活动。\n\
    \n```\n[root@localhost]# /bin/mkdir -p /etc/banners\n[root@localhost]# /bin/echo\
    \ \"Use of this system is restricted to authorized users\" > /etc/banners/\nprototype\n\
    [root@localhost]# cd /etc/banners ; /usr/bin/make -f /usr/share/doc/tcp_wrappers-7.6/Banners.Makefile\n\
    ```\n\n##### 2.5.5.1.2 拒绝所有明确允许之外\n\n为了实现“拒绝所有明确允许之外”的安全最佳实践，请执行以下命令。\n\n```\n\
    [root@localhost]# echo 'ALL: ALL: spawn (/bin/echo -e '/bin/date'\"\\n%c attempted\
    \ connection to %s\n    and was denied\" \\\n    > | /bin/mail -s \"Connection\
    \ attempt to %s\" root) &' > /etc/hosts.deny\n```\n\n任何未在 `hosts.allow` 文件中列出的连接尝试都将被拒绝，消息将记录到\
    \ syslog auth 设施，并向 root 用户发送 电子邮件。\n\n##### 2.5.5.1.3 允许需要的用户访问\n\n编辑 `hosts.allow`\
    \ 文件，并为每个应允许访问的服务添加一行。下面显示了几个示例（详细信息请参阅 `hosts.allow` 的 man 页面）。\n\n```\n ALL:\
    \ LOCAL : banners /etc/banners            # 来自本地客户端的所有服务（不包含 \".\" 的主机名）\n   \
    \ sshd: 10.1..1.0/255.255.254.0 : banners /etc/banners # 来自主机 IP 地址的 SSH 连接\n\
    \    between 10.1.1.0 and 10.1.2.0\n```\n\n#### 2.5.5.2 xinetd\n\n如果 `xinetd`\
    \ 已禁用或删除（通常是工作站的情况），则应跳过此步骤。\n\n`xinetd` 服务为其管理的的服务提供访问控制。`/etc/xinetd.d` 目录中每个服务都应该有一个文件。要控制对服务的访问，请找到对应服务命名的文件，并在起始括号和结束括号之间添加以下行。\n\
    \n```\nonly_from =   10.1.1.0/23      # 允许来自 10.1.1.0 到 10.1.2.0 之间主机 IP 地址的连接\n\
    ```\n\n### 2.5.6 （仅限服务器）禁用 X Windows\n\n通常没有从控制台操作的服务器系统不应运行 X Windows 服务。执行以下命令配置系统启动到运行级别\
    \ 3（不带 X 的多用户模式），而不是运行级别 5（带 X 的多用户模式），并将原始的 `/etc/inittab` 保存为 `/etc/inittab.bak`。\n\
    \n```\n[root@localhost]# /usr/bin/perl -p -i.bak -e 's/id:5:init/id:3:init/' /etc/inittab\n\
    \n\n## 2.6 应用更新和补丁\n\n强烈建议配置系统自动检查更新的 RPM 包的可用性。这将增加你能够修复系统并关闭已发现的安全漏洞的可能性，防止具有恶意意图的人利用这些漏洞破坏你系统或数据的完整性。\n\
    \n### 2.6.1 Up2date ([`www.redhat.com/docs/manuals/RHNetwork/ref-guide/`](http://www.redhat.com/docs/manuals/RHNetwork/ref-guide/))\n\
    \n对于 Red Hat 7.3，安全更新的自动检查由 Red Hat Network 守护进程 `rhnsd` 控制。默认情况下，该守护进程每 120 分钟尝试连接一次\
    \ Red Hat 服务器以检查可用的包更新，下载并安装任何已签名且已安装在系统中的包更新（以 \"kernel\" 字符串开头的包外），然后通过电子邮件将结果发送给\
    \ root 用户。注意，超过一用户一系统的 `up2date` 服务需要支付订阅费用。\n\n#### 2.6.1.1 在 Red Hat Network\
    \ 注册系统\n\n对于 Red Hat 7.3，安全更新的自动检查由 Red Hat Network 守护进程 `rhnsd` 控制。默认情况下，该守护进程每\
    \ 120 分钟尝试连接一次 Red Hat 服务器以检查可用的包更新，下载并安装任何已签名且已安装在系统中的包更新（以 \"kernel\" 字符串开头的包外），然后通过电子邮件将结果发送给\
    \ root 用户。注意，超过一用户一系统的 `up2date` 服务需要支付订阅费用。\n\n以下命令启动 Red Hat Network 并启动创建系统配置的过程。客户端提示用户创建帐户（即用户名和密码），然后探测系统的主机名、IP\
    \ 地址、内存、PCI 设备、磁盘大小和挂载点。\n\n```\n[root@localhost]# /usr/sbin/rhn_register\n```\n\
    \n#### 2.6.1.2 通过手动检查更新来验证设置\n\n一旦系统注册并创建了配置，运行以下命令：\n\n```\n[root@localhost]#\
    \ /usr/sbin/up2date --nox -p\n[root@localhost]# /usr/sbin/up2date --u\n```\n\n\
    第一个命令将更新与 Red Hat Network 关联的包，第二个命令将安装更新。\n\n#### 2.1.3 确保 rhnsd 配置为启动时运行\n\n\
    ```\n[root@localhost]# /sbin/chkconfig rhnsd\n[root@localhost]# /etc/init.d/rhnsd\
    \ start\n```\n\n### 2.6.2 autorpm ([`www.autorpm.org/`](http://www.autorpm.org/))\n\
    \nautorpm 是 up2date 的一个可行免费替代方案。它用 PERL 编写，可以在交互模式运行、传递命令行选项或直接从脚本调用。默认安装每天检查镜像站点并将结果发送给\
    \ root 用户。虽然 autorpm 可以配置为自动安装 rpm，但默认不会进行用户交互。\n\n#### 2.6.2.1 下载并安装最新稳定 RPM\n\
    \nautorpm 的最新稳定 rpm 包（编写时为 2.9.3）可以在 [`www.autorpm.org/tabs/download/`](http://www.autorpm.org/tabs/download/)\
    \ 下载。包下载完成后，使用以下命令安装：\n\n```\n[root@localhost]# /bin/rpm -i autorpm-2.9.3-1.noarch.rpm\n\
    ```\n\n#### 2.6.2.2 修改 /etc/autorpm.d/redhat-updates.conf 文件\n\n默认情况下，签名检查失败的\
    \ rpm 包将被放入交互队列。为了防止这些可疑 rpm 包以后被安装，在 `action(updated)` 语句的 `PGP_Require(Yes);`\
    \ 行之后添加以下行：\n\n```\nPGP_Fail_Install(No);\n```\n\n默认情况下，任何在镜像站点上但在系统中未安装相应较早版本的\
    \ rpm 更新都将添加到交互队列。为了防止这种情况发生，找到 `action(new)` 语句并将 `Install(Interactive);` 行更改为\
    \ `Install(No);`。\n\n#### 2.6.2.3 通过手动检查更新来验证设置\n\n在不带任何参数的情况下运行 autorpm 命令。第一次运行该命令时，你将有机会查看关于\
    \ autorpm 如何工作的的说明，并被鼓励下载 TermReadlineGnu。接受下载。包将被安装，autorpm 将退出。通过执行以下命令检查更新：\n\
    \n"
- fmt: "\n```\n [root@localhost]# autorpm auto\n```\n\nYou should see messages showing\
    \ FTP connection attempts to a mirror site, and most likely, a list of package\
    \ names for updates that are available. Updated packages (ones that have an earlier\
    \ version already installed on the system) will be downloaded and their PGP signatures\
    \ will be checked. When the prompt returns, issue the following command to install\
    \ the packages:\n\n```\n [root@localhost]# autorpm \"install all\"\n```\n\nYou\
    \ should see messages indicating that the `rpm` packages are being installed,\
    \ and if the installation is successful, that they are being deleted from the\
    \ disk.\n\nAn entry in the `/etc/cron.daily` directory is added by default to\
    \ enable daily checking for updates.\n\n## 2.7 FILE SYSTEM SECURITY\n\n### 2.7.1\
    \ Secure File System Mount Options\n\nThis section outlines edits that can be\
    \ made to the `/etc/fstab` file to enhance the security of the system. Please\
    \ note that the recommendations for mount options on the `/usr` and `/home` partitions\
    \ should only be applied to systems where Server or Custom type was chosen during\
    \ installation (see [Section 2.1.1](#LiB0012_split_001.html_21)). This is because\
    \ if Workstation or Laptop was selected, the `/usr` and `/home` directories will\
    \ be part of the root partition (`/`), and the root partition must not be read-only,\
    \ `nodev`, or `nosuid`.\n\nMount the `/usr` partition as read-only. Most of the\
    \ executable commands on the system are located in the `/usr` filesystem. Mounting\
    \ it as read-only is a good way to protect against Trojaned binaries being installed.\n\
    \n```\n LABEL=/usr              /usr         ext3 ro            1 2\n```\n\n|\
    \  | Note  | The `/usr` file system will have to be remounted read-write before\
    \ applying most `rpm` upgrades (including any scheduled to be applied by update\
    \ agents like `up2date` or `autorpm`) with the following command: |\n\n```\n [root@localhost]#\
    \ mount -o remount,rw /usr\n```\n\nOnce the installation is complete, the partition\
    \ can be mounted read-only again with the following command:\n\n```\n [root@localhost]#\
    \ mount -o remount,ro /usr\n```\n\nTo prevent SUID or device files from being\
    \ introduced to the system by removable media, add the `nosuid` and `nodev` options\
    \ to the lines for all removable media (e.g. floppy, cdrom)\n\n```\n /dev/fd0\
    \      /mnt/floppy      ext3 nosuid,nodev    1 2\n    /dev/cdrom    /mnt/cdrom\
    \       ext3 nosuid,nodev    1 2\n```\n\nLastly, the file system containing user\
    \ home directories should also have the `nosuid` and `nodev` options set\n\n```\n\
    \ LABEL=/home         /home      ext3 nosuid,nodev    1 2\n```\n\n### 2.7.2 Tighten\
    \ Permissions on Files\n\n#### 2.7.2.1 Restrict Access to Administrative Utilities\n\
    \nAdministrative utilities (e.g. `chkconfig`, `traceroute`, `ifconfig`, and `iptables`)\
    \ reside in the `/sbin` and `/usr/sbin` directories. Under normal circumstances,\
    \ unprivileged users should not need to execute any of these commands. Issue the\
    \ following command to remove read, write and execute privileges for users that\
    \ do not own the files (and do not belong to the groups that own them) from all\
    \ files in these directories.\n\n```\n [root@localhost]# /bin/chmod -R o-rwx /usr/sbin\
    \ 'ls /sbin/* | grep -v consoletype'\n```\n\nThe `consoletype` utility is left\
    \ out of the tightened file permissions because the files `/etc/profile.d/lang.sh`\
    \ and `/etc/profile.d/lang.csh` call it, with the privileges of a normal user,\
    \ to determine the type of console the user is logged into when starting a new\
    \ shell.\n\n### 2.7.3 SUID Permissions for Executable Programs\n\nOther utilities\
    \ that normal users can run reside in the `/bin` and `/usr/bin` directories. Some\
    \ of these require SUID in order to work, for example, the `passwd` command needs\
    \ to be able to write the updated password hash to the `/etc/shadow` file to which\
    \ the user does not have read or write permission. However, on most files, the\
    \ SUID and SGID permissions are an optional convenience, for example the `ping`\
    \ command. To see a list of all the files with SUID or SGID permission use the\
    \ following command:\n\n```\n [root@localhost]# /usr/bin/find /bin /usr/bin -type\
    \ f \\( -perm -04000 -o -perm -02000 \\) -ls\n```\n\nReview the resulting list\
    \ and remove the SUID or SGID permissions from files that do not require it by\
    \ setting the permission on each of these files to `755`. For example\n\n```\n\
    \ [root@localhost]# /bin/chmod 755 /bin/mount /bin/umount /bin/ping /usr/bin/chfn\
    \ /usr/bin/chsh /usr/\n    bin/chage\n```\n\n### 2.7.4 Remove Compiler Packages\
    \ (Servers and Workstations Not Used for Software Development)\n\nMany exploits\
    \ used by crackers are distributed as program source code and must be compiled\
    \ on the target system before they can be used. If the compiler packages are removed\
    \ from the system, then the cracker will have to upload a compiler along with\
    \ the exploit source code before attempting to exploit the system. In addition\
    \ to thwarting \"script-kiddies\", the increased activity required to install\
    \ a compiler should facilitate detection of the unauthorized intrusion.\n\nIssue\
    \ the following command to remove:\n\n```\n [root@localhost]# /bin/rpm --e cpp\
    \ gcc gcc-c++ gcc-g77\n```\n\n## 2.8 LOGGING\n\nThis section covers how to configure\
    \ Red Hat 7.3 to increase the security of logging. Steps in this section include\
    \ configuration of what messages will be logged, where the messages will be sent,\
    \ and how often the log files will be rotated. Additional related steps will be\
    \ synchronization of the system clock.\n\n### 2.8.1 syslogd\n\nMessages from daemon\
    \ processes running on a Linux system are sent to the `syslogd` daemon. Each message\
    \ has two properties, facility and level, that respectively describe what sent\
    \ the message and how important the message is. How the logging daemon handles\
    \ each message is determined by the `/etc/syslog.conf` file. Choices for handling\
    \ messages include sending the message to a local file, to the console or a local\
    \ TTY, to one or more logged in users, or to a remote log server.\n\nNote that\
    \ sending a copy of log messages to a remote log server helps to preserve a record\
    \ of an intruder's activity when a system is compromised. While an intruder commonly\
    \ erases or modifies local system logs to cover their tracks, they do not have\
    \ the ability to do so on a remote log server unless they can break into that\
    \ system as well.\n\n#### 2.8.1.1 Replace the Default Configuration File for the\
    \ syslog Daemon (/etc/syslog.conf) with a More Secure Configuration File\n\nThe\
    \ `syslog.conf` in [Appendix B](#LiB0035.html_195) ensures that important messages\
    \ are recorded. The configuration also causes messages stored to the local system\
    \ to be segregated into subsystem specific log files. This makes each log file\
    \ more readable and increases the chances that anomalies will be noticed when\
    \ reviewing a log file.\n\n#### 2.8.1.2 Restart the syslogd and Ensure That It\
    \ Is Configured to Run on Boot\n\nForce the `syslogd` daemon to reload its configuration\
    \ file:\n\n```\n [root@localhost]# /etc/init.d/syslogd restart\n```\n\nMake sure\
    \ the `syslogd` is configured to start automatically on boot:\n\n```\n [root@localhost]#\
    \ /sbin/chkconfig --level 2345 syslog on\n```\n\n#### 2.8.1.3 [Optional] Verify\
    \ the New Configuration\n\nThe `logger` utility installed with the `util-linux`\
    \ package can be used to send a log message to an arbitrary facility and level.\
    \ Use this feature to verify the configuration. For example, the command\n\n```\n\
    \ [root@localhost]# /usr/bin/logger -p mail.info \"Test mail log message\"\n```\n\
    \nshould result in a line similar to the following being added to the `/var/log/maillog`\n\
    \n```\n Aug 10 10:22:14 root: Test mail log message\n```\n\nBe aware that the\
    \ implementation of `logger` does not enable sending messages to the `kern` facility.\n\
    \n### 2.8.2 logrotate.d\n\nThe `/etc/logrotate.conf` file contains the default\
    \ options for rotation log files. These options may be overridden for a specific\
    \ log file by modifying the files in the `/etc/logrotate.d` directory.\n"
