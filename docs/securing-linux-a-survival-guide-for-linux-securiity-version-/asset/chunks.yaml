    - Incremental Mode – Uses all combinations of characters. This is sometimes known
    as brute force mode.


    John the Ripper can be obtained at [http://www.openwall.com/john/](http://www.openwall.com/john/).


    ## 4.5 CRACK


    Crack is another freeware password auditing utility. Similar to John the Ripper,
    in order to use `crack` you need to combine your `passwd` and `shadow` files.
    By default `crack` uses wordlists. For a brute force scan of a password file you
    would use `crack7`, which is included with the install of `crack`. Crack can be
    obtained at [http://packetstorm.decepticons.org/Crackers/crack/](http://packetstorm.decepticons.org/Crackers/crack/).


    ## 4.6 BASTILLE


    Bastille is a Linux hardening application that provides novice and experienced
    users a way to automate many of the security settings that have been covered in
    this guide. Bastille provides both a command line and GUI format for users. Bastille
    walks the user through an interactive questionnaire to determine which setting
    should be turned on and what the ramifications are for making those changes. Bastille
    can be obtained at [http://www.bastille-linux.org/](http://www.bastille-linux.org/).


    ## 4.7 NMAP


    NMAP or Network Mapper is an excellent freeware reconnaissance utility. NMAP is
    typically used as a port mapper utility, sending packets to hosts with various
    settings to determine which ports are open on a device. NMAP can also be used
    as an Operating System reconnaissance tool since NMAP has the ability to send
    packets to a host and, based on the response to those packets, determine which
    Operating System the host is running. NMAP can be obtained at [http://www.nmap.org](http://www.nmap.org).


    ## 4.8 NESSUS


    Nessus is a freeware vulnerability assessment tool. Nessus works on a client/server
    based technology. The server side contains the vulnerability database and the
    engine that actually performs the vulnerability assessment. The client connects
    to the server to configure the settings for the vulnerability assessment. Nessus
    can provide reports in a number of different formats including its native GUI
    format, HTML, and ASCII. Nessus can be obtained at [http://www.nessus.org](http://www.nessus.org).


    ## 4.9 PSIONIC PORTSENTRY


    Psionic PortSentry, a freeware tool that is part of a suite of tools called the
    TriSentry Suite, is designed to detect and respond to portscans against a host
    machine. PortSentry has the ability to detect port scans coming into a system
    and then to dynamically block access to the scanning systems using kernel routing
    tables, kernel firewalling, tcp wrappers, or a custom command of your choosing.
    LogSentry, another freeware log monitoring tool, can monitor your logs for configurable
    activities and send alerts based on that configuration. Both LogSentry and PortSentry
    can be obtained at [http://www.psionic.com](http://www.psionic.com).


