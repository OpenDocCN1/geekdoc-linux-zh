  trans: "\n\n```\n [root@localhost]# autorpm auto\n```\n\n你应该能看到显示尝试到镜像站点进行 FTP 连接的消息信息，并且很可能还会列出可用更新的包名列表。已更新的包（系统中已安装了较早版本的包）将被下载，并检查它们的\
    \ PGP 签名。当提示符返回时，执行以下命令来安装这些包：\n\n```\n [root@localhost]# autorpm \"install all\"\
    \n```\n\n你应该能看到指示 `rpm` 包正在安装的信息，如果安装成功，还会显示这些包正在从磁盘中删除。\n\n默认情况下，会在 `/etc/cron.daily`\
    \ 目录下添加一个条目，以启用每日检查更新。\n\n## 2.7 文件系统安全\n\n### 2.7.1 安全文件系统挂载选项\n\n本节概述了通过对 `/etc/fstab`\
    \ 文件进行编辑来增强系统安全性。请注意，针对 `/usr` 和 `/home` 分区的挂载选项建议仅适用于在安装过程中选择了“服务器”（Server）”或“自定义”（Custom）类型的系统（参见第\
    \ 2.1.1 节）。这是因为如果选择了“工作站”（Workstation）或“笔记本电脑”（Laptop），`/usr` 和 `/home` 目录将成为根分区（`/`）的一部分，而根分区不能设置为只读、`nodev`\
    \ 或 `nosuid`。\n\n将 `/usr` 分区挂载为只读。系统中的大多数可执行命令都位于 `/usr` 文件系统中。将其挂载为只读是防止安装被木马化的二进制文件的一种良好方法。\n\
    \n```\n LABEL=/usr              /usr         ext3 ro            1 2\n```\n\n|\
    \  | 注意事项 | 在应用大多数 `rpm` 升级（包括任何计划由 `up2date` 或 `autorpm` 等更新代理执行的升级）之前，必须使用以下命令将\
    \ `/usr` 文件系统重新挂载为读写模式： |\n\n```\n [root@localhost]# mount -o remount,rw /usr\n\
    ```\n\n安装完成后，可以使用以下命令将分区重新挂载为只读：\n\n```\n [root@localhost]# mount -o remount,ro\
    \ /usr\n```\n\n为了防止通过可移动介质向系统引入 SUID 或设备文件，请为所有可移动介质（如软盘、CD-ROM）的行添加 `nosuid`\
    \ 和 `nodev` 选项：\n\n```\n /dev/fd0      /mnt/floppy      ext3 nosuid,nodev    1\
    \ 2\n    /dev/cdrom    /mnt/cdrom       ext3 nosuid,nodev    1 2\n```\n\n最后，包含用户家目录的文件系统也应该设置\
    \ `nosuid` 和 `nodev` 选项：\n\n```\n LABEL=/home         /home      ext3 nosuid,nodev\
    \    1 2\n```\n\n### 2.7.2 收紧文件权限\n\n#### 2.7.2.1 限制对管理工具的访问\n\n管理工具（例如 `chkconfig`、`traceroute`、`ifconfig`\
    \ 和 `iptables`）位于 `/sbin` 和 `/usr/sbin` 目录。在正常情况下，特权用户通常不需要执行这些命令中的任何一个。执行以下命令，移除这些目录下所有文件中非文件所有者（且不属于文件所有者组）的用户的读、写、执行权限。\n\
    \n```\n [root@localhost]# /bin/chmod -R o-rwx /usr/sbin 'ls /sbin/* | grep -v\
    \ consoletype'\n```\n\n`consoletype` 工具未排除在收紧的文件权限之外，因为 `/etc/profile.d/lang.sh`\
    \ 和 `/etc/profile.d/lang.csh` 文件会以普通用户权限调用它，在启动新 shell 时确定用户登录的控制台类型。\n\n### 2.7.3\
    \ 可执行程序的 SUID 权限\n\n普通用户可以运行的其他工具位于 `/bin` 和 `/usr/bin` 目录。其中某些工具需要 SUID 才能工作，例如，`passwd`\
    \ 命令需要能够将更新后的密码哈希写入 `/etc/shadow` 文件，而用户对该文件没有读取或写入权限。然而，对于大多数文件，SUID 和 SGID 权限是一种可选的便利设置，例如\
    \ `ping` 命令。使用以下命令查看所有具有 SUID 或 SGID 权限的文件列表：\n\n```\n [root@localhost]# /usr/bin/find\
    \ /bin /usr/bin -type f \\( -perm -04000 -o -perm -02000 \\) -ls\n```\n\n检查结果列表，通过将这些每个文件的权限设置为\
    \ `755`，移除不需要这些权限文件的 SUID 或 SGID 权限。例如：\n\n```\n [root@localhost]# /bin/chmod\
    \ 755 /bin/mount /bin/umount /bin/ping /usr/bin/chfn /usr/bin/chsh /usr/\n   \
    \ bin/chage\n```\n\n### 2.7.4 移除编译器包（不用于软件开发的服务器和工作站）\n\n黑客使用的许多漏洞以程序源代码的形式分发，在使用之前必须在目标系统上进行编译。如果从系统中移除编译器包，那么黑客在尝试利用系统之前，必须同漏洞源码一起上传一个编译器。除了阻止“脚本小子”（script-kiddies）之外，安装编译器所需的额外活动有助于检测未经授权的入侵。\n\
    \n执行以下命令移除编译器：\n\n```\n [root@localhost]# rpm -e gcc\n```\n\n## 2.8 日志记录\n\n本节涵盖了如何配置红帽\
    \ Linux 以提高日志安全性。这些步骤包括配置哪些消息被记录、发送到哪里以及何时轮转日志。相关的步骤还包括系统时钟的同步。\n\n### 2.8.1 syslogd\n\
    \n运行在 Linux 系统上的进程消息发送到 `syslogd` 进程。每条消息有两个属性，分别描述来源和重要性。日志进程如何处理每条消息由 `/etc/syslog.conf`\
    \ 文件决定。处理选择包括发送到本地文件、控制台或本地终端、一个或多个登录用户或远程日志服务器。\n\n注意，将日志副本发送到远程服务器可以在系统被入侵时保留记录。入侵者通常会擦除或修改本地系统日志来掩盖踪迹，除非他们也能进入远程服务器。\n\
    \n#### 2.8.1.1 使用更安全的配置文件替换 syslog 守护进程默认配置 (/etc/syslog.conf)\n\nAppendix B 确保重要消息被记录。该配置还将存储到本地系统的日志分离到特定的子系统文件中。这使得每个日志文件更易读，并增加了在查看日志文件时发现异常的机会。\n\
    \n#### 2.8.1.2 重启 syslogd 并确保其在启动时运行\n\n强制 `syslogd` 进程重新加载配置文件：\n\n```\n [root@localhost]#\
    \ /etc/init.d/syslogd restart\n```\n\n确保 `syslogd` 配置为启动自动启动：\n\n```\n [root@localhost]#\
    \ /sbin/chkconfig --level 2345 syslog on\n```\n\n#### 2.8.1.3 [可选] 验证新配置\n\n使用\
    \ `util-linux` 软件包安装的 `logger` 工具可以向任意设施和级别发送日志消息。使用此功能验证配置。例如，命令\n\n```\n [root@localhost]#\
    \ /usr/bin/logger -p mail.info \"Test mail log message\"\n```\n\n会导致 `/var/log/maillog`\
    \ 中添加类似下面的行：\n\n```\n Aug 10 10:22:14 root: Test mail log message\n```\n\n请注意，`logger`\
    \ 的实现未向 `kern` 设施发送消息。\n\n### 2.8.2 logrotate.d\n\n`/etc/logrotate.conf` 文件包含日志轮的默认选项。可以通过修改\
    \ `/etc/logrotate.d` 目录下的文件为特定的日志文件覆盖这些选项。\n\n"
- fmt: "\n### 2.8.2.1 Edit the Default Configuration File for the logrotate Daemon\
    \ (/etc/logrotate.conf) to Keep Log Information Longer\n\nAs installed, logs will\
    \ be rotated weekly and saved for only four weeks. Edit the file `/etc/logrotate.conf`\
    \ as shown in the table below so that important information about system events\
    \ will be preserved longer. This will increase the likelihood that problems or\
    \ suspected intrusions will be detected. Note that even though old logs will be\
    \ compressed, a year's worth of log data may still be large. Be sure to monitor\
    \ the available disk space for the partition where logs are being stored (typically\
    \ `/var`).\n\nTable 2-3: Default Configuration File for logrotate Daemon Settings\n\
    \n| Default setting | Secure setting | Reason |\n| --- | --- | --- |\n| `weekly`\
    \ | `monthly` | `These changes result in saving logs for a year instead of a month,\
    \ providing longer accountability.` |\n| `rotate 4` | `rotate 12` | |\n| `#compress`\
    \ | `compress` | `To conserve space, compress old logs` |\n\n#### 2.8.2.2 Update\
    \ the Configuration File That Controls Rotation syslogd Files (/etc/logrotate.d/syslog)\n\
    \nThe `syslog.conf` file installed in Step 2.8.1.1 will result in the creation\
    \ of the additional log file `/var/log/kernel` for all systems. Furthermore, if\
    \ any of the lines in that file specific to servers are uncommented, other log\
    \ files will also be created. The name of all new log files must be added to the\
    \ list of files at the beginning of `/etc/logrotate.d/syslog` so the new logs\
    \ will also be rotated.\n\n#### 2.8.2.3 [Optional] Verify That Log Rotation Is\
    \ Configured Properly\n\nUse the `-f` flag with the `logrotate` command to force\
    \ the log files to be rotated. New log files should be created and no errors should\
    \ occur.\n\n```\n[root@localhost]# /usr/sbin/logrotate -f /etc/logrotate.conf\n\
    ```\n\n### 2.8.3 logwatch (http://www.logwatch.org)\n\nThe best logging configuration\
    \ is rendered useless if the information in the logs is never reviewed. The `logwatch`\
    \ application will automatically parse log files, attempt to remove entries that\
    \ report normal activity, and send an alert email containing the unexpected entries.\
    \ Edit the line in the file `/etc/log.d/logwatch.conf` line beginning with `MailTo`\
    \ and change the user `root` to the email address of the person in charge of monitoring\
    \ logs.\n\n### 2.8.4 ntpd ([http://www.cis.udel.edu/~ntp](http://www.cis.udel.edu/~ntp))\n\
    \nConfigure the Network Time Protocol (ntp) server daemon to synchronize the system\
    \ clock with three public NTP servers. This will enable a system administrator\
    \ to reliably coordinate events from log files on this system with events from\
    \ log files of other systems on the Internet.\n\n#### 2.8.4.1 Locate Three Public\
    \ NTP Servers and Add Them to /etc/ntp.conf\n\nVisit [http://www.eecis.udel.edu/~mills/ntp/servers.html](http://www.eecis.udel.edu/~mills/ntp/servers.html),\
    \ select three public servers geographically nearby, note their IP addresses and\
    \ obtain permission from their administrators. Edit the `/etc/ntp.conf` file and\
    \ replace the line that begins \"server 127.127…\" with one line for each public\
    \ server:\n\n```\nserver 10.0.0.1    # IP address of public server 1\nserver 10.0.0.2\
    \    # IP address of public server 2\nserver 10.0.0.3    # IP address of public\
    \ server 3\n```\n\n#### 2.8.4.2 Restart the NTP Daemon and Ensure That It Is Configured\
    \ to Run on Boot\n\nForce the `ntpd` daemon to reload its configuration file:\n\
    \n```\n[root@localhost]# /etc/init.d/ntpd restart\n```\n\nMake sure the `ntpd`\
    \ is configured to start automatically on boot:\n\n```\n[root@localhost]# /sbin/chkconfig\
    \ ---level 2345 ntpd on\n```\n\n## 2.9 SCHEDULER SECURITY\n\n### 2.9.1 Restricting\
    \ `cron` and `at` Access\n\nIn the Linux world, `cron` and `at` are the applications\
    \ of choice for scheduling. `cron` is utilized when you need to have a particular\
    \ job run on a regular basis at the same time interval each time. `at` is utilized\
    \ when you want to schedule something to run once at a particular time. By default,\
    \ access to `cron` and `at` are unrestricted. This means that all users have access\
    \ to modify, add or delete jobs. `cron` stores these scheduled jobs in user-specific\
    \ files called `crontabs`. `cron` periodically queries these crontab files for\
    \ jobs to run. Jobs are run with the permissions of the user that scheduled the\
    \ job. Some guidelines to consider when securing `cron` are:\n\n* **Log all `cron`\
    \ jobs** – Red Hat is configured by default to send `cron` messages via the `syslog`\
    \ function to `/var/cron/log` \n* **Restrict access to `cron` and `at`** – Only\
    \ allow those users who have a need to run scheduled jobs access to `cron`. `cron`\
    \ regulates access through the `/etc/cron.allow` file. `at` regulates access through\
    \ the `/etc/at.allow` file. `cron.allow` and `at.allow` specify which users are\
    \ explicitly permitted to schedule `cron` or `at` jobs, all other users will be\
    \ denied access. If a `cron.allow` or `at.allow` exists, only the users listed\
    \ are permitted. If neither file exists, all users are permitted. If a `cron.deny`\
    \ or `at.deny` exists, the users listed are denied.\n"
  raw: "#### 2.8.2.1 Edit the Default Configuration File for the logrotate Daemon\
    \ (/etc/logrotate.conf) to Keep Log Information Longer\n\nAs installed, logs will\
    \ be rotated weekly and saved for only four weeks. Edit the file /etc/logrotate.conf\
    \ as shown in the table below so that important information about system events\
    \ will be preserved longer. This will increase the likelihood that problems or\
    \ suspected intrusions will be detected. Note that even though old logs will be\
    \ compressed, a year's worth of log data may still be large. Be sure to monitor\
    \ the available disk space for the partition where logs are being stored (typically\
    \ /var).\n\nTable 2-3: Default Configuration File for logrotate Daemon Settings\n\
    \n| Default setting | Secure setting | Reason |\n\n| --- | --- | --- |\n\n| `weekly`\
    \ | `monthly` | `These changes result in saving logs for a year instead of a month,\
    \ providing longer accountability.` |\n\n| `rotate 4` | `rotate 12` |\n\n| `#compress`\
    \ | `compress` | `To conserve space, compress old logs` |\n\n#### 2.8.2.2 Update\
    \ the Configuration File That Controls Rotation syslogd Files (/etc/logrotate.d/syslog)\n\
    \nThe syslog.conf file installed in Step 2.8.1.1 will result in the creation of\
    \ the additional log file /var/log/kernel for all systems. Furthermore, if any\
    \ of the lines in that file specific to servers are uncommented, other log files\
    \ will also be created. The name of all new log files must be added to the list\
    \ of files at the beginning of /etc/logrotate.d/syslog so the new logs will also\
    \ be rotated.\n\n#### 2.8.2.3 [Optional] Verify That Log Rotation Is Configured\
    \ Properly\n\nUse the ‘-f’ flag with the logrotate command to force the log files\
    \ to be rotated. New log files should be created and no errors should occur.\n\
    \n```\n [root@localhost]# /usr/sbin/logrotate -f /etc/logrotate.conf\n```\n\n\
    ### 2.8.3 logwatch (http://www.logwatch.org)\n\nThe best logging configuration\
    \ is rendered useless if the information in the logs is never reviewed. The logwatch\
    \ application will automatically parse log files, attempt to remove entries that\
    \ report normal activity, and send an alert email containing the unexpected entries.\
    \ Edit the line in the file /etc/log.d/logwatch.conf line beginning with *MailTo*\
    \ and change the user root to the email address of the person in charge of monitoring\
    \ logs.\n\n### 2.8.4 ntpd ([http://www.cis.udel.edu/~ntp](http://www.cis.udel.edu/~ntp))\n\
    \nConfigure the Network Time Protocol (ntp) server daemon to synchronize the system\
    \ clock with three public NTP servers. This will enable a system administrator\
    \ to reliably coordinate events from log files on this system with events from\
    \ log files of other systems on the Internet.\n\n#### 2.8.4.1 Locate Three Public\
    \ NTP Servers and Add Them to /etc/ntp.conf\n\nVisit [http://www.eecis.udel.edu/~mills/ntp/servers.html](http://www.eecis.udel.edu/~mills/ntp/servers.html),\
    \ select three public servers geographically nearby, note their IP addresses and\
    \ obtain permission from their administrators. Edit the /etc/ntp.conf file and\
    \ replace the line that begins \"server 127.127…\" with one line for each public\
    \ server:\n\n```\n server 10.0.0.1    # IP address of public server 1\n    server\
    \ 10.0.0.2    # IP address of public server 2\n    server 10.0.0.3    # IP address\
    \ of public server 3\n```\n\n#### 2.8.4.2 Restart the NTP Daemon and Ensure That\
    \ It Is Configured to Run on Boot\n\nForce the ntpd daemon to reload its configuration\
    \ file:\n\n```\n [root@localhost]# /etc/init.d/ntpd restart\n```\n\nMake sure\
    \ the ntpd is configured to start automatically on boot:\n\n```\n [root@localhost]#\
    \ /sbin/chkconfig ---level 2345 ntpd on\n```\n\n## 2.9 SCHEDULER SECURITY\n\n\
    ### 2.9.1 Restricting *cron* and *at* Access\n\nIn the Linux world, *cron* and\
    \ *at* are the applications of choice for scheduling. *Cron* is utilized when\
    \ you need to have a particular job run on a regular basis at the same time interval\
    \ each time. *At* is utilized when you want to schedule something to run once\
    \ at a particular time. By default, access to *cron* and *at* are unrestricted.\
    \ This means that all users have access to modify, add or delete jobs. *Cron*\
    \ stores these scheduled jobs in user-specific files called crontabs. *Cron* periodically\
    \ queries these crontab files for jobs to run. Jobs are run with the permissions\
    \ of the user that scheduled the job. Some guidelines to consider when securing\
    \ *cron* are:\n\n*   **Log all** ***Cron*** **jobs** – Red Hat is configured by\
    \ default to send *cron* messages via the syslog function to /var/cron/log\n\n\
    *   **Restrict access to** ***Cron*** **and** ***at*** **–** Only allow those\
    \ users who have a need to run scheduled jobs access to *cron*. *Cron* regulates\
    \ access through the /etc/cron.allow file. *At* regulates access through the /etc/at.allow\
    \ file. Cron.allow and at.allow specify which users are explicitly permitted to\
    \ schedule *cron* or *at* jobs, all other users will be denied access. If a cron.allow\
    \ or at.allow file does not exist, *cron* and *at* will look for a cron.deny or\
    \ at.deny file respectively. It is not necessary to use the cron.deny or at.deny\
    \ file so do not create one. If neither of these files exist, *cron* will allow\
    \ all users access to *cron*.\n\n    |  | Note  | Root will always have access\
    \ to schedule jobs regardless of the contents of the cron.allow file. To create\
    \ the cron.allow file: \n\n    ```\n     $su\n    # echo root > /etc/cron.allow\n\
    \    ```\n\n     |\n\n*   **Ensure that programs executed by cron have the appropriate\
    \ permissions –** Most system administrators love scripts. Scripts are excellent\
    \ tools for automating many repetitive tasks that system administrators perform.\
    \ By scheduling these scripts through cron, an administrator can perform a weekly\
    \ or daily function automatically and gain valuable time. Some scripts require\
    \ root permissions to run properly, so many times an administrator will run the\
    \ script from root's crontab. This can create a security problem. Administrators\
    \ usually create their scripts from their own accounts and those scripts are usually\
    \ located in their home directories. This means that the permissions on the script\
    \ are those of the administrator. If an attacker were to gain access to the administrators'\
    \ own account, he would have access to modify the script. Since the script runs\
    \ with root permissions, the attacker's commands would run as root. In order to\
    \ prevent this, ensure that the user whose crontab is running the script or program\
    \ also owns that script program.\n\n# 3.0 Chapter 3: Securing Additional Services\n\
    \n## 3.1 WEB SECURITY\n\nThe web server installed with Red Hat 7.3 is apache ([http://httpd.apache.org](http://httpd.apache.org)).\
    \ The rpm packages distributed with the installation disk are vulnerable to multiple\
    \ security issues (see [http://rhn.redhat.com/errata/RHSA-2002-222.html](http://rhn.redhat.com/errata/RHSA-2002-222.html)).\
    \ Be sure the latest updated packages (i.e., apache-1.3.27-2 as of 20-Dec-02)\
    \ have been installed before proceeding.\n\n### 3.1.1 Ensure Only Necessary Modules\
    \ Are Installed\n\nThe httpd executable is compiled with Dynamic Shared Object\
    \ (DSO) support to provide extensibility for plugging in many additional modules\
    \ (e.g. SSL, PERL, DAV, etc.). Some of these modules are included with the base\
    \ rpm package, but most of them are stand-alone packages having names beginning\
    \ with the string \"mod_\" (e.g. mod_ssl, mod_perl, mod_dav). If the functionality\
    \ provided by a module is not required, the module should be removed. A good candidate\
    \ for removal is the Distributed Authoring and Version (DAV) module which enables\
    \ modifications to files on the web server using the client's browser. Use the\
    \ rpm command below to remove the DAV module package:\n\n```\n [root@localhost]#\
    \ /bin/rpm -e mod_dav\n```\n\n### 3.1.2 Harden the Main Configuration File (/etc/httpd/conf/httpd.conf)\n\
    \n#### 3.1.2.1 Comment Out Unused Modules"
