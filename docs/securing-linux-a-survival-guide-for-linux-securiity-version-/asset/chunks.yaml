    \  20      IN PTR www.\n   50      IN PTR ns.\n\n/usr/local/bind/named/master/reverse.2.4.6\n\
    \    $TTL  1D\n    $ORIGIN 6.4.2.in-addr.arpa\n    @ 1D IN SOA localhost. root.localhost.\
    \ (\n           42   ; serial\n           3H   ; refresh\n           15M  ; retry\n\
    \           1W   ; expiry\n           1D ) ; minimum\n    1D     IN NS ns.\n \
    \  5       IN PTR ns.\n   20      IN PTR www.\n\n/etc/init.d/named\n   #!/bin/sh\n\
    \   # named This file will start and stop the BIND named daemon\n   #\n   # chkconfig:\
    \ 2345 99 99\n   # description: named is the daemon responsible for mapping IP\
    \ addresses \\\n   # to names and vice versa in response to queries from other\
    \ hosts.\n   # processname: /usr/local/bind/sbin/named\n   # config: /usr/local/bind/etc/named.conf\n\
    \n   # Source function library\n   . /etc/rc.d/init.d/functions\n\n   # Source\
    \ networking functionality and ensure that the network has been started\n   if\
    \ [ -f /etc/sysconfig/network ]; then\n    . /etc/sysconfig/network\n    [ ${NETWORKING}\
    \ = \"no\" ] && exit 0\n   fi\n\n   [ -x /usr/local/bind/sbin/named ] || exit\
    \ 0\n\n   RETVAL=0\n   prog=\"named\"\n\n   # Set variables for the chroot\n \
    \  CHROOT_USER=dns\n   CHROOT_DIR=/usr/local/bind\n   CHROOT_CONFIG=/etc/named.conf\n\
    \n   start() {\n    echo -n $\"Starting $prog: \"\n    daemon /usr/local/bind/sbin/named\
    \ -u $CHROOT_USER -t $CHROOT_DIR -c $CHROOT_CONFIG\n    RETVAL=$?\n    echo\n\
    \    touch /var/lock/subsys/named\n    return $RETVAL\n   }\n\n   stop() {\n \
    \   echo -n $\"Stopping $prog: \"\n    killproc /usr/local/bind/sbin/named\n \
    \   RETVAL=$?\n    echo\n    rm -f /var/lock/subsys/named\n    return $RETVAL\n\
    \   }\n\n   restart() {\n    stop\n    start\n   }\n\n   reload() {\n    /usr/local/bind/sbin/ndc\
    \ reload\n   }\n\n   condrestart() {\n    [ -e /var/lock/subsys/named ] && restart\n\
    \    return 0\n   }\n\n   case \"$1\" in\n    start)\n     start\n     ;;\n  \
    \  stop)\n     stop\n     ;;\n    restart)\n     restart\n     ;;\n    reload)\n\
    \     reload\n     ;;\n    condrestart)\n     condrestart\n     ;;\n    status)\n\
    \     status named\n     RETVAL=$?\n     ;;\n    *)\n     echo $\"Usage: $0 {start|stop|status|restart|condrestart|reload}\"\
    \n     RETVAL=1\n     ;;\n  esac\n\n  exit $RETVAL\n```\n\n# 4.0 Chapter 4: Additional\
    \ Utilities\n\n## 4.1 SWATCH\n\nSwatch (The Simple WATCHer) is a popular open\
    \ source log monitoring and alerting utility written by Todd Atkins. Swatch is\
    \ designed to monitor your log files against a set of configurable triggers. When\
    \ Swatch detects a triggered event, it can alert the system administrator via\
    \ the console, an audible beep, or an e-mail. In addition to real-time monitoring\
    \ of log files, Swatch can also be used to filter old log files for suspected\
    \ activity. Swatch can be obtained at [http://www.oit.ucsb.edu/~eta/swatch/](http://www.oit.ucsb.edu/~eta/swatch/)\n\
    \n## 4.2 TRIPWIRE\n\nTripwire is a file integrity application that is available\
    \ both commercially and as an open-source product for Linux. Tripwire works by\
    \ creating a hash for all files that you have chosen to monitor on your system.\
    \ These hashes are then stored in a database. Once the database is created you\
    \ can schedule tripwire to run on a regular basis to compare the hashes of the\
    \ files you were monitoring to the hashes stored in the database. The main advantages\
    \ to the commercial version are vendor support and the availability of a centralized\
    \ management console. The commercial version of tripwire can be obtained at [http://www.tripwire.com](http://www.tripwire.com).\
    \ The open source version of tripwire can be obtained at [http://www.tripwire.org](http://www.tripwire.org).\n\
    \n## 4.3 INTRUSION DETECTION SYSTEMS\n\nIntrusion Detection Systems (IDS) are\
    \ a hot topic in security circles today. These security devices are designed to\
    \ monitor networks for suspected malicious activity. Once this activity is detected,\
    \ the device sends an alert to an administrator and in some cases can even respond\
    \ to the event based on pre-configured options. With major players like Cisco,\
    \ ISS and Symantec providing IDS solutions, the cost for a commercial Intrusion\
    \ Detection System can be considerable. This cost factor has influenced many small\
    \ companies and some larger companies to implement an open source IDS solution\
    \ known as SNORT. SNORT is a lightweight intrusion detection system that provides\
    \ many of the same features as commercial IDSs. The security community has also\
    \ developed many open source add-ons, such as management consoles and reporting\
    \ tools, for SNORT. Because of this, SNORT can perform just as well as any commercial\
    \ system while providing considerable cost savings. Some IDS solutions that run\
    \ on the Linux platform include:\n\n*   ISS Realsecure – [http://www.iss.net](http://www.iss.net)\n\
    \n*   Enterasys Dragon – [http://www.enterasys.com](http://www.enterasys.com)\n\
    \n*   SNORT – [http://www.snort.org](http://www.snort.org)\n\n## 4.4 JOHN THE\
    \ RIPPER\n\nJohn the Ripper is a freeware password auditing utility or, as some\
    \ like to call it, a password cracking utility. John the Ripper attempts to brute\
    \ force guess the passwords in the passwd and shadow files, making use of dictionaries\
    \ and its knowledge of common password creation techniques. John the Ripper has\
    \ three modes in which it will run:\n\n*   Single Crack Mode – Uses the login\
    \ and GECOS (Full Name, home directory, etc) information from the passwd file\
    \ as its password word list.\n\n*   Wordlist Mode – Uses a populated wordlist\
    \ or dictionary list."
