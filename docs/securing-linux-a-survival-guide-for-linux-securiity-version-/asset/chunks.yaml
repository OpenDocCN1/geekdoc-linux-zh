    - 增量模式 – 使用所有字符组合。这有时被称为暴力破解模式。


    可以在 [`www.openwall.com/john/`](http://www.openwall.com/john/) 获得 John the Ripper。


    ## 4.5 CRACK


    Crack 是另一种一种免费的密码审计工具。与 John the Ripper 类似，为了使用 `crack`，你需要合并你的 `passwd` 和 `shadow`
    文件。默认情况下，`crack` 使用字典。若要对密码文件进行暴力破解扫描，你会使用 `crack7`，它包含在 `crack` 的安装包中。可以在 [`packetstorm.decepticons.org/Crackers/crack/`](http://packetstorm.decepticons.org/Crackers/crack/)
    获得 Crack。


    ## 4.6 BASTILLE


    Bastille 是一款 Linux 加固应用，为新手和有经验的用户提供了一种自动化本指南中涵盖的许多安全设置的方法。Bastille 为用户提供了命令行和图形界面（GUI）两种格式。Bastille
    通过交互式问卷引导用户确定应该开启哪些设置，以及做出这些更改的影响。可以在 [`www.bastille-linux.org/`](http://www.bastille-linux.org/)
    获得 Bastille。


    ## 4.7 NMAP


    NMAP 或 Network Mapper 是一款极优秀的免费侦察工具。NMAP 通常用作端口映射工具，向带有各种设置的主机发送数据包以确定设备上的哪些端口是打开的。NMAP
    也可以作为操作系统探测工具，因为 NMAP 具有向主机发送数据包并根据对数据包的响应判断主机运行何种操作系统的能力。可以在 [`www.nmap.org`](http://www.nmap.org)
    获得 NMAP。


    ## 4.8 NESSUS


    Nessus 是一款免费的漏洞扫描工具。Nessus 基于客户端/服务器技术工作。服务端包含漏洞数据库和实际执行漏洞扫描的引擎。客户端连接到服务器配置漏洞扫描的设置。Nessus
    可以提供多种格式的报告，包括其原生 GUI 格式、HTML 和 ASCII。可以在 [`www.nessus.org`](http://www.nessus.org)
    获得 Nessus。


    ## 4.9 PSIONIC PORTSENTRY


    Psionic PortSentry 是名为 TriSentry Suite 的工具集中的一个免费工具，旨在检测并响应针对主机的端口扫描。PortSentry
    能够检测进入系统的端口扫描，然后使用内核路由表、内核防火墙、tcp wrappers 或你选择的自定义命令来动态阻止对扫描系统的访问。LogSentry 是另一款免费的日志监控工具，可以监控你的日志中的可配置活动并根据该配置发送警报。LogSentry
    和 PortSentry 均可以在 [`www.psionic.com`](http://www.psionic.com) 获得。


