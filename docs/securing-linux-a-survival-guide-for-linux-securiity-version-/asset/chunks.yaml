  trans: "\n\n## 2. 你需要收集一些信息：\n\n* 你的 NT 域名称或工作组名称：\n* 允许访问此服务器共享的主机或网络列表：\n* NT\
    \ 域服务器的 IP 地址（如果适用）：\n\n## 3. 编辑 Samba 主配置文件 `/etc/samba/smb.conf`（更改部分已摘录并用**粗体**标记，注释用*斜体*标记）：\n\
    \n```\n /etc/samba/smb.conf\n# workgroup = NT-Domain-Name or Workgroup-Name\n\
    # 将此字段设置为你的 NT 域名称或 Windows 工作组名称\n        workgroup = Mygroup\n\n# server string\
    \ 对应于 NT 的描述（Description）字段\n        # 根据你的组织标准，将此字符串更改为无害的内容。\n# 此信息将显示在网络上用户的“网络邻域”浏览器中。\n\
    \        server string = Home directory server\n\n        # 设置允许连接到此服务的允许主机列表\n\
    # 请确保在此列表中仅使用 IP 地址：主机名可以被伪造。\n# 以下是此列表的所有有效 IP：\n# 192.168\\.1\\. 将选择所有以 192.168.1.\
    \ 开头的 IP。\n# 127\\. 将选择环回网络上的任何内容（例如 127.0.0.1）\n# 192.168.1.47 将仅选择此主机\n    \
    \    hosts allow = 192.168.1.\n\n# 服务器安全级别：\n# 这将设置 Samba 共享时验证用户的方法。不要将此\n# 设置为\
    \ \"share\"，因为这允许远程客户端仅发送用户名即可访问挂载共享。\n# 如果你是独立服务器，而不是 NT 域的一部分，请将其设置为 \"user\"\
    （默认）。\n# 如果此机器是 NT 域的一部分，请使用 `smbpasswd` 将其添加到域，然后\n# 将此值设置为 \"domain\" 以向域服务器进行身份验证。\n\
    \        security = user\n\n# 密码级别应设置为零：除非你正在使用 Windows 95 或 98，否则当前的 Windows\n\
    # 版本可以正确处理密码字符串的编码。Win95、Win98 和工作组版习惯于发送全大写字母密码，\n# 这会导致密码检查失败，除非你设置此参数让服务器尝试将密码中的\n\
    # 各字母设为小写。用户名和旧的基于 DOS 的客户端\n#也会发生类似的情况。\n        password level = 0\nusername\
    \ level = 0\n\n# 启用密码加密并存储在 `smbpasswd` 文件中。幸运的是，Red Hat 默认使用了\n# 正行为。\n     \
    \   encrypt passwords = yes\nsmb passwd file = /etc/samba/smbpasswd\n\n# 注释掉以下行可以防止\
    \ Unix 和 SMB 密码同步，这在\n# 情况下正是我们想要的，即保持两个数据库分离。我们将锁定\n# 本地账户并仅授予 Samba 访问。\n  \
    \       unix password sync = no\n# passwd program = /usr/bin/passwd %u\n# passwd\
    \ chat = *New*password [etc.]\n     pam password change = no\n\n# 指示 Samba 使用此文件将\
    \ NT 用户映射到本地 Unix 账户\n        username map = /etc/samba/smbusers\n\n# 不要让 Samba\
    \ 作为 Windows 95 工作站的域登录服务器\n        domain logons = no\n\n# 现在我们定义共享\n# 以下是主目录\n\
    [homes]\n  comment = Home Directories\n  # 不要在没有认证的情况下列出这些共享，例如在“网络邻域”中\n  browseable\
    \ = no\n  writable = yes\n  # 用户账户通常是有效的...\n  valid users = %S\n  # ...除非它们出现在此列表中。注意使用\
    \ \"@wheel\" 来指定\n  # \"wheel\" 组中的任何人。\n  invalid users = root bin daemon adm\
    \ lp sync halt shutdown mail news uucp operator \\\n      games gopher ftp nobody\
    \ vcsa mailnull ntp rpc xfs gdm rpcuser nfsnobody nscd pcap @wheel\n  # 设置默认 umask\n\
    \  create mode = 644\n  # 设置共享目录的默认权限模式\n  directory mode = 755\n\n# 以下是打印机共享\n\
    [printers]\n  comment = Shared Printers\n  path = /var/spool/samba\n  # 不要在没有认证的情况下列出打印机共享，例如在“网络邻域”中\n\
    \  browseable = no\n  # 用户必须经过身份验证才能使用这些打印机\nsguest ok = no\n  # 用户可能无法删除或禁用这些打印机\n\
    \  writable = no\n  printable = yes\n```\n\n## 4. 在 Samba 服务器上创建用户\n\n1. 首先，我们创建一个用户，并赋予一个锁定的\
    \ shell\n\n```\n useradd -u 1500 -d /home/user -s /dev/null -m user\n```\n\n2.\
    \ 接下来我们可以锁定用户的本地密码，并设置 Samba 密码，它将存储在 Samba 独立的密码数据库 `/etc/samba/smbpasswd` 中\n\
    \n```\npasswd -l user\n       smbpasswd\n```\n\n## 5.  Samba 服务\n\n```\n /etc/init.d/smb\
    \ start\n```\n\n**Samba Client**\n\n接下来，我们将作为客户端挂载共享\n\n1. 检查你是否可以从命令行挂载共享。例如，将在\
    \ 192.168.1.50 的 mercury 上挂载 `/local/samba`。为了方便配置，我们在 mercury 的 hosts 文件中添加 `saturn`。\n\
    \n```\n [root@client root]# echo \"192.168.1.20 saturn\" >> /etc/hosts\n     \
    \   [root@client root]# echo >> /etc/hosts\n        [root@client root]# mount\
    \ -t smbfs -o username=user,workgroup=MYGROUP \\\n        //saturn/shared /local/samba\n\
    \        Password: \n        [root@client root]# umount /local/samba\n```\n\n\
    2. 接下来，我们将尽可能保护挂载：创建一个无权限用户和相应的组来拥有目录中的文件，并将挂载设置为仅组可用。任何需要访问的用户应加入该组。\n\n```\n\
    \ useradd -u 5000 -d /local/samba -s /dev/null smbowner\n       passwd -l smbowner\n\
    ```\n\n3. 遗憾，由于挂载需要认证，客户端无法在不输入密码的情况下创建挂载。由于 `/etc/fstab` 需要所有用户可读，我们将此挂载的凭据存储在\
    \ root 的家目录下的文件中，并使其仅对 root 可。你也可以选择将挂载点标记为启动时不自动挂载（noauto），并在重启时通过控制台或安全登录会话手动挂载。这样更安全，但意味着无人值重启后，文件系统将消失，直到有人连接服务器并手动挂载。\n\
    \n```\n [root@client root]# cat >> /root/.smbmount\n               username =\
    \ NTUser         # 使这些值非常安全，不要与其他\n               # 其他服务器的凭据相同\n             \
    \  password = NTPassword\n               [ Press <Ctrl>-D ]\n        [root@client\
    \ root]# chmod 400 /root/.smbmount\n        [root@client root]# chown root /root/.smbmount\n\
    \        [root@client root]# chattr +i /root/.smbmount\n```\n\n## 4. 编辑 /etc/fstab\
    \ 并设置挂载选项\n\n```\n /etc/fstab\n       [...]\n       # 以下应在同一行\n       //saturn/shared\
    \ /local/samba    smbfs credentials=/root/.smbmount,workgroup=MYGROUP \\\n   \
    \            uid=smbowner,gid=smbowner 0 0\n```\n\n"
- fmt: "\n5. In order for your filesystem to mount automatically at boot, you either\
    \ have to hack `/etc/rc.d/rc.sysinit` or else run the `netfs` service on your\
    \ machine, which automatically mounts any network-based filesystems configured\
    \ in `/etc/fstab`. Without that service, Samba filesystems will not be mounted\
    \ automatically. To turn it on, run this command:\n\n```\n/sbin/chkconfig --level\
    \ 2345 netfs on\n```\n\n### 3.3.4 SCP and SFTP\n\nThe need for remote file-transfer\
    \ and command-line control sessions is of paramount importance to Unix administrators.\
    \ For many years, however, only protocols such as FTP, Telnet and RSH were available.\
    \ These protocols transmitted not only the data of the session but the authentication\
    \ information as well in cleartext over the network. The advent of the Secure\
    \ Shell (`ssh`) protocol introduced a much-welcomed answer to this problem, providing\
    \ complete encryption of both command-line and data transfer sessions using strong\
    \ encryption algorithms. Particularly welcome has been the recent development\
    \ of OpenSSH, a spinoff of the OpenBSD project, which has helped bring this protocol\
    \ into wider use with its open-source implementation that compiles on any number\
    \ of different Unix platforms. As a result, most Linux distributions now ship\
    \ with OpenSSH pre-installed.\n\nWhile configuration of SSH for command sessions\
    \ is covered in another section of this text, one feature that is sometimes overlooked\
    \ is its file-transfer capabilities, intended to replace `rcp` and `ftp` at one\
    \ blow. The `scp` and `sftp` commands do an excellent job of replacing their non-encrypted\
    \ counterparts, emulating the command-line switches and options so well that in\
    \ most cases, `scp` in particular can simply be used as a drop-in replacement\
    \ for `rcp`. In this section, we'll configure an SSH server such that file transfers\
    \ using `sftp` are as secure as possible, including the use of `chroot` to jail\
    \ the users' file-transfer sessions, by patching the SSH source code. Unfortunately,\
    \ the patch currently does not work for `scp`, but chrooted and non-chrooted users\
    \ can exist side-by-side.\n\nRed Hat, even with the most current patches, does\
    \ not always offer the latest SSH build, so it will be necessary to get the portable\
    \ distribution of OpenSSH from the OpenSSH team (`http://www.openssh.com`). You\
    \ can fetch the portable version in a binary RPM, source RPM, or gzipped source\
    \ tarball; since the `chroot` will require modifications to the code, we'll need\
    \ one of the two latter options.\n\nIf you're not interested in implementing the\
    \ `chroot` feature, you can skip ahead: you'll need the configuration files for\
    \ SSH featured at the end of this section and you'll be set.\n\n### 3.3.4.1 Chrooting\
    \ SFTP\n\n#### 1. Fetch and unpack the sources\n\nTable 3-4: Fetching and Unpacking\
    \ Sources\n\n| Using Source Tarball | Using Source RPM |\n| --- | --- |\n| `cd\
    \ /usr/src` | `cd /usr/src` |\n| `tar zxvf /usr/src/openssh-3.4p1.tar.gz` | `rpm\
    \ -ivh /usr/src/openssh-3.4p1-1.src.rpm` |\n| `cd /usr/src/openssh-3.4p1` | `cp\
    \ /usr/src/osshChroot-3.4.diff /usr/src/redhat/SOURCES` |\n| `patch -p1 < /usr/src/osshChroot-3.4.diff`\
    \ | `cd /usr/src/redhat/SPECS` |\n| | `add lines to /usr/src/redhat/SPECS/openssh.spec`\
    \ `( See end of section for modifications to spec file )` |\n\n#### 2. Configure,\
    \ build and install the package\n\nTable 3-5: Configuring, Building, and Installing\
    \ Packages\n\n| Using Source Tarball | Using Source RPM |\n| --- | --- |\n| |\
    \ |\n```\n./configure \\\n---prefix=/usr\\\n---with-tcp-wrappers \\\n---with-rsh=/bin/rsh\
    \ \\\n---with-default-path=/usr/local/bin:/usr/bin:/bin \\\n---with-superuser-path=\\\
    \n/usr/local/sbin:/usr/local/bin:/sbin:/bin:/usr/sbin:/usr/bin \\\n---with-privsep-path=/var/empty/sshd\
    \ \\\n---with-ipv4-default \\\n---with-pam \\\n---with-md5-passwords\n```\n| |\
    \ |\n```\nrpm -bb /usr/src/redhat/SPECS/openssh.spec\n```\n| | |\n| `make` | `cd\
    \ /usr/src/redhat/RPMS/i386` |\n| | |\n```\nmake install\n```\n| | |\n```\n[ If\
    \ you already have Red Hat's SSH installed ]\nrpm -Fvh /usr/src/redhat/RPMS/i386/openssh*.rpm\n\
    \n[ If this is a fresh install of SSH ]\ncd /usr/src/redhat/RPMS/i386\nrpm -ivh\
    \ ./openssh-3.4p1-1.i386.rpm\nrpm -ivh ./openssh-clients-3.4p1-1.i386.rpm\nrpm\
    \ -ivh ./openssh-server-3.4p1-1.i386.rpm\n```\n| | |\n\n#### 3. Create the chroot\
    \ directory\n\n```\n/bin/mkdir /usr/local/chroot\n        cd /usr/local/chroot\n\
    \        /bin/mkdir -p bin dev/pts lib/i686 home usr/bin usr/libexec/openssh usr/lib\
    \ etc var/log\n        for prog in bash cp ls mkdir mv rm rmdir ; do\n       \
    \  /bin/cp -p /bin/$prog /usr/local/chroot/bin\n        done\n        for file\
    \ in ld-linux.so.2 libcrypto.so.2 libdl.so.2 libnsl.so.1 libtermcap.so.2 libutil.so.1\
    \ ; do\n         /bin/cp -p /lib/$file /usr/local/chroot/lib\n        done\n \
    \       /bin/cp -p /lib/i686/libc.so.6 /usr/local/chroot/lib/i686/libc.so.6\n\
    ```\n\n#### 4. Test the chroot\n\nTo ensure the `chroot` is working properly,\
    \ we'll test the `chroot` by transferring a file.\n\n```\n/bin/cp -p /lib/i686/libc.so.6\
    \ /usr/local/chroot/lib/i686/libc.so.6\n```\n\n#### 5. Create the chrooted user\n\
    \nWe will create a single user to test the `chroot`.\n\n```bash\nuseradd -d /usr/local/chroot\
    \ -s /bin/bash chuser\n```\n\n#### 6. Run the daemon and test the chroot\n\n```bash\n\
    /usr/sbin/sshd -D\n```\n\n#### 7. Secure the daemon's configuration\n"
  raw: "5.  In order for your filesystem to mount automatically at boot, you either\
    \ have to hack `/etc/rc.d/rc.sysinit` or else run the `netfs` service on your\
    \ machine, which automatically mounts any network-based filesystems configured\
    \ in `/etc/fstab` . Without that service, Samba filesystems will not be mounted\
    \ automatically. To turn it on, run this command:\n\n    ```\n     /sbin/chkconfig\
    \ ---level 2345 netfs on\n    ```\n\n### 3.3.4 SCP and SFTP\n\nThe need for remote\
    \ file-transfer and command-line control sessions is of paramount importance to\
    \ Unix administrators. For many years, however, only protocols such as FTP, Telnet\
    \ and RSH were available. These protocols transmitted not only the data of the\
    \ session but the authentication information as well in cleartext over the network.\
    \ The advent of the Secure Shell (ssh) protocol introduced a much-welcomed answer\
    \ to this problem, providing complete encryption of both command-line and data\
