  \n\n\n\n\n# 登录访问控制表。\n\n```\n# 当有人登录时，系统会扫描表格，找到第一个匹配\n# (user, host) 组合的条目；或者在非网络\n\
  # 登录的情况下，找到第一个匹配 (user, tty) 组合的条目。\n# 该表格条目的权限字段决定了登录将是\n# 被接受还是被拒绝。\n\n# 登录访问控制表的格式为三个由\
  \ \":\" 字符\n# 分隔的字段：\n\n#       权限 : 用户 : 来源地\n\n# 第一个字段应该是 `+`（允许访问）或 `-`（拒绝访问）\n\
  # 字符。\n\n# 第二字段应该是一个或多个登录名称、组名\n# 或 `ALL`（始终匹配）的列表。当 `user@host` 格式的\n# 模式在登录匹配“user”部分且“host”部分\n\
  # 部分匹配本地机器名称时，会被匹配。\n\n# 第三个字段应该是一个或多个 tty 名称（用于非\n# 网络登录）、主机名、域名（以 \".\" 开头）、主机\n\
  # 地址、互联网网络编号（以 \".\" 结尾）、`ALL`（始终\n# 匹配）或 `LOCAL`（匹配任何不包含 \".\"\n# 的字符串）。\n\n# 如果你运行\
  \ NIS，可以在主机或用户模式中使用 `@netgroupname`；\n# 这甚至对于 `@usergroup@@hostgroup` 模式也有效。很奇怪。\n\
  \n# `EXCEPT` 运算符使得编写非常紧凑的规则可能。\n\n# 只有当名称与登录用户不匹配时，才会搜索\n# 组文件。用户的主组会被匹配，显式列出用户的\n\
  # 组也会被匹配。\n\n```\n\n# 禁止除少数账户外的所有账户控制台登录。\n\n-:ALL EXCEPT wheel shutdown sync:LOCAL\n\
  \n# 禁止非本地登录到特权账户（wheel 组）。\n\n-:wheel:ALL EXCEPT LOCAL .win.tue.nl\n\n# 某些账户不允许从任何地方登录：\n\
  \n-:wsbscaro wsbsecr wsbspac wsbsym wscosor wstaiwde:ALL\n\n# 所有其他账户都允许从任何地方登录。\n\
  ```\n\n## 2. `/etc/security/limits.conf`\n\n```\n# /etc/security/limits.conf\n\n\
  # 每行按以下格式描述用户的限制：\n\n#<domain> <type> <item> <value>\n\n# 其中：\n#<domain> 可以是：\n\
  #         - 用户名\n#         - 组名，使用 `@group` 语法\n#         - 通配符 `*`，用于默认条目\n\n#<type>\
  \ 可以有两个值：\n#         - \"soft\" 用于强制软限制\n#         - \"hard\" 用于强制硬限制\n\n#<item>\
  \ 可以是以下内容之一：\n#         - core - 限制核心文件大小 (KB)\n#         - data - 最大数据大小 (KB)\n\
  #         - fsize - 最大文件大小 (KB)\n#         - memlock - 最大锁定内存的地址空间 (KB)\n#     \
  \    - nofile - 最大打开文件数\n#         - rss - 最大驻内存大小 (KB)\n#         - stack - 最大栈大小\
  \ (KB)\n#         - cpu - 最大 CPU 时间 (MIN)\n#         - nproc - 最大进程数\n#        \
  \ - as - 地址空间限制\n#         - maxlogins - 该用户的最大登录次数\n#         - priority - 运行用户进程的优先级\n\
  #         - locks - 用户可以持有的文件锁上限\n\n#<domain>           <type>            <item>\
  \             <value>\n\n#*                   soft             core            \
  \   0\n#*                   hard             rss                10000\n#@student\
  \            hard             nproc              20\n#@faculty            soft \
  \            nproc              20\n#@faculty            hard             nproc\
  \              50\n#ftp                 hard             nproc              0\n\
  #@student            -                maxlogins          4\n# 文件结束\n```\n\n```\n\
  \n## 3. `/etc/security/time.conf`\n\n```\n# 这是 `pam_time` 模块的示例配置文件。其语法\n# 最初很大程度上基于\
  \ shadow 软件包 (shadow-960129)。\n\n# 行的语法如下：\n\n#       services;ttys;users;times\n\
  \n# 空格会被忽略，行可以使用 `\\n` 扩展（转义\n# 换行）。正如阅读这些注释所显而易见的，\n# `#` 之后的文本将被忽略，直到行尾。\n\n#\
  \ 单个用户/终端等的组合是一个逻辑列表，\n# 即单个令牌，可以可选地带有 `!`（逻辑非）\n# 并用 `&`（逻辑与）和 `|`（逻辑或）分隔。\n\n\
  # services\n#       是规则适用的 PAM 服务名称逻辑列表。\n# ttys\n#       是该规则适用的终端名称逻辑列表。\n\n#\
  \ users\n#       是规则适用的用户逻辑列表。\n\n# 注意。对于这些项目，简单的通配符 `*` 只能使用一次。\n\n# times\n# \
  \      这里的格式是日期/时间范围条目的逻辑列表，\n#       日期由一个由两个双字符条目组成的\n#       序列指定，例如 `MoTuSa`\
  \ 代表周一、周二和周六。注意\n#       重复的日期将取消设置 `MoMo` = 无任何日期，且 `MoWk` = 除周一以外的所有工作日。\n#  \
  \     接受的双字符组合是：\n\n#            Mo Tu We Th Fr Sa Su Wk Wd Al\n\n#       最后两个分别代表周末和一周的\
  \ 7 天。\n#       作为最后的例子，`AlFr` 意味着除周五以外的所有日子。\n\n#       每个日期/时间范围都可以带有 `!` 前缀以表示“除……之外”\n\
  \n#       时间范围部分是两个 24 小时制的 `HHMM`，用连字符\n#       分隔表示开始时间和结束时间（如果结束时间小于\n#     \
  \  开始时间，则被认为应用于第二天）。\n\n# 若要使规则生效，必须满足 service+ttys+users\n# 的所有应用条件。\n\n#\n# 示例文件结束。\n\
  #\n```\n\n\n\n\n\n# 第 1 部分：适用于所有系统（服务器和工作站）\n\n# 记录所有 info 或更高级别的消息，但使用自带日志的设施\n\
  ```\n*.info;authpriv,auth,mail,cron,kern,local7.none             /var/log/messages\n\
  # authpriv 用于与授权相关的消息\n#（例如：登录失败尝试）。auth 已弃用，但仍包含在内\n# 以防某些旧版程序仍在使用它。\nauthpriv,auth.*\
  \                                             /var/log/secure\n# 将邮件消息发送到单独的文件。\n\
  mail.*                                                      /var/log/maillog\n#\
  \ 将 crond 和 atd 消息发送到单独的文件。\ncron.*                                            \
  \          /var/log/cron\n# 将内核消息发送到单独的文件。注意，这将包含\n# 由 iptables 生成的关于被拦截的网络流量的消息。\n\
  kern.*                                                      /var/log/kernel\n# 将启动消息发送到单独的文件\n\
  local7.*                                                    /var/log/boot.log\n\
  # 将所有类型的紧急消息发送给所有登录用户\n*.emerg                                                 \
  \           *\n```\n\n# 如果你有一个远程日志主机，请取消对应你\n# 想要转发到该主机的消息类型的注释。将字符串\n# loghost\
  \ 替换为你中央日志服务器的 IP 地址。\n\n```\n#kern.*                    @loghost\n#authpriv,auth.*\
  \           @loghost\n#mail.*                    @loghost\n```\n\n# 第 2 部分：仅适用于服务器\n\
  \n# 如果这是一个 FTP 服务器，请取消下一行并将 ftp 添加到\n# 发到消息文件的逗号分隔的设施列表中。\n# ftp.*             \
  \                                     /var/log/ftp\n\n# 如果这是一个新闻 服务器，请取消下一行并将 news\
  \ 添加到\n# 发到消息文件的逗号分隔的设施列表中。\n# news.*                                          \
  \       /var/log/news\n# 如果这是一个打印服务器，请取消下一行并将 lpr 添加到\n# 发到消息文件的逗号分隔的设施列表中。\n# lpr.*\
  \                                                  /var/log/spooler\n```\n\n![](img/_.gif)\n\
