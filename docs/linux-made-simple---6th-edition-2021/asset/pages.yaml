    similar to what happens when you insert a disc in Windows. You''ll be asked to
    specify the type of disc, and then an icon will appear on the desktop where the
    disc is inserted.


    Your choice depends on what''s installed - Ubuntu comes with several apps that
    can be used for the disc: Rhythmbox (playing audio and videos), VLC (watching
    movies), and DVDCreator (creating disc data, burning all kinds of discs, including
    DVD, DVDCD and audio).


    By default, Ubuntu can''t play restricted files, including encrypted DVDs. To
    play commercial DVDs, you need to install the libdvdcss from the Software Centre
    - once done you''ll be able to play them, as well as third party tools like VLC
    Media Player.


    ![](img/f2b72995a1be50e1613a2c5b8b47f2e9_88_0.png)


    > > Rhythmbox can extract audio from your CDs as you can play them back to.


    # Burn discs


    When you insert a disc, it will prompt you to open CD/DVD Creator. This provides
    a simple interface to drag and drop files, where you can select a title and click
    ''Write'' to burn your data.


    A more sophisticated tool for burning discs is Brasero. When you insert a blank
    disc, it will open for you. Drag the disc into the window, then select your project:
    you can create an audio CD, data or DVD, DVD/SVCD, as well as burning all discs
    from source images like ISO files.


    Brasero is simple to use as the mention below - it''s mostly just a case of dragging
    and dropping the files you want to add to your disc in the correct order. There
    are also plenty of alternative burning tools around - to create a DVD from menus
    use K3b, for example, or check out X3f for general-purpose applications.


    ![](img/f2b72995a1be50e1613a2c5b8b47f2e9_88_1.png)


    Quick tip

    You may also have microSD cards in Linux - If they are inserted into a card reader
    (use a USB adapter), you''ll be able to mount them like other media drives.


    ![](img/f2b72995a1be50e1613a2c5b8b47f2e9_88_2.png)


    # Exploring Brasero


    # Access order projects


    Choose File - Make a copy of your project before you''re ready to burn it. You
    can then return to it further tweaking.


    # Project type


    Brasero allows you to burn all kinds of discs: audio, video and data, plus burn
    from image files and one disc to another (two optical drives required).


    # File and folders


    These buttons allow you to add and remove files from your project, perform other
    other tweaks such as creating new folders for discs.


    # File list


    Review the list of files, tracks or videos that you plan to burn - media tracks
    can be clicked and dragged to their running order.


    # Choose media


    Click this window to switch between available drives or make a disc. A image guide
    tells you how much free space is left.


    # Burn disc


    Once you''re ready, click the Burn button. Select your speed, plus tweak options
    like ejecting the disc. You can even burn several copies if needed.


