  md: '# # Software glitches


    Software misbehaving? Or do you need to help.


    # ## Installing software


    I''m new to Linux and cannot install software. On Windows, I go to the programs,
    download an exe and run it in Linux. What do I do?


    Programs are generally provided as source code and that means you know to compile
    the program or have to compile the rest of your software itself. Look for a compiled
    Software Manager or similar: let you search for and install anything you need.
    Install take any programs needed by the one you are installing and when updates
    are available. There is no need for you to check back on web pages or programs
    to "phone home".


    requires three commands to build and install the software.

    These must be run from inside the directory created when you unpacked the tarball:

    `./configure`n`make`n`sudo make install`


    The first command checks that your system has all the required dependencies and
    sets up the build environment to suit your system. The second compiles the source
    code into programs to run on your computer, and the third installs those programs
    to the correct locations and handles any installation-related configuration.


    You need a standard build installed to do this. Most distributions have a package
    built-essential, or something similar, that everything you need to build and install
    from source.

    If you want to remove the software at a later date, go back and run:

    `sudo make uninstall`


    # ## Use the source


    I want to install a program from source but the program''s only provides source
    code. How do I install it?


    The precise method will vary from one program to another. The first step is to
    unpack the tarball or ZIP file and look for a file called Readme. This will explain
    how to install the software. In 90% of projects, the standard system is used,
    which


    # ## No DVD drive


    I have an ISO that I can burn to a CD, but I want to use it with a live system
    on my USB. Can I use a USB stick with ISO?


    You can do this. The easiest approach is to download the latest release as an
    ISO image. Some distributions provide a tool for burning ISO to a USB stick with
    `dd` command, or you can copy the ISO file to your USB stick directly.


    If the file is in the correct path and of the destination (bsdsk) speeds up the
    process quickly, but `dd` does exactly what you tell it to write, and there are
    no safety mechanisms, so make sure you have the correct destination drive.


    How do you know which ISO is correct? The device menu may say so, but you can
    test it with `fsck -n`.


    If the line under the Device line shows the name of the ISO, you have a hybrid.
    Then you can convert it with sysusb. You may need to install the syslinux package
    first.


    ![](img/f2b72995a1be50e1613a2c5b8b47f2e9_131_0.png)


    # Our app stars


    Come and explore our features


    > > Don''t go to the web for software from sources. You might find it in your
    distribution''s software manager.


    # ## Run from a crash


    If a program fails to run from the terminal, launcher, or but crashes after going,
    trying to run it again in the terminal might work. It will not magically make
    it work, but most programs will output error messages to the terminal. If things
    go wrong, it should give you a clue to the problem or something else to enter
    into a search engine. This is how you know


    name of the command to run it from the terminal, which is often a lower version
    of the program, so to run it you first type `file` [TAB] to get the correct name.
    If it fails again, you can check which packages you have installed into your command
    path. With Debian then the command is for example:


    ```

    dpkg -l | grep fixpeg

    ```


