    The good news is that you''re not locked into your distro''s choice. Whether you''re
    planning to switch to a different one or you''re looking for a way to interact
    with your desktop, Linux can accommodate you. You can even run multiple desktops
    side-by-side, allowing you to compare and contrast them easily.


    Cinnamon (@cinnamon.linuxmint.com). It''s the default desktop in Linux Mint, and
    is particularly popular among those switching from Windows as it utilises a similar
