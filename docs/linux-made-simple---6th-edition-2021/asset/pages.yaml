  md: '# # Essential apps


    A Linux desktop isn''t complete without them!


    # ## LibreOffice


    Forked from OpenOffice.org, LibreOffice is one of the most popular productivity
    suites. It includes programs for word processing, and can create spreadsheets,
    slide shows, drawings and maps, complex mathematical formulas. It also offers
    good compatibility with documents in proprietary formats and has meant a fairly
    left. www.libreoffice.org


    ![](img/f2b72995a1be50e1613a2c5b8b47f2e9_34_0.png)


    # ## Thunderbird


    A gem from the Mozilla Foundation. Thunderbird is a great mail client, easy to
    set up and is brimming with features. Simple setup wizards avoid signing up with
    popular webmail services and manage multiple accounts, supports encryption and
    much more. www.mozilla.org/thunderbird


    ![](img/f2b72995a1be50e1613a2c5b8b47f2e9_34_1.png)


    # ## Wine


    Explite the increasing number of cross-platform apps that work on Linux, which
    includes big third-party applications, such as Adobe Photoshop or just simple
    home-grown games that you can''t do without Windows. Wine, which can run these
    Windows apps and games with ease. The project supports over 20,000 apps, though
    some might require minor configuration tweaks. www.winehq.org


    ![](img/f2b72995a1be50e1613a2c5b8b47f2e9_34_2.png)


    # ## KeeppassX


    Trying to remember passwords for the various services is a challenge for most
    users (including me). You can use KeeppassX to store passwords in an encrypted
    database. It can also generate a random password generator. www.keepassxc.org


    ![](img/f2b72995a1be50e1613a2c5b8b47f2e9_34_3.png)


    # ## BleachBit


    Accumulates a lot of junk over time. BleachBit helps protect your privacy, it
    also removes unnecessary files, and has tools to securely delete files or them.
    bleachbit.org.org


    ![](img/f2b72995a1be50e1613a2c5b8b47f2e9_34_4.png)


    # ## Remmina


    If you need to access a computer from the comforts of your desktop, it supports
    the widest range of protocols and will connect to all kinds of remote desktops.
    The app is easy to use and has features that make it a visual option for remote
    control. remmina.org


    ![](img/f2b72995a1be50e1613a2c5b8b47f2e9_34_5.png)


    # ## VLC


    Distros ship with a functional video player. If you need more, VLC supports virtually
    every video and audio format out there and includes tools for advanced users.
    videolan.org/vlc


    ![](img/f2b72995a1be50e1613a2c5b8b47f2e9_34_6.png)


    # ## PeaZip


    PeaZip is a graphical archiving tool that works with over 130 different formats,
    handles archive files and can create encrypted ones. It integrates with popular
    file managers and has a CLI for advanced users. http://bit.net/PeaZipSF


    # ## OpenSSH


    When you need to connect to a remote computer, you cannot do without OpenSSH.
    It''s a family of tools for secure tunnelling by SSH, supports various authentication
    methods, and supports all SSH protocols. openssh.org


    ![](img/f2b72995a1be50e1613a2c5b8b47f2e9_34_7.png)


