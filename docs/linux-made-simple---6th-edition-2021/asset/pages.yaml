  md: '# # Linux Formatting


    Back in your document, duplicate your dummy text a few times (select it all with
    [Ctrl]+A], copy it with [Ctrl]+C], paste it with [Ctrl]+V) to fill the page. We''re
    going to style this document using Writer''s default styles. Click the drop-down
