  md: '# # Kodi: Media made easy


    **Kodi – formerly known as XBMC – is an awesome way to bring Linux into your living
    room.**


    > > Quick tip


    There are plenty of media players available for Linux, capable of organising and
    accessing your digital media library wherever it is on your hard drive or around
    the house. But Kodi is an application that puts digital media into a centre. It
    can be played on the Xbox (and formerly known as Xbox Media Center) as a "100
    foot interface" for viewing with a remote on TV. It is cross-platform software.


    If you use Kodi, it can also be used as a hotspot for other devices or servers.
    Under internet you can run a wired connection to it. Or if Kodi is on wireless
    network, you can extend the centre through an ethernet port to a device that has
    wireless built.


    Kodi is brilliant. It can also play CDs, Blu-ray discs and movies, and more. You
    can even use Kodi to fetch videos from fans of streaming services like VLC-Player
    or any one of TV channels from the world – including high profile sports – archives
    of favourite teams.


    It also works with DVD-T cards so you can watch TV or your PC through an IPTV
    system capable of receiving shows for playback.


    To get back to the desktop, click the power button and select Exit. To run Kodi
    in a window, go to Settings > Settings and click the Video Output tab. From here
    you can change the Display Mode to Windowed or full screen.


    You can see from above that Kodi''s weakness is that some of the menus are a little
    overcomplicated. It is thus highly customizable: you can change many of the settings
    and the kind of hardware acceleration you prefer the menus, so be careful not
    to change anything you don''t fully understand.


    Because Kodi is intended for use on a dedicated media centre machine, you should
    build systems (usually based on Ubuntu) from scratch into Kodi and have most apps
    running for stability.


    There are images of Kodi operating systems for non-linux PCs too, like the Raspberry
    Pi (the rest is OSM) and an Android app. The latter means it''s ideal for devices
    like the Amazon Fire TV, which is capable of playing videos via an HDMI port.


    # Getting Kodi


    Kodi isn''t in the standard Ubuntu repositories. To install it on your current
    machine, you''ll need to add a repository and install Kodi.


    ```

    sudo apt-add-repository ppa:teamjakie/kodi

    sudo apt update

    sudo apt-get install kodi

    ```


    Kodi is a small thing, around 78MB in size local. After installing it, you''ll
