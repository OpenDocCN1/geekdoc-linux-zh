  md: "# System issues\n\nFix common difficulties with general system admin.\n\n#\
    \ ## Drive filling up\n\nAm running out of space on my hard drive – the space\
    \ just seems to be disappearing. Where did it go and how can I get it back?\n\n\
    If you have more than one partition, the first step is to see which is affected,\
    \ with the command: \n`df -h`\n\nThis shows the total, used and available space\
    \ on each partition. If you have a partition, you now know whether it is your\
    \ home directory or the root system that is full. The steps are the same in each\
    \ case, although you need to clean up the system using `/tmp` and `/var`\n\nFor\
    \ the system files, the culprits are `/tmp` and others. The first is used for\
    \ temporary files, but others old\n\n![](img/f2b72995a1be50e1613a2c5b8b47f2e9_129_0.png)\n\
    \nget here, especially when processes fail without cleaning up. `/var` contains\
    \ system log files and can fill up, if a process is logging lots of errors. Look\
    \ at the contents of large files here before you deal with them. It's worth installing\
    \ `logrotate`, which keeps your logs under control. Its default setup starts a\
    \ new log file and compresses the last one, keeping the last four weeks of logs.\
    \ This saves a huge amount of space.\n\nIn your home directory, you can clear\
    \ downloads, browser and manager caches and the cache directories. You can also\
    \ check the sizes of directories:\n\neverything in size order. Using \n`du -sh\
    \ * | sort -h`\n\nThere are also graphical tools to visualize disk usage: Flight\
    \ for KDE and Disk Usage Analyzer for Gnome – Bleachbit is good for identifying\
    \ and cleaning unnecessary files, browser caches and other tools.\n\n# ## Where\
    \ has my memory gone?\n\nI noticed that after running some programs a while, I've\
    \ have almost no memory left. How can I free up memory and what can I do about\
    \ it?\n\nThis is perfectly normal and the free memory isn't doing nothing when\
    \ it could be helping the performance of your computer. The Linux kernel memory\
    \ is still active in use by these processes, such as file caches in order to improve\
    \ performance. You can see this by looking at output from `free`.\n\n> > Fileight,\
    \ Gnome Disk Usage Analyzer, can you give you a good representation of how you\
    \ fill that hard drive.\n\n# Looking for trouble\n\nLinux logs tell about everything.\
    \ When things go wrong, there are the places to look. The system log is in `/var/log`\
    \ or usually called messages, depending on the log distribution you use. For other\
    \ applications, try looking the logs:\n\n```\n`/var/log/messages`\n```\n\nYou\
    \ can also look at the logs in real time with:\n\n```\n`tail -f /var/log/messages`\n\
    ```\n\nwhich will display new entries to the log as they appear (means follow).\
    \ And then you do figure out what is causing problems to your system. If the kernel\
    \ buffer is full, you can check \\`dmesg`.\n\nIf you are having difficulties with\
    \ hardware, to have a 'follow' option\n\n```\n`dmesg`\n```\n\nwhich is useful\
    \ when dealing with hot-plugged hardware. To see how built-in hardware\n\ndetected\
    \ and handled at boot time, run \n`dmesg`\n\nafter booting, then scroll through\
    \ all the messages, or if you have a less like `journalctl` to search for something\
    \ relevant. If you want to use system logs, they can be displayed with journalctl:\n\
    \njournalctl can follow the same stuff with or look for errors since the last\
    \ boot with:\n\n```\n`journalctl -p err`\n```\n\n| total | used | free | buffered\
    \ | cached | merged |\n| --- | --- | --- | --- | --- | --- |\n| 15G | 250M | 12.8G\
    \ | 982M | 398K | 130 |"
