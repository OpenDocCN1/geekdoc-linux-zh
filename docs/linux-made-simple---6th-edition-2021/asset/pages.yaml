    # ## Google Desktop


    The problem with enabling remote desktop over the internet is that it becomes
    possible for any other to probe your internet ports for the RDP protocol. If they
    spot an open port and brute force a weak password, they gain access to your desktop
    as you would. That would be very bad.


    If you require access over the internet using the web browser Google Chrome with
    the Remote Desktop extension, available from the Web Store. This works on all
    that can run Chrome you''re able to connect between Windows, Mac and Linux PCs.


    Install Google Chrome from Chrome.com – Linux ensure you get Chrome and not the
    open source Chromium – switch to its Web Store and install the Chrome Remote Desktop
    extension. This needs to be installed on each machine you want to access.


    On the target machine, open the extension through the Web App, open a blank tab
    and click the top-left icon. If you have to connect to a google account, you need
    to log in on each machine, install the remote connect using the mobile remote
    connects button and create a PIN to access it. We suggest you make this pin the
    length of a number (but you don''t have a account that can be connected to you)
    with two-factor authentication, use a smartphone app to confirm your identity.


    On Linux there are issues with the Ubuntu desktop, so we will install an alternative
    desktop called Xubuntu by setting the the remote session which desktop to log
    into.


    ```

    echo exec /usr/bin/startubuntu >> ~/.chrome-remote-session

    ```


    Now once you can connect running with your account, even over the internet. Be
    aware, of that the remote session needs to be powered on and not to fail asleep!
    Otherwise the google system takes care of the complications of locating a PC on
    the internet for you. Handy.


