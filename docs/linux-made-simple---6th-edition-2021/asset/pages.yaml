    to a specific user (the same user as the file or folder) or to a user group.


    When you create a new user, a group of the same name is automatically created
    and user is added to that group and it''s exactly what Linux refers to. It is
    also possible to add users to multiple groups, allowing users to set up groups
    into which multiple users are added, defining permissions for the selected file
    or folder the group they''re on.


    The third and final category is users ''all-everyone'' else, which applies to
    all other users on your PC who aren''t been mentioned above.


    How are permissions set? When you create a file, it''s automatically set by the
    owner that created it, according to your user profile - if you create it through
    the terminal, automatically set by the owner or group. The owner typically has
    full access rights to the file or folder created;


    This approach forms the cornerstone of security on your Linux file system. By
    default, all users have full access to their own personal folder, while others''
    home folder are blocked. Access to certain directories is accessible, but most
    are read-only or off-limits, requiring you to access them via the ''root'' super
    user account.


    # View and change permissions


    We''ve seen how using the `-l` command in the Terminal to view the permissions
    of a file or folder does not only reveals the permissions for each category, but
    also the name of the file owner and the group that has access rights.


    If you''d prefer a more user-friendly view, plus want list access to changing
    permissions for any reason, browse to


    ![](img/f2b72995a1be50e1613a2c5b8b47f2e9_96_0.png)


    ```

    nick@nick-ubuntu: ls -l

    total 0

    drwxr-xr-x 2 nick ubuntu 4096 Mar 11 15:16 projects

    drwxr-xr-x 2 nick ubuntu 4096 Mar 11 16:04

    -rw-r--r-- 1 nick ubuntu 0 Jan

    -rw-r--r-- 1 nick ubuntu 0 Jan

    -rwxrwxrwx 4 root root 4096 Mar 11 09:37 test

    ```


    > > Check permissions for any file or folder using the -l command in a Terminal.


    Folder or file inquiry, right-click and choose Properties. Switch to the tab and
    use the annotation to help guide you through what''s what. It''s not as easy as
    you might think. First, you can only edit permissions for files you own, unless
    you have the permissions for them. On the other hand, it''s much easier to quickly
    change the permissions of a folder if you don''t own anything else.


    > Quick tip: If you want to format a file that isn''t formatted, first edit the
    file, then permissions for all of files will determine when you want it; read-only
    is an option.


    Click down you can also change the file group if you don''t recognize anyone in
    the list of users you''ve set up - these are specially created users, designed
    for specific things without creating security concerns. You can use these groups
    in the context of file and folders, so so use them as well.


    In fact, it''s a good idea to avoid messing with permissions unless you know exactly
    what you''re doing. It''s not impossible for you to look out for your own files
    by changing the folder; but you can quickly and easily get the last options on
    your view.


    If you want to learn more about permissions, users and groups - including the
    ability to assign users to different groups - you''ll need to get your hands in
    the Terminal. For more help and advice in this area, check out our tutorial on
