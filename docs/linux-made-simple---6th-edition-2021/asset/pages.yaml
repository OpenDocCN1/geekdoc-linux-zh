  md: '# Hardware: Graphics card drivers


    Let’s take a long look, at ahead at the advantages and disadvantages of switching
    graphics card drivers.


    One of the most confusing aspects of switching from Windows to Linux is understanding
    how and in particular graphics drivers work. When you install Ubuntu on your PC,
    you''ll need to install the drivers for graphics to work perfectly, including
    this with cutting edge performance—this is the case in the vast majority of cases.
    These drivers are not open source.


    Because they''re designed to work, many of these drivers aren''t interested in
    providing you performance for a day of word processing or editing images—they''re
    adequate, if you have a graphics card, and you''ll need to manage the possibility
    of gaining full advantage of its capabilities-particularly for gaming with dedicated
    drivers provided by the manufacturers.


    This second set of drivers—with the exception of drivers for Intel graphics—are
    closed source, which means while they will be free to rely on they lack support.
    The open-source drivers that ship with Ubuntu are updated through Ubuntu''s update
    tool, so they''ll update the rest of your system.


    Closed source -or proprietary - relies on the manufacturer for updates to be delivered.
    The manufacturer may provide functionality within the drivers themselves, or you
    may have to manually check to see if new drivers have been released.


    # What''s available


    The major graphics card manufacturers - Intel, NVIDIA and AMD/ATI - all provide
    them Ubuntu drivers. If you plan to upgrade to the closed-source drivers, the
    first thing you need is identify your graphics card—particularly if you have no
    idea the manufacturer is. If you see a graphics section in Settings and Select,
    you''ll find it but it won''t work unless you open a terminal and


    ```

    lspci | grep VGA

    ```


    This quickly will list both manufacturer and model, and you''ll need in order
    to determine if a driver is available for your cards.


    # NVIDIA and AMD


    If you have NVIDIA or AMD graphics cards, the quickest way is to see if a driver
    is available is by opening Settings, ''Software & Updates'', clicking Additional
    Drivers. You will see a list of alternative drivers. Choose the latest version
    marked proprietary, from the list and click ''Apply Changes''. When complete the
    process, restart your PC.


    Don''t expect to work if your card is more than five or six years old, then it''ll
    be better supported. AMD''s support goes back to the HD 2000 and HD 5000 series,
    while NVIDIA cards date back to the GeForce GTX series. NVIDIA does still provide
    links to legacy drivers for older cards—see www.nvidia.com/object/unix/html—but
    these


