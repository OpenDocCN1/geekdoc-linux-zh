  md: '# # VirtualBox


    # # Virtualisation


    Find out how virtualisation software can tap into your PC''s unused power to help
    you run multiple operating systems.


    > > Quick tip


    To give your VBox a boost, enable Intel VT-x/AMD-V acceleration. Visit the INLOZ
    website to see if your processor supports it. If so, make sure it is enabled in
    your PC''s BIOS or UEFI - check your motherboard user manual for instructions.


    Today''s multi-core PCs can run multiple tasks simultaneously, and what better
    to tap into all that virtualisation? In particular hardware virtualisation is
    the process of splitting one computer into multiple virtual PCs (or ''guests'')
    to act independently.


    Virtualisation software allows the host to give up hardware resources. If your
    PC is powerful enough, you can run multiple machines in parallel, enabling you
    to split your computer into one or more guests.


    Virtualisation is simply a means of dividing up computer, however. It also enables
    you to run multiple operating systems in a safe environment - you get control
    from your host, making it easy to experiment with new software without risk. It
    can be used for compatibility purposes - you may have switched from Windows to
    Linux, for instance, but want access to a Windows machine to run old programs
    without rebooting.


    VirtualBox may be free, but it''s still a powerful option that offers both a graphical
    frontend for creating and managing your virtual machines, plus a raft of command-line
    tools for those who need them. Ubuntu Software Centre, but for the purposes of
    this tutorial you can obtain from virtualbox.org/wiki.


    You will find out that it''s really easy to get started, with each one geared
    towards a specific guest. Both 32-bit and 64-bit (AMD64) links are provided to
    download and install, which you can then add to the application list or repository
    source list.


    Once installed, the quickest way to start is through the Dash. This opens the
    Virtual VM Manager, which is where all virtual machines can be listed (and organised
    into groups). It is where you create new VMs from scratch, before you even begin
    them. Use Preferences to set your machine folder to something other than your
    own home folder. This first critical step is important, as each guest may need
    gigabytes of space, so you should allocate a dedicated drive (or lots of free
    space). If you are looking to purchase a drive for your virtual machines, consider
    an SSD to add to your PC''s.


    # Create your first VM


    In the VirtualBox window, select OK, then click New to create your first VM.


    The Create Virtual Machine Wizard works in two of ways: Guided or Expert. With
    Guided, you will follow three configuration steps in a single window. Start by
    selecting your guest operating system and version from the list below.


    VirtualBox supports all major OSs, including Windows, OS X, and Linux/BSD on any
    architecture - more. The drop-down menu depends on your guest selection and as
    well as Linux kernels from 2.22 onwards.


    # Choose VirtualBox


    There are many virtualisations available for Linux, but what better to meet your
    needs (even just your toes in the water) with the open-source solution.


    ![](img/f2b72995a1be50e1613a2c5b8b47f2e9_105_0.png)


    VirtualBox enables you to set up, and run multiple guest machines from the comfort
    of your desktop.


