    ![](img/f2b72995a1be50e1613a2c5b8b47f2e9_68_0.png)


    however, the readings will be bunched up at the lefthand side of the graph with
    a flatline towards the right. The best way to correct this is to drag the marker
    from the right towards the area where the tonal values kick in, reducing the tonal
    range of the image to those that have really been lost.


    If you''re lucky, this will brighten the picture without destroying detail. Because
    the midpoint will auto-adjust, it should not contrast too, merely changing the
    brightness would not help. If it isn''t enough, this could also help correct the
    "white balance" of your picture. If you''ve taken a photo indoors, for example,
