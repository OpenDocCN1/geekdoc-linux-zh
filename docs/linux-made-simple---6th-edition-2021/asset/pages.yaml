  md: '# # Terminal: Apt-get in action


    New to Linux? Then let us guide you through your first steps with apt-get, the
    powerful command line.


    One of the biggest changes that catches Windows users moving to Linux is the way
    that software is installed. Instead of downloading an executable file from somewhere
    other, running it and it doesn''t clutter your existing files (DLLs) or install
    dubious or multiple repositories of software, which are all up to date for compatibility
    with the rest of the distro.


    In this tutorial, we will demonstrate how to use the Advanced Package Tool (apt)
    software management system as developed by Debian and used by distros from Ubuntu
    to Raspberry Pi.


    # Repositories


    A repository is a collection of packages for a distro. Each major distro will
    have its own repositories, and the packages will be built for and tested with
    that. But there is more than one repository (as they are usually called), making
    it easy to find exactly what you want. You can also check for updates for your
    package manager without needing to visit websites to check for updates, or the
    need to search from home to check.


    More importantly, each package in a repo is signed with the GPG (encryption) key,
    which is checked when installing installations. You can trust that the contents


    installed from there to be what it says, and not infected from there that''s been
    uploaded maliciously.


    A repository also make dependency handling simple. A dependency is a program that
    you want to install. By bundling everything in the package with multiple copies
    of them (which happens), a package simply lists the dependencies that your package
    manager can check and install, and grant them from the repo it not.


    In the default release provided by the distro, there are several third-party ones
    that can be added to your package manager. They are not guaranteed to be tested,
    but many of them are very good, and if you stick to the recommended repos for
    your distro, you won''t go far.


    Ubuntu also has the official PPA Archive, which has many repositories for individual
    projects. These may also be added to your package manager, but be careful about
    adding any unwanted sources.


    # Package management


    We used the term package manager a few times now but what is it? It is, a program
    that enables you to


    ![](img/f2b72995a1be50e1613a2c5b8b47f2e9_139_0.png)


    ```

    sudo apt-get update

    sudo apt-get install --dry-run

    sudo apt-get install --dry-run

    ```


    | Command | Description |

    |---|---|

    | sudo apt-get update | Updates the local index of available packages. |

    | sudo apt-get install | Installs a package and its dependencies. |

    | sudo apt-get install --dry-run | Shows what would be done without actually installing.
    |


    # ### Install


    Using apt-get install will check the dependencies of the packages you want and
    install any that are needed. Adding --dry-run to apt-get install will enable you
    to see what would be installed without actually anything to your drive. If you
    run the command again without --dry-run,


    # ### Search


    Using apt-get search to find what''s available. The -names-only option can give
    you a more list of program names if you need results. Let apt-get search for something
    and view the results in list. You don''t need to sudo search as write to your
    drive.


    # ### Update


    Run apt-get update to update all the package lists, by apt-get upgrade to update
    all your installed software to the latest versions. In case, it''s over due. Then
    apt-get will show you how much need to be downloaded, before asking whether you
    wanted to proceed.


    140 | Linux Made Simple'
