  md: '# # GParted: Set your partitions


    Divide up your hard drive using partitioning to make Linux easier to work with.


    network, or setting independent partitions for temporary files, your swap file
    or to run specific services as a web server. Whatever your needs, partitioning
    can be a crucial step in improving performance as well as protecting parts of
    your drive from each other.


    # Partition types


    Hard drives are partitioned according to a scheme. There are two main types of
    scheme: the older Master Boot Record (MBR), which is limited to the first 2TB
    of a hard disk, and the newer GUID Partition Table (GPT). In both cases, partition
    information is recorded physically at the other end of the drive in a partition
    table for redundancy.


    One of the limitations of the older MBR scheme is that it only supports a maximum
    of four partitions, although one of these can be extended into multiple logical
    columns. GPT doesn''t differentiate between primary and extended partitions and
    supports up to 128 partitions per drive.


    GPT is designed in conjunction with modern UEFI and in some cases it is not compatible
    with older BIOS systems. However, you should typically use GPT when your drive
    is over 2TB in size, but ultimately it''s best to stick with what you are with.
    If you''re planning to wipe the drive clean and install Linux from scratch, let
    your decide which scheme is based on your current setup and make sure to set up
    this partition properly.


    ![](img/f2b72995a1be50e1613a2c5b8b47f2e9_91_0.png)


    Partitioning allows you to carve up a single physical drive into smaller, virtual
    drives as partitions or volumes. Each volume acts independently of the others,
    providing a measure of redundancy for data safety across the drive. If one partition
    fails then you can recover without losing what''s stored elsewhere.


    This redundancy provides the first of many reasons to partition your personal
    data (your home folder) another volume, so it is protected from any changes. You
    can use Linux installations as a sandbox, rolling back unwanted changes without
    touching your data.


    Another popular use is to run multiple operating systems on a single PC. You could
    run two versions of Linux side by side or with Windows for compatibility purposes.
    This is possible because each partition can be formatted using a different file
    system, so ext3 or ext4 for Linux, or NTFS for Windows. You can create a data
    partition that''s visible to all OSes, or other files, whichever you have the
    latest version of your OS you happen to be running.


    It''s also possible to use partitions for other purposes, such as creating a dedicated
    partition for sharing over your


    > Quick tip

    If you plan to share a partition with Windows, it needs to be set up as NTFS or
    Windows cannot read it unless the Linux-ntfs3 file system add on is installed.




    > The Disks utility provides a summary of how partitions are currently set up.'
