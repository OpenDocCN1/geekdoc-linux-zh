  md: '# # Headless setup


    One way to manage your host PC''s resources to run your headless virtual machine.
    Another is to create VM on the host PC, access it remotely via the Remote Desktop
    Protocol (RDP). First, make sure you have the VirtualBox Extension Pack installed.
    You''ll need to enable the port via Settings -> Remote Display by changing the
    default port (3389) if you''re using multiple VMs in this way—unique ports for
    each one.


    Once it''s configured, you can run the VM from the terminal via one of two commands:


    ```

    VBoxManage startvm "VM name" --type

    ```


    Alternatively, hold Shift while clicking the VM in VirtualBox Manager, you''ll
    be able to monitor its progress from the Preview window before switching to your
    remote computer.


    When you access your Rdesktop client from another PC VirtualBox is built into
    most distributions, but VirtualBox also comes with USB redirection, which grants
    you access to USB devices plugged into the PC you''re at. Use the following command:


    ```

    ssh user@vm_ip_address -L 3389:localhost

    ```


    > > Run your VM headless to reduce usage if you use it to access it remotely.


    be sure to leave enough for your PC''s other tasks (considering the running of
    virtual machines)


    The best option is to create a virtual hard disk. This starts as a single file
    that represents your guest''s drive, and will work with snapshots. When starting
    with snapshots, create a virtual hard disk and click next. You''ll then need to
    set its size, location (click the lower button to choose a different location
    from the default), type and how the file will be. For later, the options of ''Fixed
    size'' and ''Dynamically allocated'' will ensure that the file containing your
    virtual hard drive''s contents stays small and grows only as it fills. Click ''Create''
    and your virtual machine is ready and waiting for action.


    # # Virtual hardware acceleration


    It''s important to enable acceleration when using your virtual machine, but while
    the basic settings are in place, you should take the time to ensure it has all
    the power and resources it needs to function as you want it. You can change these
    settings later, but the best time is to set them up early.


    Select your virtual machine and click the ''Settings'' button. Switch to the System
    tab, where you''ll find three: Motherboard, Processor and Acceleration. You can
    also increase the memory from the Motherboard tab, but without a switch, unless
    you need PCI support the support should be de-PIX which can be found in the Processor.


    The Guest Extensions should already be set up in the OS you''ve chosen, but if
    you''ll need to install them, check ''Enable EFI''. Here, note, that only works
    for Linux and OS: Windows guests aren''t supported.


    If you have more than one CPU installed, you can allocate more to your VM, making
    sure you don''t allocate more than your processor physically allows (Hyperthreading
    might be discounted). You may also need to tick ''Enable PAE/NX'' if your virtual
    machine needs access more than 4GB of RAM on a host with an 32-bit processor.


    The Acceleration allows to tap into the processor''s virtualisation features if
    they exist—see the tip below.


    # ## Other settings


    Switch to the Display tab to configure your virtual graphics card. Start by allocating
    video memory, which you''ll need. Check ''Enable 3D Acceleration'' if you want
    to improve performance across all your VMs. If you''re using the Remote Desktop
    Protocol if you like to access your VM remotely, it is also recommended to enable
    your VR screen as a window if you want to do so—the features require the VirtualBox
    Extension Pack, which we''ll talk about later.


    Switch to the Storage tab where you can configure the internal storage of your
    virtual PC—by default your hard drive is added to a SATA controller, from where
    you can also add a SATA drive. If you need to boot from a DVD, switch to the IDE
    controller and click the Optical drive button to select a physical drive or an
    ISO image as a virtual drive. Tick the ''Floppy'' option if you''d like to write
    disks, then just click OK to save your encrypted ISOs.


    The options in Audio and Serial Ports are all self-explanatory, but you might
    need join your guest VM


    ![](img/f2b72995a1be50e1613a2c5b8b47f2e9_106_0.png)


    > ### Tip Make use of the VirtualBox Manager groups to organize your VMs into
    categories: right-click the first one in the ''group'' header and choose ''Rename''.
    This helps manage machines directly from one group or de-attach them to the group


    > > To take snapshots of your virtual machines makes them particularly suitable
    as test beds.'
