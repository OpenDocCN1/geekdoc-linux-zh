  md: '# # Files: File permissions uncovered


    Take a deep breath and launch into the murky world of users, groups and peers
    in Ubuntu.


    ![](img/f2b72995a1be50e1613a2c5b8b47f2e9_95_0.png)


    If you''ve migrated to Ubuntu, you''re already having an think about file permissions
    and users, plus the one you has on the other; but it can still be a confusing
    subject to grasp, particularly where Linux is who''s gone into the confusion of
    who''s got access to which file, acquaint yourself with the essentials of file
    permissions.


    There are three levels of access to files in Linux, and while they differ between
    files and folders, they follow the same broad principle: read, write and execute.
    Access to any or all of these permissions can be granted or blocked. Read typically
    means viewing a file or looking at the contents of a folder, while write allows
    you to edit a file, or - in the case of folders - create or delete that are inside
    it. Execute allows users to run files that are executable programs, or actually
    enter the folder.


    # Grasp the fundamentals


    Despite appears to the contrary, every single thing in Linux is a file including
    hardware and devices. On top of this, the file system ext3 or ext4 - applies special
    permissions to files that ultimately determine how they''re accessed, and by


    These three levels are expressed as (r) read, (w) write and (x) execute. A file
    with all permissions is rwx, while one that read-only is r--, and another that
    has read and execute access is rx-. These terms r- and rwx- are important because
    they''re displayed when you view


    # Exploring Nautilus''s file permissions interface


    | Name | Owner | Group | Permissions |

    |---|---|---|---|

    | document.txt | user | group | rw-r--r-- |

    | image.png | user | group | rw----- |

    | script.sh | user | group | rxr-x-- |

    | folder | user | group | rwxr-x |


    # ### Owner


    After restricting when through Nautilus that you can only view a file or folder''s
    owner through the Permissions tab.


    # ### Change group


    Click the ''Group'' dropdown to see a list of available user groups on your system
    - refer to hidden users, so this


    # ### Access rights


    If you''re not the owner of a file or folder you can view permissions, but can''t
    change them - in Nautilus or the Terminal.


    # ### Execute


    This box only requires ticking if it has a run or .bin file extension, or if you
    want to run a file as script. It affects the permissions for all users.


    # ### Change access


    Click here to change the access level - you have options in Nautilus. The three
    options for folders translate to r--, rx-, and rwx respectively.


    # ### Enclosed folder


    This button will apply the same permissions you set for the folder all files inside,
    ensuring they stay consistent.'
