  md: '# POP3 vs IMAP


    There are two ways to receive email: POP3 (Internet Access Protocol) downloads
    messages to your computer and (usually) deletes them from the server. It''s the
    classic method, and good for using a single machine or with a security-conscious
    bent: if mails stay on the server it''s going to be bad for them to be tied up
    soon. There are big disadvantages when using POP3 on multiple machines - since
    it''s a one-way transaction, there''s no synchronization between messages you''ve
    read or replied to, and your systems won''t match.


    IMAP is a two-way protocol, probably the better choice: your provider will match
    all deletions between the server and your mail client, meaning you can use the
    same account on multiple machines - indeed web and Thunderbird at the same time
    while keeping things synchronized.


    database; however you may have to fill in the blanks yourself. Your ISP or provider
    will provide the appropriate information, but they can''t tell you what to put
    here because every ISP is different. You can choose whether to use POP or IMAP
    with your account - see the box below for more details on each - and it you. You
    may have to use your email account in a different window if you only have to Thunderbird.


    A quick note for Gmail: if you have Google''s two-factor authentication (and you
    should), you will need to generate an specific password and use that rather than
    your usual password, to log in to Thunderbird.


    # Split personality


    Thunderbird by default list your email account and its folders on the left, and
    have a window on the right split into two: the top pane contains the contents
    of the selected folder, and the bottom pane shows the message you''ve selected.
    Click any message to select.


    Thunderbird will download all of your mail from the server (this could take a
    while) and, if you''re using IMAP you should check the status of your messages.
    The inbox view displays messages in date order at the oldest, but you can quickly-sort
    your messages by clicking the column header at the top.


    Click the message and it will open in the bottom pane of the window. If this is
    a bit small, just move the mouse over the bar between the panes and give it more
    space. Or double-click the message to open it up in a tab of its own, giving you
    the full height and width of your Thunderbird window to play with.


    # In the book


    When you have a message, you''ll see all the email functions (reply, reply all,
    forward) etc linked to the top of the window, and you can use the Write button
    to fire a new mail. If an email includes embedded images from the internet, you''ll
    at least initially, see a bar with


    ![](img/f2b72995a1be50e1613a2c5b8b47f2e9_56_0.png)


    Preferences Thunderbird is restricting these images, unlike plain email, senders
    can use images to inform you whether you''ve read the message. Preferences and
    you can choose to view images in your header, but for messages from that address
    or to the main room Content Preferences where you can choose to show them all.


    When you''re creating a new message, you might discover that Thunderbird doesn''t
    have an account to start with unless you have been using one before manually importing
    your account (Tools > Import) to get this done. The process is going to be different
    but it''s not impossible.


    Different versions of Outlook have the export options in slightly different menus,
    but you should find them somewhere within the File menu. Make sure you export
    your messages as Comma Separated Values, or .csv, as Thunderbird is able to accept
    this format. In Gmail, select the messages from the top section of the main list,
    then click Export to


