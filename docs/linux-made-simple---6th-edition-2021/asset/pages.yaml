  md: '# Take a snapshot


    Your VM is now set up and ready for action. It should work exactly the same as
    any physical machine, but it has one crucial advantage: snapshots let you take
    one click backups of your VM at a specific point in time. You can then proceed
    to use the knowledge you''ve gained and roll back to the snapshot and all the
    changes you''ve made.


    When should you take a snapshot?\ VirtualBox starts snapshots. You can take a
    snapshot while your machine is powered off, or during using — just select Machine
    — Take Snapshot to do. Give your snapshot an identifiable name, and add a description
    of why you need it, then click OK.


    When you take a snapshot, VirtualBox starts recording the changes to a different
    file. If you delete a snapshot, those changes are merged back into the main file;
    if you roll back to the original (or the base image), all those changes are lost.
    To create an additional snapshot, move between them, and to create multiple snapshots
    within a single set.


    # Terminal use


    VirtualBox may be a convenient way to start with virtualization, but once you''re
    up and running you''ll be pleased to find a number of command line tools that
    work better for you. You can even bypass the graphical VirtualBox Manager if you''d
    like to run VirtualBox from the command line, such as createvm or startvm, and
    then there are a number of tools you should take close


    The first is VBoxSDlm — if you''d like to launch your VM in a ''pure'', distraction-free
    environment (with no controls of the default VirtualBox window), this is the tool
    for you. And its usage is pretty straightforward:


    ```

    VBoxSDlm --start <name>

    ```


    ![](img/f2b72995a1be50e1613a2c5b8b47f2e9_108_0.png)


    Replace <name> with the name of your VM (or its ID) if you prefer. If it''s not
    running, you''ll only have access to the menu commands bound by the VirtualBox
    window, but some shortcuts will help you. For example, press [Ctrl+right] [F6]
    key to take a snapshot. Press [H] to control the ACPI power, to pause and resume;
    use [Q] to reset. If failed, press the host key and let the guest shut down your
    VM using the VirtualBox manager — or just use the command to initiate the ACPI
    power button:


    Another handy command line tool is VBoxHeadless, which enables you to run your
    virtual machine headlessly. To do this — and access it remotely — use the VBoxManage
    --setup command.


    Whether you want to use VirtualBox from the command line or GUI, you''ll find
    it packed with powerful and useful features that will carry you to the possibilities
    and freedom of virtualization. How would you ever have copied before!


    ![](img/f2b72995a1be50e1613a2c5b8b47f2e9_108_1.png)


    +   Remove the desktop environment and run your guest in distraction-free mode
    with VBoxSDL.


    # Extend the size of your VM


    ![](img/f2b72995a1be50e1613a2c5b8b47f2e9_108_2.png)


    # Consolidate snapshots


    If your VM contains snapshots, the resizing process will affect only the original
    image. To resolve this, right-click the VM and choose settings, then add ''old''
    to the end of the list. Click ''OK'', then right-click the VM again, and choose
    this clone time. Then click OK. ''Expert Mode'', then rename and verify that ''Full
    clone'' and ''current machine state'' are selected before ''clone'':


    # Resize virtual disk


    Close VirtualBox, open terminal and the folder containing your VDI file. Use the
    following command, resize drivevdi with the path of your particular VDI file:

    VBoxManage modifyvdi "drivename.vdi" --resize 10000


    The size figure is in MB, so 10000MB is 10GB.


    # Extend partition


    The drive has been resized, but you will need to partition it. Boot your VM having
    attached an ISO of the Gparted Live CD and then use it to expand the partition.
    You may have to extend the extended partition first, then move the swap volume
    to the end before resizing the partition from the left to make the space.


