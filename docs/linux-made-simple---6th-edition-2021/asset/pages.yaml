    Sharing files between PCs on your network is a fundamental function of modern
    computing, and the good news is that Ubuntu makes file sharing relatively straightforward.
    Thanks to its support for the SMB (also known as Samba) sharing standard. Ubuntu
    works with other computers — Linux, Windows and Mac — so


    Connecting to other computers is as easy as opening Network — after a short pause
    you should see all visible computers on your network. Windows Network allows you
    to browse your network (workgroup) for existing Windows shares.


    Double-click on a computer, and if it has a shared folder you will be prompted
    to enter your username, password to access it. The data be safely ignored in most
    users — the username and password will need


    to match a profile set up on your target computer (typically your owner profile
    on that computer). If you''re connecting to a public folder, leave the username
    and click Connect. You''ll be able to connect anonymously — select this.


    It''s simple and Connect, you also get an option to save your credentials for
    the next time you connect — choose carefully here (the tip box). Once connected,
    the shared folder works like other you can easily drag files from your PC and
    you can copy files into that folder


    It is incredibly straightforward, but note that the path to the shared folder
    is lost each time you restart your computer or log out to manually log in again
    in order to connect to it. You may want to save some time when connecting frequently
    to a shared folder to create a bookmark in Files. Simply right-click the shared
