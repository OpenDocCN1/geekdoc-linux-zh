    what you want. A big advantage is that Arch has a community of experts who provide
    the latest software before anyone else


    ![](img/f2b72995a1be50e1613a2c5b8b47f2e9_12_1.png)


    ### Ubuntu

    www.ubuntu.com

    Perhaps the most popular – or the least known – Linux distro in the world. Ubuntu
    was born to create an easy-to-use distribution that would be suitable for everyone
    and anyone. Over the years, the number of spin-offs has grown rapidly. Ubuntu
