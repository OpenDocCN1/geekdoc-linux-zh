  md: '# Thunderbird:

    Email made easy


    Set up your new desktop email client and keep your messages and contacts close
    at hand.


    Email is one of the internet''s oldest technologies. It floods the world, it instant
    messaging and even outdates its predecessor, Arpanet. So often the innovator in
    the fields, started using software like Mailbox and Snowfox to leave messages
    for each other in 1985. The @ symbol was introduced to network computing during
    the development of Arpanet in the early 70s. By 1975, 75% of all Arpanet traffic
    was military was, and then we can reasonably give credit to email for inspiring
    the earliest development of the internet: it was a closed technology that couldn''t
    wait to be opened.


    We''d suggest starting on having at least one email address, and if you''ve been
    for a while probably have many. While many email accounts have some kind of web
    interface for accessing and sending messages, it is argued that this may not be
    the easiest to manage if you lose your connection: your inbox, stored entirely
    online, will be completely inaccessible. So many of us rely on old messages to
