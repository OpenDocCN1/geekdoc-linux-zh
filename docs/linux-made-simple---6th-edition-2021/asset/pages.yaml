    Shotwell will also index tags and location to find a picture by selecting a single
    image or searching for [Ctrl+T]. It''ll make it easier to find a pic later.


    There are a few features to master in photo applications, one of which is the
    ability to tag photos with a star or a rating. You can do this by right-clicking
    on an image and selecting a rating or it. This is particularly useful if you''ve
    taken a lot of photos on a day, since you can pass through the thumbnails to figure
    out which ones you want to keep. Go to the View menu at the top of the screen
