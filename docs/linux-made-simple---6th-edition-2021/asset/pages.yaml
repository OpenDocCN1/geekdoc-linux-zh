  md: '# # Linux distro guide


    A tantalising list of the many flavours of Linux...


    In the Linux world, because it''s free software that can be redistributed by absolutely
    anyone, this has led to a proliferation of different versions of Linux. These
    distros can be thought of as having common uses,


    from hardcore Linux geeks to servers, science editing and so many more. The majority
    are general-use distros, which aim themselves at different types of users, such
    as beginners and power users;


    those with older PCs and people who want fancy interfaces. The choice can be bewildering,
    so to help you get started if you''re interested in finding out about Linux, here''s
    your rundown of the major distros:


    ![](img/f2b72995a1be50e1613a2c5b8b47f2e9_12_0.png)


    ### Debian

    www.debian.org

    One of the older distros on the block. Debian is also technically the father of
    many modern distros, including one of the most popular in the world – Ubuntu.
    Debian can be thought of as a bare-bones distro, it comes with just enough to
    install and run it, but it''s very stable and has complete repositories of software,
    which makes it very easy to verify


    ### Red Hat

    www.redhat.com

    It''s highly unlikely you''ll come across Red Hat as a used distro, but there
