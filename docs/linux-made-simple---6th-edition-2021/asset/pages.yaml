  md: "# # Pidgin: Instant messaging\n\nConnect with your friends in a network-neutral\
    \ way and stay chatting to your heart's content.\n\nInstant messaging has had\
    \ a huge impact over the past decade, but it's far from a modern concept. We can\
    \ actually trace digital messaging back to the 1980s when internal multi-user\
    \ systems like the MIT contained their own instant messaging system. The first\
    \ one was invented by Ibbquare in 1990. Quantity (and very much reflecting its\
    \ place in time) they called CB Simulator - and if you've ever used a IRC chat,\
    \ you've seen how great that was.\n\nMore recently, ICQ (started in 1996) really\
