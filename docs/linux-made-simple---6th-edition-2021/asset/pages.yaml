    # ## Linux From Scratch


    Rather than a distribution, Linux From Scratch - popularly called LFS - is a free
    availability of scripts to create your own custom distro from scratch entirely
    from source. The project was started in 1999 by Gerard Williams who wanted to
    learn how a Linux distro works behind the scenes. While building his system from
    scratch, he wrote down the steps and released it as a HOWTO (pictured: right)


