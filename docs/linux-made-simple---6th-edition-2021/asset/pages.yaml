  md: '# # Install apps in Mint


    # ## How to find and add new repositories to discover.


    **Now** that you''re up and running in Mint, you''ll be starting to make productive
    use of it. Naturally involves running applications and utilities. Start taking
    an inventory of the software you need in Windows and checking the website for
    each to see if Linux build exists. If there isn''t one, don''t panic – you''ll
    find the vast majority of Windows applications have an equivalent for Linux. Still,
    many of them are free and open source, so you won''t need to splash it out of
    them, or do not donate to them.


    The most obvious place to start is your suite office. When it comes to replacing
    your word processor, spreadsheet, database and presentation tool, you''ll find
    that they are already included in Mint via the free LibreOffice software, which
    can be found under Menu -> Office.


    If you''re looking for a specific open source alternative to your target software,
    search SoftwareWhere where you''ll find it at http://www.esoft.com or find other
    resources as well. If you can''t find anything, try http://alternative.net/.


    The simplest way to adapt and use software in Mint is through the Software Manager.
    It is a user-friendly front-end for finding and installing programs. Programs
    are organised into ''repositories'' (or repos) if your target program is in the
    repos supported by the Software Manager otherwise you''ll find alternative ways
    of getting them. First, visit the program page – here you may be offered offered
    a convenient downloadable installer in the form of a


    ![](img/f2b72995a1be50e1613a2c5b8b47f2e9_21_0.png)


    +   * Manage your repositories through the Software & Updates tool, which you''ll
    find in System Settings.


    Deb package – choose the 32-bit or 64-bit download (if) to match the version of
    Ubuntu installed. Once downloaded, navigate to your Downloads folder, double-click
    the file to install. Other programs may require you to install them via Terminal.
    This usually involves adding the program using the following command:


    ```

    sudo add-apt-repository name

    ```


    The ppa: stands for Personal Package Archive, which is a special repository –
    general for Ubuntu – that anyone, or a software team, can establish for publishing
    software packages. If you want to share your software, use ppa:name with the name
    provided by the software provider.


    Once done, you can then install packages from the repo as you''re already used
    to it, either through the Software Manager or if you''re using the terminal, with
    the following command:


    ```

    sudo apt-update && sudo apt-get install program

    ```


    Replace <program> with the name of program and it will be downloaded and installed.
    Once added, you can manage all repos via Software Settings :


    # ## You’ll find the vast majority of Windows applications have an equivalent
    for Linux


    # ## Popular alternative applications


    | Windows app | Alternative | How to get it |

    |---|---|--|

    | Word, PowerPoint, Access | LibreOffice | Pre-installed |

    | Publisher | Scribus | Software Manager (SM) |

    | Photoshop | The GIMP | Pre-installed |

    | Windows Movie Maker | OpenShot | Software Manager |

    | Adobe Reader | Document Viewer | Software Manager |

    | iTunes | Amarafok | Software Manager |

    | Windows Media Player | VLC Media Player | Software Manager |

    | Internet Explorer | Firefox, Chromium | Pre-installed or SM |

    | Outlook/Windows Live Mail | Thunderbird | Pre-installed or SM |

    | Skype | Pidgin | Software Manager |


    # ## Stay up to date


    Programs you install through repos – either via the Terminal or Software Manager
    – check for updates on a daily basis, within 10 minutes of your first boot and
    keep them updated. That will ensure you have the latest for the vast majority
    of programs, but you can manually check only one or two of them. The first method
    is Cinnamon: Menu > Administration > Manager and click on Preferences > Refresh
    tab to change the time between update checks (days, hours and minutes are supported).


    To check for updates via the Terminal, type apt-get update. You may find that
    some programs in the Software Center aren''t up to date as they are posted on
    the program’s website – by adding the latest version of the repos, you can ensure
    it is installed, and gain access to beta and other pre release builds.'
