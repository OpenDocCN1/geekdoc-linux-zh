    # Working with USB drives


    Ubuntu is not happy to work with USB storage of any nature—and USB drives are
    treated equally and accessible, so long as it is formatted using a suitable file
    system. Ubuntu ships with built-in support for FAT32 and NTFS file systems and
    each file system—once mounted—you can read and write to the drive like any other.


    Large drives—64GB or bigger—are occasionally formatted in the ext4 format. So
    support for ext4 is not included in Ubuntu, but you can easily add read/write
    support by opening the Software Centre and searching for ''ext4-utils'' then install
    ''ext4-utils''.


    USB drives are registered in the same way as hard drives—open Disks to confirm
    the identifier for your drive. To see where your drive is mounted, run `lsblk`
    or `df -dev*` depending on how many drives are connected. When you attach these
    drives, their identifiers aren''t constant. They are assigned on a first-come,
