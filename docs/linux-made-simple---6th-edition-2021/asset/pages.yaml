  md: '# Mount Android


    I have bought a new Samsung Android tablet and I''m trying to mount it with Linux.
    But there''s a catch, isn''t there? I can''t mount it as a USB device. Android
    phone pops up a dialog when I plug it into the USB port of my computer and tells
    me it doesn''t work like that. Where have they got rid of a perfectly reasonable
    storage system and how do I get my files on now?


    The trouble with the USB system is that it''s a mass storage. This means that
    when you mount it on your computer as a mass device, it has to be unmounted from
    the phone. That''s where your message on lost might be stopped. If there''s an
    error like something like the Neus, 7 where there''s no way to re-mount - you
    can''t find a filesystem in use by the OS. Newer Android devices use MTP (Media
    Transfer Protocol) instead of MSC. There are few options for MTP devices under
    Linux, all implemented as FUSE. I prefer jmtpfs. To mount the device you found
    - create a mount point - pass jmtpfs the name of the point. This directory exists
    and is writable by the user running the following:


    ```

    jmtpfs ~/android

    ```


    Now you can access the contents of the device while it is mounted. When you are
    finished, unmount it with fusount -u ~/android


    # Remote desktops


    I want to access the desktop of my computer from another, using the remote desktop
    features of Linux.


    You have two options. For a complete desktop you can use VNC. If it''s not installed
    by default, then install TigerVNC or VNCpackage (the server on the computer you
    want to access). You run the server on the remote computer; the first time you
    will be asked to set up a password. Then run the client on the other computer,
    giving the address of the first computer.


    If you only want to run a single program from the remote computer on your local
    desktop, VNC can be overkill


    and the X display of Linux already allow network forwarding. You need to set up
    SSH on the remote computer - just install the ssh-server in the usual way. Then
    you can connect from the local machine:


    This will ask for your password and then give you a session on the remote computer
    - you can then run whatever you want. Press Ctrl-D to log out, then run a graphical
    program like: ssh -Y username@hostname program


    It should work fine for you. Depending on how your distro is set up SSH, you may
    find X-1 better. If it works, check /etc/ssh/sshd_config and X11Forwarding


    Incidentally, if you use the same username on on both computers, you can leave
    out and just ssh username@hostname


    # What''s my address?


    I''m running a Raspberry Pi without keyboard or mouse. I plugged it into my network
    but I don''t know its IP address. So I can''t SSH into it.


    If your device gets an IP address from a DHCP server, you can configure the server
    to give a static address to a hostname. Plug the SD card into your computer and
    edit /etc/dhcp.conf on it to set that hostname and the static address. Alternatively,
    install avahi-daemon locally and run it like:


    ```

    ip addr eth0 | grep 192.168.1.19

    ```


    With that network interface and IP you can find your device by network. It will
    then show up as ''hostname'' so you can find it without an Android device, install
    Filez. Once you have the MAC-address, you can find it by running ''ofing'', which
    you can use to tell your DHCP server which address to give it. Raspbian prints
    the IP address to /etc/local when it boots. You could also to modify this to enable


    MTP is the new way of connecting to desktops, and it means you can keep using
    the device while it is mounted on your desktop.


