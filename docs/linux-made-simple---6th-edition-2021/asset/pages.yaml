    and looking for terminal using Ctrl+Alt+T in desktops like Ubuntu, Gnome or Xce,
    if you have a fancy graphical front end. The main commands are as follows:


    +   * **apt-get** Installs, updates removes packages

    * **apt-cache** Searches with the repository index, files as search

    * **apt-add-repository** Adds repositories to the system.

    * **dpkg** A lower level package management command.


    These commands require root (superuser) access. To access the root of the system
    you will stick with the sudo apt prompt here. We already mentioned that reports
    are appeared here, so the first thing to do is update your index files to match
    the contents of the repositories.


    apt-update


    This will make sure that your system is up to date. apt-get This lists the packages
    you want to install, it will tell you if you have enough space for the download,
    and then get on with the installation. When you want to install some new software,
    you will need to tell the exact name to install, you may want to search for it,
    here:


    apt-cache search gmail


    This will out a list of packages, which it searches by name and description, and
    lists items mentioning gmail, and there are a lot of them. To search only


    the names, or use --names-only: apt-cache search gmail


    The other way is far more manageable, but still a one line, perhaps too much to
    fit in your terminal. The solution is to pipe the output of this command to the
    program command:


    apt-cache search gmail | less


    The command is a pager - it reads text by page and scroll through it. It can be
    used with any program that generates lines of terminal output to make easier to
    read (see the Package management walkthrough). Once you have found the package
    you want, installation is as follows:


    apt-get install program


    You can install multiple programs by giving them all to apt: apt-get install program1...program2...


    Every program will tell you what you want to remove, so you can free up your hard
    drive by uninstalling it: apt-get remove program


    apt-get purge


    This command removes the program, but leaves its configuration files in place
