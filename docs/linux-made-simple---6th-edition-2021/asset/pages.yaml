  md: '# # Remote desktop

    An easy guide


    You''re over here, but the Windows PC you want is over there. What to do?

    Well, we have a solution: remote desktop connection.


    OS is never enough. These days most people – especially Linux enthusiasts – like
    to have more than one PC in their lives. Perhaps they have home servers, media
    boxes, laptops and take control of it.


    Enter remote desktop. This enables one PC to connect to another PC over a network
    (the internet) and take control of it. It is as if you were sat in the remote
    machine. Sound crazy? Gamers livestream their gameplay - all from the remote desktop!
    ^


    It isn''t a high security risk? Well, if you don''t use strong passwords and access.
    But we will explain ways to minimise the risks of the first. The which is not
    open to everyone but you.


    For accessing PCs on your local network we are going to use something called rdesktop.
    It is a free way to access your remote desktop, easily? - Open a terminal and
    type:

    aud apt-get-install rdesktop


    ```

    `sudo apt-get-install rdesktop`

    ```


    We''re ready to connect to your Windows PC. The client is ready to accept remote
    access. Ensure your Windows box is ready to accept remote access. On the Windows
    PC log-in, locate the Start Menu entry, right-click on it and select Properties
    > Remote Access > Allow Connection.


    It''s possible to tell Windows who can have access. Windows also uses users accounts
    and it''s most sensible to create an account for remote access with restricted
    access. However, it''s better if you have main administrator access, so will be
    by default the relevant privileges for remote access. You can use the Select button
    to add additional users to the list:


    +   * Users > Manage Local Users and Groups

    * Click on the list of users who are shown here. Double-click on the user you
    want to edit. Click > Add

    * User > OK > OK. Now you will have remote access to your Windows desktop.


    To give a standard user Remote access privileges should Start > Computer > Manage
    Local Users And now it''s easy to access your remote desktop system.


    We''re ready to connect from Linux to Windows remote. Using rdesktop from the
    terminal basic form looks like:


    ```

    `rdesktop <address>`

    ```


    It''s useful to add a couple of options to include screen resolution through `-w
    <width>-h <height>` plus a username with `-u <username>`. Also password with `-p
    <password>`. If you want colour, add `-depth 32` for 32-bit colour or `-depth
    16` for 16-bit. It is also possible to add fullscreen mode with:


    ```

    `rdesktop -u <username> -g 1280x720 -s 32 -p <password> <address>`

    ```


    You can also extend the screen, without and around the peripherals. For so just
    add `-full`. Getting graphical is optional. Windows RDP (Remote Desktop Protocol)
