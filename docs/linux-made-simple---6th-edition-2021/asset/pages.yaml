    also notice that the changes to the text are instant; it changes its size to 28pt,
    and it''s bold. Select the rest of the text and change its style to ''Body''.


    As you hover over the styles in the list, you might notice a menu on the right.
    However, hit that menu to select Edit Style. In the popup, the Autocomplete checkbox
    appears. We''re now going to highlight the main benefit of using styles rather
    than formatting fonts and sizes manually: changes will be reflected throughout
    your document, making everything consistent and clear. Use the tab key to change
    it to your liking, then hit Apply to your selection. Use the tabs to set up perfectly
    formatted lists, consistent highlights, drop boxes and much more. A more visual
    way of doing this, manually select the text you want to format, drag it to, then
    hover over your style in the drop box and select ''Update to match''.


