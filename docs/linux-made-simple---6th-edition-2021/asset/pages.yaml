  md: '# # Tweak dual-boot linux settings


    Discover how to switch between Windows and Linux


    When Mint installs itself, it changes the bootloader at the beginning of your
    hard drive to a program called GRUB Unified Bootloader. Put simply, Grub scans
    your drive for other operating systems and presents a boot menu, allowing you
    to choose between them. In cases specifically where Windows is installed after
    the Mint installer—this would be set up perfectly from the off. You start your
    boot menu, and if you don''t make a choice within five seconds, it''ll start to
    load Linux Mint.


    In the event of this you''ll want to know how to manage it. If you want to make
    changes to the boot menu—you might prefer to make the Windows OS default—you can
    edit this Mint entry by default. In the Terminal, but you''ll need to use a friendly
    tool to do the job (Edit your Grub menu box).


    ```

    sudo add-apt-repository ppa:yannubuntu/boot-repair

    sudo apt-get update

    ```


    When Boot Repair launches, we recommend following the recommended steps. The process
    however involves copy and paste some commands into the Terminal—use Shift+Ctrl+C,
    then right-click in the Terminal and paste—as well as following instructions using
    the cursor keys and space when selecting options, and Enter to proceed.


    Once done, reboot PC—hopefully booting Windows 10 and providing working options
    in the boot menu. Note that Windows might not be referenced if there is no entry
    for it in Grub, in which case you can recreate the entry using the Grub editor.


    If this doesn''t happen (but only offer to boot Mint), the repair may have been
    placed in your PC''s UEFI settings instead of Grub. Start your PC in the BIOS
    setup, but tap F12 if there is an option needed to access the boot menu. Select
    the preferred option—either Windows or Mint—OS. You can then choose which OS goes
    to boot by entering into your UEFI setup utility and changing the options Boot
    (look for a ''Hard Drive Priority'' section).


    If everything gets messed up, then simply restore your fail-safe backup using
    Redo Backup and start the installation process.


    # ## Troubleshooting Grub


    Unfortunately, if you don''t get what you expect: if the Mint installer didn''t
    detect your Windows installation and you were forced to manually partition your
    hard drive, you might find your boot entries to Mint with no sign of Windows.
    Don''t worry, you''ll need to perform some additional steps to make it accessible.


    First, you''ll need to boot into Windows 10 recovery media: to repair your PC
    then select Troubleshoot > Advanced options to repair Windows bootloader. This
    restarts, but leaves you with no to access Mint—to resolve this, boot from your
    Mint installation media, and follow the following commands:


    ![](img/f2b72995a1be50e1613a2c5b8b47f2e9_17_0.png)


    # ## Edit your Grub menu


    ![](img/f2b72995a1be50e1613a2c5b8b47f2e9_17_1.png)


    # ### 1 Install Customizer


    Open a Terminal and type the following commands:


    ```

    sudo add-apt-repository ppa:danielricher/2007

    sgrub-customizer

    sudo apt-get update sudo apt-get install grub-customizer

    ```


    Once done, launch Grub Customizer by clicking ''Menu'' and searching for ''Grub''.


    # ### 2 Change defaults


    Switch to the General settings tab. From here you can change the default OS via
    the predefined dropdown menu, or select ''previously booted entry''. You can also
    change the delay before the default entry is selected from this tab—until—''Boot
    entry after timeout'' to pause Grubrun until selected.


    # ### 3 Change Grub''s look


    To make a change to how Grub looks, switch to the Appearance settings tab where
    you can prettify the Grub by changing its colour scheme, font defaults and resolution
    (Note: the image needs to be...). When you''ve finished making your changes, click
    the ''Save'' button to update Grub.


