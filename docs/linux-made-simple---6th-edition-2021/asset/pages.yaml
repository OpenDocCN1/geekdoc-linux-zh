    There are other ways to perform the main functions of proper editors without shelling
    out a penny, but they''re limited in one way or another. So let''s look at a few
    of the tasks you might need and perform them for free.


    # ## Character Recognition


    OCR, or its less-known cousin, is the process of getting words out of pictures.
    If someone''s sent you a PDF of a scanned document, that''s what you''re dealing
    with a picture, just one in a nice package. In order to turn these into editable
    text, you''ll need to, in quite, take a pool of pixels to recognize what letters
    mean, then output that text.


    We''d recommend a little tool called gscan2pdf for this task. It''s great for
    any time you''ve been offered an OCR task - but it also has an OCR engine built-in.
    If you use it then hit [Ctrl+S] to run OCR. If it''s a bit messy, you might have
    to adjust the text on a string, otherwise the OCR engine in a single selection
    won''t work well. Only the OCR and your image should be adjusted properly.


    Now how to run the OCR process. Go to Tools > OCR. This is available in the free
    version too. It scans the document line by line, but rather difficult to run without
    some help - which is why gscan2pdf''s so useful. Click ''Start''. Click the OCR
    output tab, and then you''ll see the text you want. You can click problem words
    to correct them if you spot any issues. Hit [Ctrl+S] to save, and then out your
    PDF in the view of choice - which you can now select the text with your mouse
    and copy to your heart''s desire.


    # ## Money matters


    First, let''s look at the available options for Linux. There are two primary PDF
    editors on the market. PDF Student and Libre PDF Editor. The former comes in two
    flavors: Standard ($99), which can convert most documents to PDF, add annotations,
