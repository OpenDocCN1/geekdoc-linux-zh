  md: '# # Compression types


    There are two types of compression: lossless and lossy. Lossy compression achieves
    a greater reduction in file size by discarding unwanted data. JPEG and MP3 files,
    for example, use lossy compression. lossless returns the result to where you started.
    There are a number of lossless compression methods available, here are some of
    the most common:


    +   - **Gzip** Compression replacement is completely open and still in use. Gzip
    produces smaller archives than Zip with its default settings. It does not lose
    text and decompresses quickly, making a good choice when size is not the most
    vital consideration.

    - **LZMA** Replacement by Zip is old and not particularly effective, it is well
    and supported.

    - **Bzip2** Used in Linux compression programs. Its files have a Z extension,
    which you are unlikely to see in the wild. There are patent issues with it.

    - **XZ** This most recent program uses the LZMA2 algorithm also used by Zip. It
    works brilliantly. It is the compressor of choice for many Linux projects, including
    Coreutils and the kernel itself.


    ![](img/f2b72995a1be50e1613a2c5b8b47f2e9_142_0.png)


    compression, j uses bzip2 and J x uses compression. (The watchful)


    There are also versions of these things that make the commands more useful, but
    not all of them are as short as they hope. However, you have also used this line
    with me `tar --create --gzip --file file.tar.gz


    The file extension is not required, but it''s convenient that people can know
    what type of archive it is. For unpacking, it is simple of mapping of an archive
    with `-x` or `--extract`. You don''t need to specify the compression type, as
    tar figures out `tar xf file.tar.gz


    Another option you might want to add is `-v` or `--verbose`, to show what tar
    is doing. If you have to extract a tarball, you might want to use it. If you have
    created an archive, partially without unpacking it, you may want to check it before
    relying on it. The test option checks the integrity and lists the contents of
    the archive. `tar tvf file.tar


    There are other main tar options, but the program has many such as `A` or `--concatenate`
    to add files to an existing archive instead of creating a new one.


    # ## Future proving


    We mentioned that tar can change format because it places compression to another
    program. There are also gzip options to do this automatically, but what if something
    comes up with a new format? Perhaps something like de-super-compressor? You could
    create an compressed archive and then use tar to unpack it, but that is not as
    versatile as use a pipe.


    ```

    tar c | gzip > file.tar.gz

    ```


    Here, we have used only the `-create` option with tar. The reason is causes tar
    to send the archive data to standard output, which is what the pipe receives.
    The second command receives and decompresses the archive before sending it to
    tar.


