  md: '# # Tar: archiving your files


    Archiving contains many mysteries, such as zip and tarballs, but we are on hand
    to expand your knowledge of theirs.


    Most people reading this are probably pretty familiar with compressing, sending
    or receiving ZIP files. Zip takes a collection of files and stores them in a ZIP
    archive file. As well as storing the contents of the files, it stores metadata
    which is extra information associated with an object. In the case of files, it
    includes times, owners and permissions, and when you unzip an archive, all of
    this information is extracted. Archives has several uses, but the most popular
    one is binding up a set of files for download - a single file is easier to handle
    and the compression matters.


    Zip has several drawbacks. The main issue is that its compression is poor by modern
    standards. In 25 years, technology has grown to match Zip, even though there have
    been improvements and various alternatives. Another disadvantage of Zip is that
    it is intended for archiving a file, whereas sometimes we need to send the data
    to another device or service.


    The standard archival program for Unix-like systems is Tar, because Tar was originally
    used to store backup on tape drives (Tar Archive). It works in


    different way to Zip it sends all the archived data to its standard output and
    doesn''t compress the data by default. This is because tape drives already had
    hardware compression built in. The lack of compression might be a disadvantage.
    We can use Tar to get files into an archive format, and then use it like a compressor
    - even one that wasn''t existence when Tar was developed.


    Compression programs work on a stream of data and produce one compressed file
    or stream, so this splits the job into two parts: archival and compression. This
    may seem like more work but is capable of handling the task. We use one of these
    to refer to as a tarball.


    +   - tar f foo.tar

    - tar x foo.tar

    - tar z foo.tar.gz

    - tar j foo.tar.bz2


    The c option tells Tar that we are creating an archive and f tells it that we
    are archiving a file using the given name. Therefore, the first command creates
    an uncompressed archive which is called foo. The subsequent commands add an extra
    option to Tar: the particular type of compression to use .gz gzip


    # ## Pipes and streams


    A core philosophy of the Unix-operating system is to be specialised - each tool
    does one thing and does it well. This means we need a way to combine more complex
    tasks, by piping outputs of one tool to inputs of another.


    The | pipe connects and connects the standard output of one program to the input
    of another. Tar connects the contents of file and sends them to stdout, which
    is piped to the input of gzip. This compresses the contents without working on
    a file.


    ```

    tar cf - foo | gzip > foo.tar.gz

    ```


    This compresses a file to something.gz. If there is no file, it compresses standard
    input and sends the result to stdout. The > character performs redirection and
    redirects stdout to a file, so you get the compressed archive.


    Standard error is not redirected by >. If something goes wrong, error messages
    are printed to the file, so you wouldn''t know something was wrong.


    Running with the t (test) option only checks that the archive is correct, but
    also shows you the contents - usually enough for you to pipe it through a pager
    such as less.


    A terminal window allows the output to go to the same place, but all of these
    can be changed. The console is the output from the command running in a terminal.'
