  md: '# Drives: Identify and locate


    Where are those files? We look into how you can identify, access and locate the
    hard drives attached to your PC.


    If you''re migrating from Windows, you may find that Linux handles drives and
    partitions is of a culture shock. For starters, you''ll see lists of how drives
    are introduced – /dev/sda, /dev/sdb and so on. It may look bewildering, but it
    doesn''t take long to realize the Linux file system is just as easy to manage.
    We help you discover how to demystify and understand exactly how drives work within
    the Linux file system.


    installed, for example. Then any other hard drives are registered before moving
    on to external drives, which include both hard drives and flash storage (on the
    latter as optical drives – over the page).


    > Quick tip

    If you use USB drives they won''t always be assigned the same name – make sure
    to use the Disks utility to identify which drive has been assigned


    # Identify your drives


    # Partitioning


    Open the Disk Utility – use the automation to navigate it, making a note of how
    drives are referenced in a root folder /dev/ – and that they do. At the top (of
    root) you''ll see the dev folder, where device files hold special folders that
    Linux uses to identify the different pieces of hardware.


    So far – each drive is easy enough to identify. Many drives contain partitions
    – select drive sda and you should see a minimum of two partitions are displayed
    in the bar chart that provides a graphical representation of the disk''s size.


    Select your drive in turn and you''ll notice the partitions: they all refer to
    files "sda" with a letter after the number (e.g. sda1). The 2nd partition that
    you create is a supported storage, and the final letter identifies which drive
    it is.


    Partitioning is the act of splitting a single disk into multiple partitions. If
    you''ve come from Windows you''ve probably used everything on a single partition
    before,


    Linux adopts a different approach, identifying each drive using a combination
    of drive (sda), plus partition number (sda1). So on your first drive, "sdb3" refers
    to the third partition on the second drive, and so on.


    Linux is consistently in how it reports each drive: "sda" is easy to view on which
    Ubuntu is


    On the surface this makes perfect sense, but it always looks straightforward.
    Partitions are accorded to two primary schemes: GPT (GUID Partition Table) is
    found in new drives, MBR (Master Boot Record) is a popular choice for older systems.


    ![](img/f2b72995a1be50e1613a2c5b8b47f2e9_85_0.png)


    The difference between them is that the GPT scheme has no meaningful limit to
    the number of partitions you can create. MBR supports up to four partitions per
    drive. A modern Linux setup uses GPT.


    GPT drives drives according to the order they were created or identified. It follows
    a pattern from left to right, but it''s not always the case for: if you are using
    a manually partition file to sit at the end of your drive before setting up the
    system partition. It has no effect on how Linux operates, but can be confusing.


    > Drives are never always in the physical order in which they appear on your drive.


    The MBR approach throws up its oddly interesting anomaly when numbering volumes.
    Linux reserves "sda1" for physical partitions, with logical volumes


