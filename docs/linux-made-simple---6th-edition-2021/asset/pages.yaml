    > Quick tip

    nYou can set a signature to the bottom of all your outgoing messages in the Account
    Settings menu.


    ![](img/f2b72995a1be50e1613a2c5b8b47f2e9_56_2.png)


    > Use the button to determine which images you can see in your emails - you can
