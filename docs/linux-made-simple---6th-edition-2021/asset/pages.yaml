    # Go slow


    My computer seems to be running with one of its CPUs tied behind its back. What
    is going onnThe reason is likely that a process is hogging a lot of your resources,
    and the program to investigate this is called proc. Run it in a terminal and it
    will show you a summary of overall usage and list of processes. The third line
    will show your overall CPU usage, which will be something like this (on a lightly
    loaded system)


    ```

    %CPU:0.7, us:0.2, ay:0.9, mi:99.1, 0.0, bi:0.0, ai:0

    ```


    The first three rows show how your CPU capacity is being used, system and nice
    load. A task is running at one processor, if so the CPUs one or more are idle
    (low). The load average shows the amount of time your system might be running
    slow - if this is close to zero, you now know why your system is running slow
    - check the list of tasks to see which process is eating the most CPU. If the
    value is high, it means your CPU is waiting for I/O or has high disk activity.
    This could be a sign of a disk problem - read errors or a nearly full filesystem
    that has become fragmentated.


    If memory is full and swap is used, you lose performance. The task list is ordered
    by field. You can use F F to pop up a list of fields. Move the cursor over the
    field you want to sort and press S to sort. Press Q to quit the window. Press
    F allows you to list more than one screen of programs. If memory is low, this
    will help you find the greedy programs.


    # Lost password


    I reinstalled Linux and lost the same password, but I can log in with root. Is
    there a trick to reset my password?


    You can reset your password by booting from a CD/DVD - edit the disk Live System
    or your distro. The first step is to identify the partition where your distro
    is installed (this is the root filesystem for the distro home directory is not
    needed).


    ![](img/f2b72995a1be50e1613a2c5b8b47f2e9_132_0.png)


    If you have booted a live distro, check the available drives, along with a folder
    of suitable size to find the one that contains directories using bin and etc.
    Once you''ve mounted the partition, use mount it in /mnt/root to fix it:


    chroot changes the root directory to the path you give and runs the command following.
    This switches you to the root of your installed system and the Bash shell. now
    run:


    passwd username


    It will ask you for the new password and then write it to clear. Press [Ctrl+-C]
    to exit, reboot from your hard disk and now be able to log in again.


    # Killing processes


    On some be-edge versions of software or occasionally crashing, the window still
    stays open. If you close a window and program program like this can it run again?


    # “Most distros have a package that installs everything you need to build and
    install programs.


    For graphical programs, the simplest answer is kill which is usually installed
    by default. When you run it, your cursor changes to a shell and crosshairs, the
    next window you click will be focused clearly, along with your program, so you
    can see what went wrong.


    There are also line alternatives: kill takes an argument and kills. Kill does
    the same but with programs, so be careful if you have more than one copy of the
    program running. Send a TERM signal to defeat, add -KILL to the arguments to send
    the more forceful KILL.


    ```

    KILL -KILL programname

    ```


    If you want to use kill, there are various ways to find the PID using a lot of
    CPU or memory or it will show up in top, and you can kill it by pressing K. Otherwise,
    use pgrep:


    ```

    pgrep -f filename

    ```


    The -f options will show you the command line, so you can be sure you are killing
    the right.


    +   > Top gives over of resources used by your system as well as a list of the
    programs using the most.


