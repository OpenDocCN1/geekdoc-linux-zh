  md: '# # PDFs: Edit and annotate


    Portable may we edit PDFs, but be accessible? Without a little hard work and determination.


    We''ve all PDFs, haven''t we? They''re little document packages which contain
    all the fonts and layout information required to display exactly


    what the editor intended, without requiring any of the software to be installed.
    They''re usually, incredibly small. Now the name Portable-PDF is


