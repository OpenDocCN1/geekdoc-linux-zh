  md: '# Your first boot


    over your local network for sharing files and other resources, select ''Network''
    and change the settings to ''Bridged Adapter''. Other options are available here
    — NAT allows you to create a VM that can see and interact with others remaining
    invisible to the host. NAT networks are configured independently by VirtualBox
    File > Preferences (under Network).


    With your VMs set up, you''re ready to go.

    You need to point your virtual GD/DVD drive to an ISO (or optical disc) containing
    the OS you wish to install. Then start the VM and follow the prompts to start.
    Once running, your virtual machine acts exactly like your main PC does — click
    inside the window to capture your mouse and keyboard and release them when you
    want to work inside it. To release it back to your host PC, press the right-hand
    Ctrl.


    # Working with USB periph


    The USB tab is used to capture specific USB devices for your VM. However, before
    you can use this feature, you may need to add your username to the vbox group
    on your host PC using the following command:


    ```

    sudo usermod -aG vbox <username>

    ```


    Once this is done, your VM will be able to recognize VirtualBox. Note that VirtualBox
    supports only the USB 1.1 implementation by default, but you can install the USB
    2.0 and 3.0 extension pack (including PCI and USB host passthrough). Download
    this Extension Pack from www.virtualbox.org, but read the license before installing.


    You can easily connect USB devices within your guest by clicking the USB icon
    on the status bar window and select the desired USB from the list — but adding
    specific USB Folders makes it possible to automatically capture USB devices when
    the VM starts. One option is to share a folder between the host and the VM as
    a shared folder — it will allow the VM to connect to your host USB stick whenever
    it starts. You can check the Shared Folders tab in the ''Shared Folders'' data
    box, below which the User Interface allows you to specify which options are available
    to this guest.


    Installing your target OS in the guest will require you to install the Guest Additions
    — a series of drivers that enhance the VM''s performance. Guest Additions include
    better video support at resolutions and hardware acceleration, mouse pointer integration,
    which allows you to more easily move the mouse between host and VM without being
    captured, and for shared clipboard.


    Installing for Windows is as easy as selecting Devices > Insert Guest Additions
    CD image... After a short setup, the wizard will restart. Once the installation
    is complete, see chapter 4.2 for more details. If you''ve followed the process
    for other distro-based operating systems, find the Guest Additions CD in your
    file manager, open the window and choose ''Open''. In the terminal window, the
    following command will install it:


    ```

    sudo /media/VBoxLinuxAdditions.run

    ```


    After rebooting you will be able to resize your VM window to desired resolution
    by simply clicking and dragging on the Displays tab panel when you''re trying
    to fix the dimensions as you resize.


    # Share data


    Getting data to and from your VM is a critical part of virtualisation, and the
    easiest way is to set up a bridged network as described earlier, then use shared
    folders which you can swap-data over your network, but there are other ways to
    provide it.


    You don''t have to use the network, however. To make folders available from your
    host without sharing them on the network, use your VM''s settings and go to the
    Shared Folders tab to select or specify a folder on your host to make it available
    to your guest: click the plus button, select the folder you want to share and
    change its display name. You can also make the folder accessible only when you
    need it by checking ''Make Auto-mount'' when the VM starts, and last but not let
    the folder persist throughout the VM session.


    Open the Devices menu and you''ll find two other ways of sharing data: Shared
    Clipboard allows you to share the clipboard between host and guest (this can be
    limited to one-way-sharing, or bi-directional). You can also implement Drag-and-Drop,
    another way to quickly share files between host and guest by dragging files into
    and out of the guest machine window.


