    OS, and testing others without exposing to hardware. Clonezilla can work with
    a large number of disks, partitions and filesystem types. virtualbox.org


    > Gufw has themes and preconfigured rules adapted to inexperienced users.


    ![](img/f2b72995a1be50e1613a2c5b8b47f2e9_34_8.png)


