- "# 计算机黑客工具：Linux 完整概述，包含 Linux Mint、初学者 Linux 入门以及 Kali Linux 工具\n\n\n\n![](img/00001.jpeg)\n\
  \n\n\n\n\n\n\n本书受版权保护。本书仅供个人使用。未经作者或出版者的同意，您不能修改、分发、出售、使用、引用或转述本书的任何部分或内容。\n\n\n\
  \n\n# 引言\n![](img/00003.jpeg)\n后续章节将为初学者详细讨论攻击技术。我们将介绍 Linux 以及有助于我们更好地理解 `bash`\
  \ 语言的命令。然后，我们将详细讨论属于 Kali Linux 的各种工具。现在，我们仅对攻击过程进行简要介绍，以便您在阅读此本书时能有一个良好的心态。\n\n\
  ## 黑客的类型：\n在我看来，黑客应该被分为两类：正面的和邪恶的。正直的黑客依靠自己的知识帮助系统管理员识别系统中的漏洞，并使系统变得完美；而邪恶的黑客则通过各种攻击技巧对网络进行攻击、入侵或其他对网络有害的活动。由于他们以不符合道德的方式行事，这些人被称为“破解者”（Crackers）而不是黑客。\n\
  \n无论是哪种类型的黑客，他们的初始学习内容与我们在书中讨论的相同，基本技能也是相同的。许多人问：“黑客在和平时期做什么做什么？”些人认为黑客是每天做重复工作的、无聊且机械的人类。但这仅仅是一种误解。黑客通常需要大量时间来学习。除了学习之外，黑客应该将他们的知识应用于现实世界。无论黑客从事什么工作，其根本目的无非是在实践中掌握他们所学的知识。\n\
  \n黑客的行为主要包括以下方面：\n\n**第一，学习技术：**\n一旦互联网上出现新技术，黑客必须立即学习并在最短时间内掌握该技术。这里的“掌握”不是泛泛的理解，而是阅读如\
  \ `rfc` 之类的协议，并深入理解该技术的机制。一旦黑客停止学习，他就就不再是一个黑客了。\n\n初级黑客想要学习的知识更加困难，因为他们没有基础或任何指导，所以他们必须学习大量的基础内容。然而，如今的互联网给读者带来了大量信息，可能会让初学者感到无所适从。因此，初学者不能贪心。他们应该尝试找一本属于自己的完整的教材，循序渐进地学习。很高兴你找到了自己的书，并将在几页后开始钻研。\n\
  \n**第二，自我伪装：**\n黑客的每一个动作都会被服务器记录，因此黑客必须伪装自己，使对方无法区分其真实身份。这需要高超的技巧来伪装其 IP 地址、使用跳板避免追踪并清理记录。它还包括干扰对方的线索并巧妙地避开防火墙。\n\
  \n伪装是黑客需要掌握的一项非常基础的技能。对于初学者来说，这是一个巨大的世界，意味着初学者无法在短时间内学会假装。因此，我不鼓励初学者仅凭自己的去学。在没有知识的情况下不要攻击网络，因为一旦你的行为被暴露，最终的伤害将由你自己承担。\n\
  \n**第三，发现漏洞：**\n漏洞是对黑客来说最重要的信息。黑客应该经常学习他人发现的漏洞，并尝试自己发现未知的漏洞，从大量漏洞中发现有价值且可被利用的漏洞。当然，他们的最终目标是通过这些漏洞来破坏或修复这些漏洞。\n\
  \n黑客对寻找漏洞的痴迷是无法想象的。他们的口号是“打破权威”。一个带有漏洞的程序对黑客来说就像一个节庆，他们喜欢破坏它以创建更多的后门。黑客在破坏事物中寻找乐趣。\n\
  \n**第四，利用漏洞：**\n对于正直的黑客，漏洞应该被修补；而对于邪恶的黑客，漏洞应该被用来破坏。黑客的基本前提是“利用漏洞”。黑客利用漏洞可以以下事情：\n\
  1. 获取系统信息：某些漏洞可以泄露系统信息，进一步入侵系统。\n2. 入侵系统：可以通过漏洞进入系统，或者获取服务器上的内部信息。\n3. 寻找下一个目标：胜利意味着出现了下一个目标，黑客应该充分利用漏洞寻找并入侵系统。\n\
  4. 做一些好事：正直的黑客会完成上述工作，或者通过漏洞通知管理员做一些维护安全的事情。\n5. 做一些坏事：邪恶的黑客会进行上述工作。如果他们需要，他们会在服务器上植入木马或后门供后续访问。\n\
  \n这只是对攻击的初步介绍，我们将在以后详细讨论。现在我们将开始学习 Linux。\n\n# 第 1 章：Linux 简介\n你将在本章中通过许多示例详细学习\
  \ Linux。由于 Linux 与 Windows 在各个方面的不同，学习 Linux 以及一些命令和文件系统是必要的。\n\n## 毕竟，什么是操作系统？\n\
  操作系统是运行在计算机上的基础程序。没有它，什么都无法开始。如果你在开车并想转向，你会使用方向盘，这允许你在各个方面变得灵活。\n\n[注意：本章节提供了内容……]\n\
  \n# 第 2 章：Kali Linux 简介\n[本章节提供了内容……]\n\n# 第 3 章：基础 Kali Linux 工具\n[本章节提供了内容……]\n\
  \n# 第 4 章：高级 Kali Linux 工具\n[本章节提供了内容……]\n\n# 第 5 章：无线攻击与渗透测试\n[本章节提供了内容……]\n\n\
  ## 为什么 Linux 重要？\n现在我们知道 Linux 是什么了，让我们谈谈它的用途。因为 Linux 内核非常小巧且精致，它可以在许多环境中执行，强调节能和低硬件资源消耗。Linux\
  \ 集成了许多优秀的软件（无论是专有的还是免费的），也非常适合目前的使用。传统的常见的应用大致分为企业应用和个人应用，但近年来云计算机制似乎让 Linux 更加强大。\n\
  \n### 企业利用\n数字化的目标是为消费者或员工提供产品信息（如网页），并跨企业数据（如账户管理）。\n\n### Web 服务器：\n这是目前 Linux\
  \ 最流行的应用。继承了 UNIX 的高稳定性传统，Linux 用于网络功能时特别稳定且强大。此外，由于 GNU 项目和 GPL 模型，许多优秀软件在 Linux\
  \ 上开发，且这些 Linux 服务器几乎是免费的。因此，作为 Web 服务器、邮件接收服务器、文件传输服务器等，Linux 绝对是最佳选择。当然，这也是 Linux\
  \ 的优势，也是它在程序员和网络工程师中流行的主要原因。由于对 Linux 服务器的强劲需求，许多硬件供应商在推出产品时不得不指定 Linux 发行版。\n\n\
  ### 关键任务应用（金融数据库、大型企业网络管理）\n由于计算机的高性能和低价格，金融大企业环境为了微调自己的机器，许多企业逐渐移动到兼容 Intel 的 x86\
  \ 主机。此外，这些企业使用的软件大多使用 UNIX 操作系统平台。\n\n### 学术机构的高性能计算任务：\n学术机构经常需要开发自己的软件，因此对操作系统作为开发环境的需求非常迫切。例如，哈理工大学等拥有非常多技能系统的机构，需要这种环境来完成毕业项目。示例包括工程中的流体力学、娱乐业的特效、软件开发者的工作平台等。由于其创建者是一个计算机性能迷，Linux\
  \ 拥有强大的计算能力，而且 Linux 拥有广泛支持的 `GCC` 编译器，因此 Linux 在这里的优势是显而易见的。\n\n## 为什么 Linux 比\
  \ Windows 更适合黑客？\n1. 开源：开源是指内容向公众开放的软件。如果你有技能，甚至可以对其进行修改并带有自己的特征进行重新分发。开源软件和操作系统帮助人们在技能方面不断精进。与\
  \ Windows 收取的大量费用不同，开源的 Linux 安装是免费的。\n2. 自由：黑客需要自由。Linux 反正也是免费。程序的内容是开放的，你可以自由移动。另一方面，它很容易被破坏，但也很有趣。自由是极好的。你可以根据喜愿进行调整，并自由定制自己或公司的需求。而且每次都是灵活的。而\
  \ Windows 在许多领域限制了用户。\n3. 服务器使用：Linux 不仅是免费的，而且轻量级，与服务器结合时效果良好。许多托管公司和网站使用 Linux\
  \ 作为他们的服务器，黑客遵循客户端模型攻击目标非常方便且灵活。\n4. 许多类型：Linux 最棒的一点是可以进行各种形式的选择，我们将在后续章节中详细解释。黑客可以使用\
  \ `Kali` 和 `Parrot` 等发行版。\n5. 轻量：Linux 操作系统非常轻量，与 Windows 相比，掉帧更少且运行更快。作为黑客，我们必须在不同的终端进行大量工作，这是重要的。\n\
  6. 稳定运行：然而，Linux 实际上运行得相当稳定。网络功能和安全被考虑得很周，因此轻松使用它是 Linux 的一个特性。\n\n## Linux 命令简介\n\
  Linux 是一种用于命令行界面的操作系统。当 Linux 创建时，Arch Linux 以其环境闻名，大多数基于终端。然而，在 Windows 之后，Debian\
  \ 系统流行了起来。\n\n[注意：命令章节极其重复并包含了乱码，如“2015 年 7 月 29 日发布的”……] 终端使用 `bash` 脚本和一些命令来无错误工作。以下是黑客应该熟悉的各种命令：\n\
  \n1. `ls`：`ls` 命令代表“list”，显示文件和目录信息。它是 Linux 中最常用的命令之一。在当前目录中：\n```\nls\n```\n2.\
  \ `cp`：`cp` 命令是“copy”的缩写，是复制文件的命令。下面是示例：\n```\ncp file.txt copy.txt\n```\n3. `mv`：`mv`\
  \ 命令是“move”的缩写，是移动命令。它移动文件和目录。例如，如果你想将 `secondfile` 移动到 `example` 目录：\n```\nmv secondfile\
  \ example/\n```\n4. `rm`：`rm` 命令是“remove”的缩写，是删除命令。它删除文件和目录。你只需要指定文件名。例如，在当前目录删除\
  \ `example.dat`：\n```\nrm example.dat\n```\n5. `echo`：`echo` 的作用是在屏幕上显示字符串。如果你在屏幕上看到单词，那就是这个命令：\n\
  ```\necho Jesus\n```\n6. `chmod`：在讨论这个命令的使用之前，我们需要了解一下系统的权限。什么是权限？权限由 UNIX 处理的文件和目录设置。可以根据所有者、组和其他类型设置访问是否可以执行、写入或读取。例如，如果你想设置测试文件夹中\
  \ `example.sh` 的权限让所有用户都有权限，如下：\n```\nchmod 777 test/sh\n```\n7. `find`：`find` 正是搜索命令。它搜索文件和目录。例如，要在目录中查找\
  \ `ram.dat`，你需要使用命令：\n```\nfind ./ram.dat\n```\n8. `cd`：在深入学习这个命令之前，有必要了解 Linux\
  \ 如何排列目录。目录对应 Windows 中的文件夹，而 Linux 基于分级结构，移动目录和工作目录。下面解释了不同类型的目录：\na) 当前目录：指向你正在工作的目录。\n\
  ```\ncd\n```\nb) 根目录：如果它是磁盘顶层的目录，则被称为根目录。\nc) 主目录：用户可以自由使用目录存储工作文档等。你可以与任何人共享它，或者你想系统地使用而不是随意使用，默认情况下，子目录（文件夹）对应主目录。从当前目录移动到\
  \ `example` 目录的命令如下：\n```\ncd example\n```\n9. `kill`：`kill` 是杀死运行进程的命令。它可以终止执行异常操作的进程。此外，它用于通过正则表达式停止给计算机带来负载的操作，例如：\n\
  ```\nkill 224\n```\n10. `ifconfig`：这个命令在进行无线攻击时非常有用。我们可以使用这些命令找到关于适配器、路由器和无线设备的很多信息。例如：\n\
  ```\nifconfig wlan0\n```\n11. `mount`：`mount` 是挂载或操作嵌入 Linux 目录的磁盘设备的命令。今天，磁盘设备被广泛使用，如\
  \ CD、DVD、蓝光光、外部硬盘、USB 内存等。在 Linux 中，磁盘设备被称为文件系统。它们所有的都可以配置与 `mount` 命令使用。它是 Linux\
  \ 系统中一个重要的命令。\n```\nmount\n```\n12. `ping`：`Ping` 是一个检查到网络计算机的连接路径是否正确连接的命令。黑客通常在初始阶段使用它来检查服务是否运行。\n\
  ```\nping\n```\n\n\n\n\n`crunch` 命令的常用选项如下。\n\n- `-o`: 用于指定输出字典文件的位置。\n- `-b`: 指定写入文件的最大字节数。该大小可以用\
  \ KB、MB 或 GB 为单位，但必须与 `-o` 选项配合使用。\n- `-t`: 设置使用的特殊格式。\n- `-l`: 当 `-t` 选项指定 `@`、`%`\
  \ 或 `^` 时，此选项用于标识占位符的字符。\n\n### (2) 创建密码列表文件并保存到桌面\n生成的密码列表最小长度为 8，最大长度为 10，并使用\
  \ `ABCDEFGabcdefg0123456789` 作为字符集。执行命令如下：\n\n```bash\nroot@kali:~# crunch 8 10\
  \ ABCDEFGHIJKLMabcdefghijklm0123456789 –o /root/Desktop/ \n```\n从上面的输出信息可以看出，将生成一个大小为\
  \ 659 TB 的文件，总共 661,552,638,197,716 行。执行上述命令后，桌面将生成一个名为 `generatedCrunch.txt` 的字典文件。由于组合生成的密码更多，因此需要很长时间。\n\
  \n### (3) 打开字典文件\n生成上述密码字典文件后，使用 `Nano` 命令打开它。执行命令如下：\n\n```bash\nroot@kali:~# nano\
  \ /root/Desktop/generatedlist.txt\n```\n执行上述命令后，将打开 `generatedlist.txt` 文件。所有使用\
  \ `crunch` 命令生成的密码都保存在此文件中。\n\n### rtgen\n`rtgen` 工具用于生成彩虹表（rainbow tables）。彩虹表是针对各种可能的字母组合的预计算哈希值的大型集合。彩虹表并不一定适用于\
  \ MD5 算法。有许多种算法，它可以快速破解各种密码。密码越复杂，彩虹表越大，现在主流的彩虹表通常为 100G 或更大。\n\n使用 `rtgen` 工具生成彩虹表，具体步骤如下：\n\
  \n### (1) 切换到 `rtgen` 目录\n执行命令如下。\n\n```bash\nroot@kali:~# cd /usr/share/rainbowcrack/\n\
  ```\n\n### (2) 使用 `rtgen` 命令基于 MD5 生成彩虹表\n执行命令如下：\n\n```bash\nroot@kali:/usr/share/rainbowcrack#\
  \ ./rtgen md5 loweralpha-numeric 1 5 0 3800 33554432 0\n```\n上面的信息显示了彩虹表的参数和生成过程。例如，生成的彩虹表文件名为\
  \ `.md5_loweralpha-numeric#1-5_0_3800x33554432_0.rt`；该表使用 MD5 哈希算法加密，并使用了字符集 `abcdefghijklmnopqrstuvwxyz0123456789`。\n\
  \n### (3) 排序彩虹表\n为了方便使用生成的彩虹表，使用 `rtsort` 命令对表进行排序。执行命令如下：\n\n```bash\nroot@kali:/usr/share/rainbowcrack#\
  \ rtsort md5_loweralpha-numeric#1- 5_0_\n```\n\n### John the Ripper\n这是一个著名的破解工具，用于破解密码和其他内容。Web\
  \ 攻击是攻击中最重要的阶段，你需要详细了解它以获得更好的效果。\n\nJohn the Ripper 有四种[破解](http://www.2cto.com/Article/jiami/)模式：\n\
  \n1. **字典文件模式（Wordlist Mode）**：这是 John 支持的破解模式中最简单的一种。你唯一需要的工作就是告诉 John 字典文件在哪里（字典文件是文本文件，内容每行一个单词）。它代表了尝试的密码，以便进行提取和破解。在“字典文件”破解模式下，你可以使用“单词更改”功能自动将这些规则应用到读取的每个单词，以增加破解几率。\n\
  2. **单破解模式（Single Crack Mode）**：“简单”破解模式是为那些使用“将账户作为密码”的懒人设计的。所谓的“使用账户作为密码”意味着如果用户账户是“John”，那么它的密码也被视为“john”。在“简单”模式下，john\
  \ 将使用密码文件中的“账户”字段来破解密码，并使用各种“单词更改”规则应用到“账户”上增加破解几率。例如，账户“john”将尝试使用“john”、“john0”、“njoh”、“j0hn”等规则更改来尝试密码。\n\
  3. **增量模式（Incremental Mode）**：这是 John 最强大的破解模式。它会自动尝试所有可能的字符组合并将其破解为密码。这种破解模式所需的时间非常长，因为尝试组合字符非常耗时，所以\
  \ John 会定义一些“字符频率表”来帮助破解。简而言之，这种破解方法是“暴力破解”，通过测试所有可能的密码组合来获得正确结果。\n4. **外部模式（The\
  \ External Mode）**：这种破解模式允许用户用 C 语言编写一些“破解模块程序”，然后在 John 中使用它们。事实上，所谓的“破解模块程序”是一个子声明。\n\
  \n\n\n\n\n### 说明\n显示在工作日志文件中记录的工作状态。\ni) 示例：`john –status:restoreParameters: -makechars:\
  \ [file name]`\n\n### 说明\n创建“字符频率表”。此选项将根据当前破解的密码生成“字符频率表”（注意：John 会将破解的密码记录在 `JOHN.POT`\
  \ 文件中）。如果指定的文件名文件已存在，它将覆盖它。此选项生成的文件可用于“增强”破解模式。\nj) 示例：`john –makechars:owncharsParameters:\
  \ -show`\n\n### 说明\n显示已破解的密码。由于“账户”（Account）数据未存储在 `JOHN.POT` 文件中，因此你应该同时输入相应的密码文件。\n\
  k) 示例：`john –show passwd`（如图所示） <img src=http://www.starkun.com/txtjpg/hacker.gif>\n\
  参数：`-test`\n\n### 说明\n测试当前机器执行 John 各种类型密码破解的速度。\nl) 示例：`john –test`（如图所示） <img\
  \ src=http://www.starkun.com/txtjpg/hacker.gif>\n参数：`-users:[-]LOGIN|UID` [,]\n\n\
  ### 说明\n仅破解特定“账户”的密码，例如仅针对 root 或 UID=0 的用户（如果你在 `LOGIN|UID` 名称前加上 `-` 符号，则反反之，表示你不应该破解该“账户”的密码）。\n\
  m) 示例：`john –i:all –users:root passwd`（如图所示） <img src=http://www.starkun.com/txtjpg/hacker3.gif>\n\
  参数：`-groups:[-]UID` [,]\n\n### 说明\n仅破解某个“组”中用户的密码。（如果你在 UID 名称前加上 `-` 符号，则反反之，表示你不应该破解该“组”中用户的密码）。\n\
  n) 示例：`john –i:all –groups:100`\n参数：`-shells:[-]SHELL` [,]\n\n### 说明\n与上述两个参数类似，此选项仅适用于所有可以使用\
  \ shell 进行密码破解工作的用户，忽略其他用户。（如果你在 `SHELL` 名称前加上 `-` 符号，则反反之，表示你不应该破解可以使用该 SHELL 的用户密码）。在指定\
  \ SHELL 时，你可以省略绝对路径。例如，参数 `-shells:csh` 将包含路径如 `/bin/csh` 或 `/usr/bin/csh`，但如果你指定\
  \ `-shells:/bin/csh`，则只包含 SHELL 名称 `/bin/csh`。\no) 示例：`john –i:all –shells:csh passwd`（如图所示）\
  \ <img src=http://www.starkun.com/txtjpg/hacker4.gif>\n参数：`-salts:[-]COUNT`\n\n\
  ### 说明\n仅破解“盐值”（salts）大于“COUNT”的账户密码，这可以让你获得更快的破解速度（所谓的“salts”是指以 UNIX 为基础的“密码”编码单元）。例如，你可以只破解某部分用户的\
  \ `-salts:2` 密码以获得更速度，然后在有时间时再破解剩余用户的密码 `-salts:-2`。\np) 示例：`john –i:all –salts:2\
  \ passwd`（如图所示） <img src=http://www.starkun.com/txtjpg/hacker5.gif>\n参数：`-format:NAME`\
  \ 和 `-savemem:LEVEL`\n\n\n\n\n描述：这两个参数与 John 的内部大脑有关，与漏洞本身没有直接关系，因此未作介绍。\n\nSnort\
  \ 是一款在 Kali Linux 中可用的开源软件，以其用 C 语言编写入侵检测系统（NIDS）而闻名。它支持 Windows 和 Linux 平台，我更倾向于\
  \ Linux 操作系统，因此学习了在 Linux 上研究 Snort。Snort 有三种运行模式，包括嗅探、数据包记录和入侵检测。\n\n## Snort 规则选项\n\
  \n所有的 Snort 规则选项都用分号 `;` 分隔。规则选项关键字及其参数之间用冒号 `:` 分隔。根据这种方法，Snort 中有 42 个规则选项关键字，它们可以帮助我们执行嗅探和记录数据包等各种操作。我们使用\
  \ Snort 能够做的事情是无上限的，因为它非常复杂且实用。\n\n- `Msg` - 在数据包日志中打印消息。\n- `Logto` - 将数据包记录到用户定义的文件，而不是记录到标准格式。\n\
  - `Ttl` - 检查 IP 头中 `ttl` 的值。\n- `Tos` - 检查 IP 头中 `TOS` 字段的值。\n- `Id` - 检查 IP 头中的分段\
  \ `id` 值。\n- `Ipoption` - 查看 IP 选项字段的特定编码。\n- `Fragbits` - 检查 IP 头的分段位。\n- `Dsize`\
  \ - 检查数据包负载大小的值。\n- `Flags` - 检查 TCP 标志的值。\n- `Seq` - 检查 TCP 序列号的值。\n- `Ack` - 检查\
  \ TCP 响应（确认）的值。\n- `Window` - 测试 TCP 窗口字段的特殊值。\n- `Iype` - 检查 ICMP 类型。\n- `Icode`\
  \ - 检查 ICMP 代码。\n- `Icmp_id` - 检查 ICMP ECHO ID 值。\n- `Icmp_seq` - 检查 ICMP ECHO 序列号的值。\n\
  - `Content` - 在数据包负载中搜索指定的样式。\n- `Content-list` - 在数据包负载中搜索一组模式。\n- `Offset - content`\
  \ - 选项的修饰符，设置开始搜索的位置。\n- `Depth - content` - 选项的修饰符，设置搜索的最大深度。\n- `Nocase` - 指定内容字符串不区分大小写。\n\
  - `Session` - 记录指定会话的应用层信息。\n- `Rpc` - 监控特定应用程序/进程调用的 RPC 服务。\n- `Resp` - 积极响应（断开连接等）。\n\
  - `React` - 响应动作（阻止网站）。\n- `Reference` - 外部攻击参考 ID。\n- `Sid` - Snort 规则 ID。\n- `Rev`\
  \ - 规则的版本号。\n- `Classtype` - 规则分类标识符。\n- `Priority` - 规则优先级数字。\n- `Uricontent` -\
  \ 在数据包的 URI 部分搜索内容。\n- `Tag` - 规则的高级记录行为。\n- `Ip_proto` - IP 协议字段值。\n- `Sameip`\
  \ - Determine 源 IP 和目标 IP 是否相等。\n- `Stateless` - 忽略流状态的有效性。\n- `Regex` - 通配符模式匹配。\n\
  - `Within` - 强制关系模式匹配的范围。\n- `Byte_test` - 数字模式匹配。\n- `Byte_jump` - 数字模式测试和偏移调整。\n\
  \n## Snort 基础命令\n\n1) `start snort`：`Sudo snort`\n2) `snort help` 命令：`snort --help`\n\
  3) Snort 启动特定的配置文件：\n```bash\nsudo snort -i eth0 –c /example/snortexample/snort.conf\
  \ -A fast -l /var/log/snort\n```\n4) 规则：\n```bash\nalert tcp any any -> 10.232.2.1\
  \ 80 (msg:\"Telnet Login\";sid:23434)\nalert icmp any any -> 10.232.2.1 any (msg:\"\
  ICMP PING\";sid:8845463)\n```\n\n以上就是 Kali Linux 提供的高级黑客工具的全部。在下一章中，我们将详细讨论无线攻击。在进行无线攻击之前，尝试练习本章中学到的的内容。你可以使用像\
  \ Burp suite 这样的 Web 应用分析软件来进一步了解协议和加密过程，成为一名高效的黑客。\n\n# 第 5 章：无线攻击与渗透测试\n\n本章将详细解释使用\
  \ Kali Linux 可以进行的无线攻击。首先，我们将简要介绍不同的以分析网络数据包而闻名的无线网络分析工具。在下一节中，我们将介绍 Aircrack-ng，这是一种\
  \ Kali Linux 无线工具，用于破解某些加密的 WiFi 密码。\n\n在当今，几乎每个人都连接到了互联网。特别是如果你经常在路上，你希望随处都有无线信号以便你可以你想做的任何事情。但在许多情况下，这些无线信号在使用之前需要经过身份验证。有时你可能急需网络但不知道其无线密码，这种用户可能会非常焦虑。在\
  \ Kali 中，有很多可用工具可以破解无线网络。本章将描述使用各种渗透工具进行无线网络攻击。\n\n## 什么是嗅探？\n\n嗅探是通过使用黑客工具获取无线数据包的过程。嗅探通常被称为脚本小子（script\
  \ kiddies）方法，因为用户可以利用嗅探技术骗取密码等敏感信息。Wireshark 是一种用于无线攻击的著名工具。\n\n### 无线网络嗅探工具 Kismet\n\
  \n如果要进行无线网络渗透测试，必须首先扫描有效的访问点。此时，Kali Linux 提供了 Kismet 这种无线网络嗅探工具。使用该工具测量周围的无线信号。本章描述使用\
  \ Kismet 工具进行无线网络。\n\n步骤 1：启动 Kismet 工具。执行命令：\n```bash\nkismet\n```\n步骤 2：使用 root\
  \ 用户运行 Kismet 工具。此时选择 Ok。之后，界面会提示“Yes”。\n步骤 3：界面显示设置 Kismet 服务的信息。使用默认设置并选择 Start。\n\
  步骤 4：指定无线网卡接口描述。如果你的无线网卡已处于监听模式，输入 `WLAN0` 或 `MON0` 等信息。然后点击 Add 按钮。\n步骤 5：界面显示正在嗅探无线网络的信号。运行一段时间后，点击屏幕上的\
  \ Kismet 菜单并选择 Quit 退出终端。\n步骤 6：Kismet 关闭上述消息，你会看到多个日志文件保存在 Root 下。切换到 Root 目录并使用\
  \ `ls` 命令查看日志文件。执行命令：\n```bash\nls\n```\n从输出可以看到 Kismet 生成了不同后缀的文件：\n- `alert`：包含所有警告信息。\n\
  - `gps`：如果使用了 GPS，则相关 GPS 数据保存在文件中。\n- `NET`（或 `nettxt`）：所有文本输出。\n- `XML`：包含 XML\
  \ 格式的数据。\n- `PCAP`：包含整个会话捕获的数据包。\n\n### 分析文本文件\n\n在 Linux 中，你可以使用各种文本编辑器打开 `nettxt`\
  \ 文件。从该界面可以看到 `nettxt` 文件包含了大量扫描到的无线网络的信息，每个无线网络都有标签。\n\n### Aircrack-ng\n\nAircrack-ng\
  \ 是一种基于 IEEE 802.11 协议的 WEP 和 WPA-PSK 加密工具。该工具主要使用两种攻击方法破解 WEP：一种是 FMS 攻击，以发现 WEP\
  \ 漏洞的研究人员命名；另一种是 Kore 攻击，这是一种统计攻击，这种攻击比 FMS 攻击高效得多。本章描述使用 Aircrack-ng 破解无线网络。\n\n\
  ### 破解 WEP 加密网络\n\nBep 协议是设备间传输数据的加密方式，防止非法用户监听或入侵无线网络。然而，密码分析学家已经发现了 WEP 的多个漏洞，这些漏洞在\
  \ 2003 年被 WPA 消除并被 WPA2 取代。本章描述破解 WEP 加密的无线网络。使用 Aircrack 破解 WEP 加密的无线网络的步骤如下：\n\
  \n1) 使用 `airmon-ng` 命令查看当前系统上的无线接口。执行命令：\n```bash\nairmon-ng\n```\n输出信息表明当前系统中有一个无线接口。输出：Interface\
  \ Chipset Driver Wlan0（在此处获取你的驱动程序）。\n\n2) 尝试更改 wifi 系统或设备的 mac 地址。因为 MAC 地址识别主机，修改主机\
  \ MAC 地址可以隐藏真实的 MAC。在更改 MAC 地址之前需要停止接口。执行命令：\n```bash\nairmon-ng stop wlan0\n```\n\
  或者你也可以尝试命令：\n```bash\nifconfig wlan0 down\n```\n执行上述命令后，WLAN0 接口停止。此时你可以更改物理地址（也称为\
  \ MAC），并执行命令：\n```bash\nmacchanger --mac 22:33:44:55:66:77 wlan0\n```\nPermanent\
  \ MAC: 00:c1:39:76:05:6c (unknown)\nCurrent MAC: 00:c3:40:77:05:6e (unknown)\nNew\
  \ MAC: 22:33:34:34:23:67 (Hp Inc)\n输出显示了物理设备的永久 MAC 地址、当前 MAC 地址和新 MAC 地址。你可以看到\
  \ wlan1 接口的 MAC 地址已被修改。\n\n有时在使用 `airmon-ng` 启用无线卡时会发生 SIOCSIFFFLAGS: Operation\
  \ not possible to RF-kill 错误，这是因为 Linux 中有一个名为 RF-kill 的软件可以关闭未使用的无线设备（如蓝牙）。当用户使用这些设备时，需要手动解锁。执行命令查看所有禁用的设备：\n\
  ```bash\nrfkill list\n```\n执行上述命令后，禁用的设备已解锁。\n\n3) 使用 `airodump-ng` 命令定位附近的可用无线网络。执行命令：\n\
  ```bash\nairodump-ng wlan0\n```\n输出附近的可用无线网络。当你找到用户想要攻击的路由器时，按 C 停止搜索。输出可以看到：\n\
  - BSSID：无线地址\n- PWR：网卡报告的信号强度\n- BEACONS：发布的 Beacon 数量\n- Data：捕获的数据包数量\n- CH：通道（从\
  \ Beacons 获取）\n- Essid：所谓的 SSID，如果 SSID 被隐藏则为空\n- Rate：传输速率\n- FRAMES：客户端发送的数据包数量\n\
  \n4) 使用 `airodump-ng` 捕获指定 BSSID 文件。`airodump-ng` 的常用选项如下：\n- `-c`：指定通道\n- `-w`：指定捕获数据文件名\n\
  - BSSID：指定 BSSID\n\n5) 打开新终端运行 `aireplay-ng` 命令。`aireplay-ng` 的语法格式如下：\n```bash\n\
  aireplay-ng -1 0 -a [BSSID] -h [Chosen MAC] -e [ESSID] [Interface]\n```\n```bash\n\
  aireplay-ng -d 1 -a [BSSID] -c [Chosen MAC] [Interface]\n```\n\n6) 使用 `aireplay-ng`\
  \ 向路由器发送流量以捕获数据。语法格式：\n```bash\naireplay-ng -3 -b [BSSID] -h [Chosen MAC] [Interface]\n\
  ```\n输出是使用 ARP 请求读取 ARP 请求，此时切换到 `airodump-ng` 接口，可以看到帧数增加。捕获一定数量的无线数据包后，如果无效，尝试继续捕获。\n\
  \n7) 使用 `aircrack-ng` 破解密码：\n```bash\naircrack-ng -b [xx] [filename].cap\n```\n\
  从输出可以看到 KEY FOUND，密码已破解。\n\n### WPS (Wi-Fi protected Setup)\n\nWPS 是由 Wi-Fi 联盟引入的新标准，主要解决无线网络认证问题。因为设置步骤太麻烦，许多人使用\
  \ WPS 设置设备。当此功能启用时，攻击者可以攻击 WPS。本章描述使用各种工具攻击 WPS。\n\n使用 `reaver` 破解 WPS 的步骤如下：\n\
  1) 插入无线卡并使用 `ifconfig` 查看无线卡是否插入正确。执行命令：\n```bash\nifconfig\n```\n2) 激活无线网卡的监听模式。执行命令：\n\
  ```bash\nairmon-ng wlan0\n```\n注意：启动上述命令时，确保正确识别无线网卡芯片和驱动，否则无线网卡导致导致失败。\n\n3) 攻击\
  \ WPS。执行命令：\n```bash\nreaver -i mon0 -b 14:E6:E4:DE:FB:20 -vv\n```\n输出：从上述输出可以看到正在等待信号连接路由器，并通过发送\
  \ PIN 获取密码。如果路由器未启用 WPS，将出现以下信息：\n`[!] WARNING: Failed to associate with 14:E6:E4:DE:FB:20\
  \ (ESSID: XXXX)`\n\n### Fern wifi cracker\n\nFern WiFi Cracker 是测试无线安全的出色工具。该工具用于攻击\
  \ Wi-Fi 网络。这里的第一步是使用 FERN Cracker 工具攻击 WPS。\n\n使用 `wifite` 攻击 WPS 的步骤如下：\n1) 启动\
  \ `wifite` 工具并指定密码字典。在命令行终端：\n```bash\nwifite -dict jesus.txt\n```\n此信息显示了 Wfinite\
  \ 工具的版本、支持的平台以及 Wfinite 扫描开始。扫描到你想破解的无线网络时，按 CTRL + C 停止扫描。\n2) 停止扫描无线网络并显示下方消息：从输出可以看到扫描到了五个访问点和三个客户端。输出中总共有七列：指示访问点编号、Essid\
  \ 号、通道、加密模式、电功率、是否开启 WPS 以及客户端。如果只有一个客户端连接到访问点，CLIENT 列显示为 CLIENT；如果有多个客户端连接，则显示\
  \ clients。\n3) 此时，选择要攻击的访问点。这里选择第五个访问点并输入“1”。然后按回车开始攻击，消息如下：\n`select target numbers\
  \ (1-5) separated by commas, or 'all': 1`\n\n### GERIX WIFI CRACKER\n\nGerix Wifi\
  \ Cracker 是另一个图形界面无线工具。本章描述如何使用该工具创建伪点。之前，我们介绍了手动使用 `aircrack-ng` 破解 Wep 和 WPA/WPA2\
  \ 加密网络。\n\n### 使用 Gerix 创建伪点\n\n使用 Gerix 工具可以创建并建立伪点（AP）。\n```bash\nroot@kali:/usr/share/gerix-wifi-cracker#\
  \ python gerix.py\n```\n执行上述命令后，界面出现：\n1) 从该界面可以看到 Gerix 数据库已加载。此时切换到 Configuration\
  \ 标签页。\n2) 从界面看到只有一个无线接口。现在我们要进行配置。选择接口 `wlan1` 并点击 Enable（启用）按钮。\n3) 从界面看到 `WLAN1`\
  \ 已启动监听模式。选择 `MON0` 并点击 Rescan（扫描）。\n4) 从界面看到附近的可用无线网络。例如，我们选择了 Essid 为无线网络。\n5)\
  \ 界面显示正在嗅探信号。运行一段时间后，点击界面上的 Sniffing（嗅探）和 Logging（日志）按钮。点击屏幕上的 Kismet 菜单并选择 Quit\
  \ 退出。\n6) Kismet 关闭上述消息，你会看到多个日志文件保存在 Root 下。在这些日志文件中，可以看到 Kismet 运行多次后捕获的数据。\n\
  7) 从该界面可以看到 Kismet 生成的常见时间，用于破解 WEP 密码。\n\n### GERIX TO ATTACK\n\nGERIX TO ATTACK\
  \ 是一种自动攻击无线网络的工具步骤如下：\n1) 启用转发。执行命令：\n```bash\necho 1 >> /proc/sys/net/ipv4/ip_forward\n\
  ```\n2) 设置上述信息后完成默认设置。\n3) 添加防火墙规则进行重定向。执行命令：\n```bash\niptables -t nat -A PREROUTING\
  \ -p tcp --destination 80 -j REDIRECT --to-port 8080\n```\n上述设置成功后，攻击者控制了网关与目标主机之间的数据。\n\
  \n### PORT REDIRECTION ATTACK\n\n端口重定向也称为端口映射，将数据包（如 80）重定向到不同端口（如 8080）。本章描述使用\
  \ `arpsof` 工具实现端口重定向。步骤如下：\n1) 启用转发。执行命令：\n```bash\necho 1 >> /proc/sys/net/ipv4/ip_forward\n\
  ```\n2) 使用 `arpsof` 攻击目标主机。方法是攻击者（192.168.6.232）发送 ARP 包欺骗网关（192.168.6.235）和目标主机。首先欺骗目标主机，执行命令：\n\
  ```bash\narpsof -i eth0 -t 192.168.6.232 192.168.6.235\n```\n输出攻击者发送到目标主机 192.168.6.232\
  \ 的数据包。503946:8D 代表攻击者的 MAC 地址；193fe5 代表 192.168.6.235 的 MAC 地址。当上述过程成功后，目标主机 192.168.6.232\
  \ 将数据发送到网关 192.168.6.235。\n3) 使用 `ARPSPOOF` 攻击网关。执行命令：\n```bash\narpsof -i eth0\
  \ - 192.168.6.232 192.168.6.235\n```\n上述输出显示发送到网关的数据包。\n\n### URL MANIPULATION ATTACK\n\
  \nURL 操控与中间人攻击相似，通过目标主机向互联网注入路由流量。本章描述使用 `arpsof` 工具实现 URL 操控攻击。步骤如下：\n1) 启用转发。执行命令：\n\
  ```bash\necho 1 >> /proc/sys/net/ipv4/ip_forward\n```\n2) 使用 `Arpsof` 攻击目标主机。方法是攻击者（192.168.6.232）发送\
  \ ARP 包欺骗网关（192.168.6.235）和目标主机。首先欺骗目标主机，执行命令：\n```bash\narpsof -i eth0 -t 192.168.6.232\
  \ 192.168.6.235\n```\n输出显示攻击者发送到目标主机 192.168.6.232 的包。503946:8D 代表攻击者的 MAC 地址；193fe5\
  \ 代表 192.168.6.235 的 MAC 地址。当上述过程成功后，目标主机 192.168.6.232 将数据发送到网关 192.168.6.235。\n\
  \n### Capturing and Monitoring Wireless Data\n\n使用中间人攻击方法，可以将 Kali Linux 操作系统放在目标主机和路由器之间。通过这样，用户可以捕获来自目标主机的所有数据。本章描述如何使用中间人攻击工具捕获和监控无线数据。\n\
  \n1) 启用路由器转发功能。执行命令：\n```bash\necho 1 >> /proc/sys/net/ipv4/ip_forward\n```\n2)\
  \ 使用 `arpsof` 命令攻击主机。执行命令：\n```bash\narpsof -i eth0 -t 192.168.6.232 192.168.6.235\n\
  ```\n执行上述命令告诉目标主机（目标主机）网关的 MAC 地址是 00。当目标主机接收到消息时会修改 ARP 表中的项。如果不需要攻击，按 CTRL+C 停止。\n\
  3) 查看目标主机的访问 URL 信息。执行命令：\n```bash\nurlsnarf -i eth0\n```\n输出显示了目标主机的访问。\n4) 用户也可以使用\
  \ `driftnet` 工具捕获由系统图像。执行命令：\n```bash\ndriftnet -i eth0\n```\n执行上述命令后，窗口打开。输出显示了目标主机的访问。\n\
  5) 现在随机访问网页以生成捕获的数据。执行命令：\n```bash\ndriftnet -i eth0\n```\n输出显示了目标主机的访问。\n6) 界面显示\
  \ `DRIFTNET` 命令：\n```bash\ndriftnet -i eth0\n```\n执行上述命令后，日志文件保存在 Root 下，文件名为 `driftnet-*`。\n\
  7) 用户可以使用 Linux 查看器查看。\n\n## Penetration testing\n\n我们知道专业的黑客也称为渗透测试人员。他们通常为公司使安全性更好。渗透测试遵循特定的策略和指南，类似于其他方法。\n\
  \n### 目的、程序和方法\n\n如前文所述，渗透测试是委托白帽黑客进行攻击，根据需要限制攻击范围。渗透测试（Penetration Test）旨在发现资产并提供适当风险管理。\n\
  \n### 为什么公司或组织需要渗透测试？\n\n当信息系统上线服务时，黑客会继续尝试攻击。通过渗透测试，所有者可以：\n- 理解信息不当泄露\n- 网络架构设计问题\n\
  - 防火墙设置问题\n- 系统漏洞\n- 应用程序设置问题\n- 理解网络强度\n- 评估入侵者的对等能力\n- 评估渗透\n- 安全策略的执行\n- 减少入侵后的损失\n\
  \n### 测试方法\n\n- **单系统**：例如，提供特定服务的网站，由于支持许多系统，主要攻击受限于网站。\n- **服务器或主机**：对于提供一个或多个服务的设备或计算机，方法取决于提供的服务类型。\n\
  - **分段或主机**：有时特定的网站或服务器容易实施，由于区域的原因，每个系统的防御机制可能不均，作为跳板达到攻击。\n- **全系统**：测试组织的所有相关系统。概念与分段或主机相同。当测试范围更大，可以看到更好的保护能力。\n\
  - **人员安全**：信息系统或应用程序通常由专门人员处理。在安全意识上，人员应高于平均水平。通过社会工程获取基本（甚至高级）权限。\n- **所有机构**：当组织开放所有资产时，这种情况最接近黑客攻击，因为渗透测试范围太广，少数机构会处理组织的渗透测试。\n\
  - **健康检查不是攻击**：渗透测试是为了尽早发现现有漏洞。作为改进的基础，渗透测试的实施必须考虑系统的持续运行，并提前为系统准备应对措施。\n- **审计不是偷窃**：渗透测试是确认组织安全策略执行的审计行为。测试完成后，相关信息必须完全交给卖家，作为持续改进安全的策略参考。\n\
  - **保护是测试的目的**：渗透测试发现的漏洞，测试人员必须为客户提出相应的保护措施。处理渗透测试的操作通常称为 A 方，B 方负责执行渗透测试。\n\n-\
  \ **黑盒测试**：B 只知道被测试目标的名称或 URL。其他信息必须在测试活动期间自行收集。使用黑盒测试是测试 B 的黑客技能，因为这种模式最接近真实的攻击。\n\
  - **白盒测试**：A 将尽可能提供目标信息，以便 B 专注于寻找被测试系统的弱点，并使用白盒测试测试系统的保护能力。\n- **灰盒测试**：当然，有时 A\
  \ 不提供被测试系统（如外包系统）的完整信息。B 无法提前获取系统信息，但 A 仍协助 B 获取尽可能等的信息。处于黑盒和白盒之间。\n- **双黑盒**：有时\
  \ A 希望在模拟黑客攻击的范围内尽可能测试。不仅要测试系统的保护能力，还要测试自身人员的警惕性或弹性。秘密委托 B 进行渗透操作，相关人员不知道渗透测试，B\
  \ 无法获得被测试系统的详细信息。因此，进攻双方在黑暗中竞争，所以被称为双黑盒（或双盲）。\n- **双白盒**：与双黑盒相反，双方都知道彼此的存在，主要目的是协助\
  \ B。A 发现并确认系统漏洞。\n\n通过此，我们完成了 Kali Linux 及其工具的之旅，将在下一个模块中进一步讨论。始终记住，黑客不是理论上的。黑客是实干的。所以，在阅读此后，让自己准备好实验。一切顺利！\n"
