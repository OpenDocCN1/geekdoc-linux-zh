  trans: "\n\n`crunch` 命令的常用选项如下。\n\n- `-o`: 用于指定输出字典文件的位置。\n- `-b`: 指定写入文件的最大字节数。该大小可以用\
    \ KB、MB 或 GB 为单位，但必须与 `-o` 选项配合使用。\n- `-t`: 设置使用的特殊格式。\n- `-l`: 当 `-t` 选项指定 `@`、`%`\
    \ 或 `^` 时，此选项用于标识占位符的字符。\n\n### (2) 创建密码列表文件并保存到桌面\n生成的密码列表最小长度为 8，最大长度为 10，并使用\
    \ `ABCDEFGabcdefg0123456789` 作为字符集。执行命令如下：\n\n```bash\nroot@kali:~# crunch 8 10\
    \ ABCDEFGHIJKLMabcdefghijklm0123456789 –o /root/Desktop/ \n```\n从上面的输出信息可以看出，将生成一个大小为\
    \ 659 TB 的文件，总共 661,552,638,197,716 行。执行上述命令后，桌面将生成一个名为 `generatedCrunch.txt`\
    \ 的字典文件。由于组合生成的密码更多，因此需要很长时间。\n\n### (3) 打开字典文件\n生成上述密码字典文件后，使用 `Nano` 命令打开它。执行命令如下：\n\
    \n```bash\nroot@kali:~# nano /root/Desktop/generatedlist.txt\n```\n执行上述命令后，将打开\
    \ `generatedlist.txt` 文件。所有使用 `crunch` 命令生成的密码都保存在此文件中。\n\n### rtgen\n`rtgen`\
    \ 工具用于生成彩虹表（rainbow tables）。彩虹表是针对各种可能的字母组合的预计算哈希值的大型集合。彩虹表并不一定适用于 MD5 算法。有许多种算法，它可以快速破解各种密码。密码越复杂，彩虹表越大，现在主流的彩虹表通常为\
    \ 100G 或更大。\n\n使用 `rtgen` 工具生成彩虹表，具体步骤如下：\n\n### (1) 切换到 `rtgen` 目录\n执行命令如下。\n\
    \n```bash\nroot@kali:~# cd /usr/share/rainbowcrack/\n```\n\n### (2) 使用 `rtgen`\
    \ 命令基于 MD5 生成彩虹表\n执行命令如下：\n\n```bash\nroot@kali:/usr/share/rainbowcrack# ./rtgen\
    \ md5 loweralpha-numeric 1 5 0 3800 33554432 0\n```\n上面的信息显示了彩虹表的参数和生成过程。例如，生成的彩虹表文件名为\
    \ `.md5_loweralpha-numeric#1-5_0_3800x33554432_0.rt`；该表使用 MD5 哈希算法加密，并使用了字符集 `abcdefghijklmnopqrstuvwxyz0123456789`。\n\
    \n### (3) 排序彩虹表\n为了方便使用生成的彩虹表，使用 `rtsort` 命令对表进行排序。执行命令如下：\n\n```bash\nroot@kali:/usr/share/rainbowcrack#\
    \ rtsort md5_loweralpha-numeric#1- 5_0_\n```\n\n### John the Ripper\n这是一个著名的破解工具，用于破解密码和其他内容。Web\
    \ 攻击是攻击中最重要的阶段，你需要详细了解它以获得更好的效果。\n\nJohn the Ripper 有四种[破解](http://www.2cto.com/Article/jiami/)模式：\n\
    \n1. **字典文件模式（Wordlist Mode）**：这是 John 支持的破解模式中最简单的一种。你唯一需要的工作就是告诉 John 字典文件在哪里（字典文件是文本文件，内容每行一个单词）。它代表了尝试的密码，以便进行提取和破解。在“字典文件”破解模式下，你可以使用“单词更改”功能自动将这些规则应用到读取的每个单词，以增加破解几率。\n\
    2. **单破解模式（Single Crack Mode）**：“简单”破解模式是为那些使用“将账户作为密码”的懒人设计的。所谓的“使用账户作为密码”意味着如果用户账户是“John”，那么它的密码也被视为“john”。在“简单”模式下，john\
    \ 将使用密码文件中的“账户”字段来破解密码，并使用各种“单词更改”规则应用到“账户”上增加破解几率。例如，账户“john”将尝试使用“john”、“john0”、“njoh”、“j0hn”等规则更改来尝试密码。\n\
    3. **增量模式（Incremental Mode）**：这是 John 最强大的破解模式。它会自动尝试所有可能的字符组合并将其破解为密码。这种破解模式所需的时间非常长，因为尝试组合字符非常耗时，所以\
    \ John 会定义一些“字符频率表”来帮助破解。简而言之，这种破解方法是“暴力破解”，通过测试所有可能的密码组合来获得正确结果。\n4. **外部模式（The\
    \ External Mode）**：这种破解模式允许用户用 C 语言编写一些“破解模块程序”，然后在 John 中使用它们。事实上，所谓的“破解模块程序”是一个子声明。\n\
    \n"
