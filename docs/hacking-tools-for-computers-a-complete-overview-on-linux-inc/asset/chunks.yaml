    \ know that professional hackers that ethical are also called as penetration testers.\
    \ They usually work for companies to make their security better and not prone\
    \ to attacks. Penetration testing follows a certain strategy and guidelines just\
    \ like any other IT methodology. We will just go around it for some time.\n\n\
    ### Purpose, procedure and method of pen testing\n\nAs mentioned in the previous\
    \ chapters the white-capped hacker is entrusted by the seller to attack, so the\
    \ target and scope of the attack can be limited according to the needs of the\
    \ seller. This type of attack based on the content of the agreement is called\
    \ \"penetration test (Penetration Test, referred to as Pentest or PT). \"Penetration\
    \ Test\" aims to discover information assets and Risks to provide appropriate\
    \ risk management.\n\n### Why do companies or organizations need penetration testing?\n\
    \nWhen information systems go online to provide services, hackers will continue\
    \ to try to attack, whether the system can stand the test, and through penetration\
    \ testing, the business owners can:\n- Understand the ways that intruders may\
    \ use\n- Information & Improper disclosure or tampering\n- Network architecture\
    \ design issues\n- Firewall setup issues\n- System and application vulnerabilities\n\
    - System and application setup issues\n- Understanding system and network strengths\n\
    - How long it takes to evaluate an intruder with equal capabilities\n- Assessment\
    \ was met the extent of the invasion\n- Assess the implementation of safety policy\n\
    - Strengthen system and network security\n- Reduce post-invasion losses (Wiki)\n\
    \nThe claim for penetration testing is: By attacking computer systems, to discover\
    \ possible weaknesses in the system, Access to system, program features, or sensitive\
    \ data. The general statement is: Use the hacker's point of view, technology,\
    \ and tools to identify vulnerabilities in the system, and provide corresponding\
    \ protective measures for the client involved. The method for handling penetration\
    \ test operation is hereinafter referred to as Party A, and Party B is responsible\
    \ for performing penetration test.\n\n### Test Methods\n\n- **Single system**:\
    \ for example, a website that provides a specific service, like its backend or\
    \ many supported systems. However the main attack is limited to the features offered\
    \ on the site.\n- **Server or host farm**: for specific devices or computers that\
    \ provide one or more services, the method that can be used depends on type of\
    \ service provided by the server.\n- **Segment or host farm**: sometimes the specific\
    \ website or server is easy to implement due to small area. However the defense\
    \ mechanism of each system may be uneven between hosts. The vulnerability of host\
    \ is used as a springboard to reach the attack.\n- **System-wide**: test all relevant\
    \ systems of the organization. The concept is same as segment or host. When the\
    \ testable range is larger, the protection capability can be better seen.\n- **Personnel\
    \ safety**: information systems or applications software is usually handled by\
    \ specialized personnel. In awareness of security, personnel should be higher\
    \ than average staff. Look for objects with social engineering to obtain basic\
    \ (or even high) rights.\n- **All institutions**: when the organization is open\
    \ to testing all assets, this situation is closest to the hacker attack, because\
    \ the scope of penetration testing is too broad, relatively few institutions will\
    \ handle all infiltration testing of the organization.\n- **Health check is not\
    \ an attack**: Penetration testing is to find out existing weaknesses as early\
    \ as possible. As a basis for improvement, the implementation of penetration test\
    \ must take into account the continuous operation of the system, and is necessary\
    \ to prepare countermeasures for the system to stop in advance.\n- **Is an audit,\
    \ not a steal**: Penetration testing can confirm the organization's implementation\
    \ of security policy is an auditing behavior. After penetration test is completed,\
    \ the relevant information must be completely handed over to the seller as strategic\
    \ reference for continuously improving the security.\n- **Protection is the purpose\
    \ of the test**: the weaknesses found in penetration test; the tester must propose\
    \ the corresponding protective measures for the client. The method for handling\
    \ penetration test operation is hereinafter referred to as Party A, and Party\
    \ B is responsible for performing penetration test.\n- **Black box**: B only knows\
    \ the name or URL of the target to be tested. Other information must be collected\
    \ by itself during the testing activity. Using the black box test is testing the\
    \ hacking skills of B because this pattern is closest to actual hacking attack.\n\
    - **White Box**: Party A will provide information on the target as much as possible,\
    \ so that B can focus on finding the weaknesses (vulnerabilities) of the system\
    \ under test, and use the white box test to test the system's protection ability.\n\
    - **Gray box**: of course, sometimes Party A is not then, the information of the\
    \ system under test (such as the system developed by outsourcing system) cannot\
    \ provide the complete information of the target to be tested. B cannot obtain\
    \ the system information in advance, but A still assists B to obtain the equivalent\
    \ information as much as possible. The box is between black box and white box.\n\
    - **Double black box**: sometimes A wants to test as much as possible in the context\
    \ of simulating hacking attacks. It is necessary not only to test the protection\
    \ capabilities of the system, but also to test the alertness or resilience of\
    \ its own personnel. Secretly entrust B to conduct infiltration operations, relevant\
    \ personnel did not know the penetration test, and B could not get detailed information\
    \ about the system under test. Therefore, both offensive and defensive sides are\
    \ competing in the dark, so it is called double black box (or double-blind).\n\
    - **Double white box**: opposed to double black box, both sides know each other's\
    \ existence, the main purpose is to assist B. A finds and confirms system vulnerabilities.\n\
