    ### 说明

    显示在工作日志文件中记录的工作状态。

    i) 示例：`john –status:restoreParameters: -makechars: [file name]`


    ### 说明

    创建“字符频率表”。此选项将根据当前破解的密码生成“字符频率表”（注意：John 会将破解的密码记录在 `JOHN.POT` 文件中）。如果指定的文件名文件已存在，它将覆盖它。此选项生成的文件可用于“增强”破解模式。

    j) 示例：`john –makechars:owncharsParameters: -show`


    ### 说明

    显示已破解的密码。由于“账户”（Account）数据未存储在 `JOHN.POT` 文件中，因此你应该同时输入相应的密码文件。

    k) 示例：`john –show passwd`（如图所示） <img src=http://www.starkun.com/txtjpg/hacker.gif>

    参数：`-test`


    ### 说明

    测试当前机器执行 John 各种类型密码破解的速度。

    l) 示例：`john –test`（如图所示） <img src=http://www.starkun.com/txtjpg/hacker.gif>

    参数：`-users:[-]LOGIN|UID` [,]


    ### 说明

    仅破解特定“账户”的密码，例如仅针对 root 或 UID=0 的用户（如果你在 `LOGIN|UID` 名称前加上 `-` 符号，则反反之，表示你不应该破解该“账户”的密码）。

    m) 示例：`john –i:all –users:root passwd`（如图所示） <img src=http://www.starkun.com/txtjpg/hacker3.gif>

    参数：`-groups:[-]UID` [,]


    ### 说明

    仅破解某个“组”中用户的密码。（如果你在 UID 名称前加上 `-` 符号，则反反之，表示你不应该破解该“组”中用户的密码）。

    n) 示例：`john –i:all –groups:100`

    参数：`-shells:[-]SHELL` [,]


    ### 说明

    与上述两个参数类似，此选项仅适用于所有可以使用 shell 进行密码破解工作的用户，忽略其他用户。（如果你在 `SHELL` 名称前加上 `-` 符号，则反反之，表示你不应该破解可以使用该
    SHELL 的用户密码）。在指定 SHELL 时，你可以省略绝对路径。例如，参数 `-shells:csh` 将包含路径如 `/bin/csh` 或 `/usr/bin/csh`，但如果你指定
    `-shells:/bin/csh`，则只包含 SHELL 名称 `/bin/csh`。

    o) 示例：`john –i:all –shells:csh passwd`（如图所示） <img src=http://www.starkun.com/txtjpg/hacker4.gif>

    参数：`-salts:[-]COUNT`


    ### 说明

    仅破解“盐值”（salts）大于“COUNT”的账户密码，这可以让你获得更快的破解速度（所谓的“salts”是指以 UNIX 为基础的“密码”编码单元）。例如，你可以只破解某部分用户的
    `-salts:2` 密码以获得更速度，然后在有时间时再破解剩余用户的密码 `-salts:-2`。

    p) 示例：`john –i:all –salts:2 passwd`（如图所示） <img src=http://www.starkun.com/txtjpg/hacker5.gif>

