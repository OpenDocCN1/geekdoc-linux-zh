    ## 为什么 Linux 重要？

    现在我们知道 Linux 是什么了，让我们谈谈它的用途。因为 Linux 内核非常小巧且精致，它可以在许多环境中执行，强调节能和低硬件资源消耗。Linux
    集成了许多优秀的软件（无论是专有的还是免费的），也非常适合目前的使用。传统的常见的应用大致分为企业应用和个人应用，但近年来云计算机制似乎让 Linux 更加强大。


    ### 企业利用

    数字化的目标是为消费者或员工提供产品信息（如网页），并跨企业数据（如账户管理）。


    ### Web 服务器：

    这是目前 Linux 最流行的应用。继承了 UNIX 的高稳定性传统，Linux 用于网络功能时特别稳定且强大。此外，由于 GNU 项目和 GPL 模型，许多优秀软件在
    Linux 上开发，且这些 Linux 服务器几乎是免费的。因此，作为 Web 服务器、邮件接收服务器、文件传输服务器等，Linux 绝对是最佳选择。当然，这也是
    Linux 的优势，也是它在程序员和网络工程师中流行的主要原因。由于对 Linux 服务器的强劲需求，许多硬件供应商在推出产品时不得不指定 Linux 发行版。


    ### 关键任务应用（金融数据库、大型企业网络管理）

    由于计算机的高性能和低价格，金融大企业环境为了微调自己的机器，许多企业逐渐移动到兼容 Intel 的 x86 主机。此外，这些企业使用的软件大多使用 UNIX
    操作系统平台。


    ### 学术机构的高性能计算任务：

    学术机构经常需要开发自己的软件，因此对操作系统作为开发环境的需求非常迫切。例如，哈理工大学等拥有非常多技能系统的机构，需要这种环境来完成毕业项目。示例包括工程中的流体力学、娱乐业的特效、软件开发者的工作平台等。由于其创建者是一个计算机性能迷，Linux
    拥有强大的计算能力，而且 Linux 拥有广泛支持的 `GCC` 编译器，因此 Linux 在这里的优势是显而易见的。


    ## 为什么 Linux 比 Windows 更适合黑客？

    1. 开源：开源是指内容向公众开放的软件。如果你有技能，甚至可以对其进行修改并带有自己的特征进行重新分发。开源软件和操作系统帮助人们在技能方面不断精进。与
    Windows 收取的大量费用不同，开源的 Linux 安装是免费的。

    2. 自由：黑客需要自由。Linux 反正也是免费。程序的内容是开放的，你可以自由移动。另一方面，它很容易被破坏，但也很有趣。自由是极好的。你可以根据喜愿进行调整，并自由定制自己或公司的需求。而且每次都是灵活的。而
    Windows 在许多领域限制了用户。

    3. 服务器使用：Linux 不仅是免费的，而且轻量级，与服务器结合时效果良好。许多托管公司和网站使用 Linux 作为他们的服务器，黑客遵循客户端模型攻击目标非常方便且灵活。

    4. 许多类型：Linux 最棒的一点是可以进行各种形式的选择，我们将在后续章节中详细解释。黑客可以使用 `Kali` 和 `Parrot` 等发行版。

    5. 轻量：Linux 操作系统非常轻量，与 Windows 相比，掉帧更少且运行更快。作为黑客，我们必须在不同的终端进行大量工作，这是重要的。

    6. 稳定运行：然而，Linux 实际上运行得相当稳定。网络功能和安全被考虑得很周，因此轻松使用它是 Linux 的一个特性。


    ## Linux 命令简介

    Linux 是一种用于命令行界面的操作系统。当 Linux 创建时，Arch Linux 以其环境闻名，大多数基于终端。然而，在 Windows 之后，Debian
    系统流行了起来。


    [注意：命令章节极其重复并包含了乱码，如“2015 年 7 月 29 日发布的”……] 终端使用 `bash` 脚本和一些命令来无错误工作。以下是黑客应该熟悉的各种命令：


    1. `ls`：`ls` 命令代表“list”，显示文件和目录信息。它是 Linux 中最常用的命令之一。在当前目录中：

    ```

    ls

    ```

    2. `cp`：`cp` 命令是“copy”的缩写，是复制文件的命令。下面是示例：

    ```

    cp file.txt copy.txt

    ```

    3. `mv`：`mv` 命令是“move”的缩写，是移动命令。它移动文件和目录。例如，如果你想将 `secondfile` 移动到 `example` 目录：

    ```

    mv secondfile example/

    ```

    4. `rm`：`rm` 命令是“remove”的缩写，是删除命令。它删除文件和目录。你只需要指定文件名。例如，在当前目录删除 `example.dat`：

    ```

    rm example.dat

    ```

    5. `echo`：`echo` 的作用是在屏幕上显示字符串。如果你在屏幕上看到单词，那就是这个命令：

    ```

    echo Jesus

    ```

    6. `chmod`：在讨论这个命令的使用之前，我们需要了解一下系统的权限。什么是权限？权限由 UNIX 处理的文件和目录设置。可以根据所有者、组和其他类型设置访问是否可以执行、写入或读取。例如，如果你想设置测试文件夹中
    `example.sh` 的权限让所有用户都有权限，如下：

    ```

    chmod 777 test/sh

    ```

    7. `find`：`find` 正是搜索命令。它搜索文件和目录。例如，要在目录中查找 `ram.dat`，你需要使用命令：

    ```

    find ./ram.dat

    ```

    8. `cd`：在深入学习这个命令之前，有必要了解 Linux 如何排列目录。目录对应 Windows 中的文件夹，而 Linux 基于分级结构，移动目录和工作目录。下面解释了不同类型的目录：

    a) 当前目录：指向你正在工作的目录。

    ```

    cd

    ```

    b) 根目录：如果它是磁盘顶层的目录，则被称为根目录。

    c) 主目录：用户可以自由使用目录存储工作文档等。你可以与任何人共享它，或者你想系统地使用而不是随意使用，默认情况下，子目录（文件夹）对应主目录。从当前目录移动到
    `example` 目录的命令如下：

    ```

    cd example

    ```

    9. `kill`：`kill` 是杀死运行进程的命令。它可以终止执行异常操作的进程。此外，它用于通过正则表达式停止给计算机带来负载的操作，例如：

    ```

    kill 224

    ```

    10. `ifconfig`：这个命令在进行无线攻击时非常有用。我们可以使用这些命令找到关于适配器、路由器和无线设备的很多信息。例如：

    ```

    ifconfig wlan0

    ```

    11. `mount`：`mount` 是挂载或操作嵌入 Linux 目录的磁盘设备的命令。今天，磁盘设备被广泛使用，如 CD、DVD、蓝光光、外部硬盘、USB
    内存等。在 Linux 中，磁盘设备被称为文件系统。它们所有的都可以配置与 `mount` 命令使用。它是 Linux 系统中一个重要的命令。

    ```

    mount

    ```

    12. `ping`：`Ping` 是一个检查到网络计算机的连接路径是否正确连接的命令。黑客通常在初始阶段使用它来检查服务是否运行。

    ```

    ping

    ```

