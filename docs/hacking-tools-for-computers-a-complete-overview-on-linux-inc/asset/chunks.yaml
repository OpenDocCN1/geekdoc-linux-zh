    the output is the sameArp spoofARPSPOOF is a very good ARP spoof source code program.
    Its operation does not affect the entire network communications, the tool by replacing
    the transfer of data in order to achieve the goal of deception. This section describes
    the use of the ARPSPOOF tool.URL MANIPULATION ATTACKThe URL traffic operation
    is very similar to man-in-the-middle attack, which injects routing traffic to
    the Internet through the target host. This process will implement the attack through
    ARP injection. This section describes URL traffic manipulation attacks using the
    ARPSPOOF tool. Implementation of URL traffic operation attack using ARPSPOOF tool.
    The steps are as follows:(1) Enable routing and forwarding. Execute the command
    as follows:root@kali:~# echo 1 >> /proc/sys/net/ipv4/ip_forward(2) Launch Arpspoof
    to attack the target system. The method of attack is the attacker (192.168.6.232)
    sends ARP packets to deceive the gateway (192.168.6.235) and the target system
    192.168.6.232\. The following spoofs the target system first, executing the command
    as follows:root@kali:~# arpspoof -i eth0 -t 192.168.6.232 192.168.6.235The output
    shows the packet sent by the attacker to the target host 192.168.6.232\. 503946:8D
    represents the attacker''s Mac address; 193fe5 represents 192.168.6.235''s Mac
    addressAddress. When the above process attack is successful, when the target host
    192.168.6.232 sends data to the gateway 192.168.6.235, it will all be sent to
    the attacker 192.168.6.234(3) Inject the attack gateway using ARPSPOOF. Execute
    the command as follows:root@kali:~# arpspoof -i eth0 -t 192.168.6.232 192.168.6.235The
    above output shows the packets sent by the attacker to gateway 192.168.6.232\.
    When the attack is successful, the gateway 192.168.6.232 sends the information
    on the target system 192.168.6.235 to the attacker''s host 192.168.6.234.(4) If
    all of the above steps are successful, the attacker has control over the data
    transmitted between the gateway and the target host. Through the data received,
    the attacker can see the important information on the target systemPORT REDIRECTION
    ATTACKPort Redirection is also called port forwarding or port mapping. The process
    of receiving a port packet (such as Port 80) and redirecting its traffic to a
    different port (such as port 8080). The benefits of implementing this type of
    attack are endless, as it redirects traffic to a specific port on a given device
    from a secure port to an unencrypted port. This section describes the use of Arpspoof
    for port redirection attacks. Implementation of port redirection attack using
    ARPSPOOF. The steps are as follows.(1) Enable forwarding attacks. Execute the
    command as follows:root@kali:~# echo 1 >> /proc/sys/net/ipv4/ip_forward(2) Start
    the Arpspoof tool to inject traffic to the default network. For example, the Default
