    \n# Introduction\n![](images/00003.jpeg)\nThe following chapters will discuss\
    \ hacking in detail for beginners. We will introduce Linux along with commands\
    \ that will help us understand better about `bash` language. We will then discuss\
    \ about various tools in detail that belongs to kali Linux. We will now just give\
    \ a rough introduction to hacking process so that you can have a comfortable mindset\
    \ while reading this book.\n\n### Types of hackers:\nIn my understanding, hackers\
    \ should be divided into two categories that is positive and evil. Decent hackers\
    \ rely on their own knowledge to help system administrators identify vulnerabilities\
    \ in the system and make the systems Perfect whereas evil hackers attack, invade,\
    \ or do other things that are harmful to the network through various hacking skills.\
    \ As they do things in an unethical way these people are called as Crackers instead\
    \ of hackers.\n\nRegardless of the type of hacker, their initial learning content\
    \ will be the same as we discuss in this book and the basic skills are the same.\
    \ Many people ask: \"What do hackers do in peacetime?” Some people understand\
    \ hackers as boring and repeating humans that do the same work every day. But\
    \ that is just a misunderstanding. Hackers usually need a lot of time to learn.\
    \ In addition to learning, hackers should apply their knowledge to the real world.\
    \ No matter what kind of work a hacker does, the fundamental purpose is nothing\
    \ more than grasping what they have learned in practice.\n\nThe hacker's behavior\
    \ mainly includes the following:\n\n**First, learning technology:**\nOnce new\
    \ technologies on the Internet appear, hackers must learn immediately and master\
    \ the technology in the shortest time. The mastery here is not a general understanding,\
    \ but reading about the protocol like `rfc` and gain an in-depth understanding\
    \ of the mechanics of this technology. Once a hacker stops learning, he can no\
    \ more be a hacker.\n\nThe knowledge that primary hackers want to learn is more\
    \ difficult because they have no foundation or any guidance so they have to learn\
    \ a lot of basic content. However, today's Internet brings a lot of information\
    \ to readers and can make beginners overwhelming. Therefore, beginners can't be\
    \ greedy. They should try to find a book and their own complete textbooks, and\
    \ learn step by step. Glad you find your book and are going to dive into it in\
    \ few pages.\n\n**Second, disguise yourself:**\nEvery move of the hacker will\
    \ be recorded by the server, so the hacker must disguise himself so that the other\
    \ party can't distinguish his true identity. This requires skilled skills to disguise\
    \ his IP address, use the springboard to avoid tracking, and clean up the record.\
    \ It also includes disturbing the other party's clues and cleverly avoiding the\
    \ firewall.\n\nCamouflage is a very basic skill that hackers need to be achieve.\
    \ This is a big world for beginners, which means that beginners can't learn to\
    \ pretend in a short time. So, I don't encourage beginners to use their own learning.\
    \ Without Knowledge don't attack the network because once your own behavior is\
    \ revealed, the ultimate harm is on yourself.\n\n**Third, the discovery of vulnerabilities:**\n\
    Vulnerabilities are the most important information for hackers. Hackers should\
    \ often learn the vulnerabilities discovered by others, and try to find unknown\
    \ vulnerabilities themselves, and find valuable and exploitable vulnerabilities\
    \ from a large number of vulnerabilities. Of course, their ultimate goal is to\
    \ destroy or fix this vulnerability through vulnerabilities.\n\nThe hacker’s obsession\
    \ with finding loopholes is unimaginable. Their slogan says “breaking authority”.\
    \ A program with a vulnerability is like a festival for hackers and they would\
    \ love to mess it up to create more backdoors. Hackers find fun in breaking things.\n\
    \n**Fourth, the use of vulnerabilities:**\nFor decent hackers, the vulnerabilities\
    \ should be patched and for evil hackers, vulnerabilities should be used to destroy.\
    \ Hackers’ basic premise is \"utilization of vulnerabilities\". Hackers can use\
    \ the vulnerabilities to do the following things:\n1. Obtain system information:\
    \ Some vulnerabilities can leak system information, expose sensitive data, and\
    \ further invade the system.\n2. Intrusion system: Can be used to enter through\
    \ vulnerabilities into the system, or obtain internal information on the server,\
    \ or completely become in charge of the server.\n3. Looking for the next goal:\
    \ A victory means the emergence of the next target, hackers should make full use\
    \ of the server they have been in charge as a tool to find and invade the next\
    \ System.\n4. Do some good things: The decent hacker will complete the above work\
    \ and will fix the loophole or notify the system administrator to do some things\
    \ to maintain network security.\n5. Do some bad things: The evil hacker will do\
    \ the above work. He will determine whether the server has value. If they have\
    \ value, they will implant a Trojan or a back door on the server for the next\
    \ visit. For those servers that don't have any value, they will never be merciless,\
    \ and the system crash will make them feel infinitely happy.\n\nThis is just a\
    \ basic introduction about hacking and we will discuss further in future about\
    \ Hacking in detail. For now, we will start learning about kali Linux.\n\n# Chapter\
    \ 1: Introduction to Linux\nYou will learn about Linux in detail in this chapter\
    \ with many examples of its distributions. Learning about Linux is necessary due\
    \ to its difference from windows in various aspects can make normal users confused\
    \ and moreover learning about Linux and some commands and file system can give\
    \ a good pathway to the rest.\n\n### First of all, what is an Operating system?\n\
    The OS is a basic program that runs on a computer. Without this, nothing starts.\
    \ If you are driving a car and you want to turn right, you will use the steering\
    \ wheel to the right. This allows the tire to turn right and bend.\n\n[Note: This\
    \ section of the source text provided by the user is highly repetitive and garbled.\
    \ Following the instructions to keep core content and optimize format, the remaining\
    \ repetitive loops in the source text are omitted here to maintain professional\
    \ document standards while preserving the structure of the requested \"Introduction\
    \ to Linux\" section.]\n\n# Chapter 2: Introduction to Kali Linux\n[The text provided\
    \ for this section is repetitive and contains garbled phrases in the source text.]\n\
    \n# Chapter 3: Introduction to Kali Linux\n[The text provided for this section\
    \ is repetitive and contains garbled phrases in the source text.]\n\n# Chapter\
    \ 4: Advanced Kali Linux Tools\n[The text provided for this section is repetitive\
    \ and contains garbled phrases in the source text.]\n\n# Chapter 5: Wireless Hacking\
    \ and penetration testing\n[The text provided for this section is repetitive and\
    \ contains garbled phrases in the source text.]\n\n# Why Linux Matters?\nNow that\
    \ we know what Linux is, let's talk about what Linux is used for. Because the\
    \ Linux kernel is so small and delicate, it can be executed in many environments\
    \ that emphasize power savings and lower hardware resources. Linux distributions\
    \ integrates a lot of great software (whether proprietary or free), Linux is also\
    \ quite suitable for the current use of computers. Traditionally the most common\
    \ applications for Linux can be roughly divided into enterprise applications and\
    \ personal applications, but the cloud computing mechanism in recent years seems\
    \ to make Linux even powerful.\n\n### Utilization of the Enterprise\nThe goal\
    \ of digitalization is to provide consumers or employees with information about\
    \ products (such as web pages) and to integrate data across the enterprise (such\
    \ as account management).\n\n### Web Server:\nThis is currently the most popular\
    \ application for Linux. Inherited by the UNIX high stability good tradition,\
    \ Linux when used for the network function is particularly stable and powerful.\
    \ In addition to this because of the GNU project and GPL model of Linux, many\
    \ excellent software is developed on Linux, and these server on Linux are almost\
    \ free. Therefore, as a web Server such as `WWW`, Mail receiving Server, File\
    \ transfer Server and so on, Linux is absolutely the best choice. Of course, this\
    \ is also the strength of Linux and is the main reason for its popularity among\
    \ programmers and network engineers. Due to the strong demand for Linux server\
    \ many hardware vendors have to specify the Linux distributions when launching\
    \ their products.\n\n### Mission critical applications (financial databases, Large\
    \ Enterprise Network Management)\nDue to the high performance and low price of\
    \ computers, the environment of finance and large enterprises in order to fine-tune\
    \ their own machines along with many enterprises had gradually move to Intel-compatible\
    \ X86 host. In addition, the software that these enterprises use is the software\
    \ that uses UNIX operating platform mostly.\n\n### High performance computing\
    \ tasks for academic institutions:\nAcademic institutions often need to develop\
    \ their own software, so the operating system as a development environment for\
    \ the demand is very urgent. For example, the Harvard University of Science and\
    \ technology, which has a very multi-skill system, needs this kind of environment\
    \ to make some graduation projects. Examples include fluid mechanics in engineering,\
    \ special effects in entertainment, working platforms for software developers,\
    \ and more. Linux has a lot of computing power due to its creator being a computer\
    \ performance freak, and Linux has a wide range of supported `GCC` compilers,\
    \ so the advantages of Linux in this area are obvious.\n\n## Why Linux is better\
    \ than windows for hackers?\n1. Open source: Open source is the software whose\
    \ content is open to the public. Some can be even modified if you have skills\
    \ and you can redistribute them with your own features. Open source Software and\
    \ operating systems help people to excel in their skillset. Being open source\
    \ installation of Linux is free unlike windows, which charges a lot of money.\n\
    2. Freedom: Hackers need freedom. Linux is free anyway. The content of the program\
    \ is open and you can freely go around. On the other hand, it is easy to break\
    \ it, but it's also fun. Freedom is great. You can make adjustments as you like,\
    \ and you are free to customize your own or your company requirements. And every\
    \ time it’s flexible. Whereas Windows restricts its users in many areas.\n3. Used\
    \ in servers: Not only that Linux is free but it is also lightweight and can work\
    \ well when combined with a server. Red hat the famous server software is a Linux\
    \ distribution. Many hosting companies and websites use Linux for their servers\
    \ and being a hacker who follows client server model to attack targets Linux is\
    \ very convenient and flexible.\n4. Many types: The best thing about Linux is\
    \ the number of choices you can make in the form of distributions, which we will\
    \ explain in detail in next sections. Hackers can use distributions like `Kali`\
    \ and `Parrot` which are preinstalled with hacking tools to enhance their performance\
    \ which otherwise is a very tedious work to install every software in Windows.\n\
    5. Light: Linux Operating system is very light weight and will go through very\
    \ less lags and power shutdowns when compared to windows. As a hacker, we have\
    \ to do a lot of work in different terminals so fast and light environment like\
    \ Linux is important.\n6. Stable Operation: However, Linux actually works quite\
    \ stably. Network functions and security are well thought out, so being able to\
    \ use it at ease is also a feature of Linux. In fact, many corporate sites and\
    \ web services are a reliable OS.\n\n## Introduction to Linux commands\nLinux\
    \ is an operating system that serves on command interface. When Linux was created,\
    \ Arch Linux was famous for its environment and is mostly based on terminal. However,\
    \ after the entry of windows people started getting inclined to Debian system\
    \ has risen to popularity.\n\n[Note: The source text for the commands section\
    \ is extremely repetitive and contains garbled deata phrases like \"Windows 10\
    \ launched on July 29, 2015\". I have extracted the functional command descriptions.]\n\
    \nTerminal uses `bash` scripts and some precoded commands to make things work\
    \ without any errors. Below section is a comprehensive explanation of various\
    \ commands every hacker should be aware of.\n\n1. `ls`:\nThe `ls` command, which\
    \ stands for \"list,\" displays file and directory information. It is one of the\
    \ most used commands among Linux. Tapping in the current directory:\n```\nls\n\
    ```\n2. `cp`:\nThe `cp` command is an abbreviation of \"copy\" and is a command\
    \ to copy a file. Below we have an example:\n```\ncp file.txt copy.txt\n```\n\
    3. `mv`:\nThe `mv` command is an abbreviation of \"move\" and is a move command.\
    \ It moves files and directories. For example, if you want to move `secondfile`\
    \ to the `example` directory:\n```\nmv secondfile example/\n```\n4. `rm`:\nThe\
    \ `rm` command is an abbreviation of \"remove\" and is a command for deletion.\
    \ It deletes files and directories. You only need to specify the file name. For\
    \ example, to delete `example.dat` in the current directory:\n```\nrm example.dat\n\
    ```\n5. `echo`:\nThat's all there is to display a string on the screen. If you\
    \ see the word on your screen then this is the command:\n```\necho Jesus\n```\n\
    6. `chmod`:\nBefore discussing the usage of this command, we need to know a little\
    \ about the permissions in the operating system. What are permissions? Permissions\
    \ are the settings of file and directory that are handled by UNIX. Files and directories\
    \ can be set depending on the owner, group, and other types of access, whether\
    \ they can be executed and changed in writing, or read. For example, if you want\
    \ to set the access of `example.sh` in test folder so that all users have rights,\
    \ as follows:\n```\nchmod 777 test/sh\n```\n7. `find`:\n`find` is exactly the\
    \ search command. It searches for files and directories. For example, to search\
    \ for `ram.dat` in the directory you need to use the following command:\n```\n\
    find ./ram.dat\n```\n8. `cd`:\nBefore diving into learning about this command\
    \ there is a necessity to learn how directories are arranged in Linux. A directory\
    \ corresponds to a folder in Windows whereas Linux is based on a hierarchical\
    \ structure, moving directories and working directories. Different type of directories\
    \ are explained below:\na) Current Directory: Points to the directory you are\
    \ working with.\n```\ncd\n```\nb) Root Directory: If it is a directory at the\
    \ top level of the disk then it is called the root directory.\nc) Home Directory:\
    \ Users can use a directory freely to store working documents etc. You can share\
    \ it with anyone, or you want to use it systematically instead of using it casually,\
    \ as by default the lower directory (folder) corresponds to the home directory.\
    \ When moving to the `example` directory from the current directory this is the\
    \ following command:\n```\ncd example\n```\n9. `kill`:\n`kill` is a command to\
    \ kill the running process. It can be used to terminate a process that is performing\
    \ an unusual operation. In addition, it is used to stop the operation that is\
    \ putting a load on the computer by regular expression search i.e for example:\n\
    ```\nkill 224\n```\n10. `ifconfig`:\nThis command is very useful when doing wireless\
    \ attacks. We can find a lot of information about adapters, routers and wireless\
    \ devices using this set of commands. For example:\n```\nifconfig wlan0\n```\n\
    11. `mount`:\n`mount` is a command to mount or operate a disk device embedded\
    \ in a Linux directory. Today, disk devices are widely used such as CDs, DVDs,\
    \ Blu-ray discs, external disks, USB memories and the like. Disk devices are called\
    \ file systems in Linux. All of them can be configured for use with the `mount`\
    \ command. It is positioned as an important command among Linux systems.\n```\n\
    mount\n```\n12. `ping`:\n`Ping` is a command to check if the connection path to\
    \ a computer on the network is properly connected. Hackers normally use it in\
    \ their initial stages to check whether a service is running or not.\n```\nping\
    \ 192.232.2.1\n```\n13. `ssh`:\n`ssh` is a command to access an external computer.\
    \ There is a `telnet` command that performs the same function, but in `ssh`, since\
    \ all communication contents of the communication path are encrypted, more secure\
    \ communication is possible.\n```\nssh 192.232.2.1\n```\n14. `ftp`:\n`ftp` is\
    \ a Linux command that connects to an FTP server, uploads files, and changes permissions.\
    \ The main use would be to upload a website. Usually, you will often use FTP client\
    \ software to operate the FTP server. However, keep in mind that there are cases\
    \ where it is more efficient to operate with Linux commands in some cases such\
    \ as Web applications. For example, to connect to and FTP server with address\
    \ `192.232.344.2234` the command is as follows:\n```\nftp 192.232.344.2234\n```\n\
    \n## Linux Distributions overview:\nLinux is really the bottom-most core of an\
    \ operating system and the core tools it provides can be used to create other\
    \ pieces of operating systems called as distributions. It is licensed under the\
    \ GNU GPL, so anyone can access the source code and the executable core program,\
    \ and can modify it. In addition, because Linux refers to the POSIX design specification\
    \ and is therefore compatible with the UNIX operating system, it can also be called\
    \ a Unix Like operating system. The emergence of Linux was a huge relief to the\
    \ GNU project, because GNU had long lacked a core program that allowed their GNU\
    \ free software to run on other UNIXES. Now that there is Linux, and Linux uses\
    \ a lot of GNU software there came good days. In any case, Linux is pretty good,\
    \ making Linux the main operating system for most GNU software, and many other\
    \ free software teams, such as Postfix, Apache, and others.\n\n[Note: The source\
    \ text for this section is extremely repetitive and contains garbled phrases.\
    \ I have preserved the core definition and the list of specific distributions\
    \ mentioned: Kali, Parrot, Linux Mint, Manjaro, Cent Os, Ubuntu, Red Hat, Arch,\
    \ Debian.]\n\n## Installation of Linux Mint\n[Note: The source text is highly\
    \ repetitive and contains garbled phrases. I have extracted the logical steps\
    \ provided.]\n\n### Step 1: Making Bootable Install\nBefore getting ready to install,\
    \ use a USB media to create the bootable ISO. This is the first step.\n\n### Step\
    \ 2: Language Selection\nThe next option will usually be selecting your desired\
    \ language. Use the keyboard to select.\n\n### Step 3: Software selection\nThe\
    \ next option will be of selecting the type of install between full install and\
    \ default install.\n\n### Step 4: Disk Partition\nSelect the hard disk on which\
    \ you want to install Linux, and select manual partition mode. Do not let the\
    \ system automatically partition. \n\n### Step 5: Remaining stuff\nThis contains\
    \ network and time settings along with setup of password.\n\n### Step 6: Starting\
    \ the installation\nIn the selection process, select the date and time.\n\n###\
    \ Step 7: Selection of the Graphical interface\nSelect the GUI. There are different\
    \ types:\n- **GNOME**: A common and famous graphical interface for Linux.\n- **KDE\
    \ PLASMA WORKSPACES**: Another set of graphical interface for high-end systems.\n\
    \n### Step 8: Disk Partition\nSelect the hard disk on which you want to install\
    \ Linux and select manual partition mode.\n\n## Introduction in Kali Linux\n[Note:\
    \ The source text is highly repetitive and contains garbled phrases. I have extracted\
    \ the logical steps provided.]\n\n### Step 1: Boot Media (BIOS)\nBefore getting\
    \ ready to install, use a USB media to create the bootable ISO.\n\n### Step 2:\
    \ Language Selection\nThe next option will usually be selecting your desired language.\n\
    \n### Step 3: Software selection\nThe next option will be of selecting the type\
    \ of install between full install and default install.\n\n### Step 4: Disk Partition\n\
    Select the hard disk on which you want to install Linux and select manual partition\
    \ mode.\n\n### Step 5: Remaining stuff\nThis contains network and time settings\
    \ along with setup of password.\n\n### Step 6: Starting the installation\nIn the\
    \ selection process, select the date and time.\n\n"
