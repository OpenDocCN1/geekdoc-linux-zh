    - `Flags` - check the value of tcp flags.\n- `Seq` - check the value of the tcp\
    \ sequence number.\n- `Ack` - Checks the value of the tcp response (acknowledgement).\n\
    - `Window` - Tests the special value of the TCP window field.\n- `Iype` - checks\
    \ the value of icmp type.\n- `Icode` - check the value of icmp code.\n- `Icmp_id`\
    \ - Check the value of the ICMP ECHO ID.\n- `Icmp_seq` - Checks the value of the\
    \ ICMP ECHO sequence number.\n- `Content` - searches for the specified style in\
    \ the payload of the package.\n- `Content-list` - Search for a collection of patterns\
    \ in the packet payload.\n- `Offset - content` - The modifier of the option, which\
