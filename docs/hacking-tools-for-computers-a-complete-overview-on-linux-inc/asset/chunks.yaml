    the above command tells 192.168.6.232(the target host) that the gateway''s Mac
    address is 00\. When the target host receives the message, it modifies the ARP
    entry in the ARP cache table. It does not stop automatically after you execute
    the above command. If you don''t need to attack, press CTRL + C to stop the attack.(3)
    View information about the target host''s access URL address. Execute the command
    as follows:root@kali:~# urlsnarf -i eth0The output above shows the target host''s
    access to the Internet(4) Users can also use the Driftnet tool to capture images
    viewed by the target system. Execute the command as follows:root@kali:~# driftnet
    -i eth0After you execute the above command, a window will open. When the target
    host accesses a web page with a picture, it is displayed in that window.(5) Now
    go to the target host and access the Internet to generate the capture information.
    For example, if you randomly access a Web page through a browser on the target
    host, the attack host will display the interface(6) The interface displays all
    the images accessed on the target host. Users can now click on any of the images,
    which will be saved to the Kali Mainframe. The following message will appear under
    the DRIFTNET command:root@kali:~# driftnet -i eth0As can be seen from above, the
    images captured by driftnet are saved. The file names are driftnet-* . PNG, and
    these files are saved by default in the current directory.(7) Users can view it
    using the image viewer that comes with Linux.Penetration testingWe all know that
    professional hackers that are ethical are also called as penetration testers.
    They usually work for companies to make their security better and not prone to
    attacks. Penetration testing follows a certain strategy and guidelines just like
    any other IT methodology. We will just go through around it for some time.Purpose,
    procedure and method of pen testingAs mentioned in the previous chapters the white-capped
    hacker is entrusted by the peddler to attack, so the target and scope of the attack
    can be limited according to the needs of the peddler. This type of attack based
    on the content of the agreement is called "penetration test". (Penetration Test,
    referred to as Pentest or PT). "Penetration Test" aims to discover information
    assets and Risks to provide appropriate risk management. Why do companies or organizations
    need penetration testing? When information systems go online to provide services,
    hackers will continue to try to attack, whether the system can stand the test,
    and through penetration testing, the business owners can:* Understand the ways
    that intruders may use• Information & Improper disclosure or tampering• Network
    architecture design issues• Firewall setup issues• System and application vulnerabilities•
    System and application setup issues■ Understanding system and network security
    strengths• How long it takes to evaluate an intruder with equal capabilities Time
    invasion success• Assessment was met the extent of the impact of the invasion•
    Assess the implementation of the safety policy■ Understand weaknesses, enhance
    security• Strengthen system and network security• Reduce post-invasion losses
    Wiki (WiKi)The claim for penetration testing is: By attacking computer systems,
    to discover possible security weaknesses in the system, Access to system, program
    features, or sensitive data. The general statement is: Use the hacker''s point
    of view, technology, and tools to mimic the hacker''s attack techniques against
    the target system, in order to identify weaknesses or vulnerabilities in the system,
    and provide customer repair suggestions as a means of system enhancement.The scope
    of the penetration test when the hacker is interested in the organization, will
    find ways to enter the organization, as far as the attack is concerned, the target
    of the start is divided into small: to a single system: for example, a website
    that provides a specific service, Like a shopping site, its backend or has many
    supported systems However, the main attack limit is limited to the features offered
    on the shopping site, and this category is mostly part of the website penetration
    test.■ Server:For the penetration of specific devices or computers that provide
    one or more services, the pervasive method that can be used depends on the type
    of service provided by the server. The most commonly tested object.■ Segment or
    host farm ( serverfarm ):Sometimes the specific website or server is easy to implement
    due to the small attack area. However, the defense mechanism of each system may
    be uneven between hosts in the same segment. The vulnerability of the B host is
    used as a springboard to reach the attack A host. The goal of. So open section
    testing can identify potential vulnerabilities.■ System-wide:Test all relevant
    information systems of the organization. The concept is the same as the segment
    or host group. When the testable range is larger, the organization''s security
    protection capability can be better seen.■ Personnel safety:Information systems
    or applications Software is usually handled by specialized information personnel.
    In the awareness of security, information personnel should be higher than the
    average staff. Look for objects with lower security awareness for social engineering
    to obtain basic (or even high-right) use rights, sometimes can invade the target
    system faster.■ All institutions:When the organization is open to testing all
    assets, this situation is most close to the hacker attack, but because the scope
    of penetration testing is too broad, it is relatively difficult to have a complete
    and comprehensive evaluation results, few institutions will handle all Infiltration
    testing of the organization. I think the penetration test should be■ Health check
    is not an attack:Penetration testing is to find out the existing weaknesses as
    early as possible. As a basis for improvement, the implementation of the penetration
    test must take into account the continuous operation of the system, and it is
    necessary to prepare the countermeasures for the system to stop the service in
    advance.■ Is an audit, not a steal:Penetration testing can confirm the organization''s
    the degree of implementation of the communication security policy is an auditing
    behavior. After the penetration test is completed, the relevant information must
    be completely handed over to the entrusting party as a strategic reference for
    continuously improving the security of the communication.■ Protection is the purpose
    of the test:The weaknesses found in the penetration test; the tester must propose
    the corresponding protective measures for the client is involved.The method for
    handling the penetration test operation is hereinafter referred to as Party A,
    and Party B is responsible for performing penetration test.■ Black box:Party B
    only knows the name or URL of the target to be tested. Other information must
    be collected by itself during the testing activity. Using the black box test,
    is testing the hacking skills of Party B, because this pattern is closest to the
    actual hacking attack.■ White Box:Party A will provide information on the target
    as much as possible, so that Party B can focus on finding the weaknesses (vulnerabilities)
    of the system under test, and use the white box test to test the system''s security
    protection ability.■ Gray box:Of course, sometimes Party A is not then, the information
    of the system under test (such as the system developed by the outsourcing system)
    cannot provide the complete information of the target to be tested. Party B cannot
    obtain the system information in advance, but Party A still assists Party B to
    obtain the equivalent information as much as possible. The box is between the
    black box and the white box Test Methods.■ Double black box:Sometimes Party A
    wants to test as much as possible in the context of simulating hacking attacks.
    It is necessary not only to test the protection capabilities of the system, but
    also to test the alertness or resilience of its own personnel. Secretly entrusting
    Party B to conduct infiltration operations, relevant the personnel did not know
    the penetration test, and Party B could not get detailed information about the
    system under test. Therefore, both offensive and defensive sides are competing
    in the dark, so it is called a double black box (or double-blind) test.■ Double
    white box:As opposed to double black box, both sides know each other''s existence,
    the main purpose is to assist Party B. Party A finds and confirms system vulnerabilities.By
    this, we have completed our journey into kali Linux and its tools and will go
    on to discuss further more in our next module. Always remember that hackers are
    not theoretical. Hackers do things. So, after reading this make yourself ready
    to experiment things. All the Best!ConclusionThank you for making it through to
    the end of Hacking tools for computers, let’s hope it was informative and able
    to provide you with all of the tools you need to achieve your goals whatever they
    may be.The next step is to practice hacking by following different examples available
    in the internet. The most important thing you need to remember being a hacker
    is to be ethical. Always try to get permission before attacking any targets.If
    you want to master hacking further, we have another module that explains in detail
    other hacking tools and about scripting that is necessary for hackers. Hacking
    can be a good career to if you can concentrate well without any deviation.This
    book roughly started from the very beginning that is my installing linux mint
    and all the way we have gone to wireless hacking methods. We have discussed a
    numerable example of Code to make things better understand for beginners. Some
    tools in kali are explained in detail. But in the next part of this book, we have
    more interesting content.What didn''t we cover in this book?* Hacking is all about
    protection. Every hacker use VPN to protect his identity from police or other
    hackers. Normally hackers use TOR bundle to create a bridge that can act as a
    proxy. In our next book, "Hacking with Kali Linux" this is described in detail.*
    Hacking and programming is always the opposite. Programming is about building
    things where as hacking is called as breaking things. Programmers may not need
    to learn about system protection and vulnerabilities that product can get affected
    with but hackers should learn scripting for automating things while hacking. In
    our next book, “Hacking with Kali Linux”, python scripting is introduced for hackers.Try
    to google about penetration testing and bug bounty hunting to get a touch with
    them. Always try to challenge yourself with difficult things, which will make
    you enjoy the game more. Thank you for joining our wonderful journey into the
    world of hacking and its beauty. Go get some vulnerabilities now.Finally, if you
    found this book useful in any way, a review on Amazon is always appreciated!'
