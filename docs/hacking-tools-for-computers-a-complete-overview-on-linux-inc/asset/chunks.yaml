- fmt: "\nDescription: These two parameters are related to John's internal brain,\
    \ and there is no direct relationship with the crack itself, so the omission is\
    \ not introduced.\n\nSnort is an open source software that is available in kali\
    \ linux and is famously known for its intrusion detection system (NIDS) written\
    \ in C. It Support windows, Linux platform, I prefer Linux operating system, so\
    \ learn to study snort on Linux. Snort has three modes of operation, including\
    \ sniffing, logging packets, and intrusion detection.\n\n## Snort's rule options\n\
    \nAll snort rule options are separated by a semicolon `;`. Rule option keywords\
    \ and their arguments are separated by a colon `:`. According to this approach,\
    \ there are 42 rule option keywords in snort, which can help us to perform various\
    \ operations like sniffing and logging packets. Sky is the limit for what we can\
    \ do with Snort because it is so complex and useful.\n\n- `Msg` - Print a message\
    \ in the packet logs.\n- `Logto` - logs the package to a user decided file instead\
    \ of logging to standard format.\n- `Ttl` - Check the value of `ttl` of the ip\
