    assigns the drive to the A ~ Z code, as we often say C:, but there is no such
    concept in Linux, Linux path always starts from / (root), no matter how many drives
    , mount (mount) to a specific subdirectory (or grandchild directory) in the root
    directory, this is for people who are used to Windows systems. More difficult
    to adapt.In windows system:"C:\Kalilinux\kindlebook.pdf"In Linux (Kali Linux too
    obviously) system:" /kalilinux/kindlebook.pdf "Different type of directories are
    present in kali Linux. They are explained in brief in the below section.1) /usrThe
    Unix Software Resource is probably the directory where the application is installed.
    In particular, /usr / bin is where the executable instructions are stored.2) /varThe
    resource file required for the execution of the application or the data staging
    area of the execution process, where / Var / run stores the application information
    in execution, and / Var /lock stores the currently Locked resources.3) /homeThe
    home directory of all users (except root) is a bit like Win7''s users or XP''s
    "Documents and Settings". Each new user is assigned a corresponding set of subdirectories.
    Regardless of which directory you are currently in, you can use cd ~ to go back
    to your home directory. The root directory of root is /root, which is a special
    place.4) /tmpIn the general temporary zone, it is recommended to clear the data
    in /tmp after a period of time to recover the disk space.5) /binThe general executable
    file directory, the program in this directory can also be executed in stand-alone
    mode, which can be regarded as the basic command area of the system.6) /devIn
    Linux, any device and peripheral devices are provided in the form of files. The
    files corresponding to these devices or the surrounding files are stored in /dev.7)
    /etcThe configuration file is stored in the directory, especially related to the
    startup service /etc/init.d or /etc/sysconfg/etc.8) /mnt vs /mediaAs a management
    directory for media mounts, when we insert the pen drive, Kai automatically mounts
    it to /media bottom and bottom, and manual mounts recommend using /mnt. The mount
    point is not mandatory. It must be in /mnt or /media, or /media | select other
    directories (such as /tmp), just follow the conventions and it is easier to communicate.9)
    /libThe system function is placed in the directory, the concept of the library
    is like the Windows .DLL file, and / ib is the library that is needed to execute
    the system program.e) Remote Desktop in Kali LinuxKali Linux has a remote desktop
    facility and can be used for a maximal performance. Hackers often use Remote desktops
