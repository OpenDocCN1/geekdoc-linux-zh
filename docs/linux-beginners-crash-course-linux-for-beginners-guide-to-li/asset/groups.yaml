    # # Kernel sources


    The kernel sources can be found in most Linux distributions. The Linux kernel
    that you install onto your system was developed using these sources. They can
    be found at ftp://ftp.cs.helsinki.fi and are shadowed on other websites. If you
    don''t have Internet access, you can get hold of a CD ROM from vendors who offer
    snapshots of prominent websites for a reasonable price. Some vendors also offer
    subscription services with periodic updates. Your local Linux user group is another
    excellent alternative.


    Several directories can be found at the highest level of the source tree /usr/src/Linux:


    +   **Arch:** The kernel code specific to the architecture is present in this
    subdirectory. It is further divided into subdirectories, one for each architecture.
    Alpha and i386 are examples of the subdirectories.


    +   **Include:** The include files required for building the kernel code are present
    in this subdirectory. It is also divided into one subdirectory for each architecture.
    Editing the kernel makefile and then rerunning the configuration program of the
    kernel can change the architecture.


    +   **Init:** The kernel''s initialization code is present in this directory.
    To understand the working of a kernel, this could be a good place to start.


    +   **MM:** Files related to memory management are present in this directory.
    The code related to the memory management for each architecture is present in
    arch/*/mm/.


    +   **Drivers:** This contains the device drivers of the system, which are classified
    into different classes.


    +   **IPC:** The code for inter-process communication is present in this directory.


    +   **Modules:** The modules are created and held by this directory.


    +   **FS:** The code of the file system is present in this directory. This directory
    has several subdivisions, one for each file system.


    +   **Kernel:** This consists of the kernel code. The kernel code specific to
    the architecture can be found in arch/*/kernel.'
  - '[PAGE 27]


    **Net:** This is the networking code of the kernel.


    **Lib:** The library code of the kernel is present in this directory. The library
    code specific to an architecture is present in arch/*/lib/.


    **Scripts:** The scripts that are used during the configuration of the kernel
    are present in this directory.'
  - '[PAGE 28]


    # Chapter 4: Linux Processes'
  - '[PAGE 29]


    # **task_struct**


    For Linux to deal efficiently with the processes taking place in the system, a
    data structure called task_struct is used to represent each of those processes.
    (In Linux, the terms process and task are interchangeable.) The data structure
    task_struct has an array of pointers known as the task vector.


    The task vector’s size limits the number of processes happening in the system.
    The maximum number of entries is 512 by default. Creation of a new process results
    in the allocation of a new task_struct from the memory. Adding it into the task
    vector completes the creation. The current pointer points to the current running
    processes so that they are easier to find.


    In addition to the normal process, Linux also supports real-time processes. These
    real-time processes are so named because they are expected to respond very swiftly
    to external requests. The scheduler treats them a bit differently than the normal
    processes. The complex data structure task_struct is made simpler by dividing
    it into the following functional areas:


    # *State*


    The state of a process gets changed after its execution, depending on the circumstances.
    Each Linux process has one of the following states:


    Running


    In this state, the process is ready to run or is currently running in the system.
    Ready to run means the process is ready to be taken up by one of the system processors
    for execution.


    Waiting


    The waiting state means the process is waiting for a resource or for the occurrence
    of an event. Waiting processes are differentiated into two types: interruptible
    and uninterruptible. Signals can interrupt certain waiting processes, which are
    termed interruptible; waiting processes which the signals cannot interrupt are
    termed uninterruptible.


    Stopped


    A stopped process has, of course, been stopped, usually by receiving a signal.
    A process needs to be in the stopped state to be debugged.


    Zombie'
  - '[PAGE 30]


    This is a dead process consisting of the data structure `task_struct` in the task
    vector. Hence, it is known as a zombie.


    # ***Scheduling information***


    This is the information which the scheduler uses to decide the order in which
    the processes should run.


    # ***Identifiers***


    A numerical process identifier identifies every process in a system.'
  - '[PAGE 31]


    # Inter-process communication (IPC)


    The important IPC mechanisms supported by Linux are signals, pipes, message queues,
    shared memory, semaphores etc.; you will learn them in detail in following chapters.'
  - '[PAGE 32]


    # Links


    Processes are not independent of one another in a system running on Linux. All
    processes have parent processes. The only process that does not have a parent
    process is the initial process. No new processes are created; instead, they are
    cloned from processes that have occurred previously. The task structure that represents
    a process points to the parent process and also to the siblings (processes that
    share the same parent). The ps tree command can be used to view the relationships
    that run between the processes:


    init(1)→-crond(98)


    +   • -emacs(387)

    +   • -gpm(146)

    +   • -inetd(110)

    +   • -kerne ld(18)

    +   • -kflushd(2)

    +   • -klogd(87)

    +   • -kswapd(3)

    +   • -login(160)---bash(192)---emacs(225)

    +   • -lpd(121)

    +   • -mingetty(161)

    +   • -mingetty(162)

    +   • -mingetty(163)

    +   • -mingetty(164)

    +   • -login(403)---bash(404)---pstree(594)

    +   • -sendmail(134)

    +   • -syslogd(78)

    +   • -update(166)'
  - '[PAGE 33]


    # Times & timers


    Another important duty of the kernel is keeping track of the time taken for creating
    a process. It also keeps track of the CPU time consumed by the process during
    its lifespan. As the clock ticks, the kernel keeps on updating the time spent
    by the current process in the system.'
  - '[PAGE 34]


    # File systems


    Linux is very flexible when it comes to supporting a wide variety of file systems.
    This helps it coexist with other popular operating systems. Linux supports a total
    of 15 file systems. They are:


    +   - ext

    +       - ext2

    +       - vfat

    +       - affs

    +       - minix

    +       - sysv

    +       - hpdfs

    +       - ncp

    +       - umsdos

    +       - iso9660

    +       - ufs

    +       - xia

    +       - msdos

    +       - smb

    +       - proc


    Many more file systems will be added in future. The processes are free to open
    or close any file they need.'
  - '[PAGE 35]


    # Virtual memory


    Most processes use virtual memory. It is the duty of the Linux kernel to track
    the mapping of virtual memory to the physical memory. Some processes, such as
    daemons and kernel threads, do not use virtual memory.'
  - '[PAGE 36]


    # Processor specific context


    One can think of a process as an aggregate of the current state of the system.
    When a process runs, it uses the registers of the processors, stacks etc., and
    that is the context of the process. After the suspension of the process, the context
    of the process must be saved in the task_struct data structure so it can be restored
    when the process is restarted.'
  - '[PAGE 37]


    # # How Linux organizes data


    An effective operating system should organize its data well, and Linux does so.
    In this chapter, we will learn how. If you have worked with other operating systems,
    like Microsoft Windows, you''ll probably find it easy to understand, because most
    operating systems organize their data in similar ways.


    # *Devices*


    Linux receives, stores and sends its data to and from devices. Every device corresponds
    to a hardware unit like a serial port keyboard, but it is not necessary for a
    device to have a hardware counterpart. The kernel can create many pseudo-devices
    that act like devices but do not physically exist. A given hardware unit can have
    more than one device connected to it; for example, the Linux operating system
    will show the partitions of a disk drive as separate devices.


    Some of the typical Linux devices are listed in the table given below:


    | Device | Description |

    | :--- | :--- |

    | atibm | Bus mouse |

    | audio | Sound card |

    | cdrom | CD-ROM drive |

    | console | Current virtual console |

    | fd n | Floppy drive (n designates the drive; for example, fd0 is the first floppy
    drive) |

    | ftape | Streaming tape drive not supporting rewind |

    | hd xn | Non-SCSI hard drive (x designates the drive and n designates the partition;
    for example, hda1 is the first partition of the first non-SCSI hard drive) |'
