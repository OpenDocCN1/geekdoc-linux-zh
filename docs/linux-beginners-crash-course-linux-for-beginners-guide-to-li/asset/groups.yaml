    drwxr-xr-x 2 Simon users 4096 May 05 17:25 public_html

    ```


    使用命令行选项 (-l) 运行 ls 表示我们要执行长列表显示，其内容包括：


    - 第一个字符指示文件类型 – 普通文件 (-) 或目录 (d)

    - 随后的九个字符是文件或目录的权限

    - 下一个字段是块的数量

    - 下一个字段指示文件或目录的所有者

    - 下一个字段指示目录或文件所属的组

    - 接着是文件大小

    - 接着是文件修改时间

    - 最后 是目录或文件的名称


    ```bash

    ls /etc

    ```


    ```bash

    a2ps.cfg aliases alsa.d cups fonts my.conf systemd

    ...

    ```


    这一次，ls 是带有一个命令行参数 (/etc) 运行的，这告诉 ls 不应列出当前目录；而是应该列出该目录的内容。（省略号 (...) 表示部分输出被删减以节省空间；如果你实际运行此命令，将获得更长的目录和文件列表。）


    ```bash

    ls -l /etc

    ```


    ```bash

    total 3

    -rwxr-xr-x 2 root root 123 Mar 23 13:34 a2ps.cfg

    -rwxr-xr-x 18 root root 78 Feb 17 09:12 aliases

    drwxr-xr-x 2 Simon users 4096 May 05 17:25 alsa.d

    ...

    ```


    现在 ls 是带命令行选项和命令行参数一起运行的，结果是 /etc 目录的长列表。


    ## 路径


    在上述最后的几个命令中，我们开始引入路径的概念。学习这些路径是什么以及如何运用它们至关重要，因为在未掌握这一点之前，你无法精通 Linux 语言。当我们在命令行讨论某个目录或文件时，我们谈论的就是一个路径。就像在现实世界中一样，路径是到达某处的方式，在这里是指系统中特定的目录或文件。


    ### 绝对路径与相对路径


    我们使用两种不同的路径——绝对路径和相对路径——来引用目录或文件。两者都可以使用，因为它们都会带你到达系统中的同一位置。首先，你需要了解 Linux 具有所谓的分层结构。最顶端是根目录，由单个斜杠
    (/) 表示。根目录包含子目录，这些子目录又有自己的子目录，依此类推。其中任何一个子目录都可以包含文件。


    绝对路径指定相对于根目录的特定文件或目录。它们可以通过都以斜杠开头这一特征来识别。相对路径指定相对于你在系统中当前位置的文件或目录，并且不以斜杠开头。


    看看这个例子：


    ```bash

    pwd

    ```


    ```bash

    /home/Simon

    ```


    通过运行 pwd 确认当前位置。


    ```bash

    ls Documents

    ```


    ```bash

    file1.txt file2.txt file3.txt

    ...

    ```


    现在 ls 是带有相对路径运行的。当前位置是 Documents 目录，但此命令的结果取决于你在系统中的位置。如果你在其他系统用户的家目录中，它会为你提供该用户
    Documents 目录内容的列表。


    ```bash

    ls /home/Simon/Documents

    ```


    ```bash

    file1.txt file2.txt file3.txt

    ...

    ```


    最后，ls 是带有绝对路径运行的。此命令不依赖于你在系统中的位置；无论你在哪里，结果都将完全相同。


    ## 构建单元


    当你学习 Linux 时，很快就会发现有很多不同的方式来完成事情。以下内容被称为构建单元，它们将帮助你构建路径：


    - ~（波浪号）– 家目录的快捷方式。例如，如果你的家目录叫 /home/Simon，你可以用路径 /home/Simon/Documents 引用 Documents
    目录，或者只需输入 ~/Documents。

    - .（点）– 指向当前目录的引用。回想前面我们使用相对路径引用 Documents 的例子。我们也可以写成 ./Documents。

    - ..（双点）– 指向父目录的引用。如果你想继续在层次结构中向上遍历，可以在单个路径中使用任意次。例如，如果你在 /home/Simon，你可以简单地输入
    ls ../.. /，就会得到根目录的列表作为输出。


    现在你可以看到，你可以用多种方式引用位置。至于该使用哪种方式，答案是你可以使用其中任何一种。如果你在命令行引用目录或文件，就是在引用一个路径，而该路径可以由我们讨论过的任何元素组成。最好的方式就是你觉得最容易的方式。


    看看这些例子：


    ```bash

    pwd

    /home/Simon

    ls ~/Documents

    file1.txt file2.txt file3.txt

    ...

    ls ./Documents

    file1.txt file2.txt file3.txt

    ...

    ls /home/Simon/Documents

    file1.txt file2.txt file3.txt

    ...

    ls ../..

    bin boot dev etc home lib var

    ...

    ls /

    bin boot dev etc home lib var

    ```


    试着在你的系统命令行中输入这些命令——我保证它们会开始让你更有意义。务必花时间彻底学习有关路径的知识并真正理解它们；你将大量使用它们。


    '
