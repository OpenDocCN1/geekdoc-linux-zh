    Tab 键调出自动补全。如果没有变化，这意味着路径有多种补全可能性。再次按 Tab 键将显示这些可能性。继续输入你的路径，然后再次按 Tab 键以将可能性缩小到正确的那一个。在你的命令行上试一试，看看效果如何。


    ### 文件


    在 Linux 中，一切皆文件。目录、文本文件，甚至你的键盘（但仅限于你的系统可以从中读取的那个）——它们都是文件。你的系统向其写入内容的显示器也是一个文件。这不会对你所做的任何事情产生影响，但你应该记住这一点，以帮助理解
