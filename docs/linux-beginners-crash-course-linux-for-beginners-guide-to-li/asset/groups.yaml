    # 第5章：Linux 文件系统


    无论你使用的是 Linux 还是 Windows，在存储任何数据之前，你都必须先执行分区操作。每当你在 Linux 中格式化一个分区时，操作系统都会在该分区上写入特殊的数据，这些数据被称为文件系统。


    每个操作系统都支持其自身的一组文件系统。与 Windows 相比，Linux 支持更广泛的文件系统类型。Linux 支持的文件系统列在下表中：


