    Sometimes you might want to make a copy of a directory or a file, for example
    if you’re about to make changes to it and you want a backup so that, if things
    do go wrong, all is not lost! The command for this is cp, which is short for copy:


    ```

    cp [options] <source> <destination>

    ```


