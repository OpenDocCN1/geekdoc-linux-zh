    # Permissions


    There are three things that are dictated by a Linux permission – how you can read,
    write to, and execute a file. Each one is denoted with a single letter:


    - `r` read – You may view the contents of the file.

    - `w` write – You may change the contents of the file.

    - `x` execute – You may execute or run the file if it is a program or script.


    For each file, we can define three different sets of people for whom we can specify
    permissions:


    - `owner` – A single person who owns the file. (Typically the person who created
    the file, but ownership may be granted to someone else by certain users.)

    - `group` – Every file belongs to a single group.

    - `others` – Everyone else who is not in the group or the owner.


    So, that’s three permissions and three different sets of people. Really, that’s
    all there is to know about permissions, so let’s have a look at how we can view
    them and change them.


    ## Viewing permissions


    Viewing permissions for a particular file involves using the long listing option
    with the ls command:


    ```

    ls -l [path]

    ```


    For example:


    ```

    ls -l /home/Simon/linuxtutorialwork/frog.png


    -rwxr-xr-x 1 harry users 2.7K Jan 4 07:32 /home/Simon/linuxtutorialwork/frog.png

    ```


    We look at the first 10 characters of the output to identify the permissions:


    - Character 1 identifies the type of file. A dash (-) indicates a normal file,
    while a “d” indicates a directory

    - Characters 2, 3 and 4 identify the specific permissions for the owner. Letters
    indicate the permission and a dash (-) indicates that there are no permissions.
    The example shows that the owner has all three of the permissions.

    - Characters 5 through 7 show permissions for the group. Here, group members are
    only permitted to read the file.

    - The last three characters indicate permission for others. In the example, we
    can see that they have permission to execute files but cannot read or write to
    them.


    # Changing permissions


    To change a permission on a directory or file, we use the chmod command, which
    stands for change file mode bits. The bits are the indicators for the permissions,
    and the syntax is:


    ```

    chmod [permissions] [path]

    ```


    Chmod has permission arguments that are made up of three components, i.e.:


    - For whom are the permissions being changed? – UGOA = user, group, others, all

    - Are we giving permission or removing it? – indicated with a + or a -

    - Which permission is being set? – read, write, execute


    Look at the following example to see if it is any clearer to you. We are granting
    permission for execute to the group and taking permission for write away from
    the user, or owner.


    ```

    ls -l frog.png

    -rwxr-x---x 1 harry users 2.7K Jan 4 07:32 frog.png


    chmod g+x frog.png


    ls -l frog.png

