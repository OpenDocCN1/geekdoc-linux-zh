    we want to find all of the files that have a digit in their name:


    ```

    ls *[0-9]*

    foo1 foo2 foo3

    ```


    And we can use the caret (^) to reverse a range. This means that it will look
    for files with characters that are NOT one of those given:


    ```

    ls [^a-k]*

    secondfile thirdfile video.mpeg

    ```


