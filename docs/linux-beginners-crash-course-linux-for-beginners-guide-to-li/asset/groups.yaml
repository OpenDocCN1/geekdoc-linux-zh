    # Setting permissions shorthand


    The permission-setting methods we looked at above are easy enough, but can get
    a little tedious if you have to apply a set of permissions on a regular basis
    to specific files. You can use shorthand to do this. To understand how the shorthand
    system works, you must first know a little about how the numbers system works.
    The usual numbers system is decimal, a base 10 system. This means it has 10 symbols
    – 0 through 9. There is also the octal system, which has eight symbols – 0 through
    7. Now, with three permissions and with each one being on or off, there are 8
    combinations. These numbers can also be shown in binary, which has just two symbols
    – 0 and 1. The table below shows how we map from octal to binary:


    | OCTAL | BINARY |

    | :---- | :---- |

    | 0 | 000 |

    | 1 | 001 |

    | 2 | 010 |

    | 3 | 011 |'
