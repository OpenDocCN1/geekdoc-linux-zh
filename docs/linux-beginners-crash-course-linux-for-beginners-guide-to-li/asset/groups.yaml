    # Shell 脚本


    所有的 shell 都是交互式的，这意味着它们接受用户输入的命令并可以执行这些命令。你可以逐个输入命令，也可以将它们按顺序存储在文本文件中，然后将其交给 shell
    执行。一次性输入所有命令被称为 shell 脚本编程。


    Shell 脚本通常定义如下：


    “Shell 脚本是一系列写在纯文本文件中的命令。Shell 脚本就像 MS-DOS 中的批处理文件一样，但它的功能比 MS-DOS 批处理文件更强大。”


    # 编写 shell 脚本的原因


    - 你可以直接通过文件或直接向 shell 脚本提供输入，它会在屏幕上给出输出。

    - 你可以使用 shell 脚本创建自定义命令。

    - Shell 脚本通过一次性处理所有命令为你节省大量时间。

    - Shell 脚本可用于自动化日常任务。

    - 你还可以使用 shell 脚本来自动化系统管理。


    # 如何编写 shell 脚本


    在编写 shell 脚本时，请遵循以下步骤：


    - 使用编辑器，例如 mcedit 或 vi。

    - 在 shell 脚本中写好命令集后，你需要设置脚本的执行权限，使用 chmod 权限 your-script-name。例如，`$ chmod +x your-script-name`
    或 `$ chmod 755 your-script-name`。系统管理员或所有者应具有读/写/执行权限（7）。在为组设置权限时，应仅使用读和执行权限（5）。

    - 现在你应该按照以下语法执行你编写的脚本：


    ```

    syntax: bash your-script-name

    sh your-script-name

    ./your-script-name

    ```


    示例：


    ```

    $ bash bar

    $ sh bar

    $ ./bar

    ```


    - 注意，`./` 指示当前工作目录，而点 (.) 指示在当前 shell 中执行给定的命令文件，而不初始化一个新的 shell 副本。使用点的语法是 `.
    command-name`；例如，`$ .foo`。

    - 现在你可以使用 vi 命令列表（或任何其他编辑器）编写你自己的新 shell 脚本，名为 First Shell：


    ```

    $ vi first

    #

    # My first shell script

    #

    clear

    echo "First Shell"

    ```


    - 保存脚本后，你可以使用 `$ .first` 运行它，但首先你必须使用 `$ chmod 755 first` 设置权限。现在当你输入 `$ .first`
    时，屏幕将被清除，然后你的 shell 脚本中给出的消息将被打印：


    输出：First Shell


    | 命令(s) | 含义 |

    |---|---|

    | $ vi first | 启动 vi 编辑器 |

    | # My first shell script | # 后跟任何文本被视为注释。注释提供有关脚本的更多信息；它是关于 shell 脚本的逻辑解释。语法：#
    comment-text |

    | clear | 清屏 |

    | echo "First Shell" | 要在屏幕上打印消息或变量值，我们使用 echo 命令。echo 命令的一般形式如下：`echo "Message"`
    |


    # 基本命令行编辑


    为了编辑和调用命令，你可以使用以下按键组合：


    - CTRL + L：清屏。

    - CTRL + W：删除光标处开始的单词。

    - CTRL + U：清除行，即删除命令行中的所有单词。

    - 向上和向下箭头键：调用命令。

    - Tab：自动完成文件、目录、命令名称等。

    - CTRL + R：搜索以前使用过的命令。

    - CTRL + C：取消当前正在运行的命令。

    - CTRL + T：交换光标前的最后两个字符。

    - ESC + T：交换光标前的最后两个单词。

    - CTRL + H：删除光标处开始的字母。


    # 执行命令


    要执行命令，只需在终端输入该命令并按下回车键。

    例如，date 命令将输出当前的日期和时间，因此当你输入 *date* 并按下回车时，你会得到类似以下内容：Wed Jan 27 05:35:56 IST
    2015。


    # Bash shell 命令


    以下是来自 http://ss64.com/bash/ 的所有 bash 命令的字母顺序列表：


    - alias: 创建别名

    - apropos: 搜索帮助手册页 (man -k)

