    | iso9660 | CD-ROM 上使用的标准文件系统 |

    | minix | 一种旧的 Linux 文件系统，偶尔仍用于软盘 |

    | msdos | 与 Microsoft 的 MS-DOS 和 Windows 使用的 FAT 文件系统兼容 |

    | nfs | 与 Sun 的网络文件系统（Network File System）兼容 |

    | ntfs | 与 Microsoft Windows NT 的 NTFS 文件系统兼容 |

    | sysv | 与 AT&T 的 System V Unix 使用的文件系统兼容 |

    | vfat | 与 Microsoft 的 FAT32 兼容 |

    | xenix | 与 Xenix 使用的文件系统兼容 |


    # 第6章：进程间通信


    进程间通信是一种使用各种通信协议在不同进程之间共享数据的过程。服务器和客户端是使用进程间通信的两种类型的应用程序。在这种应用程序中，客户端映射到一个或多个服务器，并向其请求数据形式的信息。服务器或服务器发送这些数据。不同的平台提供了不同的方式供客户端访问数据。以下是
    Linux 为进程间通信提供的机制：


    - 1. 内核或进程向它们希望通信的进程发送信号。信号是 Linux 平台提供的最廉价的进程间通信形式，可以是事件或状态的形式。事件和状态都暗示或通知某个进程或内核中发生了一些变化。


    - 2. “|” 被称为管道。它由平台使用的 shell 设置，用于将一个进程的输入传输到另一个进程。管道的两端通过两端的文件描述符链接为一对一通信机制。这些文件描述符与单一功能相关联，即只读或只写。发送详情的端使用读取文件描述符从进程中读取数据。同时，需要接收数据的端将使用写入描述符，以便可以写入接收到的数据。由于数据流是单侧的，该机制被称为半双工机制。具有父子关系的进程，其中父进程创建管道与其子进程通信，并在其子进程之间创建管道以便它们可以相互通信，可以使用这些管道。这是因为文件描述符被复制到它们的地址空间中。


    - 3. 先进先出（FIFO）管道也称为命名管道，其使用方式与无名管道相同。唯一的区别是，这些管道用于进程之间没有关联的情况。使用这些管道的进程使用 FIFO
    文件而不是文件描述符进行通信。FIFO 文件具有与文件描述符相同的机制：一个 FIFO 文件具有读取功能，另一个具有写入功能。因此，这种机制也是半双工的。


    - 4. 为了允许单个或多个进程从单个或多个进程读取或写入，我们使用消息队列。这种机制类似于信箱。想要共享数据的进程过来将包含数据的包放到消息队列上然后离开。想要获取数据的进程过来取出包。这节省了大量时间，因为共享数据的进程无需等待另一个进程。消息队列有两种不同的规范。首先是
    SysV 消息队列，其中正在发送的消息包含一个数字，以便接收消息的进程可以获取与特定数字匹配的数据，或者接受除与特定数字匹配的包之外的所有内容。第二种是 POSIX，这是一种基于优先级的机制。它按优先级顺序发送包。当进程发送数据时，优先级数字附加在包上。因此，当其他进程接收到详情时，首先获取最高优先级包中的数据。


    - 5. 有计数器对将依次接收共享资源的进程顺序进行排队。这些计数器被称为信号量。它们锁定共享资源，使得只有一个进程可以访问共享资源。一旦该进程使用完资源，资源就会被释放。然后，优先级中下一个的进程将获得资源，或者无论优先级如何，请求资源的进程将获得资源。这与消息队列的
    SysV 和 POSIX 机制类似，因此这些被称为 SysV 信号量和 POSIX 信号量。


    - 6. 多个进程共享可用内存空间的机制称为共享内存机制。这有助于共享内存的两个或更多进程更高效地通信，从而减少对内核的干扰。还有两种类型的共享内存，SysV
    共享内存和 POSIX 共享内存，它们的工作方式如上所述相同。也就是说，一种考虑优先级，而另一种则不考虑。


    # 第7章：Linux Shell


    正如你已知，计算机只能理解零和一，即二进制语言。在计算的第一代中，指令直接以二进制语言给出。但二进制语言极其难以理解，且用其编写代码既费时又困难。为了解决这个问题，一种名为
    shell 的特殊程序被引入到操作系统中。Shell 接受以英语给出的命令，并检查它们是否有效。


    如果给定的命令是有效的，shell 将其传递给内核。Shell 可以被视为简化用户与内核之间交互的程序。Shell 是一个命令行解释器。它可以接受来自文件或标准输入设备（如键盘）的输入。虽然
    shell 不是内核的一部分，但它使用内核来创建文件、执行程序等。


    最基本的是，shell 是用户与系统内核之间的接口，但 shell 可以执行一些基本命令而无需将其传递给内核。


    如果你想知道系统中可用的 shell，请使用以下命令：


    ```

    $ cat /etc/shells

    ```


    虽然在一个操作系统中有许多可用的 shell，但它们都被设计来做同样的工作。不同的 shell 具有不同的语法和不同的内置功能。在 MS-DOS 中，command.com
    是 Windows 操作系统使用的 shell。它不如 Linux 中存在的 shell 强大。


    所有 shell 都通过文件或键盘等输入设备从用户那里获取命令，并向 Linux 操作系统传达用户所需的信息。


    如果用户使用键盘等输入设备给出命令，则称为命令行接口。下面给出的命令显示了您当前正在使用的那个 shell：


