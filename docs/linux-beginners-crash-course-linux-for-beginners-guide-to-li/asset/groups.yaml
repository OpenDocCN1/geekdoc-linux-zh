    # # Chapter 8: Command Line Tutorial


    Now you know what Linux is all about, it’s time to start actually using it. We’ll
    start with a basic command line tutorial, but first you need to know how to open
    the terminal. This isn’t hard, but all systems are different, so use this as a
    guideline only:


    +   - Mac users should open Applications, Utilities and then click on Terminal.
    A shortcut would be to press Command+Space, which will open Spotlight, after which
    you can type in the word Terminal. Click on the result when it shows up.

    +   - Linux users should look in Applications>System or Applications>Utilities.
    A shortcut is to right click on your desktop and look for the option to “Open
    in Terminal”. If it is there, click on it.

    +   - Windows users can simply type the word Command in the search bar on their
    start menu. Click on the option for Command Prompt and it will take you straight
    to it.


    As you know, the command line is where you type your commands and receive output,
    or feedback, as text. The command line starts with a prompt and the text you type
    is displayed after this prompt. Most of your work will be command work, for example:


    +   1. ls -l/home/Simon

    +   2. total 3

    +   3. drwxr-xr-x 2 Simon users 4096 Mar 23 13:34 bin

    +   4. drwxr-xr-x 18 Simon users 4096 Feb 17 09:12 Documents

    +   5. drwxr-xr-x 2 Simon users 4096 May 05 17:25 public_html

    +   6.


    Let’s break that code down and see what it all means:


    Line 1 always starts with the prompt with your username@bash. We also put a command
    in there – ls – and the command is always the first thing that you type. Following
    that are what we all command line arguments. Be aware that there must always be
    a space between the command and the first argument. The very first command line
    argument is (-l) and this is called an option.'
