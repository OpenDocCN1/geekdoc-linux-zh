    ```

    mkdir /home/Simon/foo

    mkdir ./blah

    mkdir ../dir1

    mkdir ~/linuxtutorialwork/dir2

    ```


    There are some very useful options for mkdir. The first of these is -p, which
    is telling the command mkdir that it should create parent directories as necessary.
    The second is -v, which commands mkdir to tell us what it’s doing.


    Here’s an example with the -p option:


    ```

    mkdir -p linuxtutorialwork/foo/bar

    cd linuxtutorialwork/foo/bar

    pwd

    /home/Simon/linuxtutorialwork/foo/bar

    ```


