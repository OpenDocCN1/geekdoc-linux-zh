    输入一些文本，内容随意，然后按 Esc。这将使您返回到编辑模式。


    ## 保存并退出


    有几种方法可以做到这一点；只需选择适合你的方法，但请确保先通过查看屏幕左下角确认你处于编辑模式。如果该处为空，说明没问题；如果显示 INSERT，你需要先返回编辑模式。为此，你只需按
    Esc – 如果你已经在编辑模式，它将不会产生任何影响。然后，要保存并退出，请输入以下其中一项：


    - `:wq + Enter`

    - `ZZ`


    大多数 vi 命令在输入键序列后会立即执行。如果命令以冒号（:）开头，你需要按下 Enter 键才能使命令完成。


    保存并退出你当前所在的文件。


    ## 查看文件的其他方法


    你可以在 *vi* 中编辑文件，也可以查看文件。不过，还有其他几个命令在这方面表现更好。第一个是 *cat*，全称是 concatenate（串联）。它通常用于将两个文件连接在一起，但也可以用于查看文件：


    `cat <file>`


    仅使用单个命令行参数运行 *cat* 命令，可以让你在屏幕上看到文件内容，随后是提示符。如果你使用命令行参数运行 *cat* 命令，光标会移动到下一行，但不会发生其他事情。如果你输入一些文本然后按
    Enter，*cat* 会将你输入的内容镜像显示在屏幕上。你可以通过按 Ctrl+C 退出，这是 Linux 中的取消信号。（你可以用它来摆脱你在 Linux
    中遇到的大多数麻烦。）


    `cat firstfile`


    在这里你会看到

    你在文件中

    输入的任何内容


    如果你只需要查看小文件，这是一个很棒的命令，但当文件较大时，内容会在屏幕上飞速滚动，你只能查看最后一页。要查看较大的文件，我们使用另一个名为 *less*
    的命令：


    `less <file>`


    *less* 命令允许你使用箭头键在文件内容中移动。你可以用空格键翻到下一页，或者按 “b” 返回上一页。完成后，只需按 “q” 退出即可。


    请尝试对你创建的文件使用这两个命令，看看你的使用情况如何。


    ## 在 vi 中导航文件


    现在，回到那个文件并输入更多更多内容。在插入模式下，你可以使用箭头键进行移动。再输入两段文字，然后按 Esc 以返回编辑模式。


    以下列表展示了可用于遍历文件的一些命令；请多加练习并掌握它们的工作方式。


    - 箭头键 – 移动光标

    - j, k, h, l – 向下、向上、向左和向右移动光标（类似于箭头键）

    - ^（脱字符）– 将光标移动到当前行的开头

    - $ – 将光标移动到当前行的末尾

    - nG – 移动到第 n 行（例如，5G 移动到第 5 行）

    - G – 移动到最后一行

    - w – 移动到下一个单词的开头

    - nw – 向前移动 n 个单词（例如，2w 向前移动两个单词）

    - b – 移动到上一个单词的开头

    - nb – 向后移动 n 个单词

    - { – 向后移动一段

    - } – 向前移动一段


    ## 删除内容


    你现在已经知道在 vi 中移动的一些方法。删除的工作方式类似；有多种不同的删除命令可用于定义你要删除的内容。下面的列表展示了一些删除方法。请多加练习，但务必先阅读关于如何撤销删除的部分：


    - x – 删除单个字符

    - nx – 删除 n 个字符（例如，5x 删除五个字符）

    - dd – 删除当前行

    - dn – d 后跟一个移动命令。删除到移动命令会将你带到的位置（例如，d5w 表示删除 5 个单词）。


    ### 撤销


    在 vi 中撤销删除是一个相当简单的过程；只需使用字母 “u” 即可。


    - u – 撤销最后一个操作（你可以继续按 u 来持续撤销）

    - U（注意：大写）– 撤销对当前行的所有更改


    ## 进一步探索


    现在你知道如何插入内容、删除它、撤销删除、保存并退出了。这就是在 vi 中进行基本编辑工作的方式。虽然我们在此无法详细介绍 vi 的所有细节，但你应该自行探索该文本编辑器的其他功能：


    - 复制和粘贴

    - 搜索和替换

    - 缓冲区

    - 标记

    - 范围

    - 设置


    玩得开心吧；学习 vi 有时会很痛苦，但一旦你掌握了它，你将不想再使用其他任何文本编辑器。


    ## 结语


    就在几年前，Linux 只是计算机极客用来美化简历的一个词。但现在，你可以在世界上几乎所有数据中心和服务器中找到 Linux。Linux 操作系统非常直观，并不像其他操作系统那样复杂。Linux
    是免费提供的，这使得任何希望学习它的人都可以使用它。一旦你在计算机上安装 Linux，你就成为了一个庞大的 Linux 社区的一部分，在那里你可以向那些乐于助人、愿意帮助像你一样的新手的任何人学习关于
    Linux 的一切。


    在本教程中，我们涵盖了 Linux 内核和 shell 脚本，以及诸如进程间通信等主题，还有许多你可以用来执行 Linux 中大多数简单任务的命令。我为你提供了使用
    Linux 的基本概述，并附带大量可供尝试的示例。


    Linux 真的没有想象中那么难学。一旦你深入其中，你会发现自己很容易就能掌握它，但是 – 我怎么强调都不为过 – 你必须练习。不要认为一旦你学会了某样东西，它就会永远留在你脑海中
    – 如果你不使用它，它就不会。而且别忘了，事情时刻都在变化，进步也在不断取得。如果你不跟上这些变化的步伐，你很快就会落后，不得不从头再来。


