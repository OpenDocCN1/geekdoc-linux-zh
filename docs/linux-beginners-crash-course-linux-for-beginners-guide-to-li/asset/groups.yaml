    ## 关于运行命令的更多说明


    精通 Linux 的很大一部分在于知道正确的命令行选项，以修改命令的行为以满足你的需求。大多数命令都有长格式和简写版本。例如，我们上面讨论过隐藏文件。我们可以使用命令
    `-a` 或者使用 `--all` 来列出所有目录条目和隐藏文件。第一个是简写版本，而第二个是长写版本。你可以使用任何版本，因为它们所做的是一样的，所以没有区别。使用长写版本有一个优点，那就是你可能更容易记住你的命令在做什么。然而，简写方法的一个优点是你可以将多个命令链接在一起：


    ```

