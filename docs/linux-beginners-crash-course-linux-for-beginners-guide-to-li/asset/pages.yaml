- pgno: 8
  md: '# # Introduction


    Linux was once thought of as an underdog operating system, and for some time it
    remained in obscurity overshadowed by the mighty Windows. But more recently, Linux
    has been winning accolades among software developers and businesses. This Unix
    variant, once only known to geeks and nerds, is now gaining popularity among ordinary
    home computer users, too.


    Linux is free of charge and runs on different platforms. It has been amassing
    a dedicated user base and is increasingly drawing interest from:


    +   - People who are acquainted with Unix and interested in running it on personal
    computers

    +   - People who are interested in experimenting with the principles of operating
    systems

    +   - People who want an operating system which gives them maximum control

    +   - People who are not satisfied with Microsoft Windows


    Managing Linux is more difficult than using Windows, but Linux is more flexible
    and has more configuration options.


    Corporations also seem to be conquering their irrational suspicion of Linux and
    are adapting Linux for many business applications. Because Linux is open source,
    companies need not worry about licensing when making such adaptations. That makes
    it a pretty attractive proposition.'
  merge: -1
  img_proc: true
- pgno: 9
  md: '# ## Chapter 1: Linux & Other Operating Systems


    If you are a computer programmer you already know about Linux. If not, you may
    have read about it or heard about it from one of your friends. Either way, Linux
    is interesting, and the more you learn about Linux, the more interesting questions
    you’ll have about it.'
  merge: -1
  img_proc: true
- pgno: 10
  md: '# What is Linux?


    In general, there are two types of PC users. Most people look at the computer
    as an amazing tool for cool stuff like browsing, playing games, watching movies
    and listening to music. They might even know about the hardware components like
    RAM, processors, and audio and video cards. But they don’t really care about the
    complexity behind these simple processes. They open a browser, type the address
    and somehow the website opens. They are not interested in knowing how it happens.


    Then there is a second set of people who are actually interested in knowing how
    things work internally. Almost everyone considers an operating system as additional
    software. It is not. An operating system, just like hardware components, is an
    important part of a computer. And when needed, the operating system can be upgraded
    or swapped for a more suitable one.'
  merge: -1
  img_proc: true
- pgno: 11
  md: '# Advantages of Linux


    You might think that people who talk about Linux are exaggerating how awesome
    it is, but in fact it does have a number of real advantages over other operating
    systems. These include the following:


    # Crash free


    Linux is a crash-free operating system. When you’re using Linux, you don’t experience
    freezing of the cursor on the screen, sudden system crashes or error messages
    that won’t go away until you reboot your system. The programs or applications
    that run on the Linux operating system might crash, but the operating system will
    still be functioning. No application can take it down when it crashes. In Linux,
    unlike other operating systems, you can simply clean up after the program crash
    and carry on. The crash-free reliability of Linux is a big asset when dealing
    with operations like spaceflight and nuclear power where you cannot risk system
    crashes which might result in huge expenses, injury or death.


    # Security


    The next advantage of Linux is its security. The security of the Linux operating
    system is far better than Windows, which has many security flaws. The reason for
    this is the years of extensive computer science research that have gone into Linux
    development. In Linux, if you do not have the appropriate permissions, you will
    not be allowed to access a particular piece of hardware or a particular folder
    in the system. Privacy can be set to individual owners who can only access their
    own files. The root user will have access to the complete system and can limit
    access for other users.


    # Free & shareable


    Another major benefit of Linux is that it is a free operating system. Updates
    will be downloaded free of charge, and when a new version of the operating system
    becomes available, you can simply replace your current version at no additional
    cost. In fact, you can actually download any version of Linux you want. As it
    is free software, it can be shared among a group of people. Default applications
    like image viewers, music players, image editors, etc. can all be shared. This
    is not possible with Windows or most other operating systems, wherein copying
    these kinds of applications and sharing them with others will make you a software
    pirate. But with Linux, it is'
  merge: -1
  img_proc: true
- pgno: 12
  md: 'completely legal – and actually encouraged – to share software with other users.


    # Compatibility


    Another good thing about Linux is that it can work even with older hardware. You
    don''t need a high performance, cutting edge PC like you do with the latest versions
    of other operating systems. For example, the new version of Windows will need
    new hardware for it to run. The Linux operating system can work even on obsolete
    hardware. So you won''t need to buy a new computer if you want to run Linux. You
    can see the difference for yourself if you install Linux and any other operating
    system on the same hardware. The Linux operating system will work faster and better
    than power-hungry operating systems like Windows. The Linux group encourages users
    to recycle and reuse components to make the most of existing hardware. You can
    actually bring an old computer system back to life by installing Linux on it.
    Even if you don''t need it, you can give it to a friend or family member who doesn''t
    own a PC.


    # Flexibility


    The Linux operating system is extremely flexible. Linux works on almost 60% of
    computers and can use broadband Internet connections. You can turn your old hardware
    into a web server, email server, firewall or anything else you have in mind. Doing
    this using other operating systems would cost you a fortune because you would
    need a seriously high-performance computer.


    # The Linux community


    But the best feature of Linux is undoubtedly the Linux community. Linux is not
    just a computer operating system. When you start using Linux, you become a part
    of a huge community that is spread across the globe. Being a part of the Linux
    community has its own advantages. One of these is that you are never far from
    finding a solution for whatever problem you may have. Most of the people in this
    community are Linux evangelists and love to help others solve their problems.
    New members of the Linux community are known as newbies, which sounds derisory
    but is actually a good opportunity to learn from professional Linux programmers.
    These programmers believe that knowledge should be shared freely and are glad
    to help other people learn Linux. When someone advertises his status as a newbie,
    people will'
  merge: -1
  img_proc: true
- pgno: 13
  md: make time to help him. After all, those professionals were once newbies as well.
  merge: -1
  img_proc: true
- pgno: 14
  md: '# Features of Operating Systems


    An operating system can be considered as an interface or intermediary between
    the computer hardware and the user. Operating systems provide users with an environment
    that allows them to execute different programs efficiently and conveniently. Technically
    speaking, an operating system is software that manages the hardware on which it
    is being run and controls the execution of all kinds of programs. An operating
    system is responsible for the allocation of services and resources like processors,
    memory, devices and information. Linux is one such operating system. The important
    functions of any operating system are given below:


    +   Memory management

    +   Device management

    +   Processor management

    +   Security

    +   File management

    +   Control over system performance

    +   Error detection

    +   Job accounting

    +   Coordination between users & other software


    # *Memory management*


    Memory management is managing the main or primary memory. Memory can be considered
    as a very large array of bytes or words that has an address of its own.


    The main memory provides the CPU with direct access and faster storage. So if
    you want to execute a program, it should be stored in the main memory of the computer.
    Every operating system, including Linux, performs the following memory management
    activities:


    +   Keeping track of the main memory, including used and unused memory. For used
    memory, the operating system also tracks which users are using it.

    +   The operating system will decide how to allocate memory for different processes
    when multiprogramming.

    +   Allocating memory whenever a certain process requests extra'
  merge: -1
  img_proc: true
- pgno: 15
  md: '+   • Operating systems also take care of memory de-allocation when a particular
    process is terminated or when it no longer needs memory.


    # Processor management


    In a multiprogramming environment, the operating system is the program that decides
    the processor allocation time for each process. For processor management, every
    operating system will perform the following activities:


    +   • Keeping track of process status and processor status using the traffic controller
    program.


    +   • Allocating the processor to a given process.


    +   • Allocating the processor when it is not required.


    # Device management


    Devices communicate with each other using their own drivers, but the OS is responsible
    for this communication. An operating system’s device manager performs the following
    activities:


    +   • Keeping track of all the available devices. The I/O controller is the program
    responsible for performing this task.


    +   • The device manager is what decides the allocation of a particular device
    to process. It is also responsible for the allocation of time for which the process
    needs the device.


    +   • It efficiently allocates devices to processes.


    +   • De-allocation is also handled by the device manager.


    # File management


    For easy usage and navigation, file systems are organized into directories in
    which files and other directions are stored. The operating system performs the
    following file management activities:


    +   • It keeps track of file status, uses, location, information etc. The file
    system is a collective of these facilities.


    +   • The operating system’s file manager is the program that decides the allocation
    of resources.


    +   • This also decides who gets to use the resources.


    +   • De-allocation of resources is handled by the file manager.


    # Other important activities'
  merge: -1
  img_proc: true
- pgno: 16
  md: 'Here are few more important activities that are performed by an operating system:


    +   - Security – By using a password or similar technique, the operating system
    will prevent any unauthorized access to data and programs.


    +   - Control over system performance – An operating system will have control
    over the system performance by recording the delays sent by the service as a request
    and the response given by the system.


    +   - Job accounting – The operating system is responsible for keeping track of
    the resources and time used by different users on various jobs.


    +   - Error detecting aids – For error detection, the operating system will produce
    places, error messages, dumps and a few other errors detecting and debugging aids.


    +   - Coordination between other software and users – The operating system takes
    care of the coordination and assignment of assemblers, compilers, interpreters
    and any other software to other users who use the computer system.'
  merge: -1
  img_proc: true
- pgno: 17
  md: '# Types of operating systems


    Operating systems have been in use from the very first generation of computers,
    and they have continuously evolved over this period of time. Here are a few of
    the most important types.


    # Batch operating systems


    When using a batch operating system, the user does not interact directly with
    the computer. Every job that a user prepares is transferred to an off-line device
    like punch cards and then submitted to the computer operator. For better performance
    and speed, these jobs are batched together into a group. The computer will run
    this group of jobs all at once. Programmers give their programs to the operator,
    and the operator sorts these programs according to their type into batches that
    have similar requirements. Though this is a good practice, the batch operating
    system has several disadvantages:


    +   - There is no interaction between the job and the user.

    +   - The CPU is idle most of the time because of the difference in speeds between
    the CPU and the mechanical I/O devices, which are obviously much slower.

    +   - It can be difficult to provide the properties desired.


    # Timesharing operating systems


    Timesharing is a technique where multiple terminals are located on one computer
    system and can be used at the same time. Multitasking or timesharing is a logical
    extension of multiprogramming. The simultaneous sharing of processor time among
    different users is called timesharing. The main difference between timesharing
    systems and multiprogramming batch systems is that multiprogramming batch systems
    aim to maximize processor efficiency, whereas the main objective for timesharing
    systems is minimizing the response time.


    Here, jobs are frequent. They can switch and be executed by the processor, meaning
    that users can get immediate responses. For example, in transaction processing,
    the processor executes the programs in the quantum of computation, i.e., in a
    short burst. The response time for every user is a few seconds at the most.


    The operating system uses multiprogramming and scheduling of the CPU to'
  merge: -1
  img_proc: true
- pgno: 18
  md: 'provide each user with a small fraction of time. All computer systems that
    were originally designed as batch operating systems were later modified into timesharing
    systems.


    The following are some advantages of timesharing operating systems:


    +   - Users get quick responses.

    +   - Software duplication is avoided.

    +   - CPU idle time is reduced.


    But timesharing operating systems also have some disadvantages:


    +   - Reliability is low.

    +   - Integrity and security of data and programs is placed at risk.


    # Distributed operating systems


    Distributed operating systems deal with multiple users and multiple real-time
    applications using multiple CPUs. Efficiency of job performance is increased because
    data processing tasks are distributed among different processors accordingly.


    Processes inter-communicate with each other using various lines like high-speed
    buses. This can also be referred to as a loosely coupled system. The processors
    in distributed operating systems are referred to as computers, sites, nodes and
    so on, and their function and size may vary.


    Some advantages of distributed operating systems are given below:


    +   - A resource sharing facility allows users at one site to access and use resources
    that are present on a different site.

    +   - Data exchange speed is increased using electronic mail.

    +   - Even if one site in a distributed operating system fails, other sites may
    be unaffected and can potentially continue to operate.

    +   - Customers receive better services.

    +   - The load on the host computer is reduced.

    +   - The data processing delay is reduced.


    # Network operating systems


    A network operating system runs on a server and provides the server with capabilities
    like data management, group management, user management, application management,
    security management and a few other networking'
  merge: -1
  img_proc: true
- pgno: 19
  md: 'functions. The network operating system is responsible for file sharing and
    printer access among all the computers in the network. These networks are usually
    private networks or local area networks, but can be of any type. Linux can be
    used as a powerful and efficient network operating system.


    The advantages of network operating systems are that:


    +   • The stability of the centralized server is high.

    +   • The server can manage security.

    +   • Any hardware or software updates can be integrated easily into the system.

    +   • It is possible to remotely access the server from a different type of system
    or a different location.


    Disadvantages of network operating systems include:


    +   • Initial costs and maintenance costs are high.

    +   • Servers are dependent on a central location for most operations.

    +   • Frequent updates and regular maintenance are required.


    # Real-time operating systems


    A real-time operating system can be defined as a data processing system where
    the required time interval for processing and response to inputs is so quick that
    it can control the environment. All real-time processing is online, but it is
    not necessary for an online system to be a real-time system. The time taken by
    a system to respond to an input and to give the output with the updated information
    is called the response time. When compared to the response time of online processing,
    the response time in this method is very quick.


    There are two different types of real-time operating system:


    # Hard real-time systems


    Hard real-time systems guarantee on-time completion of critical tasks. Secondary
    storage is absent or limited. Data can be stored in ROM format. There is no virtual
    memory in hard real-time systems.


    # Soft real-time systems


    Soft real-time systems are less restrictive than hard real-time systems. A soft
    real-time system prioritizes critical tasks and retains those priorities until
    each task is completed. When compared to hard real-time systems, soft real-time'
  merge: -1
  img_proc: true
- pgno: 20
  md: systems have limited utility. For example, advanced scientific projects like
    planetary rovers and deep sea exploration can use soft real-time systems, and
    they also have virtual reality and multimedia applications.
  merge: -1
  img_proc: true
