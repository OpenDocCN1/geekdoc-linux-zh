- pgno: 67
  md: '# Paths


    In these last commands, we started to introduce paths. It is important that you
    learn what these are and how to use them as you cannot be proficient in the Linux
    language until you do so. When we talk about a directory or a file on the command
    line, we are talking about a path. Just like in the physical world, a path is
    a way of getting somewhere, in this case to a specific directory or file on the
    system.


    # Absolute & relative paths


    We use two different paths – absolute and relative – to refer to a directory or
    file. Either can be used, as they will both take you to the same place on the
    system. To start with, you need to understand that Linux has what’s known as a
    hierarchical structure. Right at the top is the root directory, indicated by a
    single slash (/). The root directory contains sub-directories, and these have
    their own sub-directories, and so on. Any of these sub-directories can contain
    files.


    An absolute path specifies a particular file or directory relative to the root
    directory. They are identifiable by the slash that they all begin with. A relative
    path specifies a file or directory relative to your current location in the system
    and does not start with a slash.


    Have a look at this example:


    ```

    pwd

    ```


    ```

    /home/Simon

    ```


    Current location is confirmed by running pwd.


    ```

    ls Documents

    ```


    ```

    file1.txt file2.txt file3.txt

    ```


    ```

    ...

    ```


    Now ls is run with a relative path. The current location is the Documents directory,
    but this command will give different results depending on where you are in the
    system. If you were in the home directory of another system user, it would provide
    you with a list of the contents of that user’s Documents directory.'
  merge: -1
  img_proc: true
- pgno: 68
  md: '```

    ls /home/Simon/Documents

    file1.txt file2.txt file3.txt

    ...

    ```


    Finally ls is run with an absolute path. This command is not reliant on where
    you are in the system; the result will be exactly the same wherever you are.


    # Building blocks


    As you learn Linux, it will soon become apparent that there are loads of different
    ways to get things done. The following are called building blocks, and they will
    help you to build up your paths:


    +   •    ~ (tilde) – A shortcut for the home directory. For example, if your home
    directory is called /home/Simon, you can refer to the Documents directory with
    the path /home/Simon/Documents, or you could just type ~/Documents.

    +   •    . (dot) – A reference to the current directory. Take the earlier example
    where we referred to Documents with a relative path. We could also have written
    it as ./documents.

    +   •    .. (dotdot) – A reference to the parent directory. This can be used any
    number of times in a single path if you want to keep on traversing upwards through
    the hierarchy. For example, if you were in /home/Simon, you could simply type
    in ls ../.. / and you would get a listing of the root directory as your output.


    Now you can start to see that you can refer to locations in a number of ways.
    As to which way you should use, the answer is you can use any of them. If you
    make a reference to a directory or file on the command line, you are referring
    to a path, and that can be made up with any of the elements we talked about. The
    best way is whichever way you find the easiest.


    Have a look at these examples:


    ```

    pwd

    /home/Simon

    ls ~/Documents

    file1.txt file2.txt file3.txt

    ```'
  merge: -1
  img_proc: true
- pgno: 69
  md: '```

    ...

    ls ./Documents

    file1.txt file2.txt file3.txt

    ...

    ls /home/Simon/Documents

    file1.txt file2.txt file3.txt

    ...

    ls ../..

    bin boot dev etc home lib var

    ...

    ls /

    bin boot dev etc home lib var

    ```


    ...


    Have a go at inputting these into the command line on your system – I promise
    that they will begin to make a bit more sense to you. Make sure you take the time
    to learn all about paths and really understand them; you will use them a lot.'
  merge: -1
