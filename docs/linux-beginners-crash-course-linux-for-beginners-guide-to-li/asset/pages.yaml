  md: '# Removing a directory


    It’s easy to make a new directory, and it is also very easy to delete one. Do
    keep in mind that there is no undo option when you delete something on Linux using
    the command line. So be careful and get into the habit of double-checking everything
    before you go ahead and delete. The command we use to delete a directory is rmdir,
    short for remove directory:


    ```

    rmdir [options] <Directory>

    ```


    There are two things to bear in mind here – first, rmdir supports both the -p
    and the -v options; and second, the directory has to be empty before you can delete
    it.


    ```

