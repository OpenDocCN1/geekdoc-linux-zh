- pgno: 61
  md: '# # Chapter 8: Command Line Tutorial


    Now you know what Linux is all about, it’s time to start actually using it. We’ll
    start with a basic command line tutorial, but first you need to know how to open
    the terminal. This isn’t hard, but all systems are different, so use this as a
    guideline only:


    +   - Mac users should open Applications, Utilities and then click on Terminal.
    A shortcut would be to press Command+Space, which will open Spotlight, after which
    you can type in the word Terminal. Click on the result when it shows up.

    +   - Linux users should look in Applications>System or Applications>Utilities.
    A shortcut is to right click on your desktop and look for the option to “Open
    in Terminal”. If it is there, click on it.

    +   - Windows users can simply type the word Command in the search bar on their
    start menu. Click on the option for Command Prompt and it will take you straight
    to it.


    As you know, the command line is where you type your commands and receive output,
    or feedback, as text. The command line starts with a prompt and the text you type
    is displayed after this prompt. Most of your work will be command work, for example:


    +   1. ls -l/home/Simon

    +   2. total 3

    +   3. drwxr-xr-x 2 Simon users 4096 Mar 23 13:34 bin

    +   4. drwxr-xr-x 18 Simon users 4096 Feb 17 09:12 Documents

    +   5. drwxr-xr-x 2 Simon users 4096 May 05 17:25 public_html

    +   6.


    Let’s break that code down and see what it all means:


    Line 1 always starts with the prompt with your username@bash. We also put a command
    in there – ls – and the command is always the first thing that you type. Following
    that are what we all command line arguments. Be aware that there must always be
    a space between the command and the first argument. The very first command line
    argument is (-l) and this is called an option.'
  merge: -1
  img_proc: true
- pgno: 62
  md: 'These are used to change the way the command behaves. They are always listed
    before any other argument and start with a dash (-).


    Lines 2 to 5 are outputs that come from running the command that you typed in.
    Nearly all commands will produce an output, and it will always be listed immediately
    under the command issued. A few commands just execute and don''t produce any information
    unless there is an error.


    Line 6 is the prompt again. Once the command has been run, the terminal is ready
    for use again and will display the prompt. If there is no prompt showing, the
    command is most likely still running.'
  merge: -1
  img_proc: true
- pgno: 63
  md: '# Shortcuts


    While the terminal may seem a little overwhelming at first, there is nothing to
    be worried about. Linux is packed full of handy shortcuts that will make things
    much easier and can also stop you from making mistakes like typographical errors.
    I will go through some of them as I go through this chapter so make a note of
    them as you come across them.


    Your first shortcut is this – whenever you enter a command it is stored in a history,
    and you can work your way through this history by using the up and down arrow
    keys. So you don’t need to type out commands that you have already typed; if you
    need to enter the same one again, simply use the arrow keys to find it. If you
    want to edit a command, use the left and right arrow keys to put the cursor where
    you need it to make the change.'
  merge: -1
  img_proc: true
- pgno: 64
  md: '# Basic navigation


    The very first command we’ll look at is pwd, which stands for Print Working Directory.
    (Many of the Linux commands are shortened to abbreviations and this makes it much
    easier to remember them.) This command does exactly what it says it does – prints
    the working directory to the screen. Give it a go:


    pwd


    /home/Simon


    Many of the commands that you type in on the terminal will only work if you’re
    in the right location. But as you will be moving around quite a bit, it will be
    easy to get lost. Simply typing pwd at the command prompt will tell you your location,
    so make use of it whenever you’re in doubt.


    The next thing you might want to know is what’s in your current location. The
    command to find that out is ls, which is short for list.


    ls


    bin Documents public_html


    Where pwd runs without arguments, ls has a bit more power. In this example, we
    haven’t given it any arguments, so that we just get a list of what is in the current
    location. But you can do more with it, for example:


    ls [options] [location]


    The [] square brackets indicate that the text inside them is optional so the command
    can run with them or without them. The example below show the ls command run in
    a number of different ways just to give you an idea of what it can do:


    ls


    bin Documents public_html


    This is ls in its absolute most basic format – the result is a list of the contents
    of the directory we are in.


    ls -l


    total 3'
  merge: -1
  img_proc: true
- pgno: 65
  md: '```

    drwxr-xr-x 2 Simon users 4096 Mar 23 13:34 bin

    drwxr-xr-x 18 Simon users 4096 Feb 17 09:12 Documents

    drwxr-xr-x 2 Simon users 4096 May 05 17:25 public_html

    ```


    Using ls with the command line option (-l) indicates that we want to do a long
    listing, which consists of:


    +   - The first character indicates the file type – normal (-) or directory (d)

    +   - The following nine characters are file or directory permissions

    +   - The next field is the number of the blocks

    +   - The next field indicates the file or directory owner

    +   - The next field indicates the group that the directory or file belongs to

    +   - Next is the size of the file

    +   - Next is the file modification time

    +   - Last is the name of the directory or file


    ```

    ls /etc

    ```


    ```

    a2ps.cfg aliasesalsa.d cups fonts my.conf systemd

    ```


    ```

    ...

    ```


    This time, ls is run with a command line argument, (/etc), which is telling ls
    that it shouldn’t list the current directory; instead it should list the contents
    of the directory. (The ellipsis (...) indicates that some of the output has been
    cut out to save space; if you actually run this command, you will get a much longer
    listing of directories and files.)


    ```

    ls -l /etc

    total 3

    -rwxr-xr-x 2 root root 123 Mar 23 13:34 a2ps.cfg

    -rwxr-xr-x 18 root root 78 Feb 17 09:12 aliases

    drwxr-xr-x 2 Simon users 4096 May 05 17:25 alsa.d

    ```


    ```

    ...

    ```


    Now ls is run with a command line option and a command line argument,'
