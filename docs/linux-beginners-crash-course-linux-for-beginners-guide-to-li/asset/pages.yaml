- pgno: 93
  md: "# ## Permissions\n\nThere are three things that are dictated by a Linux permission\
    \ – how you can read, write to, and execute a file. Each one is denoted with a\
    \ single letter:\n\n+   - r read – You may view the contents of the file.\n\n\
    +   - w write – You may change the contents of the file.\n\n+   - x execute –\
    \ You may execute or run the file if it is a program or script.\n\nFor each file,\
    \ we can define three different sets of people for whom we can specify permissions:\n\
    \n+   - owner – A single person who owns the file. (Typically the person who created\
    \ the file, but ownership may be granted to someone else by certain users.)\n\n\
    +   - group – Every file belongs to a single group.\n\n+   - others – Everyone\
    \ else who is not in the group or the owner.\n\nSo, that’s three permissions and\
    \ three different sets of people. Really, that’s all there is to know about permissions,\
    \ so let’s have a look at how we can view them and change them.\n\n# ### Viewing\
    \ permissions\n\nViewing permissions for a particular file involves using the\
    \ long listing option with the ls command:\n\n```\nls -l [path]\n```\n\nFor example:\n\
    \n```\nls -l /home/Simon/linuxtutorialwork/frog.png\n```\n\n```\n-rwxr-x1harryusers2.7KJan\
    \ 4  \n07:32/home/Simon/linuxtutorialwork/frog.png\n```\n\nWe look at the first\
    \ 10 characters of the output to identify the permissions:\n\n+   - Character\
    \ 1 identifies the type of file. A dash (-) indicates a normal file, while a “d”\
    \ indicates a directory\n\n+   - Characters 2, 3 and 4 identify the specific permissions\
    \ for the owner. Letters indicate the permission and a dash (-) indicates that\
    \ there are no permissions. The example shows that the owner has all"
  merge: -1
  img_proc: true
- pgno: 94
  md: 'three of the permissions.


    +   - Characters 5 through 7 show permissions for the group. Here, group members
    are only permitted to read the file.


    +   - The last three characters indicate permission for others. In the example,
    we can see that they have permission to execute files but cannot read or write
    to them.


    # Changing permissions


    To change a permission on a directory or file, we use the chmod command, which
    stands for change file mode bits. The bits are the indicators for the permissions,
    and the syntax is:


    ```

    chmod [permissions] [path]

    ```


    Chmod has permission arguments that are made up of three components, i.e.:


    +   - For whom are the permissions being changed? – UGOA = user, group, others,
    all


    +   - Are we giving permission or removing it? – indicated with a + or a -


    +   - Which permission is being set? – read, write, execute


    Look at the following example to see if it is any clearer to you. We are granting
    permission for execute to the group and taking permission for write away from
    the user, or owner.


    ```

    ls -l frog.png

    -rwxr-x---x 1 harry users 2.7K Jan 4 07:32 frog.png

    ```


    ```

    chmod g+x frog.png

    ```


    ```

    ls -l frog.png

    -rwxr-x--x 1 harry users 2.7K Jan 4 07:32 frog.png

    ```


    ```

    chmod u-w frog.png

    ```


    ```

    ls -l frog.png

    -r-xr-x-x 1 harry users 2.7K Jan 4 07:32 frog.png

    ```


    Instead of giving individual permissions, you can give multiple permissions at
    the same time:'
  merge: -1
  img_proc: true
- pgno: 95
  md: '```

    ls -l frog.png

    -rwxr---x 1 harry users 2.7K Jan 4 07:32 frog.png

    chmod g+wx frog.png

    ls -l frog.png

    -rwxrwx-x 1 harry users 2.7K Jan 4 07:32 frog.png

    chmod go-x frog.png

    ls -l frog.png

    -rwxrw--- 1 harry users 2.7K Jan 4 07:32 frog.png

    ```


    While it might seem a little strange that the owner of a file can remove his own
    read, write and execute permissions for a file, there are good reasons for doing
    so. You might have a file that contains data that you don''t want to be changed
    accidentally. While you can remove the permissions, you cannot remove your ability
    to set the permissions, and that means that you retain full control of every file
    that you own.


    # Setting permissions shorthand


    The permission-setting methods we looked at above are easy enough, but can get
    a little tedious if you have to apply a set of permissions on a regular basis
    to specific files. You can use shorthand to do this. To understand how the shorthand
    system works, you must first know a little about how the numbers system works.
    The usual numbers system is decimal, a base 10 system. This means it has 10 symbols
    – 0 through 9. There is also the octal system, which has eight symbols – 0 through
    7. Now, with three permissions and with each one being on or off, there are 8
    combinations. These numbers can also be shown in binary, which has just two symbols
    – 0 and 1. The table below shows how we map from octal to binary:


    | OCTAL | BINARY |

    | :---- | :---- |

    | 0 | 000 |

    | 1 | 001 |

    | 2 | 010 |

    | 3 | 011 |'
  merge: -1
  img_proc: true
- pgno: 96
  md: '4 100

    5 101

    6 110

    7 111


    Now, all of the octal values can also be represented with three binary bits, and
    every combination of ones and zeros has been included. Now we have three permissions
    and three bits. The 1 represents on and the 0 represents off, and with that, we
    can use a single octal number to represent a specific set of permissions for a
    specific set of people. Using three numbers we can set permissions for the owner,
    the group and others. Let’s have a look at an example – don’t forget to refer
    to the above table to see how it all works:


    ```

    ls -l frog.png

    -rw-r----x 1 harry users 2.7K Jan 4 07:32 frog.png

    chmod 751 frog.png


    ls -l frog.png

    -rwxr-x--x 1 harry users 2.7K Jan 4 07:32 frog.png

    chmod 240 frog.png


    ls -l frog.png

    --w-r----- 1 harry users 2.7K Jan 4 07:32 frog.png

    ```


    One convenient method is to remember a common sequence for different file types,
    e.g., 750 and 755 are used for scripts.


    # Permissions for directories


    We can use the same permissions for directories, but they will behave a little
    differently:


    +   - r – You have the ability to read the contents of the directory (i.e., do
    an ls).

    +   - w – You have the ability to write into the directory (i.e., create files
    and directories).

    +   - x – You have the ability to enter that directory (i.e., cd).'
  merge: -1
  img_proc: true
