    ls

    backups example1 foo

    mv foo foo3

    ls

    backups example1 foo3

    cd ..

    mkdir linuxtutorialwork/testdir

    mv linuxtutorialwork/testdir /home/Simon/linuxtutorialwork/fred

    ls

    backups example1 foo3 fred

    ```

    ```


    So first, in line 3, the file called foo is renamed to foo3, using relative paths.
    Then with cd.. we go to the parent directory so that, in the next line, we can
    show that commands can be run on directories or files even if we are not in their
    current directory. In line 8, the directory called testdir is renamed to fred,
    using a relative path for the source and an absolute path for the destination.'
