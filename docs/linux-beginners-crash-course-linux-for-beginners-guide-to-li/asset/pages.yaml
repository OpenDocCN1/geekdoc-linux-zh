- pgno: 49
  md: '# **Basic command line editing**


    For editing and recalling commands, you can use the key combinations given below:


    +   CTR L + L: Clears the screen.

    +   CTR L + W: Delete the word starting at cursor.

    +   CTR L + U: Clear the line i.e. Delete all words from command line.

    +   Up and Down arrow keys: Recall commands.

    +   Tab: Auto-complete files, directory, command names etc.

    +   CTR L + R: Search through previously used commands.

    +   CTR L + C: Cancel currently running commands.

    +   CTR L + T: Swap the last two characters before the cursor.

    +   ESC + T: Swap the last two words before the cursor.

    +   CTR L + H: Delete the letter starting at cursor.


    # ***Executing a command***


    To execute a command, just type it on the terminal and press the enter key.

    For example, the date command will give the current date and time as output, so
    when you type *date* and press enter you get something like: Wed Jan 27 05:35:56
    IST 2015.'
  merge: -1
  img_proc: true
