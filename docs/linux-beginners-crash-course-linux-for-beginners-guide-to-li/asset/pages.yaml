- pgno: 99
  md: '# The root user


    There are just two people who can change the file or directory permissions: the
    owner for the specific directory or file and the root user. This super user has
    access everything and can do anything. Usually, only a system administrator has
    access to the root account, and he uses it to keep the system maintained. Normal
    users generally only have access to their own files and directories, those located
    in their home directory, and perhaps a couple of others that are being shared
    or that they are collaborating on with other users. This is how the stability
    and the security of the system are maintained.'
  merge: -1
  img_proc: true
- pgno: 100
  md: '# **Basic security**


    Your space is your home directory and it is up to you to make sure that it remains
    yours. Most users tend to give themselves full permissions for read, write and
    execute in their home directory and will not give permissions to the group or
    to others. However, everyone has a different setup.


    To maintain security, you should refrain from giving write access to your home
    directory to anyone in the group or others. However, being able to execute without
    read permission can be handy at times. This allows others to get to your home
    directory, but they will not be able to see what is contained in it. One good
    example of this is when it is used for personal web pages. Systems typically run
    web servers and each user is given their own bit of space. If you put a directory
    into your home directory and call it public_html, the webserver will generally
    be able to read the contents and display them. However, because the webserver
    is a different user, it will not be able to access and read the files. This is
    where you might want to give execute permissions on the home directory so that
    the webserver can do its job.'
  merge: -1
  img_proc: true
- pgno: 101
  md: '# ## Chapter 10: The vi Text Editor


    In the last chapter we created some blank files. In this chapter we are going
    to look at a tool that helps us to put some content into those files and allows
    us to edit the content as well. vi is a nice text editor, something different
    from most of the text editors you have used in the past. It will take you a while
    to learn it but, once you have, you will see just how powerful it is.


    Essentially, vi is a command line editor. As you know by now, the command line
    is somewhat different from the Linux GUI. It is just one window where you input
    text and output text, that is all. vi works within those strict limitations, making
    it an extremely powerful editor. It is a plain text editor, similar to TextEdit
    on the Mac or Notepad on Windows. It is NOT a word processor, but it is more powerful
    than either of the aforementioned built-in editors.


    You do not need your mouse with vi; everything in done on the keyboard.


    There are two separate modes – Insert (input) and Edit. In the Insert mode, you
    type in content to go into a file. In Edit, you move around inside the file, and
    edit the content, as by deleting, searching, copying, replacing, saving, etc.
    One of the most common mistakes that people make is to start inputting commands
    without being in Edit mode or to start typing in their input without being in
    Insert mode. Do check before you start. That said, if you do make one of these
    mistakes, it is easy to recover from it.


    To run the vi text editor, you use a single command line argument, naming the
    file you want to edit:


    ```

    ```

    vi <file>

    ```

    ```


    If you don’t name a file, you can open it within, vi but it is actually easier
    to shut the editor down and start again. Do remember as well that you can use
    a relative or an absolute path to specify the file name.


    First of all, with your terminal open, move to the directory that you made called
    linuxtutorialwork. We want to make some files, and we can store them here to keep
    them away from everything else you do.'
  merge: -1
  img_proc: true
- pgno: 102
  md: 'Now we need to edit your first file, so type this into the command line:


