- pgno: 22
  md: '# Components


    The Linux operating system has three main components:


    +   - **Kernel** – The kernel is considered to be the core of the Linux operating
    system and is responsible for the system’s major activities. The kernel interacts
    directly with the hardware and has various modules within it. The kernel hides
    all the low-level hardware details by providing the required abstraction to the
    application programs or system.


    +   - **System Library** – System libraries can be considered as special programs
    or functions with which the system utilities or the application programs access
    the features of the kernel. Almost all of the functionality that these libraries
    can implement is also implemented by operating systems. The system libraries do
    not require the code of the kernel module for access rights.


    +   - **System Utility** – System utilities are programs that are responsible
    for performing specialized and individual tasks.'
  merge: -1
  img_proc: true
- pgno: 23
  md: '# Features


    Here are some of the most important features of the Linux operating system:


    +   - Portable - Portability means software can work on different types of hardware
    in the same way. Linux kernel and application programs can be installed on any
    kind of hardware platform.


    +   - Open Source - Linux source code is freely available. Development is a community-based
    project. Multiple teams work in collaboration to enhance the capability of the
    Linux operating system, and it is continuously evolving.


    +   - Multi-User - Linux is a multiuser system, meaning multiple users can access
    system resources like memory/ RAM/ application programs at the same time.


    +   - Multiprogramming - Linux is a multiprogramming system, meaning multiple
    applications can run at the same time.


    +   - Hierarchical File System - Linux provides a standard file structure in which
    system files/ user files are arranged.


    +   - Shell - Linux provides a special interpreter program that can be used to
    execute operating system commands. It can be used for various types of operations,
    application programs etc.


    +   - Security - Linux provides user security using authentication features like
    password protection/ controlled access to specific files/ encryption of data.'
  merge: -1
  img_proc: true
- pgno: 24
  md: '# Architecture


    The following layers are part of the Linux system architecture:


    +   * Hardware- All the peripheral devices, like hard disks, CPU and RAM, are
    part of the hardware layer.


    +   * Kernel- The kernel is the main or core component of the operating system.
    It communicates directly with the system hardware, providing the upper layer components
    with low level services.


    +   * Shell- The shell is an interface between the user and the kernel. The shell
    accepts comments given by the user and executes kernel functions.


    +   * Utilities- Utility programs are those that provide users with most of the
    operating system''s functionalities.'
  merge: -1
  img_proc: true
- pgno: 25
  md: '# **Chapter 3: The Linux Kernel**


    In this chapter, we will learn about the Linux kernel. The Linux kernel is the
    computer operating system that is similar to UNIX. It is being used widely throughout
    the world. The Linux operating system is completely based on the Linux kernel.
    It is deployed on traditional computer systems through Linux distributions and
    also on embedded devices like routers. The Android mobile operating system, which
    works on mobile and tablet computers, is also built using the Linux kernel.


    In 1991, Linus Torvalds, a computer science student from Finland, created the
    Linux kernel for his personal use. Initially he had no intention of using it on
    other platforms, but he gradually developed it so it could run on different computer
    architectures. The new operating system gained huge attention from developers,
    who were interested in adapting code from other projects involving free software
    to develop it further. Nearly 12,000 software developers and 1,200 companies contributed
    to the development of the Linux kernel.


    The Linux kernel is free and open source software, which means that the source
    code of the kernel can be accessed and modified by anyone. LKML, or the Linux
    Kernel Mailing List, hosts the discussions on the development of the Linux kernel.


    The kernel is the interface between the user applications and the CPU, memory
    and other devices.


    The GNU Compiler Collection (GCC) supports a C language version (developed by
    incorporating several changes and extensions into standard C) which has been used
    to write the Linux kernel. Along with C, assembly language has also been used
    to write several small parts of the code. Since GCC supports several extensions
    of C, it was for some time the only compiler having the capability to build the
    Linux kernel.'
  merge: -1
  img_proc: true
- pgno: 26
  md: '# # Kernel sources


    The kernel sources can be found in most Linux distributions. The Linux kernel
    that you install onto your system was developed using these sources. They can
    be found at ftp://ftp.cs.helsinki.fi and are shadowed on other websites. If you
    don''t have Internet access, you can get hold of a CD ROM from vendors who offer
    snapshots of prominent websites for a reasonable price. Some vendors also offer
    subscription services with periodic updates. Your local Linux user group is another
    excellent alternative.


    Several directories can be found at the highest level of the source tree /usr/src/Linux:


    +   **Arch:** The kernel code specific to the architecture is present in this
    subdirectory. It is further divided into subdirectories, one for each architecture.
    Alpha and i386 are examples of the subdirectories.


    +   **Include:** The include files required for building the kernel code are present
    in this subdirectory. It is also divided into one subdirectory for each architecture.
    Editing the kernel makefile and then rerunning the configuration program of the
    kernel can change the architecture.


    +   **Init:** The kernel''s initialization code is present in this directory.
    To understand the working of a kernel, this could be a good place to start.


    +   **MM:** Files related to memory management are present in this directory.
    The code related to the memory management for each architecture is present in
    arch/*/mm/.


    +   **Drivers:** This contains the device drivers of the system, which are classified
    into different classes.


    +   **IPC:** The code for inter-process communication is present in this directory.


    +   **Modules:** The modules are created and held by this directory.


    +   **FS:** The code of the file system is present in this directory. This directory
    has several subdivisions, one for each file system.


    +   **Kernel:** This consists of the kernel code. The kernel code specific to
    the architecture can be found in arch/*/kernel.'
  merge: -1
  img_proc: true
- pgno: 27
  md: '**Net:** This is the networking code of the kernel.


    **Lib:** The library code of the kernel is present in this directory. The library
    code specific to an architecture is present in arch/*/lib/.


    **Scripts:** The scripts that are used during the configuration of the kernel
    are present in this directory.'
  merge: -1
  img_proc: true
