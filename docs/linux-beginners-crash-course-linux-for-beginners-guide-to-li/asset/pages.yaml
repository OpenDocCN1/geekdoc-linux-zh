- pgno: 89
  md: '# # Wildcards


    Wildcards are building blocks that let you come up with a pattern that defines
    a set of directories or files on Linux. Remember that when we refer to directories
    and files on the command line, it is a path that we are referring to. When we
    do this, we can use wildcards within the path, which allows us to turn it into
    a set of directories or files.


    The basic wildcards are:


    +   - * represents zero or more characters.

    +   - ? represents a single character.

    +   - [] represents a range of characters.


    For the first example, we will use * to request a list of all entries that begin
    with the letter “b”:


    ```

    ```

    pwd

    /home/Simon/linuxtutorialwork

    ls

    barry.txt blah.txt bob example.png firstfile foo1 foo2

    foo3 frog.png secondfile thirdfile video.mpeg

    ls b*

    barry.txt blah.txt bob

    ```


    ```


    # ## Under the hood


    This is quite interesting. At first glance, you might assume that the ls command
    is receiving argument b* and is translating that to bring up the requested matches.
    However, the translation is being done by bash, which is the program that is responsible
    for giving us the command line interface. When we put in this command, it will
    spot that we have included wildcards. Then, before it can run the command, it
    will replace that pattern with every single directory or file that matches it.
    We give the command


    ```

    ```

    ls b*

    and it is translated into

    ls barry.txt blah.txt bob

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 90
