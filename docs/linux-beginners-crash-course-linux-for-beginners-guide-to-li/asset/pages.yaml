- pgno: 70
  md: '# Chapter 9 – Moving Around Linux


    You can use a command called *cd* to move around in Linux. This stands for change
    directory, and it works like this:

    cd [location]


    If you run cd without using an argument, it will take you to your home directory
    automatically. But usually it is run with a single argument on the command line,
    *i.e.*, the location of the directory that you want to change to. This is specified
    as a path and can be a relative or an absolute path using any of the building
    blocks that we talked about in the last chapter.


    Have a look at these examples:


    pwd

    /home/Simon

    cd Documents

    ls

    file1.txt file2.txt file3.txt

    …

    cd /

    pwd

    /

    ls

    bin boot dev etc home lib var

    …

    cd ~/Documents

    pwd

    /home/Simon/Documents'
  merge: -1
  img_proc: true
