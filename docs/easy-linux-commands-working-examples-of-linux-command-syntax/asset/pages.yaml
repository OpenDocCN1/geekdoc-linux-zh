  md: '# Using the test Command or [ expression ]


    Either the test command or just an expression in square brackets [ expression
    ] can be used to evaluate whether an expression is true (zero) or false (non-zero).
    As the following example illustrates, an expression evaluation can be accomplished
    in a number of ways.


    ```

    $ x=3

    $ y=7

    $ test sx -lt $y && echo " Option 1 -- $(x) is less than $(y)"

    Option 1 -- 3 is less than 7

    $ if test sx -lt $y

    then

    > echo " Option 2 -- $(x) is less than $(y)

    fi

    Option 2 -- 3 is less than 7

    $ if [ sx -lt $y ]

    then

    > echo " Option 3 -- $(x) is less than $(y)

    fi

    Option 3 -- 3 is less than 7

    ```


    The three conditional statements above all test for the exact same condition.
    In the first one, && is used to execute the echo command if, and only if the exit
    status of the test command is 0.


