  md: '# # Redirection of Standard Input & Output


    In Linux, the standard input device is the keyboard, and the standard output device
    is the display screen. These are the defaults for input and output, however, Linux
    does allow the redirection of both standard input and output to files. In other
    words, Linux accepts input from files and can direct output to files.


    Three symbols are used to indicate redirection to Linux. Table 8.2 shows the meanings
    of the symbols:


    | Symbol | Meaning |

    | --- | --- |

    | < | Accept input from a file instead of the keyboard |

    | > | Send output to a file instead of the display device (overwriting the file)
    |

    | >> | Append output to the end of the indicated file. For example, a log file
    |


    **Table 8.2:** Redirection symbols and their meanings


