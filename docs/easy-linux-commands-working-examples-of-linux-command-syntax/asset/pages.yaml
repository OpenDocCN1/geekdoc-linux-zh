    The creation of a variable requires merely choosing a lower-case name for the
    variable and giving it a value using an equal (=) sign. There should be no spaces
    on either side of the equal sign. If there are spaces or special characters in
    the contents of your variable you should enclose the variable in single quotes.


    The unset command can be used to nullify the value of a previous variable. The
    following are some examples:


    ```

    $ myname=''Terry Clark''

    $ echo myname

    ```'
