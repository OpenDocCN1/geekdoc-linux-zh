    # Important System Files


    Everything in the Linux environment exists in files. It makes sense for users
    to become familiar with some of the more important Linux system files. Some of
    these are configuration files, others are devices which Linux makes available
    through files and some are executable programs.


    Table 5.2 below is by no means intended to an exhaustive list of Linux system
    files; however, it is a good representation to give some insight into the inner
    workings of Linux.


    | File | Description |

    | /boot/vmlinux | The Linux kernel file. File naming conventions may include release
    information |

    | /dev/fd0 | Device file for the first floppy disk drive on the system |

    | /dev/fd0H1440 | Device driver for the first floppy drive in high density mode,
    commonly invoked when formatting a floppy diskette for that density |

    | /dev/hda | Device file for the first IDE hard drive on the system |

    | /dev/hdc | Commonly, the IDE CDROM device file which is often a symbolic link
    called to /dev/cdrom, the real CDROM device. |

    | /dev/null | A dummy device which contains nothing. It is sometimes useful to
    send output to this device to make it go away forever. |

    | /etc/aliases | Contains aliases used by sendmail and other mail transport agents.
    Whenever this file is changed, the newaliases utility |'
