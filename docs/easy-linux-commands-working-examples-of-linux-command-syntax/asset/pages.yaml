  md: 'command. The userdel command can be used with the -r option to automatically
    delete the user''s home directory. Just make sure if you are using the -r option
    that there is nothing in the user''s home directory that you need!


    ```

    $ ls -chuck

    $ userdel -r chuck

    ```


    We have listed the user''s home directory and it is empty. Actually there are
    some hidden files which were created with the home directory but we are not concerned
    about them. Next we must use the userdel -r command to remove the user and their
    home directory.


    # Get Process Status


    To view the current processes (running programs) active within the system, the
    process status (ps) command can be used. The ps command accepts a large number
    of options, however the most useful ones are the all (-e) option and the full
    (-f) option, which can be entered as follows:


    | ps -ef | PID | PPID | C STIME TTY | CMD |

