  md: "# Displaying Virtual Memory Statistics\n\nThe vmstat command displays information\
    \ about processes, memory, paging, block IO, and different levels of CPU activity.\
    \ As with iostat, the first detail lines produce report averages since the last\
    \ reboot. Subsequent detail lines report information using the interval specified\
    \ on the command line.\n\nAs with the other commands in this section, the vmstat\
    \ command is driven by delay and count options that determine the time interval\
    \ between report lines and the totals of intervals to be reported.\n\n```\nvmstat\
    \ 3 5\nprocs    memory----      swap----      cpu-----\nr bswpd free buff cache\
    \ si so hi bo cs us id da wa\n0 0 63492 94856 24996 0 0 8 3484 29 1 99 0\n0 0\
    \ 63492 94856 24996 0 0 0 11005 25 1 99 0\n0 0 63492 94860 24996 0 0 0 13 1005\
    \ 24 1 99 0\n0 0 63492 94860 24996 0 0 0 9 1032 21 0 99 0\n0 0 63492 94864 24996\
    \ 0 0 0 4 1003 22 1 99 0\n```\n\nThe Linux man page for vmstat defines the fields\
    \ as follows:\n\n+   - procs\n  - r. The number of processes waiting for run time\n\
    \  - b. The number of processes in uninterruptible sleep, which means they are\
    \ waiting on a resource\n- memory\n  - swpd: Virtual memory used\n  - free: Idle\
    \ memory\n  - buff: Amount of memory used as buffers\n  - cache: Current memory\
    \ used as cache\n- swap\n  - si: Memory swapped in per second from disk\n  - so:\
    \ Memory swapped out per second to disk\n- io"
  merge: -1
  pgno: 171
- img_proc: true
  md: "+   - bi: Blocks per second received from a block device\n- bo: Blocks per\
    \ second sent to a block device\n\n+   system\n  - in: Number of interrupts per\
    \ second, including the clock\n  - cs: Number of context switches per second\n\
    - cpu: These statistics are percentages of total CPU time:\n  - us: User time\
    \ spent running non-kernel code, includes nice time\n  - sy: System time spent\
    \ running kernel\n  - id: Idle time\n  - wa: Wait time spent waiting for I/O\n\
    \nThe vmstat information can be invaluable when studying resource utilization\
    \ trends. Here are a few examples of how vmstat output can be interpreted:\n\n\
    If over time the run queue value, proc-r, remains consistently higher than the\
    \ number of processors in the server and CPU idle time is low, the system is CPU\
    \ bound and can benefit from the addition of more and/or faster processors. Alternatively\
    \ a high number displayed in the proc-b column also indicates a bottleneck, but\
    \ one where processes are waiting for other resources.\n\nIf the virtual memory\
    \ used (memory-swpd) remains high and the free memory (memory-free) remains low,\
    \ then the system is memory constrained and will benefit from additional RAM.\n\
    \nConsistently high I/O rates paired with consistently low CPU utilization (cpu-us)\
    \ indicates an I/O bound system that could benefit from a highly buffered disk\
    \ array or possibly solid-state disk."
