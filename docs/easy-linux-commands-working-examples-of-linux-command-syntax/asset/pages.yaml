    # Archiving directories and files


    There are several reasons you may want to create an archive of a file or directory.
    Here are some of the most common ones:


    +   * Archive and compress unused directories to conserve disk space


    +   * Create an archive of a directory and files before an upgrade allowing you
    to restore the original contents if there is a problem


    +   * Archive a directory before making any major changes


    +   * Create an archive to move several files and folders to another system as
    one


    +   * Create an archive as a means of software distribution'
