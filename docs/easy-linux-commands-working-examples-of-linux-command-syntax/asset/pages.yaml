  md: '# Cutting, Copying, and Pasting Text


    Any of the text deleting commands presented earlier work similarly to the cut
    feature of Windows in that they place the deleted text in a buffer area for potential
    retrieval at a later time. In Windows, the buffer is referred to as the clipboard.


    In vi there is an unnamed default buffer and 26 referenced buffers, each identified
    by one of the letters of the alphabet (a, b, c, d, etc.). In order to reference
    one of the named buffers, the buffer identifier character is preceded by a single
    open quotation. So, “a” refers to buffer a, “b” refers to buffer b, and so on.


    When one of the delete commands is used, the text is cut from the document and
    placed in the default buffer. To retrieve text from the default buffer, the upper
    case P command can be used to paste the default buffer before the current cursor
    line, or the lower case p command can be used to paste the contents of the buffer
    after the current line. Therefore, a 5dd command followed by a cursor movement
    would cut five lines of text and place them before the line where the cursor was
    moved.


    Instead of cutting or deleting text, it is also possible to copy text from a file
    using the yank command. The yank command presents the option of copying text to
    one of the named buffers. Where yy would copy the current line to the unnamed
    default (unnamed), “cyy would copy the current line to the buffer c.


    The issuance of multiple yank commands to the same buffer without intervening
    paste commands will result in overwrites. In other words, the user cannot yank
    line five to buffer a, then yank line seven to buffer a and expect to paste both
    lines five and seven somewhere. When a user yanks line five, it is placed in buffer
    a as requested, but when a command to yank line 7 to buffer a follows, line 7
    will overwrite line five, which is sitting in the buffer. This is one of the reasons
    for providing multiple named buffers to use for multiple'
