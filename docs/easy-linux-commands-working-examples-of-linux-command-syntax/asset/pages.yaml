  md: 'argument can be referenced using the variable $S1, the second argument using
    $S2, etc. The $S0 variable is special and contains the name of the command used
    to invoke the script or command name. The following is an example of command line
    arguments.


    ```

    # This script accepts a user''s first and last name

    # displays the current login username, hostname, and home

    #


    firstname=$S1

    lastname=$S2


    echo ""

    echo "Hello $1"

    echo "You are logged in as: $USER on server: $HOSTNAME"

    echo "Your home directory is: $HOME"

    echo "Thank you, $firstname $lastname for invoking the $S0 command"

    echo ""

    ```


    Note that anything after a pound sign (#) in a shell script is a comment and will
    be ignored when the script is run.


    If we were to run the above script here is what you would get as a result:


    ```

    $ ./mylogin Terry Clark


    Hello Terry

    You are logged in as: tclark on server: appsvr.mytec.com

    You home directory is: /home/tclark

    Thank you, Terry Clark for invoking the ./mylogin command

    ```


    We can see how the script has captured the input and substituted the $S0, $1 and
    $S2 variables into the context of the output. We have also used some of the global
    shell variables discussed earlier like $USER, $HOSTNAME and $HOME.


    Sometimes the input you''re looking for won''t come from a user at a keyboard
    rather than from a file or the output of another command. Other times you may
    want to output information to an output file or a log. Next we''ll look at how
