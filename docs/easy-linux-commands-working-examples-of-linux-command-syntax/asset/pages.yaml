    # A Warning about Relative and Absolute Paths in tar


    As with other commands tar can be used with either relative or absolute paths.
    When specifying the tarfile to be created or extracted there is little difference
    between these two methods; however, if you use an absolute path when listing files
    to be archived you might get a surprise when you extract them!


    If an absolute path is used to tell tar which files to archive, like with the
    command below the archive will record the absolute path and restore those files
    to that path, no matter where tar is run from or where the tarfile is.


    ```

    $ tar -cf examples.tar /home/tclark/examples

    ```


    If an absolute path is not specified on archiving the files will be extracted
    into the working directory or the appropriate subfolder of the working directory.


    # Combining Files


    On occasion, the need to combine or concatenate two or more files may arise. The
    cat (short for concatenate) command is a nice simple way to get this done. The
    cat command can take several file names as arguments and will output them all
    as one file in the order they are listed.


    By default cat will output the concatenation of the files to the screen but it
    is easy to redirect the output to a file with the > redirection operator.


    In this example we use cat to concatenate file1.dat, file2.dat and file3.dat into
    the file combined.dat.


    ```

    $ cat file1.dat file2.dat file3.dat > combined.dat

    ```'
