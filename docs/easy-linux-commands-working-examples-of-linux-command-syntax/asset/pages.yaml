    # Deleting Directories


    The rmdir (remove directory) command is used to delete an empty directory. The
    directory to be deleted can be referenced via an absolute path or via a relative
    path starting with the current working directory. The following are some examples
    of each method:


    ```

    $ rmdir /home/tclark/new_dir1

    $ ls

    examples new_dir2 new_dir3

    $ rmdir new_dir2

    $ ls

    examples new_dir3

    ```


    A directory cannot be removed with the rmdir command unless it is completely empty.
    To remove a directory and its contents you can use the rm -r command which will
    be covered later in this chapter. Be careful with this as you can easily delete
    more than you had intended!'
