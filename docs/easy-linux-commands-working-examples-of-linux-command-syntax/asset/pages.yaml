  md: 'The destination file name need not be coded because it is the same as the source
    file.


    It''s important to keep track of which of these files is the original. Frankly
    the ls -l command will indicate a file is a symbolic link in two ways.


    ```

    $ ls -l appl.par

    lrwxrxwwx 1 tclark authors   2229 Jan 13 21:35 appl.par ->

    /var/apps/common/parms/appl.par

    ```


    The first indication we get that this is a symbolic link is the first letter of
    the line describing this file is l. We can also see that ls has indicated the
    location of the original file after the file name.


    Symbolic links can be edited just like the original file and the permissions of
    the original file determine who can edit the symbolic link. Symbolic links can
    also be removed with the rm command without affecting the original file. If the
    original file is removed the link will fail to work.


    Directories can be linked with a symbolic link. This can often be useful to make
    a directory appear as if it is somewhere it is not.


    Now we''ll talk briefly about moving files and directories between machines with
    the scp command.


    # Remote file copy


    The scp (secure copy) command can be used to copy files or even directories to
    a remote host. scp is a replacement for the rcp (remote copy) command. While rcp
    provides the same functionality it is not encrypted and therefore secure. The
    scp command uses SSH for data transfer, providing SSH level security.


    scp takes arguments in the form of scp -options source destination. The most common
    option is the -r (recursive) option which is necessary if you are using scp on
    multiple files or on directories. The'
