  md: '# Installing a disk


    While the exact steps will be vendor specific (always consult the documentation
    for your hardware and software) here is the overall procedure for installing a
    new disk in a typical Linux desktop workstation. In the example described below
    we are adding a new drive to an open drive bay.


    Here is a quick overview of the steps we will take to setup a new disk:


    +   1. Shut down the system

    2. Install the drive into an open drive bay

    3. Startup the system and enter the BIOS to make the hardware aware of the new
    disk

    4. Partition the new disk with fdisk

    5. Format the new partition with mkfs

    6. Mount the new partition with the mount command

    7. Add the new partition to the /etc/fstab file so it will be mounted at startup
    time in the future


    Most workstations have IDE or EIDE hard drives. SATA has also recently become
    a popular option. Modern onboard EIDE controllers can handle four attached devices.
    Typically at least one of these devices is a CD-ROM or DVD-ROM drive and one other
    is a hard drive. In Linux, these four devices are identified as hda, hdb, hdc,
    and hdd in the /dev directory. The hard disks can have many partitions on each
    disk and the partitions are also identified in the /dev directory. For example,
    /dev/hdb2 refers to the second partition on the hard disk connected to the first
    controller port.


    Follow your manufacturer''s instructions and any instructions that came with the
    hard drive to install the drive in a free bay. I would give you more specific
    instructions here if I could, but the methods for the hardware part of installing
    and configuring a drive vary widely between'
  merge: -1
  pgno: 177
- img_proc: true
  md: "manufacturers. Especially close attention must be paid to jumper settings on\
    \ the hard drives.\n\nIf there are no free bays or ports left you may need to\
    \ replace one of the installed drives, just be careful you don't remove the drive\
    \ you're booting from. It is important to remember to hook up both the IDE and\
    \ power cables before closing the machine; otherwise you will be very disappointed\
    \ with the results.\n\nAs the boots you will want to enter the BIOS setup for\
    \ the system to make the hardware aware of the new disks presence. The methods\
    \ of entering the BIOS also vary from machine to machine but most systems will\
    \ tell you as they start booting up how to enter the BIOS.\n\n# Partition the\
    \ New Disk\n\nNow that we've installed the disk and know its device path we are\
