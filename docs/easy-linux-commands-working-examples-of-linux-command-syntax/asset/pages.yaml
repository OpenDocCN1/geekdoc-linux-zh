    # Setting Default Permissions Using a File Mask


    By default, Linux permissions for new directories are typically set to 755 allowing
    read, write, and execute permissions to user and only read and execute to group
    and other users. Conversely, file permissions default to 644 allowing read and
    write access to user but only read to group and others. These defaults are controlled
    by the user file-creation mask or umask.


    A user or administrator may want to change the Linux default permissions by using
    the umask command in a login script. The umask command can be used without specifying
    any arguments to determine what the current default permissions are. The value
    displayed by umask must be subtracted from the defaults of 777 for directories
    and 666 for files to determine the current defaults. A typical umask which will
    generate the permissions listed in the previous paragraph will be 0022. The first
    digit pertains to the sticky bit which will be explained further later in this
    section.


