- img_proc: true
  md: '# Scheduling Jobs with crontab


    ![](img/056ab74889c0b34d529c56d42bb0a965_137_0.png)


    > Scheduled maintenance can keep a Linux server tidy


    # The cron Daemon


    This final chapter will introduce the details on how to schedule shell scripts
    to execute on a regular timetable. The cron daemon is the system task that runs
    scripted jobs on a pre-determined schedule. The crontab command is used to tell
    the cron daemon what jobs the user wants to run and when to run those jobs.'
  merge: -1
  pgno: 137
- img_proc: true
  md: 'Each Linux user can their own crontab file, if allowed by the System Administrator.
    The administrator controls use of crontab by including users in the cron.deny
    file to disallow use of crontab.


    # crontab Options


    As shown in Table 10.1, the crontab command has several options with different
    purposes.


    | Option | Purpose |

    | --- | --- |

    | -e | edit the current crontab file using the text editor specified by the EDITOR
    environment variable or the VISUAL environment variable |

    | -l | list the current crontab |

    | -r | remove the current crontab |

    | -U | specifies the user''s crontab to be manipulated. This is usually used by
    you root to manipulate the crontab of other users or can be used by you to correctly
    identify the crontab to be manipulated if you have used the sum command to assume
    another identity |


    Table 10.1: crontab options and purposes


    crontab also accepts a file name and will use the specified file to create the
    crontab file. Many users prefer to use this option rather than the crontab -e
    command because it provides a master file from which the crontab is built, providing
    a backup to the crontab. The following example specifies a file called mycron.tab
    to be used as the input for crontab.


    ```

    $ crontab mycron.tab

    ```


    Here''s how you would use the crontab -l command to view the current cron entries
    for the logged in user.


    ```

    $ crontab -1

    ********************************************************************

    # Run the Weekly file cleanup task at 6:00AM every Monday

    # and send any output to a file called cleanup.1st in the

    # /tmp directory

    ********************************************************************

    ```'
  merge: -1
  pgno: 138
- img_proc: true
  md: '```

    00 06 * * 1 /home/terry/cleanup.ksh > /tmp/cleanup.lst


    # Run the Weekly Management Report every Monday at 7:00 AM

    # and save a copy of the report in my /home directory

    ######################################################

    00 07 * * 1 /home/terry/weekly_mgmt_rpt.ksh wprd >

    /home/terry/weekly_mgmt_rpt.lst

    ```


    If we want to delete all the entries in the crontab we can use the -r option.


    ```

    $ crontab -r

    ```


    # The Format of the crontab File


    The crontab file consists of a series of entries specifying what shell scripts
    to run and when to run it. It is also possible to document crontab entries with
    comments. Lines which have a pound sign (#) as the first non-blank character are
    considered comments. Blank lines are completely ignored. Comments cannot be specified
    on the same line as cron command lines. Comments must be kept on their own lines
    within the crontab.


    There are two types of command lines that can be specified in the crontab: environment
    variable settings and cron commands. The following sections will provide more
    detail on these two types of crontab entries.


    # Environment variable settings


    Each environment variable line consists of a variable name, an equal sign (=),
    and a value. Values that contain spaces need to be enclosed within quotes. The
    following are some examples of environment variable settings:


    ```

    color = red

    title = ''My Life in a Nutshell''

    ```'
  merge: -1
  pgno: 139
- img_proc: true
  md: 'It is important to remember variable names are case sensitive and that system
    variables are usually defined with upper case names, while user defined variables
    are defined with lower case names.


    # crontab Command Lines


    Each crontab command line is comprised of six positional fields specifying the
    time, date and shell script or command to run. The format of the crontab command
    line is described in Table 10.2 below:


    | Field | Minute | Hour | Day of Month | Month | Day of Week | Command |

    | --- | --- | --- | --- | --- | --- | --- |

    | Valid values | 0-59 | 0-23 | 1-31 | 1-12 | 0-7 | Command path/command |


    **Table 10.2:** crontab command line format


    Each of these fields can contain a single number, a range of numbers indicated
    with a hyphen (as as 2-4), a list of specific values separated by commas (like
    2,3,4) or a combination of these designations separated by commas (such as **1,3-5**).
    Any of these fields may also contain an asterisk (*) indicating every possible
    value of this field. This can all get rather confusing let''s take a look at a
    few examples.


    The next several examples are all part of the same crontab file. We have broken
    it up in order to explain each entry individually.


    ```

    # Use the Korn Shell for all shell scripts

    SHELL=/bin/ksh

    ```


    This sets the default shell for these cron scripts by setting the SHELL environment
    variable.


    ```

    ********************************************************************

    # Run the Weekly cleanup task at 6:00AM every Monday

    # and send any output to a file called cleanup.lst in the

    # /tmp directory

    ********************************************************************

    00 06 * 1 /home/terry/cleanup.ksh > /tmp/cleanup.lst

    ```'
  merge: -1
  pgno: 140
- img_proc: true
  md: 'This entry will run the script cleanup.sh at 0 minutes past the hour, 6 am,
    every day of the month, every month of the year, but only on Mondays. This illustrates
    that for a crontab to execute all of the conditions specified must be met, so
    even though we''ve said every day of the month by making the third field wildcard,
    the day also has to meet the final condition that the day is a Monday.


    ```

    ################################********************************

    # Run the Weekly Management Report every Monday at 7:00 AM

    # and save a copy of the report in /home directory

    ################################********************************

    00 07 * * 1 /home/terry/weekly_mgmt_rpt.ksh wprd > /home/terry/weekly_mgmt_rpt.lst

    ```


    This entry is very similar but will execute at 7:00am. Since the hour is in 24
    hour format (midnight is actually represented as 00) we know the 07 represents
    7:00 a.m. This entry again will be run once a week.


    ```

    ################################################****************

    # Weekly Full Backup - run every Sunday at 1:30AM

    ################################################****************

    30 01 * * 0 /home/terry/full_backup.ksh wprd > /tmp/full_backup.lst

    ```


    Here we have specified this script to run at 30 minutes past the hour, the first
    hour of the day, but only on Sundays. Remember that in the day of the week column
    Sunday can be represented by either 0 or 7.


    ```

    ################################################################

    # Nightly Incremental Backup - run Monday-Saturday at 1:30AM

    ################################################################

    30 01 * * 1-6 /home/terry/incr_backup.ksh > /tmp/incr_backup.lst

    ```


    In this crontab entry we have the same indication for hour and minute as the last
    entry but we have specified a range for the day of the week. The range 1-6 will
    cause the incr_backup.ksh to be executed at 1:30 every morning from Monday through
    Saturday.


    ```

    ################################################****************

    # Low disk space alert ... run every 15 minutes, sending

    # alerts to key individuals via e-mail

    ################################################################

    00,15,30,45 * * * /home/terry/free_space.ksh > /tmp/free_space.lst

    ```'
  merge: -1
  pgno: 141
- img_proc: true
  md: 'This entry has minutes separated by a comma indicating that it should be run
    at each of the indicated times. Since all the other fields are wildcards (*) the
    entry will be run on the hour (00), 15 minutes past the hour, 30 minutes past
    the hour and 45 minutes past the hour.


    ```

    *************************************************

    # Lunch Time Notification - run Monday-Friday at Noon -

    # sends a message to all users indicating it''s lunch time

    ****************************************************************

    00 12 * 1-5 /home/terry/lunch_time.ksh wprd > /tmp/lunch_time.lst

    ```


    This lunch reminder is set up to run at 12:00 p.m. Monday through Friday only.


    The most important thing to remember is that a crontab will execute every time
    all of its conditions are met. To take the last entry as an example, any time
    it is 00 minutes past the hour of 12 on any day of the month and any month of
    the year and the day of the week is between Monday and Friday inclusive (1-5)
    this crontab will be executed.


    You will use wildcards in most crontab entries but be careful where you use them.
    For instance, if we mistakenly placed a * in the minute position of the last crontab
    example we would end up running the script for ever minute of the 12:00 hour instead
    of just once at the beginning of the hour. I don''t think anyone needs that reminders
    to go to lunch, do you?


    As mentioned above, the day-of-week field accepts either zero or seven as a value
    for Sunday. Any of the time/date fields can also contain an asterisk (*) indicating
    the entire range of values. Additionally, month and day-of-week fields can contain
    values, consisting of the first three letters of the month, as indicated in Table
    10.3 below.


    | Field | Valid Entries (case insensitive) |

    |---|---|

    | Days of the week | sun, mon, tue, wed, thu, fri, sat SUN, MON, TUE, WED, THU,
    FRI, SAT |

    | Months of | jan, feb, mar, apr, may, jun, jul, aug, sep, oct, dec |


    The Format of the crontab File'
  merge: -1
  pgno: 142
- img_proc: true
  md: '| year | JAN, FEB, MAR, APR, MAY, JUN, JUL, AUG, SEP, OCT, NOV, DEC |


    Table 10.3: day-of-week field values


    When numbers are used, the user can specify a range of values separated by a hyphen
    or a list of values separated by commas. In other words, specifying 2-5 in the
    hour field means 2AM, 3AM, 4AM and 5AM, while specifying 2,5 means only 2AM and
    5AM.


    We''ve talked an awful lot about how to specify the date and time in the crontab
    but what about the command? Well, most folks will write shell scripts to execute
    with their crontab entries but you can actually just execute a command from the
    crontab as well. Either way sure you put the absolute path to your command in
    the crontab.


    If the command or script you call in crontab typically sends output to the screen
    you will probably want to redirect that output to a log file with the >> symbol
    so you can check it later. Be careful with this as the log files may get rather
    large over time!


    # Conclusions


    In this chapter, we covered how to schedule commands and shell scripts to run
    at certain times of day, on certain days of the week, or days of the month, etc.
    This allows the automation of processes that need to be run repetitively on a
    fixed schedule.


    With careful setup and scheduling you will find you can automate most repetitive
    tasks with a combination of shell scripting and the use of cron. This can save
    you hours a day on a large or complex system!


    Now we''ll look at some Linux administration commands which can be used to setup
    and maintain the overall system.'
  merge: -1
  pgno: 143
- img_proc: true
  md: '# # Linux Administrator Commands


    Even if you are not the system administrator for the Linux box you use it will
    often be necessary to perform some basic administrative commands throughout the
    workday. Some of the commands require being logged into the system as the root
    user.


    In Linux, the root user is the administrator user with complete authority on that
    system. The root user is created when the operating system is installed and is
    the most powerful user on any Linux system; thus, the root user has the authority
    to do whatever, whenever.


    Because of its power many administrators will not hand out the root user on a
    production machine and rightly so! If you are given the root password, be very
    careful. You could easily delete other user''s files, kill their running programs
    or completely destroy the entire server.


    Since the root user has so much power many administrators give limited administrative
    privileges to users using a command called sudo (typically pronounced like "pseudo.")
    Through the use of sudo the administrator can allow you to run only certain commands
    as root and can track what you have executed.


    If you have been given sudo access to run a command as root all you have to do
    is prefix the command you want to run with sudo like this:


    ```

    $ sudo shutdown -r +3

    ```


    # # Shutting Down and Changing Runlevels


    On occasion, it may be necessary to shut down the Linux server or reboot it after
    a configuration change. The execution of the shutdown


    Shutting Down and Changing Runlevels'
  merge: -1
  pgno: 144
- img_proc: true
  md: 'command requires root privileges. After all, it would not be good to have just
    anyone shutting down a server, particularly a production server running critical
    business applications.


    When the shutdown command is issued, all users that are directly logged in are
    notified that the system is going down and further logins are disabled. The administrator
    has the option of shutting down the system immediately or after a delayed warning
    period. If there are other users on the system, the courteous thing to do would
    be to warn them that the system is being shut down that they can save their work
    and log off the system gracefully.


    Always keep in mind that people may be using a system through a web page or other
    indirect means. These people will not receive any warning when the system is shut
    down.


    To shutdown a server immediately we specify now as the time. The -h option causes
    the system to be halted after the shutdown.


    ```

    $ shutdown -h now

    ```


    The -r option is used to cause the system to reboot after it has shutdown. As
    mentioned above, if other users are currently on the system it would be nice to
    give them a little warning so here we have specified +3 to cause the system to
    warn users and wait three minutes before restarting.


    ```

    $ shutdown -r +3

    ```


    Yet another form of the shutdown command will allow you to specify the time you
    want the command to happen.


    ```

    $ shutdown -r 17:00

    ```


    The command above will cause the system to reboot at 5:00 p.m.


    The state or mode of a Linux system is described as a runlevel. The shutdown command
    of mode is one way to control what runlevel a Linux system is running in. For
    instance, shutdown -h now seen above'
  merge: -1
  pgno: 145
- img_proc: true
  md: 'will change the runlevel to 0 and shutdown -r +3 will change the runlevel to
    6. The runlevels control what can be run on a system and who can log into it.


    If the system is running and you would like to change the runlevel, for instance
    if you need to do some maintenance in single user mode, you can use the telinit
    command to change the current runlevel.


    ```

    # telinit 1

    ```


    While you can use telinit to switch to a higher or lower runlevel changing to
    a lower runlevel may sometimes have unexpected results and will definitely kick
    others off the system. Use it with care.


    When the system boots it will come up to the specified runlevel (runlevel 5 by
    default). Certain things are enabled at each runlevel and specific scripts will
    be run as the system enters a runlevel. Typically a running Linux system will
    be in runlevel 5.


    Let''s take a quick look at each of the runlevels.


    +   - 0: Used to halt the system

    - 1: Single-user mode for performing administrative tasks

    - 2: Multi-user mode, without networking

    - 3: Multi-user mode, with networking

    - 4: Currently unused

    - 5: Multi-user mode with graphical user interface (GUI), usually the default
    runlevel

    - 6: Used to reboot the system


    To find out what runlevel you are currently running in you can use the -r option
    of the who command.


    | who -r run-level 5 Oct 4 20:08 last= |


    Shutting Down and Changing Runlevels 135'
  merge: -1
