    The next section will introduce some useful utilities that are provided with most
    Linux releases. These utilities allow some interactive monitoring of the system.


    # Server monitoring commands


    Some popular commands/utilities for monitoring system resources and tasks managed
    by the Linux kernel are as follows:


    +   - top: Provides a dynamic real-time view of a running system, including information
    about system resource usage and a constantly updated list of the processes which
    are consuming the most resources. Because it is so useful for administration we
    will talk quite a bit about top in chapter 8.

    - mpstat: Reports activities for each available processor, processor zero being
    the first one reported. Global average activities across all processors are also
    reported.

    - iostat: Used for monitoring the load on system input/output devices by observing
    the time the devices are active compared to the average transfer rate of the device.

    - vmstat: Displays information about processes, memory, paging, block IO, and
    different levels of CPU activity


    # Interactive Statistics using the top Utility


    The top program provides a dynamic real-time view of a running Linux system. This
    can be one of the most useful ways to monitor the system as it shows several key
    statistics on the same page with'
