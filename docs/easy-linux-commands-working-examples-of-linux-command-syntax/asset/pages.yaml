    Now we see that find has turned up what we were looking for. Now we will refine
    our search even further.


    # Finding_txt Files Modified in the Past 3 Days


    Sometimes we are only concerned specific files in the directory. For example,
    you wrote a text file sometime in the past days and you can''t remember what it
    called or where you put it. Here''s


    Finding by Age'
  merge: -1
  pgno: 84
- img_proc: true
  md: 'one way you could find that text file without having to go through your entire
    system:


    ```

    $ find -name ''*.txt'' -mtime -3

    ./preamble.txt

    ./other.txt

    ```


    Now you''ve got even fewer files in the last search and you could easily identify
    the one you''re looking for.


    # Find files by size


    If a user is running short of disk space, they may want to find some large files
    and compress them to recover space. The following will search from the current
    directory and find all files larger than 10,000KB. The output has abbreviated
    to save trees and ink.


    # Finding Files Larger than 10,000k


    ```

    $ find -size +10000k

    ./proc/kcore

    ./var/lib/rpm/Packages

    ./var/lib/rpm/Filemd5s

    /home/stage/REPCA/REPCA/wireless/USData.xml

    /home/stage/REPCA/REPCA/wireless/completebootstrap.xml

    /home/stage/REPCA/REPCA/wireless/bootstrap.xml

    /home/bbcl_9e-btf/BBOUT.OLD

    ```


    Similarly a - could be used in this example to find all files smaller than 10,000KB
    - Of course there would be quite a few of them on a Linux system.


    The find command is quite flexible and accepts numerous options. We have only
    covered a couple of the options here but if you want to check out more of them
    take a look at find''s man page.


    Most of find''s options can be combined to find files which meet several criteria.
    To do this we can continue to find criteria like we did when finding .txt files
    which had been modified in the past three days.'
  merge: -1
  pgno: 85
- img_proc: true
  md: '# Doing things with what we find


    The -exec option gives find the powerful ability to execute commands on the files
    found. The syntax is a little tricky but an example is usually all it takes to
    get it right.


    Before using the -exec option, especially with a powerful command like rm -I recommend
    performing the same find without the -exec. By doing this you will see exactly
    which files you will be affecting when you run the final command.


    The following is a practical example that finds files less than three days old
    with the .txt extension and deletes them.


    # Finding $ find -name ''*.txt'' -mtime -3 -exec rm {} \


    ```

    $ find -name ''*.txt'' -mtime -3 -exec rm {} \

    $ ls -lt

    total 8

    -rw-r-- 1 tclark authors 2229 Jan 13 21:35

    declaration.txt 1 tclark presidents 1310 Jan 13 17:48

    -rw-r-- 1 tclark presidents gettysburg.txt

    ```


    The -exec option allows you to put any command after it. Here we have used rm
    but it is often useful to use this option with cp or chmod. Within the command
    to run there must be two curly brackets {}. find will execute each file it finds
    substituting the file name (path) where the curly brackets are. Finally the end
    of the -exec option is signaled by an escaped semicolon (\;). The -exec option
    should always be the last option given in a find command.


    The find command is great for finding files and directories but next we''ll look
    at some options for finding other things on the system.'
  merge: -1
  pgno: 86
- img_proc: true
  md: '# Dealing with "Permission denied" in find


    If you use find a lot (and you probably will) you will sometimes run into the
    problem where you just get pages and pagès of output like this:


    ```

    $ find -name ''*.txt''

    find: /var/lib/dav: Permission denied

    find: /var/lib/nfs/statd: Permission denied

    find: /var/lib/dhcpv6: Permission denied

    find: /var/lib/slocate: Permission denied

    find: /var/lib/xauthdir: Permission denied

    find: /var/lib/php/session: Permission denied

    find: /var/log/samba: Permission denied

    find: /var/log/ppt: Permission denied

    find: /var/log/audit: Permission denied

    find: /var/log/squid: Permission denied

    ```


    This is find telling you there are certain directories you don''t have permissions
    to search. This can make it very difficult to find the useful output of the find
    as it can be mixed with the permissions errors.


    To ignore these (and any other) errors and just get the results of what you can
    find we can use a special redirect at the end of the command. Redirecting output
    will be covered in more detail in the chapter on shell scripting, but suffice
    to say that in this command 2>/dev/null is redirecting the error output to nowhere.


    ```

    $ find -name ''*.txt'' 2>/dev/null

    /var/www/icons/small/README.txt

    /usr/X11R6/lib/X11/rgb.txt

    /usr/X11R6/lib/X11/doc/Xprint FAQ.txt

    /usr/lib4suite/tests/xml/Core/count.txt

    ```


    While it would not be a good idea to redirect the error output all the time (usually
    you would want to know when something has gone wrong) in this case of the find
    command it can be very useful.'
  merge: -1
  pgno: 87
- img_proc: true
  md: '# Finding a String within a Text File


    The **grep** command can be used to check a file for a specific string. If **grep**
    finds string it will print the line it found it on to the screen. Here''s an example:


    ```

    $ cd /etc

    $ grep localhost hosts

    127.0.0.1        localhost.localdomain    localhost

    ```


    Here we checked the **hosts** file in the /etc directory for the word **localhost**.
    It was found and **grep** printed the line it found. **grep** can be very useful
    for searching through output for errors or anything else which typically has a
    regular pattern.


    # Finding the Directory Path for a Command


    The commands we have been executing exist as files somewhere on the system. The
    **which** command is used to find the full path of these commands. The following
    examples will show how you can look for the directory where some commonly used
    executables are found.


    # Find the Directory Path for emacs and sort


    ```

    $ which emacs

    /usr/bin/emacs

    $ which sort

    /bin/sort

    ```


    The **which** command takes a single argument of any command. We have shown above
    the **which** command for **emacs** and **sort**. The result indicates where the
    binary files for those commands exist on the filesystem.'
  merge: -1
  pgno: 88
- img_proc: true
  md: "# # Finding the Location of Program Binary, Source, Manual Pages for emacs\
    \ and sort\n\nThe whereis command can also be used to locate the binary file for\
    \ commands. Additionally, whereis locates the source file and manual page file\
    \ the the command.\n\n```\n$ whereis emacs\nemacs:/usr/bin/emacs /usr/libexec/emacs\
    \ /usr/share/emacs\n/usr/share/man/man1/emacs.1.gz\n$ whereis sort\nsort: / /bin/sort\
    \ /usr/share/man/man1/sort.1.gz\n/usr/share/man/man3/sort.3pm.gz\n```\n\n# # Finding\
    \ Strings in Binary Files\n\nIf a user encounters a binary file and does not know\
    \ what it is used for or where it came from, they may gain some insight into its\
