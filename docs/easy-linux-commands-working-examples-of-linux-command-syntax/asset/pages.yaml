  md: '# Conclusions


    We covered a lot of ground in this chapter and you should now feel comfortable
    navigating and manipulating the directory structure within Linux.


    In this chapter we first looked at how to examine the directories and files in
    a file structure. We talked about how to tell what your current working directory
    is and how you can include it in your prompt so you''ll always know where you
    are.


    We then went on to see how to make, remove and rename directories. We talked about
    moving between directories with the `cd` command and how to view the contents
    of a directory.


    Delving into file manipulation we looked at how to make empty files and how to
    update the timestamp on an existing file. After seeing how easy it is to delete
    a file we showed how to make an alias which will cause the `rm` command to prompt
    us before deleting files.


    We talked about several uses for archiving with the `tar` command and saw how
    to create and extract tarfiles.


    We saw how to view the contents of a file, the beginning of a file, the end of
    a file and even how to combine files. We even talked about using `tail -f` to
    view lines as they are being written to a file.


    Symbolic links were discussed as a way to make files and directories appear in
    more than one place as well as how to copy things from one system to another.


    In the next chapter, some important Linux directories will be investigated in
    more detail and we will introduce some Linux files of which users will need to
    be aware.'
