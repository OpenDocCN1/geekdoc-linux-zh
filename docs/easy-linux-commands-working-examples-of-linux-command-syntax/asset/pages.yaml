    \ Blocks | System |\n\nCommand (m for help):\n\nThe **f** disk utility may be\
    \ used to show the menu options available at the main menu. Also shown, the **p**\
    \ command will print the partition layout currently on that disk.\n\nCommand (m\
    \ for help): n\n\n+   Command action\n  e extended\n  p primary partition (1-4)\n\
    PnPartition number (1-4): 1\nFirst cylinder (14-9726, default 14):\n  Using default\
    \ value 1\nLast cylinder or +size or +sizeM or +sizeK (1-9726, default 9726):\n\
    \  Using default value 9726\n\nCommand (m for help): w\n\nThe **n** menu selection\
    \ can be used to create a new partition. You can choose to create it as an extended\
    \ (e) or primary (p) partition type. Typically you will want to create a primary\
    \ partition. Next select a partition number. On a new disk 1 should be appropriate.\
    \ We can then type **w** to write out the new partition table to the disk and\
    \ it will be ready to format."
