    # Creating a Symbolic Link to a File


    Sometimes it''s handy to make a file alias as if it is in two places at

    once. Perhaps you frequently use a file or folder which is buried away

    some distant location or maybe you are working on a project with

    sone and you want to get the same file in your home

    directory. In these cases symbolic links can make your life easier.


    The In (link) command can be used to create a symbolic link of a file

    directory into another location. In the example we are

    making a symbolic link in the working directory will allow us to

    access the file for /var/app/common/parms/app1.par.


    ```

    $ ln -s /var/app/common/parms/app1.par ./

    ```


    The In command creates a symbolic link (sometimes called a soft link)

    from the source file, /var/apps/common/parms/app1.par, to a

    file with the same name, app1.par, in the current working directory.'
