    The `mv` command can also be used to move a directory to another location. This
    will be covered more later in this chapter when we talk about moving and renaming
    files.


    # Navigating the Directory Tree


    The `cd` (change directory) command is used to change from one directory to another.
    As with creating and deleting directories, it is possible to change to another
    directory by using either an absolute path or by using a relative path referenced
    from the current working directory.


    There are also some special shortcuts that can be used with the `cd` command.
    For instance, .. refers to the parent directory of the current working directory,
    ~ refers to the home directory of the current user and - refers to the last directory
    from which the user changed. The following are some examples of directory navigation.'
