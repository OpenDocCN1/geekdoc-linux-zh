    \ to \\${y}\"\n    echo \"\"\nelse\n  echo \"${x} is greater than \\${y}\"\n \
    \ echo \"\"\nfi\n```\n\nIn the example above, -lt was used as an operator to check\
    \ for a \"less than\" condition, and -eq was used to check for an \"equal\" condition.\
    \ Table 8.3 below contains a list of operators available for use when evaluating\
    \ conditional statements:\n\n| Operator | Meaning | Mathematical Equivalent |\n\
    | --- | --- | --- |\n| -eq | equal to | x == y |\n| -ge | greater than or | x\
    \ >= y |\n| | equal to | |\n| -gt | greater than | x > y |\n| -le | less than\
    \ or equal | x <= y |\n| | to | |\n| -lt | less than | x < y |\n| -ne | not equal\
    \ to | x != y |\n\n**Table 8.3:** Operators available for conditional statements\
