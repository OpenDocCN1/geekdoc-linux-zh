- img_proc: true
  md: 'Again the above output has been abbreviated to save trees, but you can see
    that there is some useful information here. Just knowing that "This is free software"
    and that it is copyrighted by the Free Software Foundation can give you some great
    insight on where this came from and why it might be there.


    # ## Finding Occurrences of a String in a Binary File


    We show here how the output of the strings command can be piped into the grep
    command to look for specific words within a binary file.


    ```

    $ strings echo|grep GLIBC

    GLIBC 2.3

    GLIBC 2.1.3

    GLIBC 2.1

    GLIBC 2.0

    GLIBC 2.2

    ```


    This shows how grep can be used to limit the output of a command to only lines
    that contain certain text.


    # ## Finding Strings in Multiple Files


    Earlier in this chapter we used find to search for recently modified files to
    find a file whose name we didn''t know. Now we''ll see how grep can actually search
    the contents of files to find specific text.


    # ## Finding a File Containing a Particular Text String


    ```

    $ ls -Al

    total 12

    -rw-r--r-- 1 tclark authors      2229 Jan 13 21:35

    declaration.txt

    -rw-r--r-- 1 tclark presidents    1310 Jan 13 17:48

    getysburg.txt

    -rw-r--r-- 1 tclark tclark       360 Feb 3 22:38 preamble.txt

    $ grep -ri ''We the people''

    ./preamble.txt:We the People of the United States, in order to form

    a more perfect Union,

    ```'
  merge: -1
  pgno: 90
- img_proc: true
  md: 'Here we use grep with the -ri options. The -r option causes grep to search
    all files in the specified directory and any subdirectories and the -i option
    tells grep to ignore case. We then specify what string we want to search for.
    Since this string is more than one word we enclose it in single quotes. Finally
    we specify where we want to look, in this case the current directory. The grep
    command not only outputs the line which contains the string we asked for, but
    also prefix it with the file which contains that line.


    # # Find processes


    In chapter 8, information will be presented that allows the location of processes
    by process number, user name, etc. using the ps command. Some examples are included
    here as processes are a typical thing to search for. There will be more discussion
    of this in chapter 8.


    # # Finding Process Information by Process ID


    Sometimes you will need to find more information about a specific process. In
    that case the -u option can be used with the ps command to specify the process
    number


    ```

    $ ps u 4444

    USER PID %CPU &MEM VSZ RSS TTY STAT START TIME

    bb 4444 0.0 0.0 1548 412 ? S Jan20 0:00

    /home/bb/bb/bin/bbrun -a /home/bb/bb/ext/bb-memory.sh

    ```


    This command will search for process number 444 and return some information about
    it.


    # # Find Processes Belonging to a Specific User


    Using the -u option we can look for only processes owned by a specific user. In
    this example the user''s name is bb.


    ```

    $ ps -u bb

    PID TTY TIME CMD

    3811 ? 00:00:00 runbb.sh

    3814 ? 00:00:00 bbrun

    ```


    Easy Linux Commands'
