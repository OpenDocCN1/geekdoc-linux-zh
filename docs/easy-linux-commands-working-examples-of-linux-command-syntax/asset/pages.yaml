  md: 'One of the most useful utilities for archiving a set of files and directories
    is tar. The name tar is short for Tape ARchiver because tar was originally written
    to write data to a tape backup device.


    The following is a basic example of archiving a directory into a tar archive file
    and also extracting the archive into its original structure.


    ```

    $ tar -cvf examples.tar examples

    examples/

    examples/declaration.txt

    examples/gettysburg.txt

    examples/preamble.txt

    $ rm -r examples

    $ ls

    examples.tar

    $ tar -xvf examples.tar

    examples/

    examples/declaration.txt

    examples/gettysburg.txt

    examples/preamble.txt

    $ ls

    examples examples.tar

    ```


    In this example we have demonstrated the two most common uses of create a new
    archive. The first tar command combines the -c (create) option the -v (verbose)
    option to list the files and directories it is archiving and the -f option to
    write to a file rather than tape. Remember that tar was originally written for
    use with tape drives and it still defaults to tape if you do not use the -f option.


    The two arguments for this tar command are the destination file (examples.tar
    in our example here) and the files which should be added to that file. This can
    be confusing since most other Linux commands take a source argument before the
    destination. tar takes them in the order of destination then source you can list
    multiple source files to be archived into a single file. Also not that we have
    to specify the file extension (.tar) if we want our new archive to have an extension.
    You can name a tar archive (typically called a tarball) anything you want, but
    the .tar extension is a widely accepted convention.


    In the second tar command the -v and -f options have the same result and the -x
    (extract) option tells tar that we want to extract the'
