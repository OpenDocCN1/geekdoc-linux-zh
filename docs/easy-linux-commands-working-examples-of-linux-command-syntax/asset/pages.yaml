    # Using Quotes in Shell Scripts


    Since the use of the backward quote (Formally, a "grave", pronounced Gra-vec)
    or backtick has been mentioned, this is probably a good time to explain the rules
    regarding the use of quotes:


    +   - Double quote (""): Variables are expanded when enclosed in double quotes

    - Single quote (''\): Variables within single quotes are not expanded

    - Backward quote (\```): Commands within backward quotes are executed and their
    output substituted into that location.


    The following examples should help make the differences between the types of quotes
    more evident.


    ```

    $ myname=''Terry Clark''

    $ echo ''My name is $idname''

    My name is $idname

    $ echo "My name is $idname"

