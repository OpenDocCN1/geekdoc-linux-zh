- img_proc: true
  md: '# Format the New Disk


    Next, the mkfs (make file system) commands would be used to format Linux partitions
    using an ext3 file system on the new partition. Now when we are referring to the
    device path we also include the partition number (in this case 1) that we created.


    ```

    $ mkfs -t ext3 -c /dev/hdb1

    ```


    The -t option is used to specify the type of filesystem to create. The c option
    specified here will cause mkfs to check the partition for bad blocks (physical
    defects in the disk) before creating the file system.


    If you want to format a swap partition on the new disk, the mkswap command can
    be used instead of mkfs as follows:


    ```

    $ mkswap -c /dev/hdb1

    ```


    Notice that we do not have to specify the partition type since mkswap will only
    create swap partitions. The -c option can still be used to check for bad blocks.


    # Mount the New Disk


    The next step is to create a directory for use as a mount point for our new partition.
    The mkdir command is used to create a directory, in this case called /new1. There
    is nothing special about this directory but it''s best to keep it empty since
    any contents of this directory will disappear when the new partition is mounted
    at that location.


    ```

    $ mkdir /new1

    ```


    Now that we have created our mount point we can mount the partition making it
    available for use:


    ```

    $ mount -t ext3 /dev/hdb1 /new1

    ```'
  merge: -1
  pgno: 180
- img_proc: true
  md: 'Here we see that the mount command takes several options. First the -t ext3
    specifies the partition type, the same type which was used for the newfs command.
    The next option, /dev/hdb1, specifies the device path and the final option listed
    here, /new1 is the mount point we created.


    We could now start using the new disk at the location /new1 but when the system
    reboots the /new1 partition will not be mounted! To make it mount automatically
    we will need to add it to the /etc/fstab file.


    # Working with the File System Table


    When adding a disk or changing disk layout it is necessary to modify the file
    system table. The table is found in a file called /etc/fstab. The following listing
    contains the contents of fstab on the test server at this point:


    ```

    $ cat /etc/fstab\ext3 defaults 1 1

    LABEL=/boot /dev/pts ext3 defaults 1 2

    none /dev/shm devfs mode=620 0 0

    none /dev/aio tmpfs defaults 0 0

    none /proc proc 0 0

    none /sys sysfs defaults 0 0

    /dev/hdb2 swap defaults 0 0

    /dev/cdrom /mnt/cdrom udf,iso9660 noauto,owner,kudu,ro 0 0

    /dev/cdrom1 /mnt/cdrom1 udf,iso9660 noauto,owner,kudu,ro 0 0

    /dev/hdc4 /mnt/zip auto noauto,owner,kudu 0 0

    /dev/fd0 /mnt/floppy auto noauto,owner,kudu 0 0

    ```


    Each line in the fstab file consists of six fields separated by spaces or tabs.'
  merge: -1
  pgno: 181
- img_proc: true
  md: 'The contents of the fields are described in Table 3.2, as follows:


    | Field | Description |

    | --- | --- |

    | 1 | The physical device or remote file system being described |

    | 2 | The mount point where the file system will be mounted |

    | 3 | The type of file system on this device |

    | 4 | A list of options which mount uses when mounting the file system |

    | 5 | This field is used by the dump backup utility to determine if a file system
    should be backed up. If this field is zero, the dump will ignore that system |

    | 6 | This field is used by the fsck file system check utility to determine the
    order in which file systems should be checked. If the field is zero, fsck will
    not check this file system |


    # Table 3.2: fstab file fields


    The /etc/fstab file can be modified to change what devices will be mounted where
    or, in our case, to make a new device mount at boot. Using a text editor (like
    vi which covered in chapter 5) we can carefully add the line to the /etc/fstab
    file to make new mount at boot:


    ```

    :dev/hdb1      /new1      ext3      defaults      1 1

    ```


    Our /new1 partition will now be available every time we reboot the system! Be
    careful to double and triple check any changes to the /etc/fstab file before rebooting
    the system.


    # LVM: The Logical Volume Manager


    While the management of hard disk volumes is an advanced topic and will not be
    presented in detail in this guide, the Logical Volume Manager (LVM) subsystem
    provided in Linux for Systems Administrators is worthy of mention. It can be used
    to create and manage disk volume groups from physical disk volumes. By allowing
    physically separate disks to be combined into a single logical disk, LVM simplifies
    many aspects of disk management. When working from a simple Linux workstation
    with one or two internal disk drives, there will be no need to use LVM; however
    when administering


    Creating a File System


    171'
  merge: -1
  pgno: 182
- img_proc: true
  md: 'Linux servers that have arrays of disks attached LVM can be invaluable.


    The user must have root access in order to use the LVM subsystem. LVM is a parameter
    driven subsystem controlled by specifications found in the text file located at
    /etc/lvm/lvm.conf. The configuration file contains several comments which describe
    each section. The LVM subsystem has over 40 commands for the creation and management
    of volume groups. Though this book does not cover LVM, table 3.3 below contains
    a partial list of available LVM subcommands to give you a taste of what LVM is
    capable of:


    | Subcommand | Function |

    |---|--|

    | lvchange | Change attributes of a logical volume |

    | lvcreate | Create a logical volume in an existing volume group |

    | lvdisplay | Display attributes of a logical volume |

    | lvext | Add space to a logical volume |

    | lvmdscan | List devices that may be used as physical volumes |

    | reduce | Reduce the size of a logical volume |

    | lvresize | Resize a logical volume |

    | vgcreate | Create a volume group |

    | vgdisplay | Display volume group information |

    | vgxtend | Add physical volumes to a volume group |


    Table 3.3: LVM subcommands and their functions


    It is clear that LVM is a rather sophisticated subsystem, and users definitely
    need to know what they are doing and be very careful when using it; otherwise,
    it would be easy to clobber the disk configuration and render the system unusable.


    # Conclusions


    In this chapter we learned a little about how Linux organizes its disks and how
    we can examine what disks are currently available within a system with the df
    command.


    After a quick overview of the commands used for filesystem manipulation we then
    stepped through the setup of a filesystem.'
  merge: -1
  pgno: 183
- img_proc: true
  md: 'Starting with the physical installation of a new hard drive, then partitioning,
    formatting, mounting and finally setup of the /etc/fstab file to make the partition
    mount when the system is rebooted.


    The Logical Volume Manager (LVM) subsystem was included as well as some of the
    commands for creating and managing resources such as disk arrays.


    # Book Summary


    This concludes the Linux Quick Reference. While no book can make you an expert
    we hope that this has eased the learning curve and will continue to act as a functional
    reference.


    If you''re interested increasing your Linux expertise the best way to do it is
    experience. The more you use Linux the better you''ll get at it, especially if
    you work a lot at the command line!


    Linux skills are desirable in the IT field and many of your Linux skills will
    carry over to UNIX and other UNIX-like operating systems, even Mac OSX! The ability
    to operate at the command line not only allows you to work things out when your
    windowing environment will not start but also allow you to connect remotely from
    anywhere in the world via SSH.


    If you want to learn more about Linux shell scripting check out Oracle Shell Scripting:
    Linux and UNIX Programming for Oracle by Jon Emmons. Though some of this book
    is geared specifically toward Oracle professionals much of it can be applied on
    any Linux or UNIX system.'
