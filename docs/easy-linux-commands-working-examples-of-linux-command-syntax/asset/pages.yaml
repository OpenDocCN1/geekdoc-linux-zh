    # Kill a Process


    When process goes bad it is often necessary to terminate them. The kill command
    is used to send a signal to the specified process or group. The default signal
    is a SIGTERM (15) A process which receives a SIGTERM may be programmed to trap
    signals and perform specific functions or ignore the signal entirely.


    kill takes a process ID as a parameter. The process ID owned by the process ID
    can be found using any of the methods described earlier in this chapter.'
  merge: -1
  pgno: 154
- img_proc: true
  md: 'The following example shows the xscreaver process (2609) which is to be terminated.


    ```

    $ pgrep xscreen

    2609

    $ kill 2609

    ```


    Though we use pgrep to find the PID of this process here we have also used a PID
    from the output of top or ps.


    When there is a stubborn process trapping the kill command and refusing to terminate,
    the -9 (SIGKILL) signal should be used to kill the process. The -9 signal cannot
    be trapped by a process and ignored. If the xscreaver process did not terminate
    after the last kill command, the new kill command would look like the following:


    ```

    $ kill -9 2609

    ```


    While the kill command is typically available to all users you will only be able
    to kill processes you own. To kill processes owned by other users you will need
    root privileges.


    # Kill Processes Using a Pattern


    Rather than scanning through process ID (PID) numbers, it might be easier to kill
    a process or group of processes by searching for a pattern in the command name
    field. The pkill command is one way to accomplish this, as shown below. pkill
    matches processes in the same way pgrep does. Be very careful when using pkill
    as you could easily kill more than you wanted to!


    We want to kill all processes called xscreen. First we use pgrep to make sure
    we get a reasonable number of PIDs back, then we kill the process with pkill.


    ```

    $ pgrep xscreen

    2609

    $ pkill xscreen

    ```'
