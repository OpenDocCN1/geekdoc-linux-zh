  md: "information on the busiest processes. It is also one of the few commands which\
    \ will constantly update. For more information on the top utility refer to chapter\
    \ 8.\n\n# Displaying Multi-Processor Statistics\n\nThe mpstat command displays\
    \ statistics for each and every processor within the system. the mpstat command\
    \ accepts interval (delay) and count frequency values as parameters. mpstat will\
    \ repeat the output count every interval seconds. This is very useful for monitoring\
    \ changes over time.\n\nThe following example uses an interval of three seconds\
    \ and a count of five iterations of the report detail lines. An average summary\
    \ line is produced at the end of the report.\n\n```\n$ mpstat 3 5\nLinux 5.6.0-72-generic\
    \ (x86_64) 10/26/2024\n CPU  user  nice  system  iowait  %irq  %idle  intr/s\n\
    \  pm all   1.00   0.00   0.33   0.00   0.00  98.67 1001.99\n  pm all   0.71 \
    \  0.00   0.33   0.00   0.00  99.33 1007.02\n  pm all   0.67   0.00   0.33   0.00\
    \   0.00  99.00 1002.67\n  pm all   0.66   0.00   0.33   0.00   0.00  99.00 1003.33\n\
    Average  0.67   0.00   0.33   0.00   0.00  99.00 1003.53\n```\n\nThe columns in\
    \ the report generated by the mpstat command are defined as follows:\n\n+   -\
    \ CPU: The processor number or the keyword all, which indicates that staistics\
    \ are calculated as averages among all processors or that there is only one processor\
    \ in the server\n- User: The percentage of CPU used by user applications\n- Ower:\
    \ The percentage of CPU utilization at the user level with nice priority\n- System:\
    \ The percentage of CPU used by the system. This does not include the time spent\
    \ servicing interrupts or softirqs. a softirq is a software interrupt, up to 32\
    \ software interrupts which can run on multiple CPUs simultaneously.\n- Wait:\
    \ The percentage of time the system had a pending disk I/O request"
