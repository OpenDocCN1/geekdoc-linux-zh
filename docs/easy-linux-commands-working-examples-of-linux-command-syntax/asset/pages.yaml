- img_proc: true
  md: '# Preface


    In the past decade Linux has gained a strong foothold in both the server and desktop
    market. While many common Linux tasks can now be done through a graphical interface,
    if you use Linux frequently sooner or later there will be a time when the graphical
    interface will not work or you need to do something remotely and can only get
    a command-line connection. When that happens it''s handy to have a quick reference
    around. This book is that reference.


    Linux was once the exclusive domain of alpha-geeks who thought nothing of compiling
    their own operating system. However, over the past decade Linux has become a viable,
    even prominent operating system for everything from large clustered computers
    to desktops to DVD video players. There are almost as many different distributions
    of Linux as there are and each has its own intricacies. Since distributions are
    actively developed by loosely knit groups of developers it is impossible to touch
    on all the features and intricacies of every distribution. The commands in this
    book will work in most distributions but the documentation for your distribution
    should be considered the definitive source for more specific information.


    As your comfort with the Linux command line you will find that some things are
    easier to do on the command line than they are in a graphical interface. Additionally
    it is easy to combined Linux commands into shell scripts to perform multiple complex
    tasks with a single script saving you time and reducing the chances that you forget
    or mis-type part of the command.


    While mastery of the Linux environment can only come with experience and time
    by including the most popular commands and options in this book we hope to ease
    the learning curve while providing a reference which will help users at all levels
    of experience.


    Well, if you''re ready, let''s get started.'
  merge: -1
  pgno: 15
- img_proc: true
  md: '# # CHAPTER 0 Some Important Background Information


    We don''t want to bore you with a history lesson, but a little background on Linux
    can help you understand how it works. Don''t worry, we''ll keep it brief.


    # ## What is Linux?


    Linux is an operating system loosely based on UNIX, a popular mainframe operating
    system which was originally developed in the 1960s by AT&T''s Bell Laboratories.
    This is why Linux is often referred to as a "UNIX-like" operating system.


    Just like Microsoft Windows, Linux controls the computer hardware, it''s best
    to keep all your devices playing nicely together and gives you an interface to
    run things on the computer. Unlike Microsoft Windows there are several groups
    (some commercial, some non-profit) who make Linux operating systems.


    # ## The Linux kernel


    The heart of a Linux system is a program called the kernel. The kernel controls
    security, processors, memory, disk and everything else about the system.


    The kernel is what allows multiple users to be on a Linux system at the same time
    running dozens, possibly even thousands of things at once without interfering
    with each other. While we won''t talk too much about the kernel, it''s just important
    to remember that it''s there keeping everything in check.'
  merge: -1
  pgno: 16
- img_proc: true
  md: '# The Many Breeds of Linux


    You may have already noticed that there are a ton of different Linux versions
    out there. Many meet only a very specific need while others compete in the mass
    market for servers and workstations. Here are a couple of the Linux distributions
    which are popular right now:


    # Red Hat Enterprise Linux


    www.redhat.com/rhel/ - This is the commercial version of Linux used for the examples
    in this book. It is a popular option for both servers and workstations because
    it is both feature-rich and well supported.


    # Fedora


    www.redhat.com/fedora/ - Sponsored by Red Hat, this community supported version
    of Linux is available for free. The free price tag makes this a great version
    to work with if you don''t have (want to pay for) a license for Red Hat Enterprise
    Linux, but be careful, some applications which are Red Hat compatible may not
    work on Fedora.


    # Ubuntu


    www.ubuntu.com - Ubuntu is a Linux-based operating system which has recently gained
    some popularity. It is easy to install and the desktop version comes with many
    of the applications you would want on your workstation.


    # Mileage May Vary


    Because no two distributions are quite the same you may find that some commands
    and options may not work, or may not work as described on your variety of Linux.
    The examples in this book were done on RedHat Linux. Almost all will work on most
    flavors of Linux but even a different version of RedHat will vary some.'
  merge: -1
  pgno: 17
- img_proc: true
  md: 'Installation of Linux varies from distribution to distribution. If you do not
    already have a Linux system to work on you may want to download one of the versions
    mentioned above and install it on a spare machine. Unless you are experienced
    at installing Linux I suggest you choose a machine you will not use for anything
    else. It is quite possible (even easy) to erase your entire hard drive while installing
    Linux, so take an old system (it doesn''t have to be too fast) that you dont need
    any of the data on and follow the instructions that come with your distribution
    to install Linux.


    # What is a shell?


    All the commands we run in this book are run in a Linux shell. A shell in Linux
    is the software which allows you, a human, interact with the inner workings of
    the UNIX operating system. Because of the shell we get to use commands that resemble
    our natural language (though sometimes just barely) to control the behavior of
    the computer. There are other types of shells in computing, but this is the only
    type we''re concerned with this book.


    Beyond the ability to use somewhat intuitive commands individually, the shell
    also gives us the ability to combine these commands into shell scripts. A shell
    script can contain one command or hundreds and the commands could be nearly anything
    you could do from within the shell.


    # The bash shell


    There are, of course, many kinds of shells. Each has its strengths and weaknesses
    we''re mostly concerned with the Bourne-Again Shell (bash) which is the default
    for users in Linux.


    If you think your shell may not be bash don''t worry. We''ll talk about how to
    change it later, but for now you can change it temporarily simply by typing bash.'
  merge: -1
  pgno: 18
- img_proc: true
  md: '# Getting to the shell


    You can access a Linux shell in several different ways. You may access the shell
    by sitting at a Linux computer where the shell is displayed on screen or you may
    use a secure protocol to enter a shell on a system thousands of miles away.


    In some environments you may use a telnet client or, more likely a secure ssh
    client to connect to a Linux machine. This will depend largely on how you your
    machine and your environment is set up. If you are connecting remotely through
    one of these clients you should talk with the person who set the machine up to
    find out how to connect.


    Once you''re at the Linux command line almost everything works the same whether
    you''re at the keyboard of the system you work on or at a workstation half way
    around the world.


    # A few quick tips


    Here are a few things that it might help you to know from the beginning. They
    may seem out of place here, but will make sense as we get into using Linux.


    # No news is good news


    One thing you will have to get used to is that when you run many Linux commands
    if things go right you will not get any feedback. There are very few Linux commands
    which will tell you "Operation completed successfully." unless something goes
    wrong. So basically don''t worry if you don''t get any feedback from Linux. It''ll
    give you an error if there''s a problem.'
  merge: -1
  pgno: 19
- img_proc: true
  md: '# Tab completion


    One feature of the bash shell we will be using is the ability to complete partially
    typed commands and file names with the tab key. If you type in enough of the command
    or file to uniquely identify what you''re looking for, then press tab Linux will
    complete the file or command. Try it out once we get started. It can save you
    a lot of typing.


    # Repeating recent commands with the up arrow


    If you want to repeat a recently executed command, or even repeat it with a slight
    modification, the bash shell will allow you to recall it using the up arrow. The
    up and down arrows will allow you to go back and forth through your recently typed
    commands to recall them for execution. This can be very useful if you make a typo
    and don''t want to retype the entire command again.


    # Getting More Help


    While we will cover a lot of ground in this book you may find topics here which
    you want to learn more about. Linux provides a couple resources available right
    at the command line to give you more information on commands.


    # Man Pages


    Whenever detailed help is needed with command syntax or with command options,
    the manual (man) command can be used to display all of the information about the
    specified command. The information will be displayed one screen at a time. Pressing
    the space bar will advance the next screen. At the end of the display, the Q command
    can be used to quit.


    The man command should be followed by the name of the command with which help
    is needed, as shown in the following example:'
  merge: -1
  pgno: 20
- img_proc: true
  md: '# Linux User''s Manual


    W(1)


    # NAME


    w - Show who is logged on and what they are doing.


    # SYNOPSIS


    w - [husufv] [user]


    # DESCRIPTION


    +   - w displays information about the users currently on the machine, and their
    processes. The header shows, in this order, the current time, how long the system
    has been running, how many users are currently logged on, and the load averages
    for the past 1, 5, and 15 minutes.


    +   - The following entries are displayed for each user: login, the tty, the name,
    host login, idle time, JCPU, CPU, and the command line of their current processes.


    +   - The CPU time is the time used by all processes attached to the tty. It does
    not include background jobs, but does include currently running jobs.


    +   - The CPU time is the time used by the current process, named in the "what"
    field.


    # COMMAND-LINE OPTIONS


    +   - Don''t print the header.


    +   - Ignores the username figuring out the current process and cpu times. To
    demonstrate this, a "su" and a "w" and a "w".


    +   - Use the short format. Don''t print the login time, JCPU or CPU times.


    +   - Toggling the print from (remote hostname) field. The default as released
    for the field not to be printed, although your administrator or distribution maintainer
    may have compiled a version in which the field is shown by default.


    +   -V Display information.


    user Show information about the specified user only.


    # FILES


    +   /etc/utmp information about currently logged on


    +   /proc process information


    The man pages can be a bit confusing but they will contain options which are not
    covered in this book. Be careful when using a new option for any command.


    # Info


    In situations where users are unsure which command should be used for a particular
    function, the info command can be used. The info contains information about all
    of the commands and utilities available within the system. The info system even
    gives tips for'
  merge: -1
  pgno: 21
- img_proc: true
  md: 'navigating within the info subsystem. The **info** command is entered to simply
    invoke the info subsystem.


    The info subsystem even offers the capability of entering information about any
    commands, scripts, etc. for documentation purposes.


    # Conclusions


    In this chapter we discussed what Linux is, why the kernel is so important, and
    touched on some of the popular varieties of Linux currently available. We then
    talked about the shell and more specifically about the bash shell which we will
    be using in this book.


    We spent some time setting some expectations of what the shell is going to do
    for us and discussed some of the usability features that make bash nicer to use.


    Though you will be able to use many commands straight out of the book you may
    find need more information on certain commands. We showed how the **man** and
    **info** commands can be used to find out about options and commands that we won''t
    have the time or paper to cover in this book.


    Now let''s get right into using Linux with some directory and file commands.'
  merge: -1
  pgno: 22
- img_proc: true
  md: '# Directory and File Commands


    In Linux, all entities are described in files so learning how to examine and manipulate
    them is a good place to start. End users are most familiar with files containing
    data that they work with on a daily basis. Files can also include such things
    as end-user programs in addition to operating system programs, program control
    parameters, hardware device descriptions, and system status information.


    Files are stored in directories, which are referred to as folders in a GUI environment.
    Directories are arranged in a hierarchical tree structure. Everyday workings within
    a Linux environment will require that the user understand where their files are
    stored, how to navigate through the directory tree, and how to manipulate files
    within the directory structure.


    This chapter will introduce the commands needed to manipulate files and directories
    from the Linux command line.


    # Directory Structure


    As mentioned, Linux stores files in directories (folders) which are arranged in
    a hierarchical or tree structure. The highest level directory is called root and
    is identified by a slash character (/). All other directories in Linux stem from
    the root directory. It is admitedly easier to envision the overall structure of
    the server''s directories using a GUI interface like Gnome. Figure 4.1 is an example
    GUI display of the directory structure of a Linux server. The figure indicates
    that the user is in the /boot directory which contains two subdirectories called
    /grub and /lost+found displayed as folders and numerous files displayed as icons
    depending on file type.'
