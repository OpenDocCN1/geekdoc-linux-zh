  md: '# Deleting Text


    The vi editor provides commands for deleting or replacing single characters, single
    or multiple words, single or multiple lines of text. Table 9.4 shows some common
    delete and replace commands with their associated actions. Remember you need to
    be in command mode to use these.


    | Command | Action |

    |---|---|

    | x | Delete one character of text |

    | r | Replace one character of text with the next character entered |

    | dw | Delete entire word (3dw deletes 3 words) |

    | dd | Delete entire line (3dd deletes 3 lines) |

    | D | Delete from cursor to end of line |

    | s | Switch to insert mode after deleting current character |

    | cw | Delete entire word and switch to insert mode |

    | C | Change (delete and switch to insert mode) from cursor position to end of
    line |


    Table 9.4: Delete or replace text commands


    # Searching for Text Strings


    The vi editor allows the user to search for a text string either forward (down)
    in the file or backward (up). It also allows a shortcut for repeating the search.
    A special capability that comes in handy when writing shell scripts is the ability
    to search for matching parentheses, brackets, and braces. Table 9.5 shows some
    search commands and their associated actions.


    | Command | Action |

    |---|---|

    | /text | Search forward in the file for text |

    | ?text | Search backward (up) in the file for text |

    | % | With the cursor on a parentheses, bracket, or brace character, you can press
    the % key to move the cursor to its matching opening or close character |


    Table 9.5: Search commands and their associated actions'
