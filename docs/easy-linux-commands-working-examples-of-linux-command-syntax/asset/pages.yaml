  md: '# # File Commands


    # ## Creating an Empty File


    Sometimes, it is useful to create an empty file as a placeholder for future content.
    The **touch** command can be used without any options to create an empty file
    as follows:


    ```

    $ touch /home/tclark/touch1.fil

    $ touch2.fil

    $ ls -l

    total 6

    drwxr-xr-x 2 tclark tclark 4096 Jan 13 17:48 examples

    -rw-rw-r-- 1 tclark tclark 0 Jan 13 19:13 touch1.fil

    -rw-rw-r-- 1 tclark tclark 0 Jan 13 19:14 touch2.fil

    ```


    The touch command also has an option that allows the file timestamp information
    of an existing file to be changed using the **-t** option. In the following example,
    the timestamp on the **touch1.fil** above will be changed to January 10 12:00.
    The date format for this option is a string of numbers with two digits each for
    month, date, hour (in 24 hour format) and minute, so the string for January 10
    12:00 would be 01010200. For instance, the user may want to change a group of
    files in a directory to indicate a particular release date.


    ```

    $ touch -t 01010200 touch1.fil

    $ ls -l

    total 4

    drwxr-xr-x 2 tclark tclark 4096 Jan 13 17:48 examples

    -rw-rw-r-- 1 tclark tclark 0 Jan 10 12:00 touch1.fil

    -rw-rw-r-- 1 tclark tclark 0 Jan 13 19:14 touch2.fil

    ```


    # ## A Brief Discussion about Wildcards


    Many of the common file and directory manipulation commands, including most of
    the ones mentioned in the balance of this chapter, will let you use a partial
    file or path name and substitute a wildcard character for the rest of one or several
    files. These wildcards can save you a lot of typing, but also leave you with ambiguous
    results, possibly causing the accidental deletion of files!'
  merge: -1
  pgno: 32
- img_proc: true
  md: 'The two most common wildcard characters are the asterisk (*) and the question
    mark (?). The *, commonly called the star, will match any number of characters
    within a filename, even if there are none. The ? will match any single character
    within a filename.


    Here are a couple examples which should make wildcards a bit more clear:


    ```

    $ ls

    examples touch1.fil touch2.fil

    $ ls tou*

    touch1.fil touch2.fil

    $ ls touch?.fil

    touch1.fil touch2.fil

    $ ls *ch?.fil

    touch1.fil

    ```


    In the last example we see that multiple wildcards can be used within the same
    statement and both will be applied to the results. The most important thing to
    remember about wildcards is that they will not just match one but will instead
    match all files which have the pattern you have described.


    # Deleting Files


    The remove (rm) command can be used to delete a file; referencing the file either
    via an absolute path or via a relative path. Wildcard symbols such as * and ?,
    can be used to delete files with similar names.


    > Be careful with the rm command, especially as root! Linux tends to just delete
    what you tell no one asked?


    Here are some examples of the rm command:


    ```

    $ rm /home/tclark/touch1.fil

    $ ls

    examples touch2.fil

    $ rm touch2.fil

    $ ls

    examples

    ```


