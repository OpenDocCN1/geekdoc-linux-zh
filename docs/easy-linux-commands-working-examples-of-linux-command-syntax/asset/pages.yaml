    # Creating a File System


    Some file systems are created automatically during the Linux installation process.
    For instance, when I set up a system with Fedora Core 2 (Red Hat) for this book,
    the installation tool detected the two disk drives and offered to automatically
    configure their partitions and setup a file system.


    There are many different types of file systems. Microsoft Windows administrators
    are familiar with filesystems like FAT16, FAT32, and NTFS. The comparable options
    on Linux are ext2, ext3, and Linux-swap. The differences between these filesystem
    types are beyond the scope of this book.


    During the lifetime of a Linux system it is not uncommon to want to add additional
    disk space to a system by adding disks or replace a current drive with a larger
    capacity. Here are some of the most useful commands for setting up disks:


    > Note: You will need root privileges to perform most of the tasks.


    | Command | Function |

    | --- | --- |

    | fdisk | Partition a hard disk |

    | fsck | Check and optionally repair one or more Linux file systems |

    | mkdir | Make a new file directory |

    | mkfs | Make a file system |

    | mkswap | Make a swap area on a device or in a file |

    | mount | Mount a file system (umount) |

    | parted | Disk partitioning and partition resizing program. It allows the user
    to create, destroy, resize, move and copy ext2, ext3, Linux-swap, FAT and FAT32
    partitions. |

    | sfdisk | List the size of a partition, the partitions on a device, check the
    partitions on a device, and repartition a device. |


    Table 3.1: Commands for file system creation'
  merge: -1
