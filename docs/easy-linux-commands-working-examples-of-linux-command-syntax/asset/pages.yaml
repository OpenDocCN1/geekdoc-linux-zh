- img_proc: true
  md: '# The vi Editor


    ![](img/056ab74889c0b34d529c56d42bb0a965_93_0.png)


    Advanced servers required advanced editors


    # Inside vi


    The visual editor, more commonly known as vi, which is pronounced “vee eye”, is
    a very powerful text editor, created especially for those who are touch typists.
    While the editor is quite powerful, it can be difficult to learn and cumbersome
    to use. vi was invented long before the introduction of the Windows environment,
    and it provided'
  merge: -1
  pgno: 93
- img_proc: true
  md: 'powerful features for administrators and programmers using UNIX command line
    environments.


    vi has one outstanding characteristic which makes it a great tool to learn: it''s
    always there. Almost every Linux, UNIX and UNIX-like operating system ships with
    vi pre-installed. In this chapter, information will be presented on how to use
    the vi text editor to create and modify Linux shell scripts.


    ![](img/056ab74889c0b34d529c56d42bb0a965_94_0.png)


    # Editor Modes of Operation


    For all intents and purposes, the vi editor operates in two modes; command mode
    and insert mode. When vi is first invoked, the system will be in command mode.
    While in insert mode, the user can return to command mode by pressing the escape
    (esc) key. If you''re not sure which mode you''re in it is always safe to press
    escape to return to command mode before proceeding.'
  merge: -1
  pgno: 94
- img_proc: true
  md: 'Commands within vi are case sensitive. For example, a lower case a performs
    differently than an upper case A.


    # Starting vi


    In order to start vi from the Linux command prompt just type the command vi followed
    by the name of the new file to be created or the name of an existing file to be
    edited. If a new file is to be edited, the user will be presented with a screen
    with a column of tildes (~) as shown in the following example. This indicates
    that the user is editing empty file. The following is an example of an empty file.


    ![](img/056ab74889c0b34d529c56d42bb0a965_95_0.png)


    # Exiting vi


    The :wq command is used to save the file and exit vi. This is actually a concatenation
