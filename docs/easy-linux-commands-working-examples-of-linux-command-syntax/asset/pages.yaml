    | # cat /proc/swaps | | | | |

    | Filename | Type Size Used Priority |

    | /dev/hdf2 | partition 524152 0 -1 |

    | # swapon -s | | | | |

    | Filename | Type Size Used Priority |

    | /dev/hdf2 | partition 524152 0 -1 |


    Here we see the device name, type, size and amount used for each swap device.
    In this case we only have the one swap device.


    # Kernel Parameters


    Linux is a parameter driven system. Kernel parameters used for system configuration
    are found in /proc/sys/kernel, where there is an individual file for each configuration
    parameter. Since these parameters have a direct effect on system performance,
    root access is required in order to modify them.


    You can view the current configuration parameters by using the cat command on
    the appropriate file.


    ```

    # cat msgmax

    8192

    ```


    Occasionally, a prerequisite to a software installation requires the modification
    of kernel parameters. Since each parameter file contains a single line of data
    consisting of either a text string or numeric values, it is often easy to modify
    a parameter by simply using the echo command.


    ```

    # echo 2048 > /proc/sys/kernel/msgmax

    ```


    The aforementioned command will set the value of the msgmax parameter to 2048.
    This change will only remain in effect until the system is rebooted.'
