  md: '# Conventions Used in this Book


    It is critical for any technical publication to follow rigorous standards and
    employ consistent punctuation conventions to make the text easy to read.


    However, this is not an easy task. Within Linux there are many types of notation
    that can confuse a reader. It is also important to remember that many Linux commands
    are case sensitive, and are always left in their original executable form, and
    never altered with italics or capitalization.


    **Parameters** - All Linux commands, arguments and parameters will be bold.


    **Variables** - All program variables and arguments will also remain in italics.


    **Command Line Sessions** - Command line sessions will be represented in a grey
    box. Commands which the user would type are in bold and script output remains
    un-bolded. The dollar ($) and pound (#) at the beginning of a command typically
    represent a prompt and should not be typed unless presented in bold.


    **Programs & Products** - All products and programs that are known to the author
    are capitalized according to the vendor specifications (IBM, DBXray, etc). All
    names known by Rampant TechPress to be trademark names appear in this text as
    initial caps. References to UNIX are always made in uppercase.'
  merge: -1
  pgno: 13
