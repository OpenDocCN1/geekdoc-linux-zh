    # # Conclusions


    In this chapter we illustrated how to search for files using specific criteria
    such as size or time criteria using the `ls` command. We then delve into the `find`
    command and saw how it can be used to look for several different attributes of
    a file.


    We also provided examples on how to search for files containing a specific string
    or pattern of data. The chapter concluded with a review ways that users can search
    for particular processes that are active on the system.


    In the next chapter we''ll learn how to unlock some of the power of the vi text
    editor.'
