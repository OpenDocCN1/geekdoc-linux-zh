  md: '# # What Directory am I In?


    When navigating around in Linux it is very easy to forget what directory you''re
    in. Don''t worry, there''s a command to help you find out.


    The directory that the user is currently in is referred to as the working directory
    and can be displayed using the `pwd` (print working directory) command. The `pwd`
    command displays the absolute path name for the current working directory as demonstrated
    here:


    ```

    $ pwd

    /home/tclark

    ```


    The directory /home/tclark is an absolute path because it begins with a slash.
    Absolute paths will refer to the exact location no matter who types them or where
    they type them from because the slash specifies that this path is described from
    the root directory. The opposite of an absolute path is a relative path which
    would refer to a subdirectory of the working directory. Relative paths cannot
    begin with slashes.


    In order to eliminate the need to frequently issue the `pwd` command to determine
    the current working directory, many Linux users choose to display the working
    directory within the Linux command prompt. Some Linux administrators provide this
    service for their users when they create their Linux accounts. If a user''s command
    prompt does not contain the working directory, the command prompt can be modified
    by changing the prompt string 1 (PS1) shell variable as demonstrated here:


    ```

    $ PS1="[\u\h \w]\$"

    [tclark@appsvr /home/tclark]$

    ```


    This example of setting the PS1 variable also adds the username (`\u`) and hostname
    (`\h`) to the prompt. This can be very useful if you frequently connect to different
    hosts and as different users.


    Directory Commands'
  merge: -1
