  md: '# Conclusions


    In this chapter we started off with some commands which can be used to examine
    the configuration of a Linux box. This is often useful if you are using a system
    which has been configured by someone else or when you need to check the configuration
    of a system without the luxury of shutting it down and cracking the case.


    We then learned how to search the system for processes with certain statistics
    by combining the ps and sort commands. We also briefly went over how to examine
    the system for memory paging and swapping and how to set many kernel parameters
    which may need to be customized before installing software.


    Perhaps the most valuable portion of this chapter covered the use of top, mpstat,
    iostat and vmstat to obtain a myriad of statistics about the system. Tons of information
    directly pertaining to system performance can be obtained from the output of these
    utilities and most of them have the ability to report statistics since system
    startup and over a specified period of time.


    In the next couple chapters we will take a step back from examining and monitoring
    the system and talk about how to set up and maintain a filesystem.'
