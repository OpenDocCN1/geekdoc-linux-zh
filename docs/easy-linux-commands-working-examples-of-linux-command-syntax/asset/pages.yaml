  md: 'The read command reads one line from the standard input and the first word
    is assigned to the first variable, the second word to the second variable, and
    so on, with leftover words assigned to the last variable. If there are fewer words
    read from the input stream than variables, the remaining variables are assigned
    empty values.


    Here are some examples of the read command:


    ```

    $ read name1 name2

    Terry Clark

    echo $name2

    Clark

    echo "Name: $name1 Name2: $name2"

    Name1: Terry Name2: Clark

    $ read fullname

    Terry L. Clark

    echo $fullname

    Terry L. Clark

    ```


    The -p option can be used to specify a prompt to be displayed to the user. The
    prompt can be used to request the user enter specific information. The following
    is an example of using read with the -p option to prompt for user input:


    ```

    $ read -p"Enter your name please: " fullname

    Enter name please: Terry Clark

    echo $fullname

    Terry Clark

    ```


    Now you can start to see how we can make an interactive shell script which prompts
    the user for input. Sometimes we want to collect information when the shell script
    is started rather than once it is running. For that type of information command
    line arguments can be used.


    # Command Line Arguments


    Arguments or parameters can be passed to the script from the command line that
    invoked the script just like we have been passing arguments to commands. Arguments
    passed to the script are available in special shell variables which are referenced
    by number. The first'
