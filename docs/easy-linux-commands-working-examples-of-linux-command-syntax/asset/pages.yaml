    # Display Active Writes to a File


    Sometimes you need to go one step further and watch as lines are written to a
    file. Perhaps, for, an application is compressing copying files to an alternate
    location, writing messages to a log file message.log as it processes each file.
    A curious user might want to observe the progress of the application. In this
    case, the tail command with the -f (follow) option can be used to read the messages
    as they are written to a file. The following example assumes that the current
    working directory is the same directory where the log file resides.


    ```

    $ tail -f message.log

    ```


    > A clever Linux user can also use the less command to display the beginning lines
    of a file, the ending lines of a file, or to follow active writes to a file like
    tail -f does. See the man entry for the less command to see how this is done.


    These commands are useful for viewing a file in a human readable format. Occasionally
    you may need to view a file in hex format as shown in the next section.


    # Display a Hex Dump of a File


    While not common, certain circumstances may require a hex dump of a file. The
    od (octal dump) command with the hex (-x) option can be used to display the file
    in hex format.


    ```

    $ od -x preamble.txt

    000000 2e55 2e53 6e6f 7473 7469 7475 6f69

    ```


