- img_proc: true
  md: '# File and Directory Security


    Linux file security is quite simple in design, yet quite effective in controlling
    access to files and directories.


    Directories and the files which are stored in them are arranged in a hierarchical
    tree structure. Access can be controlled for both the files and the directories
    allowing a very flexible level of access.


    The chapter will introduce Linux file and directory access permissions and show
    how those permissions can be manipulated to suit the system requirements.


    # File Security Model


    In Linux, every file and every directory are owned by a single user on system.
    Each file and directory also has a security group associated with it that has
    access rights to the file or directory. If a user is not the directory or file
    owner nor assigned to the security group for the file, that user is classified
    as other and may still have certain rights to access the file.


    Each of the three file access categories, owner, group, and other, has a set of
    three access permissions associated with it. The access permissions are read,
    write, and execute.


    A user may belong to more than one group. Regardless of how many groups a user
    belongs to if permissions are granted on a file or directory, one of the user''s
    groups they will have the granted level of access. You can check what groups a
    user belongs to with the groups command.


    File Security Model'
