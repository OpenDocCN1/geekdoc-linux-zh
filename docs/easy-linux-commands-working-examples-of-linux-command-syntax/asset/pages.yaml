    # Paging and Swapping Devices


    Linux uses a swap disk as a repository for segments of memory that are paged out
    from physical RAM. Linux will use swap very intelligently even when sufficient
    physical memory is available. When too many things are running at once and the
    demand for memory exceeds the size of physical memory excessive paging will likely
    take place, eventually impacting system performance. The Linux default is to set
    the size of the swap disk to twice the size of physical RAM installed in the server.


    Linux stores information about devices used for system paging and swapping activities
    in a file called /proc/swaps. To display information regarding swap devices, the
    file can be displayed using'
