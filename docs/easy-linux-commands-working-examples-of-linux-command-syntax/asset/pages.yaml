    still have somewhat different directory structures. The following rendering exemplifies
    a typical Red effort toward standardization of where files are stored according
    to type and use.


    | Directory | Description |

    | /bin | All binaries needed for the boot process and to run the system in single-user
    mode, including essential commands such as cd, ls, etc. |

    | /boot | Holds files used during the boot process along with the Linux kernel
    itself |

    | /dev | Contains device files for all hardware devices on the system |

