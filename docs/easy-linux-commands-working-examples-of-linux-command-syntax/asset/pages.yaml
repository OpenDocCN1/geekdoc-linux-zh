    # Preventing Accidental File Deletion


    A little trick that some Linux users like to implement to prevent accidental file
    deletion is via the use of alias. Aliases are similar to variables and can be
    set in a session or by placing the command alias in the .bash_profile file with
    a text editor.


    By adding this alias the user will be prompted to confirm each file before it
    is deleted; otherwise, unlike Microsoft Windows, will delete whatever files match
    the filename criteria without warning!


    ```

    $ alias rm=''rm -i''

    $ touch touch1.fil touch2.fil touch3.fil

    $ rm touch*

    rm: remove regular empty file ''touch1.fil?'' y

    rm: remove regular empty file ''touch2.fil?'' y

    rm: remove regular empty file ''touch3.fil?'' y

    ```


    File Commands


