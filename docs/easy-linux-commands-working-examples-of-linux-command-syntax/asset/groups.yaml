    # The Format of the crontab File


    The crontab file consists of a series of entries specifying what shell scripts
    to run and when to run it. It is also possible to document crontab entries with
    comments. Lines which have a pound sign (#) as the first non-blank character are
    considered comments. Blank lines are completely ignored. Comments cannot be specified
    on the same line as cron command lines. Comments must be kept on their own lines
    within the crontab.


    There are two types of command lines that can be specified in the crontab: environment
    variable settings and cron commands. The following sections will provide more
    detail on these two types of crontab entries.


    # Environment variable settings


    Each environment variable line consists of a variable name, an equal sign (=),
    and a value. Values that contain spaces need to be enclosed within quotes. The
    following are some examples of environment variable settings:


    ```

    color = red

    title = ''My Life in a Nutshell''

    ```'
  - '[PAGE 140]


    It is important to remember variable names are case sensitive and that system
    variables are usually defined with upper case names, while user defined variables
    are defined with lower case names.


    # crontab Command Lines


    Each crontab command line is comprised of six positional fields specifying the
    time, date and shell script or command to run. The format of the crontab command
    line is described in Table 10.2 below:


    | Field | Minute | Hour | Day of Month | Month | Day of Week | Command |

    | --- | --- | --- | --- | --- | --- | --- |

    | Valid values | 0-59 | 0-23 | 1-31 | 1-12 | 0-7 | Command path/command |


    **Table 10.2:** crontab command line format


    Each of these fields can contain a single number, a range of numbers indicated
    with a hyphen (as as 2-4), a list of specific values separated by commas (like
    2,3,4) or a combination of these designations separated by commas (such as **1,3-5**).
    Any of these fields may also contain an asterisk (*) indicating every possible
    value of this field. This can all get rather confusing let''s take a look at a
    few examples.


    The next several examples are all part of the same crontab file. We have broken
    it up in order to explain each entry individually.


    ```

    # Use the Korn Shell for all shell scripts

    SHELL=/bin/ksh

    ```


    This sets the default shell for these cron scripts by setting the SHELL environment
    variable.


    ```

    ********************************************************************

    # Run the Weekly cleanup task at 6:00AM every Monday

    # and send any output to a file called cleanup.lst in the

    # /tmp directory

    ********************************************************************

    00 06 * 1 /home/terry/cleanup.ksh > /tmp/cleanup.lst

    ```'
