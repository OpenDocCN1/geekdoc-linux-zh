    \ root 权限时！\n\n# 杀死进程\n\n当进程出现异常时，通常需要终止它们。`kill` 命令用于向指定的进程或组发送信号。默认信号是 SIGTERM\
    \ (15)。接收 SIGTERM 的进程可能被程序为捕获信号并执行特定功能，或完全忽略信号。\n\n`kill` 以进程 ID 作为参数。进程 ID 可以通过本章介绍的任何方法找到。\n\
    \n下面的示例显示了要终止的 screaver 进程 (2609)。\n\n```\n$ pgrep xscreen\n2609\n$ kill 2609\n\
