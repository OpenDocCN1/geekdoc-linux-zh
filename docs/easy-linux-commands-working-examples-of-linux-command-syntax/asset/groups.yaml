    GLIBC 2.1

    GLIBC 2.0

    GLIBC 2.2

    ```


    This shows how grep can be used to limit the output of a command to only lines
    that contain certain text.


    ## Finding Strings in Multiple Files


    Earlier in this chapter we used find to search for recently modified files to
    find a file whose name we didn''t know. Now we''ll see how grep can actually search
    the contents of files to find specific text.


    ## Finding a File Containing a Particular Text String


    ```

    $ ls -Al

    total 12

    -rw-r--r-- 1 tclark authors      2229 Jan 13 21:35 declaration.txt

    -rw-r--r-- 1 tclark presidents    1310 Jan 13 17:48 getysburg.txt

    -rw-r--r-- 1 tclark tclark       360 Feb 3 22:38 preamble.txt

    $ grep -ri ''We the people''

    ./preamble.txt:We the People of the United States, in order to form

    a more perfect Union,

    ```


    Here we use grep with the -ri options. The -r option causes grep to search all
    files in the specified directory and any subdirectories and the -i option tells
    grep to ignore case. We then specify what string we want to search for. Since
    this string is more than one word we enclose it in single quotes. Finally we specify
    where we want to look, in this case the current directory. The grep command not
    only outputs the line which contains the string we asked for, but also prefix
    it with the file which contains that line.


    ## Find processes


    In chapter 8, information will be presented that allows the location of processes
    by process number, user name, etc. using the ps command. Some examples are included
    here as processes are a typical thing to search for. There will be more discussion
    of this in chapter 8.


    ## Finding Process Information by Process ID


    Sometimes you will need to find more information about a specific process. In
    that case the -u option can be used with the ps command to specify the process
    number


    ```

    $ ps u 4444

