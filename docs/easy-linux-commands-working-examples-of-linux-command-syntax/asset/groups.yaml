    \n# 管道\n\n可以用于将一个命令的输出传递给另一个命令或程序，而无需创建中间文件。使用管道是在命令行上组合多个命令的方便方法。管道符号是垂直线 `|`，它被放置在命令之间以调用管道。\n\
    \n若要查看当前工作目录下以 `/fil/` 作为扩展名的文件，可以在 `ls` 和 `grep` 之间形成如下所示的管道：\n\n```\n$ ls -l\
