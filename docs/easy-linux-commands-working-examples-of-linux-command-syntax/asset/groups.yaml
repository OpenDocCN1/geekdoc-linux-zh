- md: "\nOnce you are in top you just need to type q to quit and return to the command\
    \ line.\n\nHere we see the default top output. There's a lot here, but here are\
    \ a few of the highlights. Some of this will be familiar from the ps output.\n\
    \n| top output field | Description |\n| --- | --- |\n| up | How long this system\
    \ has been running. May be in days |\n| users | Number of connected users |\n\
    | load average | Number of processes currently running plus the number waiting\
    \ to run one, five and fifteen minutes*. |\n| Tasks (or processes) | The total\
    \ number of active processes |\n| CPU | How the CPU is currently being used |\n\
    | user | The percent of CPU consumed by user processes |\n| system | The percent\
    \ of CPU consumed by system processes |\n| idle | The percent of CPU not currently\
    \ being used |\n| iowait (not shown) | The percent of CPU spent waiting for data\
    \ (typically disk) |\n| Mem | Memory usage information |\n| total | The total\
    \ amount of memory in this system |\n| used | Memory used in the system |\n| free\
    \ | Unused |\n| Swap | Information about disk being used as memory |\n| total\
    \ | Total amount of disk assigned for use as memory |\n| used | Swap currently\
    \ in use |\n| free | Unused swap |\n| PID | Process ID of this process |\n| USER\
    \ | Username of the process owner |\n| %CPU | Percent of CPU being used by this\
    \ process |\n| %MEM | Percent of total memory being used by this process |\n|\
    \ TIME | Total CPU time consumed by this process |\n| Command | The command which\
    \ was executed (truncated) |\n\n* The calculation is more complicated than this,\
    \ but this simple explanation will suffice for now. Generally a system with a\
    \ load average lower than its number of CPUs is keeping up with its work. One\
    \ with a load average of one to two times its number of CPUs is starting to fall\
    \ behind and things aren't getting done as quickly as they are coming in, but\
    \ a load average of several times the number of CPUs typically indicates the system\
    \ is bogged down. Of course your experience is the best indicator of system performance.\n\
    \nThe one, five and fifteen minute load averages are useful for identifying the\
    \ trend of the system. If the one minute load average is lower than the five and\
    \ fifteen minute averages the system has probably finished large tasks and the\
    \ system is getting less busy than it previously was. If the one and five minute\
    \ averages are higher it is likely the system is getting busier than it was fifteen'\
    \ minutes ago.\n\n## Display the Most Active Processes\n\nWhile running top there\
    \ are several commands which will change what shows you. Some common ones are:\n\
