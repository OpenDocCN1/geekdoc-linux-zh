    \ pts/6     R 11:42 0:00 ps u\n```\n\n可以为 `ps` 命令添加 `aux` 选项以包含所有进程（而不仅仅是用户进程），并构建复杂的命令来显示使用最多内存或\
    \ CPU 的命令。\n\n下面是每个复杂命令的示例：\n\n## 显示最高 CPU 用户：\n\n```\n$ ps -aux | sort -n +2\
    \ | tail -1\nroot 2201 0.2 3.2 36564 8464 S Oct17 2:18\n/usr/X11R6/bin/X :0 -auth\
    \ /var/gdm/:0.Xauth -nolisten tcp\nt7\n```\n\n## 显示最高内存用户：\n\n```\n$ ps -aux |\
