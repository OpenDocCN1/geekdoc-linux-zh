    Complex conditions can be used to evaluate several factors and react to certain
    conditions on the system or the shell script. Next we''ll see how these conditions
    can be used within loops to repeat an action.


    # Loops


    A loop provides a way to execute commands repeatedly until a condition is satisfied.
    The bash shell provides several looping methods but we''ll focus on the for loop
    and the while loop.


    # for loop


    The for loop executes the commands placed between the do and done statements until
    all values in the value list passed to it have been processed. Here is a simple
    example of the for loop:


    ```

    $ animals="dog cat mouse"

    $

    $ for animal in $animals

    > do

    > echo $animal

    > done

    dog

    ```'
  - "[PAGE 127]\n\nAs we can see here, we did not have to tell the for loop how many\n\
    times to repeat. It just took the input and repeated it for the number\nof separate\
    \ items in the variable $animals. It is easy to see how we\nmight use this to\
    \ parse over a list of filenames from the user.\n\n# while loop\n\nThe while loop\
    \ executes the commands between the do and done\nstatements while a given condition\
    \ is true. The while loop must\ncontain something which will eventually cause\
    \ the condition to become\nalse, otherwise an infinite loop would occur, and the\
    \ commands\nwould be executed forever. The following is an example of the use\
    \ of\na while loop:\n\n```\n$ a=2\n$ i=1\n$ while [ $i -le 20 ]\n> do\n  > echo\
    \ \"$a $i = 'expr $i \\* $a\"\n  > i='expr $i + 1'\n> done\n* 1 = 2\n* 2 = 4\n\
    * 3 = 6\n* 4 = 8\n* 5 = 10\n* 6 = 12\n* 7 = 14\n* 8 = 16\n* 9 = 18\n* 10 = 20\n\
    * 11 = 22\n* 12 = 24\n* 13 = 26\n* 14 = 28\n* 15 = 30\n* 16 = 32\n* 17 = 34\n\
    * 18 = 36\n* 19 = 38\n* 20 = 40\n```"
  - "[PAGE 128]\n\nDifferent loops are useful for different situations. A poorly written\
    \ loop can wind up executing indefinitely and may fill your hard drive, use all\
    \ your processor or cause you to run out of free memory. Beware the infinite loop!\n\
    \n# The case Statement\n\nInstead of nesting many if-then-else or if-then-elif-then\
    \ statements, another alternative is to use the case statement. The case statement\
    \ allows the user to perform a different set of commands depending upon the value\
    \ associated with a string variable.\n\nThe following example shows use of the\
    \ case statement as you might see it in a shell script:\n\n```\necho -n \" What\
    \ type of pet do you have (dog, cat, etc.) ?\"\nread pet\necho \"\"\ncase $pet\
    \ in\ndog)    echo \" So you have a dog ...\"\n               echo \"That's nice,\
    \ so do.\"\n               echo \" My name is Fido.\";\ncat)    echo \"So you\
    \ have a cat ...\"\n               echo \"I'm allergic to cats!\";\nfish)   echo\
    \ \"So you have fish ...\"\n               echo \"Can't take them for a walk ..\
    \ ha, ha.\";\nferret)  echo \" Ferrets are cool!\"\\n*)      echo \" A Pet - that's\
    \ a funny pet\";\"\nnesac\necho \"\"\n```\n\nThe case example script above asks\
    \ the user what kind of pet they have and provides different responses depending\
    \ upon the type of pet answered. It looks for answers of \"dog\", \"cat\", \"\
    fish\", \"ferret\", and \"*\".\n\nThe asterisk (*) matches any other answer supplied\
    \ by the user. When a match is found by the case statement, all commands are executed\
    \ until a double semi-colon (;;) is encountered.\n\nWhen the example above is\
    \ entered and saved to a file called whatpet.sh, it can be run as shown below:"
