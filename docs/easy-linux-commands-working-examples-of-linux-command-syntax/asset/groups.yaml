    ```

    $ chmod u+r secret_dir/

    $ chmod u-x secret_dir/

    ```


    ## 修改文件权限


    ```

    $ ls secret_dir/

    my_secret.txt

    $ cd secret_dir/

    -bash: cd: secret_dir/: Permission denied

    ```


