    # Renaming directories


    Directories can be renamed with the `mv` command. Here''s an example of renaming
    a directory:


    ```

    $ mv new_dir another_dir

    $ ls examples

    ```


    The `mv` command can also be used to move a directory to another location. This
    will be covered later in this chapter when we talk about moving and renaming files.


    # Navigating the Directory Tree


    The `cd` (change directory) command is used to change from one directory to another.
    With creating and deleting directories, it is possible to change to another directory
    by using an absolute path or by using a relative path. There are also some shortcuts
    that can be used with the `cd` command. For instance, .. refers to the parent
    directory, ~ refers to the home directory, and - refers to the last directory
    from which the user changed. To demonstrate this without having to type pwd after
    each cd we have added the working directory to the prompt on a separate line.
    The following are some examples of directory navigation:


    ```

    $ cd /usr/bin

    $ cd /

    $ cd ~

    $ cd examples

    $ cd /tmp

    $ cd -

    $ cd /home/tclark/examples

    $ cd /home/tclark

    ```


    You might have noticed that the second `cd` command to take you back to your home
    directory from anywhere is the exact same result as the `cd ~` command. It is
    also worth noting that when we used `cd -` it printed the previous directory.


    # Listing Directory Contents


    The `ls` command is used to list subdirectories and files within a directory.
    There are several options to the `ls` command that determine both the content
    and order of the listing. Without specifying any options, ls displays subdirectory
    and file names.


    ```

    $ cd ~/examples

    $ ls declaration.txt preamble.txt

    ```


    Table 4.2 contains descriptions of some of the options commonly used to display
    additional information:


    | Option | Purpose |

    | :--- | :--- |

    | -a | Display all files including those which begin with a period which would
    not be shown |

    | -l | Display long information include permissions, size, modification date/time,
    and name |

    | -d | Display information about a directory rather than the contents of that
    directory |

    | -t | Sort the display by date/time |


    # Table 4.2: ls Command Options


    The following are some examples of the `ls` command using the above options:


    ```

    $ cd ~/examples

    ls declaration.txt preamble.txt

    $ ls -al

    total 20

    drwxr-xr-x 2 user tclark 4096 Jan 13 17:48 .

    drwxr-xr-x 4 user tclark 4096 Jan 13 18:29 .

    -rw-r-- 1 user tclark 2230 Jan 13 17:47 declaration.txt

    -rw-r-- 1 user tclark 1310 Jan 13 17:46 preamble.txt

    -rw-r-- 1 user tclark 360 Jan 13 17:48 preamble.txt

    ```


    Now that we are comfortable managing and navigating around directories, let''s
    take a look at some file commands.


    # Disk Usage of a Specific Directory


    As we create and remove files and directories it is often important to keep track
    of disk usage. For that we use the `du` (disk usage) command.


    ```

    $ du -hs

    2.3M

    ```


    Here is how we use the options `h` to show the output in a human readable format
    and `s` to show all of disk usage in this directory. While we specified the working
    directory (.), any directory could be given.


    # File Commands


    ## Creating an Empty File


    Sometimes, it is useful to create an empty file as a placeholder for future content.
    The **touch** command can be used without any options to create an empty file
    as follows:


    ```

    $ touch /home/tclark/touch1.fil

    $ touch touch2.fil

    $ ls -l

    total 6

    drwxr-xr-x 2 tclark tclark 4096 Jan 13 17:48 examples

    -rw-rw-r-- 1 tclark tclark 0 Jan 13 19:13 touch1.fil

    -rw-rw-r-- 1 tclark tclark 0 Jan 13 19:14 touch2.fil

    ```


    The touch command also has an option that allows the file timestamp information
    of an existing file to be changed using the **-t** option. In the following example,
    the timestamp on the **touch1.fil** above will be changed to January 10 12:00.
    The date format for this option is a string of numbers with two digits each for
    month, date, hour (in 24 hour format) and minute, so the string for January 10
    12:00 would be 01101200. For instance, the user may want to change a group of
    files in a directory to indicate a particular date.


    ```

    $ touch -t 01101200 touch1.fil

    $ ls -l

    total 4

    drwxr-xr-x 2 tclark tclark 4096 Jan 13 17:48 examples

    -rw-rw-r-- 1 tclark tclark 0 Jan 10 12:00 touch1.fil

    -rw-rw-r-- 1 tclark tclark 0 Jan 13 19:14 touch2.fil

    ```


    ## A Brief Discussion about Wildcards


    Many of the common file and directory manipulation commands, including most of
    the ones mentioned in this chapter, will let you use partial file name and substitute
    a wildcard character for the rest. These wildcards can save you a lot of typing
    but also leave you with ambiguous results, possibly causing accidental deletion!
    The two most common wildcard characters are the asterisk (*) and the question
    mark (?). *, commonly called the star, will match any number of characters within
    a filename, even if there are none. ? will match any single character within a
    filename. Here are a couple examples which should make wildcards a bit clear:


    ```

    $ cd ~/examples

    ls declaration.txt preamble.txt

    $ ls touch*

    $ ls touch?

    $ ls

    ```


    # Deleting Files


    The `rm` (remove) command can be used to delete a file; referencing the file either
    via an absolute path or via a relative path. Wildcard symbols such as * and ?
    can be used to delete files with similar names. Be careful with the `rm` command,
    especially as Linux tends to just delete what you asked! Here are some examples
    of the `rm` command:


    ```

    $ rm /home/tclark/touch1.fil

    $ ls examples

    $ rm touch2.fil

    $ ls examples

    ```


    The `rm` command can be used with the -f (recursive) option to remove a directory
    and its contents. The `rm -r` command, as with other commands which affect multiple
    files, should be used with caution.


    ```

    $ mkdir -p new_dir/sub_dir

    $ ls new_dir

    $ rmdir new_dir

    $ rm -r new_dir

    $ ls

    ```


    # Preventing Accidental Deletion


    A little trick that some Linux users like to implement to prevent accidental file
    deletion is via the use of alias. Aliases are similar to variables and can be
    set in a session or by placing the command in the .bash_profile file with a text
    editor. By adding this alias the user will be prompted to confirm each file before
    it is deleted; otherwise, unlike Microsoft Windows, will delete whatever files
    match the filename criteria without warning!


    ```

    $ alias rm=''rm -i''

    $ touch touch1.fil touch2.fil touch3.fil

    $ rm touch*

    rm: remove regular file ''touch1.fil''?

    rm: remove regular file ''touch2.fil''?

    rm: remove regular file ''touch3.fil''?

    ```


    # Deleting Files Using File Properties


    When doing some file cleanup operations and it becomes desirable to delete all
    files within a directory that have not been used or accessed in more than 30 days,
    the following command will be useful:


    ```

    $ find -maxdepth 1 -atime +30 -exec rm {} \;

    ```


    This find locates files which have not been accessed in 30 days, and then executes
    an rm command for each file found. The find command can be very useful for performing
    operations on multiple files. We will discuss find in much more detail in chapter
    4.


    # Moving and Renaming Files


    The `mv` (move) command will allow you to move or rename files and directories.
    Linux does not discern between these two functions as renaming can be just considered
    moving a file to a different name.


    The rules for `mv` are similar to those for `rm` described earlier, in that file
    references can be via a fully qualified path or via a relative path. The use of
    the wildcard symbols in the filename is also allowed. The following are some examples:


    - Move file example1.fil from the current working directory to the /tmp directory:


    ```

    $ mv example1.fil /tmp

    ```


    - Move file example1.fil using the fully qualified path to the /tmp directory:


    ```

    $ mv /home/tclark/example2.fil /tmp

    ```


    - Rename temp1.fil in the /tmp directory to temp1.xxx from the home directory:


    ```

    $ cd /tmp

    $ touch temp1.fil temp2.fil

    $ ls -l temp*

    -rw-rw-r-- 1 tclark tclark 0 Jan 13 21:15 temp1.fil

    -rw-rw-r-- 1 tclark tclark 0 Jan 13 21:15 temp2.fil

    ```

