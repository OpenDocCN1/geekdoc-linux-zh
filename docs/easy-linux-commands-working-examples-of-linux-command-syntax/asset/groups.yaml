  mdcn: "\n\n# 结论\n\n在本章中我们涵盖了大量内容，你现在应该能够熟练地导航和操作 Linux 内的目录结构了。\n\n在本章中，我们首先查看了如何检查文件结构中的目录和文件。我们讨论了如何确定当前的工作目录，以及如何将其包含在提示符（prompt）中，这样你就能随时知道自己的位置。\n\
    \n然后，我们查看了如何创建、删除和重命名目录。我们讨论了如何使用 `cd` 命令在目录之间移动，以及如何查看目录的内容。\n\n深入研究文件操作，我们查看了如何创建空文件以及如何更新现有文件的时间戳。在看到删除文件是如此简单之后，我们展示了如何创建一个别名（alias），使\
    \ `rm` 命令在删除文件之前提示我们。\n\n我们还讨论了使用 `tar` 命令进行归档的几种用途，并学习了如何创建和提取 tar 包。\n\n我们查看了如何查看文件内容、文件的开头、结尾，甚至如何合并文件。我们甚至讨论了使用\
    \ `tail -f` 在行被写入文件时查看这些行。\n\n我们讨论了符号链接，将其作为让文件和目录出现在多个地方的方法，以及如何将内容从一个系统复制到另一个系统。\n\
    \n在下一章中，将更详细调查一些重要的 Linux 目录，并介绍一些用户需要注意的 Linux 文件。\n\n# 重要文件和目录\n\n掌握了如何导航 Linux\
    \ 目录树和操作文件的知识后，我们现在来看 Linux 内部一些更重要的文件。本章还将提供有关如何识别 Linux 目录架构中创建的标准目录的信息，以及重要文件存储在结构中的位置信息。\n\
    \n# 家目录 (Home Directory)\n\n每个 Linux 用户都分配有一个家目录，他们可以在那里存放文件并通过创建自己的目录来构建该结构。用户家目录由\
    \ Linux 登录用户名标识，通常可以在名为 /home 的父目录下找到。如果服务器上的用户是 sally、bill、joan 和 fred，那么家目录结构将如下所示。\n\
    \n```\n/home\n  /bill\n  /fred\n  /joan\n  /sally\n```\n\n我们之前提到过每个 Linux 系统都有一个根用户（root\
    \ user），但我们在这里没有看到 root 的家目录。由于 root 是一个特殊用户，root 的家目录可以在 /root 处找到。\n\n# 隐藏的“点”文件\
    \ (Dot Files)\n\n家目录中有些文件通常是隐藏的。隐藏文件的文件名以句开头；因此，它们被别称为“点文件”。除非在 `ls -a` 格式中使用\
    \ -a 选项，否则 `ls` 命令不会显示这些文件。\n\n下表 5.1 列出了用户应该了解的一些更常见的点文件。这绝不是一份完全全面的列表。在用户的家目录下可以找到更多的点文件；然而，某些搜索可能找不到此处列出的某些文件。找到的文件取决于服务器上安装的应用程序、正在使用的工具以及正在使用的命令行\
    \ shell。由于 Linux 的默认 shell 是 bash shell，因此家目录包含了下面列出的 bash 相关的脚本。\n\n| 文件 | 描述\
    \ |\n| :--- | :--- |\n| .bash_history | 对于 bash shell 用户，该文件包含最多 500 条最近的命令，可以使用向上和向下方向键进行回溯。\
    \ |\n| .bash_logout | 用户注销系统时由 bash shell 运行的脚本。 |\n| .bash_profile | bash shell\
    \ 在登录时运行的初始化脚本，用于设置变量和别名。当 bash 作为默认登录 shell 启动时，它会在用户家目录中查找 .bash_profile 文件；如果未找到，则会查找\
    \ .bash_login。如果没有 .bash_login 文件，则会查找 .profile 文件。 |\n| .bashrc | 每当 bash shell\
    \ 以登录 shell 以外的方式启动时执行的初始化脚本。最好将系统级函数和别名放在 /etc/bashrc 中，这将在书的后后部分介绍。 |\n| .gtkrc\
    \ | GTK 初始化文件。GTK+ 是用于创建图形用户界面的多平台工具包，被大量应用程序使用。它是 GNU 项目的 GNOME 桌面使用的工具包。 |\n\
    | .login | 每当用户登录时都会运行的初始化脚本。 |\n| .logout | 每当用户登录时都会自动运行的脚本。 |\n| .profile |\
    \ 将默认的系统级环境变量放在 /etc/profile 中。 |\n| .viminfo | 与 vi 兼容的 Vim 编辑器初始化文件。 |\n| .wm_style\
