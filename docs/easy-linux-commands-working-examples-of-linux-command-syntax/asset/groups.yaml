    # Hidden "Dot" Files


    There are some files within the home directory that are ordinarily hidden. Hidden
    files have names that begin with a period; hence, they have been given the nickname
    of dot files. Hidden files are not displayed by the ls command unless the -a option
    is used in the format of ls -a.


