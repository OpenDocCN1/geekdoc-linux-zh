    \ be useful to check if your script relies on a certain file being around or writable\
    \ for things to work right. The following are file test examples:\n\n```\n$ if\
    \ [ -e \".bash_profile\" ]\nthen\n  echo \" The file exists \"\nelse\n  echo \"\
    \ File not found \"\nfi\nThe file exists\n```\n\n```\n$ if [ -e \".bash_proxxx\"\
    \ ]\nthen\n  echo \" The file exists \"\nelse\n  echo \" File not found \"\nfi\n\
    ```\n\nUsing the test Command or [ expression ]"
- md: "\nThere are even more things we can test for when it comes to comparing strings.\
    \ Table 8.5 contains string tests and their descriptions.\n\n| Test | Description\
    \ |\n| :--- | :--- |\n| != | the strings are not equal |\n| = | the strings are\
    \ equal |\n| - | evaluates to the length of the string |\n| -n | the length of\
    \ string is nonzero |\n| -z | the length of string is zero |\n\n# Table 8.5: String\
    \ tests and descriptions\n\nThe following examples illustrate one use of the string\
    \ test.\n\n```bash\nif [ -n \"\" ]\nthen\n    echo \" The string contains characters\"\
    \nelse\n    echo \" The string is empty \"\nfi\n```\n\nThe string is empty\n\n\
    ```bash\nif [ -n \"ABC 123\" ]\nthen\n    echo \" The string contains characters\"\
    \nelse\n    echo \" The string is empty \"\nfi\n```\n\nThe string contains characters\n\
    \nAny of these simple test conditions can be evaluated individually or combined\
    \ with other conditions to evaluate complex expressions. Table 8.6 contains the\
    \ connectives for test and their descriptions.\n\n| Connective | Description |\n\
    | :--- | :--- |\n| ! | expression is false |\n| -a | both expression1 and expression2\
    \ are true (logical and) |\n| -o | either expression1 or expression2 is true (logical\
    \ or) |\n\n# Table 8.6: Connectives and their descriptions\n\nHere is how we could\
    \ use the or connective to check two separate conditions:\n\n```bash\n$ a=\"abc\"\
    \n$ b=\"abc\"\n$ if [ \"$a\" = \"xyz\" -o \"$a\" = \"$b\" ]\n> then\n> echo \"\
    One of the conditions is true\"\n> else\n> echo \"Neither condition is true\"\n\
    > fi\n\n$ a=\"abc\"\n$ b=\"xyz\"\n$ if [ \"$a\" = \"xyz\" -o \"$a\" = \"$b\" ]\n\
    > then\n> echo \"One of the conditions is true\"\n> else\n> echo \"Neither condition\
    \ is true\"\n> fi\n\nNeither condition is true\n```\n\nComplex conditions can\
    \ be used to evaluate several factors and react to certain conditions on the system\
    \ or the shell script. Next we'll see how these conditions can be used within\
    \ loops to repeat an action.\n\n# Loops\n\nA loop provides a way to execute commands\
    \ repeatedly until a condition is satisfied. The bash shell provides several looping\
    \ methods but we'll focus on the for loop and the while loop.\n\n# for loop\n\n\
    The for loop executes the commands placed between the do and done statements until\
    \ all values in the value list passed to it have been processed. Here is a simple\
    \ example of the for loop:\n\n```bash\n$ animals=\"dog cat mouse\"\n$ for animal\
    \ in $animals\n> do\n> echo $animal\n> done\ndog\n```\n\nAs we can see here, we\
    \ did not have to tell the for loop how many times to repeat. It just took the\
    \ input and repeated it for the number of separate items in the variable $animals.\
    \ It is easy to see how we might use this to parse over a list of filenames from\
    \ the user.\n\n# while loop\n\nThe while loop executes the commands between the\
    \ do and done statements while a given condition is true. The while loop must\
    \ contain something which will eventually cause the condition to become false,\
    \ otherwise an infinite loop would occur, and the commands would be executed forever.\
    \ The following is an example of the use of a while loop:\n\n```bash\n$ a=2\n\
    $ i=1\n$ while [ $i -le 20 ]\n> do\n  > echo \"$a $i = $(expr $i \\* $a)\"\n \
    \ > i=$(expr $i + 1)\n> done\n* 1 = 2\n* 2 = 4\n* 3 = 6\n* 4 = 8\n* 5 = 10\n*\
    \ 6 = 12\n* 7 = 14\n* 8 = 16\n* 9 = 18\n* 10 = 20\n* 11 = 22\n* 12 = 24\n* 13\
    \ = 26\n* 14 = 28\n* 15 = 30\n* 16 = 32\n* 17 = 34\n* 18 = 36\n* 19 = 38\n* 20\
    \ = 40\n```\n\nDifferent loops are useful for different situations. A poorly written\
    \ loop can wind up executing indefinitely and may fill your hard drive, use all\
    \ your processor or cause you to run out of free memory. Beware the infinite loop!\n\
    \n# The case Statement\n\nInstead of nesting many if-then-else or if-then-elif-then\
    \ statements, another alternative is to use the case statement. The case statement\
    \ allows the user to perform a different set of commands depending upon the value\
    \ associated with a string variable.\n\nThe following example shows use of the\
    \ case statement as you might see it in a shell script:\n\n```bash\necho -n \"\
    \ What type of pet do you have (dog, cat, etc.) ?\"\nread pet\necho \"\"\ncase\
    \ $pet in\ndog)    echo \" So you have a dog ...\"\n               echo \"That's\
    \ nice, so do.\"\n               echo \" My name is Fido.\";\ncat)    echo \"\
    So you have a cat ...\"\n               echo \"I'm allergic to cats!\";\nfish)\
    \   echo \"So you have fish ...\"\n               echo \"Can't take them for a\
    \ walk .. ha, ha.\";\nferret)  echo \" Ferrets are cool!\"\n*)      echo \"I don't\
    \ know that pet.\" \nesac\n```\n\nThe case statement allows commands depending\
    \ upon the value associated with a string variable. The following example shows\
    \ use of the case statement as you might see it in a shell script:\n\nThe case\
