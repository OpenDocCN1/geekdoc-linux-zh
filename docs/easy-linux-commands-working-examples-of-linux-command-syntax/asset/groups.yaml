    # Shell Scripts


    # CHAPTER 6


    ![](img/056ab74889c0b34d529c56d42bb0a965_105_0.png)


    Shell script seem like magic at first


    # Programming with Linux


    In this chapter, additional Linux commands will be introduced and used to show
    how to build programs called shell scripts. Shell scripting is the topic of my
    next book, Oracle Shell Scripting: Linux and UNIX Programming for Oracle in which
    I cover much of this information in great detail. If you are interested in shell
    scripting you might want to pick it up! Though some of the examples use Oracle,
    much of the books content is applicable for anyone interested in the topic. Here
    we will just cover things briefly in order to give a general idea about how scripts
    are created to perform functions that are repeated on a periodic basis.


    Instead of jumping directly into the creation of scripts, there are a few additional
    topics that should be presented first as well as some questions that need to be
    answered.


    # What is a shell?


    As described earlier in this book a shell provides a command interpreter environment
    for giving instructions to the Linux kernel via English-like commands. There are
    a number of different shell environments available in Linux. In order to determine
    which shell environments are available on a user''s version of Linux, the following
    command should be issued:


    ```

    $ cat /etc/shells

    /bin/sh

    /bin/bash

    /sbin/nlogin

    /bin/bash2

    /bin/ash

    /bin/bash

    /bin/ksh

    /bin/tcsh

    /bin/csh

    /bin/zsh

    ```


    The resulting list indicates that there are several shells available on this server
    such as the Bourne shell (sh), the Bourne Again shell (bash), the Korn shell (ksh)
    and the C-shell (csh), among others. In Linux, the bash shell is normally the
    default shell.


    To determine the default shell to which the system is currently set, the following
    command should be run:


    ```

    $ echo $SHELL

    /bin/bash

    ```


    As predicted, the bash shell is the current default.


    The shell is a command language interpreter that executes commands read from the
    standard input device such as a keyboard or from a plain text file.


    A shell can be compared to the Microsoft Windows command prompt, which also executes
    commands issued from the keyboard or from text (.bat) files; however, the shell
    environment is much more robust and feature-rich than its Windows counterpart.


    # Command Aliases


    Aliases are the shell scripts'' little cousin. A shell script, as we will see
    shortly, is a file which contain a list of commands. Aliases, in contrast, can
    be used to perform complex commands but are set in the shell like environmental
    variables.


    If you find yourself frequently using a fairly complicated command like the one
    below and will be able to run it without typing the whole thing you can use the
    alias command to set up a shortcut.


    ```

    $ alias alert-tail -20 /u01/installed/software/mypm/alert.log|more

    ```


    Now you can execute this whole command simply by typing alert. Many of the features
    we will discuss when talking about shell scripting are available in aliases including
    the pipe (|) used to send the output of one command to the input of another.


    A small set of well written aliases can save you a lot of keystrokes, just be
    careful not to make aliases with the same name as commands you use unless you
    want the alias to replace that command when you type it.


    ![](img/056ab74889c0b34d529c56d42bb0a965_108_0.png)


    Not just any clown can learn Linux shell scripts


    # Why use shell scripts?


    Since the shell is capable of reading commands from a file, called a script, it
    becomes a simple task to use a basic text editor like vi to build scripts to simplify
    frequently performed tasks and to automate the performance of those tasks.


    Programming simple or complex actions into shell scripts can simplify repetitive
    administrative and maintenance functions within the Linux environment.


    # Getting Started with a Simple Shell Script


    A shell script gets executed just if you were at the keyboard typing commands.
    Because of this we will demonstrate many of the capabilities of shell scripts
    right at the command line. Once tested at the command line, these commands can
    be moved into shell scripts. Here''s an example of a simple shell script:


    Why use shell scripts?


    ```

    #!/bin/bash

    # A simple shell script to output the time

    echo "The current date and time is `date`"

    ```


    This three line script starts with two comments (anything following a # is ignored
    by the shell), then has an echo command which outputs some text and the current
    date with the date command.


    If you enter these lines into a text file called what_time.sh you can execute
    it with a shell script with the bash command:


    ```

    $ bash what_time.sh

    The current date and time is Fri Sep 15 14:58:23 EDT 2006

    ```


    The .sh extensions are not necessary but is the conventional way to indicate a
    bash script.


    If we want to make things even easier we can change the execution privileges on
    this shell script so we don''t even need the bash command to run it.


    ```

    $ chmod u+x what_time.sh

    ./what_time.sh

    The current date and time is Fri Sep 15 15:18:56 EDT 2006

    ```


    This works because the first line of what_time.sh shell script is special. When
    the first line of a shell script begins with #! it is used as a hint to indicate
    what command should be used to execute this script. When Linux processes this
    script for execution it sees this hint and uses bash to execute it.


    We''ll spend the rest of this chapter looking at many of the hundreds of commands
    you can use in shell scripts, but remember, shell scripts don''t have to be complicated!
    They may just take the place of a couple commands that you run frequently or a
    long command that you have troubles remembering.


    # Shell variables


    Shells provide an abundance of useful built-in variables that can be referenced.
    To see the information provided by the shell, the set command can be run. Here''s
    a partial output:


    ```

    $ set

    BASH=/bin/bash

    BASH_VERSION=4.2

    BASH_VERSINFO=0

    HOME=/home/clark

    HOSTNAME=appsvr.mytec.com

    HISTFILE=/home/clark/.bash_history

    HISTSIZE=500

    HISTSIZE=1000

    IFS=$''\n''

    LOGNAME=clark

    PWD=/home/clark

    PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

    PS1=''[\u@\h \W]\$''

    PS2=''> ''

    SHELL=/bin/bash

    SHLVL=1

    TERM=vt00

    TYTY=0

    UID=1000

    USER=clark

    ```


    The contents of a shell variable can be displayed by using the echo command and
    prefacing the variable name with a dollar sign. Shell variables are referenced
    using capital letters.


    ```

    $ echo $TERM

    vt00

    $ echo $USER

    clark

    $ echo $HOSTNAME

    appsvr.mytec.com

    $ echo $LOGNAME

    clark

    ```


    There are also some special built-in variables that can be useful creating shell
    scripts. Some of them are listed in Table 8.1 below.


    | Variable | Description |

    |---|---|

    | $* | The total number of arguments passed to a shell script on the command line.
    |

    | $0 | The command (script) invoked on the command line. |

    | $1-$9 | All arguments passed to the shell script from first to ninth |


    # Table 8.1: Shell built-in variables


    # User Defined Variables


    Shells also allow the creation of variables for use within scripts (local variables)
    and for passing between scripts (global variables). User variables are traditionally
    created using lower-case characters though they can be any case you want.


    The creation of a variable requires merely choosing a lower-case name for the
    variable and giving it a value using an equal (=) sign. There should be no spaces
    on either side of the equal sign. If there are spaces or special characters in
    the contents of your variable you should enclose the variable in single quotes.


    The unset command can be used to nullify the value of a previous variable. The
    following are some examples:


    ```

    $ myname=''Terry Clark''

    $ echo myname

    Terry Clark

    ```

