    +   - Make a directory using a relative path:


    ```

    $ mkdir new_dir2

    $ ls

    examples new_dir1 new_dir2

    ```


    The -p (parent) option allows creation of a complete directory branch when parent
    directories do not yet exist. This will actually create both the parent directory
    and subdirectory specified. In our example this means the new_dir3 and sub_dir3
    are both created with a single command.


    +   - Make a directory with a subdirectory using the -p option:


    ```

