    ## Conclusions


    We started this chapter with a quick overview of Linux shell programming and tried
    it out with a simple script. We showed how an alias may be used instead of a shell
    script when only a command or two are needed, then we talked about how to view
    and set variables including those which are defined within the shell.


    We then looked at how the shell can be used to do math. We used the echo command
    to try out some of the different ways of quoting things in Linux and saw how the
    results differ.


    We spent some time looking at how to read the exit code of a command which will
    often tell us if the command was successful. How to accept information into a
    shell script through command line arguments was also covered.


    We saw how to redirect output to a file and how a file can be used as input for
    a command and then saw how pipes can be used to redirect data between commands.


    Conditions and loops were introduced and we talked about different conditions
    we can evaluate for. Finally we looked at some of the commands available within
    Linux just to get an idea of what is possible.


    In the next chapter we''ll look at how commands and shell scripts can be scheduled
    to run on a regular basis with the cron command.


    ## Scheduling Jobs with crontab


    ![](img/056ab74889c0b34d529c56d42bb0a965_137_0.png)


    > Scheduled maintenance can keep a Linux server tidy


    ## The cron Daemon


    This final chapter will introduce the details on how to schedule shell scripts
    to execute on a regular timetable. The cron daemon is the system task that runs
    scripted jobs on a pre-determined schedule. The crontab command is used to tell
    the cron daemon what jobs the user wants to run and when to run those jobs.


    Each Linux user can have their own crontab file, if allowed by the System Administrator.
    The administrator controls use of crontab by including users in the cron.deny
    file to disallow use of crontab.


    ## crontab Options


    As shown in Table 10.1, the crontab command has several options with different
    purposes.


    | Option | Purpose |

    | --- | --- |

    | -e | edit the current crontab file using the text editor specified by the EDITOR
    environment variable or the VISUAL environment variable |

    | -l | list the current crontab |

    | -r | remove the current crontab |

    | -U | specifies the user''s crontab to be manipulated. This is usually used by
    root to manipulate the crontab of other users or can be used by you to correctly
    identify the crontab to be manipulated if you have used the sum command to assume
    another identity |


    Table 10.1: crontab options and purposes


    crontab also accepts a file name and will use the specified file to create the
    crontab file. Many users prefer to use this option rather than the crontab -e
    command because it provides a master file from which the crontab is built, providing
    a backup to the crontab. The following example specifies a file called mycron.tab
    to be used as the input for crontab.


    ```

    $ crontab mycron.tab

    ```


    Here''s how you would use the crontab -l command to view the current cron entries
    for the logged in user.


    ```

    $ crontab -l

    ********************************************************************

    # Run the Weekly file cleanup task at 6:00AM every Monday

    # and send any output to a file called cleanup.1st in the

    # /tmp directory

    ********************************************************************

    ```


    ```

    00 06 * * 1 /home/terry/cleanup.ksh > /tmp/cleanup.lst


    # Run the Weekly Management Report every Monday at 7:00 AM

    # and save a copy of the report in my /home directory

    ######################################################

    00 07 * * 1 /home/terry/weekly_mgmt_rpt.ksh >

    /home/terry/weekly_mgmt_rpt.lst

    ```


    If we want to delete all the entries in the crontab we can use the -r option.


    ```

    $ crontab -r

    ```


    ## The Format of the crontab File


    The crontab file consists of a series of entries specifying what shell scripts
    to run and when to run it. It is also possible to document crontab entries with
    comments. Lines which have a pound sign (#) as the first non-blank character are
    considered comments. Blank lines are completely ignored. Comments cannot be specified
    on the same line as cron command lines. Comments must be kept on their own lines
    within the crontab.


    There are two types of command lines that can be specified in the crontab: environment
    variable settings and cron commands. The following sections will provide more
    detail on these two types of crontab entries.


    ## Environment variable settings


    Each environment variable line consists of a variable name, an equal sign (=),
    and a value. Values that contain spaces need to be enclosed within quotes. The
    following are some examples of environment variable settings:


    ```

    color = red

    title = ''My Life in a Nutshell''

    ```


    It is important to remember variable names are case sensitive and that system
    variables are usually defined with upper case names, while user defined variables
    are defined with lower case names.


    ## crontab Command Lines


    Each crontab command line is comprised of six positional fields specifying the
    time, date and shell script or command to run. The format of the crontab command
    line is described in Table 10.2 below:


    | Field | Minute | Hour | Day of Month | Month | Day of Week | Command |

    | --- | --- | --- | --- | --- | --- | --- |

    | Valid values | 0-59 | 0-23 | 1-31 | 1-12 | 0-7 | Command path/command |


    Table 10.2: crontab command line format


    Each of these fields can contain a single number, a range of numbers indicated
    with a hyphen (such as 2-4), a list of specific values separated by commas (like
    2,3,4) or a combination of these designations separated by commas.


    ```

    00 06 * * 1 /home/terry/cleanup.ksh > /tmp/cleanup.lst

    ```

    This entry will run the cleanup.ksh at 0 minutes past the hour, 6 am, every day
    of the month, every month of the year, but only on Mondays.


    ```

    ######################################################

    # Run the Weekly Management Report every Monday at 7:00 AM

    # and save a copy of the report in /home directory

    ######################################################

    00 07 * * 1 /home/terry/weekly_mgmt_rpt.ksh > /home/terry/weekly_mgmt_rpt.lst

    ```

    This entry will execute at 7:00am. Since the hour is in 24 hour format (midnight
    is actually represented as 00) we know the 07 represents 7:00 a.m.


    ```

    ################################################****************

    # Weekly Full Backup - run every Sunday at 1:30AM

    ################################################****************

    30 01 * * 0 /home/terry/full_backup.ksh > /tmp/full_backup.lst

    ```

    Here we have specified this script to run at 30 minutes past the hour, the first
    hour of the day, but only on Sundays. Remember that in the day of the week Sunday
    can be represented by either 0 or 7.


    ```

    ################################################################

    # Nightly Incremental Backup - run Monday-Saturday at 1:30AM

    ################################################################

    30 01 * * 1-6 /home/terry/incr_backup.ksh > /tmp/incr_backup.lst

    ```

    In this crontab entry we have the same indication for hour and minute as the last
    entry but we have specified a range for the day of the week. The range 1-6 will
    cause the incr_backup.ksh to be executed at 1:30 every morning from Monday through
    Saturday.


    ```

    ################################################################

    # Low disk space alert ... run every 15 minutes, sending

    # alerts to key individuals via e-mail

    ################################################################

    00,15,30,45 * * * /home/terry/free_space.ksh > /tmp/free_space.lst

    ```

