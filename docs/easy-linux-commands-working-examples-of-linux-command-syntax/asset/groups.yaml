    Though tree will give us a quick overview of everything in a directory we are
    often only concerned with certain directories or files. Later in this chapter
    we''ll talk about how to examine a more specific subset of directory.


    ## Directory Commands


    Here we''ll talk a bit about navigating around the Linux file structure.


    ## What Directory am I In?


    When navigating around in Linux it is very easy to forget what directory you''re
    in. Don''t worry, the **pwd** command will show you your current working directory.


    ```

    $ pwd

    /home/user

    ```


    The **cd** command (change directory) is used to change your current directory.
    You can use either absolute or relative paths to move to a new directory.


    ```

    $ cd /etc

    $ cd ..

    $ cd ~

    ```


    The **ls** command is used to list the contents of a directory. You can use various
    options to change how the output is displayed.


    ```

    $ ls

    $ ls -a

    $ ls -l

