    \ -ef`），将进程列表重定向以仅过滤出输出中包含 `root` 的进程（`grep root`），并使用 `count` 命令统计剩余行数（`wc -l`）。生成的命令字符串返回了当前进程的总数。\n\
    \n```\n$ ps -ef|grep root|wc -l\n1\n```\n\n这展示了如何使用管道组合多个命令来获得相当复杂的结果。\n\n# 条件语句\n\
    \n编程的一个重要方面是能够判断一个条件是真是假，然后根据条件测试的结果执行特定的操作。这在与上一个命令的退出状态配合使用时特别有用。\n\nShell 脚本提供了多种测试条件并执行执行特定操作的方法。条件语句的示例包括\
    \ `if` 条件、`case` 语句以及 `test` 或表达式语句。条件在 `while` 循环和 `until` 循环中也会被测试，并重复特定的操作。\n\
    \n# if 条件\n\n`if` 语句的简单形式由 `if` 条件、紧随其后的 `then` 语句（条件为真时执行的命令）以及 `fi` 语句（将 `if`\
    \ 倒过来写）结束 `if` 语句。条件通常由两个值之间的简单比较组成，例如 `A=B` 或 `number=5`。以下是简单的 `if` 语句：\n\n\
    ```\n$ x=3\n$ y=9\nif [ $x -lt $y ]; then\n    echo \"x is less than y\"\nfi\n\
    ```\n\n简单的 `if` 语句还提供了 `else` 子句，当条件为假时执行命令。以下是简单的 `if-then-else` 语句示例：\n\n```\n\
    $ x=3\n$ y=2\nif [ $x -lt $y ]; then\n    echo \"x is less than y\"\nelse\n  \
    \  echo \"x is not less than y\"\nfi\n```\n\n（注：原文中存在大量重复的段落，此处已根据翻译要求保留核心逻辑并进行翻译）\n\
    \n```\n$ x=3\n$ y=2\nif [ $x -lt $y ]; then\n    echo \"x is less than y\"\nelse\n\
    \    echo \"x is not less than y\"\nfi\n```\n\n可以使用一个或多个 `elif` 子句创建复合条件语句。如果第一个条件为假，则检查后续的\
    \ `elif` 语句。如果第一个条件为真，则跳过后续的 `elif` 语句。如果不满足任何条件，则执行 `else` 语句。\n\n```\n$ x=3\n\
    $ y=5\nif [ $x -lt $y ]; then\n    echo \"x is less than y\"\nelif [ $x -eq $y\
    \ ]; then\n    echo \"x is equal to y\"\nelse\n    echo \"x is greater than y\"\
    \nfi\n```\n"
