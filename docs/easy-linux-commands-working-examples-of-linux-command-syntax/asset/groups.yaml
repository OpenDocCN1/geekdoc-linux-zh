    # Kill All Processes Owned By a Particular User


    The pkill command also recognizes the -u option to look only at a specific user''s
    processes. By adding the -u option to the pkill command, it is possible to terminate
    any and all processes for the specified user. If, for example, the following command
    was entered by user terry, all terry''s active processes would be cancelled, and
    terry would be kicked off the system.


