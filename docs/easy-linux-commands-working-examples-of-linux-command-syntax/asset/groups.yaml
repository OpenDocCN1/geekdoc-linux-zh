    17263 Terry 9 576 576 S 0.0 5.4 00:02:02 gnome-pty-help\n14241 Terry 9 1540 1096\
    \ S 0.0 0.6 00:02:28 bash\n\nHere we see the process used by the user Terry. As\
    \ you can see, the -u option works very similarly with top as it did with ps.\n\
    \nWhile you are running top to track down running processes we might find some\
    \ to deal with. In the next section we will see how to kill processes. Be careful\
    \ with these commands, especially if you have root privileges!\n\n# Kill a Process\n\
    \nWhen process goes bad it is often necessary to terminate them. The kill command\
    \ is used to send a signal to the specified process or group. The default signal\
    \ is a SIGTERM (15) A process which receives a SIGTERM may be programmed to trap\
    \ signals and perform specific functions or ignore the signal entirely.\n\nkill\
    \ takes a process ID as a parameter. The process ID owned by the process ID can\
    \ be found using any of the methods described earlier in this chapter.\n\nThe\
    \ following example shows the screaver process (2609) which is to be terminated.\n\
    \n```\n$ pgrep xscreen\n2609\n$ kill 2609\n```\n\nThough we use pgrep to find\
    \ the PID of this process here we have also used a PID from the output of top\
    \ or ps.\n\nWhen there is a stubborn process trapping the kill command and refusing\
    \ to terminate, the -9 (SIGKILL) signal should be used to kill the process. The\
    \ -9 signal cannot be trapped by a process and ignored. If the screaver process\
    \ did not terminate after the last kill command, the new kill command would look\
    \ like the following:\n\n```\n$ kill -9 2609\n```\n\nWhile the kill command is\
    \ typically available to all users you will only be able to kill processes you\
    \ own. To kill processes owned by other users you will need root privileges.\n\
    \n# Kill Processes Using a Pattern\n\nRather than scanning through process ID\
    \ (PID) numbers, it might be easier to kill a process or group of processes by\
    \ searching for a pattern in the command name. The pkill command is one way to\
    \ accomplish this, as shown below. pkill matches processes in the same way pgrep\
    \ does. Be very careful using pkill as you could easily kill more than you wanted!\n\
    \nWe want to kill all processes called xscreen. First we use pgrep to make sure\
    \ we get a reasonable number of PIDs back, then we kill the process with pkill.\n\
    \n```\n$ pgrep xscreen\n2609\n$ pkill xscreen\n```\n\n# Kill All Processes Owned\
    \ By a User\n\nThe pkill command also recognizes the -u option to look only at\
    \ a specific user's processes. By adding the -u option to the pkill command, it\
    \ is possible to terminate any and all processes for the specified user. If, for\
    \ example, the following command was entered by user terry, all terry's active\
    \ processes would be cancelled, and terry would be kicked off the system.\n\n\
    ```\npkill -9 -u terry\n```\n\n![](img/056ab74889c0b34d529c56d42bb0a965_156_0.png)\n\
    \nSince you have the ability to kill any user's processes this would be a quick\
    \ way to stop everything they're doing. Be careful though, doing so may not make\
    \ you any friends, if you know what I mean.\n\nWe've talked mostly about two users\
    \ so far, root and you (terry in most of the examples,), but there could be more\
    \ people than that on our Linux system. Next we'll look at how to tell who's in.\n\
    \n# Logged In User Information\n\nTo get a quick count of how many users are on\
    \ the system we can use the uptime command.\n\n```\n$ uptime 2:41:39 up 2 users,\
    \ load average: 0.00, 0.00, 0.00\n```\n\nWe also see some other useful information\
    \ here, like the current system time, the amount of time since last startup and\
    \ the load\n"
  mdcn: "\n一旦进入 top 界面，你只需要输入 q 即可退出并返回命令行。\n\n在这里我们看到了默认的 top 输出。这里包含的内容很多，但这里有几个亮点。其中某些内容你可能在\
    \ ps 输出中已经很熟悉了。\n\n| top 输出字段 | 说明 |\n| --- | --- |\n| up | 系统运行的时间。可能以天为单位 |\n\
    | users | 连接的用户数 |\n| load average | 当前正在运行的进程数，加上等待一分钟、五分钟和十五分钟内运行的进程数*。 |\n\
    | Tasks (or processes) | 活跃进程的总数 |\n| CPU | CPU 的当前使用情况 |\n| user | 用户进程消耗的 CPU\
    \ 百比 |\n| system | 系统内核进程消耗的 CPU 百比 |\n| idle | 当前未使用的 CPU 百比 |\n| iowait (未显示)\
    \ | 等待数据（通常是磁盘）读取时所花费的 CPU 百比 |\n| Mem | 内存使用信息 |\n| total | 系统的内存总量 |\n| used\
    \ | 系统已使用的内存 |\n| free | 未使用的内存 |\n| Swap | 使用磁盘作为内存的信息 |\n| total | 分配用于内存的磁盘总量\
    \ |\n| used | 当前正在使用的交换空间 |\n| free | 未使用的交换空间 |\n| PID | 该进程的进程 ID |\n| USER\
    \ | 进程所有者的用户名 |\n| %CPU | 该进程占用 CPU 的百分比 |\n| %MEM | 该进程占用总内存的百分比 |\n| TIME |\
    \ 该进程消耗的 CPU 总时间 |\n| Command | 执行的命令（已截断） |\n\n* 计算方法比这要复杂得多，但目前这个简单的解释足够了。通常情况下，如果系统的负载平均低于\
    \ CPU 的数量，说明它能跟上工作。如果负载平均是 CPU 数量的一到两倍，说明系统开始落后，任务处理的速度赶不上任务产生的速度，而如果负载平均是 CPU\
    \ 数量的几倍，通常表明系统已经崩溃不堪。当然，你的体验是判断系统性能的最好指标。\n\n一分钟、五分钟和十五分钟的负载对于识别系统趋势很有用。如果一分钟负载低于五分钟和十五分钟的平均值，说明系统可能完成了大型任务，变得比以前没忙了。如果一分钟和五分钟的平均值更高，则可能意味着系统比十五分钟前更忙了。\n\
    \n## 显示最活跃的进程\n\n在运行 top 时，有几个命令可以改变显示内容。一些常用的命令有：\n\n- 空格键：刷新显示\n- h: 显示帮助屏幕\n\
    - k: 杀死一个进程*\n- n: 更改显示的进程数量\n- u: 指定要查看哪个用户的任务（留空表示所有用户）\n- p: 按 CPU 使用率对任务排序\n\
    - s: 更改刷新之间的秒数\n\n*我们将在本章的晚些部分详细讨论如何杀死进程。现在你可能不想使用这个命令。至于其他命令，你可以尽管尝试。\n\n对于大多数其他命令，top\
    \ 都可以通过不同的选项启动。当以 root 登录时，最常用的选项是 -u，它用于将活跃进程限制在特定用户上。\n\n```\n$ -u Terry\ntop\
