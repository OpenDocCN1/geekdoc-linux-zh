    命令 `ps -ef` 将列出系统上所有运行命令的信息。以下是其含义的快速解释：


    | 列 | 描述 |

    | :--- | :--- |

    | UID | 所有者的用户名 |

    | PID | 该进程的进程 ID |

    | PPID | 启动此进程的（父）进程的进程 ID |

    | C | 该进程的 CPU 利用率 |

    | STIME | 开始时间（如果超过一天，则显示月份） |

    | TTY | 该进程启动自终端（如果有的话） |

    | TIME | 该进程消耗的 CPU 数量 |

    | CMD | 执行的命令（可能会被截断） |


