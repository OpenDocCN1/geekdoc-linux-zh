    ## 更改组所有权


    `chgrp` 命令用于更改文件关联的组。执行此命令需要提供的第一个信息是你想将文件或目录更改到的组。之后，你可以列出一个要更改的目录或目录，或者列出用空格分隔的多个实体。`chgrp`
    命令不会对授予组的权限（三组权限中间的 `rw-`）产生任何影响，但它将更改谁可以使用这些权限。


