    # NAME


    w - Show who is logged on and what they are doing.


    # SYNOPSIS


    w - [husuf] [user]


    # DESCRIPTION


    w displays information about the users currently on the machine, and their processes.
    The header shows, in this order, the current time, how long the system has been
    running, how many users are currently on, and the load averages for the past 1,
    5, and 15 minutes.


    The following entries are displayed for each user: login, the tty, the name, host
    login, idle time, JCPU, CPU, and the command line of their current processes.


    The CPU time is the time used by all processes attached to the tty. It does not
    include background jobs, but does include currently running jobs.


    The CPU time is the time used by the current process, named in the "what" field.


    # COMMAND-LINE OPTIONS


    - Don''t print the header.


