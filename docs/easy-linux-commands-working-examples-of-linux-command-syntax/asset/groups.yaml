    The information from the mpstat report can be used to determine if processor load
    is being distributed evenly across the existing processors and if the multi-processing
    capabilities of the server are being utilized effectively.


    # Displaying I/O Statistics


    The iostat command is used to monitor the load on server input/output (I/O) devices
    by observing the time the devices are active compared to the average transfer
    rate of the device. iostat generates several report lines that can be used to
    monitor and subsequently change the system configuration to better balance the
    I/O workload between physical disk devices.


    The initial report detail lines generated by iostat provide statistics encompassing
    the time since the system was last booted. Subsequent sets of detail lines cover
    the time since the previous report interval.


    Each set of report lines starts with a header row with CPU statistics which represents
    the CPU usage across all processors. Following the CPU information, a device header
    row is displayed with subsequent detail lines of statistics for each device in
    the system.


    The following example shows the invocation of iostat specifying a three second
    interval or delay with a total of five samples or counts:


    ```

    $ iostat 3 5

    Linux 2.6.5-1.358 (Dell-Linux) 10/18/2004

    ```'
