    # User Defined Variables


    Shells also allow the creation of variables for use within scripts (local variables)
    and for passing between scripts (global variables). User variables are traditionally
    created using lower-case characters though they can be any case you want.


    The creation of a variable requires merely choosing a lower-case name for the
    variable and giving it a value using an equal (=) sign. There should be no spaces
    on either side of the equal sign. If there are spaces or special characters in
    the contents of your variable you should enclose the variable in single quotes.


    The unset command can be used to nullify the value of a previous variable. The
    following are some examples:


    ```

    $ myname=''Terry Clark''

    $ echo myname

    ```'
- md: '

    ```bash

    $ myname

    $ echo $myname

    Terry Clark

    $ unset $myname

    $ echo $myname


    $ number=10

    $ echo $number

    10

    ```


    In this example we see that in order to set the contents of a variable we just
    give the variable name, but if we want to retrieve the contents of a variable
    we must use a dollar sign ($) before the variable name.


    The variables created above are local variables available only to the current
    shell. Variables must be exported if they are to become global so they can be
    referenced by other shell scripts. The following example shows the creation of
    global user variables.


    ```bash

    $ myname=Terry

    $ export myname

    ```


    In the bash shell we can combine these two lines into one and use the following
    command to set export a variable:


    ```bash

    $ export myname=Terry

    ```


    Variables are great for storing information. Later we''ll see how we can use variables
    to make decisions and loops, but first we''ve got a little more basic ground to
    cover.


    # Evaluating Expressions


    Shells can evaluate complex expressions and allow the user to perform math functions.
    The following examples demonstrate some simplistic math using the expr command:


    ```bash

    $ expr 6 + 3

    9

    $ expr 6 + 3 + 8

    17

    $ expr 8 - 2

    6

    $ expr 12 / 3

    ```


    ```bash

    4

    $ expr 15 \* 3

    45

    $ expr 20 % 3

    2

    $ echo `expr 15 + 3`

    18

    ```


    The example above shows not only the common use of expr but of the exceptions
    you may find in the expr command, such as:


    - The multiplication example uses an escape character (\) before the * so that
    the * is not interpreted as a wildcard symbol.

    - “20 % 3” is read as 20 mod 3 and yields the remainder when 20 is divided by
    3.

    - The last example uses backward quote signs (`) to enclose the command. The command
    within the backward quotes is executed and the result echoed to the screen.


    # Using Quotes in Shell Scripts


    Since the use of the backward quote (Formally, a "grave", pronounced Gra-vec)
    or backtick has been mentioned, this is probably a good time to explain the rules
    regarding the use of quotes:


    - Double quote (""): Variables are expanded when enclosed in double quotes

    - Single quote (''\): Variables within single quotes are not expanded

    - Backward quote (\```): Commands within backward quotes are executed and their
    output substituted into that location.


    The following examples should help make the differences between the types of quotes
    more evident.


    ```bash

    $ myname=''Terry Clark''

    $ echo ''My name is $idname''

    My name is $idname

    $ echo "My name is $idname"

    My name is Terry Clark

    ```


    ```bash

    $ echo ''The name of this computer is ''hostname''

    The name of this computer is ''hostname''

    $ echo "The name of this computer is ''hostname''"

    The name of this computer is appsvr.mytec.com

    ```


    So we see that when enclosed in single quotes text is treated very literally,
    but when enclosed in double quotes variables and commands in backtick quotes are
    evaluated and their values output.


    # Exit Status


    Whenever a command or shell script completes successfully, it sets a hidden status
    code of zero. If the command is unsuccessful, it sets a nonzero hidden status
    code. This completion status code is known as the **exit status** of the last
    command or script that was run is contained in the special shell-variable, $?


    Most of the time we never look at this value and instead check to see if the command
    did what we want or look for errors in the output of commands. In a shell script,
    however, we may want to check the exit status to make sure everything is going
    OK. The **exit status** of the last command can be displayed as follows:


    ```bash

    $ ls

    example1.fil example2.xxx examples test.bsh umask_example.fil

    $ echo $?

    0

    $ ls *.txt

    ls: *.txt: No such file or directory

    $ echo $?

    ```


    The conditional statements shown later in this section can be used to make decisions
    based on the **exit status** of the previous command. This can be useful for handling
    and reporting errors in a shell script.


    # The read Statement


    The **read** command is used to accept input from standard input such as a keyboard
    and store it into variables. This is useful if you want to prompt for input from
    the user running your script.


    The read command reads one line from the standard input and the first word is
    assigned to the first variable, the second word to the second variable, and so
    on, with leftover words assigned to the last variable. If there are fewer words
    read from the input stream than variables, the remaining variables are assigned
    empty values.


    Here are some examples of the read command:


    ```bash

    $ read name1 name2

    Terry Clark

    echo $name2

    Clark

    echo "Name: $name1 Name2: $name2"

    Name1: Terry Name2: Clark

    $ read fullname

    Terry L. Clark

    echo $fullname

    Terry L. Clark

    ```


    The -p option can be used to specify a prompt to be displayed to the user. The
    prompt can be used to request the user enter specific information. The following
    is an example of using read with the -p option to prompt for user input:


    ```bash

    $ read -p"Enter your name please: " fullname

    Enter name please: Terry Clark

    echo $fullname

    Terry Clark

    ```


    Now you can start to see how we can make an interactive shell script which prompts
    the user for input. Sometimes we want to collect information when the shell script
    is started rather than once it is running. For that type of information command
    line arguments can be used.


    # Command Line Arguments


    Arguments or parameters can be passed to the script from the command line that
    invoked the script just like we have been passing arguments to commands. Arguments
    passed to the script are available in special shell variables which are referenced
    by number. The first argument can be referenced using the variable $1, the second
    argument using $2, etc. The $0 variable is special and contains the name of the
    command used to invoke the script or command name. The following is an example
    of command line arguments.


    ```bash

    # This script accepts a user''s first and last name

    # displays the current login username, hostname, and home

    #


    firstname=$1

    lastname=$2


    echo ""

    echo "Hello $1"

    echo "You are logged in as: $USER on server: $HOSTNAME"

    echo "Your home directory is: $HOME"

    echo "Thank you, $firstname $lastname for invoking the $0 command"

    echo ""

    ```


    Note that anything after a pound sign (#) in a shell is a comment and will be
    ignored when the script is run. If we were to run the script above, here is what
    we would get:


    ```bash

    ./script.sh Terry Clark

    Hello Terry

    You are logged in as: user on server: appsvr.mytec.com

    Your home directory is: /home/user

    Thank you, Terry Clark for invoking ./script.sh

    ```


    Sometimes we want to collect information when the shell script is started rather
    than once it is running. For that type of information command line arguments can
    be used.


    # Redirection of Standard Input & Output


    In Linux, the standard input is the keyboard, and the standard output is the screen.
    Three symbols are used to redirect these. Table 8.2 shows the symbols:


    | Symbol | Meaning |

    | :--- | :--- |

    | < | Accept input from a file |

    | > | Send output to a file (overwriting the file) |

    | >> | Append output to the end of a file |


    The standard input of Linux is the keyboard, and the standard output is the screen.


    **Table 8.2:** Redirection symbols


    The following is an example of redirecting output to a file using the `>` symbol.
    We then examine the file with the `cat` command.


    ```bash

    $ ls > dir.txt

    $ cat dir.txt

    ```


