    | "byy | 复制（yank）当前行文本到名为 $b$ 的缓冲区 |

    | 5yy | 将五行文本复制到默认缓冲区 |

    | p | 将默认缓冲区粘贴在当前光标行之后 |

    | P | 将默认缓冲区粘贴在当前光标行之前 |

    | "bP | 将具名缓冲区 $b$ 的内容粘贴在当前光标行之前 |


