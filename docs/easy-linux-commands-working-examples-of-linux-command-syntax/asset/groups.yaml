    目录的写权限在某种程度上符合预期。如果用户对目录具有写权限，即使他们不是文件的所有者，也可以在该目录中创建或删除文件。这一点非常重要，因为给予用户、组或其他用户对包含其他用户文件的目录的写权限，将允许他们删除其他用户的文件。


