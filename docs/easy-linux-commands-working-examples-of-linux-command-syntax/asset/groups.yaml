    # Book Summary


    This concludes the Linux Quick Reference. While no book can make you an expert
    we hope that this has eased the learning curve and will continue to act as a functional
    reference.


    If you''re interested increasing your Linux expertise the best way to do it is
    experience. The more you use Linux the better you''ll get at it, especially if
    you work a lot at the command line!


    Linux skills are desirable in the IT field and many of your Linux skills will
    carry over to UNIX and other UNIX-like operating systems, even Mac OSX! The ability
    to operate at the command line not only allows you to work things out when your
    windowing environment will not start but also allow you to connect remotely from
    anywhere in the world via SSH.


