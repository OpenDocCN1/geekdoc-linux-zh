    \                         524152      524152\n```\n\nSome information in the above\
    \ display is extracted directly from the meminfo file while other information\
    \ is calculated. The display shows how much memory is being used in kilobytes,\
    \ because the -k option has been specified. If you prefer to see the information\
    \ in megabytes you can use the -m option.\n\n## Top Memory and CPU Users\n\nPreviously,\
    \ the process status (ps) command was introduced. When the -u option is specified\
    \ with the ps command, columns representing the percentage of CPU and the percentage\
    \ of memory that a process is using are displayed as represented below by columns\
    \ %cpu %mem.\n\n```\n# ps u\nUSER       PID %CPU %MEM    VSZ RSS TTY STAT START\
    \   TIME\nCOMMAND\nterry      4968  0.0   0.5  5664 1320 pts/6     S 11:21 0:00\
    \ -bash\nterry      5120  0.0   0.2  3440  756 pts/6     R 11:42 0:00 ps u\n```\n\
    \nThe aux options can be added to the ps command to include all processes, not\
    \ just the user's own and build a complex command to display the commands using\
    \ the most memory or CPU.\n\nAn example of each complex command is included below:\n\
    \n## Display Top CPU User:\n\n```\n$ ps -aux | sort -n +2 | tail -1\nroot 2201\
    \ 0.2 3.2 36564 8464 S Oct17 2:18\n/usr/X11R6/bin/X :0 -auth /var/gdm/:0.Xauth\
    \ -nolisten tcp\nt7\n```\n\n## Display Top Memory User:\n\n```\n$ ps -aux | sort\
    \ -n +3 | tail -1\ngdm 3718 0.0 3.5 20744 9012 ? S 00:09 0:36\n/usr/bin/gdmgreeter\n\
    ```\n\nIn the example above that can be used for displaying the top memory user,\
    \ all processes are displayed then sorted in ascending sequence using the numeric\
    \ value in column 4 (sort defaults to the first column and the +3 tells sort to\
    \ look three columns to the right of that.) It then displays the last and highest\
    \ value in the sorted list. If you wanted to see the top five memory or CPU users\
    \ we could just change the tail -1 to tail -5, just remember they will be sorted\
    \ from least to greatest of the top 5. We'll talk more about building complex\
    \ commands like this in the chapter on shell scripting.\n\n## Paging and Swapping\
    \ Devices\n\nLinux uses a swap disk as a repository for segments of memory that\
    \ are paged out from physical RAM. Linux will use swap very intelligently even\
    \ when sufficient physical memory is available. When too many things are running\
    \ at once and the demand for memory exceeds the size of physical memory, excessive\
    \ paging will likely take place, eventually impacting system performance. The\
    \ Linux default is to set the size of the swap disk to twice the size of physical\
    \ RAM installed in the server.\n\nLinux stores information about devices used\
    \ for system paging and swapping activities in a file called /proc/swaps. To display\
    \ information regarding swap devices, the file can be displayed using either the\
    \ cat command or the swapon command with the -s option.\nAs shown below, the results\
    \ are the same using either method.\n\n| # cat /proc/swaps | | | | | |\n| Filename\
    \ | Type Size Used Priority |\n| /dev/sda2 | partition 524152 0 -1 |\n| # swapon\
    \ -s | | | | | |\n| Filename | Type Size Used Priority |\n| /dev/hdf2 | partition\
    \ 524152 0 -1 |\n\nHere we see the device name, type, size and amount used for\
    \ each swap device. In this case we only have the one swap device.\n\n## Kernel\
    \ Parameters\n\nLinux is a parameter driven system. Kernel parameters used for\
    \ system configuration are found in /proc/sys/kernel, where there is an individual\
    \ file for each configuration parameter. Since these parameters have a direct\
    \ effect on system performance, root access is required in order to modify them.\n\
    \nYou can view the current configuration parameters by using the cat command on\
    \ the appropriate file.\n\n```\n# cat msgmax\n8192\n```\n\nOccasionally, a prerequisite\
    \ to a software installation requires the modification of kernel parameters. Since\
    \ each parameter file contains a single line of data consisting of either a text\
    \ string or numeric values, it is often easy to modify a parameter by simply using\
    \ the echo command.\n\n```\n# echo 2048 > /proc/sys/kernel/msgmax\n```\n\nThe\
    \ aforementioned command will set the value of the msgmax parameter to 2048. This\
    \ change will only remain in effect until the system is rebooted.\n\nLinux also\
    \ provides the sysctl command to modify kernel parameters at runtime. sysctl uses\
    \ parameter information stored in a file called /etc/sysctl.conf. If, for example\
    \ we needed to change the value of msgmax, we could accomplish the same with the\
    \ sysctl command:\n\n```\n# sysctl -w kernel.msgmax=2048\n```\n\nThe next section\
    \ will introduce some useful utilities:\n\n## Server monitoring commands\n\nSome\
    \ popular commands for monitoring resources are as follows:\n\n- top: Provides\
    \ a real-time view of a running system. This can be one of the most useful ways\
    \ to monitor the system.\n- mpstat: Reports statistics for each available processor.\
    \ This is also one of the few commands which\n- iostat: Used for monitoring the\
    \ load on devices by observing the time the devices are active.\n- vmstat: Displays\
    \ information about processes, memory, paging, block IO and different levels of\
    \ CPU\n\n## Interactive Statistics using the top\n\nThe top program provides a\
    \ dynamic view of a running system. It shows several statistics on the same page.\
    \ For more information on the top utility refer to chapter 8.\n\n## Displaying\
    \ Multi-Processor Statistics\n\nThe mpstat command displays statistics for each\
    \ and every processor. the mpstat command accepts interval (delay) and count values.\
    \ mpstat will repeat the output every interval. This is very useful for monitoring\
    \ changes over time.\n\nThe following example uses an interval of three seconds\
    \ and a count of five iterations of the report. An average summary line is produced\
    \ at the end.\n\n```\n$ mpstat 3 5\nLinux 5.6.0-72-generic (x86_64) 10/26/2024\n\
    \ CPU  user  nice  system  iowait  %irq  %idle  intr/s\n  pm all   1.00   0.00\
    \   0.33   0.00   0.00  98.67 1001.99\n  pm all   0.71   0.00   0.33   0.00  \
    \ 0.00  99.33 1007.02\n  pm all   0.67   0.00   0.33   0.00   0.00  99.00 1002.67\n\
    \  pm all   0.66   0.00   0.33   0.00   0.00  99.00 1003.33\nAverage  0.67   0.00\
    \   0.33   0.00   0.00  99.00 1003.53\n```\n\nThe columns in the report generated\
    \ by the mpstat command are defined as follows:\n\n- CPU: The processor number\
    \ or the keyword all, which indicates that statistics are calculated as averages\
    \ among all processors or that there is only one processor in the server.\n- User:\
    \ The percentage of CPU used by user applications.\n- Nice: The percentage of\
    \ CPU utilization at the user level with nice priority.\n- System: The percentage\
    \ of CPU used by the system. This does not include the time spent servicing interrupts\
    \ or softirqs.\n- Wait: The percentage of time the system had a pending disk I/O\
    \ request.\n"
