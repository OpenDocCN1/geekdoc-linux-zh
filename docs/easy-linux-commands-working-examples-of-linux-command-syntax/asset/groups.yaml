    ## Permissions on Directories


    The read, write and execute permissions apply slightly differently to directories
    than they do to files. The read permission on a directory controls the ability
    to list the contents of that directory. In this example we''ll create a directory
    and place a blank file in it. We''ll then modify the permissions on the directory
    so the owner cannot see the contents.


    ```

    $ mkdir secret_dir

    $ touch secret_dir/my_secret.txt

    $ ls secret_dir/

    my_secret.txt

    $ chmod u-r secret_dir/

    $ ls secret_dir/

    ls: secret_dir/: Permission denied

    $ cd secret_dir/

    $ ls

    ls: Permission denied

    $ cd ../../

    ```


    We see that we get a Permission denied error when trying to view the contents
    of the directory when the read permission has been revoked. Despite not being
    able to see what is in the directory we can still change our working directory
    to that directory.


    The write permission on a directory behaves somewhat as expected. If a user has
    write on a directory they can create or remove files from that directory even
    if they are not the owner of the files. This is important to note as giving a
    user, group or other users write on a directory with other user''s files in it
    will allow them to delete other users files.


    Now we''ll give read permissions back to the owner and revoke the execute permission:


    ```

    $ chmod u+r secret_dir/

    $ chmod u-x secret_dir/

    ```


    ## Changing File Permissions


    ```

    $ ls secret_dir/

    my_secret.txt

    $ cd secret_dir/

    -bash: cd: secret_dir/: Permission denied

    ```


    We can now view the contents of the directory again but look at what happened
    when we tried to cd into it! Not having the execute permission on a directory
    will prevent you from changing into that directory even though you can view the
    contents. It is understandable how this can cause some confusion.


    ## Setting Default Permissions Using a File Mask


    By default, Linux permissions for new directories are typically set to 755 allowing
    read, write, and execute permissions to user and only read and execute to group
    and other users. Conversely, file permissions default to 644 allowing read and
    write access to user but only read to group and others. These defaults are controlled
    by the user file-creation mask or umask.


    A user or administrator may want to change the Linux default permissions by using
    the umask command in a login script. The umask command can be used without specifying
    any arguments to determine what the current default permissions are. The value
    displayed by umask must be subtracted from the defaults of 777 for directories
    and 666 for files to determine the current defaults. A typical umask which will
    generate the permissions listed in the previous paragraph will be 0022. The first
    digit pertains to the sticky bit which will be explained further later in this
    section.


    - -S option can be used to see the current default permissions displayed in the
    alpha symbolic format. Default permissions can be changed by specifying the mode
    argument to umask within the user''s shell profile (.bash_profile) script.


    The following are some examples.


    ## Using umask to Set Default Permissions


    ```

    $ umask

    0022


    $ umask -S

    u=rwx,g=rx,o=rx


    $ umask 033


    $ umask

    0033


    $ umask -S

    u=rwx,g=r,o=r

    ```


    The default umask will cause users to create files which any user read. In many
    instances where you have a multi-user system this is not desirable and a more
    appropriate umask may be 077. That umask will enforce the default permissions
    to be read, write and execute for the owner and no permissions for the group and
    other users.


    ## Special modes


    There are a few special permission mode settings that are worthy of noting. Table
    6.3 below contains a few of these special settings.


    | Mode | Description |

    | Sticky bit | Used for shared directories to prevent users from renaming or deleting
    others'' files. The only users who can rename or delete files in directories with
    the sticky bit set are the file owner, the directory owner, or the super-user
    (root). The sticky bit is represented by the t in the last position of the other
    permissions display. |

    | SUID | Set user ID, on executable files to allow the executable to be run as
    the file owner of the executable rather than the user logged into the system.
    SUID can also be used on a directory to change the ownership of files created
    in or moved to directory to be owned by the directory owner rather than the user
    who created it. |

    | SGID | Set group ID, used on executable files to allow the file-to be run as
    if logged into the group (like SUID uses file group permissions). SGID can also
    be used on a directory so that every file created in that directory will have
    the directory group owner rather than the group user creating the file. |


    ### Table 6.3: Special permission mode settings and their descriptions


    The following example displays the SUID permission mode that is set on the password
    command, indicated by the letter s in the last position of the user permission
    display. Users would like to be able to change their own passwords instead of
    having to ask the System Administrator to do it for them. Since changing a password
    involves updating the /etc/passwd file which is owned by root and protected from
    modification by any other user, the passwd command must be executed as the root
    user.


    The which command will be used to find the full path name for the passwd command,
    then the attributes of the passwd command will be listed, showing the SUID permission(s).


    ```

    $ which passwd

    /usr/bin/passwd

    $ ls -l /usr/bin/passwd

    -r-s--xr-x 1 root  root       17700 Jun 25 /usr/bin/passwd

    ```


    Here we see not only that the SUID permissions are set up on the password command
    but also that the command is owned by the root user. These two factors tell us
    that the passwd command will run with the permissions of root regardless of who
    executes it.


    These special modes can be very helpful on multi-user systems. To set or unset
    the sticky bit by use the t option with the chmod command. When setting the sticky
    bit we do not have to specify if it is for user, group or other. In the following
    example we will make a directory called public which anyone can write to but we''ll
    use the sticky bit to make sure only the file owners can remove their own files.


    ```

    $ mkdir public

    $ chmod 777 public

    $ chmod +t public

    $ ls -l

    total 4

    drwxrxrwt  2 tclark authors  4096 Sep 14 10:45 public

    ```


    We see that the last character of the permissions string has a t indicating the
    sticky bit has been set. We could also prefix the number 1 to the chmod command
    using the number to achieve the same results. The following chmod command will
    accomplish the same thing as the two chmod commands in the last example:


    ```

    $ chmod 1777 public

    $ ls -l

    total 4

    drwxrxrwt  2 tclark authors  4096 Sep 14 10:45 public

    ```


    Let''s say that instead we want to make a directory which other users can copy
    files but which we want the files to instantly become owned by our username and
    group. This is where the SUID and SGID options come in.


    ```

    $ mkdir drop_box

    $ chmod 777 drop_box

    $ chmod u+s,g+s drop_box

    $ ls -l

    total 4

    drwsr-x  2 tclark authors  4096 Sep 14 10:55 drop_box

    ```


    Now anyone can move files to this directory they will become owned by tclark and
    the group authors. This example also illustrates how you can change multiple levels
    of permissions with a single command by separating them with comma. Just like
    the other permissions this could have been simplified into one command using the
    SUID and SGID numeric values (4 and 2 respectively.) Since we are changing both
    in this case we use 6 as the first value for the chmod command.


    ```

    $ chmod 6777 drop_box/

    $ ls -l

    total 4

    drwsrwx   2 oracle users    4096 Sep 14 10:55 drop_box

    ```


    ## ACLs – Access Control Lists


    Under certain circumstances you may find that controlling permissions on an owner/group
    level are not sufficient. Perhaps you may want to grant one other user the ability
    to read a file or may you need to share write permissions with several other groups
    instead of just one.


    Some versions and configurations support ACLs or Access Control Lists to allow
    for this finer granularity of access control to files and directories. With ACLs
    you can assign very specific permissions to other users who don''t share a group
    with.


    Typically a file will not have an ACL. If an ACL has been added to a file you
    will see a + after the permissions string in an ls -l listing.


    ACLs are very powerful but they are not typically necessary and support for them
    is sporadic we will not delve into them in this book. If you want to get more
    information about ACLs a acl, the setfacl command and the getfac command.


    ## Logging on to another Group


    Every Linux user can be assigned to multiple groups so they can obtain access
    to whatever files and directories they need to perform their work. Users can determine
    the groups to which they have access by the id command.

