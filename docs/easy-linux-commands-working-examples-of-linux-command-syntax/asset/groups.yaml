    ## 我是谁？


    有时检查我们当前以什么身份登录是有帮助的。为了做到这一点，我们使用 `whoami` 命令。


    ```

    $ whoami

    terry

    ```


    如你所见，`whoami` 命令仅返回我们当前登录身份的用户名。当我们开始切换用户时（将在下一节所示），这变得价值无量。


    ## 切换到另一个用户


    通常需要从一个用户身份切换到另一个。例如，管理员可能想要从普通用户登录切换到 root 登录以便设置新的目录结构。在这个示例中，用户的普通用户 ID 是 terry。与其注销
    terry 然后重新登录 root，使用 `su` (substitute user) 命令可以方便这种切换。


    ```

    $ whoami

    terry

    $ su

    Password: rootpassword

    # whoami

    root

    # exit

    $ whoami

    terry

    ```


    在这里我们使用 `whoami` 命令显示我们当前以 terry 身份登录，然后使用 `su` 命令临时变为 root。当我们完成 root 的工作后，我们输入
    `exit` 退出 root 的 shell 并变回 terry。你可能注意到提示符从 `$` 变成了 `#`。这并不总是成立的，但这是一个很好的提示：如果你的提示符是
    `#`，说明你可能正在以 root 身份运行。


    与其他命令一样，`su` 命令有许多可用选项，但最有用的之一是 `-` 选项。该选项本质上是以指定的用户及其指定的配置文件将用户登录到一个新的 shell。另一个有用的选项是
    `-c` 选项，它允许已登录的用户以指定用户的身份运行单个命令。如果不使用 `-` 选项，切换用户时将保持当前配置，环境变量（如用于查找可执行文件的 path）将保持不变。


    除非你以 root 身份登录，否则在尝试切换用户时系统会要求密码。作为 root，你可以随意使用 `su` 并假冒系统上任何用户的身份。这是你不希望任何人都拥有
    root 密码的另一个原因。


    ## 总结


    在本章中，我们涵盖了一些实用的基础管理命令，包括执行以下操作的命令：


    - 如果可用，则使用 `sudo` 以 root 用户身份执行命令

    - 关或重启 Linux 服务器

    - 查看并更改当前的运行级别

    - 添加和删除用户

    - 获取运行中进程的信息，包括最活跃的进程

    - 杀死进程，一个一个杀死或通过模式匹配

    - 显示当前登录用户的信息

    - 检查我们以什么用户身份运行

    - 成为另一个用户（包括 root），以便以其他权限运行命令


    这些功能中的许多必须以 root 用户身份执行。由于 root 用户拥有广泛的访问权限，其密码必须被严格保护。


    好了，这一章的内容可多了！在下一章中，重点将转向某些详细介绍 Linux 服务器硬件配置的命令。


