    firstname=$S1

    lastname=$S2


    echo ""

    echo "Hello $1"

    echo "You are logged in as: $USER on server: $HOSTNAME"

    echo "Your home directory is: $HOME"

    echo "Thank you, $firstname $lastname for invoking the $S0 command"

