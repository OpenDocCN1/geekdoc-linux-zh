    \ commands, top can be started with a number of different options. The most commonly\
    \ used option when logged in root is the -u option to limit the active process\
    \ to a particular user.\n\n```\n$ -u Terry\ntop -23:20:22 up 5:11, 2 users, load:\
    \ 0.33, 0.17, 0.06\nTasks: 79 total, 2 running, 77 sleeping, 0 stopped, 0 zombie\n\
    cpu:(18.8% user, 4.2% system, 0.0 nic, 77.0% id)\nMem: 25565k total, 240748k free,\
    \ 24772 buffers\nSwap: 50608k, 0k used, 50608k free, 97696 cached\n\nPID USER\
    \ VIRT RES SHR SMEM %CPU MEM TIME Command\n21462 Terry 0 12460 128 b332 2.4 4.9\
