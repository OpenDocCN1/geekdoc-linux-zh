    # Conventions Used in this Book


    It is critical for any technical publication to follow rigorous standards and
    employ consistent punctuation conventions to make the text easy to read.


    However, this is not an easy task. Within Linux there are many types of notation
    that can confuse a reader. It is also important to remember that many Linux commands
    are case sensitive, and are always left in their original executable form, and
    never altered with italics or capitalization.


    **Parameters** - All Linux commands, arguments and parameters will be bold.


    **Variables** - All program variables and arguments will also remain in italics.


    **Command Line Sessions** - Command line sessions will be represented in a grey
    box. Commands which the user would type are in bold and script output remains
    un-bolded. The dollar ($) and pound (#) at the beginning of a command typically
    represent a prompt and should not be typed unless presented in bold.


    **Programs & Products** - All products and programs that are known to the author
    are capitalized according to the vendor specifications (IBM, DBXray, etc). All
    names known by Rampant TechPress to be trademark names appear in this text as
    initial caps. References to UNIX are always made in uppercase.


    # Acknowledgements


    This type of highly technical reference book requires the dedicated efforts of
    many people. Even though we are the authors, our work ends when we deliver the
    content. After each chapter is delivered, several Linux experts carefully review
    and correct the technical content. After the technical review, experienced copy
    editors polish the grammar and syntax.


    The finished work is reviewed as page proofs and turned over to the production
    manager, who arranges the creation of the online code depot and manages the cover
    art, printing distribution, and warehousing.


    In short, the authors play a small role in the development of this book, and we
    need to thank and acknowledge everyone who helped bring this book to fruition:


    - Janet Burleston, for her production management, including the coordination of
    the cover art, page proofing, printing, and distribution.

    - Robin Haden, for her help in the production of the page proofs.

    - John Lavender, for his assistance with the web site, and for creating the code
    depot and the online shopping cart for this book.

    - Jennifer Adkins, for her help with sales and distribution.


    Thanks to all the people at Rampant who were involved in the process of completing
    this book. It could never have happened this way without you.


    Many thanks,


    Jon Emmons & Terry Clark


    # Preface


    In the past decade Linux has gained a strong foothold in both the server and desktop
    market. While many common Linux tasks can now be done through a graphical interface,
    if you use Linux frequently sooner or later there will be a time when the graphical
    interface will not work or you need to do something remotely and can only get
    a command-line connection. When that happens it''s handy to have a quick reference
    around. This book is that reference.


    Linux was once the exclusive domain of alpha-geeks who thought nothing of compiling
    their own operating system. However, over the past decade Linux has become a viable,
    even prominent operating system for everything from large clustered computers
    to desktops to DVD video players. There are almost as many different distributions
    of Linux as there are and each has its own intricacies. Since distributions are
    actively developed by loosely knit groups of developers it is impossible to touch
    on all the features and intricacies of every distribution. The commands in this
    book will work in most distributions but the documentation for your distribution
    should be considered the definitive source for more specific information.


    As your comfort with the Linux command line you will find that some things are
    easier to do on the command line than they are in a graphical interface. Additionally
    it is easy to combined Linux commands into shell scripts to perform multiple complex
    tasks with a single script saving you time and reducing the chances that you forget
    or mis-type part of the command.


    While mastery of the Linux environment can only come with experience and time
    by including the most popular commands and options in this book we hope to ease
    the learning curve while providing a reference which will help users at all levels
    of experience.


    Well, if you''re ready, let''s get started.

