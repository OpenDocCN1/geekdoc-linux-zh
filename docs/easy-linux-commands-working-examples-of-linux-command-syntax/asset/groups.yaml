    The most important thing to remember is that a crontab will execute every time
    all of its conditions are met. To take the last entry as an example, any time
    it is 00 minutes past the hour of 12 on any day of the month and any month of
    the year and the day of the week is between Monday and Friday inclusive (1-5)
    this crontab will be executed.


    You will use wildcards in most crontab entries but be careful where you use them.
    For instance, if we mistakenly placed a * in the minute position of the last crontab
