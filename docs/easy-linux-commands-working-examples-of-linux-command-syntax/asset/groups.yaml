    # Linux Command Summary


    The following is a fairly comprehensive list of commands available in the Red
    Hat distribution of Linux. A brief description of each command is presented in
    Table 8.7 below. Some of the commands have been presented in greater detail in
    previous chapters.


    Rather than spend a great deal of time discussing each command in detail and giving
    examples of each, the commands are presented here only to give you an idea of
    what is available. If you find a command here that might be useful in the development
    of a script, you can learn more about it with the **man** or **info** tools. Many
    of the following descriptions come directly from the Linux **man** pages.


    | Command | Description |

    | --- | --- |

    | ac | ac prints out a report of connect time, in hours, based on the logins/logouts
    file. A total is also printed alias with no arguments or with the -p option prints
    the list of aliases in the form alias name=value on standard output. When arguments
    are supplied, an alias is defined for each name whose value is given. A trailing
    space in value causes the next word to be checked for alias substitution when
    the alias is expanded. For each name in the argument list for which no value is
    supplied, the name and value of the alias is printed. alias returns true unless
    a name is given for which no alias has |'
