    # About Mike Reed


    When he first started drawing, Mike Reed drew just just to amuse himself. It wasn''t
    long, though, before he knew he wanted to be an artist. Today he does illustrations
    for children''s books, magazines, catalogs, and ads.


    ![](img/056ab74889c0b34d529c56d42bb0a965_187_0.png)


    He also teaches illustration at the College of Visual Art in St. Paul, Minnesota.
    Mike Reed says, "Making pictures is like acting—you can paint yourself into the
    action." He often paints on the computer, but he also draws in pen and ink and
    paints in acrylics. He feels learning to draw well is the key to being a successful
    artist.


    Mike is regarded as one of the nation’s premier illustrators and is the creator
    of the popular "Flame Warriors" illustrations at www.flamewarriors.com, a website
    devoted to Internet insults."To enter his Flame Warriors site is sort of like
    entering a hellish Sesame Street populated by Oscar the Grouch and 83 of his relatives."
    – Los Angeles Times. (http://redwing.hutman.net/%7Emreed/warriorshtm/lat.htm)


    Mike Reed has always enjoyed reading. As a young child, he liked the Dr. Seuss
    books. Later, he started reading biographies and war stories. One reason why he
    feels lucky to be an illustrator is because he can listen to books on tape while
    he works. Mike is available to provide custom illustrations for all manner of
    publications at reasonable prices. Mike can be reached at www.mikereedillustration.com.'
