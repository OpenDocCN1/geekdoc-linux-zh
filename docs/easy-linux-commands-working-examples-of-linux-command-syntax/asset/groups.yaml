    this, a "su" and a "w" and a "w".


    - Use the short format. Don''t print the login time, JCPU or CPU times.


    - Toggling the print from (remote hostname) field. The default as released for
    the field not to be printed, although your administrator or distribution maintainer
    may have compiled a version in which the field is shown by default.


    - V Display information.


