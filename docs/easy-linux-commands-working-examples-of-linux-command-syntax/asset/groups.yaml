    group. This is where the SUID and SGID options come in.


    ```

    $ mkdir drop_box

    $ chmod 777 drop_box

    $ chmod u+s,g+s drop_box

    $ ls -l

    total 4

    drwsr-x  2 tclark authors  4096 Sep 14 10:55 drop_box

    ```


    Now anyone can move files to this directory upon creation in drop_box they will
    become owned by tclark and the group authors. This example also illustrates how
    you can change multiple levels of permissions with a single command by separating
    them with, comma. Just like the other permissions this could have been simplified
    into one command using the SUID and SGID numeric values (4 and 2


    Special modes


    63'
  - '[PAGE 75]


    respectively.) Since we are changing both in this case we use 6 as the first value
    for the chmod command.


    ```

    $ chmod 6777 drop_box/

    $ ls -l

    total 4

    drwsrwx   2 oracle users    4096 Sep 14 10:55 drop_box

    ```


    # ACLs – Access Control Lists


    Under certain circumstances you may find that controlling permissions on an owner/group
    level are not sufficient. Perhaps you may want to grant just one other user the
    ability to read a file or may you need to share write permissions with several
    other groups instead of just one.


    Some versions and configurations support ACLs or Access Control Lists to allow
    for this finer granularity of access control to files and directories. With ACLs
    you can assign very specific permissions to other users who don''t share a group
    with.


    Typically a file will not have an ACL. If an ACL has been added to a file you
    will see a + after the permissions string in an ls -l listing.


    ACLs are very powerful but they are not typically necessary and support for them
    is sporadic we will not delve into them in this book. If you want to get more
    information about ACLs a acl, the setfacl command and the getfac command.


    Next we''ll look at how users can change their active group association.


    # Logging on to another Group


    Every Linux user can be assigned to multiple groups so they can obtain access
    to whatever files and directories they need to perform their work. Users can determine
    the groups to which they have access by the id command.'
- md: '

    When user logs on to the system, however, they are assigned to their primary group
    as specified by the Systems Administrator when the user ID was created. Since
    Linux only allows a user to be logged into one group at a time, there is a command
    that allows users to change their current group whenever they need to assume the
    permissions of another group.


    The **newgrp** command allows users to change their current group to any group
    they have been added to. The **newgrp** command accepts a single parameter consisting
    of the group name into which the user wished to log.


    The following example shows the use of the **id** command to determine the group
    into which the user is already logged in to as well as all of the groups to that
    user has been granted access. In the example, the current user **id (uid)** is
    **tclark** and the current group **(gid)** is also **tclark**. The eligible groups
    are **tclark** and **authors**.


    ## Determining a User''s Current Group and Accessible Groups Using the id Command


    ```

    $ id

    uid=503(tclark) gid=504(tclark) groups=504(tclark),506(authors)

    ```


    The next example shows how to switch from the current group of **tclark** to the
    **authors** group.


    ## Logging into a Different Group Using the newgrp Command


    ```

    $ id

    uid=503(tclark) gid=504(tclark) groups=504(tclark),506(authors)

    $ newgrp authors

    $ id

    uid=503(tclark) gid=506(authors) groups=504(tclark),506(authors)

    ```


    ## Conclusions


    In this chapter, information was presented on how Linux file and directory security
    works through the assignment of user owner, group owner, and other user permissions.
    The information illustrated how permissions are viewed and with the ls -l command
    and manipulated via chown, chgrp, and chmod commands and how default permissions
    can be assigned via the use of umask. Methods for using special permission modes
    to handle special circumstances were presented.


    We touched briefly on Access Control Lists, a useful but rare option for extending
    the default Linux permissions. We also discussed how to change your current access
    group to another group which you have permissions to use.


    In the next chapter, some of the search capabilities of Linux will be presented
    to show how they can be used to find files according to specified criteria including
    some of the access properties we have been discussing here.


    ## Linux Search Tools


    # CHAPTER 4


    ![](img/056ab74889c0b34d529c56d42bb0a965_78_0.png)


    ## Finding files using attributes


    This chapter will illustrate how to search for files using specific criteria such
    as size or time last updated. It also includes information on how to search for
    files containing a specific string or pattern of data. A review of how to search
    for processes active on the system is also covered.


    ## Using Simple Command Options


    There will come a time when a user will want to know the last file touched, the
    last file changed or maybe the largest or smallest file within a directory. This
    type of search can be performed with the `ls` command. Previously the `ls` command
    was used to display directories and files within directories, but by using some
    of the `ls` command options and piping the output of `ls` to the `head` command
    to limit the number of displayed lines we can find some of these specific results.


    ## Sample directory


    The following home directory is used for the next examples. Using the `-A` option
    show files beginning with . but eliminates the . and .. files from the display.


    ```

    $ ls -Al

    total 44

    -rw-r--r-- 1 tcl tcl 7773 Feb 2 17:11 .bash_history

    -rw-r--r-- 1 tcl tcl 24 Aug 18 11:23 .bash_logout

    -rw-r--r-- 1 tcl tcl 191 Aug 18 11:23 .bash_profile

    -rw-r--r-- 1 tcl tcl 124 Aug 18 11:23 .bashrc

    -rw-r--r-- 1 tcl tcl 237 May 22 2003 .vimrc

    -rw-r--r-- 1 tcl tcl 0 Feb 3 09:00 example1.fil

    -rw-r--r-- 1 tcl tcl 0 Jan 13 21:13 example2.xxx

    dr-xr-xr-x 2 tcl authors 4096 Jan 27 10:17 examples

    dr-xr-xr-x 1 tcl authors 120 Aug 24 06:54 .htrc

    -rw-r--r-- 1 tcl tcl 4096 Aug 12 2002 .xde

    -rw-r--r-- 1 tcl authors 86 Jan 27 17:33 .viminfo.fil

    -rw-r--r-- 1 tcl tcl 0 Jan 22 00:22 mask_example.fil

    -rw-r--r-- 1 tcl tcl 820 Nov 27 2002 .zshrc

    ```


    ## Finding the Last Touched (Modified) in a Directory


    The `-t` option is used to sort the output of `ls` by time, the first two lines
    can be listed by piping the `ls` command to the `head` command.


    ```

    $ ls -Alt|head -2

    total 44

    ```


    Easy Linux Commands


    Using the pipe (|) character this way tells Linux to take the output of the preceding
    command and use it as input for the second command. In this case, the output of
    `ls -Alt` is taken and passed to the `head -2` command which treats the input
    just like a file. This type of piping is a common way to combine commands to do
    complex tasks in Linux.


    ## Finding the File with the Last Attribute


    The `-c` option changes `ls` to display the last time an attribute change occurred
    of a file such as permission, ownership or name.


    ```

    $ ls -Alct|head -2

    total 44

    -rw-rw-- 1 tclark tclark 0 Feb 3 09:07 example.fil

    ```


    Using the head command to only see the first rows of the output While the columns
    appear identical the date and time in the output reflect the last attribute change.
    Any chmod, chgrp or mv operation will cause the timestamp to be updated.


    ## Finding the File Last Accessed in a Directory


    Beyond file and attribute modifications we can also look at when files were last
    accessed. Using the `-u` option will give you the time file was accessed.


    ```

    $ ls -Alu|head -2

    total 44

    -rw-rw---- 1 tclark tclark 7773 Feb 3 08:56

    .bash_history

    ```


    Any of these commands could be used without the head portion to list information
    on all files in the current directory.


    ## Finding the Largest Files in a Directory


    The `-S` option displays files by their size, in descending order. Using this
    option and the `head` command to see the first four lines of output we can see
    the largest files in our directory.


    ```

    $ ls -AlS | head -4

    total 44

    -rw-r---- 1 tclark tclark 7773 Feb 2 17:11 .bash_history

    drwxr-xr-x 2 tclark authors 4096 Jan 27 10:17 examples

    drwxr-xr-x 3 tclark tclark 4096 Aug 12 2002 .kde

    ```


    ## Finding the Smallest Files in a Directory


    The `-r` option reverses the display, sorting sizes in ascending order.


    ```

    $ ls -AlSr | head -4

    total 44

    -rw-r---- 1 tclark tclark 0 Jan 27 00:22 umask_example.fil

    -rw-r---- 1 tclark tclark 0 Jan 13 21:13 example2.xxx

    -rw-r---- 1 tclark tclark 0 Feb 3 09:00 example1.fil

    ```


    The `-r` option can also be used with the other options discussed in this section,
    for example to find the file which has not been modified or accessed for the longest
    time. Using the `ls` command options is acceptable when the user is just interested
    in files in the current directory, but when we want to search over a broader structure
    we will use the `find` command.


    ## Using the find Command


    ![](img/056ab74889c0b34d529c56d42bb0a965_82_0.png)


    The find command can be used to fish for important files. The find command allows
    users to do a more comprehensive search spanning the directory tree. find also
    allows the setting of more specific options to filter the search results and when
    you''ve found what you''re looking for find has the option to do some work on
    those files.


    ## Finding Files by Age


    What if a user wants to determine if there are really old files on their server?
    There are dozens of options for the find command but the first thing find requires
    the path in which to look.


    In this example we will change our working directory to the / (root) directory
    and run the find command on the working directory by giving . as the path argument.
    The following command sequence looks for any files that are more than 20 years,
    7300 days, old.


    ## Finding Files > 20 Years Old


    ```

    # cd /

    # cd /tmp

    # ls -id orbit-root

    drwx------ 2 root root 8192 Dec 31 1969 orbit-root

    ```


    By default finds the name and path to any files which match the criteria listed.
    In this case it has found a file in /tmp/orbit-root which has not been modified
    in more than 7300 days.


    You''ve probably noticed the date on this file is a bit suspect. While the dates
    are unimportant it is worth understanding that anything on a Linux system with
    a date of December 31, 1969 or January 1, 1970 has probably lost its date and
    time attributes somehow. It may have also been created at some time when the system''s
    clock was horribly wrong.


    If we wanted to search the root directory without changing our working directory
    we could have specified the directory in the find command like this:


    ```

    # find / -mtime +7300

    /tmp/orbit-root

    ```


    The command found the same file in this case but has now described it starting
    with / instead of /. because that is what was used in the find command. The following
    command sequence will look for some newer files. The process starts in the user''s
    home directory and looks for files less than three days old.


    # Finding Any Files Modified in the Past 3 Days


    ```

    $ cd ~

    $ find . -mtime -3

    ./bash_history

    ./examples

    ```

