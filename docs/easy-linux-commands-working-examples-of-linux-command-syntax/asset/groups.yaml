    | 3913 | ? | 00:00:00 | bbrun |

    | 4444 | ? | 00:00:00 | bbrun |


    ## 结论


    在本章中，我们演示了如何使用 `ls` 命令根据特定标准（如大小或时间）搜索文件。然后深入研究了 `find` 命令，并看到它可以如何用于查找文件的多个不同属性。


    我们还提供了如何搜索包含特定字符串或数据模式文件的示例。本章以回顾用户搜索系统中活跃的特定进程的方法作为结束。


    在下一章中，我们将学习如何解锁 `vi` 文本编辑某些功能。


