  mdcn: "\n在比较字符串时，我们还有更多可以测试的内容。表 8.5 包含了字符串测试及其描述。\n\n| 测试 | 描述 |\n| :--- | :---\
    \ |\n| != | 字符串不等 |\n| = | 字符串相等 |\n| - | 为字符串的长度 |\n| -n | 字符串长度不为零 |\n| -z |\
    \ 字符串长度为零 |\n\n# 表 8.5: 字符串测试与描述\n\n以下示例说明了字符串测试的一种用法。\n\n```bash\nif [ -n \"\"\
    \ ]\nthen\n    echo \" The string contains characters\"\nelse\n    echo \" The\
    \ string is empty \"\nfi\n```\n\n字符串为空\n\n```bash\nif [ -n \"ABC 123\" ]\nthen\n\
    \    echo \" The string contains characters\"\nelse\n    echo \" The string is\
    \ empty \"\nfi\n```\n\n字符串包含字符\n\n这些简单测试条件中的任何一个都可以单独评估，也可以与其他条件组合以评估复杂的表达式。表\
    \ 8.6 包含了测试的连接符及其描述。\n\n| 连接符 | 描述 |\n| :--- | :--- |\n| ! | 表达式为假 |\n| -a | 表达式1\
    \ 和表达式2 均为真（逻辑与） |\n| -o | 表达式1 或表达式2 其中一个为真（逻辑或） |\n\n# 表 8.6: 连接符及其描述\n\n以下是我们如何使用或连接符来检查两个独立条件的：\n\
    \n```bash\n$ a=\"abc\"\n$ b=\"abc\"\n$ if [ \"$a\" = \"xyz\" -o \"$a\" = \"$b\"\
    \ ]\n> then\n> echo \"One of the conditions is true\"\n> else\n> echo \"Neither\
    \ condition is true\"\n> fi\n\n$ a=\"abc\"\n$ b=\"xyz\"\n$ if [ \"$a\" = \"xyz\"\
    \ -o \"$a\" = \"$b\" ]\n> then\n> echo \"One of the conditions is true\"\n> else\n\
    > echo \"Neither condition is true\"\n> fi\n\n两个条件都不真\n```\n\n复杂条件可以评估多个因素，并对系统或\
    \ shell 脚本上的特定条件做出反应。接下来我们将这些条件如何在循环中使用以重复操作。\n\n# 循环\n\n循环提供了一种重复执行命令的方法，直到满足条件。bash\
    \ shell 提供了几种循环方法，但我们将重点关注 for 循环和 while 循环。\n\n# for 循环\n\nfor 循环执行 `do` 和 `done`\
    \ 语句之间的命令，直到传递给它的值列表中所有值都被处理完毕。这里是 for 循环的一个简单示例：\n\n```bash\n$ animals=\"dog\
    \ cat mouse\"\n$ for animal in $animals\n> do\n> echo $animal\n> done\ndog\n```\n\
    \n正如我们看到的，我们不需要告诉 for 循环重复多少次。它只需接收输入并根据变量 `$animals` 中独立项目的数量进行重复。很容易看到我们可能如何使用它来解析用户提供的文件名列表。\n\
    \n# while 循环\n\n当给定的条件为真（true）时，while 循环会执行 `do` 和 `done` 语句之间的命令。while 循环必须包含某些最终会导致条件变为假的内容，否则将会发生无限循环，命令将永远执行。以下是\
    \ while 循环的一个用法示例：\n\n```bash\n$ a=2\n$ i=1\n$ while [ $i -le 20 ]\n> do\n  >\
    \ echo \"$a $i = $(expr $i \\* $a)\"\n  > i=$(expr $i + 1)\n> done\n* 1 = 2\n\
    * 2 = 4\n* 3 = 6\n* 4 = 8\n* 5 = 10\n* 6 = 12\n* 7 = 14\n* 8 = 16\n* 9 = 18\n\
    * 10 = 20\n* 11 = 22\n* 12 = 24\n* 13 = 26\n* 14 = 28\n* 15 = 30\n* 16 = 32\n\
    * 17 = 34\n* 18 = 36\n* 19 = 38\n* 20 = 40\n```\n\n不同的循环适用于不同的情况。编写不当的循环可能会无限执行，并可能填满你的硬盘、占用所有的处理器或导致你的可用内存耗尽。注意无限循环！\n\
    \n# case 语句\n\n与其嵌套许多 `if-then-else` 或 `if-then-elif-then` 语句，另一种替代方案是使用 `case`\
    \ 语句。`case` 语句允许用户根据与字符串变量相关的值执行一组不同的命令。\n\n以下示例展示了你在 shell 脚本中可能会看到的 `case` 语句用法：\n\
    \n```bash\necho -n \" What type of pet do you have (dog, cat, etc.) ?\"\nread\
    \ pet\necho \"\"\ncase $pet in\ndog)    echo \" So you have a dog ...\"\n    \
    \           echo \"That's nice, so do.\"\n               echo \" My name is Fido.\"\
    ;\ncat)    echo \"So you have a cat ...\"\n               echo \"I'm allergic\
    \ to cats!\";\nfish)   echo \"So you have fish ...\"\n               echo \"Can't\
    \ take them for a walk .. ha, ha.\";\nferret)  echo \" Ferrets are cool!\"\n*)\
    \      echo \"I don't know that pet.\" \nesac\n```\n\n（注：由于原文后续存在大量重复的段落，根据注意事项“不要重复输出原文”，此处仅翻译核心内容部分。）\n"
