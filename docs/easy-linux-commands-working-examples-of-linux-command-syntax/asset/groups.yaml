    for the bash shell, within the home directory. To do this you can use a text editor
    like vi to add the following line to .bash_profile file:


    **Note:** Files that begin with a period will not appear when you list the contents
    of a directory. To see these hidden files use the command ls -a


    There are even more options which you can put into your PS1 prompt. While it''s
    nice to keep your prompt fairly short you may find some of the other options useful.
    Table 4.1 contains a list of values that can be displayed with the PS1 and/or
    PS2 prompt strings:


    | Symbol | Displayed Value |

    | \ | History number of current command |

    | # | Command number of current command |

    | d | Current date |

    | h | Host name |

    | \n | Newline |

    | \s | Shell name |

    | \t | Current time |

    | \u | User name |

    | \W | Current working directory |

    | \w | Current working directory (full path) |


    **Table 4.1:** PS1 prompt string values


    # Creating New Directories


    The **mkdir** (make directory) command is used to create a new directory. The
    directory to be created can be referenced via an absolute path or via a relative
    path starting with the current working directory.


    +   - Make a directory using an absolute path:


    ```

    $ 1s

