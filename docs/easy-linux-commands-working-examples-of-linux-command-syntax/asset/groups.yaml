    # 为什么要使用 shell 脚本？


    由于 shell 能够从称为脚本的文件读取命令，因此使用 vi 这样的基础文本编辑器构建脚本来简化经常执行的任务并自动化这些任务的执行就成了一项简单任务。


    将简单或复杂的动作编程到 shell 脚本中，可以简化 Linux 环境内重复的管理和维护功能。


    # 开始使用简单的 shell 脚本


    shell 脚本的执行方式就像你坐在键盘前输入命令一样。正因如此，我们将直接在命令行演示 shell 脚本的许多功能。在命令行测试后，这些命令可以移动到 shell
    脚本中。这是一个简单的 shell 脚本示例：


    为什么要使用 shell 脚本？


