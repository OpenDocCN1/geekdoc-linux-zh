    5AM.


    We''ve talked an awful lot about how to specify the date and time in the crontab
    but what about the command? Well, most folks will write shell scripts to execute
    with their crontab entries but you can actually just execute a command from the
    crontab as well. Either way sure you put the absolute path to your command in
    the crontab.


    If the command or script you call in crontab typically sends output to the screen
    you will probably want to redirect that output to a log file with the >> symbol
    so you can check it later. Be careful with this as the log files may get rather
    large over time!


    # Conclusions


    In this chapter, we covered how to schedule commands and shell scripts to run
    at certain times of day, on certain days of the week, or days of the month, etc.
    This allows the automation of processes that need to be run repetitively on a
    fixed schedule.


    With careful setup and scheduling you will find you can automate most repetitive
    tasks with a combination of shell scripting and the use of cron. This can save
    you hours a day on a large or complex system!


    Now we''ll look at some Linux administration commands which can be used to setup
    and maintain the overall system.'
