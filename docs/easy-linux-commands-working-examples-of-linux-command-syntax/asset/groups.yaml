    ## 剪切、复制和粘贴文本


    之前介绍的任何文本删除命令都与 Windows 的剪切功能类似，因为它们会将删除的文本置于缓冲区区域，以便以后可能检索。在 Windows 中，该缓冲区被称为剪贴板。


    在 vi 中，有一个未命默认缓冲区和 26 个引用缓冲区，每个缓冲区由字母表中的一个字母（a, b, c, d 等）标识。为了引用其中一个具名缓冲区，需要在缓冲区标识符字符前加一个双引号。因此，“a”引用缓冲区
    a，“b”引用缓冲区 b，以此此类推。


    当使用其中一个删除命令时，文本会从文档中剪切并放入默认缓冲区。要从默认缓冲区中检索文本，可以使用大写的 P 命令将默认缓冲区粘贴到当前光标行之前，或者使用小写的
    p 命令将缓冲区的内容粘贴到当前行之后。因此，执行 5dd 命令后移动光标，将剪切五行文本并将它们放在光标移动到的行之前。


    除了剪切或删除文本外，还可以使用 yank 命令从文件中复制文本。yank 命令提供了将文本复制到其中一个具名缓冲区的选项。其中 yy 将当前行复制到未命名的默认缓冲区（unnamed），而
    "cyy 则将当前行复制到缓冲区 c。


    在没有插入粘贴命令的情况下，向同一个缓冲区发送多次 yank 命令将导致覆盖。换句话说，用户无法先将第五行 yank 到缓冲区 a，然后将第七行 yank
    到缓冲区 a，并期望在某处同时粘贴第五行和第七行。当用户 yank  第五行时，它按要求被放在缓冲区 a 中，但当随后执行将第七行 yank 到缓冲区 a
    的命令时，第七行将覆盖缓冲区中的第五行。这就是提供多个具名缓冲区用于多次连续 yank 的原因之一。表 9.6 显示了复制和粘贴命令及其操作。


