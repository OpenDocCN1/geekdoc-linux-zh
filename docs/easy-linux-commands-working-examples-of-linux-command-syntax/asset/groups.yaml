  - '[PAGE 152]


    Once you are in top you just need to type q to quit and return to the command
    line.


    Here we see the default top output. There''s a lot here, but here are a few of
    the highlights. Some of this will be familiar from the ps output.


    | top output field | Description |

    | --- | --- |

    | up | How long this system has been running. May be in days |

    | users | Number of connected users |

    | load average | Number of processes currently running plus the number waiting
    to run one, five and fifteen minutes*. |

    | Tasks (or processes) | The total number of active processes |

    | CPU | How the CPU is currently being used |

    | user | The percent of CPU consumed by user processes |

    | system | The percent of CPU consumed by system processes |

    | idle | The percent of CPU not currently being used |

    | iowait (not shown) | The percent of CPU spent waiting for data (typically disk)
    |

    | Mem | Memory usage information |

    | total | The total amount of memory in this system |

    | used | Memory used in the system |

    | free | Unused |

    | Swap | Information about disk being used as memory |

    | total | Total amount of disk assigned for use as memory |

    | used | Swap currently in use |

    | free | Unused swap |

    | PID | Process ID of this process |

    | USER | Username of the process owner |

    | %CPU | Percent of CPU being used by this process |

    | %MEM | Percent of total memory being used by this process |

    | TIME | Total CPU time consumed by this process |

    | Command | The command which was executed (truncated)


    * The calculation is more complicated than this, but this simple explanation will
    suffice for now. Generally a system with a load average lower than its number
    of CPUs is keeping up with its work. One with a load average of one to two times
    its number of CPUs is starting to fall behind and things aren''t getting done
    as quickly as they are coming in, but a load average of several times the number
    of CPUs typically indicates the system is bogged down. Of course your experience
    is the best indicator of system performance.


    The one, five and fifteen minute load averages are useful for identifying the
    trend of the system. If the one minute load average is


