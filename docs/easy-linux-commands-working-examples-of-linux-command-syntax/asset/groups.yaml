    Well that''s about viewing files, next we''ll look at couple operations which
    may come in.


    # Creating a Symbolic Link to a File


    Sometimes it''s handy to make a file alias as if it is in two places at once.
    Perhaps you frequently use a file or folder which is buried away some location
    or maybe you are working on a project and you want to get the same file in your
    home directory. In these cases symbolic links can make your life easier.


    The ln (link) command can be used to create a symbolic link of a file into another
    location. In the example we are making a symbolic link in the working directory
    will allow us to access the file for /var/app/common/parms/app1.par.


    ```

    $ ln -s /var/app/common/parms/app1.par ./

    ```


    The ln command creates a symbolic link (sometimes called a soft link) from the
    source file, /var/apps/common/parms/app1.par, to a file with the same name, app1.par,
    in the current working directory.


    The destination file name need not be coded because it is the same as the source
    file. It''s important to keep track of which of these files is the original. Frankly
    the ls -l command will indicate a file is a symbolic link in two ways.


    ```

    $ ls -l appl.par

    lrwxrxr-x 1 tclark authors   2229 Jan 13 21:35 appl.par -> /var/apps/common/parms/appl.par

    ```


    The first indication we get that this is a symbolic link is the first letter of
    the line describing this file is l. We can also see that ls has indicated the
    location of the original file after the file name.


    Symbolic links can be edited just like the original file and the permissions of
    the original file determine who can edit the symbolic link. Symbolic links can
    also be removed with the rm command without affecting the original file. If the
    original file is removed the link will fail to work.


    Directories can be linked with a symbolic link. This can often be useful to make
    a directory appear as if it is somewhere it is not.


    Now we''ll talk briefly about moving files and directories between machines with
    the scp command.


    # Remote file copy


    The scp (secure copy) command can be used to copy files or even directories to
    a remote host. scp is a replacement for the rcp (remote copy) command. While rcp
    provides the same functionality it is not encrypted and therefore secure. The
    scp command uses SSH for data transfer, providing SSH level security.


    scp takes arguments in the form of scp -options source destination. The most common
    option is the -r (recursive) option which is necessary if you are using scp on
    multiple files or on directories. The source and destination arguments can specify
    not only a path but optionally a username and hostname in the format of username@hostname:path.
    If the username is omitted scp assumes the username of the current logged in user.
    If the hostname is omitted scp assumes the path provided is on the current system.
    Typically either the source or the destination will describe a remote system;
    however you could use scp to move a file or files from one remote system to another.


    The following example copies the file secret.dat from user tclark''s home directory
    to a directory named /backup/tclark on a server named backup_server logging in
    as user terry. As indicated below, the scp command will prompt for the password
    for user terry on the backup_server when the connection is attempted.


    ```

    $ scp /home/tclark/secret.dat terry@backup_server:/backup/tclark

    terry@backup_server''s password: password

    secret.dat 100 1011 27.6KB/s 00:00

    ```

