    ## 使用文件掩码设置默认权限


    默认情况下，Linux 为新目录设置的 权限通常被设置为 755，允许用户具有读、写和执行权限，而组和其他用户仅具有读和执行权限。相反，文件权限默认为 644，允许用户具有读取和写入权限，而组和其他用户仅具有读取权限。这些默认值由用户文件创建掩码或
    `umask` 控制。


    用户或管理员可能想通过登录脚本中的 `umask` 命令来更改 Linux 默认权限。使用 `umask` 命令时可以指定任何参数，即可确定当前的默认权限。`umask`
    显示的值必须从目录的默认 777 和文件的默认 666 中减去，以确定当前的默认值。生成上一段列出的权限的典型 `umask` 为 0022。第一个数字涉及粘滞位（sticky
    bit），我们将在本节稍后部分详细解释。


    -   可以使用 `-S` 选项以字母符号格式显示当前显示的默认权限。可以通过在用户的 shell 配置文件（`.bash_profile`）脚本中为 `umask`
    指定模式参数来更改默认权限。


    以下是一些示例。


    ## 使用 umask 设置默认权限


    ```

    $ umask

    0022


    $ umask -S

    u=rwx,g=rx,o=rx


    $ umask 033


    $ umask

    0033


    $ umask -S

    u=rwx,g=r,o=r

    ```


    默认的 `umask` 将导致用户创建任何用户都可以读取的文件。在许多多用户系统中，这是不理想的，更合适的 `umask` 可能是 077。该 `umask`
    将强制默认权限为所有者具有读、写和执行权限，而组和其他用户没有权限。


