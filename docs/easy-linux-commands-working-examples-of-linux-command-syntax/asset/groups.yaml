    \ kill 命令后没有终止，新的 kill 命令将如下：\n\n```\n$ kill -9 2609\n```\n\n虽然 kill 命令通常对所有用户可用，但你只能杀死你自己的进程。要杀死其他用户的进程，你需要\
    \ root 权限。\n\n# 使用模式杀死进程\n\n与其扫描进程 ID (PID) 数字，不如通过在命令名中搜索模式来杀死进程或进程组更加简单。`pkill`\
    \ 命令是实现此目标的方法之一，如下所示。pkill 匹配进程的方式与 pgrep 相同。使用 pkill 时要非常小心，因为你很容易杀掉比你想要的更多的进程！\n\
    \n我们想要杀死所有名为 xscreen 的进程。首先，我们使用 pgrep 确保返回了合理数量的 PID，然后使用 pkill 杀死进程。\n\n```\n\
    $ pgrep xscreen\n2609\n$ pkill xscreen\n```\n\n# 杀死特定用户的所有进程\n\npkill 命令还识别 -u\
    \ 选项来只查看特定用户的进程。通过在 pkill 命令中添加 -u 选项，可以终止指定用户的所有进程。例如，如果用户 terry 输入了以下命令，terry\
    \ 的所有活跃进程将被取消，并会被踢出系统。\n\n```\npkill -9 -u terry\n```\n\n![](img/056ab74889c0b34d529c56d42bb0a965_156_0.png)\n\
    \n由于你有能力杀死任何用户的进程，这将停止他们所做一切的快速方法。不过要小心，这样做可能不会让你交到任何朋友，如果你懂我的意思的话。\n\n到目前为止我们主要讨论了两个用户，root\
    \ 和你（在大多数示例中是 terry），但我们的 Linux 系统可能还有更多人。接下来我们将查看谁登录了系统。\n\n# 登录用户信息\n\n要快速统计系统中有多少用户登录，我们可以使用\
    \ `uptime` 命令。\n\n```\n$ uptime 2:41:39 up 2 users, load average: 0.00, 0.00,\
    \ 0.00\n```\n\n在这里我们还看到了一些其他实用的信息，例如当前系统时间、自上次启动以来的时间以及负载\n"
