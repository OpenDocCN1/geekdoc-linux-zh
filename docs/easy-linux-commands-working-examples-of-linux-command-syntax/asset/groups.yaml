    | /etc/lilo.conf | The lilo boot loader configuration file |

    | /etc/modules.conf | Holds options for configurable modules |

    | /etc/motd | This is the "message of the day" file which is printed upon login
    |

    | /etc/mtab | Status information for currently mounted devices and partitions
    |

    | /etc/passwd | Contains information regarding registered users. Passwords are
