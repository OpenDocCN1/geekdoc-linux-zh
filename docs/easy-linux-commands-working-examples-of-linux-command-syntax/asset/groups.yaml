    ## 删除文本


    vi 编辑器提供了删除或替换单个字符、单个或多个单词、单行或多行文本的命令。表 9.4 显示了一些常用的删除和替换命令及其操作。请记住，你需要在命令模式下使用这些命令。


    | 命令 | 操作 |

    |---|---|

    | x | 删除一个文本字符 |

    | r | 使用输入的下一个字符替换文本字符 |

    | dw | 删除整个单词（3dw 删除 3 个单词） |

    | dd | 删除整行（3dd 删除 3 行） |

    | D | 从光标删除到行尾 |

    | s | 删除当前字符后切换到插入模式 |

    | cw | 删除整个单词并切换到插入模式 |

    | C | 从光标位置删除到行尾（并切换到插入模式） |


    表 9.4: 删除或替换文本的命令


    ## 搜索文本字符串


    vi 编辑器允许用户在文件中向前（向下）或向后（向上）搜索文本字符串。它还提供了重复搜索的快捷键。在编写 shell 脚本时，一个实用的功能是搜索匹配的括号、中括号和大括号。表
    9.5 显示了一些搜索命令及其相关操作。


    | 命令 | 操作 |

    |---|---|

    | /text | 在文件中向前搜索文本 |

    | ?text | 在文件中向后（向上）搜索文本 |

    | % | 当光标位于括号、中括号或大括号上时，按下 % 键可以将光标移动到与之匹配的起始或结束字符 |


