    two lines can be listed by piping the `ls` command to the `head` command.


    ```

    $ ls -Alt|head -2

    total 44

    ```


    Easy Linux Commands


    68'
  - '[PAGE 80]


    Using the pipe (|) character in this way tells Linux to take the output of the
    command preceding the pipe and use it as input for the second command. In this
    case, the output of ls -Alt is taken and passed to the head -2 command which treats
    the input just like it would be a text file. This type of piping is a common way
    to combine commands to do complex tasks in Linux.


    # Finding the File with the Last Attribute Change


    The -c option changes ls to display the last time there was an attribute change
    of a file such as a permission, ownership or name change.


    ```

    $ ls -Alct|head -2

    total 44

    -rw-rw-- 1 tclark tclark 0 Feb 3 09:07 example.fil

    ```


    We are using the head command to only see the first two rows of the output. While
    the columns for this form of the ls command appear identical the date and time
    in the output now reflect the last attribute change. Any chmod, chown, chgrp or
    mv operation will cause the attribute timestamp to be updated.


    # Finding the File Last Accessed in a Directory


    Beyond file and attribute modifications we can also look at when files were last
    accessed. Using the -u option will give you the time the file was used or accessed.


    ```

    $ ls -Alu|head -2

    total 44

    -rw-rw---- 1 tclark tclark 7773 Feb 3 08:56

    .bash history

    ```


    Any of these ls commands could be used without the |head portion to list information
    on all files in the current directory.'
  - '[PAGE 81]


    # # Finding the Largest Files in a Directory


    The **-S** option displays files by their size, in descending order. Using this
    option and the **head** command this time to see the first four lines of output
    we can see the largest files in our directory.


    ```

    $ ls -AlS | head -4

    total 44

    --rw-r--r-- 1 clark clark 7773 Feb 2 17:11 .bash_history

    drwxr-xr-x 2 clark authors 4096 Jan 27 10:17 examples

    drwxr-xr-x 3 clark clark 4096 Aug 12 2002 .kde

    ```


    # # Finding the Smallest Files in a Directory


    Adding the **-r** option reverses the display, sorting sizes in ascending order.


    ```

    $ ls -AlSr | head -4

    total 44

    --rw-r--r-- 1 clark clark 0 Jan 27 00:22 umask_example.fil

    --rw-rw-r-- 1 clark clark 0 Jan 13 21:13 example2.xxx

    --rw-rw-r-- 1 clark clark 0 Feb 3 09:00 example1.fil

    ```


    The **-r** option can also be used with the other options discussed in this section,
    for example to find the file which has not been modified or accessed for the longest
    time.


    Using of the **ls** command options is acceptable when the user is just interested
    in files in the current working directory, but when we want to search over a broader
    structure we will use the **find** command.'
  - '[PAGE 82]


    # Using the find Command


    ![](img/056ab74889c0b34d529c56d42bb0a965_82_0.png)


    The find command can be used to fish for important files.


    The find command allows users to do a more comprehensive search spanning the directory
    tree. find also allows the setting of more specific options to filter the search
    results and when you''ve found what you''re looking for find even has the option
    to do some work on those files.


    # Finding Files by Age


    What if a user wants to determine if there are any really old files on their server?
    There are dozens of options for the find command but the first thing find requires
    the path in which to look.


    In this example we will change our working directory to the / (root) directory
    and run the find command on the working directory by giving . as the path argument.
    The following command sequence looks for any files that are more than 20 years,
    7300 days, old.'
  - '[PAGE 83]


    # Finding Files > 20 Years Old


    ```

    # cd /

    # cd /tmp

    # ls -id orbit-root

    drwx------ 2 root root 8192 Dec 31 1969 orbit-root

    ```


    By default finds the name and path to any files which match the criteria listed.
    In this case it has found a file in /.tmp/orbit-root which has not been modified
    in more than 7300 days.


    You''ve probably noticed the date on this file is a bit suspect. While the dates
    are unimportant it is worth understanding that anything on a Linux system with
    a date of December 31, 1969 or January 1, 1970 has probably lost its date and
    time attributes somehow. It may have also been created at some time when the system''s
    clock was horribly wrong.


    If we wanted to search the root directory without changing our working directory
    we could have specified the directory in the find command like this:


    ```

    # find / -mtime +7300

    /tmp/orbit-root

    ```


    The command found the same file in this case but has now described it starting
    with / instead of /. because that is what was used in the find command.


    The following command sequence will look for some newer files. The process starts
    in the user''s home directory and looks for files less than three days old.


    # Finding Any Files Modified in the Past 3 Days


    ```

    $ cd ~

    $ find . -mtime -3

    ./bash_history

    ./examples

    ```'
- md: "\n```\n./.examples/preamble.txt\n./examples/other.txt\n./examples/1.fil\n./.viminfo\n\
    ```\n\nNow we start to really see the power of the find command. It has identified\
    \ files not in the working directory but in a subdirectory as well! Let's verify\
    \ the findings with some ls commands:\n\n```\n$ ls -alt\ntotal 56\ndrwxr-xr-x\
    \ 2 tclark authors 4096 Feb 3 17:45 examples\n--rw-r--r-- 1 tclark 8793 Feb 3\
    \ 14:04\n.bash_history 4 tclark 4096 Feb 3 11:17\n--rw-r--r-- 1 tclark 1066 Feb\
    \ 3 11:17 .viminfo\n--rw-r--r-- 1 tclark 0 Feb 3 09:00 example.fil\n--rw-r--r--\
    \ 1 tclark 0 Jan 27 00:22 umask_example.fil\ndrwxr-xr-x 8 root 4096 Jan 25 22:16\n\
    --rw-r--r-- 1 tclark 0 Jan 13 21:13 example2.xxx\n--rw-r--r-- 1 tclark 120 Aug\
    \ 24 06:44 .ggtkrc\n--rw-r--r-- 1 tclark 24 Aug 18 11:23 .bash_logout\n--rw-r--r--\
    \ 1 tclark 191 Aug 18 11:23 .bash_profile\n--rw-r--r-- 1 tclark 124 Aug 18 11:23\
    \ .bashrc\n--rw------- 1 tclark 237 May 27 2003 .emacs\n--rw------- 1 tclark 220\
    \ Nov 27 2002 .zshrc\ndrwxr-xr-x 3 tclark 4096 Aug 12 2002 .kde\n$ cd examples\n\
    $ ls -alt\ntotal 20\ndrwxr-xr-x 2 tclark authors 4096 Feb 3 17:45\n--rw-r--r--\
    \ 1 tclark 0 Feb 3 17:45 other.txt\n--rw-r--r-- 1 tclark authors 360 Feb 3 17:44\
    \ preamble.txt\ndrwxr-xr-x 4 tclark 4096 Feb 3 11:17\n--rw-r--r-- 1 tclark authors\
    \ 2229 Jan 13 21:35 declaration.txt\n--rw-r--r-- 1 tclark presidents 1310 Jan\
    \ 13 17:48 gettysburg.txt\n```\n\nNow we see that find has turned up what we were\
    \ looking for. Now we will refine our search even further.\n\n## Finding .txt\
    \ Files Modified in the Past 3 Days\n\nSometimes we are only concerned with specific\
    \ files in the directory. For example, you wrote a text file sometime in the past\
    \ days and you can't remember what it was called or where you put it. Here's Finding\
    \ by Age one way you could find that text file without having to go through your\
    \ entire system:\n\n```\n$ find -name '*.txt' -mtime -3\n./preamble.txt\n./other.txt\n\
    ```\n\nNow you've got even fewer files in the last search and you could easily\
    \ identify the one you're looking for.\n\n## Find files by size\n\nIf a user is\
    \ running short of disk space, they may want to find some large files and compress\
    \ them to recover space. The following will search from the current directory\
    \ and find all files larger than 10,000KB. The output has been abbreviated to\
    \ save trees and ink.\n\n## Finding Files Larger than 10,000k\n\n```\n$ find -size\
    \ +10000k\n./proc/kcore\n./var/lib/rpm/Packages\n./var/lib/rpm/Filemd5s\n/home/stage/REPCA/REPCA/wireless/USData.xml\n\
    /home/stage/REPCA/REPCA/wireless/completebootstrap.xml\n/home/stage/REPCA/REPCA/wireless/bootstrap.xml\n\
    /home/bbcl_9e-btf/BBOUT.OLD\n```\n\nSimilarly a -+ could be used in this example\
    \ to find all files smaller than 10,000KB - Of course there would be quite a few\
    \ of them on a Linux system.\n\nThe find command is quite flexible and accepts\
    \ numerous options. We have only covered a couple of the options here but if you\
    \ want to check out more of them take a look at find's man page.\n\nMost of find's\
    \ options can be combined to find files which meet several criteria. To do this\
    \ we can continue to find criteria like we did when finding .txt files which had\
    \ been modified in the past three days.\n\n## Doing things with what we find\n\
    \nThe -exec option gives find the powerful ability to execute commands on the\
    \ files found. The syntax is a little tricky but an example is usually all it\
    \ takes to get it right.\n\nBefore using the -exec option, especially with a powerful\
    \ command like rm -I I recommend performing the same find without the -exec. By\
    \ doing this you will see exactly which files will be affected when you run the\
    \ final command. The following is a practical example that finds files less than\
    \ three days old with the .txt extension and deletes them.\n\n```\n$ find -name\
    \ '*.txt' -mtime -3 -exec rm {} \\;\n$ ls -lt\ntotal 8\n--rw-r--r-- 1 tclark authors\
    \ 2229 Jan 13 21:35 declaration.txt\n--rw-r--r-- 1 tclark presidents 1310 Jan\
    \ 13 17:48 gettysburg.txt\n```\n\nThe -exec option allows you to put any command\
    \ after it. Here we have used rm but it is often useful to use this with cp or\
    \ chmod. Within the command to run there must be two brackets {}; find will execute\
    \ each file it finds substituting the file name (path). Finally the end of the\
    \ -exec option is signaled by a semicolon (;). The -exec option should always\
    \ be the last option given in find. The find command is great for finding files\
    \ and directories but next we'll look at some options for finding other things.\n\
    \n## Dealing with \"Permission denied\"\n\nIf you use find a lot (and probably\
    \ will) you will sometimes run into the problem where there are certain directories\
    \ you don't have permissions to search. This can make it very difficult to find\
    \ the useful output of find as it can be mixed with errors like this:\n\n```\n\
    $ find -name '*.txt'\nfind: /var/lib/dav: Permission denied\nfind: /var/lib/nfs:\
    \ Permission denied\nfind: /var/lib/dhcp: Permission denied\nfind: /var/lib/slocate:\
    \ Permission denied\nfind: /var/lib/php: Permission denied\nfind: /var/log/samba:\
    \ Permission denied\nfind: /var/log/ppt: Permission denied\nfind: /var/log/audit:\
    \ Permission denied\nfind: /var/log/squid: Permission denied\n```\n\nTo ignore\
    \ these (and any other) errors and just get the results find we can use a special\
    \ redirect at the end of the command. Redirecting output will be covered in more\
    \ detail in the chapter on shell scripting, but suffice to say that in this command\
    \ 2>/dev/null is redirecting the error output to nowhere.\n\n```\n$ find -name\
    \ '*.txt' 2>/dev/null\n/var/www/icons/small/README.txt\n/usr/X11R6/lib/X11/rgb.txt\n\
    /usr/X11R6/lib/X11/doc/FAQ.txt\n/usr/lib/tests/xml/count.txt\n```\n\nWhile it\
    \ would not be a good idea to redirect the error output all the time (usually\
    \ you would want to know when something has gone wrong) in this case the find\
    \ command can be very useful.\n\n## Finding a String within a Text File\n\nThe\
    \ **grep** command can be used to check a file for a specific string. If **grep**\
    \ finds string it will print the line it found on the screen. Here's an example:\n\
    \n```\n$ cd /etc\n$ grep localhost hosts\n127.0.0.1        localhost.localdomain\
    \    localhost\n```\n\nHere we checked the **hosts** file in the /etc directory\
    \ for the word **localhost**. It was found and **grep** printed the line it found.\
    \ **grep** can be very useful for searching through output for errors or anything\
    \ else which typically has a regular pattern.\n\n## Finding the Directory Path\
    \ for a Command\n\nThe commands we have been executing exist as files somewhere\
    \ on the system. The **which** command is used to find the full path of these\
    \ commands. The following examples will show how you can look for the directory\
    \ where some commonly used executables are found.\n\n## Find the Directory Path\
    \ for emacs and sort\n\n```\n$ which emacs\n/usr/bin/emacs\n$ which sort\n/bin/sort\n\
    ```\n\nThe **which** command takes a single argument of any command. We have shown\
    \ above the **which** command for **emacs** and **sort**. The result indicates\
    \ where the binary files for those commands exist on the filesystem.\n\n## Finding\
    \ the Location of Program Binary, Source, Manual Pages for emacs and sort\n\n\
    The whereis command can also be used to locate the binary file for commands. Additionally,\
    \ whereis locates the source file and manual page file the command.\n\n```\n$\
    \ whereis emacs\nemacs:/usr/bin/emacs /usr/libexec/emacs /usr/share/emacs\n/usr/share/man/man1/emacs.1.gz\n\
    $ whereis sort\nsort: /bin/sort /usr/share/man/man1/sort.1.gz\n/usr/share/man/man3/sort.3pm.gz\n\
    ```\n\n## Finding Strings in Binary Files\n\nIf a user encounters a binary file\
    \ and does not know what it is used for or where it came from, they may gain some\
    \ insight into its origins and use by searching for character strings within the\
    \ file. If the cat command is used to list a binary file, the user will see a\
    \ screen full of garbage that will more often than not change the display characteristics.\
    \ Instead, the strings command should be used, as demonstrated in the following\
    \ examples:\n\n# Find All Strings in the Binary File\n\n```\n$ strings echo\n\
    /lib/ld-linux.so.2\nibc.so.6\nstdout\ngetopt_long\n_fpending\ngetenv\n.... \n\
    Copyright (C) 2002 Free Software Foundation, Inc.\nThis is free software; see\
    \ the source for copying conditions. There is NO\nwawarranty; not even for MERCHANTABILITY\
    \ or FITNESS FOR A PARTICULAR PURPOSE.\n%s (%s) %s\nWritten by %s.\n%s %s\nmemory\
    \ exhausted\n```\n"
  mdcn: "\n\n```\n./.examples/preamble.txt\n./examples/other.txt\n./examples/1.fil\n\
    ./.viminfo\n```\n\n现在我们开始真正看到 `find` 命令的威力。它不仅识别了工作目录中的文件，还包含了子目录中的文件！让我们通过一些\
    \ `ls` 命令来验证结果：\n\n```\n$ ls -alt\ntotal 56\ndrwxr-xr-x 2 tclark authors 4096\
    \ Feb 3 17:45 examples\n--rw-r--r-- 1 tclark 8793 Feb 3 14:04\n.bash_history 4\
    \ tclark 4096 Feb 3 11:17\n--rw-r--r-- 1 tclark 1066 Feb 3 11:17 .viminfo\n--rw-r--r--\
    \ 1 tclark 0 Feb 3 09:00 example.fil\n--rw-r--r-- 1 tclark 0 Jan 27 00:22 umask_example.fil\n\
    drwxr-xr-x 8 root 4096 Jan 25 22:16\n--rw-r--r-- 1 tclark 0 Jan 13 21:13 example2.xxx\n\
    --rw-r--r-- 1 tclark 120 Aug 24 06:44 .ggtkrc\n--rw-r--r-- 1 tclark 24 Aug 18\
    \ 11:23 .bash_logout\n--rw-r--r-- 1 tclark 191 Aug 18 11:23 .bash_profile\n--rw-r--r--\
    \ 1 tclark 124 Aug 18 11:23 .bashrc\n--rw------- 1 tclark 237 May 27 2003 .emacs\n\
    --rw------- 1 tclark 220 Nov 27 2002 .zshrc\ndrwxr-xr-x 3 tclark 4096 Aug 12 2002\
    \ .kde\n$ cd examples\n$ ls -alt\ntotal 20\ndrwxr-xr-x 2 tclark authors 4096 Feb\
    \ 3 17:45\n--rw-r--r-- 1 tclark 0 Feb 3 17:45 other.txt\n--rw-r--r-- 1 tclark\
    \ authors 360 Feb 3 17:44 preamble.txt\ndrwxr-xr-x 4 tclark 4096 Feb 3 11:17\n\
    --rw-r--r-- 1 tclark authors 2229 Jan 13 21:35 declaration.txt\n--rw-r--r-- 1\
    \ tclark presidents 1310 Jan 13 17:48 gettysburg.txt\n```\n\n现在我们看到 `find` 找到了我们正在寻找的内容。现在我们将进一步完善搜索。\n\
    \n## 查找过去 3 天内修改过的 .txt 文件\n\n有时我们只关注目录中的某些特定文件。例如，你在过去几天里的某某时间写了一个文本文件，但不记得它叫什么名字或者放在了哪里。这里提供了一种“按时间查找”的方法，可以让你无需遍历整个系统就能找到该文本文件：\n\
    \n```\n$ find -name '*.txt' -mtime -3\n./preamble.txt\n./other.txt\n```\n\n现在你在上一次搜索中得到的文件更少了，可以轻松地识别出你想要的那个。\n\
    \n## 按大小查找文件\n\n如果用户磁盘空间不足，他们可能想要找到一些大文件并进行压缩以恢复空间。以下命令将从当前目录搜索所有大于 10000KB 的文件。为了节省树结构，输出已被缩略。\n\
    \n## 查找大于 10000k 的文件\n\n```\n$ find -size +10000k\n./proc/kcore\n./var/lib/rpm/Packages\n\
    ./var/lib/rpm/Filemds\n/home/stage/REPCA/wireless/USData.xml\n/home/stage/REPCA/wireless/complete.xml\n\
    /home/stage/REPCA/wireless/bootstrap.xml\n/home/bbcl_9e-btf/BBOUT.OLD\n```\n同样，在示例中使用\
    \ `-+` 可以查找所有小于 10000KB 的文件——在 Linux 系统上，会有很多这样的文件。\n`find` 命令非常灵活，接受许多选项。我们在这里只介绍了其中几个，但如果你想查看更多，请参考\
    \ `find` 的手册页（man page）。大多数 `find` 选项可以组合起来查找符合多个标准的文件。为了这样做，我们可以继续查找在过去三天内修改过的\
    \ `.txt` 文件。\n\n## 使用 find 执行操作\n\n`-exec` 选项赋予 `find` 对找到的文件执行命令的能力。语法有点复杂，但通常通过一个例子就能让你正确使用。在使用\
    \ `-exec` 选项之前（特别是配合 `rm` 这种强大的命令时），我建议执行不带 `-exec` 的命令。通过这种方式，你可以看到哪些文件会受到影响。以下是一个实用示例，查找旧三天的\
    \ `.txt` 扩展文件并将其删除：\n\n```\n$ find -name '*.txt' -mtime -3 -exec rm {} \\;\n$\
    \ ls -lt\ntotal 8\n--rw-r--r-- 1 tclark authors 2229 Jan 13 21:35 declaration.txt\n\
    --rw-r--r-- 1 tclark presidents 1310 Jan 13 17:48 gettysburg.txt\n```\n\n`-exec`\
    \ 选项允许你在其之后放置任何命令。在这里使用了 `rm`，但通常配合 `cp` 或 `chmod` 使用也非常有用。在命令内部，`{}` 会替换文件名（路径）。最后，`-exec`\
    \ 选项的结尾由分号 (`;`) 标记。`-exec` 选项应该是 `find` 给出的最后一个选项。`find` 命令对于查找文件和目录非常棒，接下来我们将查看查找其他内容的选项。\n\
    \n## 处理“权限拒绝”\n\n如果你经常使用 `find`（你可能会这样做），有时会遇到没有权限搜索某些目录的问题。这会让 `find` 的有用输出变得困难，因为它们与错误混合在一起：\n\
    \n```\n$ find -name '*.txt'\nfind: /var/lib/dav: Permission denied\nfind: /var/lib/nfs:\
    \ Permission denied\nfind: /var/lib/dhcp: Permission denied\nfind: /var/lib/slocate:\
    \ Permission denied\nfind: /var/lib/php: Permission denied\nfind: /var/log/samba:\
    \ Permission denied\nfind: /var/log/ppt: Permission denied\nfind: /var/log/audit:\
    \ Permission denied\nfind: /var/log/squid: Permission denied\n```\n\n为了忽略这些（以及其他）错误并只获取结果，我们可以在命令末尾使用特殊的重定向。重定向将在\
    \ Shell 脚本章节中详细介绍，但只需说在该命令中 `2>/dev/null` 是将错误输出重定向到空处。\n\n```\n$ find -name '*.txt'\
    \ 2>/dev/null\n/var/www/icons/small/README.txt\n/usr/X11R6/lib/X11/rgb.txt\n/usr/X11R6/lib/X11/doc/FAQ.txt\n\
    /usr/lib/tests/xml/count.txt\n```\n\n一直重定向错误输出并不是一个好主意（通常你想知道发生了什么错误），但在这种情况下，`find`\
    \ 命令可以非常有用。\n\n## 在文本文件中查找字符串\n\n`grep` 命令可以检查文件中是否包含特定字符串。如果 `grep` 找到了字符串，它将在屏幕上打印出该行。这里有一个示例：\n\
    \n```\n$ cd /etc\n$ grep localhost hosts\n127.0.0.1        localhost.localdomain\
    \    localhost\n```\n\n我们在 `/etc` 目录下的 `hosts` 文件中查找 `localhost` 单词。它找到了，`grep`\
    \ 打印了找到的行。`grep` 对于搜索输出中的错误或任何具有正则模式的内容都非常有用。\n\n## 查找命令的目录路径\n\n我们执行的命令以文件的形式存在系统的某处。`which`\
    \ 命令用于查找这些命令的完整路径。以下示例将显示你如何查找某些常用执行文件所在的目录。\n\n## 查找 emacs 和 sort 的目录路径\n\n```\n\
    $ which emacs\n/usr/bin/emacs\n$ which sort\n/bin/sort\n```\n\n`which` 命令接受任何命令的单一参数。我们在上面展示了\
    \ `emacs` 和 `sort` 的 `which` 命令。结果指示了这些命令的二进制文件存在于系统中。\n\n## 查找 emacs 和 sort 的二进制文件、源码和手册页\n\
    \n`whereis` 命令也可以用于定位命令的二进制文件。此外，`whereis` 还能定位源文件和手册页文件。\n\n```\n$ whereis emacs\n\
    emacs:/usr/bin/emacs /usr/libexec/emacs /usr/share/emacs\n/usr/share/man/man1/emacs.1.gz\n\
    $ whereis sort\nsort: /bin/sort /usr/share/man/man1/sort.1.gz\n/usr/share/man/man3pm.gz\n\
    ```\n\n## 在二进制文件中查找字符串\n\n如果用户遇到一个二进制文件并不知道它的用途或从哪里来，可以通过搜索文件中的字符字符串来获得对其起源和用途的洞察。如果使用\
    \ `cat` 命令列出二进制文件，用户将看到满屏幕的垃圾，通常会改变显示特性。相反，应该使用 `strings` 命令，如下例所示：\n\n# 查找二进制文件中所有的字符串\n\
    \n```\n$ strings echo\n/lib/ld-linux.so.2\nibc.so.6\nstdout\ngetopt_long\n_fpending\n\
    getenv\n.... \nCopyright (C) 2002 Free Software Foundation, Inc.\nThis is free\
    \ software; see the source for copying conditions. There is NO\nwarranty; not\
    \ even for MERCHANTABILITY or FITNESS FOR A PARTICULAR PURPOSE.\n%s (%s) %s\n\
    Written by %s.\n%s %s\nmemory exhausted\n```\n\n"
