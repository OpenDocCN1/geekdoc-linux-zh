    to last column.


    ## Who Am I?


    Sometimes it is useful to check who we are currently logged in as. To do that
    we use the whoami command.


    ```

    $ whoami

    terry

    ```


    As you can see, the whoami command just returns the username of who we''re logged
    in as. This becomes invaluable when we start switching users like we''ll see in
    the next section.


    ## Switch to a Different User


    It is often necessary to switch from one user identity to another. For instance,
    the administrator may want to switch from a regular user login to the root login
    in order to set up a new directory structure. In this example, the user''s regular
    user ID is terry. Instead of logging off as terry and then logging on as root,
    the su (substitute user) command facilitates an easy switch.


    ```

    $ whoami

    terry

    $ su

    Password: rootpassword

    # whoami

    root

    # exit

    $ whoami

    terry

    ```


    Here we use the whoami command to show that we''re currently logged in as terry,
    and then we use the su command to temporarily become root. When we''re done working
    as root we type exit to exit root''s shell and go back to being terry. You may
    also notice the prompt changed from a $ to a #. This may not always be the case,
    but it''s a good hint that if your prompt is a # you are probably running as root.


    As with other commands, the su command has a number of available options, but
    one of the most useful ones is the - option. This option essentially logs the
    user into a new shell as the specified user with the specified user''s profile.
    Another helpful option is the -c option which allows the user that is logged in
    to run a single command as the specified user. Without using the - option, the
    current profile is maintained when switching users and the environment variables,
    such as path for locating executables, remain unchanged.


    Unless you are logged in as root, the system will ask for a password when an attempt
    to switch users is made. As root you can su at will and assume the identity of
    any user on the system. This is another reason you don''t want just anybody having
    the root password.


    ## Conclusions


    In this chapter we covered some of the basic administration commands which are
    useful including commands to do the following:


    - Execute commands as the root user by using sudo if it is available

    - Shutdown or restart a Linux server

    - View and change the current runlevel

    - Add and remove users

    - Get information on running processes including the most active processes

    - Kill processes, one at a time or by matching patterns

    - Show information on currently logged in users

    - Check what user we''re running as

    - Become another user, including root, to run commands with other permissions


    Many of these functions must be done as the root user. Because of its broad access
    the root user''s password must be tightly protected.


    Well, that''s an awful lot for one chapter! In the next chapter, the focus will
    be diverted to some commands that detail with the hardware configuration of the
    Linux server.


    ## Monitoring Memory and Processor


    # CHAPTER 9


    ## Linux Hardware


    At times, the need will arise to determine some information about the hardware
    components on the Linux system or check some of the parameter settings that configure
    the operating system. Often, hardware and software configurations need to be investigated
    as prerequisites to adding a new application or piece of hardware.


    This chapter will introduce some of the basic commands used to investigate the
    configuration of a Linux server. We will also look into some commands used to
    evaluate the status of the system.


    It may also be necessary to determine the effects of adding new hardware or software
    to the server. Some examples of questions that might arise are:


    - What are the top resource consumers on the system?

    - Is the system I/O bound or CPU bound?

    - How did adding disk and distributing the data affect I/O throughput?

    - Did adding memory to the system improve memory performance?


    First let''s look at how to view the processor information in a Linux box.


    ## CPU Related Information


    Linux keeps information regarding the processor(s) in a server in a file called
    /proc/cpuinfo. The following are sample contents of the /proc/cpuinfo file from
    a basic Linux system:


    ```

    # cat /proc/cpuinfo

    processor      : 0

    vendor_id       : GenuineIntel

    cpu family      : 6

    model          : 5

    model name      : Pentium II (Deschutes)

    stepping       : 1

    cpu MHz         : 398.273

    cache size      : 512 KB

    fdivbug        : no

    hltbug          : no

    f00            : no

    ca             : yes

    fpu             : yes

    bogomips       : 794

    ```


    The important information here is the vendor, model, CPU speed and cache size
    of this. Other information, like whether it has a floating unit (fpu) may also
    be useful. The bogomips is a speed rating calculated during boot. If the server
    contained multiple processors, the information in this listing would be repeated.


    ## Display the Number of Processors in the Server


    If we want to know how many processors a system has we can just look to see how
    many entries there are in /proc/cpuinfo. If we wanted an easier way to check the
    number of processors we can use grep to check the file like this:


    Here we have output the /proc/cpuinfo with the cat command then used grep to eliminate
    all lines from the output which do not contain the string ''processor''. We then
    use wc -l to count the number of lines left. The count is 1 so we know the system
    only one processor.


