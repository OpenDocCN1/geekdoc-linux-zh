    Mike Reed 最初开始画画时，仅仅是为了取悦自己。但没多久，他就意识到自己想成为一名艺术家。如今，他为儿童书籍、杂志、目录和广告提供插画。


    ![](img/056ab74889c0b34d529c56d42bb0a965_187_0.png)


    他还在明尼苏达州圣保罗的视觉艺术教授插画。Mike Reed 说：“画画就像表演——你可以把自己画进动作中。”他经常在电脑上作画，但也用钢笔墨水画，并使用丙烯画。他认为学会画好画是成为成功艺术家的关键。


    Mike 被视为美国顶尖插画师之一，也是网站 www.flamewarriors.com 上流行的“火焰战士”（Flame Warriors）插画的作者，这是一个致力于网络侮辱的网站。“进入他的火焰战士网站就像是进入了一个地狱般的芝麻街，那里挤满了坏鬼奥斯卡和他的
    83 个亲戚。” – 洛杉矶时报。(http://redwing.hutman.net/%7Emreed/warriorshtm/lat.htm)


    Mike Reed 一直很喜欢阅读。小时候，他喜欢苏斯博士的书。后来，他开始阅读传记和战争故事。他觉得能成为插画师很幸运，原因之一是因为他工作时可以听磁带书。Mike
    可以以合理的价格为各种出版物提供定制插画。可以通过 www.mikereedillustration.com 联系 Mike。


