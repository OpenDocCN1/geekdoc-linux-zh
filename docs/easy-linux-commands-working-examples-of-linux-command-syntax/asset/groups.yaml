    Again, this book is written with the assumption that a GUI environment is not
    available, and that the user is limited to command line, but if you do a GUI available
    it may help you understand the directory structure.


    The tree command can be used to display the directory tree from the command line,
    but the displayed output can be rather cumbersome to decipher. By default, the
    tree command starts in the current working directory and creates a graphical display
    of all child directories and the files in each directory.


