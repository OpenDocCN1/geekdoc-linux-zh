- md: "\n# Conclusions\n\nWe covered a lot of ground in this chapter and you should\
    \ now feel comfortable navigating and manipulating the directory structure within\
    \ Linux.\n\nIn this chapter we first looked at how to examine the directories\
    \ and files in a file structure. We talked about how to tell what your current\
    \ working directory is and how you can include it in your prompt so you'll always\
    \ know where you are.\n\nWe then went on to see how to make, remove and rename\
    \ directories. We talked about moving between directories with the `cd` command\
    \ and how to view the contents of a directory.\n\nDelving into file manipulation\
    \ we looked at how to make empty files and how to update the timestamp on an existing\
    \ file. After seeing how easy it is to delete a file we showed how to make an\
    \ alias which will cause the `rm` command to prompt us before deleting files.\n\
    \nWe talked about several uses for archiving with the `tar` command and saw how\
    \ to create and extract tarfiles.\n\nWe saw how to view the contents of a file,\
    \ the beginning of a file, the end of a file and even how to combine files. We\
    \ even talked about using `tail -f` to view lines as they are being written to\
    \ a file.\n\nSymbolic links were discussed as a way to make files and directories\
    \ appear in more than one place as well as how to copy things from one system\
    \ to another.\n\nIn the next chapter, some important Linux directories will be\
    \ investigated in more detail and we will introduce some Linux files of which\
    \ users will need to be aware.\n\n# Important Files and Directories\n\nArmed with\
    \ knowledge about how to navigate the Linux directory tree and manipulate files,\
    \ we'll now look at some of the more important files within Linux. This chapter\
    \ will also provide information on how to identify some of the standard directories\
    \ created within the Linux directory architecture and where important files are\
    \ stored within the structure.\n\n# Home Directory\n\nEach Linux user is assigned\
    \ a home directory where they can keep files and build upon the structure by creating\
    \ their own directories. The user home directories are identified by the Linux\
    \ login user name and can usually be found under a parent directory called /home.\
    \ If the users on the server are sally, bill, joan, and fred, the home directory\
    \ structure would be like the one demonstrated below.\n\n```\n/home\n  /bill\n\
    \  /fred\n  /joan\n  /sally\n```\n\nWe mentioned earlier that every Linux system\
    \ has a root user but we do not see a home directory for root here. Since root\
    \ is a special user, root's home directory can be found by itself at /root.\n\n\
    # Hidden \"Dot\" Files\n\nThere are some files within the home directory that\
    \ are ordinarily hidden. Hidden files have names that begin with a period; hence,\
    \ they have been given the nickname of dot files. Hidden files are not displayed\
    \ by the ls command unless the -a option is used in the format of ls -a.\n\nTable\
    \ 5.1 below lists some of the more common dot files that users should know about.\
    \ This is by no means a totally comprehensive list. Additional dot files can be\
    \ found in the user's home directory; however, some searches may not find some\
    \ of the files listed here. The files found are dependent upon the applications\
    \ installed on the server, the utilities that are in use and the command shell\
    \ that is being used. Since the default shell for Linux is the bash shell, the\
    \ home directory contains the bash related scripts indicated below.\n\n| File\
    \ | Description |\n| :--- | :--- |\n| .bash_history | For users of the bash shell,\
    \ a file containing up to 500 of the most recent commands available for recall\
    \ using the up and down arrow keys. |\n| .bash_logout | Script that is run by\
    \ the bash shell when the user logs out of the system |\n| .bash_profile | Initialization\
    \ script that is run by the bash shell upon login in order to setup variables\
    \ and aliases. When bash is started as the default login shell, it looks for the\
    \ .bash_profile file in the user's home directory; if not found, it looks for\
    \ .bash_login. If there is no .bash_login file, it then looks for a .profile file.\
    \ |\n| .bashrc | Initialization script executed whenever the bash shell is started\
    \ in some way other than a login shell. It is better to put system-wide functions\
    \ and aliases in /etc/bashrc, which will be presented later in the book. |\n|\
    \ .gtkrc | GTK initialization file. GTK+ is a multi-platform toolkit for creating\
