    ```\n\n在上述用于显示最高内存用户的示例中，会显示所有进程，然后使用第 4 列的数值值进行升序排序（`sort` 默认按第一列排序，`+3` 告诉 `sort`\
    \ 向右看三列）。然后它会显示排序列表中的最后一个和最大的值。如果你想查看前五个内存或 CPU 用户，我们只需要将 `tail -1` 改为 `tail -5`，只需记住它们将按前五个名中从小到大的顺序进行排序。我们将在\
    \ Shell 脚本章节中详细讨论如何构建此类复杂命令。\n\n## 分页和交换设备\n\nLinux 使用交换磁盘作为从物理内存（RAM）中换出的内存段的存储库。即使在有足够的物理内存可用，Linux\
    \ 也会非常智能地使用交换。当同时运行过多程序且对内存的需求超过物理内存大一时，可能会发生过度分页，最终影响系统性能。Linux 的默认设置是将交换磁盘的大小设置为服务器上安装的物理内存大小的两倍。\n\
    \nLinux 将用于系统分页和交换活动的设备信息存储在名为名为 `/proc/swaps` 的文件中。要显示有关交换设备的信息，可以使用 `cat` 命令或带有\
    \ `-s` 选项的 `swapon` 命令显示该文件。\n如下所示，使用任种方法的结果都是相同的。\n\n| # cat /proc/swaps | |\
    \ | | | | |\n| Filename | Type Size Used Priority |\n| /dev/sda2 | partition 524152\
    \ 0 -1 |\n| # swapon -s | | | | | | |\n| Filename | Type Size Used Priority |\n\
    | /dev/hdf2 | partition 524152 0 -1 |\n\n在这里我们看到了每个交换设备的设备名称、类型、大小和使用量。在这种情况下，我们只有一个交换设备。\n\
    \n## 内核参数\n\nLinux 是一个参数驱动的系统。用于系统配置的内核参数位于 `/proc/sys/kernel` 中，其中每个配置参数都有一个单独的文件。由于这些参数对系统性能有直接影响，因此需要\
    \ root 权限来修改它们。\n\n你可以对适当的文件使用 `cat` 命令查看当前的配置参数。\n\n```\n# cat msgmax\n8192\n\
    ```\n\n偶尔，软件安装的先决条件需要修改内核参数。由于每个参数文件仅包含一行由文本字符串或数值组成的数据，通常可以简单地使用 `echo` 命令来修改参数。\n\
    \n```\n# echo 2048 > /proc/sys/kernel/msgmax\n```\n\n上述命令将 `msgmax` 参数的值设置为 2048。此更改仅在系统重启之前有效。\n\
    \nLinux 还提供了 `sysctl` 命令在运行时修改内核参数。`sysctl` 使用存储在 `/etc/sysctl.conf` 文件中的参数信息。例如，如果我们需要更改\
    \ `msgmax` 的值，可以通过 `sysctl` 命令实现：\n\n```\n# sysctl -w kernel.msgmax=2048\n```\n\
    \n下一节将介绍一些实用的工具：\n\n## 服务器监控命令\n\n一些常用的资源监控命令如下：\n\n- `top`: 提供运行系统的实时视图。这是监控系统最有效的方法之一。\n\
    - `mpstat`: 报告每个处理器的统计信息。这也是监控系统的少数有用命令之一。\n- `iostat`: 通过观察设备活动时间来监控设备负载。\n-\
    \ `vmstat`: 显示进程、内存、分页、块 IO 以及不同级别的 CPU 信息。\n\n## 使用 top 进行交互统计\n\n`top` 程序提供了运行系统的动态视图。它在同一页面显示多个统计信息。关于\
    \ `top` 工具的更多信息请参考第 8 章。\n\n## 显示多处理器统计\n\n`mpstat` 命令显示每个处理器的统计信息。mpstat 命令接受间隔（延迟）和计数值。mpstat\
    \ 将每隔间隔输出一次。这对于随时间的变化非常有用。\n\n以下示例使用了三秒间隔和五次迭代。报告最后会生成一条摘要行。\n\n```\n$ mpstat\
    \ 3 5\nLinux 5.6.0-72-generic (x86_64) 10/26/2024\n CPU  user  nice  system  iowait\
    \  %irq  %idle  intr/s\n  pm all   1.00   0.00   0.33   0.00   0.00  98.67 1001.99\n\
    \  pm all   0.71   0.00   0.33   0.00   0.00  99.33 1007.02\n  pm all   0.67 \
    \  0.00   0.33   0.00   0.00  99.00 1002.67\n  pm all   0.66   0.00   0.33   0.00\
    \   0.00  99.00 1003.33\nAverage  0.67   0.00   0.33   0.00   0.00  99.00 1003.53\n\
    ```\n\n`mpstat` 命令生成的报告列定义如下：\n\n- CPU: 处理器编号或关键字 `all`，表示统计数据是按所有处理器的平均值计算，或者服务器只有一个处理器。\n\
    - User: 用户应用程序使用的 CPU 百分比。\n- Nice: 具有 nice 优先级的用户级 CPU 利用率百分比。\n- System: 系统使用的\
    \ CPU 百分比。这不包括处理中断或软中断的时间。\n- Wait: 系统等待待挂的磁盘 I/O 请求的时间百分比。\n\n"
