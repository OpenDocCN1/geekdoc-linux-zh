    \ a Linux system files will be added or modified in these directories to make\
    \ everything work.\n\n## Conclusions\n\nThis chapter has provided an overview\
    \ of many of the important files and directories on the Linux system. Specific\
    \ attention was given to the dot files, the hidden configuration files which exist\
    \ in most user's home directories which control the user's environment.\n\nWe\
