    this crontab will be executed.


    You will use wildcards in most crontab entries but be careful where you use them.
    For instance, if we mistakenly placed a * in the minute position of the last crontab
    example we would end up running the script for ever minute of the 12:00 hour instead
    of just once at the beginning of the hour. I don''t think anyone needs that reminders
    to go to lunch, do you?


