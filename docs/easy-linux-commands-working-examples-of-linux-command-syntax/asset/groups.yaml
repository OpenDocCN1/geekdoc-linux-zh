    Later on we''ll use the who command to look at who is on the system.


    While it is possible in some versions of Linux to go from a higher to a lower
    runlevel without rebooting it can occasionally cause problems. Often it is easier
    to get to a lower runlevel via restart.


    # # Adding and Removing Users


    While some Linux systems only have a couple active users others can have dozens
    or even hundreds. Most Linux systems offer a graphical interface for managing
    users but you should know how to add and remove users from the command line. You
    will need root privileges to add users.


    An user can be added to Linux with the useradd command. This will create an entry
    for the user in the /etc/passwd and /etc/shadow files and create that users home
    directory in the default location.


    ```

    # useradd chuck

    ```


    Now that the user has been created we should assign a password to them so they
    can log in. The passwd command can be used to change a user''s password. If you''re
    logged in as root you can call the passwd command with a user''s name as an argument
    to change the password of another user.


    ```

    # passwd chuck

    Changing password for user chuck.

    New UNIX password: pencil11983

    Retype new UNIX password: pencil11983

    passwd: all authentication tokens updated successfully.

    ```


    Now we can let this user know that his account is ready and give him his password.
    There are several other options for the useradd command which we have not covered
    here, but this is enough to add a basic user.


    Of course on the other end of things you will occasionally need to remove a user
    from the system. We can do that with the userdel'
  - '[PAGE 148]


    command. The userdel command can be used with the -r option to automatically delete
    the user''s home directory. Just make sure if you are using the -r option that
    there is nothing in the user''s home directory that you need!


    ```

    $ ls -chuck

    $ userdel -r chuck

    ```


    We have listed the user''s home directory and it is empty. Actually there are
    some hidden files which were created with the home directory but we are not concerned
    about them. Next we must use the userdel -r command to remove the user and their
    home directory.


