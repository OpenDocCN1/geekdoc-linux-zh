    ## CHAPTER 0 Some Important Background Information


    We don''t want to bore you with a history lesson, but a little background on Linux
    can help you understand how it works. Don''t worry, we''ll keep it brief.


    ## What is Linux?


    Linux is an operating system loosely based on UNIX, a popular mainframe operating
    system which was originally developed in the 1960s by AT&T''s Bell Laboratories.
    This is why Linux is often referred to as a "UNIX-like" operating system.


    Just like Microsoft Windows, Linux controls the computer hardware, it''s best
    to keep all your devices playing nicely together and gives you an interface to
    run things on the computer. Unlike Microsoft Windows there are several groups
    (some commercial, some non-profit) who make Linux operating systems.


    ## The Linux kernel


    The heart of a Linux system is a program called the kernel. The kernel controls
    security, processors, memory, disk and everything else about the system.


    The kernel is what allows multiple users to be on a Linux system at the same time
    running dozens, possibly even thousands of things at once without interfering
    with each other. While we won''t talk too much about the kernel, it''s just important
    to remember that it''s there keeping everything in check.


    # The Many Breeds of Linux


    You may have already noticed that there are a ton of different Linux versions
    out there. Many meet only a very specific need while others compete in the mass
    market for servers and workstations. Here are a couple of the Linux distributions
    which are popular right now:


    ### Red Hat Enterprise Linux


    www.redhat.com/rhel/ - This is the commercial version of Linux used for the examples
    in this book. It is a popular option for both servers and workstations because
    it is both feature-rich and well supported.


    ### Fedora


    www.redhat.com/fedora/ - Sponsored by Red Hat, this community supported version
    of Linux is available for free. The free price tag makes this a great version
    to work with if you don''t have (want to pay for) a license for Red Hat Enterprise
    Linux, but be careful, some applications which are Red Hat compatible may not
    work on Fedora.


    ### Ubuntu


    www.ubuntu.com - Ubuntu is a Linux-based operating system which has recently gained
    some popularity. It is easy to install and the desktop version comes with many
    of the applications you would want on your workstation.


    ### Mileage May Vary


    Because no two distributions are quite the same you may find that some commands
    and options may not work, or may not work as described on your variety of Linux.
    The examples in this book were done on RedHat Linux. Almost all will work on most
    flavors of Linux but even a different version of RedHat will vary some.


    Installation of Linux varies from distribution to distribution. If you do not
    already have a Linux system to work on you may want to download one of the versions
    mentioned above and install it on a spare machine. Unless you are experienced
    at installing Linux I suggest you choose a machine you will not use for anything
    else. It is quite possible (even easy) to erase your entire hard drive while installing
    Linux, so take an old system (it doesn''t have to be too fast) that you don''t
    need any of the data on and follow the instructions that come with your distribution
    to install Linux.


