    ## 第 0 章 一些重要的背景信息


    我们不想用历史课来让你感到无聊，但关于 Linux 的一点背景知识有助于你理解它的工作原理。别担心，我们会保持简短。


    ## 什么是 Linux？


    Linux 是一个松散基于 UNIX 的操作系统，UNIX 是一种流行的主机操作系统，最初由 AT&T 贝尔实验室于 20 世纪 60 年开发。这就是为什么
    Linux 经常被称为“类 UNIX”操作系统。


    就像微软 Windows 一样，Linux 控制着计算机硬件，它能确保你的所有设备良好地协同工作，为你提供一个在计算机上运行程序的界面。与微软 Windows
    不同，有多个团体（有些是商业性的，有些是非营利的）制作 Linux 操作系统。


    ## Linux 内核


    Linux 系统的核心是一个名为内核的程序。内核控制着安全、处理器、内存、磁盘以及系统的其他所有部分。


    内核允许多个用户同时在 Linux 系统上运行几十个、甚至可能是数千个任务，而彼此互不干扰。虽然我们不会过多地讨论内核，但重要的是记住，它在那里控制着一切。


    # Linux 的多种品种


    你可能已经注意到，市上有大量的不同 Linux 版本。许多版本仅满足非常特定的需求，而另一些则在服务器和工作站的大型市场中竞争。以下是目前比较流行的几个 Linux
    发行版：


    ### 红帽企业级 Linux (Red Hat Enterprise Linux)


    www.redhat.com/rhel/ - 这是用于书中示例的 Linux 商业版本。它是服务器和工作站的热门选择，因为它功能丰富且拥有良好的支持。


    ### Fedora


    www.redhat.com/fedora/ - Fedora 是一个由红帽赞助的社区支持的 Linux 版本，可以免费获取。免费的价格标签使得如果你没有（或不想为）红帽企业级
    Linux 购买许可证，那么它是非常适合工作的一个版本，但请注意，某些与红帽兼容的应用程序可能在 Fedora 上无法运行。


    ### Ubuntu


    www.ubuntu.com - Ubuntu 是一种基于 Linux 的操作系统，最近变得非常流行。它易于安装，桌面版本自带了许多你在工作站上可能需要的应用程序。


    ### 差异可能因版本而异


    由于没有两个发行版是完全相同的，你可能会发现某些命令和选项在你的 Linux 版本中可能不起作用，或者运行方式与描述的不符。书中的示例是在红帽 Linux
    上完成的。几乎所有的示例在大多数 Linux 版本中都能运行，即使是不同版本的红帽也会有所不同。


    Linux 的安装方法因发行版而异。如果你还没有可以运行的 Linux 系统，你可能想要下载上述提到的某个版本并将其安装在备用机器上。除非你擅长安装 Linux，否则我建议选择一台你不会用于其他用途的机器。在安装
    Linux 时，完全可能（甚至非常简单）擦除整个硬盘，所以请拿一台你不需要任何数据的旧系统（不需要太快），并按照你发行版附带的说明操作来安装 Linux。


    # 什么是 shell（外壳）？


    我们在书中运行的所有命令都在 Linux shell 中运行。Linux 中的 shell 是是一种允许你（人类）与 UNIX 操作系统系统的内部机制进行交互的软件。正因为有了
    shell，我们可以使用类似于自然语言（尽管有时只是极其其微）的命令来控制计算机的行为。计算中还有其他类型的 shell，但这是我们本书关注的唯一类型。


    除了能够单独使用某些直观的命令外，shell 还允许我们将这些命令组合成 shell 脚本。一个 shell 脚本可以包含一个命令，也可以包含数百个命令，而这些命令几乎可以是你在
    shell 内部可以执行的任何操作。


    # bash shell


    当然，有很多种 shell。每种都有其优缺点，我们主要关注的是 Bourne-Again Shell (bash)，它是 Linux 用户的默认 shell。


    如果你认为你的 shell 可能不是 bash，别担心。我们稍后会讨论如何更改它，但现在你只需通过输入 `bash` 即可临时更改。


    # 进入 shell


    你可以通过几种不同的方式访问 Linux shell。你可以坐在一台 Linux 计算机前，通过屏幕上显示的 shell 进行访问，或者你可以使用安全协议进入
    shell。正因为有了 shell，我们可以使用类似于自然语言（尽管有时只是极其其微）的命令来控制计算机的行为。计算中还有其他类型的 shell，但这是我们本书关注的唯一类型。


    除了能够单独使用某些直观的命令外，shell 还允许我们将这些命令组合成 shell 脚本。一个 shell 脚本可以包含一个命令，也可以包含数百个命令，而这些命令几乎可以是你在
    shell 内部可以执行的任何操作。


