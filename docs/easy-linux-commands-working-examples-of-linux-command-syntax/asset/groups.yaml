    vi has one outstanding characteristic which makes it a great tool to learn: it''s
    always there. Almost every Linux, UNIX and UNIX-like operating system ships with
    vi pre-installed. In this chapter, information will be presented on how to use
    the vi text editor to create and modify Linux shell scripts.


    ![](img/056ab74889c0b34d529c56d42bb0a965_94_0.png)


    # Editor Modes of Operation


    For all intents and purposes, the vi editor operates in two modes; command mode
    and insert mode. When vi is first invoked, the system will be in command mode.
    While in insert mode, the user can return to command mode by pressing the escape
    (esc) key. If you''re not sure which mode you''re in it is always safe to press
    escape to return to command mode before proceeding.'
