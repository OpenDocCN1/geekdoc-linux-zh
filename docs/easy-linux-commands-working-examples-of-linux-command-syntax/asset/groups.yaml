    \ An average summary line is produced at the end of the report.\n\n```\n$ mpstat\
    \ 3 5\nLinux 5.6.0-72-generic (x86_64) 10/26/2024\n CPU  user  nice  system  iowait\
    \  %irq  %idle  intr/s\n  pm all   1.00   0.00   0.33   0.00   0.00  98.67 1001.99\n\
    \  pm all   0.71   0.00   0.33   0.00   0.00  99.33 1007.02\n  pm all   0.67 \
    \  0.00   0.33   0.00   0.00  99.00 1002.67\n  pm all   0.66   0.00   0.33   0.00\
    \   0.00  99.00 1003.33\nAverage  0.67   0.00   0.33   0.00   0.00  99.00 1003.53\n\
    ```\n\nThe columns in the report generated by the mpstat command are defined as\
    \ follows:\n\n+   - CPU: The processor number or the keyword all, which indicates\
    \ that staistics are calculated as averages among all processors or that there\
    \ is only one processor in the server\n- User: The percentage of CPU used by user\
    \ applications\n- Ower: The percentage of CPU utilization at the user level with\
    \ nice priority\n- System: The percentage of CPU used by the system. This does\
    \ not include the time spent servicing interrupts or softirqs. a softirq is a\
    \ software interrupt, up to 32 software interrupts which can run on multiple CPUs\
    \ simultaneously.\n- Wait: The percentage of time the system had a pending disk\
    \ I/O request"
- md: "\n- %irq: The percentage of time spent by the CPUs servicing interrupts\n-\
    \ %soft: The percentage of time the processors spent servicing softirqs\n- %idle:\
    \ The percentage of time that the processors were idle and the system did not\
    \ have a pending disk I/O request.\n- %intr/s: The total number of interrupts\
    \ per second received by the processor(s)\n\nThe information from the mpstat report\
    \ can be used to determine if processor load is being distributed evenly across\
    \ the existing processors and if the multi-processing capabilities of the server\
    \ are being utilized effectively.\n\n## Displaying I/O Statistics\n\nThe iostat\
    \ command is used to monitor the load on server input/output (I/O) devices by\
    \ observing the time the devices are active compared to the average transfer rate\
    \ of the device. iostat generates several report lines that can be used to monitor\
    \ and subsequently change the system configuration to better balance the I/O workload\
    \ between physical disk devices.\n\nThe initial report detail lines generated\
    \ by iostat provide statistics encompassing the time since the system was last\
    \ booted. Subsequent sets of detail lines cover the time since the previous report\
    \ interval.\n\nEach set of report lines starts with a header row with CPU statistics\
    \ which represents the CPU usage across all processors. Following the CPU information,\
    \ a device header row is displayed with subsequent detail lines of statistics\
    \ for each device in the system.\n\nThe following example shows the invocation\
    \ of iostat specifying a three second interval or delay with a total of five samples\
    \ or counts:\n\n```\n$ iostat 3 5\nLinux 2.6.5-1.358 (Dell-Linux) 10/18/2004\n\
    ```\n\n| avg-cpu: | %user | %nice | %iowait | %idle |\n|---|---|---|---|---|\n\
    | | 0.51 | 0.14 | 0.22 | 98.86 |\n| Device: | tps | %nice | Blk_read/s | Blk_wrtn/s\
    \ | Blk_read | Blk_wrtn |\n|---|---|---|---|---|---| |\n| hda | 0 | 0 | 0.00 |\
    \ 0.00 | 0 | 1192 |\n| hdf | 0 | 0 | 20.83 | 5.33 | 1405186 | 359616 |\n| avg-cpu:\
    \ %user | %nice | %iowait | %idle |\n|---|---|---|---|---|\n| | 0.67 | 0.00 |\
    \ 0.33 | 99.00 |\n| Device: | tps | Blk_read/s | Blk_wrtn/s | Blk_read | Blk_wrtn\
    \ |\n|---|---|---|---|---|---| |\n| hda | 0 | 0 | 0.00 | 0.00 | 0 | 0 |\n| hdf\
    \ | 0 | 0 | 0.00 | 0.00 | 0 | 0 |\n| avg-cpu: %user | %nice | %iowait | %idle\
    \ |\n|---|---|---|---|---|\n| | 0.67 | 0.00 | 0.33 | 99.00 |\n| Device: | tps\
    \ | Blk_read/s | Blk_wrtn/s | Blk_read | Blk_wrtn |\n|---|---|---|---|---|---|\
    \ |\n| hda | 0 | 0 | 0.00 | 0.00 | 0 | 0 |\n\nFor the average CPU report, %user,\
    \ %nice, %iowait, and %idle are defined the same as they were in the mpstat command.\
    \ One remaining piece of information is defined as:\n\n- %sys: The percentage\
    \ of processor utilization occurring at the system kernel level.\n\nFor the device\
    \ utilization report:\n\n- device: The device name as listed in the /dev directory\
    \ is displayed. These device names are mapped to mount points in the file /etc/fstab\
    \ and are also listed in the output of the df command.\n- tps: The number of transfers\
    \ (I/O requests) per second issued to the device.\n- blk_read/s: The number of\
    \ blocks per second read from the device.\n- blk_wrtn/s: The number of blocks\
    \ per second written to the device.\n- blk_read: The total number of blocks read.\n\
    - blk_wrtn: The total number of blocks written.\n\nThis information can assist\
    \ in the determination of which devices are more heavily used than others and\
    \ perhaps help with the determination of how to better distribute data to balance\
    \ the workload.\n\n## Server monitoring commands\n\n## Displaying Virtual Memory\
    \ Statistics\n\nThe vmstat command displays information about processes, memory,\
    \ paging, block IO, and different levels of CPU activity. As with iostat, the\
    \ first detail lines produce report averages since the last reboot. Subsequent\
    \ detail lines report information using the interval specified on the command\
    \ line.\n\nAs with the other commands in this section, the vmstat command is driven\
    \ by delay and count options that determine the time interval between report lines\
    \ and the totals of intervals to be reported.\n\n```\nvmstat 3 5\nprocs    memory----\
    \      swap----      cpu-----\nr bswpd free buff cache si so hi bo cs us id da\
    \ wa\n0 0 63492 94856 24996 0 0 8 3484 29 1 99 0\n0 0 63492 94856 24996 0 0 0\
