    ## 按模式查找进程


    `pgrep` 命令用于查找命令中包含特定模式的进程。以下命令查找包含 `nautilus` 的进程：


    ```

    $ pgrep nautilus

    18094

    3149

    20224

    11597

    31355

    ```


    `pgrep` 是一个查找特定运行程序的有用方法，但应该明智使用。另一种查看特定用户所有进程的方法是使用 `-u` 选项：


    ```

    $ pgrep -u lp

    22233

    28688

    ```


    你可以结合这两种方法来匹配特定用户和模式。在这里我们看到了用户的 ID：


    ```

    $ pgrep -u lp

    22233

    26688

    25565

    ```


