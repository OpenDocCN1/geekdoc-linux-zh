    # Pipes


    The pipe can be used to pass the output from one command to another command or
    program without creating an intermediate file. The use of pipes is a convenient
    way to string together multiple commands on a command line. The pipe symbol is
    the vertical bar (|), which is placed between commands to invoke a pipe.


    To see the files in the current working directory that have /fil/ as the name
    extension, a pipe could be formed between the ls and grep as follows:


    ```

    $ ls -l/grep .fil

    -rw-rw-r-- 1 tclark tclark 0 Feb 3 09:00 example1.fil

    -rw-rw-r-- 1 tclark authors 0 Jan 27 00:22

    umask.example.fil

    ```


    It''s important to note that the grep command here is not only looking at the
    file name but is actually looking for the string, /fil/anywhere in the lines of
    the ls -l output.


    The following more complicated pipe -ef example show the current processes (ps
    -ef), redirects the list of processes to filter for only ones with root in the
    output (grep root), and counts the number of remaining lines with the word count
    command (wc -l). The resulting string of commands returns the total number of
    current processes.


    ```

    $ ps -ef|grep root|wc -1

    1

    ```


    This shows how pipes can be used to combine multiple commands to get some fairly
    sophisticated results.'
  - "[PAGE 120]\n\n# Conditional Statements\n\nAn important aspect of programming\
    \ is being able to determine if a condition is true or false and then perform\
    \ specific actions depending upon the outcome of the condition test. This can\
    \ be especially useful when used with the exit status of the previous command.\n\
    \nShell scripting supplies several ways of testing conditions and then performing\
    \ specific actions. Some examples of condition statements are the if condition,\
    \ the case statement and the test or expression statement. Conditions are also\
    \ tested in the while loop and the until loop and specific actions are repeated.\n\
    \n# The if condition\n\nThe simple form of the if statement consists of the if\
    \ condition, a then statement followed by commands to be executed when the condition\
    \ is true, and the fi statement (if spelled backwards) which ends the if statement.\
    \ The condition usually consists of a simple comparison between two values, such\
    \ as A=B or number=5. The following is a simple if conditional statement.\n\n\
    ```\n$ x=3\n$ y=9\n$ if [ $x -lt $y ];\n  then\n    echo \"\"\n    echo \"x=$$(x)\
    \ which is less than y=$$(y)\"\n  fi\n\nx=3 which is less than y=9\n```\n\nThe\
    \ simple if statement also provides an else clause which allows the execution\
    \ of commands when the condition is false. The following is an example of a simple\
    \ if-then-else statement.\n\n```\n$ x=3\n$ y=2\n$ if [ $x -lt $y ];\n```"
