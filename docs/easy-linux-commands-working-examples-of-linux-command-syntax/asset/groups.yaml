    # 格式化新磁盘


    接下来，将使用 `mkfs`（创建文件系统）命令在新的分区上使用 `ext3` 文件系统格式化 Linux 分区。现在，当我们引用设备路径时，我们也包含了我们创建的分区号（在本例中为
    1）。


    ```

    $ mkfs -t ext3 -c /dev/hdb1

    ```


    `-t` 选项用于指定要创建的文件系统类型。此处指定的 `-c` 选项将导致 `mkfs` 在创建文件系统之前对分区进行坏块检查（磁盘的物理缺陷）。


    如果你想在新磁盘上格式化交换分区（swap partition），可以使用 `mkswap` 命令来代替 `mkfs`，如下所示：


    ```

    $ mkswap -c /dev/hdb1

    ```


    请注意，我们不需要指定分区类型，因为 `mkswap` 只创建交换分区。`-c` 选项仍可检查坏块。


    # 挂载新磁盘


    下一步是创建一个目录作为我们新分区的挂载点。使用 `mkdir` 命令来创建目录，在本例中命名为 `/new1`。这个目录没有特别之处，但最好保持它是空的，因为当新分区挂载到该位置时，该目录中的任何内容都会消失。


    ```

    $ mkdir /new1

    ```


    现在我们已经创建了挂载点，可以挂载该分区使其可用：


    ```

    $ mount -t ext3 /dev/hdb1 /new1

    ```


    在这里我们看到 `mount` 命令接受多个选项。首先，`-t ext3` 指定了分区类型，这与用于 `mkfs` 命令的类型相同。下一个选项 `/dev/hdb1`
    指定了设备路径，此处列出的最后一个选项 `/new1` 是我们创建的挂载点。


    我们现在可以在 `/new1` 处开始使用新磁盘了，但当系统重启时，`/new1` 分区将不会被自动挂载！为了让它自动挂载，我们需要将其添加到 `/etc/fstab`
    文件中。


    # 使用文件系统表进行工作


    在添加磁盘或更改磁盘布局时，必须修改文件系统表。该表位于名为 `/etc/fstab` 的文件中。以下列表包含了此时测试服务器上 `fstab` 的内容：


    ```

    $ cat /etc/fstab

    ext3 defaults 1 1

    LABEL=/boot /dev/pts ext3 defaults 1 2

    none /dev/shm devfs mode=620 0 0

    none /dev/aio tmpfs defaults 0 0

    none /proc proc 0 0

    none /sys sysfs defaults 0 0

    /dev/hdb2 swap defaults 0 0

    /dev/cdrom /mnt/cdrom udf,iso9660 noauto,owner,kudu,ro 0 0

    /dev/cdrom1 /mnt/cdrom1 udf,iso9660 noauto,owner,kudu,ro 0 0

    /dev/hdc4 /mnt/zip auto noauto,owner,kudu 0 0

    /dev/fd0 /mnt/floppy auto noauto,owner,kudu 0 0

    ```


    `fstab` 文件中的每一行都由空格或制表符分隔的六个字段组成。


    字段的内容在表 3.2 中描述，如下：


    | 字段 | 描述 |

    | --- | --- |

    | 1 | 被描述的物理设备或远程文件系统 |

    | 2 | 文件系统将挂载的挂载点 |

    | 3 | 此设备上的文件系统类型 |

    | 4 | mount 在挂载文件系统时使用的选项列表 |

    | 5 | 此字段用于 `dump` 备份工具，以确定文件系统是否应该备份。如果此字段为 0，`dump` 将忽略该系统 |

    | 6 | 此字段用于 `fsck` 文件系统检查工具，以确定检查文件系统的顺序。如果该字段为 0，`fsck` 将不检查此文件系统 |


    # 表 3.2：fstab 文件字段


    可以通过修改 `/etc/fstab` 文件来更改哪些设备挂载到何处，或者在我们的案例中，让新设备在启动时挂载。使用文本编辑器（如第 5 章介绍的 `vi`），我们可以仔细地向
    `/etc/fstab` 文件中添加该行，以便在启动时进行挂载：


    ```

    /dev/hdb1      /new1      ext3      defaults      1 1

    ```


    我们的 `/new1` 分区现在每次重启系统时都可用！在重启系统之前，请务必仔细反复检查对 `/etc/fstab` 文件的任何更改。


    # LVM：逻辑卷管理器


    虽然磁盘卷的管理是一个高级主题，在本指南中不会进行详细介绍，但 Linux 为系统管理员提供的逻辑卷管理器（LVM）子系统值得提及。它可以用于从物理磁盘卷创建并管理磁盘卷组（volume
    groups）。通过允许将物理分离的磁盘组合成单个逻辑磁盘，LVM 简化了磁盘管理的许多方面。在具有一两个或两个内部磁盘驱动器的简单 Linux 工作站上工作时，不需要使用
    LVM；然而当管理连接了磁盘阵列的 Linux 服务器时，LVM 可以是无价之。


    用户必须拥有 root 权限才能使用 LVM 子系统。LVM 是一个参数驱动的子系统，由位于 `/etc/lvm/lvm.conf` 的文本文件规范控制。配置文件包含了若干描述每个章节的注释。LVM
    子系统有 40 多个命令用于创建和管理卷组。虽然这本书没有涵盖 LVM，但下表 3.3 列出了部分可用的 LVM 命令：


    | 命令 | 功能 |

    |---|---|

    | lvchange | 修改逻辑卷属性 |

    | lvcreate | 创建逻辑卷 |

    | lvdisplay | 显示逻辑卷属性 |

    | lvext | 为逻辑卷添加空间 |

    | lvmdscan | 列出可用物理卷的设备 |

    | reduce | 缩小逻辑卷大小 |

    | lvresize | 调整逻辑卷大小 |

    | vgcreate | 创建卷组 |

    | vgdisplay | 显示卷组信息 |

    | vgxtend | 为卷组添加物理卷 |


    表 3.3：LVM 命令及其功能


    显然 LVM 是一个相当复杂的子系统，用户在使用时确实需要清楚自己在做什么并非常小心。


    # 结论


    在本章中，我们学习了 Linux 如何组织磁盘，以及我们如何对新磁盘进行物理安装、分区、格式化，最后是 `/etc/fstab` 文件设置。逻辑卷管理器 (LVM)
    也包含了一些创建和管理的命令。


    # 书籍总结


    这结束了 Linux 参考。虽然没有任何书能让你成为专家，但我们希望这能缓解学习曲线并继续作为功能参考。


    如果你对提高自己的 Linux 知识，最好的方法就是实践。你使用 Linux 越多，就会学得越好。Linux 技能在 IT 领域是受欢迎的，你的许多 Linux
    技能可以迁移到 UNIX 和其他操作系统，甚至是 Mac OSX！命令行操作的能力不仅让你在窗口环境无法启动时解决问题，还能让你通过 SSH 从世界任何地方远程连接。


    如果你想了解更多关于 Linux 脚本的信息，请阅读 Jon Emmons 写的《Oracle Shell Scripting: Linux and UNIX
    Programming》。虽然这本书的部分内容针对 Oracle 专业人士，但大部分内容可以应用于任何 Linux 或 UNIX 系统。


