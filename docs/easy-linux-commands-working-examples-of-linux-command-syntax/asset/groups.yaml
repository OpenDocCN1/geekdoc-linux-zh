    \ an idea of what to find where.\n\nNext we'll look at how the Linux permission\
    \ structure keeps many of these files safe just like it keeps every user's files\
    \ safe.\n\n## File and Directory Security\n\nLinux file security is quite simple\
    \ in design, yet quite effective in controlling access to files and directories.\n\
    \nDirectories and the files which are stored in them are arranged in a hierarchical\
    \ tree structure. Access can be controlled for both the files and the directories\
    \ allowing a very flexible level of access.\n\nThe chapter will introduce Linux\
    \ file and directory access permissions and show how those permissions can be\
    \ manipulated to suit the system requirements.\n\n## File Security Model\n\nIn\
    \ Linux, every file and every directory are owned by a single user on system.\
    \ Each file and directory also has a security group associated with it that has\
    \ access rights to the file or directory. If a user is not the directory or file\
    \ owner nor assigned to the security group for the file, that user is classified\
    \ as other and may still have certain rights to access the file.\n\nEach of the\
    \ three file access categories, owner, group, and other, has a set of three access\
    \ permissions associated with it. The access permissions are read, write, and\
    \ execute.\n\nA user may belong to more than one group. Regardless of how many\
