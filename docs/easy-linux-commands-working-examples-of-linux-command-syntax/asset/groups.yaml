    These results show that two files are mounted. The Filesystem column of the output
    shows the path to the disk device which is currently mounted at the Mounted location.
    The 1K-blocks column displays the size of the entire partition while the Used
    and Available columns indicate the number of 1K blocks on that device used and
    available. The Use% column will show what percentage of the disk is currently
    used and is the quickest way to identify disks which are getting full.


    To get the display in a friendlier format, the -h option can be used:


    | Filesystem | Size Used Avail Use% | Mounted on |

    |---|---|---|---|---||

