    Scripting: Linux and UNIX Programming for Oracle》，在书书中我详细地涵盖了其中的许多信息。如果你对 shell
    脚本感兴趣，可能想买来这本书！虽然某些示例使用了 Oracle，但书的大部分内容适用于对该主题感兴趣的任何人。在这里，我们将简要介绍，以便对如何创建脚本来执行周期性重复的功能有一个大致的概念。


    在直接开始创建脚本之前，应该先介绍一些额外的话，以及一些需要回答的问题。


    # 什么是 shell？


    正如本书前面描述的那样，shell 提供了一个命令解释器环境，通过类英语的命令向 Linux 内核发送指令。Linux 中提供了多种不同的 shell 环境。要确定用户的
    Linux 版本上可用哪些 shell 环境，应该执行以下命令：


    ```

    $ cat /etc/shells

    /bin/sh

    /bin/bash

    /sbin/nlogin

    /bin/bash2

    /bin/ash

    /bin/bash

    /bin/ksh

    /bin/tcsh

    /bin/csh

    /bin/zsh

    ```


    结果列表表明该服务器上有几种 shell 可用，例如 Bourne shell (sh)、Bourne Again shell (bash)、Korn shell
    (ksh) 和 C-shell (csh) 等。在 Linux 中，bash shell 通常是默认 shell。


    要确定系统当前设置的默认 shell，应该运行以下命令：


    ```

    $ echo $SHELL

    /bin/bash

    ```


    正如预期的，bash shell 是当前的默认 shell。


    shell 是命令语言解释器，执行从标准输入设备（如键盘）或纯文本文件中读取的命令。


    shell 可以与 Microsoft Windows 命令提示符相比较，后者也执行从键盘或文本 (.bat) 文件发出的命令；然而，shell 环境比其
    Windows 对应物要强大且丰富得多。


    # 命令别名 (Command Aliases)


    别名（Aliases）是 shell 脚本的小兄弟。正如我们很快看到的，shell 脚本是一个包含命令列表的文件。相比之下，别名可以执行复杂的命令，但它们像环境变量一样设置在
    shell 中。


    如果你发现自己频繁使用像下面这样相当复杂的命令，并且能够在不输入整个内容的情况下运行它，你可以使用 `alias` 命令设置快捷方式。


    ```

    $ alias alert-tail -20 /u01/installed/software/mypm/alert.log|more

    ```


    现在你只需输入 `alert` 即可执行这整个命令。我们在讨论 shell 脚本编写时将提到的许多功能在别名中可用，包括用于将一个命令的输出发送到另一个命令的输入的管道
    (|)。


    一组编写良好的别名可以节省你大量的击键次数，只需注意不要创建与你使用的命令同名的别名，除非你想让别名在你输入它时替换该命令。


