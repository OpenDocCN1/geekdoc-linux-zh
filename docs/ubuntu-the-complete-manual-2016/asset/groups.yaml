- md: "\n## Edit your terminal profile\n\nChange the title, cursor shape, scrolling\
    \ options and command behaviour, as well as colours, fonts, some historic legacy\
    \ stuff (like Backspace and Delete-key behaviour) and more.\n\n## The icon says\
    \ it all\n\nYou won’t confuse Xterm with any other terminal emulator thanks to\
    \ that distinctive icon, boasting support for 256 colours on that expressive cathode-tube\
    \ display.\n\n## Enjoy the convenience of GNOME Terminal\n\nGNOME Terminal fits\
    \ well into the Ubuntu design with its recognisable Ubuntu Mono font and deep-purple\
    \ background. However, you can change these and other settings with several mouse\
    \ clicks.\n\n## Non-distracting scrollbars\n\nGNOME Terminal drew ugly, thick\
    \ scrollbars in the past. Sometime later, Canonical applied its overlay bars,\
    \ and removed the 1-pixel outline around the terminal frame.\n\n## Try a fail-safe\
    \ solution\n\nXterm is relatively old, however, it delivers a pure Bash experience\
    \ without any bells and whistles. Xterm comes in every OS that uses X.org (all\
    \ Linux distros do).\n\n**64**\n\n“Bash has a very rich set of supported commands,\
    \ but the most useful feature comes from its popularity; all Linux users use their\
    \ terminals with the same syntax”\n\nUse GNOME Terminal & Xterm\nSave yourself\
    \ time: Working with terminal emulators is easier than you’d think\n\n**Ubuntu\
    \ essentials**\n\n**65**\n\n**04**\n\nWorking in the terminal goes long into the\
    \ history of Linux and UNIX, so it’s no wonder we have a decent number of discovered\
    \ Easter eggs and jokes that bring in some fun and help you to feel more comfortable\
    \ in the terminal. Start with `$ sudo apt-get install moo` to bring up a jolly\
    \ cow (Fig 2), find another Easter egg with `$ aptitude moo` and then `$ aptitude\
    \ --v moo` and add an extra ‘v’ three more times to see a snake that has eaten\
    \ an elephant. The `$ ls` shows a steam locomotive and finally the `$ fortune\
    \ | cowsay` shows a cow that tells your fortune. However, to finish up, let’s\
    \ do something massive and change our boring GNOME Terminal to a Hollywood Technodrama\
    \ showcase, mimicking an FBI command centre (Fig 1, page 63):\n\n```bash\nsudo\
    \ apt-add-repository ppa:hollywood/ppa\nsudo apt-get update\nsudo apt-get install\
    \ Hollywood\n```\n\nHave some fun\n\n**03**\n\nKnowing tricks for GNOME Terminal\
    \ in Ubuntu can save time and increase productivity. We start with the simplest:\
    \ launch the application using the Ctrl+Alt+T sequence anywhere in Unity. When\
    \ browsing your files in Nautilus, it is useful to open a terminal window for\
    \ the current directory. Nautilus can do it when you right-click on an empty space\
    \ within a view area and select ‘Open in Terminal’, but this feature is not enabled\
    \ by default in Ubuntu. Fix it with the following command:\n\n```bash\n$ sudo\
    \ apt-get install nautilus-open-terminal\n```\n\nthen restart the file manager.\
    \ When you need to copy or paste text, use Ctrl+Ins and Shift+Ins respectively,\
    \ instead of laboriously right-clicking menus. To clear the input, you can either\
    \ cancel a command with Ctrl+C, or clear what has been written with Alt+R.\n\n\
    Learn some helpful shortcuts\nUse GNOME Terminal & Xterm\n**Ubuntu essentials**\n\
    \n**Fig 2 (left)** Perform the `$ fortune | cowsay` command and see this guy\n\
    \n**65**\n\n**66**\n\n**Ubuntu essentials**\n\n## Secure files with Déjà Dup\n\
    \nHaving a backup copy of your photos, documents, music and video is a high priority\
    \ to keep them safe, even though some novice users opt to skip the process. Imagine\
    \ that something has gone wrong with your hard drive and it can no longer boot\
    \ up. The bad news is that while you can buy a new hard drive, you may well lose\
    \ your data on the old one, which is often more precious than any hardware you\
    \ might have lost.\n\nSo here comes the next hour for a backup copy that you have\
    \ prepared beforehand and kept updating regularly. And there’s no excuse not to\
    \ do it, since Ubuntu includes a great tool for automatic and hassle-free backups\
    \ called Déjà Dup – also known by the simpler name, Backups.\n\nUsing Déjà Dup\
    \ is as simple as it can be: you choose what you want to back up and where, opt\
    \ to specify what directories it should skip and then put the task into the automatic\
    \ queue of the Ubuntu scheduler, which can perform backups periodically and even\
    \ keep new and older backups at the same time. The interface of Déjà Dup has a\
    \ category tree on the left and a main part to the right. The default setup assumes\
    \ you might want to back up ~/home, so you may leave directories like ~/Downloads\
    \ that usually get populated with large files.\n\n**67**\n\n**Ubuntu essentials**\n\
    \n## Secure files with Déjà Dup\n\nHaving a backup copy of your photos, documents,\
    \ music and video is a high priority to keep them safe, even though some novice\
    \ users opt to skip the process.\n\n“Having a backup copy of your photos, documents,\
    \ music and video is a high priority to keep them safe”\n\n**66**\n\n**67**\n\n\
    **Ubuntu essentials**\n\n**08**\n\n**Ubuntu essentials**\n\n Secure files with\
    \ Déjà Dup\n\n**68**\n\n**0 essentials**\n\n01\n\nWe most commonly seek to back\
    \ up photos, videos, office documents and application settings. While this is\
    \ true for home computers, let us also complement this with targets that are more\
    \ relevant to production servers and corporate usage, such as databases, collected\
    \ data and so on. Always evaluate the size of proposed backup beforehand and make\
    \ sure it fits the target storage. You’ll definitely need extra space if you do\
    \ incremental backups\n\nIf you store a backup copy on the same drive with the\
    \ original files, it can only save you from accidental deletion. It is therefore\
    \ highly recommended to save backups to another physical drive or disk to protect\
    \ yourself from main hard drive failure. For frequent incremental backups, external\
    \ hard drives are known to work better compared to flash drives – the latter have\
    \ a limited lifetime and don’t like many overwrites. You can also use a remote\
    \ destination via SSH, WebDAV or Windows shared folder. You can choose the right\
    \ place via the Storage Location menu.\n\n03\n\nIf we had a crystal ball, we’d\
    \ use it. But the fact is that nobody knows when things will go wrong. To protect\
    \ yourself from experiencing that sinking feeling when you discover your backups\
    \ are broken, go for a test restore at the very beginning. It’s a good idea to\
    \ set up a small backup task and run it. After that, go to the Overview section\
    \ and press the Restore button. Déjà Dup will guide you with a simple wizard,\
    \ where you’ll be able to choose the location of a backup and then select a date,\
    \ from which a copy will be derived. Go ahead with a real-world backup if everything\
    \ restores fine.\n"
  mdcn: "\n\n## 编辑你的终端配置文件\n\n更改标题、光标形状、滚动选项和命令行为，以及颜色、字体、一些历史遗留功能（如退格键和删除键的行为）等。\n\
    \n## 图标说明了一切\n\n得益于那个独特的图标，你不会将 Xterm 与任何其他终端模拟器混淆，它在那块表现力阴极管显示屏上支持 256 色。\n\n\
    ## 享受 GNOME Terminal 的便利\n\nGNOME Terminal 以其标志性的 Ubuntu Mono 字体和深紫色背景完美融入 Ubuntu\
    \ 的设计。然而，你可以通过几次鼠标点击更改这些和其他设置。\n\n## 不干扰的滚动条\n\nGNOME Terminal 过去曾绘制丑陋且粗粗的滚动条。后来，Canonical\
    \ 应用了覆盖条，并移除了终端框架周围的 1 像素轮廓。\n\n## 尝试安全解决方案\n\nXterm 相对老旧，但它提供了纯粹的 Bash 体验，没有任何花哨。Xterm\
    \ 存在于每个使用 X.org 的操作系统（所有 Linux 发行版都是如此）。\n\n**64**\n\n“Bash 拥有一套非常丰富的支持命令，但最实用的功能源于它的普及性；所有\
    \ Linux 用户都使用相同的语法操作终端”\n\n使用 GNOME Terminal & Xterm\n节省你的时间：与终端模拟器工作比你想象的要容易\n\
    \n**Ubuntu 基础**\n\n**65**\n\n**04**\n\n在终端中工作可以追溯到 Linux 和 UNIX 的长期历史，所以难怪我们发现了许多彩蛋和笑话，它们能带来一些乐趣并让你在终端中感到更自在。从运行\
    \ `$ sudo apt-get install moo` 开始，召唤一只快乐的奶牛（图 2），通过 `$ aptitude moo` 寻找另一个彩蛋，然后运行\
    \ `$ aptitude --v moo` 并再添加三次 ‘v’，就能看到一条吃掉大象的蛇。`$ ls` 显示一辆蒸汽机车，最后 `$ fortune |\
    \ cowsay` 显示了一头正在为你占卜的奶牛。然而，为了结束一下，让我们做一些宏大的事情，将我们无聊的 GNOME Terminal 变成一个好莱坞科技剧的展示场，模仿\
    \ FBI 指令中心（图 1，第 63 页）：\n\n```bash\nsudo apt-add-repository ppa:hollywood/ppa\n\
    sudo apt-get update\nsudo apt-get install Hollywood\n```\n\n享受一下乐趣\n\n**03**\n\
    \n了解 Ubuntu 中 GNOME Terminal 的技巧可以节省时间并提高效率。我们从最简单的开始：在 Unity 的任何地方使用 Ctrl+Alt+T\
    \ 序列启动应用程序。在 Nautilus 中浏览文件时，为当前目录打开终端窗口是有用的。当你在视图区域内的空白处点击右键并选择“在终端中打开”时，可以这样做，但此功能在\
    \ Ubuntu 中默认未启用。使用以下命令修复它：\n\n```bash\n$ sudo apt-get install nautilus-open-terminal\n\
    ```\n\n然后重启文件管理器。当你需要复制或粘贴文本时，分别使用 Ctrl+Ins 和 Shift+Ins，而不是费力地点击右键菜单。要清除输入，你可以用\
    \ Ctrl+C 取消命令，或用 Alt+R 清除已输入的内容。\n\n学习实用的快捷键\n使用 GNOME Terminal & Xterm\n**Ubuntu\
    \ 基础**\n\n**图 2（左侧）** 执行 `$ fortune | cowsay` 命令并查看这家伙\n\n**65**\n\n**66**\n\n\
    **Ubuntu 基础**\n\n## 使用 Déjà Dup 保护文件\n\n为你的照片、文档、音乐和视频准备备份副本是确保它们安全的首要任务，尽管某些新手用户选择跳过这一过程。想象一下你的硬盘出了问题，无法再次启动。坏消息是，虽然你可以购买新硬盘，但你很可能会丢失旧硬盘上的数据，而这些数据通常比你丢失的任何硬件都要珍贵。\n\
    \n所以，现在是时候使用你预先准备并定期更新的备份副本了。你没有理由不这样做，因为 Ubuntu 包含一个强大的自动且无忧无虑的备份工具，名为 Déjà Dup\
    \ ——也被称为更简单的名称 Backups（备份）。\n\n使用 Déjà Dup 可以再简单不过：你选择想要备份的内容和位置，指定它应该跳过的目录，然后将任务放入\
    \ Ubuntu 调度器的自动队列中，该调度器可以定期执行备份，甚至同时保留新旧备份。Déjà Dup 的界面左侧有一个分类树，右侧是主部分。默认设置假设你可能想备份\
    \ ~/home，因此你可以留下像 ~/Downloads 这样通常存放大文件的目录。\n\n**67**\n\n**Ubuntu 基础**\n\n## 使用\
    \ Déjà Dup 保护文件\n\n为你的照片、文档、音乐和视频准备备份副本是确保它们安全的首要任务，尽管某些新手用户选择跳过这一过程。\n\n“为你的照片、文档、音乐和视频准备备份副本是确保它们安全的首要任务”\n\
    \n**66**\n\n**67**\n\n**Ubuntu 基础**\n\n**08**\n\n**Ubuntu 基础**\n\n 使用 Déjà Dup\
    \ 保护文件\n\n**68**\n\n**Ubuntu 基础**\n\n01\n\n我们最常见的备份目标是照片、视频、办公文档和应用程序设置。对于家用电脑来说确实如此，但让我们补充一些与生产环境服务器和公司用途更相关的目标，例如数据库、收集的数据等。务必提前评估拟议备份的大小，确保它符合目标存储。如果你进行增量备份，将确实需要额外的空间。\n\
    \n如果你将备份副本存储在与原始文件相同的驱动器上，它只能防止意外删除。因此，强烈建议将备份保存到另一个物理驱动器或磁盘上，以防止受到主硬盘故障的损害。对于频繁的增量备份，外部硬盘比闪存盘效果更好——后者的寿命有限，且不喜欢频繁写入。你还可以通过\
    \ SSH、WebDAV 或 Windows 共享文件夹使用远程目标。你可以通过存储位置菜单选择合适的地方。\n\n03\n\n如果我们有水晶球，我们会使用它。但事实是，没有人知道问题会在何时发生。为了防止让自己在发现备份损坏时体验那种心沉底的感觉，请从一开始就进行测试恢复。设置一个小型备份任务并运行它是一个好主意。之后，进入概述部分并点击恢复按钮。Déjà\
    \ Dup 将通过简单的向导引导你，你可以在其中选择备份的位置，然后选择一个日期，从中衍生出一个副本。如果一切恢复正常，就可以进行真实的备份了。\n\n"
