    ## Ubuntu apps


    ## Improve your browsing experience

    Important aspects of web browsing with Firefox


    ### 01

    There are steps that you will repeat several times a day without realising how
    much time they take, for example, searching specific websites. Instead of going
    to the search engine, finding the search box, entering the keyword and executing
    the search, you can directly search the Internet using Firefox, while you are
    on any website.


    To set this up on your browser, visit the page on the target website that has
    the search field you would normally use to search the site. Hold down the Ctrl
    key and click on Search website from the address bar search field. Select ‘Add
    a Keyword’ for this search. The ‘Add Bookmark’ dialog appears. Enter an appropriate
    name for the bookmark (for example: ‘Wikipedia search’). Create a keyword (like
    ‘wikipedia’). Select the bookmark folder to contain the smart keyword. Click OK.
    To use the created smart bookmark, enter the keyword and search string in the
    Location bar then press Return.


    ### 02

    People now use multiple devices to access the Internet. Firefox helps to make
    sure all your Sync bookmarks, links and other things are synced across devices
    seamlessly. Firefox does this with a feature called Sync. It lets you share your
    data and preferences (such as your bookmarks, history, passwords, open tabs, Reading
    List and installed add-ons) across all your devices.


    Let us see how to set up and sync an account in Firefox. First, click on the menu
    button and click ‘Sign in to Sync’. The sign-in page will open in a new tab. Click
    the ‘Get Started’ button. Fill out the form to create an account and click ‘Next’.
    Take note of the email address and password you used; you’ll need it later to
    log in. Check your emails for the verification link and click on it to confirm
    your email address.


    **Fig 1 (above)** It takes a few simple steps to change our default home page


    “Private Browsing allows you to browse the Internet without saving any information
    about which sites and pages you’ve previously visited”


    You’re ready to go! Now you just need to log in to Sync on all your other devices
    and let it do the rest.


    ### 03

    As you browse the web, Firefox remembers lots of information, for example the
    sites you’ve visited and your passwords. There may be times, however, when you
    don’t want people with access to your computer to see this information. Private
    Browsing allows you to browse the Internet without saving any information about
    which sites and pages you’ve previously visited. Private Browsing also includes
    Tracking Protection, which prevents companies from tracking your browsing history
    across multiple sites. To open a private browsing session, click on the menu button
    and then click ‘New Private Window’. If you want to directly open a link in a
    new private window, hold down the Ctrl key while you click on this link and choose
    the option to ‘Open Link in New Private Window’ from the context menu.


    ### 04

    Mozilla offers the browser platform to developers as well.


    Install an app

    This paves the way for thousands of interesting and useful apps in the Mozilla
    marketplace (Fig 2). With a wide selection of games, music and productivity apps,
    Firefox Marketplace has something for everybody. To install an app, open Firefox,
    click on the ‘Tools’ menu and select ‘Apps’. This will open up the marketplace.
    Now, type a search query in the search box to look for a specific app or choose
    a category for the type of app you are looking for. You can also choose the screen
    type from the drop-down menu to see apps optimised for that screen size. Click
    on an app to view its details. Finally, if you’re ready to install an app, click
    the blue install button.


    **Fig 2 (above)** Go to the Mozilla marketplace to download apps


    ## Manage your emails with Thunderbird

    Part of the Mozilla suite, Thunderbird is a lightweight mail client. It supports
    different account protocols like POP, IMAP, Gmail. It also has an integrated spam
    filter and easy organisation of mails with tagging. More features can be added
    by simply installing extensions. If you’re an avid reader, Thunderbird acts as
    news and RSS client as well. Tabbed email lets you load messages in separate tabs
    so you can quickly jump between conversations. A quick filter helps you filter
    messages by tags, keywords etc. Other features include message archiving, customisable
    themes and personas, smart folders, and even chat integration. You can also add
    social media accounts, like Twitter and Facebook, directly to Thunderbird and
    chat with contacts on these platforms. Thunderbird is installed by default on
    Ubuntu 16.04, so just search for it. Click on the icon in the results to launch
    Thunderbird and you can now get started.


    “You can also add social media accounts, like Twitter and Facebook, directly to
    Thunderbird”


    Work remotely and learn to manage all email accounts using Thunderbird


    ### Explore key features of the Thunderbird UI

    | Section | Description |

    | :--- | :--- |

    | Get messages | You can use this button to force sync with the email servers
    and fetch all the new messages for all email accounts |

    | Search and filter | You can search your mailbox for specific keywords or filter
    the mail based on sender, recipient, subject etc from this section |

    | Write | Click here to open Compose dialog and write a message |

    | Address book | This holds all contact details from different mailbox accounts
    in a single place |

    | Mail folder list | This section holds all the mail folders. If you have enabled
    unified mailbox, you’ll see each mailbox as a folder |

    | Mail list | This is the section that shows a list of all mail in a chronological
    order. Just click on the column header to sort them based on different criteria
    |

    | Chat | All the platform profiles such as Facebook, Twitter etc (if linked to
    Thunderbird) are visible inside this box |

    | Mail display | This section displays a detailed view of the mail selected in
    the pane above. You’ll see the reply, forward and delete buttons here |


    Social chat with Thunderbird

    To add chat accounts to Thunderbird, click on the Chat button next to the Email
    button on Thunderbird’s launch page. After you click the link, you’ll see a pop-up
    with supported services. Facebook, Twitter, Google Talk, IRC and Yahoo are all
    supported. Select the account to add and click Next. On the next page, enter the
    username and then on the next page, select the alias. Finally, click the Finish
    button. You will then be taken to the website of the account you chose to authenticate
    access to your account. Once authenticated, you can view all your conversations
    in a new tab. Another aspect of Thunderbird chat is that all the chat conversations
    are included in search. So, if you are looking for a keyword, just type it and
    the results you get will include results from your past conversation history.


    Use Thunderbird as your mail client

    Setting up a new account with Thunderbird is easy. Start by clicking on the ‘Email’
    link on its launch page. You then need to provide your username and password for
    your email provider and your email address (Fig 1). Thunderbird determines connection
    details (such as ports, server names, security protocols, etc) by looking up your
    email provider and can usually provide the account details.


    You need to configure your account manually if your email provider is not listed
    in Thunderbird’s database, or if you have a non-standard email configuration.
    To configure an account manually, you need the following details: incoming mail
    server and port (eg ‘pop.example.com’ and port 110), outgoing mail server and
    port (eg ‘smtp.example.com’ and port 25), and the security setting for the connection
    with the server (eg ‘SSL/TLS’ and whether or not to use secure authentication).
    Fill in these details and you are good to go.


    “Setting up a new account with Thunderbird is easy. Start by clicking on the ‘Email’
    link on its launch page”


    **Fig 1 (above)** Input your name, address and password details to link a new
    account

