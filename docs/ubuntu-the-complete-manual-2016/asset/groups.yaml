    ## 在 Ubuntu 中共享文件


    ### Ubuntu 基础知识


    ### 标准工具栏

    在右上角，你会找到设置、添加文件和帮助选项的快速链接。


    ### 共享文件

    在这里，你可以看到 Samba 共享下所有可用文件的列表。


    ### 权限

    如果你希望你共享的目录是可写/可见，只需勾选相应的复选框。


    ### 菜单栏

    此部分包含添加要共享文件的基本设置，并设置如服务器组和查看所有 Samba 用户等偏好。


    ### 共享名称

    你可以在此部分为上方选择的目录设置名称。


    ### 保存或取消更改

    点击确定以将更改保存到 Samba 配置文件并开始共享。如果你点击“取消”，更改将被丢弃。


    ### 描述

    在此处为共享目录设置描述。


    ### Samba 共享目录

    一旦点击“添加文件进行共享”，就会弹出一个窗口。在“目录”部分，只需浏览并选择你想要共享的目录即可。


    使用 Samba GUI 共享文件 学习使用 Samba 共享文件


    - **guest ok:** 允许客户端在不提供密码的情况下连接到共享。

    - **read only:** 决定共享是只读的还是授予写入权限。只有当值为 no 时（如示例所示），才允许写入权限。如果值为 yes，则对共享的访问为只读。

    - **create mask: ** 决定创建新文件时将拥有的权限。


    现在 Samba 配置完成，需要创建目录并更改权限。在终端中输入：


    `$ sudo mkdir -p /srv/samba/share`

    `$ sudo chown nobody:nogroup /srv/samba/share/`


    最后，重启 Samba 以启用新配置：


    `$ sudo restart smbd`

    `$ sudo restart nmbd`


    ## 使用“磁盘”管理驱动器


    使用 Ubuntu 的磁盘工具管理硬盘、SSD 和可移动介质。


    磁盘可以管理本地和可移动驱动器，对它们进行重新分区、备份镜像以及从镜像恢复。这是一个直观的工具，左侧是设备列表，右侧是当前选中设备的详细信息。你可以用它查找硬盘的型号和大小、分区数量、序列号、健康状态
    (SMART) 等更多信息。用户在需要对硬盘、SSD 或 USB 接口的可移动质质存储设备进行操作时经常会启动磁盘。它对驱动器卷的直观可视化非常有用。如果你不了解主分区或扩展分区，在查看磁盘中“卷”标签下的图形方案后，你会立即理解这一概念。你只需点击几次鼠标即可完成许多高级任务，例如对硬盘进行基准测试、进入待机模式、创建或删除分区等。


    磁盘的另一个功能是可以创建驱动器镜像 (*img) 并此类镜像恢复到其他驱动器。此功能允许你将所有数据、逻辑结构和引导加载程序克隆到新的硬盘上。有时新硬盘到达时完全没有分区，磁盘会将它们显示为标记为“未知”的单调矩形。现在你可以选择要操作。如果你点击上方的“齿轮”按钮并格式化整个磁盘，你只会创建一个分区表而不是卷。有旧的
    MBR（主引导记录）类型和现代的 GPT（GUID 分区表）。前者兼容所有设备，而具有 UEFI 引导的新型 PC 以及大硬盘 (>2TB) 要求 GPT。接下来，你可能想通过点击下方特定的卷“齿轮”按钮并再次选择“格式化”选项来创建实际卷。如果你计划从
    Windows 访问磁盘，请使用 NTFS 文件系统。否则，对于仅限 Linux 的使用，最佳选项是 Ext4。


    格式化 USB 移动驱动器


