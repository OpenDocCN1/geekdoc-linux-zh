    ## Ubuntu 基础


    ### 释放归管理器

    **74 利用这个内置在你的 Ubuntu 系统中的一个小配件**


    归管理器（Archive Manager）是一个用于打开压缩文件和创建自定义归包的小工具。多年前，当人们的硬盘空间很小时，归管理器一直是王者。它现在仍然是标准桌面体验的重要部分，因为它是解压下载的包或将多个文件合并为一个文件的简单方法（图
    1）。


    标准的 Ubuntu 归管理器遵循通用命名策略，因此没有特殊名称（与“磁盘”、“备份”等并列）。不过，Ubuntu 是从 GNOME 桌面引入了它，在那里，归管理器被称为
    File Roller。你可以通过在 Ubuntu 终端中运行 `$ file-roller` 命令来检查它。当单独启动时，File Roller 界面看起来非常空旷，因为它设计的设计是在窗口最大的区域显示文件内容。


    ### 利用额外功能


    File Roller 拥有额外功能，并与 Ubuntu 的文件管理器 Nautilus 具有良好的集成。这意味着你只需右键点击任何支持的压缩包并从菜单中选择“提取此处”（Extract
    Here），即可进行解压。你还可以从 Nautilus 拖拽文件和目录到 File Roller 窗口以将其添加到归包中。应用程序会提示你输入归包名称并提供高级选项，包括密码保护（仅限
    ZIP 和 CBZ）。你可以仅保护文件和目录，这样就可以查看归包内部的文件列表，但为了打开或提取此类包中的任何内容，必须提供正确的密码（图 2）。你还可以保护归包的文件和目录列表，或将归包分割为固定大小。


    “它仍然是标准桌面体验的重要部分”


    **75**

    **Ubuntu 基础**

    **75 释放归管理器**


    ### 打开或查看归包

    打开归包非常简单：只需双击它，或在归包的右键菜单中使用“用归管理器打开”。如果它的图标看起来像一个盒子，意味着该归包很可能被支持。File Roller 支持
    ZIP, RAR, GZIP, BZIP, 7Z, JAR, XZ 等许多格式的打开和压缩，还支持只读模式下的 AR 和 ISO 格式。你也可以反过来操作：打开空的
    File Roller 窗口并使用它的“打开”按钮浏览并选择归包。打开归包和查看归包之间是有区别的。虽然前者的含义显而易见，但后者让你能够浏览整个文件列表并在单一视图中查看整个归包的内容。例如，如果你的归包有很多子目录，你可能想选择“查看>
    查看文件”（View> View Files）并作为单个列表查看所有内容。File Roller 添加了额外的“位置”列来帮助你查看哪个文件在何处。


    你可能创建归包的原因各异。首先，归档的文件总是比原始文件小，因此最简单的目标是节省磁盘空间。这对于照片和视频没有太大帮助，因为它们已经压缩过了，所以将它们添加到归包中并不节省空间。然而，办公文档或未压缩的媒体文件（DOC,
    XLS, WAV, TIFF 等）显示出惊人的压缩率，高达 90-95%。其次，归档将许多文件合并为一个归包，这非常方便。例如，复制一千个小文件可能花费很长时间（这会让大多数文件系统发疯），但当它们压缩成归包时，你只需要等待几秒钟。要将带有符号链接和
    UNIX 特有属性（如权限和额外标志）的文件传输到 FAT32 或 NTFS 卷，你应该先对这些文件进行归档。使用项目右键菜单中的“压缩”（Compress）项压缩任何文件或目录，或使用
    File Roller 内部的相应功能。


    **图 2** 使用密码保护文件

    **图 1** 使用归管理器压缩文件


    **76**

    **Ubuntu 基础**

    **76 使用磁盘使用分析器**

    **使用专用配件找出你的可用磁盘空间去哪儿了**


    文件和目录倾向于增长并占用大量的磁盘空间。如今，即使你决定在那里存放电影收藏，几个 TB 的空间也会变得捉襟。有时你没有足够关注自己实际下载、复制或存储了多少内容，这意味着你的硬盘被大量文件堆满，耗尽了你的可用空间。磁盘使用分析器（Disk
    Usage Analyzer），也称为 Baobab，是标准 Ubuntu 桌面自带的一个工具。它分析你提供给它的任何目录并显示一个彩色环形图，其中每个切片的大小对应相应子目录的大小（图
    1）。这是一个优美的图形化表示，具有即时实用性，让你知道硬盘上哪些内容占用了最多的空间。有时它可能只是一个被忽略的临时目录、一个巨大的日志文件，或者只是增长得太快的媒体库。


    ### 获取即时结果

    通过在 Ubuntu Dash 中搜索此名称或“Baobab”来启动磁盘使用分析器。启动后，你将看到设备和位置的列表。如果驱动器已挂载，它将包含在你的根分区的统计中。例如，如果你在一个较小的根分区（例如
    20GB）内挂载了一个 4TB 的驱动器，生成的环形图将你的系统目录显示在一个极细的切片中。因此，如果你想分析 Ubuntu 本身的组成部分，你需要卸载任何外部媒体。要获取主目录的结构，只需点击其图标并等待磁盘使用分析器完成工作——这取决于文件的数量，可能需要一些时间。


    “这是一个优美的图形化表示，具有即时实用性”


    **77**

    **Ubuntu 基础**

    **77 使用磁盘使用分析器**


    ### 深入统计数据

    对于想要分析的目录没有限制。磁盘使用分析器允许你打开任何目录，无论是本地还是远程的。点击右上角的型“齿轮”图标打开所需的位置。如果是远程目录，请使用“扫描远程文件夹”（Scan
    Remote Folder）选项并提供正确的地址，例如 Samba 共享地址以 smb:// 开头。当你看到生成的环形图时，将鼠标悬停在切片上以查看详情。点击切片以深入并将其设置为顶级目录。图表将自动调整，你将看到更多关于目录权重的详细信息。屏幕左部分通过树形视图补充图表，并带有使用百分比、大小和数量的额外列。


    ### 切换图形视图

    这种环形图并不是你获取数据图形化表示的唯一方法。在应用程序的右下角，你会注意到两个按钮，允许你在环形图和树图（treemap）模式之间切换。树图是另一种数据可视化方法，侧侧重于单元的大小。


    环形图和树图的主要区别在于，后者将所有单元与子目录和大型文件显示在一起。当你需要估计不同单元的相对大小时，这种方法实际上更好。树图在第一次看时可能很难理解，但当你知道它是如何构建时就会很有帮助。磁盘使用分析器首先为你的顶级驱动器或目录绘制最大的矩形，然后根据内部内容的大小递归地划分为较小的矩形。较大的矩形会立即显示名称，其他矩形在鼠标悬停后将提供更多信息。


    **图 1（上文）** 你的使用数据通过磁盘使用分析器进行可视化分解


