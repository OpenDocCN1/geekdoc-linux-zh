    ## Ubuntu essentials


    ### Dual boot with Ubuntu


    Select target drive for the bootloader


    This option only requires your attention if it’s the case that you have more than
    one hard drive inside or attached to your computer. Otherwise, if you had previously
    installed custom operating systems onto your Windows desktop PC or laptop, you
    might find it useful to get to grips with this option as well. First of all, in
    order to boot correctly, Ubuntu needs a properly installed GRUB bootloader. You
    can install it on a hard drive (eg /dev/sda) or on a drive partition (eg /dev/sda3).
    If you have a relatively modern UEFI/Secure Boot setup, then Ubuntu will act differently:
    it will install GRUB2-EFI on /dev/sda1, which is a FAT32 partition, and mount
    it as /boot/efi. Furthermore, a special loader entry in your computer’s UEFI internals
    will be made by the means of the ‘efibmgrmgr utility. Don’t worry though, Ubuntu
    does all of this automatically.


    Many older articles concerning the installation of Linux strongly advise users
    to create a swap partition with a size twice that of the RAM volume (for instance,
    2GB if you have 1GB of RAM). However, modern computers generally have larger amounts
    of RAM and therefore this rule is not that important any more. That being said,
    you could go without the swap partition altogether unless you feel that you really
    need it. The separate partition for your home folder in Ubuntu is another aspect
    to consider. If you go with a single root partition, that means all your personal
    files and settings will be kept together with the rest of the system on a single
    partition (/), just like if you only had the C: drive in Windows for storing everything.
    Sometimes it is more sensible to create another partition and mount it as /home
    – this means that your files and settings will not get lost, even if you decide
    to reinstall or remove Ubuntu in the future.


    Create Ubuntu partitions “If you go with a single root partition, that means all
    your personal files and settings will be kept together”


    **Fig 2 (above)** Install GRUB bootloader onto a hard drive or drive partition


    ### Customising the desktop


    Change desktop settings and add a personal touch to Ubuntu’s exterior


    The default desktop environment in Ubuntu is called Unity. It provides users with
    a consistent and easy-to-use graphical interface for performing everyday tasks.
    The default settings are quite simple, based on studies into the features people
    find comfortable and intuitive. However, with so many people with so many different
    tastes, Unity allows all essential features, such as appearance and behaviour
    of the desktop, to be customised to the user’s liking.


    This is done with the Look and Feel settings, localisation, input options as well
    as privacy-related settings. Some of the above don’t affect Ubuntu behaviour –
    such as various aesthetic settings (theme, icons), but some do.


    It is worth mentioning that sometimes people need more precise control over their
    Ubuntu installation and require some extra features that are not part of the out-of-the-box
    Ubuntu. For that reason, there are different ways to work around it in the form
    of commands ($ gsettings) and even stand-alone tweakers (eg Unity-tweak-tool).
    Such extras let you change advanced settings like fonts, window control placement,
    desktop effects and more. Next you can find out how you can change the most common
    settings and resolve frequently occurring issues.


    **01** The taskbar panel or the Launcher works just fine, but sometimes you need
    to get rid of some of the default icons and add your favourite apps instead. To
    remove an icon, right-click on it and select the ‘Unlock from Launcher’ option.
    To add an application to the taskbar you first need to find it in the Dash and
    drag it to the desired position on the taskbar. You can also drag and rearrange
    the existing icons on the taskbar. Use the Appearance>Look section in System Settings
    to change the taskbar icon size. If you make it smaller, more icons will fit there,
    which is helpful for small displays. Also, check the Behaviour tab for auto-hiding
    option, enabling multiple workspaces and more.


    Adjust the Launcher


    ### Unity Tweak Tool


    It’s not included right out of the box, but it is instantly available in the standard
    Ubuntu online repository. Get it with $ sudo apt-get install unity-tweak-tool


    ### Appearance settings


    Here you can change GTK style, window decoration theme and fonts separately, change
    mouse cursor look and move window buttons to another edge of a window


    ### Change specific settings


    Unity is made up of various different elements, including the main taskbar which
    is along the right side of the screen, the main menu with a search feature (Dash),
    the top panel and the task switcher


    ### System settings


    Unity Tweak Tool offers advanced system settings, eg enabling desktop icons, extra
    security measures, control over scroll bars as well as mouse behaviour


    ### Window manager


    There are ways to change the behaviour of window manager in Unity. Shadows, translucency,
    animations, hot corners, snapping, focusing rules, etc


    ### A Registry Editor for Ubuntu


    Use the command $ sudo apt-get install dconf-editor to install a twin panel settings
    manager. It behaves similarly to the Registry Editor in Windows OS and lets you
    adjust many hidden settings


    ### Default wallpaper


    You can set the default Ubuntu wallpaper to a photo (or maybe a drawing) of your
    choice in the Appearance section of the standard System Settings


    ### Change the theme


    This defines how various UI controls look, and this includes buttons, scroll bars,
    menu background, window decorations and lots of other details


    “With so many people with so many different tastes, Unity allows all essential
    features, such as appearance and behaviour of the desktop, to be customised”


    Tweak desktop settings Use related sections in Ubuntu’s System Settings app


    **Fig 1 (above)** You can use hot corners to streamline your Ubuntu experience


    **03** Changing the interface theme can dramatically alter the working experience.
    It is perfectly safe: you don’t change how your desktop works, you change how
    it looks. By default, Ubuntu ships with three themes: Ambiance (the default one),
    Radiance (light colours) and High Contrast (for visually challenged). You can
    add more by installing new themes via command line (adding a PPA with a theme
    and installing its package for example), or download themes manually from sites
    like gnome-look.org. Ubuntu looks for themes in the system-wide /usr/share/themes
    directory and in ~/.themes inside your home.


    Change look and feel


    - Ubuntu includes certain mechanisms for gathering users’ data and collecting
    statistics – of course, this is meant entirely for the sake of better usability
    in future Ubuntu releases. Some find this behaviour controversial, so let’s adjust
    it a little. In System Settings>Security and Privacy go to the Files & Applications
    tab and uncheck or maybe turn completely off files and applications usage statistics.
    On the Search tab you can actually turn the online search results in Unity Dash
    on or off. For example, if you don’t like shopping suggestions while looking for
    a local app on your computer, simply turn it off.


    Change privacy settings

