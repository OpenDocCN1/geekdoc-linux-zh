- md: "\n## Ubuntu apps\n## 20 LibreOffice essentials\n\n15 It seems fairly natural\
    \ for the Enter key to move you down a row of cells and that’s what Calc does\
    \ by default. However, you can actually change the behaviour of the Enter key\
    \ by going to Tools > Options > LibreOffice Calc, then General to have it move\
    \ along a row instead.\n\n### Change Enter key\n\n16 If you have a lot of data,\
    \ rows or columns you can sometimes find yourself browsing the spreadsheet not\
    \ always able to remember or dewine what cell is for what. By selecting a row\
    \ or column you always want to be visible, go to Window then Freeze to keep it\
    \ always on the top or on the left as you browse the spreadsheet.\n\n### Freeze\
    \ columns in place\n\n## Miscellaneous \n\n17 When using Impress for presenting\
    \ slides, you will often be hooked up to a projector or television that either\
    \ mirrors or acts as an extension to your laptop. Impress has a neat feature where\
    \ the actual presentation will be shown on the big screen, while you can turn\
    \ on a presenter console just for your laptop display that shows you what’s coming\
    \ up in your presentation, along with notes.\n\n### Presenter mode\n\n18 Perhaps\
    \ you need to paste into a document a paragraph from another language. The rest\
    \ of the document is in English, so the spell check flips out at unfamiliar words.\
    \ Highlight the paragraph, click Tools > Languages and then select a language\
    \ for this section of the document, and only this section.\n\n### Switch between\
    \ languages in spell-check on the fly\n\n19 There is a completely separate application\
    \ for LibreOffice called Math that is not, in fact, database software, but actually\
    \ a way to draw up mathematical equations that can then be inserted into other\
    \ LibreOffice software. This is good if you’re writing an academic paper with\
    \ ridiculous maths that needs to be readable.\n\n### Insert readable formulae\n\
    \n20 PDFs can be edited in LibreOffice. Simply import them using something like\
    \ Writer and it will dump the PDF into the Draw application. You can edit text,\
    \ change pictures and even the general formatting of the PDF. Once it’s done,\
    \ Draw allows you to export the working file as a PDF for everyone to use.\n\n\
    ### Using PDFs\n\n## Ubuntu apps\n## Text editing with gedit\n\nText Editor (aka\
    \ gedit) is the default GUI text editor in the Ubuntu OS and the GNOME desktop\
    \ environment. It is UTF-8 compatible and supports most standard text editor functions\
    \ as well as many advanced features like multilingual spell-checking, extensive\
    \ support of syntax highlighting, and a large number of official and third-party\
    \ plug-ins. With multiple character sets, Text Editor can play a versatile role\
    \ – you can use it to prepare simple notes and documents, or create source code\
    \ using its advanced features just like an integrated development environment.\
    \ gedit is installed by default on Ubuntu 16.04 and can be launched via Dash or\
    \ an application shortcut. If you prefer the command line, you can use the gedit\
    \ command to directly interact with the tool.\n\nTo open a specific file with\
    \ gedit, type gedit <filename> at the command prompt. To open multiple files,\
    \ type gedit <filename1> <filename2> and so on. You can also open a file at a\
    \ specific line number by including +<line number> in the file path, like this:\
    \ sudo gedit +21 /etc/apt/sources.list.\n\ngedit offers several helpful options,\
    \ under Edit > Preferences, that you may want to review. For example, gedit automatically\
    \ creates a backup copy of files you edit. If you are running low on space, however,\
    \ you can disable this: just go to Edit > Preferences > Editor tab and deselect\
    \ ‘Create a backup copy’.\n\n### Understand its features and learn about its many\
    \ purposes\n“Advanced features include multilingual spell-checking, extensive\
    \ support of syntax highlighting, and a large number of official and third-party\
    \ plug-ins”\n\n## Ubuntu apps\n## Text editing with gedit\n\n### Discover the\
    \ user interface\n\n**New file**\n- **New file**: This button lets you create\
    \ a new file in gedit. As you click this, new tabs will be created. You’ll be\
    \ asked for location when saving files.\n- **Search file**: The magnifying glass\
    \ icon lets you search a file, and the next icon with a pencil on top lets you\
    \ replace the searched term with an alternative one.\n- **Save file**: After you\
    \ are done with editing the file, click this button to save your work. If it is\
    \ a brand new file, you’ll also be asked to enter the location.\n- **Undo/redo\
    \ buttons**: You can undo your actions in the file or choose to redo them using\
    \ these buttons.\n- **Open file**: You can open existing files from here. Just\
    \ click on the button and select the file(s) you want to open.\n- **Status bar**:\
    \ This bar shows the file details, such as encoding, current cursor position,\
    \ tab width etc in real time.\n- **Print file**: This button lets you print the\
    \ file directly from the application. You’ll be prompted to add a printer if you\
    \ haven’t already.\n- **Edit buttons**: You’ll find the edit options (Cut, Copy\
    \ and Paste) here. You can also use common keyboard shortcuts (Ctrl+X, Ctrl+C\
    \ and Ctrl+V) to accomplish these actions\n\n## Ubuntu apps\n## Text editing with\
    \ gedit\n\n### Handling files with gedit\n\n01 We’ve already seen how to open\
    \ files in gedit via the command line. So let’s understand how to manage files\
    \ in gedit. To open a file or set of files in the gedit GUI, click the open button\
    \ or press Ctrl+O. In the dialog, select all files you want to open and click\
    \ Open (Fig 1). By default, gedit provides easy access to your most used files.\
    \ To open one, click the downward-facing arrow to the right of the open button.\
    \ Once you have selected the desired file, it will open up in a brand new.\n\n\
    “By default, gedit provides easy access to your most used files. To open one,\
    \ click the downward-facing arrow to the right of the open button”\n\n02 The Find\
    \ tool can help you locate specific sequences of text within your file. To open\
    \ the search window, click Menu > Find, or press Ctrl+F. This will move your cursor\
    \ to the start of the search window. Type the text you wish to search for in the\
    \ search window. As you type, gedit will begin highlighting text that matches\
    \ what you have entered. You can scroll through the search results using the up/down\
    \ arrow keys or by pressing Ctrl+G. You can also highlight a portion of text with\
    \ your mouse and press Ctrl+F. The text you’ve highlighted will automatically\
    \ appear in the search window.\n\n### Syntax highlighting \n\n03 If you would\
    \ like to use gedit for text editing, you have the option to highlight the lines\
    \ of code you write. gedit uses the GtkSourceView for syntax highlighting. It\
    \ uses .lang files to define the highlighting schemes. The .lang file for a specific\
    \ programming language is located in the /usr/share/gtksourceview-3.0/language-specs/\
    \ folder.\n\nYou can enable code highlighting via the menu by going to View >\
    \ Highlight Mode, or via the lower status bar. The status bar, enabled via the\
    \ View menu, displays programming language options for many types of sources,\
    \ scripts, markup and scientific formats.\n\n“Locate specific sequences of text\
    \ within your file”\n\n### Handling text\n**Fig 1 ** Use this dialog box to navigate\
    \ to text file you want to open\n\n### Uncover key features\nDive deeper into\
    \ gedit’s capabilities. You can also open files that are located on other machines\
    \ with gedit. However, prior to opening a file on a server within gedit, you need\
    \ to know some technical information about the server. For example, you’ll need\
    \ the IP address or URL of the server, and may need to know what kind of server\
    \ it is (HTTP, FTP etc). Once you have all the necessary information, go to the\
    \ Open dialog and click the icon to enter the IP address/URL of the server. Select\
    \ the file and click Open. If you have the required privileges, the file should\
    \ open up right away.\n\n04 Plugins greatly enhance the power of gedit and are\
    \ accessed via Edit > Preferences > Plugins (Fig 2). More than a dozen plug-ins\
    \ are pre-installed and can be enabled/disabled here. Extra plug-ins are available\
    \ via the Internet. Here are just two of the plug-ins that can help you with your\
    \ day-to-day activities:\n- Tag List: Displays common tags in a side pane and\
    \ allows for easy insertion into the file.\n- External Tools: This allows the\
    \ user to run external commands on the file being edited from within gedit itself.\
    \ Once this plug-in is enabled, the user can select custom tools from the Tools\
    \ menu. Note that this is not enabled by default.\n\n**Fig 2 **Enable and disable\
    \ plugins using the gedit Preferences dialog\n"
