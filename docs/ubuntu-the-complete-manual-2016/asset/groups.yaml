    ![](img/a6bf9da4751f37b25a0d6611dc73918d_9_0.png)


    **入门指南**


    了解 Ubuntu


    与其他任何操作系统一样，Ubuntu 也可以在你计算机的虚拟机中运行。通过这种方式，你甚至无需重启电脑就可以尝试 Linux，尽管你应该注意，虚拟机运行的速度比直接在电脑本身上运行操作系统要慢。


    要创建一个 Ubuntu 虚拟机，你首先需要下载并安装 VirtualBox。使用它创建一个新的虚拟机，选择 Ubuntu 操作系统，并在提示时提供你从 Ubuntu
    官网下载的 ISO 文件。


    安装过程非常直观易懂，你可以在虚拟机中进行安装，其操作方式就像在在真实电脑上安装 Ubuntu 一样。


    “你甚至无需重启电脑就可以尝试 Linux”


    **图 3（下方）** 安装 Ubuntu 或使用试用版尝试


    ![](img/a6bf9da4751f37b25a0d6611dc73918d_10_0.png)


    **入门指南**


    了解 Ubuntu


    采用正式版本


    新版本每六个月发布一次，并提供18 个个月的支持


    如前所述，Ubuntu 是一个非常流行的 Linux 发行版，拥有多年的经验和庞大的用户群。在熟悉 Ubuntu 的基础内容后，是时候查看 Ubuntu 的正式版本了。在开始使用
    Ubuntu 之前，你需要获取 Ubuntu 安装镜像。此外，你必须确保你的系统满足最低要求。获取 Ubuntu 最常用的方法是直接从官网 ubuntu.com/download
    下载 Ubuntu DVD 镜像。要下载并安装它，你只需要选择你需要 32 位还是 64 位版本，然后点击“开始下载”。


    理解 Ubuntu 提供的两个版本很重要：32 位和 64 位。它们在计算机处理信息的方式上有所不同。因此，如果你的电脑拥有 64 位处理器，你需要安装 64
    位版本。另一方面，如果你使用的是较旧的电脑，或者不知道电脑处理器的类型，建议选择安装 32 位版本。


    虽然安装 Ubuntu 需要 5GB 的硬盘可用空间，但建议准备 15GB 或更多。这意味着你有足够的空间安装额外的应用程序，以及存储你自己的文档、音乐等。


    如果你连接了网络，安装程序现在会询问你是否想要“在安装时下载更新”。强烈建议执行此步骤。


    在 Ubuntu 安装过程中，连接网络非常重要。如果你没有连接网络，安装程序会要求你选择无线网络（如果有）。在这种情况下，你可以按照以下三个步骤操作……


    - **01** 选择“连接到此网络”并从列表中选择你的网络。

    - **02** 在“密码”字段中输入你路由器的 WEP 或 WPA 密钥。

    - **03** 然后点击“连接”继续。


    网络连接


    **图 4（下方）** 确保在安装前有可用磁盘空间


    ![](img/a6bf9da4751f37b25a0d6611dc73918d_11_0.png)


    **入门指南**


    了解 Ubuntu


    Ubuntu 安装程序将自动检测机器上已安装的任何操作系统，并提供适用于你系统的安装选项。请注意，以下选项完全取决于你的特定系统，并非所有选项对你都可用：


    - 安装 Ubuntu

    - 不安装直接尝试 Ubuntu

    - 与其他操作系统并存安装 Ubuntu

    - 其他


    在上述四个选项中，首选的是“将 Ubuntu …… 升级到 16.04”。这是因为该选项允许你保留电脑上所有珍贵的文档、音乐、图片和其他任何个人文件。已安装的软件将尽可能保留，但系统级设置将被清除。


    如果你想擦除整个磁盘，可以使用“擦除磁盘并安装 Ubuntu”选项。如所预期，这将删除该磁盘上安装的任何现有操作系统，并在其位置上安装 Ubuntu。


    当你选择“其他”选项时，你可以在安装 Ubuntu 之前根据需要配置分区。


    这里需要注意的是，为了缩短安装时间，用户配置所有重要的用户细节（如用户名、密码、键盘设置、默认时区等）时，Ubuntu 会在后台继续安装过程。


    Ubuntu 安装


    你可以与另一个操作系统并存安装 Ubuntu 或替换它


    “在成功安装 Ubuntu 后，你可能还想加密你的主文件夹。这花费的时间很少且非常直观。这被认为是在你进一步操作之前的一个重要步骤”


