    ## 入门

    ### 了解 Ubuntu

    **8**

    了解 Ubuntu

    许多想从 Windows 迁移到 Linux 发行版的人选择 Ubuntu 作为他们的第一步。它通过 Unity 提供了一个整洁、吸引人的图形化用户界面（GUI），并且具有极高的易用性。它是学习命令行和创建更具定制性的工作区的完美环境。同时，你仍然可以获得在
    Windows 和其他桌面系统中熟悉的许多优势。本书将介绍 Ubuntu 的美妙与强大。从默认软件到从软件中心下载的最佳开源软件（FOSS）应用程序，我们将带你浏览顶部的程序和应用，很快你就能熟练使用
    Ubuntu 了。


    了解 Ubuntu

    这种免费的开源操作系统在近年来获得了巨大的动力。它是一个易于使用的操作系统，遍布世界角落。最棒的是，它对硬件非常友好，你可以将其安装在三四年前的电脑上，且运行流畅。它拥有社区和专业支持，Ubuntu
    适用于桌面和服务器。但不仅如此：Ubuntu 无处不在。几乎所有的电脑制造商都在出基于 Ubuntu 的型号。


    Ubuntu 运行良好。很少其他 Linux 发行版能提供同样的长期支持。它非常上手，即使你来自 Windows 世界（见图 1）。Ubuntu 非常稳定。对于大多数用户来说，开箱即用。


    **8**

    ![](img/a6bf9da4751f37b25a0d6611dc73918d_8_0.png)

    ### 入门

    ### 了解 Ubuntu

    **9**

    01 如果使用 DVD，请将 DVD 插入驱动器并重启电脑。电脑随后将从移动介质启动，然后你选择语言。还会有安装 Ubuntu 或从 DVD 尝试的选项。


    02 如果你想使用 U 盘，请注意最新的电脑可以从 U 盘启动。在这里你也将看到一个欢迎界面，提示你选择语言并提供安装 Ubuntu 或从 U 盘尝试的选项。


    03 无论使用 DVD 还是 U 盘，下一步都是选择你的首选语言，然后点击“尝试 Ubuntu”。你的实时桌面将会出现（如左图所示，见图 2）。


    04 最后，当你准备好安装 Ubuntu 时，只需双击桌面上的图标：“安装 Ubuntu 16.04 LTS”。


    **在安装之前尝试 Ubuntu**

    ### 现场启动和虚拟机

    开始学习 Ubuntu 的简单方法之一是创建启动 U 盘、CD 或 DVD。将 Ubuntu 放入其中后，你可以将 U 盘或光盘插入任何电脑，然后重启它。电脑随后将从移动介质启动，你可以在不对硬盘进行任何更改的情况下使用
    Ubuntu。


    你可能想如何创建启动 Ubuntu U 盘或光盘。为此，你可以从 Ubuntu 网站下载最新的 Ubuntu 磁盘镜像。使用 UNetbootin 工具将
    Ubuntu 放入 U 闪存盘或将下载的 ISO 镜像刻录到光盘。你现在只需要从提供的移动介质重启电脑，并选择“尝试 Ubuntu”选项即可。


