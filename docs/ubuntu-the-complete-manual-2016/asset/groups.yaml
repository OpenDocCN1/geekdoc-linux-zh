    **92**


    **Ubuntu apps**


    Explore the Ubuntu Software Centre


    On the home screen of USC you will find the History tab; when clicked, this shows
    the ‘All Changes’ page by default. Under the navigation bar are tabs for All Changes,
    Installations, Updates and Removals (Fig 5). The entries are grouped in branches
    and labelled by the day in reverse chronological order; (newest on top). Clicking
    anywhere on a branch (or pressing the spacebar when it is selected) should expand
    it if it is collapsed, and collapse it if it is expanded.


    The branch on which the recent activity has occurred is opened by default in the
    USC history screen.


    Updates and past downloads: Check out the History tabs


    **Fig 5** The History tabs reveal past updates


    ![](img/a6bf9da4751f37b25a0d6611dc73918d_92_0.png)


    **93**


    **Ubuntu apps**


    Explore the Ubuntu Software Centre


    “The Software Centre contains a list of programs provided by Ubuntu itself” As
    well as offering a vast selection of free software to download, the Ubuntu Software
    Centre provides the option to purchase and install commercial software.


    The Software Centre contains a list of programs which are provided by Ubuntu itself,
    along with software offered by Canonical’s partners (those programs which abide
    by the software rules of Ubuntu). The number of programs available in the Software
    Centre continues to grow rapidly, so there’s a lot of choice. In simple terms,
    the Ubuntu Software Centre is the equivalent of the Google Play Store (or Apple
    App Store) for Ubuntu, where you can find thousands of programs, tools and applications
    which can be installed with just a few clicks.


    One-stop shop for Ubuntu


    The items displayed in the History tab contain the icon of the software, name,
    plus the date and time of installation. Under the Installation tab, you will find
    all the installed applications grouped by their installation dates. The Updates
    tab, on the other hand, lists all the updated applications along with their update
    dates. Finally, the Removal tab displays the list of applications which have been
    uninstalled from the system.


    In the History tab, the search bar present on the top right can search for applications
    which are already installed or have been removed from the system. Whenever the
    Backports channel contains a version of any application which is newer than the
    one installed, an Updates item appears in the last navigation bar. The Updates
    section displays the number of application updates available, along with an Update
    All button. The list contains the icon, title, the newer version of the application
    and an Update button at the far right end.


    When an item is selected, pressing the Enter key should activate its Update button;
    when an update is installed or waiting to be installed, its Update button should
    be inactive.


    Installing programs: Get your hands on brand new programs


    Now we’ve covered navigation and layout, let’s move on to installation. In this
    example, we’ll install OpenJDK Java 7 and the Eclipse IDE. Select the Developer
    Tools category from the home screen of USC. This will take you to the Developer
    Tools page, which is further subcategorised. Click on Java (cup of coffee icon),
    which takes you to the page where Java-related items are displayed in a list view
    (Fig 6).


    Now select the item OpenJDK Java 7 Runtime and on the right side you will find
    the Install button; click it to install the packages. You’ll then be prompted
    to enter your administrator password; type the correct password and hit Enter
    to start the installation.


    During installation, you will find the progress icon graphically displaying the
    status of the installation. Once it’s complete, you will be redirected to the
    success page, which also contains the Remove button in order to uninstall the
    program.


    Click the Back button to search for the IDEs section; now click the IDEs icon
    to see the list of IDEs present in USC. Type ‘Eclipse’ in the search bar to search
    for the Eclipse IDE.


    “There are many programs to install, such as chat apps, file sharing and more”


    **Fig 6** Java install options are listed on this page


    ![](img/a6bf9da4751f37b25a0d6611dc73918d_93_0.png)


