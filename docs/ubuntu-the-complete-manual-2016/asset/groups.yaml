    ## 使用 Déjà Dup 安全文件


    ## Ubuntu 基础


    ### 04

    Déjà Dup 有一个局限性：它是一个“全或无”工具，意味着你无法提取特定的文件和目录。相反，你被迫复制或下载整个备份快照。要解决这个问题，请使用 Nautilus
    右键菜单中的“恢复缺失的文件”项（图 1）。这对于包含在备份中的目录有效，并允许你恢复单个文件。Déjà Dup 是 Duplicity 工具的前端界面，这让你可以在无需启动
    Déjà Dup 的情况下提取备份快照。这对于脚本编写非常有用，或者当你通过 SSH 远程访问备份位置时可能有用。提取的语法如下：


    ```bash

    $ duplicity restore --no-encryption “file:///path/to/snapshot” "/where/to/extract”

    ```


    Duplicity 语法也可以提取单独的备份项目（参见 $ duplicity --help）。


    ### 访问备份副本


    ### 05

    最简单的方法是使用你的 Dropbox、MEGASync 或其他云同步目录作为备份位置。这样，一旦 Déjà Dup 完成工作，你的数据就会上传到云端。然而，让我们尝试直接在线备份，例如备份到
    Amazon S3 云（图 2）。要实现这一点，你只需要在 Amazon 有一个合适的账户以及一些额外的软件包。命令如下：


    ```bash

    $ sudo apt-get install python-boto python-cloudfiles

    ```


    之后，可用存储位置列表将增加 Amazon S3 和 Rackspace 云。


    备份到云端

    “Déjà Dup 有一个局限性：它是一个‘全或无’工具”

    **图 2（下方）** 轻松管理你的备份位置


    ## Ubuntu 基础


    ### 使用启动盘创建器


    ### 使用启动盘创建器

    创建一个带有 Ubuntu 或几乎任何其他 Linux 的可启动 USB 盘


    这里最可能出现的第一个问题是：“你到底需要启动盘做什么？”从历史角度看，Linux 发行版是以 CD 光盘分发的，你应该从光盘中安装。后来，随着可刻录 CD/DVD
    光盘时代的到来，结合宽带网络接入，导致 Linux 爱好者下载他们喜爱的 Linux 发行版的 ISO 镜像并将其刻录到空白光盘。然而，这种光盘已经过时了，USB
    闪存盘现在是更明智的介质。你可以可靠地使用 USB 盘几百次。


    在 Linux 中，你可以通过 `dd` 命令将可安装的 ISO 文件传输到 USB 驱动器。这非常简单，但整个过程对普通用户来说并不直观，这就是为什么 Ubuntu
    提供了方便的“启动盘创建器”（Startup Disk Creator）工具。它的功能与“磁盘”（Disks）工具有重叠，但启动盘创建器侧重于将 CD/DVD
    光盘或下载的 Ubuntu 兼容 Linux 的 ISO 文件转换为可启动 USB 介质，也就是说，它帮助你从旧介质迁移到更现代、高效的 USB 磁盘。


    启动盘创建器还可以将新创建的 USB 磁盘作为现场模式下的工作环境，从而将所有数据持久地存储在磁盘上。


    **存储持久化**

    这是一个非常有用的功能，允许持久化保存你的所有数据。通过这种方式，你可以将你的 Ubuntu 闪存盘变成一个功能齐全的便携工作系统。


    **选择要使用的磁盘**

    启动盘创建器在此显示可用的目标 USB 驱动器。当你插入它时，应用程序会自动检测并添加到列表中。


    **选择源**

    这里是系统中找到的源镜像文件 (.iso) 和 CD/DVD 光盘的列表。启动盘创建器会自动更新列表。


    **操作系统版本**

    有时并不清楚 ISO 内部具体是系统的哪个版本，或者那张没有标签的光盘上有什么内容。“OS 版本”列提取了必要的细节。


    **选择镜像文件**

    如果你想让你的 ISO 镜像出现在列表中，点击“其他”（Other）按钮并选择镜像文件。顺便说一下，它也支持镜像 (.img)。


    **容量和可用空间**

    你可以找到介质的总大小以及上面的可用空间。此功能专为格式化为 FAT16 或 FAT32 文件系统并可能包含用户数据的 USB 盘设计。


    **注意大小**

    这里的最后一列指示源介质的大小。它显示 ISO 文件的精确大小，但无论实际上有多少兆字节，默认显示为 CD 和 DVD 的总容量。


    **复制文件**

    再次检查一切，并点击“制作启动盘”（Make Startup Disk）按钮。应用程序将显示进度对话框并将文件复制到目标 USB 介质上。


    获取现场 Ubuntu 系统：使用普通的 USB 闪盘或任何大容量存储设备


    ### 创建可启动 USB 闪盘

    利用启动盘创建器


    ### 01

    启动盘创建器旨在用于 Ubuntu 以及其他衍生自它的系统。这是一个短且不完整的列表：Kubuntu, Linux Mint, Xubuntu, Lubuntu,
    Ultimate-Edition, elementaryOS, Peppermint, Peppermint Ice, Deepin 和 Zorin OS。Linux
    的其他变体（特别是那些非 Debian 的版本）可能无法与启动盘创建器配合。如果你有目标介质，测试一下会是一个好主意。


    **02 **

    常见的目标设备是闪盘（也称为 USB 盘或 thumb drive）、外部硬盘、SD 卡或任何通过 USB 读卡器连接的其他内存卡。几乎所有设备都可以工作。只要
    FAT32 分区上有足够的空间存放源镜像，启动盘创建器就不会擦除 FAT32 分区中的任何数据。尽管如此，仍建议使用干净的闪盘，或至少对其进行格式化，以避免因频繁使用该闪盘导致的问题（例如，闪盘可能会出现碎片化）。

    “建议使用干净的闪盘，或至少对其进行格式化，以避免因频繁使用该闪盘导致的问题（例如，闪盘可能会出现碎片化）”

    **图 1** 使用启动盘创建器制作启动盘


    ### 03

    拖动相应的滑块并定义你为文件和设置所需的持久化存储空间。启动盘创建器将创建一个大小合适的持久化存储文件并将其与根系统合并。/home 目录中的更改、下载的内容以及从现场系统中添加或删除的其他文件将在重启后被保留。系统级组件同样有效，例如，你可以安装额外软件或删除不必要的内容，并在关闭或重启现场操作系统后保留它们。这使得你的
    USB 盘变成了一个功能完备的便携操作系统。同时，该设备仍然可以在 Windows 或其他非 Linux 操作系统中读取和访问。


    ### 04

    当你完成设置且文件复制对话框成功完成（图 2）后，重启并将你的 USB 介质选择为启动设备。磁盘创建器会将 Ubuntu 引导加载程序添加到 USB 介质的
    FAT32 分区，以便其启动 Ubuntu。使用启动盘创建器写入的 与通过 `dd` 命令实现的经典现场模式之间的体验差异不大。唯一的视觉区别是你可以拥有持久化存储，尽管它受限于
    4GB —— 这是 FAT32 的最大文件限制。你可以在 Windows（或其他处）在你的 USB 介质上写入一些文件或文件夹，然后从它启动并在那里发现你的文件，且完好无损。


