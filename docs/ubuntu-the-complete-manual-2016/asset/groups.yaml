    ## Ubuntu 基础


    ## 软件与更新


    添加更多应用源并保持系统为最新状态


    Ubuntu 预装了用于基础计算任务和活动的应用程序及配件。“软件与更新”允许你自定义标准软件源集、配置更新并管理额外的驱动程序。“软件源”是一个通用术语，包含了在线存储库和本地介质。你可以开启或关闭标准的
    Ubuntu 软件源，管理第三方源并使用签名密钥对它们进行身份验证。对于配备 Nvidia 或 AMD 显的用户，你可以安装专有驱动程序，但由于许可证限制，这些程序无法直接包含在
    Ubuntu 中。


    ### 安装附加驱动程序


    Ubuntu 用户切换到“软件与更新”中的“附加驱动”选项卡的常见情况是显卡驱动程序。Ubuntu 开箱支持带有 Nvidia 和 AMD 视频芯片的电脑，但系统使用的是开源驱动（分别为‘nouveau’和‘radeon’），这些驱动在
    3D 性能和游戏方面落后于专有驱动。要将开源驱动替换为专有驱动，请前往“附加驱动”选项卡并等待片刻，让 Ubuntu 发现是否有适用于你硬件的专有驱动。不一定是显卡：由于许可证限制，数十种无线网络驱动程序和改进系统性能的各种固件组件无法直接发布。


    当你决定使用一个或多个非免费驱动程序时，只需选择它们并点击“应用更改”按钮。Ubuntu 将在后台下载所有所需文件并自动安装驱动程序。之后，你需要注销并重新登录，或者最好是重启系统。


    Ubuntu 会定期在网上检查更新，如果发现至少有一个包有新版本，就会弹出特殊的通知。在“软件与更新”应用程序中，你可以选择系统查找哪些更新以及检查的频率。要执行此操作，请进入“更新”选项卡并检查勾选框列表。默认情况下，Ubuntu
    会查找安全更新、常规软件包的推荐更新，以及未受 Canonical 支持但能提升 Ubuntu 体验的回传软件更新。接下来的四个下拉菜单控制更新的频率和行为。例如，在此处你可以程序让“软件与更新”自动下载并安装所有或特定的更新，而不会打扰用户。这对于具有稳定网络连接的无人值守
    Ubuntu 安装非常有帮助。最后一个下拉菜单让你选择 Ubuntu 是否应该就操作系统本身的任何新版本进行通知，或仅就长期支持版本（LTS）通知。如果你不喜欢频繁跳转到新版本，请坚持使用
    LTS 版本。


    ### 设置更新


    添加或删除软件源


    可以在“软件与更新”中的“Ubuntu 软件”选项卡管理标准的 Ubuntu 存储库。它列出了：由 Canonical（Ubuntu 制作）提供官方支持的
    Main（主）库；由 Ubuntu 社区维护的 Universe（宇宙）库；包含专有软件的 Multiverse；以及包含闭源设备驱动程序的 Restricted（受限）库。如果你由于某种原因需要在
    Ubuntu 中自行开发软件，可以开启 Source（源码）库。以下是选择最近镜像的其他有用控制选项（这可以提高包的下载速度）以及用于标准交付软件包的 Ubuntu
    CD/DVD 可选开关。“其他软件”选项卡允许你添加第三方存储库，并默认列出 Canonical 合作伙伴存储库中的条目以及额外的独立存储库以获取更多软件（图
    1）。点击“添加”按钮添加新存储库，点击“编辑”更改详情，点击“删除”删除存储库。互联网上有许多额外的存储库，但请务必谨慎对待。


    “可以在软件与更新中的‘Ubuntu 软件’选项卡管理标准的 Ubuntu 存储库”


    **图 1** 使用“软件与更新”添加第三方存储库


    ## 使用通用辅助功能


    配置辅助功能设置让 Ubuntu 更用户友好


    Ubuntu 是对所有人都很友好的地方，包括能力受限或残障的人士。如果你需要在 Ubuntu 中使用特殊设置以获得更舒适的用户体验，在“系统设置”中有一个名为“通用辅助”的专用子部分。如果你愿意，也可以在
    Dash（启动器）中搜索其名称，或在终端中使用 `$ unity-control-center universal-access` 命令单独启动它。通用辅助功能包含大量设置，分为四个独立的类别：视觉、听觉、打字以及指向点击。每个类别都有许多提高易用性的开关。Ubuntu
    配备了高对比度主题和大字体切换器，这些都能帮助视障人士。此外还有屏幕阅读器（图 1）。


    ### 使用键盘作为光标


    如果这种方式移动鼠标不习惯，可以通过键盘控制光标。这种辅助功能可以通过进入“指向点击”选项卡并开启点击切换器来启用。有两种触发鼠标点击的方法：第一种是通过长按鼠标按键来模拟双击；第二种是将鼠标指针悬停在项目上持续较长时间。对于这些操作，都有有用的滑块可以调整延迟。“鼠标与触摸板”子部分中的常规设置也有助于灵活的鼠标性能。在此处你可以降低双击延迟、更改指针速度并在需要左手使用时切换按钮布局。


    通用辅助功能中的“打字”选项卡列出了适用于无法打字并需要帮助的选项（图 2）。这里最明显的选项是屏幕键盘切换，它允许通过鼠标点击输入文本。登录会话后屏幕键盘将会出现，看起来像一个悬浮在窗口顶部的桌面小组件。各种键盘微调可以在某些情况下简化输入，例如粘滞键（将一系列修饰键视为组合键）、慢键（在按下按键和接受之间设置延迟）和去抖键（忽略短时间内的双击按键）。这可以通过额外的听觉通知进行补充，例如按下某些按键时发出哔哔声。如果你觉得使用物理键盘会泄露隐私，Ubuntu
    的屏幕键盘也可以用于额外的安全。


    “如果你需要在 Ubuntu 中使用特殊设置以获得更舒适的用户体验，中有一个名为‘通用辅助’的专用子部分”


    ### 采用 Orca 屏幕阅读器


    Ubuntu 默认的屏幕阅读器称为 Orca。它可以在通用辅助的“视觉”选项卡中启用，也可以从命令行启动（`orca`）。Orca 会朗读正在使用的控件对应的标题和文本。首次启用后访问
    Orca 偏好，请在桌面键盘上按下 `Ins + Space`，或在笔记本电脑上按下 `Caps lock + Space`。打开一个新窗口，Orca 将宣布“屏幕阅读器设置。常规选项卡。”现在你可以根据喜好配置
    Orca，更改语音类型和速度、重新定义键绑定、开启或关闭盲文支持以及许多其他可调项。Orca 还允许你自定义它的详细程度并定义将朗读的文本类别。它还内置了语音模式的帮助系统。按下
    `Ins + H` 或 `Capslock + H` 可以听取指令和其他重要键绑的参考。


