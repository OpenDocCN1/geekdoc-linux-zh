    #### 01

    每个 Linux 发行版在终端模拟器（包括 Xterm 和 GNOME Terminal）的文本模式和图形模式下都使用 Bash。Bash 拥有一非常丰富的命令集，但最实用的功能源于它的流行性；所有
    Linux 用户都使用相同的语法操作终端。然而，还有其他 shell——例如具有更广泛功能且高度自定义的 ZSH，或者带有内置脚本语言的 CSH——它们与
    C 语言有相似之处。要在 GNOME Terminal 中将默认 shell 从 Bash 更改为其他内容，请转到 Edit>Profile Preferences，切换到
