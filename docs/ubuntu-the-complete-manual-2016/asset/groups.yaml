    ## Ubuntu 基础


    ### 使用热点


    Unity 桌面允许你将操作分配到屏幕的任何角以及任何侧边。为了实现这一点，我们需要访问高级窗口管理器设置。启动 Unity Tweak Tool，并进入“窗口管理器（Window
    Manager）>> 热点（Hotcorners）”。共有八个区域（四个角和四个侧边），每个区域旁边都有下拉菜单，让你选择当鼠标移动到屏幕相应区域时执行何种操作。你可以将某个角或某个侧边设置为切换桌面（例如，最小化所有窗口或恢复它们）、平铺窗口或显示工作区。所有更改将立即生效，你可以通过将鼠标移动已分配操作的角或侧边来检查。


    ## 管理指示器


    “系统托盘”区域位于顶部栏的最右侧。某些指示器可以单独配置，但若要获得更多控制权，你需要处理 dconf-editor（图 2）。这个双面板应用程序左侧有类别列表，右侧是内容，允许你调整
    Unity 指示器的属性。前往 com>canonical>indicator 并探索每个项的参数。你可以通过切换“visibility（可见）”参数来开启或关闭顶部栏上的指示器显示，并通过调整“show-\*”参数来更改指示器的显示格式。这样你就可以保持系统托盘区域的整洁。


    “通过将鼠标移动到已分配操作的角或侧边来检查热点是否生效”


    **图 2** 使用 dconf Editor 获取更多自定义控制权


    ## 定制桌面


    发现系统设置

    发现系统详情、管理用户账户并配置硬件


    “系统设置”应用程序包含了各种设置，其工作方式与 Windows 中的控制面板相同。你可以从顶部栏最远端的指示器启动系统设置，甚至从命令行启动（$ unity-control-center）。当然，这里的系统相关设置并不是更改此类设置的唯一地方，但它是执行这些操作最方便、最安全的地方。在
    Linux 中（Ubuntu 也不例外），系统设置可以通过编辑 /etc 目录下的配置文件，或者在 root 权限下执行某些命令来更改。虽然这些方法在 Ubuntu
    中有效，但它需要高级技巧，并且有时会给你的 Linux 安装带来风险。Ubuntu 中的系统设置外壳包含数量有限但设计精美的项目，可以帮助你轻松以最小的技能管理基础的系统相关设置。“系统（System）”子部分包含备份、系统详情、Landscape
    服务、软件源、时间和日期、辅助功能和用户账户的设置。上述某些适用于企业 Ubuntu 用户（例如技术支持的付费订阅，称为 Landscape），而其他设置将在单独的章节中详细介绍（备份、时间与日期等）。本概述重点关注“详情”和“用户账户”，以及某些硬件相关的设置。


    “Ubuntu 中的系统设置外壳包含数量有限但设计精美的项目，可以帮助你轻松以最小的技能管理基础的系统相关设置”


    ## 导航


    它并非默认包含，但在标准的 Ubuntu 在线存储库中即可可用。使用 $ sudo apt-get install unity-tweak-tool 获取它。


    ### 个人设置

    这里的大多数设置都是针对特定用户的。你也可以在此更改外观和感觉设置、调整隐私、管理在线账户等。


    ### 硬件设置

    你可能设置额外的外设、输入设备、更改电源设置，甚至为打印机和显示器管理色彩配置文件


    ### 搜索设置

    如果你找不到所需的设置但知道它的名称，请将其输入搜索栏，查看系统设置如何根据你的输入实时过滤结果。


    ### 系统相关设置

    备份、系统详情、更新和软件源、辅助选项、时间和日期等，都可以在此类别中管理。


    查看重要的子部分


    ## 配置你的 Ubuntu 安装


    探索系统详情并更改某些默认值


    有时你需要了解更多关于你的 Ubuntu 版本的信息。它是 32 位还是 64 位的？你的电脑中有多少内存？为了防止你迷失方向，系统设置中有一个专门的“详情（Details）”子部分。“详情”屏幕显示了系统的摘要，包括
    CPU、内存、显卡驱动、硬盘卷等。你还可以通过右侧的“更新（Updates）”按钮更新系统。在“详情”中，你可以更改默认浏览器、邮件客户端、音乐播放器或图像查看器。同样，在“可移动媒体（Removable
    Media）”标签页上，你可以定义插入光盘（CD/DVD）时 Ubuntu 应该做什么。再次，所有更改将立即生效。


    “有时你需要了解更多关于你的 Ubuntu 版本的信息。它是 32 位还是 64 位的？你的电脑中有多少内存？为了避免迷失方向，请前往系统设置”


    **图 1** 在系统设置中查看详情


    ### 调整电源设置


    这些设置主要影响笔记本电脑用户，也有助于优化能耗。在系统设置的“硬件（Hardware）”类别下，前往“电源（Power）”并使用第一个下拉菜单设置闲置时间——这是电脑进入挂起的时间。第二个选项允许你禁用电池指示器等。另一个与电源相关的可调项是屏幕亮度。你可以点击“电源”标签页上的链接，也可以直接打开“亮度与锁定（Brightness
    & Lock）”子部分。在这里你可以设置一个闲置时间，之后显示器将自动关闭电脑将锁定。你可以定义用户是否需要提供以前设置的密码来解锁电脑。


    管理 Ubuntu 用户


    如果你的电脑主要作为私人或个人使用，可能你需要创建另一个用户。这些在“用户账户（User Accounts）”子部分进行管理。默认情况下，你只能看到列表和设置，无法更改任何内容。要添加或删除用户，必须点击“解锁（Unlock）”按钮并输入
    root 密码。之后你可以点击屏幕左下角的“+”和“-”按钮，查看其他用户的活动日志（历史记录按钮）并切换它们的自动登录。


    设置打印机


    Ubuntu 会自动检测并配置本地打印机，前提是它拥有相应的驱动程序。大多数消费级打印机在 Linux 中都可以顺利运行，因此如果你打开“打印机（Printers）”子部分，你应该能看到已配置打印机的图标。你可以编辑打印机偏好、更改其驱动程序，或者为同一台打印机创建多个具有不同设置的实例。点击“添加”并按照并设置本地或远程打印机——大部分操作是自动的（图
    2）。如果你需要更多控制权或想解决打印问题，使用 $ sudo service cups restart。这是重启 Ubuntu 系统级打印服务的命令。如果想使用功能丰富的
    CUPS 管理界面，请在浏览器中尝试 http://localhost:631。请注意，所有打印机设置更改都需要 Ubuntu 系统的 root 密码。


    **图 2（上方）** Ubuntu 应该自动检测本地和网络打印机


