    **Ubuntu 应用**


    使用 Rhythmbox 听歌曲


    124


    高质量的耳机对处理背景噪音很有帮助——得益于多核 CPU，在后台播放音乐非常简单。


    遗憾的是，获取媒体文件只是挑战的一小部分；一旦几千个 MP3 文件占满了你的存储空间，音乐管理本身就会变成一个严重且令人烦恼的问题。Ubuntu 通过 Rhythmbox
    媒体播放器解决了这一问题。它是一个媒体数据库、在线收电台播放器以及一个经典的、低资源消耗的媒体播放工具的结合体。


    开始使用 Rhythmbox 非常简单：在 Nautilus 中点击媒体文件，播放器就会显示在屏幕上。将其最小化以享受后台播放的好处——即使你关闭了应用程序，音乐也会继续运行。


    遗憾的是，这种方式使用 Rhythmbox 意味着忽略了该产品的大多数有趣功能。高级用户可以创建包含喜爱单曲的自定义播放列表——某些冷门的 Falco 曲目绝对能让你从工作中分心来！


    此外，该程序还可以用作淡出引擎。这意味着普通 MP3 文件之间令人讨厌的间隙可以通过歌曲之间的重叠来“桥接”——它可能无法模仿 DJ 的精湛技巧，但比比没有好得多。


    在工作时使用你的工作站听音乐


    “Rhythmbox 是一个媒体数据库、在线收电台播放器以及一个经典的、低资源消耗的媒体播放工具的结合体”


    ![](img/a6bf9da4751f37b25a0d6611dc73918d_124_0.png)


    **Ubuntu 应用**


    使用 Rhythmbox 听歌曲


    125


    **播放控制**


    如果它在 Apple 的 iPod 上有效，那么它在 Rhythmbox 上同样有效。这三个按钮控制当前选中文件的播放。这个微型控制器对于快速切换播放内容非常方便。


    **dbus 调用**


    Rhythmbox 集成到 Ubuntu 的 dbus 事件系统中。这意味着即使 Rhythmbox 此时没有处于前台，当前播放的曲目也会显示在通知器中。


    **随机和重复**


    无论你的播放列表有多长，它最终都会到达结束。启用循环模式可以轻松解决这个问题，因为 Rhythmbox 会简单地从头重新开始。


    使用 Ubuntu 播放音乐 使用 Rhythmbox 在不经意间播放音乐


    **曲目信息**


    音乐是 Rhythmbox 的核心内容。专辑封面色块旁边的两个标签提供了当前播放曲目的信息，以及专辑和艺术家的信息。


    **媒体存储列表**


    播放控制下方的的大表格提供了当前计划播放的媒体概览。双击项目即可开始播放。


    **音量调节**


    独立于系统其他部分降低 Rhythmbox 的音量可能会帮助。点击扬声器符号，然后在弹出菜单中查看控件以符合你的喜好。


    **专辑封面预览**


    尽管音乐是一种听觉体验，但添加一些视觉上的点缀完全值得的。双击小图标可以打开一个弹出窗口，显示更大版本的图像。


    **进度条**


    是否曾觉得想跳过无聊的间奏和引子？按住进度条并向右拖动。播放位置将自动调整。


    ![](img/a6bf9da4751f37b25a0d6611dc73918d_125_0.png)


    **Ubuntu 应用**


    使用 Rhythmbox 听歌曲


    126


    ##01


    本教程从一个需要思考的场景开始：一个朋友为你提供了价值一个 Gigabyte 级别的 Falco 曲目。假设包含文件的 USB 闪盘已经归还，音乐目前位于你机器上硬盘的一个子文件夹中。首先点击“文件
    > 添加音乐”。接下来，点击复选框旁边的箭头并选择“其他”以打开文件选择对话框。然后继续导航到包含专辑子文件夹的文件夹。最后，点击“打开”关闭常用对话框。


    导入曲目


    管理你的音乐 组织大量的媒体


    “当分析完成后，导入控制下方的列表将填充更多信息”


    ##02


    Rhythmbox 将继续扫描文件夹的内容。这个过程每个文件可能需要长达一秒，这意味着在这里耐心是种美德。当分析完成后，导入控制下方的列表将填充更多信息。


    设置曲目


    设置导入选项


    点击“导入”按钮将它们添加到库中。选择你想要导入音乐的位置（图 1）。勾选“复制库之外的文件”复选框将指示 Rhythmbox 将媒体复制到 Music 文件夹。如果它位于可移动设备上，则建议这样做，否则应禁用。


    ![](img/a6bf9da4751f37b25a0d6611dc73918d_126_0.png)


    **Ubuntu 应用**


    使用 Rhythmbox 听歌曲


    127


    ##04


    尽管音乐是一种听觉体验，但添加一些视觉上的点缀完全值得的。双击小图标可以打开一个弹出窗口，显示更大版本的图像。


    列表提供三个选择：类型、专辑和曲目。


    搜索曲目


    ##03


    返回 Rhythmbox 并点击“音乐”标签页；显示导入的曲目。双击歌曲开始播放。结果自然将显示在列表中。或者，右键点击文件以打开上下文菜单。


    查看你的曲目


    ##05


    一个空的播放列表没有多少价值。通过拖放向其内容添加曲目；在“音乐”视图中选择文件，并将其拖到播放列表中。


    ##06


    点击 Rhythmbox 窗口左下角的“+”符号创建一个新的。然后点击“新建播放列表”并输入播放列表名称。最后，按回车键，Rhythmbox 将输入的文本提交到内存。


    填充播放列表


    选择屏幕左侧的播放列表。顺序点击任何曲目以开始播放——现在向后靠着享受表演吧！


    图 2 所有歌曲将按艺术家和专辑分开


    ![](img/a6bf9da4751f37b25a0d6611dc73918d_127_0.png)


    128


