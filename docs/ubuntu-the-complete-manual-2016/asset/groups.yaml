    “设备”栏允许你选择多个驱动器并同时对多个驱动器执行某些操作。


    02**

    进行性能测试既有趣又具有挑战性，特别是对于非技术用户而言。磁盘应用程序内置了一个工具，意味着你可以随时对驱动器进行基准测试。首先，你需要卸载整个驱动器或仅卸载分区。点击“齿轮”标签并选择“启动基准”。你会得到一张图，其中红色曲线表示平均写入速率，蓝色曲线表示读取速率，绿色点表示访问时间。


    **Ubuntu 基础知识**


    04**

    与普通的文件备份相比，硬盘镜像非常有用。它存储了所有驱动器结构、引导加载程序记录以及所有细节，允许你将你的设置复制到另一个物理驱动器上。同样，对于你觉得可能随时损坏的旧硬盘，没有比创建镜像更好的保存方法了。根据你使用的“齿轮”按钮，你既可以创建整个驱动器的镜像的的，也可以只创建当前分区的镜像。当你选择“创建磁盘镜像”选项时，磁盘会提示你选择镜像文件的目标目录。注意，它必须保存在另一个物理驱动器上。稍后，你将能够使用“恢复磁盘镜像”选项从镜像文件恢复驱动器。


    03**

    驱动器设置对台式电脑和笔记本电脑都很敏感。将驱动器置于待机模式不仅有助于节省功率，还能减少热，甚至让系统更安静。无论你的驱动器在 Ubuntu 中的默认行为如何，你都可以显式地设置它在一段时间后进入睡眠。点击“齿轮”图标进入“驱动器设置”，在其中你可以将“应用待机超时设置”开关移动到“开启”位置。现在你拖动滑块并设置偏的超时值，之后驱动器将进入待机状态。同样，你可以决定是否启用或禁用写入缓存——只需进入“写入缓存”选项卡并选择所需的模式。当启用缓存时，驱动器工作速度更快，但在断电情况下可能会损坏你的文件。


