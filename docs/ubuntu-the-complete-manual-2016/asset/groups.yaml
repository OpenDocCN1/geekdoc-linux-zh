    ## Tweak your security settings


    Make sure your Ubuntu setup provides proper privacy protection


    Privacy is a cornerstone of secure computing. Your data should be protected, your
    computer should prevent unauthorised access and you should be aware of the personal
    data that’s sent from your system to remote servers. Ubuntu provides a good balance
    between usability and security. For example you cannot log in to Unity directly;
    instead you can actually use the ‘sudo’ prefix to run commands as an administrator.
    For regular desktop activities there is the System Settings > Security & Privacy
    subsection, where you can change many settings. Most relate to password protection,
    keeping logs and history for files and applications, online search results in
    Ubuntu Dash and diagnostics information that Canonical would use to fix bugs and
    collect users’ statistics. The reasons as to why you may want to change anything
    may vary. Maybe you don’t want others to see what you have been using recently
    or maybe online search results in Dash distract you. There is another security
    setting in Ubuntu outside its System Settings shell. When you launch Firefox for
    the first time it asks you to choose what data you’d like to share. By default
    Firefox sends crash and help reports to Mozilla, but you still decide and approve
    them.


    ### 01 Generate a stronger password


    There is no sense in setting your Ubuntu password as something simple such as
    12345678 or P@ssw0rd. It is sensible to invent a combination of symbols that is
    unique, complex, long enough and most importantly something that you are sure
    you will not forget. A good password contains lower and uppercase letters, special
    characters and digits. Thankfully, Ubuntu can help you deal better with stronger
    passwords via the APG utility. Install it with `$ sudo apt-get install apg` and
    run simply with `$ apg`. APG will prompt you to enter a random word of your choosing,
    and then converts your suggestion into a stronger combination of characters, but
    still something readable and not too hard to remember by heart, such as WoudElIc6
    (Woud-El-Ic-SIX).


    **Ubuntu essentials**


    ### 02 Enable uncomplicated firewall


    Firewall is an effective tool for blocking network intrusions from the outer world
    and limiting suspicious network activity in both directions by blocking certain
    network packets in IPv4 and IPv6 protocols. Linux has the ‘iptables’ tool for
    doing this job, but it is not very intuitive for newcomers. Luckily, Ubuntu has
    a nice front end to iptables called UFW – the Ubuntu FireWall (Fig 1) in its standard
    repositories. Install it with:


    `$ sudo apt-get install ufw gufw`


    You can control it either from command line (`$ sudo ufw --help`), or within a
    graphical interface (search for ‘firewall’ in Dash or simply launch `$ gufw`).


    ### 03 Enable automatic security updates


    Let’s go a little further and make Ubuntu receive important security updates without
    any interaction with a user. This feature is very useful because not all updates
    are installed without your awareness, but only security-related ones that fix
    vulnerabilities, critical bugs, memory leakage and so on. To enable this feature,
    first start by installing the package along with the required scripts:


    `$ sudo apt-get install unattended-upgrades.`


    Next, enable updates with the following command:


    `$ sudo dpkg-reconfigure -priority-low unattended-upgrades.`


    All you have to do is to add unattended upgrades command to your Cron list on
    a daily/weekly/monthly basis. Find more details at bit.ly/1EtLKFF.


    “A good password contains lower and uppercase letters, special characters and
    digits. Thankfully, Ubuntu can help you”


    **Ubuntu essentials**


    **Fig 1** Enable the Ubuntu Firewall and tweak settings


    ### Protect your PC


    If your PC suspends or turns off the display after a period of inactivity, you
    can set Ubuntu to require a password in order to resume using the PC.


    #### Choose what to include

    There are default places inside your home directory for Music, Pictures, Downloads,
    etc. You can decide what items you want to include in Ubuntu logging. Aside from
    directories, there are also chat logs and office documents.


    #### Related settings

    The first link takes you to the User Accounts subsection, where you can change
    your password; the second link is for Power settings, where you can change the
    time period before you system suspends.


    #### Usage activities record

    Here is the global switch that triggers file and application usage logging. You
    can turn it off with just one mouse click, or alternatively decide to make more
    precise adjustments.


    #### Exclude specific directories and apps

    Use the ‘+’ and ‘-’ buttons to select specific directories or applications that
    Ubuntu will not log or trace. You can even create sophisticated combinations of
    apps.


    #### What about online search results?

    A rather controversial feature, which is why Canonical decided to put in the Off
    mode in 16.04. You can always change the trigger’s position here.


    #### Diagnostic reporting

    Canonical needs your feedback in order to make Ubuntu better. If something goes
    wrong (eg a program crashes), Ubuntu will send details of the problem in a report
    to its headquarters.


    “Ubuntu provides a good balance between usability and security. For example you
    can’t log in to Unity directly; you can use the ‘sudo’ prefix to run commands
    as an administrator”


    **Ubuntu essentials**


    Find the security settings Check out the Security & Privacy tools


    **Fig 2 (above)** Get root privileges by using the ‘sudo’ prefix


    ### 04 Configure ‘sudo’


    The ‘sudo’ is a command that you can put before another command in order to make
    it run with root privileges (Fig 2). You can use sudo anytime and for any command
    but practically you only need to do so if you haven’t got enough permissions with
    your regular user account – for managing printers, or in case you need to write
    a file into a directory outside your home for example. Ubuntu comes with sudo
    enabled by default, which lets you run any command, but requires entering your
    current password (not the root password, root is disabled in Ubuntu by default).
    You can change the sudo settings by issuing the `$ sudo visudo` command, which
    will open the /etc/sudoers file in the Nano editor. You can discover the magic
    of sudo with `$ man sudo`, but there are also instant solutions you can use by
    changing the following line:


    `username ALL=(ALL) ALL`


    to the one below:


    `username ALL=(ALL) NOPASSWD: ALL`


    to stop sudo asking for a password.


    Tweak your security settings


    **Ubuntu essentials**


    ### Find your way around Dash


    Find your way around Dash

    The nerve centre of the desktop, these essential tips and tricks will have you
    using Dash like a pro


    It is very common for people switching from a Windows platform to a Linux system
    to look for the ever-popular Start menu. Generally, the Start menu serves as the
    starting point of your interaction with the computer, and once you get used to
    it, it feels like the most natural way to work on the computer. Frankly, Unity
    – the standard desktop environment for Ubuntu systems – ers Dash.


    Think of Dash as the equivalent Start menu of your Ubuntu system. Dash allows
    you to search for applications, i les, music and videos, and shows you items that
    have recently used. Dash also helps you to launch application and i le shortcuts.


    To start Dash, simply click on the Ubuntu logo on the top-left portion of the
    menu bar. You can also press the super key on your keyboard (marked with the Windows
    logo) to launch it. To exit Dash, all you need to do is click the ‘esc’ button.


    Dash segregates the search results as a series of scopes (or lenses). These are
    used to provide views to your i les, folders, applications and data. There are
    a few basic scopes installed by default with an option to disable them. Switching
    of a scope means you won’t see any results from that scope in your search results.
    With so many coni gurable features, it is evident that Dash is more than a search
    box for i nding i les, but rather it provides a view of the whole operating system.

