    ## Getting started

    ### Get to know Ubuntu

    **8**

    Get to know Ubuntu

    This free, open-source operating system has gained a lot of momentum in recent
    years. Ubuntu is a user-friendly Linux-based operating system that has found its
    place in every corner of the world. Best of all, Ubuntu is absolutely free, including
    future updates. It is also extremely light on PC hardware, so you can install
    it on computers that are three to four years old and it’ll still run smoothly.
    So it’s for good reason that Ubuntu is the most widely used Linux operating system
    – for desktops and in the cloud. It boasts both community and professional support,
    and Ubuntu is suitable for both desktop and server use. But that’s not all:


    Ubuntu is everywhere. Almost all computer manufacturers are shipping models based
    on Ubuntu.


    Ubuntu is well supported. Few other Linux distros provide the same kind of long-term
    support. It is more important than ever to provide long-term support. Ubuntu is
    easy to use. It’s easy to pick up and use, even if you come from Windows (Fig
    1). Ubuntu is pretty stable. For most users, it just works.


    **8**

    ![](img/a6bf9da4751f37b25a0d6611dc73918d_8_0.png)

    ### Getting started

    ### Get to know Ubuntu

    **9**

    **01** If using DVD, put the DVD into the drive and restart the computer. The
    computer should then boot from the removable medium and you select your language.
    There will also be an option to install Ubuntu or try it from the DVD.


    **02** If you want to use a USB drive, note that the latest computers can start
    up from a USB stick. Here you’ll also see a welcome screen that prompts you to
    select language and gives an option to install Ubuntu or try it from the USB stick.


    **03** Irrespective of whether you are using the DVD or USB stick, the next step
    is to select your preferred language and then click on ‘Try Ubuntu’. Your live
    desktop will then appear (as shown in the picture to the left, Fig 2).


    **04** As a final step, when you are ready to install Ubuntu, you just need to
    double-click the icon on your desktop: ‘Install Ubuntu 16.04 LTS’.


    **Try out Ubuntu before installing it**

    ### Live booting and virtual machines

    One of the easiest ways to get started with Ubuntu is by creating a live USB drive,
    CD or DVD. After placing Ubuntu onto it, you can insert your USB stick or disc
    into any computer, then restart it. The computer should then boot from the removable
    medium and you can use Ubuntu without making changes to the hard drive.


    You may be wondering how to create a live Ubuntu USB drive or disc. For this,
    you can download the latest Ubuntu disk image from Ubuntu’s website. Use the UNetbootin
    tool to put Ubuntu on your USB flash drive or burn the downloaded ISO image to
    a disc. All you need to do now is to restart your computer from the removable
    medium you provided and select the ‘Try Ubuntu’ option.

