- md: "\n## Secure files with Déjà Dup\n\n## Ubuntu essentials\n\n### 04\nDéjà Dup\
    \ has a limitation: it is an ‘all or nothing’ tool, meaning that you can’t extract\
    \ selected files and directories. Instead you are forced to copy or download the\
    \ entire backup snapshot. To solve this issue, use the ‘Restore missing files’\
    \ item in the Nautilus context menu (Fig 1). This works for directories included\
    \ in the backup and lets you restore individual files. Déjà Dup is a front-end\
    \ to the Duplicity utility, and this lets you extract your backup snapshot without\
    \ launching Déjà Dup at all. It can be useful for scripting, or maybe when you\
    \ access your backup location remotely via SSH. The syntax for extracting is as\
    \ follows:\n\n```bash\n$ duplicity restore --no-encryption “file:///path/to/snapshot”\
    \ \"/where/to/extract”\n```\n\nThe Duplicity syntax also can extract individual\
    \ backed up items (see $ duplicity --help).\n\n### Access a backup copy\n\n###\
    \ 05\nThe simplest way is to use your Dropbox, MEGASync or other cloud-synced\
    \ directory as the backup location. This way, your data will be uploaded to the\
    \ cloud once Déjà Dup finishes its job. However, let’s do direct online backups,\
    \ such as to the Amazon S3 cloud (Fig 2). To make it happen, you only need a proper\
    \ account at Amazon and a few extra packages. The command is as follows:\n\n```bash\n\
    $ sudo apt-get install python-boto python-cloudfiles\n```\n\nAfter that, the list\
    \ of available storage locations will be complemented by Amazon S3 and Rackspace\
    \ cloud.\n\nBack up to the cloud\n“Déjà Dup has a limitation: it is an ‘all or\
    \ nothing’ tool”\n**Fig 2 (below)** Manage your backup location easily\n\n## Ubuntu\
    \ essentials\n\n### Use Startup Disk Creator\n\n### Use Startup Disk Creator\n\
    Create a bootable USB with Ubuntu or virtually any other Linux \n\nThe first question\
    \ that would most likely emerge here is ‘what on Earth would you need a startup\
    \ disk for?’ Historically, Linux distributions were distributed as CD discs, from\
    \ which you were supposed to install them. Later on, the age of recordable CD/DVD\
    \ discs came in and, together with broadband Internet access, this led Linux enthusiasts\
    \ to download ISO images of their favourite Linux distributions and burn them\
    \ to blank discs. However, such optical discs are already out of trend, with USB\
    \ thumb drives now being the sanest media. You can use USB sticks hundreds of\
    \ times with strong reliability.\n\nIn Linux you can transfer an installable ISO\
    \ file to a USB drive by the ‘dd’ command. It’s quite easy, but the whole procedure\
    \ isn’t very conclusive for regular users, so that’s why Ubuntu offers the handy\
    \ and convenient Startup Disk Creator utility. Its features slightly intersect\
    \ with those found in Disks, but Startup Disk Creator focuses on turning CD/DVD\
    \ discs or downloaded ISO files of installable Ubuntu-compatible Linux distributions\
    \ to bootable USB media, that is it helps you move from legacy media to more contemporary\
    \ and efficient USB disks.\n\nStartup Disk Creator also has the ability to use\
    \ a newly created USB disk as a working environment in live mode, consequently\
    \ saving all your data persistently on a disk.\n\n**Storage persistence** \nA\
    \ very useful feature that allows saving all your data persistently. This way\
    \ you can turn your live Ubuntu thumb drive into a fully featured portable working\
    \ system.\n\n**Select the disk to use** \nStartup Disk Creator displays available\
    \ target USB drives here. When you plug it in, the application detects it automatically\
    \ and adds it to the list.\n\n**Select the source**\nHere is the list of source\
    \ disc images (.iso) and CD/DVD discs found on your system. Startup Disk Creator\
    \ automatically updates the list.\n\n**Operating system version**\nSometimes it’s\
    \ not clear exactly which version of a system is inside an ISO, or what is on\
    \ that unlabelled optical disc. The column entitled OS Version extracts necessary\
    \ details.\n\n**Choose an image file**\nIf you want your ISO image to appear in\
    \ the list, click the Other button and select the image file. By the way, it also\
    \ supports disk images (.img).\n\n**Capacity and free space**\nYou can find the\
    \ total size of the media as well as the amount of free space on it. This feature\
    \ is designed for USB sticks that are formatted to FAT16 or FAT32 file systems\
    \ and may contain user data.\n\n**Mind the size**\nThe last column here indicates\
    \ the size of the source media. It shows the exact weight of the ISO file, but\
    \ defaults to the total capacity of CDs and DVDs no matter how many megabytes\
    \ are actually there.\n\n**Copy the files** \nCheck everything one more time and\
    \ press the Make Startup Disk button. The application will show a progress dialog\
    \ and copy the files onto the target USB medium.\n\nGet a live Ubuntu system Use\
    \ a regular USB flash drive or any mass-storage device\n\n### Create a bootable\
    \ USB stick\nUtilise Startup Disk Creator\n\n### 01\nStartup Disk Creator is designed\
    \ to work with Ubuntu and other systems derived from it. Here is a short and incomplete\
    \ list: Kubuntu, Linux Mint, Xubuntu, Lubuntu, Ultimate-Edition, elementaryOS,\
    \ Peppermint, Peppermint Ice, Deepin and Zorin OS. Other flavours of Linux, especially\
    \ those non-Debian based, might not work with Startup Disk Creator. If you have\
    \ a target medium, it will be a good idea to test it.\n\n**02 **\nCommon target\
    \ devices are flash drive – also known as USB stick or thumb drive – external\
    \ hard drive, SD card or any other memory card connected through USB reader. Virtually\
    \ everything works. Startup Disk Creator doesn’t wipe any data from FAT32 volumes\
    \ once there is enough space there for source image. Although, it is recommended\
    \ to use a clean flash drive or at least format it to avoid issues resulting from\
    \ heavy use of that flash drive (for instance, a flash drive might suffer from\
    \ fragmentation).\n“It is recommended to use a clean flash drive or at least format\
    \ it to avoid issues resulting from heavy use of that flash drive (for instance,\
    \ a flash drive might suffer from fragmentation)”\n**Fig 1** Startup Disk Creator\
    \ to create a startup disk\n\n### 03\nDrag the respective slider and define how\
    \ much persistent storage you need for files and settings. Startup Disk Creator\
    \ will create a persistent storage file of appropriate size and merge it with\
    \ the root system. Changes in the /home directory, downloads and other files added\
    \ or removed from the live system will be preserved after reboot. The same works\
    \ for system-wide components, for example you can install extra software or remove\
    \ something unnecessary and keep it after shutting down or rebooting the live\
    \ OS. This makes your USB stick a fully flagged portable OS. At the same time,\
    \ the device will still be readable and accessible from Windows or other non-Linux\
    \ OSs.\n\n### 04\nWhen you are done with setting things up, and the file copying\
    \ dialog finishes successfully (Fig 2), reboot and select your USB medium as a\
    \ boot device. Disk Creator adds the Ubuntu bootloader to the FAT32 volume of\
    \ your USB medium, so that it can boot Ubuntu. The experience doesn’t vary much\
    \ between an OS written with Startup Disk Creator and with a classic live mode\
    \ achieved with the ‘dd’ command. The only visible difference is that you can\
    \ have persistent storage, even though it is limited with 4GB – this is a maximum\
    \ file size in FAT32. You can write some files or folders on your USB medium in\
    \ Windows (or elsewhere), then boot from it and find your files there, safe and\
    \ intact.\n\n**Fig 2** Track install progress with this dialog box\n"
