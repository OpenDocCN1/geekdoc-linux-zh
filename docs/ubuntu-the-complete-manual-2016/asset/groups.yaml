    ## 进制代码

    rwx —— 读取/写入/执行权限分别被赋予 4、2 和 1 的值。要给文件赋予读取 + 写入 + 执行权限，则将 4、2 和 1 相加得到 7。如果只需要读取和执行权限，则为
