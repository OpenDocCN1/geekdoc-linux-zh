    ### 使用 GNOME Terminal & Xterm

    探索 Ubuntu 中终端模拟器的基础和优势


    Ubuntu 附带两个终端模拟器。其中一个是 GNOME Terminal，这是一个被广泛使用的程序，可能可能是许多 Ubuntu 用户唯一知的终端应用程序。GNOME
