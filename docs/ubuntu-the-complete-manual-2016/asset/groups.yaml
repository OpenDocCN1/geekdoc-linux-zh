    在那里记录了应该查看哪些存储库。你可以手动编辑这些文件以添加更多存储库，并更改版本以进行升级（请谨慎操作！）。但添加新存储库的最简单方法是使用 `apt-add-repository`：`sudo
    apt-add-repository ppa:jon-hedgerows/get-iplayer`。之后，在从存储库安装之前，你需要再次运行 `sudo apt-get
