- md: "\n![](img/a6bf9da4751f37b25a0d6611dc73918d_19_0.png)\n\n## Ubuntu essentials\n\
    ### Navigate the Ubuntu desktop\n\n**20**\n\nFind everything you need on the intuitive\
    \ and attractive Ubuntu desktop interface, Unity. When Ubuntu first introduced\
    \ its Unity desktop, some users threatened to move back to Windows Vista. But\
    \ as time went by, the desktop became more reliable: as of 12.04 LTS, there is\
    \ no real reason to dislike Unity. Unity initially started out as a research product\
    \ trying to create a GUI that was better suited to netbooks: their extremely wide\
    \ displays did not work particularly well with traditional desktop managers that\
    \ had been intended for workstations utilising the standard 4:3 displays. This\
    \ explains two important changes to the interface: first of all, the Launcher\
    \ was moved to the side of the screen to preserve the valuable vertical real estate.\
    \ Secondly, the menu bars of the various different applications were grouped together\
    \ into one top bar that is always dedicated to the currently enabled application.\
    \ This is one of the main differences you will find from Windows and other distros\
    \ in terms of usability, but it is one that you will become accustomed to over\
    \ time. While getting up to speed with Unity might take users a bit of time, rest\
    \ assured that you will eventually see they are more than worth it.\n\n> “Unity\
    \ initially started out as a research product trying to create a GUI that was\
    \ better suited to netbooks”\n\n### Trash \nJust where you’d expect to find it,\
    \ the trash can is always visible at the bottom of the quick launch bar.\n\n###\
    \ View app status\nAll of the running applications are shown below the Dash symbol.\
    \ The arrows located on the left side of the icon let you know the number of windows\
    \ that are currently open. On dual-screen workstations, an ‘empty’ arrow here\
    \ indicates that the window is not located on the display that is showing this\
    \ particular version of the bar.\n\n### Quick-launch apps\nRight-click on the\
    \ symbol of a running application to open a short menu. Selecting ‘Lock to Launcher’\
    \ from the available options ensures that the symbol will always remain in the\
    \ bar for quick access to that specific application, even if it is not currently\
    \ running.\n\n![](img/a6bf9da4751f37b25a0d6611dc73918d_20_0.png)\n\n## Ubuntu\
    \ essentials\n### Navigate the Ubuntu desktop\n\n**21**\n\n### The Dash\nUnity’s\
    \ start menu is keyboard-driven and opening it in this way can save time. Savvy\
    \ users will open it using the Windows key on their keyboard. You can get a real\
    \ productivity boost by following it up with a few characters describing the app\
    \ you are looking for, for example by entering ‘Thun’ after tapping the Windows\
    \ key virtually ensures that the Thunderbird icon appears right in the middle\
    \ of the application list.\n\n### The menu bar\nMove your mouse cursor up to the\
    \ very top of the screen to enable the menu display. This is a really helpful\
    \ tool for accessibility as less dexterity is required to complete it. Simply\
    \ flick the cursor to the top of the screen and let Unity take care of any overshoot.\n\
    \n### Wallpaper\nAs with practically any other distro or OS, your wallpaper is\
    \ a blank canvas to put your own stamp on. The default Ubuntu offering isn’t too\
    \ shabby, though.\n\n### The indicator menu\nUbuntu will display symbols alerting\
    \ you about any events and/or important system state changes that are taking place\
    \ or need your attention. Click on any of these icons when they appear to reveal\
    \ a short menu providing you with further options about the situation at hand.\n\
    \n### The keyboard cheatsheet\nUnity comes with a set of helpful keyboard shortcuts\
    \ that increase productivity and get things done faster. Press and hold on the\
    \ Windows key to display a list of shortcuts in the middle of the screen that\
    \ is currently active.\n\n### Active workspace\nFront and centre is the window\
    \ you’re working on. To switch to another without closing the current window,\
    \ just click on or search for the app you want to open next. It can be minimised\
    \ if you hover at the top of the window – the classic three buttons will appear\
    \ with options to close, minimise or maximise. Be aware that clicking the close\
    \ option will mean you need to start the program again.\n\n![](img/a6bf9da4751f37b25a0d6611dc73918d_21_0.png)\n\
    \n## Ubuntu essentials\n### Dual boot with Ubuntu\n\n**22**\n\n### Dual boot\n\
    Get Ubuntu running alongside your existing Windows installation\n\nMost users\
    \ who want to try Ubuntu already have desktop PCs or laptops with the Windows\
    \ OS. Ubuntu can be installed alongside Windows and both systems will coexist\
    \ just fine, without interfering with each other.\n\nUbuntu’s installation wizard\
    \ has an advanced option, where you can either trust the installer to automatically\
    \ shrink the Windows partition and create Ubuntu partitions, or do it manually.\n\
    \nIf you choose the manual method, the installer will provide a dedicated partitioning\
    \ stage. First, you’ll need to resize the NTFS volume and make it smaller by some\
    \ number of gigabytes. Make sure that you don’t have excessive disk fragmentation\
    \ in Windows, otherwise you may turn your NTFS volume in Ubuntu installer unusable.\
    \ Try to guess how much space you’ll need in the unallocated area after shrinking.\
    \ For instance, 10GB looks like the bare minimum – go with at least twice as much\
    \ as that for the Ubuntu root partition. Think ahead to cover aspects like swapping\
    \ and a separate partition for /home.\n\nThe installer then installs the GRUB\
    \ bootloader into the master boot record (MBR) for older systems, or GPT for modern\
    \ systems. Ubuntu also supports Secure Boot on many modern devices. After the\
    \ installation, you will see a menu where you can choose between Ubuntu and Windows\
    \ at each boot.\n\n> “Ubuntu can be installed alongside Windows and both systems\
    \ will coexist just fine”\n\n![](img/a6bf9da4751f37b25a0d6611dc73918d_22_0.png)\n\
    \n## Ubuntu essentials\n### Dual boot with Ubuntu\n\n**23**\n\n### Dual boot\n\
    Dare to go for manual setup\n\nUbuntu’s installation program has been polished\
    \ in recent years and now looks very smooth. Soon after completing basic steps\
    \ (like language selection), user faces the first real obstacle: the ‘Installation\
    \ type’ step. You can see above that Ubuntu has automatically detected your OS\
    \ and how to keep it intact (Fig 1). Here you can let the installer automatically\
    \ decide how much space you want to allocate for Ubuntu. Note the second option\
    \ with the red label – we are going to install Ubuntu and keep Windows working,\
    \ so do not choose this. The last option is a path to a more expert-like drive\
    \ allocation. Dual-booting in UEFI mode introduces more routines for the Ubuntu\
    \ installer. If you’re unsure what to choose, go with auto mode. If your system\
    \ uses a BIOS, you can repartition your drive manually.\n\n### Windows\nThe automatic\
    \ partitioning option is definitely more comfortable for non-savvy users, but\
    \ it does have limitations, such as the inability to add an extra Home partition\
    \ or define the swap space manually. Let’s use the fully fledged partitioning\
    \ method by choosing the ‘Something else’ option in the previous step. First,\
    \ you’ll need to resize the NTFS volume and make it smaller by some number of\
    \ gigabytes. Make sure that you don’t have excessive disk fragmentation in Windows,\
    \ otherwise you may turn your NTFS volume in Ubuntu installer unusable. Try to\
    \ guess how much space you’ll need in the unallocated area after shrinking. For\
    \ instance, 10GB looks like the bare minimum – go with at least twice as much\
    \ as that for the Ubuntu root partition. Think ahead to cover aspects like swapping\
    \ and a separate partition for /home.\n\n### Reveal the power of GRUB\nThe installer\
    \ then installs the GRUB bootloader into the master boot record (MBR) for older\
    \ systems, or GPT for modern systems. Ubuntu also supports Secure Boot on many\
    \ modern devices. After the installation, you will see a menu where you can choose\
    \ between Ubuntu and Windows at each boot.\n\n### The default entry\nThe automatic\
    \ partitioning option is definitely more comfortable for non-savvy users, but\
    \ it does have limitations, such as the inability to add an extra Home partition\
    \ or define the swap space manually.\n\n![](img/a6bf9da4751f37b25a0d6611dc73918d_23_0.png)\n\
    \n## Ubuntu essentials\n### Dual boot with Ubuntu\n\n**24**\n\n### Dual boot\n\
    Meet GRUB\nUbuntu’s installation program has been polished in recent years and\
    \ now looks very smooth. Soon after completing basic steps (like language selection),\
    \ user faces the first real obstacle: the ‘Installation type’ step. You can see\
    \ above that Ubuntu has automatically detected your OS and how to keep it intact\
    \ (Fig 1). Here you can let the installer automatically decide how much space\
    \ you want to allocate for Ubuntu. Note the second option with the red label –\
    \ we are going to install Ubuntu and keep Windows working, so do not choose this.\
    \ The last option is a path to a more expert-like drive allocation. Dual-booting\
    \ in UEFI mode introduces more routines for the Ubuntu installer. If you’re unsure\
    \ what to choose, go with auto mode. If your system uses a BIOS, you can repartition\
    \ your drive manually.\n\n> “Ubuntu can be installed alongside Windows and both\
    \ systems will coexist just fine”\n\n![](img/a6bf9da4751f37b25a0d6611dc73918d_24_0.png)\n\
    \n### The default entry\nThe automatic partitioning option is definitely more\
    \ comfortable for non-savvy users, but it does have limitations, such as the inability\
    \ to add an extra Home partition or define the swap space manually.\n\n**Fig 1\
    \ (above)** The installation type has automatically detected your OS\n"
  mdcn: "\n\n![](img/a6bf9da4751f37b25a0d6611dc73918d_19_0.png)\n\n## Ubuntu 基础\n\
    ### 导航 Ubuntu 桌面\n\n**20**\n\n在直观且迷人的 Ubuntu 桌面界面 Unity 上找到你所需的一切。当 Ubuntu 首次引入\
    \ Unity 桌面时，一些用户威胁要回到 Windows Vista。但随着时间的推移，该桌面变得更加可靠：截至 12.04 LTS 版本，已经没有理由不喜欢\
    \ Unity 了。Unity 起初是一个研究产品，试图创建一种更适合超级笔记本（netbooks）的 GUI：它们极宽的显示器对于为使用标准 4:3 显示器的工作站而设计的传统桌面管理器效果并不特别好。这解释了界面上的两个重要变化：首先，启动器（Launcher）被移动到屏幕侧边以保留宝贵的垂直空间。其次，不同应用程序的菜单栏被组合到一个顶栏中，该顶栏始终用于当前启用的应用程序。这是你在易用性方面与\
    \ Windows 及其他发行版发现的主要区别之一，但随着时间的推移，你会习惯的。虽然熟悉 Unity 可能需要用户花费一些时间，但放心，你最终会发现它是完全值得的。\n\
    \n> “Unity 起初是一个研究产品，试图创建一种更适合超级笔记本的 GUI”\n\n### 垃圾桶 \n垃圾桶就在你预期的地方，它在快速启动栏的底部始终可见。\n\
    \n### 查看应用状态\n所有运行中的应用程序都显示在 Dash 图标下方。图标左侧的箭头可以让你知道当前打开的窗口数量。在双屏工作站上，此处的“空”箭头表示窗口不在显示此特定版本工具栏的显示器上。\n\
    \n### 快速启动应用\n右键点击运行中的应用程序图标以打开短菜单。在可用选项中选择“锁定到启动器”（Lock to Launcher），可以确保该图标始终保留在栏中，以便快速访问特定应用程序，即使它当前没有运行。\n\
    \n![](img/a6bf9da4751f37b25a0d6611dc73918d_20_0.png)\n\n## Ubuntu 基础\n### 导航 Ubuntu\
    \ 桌面\n\n**21**\n\n### Dash（启动器）\nUnity 的启动菜单是键盘驱动的，通过这种方式打开它可以节省时间。熟练的用户会使用键盘上的\
    \ Windows 键打开它。通过输入几个描述你正在查找的应用的字符，你可以获得真正的生产力提升，例如在按下 Windows 键后输入‘Thun’，几乎可以确保\
    \ Thunderbird 图标出现在应用程序列表的正中间。\n\n### 菜单栏\n将鼠标光标移动到屏幕最顶部即可启用菜单显示。这对于辅助功能来说是一个非常有用的工具，因为完成此操作所需的灵活性要求较低。只需将光标滑向屏幕顶部，让\
    \ Unity 处理任何超出部分即可。\n\n### 壁纸\n与几乎任何其他发行版或操作系统一样，你的壁纸是你施加个人印记的空白画布。不过，Ubuntu 提供的默认也不错。\n\
    \n### 状态菜单\nUbuntu 将显示符号来提醒你正在发生或需要你注意任何事件和/或重要的系统状态变化。当这些图标出现时，点击任何一个即可显示短菜单，提供有关当前情况的更多选项。\n\
    \n### 键盘快捷键表\nUnity 自带了一组实用的键盘快捷键，可以提高效率并更快地完成任务。按住 Windows 键可以在屏幕中间显示当前激活的快捷键列表。\n\
    \n### 活跃工作区\n正中心是你正在工作的窗口。要在不关闭当前窗口的情况下切换到另一个窗口，只需点击或搜索你下一个要打开的应用即可。如果悬停在窗口顶部，可以将其最小化——经典的三个按钮将出现，提供关闭、最小化或最大化的选项。请注意，点击关闭选项意味着你需要重新启动程序。\n\
    \n![](img/a6bf9da4751f37b25a0d6611dc73918d_21_0.png)\n\n## Ubuntu 基础\n### 与 Ubuntu\
    \ 的双启动\n\n**22**\n\n### 双启动\n在现有的 Windows 安装系统旁运行 Ubuntu\n\n大多数想要尝试 Ubuntu 的用户已经拥有了安装有\
    \ Windows 系统的桌面电脑或笔记本电脑。Ubuntu 可以与 Windows 并排安装，两个系统将良好地共存，互不干扰。\n\nUbuntu 的安装向导有一个高级选项，你可以信任安装程序自动收缩\
    \ Windows 分区并创建 Ubuntu 分区，也可以手动进行。\n\n如果你选择手动方法，安装程序将提供一个专门的分区划分阶段。首先，你需要调整 NTFS\
    \ 卷的大小并将其缩小几个 GB。确保 Windows 中没有过度的磁盘碎片，否则你可能会导致 Ubuntu 安装程序中的 NTFS 卷变得不可用。尝试猜测收缩后在未分配区域需要多少空间。例如，10GB\
    \ 看起来是最低限——Ubuntu 根分区至少留出两倍的空间。提前考虑交换分区（swapping）和 /home 独立分区等因素。\n\n安装程序会将 GRUB\
    \ 引导程序安装到旧系统的主引导记录（MBR）或现代系统的 GPT 中。Ubuntu 还支持许多现代设备上的安全启动（Secure Boot）。安装完成后，你将看到一个菜单，每次启动时可以在\
    \ Ubuntu 和 Windows 之间进行选择。\n\n> “Ubuntu 可以与 Windows 并排安装，两个系统将良好地共存”\n\n![](img/a6bf9da4751f37b25a0d6611dc73918d_22_0.png)\n\
    \n## Ubuntu 基础 \n### 与 Ubuntu 的双启动\n\n**23**\n\n### 双启动\n敢于尝试手动设置\n\nUbuntu 的安装程序在过去几年经过了改进，现在看起来非常流畅。在完成基本步骤（如选择语言）后不久，用户将面临第一个真正的障碍：“安装类型”步骤。如上所示，Ubuntu\
    \ 已自动检测到你的操作系统以及如何保持其完整（图 1）。在这里，你可以让安装程序自动决定你想为 Ubuntu 分配多少空间。注意带有红色标签的第二个选项——我们将安装\
    \ Ubuntu 并保持 Windows 正常运行，所以不要选择这个。最后一个选项是更像专家级的磁盘分配路径。在 UEFI 模式下双启动为 Ubuntu 安装程序引入了更多程序。如果你不确定选择什么，请选择自动模式。如果你的系统使用\
    \ BIOS，你可以手动对硬盘进行重新分区。\n\n### Windows\n自动分区选项对于非熟练用户绝对更舒服，但它确实有局限性，例如无法添加额外的 Home\
    \ 分区或手动定义交换空间。让我们通过在上一步中选择“其他”（Something else）选项来使用完整的分区方法。首先，你需要调整 NTFS 卷的大小并将其缩小几个\
    \ GB。确保 Windows 中没有过度的磁盘碎片，否则你可能会导致 Ubuntu 安装程序中的 NTFS 卷变得不可用。尝试猜测收缩后在未分配区域需要多少空间。例如，10GB\
    \ 看起来是最低限——Ubuntu 根分区至少留出两倍的空间。提前考虑交换分区和 /home 独立分区等因素。\n\n### 发现 GRUB 的力量\n安装程序会将\
    \ GRUB 引导程序安装到旧系统的主引导记录（MBR）或现代系统的 GPT 中。Ubuntu 还支持许多现代设备上的安全启动（Secure Boot）。安装完成后，你将看到一个菜单，每次启动时可以在\
    \ Ubuntu 和 Windows 之间进行选择。\n\n### 默认入口\n自动分区选项对于非熟练用户绝对更舒服，但它确实有局限性，例如无法添加额外的\
    \ Home 分区或手动定义交换空间。\n\n![](img/a6bf9da4751f37b25a0d6611dc73918d_23_0.png)\n\n\
    ## Ubuntu 基础 \n### 与 Ubuntu 的双启动\n\n**24**\n\n### 双启动\n结识 GRUB\nUbuntu 的安装程序在过去几年经过了改进，现在看起来非常流畅。在完成基本步骤（如选择语言）后不久，用户将面临第一个真正的障碍：“安装类型”步骤。如上所示，Ubuntu\
    \ 已自动检测到你的操作系统以及如何保持其完整（图 1）。在这里，你可以让安装程序自动决定你想为 Ubuntu 分配多少空间。注意带有红色标签的第二个选项——我们将安装\
    \ Ubuntu 并保持 Windows 正常运行，所以不要选择这个。最后一个选项是更像专家级的磁盘分配路径。在 UEFI 模式下双启动为 Ubuntu 安装程序引入了更多程序。如果你不确定选择什么，请选择自动模式。如果你的系统使用\
    \ BIOS，你可以手动对硬盘进行重新分区。\n\n> “Ubuntu 可以与 Windows 并排安装，两个系统将良好地共存”\n\n![](img/a6bf9da4751f37b25a0d6611dc73918d_24_0.png)\n\
    \n### 默认入口\n自动分区选项对于非熟练用户绝对更舒服，但它确实有局限性，例如无法添加额外的 Home 分区或手动定义交换空间。\n\n**图 1（上文）**\
    \ 安装类型已自动检测到你的操作系统\n\n"
