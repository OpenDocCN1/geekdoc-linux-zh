    ## Ubuntu 应用程序

    220 LibreOffice 基础知识


    正如其名称所示，LibreOffice 是微软 Office 的开源替代品。它包含了文字处理、数据库创建、幻灯片设计等完整程序，是大多数流行 Linux 发行版中自带的办公套件。


    对于普通用户和新手来说，可能很难理解 LibreOffice 到底有多强大。人们很容易陷入思维定式，无法充分利用它提供的各种功能。例如，在日常工作中，你可能认为不需要在
    Writer 中使用宏、创建索引或进行邮件合并。但这些功能可以极大地提高你的生产力和效率（图 1）。


    在接下来的几页中，我们将介绍一些提升体验的佳方法——特别是在核心的 Writer 和 Calc 程序中。你将优化工作方式，并开始充分利用这款功能丰富的办公软件。


    通过这些 LibreOffice 套件中不可或缺的小技巧，让你的工作日更加高效。


    **图 1（下方）** 更高效地使用 LibreOffice 应用程序


    “对于普通用户和新手来说，可能很难理解 LibreOffice 到底有多强大”


    ### 01 调出格式选项

    也许你正寻求提高可读性，或者确保文档打印效果完全符合你的预期。无论何种情况，解决方法都是对文本进行格式化。起初你可能很难弄清楚为什么某些文本段显示那样，因此请进入格式部分查找原因并修改。工具栏上有一个看起来像反向“P”的符号——点击它可以显示实时格式符号，例如异常的段落标记。


    ### 02 更好的项目符号

    创建项目符号列表非常简单；点击圆点或数字类型即可。你可以更改这些项目符号的格式，将其改为不同的符号或字母而非数字。此外，你还可以使用 `Tab` 键创建嵌套子列表，然后按
    `Shift+Tab` 回到标准列表。


    ### 03 粘贴未格式格式的文本

    通常在 Linux 中，你可以使用 `Ctrl+Shift+V` 粘贴文本并同时删除格式。如果你在 Writer 中使用此功能，或者在“编辑”菜单中找到“特殊粘贴”，你将会有多种粘贴文本的选择（图
    2）。其中一种是不带格式的粘贴，但它也允许其他方法，例如使用 LibreOffice 格式。


    **图 2** “特殊粘贴”功能提供了多种格式格式选项


    ### 04 快速计算

    即使在写作时，你可能也需要进行快速数学计算。无需切换到 Google 或计算器应用，你可以使用公式栏。进入“插入”、“对象”、“公式”，然后写下你想要计算的内容。一旦确认，公式的结果就会出现在你光标所在的位置。


    “即使在写作时，你可能也需要进行快速数学计算。无需切换到 Google 或计算器应用，你可以使用公式栏”


    ### 05 快速导航

    按下 `F5` 或进入“视图”菜单将允许你使用“导航器”功能。在大型文档中，可以使用它在不同的标题、表格、图形、书签以及文档中的许多对象之间快速移动。它不是一个固定的面板，因此你可以移动它，以便随时查看你想看的内容。


    ### 06 设置默认文档格式

    默认情况下，Writer 将将新文件保存为 ODT（开放文档格式）。这在大多数其他文字处理器中都适用，但如果你经常需要处理需要在 Microsoft Office
    中运行的文件，可以将默认文件格式更改为 .doc 或 .docx。进入“工具 > 选项”，并在“加载/保存”下找到“常规”设置来更改默认值。


    ### 07 创建备份

    Writer 有了一套针对意外关机的恢复系统，但这依赖于临时文件。你可以在“加载/保存”选项中启用备份系统。


    ### 08 更改大小写

    有句子或单词没有正确大写吗？你可以通过选中内容并查看可用菜单来更改大小写。还有一个专门的选项可以进行更改。


    ### 09 表格自动格式化

    如果你创建了表格，可能需要添加一些颜色来提高其可读性。使用“格式”下的“自动格式”选项可以创建一个方案。一旦设置就绪，你也可以对其进行微调。


    ### 10 保护你的电子表格

    共享表格对提高效率很有帮助，但表格变得越复杂，就越难以追踪某人的意外更改。你可以通过“工具 > 文档 > 表格”来保护电子表格，让特定人员可以进行更改。


    ### 11 更改状态栏预览

    当你选择某些带有数值的单元格时，状态栏上会显示一个方便的提示，告诉你的总和。不过，这并不总是你想要的。点击状态栏的该区域调出菜单，并将其改为平均值、最大值或最小值。


    ### 12 自动筛选行

    筛选行有助于组织数据，但如果你不确定如何操作，Calc 有一个你可以使用的自动筛选工具。选择一行，然后进入“数据 > 筛选 > 自动”，它将根据该行创建一个自动筛选系统。一旦设置就绪，你也可以对其进行微调。


    ### 13 分组单元格

    有时你不需要一直看到特定的数据块，像代码中那样将其折叠起来可以为可视页面留更多空间。通过使用“数据 > 分组和轮纲 > 自动轮纲”下的“轮纲”功能，你可以创建这些可折叠组，它们使用粗线条来标识自己。


    ### 14 自动递增或复制单元格

    如果你从未发现过它，Calc 在复制单元格方面非常智能。如果你写下二或三个数字甚至是日期，选中一个并向下拖黑色方块进行复制，它将按正确的顺序自动填充单元格数字或日期。如果你不希望它这样做，在复制单元格时按住
    `Control` 键即可进行普通复制。

