    \ is recommended if it resides on \n\na removable device that has to be \n\nreturned\
    \ to its owner, but should be \n\nleft disabled otherwise."
  - "[PAGE 126]\n\n![](img/a6bf9da4751f37b25a0d6611dc73918d_126_0.png)\n\n**Ubuntu\
