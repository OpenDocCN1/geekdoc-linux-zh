    ## Ubuntu essentials


    ### Unleash the Archive Manager

    **74 Make use of this small accessory that sits inside your Ubuntu system**


    Archive Manager is a small tool for opening compressed files and creating your
    own archives. Years ago, when people had small hard drives, Archive Manager was
    king of the hill. It’s still an important part of the standard desktop experience,
    as it is the easiest way to unpack downloaded archives or combine many files into
    one (Fig 1).


    The standard Ubuntu Archive Manager follows the generic naming policy and therefore
    doesn’t have any special name (together with Disks, Backups and so on). However,
    Ubuntu had taken it from the GNOME desktop, where the archive manager is called
    File Roller. You can check it out by launching the $ file-roller command in the
    terminal in Ubuntu. When launched separately, the File Roller interface looks
    quite empty because it is designed to show .contents in the largest area of its
    window.


    ### Make use of extra features


    File Roller has some extra features and boasts fine integration with the Ubuntu
    file manager, Nautilus. This means that you can extract any supported archive
    simply by right-clicking it and selecting Extract Here from the menu. You can
    also drag-and-drop files and directories from Nautilus to the File Roller window
    in order to add them to an archive. The application will prompt you for an archive
    name and offer advanced options that include password protection (ZIP and CBZ
    only). You can protect just the files and directories, so it will be possible
    to view the list of files inside an archive, but in order to open or extract anything
    from such archive, one must provide a proper password (Fig 2). You can also protect
    the list of the archive’s files and directories, or split an archive into parts
    of fixed size.


    “It’s still an important part of the standard desktop experience”


    **75**

    **Ubuntu essentials**

    **75 Unleash the Archive Manager**


    ### Open or view an archive

    Opening an archive is simple: just double-click it or use the ‘Open with Archive
    Manager’ item in the right-click menu of an archive. If its icon looks like a
    box, it means that most probably such archive will be supported. File Roller supports
    ZIP, RAR, GZIP, BZIP, 7Z, JAR, XZ and many other formats, for both opening and
    compressing, and also AR and ISO formats in read-only mode. You can also go the
    other way around: open the empty File Roller window and use its Open button to
    browse and select an archive. There is a difference between opening and viewing
    an archive. While it is clear what the first one means, the second lets you look
    through the entire list of files and see the whole archive’s content in a single
    view. For instance, if there are many subdirectories in your archive, you may
    want to select View> View Files and see everything as a single list. File Roller
    adds the extra Location column to help you see which file is where.


    The reason why you may need to create an archive can vary. Firstly, an archived
    file is always smaller than the original one, so the simplest goal is to save
    some disk space. This doesn’t help much with photos and videos, because they are
    already compressed and so adding them to an archive doesn’t save much space. However,
    office documents or uncompressed media files (DOC, XLS, WAV, TIFF and so on) show
    a splendid compression ratio, up to 90-95 per cent. Secondly, archiving merges
    many files into one archive, which is very convenient. For instance, copying a
    thousand of small files can take a long time (it drives most file systems crazy),
    but when compressed into an archive, you will wait for just a couple of seconds.
    To transfer files with symlinks and UNIX-specific attributes (like permissions
    and extra flags) to a FAT32 or NTFS volume, you should also archive such files
    first. Compress any file or directory using the Compress item in the right-click
    menu of an item, or use the respective feature inside File Roller.


    **Fig 2** Protect files with a password

    **Fig 1** Compress files with the archive manager


    **76**

    **Ubuntu essentials**

    **76 Use the Disk Usage Analyzer**

    **Find out where your free disk space went with a specialised accessory**


    Files and directories tend to grow and occupy a large amount of disk space. These
    days even a couple of terabytes will run low when you decide to keep your movie
    collection there. Sometimes you don’t pay enough attention to how much you are
    actually downloading, copying or storing, meaning that your hard drive gets cluttered
    with lots of files, draining your free space. Disk Usage Analyzer, also known
    as Baobab, is a tool that comes within a standard Ubuntu desktop. It analyses
    any directory you throw at it and shows a colourful ring chart, where the size
    of each slice corresponds to a size of the respective subdirectory (Fig 1). This
    is a beautiful graphical representation with instant usefulness, letting you know
    what on your drive is using the most space. Sometimes it can be as simple as an
    overlooked temporary directory, or a giant log file, or just your media library
    that grew too fast.


    ### Get instant results

    Launch Disk Usage Analyzer by searching for this name or ‘Baobab’ in Ubuntu Dash.
    After it launches, you will be presented with a list of devices and locations.
    If a drive is mounted, it will be included in the statistics of your root partition.
    For example, if you mount a 4TB drive within a relatively small root partition
    (say, 20GB), the resulting ring chart will show your system directories within
    a hair-thin slice. For that reason, you will need to unmount any external media
    if you want to analyse what Ubuntu itself consists of. To get a structure of your
    home directory simply click its icon and wait while until Disk Usage Analyzer
    completes its job – this can take some time depending on how many files there
    are.


    “This is a beautiful graphical representation with instant usefulness”


    **77**

    **Ubuntu essentials**

    **77 Use the Disk Usage Analyzer**


    ### Dive into statistics

    There are no limitations with which directory you want to analyse. Disk Usage
    Analyzer lets you open any directory, be it a local or remote one. Click the small
    ‘gear’ icon in the top-right corner to open the desired location. If it is a remote
    one, please use the ‘Scan Remote Folder’ option and provide the correct address,
    for example Samba share addresses start with smb://. When you see the resulting
    ring chart, hover your mouse over a slice to see the details. Click a slice to
    dive in and set it as a top directory. The chart will adjust automatically and
    you will see more details about what content inputs overall directory weight.
    The left part of the screen compliments the chart with a tree view, with extra
    columns for usage percentage, size and number of items.


    ### Switch between graphical views

    This ring chart isn’t the only way you can get a graphical representation of data.
    In the lower right-hand corner of the application you’ll notice two buttons that
    let you switch between ring chart and treemap modes. Treemap is an alternative
    method of data visualisation with a strong focus on the size of units.


    The main difference between a ring chart and a treemap is that the latter shows
    all units together along subdirectories and large files. This actually works better
    when you need to estimate the relative sizes of different units. A treemap may
    be hard to understand when you first look at it, but it does help when you know
    how it’s built. Disk Usage Analyzer first draws the largest rectangle for your
    top-level drive or directory and then recursively subdivides it into smaller rectangles
    according to the size of content inside. Larger rectangles display their names
    instantly, others will give more information once hovered with a mouse.


    **Fig 1 (above)** Your usage data is broken down visually with Disk Usage Analyzer

