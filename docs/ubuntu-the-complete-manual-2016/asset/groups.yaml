    220 LibreOffice essentials


    As its name indicates, LibreOffice is the open-source equivalent of Microsoft
    Office. Complete with programs for word processing, creating databases, designing
    slideshows and more, it is the office suite for most popular Linux distributions.


    For regular users and novices, it can be difficult to comprehend just how powerful
    LibreOffice can be. It can be easy to get stuck in a rut and not make the most
    of what it has to offer. For example, on a day-to-day basis, you may have no call
    to use macros, creating indexes or doing a mail merge with Writer. But these features
    can vastly improve your productivity and efficiency (Fig 1).


    Over the next few pages, we are going to highlight some of the best ways you can
    improve your experience – particularly in the core Writer and Calc programs. You’ll
    optimise the way you work and start making the most of this feature-full office
    software.


    Make your working day more productive with these indispensable tips for the LibreOffice
    suite.


    **Fig 1 (below)** Use the LibreOffice apps more productively


    “For regular users and novices, it can be difficult to comprehend just how powerful
    LibreOffice can be”


    ### 01 Bring up formatting options

    Perhaps you are looking to introduce greater readability or to make sure your
    document prints exactly how you want it to. Either way, the way forward is in
    formatting the text. At first it can be a tricky to figure out why certain sections
    of text look how they do, so head to the formatting section to figure it out and
    make changes. On the toolbar is a symbol that looks like a backwards P – click
    that to reveal live formatting symbols, such as rogue paragraph breaks.


    ### 02 Better bullet points

    Creating a list of bullet points is fairly easy; click the type with dots or numbers
    and go. You can change the formatting of these bullet points to be different symbols
    or letters instead of numbers. You can, however, also create nested lists by using
    the Tab key to create sub-lists, and then press Shift+Tab to go back to the standard
    list.


    ### 03 Paste unformatted text

    Generally in Linux, you can use Ctrl+Shift+V to paste text and remove its formatting
    at the same time. If you use this in Writer, or find Paste Special in the Edit
    menu, you then have several options of how to paste the text (Fig 2). One of these
    is unformatted, but it also allows for other methods, such as using LibreOffice
    formatting.


    **Fig 2** The Paste Special function offers options for paste formatting


    ### 04 Quick maths

    Even when you’re writing, you might need to do a quick bit of maths. Instead of
    switching to Google or a calculator app, you can use the formula bar. Go to Insert,
    Object, Formula and write out the calculation you want. Once you have confirmed
    it, the outcome of the formula appears where your cursor was placed.


    “Even when you’re writing, you might need to do a quick bit of maths. Instead
    of switching to Google or a calculator app, you can use the formula bar”


    ### 05 Quick navigation

    Pressing F5 or going to the View menu will allow you to use the Navigator function.
    You can use it in large documents to quickly move between different headings,
    tables, graphics, bookmarks and many more objects in the document. It’s not a
    proper dock, so you can move it around to see what you want at any given time.


    ### 06 Set default document format

    By default, Writer will save new files as ODTs, the open document format. This
    works in most other word processors, but if you’re regularly working with files
    that need to work on Microsoft Office, you can change the default file format
    to be .doc or .docx. Go to Tools, Options and find the General settings under
    Load/Save to change the default.


    ### 07 Create backup

    Writer has a recovery system for when shutdowns happen, but that relies on temporary
    files. You can enable a backup system in the Load/Save options.


    ### 08 Change case

    Got a sentence or word not capitalised correctly? You can change case of what
    you want by selecting it and looking at the available menus. There is also an
    option to change it.


    ### 09 AutoFormat tables

    If you’ve created a table, you may need to add a touch of colour to make it readable.
    Using the AutoFormat option under Format can create a scheme. You can also modify
    it a bit once it’s in place.


    ### 10 Protect your spreadsheet

    Shared spreadsheets are good for productivity, but the more complicated they become,
    the more difficult it can be to track accidental change by one. You can protect
    the spreadsheet by using Tools>Document>Sheet so only certain people can make
    changes.


    ### 11 Change status bar preview

    When you select some cells with a numerical value, you get a handy prompt on the
    status bar that tells you they add to. That might not be what you want all the
    time, though. Click on that area of the status bar to bring up a menu and change
    it to average, maximum or minimum numbers.


    ### 12 AutoFilter rows

    Filtering rows helps organise data, but if you’re not sure how to go about that,
    Calc has an automatic filtering tool you can use. Select a row, then go to Data>Filter>Auto
    for it to create an automatic filtering system based on that row. You can also
    modify it a bit once it’s in place.


    ### 13 Grouped cells

    Sometimes you don’t need to see specific chunks of data all the time, and collapsing
    it like in a piece of code will add more space to the viewable page. Using the
    Outline function under Data>Group and Outline>AutoOutline, you can create these
    collapsible groups, which use a thick outline to indicate themselves.


    ### 14 Auto-increment or copy cells

    If you’ve never stumbled across it, Calc is very smart when it comes to replicating
    cells. If you write down two or three numbers or even dates, selecting one and
    dragging the black square down to copy will automatically fill in the cells with
    numbers or dates in the correct sequence. If you don’t want it to do that, press
    and hold Control when copying the cell for regular duplication.[/ '
