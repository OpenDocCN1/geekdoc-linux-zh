    ## 调整您的安全设置


    确保您的 Ubuntu 设置提供了适当的隐私保护


    隐私是安全计算的基石。您的数据应该受到保护，你的电脑应该防止未经授权的访问，并且您应该意识到从系统发送到远程服务器的个人数据。Ubuntu 在易用性和安全性之间取得了很好的平衡。例如，您无法直接登录
    Unity；相反，您实际上可以使用“sudo” 前缀来以管理员的身份运行命令。对于常规桌面活动，有一个“系统设置 > 安全与隐私”子部分，您可以在那里更改许多设置。大多数设置都与密码保护、保留文件和应用程序的日志与历史记录、Ubuntu
    Dash 中的在线搜索结果，以及 Canonical 用于修复错误和收集用户统计数据的诊断信息有关。您可能想要更改任何内容的原因可能各不相同。也许您不希望别人看到您最近使用过什么，或者可能是
    Dash 中的在线搜索结果分散了您的注意力。在 Ubuntu 的系统设置外壳之外，还有另一个安全设置。当您第一次启动 Firefox 时，它会要求您选择想要共享的数据。默认情况下，Firefox
    会向 Mozilla 发送崩溃报告和帮助报告，但仍由您决定并批准它们。


    ### 01 生成更强密码


    将您的 Ubuntu 密码设置为 12345678 或 P@ssw0rd 等简单内容没有意义。发明一种独特、复杂、足够长且最重要的是您确定自己不会忘记的符号组合是明智之举。一个良好的密码应该包含小写字母、大写字母、特种字符和数字。幸运的是，Ubuntu
    可以通过 APG 工具帮助您更好地处理更强的密码。使用 `$ sudo apt-get install apg` 安装它，并只需运行 `$ apg` 即可。APG
    将提示您输入一个自定义的随机单词，然后将您的建议转换为更强的字符组合，但仍然是可读的且不易于背诵，例如 WoudElIc6（Woud-El-Ic-SIX）。


    **Ubuntu 基础**


    ### 02 启用简单的防火墙


    防火墙是阻止外部网络入侵的有效工具，通过阻塞 IPv4 和 IPv6 协议中的某些网络数据包，限制双向的可疑网络活动。Linux 有“iptables”工具来执行这项工作，但对初学者来说并不直观。幸运的是，Ubuntu
    有一个名为 UFW 的 iptables 易用前端——Ubuntu 防火墙（图 1），位于其标准仓库中。使用以下命令安装：


    `$ sudo apt-get install ufw gufw`


    您可以从命令行（`$ sudo ufw --help`）或图形界面内（在 Dash 中搜索“firewall”或直接运行 `$ gufw`）来控制它。


    ### 03 启用自动安全更新


    让我们更进一步，让 Ubuntu 在无需与用户交互的情况下接收重要的安全更新。此功能非常有用，因为并不是所有更新都是在您不知情的情况下安装的，只有修复漏洞、严重错误、内存泄漏等的安全相关更新。要启用此功能，首先从安装软件包以及所需的脚本开始：


    `$ sudo apt-get install unattended-upgrades.`


    接下来，使用以下命令启用更新：


    `$ sudo dpkg-reconfigure -priority-low unattended-upgrades.`


    您需要做的就是每天/每周/每月将 unattended-grades 命令添加到您的 Cron 列表中。访问 bit.ly/1EtLKFF 查找更多详情。


    “一个良好的密码包含小写字母、大写字母、特种字符和数字。幸运的是，Ubuntu 可以帮助您”


    **Ubuntu 基础**


    **图 1** 启用 Ubuntu 防火墙并调整设置


    ### 保护您的电脑


    如果电脑在空闲一段时间后挂起或关闭显示，您可以设置 Ubuntu 需要密码才能继续使用电脑。


    #### 选择包含的内容

    在您的主目录内有音乐、图片、下载等默认位置。您可以决定想要将哪些项目项包含在 Ubuntu 日志中。除了目录外，还有聊天日志和办公文档。


    #### 相关设置

    第一个链接带您进入“用户账户”子部分，您可以在那里更改密码；第二个链接用于“电源设置”，您可以在那里更改系统挂起之前的时间段。


    #### 使用活动记录

    这是一个触发文件和应用程序使用日志的全局开关。您只需点击鼠标即可将其关闭，或者决定进行更精确的调整。


    #### 排除特定目录和程序

    使用“+”和“-”按钮选择 Ubuntu 不记录或跟踪的特定目录或应用程序。您甚至可以创建复杂的应用程序组合。


    #### 在线搜索结果如何？

    这是一个相当有争议的事项，这就是为什么 Canonical 决定在 16.04 中加入关闭模式。您可以随时在此更改触发器的位置。


    #### 诊断报告

    Canonical 需要您的反馈以便使 Ubuntu 变得更好。如果出现问题（例如程序崩溃），Ubuntu 将向其总部发送包含问题细节报告。


    “Ubuntu 在易用性和安全性之间取得了很好的平衡。例如，您无法直接登录 Unity；您可以使用‘sudo’前缀来以管理员的身份运行命令”


    **Ubuntu 基础**


    查找安全设置 查看安全与隐私工具


    **图 2（上方）** 通过使用“sudo”前缀获取 root 权限


    ### 04 配置 ‘sudo’


    “sudo” 是一个命令，您可以将其放在另一个命令之前，以便以 root 权限运行（图 2）。您可以随时对任何命令使用 sudo，但实际上，只有当您使用普通用户账户没有足够的权限时，才需要这样做——例如，管理打印机，或者当您需要向主目录之外的目录写入文件时。Ubuntu
    默认启用 sudo，这让您可以运行任何命令，但需要输入您的当前密码。可以通过执行 `$ sudo visudo` 命令来更改 sudo 设置，将在 Nano
    编辑器中打开 /etc/sudoers 文件。您可以通过 `$ man sudo` 发现 sudo 的魔法，但也可以通过更改以下行来获得快速解决方案：


    `username ALL=(ALL) ALL`


    改为：


    `username ALL=(ALL) NOPASSWD: ALL`


    从而停止 sudo 请求密码。


    调整您的安全设置


    **Ubuntu 基础**


    ### 熟悉 Dash


    熟悉 Dash

    桌面的神经中心，这些基本技巧和技巧将让您像专业人士一样使用 Dash


    从 Windows 平台切换到 Linux 系统的人经常会寻找流行的开始菜单。通常，开始菜单作为与电脑交互的起点，一旦您习惯了它，就会觉得它是操作电脑最自然的方式。坦率地说，Unity
    —— Ubuntu 系统的标准桌面环境提供了 Dash。


    将 Dash 视为 Ubuntu 系统的相当于开始菜单。Dash 允许您搜索应用程序、文件、音乐和视频，并显示最近使用的项目。Dash 还可以帮助您启动应用程序和文件快捷方式。


    启动 Dash，只需点击菜单栏左上部分的 Ubuntu 标志。您也可以按下键盘上的 super 键（带有 Windows 标志）来启动它。要退出 Dash，只需点击“esc”键即可。


