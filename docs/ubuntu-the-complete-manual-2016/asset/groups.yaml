    ## Get to grips with the Linux command line


    Well-chosen words can save you jumping through GUI hoops, so ensure you use the
    right commands.


    The command line may be an older interface, but the reason it’s survived is the
    power to tell the computer, in a few apposite commands, exactly what you want.
    For example, a single command can copy all of the MP3 and MP4 files in a directory
    to a backup disk or a machine elsewhere on the network – or anywhere else on the
    Internet.


    Many people’s first encounter with a computer – perhaps at university in the 1970s
    or 1980s – was seated at a dumb terminal, known as a console, connected to a distant,
    and very large, computer. Nowadays, computers can be the size of a credit card
    – like the Raspberry Pi – but the old-fashioned terminal is remembered in the
    form of the terminal program that gives you a command-line interface to Ubuntu.


    Depending on which flavor of Ubuntu you are running, the terminal may have a different
    name, but type ‘term’ into the app search of Unity Shell, or your menu, and you
    will bring up at least one choice of terminal. Open this up and you should see
    a fairly empty-looking window. Don’t be scared of that blinking cursor – usually
    the ‘$’ sign, known as the ‘dollar prompt’. It’s waiting to do whatever you tell
    it. You just need to know the right words – or commands – to get it going.


    Here’s an easy one for you to try first: type **evince** into the terminal - we’ll
    put the instructions you need to type into bold, so you can see commands more
    clearly; always press Enter afterwards, to let Ubuntu know it’s now got to do
    something.


    Provided you didn’t mistype, you’ll have just opened Ubuntu’s PDF reader, without
    using a GUI menu or shortcut item.


    ## Ubuntu essentials


    To look inside your Documents folder, open a terminal and type `ls Documents`.
    Don’t forget to press Enter. You’ll see a listing of all of the files in Documents.
    Type `ls` and you’ll see a listing of the files in your home directory – that’s
    because when you open a terminal, it places you in that directory. You can change
    by using the change directory command – `cd` – like this: `cd Documents`. Now
    `ls` alone will show you your files.


    The `cd -` command will take you back, because the `-` is a shortcut to tell `cd`
    to go back to where you were before. You could also type `cd ~`, as `~` is short
    for your home folder – /home/jo/ or whatever. `pwd` will remind you where you
    are now.


    Configuration files – the ones called dotfiles, because their names are prefixed
    by a dot – are normally hidden from listing. In most file managers you can toggle
    them into view with Ctrl+H (on a few, it’s Ctrl+.). At the terminal, it’s `ls
    -a`.


    The `.` and `..` are shortcuts to ‘this directory’ and ‘parent directory’, or
    the one above – hide them by using `-A` in place of `-a`. Those letters after
    the hyphen are called command-line switches: try `ls -l`, for long listing. We’ll
    tell you about some of that cryptic-looking info it displays later.


    Moving and copying files uses `mv` and `cp` commands. We’ll see `cp` in use overleaf,
    but for now we will replicate Fig 1 and attempt to move our files to a new location:


    ```bash

    cd ~

    touch random.txt

    mv random.txt newname.txt

    mv newname.txt Documents/

    ls

    ls Documents

    ```


    ## Files, folders, and familiar things


    Time to get the command line working for you, on your files and folders.


    ### Look Inside


    You don’t need to open an application to look inside a file. The `file` command
    will let you see what sort of file it is. `cat` sends the contents of the file
    scrolling by, or `more` gives them to you a page at a time. `less` does the same
    thing, with more controls, and leaves you stuck if you don’t know to press **Q**
    to quit. **Q** will also exit man pages; for other apps, Ctrl+C is a good bet
    for quitting. Sometimes you just want to see the first or last few lines of a
    file – `head` and `tail` are the commands you need, each defaulting to ten lines.
    `tail -n 30 /var/log/syslog` shows you the last 30 things registered by that log
    file. Real power comes with `grep` (Fig 2, page 56), to search for a term inside
    a file. Try `grep ls ~/.bash_history` to pull out all the instances of `ls` that
    you have used so far.


    ### Tab complete


    If you think that’s a lot of typing, try hitting the Tab key after a couple of
    letters of each word. Where there’s only a single possible completion, the word
    will be automatically filled in. Two tab clicks brings up suggestions where there
    are multiple possibilities.


    If you want to know more about a command, they (almost) all have manuals – or
    man pages (Fig 3). `man ls` will tell you all about options for `ls`; `ls` will
    tell you about the manual command itself.


    ### Using Nano


    Looking inside a file is one thing, but often we need to edit it. Nano is included
    in Ubuntu and many other distros, much friendlier. In this example, we’re going
    to use Nano to edit the `.bashrc` file.


    To open the file, type `nano ~/.bashrc`. Once inside, you can use the arrows to
    navigate to the text. Note that the lines in front of # are inactive (commented
    out). To activate them, delete the #.


    To save your work, hold down Ctrl+O and hit O. To exit, hit Ctrl+X.


    ### Permissions, please


    Ubuntu files are protected from alterations by other users on a shared machine.
    All files and folders belong to a user and a group. Permissions on each file relate
    to whether a user, group or anyone else can read, write, or execute the file;
    this is abbreviated as rwx. For directories, execute permission is just permission
    to open. Execute a file means run it as a program – so a JPG picture file doesn’t
    have permission to run.


    ### No attachment?


    While the protection offered by permissions is very useful, they are also there
    to trip up the unwary. For example, using sudo, you may have copied files from
    another user’s home folder. Unless you change the ownership, you may be left scratching
    your head when you try to attach the files to an email, and they just won’t stick
    – because you don’t even have permission to read the files!

    '
