    ## Ubuntu essentials


    ## Monitor Software & Updates


    Add more application sources and keep your system up to date


    Ubuntu comes with pre-installed applications and accessories for basic computing
    tasks and activities. Software & Updates lets you customise the standard set of
    software sources, configure updates and manage additional drivers. A software
    source is a general term that includes both online repositories and local media.
    You can turn standard Ubuntu software source on and off, manage third-party source
    and authenticate them with signing keys. With Nvidia or AMD graphics, you can
    install a proprietary driver, but it cannot be included in Ubuntu right away due
    to license restrictions.


    ### Install additional drivers


    A common case when Ubuntu users turn to the Additional Drivers tab in Software
    & Updates is graphics drivers. Computers with Nvidia and AMD video chips are supported
    in Ubuntu out of the box, but the system utilises open source drivers (‘nouveau’
    and ‘radeon’ respectively), that still lag behind a proprietary driver for 3D
    performance and gaming. To replace an open source driver with a proprietary one,
    go to the Additional Drivers tab and wait for a while before Ubuntu discovers
    if there is a proprietary driver for your hardware. It will not necessarily be
    a video card: dozens of drivers for wireless networks and various firmware bits
    that improve system performance cannot be shipped directly because of their licenses.


    When you decide to go with one or several non-free drivers, simply select them
    and press the Apply Changes button. Ubuntu will download all required files in
    the background and install drivers automatically. You will then need to logout
    and log back in, or better, restart the system.


    Ubuntu periodically checks for its updates online and if it finds a newer version
    for at least one package, a special notification pops up. In the Software & Updates
    application, you can choose what updates the system looks for and how frequently
    checks should be carried out. To do this, go to the Updates tab and review the
    list of ticked boxes. By default, Ubuntu looks for security updates, recommended
    updates for regular packages and also for backported software that is not supported
    by Canonical, but contributes to the Ubuntu experience. The next four drop down
    menus control the updates frequency and behavior. For instance, here you can program
    Software & Updates to download and install all or particular updates automatically,
    without disturbing the user. This can be helpful for unattended Ubuntu installation
    with a stable Internet connection. The last drop down menu lets you choose whether
    Ubuntu should notify about any new version of the OS itself or about long-term
    support version (LTS) only. If don’t like to hop to newer versions too often,
    stick to LTS releases.


    ### Set up updates


    Add or remove software sources


    Standard Ubuntu repositories can be managed on the Ubuntu Software tab in Software
    & Updates. It lists the Main repository, for which Canonical (the Ubuntu maker)
    provides official support; the Universe repository, which is maintained by Ubuntu
    community; the Multiverse repository with proprietary software; and the Restricted
    one with closed-source device drivers. If you somehow need to develop software
    in Ubuntu yourself, you can enable the Source repository. Below are other helpful
    controls for selecting the nearest mirror (this can boost a package’s download
    speed) and the optional switch for Ubuntu CD/DVD with standard delivery of packages.
    The ‘Other software’ tab lets you add third-party repositories and by default
    lists entries within the Canonical Partners repository and the extra Independent
    repository for even more software (Fig 1). Press the ‘Add’ button to add a new
    repository, ‘Edit’ to change details and ‘Remove’ to delete a repository. There
    are many additional repositories on the Internet, but always approach with caution.


    “Standard Ubuntu repositories can be managed on the Ubuntu Software tab”


    **Fig 1** Use Software & Updates to add third-party repositories


    ## Work with Universal Access


    Configure accessibility settings to make Ubuntu more user friendly


    Ubuntu is a friendly place for everyone, including people with reduced capabilities
    or disabilities. If you need to use special settings for a more comfortable user
    experience in Ubuntu, there is a dedicated subsection called Universal Access
    inside System Settings. If you want to, you can also launch it separately by searching
    its name in the Dash or by using the $ unity-control-center universal-access command
    in the terminal. Universal Access consists of a large number of settings divided
    into four individual categories: seeing, hearing, typing, and pointing and clicking.
    Each category has switches that improve usability and make the most out of Ubuntu.
    Ubuntu ships with a high-contrast icon theme and the Large Text switcher, both
    of which help visually impaired people see more on their screens. There is also
    a screen reader (Fig 1), which pronounces window titles and messages, an on-screen
    keyboard, advanced sound notifications and more.


    ### Using the keyboard as a cursor


    If moving a mouse in a regular manner is uncomfortable, you can control the mouse
    cursor from a keyboard using the arrows. This accessibility feature can be enabled
    by going to the Pointing & Clicking tab and putting the Mouse Clicks switcher
    on. There are also two ways to trigger a mouse click without clicking its buttons.
    The first tweak is to simulate secondary click in double-clicking by holding the
    left mouse button down for some time. Second, you can simulate a click by hovering
    a mouse cursor over an item and waiting longer. For either, there are helpful
    sliders that let us adjust a delay. Regular mouse settings in the Mouse & Touchpad
    subsection also contribute to a more flexible mouse performance. There you can
    lower the double-click delay, change cursor speed and switch buttons arrangement
    if you need a mouse for left-handed use.


    The Typing tab in Universal Access houses a list of options that help input data
    using a keyboard for those who are unable to type and need assistance (Fig 2).
    The most noticeable option here is the on-screen keyboard switch that enables
    text input using mouse clicks. The on-screen keyboard will appear after you re-log
    in to a session. It looks like a desktop widget that flows at the top of any windows.
    There are various keyboard tweaks that can ease input in some cases, such as sticky
    keys (treats a sequence of modifier keys as a key combination), slow keys (puts
    a delay between when a key is pressed and when it is accepted) and bounce keys
    (ignores double pressing a key in a short period). This can be complemented with
    extra audible notifications, such as beeping when certain keys are pressed. The
    on-screen keyboard in Ubuntu can also be used for extra security if you feel the
    use of a physical keyboard can compromise your privacy.


    “If you need to use special settings for a comfortable user experience in Ubuntu,
    there is a dedicated subsection called Universal Access”


    ### Adopting Orca screen reader


    The default screen reader in Ubuntu is called Orca. It can be enabled in the Seeing
    tab of Universal Access, or it can also be launched from command line ($ orca).
    Orca pronounces titles and text corresponding to the controls in use. To access
    Orca preferences after enabling it for the first time, press ‘Ins + Space’ on
    a desktop keyboard or ‘Caps lock + Space’ on a laptop. A new window will open,
    and Orca will announce “Screen reader preferences. General page tab.” You can
    now configure Orca to your liking, change voice type and speed, redefine key bindings,
    turn Braille support on or off and change lots of other tunables. Orca also lets
    you customise its verbosity and define the categories of text that will be spoken.
    It also has a built-in help system in audible mode. Press ‘Ins + H’ or ‘Capslock
    + H’ to hear instructions and references to other important key bindings.


    **Fig 2 (above)** Customise your computing experience with typing options


    **Fig 1** Tweak screen settings for better usability

