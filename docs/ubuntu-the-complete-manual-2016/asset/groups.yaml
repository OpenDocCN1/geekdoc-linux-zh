  - "[PAGE 58]\n\n![](img/a6bf9da4751f37b25a0d6611dc73918d_58_0.png)\n\n**59**\n\n\
    “Permissions on each i le relate to whether a user, group \n\nor anyone else can\
    \ read, write or execute the i le; this is \n\nabbreviated as rwx permissions”\n\
    \n**Long listing**\n\nRunning ls -l lets you see who owns \n\na file or folder,\
    \ and who has permission \n\nto read, write and run software. Three \n\ngroups\
    \ of rwx in the listing apply, \n\nrespectively, to the named user, the \n\nnamed\
    \ group, and everyone else left\n\n**Give me the file**\n\nIf you’ve copied a\
    \ file into your folder \n\nusing sudo, you may have left it with \n\nroot ownership.\
    \ Change the ownership \n\nwith chown jo myfile.txt – for \n\nexample – and the\
    \ group with chown \n\n:audio myfile.mp3. Fill both sides \n\nof the ‘:’ to change\
    \ user and group \n\nownership together\n\n**Octal code**\n\nThe rwx – read /\
    \ write / execute \n\npermissions – are given respective \n\nvalues of 4, 2 and\
    \ 1. To give a file read \n\n\\+ write + execute permissions, 4, 2 and \n\n1 are\
    \ added to give 7. For just read and \n\nexecute, 4 + 1 = 5. Applying the former\
    \ \n\nto user and group, and the latter to \n\n‘other’, chmod 755 file.txt.\n\n\
    **Run with it**\n\nA file becomes a program when it can \n\nbe run. You write\
    \ or download a shell \n\nscript, say backup.sh, and try to run it \n\n\\- ./backup.sh\
    \ – and nothing happens. \n\nYou need to give it executable \n\npositions: to\
    \ save the octal adding, you \n\ncan just chmod u+x backup.sh. You \n\ncan also\
    \ call it with sh backup.sh.\n\nGet to grips with the Linux command line\n\n**Ubuntu\
    \ essentials**"
  - "[PAGE 59]\n\n![](img/a6bf9da4751f37b25a0d6611dc73918d_59_0.png)\n\nGive me more\
    \ software\n\nDespite every flavour of Ubuntu having a graphical program to install\
    \ \n\nsoftware onto the system, you’ll usually see projects supplying the \n\n\
    command-line way of getting their software. The reason for this is that the \n\
    \ncommand-line instructions are direct and unambiguous. Let’s try it out, and\
    \ \n\nyou’ll see what we mean.\n\nUbuntu, as you may have read elsewhere within\
    \ these pages, is based \n\nupon Debian, one of the earliest GNU/Linux distributions,\
    \ dating back \n\nto 1992. It’s an open collaborative project between over a thousand\
    \ \n\ndevelopers across the world co-operating over the Internet, which has \n\
    \ncontributed to its longevity. So too has the Debian package management \n\n\
    system, and the command-line program to manage fetching and installing \n\nthe\
    \ packages. Apt – the Advanced Package Tool – keeps track of all of the \n\nsoftware\
    \ in Ubuntu’s repositories, and takes care of any dependencies on \n\nother packages\
    \ when you install. It’s what the Ubuntu Software Centre uses \n\nbehind the curtain\
    \ of that graphical interface.\n\nEvery step that involves installing software\
