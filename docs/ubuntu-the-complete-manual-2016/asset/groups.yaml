    \ the ‘Use colors from my system theme’ option \n\nand choose any combination\
    \ of colours for text, text in bold and background. \n\nThere is a list of good\
    \ presets in the ‘Built\\-in schemes’ drop\\-down menu; it can \n\nsave you from\
