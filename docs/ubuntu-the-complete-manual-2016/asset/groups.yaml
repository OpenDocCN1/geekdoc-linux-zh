- md: "\n![](img/a6bf9da4751f37b25a0d6611dc73918d_13_0.png)\n\n## Getting started\n\
    ### Get to know Ubuntu\n\n**14**\n\nFor example, some programs add an icon to\
    \ the indicator area automatically during installation. You should note that every\
    \ application features its own menu system wherein diferent \n\nactions can be\
    \ executed within it (such as File, Edit, View and so on). Appropriately, the\
    \ menu system for an application is known as the application menu.\n\nAnother\
    \ thing that we need to understand in Ubuntu is the ‘Launcher’ – the vertical\
    \ bar of icons available on the left side of the desktop (Fig 6). With the help\
    \ of this Launcher, one can easily access the various applications, mounted devices\
    \ and trash. Note that any application that is running will have its icon placed\
    \ in the Launcher bar.\n\nIn Ubuntu, we commonly come across something called\
    \ ‘Dash’. If you have used Windows in the past, you can consider Dash as something\
    \ similar to the Windows Start menu. The Dash will help you to find the applications\
    \ and files you’re looking for on your machine. To explore the Dash, you need\
    \ to click on the topmost icon on the Launcher. Now you will be able to see a\
    \ window with a search bar on the top as well as the recently accessed applications,\
    \ files and downloads.\n\n**Fig 6 (above)** To run any application from the Launcher,\
    \ you just need to click on the application’s icon\n\n**Fig 7** Type to search\
    \ for files or folders and suggested results will appear in the Dash menu\n\n\
    ![](img/a6bf9da4751f37b25a0d6611dc73918d_14_0.png)\n\n## Getting started\n###\
    \ Get to know Ubuntu\n\n**15**\n\n**Fig 8 (above)** Conduct a computer and Internet-wide\
    \ search from the Dash\n\n**Fig 9 (above)** Navigate to the browser app for more\
    \ advanced searches\n\n![](img/a6bf9da4751f37b25a0d6611dc73918d_15_0.png)\n\n\
    ## Getting started\n### Get to know Ubuntu\n\n**16**\n\nAs mentioned above, Dash\
    \ is a very powerful tool that can be used to search for files and applications\
    \ on your computer. Find files or folders by simply typing a portion of the file\
    \ or folder name (Fig 7, page 14). As you type, the results will appear in the\
    \ Dash.\n\nAs expected, a standard Ubuntu installation comes with many applications,\
    \ but users can additionally download thousands of applications from the Ubuntu\
    \ Software Centre. The Applications lens on the Dash will automatically categorise\
    \ installed applications under ‘Recently Used’, ‘Installed’ or ‘More Suggestions’.\
    \ You can also enter the name of an application (or a part of it) into the search\
    \ bar in the Dash, and the names of applications matching your search criteria\
    \ will appear (Fig 8, page 15). Even if you don’t remember the name of the application,\
    \ type a keyword that is relevant to that application and the Dash will be able\
    \ to find it.\n\nAnother thing that we need to understand here is that in addition\
    \ to searching your local machine for files and applications, Dash can help in\
    \ searching various online resources.\n\nNow let’s take a look at how to browse\
    \ the files on your machine. In addition to using Dash to search for files, one\
    \ can also access them directly from their directory. The home directory (Fig\
    \ 10) is\n\n**Fig 10 (below)** Search the home directory for files on your machine\n\
    \n![](img/a6bf9da4751f37b25a0d6611dc73918d_16_0.png)\n\n## Getting started\n###\
    \ Get to know Ubuntu\n\n**17**\n\nused to store all of your personal files (instead\
    \ of system-related files). Sometimes, you may need to make use of the ‘Files’\
    \ file manager window. Whenever you select the Files shortcut in the Launcher,\
    \ Ubuntu will open this file manager.\n\nAs you can see from the screenshot opposite,\
    \ this window comes with the following features:\n\n- **menu bar**: It is located\
    \ at the top of the screen. With this menu bar, one will be able to browse and\
    \ remove bookmarks, open a new window, connect to a server, quit etc.\n- **title\
    \ bar**: This indicates the name of the currently selected directory.\n- **toolbar**:\
    \ This displays your location in the file system, a search button etc.\n\n**Fig\
    \ 11 (below)** Most customisation options are available in the System Settings\
    \ menu\n\n![](img/a6bf9da4751f37b25a0d6611dc73918d_17_0.png)\n\n## Getting started\n\
    ### Get to know Ubuntu\n\n**18**\n\nUbuntu uses the Linux file system and it is\
    \ based on a series of folders in the root directory. These folders contain important\
    \ system files that cannot be modified unless you are running as the root user\
    \ or use the sudo command. With this restriction, computer viruses will not be\
    \ able to change the core system files, and normal users will not be able to accidently\
    \ change anything that is critical.\n\nUbuntu\n\nSometimes, you may need to customise\
    \ your desktop. Most customisation can be achieved via the Session Indicator and\
    \ then selecting System Settings to open the Settings window (Fig 11, page 17).\n\
    \nUnderstand the terminal\n\nAlthough Ubuntu provides a GUI, to fully utilise\
    \ the power of the OS you’ll need to understand the command-line interface. Any\
    \ operating system has two types of user interface:\n\n- **GUI**: This is the\
    \ desktop, windows and toolbars that you click to get things done.\n- **Command-line\
    \ interface (CLI)**: The terminal is called CLI. It is a method for controlling\
    \ some aspects of Ubuntu using only commands that you type on the keyboard.\n\n\
    A terminal can be opened by hitting Alt+Ctrl+T or by right-clicking on the desktop\
    \ and selecting ‘Terminal’ from the menu. Please note that all the commands in\
    \ the terminal follow the same approach: you type the command, possibly followed\
    \ by some parameters, and then press Enter in order to perform the specified action\
    \ (Fig 12).\n\n![](/a6bf9da4751f37b25a0d6611dc73918d_18_0.png)\n\n## Getting started\n\
    ### Get to know Ubuntu\n\n**19**\n\nUbuntu is considered to be secure primarily\
    \ thanks to the following reasons:\n\n- Source software like Ubuntu are often\
    \ released quickly.\n- Security flaws can be easily detected.\n- Understanding\
    \ concepts such as file permissions, passwords and user accounts will also help\
    \ in securing your computer.\n\nTroubleshooting tasks: If you face any difficulties\
    \ using Ubuntu, you may need to use the terminal. If you need to perform operations\
    \ on multiple files at the same time, the terminal is the preferred method.\n\n\
    Ubuntu offers various text editors which are installed by default. The most commonly\
    \ used command-line editor is called Vim. The table below gives quick information\
    \ about some of the important files in Ubuntu.\n\n| File | A quick description\
    \ |\n| :--- | :--- |\n| /etc/issue | Information about the OS |\n| /etc/apt/sources.list\
    \ | Software repository locations for Ubuntu |\n| /usr/share/tomcat | Path to\
    \ tomcat files |\n\nAnother concept that users need to know about is mounting\
    \ and unmounting removable devices. Mounting a device means associating a directory\
    \ name with the device, and this in turn allows you to navigate to the directory\
    \ to access the device’s files. When you’ve finished using a device, you can safely\
    \ unmount it. Unmounting a device disassociates the device from its directory,\
    \ allowing you to eject it.\n\n**Fig 12 (above)** Use the terminal to conduct\
    \ actions using the command line\n"
