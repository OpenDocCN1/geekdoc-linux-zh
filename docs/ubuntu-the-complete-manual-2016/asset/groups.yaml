    软件中心包含由 Ubuntu 自身提供的程序列表，以及 Canonical 合作伙伴提供的软件（那些遵守 Ubuntu 软件规则的程序）。软件中心中可用的程序数量持续快速增长，因此有很多选择。简单来说，Ubuntu
