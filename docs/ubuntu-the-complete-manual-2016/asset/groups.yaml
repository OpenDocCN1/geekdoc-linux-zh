    **Ubuntu apps**


    Listen to songs with Rhythmbox


    124


    High-quality headphones are a great help for dealing with background noise – and
    thanks to multi-core CPUs, playing music in the background is simple.


    Sadly, obtaining media files is but part of the challenge; once a few thousand
    MP3 files populate your storage, music management becomes a severe and annoying
    problem of its own. Ubuntu addresses this problem via the Rhythmbox media player.
    It is a combination of a media database, an online radio player and a classic,
    low-resource-consumption media playback utility.


    Getting started with Rhythmbox is easy: click a media file in Nautilus, and the
    player will appear on-screen. Minimise it to profit from background playback –
    the music keeps on running even if you close the application.


    Sadly, using Rhythmbox in this fashion means ignoring most of the interesting
    features of the product. Advanced users can create custom playlists containing
    favourite hits – some obscure Falco tracks provide a sure-fire way to distract
    yourself from your work!


    In addition to that, the program can also be used as a crossfade engine. This
    means that the annoying gaps between normal MP3 files get “bridged over” by superimposing
    the songs onto one another – it might not be able to imitate a DJ’s handywork,
    but it is definitely better than nothing.


    Use your workstation to listen to music while you work


    “Rhythmbox is a combination of a media database, an online radio player and a
    classic, low-resource-consumption media playback utility”


    ![](img/a6bf9da4751f37b25a0d6611dc73918d_124_0.png)


    **Ubuntu apps**


    Listen to songs with Rhythmbox


    125


    **Playback controls**


    If it worked for Apple’s iPod, it also works for Rhythmbox. These three buttons
    control the playback of the currently selected file. This mini-controller is handy
    for changing what’s playing quickly.


    **dbus callout**


    Rhythmbox integrates itself into the dbus event system of Ubuntu. This means that
    the currently playing track gets displayed in an annunciator display even if Rhythmbox
    is not actually in the foreground at that time.


    **Shuffle and Repeat**


    No matter how long your playlist is, it eventually reaches its end. Enabling the
    loop mode makes short work of this problem, as Rhythmbox simply starts again from
    the beginning.


    Play tunes with Ubuntu Use Rhythmbox to play music unnoticed


    **Track information**


    Music takes centre stage in Rhythmbox. The two labels next to the album cover
    swatch provide information about the currently playing track, along with the album
    and the artist.


    **Media storage list**


    The big table below the playback controls provides you with an overview of the
    media currently scheduled for playback. Double-click an item to start playing
    it.


    **Volume toggle**


    Reducing Rhythmbox’s volume independently from the rest of the system can be helpful.
    Click the speaker symbol and then peruse the controls in the flyout to suit your
    preferences.


    **Album cover preview**


    Even though music is an aural experience, adding some visual spruce is totally
    worth it. Double-click the small icon to open a pop-up with a bigger version of
    the image.


    **Seek bar**


    Ever feel like skipping over boring interludes and intros? Grab the seek bar and
    drag it to the right. The playback position will be adjusted automatically.


    ![](img/a6bf9da4751f37b25a0d6611dc73918d_125_0.png)


    **Ubuntu apps**


    Listen to songs with Rhythmbox


    126


    ##01


    This tutorial starts out with a scenario to think about: a friend provides you
    with a Gigabyte worth of Falco tracks. Let’s assume that the USB stick containing
    the files has already been returned and the music currently sits in a subfolder
    of a hard disk on your machine. Start out by clicking File>Add Music. Next, click
    the arrow next to the combobox and choose Other to open a file selection dialog.
    Then proceed to navigate to the folder containing the subfolders with the albums.
    Finally, click Open to close the common dialog.


    Import the tracks


    Manage your tunes Organise large volumes of media


    “When the analysis is done, the list below the import controls will populate itself
    with further information”


    ##02


    Rhythmbox will proceed to scan the contents of the folder. This process can take
    up to one second per file, which means that patience is a virtue here. When the
    analysis is done, the list below the import controls will populate itself with
    further information.


    Set tracks


    Set importing options


    Click the Import button to add them to library. Choose where you want the music
    to be imported (Fig 1). Ticking the ‘Copy files that are outside library’ checkbox
    instructs Rhythmbox to copy the media into Music folder. This is recommended if
    it resides on a removable device, but should be disabled otherwise.


    ![](img/a6bf9da4751f37b25a0d6611dc73918d_126_0.png)


    **Ubuntu apps**


    Listen to songs with Rhythmbox


    127


    ##04


    Even though music is an aural experience, adding some visual spruce is totally
    worth it. Double-click the small icon to open a pop-up with a bigger version of
    the image.


    The list will offer three choices: Genre, Album and Track.


    Search for tracks


    ##03


    Return to Rhythmbox and click the Music tab; show the imported tracks. Double-click
    a song to start playback. The results will, of course, be shown in the list. Alternatively,
    right-click a file to open a context menu.


    View your tracks


    ##05


    An empty playlist is not worth much. Add tracks to its content by dragging and
    dropping; select the file in the Music view, and drag it to the playlist.


    ##06


    Create a new one by clicking the ‘+’ symbol at the bottom-left of the Rhythmbox
    window. Then, click ‘New Playlist’ and proceed to enter the name of the playlist.
    Finally, press return and Rhythmbox will commit the entered text into memory.


    Populate the playlist


    Select the playlist on the left side of screen. Click any of the tracks in order
    to start playback – now just lean back and enjoy the show!


    Fig 2 All songs will be separated by artist and album


    ![](img/a6bf9da4751f37b25a0d6611dc73918d_127_0.png)


    128


