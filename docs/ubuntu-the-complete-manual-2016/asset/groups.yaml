    ## 熟悉 Dash


    ![](img/a6bf9da4751f37b25a0d6611dc73918d_38_0.png)


    ### Dash 范围 (Scopes) 与视图 (Lenses)


    Dash 是查找内容的通用窗口，但由于计算机上有多种类型的内容，结果被划分为更小的范围或视图（图 1）。Dash 有了一系列范围，在逻辑上分离结果，并为你的文件、文件夹、应用程序和数据提供视图。默认安装的范围包括：首页（Home）、应用程序（Applications）、文件（Files）、视频（Videos）、音乐、照片和在线（社交媒体）。


    当你启动 Dash 时，会在顶部看到一个搜索栏。这是所有视图通用的。只需开始输入，下方就会出现结果列表。注意这是首页视图（home lens）。首页视图是默认视图，除非你显式选择其他视图，否则它将会出现。你可以通过点击底部栏上的选项之一（当
    Dash 激活时）来显式选择视图。其他视图只会显示与你的搜索查询相关的对应范围的项目。例如，如果你输入文本作为搜索查询，首页视图将显示来自整个计算机的结果，但如果你将其更改为应用程序视图，你会看到文本编辑器作为第一个结果。


    ### Dash 快捷键


    你可以使用几个快捷键来加速与 Dash 的交互。例如，按下 Super 键并保持一会；启动启动器（Launcher）旁会显示一个数字列表。你只需按下键盘上相应的数字即可打开任何应用程序。当你按住
    Super 键时，你会看到一个列出多个快捷键的窗口。


    要直接跳转到应用程序视图，只需同时按下 Super 键和字母 A。音乐视图也是如此，同时按下 Super 键和 M。对于视频，按下 Super 键和 V。


    Super 键+C 带你进入照片视图，Super 键+F 打开文件视图。如果你想在视图之间快速切换，可以在进入 Dash 后使用 Ctrl+Tab 在视图间切换。


    **图 1（上图）** Dash 中的搜索结果按逻辑分类分类


    ## Ubuntu 基础知识


    ![](img/a6bf9da4751f37b25a0d6611dc73918d_39_0.png)


    ### 在 Dash 中管理视图


    尽管 Dash 在显示搜索结果方面提供了很大的灵活性，但你可能希望移除列出的某些结果，或者添加某些默认隐藏或简单不存在的结果。Ubuntu 软件中心（Ubuntu
    Software Centre）有一个小型应用程序可以帮助你完成这些。让我们先安装它。打开 Dash。将范围更改为“应用程序”并搜索“主菜单”。在出现的结果中，点击指向“Ubuntu
    软件中心”的链接。点击页面右上角的“安装”来安装软件。现在，使用启动器或 Dash 打开主菜单应用程序。


    你现在可以在这里启用、禁用甚至永久删除项目或整个类别。查看左侧列中的类别。你可以取消勾选项目或类别以隐藏它们，并重新勾选它们以使其重新变得可搜索。这不会安装或卸载任何软件，只是停止结果在
    Dash 搜索结果中的显示（图 2）。这样，你就可以确保不会破坏任何重要内容。


    ### 过滤 Dash 响应


    每个视图的右上角都有过滤选项。你可以点击“过滤结果”（Filter results）链接来展开选项。注意，这些选项是与上下文相关的——也就是说，不同视图下有不同的选项。在“首页”选项卡中，过滤选项允许你选择显示的类别以及可以从中获取结果的在线来源。


    “应用程序”选项卡的过滤器包括按类型（如图形）、游戏、互联网应用程序等进行过滤的能力。过滤器还允许你在已安装的应用程序和在 Ubuntu 软件中心中出现的应用程序之间缩小搜索范围。同样，如果你在“文件”视图中，你将能够根据类型、大小和最后编辑时间来过滤结果。“音乐”视图按流派和年代进行过滤。“照片”视图根据照片拍摄日期进行过滤。


    **图 2（上图）** 你可以使用 Ubuntu 软件中心自定义你的 Dash 搜索结果


    ## 熟悉 Dash

    ## Ubuntu 基础知识


    ![](img/a6bf9da4751f37b25a0d6611dc73918d_40_0.png)


    -   **文本区域**：这是你向 Dash 输入查询内容的地方。当你输入文本时，你会看到下方空间动态地填充结果。

    -   **应用程序**：此部分显示与应用程序范围相关的结果。你将在这里看到所有匹配搜索查询的应用程序。

    -   **天气**：Dash 自动检测可能与搜索查询相关的范围。由于有一个名为 Dash 的地方，它会自动显示该位置的天气预报。

    -   **更多建议**：这是显示来自在线网站结果的部分。

    -   **参考**：此部分显示与查询相关的参考。你可以看到树中的所有目录。

    -   **范围**：Dash 默认显示所有可用范围。你可以将结果限制在特定范围内。

    -   **类别**：这显示你想看到的类别。

    -   **来源**：这允许你选择 Dash 在何处查找。


    “每个视图的右上角都有过滤选项。你可以点击‘过滤结果’链接来展开选项。注意，这些选项是与上下文相关的——也就是说，不同视图下有不同的选项。”（等等，这段文字重复或重叠了）


    ## 熟悉 Dash

    ## Ubuntu 基础知识


    ![](img/a6bf9da4751f37b25a0d6611dc73918d_41_0.png)


    ### 理解文件系统


    Linux 最复杂的事情之一可能是它的文件系统。对于初 Linux 的学者来说，这就像一个迷宫。Ubuntu（像所有 Unix 系统一样）将文件组织在层次级树中，其中关系通过父子关系来考虑。树中的任何元素都可以通过路径名引用。绝对路径以字符
    `/` 开头；相对路径不是以 `/` 开头的；在这种情况下根取决于上下文，称为当前目录。从根目录执行时，它会显示所有目录。单点表示当前目录；双点表示父目录。这里有许多用途不同的文件。对于初
    Linux 的学者来说，这就像一个迷宫。


    理解文件系统


    ![](img/a6bf9da4751f37b25a0d6611dc73918d_42_0.png)


    ### 列出命令


    `ls` 列出目录下的所有文件，`-la` 扩展以长格式列出所有隐藏文件。从根目录执行时，它会显示所有目录。


    | 列 | 描述 |

    | :--- | :--- |

    | 第一列 | 第一个字符表示它是目录还是文件。其余九个字符表示文件所有者、组和其他人的权限。 |

    | 第二列 | 此列显示目录内部的链接或目录数量。 |

    | 第三和第四列 | 第三列显示文件的所有者，第四列显示文件所属的组。 |

    | 第五列 | 此列显示以字节为单位的大小。你可以通过结合 `-l` 使用 `-h` 选项来修改；这将以 KB、MB 和 GB 输出，以便更好地理解大小。
    |

    | 第六列 | 显示目录最后修改的时间戳。 |

    | 文件名 | 这里列出了所有的目录/文件名。 |


    ### 特殊文件


    在 Linux 任何地方执行 `ls` 命令，你都会在顶部看到这两个文件。但是，如果你通过图形用户界面（GUI）检查同一个目录，这些文件是不可见的。单点表示当前目录；双点表示父目录。


