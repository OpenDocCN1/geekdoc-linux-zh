    “Permissions on each file relate to whether a user, group or anyone else can read,
    write or execute the file; this is abbreviated as rwx permissions”


    ## Long listing

    Running `ls -l` lets see who owns a file or folder, and who has permission to
    read, write and run software. Three groups of rwx in the listing apply, respectively,
    to the named user, the named group, and everyone else left.


    ## Give me the file

    If you’ve copied a file into your folder using sudo, you may have left it with
    root ownership. Change the ownership with `chown jo myfile.txt` – for example
    – and the group with `chown :audio myfile.mp3`. Fill both sides of the ‘:'' to
    change user and group ownership together.


    ## Octal code

    The rwx – read / write / execute permissions – are given respective values of
    4, 2 and 1. To give a file read + write + execute permissions, 4, 2 and 1 are
    added to give 7. For just read and execute, 4 + 1 = 5. Applying the former to
    user and group, and the latter to ‘other’, `chmod 755 file.txt`.


    ## Run with it

    A file becomes a program when it can be run. You write or download a shell script,
    say `backup.sh`, and try to run it `- ./backup.sh` – and nothing happens. You
    need to give it executable positions: to save the octal adding, you can just `chmod
    u+x backup.sh`. You can also call it with `sh backup.sh`.


    Get to grips with the Linux command line


    ## Ubuntu essentials


    ### Give me more software

    Despite every flavour of Ubuntu having a graphical program to install software
    onto the system, you’ll usually see projects supplying the command-line way of
    getting their software. The reason for this is that the command-line instructions
    are direct and unambiguous. Let’s try it out, and you’ll see what we mean.


    Ubuntu, as you may have read elsewhere within these pages, is based upon Debian,
    one of the earliest GNU/Linux distributions, dating back to 1992. It’s an open
    collaborative project between over a thousand developers across the world co-operating
    over the Internet, which has contributed to its longevity. So too has the Debian
    package management system, and the command-line program to manage fetching and
    installing the packages. Apt – the Advanced Package Tool – keeps track of all
    of the software in Ubuntu’s repositories, and takes care of any dependencies on
    other packages when you install. It’s what the Ubuntu Software Centre uses behind
    the curtain of that graphical interface.


    Every step that involves installing software on your system needs root, or superuser,
    permissions: on Ubuntu this is done by prefixing the command with ‘sudo’. On some
    other systems you would log in as root user; you can temporarily do this on Ubuntu
    by running `sudo -s` or `sudo bash`, but we don’t recommend it, as it’s easy to
    get into the habit of running with root permissions, and to accidentally cause
    some damage.


    Update Ubuntu’s knowledge of the latest available packages with `sudo apt-get
    update`. You can look under `/etc/apt/` to see the source files where Ubuntu remembers
    which repositories to look in. You can edit these manually to add more, and to
    change version for upgrading (proceed with care!). But the simplest way to add
    a new repository is with `apt-add-repository`: `sudo apt-add-repository ppa:jon-hedgerows/get-iplayer`.
    After which you’ll need to run `sudo apt-get update again, before installing from
    the repository: `sudo apt-get install get-iplayer` (Fig 7). The get-iplayer script
    is a command-line piece of software for timeshifting BBC radio (and TV) programmes;
    apt-get upgrade will install all of the security updates and bugfixes that have
    been made recently. This is something you should run regularly (but to save you
    the trouble, Ubuntu tells you that updates are available, and regularly asks permission
    to get them). Run `apt-cache search terminal` to find alternative terminal programs,
    and `apt-cache show terminal` to examine one of them. Now you know the basics,
    explore a little more.


    ### Use GNOME Terminal & Xterm

    Explore the basics and benefits of the terminal emulators in Ubuntu


    Ubuntu ships with two terminal emulators. One is GNOME Terminal, a widely used
    program and probably the only known terminal application for many Ubuntu users.
    GNOME Terminal is one of many GTK-based apps that Unity desktop shares with GNOME
    Shell – many tools and accessories are the same in Unity and GNOME. GNOME terminal
    looks clean and minimalist, but it has enough settings that let you configure
    this small application to suit your needs and tastes. Choose Edit>Profile Preferences
    to edit the current ‘Default’ profile for the sake of different behaviour or a
    custom look and feel. GNOME Terminal makes interaction comfortable between graphical
    applications and the Bash shell thanks to the support of drag and drop for text
    strings, copy and paste with both keystrokes and context menus, and mouse scrolling
    in terminal mode.


    Xterm is entirely different; it is a tiny, old-school thing that hasn’t changed
    much since 1984, and was initially developed before the X Window System saw the
    light. Xterm uses the same Bash shell as GNOME Terminal does, so the commands
    behave in exactly the same way in both terminals. Xterm is very helpful in an
    emergency; if your main desktop fails to load and you just need to get to graphical
    mode, use something like `$ xinit xterm`. It never breaks!


    #### 01

    Every Linux distribution uses Bash (Bourne-again shell) in text mode and graphical
    mode within a terminal emulator, including Xterm and GNOME Terminal. Bash has
    a very rich set of commands, but the most useful feature comes from its popularity;
    all Linux users use their terminals with the same syntax. However, there are other
    shells – such as a highly customisable ZSH with an even wider feature set, or
    CSH with a built-in scripting language – that have similarities with the C language.
    To change the default shell from Bash to something else in GNOME Terminal, go
    to Edit>Profile Preferences, switch to the Title and Command tab, enable the ‘Run
    a custom command instead of my shell’ option and put the name of your desired
    shell in the Custom Command field.


    #### 02

    Let’s make the GNOME Terminal look a little more personal by changing text font,
    colour and background (Fig 1). Go to Edit>Profile Preferences and switch to the
    Colors tab. Uncheck ‘Use colors from my system theme’ option and choose any combination
    of colours for text, text in bold and background. There is a list of good presets
    in the ‘Built-in schemes’ drop-down menu; it can save you from an agony of choosing.
    To change the font itself, go to the General tab and uncheck ‘Use the system fixed
    width font’. After that, you’ll be able to select another Mono font.

