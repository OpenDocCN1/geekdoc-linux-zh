    ## Ubuntu 应用

    ## 使用 Shotwell 管理图像


    大多数用户将 Shotwell 视为一个简单的图片查看器：在 Nautilus 中双击图片，它就会在 Shotwell 中弹出。但将此产品仅作为图片查看器意味着用户错失了一系列非常有用的辅助功能。Shotwell
    自带了一个基于 SQL 技术的相当复杂的数据库，因此可以极快的速度存储和检索图片。各种高级选项允许你根据需要定制显示列表；如果 Shotwell 设置得当，它将显著减少在你的（不断增长）的文件集中查找特定图像所需的时间。此外，如果你的数码相机设置正确，Shotwell
    将自动分析 EXIF 数据，以获取拍摄日期和其他信息。因此，将单次活动拍摄的所有照片汇集到一个位置只需点击一下即可。


    屏幕右侧的教程假设你已经完成了该产品的初始配置。如果情况并非如此，请在 Dash（启动器）中输入 Shotwell。点击“Shotwell Photo Manager”启动应用程序，并在面对“欢迎
    Shotwell”对话框时点击 OK 按钮。你可以直接接受其默认设置，但请准备等待几分钟，因为数据库将填充你个人资料中“图片”文件夹下的所有图片和截图。


    使用 Shotwell 轻松管理大量照片


    “大多数用户将 Shotwell 视为一个简单的图片查看器。但用这种方式意味着用户错失了一系列非常有用的辅助功能”


    ### 最近导入视图

    点击图像库的此部分可以将焦点集中在最近添加的内容。如果你想查看最近向集合添加了项目，这非常有帮助——特别是如果你是一个“懒于打标签的人”，这非常方便。


    ### 边框指示器

    可以选择图片进行批量处理。Shotwell 用蓝色边框显示选中的图片——使用覆盖层会影响当前图片的原始性。


    ### 相机列表

    主列表的这部分提供了当前连接到工作站的所有外部存储媒体的概述。它是启动导入操作的首选地。


    整理你的作品 瞬间存储并检索你的图片


    ### 事件列表

    图片根据拍摄日期进行分类。点击其中任何一项都可以限制图片区域显示的内容。


    ### 标签列表

    如果说事件列表之于事件，标签列表之于标签：这是一个寻找有趣图像素材非常有用的工具。


    ### 缩放杆

    可以根据需要调整显示区域图像元素的大小。只需向左或向右滑动杆，即可在信息密度和图片质量之间找到正确的平衡。


    ### 图像显示

    Shotwell 在灰色背景上显示当前选择部分的内容。双击任何图片即可以全屏模式打开查看。


    ### SQLite 驱动

    Shotwell 将数据存储在 SQLite 数据库中。与传统的平文件存储相比，这显著提升了性能——甚至可能有一天允许添加网络功能。


    ## 整理你的照片 使用 Shotwell 处理图像


    **01**

    从活动回到后，启动 Shotwell 并将数码相机的内存卡插入内部或外部读卡器中。Shotwell 将自动识别存储介质，并将其作为树状列表中“相机”部分的一个项目显示。等待底部的进度条填充——应用程序必须读取每张图像以获取有关它的进一步详细信息。接下来，点击屏幕右下角的“导入图像”按钮。Shotwell
    将开始将图片复制到工作站的“图片”文件夹中。如果涉及的文件很大，这个过程可能会花费相当的时间。


    “从活动回到后，启动 Shotwell 并将数码相机的内存卡插入内部或外部读卡器中”


    **图 1（上方）** 图片按日期存档


    **02**

    当导入过程结束，你的硬盘空间将会减少一些。重要的是，你不要移动文件——移动文件会导致灾难性的后果。


    **03**

    如果让 Shotwell 自动处理，图片将根据拍摄日期分组。由于日期本身并不包含信息，赋予有用的名称是明智的。


    **04**

    无论是移动物体还是昏暗场景，当成像情况变得棘手时，使用 RAW 拍摄可以帮助你利用图像。遗憾的是，生成的文件并不适合分享，因为大多数机器上没有相应的查看器。


    Shotwell 提供了一个 RAW 导出器，用于将分散的相机文件转换为 JPEG 等效文件（图 2）。只需双击图像以全屏模式打开它，然后右键点击它。接下来，选择“发送到”。弹出的窗口允许你选择格式——选择
    JPG 可确保 Shotwell 生成行业标准的图片文件。


    **05**

    逐个发送图片是一项辛苦的任务。幸运的是 Shotwell 也可以一次转换一组图片。在概览模式下（Shift/Ctrl+点击）选择它们，然后选择“文件>导出”。Shotwell
    将首先显示第四步中的格式选择对话框，随后将显示一个允许你选择存储位置的常用对话框。


    过程完成后，将显示一个标题为“保留还是删除”的消息。它允许你决定图像是否应留在内存卡上——选择“是”没有问题，因为它们不会再次被导入。


    **查看什么**

    **命名事件**

    **添加标签**

    **分享 RAW 文件**

    “如果让 Shotwell 自动处理，图片将根据拍摄日期分组。为事件赋予有用的名称是明智的”

    **批量分享**

    **图 2（上方）** 文件可以轻松转换为 jpeg 等效文件

    点击 OK 后，程序将显示一个允许你选择目标的对话框。然后可以通过蓝牙或电子邮件发送图像。


