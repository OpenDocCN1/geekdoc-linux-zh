- md: "\n![](img/a6bf9da4751f37b25a0d6611dc73918d_9_0.png)\n\n**Getting started**\n\
    \nGet to know Ubuntu\n\nLike any other operating system, Ubuntu can also be run\
    \ in a virtual machine on your computer. In this way, you’ll be able to try Linux\
    \ without even restarting your computer, although you should note that virtual\
    \ machines are slower than running the operating system on your computer itself.\n\
    \nTo create an Ubuntu virtual machine, first you need to download and install\
    \ VirtualBox. Create a new virtual machine with it, select the Ubuntu operating\
    \ system, and provide the ISO file you downloaded from Ubuntu’s website when prompted.\
    \ \n\nThe installation process is pretty self-explanatory and you can go through\
    \ it in the virtual machine as if you were installing Ubuntu on a real computer.\n\
    \n“You’ll be able to try Linux without even restarting your computer”\n\n**Fig\
    \ 3 (below)** Install Ubuntu or try it out with the trial version\n\n![](img/a6bf9da4751f37b25a0d6611dc73918d_10_0.png)\n\
    \n**Getting started**\n\nGet to know Ubuntu\n\nAdopting the full version\n\nNew\
    \ versions are released every six months and are supported for 18 months\n\nAs\
    \ noted previously, Ubuntu is a very popular Linux distribution with many years\
    \ of experience and a huge user base. After becoming comfortable with the initial\
    \ aspects of Ubuntu, it is time to take a look at Ubuntu’s full version. Before\
    \ you start with Ubuntu, you need to obtain a copy of the Ubuntu installation\
    \ image. In addition, you will have to ensure that your system meets the minimum\
    \ requirements. The most common method of obtaining Ubuntu is to download the\
    \ Ubuntu DVD image directly from the official site, ubuntu.com/download. To download\
    \ and install it, you just need to select whether you require the 32-bit or 64-bit\
    \ version and then click ‘Start download’.\n\nIt is important to understand these\
    \ two versions that Ubuntu is available in: 32-bit and 64-bit. They differ from\
    \ each other in the way the computer processes information. So if your computer\
    \ has a 64-bit processor, you will need to install the 64-bit version. On the\
    \ other hand, if you have an older computer or you do not know the type of the\
    \ processor in your computer, it is advisable to opt to install the 32-bit version.\n\
    \nAlthough 5GB of free space on your hard drive is required for installing Ubuntu,\
    \ the recommendation is to have 15GB or more. This will mean you’ll have enough\
    \ space to install extra applications, as well as to store your own documents,\
    \ music and more.\n\nIf you have an Internet connection, the installer will ask\
    \ you now whether you want to ‘Download updates while installing’. It is highly\
    \ recommended to perform this step.\n\nIt is important to have an Internet connection\
    \ during the Ubuntu installation process. If you are not connected to the Internet,\
    \ the installer will ask you to choose a wireless network, if one is available.\
    \ You can follow these three steps in such a scenario…\n\n- **01** Select ‘Connect\
    \ to this network’ and choose your network from the list.\n- **02** In the ‘Password’\
    \ field, enter your router’s WEP or WPA key.\n- **03** Then click ‘Connect’ in\
    \ order to continue.\n\nInternet connection\n\n**Fig 4 (below)** Make sure you\
    \ have the available drive space before installing\n\n![](img/a6bf9da4751f37b25a0d6611dc73918d_11_0.png)\n\
    \n**Getting started**\n\nGet to know Ubuntu\n\nThe Ubuntu installer will automatically\
    \ detect any existing operating system installed on your machine, and present\
    \ installation options to suit your system. Please note that the following options\
    \ below entirely depend on your specific system and may not all be available to\
    \ you:\n\n- Install Ubuntu\n- Try Ubuntu without\n- Install Ubuntu alongside\n\
    - Do else\n\nOut of the above four options, the most preferred is ‘Upgrade Ubuntu\
    \ … to 16.04’. This is because this option will allow you to keep all your precious\
    \ documents, music, pictures and any other personal files on the computer. Installed\
    \ software will be retained when possible and system-wide settings will be cleared.\n\
    \nThe ‘Erase disk and install Ubuntu’ option can be used if you want to erase\
    \ your entire disk. As expected, this will delete any existing operating system\
    \ that is installed on that disk and install Ubuntu in its place.\n\nWhen you\
    \ choose the ‘Something else’ option, you will be able to configure the partitions\
    \ as you need before installing Ubuntu.\n\nIt can be noted here that in order\
    \ to reduce the time required for installation, Ubuntu will continue the installation\
    \ process in the background while the user configures all the important user details\
    \ like username, password, keyboard settings, the default time zone and so on.\n\
    \nUbuntu installation\n\nYou can install Ubuntu alongside another OS or replace\
    \ it\n\n“After successfully installing Ubuntu, you may also want to encrypt your\
    \ home folder. It takes very little time and is pretty straightforward. This is\
    \ considered to be an important step before you proceed any further”\n"
