    ## Ubuntu apps

    ## Manage images with Shotwell


    Most users treat Shotwell as a simple image viewer: a picture is double-clicked
    in Nautilus and pops up in Shotwell. But using the product as a simple picture
    viewer means users are losing out on a set of valuable helper features. Shotwell
    comes with a relatively sophisticated database based on SQL technology, so that
    pictures can be stored and retrieved with blazing speed. Various advanced options
    let you tailor the display list to your needs; if Shotwell is set up correctly,
    it will significantly reduce the time required to find specific images in your
    (ever-growing) collection of files. What’s more, if your digital camera is set
    up correctly, Shotwell will analyse the EXIF data in order to find out the date
    it was captured and other information automatically. Therefore, compiling all
    the photos taken at a single event into one location becomes a matter of one click.


    The tutorial on the adjacent side of the screen assumes that you already passed
    through the initial configuration of the product. If this is not the case, enter
    Shotwell into the dash. Click ‘Shotwell Photo Manager’ to start the application,
    and click the OK button when confronted with the ‘Welcome to Shotwell’ dialog.
    Its default settings can be accepted without any further ado, but be prepared
    to wait a few minutes as the database gets populated with the images and screenshots
    found in your profile’s Pictures folder.


    Keep tabs on large numbers of photographs with ease using the Shotwell app


    “Most users treat Shotwell as a simple image viewer. But using it this way means
    users are losing out on a set of valuable helper features”


    ### Last Import view

    Click this part of your image library to put focus on the latest addition. This
    can be helpful if you want to see what items were added to the collection last
    – especially handy if you’re a ‘lazy tagger’.


    ### Border indicator

    Images can be selected for bulk processing. Shotwell displays selected pictures
    with a blue frame – using an overlay would affect the originality of the pictures
    at hand.


    ### Camera list

    This part of the main list provides an overview of all external storage media
    currently connected to your workstation. It is a prime destination for starting
    import operations.


    Organise your shots Store and retrieve your pictures in no time at all


    ### Events list

    Images get catalogued according to the date when they were taken. Click any of
    them in order to limit the content shown in the picture area.


    ### Tag list

    What the Events list is to events, the Tags list is to tags: a really helpful
    tool for singling down on interesting image material.


    ### Zoom lever

    The size of the image elements in the display area can be adjusted to your needs.
    Simply drag the lever to the left or right in order to find the correct balance
    between information density and picture quality.


    ### Image display

    Shotwell displays the contents of the currently selected section on a grey background.
    Double-click any of the pictures in order to open them for full-screen viewing.


    ### SQLite powered

    Shotwell stores its data in a SQLite database. This leads to significant performance
    increases over traditional flat file storage – and might even permit networking
    to be added one day.


    ## Organise your photos Handling images with Shotwell


    **01**

    After coming home from an event, start Shotwell and insert the memory card of
    your digital camera into an internal or external card reader. Shotwell will grasp
    the storage medium automatically, and display it as an item in the Cameras section
    of the tree. Wait while the progress bar at the bottom is populated – the app
    must read each of the images in order to obtain further information about it.
    Next, click the ‘Import the images’ button at the bottom-right corner of the screen.
    Shotwell will start to copy the images to your workstation’s Pictures folder.
    This process can take quite a bit of time if the files involved are large.


    “After coming home from an event, start Shotwell and insert the memory card of
    your digital camera into an internal or external card reader”


    **Fig 1 (above)** Images are archived by date


    **02**

    When the import process is over, your hard drive will lack a bit of space. It’s
    important that you do not touch the files – moving files around have disastrous
    consequences.


    **03**

    If Shotwell is left to its devices, the pictures will be grouped by the day they
    were taken. Since dates, on their own, are not informative, assigning helpful
    names is sensible.


    **04**

    Be it fast-moving objects or the darkness of the scene, when the imaging situation
    gets tough, shooting in RAW helps you to make the most of your images. Sadly,
    the resulting files are not well-suited for sharing because most people don’t
    have the necessary viewer on their machine.


    Shotwell provides a RAW exporter which can be used to transform most-spread camera
    files into their JPEG equivalents (Fig 2). Get started by double-clicking the
    image in order to open it in full-screen mode, and right-click it. Next, select
    ‘Send to’. The pop-up window allows you to select the format – picking JPG ensures
    that Shotwell generates an industry-standard picture file.


    **05**

    Sending images out one by one is a painstaking task to complete. Fortunately Shotwell
    can also convert groups of pictures in one go. Start out by selecting them in
    Overview mode (Shift/Ctrl+click) and proceed to selecting File>Export. Shotwell
    will start out by displaying the format selection dialog from step four, which
    will be followed by a common dialog that will permit you to select a storage destination.


    The process is complete, a message titled ‘Keep or Delete’ will be displayed.
    It permits you to decide whether the images should stay on the memory card – picking
    yes is not an issue, as they will not be imported again.


    **See what happened**

    **Name events**

    **Add tags**

    **Share RAW files**

    “If Shotwell is left to its devices, the pictures will be grouped by the day they
    were taken. Assigning helpful names to events is sensible”

    **Share in Bulk**

    **Fig 2 (above)** Files are easily reformatted to jpeg equivalents

    After clicking OK, the program displays a dialog permitting you to select the
    target. Then images can be sent via Bluetooth or email.

    '
