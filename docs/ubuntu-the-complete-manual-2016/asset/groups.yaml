    ![](img/a6bf9da4751f37b25a0d6611dc73918d_43_0.png)


    **Fig 1 (above)** Explore Ubuntu’s file system arrangement using the terminal


    ## 02 The root directory


    Unix abstracts the nature of tree hierarchy entirely, and the root directory is
    the base of all the folders in the Ubuntu hierarchy. Indicated by the ‘/’ sign,
    the root directory contains all the other folders (Fig 2). Though the root directory
    is conventionally referred to as ‘/’, the directory entry itself has no name –
    its name is the empty part before the initial directory separator character (/).
    All file system entries, including mounted file systems, are ‘branches’ of this
    root. It is because of this layout that all the absolute paths in Unix systems
    start with ‘/’. Even if there are several physical or virtual storage devices
    attached to your computer, all the folders will be shown under the root directory.


    Note that this is not to be confused with the /root directory that serves as the
    home directory for the root users.


    ### The root directory


    ### 01 Filesystem Hierarchy Standard


    The Ubuntu file system is based on the Filesystem Hierarchy Standard (FHS). This
    defines the main directories and their contents in Linux operating systems (Fig
    1). For the most part, it is a formalisation and extension of the traditional
    BSD file system hierarchy. The Linux Foundation – a non-profit organisation consisting
    of major software and hardware vendors, such as HP, Red Hat, IBM and Dell – maintains
    the FHS. At the time of writing, the current FHS version is 3.0, released on 3
    June 2015.


    ## Understanding the file system

    **Ubuntu essentials**


    ![](img/a6bf9da4751f37b25a0d6611dc73918d_44_0.png)


    ### 03 Various directories under /


    Let’s now see the various important directories present under the root directory
    and get an idea of which ones serve what purpose.


    - **/bin** is a place for most commonly used terminal commands, such as ls, mount,
    rm, etc.

    - **/boot** contains files needed to start up the system, including the Linux
    kernel, a RAM disk image and bootloader configuration files.

    - **/dev** contains all device files, which are not regular files but instead
    refer to various hardware devices on the system, including hard drives.

    - **/etc** contains system-global configuration files, which affect the system’s
    behaviour for all users.

    - **/home** this is the place for users’ home directories.

    - **/lib** contains very important dynamic libraries and kernel modules.

    - **/media** is intended as a mount point for external devices, such as hard drives
    or removable media (CDs, DVDs etc).

    - **/mnt** is also a place for mount points, but it is dedicated specifically
    to ‘temporarily mounted’ devices such as network file systems.

    - **/opt** can be used to store additional software for your system which is not
    handled by the package manager.

    - **/proc** is a virtual file system that provides a mechanism for the kernel
    to send information to processes.

    - **/root** is the superuser’s home directory; it’s not in /home/ to allow for
    booting the system even if /home/ is not available.

    - **/run** is a temporary file system available early in the boot process where
    ephemeral run-time data is stored. Files under this directory are removed or truncated
    at the beginning of the boot process.

    - **/sbin** contains important administrative commands that should generally only
    be employed by the superuser.

    - **/srv** can contain data directories of services such as HTTP (/srv/www/) or
    FTP.

    - **/sys** is a virtual file system that can be accessed to set or obtain information
    about the kernel’s view of the system.

    - **/tmp** is a place for temporary files used by applications.

    - **/usr** contains the majority of user utilities and applications, and partly
    replicates the root directory structure, containing for instance, among others,
    /usr/bin/ and /usr/lib.

    - **/var** is dedicated to variable data, such as logs, databases, websites and
    temporary spool (email etc) files that persist from one boot to the next. A notable
    directory it contains is /var/log, where system log files are kept.


    **Fig 2** You may be more familiar with the folder layout


    **Ubuntu essentials**

    **Understanding the file system**


    ## Sharing files in Ubuntu


    Learn to create servers to share data from your Ubuntu system


    The default Ubuntu file manager Nautilus offers an easy-to-use interface to help
    you share files across systems. Behind the scenes, however, Samba is running the
    show.


    Samba is a software suite for seamless file and print services. It implements
    the Server Message Block (SMB)/Common Internet File System (CIFS) protocol for
    Unix systems, supporting file and printer sharing across Windows, OS X and other
    Unix systems.


    Samba is freely available, unlike other SMB/CIFS implementations, and so is widely
    used on various systems. You can facilitate the file sharing between Ubuntu and
    Windows computers by configuring Samba as a file server on one of the systems.


    Samba can do several other things including acting as a server for SMB clients:
    you can share printers, including PDF pseudo-printers so all the computers in
    your network may write PDF files. Samba can also act as a domain controller in
    a Windows network (authenticating users, and so on) and even help using a Windows
    domain controller to authenticate the users of a Linux/Unix machine. However we
    will focus only on the file sharing aspect of Samba in this feature.


    Samba is not installed by default in Ubuntu 16.04 and so to start file sharing
    you’ll have to install Samba. We’ll see the installation process and the steps
    to set up file sharing in next sections.


    “You can facilitate the file sharing between Ubuntu and Windows computers by configuring
    Samba as a file server on one of the systems”


    **Ubuntu essentials**

    **Sharing files in Ubuntu**


    ![](img/a6bf9da4751f37b25a0d6611dc73918d_46_0.png)


    ### 01 To share a directory


    To share a directory, you must have permission to access the directory. For demonstration
    purposes, let’s take a folder from the user’s home directory, such as Documents.


    Go to your home directory. Right-click on the Documents directory and in the pop-up
    menu, select Local Network Share. Then check the ‘Share this folder’ checkbox.
    If Samba is not installed, you will get a pop-up menu: ‘Sharing service is not
    installed’. Select ‘Install additional software’ and then click Install (Fig 1).
    If you get an error message that the samba .deb could not be found, open a terminal
    and update apt-get like this:


    $ sudo apt-get update$


    Try again and Ubuntu will install Samba. Let’s try sharing the folder again. Right-click
    on the Documents directory and in the pop-up menu, select Local Network Share.
    Then check the ‘Share this folder’ checkbox. If Samba is not installed, you will
    get a pop-up menu: ‘Sharing service is not installed’. Select ‘Install additional
    software’ and then click Install (Fig 1).


    **Ubuntu essentials**

    **Sharing files in Ubuntu**

    **Fig 1 (above)**


    ![](img/a6bf9da4751f37b25a0d6611dc73918d_45_0.png)

    **Fig 2 (above)**


    **Samba server configuration**

    **Ubuntu essentials**


    ### 03 Use the configuration file


    We have learnt about sharing via the GUI, but directly editing the configuration
    file gives you several options and flexibility to implement things exactly how
    you want. The main Samba configuration file is located in /etc/samba/smb.conf
    (Fig 2). The default configuration file has a significant number of comments in
    order to document various directives. First, edit the following key/value pairs
    in [global] section:


    Workgroup = EXAMPLE

    Security = user


    Note that the ‘security’ parameter is further down in the [global] section, and
    is commented by default. Also, change the ‘workgroup’ value from EXAMPLE to something
    that better matches your environment. Then, to share a directory, create a new
    section at the bottom, or uncomment one of the examples:


    [share]

    comment = Ubuntu File Server

    path = /srv/samba/share

    browsable = yes

    guest ok = yes

    read only = no

    create mask = 0755


    Let’s look at the meaning of each:


    - **comment:** a short description of the share. You can adjust it to fit your
    needs.

    - **path:** the path to the directory to share. This example uses /srv/samba/share
    because, according to the Filesystem Hierarchy Standard (FHS), /srv is where site-specific
    data should be served. Technically, Samba shares can be placed anywhere on the
    file system as long as the permissions are correct, but adhering to standards
    is recommended.

    - **browsable:** enables Windows clients to browse the shared directory using
    Windows Explorer.


    **Samba clients**

    **Ubuntu essentials**


    ### 02 Access files via Samba


    Ubuntu and Gnome make it easy to access files from a Samba server share. To start
    with, go to the files explorer and locate the ‘Browse Network’ link on the left
    vertical menu bar. Open this link and you will see a Windows network icon. Double-click
    to open it. The next window shows all the domains/workgroups found on your network.
    Inside each domain/workgroup you will see all the computers on the domain/workgroup
    with sharing enabled. Double-click on a computer icon to access its shares and
    files.

