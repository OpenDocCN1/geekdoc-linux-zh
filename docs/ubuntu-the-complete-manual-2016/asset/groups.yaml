    ## 入门

    ### 了解 Ubuntu


    **14**


    例如，某些程序在安装期间会自动在指示器区域添加图标。你应该注意，每个应用程序都有其自己的菜单系统，你可以在其中执行不同的操作（如文件、编辑、视图等）。相应地，应用程序的菜单系统被称为应用程序菜单。


    在 Ubuntu 中，我们需要理解的另一点是“启动器”（Launcher）——即位于桌面左侧的垂直图标栏（图 6）。通过这个启动器，用户可以轻松访问各种应用程序、挂载设备和垃圾箱。请注意，任何运行中的应用程序其图标都会放置在启动器栏中。


    在 Ubuntu 中，我们经常会遇到被称为“Dash”（活动）的东西。如果你以前使用过 Windows，可以将 Dash 视为类似于 Windows 开始菜单的工具。Dash
    会帮助你找到电脑上正在寻找的应用程序和文件。要探索 Dash，你需要点击启动器最顶部的图标。现在，你将看到一个顶部带有搜索栏的窗口，以及最近访问的应用程序、文件和下载内容。


    **图 6（上方）** 从启动器运行任何应用程序，只需点击应用程序的图标


    **图 7** 输入内容以搜索文件或文件夹，建议结果将出现在 Dash 菜单中


    ![](img/a6bf9da4751f37b25a0d6611dc73918d_14_0.png)


    ## 入门

    ### 了解 Ubuntu


    **15**


    **图 8（上方）** 从 Dash 进行计算机和全范围搜索


    **图 9（上方）** 导航到浏览器应用进行更高级的搜索


    ![](img/a6bf9da4751f37b25a0d6611dc73918d_15_0.png)


    ## 入门

    ### 了解 Ubuntu


    **16**


    如上所述，Dash 是一个非常强大的工具，可用于搜索电脑上的文件和应用程序。只需输入文件或文件夹名称的一部分即可找到文件或文件夹（图 7，第 14 页）。随着你的输入，结果将出现在
    Dash 中。


    正如预期的那样，标准的 Ubuntu 安装带有许多应用程序，但用户还可以从 Ubuntu 软件中心额外下载数千个应用程序。Dash 上的应用程序视图会将已安装的应用程序自动分类在“最近使用”、“已安装”或“更多建议”下。你也可以在
    Dash 的搜索栏中输入应用程序的名称（或其部分），匹配你搜索标准的应用程序名称将会出现（图 8，第 15 页）。即使你不记得应用程序的名称，输入与该应用程序相关的关键词，Dash
    也能找到它。


    我们在这里需要理解的另一点是，除了搜索本地机器上的文件和应用程序外，Dash 还可以帮助搜索各种在线资源。


    现在让我们查看如何浏览电脑上的文件。除了使用 Dash 搜索文件外，用户还可以直接从目录访问它们。主目录（图 10）是


    **图 10（下方）** 在主目录搜索电脑上的文件


    ![](img/a6bf9da4751f37b25a0d6611dc73918d_16_0.png)


    ## 入门

    ### 了解 Ubuntu


    **17**


    用于存储你所有的个人文件（而不是系统相关文件）。有时，你可能需要使用“文件”文件管理器窗口。每当你选择启动器中的“文件”快捷方式时，Ubuntu 就会打开此文件管理器。


    正如对面的截图所示，此窗口具有以下功能：


    - **菜单栏**：位于屏幕顶部。通过此菜单栏，用户可以浏览并删除书签、打开新窗口、连接到服务器、退出等。

    - **标题栏**：指示当前所选目录的名称。

    - **工具栏**：显示你在文件系统中的位置、搜索按钮等。


    **图 11（下方）** 大多数自定义选项均在“系统设置”菜单中可用


    ![](img/a6bf9da4751f37b25a0d6611dc73918d_17_0.png)


    ## 入门

    ### 了解 Ubuntu


    **18**


    Ubuntu 使用 Linux 文件系统，它基于根目录下的系列文件夹。这些文件夹包含重要的系统文件，除非你以 root 用户身份运行或使用 `sudo` 命令，否则无法进行修改。由于这种限制，电脑病毒将无法更改核心系统文件，普通用户也无法意外更改任何关键内容。


    Ubuntu


    有时，你可能需要自定义你的桌面。大多数自定义可以通过会话指示器实现，然后选择“系统设置”来打开设置窗口（图 11，第 17 页）。


    理解终端


    尽管 Ubuntu 提供了图形用户界面（GUI），但为了充分利用操作系统的功能，你需要理解命令行界面。任何操作系统都有两种类型的用户界面：


    - **GUI**：这是你点击以完成任务的桌面、窗口和工具栏。

    - **命令行界面 (CLI)**：终端被称为 CLI。它是一种通过在键盘上输入命令来控制 Ubuntu 某些方面的方法。


    可以通过按下 Alt+Ctrl+T 或在桌面上右键点击并选择“终端”来打开终端。请注意，终端中的所有命令都遵循相同的方法：你输入命令，可能带有某些参数，然后按下回车键以执行指定的操作（图
    12）。


    !(/a6bf9da4751f37b25a0d6611dc73918d_18_0.png)


    ## 入门

    ### 了解 Ubuntu


    **19**


    Ubuntu 被认为是安全的，主要归功于以下原因：


    - 像 Ubuntu 这样的开源软件发布快速。

    - 安全漏洞可以被轻松检测。

    - 理解文件权限、密码和用户账户等概念也有助于保护电脑安全。


    故障排除任务：如果你在使用 Ubuntu 时遇到任何困难，你可能需要使用终端。如果你需要对多个文件执行操作，终端是首选方法。


    Ubuntu 提供了默认安装的各种文本编辑器。最常用的命令行编辑器称为 Vim。下表提供了关于 Ubuntu 中一些重要文件的简要信息。


    | 文件 | 简要描述 |

    | :--- | :--- |

    | /etc/issue | 操作系统的信息 |

    | /etc/apt/sources.list | Ubuntu 的软件源位置 |

    | /usr/share/tomcat | tomcat 文件的路径 |


    **图 12（上方）** 使用终端通过命令行执行操作


