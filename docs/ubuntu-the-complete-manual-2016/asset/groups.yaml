    ## Ubuntu essentials


    ### Use hot corners


    The Unity desktop lets you assign an action to any corner of the screen, plus
    to any of its sides. In order to do this, we need to access advanced window manager
    settings. Launch Unity Tweak Tool and go to Window Manager > Hotcorners. There
    are eight areas (four corners and four sides) with a drop-down menu next to each,
    letting you choose what action will be performed once you move your mouse to the
    respective area of the screen. You can set a corner or a side to toggle the desktop
    (for example, minimise all windows or bring them back on), spread windows or show
    workspaces. All changes are applied instantly, and you can check by driving your
    mouse to a corner or side where an action has been assigned.


    ## Rule the indicators


    The ‘System Tray’ area resides the far-right corner of the top bar. Some indicators
    can be configured individually but for more control you will need to deal with
    dconf-editor (Fig 2). This twin-panel app has a categories list on the left and
    the contents on the right allows you adjust aspects of Unity indicators. Go to
    com>canonical>indicator and explore the parameters of each one. You can turn indicator
    presence on the top bar on and off by toggling the ‘visibility’ parameter and
    change indicators’ display format by playing with ‘show-\*’ parameters. This way
    you can keep your system tray area clean and tidy.


    “Check hot corners have been applied by driving your mouse to a corner or side
    where an action has been assigned”


    **Fig 2** Get more customisation control with dconf Editor


    ## Customising the desktop


    Discover System Settings

    Discover system details, manage user accounts and configure hardware


    The System Settings application houses various settings and acts the same way
    as the Control Panel in Windows. You can launch System Settings from the farthest
    indicator in the top bar, or even from the command line ($ unity-control-center).
    Of course, the set of system-related settings here isn’t the only place where
    you can change such settings, but it is the most convenient and safe place to
    do it. Traditionally in Linux (and Ubuntu is no exception), system settings could
    be changed via editing configuration files in the /etc directory, or by issuing
    certain commands while being in root. While these work in Ubuntu, it requires
    advanced skills and sometimes involves putting your Linux installation at risk.
    The System Settings shell in Ubuntu contains a limited number of neatly designed
    items that help you manage essential system-related settings with ease and minimum
    skill. The System subsection contains settings for Backup, System Details, Landscape
    Service, Software Sources, Time & Date, Universal Access and User Accounts. Some
    of the above are applicable for enterprise Ubuntu users (such as the paid subscription
    for technical support, which is called Landscape), while other settings are covered
    in detail in separate chapters (Backup, Time & Date, etc). This overview focuses
    on Details and User Accounts as well as on certain hardware-related settings.


    “The System Settings shell in Ubuntu contains a limited number of neatly designed
    items that help you manage essential system-related settings with ease and minimum
    skill”


    ## Navigation


    It’s not included right out of the box, but it is instantly available in the standard
    Ubuntu online repository. Get it with $ sudo apt-get install unity-tweak-tool


    ### Personal settings

    Most settings here are user-specific. You can also change look and feel settings
    here, adjust privacy, manage online accounts etc


    ### Hardware settings

    You might set up extra peripherals, input devices, change power settings, or even
    manage colour profiles for printers and displays


    ### Search for a setting

    If you cannot find the required settings but you know its name, type it into the
    search bar and see how System Settings filter the results according to your input
    on the fly


    ### System-related settings

    Backups, system details, updates and software sources, accessibility options,
    time and date and more, can be managed within this category


    View important subsections


    ## Configure your Ubuntu installation


    Explore system details and change some defaults


    Sometimes you need to know more information about your version of Ubuntu. Is it
    32 or 64 bit? How much memory is there in your PC? In order to prevent you from
    getting lost, there is a dedicated subsection in System Settings that’s called
    Details. The main screen in Details shows a summary of the most important specs
    of your system, including CPU name and clock, graphics driver, hard disk volume
    and more (Fig 1). You can also update your system with the Install Updates button
    on the right. There are other useful tabs in Details – see the list on the left
    side of the screen. Go to Default Applications to change your default web browser,
    email client, music player or image viewer. Similarly, on the Removable Media
    tab you can define what Ubuntu should do when an optical disc (CD/DVD/BD) is inserted.
    Again, all changes are then applied immediately.


    Manage Ubuntu users


    If your PC is mainly used as a private or personal computer then perhaps you are
    the only user in the system. Here’s what you need to do if you want to create
    another user for testing purposes, or for guest logins. If there is actually already
    more than one person that accesses the PC (in a public place for example), you’ll
    need the correct number of login accounts. These are managed in the User Accounts
    subsection. By default, you can only see the list and the settings, but can’t
    change anything. To add or remove users you must click the ‘Unlock’ button and
    enter the root password. After that you’ll be able to click the tiny ‘+’ and ‘-‘
    buttons displayed at the lower left corner of the screen, watch an activity log
    of other users (the History button) and toggle their automatic login.


    “Sometimes you need to know more information about your version of Ubuntu. Is
    it 32 or 64 bit? How much memory is there in your PC? To avoid getting lost, head
    to System Settings”


    **Fig 1** See system details in System Settings


    ### Tune up power settings


    These settings mostly affect laptop users, but they can help optimise power consumption
    as well. Under the Hardware category of System Settings, go to Power and use the
    first drop-down menu to set up the inactivity period – this is the period after
    which your computer will suspend. The second option lets you disable the battery
    indicator for example. When your laptop always runs from AC, there is no need
    for this. Another power-related tunable is screen brightness. Either follow the
    link on the Power tab or open up the Brightness & Lock subsection directly. Here
    you can set a period of inactivity, after which the display will be turned off
    automatically and the computer will be locked. You can define whether the user
    is required to provide a previously set password to unlock the computer.


    Set up a printer


    Ubuntu automatically detects and configures local printers in case it has a driver
    for them. Most consumer printers are supported without any problems in Linux,
    so if you open the Printers subsection, you should see the icon for a configured
    printer. You can edit the printer’s preferences, change its driver, or you can
    create several instances of the same printer with different settings. Press the
    ‘Add’ button and follow the wizard to set up a local or remote printer – much
    of it’s automatic (Fig 2). If you need more control or you want to resolve a printing
    issue, use $ sudo service cups restart. This is the command for restarting the
    system-wide printing service in Ubuntu. To enjoy the feature-rich CUPS admin interface
    instead, try going to http://localhost:631 in your web browser. Note that all
    changes to printer settings require the root password of your Ubuntu system.


    **Fig 2 (above)** Ubuntu should automatically detect both local and network printers

