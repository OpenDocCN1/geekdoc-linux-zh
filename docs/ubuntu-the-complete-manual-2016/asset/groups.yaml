    ## Ubuntu 基础知识


    ### 使用系统监器


    使用系统监器应用查看并管理系统资源


    系统监器是一个用于管理运行进程和监控系统资源的工具。它是从 Gnome 桌面借用的许多配件之一。你可以通过启动器（Dash）或命令行（`gnome-system-monitor`）运行它。该应用程序的外和功能与
    Windows 和 OS X 中的类似程序相似，并包含三个逻辑标签页：进程（Processes）、资源（Resources）和文件系统（File systems）。可以使用命令行参数启动显示特定标签页的应用程序，使用
    `-p` 表示进程，`-r` 表示资源，`-f` 表示文件系统。使用 `gnome-system-monitor -f` 命令可以启动并显示文件系统标签页。系统监器用于解决系统卡顿问题。你还可以使用
    CPU 负载图来检查硬件加速视频输出是否真实有效。


    **管理系统进程**


    Linux 中的每个应用程序至少创建一个进程。某些进程指向图形化应用程序，另一些则在后台运行并提供服务功能。在系统监器的帮助下，你可以查看所有进程列表，了解它们的名称，找出进程属于哪个用户，检测消耗过多
    CPU 周期或占用大量内存的进程，将进程与其低级 ID 关联并管理进程优先级。通常，你会看到一个按名称排序的进程列表。注意，你可以点击列名称来对进程进行排序。按
    CPU 使用百分比或内存占用进行排序非常有帮助。如果某个进程属于你（或你有相应权限），你可以杀死它或降低其优先级。选择你想要移除的进程并按下窗口右下角的“结束进程”（End
    Process）按钮。右键点击该进程并选择“更改优先级”（Change Priority）菜单来修改其优先级。


    文件系统标签页显示了当前在 Ubuntu 中挂载的所有文件系统的表格。你可以找到设备名称、文件系统类型、挂载点、总容量和可用磁盘空间。当然，你可以在 Ubuntu
    的磁盘实用程序（Disks，第50页）中找到类似的信息，但系统监器提供了更舒适的视图，让你能够快速分析设备上剩余的空间并按各种标准进行排序。“已用”（Used）列双倍了了磁盘空间的信息，但以百分比条的形式显示。当进度条填充到大约
    90% 或更多时，意味着你的可用磁盘空间不足，这对于某些工作流场景可能会带来麻烦。如果根分区 (/) 达到 100% 满，Ubuntu 将无法正常运行。你也可以在终端中使用
    `df` 命令（disk free）检查可用磁盘空间，尽管它不允许你对任何行进行排序或重新排序。


    **查看文件系统详情**


    **控制资源使用**


    资源标签页提供了实时更新的有效图表（图1）。第一张图显示实时模式下的 CPU 历史（默认数据更新无延迟），用不同颜色显示 CPU 核心。当你启动一个重量级应用程序时，你会注意到图上的峰值。你还可以判断应用程序是否可以同时使用多个
    CPU 核心，或者是否将所有负载推到一个核心上。中间的图是内存和交换使用（Memory and Swap Usage）。在现代系统中，日常任务很少使用交换文件或独立的交换分区，因为已经有了足够的
    RAM。然而，处理大文件（例如在 GIMP 中修饰巨大的海报）可能需要交换，这只在系统可用内存不足时才会发生。最后一张图网络历史（Network History）显示了下载和上传的网络速度。该图对于网络故障排除和低网速诊断特别帮助。内存和网络历史图都能帮助你监控系统性能。


    **图1** 图表有助于性能数据可视化


    ## Ubuntu 应用


    ### 探索 Ubuntu 软件中心


    导航你购买、安装和删除应用的一站式商店


    Ubuntu 软件中心（简称 USC）是一个包管理门户——也就是说，一个集成平台，你可以在其中搜索、安装或购买软件，甚至从已安装的软件列表中删除应用。Ubuntu
    软件中心最初于 2009 年 10 月 29 日发布，用 Python 开发，包含超过 53,000 个应用程序。此前，Ubuntu 程序是从存储库中以 tar
    文件格式下载、解压然后安装的，并在控制台中手动运行命令。即使是之前的 Ubuntu 版本，也有许多图形化实用程序用于添加/删除软件，这最终导致了功能冗余和开发工作的碎片化。为了简化这一过程，USC
    提供了一种非常有价值的方法，只需点击几次按钮即可安装所有软件。在这里搜索特定软件是非常方便的，因为 USC 具有基于名称/描述的搜索功能，并有多个选项可供选择。评分和用户评论帮助你找到最佳软件。最新版本的
    Ubuntu 带有一些预配置的工具和软件，如 LibreOffice 软件套件、Mozilla Firefox、文本编辑器等，它们在左侧边栏垂直显示。要开始使用，请在显示中搜索购物袋图标并点击它启动软件中心。启动
    USC 后，会出现主屏幕，其中包含不同类别的软件、推荐软件、新添加软件（图2）、高评分软件等等。例如，如果你正在寻找文本编辑器，可以在搜索栏中输入关键字，它将以列表视图显示
    USC 中存在的不同文本编辑器。你只需选择其中任何一个并点击“安装”（Install）按钮开始下载。


    **图2** 软件中心按类别排列，帮助你找到所需内容


    在主屏幕顶部，你会找到导航命令：所有软件（All Software）和已安装（Installed）（图1，第88页）。后退和正向按钮（分别显示为 `<` 和
    `>`）帮助你在不同页面间导航。USC 将访问过的页面保存在内存中，这样你就可以通过后退按钮回到上次之前的页面。


    **图3** 注册 Ubuntu 以获取推荐


    在显示方面，如果类别设置为“默认显示非应用程序”，结果将以列表视图显示；否则使用磁格视图，并默认隐藏非应用程序。高星级应用程序也会显示在主屏幕上，无论它们是否已安装。五星级应用程序显示在“高评分”（Top
    Rated）标签页下；点击“更多”（More）按钮，你会进入一个按评分降序排列项目的页面。


    **通过类别导航** 导航软件中心的不同方式。


    在“已安装”（Installed）部分，你会找到安装在 Ubuntu 机器上的程序列表，以及安装日期。当选择一个软件项时，如果该项尚未安装在系统中，你将看到“安装”按钮。点击将软件安装到你的机器上。如果软件已安装，则提供“移除”（Remove）按钮；点击它将卸载软件。


    在主屏幕上，你会发现“为你推荐”（Recommended For You）部分。为了使用推荐功能，你必须在 Ubuntu 中注册，并在表单提供有效的电子邮件
    ID（图3）。你将在提供的电子邮件地址接收验证码（图4）。一旦完成该过程，你将收到成功消息，Ubuntu 开始向你推荐实用的软件，你可以轻松选择并安装到你的机器上。


