    \ GRUB 引导程序\n\n### 自定义桌面\n\n更改桌面设置并为 Ubuntu 的外观增添个性化色彩\n\nUbuntu 的默认桌面环境称为 Unity。它为用户提供了一个一致且易于使用的图形界面，用于执行日常任务。默认设置非常简单，基于对人们认为舒适和直观的功能的研究。然而，由于有许多人具有不同的品味，Unity\
    \ 允许根据用户的喜好自定义所有核心功能，如桌面的外观和行为。\n\n这是通过外观与感觉（Look and Feel）设置、本地化、输入选项以及隐私相关的设置来实现的。上述某些不会影响\
    \ Ubuntu 的行为——例如各种美学设置（主题、图标），但有些则会。\n\n值得提到的是，有时人们需要对 Ubuntu 安装进行更精确的控制，并需要一些开箱即\
    \ Ubuntu 未包含的额外功能。因此，有不同的方法通过命令（`$ gsettings`）甚至独立的调优工具（例如 `Unity-tweak-tool`）来绕过限制。这些额外工具允许你更改高级设置，如字体、窗口控制位置、桌面效果等。接下来，你可以了解如何更改最常用的设置并解决经常出现的问题。\n\
    \n**01** 任务栏面板或启动器（Launcher）运行良好，但有时你可能需要移除一些默认图标并添加你喜欢的应用程序。要移除图标，请右键点击它并选择“从启动器中解锁”选项。要向任务栏添加应用程序，你首先需要在\
    \ Dash（活动）中找到它，并将其拖动到任务栏上的所需位置。你也可以拖动并重新排列任务栏上的现有图标。使用系统设置中的“外观>外观”部分来更改任务栏图标大小。如果你将其调小，就能容纳更多图标，这对于小屏幕很有帮助。此外，检查“行为”选项卡以查看自动隐藏选项、启用多个工作区等设置。\n\
    \n调整启动器\n\n### Unity 调优工具\n\n它并非内置，但在 Ubuntu 标准仓库中可以获取。通过命令 `$ apt-get install\
    \ unity-tweak-tool` 获取它\n\n### 外观设置\n\n在这里你可以单独更改 GTK 样式、窗口装饰主题和字体，更改鼠标光标外观，并移动窗口按钮\n\
    \n### 更改特定设置\n\nUnity 由许多不同元素组成，包括位于右侧的主任务栏、带有搜索功能的活动菜单（Dash）、顶部面板以及任务切换器\n\n\
    ### 系统设置\n\nUnity 调优工具提供了高级设置，例如启用桌面图标、安全措施、滚动条控制以及鼠标行为\n\n### 窗口管理器\n\n有方法可以更改\
    \ Unity 中窗口管理器的行为。阴影、透明度、动画、热点吸附、聚焦规则等\n\n### Ubuntu 的注册表编辑器\n\n使用命令 `$ apt-get\
    \ install dconf-editor` 安装设置管理器。它的类似于 Windows 的注册表编辑器，允许你调整许多隐藏设置\n\n### 默认壁纸\n\
    \n你可以在系统设置的“外观”部分中，将默认 Ubuntu 壁纸设置为你喜欢的照片（或绘画）\n\n### 更改主题\n\n这定义了各种 UI 控件的外，包括按钮、滚动条、菜单背景、窗口装饰等许多细节\n\
    \n“由于有许多人具有不同的品味，Unity 允许根据用户的喜好自定义所有核心功能，如桌面的外观和行为”\n\n调整桌面设置 使用 Ubuntu 系统设置中的相关部分\n\
    \n图 1（上方）你可以使用热点优化你的 Ubuntu \n\n**03** 更改界面主题可以极大改变工作体验。这是完全安全的：你没有改变桌面的工作方式，只是改变它的外观。默认情况下，Ubuntu\
    \ 带有三个主题：Ambiance（默认）、Radiance（浅色）和 High Contrast（针对视觉障碍人士）。你可以通过命令行安装新主题（例如添加包含主题的\
    \ PPA 并安装其程序包），或从 gnome-look.org 等网站手动下载主题。Ubuntu 会在系统级的 /usr/share/themes 目录以及家目录下的\
    \ `~/.themes` 中查找主题。\n\n更改外观与感觉\n\n- Ubuntu 了一些收集用户数据和收集统计信息的机制——当然，这完全是为了未来 Ubuntu\
    \ 版本的易用性。有些人觉得这种行为有争议，所以让我们稍微调整一下。在系统设置>安全与隐私中，转到“文件与应用程序”选项卡，取消勾选或完全关闭文件和应用程序使用统计。在“搜索”选项卡中，你可以开启或关闭\
    \ Unity Dash 中的在线搜索结果。例如，如果你在寻找本地应用时不喜欢购物建议，只需将其关闭即可。\n\n更改隐私设置\n\n"
