    Welcome to


    Many people who want to make the move from Windows to a Linux distribution choose
    Ubuntu as their first step. It provides a clean, attractive GUI with Unity, and
    usability by the bucket-load. It is the perfect environment in which to begin
    learning about the command line and creating a more customisable workspace. Meanwhile
    you still get many of the benefits you are used to in Windows and other desktop
    systems. This book serves as an introduction to the beauty and power of Ubuntu.
    From the default software to the best FOSS apps to download from the Software
    Centre, we’ll tour the top programs and applications, so soon you’ll be flying
    with Ubuntu.


    **Ubuntu**

