    ## Sharing files in Ubuntu


    ### Ubuntu essentials


    ### Standard toolbar

    In the top-right you will find quick links to settings, add file and help options.


    ### Shared files

    Here you can see the list of all the files that are available under Samba sharing.


    ### Permissions

    If you’d like the directory you are sharing to be writable/visible, just tick
    the corresponding checkboxes.


    ### Menu bar

    This section has the basic settings to add files to share and set preferences
    like server group and view all Samba users.


    ### Share name

    You can set the name for the directory selected above in this section.


    ### Save or cancel changes

    Click OK in order to save the changes to the Samba configuration file and start
    sharing. If you hit Cancel, the changes are discarded.


    ### Description

    Set the description for the shared directory here.


    ### Samba share directory

    Once you click on ‘Add file to share’, you’ll get a pop-up. In the Directory section,
    just browse and select the directory you’d like to share.


    Sharing files with Samba GUI Learn to share files with Samba


    - **guest ok:** allows clients to connect to the share without supplying a password.

    - **read only:** determines if the share is read only or if write privileges are
    granted. Write privileges are allowed only when the value is no, as is seen in
    this example. If the value is yes, then access to the share is read only.

    - **create mask: ** determines the permissions new files will have when created.


    Now Samba is configured, the directory needs to be created and permissions changed.
    In a terminal, enter:


    `$ sudo mkdir -p /srv/samba/share`

    `$ sudo chown nobody:nogroup /srv/samba/share/`


    Finally, restart Samba to enable the new configuration:


    `$ sudo restart smbd`

    `$ sudo restart nmbd`


    ## Manage drives with Disks


    Manage hard drives, SSDs and removable media with Ubuntu’s Disks tool.


    Disks manages both local and removable drives, repartitioning them as well as
    doing backup images and restoring from them. It is quite a straightforward tool,
    with device list on left and the currently selected device’s details on the right.
    You can use it to find out the model and size of your hard drive, how many partitions
    it has, its serial number, health status (SMART) and more. Users often launch
    Disks when they need to do some manipulations with the hard drives, SSDs or removable
    mass storage with the USB interface. Its illustrative visualisation of a drive’s
    volumes is really useful. If you are not aware about Primary or Extended partitions,
    you will instantly catch the idea after looking at the graphical scheme under
    the ‘Volumes’ label in Disks. You can do many advanced tasks with just a few mouse
    clicks, such as benchmark your drive, put it in a standby mode, create or delete
    partitions and so on.


    Another tool in Disks is its ability to create images from drives (*img) and to
    restore such images into other drives. This feature lets you clone all data, logical
    structure and a bootloader to, say, a newly acquired hard drive that you wish
    to use as a replacement drive.


    01**

    Sometimes new hard drives arrive with no partitions at all and Disks will show
    them as a monotonous rectangle labelled as ‘Unknown’. You may now choose what
    you want to do. if you go with an upper ‘gear’ button and format the whole disk,
    you will only create a partition table, not volumes. There is the legacy MBR (Master
    Boot Record) type, and the modern GPT (GUID Partition Table). The first one is
    compatible with everything, the other is required by new PCs with UEFI boot and
    also by large disks (>2TB). Next, you may want to create the actual volume by
    clicking on a volume-specific ‘gear’ button below and again choosing the Format
    option. If you plan to access your disk from Windows, use the NTFS filesystem.
    Otherwise, for Linux-only usage, the best option would be to go with Ext4.


    Format a USB portable drive


    **Ubuntu essentials**


    Manage drives with Disks


    “Users often launch Disks when they need to do some manipulations with the hard
    drives, SSDs or removable mass storage with the USB interface”


    ### See what is **connected**

    Disks shows you all connected drives that it can support (and that is almost everything).
    The Devices bar lets you select multiple drives and apply some actions to multiple
    drives at a time.


    ### Separate controls for **each partition**

    This tiny button only works for the currently selected partition.


    ### **filesystem**

    The Devices bar lets you select multiple drives and apply some actions to multiple
    drives at a time.


    ### **details**

    This tiny button only works for the currently selected partition.


    ### **Partition**

    The Devices bar lets you select multiple drives and apply some actions to multiple
    drives at a time.


    ### **Volumes**

    This tiny button only works for the currently selected partition.


    ### **structure**

    The Devices bar lets you select multiple drives and apply some actions to multiple
    drives at a time.


    ### **features**

    This tiny button only works for the currently selected partition.


    **Ubuntu essentials**


    The Devices bar lets you select multiple drives and apply some actions to multiple
    drives at a time.


    02**

    Conducting performance tests is fun but challenging, especially for non-tech users.
    Disks application has a built-in tool that means you can benchmark your drive
    at any time. First, you need to unmount either the whole drive, or just the partition.
    Click on the ‘gear’ tab and select ‘Start Bench’. You’ll get a graph with the
    red curve for average write rate, blue curve for read rate and green spots for
    access time.


    **Ubuntu essentials**


    04**

    A hard drive image is a very handy thing compared to plain file backups. It stores
    all drive structure, bootloader records and all other details, letting you replicate
    your setup onto another physical drive. Again, in case of ageing drive, which
    you feel can break at any time, there’s no better way to save it than create an
    image. Depending on what ‘gear’ button you use, you can either create an image
    of the whole drive, or just the current partition. When you choose the ‘Create
    Disk Image’ option, Disks will prompt you to choose a destination directory for
    the image file. Note that it must be saved on another physical drive. Later on
    you’ll be able to restore the drive form the image file using the ‘Restore Disk
    Image’ option.


    03**

    Drive settings can be sensitive to both desktop and laptop computers. Putting
    a drive into standby mode not helps save some watts but also reduces heating,
    and even makes the system quieter. Regardless of the default behaviour of your
    drive in Ubuntu, you can explicitly set it to go to sleep after a certain length
    of time. Click on the ‘gear’ icon and go to Drive Settings, where you can move
    the ‘Apply Standby Timeout Settings’ switcher to the ‘on’ position. Now you drag
    the slider and set the preferred timeout value, after which the drive will go
    on to standby. Similarly, you can decide whether you want to enable or disable
    write caching – just go to the ‘Write Cache’ tab and choose the desired mode.
    When caching is enabled, your drive works faster but may get corrupt your files
    in case of power outage.

