    \ time\n\n**Shuffle and Repeat**\n\nNo matter how long your playlist \n\nis, it\
    \ eventually reaches its end. \n\nEnabling the loop mode makes \n\nshort work\
    \ of this problem, as \n\nRhythmbox simply starts again \n\nfrom the beginning\n\
    \nPlay tunes with Ubuntu Use Rhythmbox to play music unnoticed\n\n**Track information**\n\
    \nMusic takes centre stage in \n\nRhytmBox. The two labels next \n\nto the album\
    \ cover swatch \n\nprovide information about the \n\ncurrently playing track,\
    \ along \n\nwith the album and the artist\n\n**Media storage list**\n\nThe big\
