    **图 1（上方）** 使用终端探索 Ubuntu 的文件系统结构


    ## 02 根目录


    Unix 完全抽象化了树形层次结构的本质，而根目录是 Ubuntu 层级结构中所有文件夹的基础。根目录以“/”符号表示，它包含了所有其他文件夹（图 2）。尽管习惯上将根目录称为“/”，但该目录条目本身没有名称——它的名称是初始目录分隔符字符（/）之前的空空部分。所有文件系统条目（包括挂载的文件系统）都是此根目录的“分支”。正是由于这种布局，Unix
    系统中的所有绝对路径都以“/”开头。即使你的计算机连接了多个物理或虚拟存储设备，所有文件夹都会显示在根目录下。


    请注意，不要将其与作为 root 用户主目录的 /root 目录混淆。


    ### 根目录


    ### 01 文件系统层级标准


    Ubuntu 文件系统基于文件系统层级标准（FHS）。该标准定义了 Linux 操作系统中的主要目录及其内容（图 1）。很大程度上，它是传统 BSD 文件系统层级结构的规范化和扩展。Linux
    Foundation——一个由 HP、Red Hat、IBM 和 Dell 等主要软件和硬件供应商组成的非营利组织——维护着 FHS。在编写时，当前的 FHS
    版本为 3.0，于 2015 年 6 月 3 日发布。


    ## 理解文件系统

    **Ubuntu 基础**


    ![](img/a6bf9da4751f37b25a0d6611dc73918d_44_0.png)


    ### 03 / 下的各种目录


    现在让我们来看看根目录下存在的各种重要目录，并了解它们各自的用途。


    - **/bin** 存放最常用的终端命令，如 ls、mount、rm 等。

    - **/boot** 包含启动系统所需的文件，包括 Linux 内核、RAM 磁盘镜像和引导加载程序配置文件。

    - **/dev** 包含所有设备文件，它们不是普通文件，而是指向系统上的各种硬件设备，包括硬盘。

    - **/etc** 包含系统全局配置文件，影响所有用户的系统行为。

    - **/home** 是用户的主目录。

    - **/lib** 包含重要的动态库和内核模块。

    - **/media** 设计用于外部设备的挂载点，如硬盘或可移动介质（CD、DVD 等）。

    - **/mnt** 也是挂载点的地方，但专门用于“临时挂载”设备，如网络文件系统。

    - **/opt** 可用于存储软件包管理器未处理的软件。

    - **/proc** 是一个虚拟文件系统，为内核向进程发送信息提供了机制。

    - **/root** 是超级用户的主目录；即使 /home/ 不可用，它允许启动系统。

    - **/run** 是启动过程中早期可用的临时文件系统，存储运行时数据。该目录下的文件在启动开始时会被删除或截断。

    - **/sbin** 包含通常仅供超级用户使用的管理命令。

    - **/srv** 可以包含服务的目录目录，如 HTTP 或 FTP。

    - **/sys** 是一个虚拟文件系统，可以访问它以获取有关内核视图的信息。

    - **/tmp** 用于应用程序的临时文件。

    - **/usr** 包含大多数用户工具和应用程序，并部分复制了根目录结构，例如 /usr/bin/ 和 /usr/lib。

    - **/var** 用于可变数据，如日志、数据库、网站和临时打印队列（电子邮件等），这些文件从一次启动持续到下一次。一个显著目录是 /var/log，存放系统日志。


    **图 2** 你可能熟悉的文件夹布局


    **Ubuntu 基础**

    **理解文件系统**


    ## 在 Ubuntu 中共享文件


    创建服务器共享数据


    默认的 Ubuntu 文件管理器 Nautilus 提供了一个易于使用的界面来帮助你跨系统共享文件。但在后台，Samba 正在运行。


    Samba 是一个用于无缝文件和打印服务的套件。它为 Unix 系统实现了服务器消息块 (SMB)/通用文件系统 (CIFS) 协议，支持 Windows、OS
    X 和其他 Unix 系统的文件和打印机共享。


    与其他 SMB/CIFS 实现不同，Samba 在各种系统中被广泛使用。你可以通过在其中系统上配置 Samba 为文件服务器来方便 Ubuntu 和 Windows
    之间的文件共享。


    Samba 可以执行许多其他功能，包括作为 SMB 客户端的服务器：你可以共享打印机（包括伪打印机），以便网络中的所有计算机都可以写入文件。Samba 还可以作为
    Windows 网络中的域控制器（验证用户等），甚至帮助使用 Windows 域控制器验证 Linux/Unix 机器的用户。然而，在本功能中我们将仅关注
    Samba 的文件共享部分。


    Ubuntu 16.04 默认没有安装 Samba，要开始共享你需要安装 Samba。我们将在后面的章节中查看安装过程和设置文件共享的步骤。


    “通过在其中系统上配置 Samba 为文件服务器来方便 Ubuntu 和 Windows 之间的文件共享”


    **Ubuntu 基础**

    **在 Ubuntu 中共享文件**


    ![](img/a6bf9da4751f37b25a0d6611dc73918d_46_0.png)


    ### 01 共享目录


    要共享目录，你必须拥有访问目录的权限。为了演示，让我们从用户主目录取一个文件夹，例如 Documents。


    进入你的主目录。右键点击 Documents 目录，在弹出菜单中选择“本地网络共享”。勾选“共享此文件夹”。如果没有 Samba，你会收到弹出菜单：“未安装共享服务”。选择“安装附加软件”并点击“安装”（图
    1）。如果你收到找不到 samba .deb 的错误消息，打开终端并如下所示更新 apt-get：


    $ sudo apt-get update$


    再次尝试，Ubuntu 将安装 Samba。再次尝试共享文件夹。右键点击 Documents 目录，在弹出菜单中选择“本地网络共享”。勾选“共享此文件夹”。如果没有
    Samba，你会收到弹出菜单：“未安装共享服务”。选择“安装附加软件”并点击“安装”（图 1）。


    **Ubuntu 基础**

    **在 Ubuntu 中共享文件**

    **图 1（上方）**


    ![](img/a6bf9da4751f37b25a0d6611dc73918d_45_0.png)

    **图 2（上方）**


    **Samba 服务器配置**

    **Ubuntu 基础**


    ### 03 使用配置文件


    我们学习了通过 GUI 进行共享，但直接编辑配置文件可以为你提供多种选项和灵活性，完全按照你想要的方式实现。主 Samba 配置文件位于 /etc/samba/smb.conf（图
    2）。默认配置文件有大量的注释，以记录各种指令。首先，在 [global] 部分编辑以下键值对：


    Workgroup = EXAMPLE

    Security = user


    注意，“security”参数在 [global] 部分的下方，并且默认是被注释的。此外，将“workgroup”值从 EXAMPLE 改为符合你环境的值。然后，要共享目录，在底部创建一个新部分，或取消注释一个示例：


    [share]

    comment = Ubuntu 文件服务器

    path = /srv/samba/share

    browsable = yes

    guest ok = yes

    read only = no

    create mask = 0755


    让我们看看每一项的含义：


    - **comment:** 共享的短描述。你可以根据需要进行调整。

    - **path:** 共享目录的路径。此示例使用 /srv/samba/share，是因为根据文件系统层级标准 (FHS)，srv 是应该提供特定数据的地方。从技术上说，只要权限正确，Samba
    共享可以放在文件系统的任何位置，但建议遵循标准。

    - **browsable:** 允许 Windows 客户端使用资源管理器浏览共享目录。


    **Samba 客户端**

    **Ubuntu 基础**


    ### 通过 Samba 访问文件


    Ubuntu 和 Gnome 使得访问 Samba 服务器共享的文件变得简单。首先，进入文件管理器，并在左侧垂直菜单上找到“浏览网络”链接。打开此链接，你会看到一个
    Windows 网络图标。双击打开。下一个窗口显示网络上发现的所有域/工作组。在每个域/工作组内部，你会看到所有启用了共享的计算机。双击计算机图标即可访问其共享和文件。


