    ## Find your way around Dash


    ![](img/a6bf9da4751f37b25a0d6611dc73918d_38_0.png)


    ### Dash scopes and lenses


    Dash serves as the universal window for finding content, but as there are several
    types of content on the computer, the results are segregated into smaller scopes
    or lenses (Fig 1). Dash has a series of scopes that logically separate the results
    and provide views to your files, folders, applications and data. The following
    scopes are installed by default: Home, Applications, Files, Videos, Music, Photos
    and Online (social media).


    When you launch Dash, you’ll see a search bar on the top. This is common to all
    scopes. Simply start typing and a list of results will appear below. Note that
    this is the home lens. The home lens is the default and will appear unless you
    explicitly select another lens. You can explicitly select a lens by clicking one
    of the options on the bottom bar (when Dash is active). Other lenses will only
    show the items from the corresponding scope that is relevant to your search query.
    For example, if you type text as a search query, home lens will show the results
    from all over the computer, but if you change it to an application lens, you’ll
    see the text editor as the first result.


    ### Dash keyboard shortcuts


    There are several shortcuts you can use to speed up your interaction with it.
    For example, press the super key and hold it for a while; a list of numbers will
    appear against the Launcher. You can open any of the applications by simply pressing
    the associated number on the keyboard. While you hold the super key, you will
    see a window with several shortcuts listed.


    To go straight to the applications lens, simply press the super key and the letter
    A at the same time. Similarly for the music lens, press the super key and M at
    the same time. For videos, press the super key and V.


    Super key+C takes you to photo lens and Super key+F opens the file lens. If you
    would rather switch between lenses on the fly, you can use Ctrl+Tab to switch
    between lenses once you are inside Dash.


    **Fig 1 (above)** Search results in Dash are separated into logical categories


    ## Ubuntu essentials


    ![](img/a6bf9da4751f37b25a0d6611dc73918d_39_0.png)


    ### Managing lenses in Dash


    Though Dash offers a lot of flexibility in showing search results, you may wish
    to remove some of the results listed, or add some that are either hidden by default,
    or simply don’t exist. There is a small application available in the Ubuntu Software
    Centre to help you to do this. Let’s install it first. Open Dash. Change the scope
    to Applications and search for the main menu. In the results that appear, click
    on the link to the Ubuntu Software Centre. Click Install on the top-right corner
    of the page to install the software. Now, open the main menu application using
    the Launcher or Dash.


    You can now enable, disable and even permanently delete items or whole categories
    from here. Check out the categories in the left-hand column. You can uncheck items
    or categories to hide them, and check to make them searchable again. This will
    not install or uninstall any software, but just stop results from showing in the
    Dash search results (Fig 2). This way, you can be sure of not breaking anything
    important.


    ### Filtering Dash responses


    The top-right corner of each lens has the filter option. You can click on the
    ‘Filter results’ link to expand the options. Note that the options are contextual
    – that is to say that there are options under different lenses. In the Home tab
    the filter option lets you choose which categories are shown and the online sources
    from where results can be pulled.


    The filters for the Applications tab include the ability to filter by type (such
    as graphics), games, Internet applications and so on. The filters also enable
    you to narrow down the search between applications that are already installed
    and applications that appear in the Ubuntu Software Centre. Similarly, if you
    are in the Files lens, you will be able to filter the results by type, size and
    the last edited time. Music lens filters by genre and decade. Photo lens filters
    based on the date that the photo was taken.


    **Fig 2 (above)** It’s possible to customise your Dash search results using the
    Ubuntu Software Centre


    ## Find your way around Dash

    ## Ubuntu essentials


    ![](img/a6bf9da4751f37b25a0d6611dc73918d_40_0.png)


    - **Text area**: This is the space where you type your queries into Dash. As you
    type in the text, you will see the space below being populated with results dynamically.

    - **Applications**: This section displays results related to the applications
    scope. You’ll see all the applications that match the search query here.

    - **Weather**: Dash automatically detects the scopes that may be relevant to the
    search query. Since there is a place called Dash, it automatically displays the
    weather forecast for that location.

    - **More suggestions**: This is the section that displays the results from online
    websites.

    - **Reference**: This is the section that displays references related to the query.
    You can see all the directories in the tree.

    - **Scopes**: Dash, by default, shows all available scopes. You can limit the
    results to specific scopes.

    - **Categories**: This shows the categories you’d like to see.

    - **Sources**: This allows you to select where Dash will look for.


    “The top-right corner of each lens has the filter option. You can click on the
    ‘Filter results’ link to expand the options. Note that the options are contextual
    – that is to say that there are options under different lenses.” (Wait, this text
    repeats or overlaps, let''s re-align).


    ## Find your way around Dash

    ## Ubuntu essentials


    ![](img/a6bf9da4751f37b25a0d6611dc73918d_41_0.png)


    ### Understanding the file system


    One of the most complex things about Linux is probably its file system. To a newcomer
    just started with Linux, this appears like a maze. Ubuntu (like all Unix-like
    systems) organises iles in a hierarchical tree, where relationships are thought
    of in terms of child and parent. Any element of the tree can be referenced by
    path name. An absolute path starts with the character ‘/’; a relative path is
    one that doesn’t start with ‘/’; in that case, the root depends on context, called
    the current directory. When executed from the root directory, it shows all the
    directories in the top-level hierarchy. The single dot indicates the current directory;
    double dot, the parent directory. There are many files and folders that serve
    different purposes. To a newcomer just started with Linux, this appears like a
    maze.


    Understanding the file system


    ![](img/a6bf9da4751f37b25a0d6611dc73918d_42_0.png)


    ### File listing command


    ‘ls’ lists all the files in the current directory and the ‘\-la’ extension shows
    the files in long format, along with all the hidden files. When executed from
    the root directory, it shows all the directories.


    | Column | Description |

    | :--- | :--- |

    | First column | The first character indicates whether it is a directory or a
    file. The other nine characters indicate the permissions for file owners, groups
    and everybody else. |

    | Second column | This column indicates the number of links or directories inside
    the directory. |

    | Third & fourth column | The third column shows the owner of the file, and the
    fourth column indicates the groups that the file belongs to |

    | Fifth column | This column shows the size in bytes. You may modify this by using
    the ‘\-h’ option together with ‘\-l’; this will have the output in kB, MB and
    GB for a better understanding of the size. |

    | Sixth column | This shows the timestamp of the last modification of the directory.
    |

    | File names | This is where all the directory/file names are listed. You can
    see all the top-level Linux default directories here. |


    ### Special files


    Wherever you issue the ‘ls’ command in Linux, you’ll see these two files listed
    on the top. However, these aren’t visible if you inspect the same directory via
    the GUI. The single dot indicates the current directory; double dot, the parent
    directory.

