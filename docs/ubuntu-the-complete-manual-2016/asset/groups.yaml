    ## Ubuntu 基础


    ## 配置网络连接


    配置网络连接


    在 Ubuntu 中设置网络连接非常简单。


    对于那些只需要将以太线插入电脑网络端口即可立即访问互联网的人来说，可以跳过本节（也许在虚拟机环境中运行 Ubuntu 的人也可以这样做）。然而，大多数 Linux
    新手在在连接互联网或更改网络参数时往往需要帮助。在过去的十年里，几乎每个 Linux 发行版都依赖于 NetworkManager —— 这是一个稳定、功能丰富且直观的
    Linux 网络处理器。Ubuntu 的 Unity 桌面环境与 NetworkManager 紧密集成，在顶栏提供网络指示器，以及一个名为 Network
    的独立图形化实用程序（图 1）。你可以在 Dash 中搜索它，作为系统设置中的子项打开它，或者从命令行启动（$ unity-control-center network）。在这里可以添加、修改甚至删除有线和无线线网络连接。


    **图 1（右侧）** 配置有线和非有线网络连接


    ![](img/a6bf9da4751f37b25a0d6611dc73918d_82_0.png)


    ## Ubuntu 基础


    ## 配置网络连接


    ### 连接无线或有线网络


    如果你想使用无线连接并且你有一个 Wi-Fi 网卡或芯片，事情就非常简单：注意 Unity 顶栏最右侧的“雷达”图标并点击它查看可用网络列表。选择你的网络，一旦提供正确的身份验证密码，大部分工作就完成了。对于有线网络连接，你会获得
    IP 地址、子网掩码和网关地址，你需要进入网络配置对话框并手动添加连接。要这样做，首先检查有线网络的全局开关是否处于 On（开启）模式，然后按下窗口右下角的
    Options（选项）按钮。这将打开连接编辑器（图 2），在其中最常用的地方是 IPv4 设置选项卡。在 Method（方法）下拉菜单中，选择 Manual（手动），然后在下面的字段中提供你的连接详情。


    ### 查看连接设置


    当你在线时，可能仍然想使用 NetworkManager 查找有关当前连接的某些详情。查找此类详情最快的方法是点击 Unity 顶栏上的网络指示器并进入 Connection
    Information（连接信息）项目。你将看到一个带有许多连接详情的独立窗口，包括常规设置（你的网卡 MAC 地址、声明速率、接口名称）以及 IPv4 和
    IPv6 的 IP 连接详情（如果对你有相关的话）。Network 应用的主窗口也显示网络设置，并包含一个更简短的列表，带有硬件地址 (MAC)、IP 地址、默认路由和
    DNS 服务器列表。如果由于某些原因无法以图形模式运行 NetworkManager，请使用 `$ ifconfig` 命令查看设置并使用 `$ nmcli`
    管理各种连接。例如，让我们从一个无法进入桌面的损坏 Ubuntu 系统中启动一个已知的 Wi-Fi 连接：


    $ nmcli dev wifi con “Network_Name” password “your_password”


    在代理服务器后进行操作会增加一点复杂性。通常情况下，你必须声明多次你的代理设置：分别用于 Web 浏览器、Bash 环境、Apt 软件包管理器、Wget 下载器等。然而，Ubuntu
    在这方面让事情变得简单了一点。点击左侧列表中的 Network Proxy（网络代理）项，并选择适合你的代理设置类型。如果你得到了一个 URL，选择 Automatic（自动）方法并在下面的字段中提供该
    URL。带有个人身份验证的代理通常需要手动设置。选择 Manual（手动）方法并提供至少 HTTP 代理，使用以下语法：


    username:password@server-name.domain


    提供正确的端口，最后点击 Apply system wide（应用到全系统）按钮完成设置并开始使用。


    设置网络代理


    **图 2** 使用连接编辑器手动输入详情


    ![](img/a6bf9da4751f37b25a0d6611dc73918d_83_0.png)


    ## Ubuntu 基础


    ## 连接在线账户


    ### 连接在线账户


    在 Ubuntu 中享受更方便的在线服务集成


    在线社交服务对于普通用户来说已经是日常生活的一部分。我们大多数人使用这些服务来与朋友和亲戚建立联系，分享照片、视频和其他文件。几乎每个在线服务都需要身份验证，这通常涉及注册账户并在稍后使用它访问服务的个人部分。Ubuntu
    通过消除登录单个账户的需求，简化了在线服务的通用体验。（*注：原文中该段落存在大量重复，译文按要求已去重复处理*）


