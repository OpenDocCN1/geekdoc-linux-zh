    ## Ubuntu 应用


    ## 提升你的浏览体验

    使用 Firefox 浏览网页的重要技巧


    ### 01

    有些步骤你每天会重复执行几次，却没有意识到它们花费了多少时间，例如搜索特定的网站。与其先访问搜索引擎、找到搜索框、输入关键词并执行搜索，不如你可以在浏览任何网站时，直接使用
    Firefox 搜索互联网。


    要在浏览器中设置此功能，请访问目标网站上你通常用于搜索该站的搜索字段页面。按住 Ctrl 键并点击地址栏搜索字段中的“搜索网站”（Search website）。为此搜索选择“添加关键字”（Add
    a Keyword）。会出现“添加书签”对话框。为书签输入一个适当的名称（例如：“Wikipedia搜索”）。创建一个关键字（如“wikipedia”）。选择包含该智能关键字的书签文件夹。点击确定。要使用创建的智能书签，在位置栏输入关键字和搜索字符串，然后按回车键。


    ### 02

    现在人们使用多个设备访问互联网。Firefox 帮助确保你所有的同步书签、链接和其他内容在设备间无缝同步。Firefox 通过一个名为“同步”（Sync）的功能来实现这一点。它允许你在所有设备间共享数据和偏好（如书签、历史、密码、打开的标签页、阅读列表和安装的插件）。


    让我们如何在 Firefox 中设置并同步账户。首先，点击菜单按钮并点击“登录同步”（Sign in to Sync）。登录将在新标签页中打开。点击“开始使用”（Get
    Started）按钮。填写表格创建账户并点击“下一步”。记住你使用的电子邮件地址和密码；稍后需要它们登录。检查邮箱中的验证链接并点击它以确认你的邮箱地址。


    **图 1（上方）** 只需几个简单的步骤即可更改默认主页


    “隐私浏览允许你浏览互联网而不保存任何关于你之前访问过的网站和页面的信息”


    你已准备就！现在你只需要在所有其他设备上登录同步，让它完成剩下的工作即可。


    ### 03

    当你浏览网页时，Firefox 会记住很多信息，例如你访问过的网站和密码。然而，在某些情况下，你不希望能够访问你电脑的人看到这些信息。隐私浏览允许你浏览互联网而不保存任何关于你之前访问过的网站和页面的信息。隐私浏览还包含追踪保护，它可以防止公司跨多个网站跟踪你的浏览历史。要开启隐私浏览会话，点击菜单按钮然后点击“新隐私窗口”。如果你想直接在新的隐私窗口中打开链接，请在按住
    Ctrl 键的同时点击该链接，并在右键菜单中选择“在新隐私窗口中打开链接”选项。


    ### 04

    Mozilla 也为开发者提供浏览器平台。


    安装应用

    这为 Mozilla 市场中数千个有趣且实用的应用铺平了道路（图 2）。Firefox 市场拥有丰富的游戏、音乐和生产力应用，满足每个人的需求。要安装应用，打开
    Firefox，点击“工具”菜单并选择“应用”（Apps）。这将打开市场。现在，在搜索框中输入查询内容以查找特定应用，或根据你正在寻找的应用类型选择类别。你也可以从下拉菜单中选择屏幕类型，查看针对该屏幕尺寸优化的应用。点击应用查看详情。最后，如果你准备好安装应用，点击蓝色的安装按钮。


    **图 2（上方）** 前往 Mozilla 市场下载应用


    ## 使用 Thunderbird 管理你的邮件

    Thunderbird 是 Mozilla 软件套的一部分，是一款轻量级邮件客户端。它支持 POP、IMAP、Gmail 等不同的账户协议。它还内置了垃圾邮件过滤器，并可以通过标签轻松地组织邮件。通过简单的安装扩展可以添加更多功能。如果你是一个热心读者，Thunderbird
    还可以作为新闻和 RSS 客户端。标签页邮件允许你在单独的标签页加载消息，这样你就可以快速在不同对话之间切换。快速过滤器可以帮助你根据标签、关键词等过滤消息。其他功能还包括消息存档、自定义主题和人物设定、智能文件夹，甚至是聊天集成。你还可以直接将
    Twitter 和 Facebook 等社交媒体账户添加到 Thunderbird，并在这些平台上与联系人聊天。Ubuntu 16.04 默认安装了 Thunderbird，只需搜索它即可。点击结果中的图标启动
    Thunderbird，你现在就可以开始了。


    “你也可以直接将 Twitter 和 Facebook 等社交媒体账户添加到 Thunderbird”


    使用 Thunderbird 远程工作并学习管理所有邮件账户


    ### 探索 Thunderbird 界面的核心功能

    | 区域 |  |

    | :--- | :--- |

    | 获取消息 (Get messages) | 你可以使用此按钮强制与邮件服务器同步，并获取所有邮件账户的新消息 |

    | 搜索和过滤 (Search and filter) | 你可以从此区域在邮箱中搜索特定关键词，或根据发送者、收件人、主题等过滤邮件 |

    | 写信 (Write) | 点击此处打开撰写对话框并编写消息 |

    | 通讯录 (Address book) | 它将不同邮箱账户的所有联系人详情存储在一个处 |

    | 邮件文件夹列表 (Mail folder list) | 此区域包含所有邮件文件夹。如果你启用了统一邮箱，你将看到每个邮箱显示为一个文件夹 |

    | 邮件列表 (Mail list) | 此区域按时间顺序显示所有邮件的列表。只需点击列标题即可根据不同标准进行排序 |

    | 聊天 (Chat) | 所有的平台配置（如 Facebook、Twitter 等，如果已链接到 Thunderbird）都在此框内可见 |

    | 邮件显示 (Mail display) | 此区域显示上方窗格中选邮件的详细视图。你可以在这里看到回复、转发和删除按钮 |


    使用 Thunderbird 进行社交聊天

    要向 Thunderbird 添加聊天账户，点击 Thunderbird 启动页面上“邮件”旁旁“聊天”按钮。点击链接后，你将看到一个列出支持服务的弹出窗口。Facebook、Twitter、Google
    Talk、IRC 和 Yahoo 均受支持。选择要添加的账户并点击“下一步”。在下一页输入用户名，在下一页选择别名。最后，点击“完成”按钮。你将被带到所选账户的网站以验证对账户的访问。验证后，你可以在新标签页中查看所有的对话。Thunderbird
    聊爱的另一个方面是所有聊天对话都包含在搜索中。因此，如果你正在寻找某个关键词，只需输入它，获得的结果将包含你过去的聊天历史记录。


    将 Thunderbird 作为你的邮件客户端

    使用 Thunderbird 设置新账户非常简单。从点击启动页面上的“邮件”链接开始。然后你需要为你的邮件提供商提供用户名和密码，以及你的电子邮件地址（图
    1）。Thunderbird 通过查询你的邮件提供商来确定连接详情（如端口、服务器名称、安全协议等），通常可以提供账户详情。


    如果你的邮件提供商未列在 Thunderbird 数据库，或者你有非标准的邮件配置，则需要手动配置账户。手动配置账户需要以下详情：入邮件服务器和端口（例如
    `pop.example.com` 和端口 110），出邮件服务器和端口（例如 `smtp.example.com` 和端口 25），以及与服务器连接的安全设置（例如
    `SSL/TLS` 以及是否使用安全验证）。填写这些详情即可开始。


    “使用 Thunderbird 设置新账户非常简单。从点击启动页面上的‘邮件’链接开始。”


    **图 1（上方）** 输入你的姓名、地址和密码详情以关联新账户


