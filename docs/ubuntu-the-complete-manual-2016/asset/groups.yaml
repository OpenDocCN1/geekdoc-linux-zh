    ## Ubuntu essentials


    ## Configure network connections


    Configure network connections


    Setting up a network connection in Ubuntu is easy.


    Those who only need to plug their Ethernet cable into their computer’s network
    port in order to have an instant access to the Internet can skip this section
    (perhaps those running Ubuntu inside a virtual environment can do that too). The
    majority of Linux newbies, however, often need assistance in connecting to the
    Internet or changing their network parameters. During the last decade, almost
    every Linux distribution has relied on NetworkManager – a stable, feature-rich
    and intuitive network handler for Linux. The Unity desktop in Ubuntu has a tight
    integration with NetworkManager by offering a network indicator on the top bar
    and a standalone graphical utility called Network (Fig 1). You can search for
    it in Dash, open it as a subsection in System Settings or launch from command
    line ($ unity-control-center network). Both wired and wireless network connections
    can be added and modified or even removed here.


    **Fig 1 (right)** Configure wired and non-wired network connections


    ![](img/a6bf9da4751f37b25a0d6611dc73918d_82_0.png)


    ## Ubuntu essentials


    ## Configure network connections


    ### Connect to a wireless or wired network


    If you want to use a wireless connection and if you have a Wi-Fi network card
    or chip, things are quite easy: notice the ‘radar’ sign at the far-right position
    on Unity top bar and click it to see a list of available networks. Select your
    network and once you provide the correct authentication password, you are mostly
    done. With wired network connection, for which you are given an IP address, network
    mask and a gateway address, you’ll need to enter the Network configuration dialogue
    and add your connection manually. To do so, first check that the global switch
    for wired networks is in the On mode and then press the ‘Options’ button in the
    lower-right corner of the window. This will bring up the connection editor (Fig
    2), in which the most common place to go is the IPv4 Settings tab. In the Method
    drop-down menu, select Manual and then provide your connection details in fields
    below.


    ### View connection settings


    When you are online, you still may want to use NetworkManager to find out certain
    details about your current connection. The quickest way to find out such details
    will be to click on the network indicator on the Unity top bar and go to the Connection
    Information item. You will see a separate window with lots of details about your
    connection, including general settings (your network car MAC address, declared
    speed, interface name), and IP connection details for both IPv4 and IPv6 (if it
    is relevant for you). The main window of the Network application also displays
    network settings and includes a briefer list with Hardware Address (MAC), IP Address,
    Default Route and the list of DNS servers. If you cannot run NetworkManager in
    graphical mode for some reason, use the ‘ ifconfig’ command to view settings and
    ‘$ nmcli’ to manage various connections. For instance, let us bring up a known
    Wi-Fi connection from within a broken Ubuntu system that cannot boot into any
    desktop:


    $ nmcli dev wifi con “Network_Name” password “your_password”


    Sitting behind a proxy adds a little complexity. Usually you have to declare your
    proxy settings several times: separately for a web browser, in the Bash environment,
    for Apt package manager, for Wget downloader and so on. However, Ubuntu makes
    things a little easier on this front. Click the ‘Network Proxy’ item in the list
    on the left and choose what kind of proxy setup works for you. If you have been
    given a URL, select the Automatic method and provide that URL in the field below.
    Proxy with personal authentication usually requires manual setup. Select the Manual
    method and provide at least the HTTP proxy, using the following syntax:


    username:password@server-name.domain


    Provide a proper port and finally hit the ‘Apply system wide’ button to finish
    with setup and get going.


    Set up a network proxy


    **Fig 2** Input details manually using the connection editor


