    ## Ubuntu essentials


    ### Use System Monitor


    View and manage system resources using the System Monitor app


    System Monitor is a tool for managing running processes and monitoring system
    resources. It is one of many accessories borrowed from the Gnome desktop. You
    can run from Dash or from command line ($gnome-system-monitor). The application
    looks and works similarly to its analogues in Windows and OS X, and contains three
    logical tabs: Processes, Resources and File systems. Launch the application with
    a specific tab showing by using command line parameters ‘-p’ for processes, ‘-r’
    for resources and ‘-f’ for file systems. Launching with the File Systems tab shown
    can be done with the ‘$ gnome-system-monitor -f’ command line. System Monitor
    is used to tackle system sluggishness. You could also use the CPU load graph to
    find out if hardware-accelerated video output really works.


    **Manage system processes**


    Each application in Linux creates at least one process. Some processes refer to
    graphical applications, others run in the background and provide service functionality.
    With the help of System Monitor you can view the list of all processes, know their
    names, find out which process belongs to which users, detect processes that devour
    too much CPU cycles or draw high levels of RAM, associate processes with their
    low-level IDs and manage process priority. Normally you’ll see a list of processes
    sorted by name. Note that you can click the name of a column to sort processes
    by it. It is very helpful to sort them by CPU percentage or memory usage. If a
    process belongs to you (or if you have the permissions), you can kill it or lower
    its priority. Select the process you want to get rid of and press the End Process
    button in the lower right corner of the window. Right-click the process and select
    the Change Priority menu to alter its priority.


    The File Systems tab displays a table of all file systems that are currently mounted
    in Ubuntu. You can find out the device name, file system type, mount point, total
    capacity and available disk space. Of course, you can find out a similar set of
    information in Ubuntu’s disk utility (Disks, p.50), but System Monitor offers
    a more comfortable view, which lets you quickly analyse how much space is left
    on your device and sort them by various criteria. The Used column doubles the
    information about free disk space, but shows it in the form of a percentage bar.
    When the bar fills up to approximately 90 percent or more, it means that you are
    running low on free disk space, which can be troublesome for certain workflow
    scenarios. Ubuntu cannot work properly if the root partition (/) gets 100 percent
    full. You can also check for free disk space in terminal by using the ‘$ df’ command
    (disk free), although it doesn’t let you sort or reorder any of the lines.


    **Find out details about file systems**


    **Control resources usage**


    The Resources tab offers effective graphs that get updated in real time (Fig 1).
    The first graph shows CPU History in live mode (there is no delay in data update
    by default), showing CPU cores in different colours. When you launch a heavyweight
    application you’ll notice peaks on that graph. You can also figure out whether
    an application can use several CPU cores at once, or if it pushes all of the load
    on one core. The middle graph is for Memory and Swap Usage. On modern systems,
    swapping to a file or to a separate Swap partition is rarely used in everyday
    tasks, simply because there is already sufficient RAM. However, processing large
    files (like retouching a giant poster in GIMP) may require swapping, which only
    takes place when your system is running low on available RAM. The final graph,
    Network History, shows the network speeds for both downloading and uploading.
    This graph can be particularly helpful for network troubleshooting and low Internet
    speed diagnostics. Both memory and network history graphs help you monitor your
    system’s performance.


    **Fig 1** Graphs help visualise performance data


    ## Ubuntu apps


    ### Explore the Ubuntu Software Centre


    Navigate your one-stop shop for purchasing, installing and removing apps


    Ubuntu Software Centre, aka USC, is a package management portal – that is, a consolidated
    platform where you can search for, install or purchase software, and even remove
    apps from the list of installed software. Initially released on 29 October 2009,
    Ubuntu Software Centre is developed in Python and contains more than 53,000 apps.
    Previously, Ubuntu programs were downloaded from the repository as tar files,
    unzipped and then installed, manually running the commands in the console. Even
    the previous versions of Ubuntu had many graphical utilities for adding/removing
    software, which ultimately led to redundancy and fragmented development effort.
    To ease this process, USC came with a worthwhile approach where all the software
    is installed with the click of a few buttons. The search for specific software
    here as USC has name/description-based search functionality, with multiple options
    to choose from. The rating and users’ review helps you to find the best software.
    The latest version of Ubuntu comes with some preconfigured tools and software
    like LibreOffice suite, Mozilla Firefox, text editors etc., which are displayed
    vertically in the left sidebar. To get started, search for the shopping bag icon
    in the display and click it to launch Software Centre. Upon the launch of USC,
    the home screen appears, which contains different categories of software, recommended
    software, newly added software (Fig 2), top rated software and many more. For
    instance, if you’re looking for a text editor, you can type the keyword in the
    search bar, which shows the different text editors present in USC in a list view.
    You can just select any of them and click the Install button to start the download.


    **Fig 2** The Software Centre is arranged into categories to help you find what
    you need


    On the top of the home screen you will find navigation commands: All Software
    and Installed (Fig 1, page 88). The Back and Forward buttons – displayed as ‘<’
    and ‘>’ respectively – help you navigate the different pages. USC keeps the visited
    pages in memory so that by the Back button once, you’ll reach the page you just
    left. The Back command is unavailable whenever previous screens exist in the history,
    and the Forward command whenever no later screens exist in the history. The All
    Software section presents all the programs available.


    **Fig 3** Register with Ubuntu to make recommendations


    In terms of display, if the category is set to ‘Show non-applications by default’,
    then results are displayed in a list view; otherwise tile view is used, and non-application
    items are hidden by default. The top rated applications are also displayed on
    the home screen using tile view in descending order of rating, regardless of whether
    they are installed or not. Applications with five-star ratings and one four-star
    will be displayed before other applications having two five-star ratings. Items
    are displayed on the home screen under the Top Rated tab; when the More button
    is clicked, you land on a page where items are displayed in decreasing order of
    rating using the list view.


    **Navigate via categories** The various ways to navigate the Software Centre they
    already installed on the computer or not. In the Installed section you will find
    the list of programs that are installed on your Ubuntu machine, with the date
    of installation. When a software item is selected, if the item is not currently
    installed in your system, you will see an Install button. Click to install the
    software on your machine. If the software is already installed, a Remove button
    is available; clicking it will uninstall the software.


    On the home screen itself, you will find the section ‘Recommended For You’. In
    order to make use of the recommendation facility, you have to register yourself
    in Ubuntu by providing the details in the form with a valid email ID (Fig 3).
    You will receive the verification code at the email address provided (Fig 4).
    Once that process is complete, you will receive a success message and Ubuntu starts
    recommending useful software to you, which you can select and install on your
    machine with ease.


    The USC segregates software into different categories, such as accessories, developer
    tools, books and magazines, games, education, office and many more. Upon clicking
    the Accessories tab, for instance, a list of accessories is displayed, including
    SpeedCrunch (precision calculator), 7zip (compression/uncompression tool), PuTTY
    (SSH/Telnet client) and Shutter (screenshot utility). The software listed in the
    Accessories tab is by default sorted by rating; the other sorting criteria are
    name and release date.


    Moving on to the Developer Tools page, you will find many open source tools which
    are subcategorised into version control, IDEs (integrated development environments),
    web development and so on. The version control subcategory has many flavours of
    versioning software, prominent ones being Git-Cola, qgit and ggit. The IDEs tab
    has Netbeans, Ninja, Spyder and Eclipse, which can be installed and used for software
    development. There are also other subcategories named after software languages
    – like Java, Python and Perl – that contain the different versions and tools related
    to the specific language.

