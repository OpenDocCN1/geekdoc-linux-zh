    \ done by prefixing the command \n\nwith ‘sudo’. On some other systems you would\
    \ log in as root user; you can \n\ntemporarily do this on Ubuntu by running sudo\
    \ -s or sudo bash, but we \n\ndon’t recommend it, as it’s easy to get into the\
    \ habit of running with root \n\npermissions, and to accidentally cause some damage.\
    \ \n\nUpdate Ubuntu’s knowledge of the latest available packages with \n\nsudo\
    \ apt-get update. You can look under /etc/apt/ to see the source \n\nfiles where\
    \ Ubuntu remembers which repositories to look in. You can \n\n**Fig 6 (above)**\
    \ The Linux command \n\nline may seem complicated at first \n\nbut you will soon\
    \ master it\n\n**60**\n\nGet to grips with the Linux command line\n\n**Ubuntu\
    \ essentials**"
