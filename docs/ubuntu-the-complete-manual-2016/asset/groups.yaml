    ## 掌握 Linux 命令行


    遣词得当可以让你免去在图形用户界面（GUI）中来回奔波，因此请确保你使用了正确的命令。


    命令行可能是一个较老的界面，但它之所以能生存至今，是因为它能够通过几个恰当的命令精确地告诉计算机你想要什么。例如，单条命令就可以将目录中所有的 MP3 和
    MP4 文件复制到备份磁盘或网络上的另一台机器——或者互联网上的任何地方。


    许多人第一次接触计算机——也许是在 20 世纪 70 年代或 80 年代的大学里——是坐在一个被称为“控制台”（console）的哑终端终端前，该终端连接到一台远端且巨大的计算机。如今，计算机可以像信用卡一样大——比如树莓派——但旧式的终端仍然以“终端”程序的形式被记忆，它为你提供了一个访问
    Ubuntu 的命令行界面。


    根据你运行的是哪种版本的 Ubuntu，终端的名称可能不同，但在 Unity Shell 的应用搜索或菜单中输入‘term’，你就会至少出一个终端选项。打开它，你应该看到一个看起来相当空旷的窗口。不要被那个闪烁的光标吓到——通常是‘$’符号，被称为“美元提示符”。它正在等待执行你告诉它的任何操作。你只需要知道正确的词汇——或命令——来让它运行。


    这里有一个简单的示例供你先尝试：在终端中输入 **evince**——我们将你需要输入的指令加粗，以便你更清楚地看到命令；之后始终按回车，让 Ubuntu
    知道现在要执行操作了。


    只要你没有输错，你刚刚打开了 Ubuntu 的 PDF 阅读器，而没有使用任何 GUI 菜单或快捷项目。


    ## Ubuntu 基础


    要查看“文档”（Documents）文件夹，打开终端并输入 `ls Documents`。别忘记按回车。你将看到 Documents 文件夹中所有文件的列表。输入
    `ls` 你将看到主目录下的文件列表——因为当你打开终端时，它会将你置于该目录。你可以使用切换目录命令——`cd` 来更改，例如：`cd Documents`。现在，单独输入
    `ls` 就会显示你的文件。


    `cd -` 命令将带你回到上次，因为 `-` 是一个快捷方式，告诉 `cd` 回到你之前的所在地。你也可以输入 `cd ~`，因为 `~` 是你的主目录（如
    /home/jo/ 等）的缩写。`pwd` 将提醒你现在所在的位置。


    配置文件——那些被称为点文件（dotfiles）的文件，因为它们以点开头——通常在列表中被隐藏。在大多数文件管理器中，你可以通过 Ctrl+H 切换显示（在少数软件中是
    Ctrl.+）。在终端中，命令是 `ls -a`。


    `.` 和 `..` 是“当前目录”和“父目录”（即上一级目录）的快捷方式——使用 `-A` 代替 `-a` 可以隐藏它们。连字符后的那些字母被称为命令行开关（switches）：尝试
    `ls -l` 来查看详细列表。我们稍后会介绍它显示的那些看起来晦涩的信息。


    移动和复制文件使用 `mv` 和 `cp` 命令。我们将在 Overleaf 中看到 `cp` 的用法，但现在我们将复制图 1 并尝试将文件移动到新位置：


    ```bash

    cd ~

    touch random.txt

    mv random.txt newname.txt

    mv newname.txt Documents/

    ls

    ls Documents

    ```


    ## 文件、文件夹和熟悉的内容


    是时候让命令行在你的文件和文件夹上为你工作了。


    ### 内部查看


    你不需要打开应用程序即可查看文件内容。`file` 命令让你看到它是什么类型的文件。`cat` 将文件内容滚动显示，而 `more` 则一次一页地提供给你。`less`
    的功能相同，但有更多控制选项，如果你不知道按 **Q** 退出，你就会卡在里面。**Q** 也会退出帮助手册（man pages）；对于其他程序，Ctrl+C
    是退出的不错选择。有时只想只想文件的开头或最后几行——`head` 和 `tail` 就是你需要的命令，每个命令默认显示十行。`tail -n 30 /var/log/syslog`
    会显示该日志文件记录的最后 30 条内容。真正的威力来自 `grep`（图 2，第 56 页），用于在文件中搜索术语。尝试 `grep ls ~/.bash_history`
    来提取你目前为止使用的所有 `ls` 实例。


    ### Tab 键补全


    如果你觉得输入量太大，尝试在输入每个单词的前几个字母后按下 Tab 键。当只有一种可能的补全方式时，单词将自动填充。按两次 Tab 键会在有多种可能的情况时显示建议。


    如果你想了解更多关于命令的信息，它们（几乎）都有手册——或说 man 页（图 3）。`man ls` 将告诉你 `ls` 的所有选项；`ls` 将告诉你关于命令本身的手册。


    ### 使用 Nano


    查看文件是一回事，但我们通常需要编辑它。Nano 包含在 Ubuntu 以及其他发行版中，友好得多。在这个示例中，我们将使用 Nano 编辑 `.bashrc`
    文件。要要打开文件，输入 `nano ~/.bashrc`。进入后，你可以使用方向键导航到文本。注意，# 之前的行是非激活的（被注释掉了）。要激活它们，请删除
    #。


    要保存工作，按住 Ctrl+O 然后按 O。要退出，按 Ctrl+X。


    ### 权限请求


    Ubuntu 文件受到保护，防止共享机器上其他用户的修改。所有文件和文件夹都属于一个用户和一个组。每个文件的权限关系到用户、组或其他任何人可以读取、写入或执行该文件；这缩写为
    rwx。对于目录，执行权限只是进入目录的权限。执行文件意味着作为程序运行——所以 JPG 图片文件没有运行权限。


    ### 没有附件？


    虽然权限提供的保护非常有用，但它们也是为了让疏忽的人碰壁。例如，使用 sudo 时，你可能从另一个用户的主目录复制了文件。除非你更改所有权，当你尝试将文件附加到电子邮件时，你可能会困惑，因为它们无法添加——因为你甚至没有读取这些文件的权限！


