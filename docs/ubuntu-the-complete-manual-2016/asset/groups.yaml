    \ \n\nmedia currently scheduled \n\nfor playback. Double-click \n\nan item to\
    \ start playing it\n\n**Volume toggle**\n\nReducing Rhythmbox’s \n\nvolume independently\
    \ from \n\nthe rest of the system can \n\nbe helpful. Click the speaker \n\nsymbol\
    \ and then peruse the \n\ncontrols in the flyout to suit \n\nyour preferences\n\
    \n**Album cover **\n\n**preview**\n\nEven though music is an aural \n\nexperience,\
    \ adding some \n\nvisual spruce is totally worth it. \n\nDouble-click the small\
    \ icon to \n\nopen a pop-up with a bigger \n\nversion of the image\n\n**Seek bar**\n\
    \nEver feel like skipping over \n\nboring interludes and \n\nintros? Grab the\
    \ seek bar \n\nand drag it to the right. The \n\nplayback position will be \n\n\
    adjusted automatically"
  - "[PAGE 125]\n\n![](img/a6bf9da4751f37b25a0d6611dc73918d_125_0.png)\n\n**Ubuntu\
    \ apps**\n\nListen to songs with Rhythmbox\n\n**126**\n\n**01**\n\nThis tutorial\
    \ starts out with \n\na scenario to think about: a \n\nfriend provides you with\
    \ a Gigabyte \n\nworth of Falco tracks. Let’s assume \n\nthat the USB stick containing\
    \ the \n\nfiles has already been returned \n\nand the music currently sits in\
    \ a \n\nsubfolder of a hard disk on your \n\nmachine. Start out by clicking \n\
    \nFile>Add Music. Next, click the \n\narrow next to the combobox \n\nand choose\
    \ Other to open a file \n\nselection dialog. Then proceed to \n\nnavigate to the\
    \ folder containing \n\nthe subfolders with the albums. \n\nFinally, click Open\
    \ to close the \n\ncommon dialog.\n\nImport the tracks\n\nManage your tunes Organise\
    \ large volumes of media\n\n“When the analysis is done, the list below \n\nthe\
    \ import controls will populate itself \n\nwith further information”\n\n**02**\n\
    \nRhythmbox will proceed \n\nto scan the contents of the \n\nfolder. This process\
    \ can take up to one \n\nsecond per file, which means that \n\npatience is a virtue\
    \ here. \n\nWhen the analysis is done, the \n\nlist below the import controls\
    \ \n\nwill populate itself with further \n\ninformation about the tracks found.\
    \ \n\nSet importing options\n\n**Fig 1 **Choose where you \n\nwant your music\
