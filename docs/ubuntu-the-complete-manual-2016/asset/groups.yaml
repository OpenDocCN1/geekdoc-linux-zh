    \ \n\noption to tweak.\n\nChange case\n\n**07**\n\nWriter has a recovery tool\
    \ for when unexpected shutdowns happen, but that relies on temporary files and\
    \ other \n\nrelated files that aren’t always there when you really need them.\
    \ Writer does have a backup system that it can make \n\nuse of though; enable\
    \ ‘Always create backup copy’ in the Load/Save General options to cover this.\n\
    \nCreate a backup system in Writer"
