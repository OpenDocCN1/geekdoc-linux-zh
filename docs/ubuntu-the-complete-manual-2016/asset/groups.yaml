    ## Ubuntu 应用

    ## 20 个 LibreOffice 核心


    15 回车键将你移动到下一行单元格似乎非常自然，这也是 Calc 的默认行为。然而，你实际上可以通过进入“工具 > 选项 > LibreOffice Calc”，然后选择“常规”来更改回车键的行为，使其按行移动。


    ### 更改回车键


    16 如果你有大量的数据、行或列，你有时会发现自己在浏览电子表格时，并不总是记住或确定某个单元格的用途。通过选择你希望始终显示的行或列，进入“窗口”然后选择“冻结”，这样在浏览表格时它们就会始终保持在顶部或左侧。


    ### 冻结列


    ## 杂项


    17 使用 Impress 演示幻灯片时，你通常会连接到投影仪或电视机，它们要么镜像你的笔记本屏幕，要么作为扩展显示。Impress 有一个非常用的功能：实际演示将在大屏上显示，而你可以仅为笔记本电脑显示开启演讲者控制台，向你展示即将要演示的内容以及备注。


    ### 演讲者模式


    18 你可能需要从另一种语言粘贴一段话到文档中。文档的其余部分是英文，所以拼写检查遇到不熟悉的单词时会出错。高亮该段落，点击“工具 > 语言”，然后为文档的这部分选择一种语言，仅限此部分。


    ### 动态切换拼写检查中的语言


    19 LibreOffice 有一个完全独立的应用程序叫做 Math，它实际上并不是数据库软件，而是一种绘制数学方程的方法，这些方程随后可以插入到其他 LibreOffice
    软件中。如果你正在写一篇包含复杂数学公式且需要可读性的学术论文，这非常有帮助。


    ### 插入可读的公式


    20 可以在 LibreOffice 中编辑 PDF。只需使用类似 Writer 的工具将其导入，它就会将 PDF 导入 Draw 应用程序中。你可以编辑文本、更改图片，甚至更改
    PDF 的整体格式。完成后，Draw 允许你将工作文件导出为 PDF 供使用。


    ### 使用 PDF


    ## Ubuntu 应用

    ## 使用 gedit 编辑文本


    文本编辑器（又名 gedit）是 Ubuntu 操作系统和 GNOME 桌面环境的默认 GUI 文本编辑器。它兼容 UTF-8，并支持大多数标准文本编辑器功能，以及许多高级功能，如多语言拼写检查、广泛的语法高亮支持以及大量的官方和第三方插件。由于支持多种字符集，文本编辑器可以扮演多功能角色——你可以用它准备简单的笔记和文档，也可以使用其高级功能创建源代码，就像使用集成开发环境一样。gedit
    在 Ubuntu 16.04 中默认安装，可以通过 Dash 或应用程序快捷方式启动。如果你更偏于命令行，可以使用 `gedit` 命令直接与工具进行交互。


    要用 gedit 打开特定文件，请在命令行提示符输入 `gedit <文件名>`。要打开多个文件，输入 `gedit <文件名1> <文件名2>` 等。你也可以通过在路径中包含
    `+<行号>` 来打开特定行的文件，例如：`sudo gedit +21 /etc/apt/sources.list`。


    gedit 在“编辑 > 偏好”下提供了几个非常有用的选项，你可能想要查看一下。例如，gedit 会自动为你正在编辑的文件创建备份副本。然而，如果你的磁盘空间不足，可以禁用此：只需进入“编辑
    > 偏好 > 编辑器”标签并取消勾选“创建备份副本”。


    ### 了解其功能并学习其许多用途

    “高级功能包括多语言拼写检查、广泛的语法高亮支持以及大量的官方和第三方插件”


    ## Ubuntu 应用

    ## 使用 gedit 编辑文本


    ### 发现用户界面


    **新文件**

    - **新文件**：此按钮允许你在 gedit 中创建新文件。当你点击此按钮时，将创建新的标签页。保存文件时系统会提示选择位置。

    - **搜索文件**：放大镜图标允许你搜索文件，接下来的带有铅笔的图标允许将搜索到的术语替换为其他术语。

    - **保存文件**：完成文件编辑后，点击此按钮保存工作。如果是全新的文件，系统也会要求你输入位置。

    - **撤销/重做按钮**：你可以使用这些按钮撤销文件中的操作或选择重做这些操作。

    - **打开文件**：你可以从这里打开现有文件。只需点击按钮并选择你想要打开的文件。

    - **状态栏**：此栏会实时显示文件详情，如编码、当前光标位置、标签宽度等。

    - **打印文件**：此按钮允许你直接从应用程序打印文件。如果你还没有添加打印机，系统会提示你添加。

    - **编辑按钮**：你可以在这里找到编辑选项（剪切、复制和粘贴）。你也可以使用常用的快捷键（Ctrl+X, Ctrl+C 和 Ctrl+V）来完成这些操作


    ## Ubuntu 应用

    ## 使用 gedit 编辑文本


    ### 使用 gedit 处理文件


    01 我们已经看到如何通过命令行在 gedit 中打开文件了。现在让我们了解如何在 gedit 中管理文件。要在 gedit GUI 中打开一个文件或一组文件，请点击打开按钮或按
    `Ctrl+O`。在对话框中，选择所有你想要打开的文件并点击打开（图 1）。默认情况下，gedit 提供了访问你最常用文件的快捷。要打开其中之一，点击打开按钮右侧的向下箭头。一旦你选择了所需的文件，它就会在一个新的标签页中打开。


    “默认情况下，gedit 提供了访问你最常用文件的快捷。要打开其中之一，点击打开按钮右侧的向下箭头”


    02 查找工具可以帮助你在文件中定位特定的文本序列。要打开搜索窗口，点击“菜单 > 查找”，或按 `Ctrl+F`。这将把光标移动到搜索窗口的开头。在搜索窗口中输入你想要查找的文本。当你输入时，gedit
    将开始高亮匹配你输入内容的文本。你可以使用上/下方向键或按 `Ctrl+G` 滚动搜索结果。你也可以用鼠标高亮部分文本并按 `Ctrl+F`。你高亮的文本将自动出现在搜索窗口中。


    ### 语法高亮


    03 如果你想使用 gedit 进行文本编辑，你可以选择高亮你编写的代码行。gedit 使用 GtkSourceView 进行语法高亮。它使用 `.lang`
    文件来定义高亮方案。特定特定编程语言的 `.lang` 文件位于 `/usr/share/gtksourceview-3.0/language-specs/`
    文件夹中。


    你可以通过“视图 > 高亮模式”从菜单启用代码高亮，或者通过底部的状态栏启用。通过“视图”菜单启用的状态栏显示许多源、脚本、标记和科学格式的编程语言选项。


    “在文件中定位特定的文本序列”


    ### 处理文本

    **图 1 ** 使用此对话框导航到你想打开的文件


    ### 发现核心功能

    深入探索 gedit 的功能。你还可以用 gedit 打开位于其他机器上的文件。然而，在 gedit 中打开服务器上的文件之前，你需要了解有关服务器的一些技术信息。例如，你需要服务器的
    IP 地址或 URL，并可能需要它是什么类型的服务器（HTTP、FTP 等）。一旦获取了所有必要信息，进入打开对话框并点击图标输入服务器的 IP 地址/URL。选择文件并点击打开。如果你拥有权限，文件应该立即打开。


    04 插件极大增强了 gedit 的功能，可以通过“编辑 > 偏好 > 插件”访问（图 2）。预装了十多个插件并可以在这里启用/禁用。额外的插件可以通过互联网获取。这里是两个可以帮助你日常活动的插件：

    - 标签列表 (Tag List)：在侧边栏显示常用标签并允许将其插入文件。

    - 外部工具 (External Tools)：这允许用户在 gedit 内部对正在编辑的文件运行外部命令。一旦启用此插件，用户就可以从“工具”菜单中选择自定义工具。注意，这默认是不启用的。


    **图 2 ** 使用 gedit 偏好对话框启用和禁用插件**


