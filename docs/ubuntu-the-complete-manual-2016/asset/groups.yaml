    \ mail server and port (eg \n\n‘smtp.example.com’ and port 25), and the security\
    \ setting for the \n\nconnection with the server (eg ‘SSL/TLS’ and whether or\
    \ not to use \n\nsecure authentication). Fill in these details and you are good\
    \ to go. \n\n“Setting up a new account with \n\nThunderbird is easy. Start by\
    \ clicking on \n\nthe ‘Email’ link on its launch page”\n\n**Fig 1 (above)** Input\
    \ your name, address and password \n\ndetails to link a new account"
- md: "\n## Ubuntu apps\nManage your emails with Thunderbird\n\nUnified folders is\
    \ a folder pane view which resembles a global inbox account: it merges the contents\
    \ of all inbox folders (both POP, IMAP and local folders) from all accounts. It\
    \ also shows the inbox of each account as a child folder of the unified Inbox\
    \ account. Any message in an inbox shows up in both the root of the unified Inbox,\
    \ plus the child folder of the unified Inbox. Each account displays any child\
    \ folders of the inbox, only its inbox folder has been ‘moved’ away from the account.\
    \ This does not change where and how messages are stored. Unified is just another\
    \ way to view your folders at a single point.\n\nTo enable unified folders, go\
    \ to View > Folders > Unified Folders and select it. Alternately, if you don’t\
    \ want to use the feature, use View > Folders > All Folders to select a more traditional\
    \ display.\n\nMultiple mail accounts with unified folders\n\n## Extend Thunderbird\
    \ features\n\nThunderbird has an open, extensible design and program architecture.\
    \ This enables people to create add-ons for it. Most of these are distributed\
    \ via the Mozilla add-ons site, but authors can do so any way they choose. Let’s\
    \ see how to install an add-on…\n\nTo start, go to Tools > Add-ons. Click on Get\
    \ Add-ons (Fig 2). Type the name or keywords of the add-on you want in the search\
    \ field and click the magnifier icon. Then select the add-on from the list and\
    \ click ‘Add to Thunderbird’.\n\nClick on Install Now once the button is available.\
    \ Note that the add-ons from the official site (addons.mozilla.org) are reviewed\
    \ by Mozilla and are relatively safe to install. Also, if the author is verified,\
    \ the author name will be displayed. Finally, restart Thunderbird to complete\
    \ your changes.\n\nTo remove an add-on, go to Tools > Add-ons and select the add-on\
    \ to be removed from the Extensions, Themes or Plugins panel. Then click Disable\
    \ to prevent it from loading; you can also click Uninstall to completely remove\
    \ it.\n\n“Thunderbird has an open, extensible design and program architecture”\n\
    **Fig 2 (above)** Head to the Mozilla add-ons site to improve your Thunderbird\
    \ features\n\n## Ubuntu apps\nCommunicate with Empathy\n\nInstant messaging, also\
    \ abbreviated to IM, is a text-based means to communicate instantly over the Internet\
    \ and the local network. While some IM applications need you to create a new account,\
    \ others provide IM facilities by using accounts from different service providers\
    \ like Google, Yahoo, etc. IM applications can also be used to connect to chat\
    \ rooms. For the uninitiated, chat rooms are online places where like-minded people\
    \ meet to talk.\n\nIn this feature, we are going to explore Empathy. It is a messaging\
    \ program that supports text, voice, video chat, and file transfers over many\
    \ different protocols. Empathy also lets you add accounts from different services\
    \ and uses them to chat with your contacts. Based on Telepathy for protocol support\
    \ and a UI based on Gossip, Empathy is the default chat client in current versions\
    \ of GNOME (and hence Ubuntu).\n\nTo get started with Empathy simply type ‘Empathy’\
    \ in Dash. Then click on the Empathy icon to launch the application. When you\
    \ launch it for the first time, you’ll be asked to link your online accounts.\
    \ Just link your accounts and you can then easily talk to all your contacts. Using\
    \ Empathy, you can also group all the conversations in a single window, have multiple\
    \ windows for different kinds of conversations, easily search through your previous\
    \ conversations, and share your desktop in just two clicks. Now let’s learn about\
    \ Empathy in more detail.\n\n“When you launch it for the first time, you’ll be\
    \ asked to link your online accounts. Just link your accounts and you can then\
    \ easily talk to all your contacts”\nLearn how to set up and utilise Empathy text\
    \ messenger to the full\n\n### Application settings\n| Feature | Description |\n\
    | :--- | :--- |\n| Application settings | When you open Empathy, these settings\
    \ are available automatically on the top status bar. You can find various settings\
    \ related to conversations, contacts and so on here. |\n| Other settings | You\
    \ can see several other settings like sounds, calls, location, spell check, themes\
    \ and so on as different tabs under Empathy > Preferences |\n| Online accounts\
    \ | If you select Accounts in the status bar, you’ll see this open. If you click\
    \ All Settings here you’ll be taken to the System page. |\n| General settings\
    \ | You can find these under Empathy > Preferences. Under the General settings,\
    \ you can set what contacts will be visible by default and also. |\n| Contacts\
    \ list | This window displays a list of all the contacts and their current status.\
    \ To chat with anyone from this list, right-click on the contact, and select chat.\
    \ |\n| Account details | Once you’ve selected an already added account on the\
    \ left, you’ll see all the related options. You can choose to enable or disable\
    \ services here. |\n| Accounts list | You’ll see a list of accounts added to the\
    \ system. Click ‘Add account’ to add a new account. |\n| Chat window | This is\
    \ the actual chat window where you can converse with your contacts. Based on the\
    \ system capabilities, you can also chat in audio and video mode. |\n\n####01\n\
    You can add instant messaging accounts from several supported services (Fig 1).\
    \ For some account providers, these steps will also allow you to register for\
    \ a new account. To add an account, click Empathy > Accounts and then press +.\
    \ From the ‘What kind of chat account do you have?’ drop-down list, select the\
    \ type of account you wish to add. Enter the required information. For most accounts,\
    \ you will only need a login ID and a password. Some accounts may require additional\
    \ information though.\n\n 02\nAfter you have your accounts added to Empathy, the\
    \ next step is to add your contacts and manage them. To add contacts, click Chat\
    \ > Add Contact. Then from the accounts drop-down list select the account you\
    \ wish to connect to your contact. Note that your contact should be using the\
    \ same service as the account you select. First steps with Empathy Get started\
    \ with Empathy messenger Identifier field, enter your contact’s login ID, username,\
    \ screen name, or other appropriate identifier for the service type. In the Alias\
    \ field, type your contact’s name as you would like it to appear in your contact\
    \ list. Finally, click Add to add the person to your list of contacts. If one\
    \ or more of your contacts has multiple accounts with different messaging services,\
    \ you can combine these accounts into a single contact. The resulting contact\
    \ is called a meta-contact: a contact composed from different single contacts.\
    \ To link accounts press the tick button to “For most accounts, you will only\
    \ need a login ID and a password. Some accounts may require additional information\
    \ though. Finally click Add to confirm\n**Fig 1** Log in to various messaging\
    \ accounts using Empathy\n\n####03\nEmpathy supports audio and video communication\
    \ using the default GUI, however it is still dependent on the account you use\
    \ to communicate. This is because only a certain set of services support audio\
    \ and video communication. Right now only Google, Jabber and SIP accounts are\
    \ supported. Considering you are using one of the supported accounts, let’s see\
    \ how to initiate audio and video calls. To initiate a call, right-click on the\
    \ contact you want to talk to and select Audio Call or Video Call. In the next\
    \ window that opens, you’ll see the connection getting established. When the connection\
    \ is established, you will see the total conversation time at the bottom of the\
    \ window. Once you are done, end the conversation by clicking the hand up button.\n\
    \n“Empathy supports audio and video communication using the default GUI, but it\
    \ is still dependent on the account you use”\n\n####04\nTo use IRC with Empathy,\
    \ make sure you have at least one account added to Empathy already. You can then\
    \ select Rooms > Join Rooms, which will open the IRC pop-up. You can simply select\
    \ your account name from the drop-down and then fill in the room name and the\
    \ server name (Fig 2). You should now be able to chat with people in the room\
    \ you joined. Note that an IRC network may have many servers you can connect to.\
    \ When you are connected to a server on a particular network, you can communicate\
    \ IRC with Empathy with all users on all other servers on that network. You can\
    \ also add and remove servers for this network using the Add and Remove buttons.\
    \ When a server is selected, click the field under Server or Port to edit it.\
    \ Alternatively, use the left and right arrow keys to focus the field, and press\
    \ the space bar to begin editing. select entries you want to link. This will enable\
    \ selection mode and you can see a checkbox for each entry. Tick the checkboxes\
    \ that correspond to a single person’s contact entries. Finally, press Link.\n\
    \n**Fig 2 (below)** Enter your details to enter an IRC chatroom\n"
  mdcn: "\n\n## Ubuntu 应用\n使用 Thunderbird 管理您的邮件\n\n统一收件箱（Unified folders）是一种文件夹面板视图，类似于全局收件箱账户：它合并了所有账户的所有收件箱文件夹（包括\
    \ POP、IMAP 和本地文件夹）的内容。还将每个账户的收件箱作为统一收件箱账户的子文件夹显示。收件箱中的任何消息都会显示在统一收件箱的根目录以及统一收件箱的子文件夹中。每个账户显示收件箱的任何子文件夹，只有收件箱文件夹被“移动”到了账户之外。这不会改变消息存储的位置和方式。统一视图只是在单点查看文件夹的另一种方式。\n\
    \n要启用统一收件箱，请前往“查看 > 文件夹 > 统一收件箱”并选择。或者，如果您不想使用该功能，可以使用“查看 > 文件夹 > 所有文件夹”来选择更传统的显示方式。\n\
    \n带有统一收件箱的多个邮件账户\n\n## 扩展 Thunderbird 功能\n\nThunderbird 具有开放、可扩展的设计和程序架构。这使得人们为它创建插件。大部分插件通过\
    \ Mozilla 附加网站分发，但作者可以以他们选择的任何方式进行分发。让我们看看如何安装插件……\n\n首先，前往“工具 > 附加组件”。点击“获取附加组件”（图\
    \ 2）。在搜索字段中输入您想要的插件名称或关键词，然后点击放大镜图标。然后从列表中选择该插件并点击“添加到 Thunderbird”。\n\n一旦按钮可用，点击“立即安装”。请注意，来自官方网站\
    \ (addons.mozilla.org) 的插件经过了 Mozilla 的审核，安装起来相对安全。此外，如果作者经过了验证，将显示作者名称。最后，重启\
    \ Thunderbird 以完成更改。\n\n要删除插件，请前往“工具 > 附加组件”，并在“扩展”、“主题”或“插件”面板中选择要删除的插件。然后点击“禁用”以防止其加载；您也可以点击“卸载”来将其完全删除。\n\
    \n“Thunderbird 具有一个开放、可扩展的设计和程序架构”\n**图 2（上方）** 访问 Mozilla 附加网站以改进您的 Thunderbird\
    \ 功能\n\n## Ubuntu 应用\n以同理心进行交流\n\n即时消息（缩写为 IM）是一种通过互联网和本地局域网进行即时通信的基于文本的。虽然某些\
    \ IM 应用需要您创建一个新账户，但另一些则通过使用来自 Google、Yahoo 等不同服务提供者的账户提供 IM 功能。IM 应用还可以用于连接到聊天室。对于初学者来说，聊天室是志同道合的人聚在一起交流的在线场所。\n\
    \n在本特性中，我们将探索 Empathy。它是一个支持通过许多不同协议进行文本、语音、视频聊天和文件传输的消息程序。Empathy 还允许您添加来自不同服务的账户，并使用它们与您的联系人聊天。基于\
    \ Telepathy 的协议支持和基于 Gossip 的 UI，Empathy 是当前版本 GNOME（以及因此 Ubuntu）的默认聊天客户端。\n\n\
    要开始使用 Empathy，只需在 Dash（启动器）中输入“Empathy”。然后点击 Empathy 图标启动应用程序。当您首次启动它时，系统会要求您链接在线账户。只需链接您的账户，您就可以轻松地与所有联系人交流。使用\
    \ Empathy，您还可以将所有对话合并在一个窗口中，为不同类型的对话开启多个窗口，轻松搜索之前的对话，并只需点击两次即可共享您的桌面。现在让我们更详细地了解\
    \ Empathy。\n\n“当您首次启动它时，系统会要求您链接在线账户。只需链接您的账户，您就可以轻松地与所有联系人交流”\n学习如何设置并充分利用 Empathy\
    \ 文本信器\n\n### 应用设置\n| 功能 |  |\n| :--- | :--- |\n| 应用设置 | 当您打开 Empathy 时，这些设置会自动显示在顶部状态栏上。您可以在这里找到与对话、联系人等的各种设置。\
    \ |\n| 其他设置 | 您可以在 Empathy > 偏好下的不同标签页中查看声音、通话、位置、拼写检查、主题等多个其他设置。 |\n| 在线账户 |\
    \ 如果您在状态栏中选择“账户”，将打开此项。如果您在此点击“所有设置”，将带您去到系统页面。 |\n| 通用设置 | 您可以在 Empathy > 偏好中找到这些设置。在通用设置下，您可以设置默认显示哪些联系人以及等。\
    \ |\n| 联系人列表 | 此窗口显示所有联系人列表及其当前状态。要与列表中的任何人聊天，右键点击该联系人并选择“聊天”。 |\n| 账户详情 | 一旦您在左侧选择了已添加的账户，您将看到所有相关选项。您可以在此处启用或禁用服务。\
    \ |\n| 账户列表 | 您将看到已添加到系统的账户列表。点击“添加账户”添加新账户。 |\n| 聊天窗口 | 这是您与联系人交谈的实际聊天窗口。根据系统功能，您还可以在音频和视频模式下聊天。\
    \ |\n\n#### 01\n您可以从多个支持的服务中添加即时消息账户（图 1）。对于某些账户提供商，这些步骤还允许您注册新账户。要添加账户，点击 Empathy\
    \ > 账户，然后按 +。从“您有什么种的聊天账户？”下拉列表中，选择您想要添加的账户类型。输入所需信息。对于大多数账户，您只需要登录 ID 和密码。不过，某些账户可能需要额外信息。\n\
    \n 02\n在您将账户添加到 Empathy 之后，下一步是添加您的联系人并管理他们。要添加联系人，点击“聊天 > 添加联系人”。然后从账户下拉列表中选择您想要连接到该联系人的账户。请注意，您的联系人也应该使用与您选择的账户相同的服务。使用\
    \ Empathy 的第一步开始使用 Empathy 消息传递。在标识符字段中，输入联系人的登录 ID、用户名、屏幕名称或其他适用于该服务类型的适当标识符。在别名字段中，输入您希望在联系人列表中显示的联系人姓名。最后，点击“添加”将该人员添加到您的联系人列表。如果您的某一个或多个联系人具有不同消息服务的多个账户，可以将这些账户合并为一个单一联系人。生成的联系人被称为“元联系人”（meta-contact）：由不同的单一联系人组成的联系人。要链接账户，点击勾选按钮。“对于大多数账户，您只需要登录\
    \ ID 和密码。不过，某些账户可能需要额外信息。最后点击“添加”以确认\n**图 1** 使用 Empathy 登录各种消息账户\n\n#### 03\n\
    Empathy 支持使用默认 GUI 进行音频和视频通信，然而，它仍然依赖于您用于通信的账户。这是因为只有特定的服务支持音频和视频通信。目前仅支持 Google、Jabber\
    \ 和 SIP 账户。假设您正在使用支持的账户之一，让我们看看如何发起音频和视频通话。要发起通话，右键点击您想要通话的联系人并选择“音频通话”或“视频通话”。在随后打开的窗口中，您将看到正在建立连接。连接建立后，您将在窗口底部看到总通话时间。完成后，点击挂机按钮结束对话。\n\
    \n“Empathy 支持使用默认 GUI 进行音频和视频通信，然而它仍然依赖于您用于通信的账户”\n\n#### 04\n要在 Empathy 中使用 IRC，请确保您已向\
    \ Empathy 添加了至少一个账户。然后您可以选择“房间 > 加入房间”，这将打开 IRC 弹出窗口。您只需从下拉列表中选择您的账户名称，然后填写房间名称和服务器名称（图\
    \ 2）。现在您应该可以与加入房间中的人聊天了。请注意，一个 IRC 网络可能有许多您可以连接的服务器。当您连接到特定网络上的服务器时，您可以使用 Empathy\
    \ 与该网络上所有其他服务器的所有用户进行 IRC 通信。您还可以使用“添加”和“删除”按钮为此网络添加移除服务器。选择某个服务器时，点击服务器或端口下的字段进行编辑。或者，使用左右箭头键聚焦字段，并按空格键开始编辑。选择您想要链接的条目。这将启用选择模式，您可以看到每个条目对应的复选框。勾选对应于同一个联系人条目的复选框。最后，按“链接”。\n\
    \n**图 2（下方）** 输入您的详情以进入 IRC 聊天室\n\n"
