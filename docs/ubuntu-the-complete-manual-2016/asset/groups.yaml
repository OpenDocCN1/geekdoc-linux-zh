  - "[PAGE 62]\n\n![](img/a6bf9da4751f37b25a0d6611dc73918d_62_0.png)\n\nUse GNOME\
    \ Terminal & Xterm\n\n**63**\n\n**01**\n\nEvery Linux distribution uses Bash (Bourne\\\
    -again shell) in text mode and \n\ngraphical mode within a terminal emulator,\
    \ including Xterm and GNOME \n\nTerminal. Bash has a very rich set of supported\
    \ commands, but the most useful \n\nfeature comes from its popularity; all Linux\
    \ users use their terminals with the \n\nsame syntax. However, there are other\
    \ shells – such as a highly customisable ZSH \n\nwith an even wider feature set,\
    \ or CSH with a built\\-in scripting language – that \n\nhave similarities with\
    \ the C language. To change the default shell from Bash to \n\nsomething else\
    \ in GNOME Terminal, go to Edit\\>Profile Preferences, switch to the \n\nTitle\
    \ and Command tab, enable the ‘Run a custom command instead of my shell’ \n\n\
    option and put the name of your desired shell in the Custom Command field.\n\n\
    Change Bash to something else\n\n**02**\n\nLet’s make the GNOME Terminal look\
    \ a little more personal by changing \n\ntext font, colour and background (Fig\
