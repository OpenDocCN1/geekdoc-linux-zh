  md: "![](img/a6bf9da4751f37b25a0d6611dc73918d_53_0.png)\n\nGet to grips with the\
    \ Linux command line\n\nGet to grips \n\nwith the Linux \n\ncommand line\n\nWell-chosen\
    \ words can save you jumping through \n\nGUI hoops, so ensure you use the right\
    \ commands\n\nThe command line may be an older interface, but the reason \n\n\
    it’s survived is the power to tell the computer, in a few apposite \n\ncommands,\
    \ exactly what you want. For example, a single command \n\ncan copy all of the\
    \ MP3 and MP4 i les in a directory to a backup \n\ndisk or a machine elsewhere\
    \ on the network – or anywhere else on \n\nthe Internet.\n\nMany people’s i rst\
    \ encounter with a computer – perhaps at \n\nuniversity in the 1970s or 1980s\
    \ – was seated at a dumb terminal, \n\nknown as a console, connected to a distant,\
    \ and very large, \n\ncomputer. Nowadays, computers can be the size of a credit\
    \ \n\ncard – like the Raspberry Pi – but the old-fashioned terminal is \n\nremembered\
    \ in the form of the terminal program that gives you a \n\ncommand-line interface\
    \ to Ubuntu.\n\nDepending on which l avour of Ubuntu you are running, the \n\n\
    terminal may have a dif erent name, but type ‘term’ into the app \n\nsearch of\
    \ Unity Shell, or your menu, and you will bring up at least \n\none choice of\
    \ terminal. Open this up and you should see a fairly \n\nempty-looking window.\
    \ Don’t be scared of that blinking cursor – \n\nusually the ‘$’ sign, known as\
    \ the ‘dollar prompt’. It’s waiting to do \n\nwhatever you tell it. You just need\
    \ to know the right words – or \n\ncommands – to get it going. \n\nHere’s an easy\
    \ one for you to try i rst: type evince into the \n\nterminal - we’ll put the\
    \ instructions you need to type into bold, so \n\nyou can see commands more clearly;\
    \ always press Enter afterwards, \n\nto let Ubuntu know it’s now got to do something.\
    \ \n\nProvided you didn’t mistype, you’ll have just opened Ubuntu’s \n\nPDF reader,\
    \ without using a GUI menu or shortcut item.\n\n**54**\n\n**Ubuntu essentials**"
