    \ be run in a \n\nvirtual machine on your computer. In this way, you’ll be able\
    \ to try \n\nLinux without even restarting your computer, although you should\
    \ \n\nnote that virtual machines are slower than running the operating \n\nsystem\
    \ on your computer itself. \n\nTo create an Ubuntu virtual machine, irst you need\
    \ to \n\ndownload and install VirtualBox. Create a new virtual machine \n\nwith\
    \ it, select the Ubuntu operating system, and provide the ISO \n\nile you downloaded\
    \ from Ubuntu’s website when prompted. \n\nThe installation process is pretty\
    \ self-explanatory and you can go \n\nthrough it in the virtual machine as if\
    \ you were installing Ubuntu on \n\na real computer.\n\n“You’ll be able to try\
    \ Linux without even \n\nrestarting your computer”\n\n**Fig 3 (below)** Install\
    \ Ubuntu or try it \n\nout with the trial version"
