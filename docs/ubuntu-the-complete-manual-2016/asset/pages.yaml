    \ support \n\naudio and video communication. \n\nRight now only Google, Jabber\
    \ \n\nand SIP accounts are supported. \n\nConsidering you are using one of the\
    \ \n\nsupported accounts, let’s see how to \n\ninitiate audio and video calls.\
    \ \n\nTo initiate a call, right\\-click on \n\nthe contact you want to talk to\
    \ and \n\nselect Audio Call or Video Call. In the \n\nnext window that opens,\
    \ you’ll see \n\nthe connection getting established. \n\nWhen the connection is\
    \ established, \n\nyou will see the total conversation \n\ntime at the bottom\
    \ of the window. \n\nOnce you are done, end the \n\nconversation by clicking the hand\
    \ \n\nup button.\n\nAudio and video \n\ncommunication\n\n**04**\n\nTo use IRC\
    \ with Empathy, make \n\nsure you have at least one \n\naccount added to Empathy\
    \ already. \n\nYou can then select Rooms\\>Join \n\nRooms, which will open the\
    \ IRC \n\npop\\-up. You can simply select your \n\naccount name from the drop\\\
    -down \n\nand then fill in the room name and \n\nthe server name (Fig 2). You\
    \ should \n\nnow be able to chat with people in \n\nthe room you joined. Note\
    \ that an \n\nIRC network may have many servers \n\nyou can connect to. When you\
    \ are \n\nconnected to a server on a particular \n\nnetwork, you can communicate\
    \ \n\nIRC with Empathy\n\nselect entries you want to link. This will \n\nenable selection\
    \ mode and you can \n\nsee a checkbox for each entry. Tick \n\nthe checkboxes\
