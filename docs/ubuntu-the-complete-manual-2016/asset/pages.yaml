  md: "![](img/a6bf9da4751f37b25a0d6611dc73918d_26_0.png)\n\nCustomising the desktop\n\
    \n**27**\n\n**Unity Tweak Tool**\n\nIt’s not included right out of the \n\nbox,\
    \ but it is instantly available in \n\nthe standard Ubuntu online repos-\n\nitory.\
    \ Get it with $ sudo apt-get \n\ninstall unity-tweak-tool\n\n**Appearance settings**\n\
    \nHere you can change GTK style, \n\nwindow decoration theme \n\nand fonts separately,\
    \ change \n\nmouse cursor look and move \n\nwindow buttons to another \n\nedge\
    \ of a window\n\n**Change specific **\n\n**settings**\n\nUnity is made up of various\
    \ \n\ndifferent elements, including \n\nthe main taskbar which is along \n\nthe\
    \ right side of the screen, \n\nthe main menu with a search \n\nfeature (Dash),\
    \ the top panel \n\nand the task switcher\n\n**System settings**\n\nUnity Tweak\
    \ Tool offers \n\nadvanced system settings, eg \n\nenabling desktop icons, extra\
    \ \n\nsecurity measures, control \n\nover scroll bars as well as \n\nmouse behaviour\n\
    \n**Window manager**\n\nThere are ways to can change \n\nthe behaviour of window\
    \ \n\nmanager in Unity. Shadows, \n\ntranslucency, animations, hot \n\ncorners,\
    \ snapping, focusing \n\nrules, etc\n\n**A Register Editor **\n\n**for Ubuntu**\n\
    \nUse the command $ sudo \n\napt-get install dconf-\n\neditor to install a twin\
    \ panel \n\nsettings manager. It behaves \n\nsimilarly to the Register Editor\
    \ \n\nin Windows OS and lets you \n\nadjust many hidden settings\n\n**Default\
    \ wallpaper**\n\nYou can set the default Ubuntu \n\nwallpaper to a photo (or maybe\
    \ \n\na drawing) of your choice in \n\nthe Appearance section of the \n\nstandard\
    \ System Settings\n\n**Change the theme**\n\nThis defines how various \n\nUI controls\
    \ look, and this \n\nincludes buttons, scroll bars, \n\nmenu background, window\
    \ \n\ndecorations and lots of \n\nother details\n\n“With so many people with so\
    \ many diferent tastes, Unity \n\nallows all essential features, such as appearance\
    \ and behaviour \n\nof the desktop, to be customised”\n\n**Ubuntu essentials**\n\
    \nTweak desktop settings Use related sections in Ubuntu’s System Settings app"
