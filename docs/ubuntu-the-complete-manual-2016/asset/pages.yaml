  md: "![](img/a6bf9da4751f37b25a0d6611dc73918d_2_0.png)\n\nWelcome to\n\nMany people\
    \ who want to make the move from \n\nWindows to a Linux distribution choose Ubuntu\
    \ as \n\ntheir first step. It provides a clean, attractive GUI with \n\nUnity,\
    \ and usability by the bucket-load. It is the perfect \n\nenvironment in which\
    \ to begin learning about the \n\ncommand line and creating a more customisable\
    \ \n\nworkspace. Meanwhile you still get many of the \n\nbenefits you are used\
    \ to in Windows and other \n\ndesktop systems. This book serves as an introduction\
    \ \n\nto the beauty and power of Ubuntu. From the default \n\nsoftware to the\
    \ best FOSS apps to download from \n\nthe Software Centre, we’ll tour the top\
    \ programs and \n\napplications, so soon you’ll be flying with Ubuntu.\n\n**Ubuntu**\n\
    \n**The Complete Manual**"
