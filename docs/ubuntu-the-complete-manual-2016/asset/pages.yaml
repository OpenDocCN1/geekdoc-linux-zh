  md: "![](img/a6bf9da4751f37b25a0d6611dc73918d_81_0.png)\n\n**Ubuntu essentials**\n\
    \n**82**\n\nConfigure network connections\n\nConfigure \n\nnetwork \n\nconnections\n\
    \nSetting up a network connection in Ubuntu is easy\n\nThose who only need to\
    \ plug their Ethernet cable into their \n\ncomputer’s network port in order to\
    \ have an instant access to \n\nthe Internet can skip this section (perhaps those\
    \ running Ubuntu \n\ninside a virtual environment can do that too). The majority\
    \ of \n\nLinux newbies, however, often need assistance in connecting \n\nto the\
    \ Internet or changing their network parameters. During \n\nthe last decade, almost\
    \ every Linux distribution has relied on \n\nNetworkManager – a stable, feature-rich\
    \ and intuitive network \n\nhandler for Linux. The Unity desktop in Ubuntu has\
    \ a tight \n\nintegration with NetworkManager by of ering a network indicator\
    \ \n\non the top bar and a standalone graphical utility called Network (Fig \n\
    \n1). You can search for it in Dash, open it as a subsection in System \n\nSettings\
    \ or launch from command line ($ unity-control-center \n\nnetwork). Both wired\
    \ and wireless network connections can be \n\nadded and modii ed or even removed\
    \ here.\n\n**Fig 1 (right)** Configure wired and non-\n\nwired network connections"
