    \ distributions. \n\nFor regular users and novices, it can be dif cult to comprehend\
    \ \n\njust how powerful LibreOf ce can be. It can be easy to get stuck in \n\n\
    a rut and not make the most of what it has to of er. For example, \n\non a day\\\
    -to\\-day basis, you may have no call to use macros, creating \n\nindexes or doing\
    \ a mail merge with Writer. But these features can \n\nvastly improve your productivity\
    \ and ef ciency (Fig 1).\n\nOver the next few pages, we are going to highlight\
