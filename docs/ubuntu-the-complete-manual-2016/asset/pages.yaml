    \ Xterm\n\nUse GNOME \n\nTerminal & \n\nXterm\n\nExplore the basics and benei\
    \ ts of the terminal \n\nemulators in Ubuntu\n\nUbuntu ships with two terminal\
    \ emulators. One is GNOME Terminal, \n\na widely used program and probably the\
    \ only known terminal \n\napplication for many Ubuntu users. GNOME Terminal is\
    \ one of many \n\nGTK-based apps that Unity desktop shares with GNOME Shell –\
