    \nall, or any combination of \n\nservices by adding respective \n\nentries in\
    \ Online Accounts. As \n\nwith Google, in most cases \n\nyou are required to pass\
    \ an \n\nauthentication routine and \n\ngrant access to your data \n\n(Fig 2).\
