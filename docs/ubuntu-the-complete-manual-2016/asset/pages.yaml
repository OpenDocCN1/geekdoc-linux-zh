    20 LibreOffice essentials\n\n**109**\n\n“For regular users \n\nand novices, it\
    \ \n\ncan be dif cult \n\nto comprehend \n\njust how powerful \n\nLibreOf ce can\
    \ be”\n\n**01**\n\nPerhaps you are looking to introduce greater readability or\
    \ to make sure \n\nyour document prints exactly how you want it to. Either way,\
    \ the way \n\nforward is in formatting the text. At first it can be a tricky to\
    \ figure out why certain \n\nsections of text look how they do, so head to the\
    \ formatting section to figure it \n\nout and make changes. On the toolbar is\
    \ a symbol that looks like a backwards P – \n\nclick that to reveal live formatting\
    \ symbols, such as rogue paragraph breaks. \n\nBring up formatting options\n\n\
    **02**\n\nCreating a list of bullet points \n\nis fairly easy; click the type\
    \ \n\nwith dots or numbers and go. You \n\ncan change the formatting of these\
    \ \n\nbullet points to be different symbols \n\nor letters instead of numbers.\
    \ You can, \n\nhowever, also create nested lists by \n\nusing the Tab key to create\
    \ sub lists, \n\nand then press Shift+Tab to go back to \n\nthe standard list.\n\
    \nBetter bullet points\n\n**03**\n\nGenerally in Linux, you can use \n\nCtrl+Shift+V\
    \ to paste text and \n\nremove its formatting at the same \n\ntime. If you use\
    \ this in Writer, or find \n\nPaste Special in the Edit menu, you \n\nthen have\
    \ several options of how to \n\npaste the text (Fig 2). One of these \n\nis unformatted,\
    \ but it also allows \n\nfor other methods, such as using \n\nLibreOffice formatting.\n\
    \nPaste unformatted text\n\nWriter\n\n**Fig 2 **The Paste Special function offers\
    \ \n\noptions for paste formatting"
