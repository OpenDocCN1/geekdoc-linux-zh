  md: "![](img/a6bf9da4751f37b25a0d6611dc73918d_86_0.png)\n\n**Ubuntu essentials**\n\
    \n**87**\n\nUse System Monitor\n\nControl resources usage\n\nThe Resources tab\
    \ ofers efective graphs that get \n\nupdated in real time (Fig 1). The irst graph\
    \ shows \n\nCPU History in live mode (there is no delay in data \n\nupdate by\
    \ default), showing CPU cores in diferent \n\ncolours. When you launch a heavyweight\
    \ \n\napplication you’ll notice peaks on that graph. \n\nYou can also igure out\
    \ whether an application \n\ncan use several CPU cores at once, or if pushes \n\
    \nall of the load on one core. The middle graph \n\nis for Memory and Swap Usage.\
    \ On modern \n\nsystems, swapping to a ile or to a separate Swap \n\npartition\
    \ is rarely used in everyday tasks, simply \n\nbecause there is already suicient\
    \ RAM. However, \n\nprocessing large iles (like retouching a giant \n\nposter\
    \ in GIMP) may require swapping, which only \n\ntakes place when your system is\
    \ running low on \n\navailable RAM. The inal graph, Network History, \n\nshows\
    \ the network speeds for both downloading \n\nand uploading. This graph can be\
    \ particularly \n\nhelpful for network troubleshooting and low \n\nInternet speed\
    \ diagnostics. Both memory and \n\nnetwork history graphs help you monitor your\
    \ \n\nsystem’s performance.\n\n**Fig 1 **Graphs help visualise performance data"
