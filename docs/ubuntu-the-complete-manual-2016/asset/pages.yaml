  md: "![](img/a6bf9da4751f37b25a0d6611dc73918d_36_0.png)\n\n**37**\n\n**Fig 2 (above)**\
    \ Get root privileges by \n\nusing the ‘sudo’ prefix\n\n**04**\n\nThe ‘sudo’ is\
    \ a command that you can put before another command in \n\norder to make it run\
    \ with root privileges (Fig 2). You can use sudo anytime \n\nand for any command\
    \ but practically you only need to do so if you haven’t got \n\nenough permissions\
    \ with your regular user account – for managing printers, or \n\nin case you need\
    \ to write a file into a directory outside your home for example. \n\nUbuntu comes\
    \ with sudo enabled by default, which lets you run any command, \n\nbut requires\
    \ entering your current password (not the root password, root is \n\ndisabled\
    \ in Ubuntu by default). You can change the sudo settings by issuing the $ \n\n\
    sudo visudo command, which will open the /etc/sudoers file in the Nano editor.\
    \ \n\nYou can discover the magic of sudo with $ man sudo, but there are also instant\
    \ \n\nsolutions you can use by changing the following line:\n\n username ALL=(ALL)\
    \ ALL\n\nto the one below:\n\n username ALL=(ALL) NOPASSWD: ALL\n\nto stop sudo\
    \ asking for a password.\n\nConfigure ‘sudo’\n\nTweak your security settings\n\
    \n**Ubuntu essentials**"
