  md: "![](img/a6bf9da4751f37b25a0d6611dc73918d_75_0.png)\n\n**Ubuntu essentials**\n\
    \n**76**\n\nUse the Disk Usage Analyzer\n\nUse the Disk \n\nUsage Analyzer\n\n\
    Find out where your free disk space went with a \n\nspecialised accessory\n\n\
    Files and directories tend to grow and occupy a large amount \n\nof disk space.\
    \ These days even a couple of terabytes will run low \n\nwhen you decide to keep\
    \ your movie collection there. Sometimes \n\nyou don’t pay enough attention to\
    \ how much you are actually \n\ndownloading, copying or storing, meaning that\
    \ your hard drive \n\ngets cluttered with lots of i les, draining your free space.\
    \ Disk \n\nUsage Analyzer, also known as Baobab, is a tool that comes within \n\
    \na standard Ubuntu desktop. It analyses any directory you throw \n\nat it and\
    \ shows a colourful ring chart, where the size of each slice \n\ncorresponds to\
    \ a size of the respective subdirectory (Fig 1). This is \n\na beautiful graphical\
    \ representation with instant usefulness, letting \n\nyou know what on your drive\
    \ is using the most space. Sometimes it \n\ncan be as simple as an overi lled\
    \ temporary directory, or a giant log \n\ni le, or just your media library that\
    \ grew too fast.\n\nGet instant results\n\nLaunch Disk Usage Analyzer by searching\
    \ for this name or ‘Baobab’ \n\nin Ubuntu Dash. After it launches, you will be\
    \ presented with a list \n\nof devices and locations. If a drive is mounted, it\
    \ will be included in \n\nthe statistics of your root partition. For example,\
    \ if you mount a 4TB \n\ndrive within a relatively small root partition (say,\
    \ 20GB), the resulting \n\nring chart will show your system directories within\
    \ a hair\\-thin slice. \n\nFor that reason, you will need to unmount any external\
    \ media if you \n\nwant to analyse what Ubuntu itself consists of. To get a structure\
    \ \n\nof your home directory simply click its icon and wait while until \n\nDisk\
    \ Usage Analyzer completes its job – this can take some time \n\ndepending on\
    \ how many i les there are.\n\n“This is a beautiful graphical \n\nrepresentation\
    \ with instant usefulness”"
