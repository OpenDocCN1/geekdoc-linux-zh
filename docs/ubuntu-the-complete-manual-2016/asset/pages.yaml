  md: "![](img/a6bf9da4751f37b25a0d6611dc73918d_62_0.png)\n\nUse GNOME Terminal &\
    \ Xterm\n\n**63**\n\n**01**\n\nEvery Linux distribution uses Bash (Bourne\\-again\
    \ shell) in text mode and \n\ngraphical mode within a terminal emulator, including\
    \ Xterm and GNOME \n\nTerminal. Bash has a very rich set of supported commands,\
    \ but the most useful \n\nfeature comes from its popularity; all Linux users use\
    \ their terminals with the \n\nsame syntax. However, there are other shells –\
    \ such as a highly customisable ZSH \n\nwith an even wider feature set, or CSH\
    \ with a built\\-in scripting language – that \n\nhave similarities with the C\
    \ language. To change the default shell from Bash to \n\nsomething else in GNOME\
    \ Terminal, go to Edit\\>Profile Preferences, switch to the \n\nTitle and Command\
    \ tab, enable the ‘Run a custom command instead of my shell’ \n\noption and put\
    \ the name of your desired shell in the Custom Command field.\n\nChange Bash to\
    \ something else\n\n**02**\n\nLet’s make the GNOME Terminal look a little more\
    \ personal by changing \n\ntext font, colour and background (Fig 1). Go to Edit\\\
    >Profile Preferences and \n\nswitch to the Colors tab. Uncheck the ‘Use colors\
    \ from my system theme’ option \n\nand choose any combination of colours for text,\
    \ text in bold and background. \n\nThere is a list of good presets in the ‘Built\\\
    -in schemes’ drop\\-down menu; it can \n\nsave you from an agony of choosing.\
    \ To change the font itself, go to the General \n\ntab and uncheck the ‘Use the\
    \ system fixed width font’. After that, you’ll be able to \n\nselect another Mono\
    \ font.\n\nChange fonts, colours and background\n\n**Fig 1 (above)** Personalise\
    \ your \n\nGNOME Terminal by adding colour\n\n**Ubuntu essentials**"
