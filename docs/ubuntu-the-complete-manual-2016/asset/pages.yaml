  md: "![](img/a6bf9da4751f37b25a0d6611dc73918d_20_0.png)\n\n**Ubuntu essentials**\n\
    \nNavigate the Ubuntu desktop\n\n**21**\n\n**The Dash**\n\nUnity’s start menu\
    \ is keyboard-driven \n\nand opening it in this way can save time. \n\nSavvy users\
    \ will open it using the Windows \n\nkey on their keyboard. You can get a real\
    \ \n\nproductivity boost by following it up with a \n\nfew characters describing\
    \ the app you are \n\nlooking for, for example by entering ‘Thun’ \n\nafter tapping\
    \ the Windows key virtually \n\nensures that the Thunderbird icon appears \n\n\
    right in the middle of the application list\n\n**The menu bar**\n\nMove your mouse\
    \ cursor \n\nup to the very top of the \n\nscreen to enable the menu \n\ndisplay.\
    \ This is a really \n\nhelpful tool for accessibility \n\nas less dexterity is\
    \ required \n\nto complete it. Simply flick \n\nthe cursor to the top of the \n\
    \nscreen and let Unity take \n\ncare of any overshoot\n\n**Wallpaper**\n\nAs with\
    \ practically any \n\nother distro or OS, your \n\nwallpaper is a blank \n\ncanvas\
    \ to put your own \n\nstamp on. The default \n\nUbuntu offering isn’t too \n\n\
    shabby, though\n\n**The indicator menu**\n\nUbuntu will display symbols \n\nalerting\
    \ you about any events \n\nand/or important system \n\nstate changes that are\
    \ taking \n\nplace or need your attention. \n\nClick on any of these icons \n\n\
    when they appear to reveal \n\na short menu providing you \n\nwith further options\
    \ about the \n\nsituation at hand\n\n**The keyboard **\n\n**cheatsheet**\n\nUnity\
    \ comes with a set of helpful \n\nkeyboard shortcuts that increase \n\nproductivity\
    \ and get things done \n\nfaster. Press and hold on the \n\nWindows key to display\
    \ a list of \n\nshortcuts in the middle of the screen \n\nthat is currently active\n\
    \n**Active workspace **\n\nFront and centre is the window you’re \n\nworking on.\
    \ To switch to another without \n\nclosing the current window, just click on \n\
    \nor search for the app you want to open \n\nnext. It can be minimised if you\
    \ hover at \n\nthe top of the window – the classic three \n\nbuttons will appear\
    \ with options to close, \n\nminimise or maximise. Be aware that \n\nclicking\
