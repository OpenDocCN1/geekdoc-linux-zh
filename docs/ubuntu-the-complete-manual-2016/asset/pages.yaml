  md: "![](img/a6bf9da4751f37b25a0d6611dc73918d_41_0.png)\n\nUnderstanding the file\
    \ system\n\nUnderstanding \n\nthe file system\n\nLearn about the i le system in\
    \ Ubuntu to keep \n\neverything organised\n\nOne of the most complex things about\
    \ any Linux-based computer \n\nis probably its i le system. There are so many\
    \ i les and folders that \n\nserve so many dif erent purposes. To a newcomer just\
    \ getting \n\nstarted with Linux, all this appears like a huge maze. This calls\
    \ for a \n\nbasic, yet clear understanding of how i les and folders are organised\
    \ \n\nin Linux, and specii cally Ubuntu. This is exactly what we are going \n\n\
    to do in this guide. Let’s start with the basics.\n\nUbuntu (like all Unix-like\
    \ systems) organises i les in a hierarchical \n\ntree, where relationships are\
    \ thought of in terms of child and \n\nparent. Directories can contain other directories\
    \ as well as regular \n\ni les. Any element of the tree can be referenced by a\
    \ path name \n\n– absolute or relative. An absolute path name starts with the\
    \ \n\ncharacter ‘/’ (identifying the root directory, which contains all \n\nother\
    \ directories and i les), then every child directory that must be \n\ntraversed\
    \ to reach the element is listed, each separated by a ‘/’ sign. \n\nA relative\
    \ path name is one that doesn’t start with ‘/’; in that case, \n\nthe directory\
    \ tree is traversed starting from a given point, which \n\nchanges depending on\
    \ context, called the current directory. The \n\nfact that all i les and directories\
    \ have a common root means that, \n\neven if several dif erent storage devices\
    \ are present on the system, \n\nthey are all seen as directories somewhere in\
    \ the tree, once they are \n\nmounted to the desired place.\n\n“There are so many\
    \ i les and folders that \n\nserve so many dif erent purposes. To \n\na newcomer\
    \ just getting started with \n\nLinux, all this appears like a huge maze”\n\n\
    **42**\n\n**Ubuntu essentials**"
