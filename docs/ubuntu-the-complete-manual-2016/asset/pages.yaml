    \ windows, menus and toolbars that you \n\nclick to get things done.\n\nCommand-line\
    \ interface (CLI): The terminal is Ubuntu’s CLI. It \n\ncan be considered as a\
    \ method for controlling some aspects of \n\nUbuntu using only commands that you\
    \ type on the keyboard. Even \n\nthough users are able to perform most day-to-day\
    \ activities without \n\never opening a terminal, it is considered to be very\
    \ powerful tool \n\nand is therefore well worth investigating. With it, you will\
    \ be able to \n\nperform many useful tasks. \n\nTroubleshooting tasks: If you\
    \ face any diiculties while using \n\nUbuntu, you may need to use the terminal.\
    \ If you need to perform \n\noperations on multiple iles at the same time, then\
    \ the terminal \n\nis the preferred method. System administration and software\
    \ \n\ndevelopment skills can be signiicantly improved by having a good \n\nunderstanding\
    \ of the CLI. A terminal can be opened either by \n\nhitting Alt+Ctrl+T or by\
    \ right-clicking on the desktop and selecting \n\n‘Terminal’ from the menu.\n\n\
    Please note that all the commands in the terminal follow the \n\nsame approach:\
    \ you can type the command, possibly followed"
