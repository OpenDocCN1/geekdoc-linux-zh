  md: "![](img/a6bf9da4751f37b25a0d6611dc73918d_37_0.png)\n\nFind your way around\
    \ Dash\n\nFind your way \n\naround Dash\n\nThe nerve centre of the desktop, these\
    \ essential tips \n\nand tricks will have you using Dash like a pro\n\nIt is very\
    \ common for people switching from a Windows platform \n\nto a Linux system to\
    \ look for the ever-popular Start menu. Generally, \n\nthe Start menu serves as\
    \ the starting point of your interaction \n\nwith the computer, and once you get\
    \ used to it, it feels like the \n\nmost natural way to work on the computer.\
    \ Thankfully, Unity – the \n\nstandard desktop environment for Ubuntu systems\
    \ – of ers Dash.\n\nThink of Dash as the equivalent Start menu of your Ubuntu\
    \ system. \n\nDash allows you to search for applications, i les, music and videos,\
    \ \n\nand shows you items that you have recently used. Dash also helps \n\nyou\
    \ to launch application and i le shortcuts. \n\nTo start Dash, simply click on\
    \ the Ubuntu logo on the top-left \n\nportion of the menu bar. You can also press\
    \ the super key on your \n\nkeyboard (marked with the Windows logo) to launch\
    \ it. To exit Dash, \n\nall you need to do is click the ‘esc’ button. \n\nDash\
    \ segregates the search results as a series of scopes (or lenses). \n\nThese are\
    \ used to provide views to your i les, folders, applications \n\nand data. There\
    \ are a few basic scopes installed by default with an \n\noption to disable them.\
    \ Switching of a scope means you won’t \n\nsee any results from that scope in\
    \ your search results. With so many \n\nconi gurable features, it is evident that\
    \ Dash is more than a search \n\nbox for i nding i les, but rather it provides\
    \ a view of the whole \n\noperating system.\n\n“Generally, the Start menu serves\
    \ as the \n\nstarting point of your interaction with the \n\ncomputer, and once\
    \ you get used to it, it \n\nfeels like the most natural way to work”\n\n**Ubuntu\
    \ essentials**\n\n**38**"
