  md: "![](img/a6bf9da4751f37b25a0d6611dc73918d_33_0.png)\n\nTweak your security settings\n\
    \nTweak your \n\nsecurity settings\n\nMake sure your Ubuntu setup provides proper\
    \ \n\nprivacy protection\n\nPrivacy is a cornerstone of secure computing. Your\
    \ data should \n\nbe protected, your computer should prevent unauthorised access\
    \ \n\nand you should be aware of the personal data that’s sent from \n\nyour system\
    \ to remote servers. Ubuntu provides a good balance \n\nbetween usability and\
    \ security. For example you cannot log in to \n\nUnity directly; instead you can\
    \ actually use the ‘sudo’ prei x to run \n\ncommands as an administrator. For\
    \ regular desktop activities there \n\nis the System Settings\\>Security & Privacy\
    \ subsection, where you can \n\nchange many settings. Most relate to password\
    \ protection, keeping \n\nlogs and history for i les and applications, online\
    \ search results in \n\nUbuntu Dash and diagnostics information that Canonical\
    \ would \n\nuse to i x bugs and collect users’ statistics. The reasons as to why\
    \ \n\nyou may want to change anything may vary. Maybe you don’t want \n\nothers\
    \ to see what you have been using recently or maybe online \n\nsearch results\
    \ in Dash distract you. There is another security setting \n\nin Ubuntu outside\
    \ its System Settings shell. When you launch \n\nFirefox for the i rst time it\
    \ asks you to choose what data you’d like to \n\nshare. By default Firefox sends\
    \ crash and help reports to Mozilla, but \n\nyou still decide and approve them.\n\
    \n**01**\n\nThere is no sense in setting your Ubuntu password as something simple\
    \ \n\nsuch as 12345678 or P@ssw0rd. It is sensible to invent a combination of\
    \ \n\nsymbols that is unique, complex, long enough and most importantly something\
    \ \n\nthat you are sure you will not forget. A good password contains lower and\
    \ \n\nuppercase letters, special characters and digits. Thankfully, Ubuntu can\
    \ help you \n\ndeal better with stronger passwords via the APG utility. Install\
    \ it with $ sudo \n\napt-get install apg and run simply with $ apg. APG will prompt\
    \ you to \n\nenter a random word of your choosing, and then converts your suggestion\
    \ into a \n\nstronger combination of characters, but still something readable\
    \ and not too hard \n\nto remember by heart, such as WoudElIc6 (Woud\\-El\\-Ic\\\
    -SIX).\n\nGenerate a stronger password\n\n**34**\n\n**Ubuntu essentials**"
