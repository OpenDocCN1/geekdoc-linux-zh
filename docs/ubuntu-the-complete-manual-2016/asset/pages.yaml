  md: "![](img/a6bf9da4751f37b25a0d6611dc73918d_68_0.png)\n\nSecure files with Déjà\
    \ Dup\n\n**69**\n\n**Ubuntu essentials**\n\n**04**\n\nDéjà Dup has a limitation:\
    \ \n\nit is an ‘all or nothing’ tool, \n\nmeaning that you can’t extract \n\n\
    selected files and directories. Instead \n\nyou are forced to copy or download\
    \ \n\nthe entire backup snapshot. To solve \n\nthis issue, use the ‘Restore missing\
    \ files’ \n\nitem in the Nautilus context menu (Fig \n\n1). This works for directories\
    \ included \n\nin the backup and lets you restore \n\nindividual files. Déjà Dup\
    \ is a front\\-end \n\nto the Duplicity utility, and this lets \n\nyou extract\
    \ your backup snapshot \n\nwithout launching Déjà Dup at all. It \n\ncan be useful\
    \ for scripting, or maybe \n\nwhen you access your backup location \n\nremotely\
    \ via SSH. The syntax for \n\nextracting is as follows:\n\n  $ duplicity restore\
    \ \n\n\\--no-encryption “file:///\n\n  path/to/ snapshot” “/where/\n\nto/extract”\
    \ \n\nThe Duplicity syntax also can extract \n\nindividual backed up items (see\
    \ $ \n\nduplicity --help).\n\nAccess a backup copy \n\n**05**\n\nThe simplest\
    \ way is to use \n\nyour Dropbox, MEGASync or \n\nother cloud\\-synced directory\
    \ as the \n\nbackup location. This way, your data \n\nwill be uploaded to the\
    \ cloud once \n\nDéjà Dup finishes its job. However, let’s \n\ndo direct online\
    \ backups, such as to \n\nthe Amazon S3 cloud (Fig 2). To make \n\nit happen,\
    \ you only need a proper \n\naccount at Amazon and a few extra \n\npackages. The\
    \ command is as follows:\n\n  $ sudo apt-get install \n\npython-boto python-\n\
    \ncloudfiles\n\nAfter that, the list of available storage \n\nlocations will be\
    \ complemented by \n\nAmazon S3 and Rackspace cloud.\n\nBack up to the cloud\n\
    \n“Déjà Dup has a \n\nlimitation: it is an ‘all \n\nor nothing’ tool”\n\n**Fig\
    \ 2 (below)** Manage your backup \n\nlocation easily"
