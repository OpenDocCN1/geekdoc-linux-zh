  md: "![](img/a6bf9da4751f37b25a0d6611dc73918d_8_0.png)\n\n**Getting started**\n\n\
    Get to know Ubuntu\n\n**9**\n\n**Fig 2 (above) **If successful, you will be presented\
    \ with the standard Ubuntu desktop\n\nAs a newcomer to Ubuntu, \n\nyou will be\
    \ able to try it out \n\nbefore installing it. This can \n\nbe done using either\
    \ an \n\nUbuntu DVD in the drive or a \n\nUSB stick with Ubuntu on it \n\nin a\
    \ USB port.\n\n**01** If using a DVD, put the \n\nUbuntu DVD into the drive \n\
    \nand restart the computer. \n\nYou will see a welcome \n\nscreen which prompts\
    \ you to \n\nselect your chosen language. \n\nThere will also be an option \n\n\
    to install Ubuntu or try it \n\nfrom the DVD.\n\n**02** If you want to use a \n\
    \nUSB drive, note that the \n\nlatest computers can start \n\nup from a USB stick.\
    \ Here \n\nyou’ll also see a welcome \n\nscreen that prompts you to \n\nchoose\
    \ a language and gives \n\nan option to either install \n\nUbuntu or try it from\
    \ the \n\nUSB stick.\n\n**03** Irrespective of whether \n\nyou are using the DVD\
    \ \n\nor USB stick method, the \n\nnext step is to select your \n\npreferred language\
    \ and then \n\nclick on ‘Try Ubuntu’. Your \n\nlive desktop will then appear \n\
    \n(as shown in the picture seen \n\nto the left, Fig 2).\n\n**04** As a final\
    \ step, when you \n\nare ready to install Ubuntu, \n\nyou just need to double-click\
    \ \n\non the icon on your desktop: \n\n’Install Ubuntu 16.04 LTS’.\n\nBoot Ubuntu\
    \ from a \n\ndisc or USB stick\n\nStart with the trial version\n\nTry out Ubuntu\
    \ before installing it\n\nSystem requirements vary among Ubuntu products. For\
    \ the Ubuntu \n\ndesktop release 16.04, a PC with at least 512MB of RAM and 5GB\
    \ of \n\ndisk space is highly recommended. For less powerful computers, it’s \n\
    \nbest to use one of the other Ubuntu distributions. \n\nUbuntu can be booted\
    \ from a USB drive or CD and used without \n\neven installing it. Let’s take a\
    \ look at the diferent ways to download \n\nand use the Ubuntu trial version…\n\
    \nLive booting and virtual machines\n\nOne of the easiest ways to get started\
    \ with Ubuntu is by creating \n\na live USB drive, CD or DVD. After placing Ubuntu\
    \ onto it, you can \n\ninsert your USB stick or disc into any computer, then restart\
    \ it. The \n\ncomputer should then boot from the removable medium and you \n\n\
    can use Ubuntu without making changes to the hard drive.\n\nYou may be wondering\
    \ how to create a live Ubuntu USB drive or \n\ndisc. For this, you can download\
    \ the latest Ubuntu disk image from \n\nUbuntu’s website. Use the UNetbootin tool\
    \ to put Ubuntu on your \n\nUSB lash drive or burn the downloaded ISO image to\
    \ a disc. All you \n\nneed to do now is to restart your computer from the removable\
    \ \n\nmedium you provided and select the ‘Try Ubuntu’ option."
