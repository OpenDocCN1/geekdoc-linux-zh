    \ groups, which use a thick outline to indicate themselves.\n\nGrouped cells\n\
    \n**14**\n\nIf you’ve never \n\nstumbled across \n\nit, Calc is very smart \n\n\
    when it comes to \n\nreplicating cells. If you \n\nwrite down two or \n\nthree\
