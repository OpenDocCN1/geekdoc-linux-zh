  md: "![](img/a6bf9da4751f37b25a0d6611dc73918d_66_0.png)\n\nSecure files with Déjà\
    \ Dup\n\n**67**\n\n**Ubuntu essentials**\n\n**Check destination**\n\nDéjà Dup\
    \ stores backed up files in the \n\nform of archived files that can be handled\
    \ \n\nwith the Duplicity utility. You can’t extract \n\nthe files with a regular unarchiver\n\
