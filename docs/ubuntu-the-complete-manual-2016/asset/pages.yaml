  md: "![](img/a6bf9da4751f37b25a0d6611dc73918d_32_0.png)\n\n**Ubuntu essentials**\n\
    \n**33**\n\nTune up power settings\n\nThese settings mostly affect laptop \n\n\
    users, but they can help optimise \n\ndesktop power consumption as \n\nwell. Under\
    \ the Hardware category \n\nof System Settings, go to Power \n\nand use the first\
    \ drop-down menu \n\nto set up the inactivity period \n\n– this is the period\
    \ after which \n\nyour computer will automatically \n\nsuspend. The second option\
    \ \n\ndown lets you disable the battery \n\nindicator for example. When your \n\
    \nlaptop always runs from AC, there \n\nis no need for this. Another power-\n\n\
    related tunable is screen brightness. \n\nEither follow the link on the Power\
    \ \n\ntab or open up the Brightness & \n\nLock subsection directly. Here you \n\
    \ncan set a period of inactivity, after \n\nwhich the display will be turned off\
    \ \n\nautomatically and the computer will \n\nbe locked. You can define whether\
    \ \n\nthe user is required to provide a \n\npreviously set password to unlock\
    \ \n\nthe computer.\n\nSet up a printer\n\nUbuntu automatically detects and \n\
    \nconfigures local printers in case it has \n\na driver for them. Most consumer\
    \ \n\nprinters are supported without any \n\nproblems in Linux, so if you open\
    \ the \n\nPrinters subsection, you should see \n\nthe icon for a configured printer.\
    \ You \n\ncan edit the printer’s preferences, \n\nchange its driver, or you can\
    \ create \n\nseveral instances of the same printer \n\nwith different settings.\
    \ Press the \n\n‘Add’ button and follow the wizard \n\nto set up a local or remote\
    \ printer – \n\nmuch of it’s automatic (Fig 2). If you \n\nneed more control or\
    \ you want to \n\nresolve a printing issue, use $ sudo \n\nservice cups restart.\
    \ This is the \n\ncommand for restarting the system-\n\nwide printing service\
    \ in Ubuntu. To \n\nenjoy the feature-rich CUPS admin \n\ninterface instead, try\
    \ going to http://\n\nlocalhost:631 in your web browser. \n\nNote that all changes\
    \ to printer \n\nsettings require the root password of \n\nyour Ubuntu system.\n\
    \n**Fig 2 (above)** Ubuntu should \n\nautomatically detect both local and \n\n\
    network printers\n\nDiscover System Settings"
