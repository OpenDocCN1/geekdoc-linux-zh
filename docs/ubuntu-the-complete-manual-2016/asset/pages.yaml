  md: "![](img/a6bf9da4751f37b25a0d6611dc73918d_78_0.png)\n\n**Ubuntu essentials**\n\
    \nMonitor Software & Updates\n\n**79**\n\nUbuntu periodically checks \n\nfor its\
    \ updates online and \n\nif it finds a newer version \n\nfor at least one package,\
    \ a \n\nspecial notification pops up. \n\nIn the Software & Updates \n\napplication,\
    \ you can choose \n\nwhat updates the system \n\nlooks for and how frequently\
    \ \n\nchecks should be carried out. \n\nTo do this, go to the Updates \n\ntab\
    \ and review the list of \n\nticked boxes. By default, \n\nUbuntu looks for security\
    \ \n\nupdates, recommended \n\nupdates for regular packages \n\nand also for backported\
    \ \n\nsoftware that is not \n\nsupported by Canonical, but \n\ncontributes to\
    \ the Ubuntu \n\nexperience. The next four \n\ndrop down menus control \n\nthe\
    \ updates frequency and \n\nbehaviour. For instance, here \n\nyou can program\
    \ Software \n\n& Updates to download \n\nand install all or particular \n\nupdates\
    \ automatically, \n\nwithout disturbing the \n\nuser. This can be helpful \n\n\
    for unattended Ubuntu \n\ninstallation with a stable \n\nInternet connection.\
    \ The last \n\ndrop down menu lets you \n\nchoose whether Ubuntu \n\nshould notify\
    \ about any \n\nnew version of the OS itself \n\nor about long-term support \n\
    \nversion (LTS) only. If don’t like \n\nto hop to newer versions too \n\noften,\
    \ stick to LTS releases.\n\nSet up updates\n\nAdd or remove software sources\n\
    \nStandard Ubuntu repositories can be managed on the Ubuntu \n\nSoftware tab in\
    \ Software & Updates. It lists the Main repository, for \n\nwhich Canonical (the\
    \ Ubuntu maker) provides oicial support; the \n\nUniverse repository, which is\
    \ maintained by Ubuntu community; \n\nthe Multiverse repository with proprietary\
    \ software; and the \n\nRestricted one with closed-source device drivers. If you\
    \ somehow \n\nneed to develop software in Ubuntu yourself, you can enable the\
    \ \n\nSource repository. Below are other helpful controls for selecting the \n\
    \nnearest mirror (this can boost a package’s download speed) and \n\nthe optional\
    \ switch for Ubuntu CD/DVD with standard delivery \n\nof packages. The ‘Other\
    \ software’ tab lets you add third-party \n\nrepositories and by default lists\
    \ entries within the Canonical Partners \n\nrepository and the extra Independent\
    \ repository for even more \n\nsoftware (Fig 1). Press the ‘Add’ button to add\
    \ a new repository, ‘Edit’ \n\nto change details and ‘Remove’ to delete a repository.\
    \ There are \n\nmany additional repositories on the Internet, but always approach\
    \ \n\nwith caution.\n\n“Standard Ubuntu repositories can be \n\nmanaged on the\
    \ Ubuntu Software tab”\n\n**Fig 1 **Use Software & Updates \n\nto add third-party\
    \ repositories"
