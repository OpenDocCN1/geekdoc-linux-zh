  md: "![](img/a6bf9da4751f37b25a0d6611dc73918d_25_0.png)\n\nCustomising the desktop\n\
    \nCustomising \n\nthe desktop\n\nChange desktop settings and add a personal touch\
    \ \n\nto Ubuntu’s exterior\n\nThe default desktop environment in Ubuntu is called\
    \ Unity. It \n\nprovides users with a consistent and easy-to-use graphical interface\
    \ \n\nfor performing everyday tasks. The default settings are quite simple, \n\
    \nbased on studies into the features people i nd comfortable and \n\nintuitive.\
    \ However, with so many people with so many dif erent \n\ntastes, Unity allows\
    \ all essential features, such as appearance and \n\nbehaviour of the desktop,\
    \ to be customised to the user’s liking.\n\nThis is done with the Look and Feel\
    \ settings, localisation, input \n\noptions as well as privacy-related settings.\
    \ Some of the above \n\ndon’t af ect Ubuntu behaviour – such as various aesthetic\
    \ settings \n\n(theme, icons), but some do.\n\nIt is worth mentioning that sometimes\
    \ people need more \n\nprecise control over their Ubuntu installation and require\
    \ some \n\nextra features that are not part of the out-of-the-box Ubuntu. For\
    \ \n\nthat reason, there are dif erent ways to work around it in the form \n\n\
    of commands ($ gsettings) and even stand-alone tweakers (eg \n\nUnity-tweak-tool).\
    \ Such extras let you change advanced settings \n\nlike fonts, window control\
    \ placement, desktop ef ects and more. \n\nNext you can i nd out how you can change\
    \ the most common \n\nsettings and resolve frequently occurring issues.\n\n**01**\n\
    \nThe taskbar panel or the Launcher works just fine, but sometimes you \n\nneed\
    \ to get rid of some of the default icons and add your favourite apps \n\ninstead.\
    \ To remove an icon, right-click on it and select the ‘Unlock from Launcher’ \n\
    \noption. To add an application to the taskbar you first need to find it in the\
    \ Dash \n\nand drag it to the desired position on the taskbar. You can also drag\
    \ and rearrange \n\nthe existing icons on the taskbar. Use the Appearance>Look\
    \ section in System \n\nSettings to change the taskbar icon size. If you make\
    \ it smaller, more icons will fit \n\nthere, which is helpful for small displays.\
    \ Also, check the Behaviour tab for auto-\n\nhiding option, enabling multiple\
    \ workspaces and more.\n\nAdjust the Launcher\n\n**Ubuntu essentials**\n\n**26**"
