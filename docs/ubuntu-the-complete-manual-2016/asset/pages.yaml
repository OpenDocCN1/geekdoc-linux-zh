  md: "![](img/a6bf9da4751f37b25a0d6611dc73918d_45_0.png)\n\nSharing files in Ubuntu\n\
    \nSharing files in \n\nUbuntu\n\nLearn to create i le servers to share data from\
    \ your \n\nUbuntu system\n\nThe default Ubuntu i le manager Nautilus of ers an\
    \ easy-to-use \n\ninterface to help you share i les across systems. Behind the\
    \ scenes, \n\nhowever, Samba is running the show. \n\nSamba is a software suite\
    \ for seamless i le and print services. It \n\nimplements the Server Message Block\
    \ (SMB)/Common Internet File \n\nSystem (CIFS) protocol for Unix systems, supporting\
    \ i le and printer \n\nsharing across Windows, OS X and other Unix systems.\n\n\
    Samba is freely available, unlike other SMB/CIFS implementations, \n\nand so is\
    \ widely used on various systems. You can facilitate the i le \n\nsharing between\
    \ Ubuntu and Windows computers by coni guring \n\nSamba as a i le server on one\
    \ of the systems.\n\nSamba can do several other things including acting as a server\
    \ \n\nfor SMB clients: you can share printers, including PDF pseudo-\n\nprinters\
    \ so all the computers in your network may write PDF i les. \n\nSamba can also\
    \ act as a domain controller in a Windows network \n\n(authenticating users, and\
    \ so on) and even help using a Windows \n\ndomain controller to authenticate the\
    \ users of a Linux/Unix \n\nmachine. However we will focus only on the i le sharing\
    \ aspect of \n\nSamba in this feature.\n\nSamba is not installed by default in\
    \ Ubuntu 16.04 and so to start \n\ni le sharing you’ll have to install Samba.\
    \ We’ll see the installation \n\nprocess and the steps to set up i le sharing\
    \ in next sections.\n\n“You can facilitate the i le sharing \n\nbetween Ubuntu\
    \ and Windows \n\ncomputers by coni guring Samba as a \n\ni le server on one of\
    \ the systems”\n\n**46**\n\n**Ubuntu essentials**"
