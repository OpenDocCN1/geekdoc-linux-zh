  md: "![](img/a6bf9da4751f37b25a0d6611dc73918d_12_0.png)\n\n**Getting started**\n\
    \nGet to know Ubuntu\n\n**13**\n\nAfter taking a look at the initial aspects of\
    \ Ubuntu, now it’s time \n\nto delve deeper into the operating system. To start\
    \ with, you may \n\nnotice many similarities between Ubuntu and other operating\
    \ \n\nsystems – mainly because they are all based on the concept of \n\na GUI\
    \ (graphical user interface). It is a good idea to understand \n\nthe applications\
    \ and menus in Ubuntu so that you can become \n\ncomfortable with using its GUI.\
    \ Any GUI-based operating system \n\nmakes use of a desktop environment. The main\
    \ features provided \n\nby a desktop environment are related to the look and feel\
    \ of the \n\nsystem and how easily a user can navigate the desktop.\n\nLet us\
    \ take a quick look at the menu bar in Ubuntu. The menu \n\nbar incorporates the\
    \ most common functions used in Ubuntu. \n\nEach installation of Ubuntu may contain\
    \ slightly diferent icons \n\nbased on a number of factors, including the type\
    \ of hardware. \n\n**Fig 5** You can choose to \n\nemploy the Terminal\n\nYou\
    \ may notice that Ubuntu \n\nis a little different to some \n\nother operating\
    \ systems. \n\nThe most important thing \n\nto understand is the Ubuntu \n\npackaging\
    \ system. Typically \n\nit includes:\n\n/usr\n\n/var\n\n/bin\n\n/sbin\n\n/lib\n\
    \nThe other thing to note here \n\nis cron job management. \n\nThe jobs that are\
    \ the under \n\nthe purview of the system \n\nadministrator can be found \n\n\
    in the /etc directory. If you \n\nhave a root cron job for \n\ndaily, weekly or\
    \ monthly \n\nruns, make sure to place \n\nthem under /etc/cron.\n\n{daily,weekly,monthly}.\
    \ \n\nThese jobs can be invoked \n\nfrom /etc/crontab.\n\nThere is a tool called\
    \ ‘Ubuntu \n\nAfter Install’, which can be \n\nused to install some of the \n\n\
    best and most essential \n\nsoftware after installing the \n\nUbuntu desktop.\
    \ It boasts a \n\nbunch of useful applications, \n\nand will automate the \n\n\
    installation process on a \n\nnewly installed machine \n\nin order to obtain a\
    \ near \n\nperfect desktop. This tool \n\nwill save a lot of your time \n\nand\
    \ effort, and installs all \n\nlatest versions of software on \n\nyour Ubuntu\
    \ system.\n\nNavigate Ubuntu\n\nDecode the menu bar, Launcher, Dash, home \n\n\
    directory and more"
