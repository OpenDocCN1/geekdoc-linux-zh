  md: "![](img/a6bf9da4751f37b25a0d6611dc73918d_13_0.png)\n\n**Getting started**\n\
    \nGet to know Ubuntu\n\n**14**\n\nFor example, some programs add an icon to the\
    \ indicator area \n\nautomatically during installation. You should note that every\
    \ \n\napplication features its own menu system wherein diferent \n\nactions can\
    \ be executed within it (such as File, Edit, View and so \n\non). Appropriately,\
    \ the menu system for an application is known \n\nas the application menu.\n\n\
    Another thing that we need to understand in Ubuntu is the \n\n‘Launcher’ – the\
    \ vertical bar of icons available on the left side of \n\nthe desktop (Fig 6).\
    \ With the help of this Launcher, one can easily \n\naccess the various applications,\
    \ mounted devices and trash. Note \n\nthat any application that is running will\
    \ have its icon placed in \n\nthe Launcher bar. \n\nIn Ubuntu, we commonly come\
    \ across something called \n\n‘Dash’. If you have used Windows in the past, you\
    \ can consider \n\nDash as something similar to the Windows Start menu. The Dash\
    \ \n\nwill help you to ind the applications and iles you’re looking \n\nfor on\
    \ your machine. To explore the Dash, you need to click on \n\nthe topmost icon\
    \ on the Launcher. Now you will be able to see \n\na window with a search bar\
    \ on the top as well as the recently \n\naccessed applications, iles and downloads.\n\
    \n**Fig 6 (above)** To run any application from the Launcher, \n\nyou just need\
    \ to click on the application’s icon\n\n**Fig 7 **Type to search for files or\
    \ folders and suggested \n\nresults will appear in the Dash menu"
