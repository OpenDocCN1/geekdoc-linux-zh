  md: "![](img/a6bf9da4751f37b25a0d6611dc73918d_10_0.png)\n\n**Getting started**\n\
    \nGet to know Ubuntu\n\n**11**\n\nAdopting the full version\n\nNew versions are\
    \ released every six months \n\nand are supported for 18 months\n\nAs noted previously,\
    \ Ubuntu is a very popular Linux distribution with \n\nmany years of experience\
    \ and a huge user base. After becoming \n\ncomfortable with the initial aspects\
    \ of Ubuntu, it is time to take \n\na look at Ubuntu’s full version. Before you\
    \ start with Ubuntu, you \n\nneed to obtain a copy of the Ubuntu installation\
    \ image. In addition, \n\nyou will have to ensure that your system meets the minimum\
    \ \n\nrequirements. The most common method of obtaining Ubuntu is \n\nto download\
    \ the Ubuntu DVD image directly from the oicial site, \n\nubuntu.com/download.\
    \ To download and install it, you just need \n\nto select whether you require\
    \ the 32-bit or 64-bit version and then \n\nclick ‘Start download’.\n\nIt is important\
    \ to understand these two versions that Ubuntu \n\nis available in: 32-bit and\
    \ 64-bit. They difer from each other in the \n\nway the computer processes information.\
    \ So if your computer has \n\na 64-bit processor, you will need to install the\
    \ 64-bit version. On \n\nthe other hand, if you have an older computer or you\
    \ do not know \n\nthe type of the processor in your computer, it is advisable\
    \ to opt to \n\ninstall the 32-bit version. \n\nAlthough 5GB of free space on\
    \ your hard drive is required for \n\ninstalling Ubuntu, the recommendation is\
    \ to have 15GB or more. \n\nThis will mean you’ll have enough space to install\
    \ extra applications, \n\nas well as to store your own documents, music and more.\
    \ \n\nIf you have an Internet connection, the installer will ask you now \n\n\
    whether you want to ‘Download updates while installing’. It is highly \n\nrecommended\
    \ to perform this step.\n\nIt is important to have an \n\nInternet connection\
    \ during \n\nthe Ubuntu installation \n\nprocess. If you are not \n\nconnected\
    \ to the Internet, \n\nthe installer will ask you to \n\nchoose a wireless network,\
    \ \n\nif one is available. You can \n\nfollow these three steps in \n\nsuch a\
    \ scenario…\n\n**01 ** Select ‘Connect to this \n\nnetwork’ and choose your \n\
    \nnetwork from the list.\n\n**02** In the ‘Password’ field, \n\nenter your router’s\
    \ WEP or \n\nWPA key.\n\n**03** Then click ‘Connect’ in \n\norder to continue.\n\
    \nInternet connection\n\n**Fig 4 (below)** Make sure you have the \n\navailable\
    \ drive space before installing"
