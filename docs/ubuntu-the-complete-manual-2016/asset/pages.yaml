  md: "![](img/a6bf9da4751f37b25a0d6611dc73918d_82_0.png)\n\n**Ubuntu essentials**\n\
    \n**83**\n\nConfigure network connections\n\nConnect to a wireless or wired network\n\
    \nIf you want to use a wireless connection and if you have a Wi-Fi \n\nnetwork\
    \ card or chip, things are quite easy: notice the ‘radar’ sign \n\nat the far-right\
    \ position on Unity top bar and click it to see a list of \n\navailable networks.\
    \ Select your network and once you provide the \n\ncorrect authentication password,\
    \ you are mostly done. With wired \n\nnetwork connection, for which you are given\
    \ an IP address, network \n\nmask and a gateway address, you’ll need to enter\
    \ the Network \n\nconiguration dialogue and add your connection manually. To do\
    \ \n\nso, irst check that the global switch for wired networks is in the On \n\
    \nmode and then press the ‘Options’ button in the lower-right corner \n\nof the\
    \ window. This will bring up the connection editor (Fig 2), in \n\nwhich the most\
    \ common place to go is the IPv4 Settings tab. In the \n\nMethod drop-down menu,\
    \ select Manual and then provide your \n\nconnection details in ields below.\n\
    \nView connection settings\n\nWhen you are \n\nonline, you still \n\nmay want\
    \ to use \n\nNetworkManager \n\nto ind out certain \n\ndetails about your \n\n\
    current connection. \n\nThe quickest way to ind out such details will be to click\
    \ on the \n\nnetwork indicator on the Unity top bar and go to the Connection \n\
    \nInformation item. You will see a separate window with lots of \n\ndetails about\
    \ your connection, including general settings (your \n\nnetwork car MAC address,\
    \ declared speed, interface name), and IP \n\nconnection details for both IPv4\
    \ and IPv6 (if it is relevant for you). \n\nThe main window of the Network application\
    \ also displays network \n\nsettings and includes a briefer list with Hardware\
    \ Address (MAC), \n\nIP Address, Default Route and the list of DNS servers. If\
    \ you cannot \n\nrun NetworkManager in graphical mode for some reason, use the\
    \ \n\n‘$ ifconfig’ command to view settings and ‘$ nmcli’ to manage \n\nvarious\
    \ connections. For instance, let us bring up a known Wi-Fi \n\nconnection from\
    \ within a broken Ubuntu system that cannot boot \n\ninto any desktop:\n\n $ nmcli\
    \ dev wifi con “Network\\_Name” password “your\\_password”\n\nSitting behind a\
    \ proxy adds \n\na little complexity. Usually \n\nyou have to declare your \n\n\
    proxy settings several times: \n\nseparately for a web browser, \n\nin the Bash\
    \ environment, for \n\nApt package manager, for \n\nWget downloader and so \n\n\
    on. However, Ubuntu makes \n\nthings a little easier on this \n\nfront. Click\
    \ the ‘Network \n\nProxy’ item in the list on the \n\nleft and choose what kind\
    \ \n\nof proxy setup works for \n\nyou. If you have been given \n\na URL, select\
    \ the Automatic \n\nmethod and provide that \n\nURL in the field below. Proxy\
    \ \n\nwith personal authentication \n\nusually requires manual \n\nsetup. Select\
    \ the Manual \n\nmethod and provide at least \n\nthe HTTP proxy, using the \n\n\
    following syntax:\n\n username:password@\n\nserver-name.domain\n\nProvide a proper\
    \ port and \n\nfinally hit the ‘Apply system \n\nwide’ button to finish with \n\
    \nsetup and get going. \n\nSet up a \n\nnetwork proxy\n\n**Fig 2 **Input details\
    \ \n\nmanually using the \n\nconnection editor"
