    \nNavigate the Ubuntu desktop\n\n**20**\n\nNavigate the \n\nUbuntu desktop\n\n\
    Find everything you need on the intuitive and attractive \n\nUbuntu desktop interface,\
    \ Unity\n\nWhen Ubuntu irst introduced its Unity desktop, \n\nsome users threatened\
    \ to move back to \n\nWindows Vista. But as time went by, the desktop \n\nbecame\
    \ more reliable: as of 12.04 LTS, there \n\nis no real reason to dislike Unity.\
    \ Unity initially \n\nstarted out as a research product trying to create \n\n\
    a GUI that was better suited to netbooks: their \n\nextremely wide displays did\
    \ not work particularly \n\nwell with traditional desktop managers that \n\nhad\
    \ been intended for workstations utilising \n\nthe standard 4:3 displays. This\
    \ explains two \n\nimportant changes to the interface: irst of all, \n\nthe Launcher\
    \ was moved to the side of the \n\nscreen to preserve the valuable vertical real\
    \ \n\nestate. Secondly, the menu bars of the various \n\ndiferent applications\
    \ were grouped together \n\ninto one top bar that is always dedicated to the \n\
    \ncurrently enabled application. This is one of the \n\nmain diferences you will\
    \ ind from Windows and \n\nother distros in terms of usability, but it is one\
    \ \n\nthat you will become accustomed to over time. \n\nWhile getting up to speed\
    \ with Unity might \n\ntake users a bit of time, rest assured that you will \n\
    \neventually see are more than worth it.\n\n“Unity initially started out as a\
    \ research product trying to create \n\na GUI that was better suited to netbooks”\n\
    \n**Trash **\n\nJust where you’d expect to find it, \n\nthe trash can is always\
    \ visible at the \n\nbottom of the quick launch bar\n\n**View app status**\n\n\
    All of the running applications are \n\nshown below the Dash symbol. \n\nThe arrows\
    \ located on the left \n\nside of the icon let you know \n\nthe number of windows\
    \ that are \n\ncurrently open. On dual-screen \n\nworkstations, an ‘empty’ arrow\
    \ \n\nhere indicates that the window \n\nis not located on the display that \n\
    \nis showing this particular version \n\nof the bar\n\n**Quick-launch apps**\n\
    \nRight-click on the symbol of a \n\nrunning application to open a \n\nshort menu.\
    \ Selecting ‘Lock to \n\nLauncher’ from the available \n\noptions ensures that\
    \ the symbol \n\nwill always remain in the bar \n\nfor quick access to that specific\
    \ \n\napplication, even if it is not \n\ncurrently running"
