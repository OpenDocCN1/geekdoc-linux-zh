    \ includes a great \n\ntool for automatic and hassle\\-free backups called Déjà\
    \ Dup – \n\nalso known by the simpler name, Backups”\n\nSecure your data quickly\
    \ Déjà Dup is an intuitive app for managing backed up iles"
