  md: "![](img/a6bf9da4751f37b25a0d6611dc73918d_46_0.png)\n\nSharing files in Ubuntu\n\
    \n**47**\n\n**01**\n\nTo share a directory, you must have permission to access\
    \ the directory. For \n\ndemonstration purposes, let’s take a folder from the\
    \ user’s home directory, \n\nsuch as Documents. \n\nGo to your home directory.\
    \ Right-click on the Documents directory and in \n\nthe pop-up menu, select Local\
    \ Network Share. Then check the ‘Share this folder’ \n\ncheckbox. If Samba is\
    \ not installed, you will get a pop-up menu: ‘Sharing service is \n\nnot installed’.\
    \ Select ‘Install additional software’ and then click Install (Fig 1). If you\
    \ \n\nget an error message that the samba .deb could not be found, open a terminal\
    \ \n\nand update apt-get like this:\n\n $ sudo apt-get update\n\nTry again and\
    \ Ubuntu will download and install Samba. Let’s try sharing the folder \n\nagain.\
    \ Right-click on the Documents directory and in the pop-up menu, select \n\nLocal\
    \ Network Share. Next, check the ‘Share this folder’ checkbox. And then click\
    \ \n\nthe Share button. That’s it; the directory should now be shared and accessible\
    \ \n\nfrom Samba clients. You can also install Samba GUI for Ubuntu. Just type:\n\
    \n $ sudo apt-get install system-config-samba\n\n…or search for Samba in the Ubuntu\
    \ Software Centre and install it from there. \n\nOnce installed, just search Dash\
    \ for system-config-samba.\n\nSamba server configuration\n\n**Ubuntu essentials**\n\
    \n**Fig 1 (above) **Install Samba \n\nwith just one mouse click"
