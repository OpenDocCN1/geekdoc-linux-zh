  md: "![](img/a6bf9da4751f37b25a0d6611dc73918d_34_0.png)\n\nTweak your security settings\n\
    \n**35**\n\n**03**\n\nFirewall is an effective tool for \n\nblocking network intrusions\
    \ \n\nfrom the outer world and limiting \n\nsuspicious network activity in both\
    \ \n\ndirections by blocking certain network \n\npackets in IPv4 and IPv6 protocols.\
    \ \n\nLinux has the ‘iptables’ tool for doing \n\nthis job, but it is not very\
    \ intuitive for \n\nnewcomers. Luckily, Ubuntu has a nice \n\nfront end to iptables\
    \ called UFW – the \n\nUbuntu FireWall (Fig 1) in its standard \n\nrepositories.\
    \ Install it with:\n\n $ sudo apt-get install ufw \n\ngufw\n\nYou can control\
    \ it either from \n\ncommand line ($ sudo ufw --help), \n\nor within a graphical\
    \ interface (search \n\nfor ‘firewall’ in Dash or simply launch \n\n$ gufw).\n\
    \nEnable uncomplicated \n\nfirewall\n\n**02**\n\nLet’s go a little further and\
    \ make Ubuntu receive important security updates \n\nwithout any interaction with\
    \ a user. This feature is very useful because not all \n\nupdates are installed\
    \ without your awareness, but only security\\-related ones that fix \n\nvulnerabilities,\
    \ critical bugs, memory leakage and so on. To enable this feature, first \n\n\
    start by installing the package along with the required scripts:\n\n $ sudo apt-get\
    \ install unattended-upgrades.\n\nNext, enable updates with the following command:\n\
    \n $ sudo dpkg-reconfigure -priority-low unattended-upgrades.\n\nAll you have\
    \ to do is to add unattended upgrades command to your Cron list on \n\na daily/weekly/monthly\
    \ basis. Find more details at bit.ly/1EtLKFF.\n\nEnable automatic security updates\n\
    \n“A good password contains lower and \n\nuppercase letters, special characters\
    \ and \n\ndigits. Thankfully, Ubuntu can help you”\n\n**Ubuntu essentials**\n\n\
    **Fig 1 **Enable the Ubuntu Firewall and \n\ntweak settings"
