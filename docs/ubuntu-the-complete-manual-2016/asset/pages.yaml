  md: "![](img/a6bf9da4751f37b25a0d6611dc73918d_65_0.png)\n\nSecure files with Déjà\
    \ Dup\n\n**66**\n\n**Ubuntu essentials**\n\nSecure files with \n\nDéjà Dup\n\n\
    Having a backup copy of your photos, documents, music and video \n\ni les is a\
    \ high priority to keep them safe, even though some novice \n\nusers opt to skip\
    \ the process. Imagine that something has gone \n\nwrong with your hard drive\
    \ and it can no longer boot up. The bad \n\nnews is that while you can buy a new\
    \ hard drive, you may well lose \n\nyour data on the old one, which is often more\
    \ precious than any \n\nhardware you might have lost. \n\nSo here comes the i\
    \ nest hour for a backup copy that you have \n\nprepared beforehand and kept updating\
    \ regularly. And there’s no \n\nexcuse not to do it, since Ubuntu includes a great\
    \ tool for automatic \n\nand hassle\\-free backups called Déjà Dup – also known\
    \ by the \n\nsimpler name, Backups.\n\nUsing Déjà Dup is as simple as it can be:\
    \ you choose what you \n\nwant to back up and where, opt to specify what directories\
    \ it should \n\nskip and then put the task into the automatic queue of the Ubuntu\
    \ \n\nscheduler, which can perform backups periodically and even keep \n\nnew\
    \ and older backups at the same time. The interface of Déjà \n\nDup has a category\
    \ tree on the left and a main part to the right, \n\nwith a clear arrangement\
    \ of easy\\-to\\-use controls. The default setup \n\nassumes you might want to\
    \ back up your ~/home directory with \n\nan exception for Trash and ~/Downloads,\
    \ so you may leave it intact \n\nand go ahead with this safe assumption, or opt\
    \ to customise the list \n\nof included and ignored directories to your liking.\n\
    \nCreate an extra copy of your valuable data\n\nand keep it updated\n\n“Having\
    \ a backup copy of your photos, \n\ndocuments, music and video i les is a \n\n\
    high priority to keep them safe”"
