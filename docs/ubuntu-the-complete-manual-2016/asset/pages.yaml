  md: "![](img/a6bf9da4751f37b25a0d6611dc73918d_38_0.png)\n\nFind your way around\
    \ Dash\n\n**39**\n\nDash scopes and lenses\n\nDash serves as the universal window\
    \ for finding content, but as there are several \n\ntypes of content on the computer,\
    \ the results are segregated into smaller scopes \n\nor lenses (Fig 1). Dash has\
    \ a series of scopes that logically separate the results and \n\nprovide views\
    \ to your files, folders, applications and data. The following scopes are \n\n\
    installed by default: Home, Applications, Files, Videos, Music, Photos and Online\
    \ \n\n(social media). \n\nWhen you launch Dash, you’ll see a search bar on the\
    \ top. This is common to all \n\nscopes. Simply start typing and a list of results\
    \ will appear below. Note that this is the \n\nhome lens. The home lens is the\
    \ default and will appear unless you explicitly select \n\nanother lens. You can\
    \ explicitly select a lens by clicking one of the options on the \n\nbottom bar\
    \ (when Dash is active). Other lenses will only show the items from the \n\ncorresponding\
    \ scope that is relevant to your search query. For example, if you type \n\ntext\
    \ as a search query, home lens will show the results from all over the computer,\
    \ \n\nbut if you change it to an application lens, you’ll see the text editor\
    \ as the first result. \n\nDash keyboard shortcuts\n\nThere are several shortcuts\
    \ you can use to speed up your interaction with \n\nit. For example, press the\
    \ super key and hold it for a while; a list of numbers \n\nwill appear against\
    \ the Launcher. You can open any of the applications by \n\nsimply pressing the\
    \ associated number on the keyboard. While you hold the \n\nsuper key, you will\
    \ see a window with several shortcuts listed.\n\nTo go straight to the applications\
    \ lens, simply press the super key and the \n\nletter A at the same time. Similarly\
    \ for the music lens, press the super key \n\nand M at the same time. For videos,\
    \ press the super key and V. \n\nSuper key+C takes you to photo lens and Super\
    \ key+F opens the file lens. \n\nIf you would rather switch between lenses on\
    \ the fly, you can use Ctrl+Tab \n\nto switch between lenses once you are inside\
    \ Dash.\n\n**Fig 1 (above)** Search results in Dash \n\nare separated into logical\
    \ categories\n\n**Ubuntu essentials**"
