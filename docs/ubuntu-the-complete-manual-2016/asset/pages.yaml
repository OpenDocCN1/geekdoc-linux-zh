  md: "![](img/a6bf9da4751f37b25a0d6611dc73918d_35_0.png)\n\n**36**\n\n**Protect your\
    \ PC**\n\nIf your PC suspends or turns \n\noff the display after a period of \n\
    \ninactivity, you can set Ubuntu \n\nto require a password in order \n\nto resume\
    \ using the PC\n\n**Choose what to **\n\n**include**\n\nThere are default places\
    \ inside \n\nyour home directory for Music, \n\nPictures, Downloads, etc. You\
    \ \n\ncan decide what items you \n\nwant to include in Ubuntu \n\nlogging. Aside\
    \ from directories, \n\nthere are also chat logs and \n\noffice documents\n\n\
    **Related settings**\n\nThe first link takes you to the \n\nUser Accounts subsection,\
    \ \n\nwhere you can change your \n\npassword; the second link is for \n\nPower\
    \ settings, where you can \n\nchange the time period before \n\nyou system suspends\n\
    \n**Usage activities **\n\n**record**\n\nHere is the global switch that \n\ntriggers\
    \ file and application \n\nusage logging. You can turn it \n\noff with just one\
    \ mouse click, \n\nor alternatively decide to make \n\nmore precise adjustments\n\
    \n**Exclude specific **\n\n**directories **\n\n**and apps**\n\nUse the ‘+’ and\
    \ ‘-’ buttons to \n\nselect specific directories \n\nor applications that Ubuntu\
    \ \n\nwill not log or trace. You can \n\neven create sophisticated \n\ncombinations\
    \ of apps\n\n**What about online **\n\n**search results?**\n\nA rather controversial\
    \ feature, \n\nwhich is why Canonical decided \n\nto put in the Off mode in 16.04.\
    \ \n\nYou can always change the \n\ntrigger’s position here\n\n**Diagnostic reporting**\n\
    \nCanonical needs your feedback \n\nin order to make Ubuntu better. \n\nIf something\
    \ goes wrong (eg a \n\nprogram crashes), Ubuntu will \n\nsend details of the problem\
    \ in a \n\nreport to its headquarters\n\n“Ubuntu provides a good balance between\
    \ usability and \n\nsecurity. For example you can’t log in to Unity directly;\
    \ you can \n\nuse the ‘sudo’ preix to run commands as an administrator”\n\nTweak\
    \ your security settings\n\n**Ubuntu essentials**\n\nFind the security settings\
    \ Check out the Security & Privacy tools"
