  md: "![](img/a6bf9da4751f37b25a0d6611dc73918d_54_0.png)\n\nGet to grips with the\
    \ Linux command line\n\n**55**\n\n**Fig 1 (left)** The mv command is \n\nused\
    \ in order to move files from one \n\nlocation to another\n\nTo look inside your\
    \ Documents folder, open a terminal and type ls Documents. \n\nDon’t forget to\
    \ press Enter. You’ll see a listing of all of the files in Documents. Type \n\n\
    ls and you’ll see a listing of the files in your home directory – that’s because\
    \ \n\nwhen you open a terminal, it places you in that directory. You can change\
    \ by \n\nusing the change directory command – cd – like this: cd Documents. Now\
    \ ls \n\nalone will show you your files.\n\nThe cd- command will take you back,\
    \ because the ‘\\-’ is a shortcut to tell cd to \n\ngo back to where you were\
    \ before. You could also type cd ~, as ~ is short for your \n\nhome folder – /home/jo/\
    \ or whatever. pwd will remind you where you are now.\n\nConfiguration files –\
    \ the ones called dotfiles, because their names are prefixed \n\nby a dot – are\
    \ normally hidden from listing. In most file managers you can toggle \n\nthem\
    \ into view with Ctrl+H (on a few, it’s Ctrl+.). At the terminal, it’s ls -a.\n\
    \nThe . and .. are shortcuts to ‘this directory’ and ‘parent directory’, or the\
    \ one \n\nabove – hide them by using \\-A in place of \\-a. Those letters after\
    \ the hyphen are \n\ncalled command-line switches: try ls -l, for long listing.\
    \ We’ll tell you about \n\nsome of that cryptic-looking info it displays later.\n\
    \nMoving and copying files uses mv and cp commands. We’ll see cp in use \n\noverleaf,\
    \ but for now we will replicate Fig 1 and attempt to move our files to a \n\n\
    new location:\n\n cd ~\n\n touch random.txt\n\n mv random.txt newname.txt\n\n\
    \ mv newname.txt Documents/\n\n ls\n\n ls Documents\n\n**Files, folders, and familiar\
    \ things**\n\nTime to get the command line working for you, on \n\nyour i les\
    \ and folders\n\nLook Inside\n\nYou don’t need to open an \n\napplication to look\
    \ inside a file. \n\nThe file command will let you \n\nsee what sort of file it\
    \ is. cat \n\nsends the contents of the file \n\nscrolling by, or more gives them\
    \ \n\nto you a page at a time. less \n\ndoes the same thing, with more \n\ncontrols,\
    \ and leaves you stuck if \n\nyou don’t know to press Q to quit. \n\nQ will also\
    \ exit man pages; for \n\nother apps, Ctrl+C is a good bet \n\nfor quitting. Sometimes\
    \ you just \n\nwant to see the first or last few \n\nlines of a file – head and\
    \ tail are \n\nthe commands you need, each \n\ndefaulting to ten lines. tail -n\
    \ \n\n30 /var/log/syslog shows you \n\nthe last 30 things registered by \n\nthat\
    \ log file. Real power comes \n\nwith grep (Fig 2, page 56), to \n\nsearch for\
    \ a term inside a file. Try \n\ngrep ls ~/.bash\\_history to \n\npull out all\
    \ the instances of ls that \n\nyou have used so far.\n\n**Ubuntu essentials**"
