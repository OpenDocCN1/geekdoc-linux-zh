    Manage images with Shotwell\n\n**120**\n\nManage images \n\nwith Shotwell\n\n\
    Most users treat Shotwell as a simple image viewer: a picture is \n\ndouble-clicked\
    \ in Nautilus and pops up in Shotwell. \n\nBut using the product as a simple picture\
    \ viewer means users \n\nare losing out on a set of valuable helper features.\
    \ Shotwell comes \n\nwith a relatively sophisticated database based on SQL technology,\
    \ \n\nso that pictures can be stored and retrieved with blazing speed. \n\nVarious\
    \ advanced options let you tailor the display list to your needs; \n\nif Shotwell\
    \ is set up correctly, it will signii cantly reduce the time \n\nrequired to i\
    \ nd specii c images in your (ever-growing) collection of \n\ni les. What’s more,\
    \ if your digital camera is set up correctly, Shotwell \n\nwill analyse the EXIF\
    \ data in order to i nd out the date it was \n\ncaptured and other information\
    \ automatically. Therefore, compiling \n\nall the photos taken at a single event\
    \ into one location becomes a \n\nmatter of one click.\n\nThe tutorial on the\
    \ adjacent side of the screen assumes that you \n\nalready passed through the\
    \ initial coni guration of the product. \n\nIf this is not the case, enter Shotwell\
    \ into the dash. Click ‘Shotwell \n\nPhoto Manager’ to start the application,\
    \ and click the OK button \n\nwhen confronted with the ‘Welcome to Shotwell’ dialog.\
    \ Its default \n\nsettings can be accepted without any further ado, but be prepared\
    \ \n\nto wait a few minutes as the database gets populated with the \n\nimages\
    \ and screenshots found in your proi le’s Pictures folder. \n\nKeep tabs on large\
    \ numbers of photographs \n\nwith ease using the Shotwell app\n\n“Most users treat\
    \ Shotwell as a simple \n\nimage viewer. But using it this way \n\nmeans users\
    \ are losing out on a set of \n\nvaluable helper features”"
