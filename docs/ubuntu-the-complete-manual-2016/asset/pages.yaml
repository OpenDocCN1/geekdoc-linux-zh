  md: "![](img/a6bf9da4751f37b25a0d6611dc73918d_77_0.png)\n\n**Ubuntu essentials**\n\
    \nMonitor Software & Updates\n\n**78**\n\nMonitor \n\nSoftware & \n\nUpdates\n\
    \nAdd more application sources and keep your \n\nsystem up to date\n\nUbuntu comes\
    \ with pre-installed applications and accessories for \n\nbasic computing tasks\
    \ and activities. Software & Updates lets you \n\ncustomise the standard set of\
    \ software sources, coni gure updates \n\nand manage additional drivers. A software\
    \ source is a general term \n\nthat includes both online repositories and local\
    \ media. You can turn \n\nstandard Ubuntu software source on and of , manage third-party\
    \ \n\nsource and authenticate them with signing keys. With Nvidia or \n\nAMD graphics,\
    \ you can install a proprietary driver, but it cannot be \n\nincluded in Ubuntu\
    \ right away due to license restrictions.\n\nInstall additional drivers\n\nA common\
    \ case when Ubuntu users turn to the Additional Drivers \n\ntab in Software &\
    \ Updates is graphics drivers. Computers with \n\nNvidia and AMD video chips are\
    \ supported in Ubuntu out of the \n\nbox, but the system utilises open source\
    \ drivers (‘nouveau’ and \n\n‘radeon’ respectively), that still lag behind a proprietary\
    \ driver for 3D \n\nperformance and gaming. To replace an open source driver with\
    \ \n\na proprietary one, go to the Additional Drivers tab and wait for a \n\n\
    while before Ubuntu discovers if there is a proprietary driver for your \n\nhardware.\
    \ It will not necessarily be a video card: dozens of drivers \n\nfor wireless\
    \ networks and various i rmware bits that improve system \n\nperformance cannot\
    \ be shipped directly because of their licenses.\n\nWhen you decide to go with\
    \ one or several non-free drivers, simply \n\nselect them and press the Apply\
    \ Changes button. Ubuntu will \n\ndownload all required i les in the background\
    \ and install drivers \n\nautomatically. You will then need to logout and log\
    \ back in, or \n\nbetter, restart the system."
