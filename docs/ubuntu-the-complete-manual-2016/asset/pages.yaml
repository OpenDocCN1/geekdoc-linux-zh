  md: "![](img/a6bf9da4751f37b25a0d6611dc73918d_43_0.png)\n\n**Fig 1 (above)** Explore\
    \ Ubuntu’s file system \n\narrangement using the terminal\n\n**02**\n\nUnix abstracts\
    \ the nature of tree hierarchy entirely, and the root directory is \n\nthe base\
    \ of all the folders in the Ubuntu hierarchy. Indicated by the ‘/’ sign, \n\n\
    the root directory contains all the other folders (Fig 2). Though the root directory\
    \ \n\nis conventionally referred to as ‘/’, the directory entry itself has no\
    \ name – its name \n\nis the empty part before the initial directory separator\
    \ character (/). All file system \n\nentries, including mounted file systems, are\
    \ ‘branches’ of this root. It is because \n\nof this layout that all the absolute\
    \ paths in Unix systems start with ‘/’. Even if there \n\nare several physical\
    \ or virtual storage devices attached to your computer, all the \n\nfolders will\
    \ be shown under the root directory. \n\nNote that this is not to be confused\
    \ with the /root directory that serves as the \n\nhome directory for the root\
    \ users.\n\nThe root directory\n\n**01**\n\nThe Ubuntu file system is based on\
    \ the Filesystem Hierarchy Standard \n\n(FHS). This defines the main directories\
    \ and their contents in Linux \n\noperating systems (Fig 1). For the most part,\
    \ it is a formalisation and extension \n\nof the traditional BSD file system hierarchy.\
    \ The Linux Foundation – a non-profit \n\norganisation consisting of major software\
    \ and hardware vendors, such as HP, \n\nRed Hat, IBM and Dell – maintains the\
    \ FHS. At the time of writing, the current FHS \n\nversion is 3.0, released on\
    \ 3 June 2015.\n\nFilesystem Hierarchy Standard\n\nUnderstanding the file system\n\
    \n**44**\n\n**Ubuntu essentials**"
