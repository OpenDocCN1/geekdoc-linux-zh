  md: "![](img/a6bf9da4751f37b25a0d6611dc73918d_21_0.png)\n\n**Ubuntu essentials**\n\
    \nDual boot with Ubuntu\n\n**22**\n\nDual boot\n\nwith Ubuntu\n\nGet Ubuntu running\
    \ alongside your existing \n\nWindows installation\n\nMost users who want to try\
    \ Ubuntu already have desktop PCs or \n\nlaptops with the Windows OS. Ubuntu can\
    \ be installed alongside \n\nWindows and both systems will coexist just i ne,\
    \ without interfering \n\nwith each other.\n\nUbuntu’s installation wizard has\
    \ an advanced disk partition stage, \n\nwhere you can either trust the installer\
    \ to automatically shrink the \n\nWindows partition and let Ubuntu use the freed\
    \ space, or you can \n\ndo it manually. Shrinking NTFS partitions from Linux is\
    \ considered \n\nstable enough and if you didn’t have any problems with your C\
    \ \n\ndrive in Windows (such as severe fragmentation), Ubuntu will resize \n\n\
    it correctly. The installer will create the mandatory root partition (/) \n\n\
    in the free disk area and sometimes also create separate partitions \n\nfor user\
    \ data (/home) and swap space. \n\nAfter the installer copies Ubuntu i les to\
    \ the root partition, it’ll \n\nperform post-installation arrangements and install\
    \ the GRUB2 \n\nbootloader into the master boot record (MBR) of the hard drive\
    \ \n\non older systems, or GRUB2-EFI into the dedicated FAT32 partition \n\non\
    \ modern systems with Windows 8 or 10 and a GPT-formatted \n\ndrive. The Ubuntu\
    \ installer supports the Secure Boot feature of \n\nmany modern Windows PCs and\
    \ installs the GRUB2-EFI bootloader \n\ncorrectly. After rebooting, you’ll see\
    \ the GRUB2/GRUB2-EFI interface, \n\nwhere you can choose Ubuntu or Windows. \n\
    \nYou will i nd that it’s possible for you to access Windows i les from \n\nUbuntu,\
    \ but not vice versa.\n\n“Ubuntu can be installed alongside Windows and both \n\
    \nsystems will coexist just i ne”"
