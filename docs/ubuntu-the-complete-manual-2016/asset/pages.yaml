  md: "![](img/a6bf9da4751f37b25a0d6611dc73918d_29_0.png)\n\n**Ubuntu essentials**\n\
    \nDiscover System Settings\n\nDiscover \n\nSystem Settings\n\nDiscover system\
    \ details, manage user accounts and \n\nconi gure hardware\n\nThe System Settings\
    \ application houses various settings and acts \n\nthe same way as the Control\
    \ Panel in Windows. You can launch \n\nSystem Settings from the farthest indicator\
    \ in the top bar, or even \n\nfrom the command line ($ unity-control-center).\
    \ Of course, the \n\nset of system-related settings here isn’t the only place\
    \ where you \n\ncan change such settings, but it is the most convenient and safe\
    \ \n\nplace to do it. Traditionally in Linux (and Ubuntu is no exception), \n\n\
    system settings could be changed via editing coni guration i les \n\nin the /etc\
    \ directory, or by issuing certain commands while being \n\nin root. While these\
    \ work in Ubuntu, it requires advanced skills \n\nand sometimes involves putting\
    \ your Linux installation at risk. The \n\nSystem Settings shell in Ubuntu contains\
    \ a limited number of neatly \n\ndesigned items that help you manage essential\
    \ system-related \n\nsettings with ease and minimum skill. The System subsection\
    \ \n\ncontains settings for Backup, System Details, Landscape Service, \n\nSoftware\
    \ Sources, Time & Date, Universal Access and User Accounts. \n\nSome of the above\
    \ are applicable for enterprise Ubuntu users \n\n(such as the paid subscription\
    \ for technical support, which is called \n\nLandscape), while other settings\
    \ are covered in detail in separate \n\nchapters (Backup, Time & Date, etc). This\
    \ overview focuses on Details \n\nand User Accounts as well as on certain hardware-related\
    \ settings.\n\n“The System Settings shell in Ubuntu \n\ncontains a limited number\
    \ of neatly \n\ndesigned items that help you manage \n\nessential system-related\
    \ settings with \n\nease and minimum skill”\n\n**30**"
