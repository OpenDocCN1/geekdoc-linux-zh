    \ only helps save some watts but \n\nalso reduces heating, and even makes the\
    \ system quieter. Regardless of the \n\ndefault behaviour of your drive in Ubuntu,\
    \ you can explicitly set it to go to sleep \n\nafter a certain length of time.\
    \ Click on the ‘gear’ icon and go to Drive Settings, \n\nwhere you can move the\
