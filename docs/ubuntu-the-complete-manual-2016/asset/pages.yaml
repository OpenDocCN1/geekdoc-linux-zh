  md: "![](img/a6bf9da4751f37b25a0d6611dc73918d_79_0.png)\n\n**Ubuntu essentials**\n\
    \n**80**\n\nWork with Universal Access\n\nWork with \n\nUniversal Access\n\nConi\
    \ gure accessibility settings to make Ubuntu \n\nmore user friendly\n\nUbuntu\
    \ is a friendly place for everyone, including people with \n\nreduced capabilities\
    \ or disabilities. If you need to use special settings \n\nfor a more comfortable\
    \ user experience in Ubuntu, there is a \n\ndedicated subsection called Universal\
    \ Access inside System Settings. \n\nIf you want to, you can also launch it separately\
    \ by searching its \n\nname in the Dash or by using the $ unity-control-center\
    \ \n\nuniversal-access command in the terminal. Universal Access \n\nconsists\
    \ of a large number of settings divided into four individual \n\ncategories: seeing,\
    \ hearing, typing, and pointing and clicking. Each \n\ncategory has switches that\
    \ improve usability and make the most \n\nout of Ubuntu. Ubuntu ships with a high\\\
    -contrast icon theme and \n\nthe Large Text switcher, both of which help visually\
    \ impaired people \n\nsee more on their screens. There is also a screen reader\
    \ (Fig 1), which \n\npronounces window titles and messages, an on\\-screen keyboard,\
    \ \n\nadvanced sound notii cations and more.\n\nUsing the keyboard as a cursor\n\
    \nIf moving a mouse in a regular manner is uncomfortable, you can \n\ncontrol\
    \ the mouse cursor from a keyboard using the arrows. This \n\naccessibility feature\
    \ can be enabled by going to the Pointing & \n\nClicking tab and putting the Mouse\
    \ Clicks switcher on. There are \n\nalso two ways to trigger a mouse click without\
    \ clicking its buttons. \n\nThe i rst tweak is to simulate secondary click in\
    \ double\\-clicking by \n\nholding the left mouse button down for some time. Second,\
    \ you \n\ncan simulate a click by hovering a mouse cursor over an item and \n\n\
    waiting longer. For either, there are helpful sliders that let us adjust a \n\n\
    delay. Regular mouse settings in the Mouse & Touchpad subsection \n\nalso contribute\
    \ to a more l exible mouse performance. There you \n\ncan lower the double\\-click\
    \ delay, change cursor speed and switch \n\nbuttons arrangement if you need a\
    \ mouse for left\\-handed use.\n\nThe Typing tab in Universal \n\nAccess houses\
    \ a list of options \n\nthat help input data using \n\na keyboard for those who\
    \ \n\nare unable to type and need \n\nassistance (Fig 2). The most \n\nnoticeable\
    \ option here is the \n\non-screen keyboard switch \n\nthat enables text input\
    \ using \n\nmouse clicks. The on-screen \n\nkeyboard will appear after \n\nyou\
    \ re-log in to a session. It \n\nlooks like a desktop widget \n\nthat flows at\
    \ the top of any \n\nwindows. There are various \n\nkeyboard tweaks that can \n\
    \nease input in some cases, \n\nsuch as sticky keys (treats a \n\nsequence of\
    \ modifier keys as \n\na key combination), slow keys \n\n(puts a delay between\
    \ when \n\na key is pressed and when it \n\nis accepted) and bounce keys \n\n\
    (ignores double pressing a \n\nkey in a short period). This \n\ncan be complemented\
    \ with \n\nextra audible notifications, \n\nsuch as beeping when \n\ncertain keys\
    \ are pressed. \n\nThe on-screen keyboard in \n\nUbuntu can also be used \n\n\
    for extra security if you feel \n\nlike the use of a physical \n\nkeyboard can\
    \ compromise \n\nyour privacy.\n\nType the way you \n\nneed to"
