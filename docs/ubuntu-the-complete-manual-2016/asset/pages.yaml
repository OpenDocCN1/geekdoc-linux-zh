    Manage images with Shotwell\n\n**121**\n\n**Last Import view**\n\nClick this part\
    \ of your image \n\nlibrary to put focus on the latest \n\naddition. This can\
    \ be helpful \n\nif you want to see what items \n\nwere added to the collection\
    \ \n\nlast – especially handy if you’re a \n\n‘lazy tagger’\n\n**Border indicator**\n\
    \nImages can be selected for \n\nbulk processing. Shotwell \n\ndisplays selected\
    \ pictures with \n\na blue frame – using an overlay \n\nwould affect the originality\
    \ of \n\nthe pictures at hand\n\n**Camera list**\n\nThis part of the main list\
    \ \n\nprovides an overview of all \n\nexternal storage media currently \n\nconnected\
    \ to your workstation. \n\nIt is a prime destination for \n\nstarting import operations\n\
    \nOrganise your shots Store and retrieve your pictures in no time at all\n\n**Events\
    \ list**\n\nImages get catalogued according \n\nto the date when they were \n\n\
    taken. Click any of them in order \n\nto limit the content shown in the \n\npicture\
    \ area\n\n**Tag list**\n\nWhat the Events list is \n\nto events, the Tags list\
    \ is \n\nto tags: a really helpful \n\ntool for singling down on \n\ninteresting\
    \ image material\n\n**Zoom lever**\n\nThe size of the image \n\nelements in the\
    \ display \n\narea can be adjusted to \n\nyour needs. Simply drag \n\nthe lever\
    \ to the left or \n\nright in order to find the \n\ncorrect balance between \n\
    \ninformation density and \n\npicture quality\n\n**Image display**\n\nShotwell\
    \ displays the \n\ncontents of the currently \n\nselected section on a grey \n\
    \nbackground. Double-click \n\nany of the pictures in \n\norder to open them for\
    \ \n\nfull-screen viewing\n\n**SQLite powered**\n\nShotwell stores its data in\
    \ a \n\nSQLite database. This leads \n\nto significant performance \n\nincreases\
    \ over traditional \n\nflat file storage – and might \n\neven permit networking\
    \ to \n\nbe added one day"
