  md: "![](img/a6bf9da4751f37b25a0d6611dc73918d_44_0.png)\n\n**45**\n\n**03**\n\n\
    Let ‘s now see the various important directories present under the root directory\
    \ and get an idea of which ones \n\nserve what purpose. \n\n**/bin** is a place\
    \ for most commonly used terminal commands, such as ls, mount, rm, etc.\n\n**/boot** contains\
    \ files needed to start up the system, including the Linux kernel, a RAM disk\
    \ image \n\nand bootloader configuration files.\n\n**/dev** contains all device\
    \ files, which are not regular files but instead refer to various hardware devices\
    \ on the system, \n\nincluding hard drives.\n\n**/etc** contains system-global\
    \ configuration files, which affect the system’s behaviour for all users.\n\n\
    **/home** this is the place for users’ home directories.\n\n**/lib** contains\
    \ very important dynamic libraries and kernel modules.\n\n**/media** is intended\
    \ as a mount point for external devices, such as hard drives or removable media\
    \ (CDs, DVDs etc).\n\n**/mnt** is also a place for mount points, but it is dedicated\
    \ specifically to ‘temporarily mounted’ devices such as network \n\nfile systems.\n\
    \n**/opt** can be used to store additional software for your system which is not\
    \ handled by the package manager.\n\n**/proc** is a virtual file system that provides\
    \ a mechanism for the kernel to send information to processes.\n\n**/root** is\
    \ the superuser’s home directory; it’s not in /home/ to allow for booting the\
    \ system even if /home/ is not \n\navailable.\n\n**/run** is a temporary file\
    \ system available early in the boot process where ephemeral run-time data is\
    \ stored. Files under \n\nthis directory are removed or truncated at the beginning\
    \ of the boot process. \n\n**/sbin** contains important administrative commands\
    \ that should generally only be employed by the superuser.\n\n**/srv** can contain\
    \ data directories of services such as HTTP (/srv/www/) or FTP.\n\n**/sys** is\
    \ a virtual file system that can be accessed to set or obtain information about\
    \ the kernel’s view of the system.\n\n**/tmp** is a place for temporary files\
    \ used by applications.\n\n**/usr** contains the majority of user utilities and\
    \ applications, and partly replicates the root directory structure, containing\
    \ \n\nfor instance, among others, /usr/bin/ and /usr/lib.\n\n**/var** is dedicated\
    \ to variable data, such as logs, databases, websites and temporary spool (email\
    \ etc) files that persist from \n\none boot to the next. A notable directory it\
    \ contains is /var/log, where system log files are kept.\n\nVarious directories\
    \ under /\n\nUnderstanding the file system\n\n**Ubuntu essentials**\n\n**Fig 2**\
    \ You may be more \n\nfamiliar with the folder layout"
