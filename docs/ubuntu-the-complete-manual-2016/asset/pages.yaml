  md: "![](img/a6bf9da4751f37b25a0d6611dc73918d_31_0.png)\n\n**Ubuntu essentials**\n\
    \nExplore system details \n\nand change some defaults\n\nSometimes you need to\
    \ know more information about your version of \n\nUbuntu. Is it 32 or 64 bit?\
    \ How much memory is there in your PC? In order \n\nto prevent you from getting\
    \ lost, there is a dedicated subsection in System \n\nSettings that’s called Details.\
    \ The main screen in Details shows a summary \n\nof the most important specs of\
    \ your system, including CPU name and clock, \n\ngraphics driver, hard disk volume\
    \ and more (Fig 1). You can also update your \n\nsystem with the Install Updates\
    \ button on the right. There are other useful \n\ntabs in Details – see the list\
    \ on the left side of the screen. Go to Default \n\nApplications to change your\
    \ default web browser, email client, music player \n\nor image viewer. Similarly,\
    \ on the Removable Media tab you can define \n\nwhat Ubuntu should do when an\
    \ optical disc (CD/DVD/BD) is inserted. \n\nAgain, all changes are then applied\
    \ immediately.\n\nManage Ubuntu users\n\nIf your PC is mainly used as a \n\nprivate\
    \ or personal computer then \n\nperhaps you are the only user in \n\nthe system.\
    \ Here’s what you do \n\nyou need to do if you want to \n\ncreate another user\
    \ for testing \n\npurposes, or for guest logins. If \n\nthere is actually already\
    \ more than \n\none person that accesses the PC \n\n(in a public place for example),\
    \ \n\nyou’ll need the correct number \n\nof login accounts. These are \n\nmanaged\
    \ in the User Accounts \n\nsubsection. By default, you can \n\nonly see the list\
    \ and the settings, \n\nbut can’t change anything. To add \n\nor remove users\
    \ you must click \n\nthe ‘Unlock’ button and enter the \n\nroot password. After\
    \ that you’ll \n\nbe able to click the tiny ‘+’ and ‘-‘ \n\nbuttons displayed\
    \ at the lower \n\nleft corner of the screen, watch \n\nan activity log of other\
    \ users (the \n\nHistory button) and toggle their \n\nautomatic login.\n\nDiscover\
    \ System Settings\n\n“Sometimes you need to know more \n\ninformation about your\
    \ version of \n\nUbuntu. Is it 32 or 64 bit? How much \n\nmemory is there in your\
    \ PC? To avoid \n\ngetting lost, head to System Settings”\n\n**32**\n\n**Fig 1**\
    \ See system details in System Settings"
