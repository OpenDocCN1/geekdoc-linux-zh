  md: "![](img/a6bf9da4751f37b25a0d6611dc73918d_67_0.png)\n\nSecure files with Déjà\
    \ Dup\n\n**68**\n\n**Ubuntu essentials**\n\n**01**\n\nWe most commonly seek \n\
    \nto back up photos, videos, \n\noffice documents and application \n\nsettings.\
    \ While this is true for home \n\ncomputers, let us also complement \n\nthis with\
    \ targets that are more relevant \n\nto production servers and corporate \n\n\
    usage in general, such as databases, \n\ndumps, collected data files and so \n\
    \non. Always evaluate the size of the \n\nproposed backup beforehand and \n\n\
    make sure it fits the target storage. \n\nYou’ll definitely need extra space if\
    \ you \n\ndo incremental backups, or decide to \n\ninclude directories like ~/Downloads\
    \ \n\nthat usually get populated with lots of \n\nlarge files.\n\nSelect what\
    \ to backup\n\n**02**\n\nIf you store a backup copy \n\non the same drive with\
    \ the \n\noriginal files, it can only save you from \n\naccidental deletion. It\
    \ is therefore \n\nhighly recommended to save backups \n\nto another physical\
    \ drive or disk to \n\nprotect yourself from main hard drive \n\nfailure. For\
    \ frequent incremental \n\nbackups, external hard drives are \n\nknown to work\
    \ better compared \n\nto flash drives – the latter have a \n\nlimited lifetime\
    \ and don’t like too \n\nmany overwrites. You can also use a \n\nremote destination\
    \ via SSH, WebDAV \n\nor Windows shared folder. You can \n\nchoose the right place\
    \ via the Storage \n\nLocation menu.\n\nChoose a destination \n\nSet up your backup\
    \ correctly with Déjà Dup\n\nGet the settings right to secure your data\n\n**03**\n\
    \nIf we had a crystal ball, we’d \n\nuse it. But the fact is that \n\nnobody knows\
    \ when things will \n\ngo wrong. To protect yourself from \n\nexperiencing that\
    \ sinking feeling \n\nwhen you discover your backups are \n\nbroken, go for a\
    \ test restore at the very \n\nbeginning. It’s a good idea to set up a \n\nsmall\
    \ backup task and run it. After that, \n\ngo to the Overview section and press\
    \ \n\nthe Restore button. Déjà Dup will \n\nguide you with a simple wizard, where\
    \ \n\nyou’ll be able to choose the location \n\nof a backup and then select a\
    \ date, \n\nfrom which a copy will be derived. \n\nGo ahead with a real\\-world\
    \ backup if \n\neverything restores fine.\n\nMake a test restore \n\n“If we had\
    \ a crystal ball, we’d use it. But the fact is that nobody \n\nknows when things\
    \ will go wrong”\n\n**Fig 1 **Choose to restore specific \n\nfiles individually"
