  md: "![](img/a6bf9da4751f37b25a0d6611dc73918d_48_0.png)\n\n**49**\n\nSharing files\
    \ in Ubuntu\n\n**Ubuntu essentials**\n\n**Standard toolbar**\n\nIn the top-right\
    \ you will find \n\nquick links to settings, add file \n\nand help options\n\n\
    **Shared files**\n\nHere you can see the list of \n\nall the files that are available\
    \ \n\nunder Samba sharing\n\n**Permissions**\n\nIf you’d like the directory you\
    \ are \n\nsharing to be writable/visible, just \n\ntick the corresponding checkboxes\n\
    \n**Menu bar**\n\nThis section has the basic settings to add \n\nfiles to share\
    \ and set preferences like \n\nserver group and view all Samba users\n\n**Share\
    \ name**\n\nYou can set the name for the \n\ndirectory selected above in \n\n\
    this section\n\n**Save or cancel changes**\n\nClick OK in order to save the changes\
    \ to the \n\nSamba configuration file and start sharing. If \n\nyou hit Cancel,\
    \ the changes are discarded \n\n**Description**\n\nSet the description for the\
    \ \n\nshared directory here\n\n**Samba share directory**\n\nOnce you click on\
    \ ‘Add file to share’, \n\nyou’ll get a pop-up. In the Directory \n\nsection,\
    \ just browse and select the \n\ndirectory you’d like to share\n\nSharing files\
    \ with Samba GUI Learn to share iles with Samba\n\n**guest ok:** allows clients\
    \ to connect to the share without supplying a password.\n\n**read only:** determines\
    \ if the share is read only or if write privileges are granted. \n\nWrite privileges\
    \ are allowed only when the value is no, as is seen in this example. If \n\nthe\
    \ value is yes, then access to the share is read only.\n\n**create mask: **determines\
    \ the permissions new files will have when created.\n\nNow Samba is configured,\
    \ the directory needs to be created and permissions \n\nchanged. In a terminal,\
    \ enter:\n\n $ sudo mkdir -p /srv/samba/share \n\n $ sudo chown nobody:nogroup\
    \ /srv/samba/share/ \n\nFinally, restart Samba to enable the new configuration:\n\
    \n $ sudo restart smbd \n\n $ sudo restart nmbd"
