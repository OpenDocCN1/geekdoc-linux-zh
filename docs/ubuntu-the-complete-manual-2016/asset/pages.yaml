  md: "![](img/a6bf9da4751f37b25a0d6611dc73918d_56_0.png)\n\n**57**\n\nUsing Nano\n\
    \nLooking inside a file is all very well, but often we need to quickly change\
    \ \n\nsomething inside it. \n\nIn this example, we’re going to use Nano, a command-line\
    \ text editor (Fig \n\n4). There are many more powerful editors – and many a little\
    \ friendlier, too \n\n– but Nano is included in Ubuntu, and many other flavours\
    \ of Linux, so it’s \n\nhandy to know the basics.\n\nWe’ll edit the ~/.bashrc\
    \ file, a collection of customisations for the shell \n\nenvironment; don’t worry\
    \ that much of it won’t yet make sense. To offset \n\nthe risk of damage to your\
    \ command environment, back up the file first: cp \n\n.bashrc .bashrc.bak – then\
    \ nano .bashrc. \n\nFind the section with the alias commands near the end. Note\
    \ that the \n\nones with a # in front of them are inactive (said to be commented\
    \ out) \n\n– remove the # to get one to work next time you log in or open a new\
    \ \n\nterminal session.\n\nYou can use the arrows to navigate to the text you\
    \ want to edit; delete \n\nand type in new text as required. Nothing too strange\
    \ so far, until you’ve \n\nfinished: note those two lines at the bottom of letters\
    \ preceded by a ^ \n\n(caret). These are the keyboard commands – the ^ represents\
    \ the Ctrl key – \n\ntype ^O (hold down the Ctrl key and hit O), and your work\
    \ will be saved; hit \n\n^X and you’ll exit Nano.\n\nYou can set a temporary alias\
    \ directly, which will last until you close the \n\nterminal down (Fig 5):\n\n\
    \ alias myplace=’ls -lAhF /home/richard/’\n\n**Fig 4 (above)** Nano is included\
    \ in \n\nUbuntu and most other Linux distros \n\nby default\n\nGet to grips with\
    \ the Linux command line\n\n**Ubuntu essentials**"
