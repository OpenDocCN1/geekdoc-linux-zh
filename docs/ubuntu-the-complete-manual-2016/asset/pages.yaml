  md: "![](img/a6bf9da4751f37b25a0d6611dc73918d_84_0.png)\n\n**Ubuntu essentials**\n\
    \n**85**\n\nConnect with Online Accounts\n\nConnect to your Google account\n\n\
    Online Accounts ofers the most comprehensive integration with \n\nGoogle services.\
    \ If you have a Google account (using Gmail for \n\nexample), you can beneit from\
