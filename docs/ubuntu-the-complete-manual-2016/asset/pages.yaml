  md: "![](img/a6bf9da4751f37b25a0d6611dc73918d_76_0.png)\n\n**Ubuntu essentials**\n\
    \n**77**\n\nUse the Disk Usage Analyzer\n\nDive into statistics \n\nThere are\
    \ no limitations with which directory you \n\nwant to analyse. Disk Usage Analyzer\
    \ lets you \n\nopen any directory, be it a local or remote one. \n\nClick the\
    \ small ‘gear’ icon in the top\\-right corner \n\nto open the desired location.\
    \ If it is a remote one, \n\nplease use the ‘Scan Remote Folder’ option and \n\
    \nprovide the correct address, for example Samba \n\nshare addresses start with\
    \ smb://. \n\nWhen you see the resulting ring chart, hover \n\nyour mouse over\
    \ a slice to see the details. Click \n\na slice to dive in and set it as a top\
    \ directory. The \n\nchart will adjust automatically and you will see \n\nmore\
    \ details about what content inputs to overall \n\ndirectory weight. The left\
    \ part of the screen \n\ncompliments the chart with a tree view, with \n\nextra\
    \ columns for usage percentage, size and \n\nnumber of items.\n\nSwitch between\
    \ graphical views \n\nThis ring chart isn’t the only way you can get a \n\ngraphical\
    \ representation of data. In the lower right\\-\n\nhand corner of the application\
    \ you’ll notice two \n\nbuttons that let you switch between ring chart \n\nand\
    \ treemap modes. Treemap is an alternative \n\nmethod of data visualisation with\
    \ a strong focus \n\non the size of units. \n\nThe main diference between a ring\
    \ chart and a \n\ntreemap is that the latter shows all units together \n\nalong\
    \ with subdirectories and large iles. This \n\nactually works better when you\
    \ need to estimate \n\nthe relative sizes of diferent units. A treemap \n\nmay\
    \ be hard to understand when you irst look \n\nat it, but it does help when you\
    \ know how it’s \n\nbuilt. Disk Usage Analyzer irst draws the largest \n\nrectangle\
    \ for your top\\-level drive or directory \n\nand then recursively subdivides\
    \ it into smaller \n\nrectangles according to the size of the content \n\ninside.\
    \ Larger rectangles display their names \n\ninstantly, others will give more information\
    \ once \n\nhovered with a mouse.\n\n**Fig 1 (above)** Your usage data is broken\
    \ down \n\nvisually with Disk Usage Analyzer"
