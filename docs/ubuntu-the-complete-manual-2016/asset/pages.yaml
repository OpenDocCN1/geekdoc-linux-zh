  md: "![](img/a6bf9da4751f37b25a0d6611dc73918d_83_0.png)\n\n**Ubuntu essentials**\n\
    \n**84**\n\nConnect with Online Accounts\n\nConnect with \n\nOnline Accounts\n\
    \nEnjoy a more convenient integration with online services in Ubuntu\n\nOnline\
    \ social services are already a part of everyday life for an average user. Most\
    \ of us use these services \n\nfor connecting with friends and relatives, for\
    \ sharing photos, videos and other iles. Almost every online \n\nservice requires\
