  md: "![](img/a6bf9da4751f37b25a0d6611dc73918d_42_0.png)\n\nUnderstanding the file\
    \ system\n\n**43**\n\n**First column**\n\nThe first character indicates \n\nwhether\
    \ it is a directory or \n\na file. The other nine characters \n\nindicate the\
    \ permissions \n\nfor file owners, groups and \n\neverybody else\n\n**Second column**\n\
    \nThis column indicates the \n\nnumber of links or directories \n\ninside the directory\n\
    \n**Third & fourth **\n\n**column**\n\nThe third column shows the \n\nowner of\
    \ the file, and the \n\nfourth column indicates the \n\ngroups that the file belongs\
    \ to\n\n**File listing command**\n\n‘ls’ lists all the files in the \n\ncurrent\
    \ directory and the ‘\\-la’ \n\nextension shows the files in \n\nlong format,\
    \ along with all the \n\nhidden files. When executed \n\nfrom the root directory,\
    \ it \n\nshows all the directories in the \n\ntop-level hierarchy\n\n**Special\
    \ files**\n\nWherever you issue the ‘ls’ \n\ncommand in Linux, you’ll see \n\n\
    these two files listed on the \n\ntop. However, these aren’t \n\nvisible if you\
    \ inspect the same \n\ndirectory via the GUI. The \n\nsingle dot indicates the\
    \ current \n\ndirectory; double dot, the \n\nparent directory\n\n**Fifth column**\n\
    \nThis column shows the size \n\nin bytes. You may modify \n\nthis by using the\
    \ ‘\\-h’ option \n\ntogether with ‘\\-l’; this will have \n\nthe output in kB,\
    \ MB and GB \n\nfor a better understanding \n\nof the size\n\n**Sixth column**\n\
    \nThis shows the timestamp \n\nof the last modification of \n\nthe directory\n\
    \n**File names**\n\nThis is where all the directory/\n\nfile names are listed.\
    \ You can \n\nsee all the top-level Linux \n\ndefault directories here\n\n“Ubuntu\
    \ (like all Unix-like systems) organises iles in a \n\nhierarchical tree, where\
    \ relationships are thought of in terms of \n\nchild and parent”\n\n**Ubuntu essentials**\n\
    \nUnderstand file listing Learn the meaning of each column in the ile listing\
    \ output"
