  md: "![](img/a6bf9da4751f37b25a0d6611dc73918d_28_0.png)\n\n**29**\n\n**04**\n\n\
    The Unity desktop lets you assign an action to any corner of the screen, \n\n\
    plus to any of its sides. In order to do this, we need to access advanced \n\n\
    window manager settings. Launch Unity Tweak Tool and go to Window \n\nManager>Hotcorners.\
    \ There are eight areas (four corners and four sides) with \n\na drop-down menu\
    \ next to each, letting you choose what action will be \n\nperformed once you\
    \ move your mouse to the respective area of the screen. \n\nYou can set a corner\
    \ or a side to toggle the desktop (for example, minimise all \n\nwindows or bring\
    \ them back on), spread windows or show workspaces. All \n\nchanges are applied\
    \ instantly, and you can check by driving your mouse to a \n\ncorner or side where\
    \ an action has been assigned.\n\nUse hot corners\n\n**05**\n\nThe ‘System Tray’\
    \ area resides \n\nthe far-right corner of the \n\ntop bar. Some indicators can\
    \ be \n\nconfigured individually but for more \n\ncontrol you will need to deal\
    \ with \n\ndconf-editor (Fig 2). This twin-panel \n\napp has a categories list\
    \ on the left \n\nand the contents on the right allows \n\nyou adjust aspects\
    \ of Unity indicators. \n\nGo to com>canonical>indicator and \n\nexplore the parameters\
    \ of each one. \n\nYou can turn indicator presence on \n\nthe top bar on and off\
    \ by toggling \n\nthe ‘visibility’ parameter and change \n\nindicators’ display\
    \ format by playing \n\nwith ‘show-\\*’ parameters. This way \n\nyou can keep\
    \ your system tray area \n\nclean and tidy.\n\nRule the indicators\n\nCustomising\
    \ the desktop\n\n“Check hot corners have been applied \n\nby driving your mouse\
    \ to a corner or side \n\nwhere an action has been assigned”\n\n**Ubuntu essentials**\n\
    \n**Fig 2 **Get more customisation \n\ncontrol with dconf Editor"
