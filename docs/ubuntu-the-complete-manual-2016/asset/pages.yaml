  md: "![](img/a6bf9da4751f37b25a0d6611dc73918d_74_0.png)\n\n**Ubuntu essentials**\n\
    \n**75**\n\nUnleash the Archive Manager\n\nOpen or view an archive\n\nOpening\
    \ an archive is simple: just double\\-click it or use the ‘Open \n\nwith Archive\
    \ Manager’ item in the right\\-click menu of an archive. If \n\nits icon looks\
    \ like a box, it means that most probably such an archive \n\nwill be supported.\
    \ File Roller supports ZIP, RAR, GZIP, BZIP. 7Z, JAR, \n\nXZ and many other formats,\
    \ for both opening and compressing, \n\nand also AR and ISO formats in read\\\
    -only mode. You can also go the \n\nother way around: open the empty File Roller\
    \ window and use its \n\nOpen button to browse and select an archive. There is\
    \ a dif erence \n\nbetween opening and viewing an archive. While it is clear what\
    \ \n\nthe i rst one means, the second lets you look through the entire \n\nlist\
    \ of i les and see the whole archive’s content in a single view. For \n\ninstance,\
    \ if there are many subdirectories in your archive, you may \n\nwant to select\
    \ View\\>View All Files and see everything as a single list. \n\nFile Roller adds\
    \ the extra Location column to help you see which i le \n\nis where.\n\nThe reason\
    \ why you may need to \n\ncreate an archive can vary. Firstly, \n\nan archived\
    \ file is always smaller \n\nthan the original one, so the \n\nsimplest goal is\
    \ to save some disk \n\nspace. This doesn’t help much \n\nwith photos and videos,\
    \ because \n\nthey are already compressed \n\nand so adding them to an \n\narchive\
    \ doesn’t save much space. \n\nHowever, office documents or \n\nuncompressed media\
    \ files (DOC, \n\nXLS, WAV, TIFF and so on) show \n\na splendid compression ratio,\
    \ \n\nup to 90-95 per cent. Secondly, \n\narchiving merges many files \n\ninto\
    \ one archive, which is very \n\nconvenient. For instance, copying \n\na thousand\
    \ of small files can \n\ntake a long time (it drives most \n\nfile systems crazy),\
    \ but when \n\ncompressed into an archive, \n\nyou will wait for just a couple\
    \ of \n\nseconds. To transfer files with \n\nsymlinks and UNIX-specific \n\nattributes\
    \ (like permissions and \n\nextra flags) to a FAT32 or NTFS \n\nvolume, you should\
    \ also archive \n\nsuch files first. Compress any file \n\nor directory using\
    \ the Compress \n\nitem in the right-click menu of \n\nan item, or use the respective\
    \ \n\nfeature inside File Roller.\n\nCreate an archive \n\n**Fig 2** Protect files\
    \ with a password\n\n**Fig 1** Compress files with the archive manager"
