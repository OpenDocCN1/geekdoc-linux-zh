    \ 1). Here you \n\ncan let the installer automatically guess what OS you already\
    \ have \n\nand how to keep it intact. It’s safe, and you’ll be able to deine how\
    \ \n\nmuch space you want to allocate for Ubuntu in the next step.\n\nNote the\
    \ second option with the red Warning label – we are \n\ngoing to install Ubuntu\
    \ and keep Windows working, so do not \n\nchoose this. The last option is a path\
    \ to a more expert-like drive \n\nallocation program. Dual-booting in UEFI mode\
    \ introduces more \n\nroutines for the Ubuntu installer. If you’re unsure what\
    \ to choose, \n\ngo with auto mode. If your system uses a BIOS interface, you\
    \ can \n\nrepartition your drive manually.\n\nThe automatic partitioning \n\n\
    option in the Ubuntu \n\ninstaller is definitely more \n\ncomfortable for non-tech-\n\
    \nsavvy users, but it does have \n\ncertain limitations, such as \n\nthe inability\
    \ to add an extra \n\nHome partition or define \n\nthe swap space manually. \n\
    \nLet’s use the fully fledged \n\npartitioning method by \n\nchoosing the ‘Something\
    \ \n\nelse’ option in the previous \n\nstep, or by clicking the \n\n‘Advanced\
    \ partitioning tool’ \n\nlink in the ‘simple’ mode. \n\nFirst, you’ll need to\
    \ resize \n\nthe NTFS volume and make \n\nit smaller by some number \n\nof gigabytes.\
    \ Make sure that \n\nyou don’t have excessive \n\nhard disk fragmentation \n\n\
    in Windows, otherwise \n\nyou may turn your NTFS \n\nvolume in Ubuntu installer\
    \ \n\nunusable. Try to guess how \n\nmuch space you’ll need in \n\nthe unallocated\
    \ area after \n\nshrinking. For instance, \n\n10GB looks like the bare \n\nminimum\
    \ – go with at least \n\ntwice as much as that for the \n\nUbuntu root partition.\
    \ Think \n\nahead to cover aspects like \n\nswapping and a separate \n\npartition\
