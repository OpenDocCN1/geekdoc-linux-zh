  md: "![](img/a6bf9da4751f37b25a0d6611dc73918d_80_0.png)\n\n**Ubuntu essentials**\n\
    \n**81**\n\nWork with Universal Access\n\n“If you need \n\nto use special \n\n\
    settings for a \n\nmore comfortable \n\nuser experience \n\nin Ubuntu, there \n\
