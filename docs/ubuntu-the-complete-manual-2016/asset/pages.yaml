  md: "![](img/a6bf9da4751f37b25a0d6611dc73918d_85_0.png)\n\n**Ubuntu essentials**\n\
    \n**86**\n\nUse System Monitor\n\nUse System \n\nMonitor\n\nView and manage system\
    \ resources using \n\n \n\nthe System Monitor app\n\nSystem Monitor is a tool\
    \ for managing running processes and \n\nmonitoring system resources. It is one\
    \ of many accessories \n\nborrowed from the Gnome desktop. You can run from Dash\
    \ or \n\nfrom command line ($ gnome-system-monitor). The application \n\nlooks\
    \ and works similarly to its analogues in Windows and OS X, and \n\ncontains three\
    \ logical tabs: Processes, Resources and File systems. \n\nLaunch the application\
    \ with a specii c tab showing by using \n\ncommand line parameters ‘-p’ for processes,\
    \ ‘-r’ for resources and \n\n‘-f’ for i le systems. Launching with the File Systems\
    \ tab shown can \n\nbe done with the ‘$ gnome-system-monitor -f’ command line.\
    \ \n\nSystem Monitor is used to tackle system sluggishness. You could \n\nalso\
    \ use the CPU load graph to i nd out if hardware-accelerated \n\nvideo output\
    \ really works.\n\nManage system processes\n\nEach application in Linux creates\
    \ at least one process. Some \n\nprocesses refer to graphical applications, others\
    \ run in the \n\nbackground and provide service functionality. With the help of\
    \ \n\nSystem Monitor you can view the list of all processes, know their \n\nnames,\
    \ i nd out which process belongs to which users, detect \n\nprocesses that devour\
    \ too much CPU cycles or draw high levels \n\nof RAM, associate processes with\
    \ their low-level IDs and manage \n\nprocess priority. Normally you’ll see a list\
    \ of processes sorted \n\nby name. Note that you can click the name of a column\
    \ to sort \n\nprocesses by it. It is very helpful to sort them by CPU percentage\
    \ \n\nor memory usage. If a process belongs to you (or if you have the \n\npermissions),\
    \ you can kill it or lower its priority. Select the process \n\nyou want to get\
    \ rid of and press the End Process button in the \n\nlower right corner of the\
    \ window. Right-click the process and select \n\nthe Change Priority menu to alter\
    \ its priority. \n\nThe File Systems tab displays \n\na table of all file systems\
    \ that \n\nare currently mounted in \n\nUbuntu. You can find out the \n\ndevice\
    \ name, file system type, \n\nmount point, total capacity \n\nand available disk\
    \ space. Of \n\ncourse, you can find out a \n\nsimilar set of information in \n\
    \nUbuntu’s disk utility (Disks, \n\np.50), but System Monitor \n\noffers a more\
    \ comfortable \n\nview, which lets you quickly \n\nanalyse how much space is \n\
    \nleft on your device and sort \n\nthem by various criteria. \n\nThe Used column\
    \ doubles \n\nthe information about free \n\ndisk space, but shows it in \n\n\
    the form of a percentage \n\nbar. When the bar fills up \n\nto approximately 90\
    \ per \n\ncent or more, it means that \n\nyou are running low on \n\nfree disk\
    \ space, which can \n\nbe troublesome for certain \n\nworkflow scenarios. Ubuntu\
    \ \n\ncannot work properly if the \n\nroot partition (/) gets 100 per \n\ncent\
    \ full. You can also check \n\nfor free disk space in terminal \n\nby using the\
    \ ‘$ df’ command \n\n(disk free), although it doesn’t \n\nlet you sort or reorder\
    \ any of \n\nthe lines.\n\nFind out details \n\nabout file systems"
