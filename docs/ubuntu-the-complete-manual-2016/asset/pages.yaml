  md: "![](img/a6bf9da4751f37b25a0d6611dc73918d_7_0.png)\n\n**Getting started**\n\n\
    Get to know Ubuntu\n\n**8**\n\nGet to know \n\nUbuntu\n\nThis free, open-source\
    \ operating system has gained \n\na lot of momentum in recent years\n\nUbuntu\
    \ is a user-friendly Linux-based operating system that has \n\nfound its place\
    \ in every corner of the world. Best of all, Ubuntu is \n\nabsolutely free, including\
    \ future updates. It is also extremely light \n\non PC hardware, so you can install\
    \ it on computers that are three \n\nto four years old and it’ll still run smoothly.\
    \ So it’s for good reason \n\nthat Ubuntu is the most widely used Linux operating\
    \ system – \n\nfor desktops and in the cloud. It boasts both community and \n\n\
    professional support, and Ubuntu is suitable for both desktop and \n\nserver use.\
    \ But that’s not all:\n\nUbuntu is everywhere. Almost all computer manufacturers\
    \ are \n\nshipping models based on Ubuntu.\n\nUbuntu is well supported. Few other\
    \ Linux distros provide the \n\nsame kind of long-term support. It is more important\
    \ than ever to \n\nprovide long-term support when it comes to open source projects.\n\
    \nUbuntu is easy to use. It’s easy to pick up and use, even if you \n\ncome from\
    \ a Windows background (Fig 1). \n\nUbuntu is pretty stable. For most users, Ubuntu\
    \ just works. This is \n\nbecause the OS is being tweaked and i xed all the time.\
    \ Since all the \n\nlatest packages are not integrated during the development\
    \ cycle, it \n\nalso helps in providing better stability.\n\n**Fig 1 (right)**\
    \ The Ubuntu interface is easy \n\nto navigate and use"
