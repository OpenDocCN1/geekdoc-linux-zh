  md: "![](img/a6bf9da4751f37b25a0d6611dc73918d_49_0.png)\n\nManage drives with Disks\n\
    \nManage drives \n\nwith Disks\n\nManage hard drives, SSDs and removable media\
    \ \n\nwith Ubuntu’s Disks tool\n\nDisks manages both local and removable drives,\
    \ repartitioning \n\nthem as well as doing backup images and restoring from them.\
    \ It \n\nis quite a straightforward tool, with device list on the left and the\
    \ \n\ncurrently selected device’s details on the right. You can use it to i nd\
    \ \n\nout the model and size of your hard drive, how many partitions it \n\nhas,\
    \ its serial number, health status (SMART) and more. Users often \n\nlaunch Disks\
    \ when they need to do some manipulations with the \n\nhard drives, SSDs or removable\
    \ mass storage with the USB interface. \n\nIts illustrative visualisation of a\
    \ drive’s volumes is really useful. If \n\nyou are not aware about Primary or\
    \ Extended partitions, you will \n\ninstantly catch the idea after looking at\
    \ the graphical scheme under \n\nthe ‘Volumes’ label in Disks. You can do many\
    \ advanced tasks with \n\njust a few mouse clicks, such as benchmark your drive,\
    \ put it in a \n\nstandby mode, create or delete partitions and so on.\n\nAnother\
    \ tool in Disks is its ability to create images from drives \n\n(\\*.img) and\
    \ to restore such images into other drives. This feature lets \n\nyou clone all\
    \ data, logical structure and a bootloader to, say, a newly \n\nacquired hard\
    \ drive that you wish to use as a replacement drive.\n\n**01**\n\nSometimes new\
    \ hard drives arrive with no partitions at all and Disks will \n\nshow them as\
    \ a monotonous rectangle labelled as ‘Unknown’. You may \n\nnow choose what you\
    \ want to do. if you go with an upper ‘gear’ button and \n\nformat the whole disk,\
    \ you will only create a partition table, not volumes. There is \n\nthe legacy\
    \ MBR (Master Boot Record) type, and the modern GPT (GUID Partition \n\nTable).\
    \ The first one is compatible with everything, the other is required by new \n\
    \nPCs with UEFI boot and also by large disks (>2TB). Next, you may want to create\
    \ \n\nthe actual volume by clicking on a volume-specific ‘gear’ button below and\
    \ again \n\nchoosing the Format option. If you plan to access your disk from Windows,\
    \ use \n\nthe NTFS filesystem. Otherwise, for Linux-only usage, the best option\
    \ would be to \n\ngo with Ext4.\n\nFormat a USB portable drive\n\n**50**\n\n**Ubuntu\
    \ essentials**"
