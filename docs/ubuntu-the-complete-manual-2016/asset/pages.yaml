    Listen to songs with Rhythmbox\n\n**124**\n\nListen to songs \n\nwith Rhythmbox\n\
    \nHigh-quality headphones are a great help for dealing with \n\nbackground noise\
    \ – and thanks to multi-core CPUs, playing music in \n\nthe background is simple.\n\
    \nSadly, obtaining media i les is but part of the challenge; once a \n\nfew thousand\
    \ MP3 i les populate your storage, music management \n\nbecomes a severe and annoying\
    \ problem of its own. Ubuntu \n\naddresses this problem via the Rhythmbox media\
    \ player. It is a \n\ncombination of a media database, an online radio player\
    \ and a \n\nclassic, low-resource-consumption media playback utility.\n\nGetting\
    \ started with Rhythmbox is easy: click a media i le in \n\nNautilus, and the\
    \ player will appear on-screen. Minimise it to proi t \n\nfrom background playback\
    \ – the music keeps on running even if \n\nyou close the application.\n\nSadly,\
    \ using Rhythmbox in this fashion means ignoring most of \n\nthe interesting features\
    \ of the product. Advanced users can create \n\ncustom playlists containing favourite\
    \ hits – some obscure Falco \n\ntracks provide a sure-i re way to distract yourself\
    \ from your work!\n\nIn addition to that, the program can also be used as a crossfade\
    \ \n\nengine. This means that the annoying gaps between normal MP3 \n\ni les get\
    \ “bridged over” by superimposing the songs onto one \n\nanother – it might not\
    \ be able to imitate a DJ’s handywork, but it is \n\ndei nitely is better than\
    \ nothing.\n\nUse your workstation to listen to music while \n\nyou work\n\n“Rhythmbox\
    \ is a combination of a media \n\ndatabase, an online radio player and a \n\n\
    classic, low-resource-consumption media \n\nplayback utility”"
