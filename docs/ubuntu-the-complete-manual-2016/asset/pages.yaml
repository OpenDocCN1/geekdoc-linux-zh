    \ for Unity \n\nDash and Empathy instant messaging.\n\nOnce you’ve logged in to\
    \ your Google account it will prompt \n\nyou to allow it access to manage your\
    \ emails, calendar, photos and \n\nvideos, contacts, view your data and so on.\
    \ You have to grant this \n\naccess in order to proceed. After that your list\
    \ of connected services \n\nwill be populated with everything Ubuntu supports\
    \ for Google \n\nand you can start using your favourite applications and enjoy\
    \ \n\nthem working without your Google account without any extra \n\nmovements.\
    \ Your search results can now include iles found on your \n\nGoogle Drive and\
    \ Picasa web albums. You can also start using Gmail \n\ndirectly from your Evolution\
    \ client and do much more.\n\n“Ubuntu simpliies the general experience with online\
    \ services \n\nby eliminating the need to sign into one account several times”\n\
    \nin a built-in browser window, right there in Online \n\nAccounts. You can even\
    \ add more than one \n\naccount of the same service, or add accounts \n\nfrom\
    \ various diferent services to one application. \n\nOnline Accounts lets you enable,\
    \ disable and \n\nchange options of added entries at any time. After \n\nyou are\
    \ done, you can launch Empathy and start \n\nchatting immediately.\n\nUbuntu ships\
    \ with Shotwell, \n\na photo manager, viewer \n\nand simple editor. Not only \n\
    \ncan you sort and tag images, \n\nbut also import them from \n\nexternal sources\
    \ and export \n\nto a cloud account – the latter \n\nrequires integration with\
