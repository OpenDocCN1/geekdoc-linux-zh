    \nImprove your browsing experience\n\nImportant aspects of web browsing with Firefox\n\
    \n**01**\n\nThere are steps that you will \n\nrepeat several times a day \n\n\
    without realising how much time they \n\ntake, for example, searching specific\
    \ \n\nwebsites. Instead of going to the \n\nsearch engine, finding the search\
    \ box, \n\nentering the keyword and executing \n\nthe search, you can directly\
    \ search the \n\nInternet using Firefox, while you are on \n\nany website. \n\n\
    To set this up on your browser, \n\nvisit the page on the target website \n\n\
    that has the search field you would \n\nnormally use to search the site. Hold\
    \ \n\ndown the Ctrl key and click on the \n\nSearch website from the \n\naddress\
    \ bar\n\nsearch field. Select ‘Add a Keyword’ \n\nfor this search. The ‘Add Bookmark’\
    \ \n\ndialog appears. Enter an appropriate \n\nname for the bookmark (for example:\
    \ \n\n‘Wikipedia search’). Create a keyword \n\n(like ‘wikipedia’). Select the\
    \ bookmark \n\nfolder to contain the smart keyword. \n\nClick OK. To use the created\
    \ smart \n\nbookmark, enter the keyword and \n\nsearch string in the Location\
    \ bar then \n\npress Return.\n\n**02 **\n\nPeople now use multiple \n\ndevices\
    \ to access the Internet. \n\nFirefox helps to make sure all your \n\nSync information\
    \ across \n\ndevices\n\nbookmarks, links and other things \n\nare synced across\
    \ devices seamlessly. \n\nFirefox does this with a feature called \n\nSync. It\
    \ lets you share your data and \n\npreferences (such as your bookmarks, \n\nhistory,\
    \ passwords, open tabs, Reading \n\nList and installed add-ons) across all \n\n\
    your devices. \n\nLet us see how to set up and sync \n\nan account in Firefox.\
    \ First, click on \n\nthe menu button and click ‘Sign in to \n\nSync’. The sign-in\
    \ page will open in a \n\nnew tab. Click the ‘Get Started’ button. \n\nFill out\
    \ the form to create an account \n\nand click ‘Next’. Take note of the email \n\
    \naddress and password you used; you’ll \n\nneed it later to log in. Check your\
    \ \n\nemails for the verification link and click \n\non it to confirm your email\
    \ address. \n\nBrowse the Internet with Firefox\n\n**Fig 1 (above)** It takes\
    \ a few simple steps to change our default home page"
