  md: "![](img/a6bf9da4751f37b25a0d6611dc73918d_47_0.png)\n\n**Fig 2 (above)** Use\
    \ the configuration \n\nfile to enable sharing\n\n**03**\n\nWe have learnt about\
    \ sharing files via the GUI, but directly editing the \n\nconfiguration file gives\
    \ you several more options and flexibility to implement \n\nthings exactly how\
    \ you want to. So, let us now learn how to enable sharing via the \n\nconfiguration\
    \ file. The main Samba configuration file is located in /etc/samba/smb.\n\nconf\
    \ (Fig 2). The default configuration file has a significant number of comments\
    \ \n\nin order to document various configuration directives. First, edit the following\
    \ key/\n\nvalue pairs in the \\[global\\] section of the config file:\n\n Workgroup\
    \ = EXAMPLE\n\n Security = user\n\nNote that the ‘security’ parameter is further\
    \ down in the \\[global\\] section, and is \n\ncommented by default. Also, change the\
    \ ‘workgroup’ value from EXAMPLE to \n\nsomething that better matches your environment.\
    \ Then, to share a directory, create \n\na new section at the bottom of the file,\
    \ or uncomment one of the examples:\n\n \\[share\\] \n\n comment = Ubuntu File\
    \ Server Share \n\n path = /srv/samba/share \n\n browsable = yes \n\n guest ok\
    \ = yes \n\n read only = no \n\n create mask = 0755 \n\nLet’s look at the meaning\
    \ of each section… \n\n**comment:** a short description of the share. You can\
    \ adjust it to fit your needs.\n\n**path:** the path to the directory to share.\
    \ This example uses /srv/samba/\n\nsharename because, according to the Filesystem\
    \ Hierarchy Standard (FHS), /srv is \n\nwhere site-specific data should be served.\
    \ Technically, Samba shares can be placed \n\nanywhere on the file system as long\
    \ as the permissions are correct, but adhering to \n\nstandards is recommended.\n\
    \n**browsable:** enables Windows clients to browse the shared directory \n\nusing Windows\
    \ Explorer.\n\nSamba configuration file\n\n**48**\n\nSharing files in Ubuntu\n\
    \n**Ubuntu essentials**\n\n**02**\n\nUbuntu and Gnome make it \n\neasy to access\
    \ files from a Samba \n\nserver share. To start with, go to the files \n\nexplorer\
    \ and locate the ‘Browse Network’ \n\nlink on the left vertical menu bar. Open\
    \ \n\nthis link and you will see a Windows \n\nnetwork icon. Double-click to open\
    \ it. \n\nThe next window shows all the domains/\n\nworkgroups found on your network.\
    \ \n\nInside each domain/workgroup you will \n\nsee all the computers on the domain/\n\
    \nworkgroup with sharing enabled. \n\nDouble-click on a computer icon to \n\n\
    access its shares and files.\n\nSamba clients"
