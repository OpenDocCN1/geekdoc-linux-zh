    Listen to songs with Rhythmbox\n\n**125**\n\n**Playback controls**\n\nIf it worked\
    \ for Apple’s iPod, \n\nit also works for Rhythmbox. \n\nThese three buttons control\
    \ \n\nthe playback of the currently \n\nselected file. This mini-controller \n\
    \nis handy for changing what’s \n\nplaying quickly\n\n**dbus callout**\n\nRhythmbox\
    \ integrates itself \n\ninto the dbus event system of \n\nUbuntu. This means that\
    \ the \n\ncurrently playing track gets \n\ndisplayed in an annunciator \n\ndisplay\
    \ even if Rhythmbox is \n\nnot actually in the foreground \n\nat that time\n\n\
    **Shuffle and Repeat**\n\nNo matter how long your playlist \n\nis, it eventually\
    \ reaches its end. \n\nEnabling the loop mode makes \n\nshort work of this problem,\
    \ as \n\nRhythmbox simply starts again \n\nfrom the beginning\n\nPlay tunes with\
    \ Ubuntu Use Rhythmbox to play music unnoticed\n\n**Track information**\n\nMusic\
    \ takes centre stage in \n\nRhytmBox. The two labels next \n\nto the album cover\
    \ swatch \n\nprovide information about the \n\ncurrently playing track, along\
    \ \n\nwith the album and the artist\n\n**Media storage list**\n\nThe big table\
    \ below the \n\nplayback controls provides \n\nyou with an overview of the \n\n\
    media currently scheduled \n\nfor playback. Double-click \n\nan item to start\
    \ playing it\n\n**Volume toggle**\n\nReducing Rhythmbox’s \n\nvolume independently\
    \ from \n\nthe rest of the system can \n\nbe helpful. Click the speaker \n\nsymbol\
    \ and then peruse the \n\ncontrols in the flyout to suit \n\nyour preferences\n\
    \n**Album cover **\n\n**preview**\n\nEven though music is an aural \n\nexperience,\
    \ adding some \n\nvisual spruce is totally worth it. \n\nDouble-click the small\
    \ icon to \n\nopen a pop-up with a bigger \n\nversion of the image\n\n**Seek bar**\n\
    \nEver feel like skipping over \n\nboring interludes and \n\nintros? Grab the\
    \ seek bar \n\nand drag it to the right. The \n\nplayback position will be \n\n\
    adjusted automatically"
