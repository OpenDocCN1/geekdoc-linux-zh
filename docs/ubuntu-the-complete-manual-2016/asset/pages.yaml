    \n**70**\n\nUse Startup Disk Creator\n\nUse Startup Disk \n\nCreator\n\nCreate\
    \ a bootable USB with Ubuntu \n\nor virtually any other Linux\n\nThe irst question\
    \ that would most likely emerge \n\nhere is ‘what on Earth would you need a startup\
    \ \n\ndisk for?’ Historically, Linux distributions were \n\ndistributed as CD\
    \ discs, from which you were \n\nsupposed to install them. Later on, the age of\
    \ \n\nrecordable CD/DVD discs came in and, together \n\nwith broadband Internet\
    \ access, this led Linux \n\nenthusiasts to download ISO images of their \n\n\
    favourite Linux distributions and burn them \n\nto blank discs. However, such\
    \ optical discs are \n\nalready out of trend, with USB thumb drives now \n\nbeing\
    \ the sanest media. You can use USB sticks \n\nhundreds of times with strong reliability.\n\
    \nIn Linux you can transfer an installable ISO \n\nile to a USB drive by the ‘dd’\
    \ command. It’s \n\nquite easy, but the whole procedure isn’t very \n\nconclusive\
    \ for regular users, so that’s why Ubuntu \n\nofers the handy and convenient Startup\
    \ Disk \n\nCreator utility. Its features slightly intersect with \n\nthose found\
    \ in Disks, but Startup Disk Creator \n\nfocuses on turning CD/DVD discs or downloaded\
    \ \n\nISO iles of installable Ubuntu-compatible Linux \n\ndistributions to bootable\
    \ USB media, that is it \n\nhelps you move from legacy media to more \n\ncontemporary\
    \ and eicient USB disks.\n\nStartup Disk Creator also has the ability to \n\n\
    use a newly created USB disk as a working \n\nenvironment in live mode, consequently\
    \ saving \n\nall your data persistently on a disk.\n\n**Storage persistence **\n\
    \nA very useful feature that allows \n\nsaving all your data persistently. \n\n\
    This way you can turn your live \n\nUbuntu thumb drive into a fully \n\nfeatured\
    \ portable working system\n\n**Select the disk to use **\n\nStartup Disk Creator\
    \ displays \n\navailable target USB drives \n\nhere. When you plug it in, \n\n\
    the application detects it \n\nautomatically and adds it to the list\n\n**Select\
    \ the source**\n\nHere is the list of source disc \n\nimages (.iso) and CD/DVD\
    \ discs \n\nfound on your system. Startup \n\nDisk Creator automatically updates\
    \ \n\nthe list"
