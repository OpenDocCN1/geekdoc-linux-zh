    \ and deine the categories of text that \n\nwill be spoken. It also has a built\\\
    -in help system in audible mode. Press ‘Ins + H’ or ‘Capslock + H’ to hear \n\n\
    instructions and references to other important key bindings.\n\n**Fig 2 (above)**\
    \ Customise your computing experience with typing options\n\n**Fig 1 **Tweak screen\
    \ settings for \n\nbetter usability"
