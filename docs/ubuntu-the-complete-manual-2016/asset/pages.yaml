  md: "![](img/a6bf9da4751f37b25a0d6611dc73918d_57_0.png)\n\nPermissions, please\n\
    \nUbuntu files are protected from alterations by other users on a shared \n\n\
    machine. All files and folders belong to a user – it doesn’t have to be a person,\
    \ \n\nit could be a piece of software, like a web server – and a group. Permissions\
    \ \n\non each file relate to whether a user, group or anyone else can read, write\
    \ \n\nor execute the file; this is abbreviated as rwx permissions. For directories,\
    \ \n\nexecute permission is just permission to open. Execute a file means run\
    \ it as \n\na program – so a JPG picture file doesn’t have permission to run,\
    \ nor does \n\na spreadsheet file, meaning the embedding inside one of malicious\
    \ code is \n\nmuch harder to accomplish for virus writers.\n\nFrom whichever directory\
    \ you are currently in, create an empty file – \n\ntouch testfile will do the\
    \ trick – then ls -l. The long listing shows you \n\npermissions (see opposite),\
    \ and you can see the default permissions of a \n\nnewly created file. Enter mkdir testfolder\
    \ and you can see the permissions \n\nof a newly created directory. Remove the\
    \ file with rm testfile – you’ll need \n\nthe recursive switch to remove a directory:\
    \ rm -r testfolder.\n\nNo attachment?\n\nWhile the protection offered by permissions\
    \ is very useful, they are also \n\nthere to trip up the unwary. For example,\
    \ using sudo, you may have copied \n\nfiles from another user’s home folder. Unless\
    \ you change the ownership \n\n(see opposite), you may be left scratching your\
    \ head when you try to attach \n\nthe files to an email, and they just won’t stick\
    \ – because you don’t even \n\nhave permission to read the files!\n\n**Fig 5 (above)**\
    \ Setting a temporary \n\nalias means it will last until the \n\nterminal is closed\n\
    \n**58**\n\nGet to grips with the Linux command line\n\n**Ubuntu essentials**"
