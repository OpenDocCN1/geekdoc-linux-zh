  md: "![](img/a6bf9da4751f37b25a0d6611dc73918d_73_0.png)\n\n**Ubuntu essentials**\n\
    \n**74**\n\nUnleash the Archive Manager\n\nUnleash the \n\nArchive Manager\n\n\
    Make use of this small accessory that sits inside \n\nyour Ubuntu system\n\nArchive\
    \ Manager is a small tool for opening compressed i les and \n\ncreating your own\
    \ archives. Years ago, when people had small hard \n\ndrives, Archive Manager\
    \ was king of the hill. It’s still an important \n\npart of the standard desktop\
    \ experience, as it is the easiest way to \n\nunpack downloaded archives or combine\
    \ many i les into one (Fig 1). \n\nThe standard Ubuntu Archive Manager follows\
    \ the generic \n\nnaming policy and therefore doesn’t have any special name \n\
    \n(together with Disks, Backups and so on). However, Ubuntu had \n\ntaken it from\
    \ the GNOME desktop, where the archive manager is \n\ncalled File Roller. You\
    \ can check it out by launching the $ file-\n\nroller command in the terminal\
    \ in Ubuntu. When launched \n\nseparately, the File Roller interface looks quite\
    \ empty as because it is \n\ndesigned to show .contents in the largest area of\
    \ its window.\n\nMake use of extra features\n\nFile Roller has some extra features\
    \ and boasts i ne integration with \n\nthe Ubuntu i le manager, Nautilus. This\
    \ means that you can extract \n\nany supported archive simply by right\\-clicking\
    \ it and selecting \n\nExtract Here from the menu. You can also drag\\-and\\-drop\
    \ i les and \n\ndirectories from Nautilus to the File Roller window in order to\
    \ add \n\nthem to an archive. The application will prompt you for an archive \n\
    \nname and of er advanced options that include password protection \n\n(ZIP and\
    \ CBZ only). You can protect just the i les and directories, so it \n\nwill be\
    \ possible to view the list of i les inside an archive, but in order \n\nto open\
    \ or extract anything from such archive, one must provide a \n\nproper password\
    \ (Fig 2). You can also protect the list of the archive’s \n\ni les and directories,\
    \ or split an archive into parts of i xed size.\n\n“It’s still an important part\
    \ of the standard \n\ndesktop experience”"
