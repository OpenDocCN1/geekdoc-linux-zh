  md: "![](img/a6bf9da4751f37b25a0d6611dc73918d_27_0.png)\n\n**Fig 1 (above)** You\
    \ can use hot corners \n\nto streamline your Ubuntu experience\n\n**03**\n\nChanging\
    \ the interface theme \n\ncan dramatically alter the \n\nworking experience. It\
    \ is perfectly \n\nsafe: you don’t change how your \n\ndesktop works, you change\
    \ how it \n\nlooks. By default, Ubuntu ships with \n\nthree themes: Ambiance (the\
    \ default \n\none), Radiance (light colours) and \n\nHigh Contrast (for visually\
    \ challenged). \n\nYou can add more by installing new \n\nthemes via command line\
    \ (adding \n\na PPA with a theme and installing its \n\npackage for example),\
    \ or download \n\nthemes manually from sites like \n\ngnome-look.org. Ubuntu looks\
    \ for \n\nthemes in the system-wide /usr/share/\n\nthemes directory and in ~/.themes\
    \ \n\ninside your home.\n\nChange look and feel\n\nCustomising the desktop\n\n\
    **02**\n\nUbuntu includes certain \n\nmechanisms for gathering \n\nusers’ data\
    \ and collecting statistics \n\n– of course, this is meant entirely for \n\nthe\
    \ sake of better usability in future \n\nUbuntu releases. Some find this \n\n\
    behaviour controversial, so let’s adjust \n\nit a little. In System Settings>Security\
    \ \n\nand Privacy go to the Files & \n\nApplications tab and uncheck or \n\nmaybe\
    \ turn completely off files and \n\napplications usage statistics. On the \n\n\
    Search tab you can actually turn the \n\nonline search results in Unity Dash on\
    \ \n\nor off. For example, if you don’t like \n\nshopping suggestions while looking\
    \ \n\nfor a local app on your computer, \n\nsimply turn it off.\n\nChange privacy\
    \ settings\n\n**Ubuntu essentials**\n\n**28**"
