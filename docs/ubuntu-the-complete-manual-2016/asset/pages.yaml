    \n**06**\n\nBy default, Writer will save new files as ODTs, the open document\
    \ format. This works in most other word processors, \n\nbut if you’re regularly\
    \ working with files that need to work on Microsoft Office, you can change the\
    \ default file format \n\nto be .doc or .docx. Go to Tools, Options and find the\
    \ General settings under Load/Save to change the default.\n\nSet default document\
