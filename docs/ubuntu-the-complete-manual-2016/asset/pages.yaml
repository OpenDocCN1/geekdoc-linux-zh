  md: "![](img/a6bf9da4751f37b25a0d6611dc73918d_39_0.png)\n\nManaging lenses in Dash\n\
    \nThough Dash offers a lot of flexibility in showing search results, you may wish\
    \ to \n\nremove some of the results listed, or add some that are either hidden\
    \ by default, \n\nor simply don’t exist. There is a small application available\
    \ in the Ubuntu Software \n\nCentre to help you to do this. Let’s install it first.\
    \ Open Dash. Change the scope \n\nto Applications and search for the main menu.\
    \ In the results that appear, click on \n\nthe link to the Ubuntu Software Centre.\
    \ Click Install on the top-right corner of the \n\npage to install the software.\
    \ Now, open the main menu application using the \n\nLauncher or Dash. \n\nYou\
    \ can now enable, disable and even permanently delete items or whole \n\ncategories\
    \ from here. Check out the categories in the left-hand column. You can \n\nuncheck\
    \ items or categories to hide them, and check to make them searchable \n\nagain.\
    \ This will not install or uninstall any software, but just stop results from\
    \ \n\nshowing in the Dash search results (Fig 2). This way, you can be sure of\
    \ not \n\nbreaking anything important. \n\nFiltering Dash responses\n\nThe top-right\
    \ corner of each lens has the filter option. You can click on the ‘Filter results’\
    \ \n\nlink to expand the options. Note that the options are contextual – that\
    \ is to say that \n\nthere are options under different lenses. In the Home tab\
    \ the filter option lets you \n\nchoose which categories are shown and the online\
    \ sources from where results can \n\nbe pulled. \n\nThe filters for the Applications\
    \ tab include the ability to filter by type (such as \n\ngraphics), games, Internet\
    \ applications and so on. The filters also enable you to narrow \n\ndown the search\
    \ between applications that are already installed and applications that \n\nappear\
    \ in the Ubuntu Software Centre. Similarly, if you are in the Files lens, you\
    \ will be \n\nable to filter the results by type, size and the last edited time.\
    \ Music lens filters by genre \n\nand decade. Photo lens filters based on the\
    \ date that the photo was taken.\n\n**Fig 2 (above)** It’s possible to \n\ncustomise\
    \ your Dash search results \n\nusing the Ubuntu Software Centre\n\nFind your way\
    \ around Dash\n\n**Ubuntu essentials**\n\n**40**"
