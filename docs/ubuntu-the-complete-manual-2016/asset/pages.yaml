  md: "![](img/a6bf9da4751f37b25a0d6611dc73918d_64_0.png)\n\n**65**\n\n**04**\n\n\
    Working in the terminal goes long into the history of Linux and UNIX, \n\nso it’s\
    \ no wonder we have a decent number of discovered Easter eggs \n\nand jokes that\
    \ bring in some fun and help you to feel more comfortable in the \n\nterminal.\
    \ Start with $ sudo apt-get install moo to bring up a jolly cow (Fig 2), \n\n\
    find another Easter egg with $ aptitiude moo and then $ aptitude --v moo \n\n\
    and add an extra ‘v’ three more times to see a snake that has eaten an elephant.\
    \ \n\nThe $ sl shows a steam locomotive and finally the $ fortune | cowsay \n\n\
    shows a cow that tells your fortune. However, to finish up, let’s do something\
    \ \n\nmassive and change our boring GNOME Terminal to a Hollywood Technodrama\
    \ \n\nshowcase, mimicking an FBI command centre (Fig 1, page 63):\n\n sudo apt-add-repository\
    \ ppa:hollywood/ppa\n\n sudo apt-get update\n\n sudo apt-get install Hollywood\n\
    \nHave some fun\n\n**03**\n\nKnowing tricks for GNOME Terminal in Ubuntu can save\
    \ time and increase \n\nproductivity. We start with the simplest: launch the application\
    \ using the \n\nCtrl+Alt+T sequence anywhere in Unity. When browsing your files\
    \ in Nautilus, \n\nit is useful to open a terminal window for the current directory.\
    \ Nautilus can do \n\nit when you right\\-click on an empty space within a view\
    \ area and select ‘Open \n\nin Terminal’, but this feature is not enabled by default\
    \ in Ubuntu. Fix it with the \n\nfollowing command:\n\n $ sudo apt-get install\
    \ nautilus-open-terminal\n\nthen restart the file manager. When you need to copy\
    \ or paste text, use Ctrl+Ins \n\nand Shift+Ins respectively, instead of laboriously\
    \ right\\-clicking menus. To clear \n\nthe input, you can either cancel a command\
    \ with Ctrl+C, or clear what has been \n\nwritten with Alt+R.\n\nLearn some helpful\
    \ shortcuts\n\nUse GNOME Terminal & Xterm\n\n**Ubuntu essentials**\n\n**Fig 2\
