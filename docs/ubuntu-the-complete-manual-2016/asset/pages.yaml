  md: "![](img/a6bf9da4751f37b25a0d6611dc73918d_59_0.png)\n\nGive me more software\n\
    \nDespite every flavour of Ubuntu having a graphical program to install \n\nsoftware\
    \ onto the system, you’ll usually see projects supplying the \n\ncommand-line\
    \ way of getting their software. The reason for this is that the \n\ncommand-line\
    \ instructions are direct and unambiguous. Let’s try it out, and \n\nyou’ll see\
    \ what we mean.\n\nUbuntu, as you may have read elsewhere within these pages,\
    \ is based \n\nupon Debian, one of the earliest GNU/Linux distributions, dating\
    \ back \n\nto 1992. It’s an open collaborative project between over a thousand\
    \ \n\ndevelopers across the world co-operating over the Internet, which has \n\
    \ncontributed to its longevity. So too has the Debian package management \n\n\
    system, and the command-line program to manage fetching and installing \n\nthe\
    \ packages. Apt – the Advanced Package Tool – keeps track of all of the \n\nsoftware\
    \ in Ubuntu’s repositories, and takes care of any dependencies on \n\nother packages\
    \ when you install. It’s what the Ubuntu Software Centre uses \n\nbehind the curtain\
    \ of that graphical interface.\n\nEvery step that involves installing software\
    \ on your system needs root, or \n\nsuperuser, permissions: on Ubuntu this is\
    \ done by prefixing the command \n\nwith ‘sudo’. On some other systems you would\
    \ log in as root user; you can \n\ntemporarily do this on Ubuntu by running sudo\
    \ -s or sudo bash, but we \n\ndon’t recommend it, as it’s easy to get into the\
    \ habit of running with root \n\npermissions, and to accidentally cause some damage.\
    \ \n\nUpdate Ubuntu’s knowledge of the latest available packages with \n\nsudo\
    \ apt-get update. You can look under /etc/apt/ to see the source \n\nfiles where\
    \ Ubuntu remembers which repositories to look in. You can \n\n**Fig 6 (above)**\
    \ The Linux command \n\nline may seem complicated at first \n\nbut you will soon\
    \ master it\n\n**60**\n\nGet to grips with the Linux command line\n\n**Ubuntu\
    \ essentials**"
