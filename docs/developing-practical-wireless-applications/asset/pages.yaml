  md: '# # Preface


    I wanted this book to challenge the fundamental foundation upon which the notion
    of wireless technology development rests. It seems that all too often manufacturers
    base their technology development on an inevitably faded blueprint of their peers''
    success: "Look, they''re doing it, why aren''t we?" Used, as a mission statement,
    undoubtedly paves the way towards a future uncertainty where its adopters will
    fall into the cracks. All too keen on finding elusive killer application, manufacturers
    are forgetting that wireless is still new; still finding its way. I have to confess
    that I am still unsure of its application base – it is, after all, easy to forget
    that a cable at best is a simple technology; you plug one end into Device A and
    the other into Device B. In an attempt to replace the infringement of cables with
    the true freedom of wireless, it escapes many manufacturers that, in making a
    product wireless, we often introduce an unmeasured level of complexity and, dare
    I, cost to the consumer whom we are still struggling to overcome.


    I have come across some senior company whose sheer ignorance has distorted the
    picture of what needs to be realized. A singular vision driven by an underlying
    passion is an attribute lacking in a great deal of companies within the wireless
    industry. Many may seem to adopt a knee-jerk reaction to product development:
    "The man who follows the crowd will usually get no further than the crowd" (Alan
    Ashley Pitt). This lack of innovation and child-like mimicry affords companies
    for a short-term lifetime of support, inevitably sustaining a life support system
    of lifeless and dead company is finite. I''ll touch upon that elusive killer application
    again; it needs a clear winner for most companies. They are often reluctant to
    invest in a product that they are sure about, nevertheless there is a nagging
    market trend that there is (or is going to be) a strong demand – so will we be
    first? "Look, they''re doing it, why aren''t we?" and then they miss out on share
    of the market they heastated. I''ll pause for a moment and ask you to consider
    what particular wireless product strikes you as the most popular choice with consumers?
    Don''t spend too much time thinking about it – it should just come to you. Once
    you have it there in your mind, ask yourself why that particular company has succeeded
    in their task of bringing something new and exciting to the marketplace? The answer,
    when explored more deeply, will almost certainly I assure you in one word: *confidence*.
    That is, confidence in the market and'
  merge: -1
  pgno: 13
- img_proc: true
  md: 'confidence in themselves as a group of innovators and educated risk takers.
    It may sound very contrived, but in an industry shrouded in hesitation and uncertainty
    it undoubtedly comes down to “who dares wins” in terms of product exposure and
    multi-revenue source. The days have passed where consumers are loyal customers
    of branding — consumers want value for money.


    It is clear there are numerous wireless technologies each overlapping in areas,
    but equally there is an accompanying list of reasons as to why you should choose
    one over another. Developing Practical Wireless Applications describes the most
    popular standardized technologies along with a set of proprietary technologies.
    The latter is set to challenge our belief in standardized technologies. I have
    often suggested that a proprietary technology will do the job — now! If you are
    selecting a technology that is unique to particular application and/or context
    do you really need it to interoperate with a huge device base across manufacturers?
    If not, a proprietary technology is most often available.


    In comparison, a standardized technology assures us of interoperating across a
    large consumer base, enabling one manufacturer to confidently interoperate with
    another. The processes associated with such a technology can at times be perceived
    to be protracted and ambassadorial, but sustaining persistence will reward you
    with a well-balanced and distinguished product labeled with alluring accreditation.


    I have faced many times with such a dichotomy, but equally I have made choices
    that have been associated with a tried and trusted notion of belief and passion.
    There is never a magic answer but the very best that I can provide to you is that
    born of confidence.'
  merge: -1
