    # The frequency hopping scheme


    The concept of frequency hopping has been with us since World War II. Primarily,
    the scheme was used to overcome issues surrounding security and reliability; moreover,
    it reduces the likelihood of the communications path being blocked, because to
    an abundance of devices already utilizing the 2.4GHz band or a deliberate attempt
    to do so. A retransmission scheme is used to help alleviate lost packets or packet
    collision with other devices in proximity, in turn, providing a more reliable
    transport service.'
