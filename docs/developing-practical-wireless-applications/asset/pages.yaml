    # # The WiFi Network Topology


    The networking topology within a WiFi context doesn''t greatly differ from that
    of any standard fixed LAN. In Figure 13.6, Figure 13.7, Figure 13.8, Figure 13.9
    and Figure 13.10 we illustrate several typical implementations of a wireless-based
    network interconnected with multiple wireless networks and fixed infrastructure.
    However, a WiFi-specific network device comes along with its complications in
    addition to a new set of terminologies. In general, within a fixed LAN a notebook
    (or any other device that can be physically connected to the fixed environment)
    remains in a physical location and, as such, the destination can be addressed
    accordingly. Within a wireless environment a device (notebook, desktop computer
    and so on) is referred to as a Station (STA) where an STA may represent the destination
    (or originator) not necessarily represent the physical location. The distinction
    is made here to understand the flexibility afforded to by wireless technology
    and the inherent complexity of such devices. A further distinction should be made
    between portable and mobile devices. A portable device is a unit that can be in
    a given location, but remains static within that location; for example you may
    move a notebook from one room to another, but it remains fixed. A mobile device
    on the other hand, is a device that accesses the WiFi network while in; for example
    you may use a PDA to access the Internet and, as such, the device is moved around
    room to room. Moreover, complexity is introduced with the time varying and asymmetric
    characteristics of propagation and, as such, it is not simple to distinguish between
    a mobile and portable device. Nevertheless, they do provide us with dynamic topologies
    and with such dynamics, accompanied with the power constraints of such devices,
    we may experience a degree of unpredictability in sustaining a connection, as
    a device may move in and out of the WiFi service.'
