    is not limited to voice communication, data transmitted in this format is also
    prone to security risks). Additionally, analog systems consume greater power than
    its digital counterpart, making digital systems much more power consumption friendly.


    Unlike analog, digital communication transmits its data using a series of pulses,
    as shown in Figure 3.8. The digital wave form has two states: high and low, which
    can be likened to a series of ones (1s) and zeros (0s). This representation is
    typical of all digital-enabled equipment. During digital transmission, a radio
    receiver can easily distinguish between the series of pulses (high and low) from
    any background interference, such as noise. Reliability is ensured using various
    types of encoding schemes that is added to the data transmission; if the message
    is not received then the transmitter will retransmit it. With the ability to digitally
    encode data, it is also possible to encrypt it. Using a variety of encryption
    methods, securing the data before transmission overcomes


