    subset of nodes is based on a routing slave protocol. Similarly, node A in our
    illustration could also assume this behavior. A node that does not need to initiate
    communication but merely reacts to other requests from other nodes in proximity
    is based on the slave protocol. $N_1$ and $N_2$ will be routing slaves, as they
