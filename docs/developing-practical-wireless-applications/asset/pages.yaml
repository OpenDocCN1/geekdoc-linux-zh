  md: '# WirelessUSB


    Bluetooth has taken several years to become visible to the consumer, albeit with
    a unique application (phone and headset). WiFi, on the other hand, is perceived
    to be ubiquitous. UWB (WiMedia) may achieve, or exceed, similar successes as WiFi
    has seen, possibly through a more appropriate marriage of USB and UWB, also known
    as WirelessUSB (WUSB). We can see that Bluetooth and its Royal-like status stood
    WiMedia into thinking that they were a marriage in heaven, but the true-fate resides
    within the success of UWB and USB. The Universal Serial Bus (USB) has been around
    for almost as long as the PC and the simplicity afforded by such technology has
    perpetuated the notion of connectivity as a basic task of plugging into one other.
    As time has moved on, the Microsoft Windows operating system (OS), as well as
    other popular OSs have moved on too, making life simpler for the everyday-consumer.
    You simply plug in your USB-enabled device and the OS takes care of all; the installation
    and dreaded device drivers. Needless, the wireless was expected to easily transition
    to cable-free environments. We are already familiar with a technology that has
    comfortably connected one to another — and there is no getting it wrong as the
    connectors are transparent to one technophone, despite the insistent pushing of
    the square into the round hole!


    Bluetooth wireless technology was the first to boost the possibility of extending
    the USB medium and Cypress Semiconductors in its frustration was eager to demonstrate
    its solution using the 2.4GHz band. You may recall in Chapter 8, Cypress Semiconductor:
    Introducing WirelessUSB, we discussed Cypress''s own flavor of USB in response
    to a frustrated market that was keen to take the next step. USB already serves
    a plethora of peripheral devices, such as a keyboard, mouse, joystick, printer,
    external hard drive or CDROM, broadband modem, and so on, illustrated in Figure
    15.2. The challenges presented by WirelessUSB to outline the facets of an existing
    and well-established technology are certainly daunting. In fact, WirelessUSB doesn''t
    really have to do much to stand out, as the basic premise itself is the removal
    of the cable and, from a consumer''s perspective, the flexibility and simplicity
    inherently exists. Indeed, the WiMedia Alliance have already partnered with the
    USB Forum (www.usb.org) to thrash out a way forward for a harmonious relationship.


    # Using near field communications as an enabler


    Near Field Communications (NFC) would have been a more obvious choice as an alliance,
    as the technology lends itself well as an enabler. You may recall our discussion
    in Chapter 14, Near Field Communications: The Smart Choice for Enabling Connectivity,'
  merge: -1
