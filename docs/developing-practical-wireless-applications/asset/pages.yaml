  md: '# The next generation of cellular applications


    We will see the emergence of fourth generation (4G) technology? Yes, we will,
    and arguably most academics, researchers, and cellular advocates believe it''s
    already here, but it''s a matter of timing and belief. Japan is directing considerable
    effort in research and development for this "fourth generation" technology. It
    is unclear what is meant by 4G; how it will be constituted and so on. Several
    companies believe that the technology will be an upgrade to 3G and others believe
    it will replace the existing infrastructure. The latter belief is somewhat difficult
    to understand, as many companies have invested so much into delivering 3G technology.
    The shift from 3G to 4G is beginning to take shape, alike on a visionary basis
    only, as operators within the United Kingdom are in the process of deploying 3G
    cellular services for their consumer base. Again, it''s hard to understand why
    operators and the like want to replace their existing infrastructure. We will
    inevitably witness 4G or at least the concept of this technology full quality
    television over a cellular network. Perhaps 4G will only exist as a concept, but
    as a full-bodied deployment, most certainly on a national basis, is still a long
    way off. Increasingly, with an eagerness to create better wireless applications,
    perhaps the emergence of 4G technology will itself exist as an amalgamation of
    wireless technologies, in turn, creating wireless convergence.


    # Wireless Convergence


    Wireless convergence is a relatively new term that unites personal- and wide-area
    communications into a single solution and, indeed, it may describe itself as the
    new fourth generation. It is the convergence of these technologies into a single
    product that provides a consumer with numerous methods of connectivity. We also
    differentiate convergence and coexistence, as these describe two very different
    characteristics. In the early days of Bluetooth technology and the domination
    of 802.11b, as a wireless networking solution, many (press and manufacturers alike)
    argued that these technologies could not cohabit. Furthermore, many claims were
    made that other external factors, such as microwave ovens, would also affect the
    operation of these technologies. In short, coexistence refers to the operation
    of two technologies that use similar radio spectrum to deliver wireless applications;
    both Bluetooth and 802.11b use the unlicensed spectrum 2.4GHz. Currently, as we
    see the emergence of ZigBee (also using the 2.4GHz radio spectrum) similar questions
    are being asked surrounding the coexistence with 802.11b and Bluetooth. Nonetheless,
    we are assured that the 802.15.4 standard, which defines the'
  merge: -1
  pgno: 55
- img_proc: true
  md: 'physical (PHY) and Medium Access Control (MAC) layers of ZigBee, will overcome
    any obvious shortcomings. We discuss the characteristics of ZigBee in Chapter
    12, ZigBee: Untethereed and Unlicensed. Similarly, with the Specification of the
    Bluetooth System: Core v2.0, Enhanced Data Rate (EDR), accompanied by Adaptive
    Frequency Hopping (AFH), we see a more harmonious union of Bluetooth and 802.11b
    and other technologies using spectrums.


    With such an array of wide-area communications we can be forgiven if we are unable
    to recall that we''re just using a cellular phone. Do consumers really need know
    how it works? No. Although manufacturers are keen to tell us that the latest phone
    uses Bluetooth – “a new generation of technology that doesn''t use cables.” Of
    course it hasn''t escaped you that we were already using a technology that is
    classless.


    Many manufacturers are considering integrating many personal-area technologies
    into the cellular phone. We have already come to expect Infrared (IrDa) and Bluetooth
    as standard personal-area technologies, but some manufacturers are also considering
    WiFi (and in fact have already done so). One fundamental reason is to enable users
    to access the Internet at a competitive price, compared with HCSD and GPRS. Other
    applications may use Voice over Internet Protocol (or VoIP) – naturally, these
    two applications will require the presence of a hotspot (as we illustrated in
    our anecdote Chapter 2, Understanding the Wireless). With the ability to utilize
    services and having the support of data connectivity to a cellular network, home
    and business users alike will be capable of connecting to a number of ISPs, in
    turn, allowing them to view web pages from the Internet or Intranet. Similarly,
    users will also be able to send and receive emails. This traditional method of
    connectivity is largely replaced by the appearance of hotspots and, more recently,
    with the potential of Worldwide Interoperability for Microwave Access (WiMAX),
    more about this is later. It is predicted that with such intense power of wireless
    hotspots, the need to utilize a dial-up connection will seem somewhat primitive.
    It might go without saying that these applications won''t please many carriers
    as it conflicts with their core revenue stream – income from data connectivity
    and voice.


    Perhaps manufacturers should focus on complementary technologies such as IrDa
    and Bluetooth. The former is a tried and trusted technology that enables users
    to synchronize and transfer files between a notebook and a phone. Bluetooth is
    becoming more and more trusted and reliable medium upon which consumers can achieve
    functionality. Indeed, users of Bluetooth-enabled cellular phones now come to
    expect headset operation as a standard feature. However, Near Field Communications
    (NFC) is set to become a new technology that will add other complementary features
    to your phone. The NFC standard was approved by the International Organization
    for Standardization (ISO) and the International Electrotechnical Commission (IEC)
    late 2003 and was co-developed by Sony and Royal Philips Electronics. The standardization'
  merge: -1
