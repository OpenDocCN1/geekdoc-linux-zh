  md: '# An Introduction to the Notion of Proprietary-based Wireless Application Development


    With an unrelenting onslaught of non-profit standardization organizations each
    with an objective to steer and drive the future of their respective technologies,
    we have to reluctantly admit to putting up the white flag, and confess: it''s
    somewhat difficult to keep up! The countless acronyms, three letter abbreviations
    (TLAs), compliance and interoperability specifications can only lead to confusion
    and boredom. Equally, proprietary solutions are guilty of their TLAs; it''s evidently
    unavoidable, more often than not offer a solution that is ready and works. At
    last we can actually envisage in our four-year roadmap a product being physically
    developed, affording us flexibility and opportunity to place our product into
    the big wide world of consumerism.


    With our eager desire to deploy the latest wireless-enabled products, manufacturers
    conduct endless research and through this, begin to glean an understanding of
    the multitude of wireless technologies available to them. In sifting through the
    specifications and becoming aware of the standards that govern them, of course
    the constraints and expectations to abide by a myriad of rules and regulations,
    it is unequivocally daunting prospect. Let''s think out of the box. Manufacturers,
    after all, are not bound by the norm; if their product does not have to operate
    with the market mass and your product is unique, why not create or select a proprietary
    technology that suits your application?'
  merge: -1
  pgno: 111
