  md: '# About the Author


    ![](img/3adb5649a7b2815c7caab032dd5fe2b9_12_0.png)


    Dean Anthony Gratton is an independent technology consultant and author. He has
    worked within the communications industry for over ten years and has undertaken
    consultancy for a number of high profile companies to include Philips Consumer
    Electronics, TDK Systems Europe, Alcatel Microelectronics, Phantronics Inc., Sony
    and 3Com Europe. Dean has also been an active contributor to a number of technology
    committees. Furthermore, his work on defining new aspects of wireless technology
    has been patented and he is recognized as one of the leading authorities on wireless
    application development and visionary engineering. Dean is the author of a number
    of articles and papers as well as several bestselling books on wireless technology:
    Marketing Wireless Products, Butterworth-Heinemann (an imprint of Elsevier), 2004
    and Bluetooth Profiles: The Definitive Guide, Prentice Hall PTR, 2002.


    # what is wireless?


    You can contact Dean at www.whatiswireless.co.uk.'
