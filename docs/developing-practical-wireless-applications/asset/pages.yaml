  md: '# Our reasons to believe


    The two founders of NFC, Sony and Philips, launched the technology with the intention
    of replicating the success they created through the introduction of audio compact
    disc recording in the 1980s. They immediately saw the market potential of a new
    wireless technology where the too complicated paskey enabling of Bluetooth was
    removed, and instead, an immediate flow of data was created through the simplicity
    of touch. Having said that, the wireless range of NFC extends to 10cm, a whole
    new meaning to the phrase "mind the gap." The most recent addition of Nokia to
    the mix and the launch of the NFC Forum gave a group presence in the mobile sector
    which could be important in creating rapid adoption of the technology.


    But will NFC drive another nail into Bluetooth''s coffin? Some yes, others no,
    but it is important to remember in all our excitement, that although the market
    potential for NFC is driven by its simplicity, it can never compete on the speed
    front. At 106, 212 and 424Kb/s NFC''s data rate is, on average, closer to that
    of a 56Kbbit/s than the 1Mbit/s or 5Mbit/s of either Bluetooth or WiFi, so simply
    to adopt within devices, it will never reach the finish line for the type of applications
    that Bluetooth and WiFi have managed to master. Perhaps its greatest strength
    is its enabling ability. We have already discussed the complicated pairing of
    devices in the Bluetooth arena. Now, if we consider the enabling benefits of NFC
    demystifying the pairing process by removing it completely (in the minds of the
    users) and acting with "speed-dating" efficiency in bringing the technology to
    life, we see that instead of an enemy, NFC could in fact be a useful ally in Bluetooth''s
    future. Moreover, it could well be the partnership of the millennium if developers
    and promoters work together to ensure that they get the combination right, and
    with both Sony and Philips having a range of Bluetooth-enabled products within
    their market portfolio, they should be eager to get the marriage off to a good
    start.


    # Enabling intelligent connectivity


    In adopting a common sense approach to security, as we discussed in Chapter 4,
    Can We Confidently Rely on Wireless Communication? clearly assume that consumers
    will be comfortable with wireless terminology and usage. And, in an attempt to
    simplify the need to be familiar with such terminology we should consider a more
    intelligent approach towards enabling connectivity. The premise of a more simplified
    mechanism for connectivity is based upon the consumer''s intent to connect, as
    we have already touched upon. If a consumer wishes to connect his/her Bluetooth-enabled
    cellular phone to a Bluetooth-enabled headset, then the consumer brings'
