    In 11.2 we illustrated the various modes and states that the Bluetooth clock can
    appear. CLKn is the native clock and is used as the general appearance for all
    clock references. Typically, the native clock is driven by a Low Power Oscillator
    (LPO) with a tolerance of $\pm250ppm$, but may also be driven by a crystal oscillator
    with a tolerance of $\pm220ppm$. These modes and states are commonly used for
    Standby, Park, Hold and Sniff modes (more about this later).


    # Time slots


    A Bluetooth clock increments once every 312.5$\mu s$, which equates to a time
    slot; one slot time therefore equals 625$\mu s$. The CLK reference is derived
    from CLKn by adding an offset. The CLKi derivative is used for regulating activities
    within a piconet, whereas the CLK reference is used for transmission and reception
    timings. A master of a piconet will have no offset, as the CLK reference is its
    native reference. Although, a slave will add an offset to its CLKn, allowing it
    to synchronize with the master''s native clock; we illustrate this example in
    Figure 11.2. On a regular basis the slave will need to ensure that the clock is
    synchronized regularly, as the slave''s own clock may drift.


    ![](img/3adb5649a7b2815c7caab032dd5fe2b9_165_0.png)


    Figure 11.2 The master maintains its own native clock (CLK) and requires no offset.
    On the other hand, a slave will synchronize with a master and add an offset to
    its own CLKn to enable synchronization.'
