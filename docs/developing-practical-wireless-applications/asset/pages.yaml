  md: '# Making Sense of Wireless Technology


    Wireless communications have been in existence for over one hundred years and
    have had an innocuous impact upon our everyday or working lives in one form or
    another. From the earliest radio sets to infrared remote controls and cordless
    telephones, evolving into the digital mobile era, wireless products have radically
    influenced the way we now choose to live and work. Yet, until new wireless emerged,
    the concept of wireless itself remained firmly anchored with images of old-fashioned
    radio boxes playing popular music or broadcasting the news. The introduction of
    a new generation of wireless technologies has well and truly challenged our founding
    belief. Mention wireless today and people are more inclined to think of cellular,
    infrared-, Bluetooth- and WiFi-enabled devices than that old wireless box in the
    corner of their grandmother''s kitchen.


    In this chapter we will examine the current status of wireless technology and
    question the originality of new (or personal-area) wireless products. We find
    ourselves surrounded by a technology that has come to affect the way we live and
    work, although still remains an experience that varies from individual to individual.
    Primarily, the influence of wireless depends upon numerous scenarios, coupled
    with varying types of exposure and environmental factors. When analyzing this
    context, end-users and companies alike lean towards (business) models which, in
    turn, justify their purchase or non-purchase of wireless-enabled products. Ultimately,
    these models may have an attached financial, practical, usability or security
    factor, which is channeled into a decision-making process and this is what we
    will discuss later in the chapter. In the intermediate sections that follow, we
    ask pertinent questions about wireless technology, some of which may belong to
    lift what may become the lid of Pandora’s box. But to make real sense of it all
    we need to be clear in our minds about why we are and using wireless technology,
    and this chapter enters ambivalent thoughts we might securely share, but not necessarily
    disclose to our peers and superiors.


    Those among us who have endured the constant stream of emails and flyers through
    the post box inviting us us to attend an exhibition or conference may have experienced
    instances of déjà vu. Perhaps with these personal experiences we may mangle'
  merge: -1
  pgno: 21
- img_proc: true
  md: 'with the notion of understanding a purpose of wireless being. More specifically,
    the excitement of attending a new wireless exhibition and conference can be likened
    to an evening at home in front of the television. You look forward with eager
    anticipation to a new episode of your favourite programme, only to discover that
    you are watching a re-run. With a homage akin to a frequent ritual and sacrifice,
    you rejoiceiously in every week, with your prayers, and ask God to bless John
    Logie Baird for his foresight and integrity. Unfortunately, with a repeat of the
    previous episode and coupled with your unruly sacrifice, you will sit down and
    watch the ever-familiar programme; although this time you''re able to watch more
    critically realizing to your dismay that the plot is thin and thinning. Naturally,
    you begin seeking encompass


    In each episode there are new faces, naturally with a new story to tell. But,
    the overcomplicated interwoven tapestry of a plot only reminds you of the eighth
    episode in series where Carrie found her new love sweetheart, Ben in bed with
    her best friend Michael — someone us please!


    There is such an unnerving crossover and painful familiarity with our frequent
    exhibitions and conferences. In essence, the bi-annual and quarterly gatherings
    are a complete refresh of what we have already seen. Inextricably, we pay inflatedget
    to watch a re-run of "How to Develop Wireless Applications with Java API set v26.42";
    after all, last quite you witnessed how to develop the same applications with
    v22.14. Similarly, like a religious congregation, his followers attend technology
    exhibitions in an attempt to discover a wealth of new wireless products. However,
    these dedicated worshippers are reminded of products that seem to be a re-hash,
    or perhaps the box, but here we are trying to emphasize the need for original
    product ideas.


    Nevertheless, this miss your boss agrees to a delegate''s pass to a conference
    or remember to be as critical as the range and diverse collection of conferences
    as you were with the haunting eighth episode. You unavoidably recall the image
    of Carrie''s face of horror followed by disappointment when her final thought
    regretted with a shocking notion of curiosity — let''s not go there. Moreover,
    the relevance of this well-drawn-out and exhausted analogy is to remain objective
    about your needs as well as your consumers. Let''s provide effective value to
    our products while generating new technology because there is an obvious need
    to apply a sense of proportion and reality.


    # Where are We Today with New Wireless Technology?


    Suitably equipped with some sense of proportion and reality, this is what we are
    to believe about personal-area technology: a wireless-enabled office or home,'
  merge: -1
  pgno: 22
- img_proc: true
  md: 'or indeed a portable wireless-enabled product, such as a cell phone or Personal
    Digital Assistant (PDA) bestowing ease-of-use, seamless operation and transparency
    and an unmeasured sense of freedom. Does this exist today?


    Companies advocating wireless technology insist the technology itself is safe
    and reliable, and should be deployed in most cases, as opposed to a fixed infrastructure.
    Remember, wireless technology should be typically utilized in an area where a
    fixed infrastructure normally be difficult to implement. Moreover, there is a
    striking cost–benefit in implementing wireless, as the availability of wireless
    products is now prevalent. Does your company have a wireless infrastructure or
    at least a combination of fixed and wireless? If you can answer this, then ask
    yourself this final question: is it connected to the wider network where potentially
    it has access to confidential information? Your thoughts are coming through loud
    and clear!


    Irerally, let''s draw our attention to the sensitized security secures: WarChalking
    and Bluejacking are current examples. A breach of security means that hackers
    and the like can gain access to confidential information (we will discuss the
    issue of security in detail in Chapter 4, Can we Rely on Wireless Communication?).
    These sensitized stories portray the poor security and reliability aspects of
    the technology: this is the fault of the manufacturer or perhaps the well-educated
    user/administrator not configuring the products appropriately?


    Standards bodies assure us that security concerns are of the past and, of course,
    setting them up as a matter of simple configuration – anyone can do it! You may
    already be aware that a standards body is an organization that undertakes the
    responsibility (that is, general maintenance, future growth and so on) of specification
    for a particular wireless technology. In fact, there are as many standards bodies
    and groups as there are wireless technologies.


    On occasions we have witnessed wireless matches managed by manufacturers and standards
    organizations. In a paradoxical context, a large majority of the standards organizations
    are made up of many manufacturers, all striving for the same goal, but with series
    of political agendas. One common and oft, harmonious driving that many manufacturers
    discuss is that of interoperability, that is, where one manufacturers product
    successfully works with another manufacturers. For example, one manufacturer may
    provide an Access Point (AP) and another the client device enabling a notebook
    to connect to a Local Area Network (LAN).


    # Reasons for Choosing Wireless


    Let’s take this opportunity to combine our positive and negative thoughts regarding
    new wireless technology and attempt to rationalize its potential deployment, alongside'
  merge: -1
  pgno: 23
- img_proc: true
  md: 'the plethora of other gadgets that most of us already use. Does a company really
    need implement a wireless infrastructure? In answering this particular question
    let''s refer back to our earlier identified key factors, such as financial, practicality,
    security and so on. Undeniably, these fundamental factors form part of the decision-making
    process. We have already acknowledged the financial aspect of implementing such
    an infrastructure is nowadays significantly cost effective, as the availability
    of wireless-enabled products is widespread and, naturally, the cost is proportional
    to the size of a company. We have witnessed many notebook and desktop manufacturers
    offering integral wireless solutions that are ready to go and require minimal
    configuration. Some companies may choose to purchase PCCard- USB-based product
    to metamorphose their standalone computers into wireless generation. Nowadays,
    these products are commonplace, but who will support this new infrastructure?
    Many companies specialize in the implementation and deployment of such infrastructures
    and are readily to assist. However, consideration of this outsourcing needs to
    be added to the overall project of deploying and implementing such an infrastructure.
    Nowadays, a significant number of companies have their own IT departments where
    overall administrators manage wireless deployment and maintenance. This approach
    is a practical solution and will help reduce the overall financial outlay within
    a company. Consideration needs to be given to possible retraining within the related
    IT department.


    We''ve already considered a company''s precedent regarding the transition to wireless,
    but what about ordinary users? Moreover, what the practical usability and friendliness
    of the many wireless products on offer: how will users react to this new technology?
    Will they find the educational aspect of adopting a new wireless product a chore?
    To many of us, there is a sense of initial eagerness, coupled with frivolity as
    we unwrap the product, put aside the packaging; scan the accompanying software
    CD and observe the product in 3D in our hand. Most of us may decline the initial
