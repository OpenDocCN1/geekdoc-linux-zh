    website, WiMedia is UWB. The Alliance further defines five unique characteristics,
    namely ultra-popular, ultra-friendly, ultra-trustworthy, ultra-smart and ultra-powerful,
    which is primarily needed to differentiate it from any other wireless technology.
    WiMedia is primarily targeted towards wireless multimedia-specific applications
    and it is abundantly clear that UWB can comfortably accommodate the genre of latency-specific
