    # Cellular roaming


    With a good foundation upon which we can enjoy reliable voice and data services,
    we need to understand how collectively these technologies are brought together,
    all how to take these capabilities for granted and to use them wherever we are
    in the world.


    We introduced in our earlier section the notion of base stations. These units
    are distributed geographically and when we receive or make a call, the cellular
    terminal connects with its registered base station. The ability to roam from city
    to city is provided by a series of base stations that are strategically placed
    in proximity with each other. As the cellular user moves to the edge of coverage
    provided by one station (viewed as a cell, see Figure 3.10), the cellular phone,
    will automatically handover to the next available station. Network service providers
    will distribute base stations to create an optimum operating environment. Factors
    such as buildings, hills, mountains, valleys, the weather and so, as well as potential
    interference that may be caused by the base stations themselves, are issues that
    we take into consideration. As a result, this technology enables cellular users
    to take their cell phone across several states and the world allowing them to
    utilize the telephony service of a particular state or country; this is of subject
    to the user having tri-band support within their cellular phone. A cellular phone
    that has tri-band support is capable of operating in the three network bands (900MHz,
    1800MHz and 1900MHz) offered through GSM.


    # Third Generation (3G)


    The rate at which new telecommunication standards are being developed is phenomenal.
    Alongside the introduction of HSCSD, GPRS and EDGE as standard methods'
