  md: '# Understanding the Wireless Audience


    This chapter has its roots in consumer psychology for a very good reason. Successful
    product development begins first and foremost with building a comprehensive understanding
    of the market for which your products are intended, or put more simply, “give
    them what they want and they will come back for more.” You may recall from our
    first chapter (Chapter 1, Making Sense of Wireless Technology) that consumers
    are our judges and executors regarding the success or failure of a product. Our
    primary objective in this chapter is to shine some light on the consumer psyche,
    and perhaps importantly, to move this light around so as illuminate and expose
    the deep crevasses within (see Figure 2.1); in turn, we will begin to build an
    appreciation of how, why and what key influences are used in the consumer decision-making
    process. We will then be more successful in attempting to categorize consumers
    by age, motivation, income and usage scenarios. From this foundation we can begin
    to truly understand today’s wireless audience.


    We try to find purpose and direction for all areas of our lives. From setting
    up a home to running a business, we internalize the procedures that govern our
    choices and behavior and place these into defined mental booths, formed through
    a combination of past experience and the practical opportunities that face us.
    The problem with these is that they are, all often, walls without doors. Confining
    us to a set of expectations and behavior patterns that stretch our limitations
    as partners, parents and employees and becoming more like prisons than ordered
    sanctuaries we had formed to be.


    For today’s consumers, wireless technology offers us an extraordinary liberation.
    Utilizing wireless technology allows us to finally place doors into our walls
    and merge internalized boundaries into one another as we are introduced to new
    levels of portability and freedom, both at home and in the workplace. In our previous
    chapter we illustrated that many of us could now choose to work in a café or restaurant,
    whilst maintaining a disciplined ethos, alongside a flexible working environment.'
