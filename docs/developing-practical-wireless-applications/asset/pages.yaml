  md: '# Making Sense of Wireless Technology


    We talk of configuration issues and how difficult it is moving from one network
    to another, whether we choose to accept it or not, manufacturers (and their marketers)
    are committed to seducing us all into adopting and embracing its alleged benefits.
    This leads to another important question: are manufacturers creating wireless
    products unnecessarily, is their marketing tainted with hyperbole and— let be
    honest— do we really need them?


    With manufacturers'' new spin: "look, it''s wireless," can they be busy reinventing
    the wheel? When we witness an increase of number of pop banners covering old classics
    and reinventing them as their? Are manufacturers similarly guilty of a lack of
    originality with their wireless products? Where is the original? We find ourselves
    replacing infrared in a remote control with Bluetooth or ZigBee another new technology,
    accompanied with yet another spin: "Look, you can now change the channel on your
