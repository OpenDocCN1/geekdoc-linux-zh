- img_proc: true
  md: 'process realizes true compatibility and interoperation of NFC-enabled devices,
    and as such, Nokia, Sony and Royal Philips Electronics launched the NFC Forum
    (www.nfc-forum.org) in March 2004.


    NTT DoCoMo introduced Sony''s Felica, a wireless payment and ticketing system,
    in August 2004, which uses NFC technology. Similarly, Royal Philips Electronics
