  md: 'permits the ability to successfully communicate and to understand one another.
    Figure 4.21 introduce the International Standards Organization’s (ISO) Open Systems
    Interconnect (OSI) model. The model encourages developers to establish a common
    foundation upon which communications-based systems can successfully communicate
    and, most importantly, interoperate. The model was introduced circa 1984 to assist
    the development community in establishing consistent intercommunication between
    communication-based products, as there was somewhat of a dissay within the telecommunication
    industry.


    The model achieves interoperation through a peer-to-peer topology; but before
    we discuss this in any detail, we should consider the actual layers in our OSI
    model. The model depicts seven layers, each of which has a role to play. Each
    layer is an independent entity, and like a black box, takes data in one end and
    outputs data at the other. Each layer understands how it should talk to its adjacent
    layer through an Application Programming Interface (API); each layer supplies
    its adjacent layer with the data it requires and only the data it requires. The
    layer receiving this information may decide to process this data further by sending
    its response down the model. The application layer is the layer at which the user
    will interact with the application, whereas the physical layer is the entity that
    will interact with the physical hardware (like a radio for example). You may recall
    from our discussion surrounding Bluetooth authentication, pairing and encryption,
    we introduced a


