  md: 'Devices within the ZigBee network are bound (bind) when the nodes discover
    other like-minded nodes where these relationships are stored in a binding table.
    This table provides a quick look-up mechanism allowing nodes to quickly determine
    what is supported and what endpoint it is connected to. The binding procedure
    creates a relationship with ZigBee-enabled devices as peer-to-peer: (a) one-to-many
    (b) and many-to-one (c) as we illustrate in Figure 12.5. This topology affords
    the diversity in the relationship in multiple applications that a node might support.


    The application layer (APL) offers a number of interfaces around the protocol
