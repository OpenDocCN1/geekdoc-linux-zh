    # ZigBee’s Networking Topology


    ZigBee’s topology is essentially a simple one to understand; we illustrate three
    topologies in Figure 12.1 and Figure 12.2. Numerous nodes are strategically deployed
    in an area, typically a home or office, where the radio coverage of one node overlaps
    an adjacent node. This enables the possibility of reaching another even if they
    are thirty meters (100 feet or so) apart. In a relay style race the baton (data)
    is passed from one node to another until the destination node is reached. ZigBee’s
    networking (NWK) philosophy offers three topologies, the star, mesh and tree,
    as we already indicated and are application dependent. The star implementation
    offers an application a


