    # Global System for Mobile Communications (GSM)


    GSM is the most popular second generation cellular standard in the world and started
    its life in the 1980s. It has been deployed throughout Europe, as a facto european
    standard, and the rest of the world, to South America. Australia, Asia, the Middle
    East and Africa. In the US, D-AMPS is being supersed by GSM and world-wide deployments
    of the technology will be gradually phased out. At the time of writing, current
    figures estimate all billion consumers spaced over approximately 200 countries
    use GSM as their cellular service. Additionally, it was the first system to specify
    digital capability and define network infrastructures. The standard is governed
    by the European Technical Standards Institute (ETSI), which undertook the responsibility
    in the early 1990s. With the introduction of GSM as a de facto European standard,
    operating at 900MHz and 1800MHz (where North America utilizes the 1900MHz band),
    we have begun to establish a globally reliable and effective system for telecommunications.


    With the continued growth and demand for applications, that is, applications beyond
    voice capacity, GSM has evolved accordingly. A fundamental prerequisite of any
    telephony service is the ability to deliver high-quality voice traffic. And it
    is fair to mention that this has been successfully established, and tested where
    many consumers benefit from this core service. Network operators continually seek
    value-added services that will attract various consumers to their network, services
    and products. Operators operate data-centric services that build upon the already
    core applications; in many guises we may have witnessed this evolution as 2.5G
    and 2.75G; an empirical advancement towards third generation technology. Second
    generation technologies (D-AMPS, GSM and PDC) offer very basic levels of data
    connectivity with throughput varies from 9.6Kbps to 14.4Kbps. To deliver effective
    data-centric services an increase in data throughput and a reliable medium needs
    to be provided. GSM has established itself as a successful technology and has
    witnessed a series of extensions or upgrades.


    In the following sections we identify some of the extensions that are in operation
    today enabling faster data throughput for our demanding applications. These extensions'
