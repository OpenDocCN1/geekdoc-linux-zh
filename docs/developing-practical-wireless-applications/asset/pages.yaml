  md: '# # ZenSys: An Open Standard for Wireless Home Control


    The notion of a talking refrigerator may have haunted some of us for many years.
    Indeed the thought of your home being an intelligent entity can only induce a
    fear of the unknown. Equally, it has to be somewhat unnerving when your fridge
    informs you that you''re out of milk. It clearly knows more than you do and paranoia
    surely sets in. You become increasingly aware that your home equipment is a secret
    conversation – you begin to make eye contact with your equipment; visually interrogating,
    and then can speculate on the conversation. Moreover, you feel a pair of electronic
    eyes watching your every move, just like the photograph of your mother-in-law
    above the fireplace. Perhaps we are being a little hysterical! Admittedly, the
    photograph of your mother-in-law indeed follows you around the room, but as for
    your white goods and other home equipment developing a Freud-like “Id,” void of
    ego, that''s a long way off. On a more serious and relevant theme, the reality
    indicates that there is a growing demand from consumers to equip their new homes
    with some sort of home automation. In fact, the high-end property market is fitted
    with such systems as standard. Home security, comfort and control, within and
    away from the home, are a number of escalating factors that have found the way
    in an increased demand for systems within the home environment.


    We can easily imagine the high-property market enjoying the benefits of home automation,
    as the property price reflects the value-added benefits. But to achieve global
    market penetration for more modest homes would require a technology that was low-cost.
    Equally as important, is low-power, as most homes would not want to see a significant
    increase in their utility and service bills. Moreover, you not necessarily want
    the encumbrance of continually repairing your home automation equipment; therefore
    you can envisage utilizing a self-repair mechanism which, naturally, would prove
    to be advantageous.'
  merge: -1
  pgno: 113
