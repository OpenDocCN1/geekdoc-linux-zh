  md: '# Ultra-Wideband: Introducing a New Short-Range Wireless Medium


    The proposition made by Ultra-Wideband (UWB) is what Bluetooth wireless technology
    would have been, but it seems as though Bluetooth has stolen some of UWB''s thunder.
    You are undoubtedly aware of the alliance formed by the Bluetooth Special Interest
    (SIG) and UWB, more specifically the WiMedia Alliance. With a marriage of convenience,
    UWB didn''t stand a chance. You only hear of romantic stories in fairytales, but
    it seems as though the charming King has swept up off her feet, and we already
    know that Royal marriages are never straightforward. In the newlywed world, we
    see the King struggle to carry the new bride over the threshold. Nevertheless,
    Bluetooth married into money and with a helping hand from UWB''s cash injection,
    reach a new level in its application-base. Without such support, we would have
    seen Bluetooth in a bankruptcy court and declaring to the judge "I spent it on
    establishing the right connections and women." In turn, Bluetooth would have ultimately
    become just a niche technology, serving only the cellular phone and headset. In
    a worst case scenario, Bluetooth would become disbanded – having said that UWB/Bluetooth
    products are yet to emerge onto the market. It''s not all black and white though,
    as the marriage seems to be one of convenience – for Bluetooth at least.


    # WiMedia


    You may recall our discussion in Chapter 11, Bluetooth: A Cable Replacement Technology,
    where we discussed the odd couple in question. Scouting around a'
