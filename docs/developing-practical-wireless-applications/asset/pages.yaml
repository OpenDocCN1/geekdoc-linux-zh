    # # How Safe is Your House?


    We will start our exploration of wireless security by returning to some fundamentals.
    These techniques are not necessarily exclusive to wireless and we can certainly
    observe many parallels with fixed networking environments. The architecture of
    wireless security can be likened to the requirement of a secure home – that is,
    securing its contents, its perimeter and surrounding grounds. We establish that
    our valuable possessions are placed into a safe, which requires a security code
    to access it; locks are'
