    # Self-organization, self-healing and ease-of-use


    The controller and routing slaves possess adaptive characteristics, in that if
    a node has been deployed into a portable device it has the capability of dynamic
    localization and support for re-discovery of mobile nodes within the mesh network
    environment. The controller nodes enable easier installation, although they also
    have the ability to manage and self-organize; this metamorphic behavior may occur
    when a Static Update Controller (SUC) node assumes the responsibility of a Suc
    ID Server (SIS). The set of parameters which prescribes such functionality are
    distributed to other controller nodes. Each node within the mesh network has the
    ability to learn from its neighbor by requesting information. This behavior supports
    our paranoid notion that equipment in the home is indeed having a seemingly private
    conversation.'
