  md: 'Wide-area and Personal-area Communications


    commenting that 2.5G consumers are now capable of using Multimedia Messaging Services
    (MMS). Currently, the ability to text enables the user to send a short text message,
    typically 160 characters per message, to one or more users. network operators
    provide the ability to split text messages into two SMS. For example, if a text
    message comprises 262 characters the first 160 will be sent as one text, followed
    by the remainder (102 characters) as another text. Similarly, MMS provides the
    ability to send text messages (with an increased capacity to send larger text
    messages without the need to split them over one or more SMS), but the user has
    the ability to attach images, pictures and audio. Multimedia enabled cellular
    phones are increasingly popular with the youth market; integral digital camera
    capability and live video images are prevalent in the UK, Europe and Asia. It
    is the demand for these types of applications that are driving increased data
    rates, which is ultimately leading to the promised third generation technology.


    # Personal Digital Cellular (PDC)


    PDC, also known as Japanese Digital Cellular (JDC), is a second generation TDMA
    technology used throughout Japan and has some similarities to IS-136 (D-AMPS).
    Despite the fact that PDC is only available to Japanese consumers it remains the
    second cellular standard in operation. PDC was developed and standardized by the
    Research and Development Center for Radio Systems (RCR) and was introduced in
    1991 by NTT DoCoMo, to replace the existing analog network. NTT DoCoMo is Japan''s
    largest network operator, which is partly owned by the Japanese Government.


    The success and popularity of PDC in Japan can be credited to, i-Mode, an Internet-based
    service providing capabilities such as web browsing and email. You would not be
    wrong in thinking that this has some similarities with another technology called
    Wireless Application Protocol (or WAP) which was developed by a consortium of
    companies (Phone.com, Ericsson, Nokia and Motorola). Its aim was to establish
    a common platform to facilitate the presence of Internet-based applications on
    cellular phones. A strong argument to its development was to alleviate confusion
    for the consumer, since there are numerous telephony standards for delivering
    cellular telecommunications, D-AMPS, GSM, PDC and so on. It would be natural to
    assume that a crossover, from PCs to cellular phones and its web-based applications
    would begin to emerge. However, with the intrinsic small screen it was all too
    cumbersome and awkward to navigate. Internet Service Providers (ISPs) had to rewrite
    areas of their website to enable users of WAP-enabled phones to view web pages
    and, as such, a large business community had to invest effort and expense in realizing
    the WAP dream. The offer of WAP Internet-based services didn''t matter in the
    direction that network operators had hoped and established only poor to moderate
    success.


