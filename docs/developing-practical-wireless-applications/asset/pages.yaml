    a computer wirelessly. Again, the user would use the cellular phone across the
    wireless reader. It is also envisaged that cellular phones will be used as a wireless
    entry system for your car and to start the engine.


    NFC has an operating range of 5cm (1.97in) to 10cm (3.94in), although some manufacturers
    are extending this range for a host of other new applications, such as personal
    audio entertainment. It uses magnetic induction to transmit data from one device
    to another and inherently provides secure and reliable transactions. It''s inherently
    secure because of the limited range, and malicious intent should be obvious. It
    mandates a peer-to-peer topology and is complementary to Bluetooth and WiFi. One
    application in this particular context is to utilize NFC over Bluetooth and WiFi
    to enable hassle-free connectivity. With this particular application, users would
    no longer have to define parameters required to set-up a WiFi connection, as NFC
    intelligently exchange the configuration parameters for users.


    Wireless convergence fulfils part of a trend that ultimately provides a holistic
    range of applications that provide consumers with multiple choice for connectivity,
    perpetating the notion of mobility and freedom. With an appropriate balance of
    consumer demand and wireless availability we can surely achieve a sense of reality
    in all our day-to-day expectations.


    # Broadband wireless


    WiMAX is set to create an opportunity for permanent connectivity for users on
    the move or in the business and home. It essentially forms a hotspot that covers
    a radius of 10km (6 miles). The WiMAX Forum (www.maxforum.org) is an organization
    that'
  merge: -1
  pgno: 57
- img_proc: true
  md: 'mandates the interoperation and deployment of broadband wireless access (BWA),
    where a consortium of companies, including Intel, comprises this non-profit organization.
    802.16 standard is mandated by the IEEE and ensures compliant delivery to market
    of broadband wireless equipment.


    WiMAX is a technology that interconnects Wireless Local Area Networks (WLANs)
    or WiFi hotspots, whose backbone is connected to the Internet. It forms part of
    a Metropolitan Area Network (MAN) that enables last mile connectivity for consumers
    extending the fixed infrastructure over a short distance. More specifically, to
    deploy a cabled infrastructure for homes and offices can be an economical burden
    for telecommunication providers and WiMAX is perceived to deliver connectivity
    for a number of homes and businesses more effectively. It promises to deliver
    a bandwidth up to 70Mbps over distances of 10km (6 miles); we are assured that
    the bandwidth would be sufficient to meet the requirements of up to sixty businesses
    and a thousand homes. With this level and potential range of connectivity we begin
    to blur the boundaries that exist for personal- and wide-area communications.


    # Manufacturers’ Focus of Consumer Perception and Usage Models


    Wide-area communication is evolving and emerging with new standards but today
    its focus is towards added-value improved services and applications. Essentially,
    cellular operators are certainly confident that at its core cell phone will allow
    you to make and receive data calls. But there is an emergence of products that
    enable you to use a host of flexible applications, combining and extending the
    notion of mobility. Personal-area wireless technology focuses on the ability to
    be mobile and free from the constraints of a fixed environment. Essentially, personal-
    and wide-area technologies have bestowed users with a sense of freedom and, with
    time, we will largely reach an extent where we will secure familiarity in the
    knowledge that its existence will necessarily be taken for granted.


    An endless introduction of personal-area communication technology, each announcing
    a new definition of life-style, and all of which is emphatically endorsed by a
    team of marketers indoctrinating the notion that your life doesnt exist without
    it, perhaps prematurely, pushes the technology into the top drawer of uselessness.
    As visionaries, engineers, marketers, investors and laymen need to ensure the
    direction of wireless technology justifies a particular need that, in turn, becomes
    well suited to meet the expectations of the consumers whose indirectly determines
    its longevity.


    Who is in the driving seat of the new technology revolution? Do we have a team
    of marketers who dream the wonderful dream, lacking insight into the nature of
    what'
  merge: -1
  pgno: 58
- img_proc: true
  md: 'drives consumerism, accompanied with an unguided and untested stream of expecta-
    tions? Or perhaps, do we have a team of techno-geeks, riding a wave of techie-ness
    claiming that this new signing-and-dancing gadget will undoubtedly revolutionize
    someone''s life? Let''s hope that this dichotomy of expectation and needs converge
    to ultimately guide the revolution.


    # Summary


    +   - Wireless communications as a transport medium have enabled electronic devices
    to exchange data wirelessly, transparently and effortlessly.

    - It wasn''t until the 1940s that we saw the emergence of commercial digital wireless
    and cellular technology.

    - Wide-area and personal-area communications share a common radio medium in which
    data is transferred between electronic devices.

    - Consumer perception and usage scenarios distinguish wide- and personal-area
    technologies.

    - Cellular and satellite communication are tried and trusted technologies that
    have been around for many years.

    - We''ve come to know wide-area communications as telecommunications.

    - With telecommunications, users have been able to establish a level of familiarity
    where the wireless capability is no longer the perceived advantage.

    - New wireless technology focuses on the development of personal-area communications.

    - Bluetooth, WiFi, WiMax and so on, afford the user greater flexibility in their
    personal and/ working environment.

    - Personal-area technology allows users to create their own personal communications
    environment.

    - Wide-area and personal-area communications may overlap, where the combination
    of each environment allows the user to exchange data over distance.

    - One distinction can be made between wide- and personal-area is familiarity.

    - Users no longer perceive a cell phone as a wireless-enabled product.

    - This notion holds true for the cordless telephone.

    - Users may only perceive the intended telephone functionality, rather than its
    inherent wireless capability.

    - In time we will see users adopting the same familiarity with a cell phone and
    a Bluetooth-enabled headset, for example.'
