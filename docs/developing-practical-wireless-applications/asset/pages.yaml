  md: '# Figure 14.2

    NFC has a short range of around 5 to 10cm and to enable connectivity the user
    must bring these devices within range.


    Developers are now in a position to take hold of the NFC promise and maximize
    its market potential within a wide range of products. It is evident that NFC promotes
    a different set of applications and to a large extent replaces RFID''s barcode
    replacement technology. It seems we cannot categorize NFC-based applications into
    three groups, namely, (i) key based – this category of application uses NFC as
    a key to unlock another service. For example, a so-called smart poster containing
    NFC tags, which promote a new product or service. Simply touching your cellular
    phone or PDA device against the embedded tag (or hotspot), will unlock the service
    and transmit marketing data to your cellular device in seconds; (ii) peer-to-peer
    applications. NFC is used to enable communication between two devices, such as
    a cellular phone, PDA, camera, printer, set top box and so on. An example of this
    would'
  merge: -1
