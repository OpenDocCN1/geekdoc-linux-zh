  md: '# Near Field Magnetic Communication


    In the majority of wireless communication systems a Radio Frequency (RF) wave
    is propagated through free space. The communication system supplies an alternating
    current (AC) to an antenna which, in turn, generates an electromagnetic field.
    In developing a wireless technology solution with an aim to penetrate mainstream
    consumer you would naturally consider many RF propagation techniques along your
    frequency of operation. This partnership can be linked to an arranged marriage:
    on one side of the partnership you have a radio, a tried and trusted piece of
    technology, which on occasions can be fickle. On the other side, you have a radio
    spectrum; you may not like it at first, but you eventually become accustomed to
    the unusual idiosyncrasies and the countless others who have already used it.
    Nevertheless, with your patience you inevitably grow to like it and become complacent.


    Near Field Magnetic Communication (or NFMC) uses a non-propagating, quasistatic
    magnetic field technique to achieve wireless connectivity between two devices.
    An RF plane flows through free space where a receiving antenna captures the alternating
    electromagnetic field. The RF propagation can extend, hundreds and even many thousands
    of meters. In contrast, NFMC does not depend upon receiving an electromagnetic
    field; instead a magnetic field is localized around the transmitting device. This
    technique translates to a low power that supports a predictable range and performance.
    In terms of performance, the LibertyLink supports a life of approximately fifteen
    hours based on a 260mAh rechargeable lithium battery. Furthermore, as there is
    negligible field propagation of RF, the communication pathway between two devices
    becomes inherently secure.


    The ability to transmit data is characterized in the time varying magnetic field,
    which is captured by the receiving device''s transducer (a device that converts
    one energy into another). A negligible amount of RF propagation occurs at the
    carrier frequency (13.56MHz), but predominantly the energy contained within the
    magnetic field uniquely defines magnetic communication and its data transfer properties.


    # Making bubbles


    Additional characteristics can also be attributed to magnetic communication and,
    in particular the roll-off behavior as a function of distance. The power in an
    RF plane wave, in the field, rolls-off as one the distance from the origin squared,
    and that is 1/r². When we compare this to a quasistatic magnetic field we achieve
    a roll-off of 1/r³. In Figure 9.2 we illustrate a relative comparison of RF power
    and field strength (the E-Field), and magnetic field values (the B-Field).'
  merge: -1
  pgno: 141
- img_proc: true
  md: '# Figure 9.2

    A comparative representation of the roll-off behavior versus distance for a typical
    RF波 ($1/r^2$) and a quasistatic magnetic field ($1/r^3$).


    ![](img/3adb5649a7b2815c7caab032dd5fe2b9_142_0.png)


    Initially, most of us would argue that a communication system based on strong
    *attenuation* (a decrease in power of a radio wave over distance) would have severe
    disadvantages. Naturally, any wireless communication system transmitting data
    over a greater distance would have to marry RF along with better attenuation properties.
    Nevertheless, for personal-area communication environments, as we discussed in
    Chapter 3, *Comparing Wide-area and Personal-area Communications*, it has some
