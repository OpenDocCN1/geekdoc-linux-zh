- img_proc: true
  md: 'be a photograph taken with your mobile phone and then sent directly to your
    printer by simply touching it with the phone; and (iii) pay and book applications.
    Very similar to RFID, this area of NFC application is already growing. Many banks
    and cellular operators are waking up to the idea of offering payment and ticketing
    applications on phones and several credit card companies are currently trying
    the technology in Europe. Additionally, plans are already underway to trial NFC
    technology within cellular phones to match passes within European football grounds.
    With NFC founders Philips being an official sponsor of FIFA (TalkNFC.com) this
    is a clever technology marketing alliance.


    # # Conclusion


    It is clear that NFC won''t trounce on any wireless technology; it will merely
    exemplify and support an ethics of simplicity, which is an unavoidable need to
    assure the success of any wireless technology. RFID is a barcode replacement technology
    and seems to be comfortable with its tag. NFC, on the other hand, has some overlapping
    cases with RFID, but it seems as though NFC will dominate a genre of consumer
    electronic products using numerous case scenarios as connectivity, payment and
    entry. The technology roadmap is still unclear at this stage, and as we already
    mentioned, the NFC Forum wants to be sure of its future before proclaiming any
    outlandish applications.


    # # Summary


    +   - The concept of NFC is based upon the premise of enabling through proximity.

    - RFID has been around for some time.

    - Some people use NFC and RFID interchangeably, but there are some subtle differences.

    - RFID reads information from a tag or transporter.

    - A tag or transporter is an integrated circuit that has a small antenna.

    - The information stored on a tag will allow a reader or an interrogator to retrieve
    data pertaining to that product or person using radio waves.

    - RFID has been used to track and trace products typically located in a warehouse
    and to monitor its movement from a warehouse to a shop floor.

    - RFID is essentially a barcode replacement technology and reading information
    can be done automatically.'
