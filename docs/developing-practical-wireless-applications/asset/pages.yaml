  md: '# An Introduction to the Notion of Standards-based Wireless Application Development


    Perhaps our introduction in Chapter 6, An Introduction to the Notion of Proprietary-based
    Wireless Application Development, was a little unforgiving? Non-profit standardization
    organizations each with an objective to steer and drive the future of their respective
    technologies have their purpose and the best interest of manufacturers and consumers
    alike. Admitted, there are countless acronyms, three letter abbreviations (TLAs),
    compliance and interoperability specifications, which may lead to confusion, and
    perhaps, our reference to "boredom" was a little zealous. The standardization
    process is to assure the developer community that a product from one manufacturer
    will interoperate with another. With regular attendance at (un)/plugvests we are
    additionally assured that we will achieve successful interoperation. This process
    also enables developers to smooth out any ambiguities with the specification and
    allow them to test the product with other similarly enabled products from various
    manufacturers.


    We can still envisage our four year roadmap with a technology that has been thoroughly
    tested by a testing house, and of course we can choose to use the associated logo
    and other branding. Our eager desire to deploy the latest wireless products remains
    deep-seated, but manufacturers can be assured of a technology that will be globally
    accepted by an international community. There are numerous companies that will
    gladly take on the burden of the constraints and expectations to abide a myriad
    of rules and regulations which undoubtedly for any organization is a daunting
    prospect. A standardized technology affords the consumer flexibility in product
    choice and assures them of successful interoperability.'
