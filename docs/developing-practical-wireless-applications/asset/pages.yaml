  md: 'Figure 15.3 Utilizing NFC as a technology enabler for WiMedia-based products
    will guarantee simplicity in many of the expected cases, envisioned by the Alliance.


    ![](img/3adb5649a7b2815c7caab032dd5fe2b9_247_0.png)


    Forum (EETimes.com, October 2006). Freestyle and Motorola, along with PulseLink
