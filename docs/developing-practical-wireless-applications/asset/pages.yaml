    # Understanding how FDMA works


    FDMA offers a radio spectrum that is divided into channels, where typically each
    channel is 30kHz there is also a separate control channel, which is used to manage
    and coordinate voice assignment. The reference to a channel within the FDMA rationale
    is in fact 30kHz: for each direction, known as uplink (reverse channel) and downlink
    (forward channel). This two-way strategy is known as FDD and typically you will
    come across 1G technology being referred to as FDMA/FDD. FDMA/FDD is a narrowband
    communications system which implies that the available spectrum is divided into
    narrow radio channels, along with a channel separator that is used to separate
    the uplink and downlink communication pathway (primarily to reduce the likelihood
    of interference). When a cell phone initiates a call, a frequency channel is reserved
    for the duration of that call; frequency modulation is then used to modulate voice
    data within the reserved frequency band.'
