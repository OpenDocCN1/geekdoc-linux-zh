  md: '# Power classes


    A Bluetooth-enabled device will support one of the following power classes as
    defined in Table 11.1. The most common classification is the third, having an
    operating distance of up to 1m (~–3 feet); typically this is guided by the nominal
    0dBm power requiring a low power consumption of approximately 1mW. In utilizing
    a frequency hopping scheme (which be after later), Bluetooth is capable of achieving
    distances of up to 100m (~328 feet) by applying 20dBm to its antenna, this may
    require a maximum output power of 100mW, in turn, requiring a larger amount of
    sourced energy. Power control through these three classes are governed through
    the Received Signal Strength Indicator (RSSI), when the Link Manager Protocol
    (LMP) commands are sent to and from the Link Manager (LM) layer to enable regulatory
    control (increase or decrease) of the transmitter power and, possibly, the level
    of interference.


    If a radio system supports RSSI its accuracy should be ±6dB. Power control is
    mandatory for a Class 1 device where control can be maintained as low as 4dB (the
    maximum output power is 20dB). The step sequence for regulating power control
    is maintained in a maximum step of 8dB and a minimum step of 2dB. It is not a
    mandatory requirement for Class 2 and 3 to support power control; nonetheless,
    it is advisable, as it allows a greater regularity over power consumption and
    increases battery life.


    # Bluetooth clock


    Each Bluetooth device supports an incremental timing mechanism, which is a free
    running system. A clock may be implemented as a counter and, as such, a 28-bit
    variable is required and must wrap around at 2⁸–1. The least significant bit (LSB)
    increments at 312.5us per unit, which, in turn, provides a clock rate of 3.2kHz.
    Since the Bluetooth clock is not dependent on the time of day, it can be initialized
    to


