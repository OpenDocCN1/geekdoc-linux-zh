    # # The ZigBee Protocol Stack


    The ZigBee Alliance has generated several profile specifications that afford the
    generic foundation upon which you can create ZigBee-specific applications. In
    a similar manner to Bluetooth wireless technology, ZigBee profiles prescribe use
    cases or applications that utilize the ZigBee protocol stack. The core profiles
    extend to common functionality, that is, marketed for home, commercial and plant
    use, but uniquely the task provides stability in developers who can create their
    own profiles to suit their particular application. The application will fall into
    one of the profiles defined in Table 12.2, which encourage interoperability between
    ZigBee-enabled devices, very similar to the Bluetooth strategy. More specifically,
    a ZigBee network may comprise several profile types, which collectively form the
    basis of a distributed application.'
