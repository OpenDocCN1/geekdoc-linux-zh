    # High-Speed Circuit Switched Data (HCSD)


    ETSI first released High-Speed Circuit Switched Data (HCSD) in 2000 and is one
    of the many upgrades to GSM. It''s not common to see HCSD placed into a category
    of cellular generators, but typically we would see it placed into 2.5G.


    Circuit Switched Data (CSD) is very characteristic of a Public Switched Telephone
    Network (PSTN). A user will call and the telephone network direct (or switch)
    the call to the destination through a series of circuits without an economical
    perspective. In other words, it will make the least number of steps to get its
    destination. Once a connection is established the circuits essentially a dedicated
    pathway between source and destination. This pathway does not change nor can it
    be used by any other for the duration of the call.


    GSM inherently offers data throughput of up to 9.6kbps and manages error in transmission
    ensuring high-quality voice reception. This is achieved in the way that voice
    is digitized and placed into a time slot; data is also allocated into time slots.
    HCSD is capable of offering data speeds of up to (approximately) 57.6Kbps, which
    is comparable with most modems. It achieves this throughput by taking advantage
    of the available time slots used within the TDMA scheme. Instead of using one
    time slot, as it does for voice, it reserves and utilizes multiple slots (maximum
    of four) during a data-centric connection. Additionally, HCSD eases the error
    control mechanisms increases throughput up to 14.4Kbps per slot. Obviously, this
    will reduce the number of slots for consumers making use of the voice service.
    With this scheme and the potential reduced capacity, operators charge the user
    for the duration and number of slots occupied.


    # General Packet Radio Service (GPRS)


    The first notable upgrade to characterize the evolution of cellular communications
    was through the introduction of General Packet Radio Service (or GPRS). With this
    introduction the general telecommunications community acknowledged that we had
    achieved one significant step in the evolutionary cellular generation scale. Essentially,
    with GPRS we are at 2.5G; a true indicator that we are moving towards a better
    cellular communications experience.


    GPRS differs from HCSD in that it utilizes a packet-switched scheme. CSD uses
    a series of circuits which remain unavailable during its use. GPRS, on the other,'
