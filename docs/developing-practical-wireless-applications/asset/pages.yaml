    to follow for its 300-series silicon. In a succession of catalogued milestones,
    ZenSys has secured a partnership with Intel creating a combined vision for the
    Digital Home, and have established over one hundred customers to Levit (leviton.com),
    Intermatic (www.intermatic.com), Cooper (www.cooperwiringsdevices.com) and Honeywell
    (www.honeywell.com). Furthermore, in underpinning its technology as ubiquitous
    wireless connectivity within the home, ZenSys has formed a coalition, the Z-Wave
    Alliance, comprising approximately seventy-five members. Naturally, a significant
    number of alliance supporters will ultimately utilize the technology as a standard
    means for wireless home control. Inevitably, we will undoubtedly witness this
    solution becoming a standard technology within the home control arena where ultimately
