  md: '# # Can we Confidently Rely on Wireless Communication?


    Many books have been dedicated to the security of wireless technology and a number
    of reports have sensationalized security breaches, deem the technology insecure
    and, subsequently, ineffective. The collective security technology press seems
    to reveal and bathe passionately in the failure of our endeavors. Similarly, this
    particular breed of journalist observes passionately, as the wireless visage of
    solidarity from manufacturers, engineers and begins to dampen in the light of
    the media-perpetuated fear surrounding wireless security. The consumers who want
    "out of the box" solutions are the ones who will experience a new wireless product''s
    inadequacies first-hand. Although, due to its innate invisibility, they may not
    realize it until it is too late - the damage has already been done. The technologists,
    who are constantly striving to simplify usage models and usability for everyday
    users, will then find themselves inevitably making excuses to the media as to
    why the security of a particular wireless product isn''t exactly airtight as expected.
    Sadly this only serves to further intensify fears and prolong journalists'' narcissism.
    Security is crucial to the success and future of wireless technology; users and
    companies need to be confident that their data is secure. It should therefore
    become an inherent procedure for manufacturers to help and educate consumers and,
    likewise, for businesses to establish and more secure infrastructures.


    In this chapter we explore the failures and successes of wireless technology by
    examining how secure wireless technology really is and similarly, how secure it
    is becoming? With recent reports of (now take a deep breath) War-Driving, War-Walking,
    War-Flying, Phishing, Bluejacking and BlueSnarfing can we be that our wireless
    networks and their stored data are secure? This chapter also considers the security
    aspects that are currently in place and examines how best they can be improved.
    Wireless technology is here to stay and, in recognition of this, we will draw
    upon'
  merge: -1
  pgno: 61
- img_proc: true
  md: 'specific implementations and review a number of security architectures that
    aim to be the building blocks of a secure infrastructure. We may indeed become所在
    regarding a technology''s sustainability but we must continually question its
    potential success through adoption by the greater masses. Additionally, we will
    consider aspects of coexistence and interoperability, as these mechanisms assure
    us of a harmonious user experience. With personal-area wireless emerging and being
    integrated into commonplace products as the cellular phone, we are indeed increasingly
