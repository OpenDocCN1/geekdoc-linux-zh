  md: 'AFH is a scheme introduced by the SIG to reduce interference with a range of
    proprietary technologies that already use the 2.4GHz radio spectrum. Both 802.11b-
    and 802.11g-enabled products utilize the 2.4GHz radio spectrum and the market
    penetration of this technology is somewhat widespread. The existing frequency
    hopping scheme hopes at a rate of 1,600 times per second when the scheme utilizes
    all 79 channels available within the 2.4GHz band. New generations of Bluetooth
    products will use the AFH to avoid conflicts within the channel range. In an environment
    where there are many 2.4GHz wireless products, there is a greater probability
    that a collision will occur on a particular channel and, data may be lost. AFH
    affords Bluetooth a more intelligent approach to its frequency hopping, as it
    adapts to the environment which it finds. If there is a consistent problem with
    a particular channel, AFH will exclude this channel from the scheme. Interestingly,
    in a heavily populated environment, it is conceivable that the number of channels
    would reduce considerably; however, the specification dictates that the minimum
    number of channels readily available should be around twenty. Although the scheme
    helps reduce the likelihood of problems associated with coexistence it is still
    not completely dependent.


    # Basic rate and enhanced data rate


    A maximum bandwidth of 1Mbps is achieved through the Basic Rate GFSK modulation
    scheme, utilizing a bandwidth-bit time (BT) product of 0.5 and a modulation index
    of between 0.28 and 0.35. Uniquely, the GFSK modulation scheme denotes a binary
    1 when a positive frequency deviation occurs from the nominal carrier frequency
    and conversely, a binary 0, is generated when a negative frequency deviation occurs.
    Typically, in a Bluetooth radio system, two oscillators will be used to generate
    this modulation and a two bandpass filter will be used for its demodulation.


    Increased rates of 2Mbps and 3Mbps are now possible using the HDR modulation scheme
    where the respective rates are achieved through two variants of the PSK. 2Mbps
    is supported by a $\pi/4$ differential quaternary phase-shift keying (or $\pi/4$-DQPSK)
    scheme, which uses four phase positions each separated by a 90 degree angle. In
    comparison the 3Mbps rate is supported with an eight-phase differential phase-shift
    keying (8DPSK) scheme. Naturally, this affords us eight phase positions, which
    are now separated by 45 degrees. Both modulation schemes only affect the carrier
    and not the PSK receiver device should be capable of distinguishing the type of
    modulation in order to decode the data. Moreover, each scheme is tolerant to an
    amount of noise therefore increasing the likelihood of decoding the data more
    accurately.'
