    # The WiFi Protocol Stack


    The WiFi protocol stack is an eclectic piece of software which has been around
    for many years and silicon nowadays offers a varied number of drivers or software
    to interface with a number of microprocessors. When we compare the WiFi (or 802.11)
    protocol stack with Bluetooth and ZigBee it seems to be, at first glance, somewhat
    straightforward, as Bluetooth and ZigBee not only define their respective PHY
    and MAC layers, but a host of other layers that embody a wealth of responsibilities.
    You may recall from Chapter 12, ZigBee: Untethered and Unlicensed, and Chapter
    15, Ultra-Wideband: Introducing a New Short-Range Wireless Medium, that both technologies
    have PHY and MAC layers defined by the IEEE, namely 802.15.4 and 802.15.3 respectively.
    The emergence of WiFi evolved from the ability to replace a fixed connection (NIC-based)
    with a wireless medium (WNIC-based). In other words, the protocols that exist
    above the NIC remain the same for WiFi, as shown in Figure 13.11.


