  md: '![](img/3adb5649a7b2815c7caab032dd5fe2b9_52_0.png)


    of data connectivity, operators are eager to deliver advanced methods for data-centric
    applications, such as broadcast quality video. Remember, we can already rely on
    voice and, to data connectivity. Operators are always keen to create new scenarios
    where there is an increased and continued revenue stream. To that extent, in 1998
    the Third Generation Partnership Project (3GPP) a collaboration of partners, which
    comprise a number of standards bodies, such as ETSI, the Telecommunications Technology
    Committee (TIC) and the Association of Radio Industries and Businesses (ARIB)
    to name but a few, made a consigned agreement. The primary objective of this group
    is to maintain and support the existing cellular infrastructure and associated
    technologies (that are, GSM, HCSCD, GPRS and EDGE). The scope of these activities
    extends to specifying new standards for third generation technology. This will
    ultimately benefit the operator, as there is a united driving force ensuring high-speed
    interoperable telecommunications standards.


    Within the 3G arena an additional multiplexing technique is used Code Division
    Multiple Access (CDMA). This forms our third multiplexing scheme where our previous
    methods were FDMA and TDMA. CDMA is a direct sequence (DS) utilizing a spread
    spectrum topology where multiple users occupy the radio channel and frequency
    concurrently (we will discuss this in more detail later). An exception to the
    appearance of CDMA within 3G is cdmaOne; it is widely deployed in the US and Korea
    and is classified as a second generation technology. It is defined by IS-95 and
    is now superseded by IS-2000 (also called CDMA2000) and is very much in competition
    with GSM. CDMA was initially developed by Qualcomm (www.qualcomm.com) a research
    and development company based on the US.'
