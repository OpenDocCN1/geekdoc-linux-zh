    by wireless product marketers, may result in aspirational needs created in the
    minds of consumers. Early adopters ensure that these life-style models are further
    reinforced within the target market, resulting in an increased diffusion of innovation.


    # Cultural Economic Effects on Product Pricing


    The majority of wireless pricing research has been carried out over US consumers,
    which raises the potential issue of oversimplification in certain global-economic
    areas of theory. Evidence, however, exists of a strong correlation between quality
    and price in the mind of the UK and Japanese consumers whilst; in less developed
    countries, price does not necessarily have a strong relationship with perceived
    product longevity or quality of build and accordingly, less consumer brand loyalties.
    Differences in economic culture may therefore have a dramatic impact upon pricing
    and promotion strategies; for example, differences in income payment receipt can
    powerfully influence the effectiveness of a product''s promotion when put into
    a financial concept such as: "You can enjoy our latest 3G package for less than
    a dollar day! To a weekly paid employee, a dollar is seen as a larger slice of
    their paycheck than consumers who pay on a monthly basis.


    In the case of mobile application developers, building good relationships with
    carriers is key to ensuring that cultural needs and variances are built into new
    wireless applications. For example, gaming applications based upon the latest
    movie themes can be more easily managed when carriers are able to play a part
    in accurately promoting launch dates in accordance with appropriate media tie-ins
    and cinema release dates.'
