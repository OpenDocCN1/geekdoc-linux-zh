  md: '# Summary


    +   - Many books have been dedicated to the security of wireless technology.

    - Consumers who want “out of the box” solutions are the ones who will experience
    a new wireless product’s security inadequacies first-hand.

    - Due to innate invisibility, consumers may not realize a security breach until
    it’s too late.

    - Security is crucial to the success and future of wireless technology.

    - Consumers and companies need to be confident that their data is secure.

    - With recent reports of War-Driving, War-Walking, War-Flying, Phishing, BlueJacking
    and BlueSnarfing, we are certain that our wireless networks and their stored data
    are secure!

    - The architecture of wireless security can be likened to the requirement of a
    secure home – that is, securing its contents, its perimeter and surrounding grounds.

    - Our locked doors and windows may become compromised as they can be forcibly
    opened, but with the availability of security alarms we can help further unauthorized
    access.

    - Any individual attempting to access a secure wireless network will be challenged
    by the host (or server).

    - Like the host of a computer network, a security officer will request identification
    ultimately to determine if you are an authorized user.

    - The host will request that you supply a username and password to successfully
    enable you to gain access to the wireless network.

    - Access control refers to the means by which a user can successfully gain access
    to a service, which is available through a LAN, WLAN or WAN.

    - RADIUS is a de facto standard protocol, which is used to verify users of a particular
    service through a centralized database such as a NAS.

    - Usernames and passwords are crosschecked with the database to ensure that the
    user is authorized.

    - A NAS may include a VPN or a wireless AP, but, in a larger organization, may
    be integral to a central server.

    - The RADIUS server is not limited to the authorization of usernames and passwords;
    it is also capable of assigning IP addresses and a range of other configuration
    parameters, such as DNS addresses, subnet masks and so on.

    - The RADIUS protocol can request that the device must reveal its MAC address,
    which is a unique identifier assigned to all types of network capable equipment.'
