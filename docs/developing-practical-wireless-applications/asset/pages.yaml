  md: '# Comparing Wide-area and Personal-area Communications


    The era of wireless communications technology utilizing radio waves as a transport
    medium has enabled electronic devices to exchange a variety of data wirelessly,
    transparently and effortlessly. In establishing a new era of wireless enabling
    personal freedom and mobility has both distinctive parallels and contradictions
    to the older, more established wireless technologies. We should not forget that
    wireless technology emerged in the late 19th century. It was with Guglielmo Marconi’s
    determination that the first broadcast of the human voice was around 1890. It
    was not until the 1940s that the emergence of commercial digital wireless and
    cellular technology, but then it was still much in its infancy.


    Both wide-area networks (WANs) and personal-area networks (PANs) share a common
    radio medium in which data is transferred between electronic devices, but it is
    a combination of consumer perception and usage scenarios which distinguishes them.
    As we move forward in this chapter, we will clarify the distinction that can be
    made between wide and personal-area wireless, alongside an in-depth discussion
    of the technologies that underlie most cellular-centric products. Additionally,
    we will consider the perception that most of us enjoy when we come into contact
    with wide- or personal-area technologies. We will discover that these technologies
    are indeed, complementary and together provide some powerful applications. It
    is covered in the chapter as a means of providing a holistic perspective of the
    available technologies, whilst not detracting from our primary focus.


    # Wide-area vs. Personal-area


    The more established or wide-area technologies, such as cellular and satellite,
    are tried and trusted communication technologies that have been around for many
    years.'
