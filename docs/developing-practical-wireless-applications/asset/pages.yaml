    # ### BlueJacking/BlueSnarfing


    The unauthorized access to confidential information is not limited to WiFi; Bluetooth
    wireless technology has suffered some bad press and in particular has been associated
    with two new buzz words: BlueJacking and BlueSnarfing which have emerged to specifically
    identify the type of security attack (or weakness). Indeed, two words for two
    different problems: BlueJacking is the ability to send unwanted messages to a
    Bluetooth-enabled device, such as unsolicited advertising or, more significantly,
    the pushing of viruses and Trojans; BlueSnarfing is the theft of private data
    from your Bluetooth-enabled device. BlueSnarfers will discover unprotected devices
    to steal data, such as calendar, contact lists and other confidential information.
    This type of theft is naturally deemed illegal in many countries. You may not
    be surprised to read that, like war-chalking, BlueSnarfing and BlueJacking have
    their own resources available on the Internet - some websites describe how to
    undertake such illegal activities. We can only assume that these kind-hearted
    individuals merely have the consumers'' interest at heart, as they wisely to highlight
    specific weakness in the enabling of appropriate security features within a Bluetooth
    product.


    In Chapter 11, Bluetooth: A Cable Replacement Technology, we discuss in more detail
