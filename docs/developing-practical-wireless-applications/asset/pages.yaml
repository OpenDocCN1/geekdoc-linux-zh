    # WiFi Multimedia Power Save


    In a mindset to dominate every conceivable consumer electronic product, the Alliance
    continually stays one step ahead of the market. In another initiative launched
    in December 2005, the WiFi Multimedia (WMM) Power Save certification program encourages
    managers to reduce their power consumption by utilizing a more efficient data
    transmission scheme (as prescribed by the Alliance), in addition to tailoring
    the technology towards audio/video-specific capability. The data transmission
    scheme relies on the ability to send large data payloads in the shortest amount
    of time possible in an attempt to induce the WiFi hardware to sleep; Moreover,
    the longer it asleep, the less activity, in turn, increasing battery level. Improved
    quality of service is assured with latency-dependent applications, as audio and
    video, as traffic can be prioritized depending on the type of application being
    used. The WMM Power Save takes advantage of the existing power save features inherent
    within the phone integrated within the phone to provide a seamless and transparent
    data connection that theoretically moves from WiFi to General Packet Radio Services
    (GPRS) and vice-versa — all being subject to the availability of a satisfactory
    service. What''s more, with an increasing popularity in applications supporting
    WiFi over Internet Protocol (VoIP), Voice over Local Area Network (WoWAN) and
    Voice over Wireless Fidelity (VoWiFi) as a medium in which cheap telephone calls
    (to cellular and landline) can be made, we will inevitably witness new cellular
