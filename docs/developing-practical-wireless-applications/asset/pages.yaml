    # Bluetooth device addressing


    A unique Bluetooth Device Address (BD_ADDR) is assigned to every available Bluetooth-enabled
    product. The Institute of Electronic and Electrical Engineers (IEEE) is responsible
    for issuing this unique address to manufacturers of Bluetooth-enabled products.
    It produces a 48-bit number, which is based on the Medium Access Control (MAC)
    address, notably used for Network Interface Cards (NICs). The BD_ADDR comprises
    three fields: the Lower Address Part (LAP) forming 24-bits; and the Upper Address
    Part (UAP) forming 8-bits; and the Non-significant Address Part (NAP) forming
    the remaining 16-bits, which we illustrate in Figure 11.3.


    # The Bluetooth Protocol Stack


    The Bluetooth protocol stack is nowadays a tried and tested piece of software
    and is available from many vendors. The open source solution has proved to be
    a popular choice for developers, as it allows a greater diversity in the future
    development of Bluetooth applications. The stack, like other software presented
    in the following chapters, is built upon the Open Systems Interconnection (OSI)
    model. You may recall from Chapter 4, Can we Reliably on Wireless Communications?
    we discussed surrounding interoperation and highlighted why a stack is architected
    in this particular manner.


    Each layer within the protocol stack has a unique responsibility, which we discuss
    in more detail in the following sections. In the meantime, Figure 11.4 illustrates
    the way in which the Bluetooth stack is architected.'
