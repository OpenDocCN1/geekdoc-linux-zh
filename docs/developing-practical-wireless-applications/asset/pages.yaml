  md: '# Introduction


    It seems somewhat paradoxical that we feel obligated to create a new wireless
    product that will simplify our experience in some part of our business or private
    life. With a new wireless technology in mind we dutifully begin brainstorming
    to determine what we will ultimately create. On occasions the direction we take
    seems to be mired in quandary over the value added proposition for the consumer.
    What benefit will it really bring? And, why ultimately should the consumer pick
    it off the shelf and place it onto the counter ready for purchase? A sense of
    practicality needs to be injected into the whole wireless products’ process as
    we choose to drive the future of wireless development forward. In that respect,
    *Developing Practical Wireless Applications* will guide the most eager of developer,
    the most enthusiastic product planner and the most politically focused manager
    through choices in respect of which wireless technology to use. Ultimately, this
    book will guide you through each technology with an aim to enable you to make
    educated choice regarding your world-based product. Furthermore, you will glean
    from the subsequent chapters a detailed breakdown of each technology. In some
    places you will find exposure, right down to the deepest of layers, enabling engineers
    to understand the inner workings of each technology, while intermediate readers
    will enjoy an understanding of the peripheral discussion surrounding a technology.


    Our understanding begins with Part One, Understanding a Wireless World*, where
    we attempt to question our basic premise in Chapter 1, *Making Sense of Wireless
    Technology*. It seems that most consumers are unable to escape from the market
    onslaught, with such wealth of information and choices how do we make sense of
    all it? In Chapter 2, *Understanding the Audience*, we generalize the consumer
    audience in an attempt to understand their purchasing motivation and behavior.
    Conversely, Chapter 3, *Comparing Wide-area and Personal-area Communications*,
    illustrates two important concepts in the arena of wireless technology. We compare
    each specific with Bluetooth, ZigBee and WiFi alongside the more traditional 2G,
    2.5G and 3G technologies. In Chapter 4, *Can we Confidently Rely on Wireless Communication?*
    we begin to address issues surrounding security, interference, coexistence and
    interoperation which continue to plague our ethos of working and social life.
    In Chapter 5, *Realizing a True*'
  merge: -1
  pgno: 16
- img_proc: true
  md: 'Wireless Life-style Vision, we explore the future of consumer interaction and
    how we might achieve true transparency and complacency with wireless products
    – in essence we touch upon how a wireless life-style should manifest itself to
    the consumer.


    With our foundation set and our expectations defined we can continue our understanding
    with a series of chapters that help us appreciate that wireless technology does
    not have to be governed in a rigorous manner with copious quantities of red tape.
    Part Two, A Proprietary Approach to Developing Wireless Applications, presents
    three technologies that deliver wireless communications in an unpretentious fashion.
    Firstly, in Chapter 6, An Introduction to the Notion of Proprietary-based Application
    Development, we make light of the standardization process and present three case
    studies. In our first look at a proprietary technology, Chapter 7, ZenSys: An
    Open Standard for Wireless Home Control, discusses a new wireless home technology
    enabling all types of homes with automation, control and security. Secondly, in
    Chapter 8, Cypress Semiconductor: Introducing WirelessUSB, we illustrate the advantage
    of utilizing a technology that enables wireless functionality through a USB port.
    Cypress Semiconductor takes advantage of the 2.4GHz ISM band to deliver a cable
    replacement technology that compet competes with Bluetooth. In the last chapter
    of this section, Chapter 9, Aura Communications: Creating the Personal Bubble,
    we witness a unique technology that is capable of delivering stereo audio for
    audio players.


    In the final section, Part Three, A Standards Approach to Developing Wireless
    Applications, we draw upon the numerous technologies that we have undoubtedly
    come into contact. In Chapter 10, An Introduction to the Notion of Standards-based
    Application Development, we refocus our discussion in light of the benefits received
    from adopting a standardized approach to wireless product development. In Chapter
    11, Bluetooth: A Replacement Technology, we discuss and illustrate a technology
    that has been around for a few years but is still very much in its infancy of
    market penetration. Equally, in Chapter 12, ZigBee: Untethered and Unlicensed,
    we introduce a relatively new technology that hopes to become a de facto home
    control solution for all types of home. In Chapter 13, WiFi: Enabling True Ubiquitous
    Connectivity, we discuss a technology that has been swept away with insurmountable
