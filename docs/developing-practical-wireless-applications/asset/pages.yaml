  md: '# Extending the application-base


    With an already established range of applications (Bluetooth Profiles) and the
    potential application base when the marriage of Bluetooth and UWB has been consumated,
    then there is clearly an opportunity for many individuals and manufacturers to
    develop new applications. Furthermore, the current specification is being upgraded
    to reflect new changes to the core specification and new profiles. A change is
    inevitable as we see the marriage of Bluetooth and UWB evolve from its flimsy
    anniversary to a more solid foundation that may become wed five years of a successful
    relationship. Naturally, with an established relationship there''s always the
    possibility of complacency and the allure of a year itch. Fortunately the Bluetooth
    SIG, an incorporated organization responsible for architecting and shaping Bluetooth''s
    future, creates a series of Market Requirement Documents (MRDs) that disclose
    future usage scenarios. These MRDs are the foundation from which the specification
    has evolved and further MRDs are created to provide new usage scenarios, that
    is, new ideas that may result in new applications (profiles). You may consider
    the MRD, as an internal business justification process within the SIG; these usage
    scenarios are submitted to external reviewers for their comments.


    # Foundation Profiles


    The following table (Table 11.7) lists the original set of Bluetooth profiles
    proposed in the Specification of the Bluetooth System: Profiles, v1.1. Incidentally,
    the LAN Access Profile (LAP) has been disbanded and is now replaced with the Personal
    Area Networking (PAN) Profile. The number of profiles outlined in this table are
    prevalent in most Bluetooth wireless products and have enjoyed a moderate success
    within the Bluetooth community.


    # The Adopted Profiles


    The adopted profiles (as shown in Table 11.8) are a clear diversification from
    the founding profiles, perhaps an acknowledgement to the SIG that needs to adapt
    its current application portfolio to a more multimedia-centric application base,
    which (we are told) the consumer desperately needs to fulfill.'
