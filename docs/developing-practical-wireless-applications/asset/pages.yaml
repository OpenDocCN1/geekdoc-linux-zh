    # The mesh networking topology


    The foundation upon which the Z-Wave topology finds itself is primarily based
    on a mesh network, as illustrated in Figure 7.5. As the dictionary definition
    describes, a mesh is a web or lattice structure that is interconnected. The advantage
    prescribed by such a structure is that there is no server or host machine required
    and, as such, if a node becomes unstable ethos, or dies within the mesh, then
    the entire system does not fail. It follows a self-sustaining ethos, as we earlier
    described. Additionally, the exposure or range covered by Z-Wave logistically
    exceeds most personal-area technologies, as a mesh can cover, for example, an
    area from five to several hundreds of meters (the number of nodes is restricted
    to 232, although this may be extended through multiple mesh networks).— distribution
    and number of nodes in an environment should also


