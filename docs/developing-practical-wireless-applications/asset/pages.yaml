  md: 'The Republic of China has also made its own contribution to the IMT-2000 partnership
    in association with Siemens. It has defined a CDMA derivative called Division
    Synchronous CDMA (or TD-SCD) and was incorporated by the 3GPP in 2001 as part
    of the UMTS standard. It is envisioned that TD-SCD will initially be deployed
    in China, where at the time of writing, field testing is being conducted. Underlying
    UMTS is a radio access method called Universal Terrestrial Radio Access (UTRA),
    which constitutes the WCDMA, UTRA/FDD method and the TD-SMA, UTRA/TDD (Time Division
    Duplex) method. The two methods each accommodating the various services that are
    available through UMTS.


    # Understanding how CDMA works


    CDMA is a Direct Sequence Spread Spectrum (DSSS) technology that does not transmit
    on a particular frequency, as compared with FDMA and TDMA. It uses all available
    bandwidth for multiple users in the same channel, where codes are assigned to
    identify individual connections. We illustrate the conceptual model of CDMA in
    Figure 3.11. Despite multiple users using the same channel interference occurs
    between conversations. Like FDMA and TDMA, CDMA has access to the same spectrum,
    but merely the way it uses spectrum. It is the unique characteristic of the spread
    spectrum technique that makes this possible. In short, data is transmitted in
    its rawest form (binary 1s and 0s) and is spread over a pseudo-random pattern.
    Both the transmitter and receiver have agreed how to channel in a pseudo-randomly
    encode and decode the binary data. Similarly, with a number of potential callers
    engaged in a connection, a receiver will only listen to a particular conversation,
    that is, the conversation that has the right code.


    ![](img/3adb5649a7b2815c7caab032dd5fe2b9_54_0.png)


    | FREQUENCY | CALLER 3 |

    | --- | --- |

    | | CALLER 2 |

    | | CALLER 1 |'
