    # # Overcoming the Obvious


    The sheer simplicity in transforming the PHY and MAC layers of the RICH has now
    brought us the original 802.11 specification. But, not all is what it seems. A
    fixed networking environment, in fairness, we secure; hackers have to typically
    use another fixed network to attempt to gain access to your network infrastructure.
    In short, to achieve unauthorized access a hacker had more or less to enter a
    property and physically connect the cable to a notebook – we are tried and trusted
    self-defense mechanisms keeping intruders out (we are referring to more than just
    security guards of course). Nowadays, we brings about a new breed of hacker; when
    you may recall from Chapter 4, *Can we Confidently Rely on Wireless Communications?*
    when we compared a hacker to a tramp: someone who scavenges, but then went to
    allege that they have their hearts in the right place. Anyway, hackers have afforded
    us an insight into the vulnerabilities of the original 802.11 specification. As
    such, we have seen the IEEE vehemently strive to overcome these shortcomings and
    offer us WiFi Protected Access (WPA) which replaced the weaker *Wired Equivalent
    Privacy* (WEP).


    The original introduction of WEP and its bias towards the RC4 algorithm resulted
    in numerous attacks on WiFi. It seen that WEP suffered from *key recovery attacks*
    where hackers made assumptions about the WEP key value based upon the value given
    in the encrypted value which was prefixed to a ciphertext. Many individuals and
    companies alike have highlighted the ineffectiveness of the RC4 algorithm and
    might have been afforded an opportunity to resolve these الرياضيات effectively.
    WPA (and WPA2) soon emerged after the weaknesses were identified with WEP. WEP
    became ratified by the IEEE in 2004 and WPA2 is the certified 802.11 specification.
    WPA offers several new key enhancements, namely the *Temporal Key Integrity Protocol
    (TKIP)*, and the *802.1X User Authentication and Extensible Authentication Protocol
    (EAP)* which which now, in'
