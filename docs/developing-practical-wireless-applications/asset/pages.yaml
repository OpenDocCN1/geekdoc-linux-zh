  md: '# Glossary and Definitions


    1G First Generation. First generation telecommunications was only capable of supporting
    voice traffic. It was susceptible to interference and offered no security; see
    2G, 3G and 4G.


    2G Second Generation. It is with the growth and deployment of digital capability
    that has led the way forward to the second generation era. The available frequencies
    that are open to an analog system are also available to a digital system. The
    distinction between them is that the digital system uses the frequencies in a
    different way; see 2G, 3G and 4G.


    2.5G Second Generation (Extended). A transitory state of evolution between 2G
    and 3G technology – GPRS is a 2.5G technology; see GPRS.


    2.75G Second Generation (Additionally extended).


    3G Third Generation. Operators in this era have shifted to a new paradigm who
    are eager to deliver advanced methods for data-centric applications, such as broadcast
    quality video – UMTS is a 3G technology; 1G, 2G, 4G and UMTS.


    3.5G Third Generation (Extended). A transitory state of evolution between 3G and
    4G technology – HSDAPA is a 3.5G technology; see HSDAPA.


    3.75G Third Generation (Additionally extended).


    3Wire A transport mechanism between a host and a host controller of a Bluetooth-enabled
    device; see UART and USB.


    4G Fourth Generation. The fourth generation of cellular technologies will shift
    to a more data-ready centric environment where users will be able to download
    a variety of content, such as television for example. It is widely thought of
    as a conceptual evolution and may, in fact, reveal itself as a convergence of
    a number of wireless technologies; see 1G, 2G and 3G and Convergence.'
  merge: -1
  pgno: 249
- img_proc: true
  md: '802.3 A series of IEEE standards that define the PHY and MAC layers for fixed
    LAN Ethernet; see Ethernet, LAN, MAC and PHY.


    802.11 The original standard developed in 1999. The original specification supported
    1Mbit/s using the overcrowded 2.4GHz frequency.


    802.11a A 5GHz solution offering a data rate of up to 54Mbit/s, which was also
    offered in 1999.


    802.11b The most prolific and widely adopted specification, which comprised a
    number of amendments to the original specification. It was backward compatible
    with the original specification, but additionally offered 5.5Mbit/s and 11Mbit/s.


    802.11c A lesser known specification, but plays a crucial role within the WiFi
    genre of products as it enables wireless bridging between access points.


    802.11d Again a lesser known specification, but dominates much of the WiFi technology
    in use today as it provides harmonization within countries that are unable to
    use WiFi.


    802.11e An increasingly predominant specification that ensures your WiFi products
    sustain a good quality of service.


    802.11g Another prolific and widely adopted technology that offered backward compatibility
    with 802.11b. It emerged in 2003 offering data rates of up to 54Mbit/s.


    802.11b A standard that was specifically developed to overcome interference with
    the 802.11 specification, as there were issues with the 5GHz band interfering
    with satellite and other radio equipment.


    802.11i The specification primarily overcomes issues surrounding WiFi security
    and emerged circa 2004.


    802.11j A specification that was specifically drafted for the Japanese market
    to accommodate their rules regarding radio.


    802.11k With the prevalence of WiFi-enabled access points this specification was
    developed to enhance access point selection where multiple services are offered
    and is expected to be available in 2007.


    802.11m Intriguingly, this specification is a proposal by the 802.11 working group
    to ensure that all the specifications within the 802.11 family are maintained
    and up-to-date; the IEEE began keeping their house in order back in 999.


    802.11n Individually, this specification will keep other personal-area technologies
    on its toes, as it is set to compete with wireless technologies that will offer'
  merge: -1
  pgno: 250
- img_proc: true
  md: 'audio/video capability. It will be available in 2007 and uses the 2.4GHz band
    offering a data throughput up to an amazing 300MBit/s.


    **802.11p** Another exciting specification that specifically targets the vehicle
    industry, not just your cars, trains, airplanes and so on, and is expected to
    be published circa 2008.


    **802.11r** This specification complements 802.11k, as it alleviates issues roaming
    when presented with multiple services.


    **802.11s** A specification that accommodates mesh networking. The standard is
    expected to be available in 2008.


    **802.11t** WiFi has populated numerous homes and offices and, as such, this specification
    ensures future reliability of the technology with its *Wireless Performance Prediction
    (WPP)* test method.


    **802.11u** WiFi increasingly finds itself integrated into networks of consumer
    electronics products and, as such, this specification affords a user the ability
    to connect to a network with some or limited services.


    **802.11v** This standard allows administrators to manage and configure their
    networks and is much still in its early stages of development.


    **802.11wi** already offers increased security and authentication; particular
    task group is working on amendments to the specification that shall complement
    802.11i and will protect management frames within the WiFi protocol.


    **802.11y** Another specification in its very early stages. 802.11y looks at the
    new 3.65-3.7GHz bands and how it might offer broadband wireless services.


    **802.15.3** An IEEE standard that defines the PHY and MAC layers for high-rate
    WAN; see MAC, PHY and MAC².


    **802.15.3a** An extension to the 802.15.3 standard offering an alternative PHY
    layer for consideration with WiMedia; see PHY and *WiMedia*.


    **802.15.4** An IEEE standard that defines the PHY and MAC layers for low-rate
    WAN. The standard is the basis of ZigBee; see MAC, PHY, MAC² and ZigBee.


    **802.15.4b** An extension to the 802.15.4 standard offering improved security
    and an attempt to resolve ambiguities with the original standard; see *ZigBee*.


    **802.16** An IEEE standard that defines the global exploitation of BWA for the
    MAN and is commonly referred to as WiMAX; see *BWA, MAN* and WiMAX.'
  merge: -1
  pgno: 251
- img_proc: true
  md: '802.16e An extension to 802.16 that accommodates the flexible or mobile nature
    of a device within a MAN context referred to as Mobile WiMAX; see MAX and Mobile
    WiMAX.


    802.1X An IEEE standards based upon EAP that typically provides authentication
    on AP; see AP.


    8PSK 8 Phase Shift Key. A modulation scheme is used with EDGE, as such data rates
    up to 384Kbps can be achieved.


    A2DP Advanced Audio Distribution Profile (Bluetooth).


    Access Point A wireless-enabled device that is capable of interconnecting multiple
    devices wirelessly to a WLAN. An AP may perform authentication and encryption
    to authorize connections; see WLAN.


    ACL Asynchronous Connection-Oriented. A data-specific logical connection between
    two or more Bluetooth-enabled devices; see eSCO and SCO.


    Ad hoc A specific mode of operation that permits STAs to informally join a network
    without the provision of an AP. More generally, it refers to the ability of a
    user to connect to a LAN where the LAN typically consists of a trusted group stations;
    see AP LAN and STA.


    AIB Information Base. In ZigBee references protocol stack refers to the collection
    of managed objects within the APS; see Application Objects and APS.


    AID Association Identifier.


    Alphabet Soup A phrase that has been used to coin the collection of letters that
    are associated with the IEEE 802.11 specifications.


    AMPS Advanced Mobile Phone Standard. A 1G analog cellular technology; see 1G and
    DAMPS.


    AP Access Point, see Access Point.


    APL Application Layer: see Application Layer.


    Application Framework In ZigBee, the application framework is a conceptual framework
    which houses the application objects of a given node; the application framework
    has a number of defined interfaces, such as ZDO, and is an integral component
    of the ZigBee protocol stack; see Application Objects and ZDO.


    Application Layer In ZigBee, an application layer is the formation of the application
    framework, ZDO and APS, which uniquely defines a specific application; see APS
    and ZDO.'
  merge: -1
  pgno: 252
- img_proc: true
  md: 'Application Objects In ZigBee, the application objects are units contained
    within the application framework on a node that is defined by the profile developer
    or manufacturer; see Application Framework.


    Application Support Sub-layer In ZigBee, the application support sub-layer provides
    an interface to the NWK and A layers; APL and NWK.


    APS Application Support Sub-layer; see Application Support Sub-layer.


    APSDE Application Support Sub-layer Data Entity (ZigBee).


    APSDE-SAP APSDE Service Access Point (ZigBee).


    APSME Application Support Sub-layer Management Entity (ZigBee).


    APSME-SAP APSME Service Access Point (ZigBee).


    AS Authentication Server.


    ASB Active Slave Broadcast. An ASB is used when a Bluetooth master wishes to communicate
    with many active Bluetooth devices; see PSB.


    ASIC Application-Specific Integrated Circuit. A customized circuit that has been
    designed for a particular purpose; for example, as 802.11b or a Bluetooth integrated
    circuit would be ASICs as they have been designed to perform a specific task.


    AVRCP Audio/Video Remote Control Protocol (Bluetooth).


    AutoID Automatic Identifier. An automatic identification system used within within
    RFID technology that enables the automatic tracking and monitoring of tags, typically
    used in a location to monitor goods and out of a warehouse, for example; RFID
    and Tags.


    Backhaul The backhaul refers to the delivery of a wireless service from a BSC
    which is typically connected to a fixed infrastructure, to a base station or an
    AP; see AP and BSC.


    Basic Rate The basic rate data service offered in Bluetooth wireless technology,
    typically offering a data rate of up to 1Bit/s; see Bluetooth and Enhanced Data
    Rate.


    BD_ADDR Bluetooth Device Address; see MAC.


    BER Bit Error Rate.


    BIP Basic Imaging Profile (Bluetooth).


    Bluetooth A cable replacement technology that utilizes the overcrowded ISM 2.4GHz
    radio spectrum. Bluetooth wireless technology has enjoyed moderate success within
    the cellular phone and headset market; see ISM.'
  merge: -1
  pgno: 253
- img_proc: true
  md: 'BoM Bill of Materials. BoM is the constitution of a product’s parts or components,
    for example its electronics make-up (silicon, resistors, capacitors) and its casing
    (plastics).


    **Bonding** A term used within Bluetooth wireless technology. It demonstrates
    the user’s intent to pair with one or more Bluetooth-enabled devices; as *Bluetooth
    and Pairing.*


    **BPP** Basic Printing Profile (Bluetooth).


    **BPSK** Binary Phase Shift Keying; as *8PSK.*


    **BSC** Base Station Controller. A unit that is typically connected to a fixed
    infrastructure and wireless connected to a base station or an AP; *Backhaul.*


    **BSS** Service Set. A BSS is pivotal in a WiFi network as it indicates the range
    in which a number of stations can share a connected service; as *STA and WiFi.*


    **BT** Bandwidth-bit Time.


    **BT** Bluetooth; as *Bluetooth.*


    **BSSID** Basic Service Set Identifier. A 48-bit MAC address that is used to uniquely
    identify a BSS and an IBSS on a WLAN network; as *BSS, IBSS, MAC* and *SSID.*


    **BWA** Broadband Wireless Access; as *WiMAX.*


    **CBC-MAC** Cipher-block Chaining with Message Authentication Code. A cipher scheme
    used to encrypt plaintext.


    **CCA** Clear Channel Assessment. A mechanism used, prior to a transceiver transmitting
    a payload, to determine if a channel is clear; as *CSMA-CA* and *CSMA-CD.*


    **CCK** Complementary Code Keying.


    **CCMP** CTR with CBC-MAC Protocol.


    **CDMA** Code Division Multiple Access.


    **Checksum** A value that is appended to a data packet to transmission. It ensures
    that the receiving device has not received corrupted or invalid data.


    **Chip¹** A chip synonymously referred to as an integrated circuit or semiconductor;
    essentially, a microprocessor that has a duty to perform a number of tasks; as
    *ASIC* and *Chip¹.*


    **Chip²** A British cuisine — similar, buter and tastier than the French equivalent
    (fries), often accompanied with fish and lasings of tomato ketchup. Also known
    as a potato chip (US) and a tortilla chip (Mexico), and equally as tasty.'
  merge: -1
  pgno: 254
- img_proc: true
  md: 'CID Channel Identifier. The identification of an L2CAP logical endpoint used
    within the Bluetooth protocol stack; see L2CAP.


    CIP Common ISDN Access Profile (Bluetooth).


    Coexistence A classic term thrown around the very early days of wireless emergence.
    It specifically refers to the ability of multiple wireless enabled devices to
    coexist in proximity without degrading the respect of another wireless device;
    see Interoperation.


    Convergence The amalgamation of a number of wireless technologies into a single
    device that manifests itself as a single application to the consumer; for example,
    if a consumer wishes to surf the Internet the medium service will remain transparent
    to the consumer, but the combination of technologies will afford the consumer
    a single experience; see Coexistence.


    CRC Cyclic Redundancy Check; see Checksum.


    CSD Circuit Switched Data; see HCSD.


    CSMA-CA Carrier Sense Multiple Access with Collision Avoidance. A technique used
    in wireless LANs is to ensure that a payload transmits when a channel (wireless)
    is clear and no other station is transmitting; see CSMA-CD and Station.


    CSMA-CD Carrier Sense Multiple Access with Collision Detect. A technique used
    in fixed LANs is to ensure that a payload transmits when a channel (fixed) is
    clear and no other station is transmitting; see CSMA-CA.


    CTP Cordless Telephony Profile (Bluetooth).


    D-AMPS Digital Advanced Mobile Phone Standard. The onset of 2G technology; a digital
    revision of AMPS; see AMPS.


    DCF Distributed Coordination Function. A default mechanism for a station (or a
    wireless node) is used in a WLAN to determine if other stations are transmitting
    before it transmits itself; see CS and WLAN.


    DDR Dual Data Rate.


    Downlink A downlink represents the communication pathway between a server and
    client device, for example; see Uplink.


    DHCP Dynamic Host Configuration Protocol. The DHCP protocol affords the allocation
    of IP address, as well as a host of configuration parameters, as DNS addresses
    and subnet masks; see DNS, IP and subnet mask.'
  merge: -1
  pgno: 255
- img_proc: true
  md: 'Distributed Application In ZigBee a series of nodes will be distributed around
    an area as a home or office. For example, one node will communicate with a light
    on another node, in turn, they collectively form a simple light switch (on/off)
    application.


    DNS Name System; see DHCP.


    DoS Denial of Service. A DoS is where a hacker disrupts a system by disabling
    users to access a service.


    DS Distribution System (WiFi).


    DSM Distribution System Medium (WiFi).


    DSRC Dedicated Short Range Communications. A short range communication technology
    specifically designed for automotive applications; see ITS.


    DSS Distribution System Service (WiFi).


    DSSS Direct Sequence Spread Spectrum. A modulation scheme where the signal is
    spread over the allocated bandwidth.


    DUN Dial-up Networking (Profile).


    E0 A stream cipher algorithm in Bluetooth that individually encrypts digits within
    a plaintext payload; see Bluetooth.


    EAP Extensible Authentication Protocol (WiFi).


    EAPOL Extensible Authentication Protocol over LAN (WiFi).


    EDGE Enhanced Data GSM Evolution. A technology that supports greater throughput
    for data-centric applications; see GPRS, GSM and HSDPA.


    EDR Enhanced Data Rate, see Enhanced Data Rate.


    EMCA European Computer Manufacturers Association.


    Endpoint An endpoint in a ZigBee protocol stack refers to a logical connection
    that is made between nodes that share common applications; see Application Framework.


    Enhanced Data Rate An extended version of the Basic Rate used for data applications
    within Bluetooth. An EDR-enabled device is capable of supporting data rates of
    up to 3Mbit/s; see Basic Rate and Bluetooth.


    Extended Rate PHY A modification (WiFi) that has been made to the PHY layer of
    the OSI Model; see OSI Model, PHY and WiFi.'
  merge: -1
  pgno: 256
- img_proc: true
  md: 'eSCO Extended Synchronous Connection-Orientated. eSCO is an audio/voice-centric
    logical connection medium in Bluetooth supporting a faster and more reliable data
    throughput; see ACL, Bluetooth and SCO.


    **ESDP** Extended Service Discovery Profile (Bluetooth).


    **Ethernet** A fixed LAN technology based upon the IEEE 802.3 standard; see NIC.


    **ETSI** European Telecommunications Standards Institute.


    **FAX** FAX Profile (Bluetooth).


    **FCS** Frame Check Sequence; see Checksum.


    **FDD** Frequency Division Duplex.


    **FDMA** Frequency Division Multiple Access.


    **FFD** Full Function Device. An end-device within a ZigBee network topology;
    see RF.


    **Feistel** A Feistel is a cryptographic block cipher; see TEA.


    **Felcia** A Sony smart-contact-less card based upon NFC technology; see NFC.


    **FM** Frequency Modulation.


    **FOMA** Freedom of Mobile Multimedia Access. A brand name given to the NTT DoCoMo
    3G technology service in Japan.


    **FSK** Frequency Shift Keying.


    **FTP** File Transfer Profile (Bluetooth).


    **Frequency Hoping** A scheme used in Bluetooth and other wireless technologies
    that hops between channels if a given channel is already being used. A master
    and slave device will agree on how to do this.


    **GAP** Generic Access Profile (Bluetooth).


    **GFFSK** Gaussian Frequency Shift Keying.


    **GOEP** Generic Object Exchange Profile (Bluetooth).


    **GMK** Group Master Key (WiFi, WPA2).


    **GMSK** Gaussian Minimum Shift Keying.


    **GPRS** General Packet Radio Services. A 2.5G technology that supports greater
    throughput for data-centric applications; see EDGE, HSDPA, GSM and UMTS.'
  merge: -1
  pgno: 257
- img_proc: true
  md: 'GSM Global System for Mobile Communications. A 2G digital cellular technology
    is widely used throughout the world; see EDGE, GPRS, HSCSD and UMTS.


    GTK Group Transient Key. A GTK is generated as the result of a GMK (WiFi).


    HC Host Controller Interface (Bluetooth); see 3Wire, SD, UART and USB^2.


    HCI Host Controller Interface (Bluetooth); see 3Wire, SD, UART and USB^2.


    HCRP Hard Copy Replacement Profile (Bluetooth).


    HFP Hands-free Profile (Bluetooth).


    HID^1 Human Interface Device. Any device that enables a human to input information
    to a computer is a HID; for example, a keyboard and mouse are HID devices.


    HID^2 Human Interface Device (Profile).


    Hotspot A hotspot is a location which is covered by an AP that allows a user to
    connect to a wireless service, such as the Internet.


    HR/DSSS High-rate DSSS; see DSSS.


    HSCSD High Speed Circuit Switched Data. A modification that has been made to GSM
    to support greater data throughput over the cellular network; see EDGE, GPRS,
    GSM and UMTS.


    HSDPA High-speed Downlink Packet Access. A modification to WCDMA technology to
    further increase data throughput for data-centric applications. HSDPA is considered
    to be a 3.5G technology; see EDGE, GPRS, GSM and UMTS.


    HSP Headset Profile (Profile).


    IBSS Independent Basic Service Set. An IBSS is an ad hoc WiFi-LAN where STAs can
    informally join a network without the provision of an AP; see AP, BSS, LAN, STA
    and WiFi.


    IC Integrated Circuit.


    ICP Intercom Profile (Bluetooth).


    ICV Integrity Check Value; see Checksum.


    IEEE Institute of Electrical and Electronic Engineers.


    IF (low-) low-Intermediate Frequency.


    i-Mode A Japanese service which is increasingly popular throughout the world;
    see Wireless Application Protocol.'
  merge: -1
  pgno: 258
- img_proc: true
  md: '# Glossary and Definitions


    **Infrared** A short-range wireless medium that uses Infrared as its transport
    medium. A successful wireless technology that has been mimicked in its application-base
    by Bluetooth; see see *Bluetooth*.


    **Interoperation** Interoperation is the ability for one device to successfully
    communicate another irrespective of manufacturer; see *Coexistence*.


    **IP** Internet Protocol. A commonplace protocol that is used to enable communication
    between client and server-based packet-switched networks such as the Internet.


    **IrDa** Infrared Data Association; see *Infrared*.


    **IS-54** Interim Standard 54. A standard that outlines the DAMPS technology;
    see IS-95, CDMA, IS-136 and *D-AMPS*.


    **IS-95** Interim Standard 95. A standard that outlines the CDMA digital technology;
    see IS-54, AMPS, IS-95 and *D-AMPS*.


    **IS-136** Interim Standard 136. As IS-54, but with additional features to include
    text messaging and CSD; see IS-54, AMPS, IS-95 and *CDMA*.


    **IDSN** Integrated Services Digital Network.


    **ISM** Industrial, Scientific and Medical.


    **ISP** Internet Service Provider. A company that typically offers Internet access
    and other services; see *WISP*.


    **ITS** Intelligent Transportation System. A worldwide proposal that will enable
    a multiple number of transport vehicles and its associated infrastructure to carry
    information; see *DSRC*.


    **IV** Initialization Vector. A 24-bit integer used in creating a 64-bit secret
    WEP; see *WEP*.


    **JDC** Japanese Digital Cellular, see *PDC*.


    **KVP** Key Value Pair (service type). A basic command/control messaging mechanism
    used within the ZigBee protocol stack; see *MSG*.


    **L2CAP** Logical Link Control and Adaptation Protocol (Bluetooth).


    **LAN** Local Area Network. A fixed structure of interconnecting computers or
    devices sharing services; see *WLAN*.


    **LAP¹** LAN Access Profile (Bluetooth).


    **LAP²** Lower Address Part (Bluetooth).'
  merge: -1
  pgno: 259
- img_proc: true
  md: 'LC Link Controller. A layer one component (OSI-based) of the Bluetooth protocol
    stack; see PHY and OSI Model.


    LM Link Manager. A layer two component (OSI-based) of the Bluetooth protocol stack,
    see MAC² and OSI Model.


    LMP Link Manager Protocol (Bluetooth).


    LPP Local Positioning Profile (Bluetooth).


    LSB Least Significant Bit (or Byte).


    LT_ADDR Logical Transport Address (Bluetooth).


    MAC¹ Access Control (address). A 48-bit address that uniquely identifies a device
    at a physical location in a network.


    MAC² Medium Access Control (layer). The MAC forms the data link layer (second
    layer) of the OSI model and sits above the PHY layer; see OSI Model and PHY.


    MAN Metropolitan Area Network. A MAN is a large-scale hotspot equivalent; Hotspot.


    ME Management Entity.


    MMS Multimedia Messaging Service.


    MIC Message Integrity Code. In a wireless communication system a MIC is often
    appended to a payload to ensure the integrity of the data being received; see
    Checksum.


    Michael See MIC.


    Mesh Network A mesh is a web or lattice structure that is interconnected. ZigBee
    and Z-Wave network may form a mesh structure.


    MLME MAC Layer Management Entity (WiFi); see MAC^2.


    Mobile WiMAX See WiMAX.


    MPDU MAC Protocol Data Units (WiFi); see MAC^2 .


    MSB Most Significant Bit (or Byte).


    MSC Message Sequence Chart.


    MSDU MAC Service Data Units (WiFi); see MAC^2.


    MSG Message. A more dynamic command/control messaging mechanism used within the
    ZigBee protocol stack that uses the underlying KVP service, but remains application-specific;
    see KVP.'
  merge: -1
  pgno: 260
- img_proc: true
  md: 'Multicast Most Significant Bit (or Byte).


    NAP Non-significant Address Part (Bluetooth).


    NAS Network Access Server.


    NAV Network Allocation Vector. A virtual carrier-seense function that affords
    the MAC sub-layer of a WLAN the ability to predict the traffic on the network
    before it transmits a new payload; see DCF, MAC² and WLAN.


    NFC Near Field Communications.


    NFMC Near Field Magnetic Communication. A technology that is Aura Communications
    Technology which provides the ability to support stereo functionality; see NFC.


    NIC Network Interface Card. A fixed unit typically fitted into your PC by the
    PCI slot of your computer supports the communication of your LAN; see WNIC.


    A node is a self-organizing, self-sustaining wireless device (ZigBee or Z-Wave)
    that communicates with other nodes. It is the collection of these nodes that form
    the intended application; see Distributed Application.


    NWK Network (ZigBee); see ZigBee.


    OBEX Object Exchange (Bluetooth). A communications protocol that is used by Bluetooth
    wireless technology to support a host of Infrared legacy applications; see Infrared.


    OpCode Operation Code. An OpCode is used to denote the type of PDU being sent
    in the LM layer of a Bluetooth protocol stack; see Bluetooth,


    OPP Object Push Profile (Bluetooth).


    OSI Open Systems Interconnect.


    OSI Open Systems Interconnect Model. A paradigm used within communication protocol
    that enables interoperation. The OSI model is made up of seven layers; see Interoperation.


    OTG On The Go. A derivative of the USB technology that enables multiple devices
    to be connected to one another without the support of a computer; see USB.


    PAE Portal Access Entry.


    PAN¹ Personal Area Network. A number of computers or devices that are connected
    on an ad hoc basis; see Ad hoc.'
  merge: -1
  pgno: 261
- img_proc: true
  md: 'PAN² Personal Area Network Profile (Bluetooth).


    **Pairing** (Bluetooth) A procedure that is undertaken when two or more Bluetooth-enabled
    devices exchange a Bluetooth passkey – this typically leads on authentication
    and encryption; see *PIN*.


    **Passkey** (Bluetooth) A passkey is typically used within the Bluetooth context
    to authorize a user access to Bluetooth-enabled device; see *Bluetooth*.


    **PBCC** Packet Binary Convolutional Code.


    **PC** Point Coordinator. A mechanism used in an AP of a WLAN to individually
    poll each connection to determine which one can transmit; see *DCF* and *PCF*.


    **PCF** Point Coordination Function. A mechanism used within an AP which is used
    to determine if other stations are transmitting; see *AP* and *DCF*.


    **PCI** Peripheral Component Interconnect.


    **PCS** Personal Communication Services.


    **PDA** Personal Digital Assistant.


    **PDC** Personal Digital Cellular. A Japanese derivative of D-AMPS and GSM; see
    *D-AMPS* and *GSM*.


    **PDU** Protocol Data Unit.


    **Personal-area** With the introduction of a new range of wireless-enabled applications
    that define a greater sense of personal mobility and freedom uniquely captures
    the personal-area technology era. Technologies such as Bluetooth, WiFi, ZigBee
    and so on, afford the user greater flexibility in their personal and/or working
    environment. Personal-area technology enables users to create their own personal
    communications environment, which may comprise a notebook wirelessly connected
    to a network and a cell phone that utilizes a Bluetooth-enabled headset; see *Wide-area*.


    **PHY** Physical (layer). The physical layer forms the point at which software
    (a protocol stack) interacts directly to hardware (a radio, for example); see
    *OSI Model*.


    **PIN** Personal Identifier Number.


    **PLCP** Physical Layer Convergence Procedure. A sub-layer of the PHY layer within
    the WiFi protocol stack; see *PHY* and *PMD*.


    **PLME** Physical Layer Management Entity (WiFi).


    **PMD** Physical Medium Dependent. A sub-layer of the PHY layer within the WiFi
    protocol stack; see *PHY* and *PLCP*.'
  merge: -1
  pgno: 262
- img_proc: true
  md: 'PMK Pairwise Master Key.


    PN Pseudo-Noise.


    PPDU PHY Product Data Unit; see *PHY*.


    PRNG Pseudo-random Number Generator.


    PRoc Programmable Radio on a Chip.


    PSB Parked Slave Broadcast. The PSB allows the Bluetooth master to communicate
    with many Bluetooth parked slaves; see *ASB*.


    PSDU PLCP Service Data Units; see *PLCP*.


    PSK Phase Shift Keying: see *8PSK*.


    PSTN Public Switched Telephone Network.


    PTK Pairwise Transient Key.


    QPSK Quadrature Phase Shift Key; see *8PSK*.


    RF Radio Frequency.


    RFCOMM A layer within the Bluetooth protocol stack that emulates a serial port;
    see *Bluetooth*.


    RFD Reduced Function Device. An end-device within a ZigBee network topology; see
    *FFD*.


    RFID Radio Frequency Identification. A wireless technology that is primarily used
    for tracking and tracing of products and people. It is also used in smart payment
    systems; see *NFC*.


    RS232 A telecommunications standard that enables devices to communicate with one
    another; see *RFCOMM*.


    RSNA Robust Security Network Association.


    RSSI Received Signal Strength Indicator.


    SAR Segmentation and Reassembly. Typically a layer within the OSI model may have
    the responsibility to perform SAR. It specifically refers to the ability of a
    layer to proportion a payload into transmitting units that the interfacing layer
    can handle. The same layer, at the peer device, will also undertake the responsibility
    of the reassembly; see *OSI Model*.


    SCO Synchronous Connection-Oriented. SCO is an audio/voice-centric logical connection
    medium in Bluetooth; see *ACL* and *eSCO*.'
  merge: -1
  pgno: 263
- img_proc: true
  md: 'SD Secure Digital. A transport layer used within Bluetooth technology to enable
    a host and host controller to communicate with each other using flash memory technology;
    see UART, USB^B$ and SDA.


    SDA Secure Digital Association (sdcdcard.org).


    SDAP Service Discovery Application Profile.


    SDP Service Discovery Protocol.


    SDT SD Transport (Bluetooth); see HCI.


    SDU Service Data Unit.


    SFD Start Frame Delimiter.


    SIG Special Interest Group (Bluetooth). A non-profit organization that mandates
    the future growth and application-based of Bluetooth wireless technology; see
    Bluetooth.


    SIM1 SIM Access Profile (Bluetooth).


    SIM2 Subscriber Identity Module. A smartcard that is fitted into a cellular phone
    that identifies the user across a cellular network.


    SIS SUC Id Server.


    SLIP Serial Line Internet Protocol. A protocol that is based upon RFC1055 and
    is used to frame data payloads over a serial interface. In particular, this protocol
    is used within the 3Wire UART transport layer within Bluetooth technology; see
    UART.


    SMS Short Message Service.


    SMSing Short Message Servicing.


    SoC System on a Chip.


    SOHO Small Office/Home Office.


    SPP Serial Port Profile (Bluetooth).


    SRA Source Routing Algorithm.


    SSID Service Set Identifier. A unique field that is included within the MAC frame
    and is used to identify a packet. The identifier is made up of thirty-two alphanumeric
    octets, which is typically identified by a user when connecting to an AP; see
    $AP$, BSSID and MAC^2$.


    SSS Security Specification (ZigBee). A software entity within the ZigBee protocol
    stack that manages authentication and encryption for ZigBee-enabled devices.'
  merge: -1
  pgno: 264
- img_proc: true
  md: 'STA Station. A station is a computer or other device that can connect to a
    WLAN through an AP; see AP, BSS and WLAN.


    Subnet Mask The division of LANs on a single site can be achieved through the
    assignment of a subnet mask. A mask is assigned to every computer that has an
    IP address where a section of the IP address is allocated to the sub-network;
    see IP and LAN.


    SUC Static Update Controller.


    Syn Synchronization Profile (Bluetooth).


    Tag(s) An RFID or NFC device that contains sufficient information that conveys
    pertaining to a product or person; see RFID and NFC.


    TCS Telephony Control System (Bluetooth).


    TDD Time Division Duplex.


    TDMA Time Division Multiple Access.


    TD-SMA Time Division-Synchronous Code Division Multiple Access.


    TEA Tiny Encryption Algorithm. A simple block cipher that is easy to deploy and
    implement; see Feistel.


    Text Short Message Service.


    TID Transaction ID. A bit that is set to 1, to denote that a LMP PDU was initiated
    by a Bluetooth slave and conversely, if set to 0, denotes that a LMP PDU was initiated
    by the Bluetooth master; see LMP and PDU.


    TKIP Temporal Key Integrity Protocol.


    Transponder See Tag.


    UAP Upper Address Part (Bluetooth).


    UART Asynchronous Receiver Transmitter. A transport layer used within Bluetooth
    technology to enable a host and controller to communicate with each other; see
    SD and USB.


    UHF Ultra-high Frequency.


    Ultra-Wideband A definitive technology that would ultimately outshine and displace
    Bluetooth, but as a result of a dichotomy of UWB solutions, we will ultimately
    witness a battle that will ensue a time akin to Beta vs. VHS.


    UMTS Universal Mobile Telecommunications Service.'
  merge: -1
  pgno: 265
- img_proc: true
  md: 'Uplink A downlink represents the communication pathway between a client and
    server device, for example; see Downlink.


    USB Universal Serial Bus. The USB has been around for almost as long as the PC
    and the simplicity afforded by such a technology has perpetuated the notion of
    connectivity as a means of plugging one into another; see OTG and Wireless USB.


    USB Universal Serial Bus (Bluetooth). A transport layer used within Bluetooth
    technology to enable a host and host controller to communicate with each other;
    see SD and UART.


    UWB Ultra-wideband; see Ultra-Wideband.


    VCO Voltage Controlled Oscillator.


    VCP Video Conferencing Profile (Bluetooth).


    VDP Video Distribution Profile (Bluetooth).


    VoIP Voice over Internet Protocol.


    WoWAN Voice over WAN.


    WoWiFi Voice over Wireless Fidelity; see Wireless Fidelity.


    VPN Virtual Private Network.


    WAP² Wireless Application Point; see Access Point.


    War-Challenging The processes involved in identifying vulnerable wireless networks
    are known as War-Walking, War-Driving and War-Storming (or Flying). Hackers use
    a series of symbols derived from hobism to identify such networks (War-Challenging).


    War-Driving See War-Challenging.


    War-Storming (or Flying) See War-Challenging.


    War-Walking See War-Challenging.


    WarXing The collective term that encompasses the utilized mode of transportation
    of hacking into a wireless network; see War-Challenging.


    WAVE Wireless Access in Vehicular Environments.


    WCDMA Wideband Code Division Multiple Access.


    WEP Wired Equivalent Privacy. WEP is an initial encryption scheme offered with
    WiFi which utilized the RC4 algorithm, but failed as a number of hackers revealed
    its shortcuts; see WPA.'
  merge: -1
  pgno: 266
- img_proc: true
  md: 'Wide-area (wireless communication) More established or wide-area technologies,
    such as, cellular and satellite are tried and trusted communication technologies
    that have been around for many years. We''ve come to know wide-area communications
    as telecommunications, since wide-area is synonymous with connectivity over greater
    distances; see *Personal-area*.


    WiFi Fidelity; see *Wireless Fidelity*.


    WiFi Alliance The non-profit organization, which mandates the future scope of
    WiFi. It additionally undertakes the effort to ensure that all WiFi-enabled products
    comply with their certification programme; see *Wireless Fidelity*.


    WiMAX Wireless Metropolitan Area Network. A BWA medium enabling consumers utilizing
    a MAN service to access the Internet, for example whilst the moe; see *MAN*.


    WiMedia According to the WiMedia Alliance, WiMedia is Ultra-wideband. A technology
    that is targeted for wireless multimedia applications; UWB.


    Wireless Application Protocol An open standard that permits connectivity for a
    mobile device, such as a cellular phone or PDA, to access the Internet or other
    web-based service; see *i-Mode*.


    Wireless Fidelity Wireless Fidelity is nowadays a brand name, trademarked and
    licensed by the WiFi Alliance, which undertakes the certification of the numerous
    802.11 genre of products. In essence, has manifested itself as the de facto wireless
    technology for the everyday user; see *WiFi Alliance*.


    Wireless An era of voice and data communication technologies that utilizes radio
    waves as a transport medium, in turn, enabling electronic devices to exchange
    a variety of information without cables, transparently and effortlessly; *Personal-area*
    and *Wide-area*.


    WirelessUSB WUSB is the next generation of center-centric wireless technology.
    WiMedia and Cypress Semiconductors have modified such technology that will revolutionize
    USB technology; see USB, UWB and *WiMedia*.


    Wireless Sniffer A wireless device that may be capable of intercepting the communication
    of wireless devices. A sniffer is expected to read and understand the information
    being exchanged enabling a hacker to lean personal information.


    WISP Internet Service Provider. A company that typically offers Internet access
    and other services through a hotspot (AP); see *AP*, *Hotspot* and ISP.


    WLAN Wireless LAN. A LAN that has one or more APs connected to, in, providing
    the same features of a fixed LAN, but wirelessly; see *LAN*.'
  merge: -1
  pgno: 267
- img_proc: true
  md: 'WMM WiFi Multimedia (Power Save). A revision to the 802.11 series of specifications,
    which encourages data to be transmitted in the shortest time possible, in turn,
    enabling a device to go to sleep more quickly.


    WNIC Wireless Network Interface Card. A wireless client device is fitted to a
    computer and mimics the behavior of a NIC; see *NIC*.


    WPA WiFi Protected Access is an early adopted specification to help overcome initial
    fears surrounding WLAN; see *WEP*.


    WPA2 WiFi Protected Access 2 is the ratified version of the IEEE 802.11i specification;
    see *WEP*.


    WPP Wireless Performance Predication (WiFi).


    WUSB WirelessUSB; see *WirelessUSB*.


    ZDO ZigBee Device Object. The ZDO within a ZigBee protocol stack has the responsibility
    for defining specific responsibilities of nodes, in terms of their behavior, in
    addition to performing service and device discovery procedures to learn of other
    similarly-enabled devices in proximity.


    ZigBee A low-cost and low-power embryonic wireless technology that aims to penetrate
    the smart home environment, security and home control are some examples. The ZigBee
    Alliance are in the process of drafting improvements to the current revision of
    the specification.


    Z-Wave A competitive home control technology to ZigBee provided by ZenSys have
    already penetrated the smart home context and seems to be further advanced than
    other would-be technologies.'
  merge: -1
