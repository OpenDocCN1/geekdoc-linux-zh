    # ZigBee Device Objects


    The ZDO has a significant role to play within the ZigBee protocol stack, in that
    it is responsible for defining roles and responsibilities for nodes (end-device
    applications) in addition to performing service and discovery protocols to learn
    of similarly-enabled devices in proximity and security, binding and network management.
    In addition to the above, the ZDO has responsibilities for housekeeping in the
    context of initializing the APS, the NWK and ensuring security services specification
    (SSS). The ZDO has a number of well-defined interfaces providing visibility to
    the application objects and interfaces with the ZDO management entity (ME) to
    and from the NWK layer and holistically supports the application framework. The
    notion of device and service discovery is very similar to that provided by Bluetooth
    wireless technology (see Chapter 11). The device mechanisms afford the ZigBee-enabled
    device an opportunity to learn of other devices in proximity; the actual behavior
    in terms of applications support by another device is understood when applying
    service discovery. The binding procedure is a conceptual connection (or an endpoint)
    that is established between nodes that share the same or multiple applications
    (profiles) and are identified using cluster identifiers; remember, these clusters
    contain attributes which let other devices know what to do. A node supports will
    have multiple endpoints associated with it, which are logical connections that
    are bound (bind) when service and discovery procedures are performed.'
