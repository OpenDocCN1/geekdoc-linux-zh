    one hundred or so) reeling. Naturally, the remaining members may be feeling vulnerable
    and uncertain about their future and as, as such, the WiMedia Alliance should
    take an opportunity to grotesqu abuse its advantage.


    # Conclusion


    UWB can stand on her two feet and provide an effective and robust wireless technology
    that will embarrass Bluetooth. The simple truth is that WiMedia doesn''t need
    Bluetooth; WiMedia can stand alone and deliver consistent and secure wireless
    technology branded WirelessUSB. Bluetooth adds another level of complexity, which
    will ultimately confuse a consumer-base that is already struggling to keep up
    with the three acronyms. In the background we often use muse with humor as consumers
    struggle to understand them. At least with USB and a 21st century transition to
    wireless wouldn''t be a far stretch for an average Joe Blogg consumer to understand.
    WiMedia needs to keep a steady hand when launching the UWB flavored products,
    as it really can''t afford any possible misunderstanding.


    # Summary


    +   - The proposition made by UWB is what Bluetooth wireless technology should
    have been.'
