    environments.


    In the following sections we appraise the generations of established wireless
    technologies and it will naturally provide a complete picture of the historical
    generation of wide- and personal-area, whilst molding a comparable impression
    of the overlap created between them. It is becoming evident that manufacturers
    integrate new wireless technology into cellular phones, notebooks and so on, resulting
    in the overlap of wide-area and personal-area communications (see Figure 3.4).
    It is through this overlap that bestows the mobility and freedom characteristics
    of our personal and working environments.


    # Generations of Wireless Technology


    Undoubtedly, many of us have witnessed the emergence of generations of wide-area
    technologies each depicting the advancement of applications and digital capability.
    Regularly we rely on the technology news, the relentless press releases announcing
    faster and better applications that now rely on 5G technology (more upon this
    later). Perhaps the label of old seems somewhat inappropriate, as the more established
    generations of the wide-area era are growing at a phenomenal rate. The depiction
    of wide-area communications helps us understand clearly where the respective technologies
    lie within the realm of personal-area emerging technologies, as we have conceptualized
    in Figure 3.5 (data rate vs. distance).


    # First Generation (1G)


    First generation (or 1G) telecommunications were only capable of supporting voice
    traffic. What''s more, they were very susceptible to interference and offered
    no security (eavesdroppers could listen in conversations). It has been reported
    that data traffic could occur, although "ideal" network conditions were required,
    perhaps something similar to, the wind blowing in your hair and the shining on
    your face! 1G was introduced in the early 1980s and was based upon an analog system
    comprising Frequency Modulation (FM), Frequency Division Duplex (FDD) and Frequency
    Division Multiple Access (FDMA). Combining these several variants of the first
    cellular technologies emerged to include the Advanced Mobile Phone Standard (AMPS),
    Total Access Communication System (TACS) and the Nordic Mobile Telephony (NMT);
    these variants


