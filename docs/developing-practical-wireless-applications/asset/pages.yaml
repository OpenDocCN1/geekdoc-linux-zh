    # The independent and basic service set (BSS)


    The Basic Service Set (BSS) is pivotal in a WiFi LAN and as shown in Figure 13.6
    we can see each of the BSSs have within their radio range (denoted by the shaded
    ellipses) a number of STA members. The STA itself provides a service, Station
    Service (SS) at the MAC layer, which includes authentication, confidentiality
    (privately) and payload delivery; while the STAs stay within radio range they
    remain part of the network and, as moving out of the shaded area would preclude
    them from a wireless network service; we can describe the behavior of such a system
    as dynamic and an STA is deemed associated once it becomes a member of the infrastructure
    BSS. The association of an STA and BSS are dynamically created (that is, in or
    out of radio range) and as, are managed by the Distribution System (DSS); we will
    discuss this in more detail in a moment. More specifically, what is shown in Figure
    13.6 are two Independent Basic Service Sets (IBSS) where the STAs can informally
    join a network without the provision of an AP; this particular mode of operation
    is referred to as an ad-hoc network. An AP is also deemed to have very similar
    properties to a STA which, in turn, incidentally affords access to the DSS services
    through the Distribution System (DSS).


