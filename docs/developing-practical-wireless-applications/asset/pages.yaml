    # Second Generation (2G), 2.5G and 2.75G


    It is with the growth and deployment of digital capability that has led the way
    forward to a new set of wireless applications. Incidentallyally, a large part
    of the North American cellular coverage is still operated using AMPS (the analog
    system, which we introduced earlier) and, as such, US operators are actively making
    a shift to newer digital technologies, which we will discuss later on.


    In the United Kingdom, Europe, United States and Asia several cellular technologies
    are widely used. The basic premise is the same as an analog system, in that the
    frequencies that are open to an analog system are also available to a digital
    system. The distinction between them is that the digital system uses the frequencies
    in a different way, more specifically, a channel is divided into time slots, as
    we illustrate in Figure 3.9. This method is not unique to cellular communications
    either; similar techniques can be found in networking technologies, such as Ethernet
    802.3 (a fundamental technology underlying fixed networking). The method for dividing
    the frequency into slots is called *Time Division Multiple Access (TDMA)* and
    there are three variants of TDMA technology currently in use: D-AMPS, *Personal
    Digital Cellular (PDC)* and *Global System for Mobile Communications (GSM)*. These
    three variants are incomparable and have implemented the TDMA scheme in different
    ways.


