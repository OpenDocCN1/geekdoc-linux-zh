  md: '915MHz (ten channels) and 2.4GHz (sixteen channels). The spread-spectrum nature
    of the modulation technique offers a transmission that covers the full spectrum,
    in turn, prescribes the number of available channels within the radio band. The
    IEEE 802.15.4 specification offers two modulation schemes which depend upon the
    actual radio band being used. In the instance 868MHz and 915MHz bands are used
    then the IEEE 802.15.4 specification utilizes the Binary Phase Shift Keying (BPSK)
    digital modulation scheme. In this context the rate achieved for 868MHz usage
    is a theoretical 20kb/ps and 915MHz usage is approximately 40kb/s. The 2.4GHz
    scheme utilizes an orthogonal Quadrature Phase Shift Keying (QPSK) modulation
    scheme, which helps Zigbee to achieve a theoretical throughput of 250kb/s.


    # Security and authentication


    The ZigBee network is very secure; it uses an access control list only allowing
    known-nodes to the network. And, authentication is assured by preventing devices
    from impersonating other devices using a common network key and establishing keys
    between device nodes. Additionally, the 802.15.4 specification offers additional
    security features assuring that their network is safe from intruders. Furthermore,
    ZigBee uses the 128-bit Advanced Encryption Standard (AES) algorithm, which discourages
    eavesdroppers and a refresh timer. The refresh timer overcome replay attacks as
    a message has a window of time to reach a node and, as such, if the message reaches
    the node after this window, it is rejected.


    # Coexistence and interoperability


    In an open standard such as ZigBee, others is encouraged through the use of adopting
    a common platform upon which to develop wireless applications. You may recall
    from Chapter 4, Can we Confidently Rely on Wireless Communication? we discussed
    in some detail how a protocol stack is used to ensure functionality at the right
    layer in a peer-to-peer fashion. And, as we have already discussed, CSMA-CA is
    used to ensure successful coexistence with ZigBee devices and other similarly-enabled
    devices in the same environment.


