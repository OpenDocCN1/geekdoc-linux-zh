    # Access Control


    In short, access control refers to the means by which a user can successfully
    gain access to a service, which is available through a wireless (or fixed) Local
    Area Network (LAN) or Wide Area Network (WAN). Numerous methods are used to ensure
    that you are an authorized user. For example, Remote Authentication Dial-in User
    Service (RADIUS) is a de facto standard protocol, which is used to verify users
    of a particular service through a centralized database as a Network Access Server
    (NAS); usernames and passwords are crosschecked with the database to ensure that
    the user is authorized. A NAS may involve a Virtual Private Network (VPN) or a
    wireless Access Point (AP), but typically, in a larger organization, the NAS may
    be integral to a central server. Additionally, a RADIUS-enabled service may track
    users logging in or off and may also track what they have been doing. In some
    configurations of tracking may be used to grant access time for a particular service.


    The RADIUS server is not limited to the authorization of usernames and passwords;
    it is also capable of assigning Internet Protocol (IP) addresses and a range of
    other'
