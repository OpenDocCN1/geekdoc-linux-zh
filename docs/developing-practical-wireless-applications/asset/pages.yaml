  md: '+   The Bluetooth SIG and WiMedia Alliance have collaborated to support Bluetooth
    over UWB.


    +   According to the WiMedia Alliance''s website, WiMedia is UWB.


    +   WiMedia is primarily targeted wireless multimedia-specific applications.


    +   It is undoubtedly that UWB can comfortably accommodate the genre of latency
    specific applications.


    +   It should be clear: UWB doesn''t need Bluetooth.


    +   Many have argued that Bluetooth and UWB have become visible to the consumer.


    +   WiFi is perceived to be ubiquitous.


    +   WiMedia may achieve similar successes as WiFi, possibly through WUSB.


    +   USB has been around for almost as long as the PC and the simplicity afforded
    by such a technology has perpetuated the notion of connectivity as a basic task
    of plugging one into another.


    +   We are already familiar with a technology that has comfortably connected one
    device to another.


    +   NFC would have been a more obvious choice as an alliance, as the technology
    itself well as an enabler.


    +   NFC has alleviated connection set-up and authentication with Bluetooth and
    WiFi. WiMedia intends to populate a host of consumer electronic products and it
    should avoid the necessity of discovery mechanisms and other such nonsense.


    +   NFC as a technology enabler would further ensure the simplicity consumers
    so desperately need.


    +   It seems that the WiMedia Alliance and the UWB Forum are singing from two
    different pages.


    +   The WiMedia Alliance has adopted the MB-OFDM version of UWB.


    +   The UWB Forum has adopted the DS5 version.


    +   We have to apply a sense of proportion and reality when developing technologies
    that are targeted to simplify many use cases.


    +   It is bewildering to read that there are two flavors of UWB.


    +   UWB can stand on her own two feet and provide an effective and robust wireless
    technology that will embarrass Bluetooth.


    +   WiMedia can stand alone and deliver consistent and secure wireless technology
    branded as WirelessUSB.


    +   Bluetooth adds another level of complexity, which will ultimately confuse
    a consumer-base that is already struggling to keep up.


    +   WiMedia needs to keep a steady hand when launching UWB flavored products,
    as it really can''t afford any potential misunderstanding.'
  merge: -1
  pgno: 248
