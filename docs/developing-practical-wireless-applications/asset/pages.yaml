  md: 'With a lost data packet, the packet will be retransmitted on a different channel
    according to a pseudo-random sequence within the radio system; with seventy-nine
    channels available data loss is kept to a minimum. Initially, regulations within
    France imposed a limited number of operating channels to twenty-three. However,
    due to an initiative conducted by the Bluetooth SIG, frequency harmonization now
    been achieved, France utilizes the full seventy-nine operating channels. With
    an operating band of 83.5MHz (2400MHz to 2483.5MHz), spaced at 1MHz intervals
    and accompanied with a lower bound of 2MHz and an upper bound of 3.5MHz a frequency
    hop can be calculated using $f=2400+k$ MHz, where $k$ is the channel number, numbered
    between 0 to 78 (a lower and upper guard band is used to cover any out-of-band
    regulations for a particular country). Allowing radio to retransmit the data packet
    on a different channel will undoubtedly increase the probability of the packet
    being transmitted successfully. This pseudorandom sequence also makes it difficult
    for other devices within radius to eavesdrop on the wireless communications. Typically,
    devices have to be trusted to part in any wireless connection. In our discussion
    in Chapter 4, Can we Confidently Rely on Wireless Communication?, where we touched
    the issue of creating trusted connections between Bluetooth-enabled devices by
    exchanging passkeys. Passkey is similar to a *Personal Identification Number (PIN)*,
    which is shared passkeys between two or more users (or devices) of a Bluetooth
    PAN. When exchanging passkeys, Bluetooth-enabled devices become paired, with an
    *initialization key* is generated, allowing Bluetooth authentication to take place.
    Bluetooth authentication occurs when two or more devices share a common key or
    initialization key in turn, generated by the passkey. This procedure is based
    upon a challenge-response scheme. Devices that have been authenticated can then
    choose to use an encryption scheme. The pairing and encryption procedures are
    optional, but are certainly recommended in light of our earlier (Chapter 4) discussion
    surrounding *Bluejacking*.


    With an expectation for Bluetooth to operate in both indoor and outdoor environments,
    several radio and system parameters are used to overcome the potential noise and
    interference, which should naturally be expected. The specification defines a
    Bit Error Rate (BER) of 0.1% and a receiver sensitivity of -70dBm. Although, in
    practice most Bluetooth radio manufacturers increase their sensitivities by 10dBm
    to ensure greater reliability and distances, as per the prescribed regulations.


    # Adaptive frequency hopping


    You may recall in Chapter 4, Can we Confidently Rely on Wireless Communication?
    we discussed issues surrounding coexistence with other 2.4GHz-enabled products.'
