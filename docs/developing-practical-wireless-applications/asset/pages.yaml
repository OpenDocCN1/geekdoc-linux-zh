  md: '# Can we Confidently Rely on Wireless Communication?


    configuration parameters, such as Domain System (DNS) addresses, subnet masks
    and so on. In particular a RADIUS server may run alongside the Dynamic Host Configuration
    Protocol (DHCP) which is used to assign users'' unique IP addresses and, prior
    to the assignment of an IP address, the RADIUS server can be used to employ additional
    verification procedures. In doing so, the RADIUS protocol can request that the
    device reveal its Media Access Control (MAC) address, which is a unique identifier
    to all types of network capable equipment, such as a cellular phone or a computer.
    Once a user has been verified with a username and password, further verification
    can be made by crosschecking the device''s MAC address. In essence, if it is not
    on the list of authorized devices, the user will not be allowed to continue to
    use the service; however, this does bring us to our next topic. How would an authorized
    user gain access to a username and password? Perhaps, a user may have overheard
    or read the username and password or more likely they have used a wireless sniffer
    or similar equipment to eavesdrop on data that initially establishes a connection
    between a client and server. In the opening dialogue between a client and server,
    a hacker can intercept configuration parameters and commands, where this information
    can be sufficient for the hacker to hijack the session. Furthermore, the hacker
    may be capable of issuing their own commands; to exploit the hosts for unauthorized
    access; the hacker can fool the host into gaining access to the host''s services.


    # War-Xing: War-Walking, War-Driving and War-Storming


