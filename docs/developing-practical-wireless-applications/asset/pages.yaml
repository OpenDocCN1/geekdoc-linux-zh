  md: '# Near Field Communications: The Smart Choice for Enabling Connectivity


    The concept of *Near Field Communications* (NFC) is based upon the premise of
    enabling through *proximity*. It''s a simple theory but one shrouded by controversy,
    as we read of advertisers keen to acquire a sense of the long-term business plan
    for the technology. Many feel that it holds the key to a smarter, wirelessly-connected
    generation of life-style enhancing products. It''s certainly a sexier alternative
    to Bluetooth, being easier to use and brought to life by the toughest touch. You
    might even say that its market potential is foreplay to the eager consumer whose
    desire may be to rush discovery and introduction and get paired in instance. NFC
    is not an entirely new technology – it just got smarter; it evolved from Radio
    Frequency ID* (RFID) technology, which we can consider to be NFC''s much older
    (and-all-around-nice-guy) brother. RFID has been around since the 1920s, but it
    formally emerged as various espionage tools during World War II and, of course,
    as a means of identifying airplanes as friend or foe.


    # What is RFID?


    Most frequently people use NFC and RFID interchangeably, but there are some subtle
    differences in terms of use cases, wireless medium and range. The premise of RFID
    is primarily to read information from a *tag* or *transponder* – a device that
    can be placed into a product or a person (yes, a person). The tag or transponder
    itself is an integrated circuit, which has attached a small antenna and can be
    placed into a number of materials. In fact, in 1998, a British cybernetics professor
    (Kevin Warwick) implanted a tag into his arm where he used it to control a number
    of devices to include light switches, doors and so on. The information stored
    on a tag will allow a'
  merge: -1
  pgno: 234
- img_proc: true
  md: 'reader or an interrogator to retrieve identification data pertaining to that
    product or person using radio waves. RFID has been used to track and trace products
    typically located in a warehouse and to monitor movement from a warehouse to a
    shop floor. A number of large supermarkets want to extend this little further.
    As more and more supermarket chains increasingly compete on similar products,
    they would like to gain an insight and learn more about consumers shopping behavior
    patterns. As such, they wish to associate our specific purchasing habits with
    loyalty cards and products purchased (CHETasia). This data-mining exercise is
    well known but to be able to extend it to a wealth of daily options and choices
    through proximity monitoring would lead many of us to think twice before walking
    into members'' club. This "big brother" type of scenario is clearly going to be
    avoid, unless we choose not to participate in RFID/NFC''s adoption, but many suspect
    the volume of the technology''s increasing benefits will outperform the of hysterical
    paranoia and eventually turn the skeptics into advocates. Although, at this stage
    no one has objected to claiming it''s tantamount to "big brother," but it is still
    early.


    # Operating frequencies


    RFID is essentially a barcode technology where reading information can be done
    automatically. Nowadays, you have to use a device to scan in light-of-sight, whereas
    an RFID reader conveys its data automatically using radio waves. The Automatic
    Identification (AutoID) system enables a unique monitoring system, ensuring products
    are tracked and logged when moved around a particular location such as a warehouse
    (goods and in) for example. The tags are incredibly small, less than half a millimeter
    in size, and certainly not obstructive with an antenna. They can be placed practically
    anywhere on the product, and, furthermore, unlike barcode readers whose items
    have to be individually scanned, an RFID reader can more or less simultaneously
    read multiple tags. But, most uniquely, it has the ability to recycle the tag
    by updating it with new information allowing it to be aided again. RFID offers
    three operating frequencies, namely Low (125kHz to 134kHz and 140kHz to 148.5kHz),
    High (13.56MHz) and Ultra-high (868MHz to 928MHz), but some global restrictions
    are imposed by the Ultra-high Frequency (UHF) due to the lack of a universal standard.
    The choice of frequency will be adapted to suit a particular application, for
    example the low frequency would be used to perform rudimentary tracking and access
    control. A high frequency option would be required if the environment was like
    metal structures in a warehouse and the radio range needed to be around two meters,
    but it would support. The UHF range accommodates similar applications to the above,
    but can prove problematic with metal structures and water, but typical RFID applications
    operate in the low and high ranges (RFIDJournal.com).'
  merge: -1
  pgno: 235
- img_proc: true
  md: '# Active and passive tags


    In addition to the availability of three operating frequencies, RFID can be categorized
    into two modes of operation: an RFID tag can be Active or Passive. The active
    tag is a battery powered device which, in turn, powers the onboard integrated
    circuit. It derives its power from a battery which incidentally can sustain a
    life-span of up to ten years and has the ability to transmit a radio range of
    up to 100 meters. The active tag is a more robust alternative to the passive tag
    primarily because it has its own power source and, as such, can be deployed in
    unfavorable environments where it will quite happily deliver. The passive tag,
    on the other hand, doesn''t have its own power source and derives its power from
    the reader''s radio waves, which seems to be sufficient to induce the integrated
    circuit to life. Indeed, a unit that has the ability to derive power from radio
    waves would surely have an unlimited life and its factor would be incredibly small.


    RFID technology is not restricted to identification, tracking or tracing; it,
    too like NFC, is used for payment systems, such as subway and vehicular access
    to tolls (see Figure 14.1), and key entry systems (very similar to the 802.11p
    standard, as we


    Figure 14.1

    Many countries around the world are already using RFID technology to collect fares
    at toll booths.


    ![](img/3adb5649a7b2815c7caab032dd5fe2b9_236_0.png)'
  merge: -1
  pgno: 236
- img_proc: true
  md: 'discussed in Chapter 13, *WiFi: Enabling True Ubiquitous Connectivity* and
    so on. RFID technology has evidently been around for many decades, so why NFC
    has taken the limelight


    # # What is NFC?


    Sony (www.sony.com) and Philips (www.philips.com) mutually developed NFC. The
    technology evolved from their contact-less or smartcard technology, namely Felica
    and Mifare which were respectively developed by Sony and Philips. The NFC standard
    was approved by the European Computer Manufacturers Association (EMCA), *International
    Organization for Standardization* (ISO) and *International Electrotechnical Commission*
    (IEC) in 2003. The standardization process affords true compatibility and interoperation
    of NFC-enabled devices and, such as, Nokia, Sony and Royal Electronics launched
    the NFC Forum (www.nfc-forum.org) in March 2004 to direct their cards close to
    their chest, as obtaining use cases and software architecture documentation has
    been somewhat difficult to achieve. Nevertheless, they have made public specifications,
    which are identified in Table 14.1.


    NFC operates in the 13.56 MHz frequency range where the underlying protocol stack
    is based upon various ISO, ECMA and ETSI standards. It is first and foremost an
    open specification technology, standardized for acceptance by the industry and
    ultimately to provide compatibility between devices of varying manufacturers.
    What''s more, the standards specify modulation schemes, coding, transfer speeds,


    | Table 14.1 The number of public specifications made by the NFC Forum | Specification
    |

    |---|---|

    | 1 | NFC Data Exchange Format (NDEF) Technical Specification – this specifies
    a common data format for NFC Forum-compliant tags and devices. |

    | 2 | NFC Record Type Definition (RTD) Technical Specification – this specifies
    standard record types used in messages between two NFC Forum-compliant devices
    and tags. |

    | 3 | NFC Text RTD Technical Specification – this has formatted for records containing
    plain text that can be read by NFC-enabled devices. |

    | 4 | NFC URI RTD Technical Specification – for elements that refer to an Internet
    resource that can be read by NFC-enabled devices. |'
  merge: -1
  pgno: 237
- img_proc: true
  md: 'and frame format of the Radio Frequency (RF) interface of NFC devices, as well
    as initialization schemes and conditions required for data collision-control during
    initialization – for both passive and active NFC modes. Furthermore, the standards
    also define the transport protocol, including protocol activation and data exchange
    methods.


    Sony''s Felica, a wireless payment and ticketing system, uses NFC technology along
    with Philips'' Mifare, which are both interoperable. Primarily, Felica is a wireless
    smartcard system that allows users to purchase shopping, cinema tickets and so
    on, using a cellular phone for example. Again, this concept isn''t entirely new,
    but only now we''ve seen it emerge into the public eye, presumably as a result
    of NFC. When consumers reach the check-out point, payment can be made by passing
    the cellular phone across a wireless smart card reader. The range of applications
    doesn''t stop there: wireless entry systems, as e-logging, provides users the
    ability to enter buildings or log on to a computer wirelessly. It is also envisaged
    that cellular phones will be used as a wireless entry system for your car and
    to start the engine.


    NFC has an operating range of 5cm (1.97in) or 10cm (3.94in), although some manufacturers
    are extending this range for a host of other new applications, such as personal
    entertainment. You may want to refer to Chapter 9: Aura Communications Technology:
    Creating the Personal Bubble, where we discuss one specific example of how NFC-like
    has been used in a wireless stereo headset. RFID exchange/read information up
    to three meters away, as compared with NFC''s much shorter distance. It uses magnetic
    induction to transmit data from one device to another and inherently provides
    secure and reliable transactions. It''s inherently secure because of the limited
    range and any malicious intent should be obvious. NFC-enabled devices can exchange
    data in active or passive modes, very similar to RFID. In its passive mode, the
    initiator, or master device, starts the communication by providing the RF field
    which continues throughout the session. Previously discussed, it transmits data
    to another device, known as the NFC Target or slave device. The slave device transmits
    data back to the initiator without generating a file by using a load modulation
    technique. The mechanism described can detect and connect with a target having
    the same connection and initialization procedure.


    The fact that both the initiator and target devices can change roles whereas make
    passive operation an ideal power-saving and subsequently cost-effective method
    of wireless communication. In contrast, when active mode, each device will need
    to generate its own RF field when data needs to be transmitted to another device
    to enable communication. This peer-to-peer communication allows for very fast
    connection between devices.'
