    # The RF transceiver


    It is always a good place to start with the radio. The premise of the radio transceiver
    is singularly the most important part of the success of any wireless product alongside
    a well-balanced and proportioned application base. The Z-Wave operates operates
    within frequency ranges, namely 868.42MHz for Europe and the Industrial Scientific
    and Medical (ISM) 908.42 band for the United States. These two bands are well
    established within the industry, assuring us of reliability and offering a good
    radio range and, equally as important, affordability. Figure 7.3 illustrates the
