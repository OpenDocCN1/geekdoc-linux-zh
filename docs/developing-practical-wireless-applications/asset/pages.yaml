    # # Object Exchange (OBEX)


    The RFCOMM layer emulates serial port capability and, as we highlighted, it supports
    a host of OBEX applications. The OBEX layer is specifically concerned in realizing
    these applications which, in turn, enables the IrDa protocol to run over the Bluetooth
    protocol stack, as shown in Figure 11.15.


    The OBEX layer is not limited to support serial-based communications either, the
    Bluetooth specification also discusses the possibility of supporting OBEX over
    TCP/IP; but does not explicitly define how you should implement TCP/IP over Bluetooth.
    The OBEX layer prescribes in, three use cases, named *Synchronization*, *File
    Transfer* and *Object Push*. These applications are historically based within
    the Infrared protocol and it is surprising, even today, how many Bluetooth-enabled
    devices do not support this basic functionality.


    # # What are Bluetooth Profiles?


    Many people can describe a Bluetooth Profile as the *Generic Access Profile (GAP)*
    or the *Headset Profile (HP)*, but fail to understand its purpose. A Bluetooth
    Profile is a specification that defines how a particular application should behave;
    what characteristics in terms of functionality should an exhibit, that is, explicit
    expectations from the lower-layers of the Bluetooth protocol stack; and how should
    this functionality manifest itself to the user interface, in turn, the user. It
    establishes common in terminology that is used across all applications, such as
    Bluetooth Passkey, Pairing and so on. And, it remains pivotal in establishing
    a single representation of the functionality that may be exhibited by a Bluetooth-enabled
    product or application.'
