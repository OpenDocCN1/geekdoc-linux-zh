    # The MAC frame format


    The MAC Protocol Data Units (MPDUs) is a sequence of fields that is transmitted
    down to the PHY layer, as shown in Figure 13.15 and it forms our MAC Frame. The
    MAC frame format comprises the Frame Control field, a Duration/ID field, Address
    1, Address 2 and Address 3 fields, a Sequence Control field, Address 4 field,
    a Frame Body and a Frame Check Sequence (FCS) field.


    The frame control field comprises a further set of fields, to include Protocol
    Version field, Type and Sub-type fields, to- and from-DS fields, More Fragments
    field, a Retry field, a More Data field, a Protected field, which replaces the
    WEP Protected and Order field, as shown in Figure 13.16. The protocol version
    is 2-bits in length and retains the current version of the standard. The type
    and sub-type fields are 2 and 4-bits in length respectively, and are used to determine
    the purpose of the frame, which is control, data or management. The to- and from-DS
    fields are both 1-bit in length. The to-DS field is set to one to indicate frames
    that are destined for the DS, whereas the from-DS field is set to zero to indicate
    frames leaving the DS. In the more data and management type frames (as indicated
    by the type and sub-type fields) have additional data to follow. The retry field
    is a 1-bit unit that is set to indicate that it is a retransmission of a frame.
    The power management field is also a 1-bit unit and is used to indicate the STA
    mode in operation; a value of one denotes power-save mode, whereas a zero indicates
    that the STA will be in active mode. The more data field is used to indicate when
    an STA is in power-save mode that more data will follow. The protected frame field
    has been modified from the original specification, which just accommodated WEP
    operation. In the 802.11 specification field


