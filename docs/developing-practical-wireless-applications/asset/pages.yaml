    +   * BSSs have within their radius range of STA members.


    +   * The STA provides a SS at the MAC layer, which includes authentication, confidentiality
    and payload delivery.


    +   * If an STA stays within radius range it remains part of the network.


    +   * An STA is deemed associated once it becomes a member of the infrastructure
    BSS.


    +   * The association of an STA and BSS are dynamically created.


    +   * An STA joining/leaving in a BSS or IBSS network is referred to as ad hoc.'
