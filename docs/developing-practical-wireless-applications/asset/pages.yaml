  md: '+   Numerous nodes are strategically deployed in an area, typically a home
    or office, where the radio coverage of one node overlaps an adjacent node.


    +   This enables the possibility of one reaching another even if they are thirty
    meters apart.


    +   In a relay style race the baton (data) is passed from one node to another
    until the destination node is reached.


    +   ZigBee''s networking offers three topologies, namely the star, mesh and tree.


    +   The star implementation offers an application, a PAN context.


    +   A mesh implementation affords the application an end device, which may take
    the form of a FFD or a RFD.


    +   The tree topology is capable of extending the star topology.


    +   There are three device types within the ZigBee network: a coordinator, an
    end device and a router.


    +   ZigBee utilizes 3 ISM bands, namely 868MHz for Europe; 915MHz for the United
    States, and 2.4GHz for worldwide usage.


    +   ZigBee radios use DSSS this, in turn, affects how channels are allocated.


    +   The ZigBee network is very secure and uses an access list only allowing known-nodes
    to enter the network.


    +   Authentication is assured by preventing devices impersonating other devices
    using a common network key and establishing unique keys between device nodes.


    +   The 802.15.4 specification offers additional security features assuring users
    that their network is safe from intruders.


    +   ZigBee also uses the 128-bit AES algorithm, which discourages would-be eavesdroppers.


    +   A refresh timer is used to overcome replay attacks as a message has a certain
    window of time to reach a node.


    +   In an open standard as ZigBee, interoperation is encouraged through the use
    of adopting a common platform upon which to develop wireless applications.


    +   ZigBee v1.1 will take advantage of the 802.15.4b set of revisions which were
    specifically commissioned to clarify ambiguities within the 802.15.4-2003 specification.


    +   It is expected that the release of the 802.15.4b will coincide with the new
    release of the ZigBee (v1.1) specification.


    +   The ZigBee Alliance has generated several profile specifications upon which
    you can create ZigBee-specific applications.'
