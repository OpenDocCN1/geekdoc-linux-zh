    # Understanding the application context


    A device descriptor is used to describe the types of devices that a ZigBee-enabled
    device is capable of supporting in addition to defining specific data attributes,
    which may relate to input/output streams and how such data should be formatted.
    These specific attributes can be grouped into clusters which too have their own
    unique identifiers. It is the characterization of these device descriptors and
    clusters which uniquely creates the behavior of a profile. The ability to communicate
    between nodes is achieved using service keys; the Key Value Pair (KVP) service
    is used to provide a basic command/control mechanism between nodes. The Message
    (MSG) service type is a little more dynamic in that it uses the underlying KVP
    service as the transport mechanism mechanism to transfer data between nodes, the
    payload can be application-specific and left to the discretion of the developer.


    The ZigBee protocol stack, as illustrated in Figure 12.4 comprises several layers,
    which conform to the OSI model as we illustrated earlier in Figure 12.3. The stack
    is an eclectic number of layers, which are provided by a number of suppliers.
    For example, the PHY and MAC layers are defined by IEEE 802.15.4, whereas the
    NWK layer, Application Support Sub-layer (APS), the ZigBee Device Object (ZDO)
    and Application'
