  md: 'As a result they are competitive solutions in delivering cellular telecommunication
    services for its consumers.


    # Understanding how TDMA works


    TDMA offers its solution by dividing a frequency channel into time slots. It takes
    the existing 30kHz channel, which would be allocated to a single user for an FDMA
    topology, and divides it into three slots; effectively this division creates three
    further channels. Now multiply this by the available spectrum and you have increased
    the service capacity by a factor of three; however, newer TDMA systems increase
    this capacity by a factor of six by employing better compression techniques; in
    other words, compressing more data into one time slot. TDMA is its digital premise
    and, of course, its ability to support data-centric communications. Similarly,
    quality is increased and, as a result becomes much more secure. Other factors
    such as power consumption and cost effective receivers make it an attractive option
    for cellular phone manufacturers.


    The general strategy adopted by the TDMA-based system is known as a combined FDMA/TDMA/FDD
    solution and typically you will see GSM and D-AMPS referred to in this name. TDMA
    digitizes the voice traffic into a packet, which is then placed into a slot (measured
    in terms of milliseconds) on a channel. For each subsequent packet a different
    channel is allocated, as we already illustrated in Figure 3.9. The whole process
    becomes cyclic where old time slots are reused. Control channels referred to as
    Digital Control Channels (DCCH), are also used to support call setup and control;
    in a similar fashion to FDMA.


    # Digital Advanced Mobile Phone Standard (D-AMPS)


    Interim Standards known as IS-54 and IS-136 were developed and standardized by
    the Electronics Industry Association (EIA) and the Telecommunications Industries
    Association (TIA). These standards that govern telecommunication functionality,
    features and capabilities within the US (and, of course, other parts of the world
    where it has also been deployed) by the two systems as AMPS and D-AMPS. It is
    IS-136 (an upgrade of IS-54, maintaining backward compatibility with IS-136) that
    describes compatibility for D-AMPS using the TDMA methodology. In utilizing this
    scheme, network operators were able to increase the number of users that could
    use their service by up to six times, as compared with the original AMPS service.
    Furthermore, IS-136 provides other digital features such as Short Message Services
    (SMSs) commonly referred to as text messaging or texting: a fundamental precursor
    to the start of the digital revolution enabling digital-based applications for
    cellular phones; D-AMPS typically offers a data capacity of around 9.6Kbps. It
    is also worth'
