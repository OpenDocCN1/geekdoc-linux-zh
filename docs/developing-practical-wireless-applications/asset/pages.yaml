    The Z-Wave transceiver offers two-way communication and uses Frequency Shift Key
    (FSK) modulation shaping method. This particular scheme transforms two analog
    waveforms into two binary states, ones (1s) and zeros (0s), as we illustrate in
    Figure 7.4. In the illustration the A waveform represents a high state where the
    analog sine wave will be converted to a one (1); and conversely the B-waveform
    represents a low state which is converted to a zero (0). You may recall the application
    of a modem, which performs a very similar function in that it takes the analog
    signal from the telephone line and converts it into digital signals for the computer
    to process; and vice versa, the modem converts the digital signals into analog
    signals to transmit back over the telephone line. ZenSys have not only simplified
    the selection of the RF components but have thought about a platform and the generic
    availability of its components and its translation to production.


