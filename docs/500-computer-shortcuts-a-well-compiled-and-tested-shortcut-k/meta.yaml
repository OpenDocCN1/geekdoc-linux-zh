- md: " # 500+ COMPUTER SHORTCUTS\n\nA well compiled and tested shortcut keys combination\
    \ for PC (Windows, Linux, Unix and Apple Macintosh) for your use.\n\nJADEN STEPHEN\n\
    \n# COPYRIGHT © 2020 JADEN STEPHEN\n\nAll rights reserved. No part of this book\
    \ may be reproduced, transmitted in any form or by any means—electronic, mechanical,\
    \ photocopy, recording, or any other except for brief quotations in printed reviews,\
    \ without prior permission of the publisher.\n\n# Table of Contents\n\n- COMPUTER\
    \ KEYBOARD SHORTCUT KEYS\n- SHORTCUT KEYS ABCs\n- TOP 10 KEYBOARD SHORTCUTS EVERYONE\
    \ SHOULD KNOW\n- PC SHORTCUT KEYS FOR SPECIAL CHARACTERS\n- MICROSOFT WINDOWS\
    \ SHORTCUT KEYS\n  - GENERAL WINDOWS SHORTCUT\n  - FUNCTION KEYS\n  - WINDOWS\
    \ KEY SHORTCUT\n- APPLE SHORTCUT KEYS\n- UNIX AND LINUX SHORTCUT KEYS\n  - KEYBOARD\
    \ SHORTCUT KEYS\n  - COMMAND LINE SHORTCUTS\n- MICROSOFT EXCEL SHORTCUT KEYS\n\
    - MICROSOFT WORD SHORTCUT KEYS\n- MICROSOFT WORD MOUSE SHORTCUTS\n- GOOGLE CHROME\
    \ KEYBOARD SHORTCUT KEYS\n- INTERNET EXPLORER KEYBOARD SHORTCUT\n- MICROSOFT FRONTPAGE\
    \ SHORTCUT KEYS\n- MICROSOFT OUTLOOK KEYBOARD SHORTCUTS\n- MOZILLA FIREFOX KEYBOARD\
    \ SHORT CUT FOR WINDOWS\n- YOUTUBE SHORTCUT KEYS\n\n# COMPUTER KEYBOARD SHORTCUT\
    \ KEYS\n\n## SHORTCUT KEYS ABCs\n\nHelps give a simpler and snappier technique\
    \ for exploring and executing orders in the PC programming. Shortcut keys are\
    \ usually gotten to by utilizing the Alt key (on IBM perfect PCs), Command key\
    \ (on Apple PCs), CTRL key, or SHIFT key related to another key. The true standard\
    \ for posting a shortcut is posting the modifier key, and or more image, and another\
    \ key. At the end of the day, \"CTRL+S\" is instructing you to press and hold\
    \ the CTRL key, and afterward, press the S key as well.\n\nYou can likewise discover\
    \ the easy shortcuts in well-known projects by searching for underlined letters\
    \ in their menus. For instance, the document menu picture has an underline on\
    \ the \"F\" in File, which implies you can press the Alt key and \"F\" key to\
    \ get to the record menu.\n\nA few programs require the user to press and hold\
    \ Alt to see the underlined characters. In the picture above, you can see that\
    \ a portion of the basic highlights, for example, Open (CTRL+O) and Save (CTRL+S),\
    \ have alternate route keys relegated to them. As you remember easy shortcut keys,\
    \ you'll notice that numerous applications share them. We have a rundown of the\
    \ most normally shared ones in the essential PC easy shortcut keys segment.\n\n\
    Below is a list of the commonly used shortcut keys that works with IBM compatible\
    \ computers. And it would be of great help to you if you could try to memorize\
    \ as much as you could.\n\n## TOP 10 KEYBOARD SHORTCUTS EVERYONE SHOULD KNOW\n\
    \nBelow are 10 keyboard short cuts that I recommend everyone to memorize and use.\n\
    \n| SHORTCUT KEYS | ACTION |\n| --- | --- |\n| CTRL+C OR CTRL+INSERT AND CTRL+X\
    \ | Both CTRL+C and CTRL+INSERT will copy highlighted text or a selected item.\
    \ If you want to cut an item instead of copying it, press CTRL+X. This action\
    \ removes the text or item and stores it in the clipboard for you, rather than\
    \ copying it to the clipboard while leaving the original behind.<br><br>Apple\
    \ computer users can substitute the CTRL key for the command (CMD) key on their\
    \ computers. For example, pressing CMD+C copies highlighted text. |\n| CTRL+V\
    \ OR SHIFT+INSERT | Both the CTRL+V and SHIFT+INSERT will paste the text |\n|\
    \ CTRL+Z AND CTRL+Y | Pressing CTRL+Z will undo any change. For example, if you\
    \ cut text, pressing this key combination will undo the cut. These shortcuts can\
    \ also be pressed multiple times to undo or redo multiple changes. Pressing CTRL+Y\
    \ would redo the undo. |\n| CTRL+F AND CTRL+G | Pressing CTRL+F opens the Find\
    \ field, which allows you to search the text currently displayed in any program\
    \ that supports it. For example, CTRL+F can be used in your Internet browser to\
    \ find text on the current page. Press CTRL+F now to open the Find in your browser\
    \ and search for \"shortcut\" to display each time shortcut is mentioned on this\
    \ page. CTRL+G may be used to repeat a search (from using CTRL+F) in a document\
    \ or on a web page. |\n| ALT+TAB OR CTRL+TAB | Pressing ALT+TAB switches between\
    \ open programs moving forward. For example, if you have your browser window open\
    \ and other programs running in the background press and hold ALT and then press\
    \ the TAB key to cycle through each open program.<br><br>On Apple computers, instead\
    \ of using the Alt key use the Command (CMD) key. For example, CMD+TAB to switch\
    \ between open programs.<br><br>TIP: Press CTRL+TAB to switch between tabs in\
    \ a program. For example, if you have multiple tabs open in your Internet browser,\
    \ press CTRL+TAB to switch between them.<br><br>TIP: Adding the Shift key to ALT+TAB\
    \ or CTRL+TAB moves backward. For example, if you are pressing ALT+TAB and pass\
    \ the program you want to use, press ALT+SHIFT+TAB to move back to that program.<br><br>TIP:\
    \ Windows Vista, 7, 8, and 10 users can also press the WINDOWS KEY+TAB to switch\
    \ through open programs in a full screenshot of the window. |\n| CTRL+BACKSPACE\
    \ AND CTRL+LEFT OR RIGHT ARROW | Pressing CTRL+BACKSPACE deletes a full word at\
    \ a time instead of a single character. |\n| CTRL+BACKSPACE AND CTRL+LEFT OR RIGHT\
    \ ARROW | Holding down the CTRL key while pressing the left or right arrow moves\
    \ the cursor one word at a time instead of one character at a time. If you want\
    \ to highlight one word at a time, hold down CTRL+SHIFT, then press the left or\
    \ right arrow key. Your highlighted selection moves one word at a time in that\
    \ direction. |\n| CTRL+S | While working on a document or another file in almost\
    \ every program, pressing CTRL+S saves that file. Use this shortcut key frequently\
    \ if you're working on anything important in case of an error, lost power, or\
    \ any other issues that causes you to lose any work since the last save.<br><br>On\
    \ Apple computers, use Cmd+S to save a file |\n| CTRL+HOME OR CTRL+END | CTRL+HOME\
    \ moves the cursor to the beginning of the document, and CTRL+END moves the cursor\
    \ to the end of a document. These shortcuts work with most documents, as well\
    \ as web pages.<br><br>On Apple computers, use the Cmd + up arrow to get to the\
    \ beginning or Cmd + down arrow to get to the end of a document or text. |\n|\
    \ CTRL+P | CONTROL+P is used to open a print preview of the page or document currently\
    \ being viewed. For example, press CTRL+P now to view a print preview of this\
    \ page.<br><br>On Apple computers, use Cmd+P to open the print preview. |\n| PAGE\
    \ UP, SPACEBAR, AND PAGE DOWN | As you may have guessed, pressing either the page\
    \ up or page down key moves to the next or previous page. When browsing the Internet,\
    \ pressing the spacebar moves the scrollbar down a page. Similarly, SHIFT+SPACEBAR\
    \ moves the scrollbar up one page. |\n\n| SHORTCUT KEYS | ACTION |\n| --- | ---\
    \ |\n| ALT+F | File menu options in current running program. |\n| ALT+E | Open\
    \ edit option in current program. |\n| ALT+TAB | Switch between open programs.\
    \ |\n| F1 | To view the help information. |\n| F2 | Rename a selected file. |\n\
    | F5 | Refresh the current programs window. |\n| CTRL+D | Bookmark the current\
    \ page in internet browsers. |\n| CTRL+N | Creates a new document in programs\
    \ or opens in new TAB in most internet browsers. |\n| CTRL+O | Open a file in\
    \ the current running program. |\n| CTRL+A | Select all text. |\n| CTRL+B | Change\
    \ selected text to be bold. |\n| CTRL+I | Change selected text to be in italics.\
    \ |\n| CTRL+U | Change selected text to be underlined |\n| CTRL+F | Open find\
    \ window for current document or window. |\n| CTRL+S | Save current document file.\
    \ |\n\n| Shortcut | Action |\n| --- | --- |\n| CTRL+X | Cut selected item. |\n\
    | SHIFT+DEL | Cut selected item. |\n| CTRL+C | Copy selected item. |\n| CTRL+INS\
    \ | Copy selected item. |\n| CTRL+V | Paste. |\n| SHIFT+INS | Paste. |\n| CTRL+Y\
    \ | Redo last action. |\n| CTRL+Z | Undo last action. |\n| CTRL+K | Insert hyperlink\
    \ for selected text. |\n| CTRL+P | Print the current page or document. |\n| HOME\
    \ | Goes to beginning of current line. |\n| CTRL+HOME | Goes to beginning of document.\
    \ |\n| END | Goes to end of current line. |\n| CTRL+END | Goes to end of document.\
    \ |\n| SHIFT+HOME | Highlights from current position to beginning of line. |\n\
    | SHIFT+END | Highlights from current position to END of line. |\n| CTRL+Left\
    \ arrow | Moves one word to the left at a time. |\n| CTRL+Right arrow | Moves\
    \ one word to the right at a time. |\n| CTRL+ESC | Open the Start menu. |\n| CTRL+SHIFT+ESC\
    \ | Open Windows Task Manager. |\n| Alt+F4 | Close the currently active program.\
    \ |\n| Alt+ENTER | Open the properties for the selected item (file, folder, shortcut,\
    \ etc.). |\n\n## PC SHORTCUT KEYS FOR SPECIAL CHARACTERS\n\n| SHORTCUT KEYS |\
    \ SPECIAL CHARACTERS |\n| --- | --- |\n| ALT+0224 | à |\n| ALT+0232 | è |\n| ALT+0236\
    \ | ì |"
  mdcn: "\n # 500+ 计算机快捷键\n\n为 PC（Windows、Linux、Unix 和 Apple Macintosh）精心编写并测试的快捷键组合，供您使用。\n\
    \nJADEN STEPHEN\n\n# 版权所有 © 2020 JADEN STEPHEN\n\n保留所有权利。未经出版商事先许可，不得以任何形式或任何方式复制、传播本书的任何部分——无论是电子、机械、影印、录音还是其他方式，除印刷评论中的简短引文外。\n\
    \n# 目录\n\n- 计算机键盘快捷键\n- 快捷键基础\n- 每个人都应知道的十大键盘快捷键\n- PC 特殊字符快捷键\n- Microsoft Windows\
    \ 快捷键\n  - 通用 Windows 快捷方式\n  - 功能键\n  - Windows 键快捷方式\n- Apple 快捷键\n- Unix 和\
    \ Linux 快捷键\n  - 键盘快捷键\n  - 命令行快捷方式\n- Microsoft Excel 快捷键\n- Microsoft Word 快捷键\n\
    - Microsoft Word 鼠标快捷键\n- Google Chrome 键盘快捷键\n- Internet Explorer 键盘快捷键\n- Microsoft\
    \ Frontpage 快捷键\n- Microsoft Outlook 键盘快捷键\n- Mozilla Firefox Windows 版键盘快捷键\n\
    - YouTube 快捷键\n\n# 计算机键盘快捷键\n\n## 快捷键基础\n\n有助于提供更简单、更快捷的探索和执行计算机软件命令的方法。快捷键通常通过使用\
    \ Alt 键（在 IBM 兼容 PC 上）、Command 键（在 Apple 电脑上）、CTRL 键或 SHIFT 键与另一个键组合来访问。列出快捷键的标准惯例是先列出修饰键，然后加号，再加另一个键。换句话说，\"\
    CTRL+S\" 是让您按住 CTRL 键，然后同时按下 S 键。\n\n您还可以通过在常用程序菜单中查找带下划线的字母来发现快捷方式。例如，文件菜单图片中\
    \ \"File\" 的 \"F\" 带有下划线，这意味着您可以按下 Alt 键和 \"F\" 键来访问文件菜单。\n\n某些程序需要用户按住 Alt 键才能看到带下划线的字符。在上图中，您可以看到一些常用功能，如打开（CTRL+O）和保存（CTRL+S），都有分配的快捷键。当您记住快捷键后，您会发现许多应用程序都共享这些快捷键。我们在基本\
    \ PC 快捷键部分列出了最常见的共享快捷键。\n\n以下是适用于 IBM 兼容计算机的常用快捷键列表。如果您能尽可能多地记住它们，将大有裨益。\n\n##\
    \ 每个人都应知道的十大键盘快捷键\n\n以下是我推荐每个人记住并使用的 10 个键盘快捷键。\n\n| 快捷键 | 操作 |\n| --- | --- |\n\
    | CTRL+C 或 CTRL+INSERT 以及 CTRL+X | CTRL+C 和 CTRL+INSERT 都会复制高亮文本或选定项目。如果您想剪切项目而非复制，请按\
    \ CTRL+X。此操作会移除文本或项目并将其存储在剪贴板中，而不是在复制到剪贴板的同时保留原始内容。<br><br>Apple 电脑用户可以用 command\
    \ (CMD) 键替代其电脑上的 CTRL 键。例如，按 CMD+C 可复制高亮文本。 |\n| CTRL+V 或 SHIFT+INSERT | CTRL+V\
    \ 和 SHIFT+INSERT 都会粘贴文本 |\n| CTRL+Z 和 CTRL+Y | 按 CTRL+Z 可撤销任何更改。例如，如果您剪切了文本，按此组合键将撤销剪切操作。这些快捷键也可以多次按下以撤销或重做多项更改。按\
    \ CTRL+Y 将重做已撤销的操作。 |\n| CTRL+F 和 CTRL+G | 按 CTRL+F 可打开查找字段，允许您在支持该功能的任何程序中搜索当前显示的文本。例如，CTRL+F\
    \ 可在 Internet 浏览器中使用以查找当前页面上的文本。立即按 CTRL+F 在浏览器中打开查找功能，搜索\"shortcut\"以显示本页中每次提到\
    \ shortcut 的位置。CTRL+G 可用于在文档或网页中重复搜索（从使用 CTRL+F 开始）。 |\n| ALT+TAB 或 CTRL+TAB |\
    \ 按 ALT+TAB 可在打开的程序之间向前切换。例如，如果您已打开浏览器窗口，并且其他程序在后台运行，请按住 ALT 键然后按 TAB 键来循环切换每个打开的程序。<br><br>在\
    \ Apple 电脑上，使用 Command (CMD) 键替代 Alt 键。例如，CMD+TAB 可在打开的程序之间切换。<br><br>提示：按 CTRL+TAB\
    \ 可在程序内的标签页之间切换。例如，如果您在 Internet 浏览器中打开了多个标签页，按 CTRL+TAB 可在它们之间切换。<br><br>提示：添加\
    \ Shift 键到 ALT+TAB 或 CTRL+TAB 可以向后移动。例如，如果您按 ALT+TAB 时跳过了想要使用的程序，请按 ALT+SHIFT+TAB\
    \ 返回到该程序。<br><br>提示：Windows Vista、7、8 和 10 用户还可以按 WINDOWS 键+TAB 以窗口的完整截图方式切换打开的程序。\
    \ |\n| CTRL+BACKSPACE 和 CTRL+左或右箭头 | 按 CTRL+BACKSPACE 每次删除一个完整的单词，而不是单个字符。 |\n\
    | CTRL+BACKSPACE 和 CTRL+左或右箭头 | 按住 CTRL 键同时按左或右箭头，光标每次移动一个单词，而非一个字符。如果您想每次高亮一个单词，请按住\
    \ CTRL+SHIFT，然后按左或右箭头键。您的高亮选择将沿该每次方向移动一个单词。 |\n| CTRL+S | 在几乎所有程序中处理文档或其他文件时，按\
    \ CTRL+S 可保存该文件。如果您正在处理任何重要内容，请频繁使用此快捷键，以防出现错误、断电或任何其他导致您自上次保存以来丢失工作的问题。<br><br>在\
    \ Apple 电脑上，使用 Cmd+S 保存文件 |\n| CTRL+HOME 或 CTRL+END | CTRL+HOME 将光标移动到文档开头，CTRL+END\
    \ 将光标移动到文档末尾。这些快捷键适用于大多数文档以及网页。<br><br>在 Apple 电脑上，使用 Cmd + 向上箭头到达文档或文本的开头，或使用\
    \ Cmd + 向下箭头到达末尾。 |\n| CTRL+P | CONTROL+P 用于打开当前查看的页面或文档的打印预览。例如，立即按 CTRL+P 查看本页的打印预览。<br><br>在\
    \ Apple 电脑上，使用 Cmd+P 打开打印预览。 |\n| PAGE UP、空格键和 PAGE DOWN | 正如您可能猜到的，按 Page Up\
    \ 或 Page Down 键可移动到上一页或下一页。浏览 Internet 时，按空格键向下滚动一页。同样，SHIFT+空格键向上滚动一页。 |\n\n\
    | 快捷键 | 操作 |\n| --- | --- |\n| ALT+F | 当前运行程序中的文件菜单选项。 |\n| ALT+E | 在当前程序中打开编辑选项。\
    \ |\n| ALT+TAB | 在打开的程序之间切换。 |\n| F1 | 查看帮助信息。 |\n| F2 | 重命名选定的文件。 |\n| F5 | 刷新当前程序窗口。\
    \ |\n| CTRL+D | 在 Internet 浏览器中为当前页面添加书签。 |\n| CTRL+N | 在程序中创建新文档或在大多数 Internet\
    \ 浏览器中打开新标签页。 |\n| CTRL+O | 在当前运行的程序中打开文件。 |\n| CTRL+A | 选择所有文本。 |\n| CTRL+B |\
    \ 将选定的文本更改为**粗体**。 |\n| CTRL+I | 将选定的文本更改为*斜体*。 |\n| CTRL+U | 将选定的文本更改为<u>下划线</u>\
    \ |\n| CTRL+F | 为当前文档或窗口打开查找窗口。 |\n| CTRL+S | 保存当前文档文件。 |\n\n| 快捷键 | 操作 |\n| ---\
    \ | --- |\n| CTRL+X | 剪切选定项目。 |\n| SHIFT+DEL | 剪切选定项目。 |\n| CTRL+C | 复制选定项目。 |\n\
    | CTRL+INS | 复制选定项目。 |\n| CTRL+V | 粘贴。 |\n| SHIFT+INS | 粘贴。 |\n| CTRL+Y | 重做上一个动作。\
    \ |\n| CTRL+Z | 撤销上一个动作。 |\n| CTRL+K | 为选定文本插入超链接。 |\n| CTRL+P | 打印当前页面或文档。 |\n\
    | HOME | 转到当前行开头。 |\n| CTRL+HOME | 转到文档开头。 |\n| END | 转到当前行末尾。 |\n| CTRL+END |\
    \ 转到文档末尾。 |\n| SHIFT+HOME | 从高亮当前位置到行开头。 |\n| SHIFT+END | 从高亮当前位置到行末尾。 |\n| CTRL+左箭头\
    \ | 每次向左移动一个单词。 |\n| CTRL+右箭头 | 每次向右移动一个单词。 |\n| CTRL+ESC | 打开\"开始\"菜单。 |\n| CTRL+SHIFT+ESC\
    \ | 打开 Windows 任务管理器。 |\n| Alt+F4 | 关闭当前活动的程序。 |\n| Alt+ENTER | 打开选定项目（文件、文件夹、快捷方式等）的属性。\
    \ |\n\n## PC 特殊字符快捷键\n\n| 快捷键 | 特殊字符 |\n| --- | --- |\n| ALT+0224 | à |\n| ALT+0232\
    \ | è |\n| ALT+0236 | ì |\n"
