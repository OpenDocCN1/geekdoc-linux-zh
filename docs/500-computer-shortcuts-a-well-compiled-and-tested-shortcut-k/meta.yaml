    multiple tabs open in your Internet browser, press CTRL+TAB to switch between
    them.


    TIP: Adding the Shift key to ALT+TAB or CTRL+TAB moves backward. For example,
    if you are pressing ALT+TAB and pass the program you want to use, press ALT+SHIFT+TAB
    to move back to that program.


    TIP: Windows Vista, 7, 8, and 10 users can also press the WINDOWS KEY+TAB to switch
    through open programs in a full screenshot of the window.


