    index. It returns the data to the view in the form of QVariant. This enables the
    view to interpret the data it receives in accordance with the role it adopted
    to make the request. If, given a role and a model index, there is no data available
    to return, the model signals this by returning an empty QVariant object as the
    result of the call to data(). This procedure also enables the view to present
    different data types in accordance with the various roles. Figure 8.2 illustrates
    the use of roles in an example of a list view.


    If the predefined roles are not sufficient, you can define your own roles and
    make them available in the model. The predefined views, however, can use them
    yet. But there is an easier way to use your self-defined roles than inheriting
    your view class from the pre-defined view class. This is because a so-called delegate
    is in drawing list or table entries (see Figure 8.1).


    The delegate provided by Qt that is implemented in the QItem class will be sufficient
    in most cases. It also provides an editor function for modifying data elements
    displayed in the view. For this to be useful, however, the model must support
    writing back to the data source, which is not always case: Many models only make
    information available for reading and do not write access.


    ![](img/b663c93885d7333a091a433460ee647f_211_0.png)


    # 8.1.1 The View Classes


    For the data visualization itself, Interview provides three ready-to-use classes
    that we can admire in use in Figure 8.5 on page 213:


    QListView


    This class displays one-dimensional lists (Figure 8.5 at the top left) and also
    has an icon mode in which it shows all of its entries arranged as icons (Figure
    8.5 at the top right).


    QTreeView


    This class displays lists in tree form (Figure 8.5 at the bottom left) and is
    thus more elaborate than QListView. In addition this class can display several
    columns, which QListView is not capable of doing.


