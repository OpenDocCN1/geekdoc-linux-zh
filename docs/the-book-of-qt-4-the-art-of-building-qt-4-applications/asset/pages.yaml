    We now repeat again the two most important points: All translatable strings in
    the program code must always be enclosed by the QObject method tr(). In addition,
    variables in strings may never be directly concatenated, since it would be impossible
    to produce the correct word order in the target language, as the follow English-to-German
    sentence conversions:


    ```

    QString filename = "file.txt";nQString message = tr("Could not save ") + filename;

    ```


    In the German translation, the word order should be "File.txt not save" but the
    expression used to construct the message English word order and cannot produce
    the desired phrase. To do the translation correctly, you need to use placeholders,
    as shown below:


    ```

    QString filename = "file.txt";nQString message = tr("Could not save %1").arg(filename);

    ```


    Now tr() is able to translate this sentence with the correct inverted (relative
    to English) word order, Could %1 not save. We will now explain how this works.


    # 14.1.1 Preparing the Application


    The CuteEdit version used here is different from the one in Chapter 4, in that
    uses English strings in the code. This is not necessary but it does make sense,
    as English is normally used as the lingua franca, allowing external programmers
    whose mother tongue is not to work on the program.


    For the translation of Qt-based applications, Qt provides the programs update,
    linguist, and release. The translation process is not a separate task, completely
    isolated from the code development, but is integrated into the Qt project management
    file until it looks like this:


    ```

    #cuteedit1@cuteedit1.pro


    TEMPLATE = app

    SOURCES = main.cpp mainwindow.cpp

    HEADERS = mainwindow.h

    FORMS = mainwindow.ui

    RESOURCES = pics.qrc

    ```


    then all that is missing the entry for TRANSLATIONS, which expects one or more
    translation files as arguments. Adding translation support for German, French,
    and Italian will look like this:


