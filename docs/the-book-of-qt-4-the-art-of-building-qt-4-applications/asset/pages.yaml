  md: "# B.5.12 Determining Absolute Value\n\nThe C library enables the absolute value\
    \ of an integer value to be calculated via the abs() function. In the same way\
    \ that the fabs() function calculates the absolute value for floating-point numbers,\
    \ Qt defines the qAbs() method, which can calculate the absolute value for PODs.\
    \ This works with all classes that implement the unary minus and the comparison\
    \ operator >= and allows comparison to an integer 0 as the neutral element. The\
    \ method itself does not allow the programmer to specify a neutral element.\n\n\
    The following code example, which could appear in a window manager class, ensures\
    \ that the top right of a window cannot lie above the point (0,0), that is, the\
    \ top corner, and assumes that positive values were actually intended:\n\n```\n\
    void WindowManager::placeWindow(WID win, const QPoint& topRight)\n{\n    QPoint\
    \ actualPosition = qAbs(topRight);\n    ...\n}\n```\n\n# B.6 Qt-specific Type\
    \ Definitions\n\nTo ensure that Qt has the same properties on all supported platforms,\
    \ the library uses its own definitions for most PODs. More detailed information\
    \ on the requirements for platform-independent data types is provided in a book\
    \ by Brian Hook.^8 Trolltech defines all these types with the typedef command,\
    \ so it uses no macros. This has the advantages that the compiler can work with\
    \ such definitions better and that error messages refer to the Qt types, simplifying\
    \ error searches.\n\n# B.6.1 Integer types\n\nSigned types\n\n+   - qint8 variables\
    \ are 8 bits wide (value range: -128 to +127).\n- qint16 values occupy 16 bits\
    \ (value range: -32768 to +32767).\n- qint32 integers use 32 bits (value range:\
    \ -2 147 483 648 to +2 147 483 648).\n\n> ^8 Write Portable Code by Brian Hook\
    \ (No Starch Press, 2005)."
  merge: -1
  pgno: 423
- img_proc: true
  md: 'qint64 values are 64-bit values (value range: $-2^{32}$ to $+2^{32} - 1$).
    To generate such large values as literals, the Q_INT64_C() macro exists, since
    a number of compilers do not support 64-bit literals directly:


    ```

    qint64 value = Q_INT64_C(932838457459459);

    ```


    qlonglong is a synonym for qint64.


    # Unsigned types


    +   - quint8 values are 8 bits in size (value range: 0 to 255).


    +   - quint16 values take up 16 bits (value range: 0 to 65 535).


    +   - quint32 values are 32 bits wide (value range: 0 to 4 294 967 296).


    +   - quint64 integers take up 64 bits (value range: 0 to $+2^{64} - 1$). To generate
    64-bit literals, you should use the Q_INT64_C() macro, because a number of compilers
    do not support large integer literals literally:


    ```

    qint64 value = Q_INT64_C(932838457459459);

    ```


    Similar to qlonglong, qlonglong is a synonym for qint64.


    # B.6.2 Floating-point Values


    With qreal, Qt defines a floating-point number of double precision. This corresponds
    to the C++ type double.


    # B.6.3 Shortcuts for Common Types


    The following definitions do not improve platform independence, but merely the
    work of having to enter unsigned, for those who do not use the POD definitions
    employed by Qt:


    +   - uchar corresponds to unsigned char.


    +   - uint corresponds to unsigned int.


    +   - ulong corresponds to unsigned long.


    +   - ushort corresponds to unsigned char.'
