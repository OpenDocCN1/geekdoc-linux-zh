    value the new QRColor the values encoded in the QRgb variable.

    The advantage of QRgb as a lightweight alternative for transporting RGB color
    information is particularly evident whenever large amounts of pixel data from
    an image need to be read in.


    QRgb divides the available bits in the 32-bit integer into four integer color
    values, each consisting of eight bits representing values from 0 to 255. This
    is done as follows, in hexadecimal notation "A" = alpha value, "R" = red, "G"
    = green, "B" = blue:


    ```

    0xAARRGGBB

    ```


    You do not have to construct your own QRgb values, however: The help functions
    rgbgb() and rgbgba() take on this and expect the color details to be provided
    in three arguments, as values between 0 and 255. rgbgba() expects the alpha channel
    as the fourth argument. rgbgb() omits the specification of the alpha channel,
    and sets the color of the constructed QRgb value to 255 (corresponding to an opaque,
    that is, nontransparent, color). You can then access the individual QRgb components
    via QRgb::Red(), QRgb::Green(), QRgb::Blue(), and QRgb::Alpha(). These functions
    return values from 0 to 255.


    The following example creates a semitransparent QRgb value and passes it to a
    QColor object, from which we read the colors and the alpha channel with the rgba()
    function and write it back to the QRgb variable:


    ```

    QRgb rgba = qrgba(255, 0, 0, 127); // A=127, R=255, G=0, B=0

    QColor color = QColor::fromRgba(rgba);

    rgba = 0; // A=0, R=0, G=0, B=0

    color.rgba(); // A=127, R=255, G=0, B=0

    ```


    It is important to use the fromRgba() static method because the standard constructor,
    which accepts a QRgb value, ignores the alpha channel.


    # 10.1.2 Other Color Spaces


    In addition to RGB, QColor can use the HSV model, which defines a color through
    hue, saturation, and brightness (or value) parameters. (HSV is therefore sometimes
    referred to as HSB, where the B stands for brightness, which is actually a more
    precise term for the third parameter). The HSV model corresponds most closely
    to the human perception of color composition.


    To make use of it, we must accordingly convert the color, via toHsv(). We then
    read out the HSV parameters, either componentwise via hue(), saturation(), value(),
    and alpha(), or all at the same time, using getHsv():


