  md: 'To be able to work with the classes of the module, Qt provides a meta-include
    for this package as well, which contains all the class definitions from the module.
    The command to integrate it into a source file is as follows:


    ```

    #include <QtSql>

    ```


    Each of the classes of the module belong to one of three layers. The driver layer
    implements the interface between the drivers for various databases and the API
    layer (see Table 9.1). This provides application developers with access to the
    databases and enables typical SQL operations, such as browsing or modifying tables
    and querying data.


    In order to include the results of queries in Interface views, the user interface
    provides models that are based on SQL tables or queries. Figure 9.1 provides an
    overview of the layers and the classes belonging to them.


    Figure 9.1: The structure of QtSql module


    | User interface level |

    | :--- |

    | QSqlQueryModel, QSqlTableModel, QSqlRelationalTableModel |

    | SQL API level |

    | QSqlDatabase, Query, QSqlError, QSqlField, QSqlIndex, QSqlRecord |

    | Driver level |

    | QSqlDriver, QSqlDriverCreator<>, QSqlDriverCreatorBase, QSqlDriverPlugin, QSqlResult
    |


    # 9.2 Selecting the Appropriate Driver


    The license of the client API for some database systems is not GPL-compatible,
    a number of drivers are missing (marked in Table 9.1 with ¹) in the open source
    edition.


    Table 9.1: Drivers for QtSql


    | Driver name | Database system |

    | :--- | :--- |

    | QDB2 | IBM DB2 (Version 7.1 and newer)¹ |

    | QIBASE | Borland InterBase |

    | MYSQL | MySQL |

    | QOCI | Oracle Call Interface driver (versions 8, 9, and 10)¹ |

    | QODBC | Open Database Connectivity (ODBC), used by Microsoft SQL server and
    other ODBC-capable databases |'
