  md: '# Passing on Messages


    A program should open a special dialog for critical messages reporting errors
    that the user himself cannot solve, or can solve only with great difficulty. This
    dialog is also available in the same two versions as discussed until now. It is
    normally used as follows (Figure 6.9):


    ```

    QMessageBox::critical(this, app->applicationName(),

    t"A critical error has occurred. "\n"If the problem persists,\n\n"please contact
    our support center"\n* at +01 555 12 34 56-*"

    QMessageBox::Ok, QMessageBox::NoButton,

    MessageBox::NoButton);

    ```


    As, with the information dialog, we do not check for a return value, since there
    is only one button. In a realization the dialog should contain more information
    on the type of critical error that was encountered. It is recommended that you
    use critical messages very sparingly—they should be the exception rather than
    the rule.


