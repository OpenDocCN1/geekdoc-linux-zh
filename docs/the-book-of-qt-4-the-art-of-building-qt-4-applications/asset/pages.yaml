    #  5.2.3 Nested Layouts


    Sometimes it is useful to nest layouts inside one another, for instance if you
    need to include a new layout, with all its widgets, in an existing one. For this
    reason, QLayout classes provide a way of including other layouts, with addLayout().
    This method expects the same parameters as the addWidget() method of the same
    layout object.


    For more complex layouts in particular, the clear hierarchy created in this turns
    out to be very useful, especially if you want to arrange several buttons, as the
    following code:


    ```

    // nested/main.cpp


    #include <QtGui>


    int main(int argc, char* argv[])

    {

    QApplication app(argc, argv);

    Widget *w = new QWidget;

    HBoxLayout *mainLayout = new QHBoxLayout(w);

    TextEdit *edit = new QTextEdit(w);

    mainLayout->addWidget(edit);


    BoxLayout *verticalLayout = new QVBoxLayout();

    QPushButton *cancelBtn = new QPushButton(QObject::tr("Cancel"), w);

    QPushButton *okBtn = new QPushButton(QObject::tr("OK"), w);

    QPushButton *defaultBtn = new QPushButton(QObject::tr("Default"), w);

    verticalLayout->addWidget(cancelBtn);

    verticalLayout->addWidget(okBtn);

    verticalLayout->addWidget(defaultBtn);

    verticalLayout->addStretch();


    mainLayout->addLayout(verticalLayout);

    w->show();

    return app.exec();


    ```


    By placing the individual buttons in a separate layout (buttonLayout), they are
    made to appear as one unit on the overlying layout mainLayout. You can now use
    addLayout() to insert the buttonLayout into mainLayout.'
