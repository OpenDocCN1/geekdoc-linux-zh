  md: '# 10.1.1 The RGB Color Space


    Qt encapsulates colors in the QColor class. This is based on the RGB model, with
    8 bits, representing a range of values from 0 to 255, are allocated to a color.
    In addition, QColor specifies another value, the so-called alpha value, also referred
    to as the alpha channel. This defines the transparency of a pixel.


    QColor can also work with values other than integers. For each color command that
    accepts an integer, there exists a floating-point variation that allows colors
    to be specified more precisely. Whenever a QColor method information is discussed
    below, you can substitute an associated floating-point variant instead, which
    accepts real values. For example, the setRGB() method, which takes integer values
    for the red, green, and blue color components and accepts an optional alpha value,
    has a corresponding floating-point equivalent setRGB() object.


    There are several ways to generate a new QColor. The basic QColor() constructor
    creates an invalid color. Furthermore, a constructor that accepts colors described
    using integers. The semantics here construct those of setRGB(). There is no separate
    constructor that takes floating-point numbers as arguments, since this would be
    ambiguous, C++ automatically converts integer values to floating-point values.
    To initialize a color with floating-point values, you first create an empty (and
    initially invalid) QColor object, and then set color via setRGB().


    Earlier examples often used another constructor that accepts a color chosen from
    20 predefined colors that are defined in the GlobalColor enumer. enumeration also
    includes values describing a number of special cases: The "color" QColor::transparent,
    for example, to QColor(0, 0, 0, 0) and allows a background color to show through.


    In addition, QColor can reduce the desired color from a name, as defined in SVG-1.0
    specification. For this purpose the class has a constructor that accepts a QString
    and the setNamedColor() method works in the same way. This option permits a named
    color to be set later on, as illustrated in the following:


    ```

    QColor color("navy"); // sets a dark blue

    color.setNamedColor("royalblue"); // sets a light blue

    ```


    The names of all available named colors are returned by QColor with the color-Names()
    method.


    Finally, QColor has a constructor that accepts a QRGB value. QRGB in this case
    is not a class name, but a name, given by a type definition, for a 32-bit integer.
    Given such a value as an argument, this constructor sets the RGB values and the
    alpha


    > 1 See http://www.w3.org/TR/SVG/types.html#ColorKeywords.'
