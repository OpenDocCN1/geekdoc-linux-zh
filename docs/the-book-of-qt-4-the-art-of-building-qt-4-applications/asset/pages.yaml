  md: '# 1.1 Our First Qt Program


    # 1.1.1 Compiling a Qt Program


    When compiling this program, you are faced with a problem: Qt is supported on
    various platforms, and the details of the compilation process differ for each
    type of system. The Qt vendor Trolltech solves this problem with a simple program
    that is used to create projects on a cross-platform basis: qmake


    qmake generates a Makefile from a project file that describes the application
    in a form that is independent of the operating system on which the application
    is actually compiled. The generated Makefile contains all the information required
    to compile the C++ application code on a specific platform. (In Windows it is
    also possible to generate Visual Studio projects from qmake project files.)


    # Generating Project Files and Makefiles with qmake


    To generate a project file for the "Hello, world!" program, it is sufficient to
    call qmake with the -project option. To do this, open a shell and change the current
    directory to the directory containing the source file. The source text is located
    in the directory helloWorld and has the name, as in, main.cpp,3 then the command


    ```

    user@linux:helloworld$ qmake -project

    ```


    will generate a file called HelloWorld.pro with the following contents:


    ```

    # HelloWorld/HelloWorld.pro


    ######################################################

    # Automatically generated by qmake

    #################################################


    TEMPLATE = app

    CONFIG -= moc

    DEPENDPATH += =

    INCLUDEPATH += .

    ```


    ```

    # Input

    SOURCES += main.cpp

    ```


    +   2 Please make sure that you really use the Qt 4 qmake, which differs significantly
    from the Qt 3 version. Use of the Qt 4 causes errors. Many Linux distributions
    contain both Qt 3 and Qt 4; for example, qmake is linked by default to qmake-qt.
    The Qt 4 version of the tool can be run with qmake-qt4; if you seldom need the
    third edition, change the corresponding link to /etc/alternatives.

    3 Although qmake does not require main.cpp to contain the main() function, this
    convention has become.


