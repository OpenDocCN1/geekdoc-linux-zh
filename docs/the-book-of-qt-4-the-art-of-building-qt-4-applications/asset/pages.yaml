  md: '# 4 Developing a GUI Application Based on a Main Window


    the user friendliness of the software. They should therefore be provided as a
    matter of course in the design of user interfaces. With the accelerators in place,
    the design view of the editor should correspond to that shown in Figure 4.3.


    To define the subsets of an individual menu entry, we select the entry in the
    menu bar. A drop-down menu then and, for each desired subitem, we select Type
    here... and enter its name.


    Let''s start in the File menu, to which we will assign the subsets New, Open...,
    Save, Save..., and Quit. We recommend that you add a separator before the Quit
    entry, so that this special action has visual distance from the other entries.


    There is a reason behind the fact that only some entries end with dots (...)—these
    denote entries that require further user interaction through a dialog.


    In the same way we equip the Edit menu with the entries Undo, Repeat, and after
    a separator, Cut, Copy, and Paste. The Help menu gets by with the Info... item,
    the implementation of which we will deal with on page 117.


    # 4.3.2 Recycling Actions in the Toolbar


    If you want to make the most important entries in the menu easily accessible for
    mouse users, this raises the question: Is it possible to recycle the entries from
    the menu entries? Luckily the answer is yes, since Qt encapsulates menu and toolbar
    entries in so-called *actions*, for which the QAction class is responsible.


    When we created the entries in the menu of mens bar, the Designer created a separate
    action for each entry, which we will now reuse. An overview of all existing actions
    is provided by the **Action Editor**. If it is not already displayed as in Figure
    4.4, you can make it visible with Actions—Action Editor.


    > Figure 4.4:

    The Action Editor lists all available actions that can be adjusted in the Property
    Editor like widgets.


    ![](img/b663c93885d7333a091a433460ee647f_109_0.png)


    At the moment, no icons are assigned to the actions listed in it, in which case
    the full text is displayed instead of an icon, taking up significantly more icons.'
