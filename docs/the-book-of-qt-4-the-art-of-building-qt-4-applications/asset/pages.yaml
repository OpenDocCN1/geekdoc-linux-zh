    # Defining the Default Button


    If you want, you can switch on the default property for the QPushButton. If it
    is set to true, pressing the Enter key anywhere within the dialog activates the
    button. However, this hardly makes sense, because the button is activated, the
    application carries out a destructive action (that is, closes), which would probably
    irritate the user if it activated by mistake.


    Although the Designer allows the default property of several buttons in a widget
    to be set to true, only one of them can function as the default button. Qt treats
    the last of the widget to have its default property set to true as the''s actual
    default.


    If the widget involved is a dialog, from version 4.1 onward automatically enables
    the autoDefault property for all buttons arranged on it. This property comes into
    effect if the user “jumps” from one part to the next using the Tab key (see page
    89): If he reaches a line edit when doing this, for example, pressing the Enter
    key activates the button in the tab sequence, provided its autoDefault property
    has been set.


    When using QButtonBox, the default property is automatically assigned to constructive
    button. Close, a destructive action, cannot become the default button in this
    case.


