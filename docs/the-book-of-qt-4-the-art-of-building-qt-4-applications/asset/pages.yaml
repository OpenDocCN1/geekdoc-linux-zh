    # 10.10.3 Composition Modes


    Finally, QPainter supports the so-called composition modes for pixels, according
    to Porter and Duff.¹⁴


    In Porter-Duff composition, a pixel is combined from two sources that each have
    color details with an alpha channel. So-called composition operators combine these
    sources into a new pixel.


    In Qt these always refer to the current Painter operation (the source) as well
    as the current target pixel on the drawing device (target, destination). The composition
    mode can be changed before drawing any operation. A new ARGB32 pixel is created
    according to the formula


    ```

    result color_pixels = source color_pixels *pdo destination color_pixels

    ```


    The operator *pdo is not a normal multiplication, but stands for one of the Porter-Duff
    operators that combine both values with each other. If such an operator is set,
    this changes the composition mode in the QPainter.


    For this function, the Qimage must use the Format_ARGB32_Premultiplied or the
    Format_ARGB32. If this is not the case, it is converted accordingly using setToFormat().


    > ⁴ Named after Thomas Porter and Tom Duff, who developed this technique at Lucasfilm
    and went public at the SIGGRAPH conference (Thomas Porter and Tom Duff, "Composing
    Digital Images," SIGGRAPH Vol. 88, 1984, pages 253–59). The term Porter-Duff algebra
    is also used.


