    # B.2.1 Simple List (QList)


    STL programmers frequently use std::vector because this-contrast to the STL list
    container, which is implemented as a linked list is very fast to iterate over.
    The QList, the list container most used in Qt, is, from the perspective of implementation,
    an array of pointers that point to objects, in contrast to std::list. Provided
    that you want to access objects directly, this solution is quicker than an embedded
    list. Inserting at both ends of a list using prepend() and append() is also very
    fast-for lists with up to a thousand entries, QList is usually the fastest solution
    of all those provided by the Qt and STL classes.


