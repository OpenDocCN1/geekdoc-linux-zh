    # Setting the Window Title


    The first two problems are solved with a single line of code. To solve the first
    problem, we use the function setWindowTitle(), which sets the window title of
    a widget that occupies a top-level window. This function is a method of the QWidget
    class. Since ByteConverterDialog has QWidget as its base class, it inherits this
    function, and we can simply call it up.


    # Specifying the Default Button


    The default button for a dialog is specified by informing the button (rather than
    the dialog, as you might expect) that it is indeed the default button. (Note,
    however, calling setDefault(true) on a QPushButton object only has an effect if
    the button is used in a dialog—in a main window there are no default buttons.
    To try to define a default button for a main window, Qt will make it look like
    one, but it doesn''t activate when the user presses the (Enter) key.)


