    as Trollch has slightly altered the default template. The motivation was to overcome
    problems with regard to the button order on different platforms: On Mac X and
    GNOME, the destructive action (e.g., Cancel) is on the left side, while the constructive
    action (e.g., OK) is on the right hand side. On Windows and KDE, the button order
    is the other way around.


    Trollch''s solution was to introduce a new class QPushButton in Qt 4.2, which
    automatically provides what the user had to set up manually: a set of default
    buttons and a spacer. By QPushButton, the application will automatically pick
    the right order for the style chosen. Figure 3.3 shows the default template in
