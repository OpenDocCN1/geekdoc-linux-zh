    # 12.5.1 Communication via Events Without a Thread-based Event Loop


    It is still possible to use the method employed in Qt 3 to send messages to objects
    in other threads via events. In this process the QCoreApplication::postEvents()
    method unloads the event in the correct thread, because it is generally risky
    to call a QObject-based object from another thread than the one in which it was
    created.


    To avoid problems, you should establish a connection to another thread only via
    postEvent(), via queued signal/slot connections, or via mutex-protected buffers.
    How postEvent() functions is described in Chapter 7 on page 185.'
