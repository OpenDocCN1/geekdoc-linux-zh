    QIODevice is an abstract class, so the developer only instantiates its subclasses.
    It represents the lowest common denominator of all types of input and output operations.
    Figure 11.1 provides an overview of the input/output classes that are based on
    QIODevice.


    # 11.1.1 Derived Classes


    QAbstractSocket cannot be used directly as the base class for socket-based communication,
    in contrast to its subclasses QUdpSocket and QtSocket. QUdpSocket enables communications
    via the User Datagram Protocol (UDP). UDP works without a connection and provides
    no guarantee that the sent data will arrive or in the correct order. Due to the
    lack of corrective measures, however, it is considerably faster than the Transmission
    Control Protocol (TCP), via which the QtSocket-class sends data reliably.


    In contrast to UDP, TCP connections are connection oriented and ensure a reliable
    transfer of data. Many of the protocols popular today, such as HTTP, which is
    used commonly in the World Wide Web for transmitting web pages and downloads,
    are based on TCP.


    The QBuffer class allows you to write to QByteArray as if it were QIODevice-based
    devices. We were already introduced to this procedure in Section 8.8 on page 243,
    and we will take a further look at it on page 322 in connection with QDataStream.


    Probably the most used subclass of QIODevice is the QFile subclass. We learned
    about its ability to read and write files on the local filesystem for the first
    time on page 113.


    In case there is not enough memory to store temporary data via QBuffer or QByteArray,
    TemporaryFile is available. In contrast to QFile, this class generates a filename
