  md: '# B.1 Iterators


    This has a number of disadvantages. Basically, iterating index access is slow
    for many data structures, especially for structures that do not allow direct addressing
    via indices (such as some list types, or in trees).


    This is why we have iterators. These objects are specialized for use in traversing
    data structures. They point to an element of a data structure and at the same
    time provide methods to move around within the data structure, starting off from
    the current element. In this way they abstract the data structure from the iteration,
    avoiding code that uses direct index access


    Another advantage is that iterators allow the concrete implementation of the data
    structure on which they may be replaced without the need for the iteration to
    be modified. If you realize that an embedded list is better for certain problems
    than a normal pointer-based QList, you can simply substitute the new implementation
    without this changing any influence on code that uses the iterator.


    In addition, iterators provide a certain amount of protection from coding errors
    that arise because of changes in the container on which they are working. For
    example, if an element is added to the beginning of a list as the consequence
    of an iteration (which is often the case in the specialized list Queue), index-based
    addressing returning the wrong element to the next access unless the code has
    been written to adjust the index variable to account for the insertion. This extra
    care is often necessary when writing code that uses iterators to move around the
    structure.


    Tulip makes a distinction between two iterator types: STL-style and Java-style,
    which are based on different concepts.


    # B.1.1 STL-Style Iterators


    The most well-known iterators in the C++ environment, STL-style iterators are
    implemented by Tulip in all container classes. STL iterators always point to elements.
    If they reach the end of the container and are advanced past the final element,
    they then point to a nonexistent element. If you try to access the element pointed
    at the iterator, the result is undefined.


    Using a QStringList, which is basically a specialized QList<QString>, the example
    above would look like this:


    ```

    // foriterator/main.cpp


    #include <QtCore>

    #include <QDebug>

    ```


    +   2 A good example of this is the QList discussed on page 398.

    3 In database circles these are known as cursors.'
