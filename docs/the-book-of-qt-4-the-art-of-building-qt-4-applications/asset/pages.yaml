    # # The QtSql Module


    Nowadays, it is difficult to imagine many applications being able to function
    without relational databases to back them up. For this reason Qt provides a range
    of classes in the QtSql module that work with various relational database management
    systems (DBMS). Relational tables and queries can also be used as the basis of
    Interview models.


    # ## 9.1 Structure of the QtSql Module


    The QtSql module is an independent library that can load additional plugins if
    required. In contrast to QtCore and QtGui, its contents are not integrated by
    default (with qmake -project) into the generated projects. In order to use the
    library, the following entry is therefore necessary in the .pro file:


    ```

    QT += sql

    ```'
