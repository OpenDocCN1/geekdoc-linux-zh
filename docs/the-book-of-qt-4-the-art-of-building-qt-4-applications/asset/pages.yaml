    # The Meta-object Compiler moc


    The signal/slot concept in Qt is not pure C++, but rather an extension of the
    C++ standard. for which the command-line program moc (**meta object compiler**)
    is used to convert the signal and slot constructs into standard C++. moc additional
    C++ code for each class derived from QObject. This ensures that signal/slot connections
    can be dynamically generated at runtime. It also allows the names of classes that
    use QObject as a base class to be dynamically determined at runtime, and even
    to determine whether a class is a base for another class.¹⁹


    Qt also includes a property system, for which moc generates the necessary code.
    Properties are special characteristics of a class that can be queried and set.
    For example, the QLabel class has a text property, whose value is a string containing
    the text that the label displays. For each property there are two functions: one
    returns its current value, also called the get method, and one that changes it,
    also known as the set method. In the case of QLabel, text() is the get method
    returning the label''s text, and setText() is the set method providing the label
    with a new text. These two functions, marked in the class definition as properties,
    allow the text to be queried via QObject::property() and set with QObject::setProperty().
    Both require a string, namely the name of the property, as an argument. The **Property
    Editor** of the Designer determines the value of properties at runtime and allows
    these properties to be changed. If you require properties in a separate class,
    they must be derived from QObject.


    In short, moc is needed whenever a class uses QObject as a base. The meta-object
    compiler must preprocess every file that implements the definition of such a class
    before the C++ compiler is run. In each case it creates a file with the prefix
    moc.


    For example, if you write your own dialog MyDialog with QObject as a base class,
    with the class definition in the file MyDialog.h and the actual implementation


