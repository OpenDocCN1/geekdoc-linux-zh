  md: '# 4 Developing a GUI Application Based on a Main Window


    So that qmake can unite the existing files into a project, we use the following
    .pro file:


    ```

    #cuteedit1/cuteedit1.pro


    TEMPLATE = app

    SOURCES = main.cpp mainwindow.cpp

    HEADERS = mainwindow.h

    FORMS = mainwindow.ui

    ```


    Apart from the already known variables TEMPLATE and SOURCES, which we use to specify
    that we are compiling an application and to the source files, the HEADERS variable
    is also used. This specifies the header files to be used in the project: qmake
    searches through those header files for the Q_OBJECT macro and creates appropriate
    for the moc mocks.


    # 4.3 Creating a Main Window with the Qt Designer


    Ever since Qt 4.1, the Qt Designer has enabled the user to design main windows
    as well as dialogues. When used for this purpose, all the descriptions from Chapter
    3 apply. In particular, as explained there, the user interface uic creates a class
    from the .ui file generated by the Designer; the setupUI() method then "decorates"
    a main window to a certain extent.


    After the Designer has started, we select the Main Window item from the template
    Menu. When designing our editor, we borrow ideas from the designs of other editors.
    The central widget is a widget that enables text to be displayed and edited. It
    provides a class QTextEdit for this purpose.


    Accingly we pull an empty text element from the input widget category to the middle
