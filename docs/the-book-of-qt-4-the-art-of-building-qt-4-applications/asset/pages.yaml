- img_proc: true
  md: '# Debugging Help


    whereas C++ programmers prefer to send output through streams, via cout and cerr,
    since no format string is required in this case.


    Both approaches cause problems as soon as program development is finished: Prior
    to release, the debugging output must be deactivated, although certain critical
    messages possibly should remain.


    Qt allows an alternative approach that supports both of the commonly used methods
    and solves the aforementioned problems: It suppresses debug messages if the QT_NO_DEBUG_OUTPUT
    macro is defined during the compiling process. This is automatically the case
    if you build the Qt program without debug support. This is ensured by inserting
    the CONFIG = debug line in the project file.


    To use the functions and macros described below, no additional inclusions are
    necessary—apart from files that otherwise manage without Qt elements. In this
    case you must include the Qt header:


    ```

    #include <QGlobal>

    ```


    If QT_NO_DEBUG_OUTPUT is undefined, what is done with the error messages depending
    on the operating system. Under Unix-type operating systems such as Linux or OS
    X, the output appears on the standard error output, better known as stderr. On
    Windows machines this output lands in the debugger. If you want to divert the
    output elsewhere, define your own message handler, as described in Section A1.3
    on page 388.


    Qt provides three functions that are responsible for the debug output and implement
    the aforementioned debugging output behavior: qDebug(), qCritical(), and qFatal().
    They only vary in terms of their effects, but they are used in an identical manner.
    Their signatures show similarities with the C function printf(). They every use
    the same format options.


    # A.1.1 Simple Debug Output


    qDebug() is the tool of choice for "normal" debug output:


    ```

    void qDebug( const char * msg, replacement_values_for_format_strings )

    ```


    This function is used, for example, to examine data structures at runtime. The
    following instruction displays the number of entries in the QList object list:


    ```

    qDebug("Amount of list entries: %d", list.size());

    ```


    In this case qDebug() replaces the formatting placeholders, which are prefixed
    by the percentage sign, with the actual parameters that have been supplied after
    the


