  md: '# Displaying Data Using

    "Interview"


    In GUI-based applications, data is often presented in list and table views, which
    can be nested within one another. When using list views, programmers often take
    a very simple approach: They simply add values, as strings, to lists. However,
    this raises the possibility that what should be distinct items in the list view
    cannot be distinguished from one another, particularly if duplicate labels are
    allowed or if the user can manipulate the strings used to label the list items.
    Qt 4 therefore does not support purely string-based list views.


    A second approach to data visualization is to represent each of the list entries
    as a separate object. On page 157 we already tackled such item-based lists, which
    encapsulate each entry as a lightweight item. These items can be extended to contain
    references to data denoted by the corresponding list entries, or to incorporate
    this data directly in the item object itself.'
  merge: -1
