  md: "# 8.5 Sorting and Filtering Data with Proxy Models\n\n# Outputting the Contents\
    \ of the Model\n\nIn order to round off our model and to complete our tour through\
    \ the world of writable models, we construct a method called toString(), which\
    \ converts the contents of the model into CSV and outputs this as a string.\n\n\
    To do this we go through all the datasets and use the QStringList method join\
    \ combine each string list into a single line in which the individual strings\
    \ are separated from one another with commas (). We terminate each line with newline\
    \ character before beginning the line next, which ensures that the desired empty\
    \ line at the end of the CSV file is created:\n\n```\n// addressbook/addressbookmodel.cpp\
    \ (continued)\nQString AddressbookModel::toString() const\n{\n    QString ab;\n\
    \    foreach (QStringList record, addressBook) {\n        ab += \"\\n\";\n   \
    \     record.join(\"\\\",\\\\\");\n        ab += \"\\n\\\";\n    }\n    return\
    \ ab;\n}\n```\n\nTo save the current status of the model, you now only need to\
    \ save the return value from toString().\n\n# 8.5 Sorting and Filtering Data with\
    \ Proxy Models\n\nOur model until now has lacked the capability to return its\
    \ entries in a sorted form. This is because there is no sorting criterion in this\
    \ model for any of the columns. It is also practically impossible to filter specific\
    \ entries from the model.\n\nTo address this shortcoming, Interview has provided,\
    \ starting from Qt version 4.1, the QSortFilterProxyModel class, after its predecessor\
    \ QProxyModel proved to be too unwind. It is based on the AbstractProxyBase class,\
    \ which represents so-called proxy models. These lie somewhere between a model\
    \ and view, obtaining their data from the model and returning it to the view in\
    \ modified form (see Figure 8.14 on page 237). The proxy model therefore becomes\
    \ the source model for the view. On page 237 we will look in more detail at how\
    \ proxy models function and implement our own proxy model. For the moment, we\
    \ will just look at what QSortFilterProxyModel can do: sort and filter."
