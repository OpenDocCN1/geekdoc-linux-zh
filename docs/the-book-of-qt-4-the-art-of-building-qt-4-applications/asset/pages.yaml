  md: "# 12.1 Using Threads\n\nThe QThread class represents threads in Qt. Even if\
    \ you do not explicitly create any lightweight processes, QCoreApplication always\
    \ creates a main thread internally. In connection with QApplication, we also talk\
    \ about the GUI thread. This is entrusted with a very special task: Only the GUI\
    \ thread can create widgets or draw with QPainter.\n\nFigure 12.1: Threads in\
    \ a process have their own register set and a separate stack, but they share everything\
    \ else.\n\n![](img/b663c93885d7333a091a433460ee647f_339_0.png)\n\nIn the first\
