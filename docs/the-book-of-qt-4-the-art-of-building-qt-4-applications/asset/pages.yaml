    # # Internationalization


    Many programs today are intended to reach users in many different countries. For
    this reason it is very important that an application can be modified easily and
    flexibly to the particularities of another language. One aspect of this is the
    translation of all visible texts into the target language. The direction of text
    flow, on which the arrangement of widgets is based, is also of central importance.


    In this chapter we will first translate the application CuteEdit, which we created
    in Chapter 4 using the tools of Qt. In addition we will get to know a few useful
    classes which, when used during the development process, will help to avoid problems
    later on when translating the software to another language.


    # ## 14.1 Translating Applications into Other Languages


    Qt includes several mechanisms to prepare application programs for translation
    into other languages later on (see page 50 and also page 123).'
