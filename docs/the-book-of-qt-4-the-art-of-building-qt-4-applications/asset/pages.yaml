  md: "# Restricting the View to Specific Datasets\n\nIn order to restrict the data\
    \ shown in the view to datasets matching a filter string specified in the line\
    \ edit widget, two connect() instructions are needed: The first informs the proxy\
    \ model as the text changes in the line edit. The proxy model uses this text as\
    \ the filter.\n\nThere are three slots in the proxy model to which the Changed()\
    \ signal can be linked. setFilterString() delivers all rows where the search column\
    \ contains the specified filter string as a substring, whereas setFilterWildcard()—which\
    \ we use in the example—also accepts * as a wildcard in the filter string. For\
    \ example, when setFilterWildcard() is used, the search term HelId* would match\
    \ a dataset in the model with \"Hello world\" in the search column. A search for\
    \ HelId using filter-FixedString() will return only datasets that contain the\
    \ exact six-character string HelId.\n\nsetFilterExp() accepts filter strings that\
    \ are regular expressions. HelId* as a search, it will return rows of which the\
    \ search column contains one of the following substrings: Held, Held, Helld, Helid\
    \ and so on.\n\nThe second signal/slot connection is used to select the field\
    \ which the proxy model should compare against the filter string. The setKeyColumn()\
    \ method, which expects the search column as the argument. This method is unfortunately\
