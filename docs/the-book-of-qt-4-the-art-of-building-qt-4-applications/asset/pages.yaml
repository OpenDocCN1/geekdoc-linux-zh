    Only if nothing else

    works is if it is time for

    MessageBox::critical();


    ![](img/b663c93885d7333a091a433460ee647f_174_0.png)


    # Providing Your Own Information on the Application


    The help area of an application usually contains a small dialog providing information
    on the application. We have already encountered one in Section 4.3.3 on page 117,
    without explaining it in more detail.


    Like the static methods listed here, QMessageBox::about() also first expects a
    parent widget and a window title. The third parameter is a free text that can
    be HTML formatted. If an icon for the application was defined with QApplication::setWindowIcon(),
    it is displayed as an icon next to the free text. The dialog has only one button
    and has no return value.


    If you also want to show that you have written your application with the Qt toolkit,
    you can include an additional help menu entry in your program that calls QMessageBox::about(Qt).
    This notification dialog provides information on Qt.'
