    but all classes in the inheritance sequence beginning from a root of the class
    hierarchy. Thus QVBoxLayout has three base classes (QBoxLayout, QLayout, and QObject),
    because QLayout inherits from QObject, QBoxLayout from QLayout, and QVBoxLayout
    from QLayout.'
