  md: '# Threading with QThread


    If a program needs to use parallel processes or perform resource-intensive jobs
    without blocking the GUI, there are only two alternatives: forking or threading.


    With forking, the operating system creates an exact copy of the current process.
    The new process can execute along a separate code path, for example, to make calculations
    while its parent perform some other task. Some form of interprocess communication
    is also required between the original process and its fork. Although this procedure
    is quite normal on Unix-based operating systems, support for forking under Windows
    is not so good, and it is very time consuming to carry out there.


    Since Qt places an emphasis on platform-independent programming, threading is
    seen here as the means of choice. Here several threads, also called processes,
    run simultaneously within a process. It is a relatively simple matter to create
    new threads and to switch between them, since a thread merely has a stack and
    a copy of the processor registers. As be seen in Figure 12.1, the threads in a
    process must share all other resources, such as the heap.'
