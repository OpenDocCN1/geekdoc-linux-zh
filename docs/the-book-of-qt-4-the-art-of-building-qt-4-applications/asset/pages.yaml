    QTableView

    This class displays data in a table (Figure 8.5, bottom right). At the top and

    are are the row and column headings, which can be individually customized.


    In addition, QHeaderView provides header lines for QTreeView as well as header

    columns and lines for QTableView. This class is not used as a separate view, but
    it

    can be adjusted to your requirements and then used in instances of QTreeView

    and QTableView.


    These views inherit from QAbstractItemView, the base of all views in Interview.

    If you look more closely at the inheritance structure in Figure 8.3, you will
    realize

    QAbstractItemView does not inherit from QWidget. Rather, the view

    classes are based on QAbstractScrollArea, a class that provides a widget with

    embedded widget.


    The embedded widget, called the viewport, can be many larger than the

    widget that connects it. The frame widget displays vertical or horizontal scrollbars

    where appropriate. In this way you can make available much more space for the

    data than was actually allocated for it in the layout of query; of course, the

    user must navigate through using the scrollbars.


    ![](img/b663c93885d7333a091a433460ee647f_212_0.png)


    # 8.1.2 The Model Classes


    All the models are included in Qt also inherit from a common abstract base

    class called QAbstractItemModel. Abstract means here that the class cannot be
    in-

    stantiated directly, because it contains unimplemented methods. The programmer

    can create objects only from a subclass that is tailored for a specific purpose
    and

    implements the missing methods. As can be seen in Figure 8.4, every model is also

    QObject, and thus benefits from automatic memory management.


    QAbstractItemModel is not the only abstract class in the inheritance model. If
    you

    look more closely at the inheritance structures, you will see two additional classes

    derived from QAbstractItemModel, called QAbstractListModel and QAbstractTable-\Model,
    whose APIs further specialize that of QAbstractItemModel with list or table

    views. These abstract subclasses cannot have objects directly instantiated from

    them.


