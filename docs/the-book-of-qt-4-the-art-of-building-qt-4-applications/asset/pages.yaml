  md: '# Preparations


    You should always use the most recent Qt version from Trolltech³ to ensure having
    as many bugfixes covered as possible. Linux users may also use the precompiled
    packages from their Linux distribution, but they should be prepared to meet some—often
    subtle—older distributions like Ubuntu Dapper Drake, where problems the debug
    libraries have been reported. In these cases, it is safer to obtain the source
    texts from Trolltech, and compile the sources yourself as described below.


    On OS X, you can choose between compiling Qt yourself or using a diskimage (.dmg)
    archive, which installs precompiled libraries to /opt/qt4. The latter will install
    only the static libraries, which are easily identified via their extension (a).
    At like time, these libraries become part of the binary. second .dmg archive contains
    the debug version of all Qt libraries, which should be installed on development
    systems, too.


    Although Qt can be configured to build static libraries on all platforms, this
    is mostly used on Mac OS X, where static linking is the preferred way to avoid
    library problems, at the expense of disk space.


    If you choose to build the sources on Linux or Mac OS X, it is sufficient to unpack
    the archive, and you have a compiler installed—run the command


    ```

    /configure -qt-gif -debug

    make

    ```


    from within the package directory. Before you should check, using ./configure
    -help, whether the system takes account of specific modules during compilation,
    such as particular database drivers, which you may require for your work. More
    detailed notes, especially on the SQL modules, are available in the corresponding
    chapters of this book.


    The parameters specified here for configure have turned out to be the smallest
    common denominator for many application cases: -qt-gif adds support for the GIF
    file format, disabled by default for reasons of licensing, to be included in the
    library. -debug ensures that a version with debugging icons is built, apart from
    the normal


    > 3 See http://ftp.trolltech.com/Qt/source.'
