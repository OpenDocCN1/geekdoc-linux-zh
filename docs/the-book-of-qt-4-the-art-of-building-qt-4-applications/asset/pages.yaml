    qDebug() << min; // output: \"Daniel\"\n}\n```\n\nIf it is essential for a value\
    \ to lie within a specific range, qBound() can be used. This template function\
    \ takes three arguments: a lower bound, a test value, and an upper bound. It returns\
    \ the upper or lower limit value if the test value is larger than the upper or\
    \ smaller than the lower bound, respectively. Otherwise, the test value is returned.\n\
    \nThe following method for a hypothetical radio tuner ensures that the tuner cannot\
    \ select any frequencies outside the UKW frequencies for Europe:\n\n```\nint Tuner::createValidFreq(qreal\
    \ freq) {\n    return qBound(87.5, freq, 108.0);\n}\n```\n\nNeither qBound() nor\
    \ qMax() and qMin() change the input data. They return a const reference to the\
    \ value determined by the function in each case.\n\n> Plain Old Datatype, that\
    \ is, all data types defined by the language such as int or bool.\n\n421"
