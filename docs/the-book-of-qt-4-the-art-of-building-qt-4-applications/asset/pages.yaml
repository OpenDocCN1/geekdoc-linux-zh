    #  4.7 Dock Windows


    In some cases it is useful, apart from simple actions, to group together complex
    widgets so that the user can place them either inside the main window or separate
    from it. Such-called dock windows are also provided by Qt 4: The class responsible
    for this is called QDockWidget.


    Users are especially aware of these development environments such as Microsoft
    Visual C++ or the Qt Designer,¹³ which arrange all their tools within the main
    window. As can be seen in the example of the Designer in Figure 4.11, the user
    can dock them in the same way as tools to side areas of the window, or position
    floating over the main window. If they are docked, a splitter (Chapter 5.3 on
    page 150), with which the user can fine-tune the size ratio of the dock window
    to the main window. Dock windows also have a handle (similar to tools), with which
    the user can move them to another margin of the window, or make them disappear.


