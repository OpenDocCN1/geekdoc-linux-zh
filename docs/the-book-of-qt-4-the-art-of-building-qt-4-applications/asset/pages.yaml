  md: '# 10.10 Complex Graphics


    # Compositing Operators


    A number of composition modes, such as SourceOver and DestinationOver, only reveal
    their full effects for images with Alpha channels. The SourceOver mode (Q-Painter::CompositionMode_SourceOver)
    is also known as alpha blending: Here the Painter paints the source pixel over
    the destination pixel. If transparency is switched on, parts of the destination
    pixel still shine through (Figure 10.12).


    The opposite is the case with DestinationOver (QPainter::CompositionMode_DestinationOver):
    Here the source pixel becomes the background, and the destination pixel accordingly
    remains in the foreground (Figure 10.12 on the right).


    > Figure 10.12: A comparison of SourceOver and DestinationOver operators


    ![](img/b663c93885d7333a091a433460ee647f_312_0.png)


    The source and destination operators also behave in a complementary manner: In
    the source mode (QPainter::CompositionMode_Source), the new pixel results directly
    from the source pixel. Its contents overwrite the previous contents of this pixel.


    > Figure 10.13: The source and destination operators let only one color through,
    instead of combining them as their brothers SourceOver or DestinationOver do.


    ![](img/b663c93885d7333a091a433460ee647f_312_1.png)'
