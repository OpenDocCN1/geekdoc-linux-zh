  md: '# 2.2 Separation of GUI and Processing Logic


    ![](img/b663c93885d7333a091a433460ee647f_76_0.png)


    We can connect the signals and slots of the line-edit widgets from the ByteConverterDialog
    to the slots of the ByteConverter class, for example, the hexChanged() signal
    of the decEdit object in a dialog to the setDec() slot of the associated ByteConverter.
    If the user enters a new decimal value, the line-edit widget sends out the textChanged()
    signal and setDec() is applied. This slot in turn sends the signals to the setText()
    slot and binChanged(). Since we have connected them to the setText() slot of hexEdit
    or binEdit object, the program updates the hexadecimal and binary values in the
    graphical user interface.


    The ByteConverter class "knows" nothing about the GUI components. It has a clearly
    defined interface and can still be used if the appearance of the application changes.


    Separating data processing from the GUI in this way should always be considered
    if the processing logic can be separated naturally from the user interface. If,
    on the other hand, you only want to synchronize individual GUI elements with one
    another, you should decide against such a splitting-up: In this case you will
    not attain any independence, but only shift responsibility to a new class.'
