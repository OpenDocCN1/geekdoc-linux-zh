    # B.3.2 Queues (QQueue)


    In many applications you will not be able to have using a queue. The

    possibilities are wide ranging—queues are used to implement buffers, as temporary

    memory for tree–based algorithms as breadth-first, search, and much more.


    Qt provides theQueue class for queues. This is merely a specialization of the
    QList.

    It is easy to see the thinking behind this design decision, because QList performs

    well when inserting and deleting at the beginning and end of the list.


    To get a value into the front of the queue, enqueue() method is used. As a

    parameter it expects a value of the type that was used as the type parameter in
    the

    declaration of the queue. dequeue() removes the last element from the queue and

    returns it.


    As a Java-style iterator, the iterator of the base class is used (in the same
    way as

    Stack), that is, QListIterator.


