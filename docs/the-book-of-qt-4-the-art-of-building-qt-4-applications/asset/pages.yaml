  md: '# Foreword to the German Edition


    Very nice, we thought, and far better than Qt 3, but we had failed to reckon with
    the high expectations of our users. Many changes had been taking place in the
    world of computer graphics. The XRender extension to X11 was becoming more powerful,
    the Cairo project was getting ready to close the gap with other systems and for
    all, the Macintosh at CoreGraphics, and a new Scalable Vector Graphics (SVG) format
    had begun to indicate where modern tools were going at the beginning of the 21st
    century.


    Arthur was on the right path, but we still had an enormous amount of ground to
    make up. That worked fast on the Mac were slow with GDI+ on Windows or with X11,
    and vice versa. Under X11—our core platform for the open source version—we were
    long way ahead, even when using extensions like XRender.


    Team Arthur, backed by Gunnar Sletta, therefore set itself a new goal: to match
    the feature set offered by SVG. The team was determined not to rest until high-quality
    vector graphics could be displayed equally well on all platforms, and at high
    speed, too. All this happened, *after* the release of the first Qt 4 Technology
    Preview.


    How would you have reacted to the project manager? We knew our solution was not
    good enough, but we were already behind schedule. And how can you pay your faith
    in two developers alike to write a new renderer that would compete with the giants
    of operating system vendors? Not only this, we wanted it to be even better than
    GDI+, and platform independent as well. Team Arthur was given three weeks to build
    a prototype to show what he could achieve.


    The two of them came up with this? The breakthrough success was due to the fantastic
    scan-line converter from the FreeType project, a piece of software that is generally
    used to display text. It took just three more days to display SVGs with floating-point
    precision, anti-aliasing, and powerful gradients.


    What can we learn from this? Qt is continually being developed by highly motivated
    (sometimes quite crazy) programmers who call themselves Trolls, who are spurred
    on to provide the best product for our users. It is also developed by people like
    Daniel and Patricia, to whom we thanks for producing this wonderful book you are
    holding in your hands, and by many other contributors and users around the world.


    Without this priceless community, Qt would not be where it is today, and the development
    team is gratefully aware of this. This is precisely the reason we will continue
    to strive for more and better. For you, our users—and because we enjoy it a little
    bit, of course. Welcome to Qt!


    Matthias Etrich,

    Head of Development, Trolltech


    18'
