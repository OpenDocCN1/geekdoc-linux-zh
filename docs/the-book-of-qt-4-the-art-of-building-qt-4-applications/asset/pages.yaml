  md: '# 8.11 Element-based Views Without Model Access


    # 8.11 Element-based Views Without Model Access


    Qt 3 programmers are used to every element in a view being represented by a separate
    object. Although this concept is no longer up to date in Qt 4, there is still
    a use for it in some areas, but usually it serves as a porting aid for Qt 3-based
    applications that are converted only at a later stage to model/view programming.
    For this Trolltech used an element-based class for each of the Interview views
    that manages without an external model. To distinguish these from normal views,
    we will call them widgets from now. We will discuss them only briefly here, because
    for most purposes a standard model is just as suitable.


    Internally, view widgets are based on the respective view classes, but they provide
    an extended API. Because this makes them completely autonomous, and they require
    no further classes, they are called widgets.


    In this way the QList view becomes the QWidget, the counterpart to the QTreeView
    list and the table view QTableView is called QTableWidget in the independent version.


    # 8.11.1 Items


    Each entry in these view widgets is an instance of an element or item. For each
    of the three widgets there are separate item classes that do not have a common
    parent class. This also means that the data in a view widget in each case cannot
    be used in the other two widget types without additional processing.


    In order that the classes remain lightweight, they do not inherit from QObject,
    and if they are not controlled by a view widget, they are therefore not part of
    the automatic QT memory management.


    The item classes are each named according to the widget to which they belong:
    QListWidgetItem is used as an entry in a list view, QTreeWidgetItem represents
    an entry in a tree view, and QTreeWidgetItem is responsible for displaying entries
    in a table.


    Each item has properties that can be selectively modified via its API. These can
    be compared with roles, which we will make distinctions in the data() method of
    QAbstractItemModel (see Table 8.1). The setFont() method allows another font to
    be used, so it corresponds to the Qt::FontRole, where setToolTip() corresponds
    to the Qt::ToolTipRole. The items are basically pointer-based so they must always
    be created on the heap.


