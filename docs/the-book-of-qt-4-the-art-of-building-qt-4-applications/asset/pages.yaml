    This must be reimplemented by A. The watched parameter allows events from monitored
    objects to be distinguished from one another, and e is the event to be processed.


    The return value tells the system of Qt how it should proceed with the event.
    If false is returned, it is forwarded to the monitored object, whereas causes
    it to be filtered out. This means that the event does not arrive at the object
    for which it was originally intended.


    Classes with event filters can change the behavior of any QObject-based objects
    in this way. This is of particular benefit if you do not want to reimplement a
    widget just to make a minor modification to its event processing.


