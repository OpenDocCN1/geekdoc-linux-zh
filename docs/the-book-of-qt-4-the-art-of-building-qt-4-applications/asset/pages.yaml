    # Selecting Existing Directories


    Some programs require a base directory for their operations. When prompting the
    user for this path, the application must prevent the user from specifying a file
    target. A photo-manipulating program, for example, cannot store its gallery beneath
    a file.


    To ensure that the user is shown only directories, you can call the file dialog
    class''s getExistingDirectory() method. This does not filter and displays only
    directories. Furthermore, it checks to see whether a specified directory really
    exists—the user or another application could have deleted it in the meantime.


    The following example queries the user for a directory, which the program intends
    to store all its photos in future. As the base directory we will use the home
    directory of the current user:


    ```

    QString directory = QFileDialog::getExistingDirectory(

    this,

    tr("Please pick the folder containing the photo gallery."),

    QDir::homePath());

    ```


    # Selecting a Filename


    If a user wants to save a file, this file usually does not exist. getFileName()
    tests whether the specified file exists, so is of no use for saving files. We
    require a new static method that meets the requirements of storage semantics.
    In Qt this function is called getSaveFileName(), and it is analogous in its arguments
    and in its return value to getFileName().


    The following example requires the user to select the name of a file to save data.
    Here, if the user selects the name of an already existing file, the program does
    not question this, which is thanks to the DontConfirmOverwrite flag. This can
    be useful, for example, if the program wants to investigate the state of affairs
    outside the dialog.


    ```

    QString file = QFileDialog::getSaveFileName(

    this,

    tr("Save As..."),

    QDir::homePath(),

    tr("Images (*.png *.xpm *.jpg)"),

    QFileDialog::DontConfirmOverwrite);

    ```


