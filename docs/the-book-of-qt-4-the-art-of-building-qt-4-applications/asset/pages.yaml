  md: 'Since Q_CHECK_PTR(), just like Q_ASSERT and Q_ASSERT_X, is only executed in
    debug mode, it is important that you don''t use it to carry out operations that
    may, under some circumstances, influence the normal running of a program. Such
    operations, also called *side effects*, can in particular cause the program to
    *only* work correctly in debug mode. For example, the following variation of our
    example will most likely crash in the release version:


    ```

    char *lotofmemory=

    _CHECK_PTR(lotofmemory= new char[1024+1024+1024]);

    ```


    This is because the pointer to the new memory area is never initialized in the
    release version. That means that any access to lotofmemory will then be invalid,
    which will cause the program to crash.


