  md: "Yes-No questions have one considerable disadvantage, however: The user needs\
    \ to read through the entire text and understand it. It is possible, especially\
    \ with complex user prompts, that the user will misunderstand the question and\
    \ decide on the wrong answer.\n\nThis drawback can be avoided to large extent\
    \ by following two basic principles: First, a question should never be formulated\
    \ in the negative. Words negate the meaning of a phrase or clause are generally\
    \ passed over in a quick reading: There is a high probability that questions such\
    \ as “Are you sure you do not want to overwrite the file?” will be misunderstood.\
    \ For the sake of better usability, such negated phrases should absolutely be\
    \ avoided in a GUI, even if they match the logic of the application code itself.\n\
    \nIn addition, users can be sure of their responses to a question instead of the\
    \ simple button labels Yes and No, they can read a descriptive text again emphasizes\
    \ the options described in the description text.\n\nQMessageBox provides programmatic\
    \ support for this paradigm of design: Trolltch has included another version of\
    \ the static method question() for this purpose. The second variant takes the\
    \ first three parameters as the one just described, but after there are differences.\n\
    \nInstead of three enumerator values, we now pass the strings that are to appear\
    \ on the buttons. If a button is not required, this is signaled with an empty\
    \ string, as shown in the following example (the sixth parameter). Finally, you\
    \ need to specify the buttons in turn that are “clicked” if the user operates\
    \ the (Enter or Esc) key; this is done with the final two parameters. The numbering\
    \ of the buttons corresponds to their position (in the code and in order of reading,\
    \ from the user's point of view), whereby 0 refers to the first button and 2 to\
    \ the third. The button with the Choose a different name (Figure 6.6) thus becomes\
    \ the default button with the code below—an additional feature that helps to prevent\
    \ the user from losing data by accident:\n\n```\nbool checkOverwrite(const QString\
    \ &filename) {\n    int status = QMessageBox::question(this,\n        tr(\"Overwrite\
    \ File?\"),\n        tr(\\<q>File %1</q> already exists.\"),\n        tr(\"Do\
    \ you want to overwrite the file or cancel?\").\\arg(filename),\n        tr(\"\
    Overwrite file\"), tr(\"Choose different name\"),\n        QString(), 1);\n\n\
    \    if (status == 1) {\n        return false;\n    }\n    return true;\n}\n```\n\
    \n> 5 The QString constructor called no arguments always makes a QString that\
    \ denotes the empty string."
