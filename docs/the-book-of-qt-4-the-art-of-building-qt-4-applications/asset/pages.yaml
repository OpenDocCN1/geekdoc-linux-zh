    If points are to be manipulated directly, the QImage, which is optimized for this
    purpose, is ideal as a "screen". Q carries out corresponding operations on the
    processor, whereas the graphic card is normally responsible for QPixmap operations.


    Under X11 in particular, another difference between the two classes is some significance:
    The X client is responsible for rendering QImages, whereas pixmaps are drawn by
    the server. Every conversion between classes is slow, and possibly bandwidth intensive,⁸
    but nevertheless generally possible with QPixmap::convertToImage() and QPixmap::convertFromImage().
    An advantage of QImage is its platform independence, a property that QPixmap does
    not.


    If a program should only be based on QApplication, but should still process graphics,
    QPixmap is not available, but it is still possible to work with QImage.⁹


    # 10.7.1 Storage Formats, Transparency, and Color Palettes


    A QImage is capable of storing images in various ways in the main memory. The
    developer can specify the image format when calling the class constructor by passing
    the matching value of the QFormat enumerator. The format() method returns the
    format of the current QImage.


    Normal Qt stores images in a quality requiring 32 bits for each pixel. In doing
    this, QImage uses 8 bits for the colors red, green, and blue, so that only 24
    bits are used. The remaining eight remains unused.¹⁰ or specifies the "transparency"
    (the alpha channel) of each pixel. The format is specified using QImage::Format_RGB32,
    where the format with the predefined transparency is verified by Troltch as ARGB32
    (QImage::Format_ARGB32).


    It is relatively resource intensive to use an alpha channel when drawing, a series
    of calculations must precede each drawing operation: For each pixel, the processor
    multiplies each color channel with the value of the alpha channel, and divides
    the result by 255. The obvious consideration, performing these calculations when
    the pixel is set and saving the results in the color values, has been put into
    practice by Troltech with the ARGB32-Premultiplied format (QImage::Format_ARGB32_Premultiplied).
    Here the alpha channel is still stored as an additional value. The disadvantage
    of this format is when the alpha channel is recalculated, this does not result
    in the same color. Since the deviation is very small, it can often be ignored.
    However, if you constantly con-


