  md: '# 3.4 Including Derived Classes in the Designer


    # 3.4 Including Derived Classes in the Designer


    It is sometimes necessary to make minor modifications to a Qt widget. In such
    cases you can no longer use the Designer without registering the new widget there
    as a so-called *custom widget*, which involves a fair amount of work.9


    To be able to use such a widget in the Designer, you select its Qt base widget
    in the Designer and click it with the right button after it has adjusted. From
    the context menu, you now select the entry Promote to Custom Widget. In the dialog
    that appears [see Figure 3.13] you specify the name of the new class and of its
    header file. Although the Designer continues to show the original Qt widget, the
    finished program uses the modified widget; so in the implementation you obtain
    a pointer to an object of the inherited widget.


    ![](img/b663c93885d7333a091a433460ee647f_100_0.png)


    To undo such a promotion, the entry Demote to **base class** can be found at the
    same position in the context menu.


    For more complex modifications, as fundamental changes to the layout behavior
    or adding properties, this procedure is not suitable, however, since the Designer
    does not take them into account.


    # 3.5 The Resource Editor


    From Qt 4.1 on, the Designer supports the setting up and administration of the
    resources already discussed on page 57. The editor integrated in this (Figure
    3.14) can be called from the entry Tools ➜ Resource Editor, in case it is not
    already visible. Navigating in it takes getting used to, however. The drop-box
    next to the New and Open entries shows a list of already opened resource files.
    It does not include a save action, as this is performed implicitly by the editor.


    > 9 Notes on this are provided in the online documentation for Qt.'
