  md: "# 8.9 Your Delegates\n\nAs the processing widget we display a combo box, which\
    \ can be edited like a line edit, and in addition it should be able to perform\
    \ tab completion. We use the parent pointer as the father for the constructor;\
    \ as a result, we and not the delegate, controls the widget.\n\nTo fill the combo\
    \ box with data, it is sufficient to pass the combo box the current model, because\
    \ QComboBox, although not an official view, can handle the QAbstractModel-based\
    \ models as a source. Just as with QListView, here we must also specify the column\
    \ for the model from which the selection box should look, using setModel(Column()).\n\
    \nThe cost_cast is necessary because we are in a cost method and our model pointer\
    \ is a cost pointer. This means that we prevent any write operations to the model.\
    \ In addition we must ensure that certain keys, such as the Enter or Esc, will\
    \ close the editor and signal to the delegate that it would write the data back\
    \ to the model.\n\nThis is done by the event filter we install on the combo box.\
    \ It diverts all keystrokes to the delegate. Now we would have to overwrite the\
    \ eventFilter() method to intercept the keystrokes. In practice, however, QComboBox\
    \ has such an event in the private area (that is, internally hidden) QComboBoxPrivateContainer\
    \ class which is undocumented, however.\n\nThis means that in theory, the filter\
    \ may appear in any new Qt. If we want to be complete, you should write your own\
