  md: '# B.2.2 Linked List (QLinkedList)


    If you frequently need to insert elements into large data collections, you are
    better

    off with a QLinkedList (see Figures B.1 and B.2). This class is implemented as
    a

    linked list. It has the disadvantage, however, access to large lists by means
    of

    the index operator or at() can become very slow. This is explained by the way

    linked list works: Each element contains a pointer to the next one, and therefore

    in order to access the element with a specified index, the container must visit
    all

    elements from the first one to the one sought.


    Figure B.1:

    To insert an element

    to a linked list, only

    one pointer (the

    longer line) needs to

    be moved to the new

    element ...


    ![](img/b663c93885d7333a091a433460ee647f_402_0.png)


    Figure B.2:

    ... and another

    pointer is added, that

    points from the new

    element to the one

    that followed until

    now.


    ![](img/b663c93885d7333a091a433460ee647f_402_1.png)


    # B.2.3 Vectors (QVector)


    QVector is particularly suitable if you need contiguous memory. If needed, space

    for new data elements is only allocated immediately after the existing memory.

    The class ensures that the data always lies adjacent in memory. The data())

    method makes use of this fact: It provides an array of the same data type as the

    one used to declare the vector.


    Figure B.3:

    QVector provides a

    dynamic array, like

    std::vector.


    | | | | | | |


    A vector behaves like a array: Internally, the data structure always reserves

    slight more memory than currently required, which is why append operations at

    the end of the vector are very fast (Figure B.3).'
