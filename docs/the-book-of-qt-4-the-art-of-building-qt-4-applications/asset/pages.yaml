    Box layouts have an additional property which we have so far ignored, the-called
    stretch factor. If this does not equal 0, it determines the proportional space
    occupied by the widget in the overall layout, in the direction of the box layout.
    This assumes, of course, that the widget is interested in spreading out in this
    particular direction. It does not make any sense for a button, for to stretch
    vertically above the height or below the depth of the text or the icon that it
    displays.


    If this should still be necessary, however, the size policy can be adjusted using
    sizePolicy(). The method expects two parameters here from the QSizePolicy::Policy
    enumerator (see Table 5.1), which define the size guidelines for the horizontal
    and vertical stretches.


    | Value | Meaning |

    |---|---|

    | QSizePolicy::Fixed | The widget may never have a size other than sizeHint().\nsizeHint()
    is the smallest acceptable size for the widget, but the widget may be enlarged
    as much as you want.\n| QSizePolicy::Minimum | sizeHint() is the largest acceptable
    size for the widget, but the widget may be reduced in size as much as you want.

    | QSizePolicy::Preferred | sizeHint() is the optimal size, for the widget, but
    the widget may be larger or smaller than this value (default for QWidget).\n|
    QSizePolicy::Expanding | As Preferred, but the widget demands any available space
    in the layout.\n| QSizePolicy::MinimumExpanding | As Minimum, but the widget absolutely
    demands any available space in the layout.\n| QSizePolicy::Ignored | Ignore sizeHint()–the
