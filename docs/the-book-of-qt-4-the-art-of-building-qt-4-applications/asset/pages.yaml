    In general there are two ways of rectifying the lack of icons. First we select
    the appropriate action in the Action Editor. Its properties now appear in the
    Property Editor. We are interested in the icon property, and we select the Open
    icon in the value column. The dialog now allows us to choose whether we want to
    search for an icon from a resource (see page 99) or use an image file directly
    from the filesystem.


    For our example, we copy the items from the Crystal Icons series by KDE 3 and
    combine them into a resource, using the Resource Editor in the Designer. For each
    action we can now select a matching icon. We save the resource file in the same
    directory as the .ui file.


    ![](img/b663c93885d7333a091a433460ee647f_110_0.png)


    Figure 4.5: The toolbar provides quick access to important actions.


    To add a new toolbar, we move the mouse cursor to the status bar at the bottom
    of the window and select Add Tool Bar from the context menu. We now drag the actions
    New, Open, and Save from the Action Editor into the bar that now appears.


    Cut, copy and paste are also frequently used actions in editors. If you want to
    include them in the same toolbar, as is the case in Figure 4.5, you should separate
    them from the other in the File menu with a separator (right mouse button→Insert
    Separator).


    Actions have other properties that the Property Editor allows to be set. These
    include the application-wide shortcut (the so-called shortcut). In contrast to
    accelerators, shortcuts are activated with the Ctrl key. The user can often get
    to the action he wants more quickly with shortcuts than with accelerators.'
