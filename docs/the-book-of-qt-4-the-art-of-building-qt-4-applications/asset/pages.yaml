    # 9.5 Transactions


    Not all database systems support transactions, which combine several SQL operations
    into an atomic operation. To help the Qt programmer keep the code portable, QSqlDriver
    can therefore be asked about its transaction capabilities with hasFeature().


    ```

    if (db.driver()->hasFeature(QSqlDriver::Transactions)) ...;

    ```


    If the driver supports transactions, you can introduce them with the QDatabase
    method handler(). If all operations are completed, the transaction is closed with
    commit(). If an error occurs, rollback() undoes all of the current transaction.


    # 9.6 Embedded Databases


    Qt''s SQLite driver enables data to be stored in a relational database and queried,
    without an external database server. There are restrictions, of course, but the
    demands made of embedded databases are usually less severe than for databases
    residing on dedicated servers, and SQLite is intended for just such situations.
    This means SQLite cannot handle stored procedures and does not scale as well as
    its big brothers. It is well suited, however, to applications that need a basic
    relational data store. A perfect example is a KDE music player Amarok, which stores
    metadata about pieces of music in a SQLite database.


    To open a connection to a SQLite database, you only need to specify a database
    name. The SQLite driver expects a filename in this case:


    ```

    QSqlDatabase db = QSqlDatabase::addDatabase("SQLITE");

    d.setDatabaseName("firma.db");

    ```'
