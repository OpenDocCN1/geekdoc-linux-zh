  md: '# 4.6 How Do Actions Work?


    # 4.6.1 How to Instantiate QAction Manually


    We do not have to use the Designer every time, of course, to create QAction objects.
    The following example demonstrates how you can create actions yourself in the
    constructor of a QMainWindow subclass.


    First we instantiate the desired action with an icon and name, and assign it to
    the main window as a parent. The QIcon() class encapsulates an icon:


    ```

    QAction *action_open;

    action_open = new QAction(QIcon(":/pics/fileopen.png"), tr("&Open"), this);

    action_open->setShortcut(tr("Ctrl+O"));

    action_open->setStatus(tr("Opens an existing file."));

    ```


    In contrast to QPixmap, an action can take in images for various states (normal,
    active, and gray out) and states (selected or not selected). If the class contains
    just one-image—in this case—it tries to calculate the icons for the other states
    and stages from the icon specified.


    By means of setShortcut we can set the corresponding key binding as a string.
    Together with the translation function tr(), this has the advantage that the translators
    can select an appropriate shortcut for the Open action in the respect language.
    setStatus() sets the text that appears in the status bar if the mouse is held
    over the action.


    To integrate actions into the menu bar, the following code suffices:


    ```

    menuBar() ->addAction(action_open);

    ```


    menuBar(), a method of QMainWindow returns the windows menu bar. The procedure
    just shown is rather unusual, however. Normally menus are first inserted into
    the menu bar, and then the actions are integrated. The QMenu instance to be generated
    by the addMenu() Factory Method. We insert the Open action into this as follows:


    ```

    QMenu *menu_Datei = menuBar() ->addMenu(tr("&File"));

    menu_Datei->addAction(action_open);

    ```


    For actions that are used as information carriers for various widgets simultaneously,
    you should properly think about the parenthood in the object model of Qt. The
    main window, as the father of all other widgets, is always the last to be deleted.
    So that Qt will delete actions as late as possible, it is best to turn them into
    direct descendants of the main window.


    If actions are used in several windows simultaneously, there are basically two
    alternatives: Either you duplicate all actions for each window, or you turn them
    into children of QApplication. In this case you can simply pass qApp as a parent
    to the QAction constructor.


    127'
