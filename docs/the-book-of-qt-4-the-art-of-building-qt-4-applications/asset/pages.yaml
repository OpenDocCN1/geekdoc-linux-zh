    it is worth taking a look at a property concept of Qt.


    # 3.1.2 The Property Editor


    QObject-based classes have special properties that can be set withProperty() and
    queried using property(). Examples of user interface information that can be represented
    by properties include size, labeling, formatting details, help texts, and many
    other things.


    ![](img/b663c93885d7333a091a433460ee647f_86_0.png)


    This is shown in the Property Editor (Figure 3.5). It lists the changeable properties,
    arranged by the class in which each property was first implemented—either the
    class itself, or one of its parents. A QLabel inherits from the QFrame class,
    which is a descendant of QWidget; accordingly, one can get and not only one label''s
    QLabel-specific properties such as the labeling text (text property), but also
    its QFrame properties such as the frameShape and its QWidget properties with the
    size (geometry).


    Since all widgets inherit from QObject, you can always get and the QObject propertyName,
    which provides an internal description and should not be confused with a label
    to be displayed on the widget in the user interface—for example, the text on a
    label or button (which is specified with the text property). The name of the object
    variable and others are derived from objectName.


    Since we don''t want to change the labels derived in the code we are going to
    write later, their variable names play no further. That is why we continue using
    the object generated by the Designer.


    > 1 Labels are normally without frames, which is frameShape is set to QFrame::None
    by default.'
