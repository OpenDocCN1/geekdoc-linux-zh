    you can download a complete archive with all the examples described in the book.
    The file, as well as other hints and link recommendations, is available at the
    website for the book:


    http://www.qt4-book.com/


    This book is aimed at beginners and is not intended to be a reference. The excellent
    online documentation—which can be called via the Qt Assistant incorporated in
    the distribution or online at http://doc.ttech.com/—provides a detailed API documentation
    on all the classes introduced here, and would be hard to beat.


    Instead, be book aims to explain contexts and basic techniques by the use of examples,
