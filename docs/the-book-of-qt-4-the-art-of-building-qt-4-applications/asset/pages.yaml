    \    int chars = text.length();\n    text = text.simplified();\n    int words\
    \ = 0;\n    words = text.count(\" *\");\n    if (!text.isEmpty()) words++;\n \
    \   QString output = tr(\"Characters: %1, Words: %2\").arg(chars).arg(words);\n\
    \    statusBar->setText(output);\n}\n```\n\nEach QEdit possesses exactly one document,\
    \ which is encapsulated in the QEditDocument class. What at first glance just\
    \ seems to be an implementation detail is, in reality, a very powerful tool for\
    \ displaying and manipulating the text. But here we use one method to access the\
    \ current text of the document: With the call document()->PlainText(), QEditDocument\
    \ generates a QString from its currently saved text, which is more than enough\
    \ for our relatively simple analysis.\n\nThis searches for individual words and\
    \ characters. To count the characters, we query its length, taking into account\
    \ that line breaks are counted as spaces. If you don't want that, you can remove\
    \ the line breaks from the string using text.replace(\"\\n\", \" \");\n\nWhen\
    \ determining the number of words in the text, we also do not need a more complex\
    \ parser, since our statistics are relatively simple (and even so be quite slow,\
    \ depending on the text length); It defines a word as a string separated by a\
