  md: '# Foreword to the English Edition


    We need an object-oriented display system,” Haavard Nord said, as the two of us
    sat on a park bench in the summer sun outside the regional hospital in Trondheim,
    Norway, in the summer of 1991.


    Huh, what''s that?” was my response.


    Haavard went on to sketch what seemed like an obvious idea at the time. A C++
    library of user interface components, or widgets, that would have the same API
    on all platforms.


    And we refused to compromise. We designed, redesigned, and threw away lots of
    code until we felt it just right. If a use case could be solved by one line of
    code and still be easy to read a year after you had written the code (both are
    important), we would ditch the current design and redo what had to be redone.


    Today Trolltech has almost 250 employees and is a public company listed on the
    Oslo stock exchange. But still, that passion for making the best possible developer
    tools are evident in the hallways of our offices.


    Haavard and I have left the control of Qt''s destiny to much more capable programmers
    than ourselves. And I have to say they are doing an extraordinary job at it. Qt
    has developed into an exceptionally beautiful piece of software.


    Today Matthias Ettrich (KDE founder) and Lars Knoll (of HTML fame) lead the team
    of developers responsible for keeping Qt the kick-ass product you expect from
    Trolltech.


    ![](img/b663c93885d7333a091a433460ee647f_16_0.png)'
  merge: -1
  pgno: 16
- img_proc: true
  md: '# Foreword to the English Edition


    Qt 4 is more or less a total rewrite of Qt. And I know one of the parts Trolltech
    developers are especially proud of the new painting engine in Qt 4. It is called
    Arthur the paint engine, after "Thomas the Tank Engine,"¹ and it is the paint
    engine that could! Arthur has developed into a state-of-the-art painting engine
    that makes it possible to create all the eye-catching visual effects users have
    come to. And once you have created your breathtaking souffle, recompiling it will
    run on all platforms supported by Qt.


    From the first version of Qt released back in May 1995, Trolltech has been using
    a dual-licensing business model with a free version of Qt available for free and
    open source software. The first toe in the water then was a binary-only version
    for development of free software under Linux only. This was quickly followed by
    a free version containing the source code. Today, Qt is available both a standard
    commercial license and under the GPL (General Public License) on all platforms.


    What this means in practice is that if you want to donate your work on Qt to the
    community at least by licensing your work under the GPL, then go ahead and use
    our product for free. You can even modify and redistribute Qt under the terms
    of the GPL, no strings attached. If, on the other hand, you want to keep your
    software on proprietary and do not want to license your code under the GPL, then
    you also have an option. You can purchase Qt under a standard commercial license
    from Trolltech and you can license your code any way you want, no strings attached.


    Qt is an open source product with a thriving community and at the same time a
    commercial product with the backing of a public company with a strong developer,
    support, and documentation muscle. It is really the best of both worlds.


    And it is because of the feedback from the thousands of users out there, both
    commercial and open source developers, that Qt is such a high-quality toolkit.
    We rely on and listen closely to all the feedback we receive on Qt. So if you
    find something you think can be improved in Qt or simply have a bug to report,
    do not hesitate to let us know, e.g., by sending an email to qt-bugs@trolltech.com.
    We have a team of eager engineers waiting to hear from you.


    Well, I guess have brought enough about Qt now. The real proof is in the pudding.
