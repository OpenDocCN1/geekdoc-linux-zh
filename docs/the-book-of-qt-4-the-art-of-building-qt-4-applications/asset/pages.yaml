  md: "# Basics, Tools, and First Code\n\nFigure 1.2 is created with the following\
    \ source code:\n\n```\n// layout/main.cpp\n\n#include <QApplication>\n#include\
    \ <QVBoxLayout>\n#include <QLabel>\n\nint main(int argc, char *argv[])\n{\n  \
    \  QApplication a(argc, argv);\n\n    QWidget window;\n\n    QVBoxLayout* layout\
    \ = new QVBoxLayout(&window);\n    QLabel* label1 = new QLabel(\"One\");\n   \
    \ QLabel* label2 = new QLabel(\"Two\");\n\n    layout->addWidget(label1);\n  \
    \  layout->addWidget(label2);\n\n    window.show();\n\n    return a.exec();\n\
    ```\n\nIn addition to the QApplication and QLabel classes already used in Section\
    \ 1.1, we now include a class, QVBoxLayout, that is used to arrange widgets vertically—the\
    \ \"V\" in the name stands for vertical. This time, instead of the QLabel object,\
    \ there is a simple QWidget object for the main window of the application, which\
    \ we call window. Use of this variable name is just a convention. The object only\
    \ becomes a separate window after two steps. First, the QWidget constructor is\
    \ called. If no arguments are supplied, in this case, the object has no parent\
    \ widget and thus itself forms the root of an object hierarchy. Second, a widget\
    \ becomes a window only when it is displayed using its show() method.\n\nAfter\
    \ creating the QWidget, we create a QVBoxLayout object. The reason why the new\
    \ operator is used instead of\n\n```\nQVBoxLayout* mainLayout(&window);\n```\n\
    \nis explained in the following Section 1.2.2. So that the new QVBoxLayout will\
    \ know that it is responsible for the layout of window, its constructor gives\
    \ a pointer to this QWidget object as an argument.\n\nSimilarly, the two QLabel\
    \ objects with the texts One and Two are created. In order for these to be managed\
    \ by the layout object, we add them to the QVBoxLayout object with the QVBoxLayout\
    \ function addWidget()."
