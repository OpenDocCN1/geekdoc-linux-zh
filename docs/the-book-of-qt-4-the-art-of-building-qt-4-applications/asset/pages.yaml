    Fortunately QMimeData already includes its own encoding methods for the most important
    data types, such as for color, HTML, reformatted text, and URLs. The following
    code is therefore sufficient to encode an image:


    ```

    QMimeData* prepareImageDrag(const QString& path)

    {

    QImage image(path);\QMimeData *mimeData = new QMimeData;

    MimeData->setData(image);

    return mimeData;

    }

    ```


    Qt makes the image available in different formats with setImageData().QMimeData
    can save multiple MIME types with their data in one object. When dragging, Qt
    offers all supported image formats, but it has a preference for PNG here, since
    this displays the best quality. The program that receives the drop iterates through
    the list of MIME types and selects the data for the first MIME type that it can
    handle.


    We make use of this property to include the path specification for the image:
    We pack it into a QUrl object, which converts it into an RFC-compliant URL, and
    also include the normalized path specification as a text:


    ```

    // draglabel/draglabel.cpp


    #include <Qt>

    \QMimeData*prepareImageDrag(const QString& path )

    {

    QImage pic( path);\QMimeData *mimeData = new QMimeData;

    MimeData->setData(pic );

    QList<QUrl> urls;

    QUrl imageUrl( path );

    urls.append(imageUrl);

    MimeData->setUrls(urls);

    MimeData->setText(imageUrl.path());

    return mimeData;

    }

    ```


    We intentionally do not use the path variable here directly: If we passed a relative
    path, this could become a problem with drag and drop between applications with
    different working directories. QUrl, however, resolves relative paths.'
