  md: 'grammar. Such events are also based on QEvent and are processed by the event
    loop.


    Each QEvent has a type. Subclasses of QEvent can contain arbitrary amounts of
    information; for example, QMouseEvent handles messages about buttons clicked and
    the position of the mouse cursor.


    Qt passes events via CoreApplication::postEvents() specifically to certain objects.
    These objects must inherit from QObject. The method expects the receiving object
    as the first parameter, followed by a QEvent.


    To deliver it, postEvent() passes the event to the event() method of the target.
    The task of the event is either process or ignore the events, depending on the
    requirements of the class of the receiving object. This is therefore also referred
    to as an event handler. If an event cannot be processed immediately by the receiver,
    the event is put into a queue and scheduled for delivery. If another part of the
    application blocks the application by executing a synchronous long-winding operation,
    the queue cannot be processed by the event loop during that time. User can easily
    confuse this behavior with an application "crashing".


    The standard implementation of event() calls a virtual method for the most important
    event handlers, which already used the matching QEvent subclass as a parameter.
    This allows us to save code. We will now take a closer look at how this works.


