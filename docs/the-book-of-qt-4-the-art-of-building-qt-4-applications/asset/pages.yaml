    # 3.1.6 Shortcuts and Buddies


    Those who prefer keyboard control will thank you if they can jump directly to
    as many common widgets as possible. GUI elements that display a user-defined text,
    such as buttons, are assigned a key abbreviation by placing an ampersand (&) before
    the character that will serve as the keyboard shortcut. The text itself contains
    a real ampersand, is masked by duplicating it: &&.


    If the user presses the combination of (Alt+character) now on, the widget obtains
    the focus and is activated. In Figure 3.12 we use this technique with the Qt button.


    QLabel objects form an exception, however. Since they usually occur in a layout
    for the purpose of describing an adjacent "partner" widget, they themselves do
    not accept focus. However, the Buddy property of a label can be used to specify
    a keyboard shortcut to be associated with the partner widget, though the descriptive
    text of the label was directly attached to the partner element itself.


