    To keep the size of the dialog flexible, we could replace the fixedSize() call
    with the resize() method, which also expects two parameters or a QSize parameter.
    This only adjusts the size, and does not fix it. The user can now change the dimensions
    of the dialog with the mouse, although the widgets that it retain their dimensions.


    Alternatively, you could reimplement the QWidget method sizeEvent(): Qt always
    invokes this method when the size and positions of the window elements change
    each resize event. You could write code to compute the new sizes and positions
    yourself. But this procedure is much too complex in many cases, and also requires
    manual calculation of the weights²


    In addition, reimplement sizeEvent() poses a particular problem in combination
    with internationalization: With localized software, the dimensions of a labeled
    widget may depend on the language in which it is displayed. A button called Close
    in English has a much longer label in the German translation (Schließen), and
    the text will be cut off unless special precautionary measures are taken.


    Ultimately, we can only patch the symptoms in this way. To actually solve the
    underlying problem, we can avoid using automatic layout.


    # 5.2 Automatic Layout


    The QLayout class and specialized layouts derived from it help the developer to
    position widgets dynamically. For this success, each graphic element derived from
    QWidget has a sizeHint() method, which returns how much space the widget would
