  md: '# Foreword to the German Edition


    Traditionally, getting applications to look "just right" on different operating
    systems and platforms has been the stuff of nightmares for programmers. Applications
    on Microsoft Windows look and feel different to those on Mac OS X, which in turn
    are different for using Linux platforms. Applications written for Linux behave
    differently on the various free desktop environments available, and much the same
    can be of the various flavors of Windows.


    While it is relatively easy to write code that works on all of these platforms,
    such code is either likely to feel alien on all but the one platform it was originally
    designed-for, or it doesn''t provide features that users expect to find in modern
    applications.


    The most difficult part of Qt to get right, and also the most visible, is the
    graphical interface (GUI). The foundation for any GUI is the technology used to
    render the interface, and Qt contains its own technology for this purpose—namely
    "Arthur the Paint Engine" Partly inspired by "Thomas the Tank Engine", Arthur
    has come a long way in recent years. Its story is a good example of how Qt developed
    to empower users to provide feedback and support to solve problems they encounter.


    Arthur began with such a simple problem: Many Qt users use OpenGL in their software,
    and increasingly wanted to be able to choose drawing with OpenGL and conventional
    widgets, but use the same programming interface (API) for both. We wanted to provide
    this ability with Qt 4. Easier said than one! The old paint device architecture,
    10 years old when we started, could not cope with this change, and so a little
    refactoring was necessary before Arthur could see the light of day. In the first
    Technology Preview of Qt 4, we were able to draw graphics not only with OpenGL,
    but also on the relatively new GDI+ on Windows, with both anti-aliasing and linear
    gradients.'
