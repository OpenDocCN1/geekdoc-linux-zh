    "Hello, world!. To rectify this shortcoming we replace the line


    ```

    QLabel label("Hello, world!");

    ```


    with


    ```

    QLabel label(QApplication::translate("MyLabel", "Hello, world!"));

    ```


    The function QApplication::translate() takes as the first argument a context label
    for the text, whereas the QObject::tr() function the class name of the widget
    in question is automatically used as the context label.¹⁵ If, for example, you
    call tr() for a QLabel object, Qt automatically uses the context name QLabel.
    This is possible because QLabel is derived from QObject as the base class and
    therefore inherits the tr().


    The context label is important because the same text may appear in several places,
    with different meanings. If the target language uses distinct terms for these
    variations, the appropriate translations for the instances of original text will
    depend on the context. For example, the English Qt object may occur in one dialog
    with the meaning *open*, but in another dialog with the meaning *open connection*;
    the German version of the program should render the first instance as *Öffen*
    and the second as *Aufbauen*. When the two instances are different context labels,
    Qt can distinguish them.


    You should send all text in your program through the tr() or translate() function.
    You will find that the program can generally be translated without great difficulty
    when it is during code development, and it is very tedious to go through the entire
    source text of a large program and add tr() or translate() calls once the coding
    is finished. The example programs in the remainder of this book will use tr()
    right from the beginning.


