  md: 'The following Qt assertion instruction, for example, checks whether the program
    was given one or more arguments:


    ```

    Q_ASSERT(argc > 1);

    ```


    If this is included in the main() function in line 12 of the file main.cpp, the
    program will output the following to the command line if there is an error:


    ```

    ASSERT: ''argc > 1'' in file main.cpp, line 12

    ```


    If we compiled the program in debug mode, the program will then terminate. In
    addition to reporting filenames and line numbers, it is often also useful to specify
    a context that provides information on the purpose of the assertion. Qt has the
    macro Q_ASSERT_X(..) for this purpose:


    ```

    Q_ASSERT_X(argc > 1, "main()", "No arguments passed!");

    ```


    This makes the program considerably more verbose and specifies the context for
    the assertion:


    ```

    ASSERT failure in main(): ''No arguments passed!"

    file main.cpp, line 12.

    ```


    # A.2.2 Checking Pointers


    Unpleasant surprises can often wait in store for developers of portable programs,
    particularly when you need to allocate large amounts of memory or to refer a pointer
    across library boundaries. Let''s look at the following example:


    ```

    char *lots_of_memory = new char[1024+1024+1024];

    Q_CHECK_PTR(lots_of_memory);

    ```


    If a pointer allocation goes wrong, new sets the pointer to the value 0 (the null
    pointer). In this case, the Q_CHECK_PTR() macro used here reacts with an error
    message as shown below, and terminates the program:


    ```

    main.cpp, line 14: Out of memory

    ```


    If you use this macro whenever you require large amounts of memory, you will save
    a great deal of work searching for the cases of memory bottlenecks. This is of
    immense importance particularly in porting to architectures with little main memory.'
