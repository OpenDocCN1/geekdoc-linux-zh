    # 5.3.5 Layout for Languages Written from Right to Left


    The way in which texts in some languages, such as Hebrew, are radically different
    from European languages in one respect: they are read from right to left, and
    this must also be accounted for by software applications. For such texts, it is
    not the left, but the right edge of the screen is the starting point for the eye
    reading. A toolkit must be able to invert the layout horizontally. The KDE browser
    Konqueror in Figure 5.7 measures this task correctly, because Qt manages to manage
    all layouts horizontally, largely without the help of the user, if the language
    configured is oriented from right to left, or if the program is passed the -reverse
    option. The Qt-internal equivalent for this option is the QApplicationsetLayoutDirection(Qt::RightToLeft)
    call. This program option is mainly used for test purposes.


    In the development of your layouts and widgets, you must always make sure your
    provisions in inverted layout is used. This no longer works correctly in the case
    of a right-to-left configuration: It still collapses the widget to the left of
    the splitter, although the widget that should collapse now on the right side.


