  md: '# Introduction


    This book is based on the open source edition of Qt, but it can also be used without
    problem by those who have purchased the commercial version. The embedded version
    of Qt (Qtopia Core) is not covered in the book, because although the API is identical,
    apart from a few extra classes, there are many items to be noted in embedded development
    that a separate book would be needed to describe them all.


    # Target Audience and Prerequisites


    It is difficult to define a target audience for Qt programming because the areas
    of application for Qt are almost limitless. In general, however, it is aimed at
    all those who wish to have platform-independent results in a machine-oriented
    high-level language as C++, results that can be compiled into native code, not
    least for reasons of performance.


    The book assumes that you have a fundamental knowledge of C++. An interested reader
    should be familiar with the concepts of pointers and templates. The book also
    assumes that you know about things such as the overloading of operators.


    Knowledge of the Standard Template Library (STL) in particular is not expected.
    Qt provides its own classes for the most common algorithms and containers, which
    are explained in Appendix B.


    # Structure of the Book


    The book first explains the basic structure of the Qt toolkit, together with its
    most important specific properties. The subsequent chapters concentrate on writing
    your small applications. All other technologies, presented in the final chapters,
    are demonstrated as short, independent examples for the sake of clarity. But they
    are arranged in such a way that there should be no problem to use them in a real
    program at the correct position.


    Nearly all of the examples printed in this book are based on a complete compilable
    program. These examples begin with the name of the quoted source text in C++ comments,
    such as


    ```

    // program_name/file_name.cpp

    ```


    For a better understanding, explanations are often added between code segments,
    so that the code is interrupted in such cases, it is also marked as a comment:


    ```

    // program_name/file_name.cpp (continued)

    ```'
