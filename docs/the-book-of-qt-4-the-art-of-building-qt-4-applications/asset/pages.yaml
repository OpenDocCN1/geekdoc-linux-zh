    the user, expecting a dialog, will not see the input widget.


    # 6.3 Semi-modal Dialogs


    A separate category of dialog is represented by the semi-modal dialogs. The term³
    is based on the fact that they are displayed, like non-modal dialogs, via show().
    The application program continues running. however, these dialogs are meant to
    be used in a modal fashion: The user should not continue working in the application,
    but in all cases turn their attention to the dialog. To enforce such a modal interaction,
    you must call setColor(true)⁴ before calling show().


    # 6.4 Avoiding Bloated Dialogs


    A user-friendly dialog does not overwhelm users with options. It is much more
    sensible to use reasonable settings and to present the user only choices for which
    he really needs make a decision. He should be shown options only if he explicitly
    demands to see them. This usability requirement can be set using QDialog API extensions.


    Figure 6.1:

    Example of the use of extensions: The Run dialog of KDE usually looks neat and
    tidy.


    ![](img/b663c93885d7333a091a433460ee647f_165_0.png)


    These provide a good service, for example in KDE Run dialog. This dialog allows
    to use type URLs or program names, and tries to display the web page or start
    the correct program (Figure 6.1), as appropriate.


