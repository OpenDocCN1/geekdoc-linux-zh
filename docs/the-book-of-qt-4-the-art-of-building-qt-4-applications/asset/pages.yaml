  md: '# 9.2 Selecting the Appropriate Driver


    continued


    | Driver name | Database system |

    | QPSQL | PostgreSQL (version 7.3 and newer) |

    | QSQLITE | SQLite (version 2) |

    | QSQLITE | SQLite (version 3) |

    | QTDS | Sybase Adaptive Server7 |


    If the Qt version originates from packages of Linux distribution, you may need
    to install additional packages. Ubuntu stores the SQL library in the package libqt4-sql,
    whereas OpenSUSE, in addition to installing qt-sql, requires DBMS-specific database
    package, such as qt-sql-mysql for MySQL.


    If you build Qt from the sources, you should take a look at the output of /configure
    --help:


    +   - Istring Add an explicit include path.

    - qt-sql-<driver> Enable a SQL <driver> in the Qt Library, by default none are
    turned on.

    - plugin-sql-<driver> Enable a SQL <driver> as a plugin to be linked at run time.

    - no-sql-<driver> Disable SQL <driver> entirely.


    > Possible values for <driver>:

    [ db2 base mysql oci odbc postgresql sqlite2 tds ]


    > Auto-Detected on this system:

    [ sqlite ]


    By default Qt builds the driver modules as plugins for all systems automatically—in
    this case if you do not want to compile one of these explicitly, the no-sql-driver
    switch is used; for example, in the case of SQLite the switch would be -no-sql-driver
    Qt also includes its own SQLite version. If you want to use a version of SQLite
    installed on the system instead, you must also specify the -system-sqlite switch.


    If /configure cannot find an installed database system, despite the development
    packages installed, then you can include the directory of the database system
    with the -l switch, for example -l/usr/include/mysql, in the case of MySQL. It
    is left to each user to decide whether a driver is built separately as a plugin
    (-plugin-sql-driver) or compiled permanently into the library (-qt-sql-driver).
    Plugins are more flexible, whereas compiled-in drivers are simpler to handle if
    the Qt library is to be included in the program.


