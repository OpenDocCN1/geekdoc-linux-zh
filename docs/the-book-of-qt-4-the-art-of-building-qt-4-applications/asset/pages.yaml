    \ the XML structure, and its elements are without exception DOM nodes (QDomNodes)\n\
    \nQDomNodes know the principle of parenthood: If they are inserted in another\
    \ part of the tree, they are not copied, but change their location in the tree.\
    \ The node into which a QDomNode is inserted now functions as its new parent node.\
    \ Every node may possess child nodes; if you try, for example, to give a child\
