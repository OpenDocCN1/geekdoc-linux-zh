    # # Developing a GUI Application Based on a Main Window


    In the following section we will develop an application step by step, one which
    displays all the typical features of a genuine graphical application and which
    also performs a useful task: a small text editor called *CuteEdit*.


    We design its *main window* using the Designer, which allows the basic graphical
    framework of most applications to be put together by "mouse click" in Qt versions
    4.1 and later. The basis of this is the `QMainWindow` class.


    # ## 4.1 The Anatomy of the Main Window


    The `QMainWindow` class forms the basis of an application window: Menu bar, status
    bar, toolbars, and dock windows can be brought into this main window. Figure 4.1
    shows the individual components. The *central widget* provides the workspace for
    the user.'
