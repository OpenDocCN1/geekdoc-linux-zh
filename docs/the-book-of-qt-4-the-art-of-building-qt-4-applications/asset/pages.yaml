    # 4.8 Saving Preferences


    Last but not least, our program should be able to keep the settings made by the
    user, even after the program is restarted. To this end, different conventions
    have become established on different operating systems.


    Depending on the pattern, application data may be stored in the Windows Registry
    (in the user scope HKEY_LOCAL_MACHINE(Software) or in the system scope HKEY_CURRENT_USER)(Software,
    in an XML-based plist file under Mac OS, or in /etc/xdg (system-wide (user-defined
    settings))) under Unix.


    Qt encapsulates all these configuration storage systems with the help of the QSettings
    class. Every filing system in this is a backend. QSettings objects can be created
    on the heap or on the stack. Since little work is needed to instantiate them,
    we recommend that you create them on the stack, if this is necessary.


    In two or more QSettings instances are working with the same data, the class ensures
    that data between different instances is always correctly synchronized, in case
    two or more QSettings objects are working with the same file. The same applies
    for two threads, both of which contain a QSettings object with the link to the
    same file, and even for two processes, in both using QSettings linked to a common
    file. Qt uses internal locking mechanisms for this purpose.


    The QSettings constructor normally requires two parameters for the instantiation
    to generate the appropriate entry in the configuration storage system: the name
    of the organization for which the programmer works, and the name of the program.
    In Windows,


