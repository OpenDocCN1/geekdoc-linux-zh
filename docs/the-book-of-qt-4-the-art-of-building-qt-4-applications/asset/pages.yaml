  md: '# 12 Threading with QThread


    shared data when has been sent to sleep. In this case, the next thread would operate
    on inconsistent data, leading to unpredictable results.


    To master this situation we must protect each critical section in the code to
    ensure that only one thread can execute it at any time. A critical section is
    a portion of code that needs to run consecutively without being interrupted.


    Other threads that want to run through this code section will just have to wait.
    This exclusive access is guaranteed by the QMutex class. The name mutex for mutual
    exclusion, and, as name suggests, if a thread is executing a code protected by
    a mutex, then any other thread waiting to enter the critical section must wait
    until that thread releases the mutex.


    A thread that has to wait for access to shared resources should be put to sleep
    for a while, without the system having to continually keep track of its status
    (busy-waiting). For this purpose, there is the QWaitCondition class: It can be
    used to put a thread to sleep until a certain condition occurs.


    # 12.2.1 The Consumer/Producer Pattern


    The principles described above are put to good use in the so-called consumer/producer
    use-case, in which a producer thread makes data available for processing by a
    consumer thread. To move data from one thread to the other, the producer places
    it in a queue, from which the consumer takes them out.


    As a shared resource, the queue must be protected by a mutex before it is accessed
    by either the producer or the consumer. If the consumer works more quickly than
    the producer, it is possible that the queue will become empty. If the producer
    works faster than the consumer, the queue may fill up. In either case, one of
    the two threads has to sleep: the consumer until more data are available, or the
    producer until the queue has free space.


    We implement this scenario below using only Qt tools. To do this first declare
    a few variables: As the data structure for the g_queue queue in which we save
    data, we use the QQueue class, explained in more detail in Appendix B on page
    404. This contains the methods enqueue(), dequeue(), which reads out the oldest
    datum.


    The integer g_maxlen specifies the maximum number of elements in the queue, and
    the mutex g_mutex will protect the code sections that access the queue. The wait
    condition g_queueFull wakes the sleeping producer when the queue has free space.
    Likewise, g_queueNotEmpty wakes the sleeping consumer when there are elements
    available in the queue:


    ```

    // producerconsumer/producerconsumer.cpp

    #include <QtCore>

    ```


