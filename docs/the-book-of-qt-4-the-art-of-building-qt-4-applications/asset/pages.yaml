    # 9.7.5 Errors in the Table Model


    Several problems that occur in connection with the table models in Qt 4.1 should
    be left unaddressed at this point. One is editor operations do not always function
    reliably after columns have been removed. The QTableModel even ignores the removeColumn()
    instruction entirely. As a workaround, proxy model that filters out the unwanted
    datasets is recommended here. If the data should only be displayed, you can instead
    simply place an SQL query above the QSqlQuery.


    Another problem involves the revertAll() slot, which is intended to undo any changes
    in relational tables with the OnManualSubmit editing strategy. However, the columns
    in which a foreign key relation was previously defined with setRelation(), revertAll()
    does not revert to the old values. The only solution until now was to connect
    the slot of the button with a custom-developed slot that replaces the current
    model with a new one that has the same properties. Since the model temporarily
    saves the data, it will be lost in this way, and the new model will display the
    original data from the database.


