  md: "# 2 Tools Needed to Create Dialogs\n\nOur example program is a borderline case\
    \ in this: Its data processing task consists of converting numbers from one base\
    \ to another—a functionality not linked to a particular user interface. If you\
    \ were to write a hex editor, on the other hand, whose outputs can be switched\
    \ between decimal, hexadecimal, and binary notation, would probably not be justifiable\
    \ to separate the GUI from the calculation logic for the synchronization of the\
    \ corresponding edge lines.\n\nFigure 2.6: Separation of GUI elements from the\
    \ processing logic\n\n| ByteConverterDialog | ByteConverter |\n|---|---|\n| decEdit\
    \ | setDec(Slot) |\n| textChanged(Signal) | setHex(Slot) |\n| setText(Slot) |\
    \ setBin(Slot) |\n| hexEdit | decChanged(Signal) |\n| textChanged(Signal) | hexChanged(Signal)\
    \ |\n| setText(Slot) | binChanged(Signal) |\n\nIt can already be seen that there\
    \ is no easy answer as to what to separate and what you leave behind. To a certain\
    \ extent the answer depends on the programming style and the project organization.\
    \ Qt provides the necessary freedom for both methods.\n\n# 2.2.2 Declaring and\
    \ Sending Out Signals\n\nThe new ByteConverter class has signals and slots, and\
    \ must therefore ultimately inherit from QObject. Since it displays nothing on\
    \ the screen, is not a widget, and requires no other functionality that Qt makes\
    \ available in other subclasses of QObject, it can inherit directly from QObject:\n\
