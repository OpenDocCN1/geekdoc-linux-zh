    # 11.4 Starting and Controlling Processes


    Now and again you may want to make use of services of command-line based programs,
    particularly on Unix-based operating systems. QProcess is responsible for executing
    and controlling such external processes. Because it inherits from QIODevice, this
    class is in a position to read the output of processes and create inputs. In addition
    it has methods for manipulating the environment variables of a process.


    QProcess belongs to the group of asynchronous devices: As soon as data is waiting
    or or other events occur, the class sets off a signal. The corresponding call
    returns immediately. You can use QProcess for operations that are short enough
    not to block the GUI, or use them synchronously in threads. This behavior applies
    in the same way for all asynchronous, QIODevice-based classes.


