    Figure 8.4:

    The inheritance of models in Interview


    | QAbstractListModel | QAbstractTableModel | QDirModel | QProxyModel | QStandardItemModel
    |

    | QListModel | QSqlQueryModel |


    For compatibility reasons, classes based on QAbstractListModel and QAbstractTableModel
    are used in tables, nested lists, and one-dimensional lists. The practical benefits
    of doing so, however, are strictly limited if you use them in QListView and QTableView,
    respectively. QAbstractListModel, for example, reduces the number of usable columns
    to one single—which makes little sense in a table.


    With QListModel, Interview also provides a specific implementation of QAbstractListModel,
    an editable model, the data source of which is a string list.

    The user changes in the view, the model adjusts the corresponding entry in the
    string list.


    QStandardItemModel allows data to be stored directly in the model. Although this
    contradicts the basic idea that a model only provides a pure mediation service
    between the data source and, it turns out to be very practical in certain application
    cases with most data-handling requirements. For large applications, however, QStandardItemModel
    is usually inflexible.


    QAbstractProxyModel replaces the QProxyModel class in Qt 4.1, which was intended
    to extract data from model, manipulate it, and return them to a new model, for
    example, to filter the data. The class turned out to be too inflexible, and was
    therefore replaced. Trolltech advises against using it in new projects. QAbstractProxyModel
    is powerful, but again it is an abstract class, and so it relies on subclasses
    to implement the functionality it


    In order that the effort in using the new class is not larger than that for the
    directly usable QProxyModel, Trolltech provides the QSortFilterProxy subclass.
    It allows you to perform the most frequently performed tasks of a proxy model,
    mainly filtering and sorting, without the need to derive further subclasses.


    Finally, Interview provides a model in QDirModel that can be used, if, required,
    to project a data hierarchy in QListView, QTreeView, and QTableView.


