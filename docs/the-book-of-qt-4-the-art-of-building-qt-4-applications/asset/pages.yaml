    for the HTML CSS standards. SVG describes two-dimensional vector graphics and
    is based on XML, in contrast to many established vector graphics standards. The
    last SVG version to be published by the W3C was version 1.1, and the SVG working
    committee of the W3C is preparing version 1.2, which currently has the status
    of a working draft.


    To guarantee its use on mobile platforms, the W3C additionally published so-called
    profiles with a reduced functionality, SVG Basic and SVG Tiny.²12


    Qt 4 implements SVG-Tiny and SVG-Basic in versions 1.1 and 1.2, but currently
    supports neither ECMA script (often referred to as JavaScript) nor other graphic
    manipulations via the Document Object Model (DOM).


    Qt combines the SVG classes in a separate library called QtSvg. To use them, you
    must first extend the .pro file as follows:


    ```

    QT += svg

    ```


    The include instruction corresponds to the library name:


    ```

    #include <qSvg>

    ```


    So far, Qt has not handled SVG files via QPixmap. Instead it makes the rendering
    API directly available, under the name QSvgRenderer. In addition there is a widget,
    QSvgWidget, which can display SVG images (below we create an instance that displays
    the file.svg):


    ```

    QSvgWidget *svg = new QSvgRenderer("*file.svg");

    ```


    QSvgWidget knows the load() slot in two variations. The first expects a filename
    as a QString, similar to the constructor in the example above. The second one
    is passed the contents of SVG file as a QByteArray. No corresponding constructor
    exists for this.


    Another method to display QSvg from a normal QWidget is the access renderer(),
    which returns a pointer to the QSvgRenderer object for the widget. QSvgRenderer
    is the class responsible for actual rendering.


    If QSvgWidget has loaded an image, it finds out its sizeHint(), which matches
    the image size in the SVG file, with QSvgRenderer::defaultSize(). Without a loaded
    image, it inherits its behavior from QWidget::size().


    The QSvgRenderer provides an extensive API for handling images and animations.
    In addition to the load() slot (which is available in QSvg and QRenderer), there
    is an additional render slot, which takes a QPainter object as a parameter. This
