    double) to the slotFoo(), slotFoo(int), and slotFoo(int, double). However, you
    cannot link the signalFoo(int, double) signal with the slotFoo(double) slot using
    connecting.


    If you try to create an invalid signal/slot connection, neither the compiler nor
    the linker will complain. When the application is run you will see a warning that
