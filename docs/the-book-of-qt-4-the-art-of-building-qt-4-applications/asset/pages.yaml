    # 12.4 Using Signals and Slots Between Threads


    In Qt 4 it is possible to connect signals and slots across threads. This can be
    done thanks to so-called queued connections, which exist in Qt 4 in addition to
    the traditional direct connections.


    By direct connections we mean connections within a thread or process, as you learned
    in Chapter 7. With queued connections, possible arguments of signals are copied,
    and they are handed over to the recipient thread on the next thread change. Usually,
    worker threads emit containing messages in the form of the arguments, which are
    taken up by a slot in the main thread. The reverse is also possible, but then
    the worker requires its own event loop (see Section 12.5 on page 350).


    We can demonstrate this principle by extending the thread variation of the Time-Server
    example from Chapter 12.1 (page 338) so that the worker threads messages that
    arrive in a window in the GUI thread.'
