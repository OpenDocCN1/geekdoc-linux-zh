  md: '# 6.5.3 File Selection Dialogs


    Applications frequently use dialogs to prompt the user to select files or directories.
    For this reason nearly all platforms provide implementations of such selection
    dialogs. Each one has its own special features, to which the end users of applications
    quickly become accustomed.


    As a platform-independent toolkit, Qt is in somewhat of a quandary here: On one
    hand the user should be able to use his or her own system dialog, but on the other,
    these dialogs cannot be extended with the widgets as a programmer have written.


    The QFileDialog class


    If you explicitly want to use no native system dialogs, you specify methods of
    this via the QFileDialog::DontNativeDialog flag. In this case Qt uses its own
    dialog at the corresponding position. This and other flags are documented in Table
    6.2.


    | Value | Effect |

    | --- | --- |

    | QFileDialog::ShowDialogOnly QFileDialog::DontResolvelinks | Do not resolve symbolic
    links, but interpret them as regular files or directories. |

    | QFileDialog::DontOverwrite | Do confirm that an existing file should be overwritten.
    |

    | QFileDialog::DontUseSheet | Do not display the Open file dialog in Mac OS X
    as a sheet. Only works if DontUseNativeDialog is not set. |

    | QFileDialog::DontNativeDialog | Always use Qt''s own dialog. |


