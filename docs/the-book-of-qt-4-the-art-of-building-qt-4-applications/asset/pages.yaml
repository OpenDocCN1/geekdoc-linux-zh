    # 11.3 Serializing Objects


    In C++, data is usually represented as an object. When data is in this form, programs
    cannot save it in files or send it across the network directly. Instead, developer
    must first specify which properties of an object he wants to save and in what
    sequence he wants to send them.


    What involved is taking the objects apart and placing their basic components "on
    a conveyor belt". To restore them, data is taken from the conveyor belt and packed
    back into an object. These procedures are referred to as serializing and deserializing
    (In interprocess communication, where this procedure is also applied, the terms
    marshalling and demarshalling are also used).


    The QDataStream class is reliable in Qt for the serialization of all data types.
    It works on all QIODevice classes. Page 243 uses the class to pack a list of string
    lists into QByteArray used for a drag-and-drop operation:


    ```

    ByteArray encodedData;

    QDataStream stream (&encodedData, QIODevice::WriteOnly);

    ```


    The alternative QDataStream constructor used here simplifies handling ByteArray,
    where the main constructor demands, as an argument, a pointer to the QIODevice
    with which it is to operate. The above code corresponds to the following code
    that uses the standard constructor:


    ```

    ByteArray encodedData;

    QBuffer buffer (&encodedData);

    buffer.open(QBuffer::WriteOnly);

    QDataStream stream (&buffer);

    ```


