  md: 'These dialogs normally implement operations that should be completed before
    the user can continue working. Such dialogs are known as modal dialogs.


    This dialog type is specifically suited to configuration interfaces: If these
    do not block the application, this often means increased programming work, particularly
    if settings altered using this dialog influence affect other parts of the GUI.
    In a case unexpected phenomena could occur for the user, but these can be elegantly
    avoided with the help of the modality.


    A modal dialog represents a new level widget. In Qt this means that the developer
    may make instances of this type of QDialog explicitly, since dialogs are always
    invisible after being instantiated. For modal dialog the exec() method is normally
    used for this, which generates a new event loop and displays the dialog at the
    same time. The similarity of the method name to QApplication::exec(), the function
    that starts the main event loop for the overall program, is then intentional.


    The following code fragment demonstrates how to proceed when instantiating a modal
    dialog, using the subclass QDialog as an example, which will get to know more
    closely in Section 6.5.3. First we instantiate a dialog and let enter its own
    event loop, by invoking its exec method:


    ```

    QDialog dialog;

    int status = dialog.exec(); // start dedicated Event-Loop

    //execution continues here after the dialog has closed

    ```


    Only when the QDialog''s exec() finishes and closes the dialog window, returns
    to the application, for example because (i.e., the Application::exec() method).
    This behavior ensures the modality of the dialog internally, returning with the
    Qt::WA_ShowModal flag that also means that dialogs started via exec() can return
    a success or failure code for the main event loop to examine, in a similar way
    to how the main() function of a C/C++ program returns a status to the operating
    system.


    The return value is determined by a slot: QDialog provides two predefined slots,
    accepted() and reject(), that are normally also triggered by clicking the OK or
    Cancel buttons, respectively, with the latter also triggered by pressing the Esc
    key. At this time these slots close the dialog, but without deleting the object.
    Supplied with the return value, the code that called the dialog can conveniently
    take over the processing logic.


    Of course, if a subclass of QDialog implements the processing of its GUI elements
    internally, or if the return value is not relevant, as in the number converter
    example from Chapter 2, the programmer may ignore the return value.


    > In general dialogs are only invisible at first when they do not possess a parent
    window; for dialogs this rule does not apply.'
