    you should first search for the problem in the meta-object compiler moc. It generates
    an additional file for all classes containing the line Q_OBJECT, which must be
    linked to the project.


    qmake may "forget" about this because of an incorrectly set system time (which
    can also trigger many other problems, since the build system relies on having
    the correct timestamps on the source files), but there are also other causes.
    In this case the problem can be solved by calling qmake by hand.'
