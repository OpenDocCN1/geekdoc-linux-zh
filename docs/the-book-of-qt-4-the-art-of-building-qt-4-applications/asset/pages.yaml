  md: '# 8 Displaying Data Using “Interview"


    Although this concept stands out because of its simplicity, it is not always the
    best solution. Why should you pack the results of SQL queries into items, storing
    the data of the original query a second time? In addition, certain advantages
    of SQL would be lost, such as incremental delivery of queried data to the application:
    The user has to wait until all data are available, the programmer is faced with
    much more work to display the data from the source in an item-based view.


    For this reason Qt 4 has a model/view concept called Interview. This is much more
    flexible than item-based programming, but it is also more complex, so that even
    professionals need a while to fully understand it. We will first look at the underlying
    ideas, and take a closer look at some simple examples of model/view programming.
    Starting on page 222 we will develop our models, and we will briefly discuss item-based
    views on page 251.


    # 8.1 Underlying Concepts


    model/view architecture is based on the idea of separating data from its display.
    By doing so, the same data can easily be represented in a variety of forms, as
    lists or tables. Since the data source ideally knows nothing about the view that
    displays it, and a view knows nothing about the internal organization of the source,
    an element in between is required—Figure 8.1 illustrates this.


    ![](img/b663c93885d7333a091a433460ee647f_209_0.png)


    That models and views can understand one another, the model has knowledge of the
    basic properties of the views: Each entry occupies one row and one column in the
    model, and if necessary a link to a parent object. The latter is of importance
    only for nested lists, not for normal lists and tables. Interview describes these
    basic properties with the QModelIndex class.


    With the help of the QModelIndex class, a model can reference the data to which
    it refers and supply it to a view in the format that the view demands.


    In order to display data on the screen correctly, a view queries the data source,
    via a QModelIndex, in various roles. In the DisplayRole the view expects to receive


    208'
