    either ./release/helloWorld or ./debug/helloWorld, the window opens as shown in
    Figure 1.1 on page 26.


    # 1.2 Layouts, Object Hierarchy, and Memory Management


    # 1.2.1 How to Arrange Widgets Automatically


    In order to extend the "Hello, world!" program so that it doesn''t show text in
    a single QLabel object, but arranges two Qabels one under the other, as shown
    in Figure 1.2, we use the layout system included in Qt. This automatically arranges
    the GUI elements, referred to as widgets or controls. In language similar to that
    used in the field of printing, we take here of layouting.


    > Figure 1.2: A widget with vertical layout


    ![](img/b663c93885d7333a091a433460ee647f_30_0.png)'
