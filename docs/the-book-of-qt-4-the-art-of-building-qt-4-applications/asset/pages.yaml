  md: "# 4.2 Deriving from QMainWindow\n\nIn the MainWindow class itself, we only\
    \ have to define the constructor. For this, the source text file mainwindow.cpp\
    \ is also rather short:\n\n```\n// cuteedit1/mainwindow.cpp\n\n#include \"mainwindow.h\"\
    \n#include <QLabel>\n\nMainWindow::MainWindow()\n{\n    setWindowTitle(tr(\"CuteEdit\"\
    ));\n    resize(600, 400);\n\n    QLabel* label = new QLabel(tr(\"Central Widget\"\
    ));\n    setCentralWidget(label);\n    label->setAlignment(Qt::AlignCenter);\n\
    }\n```\n\nIn the constructor we first call the QWidget function setTitle(). Since\
    \ the MainWindow class is derived from QMainWindow as the base, it inherits this\
    \ function, and we can use it to set the text displayed by the title of the window.\
    \ If you leave this out, Qt uses the program name as the title.\n\nWe set the\
    \ text for the bar via the tr() method, which inherits MainWindow from QObject.\
    \ If we have any wants, this will translate the text to another language at runtime;\
    \ if not, it returns the string unchanged⁴\n\nThe resized() function that also\
    \ inherits from QWidget specifies the size of the window. The two arguments determine\
    \ the width and height of the window. If the pixels are not explicitly set, Qt\
    \ will determine automatically, based on the content to be displayed. But in our\
    \ case this would be too small, since we will fill the window with more content.\n\
    \nIn order to display something in the main window, we create a QLabel object\
    \ with the central widget and make it the focal point of the application with\
    \ the setCentralWidget() function, which MainWindow inherits from QMainWindow.\
    \ With this call the MainWindow object adopts the new QLabel. Accordingly we must\
    \ allocate it on the heap, with memory management provided by Qt for instances\
    \ of QObject.\n\nThe setCentralWidget() calls the QLabel object into a layout\
    \ that it fills the entire space in the window. By default the QLabel class arranges\
    \ text centered vertically, and horizontally aligned to the left margin. To center\
    \ both directions, we change the alignment with setLayout(). This function takes\
    \ as an argument values from the enumeration type (enum) alignment, which is defined\
    \ in the Qt namespace—hence the value AlignCenter is prefixed with Qt::.,\n\n\
    > ⁴ See page 49 and Chapter 14 from page 375 for a detailed discussion.\n⁵ Qt\
