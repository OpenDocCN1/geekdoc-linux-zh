  md: '# # 11 Chapter


    # # Input/Output Interfaces


    You can hardly imagine any application today that does not access files, networks,
    or external processes. Consequently, Qt 4 provides interfaces for communicating
    with the environment that are independent of the operating system.


    Although each of the operating systems supported by Qt provides interfaces to
    deal with the various kinds of I/O, there is sadly no uniform standard for managing
    this functionality. These circumstances often force programmers to completely
    redesign the code if they want to, for example, send a datream across a network
    instead of saving it to a file. Qt 4 gets around this problem by providing a base
    class called QIODeviceDevice, which provides a platform for all I/O interfaces.


