    ```

    $\begin{matrix} m_{11} & m_{12} & 0 \ m_{21} & m_{22} & 0 \ dx & dy & 1 \end{matrix}$

    ```


    To understand how it functions, a short mathematics is recommended: To transport
    a point $(x, y)$ in a two-dimensional space to a new point $(x'',y'')$, it applies
    that:


    ```

    $x'' = m_{11} * x + m_{21} * y + dx$\ny'' = m_{22} * y + m_{12} * x + dy$

    ```


    The constructor of QMatrix has the form


    ```

    QMatrix(greal m1, greal m2, greal m1, greal m2, greal dx, greal dy);

    ```


    It therefore takes the individual matrix components as floating-point numbers
    and instantiates the corresponding $3 \times 3$ matrix$^6$.


    For matrices that are invertible, the corresponding **inverse matrix** undoes
    the operations carried out by the original. QMatrix objects have a method by the
    name of inverted() that calculates the appropriate inverse matrix. This method
    expects one of its parameters the address of a Boolean variable, and it returns
    a QMatrix. If the value stored in the variable after the method has is true, however,
    the original matrix exists. If inverted() returns the inverse matrix of the specified
    matrix. If the original matrix is **singular**, meaning that no inverse matrix
    exists. In this case the method returns a *unit* or *identity matrix*, which application
    results in no transformation taking place; that is, the unit matrix maps each
    point to itself. Whether a matrix can be inverted can be checked, when necessary,
    with isInvertible().


    In the unit matrix, all the elements on the main diagonal $(m_{11}, m_{22}$, and
    the lower right-hand(1)) have the value 1, and the others have the value 0. Whether
    a matrix is a unit matrix is not revealed by the Boolean return value of the identity()
    method.


    To move points by a specific displacement using a transformation matrix, $dx$
    and $dy$ are allocated values for the $x$ and $y$ offsets, in the following example
    10 each, and the other values are like those of a unit matrix:


    ```

    $x'' = 1 * x + 0 * y + 10$\nyy'' = 1 * y + 0 * x + 10$

    ```


    > 6 greal is a data type defined by Qt, corresponding to the C++ double type.
    Section B.6 in Appendix B lists all type definitions defined by Qt and explains
    their benefits.


