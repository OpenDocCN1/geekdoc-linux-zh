  md: '# 4.3 Creating a Main Window with the Qt Designer


    In addition we equip the editor with a menu bar from which the program functions
    can be controlled. To guarantee rapid access to the most important functions,
    such as loading and saving, we also insert a toolbar beneath this containing an
    icon for each of these commonly invoked actions. A status bar provides space for
    display of permanent and/or contextual information, such as the current position
    of the cursor or the purpose of the current menu entry.


    # 4.3.1 Adding Menu Bars


    First we will look at the menu bar. We provide it with the standard entries that
    we are accustomed to standard applications: the File menu, which takes care of
    the file to be edited, the Edit menu, which controls manipulation of the text,
    and a Help menu.


    To do this, we select the Type Here entry in the already existing menu bar and
    create the three entries. When doing we should remember to place an ampersand
    (&) before each entry, so that the (Alt) key will call up the respective menu
    in combination with a (F, E, or H) key.


    The & instructs the menu to define a window-wide shortcut (called accelerator),
    which, in combination with the (Alt) key, jumps to the corresponding menu item.
    It is appropriate to take the first letter of a menu entry, but the same letter
    may not be used twice, so you may need to use another letter for the shortcut
    when two menu entries begin with the same letter. The letter in the entry chosen
    as the shortcut character should be as intuitive as possible.


    ![](img/b663c93885d7333a091a433460ee647f_108_0.png)


    Figure 4.3: Now our editor has an input window and a menu bar.


    Accelerators like this allow experienced users to operate the application with
    the keyboard, which can be much quicker than using the mouse and can improve'
