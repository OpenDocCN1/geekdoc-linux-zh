    mode can be seen on the right here.


    The SourceOut and DestinationOut modes function in the same way as SourceIn and
    DestinationIn, using the alpha channel. The only difference differs in the value
    to be subtracted: With SourceOut (QPainter::CompositionMode_SourceOut), the inverse
    of the source is subtracted, and with DestinationOut (QPainter::CompositionMode_DestinationOut),
    the inverse alpha value of the destination is subtracted. Each of these is defined
    as follows:


