    From now on, matrix moves moves all points by 10 units.


    The decisive variables when scaling (that is, when enlarging or decreasing in
    size) are $m_{11}$ and $m_{22}$, each set to 10 in the following example:


    ```

    $x'' = 10 * x + 0 * y + 0$

    ny'' = 10 * y + 0 * x + 0$

