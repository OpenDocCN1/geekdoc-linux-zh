    The first parameter defines the color that the dialog initially selects, and the
    second describes the obligatory parent widget, which can also be 0 if the modality
    of the dialog does not play role. If the user interrupts returns an invalid color,
    in this case can be checked with Icolor.isValid().


    ![](img/b663c93885d7333a091a433460ee647f_276_0.png)


    Another method getRgba() can be used to define the alpha channel for a color (Figure
    10.1, on the right):


    ```

    bool ok;

    QRgb rgb = QColorDialog::getRgba(rgba(255, 0, 127), &ok, this);

    QColor color(rgb);

    ```


    In contrast to getColor(), this method expects a QRGB value. Since QRGB has no
    dedicated value for "invalid", getRgba() has an ok parameter, which is set to
    false if Cancel is clicked. In this case getRgba() returns the default value passed.
    The last line shows how you can store a QRGB value (together with its alpha channel)
    in a QColor object.


