    # 8.9 Your Delegates


    Until we have accepted that views display their entries themselves. We will now
    reveal the secret of the delegates, which are responsible for the display of individual
    elements and providing an order for writable models. Each model has exactly one
    delegate.


    All delegates inherit from QAbstractDelegate, in the manner of Figure 8.16. By
    default, all views use the QItemDelegate class derived directly from this, which
    provides a standard editor and contains the character logic for the entries. We
    will get to know a similar SQL-specific class QSqlRelationalDelegate in Chapter
    9.


    Below we will write a delegate that not only provides an editor like QItemDelegate
    but also has tab completion and an overview of all existing entries. The current
    column serves as the data source. In the case of our address book model, this
    can save you a great deal of typing work, for example, for frequently occurring
    first names and family names.'
