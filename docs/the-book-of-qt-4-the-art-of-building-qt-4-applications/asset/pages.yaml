  md: "# 4 Developing a GUI Application Based on a Main Window\n\nThe main() function\
    \ is almost identical to the one from \"Hello, world! program from Section 1.1.\
    \ Instead of the QMainWindow class from the mainwindow example on page 102, we\
    \ now use our own MainWindow class, derived from QMainWindow. The corresponding\
    \ class definition can be found in the header file mainwindow.h. The #include\
    \ directive which incorporates the contents of this header file uses quotation\
    \ marks instead of angle brackets, the file is not a standard header file.\n\n\
    We again surround the file contents of mainwindow.h with an #ifdef construction\
    \ providing the include guards to avoid compilation errors if this header is included\
    \ by more than one source file.3 MAINWINDOW_H will be defined when the header\
    \ file is processed for the first time, and the preprocessor ignores the file\
    \ contents for all subsequent inclusion:\n\n```\n// cuteedit/mainwindow.h\n\n\
    #ifndef MAINWINDOW_H\n#define MAINWINDOW_H\n\n#include <QMainWindow>\n\nclass\
    \ MainWindow : public QMainWindow\n{\n    Q_OBJECT\n\npublic:\n    MainWindow();\n\
    };\n\n#endif // MAINWINDOW_H\n```\n\nSince the MainWindow class is derived from\
    \ QMainWindow, we first issue a directive to include the header file for the QMainWindow\
    \ class. To ensure that the QMainWindow methods remain accessible outside the\
    \ MainWindow class, we grant the derivative public access.\n\nOur new class also\
    \ inherits from QObject as a base class, we must not forget the Q_OBJECT macro.\
    \ Otherwise the linker will complain of undefined symbols, which in the case of\
    \ self-defined signals, results in an error message. In the case of a Tool class,\
    \ which defines a signal called switchTool(Tool*), this will appear as:\n\n```\n\
    tool::O: In function 'Tool::activateTool(Tool*)'\ntool::cpp: (text+0x5f): undefined\
    \ reference to 'Tool::switchTool(Tool+)'\ncollect2: ld returned status 1\n```\n\
    \n+   2 For header files that we create ourselves, we use the filename extension\
    \ in C/C++, h, to make the file type. We do not use uppercase in filenames.\n\
    3 See page 62.\n\n104"
