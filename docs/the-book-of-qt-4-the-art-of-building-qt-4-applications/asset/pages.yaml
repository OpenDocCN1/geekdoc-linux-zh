  md: '# 2 Tools Needed to Create Dialogs


    # Checking User Input


    The third problem, restricting the input in the line-edit widgets to valid values,
    requires somewhat more work, but can be resolved through validators. These inherit
    from QValidator as the base class. A validator is associated to a parent object
    that receives input and informs object whether or not it should accept the current
    input value.


    To check the validity of the decimal number, use a QIntVar object. It is created
    by invoking the constructor and passing it to it, as the first and second arguments,
    the minimum and maximum input values allowed. The third argument, decEdit, is
    a pointer to the line-edit beside that we want to make the parent object of the
    validator. This invocation, beside the validator to the input widget, also makes
    it subject to automatic memory management, so that the validator will be deactivated
    when the widget is. The setValidator() calls the validator to keep an eye on the
    input given to the object by decEdit. Now the user can type only numbers between
    0 and 255 in the input field.


    To check the validity of hexadecimal numbers, we must use any other type of validator:
    QExpValidator. This compares the input, viewed as a regular expression, against
    a regular expression. The first subexpression in square brackets [0-9A-Fa-f]{1}
    specifies the characters permitted in the input string: the digits 0 to 9 and
    the letters A to F (written either in upper or lower case). The following subexpression
    {1,2}, restricts the length of the input string to at least one, and at most two
    characters.


    Regular expressions in Qt are related to those from Perl, but there are some significant
    differences. For example, it is necessary to escape a backslash (\) in a Perl-style
    regular expression with another backslash to get the corresponding Qt-style expression,
    because a single backslash already acts as an escape character in C/C++. RegExp
    recognizes the double backslash as a simple backslash. It follows from that we
    need to use four backslashes if we want to specify a literal backslash within
    a Qt-style regular expression.


    We also use a QExpValidator with the regular expression [01]{1,8} as a validator
    for the input field for binary numbers. This expression allows only the characters
    0 and 1 in the input string, the string can be anywhere from one to eight characters
    in length.


