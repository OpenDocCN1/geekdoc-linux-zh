    To specify a color in the HSV model, we have the setHSV() method, which expects
    the three HSV components as integers and, optionally, the alpha channel. The alpha
    value is missing, QColor assumes it to be 255, which is, `opaque`.


    QColor is also able to accept CMK specifications and to display colors in CMK
    format. Since there are differences between the color spaces of the RGB and CMK
    models, and CMK is a subtractive color model whereas RGB is an additive one, not
    all colors can be represented in both color models. In cases where there is no
    exact equivalent for a desired conversion from one to the other, QColor tries
    to approximate the color as closely as possible.


    To obtain the CMK representation of a color, it is sufficient to read out the
    color components and the alpha channel, with getCmyk():


