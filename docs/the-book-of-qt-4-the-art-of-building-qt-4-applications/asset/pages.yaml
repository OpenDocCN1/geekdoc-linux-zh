    # 5.3 Splitter


    Although horizontal and vertical layouts are dynamic, they cannot be changed directly
    by the user. But sometimes he should be able to adjust the spacing between two
    or more widgets interactively.


    This need is fulfilled by the QSplitter class that, just like the standard layouts,
    have an addWidget (but no addLayout()) method. The partial widgets inserted using
    this method are separated by a so-called handle, which can be picked up and moving
    by the mouse (Figure 5.5).


    Figure 5.5:

    Text fields moved

    with the splitter


    ![](img/b663c93885d7333a091a433460ee647f_151_0.png)


    In contrast to the QBoxLayout class, there are no specialized classes for QSplitter
    that determine whether vertical or horizontal layout is used. Instead the orientation
    property determines the alignment. It can be set in the constructor, or set later
    on. If no orientation is specified, Qt creates horizontal splitters.


    # 5.3.1 Behavior During Size Changes


    The freedom of movement allowed the user by the splitter is restricted by the
    widgets involved: The smallest size is specified by the minimumSizeHint (or if)
    the minimumSize property. If the user tries to shrink the widget more than this,
    the splitter is completely hidden by the widget. This is known as a collapsible
    widget. If you want to prevent the user from "getting rid of the widgets," you
    can disable this behavior with setCollapsible(0, false), where 0 stands for the
    first widget from the left for a horizontal splitter, or, with vertical splitters,
    for the top widget in the splitter.'
