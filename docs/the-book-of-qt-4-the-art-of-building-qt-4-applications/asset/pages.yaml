  md: '# Handling XML with QtXml


    File formats based on the Extensible Markup Language (XML) are becoming more and
    more common. In the QtXml module, Qt provides not one, but two APIs for handling
    XML files, each of which makes use of a different approach: the Simple API for
    XML (SAX) and the Document Object Model (DOM).


    DOM, probably the more well-known representative of XML APIs, is a standard of
    the W3C. Here the contents of an XML document are transferred to an object model,
    a tree-like structure, which precisely mirrors the structure of the document.
    All modern web browsers use the Document Object Model internally, for example,
    because they can access any element whatsoever of the XML tree and read it out.
    But other applications use DOM because a DOM tree in memory can be transferred
    back to an XML document. But this also means that the DOM is not suitable for
    large XML documents, due to its considerable memory needs. DOM is specified at
    various levels, whereby the Qt implementation complies with the standards of DOM
    level 2.


    > See http://www.w3.org/DOM/'
  merge: -1
