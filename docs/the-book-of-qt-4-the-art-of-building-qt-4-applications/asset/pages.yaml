  md: "# 4.3 Creating a Main Window with the Qt Designer\n\nThe Undo/Redo Function\n\
    Programs that do not allow the user to undo actions can be frustrating. This applies\
    \ particularly to text editors. Since QTextDocument already provides an undo stack,\
    \ we can equip CuteEdit quickly and easily with an undo function:\n\n```\n```cpp\n\
    // cuteedit2/mainwindow.cpp (continued)\n\nvoid MainWindow::undo() {\n    textEdit->document()->undo();\n\
    }\n```\n```\n\nThe redo is to a certain extent the opposite operation to undo:\
    \ It recreates a status that has been undone. This has also been implemented already,\
    \ so that we need to make it accessible as a slot.\n\n```\n```cpp\n// cuteedit2/mainwindow.cpp\
    \ (continued)\n\nvoid MainWindow::redo() {\n    textEdit->document()->redo();\n\
    }\n```\n```\n\nThe copy method, which the user highlighted text to the temporary\
    \ buffer, is also made available directly by QTextEdit, so we just need a wrapper\
    \ method here:\n\n```\n```cpp\n// cuteedit2/mainwindow.cpp (continued)\n\nvoid\
    \ MainWindow::copy() {\n    textEdit->document()->copy();\n}\n```\n```\n\nThe\
    \ undo(), redo(), and copy() slots therefore simply call the matching methods\
    \ of the QTextEdit or QTextDocument classes. If the stack is empty, the first\
    \ two actions in the menu and icon bars are grayed out, so we disable them in\
    \ setupActions() through signals undoAvailable() and redoAvailable() of QTextEdit,\
    \ or QTextDocument consider them to be not applicable. We discussed setupActions()\
    \ on page 112.\n\nInformation on the Program\n\nOf course, the obligatory info\
    \ box must not be missing in any program. QMessageBox (see page 166) provides\
    \ its own static method for this, called info(), which expects a heading and a\
    \ short text:"
