    ```

    QLabel label("Hello World");

    label.show();


    return a.exec();


    ```


    For this purpose, the first two lines of code include the header files for the
    Qt classes that we want to use in the following code. In our case these header
    files contain the interface descriptions for the classes QApplication and QLabel.

    In Qt4 there is precisely one header file for each Qt class, which is named without
    the standard filename extension .h. Its name corresponds exactly to the class
    name.¹ When you give the #include directive, make sure that you capitalize the
    header filename correctly.

    The fourth line of the listing onward shows what a typical main() function of
    a Qt program looks like. First you create a QApplication object and pass it to
    its constructor the command-line arguments that the user supplied when invoking
    the finished program. No GUI program can manage without a QApplication object,
    because, among other things, QApplication makes an event loop. This loop ensures
    that the application continues running until its window is closed.

    Next we create a QLabel object that displays the text "Hello, world!". Initially,
    this object is invisible. We must call its show() function in order to make it
    appear—as shown in Figure 1.1—


    Figure 1.1:

    The first Qt program


    ![](img/b663c93885d7333a091a433460ee647f_27_0.png)


    Finally the call to exec() starts the event loop which is in charge of forwarding
    events to the appropriate objects. Such events are caused by user actions, such
    as clicking a button. In our first example we will leave event handling entirely
    to Qt itself. Section 1.3 (page 35) shows how additional user interaction can
    be implemented.


    The event loop is terminated when the quit() function of the QApplication object
    is called. In our example, this happens immediately when the last main window
    of the application (which in this case is label) closes and is deleted from memory.


    > ¹ In reality, the files themselves just contain a directive that loads the corresponding
    .h file. These are not documented, however, so that you can be quite sure whether
    Trolltech might have made unannounced changes.


