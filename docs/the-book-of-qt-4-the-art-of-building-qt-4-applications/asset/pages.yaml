  md: '# 3 GUI Design Using the Qt Designer


    # 3.1.1  Making Layouts With the Designer


    The widgets do not yet have a clean arrangement. To avoid having to explicitly
    position interface elements down to the last pixel, the Qt Designer provides some
    standard layouts. To group a number of widgets together, you can first highlight
    them by drawing a rectangle around them all with the left mouse button, and then
    choose the desired layout, either from the context menu which appears in the selection
    if you click the right mouse button, or the toolbar. The latter is recommended
    specifically for Mac users with a one-button mouse.


    In the case of the line edits and labels, a grid layout is the best choice; this
    is selected in the context menu through the item lay out→Lay Out in a Grid. The
    layout is outlined in red and the objects appear, grouped together, as they will
    in the final application.


    When applying a layout, the Designer tries to tolerate any pixel imperfections
    the developer may have caused in placing the widgets. If the selected layout does
    not arrange the widgets as you intended, or if there are the wrong number of elements
    for the layout, the arrangement can be canceled through the context menu entry
    Lay out→Break Layout.


    If not choose to QPushButton also, we choose a horizontal layout for the spacer
    and the buttons, as QPushButton already includes a horizontal layout with a spacing
    (Lay out→Lay Out Horizontally).


    Figure 3.4:

    Layouts group

    widgets together.


    ![](img/b663c93885d7333a091a433460ee647f_85_0.png)


    Finally, we bring together both layouts, along with the until now ungrouped vertical
    spacers, by selecting the context menu entry Lay out→Lay Out Vertically into a
    single, vertical layout. This “global” layout does not need to be specifically
    selected: The Designer does not highlight it with a separate frame, and its context
    menu opens if you click an empty space in the dialog. It affects all the previously
    formed layouts and until now ungrouped elements (e.g., the vertical spacer).


