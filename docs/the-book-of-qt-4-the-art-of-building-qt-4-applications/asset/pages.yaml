  md: '# 4.7 Doock Windows


    are available to the programmer if he wants to display them again: He can make
    the widget itself visible at any time show(), or he can use the toggleActionBar()
    method, as already used for toolbars, which generates a corresponding entry in
    menus or toolbars.


    The developer has the option of restricting some of privileges that QDockWidget
    provides to the user. These privileges are described in the enumerator QDockWidget::DockWidgetFeatures.
    They can be defined as a property in the Qt Designer or by passing a combination
    of enumerator elements to the setFeatures() method.


    DockWidgetClosable


    Determines whether a dock window may be closed


    DockWidgetMovable


    Specifies whether a dock window may be moved


    DockWidgetFloatable


    Defines whether a dock window may float


    If you want to restrict privileges, you must interpret these DockWidgetFeatures
    bit flags that can be combined with a logical OR. This can be done because the
    enumerator has values that are based on the power of 2, which are referred to
    as "bit flags"¹⁴


    To prevent the user from closing and removing the dock window, the following call
    is sufficient


    ```

    dockWindow->setFeatures(QDockWidget::DockWidgetClosable| QDockWidget::DockWidgetFloatable);

    ```


    To remove or assign all freedoms, the Qt provides the enumerated values UDockWidget::NoDockWidgetFeatures
    and QDockWidget::AllDockWidgetFeatures.


    Enumerators that are used as bit flags are an elementary concept in Qt, and we
    will come across them frequently.


