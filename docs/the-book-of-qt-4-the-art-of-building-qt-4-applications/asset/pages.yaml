    QPushButton. This class is used to display a button and mouse clicks on this button.


    The second difference consists of the call to QObject::connect() is a static function
    of the QObject class that creates a connection originating from one object and
    a slot in a destination object. The first two arguments specify the object sending
    the signal and the signal that we want to bind to the receiving slot. The last
    two arguments specify the object that is the recipient of the signal, and the
    receiving slot. The Qt characters are necessary because the function expects the
    addresses of the sending and receiving objects as arguments. This function is
    used to determine the action that is executed by the application when the user
    presses the button: The application terminates.


    Slots are normal functions of a class that are specially marked so they can react
    to signals. Signals on the other hand are "sent" by a signal. A signal from an
    object can be connected to one or several slots of a single receiving object or
    of several different receiving objects. If an object sends a signal, then all
    the slots are connected to that signal. If there is no matching link, nothing
    happens.


    The call to the QObject::connect() function in the example connects the clicked()
    signal of the QPushButton object with the quit() slot of the QApplication object.
    The button sends the clicked() signal when the user presses the button, causing
    the button''s clicked() function to be called. In response to this signal, the
    quit() function of the application is called. Calling this slot ends the event
    loop, and thus the entire application.


    When linking signals and slots with the QObject::connect() function, you must
    use the macros SIGNAL() and SLOT(), as shown. For its second (signal) and fourth
    (slot) arguments, the connect() function expects to be passed strings that contain
    a prefix describing the type (signal or slot) and otherwise comply with an Qt
    convention, about which we need not be concerned. Using the two macros will ensure
    that the expected strings are generated correctly.


