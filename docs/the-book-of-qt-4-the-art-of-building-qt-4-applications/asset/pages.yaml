  md: "# 9 The QtSql Module\n\nthrough a SELECT query, you can navigate through them:\
    \ first() jumps to the first dataset, last() to the last one, next() to the next\
    \ one, and previous() to the previous one.\nWith seek() you can address a specific\
    \ dataset by specifying an integer index.\nThe number of datasets contained in\
    \ the query object is revealed with size().\n\nTheSqlQuery::record() method returns\
    \ a QSqlRecord object. It contains information on the response to a SELECT query.\
    \ Using it we can learn, for example, the numerical index of a specified column\
    \ in the query result via QString::indexOf(). We can use this index to read the\
    \ value in column of a dataset with result QString::value(). The row is determined\
    \ by the current position in the query object, which we can retrieve using QString::at()\
    \ and change using QString::next().\n\n// sqlexample/main.cpp (continued)\n\n\
    ```\nSqlQuery(\"SELECT firstname, lastname FROM employees\");\nQSqlRecord record\
    \ = query.record();\nwhile (query.next()) {\n  String firstname =\n  query.value(record.indexOf(\"\
    firstname\")).toString();\n  String lastname =\n  query.value(record.indexOf(\"\
    lastname\")).toString();\n  qDebug() << query.at() << \":*\" << lastname << \"\
    :*\";\n```\n\nFor operations that change the contents of the database (such as\
    \ UPDATE or DELETE),\nnumRowsAffected() returns the number of datasets involved:\n\
    \n// sqlexample/main.cpp (continued)\n\n```\nquery.exec(\"DELETE FROM employees\
    \ WHERE lastname = 'Hasse'\");\nqDebug() << query.numRowsAffected(); // \"1\"\n\
    ```\n\nThings are a little complicated for INSERT instructions. Since these are\
    \ used to write values from the program's data structures to the database, it\
    \ can be complicated to construct a string containing the corresponding SQL instruction.\
    \ For this reason we need a different path: Using prepare() we save a template\
    \ for the desired command, equipped with placeholders, in the QSqlQuery object:\n\
    \n// sqlexample/main.cpp (continued)\n\n```\nquery.prepare(\"INSERT INTO employees\
    \ (lastname, firstname, department)\"\n  VALUES(:lastname, :firstname, :department)\"\
