  md: '# GUI Design Using the Qt Designer


    When building the project, make then relies on the user interface compiler cui
    to convert Designer-generated .ui files into C/C++ header files⁵ There is a fixed
    naming convention in this step: for example, if the class represented by the .ui
    file generated by the Designer is called ByteConverter(the value of the object-Name
    property can be examined to determine the class name), then the resulting header
    file is generated by h cui


    It is important that at least one file in the project includes this generated
    header file. You must add the appropriate #include statements before make is run.
    Otherwise, make won''t call cui with the relevant interface description file as
    an argument on its next run.


    Notice that the generated header file contains only a class with two methods:
    setupUI(), which generates the GUI, and retranslateUI(), which can be called by
