    The SAX parser triggers the following events from this extract:


    +   - Start tag found (<a>)

    - Start tag found (<img />)

    - End tag found (<</img> />)

    - Start tag found (<p>)

    - Text found (Click here)

    - End tag found (</p>)

    - End tag found (</a>)


    The parse results caused by implementing certain methods in handler classes. In
    XMLContent we are interested in two of the most frequently used classes: the QMLEntityHandler,
    which operates on tag and text events, and the QMLEErrorHandler which goes to
    work as the parser finds syntactical errors in the XML.


    You need the QMLETDHandler and QXMLDeclHandler classes less often. Both treat
    (different) events that trigger the Document Type Definition (DTD) of an XML document.
    In addition you can operate on XML entities with the QMLEntityResolver class,
    the methods of the QMLExicalHandler class are triggered by lexical events. These
    are not discussed here. The homepage of the SAX Project provides a detailed interface
    documentation, however.


    All methods of the handler classes are designed as interfaces, that is, they are
    purely virtual. To spare programmers the burden of implementing each method and
    each handler individually, QXMLDefaultHandler exists. It inherits from all handlers
    and implements their methods in a way that all events are ignored. It is now the
    task of the programmer to intercept the events he or she requires and process
    them.


