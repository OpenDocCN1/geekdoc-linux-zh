    # 2.1.1 Inheriting from QObject


    As mentioned previously, you must always use the Q_OBJECT macro when a class inherits,
    directly or indirectly, from QObject.This macro defines several functions that
    implement the signal/slot concept. Unfortunately, if the macro is missing in the
    definition of a class that inherits from QObject, neither the compiler nor the
    linker will report an error. Instead, the signals and slots of the class will
    remain unknown to Qt, and at runtime the corresponding connections will not work.


    Applications compiled with debugging information will warn at runtime (in a terminal
    window) that a signal or slot not not whenever code is executed that tries to
    access an unknown signal or slot. The error message is:


    ```

    Object::connect: No such slot Object::valueChanged(QString)

    ```


    However, this error message is a bit non-specific. You will also see if you have
    written the name of a signal or slot incorrectly or if the argument list is incorrect.


    Every file that uses the Q_OBJECT macro must be submitted to the command-line
    program moc qmake. This automatically generates the code converted into pure C++
    by the signal/slot concept.


    If you use qmake to create your project, the qmake searches all header and source
    files in the .pro file for the Q_OBJECT macro. When it finds one, qmake generates
    the necessary build instructions for moc based on the contents of those files.


    For this to work you must, specify the project''s header files in the .pro file.
    To do so, use the qmake variable HEADERS, as you will use the SOURCES variable
    for source files:


    +   3 Some compilers issue errors if the Q_OBJECT macro is terminated with a semicolon,
    which is why, for reasons of portability, we recommend that you always omit it.

    4 moc does not modify your files; it provides the new code in separate files which
    you have to take care of when writing your Makefiles by hand. If you use qmake
    as we recommend, you don''t have to care.

    5 qmake will not automatically notify if the Q_OBJECT macro is inserted into a
    file later.


