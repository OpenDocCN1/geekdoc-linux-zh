    stored RGB parameters. If a routine of an application program requires the color
    to be specified in a color model other than RGB particularly often, QColor can
    represent represent internally in CMK or HSV. In these cases, resources are used
    for conversion when the color is accessed via getCmyk() or getHSV(), respectively,
    but their interpretation as RGB colors is resource intensive. To convert to another
    color model, the methods toHSV(), toCMYK(), and toRGB() are used. The conversion
    can be done at any time before the corresponding color model is accessed:


    ```

    QColor red(Qt::red);

    // convert to CMYK internally

    QColor red = red.toCMYK();

    int c, m, y, k;

    // no conversion required, already converted

    red.getCmyk(&c, &m, &y, &k);

    // CMYK colors now in c, m, y, k, a

    ```


