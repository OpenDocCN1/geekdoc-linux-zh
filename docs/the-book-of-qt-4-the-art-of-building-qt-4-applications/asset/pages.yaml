  md: 'Otherwise the rest of the program differs hardly from the first example. Observe
    that we only have to make the QWidget visible by calling its show() method. This
    causes all widgets that the QWidget contains to be displayed on the screen as
    well, which in our case is QLabels.


    Finally we start the event loop before and pass the return code from the event
    loop back as the application''s return value. A simple return O would terminate
    the application immediately without even displaying the window.


    This application demonstrates the main advantage of layouts: You don''t need to
    worry about the except positioning of widgets. In addition, you can enlarge or
    scale down windows, and the layout automatically ensures that the components of
    the window will adjust to sensibly fill the space available, without the need
    for the programmer to write explicit code to implement this behavior.


    The programmer may also define what behavior is allowed for individual widgets
    in a layout: for example, whether a control element (such as a widget to display
    multiple line texts) should occupy as much space as possible or be constrained
    in size; or how to handle widgets which dont need more vertical space, such as
    checkboxes. Chapter 5 (page 141) describes the possibilities in more detail.


    # 1.2 Memory Management in Object Hierarchies


    The application shown in Figure 1.2 and described in the previous section not
    only introduces automatic layouts, but also differs from "Hello, world! from Section
    1.1 in another respect: Although the variable declaration QWidget window; is used
    to allocate the QWidget object, the new operator is used to allocate the QVBoxLayout
    and the QLabel objects. We used


    ```

    QVBoxLayout * mainLayout = new QVBoxLayout(&window);

    ```


    rather than


    ```

    QVBoxLayout mainLayout(&window);

    ```


    to create the layout.

    We''ve taken this approach because C++ does not provide automatic memory manag’’ment.
    In general, the application programmer must take care of that himself.

    However, Qt can take over some of the work of memory management, as follows. Objects
    of classes that are derived from the QObject class can be arranged into a tree
