  md: '# 4.5 Toolbars


    Each toolbar has a so-called handle with which it can be moved (see Figure 4.10),
    so that a user can rearrange the toolbars in his application and move them to
    different positions in the window. If you want to prevent this, you should use
    setM(false);


    ![](img/b663c93885d7333a091a433460ee647f_126_0.png)


    Figure 4.10:

    A typical toolbar with a handle (on the left)


    To locate a toolbar at a position other than horizontally beneath the menu bar,
    such as directly on the left margin of the window, we make a slight change to
    our example. There is a second version of the addToolbar() method that requires
    positioning details as the first argument. We therefore change the call in this
    way:


    ```

    QToolBar *mainBar = addToolbar(Qt::BottomToolbarArea,

    t("Main Toolbar");

    ```


    Now the toolbar appears on the bottom margin; Table 4.1 specifies the possible
    positions. In practice, this only makes sense for toolbar selections in the style
    of Photoshop or GIMP, which are usually implemented artwork as dock windows (see
    page 130). Users are creatures of habit, and tend to look for toolbars in the
    upper section of the window.


    | Value | Position |

    |---|---|

    | Qt::LeftToolbarArea | Vertically, on the left side of the main window. |

    | Qt::RightToolbarArea | Vertically, on the right side of the main window.

    | | Horizontally, as high as possible beneath the menu bar and above any dock
    windows. |

    | Qt::BottomToolbarArea | Horizontally, as low as possible, but above the status
    bar and beneath any dock windows. |

    | Qt::AllToolBarAreas | All positions. Not permissible for ad-dToolbar(). |


    Table 4.1:

    TheToolbarAreas enumerator


    Using setAllowed(), it is also possible to allow toolbars only at certain positions.
    Table 4.1 provides the values valid for this, which can be linked with a logical
    OR operator. The following code restricts the placement of the mainToolbar toolbar
    to beneath the menu bar and status bar:


    ```

    mainToolbar->setAllowed(Qt::TopToolbarArea |

    Qt::BottomToolbarArea);

    ```'
