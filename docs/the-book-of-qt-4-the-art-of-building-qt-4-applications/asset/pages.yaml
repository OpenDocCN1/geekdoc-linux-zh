- img_proc: true
  md: 'When parsing an XML document, the other hand, SAX sets off various events,
    for example, each time it comes across an opening or closing tag. Each event is
    represented by a method. The programmer has to reimplement the methods and can
    decide which tags or attributes he wants to save. The fact that the results in
    this case lie in data structures defined by the user means that SAX is by design
    a purely reactive API, in contrast to DOM. Its strengths come to fore in its efficient
    analysis of large documents. The specification of SAX has now been taken by the
    SAX Project.^2


    If you want to use the functionality of either of these two APIs, you must use
    qmake, with the following directive, to link the QtXml module to the current project:


    ```

    QT += xml

    ```


    Class implementations and declarations in which classes of the QtXml module are
    to be used either use the class names as classes, or instead use the include QtXml:


    ```

    #include <QtXml>

    ```


    This chapter will explain both APIs in detail and will look at important differences
    between the guidelines of the W3C and the SAX Project. A more in-depth treatment
    of the two standards is not possible at this point, however, due to the high complexity
    of the subject.


    # 13.1 The SAX2 API


    We shall first turn our attention to the SAX API. It corresponds as far as possible
    to the reference implementation of the SAX Project, which is in Java. The name
    conventions have been slightly adjusted by Trolltech, however, to fit in with
    the names given by Qt.


    # 13.1.1 How It Works


    The SAX API parses source text on an event basis. For example, the parser sets
    off events when it comes across a tag or text. As a practical example we will
    look at the following extract from an XML-based XHTML document:


    ```

    <a href="http://www.example.com">

    <img src="http://www.example.com/example.png" />

    ```


    ^2 See http://www.saxproject.org/.'
