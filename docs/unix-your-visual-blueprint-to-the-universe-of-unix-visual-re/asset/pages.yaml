  md: '# ADVANCED SYSTEM ADMINISTRATION


    # Apply it


    Zero time can elapse for simple tasks

    Your computer, no matter how old or slow, was designed to handle and transmit
    data via incredibly fast electrical impulses. When a relatively simple job, such
    as listing files, is performed on a machine with no heavy activity, the amount
    of time is measured in as little as a single millisecond — an amount so small
    that it is effectively zero.


    System slowdown causes

    Systems slow for a number of reasons. Possibly, the machine is currently under
    heavy activity, such as handling several dozen print jobs at once. Or, or a lack
    of an appropriate amount of RAM to keep too many people on the system, or to keep
    things moving efficiently. For more information, check out this book''s chapter
    on troubleshooting problems on the system.


