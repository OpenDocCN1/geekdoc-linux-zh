  md: '# Read Less, Learn More™


    Welcome to the only guidebook series that takes a visual approach to professional-level
    computer topics. Open the book and you''ll discover step-by-step screen shots
    that demonstrate over 100 key Unix* tasks, including:


    # Unix applications and utilities on CD-ROMs!


    +   - Tripwire 2.0 for Linux*

    - Logwatch 1.4.6

    - Diskcheck 3.1.1


    +   - Changing directories with cd Unix

    - Permissioning files

    - Searching with Pipe, Grep, and ps

    - Executing a shell script

    - Determining root file ownership

    - Creating user accounts

    - Logging in Telnet

    - Setting up Netscape

    - Archiving files with tar

    - Finding disk and CPU hogs


    +   - Plus all code and examples from the text and a fully searchable e-version
    of the book


    Includes Internet Explorer


    ![](img/62c9d4555470e74cbdf27d6e2d0b22c6_355_0.png)


    # POWER SEARCHES


    You will find Unix commands that are powerful on their own, but by piping them
    together you can perform complex tasks. The power of Unix lies in the ability
    to combine simple tools to create sophisticated results through text processing
    filters.


    The grep command allows you to find patterns in text. You can use it to search
    through files, directories, or even the output of other commands.


    The find command is used to search for files in a directory hierarchy based on
    various criteria such as name, size, date, and permissions.


    The sort command allows you to arrange the lines of a file in a specific order.
    This is useful for organizing data and identifying duplicates.


    # Extra


    Here is how the grep command works in this example:


    The way the grep command works is shown below. It searches for a specific pattern
    in a file and displays the lines that match that pattern.


    You can also use grep to search through the output of other commands by using
    the pipe (|).


