    l command option with the ps, or process search command. The advantage of using
    this form of the process search command is that it allows you to view all of the
    nice priorities on all of the processes currently running, or only one process
    at a time.


    When using the ps command to view a particular task, use only the pipe utility
    and the grep (get regular expression) together. This command combination is as
    potent as it is useful, which is why it is discussed in great detail in “Power
    Searches” in Chapter 7. It is particularly useful when you need to separate a
    command by process ID number or process name in a sea of similar processes running
    on the UNIX network at the same time.


