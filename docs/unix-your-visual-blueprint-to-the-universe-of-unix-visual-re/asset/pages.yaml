  md: '# CHANGE PERMISSIONS TO RESTRICT ACCESS


    You can change permissions on a sensitive file so that other user accounts can''t
    edit or view it. You can read, write, and execute permissions on a file or directory
    in the CDE graphic desktop environment. By allowing you access to the properties
    that make up a given file''s parameters, you can select the file to be visible
    only to the root account. Alternatively, you can make it visible only to root
    and one group of users who may


    have an interest in the information, without allowing access to everyone on the
    system.

    Restricting access is an effective way of preventing problems resulting from accidental
    editing. For example, if you have a file that is critical to the smooth operation
    of your UNIX system (such as /etc/password) left accessible to any user, serious
    problems can follow.


