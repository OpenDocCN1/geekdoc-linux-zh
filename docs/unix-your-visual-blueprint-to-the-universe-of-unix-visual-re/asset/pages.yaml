  md: '# COPY AND PASTE TEXT


    You can cut and paste words, paragraphs, and even whole pages of text in vi with
    the cut command, then paste them into a different part of your document. When
    you cut text in the UNIX CDE environment, it doesn''t disappear as if it has been
    deleted, nor does it appear in a separate screen.


    (Unlike the Windows Clipboard, UNIX won''t ask you if you want to do anything
    with text in the buffer when you exit vi.)


    In fact, the text is placed into what is called a text buffer, which is not visible
    on screen. If you''re familiar with Microsoft Windows editors, this buffer is
    also called the Clipboard.


    When you paste your cut text back into the document, note that the location of
    the paste is dependent on the location of your cursor. Be sure to move your cursor
    exactly where you want to place the text. After you paste the text the buffer
    is then free to perform a second cut-and-paste job.


