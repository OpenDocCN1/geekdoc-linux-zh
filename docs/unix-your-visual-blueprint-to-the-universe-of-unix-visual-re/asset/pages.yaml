  md: '# OPEN THE CALENDAR PROGRAM


    You can use the calendar program to create detailed schedules for appointments
    and “to do” tasks on a daily, weekly, monthly, and every basis. While you may
    consider using a more sophisticated management program if you need to plan out
    scheduling for groups of people or project tasks, the calendar program is perfectly
    acceptable for most mundane scheduling needs.


    Where the UNIX operating system’s version of the calendar program is vastly superior
    to the standard calendar utility that comes with Windows 95, 98, NT 4.0, and 2000
    is in the ease of implementing detailed schedules that stretch for months or even
    years. Also, the related ease of being able to manipulate time frames by jumping
    from a daily or weekly schedule to a year-long is a prime benefit of using the
    calendar program in the UNIX common environment.


    ![](img/62c9d4555470e74cbdf27d6e2d0b22c6_285_0.png)


    +   - Right-click anywhere on the desktop.


    +   - Click Calendar.


    +   - A pop-up menu appears.


    +   - The Calendar window appears on the desktop with today’s date highlighted.


    +   - The third button from the left is depressed. These Display buttons enable
    you to display dates differently within the Calendar window.


    +   - Choose Applications.'
  merge: -1
  pgno: 285
- img_proc: true
  md: '# Extra


    # Using Calendar with other versions of UNIX


    Luckily, the Calendar application that you''re working with is available as part
    of the CDE (Common Desktop Environment) by default. If you''re using an older
    form of Solaris that comes with CDE, or even a different flavor of UNIX that utilizes
    CDE as the desktop environment, you should have no problems using the Calendar
    program.


    # Using a calendar without CDE


    If you''re using a different kind of graphical desktop, such as OpenWindows, you
    may be able to use a different calendar utility. Which one you have depends on
    the flavor of the UNIX operating system you are using and how old it is. Keep
    in mind that other, more esoteric forms of graphical desktops may not come with
    a calendar utility at all.


