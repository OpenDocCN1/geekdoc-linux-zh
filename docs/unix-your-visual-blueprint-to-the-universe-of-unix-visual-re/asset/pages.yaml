  md: '# RUN A PROCESS IN THE BACKGROUND


    You can run a process in the background from the UNIX command prompt by adding
    an ampersand, or "&," after the process name. Often, when a process is run right
    off the command prompt, it needs to continue running for the duration of the task.
    If this is the case, then until the task finishes or you stop the process, you
    don''t return to the command prompt. That means you can''t run any other commands
    in the Terminal window.


    For example, if you start the Netscape Web browser from the command prompt, you
    can''t run any other commands until you quit Netscape. This is because until Netscape
    stops, the Terminal doesn''t display a prompt to enter commands. By specifying
    a command to run in the background, you essentially free up the command line while
    the process is still running.


    # RUN A PROCESS IN THE BACKGROUND


    ![](img/62c9d4555470e74cbdf27d6e2d0b22c6_135_0.png)


    +   - Open a new UNIX Terminal by right-clicking anywhere on the open desktop.

    - A pop-up menu appears.


    +   - Choose Tools.

    - Click Terminal.

    - A new Terminal window appears on the desktop.


    +   - If you want to run a command called tail in the background, type tail &
    at the command prompt.

    - Press Enter.'
