    There’s a lot of debate over which is. However, as a general rule, a UNIX application
    is a program that runs on UNIX for the general user. This includes text editors
    and Web browsers.


    A UNIX utility, on the other hand, is a program that administers or repairs the
    UNIX system itself. Programs that monitor performance or are used to automate
    tasks are UNIX utilities.


