    # Apply It


    Changing Directories to the Root Directory

    The highest level directory on your system is called the root directory. This
    is because the rest of the UNIX system exists on subdirectories that branch out
    from the root directory in what''s called a tree structure. In


    UNIX, the symbol for the root directory is a slash sign, so to cd to the root
    directory, type the following at the command sign, then press Enter.


    ```

