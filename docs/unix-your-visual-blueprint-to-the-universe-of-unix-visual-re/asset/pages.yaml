  md: '# About the Author


    Michael Bellomo received a degree in law from the University of California, Hastings
    College of the Law, in San Francisco. Despite this awful start, he moved into
    the technical field and became certified in UNIX System Administration at the
    University of California, Santa Cruz (go, Fighting Banana Slugs!). Michael has
    written several books on UNIX, Linux, and network management.


    # Author’s Acknowledgments


    This book is dedicated to David Marhoffer, whose crystal-clear thinking, philosophical
    steadfastness, and interest in GUIfree operating systems, has been a voice of
    reason on this side of Galt’s Gulch.


    Thanks to both Kathleen McFadden and Pat O’Brien for their expertise in navigating
    the shoals of the new Blueprint Series. Thanks for keeping us off the rocks!'
