    It is especially useful if there are multiple users logged into the machine.


    Even if your version of UNIX comes with a GUI, consider using this method to shut
    down your system when you''re performing maintenance on a multiple-user network.
    This allows you to operate more efficiently if you''re busy working outside of
    the desktop or if the desktop has difficulties.


    The most common commands used to shut a UNIX machine are variations on the shutdown
    command. Shutdown allows you to specify a certain amount of time, in seconds,
    from when you issue the shutdown command


