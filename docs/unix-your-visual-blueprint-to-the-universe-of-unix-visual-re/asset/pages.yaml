  md: '# WORKING WITH HARD DISKS AND PRINTERS


    # Apply It


    # Using the Human Option with df


    One popular (and cleverly named) option for the df command is the -h option. The
    -h is also known as the human option, because it displays the disk space results
    in the most familiar format to new users: in MB (megabytes). To use this option,
    type the following at the command line and press Enter:


    ```

    df -h

    ```


    ![](img/62c9d4555470e74cbdf27d6e2d0b22c6_196_0.png)


    ![](img/62c9d4555470e74cbdf27d6e2d0b22c6_196_1.png)


    The results of the df -k command appear. The most important column is the Capacity
    column. This shows the percentage of the partition is filled. When this reaches
    100 percent, the partition is full.


    Alternatively, you can type df at the command prompt and press Enter.


    This reports similar, but the space is listed in blocks of 512K.'
