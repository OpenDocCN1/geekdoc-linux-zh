  md: '# THE UNIX DESKTOP ENVIRONMENT


    # Apply It


    Choosing to move a file instead of making a copy of the file


    This depends on what you want to do with the file and the condition of your system.
    If your goal is to keep a backup of a file that you can edit later, you should
    use the copy commands. If you just want to make a file more accessible, you should
    simply move it from one location to another.


    Also, you should move files instead of copying them when you''re short of space.
    Making multiple copies eats space and can fill your entire system if you''re not
    careful.


    Copying files as the root account

