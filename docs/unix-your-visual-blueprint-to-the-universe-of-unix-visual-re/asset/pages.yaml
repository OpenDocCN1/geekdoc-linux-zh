  md: '# Extra


    # Command options for ping


    Command options for ping vary between different flavors of UNIX. The most commonly
    found command option that can be used with ping is -v, for verbose output. If
    you use ping -v, you get network statistics that help you estimate the speed of
    your network and whether it''s bogging down. Packet transmission times are usually
    recorded in milliseconds.


    # Machine connectivity to check with ping


    You can check any machine that hooks up to another machine with ping. You can
    ping from PCs, UNIX servers, and laptops to routers, mail servers, and remote
    hosts. Basically, if you can remotely log into it, you can ping it.


    # Other commands that can test network connectivity


    Other commands that perform a similar function include spray and telnet. However,
    spray doesn''t provide you with a verbose option, and using telnet can hang your
    machine if a connection fails. Ping is still your best option.


    ![](img/62c9d4555470e74cbdf27d6e2d0b22c6_268_0.png)


    ![](img/62c9d4555470e74cbdf27d6e2d0b22c6_268_1.png)


    If there is connectivity between the two machines, then a response is sent back
    from the ping command, usually something like host is alive.


    If ping can''t establish a connection with another machine, then you either get
    no response or a message like host not responding.'
  merge: -1
