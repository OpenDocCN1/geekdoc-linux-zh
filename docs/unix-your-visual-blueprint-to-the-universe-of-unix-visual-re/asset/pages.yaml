  md: '# REVIEW SETUP FOR NETSCAPE COMMUNICATOR


    You can install the Netscape Web browser on your UNIX machines from CD-ROM or
    disk. A Web browser is a program that provides you with a graphical interface
    for the Internet. By clicking the appropriate fields and buttons, you can navigate
    to any point or Web site on the World Wide Web, search for any information, or
    bookmark a site that you like so that you can return to it with a single click.


    Most UNIX systems have the Netscape Web browser pre-installed. If you don''t have
    this Web browser available, you can install it from CD-ROM or floppy disk. Before
    you actually start the installation procedure, your first step should be to read
    the documentation that comes with Netscape to ensure that you have the right version,
    and that you have a machine with enough space and memory to handle Netscape.


