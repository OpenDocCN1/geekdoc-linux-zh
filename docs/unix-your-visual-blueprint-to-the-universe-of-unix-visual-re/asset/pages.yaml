  md: '# TEST A NETWORK CONNECTION VIA IP ADDRESS


    You can use ping to test whether your UNIX machine can talk to other computers
    on the network if you don''t know the name of the machine you''re trying to connect
    to. Whether you simply lack the name of the host machine, or if it is not correctly
    registered in your network''s local network maps, you can still use ping to your
    benefit. Therefore, you can see if there is connectivity between two computers
    on your network.


    Since ping is based on the TCP (Transport Control Protocol) packet, it can read
    an IP address (Internet Protocol) that you give it and locate a machine in fashion.
    It is a quartet of numbers, such as 117.56.3.11, that helps computers determine
    exactly where on the machine is. If there is connectivity between two machines,
    you get a response back from the ping command; if not, then ping will return anything
    at all. The syntax for the ping command is <ip address>.


