  md: '# KILL HUNG PROCESSES


    You can stop hung processes with the appropriately named kill command. A hung
    process is one that simply refuses to exit once you start it. Hung processes can
    slowly down or crash your system, and they usually depend on you of the command
    prompt if you''ve started the process in a UNIX terminal.


    However, even the garden-variety kill command, as discussed in Chapter 7, will
    sometimes not work on a command that is hung. In this case, you may need to use
    the variant of kill called -9. Kill -9 sends a much stronger signal to the process,
    essentially acting as a Force Quit command in Microsoft Windows.


    Kill will terminate a process by sending a special signal that UNIX programs understand
    as a “terminate now” signal. This signal is also called SIGHUP, for “signal —
    hang up”, which indicates that a process should exit as soon as it able.


    ![](img/62c9d4555470e74cbdf27d6e2d0b22c6_275_0.png)


    +   - Open a new UNIX terminal by right-clicking anywhere on the open desktop.

    - The Workspace Menu appears.

    - Choose Tools.


    +   - Click on Terminal in the submenu that appears.

    - When you select Terminal, the pop-up menu disappears and a new Terminal window
    appears on the desktop.


    +   - Press Enter.

    If the process is a vi process, searching for it by typing ps -aef | grep vi at
    the command prompt.'
  merge: -1
  pgno: 275
- img_proc: true
  md: '# Extra


    # Why is the kill -9 option more powerful than the regular kill command?


    Kill essentially sends an electronic signal to a given process. It tells it to
    “hang up,” or gently shut down. With kill -9, the process will shut down, but
    it won''t go through its polite shutdown procedures. It might dump or otherwise
    leave its work unfinished. Therefore, when you kill -9, you should always do so
    sparsely.


    # What is a core dump?


    A process core dumps when it exits abruptly. When core dump occurs, the process
    creates a file of jumbled data called a core file. Programmers who are writing
    new software can untangle core files, but for the general user, they take up a
    lot of space and should be promptly removed.


    # Are there other kill options, like -6 or -8?


    Yes. Each performs functions, but they’re a little more esoteric than the common
    ones. As a general rule, the higher number, the more powerful the shutdown process.


    ![](img/62c9d4555470e74cbdf27d6e2d0b22c6_276_0.png)


    ```

    # ps -aef grep vi

    root 1154 1133 0 Apr 16 pts/2 0:00 /bin/sh -c dtfile -nowview

    root 1158 1155 0 Apr 16 pts/2 0:00 dtfile -nowview

    root 1155 1154 0 22:39:52 pts/3 0:00 grep

    root 1155 1154 0 Apr 16 pts/2 0:38 dtfile -nowview

    # kill -9 1155

    ```


    ![](img/62c9d4555470e74cbdf27d6e2d0b22c6_276_1.png)


    ```

    # ps -aef grep vi

    root 1154 1133 0 Apr 16 pts/2 0:00 /bin/sh -c dtfile -nowview

    root 1158 1155 0 Apr 16 pts/2 0:00 dtfile -nowview

    root 1155 1154 0 22:39:52 pts/3 0:00 grep

    root 1155 1154 0 Apr 16 pts/2 0:38 dtfile -nowview

    # ps -aef | grep vi

    root 1154 1133 0 Apr 16 pts/2 0:00 /bin/sh -c dtfile -nowview

    root 1158 1155 0 Apr 16 pts/2 0:00 dtfile -nowview

    root 1155 1154 0 22:39:52 pts/3 0:00 grep

    root 4512 4994 0 22:39:22 pts/3 0:00 grep

    ```


    After you locate the PID (process ID number), type in kill -9 and the PID.


    You can double-check that the process has been killed by typing ps -aef | grep
    vi, then pressing Enter.


    If the process has been successfully killed, it will not show up on the new search.'
  merge: -1
  pgno: 276
