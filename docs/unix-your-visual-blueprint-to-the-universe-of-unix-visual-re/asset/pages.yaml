  md: '# Extra


    Setting up an IMAP server

    POP and IMAP are different mail servers in that they use slightly different protocol
    systems to handle the data that makes up your electronic mail. By default, Netscape
    adds a POP server, as noted on the dialog box when you add a new server.


    Changing a server from POP to IMAP without changing the server''s name

    Instead of clicking Add in the Mail Servers screen, highlight the current mail
    server by selecting the listing in the Incoming Mail Servers screen. Next, click
    Edit instead of Add. In the dialog box, you can change the setting as I describe
    in the previous tip.


    To add an IMAP server, simply click the POP button next to Server Type in the
    dialog box. You can select IMAP from the pop-up menu.


    ![](img/62c9d4555470e74cbdf27d6e2d0b22c6_236_0.png)


    ![](img/62c9d4555470e74cbdf27d6e2d0b22c6_236_1.png)


    +   5 Click Add to the name of a mail server.


    > A dialog box appears where you can type the server name in the open field, and
    when the server requires it, a User name.


    +   6 Type the appropriate information for your situation.

    7 Click OK when you finish.


    +   8 Close the window by clicking the Close button - X in the upper right-hand
    corner - return to the Netscape browser.'
