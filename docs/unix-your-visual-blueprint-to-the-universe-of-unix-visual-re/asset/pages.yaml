  md: '# LIST RUNNING JOBS


    You can list all jobs or tasks that are currently running on your UNIX machine
    with a single command: jobs. The jobs command is, like many of the older commands
    used in the UNIX terminal, a less flexible and sophisticated command. What it
    lacks in additional utilities, it makes up for speed and general usefulness in
    its basic state.


    The jobs command is, in some ways, similar to the history command discussed earlier
    in this chapter under the spread, Using History to Review and Repeat Commands.
    However, there are some key differences. First, the jobs command lists only tasks
    that are still in progress; the history command lists only what has been run and
    completed. Second, the history command lists names, while jobs actually lists
    the name of the job, regardless of the process name that is used to fulfill the
    task.


    ![](img/62c9d4555470e74cbdf27d6e2d0b22c6_323_0.png)


    +   - Open a new UNIX terminal by right-clicking anywhere on the open desktop.


    +   - The main pop-up menu appears.


    +   - Click Tools.


    +   - Click Terminal.

    The pop-up menu disappears and a new Terminal window is displayed on the desktop.


    +   - At the command prompt, type jobs.


    +   - Press Enter.'
  merge: -1
  pgno: 323
- img_proc: true
  md: '# ADVANCED SYSTEM ADMINISTRATION


    # Apply It


    Uses for a job''s Process ID number


    The Process ID number gives you useful information on a process that is being
    used to complete a job. For example, it allows you to get the nice priority of
    the process with the p command, as shown in the earlier task "View Nice Priorities."


    Limits to the number of jobs that can be displayed using the job command

    There technically no limits to the number of jobs that can be displayed in the
    job list of running tasks. However, executing jobs is much like taking a snapshot
    of jobs running on your computer at any time. After a job exits, the jobs command
    does not report it. You have to run jobs again to see if the task is still running.


    ![](img/62c9d4555470e74cbdf27d6e2d0b22c6_324_0.png)


    ![](img/62c9d4555470e74cbdf27d6e2d0b22c6_324_1.png)


    +   - The running jobs are listed by number in the left-hand column. You can see
    which job is running by looking at the listing in the right-hand column.


    +   - To view the running job''s Process ID number, use the -1 command option
    by typing jobs -1 at the command prompt and press Enter.'
  merge: -1
