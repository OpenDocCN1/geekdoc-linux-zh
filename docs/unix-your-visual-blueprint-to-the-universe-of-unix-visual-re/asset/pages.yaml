  md: '# Extra


    Leaving sessions open

    UNIX doesn''t automatically log out, so you don''t have to take action. However,
    leaving sessions open and unattended is strongly discouraged. Aside from taking
    system resources, this is a major security risk, especially if you are logged
    in as the root administrator account.


    Recovering from a power outage

    Turn off all the UNIX machines on your network. Since you can''t perform a standard
    shutdown with the loss of power, simply press the power switch on each machine.
    This is important, since it prevents power spiking when the electricity is restored,
    which can blow a fuse. When the power is restored, start your UNIX machines one
    at a time to gently bring power usage to what it was before.


