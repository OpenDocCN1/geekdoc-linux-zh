  md: '# COPY FILES AND DIRECTORIES


    You can copy files and entire directories in UNIX with the cp, or copy, command.

    When you copy a file, you can create an exact duplicate of the file with a new
    name.

    You also can create a duplicate of the file with the same name, but only if you
    save the file to a different location.


    When you recursively copy a directory, you copy the directory and all of the files
    inside it.

    If you''re just renaming a directory, the path of the files and subfolders in
    the directory are automatically altered to reflect the change.

    You don''t need to specify a recursive change.


    The UNIX operating system treats everything as a file, including directories.
    However, you use the -R command option when you copy entire directories. The -R
    stands for recursive.


    # COPY FILES AND DIRECTORIES


