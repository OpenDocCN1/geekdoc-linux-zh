  md: '# EXECUTUTING A SHELL SCRIPT


    You execute a shell script in UNIX by simply typing it in the command prompt and
    pressing Enter, the act you start a program or UNIX system utility. This is because
    to the UNIX operating system, every object on the system is a file — and is therefore
    treated similarly. Scripts are permitted the same way as programs or utilities,
    so executing them is exactly the same.


    A shell script, or script for short, is a file that contains a series of commands
    for the UNIX system to follow. Sometimes they come with the UNIX system, but more
    often they are put together by a UNIX system administrator to accomplish a system-specific
    task (such as cleaning up directories so they don''t fill up a disk partition).


    Incidentally, executing a script isn''t as bad as it sounds. This is UNIX-speak
    for starting a shell script.


