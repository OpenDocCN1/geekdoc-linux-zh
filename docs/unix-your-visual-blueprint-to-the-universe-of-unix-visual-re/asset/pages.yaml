  md: '# SET APPOINTMENTS WITH THE CALENDAR’S DAY VIEW


    A major benefit using the Calendar application on CDE in UNIX is that you can
    literally plan out a day on an hour-by-hour basis. This is especially helpful
    in today''s business environment for two major reasons.


    essential that any daily planner be broken down into hour-long blocks for concise
    order.


    First, the average committee-style meeting is now intended to last longer than
    60 minutes, as this is the determined upper limit for an average attention span.
    Second, the average day becoming more filled with appointments, meetings, and
    it is


    The most common use of the Day View in the Calendar application is to take full
    advantage of the splitting of the day into one-hour slots that you can add appointments
    to. By taking these appointments and displaying them in either the daily or monthly
    screen format, you can keep your schedule easier than you had to switch back and
    forth between a daily planner and a month-long desktop calendar.


