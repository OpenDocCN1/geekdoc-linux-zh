  md: '# STOP PERSISTENT PROGRAMS


    You can stop programs that fail to respond to the initial kill command. In a small
    percentage of cases, a program doesn''t respond to the kill command properly.
    It tends to happen on a busy machine with dozens of different processes running.
    It can well mean that the process is so busy and CPU time so limited that the
    process can''t complete its exit cycle.


    In this case, you still need the kill command, but with a special option, -9.
    The kill -9 command is equal of the Force Quit in the Microsoft Windows world.
    No matter where the program is, in mid-command or near the end, the program terminates
    immediately. This may produce a core file, which you must delete.


    # STOP PERSISTENT PROGRAMS


    ![](img/62c9d4555470e74cbdf27d6e2d0b22c6_143_0.png)


