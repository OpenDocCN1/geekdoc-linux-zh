  md: '# CUSTOMIZE YOUR SCREEN SAVER


    Screen savers are programs that automatically start after your computer is left
    inactive for a set amount of time. Screen savers serve several purposes, depending
    on how you configure them.


    image can literally get burned into the screen, blurring any new image that appears.
    A constantly changing pattern on the screen prevents burn-in.


    The main purpose of a screen saver is to prevent screen burn-in. The image on
    a computer screen is composed of phosphor dots that glow when struck by electrons.
    If the image doesn''t change for a long time, that


    Screen savers also reduce the amount of power expended by a computer because the
    processes take less energy to run and the screen is, on the average, darker than
    when in use. Finally, you find out how screen savers can act as a security measure
    if set properly.


    ![](img/62c9d4555470e74cbdf27d6e2d0b22c6_53_0.png)


    ![](img/62c9d4555470e74cbdf27d6e2d0b22c6_53_1.png)


