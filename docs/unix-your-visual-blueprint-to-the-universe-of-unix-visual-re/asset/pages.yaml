  md: '# NETWORK CONNECTIVITY


    # Extra


    # Machine connectivity checked with ping


    Any machine that connects to another machine can be checked with the ping command.
    You can ping from PCs, UNIX servers, and laptops to routers, mail servers, and
    remote hosts. Generally, if you remotely log into it, you can ping it.


    # When ping doesn''t respond


    There are too many possibilities to give an exact answer as to why connectivity
    failed. It can be due to heavy network traffic, or a machine that is hung on a
    process. However, the most common cause is when a code or wire is disconnected
    somewhere.


    # Other ping outputs


    When you use ping -v for verbose output, network statistics help you estimate
    the speed of your network and whether it''s bouncing down. Packet transmission
    times usually are reported in milliseconds.


    ![](img/62c9d4555470e74cbdf27d6e2d0b22c6_216_0.png)


    ![](img/62c9d4555470e74cbdf27d6e2d0b22c6_216_1.png)


    Ping reports the number of ping packets that are returned.


    Alternatively, if you know the machine''s Internet Protocol address, you can ping
    the machine by typing ping at the prompt, then typing the IP address, then pressing
    Enter.


    Again, a ping message reports the number of ping packets that are returned.'
  merge: -1
