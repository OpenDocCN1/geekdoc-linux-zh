  md: '# COMPRESS FILES


    You can use the compress utility as an alternative to tar. Compress is usually
    faster and compresses more space out of text files on average than the tar process.
    Compress has the main advantage of being available on all UNIX platforms, regardless
    of the flavor or age of the operating system. Compress is also slightly cryptic
    than tar, particularly when you specify compress to operate in verbose mode, which
    is described in the task spread following this one.


    When it comes to compressing binaries, pictures, and other files, compress is
    not as efficient as a compression process as tar. Therefore, compress is not suited
    for backing up large files or an entire system. In addition, compress isn''t designed
    to work closely with tape storage as tar. Your best use of compress is a storage
    utility to place amounts of text into a directory set aside for compressed files.


