  md: '# Extra


    # Counting characters with cmp


    cmp always starts at 1. Therefore, the second character in a line is number 2,
    the third number 3, and so on.


    cmp counts spaces as characters

    A space, although nothing is printed on screen, which UNIX reads as a form of
    input. Seven spaces on a line, followed by one letter, causes cmp to count the
    letter as the eighth character.


    # When two files are absolutely identical in every way


    cmp has no differences to report back to you. In true UNIX fashion, cmp doesn''t
    give you a message saying These files are the same. Instead, the cmp command is
    silent, and returns you to the command prompt for further input.


    ![](img/62c9d4555470e74cbdf27d6e2d0b22c6_120_0.png)


