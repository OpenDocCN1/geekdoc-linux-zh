  md: '# COMMAND AND INSERT MODE


    You can only be in one of modes in the vi editor. You switch between two modes
    depending on what you wish to do in the document. In Command mode, you move within
    the document, change formatting, delete text, quit, or save the document. In Command
    mode, you can''t add text.


    Every time you start vi, you start in Command mode. There are several ways to
    get into Insert mode. To get back into Command mode, there is only one — pressing
    the Esc key, also known as the Escape key. On most keyboards, this key is in the
    upper left-hand corner.


