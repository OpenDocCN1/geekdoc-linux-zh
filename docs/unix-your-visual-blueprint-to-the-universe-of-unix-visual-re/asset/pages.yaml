  md: '# LOGGING INTO UNIX


    # Extra


    Using the shutdown, init 6, or reboot commands

    when rebooting


    Both shutdown and init 6 do the exact same tasks when it comes to allowing your
    machine to reboot. However, using shutdown gives you time between typing the command
    and initiating it, if you want to shut down programs manually. It also notifies
    any other users on the system of the impending reboot.


    Init 6 and reboot are more similar to the halt command in that they don''t send
    notification to other users, and they aren''t careful to ensure that running programs
    are shut down without the possibility of corruption. Consider using sync with
    these commands.


    Other keyboard shortcuts to reboot the system


    On Solaris machines, you can press the Stop and the A keys simultaneously to stop
    the machine. On other forms of UNIX, press Ctrl+Alt+Del to reboot the system.


