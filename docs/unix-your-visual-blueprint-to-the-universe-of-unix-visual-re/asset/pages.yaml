    a new Terminal window appears on the desktop.


    +   3. A pop-up menu appears.


    +   4. To see the last 10 lines of a file, type tail and the name of the file
    at the command prompt.


    +   5. For example, to see the first 10 lines of a file called quote, type tail
    quote quote at the command prompt.


    +   6. Press Enter.


    +   7. Choose Tools.'
