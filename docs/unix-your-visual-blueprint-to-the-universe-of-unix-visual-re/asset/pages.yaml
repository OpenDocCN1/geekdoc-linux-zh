  md: '# INSTALL THE NETSCAPE WEB BROWSER


    MOost UNIX workstations come with a Web browser installed. In the case of Solaris,
    one of two browsers normally is available to you. You may have Netscape already
    installed for you. However, if you do not, a Sun-based browser is normally included
    — Hotjava. Hotjava works well on all types of computers that run a version of
    Solaris, Sun’s “flavor” of UNIX. However, it’s best to be familiar with installing
    and working with Netscape’s Web browser — this program is commonplace in the UNIX
    world.


    The Netscape Web browser is now packaged with an installation program (also called
    an installation engine in some circles) that makes installing Netscape very easy.
    Starting the installation program and accepting the default locations for Netscape
    to install its components works for nearly every UNIX machine.


    # INSTALL THE NETSCAPE COMMUNICATOR WEB BROWSER


    ![](img/62c9d4555470e74cbdf27d6e2d0b22c6_227_0.png)


    +   In the File Manager window displaying the contents of the CD-ROM, double-click
    the installer icon.


    +   A terminal window opens, followed by an Installer screen. The Installer screen
    may take a few seconds to appear.


    +   Click Next to begin the Installer process. The Installer guides you through
    the installation process, much like a Windows Wizard program.


    ![](img/62c9d4555470e74cbdf27d6e2d0b22c6_227_1.png)'
  merge: -1
  pgno: 227
- img_proc: true
  md: '# Extra


    # Installing Netscape from a floppy disk


    The procedure for installing the Netscape Web browser from a floppy disk is exactly
    the same as installing from a CD-ROM, with one exception. To open the CD-ROM and
    view the readme and installation files, you must open the Files drawer and choose
    Open Floppy instead of Open CD-ROM.


    # Installing Netscape from the Web


    This is slightly more difficult because you need two computers for this task.
    Unless you HotJava, you need another computer with a working Internet connection
    to get to the Netscape site. On the site, there are directions to download the
    installation to a floppy disk. Take this floppy disk to your UNIX machine and
    open the Netscape Web browsing program as I describe in the prior tip. Then install
    the browser as in this chapter’s task “Installing the Netscape Web Browser.”


    ![](img/62c9d4555470e74cbdf27d6e2d0b22c6_228_0.png)


    ![](img/62c9d4555470e74cbdf27d6e2d0b22c6_228_1.png)


    +   3. On the Select Installation Type screen, choose Default Install by clicking
    the Default Install button.


    +   4. Click Next.


    +   5. Finally, on the Ready to Install screen, click Install Now. Netscape installs
    automatically, and you are returned to the desktop.'
  merge: -1
