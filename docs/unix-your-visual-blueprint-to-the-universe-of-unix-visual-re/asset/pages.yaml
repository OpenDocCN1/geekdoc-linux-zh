  md: '# Extra


    # Printing the information in the readme file


    You can do this by choosing File:Print in the Text Editor menu. (For this to properly,
    you must have at least one printer configured for your system. See Chapter 11,
    "Adding Printers," for more information.)


    # Finding readme files in other languages


    The en stands for the language that the file is written in. En is for English,
    fr for French, and so on.


    # Applying Release Notes


    Release Notes are final bits of documentation that the software company places
    on a disk or CD-ROM that were too late to be included in the software manual (if
    there is one). It''s always a good idea to skim through a Release Notes document
    in case a bug for your specific setup was discovered at the last minute.


