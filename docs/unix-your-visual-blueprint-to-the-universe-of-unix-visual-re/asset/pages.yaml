  md: '# THE GRAPHICAL USER INTERFACE


    The UNIX operating system was originally developed without a GUI, or Graphical
    User Interface. This was mostly was because of the slow speed and high price of
    early computers. Today, most forms of UNIX use a GUI for some kinds of system
    configuration and user navigation.


    with UNIX is called the CDE Desktop Environment. CDE itself stands for Common
    Desktop Environment. It''s the standard offering with most forms of UNIX, such
    as Solaris.


    Like Microsoft Windows, the UNIX desktop uses icons and toolbars to display information
    and allow you to access programs with the click of a mouse. While the exact icons
    on your screen depend on utilities you choose, your desktop should look similar
    to the following diagram.


    The toolbar at the base of the screen contains most of the configuration controls
    for UNIX environment in CDE. Any aspect of your UNIX machine that can''t be controlled
    from here changes through the UNIX terminal.


    Each icon on the toolbar accesses system tools or applications. Click the small
    arrows located directly above the pictures; the menu options slide like a drawer.
    Select your choice by clicking on the option.


    The desktop that provides the background for the windows, icons, and other objects
    that you work


    ![](img/62c9d4555470e74cbdf27d6e2d0b22c6_17_0.png)


    ![](img/62c9d4555470e74cbdf27d6e2d0b22c6_17_1.png)


    +   - File Manager opens when double-clicked. It displays your home directory
    and moves between directories.


    +   - Trash is where you move items to delete. Items moved to the Trash stay until
    you empty the Trash Can.


    +   - Cards activates calendar-oriented objects, such as a day planner and simpler
    tools.


    +   - Applications start a text editor for writing documents, or other programs.


    +   - Links controls your Internet access. You call Webbased information and your
    Web browser from here.


