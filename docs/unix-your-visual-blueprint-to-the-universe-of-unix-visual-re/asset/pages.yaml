  md: '# Extra


    login doesn''t work for some machines

    Some UNIX machines remain on a network but refuse login attempts. Machines set
    up in this manner are known as restricted hosts. This option was more valuable
    when there weren''t as many safeguards you could implement, but today it''s more
    inconvenient than anything else.

    The only way to get onto a restricted host is to try a different login tool, such
    as telnet, or to ask the machine''s administrator to remove the restriction.


    What to do when login “hangs"

    When the login prompt hangs (stays on the screen without connecting), you do not
    return to your command prompt. You can either wait five minutes for the login
    process to automatically time out, or you can attempt to kill the process. You
    can also try pressing Ctrl+C — you may be able to cancel the login process from
    the screen.


    ![](img/62c9d4555470e74cbdf27d6e2d0b22c6_218_0.png)


    ![](img/62c9d4555470e74cbdf27d6e2d0b22c6_218_1.png)


