- img_proc: true
  md: '# Extra


    # Printing a Web page


    When you have a printer set up in UNIX, simply click the Print button whenever
    you want to print the page you''re visiting.


    # Jumping to a site visited before


    You have two options available. You can either hit the Back button three or four
    times, or you can bookmark the site. While on the page you plan to return to,
    click the Bookmarks button on the left side of the screen and choose Add Bookmark.
    The Web page''s name appears in the list of bookmarks that show whenever you click
    the Bookmark button.


    # Sources of all other bookmarks in the Bookmark utility


    The Bookmark utility is pre-loaded with sites that Netscape thinks you may find.
    For example, clicking the Search button gives you a choice of different search
    engines recommended by Netscape. You can also find the Search setting under your
    Bookmark menu.


    ![](img/62c9d4555470e74cbdf27d6e2d0b22c6_234_0.png)


    ![](img/62c9d4555470e74cbdf27d6e2d0b22c6_234_1.png)


    +   - The Back and Forward buttons enable you to move among the multiple Web sites
    you visit during your Internet session.


    +   - As with most of the buttons in the Netscape window, you can place your mouse
    over the button for a few seconds and read the button''s function from the pop-up
    text.


    +   - The final button you need to be familiar with the start is the Home button.
    This button acts like the cd command in the UNIX Terminal. When you need to return
    to your starting point, also called your home page, click here.'
