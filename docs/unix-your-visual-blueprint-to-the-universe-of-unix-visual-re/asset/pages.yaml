  md: '# OPEN THE MAILX PROGRAM


    You can use mailx as your e-mail program if your version of UNIX doesn''t come
    with the Netscape web browser, or run UNIX without a graphic desktop. Mailx is
    a very basic e-mail program that works in all versions of UNIX. It''s as old as
    the hills — predates Netscape''s mail program, and doesn''t use a GUI of any kind.
    When you work with mailx, you type commands in the UNIX Terminal. You don''t use
    your mouse to operate any part of mailx.


    The advantage to choosing mailx as your e-mail program is that it''s completely
    native to UNIX, making it very stable. It''s also faster, on average, than Netscape
    mail because it has no pictures to display. On the other hand, you may experience
    difficulties when receiving pictures as e-mail attachments or even HTML fragments
    in mailx. If you get a lot of .jpg or .bmp files, you may want to use Netscape
    Messenger instead.


    # OPEN THE MAILX PROGRAM


    ![](img/62c9d4555470e74cbdf27d6e2d0b22c6_239_0.png)


    +   1. Right-click anywhere on the open desktop.


    +   2. Choose Tools.


    +   3. A new Terminal window appears on the desktop.


    +   4. At the command prompt, mailx.


    +   5. Press Enter.


    A pop-up menu appears.'
  merge: -1
  pgno: 239
- img_proc: true
  md: '# Extra


    Getting more help in mailx with a new command


    Mailx gives you the appropriate reminder when starting; it tells you to type a
    question mark, or at the mailx prompt and press Enter. This provides you with
    a list of commands you can use.


    Sending Microsoft Word documents or MP3 sound files to mailx


    Mailx has less trouble handling properly packaged sound formats, such as MP3.
    Word files sent to mailx don''t display properly unless you save the files on
    your hard drive and open them with a UNIX-based word processor, such as WordPerfect
    or Applic. Your best bet when sending mailx text attachments is to save the document
    as Text Only.


    ![](img/62c9d4555470e74cbdf27d6e2d0b22c6_240_0.png)


    ![](img/62c9d4555470e74cbdf27d6e2d0b22c6_240_1.png)


    The mailx program starts, displaying its version and the mailx in your inbox.


    Note: You can always tell when you''re still in the mailx program by its distinctive
    command prompt, a question mark, ?


    Alternatively, you can start mailx by typing Mail at the command prompt.


    Press Enter.'
  merge: -1
