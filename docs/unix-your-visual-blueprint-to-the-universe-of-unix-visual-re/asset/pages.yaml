  md: '# CREATING TEXT FILES


    # Extra


    # Choosing the vi editor


    The vi editor is used because compared to other graphics-based editors, vi doesn''t
    perform such tasks as formatting and font changes. Such formats make a printed
    document look good, but make a log file or script confusing to read.


    The vi editor is one of the oldest utilities, dating back to the original creation
    of UNIX itself. Vi was developed at a time when UNIX machines didn''t even use
    monitors — they used teletype machines. To save paper, the vi editor — and by
    extension, all of UNIX itself — is very light on any graphics and long-winded
    messages.


    # Limitations on naming a file vi


    Because vi creates files as touch and mkdir, the same restrictions apply — do
    not name your file, . . . or / . It''s a good idea to make the name unique and
    not use any slashes in your file name.


