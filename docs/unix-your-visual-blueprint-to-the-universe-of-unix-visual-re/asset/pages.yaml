  md: '# WORKING WITH PROCESSES


    # Extra


    # Variations between flavors of UNIX


    The way the ps command works depends on the flavor or brand of UNIX you''re using.
    Remember that the version of UNIX you''re using can be Solaris, SunOS, HP-UX,
    Xenix, or Irix. In some of these different types of UNIX, the command options
    may be different. Some machines use ps -aeF while others use ps -aux to get results.


    # Identifying whether grep is running


    Usually, you see the grep process as part of ps readout. That''s because ps is
    taking a snapshot of what you''re running as it works. If the grep command happens
    to finish before ps finishes, you don''t see it in the list. Either way, it doesn''t
    affect your process search.


    ![](img/62c9d4555470e74cbdf27d6e2d0b22c6_128_0.png)


    ![](img/62c9d4555470e74cbdf27d6e2d0b22c6_128_1.png)


    | # ps -ef 1 grep telnet |

    | james 551 7374 0 00:14:01 pts/2 0:00 telnet |


    | # ps -ef 1 grep telnet |

    | root 243 205 0 00:11:08 pts/2 0:00 telnet |

    | james 551 7374 0 00:14:01 pts/3 0:00 telnet |


    +   UNIX returns the matches for the search. In this case, UNIX returns.


    +   Similarly, to search for all the currently running processes called "telnet",
    ps -def | grep telnet, then press Enter.


    +   UNIX returns two telnet processes, one run by james, the other by the root
    account.


    Note: The one process currently running that user account james has started.'
  merge: -1
