  md: '# CONNECT WITH RSH — THE REMOTE SHELL


    You use the remote shell, or rsh command, to connect a remote host with your local
    group of machines. By typing rsh <hostname> into the machine and you work remotely.
    You can also use the rsh command through the IP (Internet Protocol) address of
    a machine when you''re not sure of a machine''s name. Although rsh is less sophisticated
    than telnet or login, it''s effective for a quick login and limited remote work
    on other machines.


    Rsh is used less commonly than telnet or login. It''s used mostly for intra-system
    remote logins (within the network) versus inter-system logins (outside the network).
    Also, rsh only works on machines running UNIX and other variants of the UNIX operating
    system, such as Linux. You can''t rsh into a machine that runs Novell or Microsoft
    Windows NT, 95, 98, or 2000.


    ![](img/62c9d4555470e74cbdf27d6e2d0b22c6_221_0.png)


    ![](img/62c9d4555470e74cbdf27d6e2d0b22c6_221_1.png)


