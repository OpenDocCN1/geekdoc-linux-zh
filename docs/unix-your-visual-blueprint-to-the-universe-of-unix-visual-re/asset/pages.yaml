  md: '# SET UP NETSCAPE TO RECEIVE E-MAIL


    You can also configure Netscape to handle your electronic mail (e-mail) for you,
    when sending and receiving e-mail. Although not as efficient as UNIX-based e-mail
    programs that come with UNIX, most people find the graphic style easier to use.


    server is also sometimes called a POP server, due to the specific protocols it
    uses to hold and send e-mail.


    In this configuration area, you can also edit what identity you plan to give over
    the Web via e-mail. While you can send e-mail anonymously, or, on the other extreme,
    provide detailed personal or business information.


    To send and receive e-mail, your Web browser must be set up to connect to a specific
    machine that is set up to handle e-mail, normally called a mail server. This kind
    of


