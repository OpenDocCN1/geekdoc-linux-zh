  md: '# COMPARING TEXT FILES WITH cmp


    You compare the contents of two files, no matter how similar they are, using the
    cmp command, which is short for compare, lets you determine where one file differs
    in content from another. The syntax for the cmp command is as follows: cmp <file1>
    <file2>.


    the difference occurs on. So, if the first character on the first line in a document
    is the location of a difference, cmp reports that the location is char 1 (first
    character), line 1.


    If you''re dealing with slightly larger files, you may not be where 56 out of
    100 really is. In these cases, it''s helpful to use the cat command to display
    the file, with line numbers between files to see the differences between the files''
    contents.


    When the cmp command finds a discrepancy between two files, it gives the location
    of the difference in terms of number of characters from the start of the file,
    and the line number


    # COMPARING TEXT FILES WITH CMP


    ![](img/62c9d4555470e74cbdf27d6e2d0b22c6_119_0.png)


