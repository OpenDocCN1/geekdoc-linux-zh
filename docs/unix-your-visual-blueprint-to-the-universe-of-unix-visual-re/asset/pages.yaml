  md: '# RESTORE FILES WITH TAR


    You can restore files that you''ve backed up with the tape archive utility using
    the same tar command. However, you''ll be using tar with different command options.
    The key difference is that the restoration process uses the x command option,
    which stands for extract.


    The most important task you should complete before restoring a compressed file
    with tar is to make sure that you have enough space on your hard drive to accommodate
    the restored file. When you restore a file with the tar command, keep in mind
    that you''re returning the file to its full size. A compressed tar file can expand
    up to 50 percent larger when you restore it.


    You''ll be restoring files most frequently after you''ve completed some major
    system upgrade. Another possibility is that you''re restoring the entire UNIX
    system from a system crash. Untaring files for this purpose is also called restoring
    the system.


    # RESTORE FILES WITH TAR


