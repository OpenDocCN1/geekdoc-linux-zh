  md: '# OPEN THE PRINT MANAGER


    You can open the Print Manager on the UNIX desktop to see printers and print jobs
    on your system. Printers punch, spray, burn, or fuse ink onto paper. Next to actually
    starting the UNIX operating system, administering Print Manager is the most important
    task in running a UNIX machine in a public environment.


    it''s worthwhile to learn how to effectively add and configure printers in UNIX.


    The Print Manager shows which prints go to each printer. When a print job must
    wait for the printer to finish another job, it is spooled (stored) on the hard
    drive or the printer itself. When many jobs spool on one printer, send more print
    jobs to the less-used printers.


    The volume of printing in any office, college, or laboratory far outweighs any
    other request. So


