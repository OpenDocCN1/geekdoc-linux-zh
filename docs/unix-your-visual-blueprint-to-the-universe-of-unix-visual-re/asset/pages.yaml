    After you select Terminal, the pop-up menu disappears and a new Terminal window
    appears on the desktop.


    +   4 Type cmp followed by the names of the two files you want to compare at the
    command prompt.

    5 For example, to compare the contents of files and sayings, type cmp quote sayings.

