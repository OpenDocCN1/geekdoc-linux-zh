  md: '# REMOVE APPOINTMENTS IN THE CALENDAR’S DAY VIEW


    You can easily remove a previously inserted appointment from the Calendar application.
    You can only perform this operation via the Calendar Day view. However, if you
    need to remove an appointment that is repeated in frequency or duration, the flexibility
    of the UNIX Calendar application enables you to save time and reduce repetitive
    effort.


    For example, your organization decides to cancel the budget committee council
    that met every week at noon on Thursday for the next three weeks, but plans to
    resume the remaining councils afterwards. Luckily, you''re not limited to either
    removing the meetings for the next three weeks at a time. Nor do you have to remove
    all the council meetings and replace the remaining council meetings after the
    three-week hiatus. Instead, the application is flexible enough to allow you to
    remove the three meetings one by one and leave the rest untouched.


