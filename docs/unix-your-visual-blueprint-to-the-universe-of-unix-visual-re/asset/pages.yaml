    The word count command is a relatively primitive one, designed for maximum speed
    in execution. When you use wc, you get an accurate count and display of the components
    of a given document, but you cannot use wc to edit a file, let alone tell you
    what new material has been deleted or added to a file if the word count is different.
    To perform a more thorough displaying of a file, use the more command. To actually
    edit the file, use the vi editor, as described in Chapter 5.


    # Counting spaces between words


    A computer sees the blank space that is created between words as an electrical
    impulse that is recorded. Therefore, even a space, tab, or a hyphen is actually
    counted as a character by the wc program.


    ![](img/62c9d4555470e74cbdf27d6e2d0b22c6_322_0.png)


    ![](img/62c9d4555470e74cbdf27d6e2d0b22c6_322_1.png)


    +   The results are given as a set of three numbers: the number of sentences in
    the document, the number of words, and finally the number of characters in the
    document.


    +   If you just want to count the number of characters in the document, use the
    -c command option. At the command prompt, type wc -c <filename> and press Enter.'
  merge: -1
