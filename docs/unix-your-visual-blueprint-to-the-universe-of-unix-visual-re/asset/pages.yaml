  md: '# # FIND FILES IN THE UNIX TERMINAL


    You can use the **find** command to locate files. Whether you missplace a file,
    copy it to an area that you shouldn''t, or simply can''t remember something is,
    **find** searches an area of the system for the missing file.


    It''s important to know where you begin your search. Searching from a directory
    that''s more than three subdirectories away means you''ll spend too much time
    waiting for UNIX to go through a massive number of files. On the other hand, you
    can''t find the file if you want under /var when the file is in the directory
    tree.


    Luckily, **find** is automatically recursive, meaning that it searches all the
    subdirectories under a given point. For example, if you specify /var as the starting
    point for the search, **find** searches /var, /var/subdirectory, and so on.


    The command command uses the format: `find <search point> <command option> <file
    name>`.


    ![](img/62c9d4555470e74cbdf27d6e2d0b22c6_61_0.png)


    +   1 Open a new UNIX Terminal by right-clicking anywhere on the desktop.


    +   - A pop-up menu appears.


    +   2 Choose Tools.


    +   3 Click Terminal from the submenu that appears.

    - When you select Terminal, the pop-up menu disappears and a new Terminal window
    appears on the desktop.


    +   4 Type **find** at the command prompt.

    - The period tells UNIX to search only the directory you''re currently in.'
  merge: -1
