- img_proc: true
  md: '# Extra


    Correcting if cron program ran at the wrong time

    To begin with, double-check the time you enter into crontab. The most common mistake
    is where people neglect to adjust the time to a military standard. Four in the
    afternoon is not 04 —that four in the morning. The appropriate number for the
    afternoon time slot is 16.


    Note that different machines on the same network can show different times! Just
    because the main server says it noon doesn''t mean the outlying computers won''t
    show 12:30 p.m., or 6 a.m.


    Correcting if the time is set correctly and the job still completes at the wrong
    time


    The cron utility may be running, but the system time it''s tracking is wrong.
    You can check what your UNIX machine thinks is by typing date and the date program
    shows your system time. If it''s off, correct the time setting.


