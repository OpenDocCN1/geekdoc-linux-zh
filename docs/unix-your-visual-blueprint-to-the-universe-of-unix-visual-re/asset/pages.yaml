  md: '# TROUBLESHOOTING


    # Extra


    # Processes that respond to the killall command


    All processes should respond to the ''killall'' command. The only time that this
    is not true is when the process itself refuses to listen to the command — in which
    case you may need to use kill -9, which is the strongest level of the kill command.


    # Processes out of control


    Two factors determine the likelihood of a process spawning out of control: the
    number of processes that are normally started on a machine, and how buggy the
    process normally is. For example, the telnet daemon can spawn out of control because
    on systems with multiple users, it''s likely that many telnet connections will
    be started as people do their work. Print daemons historically go out of control
    because their design is considered slightly unstable.


