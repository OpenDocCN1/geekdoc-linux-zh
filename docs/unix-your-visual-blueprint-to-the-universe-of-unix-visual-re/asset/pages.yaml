  md: '# TROUBLESHOOTING


    # Extra


    My machine appeared to hang when I ran the du command listed above; it won''t
    accept commands but the hard drive is working. What is going on?


    You have probably run the du and sort combination described above from the root
    directory, /. Since du will search for and calculate the size of each directory
    where you started the command, you may have to wait a few minutes for du to complete
    its task. In the future, you may want to start du in a location further down the
    directory tree; if /usr/tmp looks like it''s filling up, then start there instead.


    What if I need the command prompt right away and I don''t want to wait for the
    du and sort process to finish?


    In this case, you can kill the process in midstream by pressing Ctrl+C. Alternatively,
    you can use the kill command, as described in Chapter 7.


    ![](img/62c9d4555470e74cbdf27d6e2d0b22c6_274_0.png)


