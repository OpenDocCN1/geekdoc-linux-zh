  md: '# TROUBLESHOOTING


    # Extra


    # Why UNIX uses the military time set instead of using a.m. and p.m.


    This is because it was easier for the early UNIX designers to program a machine
    that worked with numbers more easily than letters. A time of 23:00 is easier for
    a machine to work with 11p.m.


    # Reasons to keep your time and date accurate


    Keeping your machine''s time and date accurate is helpful in two other situations.
    First, if you run into problems, the system will normally log when it sees an
