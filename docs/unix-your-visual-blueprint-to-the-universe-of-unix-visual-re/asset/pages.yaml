  md: '# Extra


    What to do when you are restoring archived and compressed files and you get a
    No space left on device message


    When you are restoring files and get a No space left on device message, the UNIX
    system is telling you that your hard drive (or whatever device you are restoring
    files on) is 100 percent full.


    First, if the restoration process hasn''t automatically exited, press Ctrl-C to
    exit the process.


    Second, list the current contents of your device and delete any files that have
    been created since you started the restoration. These files will likely be half-restored
    and will cause problems if you try to access them.


    Finally, move the archived files to a different disk or machine where you have
    enough space to handle the restored files, and restart the restoration process.


