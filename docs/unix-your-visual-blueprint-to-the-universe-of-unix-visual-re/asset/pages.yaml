  md: '# WORKING WITH PROCESSES 7


    # Extra


    # Processes running in the background at one time


    Theoretically, there is no limit to the number of processes that run at any one
    time. However, the practical matter of slowing your UNIX system if you end up
    running two or three processes at the same time limits this.


    # Processes that can''t run in the background


    Certain commands, such as cat, print out the contents of the file right to the
    screen. Backgrounding any command that puts output directly to the screen will
    not work.


    # Stopping processes that are running in the background


    If you have the process ID number of the process from the Process Manager or the
    ps command in the Terminal window, you can stop the process with the kill command,
    which I describe later in this chapter.


