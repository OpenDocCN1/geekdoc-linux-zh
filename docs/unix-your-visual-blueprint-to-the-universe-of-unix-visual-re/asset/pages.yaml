- img_proc: true
  md: '# Extra


    # Output through broken pipes


    A misused pipe is sometimes called a "broken" pipe by UNIX wonks. This is a good
    visual image, but it''s misleading. When a pipe is misused, no data is lost because
    data is sent anywhere.


    # Placing spaces around the pipe symbol


    Type either ls | listings or ls|listings. Both work. But ls | listings is easier
    to read.


    # Fixing a broken pipe


    First, make sure that you''re not accidentally trying to connect a command and
    a file. If you''re using two commands, make sure that one isn''t a text-creating
    command like vi. Barring those difficulties, make sure that both commands are
    functioning properly.


    ![](img/62c9d4555470e74cbdf27d6e2d0b22c6_124_0.png)


    ![](img/62c9d4555470e74cbdf27d6e2d0b22c6_124_1.png)


    +   In the result, note that while ls by itself lists in rows, pipe funneled from
    ls to cat, allowing the information to be printed in column form.


    +   Alternatively, you can send the output of cat letter directly to the lp, or
    print command by typing cat letter | lp at the command prompt.


    +   Press Enter.'
