- img_proc: true
  md: '# Extra


    Using my Terminal after launching Netscape from the Terminal window


    After you start Netscape from the Terminal, the Netscape program acts like a newly
    started daemon, refusing to relinquish the screen until you shut Netscape down.
    Netscape does this, the command line where you can enter in new commands doesn''t
    appear.


    Continuing to work in a Terminal while running Netscape


    Your best bet is to simply work in another UNIX Terminal (this task explains how
    to open a new Terminal). Alternatively, you can start Netscape on the Terminal
    command line, followed by ampersand (&). By typing netscape & pressing Enter,
    you start the Web browser in the background, which allows you to return to the
    command line after starting Netscape.


    ![](img/62c9d4555470e74cbdf27d6e2d0b22c6_230_0.png)


    Finally, you can open a Terminal by right-clicking anywhere on the open desktop.
    This brings up the main pop-up menu.


    Choose Tools and then click Terminal from the submenu. After you select Terminal,
    the pop-up menu disappears and a new Terminal window appears on the desktop.


    At the command prompt, type netscape and press Enter. In a few seconds, Netscape
    starts.'
