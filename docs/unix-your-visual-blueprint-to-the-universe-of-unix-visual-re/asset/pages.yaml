    Changing a file''s permissions

    If you want to use the Terminal, you can use the chmod command. You can look up
    the syntax of the chmod command by opening a Terminal, type man chmod and press
    Enter. With chmod, you can use the r-w-x letters to change permissions, or you
    can use numbers based on the hex system: for example, chmod 664 <filename>. If
    you really want to try chmod with this system, look up the hex codes in a UNIX
    reference book.


    Setting a file that should be kept out for public reference

    The best is r-w-r--- because that would allow anyone to read the file, but prevent
    anyone but the owner making changes.

    Setting for privacy

    Your best is rw------. Only you can read or write to the file, and nobody else
