  md: '# USE NETSCAPE FOR WEB BROWING


    You''ll probably use your Web browser for its primary function, which is visiting
    different Web sites on the Internet. When you start Netscape, you go to a default
    home page, which is usually the Netscape home page, www.netscape.com. Your current
    location on the Web, which is the address of the Web page you''re currently viewing,
    appears in the Location field in the upper center of your screen.


    cache, or list, of the sites you visit. By clicking on the Back or Forward buttons,
    you can move to different points on the list, saving you from bookmarking every
    single site or typing it in again and again. Much like the CDE environment as
    a whole, Netscape tries extra-hard to be user friendly, so look for icons like
    the forward and back arrows, or the printer picture on the button.


    When you browse or surf through several sites, your Netscape Web browser keeps
    a


    ![](img/62c9d4555470e74cbdf27d6e2d0b22c6_233_0.png)


    After opening the browser (see "Starting the Netscape Web Browser," earlier in
    this chapter), you start at Netscape''s default Web page, home.netscape.com.


    +   To view a different Web site, click the Location field to highlight the contents.


    +   Type in the new Web address.


    +   Netscape locates the site, displaying its information in the window.


    +   Press Enter.'
