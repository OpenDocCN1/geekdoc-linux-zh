  md: '# Extra


    # Eliminating screen savers


    You do this by selecting the Blank Screen setting in the Style Manager–Screen
    dialog box, in the list of screen savers that come with your UNIX installation.


    # Having the computer lock the screen when unattended


    First, click the Off button to the right of the Screen Saver selection, near the
    top of the Style Manager–Screen dialog box. Next, click the On button to the right
    of the Screen Lock selection near the bottom of the Style Manager–Screen dialog
    box.


    # Deciding to use a screen saver


    Ideally, you should always use a screen saver. *Burn-in isn''t caused by a bright
    or a lightly colored screen. Instead, it''s caused by the projection of one image
    on the screen for extended periods of time, no matter how the screen is lit or
    colored.


