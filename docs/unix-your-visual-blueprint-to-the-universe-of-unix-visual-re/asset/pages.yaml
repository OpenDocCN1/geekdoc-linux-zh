    | + Lock Display | |

    | + Suspend System... | |

    | + Exit out... | |


    +   1 Right-click anywhere on the open desktop to open a new UNIX Terminal.


    +   3 Click Terminal. The pop-up menu disappears and a new Terminal window appears
