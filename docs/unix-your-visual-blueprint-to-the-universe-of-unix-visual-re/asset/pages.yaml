    3 Choose Tools.


    +   4 Click Terminal.

    After you select Terminal, the pop-up menu disappears and a new Terminal window
    appears on the desktop.


    +   5 To see the contents of the file, type cat and the name of the file (here,
    quote) at the command prompt.

    6 Press Enter.'
