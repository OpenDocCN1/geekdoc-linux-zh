  md: '# WORKING WITH HARD DISKS AND PRINTERS


    # Extra


    # Renaming a printer


    While in the Printer screen of Admintool, highlight the printer by clicking it
    and then click Edit. Choose Modify from the drop-down menu and the Modify screen
    appears. You can change aspects of the printer on the Modify screen, such as the
    fonts it uses and the darkness of the print. Click OK to apply the changes.


    # What happens to documents sent to a printer which isn''t receiving print jobs


    Often, these jobs don''t just go away or get reassigned. Instead, they''re stored,
    or stacked, in the print queue. The print just pile up. When users on the system
    claim that job disappears after being sent to the printer, check your print queues—
    aren''t just stacking up and sitting there.


    What happens to the print jobs stacked when the printer is removed


    After a printer is removed, it has no print queue. All print jobs stored in that
    queue are permanently deleted.


    ![](img/62c9d4555470e74cbdf27d6e2d0b22c6_212_0.png)


    ![](img/62c9d4555470e74cbdf27d6e2d0b22c6_212_1.png)


    +   - Admintool shifts to the Printers listings.


    +   - Click on the printer you want to delete.


    +   - The printer name is highlighted.


    +   - Click Edit.


    +   - Click Delete from the pull-down menu.


    +   - Admintool queries you with a Warning screen, asking whether this is really
    what you want to do.


    +   - If you really want to delete the printer, click Delete.


    +   - The printer is deleted.'
  merge: -1
