  md: '# LOGGING INTO UNIX


    # Extra


    Notifying system users when the system shuts down


    The shutdown command''s notification feature is useful, but it should be the only
    way you notify other people working on the system that you''re shutting the computer
    down. Ideally, you should send an e-mail a day or so in advance of your work,
    so users aren''t surprised when they receive your shutdown message.


    Choosing a time delay for the system shutdown


    By default, the time interval in UNIX is 60 seconds. Whenever you specify the
    delay time, the default interval is seconds. Therefore, if you want a five-minute
    delay, you enter the period as 300 seconds (shutdown -g 300).


    ![](img/62c9d4555470e74cbdf27d6e2d0b22c6_28_0.png)


    ![](img/62c9d4555470e74cbdf27d6e2d0b22c6_28_1.png)


    ```

    # shutdown -g 120 "The system is going down for maintenance."

    shutdown started. Tue Jan 7 14:51:40 PDT 2000


    Broadcast Message from root (pts/1) on localhost Tue Jan 7 14:51:41...

    The system is going down for maintenance.

    The system will be shut down in 1 minutes.

    Broadcast Message from root (pts/1) on localhost Tue Jan 7 14:51:41...

    The system is going down for maintenance.

    Broadcast Message from root (pts/1) on localhost Tue Jan 7 14:51:41...

    The system is going down for maintenance.

    You want to continue? (y/n):

    ```


    ```

    # shutdown -g

    ```


    +   - Every 30 seconds, the shutdown command broadcasts the messages listed below
    to every user of the system. This notifies the users on the system that they should
    log off immediately.


    +   - At the 30-second mark, shutdown asks you a final time you really need to
    shut down the system.


    +   - Press y for yes, and n for no.


    +   - To shut down immediately without any warning messages or final confirmation,
    type shutdown -g 0 at the command prompt, then press Enter. The shutdown commences
    without waiting.'
