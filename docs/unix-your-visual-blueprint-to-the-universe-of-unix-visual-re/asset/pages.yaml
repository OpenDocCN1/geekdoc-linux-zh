  md: '# VIEWING THE END OF A FILE


    You see the ending lines of any file with the tail command. Tail is short for
    tailing because one relatively sophisticated variation of the tail command allows
    a UNIX network administrator to continuously track a file that logs UNIX activity.


    specify how many lines from the bottom of the file appear for access to more data
    from the file. To do this, use the +n command option.


    Tail is most useful when you want to take a quick glance at the latest entry in
    a file or a list. For example, if you''re viewing a file that gets added to every
    day, you may be interested only in the latest addition, which is normally placed
    at the end of a file.


    As with the head command, the last ten lines of any file appear by default. The
    command syntax for using the head command is simply tail <file name>. You also


    ![](img/62c9d4555470e74cbdf27d6e2d0b22c6_117_0.png)


