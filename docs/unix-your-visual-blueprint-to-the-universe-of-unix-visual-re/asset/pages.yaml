  md: '# SET APPOINTMENTS WITH THE CALENDAR’S DAY VIEW (CONTINUED)


    In addition to being able to set the frequency of a given appointment in the Calendar
    application, you can also set its duration. This feature is not only convenient,
    it also enables you to save unnecessary duplication of effort via the Appointment
    Editor screen. Whether you add a regularly scheduled appointment to a calendar
    on a weekly, monthly, or other frequency, you can tailor exactly how long you
    want the appointments to last.


    For example, if you plan to have a certification meeting every Wednesday afternoon
    for the next nine or ten months, you don’t have to go through each page of a calendar
    for the next nine or ten pages.


    Instead, you can simply add the appointment to your calendar schedule one time,
    then stretch or duplicate the appointment for the allotted span of nine or ten
    months in the Expanded Appointment Editor screen.


