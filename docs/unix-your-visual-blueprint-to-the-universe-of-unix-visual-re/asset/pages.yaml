  md: '# UNIX


    # PLACE A JOB IN THE BACKGROUND


    The bg command (background) enables you to get more work done by releasing the
    command prompt from an ongoing job. This command works by consigning an ongoing
    task to the background so that you can get important tasks completed while you''re
    busy working on other issues.


    job is completed. In the case of a long job (such as transmitting several pages
    of code across a network) you may place the job in the background so that you
    may continue to work from the command prompt on other tasks.


    In the UNIX operating system, all processes normally run in the foreground until
    completed. As a rule, the computer works until the task it is completed, and you
    will not be returned to the command prompt until the


    When a job is placed in the background, it is processed more slowly, because the
    system allocates job priority to what is being run at the command prompt, or foreground
    of the UNIX system. Of course, this does not make much of a difference on any
    but the slowest or most busy systems.


    ![](img/62c9d4555470e74cbdf27d6e2d0b22c6_327_0.png)


    +   - Open a new UNIX terminal by right-clicking anywhere on the desktop.

    - The pop-up menu disappears and a Terminal window is displayed on the desktop.

    - Click Tools.


    +   - You can see if a job is running in the foreground by typing `ps -aef | grep
    <job name>`.

    - The process name and ID appear. Note: For more information on this command string,
    see "Power Searches" in Chapter 7.

    - Press Enter.'
  merge: -1
  pgno: 327
- img_proc: true
  md: '# ADVANCED SYSTEM ADMINISTRATION


    # Extra


    An alternative way to place a job into the background when the job is actually
    executed


    You can actually specify that a process run as a background job from the start
    by adding an ampersand (&) after the command. For example, typing `netscape &`
    at the command prompt and pressing Enter allows you to run the Netscape Web browser,
    while at the same time keeping your command prompt available to run additional
    UNIX commands.


    Limitations on placing multiple jobs into the background


    Actually, unlike moving jobs to the foreground, where only one can be in the foreground
    at any time, multiple jobs can be running in the background at once. Whether you
    place these jobs in the background via the `bg` command or by starting them with
    an ampersand, they all run with less processing power while allowing you to retain
    the UNIX command prompt.


    ![](img/62c9d4555470e74cbdf27d6e2d0b22c6_328_0.png)


    ![](img/62c9d4555470e74cbdf27d6e2d0b22c6_328_1.png)


    +   6 To move the job into the background, type BG by the job''s name or process
    ID number at the command prompt.


    +   7 Press Enter.


    +   The job is backgrounded and you are returned to the command prompt.


    +   To check whether or not the job is still running in the background, type jobs
    at the command prompt and press Enter. The job is listed.'
  merge: -1
