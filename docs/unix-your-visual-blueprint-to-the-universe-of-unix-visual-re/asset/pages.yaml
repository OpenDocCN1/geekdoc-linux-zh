  md: '# CHANGE PERMISSIONS TO RESTRICT TERMINAL ACCESS


    You can use UNIX''s ability to restrict access to a specific file in the UNIX
    Terminal by using `chmod` command. Restricting access, whether through CDE desktop
    GUI or through UNIX Terminal, is a good idea.


    An additional bit of file security is available in the UNIX Terminal through the
    idea of "security through obscurity." You can make a file more obscure if it is
    hidden from plain view. In UNIX, files starting with a single period (.) don''t
    appear in a list command unless the -a option is used. An extra level of out-of-sight,
    out-of-mind security is available by renaming a file from topsecret to .topsecret.


    If a system-critical file is permitted so that anyone can edit it, a user can
    edit the file by himself to save time in changing his password. Worse, an experienced
    UNIX user can change the root account password, leaving you unable to restore
    the system.


