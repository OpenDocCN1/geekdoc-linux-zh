  md: '# CONFIGURE YOUR WEB BROWSER TO CONNECT TO THE INTERNET


    You can configure your Web browser, whether you use Netscape or a different program,
    using the same information for mail access. If you''re running UNIX at home, you
    need to sign up with an ISP (Internet Service Provider), such as America Online,
    to get your connection to the Internet. To complete your connections for both
    Internet and electronic mail access, ask the provider for this information:


    2) Name of your mail server.


    A proxy server is one method by which an ISP allocates a single machine to handle
    connection to the Internet. Similarly, a mail server is a machine that is set
    up, or dedicated, to handling and storing your e-mail for retrieval when you log
    in your ISP.


    +   1) Name of the Internet proxy server, if there is one, and the port to connect
    to it.


    More commonly, you''re on a UNIX network with other machines; in this case, ask
    your network administrator for the ISP information.


    # CONFIGURE YOUR WEB BROWSER TO CONNECT TO THE INTERNET


    ![](img/62c9d4555470e74cbdf27d6e2d0b22c6_231_0.png)


    +   1 After opening the Netscape Web browser ("Starting the Netscape Web Browser"
    in this chapter), click Edit in the browser window.


    +   A drop-down menu appears.


    +   2 Click Preferences.


    +   The Preferences screen appears.


    +   3 In the left-hand window frame of the Preferences screen, click the arrow
    next to Advanced.


    +   You are given two sub-panel listings, Cache and Proxies.


    +   4 Click Proxies.


    +   The Proxies panel appears in the right-hand frame.'
