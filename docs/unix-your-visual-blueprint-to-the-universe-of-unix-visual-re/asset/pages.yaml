  md: '# Extra


    Requiring users to change passwords

    This is up to you — it really depends on the level of security you realistically
    need on your system. For example, if you work at a top secret government laboratory
    where valuable research goes on, you may want to change the passwords quarterly.


    Duplicating user account names

    You shouldn''t enable users to change their names to duplicate system accounts.
    This can cause both UNX and a new administrator confusion. User accounts by necessity
    should be unique. In any case, Admintool has built-in safeguards that won''t let
    you duplicate a user account name.


    On the other hand, if this system is in your home, it may be less likely that
    someone will try to hack your system. In that case, you may change passwords once
    a year, if that.


    ![](img/62c9d4555470e74cbdf27d6e2d0b22c6_184_0.png)


