  md: "# LOG IN WITH TELNET\n\nYou can remotely log into other machines on your network\
    \ with telnet. Like login, telnet is automatically installed on your UNIX network\
    \ as a remote connection system.\n\nWhen you execute the telnet command, your\
    \ UNIX box starts a daemon called telnetd. Telnetd controls the specific byte-to-byte\
    \ operations of a telnet session with the remote host of your choice. Telnet is\
    \ more popular than login or rsh. The main\n\nreason is that all other computers\
    \ running UNIX use telnet to communicate. In addition, computers running Linux,\
    \ Macintosh, and Windows 95, 98, and NT use the telnet utility. To use telnet,\
    \ double-click the telnet icon located in the Communications or Accessories directory.\n\
    \nTCP/IP-based telnet sessions are the most widely accepted method of opening\
    \ communication between different computers. Telnet is simple, reliable, and easy\
    \ to use.\n\n# LOG IN WITH TELNET\n\n![](img/62c9d4555470e74cbdf27d6e2d0b22c6_223_0.png)\n\
    \n![](img/62c9d4555470e74cbdf27d6e2d0b22c6_223_1.png)\n\n+   1 Right-click anywhere\
