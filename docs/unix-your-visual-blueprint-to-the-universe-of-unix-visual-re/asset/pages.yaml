  md: '# WORKING WITH HARD DISKS AND PRINTERS


    # Extra


    Delays in the copy process from the CD-ROM to the hard drive


    If you have an old, double-speed drive, you need more copy time than you do with
    a faster CD-ROM.


    The meaning of "speed" in CD-ROM drives


    Speed is how fast the CD-ROM rotates in the drive. Usually, the faster the CD
    spins, the faster the data transfers.


    Other delays when copying from a CD drive


    When you install a super-fast CD-ROM drive in a slow machine, you transfer the
    data bottleneck from one area to another. If you have an old information bus or
    a small amount of RAM, your bottleneck is on the computer''s hard drive. This
    is called disk bound. On the other hand, if you have a fast machine and a slow
    CD-ROM drive, you''re drive bound.


    ![](img/62c9d4555470e74cbdf27d6e2d0b22c6_204_0.png)


