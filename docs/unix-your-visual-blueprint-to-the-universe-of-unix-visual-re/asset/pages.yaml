  md: '# ADD PRINTERS


    You can add printers to your UNIX system easily in the Admintool utility. Contrary
    to what you might think, printers aren''t added in the UNIX operating system through
    the Print Manager. Instead, you use the Print Manager primarily for managing print
    job queues. You add and remove printing hardware in Admintool.


    Usually, you''re working with a printer known as a local printer. A local printer
    attaches directly to a given machine. Although the name implies that the printer
    only handles local print jobs, that isn''t the case. A printer can be local, but
    if it''s networked, it can still receive print jobs from all corners of the network.


    # ADD PRINTERS


