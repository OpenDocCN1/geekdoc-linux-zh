    +   * Click the arrow above the Files button on the desktop toolbar.


    +   * A pop-up menu appears.


    +   * A window on your desktop displays the floppy disk''s contents.


    +   * Click Open Floppy on the pop-up menu.


    Note: For a review of the desktop toolbar buttons, see Chapter 1.'
  merge: -1
