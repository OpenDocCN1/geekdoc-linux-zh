  md: '# ACCESSORIES


    # Apply It


    Choosing to edit only selected appointments in the Appointment Editor screen


    After you make changes to a given appointment in your Appointment Editor, you
    can choose to only edit one appointment and move on to the next scheduled one
    by clicking the Forward button.


    For example, if your weekly research and development meeting changes to a company
    party for the next two weeks, you edit the next appointment with the Appointment
    Editor, then click the Forward button to move to the next instance of the appointment.


    You then click Forward button again to edit the appointment a second time. When
    you get to the third appointment, which is where the party reverts to a regular
    research and development meeting, you click the Cancel button to cancel any other
