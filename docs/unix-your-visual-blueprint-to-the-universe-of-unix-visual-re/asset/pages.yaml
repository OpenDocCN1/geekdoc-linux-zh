  md: '# WORKING WITH SHELLS AND SYSTEM VARIABLES


    # Some intuitive options don''t work


    When you type echo SHELL, you''re just telling the echo command to print out "SHELL"
    on the screen. It does this with commendable efficiency, but it doesn''t tell
    you anything you can use.


