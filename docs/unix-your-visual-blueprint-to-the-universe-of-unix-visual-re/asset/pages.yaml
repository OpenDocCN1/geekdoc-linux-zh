  md: '# Extra


    # Deciding to use the Privacy settings


    You should use the Privacy settings only when it makes sense to do so. While setting
    a calendar for maximum privacy has drawbacks to system speed, it may add an unnecessary
    step when you''re working in the Appointment Editor.


    Similarly, if your appointments are not particularly private, or if your machine
    is on a network that few users work on, then you don''t need added privacy.


    **Adding repeating appointments to your calendar indefinitely**


    For example, if your machine is not hooked up to a network (known as a stand-alone
    machine), then no one can view your Calendar application.


    As the option name says, your appointments can repeat forever until the end of
    the year, but in the Calendar application, until you switch the frequency to some
    other setting, it is set for all time.


    ![](img/62c9d4555470e74cbdf27d6e2d0b22c6_292_0.png)


    ![](img/62c9d4555470e74cbdf27d6e2d0b22c6_292_1.png)


    If you''re running Calendar on a machine that several people use, you can select
    a Privacy setting so that only you can view your Calendar entries by using the
    Privacy button.


    Click on the Privacy button to display a pop-up menu, from which you can set the
    level of privacy you desire.


    If you choose a Privacy setting by clicking one, the pop-up window disappears
    and the new setting displays in the Privacy field.'
