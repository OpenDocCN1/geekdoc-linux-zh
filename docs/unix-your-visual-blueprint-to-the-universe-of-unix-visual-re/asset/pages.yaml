  md: '# # READ FILES WITH THE MORE COMMAND


    The **more** command enables you to view text- and numerically based files in
    the UNIX terminal window. **More** is not a true word processing utility, because
    it does not allow you to edit text at all, let alone copy, delete, or save it.
    *More* is a limited tool, developed to do one thing: displaying text or numbers.


    This limitation is more useful than most people appreciate. When you use *more*,
    what you give in word processing, you more than make up in speed and safety. The
    primitive **more** command is very fast, because it does not have to work with
    formatting or spacing functions. When you use a command that does not allow you
    to edit a document, it protects the document from accidental changes that could
    take place in, say, a vi editor session. Because of this, more is especially useful
    if you want to view a sensitive system file, such as `/etc/system` or `/etc/passwd`.


