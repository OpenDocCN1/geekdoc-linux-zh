  md: '# CLOSE A WINDOW


    You close a window to get to a section of the desktop or to retrieve a smaller
    window that is hidden behind a larger one. Remember, closing a window isn''t the
    same as minimizing a window. Minimizing or maximizing a window is simply a shorthand
    of resizing the window or moving it out of the way. It doesn''t affect the window
    or the window''s contents in any way; it only alters the shape or dimensions of
    the window.


    On the other hand, closing a window effectively removes it from your desktop.
    It can also stop or shut down any UNIX program you run from inside the window.
    For this reason, always be sure that you really want to close a window before
    you close it.


    # CLOSE A WINDOW


