  md: '# Apply It


    Using the Filter field

    When using the Filter field to find a particular process, you can also use the
    UNIX wildcard character * to find a range of processes. For example, to find all
    processes that begin with tail, you type the following in the Filter text field
    on the upper left of the screen.


    # tail*


    This will give you processes named "tail," "tailed,"" or "tailor" (assuming processes
    with these names are running).


