  md: '# TIME YOUR SYSTEM


    The time command allows system administrators and users of a UNIX system to check
    the speed at which the system is working. This command measures the speed at which
    a given job is completed on the computer in three distinct parameters: actual,
    user, and system.


    through hundredths of seconds, although many jobs (such as listing files) often
    take only a fraction of that time.


    User and system time are measured in milliseconds. User time is the amount of
    processing time the machine takes to convey and display the information to the
    user. System time is the amount of time the computer needs to process and calculate
    the information.


    Actual time is the amount of chronological time the computer takes to finish a
    task. The task is normally measured in seconds down


    ![](img/62c9d4555470e74cbdf27d6e2d0b22c6_313_0.png)


    +   - Open a new UNIX terminal by right-clicking anywhere on the desktop.


    +   - The pop-up menu disappears and a new Terminal window is displayed on the
    desktop.


    +   - Click Tools.


    +   - Click Terminal.


    +   - To time a typical command, type time and the command name.


    +   - Press Enter.


    +   - The time job took and the amount of time it took the user and system to
    complete the job. If the job is simple and the time spent is effectively zero,
    the time is displayed as such on the screen.'
