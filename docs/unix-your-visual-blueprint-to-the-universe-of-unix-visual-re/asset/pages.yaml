  md: '# WORKING WITH SHELLS AND SYSTEM VARIABLES


    # Apply It


    Executing a script in the background

    When a script will take a long time to run, it’s sometimes best to run it in the
    ‘background.’

    Normally, when executing a script, you must wait for the script to finish before
    you can enter a new command at the command line.

    When you indicate that you want a script to run in the background, you can continue
    to use the command line; the script will finish normally and not notify you when
    it is complete. For example, to run the testscript script in the background, the
    following at the command prompt and press Enter.


    ```

    testscript &

    ```


