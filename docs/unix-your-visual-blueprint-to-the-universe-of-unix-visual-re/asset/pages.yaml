  md: "# COUNT WORDS\n\nYou can quickly perform a count of words, sentences, and characters\
    \ in a given UNIX document with the wc (short for word count) command. This command\
    \ is helpful if you are working on a document or report that has to be of a specific\
    \ length, or starting to run short of disk space.\n\nRunning a wc command on a\
    \ file is a good way to determine if any new information has been added to a file.\
    \ For example, let's say that you run a word count on a critical system file and\
    \ get 100 words. After installing a complex piece of software on your system,\
    \ you might run the same command to discover that the file now weighs 114 words,\
    \ meaning that some editing took place to the file when you added the new software.\n\
    \n![](img/62c9d4555470e74cbdf27d6e2d0b22c6_321_0.png)\n\n+   1 Open a new UNIX\
