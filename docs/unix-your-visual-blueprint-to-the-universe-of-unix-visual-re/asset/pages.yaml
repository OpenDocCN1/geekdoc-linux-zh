  md: '# SEARCH FOR SPECIFIC PROCESSES


    The Process Manager is an extremely useful tool to have on your computer when
    you''re trying to determine whether a particular process is running, or spawning
    out of control.

    You''re trying to find one process, this becomes troublesome when the sheer number
    of processes makes it difficult to find the one you need.


    Normally, UNIX has a large number of background or system processes that run or
    less continuously. These processes are absolutely vital to keep your UNIX system
    functioning properly. Of course, in fact, if you have different users on the same
    system running different processes, the task becomes the equivalent of finding
    the needle in the haystack. Lucky, the Process Manager can help you get around
    this, using the ps and grep commands together.


