  md: '# FIND DISK HOGS


    You can locate users or even files that are becoming disk hogs with a special
    combination of UNIX commands. A disk hog is a person that takes an inordinate
    amount of space on your hard drive. A disk hog can be automated by a file that
    keeps your space growing and taking up more and more of your space. For example,
    certain programs can store messages and updates in special files called log files,
    which keep on growing until a program is shut down.


    A shortage of disk space is more than just a minor annoyance. If a given partition
    such as /root or /etc fills up to 100 percent of its capacity, your UNIX machine
    may hang, or even crash, destroying or corrupting valuable data in the process.


    To prevent this, you''ll be using the du (disk usage) command and the sort command
    together. These two commands will work together via a pipe that is discussed as
    a method of linking command output together in Chapter 7.


    # FIND DISK HOGS


    ![](img/62c9d4555470e74cbdf27d6e2d0b22c6_273_0.png)


    ![](img/62c9d4555470e74cbdf27d6e2d0b22c6_273_1.png)


    +   1 Open a new UNIX terminal by right-clicking anywhere on the open desktop.


    +   3 Click on Terminal in the submenus that appears.


    +   4 type du | sort -n at the command line.


    +   5 Press Enter.


    +   When you select Terminal, the pop-up menu disappears and a new Terminal window
    appears on the desktop.


    +   2 The Workspace Menu appears.


    +   Choose Tools.'
