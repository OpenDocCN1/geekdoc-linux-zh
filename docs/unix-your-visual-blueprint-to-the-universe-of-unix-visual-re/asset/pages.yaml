  md: '# DISPLAYING THE TEXT FILE WITH cat


    You can see the entire contents of a file without editing it or entering the vi
    editor by using the cat command. Cat is short for the term concatenate, which
    is itself a fancy way of saying that the information in the file is joined to
    the display for your easy viewing. The syntax for cat is simply cat <file name>.
    By default, cat sends the information in a file directly to the screen. In UNIX,
    this is also called standard output.


    Cat is useful for taking a quick glance at short text files or other small UNIX
    files. Cat is also useful when you want to send the information in a file to a
    second UNIX command for further processing.


    Finally, cat also shows how long a file is. When cat is used with the @n option,
    each line in the file is labeled with a number. The number on the last line tells
    you how many lines the file has in total.


    # DISPLAYING THE TEXT FILE WITH CAT


