  md: '# APPEND OUTPUT


    You append the output of a program, binary, or script in the UNIX operating system
    by using the arrow keys to form the symbols, `<<` and `>>`. Appending output into
    a file prevents you from accidentally erasing the former contents of a given file
    when you redirect data into the file.


    difference is that the data that already exists at the destination file isn''t
    overwritten.


    Remember this if you''re short on space in a particular area of your system: Appending,
    unlike redirecting, causes files to grow in size, which problems if the disk fills
    up.


    Appending data into a file lets you isolate and read output from a program, such
    as a log file, at your leisure like a redirect command.


    The format for appending is normally `<program> <append sign> <output file>`.


    ![](img/62c9d4555470e74cbdf27d6e2d0b22c6_139_0.png)


    +   - Open a new UNIX Terminal by right-clicking anywhere on the open desktop.


    +   - Choose Tools.


    +   - Click Terminal.


    +   - Append the results of the ls (list) command to the file by typing `ls >>
    listings` at the command prompt.


    +   - Press Enter.


    +   - A new Terminal window appears on the desktop.


    +   - A pop-up menu appears.'
