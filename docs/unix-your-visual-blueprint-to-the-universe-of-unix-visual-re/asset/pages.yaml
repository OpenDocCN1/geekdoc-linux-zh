    Automatically installed groups

    Such groups as daemon, t, and uucp are automatically created during the UNIX installation.
    UNIX uses these (sometimes called system groups) to run processes and maintenance
    procedures, such as disk defragmentation. These groups usually contain only the
    root account and a system account, as ad, bin, or lp.


