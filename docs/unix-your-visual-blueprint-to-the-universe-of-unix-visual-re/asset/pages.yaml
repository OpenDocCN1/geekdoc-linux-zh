    You determine which shell you''re in UNIX by using the echo command to display
    your $SHELL system variable. The shell is the program that translates the commands
    you enter at the prompt (or in the desktop) into instructions that the computer
    can understand. Because of this function, a shell is also sometimes called a command
    interpreter.


    you''re telling it to print out your preassigned shell setting, or system variable
    (more later in this chapter).


    For your purposes, the shell you use doesn''t make too much of a difference, because
    the commands are standard fare. There are different shells in UNIX, C-Shell, and
    Korn shell, because programmers wanted special higher-level utilities or functions
    that the existing shells did not.


    Echo displays your shell, because it plays back (echoes) what you ask it to. By
    placing the $ symbol in front of SHELL,


