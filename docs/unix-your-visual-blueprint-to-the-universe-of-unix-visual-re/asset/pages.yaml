  md: '# FIX DEVICE PROBLEMS ON REBOOT


    You can fix device problems on your machine if you''re having trouble shutting
    down your computer or rebooting. If your computer hangs when you shut it down,
    your machine might not be mounting all of the disks. A telltale sign of this is
    when the message device busy appears on-screen the next time you reboot. Device
    problems are a serious malfunction of your UNIX system and could mean that you
    have either a physical or a software problem.


    A software problem could mean that you have corrupted files or sectors on the
    disk drive. Normally you get this if you''ve had a power outage or you haven''t
    been shutting the machine properly.


    A hardware failure could be a scratched disk drive, an aging disk head, or even
    a speck of dust that has demagnetized the disk.


    # FIX DEVICE PROBLEMS ON REBOOT


    ![](img/62c9d4555470e74cbdf27d6e2d0b22c6_271_0.png)


    +   1 Open a new UNIX terminal by right-clicking anywhere on the desktop.

    2 The Workspace Menu appears.


    +   3 Click on Terminal in the submenu that appears.

    When you select Terminal, the pop-up menu disappears and a new terminal appears
    on the desktop.


    +   4 Edit the file that controls the dismounting of your devices by typing vi
    /etc/rc.d/init.d/halt at the command line.


    +   5 Press Enter.

    Note: For a quick review of the vi editor, see Chapter 5.'
