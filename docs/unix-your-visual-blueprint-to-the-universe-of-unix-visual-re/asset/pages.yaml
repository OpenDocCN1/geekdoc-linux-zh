  md: '# CHANGE FILE OWNERSHIP


    You can change the ownership of a file in UNIX as another way of increasing or
    decreasing the level of access to a file. For example, you can change the ownership
    of a file to the root administrative account if you want to restrict access without
    changing the file permissions. Alternatively, you can change the ownership of
    a file to Other to make it more public and easier to access.


    Users can also change a file''s ownership if they want to transfer ownership of
    a file to a different user or even to the root account. Of course, users who make
    a change of ownership to a file should know that it is very hard to take back
    ownership of a file after it is given away. The root account can restore file
    privileges if ownership has been accidentally given away.


