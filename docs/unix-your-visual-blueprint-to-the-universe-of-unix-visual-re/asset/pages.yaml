    in this chapter), click Communicator in the browser window.


    +   - In the menu that appears, click Messenger.


    +   - In the Messenger screen, click the New Msg button on the toolbar.


    +   - The Netscape Messenger screen appears.


    +   - The Compose screen appears.'
