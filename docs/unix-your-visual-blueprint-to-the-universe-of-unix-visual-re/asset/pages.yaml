  md: '# USE THE PIPE SYMBOL


    You transfer the output of one UNIX command to another with the help of a UNIX
    shell utility called pipe. For example, pipe is normally used to send the output
    of the ls or cat command into a new text file.


    As a consequence, you don''t type pipe to use the utility. Instead, you type the
    pipe symbol directly from the keyboard. The pipe symbol looks like this: | You
    normally find the symbol on the backslash key, located above the Enter key.


    Pipe actually isn''t a UNIX command, so you don''t find it in a listing of UNIX
    commands. Instead, pipe is a utility that automatically comes with the UNIX environment
    you enter when you use the UNIX Terminal.


    To type this symbol, make sure that you hold down the Shift key while you press
    the Caps Lock function will not let you type a pipe — you must create it by pressing
    Shift+| to create the symbol.


    ![](img/62c9d4555470e74cbdf27d6e2d0b22c6_123_0.png)


    ![](img/62c9d4555470e74cbdf27d6e2d0b22c6_123_1.png)


    +   1 Open a new UNIX Terminal by right-clicking anywhere on the open desktop.


    +   2 Choose Tools.


    +   4 Type ls | cat at the command prompt.


    +   5 Press Enter.


    +   A pop-up menu appears.


    +   A new Terminal window appears on the desktop.'
  merge: -1
