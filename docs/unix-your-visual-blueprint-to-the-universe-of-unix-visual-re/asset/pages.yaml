  md: '# REVIEW AND REPEAT COMMANDS


    The history command enables you to review the list of commands executed in a given
    UNIX session, repeat a command that you have already issued earlier having to
    type it again. The history command''s first function is useful for trying to remember
    a complex command string that you used previously but cannot recall. Unless the
    command is so long again it is beyond history''s recall, you can see exactly what
    you typed in the command prompt.


    The history command''s second function is also extremely useful. By being able
    to duplicate a command out of the history command''s list, you save yourself a
    lot of typing. For example, if a given command to lock obscure file /etc/tmp/filename,
    you instead type the bang (!) sign and the task''s number under the history list,
    press Enter, and repeat the task without typing in the full command again.


    # REVIEW AND REPEAT COMMANDS


    ![](img/62c9d4555470e74cbdf27d6e2d0b22c6_309_0.png)


    +   1 Open a new UNIX terminal by right-clicking anywhere on the open desktop.

    2 The main pop-up menu appears.

    3 Click Tools.


    +   3 Click Terminal.

    2 The pop-up menu disappears and a new terminal is displayed on the desktop.


    +   4 At the command prompt, type history.


    +   5 Press Enter.'
