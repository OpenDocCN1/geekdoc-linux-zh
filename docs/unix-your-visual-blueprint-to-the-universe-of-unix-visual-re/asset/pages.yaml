  md: '# LOWER A JOB''S PRIORITY


    The nice command enables you to lower a job''s priority at times when a heavily-used
    system is starting to queue or schedule jobs, so that it processes them more efficiently.
    The nice number associated with a job, ranging from +20 to -20, is a method that
    your computer uses to prioritize jobs in a priority-based scheduling process.


    process does not significantly speed up or slow down a process. However, if you
    are on a heavily-used machine at a peak time, you may want to downgrade a job
    you give your computer until the other more important jobs have completed and
    exited.


    On most systems (and almost all stand-alone systems) changing the nice number
    of a


    The lower job priority, the more important system considers the job. To reduce
    the job''s importance, you need to add to the default nice level.


