  md: '# WORKING WITH SHELLS AND SYSTEM VARIABLES


    # Extra


    # Selecting the $PATH


    Usually, you should keep your path set to the system defaults. However, if you
    frequently use a utility from a directory that isn''t in your path, you should
    edit your path to include that directory.


    # The difference between $PATH and the term $path


    $PATH is the term you use when you refer to the environmental variable that determines
    which directories the UNIX system searches for a script, binary, or command that
    you execute. The term path refers to this list of directories as well. It also
    is a more colloquial phrase that can mean the general location of a file.


    # The longest a $PATH should be


    Path lengths have no limits. However, remember that commands that come from the
    end of the path line take slightly longer to execute. Of course, this should only
    be noticeable if your system is running at peak capacity with many users on it
    at the same time.


