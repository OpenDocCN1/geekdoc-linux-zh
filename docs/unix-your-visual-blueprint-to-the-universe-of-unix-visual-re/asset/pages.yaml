  md: '# READ FLOPPY DISKS


    You can read floppy disks on today''s UNIX machine more easily than on earlier
    forms of the operating system. In earlier forms of UNIX, there was no GUI (Graphical
    User Interface) to provide you with an icon of a floppy disk or disk drive to
    click.


    This is still true for some recent forms of UNIX and Linux. Solaris automatically
    mounts the floppy disk when you read it, so you''re spared the hassle of typing
    "mount". This increases your flexibility in creating, transferring, and storing
    files between computers.


    Also, earlier forms of UNIX required the mount command, together with arcane command
    options, to use a floppy disk.


    You can view files, directories, and information from floppy disks on a UNIX machine
    by using the Open Floppy utility in the CDE (Common Desktop Environment) desktop.


    ![](img/62c9d4555470e74cbdf27d6e2d0b22c6_197_0.png)


