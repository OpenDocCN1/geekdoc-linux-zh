  md: '# STORE PROCESS MANAGER OUTPUT


    You store the output of the Process Manager utility by directing the program to
    send its snapshots of the activity on your system to a log file. A log file is
    a generic term in UNIX that is used to store output from a command or program.


    time or date the action took place. This is a crucial tool for an administrator
    who is trying to determine the cause of a particular problem — he or she can see
    a log file and see what at what time corresponds with the problem.


    Often, the data stored in the log file is literally in the form of a “log.” That
    is, the data contains entries from a program’s output that list both activity
    of the program and the


    The disadvantage of a log file is that log files take up space. Furthermore, log
    files that are left unchecked continue growing as more and more data are stored
    inside them, eventually filling up the disk partition they reside on.


