- img_proc: true
  md: '# WORKING WITH PROCESSES 7


    # Extra


    # Choosing to use kill -9


    kill -9 should be used only in emergencies. When used on a program that is vital
    to your system, such as a print job, this can cause other programs to crash, such
    as the daemons that run the UNIX print queue.


    Other side effects you encounter when you use kill -9 too often


    Most likely, you run into problems the process or program that you''ve given the
    kill -9 signal more than once. This is because without allowing the procedure
    to shut down properly, the utility or program may have become corrupted.


    # Inside the core file


    A core file is a dump of all the half-processed data that the kill program handled
    when it crashed. Core files are usually incredibly large, so you must clean up
    as quickly as possible or run the risk of running out of space on your disk drive.


    ![](img/62c9d4555470e74cbdf27d6e2d0b22c6_144_0.png)


