  md: '# CHANGE FILE PERMISSIONS


    You can change a file''s permissions in UNIX in order to grant or restrict access
    of other people to the contents of your file. If you change the permissions to
    a directory, you can grant or restrict access to entire groups of files at one
    time. You can change a file''s permissions in the UNIX operating system to one
    of three settings. Your options are r for readable, w for writable, and x for
    executable. Then the contents can be viewed with the vi editor, not changed. By
    contrast, a file that is writable can be renamed. Finally, a file that is executable
    can be run as a script or program.


    UNIX divides permissions into three areas: file permissions for the user, for
    the group, and other. User is, of course, the user account who owns the file,
    and the group is the user group that the user belongs to. Other is everyone else
    on the system.

    UNIX permissions are viewed in groups of three symbols: r'', w'', and x''. For
    example, the user''s permissions on a file may be readable and writable, rw-.
    Depending on how you change the permissions, the letters signifying the added
    or deleted.


    # CHANGE FILE PERMISSIONS


