  md: '# Extra


    Retrieving floppy disks when the drive refuses to unmount or eject


    If your machine refuses to eject the floppy disk, reboot the computer and see
    whether the trouble persists.


    In addition, all PC-based UNIX machines have a physical method in order to eject
    the disk. If you''re running UNIX on a Sun Microsystems machine or a Macintosh,
    you need a paper clip or thin pencil to force-eject the floppy disk.


    Using a paper clip to retrieve a floppy disk

    This is a bit of UNIX and Macintosh lore that everyone should know in case of
    a major power failure. Some Macintosh and UNIX computers lack the manual release
    button for the disk, but they have a small hole below the floppy disk. By straightening
    one bend of the paper clip so that it forms a straight spike, you can stick it
    into the hole and push in the spring that activates the mechanism.


