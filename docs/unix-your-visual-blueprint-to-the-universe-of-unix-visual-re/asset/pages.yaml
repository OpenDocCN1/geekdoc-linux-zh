  md: '# LOG IN AS THE ROOT ACCOUNT


    You can log into the UNIX system as the root account whenever you want to perform
    an administrative task. The root user account is the administrative account that
    is granted privileges over all the other accounts and files on the UNIX system.
    For this reason, the root account is known as the superuser account. As root,
    you can edit any file, change any permissions, even read everyone''s mail.


    same privileges as root. These users are also known as superusers. However, for
    security purposes, root privileges should be granted sparingly, if at all.


    There are several ways to enter the root account. These range from the typical
    login to performing the su command. Unlike many commands, su can be nested or
    run multiple times during one UNIX session.


    On any UNIX system, there is only one root account — but other accounts can have


