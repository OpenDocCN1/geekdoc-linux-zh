  md: '# LOG IN WITH RLOGIN


    You can connect to other UNIX clients and servers on your network and give them
    remote commands after you log in with the rlogin command (which is where login
    gets its name), you have complete access to all the resources of the remote computer
    as if you are at the keyboard. This holds true whether you are down the hall or
    a whole continent away. While there are several different kinds of remote login
    tools, the most commonly used in the UNIX world is rlogin.


    Rlogin is on your UNIX network as part of the TCP/IP connection protocols. It
    is also fairly flexible. You can remotely log into another machine via either
    the machine''s name or the machine''s Internet Protocol (IP) address. Either method
    connects you to a remote machine.


    ![](img/62c9d4555470e74cbdf27d6e2d0b22c6_217_0.png)


    +   - Right-click anywhere on the open desktop to open a new UNIX Terminal.

    - A pop-up menu appears.

    - Choose Tools.

    - A submenu appears.


    +   - Click Terminal.

    - The pop-up menu disappears and a new Terminal window appears on your desktop.


    +   - To remotely log into a machine, type rlogin at the command prompt, then
    type the machine name.

    - Press Enter.'
  merge: -1
  pgno: 217
