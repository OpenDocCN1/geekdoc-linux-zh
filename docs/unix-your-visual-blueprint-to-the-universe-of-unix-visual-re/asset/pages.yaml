  md: '# AUTOMATE TASKS


    You can automate simple system tasks with the cron utility. Cron automates tasks
    by tracking time as kept on your UNIX machine. At a prearranged time, cron looks
    in the crontab file. If any tasks are listed in the crontab, cron runs the program
    specified just as you typed it in the command prompt. You list the contents of
    this file with the cron command and the -l option, and edit it with the -e option.


    In the crontab, you must specify the exact time you want a program to run. The
    time and tasks are written in the crontab in six fields:


    +   - <Minute> 0–59

    - <Hour> 0–23

    - <Day of Month> 1–31

    - <Month> 1–12

    - <Day of Week> 0–6

    - <Command to Run> command


    To run a command on every single unit in the field, use an asterisk (*). In the
    following example, the crontab is edited to run the ls command every Friday at
    4 p.m. and redirect the output to a file called list.


    # AUTOMATE TASKS


    ![](img/62c9d4555470e74cbdf27d6e2d0b22c6_173_0.png)


    +   - Open a new UNIX Terminal by right-clicking anywhere on the open desktop.

    - A pop-up menu appears.

    - Choose Tools.

    - Click Terminal.

    - After you select Terminal, the pop-up menu disappears and a new Terminal window
    appears on the desktop.

    - Type crontab -e to edit the crontab.'
  merge: -1
