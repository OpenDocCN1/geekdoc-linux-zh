  md: '# LOG OUT OF UNIX


    When you''re finished with your UNIX session, you should always log out. Logging
    out of UNIX serves two purposes:


    You should always keep in mind that out of UNIX is not the same as shutting the
    system down. When you log out of UNIX, the operating system is still active —
    only you aren''t logged onto the system, so you can''t make edits, changes, or
    create files.


    +   Logging out of UNIX effectively closes all of the sessions when you can do
    work — preventing others from using your account to change or damage the system.


    +   Leaving the UNIX environment frees resources for the remaining users on the
    system.


    You can log out of UNIX in two ways. First, you can click the Exit button on the
    main desktop toolbar. Alternatively, you can select Logout from the pop-up menu
    that is displayed when you right-click your mouse.


