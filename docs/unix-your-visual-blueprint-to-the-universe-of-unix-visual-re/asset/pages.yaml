  md: '# CHECK NETWORK CONNECTIVITY WITH PING


    You can check whether machines on the network communicate by using the ping command.
    Ping is one of the oldest and most useful commands in the UNIX networking world.


    Ping uses TCP''s feedback mechanism to report whether a host is working or not.


    When ping sends a TCP packet that are returned, ping reports the number of packets
    returned. When ping doesn''t return any packets, either the network or the machine
    isn''t running or configured correctly.


    Basically, the ping command sends a TCP packet between two machines. The TCP (Transport
    Control Protocol) packet is called the virtual circuit because it provides feedback
    after it is received at its destination.


    # CHECK NETWORK CONNECTIVITY WITH PING


    ![](img/62c9d4555470e74cbdf27d6e2d0b22c6_215_0.png)


