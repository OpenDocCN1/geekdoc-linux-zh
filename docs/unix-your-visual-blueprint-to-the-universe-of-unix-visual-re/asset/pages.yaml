  md: '# SEND E-MAIL IN NETSCAPE


    You can start sending e-mail after you finish setting Netscape to connect to the
    Internet and locate a mail server. Sending e-mail in Netscape is a very simple
    task, it requires a couple clicks of the mouse and some reasonable typing skills
    to put together a letter. The actual utility to send emailmail Netscape is a program
    called Netscape Messenger, which works the exact way on all versions of Netscape.


    Note that unlike some e-mail programs, Netscape on UNIX normally doesn''t get
    your mail for you. To save CPU cycles and reduce your annoyance level, Netscape
    doesn''t pull mail from the mail server 10 to 15 minutes. Instead, when you want
    to check for mail, click the Get Mail button on the toolbar.


    ![](img/62c9d4555470e74cbdf27d6e2d0b22c6_237_0.png)


    ![](img/62c9d4555470e74cbdf27d6e2d0b22c6_237_1.png)


