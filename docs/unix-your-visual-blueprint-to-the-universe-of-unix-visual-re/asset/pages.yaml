  md: '# ADD A TO DO IN THE CALENDAR


    You can choose to add a To Do entry into your calendar rather than a standard
    Appointment in the Common Desktop Environment calendar application. The difference
    between a To Do entry and an Appointment is very slim, except of course that a
    To Do enters a task you need to complete by a certain time or date, rather than
    an Appointment. A To Do appears the same on screen as an Appointment, with two
    main differences.


    First, a To Do task has its own Editor screen, called the To Do Editor as opposed
    to the Appointments Editor screen. Second, the To Do Editor screen has an additional
    option for you to choose — the Completed button. By default, this button is left
    blank, or unselected. After you complete the task, you can return to the Editor
    and mark the task as completed by clicking the button so that your calendar is
    up-to-date.


