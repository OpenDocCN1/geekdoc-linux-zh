  md: '# WORKING WITH PROCESSES


    # Extra


    The best location for storing log files

    Although you can store log files at any location on UNIX system, such as your
    home directory, the root directory, or the /etc directory, you''re best off saving
    log files to the /tmp, or temporary directory. This helps prevent problems caused
    if your disk partition runs out of space because log file has grown too large.


    Using the /tmp directory

    The /tmp directory can fill up, but there are two advantages. First, the /tmp
    directory is usually on its own partition, processes isolated from others. Second,
    the /tmp directory is automatically emptied every time your system is rebooted,
    helping to prevent buildup.

    Preventing a disk partition from filling up and causing problems

    You should delete the log file from time unless you''re trying to stop problems.
    Also, change the Sample Every from 30 to 60 seconds.


