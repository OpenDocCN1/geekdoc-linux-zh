  md: '# MAXIMIZE AND MINIMIZE A WINDOW


    You maximize or minimize the windows in your desktop environment by using the
    default controls on every window in the environment. Whether you''re working with
    a window, a program, or a UNIX terminal, two buttons always have the same purposes.
    These buttons are located at the upper-right corner of each window and let you
    maximize or minimize the window or terminal.


    You can maximize a window to see as much of the window''s contents as possible.
    On the other hand, if you need more space on the desktop, minimizing a window
    hides it without stopping the program or closing the terminal. In either case,
    maximizing or minimizing a window is often more efficient than resizing by clicking
    and dragging; maximizing and minimizing require only one click of the mouse.


    ![](img/62c9d4555470e74cbdf27d6e2d0b22c6_41_0.png)


    # MAXIMIZE AND MINIMIZE A WINDOW


    ![](img/62c9d4555470e74cbdf27d6e2d0b22c6_41_1.png)


    MAXIMIZE A WINDOW


    Click the Maximize button.


    +   - Move your mouse pointer over the Maximize button.


    +   - On any window, the Maximize button is in the upper-right corner and has
    a square on it.


    +   - The window expands to its maximum size. A maximized window usually fills
    the entire screen. The pictures and words stay the same size.'
  merge: -1
