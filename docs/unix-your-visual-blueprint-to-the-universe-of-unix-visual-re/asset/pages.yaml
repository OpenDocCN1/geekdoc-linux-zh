  md: '# CUSTOMIZE DESKTOP SOUND


    You can customize the volume, tone, and duration of the default sound in your
    UNIX desktop environment. While UNIX isn''t designed as a high-fidelity sound
    system, it is easily configured to give you a distinctive sound for alerts and
    notices. This is particularly useful when you''re working on a UNIX network with
    a large number of similar machines in the same general area. Giving your machine
    a distinct sound serves to


    distinguish it from other background noises while you''re working.

    UNIX normally doesn''t come with a sound player to work other sounds into your
    desktop. However, you may find utilities on the Web that let you do this. Downloading
    and installing a sound-player expands the range of sounds that play on your UNIX
    machine so it is similar to a regular IBM-based PC or Macintosh.


    # CUSTOMIZE DESKTOP SOUND


