    - Choose Tools.

    - A submenu appears.


    +   - Click Terminal.

    - The pop-up menu disappears and a new Terminal window appears on your desktop.


    +   - To log into a machine, rsh at the command prompt, then type the name of
    the machine.


    +   - Press Enter.'
