  md: '# Extra


    Other ways of changing a directory''s ownership

    You can change the ownership of a directory in UNIX by using the chown, or change
    ownership command. The format for chown is: chown <new owner> <filename>.


    Recursive changes with chown


    By default, a change to the directory''s ownership is not recursive. It only becomes
    recursive when you add the command option -R.


    Changing the directory''s ownership to a user that does not exist

    UNIX won''t let you complete this task. When you change a directory''s ownership,
    UNIX compares your request against the users listed in the /etc/passwd file, which
    stores all of the existing user names. If the name is not on the list, the original
    ownership remains the same. If you''re root account, create a new user first,
    then change the directory''s ownership to that newly created user.


