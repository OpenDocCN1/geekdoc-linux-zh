  md: '# Apply It


    Inputting new commands for the mailx program to read a new e-mail


    Whenever you view an e-mail in mailx, you''re still able to perform different
    commands within the program. The mailx command prompt after the message, allowing
    you to input other commands for mailx after you finish with the e-mail.


    Inputting new commands for the mailx program when replying to or composing a new
    message


    Unlike reading a message, mailx requires you to finish writing (or quit from)
    a message that you''re composing. I detail this further in the next section.


    Changing the order of the messages in the inbox


    Unlike newer, graphics-based mail programs, you can change the order of the messages
    by user name, priority, or reverse chronology. Mailx displays messages stored
    in the inbox strictly by chronological order.


