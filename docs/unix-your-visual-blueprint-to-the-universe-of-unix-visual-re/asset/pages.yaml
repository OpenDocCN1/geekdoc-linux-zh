  md: '# CREATE SYMBOLIC LINKS


    Symbolic links are bridges to files and directories that you use on frequent basis.
    For example, a link is useful to access a file in a location that takes some typing
    to reach, such as /etc/sound/events. If you''re familiar with Microsoft Windows,
    think of a symbolic link as the equivalent of creating a Shortcut icon on the
    Windows desktop.


    In UNIX, links come in two varieties, hard and soft. Soft links, which you should
    prefer, are more persistent than hard links. If a soft link doesn''t work, UNIX
    stops trying to use it. If a hard link doesn''t work, your entire computer can
    stop.


    To create a link, use the ln or link command. The option makes the link soft,
    or symbolic. The format for this command is ln <location/name of file> - <name
    of link>


