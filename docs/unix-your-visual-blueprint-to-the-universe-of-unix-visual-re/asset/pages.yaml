  md: '# UNIX


    # # START THE NETSCAPE WEB BROWSER


    You can start the Netscape immediately on your desktop but you need to configure
    it so that you can start browsing the World Wide Web. Your UNIX installation provides
    you with a couple of different ways you can access Netscape, including starting
    your Web browser from the desktop toolbar, from a desktop pop-up menu, or directly
    from the command line of a UNIX Terminal.


    Whichever way you choose, there is no difference in how the Web browser functions
    when it starts. In each case, the Netscape program is activated and a new Web
    browsing window launches on your desktop.


    As a whole, Netscape''s version of a Web browser is as easy to use as the competing
    Microsoft application.


    # START THE NETSCAPE WEB BROWSER


    ![](img/62c9d4555470e74cbdf27d6e2d0b22c6_229_0.png)


    ![](img/62c9d4555470e74cbdf27d6e2d0b22c6_229_1.png)


    +   1 Click the arrow above the Links button on the desktop toolbar.


    +   2 Click Web Browser from the panel to start Netscape.


    +   3 Alternatively, right-click anywhere on the open desktop and choose Links
    from the pop-up menu. A submenu appears.


    +   4 Choose Web Browser from the submenu.


    +   The Links panel slides out.


    214'
