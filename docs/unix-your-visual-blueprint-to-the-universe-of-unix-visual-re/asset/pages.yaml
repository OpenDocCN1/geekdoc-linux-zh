  md: '# REPLY TO E-MAIL


    You can use mailx''s partially automated reply command to respond to e-mail that
    you receive. When you are replying to e-mail, it''s easiest to finish reading
    the incoming e-mail. Mailx is primed to send a reply to whichever e-mail address
    is part of the currently read message.


    You use this buffer when you cut, copy, or paste any text segment in word-processing
    programs ranging from the UNIX vi text editor to the Microsoft Word program in
    Windows.


    Mailx is able to do this because you read a message in the mailx program, mailx
    loads the message into a text buffer. This buffer is a sort of memory cache that
    keeps a segment of text available for use or copying in another message.


