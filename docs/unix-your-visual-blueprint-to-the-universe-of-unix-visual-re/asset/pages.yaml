  md: '# LIST USER GROUPS


    You can use the Admintool utility to view the entire list of user groups on your
    system. A group is a logical collection of user accounts. When you log in as a
    user (as root) you are part of a group of accounts that share file permissions,
    e-mail aliases, possibly the same scale of hard disk that holds data. Admintool
    enables you to view this information in alphabetical order in a friendly, graphic
    mode.


    When Admintool lists all groups, it''s not just listing groups that contain user
    accounts. Admintool shows you all the groups, which may or not contain users.
    For example, you can have a user group called staff that has no users in the group.
    Just because there are no users in the group doesn''t mean the group ceases to
    exist. The staff group is just an empty logical container where you can place
    users.


    # LIST USER GROUPS


    ![](img/62c9d4555470e74cbdf27d6e2d0b22c6_189_0.png)


