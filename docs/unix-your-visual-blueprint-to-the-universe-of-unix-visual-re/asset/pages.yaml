  md: "# DELETE PRINTERS\n\nYou can delete printers from the list of print machines\
    \ in the Print section of Admintool. When a printer is removed from the network,\
    \ remove it from the printer list. Otherwise, users see a visible printer and\
    \ try to send print jobs to it.\n\nAlso, some of the more advanced word processors\
    \ work more actively with printer servers and try to balance printing jobs across\n\
    \na network. Not updating the list of printers in Admintool confuses these programs\
    \ — they send jobs where they will never print!\n\nAfter a printer is scheduled\
    \ for temporary or permanent downtime, remove it from the Admintool list of printers\
    \ as soon as possible. Luckily, Admintool makes this task exceptionally easy for\
    \ you.\n\n![](img/62c9d4555470e74cbdf27d6e2d0b22c6_211_0.png)\n\n+   1 Right-click\
    \ anywhere on the desktop.\n2 The Workspace pop-up menu appears.\n3 Choose Tools.\n\
    \n+   3 Click Admintool from the Tools pop-up menu.\n4 The Admintool window appears.\n\
    \n+   4 Click Browse.\n A drop-down menu appears.\n5 Click Printers."
