  md: '# # EJECT FLOPPY DISKS


    You eject floppy disks from your UNIX machine by using the eject command. This
    contrasts the usual PC method, which allows you to simply remove a floppy from
    the floppy drive by pushing a release button.

    The eject process in the UNIX operating system is more complex than the simple
    "pop and go" philosophy of a PC. UNIX still performs the relatively cumbers tasks
    of mounting and unmounting floppy disks.


    It mounts and unmounts disks automatically the newer versions of the operating
    system.

    By mounting and unmounting disks automatically, the File Manager utility in CDE
    makes your life easier. File Manager automates these functions as part of the
    window that displays the floppy disk''s contents. Course, if you ever suffer a
    power outage and can''t use these commands, keep a paper clip handy to manually
    eject the floppy disk from the drive.


    ![](img/62c9d4555470e74cbdf27d6e2d0b22c6_201_0.png)


    +   * Click the arrow above the Files button on the desktop toolbar.


