  md: '# ADVANCED SYSTEM ADMINISTRATION


    # Apply It


    Default nice value for most jobs


    There is actually more variation in this than you may think. For example, the
    garden-variety job given to the system from a user is at level 20. However, most
    jobs that are requested by the root account, or are run automatically by the system
    are usually lower (more important) priority.


    Maximizing system performance by minimizing your actions


    Again, spending the time typing in the nice command does not, as a rule, affect
    the speed of a completed job more than 99.9 percent of the time. Therefore, you
    do not need to reduce the priority of your job unless it is not very important,
    and it takes up significant computing resources at peak time.


