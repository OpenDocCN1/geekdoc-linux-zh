    combining ps and grep commands together with the pipe symbol. This triple combo
    of UNIX commands and symbols is one of the most powerful and useful in your operating
    system. That''s because you can find processes by command name, process identification
    number, or — most commonly by user name.


    grep command searches for either numeric or alphabetical patterns, you specify
    the pattern to be a user''s name, the digit of the process identification number,
    or the command name.


    Grep''s ability to find patterns within longer text or number strings is a wonderful
    asset for you. For example, if you''re searching for a process but you''re not
    sure if it''s called "telm,"telnet," or "telwm," tell grep to find "tel," and
    all three commands are found.


