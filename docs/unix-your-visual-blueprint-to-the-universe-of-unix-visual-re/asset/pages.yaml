  md: '# CHANGE USER ACCOUNTS (CONTINUED)


    You can easily change a user account''s password in Admintool to improve the level
    of security on your system. Normally, because users can set their passwords whenever
    they want, you only have to edit their passwords in special situations.


    You can also improve the security on your system by requiring regular user password
    changes. You can set the interval by typing the number of days in the Min Change
    field of the Modify user, or you can set a specific date for the passwords on
    the system. Changing passwords improves security, because a hacker who has gained
    illegal access no longer has a valid password.


    The most common case is when you''re having a security problem where someone is
    hacking (gaining illegal access) onto your system through a specific user account.
    If the user is on vacation or not using his her account, it''s up to you to make
    the password change.


