  md: '# Extra


    # Setting up Netscape browser to use automatic proxy configuration


    # Netscape using proxy servers


    Automatic proxy configuration is the third of the three settings in the Proxies
    screen. By selecting this option, you tell Netscape where the proxy configuration
    is located. Though rarely used, your network administrator is able to tell you
    whether you need to use this setting, and what to enter in the Configuration Location
    field.


    Netscape with large user groups and demands proxy servers to spread network load
    and increase access speed. Rather than overload one server needs to handle printing,
    ftp transfers, and Web access, many organizations spread these functions by allocating
    one machine per user. They often refer to these machines by their task, as print
    server, ftp server, or Web server.


    ![](img/62c9d4555470e74cbdf27d6e2d0b22c6_232_0.png)


    ![](img/62c9d4555470e74cbdf27d6e2d0b22c6_232_1.png)


    If your network administrator has set up with a direct connection to the Internet,
    click the Direct Connection to the Internet button.


    If you need to configure proxies manually, click the Manual Proxy Configuration
    button and click the View button to bring up the View Manual Proxy Configuration


    The proxy information in the fields on the left, and the port number for connecting
    in the fields to the right. OK when you finish.


    When you have made your selections, close the Preferences window by clicking the
    Close button - X in the upper-right corner.


    Return to the Netscape browser.'
