  md: '# CREATE NEW FILES


    You can easily create new files in the UNIX Terminal. A new file can be the product
    of a utility, an application, an automated cron job, or a regular file you create
    on the fly. Of course, you have complete flexibility to create new text, graphics,
    or binary files in UNIX, depending on the program you''re using.


    Usually, you create files in the UNIX Terminal with the key UNIX utility, the
    vi text editor (the vi editor is covered in Chapter 5). However, for the purposes
    of this example, you use one of the oldest UNIX utilities, specifically designed
    to create files with a single command. `touch` creates an ASCII text file. This
    means that you''re going to be creating a file that has no data inside it, but
    that you can edit with any of the UNIX system''s editing utilities like the vi
    editor.


