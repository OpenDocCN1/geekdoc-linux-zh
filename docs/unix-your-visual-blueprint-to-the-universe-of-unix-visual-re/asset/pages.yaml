  md: '# FINGER ANOTHER USER


    the finger command enables you to find out whether or not a particular user is
    currently logged on. The odd name finger was given to this command because in
    a sense it points to the person''s account that you are looking for.


    The advantage of using finger over who or w is that it is slightly quicker, particularly
    on systems where there are dozens of users. The finger command is also more common
    on some of UNIX than who but finger is almost universal on all UNIX platforms
    and flavors.


    This command is similar to the who, or, command, which tells you the identity
    of each and every person logged onto the UNIX system. By contrast, the finger
    command only displays data on one user account, and you must know the user''s
    account name in order to perform finger successfully.


