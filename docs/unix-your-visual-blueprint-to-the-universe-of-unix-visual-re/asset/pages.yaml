  md: "# TEST A NETWORK CONNECTION\nVIA HOST NAME\n\nYou can test whether your UNIX\
    \ machine can talk to other computers on the ping command. Ping is one of the\
    \ oldest and most useful commands in UNIX, and is found on all flavors and versions\
    \ of the operating system. You'll want to use ping when checking on or hooking\
    \ up machines so you can see if there is connectivity between two computers on\
    \ your network.\n\nPing works by sending a TCP packet between two machines. The\
    \ TCP (Transport Control Protocol) packet is also called the virtual circuit because\
    \ it provides feedback back from the machine you sent it to. Ping harnesses the\
    \ power of TCP's feedback mechanism to report whether a host is up and working.\
    \ If there is connectivity between two machines, you'll get a response back from\
    \ the ping command; if not, the ping won't return anything at all. The syntax\
    \ for the ping command is ping <hostname>.\n\n# TEST A NETWORK CONNECTION VIA\
    \ HOST NAME\n\n![](img/62c9d4555470e74cbdf27d6e2d0b22c6_267_0.png)\n\n+   - Open\
    \ a new UNIX terminal by right-clicking anywhere on the machine you want to connect.\n\
    \t\t\t- The Workspace Menu appears.\n\t\t\t- Choose Tools.\n\n+   - Click on Terminal\
    \ in the submenu that appears.\n\t\t\t- When select Terminal, the pop-up menu\
    \ disappears and a new Terminal window appears on the desktop.\n\n+   - At the\
    \ command prompt, type ping and the name of the machine you want to contact.\n\
    \n+   - Press Enter."
