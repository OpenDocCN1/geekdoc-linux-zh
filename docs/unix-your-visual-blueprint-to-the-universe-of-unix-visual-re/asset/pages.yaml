  md: '# Extra


    # Closing the Calculator window


    You have two other options for closing the Calculator window besides the Quit
    key. First, you can select the box marked with a - sign in the upper left hand
    of the Calculator window, then click Close in the resulting pop-up menu.


    Also, on some versions of UNIX, you may be able to shut the Calculator program
    down by simply pressing Ctrl-C.


    # Saving results


    Unfortunately, the Calculator application is more of a desktop utility than a
    program in its own right. Therefore, you are not given the option of saving the
    results of your work. You should write down the answer to a given problem you''ve
    calculated in the Calculator so you don''t lose your work. Also, if you shut the
    Calculator program down, you will have to redo your calculations when you restart
    it the next time.


    The availability of Calculator if you''re working in CDE in a different version
    of UNIX, such as HP-UX


    The Calculator application is native to the Common Desktop Environment, so you
