  md: '# VIEWING THE START OF A FILE


    You are able to see the beginning lines of any file with the head command. Head,
    short for header, displays the first ten lines of a given file by default. The
    command syntax for using the head head <file name>. You also specify how many
    lines of the file appear from the top of the file for access to more data from
    the file. To do this, use the -n command option.


    Head is useful in a way similar to the cat command for a quick glance at short
    text files or other small UNIX files. Head is especially helpful when there are
    a large number of files in a directory and the file names aren''t easy to remember.


    # VIEWING THE START OF A FILE


    ![](img/62c9d4555470e74cbdf27d6e2d0b22c6_115_0.png)


    +   - Open a new UNIX terminal by right-clicking anywhere on the desktop.


    +   - A pop-up menu appears.


    +   - Choose Tools.


    +   - Click Terminal. After you select Terminal, the pop-up menu disappears and
    a new Terminal window appears on the desktop.


    +   - To see the first 10 lines of a file, type head and the name of the file
    at the command prompt.


    +   - Press Enter.'
  merge: -1
