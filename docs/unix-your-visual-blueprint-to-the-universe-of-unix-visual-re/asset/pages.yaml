- img_proc: true
  md: '# RECEIVE E-MAIL


    You can receive e-mail automatically in mailx whenever you start the program.
    Additionally, you can reply to an e-mail immediately upon receiving and reading
    it in mailx.


    Mailx has its own conventions for receiving and replying to e-mail. In most UNIX
    installations, mailx works with a notification program called biff. Biff is a
    small program that automatically beeps whenever mailx arrives.


    However, if your system is not equipped with speakers — or the biff program itself
    — a message at the base of the screen also tells you that a message has arrived.


    The mailx program automatically sends a command to your mail server to download
    any new mail that you have received since the last time you started mailx. This
    new mail appears in the opening mailx screen.


    ![](img/62c9d4555470e74cbdf27d6e2d0b22c6_241_0.png)


    ![](img/62c9d4555470e74cbdf27d6e2d0b22c6_241_1.png)


    +   1 Right-click anywhere on the open desktop.

    2 A pop-up menu appears.

    3 Choose Tools.


    +   3 Click Terminal.

    4 A new Terminal window appears on the desktop.

    5 At the command prompt, type mailx.

    6 Press Enter.'
  merge: -1
