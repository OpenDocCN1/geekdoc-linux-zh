  md: '# STOP UNIX WITH HALT


    You can also stop the UNIX machine with the halt command. Halt, as its name implies,
    stops the machine more quickly, without regard to the programs or applications
    that may be running on the machine at the time it is shut down.


    On the flip side, halt is not as desirable a method of shutting a machine down
    as the shutdown command. This is because shutdown automatically makes sure that
    programs or applications that are running have time to exit, thereby preventing
    data corruption. Unless specified, halt doesn''t do this, which increases the
    chance that you may damage or corrupt a program that is running at the time halt
    is initiated.


    Halt is a very useful command in certain situations. For example, if the machine
    is hung, meaning that it refuses to respond to any commands at all, then halt
    may succeed in shutting your machine down where the shutdown command may fail.


    ![](img/62c9d4555470e74cbdf27d6e2d0b22c6_29_0.png)


    ```

    halt

    ```


    ```

    shutdown -h

    ```


    +   To run the halt command, type halt at the command prompt.


    +   Press Enter. The system shuts down.


    +   An alternative to halt is to specify that the shutdown command uses halt when
    it shuts programs down. Type shutdown -h at the command line, then press Enter.
    This is useful if programs don''t respond to the shutdown command.'
  merge: -1
  pgno: 29
- img_proc: true
  md: '# Extra


    # Timing shutdown with the halt command


    Unlike the shutdown command, halt doesn''t allow you the flexibility of waiting
    30 or 60 seconds before it begins to shut the machine down. This is because halt
    is normally used when there is something wrong on the system, so waiting is not
    a preferable option.


    Unlike shutdown, there is no delay. Once you type halt and press Enter, the system
    immediately shut down.


    Using the sync command before halt

    This isn''t absolutely necessary, but typing in the sync command gives you an
    extra measure of protection, or at least makes you more secure that your data
    won''t be corrupted when you halt the machine.


    ![](img/62c9d4555470e74cbdf27d6e2d0b22c6_30_0.png)


    ![](img/62c9d4555470e74cbdf27d6e2d0b22c6_30_1.png)


    ![](img/62c9d4555470e74cbdf27d6e2d0b22c6_30_2.png)


    A third option is to make sure that the halt command doesn''t cause damage to
    the system. Type the **sync** command at the command line, then pressing Enter.
    The sync command synchronizes system data, thereby preventing data corruption.


    After running sync, **halt**, then press Enter. The system shuts down.'
  merge: -1
