  md: '# WORKING WITH PROCESSES


    # Extra


    # Using PIDs


    kill is written specifically to use PIDs only. If it were otherwise, there would
    be serious problems on the UNIX system if you killed the job vi and all vi processes
    run by all other people were killed.


    # Accidentally stopping the Unix session


    By default, UNIX runs several background processes in its operating system. If
    you kill everything run by your name and you are logged in as root, for example,
    you terminate your UNIX session by accident.


    # Applying kill within a program


    No problem. Because your kill command aims at a specific PID, if the program with
    that PID isn''t running, the signal is not received by anyone.


    ![](img/62c9d4555470e74cbdf27d6e2d0b22c6_142_0.png)


    ![](img/62c9d4555470e74cbdf27d6e2d0b22c6_142_1.png)


    ```

    # ps -ef | james

    james 8402 8338 03:30:46 pts/3 0:00 telnet

    ```


    ```

    # ps -ef | prep james

    james 8402 8338 03:30:46 pts/3 0:00 telnet

    # kill 8402

    ```


    The telnet process appears.


    The critical bit of information, the process ID number, is shown in the second
    column from the left, 8402.


    +   6 To kill this process, type kill 8402 at the command prompt.


    Note: You can check whether the process has been killed by running the ps command
    a second time.


    +   7 Press Enter.'
