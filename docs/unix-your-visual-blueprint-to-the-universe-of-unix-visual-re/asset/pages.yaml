  md: '# USE THE -1 OPTION WITH RLOGIN


    You can connect to other UNIX machines as a different user account than the one
    you''re currently logged in. You can do this with the help of the most powerful
    of the login commands, -1. The -1 option starts the login login process as a completely
    different user account. This is especially helpful when the user account has special
    privileges, such as the root account. When you login to clients and servers on
    your network as root, you can give commands remotely that only the administrative
    account is allowed.


    For example, when you''re logged in a user and want to edit the /etc/passwd files
    on a remote machine, you log in as root. By using the computer as the root account
    (if you have the password) and edit the passwd file without touching the remote
    machine.


    # USE THE -1 OPTION WITH RLOGIN


