- img_proc: true
  md: '# ADVANCED SYSTEM ADMINISTRATION


    # Extra


    I do not see a command I used in the list of commands displayed by history


    I cannot see any commands listed when I use the history command


    Remember history only displays commands that have been entered during your current
    UNIX session. A UNIX session is the period of time between logging in to the system
    and logging out of it. So, if you logged in to the system, performed the `cp`
    command, logged out, and then logged again a couple hours later, history does
    not display the `cp` command you used because you are now in a new UNIX session.


    If you just logged in to your UNIX machine without performing any extra actions,
    you may see nothing on the history command list. You have not entered any commands
    in this particular session, so there isn''t anything to display yet.


    ![](img/62c9d4555470e74cbdf27d6e2d0b22c6_310_0.png)


    ![](img/62c9d4555470e74cbdf27d6e2d0b22c6_310_1.png)


    The history command gives you a numerical list of commands that you have executed
    previously in UNIX session.


    To repeat a command from the list, type `<task number>` and press Enter. The operating
    system repeats the task you selected, and you are returned to the command prompt.'
