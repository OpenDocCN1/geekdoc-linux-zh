  md: '# RESIZE A WINDOW


    You can resize or close windows on your desktop for any number of reasons. For
    example, you can make a window smaller to reach a part of the desktop or toolbar
    that''s hidden behind the window.


    You can enlarge a window to see more of its contents. Of course, if you have 50
    Items in a given window, you may not be able to expand the window enough to see
    all of the items. In this case, the the desktop GUI automatically provides a scroll
    bar that you click and drag to see the entire list of items.


