  md: '# ADD USER GROUPS


    You can add user groups with the Admintool utility. This is a particularly important
    task if you work on a network with more than a few user accounts. Creating new
    user groups helps you to keep large numbers of users organized. In the corporate
    world, you can organize your groups by department, such as Accounting, Marketing,
    or Human Resources. Similarly, in an academic environment, you can organize your
    groups by discipline, such as Biology, Social Studies, or Computer Science.


    Remember, no set ratio exists between users and user groups. Because user accounts
    are just the method by which a user can log into a UNIX system, a single user
    can have one or multiple user groups. Similarly, a group can have one user, two
    users, a million users, or no users at all — the logical grouping still exists
    and works just well.


    ![](img/62c9d4555470e74cbdf27d6e2d0b22c6_191_0.png)


