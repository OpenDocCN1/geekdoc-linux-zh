    in Microsoft Windows is the ability to change the method by which the number you
    are working with is displayed. The standard method of displaying the numbers you
    input into the Calculator program is in the default Decimal form.


    mathematical shorthand that the computer uses to perform the calculation.


    The decimal form equates any number as the whole number input, plus its amount
    to the hundredths place. Thus, 100.00 will appear as you begin to perform an operation
    on the number. This does not affect the result of the operation you perform; it''s
    simply a form of


    If you build programs, or code in UNIX, then on occasion, you may need to know
    what a given number looks like in hexadecimal, or hex form for this. This form
    is used in UNIX, among other things, for determining the settings of permission.
    (Most people use the easier alphabetic form of permission setting, discussed in
    detail in Chapter 4.) However, if you want to view the number in hex form in the
    Calculator program, you can do so with a single click on the Display button.


