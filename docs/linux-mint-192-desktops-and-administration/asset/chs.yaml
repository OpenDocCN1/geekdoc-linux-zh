  \ ![Image](img/image-261.png) | 配置按键重复灵度和特殊任务按键。 |\n| 鼠标和触控板 | ![Image](img/image-262.png)\
  \ | 鼠标和触控板配置：选择手部方向、速度和辅助功能 |\n| 网络 | ![Image](img/image-263.png) | 允许你开启有线和无线网络。你可以访问可用的无线网络和代理配置。\
  \ |\n| 电源管理 | ![Image](img/image-264.png) | 设置笔记本电脑闲置时的电源选项 |\n| 打印机 | ![Image](img/image-265.png)\
  \ | 使用 `system-config-printer` 配置打印机 |\n| Sound | ![Image](img/image-266.png) |\
  \ 配置音效、输出音量、音频设备选项、输入音量和音频应用设置 |\n| 系统信息 | ![Image](img/image-267.png) | 系统和硬件信息\
  \ |\n| 管理部分 | | |\n| 设备驱动程序 | ![Image](img/image-268.png) | 为显卡等设备选择驱动程序。 |\n| 防火墙\
  \ | ![Image](img/image-269.png) | 打开 `Gufw` 对话框管理 `ufw` 防火墙。需要安装 `Gufw`。 |\n| 登录界面\
  \ | ![Image](img/image-270.png) | 打开登录窗口偏好对话框以配置 Linux LightDM 显示管理器 (`LightDM`)。\
  \ |\n| 软件源 | ![Image](img/image-271.png) | 打开 Linux Mint 软件源选择对话框以激活或禁用软件仓库。 |\n\
  | 用户和组 | ![Image](img/image-237.png) | 管理用户 |\n\n**表 6-9：桌面系统设置**\n\n### 外观\n\n\
  系统设置中的“外观”部分提供了四个对话框，用于配置背景、主题、字体和桌面效果。\n\n### 背景\n\n“背景”对话框列出了你可以选择的背景（参见 图 6-61）。在“图像”选项卡上，左侧的滚动框列出了已安装的背景集。你可以通过点击滚动框左下角的“+”按钮从本地文件夹选择自定义图像。这将打开“添加文件夹”对话框，允许你选择一个包含图片的文件夹。你可以使用滚动框左下角的“-””按钮删除该文件夹。\n\
  \n![Image](img/image-272.png) ![Image](img/image-273.png)\n\n图 6-61：背景：图像选项卡\n\n\
  在“设置”中，你可以选择从选定文件夹运行幻灯片，并提供随机顺序时间间隔选项（参见 图 6-62）。从“图片比例”菜单中，你可以选择显示选项，如缩放、居中、等、马赛克、拉伸、跨越或无图片。居中或等比例图像将保持图像比例。拉伸和跨越可能会使其失真。任何未填充的空间（如使用居中或等比例图像时）将用桌面颜色填充。\n\
  \n![Image](img/image-274.png) ![Image](img/image-275.png)\n\n![Image](img/image-276.png)\
  \ ![Image](img/image-277.png)\n\n图 6-62：背景：设置选项卡\n\n居中、等比例和跨越选项还显示渐变选项。对于渐变，使用“渐变颜色”按钮来选择渐变两端的颜色。从“背景渐变”菜单中，你可以选择垂直或水平渐变。点击颜色按钮打开“拾取颜色”对话框，你可以在其中选择一种颜色。点击此对话框上的“+”按钮可以打开颜色选择器，你可以在其中输入颜色十六进制代码或从滑块中选择，然后调整其深浅。\n\
  \n初始状态，仅列出 Linux Mint 的背景（包括来自之前的 Linux Mint 版本的背景）。安装 `gnome-backgrounds` 包可以添加一组\
  \ GNOME 背景。你还可以添加来自之前的 Linux Mint 版本的背景，例如 `mint-backgrounds`。\n\n### 字体\n\n字体对话框允许你设置设置桌面、文档和窗口标题的默认字体，以及抗锯齿、提示和字体缩放。它还设置了等宽字体（参见\
  \ 图 6-63）。\n\n![Image](img/image-278.png) ![Image](img/image-279.png)\n\n图 6-63：字体\n\
  \n## 主题\n\n主题对话框有三个选项卡：主题、添加/删除和设置。主题选项卡显示当前选择主题的组件（参见 图 6-64）。你可以通过选择不同的图标集、控件、窗口边界、鼠标样式和桌面主题来自定义桌面。点击图标打开菜单，从中选择其他集合。点击桌面图标打开一个菜单，允许你选择另一个已安装的主题。Linux\
  \ Mint 使用 Mint 主题作为窗口、图标和控件集。\n\n![Image](img/image-280.png)![Image](img/image-281.png)\n\
  \n图 6-64：主题\n\n![Image](img/image-282.png)\n\n图 6-65：主题 -桌面\n\n### 添加/删除\n\n在“添加/删除”选项卡上，你可以下载可用主题（参见\
  \ 图 6-66）。“排序方式”菜单允许按人气、名称或日期进行排序。要安装主题，点击主题条目右侧的下载按钮（向下箭头）。下载完成后，向下箭头消失，主题条目中会出现一个勾选图标。随后你将在主题选项卡的桌面图标菜单中看到它。\n\
  \n“添加/删除”选项卡底部的工具栏具有“更多信息”（灯泡图标）、卸载（移除已安装的主题）、更新（更新已安装的主题）和刷新（刷新可用主题列表）按钮。要查看所选主题的更多信息，点击“更多信息”按钮打开其网页。可用主题列表可以在\
  \ [`cinnamon-spices.linuxmint.com/themes`](https://cinnamon-spices.linuxmint.com/themes)\
  \ 找到。\n\n![Image](img/image-283.png)\n\n![Image](img/image-284.png)\n\n图 6-66：主题（在线主题）\n\
  \n### 设置\n\n在“设置”选项卡上，你可以设置在菜单和按钮中显示图标的选项，以及设置滚动条行为，如允许叠加滚动条（参见 图 6-67）。\n\n![Image](img/image-285.png)\n\
  \n图 6-67：主题（设置选项卡）\n\n\n\n\n\n在系统设置的偏好部分，诸如小部件（Applets）和菜单（Menu）等对话框允许你配置桌面。Cinnamon\
  \ 和 Mate 通用的偏好对话框将在第 3 章中讨论。Cinnamon 特有的偏好，例如时间设置（日历）和应用程序默认值（`Applications &` Removable\
  \ media），在此处讨论。\n\n### 首选应用程序和可移动媒体\n\n“首选应用程序”（Preferred Applications）对话框允许你为任务和媒体设置默认应用程序。在“首选应用程序”选项卡上，你可以为基本类型的文件设置默认应用程序：网络浏览器、电子邮件、文档、文本编辑器、音乐、视频、照片、源代码和终端（参见图\
  \ 6-68）。使用下拉菜单选择已安装的替代方案，例如用 Thunderbird 替换 Evolution 处理邮件，或用 Image Viewer 替换 Shotwell\
  \ 查看照片。\n\n![Image](img/image-286.png) ![Image](img/image-287.png)\n\n图 6-68: 首选应用程序\n\
  \n在“可移动媒体”（Removable media）选项卡上，你可以为不同的媒体指定默认操作：CD 音频、DVD 视频、音乐播放器、照片和软件媒体。可以通过关闭“插入媒体时提示或启动程序”选项来禁用此功能。你可以从菜单中选择用于不同媒体的应用程序（参见图\
  \ 6-69）。这些菜单还包括“询问做什么”（Ask What To Do）、“什么都不做”（Do Nothing）和“打开文件夹”（Open Folder）选项。“打开文件夹”选项将打开一个显示光盘文件的窗口。点击“其他媒体”（Other\
  \ Media）按钮将打开一个对话框，允许为蓝光光和音频 DVD 等较常用的媒体设置关联。初始情况下，所有条目都设置为“询问做什么”。对于相应的媒体列出了可能的选项，例如\
  \ CD 音频盘使用 Rhythmbox 音乐播放器，DVD-Video 使用视频播放器（Totem）。照片可以使用 Shotwell 照片管理器打开。\n\n\
  ![Image](img/image-288.png)\n\n图 6-69: 首选应用程序：可移动媒体\n\n当你插入可移动媒体（如 CD 音频盘）时，其关联应用程序会自动启动，除非你更改了该偏好。如果你想关闭特定媒体的此功能，可以从其应用程序菜单中选择“什么都不做”。如果你希望提示选项，请使用“询问做什么”选项。然后，当你插入光盘时，会显示一个带有可能操作下拉菜单的对话框。从此菜单中，你可以选择另一个应用程序，或选择“什么都不做”或“打开文件夹”选项。\n\
  \n### 日期设置（日历小部件）\n\n日历小部件位于底栏右侧（参见图 6-70）。日历显示当前日期，但你可以使用日历顶部的月份和年份滚动箭头移动不同的月份和年份。\n\
  \n![Image](img/image-289.png)\n\n图 6-70: 日历小部件\n\n日期和时间选项通过系统设置中的日期时间对话框进行设置，可以在日历菜单中选择“日期时间设置”，或点击系统设置偏好部分中的日期时间图标来打开（参见图\
  \ 6-71）。\n\n![Image](img/image-290.png) ![Image](img/image-291.png)\n\n图 6-71: 时间日期设置，网络时间\n\
  \n你可以使用左侧的地图或从“区域”或“城市”菜单中选择区域或城市来设置时区。你还可以指定时间格式，使用 24 小时制、显示日期以及秒。时间和日期可以手动设置或从时间服务器（网络时间开关）自动设置。对于手动更改，可以通过关闭网络时间开关直接设置日期和时间。\n\
  \n从小部件对话框配置日历小部件（或在面板上的日期小部件上右键点击并选择“配置”），将显示指定面板和小部件日期显示格式的选项（参见图 6-72）。该格式使用不同日期元素的格式说明符，例如\
  \ `%a` 表示星期，`%I` 表示小时，`%y` 表示年份。你可以点击“显示日期格式语法信息”按钮打开一个网站，在其中学习各种格式。\n\n![Image](img/image-292.png)\n\
  \n图 6-72: 日历小部件\n\n或者，你可以使用 `timedatectl` 命令管理系统时间和日期。Linux Mint 上的日期和时间是使用 `timedated`\
  \ 守护进程实现的，这是一个 systemd 守护进程。`timedatectl` 命令接受多个选项：`set-time` 设置时间，`set-timezone`\
  \ 设置时区，`set-ntp` 开启 NTP 网络时间。`status` 选项显示当前设置。请参 `timedatectl` 手帮助页以获取选项的详细列表和示例。日期使用连字符，时间使用冒号。如果你同时设置日期和时间，请将它们括在引号中。以下命令将日期和时间设为\
  \ 2016 年 6 月 21 日下午 3:40：\n\n```bash\ntimedatectl set-time \"2016-06-21 15:40\"\n\
  ```\n\n### 屏幕保护与锁屏\n\n系统设置屏幕保护对话框集成了锁锁，并允许你自定义显示。在“屏幕保护”选项卡上，你可以指定屏幕空闲时间，使其在不使用时关闭。你还可以控制是否锁定屏幕（参见图\
  \ 6-73）。\n\n![Image](img/image-293.png) ![Image](img/image-294.png)\n\n图 6-73: 屏幕保护选项卡\n\
  \n注意：Cinnamon 不支持 Xscreensaver，没有屏幕保护选项卡。\n\n在“自定义”选项卡上，你可以设置锁定时的显示消息，自定义显示时间的大小和字体，并启用快捷键、浮动时和显示专辑等额外选项（参见图\
  \ 6-74）。\n\n![Image](img/image-295.png)\n\n图 6-74: 屏幕保护 - 自定义\n\n### 语言\n\n在语言设置对话框中，你可以为菜单和窗口选择语言（参见图\
  \ 6-75）。显示当前选择的语言。点击语言和区域图标显示语言变体菜单，例如“英语（爱尔兰）”或“英语（印度）”。区域选项调整货币、数字和计量等功能，例如“英语（英国）”或“英语（香港）”。点击“应用于系统范围”按钮将语言应用于整个系统。使用“安装/删除语言”按钮打开“安装/删除语言”对话框，可以在其中添加新语言或删除已安装的语言。点击此对话框上的“添加”按钮可以添加新语言。\n\
  \n![Image](img/image-296.png) ![Image](img/image-297.png)\n\n图 6-75: 语言\n\n### 输入法\n\
  \n输入法应用程序为各种语言（如日语、韩语和中文）提供了安装和配置指南。支持的语言有选项卡（参见图 6-76）。顶部的菜单允许你指定 XIM 框架。\n\n![Image](img/image-298.png)\
  \ ![Image](img/image-299.png)\n\n图 6-76: 输入法\n\n\n\n\n\n系统设置中的“辅助功能”对话框允许你为键盘和鼠标操作配置界面的备用访问方式。四个标签页分别设置显示、键盘属性、打字和鼠标功能。“视觉”（Visual）允许你调整对比度和文本大小，以及是否允许使用屏幕阅读器（参见图\
  \ 6-77）。“键盘”（Keyboard）可以显示屏幕键盘，并使用视觉提示代替警报声。“打字辅助”可以调整按键力度。“鼠标”（Mouse）允许你使用键盘进行鼠标操作。\n\
  \n![Image](img/image-300.png) ![Image](img/image-301.png)\n\n图 6-77: 辅助功能\n\n##\
  \ 启动应用程序\n\n在“启动应用程序”对话框中，你可以选择想要自动启动的额外程序。某些程序会自动开启（参见图 6-78）。如果你不再希望某项程序自动启动，请关闭该项。若要添加未列出的应用程序，请点击对话框底部按钮栏上的添加按钮\
  \ `(+)`，并选择“自定义命令”或“选择应用程序”。“选择应用程序”项会打开应用程序对话框，列出所有可能的应用程序。“自定义命令”项会打开一个对话框，你可以在其中输入应用程序名称和程序路径（使用“浏览”选择程序，通常在\
  \ `/usr/bin` 中）。若要从列表中删除某项，请选择它并点击按钮栏上的删除按钮 `(-)`。\n\n你可以选择任何项，并通过选择该项后点击按钮栏上的编辑按钮\
  \ `(铅笔图标)` 来编辑其名称、应用程序以及启动延迟时间。这将打开“编辑启动程序”对话框，其中包含名称、命令、注释和启动延迟的条目。任何启动延迟都将显示在对应的条目中。\n\
  \n如果你想立即运行该应用程序，可以选择它，然后点击按钮栏上的“立即运行”按钮 `(齿轮图标)`。\n\n![Image](img/image-302.png)\
  \ ![Image](img/image-303.png)\n\n图 6-78: 启动应用程序设置\n\n## 扩展\n\n扩展为你的桌面界面添加第三方增强功能，例如透明面板、桌面水印和晃动窗口。并非所有扩展都兼容，如果不兼容，你将收到警告。“扩展”显示两个标签页：“管理”和“下载”（参见图\
  \ 6-79）。“管理”标签页列出所有已安装的扩展。使用底部的按钮栏来管理它们。你可以通过 `(+)` 或 `-` 启用或禁用扩展，或者通过 `(x)` 完全删除它。弯折箭头按钮将禁用所有扩展。已启用的扩展旁边会出现一个勾选标记。如果该扩展可以配置，还会出现一个齿轮按钮，你可以点击它打开配置对话框。\n\
  \n![Image](img/image-304.png) ![Image](img/image-305.png)\n\n图 6-79: 扩展管理页\n\n“下载”标签页列出可用的扩展（参见图\
  \ 6-80）。点击扩展的下载按钮 `(向下箭头)` 即可下载并安装。随后，勾选标记会出现在向下箭头的位置。“排序”菜单允许按名称、人气、日期和安装情况进行排序。你也可以使用左侧的搜索框搜索扩展。底部的按钮栏允许你获取扩展的更多信息\
  \ `(灯泡)`、删除已安装的扩展 `(x)`、获取更新 `(齿轮)` 以及刷新列表 `(圆形箭头)`。\n\n![Image](img/image-306.png)\n\
  \n图 6-80: 扩展下载页\n\n## 通知\n\n系统设置中的“通知”对话框允许你配置桌面通知（参见图 6-81）。这里有相应的开关可以启用通知、在超时后移除通知，以及在屏幕底部显示它们。“显示测试通知”将根据你当前的设置显示一条通知示例。在此对话框上，你还可以设置\
  \ OSD 媒体键的大小。\n\n![Image](img/image-307.png) ![Image](img/image-308.png)\n\n图 6-81:\
  \ 通知\n\n## 隐私\n\n系统设置中的“隐私”对话框允许你决定是否想要记住最近的文件（参见图 6-82）。如果你选择记住最近文件，你还有“永不忘记”的选项。你还可以检查互联网连接情况，查看你的网络连接是否可以访问互联网。\n\
  \n![Image](img/image-309.png) ![Image](img/image-310.png)\n\n图 6-82: 隐私\n\n## 通用\n\
  \n在“通用”对话框中，你可以设置缩放和其他杂选项，例如禁用自动屏幕旋转以及为注销或关机设置时间延迟（参见图 6-83）。\n\n![Image](img/image-311.png)\
  \ ![Image](img/image-230.png)\n\n图 6-83: 通用\n\n## 硬件\n\n这里讨论了若干项基于硬件的任务，例如配置你的鼠标、键盘和电源管理。其中一些是\
  \ GNOME 3 对话框，类似于 Ubuntu 和 Fedora 版本中提供的对话框。\n\n### 系统信息\n\n“系统信息”对话框显示系统信息，如内存、处理器、发行版和版本（参见图\
  \ 6-84）。\n\n![Image](img/image-312.png) ![Image](img/image-313.png)\n\n图 6-84: 系统信息\n\
  \n### 鼠标和触摸板\n\n系统设置中的“鼠标和触摸板”对话框是配置鼠标和触摸板的主要工具（参见图 6-85）。在“鼠标”标签页，你可以选择鼠标速度、滚动方向、手性以及双击次数。对于笔记本电脑，你可以在“触摸板”标签页上配置点击和边缘滚动。\n\
  \n![Image](img/image-314.png) ![Image](img/image-315.png)\n\n图 6-85: 系统设置，鼠标和触摸板\n\
  \n### 电源管理\n\n对于电源管理，Linux Mint 使用 GNOME 电源管理器，它利用计算机提供的高级配置电源接口 (ACPI) 支持来管理电源使用。GNOME\
  \ 电源将在面板上显示一个图标，显示当前电源：电池（笔记本）或闪电（桌面）。点击电池图标会显示显示无线设备的电量（参见图 6-86）。设备条目包括设备产品和型号。你可以右键点击电源管理器图标显示带有“配置”项的菜单。点击它打开电源管理器小组件对话框，其中列出了小组件的显示选项。如果你希望在电池图标上显示剩余百分比，可以选择“显示百分比”选项。\n\
  \n你还可以通过面板上的“阻止”小组件快速关闭电源管理（将其添加到小组件面板中）。\n\n![Image](img/image-316.png) ![Image](img/image-317.png)\n\
  \n图 6-86: GNOME 电源管理器菜单和小组件配置\n\nGNOME 电源管理器通过“电源”对话框进行配置，可以通过系统设置中的“电源”访问。在“电源”标签页上，你可以设置挂起超时，以及在盖子关闭或电量低时采取的操作（参见图\
  \ 6-87）。如果存在，“电池”标签页上将显示笔记本电脑和无线鼠标的电量。\n\n![Image](img/image-318.png) ![Image](img/image-319.png)\n\
  \n图 6-87: GNOME 电源管理器\n\n在“亮度”标签页上，你可以设置屏幕亮度，以及系统空闲时的调暗选项（参见图 6-88）。\n\n\n\n\n要查看您的笔记本电脑或台式电脑的电源性能情况，可以使用“系统工具”菜单中的“电源统计”。“电源统计”窗口会显示一个侧边栏，列出您不同的电源设备。右侧面板将显示所选设备的用电信息选项卡。笔记本电池设备将显示三个选项卡：详细（Details）、历史（History）和统计（Statistics）。历史选项卡将显示您最近的使用情况，并提供耗尽时间（剩余时间）、充满时间（充电）、电量（Charge）和速率（Rate）的图表选项。统计选项卡可以显示充放电图表。\n\
  \n![Image](img/image-320.png)\n\n图 6-88：GNOME 电源管理器：亮度选项卡\n\n## 键盘设置\n\n系统设置“键盘”对话框显示了输入、快捷键和布局选项卡。输入选项卡可以调整按键重复速率和光标闪烁（参见图\
  \ 6-89）。快捷键选项卡允许您分配按键来执行任务，例如启动网络浏览器或将键盘上的多媒体键映射到多媒体任务（如播放和暂停）。只需选择任务然后按下按键即可。有针对桌面（Cinnamon）、多媒体（声音和媒体）、窗口管理和工作空间管理的任务。通过工作空间管理，您还可以映射按键来执行工作空间切换。已分配的按键将显示出来。\n\
  \n![Image](img/image-321.png)  ![Image](img/image-322.png)\n\n图 6-89：键盘输入\n\n布局选项卡允许您选择语言（参见图\
  \ 6-90）。系统会列出并选中当前的输入语言源。点击“+”按钮可以打开列出其他语言源的对话框，您可以从中添加它们。点击键盘按钮可以查看当前选输入源的键盘布局。您还可以为不同的窗口允许不同的语言布局。\n\
  \n![Image](img/image-323.png)\n\n图 6-90：键盘：布局选项卡\n\n对于特殊的键盘选项，点击“选项”按钮以列出各种选项，例如启用杀死\
  \ X 服务的按键序列（参见图 6-91）。\n\n您也可以在终端窗口中使用 `localectl` 命令设置系统区域和键盘布局。请检查 `localectl`\
  \ 手页以获取详细的选项列表。`status`选项显示当前的区域和键盘布局。`set-locale`选项更改区域，`list-locale`选项列出可用的区域。`set-keymap`选项设置键盘布局，`list-keymaps`选项则列出可能的布局。\n\
  \n```\nlocalectl status\n```\n\n![Image](img/image-324.png)\n\n图 6-91：键盘布局选项\n\n\
  # 7. Mate 桌面\n\nMate 桌面是 GNOME 2 桌面的简化且易于使用的版本。Mate 的官方文件管理器是 Caja。熟悉 GNOME 2 的用户会发现大部分功能相同，但有几处变化。Mate\
  \ 默认只有一个面板，尽管您可以添加更多面板。工作空间切换器默认不安装，但其工作方式与 GNOME 2 相同。Linux Mint 版 Mate 使用的菜单是\
  \ Linux Mint 菜单。Linux Mint 19.2 安装了 Mate 1.22 版本。\n\nGNU 网络对象模型环境（也称为 GNOME）是一个强大且易于使用的环境，主要由面板、桌面以及一组用于构建程序接口的桌面工具组成。GNOME\
  \ 旨在为开发强大的应用程序提供一个灵活的平台。\n\n## Mate 桌面\n\nMate 桌面设计得非常简单，只有一个面板和桌面图标（参见图 7-1）。面板可以横向或垂直显示，并包含菜单、快捷方式和应用程序小部件（小部件是运行在面板中的程序）。显示全屏的面板包含菜单、快捷方式和应用程序小部件（您可以让面板横向或垂直显示，并横跨整个屏幕）。\n\
  \n![Image](img/image-3.png)\n\n图 7-1：Mate 桌面与面板\n\n面板左侧是 Linux Mint 菜单。通过该菜单，您可以访问位置和应用程序。面板右侧是网络管理器、更新管理器、音量和时钟。屏幕剩余部分是桌面，您可以在此放置文件夹、文件和快捷方式。在桌面上右键点击可以显示菜单，并在其中创建新文件夹。\n\
  \n桌面上的文件夹图标可以访问您的主目录。主目录上有主文件夹图标，双击它会打开文件管理器窗口。要退出 Mate 桌面，您可以使用菜单中的“退出”选项。点击它会显示挂起、休眠、重启和关机\n\
  \n### Mate 组件\n\n从用户的角度来看，桌面界面有四个组件：桌面、面板、主菜单和文件管理器（参见图 7-2）。您有一个面板，用于菜单、快捷方式和管理窗口。当您打开一个窗口时，面板上会显示相应的按钮，您可以使用它最小化和恢复窗口。\n\
  \n要启动程序，可以从 Linux Mint 菜单中选择该程序。您也可以点击面板中的应用程序图标（如果存在），或将数据文件拖放到其上。要向桌面添加应用程序图标，可以右键点击\
  \ Linux Mint 菜单中的该项并选择“添加到桌面”。\n\n![Image](img/image-325.png)\n\n图 7-2：带有 Linux\
  \ Mint 菜单和 Caja 文件管理器的 Mate\n\n### 拖放文件到桌面\n\n任何从文件管理器窗口拖动到桌面的项图标也会出现在桌面上。默认的拖放操作是移动操作。如果您在文件管理器窗口中选择文件并将其拖到桌面，您实际上是将文件从当前目录移动到桌面文件夹（该文件夹位于您的主目录下并存放桌面上的所有项目）。桌面文件夹名为\
  \ `Desktop`。将文件夹拖到桌面时，整个文件夹及其子文件夹都将移动到桌面文件夹。\n\n要从桌面删除图标，可以右键点击并选择“移动到垃圾桶”。如果您选择在桌面显示垃圾桶图标，只需将其拖入即可。通过按\
  \ ctrl 键然后从文件管理器窗口点击并拖动文件到桌面，可以复制文件。您将看到鼠标图标变成带有小型 + 号的手，这表示您正在创建副本，而不是移动原始文件。\n\
  \n\n\n\n你也可以在桌面上为任何文件创建链接。如果你想在文件夹中保留一个版本，并仅从桌面访问它，这非常有用。你也可以将链接用于那些可能不希望出现在菜单或面板上的自定义程序。创建链接有两种方法：在按住\
  \ `Ctrl` 和 `Shift` 键（即 `ctrl-shift`）的同时，将文件拖动到你想创建链接的位置。随后会出现一个图标副本，其右下角有一个小箭头，表示这是一个链接。你可以点击此链接来启动程序、打开文件或打开文件夹，取决于你所链接的文件类型。或者，首先点击并拖动文件移出窗口，在移动文件但松开鼠标按钮之前，按下\
  \ `alt` 键。这将显示一个弹出菜单，包含 `Move Here`（移动至此处）、`Copy Here`（复制到此处）和 `Link Here`（在此处链接）选项。选择\
  \ `Link Here` 即可创建链接。\n\n拖放文件操作适用于工作切换器（Workspace Switcher）提供的虚拟桌面。工作切换器会在面板为每个虚拟桌面创建图标，并为在上面打开的任何窗口提供按钮。工作切换器默认不会添加，你需要手动将其添加到面板中。\n\
  \n## 桌面设置\n\n你可以使用 `Desktop Settings` 对话框配置桌面和窗口显示设置，你可以通过 `Preferences` 菜单或 `Control\
  \ Center`（参见图 7-3）访问它。`Desktop Settings` 对话框有四个标签页：`Desktop`、`Windows` 和 `Interface`。`Desktop`\
  \ 标签页让你选择在桌面上显示哪些系统图标。默认选中了 `Computer` 和 `Home` 文件夹图标，以及对于你插入的 USB 驱动器和 DVD 等外部文件系统的\
  \ `Mounted` 卷。你还可以选择显示 `Network` 和 `Trash`（垃圾箱）图标。\n\n![Image](img/image-326.png)\
  \ ![Image](img/image-327.png)\n\n图 7-3：Mate 桌面设置\n\n在 `Windows` 标签页上，你可以选择使用的窗口管理器，`Marco`\
  \ 或较旧的 `Metacity`。对于每种，你都可以进一步选择是否支持 `compositing`（合成）或 `compton`，或者仅使用窗口管理器而不使用任何插件。`Marco+Compositing`\
  \ 是默认设置。如果需要，你还可以设置 `User Interface Scaling` 以支持 `HiDPi`。所选窗口管理器的设置将出现在后续章节。对于 `Marco`，你可以选择按钮布局、是否在移动窗口时显示内容，以及是否在标题栏中使用系统字体。对于\
  \ `Metacity`，你也可以选择按钮布局以及在标题栏中使用系统字体。\n\n`Interface` 标签页让你选择是否在菜单、按钮和工具栏上显示图标，并设置工具栏中图标的大小。\n\
  \n## 桌面上的应用程序\n\n在某些情况下，你可能希望在桌面上创建另一种方式来访问文件，而不将其从原始文件夹中移动。你可以通过使用应用程序启动器图标或通过为原始程序创建链接来实现。应用程序启动器图标是用于在菜单和面板中显示和访问应用程序的组件。要在桌面上放置应用程序图标以作为菜单中的条目，你只需将应用程序条目从菜单拖动到桌面，或者右键点击并选择“Add\
  \ to desktop”。\n\n对于未在菜单中的应用程序，你可以选择创建一个应用程序启动器按钮，也可以为它创建一个直接链接。要创建应用程序启动器，右键点击桌面背景显示桌面菜单，然后选择\
  \ `Create Launcher` 条目。要创建一个简单链接，在按住 `Ctrl-Shift` 键的同时，点击程序图标并拖动到桌面。\n\n## 桌面菜单\n\
  \n你可以在空桌面的任何位置右键点击显示桌面菜单，该菜单包含常用任务的条目，例如创建应用程序启动器、创建新文件夹或整理图标显示。请记住，`New Folder`\
  \ 条目会在桌面上创建一个新文件夹，具体位于你的桌面文件夹（`DESKTOP`），而不是你的主文件夹。此菜单的条目列在表 7-1 中。\n\n| 菜单项 | 描述\
  \ |\n| :--- | :--- |\n| Create Folder | 在你的桌面的 `DESKTOP` 目录内创建一个新目录。 |\n| Create\
  \ Launcher | 为应用程序创建一个新的桌面图标。 |\n| Create Document | 使用已安装的模板创建文件 |\n| Organize\
  \ Desktop by Name | 按名称排列你的桌面图标。 |\n| Keep Aligned | 对齐你的桌面图标。 |\n| Cut, Copy, Paste\
  \ | 切割、复制或粘贴文件，允许在文件夹之间移动或复制文件。 |\n| Change Desktop Background | 打开背景偏好对话框，让你为桌面选择新背景。\
  \ |\n\n表 7-1：桌面菜单\n\n## 窗口\n\n你可以通过点击窗口的任何侧边或角并拖动来调整窗口大小。你可以通过在标题栏上进行点击拖拖操作来移动窗口。你也可以\
  \ `alt-click` 并拖动窗口的任何位置。窗口的右上角显示 `Minimize`（最小化）、`Maximize`（最大化）和 `Close`（关闭）按钮（减号、加号和\
  \ x 按钮）（参见图 7-4）。点击 `Minimize` 按钮将不再在桌面显示窗口。底部面板上保留一个该窗口的按钮。你可以通过 `alt-click` 并拖动窗口的任何位置来移动窗口。窗口的右上角显示\
  \ `Minimize`、`Maximize` 和 `Close` 按钮（参见图 7-4）。点击 `Minimize` 按钮将不再在桌面显示窗口。底部面板上保留一个该窗口的按钮。你可以点击面板按钮（窗口列表小部件）来恢复它。面板按钮像一个开关。如果窗口已显示，它将不再显示；如果未显示，它将显示。标题栏左侧有一个下拉菜单，显示窗口操作条目（你也可以右键点击标题栏显示菜单）（参见图\
  \ 7-4）。选项包括将窗口移动到另一个工作空间（虚拟桌面）或在所有工作空间可见，无论你移动到哪个工作空间。\n\n![Image](img/image-328.png)\n\
  \n图 7-4：Mate 窗口\n\n你可以通过按下 `Alt-Tab` 键在窗口之间快速切换。切换器打开显示打开窗口的缩略图（参见图 7-5）。继续按下 `Alt-Tab`\
  \ 。你可以使用 `Windows Preferences` 对话框的 `General` 标签页（控制中心）启用或禁用缩略图。`Compositing Window\
  \ Manager` 启用它们。如果你禁用切换器的缩略图，则只为打开的窗口显示图标。\n\n![Image](img/image-329.png)\n\n图 7-5：使用缩略图切换窗口\n\
  \n你可以使用 `Window Preferences` 对话框的 `Behavior` 标签页配置窗口行为，可以通过 `Preferences` 菜单和 `Control\
  \ Center` 访问 `Windows`。你可以选择此类功能，通过将鼠标悬停在窗口上方选择窗口，并使用 `meta` 键代替 `Alt` 键来移动窗口。从菜单中可以选择双击标题栏时执行的操作。默认是最大化，其他选项还包括折叠窗口和最小化。\n\
  \n### 窗口列表\n\n`Window List` 小部件显示当前打开的窗口（参见图 7-6）。`Window List` 将打开的窗口排列成系列按钮，每个窗口一个按钮。窗口可以包括\
  \ Web 浏览器或显示文件夹的文件管理器窗口。你可以通过点击按钮在窗口之间移动。当你最小化窗口时，稍后可以通过点击 `Window List` 中的条目来恢复它。\n\
  \n\n\n\n右键点击窗口的“窗口列表”按钮会打开一个菜单，允许您对窗口进行`Minimize`（最小化）、`Unminimize`还原、`Move`移动、`Resize`调整大小、`Maximize`最大化或`Close`关闭等操作，并将窗口移动到另一个工作空间。`Minimize`操作会将窗口缩小为其“窗口列表”中的条目。右键点击该条目将显示带有`Unminimize`选项而非`Minimize`选项的菜单，然后您可以使用它来重新显示窗口。`Close`条目将关闭窗口并结束该应用程序。此外，还有将窗口移动到相邻工作空间或特定工作空间的条目。\n\
  \n![Image](img/image-330.png)\n\n图 7-6: 窗口列表小部件\n\n窗口列表小部件由窗口列表小部件开头的一个小条表示（参见图\
  \ 7-6）。要配置窗口列表小部件，右键点击此条并选择`Preferences`（首选项）条目以打开窗口列表首选项对话框（参见图 7-7）。在这里，您可以设置功能，例如是否在面板上对窗口分组、显示所有打开的窗口还是仅显示当前工作空间的窗口，以及将窗口恢复到哪个工作空间。\n\
  \n![Image](img/image-331.png)\n\n图 7-7: 窗口列表首选项\n\n如果您选择分组窗口，则常用窗口将被在一个按钮下，该按钮会像菜单一样展开，列出该组中的每个窗口。例如，所有打开的终端窗口将分组在一个按钮下，点击该按钮将弹出它们的按钮列表。该按钮显示了打开窗口的数量。您还可以选择仅当窗口列表小部件上的空间不足以为每个窗口显示独立按钮时才进行分组。\n\
  \n## 工作空间切换器 (Workspace Switcher)\n\n工作空间切换器小部件允许您切换到不同的虚拟桌面（参见图 7-8）。您可以通过从面板的“Add\
  \ to Panel”（添加到面板）框中选择它，将工作空间切换器添加到任何面板中。它默认不会添加。工作空间切换器将您的整个虚拟桌面显示为并列的独立矩形。打开的窗口将以这些方格中的小型彩色矩形显示。您可以通过在工作空间切换器中点击并拖动其图像，将任何窗口从一个虚拟桌面移动到另一个。单行工作空间还会显示打开窗口的应用程序图标。\n\
  \n![Image](img/image-332.png) ![Image](img/image-333.png)\n\n图 7-8: 工作空间切换器，单行和双行\n\
  \n除了工作空间切换器，您还可以使用 `Ctrl-Alt-arrow` 键从一个工作空间移动到另一个。当您使用`Ctrl-Alt-arrow` 键时，右箭头和左箭头让您在行内移动，向上和向下键则让您从一行移动到另一行。屏幕中心会出现一个小的工作空间条，突出显示当前工作空间并显示其名称（参见图\
  \ 7-9）。\n\n![Image](img/image-334.png) ![Image](img/image-335.png)\n\n图 7-9: 切换工作空间，Ctrl-Alt-arrow\n\
  \n要配置工作空间切换器，右键点击该小部件显示菜单，然后选择`Preferences`显示工作空间切换器首选项对话框（参见图 7-10）。在这里，您可以选择工作空间的数量并对其命名。默认是四个。您还可以选择工作空间的行数。此外还有显示工作空间名称、允许工作空间环绕以及仅显示当前工作空间的选项。\n\
  \n![Image](img/image-336.png)\n\n图 7-10: 工作空间切换器首选项\n\n## 用于 Mate 的 Linux Mint 菜单\n\
  \nLinux Mint 为 Mate 界面提供了自己的菜单，称为 Linux Mint 菜单。它源自 SUSE Slab 菜单。Linux Mint 菜单位于面板的左侧。您也可以通过\
  \ `Ctrl-meta` 键打开它。\n\nLinux Mint 菜单有三个部分：`Places`（位置）、`System`（系统）和 `Favorites/Applications`（收藏/应用程序）（参见图\
  \ 7-11）。Places 部分显示了访问常用位置的按钮：用于设备和挂载文件夹的计算机窗口、您的主文件夹、用于共享设备和文件夹的网络窗口、您的垃圾桶以及 Linux\
  \ Mint Mate 的桌面配置对话框。\n\nSystem 部分包含软件管理、`Control Center`（控制中心）、终端窗口以及锁定、注销和关机操作按钮。`Software\
  \ Manager`（软件管理器）打开 Linux Mint 软件管理器，允许您从 Linux Mint 和 Ubuntu 存储库安装软件。`Package Manager`（软件包管理器）按钮打开旧版的\
  \ Synaptic 软件包管理器，具有相同的库访问权限。\n\n`Control Center` 打开一个与 Cinnamon 桌面中系统设置类似的对话框，显示系统配置、桌面配置以及管理的图标。许多管理工具与\
  \ Cinnamon 使用的相同，并受 Ubuntu 支持。`Logout` 按钮将您注销到登录界面。`Quit` 按钮打开关机对话框，并提供挂起、休眠、重启和关机选项。\n\
  \n`Applications/Favorites` 部分是一个切换器，显示您的收藏应用程序或所有应用程序。您可以通过菜单右上角的按钮在两者之间切换。应用程序视图分为两个滚动框，一个用于类别，另一个用于应用程序。您可以使用鼠标滚轮进行滚动浏览。参见图\
  \ 7-11，图形类别中列出了应用程序。在类别列表中有首选项、管理和系统工具等菜单。\n\n![Image](img/39.png)\n\n图 7-11: Linux\
  \ Mint 菜单\n\nLinux Mint 菜单支持使用右下角的搜索框进行搜索操作。当您点击搜索框时，选择了 `All`（全部）类别。当您输入时，应用程序部分显示匹配项。如果没有匹配项，将搜索未安装的应用程序，并显示允许您安装匹配应用程序的按钮（参见图\
  \ 7-12）。此外还有搜索 Google、维基百科、词典和计算机该术语的条目。\n\n![Image](img/image-337.png)\n\n图 7-12:\
  \ Linux Mint 搜索\n\n可以使用弹出菜单对菜单项执行若干操作。右键点击项目显示菜单（参见图 7-13）。\n\n![Image](img/image-338.png)\n\
  \n图 7-13: Linux Mint 应用程序弹出菜单\n\n您可以通过从菜单拖动图标将应用程序启动器添加到面板或桌面。您也可以右键点击应用程序图标并选择`Add\
  \ to desktop`添加到桌面或`Add to panel`添加到面板（参见图 7-13）。\n\n如果您希望在登录时启动某个应用程序，可以在菜单上右键点击并选择`Launch\
  \ when I log in`登录时启动。通过弹出菜单，您还可以直接卸载应用程序并打开应用程序的属性对话框。\n\n收藏部分列出了您可能需要的默认收藏。点击右上角的收藏按钮显示您的收藏。您可以通过右键点击条目并选择`Show\
  \ in my favorites`显示在我的收藏）将任何应用程序添加到收藏列表（参见图 7-14）。您可以只需通过点击并拖动它们在菜单上重新排列收藏顺序。要移除收藏，请右键点击并选择`Remove`。\n\
  \n![Image](img/image-339.png)\n\n图 7-14: Linux Mint 收藏\n\n\n\n\n你可以使用 `Menu` 偏好对话框来配置菜单，通过右键点击面板上的\
  \ `Menu` 按钮并在弹出菜单中选择“Preferences”（偏好）可以访问它。`Menu Preferences` 有七个选项卡：通用（General）、外观（Appearance）、应用程序（Applications）、收藏（Favorites）、系统（System）和位置（Places）（参见图\
  \ 7-15）。\n\n在“通用”选项卡上，你可以指定 Linux Mint 菜单组件的名称（文本）以及是否显示图标。你可以选择不同的图标，并指定用于显示菜单的键盘命令。你还可以选择是否在菜单显示系统和位置部分以及最近的文档、应用程序和工具提示。\n\
  \n![Image](img/image-340.png) ![Image](img/image-341.png)\n\n图 7-15：Linux Mint 菜单偏好对话框\n\
  \n![Image](img/image-342.png)\n\n图 7-16：带有“最近文档”选项的 Linux Mint 菜单 - 通用选项卡\n\n“外观”选项卡允许你选择标题、边框和背景的主题。你还可以为你的收藏、应用程序、系统和位置菜单选择图标大小。\n\
  \n在“收藏”选项卡上，你可以设置收藏菜单的布局和选项，包括列数以及在 Linux Mint 菜单打开时是否显示收藏菜单。\n\n在“应用程序”选项卡上，你可以配置应用程序菜单，选择显示类别图标、在弹出注释中显示应用程序注释，以及允许鼠标悬停时选择条目。你还可以配置搜索功能以搜索未安装的包，并记住上次搜索内容。\n\
  \n在“系统”选项卡上，你可以设置高度并选择显示的默认项。\n\n对于“位置”，你可以选择显示哪些默认项以及是否显示你的书签。你还可以为菜单添加自定义位置（文件夹）。点击\
  \ `New`（新建）按钮打开对话框，你可以在其中输入位置名称和文件夹路径名称。\n\n注意：你可以通过从面板中移除 Linux Mint 菜单，然后在面板中添加“主菜单”（Main\
  \ Menu）组件来替换 Linux Mint 菜单。如果你以后想再次添加，Linux Mint 菜单的名称为 `mintMenu`。\n\n## Mate 面板\n\
  \n面板是 Mate 界面的主要组件。通过面板，你可以启动应用程序、运行组件并访问桌面区域。你可以将 Mate 面板认为是你可以在桌面上使用的一种工具。你可以在桌面上显示多个\
  \ Mate 面板，每个面板都包含你放置在其中的组件和菜单。在这方面，Mate 是非常灵活的，允许你以你喜欢的任何方式配置面板。Mate 面板的工作原理与 GNOME\
  \ 2 面板非常相似。你可以轻松地向面板添加组件以及应用程序启动器。屏幕底部已为你设置了一个默认面板，包含菜单、显示桌面、应用程序启动器、窗口列表和几个系统组件（参见图\
  \ 7-17）。这些组件包括用于更新管理器、音量控制、网络管理器、电源管理器和时钟的按钮。\n\n![Image](img/image-343.png)\n\n\
  ![Image](img/image-344.png)\n\n![Image](img/image-345.png)\n\n图 7-17：Mate 面板\n\n\
  面板配置任务（如添加应用程序、选择组件、设置菜单和创建新面板）均可以通过面板弹出菜单处理（参见图 7-17）。只需在面板的任意空白处右键点击，即可显示一个包含属性（Properties）、新建面板（New\
  \ Panel）、添加到面板（Add to Panel）和删除此面板（Delete This Panel）条目的菜单，以及帮助（Help）和关于（About）条目。`New\
  \ Panel`允许你创建其他面板；`Add to Panel`允许你向面板添加项，如应用程序启动器、工作区切换器等简单任务的组件以及 Linux Mint 菜单等。`Properties`\
  \ 条目将显示配置面板的对话框，例如设置面板的位置及其隐藏功能。\n\n要添加新面板，请选择面板弹出菜单中的 `New Panel` 条目（参见图 7-18）。屏幕顶部会自动创建并显示一个新的扩展面板。然后，你可以使用面板的属性对话框来设置不同的显示和背景特征，如后续章节介绍所示。\n\
  \n![Image](img/image-346.png)\n\n图 7-18：Mate 面板弹出菜单\n\n### 面板属性\n\n要配置单个面板，你需要使用面板属性对话框（参见图\
  \ 7-19）。要显示此对话框，右键点击特定面板并在弹出菜单中选择 `Properties` 条目。对于单个面板，你可以设置通用配置特征和背景。面板属性对话框显示两个选项卡：通用（General）和背景（Background）。\n\
  \n#### 显示面板\n\n在面板属性对话框的“通用”选项卡上，你决定了希望如何显示面板。在这里，你有方向、尺寸以及是否扩展、自动隐藏或显示隐藏按钮等选项。`Orientation`（方向）条目允许你选择希望将面板放在屏幕的哪侧。然后你可以选择是否希望面板扩展。扩展面板将填满屏幕，而未扩展的面板则不会。\n\
  \n![Image](img/image-347.png) ![Image](img/image-348.png)\n\n图 7-19：面板属性\n\n####\
  \ 移动和隐藏扩展面板\n\n通过在面板属性“通用”选项卡上选择 `orientation`（方向），扩展面板可以位于屏幕的任何边缘。如果那里已经有一个面板，新面板将堆叠在其上方。未扩展面板无法这样移动。请记住，如果你将扩展面板放在侧边，任何菜单将垂直显示。你可以自动或手动隐藏扩展面板。这些功能在面板属性中指定为\
  \ `Autohide`自动隐藏）和 `Show hide buttons`显示隐藏按钮）。要自动隐藏，请选择 `Autohide`。要重新面板，将鼠标移动到面板所在的边缘。你可以在属性窗口中启用或禁用\
  \ `Autohide` 功能。\n\n如果你希望能够手动隐藏面板，请选择 `Show hide buttons`。面板两端将显示带有箭头的隐藏按钮。你还可以选择这些按钮是否显示箭头（默认显示箭头）。然后你可以通过点击面板两端的任一个隐藏按钮来随时隐藏面板。箭头显示了面板隐藏的方向。\n\
  \n#### 未扩展面板：移动与固定\n\n扩展面板始终位于屏幕边缘，而未扩展面板是可以移动的。它可以位于屏幕边缘，像扩展面板的精简版本一样，或者你可以将其移动到桌面的任何位置，就像移动图标一样。未扩展面板将缩小到其组件的数量，并在两端显示句柄。然后你可以通过拖动句柄来移动面板。要访问带有属性条目的面板菜单，右键点击其任一句柄。\n\
  \n要将未扩展面板固定在当前位置，在其属性框中选择 `Show hide buttons` 功能。这将句柄替换为隐藏按钮并固定面板。点击隐藏按钮会将面板隐藏到屏幕边缘，就像扩展面板一样。如果该边缘已经有一个扩展面板，隐藏的未扩展面板按钮将位于其上方，就像隐藏的扩展面板一样。对于位于屏幕边缘的未扩展面板，`Autohide`\
  \ 功能同样有效。\n\n\n\n\n如果你想将一个未展开的面板固定在屏幕边缘，请确保它已放置在你想要的边缘，然后设置它的“显示/隐藏按钮”功能。\n\n###\
  \ 面板背景\n\n通过面板属性框中的 `Background`（背景）窗格，你可以更改面板的背景颜色或图像。对于颜色背景，点击 `Color`（颜色）按钮显示颜色选择窗口，你可以在其中从色盘或颜色块列表中选择颜色，也可以输入它的数值。一旦选择了颜色，你就可以使用\
  \ `Style`（样式）滑动条使其变得更加透明或不透明。如果想使用图像而不是颜色，选择图像条目并使用 `Browse`（浏览）按钮找到你需要的图像文件。对于图像，你也可以直接从文件管理器将图像文件拖到面板上；该图像随后将成为面板的背景图像。\n\
  \n### 面板对象\n\n面板可以包含几种不同类型的对象。这些包括菜单、启动器、小程序、抽屉和特殊对象。\n\n**菜单**：面板菜单包含启动器，启动器是用于启动应用程序或执行命令的按钮。\n\
  \n**启动器**：你可以在 `Applications`（应用程序）菜单中选择任何应用程序项，并在面板上为其创建一个启动器。\n\n**小程序**：小程序是一种设计在面板内运行的小型应用程序。显示不同桌面的\
  \ `Workspace Switcher`（工作区切换器）就是一个 GNOME 小程序。\n\n**抽屉**：抽屉是面板的扩展，可以打开或关闭。你可以将抽屉视为面板的一个可以收缩的部分。你可以向它添加任何可以添加到普通面板的内容，包括小程序、菜单，甚至是其他抽屉。\n\
  \n**特殊对象**：这些对象用于处理其他面板对象不支持的特殊任务。例如，注销和锁定按钮就是特殊对象。\n\n### 移动、移除和锁定对象\n\n要移动面板内的任何对象，右键点击它并选择\
  \ `Move`（移动）项。你可以将其移动到同一面板的不同位置，也可以移动到另一个面板。对于启动器，你只需直接将对象拖到你想放置的地方即可。要从面板中移除对象，右键点击它显示弹出菜单，然后选择\
  \ `Remove From Panel`（从面板中移除）项。要防止对象被移动或移除，你可以设置它的锁定功能（右键点击对象并选择 `Lock To Panel`（锁定到面板）项）。若稍后允许其移动，你必须先解锁对象（右键点击它并选择\
  \ `Unlock`）。\n\n### 添加对象\n\n要向面板添加对象，请从面板的 `Add to Panel`（添加到面板）对话框中选择该对象（参见图 7-20）。要显示\
  \ `Add to Panel` 对话框，右键点击面板并选择 `Add to Panel` 项。此 `Add to Panel` 对话框显示了常用对象的列表，例如\
  \ `mintMenu` 菜单（Linux Mint 菜单）、注销时。对于应用程序小程序，你可以点击 `Applications Launcher`（应用程序启动器）项并点击\
  \ `Forward`（前进）按钮来列出你安装的所有应用程序。你也可以通过直接拖拽将启动器添加到面板。启动器包括应用程序、窗口和文件。`Custom Application\
  \ Launcher`（自定义应用程序启动器）允许你创建自定义启动器。\n\n### 应用程序启动器\n\n向面板添加已具有应用程序启动器的应用程序非常简单。你只需将该应用程序启动器拖到面板上。这将自动为该面板创建一个启动器的副本供其使用。启动器可以是菜单项或桌面图标。Linux\
  \ Mint 菜单中的所有项都是应用程序启动器。要从菜单添加应用程序，只需选择它并将其拖到面板上。你也可以将任何桌面应用程序图标拖到面板，以便在该面板上添加它的副本。\n\
  \n![图像](img/image-349.png)\n\n图 7-20：用于面板小程序的“添加到面板”对话框\n\n对于任何菜单项，你也可以进入其条目并右键点击它，然后选择\
  \ `Add to panel`（添加到面板）项。随后该应用程序的应用程序启动器将被添加到面板。假设你经常使用 `Xed` 文本编辑器，并想将其图标添加到面板，而不是每次都通过应用程序菜单进入。右键点击\
  \ `Accessories`（附件）菜单中的 `Text Editor` 菜单项，并选择 `Add to panel` 项。`Xed` 文本编辑器图标现在出现在你的面板中。\n\
  \n此外，如前所述，你可以打开“添加到面板”对话框，然后选择 `Application Launcher` 条目并点击 `Forward` 按钮。这将显示一个对话框，列出所有的应用程序菜单项，以及\
  \ `Preferences`（首好）和 `Administration`（管理）菜单，并可以展开到其子项。只需找到你想添加的应用程序，选择它，并点击 `Add`（添加）按钮。\n\
  \n### 添加抽屉\n\n你还可以将应用程序分组在一个抽屉图标下。点击抽屉图标会显示不同的应用程序图标列表，你可以从中选择。要向你的面板添加抽屉，右键点击面板并选择\
  \ `Add to panel` 项以显示 `Add to Panel` 对话框。从列表中选择 `Drawer` 项。这将在你的面板上创建一个抽屉。然后你可以将桌面、菜单或窗口中的任何项目拖到面板上的抽屉图标上，让它们列在抽屉中。\n\
  \n你还可以使用 `Add to Drawer`（添加到抽屉）对话框向抽屉添加小程序和应用程序。右键点击抽屉并选择 `Add to Drawer` 项打开对话框。然后点击你想添加到抽屉的小程序。要添加应用程序，选择\
  \ `Applications Launcher` 项并点击 `Forward` 来列出应用程序类别。你可以通过选择类别并点击“添加”按钮将菜单添加到抽屉。\n\
  \n### 添加菜单\n\n菜单与抽屉的区别在于抽屉持有的是应用程序图标，而不是菜单项。你可以像添加抽屉一样将菜单添加到面板。要向面板添加应用程序菜单，打开 `Add\
  \ to Panel` 对话框并选择 `Application Launcher` 项，点击 `Forward` 打开列表。选择你需要的类别，并点击 `Add`\
  \ 按钮。该菜单类别的所有项将作为菜单添加到你的面板。\n\n### 添加文件夹和文件\n\n你还可以向面板添加文件夹。从文件管理器窗口将 `Folder` 图标拖到你的面板。每当你点击此\
  \ `Folder` 按钮时，都会打开一个显示该目录的文件管理器。你还可以将文件夹添加到面板上的任何抽屉中。要添加文件，直接拖拽到面板即可。\n\n## Caja\
  \ 文件管理器\n\n\n\n\n\nCaja 文件管理器支持复制、移除和删除项目的标准功能，以及设置权限和显示项目。该文件管理器的程序名为 `caja`。你可以使用扩展程序来增强\
  \ Caja，例如使用“在终端中打开”扩展可以在新的终端窗口中打开当前文件夹，以及使用 Engrampa 允许你创建（压缩）和提取压缩包。系统默认已安装并启用了几个扩展，它们会在相应的菜单中显示。扩展可以在“文件管理偏好设置”对话框的“扩展”选项卡（编辑\
  \ | 偏好设置）中启用。要添加更多扩展，请使用软件管理器安装 `caja` 扩展包。扩展包具有 `caja-` 前缀，例如 `caja-share`、`caja-dropbox`\
  \ 和 `caja-wallpaper`。\n\n#### 主目录子文件夹和书签\n\n与 Ubuntu 一样，Linux Mint 使用通用用户目录结构（位于\
  \ [`freedesktop.org`](https://freedesktop.org) 的 `xdg-user-dirs`）在用户主目录下设置子文件夹。文件夹将包括\
  \ `Documents`（文档）、`Music`（音乐）、`Pictures`（图片）、`Downloads`（下载）和 `Videos`（视频）。这些本地化的用户文件夹被许多桌面应用程序用作默认。用户可以使用文件浏览器更改这些文件夹的名称或将它们相互嵌套。例如，可以将\
  \ `Music` 移动到 `Documents/Music`。本地配置存储在 `.config/user-dirs.dirs` 文件中。系统级默认设置在 `/etc/xdg/user-dirs.defaults`\
  \ 文件中。这些文件夹的图标显示在图 7-21 中。\n\n![Image](img/image-350.png)\n\n图 7-21: Caja 文件管理器主目录\n\
  \n这些文件夹也是默认书签。你可以直接从 Caja 窗口的侧边栏访问书签文件夹。你也可以通过打开文件夹并从书签菜单中选择“添加书签”来为文件夹添加自己的书签。你的文件夹将出现在\
  \ Caja 侧边栏“位置”菜单的书签部分以及书签菜单中。使用“编辑书签”对话框可以删除书签。在这里你可以删除书签或更改其名称和位置。\n\n你使用“桌面设置”在桌面区域显示主目录、网络和垃圾桶等基础文件夹。\n\
  \n#### 文件管理器窗口\n\n当你点击桌面上的“主目录”图标或 Mate 菜单“位置”部分的“主目录”项时，会打开一个文件管理器窗口并显示你的主目录。文件管理器窗口显示多个组件，包括菜单栏、主工具栏和侧边栏（参见图\
  \ 7-22）。\n\n![Image](img/image-42.png)\n\n图 7-22: 带有侧边栏的 Caja 文件管理器\n\n侧边栏的作用类似于\
  \ Nemo 和 Nautilus 文件管理器中的侧边栏，但它带有一个菜单，类似于 GNOME 2 中的文件管理器。文件管理器窗口的主面板（右侧）显示当前工作文件夹中文件和子文件夹的图标或列表。当你选择一个文件和文件夹时，窗口底部的状态栏会显示所选文件或文件夹的名称，对于文件显示大小，对于文件夹显示包含的项目数量。状态栏还显示当前文件系统的剩余可用空间。\n\
  \n当你打开一个新文件夹时，将使用同一个窗口显示它，你可以使用“前进”和“后退”按钮在之前打开的文件夹之间移动（主工具栏左上角）（参见图 7-23）。“后退”和“前进”按钮右侧的小三角形显示之前访问过的文件夹菜单，你可以用它直接访问之前的文件夹。还有一个向上箭头用于移动到父目录，以及一个“主目录”按钮直接跳转到你的主目录。“计算机”按钮会显示显示文件系统和连接设备的计算机窗口。你也可以从文件管理器的“转到”菜单访问这些操作（参见表\
  \ 7-2）。此外，还有“刷新”和“停止刷新”按钮，以便在文件或文件夹列表变化时刷新文件夹列表。\n\n![Image](img/image-351.png)\n\
  \n图 7-23: Caja 导航按钮：后退、前进、父目录、主目录、计算机\n\n| 菜单项 | 说明 |\n| :--- | :--- |\n| 打开父目录\
  \ | 移动到父文件夹 |\n| 后退 | 移动到文件管理器窗口中查看过的上一个文件夹 |\n| 前进 | 移动到文件管理器窗口中查看过的下一个文件夹 |\n\
  | 粘贴 | 粘贴已复制或剪切的文件，让你可以在文件夹之间移动或复制文件，或创建副本。 |\n| 与其他窗格相同位置 | 如果你在窗口中打开了两个窗格，可以让两个窗格显示同一个文件夹\
  \ |\n| 主目录 | 移动到主目录 |\n| 计算机 | 移动到计算机文件夹，显示你的设备图标 |\n| 模板 | 移动到模板文件夹 |\n| 垃圾桶 |\
  \ 打开垃圾桶文件夹查看删除的文件和文件夹，这些内容是可以恢复的。 |\n| 网络 | 移动到网络文件夹，显示网络上连接的系统并打开远程文件夹。 |\n| 位置\
  \ | 打开位置导航框，以输入文件或文件夹的路径名称 |\n| 搜索文件 | 使用文件管理器窗口搜索文件和文件夹 |\n\n表 7-2: 文件管理器“转到”菜单\n\
  \n当你打开子文件夹时，主工具栏会显示当前文件夹及其父文件夹的按钮（参见图 7-24）。初始状态，按钮显示主目录下的子目录。\n\n你也可以使用位置框而不是按钮，按下\
  \ `Ctrl+l`，或者从“转到”菜单选择“位置”，或者点击主工具栏路径开头的“位置”按钮。这些访问方法可以在系统或远程系统之间切换。\n\n![Image](img/image-352.png)\n\
  \n![Image](img/image-353.png)\n\n![Image](img/image-354.png)\n\n图 7-24: Caja 位置：未展开、展开和位置框\n\
  \n文件菜单包含打开新标签页 (`Ctrl+t`)、打开新文件管理器窗口 (`Ctrl+n`)、创建新文件夹 (`Shift+Ctrl+n`)、连接到服务器以及显示当前文件夹属性\
  \ (`Alt+Return`) 的选项。大部分选项都有对应的快捷键（参见表 7-3）（参见图 7-28）。\n\n| 菜单项 | 说明 |\n| :--- |\
  \ :--- |\n| 新标签页 | 创建一个新标签页 |\n| 新窗口 | 打开一个新的文件管理器窗口 |\n| 创建文件夹 | 在目录中创建一个新的子目录\
  \ |\n| 创建文档 | 创建一个文本文档 |\n| 连接到服务器 | 使用文件管理器连接 FTP 服务器 |\n| 在终端中打开 | 在新的终端窗口中打开当前文件夹（终端扩展）\
  \ |\n| 属性 | 当前打开文件夹的属性 |\n| 清空垃圾桶 | 清空垃圾桶文件夹 |\n| 关闭所有窗口 | 关闭所有文件管理器窗口 |\n| 关闭 |\
  \ 关闭文件管理器窗口 |\n| 打开方式 | 当选中文件时显示“打开方式”项，显示可能的打开该文件的应用程序 |\n| 打开 | 当选中文件夹时显示“打开”项，还包括“在新标签页中打开”和“在新窗口中打开”项，以及“打开方式”子菜单\
  \ |\n\n表 7-3: 文件管理器“文件”菜单\n\n![Image](img/image-355.png)\n\n![Image](img/image-356.png)\n\
  \n![Image](img/image-357.png)\n\n![Image](img/image-358.png)\n\n图 7-25: 文件管理器侧边栏菜单和视图\n\
  \n\n\n\n文件管理器侧边栏包含一个菜单，你可以通过它选择显示位置（`Places`）、文件系统的树状视图（`Tree`）、当前或所选目录或文件的信息（`Information`）、该登录会话中之前打开的文件夹历史（`History`）、备注（`Notes`）以及你可以放置在文件或文件夹上的图标标记（`Emblems`）。\n\
  \n使用侧边栏的 `Places`（位置）视图可以访问你收藏的文件夹、存储设备（`USB`、`CD/DVD` 光盘和连接的硬盘）以及挂载的网络文件夹。在侧边栏的\
  \ `Computer`（计算机）部分中，你可以访问你的主文件夹、垃圾箱和文件系统（根目录）。在 `Bookmarks`（书签）部分，你可以访问你创建的任何额外书签。\n\
  \n侧边栏的默认视图是 `Places`，它显示了 `Computer`（计算机）、`Devices`（设备）、`Bookmarks`（书签）和 `Network`（网络）项目部分，显示了你的文件系统和默认主文件夹子文件夹（参见图\
  \ 7-25）。你可以通过选择 `View`（视图）菜单中的“Side Pane”（侧边栏）项来显示或隐藏侧边栏，也可以通过点击侧边栏菜单右侧的关闭按钮。你也可以使用\
  \ `F9` 切换侧边栏的开启。\n\n选择侧边栏中的 `File System`（文件系统）项将你置文件系统的顶部，让你移动到任何可访问的部分。在 `Computer`\
  \ 部分中，你可以搜索你的默认文件夹，如 `Documents`（文档）和 `Pictures`（图片）。如果你收藏了一个文件夹（`Bookmarks` 菜单，“Add\
  \ Bookmark”项（`Ctrl-d`），侧边栏将会出现一个带有该书签的 `Bookmark` 部分。要删除或重命名书签，右键点击侧边栏中的该项，并从弹出菜单中选择\
  \ `Remove`（删除）或 `Rename`（重命名）（参见图 7-26）。书签名称会更改，但原始文件夹名称不会改变。\n\n![Image](img/image-359.png)\n\
  \n图 7-26：带有书签菜单的文件管理器侧边栏\n\n### 标签页\n\n`Caja` 文件管理器支持标签页，你你可以在同一个文件管理器窗口中打开多个文件夹。要打开标签页，从\
  \ `File`（文件）菜单中选择 `New Tab`（新建标签）或按 `Ctrl-t`。会出现一个标签栏，每个标签页都有标签图标，显示打开的文件夹名称以及一个\
  \ `x` 关闭按钮（参见图 7-27）。你可以通过点击并拖动标签图标向右或向左来重新排列标签。你还可以使用 `Ctrl-PageUp` 和 `Ctrl-PageDown`\
  \ 键在标签页之间移动。使用 `Shift-Ctrl-PageUp` 和 `Shift-Ctrl-PageDown` 键可以重新排列标签。要关闭标签页，点击标签右侧的关闭\
  \ `x` 按钮。\n\n**注意：`Caja` 可作为一个操作性 FTP 浏览器工作。你可以使用 `Files`（文件）顶部栏应用程序菜单上的 `Connect\
  \ to Server`（连接到服务器）项打开“Connect to Server”对话框，在其中你可以输入 FTP 站的 URL。**\n\n![Image](img/image-360.png)\n\
  \n图 7-27：带有标签页的文件管理器窗口\n\n### 显示文件和文件夹\n\n你可以以图标、紧凑列表或详细列表的形式查看目录内容，你可以从主工具栏右侧的菜单中进行这些选择：`icon`（图标）、`list`（列表）和\
  \ `compact`（紧凑）视图，所示。\n\n![Image](img/image-361.png)\n\n使用控制键快速更改视图：`Ctrl-1` 为图标视图，`Ctrl-2`\
  \ 为列表视图，`Ctrl-3` 为紧凑视图。`List`（列表）视图提供名称、大小、类型和日期。主窗格顶部会为每个字段显示按钮。你可以使用这些按钮根据该字段对列表进行排序。例如，要按日期排序文件，点击\
  \ `Date Modified`（修改日期）按钮；要按大小排序，点击 `Size`（大小）按钮。再次点击可以在升序和降序之间切换。\n\n某些类型的文件图标将显示其内容的预览。例如，图像文件的图标将显示图片的缩略图。文本文件在其图标中显示其文本的前几个字。\n\
  \n`View`（视图）菜单具有管理和排列你的文件管理器图标的项（参见表 7-4）（参见图 7-28）。你可以选择 `Icons`（图标）、`List`（列表）和\
  \ `Compact`（紧凑）视图。在 `Icon` 视图中，会出现“Arrange items”（排列项目）子菜单，它提供了按名称、大小、类型、图标和修改日期排序图标的项。你也可以简单地反转顺序，或手动定位图标。\n\
  \n![Image](img/image-362.png)  ![Image](img/image-363.png)  ![Image](img/image-364.png)\n\
  \n图 7-28：文件管理器文件、编辑和视图菜单\n\n`View`（视图） | `Zoom In`（放大）项会放大你的窗口视图，使图标更大，`Zoom Out`（缩小）会缩小视图，使图标变小。`Normal\
  \ Size`（标准尺寸）将图标恢复为标准大小。你还可以使用 `Ctrl-+` 和 `Ctrl--` 键放大缩小。\n\n### 文件管理器工具和菜单\n\n\
  从 `Edit`（编辑）菜单中，你可以粘贴剪切或复制（参见表 7-5).\n\n| 菜单项 | 描述 |\n| :--- | :--- |\n| `Stop`\
