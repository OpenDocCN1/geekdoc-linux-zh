- "# Linux Mint 19.2：桌面与管理\n\n\n\n![](img/cover.jpeg)\n\n![img](img/cover.jpeg)\n\n\
  \n致 Cora\n\n\n\n\n\n\n\n\n\n\n\n![200-Linux_Mint_Official_Logo-gray](img/image.png)\
  \ 以及 ![Logo_Linux_Mint](img/image.png) 是 Linux Mint 的商标。\n\n![image02](img/image.jpeg)\
  \ 是 Surfing Turtle Press 的商标\n\n# 前言\n\n本书涵盖了 Linux Mint 19.2 版本，侧重于桌面和管理工具。重点是用户在使用\
  \ Linux Mint 时将面临的内容，涵盖安装、应用程序、软件管理、桌面（Cinnamon、Mate 和 Xfce）、命令行、网络连接以及管理任务。Linux\
  \ Mint 19.2 引入了许多新功能，基于 Ubuntu 18.04 长期支持版本。详细介绍了 Cinnamon 和 Mate 桌面。Cinnamon 和\
  \ Mate 拥有管理应用程序和设备的自定义菜单。还介绍了如 Samba 配置、systemd 服务管理等 Linux Mint 高级组件（软件管理器和更新管理器）。\n\
  \nLinux Mint Cinnamon 桌面由 Linux Mint 开发和维护，带有桌面工具和系统设置对话框。Mate 桌面基于 GNOME 2，带有传统的面板和插件。每个桌面都有自己的文件管理器。Cinnamon\
  \ 桌面使用 Nemo，基于 Ubuntu GNOME 3 版本的 Nautilus。Mate 桌面使用 Caja，基于 GNOME 2 文件管理器。\n\n\
  第一部分重点是入门，涵盖了 Linux Mint 信息和资源、使用 Linux Mint 现场光盘/U 盘、安装和设置 Linux Mint、升级 Linux\
  \ Mint、Cinnamon 和 Mate 桌面的基本使用，以及连接有线和无线网络。详细介绍了存储库及其用法。讨论了软件管理器和 synaptic 软件包管理器。还审查了\
  \ Linux Mint X 应用，包括 Xplayer、Xed 和 Xviewer。此外，还列出了办公、多媒体、邮件、互联网和社交媒体应用程序。\n\n第二部分涵盖\
  \ Cinnamon 和 Mate（Linux Mint 不再支持 KDE，但你可以安装 Ubuntu 版本 Kubuntu）。Cinnamon 桌面保留了流行的\
  \ GNOME 2 功能，如面板和插件。它还有一个类似于 Ubuntu 启动器的 Cinnamon 菜单。Mate 桌面源自 GNOME 2 桌面，但具有更高级的应用程序菜单。\n\
  \n第三部分处理管理主题，首先讨论 GNOME 系统监控器、磁盘使用分析程序和磁盘实用程序等系统工具。然后介绍了 Linux Mint 管理工具，涵盖管理用户和文件系统、蓝牙设置、网络文件夹和文件共享等任务。网络连接章节涵盖了各种网络任务，包括有线和无线连接的手动配置以及防火墙。\n\
  \n第四部分关注 Samba、NFS 和 CUPS 等共享资源，并涵盖了 `systemd` 如何使用单元和目标文件管理服务。\n\n\n\n\n\n\n\n\n\
  \n\n\n## 3. 基础：登录、桌面与帮助\n\n\n\n### Web 浏览器\n\nLinux Mint 的流行浏览器包括 Firefox (Mozilla)、Rekonq、Chromium\
  \ (Google)、Web (Epiphany) 和 Lynx（参见表 5-15）。Firefox 是大多数 Linux 发行版使用的默认 Web 浏览器。Web\
  \ 是 GNOME 浏览器（以前称为 Epiphany）。Chromium 是 Google Web 浏览器的开源版本。Lynx 和 ELinks 是基于命令行的浏览器，不具备图形功能，但在其他所有方面，它们都是功能完备\
  \ Web 浏览器。\n\n| 站点 | 说明 |\n| :--- | :--- |\n| Firefox | Mozilla 项目 Firefox Web 浏览器，桌面默认浏览器\
  \ [`www.mozilla.org`](https://www.mozilla.org) |\n| Web | GNOME 浏览器 [`wiki.gnome.org/Apps/Web`](https://wiki.gnome.org/Apps/Web)\
  \ |\n| Chromium | Google Chrome Web 浏览器的开源版本 [`www.chromium.org`](http://www.chromium.org)\
  \ |\n| lynx | 文本命令行 Web 浏览器 [`lynx.browser.org/`](http://lynx.browser.org/) |\n\
  | elinks | 文本命令行 Web 浏览器 [`elinks.or.cz`](http://elinks.or.cz) |\n\n表 5-15: Web\
  \ 浏览器\n\n### Linux 版 Java\n\n要开发 Java 应用程序、使用 Java 工具并运行许多 Java 产品，你需要 Java 软件开发包\
  \ (SDK) 和 Java 运行环境 (JRE)。SDK 是 JRE 的超集，增加了编译器和调试器等开发工具。Sun（现归 Oracle 所有）已将 Java\
  \ 作为 OpenJDK 项目开源，并支持和分发 Linux 版本。JRE 子集可以作为 OpenJRE 安装。`openjdk-11-jre` 包安装 Java\
  \ 运行环境，而 `openjdk-11-jdk` 则同时安装 JRE 和 Java 开发工具。Java 软件包和应用程序列在表 5-16 中。\n\n提供了几个兼容的\
  \ GNU 软件包（类 Java），允许你使用 GNU 免费 Java 支持运行 Java Applet。这些包括 GNU Java 编译器 (`gcj`) 和\
  \ Eclipse Java 编译器 (`ecj`)。\n\n| 应用程序 | 说明 |\n| :--- | :--- |\n| Java 开发包, OpenJDK\
  \ | 开源 Java 开发环境，包含编译器、解释器、调试器等（包含 JRE），[`openjdk.java.net`](http://openjdk.java.net),\
  \ `openjdk-11-jdk` |\n| Java 运行环境, OpenJRE | 开源 Java 运行环境，包括 Java 虚拟机，`openjdk-11-jre`。[`openjdk.java.net`](http://openjdk.java.net)\
  \ |\n| Java 平台标准版 (JSE) | 完整的 Java 集合，包括 JRE、JDK 和 API，[`www.oracle.com/technetwork/java/javase/downloads/index.html`](http://www.oracle.com/technetwork/java/javase/downloads/index.html)\
  \ |\n| GNU Java 编译器 | GNU 公共许可的 Java 编译器 (GCJ)，用于编译 Java 程序，`gcj` |\n\n表 5-16: Java\
  \ 软件包和 Java Web 应用程序\n\n### BitTorrent 客户端 (transmission)\n\nGNOME 提供了非常有效的 BitTorrent\
  \ 客户端。通过 BitTorrent，你可以在共享的分布式下载操作中快速下载非常大的文件，其中多个用户参与下载文件的不同部分，并将他们下载的部分发送给其他参与者（称为节点）。与其每个人都尝试访问几个中央服务器，所有参与\
  \ BitTorrent 操作的节点都成为被下载文件的源。某些节点充当种子者（seeders），即那些已经下载了文件但继续向需要的人发送文件部分的人。\n\n\
  Linux Mint 将安装并使用 GNOME BitTorrent 客户端 Transmission，可以从互联网菜单访问。要执行 BitTorrent 下载，你需要想要下载的文件所对应的\
  \ BitTorrent 文件。\n\n### FTP 客户端\n\n通过文件传输协议 (FTP) 客户端，你可以连接到相应的 FTP 站点并从中下载文件。这些站点具有匿名登录功能，允许任何用户访问其文件。虽然文件管理器和\
  \ Web 浏览器可以有效访问公共站点，但访问私有站点可能需要独立的客户端，如 `curl`、`wget`、`Fileilla`、`gFTP`、`lftp` 或\
  \ `ftp`。这些客户端允许你输入访问用户名和密码。\n\n流行的 Linux FTP 客户端列在表 5-17 中。\n\n| FTP 客户端 | 说明 |\n\
  | :--- | :--- |\n| Nemo | GNOME / Cinnamon 文件管理器 |\n| gFTP | GNOME FTP 客户端，`gftp-gtk`\
  \ |\n| ftp | 命令行 FTP 客户端 |\n| lftp | 支持多连接的命令行 FTP 客户端 |\n| curl | 传输客户端（FTP 和 HTTP）\
  \ |\n| Filezilla | 源 Fileilla ftp 客户端的 Linux 版本（Universe 仓库） |\n\n表 5-17: Linux\
  \ FTP 客户端\n\n#### 网络文件传输：FTP\n\n通过 FTP 客户端，你可以从一个站点直接传输文件到另一个（参见表 5-4）。FTP 可以处理文本和二进制文件。FTP\
  \ 执行对连接到你的网络系统中另一个账户的远程登录。登录到该系统后，你就可以在该系统中传输文件。要登录，你需要知道远程系统账户的登录名称和密码。然而，互联网上的许多站点允许通过\
  \ FTP 进行公共访问。此类站点通常被称为 FTP 站点，在许多情况下，它们的互联网地址以 ftp 项开头，例如 ftp.gnome.org。这些公共站点允许任何用户匿名\
  \ FTP 登录。对于登录名称，你使用“anonymous”，对于密码，你使用你的电子邮件地址。然后你就可以从该站点传输文件到你自己的系统。\n\n\n\n\n\
  \n有多种 FTP 协议可用于支持它们的站点。原始的 FTP 协议用于大多数匿名站点。FTP 传输也可以使用 `SSH2` 或 `SFTP` 协议进行加密。更安全的连接可能使用\
  \ `FTPS` 进行 `TLS/SSL` 加密。某些站点支持一种名为文件服务协议（`FSP`）的简化版 FTP。FTP 客户端可能支持不同的协议，例如用于 `FSP`\
  \ 的 `gFTP` 和用于 `TLS/SSL` 的 `Filezilla`。大多数客户端同时支持 FTP 和 SSH2。\n\n## 基于 浏览器的 FTP\n\
  \n你可以使用任何 Web 浏览器访问 FTP 站点并从中下载文件。浏览器对于查找单个文件非常有用，但不适用于下载大量文件。Web 浏览器对于检查 FTP 站点以查看其中列出的文件非常有效。当你用\
  \ Web 浏览器访问 FTP 站点时，目录中的整个文件列表将以网页的形式列出。你可以通过点击条目进入子目录。你可以轻松浏览 FTP 站点并下载文件。要下载文件，请点击下载链接。这将启动传输操作，并弹出一个对话框让你选择本地目录和文件名。默认名称与远程系统上的名称相同。在许多浏览器上，你可以使用下载管理器管理你的下载，它允许你取消正在进行的下载操作或删除其他下载。管理器将显示当前下载的剩余时间、速度和已传输量。\n\
  \n## GNOME 桌面 FTP：连接到服务器\n\n下载文件最简单的方法是使用 GNOME 文件管理器 `Nemo` 和 `Caja` 内置的 FTP 功能。在\
  \ GNOME 上，桌面文件管理器具有内置的 FTP 功能。FTP 操作已无缝集成到标准的桌面文件操作中。从 FTP 站点下载文件只需将文件从一个目录窗口拖到另一个窗口即可，其中其中一个目录恰好位于远程\
  \ FTP 站点。使用文件管理器访问远程 FTP 站点，列出远程目录中的文件，就像本地文件一样。在文件管理器的位置栏（`Ctrl-l` 或位置按钮）中，输入带有\
  \ `ftp://` 前缀的 FTP 站点 URL 并按回车。会弹出一个对话框，提示你指定如何连接。你可以匿名连接到公共 FTP 站点，也可以作为提供用户名和密码的用户身份连接（私有站点）。你还可以选择记住密码。\n\
  \n如需更多访问选项（例如安全的 SSH 连接、窗口共享和安全 Web（`HTTPS`）），你可以使用“连接到服务器”对话框（见图 5-7）。要打开“连接到服务器”对话框，在任何文件管理器窗口或桌面应用程序菜单上选择`文件\
  \ | 连接到服务器`菜单项。从`类型`菜单中，你可以选择服务类型。条目选项会随之更改，“FTP（带登录）”会添加一个用户名条目。点击`连接`按钮访问站点。\n\
  \n![Image](img/image-125.png) ![fig5-1b-15](img/image-126.png)\n\n图 5-7：GNOME FTP\
  \ 访问连接到服务器对话框\n\n远程 FTP 站点的顶级目录将在文件管理器窗口中显示（见图 5-8）。使用文件管理器浏览远程 FTP 站点的目录树，直到找到想要的文件。然后，为本地目录打开另一个窗口，你想要将远程文件复制到该目录。在显示\
  \ FTP 文件的窗口中，选择你想要下载的文件。然后点击并拖动这些文件到本地目录窗口。随着文件的下载，会弹出一个显示进的对话框。\n\n![Image](img/image-127.png)\n\
  \n图 5-8：使用“连接到服务器”和文件管理器的 GNOME FTP 访问\n\n文件管理器窗口的侧边栏（网络部分）将列出访问的 FTP 站点条目。FTP 站点名称右侧显示有一个弹出按钮。要断开连接，点击此按钮。FTP\
  \ 条目将与 FTP 站点图标和文件列表一起消失。\n\n## 社交网络\n\nLinux 为即时消息（IM）和 VoIP 语音提供了集成的社交网络支持。你可以与网络上的其他用户直接通信（见表\
  \ 5-18）。这些应用程序会自动安装，并在你首次启动系统时即可使用。即时消息（IM）客户端允许同一 IM 系统的用户在互联网的任何地方进行通信。通过互联网协议语音应用程序，你可以通过互联网连接通话。\n\
  \n| 客户端 | 描述 |\n| :--- | :--- |\n| Ekiga | VoIP 应用 |\n| Skype | VoIP 应用（伙伴仓库） |\n\
  | empathy | GNOME 即时消息 |\n| Pidgin | 较旧的即时消息客户端 |\n| Jabber | Jabber IM 服务 (gajim,\
  \ psi, emacs, empathy) |\n| Finch | 基于光标的命令行 IM 客户端 |\n| Hexchat | IRC 客户端 |\n\n\
  表 5-18：即时消息、通话和 VoIP 客户端 |\n\n可以使用软件管理器安装 Skype。安装后，你可以从 Internet 菜单访问 Skype。当你第一次启动\
  \ Skype 时，会要求你接受用户协议。界面与 Windows 版本类似。一旦启动 Skype，面板上会出现一个 Skype 面板图标。你可以用它在整个会话期间访问\
  \ Skype。点击打开 Skype，右键点击显示菜单，你可以更改状态、注销、访问选项、列出联系人组并开始会议电话。面板图标会根据你的状态发生变化。\n\n\n\
  \n\n\n# 图 6-2：带有 Cinnamon 菜单和 Nemo 文件管理器的 Cinnamon 桌面\n\n在桌面的任何位置点击右键会显示桌面菜单，通过菜单你可以向桌面添加新文件夹、以管理员权限（`root`）访问打开文件管理器、打开终端窗口、更改背景以及添加桌面组件（desklets）（参见图\
  \ 6-3）。`Customize`（自定义）选项会打开“当前显示器布局”窗口，允许你控制桌面图标的显示。你可以更改尺寸（小、中、大）、以网格形式显示（`Auto-arrange`）、垂直显示图标（`columns`）或水平显示（`lines`）、按名称、大小、日期和类型排序，或关闭`Auto-arrange`选项以将图标放置在任何位置。右侧和底部的滚动条允许你调整图标间距。对话框底部的链接会打开“桌面设置”对话框，你可以在那里确定哪些桌面图标。\n\
  \n![Image](img/image-130.png) ![Image](img/image-131.png)\n\n图 6-3：桌面菜单和当前显示器布局窗口（自定义）\n\
  \n在“系统设置”桌面对话框中，你可以指定要在桌面上显示的图标（参见图 6-4）。默认情况下，会显示计算机和主目录图标，以及你挂载的任何文件系统的设备图标，例如\
  \ USB 驱动器或 DVD 光。你还可以选择显示管理器的网络文件夹（`network servers`）和垃圾箱。`Desktop layout`选项允许你选择是在所有连接的显示器上显示桌面图标，还是仅在主显示器上显示。缺少额外的显示器，你可以选择仍然显示其图标。\n\
  \n在输入模式的首字母时，点击并按住 `meta` 键可以快速搜索桌面项目。这会打开一个文本框，你在其中输入搜索模式。它会高亮第一个匹配的最佳图标。\n\n![Image](img/image-132.png)\
  \ ![Image](img/image-133.png)\n\n图 6-4：系统设置桌面\n\n## 桌面组件 (Desklets)\n\n桌面组件的工作原理类似于小部件（applet），但它是针对桌面而不是面板的，如图所示。你可以使用面板上的`Show\
  \ desktop` 图标仅显示你的桌面组件和桌面图标，隐藏已打开的窗口。你也可以右键点击`Show Desktop` 图标显示菜单，并选择`Show Desklets`项，如果你的打开窗口隐藏了它们，这会将所有桌面组件带到最前。\n\
  \n![Image](img/image-2.jpeg)\n\n默认安装了三个桌面组件（但未激活）：时钟、照片和启动器。`Clock`组件显示数字时钟。`Digital`框架组件显示一个小型对话框，对你\
  \ `Pictures` 文件夹中的图像进行幻灯片播放。`Launcher`组件可以配置为启动应用程序。可以在 [`cinnamon-spices.linuxmint.com/desklets`](https://cinnamon-spices.linuxmint.com/desklets)\
  \ 找到可用的小部件列表。\n\n你可以使用“系统设置-桌面组件”对话框将桌面组件添加到桌面（激活），或通过右键点击桌面背景显示桌面菜单并点击`Add Desklets`项。桌面组件有\
  \ `Manage`（管理）、`Download`（下载）和 `General Settings`（常规设置）选项卡（参见图 6-5）。`Manage`选项卡列出了已安装在你电脑上的桌面组件。带有勾选标记的项是显示在桌面上的组件。你可以使用搜索框搜索组件。如果某个组件无法删除，它将有一个锁图标。最初作为\
  \ Cinnamon 桌面一部分安装的桌面组件是被锁定的。`Manage`选项卡的底部有一个工具栏，带有用于向桌面添加(+)和从桌面移除( -) 桌面组件的按钮、用于从系统中删除组件并将其从列表中移除(`x`)的按钮、删除所有已安装组件的“全部删除”按钮，以及一个用于显示所选组件信息的`About`（关于）按钮，如图所示。\n\
  \n![Image](img/image-134.png)\n\n要激活一个桌面组件（将其显示在桌面上），请点击其条目并点击工具栏上的加按钮/加号按钮`(+)`。要从桌面移除桌面组件，请点击减号按钮`(-)`。\n\
  \n某些桌面组件可以配置。这些组件的条目上会显示齿轮图标。点击该图标打开一个包含配置设置的对话框。`Clock`组件配置图标打开一个对话框，你可以在其中设置字体大小、文本颜色并指定自定义日期格式。\n\
  \n![Image](img/image-135.png) ![Image](img/image-136.png)\n\n图 6-5：桌面组件管理选项卡\n\n\
  你可以通过点击`Download`选项卡（参见图 6-6）从 Linux Mint 仓库下载并安装额外的桌面组件。`Sort by`菜单允许你按名称、流行程度、日期（最新）和安装情况进行排序。要安装桌面组件，点击其条目右侧的组件下载按钮（向下箭头）。下载完成后，向下箭头按钮会消失，随后在组件条目中出现勾选标记。然后你将在`Manage`选项卡中看到该组件。从那里你可以激活它并添加到桌面。\n\
  \n`Download`选项卡底部的工具栏具有以下按钮：`More info`（更多信息，灯泡图标）、用于移除已安装组件的`Uninstall`（卸载）、用于更新已安装组件的`Updates`（更新）以及更新可用组件列表的`Refresh`（刷新）。要查看有关组件的更多信息，点击`More\
  \ info`按钮打开其网页。\n\n![Image](img/image-137.png)\n\n`General Desklets`选项卡允许你决定桌面组件的显示方式。你可以为它们显示边框、不显示边框或同时显示边框和组件标题（`header`）。你可以将组件对齐到网格，或允许自由放置。\n\
  \n![Image](img/image-138.png)\n\n图 6-6：桌面组件下载选项卡\n\n## 热角 (Hot Corners)\n\n热角允许你配置屏幕角落来运行\
  \ Expo 工作空间切换器、Scale 窗口切换器、显示桌面功能或你指定的程序（`command`）。你可以通过将鼠标悬停在角落来激活这些操作。将鼠标移动到角落并保持在那里即可运行该操作。\n\
  \n你使用“系统设置-热角”对话框来配置热角。中心正方形图像显示各个角的状态。激活的角为绿色，未激活的角为灰色。每个角都有一个菜单从中选择应用程序：`显示所有工作空间`(Expo)、`显示所有窗口`(Scale)、`显示桌面`以及`运行命令`(`custom`)。热角默认禁用，每个角都显示为灰色。要开启某个角，点击`Enable\
  \ this corner`标签右侧的开关。该角随后将显示实绿色。`Activation delay`（激活延迟）项允许你设置角被激活的速度，如果你需要，可以设置一个延迟。在图\
  \ 6-7 中，例如，左上角配置为无延迟运行 Expo 工作空间切换器。右角配置为带短延迟运行 Scale 窗口切换器。\n\n`显示桌面`选项切换桌上打开窗口的最小化状态。如果显示，所有窗口都将最小化到面板上的窗口列表小部件中。如果已最小化，则它们将全部显示在桌面上。在图\
  \ 6-7 中，左下角配置为显示桌面。\n\n\n\n\n\n“运行命令”选项打开一个文本框，您可以在其中输入应用程序名称。在图 6-7 中，右下角被配置为运行\
  \ Nemo 文件管理器。在文本框中输入了 `nemo` 命令。通过此设置，每当你将鼠标移动到该角时，Nemo 文件管理器都会打开一个包含你主文件夹的窗口。\n\
  \n![Image](img/image-139.png) ![Image](img/image-140.png)\n\n图 6-7：系统设置热点\n\n###\
  \ 键盘和鼠标快捷键\n\n可以在系统设置“键盘”对话框的“快捷键”标签页配置键盘快捷键（参见图 6-8）。提供了常规、窗口、工作区、系统、启动器、声音和媒体（如果您的键盘支持这些键）以及辅助功能的快捷键。类别列在左侧，针对特定操作（如窗口定位）有额外的展开条目。在类别内，您可以选择一个快捷键任务，其按键将在下方的“键盘绑定”部分显示。要更改或添加按键，请点击“键盘绑定”部分中的字符串，这将打开一个窗口，您可以在其中输入新按键或组合键。常用快捷键列表见表\
  \ 6-1。\n\n![Image](img/image-141.png)\n\n图 6-8：系统设置键盘，键盘快捷键\n\n| 键位 | 描述 |\n| :---\
  \ | :--- |\n| Cinnamon | |\n| Alt-F2 | 从命令行运行命令 |\n| Meta | 显示 Cinnamon 菜单（Windows\
  \ 键） |\n| Meta + 字符 | 为桌面图标打开桌面搜索框 |\n| Ctrl-Alt-t | 打开终端窗口 |\n| Ctrl-Alt-Escape\
  \ | 仅重启 Cinnamon 桌面 |\n| Workspaces | |\n| Alt-F1 | 切换 Expo 工作区切换器 |\n| `Ctrl-Alt-*uparrow`\
  \ | 切换 Expo 工作区切换器 |\n| `Ctrl-Alt-left` | 移动到左侧工作区 |\n| `Ctrl-Alt-right` | 移动到右侧工作区\
  \ |\n| `Ctrl-Alt-Shift-arrows` | 使用左或右箭头将窗口移动到新工作区 |\n| Panel | |\n| Ctrl-Alt-L\
  \ | 锁定屏幕 |\n| Ctrl-Alt-Delete | 注销 |\n| Windows | |\n| `Ctrl-Alt-*downarrow` | 切换缩放窗口切换器\
  \ |\n| Alt-Tab | 在窗口间切换 |\n| Alt-Shift-Tab | 反向在窗口间切换 |\n| Alt-~ | 在同一应用程序的窗口间切换\
  \ |\n| Alt-F5 | 取消当前窗口的最大化 |\n| Alt-F4 | 关闭当前窗口 |\n| `Meta-*left` | 将当前窗口平铺到屏幕左侧\
  \ |\n| `Meta-*right` | 将当前窗口平铺到屏幕右侧 |\n| `Meta-*uparrow` | 将当前窗口平铺到顶部 |\n| `Meta-*downarrow`\
  \ | 将当前窗口平铺到底部 |\n| Ctrl-Alt-Numpad 0 | 最大化窗口 |\n| Ctrl-Alt-Numpad 5 | 在屏幕中间居中/最大化窗口\
  \ |\n\n**表 6-1：Cinnamon 键盘快捷键**\n\n### 菜单\n\nCinnamon 菜单由用于常用应用程序和操作的收藏图标栏、基于应用程序类别的菜单以及用于查找应用程序的搜索框组成（参见图\
  \ 6-9）。此外，菜单还会显示文件夹书签（位置）和最近访问的文件。Cinnamon 菜单是位于面板左侧的面板应用插件。\n\n![Image](img/image-142.png)\n\
  \n图 6-9：Cinnamon 菜单\n\n在菜单中，收藏项显示在左侧。右侧是类别菜单和所选类别下的项目菜单。如果无法显示所有项目，则菜单列表将变为滚动框，让您滚动查看项目。类别列表上的“所有应用程序”条目显示所有应用程序。未分配到特定类别的项目可以在此类别中找到。“位置”类别列出文件夹书签，“最近文件”列出最近访问的文件。顶部的搜索框允许您使用模式快速搜索应用程序（参见图\
  \ 6-10）。如果两个应用程序具有相同的标签（例如 Gedit 和 Xed 编辑器），菜单上每个程序将有一个不同的条目，并在括号中列出应用程序名称，如文本编辑器\
  \ (Gedit) 和文本编辑器 (Xed)。此外，如果您从 Flatpack 仓库安装相同的应用程序，Flatpack 版本将在括号中带有 Flatpack\
  \ 字样，如 Calibre (Flatpack)。\n\n![Image](img/image-143.png)\n\n**图 6-10：Cinnamon 菜单搜索**\n\
  \n收藏栏顶部显示应用程序，下部显示系统关机、注销和锁定任务（参见图 6-11）。这些部分之间用空格隔开。当您的鼠标悬停在图标上时，它的名称和描述出现在菜单的右下角。点击应用程序图标将打开该程序。点击关机、注销和锁定图标的任何一个将打开相应的对话框并允许您执行操作。\n\
  \n![Image](img/image-144.png)\n\n图 6-11：Cinnamon 菜单收藏\n\n收藏项可以通过弹出菜单轻松添加或删除。右键点击应用插件可以显示添加到面板、桌面和收藏的选项（参见图\
  \ 6-12）。当您添加项目时，它们会变得越来越小以适应。要从收藏中删除项目，可以在鼠标悬停在其上方显示名称，然后使用搜索框查找该项目。右键点击菜单项并选择“从收藏中删除”。\n\
  \n![Image](img/image-145.png) ![Image](img/image-146.png) ![Image](img/image-147.png)\n\
  \n图 6-12：Cinnamon 菜单\n\n右键点击菜单面板插件会弹出移除菜单或配置菜单的选项，如下所示。“移除此插件”条目将从从面板移除。选择“配置”选项将打开系统设置菜单对话框。\n\
  \n![Image](img/image-148.png)\n\n菜单配置对话框的“面板”标签页允许您选择面板图标以及为 Cinnamon 菜单显示的文本（参见图\
  \ 6-13）。与其点击应用插件打开菜单，您可以选择只需将鼠标悬停在其上方，并指定悬停延迟。此处还可以设置打开菜单的键盘快捷键。在“菜单”标签页上，您可以设置显示功能，如显示书签和位置、应用程序和类别图标以及收藏，并设置收藏部分的最小高度（布局和内容部分）。您还可以启用应用程序列表的自动滚动，对于搜索可以使用应用程序的完整路径（行为部分）。\n\
  \n![Image](img/image-149.png)\n\n![Image](img/image-150.png)\n\n图 6-13：Cinnamon\
  \ Linux Mint 菜单配置\n\n菜单按钮（最右侧按钮）列出重置默认设置以及保存或导入您的菜单项的选项。\n\n![Image](img/image-151.png)\n\
  \n**图 6-14：Cinnamon 主菜单编辑器**\n\n\n\n\n\n要编辑菜单上的项目，请点击“设置”对话框中“菜单”选项卡上的“打开菜单编辑器”按钮。这会打开主菜单编辑器，您可以在此处选择显示在菜单上的应用程序（参见图\
  \ 6-14）。菜单类别列在左侧滚动框中，应用程序项目显示在右侧滚动框中。要隐藏某个项目，取消勾选其复选框。要永久删除某个项目，选中它并点击`删除`按钮。要将某个项目移动到不同的类别，选中它，点击`剪切`按钮，然后点击您想要移动到的类别，最后点击`粘贴`按钮。可以重新调整类别的位置，将其向上或向下移动。若要恢复原始的类别、应用程序及其位置设置，您需要点击“恢复系统配置”按钮。\n\
  \n`新建菜单`按钮允许您创建新的类别菜单。您可以输入名称并选择要使用的图标。`新建项目`按钮允许您添加菜单项，该项可以是应用程序、终端窗口中的应用程序（shell\
  \ 脚本）或位置（文件夹）。您必须手动指定名称和命令。\n\n### Windows\n\nLinux Mint 上的 Windows 操作方式与其他 Linux\
  \ 发行版相似，具有类似的最大化、最小化和工作区操作。您可以使用窗口标题栏右侧的按钮来最小化（减号）、最大化（展开图像）和关闭（x）窗口。\n\n![Image](img/image-152.png)\n\
  \n窗口的偏好（例如双击标题栏的效果、标题栏字体和按钮顺序）可以使用系统设置 Windows 对话框进行设置（参见图 6-15）。该对话框有三个选项卡：`标题栏`、`行为`和`Alt-Tab`。`标题栏`选项卡有一个`按钮`部分，您可以在其中设置窗口按钮的位置，以及一个`标题栏`部分用于可以在标题栏上执行的操作。在`按钮`部分中，标题栏按钮已针对右侧进行了排序。您可以为窗口菜单添加另一个按钮。您也可以通过为右侧按钮选择空菜单选项并为左侧按钮选择`最小化`、`最大化`和`关闭`项，将它们移动到左侧。\n\
  \n![Image](img/image-153.png)  ![Image](img/image-154.png)\n\n图 6-15: Windows 设置：标题栏选项卡\n\
  \n在`操作`部分中，`action-double-click-titlebar`键被设置为`toggle-maximize`（最大化窗口），但菜单允许您选择此类选项，例如`toggle-shade`，它会将窗口折叠而不是最大化。还有中间键点击和右键点击的操作菜单（默认设置为`菜单`\
  \ - 窗口菜单）。“鼠标滚滚动标题栏时的操作”菜单允许您通过在标题栏上滚动来更改窗口的透明度，使其透明，这样您就可以看到下方的窗口或图标。\n\n`行为`选项卡允许您修改窗口的移动和显示（参见图\
  \ 6-16）。它包含两个部分：“窗口焦点”和“移动和调整窗口大小”。在“窗口焦点”部分中，您可以设置焦点模式（`click`、`mouse`或`sloppy`）。“将对话框窗口附加到父窗口的标题栏”选项会将应用程序窗口打开的对话框作为应用程序窗口的叠加显示。在“移动和调整窗口大小”部分中，您可以确定新窗口的初始位置，选择一个键来调整窗口大小或移动窗口（`Alt`、`Meta`、`Super`或`Control`）。`Alt`已被选中。\n\
  \n![Image](img/image-155.png)\n\n图 6-16: Windows 设置：行为选项卡\n\n`Alt-Tab`选项卡允许您配置窗口切换器（参见图\
  \ 6-17）。您可以为菜单选择一种样式，例如仅图标、仅缩略图、图标和窗口预览以及图标和缩略图（默认）。对于支持加速的图形（3D），您还可以选择`coverflow`和`timeline`。大多数计算机现在支持加速图形。您还可以选择在所有工作区中列出窗口，而不仅仅是当前工作区。\n\
  \n![Image](img/image-156.png)\n\n图 6-17: Windows 设置：Alt-tab 选项卡\n\n要管理窗口平铺和边缘翻转，您可以使用系统设置中的“窗口平铺”对话框。“启用窗口平铺和吸附”选项在您将窗口移动到屏幕边缘时启用窗口平铺和吸附（参见图\
  \ 6-18）。它是默认开启的。您还可以选择一个键在吸附模式和平铺模式之间进行切换。当将窗口移动到屏幕顶部时，它被设置为平铺，覆盖屏幕顶部部分。您可以通过开启“将窗口拖到屏幕顶部时最大化而非平铺”选项将其更改为最大化。\n\
  \n![Image](img/image-157.png)  ![Image](img/image-158.png)\n\n图 6-18: 窗口平铺和边缘翻转\n\
  \n#### 最小化、最大化和关闭窗口\n\n要最大化窗口，您可以双击标题栏、将标题栏拖动到屏幕顶部，或者点击标题栏右侧的最大化按钮（展开图像）。\n\n要取消最大化，将标题栏从屏幕顶部向下移动，或者点击其最大化按钮（展开图像）。\n\
  \n要移动窗口，点击并拖动标题栏。当您移动时，光标会变成手形。您也可以右键点击标题栏并在弹出菜单中选择`移动`项。\n\n要最小化窗口，点击标题栏右侧的最小化按钮（减号）。最小化的窗口将缩小为面板上窗口列表中的按钮。要恢复最小化的窗口，请点击该按钮。\n\
  \n要关闭窗口，点击标题栏右侧的窗口关闭按钮（x 字符）。您也可以右键点击标题栏并选择`关闭`项。\n\n```\nAlt+F4\n```\n\n#### 组合窗口列表\n\
  \n每个每个打开的窗口在底部面板的组合窗口列表上都有一个对应的按钮。点击它可以在最小化和显示之间切换窗口。按钮将在其左上角显示该应用程序打开的窗口数量。您可以右键点击窗口列表按钮打开弹出菜单，提供最大化、关闭和将窗口移动到另一个工作区的选项（参见图\
  \ 6-19）。最小化的窗口具有恢复窗口而非最小化的选项。您还可以关闭所有窗口，或仅关闭其他窗口。要将窗口移动到另一个工作区，点击“移动到另一个工作区”项以展开菜单显示您的工作区列表。`文件`按钮菜单新增了`位置`（您所有的主文件夹）以及`主目录`、`计算机`和`垃圾箱`。\n\
  \n要配置窗口列表，右键点击面板上的任意按钮并选择`偏好`以展开菜单显示`配置`项，所示。这会打开组合窗口列表配置对话框。从右上角的菜单中，您可以保存和导入窗口列表配置设置。\n\
  \n![Image](img/image-159.png)\n\n![Image](img/image-160.png)  ![Image](img/image-161.png)\
  \  ![Image](img/image-162.png)\n\n图 6-19: 窗口列表按钮菜单\n\n\n\n\n分组窗口列表对话框分为四个标签页：通用（General）、面板（Panel）、缩略图（Thumbnails）和上下文菜单（Context\
  \ Menu）（参见图 6-20）。在`General`标签页上，你可以控制行为和热键，例如应用程序分组、鼠标操作以及循环应用程序的按键。`Panel`标签页允许你添加标签、确定间距并允许拖动按钮（重新排列按钮）。`Thumbnails`标签页显示打开的窗口和应用程序的缩略图，配置的大小和显示方式，并启用鼠标悬停显示缩略图。`Context\
  \ Menu`标签页向右键菜单添加条目，例如显示最近项目和新窗口选项。\n\n![Image](img/image-163.png)\n\n![Image](img/image-164.png)\n\
  \n图 6-20：分组窗口列表配置 - 通用和面板标签页\n\n在`Panel`标签页的“按钮标签”菜单中，你可以配置窗口列表中打开窗口按钮是否应该有标签。你可以从`None`（默认）、`Application\
  \ name`（应用程序名称）、`Window title`（窗口标题）和`Window title for the focused window`（焦点窗口的标题）之间进行选择。图\
  \ 6-21 显示了这些选项。\n\n![Image](img/image-165.png)\n\n![Image](img/image-166.png)\n\n\
  ![Image](img/image-167.png)\n\n图 6-21：窗口列表按钮标签 - 无、应用程序、标题\n\n将鼠标悬停在分组窗口列表按钮上会显示该应用程序任何打开窗口的缩略图（参见图\
  \ 6-22）。将鼠标悬停在缩略图上会高亮它，并在右上角显示关闭按钮，同时短暂显示打开的窗口在桌面上的样子。点击缩略图，如果窗口是最小化的则会恢复窗口，或者使该窗口成为桌面上的活动窗口。分组窗口列表的`Thumbnail`标签页允许你配置缩略图行为。`Thumbnails`部分允许你关闭缩略图功能（`Show\
  \ thumbnails`）以及配置缩略图的显示，例如调整大小和将其垂直而非水平显示。`Hover Peak`部分允许你关闭并管理悬停的缩略图窗口在桌面上的显示。\n\
  \n![Image](img/image-168.png)  ![Image](img/image-169.png)\n\n图 6-22：窗口列表按钮缩略图\n\
  \n分组窗口列表的`Thumbnail`标签页允许你配置缩略图行为（参见图 6-23）。`Thumbnails`部分允许你关闭缩略图功能（`Show thumbnails`）以及配置缩略图的显示，例如调整大小和将其垂直而非水平显示。`Hover\
  \ Peak`部分允许你关闭并管理悬停的缩略图窗口在桌面上的显示。\n\n![Image](img/image-170.png)\n\n图 6-23：分组窗口列表配置\
  \ - 缩略图标签页\n\n#### 调整窗口大小和平铺窗口\n\n你可以垂直、水平或同时调整窗口大小。若要同时向两个方向调整大小，请将鼠标移动到窗口的任意角，直到它变成角部指针（一个带有直角指针图像的箭头）。然后你可以点击并拖动到你想要的大小。对于侧边变化，将鼠标移动到窗口的左侧或右侧边缘，直到它变成侧边指针（一个带有线条图像的箭头）。同样的操作也适用于窗口顶部或底部更改。\n\
  \nLinux Mint 支持窗口贴靠（平铺）。将窗口移动到屏幕的左边缘或右边缘（当鼠标到达边缘时）会扩展窗口以占据屏幕的该侧。将窗口移动到屏幕顶部将使窗口最大化以使用全屏，窗口菜单栏和按钮横跨顶部。\n\
  \n你还可以平铺两个窗口，使一个占据屏幕的一半，另一个使用另一半。将窗口拖动到左侧（点击并拖动标题栏，或在窗口上使用`Alt-click`）。当你的鼠标指针遇到屏幕边缘时，屏幕的整个左侧将高亮显示。当你释放鼠标时，窗口将贴附并显示在屏幕的左侧。同样的操作适用于右侧。要恢复窗口到之前的尺寸，只需将其向下拖动并远离边缘。\n\
  \n#### 使用窗口快速列表切换窗口\n\n你还可以使用窗口快速列表切换窗口，你可以将其添加到面板中。窗口快速列表列出了你所有打开的窗口，按工作区组织（参见图\
  \ 6-24）。\n\n![Image](img/image-171.png)  ![Image](img/image-172.png)\n\n图 6-24：窗口快速列表菜单\n\
  \n#### 使用活动界面和 Alt-Tab 切换窗口\n\n你可以使用活动界面（Scale screen）在打开窗口之间切换，它以网格形式显示你打开的窗口（参见图\
  \ 6-25）。窗口标题和应用程序图标显示在每个窗口下方。点击窗口将你返回桌面，选中的窗口现在是活动窗口。你也可以按`Esc`键返回桌面。在活动界面上，你可以关闭窗口。\n\
  \n![Image](img/image-3.jpeg)\n\n图 25：活动界面：缩放以切换窗口\n\n你可以通过按`Ctrl-Alt-downarrow`键访问活动界面。你也可以使用配置为活动界面的热角，或使用活动插件（所示）。对于热角，使用系统设置中的热角对话框启用“显示所有窗口”。上角已选择“显示所有窗口”。当你将鼠标移动到该角时，将显示活动界面。对于活动插件，首先安装它，然后点击面板上的活动插件按钮显示活动界面。\n\
  \n![fig6-19a-0033](img/image-173.png)\n\n你还可以使用 Alt-Tab 键在窗口之间切换以显示切换器（参见图 6-26）。打开的窗口通过应用程序图标显示。使用`Alt-Tab`键选择你想要的。当你遍历图标行时，当前选中窗口的缩略图显示在图标下方。`Alt-Shift-Tab`键向后遍历窗口，`Alt-`键在同一应用程序的窗口之间切换。\n\
  \n![Image](img/image-174.png)\n\n图 6-26：使用 Alt-Tab 切换窗口（图标和缩略图）\n\n窗口切换器可以在系统设置窗口对话框的\
  \ Alt-Tab 标签页进行配置。“Alt-tab 切换器样式”菜单允许你选择切换器显示的内容。默认是“图标和缩略图”，但你可以将其设置为仅图标或使用窗口预览代替图标或缩略图。窗口预览会将除选中窗口以外的屏幕留。\n\
  \n你还可以使用 3D 窗口切换器，类似于以前启用了 3D 的 GNOME 版本中使用的那些。`Coverflow (3D)`选项在选中窗口的两侧显示未选窗口。`Timeline\
  \ 3D`在侧边显示单个未选窗口栈。\n\n![Image](img/image-175.png)\n\n图 6-27：使用 Alt-Tab 切换窗口（Coverflow\
  \ 3D )\n\n\n\n“效果”对话框允许你为窗口、对话框和滚动框启用桌面效果（参见图 6-28）。效果对话框有两个选项卡：“启用效果”和“自定义”。在“启用效果”选项卡上，你可以开启或关闭窗口效果，启用对话框效果，并选择一种效果样式，例如\
  \ Cinnamon（默认值）、缩放（Scale）、淡入（Fade）或混合（Blend）。在“自定义”选项卡上，你可以为特定的窗口任务选择效果，例如为窗口最小化和关闭操作选择缩放、淡入或“无”（参见图\
  \ 6-29）。对于最大化任务，你可以选择缩放或无。你还可以选择效果的形状。\n\n![Image](img/image-176.png) ![Image](img/image-177.png)\n\
  \n图 6-28：系统设置效果：启用效果选项卡\n\n![Image](img/image-178.png)\n\n图 6-29：系统设置效果：自定义选项卡\n\
  \n## 使用热点 (expo) 和 expo 插件选择工作区\n\nLinux Mint 支持工作区，默认启用两个。你可以设置多个工作区，每个工作区都有其打开的窗口。你可以直接切换工作区，也可以通过\
  \ Expo 屏幕进行切换。若要直接切换，你需要在面板上添加工作区切换器插件，或使用 `Ctrl-Alt-arrow` 键移动到某个工作区。工作区按行排列。初始情况下，如果有四个工作区，你将拥有一行四个工作区。使用\
  \ `Ctrl-Alt-right-arrow` 移动到下一个工作区，使用 `Ctrl-Alt-left-arrow` 返回。在系统设置的“工作区”对话框中，你可以启用“允许循环工作区”选项，通过连续使用\
  \ `Ctrl-Alt-right-arrow` 键循环回到第一个工作区。如果你希望在移动到工作区时在桌面上短暂显示工作区名称，可以在系统设置工作区对话框中启用“启用工作区\
  \ OSD”。\n\n工作区切换器插件会在面板上显示工作区的按钮，就像 GNOME 2 桌面一样（参见图 6-30）。点击工作区按钮切换到该工作区。当前工作区会被高亮。随着你添加工作区，它们会被添加到该行中。打开“配置”选项将显示工作区切换对话框，你可以在其中选择显示类型，可以是简单的编号按钮或视觉化表示（默认值）。\n\
  \n![Image](img/image-4.jpeg) ![Image](img/image-5.jpeg)\n\n图 6-30：工作区切换插件\n\n工作区是通过\
  \ Expo 管理的。通过 Expo，你可以添加或删除工作区，还可以更改它们的名称，并将打开的窗口直接从一个工作区移动到另一个工作区。你可以通过多种方式访问 Expo。通过键盘，你可以按下\
  \ `Alt-F1` 或 `Ctrl-Alt-uparrow` 键切换 Expo 屏幕。你还可以配置热点角来打开 Expo 屏幕，或者安装 Expo 插件。Expo\
  \ 插件（此处所示）会在面板上放置一个 Expo 按钮，点击后可打开 Expo 屏幕。\n\n![Image](img/image-179.png)\n\n热点角\
  \ Expo 访问是通过系统设置“热点角”对话框配置的（参见图 6-31）。屏幕的每个角都可以启用为热点角。每个角都有一个菜单，选项包括：显示所有工作区 (Expo)、显示所有窗口\
  \ (Scale)、显示桌面和运行命令。“显示所有工作区”选项会打开 Expo 屏幕，而“显示所有窗口”会打开窗口切换屏幕。在点击“启用此角”开关之前，该角不会被启用。此时中间图像中的角将变为实绿色。未启用的角为灰色。默认设置显示在图\
  \ 6-24 中，并启用了左上角和右上。左上角显示工作区，左下角和右上显示窗口。\n\n![Image](img/image-180.png) ![Image](img/image-140.png)\n\
  \n图 6-31：启用了 Expo 的热点角\n\nExpo 屏幕（显示所有工作区）显示你当前的工作区，以及屏幕右侧的名称和加号按钮，你用它添加工作区（参见图\
  \ 6-32）。将鼠标悬停在工作区上，会高亮它并在右上角显示一个关闭框，允许你删除工作区。它还将你的窗口缩放为正方形网格。点击加号按钮添加工作区。默认情况下，这些是作为正方形网格的一部分添加的。要离开\
  \ Expo 屏幕，点击特定的工作区或按 `Esc` 键。\n\n![Image](img/image-6.jpeg)\n\n图 6-32：Expo 工作区配置（正方形网格）\n\
  \n你可以使用系统设置工作区对话框让 Expo 屏幕中的工作区以行显示而非网格显示（参见图 6-33）。关闭“将 Expo 视图显示为网格”开关。你还可以更改工作区名称。每个工作区下方都有其名称的文本框。点击它进行编辑。\n\
  \n![Image](img/image-7.jpeg)\n\n图 6-33：Expo 工作区配置（无网格）\n\n![Image](img/image-181.png)\n\
  \n![Image](img/image-182.png) ![Image](img/image-183.png)\n\n图 6-34：系统设置工作区：OSD\
  \ 和设置\n\n要将窗口移动到不同的工作区，只需点击并拖动窗口。当鼠标经过工作区时，使用 `Ctrl+Alt+Shift+arrow` 移动。你也可以右键点击标题栏并选择工作区项。工作区项显示所有工作区的子菜单。\n\
  \n系统设置工作区对话框显示显示工作区的基本选项（参见图 6-34）。在 OSD 选项卡上，你可以设置持续时间和位置的工作区切换 OSD。在设置选项卡上，你可以设置额外的工作区选项，如启用工作区循环、将\
  \ Expo 视图显示为网格以及将工作区限制在主显示器上。\n\n## Linux Mint 面板：现代布局\n\n通过面板，你可以访问菜单、运行插件并启动应用程序（参见图\
  \ 6-35）。面板基于 GNOME 2 面板，为桌面提供了简单且有效的插件使用。在 Linux Mint 19.1 中，Cinnamon 引入了使用现代布局的新面板，该布局高度可配置，具有分组列表、窗口预览和图标尺寸区域。面板左侧具有\
  \ Cinnamon 菜单、应用程序按钮和最小化窗口。面板右侧具有系统插件，如时间和日期、蓝牙、电池、网络管理器和声音。你可以根据自己的需要自定义面板，放置自己选择的插件和菜单。你可以添加新面板、向面板添加应用程序，并添加各种插件。\n\
  \n![Image](img/image-184.png)\n\n![Image](img/image-185.png)\n\n![Image](img/image-186.png)\n\
  \n图 6-35：带有菜单、分组窗口列表和插件的 Linux Mint 面板，位于 Linux Mint 桌面底部\n\n面板配置任务如添加应用程序、选择插件、设置菜单和创建新面板通过面板弹出菜单处理。只需在面板的空白处（中间处）右键点击，即可显示包含条项如“向面板添加插件”、“面板设置”、“主题”、“系统设置”、“故障排除”、“修改面板”、“面板编辑模式”的菜单（参见图\
  \ 6-36）。\n\n![Image](img/image-187.png)\n\n图 6-36：面板弹出菜单（右键点击中间）和面板插件菜单\n\n\n\n\n\
  前四项显示了系统设置配置对话框：主题、小组件、面板和系统设置。`Troubleshoot`（故障排除）项显示一个子菜单，列出了重启桌面（`Restart Cinnamon`）、恢复桌面默认设置（`Restore\
  \ all settings to default`）以及启动错误扫描（`Looking Glass`）（参见图 6-37）。\n\n`Modify panel`（修改面板）项显示一个子菜单，包含移除或移动面板、添加另一个面板以及清除面板上所有小组件（留下一个空面板）的选项。移动选项显示屏幕的四个边缘，允许您将面板移动到任何边缘（包括侧边）。点击您想要将面板移动到的边缘。复制和粘贴功能允许您将一组已经存在于另一个面板的小组件添加到新面板中。使用\
  \ `\"Copy applet configuration\"`（复制小组件配置）项可以创建当前面板小组件集的副本，然后选择另一个可以可以粘贴（添加）该组小组件的面板。对面板执行粘贴操作将移除该面板中已有的任何小组件。某些小组件不能出现在多个面板中，例如网络和声音小组件。\n\
  \n![Image](img/image-188.png) ![Image](img/image-189.png)\n\n图 6-37：面板菜单的 Troubleshoot\
  \ 和 Modify 子菜单\n\n\"Panel Edit mode\"（面板编辑模式）开关允许您移动或移除面板上的小组件。当面板在使用时，该开关应保持关闭。要编辑面板，点击开关将其打开。不同区域的背景将显示颜色，例如左侧的应用小组件为红色，面板的空部分（中间）为绿色，右侧的小组件为蓝色（参见图\
  \ 6-38）。要移动项目，点击并拖动它。当您移动项目时，您的指针图像会变为手。要移除项目，右键点击它以显示带有 `\"Remove this applet\"\
  `（移除此小组件）项的菜单。完成编辑后，再次打开面板菜单并点击 `\"Panel Edit mode\"`开关将其关闭。\n\n![Image](img/image-190.png)\n\
  \n![Image](img/image-191.png)\n\n图 6-38：编辑模式下的 Linux Mint 面板\n\n\"Panel settings\"\
  （面板设置）项打开系统设置面板对话框，让您可以配置面板（参见图 6-39）。您可以添加新面板、设置面板和图标大小以及自动隐藏面板。在 Panel Visibility（面板可见性）部分，如果您在\
  \ Auto-hide panel（自动隐藏面板）菜单中选择自动隐藏，面板将被隐藏，直到您将鼠标移动到屏幕底部。\n\n在 Customize（自定义）部分，显示着一个比例尺，您可以在其中更改面板大小。您还可以选择调整左、中、右面板区域的图标大小。区域是在\
  \ Linux Mint 19.1 引入的新 Cinnamon 面板中实现的。面板被分为三个可配置区域：右侧、中间和左侧（垂直区域为顶部、中间和底部）。这些区域的图标大小可以单独配置。图标大小可以缩放到适应面板的任何尺寸（`\"\
  Scale to panel size\"` 选项），或者缩放到若干几个固定的“清晰”尺寸之一。固定尺寸不会进行动态缩放，因此看起来更清晰、更锐利。有两个缩放选项：optimal（最佳）和\
  \ exact（精确）。exact 尺寸将图标动态缩放到面板的精确尺寸，没有固定尺寸那么清晰。optimal 尺寸则缩放到适合面板的最大固定尺寸。默认情况下，左侧和中间区域以最佳方式缩放至面板大小，而带有系统图标的右侧区域被设置为固定的\
  \ 24pt 大小。\n\n在 General Panel Options（常规面板选项）部分，您可以添加新面板。\"\"Panel edit mode\"`\
  \ 按钮是开启面板编辑模式的简单方法。您还可以设置符号图标大小。\n\n![Image](img/image-192.png) ![Image](img/image-193.png)\n\
  \n图 6-39：面板设置对话框\n\n## Linux Mint 小组件 (Applets)\n\n小组件是执行在面板内任务的小型程序。可用小组件的列表可以在\
  \ [`cinnamon-spices.linuxmint.com/applets`](https://cinnamon-spices.linuxmint.com/applets)\
  \ 找到。要向面板添加小组件，请打开系统设置小组件对话框，您可以从系统设置或面板弹出菜单中打开它。在 Manage（管理）选项卡中，小组件对话框列出了系统中已可用的小组件。您可以使用搜索框在列表中搜索小组件。激活且在面板上的小组件右侧有一个勾号（参见图\
  \ 6-40）。如果小组件无法移除，它将有一个锁图标。最初作为 Cinnamon 桌面部分安装的小组件是被锁定的。某些小组件可以配置，这些项目的项上会显示齿轮图标。一旦您将小组件添加到面板，配置按钮将变为激活状态。点击图标打开带有配置设置的对话框。\n\
  \n![Image](img/image-194.png) ![Image](img/image-195.png)\n\n图 6-40：小组件 Manage 选项卡\n\
  \nManage 选项卡的底部有一个工具栏，带有用于从面板添加 (+) 和移除 (-) 小组件的按钮、一个用于删除已启用项目的 `x`、删除所有小组件的 `Reset\
  \ all`（重置所有）按钮、用于更新已安装小组件的弯箭头，以及用于显示所选小组件信息的 `About`（关于）按钮。要安装小组件，点击其项右侧的小组件下载按钮（向下箭头）。小组件安装后，下载按钮将消失，随后在小组件项中出现勾号。小组件也会出现在\
  \ Manage 选项卡中。然后您可以选择它们并将它们添加到面板。某些第三方小组件可能需要额外的软件。当您尝试将它们添加到面板时，会收到需要安装的软件包。\n\n\
  Download（下载）选项卡底部的工具栏具有以下按钮：\"More info\"（更多信息，灯泡图标）、`Uninstall`（卸载）用于移除已安装的小组件、`Updates`（更新）用于更新已安装的小组件以及\
  \ `Refresh`（刷新）用于更新可用小组件列表。要查看有关所选小组件的更多信息，点击 `\"More info\"` 按钮打开网络浏览器访问描述该小组件的\
  \ Linux Mint 页面以及用户评论。Sort By 允许您按名称、评分（人气）和日期对列表进行排序。\n\n![Image](img/image-196.png)\n\
  \n![Image](img/image-197.png)\n\n图 6-41：小组件 \"Available applets (online)\" 选项卡\n\
  \n## Linux Mint 传统布局 (Traditional Layout)\n\nLinux Mint 的传统布局可以从欢迎界面的 First Steps\
  \ 选项卡选择，它使用了 Linux Mint 19 及更早版本中的许多显示功能。这里记录了一些显著特征。\n\n面板使用程序启动器（Program Launchers）而不是分组窗口列表，并带有不同的菜单。右侧的系统工具使用了传统的图标并包含了用户小组件。小组件中的开启开关有所不同。\n\
  \n面板左侧具有 Cinnamon 菜单、应用程序按钮和最小化窗口。右侧具有小组件，如时间、窗口菜单、电池、网络管理器和声音。\n\n![Image](img/image-198.png)\n\
  \n![Image](img/image-199.png)\n\n![Image](img/image-200.png)\n\n图 6-42：传统布局面板\n\n\
  \n\n\n\n面板启动器\n\n面板启动器小组件允许你从面板启动应用程序。面板启动器小组件已安装在 Linux Mint 面板的左侧，列出了 Firefox\
  \ Web 浏览器、终端和“文件”（Nemo 文件管理器、主文件夹）。点击应用程序图标即可启动它。将鼠标悬停在图标上会显示其名称。要显示对应用程序图标可以执行的操作菜单，请右键点击面板启动器小组件中的任何图标（参见图\
  \ 6-43）。该菜单包含“启动”、“添加”、“编辑”和“移除”项。“添加”和“编辑”项会打开一个对话框，你可以在其中手动输入或编辑应用程序名称和启动选项。“移除”项将从面板启动器小组件中移除应用程序图标。其他选项是根据应用程序进行定制的。Firefox\
  \ Web 浏览器有“在新窗口中打开”或“在私有窗口中打开”的选项。终端有一个打开新终端窗口的选项。文件管理器有主目录、计算机和垃圾桶文件夹的选项，并以主文件夹为默认。\n\
  \n![Image](img/image-201.png) ![Image](img/image-202.png) ![Image](img/image-203.png)\n\
  \n图 6-43：传统布局面板启动器小组件和菜单\n\n虽然你可以使用 Cinnamon 菜单注销、关机和访问系统设置，你也可以使用用户小组件（参见图 6-44）。用户小组件基于\
  \ Ubuntu 会话菜单设计，包含“锁定屏幕”、“切换用户”、“注销”和“关机”项。这是执行这些任务的非常快速的方法，无需显示 Cinnamon 菜单。点击名称会显示账户详细对话框，你可以在其中更改用户图标、全名和密码。在面板上，用户小组件显示一个人物图标。你可以配置小组件（右键点击它并选择“配置”）以也显示用户的全名。如果你愿意，可以在现代布局上安装用户小组件。\n\
  \n![Image](img/image-204.png)\n\n图 6-44：传统布局用户小组件\n\n传统布局在菜单中使用不同的开关，如图 6-45 所示的网络管理器小组件菜单所示。\n\
  \n![Image](img/image-205.png)\n\n图 6-45：传统布局开关\n\n# Nemo 文件管理器\n\nNemo 文件管理器支持复制、移除和删除项目的标准功能，以及设置权限和显示项目。文件管理器使用的名称为“文件”（Files），但实际程序名称仍为\
  \ `nemo`。\n\n### 主文件夹子文件夹和书签\n\n与 Ubuntu 一，Linux Mint 使用通用用户目录结构（[`freedesktop.org`](https://freedesktop.org)\
  \ 中的 `xdg-user-dirs`）在用户主目录中设置子文件夹。文件夹将包括`Documents`、`Music`、`Pictures`、`Downloads`\
  \ 和 `Videos`。这些本地用户文件夹被许多桌面应用程序默认。用户可以使用文件浏览器更改文件夹名称或将它们嵌套。例如，可以将 `Music` 移动到 `Documents`，即\
  \ `Documents/Music`。本地配置存储在 `.config/user-dirs.dirs` 文件中。系统级默认设置在 `/etc/xdg/user-dirs.defaults`\
  \ 文件中设置。这些文件夹的图标显示图 6-46 中。\n\n![Image](img/image-206.png)\n\n图 6-46：Nemo 文件管理器主文件夹\n\
  \n这些文件夹也是默认书签。你可以直接从 Nemo 窗口的侧边栏或书签菜单访问书签文件夹。你还可以通过打开文件夹并在书签菜单中选择“添加书签”为文件夹添加自己的书签。你的文件夹将出现在\
  \ Nemo 侧边栏的书签部分和书签菜单中。你可以使用文件管理器的书签对话框管理书签，通过书签菜单中的“编辑书签”可以访问。在这里，你可以移除书签或更改其名称和位置。\n\
  \n你可以在系统设置中的桌面对话框在桌面区域显示主目录、网络和垃圾桶文件夹等基本文件夹。\n\n#### 文件管理器窗口\n\n当你点击桌面上的主文件夹图标、面板启动器小组件上的文件夹图标或\
  \ Cinnamon 菜单收藏夹栏上的主文件夹图标时，会打开一个显示你的主文件夹的文件管理器窗口。文件管理器窗口显示多个组件，包括菜单栏、主工具栏和侧边栏（参见图\
  \ 6-47）。\n\n![Image](img/image-207.png)\n\n图 6-47：带有侧边栏的文件管理器\n\n侧边栏显示“我的电脑”、“书签”、“设备”和“网络”部分，显示你的文件系统和默认主文件夹子文件夹。书签和设备项只有在存在书签或连接了设备时才会出现。你可以通过选择“视图”菜单中侧边栏子菜单中的“显示侧边栏”项，或通过点击侧边栏下方状态栏上的隐藏按钮来显示或隐藏侧边栏。主面板（右侧）显示当前工作文件夹中的文件和文件夹图标或文件和文件夹列表。当你选择一个文件或文件夹时，底部的状态栏会显示信息。\n\
  \n注意：Nemo 可以作为 FTP 服务器工作。你可以使用文件顶栏上的连接服务器项输入 FTP 站点 URL。文件菜单有打开新标签页 (`Ctrl+t`)、打开新文件管理器窗口\
  \ (`Ctrl+n`)、创建新文件夹 (`Shift+n`)、连接远程服务器以及显示当前文件夹属性 (`Alt+Return`) 的选项。大多数都有快捷键（参见图\
  \ 6-45）。\n\n### 侧边栏\n\n文件管理器侧边栏显示你通常访问的文件系统位置：计算机文件夹（我的电脑）、设备（设备）和网络文件夹（网络）（参见图\
  \ 6-48）。选择文件系统项将你置于顶部。在我的电脑部分，你可以打开主文件夹、默认书签、根目录（文件系统）和垃圾桶。当你创建书签时，它会出现在书签菜单中。当你连接设备时，会出现设备子菜单并展开显示已连接的设备。设备有弹出按钮，你可以使用它们移除设备。你可以将所有菜单折叠为仅显示标题。\n\
  \n![Image](img/image-208.png)\n\n图 6-48：带有书签菜单的文件管理器侧边栏\n\n侧边栏有两种菜单视图：位置（Places）和树视图（Treeview）。你可以使用下方栏上的按钮在两者之间切换，此处所示。第三个按钮将隐藏侧边栏。\n\
  \n![Image](img/image-209.png)\n\n位置菜单有可展开菜单（参见图 6-49）。我的电脑菜单展开后显示主文件夹、默认书签、根目录（文件系统）和垃圾桶。当你创建书签时，它会出现在书签菜单中。当你连接设备时，会出现设备子菜单并展开显示已连接的设备。设备有弹出按钮，你可以使用它们移除设备。你可以将所有菜单折叠为仅显示标题。\n\
  \n![Image](img/image-210.png) ![Image](img/image-211.png) ![Image](img/image-212.png)\n\
  \n图 6-49：文件管理器侧边栏位置菜单，已展开和未展开状态\n\n\n\n\n树状视图显示了主文件夹和文件系统的可展开菜单（参见图 6-50）。你可以折叠它们，只显示其中一个。\n\
  \n![Image](img/image-213.png) ![Image](img/image-214.png)\n\n图 6-50：文件管理器侧边栏树状视图菜单，已展开和未展开状态\n\
  \n### 标签页\n\nNemo 文件管理器支持标签页，你可以在同一个文件管理器窗口中打开多个文件夹。要打开标签页，请从“文件”菜单中选择“新标签页”（参见图\
  \ 6-51\n\n图 6-51：带有标签页的文件管理器窗口\n\n### 显示文件和文件夹\n\n你可以以图标、紧凑列表或详细列表的形式查看目录内容，可以在主工具栏右侧的“视图”图标中选择：`icon`、`list`\
  \ 和 `compact`，如下所示。\n\n![Image](img/image-216.png)\n\n使用控制键快速更改视图：`Ctrl-1` 为图标，`Ctrl-2`\
  \ 为列表，`Ctrl-3` 为紧凑视图。列表视图提供名称、大小、类型和日期。主面板顶部会显示每个字段的按钮。你可以使用这些按钮根据该字段对列表进行排序。例如，要按日期排序文件，点击“修改日期”按钮；要按大小排序，点击“大小”按钮。再次点击可在升序和降序之间切换。\n\
  \n某些类型的文件图标将显示其内容的预览。例如，图像文件的图标将显示图像缩略图。文本文件将在图标中显示其文本的前几个字。你可以通过取消勾选文件管理器“视图”菜单中的“显示缩略图”选项来关闭缩略图。\n\
  \n“视图”菜单包含管理和排列文件管理器图标的条目（参见表 6-2）（参见图 6-52）。你可以选择 `Icons`、`List` 和 `Compact` 视图。在图标视图中，会出现“排列项目”子菜单，提供按名称、大小、类型和修改日期排序图标的选项。你也可以简单地反转顺序，或手动放置图标。\n\
  \n注意：当鼠标悬停在“文件”、“视图”和“编辑”菜单的项目上时，文件管理器窗口底部状态栏将显示该项目功能的简短描述。\n\n“放大”选项会放大你的窗口视图，使图标变大，“缩小”则减小视图，使其变小。“正常大小”将它们恢复为标准大小。你还可以使用\
  \ `Ctrl-+` 和 `Ctrl--` 键进行放大和缩小。\n\n| 菜单项目 | 说明 |\n| :--- | :--- |\n| Stop | 停止当前任务\
  \ |\n| Reload | 刷新文件和目录列表 |\n| Sidebar \\| Places, Tree | 在位置视图或树状视图中显示侧边栏。 |\n\
  | Sidebar \\| Show Sidebar | 显示带有设备、网络和书签项的侧边栏。 |\n| Main Toolbar | 显示主工具栏 |\n|\
  \ Menubar | 显示菜单栏 |\n| Status bar | 在文件夹窗口底部显示状态栏 |\n| Extra Pane | 在文件管理器窗口中打开双窗格，每个窗格显示不同的文件夹\
  \ |\n| Location | 打开文件夹路径名称的位置框 |\n| Reset View to Defaults | 默认视图和排序 |\n| Show\
  \ Hidden Files | 显示管理级点文件。 |\n| Show Thumbnails | 在此文件夹的图标视图中显示文件的缩略图。取消勾选此项将不显示缩略图。\
  \ |\n| Arrange Items: By Name, Size, Type, and Modification Date | 按指定标准排列文件和目录\
  \ |\n| Organize by Name | 在图标视图中，按名称排列图标 |\n| Reversed Order | 在列表视图中，反转文件列表顺序 |\n\
  | Zoom In | 提供图标的近距离视图，使其看起来更大。 |\n| Zoom Out | 提供图标的远距离视图，使其看起来更小。 |\n| Normal\
  \ Size | 将图标视图恢复为标准大小。 |\n| Icons | 显示图标 |\n| List | 显示带有名称、大小、类型和日期的文件列表。文件夹可展开。\
  \ |\n| Compact | 仅名称和小图标显示紧凑文件列表 |\n\n表 6-2：文件管理器视图菜单 |\n\n![Image](img/image-217.png)\
  \ ![Image](img/image-218.png) ![Image](img/image-219.png)\n\n图 6-52：文件管理器文件、视图和编辑菜单\n\
  \n### 文件管理器菜单和工具\n\n从“文件”菜单，你可以执行此类任务，如创建文件夹、显示新标签页、在新窗口中打开文件管理器、连接到服务器（参见表 6-3\
  \ 和图 6-45）。\n\n| 菜单项目 | 说明 |\n| :--- | :--- |\n| New Tab | 创建标签页 |\n| New Window\
  \ | 打开新窗口 |\n| Create New Folder | 在目录中创建子目录 |\n| Create New Document | 创建文档 |\n\
  | Connect to server | 使用文件管理器连接到 FTP |\n| Properties | 当前打开文件夹的属性 |\n| Close All\
  \ Windows | 关闭所有管理窗口 |\n| Close | 关闭文件管理器窗口。 |\n\n表 6-3：文件管理器文件菜单\n\n从“编辑”菜单，你可以粘贴剪切的文件以便在文件夹之间移动或复制它们，或者创建副本（参见表\
  \ 6-4）。选择菜单允许你选择所有文件、匹配正则表达式的文件夹并反转选择。你还可以书签文件夹、恢复丢失的文件并关闭文件管理器窗口。“属性”打开带有基本权限的文件夹属性。\n\
  \n| 菜单项目 | 说明 |\n| :--- | :--- |\n| Undo, Redo | 撤销或重做操作 |\n| Cut, Copy | 移动或复制文件或目录\
  \ |\n| Paste | 粘贴你已剪切的文件，以便在文件夹之间移动或复制。 |\n| Select All | 选择此文件夹中的所有文件 |\n| Select\
  \ Items Matching | 使用基本匹配快速搜索文件。 |\n| Invert Selection | 选择其他未选文件，取消当前选择。 |\n| Pin\
  \ | 固定文件夹或文件，使其出现在文件管理器窗口显示文件的开头或顶部 |\n| Duplicate | 创建所选文件的副本 |\n| Make Links |\
  \ 为文件或文件夹创建链接 |\n| Rename | 重命名所选的文件或文件夹 |\n| Copy to | 将文件或文件夹复制到默认书签之一 |\n| Move\
  \ to | 将文件或文件夹移动到默认书签之一 |\n| Move To Trash | 将文件夹移动到垃圾桶以后删除 |\n| Delete | 立即删除文件或文件夹。\
  \ |\n\n表 6-4：编辑菜单\n\n`Use Full Context Menu`：在右键菜单中添加 `copy to`、`move to` 和 `link`\
  \ 项。`Compress`：将选定的文件和文件夹压缩为 `tar`、`cpio`、`lmza` 或 `zip` 压缩文件。压缩文件可以密码保护。如果选择了文件夹，你还可以更改文件夹颜色。`Sharing\
  \ Options`：选中文件夹时激活。你可以选择在网络上共享该文件夹。`Preferences`：你的账户文件管理器偏好。\n\n\n\n\n# 表 6-4：文件管理器编辑菜单\n\
  \n在图标视图中，你可以点击文件管理器窗口主面板空白处的任何地方，即可显示弹出菜单，其中包含创建新文件夹、排列图标、缩放图标、显示隐藏文件以及打开文件夹属性对话框的选项（参见表\
  \ 6-5）。\n\n| 菜单项 | 说明 |\n| :--- | :--- |\n| 创建新文件夹 | 在目录中创建一个新的子目录。 |\n| 创建新文档 |\
  \ 创建一个文本文档。 |\n| 创建启动器 | 为应用程序创建启动器图标 |\n| 在终端中打开 | 在终端窗口中打开当前文件夹 |\n| 显示隐藏文件 |\
  \ 显示管理点文件（dot files）。 |\n| 粘贴 | 粘贴你已复制或剪切的文件。 |\n| 放大 | 提供图标的特视图，使其看起来更大。 |\n| 缩小\
  \ | 提供图标的远景视图，使其看起来更小。 |\n| 属性 | 打开目录的属性对话框 |\n| 正常大小 | 将图标视图恢复为标准大小。 |\n\n# 表 6-5：文件管理器弹出菜单\n\
  \n# 在文件管理器中导航\n\n文件管理器的操作类似于 Web 浏览器，使用同一个窗口显示已打开的文件夹。它维护了一个以前查看过的文件夹列表，你可以使用工具栏上的导航按钮（左侧）在该列表中来回移动（参见图\
  \ 6-53）。左箭头按钮将带回到上一个显示的文件夹，右箭头按钮将带到下一个显示的文件夹，向上箭头则回到父文件夹。从“转到”（Go）菜单，你可以执行相同的导航操作，还可以访问主、计算机、网络和垃圾箱文件夹（参见表\
  \ 6-6）。\n\n![Image](img/image-220.png) ![Image](img/image-221.png)\n\n图 6-53：文件管理器导航\n\
  \n当你打开一个新文件夹时，将使用同一个窗口显示它，你可以使用“前进”和“后后”箭头在之前打开的文件夹之间移动（主工具栏左上角）。当你打开子文件夹时，主工具栏会显示当前文件夹及其父文件夹的按钮（参见图\
  \ 6-47）。你可以点击文件夹按钮直接移动到该文件夹。点击主文件夹按钮左侧的箭头可以将列表展开到根目录，显示为一个带有硬盘图标的按钮。\n\n| 菜单项 |\
  \ 说明 |\n| :--- | :--- |\n| 打开父文件夹 | 移动到父文件夹 |\n| 后退 | 回到文件管理器窗口中查看的上一个文件夹 |\n| 前进\
  \ | 移动到文件管理器窗口中查看的下一个文件夹 |\n| 粘贴 | 粘贴你已复制或剪切的文件，让你可以在文件夹之间移动或复制文件，或创建副本。 |\n| 与另一窗格位置相同\
  \ | 如果你在窗口中打开了两个窗格，可以让两个窗格查看同一个文件夹 |\n| 主目录 | 移动到主文件夹 |\n| 计算机 | 移动到计算机文件夹，显示你的设备图标\
  \ |\n| 模板 | 移动到模板文件夹 |\n| 垃圾箱 | 打开垃圾箱文件夹查看已删除的文件和文件夹，这些内容是可以恢复的。 |\n| 网络 | 移动到网络文件夹，显示网络上连接的系统并打开远程文件夹。\
  \ |\n| 搜索文件 | 使用文件管理器窗口搜索文件和文件夹 |\n\n# 表 6-6：文件管理器“转到”菜单\n\n你也可以显示位置文本框而不是按钮，你可以在其中输入文件夹的位置，无论是在你的系统中还是在远程系统中（参见图\
  \ 6-54）。要显示位置文本框，按下 `Ctrl-l` 或点击主工具栏位置路径末尾的“位置”切换按钮。你也可以按 `F9` 或在“视图”（View）菜单上选择“位置”（`View`\
  \ | `Location`）。这些访问方法作为切换开关工作，可以让你在位置文本框和按钮路径之间来回移动。\n\n![Image](img/image-222.png)\n\
  \n![Image](img/image-223.png)\n![Image](img/image-224.png)\n\n图 6-54：展开和未展开的路径以及位置\n\
  \n使用侧边栏的“位置”（Places）视图访问你的书签文件夹、存储设备（USB、CD/DVD 光性和连接的硬盘）以及挂载的网络文件夹。在侧边栏的“我的计算机”部分，你可以访问你的主文件夹、垃圾箱、文件系统（根目录）以及你创建的其他书签。\n\
  \n要打开子目录，你可以双击其图标，或右键点击图标并从菜单中选择“打开”。要在新标签页中打开文件夹，选择“在新标签页中打开”。也可以点击文件夹来选择它，然后从“文件”（File）菜单中选择“打开”（`File`\
  \ | `Open`）。\n\n你可以通过点击书签打开侧边栏列出的任何文件夹或文件系统。你也可以右键点击书签显示菜单，其中包含“打开”、“在新标签页中打开”和“在新窗口中打开”的选项（参见表\
  \ 6-7。“在新窗口中打开”项是访问设备的快捷方式。可移动设备具有“弹出”选项。内置硬盘具有“卸载”选项。\n\n| 菜单项 | 说明 |\n| :--- |\
  \ :--- |\n| 打开 | 使用关联程序打开文件。目录将在文件管理器中打开。 |\n| 在新标签页中打开 | 在同一窗口的新标签页中打开文件夹。 |\n\
  | 在新窗口中打开 | 在独立的窗口中打开文件夹。 |\n|移除 | 从侧边栏移除书签。 |\n| 重命名 | 重命名。 |\n\n# 表 6-7：文件管理器侧边栏弹出菜单\n\
  \n## Nemo 文件管理器搜索\n\nNemo 文件管理器提供了从桌面或任何文件管理器访问的搜索工具。输入模式并按 `ENTER`。显示结果（参见图 6-55）。要记住搜索，点击搜索框右侧的星形按钮。要查看之前的搜索，右键点击此按钮。\n\
  \n![Image](img/image-225.png)\n\n图 6-55：Nemo 文件管理器搜索\n\n## 管理文件文件夹\n\n作为符合 GNOME\
  \ 标准的文件管理器，Nemo 支持复制和移动文件的桌面拖放操作。要移动文件或目录，像在 Windows 或 Mac 界面上从从一个目录拖到另一个。移动操作是\
  \ GNOME 中的默认拖放操作。要将文件复制到新位置，请在拖放时按下 `Ctrl` 键。\n\n| 菜单项 | 说明 |\n| :--- | :--- |\n\
  | 剪切复制 | 剪切并复制选中文件的选项。 |\n| 固定 | 固定文件或文件夹。 |\n| 重命名 (F2) | 重命名文件。 |\n| 创建链接 | 在同一文件夹中创建该文件的链接\
  \ |\n| 复制到 | 将文件复制到主目录、桌面或文件管理器窗口中另一个窗格显示的文件夹。 |\n| 移动到 | 将文件移动到主目录、桌面或文件管理器窗口中另一个窗格显示的文件夹。\
  \ |\n| 移动到垃圾箱 | 将文件移动到垃圾目录，稍后可以删除它。 |\n\n\n\n\n\n| 操作 | 说明 |\n| :--- | :--- |\n\
  | 删除 | 永久删除文件或文件夹 |\n| 发送 | 使用默认邮件应用程序通过文件文件 |\n| 压缩 | 使用 `File Roller` 归档文件 |\n\
  | 共享选项 | 显示文件夹共享对话框（Samba 和 NFS） |\n| 属性 | 显示属性对话框 |\n| 在终端中打开 | 在终端窗口中打开当前目录 |\n\
  | 以根用户身份打开 | 以管理员用户打开终端窗口 |\n\n表 6-8：文件和文件夹弹出菜单\n\n### 使用文件的弹出菜单\n\n你也可以通过右键点击文件图标并从出现的弹出菜单中选择你想要的操作，来对文件执行删除、重命名和创建链接的操作（请参见表\
  \ 6-8）。例如，要删除某项，请右键点击它并从弹出菜单中选择`移动到垃圾桶`。这将将其置在`垃圾桶`目录中，你稍后可以删除它。只有在`编辑` 菜单中勾选了“使用完整上下文菜单”时，某些条目才会出现。这些包括`移动到`、`复制到`和`创建链接`。要创建链接，请右键点击文件并从菜单中选择`创建链接`。这将创建一个以“链接”字样开头的新链接文件。\n\
  \n### 重命名文件\n\n要重命名文件，你可以右键点击文件图标并从弹出菜单中选择`重命名`条目，或者点击其图标并按`F2`功能键。图标的名称将被边框包围，封装在一个小型文本框中。你可以覆盖旧名称，也可以通过点击名称中的某个位置插入文本来编辑当前名称，并使用退格键删删除字符。你还可以通过在文件的`属性`对话框（`基本`选项卡）中输入新名称来重命名文件。Cinnamon\
  \ 还支持`快速重命名`，尽管该功能默认未启用。通过`快速重命名`，你可以双击图标下方的文件名并在中间暂停即可激活重命名过程。要开启此功能，请打开文件管理器`偏好`对话框（`编辑\
  \ | 偏好`）并选择`行为`选项卡。在`行为`部分，点击“两次带停顿点击以重命名项目”条目的复选框。\n\n### 分组文件\n\n你可以通过点击第一项然后在按住`shift`\
  \ 键的同时点击最后一项，或者通过点击并拖动鼠标通过你想选择的项目来选择一组文件和文件夹。要选择不连续的项，请在点击单个图标时按住`ctrl` 键。如果你想选择目录中的所有项目，请在`编辑`菜单中选择`全选`条目（`编辑\
  \ | 全选`）（`Ctrl-a`）。然后你就可以一次复制、移动或甚至删除多个文件。要选择名称中具有特定模式的项，请从工具菜单选择`选择匹配模式的项`以打开搜索框，你可以在其中输入模式（`Ctrl-s`）。使用\
  \ `*` 字符匹配部分模式，例如使用 `let` 来匹配所有包含“let” 模式的文件名。模式 `my*` 将匹配以“my” 模式开头的文件名，而 `*.png`\
  \ 将匹配所有 PNG 图像文件（点表示文件扩展名）。\n\n### 打开应用程序和文件的 MIME 类型\n\n你可以通过双击应用程序本身或用于该应用程序的数据文件在文件管理器启动任何应用程序。如果你想用特定应用程序打开文件，可以右键点击文件并选择`打开方式`条目之一。对于默认和可能的应用程序，将显示一个或多个`打开方式`条目，例如针对文本文件的“用\
  \ xed 打开”。如果所需的应用程序未列出，你可以选择`打开方式 | 其他应用程序`来打开一个列出所有可用应用程序的对话框。应用程序也支持拖放操作。你可以将数据文件拖到其关联的图标上（例如，在桌面上）；应用程序将使用该数据文件启动。\n\
  \n要更改或设置用于特定类型文件的默认应用程序，你需要打开文件的`属性`对话框并选择`打开方式`选项卡。在这里，你可以选择用于该类型文件的默认应用程序。将列出可能的应用程序，并组织为默认、推荐、相关和其他类别。点击你想更改为默认的某项，然后点击“设为默认值”按钮。一旦你选择了默认项，它将出现在该文件的`打开方式`列表中。\n\
  \n如果你想将应用程序添加到`打开方式`菜单中，请点击“显示其他应用程序”按钮以列出可能的应用程序。选择你想要的一个并点击`添加`按钮。如果`打开方式`选项卡上有一个你不希望在`打开方式`菜单项目中列出的应用程序，请右键点击它并选择`忘记关联`。\n\
  \n### 文件和目录属性\n\n在文件的`属性`对话框中，你可以查看文件的详细信息并设置选项和权限（参见图 6-56）。文件的`属性`对话框有三个选项卡：`基本`、`权限`和`打开方式`。文件夹将有一个额外的共享选项卡。`基本`选项卡显示详细信息，如类型、大小、位置和修改日期。类型是\
  \ MIME 类型，表示与其关联的应用程序类型。文件图标显示在顶部，带有一个显示文件名的文本框。你可以通过`名称` 文本框编辑文件名称。如果你想更改用于文件或文件夹的图标，点击名称旁边的图标以打开`选择图标`对话框。`/usr/share/pixmaps`\
  \ 目录持有当前的默认图像（点击侧边栏中的`pixmaps`）。点击图像查看右侧窗格。`权限`选项卡显示所有者、组和其他的读、写和执行权限。你可以在这里更改任何权限，只要该文件属于你。你可以使用下拉菜单配置所有者、组和其他的访问。你可以将所有者权限设置为只读或读/写。对于组和其他，条目增加了“无”选项以拒绝访问。点击组名将显示列出不同组的列表，允许你选择一个来更改文件的组。\n\
  \n`打开方式`选项卡对于文件列出所有与该类型文件相关的应用程序。你可以选择你想作为默认的某一个。这对于媒体文件可能特别有用，因为你可能希望某些文件使用特定的播放器，或为图片使用特定的图像查看器。\n\
  \n![图像](img/image-226.png)\n\n图 6-56：文件 中的文件属性\n\n某些类型的文件会有额外的选项卡，提供文件信息。例如，音频文件将有一个`音频`选项卡，列出音频类型以及任何其他信息，如歌曲标题或压缩方法。图像文件将有一个`图像`选项卡，列出分辨率和图像类型。\n\
  \n文件夹的`权限`选项卡的操作方式类似，但它包含两个访问条目：`文件夹访问`和`文件访问`。`文件夹访问`条目控制对文件夹的访问，选项包括无、列出文件、访问文件和创建删除文件。这些对应于赋予目录的读、读执行权限。`文件访问`条目允许你设置目录中所有文件的权限。它们与文件相同：对于所有者，读或读/写；对于组和其他，条目增加了“无”选项以拒绝访问。要相应设置目录中所有文件的权限（而不只是文件夹），点击“将权限应用于包含的文件”按钮。\n\
  \n\n\n\n\n文件夹的“共享”（Share）选项卡允许你将文件夹作为网络共享。如果你有 Samba 或 NFS，这些工具将允许你的文件夹和文件与其他系统上的用户共享。你可以指定共享的文件夹或文件是只读还是允许写入访问。要允许写入访问，请勾选“允许其他人在此文件夹中创建和删除文件”。要向所有用户开放访问，请勾选“来宾访问”（Guest\
  \ access）。\n\n## Nemo 首选项 (Nemo Preferences)\n\n你可以在“首选项”对话框中为 Nemo 文件管理器设置偏。可以通过任何\
  \ Nemo 文件管理器窗口的“编辑”菜单中选择“首选项”（`Edit | Preferences`）进入（参见图 6-57）。\n\n“视图”（Views）选项卡允许你选择文件的默认显示方式，如列表、图标或紧凑视图。你还可以为图标、紧凑和列表视图设置默认缩放级别。\n\
  \n“行为”（Behavior）允许你选择如何选择文件、管理垃圾箱以及处理脚本。\n\n“显示”（Display）允许你选择图标标题中显示的额外信息，如大小或日期。\n\
  \n“列表列”（List Columns）选项卡允许你选择在详细列表中显示的特征以及它们的显示顺序。除了已选择的名称、大小、日期和类型外，你还可以添加权限、组、MIME\
  \ 类型和所有者。\n\n“预览”（Preview）选项卡允许你选择是否在图标中显示小的缩略图内容，例如文本文件的开头文字。\n\n“工具栏”（Toolbar）选项卡允许你选择一些显示在工具栏上的图标，如搜索、刷新、计算机和主页。\n\
  \n“插件”（Plugins）选项卡允许你为 Nemo 添加新功能，例如如挂载归包和将图像文件设置为壁纸。\n\n![Image](img/image-227.png)\n\
  \n图 6-57: Nemo 文件管理器首选项\n\n### Nemo 插件与扩展\n\n你可以使用插件和扩展来增强 Nemo，例如用于文件夹共享选项的 `NemoShare`，以及允许你创建（压缩）和提取归包的“Nemo\
  \ Fileroller”。已安装的几个插件和扩展默认启用，并会在适当的菜单中显示条目。要添加更多扩展，请使用软件管理器安装 nemo 扩展和插件包。扩展和插件包具有前缀\
  \ `nemo-`，例如 `nemo-share` 和 `nemo-fileroller`。\n\n插件和扩展可以在 Nemo 首选项的“插件”选项卡中启用，可以通过“编辑”菜单（`Edit\
  \ | Plugins`）或快捷键 `Alt+p` 访问（参见图 6-58）。“操作”（Actions）是可以从桌面菜单（右键点击桌面任意空白区域）以及其他弹出的文件和文件夹菜单执行的任务。启用操作会将其列在菜单中。禁用它将将其从该菜单中移除。例如，启用“设置为壁纸”操作会在图像文件的弹出菜单中（右键点击图像文件）放置一个“设置为壁纸”条目。启用“添加桌面小部件”操作会在桌面弹出菜单中添加“添加桌面小部件”条目。“扩展”（Extensions）部分列出了已安装的扩展，如\
  \ `NemoShare` 和 `Nemo Fileroller`。启用的扩展复选框已勾选。点击复选框可以切换扩展的启用或禁用。如果你禁用或启用了一个扩展，必须重启\
  \ Nemo 才能更改生效。当你做出更改时，会出现一个按钮“扩展已更改。需要重启”。点击该按钮重启 Nemo。还有按钮允许你一次性禁用或启用操作和扩展。\n\n\
  ![Image](img/image-228.png)\n\n图 6-58: Nemo 插件与扩展\n\n你还可以将自己的操作文件和脚本文件添加到 `.local/share/nemo/`\
  \ 文件夹下的 actions 和 scripts 文件夹中。点击 actions 和 scripts 部分中的文件夹图标可以打开这些文件夹。脚本允许你添加自己的可执行文件。\n\
  \n## 系统设置 (System Settings)\n\n你可以使用“系统设置”对话框中列出的管理工具来配置桌面设置并执行大多数管理任务，该对话框可以通过“系统工具”菜单和“收藏””图标栏访问。系统设置将工具组织为外观（Appearance）、首选项（Preferences）、硬件（Hardware）和管理（Administration）类别（参见图\
  \ 6-59 并参见图 6-60）。某些工具调用从之前的版本提供的 Ubuntu 支持系统工具，如声音（PulseAudio）和打印机（system-config-printer）。其他工具使用\
  \ GNOME 3 配置和管理工具，如网络和电源管理。\n\n处理主要管理任务（管理部分）的设置（如用户和组、软件源和防火墙）将在处理这些主题的章节讨论。\n\n\
