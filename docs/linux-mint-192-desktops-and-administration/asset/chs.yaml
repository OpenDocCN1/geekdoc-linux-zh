  \ PC 指向另一台 PC。 |\n\n\n\n\n\n在“输出”（Output）选项卡中，你可以为选定的设备配置设置：数字、耳机和扬声器。可用设置将根据所选的设备和配置文件激活。从“输出配置文件”（Output\
  \ profile）菜单中，你可以选择可用的输出项（如果支持），例如模拟扬声器或环绕声。对于简单的模拟立体声输出（Analog Stereo Output），只有`Volume`音量和`Balance`平衡设置是处于激活状态（参见图\
  \ 8-16）。\n\n![Image](img/image-398.png)\n\n图 8-16：声音：输出\n\n支持模拟环绕声 7.1 或数字 SPDIF\
  \ 输出等多个接口的音频将在“输出配置文件”菜单中显示接口组合列表。`Fade`（淡出）和`Subwoofer`（低音）设置将被激活。从菜单中，你可以选择你所需的输出类型。为数字输出（S/PDIF）连接器配置数字输出，只需在`Output`（输出）和`Input`（输入）选项卡上选择数字输出和输入项即可。只有`Balance`项将处于激活。\n\
  \n笔记本电脑可能仅支持具有左右平衡的简单内部音频设备。具有更强大音频设备的计算机有更多选项。要测试扬声器，请点击“测试声音”按钮打开扬声器测试对话框，其中包含每个扬声器的测试按钮。\n\
  \n`Applications`（应用程序）选项卡将显示当前正在使用音频设备的应用程序。你可以为每个应用程序设置音量（参见图 8-17）。\n\n![Image](img/image-399.png)\n\
  \n图 8-17：声音：应用程序\n\n`Settings`（设置）选项卡设置所有应用程序音频控制的最大音量级（参见图 8-18）。这些控制项将根据`Settings`选项卡中的最大音量设置进行调整。范围将仅扩展到最大限制。你可以设置的最大值为\
  \ 150%。\n\n![Image](img/image-400.png)\n\n图 8-18：声音：设置\n\n安装 Pulse Audio 时会附带 Pulse\
  \ Audio 工具（`pulseaudio-utils` 包）。这些是用于管理 Pulse Audio 和播放音频文件的命令行工具（参见表 8-4）。`paplay`\
  \ 和 `pacat` 将播放音频文件，`pactl` 让你能够控制声音服务器，而 `pacmd` 让你重新配置它。查看每个工具的 Man 手页（帮助文档）以获取更多详情。如果你频繁更改声音偏好，可以在\
  \ shell 脚本中使用这些命令来执行更改，而无需每次都使用偏好对话框。这些某些命令（如 `parec` 和 `paplay`）是 `pacat` 命令的链接，由后者执行实际任务。\n\
  \n| 声音工具 | 说明 |\n| :--- | :--- |\n| pabrowse | 列出 PulseAudio 声音服务器 |\n| pacat |\
  \ 播放、录制和配置原始音频流 |\n| pacmd | 生成用于输入配置命令的 shell |\n| pactl | 控制 PulseAudio 服务器，更改输入和输出源并提供服务器信息\
  \ |\n| padsp | OSS 音频应用程序的 PulseAudio 封装 |\n| pamon | 指向 pacat 的链接 |\n| paplay |\
  \ 播放音频。`-d` 指定输出设备，`-s` 指定服务器，`--volume`选项设置音量（链接到 pacat） |\n| parec | 录制音频（链接到\
  \ pacat） |\n| parecord | 录制音频（链接到 pacat） |\n| pasuspender | 挂起 PulseAudio 服务器 |\n\
  | pax11publish | 访问 PulseAudio 服务器凭据 |\n\n表 8-4：PulseAudio 命令（命令行）\n\n### PulseAudio\
  \ 应用程序\n\n为了额外的配置功能，你还可以安装 Pulse Audio 应用程序。大多数应用程序的包名以 `pa` 开头。你可以从软件管理器中搜索 pulseaudio\
  \ 并安装它们。大多数 PulseAudio 工具都可以从“声音和视频”菜单访问。此处显示了 PulseAudio 工具及其命令名称。\n\nPulseAudio\
  \ 音量控制，`pavucontrol`\n\nPulseAudio 音量计，`pavumeter`\n\nPulseAudio 管理器，`paman`\n\n\
  PulseAudio 偏好，`paprefs`\n\n你可以使用 PulseAudio 音量控制工具为不同的播放应用程序和音频设备设置音量（在“声音和视频”菜单中选择\
  \ PulseAudio 音量控制）。\n\nPulseAudio 音量控制应用程序将显示五个选项卡：播放（Playback）、录制（Recording）、输出设备（Output\
  \ Devices）、输入设备（Input Devices）和配置（Configuration）（参见图 8-19）。播放选项卡显示所有当前使用 PulseAudio\
  \ 的应用程序。你可以单独为每个应用程序调整音量。\n\n![Image](img/image-401.png)\n\n图 8-19：PulseAudio 音量控制，播放\n\
  \n你可以使用输出设备面板在源源处设置音量控制，并选择不同的输出设备，如耳机（参见图 8-20）。输入和录制设备的音量在“录制”和“输入设备”选项卡上设置。配置选项卡允许你选择不同的设备配置文件，例如选择数字输出或\
  \ 5.1 环绕声。找到 SPDIF 输出的实际名称并不总是显而易见的。你可能需要在终端中运行 `aplay -L` 来查看系统上的数字输出名称。它将是带有 Digital\
  \ 的。\n\n你还可以使用 PulseAudio 音量控制将不同的应用程序（流）重定向到不同的输出（设备）。例如，你可以运行两个源，一个视频，一个音乐。视频可以通过一个设备指向耳机，音乐可以通过另一个设备指向扬声器，甚至指向另一台电脑。要将应用程序重定向到不同设备，请在播放选项卡中右键点击其名称。弹出菜单将列出可用设备并让你选择所需的。\n\
  \nPulseAudio 音量计工具将显示设备的实际音量。\n\n![Image](img/image-402.png)\n\n图 8-20：PulseAudio\
  \ 音量控制，输出设备\n\n使用 PulseAudio 配置工具配置网络访问。在这里允许网络访问、配置 PulseAudio 网络服务器并启用多播和同时输出。如果你连接到同样运行\
  \ PulseAudio 且允许访问其音频设备的 Linux 系统网络，它们的共享音频设备将列在偏好选项卡中，允许你访问它们。\n\n同时输出创建一个指向同一硬件设备的虚拟输出设备。这让你将两个源引导到同一个输出。通过\
  \ PulseAudio 音量控制，你可以将播放流引导到同一个输出设备，但使用虚拟设备作为一个的输出。这让你独立更改每个流的输出音量。你可以让音乐和语音指向同一个硬件设备，使用虚拟设备处理音乐，使用标准设备处理语音。然后你可以减小音乐流或提高语音流。\n\
  \n## dconf 编辑器\n\ndconf 编辑器为基于 GNOME 的桌面（Cinnamon 和 Mate）、GNOME 应用程序以及 X-Apps 应用程序提供了关键的基础配置选项（参见图\
  \ 8-21 你可以配置桌面和 GNOME 应用程序，例如 Cinnamon 和 Mate 文件管理器（nemo 和 caja）、GNOME 系统监视器以及 X-Apps。大多数选项涉及显示功能，例如\
  \ Xplayer 的默认选项、对话框的默认大小或是否显示应用程序的工具栏。\n\n\n\n\n使用 dconf 配置是在键（keys）上进行的，键可以是数字、复选框、文本以及列出可能选项的菜单。文本编辑支持鼠标点击并拖拽选择文本，并可以使用\
  \ `Ctrl-c`、`Ctrl-x` 和 `Ctrl-v` 进行复制、剪切和粘贴。输入即可插入，使用退格键删除。对于非常长的文本条目，会出现滚动条让你滚动该行。更改会立即生效。如果你犯了错，可以点击右下角的“设置为默认值”（Set\
  \ to Default）按钮重置为默认设置。\n\n![Image](img/image-403.png)\n\n图 8-21：dconf 编辑器\n\ndconf\
  \ 编辑器将键组织成架构（schemas），可以在侧边栏中作为展开的树结构进行访问。主要的架构有 `apps`、`ca`、`com`、`desktop`、`org`\
  \ 和 `system`。`org` 架构是你可以找到 Cinnamon 配置键的地方，其中包含 `desklets`、桌面、背景和 muffin 窗口 own\
  \ 子架构。这里还有 Mate 键（`org.mate`）和 gnome 应用键（`org.gnome`）。在 `com` 架构下，你会找到 `linuxmint`\
  \ 子架构，其中包含用于 Mint 菜单键的 `mintmenu` 子架构（`com.linuxmint.mintmenu`）。继续展开子架构，直到找到你需要的键，在这种情况下，为\
  \ `com.linuxmint.mintmenu`。\n\nGNOME 应用的键位于 `org.gnome`。大多数处理默认显示选项。\n\n# 9. 系统管理\n\
  \n大多数管理配置任务都会自动地为你完成。打印机、硬盘分区和显卡等设备会被检测并为你设置好。在某些情况下，你可能需要手动执行任务，例如添加新用户和安装软件。此类管理操作可以使用用户系统工具完成。大多数管理工具列在“管理”和“系统工具”菜单中。\n\
  \n| Linux Mint 管理工具 | 说明 |\n| :--- | :--- |\n| 软件管理器 | 使用在线仓库进行软件管理 |\n| 更新管理器 |\
  \ 使用 Linux Mint 仓库的更新工具 |\n| Synaptic 软件包管理器 | 使用在线仓库进行软件管理（Linux Mint 不再支持，可在 Universe\
  \ 仓库中可用） |\n| 网络管理器 | 检测、连接并配置你的网络接口 |\n| clock | GNOME 时间与日期工具 |\n| 用户和组 | 用户配置工具\
  \ |\n| users-admin | 较旧的用户和组配置工具，安装 gnome-system-tools。 |\n| system-config-printer\
  \ | 打印机配置工具 |\n| system-config-samba | 配置你的 Samba 服务器。支持用户级身份验证。 |\n| shares-admin\
  \ | 配置 NFS 网络支持，安装 gnome-system-tools |\n| gnome-language-selector | 选择使用的语言 |\n\
  | Gufw | 配置你的网络防火墙 |\n| FirewallD | FirewallD 防火墙守护进程 |\n| Deja-dup | 使用 rsync 的备份工具\
  \ |\n| Backup Tool | Linux Mint 备份工具 |\n\n表 9-1：Linux Mint 管理工具\n\n## 管理工具\n\n管理由一组专门的管理工具处理，例如用于用户管理和打印机配置的工具（参见\
  \ 表 9-1）。要访问基于桌面的管理工具，你需要以具有管理权限的用户身份登录。你在第一次安装 Linux Mint 时创建了该用户。可以从“管理”、“偏好”和“系统工具”菜单访问系统管理工具。在\
  \ Cinnamon 面上，你也可以从“系统设置”对话框访问工具。有用于设置日期、管理用户、配置打印机和安装软件的工具。“用户和组”允许你创建和修改用户。“打印”允许你安装和重新配置打印机。所有工具都提供了易用且直观的桌面界面。工具通过简单的描述性术语识别，而实际名称通常以\
  \ `admin` 或 `system-config` 等术语开头。例如，打印机配置工具列为“打印”，但其实际名称为 `system-config-printer`。\n\
  \nLinux Mint 使用 GNOME 管理工具、由 Red Hat Linux 支持的 Fedora 发行版适配的管理工具，以及由开源项目开发的独立工具。PolicyKit\
  \ 用于设备授权，Linux Mint 的软件管理器提供软件管理。打印管理工具是 Fedora 的 `system-config-printer`。病毒防护由第三方应用程序\
  \ ClamAV 处理。Synaptic 软件包管理器可用，但已不再支持。较旧的 GNOME 管理工具（如用户和组）也可用，但默认未安装（`gnome-system-tools`\
  \ 软件包）。\n\n许多配置任务也可以在命令行上处理，直接调用程序。要使用命令行，选择“管理”菜单中的“终端”项以打开一个带有命令行提示符的终端窗口。你需要管理权限，因此要在应用程序名称之前加上\
  \ `sudo` 命令。\n\n## 受控的管理访问\n\n要访问管理工具，你必须以具有管理权限的用户身份登录。你在安装期间创建的用户会被自动授予管理权限。以该用户登录。当你尝试使用管理工具时，会弹出一个对话框提示你输入用户密码。这是你所登录用户的密码。某些工具会在没有授权的情况下打开，但保持锁定状态，防止进行任何修改。这些工具可能有一个“解锁”按钮，你可以点击它以获得访问。你可以使用用户管理工具“用户和组”来授予或拒绝特定用户的管理权限。\n\
  \n要执行系统管理操作，你首先必须拥有执行管理任务的权限。有多种方法获得这种权限：登录为支持 sudo 用户、解锁管理工具进行访问（PolicyKit）以及以\
  \ root 用户登录。PolicyKit 是首选的访问方法并用于许多管理工具。`sudo` 授权访问方法在之前的 Linux Mint 版本中使用，现在仍用于许多任务，包括软件升级和安装。root\
  \ 用户访问仍被不推荐，但它提供了对系统的完整控制。\n\nPolicyKit：仅为特定应用程序以及拥有该应用程序管理权限的用户提供访问。这需要对特定应用程序进行配置供\
  \ PolicyKit 使用。Linux Mint 19.2 使用名为 `policykit-1` 的新 PolicyKit 版本（Linux Mint 仓库）。名为\
  \ `policykit` 的原始版本不再可用。\n\n**sudo** 和 `pkexec`：为任何应用程序提供完全管理授权。它实施了时间限制以降低风险。`pkexec`\
  \ 命令用于 Synaptic 软件包管理器等图形化管理工具。你仍然需要使用 `sudo` 执行任何 root 级别的 Linux 命令，例如将文件移动到管理目录或运行\
  \ `service` 命令启动或停止服务器。\n\n**root** 用户访问，`su`：提供对系统的完整直接控制。这是访问管理工具的传统方法。它在 Linux\
  \ Mint 中默认禁用，但可以启用。`su` 命令允许任何用户在知道 root 用户密码的情况下以 root 用户登录。\n\n\n\n\n\n# 以 root\
  \ 身份运行 nemo\n在 Cinnamon 桌面上（右键点击桌面），你可以选择“以 Root 身份打开”选项，以管理员（root）权限打开 Nemo 文件管理器。文件管理器窗口的工具栏下方会显示一个红色条，标题为“权限提升”（Elevated\
  \ Privileges）。此时你可以删除和修改任何系统文件。这仍然是最危险的访问方法，因为你可以很容易删除或更改关键系统文件和文件夹。删除操作是永久的，无法撤销。\n\
  \n## PolicyKit\nPolicyKit 控制对某些应用程序和设备的访问。它是授予用户直接访问的安全方法之一。PolicyKit 的配置和支持已经为你设置好。现在使用新版本的\
  \ PolicyKit `PolicyKit-1` 用于 PolicyKit 操作。这些操作的配置文件存储在 `/usr/share/polkit-1` 中。目前，还没有可以让你使用的桌面工具来配置这些设置。\n\
  \n注意：外部硬盘（如 USB 连接的硬盘）会自动挂载。\n\n如果你想更改某些操作（例如挂载内部硬盘）的授权设置，就会就会遇到困难。目前，你可以通过手动编辑\
  \ `/usr/share/polkit-1/actions` 目录下的配置文件来更改设置，但这样做是有风险的。要进行更改，首先必须知道要更改的操作以及要设置的权限。`polkit`\
  \ 的帮助页面列出了可能的授权。默认授权为针对任何人的 `allow_any`、针对控制台的 `allow_inactive` 以及仅针对活动控制台（用户登录）的\
  \ `allow_active`。这些授权可以设置为以下特定的值。\n\n| auth_admin | 仅限管理员用户，始终需要授权 |\n| :--- | :---\
  \ |\n| `auth_admin_keep` | 仅限管理员用户，授权保持短时间 |\n| `auth_self` | 需要用户授权 |\n| `auth_self_keep`\
  \ | 需要用户授权，授权保持短时间 |\n| yes | 始终允许访问 |\n| no | 绝不允许访问 |\n\n你需要知道要修改的 PolicyKit 操作和要编辑的文件。当你尝试使用应用程序时，在提示你输入密码的\
  \ PolicyKit 对话框中（展开“详情”箭头）列出了该操作。文件名将是操作名称的第一部分并加上后缀“policy”。例如，挂载内部硬盘的操作为：\n\n\
  `org.freedesktop.udisks2.filesystem-mount-system`\n\n其文件为：\n\n`org.freedesktop.udisks2.policy`\n\
  \n该文件位于 `/usr/share/polkit-1/actions` 目录。其完整路径为：\n\n`/usr/share/polkit-1/actions/org.freedesktop.udisks2.policy`\n\
  \n具有管理员权限的用户（如你的主用户）可以自动挂载硬盘上的分区。然而，没有管理员权限的用户在挂载分区之前需要使用管理员密码授权（参见图 9-13）。如果你想允许非管理员用户在无需授权请求的情况下挂载分区，则必须修改\
  \ `/usr/share/polkit-1` 目录下的 `org.freedesktop.udisks2.policy` 文件，将 `filesystem-mount-system`\
  \ 操作的 `allow_active` 默认值从 `auth_admin_keep` 改为 `yes`。`auth_admin_keep` 需要管理员授权。\n\
  \n输入以下内容来编辑 `/usr/share/polkit-1/actions` 目录下的 `org.freedesktop.udisks2.policy`\
  \ 文件：\n\n```bash\nsudo xed /usr/share/polkit-1/actions/org.freedesktop.udisks2.policy\n\
  ```\n\n找到标记为如下的 `action` `id`：\n\n```xml\n<action id =\"org.feedesktop.udisks2.filesystem-mount-system\"\
  >\n<description>在系统设备上挂载文件系统</description>\n```\n\n这通常是第二个 action id。在该操作部分的末尾，你会发现以下条目。它位于默认子部分\
  \ `<defaults>` 之中。\n\n```xml\n<allow_active>auth_admin_keep</allow_active>\n```\n\
  \n将 `auth_admin_keep` 替换为 `yes`。\n\n```xml\n<allow_active>yes</allow_active>\n```\n\
  \n保存文件。非管理员用户将不再需要输入密码即可挂载分区。\n\n## sudo\n`sudo` 服务为特定用户提供管理员权限。你必须是系统上具有有效用户名和密码的用户，且该密码已获得\
  \ sudo 服务授权进行管理员访问。这允许其他用户执行特定的超级用户操作，而无需具有完全的管理员级控制权。你可以在 [`www.sudo.ws`](https://www.sudo.ws)\
  \ 更多关于 `sudo` 的信息。\n\n**提示：如果你在系统配置方面遇到困难，请检查 Linux Mint 论坛和社区网站可能的解决方案，[`forums.linuxmint.com`](https://forums.linuxmint.com)\
  \ 和 [`community.linuxmint.com`](https://community.linuxmint.com)。**\n\n### sudo\
  \ 命令\n某些管理员操作需要从终端窗口的命令行访问。对于此类操作，将使用 `sudo` 命令。你可以从“应用程序”菜单打开终端窗口。在 Cinnamon 桌面上，你可以点击面板上的终端图标或\
  \ Cinnamon 菜单中收藏栏上的终端图标。\n\n要使用 `sudo` 运行管理员命令，需要在命令前加上 `sudo` 命令。系统会提示你输入密码。你将获得一个受时间限制的票据。使用\
  \ `sudo` 运行管理员命令，只需在命令前加上 `sudo` 命令。以下示例使用 `date` 命令设置系统。\n\n```bash\nsudo date\
  \ 0465908\n```\n\n你还可以使用 `sudo` 命令运行具有管理员权限的应用程序。在终端窗口中，你会输入应用程序名称。例如，要使用 `nano`\
  \ 编辑器编辑 `/fstab`，可以使用：\n\n```bash\nsudo nano /fstab\n```\n\n### sudo 配置\n`sudo`\
  \ 访问由 `/etc/sudoers` 文件控制。该文件列出了用户及其可以运行的命令以及密码。如果设置了 `NOPASSWD` 选项，则用户不需要密码。`ALL`\
  \ 选项取决于上下文，指的是所有主机、所有命令或所有用户。详细信息请参 `sudoers` 的帮助页面。\n\n```bash\nman sudoers\n```\n\
  \n要进行更改或添加条目，必须使用特殊的 sudo 命令 `visudo`。这将调用 `nano` 编辑器（见第 5 章）编辑 `/etc/sudoers` 文件。与标准编辑器不同，`visudo`\
  \ 会锁定 `/etc/sudoers` 文件并检查你的语法。除非语法正确，否则不允许保存更改。如果你想使用不同的编辑器，可以将其赋值给环境变量 `EDITOR`。使用\
  \ Ctrl-x 退出并使用 Ctrl-o 保存。务必使用 `sudo` 命令调用 `visudo` 以获得授权访问。\n\n```bash\nsudo visudo\n\
  ```\n\n`sudoers` 条目具有以下语法：\n\n`user host=command`\n\n`host` 是你网络上的主机。你可以使用 `ALL`\
  \ 项指定所有主机。`command` 可以是命令列表，某些或所有命令根据是否需要密码等选项进行限定。要指定所有命令，也可以使用 `ALL` 项。以下赋予用户\
  \ george 在所有主机上对所有命令的 root 权限：\n\n`george ALL = ALL`\n\n此外，你可以允许用户在给定主机上作为另一个用户运行。此类替代用户放在命令前的括号内。例如，如果你想让\
  \ `george` 在 `beach` 主机上作为用户 `mydns` 运行，使用以下：\n\n`george beach = (mydns) ALL`\n\n\
  为了让 `robert` 在所有主机上访问时间工具，你可以使用\n\n`robert ALL=/usr/bin/time-admin`\n\n\n\n\n[content]\n\
  \n要指定组名，请在组名前前加上 `%` 符号，例如 `%mygroup`。这样，你就可以为一组用户提供相同的访问权限。默认情况下，`sudo` 将向 `admin`\
  \ 组中的所有用户授予访问。这些是由用户授予的管理员权限。`ALL=(ALL) ALL` 条目允许管理组的用户以所有用户的身份在所有主机上执行所有命令。\n\n\
  ```\n%admin ALL=(ALL) ALL\n```\n\n通过 `NOPASSWD` 选项，你可以允许特定组的成员无需密码即可访问。`/etc/sudoers`\
  \ 文件中提供了一个被注释的 `sudo` 组。\n\n```\n%sudo ALL=NOPASSWD: ALL\n```\n\n虽然在 Linux Mint\
  \ 上，`sudo` 被配置为允许 `root` 用户访问，但 Linux Mint 并没有创建 `root` 用户密码。这阻止了你以 `root` 用户身份登录，导致\
  \ `sudo` root 权限变得毫无意义。默认的 `/etc/sudoers` 文件确实配置了 `root` 用户对所有命令的完全访问权限。`ALL=(ALL)\
  \ ALL` 条目允许 root 以所有用户的身份在所有主机上执行所有命令。如果你为 root 用户设置了 root 密码，那么 root 用户就可以登录并拥有完全的管理员权限。\n\
  \n```\nroot ALL=(ALL) ALL\n```\n\n如果你想查看你可以运行哪些命令，可以使用带有 `-l` 选项的 `sudo` 命令。`-U`\
  \ 选项指定特定用户。在示例中，用户 `richard` 拥有完全的管理员权限。\n\n```\n$ sudo -U richard -l\n```\n用户 richard\
  \ 可在此主机上运行以下命令：\n\n```\n(ALL) All\n```\n\n### pkexec\n\n你可以使用 `pkexec` 命令代替 `sudo`\
  \ 来以管理员权限运行图形化应用程序。`pkexec` 工具是 `sudo` 的 policykit 替代方案，它要求你的应用程序具有相应的 policykit\
  \ action 文件。像用户账户、Udisks 和 `NetworkManager` 这样的应用程序已经有了 action 文件。其他像 `Xed` 的程序则没有。要配合\
  \ `Xed` 使用 `pkexec`，你必须为它创建一个 policykit action 文件。这是一个简单的过程，只需从 `pkexec` 手页示例中复制大部分条目即可。askubuntu\
  \ 网站（[`askubuntu.com`](https://askubuntu.com））也提供了关于如何执行此的详细说明（搜索“pkexec”并打开“How\
  \ to configure pkexec”条目）。`pkexec` 工具将提示你输入密码（参见图 9-1）。\n\n![Image](img/image-404.png)\n\
  \n图 9-1: pkexec 安全访问提示\n\n你可以在终端窗口中输入带有参数的 `pkexec` 命令，或者设置一个以 `pkexec` 为命令的应用程序启动器。以下示例将以管理员权限启动\
  \ `Xed` 编辑器，允许你直接编辑系统配置文件（参见图 9-2）。工具栏下方的红色条会显示“提升消息”（Elevated Messages）通知，让你知道你正在以管理员权限运行\
  \ `Xed` 编辑器。\n\n```\npkexec xed\n```\n\n为 `Xed` 等应用程序设置策略文件的方法是复制 `pkexec` 手页中的示例。将示例条目更改为\
  \ `xed`。对于消息条目，你只需要一条简单的消息。确保在末尾添加 `annotate` 行以允许桌面访问，并将 `exec.allow_gui` 选项设置为\
  \ true。\n\n```xml\n<annotate key=\"org.freedesktop.policykit.exec.allow_gui\">true</annotate>\n\
  ```\n\n或者，你只需复制一个简单的策略文件，更改名称并编辑它以替换程序名称和消息（例如，位于 `/usr/share/polkit-1/actions`\
  \ 目录下的 `com.ubuntu.pkexec.synaptic.policy` 副本）。务必在终端窗口中使用 `sudo` 命令配合 `cp` 命令执行复制。\n\
  \n```\nsudo cp com.ubuntu.pkexec.synaptic.policy  org.freedesktop.policykit.pkexec.xed.policy\n\
  ```\n\n编辑该文件并将 `synaptic` 替换为 `xed`，更改消息。\n\n以下是 `Xed` 的策略策略文件。\n\n```\norg.freedesktop.policykit.pkexec.xed.policy\n\
  ```\n\n```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<!DOCTYPE policyconfig\
  \ PUBLIC\n\"-//freedesktop//DTD PolicyKit Policy Configuration 1.0//EN\"\n\"http://www.freedesktop.org/standards/PolicyKit/1/policyconfig.dtd\"\
  >\n<policyconfig>\n<action id=\"org.freedesktop.policykit.pkexec.xed\">\n<description>运行\
  \ Xed 程序</description> <message>需要身份验证才能运行 xed 以编辑系统文件</message>\n<icon_name>xed</icon_name>\n\
  <defaults> <allow_any>auth_admin</allow_any>\n<allow_inactive>auth_admin</allow_inactive>\n\
  <allow_active>auth_self_keep</allow_active>\n</defaults> <annotate key=\"org.freedesktop.policykit.exec.path\"\
  >/usr/bin/xed</annotate>\n<annotate key=\"org.freedesktop.policykit.exec.allow_gui\"\
  >true</annotate>\n</action> </policyconfig>\n```\n\n![Image](img/image-405.png)\n\
  \n图 9-2: 使用 pkexec 调用 Xed\n\n### root 用户访问：root 和 su\n\n你可以通过 `sudo` 命令从任何终端窗口访问\
  \ `root` 用户。Superuser（超级用户）是 root 的另一个名称。`su` 命令也可用于登录任何用户，只要你有该用户的密码。\n\n```\n\
  su root\n```\n\n```\nsu\n```\n\n```\nsu richard\n```\n\n要退出 `su` 登录操作，只需输入 `exit`。\n\
  \n```\nexit\n```\n\n可以使用 `sudo` 命令激活 root 用户。以下登录了 root。\n\n```\nsudo su\n```\n\n\
  与 Ubuntu 一样，Linux Mint 设计为不允许直接以 root 用户身份登录。尽管存在 `root` 用户，但没有定义 `root` 用户密码。通过\
  \ `passwd` 命令激活 root 用户。\n\n```\nsudo passwd\n```\n\n系统会提示你输入管理员密码，然后由 `passwd`\
  \ 命令提示你重复密码。\n\n```\nEnter new UNIX password:\nRetype new UNIX password:\npasswd:\
  \ password updated\n```\n\n现在可以使用 `su` 命令作为 root 登录。由于超级用户有权更改任何内容，此类密码通常是经过保管的秘密，频繁更改，并且只提供给负责管理系统的人。\n\
  \n### Cinnamon 桌面上的具有提升权限的 Nemo\n\n在 Cinnamon 桌面面上编辑系统文件最简单的方法是以提升权限打开 Nemo 文件管理器，这本质上是打开了一个具有\
  \ root（管理员）权限的文件管理器窗口。要编辑 `/etc` 目录下的配置文件，你可以使用文件管理器访问 `/etc` 目录，然后双击文件使用 `Xed`\
  \ 编辑器打开它。这将以管理员权限在 `Xed` 中打开文件，让你轻松修改。导航栏下方的红色条会显示“提升权限”（Elevated Privileges）通知，让你知道你正在以管理员权限运行文件管理器。要以提升权限打开文件管理器，打开桌面菜单（右键点击桌面）并选择“以\
  \ root 打开”（Open as Root）条目（参见图 9-3）。\n\n![Image](img/image-406.png)\n\n图 9-3: 具有提升权限的\
  \ Nemo 文件管理器（作为 root）\n\n[/content]\n\n\n\n要执行此操作，你必须是具有管理员权限的用户（而非标准用户）。系统首先会提示你输入密码（请参见图\
  \ 9-4）。点击侧边栏中的 `File System`（文件系统）项将你进入根目录，在其中你可以访问系统文件夹和文件（参见图 9-3）。\n\n![Image](img/image-407.png)\n\
  \n图 9-4：以 root 身份打开文件管理器的提示（管理员权限）\n\n你可以添加或删除系统文件夹和文件。请务必小心你执行的操作。非常很容易使用文件管理器操作来删除关键系统文件夹和文件，这将对你的系统造成灾难性的后果。删除操作是永久的，无法撤销。同时，如果你足够小心并且知道你想做什么，有一种简单的方法可以编辑系统配置文件。在图\
  \ 9-5 中，用户打开了 `/etc/default` 文件夹中的 grub 配置文件，可以直接进行编辑。当通过高权限从文件管理器调用时，`Xed` 编辑器具有管理员权限，使其能够更改系统文件。工具栏方的红条显示“Elevated\
  \ Messages”（提升消息）通知，以便让你知道你正在以管理员权限运行 `Xed` 编辑器。\n\n![Image](img/image-408.png)\n\
  \n图 9-5：从以 root 身份打开的文件管理器编辑系统文件\n\n## /etc/hostname 和 hostnamectl\n\n`/etc/hostname`\
  \ 文件包含你的主机名。你可以在终端窗口中使用 `hostnamectl` 命令显示当前的主机名以及与其相关的所有信息，例如机器 ID、使用的内核、架构、机箱（计算机类型）和操作系统（如果你需要，可以添加\
  \ `status` 选项）。系统支持三种类型的主机名：静态（static）、漂亮（pretty）和瞬态（transient）。你可以使用 `hostnamectl`\
  \ 的 `set-hostname` 命令配合相应的类型设置每一个。静态主机名用于在网络上识别你的计算机（通常是完全限定域名）。你可以使用 `--static`\
  \ 选项来设置它。漂亮主机名是提供给计算机上用户的描述性主机名。可以通过 `set-hostname` 配合 `--pretty` 选项设置。瞬态主机名是由 DHCP\
  \ 等网络服务分配的，可以使用 `--transient` 选项进行管理。如果不带选项，`set-hostname` 命令将该名称应用到所有主机名类型。\n\n\
  ```\nhostnamectl set-hostname --pretty \"my computer\"\n```\n\n`set-chassis` 命令设置计算机类型，可以可以是台式机、笔记本电脑、服务器、平板电脑、手机和\
  \ vm（虚拟机系统）。如果没有指定类型，它将恢复到系统的默认设置。`set-icon-name` 命令设置图形化应用程序用于主机的名称。\n\n## 用户和组\
  \ (cinnamon-settings-users)\n\n在 Cinnamon 桌面上，你可以通过“管理”菜单以及“系统设置”对话框访问“用户和组”工具来配置和创建用户和组。“用户和组”是\
  \ Cinnamon 桌面上提供的 `cinnamon-settings-users` 工具。该工具提供了对用户和组的控制。\n\n![Image](img/image-409.png)\
  \ ![Image](img/image-410.png)\n\n图 9-6：用户和组 (Cinnamon)\n\n“用户和组”对话框显示两个选项卡：用户（Users）和组（Groups）。“用户”选项卡显示两个面板：左侧是可滚动的用户列表面板，显示他们的图标和登录名；右侧面板显示所选用户的信息（参见图\
  \ 9-6）。左侧面板下方是添加和删除用户的按钮。\n\nPolicyKit 控制管理员权限。当你首次启动“用户和组”时，会弹出一个对话框要求你输入密码。权限仅授予管理员（管理员账户类型）用户。一旦“用户和组”对话框出现，你就可以添加或删除用户，并更改任何现有用户的密码、名称、用户组、账户类型和图片。\n\
  \n当你添加新账户时，会打开一个对话框让你设置账户类型（标准或或管理员）、用户全名和用户名（参见图 9-7）。点击“添加”（Add）创建用户。新账户出现在右侧面板中，显示名称、图标、账户类型、密码和组。\n\
  \n![Image](img/image-411.png)\n\n图 9-7：用户和组：新用户\n\n在指定密码之前，账户将保持非活动状态（参见图 9-8）。密码输入框显示“No\
  \ password set”（未设置密码）。点击密码框打开“更改密码”对话框，你可以在其中输入新密码（参见图 9-9）。“显示密码”（Show password）复选框让你看到密码。一旦选择了密码，账户就会被启用。\n\
  \n![Image](img/image-412.png)\n\n图 9-8：用户和组：非活动用户\n\n要选择图标，点击图标图像打开图标选择菜单。选择你想要的即可。\n\
  \n\n\n\nPolicyKit 控制 `users-admin` 工具的管理访问。当你首次点击任务按钮（如 `Add` 添加、`Delete` 删除或 `Advanced\
  \ Settings` 高级设置）时，将打开身份验证对话框并提示输入用户密码。如果你点击 `Change` 链接更改用户密码、账户类型或名称，系统也会提示你进行身份验证。\n\
  \n要更改用户的设置，请在 `User Settings` 窗口中选择该用户。在右侧面板中，列出了用户名、账户类型和密码访问，每个右侧都有一个 `Change`\
  \ 链接。点击 `Change` 链接即可更改该属性。当你点击 `Change` 链接时，身份验证对话框会提示你输入管理用户的密码。要更改用户名，点击用户名右侧的\
  \ `Change` 链接打开“更改用户名和登录”对话框，其中有一个用于输入新名称的文本框。\n\n要更改用户密码，你需要点击 `Password` 条目右侧的\
  \ `Change` 链接打开“更改用户密码”对话框，其中包含当前密码和新密码的输入项（参见图 9-14）。你也可以选择生成随机密码。\n\n![Image](img/image-418.png)\n\
  \n图 9-14：用户设置：更改用户密码对话框\n\n![Image](img/image-419.png)\n\n图 9-15：用户设置：更改账户类型\n\n\
  账户类型可以是 `Administrator` 管理员、`Desktop User` 桌面用户或 `Custom` 自定义。当你点击 `Account type`\
  \ 的 `Change` 链接时会打开“更改用户账户类型”对话框，并提供相应的选项（参见图 9-15）。\n\n若需更详细的配置，你可以点击 `Advanced\
  \ Settings` 按钮打开“更改高级用户设置”对话框，该对话框有 `Contact Information` 联系信息、`User Privileges`\
  \ 用户权限和 `Advanced` 高级选项卡（参见图 9-16）。在 `Contact` 选项卡上，如果你需要，可以添加基本的联系信息，如办公地址以及工作和家庭电话。\n\
  \n在 `User Privileges` 选项卡上，你可以控制设备访问和管理权限（参见图 9-13）。你可以限制或允许对 `CD-ROMs`、`scanners`\
  \ 以及如 `USB drives` 等外部存储设备的访问。你还可以决定用户是否可以执行管理任务。\n\n`Advanced` 选项卡允许你选择主目录、使用的\
  \ shell、主组和用户 ID。系统已为你选择了默认值。指定了以新用户命名的主目录，且使用的 shell 是 `BASH`。通常情况下你不需要更改这些设置，尽管你可能喜欢使用不同的\
  \ shell，例如 `C-Shell`。对于组，用户拥有一个与其用户名（（短名）相同的组。\n\n![Image](img/image-420.png)\n\n\
  图 9-16：用户和组：更改用户权限\n\n如果你决定删除用户，系统会提示你是保留还是删除该用户的主目录及其文件。\n\n### 新用户（用户和组）\n\n要创建新用户，点击\
  \ `Users Settings` 窗口中的 `Add` 按钮打开“创建新用户”对话框，你可以在其中输入用户名。系统会使用用户的名字和姓氏的首字母为你自动输入一个短名。如果你愿意，可以更改短名，但它必须是小写字母。短名也是新用户主组的（参见图\
  \ 9-17）。随后，新用户会被添加到 `User Settings` 窗口中。\n\n接着会显示“更改用户密码”对话框，包含新密码和确认的输入项。你也可以选择使用随机生成的密码代替（参见图\
  \ 9-18）。点击 `Generate` 按钮生成密码。\n\n如果你决定不输入密码（点击 `Cancel`），该账户将保持禁用状态。若要在稍后启用它，请点击\
  \ `Enable Account` 按钮打开“更改用户密码”对话框，你可以在其中添加密码。\n\n![Image](img/image-421.png)\n\n\
  图 9-17：用户和组：创建新用户\n\n![Image](img/image-422.png) ![Image](img/image-423.png)\n\n\
  图 9-18：用户和组：新用户密码\n\n账户类型初始设置为 `Desktop user`，以限制新用户的访问。如果你想为该用户启用管理权限，请点击 `Account\
  \ type` 条目右侧的 `Change` 链接打开“更改用户账户类型”对话框，在其中你可以将账户类型更改为 `Administrator`（参见图 9-15）。要设置更具体的权限以及如主目录和用户\
  \ ID 等关键用户配置设置，请点击 `Advanced Settings` 按钮打开“更改高级用户设置”对话框，其中包含 `Contact Information`、`User\
  \ Privileges` 和 `Advanced` 选项卡（参见图 9-16）。\n\n此外，你可以在终端窗口或命令行中使用 `useradd` 命令来添加用户和组，并使用\
  \ `userdel` 命令来删除它们。\n\n```bash\nuseradd dylan\n```\n\n### （用户和组）\n\n要管理组，点击 `Users\
  \ Settings` 窗口中的 `Manage Groups` 按钮。这会打开 `Group Settings` 窗口，列出所有组（参见图 9-19）。要从组中添加或删除用户，点击\
  \ `Group Settings` 窗口中的组名并点击 `Properties`。\n\n![Image](img/image-424.png)\n\n图 9-19：用户和组：组设置\n\
  \n要添加新组，点击 `Group Settings` 窗口中的 `Add` 按钮打开 `New Group` 对话框，你可以在其中指定组名、其 ID 并选择要添加到组的用户（参见图\
  \ 9-20）。如果你想删除一个组，只需在 `Group Settings` 窗口中选择该条目并点击 `Delete` 按钮即可。\n\n![Image](img/image-425.png)\n\
  \n图 9-20：组属性：用户面板\n\n### 密码\n\n更改密码最简单的方法是使用 `System Settings` 和 `Administration`\
  \ 菜单中的 `Users and Groups` 对话框。选择你的用户名，然后点击 `Password` 标签右侧的按钮打开“更改密码”对话框（参见图 9-7）。\n\
  \n或者，你可以使用 `passwd` 命令。在终端窗口中输入 `passwd` 命令。命令会提示你输入当前密码。输入当前密码并按回车后，系统会提示你输入新密码。输入新密码后，要求你再次输入一遍。这可以确保你确实输入了想要输入的密码。\n\
  \n```bash\npasswd Changing password for richard.\n(current) UNIX password:\nEnter\
  \ new UNIX password:\nRetype new UNIX password:\npasswd: password updated successfully\n\
  ```\n\n## 管理服务\n\n许多管理功能作为需要开启的服务运行（参见第 13 章）。它们是守护进程，持续运行并检查服务请求。当你安装一个服务时，其守护进程通常会自动开启。你可以从终端窗口使用\
  \ `systemctl` 命令配合服务名称以及 `start`、`stop`、`restart` 和 `status` 命令来启动、停止和重启服务。`status`\
  \ 命令会告诉你是某服务是否正在运行。若要重启 Samba 文件共享服务器 (`smbd`)，你需要使用以下命令。\n\n```bash\nsudo systemctl\
  \ restart smbd\n```\n\nLinux Mint 和 Ubuntu 使用 systemd 来管理服务。Systemd 服务通过 `/lib/systemd/system`\
  \ 和 `/etc/systemd/system` 目录下的 `.service` 配置文件进行管理。\n\n\n\n\n在 Linux Mint 上可以轻松访问各种文件系统。你系统中的任何额外的内部硬盘分区（无论是\
  \ Linux 还是 Windows `NTFS`）都会被自动检测，但不会被挂载。此外，你还可以访问远程 Windows 共享文件夹，并让你的共享文件夹可被访问。\n\
  \n### 访问内部 Linux 文件系统\n\nLinux Mint 会自动检测所有内部硬盘上的其他 Linux 文件系统（分区）。这些分区的条目显示在文件管理器侧边栏的“计算机”部分。初始状态下，它们未被挂载。管理员用户可以通过点击其条目或图标来挂载内部分区，这将挂载文件系统并在桌面上显示其图标。随后会打开文件管理器窗口，显示文件系统的顶层内容。文件系统被挂载在\
  \ `/media` 目录下，文件夹名称使用文件系统（分区）标签命名；或者如果没有标签，则使用设备 UUID 名称命名。\n\n非管理员用户（你使用标准账户类型创建的用户）除非使用管理员用户密码对任务进行验证，否则无法挂载内部分区。会弹出一个授权窗口。你会被要求从下拉菜单中选择一个具有管理员权限的用户，然后输入该用户的密码。如果只有一个管理员用户，则该用户会被选中，并提示你输入该用户的密码。每当标准用户再次登录时，该用户仍然必须挂载文件系统并再次提供授权。\n\
  \n### 访问本地驱动器上的 Windows NTFS 文件系统\n\n如果你在带有 Windows 的双启动系统中安装了 Linux Mint，系统会自动安装\
  \ Linux `NTFS` 文件系统支持。你的 `NTFS` 分区使用用户空间文件系统 (`FUSE`) 进行挂载。用于 Linux 文件系统的相同身份验证控制也适用于\
  \ `NTFS` 文件系统。NTFS 分区的条目放置在文件管理器侧边栏的“设备”部分，并带有一个用于挂载和卸载文件系统的弹出按钮。如果你是具有管理员权限的用户，文件系统将被挂载（点击文件管理器侧边栏上的卸载按钮）。如果你是不具有管理员权限的用户，将会被要求从下拉菜单中选择一个具有管理员权限的用户，然后输入该用户的密码以提供授权。随后挂载\
  \ `NTFS` 文件系统，图标显示在启动器（Launcher）上。你可以通过点击桌面图标或文件管理器侧边栏“设备”部分中的条目来访问文件系统。分区将挂载在 `/media`\
  \ 目录下，并使用它们的 UUID 编号或标签作为文件夹名称。`NTFS` 分区使用 `ntfs-3g` 驱动挂载。\n\n### 访问本地网络共享文件系统 (Windows)\n\
  \n连接到你本地网络的任何计算机上的共享 Windows 文件夹和打印机都可以从任何文件管理器窗口侧边栏的“网络”自动访问。DNS Discovery 服务 (`Avahi`)\
  \ 会自动检测家庭或本地网络上的主机。已安装支持的 Samba 库，让你可以直接访问它们的任何共享文件夹。\n\n目前，Linux 和 Windows 都在进行从旧的\
  \ `SMBv1` 协议（安全消息块）到更安全的 `SMBv3` 协议的过渡。因此，目前无法通过 Linux 文件管理器浏览网络。你可以通过在任何文件管理器窗口的位置框中直接输入共享文件夹地址，或者使用文件管理器“文件”菜单中的“连接到服务器”对话框直接访问\
  \ Windows 共享。\n\n要从位置框直接访问，请输入 `smb://` 协议、Windows 系统主机以及共享文件夹名称。你会被要求授权（如图 9-22\
  \ 所示），指定主机名和密码。然后按 `ENTER`。文件管理器窗口将打开并共享文件夹（参见图 9-23）。\n\n在“连接到服务器”对话框中，首先确保在“类型”菜单中选择“Windows\
  \ 共享”项。然后输入 Windows 系统的主机名（服务器）和共享文件夹名称（共享）（参见图 9-22）。如有需要添加用户名和密码。然后点击“连接”。文件管理器窗口将打开并共享文件夹（参见图\
  \ 9-23）。\n\n文件管理器侧边栏的“网络”部分将显示该文件夹的条目，并有一个用于卸载的弹出按钮，同时桌面上也会显示该文件夹的图标。图 9-23 显示了挂载在网络窗口和桌面上的\
  \ Windows 系统上的 `myshared-data` 共享文件夹。\n\n你也可以使用这些方法浏览特定 Windows 系统上的所有共享文件夹。无需包含具体的共享文件夹，只需指定以\
  \ `smb://` 协议开头的前的主机（参见图 9-24）。然后你可以双击共享文件夹进行挂载。\n\n![Image](img/image-426.png)\n\
  \n图 9-21: 网络授权\n\n![Image](img/image-427.png)\n\n图 9-22: 连接到服务器\n\n注意：如果你正在运行防火墙，请确保配置\
  \ NFS 和 Samba 服务的访问权限，包括浏览支持。否则，其他计算机对你共享文件夹的可能会被拦截（参见第 11 章）。\n\n![Image](img/image-428.png)\n\
  \n图 9-23: 挂载远程共享\n\n![Image](img/image-429.png)\n\n图 9-24: 位置框\n\n### 你的网络共享文件夹\n\
  \n要在 Linux Mint 系统上共享文件夹，右键点击它并选择“共享选项”。这将打开一个窗口，允许你共享并选择是否允许修改、添加或删除文件（参见图 9-25）。如果你尚未安装\
  \ Samba 服务器，将会被提示安装，然后重启系统。该文件夹以读取权限共享。你可以在文件属性对话框的“共享”选项卡上设置文件和子文件夹的创建和删除权限（参见图\
  \ 9-26）。你可以允许任何在你系统中没有账户的用户访问（访客）。一旦做出选择，点击“创建共享”按钮。如果需要以后可以更改共享选项。共享是在 Nemo 和 Caja\
  \ 文件管理器中通过 `nemo-share` 和 `caja-share` 软件包实现的。\n\n![Image](img/image-430.png)\n\n\
  图 9-25: 文件夹共享选项\n\n共享文件夹在文件管理器窗口的图标旁边会显示一个共享符号，如图所示。\n\n![fig10-21a-05](img/image-431.png)\n\
  \n![Image](img/image-432.png)  ![fig10-21a-05](img/image-431.png)\n\n图 9-26: 文件夹共享面板\n\
  \n为了允许其他用户访问，必须更改文件夹的权限。你会被提示允许 Nemo 或 Caja 为执行这些更改。只需点击“自动添加权限”按钮（参见图 9-27）。\n\n\
  ![Image](img/image-433.png)\n\n图 9-27: 文件夹共享权限提示\n\n\n\n\n\n为了允许其他计算机访问你的文件夹，请确保已安装共享服务器：Windows\
  \ 系统使用 Samba，Linux/Unix 系统使用 NFS `nfs-kernelserver`。一旦安装完成，服务器将自动为你完成配置并运行。在安装这些服务器之前，你将无法共享文件夹。\n\
  \n你也可以直接通过 Synaptic 软件包管理器（`samba` 软件包）和软件管理器安装 Samba 服务器。安装后，将使用 `smbd` 和 `nmbd`\
  \ 服务脚本安装并运行两个服务器。`smbd` 服务器是 Samba 服务器，而 `nmbd` 服务器是网络发现服务器。\n\n如果 Samba 服务器无法启动，你可以在终端窗口中使用以下命令手动启动：\n\
  \n```\nsudo systemctl start nmbd\nsudo systemctl start smbd\n```\n\n你可以使用 `status`\
  \ 选项检查当前状态，并使用 `restart` 选项重启：\n\n```\nsystemctl status nmbd\nsystemctl status smbd\n\
  ```\n\n在首次安装时，Samba 会导入你的 Linux Mint 系统上已经配置的用户和组。在你的 Linux Mint 系统上，与 Linux Mint\
  \ 账户用户名和密码相同的 Windows 用户将自动连接到 Linux Mint 共享文件夹。如果 Windows 用户有不同的密码，Windows 会提示该用户输入用户名和密码。这里指的是\
  \ Linux Mint 的用户名和密码。对于用户名相同但密码不同的 Windows 用户，该用户应输入相同的用户名以及 Linux Mint 用户密码，而不是\
  \ Windows 密码。\n\n任何用户都拥有访问所有共享的权限。如果你想根据特定用户和密码限制访问，你需要使用如 `system-config-samba`\
  \ 等 Samba 配置工具来配置用户级访问，如第 16 节所述。\n\n若想在稍后更改文件夹的共享权限，请打开文件夹的“属性”窗口，然后选择“共享”选项卡。当你做出更改时，会显示“修改共享（Modify\
  \ Share）”按钮。点击它即可应用更改。在图 9-27 中，“图片”文件夹添加了访客访问。\n\n### 文件和文件夹权限\n\n在桌面上，你可以使用“属性”窗口中的“权限”选项卡设置文件夹或文件权限（参见图\
  \ 9-28）。对于文件，在文件管理器窗口中右键点击文件或目录的图标或条目，选择“属性”。然后选择“权限”选项卡。在这里，你将找到读/写权限的菜单，以及“所有者”、“组”和“其他”行。你可以将所有者权限设置为“只读”或“读和写”。对于组和其他用户，你也可以设置“无（None）”选项以拒绝访问。组名称会展开为列出不同组的弹出菜单；选择其中一个来更改文件的组。如果你想将此文件作为应用程序（例如\
  \ shell 脚本）执行，请勾选“允许文件作为程序执行”。这将产生设置执行权限。\n\n![Image](img/image-434.png)\n\n图 9-28：文件权限\n\
  \n文件夹的“权限”选项卡的工作方式非常相似，但它显示两个访问条目：“文件夹访问”和“文件访问”（参见图 9-29）。“文件夹访问”条目控制对文件夹的访问，具有“仅列出文件”、“访问文件”和“创建和删除文件”选项。这些对应于赋予文件夹的读、读和执行以及读/写/执行权限。“文件访问”条目允许你设置文件夹中所有文件的权限。它们与文件的权限设置相同：对于所有者，是“读”或“读和写”；对于组和其他用户，该条目增加了一个“无（None）”选项以拒绝访问。要相应地设置文件夹中所有文件的权限（而不仅仅是文件夹），点击“将权限应用到包含的文件”按钮。\n\
  \n![Image](img/image-435.png)\n\n图 9-29：文件夹权限\n\n### 使用 /etc/fstab 自动挂载文件系统\n\n\
  虽然大多数文件系统都会自动为你挂载，但在某些情况下你可能需要手动挂载文件系统。你可以使用 `mount` 命令直接执行此，也可以在 `/etc/fstab` 文件中指定挂载操作以便自动挂载。Linux\
  \ Mint 文件系统通过其 UUID（通用唯一标识符）进行唯一标识。这些 UUID 列在 `/dev/disk/by-uuid` 目录下（或通过 `sudo\
  \ blkid` 命令查看）。在 `/etc/fstab` 文件中，文件系统磁盘分区以注释形式列出，然后使用 UUID 后接实际的文件系统挂载操作。以下示例将分区\
  \ `/dev/sda3` 的文件系统挂载到 `/media/sda3` 目录，使用 `ext4` 文件系统和默认选项（`defaults`）。设备 `/dev/sda3`\
  \ 的 UUID 为 b8c526db-cb60-43f6-b0a3-5c0054f6a64a。\n\n```\n/dev/sda3\nUUID=b8c526db-cb60-43f6-b0a3-5c0054f6a64a\
  \ /media/sda3 ext4 defaults 0 2\n```\n\n你也可以通过给文件系统标记标签来识别。你可以使用 `ext2label` 命令为文件系统标记标签。在下面的\
  \ `/etc/fstab` 文件示例中，标记为 `mydata1` 的 Linux 文件系统被挂载到 `/mydata1` 目录，作为 `ext4` 文件系统。\n\
  \n```\n# /etc/fstab\n# <文件系统> <挂载点> <类型> <dump> <pass>\n/dev/sda3\nUUID=b8c526db-cb60-43f6-b0a3-5c0054f6a64a\
  \ /media/sda3 ext4 defaults 0 2\n```\n\n要手动挂载分区，使用 `mount` 命令并用 `-t` 选项指定类型。使用 `-L`\
  \ 选项按标签挂载。先列出文件系统，然后是挂载的目录。对于 NTFS 分区，你会使用类型 ntfs。对于 Ext4 文件系统，你会使用 `ext4`，对于旧的\
  \ Linux 分区，你会使用 `ext3`。\n\n```\nmount -t type directory\n```\n\n以下示例将 `mydata1`\
  \ 文件系统挂载到 `/mydata1`：\n\n```\nmount -t ext4 -L mydata1 /mydata1\n```\n\n### 蓝牙\n\
  \nLinux Mint 支持串口连接和 BlueZ 协议设备。蓝牙是本地连接设备（如键盘、鼠标、打印机和手机）的无线连接方式。你可以将其视为用于外围设备的小网络，消除了电线的需要。BlueZ\
  \ 是官方的 Linux 蓝牙协议，并集成在 Linux 内内核中。BlueZ 协议最初由 Qualcomm 开发，现在是一个开源项目，位于 [`bluez.sourceforge.net`](http://bluez.sourceforge.net)。它包含在\
  \ Linux Mint 的 bluez-utils 和 bluez-libs 等软件包中。请访问 BlueZ 网站查看支持的硬件的完整列表。\n\n蓝牙小图标显示在你的面板右侧。点击它可以显示蓝牙对话框（参见图\
  \ 9-30）。你也可以从偏好设置或系统设置对话框访问蓝牙对话框。蓝牙对话框有两个选项卡：“设备”和“设置”。在“设置”选项卡中，你可以设置系统蓝牙服务的名称，并设置开关以在面板上显示蓝牙图标以及是否接收蓝牙连接设备的文件。要向设备发送文件，右键点击面板上的蓝牙图标并选择“发送文件到设备”。\n\
  \n\n\n\n\n![Image](img/image-436.png) ![Image](img/image-437.png)![Image](img/image-438.png)\n\
  \n图 9-30: 蓝牙设置（系统设置）\n\n在“设备”选项卡上，你可以将系统连接到蓝牙设备。右上角的蓝牙开关可以让你开启或关闭蓝牙。检测到的设备列在中间的设备框架框中。初始状态下，设备是断开连接的（参见图\
  \ 9-31）。点击设备项进行连接。会弹出一个对话框显示检测到的 PIN 码，你需要对其进行确认。然后将显示设备配置对话框，其中有一个连接或断开设备的开关（参见图\
  \ 9-32）。还会显示配对信息、类型和地址信息。如果设备支持音频，则会显示“声音设置”按钮，点击它可以打开该设备的 PulseAudio 声音设置对话框（参见图\
  \ 9-33）。要移除设备配置，点击“删除”按钮。\n\n![Image](img/image-439.png)\n\n图 9-31: 蓝牙设置：未连接的设备\n\
  \n![Image](img/image-440.png)\n\n图 9-32: 蓝牙设备配置\n\n![Image](img/image-441.png)\n\
  \n图 9-33: 蓝牙声音\n\n当连接到手机时（参见图 9-34），系统会检测并显示 PIN 码。在配置对话框上，你可以选择连接或断开。如果你启用手机作为移动手机网络设备（PAN/NAP），则在网络管理器应用程序的菜单中将显示“移动宽带”项。\n\
  \n![Image](img/image-442.png)  ![Image](img/image-443.png)\n\n图 9-34: 蓝牙设置向导：手机\n\
  \n所有已连接的设备都可以从蓝牙应用程序的菜单中轻松断开（右键点击应用程序）。已连接的蓝牙设备列在“配对设备”子菜单下（参见图 9-35）。已连接的设备旁边会有勾选标记。该项作为切换开关使用。点击已连接的项断开连接，点击已断开的项重新连接。\n\
  \n![Image](img/image-444.png)\n\n图 9-35: 蓝牙应用程序配对设备菜单\n\n## DKMS\n\nDKMS 是最初由 DELL\
  \ 开发的动态内核模块支持（Dynamic Kernel Module Support）。每当内核更新时，启用 DKMS 的设备驱动程序都可以自动生成。这对于专有驱动程序（如\
  \ Nvidia 和 AMD 专有显卡驱动非常有帮助，X11 开源驱动 Xorg 已自动包含在内核包中）。在过去，每当你更新内核时，都必须下载并安装一个专门为该新内核编译的独立专有内核模块。如果模块未准备就绪，你就无法使用专有驱动程序。为了避免这个问题，开发了\
  \ DKMS，它使用原始专有源代码在需要时创建新的内核模块。当你安装新内核时，DKMS 会检测到新配置并为你的新内核编译一个兼容的专有内核模块。此操作是全自动的，且对用户完全隐藏。\n\
  \n在 Linux Mint 和 Ubuntu 上，Nvidia 和 AMD 专有显卡驱动都是 DKMS 启用包，由 DKMS 服务管理和生成。生成的内核模块被放置在\
  \ `/lib/modules/*/kernel-version*/kernel/updates` 目录下。当你安装任何一个专有图形包时，它们的源代码会被下载并用于创建供你的内核使用的显卡驱动程序。源代码存放在\
  \ `/usr/src` 目录。不同启用 DKMS 的软件的 DKMS 配置和构建位置位于 `/var/lib/dkms` 目录下的子目录。子目录将具有模块名称，例如\
  \ AMD 专有驱动程序为 `fglrx`，N 驱动程序为 `NVIDIA`。\n\nDKMS 配置文件位于 `/etc/dkms` 目录。`/etc/dkms/framework.conf`\
  \ 文件持有 DKMS 使用的目录（如源代码和内核模块目录）的 DKMS 变量定义。`/etc/init.d/dkms_autoinstaller` 是一个运行\
  \ DKMS 操作以生成并安装内核模块的脚本。内核更新的 DKMS 和安装指令维护在 `/etc/kernel` 目录中。\n\n如果 DKMS 自动安装和更新失败，可以使用\
  \ `dkms` 命令手动更新。带有 `build` 操作的 `dkms` 命令创建内核模块，然后带有 `install` 操作的 `dkms` 命令将模块安装到相应的内核模块目录。`-m`\
  \ 选项指定你要构建的模块，`-k` 选项是内核版本（使用 `uname -r` 显示当前的内核版本）。Nvidia 和 AMD 等驱动定期发布新版本。你使用\
  \ `-v` 选项指定你需要的驱动版本。完整细节请参 `dkms` 的手册页。\n\n## 直接编辑配置文件\n\n尽管管理工具会为你处理所有的配置设置，但有时你可能需要通过直接编辑配置文件来做出更改。大多数系统配置文件都是位于\
  \ `/etc` 目录下的文本文件。要更改这些文件的任何一个，你需要管理员权限，这需要你使用 `pkexec` 或 `sudo` 命令。\n\n你可以使用任何标准编辑器（如\
  \ nano 或 Vi）来编辑这些文件，尽管编辑它们最简单的方法是使用桌面上的 Xed 编辑器。在终端窗口中，输入带有 `sudo` 命令的 `xed`。会提示输入\
  \ root 用户密码。然后打开 Gedit 窗口（参见本文开头的图 9-2 和 9-3）。点击“打开”进入文件浏览器，定位到你要的文件。编辑配置文件时要小心。编辑错误可能会损坏配置。建议在对原始文件进行重大更改之前，对正在工作的配置文件进行备份。\n\
  \nXed（以及 Pluma）允许你同时编辑多个文件，为每个文件打开一个标签。你可以使用 Xed 编辑任何文本文件，包括你自己创建的文件。两个常用的配置文件是\
  \ `/etc/default/grub` 和 `/etc/fstab`。`/etc/fstab` 文件列出了所有的文件系统及其挂载方式，而 `/etc/default/grub`\
  \ 文件是你的 Grub 2 引导程序的配置文件。\n\n你也可以在启动 Xed 编辑器时指定要编辑的文件。\n\n```\nsudo xed /etc/default/grub\n\
  ```\n\n用户配置文件（点文件）可以由个人用户直接更改，无需管理员权限。用户配置文件的一个示例是 `.profile` 文件，它配置你的登录 shell。像\
  \ `.profile` 这样的文件必须从文件管理器窗口选择，而不是从 Gedit 的打开操作中选择。首先配置文件管理器显示点文件（通过任何文件管理器窗口的“编辑”菜单中的“首选项”），然后勾选“显示隐藏文件”项，并关闭对话框。这将显示管理器中的点文件。双击文件使用\
  \ Xed 打开它。\n\n## GRUB 2\n\n\n\n\n通用引导加载程序 (GRUB) 是一种用于大多数 Linux 发行版的多启动引导加载程序。Linux\
  \ 和 Unix 操作系统被称为多启动操作系统，它们会接收在启动时传递给它们的参数。通过 GRUB，用户可以在系统启动时显示的菜单界面中选择要运行的操作系统。使用方向键移动到某个条目并按\
  \ `ENTER`true。如果需要编辑某个条目，按 `e`，这将允许你更改内核参数或指定不同的内核。输入 `c` 命令将你进入命令行界面。只要你的系统 BIOS\
  \ 支持大容量硬盘，GRUB 就可以从这些硬盘的任何位置启动。有关 Grub2 的详细信息，请查看 Grub2 Wiki：\n\n[`wiki.ubuntu.com/Grub2`](https://wiki.ubuntu.com/Grub2)\n\
  \n查阅 GRUB 的 Linux 帮助手册页（Man page）以获取 GRUB 选项。GRUB 是一个 GNU 项目，其主页位于 [`www.gnu.org/software/grub`](https://www.gnu.org/software/grub)，手册位于\
  \ [`www.gnu.org/software/grub/index.html`](https://www.gnu.org/software/grub/index.html)。Ubuntu\
  \ 论坛上有关于在 Ubuntu 上使用 Grub2 的多个有用帖子，[`ubuntuforums.org`](https://ubuntuforums.org)，可以在那里搜索\
  \ Grub2。\n\nGrub2 会自动检测并为你生成菜单。你不需要担心维护菜单文件的更新。当系统启动时，你所有的操作系统和 Linux Mint 内核都会被检测到，并且会生成一个将其作为启动选项显示的菜单。\n\
  \n使用 Grub2，配置存放在用户可以修改的配置文件中，位于 `/etc/default/grub` 文件和 `/etc/grub.d` 目录中。有一个名为\
  \ `/boot/grub/grub.cfg` 的 Grub2 配置文件，但该文件是 Grub 在每次系统启动时生成的，绝不应由用户进行编辑。相反，你应该编辑\
  \ `/etc/default/grub` 文件来设置如默认操作系统之类的参数。要创建你自己的菜单条目，你需要在 `/etc/grub.d/40_custom`\
  \ 文件中创建相应的条目。\n\n![Image](img/image-445.png)\n\n图 9-36：编辑 `/etc/default/grub` 文件\n\
  \nGrub 选项通过为 `/etc/default/grub` 文件中的 Grub 选项分配值来设置。你可以直接编辑该文件来更改这些选项（参见图 9-36）。要使用\
  \ Xed 编辑器（Mate 中的 Pluma）编辑文件，请打开终端窗口并输入以下命令。系统将提示输入密码。或者，你可以配置 Xed 使用 policykit\
  \ 并通过 `pkexec` 运行它。\n\n```\nsudo xed /etc/default/grub\npkexec xed /etc/default/grub\n\
  ```\n\n然后你可以仔细地编辑该文件。工具栏下方的红色条会显示“权限消息”（Elevated Messages）通知，以便你知道你正在以管理员权限运行 Xed\
  \ 编辑器。这里显示了 Linux Mint 19.2 中使用的 `grub` 文件：\n\n```\n/etc/default/grub\n\n# 如果你更改此文件，请随后运行\
  \ 'update-grub' 以更新\n\n# /boot/grub/grub.cfg. GRUB_DEFAULT=0\n\nGRUB_HIDDEN_TIMEOUT=0\n\
  \nGRUB_HIDDEN_TIMEOUT_QUIET=true\n\nGRUB_TIMEOUT=\"10\"\n\nGRUB_DISTRIBUTOR=`lsb_release\
  \ -i -s 2> /dev/null || echo Debian`\n\nGRUB_CMDLINE_LINUX_DEFAULT=\"quiet splash\"\
  \n\nGRUB_CMDLINE_LINUX=\"\"\n\n# 取消注释以启用 BadRAM 过滤，根据你的需求进行修改\n\n# 这适用于 Linux（无需补丁）以及任何从\
  \ GRUB 获取\n# 内存映射信息的内核（GNU Mach, FreeBSD 内核 ...）\n\n#GRUB_BADRAM=\"0x01234567,0xfefefefe,0x89abcdef,0xefefefef\"\
  \n\n# 取消注释以禁用图形化终端（仅限 grub-pc）\n\n#GRUB_TERMINAL=console\n\n# 图形终端上使用的分辨率\n# 注意，你只能使用显卡通过\
  \ VBE 支持的模式\n# 你可以在真实的 GRUB 中通过命令 `vbeinfo` 查看它们\n\n#GRUB_GFXMODE=640x480\n\n# 如果你不想让\
  \ GRUB 向 Linux 传递 \"root=UUID=xxx\" 参数\n\n#GRUB_DISABLE_LINUX_UUID=true\n\n# 取消注释以禁用恢复模式菜单条目的生成\n\
  \n#GRUB_DISABLE_RECOVERY=\"true\"\n\n# 取消注释以便 grub 启动时发出蜂声\n\n#GRUB_INIT_TUNE=\"\
  480 440 1\"\n```\n\n对于双启动系统（同时具有 Linux Mint 和 Windows 或 Mac 的系统），用户可能会更改的选项是 GRUB_DEFAULT，它在未选择任何系统时设置自动启动的操作系统或内核。该选项使用行号来指示\
  \ Grub 启动菜单中的条目，编号从 0 开始（而不是 1）。首先，在启动时检查你的 Grub 菜单（在启动时按任意键可长时间显示 Grub 菜单），然后数到你想要设为默认的操作系统条目所在的位置。如果\
  \ Windows 条目在第 4 个（即从 0 开始数的第 3 行），要将其设为默认，请设置 GRUB_DEFAULT=3。\n\n\n\n\n备份操作已成为管理工作的重要部分。Linux\
  \ 系统提供了多种备份工具，包括 Amanda 和传统的 dump/restore 工具，以及用于创建单独副本的 `rsync` 命令。Linux Mint 提供了备份工具（`mintBackup`）用于基础备份操作。Deja\
  \ Dup 是 `duplicity` 备份工具的前端界面，它使用 `rsync` 生成备份归包。Deja Dup 是推荐的默认备份工具，可以在“系统设置”对话框的“备份”中找到。Amanda\
  \ 提供了基于服务器的备份，允许网络上的不同系统备份到中央服务器。BackupPC 使用配置的 `rsync` 和 `tar` 工具提供网络和本地备份。`dump`\
  \ 工具允许你精细化备份过程，检测自上次备份以来发生更改的数据。[表 9-2 列出了出了 Linux 备份工具的网站。\n\n## 备份工具 (mintBackup)\n\
  \n备份工具（`mintBackup`）提供文件、文件夹和文件系统的基础备份，以及对你当前安装的软件进行备份。备份工具在 Cinnamon 和 Mate 桌面上均可用（管理\
  \ | 备份工具）。初始对话框显示备份选项的按钮（参见图 9-37）。\n\n| 网站 | 工具 |\n| :--- | :--- |\n| [`linuxmint.com`](https://linuxmint.com)\
  \ | `mintBackup` (备份工具) |\n| [`rsync.samba.org`](https://rsync.samba.org) | `rsync`\
  \ 远程拷贝备份 |\n| [`launchpad.net/deja-dup`](https://launchpad.net/deja-dup) [`www.nongnu.org/duplicity`](http://www.nongnu.org/duplicity)\
  \ | `duplicity` 的 Deja Dup 前端，使用 `rsync` 执行基础备份 |\n| [`www.amanda.org`](http://www.amanda.org)\
  \ | Amanda 网络备份 |\n| [`dump.sourceforge.net`](http://dump.sourceforge.net) | `dump`\
  \ 和恢复工具 |\n| [`backuppc.sourceforge.net`](http://backuppc.sourceforge.net) | 使用配置的\
  \ `rsync` 和 `tar` 工具的 BackupPC 网络或本地备份 |\n\n表 9-2: 备份资源\n\n![Image](img/image-446.png)\n\
  \n图 9-37: 备份工具\n\n在执行备份时，你可以选择源、目的地并设置高级选项，例如保留权限（参见图 9-38）。备份被创建到文件夹或归包中。\n\n![Image](img/image-447.png)\
  \ ![Image](img/image-448.png)\n\n图 9-38: 备份工具备份\n\n## Deja Dup\n\nDeja Dup 是 `duplicity`\
  \ 备份工具的前端，它使用 `rsync` 生成备份归包（[`www.nongnu.org/duplicity/`](http://www.nongnu.org/duplicity/)）。安装后后，你可以从\
  \ Cinnamon 和 Mate 桌面的“偏好设置”和“应用程序”菜单作为“备份”访问 Deja Dup。在 Mate 桌面，你也可以通过“控制中心”的“其他”部分作为“备份”访问它。\n\
  \n`deja-dup` 设置对话框显示有概览”、“保存的文件夹”、“忽略的文件夹”、“存储位置和“计划”选项卡（参见图 9-39）。对话框右上角的开关允许你开启或关闭自动备份。“概览”选项卡提供有关备份配置的信息，显示要备份的文件夹、被忽略的文件夹以及上次和下次备份的日期。点击“帮助”按钮显示\
  \ Deja Dup 手册。\n\n![Image](img/image-449.png)\n\n图 9-39: Deja Dup 设置：概览\n\n“保存的文件夹”选项卡允许你指定想要备份的文件夹和要忽略的文件夹（参见图\
  \ 9-40）。点击文件夹列表底部的加号 (+) 按钮添加新的备份文件夹。通过相同的操作来指定要忽略的文件夹。减号按钮从列表中删除文件夹。你的主目录已自动添加。“忽略的文件夹”选项卡指定了你不想备份的文件夹。初始选择了“下载”和“垃圾箱”文件夹。\n\
  \n![Image](img/image-450.png) ![Image](img/image-451.png)\n\n图 9-40: Deja Dup 设置：保存和忽略的文件夹\n\
  \n“存储位置”选项卡允许你指定存储备份的位置（参见图 9-41）。你可以选择不同的位置，例如 FTP 账户、云端账户、SSH 服务器、Samba (Windows)\
  \ 共享或本地文件夹。从“备份位置”菜单中选择你想要的一个。每选择一次，系统都会提示你输入相应的配置信息。\n\n![Image](img/image-452.png)\
  \ ![Image](img/image-453.png)\n\n图 9-41: Deja Dup 设置：Windows 共享和本地文件夹的存储\n\n在“计划”选项卡上，你可以指定备份的频率以及保留备份的时间（参见图\
  \ 9-42）。\n\n\n\n\n`rsync` 命令默认配置为使用 Secure Shell（SSH）远程 shell。你可以通过 `-e` 选项指定使用它或其他备用的远程\
  \ shell。为了确保传输安全，你可以使用 SSH 对复制操作进行加密。可以使用 `-e ssh` 选项或将 `RSYNC_RSH` 变量设置为 `ssh`。\n\
  \n```bash\nrsync -avz -e ssh /home/george/myproject rabbit:/backup/myproject\n```\n\
  \n你可以从远程主机复制内容到你当前所在的主机。\n\n```bash\nrsync -avz lizard:/home/mark/mypics/ /pic-archive/markpics\n\
  ```\n\n你还可以将 `rsync` 作为服务器守护进程运行。这允许远程用户将你系统上的文件副本与他们自己上的版本进行同步，仅传输更改的文件，而不是整个目录。许多镜像和软件\
  \ FTP 站点作为 `rsync` 服务器运行，让你无需重新下载完整版本即可更新文件。`rsync` 作为服务器的配置信息存储在 `/etc/rsyncd.conf`\
  \ 文件中。\n\n提示：尽管它是为在主机之间拷贝而设计的，但你也可以使用 `rsync` 在自己的系统中进行拷贝，通常是到另一个分区或硬盘的目录。请查看 `rsync`\
  \ 手页以获取每项操作的详细说明。\n\n### BackupPC\n\nBackupPC 在使用配置了 `rsync` 或 `tar` 工具的系统上，为你的系统或主机提供于管理的本地或网络备份。它不需要安装客户端应用程序；只有配置文件。BackupPC\
  \ 可以备份网络上的主机（包括服务器），也可以仅备份单个系统。数据可以备份到本地硬盘或网络存储（如共享分区或存储服务器）。你可以使用 Web 页面配置界面来配置\
  \ BackupPC。这是你的计算机附带了 `/backuppc` 名称的主机名，例如 `http://richard1/backuppc`。详细文档安装在 `/usr/share/doc/BackupPC`。你可以在\
  \ [http://backuppc.sourceforge.net] 了解更多关于 BackupPC 的信息。你可以使用 Synaptic 软件包管理器或软件管理器安装\
  \ BackupPC。Canonical 会提供关键更新。\n\nBackupPC 同时使用压缩和相同文件检测技术来减小备份尺寸，允许在有限空间内备份多个主机。一旦执行了初始备份，BackupPC\
  \ 将仅备份更改的文件，从而显著缩短备份时间。\n\nBackupPC 拥有自己的服务脚本用于启动 BackupPC 服务，路径为 `/etc/init.d/backuppc`。配置文件位于\
  \ `/etc/BackupPC`。`config.pl` 文件持有 BackupPC 配置选项，`hosts` 文件列出了需要备份的主机。\n\n### Amanda\n\
  \n为了备份连接到网络的主机，你可以使用 Advanced Maryland Automatic Network Disk Archiver (Amanda)\
  \ 来对主机进行归档。Amanda 使用 `tar` 工具将所有主机备份到一台作为备份服务器的单一主机上。备份数据由每个主机发送到作为 Amanda 服务器的主机，并在何处被写入备份介质（如磁带）。通过\
  \ Amanda 服务器，所有主机的备份操作都将集中在一台服务器上进行，而不是由每个主机自行执行备份。任何需要恢复数据的主机只需向 Amanda 服务器请求，并指定文件系统、日期和文件名。备份数据被复制到服务器的存放磁盘，然后从那里写入磁带。[http://www.amanda.org]\
  \ 提供了详细文档和更新。对于服务器，请确保安装 `amanda-server` 包，对于客户端，你使用 `amanda-clients` 包。你可以使用 Synaptic\
  \ 软件包管理器和软件管理器安装 Amanda。Canonical 不提供关键更新。\n\n## 逻辑卷管理器\n\n为了更方便地管理硬盘存储，你可以设置系统以使用逻辑卷管理器\
  \ (LVM)，创建组织成逻辑卷的 LVM 分区，并向其自动分配空空间。逻辑卷为处理磁盘存储提供了一种更灵活、更强大的方式，通过将物理分区组织成逻辑卷，可以在其中轻松地管理磁盘空间。逻辑卷的磁盘存储被视为一个内存池，尽管该卷实际上可能包含分布在不同硬盘上的多个硬盘分区。添加新的\
  \ LVM 分区仅仅是增加了整个系统可访问的存储池。请查看 [www.tldp.org] 上的 LVM HOWTO 获取详细示例。\n\n### LVM 结构\n\
  \n在 LVM 结构中，LVM 物理分区（也称为区，extents）被组织成逻辑组，逻辑组反过来又被逻辑卷使用。实际上，你正在处理三个不同的组织层次。在最底层，你拥有物理卷。这些是你使用\
  \ `parted` 或 `fdisk` 等分区创建工具创建的物理硬盘分区。分区类型将是 Linux LVM 分区，`fdisk` 代码为 `8e`。这些物理卷被组织成逻辑组，称为卷组，其工作方式非常类似于逻辑硬盘。你将物理卷的集合分配给不同的逻辑组。\n\
  \n一旦你有了逻辑组，就可以创建逻辑卷。逻辑卷的功能与标准设置下的硬盘分区非常相似。例如，在 `turtle` 卷组卷上，你可以创建一个 `/var` 逻辑卷，在\
  \ `rabbit` 逻辑组上，你可以创建 `/home` 和 `/projects` 逻辑卷。你可以在一个逻辑组上有多个逻辑卷，就像你可以在一个硬盘上拥有多个分区一样。\n\
  \n你像对待任何普通硬盘分区一样对待逻辑卷。使用 `mkfs` 命令在上面创建文件系统，然后你可以使用 `mount` 命令挂载该文件系统进行使用。对于 Linux\
  \ Mint/Ubuntu，文件系统类型将是 `ext4`。\n\n逻辑卷上的存储使用称为“区”（extents）的内容进行管理。逻辑组定义了一个区的标准（例如\
  \ 4MB），然后将其组中的每个物理卷分为该大小的区。逻辑卷反过来也被分为相同大小的区，然后映射到物理卷上。\n\n逻辑卷可以是线性的、条带的或镜像的。镜像选项将为逻辑卷创建一个镜像副本，提供恢复能力。条带选项允许你将逻辑卷自动分布在多个分区上，就像使用\
  \ RAID 设备一样。这为大文件增加了效率，但实现起来较复杂。类似于 RAID 设备，条带大小必须在分区间保持一致。由于 LVM 分区可以是任何大小，因此条带大小必须仔细计算。最简单的方法是使用线性实现，类似于\
  \ RAID 0 设备，将存储视为一个巨大的普通驱动器，并顺序访问存储。\n\n逻辑卷有一个限制和一个建议。启动分区不能是逻辑卷的一部分。你仍然需要创建一个单独的硬盘分区作为启动分区，并带有\
  \ `/boot` 挂载点，内核和所有需要的启动文件都安装在那里。此外，建议不要将根分区放在逻辑卷上。这样做会增加任何需要的数据恢复的复杂性。这就是为什么 LVM\
  \ 设置的默认分区配置将包含一个类型为 `ext4` 的单独启动分区，而根分区和交换分区将安装在逻辑卷上。将有两个分区，一个用于逻辑组（LVM 物理卷 `pv`）持有交换和根卷，另一个用于启动分区。逻辑卷反过来都是\
  \ `ext4` 文件系统。\n\n### LVM 工具：使用 LVM 命令\n\n\n\n\n\n与其使用 `system-config-lvm`，你可以使用一组\
  \ LVM 工具来管理你的 LVM 卷，添加新的 LVM 物理分区并移除现有的分区。`system-config-lvm` 系统工具实际上是 LVM 工具的 GUI\
  \ 界面。对于 LVM 工具，你可以直接使用 LVM 工具，也可以使用 `lvm` 命令生成一个交互式 shell，你可以在其中运行 LVM 命令。所有的 LVM\
  \ 命令都有 Man 页面（帮助文档）。LVM 在 `/etc/lvm/lvm.conf` 文件中维护配置信息，你可以在其中配置 LVM 选项，例如日志文件、配置备份目录或\
  \ LVM 设备的所在目录（更多信息请参见 `lvm.conf` 的 Man 页面）。\n\n注意：对于桌面 LVM 管理，你可以尝试使用 `system-config-lvm`\
  \ 应用，但它是一个旧的程序，可能无法工作。\n\n## 显示 LVM 信息\n\n你可以使用 `pvdisplay`、`vgdisplay` 和 `lvdisplay`\
  \ 命令显示有关物理分区、卷组和逻辑卷的详细信息。`pvscan`、`vgscan` 和 `lvscan` 命令则列出你的物理卷、卷组和逻辑卷。\n\n## 使用\
  \ LVM 命令管理 LVM 物理卷\n\n物理卷可以是任何硬盘分区或 RAID 设备。RAID 设备被视为一个单一的物理卷。你可以从单个硬盘或硬盘上的分区创建物理卷。在具有许多硬盘的超大型系统中，你更有可能使用整块硬盘作为每个物理卷。\n\
  \n你首先会使用如 `fdisk`、`parted` 或 `gparted` 等分区工具创建一个 LVM 分区类型（`8e`）的分区。然后，你可以使用 `pvcreate`\
  \ 命令将该分区初始化为物理卷。\n\n要在整个硬盘上初始化物理卷，你需要使用硬盘设备名称，如下：\n\n```bash\npvcreate /dev/sdc\n\
  ```\n\n这将在 `sdc` 硬盘上初始化一个名为 `sdc1` 的物理分区 `pv`（第三个串行 ATA 驱动器，c）。\n\n如果你正在使用驱动器上的特定分区，则使用该分区的设备名称创建一个新的物理卷，如下：\n\
  \n```bash\npvcreate /dev/sda3\n```\n\n要初始化多个驱动器，只需列出它们即可。以下命令将创建两个物理分区 `sdc1` 和\
  \ `sdd1`。\n\n```bash\npvcreate /dev/sdc /dev/sdd\n```\n\n你也可以使用不同硬盘上的多个分区。在这种情况下，你的每个硬盘都存有多个分区。当你将硬盘上的某些分区用于不同的用途（例如不同的操作系统），或者当你想将你的逻辑组分布到几块硬盘上时，这种情况就会经常发生。要一次性初始化这些分区，你只需列出它们即可。\n\
  \n```bash\npvcreate /dev/sda3 /dev/sdb1 /dev/sdb2\n```\n\n一旦初始化了分区，你就需要在它们上创建 LVM\
  \ 组。\n\n## 管理 LVM 组\n\n物理 LVM 分区组成卷组。你可以使用 `vgcreate` 命令、组名称以及你想要在该组中的物理分区列表手动创建一个卷组。\n\
  \n如果你随后要创建一个新的卷组来容纳这些分区，可以在使用 `vgcreate` 命令创建卷组时将它们包含进去。卷组可以使用一个或多个物理分区。在示例中描述的配置为\
  \ `VolGroup00` 只使用了一个物理分区。在接下来的示例中，名为 `mymedia` 的卷组由两个物理卷 `sdc` 和 和 sdd` 组成。\n\n\
  ```bash\nvgcreate mymedia /dev/sdc /dev/sdd\n```\n\n上一个示例在两个串行 ATA 硬盘上设置了逻辑组，每个硬盘都有自己的单一分区。或者，你可以设置一个跨越多个硬盘分区的卷组。如果你将分区用于不同的功能，这种方法可以让你灵活地使用多个硬盘上的所有可用空间。以下示例创建了一个名为\
  \ `mygroup` 的组，由三个物理分区 `/dev/sda3`、`/dev/sdb2` 和 `/dev/sdb4` 组成：\n\n```bash\nvgcreate\
  \ mygroup /dev/sda3 /dev/sdb2 /dev/sdb4\n```\n\n如果你以后向卷组添加物理卷，可以使用 `vgextend` 命令。`vgextend`\
  \ 命令向逻辑组添加新分区。在接下来的示例中，分区 `/dev/sda4` 被添加到卷组 `mygroup`。实际上，你正在通过添加新的物理分区来扩展逻辑组的大小。\n\
  \n```bash\nvgextend mygroup /dev/sda4\n```\n\n要向卷组添加整个新驱动器，你将遵循类似的步骤。以下示例添加了第五块串行\
  \ ATA 驱动器 `sde`，首先在其上创建物理卷，然后将该卷 `sde` 添加到 `mymedia` 卷组。\n\n```bash\npvcreate /dev/sde\n\
  vgextend mymedia /dev/sde\n```\n\n要移除物理分区，首先将其从其逻辑组中移除。你可能需要使用 `pmove` 命令将物理分区上的任何数据移动。然后使用\
  \ `vgreduce` 命令将其从逻辑组中移除。\n\n你可以通过先用 `vgchange -a n` 禁用卷组，然后使用 `vgremove` 命令来移除整个卷组。\n\
  \n## 激活卷组\n\n在标准文件系统结构中，你挂载和卸载硬盘分区，而在 LVM 中，你通过 `vgchange -a n` 激活并禁用卷组。要激活逻辑组，请使用\
  \ `vgchange` 命令配合 `y` 参数。\n\n```bash\nvgchange -a y mygroup\n```\n\n## 管理 LVM 逻辑卷\n\
  \n创建逻辑卷时，使用 `lvcreate` 命令并使用标准的 `mkfs` 格式化逻辑卷。请记住这些操作可以同时进行。使用 `-n` 选项指定卷名称，就像硬盘分区的标签一样。使用\
  \ `-L` 或 `--size` 选项指定大小。使用大小后缀，G 代表吉字节，M 代表兆字节，K 代表千字节。还有其他选项可以实现如线性、条纹或镜像卷，或者指定使用的单元大小。通常默认值即可。以下示例在\
  \ `mygroup` 上创建一个名为 `projects` 的大小为 20GB 的逻辑卷。\n\n```bash\nlvcreate -n projects\
  \ -L 20GB mygroup\n```\n\n接下来的示例在 `mymedia` 卷组上设置了一个大小为 540GB 的逻辑卷。`mymedia` 卷组由两个硬盘上的物理卷组成。实际上，两个硬盘在逻辑上被视为一个。\n\
  \n```bash\nlvcreate -n myvideos -L 540GB mymedia\n```\n\n一旦创建了逻辑卷，你需要在它上创建一个文件系统。以下在\
  \ `myvideos` 逻辑卷上创建一个 `ext4` 文件系统。\n\n```bash\nmkfs.ext4 myvideos\n```\n\n你也可以使用：\n\
  \n```bash\nmkfs -t ext4 myvideos\n```\n\n通过 `lvextend`，如果卷组中有未分配空间，你可以增加逻辑卷的大小。\n\
  \n如果你想减小逻辑卷的大小，可以使用 `lvreduce` 命令并指定新大小。确保使用 `resize2fs` 命令减小逻辑卷上任何文件系统（ext4）的大小。\n\
  \n要重命名逻辑卷使用 `lvrename` 命令。如果你想完全删除逻辑卷，可以使用 `lvremove` 命令。\n\n### 创建新 LVM 组和卷的步骤\n\
  \n**物理分区** 首先在你的硬盘上创建物理分区。你可以使用 `GParted`、`QTparted` 或配合磁盘设备名称使用 `fdisk` 创建分区。例如，要使用\
  \ `fdisk` 在设备名称为 `/dev/sde` 的新硬盘上创建一个分区，你需要输入：\n\n```bash\nfdisk /dev/sde\n```\n\
  \n\n\n\n随后，在 `fdisk` 终端中，使用 `fdisk n` 命令创建一个新分区，将其设置为主分区（`p`），并将其设为第一个分区。如果你计划将整个硬盘用于你的\
  \ LVM，那么你只需要一个覆盖整个硬盘的分区。\n\n然后，使用 `t` 命令将分区类型设置为 `8E`。`8E` 类型是 LVM 分区类型。要保存你的更改，请输入\
  \ `w` 将更改写入磁盘。\n\n### 物理卷 (Physical Volume)\n接下来，在新的空闲 LVM 分区上，使用 `pvcreate` 命令和设备名称创建一个物理卷（`pv`）。\n\
  \n```bash\npvcreate /dev/sde\n```\n\n## 卷组 (Volume Group)\n然后，使用 `vgcreate` 命令创建卷组，并指定卷组名称和硬盘设备名称。\n\
  \n```bash\nvgcreate mynewgroup /dev/sde\n```\n\n确保卷组已激活。使用 `vgs` 命令列出它。如果没有列出，请使用以下命令激活它。\n\
  \n```bash\nvgchange -a y mynewgroup\n```\n\n## 逻辑卷 (Logical Volume)\n然后，使用 `lvcreate`\
  \ 命令为卷组创建一个或多个逻辑卷。`--size` 或 `-L` 选项决定大小，`--name` 选项指定名称。要查找可用空空间，请使用 `vgs` 命令。一个卷组可以有多个逻辑卷，也可以根据你的喜好只有一个。逻辑卷在概念上类似于\
  \ Windows 系统扩展分区中的逻辑卷。\n\n```bash\nlvcreate --size --name mynewvol1\n```\n\n## 格式化逻辑卷\
  \ (Format the Logical volume)\n随后，你使用 `mkfs` 命令配合 `-t` 选项格式化逻辑卷。逻辑卷将列在 `/dev` 目录下的\
  \ LVM 组目录下，路径为 `/dev/mynewgroup/mynewvol1`。\n\n```bash\nmkfs -t ext4 /dev/mynewgroup/mynewgroup-mynewvol1\n\
  ```\n\n## 向 LVM 组和卷添加新驱动器的步进式步骤\n\n### 物理分区 (Physical Partition)\n首先在你的硬盘上创建一个物理分区。你可以使用\
  \ GParted、QTparted 或带有磁盘设备名称的 `fdisk` 来创建分区。类型请指定为 LVM (`8E`)。\n\n### 物理卷 (Physical\
  \ Volume)\n接下来，在新的空闲 LVM 分区上，使用 pvcreate 命令和设备名称创建一个物理卷（`pv`）。\n\n```bash\npvcreate\
  \ /dev/sdf\n```\n\n### 添加到逻辑组 (Add to Logical Group)\n使用 `vgextend` 命令将新的物理卷添加到你现有的逻辑组（LG）。\n\
  \n```bash\nvgextend mynewgroup /dev/sdf\n```\n\n### 添加到逻辑卷 (Add to Logical Volume)\n\
  然后，你可以在新空间创建新的逻辑卷，或者扩展当前逻辑卷的大小。要将逻辑卷扩展到新空间，请先卸载逻辑卷。然后使用 `lvextend` 命令扩展到现在属于同一逻辑组的新硬盘上的空间。在不指定大小的情况下，新硬盘上的整个空间都将被添加。\n\
  \n```bash\numount /dev/mynewgroup/mynewvol1\nlvextend /dev/mynewgroup/mynewvol /dev/sdf\n\
  ```\n\n使用 `-L` 选项指定特定大小，例如 `-L +250G`。请确保添加 the.L.. to to to to\nthe the the the\
  \ the the the the the the the the the the the the the the the the the the the the\
  \ the the the the the the the the the the the the the the the the the the the the\
  \ the the the the\nthe the the the the the the the the the the the the the. the.\
  \ the the... the. the the the... the. the..... the the..........................\
  \ the. the..... the.......... the.................. the the the the the the the..\n\
  \n```bash\nmkfs -t ext4 /dev/mynewgroup/mynewgroup-mynewvol1\n```\n\n\n\n你也可以将它们作为逻辑卷的替代版本。你可以对快照进行读写。写入操作只会更改快照卷而不会更改原始卷，这实际上创建了一个备用版本。\n\
  \n## OpenZFS\n\nZFS 文件系统结合了逻辑卷管理器（LVM）、RAID 系统和文件系统的功能。ZFS 抽象了文件系统，就像 LVM 一样，它建立了一个存储池，并从中生成文件系统。数据块的校验和存储在数据块之外，并会检查块内是否存在任何损坏。这使得\
  \ ZFS 在防止由于写入中断、驱动程序错误和访问失败等问题导致的静默数据损坏方面非常有效。如果设置了 RAID-Z 支持，可以恢复受损的数据块。RAID-Z\
  \ 实现了一种面向数据的类 RAID 支持，并在文件系统内部对你的数据进行自动镜像。此外，ZFS 这种类 LVM 的抽象允许支持大文件。写入采用写时复制（copy-on-write）事务方法，数据不会被直接覆盖，而是被添加。\n\
  \nZFS 由 SUN 开发，现已由 Oracle 控制。从 2010 年开始，OpenZFS 为 Linux 系统提供了 ZFS 的开源版本。Linux Mint\
  \ 与 Ubuntu 一样，现在通过 OpenZFS 内核模块支持 ZFS 文件系统。可以通过 `zfsutils-linux` 软件包（Universe 仓库）安装管理\
  \ ZFS 文件系统的工具。更多信息请参见下文：\n\n[`wiki.ubuntu.com/Kernel/Reference/ZFS`](https://wiki.ubuntu.com/Kernel/Reference/ZFS)\n\
  \n与 LVM 系统类似，你拥有物理设备（称为虚拟设备，VDEVs），它们被组合并条带化到一个数据池中（使用 `zpool` 命令），然后可以用其创建 ZFS\
  \ 文件系统。在池层级，你可以实现 RAIDZ 选项。通过 `zfs` 命令，你可以在池中创建文件系统。通过 `zfs` 命令，还可以创建 ZFS 文件系统的快照（只读副本）或克隆（可写副本）。要对池进行完整性检查，请使用\
  \ `zpool` 命令的 `scrub` 选项。\n\n## 10. 网络连接\n\n你使用网络管理器配置网络连接。Linux Mint 19.2 使用与 Ubuntu\
  \ 18.04 相同的网络管理器。你有两个网络管理器可供选择：NetworkManager 和 systemd-networkd。在 Linux Mint 19.2\
  \ 以及 Ubuntu 18.04 桌面版上，NetworkManager 是默认选项并在安装时安装并激活。可以通过“系统设置-网络”或“网络连接”对其进行管理。另一个网络管理器\
  \ systemd-networkd 也已安装但未配置。\n\n两个网络管理器都使用 Netplan 来配置和管理网络设备。Netplan 是一个网络抽象配置渲染器，它使用简单的用户定义配置文件生成网络设备配置文件。旧的\
  \ ifupdown 软件包及其网络设备管理工具集（如 `ifup` 和 `ifdown`）已弃用，但仍然可用并支持。Netplan 为网络设备配置提供了一层抽象，使得过程变得更加灵活。Netplan\
  \ 在 `/etc/netplan` 目录下创建网络设备配置文件，用户可以编辑这些文件。然后它在启动时使用这些文件来生成网络设备配置文件。\n\n网络设备现在使用一种可预测的命名方法，这与旧的命名方法不同。名称是根据引用网络设备类型的特定设备、硬件连接和插槽甚至其功能生成的。你可以在终端窗口中使用\
  \ `ifconfig` 命令来查找网络设备的名称。\n\n| 网络配置工具 | 说明 |\n| :--- | :--- |\n| NetworkManager\
  \ | 自动处理无线和有线网络连接、选择和通知。适用于所有网络连接，包括有线、无线、移动宽带、VPN 和 DSL。 |\n| GNOME Network (Network\
  \ Settings) | GNOME 网络连接设置，允许快速连接和配置有线及无线网络。用于设置代理配置。 |\n| nm-connection-editor\
  \ (Network Connections) | Network Manager 连接编辑器，用于配置所有类型的连接。用于 VPN 连接。`nmcli` 是\
  \ Network Manager 的命令行界面版本。 |\n| ufw | 设置网络防火墙。 |\n| Gufw | UFW 防火墙的 GNOME 界面 |\n\
  | Firewalld | 使用 firewalld 设置网络防火墙。 |\n| wvdial | PPP 拨号调制器连接 |\n| systemd-networkd\
  \ | 基于 systemd 的网络配置 |\n\n表 10-1：Linux Mint 网络配置工具\n\nLinux Mint 将使用 Network Manager\
  \ 自动检测并配置你的网络连接。如果自动配置由于原因失败或不完整，你可以使用 Network Manager 进行手动配置（在“偏好”菜单中或从 Network\
  \ Manager 面板插件菜单中选择“网络连接”）。如果你想建立简单的拨号调制器连接，可以使用 WvDial。你的网络还需要防火墙。推荐使用 UFW（带有 Gufw\
  \ 界面）或 FirewallD。表 10-1 列出了若干网络配置工具。你也可以使用 Cinnamon 桌面上的 GNOME 3 网络对话框（系统设置）进行快速无线和有线连接，以及代理配置（详见第\
  \ 3 章）。\n\n### 网络连接：动态与静态\n\n如果你处于网络中，可能需要获取某些信息来配置你的连接接口。大多数网络现在都支持使用旧的动态主机配置协议（DHCP）或新的\
  \ IPv6 协议及其自动地址配置进行动态配置。在这种情况下，你只需要 DHCP 条目。如果你的网络不支持 DHCP 或 IPv6 自动配置，或者你正在使用静态连接（IPv6\
  \ 连接是动态的），你必须提供连接的详细信息。对于静态连接，你需要手动输入信息（如 IP 地址和 DNS 服务器），而在动态连接中，这些信息由 DHCP 服务器自动提供给你的系统。对于\
  \ DHCP，每个主机上的 DHCP 客户端将从该网络的 DHCP 服务器获取信息。IPv6 在连接网络时根据设备和路由器信息（如设备 MAC 地址）直接生成地址。\n\
  \n此外，如果你使用动态 DSL、ISDN 或调制器连接，你还需要提供供应商、登录和密码信息，并指定你的系统是动态还是静态。你可能还需要提供特殊信息，如 DSL\
  \ 或调制器压缩方法或拨号号码。\n\n你可以从网络管理员或 ISP（互联网服务提供商）处大部分静态网络信息。你需要以下信息：\n\n**网络接口的设备名称**\
  \ 对于局域网和无线连接，通常是名为 `eth0` 或 `eth1` 的以太网。对于调制器、DSL 或 ISDN 连接，这是一个名为 `ppp0` 的 PPP\
  \ 设备（ISDN 为 `ippp0`）。\n\n**主机名** 你的计算机在互联网上通过此名称进行标识。不要使用 localhost；该名称留供系统特殊使用。主机名应该是一个简单的单词，可以包含数字，但不能包含点和反斜杠等标点。在小型网络上，主机名通常是单一名称。在具有多个域的大型网络上，主机名包括主机名和域名。\n\
  \n**域名** 这是你网络的名称。\n\n\n\n\n\n### 分配给你的机器的网协议 (IP) 地址\n这仅适用于静态连接。动态连接使用 `DHCP` 协议自动为你分配\
  \ IP 地址。互联网上的每个主机都分配有一个 IP 地址。较小和较旧的网络地址可能仍使用旧的 `IPv4` 格式，由一组由点分隔的四个组成。IP 协议版本 6，即\
  \ `IPv6` 使用了新的格式，具有复杂的编号序列且更加自动化。\n\n### 你的网络 IP 地址\n仅适用于静态连接。此地址与 IP 地址类似，但缺少对特定主机的引用。\n\
  \n### 子掩码\n仅适用于 IPv4 静态连接。对于大多数网络，这通常是 `255.255.255.0`。然而，如果你是一个大型网络的一部分，请咨询你的网络管理员或\
  \ `ISP`。\n\n### 你网络的广播地址（可用）（可选）\n仅适用于 IPv4 静态连接。通常，你的广播地址是你的 IP 地址末尾加上数字 `255`。\n\
  \n### 你的网络网关计算机的 IP 地址\n仅适用于静态连接。这是将你的本地网络连接到互联网等更大网络的计算机。\n\n### DNS 服务器\n你的网络使用的名称服务器的\
  \ IP 地址。这些服务器使得可以使用 URL。\n\n### NIS 服务器的 NIS 域和 IP 地址\n如果你的网络使用 `NIS` 服务器，则是必要的（可选）。\n\
  \n### 用户登录和密码信息\n动态 `DSL`、`ISDN` 和调制解器连接需要。\n\n## Network Manager\nNetwork Manager\
  \ 会自动检测你的有线和无线网络连接。它利用 `udev` 的自动设备检测功能来配置你的连接。如果你需要手动配置网络连接，也可以使用 `GNOME` 网络（网络设置）或较旧的\
  \ `nm-connections` 编辑器（网络连接）来输入所需的网络连接信息。Network Manager 以名为 `Network Manager` 的守护进程运行。它将自动扫描有线和无线连接。Network\
  \ Manager 提供的信息供其他应用程序使用。Network Manager 监控你的网络连接，并在 Network Manager 面板应用上显示其状态。\n\
  \nNetwork Manager 设计在后台运行，为你的连接提供状态信息并在并在时从一个配置的连接切换到另一个。对于初始配置，它会检测有关新连接的尽可能的信息。\n\
  \nNetwork Manager 也是用户特定的。当用户登录时，该用户偏好的无线连接将启动（有线连接会自动启动）。\n\n默认情况下，如果可用，将优先选择以太网连接。对于无线连接，你需要选择你想要的。\n\
  \nNetwork Manager 设计在后台运行，为你的连接提供状态信息并在需要时从一个配置的连接切换到另一个。对于初始配置，它会检测有关新连接的尽可能的信息。\n\
  \nNetwork Manager 以名为 `NetworkManager` 的守护进程运行。如果没有可用是以太网连接，Network Manager 将扫描无线连接，检查扩展服务集标识符\
  \ (`ESSIDs`)。如果 `ESSID` 标识了以前使用过的连接，则会自动选择它。如果发现多个，则选择最近使用的一个。如果只有一个新连接可用，则 Network\
  \ Manager 将等待用户选择一个。只有在用户登录时，才会选择连接。如果随后建立了以太网连接，Network Manager 将从无线切换到以太网。\n\n\
  可以使用带有 `sudo` 命令的 `systemctl` 命令开启或关闭 Network Manager 守护进程。\n\n```\nsudo systemctl\
  \ start NetworkManager\nsudo systemctl stop NetworkManager\n```\n\n### Network Manager\
  \ 菜单\nNetwork Manager 在 Linux Mint 面板右侧显示网络图标。Network Manager 图标将根据连接类型而变化。以太网（有线）连接显示两个已连接的插头。无线连接显示交错的波形图（参见图\
  \ 10-1）。如果连接未激活，则显示空波形图。如果你同时拥有有线和无线连接，且有线连接激活，则使用有线连接图标。\n\n![Image](img/image-53.png)\
  \ ![Image](img/image-54.png) ![Image](img/image-1.jpeg)\n\n图 10-1：Network Manager\
  \ 有线、无线和断开图标。\n\nNetwork Manager 应用菜单显示你的有线连接为“Wired”，并有一个用于开启或关闭的开关（参见图 10-2）。要断开你的有线连接，你可以点击开关将其切换到关闭位置。你在面板上的\
  \ Network Manager 图标将变为灰色。要稍后重新连接，再次点击开关。\n\n![Image](img/image-457.png) ![Image](img/image-458.png)\
  \ ![Image](img/image-459.png)\n\n图 10-2：Network Manager 应用菜单\n\nNetwork Manager\
  \ 将扫描无线连接，检查扩展服务集标识符 (`ESSIDs`)。如果 `ESSID` 标识了以前使用过的连接，则会被 Network Manager 选中。如果发现多个，则选择最近使用的一个。如果只有一个新连接可用，则\
  \ Network Manager 将等待用户选择一个。只有在用户登录时，才会选择连接。\n\n## 使用 GNOME 网络（网络设置）手动配置 Network\
  \ Manager\nGNOME Network 工具可以从“系统设置”中的“网络”以及从“Network Manager 菜单”中的“网络设置”中获取，并用于配置你的网络连接。自动的无线和有线连接在第\
  \ 3 章中介绍。有关详细的手动配置，Network 功能提供了与“网络连接”中使用的类似的对话框。当你访问 GNOME Network 时，它会显示一个 Network\
  \ 对话框，显示三个选项卡：Wi-Fi、有线和代理（参见图 10-3）。\n\n![Image](img/image-460.png) ![Image](img/image-461.png)\n\
  \n图 10-3：网络（系统设置）Wi-Fi 和历史\n\n在 Wi-Fi 选项卡上，可用的无线连接列在右侧。选择一个项目创建一个齿轮按钮，点击它可以打开网络对话框，其中带有\
  \ Details、Security、Identity、IPv4、IPv6 和 Reset 选项卡。Details 显示强度、速度、安全方法、IP 和硬件地址、路由以及\
  \ DNS 服务器地址。要手动编辑连接，使用 Security、Identity 和 IP 标签。Security  显示一个菜单，你可以从中选择安全方法和密码（参见图\
  \ 10-4）。\n\n![Image](img/image-462.png)\n\n图 10-4：网络无线配置：Security tab\n\n在 Identity\
  \ 标签上，你可以指定 `SSID` 名称、选择防火墙区域、选择登录时自动连接以及是否将连接设置为系统范围（其他用户可用）（参见图 10-5）。\n\n![Image](img/image-463.png)\n\
  \n图 10-5：网络无线配置：Identity tab\n\n在 IPv4 设置标签页上，开关允许你开启或关闭 IP 连接。有地址、DNS 服务器和路由部分（参见图\
  \ 10-6）。Addresses 菜单让你选择你想要的连接类型。默认情况下，它设置为“自动”。如果你将其更改为“手动”，会出现地址、子掩码和网关的新条目。在\
  \ IPv6 标签上，子掩码被前缀取代。你可以关闭 DNS 和 Routes 部分的自动开关以使其手动化。DNS 部分有一个加号按钮，允许你添加更多 DNS 服务器。\n\
  \n![Image](img/image-464.png)\n\n图 10-6：网络无线配置：IP tabs, manual\n\n\n\n\n\n为了快速访问已配置的网络，您可以点击\
  \ `Known Networks` 按钮打开 `Known Networks` 对话框，其中列出了您所有配置的网络（参见图 10-3）。使用网络名称右侧的播放按钮启动和停止网络。配置按钮可打开该网络的配置对话框。要删除网络，点击其复选框，这将激活左下角的\
  \ `Forget` 按钮，然后点击该按钮。\n\n`Networking` 对话框的 `Wired` 选项卡显示有关有线连接的信息，如 `IP`、`hardware`\
  \ 和 `DNS` 服务器地址。右下角显示有一个齿轮按钮。开关允许您开启或关闭连接（参见图 10-7）。点击扳手按钮打开配置对话框，包含 `Details`、`Security`、`Identity`、`IPv4`、`IPv6`\
  \ 和 `Reset` 选项卡（参见图 10-8）。\n\n![Image](img/image-465.png)\n图 10-7: 网络有线选项卡\n\n![Image](img/image-466.png)\n\
  图 10-8: 网络有线配置对话框\n\n您可以使用 `Security`、`Identity` 和 `IP` 选项卡来手动配置连接。`Security` 选项卡允许您开启\
  \ `802.1` 安全性并选择验证方法，以及提供用户名和密码（参见图 10-9）。\n\n![Image](img/image-467.png)\n图 10-9:\
  \ 网络有线配置，Security\n\n在 `Identity` 选项卡上，您可以选择防火墙区域、设置名称、选择硬件地址、设置 `MTU` 块、选择自动连接，以及是否使连接对全系统范围（参见图\
  \ 10-10）。\n\n![Image](img/image-468.png)\n图 10-10: 网络有线配置，Identity\n\n在 `IPv` 选项卡上，开关允许您开启或关闭连接。该选项卡分为\
  \ `Addresses`、`DNS servers` 和 `Routes` 部分。`DNS` 和 `Routs` 有一个自动开关。关闭开关允许您手动输入 `DNS`\
  \ 服务器地址或路由信息。从 `Addresses` 菜单中，您还可以选择使连接变为自动或手动。当选择手动时，会出现新条目允许您输入地址、`netmask` 和\
  \ `gateway`（参见图 10-11）。在 `IPv6` 选项卡上，`Netmask` 条目被 `Prefix` 条目取代。\n\n![Image](img/image-469.png)\
  \ ![Image](img/image-470.png)\n图 10-11: 网络有线配置，IPv4\n\n在 `Network` 对话框上，可以通过点击左下角的加号按钮添加新连接。打开的对话框允许您添加\
  \ `VPN`、`Bod`、`Bridge` 或 `VLAN` 连接。除了 `VPN` 连接外，这些所有连接都会在 `nm-connections-editor`\
  \ (Network Connections) 中打开相应的对话框。`VPN` 连接仅打开一个可以加载 `VPN` 连接文件的对话框。对于 `VPN` 配置，您应该使用后续章节介绍的\
  \ `nm-connections-editor` (Network Connections)。\n\n## 使用 nm-connections-editor\
  \ (Network Connection) 手动配置 Network Manager\n\n您还可以使用旧版本的 `nm-connection-editor`\
  \ (Network Connections) 来编辑任何网络连接，该程序可以通过 `Network Manager` 组件的菜单中的 `Network Connections`\
  \ 以及 `Preferences` 菜单进行访问（参见图 10-2）。这会打开 `Network Manager` 的 `Network Connections`\
  \ 窗口，如图图 10-12 所示。\n\n![Image](img/image-471.png)\n图 10-12: 网络配置\n\n列出了已建立的连接，并带有\
  \ `Add`、`Edit` 和 `Delete` 按钮用于添加、编辑和删除网络连接。您的当前网络连接应该列在那里，它们是自动检测的。在图 10-3 中有一个名为\
  \ `Wired connection 1` 的有线以太网连接，第一个以太网连接。这是 `Network Manager` 在自动连接到有线网络时设置的自动配置。\n\
  \n当您添加连接时，可以从下拉菜单中选择连接类型（参见图 10-13）。菜单将连接类型分为三类：`Hardware`、`Virtual` 和 `VPN`（虚拟专用网络）（参见图\
  \ 10-14）。硬件连接涵盖了有线（`Ethernet`、`DSL` 和 `Infiniband`）和无线连接（`Wi-Fi`、`WiMax` 和 `Mobile\
  \ Broadband`）。`VPN` 列出了支持 `VPN` 类型，如 `OpenVPN`、`PPTP` 和 `Cisco`（安装额外的）。您还可以导入以前配置过的连接。`Virtual`\
  \ 支持 `VLAN`、`Bridge` 和 `Bond` 虚拟连接。\n\n![Image](img/image-472.png)\n图 10-13: 选择连接\n\
  \n![Image](img/image-473.png)\n图 10-14: 连接类型\n\n## Identity 选项卡\n\n在 `Identity`\
  \ 选项卡上，您可以选择防火墙区域、设置名称、选择硬件地址、设置 `MTU` 块、选择自动连接，以及是否使连接对全系统范围（参见图 10-10）。\n\n![Image](img/image-468.png)\n\
  图 10-10: 网络有线配置，Identity\n\n## 有线配置\n\n在 `IPv` 选项卡上，开关允许您开启或关闭连接。该选项卡分为 `Addresses`、`DNS\
  \ servers` 和 `Routes` 部分。`DNS` 和 `Routs` 有一个自动开关。关闭开关允许您手动输入 `DNS` 服务器地址或路由信息。从\
  \ `Addresses` 菜单中，您还可以选择使连接变为自动或手动。当选择手动时，会出现新条目允许您输入地址、`netmask` 和 `gateway`（参见图\
  \ 10-11）。在 `IPv6` 选项卡上，`Netmask` 条目被 `Prefix` 条目取代。\n\n## Network 对话框\n\n在 `Network`\
  \ 对话框上，可以通过点击左下角的加号按钮添加新连接。打开的对话框允许您添加 `VPN`、`Bod`、`Bridge` 或 `VLAN` 连接。除了 `VPN`\
  \ 连接外，这些所有连接都会在 `nm-connections-editor` (Network Connections) 中打开相应的对话框。`VPN` 连接仅打开一个可以加载\
  \ `VPN` 连接文件的对话框。\n\n\n\n\n`802.1` 标签页允许在网络支持的情况下配置 802.1 安全性（参见图 10-19）。它支持 `MD5`、`TLS`、`FAST`、`Tunneled\
  \ TLS` 和 `Protected EAP` 方法。\n\n![Image](img/image-478.png)\n\n图 10-19：802.1 安全配置\n\
  \n`DCB` 标签允许在网络支持的情况下配置数据中心桥接（Data Center Bridging）。`DCB` 为互联网协议提供了扩展，以更好地管理高速连接，例如存储区域网络\
  \ (SAN) 连接和数据中心光纤。支持的连接包括以太网光纤通道 (`FCoE` 和 `FIP` (`光纤通道初始化协议`)) 以及 `iSCSI`。对于每种连接，你可以设置流量控制优先级（优先级暂停传输传输）和优先级组优先级。\n\
  \n### 无线配置\n无线连接列在网络连接窗口的 Wi-Fi 列表中。要添加或编辑无线连接，请使用添加或编辑按钮。当你点击编辑按钮时，会打开编辑窗口，其中包含无线信息、安全、`IPv4`\
  \ 和 `IPv6` 设置的标签（参见图 10-20）。在 `Wi-Fi` 标签上，你指定你的 `SSID` 以及你的 `Mode` 和 `MAC` 地址。\n\
  \n![Image](img/image-479.png)\n\n图 10-20：无线配置\n\n在 `Wi-Fi Security` 标签上，你输入无线连接连接安全方法（参见图\
  \ 10-21）。支持常用的方法 `WEP`，以及 `WPA personal`。`WPA personal` 方法只需要密码。还支持更安全的连接，如 `Dynamic\
  \ WEP` 和 `Enterprise WPA`。这些连接需要更多的配置信息，例如身份验证方法、证书和密钥。\n\n在 `IPv4 Settings` 标签上，你输入无线连接的网络地址设置。此标签与有线连接上的\
  \ `IPv4 Setting` 相同（参见图 10-8）。你有相同的选项：`DHCP`、带有 DNS 地址的 `DHCP`、`Manual`（手动）、`Link-local\
  \ only` 和 `Shared`（共享）。如果你的无线连接使用 `IPv6` 协议，你将使用 `IPv6 Settings` 标签，它与有线连接上的 `IPv6\
  \ Settings` 相同（参见图 10-18）。\n\n![Image](img/image-480.png) ![Image](img/image-481.png)\n\
  \n图 10-21：无线安全：WEP 和 WPA\n\n### DSL 配置\n要添加或编辑直接的 `DSL` 连接，请点击网络连接窗口 `DSL` 标签上的添加或编辑按钮。将打开\
  \ `DSL` 连接窗口，显示 `DSL` 配置以及有线、`PPP` 和 `IPv4` 网络连接的标签。在 `DSL` 标签上，你输入你的 `DSL` 用户名、服务提供商和密码（参见图\
  \ 10-22）。有线连接需要 `MAC` 地址和 `MTU` 字节数。`PPP` 标签与移动宽带使用的相同，`IPv4` 与用于有线、无线和移动宽带连接的 `IPv4\
  \ Settings` 标签相同（参见图 10-17）。\n\n![Image](img/image-482.png)\n\n图 10-22：DSL 手动配置\n\
  \n### 移动宽带：3G 支持\n移动宽带 `3G` 连接列在 `Mobile Broadband` 标签中。对于新的宽带连接，点击添加按钮。将启动 `3G`\
  \ 向向，帮助你为特定的 `3G` 服务设置适当的配置（参见图 10-23）。配置步骤列在左窗格上。如果你的设备已连接，你可以从右窗格的下拉菜单中选择它。在下一步，你选择你的国家。随后\
  \ `3G` 向导会显示服务提供商窗口，列出 `3G` 服务提供商（参见图 10-24）。然后你选择计费计划。在最后一步，你被要求确认你的选择。\n\n![Image](img/image-483.png)\n\
  \n图 10-23：3G 向导\n\n一旦选择了服务，你可以通过点击 `Mobile Broadband` 标签中的条目并点击编辑按钮来进一步编辑配置。编辑窗口打开，带有\
  \ `Mobile Broadband`、`PPP` 和 `IPv4` 设置的标签。在 `Mobile Broadband` 标签上，你可以输入你的号码、用户名和密码。高级选项包括\
  \ `APN`、`Network` 和 `PIN`（参见图 10-25）。`APN` 应该已经输入。\n\n![Image](img/image-484.png)\n\
  \n图 10-24：3G 提供商列表\n\n### PPP 配置\n对于无线宽带或 `DSL` 连接，你也可以指定 `PPP` 信息。`PPP` 标签与用于移动宽带的相同，`IPv4`\
  \ 与用于有线、无线和移动宽带连接的 `IPv4 Settings` 标签相同（参见图 10-17）。\n\n\n\n`nmcli` 命令是 NetworkManager\
  \ 的命令行接口。大多数网络配置任务都可以通过 `nmcli` 完成。`nmcli` 命令通过一组对象来管理 NetworkManager：通用 (`g`)、网络\
  \ (`n`)、无线 (`r`)、连接 (`c`)、设备 (`d`) 和代理 (`a`)。每个对象都可以使用全名或唯一前缀进行引用，例如使用 `con` 表示连接，或使用\
  \ `dev` 表示设备。唯一前缀可以短到单个字符，例如代表通用的 `g`、代表连接的 `c` 或代表设备的 `d`。请参见表 10-2 获取对象列表和常用选项。`nmcli`\
  \ 的帮助页提供了带有示例的完整列表。\n\n通用对象（general）显示 NetworkManager 的当前状态以及启用了哪些设备。你可以使用 `-t`（简洁模式）和\
  \ `-f`（字段）选项来限制显示的信息。`STATE` 字段显示连接状态，`CONNECTIVITY` 字段显示连接性。\n\n```\n$ nmcli general\
  \ STATE CONNECTIVITY WIFI-HW WIFI WWAN-HW WWAN connected full enabled enabled enabled\
  \ enabled\n$ nmcli -t -f STATE general connected\n```\n\n连接对象（connection）引用网络连接，`show`\
  \ 显示相关信息。下面的示例显示了你当前的连接。\n\n```\nnmcli connection show\n```\n\n你可以用 `c` 代替 `connection`，并用\
  \ `s` 代替 `show`。\n\n```\n$ nmcli c s NAME UUID TYPE DEVICE enp7s0 f7202f6d-fc66-4b81-8962-69b71202efc\
  \ 802-3-ethernet enp7s0 AT&T LTE 1 65913b39-789a-488c-9559-28ea6341d9e1 gsm --\n\
  ```\n\n与通用对象一样，你可以使用 `-f` 选项限制显示的字段。以下仅列出名称和类型字段。\n\n```\n$ nmcli -f name, type\
  \ c s NAME TYPE enp7s0 802-3-ethernet AT&T LTE 1 gsm\n```\n\n| 对象 | 描述 |\n| :---\
  \ | :--- |\n| general | NetworkManager 状态和启用的设备。使用简洁 (`-t`) 和字段 (`-f`) 选项限制显示的信息。\
  \ |\n| networking | 管理网络，使用 `on` 和 `off` 开启或关闭网络，使用 `connectivity` 查看连接状态。 |\n|\
  \ radio | 开启或关闭无线网络（on 或 off）。可以开启或关闭特定类型的无线：wifi、wwan（移动宽带）和 wimax。`all` 选项开启或关闭所有无线。\
  \ |\n| connection | 管理网络连接。`show` 列出连接配置文件。使用 `--active` 仅显示激活连接。`up` 激活连接 `down`\
  \ 禁用连接 `add` 添加新连接并指定类型、ifname、con-name（配置文件）。`modify` 编辑现有连接，使用 `+` 和 `-` 为属性添加新值\
  \ `edit` 使用交互式编辑器添加新连接或编辑现有连接 `delete` 删除已配置的连接（配置文件）`reload` 重新加载所有连接配置 `load`\
  \ 重新加载或加载特定的 |\n| device | 管理网络接口（设备）。`status` 显示设备状态 `show` 显示设备信息 `connect` 连接设备\
  \ `disconnect` 断开设备连接 `delete` 删除软件设备（如网桥）。`wifi` 显示可用 wifi 热点列表 `wifi rescan` 重新扫描并显示热点\
  \ `wifi connect` 连接到 wifi 网络；指定密码、wep-key-type、ifname、bssid 和 name（配置文件名）`wimax`\
  \ 列出可用的 WiMAX 网络 |\n| agent | 作为 Network Manager 密钥代理或 polkit 代理运行。`secret` 作为密钥代理，`nmcli`\
  \ 监听密钥请求。`polkit` 作为 polkit 代理，监听所有授权请求。 |\n\n表 10-2：`nmcli` 对象\n\n添加 `--active`\
  \ 选项将只显示激活的连接。\n\n```\nnmcli c s --active\n```\n\n要启动和停止连接（如 `ifconfig` 操作），请使用\
  \ `up` 和 `down` 选项。\n\n```\nnmcli con up enp7s0.\n```\n\n使用 `device` 对象来管理你的网络设备。`show`\
  \ 和 `status` 选项提供有关设备的信息。要检查所有网络设备的状态，请使用 `device` 对象和 `status` 选项：\n\n```\nnmcli\
  \ device status\nDEVICE TYPE STATE CONNECTION enp7s0 ethernet connected enp7s0 wlp6s0\
  \ wifi disconnected -- lo loopback unmanaged --\n```\n\n你可以将 `device` 和 `status`\
  \ 缩写为 `d` 和 `s`。\n\n```\nnmcli d s\n```\n\n你还使用 `device` 对象来连接和断开设备。使用 `connect`\
  \ 或 `disconnect` 选项配合设备的接口名称 (`ifname`)，在本例中 `enp7s0`。使用 `delete` 选项可以删除设备。\n\n\
  ```\nnmcli device disconnect enp7s0\nnmcli device connect enp7s0\n```\n\n要开启或关闭网络，你使用\
  \ `networking` 对象以及 `on` 和 `off` 选项。使用 `connectivity` 选项检查网络连通性。networking 对象本身会告诉你它是否启用。\n\
  \n```\n$ nmcli networking enabled\n$ nmcli networking on\n$ nmcli networking full\n\
  ```\n\n\n\n你也可以使用交互式编辑器来修改连接。在连接名后使用 `edit` 而不是 `modify` 选项。\n\n```\nnmcli con edit\
  \ enp7s0\n```\n\n随后你将进入交互式编辑器，此时会显示 `nmcli>` 提示符，并列出你可以更改的设置。使用 `help` 命令列出可用命令。使用\
  \ `describe` 命令显示属性描述。\n\n使用 `print` 显示属性的当前值，使用 `set` 更改其值。要查看某个设置的所有属性，请使用 `print`\
  \ 命令和设置名称。完成更改后，使用 `save` 命令使更改生效。\n\n```\nprint ipv4\nprint ipv4.dns\nprint connection\n\
  set ipv4.address 192.168.0.1\n```\n\n连接编辑命令还可以通过 `id` 选项引用配置（profile）。连接配置信息中的 `Name`\
  \ 字段与 `ID` 相同。此外，每个配置都都被分配了一个唯一的系统 UUID，它也可以用于引用该配置。\n\n一旦完成连接的编辑，输入 `quit` 命令退出编辑器。\n\
  \n#### **nmcli 无线连接**\n\n要查看你所在区域所有可用的 wifi 连接列表，你需要对 `device` 对象使用 `wifi` 选项。你可以通过添加\
  \ `ifname` 选项（如果你有多个接口）以及通过 `bssid` 选项（BSSID）来进一步限定范围。\n\n```\nnmcli device wifi\n\
  ```\n\n要连接到新的 Wifi 网络，使用 `wifi` `connect` 选项和 SSID。你可以进一步指定密码、`wep-key-type`、`key`、`ifname`、`bssid`、`name`（配置名称）以及是否为私有。如果不提供\
  \ `name`（配置名称），`nmcli` 将为你生成一个。\n\n```\nnmcli dev wifi connect surfturtle password\
  \ mypass wep-key-type wpa ifname wlp6s0 name my-wireless1\n```\n\n要重新连接到你之前设置过的\
  \ Wifi 网络，请使用 `connection` 对象配合 `up` 命令以及 `id` 选项来指定配置名称。\n\n```\nnmcli connection\
  \ up id my-wireless1\n```\n\n你还可以使用 `connection` 对象和 `wifi` 类型以及 `ssid` 选项添加新的无线连接。\n\
  \n```\nnmcli con add con-name my-wireless2 ifname wlp6s0 type wifi ssid ssidname\n\
  ```\n\n然后，要设置加密类型，使用 `modify` 命令设置 `sec.key-mgmt` 属性；对于密码口令，设置 `wifi-sec.psk` 属性。\n\
  \n```\nnmcli con mod my-wirless2 wifi-sec.key-mgmt wpa-psk\nnmcli con modify my-wireless2\
  \ wifi-sec.psk mypassword\n```\n\n## **拨号 PPP 调制解调器访问：wvdial**\n\n对于直接拨号 PPP 调制解调器连接，你可以使用\
  \ `wvdial` 拨号器，这是一个智能拨号器不仅可以拨号 ISP 服务，还能执行登录操作并提供你的用户名和密码。`wvdial` 工具可以在命令行通过 `wvdial`\
  \ 命令运行，也可以在桌面配合 GNOME PPP 应用 (`gnome-ppp`) 使用。`wvdial` 程序首先从 `/etc/wvdial.conf`\
  \ 文件加载配置。在该文件中，你可以放置调制解调器和账户信息，包括调制解调器速度、ISP 电话号码、用户名和密码。\n\n`wvdial.conf` 文件分节组织，以方括号括起的节标签开头。每个节包含不同参数的变量并进行赋值，例如\
  \ `username = chris`。默认节包含被其他节继承的默认值，因此你不需要重复它们。表 10-3 列出了 `wvdial` 变量。*\n\n你可以使用\
  \ `wvdialconf` 实用程序来创建一个默认的 `wvdial.conf` 文件，自动检测你的调制解调器并为基本功能设置默认值。然后你可以编辑 `wvdial.conf`\
  \ 文件并通过输入你的拨号信息来修改 `Phone`、`Username` 和 `Password` 条目。删除前面的分号（`;`）可以取消该项目的注释。任何以分号（`;`）开头的行都会作为注释忽略。\n\
  \n```\nwvdialconf\n```\n\n| 变量 | 说明 |\n| :--- | :--- |\n| Inherits | 显式继承自指定的节。默认情况下，节继承自\
  \ [Dialer Defaults] 节。 |\n| Modem | `wvdial` 应作为调制解调器使用的设备。默认是 `/dev/modem`。 |\n\
  | Baud | `wvdial` 与你的调制解调器通信的速度。默认是 57,600 波特。 |\n| Init1...Init9 | 指定调制解调器使用的初始化字符串；`wvdial`\
  \ 最多可以使用 9 个。`Init1` 默认是“ATZ”。 |\n| Phone | 你希望 `wvdial` 拨打的电话号码。 |\n| Area Code\
  \ | 指定区号（如果有）。 |\n| Dial Prefix | 指定所需的拨号前缀——例如，用 70 禁用呼叫等待或用 9 表示外线。 |\n| Dial\
  \ Command | 指定拨号操作。默认是“ATDT”。 |\n| Login | 指定你在 ISP 使用的用户名。 |\n| Login Prompt |\
  \ 如果你的 ISP 有不寻常登录提示，可以在此处指定。 |\n| Password | 指定你在 ISP 使用的密码。 |\n| Password Prompt\
  \ | 如果你的 ISP 有不寻常密码提示，可以在此处指定。 |\n| Force Address | 指定使用的静态 IP 地址（对于提供静态 IP 地址的\
  \ ISP）。 |\n| Auto Reconnect | 如果启用，`wvdial` 在被对方断开连接时尝试重新建立连接。此选项默认开启。 |\n\n表 10-3：wvdial\
  \ 变量\n\n你还可以创建一个命名拨号器。这对于你有多个需要登录的位置或服务非常有帮助。\n\n要启动 `wvdial`，在终端窗口输入 `wvdial` 命令，它将从\
  \ `/etc/wvdial.conf` 读取连接信息；`wvdial` 会拨号并启动 PPP 连接，并在需要时提供用户名密码。\n\n```\nwvdial\n\
  ```\n\n你可以在 `/etc/wvdial.conf` 中设置任意数量的连接配置。要选择一个，将其标签作为参数传递 `wvdial` 命令，所示：\n\n\
  ```\nwvdial mylocation\n```\n\n## **Netplan**\n\nNetplan 用于配置和设置你的网络连接。`/etc/netplan`\
  \ 目录持有配置网络设备的网络和服务接口信息。实际配置文件在系统启动时生成并放置在 `/var/run/systemd/network` 目录下。`/etc`\
  \ 目录下没有固定配置文件。`/etc/netplan` 目录下的简单 Netplan 配置文件用于生成网络配置文件。`/etc/netplan` 文件使用 YAML（一种数据标记语言）编写，并扩展名为\
  \ `.yaml`。这种方法提供了一种抽象层，使得不同可用网络设备的配置更加灵活。默认网络服务是 `networkd`，它用于 Ubuntu 服务器。但你也可以\
  \ NetworkManager (`network-manager`)。你可以在此处获取更多关于 Netplan 的信息：\n\nhttps://netplan.io](https://netplan.io)\n\
  \n使用 `networkctl status` 命令检查网络连接的状态。\n\n```\nnetworkctl status\n```\n\n有关特定设备的信息请在状态命令后添加设备名称。\n\
  \n```\nnetworkctl status enp7s0\n```\n\n可以在以下位置找到 Netplan 配置文件的示例：\n\n/usr/share/doc/netplan.io/examples\n\
  \n包括静态、无线、NetworkManager、dhcp、网桥、聚合和 VLAN 的示例。\n\n\n\nNetplan 配置文件位于 `/etc/netplan`\
  \ 目录。Linux Mint Cinnamon 发行版为 NetworkManager 生成了一个 Netplan 配置文件 `1-network-manager-all.yaml`。NetworkManager\
  \ 是 Linux Mint Cinnamon 的默认网络管理器。你可以编辑此文件以为更多设备添加配置，也可以添加更多配置文件，Netplan 会读取每个文件，并在\
  \ `/var/run/systemd/network` 目录下生成相应的运行时配置文件。由于 NetworkManager 设计用于配置多个设备，因此你只需要这一个\
  \ Netplan 配置文件。但对于 `networkd-systemd` 等其他网络管理器，你可能需要不同类型的网络设备（如以太网和 Wi-Fi）准备不同的文件，或者为每个设备准备一个文件。配置文件名通常以数字开头，默认以\
  \ `1-` 开始，尽管也可以是任何名称。创建新文件的简单方法是从 `/usr/share/doc/netplan.io/examples` 拷贝默认文件或示例文件然后进行编辑。\n\
  \nNetplan 配置文件由键组成，包含高层配置定义（适用于不同类型的设备，如 `nets`）以及用于配置设备的低级 ID。文件以顶层 `network:`\
  \ 键开头，随后是 Netplan 版本（在本例中为版本 2）。`renderer:` ID 指定了要使用的网络服务。对于 Linux Mint，这是 `NetworkManager`。Linux\
  \ Mint 默认使用 NetworkManager 而不是 `systemd-networkd`，这极大地简化了它的默认 Netplan 配置文件。该文件仅包含渲染器信息，因为\
  \ NetworkManager 处理了所有细节。你应该使用系统设置中的“网络”或“网络连接”来配置你的网络。\n\n`/etc/netplan/1-network-manager-all.yaml`\n\
  \n```yaml\n# 让 NetworkManager 管理此系统上的所有设备\nnetwork:\n  version: 2\n  renderer: NetworkManager\n\
  ```\n\n对于其他类型的连接（如 `systemd-networkd`），你可以使用额外的额外的键。对于有线连接，配置类型为 `ethernets:`。在\
  \ `ethernets:` 下，列出了可用网络设备的键。在每个设备下，是用于配置该设备的 ID。在 DHCP 连接的情况下，你通常只需要一个 `dhcp:`。也可以列出其他\
  \ ID，例如用于静态连接的 `address:` 或用于网关地址的 `gateway:`。这里显示了一个示例配置。\n\nNetworkManager 的运行时配置文件位于\
  \ `/run/NetworkManager/system-connections` 目录，名称为 `netplan` 加上设备名，例如 `netplan-enp7s0`。\n\
  \n## 使用 systemd-networkd 配置网络\n\n名为 `systemd-networkd` 的基于 systemd 的管理器目前可用于基本操作。你可以将其作为\
  \ NetworkManager 等大型管理器的小型、快速且简单的替代方案。systemd 在第 5 章中进行了详细描述。`systemd-networkd`\
  \ 的服务、目标套套文件位于 `/lib/systemd/system`：`systemd-networkd.service`、`systemd-networkd.target`\
  \ 和 `systemd-networkd.socket`。网络解析操作由 `systemd-resolved.service` 处理。`systemd-networkd`\
  \ 的用户配置文件位于 `/etc/systemd/network`。\n\n在 `systemd-networkd.service` 文件中启用了若干安全特性。能力边界集（`CapabilityBoundingSet`）允许你将内核能力限制为指定的项。`capabilities`\
  \ 的手册页列出了所有可用能力。`CAP_NET` 能力将 networkd 服务限制在网络操作上，如接口配置、防火墙管理、多播、套接、广播和代理。`CAP_SET`\
  \ 能力允许处理文件和进程的 GID 和 UID。`CAP_CHOWN`、`CAP_DAC_OVERRIDE` 和 `CAP_FOWNER` 能力用于绕过权限检查。未包含提供系统管理能力的\
  \ `CAP_SYS` 能力。此外，`ProtectSystem` 选项（`systemd.exec`）防止服务对系统进行任何更改（该服务的 `/usr`、`/boot`\
  \ 和 `/etc` 目录为只读）。`ProtectHome` 选项使得 `/home`、`/root` 和 `/run/user` 目录不可访问。`WatchdogSec`\
  \ 设置服务的计时超时。查看 `systemd.directives` 手页获取所有 systemd 指令列表。\n\n```ini\nsystemd-networkd.service\n\
  [Unit]\nDescription=Network Service\nDocumentation=man:systemd-networkd.service(8)\n\
  ConditionCapability=CAP_NET_ADMIN\nDefaultDependencies=no\n# 一旦 tuntap 移动到 netlink，就可以删除\
  \ systemd-udevd.service\nAfter=systemd-udevd.service network-pre.target systemd-sysusers.service\
  \ systemd-sysctl.service\nBefore=network.target multi-user.target shutdown.target\n\
  Conflicts=shutdown.target\nWants=network.target\n\n[Service]\nType=notify\nRestart=on-failure\n\
  RestartSec=0\nExecStart=!!/lib/systemd/systemd-networkd\nWatchdogSec=3min\nUser=systemd-network\n\
  CapabilityBoundingSet=CAP_NET_ADMIN CAP_NET_BIND_SERVICE CAP_NET_BROADCAST CAP_NET_RAW\n\
  AmbientCapabilities=CAP_NET_ADMIN CAP_NET_BIND_SERVICE CAP_NET_BROADCAST CAP_NET_RAW\n\
  ProtectSystem=strict\nProtectHome=yes\nProtectControlGroups=yes\nProtectKernelModules=yes\n\
  MemoryDenyWriteExecute=yes\nRestrictRealtime=yes\nRestrictAddressFamilies=AF_UNIX\
  \ AF_NETLINK AF_INET AF_INET6 AF_PACKET\nSystemCallFilter=~@clock @cpu\n```\n\n\n\
  \n\nRestrictAddressFamilies=AF_UNIX AF_NETLINK AF_INET AF_INET6\n\nSystemCallFilter=~@clock\
  \ @cpu-emulation @debug @keyring @module @mount @obsolete @raw-io @reboot @swap\n\
  \nSystemCallArchitectures=native\n\nLockPersonality=yes\n\nRuntimeDirectory=systemd/resolve\n\
  \nRuntimeDirectoryPreserve=yes\n\n[Install]\n\nWantedBy=multi-user.target\n\nAlias=dbus-org.freedesktop.resolve1.service\n\
  \n此外，`systemd-networkd-wait-online.service` 会推后其他服务的激活，直到 `systemd-networkd` 服务上线。\n\
  \n### systemd-networkd 的 Netplan 配置文件\n\n你必须为 `systemd-networkd` 服务创建一个 Netplan\
  \ 配置文件。你可以为不同类型的网络设备（如以太网和 Wi-Fi）创建不同的文件，或者为每个设备创建一个不同的文件。配置文件名通常以数字开头，默认以 `1-`\
  \ 开头，但也可以是任何名称。\n\n然后，你需要了解系统上的网络是如何配置的。对于许多系统（特别是使用 DHCP 的系统），这是一个简单的配置；但对于其他系统（例如静态连接），它可能会很复杂。对于本章所示使用标准\
  \ DHCP 连接的系统，你可以直接将 `/usr/share/doc/netplan.io/examples` 目录下的 `dhcp.yaml` 文件复制到\
  \ `/etc/netplan` 目录。在文件名开头加一个数字，例如 `2-`。你可以保留 `/etc/netplan` 中的 `1-network-manager.yaml`\
  \ 文件，以防你想要切换回使用 NetworkManager。\n\n```\ncd /usr/share/doc/netplan.io/examples\n\
  sudo cp dhcp.yaml /etc/netplan/2-dhcp.yaml\n```\n\n如果你还不知道，请使用 `ip link` 命令查找你的以太网设备名称。然后使用如\
  \ `nano` 等文本编辑器编辑 `2-dhcp.yaml`，并将以太网设备名称 `enp3s0` 替换为你系统上对应的名称。你可以使用 `ifconfig`\
  \ 命令来查找设备名称。请务必使用 `sudo` 命令启动编辑器。\n\n```\ncd /etc/netplan\nsudo nano 2-dhcp.yaml\n\
  ```\n\nNetplan 配置文件由键组成，这些键包含适用于不同类型设备（如以太网）的高层配置定义，以及用于配置设备的低层 ID。该文件以顶层 `network:`\
  \ 键开头，随后是 Netplan 版本（在本例中为版本 2）。`renderer:` ID 指定了要使用的网络服务。对于 Ubuntu 服务器，这是 netplan\
  \ 的默认值 `networkd`。对于有线连接，配置类型为 `ethernets:`，如本例所示。在 `ethernets:` 下方列出了可用网络设备的键。在每个设备下方是用于配置它的\
  \ ID。在 DHCP 连接的情况下，你通常只需要一个即 `dhcp:`。也可以列出其他 ID，例如用于静态连接的 `address:` 或用于网关地址的 `gateway:`。最终的结构可能如下所示。\n\
  \n```yaml\n/etc/netplan/2-dhcp.yaml\nnetwork:\n  version: 2\n  renderer: networkd\n\
  \  ethernets:\n    enp7s0:\n      dhcp4: true\n```\n\nNetplan 为网络配置生成的运行时文件将位于 `/var/run/systemd/network`，其名称包含\
  \ \"netplan\" 和网络设备名称，例如 `10-netplan-enp7s0.network`。该文件在启动时自动生成。如果你编辑了 Netplan\
  \ 配置文件或添加了新文件，且不想重启系统，可以使用 Netplan `generate` 命令直接创建运行时配置文件，然后使用 `apply` 命令让 Netplan\
  \ 将该配置应用到你的网络连接。\n\n```\nsudo netplan generate\nsudo netplan apply\n```\n\n然后你必须停止并禁用\
  \ NetworkManager。管理 NetworkManager 的服务脚本是 `network-manager`。\n\n```\nsudo systemctl\
  \ stop network-manager\nsudo systemctl disable network-manager\n```\n\n然后启用并启动 systemd-networkd。\n\
  \n```bash\nsudo systemctl enable systemd-networkd\nsudo systemctl start systemd-networkd\n\
  ```\n\n你可以使用 `networkctl` 命令检查网络设备配置的激活状态。\n\n```\nnetworkctl\n```\n\n### systemd-networkd\
  \ 的 Netplan 无线配置\n\n对于 systemd-networkd 无线设备，你必须编辑 Netplan 配置文件以添加你的无线设备名称、你想要访问的无线网络以及该网络的密码。与其直接编辑默认文件，你可以将\
  \ `2-dhcp.yaml` 文件中的 2 改为 3，并将其命名为 `3-wireless.yaml`。Netplan 会读取 `/etc/netplan`\
  \ 目录下的任何 `yaml` 文件。你可以在 `/usr/share/doc/netplan.io/examples` 找到无线配置示例，但它是用于不支持 DHCP\
  \ 的网络的，且更为复杂。\n\n```\ncd /etc/netplan\nsudo cp 2-dhcp.yaml 3-wireless.yaml\n```\n\
  \n然后编辑文件以添加 Wi-Fi、接入点（accesspoints）、SSID 和密码的键。\n\n```bash\nsudo nano 3-wireless.yaml\n\
  ```\n\n下面是一个无线 Netplan 配置的示例。不再使用 `ethernets:` 定义，而是使用 `wifis:` 定义，随后是无线设备名称的键（例如\
  \ `wlp6s0:`）。\n\n```yaml\n/etc/netplan/3-wireless.yaml\nnetwork:\n  version: 2\n\
  \  renderer: networkd\n  wifis:\n    wlp6s0:\n      dhcp4: true\n      accesspoints:\n\
  \        \"SSID\":\n          password: \"password\"\n```\n\nNetplan 为网络配置生成的运行时文件将位于\
  \ `/var/run/systemd/network`，其名称包含 \"netplan\" 和网络设备名称，例如 `10-netplan-enp7s0.network`。该文件在启动时自动生成。如果你编辑了\
  \ Netplan 配置文件或添加了新文件，且不想重启系统，可以使用 Netplan `generate` 命令直接创建运行时配置文件，然后使用 `apply`\
  \ 命令让 Netplan 将该配置应用到你的网络连接。\n\n```\nsudo netplan generate\nsudo netplan apply\n\
  ```\n\n然后你必须停止并禁用 NetworkManager。管理 NetworkManager 的服务脚本是 `network-manager`。\n\n\
  ```bash\nsudo systemctl stop network-manager\nsudo systemctl disable network-manager\n\
  ```\n\n然后启用并启动 systemd-networkd。\n\n```bash\nsudo systemctl enable systemd-networkd\n\
  sudo systemctl start systemd-networkd\n```\n\n你可以使用 `networkctl` 命令检查网络设备配置的激活状态。\n\
  \n```\nnetworkctl\n```\n\n### 在 systemd-networkd 和 network-manager 之间切换\n\n你最初为\
  \ NetworkManager 创建的 Netplan 配置文件 `1-network-manager.yaml` 仍然位于你的 `/etc/netplan`\
  \ 目录。\n\n要从 systemd-networkd 切换回 NetworkManager，首先使用 `systemctl` 命令停止并禁用 systemd-networkd。\n\
  \n```bash\nsudo systemctl stop systemd-networkd\nsudo systemctl disable systemd-networkd\n\
  ```\n\n然后启用并启动 NetworkManager。使用 NetworkManager 服务名称 `network-manager`。此外，删除或移动\
  \ `/etc/netplan` 目录中的 systemd-networkd netplan 文件，以免其被读取。你也可以直接重命名扩展名。\n\n```bash\n\
  sudo systemctl enable network-manager\nsudo systemctl start network-manager\n```\n\
  \n\n\n\n\n```bash\nsudo mv /etc/netplan/netplan/2-dhcp.yaml /home\n```\n\n你可以使用\
  \ `systemctl` 的 `status` 命令查看你的网络设备是否处于激活或激活状态。\n\n```bash\nsystemctl status systemd-networkd\n\
  systemctl status network-manager\n```\n\n要切换回 `systemd-networkd`，请禁用 `NetworkManager`\
  \ 并启用 `systemd-networkd`。此外，将你的 `systemd-networkd` netplan 文件添加回 `/etc/netplan`\
  \ 目录。\n\n```bash\nsudo systemctl stop network-manager\nsudo systemctl disable network-manager\n\
  sudo systemctl enable systemd-networkd\nsudo systemctl start systemd-networkd\n\
  ```\n\n如果由于某种原因你的 `NetworkManager` 文件从 `/etc/netplan` 目录中丢失，你可以从 netplan.io 文档目录\
  \ `/usr/share/doc/netplan.io/examples` 拷贝 `network_manager.yaml` 文件。\n\n```bash\n\
  cd /usr/share/doc/netplan.io/examples\nsudo cp network_manager.yaml /etc/netplan/1-network-manager.yaml\n\
  ```\n\n然后使用带有 `apply` 选项的 `netplan` 命令生成新的网络配置文件。\n\n```bash\nsudo netplan generate\n\
  sudo netplan apply\n```\n\n## 防火墙\n\n你可以从几种不同的流行防火墙管理工具中选择。Linux Mint 提供了一个名为 Uncomplicated\
  \ Firewall (`ufw`）的防火墙管理工具，它基于 `IPtables`。你也可以选择使用其他流行的管理工具，如 `Firewalld` 和 `Fwbuilder`。`FirewallD`\
  \ 不使用 `IPtables`，而是使用防火墙守护进程。本章将涵盖 `ufw` 和 `FirewallD`。在软件中心管理器或 Synaptic 包管理器中搜索“firewall”可以查看完整列表。\n\
  \n| 端口号 | 服务 |\n| :--- | :--- |\n| 135,137,138 和 445 | Samba 端口和微软发现服务 (445)：135\
  \ 和 445 使用 TCP 协议，137 和 138 使用 UDP 协议。 |\n| 139 | Netbios-ssn |\n| 22 | Secure SHell,\
  \ ssh |\n| 2049 | NFS, Linux 和 Unix 共享 |\n| 631 | IPP，互联网打印协议，访问远程 Linux/Unix 打印机\
  \ |\n| 21 | FTP |\n| 25 | SMTP, 转发邮件 |\n| 110 | POP3, 接收邮件 |\n| 143 | IMAP, 接收邮件\
  \ |\n\n**表 10-4：服务端口**\n\n### 重要防火墙端口\n\n常用的服务（如 Linux 和 Windows 文件共享、FTP 服务器、BitTorrent\
  \ 和 Secure SHell 远程访问）会使用你系统上的某些网络连接端口（见[表 10-4]）。默认防火墙配置会阻止这些端口。你必须配置防火墙以允许访问这些服务所使用的端口，服务才能正常工作。\n\
  \n例如，要访问 Windows 共享，你不仅需要运行 `Samba` 服务，还必须配置防火墙允许访问端口 `135`、`137`、`138`（Samba 服务连接\
  \ Windows 系统使用的端口）以及用于微软网络发现的端口 `445`。特别是，为了允许直接访问系统上检测到的共享 (Avahi)，你必须允许端口 `139`\
  \ 的访问。大多数项目可以在防火墙配置工具（如 `Gufw` 和 `FirewallD`）的预配置项目中轻松选择，但某些项可能未列出。\n\n### 使用 ufw\
  \ 设置防火墙\n\nUncomplicated Firewall (`ufw`）是 Linux Mint 支持的防火墙应用程序。它提供了一个简单的防火墙，可以通过\
  \ `Gufw` 桌面界面或 `ufw` 命令进行管理。与所有防火墙程序一样，`ufw` 使用 `IPtables` 来定义规则并运行防火墙。`ufw` 只是\
  \ `IPtables` 的管理界面。`IPtables` 规则文件存储在 `/etc/ufw` 目录中。默认 `IPtables` 规则保留在 `before`\
  \ 和 `after` 文件中，用户规则位于用户文件中。某些软件包的防火墙配置将放在 `/usr/share/ufw.d` 目录下。`ufw` 防火墙使用 `/lib/systemd/system`\
  \ 目录下的 `ufw.service` 文件启动。你可以在 Ubuntu 防火墙网站 [`wiki.ubuntu.com/UncomplicatedFirewall`](https://wiki.ubuntu.com/UncomplicatedFirewall)\
  \ 以及 Ubuntu Server Guide 中的防火墙章节 [`help.ubuntu.com/lts/serverguide/`](https://help.ubuntu.com/lts/serverguide/)\
  \ 了解更多关于 `ufw` 的信息。Server Guide 还提供了关于如何在 ufw 上实现 IP 伪装（IP Masquerading）的信息。\n\n\
  ### Gufw\n\n`Gufw` 提供了一个易用的 GNOME 界面来管理你的 `ufw` 防火墙。简单的界面让你能够添加自定义和标准规则。`Gufw` 默认安装，可以通过偏好菜单中的“防火墙配置”（Firewall\
  \ Configuration）访问。\n\n![Image](img/image-490.png) ![Image](img/image-491.png)\n\
  \n图 10-30：Gufw\n\n`Gufw` 首次打开时防火墙处于禁用状态且未配置任何端口。`Status` 按钮设置为关闭，盾牌图标将呈灰色。要启用防火墙，只需点击\
  \ `Status` 按钮的左侧将其设置为开启。盾牌图标将变为彩色并列出防火墙规则。\n\n`Gufw` 首次打开时防火墙处于禁用状态且未配置任何端口。`Status`\
  \ 按钮设置为关闭，盾牌图标将呈灰色。要启用防火墙，只需点击 `Status` 按钮的左侧将其设置为开启。盾牌图标将变为彩色并列出防火墙规则。\n\n`Gufw`\
  \ 首次打开时防火墙处于禁用状态且未配置任何端口。`Status` 按钮设置为关闭，盾牌图标将呈灰色。要启用防火墙，只需点击 `Status` 按钮的左侧将其设置为开启。盾牌图标将变为彩色并列出防火墙规则。\n\
  \n![Image](img/image-492.png)\n\n图 10-31：Gufw 预配置规则\n\n\n\n\n\n如果没有预定义的条目，你可以使用`Simple`（简单）选项卡来允许访问端口（参见图\
  \ 10-32）。第一个菜单用于规则（`Allow`允许、`Deny`拒绝、`Reject`拒绝和`Limit`限制），第二个用于协议（`TCP`、`UDP`或两者）。在`Port`文本框中，输入端口号。\n\
  \n![Image](img/image-493.png)\n\n图 10-32：Gufw 简单规则\n\n在`Advanced`（高级）选项卡上，你可以输入更复杂的规则。你可以为`tcp`或`udp`协议设置允许或拒绝规则，并指定入站和出站主机（`ip`）以及端口（参见图\
  \ 10-33）。\n\n![Image](img/image-494.png)\n\n图 10-33：Gufw 高级规则\n\n如果你决定删除某条规则，请在`Rules`部分选中它，然后点击左下角的减号按钮（`-`）。要删除多条规则，点击并按住`Shift-click`或使用`Ctrl-click`选择一组规则，然后点击减号按钮。\n\
  \n你可以通过选中规则并点击编辑按钮（齿轮图标）来编辑任何规则，打开“更新防火墙规则”对话框（参见图 10-34）。对于默认或简单规则，你只能更改少数选项，但你可以开启日志记录。\n\
  \n![Image](img/image-495.png)\n\n图 10-34：Gufw 编辑规则****\n\n你还可以为检测到的活动端口创建规则。点击`Report`（报告）选项卡，选择一个端口并点击选项卡底部的加号按钮。“添加防火墙规则”对话框将打开到`Advanced`选项卡，并显示该端口上激活的服务名称和端口号（参见图\
  \ 10-35）。你可以更改任何选项。端口号已经填写好。\n\n![Image](img/image-496.png)\n\n图 10-35：Gufw 为活动端口创建规则\n\
  \n### ufw 命令\n\n你也可以通过在终端窗口的命令行中输入`ufw`命令来管理你的`ufw`防火墙。`ufw`命令需要管理员权限，并且必须使用`sudo`命令运行。要检查当前防火墙状态并列出允许或阻止的服务，请使用`status`命令。\n\
  \n```\nsudo ufw status\n```\n\n如果防火墙未启用，你首先需要使用`enable`命令启用它。\n\n```bash\nsudo ufw\
  \ enable\n```\n\n你可以使用`service`命令配合`restart`选项来重启防火墙并重新加载你的规则。\n\n```bash\nsudo\
  \ service ufw restart\n```\n\n你可以使用`allow`规则和`deny`规则及其选项来添加规则，具体如表 10-5 中列出的那样。要允许某服务，请指定`allow`规则和服务名称。这是`/etc/services`文件中列出的服务名称。对于连接速率限制，请使用`limit`选项代替`allow`。以下命令允许`ftp`服务。\n\
  \n```bash\nsudo ufw allow ftp\n```\n\n| 命令 | 描述 |\n| :--- | :--- |\n| `enable |\
  \ disable` | 开启或关闭防火墙 |\n| `status` | 显示状态以及允许或拒绝的服务。 |\n| `logging on | off` |\
  \ 开启或关闭日志记录 |\n| `default allow | deny` | 设置默认策略，`allow`为开放，而`deny`是限制性的 |\n| `allow\
  \ *service*` | 通过服务允许访问。服务在`/etc/services`中定义，该文件指定了该服务的端口。 |\n| `allow *port /protocol*`\
  \ | 使用指定的协议允许特定端口的访问。 |\n| `deny *service*` | 拒绝服务的访问 |\n| `delete *rule*` | 删除已安装的规则，使用`allow`、`deny`或`limit`并包含规则细节。\
  \ |\n| `proto*protocol*` | 在`allow`、`deny`或`limit`规则中指定协议 |\n| `from*address*` |\
  \ 在`allow`、`deny`或`limit`规则中指定源地址 |\n| `to*address*` | 在`allow`、`deny`或`limit`规则中指定目的地址\
  \ |\n| `port*port*` | 在`allow`、`deny`或`limit`规则中指定`from`和`to`地址的端口 |\n\n表 10-5：UFW\
  \ 防火墙操作\n\n如果你需要的服务未列在`/etc/services`中，且你知道它使用的端口和协议，可以直接指定端口和协议。例如，Samba 服务使用端口`445`和协议`tcp`（以及其他，详见表\
  \ 10-4）。\n\n```bash\nsudo ufw allow 445/tcp\n```\n\n`status`操作显示防火墙规则当前允许哪些服务。\n\
  \n```bash\nsudo ufw status\nTo Action From 21:tcp ALLOW Anywhere 21:udp ALLOW Anywhere\
  \ 445:tcp ALLOW Anywhere\n```\n\n要删除一条规则，请在`Rules`部分中选中它。\n\n```bash\nsudo ufw status\n\
  ```\n\n\n\n\n你可以在终端窗口中使用以下命令启动 `FirewallD` 守护进程：\n\n```bash\nsudo systemctl start\
  \ firewalld\n```\n\n你可以使用停止命令来关闭它：\n\n```bash\nsudo systemctl stop firewalld\n```\n\
  \n![Image](img/image-498.png)\n\n图 10-37: firewall-config: 永久化配置\n\n从 `View` 菜单可以显示额外的标签，用于配置\
  \ ICMP 类型以及直接添加防火墙规则（直接配置）。\n\n通过 `Options` 菜单，你可以重新加载已保存的防火墙。\n\n防火墙配置是针对特定区域（zone）设置的，例如家庭、工作、内部、外部或公共区域。区域为防火墙提供了额外的保护级别。它们将受\
  \ `Firewall` 保护的网络划分为不同的段，这些段只能在防火墙允许的情况下进行通信。实际上，区域将你网络的一个部分与其他部分隔离开。每个区域都有自己的配置。区域列在\
  \ `firewall-config` 窗口左侧的 `Zone` 滚动列表中（参见图 10-37）。选择你想配置的区域。`firewall-config` 窗口打开时默认是\
  \ Public（公共）。你可以从 `System Default Zone` 对话框选择默认区域（参见图 10-38），该对话框通过 `Options` 菜单中的“Change\
  \ Default Zone”打开。\n\n![Image](img/image-499.png)\n\n图 10-38: 默认区域\n\n![Image](img/image-500.png)\n\
  ![Image](img/image-501.png)  ![Image](img/image-502.png)\n\n图 10-39: 基础区域设置\n\n\
  `Zones` 标签左侧是 `Active Bindings` 部分，它列出了系统上的网络连接、接口和源。对于每个活动连接，系统都会列出与其绑定的区域，例如图\
  \ 10-37 中有线连接绑定的公共区域。要更改与连接绑定的区域，请选择该项目并点击 `Active Binding` 部分底部的 `Change Zone`\
  \ 按钮。这将打开一个 `Select zone` 对话框，你可以在其中选择不同的区域绑定到连接。你可以从 `zones` 标签中的任何区域中进行选择。你也可以通过\
  \ `Options` 菜单选择“Change Zones of Connections”来更改连接绑定。\n\n如果你在 `Current View Menu`\
  \ 中选择 `Permanent Configuration`（永久化配置），`Zone` 滚动列表下方将显示一个区域工具栏，如下所示。加号按钮允许你添加区域，减号按钮允许移除区域。铅笔按钮允许你编辑区域。添加和编辑按钮会打开\
  \ `Base Zone Settings` 对话框，你可以在其中输入或编辑区域名称、版本、描述和目标（参见图 10-39）。默认目标是 `ACCEPT`。其他选项是\
  \ `REJECT` 和 `DROP`。`Load Zone Defaults` 按钮（黄色箭头）加载默认设置，并移除你所做的任何更改。\n\n每个区域可以拥有一个或多个网络连接。从\
  \ `Options` 菜单选择“Change Zones of Connections”打开 `Network Connections` 对话框，你可以在其中添加网络连接。\n\
  \n对于给定区域，你可以配置服务、端口、伪装（masquerading）、端口转发和 ICMP 过滤器（参见图 10-40）。Linux 系统通常用于为网络运行服务器。如果你正在创建一个强防火墙但仍然想要运行如\
  \ Web 服务器、FTP 服务器、Samba 桌面浏览或 SSH 加密连接，你必须在 `Services` 标签中指定它们。Samba 桌面浏览允许从 GNOME\
  \ 桌面访问你的 Samba 共享，例如远程 Windows 文件系统。\n\n![Image](img/image-503.png)\n\n图 10-40:\
  \ 服务设置\n\n对于选定的服务，你可以指定服务设置，如它使用的端口和协议、任何模块以及特定的网络地址。系统已为你设置了默认设置，例如用于 Samba 的端口\
  \ `139`，使用 `TCP` 协议。要修改服务的设置，点击 `Firewall Configuration` 窗口上的 `Services` 标签来列出你的服务。从左侧的\
  \ `Service` 滚动框中选择你想编辑的服务。对于给定的服务，然后可以使用 `Ports and Protocols`、`Modules` 和 `Destination`\
  \ 标签来指定端口、协议、模块和地址。在 `Ports and Protocols` 标签上，点击 `Add` 按钮打开 `Port and/or Protocol`\
  \ 对话框，你可以在其中添加端口或端口范围，并从 `Protocol` 菜单中选择协议（参见图 10-41）。在 `Destination` 标签上，你可以为服务输入\
  \ `IPv4` 或 `IPv6` 目标地址。\n\n![Image](img/image-504.png)\n\n图 10-41: 服务协议和端口\n\n对于\
  \ `Zones`，`Ports` 标签允许你指定可能为某些服务（如 BitTorrent）开放的端口。点击 `Add` 按钮打开对话框，你可以在其中选择端口号以及要控制的协议（`tcp`\
  \ 或 `udp`），或输入特定的端口号或范围。\n\n如果你的系统被用作本地网络访问互联网的网关，你可以实施伪装（masquerading）来隐藏本地主机免受来自互联网的访问。但这还需要\
  \ `IP forwarding`（IP 转发），它在你选择伪装时会自动启用。本地主机仍然能够访问互联网，但伪装成你的网关。伪装仅适用于 IPv4。`Port\
  \ Forwarding` 标签允许你设置端口转发，将传输从一个端口引导到另一个。点击 `Add` 按钮添加端口，指定其协议和目标（参见图 10-42）。\n\n\
  ![Image](img/image-505.png)\n\n图 10-42: 端口转发\n\n`ICMP Filters` 标签允许你阻止 ICMP 消息。默认情况下，允许所有\
  \ ICMP 消息。阻止 ICMP 消息可以使系统更安全。某些类型的 ICMP 消息通常会被阻止，因为它们被渗透或过载系统，例如 `ping` 和 `pong`\
  \ 消息。\n\n如果你有特定的防火墙规则需要添加，请使用 `Direct Configuration` 标签（通过 `View | Direct Configuration`\
  \ 显示）。\n\n![Image](img/image-506.png)\n\n图 10-43: ICMP 过滤器\n\n## GNOME Nettool\n\
  \nGNOME Nettool 工具 `gnome-nettool` 为 `ping` 和 `traceroute` 等网络工具提供了 GNOME 界面，以及用于查询网络用户和主机的\
  \ `Finger`、`Whois` 和 `Lookup`（参见图 10-44）。可以通过 `Administration` 菜单访问 `Network Tools`\
  \ Nettool。第一个标签 `Devices` 描述了连接的网络设备，包括每个设备的配置和传输信息，例如硬件地址和传输字节。列出了所有 `IPv4` 和 `IPv6`\
  \ 主机 IP 地址。\n\n![Image](img/image-507.png)\n\n图 10-44: Gnome 网络工具\n\n## 可预测和不可预测的网络设备名称\n\
  \n\n\n\n网络设备现在使用一种可预测的命名方法，这与旧的命名方法有所不同。名称是根据特定设备引用的网络设备类型、其硬件连接和插槽，甚至其功能生成的。传统的网络设备名称使用\
  \ `eth` 前缀并加上设备数字，来表示以太网网络设备。名称 `eth0` 指的是你计算机上的第一个以太网连接。这种命名方法被认为是不可预测的，因为它没有准确引用真实的以太网设备。旧系统依赖于启动时探测网络驱动，如果你的系统有多个以太网连接，名称可能会根据启动过程的进展而发生切换。在使用\
  \ `systemd` `udev` 版本 `197` 时，命名变为一种可预测的方法，可以指定特定的设备。这种可预测的方法引用了你系统上的实际硬件连接。\n\n\
  用于引用可预测设备连接的名称具有设备类型的前缀，随后是若干限定符，例如硬件类型、使用的插槽和功能编号。不再使用像 `eth0` 这样的旧的不可预测的名称，第一个以太网设备通过类似\
  \ `enp7s0` 的名称进行引用。接口名称 `enp7s0` 引用一个以太网 (en) 连接，位于 pci 插槽 `7` (p7)，热插插槽索引号为 `0`\
  \ (s0)。`wlp6s0` 是一个无线 (wl) 连接，位于 pci 插槽 `6` (p6)，热插插槽索引号为 `0` (s0)。`virvb0` 是一个虚拟\
  \ (vir) 桥接 (vb) 网络接口。表 10-6 列出了可预测命名前缀。\n\n与旧的不可预测名称不同，可预测名称对于每个计算机可能不同。可预测的网络名称及其替代方案请参考：\n\
  \n[`www.freedesktop.org/wiki/Software/systemd/PredictableNetworkInterfaceNames/`](https://www.freedesktop.org/wiki/Software/systemd/PredictableNetworkInterfaceNames/)\n\
  \n命名由内核执行，并描述在内核源码 `systemd/src/udev/udev-bultin-net_id.c` 文件的注释部分。\n\n### 网络设备路径名称\n\
  \n目录 `/sys/devices` 在子目录列出了你所有的设备，包括你的网络设备。设备路径通过以连接设备的总线命名的子目录进行。要快速找到完整路径名称，你可以使用\
  \ `/sys/class` 目录。对于网络设备，使用 `/sys/class/net`。然后使用 `ls -l` 命令列出网络设备及其到 `/sys/devices`\
  \ 目录中完整路径的链接（`../..` 路径引用向上移动两个目录（`class/net`）到达 `/sys` 目录）。\n\n| 名称 | 描述 |\n| :---\
  \ | :--- |\n| sen | 以太网 |\n| sl | 串行 IP (slip) |\n| wl | wlan, 无线局域网 |\n| ww | wwan,\
  \ 无线广域网 (移动宽带) |\n| p | pci 地理位置 (pci-e 插槽) |\n| s | 热插插槽索引号 |\n| o | 板载卡 |\n| f\
  \ | 功能（用于具有多个端口的显卡） |\n| u | USB 端口 |\n| i | USB 端口接口 |\n\n表 10-6: 网络接口设备命名\n\n\
  ```\n$ cd /sys/class/net\n$ ls enp7s0 lo wlp6s0\n$ ls -l total 0\nlrwxrwxrwx 1 root\
  \ root 0 Feb 19 12:27 enp7s0 -> ../../devices/pci0000:00/0000:00:1c.3/0000:07:00.0/net/enp7s0\n\
  lrwxrwxrwx 1 root root 0 Feb 19 12:27 lo -> ../../devices/virtual/net/lo\nlrwxrwxrwx\
  \ 1 root root 0 Feb 19 12:28 wlp6s0 -> ../../devices/pci0000:00/0000:00:1c.2/0000:06:00.0/net/wlp6s0\n\
  ```\n\n因此，`/sys/devices` 目录中 `enp7s0` 的完整路径名称为：\n\n`/sys/devices/pci0000:00/0000:00:1c.3/0000:07:00.0/net/enp7s0`\n\
  \n你可以使用 `lspci` 命令找到使用的 pci 总线插槽。此命令列出你所有的 pci 连接设备。在示例中，使用的 pci 总线插槽为 `7`，这就是为什么名称\
  \ `enp7s0` 的 pci 部分是 `p7`。`s` 部分指热插插槽，在此示例中 `s0`。\n\n```\n$ lspci 06:00.0 Network\
  \ controller: Qualcomm Atheros QCA9565 / AR9565 Wireless Network Adapter (rev 01)\n\
  07:00.0 Ethernet controller: Realtek Semiconductor Co., Ltd. RTL8101/2/6E PCI Express\
  \ Fast/Gigabit Ethernet controller (rev 07)\n```\n\n设备具有 `udev` 定义的某些属性，`udev` 管理所有设备。某些操作（例如\
  \ `systemd` 链接文件）使用了这些属性。`ID_PATH`、`ID_NET_NAME_MAC` 和 `INTERFACE` 属性可用于 `udev`\
  \ 的设备。要显示这些属性，使用 `udevadm` 查询 `udev`。通过 `udevadm info` 和 `-e` 选项可以显示属性。你可以将此输出通过到\
  \ `grep` 以仅显示属性。\n\n### 使用 udev 规则重命名网络设备名称\n\n如果你更改了硬件，例如带有以太网连接的主板，或者如果你使用以太网卡并更改了它的插槽，那么名称将会更改。对于引用特定以太网连接的防火墙规则，这可能会是一个问题。如果你愿意，可以将名称更改为自定义的，甚至可以使用旧的不可预测名称。这样你只需要更新名称更改，而不是所有的规则和任何引用网络设备名称的代码。\n\
  \n你可以通过添加网络设备名称的用户 udev 规则来更改设备名称。使用 udev 规则进行的更改对 NetworkManager 和 systemd-networkd\
  \ 都有效。在 `/etc/udev/rules.d` 目录下，创建一个以 `.rules` 结尾并以小于 80 的数字开头的文件，例如 `70-my-net-names.rules`。`/etc/udev/rules.d`\
  \ 中的 `.rules` 文件优先于 udev 系统目录 `/lib/udev/rules.d` 中的文件。\n\n\n\n\n\n在 udev 规则中，将子系统识别为\
  \ net（`SUBSYSTEM==\"net\"`），将操作识别为 add（`ACTION==\"add\"`），然后是 MAC 地址（`ATTR{address}`）属性。使用\
  \ `ip link` 获取 MAC 地址。MAC 地址也会列在 `udevadm info` 输出的 `ID_NET_NAME_MAC` 条目中（请务必删除前缀并添加中间的冒号）。使用\
  \ `NAME` 字段为设备指定新名称。使用单个 `=` 运算符进行名称赋值。\n\n`/etc/udev/rules.d/70-my-net-names.rules`\n\
  \n```\nSUBSYSTEM==\"net\", ACTION==\"add\", ATTR{address}=\"74:e6:e2:0e:c7:29\"\
  , NAME=\"eth0\"\n```\n\n为了进一步指定设备，你可以添加设备的内核名称（`KERNEL`）。内核名称是 `INTERFACE` 条目。\n\
  \n```\nSUBSYSTEM==\"net\", ACTION==\"add\", ATTR{address}=\"74:e6:e2:0e:c7:29\"\
  , KERNEL==\"enp7s0\", NAME=\"eth0\"\n```\n\n### 使用 systemd.link 为 systemd-networkd\
  \ 重命名网络设备名称\n\nsystemd-networkd 提供了另一种更改网络设备名称的方法（注意，udev 规则同样适用于 systemd-networkd）。要更改名称，你需要在\
  \ `/etc/systemd/network` 目录下创建一个 systemd link 文件。`systemd.link` 手页显示了如何操作。一个 systemd\
  \ link 文件由 `Match` 和 `Link` 区域组成。在 `Match` 部分中，你指定网络设备；在 `Link` 部分，指定你想给它命名的名称。可以通过预测名称（`Path`）或\
  \ MAC 地址（`MACAddress`）引用网络设备。\n\n默认的 systemd link 文件是 `/lib/systemd/network/99-default.link`。该文件只有一个\
  \ `Link` 部分，其中列出了确定名称时使用的策略。`NamePolicy` 键列出了要检查的策略，从内核开始，然后是 udev 数据库、udev 固件板载信息、udev\
  \ 热插插槽信息以及设备路径。在大多数情况下，使用的是插槽策略。`MACAddressPolicy` 被设置为 `persistent`，适用于具有或需要固定\
  \ MAC 地址的设备。\n\n`99-default.link`\n\n```\n[Link]\nNamePolicy=kernel database onboard\
  \ slot path\nMACAddressPolicy=persistent\n```\n\n要重命名设备，你需要在 `/etc/systemd/network`\
  \ 目录下设置 systemd link 文件。`/etc/systemd` 目录的优先级高于 `/lib/systemd` 目录。link 文件由优先级数字、任意名称和\
  \ `.link` 扩展组成组成数字越小优先级越高。在这个示例中，网络设备 `enp7s0` 的名称被更改为 `eth0`。`Match` 部分使用 `Path`\
  \ 键匹配设备路径，使用 udev 提供的 `ID_PATH` 属性。\n\n可以使用 `udevadm info` 命令查询 udev 数据库中关于你的网络设备的信息并匹配该设备。为\
  \ `ID_PATH=` 添加的 `grep` 操作将仅显示 `ID_PATH` 属性。\n\n```bash\n$ udevadm info -e | grep\
  \ -A 22 ^P.*enp7s0 | grep ID_PATH=\nE: ID_PATH=pci-0000:07:00.0\n```\n\n对于 `Path`\
  \ 键，使用 udev 的 `ID_PATH` 值和 `*` 通配符字符匹配路径的剩余部分。`Link` 部分使用 `Name` 键指定新名称。`MacAddressPolicy`\
  \ 应设置为 `persistent`，表示固定连接。link 文件名应以小于 99 的数字开头，以便获得高于 `99-default.link` 文件的优先级。\n\
  \n`10-my-netname.link`\n\n```\n[Match]\nPath=pci-0000:07:00.0-*\n\n[Link]\nName=eth0\n\
  MacAddressPolicy=persistent\n```\n\n除了 `Path` 键，你还可以使用 `MACAddress` 键根据网络设备的硬件地址进行匹配。MAC\
  \ 地址是 udev 的 `ID_NET_NAME_MAC` 属性，去掉了前缀并用冒号分隔。此示例中的 MAC 地址为 `74:e6:e2:0e:c7:29`。你也可以使用\
  \ `ip link` 查找 MAC 地址（`brd` 之前的数字）。\n\n`10-my-netname.link`\n\n```\n[Match]\nMACAddress=74:e6:e2:0e:c7:29\n\
  \n[Link]\nName=eth0\nMacAddressPolicy=persistent\n```\n\n或者，你可以在 `Match` 部分中使用 `OriginalName`\
  \ 键代替 `Path`。原始名称是 udev 的 `INTERFACE` 属性，它也是 `ifconfig` 显示设备名称。\n\n`10-my-netname.link`\n\
  \n```\n[Match]\nOriginalName=enp7s0*\n\n[Link]\nName=eth0\nMacAddressPolicy=persistent\n\
  ```\n\n## 11. Shell 配置\n\nLinux 系统上通常使用四种不同的主要 shell：Bourne Again shell (BASH)、AT&T\
  \ Korn shell (ksh)、TCSH shell 和 Z shell (zsh)。BASH shell 是 Bourne shell 的高级版本，包含了专为\
  \ Korn shell 和 C shell 开发的大部分高级功能。TCSH 是 C shell 的增强版本，最初是为 BSD 版本的 UNIX 的。AT&T\
  \ UNIX Korn shell 是开源的。Z shell 是 Korn shell 的增强版本。尽管它们在 UNIX 中的对应版本差异很大，但 Linux\
  \ shell 共享了许多相同特性。在 UNIX 中，Bourne shell 缺乏在其他 UNIX shell 中发现的功能。但在 Linux 中，BASH\
  \ shell 整合了 Korn shell、C shell 以及 TCSH shell 的所有高级功能。这四种 shell 均可用，尽管 BASH shell\
  \ 是默认 shell。\n\n| 命令 |  |\n| :--- | :--- |\n| bash | BASH shell, `/bin/bash` |\n\
  | bsh | BASH shell, `/bin/bsh` (链接到 `/bin/bash`) |\n| sh | BASH shell, `/bin/sh`\
  \ (链接到 `/bin/bash`) |\n| tcsh | TCSH shell, `/usr/tcsh` |\n| csh | TCSH shell ,\
  \ `/bin/csh` |\n| ksh | Korn shell, `/bin/ksh` (链接到 `/bin/ksh`) |\n| zsh | Z shell,\
  \ `/bin/zsh` |\n\n表 11-1：Shell 调用命令\n\nLinux 系统上常用四种不同的主要 shell：BASH shell 是绝大多数\
  \ Linux 发行版的默认 shell。如果你登录命令行界面，将自动进入默认 shell 并获得 shell 提示符。BASH shell 的提示符是美元符号\
  \ (`$`)。在 GNOME 等 GUI 中，你可以打开终端窗口。通过输入其名称切换到其他 shell。输入 tcsh 调用 TCSH shell，bash\
  \ 调用 BASH shell，ksh 调用 Korn shell，zsh 调用 Z shell。可以通过按 ctrl-d 或使用 `exit` 命令退出 shell。工作只需要一种\
  \ shell。表显示了你可以用于调用不同 shell 的命令。\n\n## Shell 初始化与配置\n\n每种类型的 shell 都有自己的初始化和配置文件。TCSH\
  \ shell 使用 `.login`、`.tcshrc` 和 `.logout` 文件代替 `.profile` 和 `.bash_logout`。Z shell\
  \ 有几个初始化文件：`.zshenv`、`.zlogin`、`.zprofile`、`.zshrc` 和 `.zlogout`。详情见表。检查每个 shell\
  \ 的手页以了解它们通常如何配置。安装 shell 时，这些文件的默认版本会自动放置在用户的家目录下。除了 TCSH shell，所有 shell 在变量定义和赋值语法上非常相似（TCSH\
  \ 使用略有不同的语法，见其手页）。\n\n| 文件名 | 功能 |\n| :--- | :--- |\n| BASH Shell | |\n| .profile\
  \ | 登录初始化文件 |\n| .bashrc | BASH shell 配置文件 |\n| .bash_logout | 退出名称 |\n| .bash_history\
  \ | 历史文件 |\n| /etc/profile | 系统登录初始化文件 |\n\n\n\n\n\n| `/etc/bash.bashrc` | 系统 BASH\
  \ shell 配置文件 |\n| `/etc/profile.d` | 专门的 BASH shell 配置文件的目录 |\n| `/etc/bash_completion`\
  \ | 应用程序补全选项 |\n| TCSH Shell |  |\n| `.login` | 登录初始化文件 |\n| `.tcshrc` | TCSH shell\
  \ 配置文件 |\n| `.logout` | 注销文件 |\n| Z Shell |  |\n| `.zshenv` | Shell 登录文件（首次读取） |\n\
  | `.zprofile` | 登录初始化文件 |\n| `.zlogin` | Shell 登录文件 |\n| `.zshrc` | Z shell 配置文件\
  \ |\n| `.zlogout` | 注销文件 |\n| Korn Shell |  |\n| `.profile` | 登录初始化文件 |\n| `.kshrc`\
  \ | KORN shell 配置文件 |\n\n**表 11-2: Shell 配置文件**\n\n## 配置目录与文件\n\n应用程序通常会在用户的家目录下安装配置文件，这些文件包含特定的配置信息，可以根据该特定用户的需要定制应用程序。这可能表现为一个以点开头的单个配置文件，或者是一个包含多个配置文件的目录。目录名也会以点开头。例如，Mozilla\
  \ 在用户家目录下安装了一个名为 `.mozilla` 的目录，其中包含配置文件。另一方面，许多邮件应用程序使用一个名为 `.mailrc` 的单文件来存储用户设置的别名和功能设置，但像\
  \ Evolution 这样的其他程序也有自己的 `.evolution`。大多数单配置文件以字母 `rc` 结尾。`FTP` 使用一个名为 `.netrc`\
  \ 的文件。大多数新闻阅读器使用名为 `.newsrc` 的文件。配置文件中的条目通常由应用程序设置，但你通常可以通过直接编辑文件来创建条目。应用程序有自己的特殊变量集，你可以在其中定义并分配值。你可以使用\
  \ `ls -a` 命令列出家目录中的配置文件。\n\n## 别名 (Aliases)\n\n你可以使用 `alias` 命令为命令创建另一个名称。`alias`\
  \ 命令的工作原理类似于一个宏，会展开为它所代表的命令。`alias` 并没有字面上地替换命令的名字；它只是为该命令提供了另一个名称。别名命令以关键字 `alias`\
  \ 开头，后面是命令的新名称，然后是等号和别名将引用的命令。\n\n注意：在 `alias` 命令使用的等号周围不要留空格。\n\n在下一个示例中，`list`\
  \ 成为 `ls` 命令的另一个名称：\n\n```\n$ alias list=ls\n$ ls mydata today\n$ list mydata today\n\
  ```\n\n如果你想让别名被自动定义，必须在 shell 配置文件中输入 `alias` 操作。在 Linux Mint 上，别名定义在用户的 `.bashrc`\
  \ 文件或 `.bash_aliases` 文件中。要使用 `.bash_aliases` 文件，你必须首先取消 `.bashrc` 文件中读取 `.bash_aliases`\
  \ 文件的命令的注释。只需编辑 `.bashrc` 文件并删除前面的 `#`，使其看起来像像所示所示：\n\n```bash\nif [ -f ~/.bash_aliases\
  \ ]; then\n. ~/.bash_aliases\nfi\n```\n\n你也可以直接将别名放在 `.bashrc` 文件中。有些别名已经定义了，但被注释掉了。你可以编辑\
  \ `.bashrc` 文件并移除这些行中的 `#` 注释符号来激活这些别名。\n\n```bash\n# some more ls aliases\nalias\
  \ ll='ls -l'\nalias la='ls -A'\nalias l='ls -CF'\n```\n\n### 命令与选项的别名\n\n你也可以使用别名来代替命令及其选项，但你需要将命令和选项都封装在单引号内。任何包含空格的已别名命令也必须封装在单引号中。在下一个示例中，别名\
  \ `lss` 引用带有 `-s` 选项的 `ls` 命令，别名 `lsa` 引用带有 `-F` 选项的 `ls` 命令。带有 `-s` 选项的 `ls` 命令列出文件及其块大小，而带有\
  \ `-F` 选项的 `ls` 则在目录名后加上斜杠。注意单引号是如何封装命令及其选项的。\n\n```bash\n$ alias lss='ls -s'\n\
  $ lss mydata 14 today 6 reports 1\n$ alias lsa='ls -F'\n$ lsa mydata today reports/\n\
  ```\n\n别名有助于简化复杂操作。在下一个示例中，`listlong` 成为带有 `-l` 选项的 `ls` 命令的另一个名称（列出所有文件信息的长格式），以及用于人类可读格式文件大小的\
  \ `-h` 选项。确保将命令及其参数封装在单引号内，以便它们被视为一个参数，而不是被 shell 解析。\n\n```bash\n$ alias listlong='ls\
  \ -lh'\n$ listlong -rw-r--r-- 1 root root 51K Sep 18 2008 mydata -rw-r--r-- 1 root\
  \ root 16K Sep 27 2008 today\n```\n\n### 命令与参数的别名\n\n你可能经常使用别名来包含带有参数的命令名。如果你经常执行一个带有复杂特殊字符组合参数的命令，你可能想对其设置别名。例如，假设你经常只列出源代码和目标文件——那些以\
  \ `.c` 或 `.o` 结尾的文件。你需要使用 `ls` 配合特殊字符组合如 `.[co]` 这样的参数。相反，你可以为 `ls` 设置别名。在下一个示例中，用户为\
  \ `ls [co]` 创建了 `lsc` 别名，简单的如下：\n\n```bash\n$ alias lsc='ls [co]'\n$ lsc main.c\n\
  ```\n\n\n\n\n\n三个常用的特性是 `ignoreeof`、`noclobber` 和 `noglob`。表 11-3 列出了这些不同的特性，以及\
  \ `set` 命令。设置 `ignoreeof` 可以启用一项功能，防止你通过 `ctrl-d` 退出用户 shell。`ctrl-d` 不仅用于退出用户 shell，还用于结束直接输入到标准输入的用户输入。`ctrl-d`\
  \ 经常用于 `Mail` 程序或诸如 `cat` 等实用程序。在这种情况下，你可以很容易地输入额外的 `ctrl-d` 并意外注销。`ignoreeof` 特性可以防止这种意外的注销。在接下来的示例中，使用\
  \ `set` 命令配合 `-o` 选项开启 `ignoreeof` 特性。用户随后只有输入 `logout` 命令才能注销。\n\n```\n$ set -o\
  \ ignoreeof\n$ ctrl-d Use exit to logout\n```\n\n## 环境变量与子壳：export\n\n当你登录账户时，Linux\
  \ 会生成你的用户 shell。在这个 shell 中，你可以发布命令并声明变量。你还可以创建和执行 shell 脚本。然而，当你执行 shell 脚本时，系统会生成一个子壳。你有两个\
  \ shell：你登录的这一个和一个为脚本生成的那个。在脚本 shell 中，你可以执行另一个 shell 脚本，该脚本随后会有它自己的 shell。当脚本执行完毕后，它的\
  \ shell 会终止，你返回到执行它的 shell。从这个意义上说，你可以有许多 shell，每个都嵌套在另一个内部。你在 shell 中定义的变量对该 shell\
  \ 是局部的。如果你在 shell 脚本中定义了一个变量，那么当脚本运行时，该变量将在脚本的 shell 中定义，并对该 shell 是局部的。其他 shell\
  \ 无法引用该变量。在某种意义上，该变量隐藏在它的 shell 中。\n\n| Shell 变量 |  |\n| :--- | :--- |\n| BASH |\
  \ 存储 BASH 命令的完整路径 |\n| BASH_VERSION | 显示当前 BASH 版本号 |\n| GROUPS | 用户所属的组 |\n| HISTCMD\
  \ | 当前命令在历史列表中的编号 |\n| HOME | 用户主目录的路径名 |\n| HOSTNAME | 主机名 |\n| HOSTTYPE | 显示主机运行的机器类型\
  \ |\n| OLDPWD | 上一个工作目录 |\n| OSTYPE | 使用的操作系统 |\n| PATH | 用于搜索可执行命令的目录的路径名列表 |\n\
  | PPID | shell 父级 shell 的进程 ID |\n| PWD | 用户的工作目录 |\n| RANDOM | 被引用时生成随机数 |\n| SHLVL\
  \ | 当前 shell 级，已调用的 shell 数量 |\n| UID | 当前用户的用户 ID |\n\n**表 11-4：由 shell 设置的 shell\
  \ 变量**\n\n你可以在所有类型的 shell 中定义环境变量，包括 `BASH` shell、`Z` shell 和 `TCSH` shell。然而，在\
  \ `BASH` shell 中实现环境变量的策略与 `TCSH` shell 不同。在 `BASH` shell 中，环境变量是被导出（export）的。也就是说，在每个子壳中都会创建一个环境变量的副本。例如，如果导出了\
  \ `EDITOR` 变量，系统会自动在每个子壳中为你定义它的副本。相反，在 `TCSH` shell 中，环境变量只定义一次，并可以被任何子壳直接引用。\n\n\
  在 `BASH` shell 中，环境变量可以被看作带有额外能力的普通变量。要创建一个环境变量，你对已已经定义的变量应用 `export` 命令。`export`\
  \ 命令指示系统为生成的每个新 shell 定义该变量的副本。每个新 shell 都将拥有该环境变量的副本。这个过程被称为导出变量（exporting variables）。将导出的环境变量视为全局变量是错误的。新\
  \ shell 永远无法引用自身之外的变量。相反，系统会为新 shell 生成一个带有其值的变量副本。\n\n## 使用 shell 参数配置你的 shell\n\
  \n当你登录时，Linux 会为你的登录 shell 设置某些参数。这些参数以变量或特性的形式存在。有关如何设置特性的描述，请参见前一节“控制 shell 操作”。Linux\
  \ 为 shell 和系统使用保留了一组预定义的变量。这些变量实际上被分配了系统值，从而设置了参数。Linux 设置了你可以用于配置用户 shell 的参数 shell\
  \ 变量。这些参数 shell 变量中的许多是在你登录时由系统定义的。某些参数 shell 变量由 shell 自动设置，另一些则由后文描述的初始化脚本设置。某些\
  \ shell 变量由 shell 直接设置，另一些仅供其使用。这些其他变量中的许多是特定于应用程序的，用于邮件、历史或编辑等任务。从功能上讲，将这些视为系统级变量可能更好，因为它们用于配置你的整个系统，设置诸如你系统上可执行命令的位置或允许的历史命令数等值。查看表\
  \ 11-4 获取 shell 为 shell 特定任务设置的 shell 变量列表；表 11-5 列出了 shell 为支持其他应用程序而使用的变量。\n\n\
  一组保留的关键字被用于这些系统变量的名称。你不应该将这些关键字作为你自己的变量名。系统变量全部使用大写字母，便于识别。shell 特性变量使用小写字母。例如，关键字\
  \ `HOME` 被系统用于定义 `HOME` 变量。`HOME` 是一个特殊的环境变量，存储用户主目录的路径。另一方面，关键字 `noclobber` 用于开启或关闭\
  \ `noclobber` 特性。\n\n### Shell 参数\n\n登录时，Linux 为你的登录 shell 设置的某些参数 shell 参数可以根据你的需要进行修改。然而，某些\
  \ shell 变量的值是不应该更改的。例如，`HOME` 变量存储主目录的路径。`cd` 等命令引用 `HOME` shell 变量中的路径来定位你的主目录。本节描述了其中一些常见的参数变量。\n\
  \n其他参数变量由系统定义并赋予初始值，你可以自由更改。要这样做，你需要重新定义它们并分配新值。例如，`PATH` 变量由系统定义并赋予初始值；它包含命令所在目录的路径。每当你执行命令时，shell\
  \ 都会在这些目录搜索。你可以通过自己重新定义 `PATH` 变量将新目录添加到搜索范围内。\n\n仍然，存在一些系统未定义的参数变量。这些通常是可选功能，例如允许你设置\
  \ `Vi` 编辑器选项的 `EXINIT` 变量。每次登录时，你必须定义并为此类变量赋值。一些常见的参数变量有 `SHELL`、`PATH`、`PS1`、`PS2`\
  \ 和 `MAIL`。`SHELL` 变量存储你登录的 shell 类型程序的路径名。`PATH` 变量列出了搜索 Linux 命令的各个目录列表。`PS1`\
  \ 和 `PS2` 变量存储提示符符号。`MAIL` 变量存储你的邮箱文件的路径名。你可以修改其中任何变量的值来自定义你的 shell。\n\n注意：你可以使用\
  \ `env` 命令获取当前定义的 shell 变量列表。`env` 命令的操作类似于 `set` 命令，但它只列出参数变量。\n\n#### 使用初始化文件\n\
  \n\n\n\n\n你可以使用称为初始化文件的特殊 shell 脚本来自动定义参数变量。`初始化文件`是一个具有特殊命名的 shell 脚本，每当你进入某个 shell\
  \ 时它都会执行。你可以编辑初始化文件，并在其中写入参数变量的定义和赋值。当你进入 shell 时，初始化文件会执行这些定义和赋值，从而用你自己的值有效地初始化参数变量。例如，BASH\
  \ shell 的 `.profile` 文件就是一个每次登录时都会执行的初始化文件。它包含了参数变量的定义和赋值。然而，`.profile` 文件基本上仅仅是一个\
  \ shell 脚本，你可以使用任何文本编辑器（如 Vi 编辑器）对其进行编辑；根据你的需要，更改赋值给参数变量的值。\n\n在 BASH shell 中，所有的参数变量都被设计为环境变量。当你定义或重新定义一个参数变量时，你还需要\
  \ `export` 它以使其成为环境变量。这意味着你对参数变量所做的任何更改都必须伴随着一个 `export` 命令。你会发现，在登录初始化文件 `.profile`\
  \ 的末尾，通常有一个针对其中定义的所有参数变量的 `export` 命令。\n\n### 你的家目录：HOME\n\n`HOME` 变量包含你家目录的路径名。你的家目录是在账户创建时由参数管理员确定的。当你登录时，家目录的路径名会自动读入你的\
  \ `HOME` 变量中。在下一个示例中，`echo` 命令显示了 `HOME` 变量的内容：\n\n```\n$ echo $HOME /home/chris\n\
  ```\n\n当你需要指定家目录的绝对路径名时，通常使用 `HOME` 变量。在下一个示例中，使用 `HOME` 作为家目录路径指定了 `reports` 的绝对路径名：\n\
  \n```\n$ ls $HOME/reports\n```\n\n### 命令位置：PATH\n\n`PATH` 变量包含了一系列由冒号分隔的目录路径。每当执行一个命令时，系统都会在\
  \ `PATH` 变量中列出的路径逐个搜索该命令。例如，系统中的 `cp` 命令位于 `/bin` 目录。该目录路径是 `PATH` 变量中列出的目录之一。每当你执行\
  \ `cp` 命令时，系统都会搜索该路径并找到 `cp` 命令。系统定义并为 `PATH` 分配了一组初始路径名。在 Linux 中，初始路径名是 `/bin`\
  \ 和 `/usr/bin`。\n\n| Shell 变量 |  |\n| :--- | :--- |\n| BASH_VERSION | 显示当前的 BASH\
  \ 版本号 |\n| CDPATH | `cd` 命令的搜索路径 |\n| EXINIT | Ex/Vi 编辑器的初始化命令 |\n| FCEDIT | 历史命令\
  \ `fc` 使用的编辑器。 |\n| GROUPS | 用户所属的组 |\n| HISTFILE | 历史文件的路径名 |\n| HISTSIZE | 历史允许的命令数\
  \ |\n| HISTFILESIZE | 历史文件的行数大小 |\n| HOME | 用户家目录的路径名 |\n| IFS | 字段间分隔符 |\n| IGNOREEOF\
  \ | 如果未设置，EOF 字符将关闭 shell。可以设置为在接受关闭 shell 之前忽略的 EOF 字符数（默认为 10） |\n| INPUTRC |\
  \ 为 Readline（命令行）设置的 `inputrc` 配置文件。默认是当前目录下的 `.inputrc`。大多数 Linux 发行版将其设置为 `/etc/inputrc`\
  \ |\n| LOGNAME | 登录名 |\n| MAIL | 如果未设置 `MAILPATH`，Mail 工具检查的接收消息的特定邮件文件名称 |\n| MAILCHECK\
  \ | 检查收到的邮件的间隔 |\n| MAILPATH | Mail 检查接收消息的邮件文件列表 |\n| HOSTTYPE | Linux 平台，如 i686,\
  \ x86_64 或 ppc |\n| PROMPT_COMMAND | 在每个提示符之前执行的命令，并将结果作为提示符的一部分整合 |\n| HISTFILE\
  \ | 历史文件的路径 |\n| PS1 | 主提示符 |\n| PS2 | 次要提示符 |\n| SHELL | 使用的 shell 路径名 |\n| TERM\
  \ | 终端类型 |\n| TMOUT | shell 等待时间 |\n| USER | 用户名 |\n| UID | 用户 ID（数字） |\n\n**表 11-5：Shell\
  \ 使用的环境变量**\n\n你可以使用称为初始化文件的特殊 shell 脚本来自动定义参数变量。`初始化文件`是一个具有特殊命名的 shell 脚本，每当你进入某个\
  \ shell 时它都会执行。你可以编辑初始化文件，并在其中写入参数变量的定义和赋值。当你进入 shell 时，初始化文件会执行这些定义和赋值，从而用你自己的值有效地初始化参数变量。例如，BASH\
  \ shell 的 `.profile` 文件就是一个每次登录时都会执行的初始化文件。它包含了参数变量的定义和赋值。然而，`.profile` 文件基本上仅仅是一个\
  \ shell 脚本，你可以使用任何文本编辑器（如 Vi 编辑器）对其进行编辑；根据你的需要，更改赋值给参数变量的值。\n\n在 BASH shell 中，所有的参数变量都被设计为环境变量。当你定义或重新定义一个参数变量时，你还需要\
  \ `export` 它以使其成为环境变量。这意味着你对参数变量所做的任何更改都必须伴随着一个 `export` 命令。你会发现，在登录初始化文件 `.profile`\
  \ 的末尾，通常有一个针对其中定义的所有参数变量的 `export` 命令。\n\n### 你的家目录：HOME\n\n`HOME` 变量包含你家目录的路径名。你的家目录是在账户创建时由参数管理员确定的。当你登录时，家目录的路径名会自动读入你的\
  \ `HOME` 变量中。在下一个示例中，`echo` 命令显示了 `HOME` 变量的内容：\n\n```\n$ echo $HOME /home/chris\n\
  ```\n\n当你需要指定家目录的绝对路径名时，通常使用 `HOME` 变量。在下一个示例中，使用 `HOME` 作为家目录路径指定了 `reports` 的绝对路径名：\n\
  \n```\n$ ls $HOME/reports\n```\n\n### 命令位置：PATH\n\n`PATH` 变量包含了一系列由冒号分隔的目录路径。每当执行一个命令时，系统都会在\
  \ `PATH` 变量中列出的路径逐个搜索该命令。例如，系统中的 `cp` 命令位于 `/bin` 目录。该目录路径是 `PATH` 变量中列出的目录之一。每当你执行\
  \ `cp` 命令时，系统都会搜索该路径并找到 `cp` 命令。系统定义并为 `PATH` 分配了一组初始路径名。在 Linux 中，初始路径名是 `/bin`\
  \ 和 `/usr/bin`。\n\n### 指定环境变量：BASH_ENV\n\n`BASH_ENV` 变量持有每当生成 BASH shell 时执行的 BASH\
  \ shell 初始化文件的名称。例如，当执行 BASH shell 脚本时，会检查 `BASH_ENV` 变量，并执行它持有的脚本。`BASH_ENV` 变量通常持有\
  \ `$HOME/.bashrc`。这是用户家目录下的 `.bashrc` 文件。（`.bashrc` 文件在在本章后后部分讨论。）如果你愿意，可以指定不同的文件，用它代替\
  \ `.bashrc` 文件。\n\n### 配置 Shell 提示符\n\n`PS1` 和 `PS2` 变量分别包含主提示符和次要提示符。BASH shell\
  \ 的主提示符是美元符号 ($)。你可以通过给 `PS1` 变量赋值一组新字符来更改提示符。在下一个示例中，shell 提示符被更改为 `->` 符号：\n\n\
  ```\n$ PS1='->' -> export PS1\n\n->\n```\n\n下表列出了配置你的提示符的代码：\n\n| 提示符代码 | 描述 |\n\
  | :--- | :--- |\n| \\! | 当前历史编号 |\n| \\$ | 除 root 用户以外的所有用户使用 $ 作为提示符，root 用户使用\
  \ # 作为提示符 |\n| \\d | 当前日期 |\n| \\# | 仅当前 shell 的历史命令数 |\n\n\n\n\n\n| `\\h` | 主机\
  \ (Hostname) |\n| :--- | :--- |\n| `\\s` | 当前激活的 Shell 类型 |\n| `\\t` | 以小时、分钟、秒表示当天的时间\
  \ |\n| `\\u` | 用户名 (Username) |\n| `\\v` | Shell 版本 |\n| `\\w` | 当前工作目录的完整路径 |\n\
  | `\\W` | 当前工作目录的名称 |\n| `\\\\` | 显示反斜杠字符 |\n| `\\n` | 插入换行 |\n| `\\[ \\]` | 允许输入用于颜色或粗字体等功能的终端特定显示字符\
  \ |\n| `\\nnn` | 以八进制格式指定的字符 |\n\n你可以将提示符（prompt）更改为任何字符集，包括字符串，如下例所示：\n\n```bash\n\
  $ PS1=\"Please enter a command: \" Please enter a command: export PS1 Please enter\
  \ a command: ls mydata /reports\n\nPlease enter a command:\n```\n\n`PS2` 变量持有次级提示符符号，用于需要几行才能完成的命令。默认的次级提示符是`>`。添加的命令行以次级提示符而不是主提示符开头。你可以像更改主提示符一样方便地更改次级提示符，如下：\n\
  \n```bash\n$ PS2=\"@\"\n```\n\n就像 TCSH shell 一样，BASH shell 提供了一组预定义的代码，你可以使用它们来配置提示符。通过这些代码，你可以让时间、你的用户名或目录路径成为提示符的一部分。你甚至可以让提示符显示你即将输入的当前命令的历史事件编号。每个代码前面都有一个\
  \ `\\` 符号：`\\w` 表示当前工作目录，`\\t` 表示时间，`\\u` 表示你的用户名；`!` 将显示下一个历史事件编号。在接下来的示例中，用户将当前工作目录添加到了提示符中：\n\
  \n```bash\n$ PS1=\"\\w $\" /home/dylan $\n```\n\n代码必须包含在引号括的字符串中。如果没有引号，代码字符将不会被求值，它们本身将用用作提示符。`PS1=\\\
  w` 将提示符设置为字符 `\\w`，而不是工作目录。接下来的示例将时间与历史事件编号结合到一个新的提示符中：\n\n```bash\n$ PS1=\"\\t\
  \ \\! ->\"\n```\n\n默认的 BASH 提示符是 `\\s-\\v\\$`，用于显示 shell 类型、shell 版本以及 `$` 符号作为提示符。某些发行版已将其改为更复杂的命令，由用户名、主机名和当前工作目录名称组成。这里显示了一个示例配置。这里显示了一个简单的等效方案，主机中使用\
  \ `@` 符号，最后的提示符符号使用 `$`。主目录用波浪号（~`）表示。\n\n```bash\n$ PS1=\"\\u@\\h:\\w$\" richard@turtle.com:~$\n\
  ```\n\nLinux Mint 还在 `.bashrc` 文件中包含了一些复杂的提示符定义，以支持颜色提示符并检测任何远程用户登录。\n\n### 指定你的新闻服务器\n\
  \n几个 shell 参数变量用于设置网络应用程序（如浏览器或新闻阅读器）使用的值。`NNTPSERVER` 用于设置网络上可访问的远程新闻服务器的值。如果你使用\
  \ ISP，ISP 通常会提供一个可以使用新闻阅读程序访问的 Usenet 新闻服务器。但你必须先为新闻阅读器提供新闻服务器的 IP。这就是 `NNTPSERVER`\
  \ 变量的作用。互联网上的新闻服务器通常使用 NNTP 协议。`NNTPSERVER` 应持有此类新闻服务器的地址。对于许多 ISP 来说，新闻服务器地址是以\
  \ `nntp` 开头的域名。下面的示例将新闻服务器地址 `nntp.myservice.com` 分配给 shell 变量 `NNTPSERVER`。新闻阅读程序自动从\
  \ `NNTPSERVER` 获取新闻服务器地址。通常，此赋值放在 shell 初始化文件 `.profile` 中，以便每次用户登录时都会自动设置。\n\n\
  ```bash\nNNTPSERVER=news.myservice.com\nexport NNTPSERVER\n```\n\n### 配置你的登录 Shell:\
  \ .profile\n\n`.profile` 文件是 BASH shell 的登录初始化文件。它是一个脚本文件，每当用户登录时会自动执行。该文件包含了用于管理你的\
  \ shell 的系统环境变量 shell 命令。它们可以是系统定义变量的重新定义，也可以是定义变量的定义。例如，当你登录时，你的用户 shell 需要知道哪些目录存有\
  \ Linux 命令。它将引用 `PATH` 变量来查找这些目录的路径。但是，必须先为 `PATH` 变量分配这些路径。在 `.profile` 文件中，赋值操作正是做到这一点。因为由于在\
  \ `.profile` 文件中，该赋值会在用户登录时自动执行。\n\n```bash\n.profile\n\n# ~/.profile: 由登录 shell\
  \ 的命令解释器执行。\n# 如果存在 ~/.bash_profile 或 ~/.bash_login，\n# bash(1) 将不会读取此文件。\n# 参见\
  \ /usr/share/doc/bash/examples/startup-files 获取示例。\n# 文件位于 bash-doc 包中。\n# 默认的 umask\
  \ 设置在 /etc/profile 中；要设置 ssh 登录的\n# umask，请安装并配置 libpam-umask 包。\n#umask 022\n#\
  \ 如果运行 bash\nif [ -n \"$BASH_VERSION\" ]; then\n# 如果存在 .bashrc，则包含它\nif [ -f \"\
  $HOME/.bashrc\" ]; then\n      . \"$HOME/.bashrc\"\nfi fi\n# 如果存在 ~/bin 目录，将其加入\
  \ PATH\nif [ -d \"$HOME/bin\" ]; then\nPATH=\"$HOME/bin:$PATH\" fi\n# 如果存在 ~/.local/bin\
  \ 目录，将其加入 PATH\nif [ -d \"$HOME/.local/bin\" ]; then\nPATH=\"$HOME/.local/bin:$PATH\"\
  \ fi\n```\n\n#### 导出变量\n\n你添加到 `.profile` 文件的任何新参数变量都需要使用 `export` 命令进行导出。这使得你进入的任何子\
  \ shell 都能访问它们。你可以通过列出参数在一个命令中导出多个变量。`.profile` 文件不包含变量定义，尽管你可以添加自己的。在这种情况下，`.profile`\
  \ 文件将有一个导出命令，列出文件中定义的所有变量。如果某个变量未包含在列表中，你可能无法访问它。`.bashrc` 文件包含了 `HISTCONTROL` 变量的定义，然后将其导出。你也可以像这里所示\
  \ `NNTPSERVER` 那样将赋值和导出命令合并为一个操作：\n\n```bash\nexport NNTPSERVER=news.myservice.com\n\
  ```\n\n#### 变量赋值\n\n当你创建账户时提供的标准 `.profile` 文件的副本列在接下来的示例中。注意 `PATH` 是如何赋值的。`PATH`\
  \ 是系统已经定义的参数变量。`PATH` 持有搜索你输入的任何命令的目录路径。赋值 `PATH=\"$PATH:$HOME/bin\"` 的效果是重新定义 `PATH`，包含你主目录下的\
  \ `bin` 目录，这样你的 `bin` 目录也将用于搜索任何命令，包括你自己创建的，例如脚本或程序。\n\n如果你希望也搜索当前工作目录，可以使用任何文本编辑器在你的\
  \ `.profile` 文件中添加另一行 `PATH` `PATH=\"$PATH:\"`。你会在 PATH 后面插入一个冒号 `:`。事实上，你可以更改此条目以添加许多你想要搜索的目录。在当前工作目录中自动执行命令可能会带来安全风险，允许任何目录中的文件执行，而不是在特定的目录中执行。修改你的\
  \ `.profile` 文件的示例将在下一节中所示。\n\n```bash\nPATH=\"$PATH:\"\n```\n\n#### 编辑你的 BASH 配置文件脚本\n\
  \n\n\n\n\n你的 `.profile` 初始化文件是一个文本文件，可以像其他文本文件一样用文本编辑器编辑。你可以通过编辑 `.profile` 并使用编辑命令在分配给\
  \ `PATH` 变量的目录路径列表中插入新的目录路径，从而轻松地向你的 `PATH` 添加新目录。你甚至可以添加新的变量定义。然而，如果你这样做，请务必将新变量名包含在\
  \ `export` 命令的参数列表中。例如，如果你的 `.profile` 文件没有对 `EXINIT` 变量的任何定义，你可以编辑该文件并添加新行为 `EXINIT`\
  \ 赋值。定义 `EXINIT='set nu ai'` 将配置 `Vi` 编辑器开启行号和自动缩进。然后，你需要将 `EXINIT` 添加到 `export`\
  \ 命令的参数列表中。当 `.profile` 文件再次执行时，`EXINIT` 变量将被设置为命令 `set nu ai`。当调用 `Vi` 编辑器时，`EXINIT`\
  \ 变量中的命令将被执行，从而自动设置行号和自动缩进选项。\n\n### `.profile`\n\n```bash\n# ~/.profile: 由登录 shell\
  \ 的命令解释器执行。\n\n# 如果存在 ~/.bash_profile 或 ~/.bash_login，\n# bash(1) 不读取此文件。\n\n# 参见\
  \ /usr/share/doc/bash/examples/startup-files 获取示例。\n\n# 文件位于 bash-doc 包中。\n# 默认\
  \ umask 设置在 /etc/profile 中\n#umask 022\n\n# 如果正在运行 bash\nif [ -n \"$BASH_VERSION\"\
  \ ]; then\n# 如果存在 .bashrc 则包含它\nif [ -f \"$HOME/.bashrc\" ]; then . \"$HOME/.bashrc\"\
  \nfi fi\n\n# 设置 PATH 以其包含用户的私有 bin（如果存在）\nif [ -d \"$HOME/bin\" ] ; then\nPATH=\"\
  $HOME/bin:$PATH\" fi\n\n# 设置 PATH 以其包含用户的私有 bin（如果存在）\nif [ -d \"$HOME/.local/bin\"\
  \ ] ; then\nPATH=\"$HOME/.local/bin:$PATH\" fi\n\nHISTSIZE=30\nNNTPSERVER=news.myserver.com\n\
  EXINIT='set nu ai'\nPS1=\"\\w \\$\"\nexport PATH HISTSIZE EXINIT PS1 NNTPSERVER\n\
  ```\n\n在下面的示例中，用户的 `.profile` 经过修改，以包含 `EXINIT` 的定义以及 `PATH`、`PS1` 和 `HISTSIZE`\
  \ 的重新定义。`PATH` 变量末尾添加了冒号以指定当前工作目录，使你能够执行可能位于主目录或工作目录的命令。对 `HISTSIZE` 的重新定义减少了保存的历史事件数量，从系统\
  \ `.profile` 文件中定义的 1,000 个减少到 30 个。对 `PS1` 参数变量的重新定义将提示符更改为仅显示当前工作目录的路径。你在 `.profile`\
  \ 文件中对参数变量所做的任何更改都将覆盖系统 `.profile` 文件早先做的更改。所有这些参数变量随后都通过 `export` 命令导出。\n\n###\
  \ 手动重新执行 .profile 脚本\n\n尽管 `.profile` 脚本在每次登录时都会执行，但在你对其进行更改后，它不会自动重新执行。`.profile`\
  \ 脚本是一个初始化文件，*仅*在每次登录时执行。如果你想利用你所做的任何更改，而无需注销并重新登录，可以使用点符号 (`.`) 命令重新执行 `.profile`\
  \ 脚本。`.profile` 脚本是一个 shell 脚本，和任何 shell 脚本一样，可以使用 `.` 命令执行。\n\n```bash\n$ . .profile\n\
  ```\n\n或者，你可以使用 `source` 命令来执行 `.profile` 初始化文件或任何初始化文件，例如在 `TSH` shell 中使用的 `.login`\
  \ 或 `.bashrc`。\n\n```bash\n$ source .profile\n```\n\n### 系统 Shell Profile 脚本\n\n\
  你的 Linux 系统也有自己的 profile 文件，系统在任何用户登录时都会执行它。这个系统初始化文件简单地称为 `profile`，位于 `/etc` 目录，即\
  \ `/etc/profile`。此文件包含了系统需要为每个用户提供的参数变量定义。在 Linux Mint 上，`/etc/profile` 脚本会检查 `/etc/profile.d`\
  \ 目录下是否有任何运行的 shell 配置脚本，然后运行 `/etc/bash.bashrc` 脚本，该脚本执行了大部分的配置任务。\n\n不同应用程序所需的配置设置数量会让\
  \ `/etc/profile` 文件变得巨大而难以管理。相反，特定于应用程序的任务别名和变量被放在 `/etc/profile.d` 目录下的单独配置文件。针对\
  \ `BASH` 和 `C` shell 都有相应的脚本。`BASH` shell 脚本从 `/etc/profile` 通过以下命令运行。一个 `for` 循环顺序访问每个脚本并使用点\
  \ (`.`) 运算符执行它。\n\n```bash\nfor i in /etc/profile.d/*.sh; do\nif [ -r $i ]; then\n\
  . $i\nfi done\n```\n\n对于基础安装，你将只有一个 `gvfs-bash-completion.sh` 脚本。随着你安装其他 shell 和应用程序，可能会更多。`/etc/profile.d`\
  \ 脚本根据它们配置的任务类型和应用程序进行命名的。由 `BASH` shell 执行的文件以 `.sh` 结尾，而由 `C` shell 执行的文件具有 `.csh`\
  \ 扩展名。`/etc/profile` 脚本还会首先检查 `PS1` 变量是否定义，然后再运行 `/etc/profile.d` 脚本。\n\n以下是系统 `profile`\
  \ 文件的副本：\n\n```bash\n/etc/profile\n\n# /etc/profile: Bourne shell 的系统级 .profile\
  \ 文件\nif [ \"$PS1\" ]; then\n# bash.rc 已经设置了默认的 PS1。\nPS1='\\h:\\w\\$ ' if -f /etc/bashrc\
  \ ]; then . /etc/bashrc\nelse if `id -u` -eq 0 ]; then PS1='# ' fi\n\nif [ -d /etc/profile.d\
  \ ]; then\nfor i in /etc/profile.d/*.sh; do\nif [ -r $i ]; then\n. $i\nfi done unset\
  \ i\n```\n\n### 系统 /etc/bashrc 脚本\n\nLinux Mint 有一个为所有用户执行的系统 **bashrc** 文件，名为 `bashrc`。目前\
  \ `/etc/bashrc` 文件设置默认 shell 提示符、更新窗口大小、识别根目录并检查用户是否有权限使用命令。`/etc/bashrc` 文件的开头所示：\n\
  \n```bash\n# 交互式 bash(1) shell 的系统级 .bashrc 文件。\n# 为了让登录 shell 也启用此文件的设置\n# 此文件必须在\
  \ /etc/profile 中被引用。\n\n# 如果不是交互式运行，不执行任何操作\n[ -z \"$PS1\" ] && return\n\n# 在每个命令后检查窗口大小，并在时\n\
  # 更新 LINES 和 COLUMNS 的值。\nshopt -s checkwinsize\n\n# 设置识别你工作的 chroot 变量（用于下方的提示符）\n\
  if [z \"$debian_chroot\" ] && [ -r /etc/debian_chroot ]; then debian_chroot=$(cat\
  \ /etc/debian_chroot)\nfi 虽然被注释掉了，该文件还包含了将终端窗口标题设置为用户、主机和目录的语句。多个命令定义了终端显示功能和命令操作，包括\
  \ shell 提示符，以 PS1=.\n\n虽然没有启用，但你可以通过移除 `/etc/bash.rc` 文件中的注释字符 (**#**) 来启用 bash\
  \ 补全功能。这将运行 `/usr/share/bash-completion/bash_completion` 脚本，该脚本利用其 **completions**\
  \ 子目录中的配置文件。`bash.bashrc` 文件以未找到命令异常处理结束。\n\n# 在交互式 shell 中启用 bash 补全\nif ! shopt\
  \ -oq posix; then\nif [ -f /usr/share/bash-completion/bash_completion ]; then\n\
  . /usr/share/bash-completion/bash_completion\nelif [ -f /etc/bash_completion ];\
  \ then\n. /etc/bash_completion\nfi\nfi\n```\n\n\n\n`.bash_logout` 文件也是一个配置文件，但它会在用户注销时执行。它的设计是为了在你每次注销时执行任何希望发生的操作。与变量定义不同，`.bash_logout`\
  \ 文件通常包含 shell 命令，构成一种关机程序，即你在注销前总是想要执行的动作为。一种常见的注销命令是清除屏幕然后发送一条告别消息。与 `.profile`\
  \ 一样，你可以在 `.bash_logout` 中添加你自己的 shell 命令。事实上，当你的账户首次创建时，系统并不会为你自动设置 `.bash_logout`\
  \ 文件。你需要使用 `Vi` 或 `Emacs` 编辑器自行创建它。然后你可以从中添加告别消息或其他操作。默认的 `.bash_logout` 文件包含了调用\
  \ `clear_console` 命令来清除屏幕的指令。\n\n```bash\n.bash_logout\n\n# ~/.bash_logout: executed\
  \ by bash(1) when login shell exits.\n\n# when leaving the console clear the screen\
  \ to increase privacy\n\nif [ \"$SHLVL\" = 1 ]; then  [ -x /usr/bin/clear_console\
  \ ] && /usr/bin/clear_console -q fi\n```\n\n## 12. 管理服务\n\n单个 Linux 系统可以提供多种不同类型的服务，范围从安全到管理，并包括更明显的\
  \ Internet 服务，如 Web 和 FTP 站点、电子邮件和打印服务。安全工具，如安全外壳 (SSH) 和 `Kerberos` 以服务的形式运行，以及管理性网络工具，如动态主机配置协议\
  \ (DHCP) 和 `BIND` 域名服务器。网络连接接口本身也是一项服务，你可以随意重启它。每个服务都作为一个持续运行的守护进程，寻找其特定服务的请求。在\
  \ Web 服务的情况下，请求来自远程用户。你可以通过启动或关闭它们的守护进程来开启或关闭服务。\n\n系统启动由 `systemd` 服务管理。用于启动单个服务的原始\
  \ System V init 系统已被淘汰。在之前的 Ubuntu 和 Linux Mint 版本中使用的 Upstart 服务也已弃用。关于从 Upstart\
  \ 切换到 systemd 的信息，请参阅：[`wiki.ubuntu.com/SystemdForUpstartUsers`](https://wiki.ubuntu.com/SystemdForUpstartUsers)\n\
  \n## systemd\n\nLinux 系统传统上使用 Unix System V init 守护进程通过设置启动或关闭的运行级别（runlevels）来管理服务。此后，Linux\
  \ 用 `systemd` init 守护进程替换了 System V init 守护进程。System V init 守护进程通过顺序运行 shell 脚本在系统启动或关闭时启动某些服务，而\
  \ `systemd` 使用套接字（sockets）所有的系统任务和服务。`systemd` 为守护进程设置 socket 并在它们启动时协调它们的工作。这允许\
  \ `systemd` 同时（并行）启动守护进程。如果一个守护进程需要另一个守护进程的支持，`systemd` 会协调它们 socket 中的数据（缓冲），以便一个守护进程接收到另一个守护进程提供的继续所需的的信息。这种并行启动的兼容性允许了极快的启动速度。\n\
  \n实际上，你可以将 `systemd` 视为 System V init 脚本和 `inetd` 守护进程 (xinetd) 的结合，将 socket 激活（socket\
  \ activation）应用于所有系统启动任务和网络服务器。socket 激活的设计最初灵感来自 `inetd` 服务，它使用 socket (`AT_INET`)\
  \ 在接到请求时启动 Internet 守护进程。socket 激活设计被 Apple 的 OS X 系统用于所有 socket (`AF_UNIX`)。这允许所有启动进程同时并行启动，从而实现了极快的启动速度。此类\
  \ socket 由 `systemd` 设置和管理。当 `D-BUS` 需要写入 `journald`（日志记录）时，它写入由 `systemd` 管理的 `systemd-journald`\
  \ socket。它不需要直接与 `journald` 通信。这意味着服务不再需要像在 System V 时代那样按照特定的顺序启动和关闭。它们可以同时启动和停止。此外，由于\
  \ `systemd` 控制着 socket，如果某个服务失败，它的 socket 仍留在那里。可以使用相同的 socket 重启服务，而不会丢失任何信息。`systemd`\
  \ 管理所有类型的 socket，包括 UNIX (system)、`INET` (网络)、`NETLINK` (设备)、`FIFO` (管道) 和 `POSIX`\
  \ (消息)。更多信息请参阅以下内容：\n\n[`docs.fedoraproject.org/quick-docs/en-US/understanding-and-administering-systemd.html`](https://docs.fedoraproject.org/quick-docs/en-US/understanding-and-administering-systemd.html)\
  \ [`wiki.ubuntu.com/SystemdForUpstartUsers`](https://wiki.ubuntu.com/SystemdForUpstartUsers)\
  \ [`www.freedesktop.org/wiki/systemd/`](https://www.freedesktop.org/wiki/systemd/)\n\
  \n`systemd` 为所有系统任务和服务设置 socket。systemd 任务的配置在 `/lib/systemd/system` 中的单元文件中。在这方面，`systemd`\
  \ 文件替换了 `initab` 中的项。`systemd` 还有自己的 `shutdown`、`reboot`、`halt`、`init` 和 `telinit`\
  \ 版本，每个都有相应的手册。\n\n`systemd` 完全兼容 `/etc/init.d` 中的 System V 脚本和 `/etc/fstab` 文件。`/etc/fstab`\
  \ 中的项用于生成单元文件，然后用于管理文件系统。`system` 在需要时使用 `/etc/rc.d` 中的启动和停止优先级来确定依赖关系。`systemd`\
  \ 还支持快照，允许服务恢复到之前的状态。\n\nsystemd 配置 (`.service`) 文件位于 `/lib/systemd/system`，被视为不可修改的系统文件。可以将它们复制到\
  \ `/etc/systemd/system` 并对副本进行修改。`/etc/systemd/system` 中的文件具有优先级。logind 守护进程的配置文件\
  \ `logind.conf` 位于 `/etc/systemd` 目录。某些软件（如 Apache Web 服务器）还没有 systemd 服务文件。`systemd`\
  \ 会在 `/var/run/systemd/generator.late` 目录下自动为它们生成文件。\n\nLinux Mint 也使用 systemd 服务处理时间\
  \ (`timedated`)、位置 (`localed`)、登录 (`logind`) 和主机名 (`hostnamed`) (`systemd-services`\
  \ 软件包)。可以使用相应的 systemd 控制应用程序进行管理：`timedatectl`、`localectl` 和 `hostnamectl`。\n\n\
  ### systemd 基础配置文件\n\n可以使用位于 `/etc/systemd` 目录下的配置文件为系统、登录管理器、用户和日志服务配置 `systemd`。当为系统服务运行时，systemd\
  \ 使用 `system.conf` 文件，否则使用 `user.conf` 文件。你可以设置如日志级别 (LogLevel) 和资源大小限制等选项。有关可用选项的详情，请参阅\
  \ `systemd.conf` (`system.conf` 和 `user.conf`)、`logind.conf` 和 `journald.conf` 的手册页。\n\
  \n\n\n\n`systemd` 将任务组织成单元（units），每个单元都有一个单元配置文件。有几种类型的单元（参见表 12-1）。单元文件的名称带有扩展名，用于指定其类型。服务类型（service）的扩展名为\
  \ `.service`，挂载类型（mount）的扩展名为 `.mount`。服务类型的功能与 System V init 脚本相似。服务可以停止、启动和重启。`systemctl`\
  \ 命令将列出所有单元，包括 `systemd` 生成的单元。\n\n单元也可用于套接字（socket）、设备（device）和挂载（mount）任务。socket\
  \ 类型实现了 `inetd` 和 `xinetd` 使用的连接类型，允许你根据需要启动服务。device 类型引用由 `udev` 检测到的设备。mount\
  \ 类型管理文件系统的挂载点，而 `automount` 则在需要自动挂载时激活该挂载点。automount 单元文件有一个对应的挂载单元文件，它使用该文件来挂载文件系统。同样，socket\
  \ 类型通常有一个对应的服务类型文件，用于为该套接字执行任务。\n\n每个单元内部包含控制服务、套接字、设备或挂载点的指令（directives）。某些指令是特定单元类型独有的。这些指令列在相应的帮助页（man\
  \ page）中，例如服务单元的 `systemd.service` 或挂载单元的 `systemd.mount`（参见表 12-1）。\n\n```\nman\
  \ systemd.service\n```\n\n单元通用的选项列在 `systemd.exec` 和 `systemd.unit` 中。`systemd.unit`\
  \ 页面列出了所有单元通用的指令，如 `Wants`、`Conflicts`、`Before`、`SourcePath` 和 `Also`。`systemd.exec`\
  \ 页面列出了单元执行程序时的选项，例如启动服务器守护进程。这些包括 `User`、`Group`、`WorkingDirectory`、`Nice`、`Umask`\
  \ 和 `Environment` 等选项。`systemd.exec` 页面涵盖了服务、套接字、挂载和交换（swap）单元的选项。`systemd.directives`\
  \ 帮助页提供了所有 systemd 单元选项列表以及每个选项的帮助页。\n\n| 单元类型 | 单元帮助页 | 描述 |\n| :--- | :--- | :---\
  \ |\n| service | systemd.service | 服务，如服务器，可以启动和停止 |\n| socket | systemd.socket\
  \ | 用于服务的套接字（允许类似 inetd 的服务，AF_INET） |\n| device | systemd.device | 设备 |\n| mount\
  \ | systemd.mount | 文件系统挂载点 |\n| automount | systemd.automount | 文件系统的自动挂载点。与 mount\
  \ 单元配合使用。 |\n| target | systemd.target | 组单元 |\n| path | systemd.path | 管理目录 |\n\
  | snapshot | systemd.snapshot | 由 systemd 使用 `systemctl snapshot` 命令创建，用于保存 systemd\
  \ 的运行时状态。使用 `systemctl isolate` 恢复状态。 |\n| swap | systemd.swap | systemd 为交换文件系统生成的交换单元文件。\
  \ |\n| timer | systemd.timer | 基于时间的单元激活。对应服务文件。时间格式在 `systemd.timer` 页面上指定。 |\n\
  | | systemd.unit | 所有单元通用的选项 |\n| | systemd.exec | 执行程序的选项 |\n| | systemd.directives\
  \ | 所有 systemd 单元选项的列表 |\n\n表 12-1: systemd 单元类型\n\n（注：原文在后半部分包含大量重复和乱码字符串。根据“保留核心内容”和“不删除有价值信息”的指令，我处理了前半部分提供的连贯技术描述和表格，忽略了源文件中由于复制粘贴错误导致的未去码/重复文本。）\n\
  \n要管理 `systemd`，你可以使用 `systemctl`。旧的服务管理工具 `service` 已经修改为使用 `systemctl` 来对服务执行操作。\n\
  \n### 单元文件语法\n\n单元文件由括号中指定的关键字指定的部分组织。所有单元都有一个单元部分 `[Unit]` 和一个安装部分 `[Install]`。这些部分的选项在\
  \ `systemd.unit` 帮助页中描述。可以通过以 `#` 或 `;` 字符开头行来编写注释。常用的 Unit 和 Install 部分选项列表参见表\
  \ 12-2。\n\n单元文件的 Unit 部分包含有关单元的通用信息。`Description` 选项提供了关于该单元管理的任务的信息，如下所示的 Vsftpd\
  \ 服务器。\n\nDescription=vsftpd FTP server\n\n`Documentation` 选项列出了应用程序文档的 URI。\n\n\
  Documentation=man:dhcpd(8)\n\n注意：单元文件的语法基于 .desktop 文件，而 .desktop 文件灵感源于 Windows\
  \ ini 文件。.desktop 类型的文件符合 XDB Desktop Entry 规范。\n\n| 单元选项 | 描述 |\n| :--- | :---\
  \ |\n| `[Unit]` |  |\n\n\n\n\n\n| Description | 单元的描述。 |\n| :--- | :--- |\n| Documentation\
  \ | 引用文档的 URI。 |\n| Requires | 服务所需的单元。这是一项强制性要求。如果所需的单元失败，该单元也会失败。 |\n| PartOf\
  \ | 由服务启动和停止的依赖单元。这不是一项强制性要求。如果依赖单元失败，该单元仍会启动。 |\n| Wants | 服务希望的单元。这不是一项强制性要求。如果所需的单元失败，该单元仍会启动。其功能与\
  \ `wants` 目录相同。 |\n| Conflicts | 负向单元依赖关系。启动该单元会停止 `Conflicts` 选项中列出的单元。 |\n| Before\
  \ | 单元排序。该单元在列出的单元之前启动。 |\n| After | 单元排序。该单元等待列出的单元启动后才执行。 |\n| OnFailure | 当单元失败时运行的单元。\
  \ |\n| SourcePath | 生成配置所属的文件，例如从 `/etc/fstab` 生成的挂载单元文件。 |\n| [Install] | |\n|\
  \ WantedBy | 在列出的单元的 `.wants` 子目录中设置单元的符号链接。当列出的单元激活时，该单元也会激活。这不是一项强制性要求。 |\n| RequiredBY\
  \ | 在列出的单元的 `.requires` 子目录中设置单元的符号链接。当列出的单元激活时，该单元也会激活。这是一项强力要求。 |\n| Alias | 单元安装时的额外名称。别名通过指向单元文件的符号链接实现。\
  \ |\n| Also | 与此单元一起安装的额外单元。 |\n\n表 12-2：systemd 单元和 Install 部分选项（适用于所有单元，`systemd.unit`）\n\
  \n`Requires` 选项建立了单元之间的依赖关系。这是一种强依赖关系。如果其中一个失败，另一个也会失败。在以下来自 `graphical.target`\
  \ 单元文件的 `Requires` 选项示例中，只有在多用户目标和救援目标（rescue targets）被激活时，图形目标才能启动。\n\n```\nAfter=multi-user.target\
  \ display-manager.service rescue.service rescue.target\n```\n\n`Wants` 选项建立了一种较弱的依赖关系，要求激活，但发生错误时不会触发失败。图形目标和显示管理器服务（display\
  \ manager service）就是这种情况。\n\n```\nWants=display-manager.service\n```\n\n有多个条件选项可用，例如\
  \ `ConditionACPower`，如果为真，则检查系统是否正在使用交流电源。在下面的示例中，`ConditionPathExists` 检查 `/etc/default`\
  \ 目录下是否存在具有 DHCP 服务器运行时选项的文件。\n\n```\nConditionPathExists=/etc/default/isc-dhcp-server\n\
  ```\n\n某些单元文件由 `systemd` 自动生成，允许你使用较旧的配置方法。例如，用于管理文件系统挂载的单元文件是从 `/etc/fstab` 文件中的配置信息生成的。`SourcePath`\
  \ 选项指定用于生成单元文件的配置文件。这里显示了 `boot.mount` 单元文件的 `SourcePath` 选项。\n\n```\nSourcePath=/etc/fstab\n\
  ```\n\n`Install` 部分提供了单元的安装信息。`WantedBy` 和 `RequiredBy` 选项指定了单元想要或需要的单元。对于管理 `Vsftpd`\
  \ 和 `DCHP` 服务的服务单元，安装部分有一个针对 `multi-user.target` 的 `WantedBy` 选项。它的效果是在运行级别 2、3、4\
  \ 和 5 下运行服务器。当多用户目标被激活时，该单元也会激活。\n\n```\nWantedBy=multi-user.target\n```\n\n`WantedBy`\
  \ 选项通过在被请求的单元的 `wants` 子目录中建立指向该单元的链接来实现。对于 `multi-user.target` 单元，名为 `multi-user.target.wants`\
  \ 的子目录拥有所有想要它的单元的符号链接，例如用于 vsfptd FTP 服务的 `vsftpd.service`。这些 `wants` 符号链接设置在 `/etc/systemd/system`\
  \ 目录下，可以在启用禁用服务时进行更改。禁用服务会移除链接。`RequiredBy` 是一种强得多的依赖关系。\n\n`Alias` 选项列出了可能引用此单元的其他单元名称。在\
  \ `ssh.service` 文件中，你会找到 `sshd.service` 的 `Alias` 选项。\n\n```\nAlias=sshd.service\n\
  ```\n\n`Also` 选项列出了当此单元启动时应该激活的其他单元。CUPS 服务有一个 `Also` 选项来启动 CUPS 套接字（socket）和路径（path）。\n\
  \n```\nAlso=cups.socket cups.path\n```\n\n不同类型的单元有自己的选项。服务、socket、target 和 path\
  \ 单元都有适用于其任务的选项。\n\n### 特殊目标\n\ntarget 文件将服务、挂载、套接字和设备的单元组合在一起。`systemd` 有一组专为特定目的设计的特殊\
  \ target 文件（参见表 12-3）。其中某些用于按需运行的服务，如蓝牙和打印机。当连接蓝牙设备时，`bluetooth` 目标变为激活状态。当你连接打印机时，`printer`\
  \ 目标被激活，进而激活 CUPS 打印服务器。`sound` 目标在系统启动时激活并运行所有声音相关的单元。更多详情见 `special.target` 手页。\n\
  \n有几个特殊的 target 文件旨在实现 System V 中运行级别（runlevels）的功能（参见表 12-4）。这些包括 `rescue`、`multi-user`\
  \ 和 `graphical` 目标。在启动时，`systemd` 激活默认目标，它是一个指向特殊目标的链接，例如 `multi-user.target` 和\
  \ `graphical.target`。你可以通过 GRUB 启动命令行中的 `systemd.unit` 选项覆盖默认目标。在 GRUB 启动菜单中添加以下内容以代替桌面：\n\
  \n```\nsystemd.unit=multi-user.target\n```\n\n| 特殊单元 | 描述 |\n| :--- | :--- |\n|\
  \ basic.target | 在早期启动时运行的单元 |\n| bluetooth.target | 当设备激活时启动 |\n| printer.target\
  \ | 当连接打印机时启动打印服务 |\n| sound.target | 在检测到声音设备时启动，通常在启动时 |\n| display-manager.service\
  \ | 指向 LightDM 或 KDM 等显示服务 |\n| ctrl-alt-del.target | 当用户按下 Ctrl-Alt-Del 键时激活，它是指向\
  \ `reboot.target` 的链接，会重启系统 |\n| system-update.target | 实现离线系统更新。下载后，更新将在系统重启时执行，此时系统会检测该目标的存在\
  \ |\n\n表 12-3：特殊单元\n\n| 特殊运行级别目标 | 描述 |\n| :--- | :--- |\n| default.target | 启动时激活的特殊目标的链接\
  \ |\n| rescue.target | 启动基础系统和救援 shell |\n| emergency.target | 启动基础系统，并可启动完整系统 |\n\
  | multi-user.target | 启动命令行界面、多用户且非图形界面（类似于运行级别 3） |\n| graphical.target | 启动图形界面（桌面）（类似于运行级别\
  \ 5） |\n\n表 12-4：特殊运行级别目标（启动）\n\n```\nmulti-user.target\n\n[Unit]\nDescription=Multi-User\
  \ System\nRequires=basic.target\nConflicts=rescue.service rescue.target\nAfter=basic.target\
  \ rescue.service rescue.target\nAllowIsolate=yes\n```\n\n\n\n\n\n`graphical.target`\
  \ 依赖于 `multi-user.target`。以下是 `graphical.target` 单元文件的副本。它要求 `multi-user.target`\
  \ 必须激活（`Requires`）。任何为 multi-user target 运行的内容（包括服务器）也会为 graphical target（即桌面）运行。桌面目标在\
  \ `multi-user.target` 之后运行（`After`）。它不会在 `rescue.target` 下运行（`Conflicts`）。它还希望显示-manager\
  \ 服务运行（`GDM` 或 `KDM`）（`Wants`）。你可以隔离它以切换到另一个目标（`AllowIsolate`）。\n\n```\ngraphical.target\n\
  \n[Unit]\nDescription=Graphical Interface\nDocumentation=man:systemd.special(7)\n\
  Requires=multi-user.target\nWants=display-manager.service\nConflicts=rescue.service\
  \ rescue.target\nAfter=multi-user.target rescue.service rescue.target display-manager.service\n\
  AllowIsolate=yes\n```\n\n### 修改单元文件：`/etc/systemd/system`\n\n`systemd` 使用单元文件来管理设备、挂载和服务。这些文件位于\
  \ `/lib/systemd/system` 目录，被认为是你不应修改的系统文件。相反，要修改单元文件，你应该将其复制到 `/etc/systemd/system`\
  \ 目录。此目录中的单元文件优先级高于 `/lib/systemd/system` 目录中的文件。然后你可以修改 `/etc/systemd/system` 中的单元文件版本。使用\
  \ `cp` 命令复制文件。以下命令复制了 Samba 服务单元文件。\n\n```\nsudo cp /lib/systemd/system/vsftpd.service\
  \ /etc/systemd/system/vsftpd.service\n```\n\n如果你只想向单元文件中添加单元选项，而不更改 `/lib/systemd/system`\
  \ 版本中的原始选项，则你不需要拷贝原始单元文件。相反，你可以在 `/etc/systemd/system` 中设置对应的新单元文件，包含一个 `include`\
  \ 选项，该选项从 `/lib/systemd/system` 读取原始单元文件。然后，在新的 `/etc/systemd/system` 文件中，你可以添加新的\
  \ `systemd` 选项。\n\n请记住，大多数应用程序的运行时选项（例如 `Vsftpd` 服务器）仍然保留在适当的 `/etc/default` 文件中，例如\
  \ `/etc/default/vsftpd`。该文件在服务激活时会被读取。\n\n如 `vsftpd` 等服务的实际启用或禁用是通过在 `/etc/systemd/system`\
  \ 目录下的 `multi-user.target.wants` 目录中设置或删除符号链接来的。这被认为适用于 `/etc/systemd/system` 的管理类修改。\n\
  \n### 执行环境选项\n\nservice、sockets、mount 和 swap 类型的单元文件共享相同的单元执行环境选项（请参阅 表 12-5）。这些选项位于对应类型的单元部分中，例如服务单元的\
  \ `[Service]` 或 socket 单元的 `[Socket]`。通过这些选项，你可以设置某些功能，如工作目录（`WorkingDirectory`）、文件模式创建掩码（`UMask`）和系统日志级别（`SysLogLevel`）。`Nice`\
  \ 设置默认调度优先级级别。`User` 指定单元运行进程的用户的用户 ID。\n\n`User=mysql`\n\n| Exec options | 描述 |\n\
  | :--- | :--- |\n| WorkingDirectory | 为应用程序设置工作目录。 |\n| RootDirectory | 应用程序的根目录\
  \ |\n| User, Group | 应用程序的用户和组 ID。 |\n| Nice | 为应用程序设置优先级 |\n| CPUSchedulingPriority\
  \ | 应用程序的 CPU 调度优先级。 |\n| UMask | 文件模式创建掩码，默认为 022\\。 |\n| Environment | 为应用程序设置环境变量。\
  \ |\n| StandardOutput | 将标准输出重定向到连接，如日志、控制台或空。 |\n| SysLogLevel | 系统日志级别，如 warn、alert、info\
  \ 或 debug。 |\n| DeviceAllow, DeviceDeny | 控制应用程序访问设备。 |\n| ControlGroup | 将应用程序分配到控制组。\
  \ |\n\n表 12-5：`systemd` exec 选项（Service, Socket, Mount, Swap）（`systemd.exec`)\n\n\
  ### service 单元文件\n\n服务单元文件用于运行应用程序和命令，例如 Samba (`smbd`) 和 Web (`apache2`) 服务器。它们有一个\
  \ `[Service]` 部分，其中选项在 `systemd.service` 手页中进行了指定。请参阅 表 12-6 查看常用服务选项的列表。服务单元文件具有\
  \ `.service` 扩展，前缀是服务器程序的名称，例如用于 DHCP 服务器的 `isc-dhcp-server.service` 和用于 Very Secure\
  \ FTP 服务器的 `vsftpd.service`。表 12-7 列出了几个流行的服务器。\n\n以下是 `Vsftpd` 服务单元文件 `vsftpd.service`\
  \ 的副本。`Vsfptd` FTP 服务在网络启动后启动。指定的运行的服务器程序为 `/usr/sbin/vsftpd`（`ExecStart`）。该服务在系统启动时由\
  \ `multi-user.target`（`WantedBy`）安装。\n\n```\nvsftpd.service\n\n[Unit]\nDescription=Graphical\
  \ Interface\nAfter=network.target\n[Service]\nType=simple\nExecStart=/usr/sbin/vsftpd\
  \ /etc/default/vsftpd.conf\nExecReload=/bin/kill -HUP $MAINPID\nExecStartPre=-/bin/mkdir\
  \ /var/run/vsftpd/empty\n[Install]\nWantedBy=multi-user.target\n```\n\n| Service\
  \ options | 描述 |\n| :--- | :--- |\n| ExecStart | 服务启动时执行的命令，如运行应用程序或服务器。 |\n| Type\
  \ | 启动类型为 simple（默认）、forking、dbus、notify 或 idle |\n| ExecStartPre, ExecPost | ExecStart\
  \ 命令之前之后执行的命令。 |\n| TimeStartSec | 执行 ExecStart 之前等待的时间。 |\n| Restart | 命令结束后重启\
  \ |\n| PermissionsStartOnly | 布尔值，如果为真应用 User 等选项。 |\n| RootDirectoryStartOnly |\
  \ 布尔值，如果为真 RootDirectory 适用于 ExecStart。 |\n\n表 12-6：`systemd` 服务选项 `[Service]` (`systemd.service`)\n\
  \n`bind9.service` 文件更加简单，将运行时选项整合到程序命令中。它在网络服务之后运行并由 `multi-user.target` 启动。\n\n\
  ```\nbind9.service\n\n[Unit]\nDescription=BIND Domain Server\nDocumentation=man:named(8)\n\
  After=network.target\nWants=nss-lookup.target\nBefore=nss-lookup.target\n[Service]\n\
  EnvironmentFile=/etc/default/bind9\nExecStart=/usr/sbin/named -f $OPTIONS\nExecReload=/usr/sbin/rndc\
  \ reload\nExecStop=/usr/sbin/rndc stop\n[Install]\nWantedBy=multi-user.target\n\
  ```\n\n| Service unit files | 描述 |\n| :--- | :--- |\n| apache2 | Apache Web 服务器\
  \ |\n| bind9 | Bind 9 DNS 服务器 |\n| cups | CUPS 打印守护进程 |\n| isc-dhcp-server | 动态主机配置守护进程\
  \ |\n| mysql | MySQL 数据库服务器 |\n| network | 启动或关闭网络连接的操作 |\n| nis | NIS 服务器 |\n|\
  \ nfs-server | 网络文件系统 |\n| postfix | Postfix 邮件服务器 |\n| sendmail | Sendmail MTA\
  \ 守护进程 |\n| smbd | 用于 Windows 主机的 Samba |\n| squid3 | Squid 代理缓存服务器 |\n| ssh | Secure\
  \ Shell 守护进程 |\n| systemd-journald | 系统日志守护进程 |\n| vsftpd | Very Secure FTP 服务器\
  \ |\n| ufw | 控制 UFW 防火墙 |\n\n表 12-7：服务单元文件集合\n\n### System V 脚本和生成的 systemd 服务单元文件：`/etc/init.d`\
  \ 和 `/run/systemd/generator.late`\n\n\n\n\n\n某些服务尚未原生配置供 systemd 使用。它们在安装时没有包含 systemd\
  \ 服务文件。相反，在 `/etc/init.d` 目录下会安装一个 SysV 脚本。`systemd-sysv-generator` 工具会自动读取该脚本，并在\
  \ `/var/run/systemd/generator.late` 目录下生成相应的 systemd 单元文件，该文件反过来将使用该脚本来管理服务。对于 Ubuntu\
  \ 18.04，Squid 代理服务器就是这样一个服务，在 `/etc/init.d` 中有一个 squid 脚本，在 `/var/run/systemd/generator.late`\
  \ 目录下有一个对应的 systemd 服务文件。下面是 `squid.service` 单元文件的副本。它在网络、远程文件系统挂载和名称服务查找之后运行。服务器程序使用\
  \ `/etc/init.d/squid` 脚本运行（`ExecStart`）。同一个脚本也用于加载和停止服务器，但使用了不同的选项（`ExecReload`\
  \ 和 `ExecStop`）。\n\n在 `/run/systemd/generator.late` 目录下存在针对不同运行级别的 `.target.wants`\
  \ 目录，这些目录包含了对于给定运行级别激活的服务链接。这些运行级别 target wants 目录引用了运行级别 target，而这些 target 仅仅是指向\
  \ systemd 多用户 target 和图形 target 的链接。\n\n```ini\nsquid.service\n\n# Automatically\
  \ generated by systemd-sysv-generator\n\n[Unit]\n\nDocumentation=man:systemd-sysv-generator(8)\n\
  SourcePath=/etc/init.d/squid\nDescription=LSB: Squid HTTP Proxy version 3.x\nBefore=multi-user.target\n\
  Before=multi-user.target\nBefore=multi-user.target\nBefore=graphical.target\nAfter=network-online.target\n\
  After=remote-fs.target\nAfter=nss-lookup.target\nWants=network-online.target\n\n\
  [Service]\nType=forking\nRestart=no\nTimeoutSec=5min\nIgnoreSIGPIPE=no\nKillMode=process\n\
  GuessMainPID=no\nRemainAfterExit=yes\nExecStart=/etc/init.d/squid start\nExecStop=/etc/init.d/squid\
  \ stop\nExecReload=/etc/init.d/squid reload\n```\n\n### **按需启动和独立服务 (socket)**\n\
  服务的按需激活（以前由 `inetd` 实现）是 systemd 的默认行为。如果你需要一个独立服务，可以指定它被一个特殊的 target 所需要，这样它会在启动时启动，而不是在第一次激活时启动。在服务单元文件的\
  \ `Install` 部分中，指定 `multi-user.target` 的 `WantedBy` 选项将在启动时启动服务，使其成为独立服务。在接下来，该服务被\
  \ `multi-user.target` 想要。换句话说，该服务在运行级别 2、3、4 和 5 下启动。注意，图形 target (5) 依赖于（Requires）多用户\
  \ target (2, 3 和 4)，因此通过指定多用户 target，该服务也会随着图形 target 一起启动。\n\n```ini\n[Install]\n\
  WantedBy=multi-user.target\n```\n\n蓝牙服务只想要 `bluetooth.target`，该 target 只有在蓝牙设备存在时才会被激活。它在启动时不启动。\n\
  \n```ini\n[Install]\nWantedBy=bluetooth.target\n```\n\n如果你希望服务在所有运行级别下启动，请使用基本 target。\n\
  \n```ini\n[Install]\nWantedBy=basic.target\n```\n\n为了像以前 `inetd` 那样模拟按需服务器服务，你会使用一个\
  \ `.socket` 文件来配合 `.service` 文件。CUPS 就是这种情况，它有一个 cups 服务文件和对应的 cups socket 文件（Server\
  \ 版本的默认不安装 CUPS）。`sockets.target` 的 `WantedBy` 选项将 socket 绑定到特殊 target `sockets.target`，这使得单元变为\
  \ socket 激活的。\n\n`Socket` 部分列出了 socket 的选项，通常是指定监听哪个 socket（`ListenStream`）。`systemd.socket`\
  \ 手页列出了 socket 选项。[表 12-8] 列出了常用选项。\n\n| Socket 选项 | 说明 |\n| :--- | :--- |\n| ListenStream\
  \ | 用于流监听的地址。该地址可以是端口号、socket 设备路径名，或带有端口号的 IPv4 或 IPv6 地址。 |\n| Accept | 如果为 true，则为每个连接设置服务实例；如果为\
  \ false，则为所有连接设置一个服务实例 |\n| MaxConnections | 服务的最大连接数 |\n| Service | socket 激活时运行的服务单元。默认是与\
  \ socket 名称相同的服务名。 |\n\n表 12-8: systemd socket 文件选项 [Socket] (systemd.socket)\n\n\
  ```ini\ncups.socket\n\n[Unit]\nDescription=CUPS Scheduler\nPartOf=cups.service\n\
  \n[Socket]\nListenStream=/var/run/cups/cups.sock\n\n[Install]\nWantedBy=sockets.target\n\
  ```\n\n```ini\ncups.service\n\n[Unit]\nDescription=CUPS Scheduler\nDocumentation=man:cupsd(8)\n\
  After=sssd.service\n\n[Service]\nExecStart=/usr/sbin/cupsd -l\nType=simple\n\n[Install]\n\
  Also=cups.socket cups.path\nWantedBy=printer.target\n```\n\n### **路径单元 (Path units)**\n\
  `systemd` 使用路径单元来监控路径。有时，服务单元有一个对应的路径单元来监控目录，例如 `cups.path` 和 `cups.service` 这种情况。\n\
  \n```ini\ncups.path\n\n[Unit]\nDescription=systemd\nPartOf=cups.service\n\n[Path]\n\
  PathExists=/var/cache/cups\n\n[Install]\nWantedBy=multi-user.target\n```\n\n| path\
  \ 选项 | same |\n| :--- | :--- |\n| PathExists | 文件存在时激活 |\n| PathExistsGlob | 匹配模式的文件时激活\
  \ |\n| PathModified | 文件被修改过时激活 |\n\n表 12-9: path 选项 (systemd.path)\n\n### **模板单元文件\
  \ (Template unit files)**\n有一种特殊的单元类型称为模板文件，它允许生成多个单元文件。模板用于 getty 终端、OpenVPN 连接和\
  \ rsync 连接等服务。模板文件名以 `@` 符号结尾。如果没有找到对应的单元文件，`systemd` 将检查是否有可以应用的模板。`systemd` 将服务名与模板匹配，然后为该服务生成实例单元文件。例如，终端使用\
  \ getty 服务 (TTY)。在配置文件中，使用 `%I` 占位符替换服务名。给定服务名 `tty3`，`%I` 占位符替换为 `tty3`。\n\n```ini\n\
  getty@.service\n\n[Unit]\nDescription=Getty on %I\nDocumentation=man:agetty(8) man:systemd-getty-generator(8)\n\
  Documentation=http://0pointer.de/blog/projects/serial-console.html\nAfter=systemd-user-sessions.service\
  \ plymouth-quit-wait.service\nAfter=rc-local.service\nBefore=getty.target\nIgnoreOnIsolate=yes\n\
  ConditionPathExists=/dev/tty0\n\n[Service]\n# the VT is cleared by TTYVTDisallocate\n\
  ExecStart=-/sbin/agetty --noclear %I $TERM\nType=idle\nRestart=always\nRestartSec=0\n\
  UtmpIdentifier=%I\nTTYPath=/dev/%I\nTTYReset=yes\nTTYVHangup=yes\nTTYVTDisallocate=yes\n\
  KillMode=process\nIgnoreSIGPIPE=no\nSendSIGHUP=yes\n# 取消控制 getty locale，因为控制台显示某些国际化消息时存在问题。\n\
  Environment=LANG= LANGUAGE= LC_CTYPE= LC_NUMERIC= LC_TIME= LC_COLLATE= LC_MONETARY=\
  \ LC_MESSAGES= LC_PAPER= LC_NAME= LC_ADDRESS= LC_TELEPHONE= LC_MEASUREMENT= LC_IDENTIFICATION=\n\
  \n[Install]\nWantedBy=getty.target\nDefaultInstance=tty1\n```\n\n\n\n\n\n在旧的 System\
  \ V 中，Linux 系统可以运行在不同的级别，称为 `runlevels`（运行级别），这取决于你想要赋予它的功能。在 System V 下，Linux 有若干个运行级别，编号从\
  \ 0 到 6。当你启动系统时，会进入默认的运行级别。运行级别 0、1 和 6 是执行特定功能的特殊运行级别。运行级别 0 是关机状态。运行级别 6 是重启状态（它会关闭系统并重启）。运行级别\
  \ 1 是单用户状态，仅允许超级用户（root）访问且不运行任何网络服务。\n\n`systemd` 使用特殊的节点（targets）而不是运行级别来产生与运行级别相同的效果，将服务分组以为指定的目标运行。运行级别不再被直接实现。有两个主要的特殊目标：多用户（multi-user）和图形化（graphical）。多用户目标类似于运行级别\
  \ 3，为你提供命令行登录界面。图形化目标类似于运行级别 5，为你提供图形化登录和界面。\n\n你通过将目标的 `systemd` 服务文件链接（linking）到\
  \ `systemd` 默认目标文件来设置默认目标（运行级别）。此操作取代了以前版本中使用 `inittab` 来指定默认运行级别的方法。以下操作将图形化界面设置为默认（运行级别\
  \ 5）。\n\n```bash\nln -s /lib/systemd/system/graphicl.target /etc/systemd/system/default.target\n\
  ```\n\n`systemd` 确实提供了对运行级别的兼容支持。运行级别的兼容性是通过在 `/lib/system/systemd` 目录中使用符号链接指向\
  \ `systemd` 目标来实现的。`runlevel0.target` 引用了 systemd `poweroff.target`。运行级别 2、3 和 44\
  \ 目标都链接到同一个 `multi-user.target`（命令行界面）。`runlevel6.target` 链接到重启目标，`runlevel5.target`\
  \ 链接到 `graphical.target`（桌面界面）。运行级别及其目标列在表 12-10 中。\n\n| 系统运行级别链接 | systemd 目标 |\n\
  | :--- | :--- |\n| runlevel0 | poweroff.target |\n| runlevel1 | rescue.target |\n\
  | runlevel2 | multi-user.target |\n| runlevel3 | multi-user.target |\n| runlevel4\
  \ | multi-user.target. |\n| runlevel5 | graphical.target. |\n| runlevel6 | reboot.target\
  \ |\n\n表 12-10：系统运行级别（状态）\n\n你仍然可以使用 `runlevel` 命令查看你当前运行在什么状态。它会列出上一个状态，然后是当前状态。如果你没有更改状态，上一个状态将显示为\
  \ N，表示没有上一个状态。在你启动系统时的状态就是如此。在下一个示例中，系统运行在状态 3，且没有之前的状态变化：\n\n```bash\nrunlevel\
  \ N 3\n```\n\n如果你在某个特定的运行级别遇到问题，更改运行级别可能会很有帮助。例如，如果你的显卡没有安装正确，那么任何尝试在运行级别 5（`graphical.target`）启动的操作都可能会失败，因为该级别会立即启动图形界面。相反，你可以使用命令行界面运行级别\
  \ 3（`multi-user.target`）来修复你的显卡。无论你从哪个运行级别启动，你都可以通过 `telinit` 命令从一个运行级别切换到另一个。如果你的默认运行级别是\
  \ 3，在运行级别 3 启动，但你可以用 `telinit` 切换到例如运行级别 5。`telinit` 命令会关闭系统。在下一个示例中，`telinit` 命令切换到运行级别\
  \ 1，即管理状态：\n\n```bash\ntelinit 1\n```\n\n在 `systemd` 实施之前，你可以使用 `init` 来更改运行级别。在\
  \ `systemd` 中，`telinit` 和 `init` 都是 systemd 对原始命令的模拟。`telinit` 命令始终用于更改运行级别。如果你配合运行级别数字使用\
  \ `init`，它现在调用 `telinit` 来完成更改。或者，你可以直接使用 `systemctl` 命令更改运行级别（目标）。带有 `isolate`\
  \ 选项的 `systemctl` 命令切换到该目标（运行级别）。这就是 `telinit` 命令实际所做的：\n\n```bash\nsudo systemctl\
  \ isolate multi-user.target\n```\n\n你也可以使用 `run` 链接。\n\n### systemd 和自动挂载文件：/etc/fstab\n\
  \n带有 `.mount` 扩展名的 `systemd` 单元文件用于挂载系统。通常 `systemd` 会读取 `/etc/fstab` 文件获取挂载信息。如果\
  \ `/etc/systemd` 目录中存在挂载单元，它具有优先级，但 `/etc/fstab` 的优先级高于 `/lib/systemd` 目录中的任何单元文件。`/etc/fstab`\
  \ 文件用于挂载配置。挂载单元文件对应于 `/etc/fstab` 文件的设备路径、挂载点、文件系统类型和挂载选项（参见表 12-11）。`/etc/fstab`\
  \ 文件中的项在启动时被转换为挂载单元，然后由 `systemd` 执行实际挂载操作。这些挂载单元由 `systemd-fstab-generator` 创建，可以在\
  \ `/run/systemd/generator` 目录下找到。fstab 条目在 `/run/systemd/generator` 目录下创建了相应的单元文件：`boot.mount`\
  \ 用于引导系统（`boot-efi.mount` 用于 UEFI 引导系统），`home.mount` 用于主文件系统，以及 `-.mount` 用于根文件系统。对于交换文件系统，生成了一个交换文件。\n\
  \n```text\nUUID=1059a-4a86-4072-982e-000717229bf / ext4 errors=remount-ro 0 1\n\
  UUID-=5537-AF41 /boot/efi vfat umask=0077 0 1\nUUID=147b-4a86-4072-982e-00071729b6g\
  \ /home ext4 default 0 1\n/swapfile\n\n对于此示例，用于根文件系统的 `-.mount` 文件具有以下挂载选项。根目录在挂载文件名中用连字符\
  \ `-` 表示，而不是斜杠 `/`。挂载选项列在 `[Mount]` 部分。\n\n```ini\n[Mount]\nWhere=/\nWhat=/dev/disk/by-uuid/1059a-4a86-4072-982e-000717229bf\n\
  Type=ext4\nOptions=errors=remount-ro\n```\n\n`home.mount` 文件引用主文件系统的分区并将其挂载到 `/home`\
  \ 目录。\n\n```ini\n[Mount]\nWhere=/home\nWhat=/dev/disk/by-uuid/147b-4a86-4072-982e-00071729b6g\n\
  Type=ext4\nFsckPassNo=2\n```\n\n`boot.mount` 文件挂载包含 `/boot` 目录中内核的 ext4 文件系统。\n\n\
  ```ini\n[Mount]\nWhat=/dev/disk/by-uuid/e759aa59-4a86-4072-982e-00071729b4a\nWhere=/boot\n\
  Type=ext4\nFsckPassNo=2\n```\n\n在 EFI 启动系统中，`boot-efi.mount` 文件挂载包含启动信息的 vfat EFI\
  \ 文件系统。\n\n```ini\n[Mount]\nWhere=/boot/efi\nWhat=/dev/disk/by-uuid/5537-AF41\n\
  Type=vfat\nOptions=umask=0077\n```\n\n| 挂载选项 | 说明 |\n| :--- | :--- |\n| What | 设备路径\
  \ |\n| Where | 挂载点目录 |\n| Type | 文件系统类型 |\n| Options | 挂载选项 |\n| DirectoryMode |\
  \ 创建的文件系统挂载目录的权限 |\n| TimeoutSec | 等待挂载操作完成的时间 |\n| 自动挂载选项 | | |\n| Where | 文件系统的挂载点。如果不存在，将创建它。\
  \ |\n| DirectoryMode | 创建的目录的权限。 |\n\n表 12-11：systemd 挂载和自动挂载文件选项\n\n所有单元文件都将 `/etc/fstab`\
  \ 文件指定为 `SourcePath`，即生成配置的文件。\n\n```ini\nSourcePath=/etc/fstab\n```\n\n都在任何本地文件系统之前挂载。\n\
  \n```ini\nBefore=local-fs.target\n```\n\n本地和远程文件系统通过其 `local-fs.target` 或 `remote-fs.target`\
  \ 单元文件中的 `Wants` 选项进行区分。\n\n\n\n\n挂载单元文件（mount unit file）必须根据其引用的挂载点命名。单元名称中的路径斜杠会被连字符替换。例如，`proc-fs-nfsd.mount`\
  \ 文件引用了挂载点 `/proc/fs/nfsd`。根路径 `/` 变成一个简单的连字符 `-`。\n\n为了让文件系统在被访问时自动挂载，可以使用 `automount`\
  \ 单元类型。automount 单元必须有一个同名的对应挂载单元。\n\n`systemd-fsck@service` 文件提供使用 `fsck` 进行的文件系统检查，并将磁盘名称作为参数。\n\
  \n```ini\nRequiresOverridable=system-fsck@dev-disk-by\\x2duuid-5537\\x2dAF41.service\n\
  After=system-fsck@dev-disk-by\\x2duuid-5537\\x2dAF41.service\n```\n\n### systemd\
  \ slice 和 scope 单元\n\nslice（切片）和 scope（作用域）单元旨在将单元分组，以便更容易控制它们的进程和资源。scope 单元由 systemd\
  \ 生成，用于管理一个进程及其子进程。scope 单元的一个示例是用户会话作用域，它将用户会话的进程分组在一起。slice 用于管理进程的资源，例如用于虚拟机的\
  \ machine slice、用于系统服务的 system slice 以及用于用户会话的 user slice。\n\n### System V: /etc/init.d\n\
  \nSysVinit 对服务的支持已不再实现。没有用于启动服务的 `rc.d` 脚本。`systemd` 直接管理所有服务。检查 `/etc/init.d` 目录下的\
  \ `README` 文件。对于极少数系统任务，你可能会在 `/etc/init.d` 目录中找到 System V 脚本。`systemd` 将读取这些脚本作为服务的配置信息，并为其生成对应的单元配置文件。反之，单元文件可能会使用\
  \ `init.d` 脚本来启动、停止和重启服务。如果已经存在单元文件，则使用该单元文件并忽略 System V 脚本。\n\n某些服务器使用从 `/etc/init.d`\
  \ 目录 System V 脚本生成的单元文件。这些包括 Apache (apache2)，例如 Squid (squid3)。这些单元文件由 `systemd-sysv-generator`\
  \ 生成，位于 `/var/run/systemd/generator.late` 目录。\n\n`/lib/systemd/system` 目录下的 `rc-local.service`\
  \ 单元会在存在 `/etc/rc.local` 文件时运行它。这是为了保持与旧 System V 配置的兼容。\n\n### 关机和断电\n\n你可以使用 `shutdown`\
  \ 和 `poweroff` 命令来关闭系统。`shutdown` 命令提供了更多选项。请记住，使用的 `shutdown` 命令是 systemd 版本，它将使用\
  \ `systemctl` 实际关闭系统。\n\n你也可以通过 `sudo` 命令使用 `poweroff` 命令立即关闭系统。系统会提示你输入密码。\n\n\
  ```bash\nsudo poweroff\n```\n\n要执行重启，你可以使用 `reboot` 命令。\n\n```bash\nsudo reboot\n\
  ```\n\n`shutdown` 命令有一个时间参数，可以在关机前向系统用户发出警告。你可以指定精确的关机时间，或者从当前时间起的几分钟。精确时间通过 `hh:mm`\
  \ 指定小时和分钟。时间段由 `+` 和分钟数表示。\n\n`shutdown` 命令有几个选项，你可以通过这些选项指定如何关闭系统。`-h` 选项代表 halt（停止），它只需关闭系统，而\
  \ `-r` 选项在关闭系统后重启。在下一个示例中，系统将在十分分钟后关闭：\n\n```bash\nshutdown -h +10\n```\n\n要立即关闭系统，你可以使用\
  \ `+0` 或单词 `now`。关机选项列在 表 12-12 中。接下来的示例立即关闭系统并重启：\n\n```bash\nshutdown -r now\n\
  ```\n\n| 命令 | 描述 |\n| :--- | :--- |\n| `shutdown [-rkhncft] time [warning]` | 在指定的时间段后关闭系统，并向用户发出警告；你可以在时间参数之后指定自定义的警告消息；如果未指定\
  \ `-h` 或 `-r` 来关闭系统，系统将设置为管理模式，运行级别状态为 1。 |\n| 参数 | |\n| Time (时间) | 有两种可能的格式：可以是\
  \ `hh:mm` 格式的绝对时间，其中 `hh` 为小时（一位或两位数字），`mm` 为分钟（两位数字）；也可以是 `+m` 格式，其中 `m` 为等待的分钟数；单词\
  \ `now` 是 `+0` 的别名。 |\n| Option (选项) | |\n| `-t sec` | 告诉 init 在发送进程警告和杀死信号之间等待\
  \ `sec` 秒，然后切换到另一个运行级别。 |\n| `-k` | 不实际关机；仅向所有人发送警告消息。 |\n| `-r` | 关机后重启，运行级别状态为\
  \ 6。 |\n| `-h` | 关机后停止，运行级别状态为 0。 |\n| `-n` | 不调用 init 执行关机；由你自己执行。 |\n| `-f` |\
  \ 跳过文件系统检查 (`fsck`)；重启时。 |\n| `-c` | 取消正在运行的关机；无需时间参数。 | 表 12-12：系统关机选项\n\n使用 `shutdown`\
  \ 命令，你可以向当前登录的用户包含警告消息，让他们在关机前完成正在的工作。\n\n```bash\nshutdown -h +5 \"System needs\
  \ a rest\"\n```\n\n如果你没有指定 `-h` 或 `-r`，`shutdown` 命令将切换到单用户管理模式。只有 root 用户是激活的，允许\
  \ root 用户执行任何系统操作。`shutdown` 命令通过 systemd 使用 `systemctl` 命令工作。poweroff、halt 和 reboot\
  \ 命令调用 systemd 服务文件。`systemctl` 命令反过来使用 `/lib/systemd/system-shutdown` 程序执行实际的关机。在\
  \ `/lib/systemd/system` 目录中，`systemd-poweroff.service` 文件显示 `systemctl` `poweroff`\
  \ 命令。关机服务的帮助页是 `systemd-halt.service(8)`。始终使用 `poweroff`、`reboot` 和 `halt` 命令来关机，而不是\
  \ `systemctl` 命令。相应的 systemd 目标和服务文件确保了关机过程安全。\n\n```\nsystemd-poweroff.service\n\
  # 此文件是 systemd 的一部分。\n# systemd 是自由软件；你可以根据自由软件基金会发布的\n# GNU 通用许可证来分发或修改它；\n# 该许可证的\
  \ 2.1 版本，或（根据你的选择）任何后继版本。[Unit]\n\nDescription=Power-Off\nDocumentation=man:systemd-halt.service(8)\n\
  DefaultDependencies=no\nRequires=shutdown.target umount.target final.target\nAfter=shutdown.target\
  \ umount.target final.target\n\n[Service]\n\nType=oneshot\nExecStart=/bin/systemctl\
  \ --force poweroff\n```\n\n注意：halt 命令仅仅是停止系统，并不将其关闭。\n\n## 管理服务\n\n你可以选择要运行的服务以及运行它们时的特殊目标（运行级别）。大多数服务都是服务器，如\
  \ Web 服务器或 FTP 服务器。其他服务提供安全保障，如 SSH 或 Kerberos。你可以使用 `systemctl` 或 `service` 工具决定使用哪些服务。\n\
  \n#### **启用服务：在启动时自动启动服务**\n\nApache Web 服务器、Samba 服务器和 FTP 服务器等服务由 systemd 守护进程管理。你可以使用\
  \ `systemctl` 命令管理服务。旧的 `service` 命令仅仅是 `systemctl` 命令的前端。\n\n\n\n\n\n要让服务在启动时自动运行，你首先需要以\
  \ root 用户身份使用 `systemctl` 工具将其启用。使用 `enable` 命令来启用服务。以下命令将启用 `vsftpd` 服务器和 Samba\
  \ 服务器 (`smbd`)。`systemctl` 命令使用位于 `/lib/systemd/system` 或 `/etc/systemd/system`\
  \ 目录下的服务配置文件。\n\n```bash\nsudo systemctl enable vsftpd.service\nsudo systemctl enable\
  \ smbd\n```\n\n#### 手动管理服务：systemctl\n\n使用 `systemctl` 的 `start`、`stop` 和 `restart`\
  \ 命令可以手动启动、停止和重启服务。`enable` 命令仅用于设置服务的自动启动。你可以选择使用 `start` 命令手动启动它。你可以随时使用 `stop`\
  \ 和 `restart` 命令停止和重启服务。`condrestart` 命令仅在服务器已处于停止状态时才启动它。使用 `status` 命令检查服务的当前状态。\n\
  \n```bash\nsudo systemctl start vsftpd\nsudo systemctl restart vsftpd\nsudo systemctl\
  \ condrestart vsftpd\nsudo systemctl stop vsftpd\nsudo systemctl status vsftpd\n\
  ```\n\n#### service 命令\n\n`service` 命令现在仅是 `systemctl` 命令的前端，由后者使用 systemd 执行实际操作。`service`\
  \ 命令无法启用或禁用服务。它只执行启动、停止、重启和状态等管理操作。使用 `service` 命令时，你通过 `stop` 参数输入服务名称来停止它，通过 `start`\
  \ 参数启动它，通过 `restart` 参数重启它。`service` 命令从终端窗口运行。你将需要使用 `sudo` 命令。以下命令将启动 `vsftpd`\
  \ FTP 服务。\n\n```bash\nsudo service vsftpd start\n```\n\n`systemd` 版本的 `service`\
  \ 命令实际上会调用 `systemctl` 命令来运行 `/lib/systemd/system` 中的服务 systemd `.service` 单元文件。如果服务未被启用，`systemd`\
  \ 将将其启用。你可以使用 `systemctl` 命令执行与 `service` 命令相同的操作。以下是前一个命令的等效命令。\n\n```bash\nsudo\
  \ systemctl start vsftpd\n```\n\n#### Cockpit\n\nCockpit 管理控制台（由 Red Hat 开发）提供了一个\
  \ Web 界面，用于管理系统中的系统管理和互联网服务器，以及网络上的服务器（[`cockpit-project.org`](https://cockpit-project.org)）。该\
  \ Web 界面在桌面系统中效果最好。你可以用它管理系统资源，包括服务、存储和网络。一旦安装了 cockpit，务必使用 `systemd` 将其启用，然后通过防火墙允许\
  \ cockpit 和 `https` 的访问。包名为 `cockpit`。\n\n```bash\nsudo apt-get install cockpit\n\
  sudo systemctl enable cockpit\n```\n\n你可以通过 Administration | Cockpit 访问 Cockpit。这将用你的默认浏览器打开\
  \ cockpit。你也可以使用 Web 浏览器访问本地系统上的 9090 端口（`localhost:9090`）来访问 cockpit。cockpit 页面最初提示你输入用户名和密码。确保勾选“Reuse\
  \ my password for privileged tasks”（重复我的密码用于特权任务）复选框，以便你可以进行更改。随后会显示网络上的系统列表。点击其中一个，你将在左侧看到管理类别的链接，例如系统管理、服务、网络和存储。点击\
  \ services 链接管理你的服务。然后点击 System Services 选项卡列出已启用和禁用的服务，包括网络服务，如 Samba、Apache Web\
  \ 服务器和 vsftpd FTP 服务器（参见图 12-1）。点击服务可以打开一个可以在其中管理服务的页面。右侧的按钮显示当前状态。点击右侧箭头按钮将显示你可能执行的操作菜单，例如停止或重启服务。如果你禁用了服务，它将移动到禁用列表。启用服务则会将其移回启用列表。\n\
  \n![Image](img/image-508.png) ![Image](img/image-509.png)\n\n图 12-1: 服务：cockpit\n\
  \nCockpit 会随 `systemctl` 动态更新。如果你在终端窗口中使用 `systemctl` 做了更改，更改将立即显示在 Cockpit 上。\n\
  \n#### /etc/default\n\n`/etc/default` 目录存放服务启动时设置运行时选项的脚本。例如，`/etc/default/apache2`\
  \ 脚本设置缓存清理选项`/etc/default/ufw` 脚本设置防火墙默认策略。你可以编辑这些脚本并更改分配给选项的值，从而改变服务的行为。\n\n####\
  \ 网络时间协议：Chrony\n\n为了让服务器正确运行，它们始终需要正确的时间。全球互联网时间服务器以协调世界时（UTC）的形式提供时间。然后使用本地系统的本地时区计算本地时间。时间通过互联网连接从互联网时间服务器获取。你也可以选择使用本地硬件时钟，尽管这可能精确得多。\n\
  \n通常情况下，主机上的时间存储在计时芯片（TOY）中，该芯片在机器关闭时保持时间。当机器重启时会使用该时间。使用网络时间协议的主机随后将使用从互联网时间服务器获取的时间调整时间。如果差异超过\
  \ 1000 秒（约 15 分钟），则需要手动设置时间。网络中的时间服务器按层级组织，最高级为 1。\n\n在 Linux 上，时间由 `systemd-timesyncd`\
  \ 进程同步。你可以使用 `timedatectl` 命令管理和设置时间。如果你要在本地网络上设置时间服务器，可以使用 Chrony。\n\nChrony 时间服务器现在用于\
  \ Ubuntu 服务器，取代了旧的 NTP 时间服务器。你可以在此处找到 Chrony 的文档：\n\n[`chrony.tfamily.org`](https://chrony.tfamily.org)\n\
  \nUbuntu 仓库中有一个 Chrony 服务器包。你可以使用 `apt-get`、`aptitude` 或（桌面端的）Synaptic 软件包管理器安装。\n\
  \n`chronyd`、`chrony.conf` 和 `chronyc` 有帮助页。`chronyd` 服务器的命令行界面是 `chronyc`。\n\n####\
  \ Chrony 服务器\n\nChrony 服务器名称为 `chronyd`，由 `/lib/systemd/system/chrony.service` 脚本管理。\n\
  \n```ini\n[Unit]\nDescription=chrony, an NTP client/server\nDocumentation=man:chronyd(8)\
  \ man:chronyc(1) man:chrony.conf(5)\nConflicts=systemd-timesyncd.service openntpd.service\n\
  After=network.target\n\n[Service]\nType=forking\nPIDFile=/run/chronyd.pid\nEnvironmentFile=-/etc/default/chrony\n\
  # Starter 负责特殊情况，主要针对容器\nExecStart=/usr/lib/systemd/scripts/chronyd-starter.sh $DAEMON_OPTS\n\
  ExecStartPost=-/usr/lib/chrony/chrony-helper update-daemon\nPrivateTmp=yes\nProtectHome=yes\n\
  ProtectSystem=full\n\n[Install]\nAlias=chronyd.service\nWantedBy=multi-user.target\n\
  ```\n\n使用 `service` 命令的 `start`、`stop` 和 `restart` 来管理服务器。\n\n```bash\nsudo service\
  \ chronyd start\n```\n\n随后你的主机系统就可以配置为使用 Chrony 并访问你的 Chrony 时间服务器。\n\n\n\n\nChrony\
  \ 服务器配置文件为 `/etc/chrony/chrony.conf`。该文件列出了您的时间服务器用于确定时间的 Internet 时间服务器列表。请查看 `chrony.conf`\
  \ 帮助页以获取 Chrony 服务器配置指令的完整列表。\n\n在 `chrony.conf` 文件中，`server` 指令指定了 Chrony 服务器用于访问时间的\
  \ Internet 时间服务器 Internet 地址。默认包含一个 Ubuntu 时间服务器池的条目，但您可以为其他时间服务器添加更多服务器条目。针对特定的时间服务器，您可以使用\
  \ `server` 指令。\n\n```\npool ntp.ubuntu.com\n```\n\n这里是默认的 `/etc/chrony/chrony.conf`\
  \ 文件。\n\n```conf\n# 欢迎使用 chrony 配置文件。有关可用指令的更多信息请参考 chrony.conf(5)\n\n# 这将使用（最多）：\n\
  # - 来自 ntp.ubuntu.com 的 4 个源，其中一些启用了 ipv6\n# - 来自 2.ubuntu.pool.ntp.org 的 2 个源，该地也启用了\
  \ ipv6\n# - 来自 [01].ubuntu.pool.ntp.org 的每个 1 个源（目前仅限 ipv4）\n# 这意味着默认情况下，将使用最多 6\
  \ 个双栈源和最多 2 个额外的仅 IPv4 源。\n# 同时，它保留了防止其中一个条目宕机影响的保护措施\n#（与仅使用其中某行相比）。讨论请参阅 (LP:\
  \ #1754358)。\n# 关于一般使用 NTP Pool Project 的服务器，请参阅 (LP: #104525)。\n# 由 Ubuntu 技术委员会于\
  \ 2011-02-08 批准。\n# 更多信息请访问 http://www.pool.ntp.org/join.html。\n\npool ntp.ubuntu.com\
  \ iburst maxsources 4\npool 0.ubuntu.pool.ntp.org iburst maxsources 1\npool 1.ubuntu.pool.ntp.org\
  \ iburst maxsources 1\npool 2.ubuntu.pool.ntp.org iburst maxsources 2\n\n# 此指令指定包含用于\
  \ NTP 认证的 ID/密钥对的文件位置。\nkeyfile /etc/chrony/chrony.keys\n\n# 此指令指定 chronyd 存储速率信息的文件。\n\
  driftfile /var/lib/chrony/chrony.drift\n\n# 取消下行的注释以开启日志记录。\n#log tracking measurements\
  \ statistics\n\n# 日志文件位置。\nlogdir /var/log/chrony\n\n# 防止糟糕的估值干扰机器时钟。\nmaxupdateskew\
  \ 100.0\n\n# 此指令启用实时时钟的内核同步（每 11 分钟一次）。\n# 注意它不能与 'rtcfile' 指令一起使用。\nrtcsync\n\n\
  # 如果调整大于一秒，则步进系统时钟而不是调，\n# 但仅在前三次时钟更新中。\nmakestep 1 3\n```\n\n`allow` 指令允许本地网络上的主机访问您的时间服务器，而\
  \ `deny` 指令拒绝访问。这些主机可以使用您的时间服务器。`deny` 指令拒绝指定主机的访问。\n\n您可以使用 `cmdallow` 命令允许客户端。\n\
  \n### AppArmor 安全\n\nAppArmor 是一个提供强制访问控制（MAC）的内核模块。它通过限制对文件、功能和网络端口等资源的访问，来限制单个程序的能力。\n\
  \nAppArmor 通过将配置文件与程序关联来工作。这些配置文件定义了程序被允许的操作。例如，一个配置文件可能会限制程序仅读取特定文件或仅访问某些网络端口。\n\
  \nAppArmor 存在于许多 Linux 发行版，包括 Ubuntu、Debian 和 CentOS。它通常被用于保护 Web 服务器和数据库服务器等关键服务。\n\
  \n\n\n\n`aa-logprof` 工具将分析 AppArmor 日志，以确定任何应用配置是否需要进行更改。系统将呈现建议的更改，用户可以允许 (`A`)\
  \ 或拒绝 (`D`) 这些更改。在投诉模式（plain mode）下，允许是默认选项；在强制模式（enforce mode）下，拒绝是默认选项。你还可以使用新的\
  \ (`N`) 选项进行自定义更改。如果你希望将更改应用于建议路径中的所有文件和目录，可以选择 glob 选项 (`G`)，这本质上是将路径中的最后一个目录或文件替换为通配符匹配符号\
  \ `*`。\n\n`aa-autodep` 工具将为新应用程序或未限制的应用程序生成基础 AppArmor 配置文件。如果你想要更有效的配置，可以使用 `aa-genprof`\
  \ 分析应用程序的使用情况并据此生成相应的控制策略。\n\n`aa-genprof` 工具将为指定的应用程序更新或生成详细的配置。`aa-genprof` 会先将配置设置为投诉模式。然后你启动并使用该应用程序，在使用过程中生成投诉模式日志消息。随后，`vgenprof`\
  \ 会提示你扫描投诉消息以进一步精炼配置 (`S`)，或完成操作 (`F`)。扫描时，会检测到不同的违规并提示用户允许或拒绝建议的控制。你可以重复扫描操作，直到你认为配置可以接受。选择完成\
  \ (`F`) 以确定配置并退出。\n\n## AppArmor 配置\n\nAppArmor 配置位于 `/etc/apparmor` 目录。不同配置文件的配置位于\
  \ `/etc/apparmor.d` 目录。已加载的配置文件文件名以其路径命名，使用点代替斜杠来分隔目录名。`smbd` (Samba) 应用程序的配置文件为\
  \ `usr.sbin.smbd`。对于 CUPS (`cupsd`)，它是 `usr.sbin.cupsd`。对于时间服务器，它是 `user.sbin.ntpd`。额外的配置（如\
  \ Samba 和 Apache）通过 `apparmor-profiles` 包安装（默认未安装）。\n\n```bash\nsudo apt-get install\
  \ apparmor-profiles\n```\n\nAppArmor 配置文件的规则由路径和在该路径上允许的权限组成。有关 AppArmor 规则和权限的详细说明可以在\
  \ `apparmor.d` 的 手页中找到，其中包含配置示例。以 `*` 匹配符号结尾的路径将选择该目录下的所有文件。`**` 符号选择所有文件和子目录。支持所有文件匹配操作（`*`、`[]`、`?`）。权限包括\
  \ `r` (读)、`w` (写)、`x` (执行) 和 `l` (链接)。`u` 权限允许无限制访问。以下条允许写入 `/var/log/samba/cores/smdb`\
  \ 目录下的所有文件子目录。\n\n```text\n/var/log/samba/cores/smbd/** rw,\n```\n\n`/etc/apparmor.d/abstractions`\
  \ 目录包含不同配置通用的规则文件。这些文件中的规则通过 `include` 指令读取到实际配置中。针对音频、samba 和视频等应用程序有抽象层。某些抽象层还会包含更通用的抽象层，例如针对\
  \ X 服务器 (`X`) 或 GNOME (`gnome`)。例如，Samba smbd 服务器的配置 `usr.sbin.smbd` 将有一个指向 `samba`\
  \ 抽象的包含指令。该抽象层包含了 `smbd` 和 `nmbd` 服务器通用的规则，两者都供 Samba 服务使用。`include` 指令中 `<>` 表示\
  \ `/etc/apparmor.d` 目录。抽象文件列表可以在 `apparmor.d` 手页中找到。`include` 指令以 `#` 字符开头。\n\n\
  ```text\n#include <abstractions/samba>\n```\n\n在某些情况下，配置可能需要访问其通常不应访问的目录中的某些文件。在这种情况下，它可能需要使用子配置来允许访问。实际上，应用程序切换了身份，承担了在原始配置中不具备的权限。\n\
  \n`apparmor-profiles` 包将激活多个常用的配置，并在 `/etc/apparmor.d` 目录中为它们建立配置文件，例如 samba (`usr.sbin.nmbd`\
  \ 和 `usr.sbin.smbd`)、Dovecot 邮件 pop 和 imap 服务器 (`usr.sbin.dovecot`) 以及 Avahi (`usr.sbin.avahi-daemon`)。\n\
  \n该包还会在 `/usr/share/doc/apparmor-profiles/extras` 目录下为许多应用程序提供配置默认文件，例如 vsftpd FTP\
  \ 服务器 (`usr.sbin.vsftpd`)、ClamAV 病毒扫描器 (`usr.bin.freshclam`) 和 Squid 代理服务器 (`usr.sbin.squid`)。某些服务应用程序位于\
  \ `/usr/lib` 目录，并具有 `usr.lib` 前缀，例如 Postfix 服务器，它使用多个配置，以 `usr.lib.postfix` 开头。要使用这些额外的配置，将它们拷贝到\
  \ `/etc/apparmor.d` 目录。以下示例拷贝了 vsftpd FTP 服务器的配置。\n\n```bash\nsudo cp /usr/share/doc/apparmor-profiles/extras/usr.sbin.vsftpd\
  \ /etc/apparmor.d\n```\n\n## 远程管理\n\n对于远程管理，你可以使用 OpenSSH 和 Puppet。OpenSSH 允许你通过网络安全地远程控制和传输文件。Puppet\
  \ 允许你管理服务的远程配置。\n\n### Puppet\n\nPuppet 允许你自动配置远程系统，即使它们运行不同的 Linux 发且具有不同的配置文件。与其手动配置每个系统，不如使用\
  \ Puppet 来配置它们。Puppet 将管理任务抽象为资源抽象层 (RAL) 中的资源。然后你使用配置语言为资源指定基本值或操作。管理类型包括服务、文件、用户和组。例如，你可以使用\
  \ puppet 对正在使用 APT 或 Synaptic 等不同包管理器的系统执行服务的更新。\n\nPuppet 配置可能会变得非常复杂。但一旦设置好，它就能完全自动化你所有网络系统的更改。有关详细文档和指南，参见\
  \ Puppet 配置位于 `/etc/puppet`。对服务的 Puppet 操作在位于 `manifests` 目录下的 `init.pp` 文件的模块中指定。在\
  \ Apache 的 Ubuntu 示例中，apache 模块位于：\n\n```text\n/etc/puppet/modules/apache2/manifests/init.pp\n\
  ```\n\n客户端使用 puppet 客户端 (`puppet` 包），服务器使用 puppetmaster 守护进程 (`puppetmaster` 包）。在\
  \ puppet 客户端上，使用 `service` 命令手动启动和停止 `puppet` 服务。对于服务器，启用 `puppetmaster` 服务。\n\n\
  在防火墙上为 Puppet 端口 8140 添加访问。\n\n对于客户端，puppet 运行时配置在 `/etc/default/puppet` 文件中。你通过将\
  \ `START` 变量设置为 yes 来设置守护进程启动。\n\n如果你的网络运行 DNS 服务器，可以为 puppet 服务器设置 CNAME puppet\
  \ 条目。puppet 客户端随后可以使用 CNAME 定位 puppet 服务器。\n\n```text\npuppet IN CNAME turtle.mytrek.com\n\
  ```\n\n你还可以在每个客户端的 `/etc/host` 文件中为 puppet 服务器添加主机目。\n\n在服务器上，`/etc/default/puppetmaster`\
  \ 文件中的 puppetmaster 配置允许你设置端口条目日志服务。默认条目被注释掉了。移除注释字符 `#` 即可启用。\n\n当你首次设置客户端服务器 puppet\
  \ 连接时，客户端和服务器必须签署客户端的 SSL 证书。首先，在客户端上运行 puppet。在服务器上运行 `puppet cert --list` 命令查看客户端证书请求。然后使用\
  \ `puppet cert --sign` 签名证书。\n\n### **The Secure Shell: OpenSSH**\n\n\n\n\n\n虽然防火墙可以保护网络免受外部侵入的尝试，但保护来自外部源的网络合法通信的问题仍然存在。一个特别的问题是那些想要远程连接到你网络的用户。此类连接可能会被监控，用户登录到你的网络时使用的密码和用户\
  \ ID 等信息可能会被复制，并在稍后用于破解。一种解决方案是使用 `SSH` 进行远程登录以及其他类型的远程连接（如 `FTP` 传输）。`SSH` 会加密远程用户与你网络上系统之间的任何通信。\n\
  \n`SSH` 协议已成为互联网工程任务组（IETF）的官方标准。一个免费的开源版本由 OpenSSH 项目开发和维护，目前由 OpenBSD 项目支持。`OpenSSH`\
  \ 是大多数 Linux 发行版（包括 Linux Mint）中提供的版本。你可以在 [www.openssh.org](http://www.openssh.org)\
  \ 了解更多关于 `OpenSSH` 的信息，并在那里下载最新版本，尽管 Linux Mint 和 Ubuntu 会从其存储库提供当前版本。传统上，`SSH`\
  \ 有两个版本：旧的 `SSH1` 及其替代版本 `SSH2`。在当前的 `OpenSSH` 版本中，`SSH1` 默认被禁用。如果你需要访问旧的仅支持 `SSH1`\
  \ 的服务器的工具，可以安装 `openssh-client-ssh1` 包。\n\n`SSH` 通过验证用户身份和加密传输内容来保护连接。身份验证过程通过公钥加密处理。一旦验证通过，传输内容将由\
  \ `SSH` 服务器和客户端为特定会话约定的加密算法进行加密。`SSH` 支持多种加密算法。身份验证同时适用于主机和用户。`SSH` 首先验证特定的主机，确认其是一个可以进行安全通信的有效\
  \ `SSH` 主机。然后验证用户，确认用户确实是其所称的人。\n\n### 加密\n\n`SSH` 验证中使用的公钥加密使用了密钥：公钥和私钥。公钥用于加密数据，而私钥用于解密。每个主机或用户都有自己的公钥和私钥。公钥分发给其他主机，这些主机可以使用它加密认证数据，只有该主机的私钥才能解密。例如，当主机向另一个系统上的用户发送数据时，该主机使用之前从该用户接收的公钥加密认证数据。该数据只能由用户对应的私钥解密。公钥可以安全地从一个主机发送到另一个主机，允许其安全地安装在不同的主机上。你可以将此过程认为发生在客户端和服务器之间。当客户端向服务器发送数据时，它首先使用服务器的公钥对数据进行加密。然后服务器可以使用自己的私钥解密数据。\n\
  \n建议对 `SSH` 传输使用由短语控制的公私密钥进行身份验证。与 `PGP` 不同，`SSH` 仅在身份验证过程中使用公钥加密。一旦验证通过，参与者将约定一种常用的加密算法来加密传输。身份验证将验证参与者的身份。每个打算使用\
  \ `SSH` 访问远程账户的用户首先需要创建公钥、私钥以及一个用于验证过程的短语。然后用户将其公钥发送到他们想要访问的远程账户，并在该账户上安装公钥。当用户尝试访问远程账户时，该账户可以使用用户的公钥来验证该用户确实是其所称的人。该过程假设远程账户已设置了自身的\
  \ `SSH` 私钥和公钥。用户要访问远程账户，他们必须知道远程账户的 `SSH` 短语。`SSH` 经常用于用户在不同系统上有两个或多个账户，并希望能够从彼此之间安全访问的情况。在这种情况下，用户已经拥有每个账户的访问权限，并在每个账户上安装\
  \ `SSH`，为每个账户提供自己的私钥、公钥以及相应的短语。\n\n### 身份验证\n\n对于 `SSH` 的身份验证，用户需要创建公钥和私钥。为此，你使用\
  \ `ssh-keygen` 命令。然后，用户的公钥必须分发给原始用户想要其访问的用户。这通常是用户在另一个主机上的账户。短语进一步保护了访问安全。原始用户需要知道另一个用户的短语才能访问它。\n\
  \n当远程用户尝试登录账户时，系统会检查该账户是否拥有远程用户的公钥。然后，使用该公钥加密一个挑战值（通常是一个随机数），该挑战只能通过远程用户的私钥解密。当远程用户接收到加密的挑战时，该用户用其私钥解密挑战。远程用户将首先使用其私钥对会话标识符进行加密并签名。然后账户使用远程用户的公钥解密加密的会话标识符。该会话标识符是由\
  \ `SSH` 预先为该会话设置的。\n\n`SSH` 身份验证首先针对主机进行，然后针对用户进行。每个主机都有自己的用于身份验证的主机密钥（公钥和私钥）。一旦主机通过验证，系统将查询用户。每个用户都有自己的公钥和私钥。`SSH`\
  \ 服务器上希望接收远程用户连接的用户必须保留一份这些远程用户的公钥列表。同样，`SSH` 主机将维护一个其他 `SSH` 主机的公钥列表。\n\n### SSH\
  \ 软件包、工具和服务器\n\nLinux 系统通过 `OpenSSH` 实现 `SSH`。`OpenSSH` 完整 set 包括 `OpenSSH` 元软件包\
  \ (`ssh`)、`OpenSSH` 服务器 (`openssh-server`) 以及 `OpenSSH` 客户端 (`openssh-clients`)。这些软件包还需要\
  \ `SSH` 使用的 `OpenSSL` 加密库。\n\n`SSH` 工具见表 12-7。它们包括 `scp`、`ssh` 等多个客户端程序。`SSH` 服务器\
  \ (`sshd`) 通过 `ssh` 客户端从外部提供安全连接。还包含一些配置工具，如 `ssh-add`（将有效主机添加到身份验证代理）和 `ssh-keygen`（生成加密所需的密钥）。\n\
  \n你可以使用 `service` 或 `systemctl` 命令手动启动、停止和重启服务器。\n\n```\nsudo service sshd restart\n\
  ```\n\n| 应用 | 描述 |\n| :--- | :--- |\n| `ssh` | SSH 客户端 |\n| `sshd` | SSH 服务器（守护进程）\
  \ |\n| `sftp` | SSH FTP 客户端，安全文件传输程序。版本 2。使用 `?` 列出 sftp 命令（SFTP 协议） |\n| `sftp-server`\
  \ | SSH FTP 服务器。版本 2（SFTP 协议） |\n| `scp` | SSH 复制命令 |\n| `ssh-keygen` | 生成密钥的工具。`-h`\
  \ 查看帮助 |\n| `ssh-keyscan` | 自动收集公主机密钥以生成 `ssh_known_hosts` 文件的工具 |\n| `ssh-add`\
  \ | 将 RSA 和 DSA 身份添加到身份验证代理 |\n| `ssh-agent` | 持有用于公钥认证的私钥的 SSH 身份验证代理\n| `ssh-askpass`\
  \ | 查询密码的 X 窗口系统工具，由 ssh-add 调用（openssh-askpass） |\n| `ssh-askpass-gnome` | 查询密码的\
  \ GNOME 工具，由 ssh-add 调用 |\n| `ssh-signer` | 签名基于主机的认证包。版本 2。必须具有 suid root 权限（由安装完成）\
  \ |\n| `slogin` | 远程登录（版本 1） |\n\n表 12-14：SSH 工具\n\n\n\n\n你必须配置防火墙以允许对 `ssh` 服务的访问。该服务设置为使用\
  \ TCP 协议在端口 22（`tcp/22`）上运行。如果你直接管理 `IPTables` 防墙，可以通过添加以下 IPtables 规则来直接管理访问。该规则接受端口\
  \ 22 的 TCP/IP 协议包输入。\n\n```bash\niptables -A INPUT -p tcp --dport 22 -j ACCEPT\n\
  ```\n\n## SSH 设置\n\n使用 SSH 涉及创建你自己的公钥和私钥，然后将公钥分发给你你想要访问的其他用户。这些可以是不同的用户，或者仅仅是你自己在远程系统上的普通用户账户。人们通常从本地客户端远程登录到远程服务器上的账户，例如从家电脑登录到公司电脑。你的家电脑将是你的客户端账户，而公司电脑上的账户将是你的服务器账户。在你的客户端账户上，你需要生成公钥和私钥，然后将公钥的副本放在服务器账户中。一旦服务器上的账户有了你客户端用户公钥的副本，你就可以从客户端账户访问服务器账户。系统还会提示你输入服务器账户的短语。你必须知道这个短语才能访问该账户。图\
  \ 12-2 展示了允许用户 `george` 访问账户 `cecelia` 的 SSH 设置。\n\n![Image](img/image-510.png)\n\
  \n图 12-2：SSH 设置与访问\n\n为了允许你使用 SSH 访问其他账户：\n\n- 你必须在你的账户上创建公钥、私钥以及一个短语。你需要使用此短语从另一个账户访问你的账户。*\n\
  - 你必须将你的公钥分发到你想要访问的其他账户，将其放入 `.ssh/authorized_keys` 文件中。\n- 其他账户也必须设置公钥、私钥以及一个短语。\n\
  - 你必须知道另一个账户的短语才能访问它。\n\n### 使用 ssh-keygen 创建 SSH 密钥\n\n你使用 `ssh-keygen` 命令创建公钥和私钥。你需要指定想要使用的加密类型。你可以使用\
  \ DSA 或 RSA 加密。使用 `-t` 选项指定类型，并使用小写指定的加密名称（rsa, dsa, ecdsa 和 ed25519）。在以下示例中，用户创建了一个使用\
  \ RSA 加密的密钥：\n\n```bash\nssh-keygen -t rsa\n```\n\n`ssh-keygen` 命令提示你输入一个短语，它将作为一种密码来保护你的私钥。短语应该是几个单词长。系统还会提示你为密钥输入一个文件名。如果你不输入，SSH\
  \ 将使用默认值。公钥将获得扩展名 `.pub`。`ssh-keygen` 命令会生成公钥并将其放在你的公钥文件中，例如 `.ssh/id_dsa.pub` 或\
  \ `.ssh/id_rsa.pub`，取决于你指定的密钥类型。它将私钥放在对应的私钥文件中，例如 `.ssh/id_dsa` 或 `.ssh/id_rsa`。\n\
  \n| 文件 | 描述 |\n| :--- | :--- |\n| `$HOME/.ssh/known_hosts` | 记录用户登录过的所有主机的主机密钥（不在\
  \ `/etc/ssh/ssh_known_hosts` 中的）。 |\n| `$HOME/.ssh/random_seed` | 随机数生成器的种子。 |\n\
  | `$HOME/.ssh/id_rsa` | 包含用户的 RSA 认证身份。 |\n| `$HOME/.ssh/id_dsa` | 包含用户的 DSA 认证身份。\
  \ |\n| `$HOME/.ssh/id_rsa.pub` | 包含用于认证的 RSA 公钥。此文件的内容应添加到所有你想使用 RSA 认证登录的机器上的 `$HOME/.ssh/authorized_keys`\
  \ 中。 |\n| `$HOME/.ssh/id_dsa.pub` | 包含用于认证的 DSA 公钥。 |\n| `$HOME/.ssh/config` | 每个用户的配置文件。\
  \ |\n| `$HOME/.ssh/authorized_keys` | 列出可以用于作为此用户登录的 RSA 或 DSA 密钥。 |\n| `/etc/ssh/ssh_known_hosts`\
  \ | 包含系统级的已知主机密钥列表。 |\n| `/etc/ssh/ssh_config` | 包含系统级配置文件。该文件为用户配置文件未指定的值提供了默认值。\
  \ |\n| `/etc/ssh/sshd_config` | 包含 SSH 服务器配置文件。 |\n| `/etc/ssh/sshrc` | 包含系统默认设置。用户登录时，在用户\
  \ shell（或命令）启动之前，ssh 会执行此文件中的命令。 |\n| `$HOME/.ssh/rc` | 用户登录时，在用户 shell（或命令）启动之前，由\
  \ ssh 执行的命令。 |\n\n表 12-15：SSH 配置文件\n\n如果你需要更改你的短语，可以使用 `ssh-keygen` 命令和 `-p` 选项。每个用户都将有自己的\
  \ SSH 配置目录，称为 `.ssh`，位于他们自己的家目录下。公钥、私钥以及 SSH 配置文件都放在这里。如果你从源码编译，`make install` 操作将自动运行\
  \ `ssh-keygen`。Table 12-15\n\n### 授权密钥\n\n公钥用于认证。你需要将公钥分发到你想要访问的其他账户，将其放入 `.ssh/authorized_keys`\
  \ 文件中。其他账户也必须设置公钥、私钥以及一个短语。你必须知道另一个账户的短语才能访问它。\n\n###  SSH 密钥 密钥\n\n你使用 `ssh-keygen`\
  \ 命令创建公钥和私钥。你需要指定想要使用的加密类型。你可以使用 DSA 或 RSA 加密。使用 `-t` 选项指定类型，并使用小写指定的加密名称（rsa, dsa,\
  \ ecdsa 和 ed25519）。在以下示例中，用户创建了一个使用 RSA 加密的密钥：\n\n```bash\nssh-keygen -t rsa\n```\n\
  \n`ssh-keygen` 命令提示你输入一个短语，它将作为一种密码来保护你的私钥。短语应该是几个单词长。系统还会提示你为密钥输入一个文件名。如果你不输入，SSH\
  \ 将使用默认值。公钥将获得扩展名 `.pub`。`ssh-keygen` 命令会生成公钥并将其放在你的公钥文件中，例如 `.ssh/id_dsa.pub` 或\
  \ `.ssh/id_rsa.pub`，取决于你指定的密钥类型。它将私钥放在对应的私钥文件中，例如 `.ssh/id_dsa` 或 `.ssh/id_rsa`。\n\
  \n| 文件 | 描述 |\n| :--- | :--- |\n| `$HOME/.ssh/known_hosts` | 记录用户登录过的所有主机的主机密钥（不在\
  \ `/etc/ssh/ssh_known_hosts` 中的）。 |\n| `$HOME/.ssh/random_seed` | 随机数生成器的种子。 |\n\
  | `$HOME/.ssh/id_rsa` | 包含用户的 RSA 认证身份。 |\n| `$HOME/.ssh/id_dsa` | 包含用户的 DSA 认证身份。\
  \ |\n| `$HOME/.ssh/id_rsa.pub` | 包含用于认证的 RSA 公钥。此文件的内容应添加到所有你想使用 RSA 认证登录的机器上的 `$HOME/.ssh/authorized_keys`\
  \ 中。 |\n| `$HOME/.ssh/id_dsa.pub` | 包含用于认证的 DSA 公钥。 |\n| `$HOME/.ssh/config` | 每个用户的配置文件。\
  \ |\n| `$HOME/.ssh/authorized_keys` | 列出可以用于作为此用户登录的 RSA 或 DSA 密钥。 |\n| `/etc/ssh/ssh_known_hosts`\
  \ | 包含系统级的已知主机密钥列表。 |\n| `/etc/ssh/ssh_config` | 包含系统级配置文件。该文件为用户配置文件未指定的值提供了默认值。\
  \ |\n| `/etc/ssh/sshd_config` | 包含 SSH 服务器配置文件。 |\n| `/etc/ssh/sshrc` | 包含系统默认设置。用户登录时，在用户\
  \ shell（或命令）启动之前，ssh 会执行此文件中的命令。 |\n| `$HOME/.ssh/rc` | 用户登录时，在用户 shell（或命令）启动之前，由\
  \ ssh 执行的命令。 |\n\n表 12-15：SSH 配置文件\n\n如果你需要更改你的短语，可以使用 `ssh-keygen` 命令和 `-p` 选项。每个用户都将有自己的\
  \ SSH 配置目录，称为 `.ssh`，位于他们自己的家目录下。公钥、私钥以及 SSH 配置文件都放在这里。如果你从源码编译，`make install` 操作将自动运行\
  \ `ssh-keygen`。\n\n### 授权密钥\n\n公钥用于认证。你需要将公钥分发到你想要访问的其他账户，将其放入 `.ssh/authorized_keys`\
  \ 文件中。其他账户也必须设置公钥、私钥以及一个短语。你必须知道另一个账户的短语才能访问它。\n\n### 加载密钥\n\n如果你经常连接到各种远程主机，可以使用\
  \ `ssh-agent` 命令将私钥放在内存中，以便快速访问并解密接收到的传输。`ssh-agent` 命令旨在在会话开始时使用。对于 GNOME，你可以使用\
  \ `openssh-askpass-gnome` 工具，它由 `ssh-add` 调用，允许你在登录 GNOME 时输入密码。每当你使用 SSH 客户端时，GNOME\
  \ 会自动提供该密码。\n\n虽然 `ssh-agent` 命令允许你在内存中使用私钥，但你必须专门使用 `ssh-add` 命令将私钥加载到内存中。不带参数的\
  \ `ssh-add` 将从你的私钥文件加载私钥，例如 `.ssh/id_rsa`。系统会提示输入该私钥的短语。要从内存中移除密钥，请使用带有 `-d` 选项的\
  \ `ssh-add`。如果你有多个私钥，可以将它们全部加载到内存中。带有 `-l` 选项的 `ssh-add` 会列出已加载的密钥。\n\n\n\nSSH 最初被设计用于替代远程访问操作，例如\
  \ `rlogin`、`rc` 和 `Telnet`，这些操作不进行加密且会引入安全风险。你还可以使用 SSH 编码 X 服务器会话以及 FTP 传输（`sftp`）。相应的\
  \ SSH 客户端取代了这些应用程序。通过 `slogin` 或 `ssh`，你可以从远程主机登录以执行命令并运行应用程序，就像使用 `rlogin` 和 `rsh`\
  \ 一样。通过 `scp`，你可以在远程主机和网络主机之间复制文件，就像使用 `rc` 一样。通过 `sftp`，你可以传输受加密保护的 FTP 文件。\n\n\
  ## SSH\n\n通过 `ssh,`，你可以从本地客户端远程登录到你网络上作为 SSH 服务器运行的远程系统。在这里，“本地客户端”指的是网络外部的设备，例如你的家用电脑，而“远程”指的是你正在连接的网络上的一个主机系统。实际上，你是从本地系统连接到远程网络主机的。它被设计用于取代执行远程登录的\
  \ `rlogin` 和执行远程命令的 `rsh`。通过 `ssh`，你可以从本地站点登录到网络上的远程主机，然后向该主机发送要执行的命令。`ssh` 命令还能支持\
  \ X Window 系统连接。如果你从 X Window 系统环境（如 GNOME）建立 `ssh` 连接，此功能将自动启用。系统会在本地 X 服务器和远程\
  \ X 服务器之间为你建立连接。远程主机会设置一个虚拟 X 服务器，并将任何 X Window 系统数据通过它发送到你的本地系统，由你自己的本地 X 服务器进行处理。\n\
  \n`ssh` 登录操作功能与 `rlogin` 命令非常相似。你输入带有远程主机地址的 `ssh` 命令，随后是 `-l` 选项和你要登录的远程账户登录名称（用户名）。下面的示例登录了\
  \ `rabbit.mytrek.com` 主机上的 `aleina` 用户账户：\n\n```\nssh rabbit.mytrek.com -l aleina\n\
  ```\n\n你也可以在 `ssh` 中使用地址格式的用户名，例如：\n\n``````\nssh aleian@rabbit.mytrek.com\n```\n\
  \n下面的列表显示了用户 `george` 如何访问 `turtle.mytrek.com` 上的 `cecelia` 账户：\n\n```\n[george@turtle\
  \ george]$ ssh turtle.mytrek.com -l cecelia cecelia@turtle.mytrek.com's password:\n\
  \n[cecelia@turtle cecelia]$\n```\n\n有多种选项可供你配置连接。大多数选项都有相应的配置选项，可以在配置文件中设置。例如，通过\
  \ `-c` 选项，你可以指定想要使用的加密方法，例如 `idea`、`des`、`blowfish` 或 `arcfour`。通过 `-i` 选项，你可以选择一个特定的私钥来使用。`-c`\
  \ 选项允许你以指定的级别对传输进行压缩（完整选项列表请参阅 `ssh` 手页）。\n\n## SCP\n\n你使用 `scp` 将文件从网络上的一个主机复制到另一个主机。`scp`\
  \ 设计用于取代 `rc`，它使用 `ssh` 传输数据并采用相同的验证和加密方法。如果身份验证需要，`scp` 会请求密码或短语。`scp` 程序的运行方式与\
  \ `rc` 类似。远程主机上的目录和文件通过文件名或目录之前的用户名和主机地址来指定。用户名指定 `scp` 正在访问的远程用户账户，而主机是该账户所在的远程系统。你用\
  \ `@` 将用户与主机地址隔开，用冒号将主机地址与文件或目录名隔开。下面的示例将用户当前目录下的 `party` 文件复制到位于 `rabbit.mytrek.com`\
  \ 主机用户 `aleina` 的 `birthday` 目录：\n\n```\nscp party aleina@rabbit.mytrek.com:/birthday/party\n\
  ```\n\n特别值得关注的是 `-r`（递归）选项，它允许你复制整个目录。完整列表请参阅 `scp` 手页。在下一个示例中，用户将整个 `reports` 目录复制到用户\
  \ `justin` 的 `projects` 目录：\n\n```\nscp -r reports justin@rabbit.mytrek.com:/projects\n\
  ```\n\n在下一个示例中，用户 `george` 从用户 `cecelia` 的家目录复制 `mydoc1` 文件：\n\n```\n[george@turtle\
  \ george]$ scp cecelia@turtle.mytrek.com:mydoc1 . cecelia@turtle.mytrek.com's password:\n\
  \nmydoc1 0% | | 0 --:-- ETA\n\nmydoc1 100% |*****************************| 17 00:00\n\
  \n[george@turtle george]$\n```\n\n## SFTP 和 SFTP-Server\n\n通过 `sftp`，你可以传输受加密保护的\
  \ FTP 文件。`sftp` 程序使用与 `ftp` 相同的命令。该客户端的运行非常类似于 `ftp`，具有许多相同的命令。\n\n```\nsftp download.ubuntu.com\n\
  ```\n\n要使用 `sftp` 连接到 FTP 服务器，该服务器需要运行 `sftp-server` 应用程序。SSH 服务器调用 `sftp-server`\
  \ 来为使用 `sftp` 客户端的用户提供加密的 FTP 传输。sftp 服务器和客户端使用 SSH 文件传输协议（SFTP）安全地执行 FTP 操作。\n\n\
  ### 端口转发（隧道化）\n\n如果出于某种原因，你只能通过一个不安全的主连接到安全主机，此时 SSH 提供了一种名为端口转发的功能。通过端口转发，你可以加密连接中的不安全部分。这只需指定不安全主机连接到安全主机的端口即可。这在本地主机和远程主机之间建立了直接连接，加密数据直接通过其中。该过程被称为隧道化，即通过连接的服务器创建加密数据的安全隧道。\n\
  \n你可以设置到远程系统端口或本地系统端口的端口转发。要将远程系统的端口转发到本地系统，使用带有 `-R` 选项的 `ssh`，随后是包含本地端口、远程主机地址和要转发端口的参数，每个之间用冒号隔开。这通过在远程分配一个监听套接字来实现。每当连接到此端口时，连接将通过安全通道转发，并从本地机器连接到远程端口。在下面的示例中，本地系统的\
  \ 22 端口连接到 `rabbit.mytrek.com` 远程主机的 23 端口：\n\n```\nssh -R 22:rabbit.mytrek.com:23\n\
  ```\n\n要将本地系统的端口转发到远程系统，使用 `-L` 选项，随后是包含本地端口、远程主机地址和要转发端口的参数，每两个参数之间用冒号隔开。在本地端分配一个监听套接字。每当连接到此端口时，连接将通过安全通道转发，并从远程机器连接到远程端口。在下面的示例中，本地系统的\
  \ 22 端口连接到 `rabbit.mytrek.com` 远程主机的 23 端口：\n\n```\nssh -L 22:rabbit.mytrek.com:23\n\
  ```\n\n你可以在 `.ssh/ssh_config` 文件中使用 `LocalForward` 和 `RemoteForward` 选项来为特定主机设置端口转发，或为你连接的所有主机指定一个默认值。\n\
  \n\n\n\n\n每个用户的 SSH 配置文件都位于其 `.ssh/ssh_config` 文件中。`/etc/ssh/ssh_config` 文件用于设置全局默认值。在配置文件中，你可以设置各种选项，如\
  \ `ssh_config` 手帮助文档中所列出的。该配置文件的设计用于为你可能连接的不同远程主机指定选项。它被组织成段，每个段以关键字 `HOST` 开始，随后是跟主机的\
  \ IP 地址。接下来的几行包含你为该主机设置的选项。一个段在下一个 `HOST` 条目处结束。特别关注的是 `User` 和 `Ciphers` 选项。使用\
  \ `User` 选项可以指定远程系统上允许访问的用户名。通过 `Ciphers` 选项，你可以为特定主机选择传输时使用的加密方法（`Cipher` 选项是 SSH1\
  \ 选项，已不再支持）：\n\n```\nHost turtle.mytrek.com\nUser larisa\nCompression no Ciphers\
  \ aes128-ctr\n```\n\n大多数标准选项（包括加密算法）已经以注释条的形式列出。删除 `#` 即可激活。\n\n```\nCiphers aes128-ctr,aes192-ctr,aes256-ctr,arcfour256,arcfour128,aes128-cbc,3des-cbc\n\
  ```\n\n要指定适用于你连接的任何主机的全局选项，请创建一个以星号作为主机的 `HOST` 条目，`HOST *`。此条目必须放在配置文件的末尾，因为选项仅在第一次设置时更改。该选项的任何后续条目都将被忽略。由于主机会匹配其自身的条目和全局条目，因此其特定条目应该放在全局条目之前。星号（`*`）和问号（`?`）都是通配符匹配运算符，允许你指定一组具有相同后缀或前缀的主机。\n\
  \n```\nHost *  PasswordAuthentication yes ConnectTimeout 0\nCiphers aes128-ctr\n\
  ```\n\n协议选项允许你指定使用的 SSH 版本，1、2 或两者。默认情况下，`Protocol` 选项设置为 2，即 SSH2 协议。\n\n```\n\
  Protocol 2\n```\n\n你使用 `/etc/ssh/sshd_config` 文件来配置 SSH 服务器。在这里你你会找到服务器选项，如使用的端口、密码要求和\
  \ PAM 的使用。对于服务器，仅支持 SSH2。`Protocol` 选项设置为 2。\n\n# 13. 打印服务\n\n打印服务用于在本地系统以及网络上配置并提供打印机。打印机由打印服务器作为网络资源进行。作为网络资源，网络上的多个主机可以访问同一台打印机。打印站点和资源列在表\
  \ 13-1 中。\n\n## CUPS\n\n通用 Unix 打印系统（CUPS）提供打印服务，由 Apple 作为一个开源项目开发，并根据 GNU 公共许可证免费提供。CUPS\
  \ 是大多数 Linux 发行版（包括 Ubuntu）的主要打印服务器。[`cups.org`](https://cups.org) 的 CUPS 网站提供了有关安装和管理打印机的详细文档。CUPS\
  \ 使用互联网打印协议（`IPP`），该协议为互联网提供了打印标准（[`pwg.org/ipp`](http://pwg.org/ipp)）。`IPP` 协议支持网络、PostScript\
  \ 和 Web 界面。旧的行式打印机（LPD）打印系统仅支持行式打印机。CUPS 作为网络服务器运行，使用类似于 Apache Web 服务器的配置格式。网络支持允许用户远程访问打印机。GNOME\
  \ 提供了 CUPS 的集成支持，允许基于 GNOME 的应用程序直接访问 CUPS 打印机。\n\n| 资源 | 描述 |\n| :--- | :--- |\n\
  | [`cups.org`](https://cups.org) | 通用 Unix 打印系统 |\n| [`pwg.org/ipp`](http://pwg.org/ipp)\
  \ | 互联网打印协议 |\n| [`lprng.sourceforge.net/`](http://lprng.sourceforge.net/) | LPRng\
  \ 打印服务器（Universe 仓库） |\n\n**表 13-1：打印资源**\n\n一旦安装了打印机并配置了打印服务器，就可以使用打印客户端来打印和管理打印队列。CUPS\
  \ 服务器有多种打印配置工具，例如 `system-config-printer`、CUPS 配置工具以及如 `lpq` 和 `lpc` 等各种行式打印工具，这些工具在本章稍后的部分详细介绍。请查看\
  \ Ubuntu Server Guide | File Servers | CUPS - Print Server 以获取基础配置。\n\n[`help.ubuntu.com/stable/serverguide/cups.html`](https://help.ubuntu.com/stable/serverguide/cups.html)\n\
  \nCUPS 由 systemd 管理，使用按需 socket 实现，对应 `cups.service`、`cups.socket` 和 `cups.path`\
  \ 文件。此外，特殊的 `printer.target` 单元检测打印机何时连接到你的系统。`cups.service` 文件运行 CUPS 服务器 `/usr/sbin/cupsd`（`ExecStart`）。它在\
  \ `printer.target` 激活时运行，即用户连接打印机时（`WantedBy`）。`cups.socket` 单元文件让 CUPS 在 CUPS socket\
  \ `/var/run/cups/cups.sock` 处监听请求（`ListenStream`）。实际上，CUPS 的运行类似于旧的 inetd 守护进程，仅在被请求时激活。`cups.path`\
  \ 单元在系统启动时设置 `/var/spool/cups`。\n\n```ini\n[Unit]\ncups.service \nDescription=CUPS\
  \ Scheduler\nDocumentation=cupsd(8)\nAfter=sssd.service\n\n[Service]\nExecStart=/usr/sbin/cupsd\
  \ -l\nType=simple\nRestart=always\n\n[Install]\nAlso=cups.socket cups.path\nWantedBy=printer.target\n\
  \n[Unit]\ncups.socket\ntarget\nDescription=CUPS Scheduler\nPartOf=cups.service\n\
  \n[Socket]\nListenStream=/var/run/cups/cups.sock\n\n[Install]\nWantedBy=sockets.target\n\
  \n[Unit]\ncups.path\ntarget\nDescription=CUPS Scheduler\nPartOf=cups.service\n\n\
  [Path]\nPathExists=/var/cache/cups/org.cups.cupsd\n\n[Install]\nWantedBy=multi-user.target\n\
  \n[Unit]\ncups-browsed.service\nDescription=Make remote CUPS printers available\n\
  Requires=cups.service\nAfter=cups.service avahi-daemon.service\nWants=avahi-daemon.service\n\
  \n[Service]\nExecStart=/usr/sbin/cups-browsed\n\n[Install]\nWantedBy=multi-user.target\n\
  ```\n\n**注意：行式打印机下一代（LPRng）曾是 Linux 和 UNIX 系统的传统的打印服务器，但它已从许多 Linux 发行版中删除。可以在 [`lprng.sourceforge.net/`](http://lprng.sourceforge.net/)\
  \ 获取更多有关 LPRng 的信息。**\n\n## 无驱动打印\n\n大多数新型打印机型号都支持无驱动打印。不需要安装驱动程序，打印机支持无驱动程序。你无需下载并安装驱动程序即可打印到这些打印机。打印机通过\
  \ DNS 服务发现（DNS-SD）自动检测。CUPS Web 配置界面、system-config-printer、GNOME 打印机和 lpadmin 已经支持无驱动打印。\n\
  \nCUPS 使用 `driverless` 工具检测可用的无驱动打印机并为它们生成 PPD 配置文件。驱动程序的功能可能没有官方驱动程序完整，但可以打印。目前兼容\
  \ IPP Anywhere 和 Apple Raster 支持的打印机可以使用无驱动程序，通常是较新的打印机。GNOME 打印机、system-config-printer\
  \ 和 CUP 界面都使用 `driverless` 工具来检测和配置无驱动打印机。更多信息请参阅 `driverless` 手页。\n\n可能会与 `cups-browsed`\
  \ 守护进程发生冲突，该守护进程是实现无驱动打印的一个早期尝试，对于不支持无驱动打印的打印机仍然有用。你可能需要在 `/etc/cups/cups-browsed.conf`\
  \ 文件中设置选项以支持无驱动打印。你需要设置 `OnlyUnsupportedByCUPS` 和 `CreateIPPPrinterQueues` 选项。\n\
  \n\n\n\n在使用任何打印机之前，你必须先在网络中的一个 Linux 系统上对其进行安装。本地打印机直接安装在你自己的系统上。这涉及在打印机配置文件中为打印机创建一个条目，定义打印机的类型以及其他功能，如设备的文件和使用的的文件目录（spool\
  \ directory）。在 CUPS 中，打印机配置文件为 `/etc/cups/printers.conf`。安装打印机非常简单。Linux 会尝试自动检测并配置打印机。如果无法实现，则你需要确定为打印机使用哪个设备文件以及相应的配置项。\n\
  \n**提示：如果你找不到打印机的驱动程序，可以从 OpenPrinting 数据库的 [`www.openprinting.org/drivers`](http://www.openprinting.org/drivers)\
  \ 下载。该网站维护了详尽的驱动程序列表。**\n\n## 打印机设备文件\n\nLinux 为已安装的打印机动态创建设备名称。USB 连接的打印机被视为可移动设备，可以轻松地连接到其他接口并仍被识别。对于连接到特定端口的旧型号打印机，将生成专用设备文件。例如，对于并行打印机，设备名称将为\
  \ `lp0`、`lp1`、`lp2` 等。名称中使用的数字对应于 PC 上的并行端口；`lp0`  LPT1 并行端口，`lp1`  LPT2 并行端口。串口打印机将使用串口，通过类似\
  \ `ttyS0`、`ttyS1`、`ttyS2` 等设备文件进行引用。\n\n## 打印机 URI（通用资源标识符）\n\n打印可以是本地的也可以是远程的。两者都使用通用资源标识符（URI）引用。URI\
  \ 支持用于与远程打印机通信的网络协议，也支持用于引用本地打印机的设备连接。\n\n远程打印机通过与其通信的协议引用，例如用于 UNIX 网络打印机的互联网打印协议\
  \ `ipp`，用于 Windows 网络打印机的 Samba 协议 `smb`，以及用于较旧版 LPRng Unix 服务器的 `lpd`。它们的 URI 类似于\
  \ Web URL，指明打印机所连接的系统的网络地址。\n\n```\nipp://mytsuff.com/printers/queue1\nsmb://guest@lizard/myhp\n\
  ```\n\n对于连接的本地打印机（尤其是旧型号打印机），URI 将使用设备连接和设备名称。`usb:` 前缀用于 USB 打印机，`parallel:` 用于连接到并行端口的旧打印机，`serial:`\
  \ 用于连接到串口的打印机，`scsi:` 用于连接 SCSI 的打印机。\n\n在 CUPS 的 `/etc/cups/printers.conf` 文件中，`DeviceURI`\
  \ 条目将引用打印机的 URI。对于 USB 打印机，URI 使用 `usb:`。\n\n```\nDeviceURI usb://Canon/S330\n```\n\
  \n## 打印目录 (Spool Directories)\n\n当系统打印文件时，会使用称为打印目录的特殊目录。打印任务是一个待打印的文件。当你将文件发送到打印机时，会创建该文件的副本并放在为该打印机设置的打印目录中。打印目录的位置从打印机条条目获取。在\
  \ Linux 上，打印目录位于 `/var/spool/cups` 下以打印机命名的目录中。例如，`myepson` 打印机的打印目录位于 `/var/spool/cups/myepson`。打印目录包含多个管理打印任务的文件。某些文件使用打印机名称作为扩展名。例如，`myepson`\
  \ 打印机拥有文件 `control.myepson`（提供打印队列控制）和 `active.myepson`（用于活动打印任务），以及 `log.myepson`（日志文件）。\n\
  \n## CUPS 启动与重启\n\n你可以使用 `systemctl` 命令和 `cups` 脚本来启动、停止和重启 CUPS。当你更改更改或安装打印机时，务必重启\
  \ CUPS 使更改生效。你可以使用以下命令：\n\n```\nsudo systemctl restart cups\n```\n\nCUPS 服务器配置为在系统启动时启动。`/etc/default/cups`\
  \ 脚本持有 cups 服务器的启动选项，例如用于加载并行打印机驱动模块的 `LOAD_LP_MODULE` 选项。\n\n## 安装打印机\n\n有多种工具可安装\
  \ CUPS 打印机。最简单的方法是在桌面系统使用 `system-config-printer` 工具。你也可以使用 CUPS 软件自带的基于浏览器的配置工具（可在\
  \ `lynx` 命令行浏览器工作）。或者你也可以直接编辑 CUPS 打印机配置文件。\n\n## 在桌面上使用 system-config-printer 配置打印机（系统设置-打印机）\n\
  \nLinux Mint 尝试自动检测并配置打印机。对于可移动打印机（如 USB 打印机），一旦连接打印机，它就会被检测并配置。它通过“系统设置-打印机”（system-config-printer）进行配置，并在“系统设置-打印机”对话框中出现相应的图标。如果没有驱动程序，打印机将无法被配置，且没有图标。你必须手动添加并配置打印机。\n\
  \n### system-config-printer\n\n要更改配置或添加远程打印机，可以使用打印机配置工具 `system-config-printer`，可以通过“系统设置”对话框中的“打印机”访问它。此实用程序允许你为打印机选择合适的驱动程序，并设置纸张大小和打印分辨率等打印选项。你可以配置直接连接到本地计算机的打印机，也可以配置网络上远程系统上的打印机。你可以通过应用程序启动器选择“打印机”来启动\
  \ `system-config-printer`。\n\n打印配置窗口显示已安装打印机的图标。菜单栏包含服务器配置与选择、打印机功能（如属性和打印队列）、打印类以及查看发现的打印机。工具栏具有添加新打印机和刷新打印配置的按钮。过滤搜索框允许你只显示匹配模式的打印机。点击搜索框中的\
  \ x 图标可以清除模式。点击文件搜索框中的放大镜将弹出一个菜单，允许你按名称、描述、位置和制造商/型号进行搜索。你可以将搜索保存为搜索组。\n\n要查看打印机设置（如打印机和任务选项、访问控制和策略），双击打印机图标或右键并选择“属性”。打印属性窗口将打开六个选项卡：设置、策略、访问控制、打印选项、任务选项和墨水/硒粉水平。\n\
  \n\n\n\n当打印任务在打印队列中等待时，顶部面板会出现一个打印机图标。点击此图标将打开 `Document Print Status` 窗口，列出待处理打印任务。你也可以从\
  \ `system-config-printer` 的 `Printer` 菜单`View Print Queue` 项目打开此窗口（`Printer | View\
  \ Print Queue`）。在 `Document Print Status` 窗口上，你可以更改任务的队列位置，也可以停止或删除任务（参见图 13-4）。从任务菜单，你可以取消、挂起（停止）、释放（重启）或重新打印打印任务。只有在你已经在打印机设置\
  \ `Advanced` 对话框中设置了 `preserve jobs` 选项时，才能使用重新打印。你还可以对任务进行验证。从 `View` 菜单，你可以选择仅显示刚打印的任务并刷新队列。\n\
  \n![Image](img/image-515.png)\n\n图 13-4：打印队列\n\n要检查服务器设置，从 `Server` 菜单中选择 `Settings`。这将打开一个新窗口，显示\
  \ CUPS 打印服务器设置（参见图 13-5）。`Advanced` 展开按钮显示任务历史和浏览器服务器选项。如果你想允许重新打印，请选择 `Preserve\
  \ job files (allow reprinting)` 选项。\n\n![Image](img/image-516.png)\n\n图 13-5：服务器设置\n\
  \n要选择特定的 CUPS 服务器，从 `Server` 菜单中选择 `Connect` 条目。这将打开一个 `Connect to CUPS Server`\
  \ 窗口，其中有一个下拉菜单列出了所有供选择的当前 CUPS 服务器（参见图 13-6）。\n\n![Image](img/image-517.png)\n\n\
  图 13-6：选择 CUPS 服务器\n\n## 编辑打印机配置\n\n要编辑已安装的打印机，双击其在 `Printer configuration` 窗口中的图标，或右键点击并选择\
  \ `Properties` 条目。这将打开该打印机的 `Printer Properties` 窗口。侧边栏列出了配置选项卡。点击其中一个显示该选项卡。有 `Settings`、`Policies`、`Access\
  \ Control`、`Printer Options`、`Job Options` 和 `Ink/Toner Levels` 配置选项卡（参见图 13-7）。\n\
  \n一旦执行了更改，可以点击 `Apply` 保存更改并重启打印守护进程。你可以使用 `Settings` 选项卡上的 `Tests` 和 `Maintenance`\
  \ 任务测试你的打印机。`Print Test Page` 打印页面，而 `Print Self-Test Page` 还会检查打印机硬件（如喷墨头）。\n\n\
  在 `Settings` 选项卡上，你可以更改驱动和打印机名称等配置设置，并运行测试页面（参见图 13-2）。如果你需要更改选定的驱动程序，点击 `Make and\
  \ Model` 条目旁边的 `Change` 按钮，打开打印机模型和驱动程序窗口，类似于“手动添加新打印机”节中描述的。在那里，你可以指定要使用的模型和驱动程序，甚至加载你自己的驱动程序。如果必须更改设备\
  \ `URI`（位置和协议），可以点击 `Device URI` 条目右侧的 `Change` 按钮打开 `Change Device URI` 对话框。\n\n\
  `Policies` 选项卡允许你启用禁用打印机，确定其是否共享，以及是否允许接受任务（你也可以从 `Printer` 菜单启用或共享打印机）。你还可以指定错误策略，规定发生错误时是重试还是中止打印任务，或停止打印机。你可以选择在文档开始或结束时打印横幅，指示文档的安全级别，例如机密和秘密。\n\
  \n`Access Control` 选项卡允许你拒绝某些用户的访问。\n\n`Printer Options` 选项卡用于你设置特定的打印功能，如纸张尺寸和类型、打印质量以及使用的输入槽（参见图\
  \ 13-7）。\n\n![Image](img/image-518.png)\n\n图 13-7：打印机选项\n\n在 `Job Options` 选项卡上，你可以选择默认打印功能（参见图\
  \ 13-8），如份数、方向以及单面或双面打印。选项分为三类：`Common Options`、`Image Options` 和 `Text Options`。仅显示更常用的选项。每个类别都有一个展开按钮，将显示该类别的所有选项。双面、输出顺序和介质都是\
  \ `Common Options` 类别中的展开选项。\n\n`Ink/Toner Levels` 选项卡将显示支持的打印机的墨水或墨粉水平以及状态消息。\n\
  \n![Image](img/image-519.png)\n\n图 13-8：任务选项\n\n## 默认系统级和个人打印机\n\n要将打印机设为默认打印机，可以右键点击打印机图标并选择\
  \ `Set As Default`，或者单击打印机图标，然后从 `Printer configuration` 窗口的 `Printer` 菜单选择 `Set\
  \ As Default` 条目（参见图 13-3）。这将打开 `Set Default Printer` 对话框，带有设置系统默认或个人默认的选项（参见图 13-9）。系统默认打印机是系统的默认值。\n\
  \n![Image](img/image-520.png)\n\n图 13-9：设置打印机\n\n系统默认打印机在 `Printing` 窗口的图标上有一个绿色标记。如果你希望使用不同的打印机（用户特定）作为默认，可以将其指定为个人默认。在\
  \ `Set Default Printer` 对话框中选择 `Set as default`。打印机图标上将出现个人标志——一个黄色星形。在图 13-10 中，`Samsung\
  \ M2020` 打印机是系统默认，而 `HP-DeskJet` 打印机是个人默认。\n\n![Image](img/image-521.png)\n\n图 13-10：系统级和个人打印机\n\
  \n## 手动添加打印机\n\n打印机是自动检测的，但对于旧打印机和网络打印机，你可能需要手动添加打印机。在这种情况下，点击 `Add` 按钮并选择 `Printer`。打开\
  \ `New Printer` 窗口，显示一系列对话框，你在其中选择连接、模型、驱动程序和打印机名称。\n\n在 `Select Device` 对话框中，选择相应的打印机连接信息。连接的本地打印机品牌将按名称列出，例如\
  \ `Canon`，对话框右下方会出现连接列表。对于远程打印机，指定网络连接类型，例如用于 Windows 系统的 `Windows printers via\
  \ Samba`、直接连接到网络的 `AppSocket/HP Direct`，以及用于网络上 Linux 和 Unix 系统的 `Internet Printing\
  \ Protocol (ipp)`。这些连接显示在 `Network Printer` 标题下。点击展开箭头显示它们。\n\n![Image](img/image-522.png)\
  \ ![Image](img/image-523.png)\n\n图 13-11：选择新打印机连接：已连接和未连接\n\n对于大多数已连接的打印机，你的连接通常由\
  \ `udev` 决定，它现在管理所有设备。USB 打印机只需被描述为 USB 打印机，使用 `usb` URI 设计（参见图 13-11）。对于旧的本地打印机，你可能必须选择打印机连接的端口，例如用于旧并行打印机的第一个并行端口\
  \ `LPT1`，或连接到第一个串口的 `Serial Port #1`。要手动添加 USB 打印机，你将选择 `Enter URI` 条目并输入包含 `usb://`\
  \ 前缀和你想给打印机命名的 URI，例如 `usb://myhp`。\n\n\n\n\n系统将搜索合适的驱动程序，包括可下载的驱动程序。如果找到了驱动程序，将显示“选择驱动”界面，并已为您选择了合适的驱动程序制造商。你只需点击“前进”按钮即可。在下一个同样标记为“选择驱动”的屏幕上，列出了打印机型号和驱动文件，并已为您选择了相应的项目。只需点击“前进”按钮即可。随后将显示“描述打印机”界面，你可以在其中输入打印机名称、描述和位置。这些是你个人识别打印机的方法。然后点击“应用”。\n\
  \n如果未检测到打印机驱动程序或检测错误，在“选择驱动”界面上，你可以选择从打印机数据库选择、从 PPD 驱动文件选择，或从 OpenPrinting 在线存储库进行搜索。显示内容将根据你选择的选项发生变化。\n\
  \n**注意**：某些驱动程序是直接从打印机公司网站安装的，例如某些三星驱动程序。你可能需要使用在终端窗口中运行的脚本直接安装它们。一旦安装，当你连接打印机时，它会被自动检测并配置。驱动程序也会出现在\
  \ `system-config-printer` 的“选择驱动”本地数据库列表对话框中。\n\n数据库选项列出了可能的制造商。使用鼠标选择你想要的一个（参见图\
  \ 3-12）。搜索选项显示了一个用于输入品牌和型号的搜索框。输入品牌（打印机制造商）和型号名称的一部分（见图 3-13）。搜索结果将可用在打印机型号下拉菜单中。选择你需要的项。然后点击“前进”。\n\
  \n![Image](img/image-524.png)\n图 13-12：新打印机的打印机制造商\n\n![Image](img/image-525.png)\n\
  图 13-13：从 OpenPrinting 存储库搜索打印机驱动程序\n\nPPD 文件选项显示了一个文件位置按钮，点击它可以打开“选择文件”对话框，你可以用它来定位系统上的\
  \ PPD 文件。\n\n如果你是从数据库选择打印机，在下一个屏幕上选择该制造商的型号及其驱动程序（参见图 13-14）。不过，对于某些旧打印机，驱动程序可以在在线存储库中找到，但你仍从本地数据库中选择它（驱动程序是相同的）。将列出为你的打印机选择的驱动程序。如果你的打印机有额外的选项，“可安装选项”界面将列出这些选项，允许你勾选需要的项。\n\
  \n![Image](img/image-526.png)\n图 13-14：使用本地数据库的新打印机的打印机型号和驱动程序\n\n![Image](img/image-527.png)\n\
  图 13-15：新打印机的打印机名称和位置\n\n然后你可以输入打印机名称和位置（参见图 13-15）。这些内容将使用打印机型号和你的系统主机名为你输入。你可以将打印机名称更改为任何你想要。准备好后，点击“应用”。系统将提示你打印测试页。打印配置窗口中将显示你的打印机图标。你现在已准备好打印了。\n\
  \n## CUPS 基于浏览器的配置工具\n\nCUPS 配置 Web 界面是一个基于 Web 的工具，也可以管理打印机和打印作业。显示的 Web 带有标签页，用于管理作业、打印机以及执行管理任务。你可以使用\
  \ `localhost` 地址并指定端口 `631` 来访问 CUPS 配置工具。\n\n```\nhttp://localhost:631\n```\n\n\
  在 Web 浏览器中输入 `localhost:631` URL 将打开 CUPS Web 界面的首页。有各个部分的标签页，以及用于特殊任务（如添加打印机或获取帮助）的链接（参见图\
  \ 13-16）。标签页包括管理、类、帮助、作业和打印机。你可以在“管理”标签页上管理和添加打印机。“打印机”标签页将列出已安装的打印机，并带有访问其打印队列、打印机选项和作业选项等按钮。“作业”标签页将列出你的打印作业并允许你管理它们。\n\
  \n![Image](img/image-528.png)\n图 13-16：CUPS 基于 Web 的配置工具：首页标签页\n\n当你会在会话期间尝试进行任何更改时，系统会首先要求输入管理员的用户名（你的用户名）和密码（你的用户密码），就像执行\
  \ `sudo` 命令一样。\n\n“管理”标签页显示了打印机、类、作业和服务器的分段（参见图 13-17）。服务器部分是你允许共享打印的地方。按钮允许你查看日志并更改设置。\n\
  \n![C:\\surfingturtlepress\\Books-published\\Ubuntu 16.04 books\\Ubuntu-16-04-Server\\\
  figures\\ch10\\final\\pics\\epub\\figs10-17-40.png](img/image-529.png)\n图 13-17：CUPS\
  \ 基于 Web 的配置工具：管理标签页\n\n通过 CUPS 配置工具，你通过一系列 Web 在 CUPS 上安装打印机，每个页面都会请求不同的信息。要安装打印机，点击首页或管理页面上的“添加打印机”按钮。你必须首先指定协议。在下一个屏幕上，你输入使用打印机的\
  \ URI。对于本地打印机，这就是主机名。这是打印机连接的位置。如果你有一个 PPD 文件，也可以加载它。后续页面将提示你设置打印机的默认选项，如纸张大小和类型、颜色、打印质量。\n\
  \n设置默认选项显示了一个可以配置打印机如何打印的页面（参见图 13-21）。页面顶部的链接显示了设置某些选项的页面，如通用选项、输出控制、横幅以及额外功能（如打印方向、墨水类型、颜色密度尺寸）。首先列出通用选项，可以在其中设置分辨率和纸张大小等基本功能。\n\
  \n要管理打印机，点击“打印机”标签页或 `system-config-printer`。\n\n![C:\\surfingturtlepress\\Books-published\\\
  Ubuntu 16.04 books\\Ubuntu-16-04-Server\\figures\\ch10\\final\\pics\\epub\\figs10-18-25.png](img/image-530.png)\n\
  图 13-18：添加打印机\n\n打印机页面将列出你已安装的打印机（参见图 13-19）。点击打印机链接将打开一个管理作业和执行管理任务的页面（参见图 13-20）。从“维护”下拉菜单你可以执行打印机作业任务，如暂停打印机、打印测试页和取消所有作业。“管理”菜单允许你修改打印机、删除它并设置默认选项。\n\
  \n![C:\\surfingturtlepress\\Books-published\\Ubuntu 16.04 books\\Ubuntu-16-04-Server\\\
  figures\\ch10\\final\\pics\\epub\\figs10-19-40.png](img/image-531.png)\n图 13-19：CUPS\
  \ 基于 Web 的配置工具：打印机标签页\n\n![C:\\surfingturtlepress\\Books-published\\Ubuntu 16.04\
  \ books\\Ubuntu-16-04-Server\\figures\\ch10\\final\\pics\\epub\\figs10-20-35.png](img/image-532.png)\n\
  图 13-20：CUPS 基于 Web 的配置工具：管理打印机\n\n\n\n\n图 13-21：CUPS 基于 Web 的配置工具：打印机选项\n\n注意：你可以使用\
  \ `lpadmin` 命令从命令行执行所有管理任务。更多详细信息，请参阅 CUPS 文档。\n\n## 在 CUPS 上配置远程打印机\n\n要安装连接到 Windows\
  \ 系统或运行 CUPS 的另一个 Linux 系统的远程打印机，您需要使用特殊的 URL 协议来指定其位置。对于远程主机上的另一台 CUPS 打印机，使用的协议是\
  \ `ipp`（互联网打印协议），而对于 Windows 打印机，将使用 `smb`。使用 `LPRng` 的旧版 UNIX 或 Linux 系统将使用 `lpd`\
  \ 协议。\n\n使用 CUPS 配置工具安装远程打印机，请在初始“添加打印机”页面指定远程打印机的网络协议。你可以从 Windows、互联网打印协议（其他 UNIX\
  \ 或 Linux 系统）、Apple 和 HP JetDirect 连接的打印机，以及旧的 LPD 线打印机中选择（参见图 13-22）。如果当前连接了网络打印机，它可能会列在“已发现的网络打印机”列表中。\n\
  \n![C:\\surfingturtlepress\\Books-published\\Ubuntu 16.04 books\\Ubuntu-16-04-Server\\\
  figures\\ch10\\final\\pics\\epub\\figs10-22-25.png](img/image-534.png)\n\n图 13-22：CUPS\
  \ 基于 Web 的配置工具：网络打印机\n\n### 使用 system-config-printer 在桌面上配置远程打印机\n\n你可以使用 `system-config-printer`\
  \ 在 Linux、UNIX 或 Windows 网络上设置远程打印机。当你添加新打印机或编辑现有打印机时，“新打印机”对话框将在“网络”输入下列出可能的远程连接类型。当你选择一个远程连接项时，右侧将显示一个面板，你可以在其中输入配置信息。\n\
  \n要自动查找网络上连接的任何打印机，请点击“查找网络打印机”。输入远程打印机连接的系统主机名，然后点击“查找”按钮。系统将搜索该主机并将检测到的打印机作为“网络打印机”标题下的项目显示出来（参见图\
  \ 13-23）。\n\n![Image](img/image-535.png)  ![Image](img/image-536.png)\n\n图 13-23：查找网络打印机\n\
  \n要配置特定类型的打印机，请从可用项中选择。对于远程 Linux 或 UNIX 打印机，选择用于新系统的互联网打印协议（`ipp`）或用于旧系统的 LPD/LPR\
  \ 主机或打印机。两个面板都显示了“主机名”和“队列”的项目。对于“主机名”，输入控制打印机的系统主机名。对于你网络上的 Apple 或 HP jet direct\
  \ 打印机，选择 AppSocket/HP jetDirect 项。\n\n![Image](img/image-537.png)\n\n图 13-24：选择\
  \ Windows 打印机**\n\n“通过 Samba 的 Windows 打印机”是指位于 Windows 网络 上的打印机（参见图 13-24）。你需要指定\
  \ Windows 服务器（主机名或 IP 地址）、共享名称、打印机工作组名称以及用户名和密码。打印机 SMB URL 的格式显示在“SMB 打印机”面板上。共享是\
  \ `smb` URI 格式 `//workgroup/hostname/printername` 中的主机名和打印机名称。工作组是打印机所属的 Windows\
  \ 网络工作组。在小型网络中，通常只有一个。主机名是打印机所在的计算机。用户名和密码可以是打印机资源本身的，也可以是特定用户访问的。面板顶部会显示一个框，你可以在其中输入内容。\n\
  \n\n\n\n你也可以在 CUPS Web 配置工具上创建类。选择“管理”（Administration）选项卡，并点击“添加类”（Add Class）按钮。在“添加类”页面上，你输入类的名称、其位置，然后从“成员”（Members）列表中选择要添加到类中的打印机。该类随后将出现在“类”（Classes）选项卡上，显示其成员和状态。\n\
  \n## CUPS 配置文件\n\nCUPS 配置文件位于 `/etc/cups` 目录下。这些文件列在表 13-2 中。`classes.conf` 和 `printers.conf`\
  \ 文件可以通过 Web 界面管理。`printers.conf` 文件包含你安装的不同打印机的配置信息。如果你需要，可以手动编辑这些任何一个文件。某些应用程序会有自己的配置文件，例如\
  \ Adobe Reader 的 `acroread.conf`。\n\n| 文件名 | 描述 |\n| :--- | :--- |\n| classes.conf\
  \ | 包含不同本地打印机类的配置 |\n| client.conf | 列出指定客户端的特定选项 |\n| cupsd.conf | 配置 CUPS 服务器\
  \ `cupsd` |\n| printers.conf | 包含可用本地打印机的打印机配置 |\n| cups-files.conf | CUPS 使用的文件和目录\
  \ |\n| cups-browsed.conf | 访问远程和本地打印机的访问 |\n| subscriptions.conf | 打印机和打印作业信息的订阅控制\
  \ |\n\n**表 13-2: CUPS 配置文件**\n\n### cupsd.conf\n\nCUPS 服务器通过位于 `/etc/cups` 的 `cupsd.conf`\
  \ 文件进行配置。你必须手动编辑配置选项；服务器不会通过 Web 界面进行配置。你安装 CUPS 时会安装一个带注释说明的 `cupsd.conf` 文件，其中列出了每个选项，尽管大多数选项都被注释掉了。被注释的行以\
  \ `#` 符号开头。每个选项都有详细文档说明。服务器配置使用 Apache Web 服务器语法，由一组指令组成。与 Apache 类似，这些指令中的若干个可以将其他指令分组为区块。\n\
  \n要查看 `cupsd.conf` 指令的详细说明，请检查 CUPS 的 `cupsd.conf` 文档。你也可以从 CUPS 基于浏览器的管理工具 `http://localhost:631`\
  \ 的在线帮助页“引用”（References）链接中引用此文档。\n\n[`www.cups.org/doc/man-cupsd.conf.html`](https://www.cups.org/doc/man-cupsd.conf.html)\n\
  \n`cupsd.conf` 文件从日志设置开始。\n\n```\nLogLevel warn\n```\n\n在 Linux Mint 上，CUPS 日志是禁用的。\n\
  \n```\nMaxLogSize 0\n```\n\n`Listen` 指令设置接收连接的机器和套接字。这些默认设置为本地机器 `localhost` 端口\
  \ `631`。如果你使用专用的网络接口连接到本地网络，你会添加网卡的 IP 地址，允许来自网络上机器的访问。\n\n```\n# 仅监听来自本地机器的连接。\n\
  Listen localhost:631\nListen /var/run/cups/cups.sock\n```\n\n浏览（Browsing）指令允许你的本地打印机在网络上被检测到，从而实现共享。对于共享打印，`Browsing`\
  \ 指令设置为 `on`（默认设置为 `Off`）。`allow, deny` 的 `BrowseOrder` 将拒绝所有浏览传输，首先检查 `BrowseAllow`\
  \ 指令的例外。反向顺序（`deny, allow`）相反，接受所有浏览传输，并首先检查被 `BrowseDeny` 指令拒绝的传输。默认的 `cupsd.conf`\
  \ 文件有一个 `BrowseOrder allow, deny` 指令，随后跟一个 `BrowseAllow` 指令，该指令设置为 `all`。要将此限制为特定网络，请使用网络的\
  \ IP 地址而不是 `all`。`BrowseLocalProtocols` 列出了用于在本地网络上发布打印机使用的网络协议。`BrowseAddress`\
  \ 指令将使你的本地打印机作为指定网络上的共享打印机可用。将其设置为 `@LOCAL` 以允许本地网络上的访问。你可以添加其他 `BrowseAddress`\
  \ 指令以允许其他网络的访问。\n\n```\n# 在本地网络上显示共享打印机。\nBrowsing On\nBrowseOrder allow,deny\n\
  BrowseAllow all\nBrowseLocalProtocols CUPS dnssd\nBrowseAddress @LOCAL\n```\n\n\
  CUPS 支持基本（Basic）和摘要（Digest）形式的身份验证，在 `AuthType` 指令中指定。基本认证需要用户名和密码。例如，使用 Web 界面时，会提示你输入\
  \ root 用户和 root 用户密码。摘要认证利用保存在 CUPS `/etc/cups/passwd.md5` 文件中的用户密码信息，使用用户和密码的 MD5\
  \ 版本进行认证。此外，CUPS 还支持 `BasicDigest` 和 `Negotiate` 身份验证。`BasicDigest` 将使用 CUPS md5\
  \ 密码文件进行基本认证。`Negotiate` 将使用 Kerberos 认证。默认认证类型通过 `DefaultAuthType` 指令设置，设置为 `Basic`。\n\
  \n```\n# 当需要身份验证时的默认身份验证类型...\nDefaultAuthType Basic\n```\n\nWeb 界面设置设置为 yes。\n\n\
  ```\nWebInterface Yes\n```\n\n#### 位置指令 (Location Directives)\n\n某些指令允许你在特定位置上放置访问控制。这些位置可以是打印机或资源，例如管理工具或轮池化目录。位置控制通过\
  \ `Location` 指令实现。有多个 `Location` 指令控制访问。第一个控制对服务器根目录 `/` 的访问。`Order allow, deny`\
  \ 条目激活了对远程系统访问的限制。如果没有后续的 `Allow` 或 `Deny` 条目，默认是拒绝所有。有一个隐含的 `Allow localhost` 配合\
  \ `\"Order allow, deny\"` 指令，始终允许本地机器访问。实际上，这里拒绝所有系统的访问，仅允许本地机器访问。\n\n```\n# 限制对服务器根目录的访问\n\
  Location /\nOrder allow,deny\n</Location>\n```\n\n另一个 `Location` 指令用于限制管理资源 `/admin`。`Order\
  \ allow,deny` 指令拒绝除本地机器以外的所有系统的访问。\n\n```\n# 限制对管理页面的访问...\nLocation /admin\nOrder\
  \ allow,deny\n</Location>\n```\n\n`Allow from` 和 `Deny from` 指令可以允许或拒绝特定主机和网络的访问。如果你只想允许特定机器，将使用带有机器\
  \ IP 地址的 `Allow from` 指令。CUPS 还使用 `@LOCAL` 表示你的本地网络，使用 `IF(name)` 表示用于访问网络的特定接口（*name*\
  \ 是接口设备名称）。如果你希望允许本地网络所有其他系统的管理访问，可以添加 `Allow from @LOCAL`。如果你添加了 `Allow` 指令，你还必须显式添加\
  \ `Allow localhost` 以确保本地机器的访问。\n\n```\n# 限制对管理页面的访问...\nLocation /admin\nAllow\
  \ from localhost Allow from @LOCAL Order allow,deny\n</Location>\n```\n\n以下条目将允许来自特定机器的访问。\n\
  \n```\nAllow From 192.168.0.5\n```\n\n下一个位置指令限制对 CUPS 配置 `/admin/conf` 的访问。`AuthType\
  \ default` 指令引用 `DefaultAuthType` 设置的默认值。`Require user` 指令引用 `SystemGroup` 指令 `@SYSTEM`（定义在\
  \ `cups-files.conf` 文件中）。只有该组的用户才被允许访问。\n\n```\n# 限制对配置文件的访问...\nLocation /admin/conf\n\
  AuthType Default\nRequire user @SYSTEM Order allow,deny\n</Location>\n```\n\n####\
  \ 默认操作策略：限制指令\n\n\n\n\n\n随后，为访问基础管理、打印机、打印作业和所有者操作定义默认操作策略。默认操作策略部分以 `<Policy default>`\
  \ 指令开始。`Limit` 指令用于实现每种操作的指令。作业操作涵盖发送文档、重启作业、暂停作业和重新启动作业等任务。管理任务包括修改打印机配置、删除打印机、管理打印机类以及设置默认打印机。打印机操作管理暂停打印机、启用或禁用打印机以及关闭打印机等任务。所有者操作包括取消作业和对作业进行访问验证。\n\
  \n更多信息请参见有关管理操作策略的 CUPS 文档。\n\n[`www.cups.org/doc/policies.html`](https://www.cups.org/doc/policies.html)\n\
  \n对于所有默认的 `Limit` 指令，仅允许本地机器（`localhost`）访问，`Order allow,deny`。\n\n策略部分从用户和作业信息的访问控制开始。`JobPrivateAccess`\
  \ 的默认限制访问为所有者、系统和访问控制列表。`JobPrivateValues` 指定了私有化的值，例如作业名称、源主机和源用户。`SubscriptionPrivateAccess`\
  \ 和 `SubscriptionPrivateValues` 指定了订阅属性的访问权限，例如作业完成或作业停止等打印机事件通知。\n\n`Limit` 指令用于创建和打印作业。\n\
  \n```\n<Limit Create-Job Print-Job Print-URI Validate-Job> Order deny,allow\n</Limit>\n\
  ```\n\n管理类和打印类的 `Limit` 指令均设置为 `AuthType` `default`，并限制仅供管理员用户访问，`Require user @SYSTEM`。此处显示了管理类指令。\n\
  \n```\n# 所有管理操作都需要管理员进行身份验证... <Limit CUPS-Add-Modify-Printer CUPS-Delete-Printer\
  \ CUPS-Add-Modify-Class CUPS-Delete-Class CUPS-Set-Default CUPS-Get-Devices>  AuthType\
  \ Default\n\nRequire user @SYSTEM Order deny,allow\n\n</Limit>\n```\n\n所有与作业相关的以及所有所有者的\
  \ `Limit` 指令都需要所有者或管理员身份验证，`Require user @OWNER @SYSTEM`。此处显示了 `Owner Limit` 指令。\n\
  \n```\n# 只有所有者或管理员才能取消或验证作业... <Limit Cancel-Job CUPS-Authenticate-Job> Require\
  \ user @OWNER @SYSTEM Order deny,allow\n\n</Limit>\n```\n\n对于所有其他任务，`<Limit All>`\
  \ 访问被限制在本地机器（`localhost`）。\n\n```\n<Limit All> Order deny,allow\n</Limit>\n```\n\
  \n`AuthClass` 指令可以在 `Limit` 指令中使用指定允许访问的打印机类。`System` 类包含了 root、sys 和 system 用户。\n\
  \n一组经过验证的策略指令紧随默认策略之后，具有类似的条目，并在创建和打印作业的 `Limit` 指令中增加了一个 `AuthType` 条目。\n\n```\n\
  <Limit Create-Job Print-Job Print-URI Validate-Job>  AuthType Default\n\nOrder deny,allow\n\
  \n</Limit>\n```\n\n### cupsctl\n\n你可以使用 `cupsctl` 命令来修改 `cupsd.conf` 文件，而不是直接编辑该文件。详情请查看\
  \ `cupsctl` 手页。不带选项的 `cupsctl` 命令将显示当前设置。\n\n```\ncupsctl\n```\n\n使用此命令可以进行的更改仅限于关闭远程管理或禁用共享打印。你可以设置的主要选项包括：\n\
  \n- `remote-admin`: 启用或禁用远程管理\n- `remote-any`: 启用或禁用远程打印\n- `remote-printers`: 启用或禁用远程打印机的显示\n\
  - `share-printers`: 启用或禁用与其他系统共享本地打印机\n\n### printers.conf\n\n打印机的配置信息将存储在 `/etc/cups/printers.conf`\
  \ 文件中。你可以直接检查此文件，甚至进行修改。以下是一个打印机配置条目的示例。`DeviceURI` 条目指定指定的设备，在此情况下是一个 USB 打印机。它目前处于空闲状态，没有作业：\n\
  \n```\n# CUPS 打印机配置文件\n# Written by cupsd\n\n<Printer mycannon>\nInfo Cannon s330\n\
  Location richard-server\nMakeModel Canon S330\nDeviceURI usb://Canon/S330\nState\
  \ Idle\nStateTime 1166554036\nAccepting Yes\nShared Yes\nColorManaged Yes\nJobSheets\
  \ none none\nQuotaPeriod 0\nPageLimit 0\nKLimit 0\nOpPolicy default\nErrorPolicy\
  \ retry-job\n</Printer>\n```\n\n### subscriptions.conf\n\n打印和作业信息的配置信息位于 `/etc/cups/subscriptions.conf`\
  \ 文件中。接收信息的用户由 `cupd.conf` 文件策略部分中的 `SubscriptionPrivateAccess` 和 `SubscriptionPrivateValues`\
  \ 指令指定。`Events` 指令指定了要发送的事件通知，例如作业完成、打印机停止和服务器启动等事件。`Owner` 指令列出了此订阅的用户。`LeaseDuration`\
  \ 是订阅有效的时间（0 值为打印作业的生命周期或永久）。`Interval` 是两次通知之间的时间。`Recipient` 是通知的接收者 URI。在接下来的示例中，它是\
  \ `dbus://`（你的桌面）。\n\n此处显示了一个示例 `subscriptions.conf` 文件：\n\n```\n# CUPS v2.2.7 订阅配置文件\n\
  NextSubscriptionId 31\n\n<Subscription 28>\nEvents printer-state-changed printer-restarted\
  \ printer-shutdown printer-stopped printer-added printer-deleted job-state-changed\
  \ job-created job-completed job-stopped\nOwner richard\nRecipient dbus://\nLeaseDuration\
  \ 3600\nInterval 0\nExpirationTime 1363212783\nNextEventId 1\n</Subscription>\n\
  ```\n\n### cups-files.conf\n\nCUPS 用于管理作业的文件和目录可以在 `/etc/cups/cups-files.conf` 文件中配置。`ErrorLog`\
  \ 指令指定 CUPS 错误文件。\n\n```\nErrorLog /var/log/cups/error_log\n```\n\n`SystemGroup`\
  \ 指令定义了 `cupsd.conf` 中引用的 `@SYSTEM` 用户。\n\n```\nSystemGroup lpadmin\n```\n\n###\
  \ cups-browsed.conf\n\n`cups-browsed.conf` 文件配置用于浏览远程和本地打印机的 `cups-browsed` 进程。`BrowseProtocols`\
  \ 定义了使用的协议。\n\n```\nBrowseProtocols dnssd cups\n```\n\n`BrowseAllow` 指令用于限制到指定的服务器或网络。\n\
  \n```\nBrowseAllow 192.168.1.0/24\n```\n\n`CreateIPPPrinterQueues` 指令允许检测非 CUPS\
  \ 的 IPP 打印机。\n\n## CUPS 行客户端\n\n在桌面上，你可以使用 GNOME 打印机和 CUPS 打印机配置工具等打印客户端来管理你的打印作业。对于\
  \ shell 命令行，你可以使用多个命令行打印命令。这些包括 `lpr`、`lpc`、`lpq` 和 `lprm` 命令。这些命令允许你打印文档、显示打印队列以及删除打印作业。对于网络连接，CUPS\
  \ 提供了 `-E`加密选项，允许你加密打印作业。\n\n### lpr\n\n`lpr` 命令代表行打印并将作业提交到打印队列。它的参数是要待打印的文件名。通过\
  \ `-P` 选项可以选择特定的打印机。否则使用默认打印机。在接下来的示例中，打印文件 `myletter`，然后向名为 `myprinter` 的打印机打印文件\
  \ `report`：\n\n```\n$ lpr myletter\n```\n\n在此示例中，文件 `myreport` 在 `myprinter` 打印机上打印。\n\
  \n```\n$ lpr -P myprinter myreport\n```\n\n### lpc\n\n\n\n\n\n通过 `lpc` 命令，你可以启用或禁用打印机、重新排列打印队列以及重新加载配置文件。当你在命令行中输入\
  \ `lpc` 命令时，屏幕会显示 `lpc>` 提示符。随后你可以输入 `lpc` 命令来管理你的打印机并重新排列打印任务。带有打印机名称的 `status`\
  \ 命令可以显示打印机状态，显示打印机就绪情况和队列中的打印任务数量等信息。使用 `stop` 和 `start` 命令停止或开始打印。`lpc` 命令显示为你的\
  \ CUPS 打印服务器配置的打印机。\n\n```bash\n$ lpc lpc> status myprinter\n```\n\nmyprinter:\n\
  \nprinter is on device 'usb' speed -1\n\nqueuing is enabled\n\nprinting is enabled\n\
  \n1 entry in spool area\n\n| 打印机管理 | 说明 |\n| :--- | :--- |\n| GNOME Print Manager\
  \ | GNOME 打印队列管理工具 (CUPS) |\n| CUPS 配置工具 | 打印、管理和配置 CUPS |\n| `lpr` 文件列表 | 打印文件，将文件复制到打印机的暂存目录，并将其放入打印队列以便顺序打印。`-P`\
  \ 打印机在指定的打印机上打印文件 |\n| `lpq` 选项 | 显示打印队列中的打印任务。`-P` 打印机显示指定打印机的队列 `-l` 打印详细列表 |\n\
  | `lpstat` 选项 | 显示打印机状态 |\n| `lprm` 选项（打印任务 ID 或打印机） | 从打印队列中删除打印任务。你通过 `lpq` 列出的编号来识别特定的打印任务。`-P`\
  \ 打印机移除指定打印机的所有打印任务 |\n| `lpc` | 管理你的打印机。在 `lpc>` 提示符下，你可以输入命令检查打印机状态并采取其他操作 |\n\
  \n**表 13-3: CUPS 打印客户端**\n\n### `lpq` 和 `lpstat`\n\n使用 `lpq` 命令列出打印队列中的打印任务。要查看特定打印机的任务，请使用带有打印机名称的\
  \ `-P` 选项。要列出特定用户的任务，输入用户名。使用 `-l` 选项显示每个任务的详细信息。要显示特定任务的信息，请使用该任务的 ID 编号。`lpstat`\
  \ 命令允许你检查打印机状态。\n\n```bash\n$ lpq myprinter is ready and printing\nRank Owner Jobs\
  \ File(s) Total Size\nactive chris 1 report 1024\n```\n\n### `lprm`\n\n你可以使用 `lprm`\
  \ 命令从打印机队列中删除打印任务，在任务打印前将其删除。`lprm` 使用了许多与 `lpq` 相同的选项。要删除任务，请使用任务编号运行 `lprm`。你可以使用\
  \ `lpq` 列出任务编号。使用带有打印机名称的 `-P` 选项可以移除该打印机的所有任务。如果没有为 `lprm` 指定任何选项，则会移除当前正在打印的任务。下一个命令将移除打印队列中的第一个打印任务：\n\
  \n```bash\nlprm 1\n```\n\n## CUPS 命令行管理工具\n\nCUPS 命令行管理工具包括 `lpadmin`、`lpoptions`、`lpinfo`、`cupsenable`、`cupsdisable`、`accept`\
  \ 和 `reject`（cups-client 软件包）。你可以使用 `cupsenable` 和 `cupsdisable` 命令启动和停止打印队列，并使用\
  \ `accept` 和 `reject` 命令启动和停止打印任务。通过 `lpinfo` 命令你可以显示打印机信息。`lpoptions` 允许你设置打印选项。通过\
  \ `lpadmin` 命令你可以执行管理任务，如添加打印机和更改配置。CUPS 管理工具列于表 13-4](#index_split_020.html_id_Toc16519064)\
  \ 中。\n\n注意：命令行客户端的名称以及语法与 Unix 和旧版 Linux 系统中使用的旧 LPR 和 LPRng 命令行客户端相似。\n\n| 管理工具\
  \ |  |\n| :--- | :--- |\n| `lpadmin` | CUPS 打印机配置 |\n| `lpoptions` | 设置打印选项 |\n\
  | `cupsenable` | 激活打印机 |\n| `cupsdisable` | 停止打印机 |\n| `accept` | 打印机接受新任务 |\n|\
  \ `reject` | 防止打印机接受打印任务 |\n| `lpinfo` | 列出可用的 CUPS 设备 |\n\n**表 13-4: CUPS 管理工具**\n\
  \n### `lpadmin`\n\n`lpadmin` 命令允许你选择默认打印机并为打印机配置选项。使用 `-d` 选项选择打印机作为默认。在下一个示例中，`myprinter`\
  \ 被选为默认打印机：\n\n```bash\nlpadmin -d myprinter\n```\n\n要为打印机设置选项，首先使用 `-p` 选项选择打印机。下一个示例为\
  \ `myprinter` 打印机设置描述信息（`-D` 选项）。\n\n```bash\nlpadmin -p myprinter -D Epson550\n\
  ```\n\n某些选项允许你为打印任务设置用户配额。`job-k-limit` 选项限制每个用户允许的任务大小，`job-page-limit` 确定任务的页数限制，`job-quota-period`\
  \ 限制指定时间段内的任务数量。下一个命令为每个用户设置 100 页的页数限制：\n\n```bash\nlpadmin -p myprinter -o job-page-limit=100\n\
  ```\n\n使用 `-u` 选项和允许或拒绝列表来控制访问。允许列表是 `allow:`。下一个命令设置了页数限制：\n\n```bash\nlpadmin\
  \ -p myprinter -o job-page-limit=100\n```\n\n你可以使用 `-u` 选项和允许或拒绝列表来控制访问。允许列表是 `allow:`。下一个命令允许所有用户\
  \ `all`：\n\n```bash\nlpadmin -p myprinter -u allow:all\n```\n\n### `lpoptions`\n\
  \n通过 `lpoptions` 命令，你可以设置打印格式默认值，例如颜色。使用 `-l` 选项查看打印机的可能选项。`-p` 选项选择打印机，`-d` 选项设置默认打印机。下一个命令列出\
  \ `myprinter` 的选项。\n\n```bash\nlpoptions -p myprinter -l\n```\n\n要为选项分配值，你需要使用 `-o`\
  \ 选项以及选项名和值，`-o option=value`。你可以使用 `-r` 移除选项。在下一个示例中，`sides` 选项被分配为 `two-sided`\
  \ 以启用双面打印。\n\n```bash\nlpoptions -p myprinter -o sides=two-sided\n```\n\n稍后可以使用\
  \ `-r` 移除该选项。\n\n```bash\nlpoptions -p myprinter -r sides\n```\n\n要查看可用选项列表，请检查\
  \ CUPS 软件手册中的标准打印选项：[`cups.org`](https://cups.org)。\n\n### `cupsenable` 和 `cupsdisable`\n\
  \n`cupsenable` 命令启动打印机，`cupsdisable` 命令停止它。使用 `-c` 选项可以取消打印机队列上的所有任务，`-r` 选项可以广播解释关闭的消息。此命令禁用了名为\
  \ `myprinter` 的打印机。\n\n```bash\ncupsdisable myprinter\n```\n\n这些是 **enable** 和 **disable**\
  \ 命令的版本，为了避免冲突而重命名。\n\n### `accept` 和 `reject`\n\n通过 `accept` 和 `reject` 命令，你可以控制打印机队列的访问。你可以使用\
  \ `reject` 命令停止打印机接受任务。`accept` 命令允许打印任务。下一个命令防止 `myprinter` 打印机接受打印任务：\n\n```bash\n\
  reject myprinter\n```\n\naccept 和 reject 的 man 帮助页分别是 `cupsaccept` 和 `cupsreject`。这些名称也是\
  \ `accept` 和 `reject` 命令的链接，允许你使用它们代替。\n\n\n\n\n\nLinux 提供了多种工具用于访问连接到网络的远程文件。网络文件系统（`NFS`）允许你连接并直接访问位于另一台机器上的文件或设备资源。新版本\
  \ `NFS4` 提供了更高的安全性，允许通过防火墙访问。网络信息服务（`NIS`）维护网络上所有系统的配置文件。\n\n## 网络文件系统：NFS 和 /etc/exports\n\
  \n通过 `NFS`，你可以挂载位于远程计算机上的文件系统，并将其作为系统上的本地文件系统进行访问。通过这种方式，网络上的不同主机可以访问同一个文件系统。NFS\
  \ 网站是 [`nfs.sourceforge.net`](http://nfs.sourceforge.net)。\n\n要为系统设置 NFS 服务，请安装\
  \ `nfs-kernel-server`、`nfs-common` 和 `portmap` 包（仅选择 `nfs-kernel-server` 将自动选择其他包）。\n\
  \n```bash\nsudo apt-get install nfs-kernel-server\n```\n\n## NFS 守护进程\n\n`NFS` 使用远程过程调用（`RPC`）为\
  \ TCP/IP 网络上的文件系统提供远程访问。主机系统通过导出（export）这些文件系统，使其某些文件系统对网络上的其他主机可用。导出操作通过 `/etc/exports`\
  \ 文件中的项进行配置。导出由多个守护进程实现，例如 `rpc.mountd`、`rpc.nfsd` 和 `rpc.gssd`，它们支持远程主机的访问。你可以通过\
  \ `/etc/hosts.allow` 和 `/etc/hosts.deny` 文件中的项来控制 NFS 服务器。这里列出了 `nfs-kernel-server`\
  \ 包提供的 NFS 服务器守护进程。你可以在 `/etc/default/nfs-kernel-server` 文件中配置选项。\n\n`rpc.nfsd`:\
  \ 接收来自远程系统的 NFS 请求，并将其转换为对本地系统的请求。\n\n`rpc.mountd`: 执行请求的挂载和卸载操作。\n\n`nfs-common`\
  \ 包还提供了额外的 NFS 支持守护进程。你可以在 `/etc/default/nfs-common` 文件中配置选项。\n\n`rpc.svcgssd`:\
  \ 为 `rpc` 操作提供安全保护（`rpcsec_gss` 协议）。\n\n`rpc.gssd`: 为 `NFS4` 中用于 gss-api 安全的 `rpcsec_gss`\
  \ 协议提供客户端支持。\n\n`rpc.idmapd`: 将用户和组 ID 映射到名称。\n\n`rpc.statd`: 当远程主机重启时提供锁定服务。\n\n\
  `rpc.blkmapd`: 提供设备发现和映射。\n\n`portmap` 服务器将远程过程调用程序号转换为相应的端口号。\n\nNFS 守护进程由 `systemd`\
  \ 管理，使用位于 `/lib/systemd/system` 的多个服务单元文件。NFS 守护进程及其 `systemd` 单元文件列在 表 14-1 中。\n\
  \n此处显示了 `nfs-server.service` 文件。运行时配置信息从 `/etc/default/nfs-kernel-server`（EnvironmentFile）读取。\n\
  \n```ini\nnfs-server.service\n[Unit]\nDescription=NFS server and services\nDefaultDependencies=no\n\
  Requires=network.target proc-fs-nfsd.mount\nRequires=nfs-mountd.service\nWants=rpcbind.socket\n\
  Wants=nfs-idmapd.service\nAfter= local-fs.target\nAfter= network.target proc-fs-nfsd.mount\
  \ rpcbind.target nfs-mountd.service\nAfter= nfs-idmapd.service rpc-statd.service\n\
  Before= rpc-statd-notify.service\n# GSS services dependencies and ordering\nWants=auth-rpcgss-module.service\n\
  After=rpc-gssd.service rpc-svcgssd.service\n# start/stop server before/after client\n\
  Before=remote-fs-pre.target\nWants=nfs-config.service\nAfter=nfs-config.service\n\
  [Service]\nEnvironmentFile=-/run/sysconfig/nfs-utils\nType=oneshot\nRemainAfterExit=yes\n\
  ExecStartPre=/usr/sbin/exportfs -r\nExecStart=/usr/sbin/rpc.nfsd $RPCNFSDARGS\n\
  ExecStop=/usr/sbin/rpc.nfsd 0\nExecStopPost=/usr/sbin/exportfs -au\nExecStopPost=/usr/sbin/exportfs\
  \ -f\nExecReload=/usr/sbin/exportfs -r\n[Install]\nWantedBy=multi-user.target\n\
  ```\n\n使用 `systemctl` 命令手动启动、停止和重启 NFS 服务器。\n\n```bash\nsudo systemctl start nfs-kernel-server\n\
  ```\n\n对应 `mountd` 和 `idmapd` 守护进程的 `systemd` 单元文件将运行这些守护进程。\n\n要检查 NFS 是否实际运行，你可以使用带有\
  \ `-p` 选项的 `rpcinfo` 命令。你应该看到 `mountd` 和 `nfs` 的项。如果没有，说明 NFS 未在运行。\n\n`nfsd`、`mountd`、`nfsd`\
  \ 和 `svcgssd` 守护进程的选项设置在 `/etc/default/nfs-kernel-server` 文件中，你可以在其中设置选项，例如服务器数量、优先级、端口以及是否使用\
  \ svcgsssd。\n\n```text\n/etc/default/nfs-kernel-server\n# Number of servers\nNFSDCOUNT=8\n\
  # priority of server\nNFSDPRIORITY=0\n# ports\nNFSDPORT=4000\n# whether to use svcgsssd\n\
  USE_SVCGSSD=no\n# Options for mountd\nMOUNTDOPTS=--port 4001\n# Do you want to start\
  \ gssd?\nNEEDGSSD=yes\n# Options for svcgssd\nSVCGSSDOPTS=\n```\n\n\n\n\n\n# 表 14-1:\
  \ `/etc/exports` 选项\n\n| 用户 ID 映射 | 描述 |\n| :--- | :--- |\n| `no_subtree_check`\
  \ | 不检查文件系统中的父目录以验证导出的子目录的有效性 |\n| `insecure_locks` | 不对锁定请求进行身份验证。用于旧版本的 NFS。 |\n\
  | `all_squash` | 将所有 UID 和 GID 映射到匿名用户。适用于 NFS 导出的公共 FTP 目录、新闻缓存目录等。 |\n| `no_all_squash`\
  \ | `all_squash` 的相反选项。这是默认设置。 |\n| `root_squash` | 将来自远程 root 用户的请求映射到匿名 UID/GID。这是默认设置。\
  \ |\n| `no_root_squash` | 关闭 root 压缩（squashing）。允许 root 用户以远程 root 身份访问。 |\n| `anonuid`\
  \ | 显式设置用于 `all_squash` 和 `root_squash` 选项的匿名账户的 UID 和 GID。默认值为 `nobody` 和 `nogroup`\
  \ |\n\n## NFS 主机项\n\n同一个文件夹可以有多个主机条目，每个条目都有不同的访问选项。\n\n```\nfolder-pathname  host(options)\
  \ host(options) host(options)\n```\n\n有多种方法可以指定主机。对于位于你域内的主机，只需指定主机名。其他域的主机需要完全限定域名（FQDN）。你可以使用主机的\
  \ IP 地址代替主机名。要同时引用多个主机（例如某个域下的主机），可以使用星号 `*` 后跟域名名。例如，`***.mytrek.com` 引用 `mytrek.com`\
  \ 域中的所有主机。如果你想使用 IP 地址而不是域名，则可以使用 IP 网络地址。网络地址使用子网掩码来引用一组 IP 地址。或者，你也可以使用 NIS 网络组名（netgroup\
  \ name）来指定一组主机。NIS 网络组名以 `@` 符号前缀。\n\n```\ndirectory host(options) directory *(options)\
  \ directory *.domain(options) directory 192.168.1.0/255.255.255.0(options) directory\
  \ @netgroup(options)\n```\n\n## NFS 选项\n\n`/etc/exports` 中的若干 NFS 选项允许你控制对导出文件夹的访问。`ro`\
  \ 选项提供只读访问，`rw` 选项指定读/写访问并允许更改。写入任务可以同时执行（`sync` 选项），也可以在服务器决定时执行（`async` 选项）。为了提高效率，默认情况下，相关的写入请求会同时写入（`wdelay`）。这可能会导致延迟并降低性能。如果你愿意，可以使用\
  \ `no_wdelay` 让写入立即执行。如果你导出的文件夹实际上是另一个导出文件夹的子目录，那么除非该子目录被挂载，否则它是不可访问的。这一功能通过 `hide`\
  \ 选项实现，该选项是默认值。在某种意义上，子目录在被显式挂载之前是隐藏的。`no_hide` 选项将覆盖此功能，允许在父目录已挂载的情况下，即使文件夹已导出且未挂载也可以被访问。\n\
  \n如果导出的目录实际上是较大文件系统中的子目录，则会检查其父目录以确保该子目录是有效目录（`subtree_check`）。该选项在只读文件系统中运行良好，但对于可以更改文件名和目录的写启用文件系统可能会导致问题。你可以使用\
  \ `no_subtree_check` 选项取消此检查。\n\n## NFS 用户级访问\n\n若干 NFS 选项和功能适用于用户级访问。出于安全考虑，NFS\
  \ 服务器将 NFS 客户端的 root 用户视为匿名用户，这一过程被称为“用户压缩（squashing）”。这种压缩将不允许客户端伪装成 NFS 服务器的 root\
  \ 用户。`no_root_squash` 选项允许你覆盖这种压缩，允许特定客户端的 root 用户对 NFS 服务器拥有 root 级别的控制权。\n\n压缩也可以位作用于所有用户。`all_squash`\
  \ 选项将所有 NFS 用户视为匿名用户，将他们限制在匿名组中。这将防止客户端用户尝试伪装成 NFS 服务器上的某个用户。\n\n只有当该用户在 NFS 服务器上拥有具有相同用户\
  \ ID 的对应账户时，该用户才能挂载并访问 NFS 服务器上的文件夹。如果用户 ID 不同，则它们被视为两个不同的用户。与其维护两个账户，不如使用 NIS 服务器仅在一个位置处维护你的用户\
  \ ID。\n\n## NFSv4\n\nNFS 第 4 版本是 NFS 协议的最新版本，具有增强的功能，例如更好的安全性、速度和可靠性。不过，只有少数命令是不同的。当你挂载\
  \ NFSv4 文件系统时，必须使用 `nfs4` 文件类型，而不是 `nfs`。\n\n```\nmount -t nfs4 rabbit.mytrek.com:/\
  \ /home/dylan/projects\n```\n\n你还可以使用 `fsid=0` 选项来引用根导出位置。以下条目允许你无需在挂载操作中指定，即可将文件系统挂载到\
  \ `/home/richlp` 文件夹。\n\n```\n/home/richlp *(fsid=0,ro,sync)\n```\n\nNFSv4 还支持 RPCSEC_GSS（远程过程调用安全，通用安全服务）机制，该机制提供了私公钥、加密以及支持\
  \ Kerberos 的认证。Kerberos 有两种形式：`krb5i` 数据完整性，`krb5p` 加密所有请求但会产生性能影响。使用 GSS 的示例：\n\
  \n```\n/srv/nfs4 gss/krb5i(rw,sync,subtree_check)\n/srv/nfs4/homes gss/krb5i(rw,sync,subtree_check)\n\
  ```\n\n## 应用更改\n\n每当 NFS 服务器启动时，`/etc/exports` 文件列出的文件系统都会导出。导出过程涉及读取 `/etc/exports`\
  \ 中的条目并在 `/var/lib/nfs/xtab` 中创建相应的条目。NFS 读取 `/var/lib/nfs/xtab` 文件并使用它执行实际导出。从这个意义上说，`xtab`\
  \ 文件持有导出列表。\n\n如果你向 `/etc/exports` 文件添加了条目，并希望在不重启系统的情况下导出它们，可以使用带有 `-a` 选项的 `exportfs`\
  \ 命令。添加的条目将被导出。添加 `-v` 选项会显示 NFS 正在执行的任务的消息。\n\n```\nexportfs -a -v\n```\n\n\n\n\
  \n\n如果您编辑了 `/etc/exports` 文件并对条目进行了更改，可以使用 `-r` 选项重新导出这些条目。`-r` 选项会将 `/var/lib/nfs/xtab`\
  \ 文件与 `/etc/exports` 中的条目重新同步，移除 `/etc/exports` 文件中任何缺失的导出项，并重新导出那些选项不同的条目。实际上，您正在应用对\
  \ `/etc/exports` 文件所做的的任何更改。\n\n```\nexportfs -r -v\n```\n\n如果您既添加了新条目又更改了现有的条目，可以组合添加和重新导出选项（`-r`\
  \ 和 `-a`），以导出新增的条目并重新导出编辑过的条目，同时移除已删除的条目。\n\n```\nexportfs -r -a -v\n```\n\n###\
  \ 手动导出文件系统\n您不必使用 `/etc/exports` 文件中的条目，而是可以在 shell 命令行中使用 `exportfs` 命令来导出文件系统。导出的文件系统会被添加到\
  \ `/var/lib/nfs/xtab` 文件中。使用 `exportfs` 命令时，使用 `-o` 选项来指定权限。在选项之后，输入要导出的主机和文件系统。确保主机和文件系统名称之间用冒号分隔。例如，要将\
  \ `/home/myprojects` 导出到 `golf.mytrek.com` 并赋予权限 `ro` 和 `insecure`，您可以使用以下命令：\n\n\
  ```\nexportfs -o rw,insecure golf.mytrek.com:/home/myprojects\n```\n\n您还可以配合 `-u`\
  \ 选项使用 `exportfs` 来取消导出文件系统。此操作将从 `/var/lib/nfs/xtab` 文件中移除已导的文件系统条目。下一个示例对 `/home/foodstuff`\
  \ 文件夹执行取消导出。\n\n```\nexportfs -u lizard.mytrek.com:/home/foodstuff\n```\n\n## 控制\
  \ NFS 服务器的访问\n您可以使用 `hosts.allow` 和 `hosts.deny` 文件控制本地网络对 NFS 服务器的访问。您还可以使用防火墙规则来控制来自外部主机（本地网络之外的主机）的访问。\n\
  \n### /etc/hosts.allow 和 /etc/hosts.deny\n`/etc/hosts.allow` 和 `/etc/hosts.deny`\
  \ 文件用于限制网络或互联网（如果可访问）上的主机访问服务器提供的服务。例如，您可以使用 `hosts.allow` 文件允许某些主机访问您的 FTP 服务器。`hosts.deny`\
  \ 文件中的条目会显式拒绝某些主机的访问。对于 NFS，您可以通过控制对特定 NFS 守护进程的访问来提供类似的安全保护。\n\n### Portmap 服务\n\
  portmapper 服务通知主机 NFS 服务在您系统上的位置。引用 portmapper 使用的名称为 `portmap`，如上一个示例所示。portmapper\
  \ 配置文件为 `/etc/default/portmap`。在此处您可以为 portmapper 服务设置选项。\n\n通过拒绝访问它，远程主机无法定位 NFS。为了确保\
  \ NFS 安全，您应该拒绝所有主机的访问，然后对您想要允许的主机设置例外。在 `hosts.deny` 文件中，以下条目将拒绝所有主机的访问。portmapper\
  \ 服务通过名称 `portmap` 。`ALL` 是引用所有主机的特殊术语。\n\n```\nportmap:ALL\n```\n\n对于您想要允许访问 NFS\
  \ 的主机，应将它们的名称放置在 `hosts.allow` 文件中。每个条目将包含术语 `portmap` 后跟冒号，然后是允许的主机的 IP 地址列表，用逗号分隔。这些地址可以是单个地址，也可以是用网络掩码指定的地址范围。下一个示例仅允许本地网络中的\
  \ 192.168.0.0（使用范围表示）以及单个主机 10.0.0.43 访问。\n\n```\nportmap: 192.168.0.0/255.255.255.0,\
  \ 10.0.0.43\n```\n\n但请记住，portmapper 也用于 NIS 等其他服务。如果您在 `hosts.deny` 中关闭了对 portmapper\
  \ 的所有访问，则将必须在 `hosts.allow` 中允许对 NIS 服务（如 `ypbind` 和 `ypders`）的访问。此外，如果您想允许访问 `ruptime`\
  \ 和 `rusers` 等远程命令，则必须为它们添加条目。\n\n您还应该对其他 NFS 服务（如 `mountd` 和 `statd`）添加相同的控制，如下所示的\
  \ `hosts.deny` 文件：\n\n```\nmountd:ALL\nstatd:ALL\n```\n\n在 `hosts.allow` 文件中对应的对应的条目将允许某些主机访问。\n\
  \n```\nmountd: 192.168.0.0/255.255.255.0, 10.0.0.43\nstatd: 192.168.0.0/255.255.255.0,\
  \ 10.0.0.43\n```\n\n### Netfilter 规则\n通过 Netfilter，您可以控制来自本地网络之外主机（通常是互联网）对 NFS\
  \ 服务的访问。`portmapper` 服务使用端口 111，而 `nfsd` 使用端口 2049。如果您想拒绝来自本地网络之外的网络访问 NFS，可以设置\
  \ Netfilter 规则来拒绝此类访问。在接下来的示例中，拒绝了在 eth1 网络上的访问。\n\n```bash\niptables -p tcp --dport\
  \ 111 -j DROP\niptables -p tcp --dport 2049 -j DROP\n```\n```\n\n## 挂载文件系统：NFS 客户端\n\
  主机可以挂载 NFS 提供的目录。当然，主机必须是 NFS 客户端。\n\n### 自动挂载 NFS：/etc/fstab\nNFS 目录可以通过 `/etc/fstab`\
  \ 中的条目以及 `mount` 命令自动挂载。`/etc/fstab` 中的 NFS 文件类型为 `nfs`。在挂载操作中引用 NFS 文件系统时，需要提供目录名称和主机。目录和主机之间用冒号分隔。例如，`rabbit.com:/home/project`\
  \ 引用了 **rabbit.com 主机上的 `/home/project`** 文件系统。挂载操作还需要其所在的本地路径。NFS 版本 1 到 3 的类型为\
  \ `nfs`，而版本 4 为 `nfs4`。\n\n```\nhost:remote-directory nfs options 0 0\n```\n\nNFS\
  \ 挂载操作还可以包含 NFS 挂载选项，例如读写数据包的大小（`rsize` 和 `wsize`）以及等待远程主机响应的时间（`timeo`）。还有选项允许您执行硬挂载或软挂载（`hard`\
  \ 和 `soft`）。如果要硬挂载，如果远程主机未响应，您的系统将反复尝试连接。硬挂载是默认选项。如果进行软挂载，那么当远程主机未响应时，重复尝试将在指定的限制后停止并显示错误消息。为了避免持续持续硬挂载消耗系统资源，使用软挂载可能更好。\n\
  \n在下面的 NFS 挂载示例中，远程系统为 `rabbit.mytrek.com`，要挂载的文件系统为 `/home/projects`。将被挂载到本地系统的\
  \ `/home/dylan/projects` 文件夹，该文件夹在本地系统中必须存在。文件系统类型为 `nfs`，`timeo` 选项设置等待时间为 20 分之一秒（两秒）。`soft`\
  \ 选项表示这是一个软挂载。\n\n\n\n\n\n`rabbit.mytrek.com:/home/projects /home/dylan/projects\
  \ nfs soft,intr,timeo=20`\n\n|  | 描述 |\n| :--- | :--- |\n| `rsize=n` | NFS 从 NFS\
  \ 服务器读取文件时使用的字节数。默认值为 1,024 字节。设置为 8,192 可以显著提高性能。 |\n| `wsize=n` | NFS 向 NFS 服务器写入文件时使用的字节数。默认值为\
  \ 1,024 字节。设置为 8,192 可以显著提高性能。 |\n| `timeo=n` | 超时后发送第一次重传之前的等待时间（以秒之一十为单位）。默认值为\
  \ 0.7 秒。 |\n| `retry=n` | 在放弃之前重试 NFS 挂载操作的分钟数。默认值为 10,000 分钟（一周）。 |\n| `retrans=n`\
  \ | 在发生主超时之前，NFS 挂载操作的重传次数或微超时次数（默认为 3）。此时，连接将被取消或显示“服务器未响应”消息。 |\n| `soft` | 使用软挂载挂载系统。\
  \ |\n| `hard` | 使用硬挂载挂载系统。这是默认选项。 |\n| `intr` | 允许 NFS 中断文件操作并返回到调用程序。默认不允许文件操作被中断。\
  \ |\n| `bg` | 如果第一次挂载尝试超时，则在后台继续尝试挂载。默认是直接失败而不进行后台挂载。 |\n| `tcp` | 使用 TCP 协议挂载 NFS\
  \ 文件系统，而不是默认的 UDP 协议。 |\n\n**表 14-2: NFS 挂载选项**\n\n#### 手动挂载 NFS：mount\n\n使用 `mount`\
  \ 命令和 `-t nfs` 选项，你可以手动挂载 NFS 文件系统。对于 NFSv4 文件系统，使用 `-t nfs4` 选项。以下命令手动挂载了上一个示例的内容：\n\
  \n```\nmount -t nfs -o soft,intr,timeo=20 rabbit.mytrek.com:/home/projects /home/dylan/myprojects\n\
  ```\n\n使用 `umount` 命令卸载 NFS 文件夹。挂载点可以是本地文件夹，也可以如下一个示例所示的远程主机上的文件夹。\n\n```\numount\
  \ /home/dylan/projects\numount rabbit.mytrek.com:/home/projects\n```\n\n#### 按需挂载\
  \ NFS：autofs\n\nNFS 文件系统可以使用自动挂载服务 `autofs`（autofs 软件包）自动挂载。当 `autofs` 服务激活时，文件系统会在被访问时挂载。例如，对配置了\
  \ autofs 自动挂载的文件夹执行切换目录命令 (`cd`)，就会挂载该远程文件夹。\n\nautofs 配置使用主文件来引用映射文件，映射文件指定了要自动挂载的文件系统。autofs\
  \ 主文件是 `/etc/auto.master`。在主文件中，你会找到要挂载文件夹的完整路径列表及其对应的映射文件。映射文件包含一个键（文件夹的名称）、挂载选项以及可以挂载的文件系统（其主机和路径）。`/auto`\
  \ 文件夹已经配置配置为自动挂载文件系统的路径。你可以在 `/etc/auto.master` 文件中添加文件系统，包括它们对应的映射文件。在 `/etc/auto.master`\
  \ 文件中，你会看到一个 `/auto` 目录条目，显示 `auto.misc` 为其映射文件：\n\n```\n/auto auto.misc --timeout\
  \ 60\n```\n\n主文件中的映射文件项也可以包含挂载文件夹的选项，例如 `timeout` 选项，它在执行自动卸载之前设置了一个空闲等待时间。\n\n\
  映射文件包含键、挂载选项以及要挂载的文件系统的完整路径和主机。键是文件系统挂载所在本地系统的文件夹名称。例如，要将 `rabbit.mytrek.com` 主机的\
  \ `/home/projects` 文件夹挂载到 `/auto/projects` 文件夹，使用以下条目：\n\n```\nprojects soft,intr,timeo=20\
  \ rabbit.mytrek.com:/home/projects\n```\n\n要挂载到 `/auto` 以外的文件夹，需要在主文件中为其放置条目。下一个条目使用\
  \ `auto.myprojects` 映射文件挂载到 `/myprojects` 文件夹。\n\n```\n/myprojects auto.myprojects\
  \ --timeout 60\n```\n\n随后 `/etc/auto.myprojects` 映射文件将包含 NFS 文件系统挂载条目，如下：\n\n```\n\
  dylan soft,intr,rw rabbit.mytrek.com:/home/projects\nnewgame soft,intr,ro lizard.mytrek.com:/home/supergame\n\
  ```\n\n#### 网络信息服务：NIS\n\n对于提供 NFS 服务的网络，网络上的客户端系统可以共享文件系统和设备。每个系统都必须拥有共享设备或文件系统的配置文件。对设备或文件系统的任何配置更改都意味着更新位于每个系统上的对应配置文件。为了避免这种复杂性，NFS\
  \ 提供了网络信息系统 (NIS) 服务。NIS 服务维护网络共享文件系统和设备的配置文件。如果设备和文件系统发生任何更改，你只需要更新这些设备和文件系统的 NIS\
  \ 配置。你还可以使用 NIS 服务维护用户的管理信息，例如用户 ID 和密码。对于密码更改，你只需要更新 NIS 密码文件。\n\nNIS 服务通过 `/etc/nsswitch`\
  \ 配置文件进行配置。以下是一些标准条目：\n\n```\npasswd: compat\nshadow: compat\nnetworks: files protocols:\
  \ files\n```\n\n\n\n\n标准 C 库中的不同函数必须配置为在您的 Linux 系统上运行。以前，类似于数据库的服务（例如密码支持以及 NIS\
  \ 或 DNS 等名称服务）直接访问这些函数，并使用固定的搜索顺序。这种配置是通过一种名为名称服务切换（Name Service Switch， NSS）的方案实现的，该方案基于\
  \ Sun Microsystems Solaris 2 OS 使用的同名方法。数据库源及其查找顺序列在 `/etc/nsswitch.conf` 文件中。\n\
  \n| 文件 | 描述 |\n| :--- | :--- |\n| ethers | 以太网节点 |\n| group | 用户组 |\n| hosts | 主机名和数字\
  \ |\n| netgroup | 网络范围的主机和用户列表，用于访问规则；glibc 2.1 之前的 C 库仅支持通过 NIS 使用 netgroups |\n\
  | network | 网络名称和数字 |\n| passwd | 用户密码 |\n| protocols | 网络协议 |\n| publickey | NFS\
  \ 和 NIS+ 使用的 SecureRPC 公钥和密钥 |\n| rpc | 远程过程调用名称和数字 |\n| services | 网络服务 |\n| shadow\
  \ | 影子用户密码 |\n\n表 14-3：NSS 支持的数据库\n\n`/etc/nsswitch.conf` 文件包含了受 NSS 控制的不同配置文件的条目。NSS\
  \ 支持的系统配置文件列在表 14-3 中。一个条目由两个字段组成：服务和配置规范。服务由配置文件加冒号组成。第二个字段是该文件的配置规范，它包含了关于查找程序如何运行的指令。配置规范可以包含服务规范和操作项。服务规范是要搜索的服务。目前，有效的服务规范有\
  \ `nis`、`nis-plus`、`files`、`db`、`dns` 和 `compat`（参见表 14-4）。并不是所有规范对每个配置文件都有效。例如，`dns`\
  \ 服务仅适用于 `hosts` 文件，而 `nis` 对所有文件都有效。以下示例将首先检查本地 `/etc/passwd` 文件，然后检查 NIS。\n\n\
  ```\npasswd: files nisplus\n```\n\n为了更精细地访问 `passwd`、`group` 和 `shadow` 源，您可以在文件条目中使用\
  \ `+` 和 `-` 符号来确定 nsswitch 服务是否可以访问该条目。`compat` 服务提供了兼容模式，会检查此类条目。如果没有此类条目，所有条目都将使用\
  \ `nis` 服务。`compat` 服务只能应用于 `passwd`、`group` 和 `shadow` 数据库。这提供了等同于 `files` 和 `nis`\
  \ 服务的功能。\n\n如果您的 `passwd`、`group` 和 `shadow` 文件已经有了 `+` 和 `-` 条目，且您需要文件条目优先于 `nis`\
  \ 服务，您可以在 `compat` 条目之前指定 `files` 数据库。\n\n```\npasswd: files compat\n```\n\n操作项指定了针对特定服务要执行的操作。操作项放置在服务后的括号内。配置规范可以列出多个服务，每个服务都有自己的操作项。在以下示例中，`hosts`\
  \ 文件的条目有一个配置规范，说明检查 `/etc/hosts` 文件和 `mdns4_minimal` 服务，如果未找到，则检查 DNS 服务器（`dns`），如果仍然未解析，则为如\
  \ `localhost` 等主机名获取本地配置。\n\n```\nhosts: files mdns4_minimal [NOTFOUND=return] dns\
  \ myhostname\n```\n\n| 服务 | 描述 |\n| :--- | :--- |\n| files | 检查对应的 `/etc` 文件获取配置（例如，用于\
  \ hosts 的 `/etc/hosts`）；此服务对所有文件有效 |\n| db | 检查对应的 `/var/db` 数据库获取配置；除 `netgroup`\
  \ 外的所有文件均有效 |\n| compat | 提供 `nis` 和 `files` 服务，并对 `+` 和 `-` 条目提供兼容性支持。仅适用于 `passwd`、`group`\
  \ 和 `shadow` 文件 |\n| dns | 检查 DNS 服务；仅适用于 `hosts` 文件 |\n| nis | 检查 NIS 服务；对所有文件都有效\
  \ |\n| nisplus | NIS 版本 3 |\n| hesiod | 使用 Hesiod 进行查找 |\n| myhostname | 使用 `gethostname`\
  \ 操作获取主名的本地配置 |\n\n表 14-4：NSS 配置服务\n\n操作项由一个状态和一个操作组成。状态持有服务查找的可能结果，操作是当状态为真时要执行的操作。目前，可能的状态值为\
  \ `SUCCESS`、`NOTFOUND`、`UNAVAIL` 和 `TRYAGAIN`（服务临时不可）。可能的操作有 `return` 和 `continue`：`return`\
  \ 停止配置文件的查找过程，而 `continue` 继续到下一个列出的服务。在前面的示例中，如果在 NIS 中未找到记录，查找过程将结束。\n\n这里显示了\
  \ `/etc/nsswitch.conf` 文件的副本，它列出了常用的条目。注释和被注释的条目以 `#` 符号开头：\n\n```\n/etc/nsswitch.conf\n\
  \n# /etc/nsswitch.conf\n#\n# GNU 名称服务切换功能的示例配置。\n# 如果您安装了 `glibc-doc-reference`\
  \ 和 `info` 包，请尝试：\n# `info libc \"Name Service Switch\"` 获取信息。\npasswd: compat systemd\n\
  group: compat systemd\nshadow: compat gshadow: files hosts: files mdns4_minimal\
  \ [NOTFOUND=return] dns myhostname\nnetworks: files protocols: db files\nservices:\
  \ db files\nethers: db files\nrpc: db files\nnetgroup: nis\n```\n\n# 15. Samba\n\
  \nLinux Samba 服务器允许 Windows 网络上的客户端访问共享文件和打印机，反之也允许 Linux 系统访问这些资源。Samba 让 Linux\
  \ 系统像 Windows 服务器一样运行，使用与 Windows 相同的协议。UNIX 和 Linux 系统使用 TCP/IP 协议进行网络，而微软 Windows\
  \ 使用服务器消息块（SMB）协议。SMB 协议使用称为网络基本输入输出（NetBIOS）的网络接口，允许 Windows 系统共享资源。SMB 最初是为小型网络设计的。对于大型网络，微软开发了通用文件系统（CIFS），它仍然使用\
  \ SMB 和 NetBIOS。\n\nSamba 服务器和客户端是由 Andrew Tridell 创建的，旨在连接 Linux 系统到 Windows PC。它们允许\
  \ Unix 和 Linux 系统无缝连接 Windows 网络。Windows 系统可以在 Unix/Linux 上共享资源。在某种意义上，Samba 是专业的、开源且免费的\
  \ CIFS 版本。通过 Samba，您可以使用 Linux `cifs` 文件系统将共享文件夹挂载到您的 Linux 系统上。\n\n\n\n\n你可以从 [`www.samba.org`](https://www.samba.org)\
  \ 的 Web 和 FTP 网站获取大量的文档。Samba HOW-TO 文档也可以 [`www.tldp.org`](http://www.tldp.org)\
  \ 获取。你的系统 `/usr/share/doc/samba` 目录中提供了示例。\n\n请查看《Ubuntu 服务器指南》中的 Samba 部分以进行基础配置和管理。\n\
  \n[`help.ubuntu.com/stable/serverguide/samba.html.en`](https://help.ubuntu.com/stable/serverguide/samba.html.en)\n\
  \n## Samba 应用\n\nSamba 服务器提供四种服务：文件和打印机服务、认证与授权、名称解析以及服务公告。Samba 软件包安装了两个守护进程 `smbd`\
  \ 和 `nmbd` 以及若干实用程序（参见表 12-2）。SMB 守护进程 `smbd` 提供文件和打印机服务，以及这些服务的认证和授权。这允许网络上的用户共享文件夹和打印机。对这些服务的访问由用户密码控制。当用户尝试访问共享文件夹时，系统会提示输入密码。每个用户都有不同的密码，Samba\
  \ 维护一个独立的 Samba 密码文件：`/etc/samba/smbpasswd`。\n\n`nmbd` 服务器提供名称解析和服务公告。名称解析将 NetBIOS\
  \ 名称解析为 IP 地址。服务公告则可以公布网络上可用的服务，从而实现浏览。\n\nSamba 服务器软件默认不安装。如果你还没有安装它，应该进行安装。在安装之前，你将无法与其他\
  \ Windows 系统共享 Linux 文件夹。在“软件管理器”中搜索并安装 Samba 软件包。此外，如果你尝试直接在文件管理器中共享文件夹（编辑菜单上的“共享选项”），系统会提示你安装\
  \ Samba 服务器，并提供一个按钮进行安装。你也可以在终端窗口中使用下述 `apt-get` 命令。\n\n```bash\nsudo apt-get install\
  \ samba\n```\n\n你可以使用 GNOME 桌面工具 `system-config-samba` 来配置你的 Samba 服务器，设置对 Samba\
  \ 共享的安全访问。配置文件保存在 `/etc/samba` 目录中。\n\n你还可以安装 `winbind` 软件包，它运行 `winbind` 守护进程。该守护进程允许\
  \ Samba 服务器使用 Windows 域提供的认证服务。通过 `winbind`，Samba 服务器可以使用 Windows 域认证服务来验证用户，而不是使用它自己的用户集。\n\
  \nSamba 软件包还包含支持工具，例如 `smbstatus`（用于显示 SMB 服务器的当前状态以及谁在使用它）和 `pdbedit`（用于编辑 SMB\
  \ 密码数据库）。附加包提供了支持工具，如 `smbclient`，它允许 Linux 系统访问 Samba 服务（仅限命令行）。`mount.cifs` 和\
  \ `umount.cifs` 命令允许 Linux 系统挂载和卸载 Samba 共享文件夹。它们通过 `mount` 命令配合 `-t cifs` 选项调用。你使用\
  \ `testparm` 来测试你的 Samba 配置。`smbtar` 是一个 shell 脚本，可以将 SMB/CIFS 共享资源直接备份到 Unix 磁带驱动器。`nmblookup`（此处应为\
  \ nmblookup）命令将将 Windows 电脑的 NetBIOS 名称映射到其 IP 地址。通过 `smbcontrol` 命令，你可以向 Samba\
  \ 服务器（`smbd`、`nmbd` 和 `winbindd`）发送管理消息，例如关闭共享、重载配置或关闭服务器。\n\n## 启动和访问 Samba\n\n\
  安装完成后，Samba 通常被配置为自动启动。对于简单的 Samba 配置，你可以使用 `system-config-samba` 来配置你的 `/etc/samba/smb.conf`\
  \ 文件。如果你作了更改，必须重启 Samba 服务器才能生效。要使用你的新配置重启 Samba，请使用 `systemctl` 命令。start、stop 和\
  \ restart 选项将启动、停止和重启服务器。在终端窗口运行以下命令来重启 Samba。\n\n```bash\nsudo systemctl restart\
  \ smbd\nsudo systemctl restart nmbd\n```\n\n| 应用 | 说明 |\n| :--- | :--- |\n| nemo-share\
  \ | Nemo 文件管理器的文件共享扩展 |\n| caja-share | Caja 文件管理器的文件共享扩展 |\n| system-config-samba\
  \ | Samba 配置工具（由 Red Hat 提供），用于通过 GNOME 桌面界面配置 `smb.conf` |\n| smbd | Samba 服务器守护进程，为\
  \ SMB 客户端提供文件和打印机服务 |\n| nmbd | Samba 守护进程，提供 NetBIOS 名称解析和支持浏览器支持 |\n| winbind\
  \ | 使用由 Windows 域提供的认证服务 |\n| mount.cifs | 在 Linux 客户端上挂载 Samba 共享目录（由 mount 命令配合\
  \ -t cifs 选项使用） |\n| smbpasswd | 更改 Samba 服务器上的 SMB 加密密码 |\n| pdbedit | 编辑 Samba\
  \ 用户数据库文件。这是一个安全帐户管理器 (SAM) 数据库 |\n| tdbbackup | 备份 Samba `.tdb` 数据库文件 |\n| smbcontrol\
  \ | 向 Samba 服务器发送管理消息，如关闭或关闭共享 |\n| smbstatus | 显示 SMB 网络连接的当前状态 |\n| testparm |\
  \ 测试 Samba  `smb.conf` |\n| nmblookup | 将 Windows 电脑的 NetBIOS 名称映射到其 IP 地址 |\n|\
  \ /etc/default/samba | Samba 启动选项 |\n\n**表 15-2: Samba 服务器应用**\n\nSamba 服务器由两个守护进程组成：`smbd`\
  \ 和 `nmbd`。你可能需要先用 `systemctl` 命令启用它们，然后使用 `service` 命令启动它们。在提示符处（在桌面上打开终端窗口），使用\
  \ `sudo` 命令获取管理权限，随后对 `smbd` 服务器使用 `systemctl` 命令的 `enable` 选项进行启用。对 `nmbd` 服务器执行相同的操作。然后使用\
  \ `systemctl` 命令配合 `start` 选项启动它们。一旦启用，服务器应在每次系统启动时自动启动。\n\n```bash\nsudo systemctl\
  \ enable nmbd\nsudo systemctl enable smbd\nsudo systemctl start nmbd\nsudo systemctl\
  \ start smbd\n```\n\nSamba 由 `systemd` 管理，使用 `/lib/systemd/system` 目录下的 `smbd.service`\
  \ 和 `nmbd.service` 文件。这里显示了 `smbd.service` 文件。Samba 在本地、网络、文件系统挂载以及 Cups 服务之后启动（After）。它在\
  \ `multi-user.target` 之前启动（运行级别 2、3、4 目标是链接）。\n\n\n\n\n\n`IPtables` 防火墙阻止了从 Linux\
  \ 桌面浏览 Samba 和 Windows 共享。要绕过此限制，你需要确保你的防火墙将 Samba 视为受信任的服务。为了允许防火墙访问 Samba 端口，你应该使用如\
  \ `ufw` 等防火墙配置工具启用访问。Samba 端口为 `125/TCP`、`137/UDP` 和 `138/UDP`。此外，Samba 使用微软服务发现服务，该端口为\
  \ `445/TCP`。\n\nLinux Mint 会自动为你的防火墙配置 Samba 访问。如果要在命令行界面上使用 `UFW` 默认防火墙进行手动配置，你需要使用以下\
  \ `ufw` 命令。`UFW` 防火墙将其 `IPtables` 文件维护在 `/etc/ufw` 中。\n\n```\nufw allow 135/tcp\n\
  ufw allow 137:138/udp\nufw allow 445/tcp\n```\n\n如果你在桌面界面操作，可以使用 `Gufw` 工具为 `UFW`\
  \ 防火墙设置 Samba 端口。你必须将这些端口作为简单规则添加（见第 17 章）。在桌面上，`UFW` 防火墙阻止从桌面对 Samba 进行远程文件浏览（网络窗口），因为浏览使用了未被允许的额外广播包。你必须添加一条规则允许从端口\
  \ `137/udp` 访问任何，或者输入以下命令。该规则将广播限制在本地网络。大多数私有网络使用本示例指定的网络地址 `192.168.0.0/24`（见第\
  \ 11 章，防火墙部分中的 `Gufw`）。\n\n```\nsudo ufw allow from 192.168.0.0/24 port 137 proto\
  \ udp\n```\n\n如果你正在使用 `FirewallD`（见第 11 章，防火墙部分中的 `FirewallD`），请在 `Zone | Services`\
  \ 标签页中选择 `samba` 条。你可以在 `Service | Samba` 标签页上配置端口。\n\n如果你直接管理 `IPtables` 防火墙，可以通过添加以下\
  \ `IPtables` 规则来管理访问。该规则接受针对 TCP/IP 协议包的端口 137、138 和 139 的输入。\n\n```\niptables -A\
  \ INPUT -p tcp --dport 135 -j ACCEPT\niptables -A INPUT -p udp --dport 137-138 -j\
  \ ACCEPT\niptables -A INPUT -p tcp --dport 445 -j ACCEPT\n```\n\n## 在桌面上设置 Samba\n\
  \n可以使用 GNOME 文件管理器（`nemo-share` 和 `caja-share`）的文件夹共享功能轻松设置文件夹共享，见第 3 章。对于更复杂的配置，你可以编辑\
  \ `/etc/samba/samba.conf` 文件，或者使用桌面配置工具如 `system-config-samba`、`Smb4k` 或 `shares-admin`（第\
  \ 15 章）。`system-config-samba` 工具（见图 15-1）提供了一个基础配置。`system-config-samba` 工具不被 Ubuntu\
  \ 或 Linux Mint 直接支持，但在 Ubuntu Universe 仓库中可用。使用 Synaptic 包管理器安装 `system-config-samba`\
  \ 包。安装后，你还需要在终端窗口中使用 `touch` 命令创建一个空的 `/etc/libuser.conf` 文件。\n\n```\nsudo touch\
  \ /etc/libuser.conf\n```\n\n然后你可以从管理菜单作为 Samba 运行它。\n\n![Image](img/image-539.png)\n\
  \n**图 15-1：使用 system-config-samba 的 Samba 服务器配置**\n\n**注意：如果你已经使用 Nemo 或 Caja 的共享功能为\
  \ Windows 系统设置了文件共享，system-config-samba 将显示这些 Samba 共享的配置信息。**\n\n### Samba 服务器配置\n\
  \n你首先必须配置 Samba 服务器，指定可以访问共享资源（如目录和打印机）的用户。在 Samba 偏好菜单中，选择“服务器设置”（Server Settings）打开服务器设置对话框。在“基本”（Basic）标签页上，输入你的\
  \ Windows 网络工作组名称（见图 15-2）。Windows 提供的默认名称为 `MSHOME` 或 `WORKGROUP`。使用已分配给你的 Windows\
  \ 网络的工作组名称。对于家庭网络，你可以自己决定。只需确保所有计算机都使用相同的工作组名称。在 Windows 系统上，控制面板的“系统”应用程序将向你显示\
  \ Windows 工作组名称。描述是你希望在 Windows 系统上显示的 Samba 服务器的名称。\n\n![Image](img/image-540.png)\n\
  \n图 15-2：Samba 服务器设置，基本标签\n\n在“安全”（Security）标签页上，你可以选择你想要使用的认证类型（见图 15-3）。认证模式指定了访问级别，可以是用户（user）、服务器（server，独立的认证服务器）、`ADS`（Kerberos\
  \ 域）或域（domain，Windows 控制器）。用户级访问通过用户密码限制访问。通常，你会选择加密密码，而不是让其以明文通过网络传输。`Guest` 用户是用于允许访问你想向任何用户开放的共享或打印机的账户名称，而无需提供密码。弹出菜单将列出所有项。\n\
  \n![Image](img/image-541.png)\n\n图 15-3：Samba 服务器设置，安全标签\n\n### Samba 用户配置\n\n你首先必须配置\
  \ Samba 服务器，指定可以访问目录和打印机等共享资源的用户。在 Samba 偏好菜单中，选择“服务器设置”打开服务器设置对话框。在“基本”标签页上，输入你的\
  \ Windows 网络工作组名称（见图 15-2）。Windows 提供的默认名称为 `MSHOME` 或 `WORKGROUP`。使用已分配给你的 Windows\
  \ 网络的工作组名称。对于家庭网络，你可以自己决定。只需确保所有计算机都使用相同的工作组名称。在 Windows 系统上，控制面板的“系统”应用程序将向你显示\
  \ Windows 工作组名称。描述是你希望在 Windows 系统上显示的 Samba 服务器的名称。\n\n（注：此处原文重复，翻译已按要求处理）\n\n\
  在“安全”标签页上，你可以选择你想要使用的认证类型（见图 15-3）。认证模式指定了访问级别，可以是用户（user）、服务器（server，独立的认证服务器）、`ADS`（Kerberos\
  \ 域）或域（domain，Windows 控制器）。用户级访问通过用户密码限制访问。通常，你会选择加密密码，而不是让其以明文通过网络传输。`Guest` 用户是用于允许访问你想向任何用户开放的共享或打印机的账户名称，而无需提供密码。弹出菜单将列出所有项。\n\
  \n![Image](img/image-541.png)\n\n图 15-3：Samba 服务器设置，安全标签\n\n### Samba 用户\n\n对于认证，你将把\
  \ Samba 用户与特定的 Linux 账户关联。在偏好菜单中选择“用户”（Users）打开用户对话框。如果你想添加新用户，点击“添加用户”打开“创建用户”窗口（见图\
  \ 15-4）。在那里你可以选择用户名并输入 Samba 密码。用户名菜单列出了系统上的所有用户。当 Windows 用户访问 Samba 共享时，他们必须提供\
  \ Samba 密码。如果你使用的用户名包含空格，请将其括起来。\n\n![Image](img/image-542.png)\n\n图 15-4：用户\n\n\
  一旦你创建了 Samba 用户，其名称将出现在 Samba 用户列表中。若要修改或删除 Samba 用户，使用用户窗口，从列表中选择用户并点击“编辑用户”按钮进行更改，或点击“删除用户”按钮删除用户。\n\
  \n![Image](img/image-543.png)\n\n图 15-5：创建新用户\n\n![Image](img/image-544.png)\n\n\
  图 15-6：基本标签\n\n### Samba 共享\n\n要设置简单共享，在服务器配置窗口中点击“添加共享”，这将打开“创建共享”窗口（见图 15-6）。\n\
  \n![Image](img/image-545.png)\n\n图 15-7：共享，访问标签\n\n在“基本”标签页上，选择要共享的 Linux 文件夹（点击“浏览”查找它），然后指定它是否可写且可见。在“访问”标签页上，你可以选择将共享开放给所有人，或仅针对特定用户（见图\
  \ 15-7）。系统上的所有 Samba 用户都列了出来并带有复选框，你可以从中选择想要授予访问的用户。\n\n![Image](img/image-546.png)\n\
  \n图 15-8：带有共享的 Samba\n\n你的新共享将显示在服务器配置窗口中（见图 15-8）。显示共享的目录、共享名称、可见性、读写权限和描述。\n\n\
  \n\n\nSamba 的安全性基于用户名和密码，这被称为用户级安全。远程客户端上的用户使用 Samba 密码登录 Samba 服务器。Samba 密码的出现是为了适应\
  \ Windows 的密码加密和登录需求，这些需求与 Linux 使用的机制有所不同。为了管理这些密码，Samba 必须维护一个独立的兼容 Windows 的密码数据库。它不能使用\
  \ Linux 密码数据库。对于登录，Windows 还会使用如用户登录位置等额外信息。\n\n要让用户从 Windows 系统登录 Samba 共享，该用户必须在相应的\
  \ Samba 服务器上已经有一个相应的用户账户。这些用户是 `system-config-samba` Samba 用户窗口中列出的用户（参见图 15-4）。该用户账户还必须有一个\
  \ Samba 密码。实际上，该账户有两个密码：用于在 Linux 上访问该账户的 Linux 用户账户密码，以及用于从远程系统访问 Samba 共享的 Samba\
  \ 密码。通过这种方式，Linux 用户变成了 Samba 用户。\n\n通常，Samba 用户账户名称与尝试登录的 Windows 名称不同。为了处理这种情况，可以将\
  \ Windows 用户名与相应的 Samba 用户名关联。名称可能相同，也可能不同。Windows 用户到 Samba（Linux）用户的映射存储在 `/etc/smbusers`\
  \ 文件中。在 `system-config-samba` 上，“创建新 Samba 用户”窗口允许你在 Windows 用户名目中输入 Windows 用户名（参见图\
  \ 15-5）。以下是将 Windows 用户 `rpetersen` 映射到 Samba（Linux）用户 `richard`：\n\n```\nrichard\
  \ = rpetersen\n```\n\n当 Windows 中的 Windows 用户尝试访问 Samba 共享时，用户将被提示登录。根据前面的示例，Windows\
  \ 用户将输入 `rpetersen` 作为用户名，以及为 `richard` 设置的 Samba 密码。在 `system-config-samba` 上，这是在“创建新\
  \ Samba 用户”窗口的 Samba 密码项中输入的 Samba 密码（参见图 15-5）。\n\n在 Ubuntu 上，用户级安全由密码 `tdb`（简单数据数据库）后端数据库管理。`tdb`\
  \ 数据库文件存储带有 Windows 扩展信息的 Samba 密码。默认情况下使用 `tdbsam` 后端数据库。tdbsam 数据库为小型网络设计。对于使用\
  \ LDAP 管理用户的系统，你可以使用启用 LDAP 的后端 `ldbsam`，它是为较大的网络设计的。\n\n```\nsecurity = user\n\
  passdb backend = tdbsam\n```\n\n你可以使用 `username map` 选项指定用于关联 Windows 和 Linux 用户的文件。Windows\
  \ 用户可以使用 Windows 用户名作为关联用户登录。用户名映射文件通常是 `/etc/samba/smbusers`。\n\n```\nusername\
  \ map = /etc/samba/smbusers\n```\n\n对于 LDAP Samba 数据库 `ldbsam`，你使用 LDAP Samba 工具管理用户（`smbldap-tools`\
  \ 包）。这些工具以 `smbldap` 为前缀。工具包括用于添加、修改和删除用户及组的（`smbldap-useradd`、`smbldap-userdelete`\
  \ 和 `smbldap-groupmod`）。`smbldap-passwd` 命令通过 LDAP 管理 Samba 密码。`smbldap-userinfo`\
  \ 命令显示用户信息。LDAP Samba 工具配置在 `/etc/smbldap-tools/smbldap.conf` 文件中。\n\nSamba 服务器有一个密码\
  \ PAM（可插拔认证模块）模块 `pam_smbpass.so`，它为 Samba 密码提供 PAM 认证。这将允许 Windows 主机用于受 PAM 控制的网络。该模块配置在你的\
  \ PAM `samba` 文件中。PAM `samba` 文件中的以下项目需要 Samba 服务器的 PAM 认证和密码：\n\n```\nauth required\
  \ pam_smbpass.so nodelay\npassword required pam_smbpass.so nodelay\n```\n\n要让 PAM\
  \ 与 Samba 工作，请在 `smb.conf` 文件中启用 PAM：\n\n```\nobey pam restrictions = yes\n```\n\
  \n## Samba 密码：smbpasswd\n\n在用户级安全下，Windows 客户端访问 Samba 服务器资源仅限于该客户端上的用户。访问 Samba\
  \ 服务器时使用的用户名和 Samba 密码必须在 Samba 密码数据库中注册。\n\n你可以使用 `system-config-samba` 或 `smbpasswd`\
  \ 工具管理 Samba 密码。在 `system-config-samba` 上，你使用 Samba 用户窗口（首选项 | Samba 用户）来添加或编辑密码（参见图\
  \ 15-4）。或者，你可以在终端窗口中使用 `smbpasswd` 命令来添加或稍后更改密码。要为特定用户添加或更改密码，使用带有用户名的 `smbpasswd`\
  \ 命令：\n\n```\n$ sudo smbpasswd dylan\nNew SMB Password: new-password Repeat New\
  \ SMB Password: new-password\n```\n\n用户可以使用 `smbpasswd` 更改自己的密码。下面的示例显示了你如何使用 `smbpasswd`\
  \ 更改你的 Samba 密码。如果你没有 Samba 密码，可以按回车键。\n\n```\n$ sudo smbpasswd\nOld SMB password:\
  \ old-password New SMB Password: new-password Repeat New SMB Password: new-password\n\
  ```\n\n如果你想使用空密码，可以使用带有 `-n` 选项的 `smbpasswd`。`smb.conf` 文件将 `null passwords` 设置为\
  \ yes。如果你使用的是旧的 smbpasswd 文件，请确保 Samba 配置了加密。将 `encrypt passwords` 选项设置为 yes。\n\n\
  ### 管理 Samba 用户：smbpasswd 和 pdbedit\n\n你可以使用 `smbpasswd` 和 `pdbedit` 管理 Samba 密码。对于\
  \ `smbpasswd` 命令，`-a` 选项添加用户，`-x` 选项删除用户。使用 `-e` 和 `-d` 选项启用或禁用用户。\n\n```\nsudo\
  \ smbpasswd -a aleina\n```\n\n`smbpasswd` 命令可以将 Samba 密码保存到旧的 smbpasswd 文件或新的 tdbsam\
  \ 数据库文件。Ubuntu 目前使用 tdbsam 数据库。`pdbedit` 命令设计用于此数据库。通常使用 `pdbedit` 而不是 `smbpasswd`\
  \ 来管理你的 Samba 用户。使用 `pdbedit` 添加用户使用 `-a` 选项，删除用户使用 `-x` 选项。\n\n```\nsudo pdbedit\
  \ -a dylan\n```\n\n与 `smbpasswd` 不同，通过 `pdbedit` 命令可以显示更多用户信息。`-L` 选项显示数据库中的用户。添加\
  \ `-v` 选项以获取详细信息。对于特定用户，如下所示：\n\n```\nsudo pdbedit -Lv richard\n```\n\n你甚至可以显示域策略（`-P`\
  \ 选项），例如最小密码长度或重试次数。\n\n```\nsudo pdbedit -P\n```\n\n如果你想导入导出导出条目，使用 `-i` 和 `-e`\
  \ 选项。以下将从旧的 `smbpasswd` 文件导入到新的 `tdbsam` 后端数据库。\n\n```\nsudo pdbedit -i smbpasswd\
  \ -e tdbsam\n```\n\n## Samba smb.conf 配置文件\n\nSamba 配置位于 `/etc/samba` 目录下的 `smb.conf`\
  \ 文件。它包含了各种共享资源的配置以及适用于所有资源的全局选项。\n\n你可以在终端窗口中使用 `testparm` 命令来检查对 `/etc/samba/smb.conf`\
  \ 文件所做任何更改的语法。\n\n```\ntestparm\n```\n\n\n\n\n`/etc/samba/smb.conf` 文件由两个部分组成：一个用于全局选项，另一个用于共享服务。共享服务，也称为共享（shares），可以是文件空间服务（客户端将其作为原生文件系统的扩展使用）或打印服务（客户端用于访问运行服务器的主机上的打印服务）。文件空间服务是一个赋予客户端访问权限的目录；它们可以使用其中的空间作为本地文件系统的扩展。打印服务则允许客户端访问打印服务，例如由\
  \ Samba 服务器管理的打印机。\n\n`/etc/samba/smb.conf` 文件包含了 Ubuntu 使用的默认设置。你可以编辑该文件来自定义配置。注释行以\
  \ `#` 符号开头。被禁用的条目以分号 `;` 开头。要启用此类条目，只需删除开头的分号符号即可。要查看 Samba 配置参数的完整列表，请检查 `smb.conf`\
  \ 的帮助页（Man page）。\n\n如所述，`smb.conf` 文件通过“全局设置”（Global Settings）和“共享定义”（Share Definitions）两个标签（注释）组织两个主要组。全局设置部分包含几个子部分：浏览/识别（Browsing/Identification）、网络（Networking）、调试/计数（Debugging/Accounting）、身份验证（Authentication）、域（Domains）、打印（Printing）和杂（Misc）。首先设置全局选项，然后是每个共享资源的配置。\n\
  \nSamba 根据共享文件夹和打印机等资源进行配置。`smb.conf` 文件中的每个资源都定义在自己的部分（section）中。部分是 `smb.conf`\
  \ 文件的基本元素。一个部分包含括在括号的服务名称，随后是应用于资源的选项。例如，一个共享文件夹部分包含了引用该文件夹并为用户定义访问权限的选项。全局选项放置在一个名为\
  \ `global` 的特殊部分中。还存在名为 `printers` 和 `homes` 的特殊部分，它们为用户文件夹和所有共享打印机提供默认选项。在这些特殊部分之后，你可以进入服务器上特定文件夹和打印机的服务定义。\n\
  \n部分的格式始终从部分标签开始，即括在括号中的共享资源名称。除了特殊部分外，部分标签可以是您任选择的任何名称。在部分标签之后，在不同的行中输入该服务的不同参数（选项）。大多数参数定义了服务的访问权限。例如，你可能希望一个共享文件夹是可浏览的，但只读的，并使用某台打印机。参数以\
  \ `parameters name` = `value` 的格式输入。你可以通过在注释行开头放置分号在部分内添加注释。\n\n这是一个部分配置的简单示例。部分标签括在括号中，随后是两个参数条目。`path`\
  \ 参数引用共享文件夹。`writeable` 参数指定用户是否对该文件夹具有写权限。\n\n```\n[mysection]\npath = /home/chris\n\
  writeable = true\n```\n\n打印服务具有相同的格式，但需要某些其他参数。`path` 参数指定打印机池化文件夹的位置。`read-only`\
  \ 和 `printable` 参数设置为 `true`，表示该服务是只读且可打印的。`public` 参数允许任何人访问该服务。\n\n```\n[myprinter]\n\
  path = /var/spool/samba\nread only = true\nprintable = true\npublic = true\n```\n\
  \n`writeable` 选项是 `read only` 选项的反别名。`writeable = yes` 条目等同于 `read only = no` 条目。`read\
  \ only = no`、`writeable = yes` 和 `write ok = yes` 选项都为用户提供了写权限。\n\n### 变量替换\n\n\
  对于分配给参数的字符串值，你可以结合替换运算符。这为指定可能依赖于上下文的值（如用户名）提供了更大的灵活性。例如，假设服务需要为每个登录的用户使用单独的目录。此类目录的路径可以使用\
  \ `%u` 变量指定，该变量会替换为当前用户名。字符串 `path = /tmp/%u` 对于 `justin` 用户将变为 `path = /tmp/justin`，对于\
  \ `dylan` 用户将变为 `path = /tmp/dylan`。表 15-3 列出了几个较常见的替换变量。\n\n| 变量 | 说明 |\n| :---\
  \ | :--- |\n| %S | 当前服务的名称 |\n| %P | 当前服务的根目录 |\n| %u | 当前服务的用户名 |\n| %H | 用户的家目录\
  \ |\n| %h | 运行 Samba 的互联网主机名 |\n| %m | 客户端机器的 NetBIOS 名称 |\n| %L | 服务器的 NetBIOS\
  \ 名称 |\n| %M | 客户端机器的互联网名称 |\n| %I | 客户端机器的 IP 地址 |\n\n**表 15-3: Samba 替换变量**\n\n\
  提示：`writeable` 选项是 `read only` 选项的反别名。`writeable = yes` 条目等同于 `read only = no` 条目。\n\
  \n### 全局设置\n\n全局设置部分为 Samba 服务器提供配置，并指定可能在目录和文件夹部分使用的默认值。在此部分中，你将找到工作组名称、密码配置、浏览和日志文件的条目。\n\
  \n#### 浏览/识别\n\nWorkgroup 条目指定了你想给网络设置的工作组名称。这是在 Windows 客户端“网络”窗口中显示的工作组名称。`smb.conf`\
  \ 文件中的默认 Workgroup 条目所示：\n\n```\n[global]\n# 将此更改为工作组/NT 域名称\nworkgroup = WORKGROUP\n\
  ```\n\n工作组名称对于支持 Samba 的每个 Windows 客户端必须相同。在许多 Windows 网络中，默认值为 WORKGROUP。这也是 `smb.conf`\
  \ 文件中指定的默认名称。如果你想使用另一个名称，必须更改 `smb.conf` 文件中的 `workgroup` 条目。在示例中，工作组名称为 `mygroup`。\n\
  \n```\nworkgroup = mygroup\n```\n\n`server string` 条目包含了你想在客户端系统上显示的服务器描述性名称。在 Windows\
  \ 系统上，这是 Samba 图标上显示的名称。默认是 Samba Server，但你可以将其更改为任何名称。\n\n```\n# server string\
  \ 等同于 NT 描述字段\nserver string = %h (Samba, Ubuntu)\n```\n\n注意：你还可以配置 Samba 作为 Windows\
  \ NT 网络的主域控制器（PDC）。作为 PDC，Samba 设置其他系统将使用的 Windows 域，而不是参与已建立的工作组。\n\n名称服务解析通常由\
  \ WINS 服务器（Windows NetBIOS 名称服务，**nmbd**）提供。如果你的本地网络已经有一个 WINS 服务器，你可以指定该服务器。此处显示了注释默认条目。将\
  \ `w.x.y.z` 替换为你网络的 WINS 服务器名称。\n\n```\n; wins server = w.x.y.z\n```\n\n你的 Samba\
  \ **nmbd** 服务器的 WINS 支持必须关闭以避免冲突，这将你的 Samba 名称解析服务器变为纯客户端。关闭 WINS 支持的注释条目所示：\n\n\
  ```\n# wins support = no\n```\n\n如果你的网络也有它想要用于名称解析的自己的域名服务（DNS）服务器，你可以启用它。默认情况下，它是关闭的，如下所示。将\
  \ `no` 更改为 `yes` 以允许使用网络的 DNS 服务器进行 Windows 名称解析。同样，WINS 支持必须关闭。\n\n```\ndns proxy\
  \ = no\n```\n\n#### 网络\n\n\n\n\n此子节包含接口指令，用于将网络接口设备分配给特定的网络以供您的服务器使用。这些项目默认都是被注释的。此处显示了针对第一个以太网设备上\
  \ localhost 的注释默认项。请务必将 `eth0` 替换为网络设备的实际名称（可预测名称），例如 `enp7s0`。你可以使用 `ifconfig`\
  \ 来查找名称。\n\n```\n; interfaces = 127.0.0.0/8 eth0\n```\n\n如果运行您的 Samba 服务器的系统没有受防火墙保护，或者防火墙运行在同一系统上，您还应该启用以下项。\n\
  \n```\n; bind interfaces only = yes\n```\n\n### 调试/计费\n\n此部分包含用于设置 Samba 服务器日志的指令。日志文件指令使用\
  \ `%m` 替换符号配置，以便为每个连接到服务器的机器设置单独的日志文件。\n\n```\nlog file = /var/log/samba/log.%m\n\
  ```\n\n日志文件的最大大小设置为 1000 行。\n\n```\nmax log size = 1000\n```\n\n要让 Samba 仅通过 syslog\
  \ 记录日志，请将 `syslog` `only` 选项设置为 yes。\n\n```\nsyslog only = yes\n```\n\nsyslog 指令设置为\
  \ 0，以便仅向系统日志记录简要信息。详细日志将由 Samba 服务器自行处理。\n\n```\nsyslog = 0\n```\n\n`panic action`\
  \ 指令在发生崩溃时通知管理员。\n\n```\npanic action = /var/share/samba/panic-action %d\n```\n\n\
  ### 身份验证\n\nSamba 服务器的角色可以是独立服务器、成员服务器或域控制器（主、备用或活动目录）。通常情况下，服务器是一台独立服务器。服务器角色决定了安全性。对于独立服务器，安全性是\
  \ `user`，这需要密码登录。\n\n```\nserver role = standalone server\n```\n\nWindows 客户端在登录过程中使用加密密码。密码默认是加密的，并由密码数据库管理。在接后的项目中，安全性设置为用户级（`user`），且密码数据库文件使用\
  \ `tdbsam`。\n\n```\npassdb backend = tdbsam\n```\n\n你可以使用 `security` 选项来指定安全性：`user`（用户密码）、`domain`（Windows\
  \ 域）或 `ads`（Kerberos 安全性）。`auto` 设置是默认值，它根据服务器角色派生安全性。如果服务器角色是 `standalone server`，则安全性为\
  \ `user` 且在 `smb.conf` 文件中未指定。\n\n随后开启对可插身份模块（PAM）安全性的支持。\n\n```\nobey pam restrictions\
  \ = yes\n```\n\n同步 unix 密码与 smb 密码。\n\n```\nunix password sync = yes\n```\n\n当更改\
  \ Samba 密码时，需要将其与 UNIX 密码同步。`unix` `password sync` 指令开启同步，而 `passwd program` 和 `passwd\
  \ chat` 指令则使用 `passwd` 命令和指定的提示来更改密码。\n\n```\nunix password sync = yes\npasswd program\
  \ = /usr/bin/passwd %u\npasswd chat = *Enter\\snew\\s*\\spassword:* %n\\n *Retype\\\
  snew\\s*\\spassword:* %n\\n *password\\supdated\\ssuccessfully* .\n```\n\nPAM 也用于\
  \ Samba 客户端更改密码。\n\n```\npam password change = yes\n```\n\n作为安全措施，你可以将 SMB 服务的访问限制在某些指定的本地网络中。在主机的网络上，输入你允许访问的本地网络的网络地址。要拒绝网络中除几个特定主机以外的所有访问，你可以在网络地址后使用\
  \ `EXCEPT` 选项加上这些主机的 IP 地址。localhost (127) 始终会被自动包含。下一个示例允许访问两个本地网络：\n\n```\nhosts\
  \ allow = 192.168.1. 192.168.2.\n```\n\n`map to guest` 指令设置为 `bad user`。这将允许任何未知用户以访客身份登录。然而，登录失败的\
  \ Samba 用户将不允许访问，即使作为访客也是。\n\n```\nmap to guest = bad user\n```\n\n### 域\n\n`Domains`\
  \ 子节将您的 Samba 服务器配置为微软公共域控制器 (PDC)。所有这些指令默认都是被注释的。请参见本章稍后关于“公共域控制器”的章节，了解如何在 Microsoft\
  \ 网络上将您的 Samba 服务器设置为 PDC。\n\n### 杂项\n\n`Misc` 子节包含用于自定义您的服务器的项目。大多数都被注释了，但 `usershare`\
  \ 指令除外，它允许用户创建公共共享。`include` 指令让你能够在 `/home/samba/etc` 目录下为特定机器设置配置文件，这些文件在机器连接时会被读取。\n\
  \n```\n; include = /home/samba/etc/smb.conf.%m\n```\n\n还有针对那些使用 Winbind 服务器的用户的项目，指定了用户和组\
  \ ID 范围以及使用的 shell。\n\n```\n# winbind 的某些默认设置（确保你没有将这些范围\n# 用于其他用途。）\n; idmap uid\
  \ = 10000-20000\n; idmap gid = 10000-20000\n; template shell = /bin/bash\n```\n\n\
  `usershare` 指令允许非 root 用户共享文件夹。`user max shares` 的注释项可用于限制用户可以设置的共享数量。\n\n```\n\
  \      usershare max shares = 100\n```\n\n`usershare` 指令允许非 root 用户共享文件夹。`user allow\
  \ guests` 指令允许访客访问共享。\n\n```\n# 允许拥有 usershare 权限的用户创建\n# 公共共享，而不仅仅是身份验证的\nusershare\
  \ allow guests = yes\n```\n\n你可以使用访客登录让任何人无需密码即可访问资源。Samba 通常配置为使用 `nobody` 用户作为访客用户。或者，你可以设置并指定特定用户作为访客用户。你可以通过\
  \ `smb.conf` 文件中的 `guest ok` 和 `guest account` 项来指定访客用户（你也可以在 system-config-samba\
  \ 服务器设置、安全选项卡、访客账户中设置访客用户）。\n\n```\nguest ok = yes\nguest account = nobody\n```\n\
  \n此外，该部分提供了若干性能优化，例如为 Linux 系统设置套接选项。\n\n### 共享定义\n\n共享定义部分将包含常用共享的定义，以及你设置的任何共享，如目录或打印机。有三个特殊部分：homes、netlogon\
  \ 和 profiles，用于特殊目的。\n\n#### Homes 部分\n\n`homes` 部分适用于系统上的用户主目录。它设置了远程用户访问用户主目录的默认控制。将\
  \ `browseable` 设置为 no 可以防止远程用户在文件浏览器中列出文件。用户对文件的读取访问由 `read only` 选项决定。`create mask`\
  \ 和 `directory mask` 选项为远程用户在主目录中创建的新文件和文件夹设置默认权限。通常这些权限设置为 0700，允许所有者读/写/执行权限。`valid\
  \ users` 选项使用 `%S` 宏映射到当前服务。你可以添加 `writeable` 指令以允许写入访问。\n\n```\nwriteable = yes\n\
  ```\n\n目录项在 `smb.conf` 配置文件中被注释掉了，默认禁用了对主目录的访问。要启用主目录访问，请删除 `smb.conf` 文件中每个项目前面的\
  \ own。\n\n如果你正在设置 PDC 并选择将用户配置文件保存在用户主目录中，则 homes 部分及其项目必须取消注释。\n\n```\n[homes]\n\
  comment = Home Directories\nbrowseable = no\nread only = yes\ncreate mask = 0700\n\
  directory mask = 0700\nvalid users = %S\n```\n\n####打印机和 print$ 部分\n\n\n\n\n`printers`\
  \ 节指定了访问打印机的默认控制选项。这些选项用于没有对应特定节的打印机。将 `browseable` 设置为 `no` 仅会向客户端隐藏打印机节，而不是隐藏打印机本身。`path`\
  \ 条目指定了 Samba 用于打印文件池化目录的路径。要启用打印功能，必须将 `printable` 条目设置为 `yes`。要允许访客用户打印，将 `guest\
  \ ok` 条目设置为 `yes`。此处是 `printers` 节的标准实现示例：\n\n```ini\n[printers]\ncomment = All\
  \ Printers\nbrowseable = no\npath = /var/spool/samba\nprintable = yes\nguest ok\
  \ = no\nread only = yes\ncreate mask = 0700\n```\n\n接下来显示的 `print$` 节指定了 Windows\
  \ 客户端可以在你的 Samba 服务器上找到打印驱动程序的位置。驱动程序位于 `/var/lib/samba/printers` 目录，并且是只读的。`browseable`、`read-only`\
  \ 和 `guest` 指令被注释掉了。可以启用它们以允许浏览驱动程序。`write list` 指令将允许你远程管理 Windows 打印驱动。`lpadmin`\
  \ 是你的管理员组的名称。\n\n# Windows 客户端查找此共享名称作为下载打印驱动程序的来源\n\n```ini\n[print$]\ncomment\
  \ = Printer Drivers\npath = /var/lib/samba/printers\nbrowseable = yes\nread only\
  \ = yes\nguest ok = no\n; write list = root, @lpadmin\n```\n\n### 共享\n\n共享资源的节（例如系统上的文件夹）位于\
  \ `Homes` 和 `Printers` 节之后。共享文件夹的节以该共享的标签开始。其后是关于其路径和权限的选项，每个选项占一行。`path = *option`\
  \ 条目包含文件夹的完整路径。在 `comment = *option` 条目中，你可以对该共享进行描述。权限选项允许你将文件夹设置为可写、公共或只读。`valid`\
  \ 和 `users` 选项允许你通过特定用户来控制对共享的访问。对于任何未输入的选项，将使用 `Global`（全局节``Homes` 和 `Printers`\
  \ 节中的默认值。\n\n接下来的示例 `myprojects` 共享将 `/myprojects` 文件夹定义为对任何具有访客访问权限的用户开放的共享资源。\n\
  \n```ini\n[myprojects]\ncomment = Great Project Ideas\npath = /myprojects\nread\
  \ only = no\nguest ok = yes\n```\n\n使用 `valid` `users` 选项限制特定用户的访问。若要关闭所有其他用户的访问，将\
  \ `guest ok` 选项设置为 `no`。\n\n```ini\n[mynewmusic]\ncomment = New Music\npath = /home/specialprojects\n\
  valid users = mark, richard\nguest ok = no\nread only = no\n```\n\n在接下来的示例中，`Documents`\
  \ 文件夹对 `george` 和 `richard` 用户可用且可写。\n\n```ini\n[Documents]\npath = /home/richard/Documents\n\
  writeable = yes\nbrowseable = yes\nvalid users = georgep, richard\n```\n\n如果你想允许公共访问文件夹，将\
  \ `guest ok` 条目设置为 `yes`，且不设置 `valid users` 条目。\n\n```ini\n[newdocs]\ncomment =\
  \ New Documents\npath = /home/newdocs\nguest ok = yes\nread only = no\n```\n\n在\
  \ `valid users` 选项中列出的用户赋予了每个用户对其创建文件的控制权。你可以通过 `create mask` 选项指定文件权限来进一步管理对文件的控制。在此示例中，权限被设置为\
  \ 765，这为所有者提供了读/写/执行权限，为组员提供了读/写权限，并为所有其他人仅提供读/执行权限（默认值为 744，即组和其他权限为只读）。\n\n```ini\n\
  [myshare]\ncomment = Writer’s projects\npath = /usr/local/drafts\nvalid users =\
  \ Justin, chris, dylan\nguest ok = no\nread only = no\ncreate mask = 0765\n```\n\
  \n### 打印机共享\n\n对特定打印机的访问定义在 `smb.conf` 文件的 `Printers` 节中。对于打印机，你需要包含 `Printer` 和\
  \ `Printable` 条目，并指定使用的打印服务器类型。通过 `Printer` 条目，你为打印机命名，通过将 `Printable` 条目设置为 `yes`，允许其打印。你可以通过\
  \ `valid` `users` 条目和将 `Public` 条目设置为 `no` 来控制对特定用户的访问。若要允许公共访问，将 `public` 条目设置为\
  \ `yes`。对于 CUPS 服务器，将打印选项设置为 `cups`。\n\n接下来的示例设置了一个访客用户可以访问的打印机。这允许网络上的任何用户使用该打印机。用户需要对打印机的池化目录（位于\
  \ `/var/spool/samba`）具有写权限。请记住，任何打印机必须先安装在你的系统中。下例打印机已安装为 `myhp`。你使用 CUPS 管理工具为\
  \ CUPS 服务器设置打印机。`Printing` 选项可以从 `Printers` 共享继承。\n\n```ini\n[myhp]\npath = /var/spool/samba\n\
  read only = no\nguest ok = yes\nprintable = yes\nprinter = myhp\noplocks = no\n\
  share modes = no\nprinting = cups\n```\n\n如果你需要，也可以将打印机的使用限制为特定用户，拒绝公共访问，就像你可以限制共享一样。在下一个示例中，打印机仅供\
  \ `larisa` 和 `aleina` 用户访问。如果你需要，可以添加其他用户。\n\n```ini\n[larisalaser]\npath = /var/spool/samba\n\
  read only = no\nvalid users = larisa aleina\nguest ok = no\nprintable = yes\nprinting\
  \ = cups\nprinter = larisalaser\noplocks = no\nshare modes = no\n```\n\n## 测试 Samba\
  \ 配置\n\n如果你修改了 `smb.conf` 文件，应该对其进行测试。使用 `testparm` 查看是否正确。默认情况下，`testparm`  `/etc/samba/smb.conf`。如果你想使用不同的配置文件，可以将其作为参数传递给\
  \ `testparm`。\n\n## Samba 公共域控制器\n\nSamba 还可以作为域控制器（PDC）。域控制器将在网络上注册并宣告。PDC 为 共享的访问提供了更集中的控制方式。它提供了\
  \ netlogon 服务和 `NETLOGON` 共享。PDC 会为每个 Windows 和 Samba 客户端设置机器信任帐户。虽然你可以手动操作，但 Samba\
  \ 会为你完成。\n\n### 微软域安全\n\n如文档所述，微软域安全的主要优势是单点登录（SSO）。实际上，登录你的用户账户也就登录了整个网络共享资源的访问。你不需要在尝试访问共享网络资源时都进行身份验证。身份验证通过安全\
  \ ID（SID）管理，它由网络 ID（NID）和相对 ID（RID）组成。RID 引用个人账户。每个帐户都分配有一个独立的 RID，即使是组或系统帐户也是如此。SID\
  \ 用于设置网络不同共享资源的访问控制列表（ACL），允许资源自动识别你的身份。\n\n### 基本 Samba PDC 配置选项\n\n要配置 PDC，请编辑\
  \ `smb.conf` 文件中的 `Domains` 节。在这里你将找到配置 Samba PDC 选项的条目。某些其他条目位于其他地方。`domain master`\
  \ 条目位于 `Misc` 节。\n\n此处是基本的 PDC 选项。\n\n```ini\n[Domains]\nworkgroup = myworkgroup\n\
  domain logons = yes\ndomain master = yes\nsecurity = user\n```\n\n\n\n\n如果 netbios\
  \ 名称与运行服务器的主机名不同，你可以通过添加 `netbios name` 选项来指定它。\n\n```\nnetbios name = myserver\n\
  ```\n\n### 基础配置\n\n与大多数 Samba 配置一样，PDC 需要一个 Samba 后端。`tdbsam` 已经为你配置好了。安全级别应为 `user`。这通常是默认值并且已经设置好了。`smb.conf`\
  \ 中的条目所示：\n\n```\npassdb backend = tdbsam\n```\n\nPDC 必须被指定为网域主器（domain master）。默认设置为\
  \ `auto`。对于 PDC，将其设置为 `yes`；对于 BDC（备用网域控制器），将其设置为 `no`。\n\n```\ndomain master =\
  \ yes\n```\n\nPDC 具有浏览器功能，通过它可以定位你网络上的系统和共享内容。这些功能没有出现在 `smb.conf` 文件中，但如果需要，你可以手动添加它们。`local\
  \ master` 选项仅在你有另一个想要作为本地主器的运行 PDC 时才使用。你的网络中可能运行多个网域控制器。你的 Microsoft 网络将进行选举以选择哪一个成为主器。`os\
  \ level` 设置了该 PDC 的优先级。它应该高于 `32`，以获得高于网络上其他网域控制器的优先级，确保该 PDC 被选为主主网域控制器。`preferred\
  \ master` 选项会在启动时启动浏览器选举。\n\n```\n; local master = no os level = 33\npreferred master\
  \ = yes\n```\n\n### 网域登录配置\n\nSamba PDC 使用网域登录服务，用户可以通过该服务登录网络。微软将该网域登录服务称为 `netlogon`\
  \ 服务。它所使用的 Samba 共享也称为 `netlogon`。要配置网域登录服务，你需要将 `domain logons` 选项设置为 `yes`，或者如果你将\
  \ `server role` 选项设置为“primary classic domain controller”（主经典网域控制器）或“backup domain\
  \ controller”（备用网域控制器）。\n\n```\ndomain logons = yes\n```\n\n`logon path` 引用用户使用的配置文件。`%N`\
  \ 将是服务器名，`%U` 引用用户名。配置文件可以设置在独立的配置文件共享（profiles share）中，也可以在用户主目录中。以下内容将引用配置文件共享中的用户配置文件。你还需要通过取消\
  \ `smb.conf` 文件中的配置文件共享条目的注释来定义配置文件共享。\n\n```\nlogon path = \\\\%N\\Profiles\\%U\n\
  ```\n\n如果配置文件存储在用户主目录而不是配置文件共享中，则应取消相应条目的注释。你还需要通过取消 homes 共享条目的注释来允许访问用户主目录。\n\n\
  ```\nlogon path = \\\\%N\\%U\\profile\n```\n\n`logon drive` 和 `logon home` 指定了用户主目录的位置。登录驱动器被设置为\
  \ `H:` 盘符。`%N` 解析为服务器名，`%U` 解析为用户名。\n\n```\nlogon drive = H:\nlogon home = \\\\\
  %N\\%U\n```\n\n登录脚本可以由系统设置，也可以由用户设置。\n\n```\n# 登录脚本名称取决于机器名称\nlogon script = logon.cmd\n\
  ```\n\n然后你可以启用用户添加操作，以便向 PDC 添加用户、组和机器。`add machine` 条目允许 Samba 在 Windows 系统首次加入由\
  \ PDC 控制的网络时，自动为它们添加受信任的机器账户。\n\n```\nadd user script = /usr/sbin/adduser --quiet\
  \ --disabled-password --gecos \"\" %u\nadd machine script = /usr/sbin/useradd -g\
  \ machines -c \"%u machine account\" -d /var/lib/samba -s /bin/false %u\nadd group\
  \ script = /usr/sbin/addgroup --force-badname %g\n```\n\n你仍然需要在 `smb.conf` 文件中设置一个\
  \ netlogon 共享。该共享持有 `netlogon` 脚本，在此情况下为 `/var/lib/samba/netlogon` 目录，该目录不应该是可写的，但应该允许所有用户访问（Guest\
  \ OK）。在 `smb.conf` 文件的共享定义部分，你会发现 `[netlogon]` 部分被注释掉了。请移除该条目的分号注释，如下所示：\n\n```ini\n\
  # 取消以下注释并为网域登录创建 netlogon 目录\n# (你还需要配置 Samba 作为网域控制器)\n[netlogon]\ncomment = Network\
  \ Logon Service\npath = /home/samba/netlogon\nguest ok = yes\nread only = yes\n\
  ```\n\n如果你选择使用配置文件共享来存储用户配置文件，则你应该启用 `profiles` 共享。取消以下内容（移除前面的分号）来定义 `profiles`\
  \ 共享。这些条目位于 `netlogon` 共享之后。\n\n```ini\n[profiles]\ncomment = Users profiles\npath\
  \ = /home/samba/profiles\nguest ok = no\nbrowseable = no\ncreate mask = 0600\ndirectory\
  \ mask = 0700\n```\n\n`profile` 共享是存储用户 netlogon 配置文件的地方。相反，如果你使用用户主目录来存储配置文件，则不需要定义和使用\
  \ `profiles` 共享。如果你选择将用户配置文件存储在用户主目录中，则应取消 `homes` 共享条目的注释。\n\n## 使用客户端访问 Samba\
  \ 服务\n\n连接到 SMB 网络的任何客户端系统都可以访问 Samba 服务器提供的共享服务。你可以使用 `smblclient` 命令访问共享文件夹，然后运行命令操作那里的文件。如果你想将共享文件夹挂载到系统上的本地文件夹以提供直接访问，可以使用带有\
  \ `-t cifs` 的 `mount` 命令。\n\n### 从桌面访问 Windows 共享\n\n在桌面桌上，你可以使用文件管理器访问 Samba 共享。目前，Linux\
  \ 和 Windows 正在向 SMB3 渡。结果是，通过文件器的网络浏览无法工作。你可以通过在位置框中输入共享文件夹的地址直接访问 Windows 共享。对于地址\
  \ `smsmb://`，后面应接主机名和共享文件夹名。在提示输入 Samba 密码后，将显示特定的共享文件夹或该主机上的所有共享文件夹。\n\n如果你想启用桌面浏览，可以在\
  \ Global（全局）部分通过以下命令强制使用 SMBv1 协议。\n\n```ini\nname resolve order = bcast host wins\n\
  client max protocol = NT1\n```\n\n### 从 Windows 访问 Samba 共享\n\n从 Windows 访问 Samba\
  \ 共享对于 Windows 10 来说是一个问题。Windows 10 的升级禁用了 Windows 的 SMBv1 网络浏览功能，因为它正在从 SMBv1\
  \ 迁移到 SMBv3。你可以尝试手动重新启用 SMBv1 浏览，但由于安全问题，SMBv1 已被禁用。不建议重新启用。这意味着你目前无法简单浏览 Linux\
  \ 主机，但你仍然可以轻松设置对该 Linux 主机每个 Samba 共享文件夹的访问。\n\n从 Windows 10 访问 Samba Linux 共享仍然简单。你只需为它添加一个新的网络位置，就可以在\
  \ Windows 文件管理器的“此电脑”文件夹中通过设置的快捷方式访问它。要设置快捷方式，打开任意文件夹 Windows 文件管理器，右键点击侧栏中的“此电脑”项以显示菜单。点击“添加网络位置”条目打开“添加网络位置向导”并点击下一步。点击“选择自定义网络位置”并点击下一步。在标记为“Internet\
  \ 或网络地址:”的文本框中输入要访问的 Linux 系统的主机名，以双反斜杠开头并后跟一个反斜杠（你可能还需要输入该系统上的某个共享文件夹名称）。\n\n```\n\
  \\\\richard-laptop\\\n```\n\n\n\n\n然后你可以点击 `Browse` 按钮打开一个对话框，显示该主机上所有共享文件夹的树形结构。你可以选择一个共享，或者该共享的任何子文件夹。它们的文件路径将自动添加到地址文本框中。或者，你也可以直接在文本框中输入文件夹路径，并用单个反斜杠分隔子文件夹。如果你正在共享\
  \ Linux 家目录，那么共享文件夹的名称就是用户主目录（Home）的名称，即用户名。此处显示了示例。\n\n`\\\\richard-laptop\\richard`\n\
  \n`\\\\richard-laptop\\richard\\Pictures`\n\n`\\\\richard-laptop\\mydocs`\n\n一旦在\
  \ Windows 中设置好共享文件夹的位置，你就可以通过“此电脑”文件夹中的快捷方式再次快速访问它们。\n\n注意：在未来的更新中，原始的浏览功能可能会恢复。届时，你应该能够从\
  \ Windows 系统直接访问和浏览 Samba 共享。打开文件管理器窗口并点击侧边栏上的 `Network` 以查看网络上的所有主机。点击 Linux 主机即可查看该系统上的共享文件夹。\n\
  \n### smbclient\n\n你可以使用 `smbclient` 访问 Samba 服务器或 Windows 系统上的 SMB 共享服务和文件夹。它的工作方式非常类似于\
  \ FTP，但使用了不同的协议——SMB 协议。`smbclient` 具有许多与 FTP 相同的命令，例如用于传输文件的 `mget` 或用于删除文件的 `del`。`smbclient`\
  \ 还提供了查询和连接远程系统的选项。有关选项和命令的列表，请查看 `smbclient` 手页页。`smbclient` 的参数是服务器名称和你想要访问的服务。服务器名称前有双斜杠，服务前有单斜杠。服务可以是任何共享资源，例如文件夹或打印机。服务器名称是其\
  \ NetBIOS 名称，该名称可能与也可能与其 IP 名称相同。例如，要指定名为 `turtle.mytrek.com` 的服务器上的 `myreports`\
  \ 共享目录，请使用 `//turtle.mytrek.com/myreports`。如果你必须指定路径，请记住，尽管 Windows 使用反斜杠表示路径，但\
  \ Unix/Linux 系统使用正斜杠。\n\n`//server-name/service`\n\n如果服务受密码保护，你将需要提供密码。在服务名后的参数中输入密码。如果没有提供密码且服务需要密码，系统将提示你输入。\n\
  \n`smbclient` 命令为访问共享提供了几个选项。`-I` 选项通过 IP 地址引用系统。要指定登录名，请使用 `-U`。如果需要密码，请在密码后附加\
  \ `%`。`-L` 选项显示服务器上提供的服务列表，例如共享文件夹或打印机。以下命令将列出主机 `turtle.mytrek.com` 上可用的共享项：\n\n\
  ```\nsmbclient -L turtle.mytrek.com\n```\n\n为了访问远程系统上的特定文件夹，你输入文件夹名称以及任何你需要的选项。确保对\
  \ Windows 路径名使用反斜杠。连接到服务器后，将显示 SMB 提示符。然后你可以输入 `smbclient` 命令（如 `get` 和 `put`）来传输文件。使用\
  \ `quit` 和 `exit` 命令退出并结束连接`recurse` 命令允许你开启递归，以便一次复制整个子文件夹。使用 UNIX 文件匹配操作符，你可以引用多个文件。文件匹配操作符为\
  \ `*`、`[]` 和 `?`。默认掩码为 `*`，匹配所有内容。以下示例使用 `mget` 复制所有以 `.c` 结尾的文件，例如 `myprog.c`：\n\
  \n```\nsmb> mget *.c\n```\n\n在接下来的示例中，`smbclient` 使用登录名 `dylan` 和 `-I` 选项（服务器的 IP\
  \ 地址）访问 `turtle.mytrek.com` 系统上的 `myreports` 文件夹。\n\n```\nsmbclient //turtle.mytrek.com/myreports\
  \ -I 192.168.0.1 -U dylan\n```\n\n通常情况下，你只需要此处所示使用服务器名称来引用服务器。不需要指定 IP 地址。\n\n```\n\
  smbclient //turtle.mytrek.com/myreports -U dylan\n```\n\n如果你想访问 Samba 服务器上的用户家目录，将使用\
  \ `homes` 服务。在下一个示例中，用户访问 Samba 服务器上 `aleina` 账户的主目录。由于未提供密码，系统将提示用户输入。\n\n```\n\
  smbclient //turtle.mytrek.com/homes -U aleina\n```\n\n`smbclient` 还允许你访问 Windows\
  \ 共享资源。输入 Windows 客户端的计算机名称以及你想访问的客户端上的共享文件夹。在下一个示例中，用户访问了名为 `mycomp` 的 Windows\
  \ 客户端上的 `windata` 文件夹。如果文件夹允许任何人访问，只需在密码提示符处按回车。\n\n```\nsmbclient //mycomp/windata\n\
  ```\n\n### mount.cifs: mount -t cifs\n\n你可以使用 `mount` 命令和 `-t cifs` 选项将共享文件夹挂载到本地系统。`cifs`\
  \ 选项将运行 `mount.cifs` 命令，该命令反过来调用 `smbclient` 命令来执行挂载。`mount.cifs` 命令需要 Samba 服务器名称、共享文件夹以及要挂载共享文件夹的本地文件夹。以下示例将\
  \ `mybooks` 文件夹挂载到 `/mnt`。\n\n```\nmount -t cifs //turtle.mytrek.com/mybooks /mnt\n\
