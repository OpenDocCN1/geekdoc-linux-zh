  \ To Trash` | 将文件或文件夹移动到垃圾箱稍后删除 |\n| `Delete` | 立即删除文件或文件夹 |\n| `Compress` | 将选的文件和文件夹压缩为压缩存档，如\
  \ tar、cpio 或 zip 文件（Engrampa 扩展） |\n| `Backgrounds and Emblems` | 为文件管理器窗口选择背景。为管理器窗口中的任何文件夹或文件添加图标\
  \ |\n| `Preferences` | 你的帐户的 Caja 文件管理器偏好设置 |\n\n表 7-5：编辑菜单\n\n\n\n\n\n# 在文件管理器中导航\n\
  \n文件管理器的工作方式类似于 Web 浏览器，使用同一个窗口显示已打开的目录。它维护了一个之前查看过的目录列表，你可以通过工具栏按钮在该列表中来移动。左箭头按钮返回上一个显示的目录，右箭头按钮移动到下一个显示的目录，向上箭头返回父目录。主目录图标打开主目录，计算机图标（显示器）打开计算机窗口，列出了你的文件系统和可拔设备设备。\n\
  \n要打开子目录，你可以双击其图标，或右键点击图标从菜单中选择`打开`。你也可以在新的标签页或新窗口中打开文件夹。`打开方式`子菜单列出了其他文件管理器和应用程序，如`文件`\
  \ (`Caja`）。你也可以点击文件夹来选择它，然后从文件菜单中选择`打开` (`文件`）。当选中文件夹时，标签页、新窗口和打开方式选项也会被列出来。图 7-29\
  \ 显示了文件夹的不同`打开`选项以及文件的`打开方式`子菜单。表 7-7 列出了文件菜单选项。\n\n![Image](img/image-365.png)\
  \   ![Image](img/image-366.png)\n\n图 7-29：文件夹和文件的打开方式子菜单\n\n| 菜单项 | 说明 |\n| :---\
  \ | :--- |\n| 创建文件夹 | 在目录中创建一个子目录。 |\n| 创建文档 | 创建一个文本文档。 |\n| 排列：按名称、大小、类型、修改日期\
  \ | 按指定标准排列文件和目录 |\n| 按名称组织 | 在图标视图中按名称排序图标 |\n| 在终端打开 | 在该文件夹打开终端窗口（打开扩展） |\n|\
  \ 放大 | 提供图标的放大视图，使其看起来更大。 |\n| 缩小 | 提供图标的缩小视图，使其看起来更小。 |\n| 正常大小 | 将图标恢复为标准大小。 |\n\
  | 属性 | 打开目录的属性对话 |\n\n表 7-6：文件管理器弹出菜单\n\n你可以通过点击文件夹或书签来打开侧边栏位置视图中列出的任何文件夹或文件系统。你也可以右键点击书签或文件夹以显示包含`打开`、`在新标签页中打开`和`在新窗口中打开`条目的菜单（见表\
  \ 7-7）。`在新窗口中打开`项是从文件管理器访问设备的简单方法。`垃圾箱`项菜单让你清空垃圾箱。对于任何书签，你还可以删除和重命名该项。USB 驱动器等可拔设备具有`弹出`和`安全删除`菜单项。内部硬盘则有`卸载`项。\n\
  \n| 菜单项 | 说明 |\n| :--- | :--- |\n| 打开 | 使用关联应用程序打开文件。在文件管理器中打开目录。列出关联应用程序。 |\n|\
  \ 在新标签页中打开 | 在同一窗口的新标签页中打开目录。 |\n| 在新窗口中打开 | 在单独窗口中打开目录，可通过工具栏或右键访问。 |\n| 删除 | 从侧边栏删除书签。\
  \ |\n| 重命名 | 重命名书签。 |\n\n表 7-7：文件管理器侧边栏弹出菜单\n\n## Caja 文件管理器搜索\n\n`Caja` 文件管理器提供了一个与\
  \ Nemo 文件管理器搜索功能相同的搜索工具。在文件管理器窗口中，点击工具栏上的搜索按钮（右侧的放大镜），或选择`前往 | 搜索文件`在工具栏下方打开搜索框。输入搜索模式并按`ENTER`\
  \ 或点击文本框右侧的放大镜按钮。显示结果。\n\n位置和文件类型的下拉菜单将出现在文件夹中，带有 `+` 和 `-` 按钮用于添加或删除位置和文件类型搜索参数。点击\
  \ `+` 按钮添加更多位置和文件类型搜索参数。搜索从打开的文件夹开始，但你可以指定另一个文件夹进行搜索（位置菜单）。要同时搜索多个文件夹，点击 `+` 按钮为每个文件夹添加位置菜单并指定该文件夹。你也可以对多个文件类型执行相同操作，仅指定特定类型的文件。\n\
  \n## 管理文件和文件夹\n\n作为一个符合 GNOME 标准的文件管理器，`Caja` 支持通过桌面拖放操作来复制和移动文件。要移动文件或目录，请从一个目录拖放到另一个目录。移动操作是\
  \ GNOME 中默认的拖放操作。要将文件复制到新位置，在拖放时按下 `Ctrl` 键。\n\n### 使用文件的弹出菜单\n\n你也可以通过右键点击图标并从出现的弹出菜单中选择所需的操作对文件执行删除、重命名和创建链接操作（见表\
  \ 7-8）。例如，要删除项目，右键点击它并从弹出菜单中选择`移动到垃圾箱`。这将将其放入`垃圾箱`目录，你稍后可以删除它。要创建链接，右键点击文件并从弹出菜单中选择`创建链接`。这将创建一个以“链接”开头的新链接文件。如果你选择压缩文件，弹出菜单还会显示`在此提取`和`提取到...`条目。\n\
  \n| 菜单项 | 说明 |\n| :--- | :--- |\n| 打开 | 使用关联应用程序打开文件。在文件管理器中打开目录。列出关联应用程序。 |\n|\
  \ 在新标签页中打开 | 在同一窗口的新标签页中打开目录。 |\n| 在新窗口中打开 | 在单独窗口中打开目录，可通过工具栏或右键访问。 |\n| 打开方式 |\
  \ 选择打开文件的应用程序，或打开目录的文件管理器。 |\n| 剪切复制 | 剪切和复制选中文件。 |\n| 粘贴到文件夹 | 粘贴选中文件夹 |\n| 创建链接\
  \ | 在该目录下创建文件的链接 |\n| 重命名 (F2) | 重命名文件。 |\n| 复制到 | 将文件复制到主目录、桌面或侧边栏中显示的文件夹。 |\n\
  | 移动到 | 将文件移动到主目录、桌面或侧边栏中显示的文件夹。 |\n| 移动到垃圾箱 | 将文件移动到垃圾箱目录，你稍后可以删除它。 |\n| 删除 | 永久删除文件或文件夹\
  \ |\n| 压缩 | 压缩文件（Engrampa 扩展）。 |\n| 在此提取提取到 | 选择压缩文件时显示这些条目（Engrampa 扩展）。 |\n| 属性\
  \ | 显示属性对话框。 |\n\n表 7-8：文件和目录弹出菜单\n\n### 重命名文件\n\n要重命名文件，你可以右键点击文件图标并从弹出菜单中选择重命名项，或者点击其图标并按下\
  \ `F2` 功能键。图标名称将被框起来，并封装在一个小文本框中。你可以覆盖旧名称，也可以通过点击名称中的某个位置插入文本来编辑当前名称，还可以使用退格键删除字符。你也可以通过在文件的属性对话框（基本选项卡）中输入新名称来重命名文件。\n\
  \n### 分组文件\n\n\n\n\n\n你可以通过点击第一个项目并在按住 shift 键的同时点击最后一个项目，或者通过点击并拖动鼠标经过想要选择的项目来选择一组文件和文件夹。要选择不连续的项目，请在点击各个图标时按住\
  \ `ctrl` 键。如果你想选择该目录中的所有项目，请选择“编辑”菜单中的“全选”选项（`Edit | Select All`）（`Ctrl-a`）。然后你可以一次复制、移动或甚至删除多个文件。要选择名称中包含特定模式的项目，从工具菜单中选择“选择匹配模式的项”以打开搜索框，你可以在其中输入模式（`Ctrl-s`）。使用通配字符\
  \ `*` 来匹配部分模式，例如使用 `*let*` 来匹配所有文件名中包含“let”模式的文件。模式 `my*` 将匹配以“my”模式开头的文件名，而 `.png`\
  \ 将匹配所有 PNG 图像文件（点表示文件扩展名）。\n\n### 启动应用程序和文件 MIME 类型\n\n你可以通过双击应用程序本身或用于该应用程序的数据文件，在文件管理器中启动任何应用程序。如果你想用特定的应用程序打开文件，可以右键点击文件并选择\
  \ `Open With`（打开方式）中的一个选项。将为默认和可能的应用程序显示一个或多个 `Open with` 选项，例如对于文本文件显示“用文本编辑器打开”。如果你需要的应用程序不在列表中，可以选择\
  \ `Open with | Other Application`（打开方式 | 其他应用程序）来打开列出可用应用程序的对话框。应用程序也支持拖放操作。你可以将数据文件拖到其关联的应用程序图标（例如在桌面上）；该应用程序将使用该数据文件启动。\n\
  \n文件夹也有 `Open With`（打开方式）子菜单，列出了你可以用于打开文件夹的备用文件管理器，例如 `Files` (Caja)。处理文件夹的应用程序也会列出，例如\
  \ Gwenview 图像管理器和磁盘使用分析器（Disk Usage Analyzer）。\n\n要更改或设置用于特定类型文件的默认应用程序，你需要打开文件的\
  \ `Properties`（属性）对话框并选择 `Open With`（打开方式）选项卡。在这里，你可以选择用于该类型文件的默认应用程序。可能的应用程序将列出，每个项目旁边都有单选按钮。默认项的单选按钮处于开启状态。点击你想更改为默认项的单选按钮。一旦你选择了默认项，它将出现在该类型文件的\
  \ `Open With` 项目中。如果 `Open With` 选项卡上有一个你不希望出现在 `Open With` 菜单中的应用程序，选择它并点击 `Remove`（删除）按钮。\n\
  \n如果你想向 `Open With` 菜单添加应用程序，请点击 `Add`（添加）按钮打开 `Add Application`（添加应用程序）对话框，其中列出了可能的应用程序。选择你需要的并点击\
  \ `Add` 按钮。你可以使用“Use a custom command”（使用自定义命令）文本框输入命令。`Browse`（浏览）按钮可以让你定位命令。\n\
  \n### 文件和目录属性\n\n在文件的 `Properties` 对话框，你可以查看文件的详细信息并设置选项和权限（参见图 7-30）。文件的 `Properties`\
  \ 对话框有五个选项卡：Basic（基本）、Emblems（徽标）、Permissions（权限）、Open With（打开方式）和 Notes（备注）。文件夹没有\
  \ `Open With` 选项卡。`Basic` 选项卡显示详细信息，如类型、大小、位置和修改日期。类型是 MIME 类型，表示与其关联的应用程序类型。文件的图标显示在顶部，带有一个显示文件名的文本框。你可以在\
  \ `Name` 文本框中编辑文件名更改该名称。\n\n如果你想更改用于文件或文件夹的图标图像，点击图标图像（名称旁边）以打开 `Select Custom Icon`（选择自定义图标）对话框，以浏览你需要的图标。`/usr/share/pixmaps`\
  \ 目录存放当前的默认图像集，尽管你可以选择自己的图像（点击侧边栏“位置”中的 `pixmaps` 项）。点击图像文件可以查看在右侧面板中显示的图标。双击更改图标图像。\n\
  \n![Image](img/image-367.png)\n\n**图 7-30：Caja 中的文件属性**\n\n文件的 `Permissions` 选项卡显示了为该文件设置的所有者、组和其他人员的读取、写入和执行权限。只要文件属于你，你就可以在此处更改任何权限。你可以使用下拉菜单为所有者、组和其他人员配置访问权限。你可以将所有者权限设置为\
  \ `Read Only`（只读）或 `Read And Write`（可读可写）。对于组和其他人员，你还可以设置 `None`（无）选项以拒绝访问。点击组名将显示列出不同组的菜单，允许你选择一个来更改文件的组。如果你想将其作为程序执行，请勾选“Allow\
  \ executing file as program”（允许将文件作为程序执行）。这将产生设置执行权限的效果。\n\n文件的 `Open With` 选项卡列出了与此类文件关联的所有应用程序。你可以选择你想用作默认的项。这对于媒体文件特别有用，你可能为某个文件偏好特定的播放器，或为某些图片偏好特定的图像查看器。\n\
  \n某些类型的文件会有额外的选项卡，提供有关文件的信息。例如，音频文件将有一个 `Audio` 标签，列出音频文件类型以及任何其他信息，如歌曲标题或使用的压缩方法。图像文件将有一个\
  \ `Image` 标签，列出分辨率和图像类型。\n\n文件夹的 `Permissions` 选项卡工作方式类似，但包含了两个访问项：Folder Access（文件夹访问）和\
  \ File Access（文件访问）。`Folder Access` 项通过 `None`（无）、`List Files Only`（仅列出文件）、**Access\
  \ Files`（访问文件）和 `Create And Delete Files`（创建和删除文件）来控制文件夹的访问。这些对应于授予目录的读取和执行权限。`File\
  \ Access` 项让你设置该目录中所有文件的权限。它们与文件相同：对于所有者设置为 `Read`（只读）或 `Read And Write`（可读可写）；对于组和其他人员，提供了\
  \ `None` 选项。要相应地设置权限，点击“Apply Permissions Toclosed Files”（将权限应用于子文件）按钮。\n\n文件夹的\
  \ `Share` 选项卡允许将文件夹作为共享。如果你有 Samba 或 NFS，这些将允许你的文件夹和文件与其他系统共享。你有选项指定共享文件夹或文件是只读还是允许写入访问。要允许写入访问，勾选“Allow\
  \ other to create and delete files in this folder”（允许其他在此文件夹中创建和删除文件）。要向所有用户开放访问，勾选\
  \ Guest access（访客访问）项。\n\n### Caja 首好\n\n你可以在 `Preferences` 对话框中为文件管理器设置偏好，通过选择任何\
  \ Caja 窗口编辑菜单中的 `Preferences`（`Edit | Preferences`）进入。\n\n`Views` 选项卡允许选择默认的文件显示方式，例如列表、图标或紧凑视图。你可以为图标、紧凑和列表视图设置默认缩放级别。\n\
  \n`Behavior` 让你选择如何选择文件、管理垃圾以及处理脚本。\n\n`Display` 让你选择在图标说明中显示哪些附加信息，如大小或日期。\n\n\
  `List Columns` 选项卡允许你选择在列表视图显示的功能以及它们的顺序。除了已选择的 `Name`、`Size`、`Date` 和 `Type` 之外，你还可以添加权限、组、MIME\
  \ 类型和所有者等功能。\n\n`Preview` 选项卡让你选择是否希望在图标显示显示预览内容，例如文本文件的开头。\n\n`Media` 选项卡让你选择为某些媒体运行哪些应用程序，例如运行\
  \ VLC 播放器播放 DVD 视频，或运行 Rhythmbox 音频文件。\n\n`Extensions` 列出了为 Caja 安装的扩展。\n\n\n\n\n\
  \n“偏好”（Preference）和“管理”（Administration）工具都可以从 Linux Mint 菜单或控制中心访问（参见图 7-31）。你可以从\
  \ Linux Mint 菜单的“系统”部分访问控制中心。控制中心会打开一个窗口，按部分列出不同的应用程序：管理、硬件、互联网和网络、外观和感觉、个人和其他。窗口会显示这些工具的图标。单击图标即可打开。控制中心还具有动态搜索功能。侧边栏包含一个过滤搜索框和组组链接。当你在过滤搜索框中输入模式时，右侧会显示匹配的应用程序。常用应用程序可以列在“常用任务”下。如果你希望某个应用程序在系统启动时启动，可以右键点击其图标并选择“添加到启动程序”，以便将其直接添加到“启动应用程序”对话框中。其中几个工具是管理类应用程序，如`软件管理器`、`备份工具`、`用户和组`以及`打印机`。其他一些是用于\
  \ Mate 的 GNOME 偏设置，例如`外观`、`关于我`、`屏幕保护程序`和`键盘`。另一些与 Cinnamon 工具相同，如`登录窗口`和`语言`。\n\
  \n![Image](img/image-368.png)\n\n![Image](img/image-369.png)\n\n图 7-31: GNOME 控制中心\n\
  \n## Mate 偏好\n\n你可以使用 Linux Mint 菜单中偏好菜单列出的工具以及控制中心来配置 Mate 界面的不同部分。Linux Mint 提供了若干工具来配置你的\
  \ Mate 桌面。Mate 偏好列在表 7-9 中。在某些偏好工具上，帮助按钮会显示详细的描述和示例。这里讨论了一些较重要的工具。\n\n键盘快捷键配置（`键盘快捷键`）允许你将键映射到某些任务，例如将键盘上的多媒体键映射到播放和暂停等媒体任务。只需选择任务然后按下按键即可。有桌面、多媒体和窗口管理的任务。在窗口管理中，你还可以映射按键来执行工作区切换。已分配的键将会被显示。\n\
  \n窗口配置（`窗口`）是你可以在此启用功能的地方，如窗口折叠（`标题栏操作`）、窗口移动键和鼠标窗口选择。\n\n| 偏好 | 描述 |\n| :--- |\
  \ :--- |\n| 关于我 | 个人信息，如图像、地址和密码。 |\n| 辅助技术 | 启用如无障碍登录和键盘屏幕等功能。 |\n| 外观 | 桌面外观配置：主题、字体、背景和视觉效果。\
  \ |\n| CompizConfig 设置管理器 | GNOME 增强图形功能的高级配置对话框，例如 3D 窗口、动画和桌面立方工作区切换。 |\n| 桌面设置\
  \ | 基础设置，如在桌面显示主目录和计算机图标、按钮布局以及在菜单中显示图标。 |\n| 桌面共享 | 配置他人访问你的桌面。 |\n| 磁盘 | 打开 GNOME\
  \ 磁盘实用。 |\n| 显示 | 打开 GNOME 显示器偏好对话框，用于检测显示器并设置分辨率。 |\n| 域名拦截 | 拦截指定的域名。 |\n| 文件管理\
  \ | 文件管理器选项，包括媒体处理应用程序、图标说明和默认视图（也可以从文件管理器窗口的`编辑 | 偏好`访问）。 |\n| 键盘 | 配置你的键盘：选择选项、型号和打字间歇，以及作为健康预防的辅助功能，如慢速、回弹键和粘滞键。\
  \ |\n| 键盘快捷键 | 为特殊任务（如多媒体操作）配置键。 |\n| 语言 | 指定语言，与 Cinnamon 相同。 |\n| 登录窗口 | 为 LightDM\
  \ 显示管理器配置登录窗口，与 Cinnamon 相同。 |\n| 主菜单 | 为应用程序、偏好和系统菜单添加或删除类别和菜单项。 |\n| 显示 | 更改你的屏幕分辨率、刷新率和屏幕方向。\
  \ |\n| 鼠标 | 鼠标和触控板配置：选择手方向、速度和辅助功能。 |\n| 网络代理 | 如果需要，指定代理配置：手动或自动。 |\n| 显示器 | 更改你的屏幕分辨率、刷新率和屏幕方向。\
  \ |\n| 弹出窗口通知 | 通知的位置和显示主题。 |\n| 电源管理 | GNOME 电源管理器，用于配置显示、挂起和关机选项。 |\n| 首选应用程序\
  \ | 设置默认 Web 浏览器、邮件应用程序、音乐播放器和终端窗口。 |\n| 远程桌面 | 允许远程用户查看或控制你的桌面。可以使用密码控制访问。 |\n\
  | 屏幕保护程序 | 选择并管理你的屏幕保护程序，包括激活时间。 |\n| 启动应用程序 | 使用启动程序和保存选项管理你的会话。 |\n| 声音 | 配置音效、输出音量、音频设备选项、输入音量声音应用程序设置（`Pulseaudio`）。\
  \ |\n| 时间和日期 | 设置时间、日期和时区。 |\n| 欢迎屏幕 | 显示 Linux Mint 欢迎界面，带有指向用户指南、教程和软件管理器的链接。\
  \ |\n| 窗口 | 启用窗口功能，如标题栏折叠、移动键、窗口选择。 |\n\n表 7-9: Mate 偏好\n\n### 鼠标和键盘偏好\n\n鼠标和键盘偏好是配置鼠标和键盘的主要工具。鼠标偏好允许你选择速度、手方向和双击次数。对于笔记本电脑，你可以配置启用边缘滚轮的触控板。键盘偏好显示了多个标签页，用于选择你的键盘（`布局`）、配置按键（`布局`标签页）、重复延迟（`常规`标签页）以及作为健康预防措施强制执行打字间歇（`打字间歇`）（参见图\
  \ 7-32）。\n\n![Image](img/image-368.png)\n\n图 7-32: 键盘偏好\n\n要配置音频设备，请使用声音工具（`声音`），参见第\
  \ 9 章。Mate 使用声音主题来指定不同效果和警报的全套声音。\n\n### 关于我：照片、名称和密码\n\n要设置个人信息（包括用于图形登录的图标），你需要使用“关于我”偏好。你可以从\
  \ Linux Mint 菜单的偏好（`偏好 | 关于我`）以及 GNOME 控制中心访问它。“关于我”偏好对话框允许你更改密码（参见图 7-33）以及用于代表用户的图标或图像。如果你想更改密码，可以点击`更改密码`按钮打开更改密码对话框。\n\
  \n点击图像图标会打开一个浏览器窗口，你可以在其中选择个人图像。默认选择`faces`目录，它显示了多张图像。选中的图像显示在浏览器窗口的右侧。对于个人照片，你可以选择`Picture`文件夹。这是你主目录下的`Pictures`文件夹。如果你在那里放置了照片或图像，随后就可以选择它作为你的个人图像。该图像将用于登录屏幕显示用户条目时。\n\
  \n![Image](img/image-370.png)\n\n图 7-33: 关于我：偏好 | 关于我\n\n### 外观\n\n多个与外观相关的配置任务合并在外观偏好对话框中（`偏好\
  \ | 外观`，或控制中心“个人”部分的外观图标）。你可以更改你的主题、背景图像或配置你的字体。外观对话框显示了四个标签页：主题、背景、字体和界面（参见图 7-11）。在界面标签页上，你可以选择在菜单中显示图标并在工具栏按钮上显示标签。\n\
  \n### 桌面主题\n\n\n\n\n\n你使用“外观偏好”对话框中的“主题”选项卡来选择或自定义主题。主题控制你的桌面外观。“主题”选项卡将列出已安装主题的图标（参见图\
  \ 7-34）。这些图标显示了每个主题的关键方面，例如窗口、文件夹和按钮图像，实际上是为你预览了主题。\n\n默认选中的是 Linux Mint 自定义主题。如果你愿意，可以移动图标来选择不同的主题。如果你从\
  \ `https://www.gnome-look.org/` 下载了额外的主题，可以点击“安装”按钮来定位并安装它们。一旦安装，额外的主题也将显示在“主题”选项卡中。如果你从\
  \ Linux Mint 仓库下载并安装了主题或图标集，它将自动为你安装。\n\n![Image](img/image-371.png)\n\n图 7-34：选择\
  \ GNOME 主题\n\n“主题”真正的强大之处在于它允许用户自定义任何现有主题。主题由五个部分组成：控件、颜色、窗口边框、图标和指针。“控件”涵盖了窗口和对话框控件（如按钮和滑块）的外观。“窗口边框”允许你选择标题栏、边框、窗口按钮集。“图标”允许你选择不同的图标集。“指针”提供了不同的指针集可以使用。“颜色”允许你为窗口、输入框、选择项和工具提示选择背景和文本颜色。你甚至可以下载并安装单独的组件（特定的图标集），然后在自定义主题中使用它们。\n\
  \n点击“自定义”按钮会打开“自定义主题”对话框，其中包含不同主题组件的选项卡。默认选中当前主题正在使用的组件。“颜色”选项卡允许你设置窗口、输入框和所选项目的背景颜色和文本颜色。在“控件”、“窗口边框”和“图标”选项卡中，你会看到不同主题的列表。然后你可以混合使用这些主题中的不同组件，创建自己的自定义主题，例如使用一个主题的窗口边框和另一个主题的图标。一旦选中某个组件，你的桌面会自动变化，显示其效果。如果你添加了组件（如新的图标集），它也会显示出来。\n\
  \n一旦你创建了新的自定义主题，“主题”选项卡列表中就会出现一个“自定义主题”图标。要保存自定义主题，请点击“另存为”按钮。这会打开一个对话框，你可以在其中输入主题名称、任何注释，并指定是否也想保留主题背景。\n\
  \n自定义主题和用户直接安装的主题位于用户主目录下的 `.themes` 目录。如果你希望这些主题对所有用户可用，可以将它们从 `.themes` 目录移动到\
  \ `/usr/share/themes` 目录。在终端窗口中运行此处所示的 `cp` 命令来处理 `mytheme` 主题。该操作需要管理员权限（`sudo`）。\n\
  \n```bash\nsudo cp -r .themes/mytheme /usr/share/themes\n```\n\n你可以对下载的图标集执行相同的操作。此类集合将安装在用户的\
  \ `.icons` 目录中。然后你可以将其复制到 `/usr/share/icons` 目录以供所有用户使用。\n\n### 桌面背景\n\n你使用“外观偏好”工具上的“背景”选项卡来选择或自定义你的桌面背景图像（参见图\
  \ 7-35）。你也可以通过点击桌面背景并从桌面菜单中选择“更改桌面背景”来访问“背景”选项卡。已安装的背景列在此处，并选中了当前背景。要添加你自己的图像，可以将图像文件拖放到“背景”选项卡，或者点击“添加”按钮来定位并选择图像文件。要删除图像，请选择它并点击“移除”按钮。\n\
  \n从“样式”下拉菜单中，你可以选择显示选项，如缩放、居中、等比例缩放、平铺或全屏。居中或缩放图像将保持图像比例。全屏可能会导致其失真。任何未填充的空间（例如使用居中或缩放图像时）将用桌面颜色填充。从“颜色”下拉菜单中，你可以将桌面颜色设置为纯色、水平渐变或垂直渐变。点击“颜色”下拉菜单旁边的颜色按钮打开“选择颜色”对话框，你可以在颜色调色盘中选择颜色。对于渐变，会显示两个颜色按钮用于选择渐变两端的颜色。\n\
  \n初始状态，仅列出 Linux Mint/Ubuntu 背景。安装 `gnome-background` 软件包可以添加一组 GNOME 背景。要下载更多背景，请点击“在线获取更多背景”链接。\n\
  \n![Image](img/image-372.png)\n\n图 7-35：选择桌面背景，系统 | 选项 | 外观\n\n### 字体\n\n在“字体”选项卡上，你可以更改字体大小、选择字体并配置渲染选项（参见图\
  \ 7-36）。列出了应用程序、文档、桌面、窗口标题和等宽的字体。点击字体按钮打开“选择字体”对话框，你可以在其中选择字体、选择其样式（常规、斜体或粗体）并更改其大小。你可以通过点击“详细信息”按钮进一步精炼字体显示，打开一个窗口你可以在其中设置每英寸点数、齿齿渲染和平滑等功能。\n\
  \n![Image](img/image-373.png)\n\n图 7-36：字体\n\n随着大显示器及其高分辨率变得越来越普遍，用户发现一个非常有用的功能是能够增大字体大小。在宽屏显示器上，低于原生分辨率的设置往往无法良好缩放。显示器始终在原生分辨率下效果最好。在高原生分辨率下，字体会变得非常小，难以阅读。你可以通过增大字体大小来解决这个问题。默认大小为\
  \ 10；将其增加到 12 可以让文本更易读。\n\n#### 配置字体\n\n要精炼字体显示，你可以使用字体渲染功能。打开“外观”工具上的“字体”选项卡。“字体渲染”部分包含基础字体渲染功能，如单色、最佳对比、最佳形状和子像素平滑。选择最适合的一个。对于\
  \ LCD 显示器选择子像素。要进行详细配置，请点击“详细信息”按钮。在这里你可以设置平滑、齿齿渲染（抗锯）和子像素颜色顺序功能。在 Mate 中，在字体偏好设置中点击字体按钮将打开列出可用字体的“选择字体”对话框。你也可以通过\
  \ `fc-list` 命令生成列表。列表是无序的，因此你应该先将其传递给 `sort` 命令。\n\n```bash\nfc-list | sort\n```\n\
  \n#### 添加字体\n\nLinux 仓库提供了许多字体软件包。安装字体软件包后，字体将自动安装到你的系统中并准备可以使用。真类型字体包以 `ttf-` 前缀。微软真类型字体可以通过\
  \ `ttf-mscorefonts-installer` 软件包获取。字体安装在 `/usr/share/fonts` 目录中。该目录将拥有不同字体集合的子目录，如\
  \ `truetype` 和 `X11`。你可以手动安装字体，将字体复制到 `/usr/share/fonts` 目录（使用 `sudo` 命令）。对于安装了\
  \ Windows 系统的双启动系统，你可以直接从 Windows 分区的 Windows 字体目录（挂载在 `/media` 中）复制字体到 `/usr/share/fonts`。\n\
  \n\n\n\n\n对于电源管理，Mate 使用 Mate 电源管理器 `mate-power-manager`，它利用计算机提供的高级配置和电源接口 (ACPI)\
  \ 支持来管理电源消耗。Mate 电源管理器可以在面板上显示图标，显示当前电源源：电池或插头（闪电标志）。点击电池图标会显示一个菜单，显示您的无线设备电量，包括您的笔记本电脑以及任何无线设备（如无线鼠标）。\n\
  \n电源管理器通过电源管理偏好（`mate-power-preferences`）配置，可以通过“偏好 | 电源管理”访问，也可以通过右键点击 Mate 电源管理面板图标并在弹出菜单中选择“偏好”（同样位于\
  \ GNOME 控制中心 | 硬件部分）来访问。电源管理器偏好设置可用于配置台式机和笔记本电脑。\n\n对于台式机，电源管理偏好窗口上会出现两个标签页：“交流电电源”和“通用”。交流电电源标签页提供两个睡眠选项，一个针对计算机，另一个针对显示器。你可以设置在指定的闲置间隔后让它们进入睡眠状态。在“通用”标签页上，你可以设置桌面功能，例如按下电源按钮时执行的操作，或者是否显示电源图标。\n\
  \n![Image](img/image-374.png)\n\n图 7-37：Mate 电源管理器\n\n面板上电源管理图标显示在“通用”标签页上配置。在通知区域部分，你可以设置选项：从不显示、始终显示图标、电池电量低时显示图标、充电或放电时显示图标，或仅在存在电池时显示。默认仅在存在电池时显示图标。\n\
  \n注意：Mate 电源管理器不仅检查笔记本电脑电池的电量，还会检查其他无线设备的电量，例如无线鼠标或键盘的电池。\n\n笔记本电脑还有一个“电池电源”标签页，你可以在其中为电池和显示器设置额外选项，例如电池电量过低时关机，或系统空闲时调暗显示器（见图\
  \ 7-37）。笔记本的“交流电电源”标签页还有一个“操作”选项，用于关闭笔记本盖时执行的操作，如挂起、休眠和关机。\n\n要查看您的笔记本电脑或台式机的电源运行情况，可以使用电源统计。可以通过系统工具菜单中的“电源统计”访问。电源统计窗口将显示一个列出不同不同电源设备的侧边栏。右侧窗将显示带有所选设备电源使用信息的标签页。笔记本电池设备将显示三个标签页：详细、历史和统计。历史标签页将显示您最近的使用情况，并带有图表选项，显示耗尽时间（剩余时间）、充满时间（充电中）、电量和速率。统计标签页可以显示充电和放电图表。\n\
  \n## 网页、邮件、辅助功能和终端窗口的首选应用程序\n\n某些类型的文件已经关联了默认应用程序。例如，双击网页文件将在 Firefox Web 浏览器中打开该文件。如果你倾向于设置不同的默认应用程序，可以使用“首选应用程序”工具（见图\
  \ 7-38）。你可以从“偏好”菜单（偏好 | 首选应用程序）以及 GNOME 控制中心（个人部分）访问首选应用程序工具。该工具将允许你为网页、邮件读取器、辅助功能工具、多媒体和办公应用程序以及系统级工具设置默认应用程序。可用应用程序列在弹出菜单中。在图\
  \ 7-38 中，默认邮件读取器是 Thunderbird，默认 Web 浏览器是 Firefox。要将另一个应用程序设为默认，点击菜单按钮显示其他可能安装的应用程序列表。首选应用程序具有\
  \ 、多媒体、系统、办公和辅助功能标签页。在“多媒体”标签页上，你可以选择默认图像查看器、视频播放器和多媒体播放器。在“办公”标签页上，你可以指定默认文档查看器、文字处理器和表格应用程序。在“系统”标签页上，你可以选择默认文本编辑器、终端窗口应用程序和文件管理器。辅助功能面板具有选择放大器的选项。\n\
  \n![Image](img/image-375.png)\n\n图 7-38：首选应用程序工具\n\n## 媒体的默认应用程序\n\nCaja 直接处理媒体操作的偏好。你可以使用“文件管理偏好”对话框设置偏好。可以通过任何\
  \ Caja 文件管理器窗口的“编辑 | 偏好”菜单项访问，可以通过 Linux Mint 菜单的“偏好”菜单中的“文件管理”访问，或者从控制中心中的“文件管理”（在个人部分）访问。\n\
  \n文件管理偏好对话框的“媒体”标签页列出了音频 CD、DVD 视频、音乐播放器、照片和软件的条目。弹出菜单允许你选择用于不同媒体的应用程序（见图 7-39）。你还有“询问做什么”、“什么都不做”和“打开文件夹”等选项。“打开文件夹”选项将打开一个显示光盘上文件的窗口。标记为“其他媒体”的区域允许你为不常使用的媒体（如蓝光光盘）设置关联。初始情况下，所有条目的选项都将设置为“询问做什么”。每个下拉菜单都列出了可能的选项，例如用于音频\
  \ CD 光盘的 Rhythmbox 音乐播放器和用于 DVD 视频的视频播放器 (Totem)。照片可以使用 Pix 图像管理器打开。一旦你选择了某个选项，当你插入可移动式介质（如音频\
  \ CD 光盘）时，其关联的应用程序会自动启动。\n\n![Image](img/image-376.png)\n\n图 7-39：媒体的文件管理偏好\n\n\
  如果你只想关闭特定类型媒体的启动，可以从其应用程序弹出菜单中选择“什么都不做”条目。如果你希望提示选项，则在媒体标签页的弹出菜单中设置“询问做什么”条目。当你插入光盘时，会显示一个带有可能操作弹出菜单的对话框。已选择默认应用程序。你可以选择另一个应用程序，或者选择“什么都不做”或“打开文件夹”选项。\n\
  \n你可以通过勾选媒体面板底部的“从启动程序”来关闭所有媒体的自动启动。你还可以启用“插入时浏览媒体”选项，仅打开显示文件的文件夹。\n\n## 屏幕保护与锁定\n\
  \n在“屏幕保护”偏好中，你可以控制计算机何时被视为空闲以及使用何种屏幕保护（见图 7-40）。你可以从 Linux Mint 菜单的“偏好”菜单中的“屏幕保护”，或者从控制中心的个人部分访问屏幕保护偏好对话框。你可以使用左侧的滚动框选择各种屏幕保护，右侧将显示预览。你还可以控制是否锁定屏幕、空闲多久以及持续多久。通过取消勾选“计算机空闲时激活屏幕保护”可以关闭屏幕保护。\n\
  \n![Image](img/image-377.png)\n\n图 7-40：屏幕保护偏好\n\n### 辅助功能\n\n在 Mate 上，辅助功能对话框是一组用于访问其他工具辅助标签页的简单按钮（见图\
  \ 7-41）。在辅助功能部分，使用“启用辅助功能”复选框开启或关闭辅助功能。“首选应用程序”按钮将打开首选应用程序对话框中的辅助功能标签页。\n\n\n\n\n\
  \n在“偏好”（Preferences）部分，有按钮可以打开键盘和鼠标偏好对话框的可访问性标签卡。在键盘可访问性标签卡上，你可以配置如粘滞（sticky）、慢速（slow）和限定键（bound\
  \ keys）等功能。鼠标按钮则直接打开鼠标偏好对话框。\n\n![Image](img/image-378.png)\n\n图 7-41：辅助技术偏好\n\n\
  # 第 3 部分：管理\n\n# 8. 系统工具\n# 9. 系统管理\n## 10. 网络连接\n## 11. Shell 配置\n\n# 8. 系统工具\n\
  \n在“附件”（Accessories）、“偏好”（Preferences）和“管理”（Administration）菜单中，可以找到实用的系统工具以及用户特定的配置工具（参见表\
  \ 8-1）。“管理”菜单包含系统监视器（System Monitor）和磁盘使用分析器（Disk Usage Analyzer）等工具。“附件”菜单包含磁盘工具（Disk\
  \ Utility）和 ClamTK 病毒扫描器。桌面配置（如鼠标、键盘、显示器和声音配置）直接由 Cinnamon 和 Mate 直接处理（系统设置），并可以通过“偏好”菜单访问。\n\
  \n| Linux Mint 系统工具 | 名称 | 描述 |\n| :--- | :--- | :--- |\n| gnome-system-monitor\
  \ | 系统监视器 | GNOME 系统监视器 |\n| gnome-logs | 日志 | GNOME 日志 |\n| gnome-terminal | 终端\
  \ | GNOME 终端窗口 |\n| baobab | 磁盘使用分析器 | 带图形表示磁盘使用分析器 |\n| gnome-nettool | 网络工具 |\
  \ 网络分析 |\n| ClamTK | 病毒扫描器 | Clam 病毒扫描器 |\n| Disk Utility | 磁盘工具 | 用于管理硬盘和可移动驱动器的\
  \ Udisks 工具 |\n| PulseAudio | 声音 | 声音驱动程序和服务器 |\n\n表 8-1：Linux Mint 系统工具\n\n## GNOME\
  \ 系统监视器\n\nLinux Mint 提供了 GNOME 系统监视器用于显示系统信息和监控系统进程，可以通过“系统工具 | 系统监视器”访问。它有三个标签卡：进程（Processes）、资源（Resources）和文件系统（File\
  \ Systems）（参见图 8-1）。“资源”标签卡显示 CPU 历史、内存和交换历史以及网络历史图表。如果你的系统具有多核 CPU，CPU 历史图将显示每个\
  \ CPU 的使用情况。内存和交换内存图显示使用的内存量。网络历史图显示发送和接收的数据量，以及当前会话的总量。“文件系统”标签卡列出你的文件系统、其挂载位置、类型，以及使用的磁盘空间量和可用空间。双击文件系统条将在文件管理器窗口中打开该文件系统。\n\
  \n“进程”标签卡列出你的进程，允许你对进程进行排序和搜索。你可以使用字段按钮按名称（Process Name）、进程 ID（ID）、使用百分比（`%CPU`）和使用的内存（Memory）等排序。菜单（菜单栏右侧）允许你选择所有进程、仅你自己的进程（My\
  \ Processes）或活动进程。你可以通过选择进程并点击“结束进程”（End Process）按钮（右下角）来停止任何进程，或者通过右键点击它并选择“结束”（End）。你可以右键点击进程条目以显示一个你可以对所选进程执行的操作菜单，例如停止（Stop）、结束（End）、杀死（Kill）和继续进程（Continue），以及更改进程优先级（Change\
  \ Priority）。“打开文件”条目会打开一个对话框，列出进程正在使用的所有文件、套接字管道。“属性”条目显示显示进程详细信息的对话框，如名称、用户、状态、内存使用、CPU\
  \ 使用和优先级。从“内存映射”条目选择的“内存映射”将显示所选进程的虚拟内存、inodes 和标志信息。\n\n如 CPU 图表使用的颜色等显示功能，可以使用\
  \ dconf 编辑器 `org | gnome | gnome-system-monitor` 路径下的 `gnome-system-monitor` key\
  \ 进行设置。\n\n![Image](img/image-379.png)\n\n图 8-1：GNOME 系统监视器：资源\n\n## 管理进程\n\n如果你必须强制退出某个进程或应用程序，可以使用\
  \ GNOME 系统监视器的“进程”标签卡来查找、选择并停止该进程。你应该确定你想要停止的进程。结束关键进程可能会导致你的系统瘫痪。应用程序进程将以应用程序命名，你可以使用它们来强制应用程序退出。手动结束进程通常用于你无法正常停止的开放式操作。在图\
  \ 8-2 中，选择了 Firefox 应用程序。点击左下角的“结束进程”按钮将强制 Firefox Web 浏览器结束。\n\n进程的弹出菜单（右键点击）提供了管理所选进程的其他几个选项：停止、继续、结束、杀死和更改优先级。大多数选项都有相应的键盘键。“停止”和“继续”操作共同工作。你可以停止（Stop）一个进程，稍后通过“继续”（Continue）选项再次启动它。“结束”选项可以安全地停止进程，而“杀死”（Kill）选项则强制立即结束进程。优先选择“结束”选项，但如果不起作用，你可以使用\
  \ `Kill` 选项。“更改优先级”可以赋予进程较低或更高的优先级。“属性”选项会显示进程详细信息的对话框，如名称、用户、状态、内存使用、CPU 使用和优先级。“打开文件”条目列出进程正在使用的所有文件、套接字和管道。\n\
  \n![Image](img/380.png)\n\n图 8-2：GNOME 系统监视器：进程\n\n\n\n\nGlances 是一项全面的系统监控工具，可以在终端窗口中使用\
  \ `glances` 命令从命令行运行。它可以显示系统、网络、磁盘、文件系统、传感器和进程的详细资源使用情况（参见 图 8-3）。它还会提醒你任何关键警报。系统部分涵盖了内存、CPU、交换分区和负载的详细使用情况。网络部分显示了每个网络设备的活动。磁盘\
  \ I/O 部分列出了你的存储设备及其读/写使用情况。文件系统（File Sys）部分显示了所有的分区以及内存使用情况。传感器部分显示了传感器检测到的温度，例如\
  \ CPU、GPU 和环境温度。任务部分按 CPU 使用率列出你的活动进程，显示内存使用情况、pid、用户和命令。按 `q` 退出 Glances 会话。\n\n\
  Glances 由模块组织，你可以禁用某些模块以只显示一组有限的报告。例如，如果你对磁盘 I/O 报告感兴趣，可以使用 `--disable-diskio` 选项禁用\
  \ `diskio` 模块。请查看 `glances` 手页以获取可以使用模块选项的完整列表。\n\n```\nglances -- disable-diskio\n\
  ```\n\n还有几个运行时命令可以用于显示和隐藏模块，例如使用 `f` 切换文件系统报告的开启或关闭，`d` 切换磁盘 I/O，`n` 显示网络统计，`s`\
  \ 显示传感器，`p` 按名称对进程。\n\n![Image](img/image-381.png)\n\n图 8-3: Glances 系统监控器\n\n##\
  \ 任务调度\n\n调度定期的维护任务（如备份）可以使用 systemd 定器（systemd timers）或 cron 服务进行管理。systemd 定器是运行服务文件的\
  \ systemd 文件。查看 `systemd.timers` 手页以获取有关计时器的详细描述。它们的扩展名为 `.timer`。定时器文件会自动运行一个与其同名的服务文件。例如，`dnf-automatic.timer`\
  \ 将运行 `dnf-automatic.service` 文件。定时器文件只包含调度信息。它的文件名决定了要运行哪个服务文件。你可以在定时器文件中使用 `Unit`\
  \ 指令指定不同的服务文件。如果你想运行一个没有服务文件的命令行操作，可以为该命令创建一个带有 `ExecStart` 条目的自定义服务。\n\n定时器文件有一个\
  \ `timer` 节，在其中你定义服务文件的运行时间。这些选项相对于某些起始点（例如系统启动时），以及一个引用日历日期的 `OnCalendar` 选项。`OnCalendar`\
  \ 选项使用 `systemd.time` 手页中定义的日历事件表达式。一个日历事件表达式由星期、年、月和时间组成。时间以小时、分、秒指定并用冒号分隔。周期的范围用两个点分隔，特定的星期用逗号分隔。省略年份或月份则选择任何年份或月份。以下引用引用了\
  \ 5 月下午 2 点的周几。\n\n```\nOnCalendar=Mon..Fri 05 14:00\n```\n\n你可以创建定时器文件并将它们放在 `/etc/systemd/system`\
  \ 目录。如果你还需要为它设置一个服务文件，可以将其放在同一个目录。要激活定时器，请确保使用 `systemctl` 启用它。如果你创建了服务文件，请确保也启用它。\n\
  \n你仍然可以使用旧的 cron 服务来调度任务。cron 服务由 cron 守护进程实现，该进程不断检查需要执行的某些操作。这些任务列在 crontab 文件中。cron\
  \ 守护进程不断检查用户的 crontab 文件，以查看何时该执行这些操作。任何用户都可以设置 crontab 文件。root 用户可以设置 crontab 文件来执行系统管理操作，例如在每周或每月特定时间备份文件。\n\
  \n创建 cron 条目可能是一个复杂的任务，可以使用 `crontab` 命令修改 `/etc/crontab` 目录中的 crontab 文件。相反，你可以使用桌面\
  \ cron 调度工具来设置 cron 操作。\n\n## 日志\n\n在系统上执行的任务的各种系统日志存储在 `/var/log` 目录。在这里你可以找到邮件、新闻以及所有其他系统操作日志，例如\
  \ Web 服务器日志（参见 图 8-4）。这通常包括启动任务，如加载驱动程序和挂载文件系统。如果设备驱动程序在启动时加载失败，你将在这里找到它的错误消息。登录信息也会记录在此文件中，显示谁尝试登录到哪个账户。`/var/log/mail.log`\
  \ 文件记录邮件消息传输和新闻传输。\n\n![Image](img/image-382.png)\n\n图 8-4: 日志\n\n要查看日志，可以使用管理菜单中的“日志”（Logs）来访问\
  \ Gnome 日志。侧边栏列出了不同的日志类别。选择一个将在右侧显示日志消息。关键消息列在“重要”（Important）类别下。标题栏上的“日志”标签是一个可以点击的按钮，用于显示最近的启动会话列表。你可以选择其中一个来精炼显示的消息。默认情况下，选择最近的一个。右上角的搜索按钮会打开搜索框，你可以在其中搜索所选日志中的消息。搜索有选项（右侧的菜单），可以按字段和时间精炼搜索。右上角的工具按钮允许你执行缩放等任务。\n\
  \n## 磁盘空间分析器\n\n磁盘空间分析器可以让你查看所有挂载硬盘分区上的已用和可用空间（参见 图 8-5）。你可以从管理 | 磁盘空间分析器访问它。它还会检查所有的\
  \ LVM 和 RAID 阵列。使用情况以简单的图表显示，让你看到可用空间及其位置。在扫描对话框中，你可以选择扫描硬盘（磁盘驱动器图标）、主文件夹或连接设备，如软盘或\
  \ USB 驱动（参见 图 8-6）。点击右侧的菜单按钮可以选择扫描特定的文件夹，本地或远程。当你扫描目录或文件系统时，将对目录的使用情况进行分析并显示。每个文件系统都会显示其使用的图表，以及大小和顶级目录和文件的数量。然后将显示目录及其大小和内容（文件和目录）。\n\
  \n![Image](img/image-383.png)\n\n图 8-5: 磁盘空间分析器\n\n右面板显示磁盘使用的表示图表。图可以是环形图（Ring Chart）或树状图（Treemap）。环形图是默认设置。从右下角的按钮选择你想要的。对于环形图，显示目录从中心的顶级目录开始向外到子目录。将鼠标悬停在图表的某部分将显示其目录名称和磁盘使用情况，以及所有的子目录。\n\
  \n![Image](img/image-384.png)\n\n图 8-6: 磁盘空间分析器：扫描对话框\n\n\n\n\n\n对于病毒防护，你可以使用 Linux\
  \ 版本的 ClamAV，它使用一个名为 ClamTK 的 GNOME 前端，[`www.clamav.net`](https://www.clamav.net)。此病毒扫描器包含在\
  \ Linux Mint 主仓库中。你可以从“软件管理器”和“Synaptic 软件包管理器”安装 ClamTK。系统也会为你选择并安装支持的 ClamAV 软件包（系统类别\
  \ `clamav-base` 和 `clamav-freshclam`）。如果你无法正常访问互联网，可以安装 `clamav-data` 包以获取基础病毒定义库。`clamav-freshclam`\
  \ 包负责从 ClamAV 服务器获取当前的病毒定义。为了让 ClamAV 自动检查你的邮件，你需要安装 ClamAV 扫描守护进程（`clamav-daemon`\
  \ 包）。\n\n![Image](img/image-385.png)\n\n图 8-7：用于 ClamAV 病毒防护的 ClamTK 工具。\n\n你可以从“附件”菜单中的\
  \ ClamTk 访问它。通过 ClamTk，你可以扫描特定的文件和目录，以及你的主目录（参见图 8-7）。搜索可以是递归的，包括子目录（设置）。你可以检查配置文件的选项（扫描以点为开头的文件）。你也可以对主目录进行快速扫描或递归扫描。受感染的文件将被隔离。\n\
  \n你的病毒定义将自动更新。如果你想手动检查病毒定义，需要点击“更新助手”并选择自行更新签名。然后点击“更新”并点击“检查更新”旁边的 OK 按钮。\n\n##\
  \ 硬件传感器\n\n许多用户关心的问题是计算机组件的温度和使用情况。你可以安装不同的软件包来启用某些传感器（参见表 8-2）。你可以添加“CPU 温度指示器”小部件来显示\
  \ CPU 温度。如果你的系统支持 CPU 频率调整，你可以添加 CPU 频率选择器。对于 CPU、系统、风扇速度以及任何其他主板支持的传感器，你可以使用 `Psensor`、`Xsensors`\
  \ 或 `lm-sensors` 服务。Psensor 安装 `hddtemp` 硬盘温度服务器并显示你的 CPU、显卡和硬盘温度。你可以为警报设置温度值。Xsensors\
  \ 显示你的 CPU 温度。\n\n| 传感器应用 | 描述 |\n| :--- | :--- |\n| lm-sensors | 检测并访问计算机（主板）传感器，如\
  \ CPU 和风扇速度。运行 `sensors-detect` 一次进行配置。 |\n| hddtemp | 检测硬盘温度（也可由“磁盘工具”检测） |\n|\
  \ Disk Utility | 磁盘工具为硬盘提供 SMART 信息，显示当前硬盘温度以及详细的磁盘健康信息和检查。 |\n| Psensor | 用于检测和显示系统和硬盘温度的应用。\
  \ |\n| Xsensors | 用于检测和显示系统温度和风扇的应用。 |\n| indicator-cpufreq | CPU 频率调整指示器，用于监控和更改\
  \ CPU 频率。 |\n| CPU Frequency Selector | CPU 频率调整，需要 gnome-applets。 |\n| CPU Temperature\
  \ Indicator | 显示 CPU 温度 |\n\n表 8-2：传感器软件包和应用程序\n\n如果尚未安装，请安装 `lm-sensors` 软件包。然后你必须配置你的传感器检测。在终端窗口输入以下内容并按回车键对提示回答\
  \ yes：\n\n```\nsudo sensors-detect\n```\n\n磁盘工具（首选项菜单）可以让你知道硬盘温度。磁盘工具使用 `Udisks`\
  \ 来访问关于驱动器的 SMART 信息，包括温度和整体健康状况。打开磁盘工具，选择要检查的硬盘，然后在右侧面板点击位于右中间的“SMART Data”链接。会打开硬盘对话框，显示磁盘温度以及其他详情。\n\
  \n## 磁盘工具与 Udisks\n\n磁盘工具是一个支持 Udisks 的存储媒体配置界面，例如硬盘、USB 驱动器和 DVD/CD 驱动器（`gnome-disk-utility`\
  \ 包，默认安装）。支持的任务包括磁盘标记、挂载磁盘、磁盘检查和加密。你还可以执行更高级的任务，例如管理 RAID 和 LVM 存储设备以及分区。可以通过“附件”和“首选项”菜单中的“磁盘”访问磁盘工具。用户可以使用磁盘工具格式化\
  \ USB 驱动器等可移动介质。磁盘工具还集成在 Nemo 和 Caja 中，让你可以直接格式化可移动介质。\n\n磁盘工具窗口显示一个侧边栏，其中包含你的存储介质的条目（参见图\
  \ 8-8）。点击条目会在右侧面板显示该介质的信息。可移动设备（如 USB 驱动器）显示弹出按钮和一个带有“格式化磁盘”条目的的任务菜单。如果你正在格式化分区（如可移动介质上的分区），你可以指定使用的文件系统类型。\n\
  \n![Image](img/image-386.png)\n\n图 8-8：磁盘工具\n\n如果你选择一个硬盘设备，右侧面板的“驱动器”部分将显示有关硬盘的信息，例如型号名称、固件版本、序列号、大小、设备名称和\
  \ SMART 状态（参见图 8-9）。点击任务按钮可以在右上角显示任务菜单，包含你可以在硬盘上执行的任务：格式化、基准测试和 SMART 数据。\n\n![Image](img/image-387.png)\n\
  \n图 8-9：磁盘工具，硬盘\n\n硬盘面板上的“卷”部分显示设置在硬盘上的分区（参见图 8-10）。分区以图形图标栏显示，显示每个分区的大小和位置。点击图形图标栏上的分区条目将显示该分区的信息，如文件系统类型、设备名称、分区标签和分区大小。“内容”条目告知分区是否已挂载。如果在使用，它会显示一个“挂载在”条目，其链接为文件系统挂载的路径名称。你可以点击此路径名称打开文件夹并从中访问文件系统。卷图像下方的按钮栏提供了你可以执行的其他任务，例如卸载文件系统（正方形按钮）和删除分区（减号按钮）。从“更多任务”菜单中，你可以选择更改分区标签、类型和挂载选项。某些分区（如扩展分区和交换分区）显示的信息有限且任务很少。\n\
  \n![Image](img/image-388.png)\n\n图 8-10：磁盘工具，卷\n\n要获取硬盘更详细的硬件信息，你可以点击右上角任务菜单中的“SMART\
  \ 数据和测试”条目。这将打开一个 SMART 数据对话框，显示有关硬盘的硬件信息（参见图 8-11），包括温度、电源周期、坏道和磁盘的整体健康状况。属性部分列出了\
  \ SMART 详情，如读取错误率、启动时间、温度和写入错误率。将开关打开启用测试，关闭禁用测试。点击“刷新”按钮手动运行测试。点击“启动自检”按钮打开一个包含短测试、扩展测试和运输测试的菜单。\n\
  \n![Image](img/image-389.png)\n\n图 8-11：磁盘工具：硬盘硬件 SMART 数据\n\n## Plymouth\n\n\n\n\
  \n\nPlymouth 提供了一种精简、高效且快速的图形启动，不需要 X server 支持。它依赖于内核的内核模式设置（KMS）功能，该功能为基础图形提供直接支持。通过直接渲染管理器（Direct\
  \ Rendering Manager）驱动程序，Plymouth 可以利用不同的图形插件。目前为 AMD、Nvidia 和 Intel 显卡提供了 KMS 支持。系统默认安装\
  \ Plymouth Linux Mint 图标主题。你还可以安装 solar 和 glow 等其他主题。主题包以 `plymouth-theme` 为前缀。你可以在\
  \ Synaptic 软件包管理器中搜索它们。你也可以从软件管理器中安装（搜索 Plymouth）。\n\n选择使用 Plymouth 主题涉及使用 Debian\
  \ 替代方案系统（Debian alternatives system），该系统旨在在有多个备选版本供选择时指定一个要使用的应用程序。系统在 `/etc/alternatives`\
  \ 目录中为该应用程序设置了一个链接。对于 Plymouth 而言，该链接命名为 `default.plymouth`。你可以在终端窗口中输入带有 `--config`\
  \ 选项 `update-alternatives` 命令、`default.plymouth` 链接以及 `sudo` 命令来选择 Plymouth 主题，如下所示：\n\
  \n```\nsudo update-alternatives --config default.plymouth\n```\n\n这会显示一个列出你已安装主题的编号菜单。星号表示当前主题。输入你想要使用的主题数字。`default.plymouth`\
  \ 链接将被设置为你选择的主题。当系统再次启动时，它将使用该 Plymouth 主题。\n\n某些非 Linux Mint 的主题可能会在启动时卡住。在这种情况下，你可以编辑启动内核行以移除\
  \ `splash` 选项，然后进入系统（见第 3 章）。之后使用 `update-alternatives` 更改你的 Plymouth 主题。\n\n##\
  \ 音频\n\n当你启动系统时，ALSA 会自动为你检测声卡，ALSA 在系统启动时由 `udev` 调度。可拆卸设备（如 USB 音设备）也会被检测。音频设备和接口工具列表请参见\
  \ 表 8-3。\n\n除了硬件驱动程序外，音频系统还使用音频接口将编码的音频流从应用程序引导到硬件驱动程序和设备。Linux Mint 使用 PulseAudio\
  \ 服务器作为音频接口。PulseAudio 旨在将所有音频接口合并并整合为一个简单、灵活且强大的服务器。ALSA 硬件驱动程序仍在使用中，但应用程序接口由 PulseAudio\
  \ 处理。PulseAudio 是 Linux Mint 和 Ubuntu 的默认设置。\n\n**注意：Linux 上的音频设备由硬件音频驱动程序支持。在 Ubuntu\
  \ 内内核中，硬件支持通过高级 Linux 音频架构（ALSA）系统实现。你可以在 [`alsa-project.org`](http://alsa-project.org)\
  \ 更多关于 ALSA 的信息。**\n\nPulseAudio 是一个跨平台音频服务器，允许你单独修改不同音频流的音量。文档和帮助请访问 [`www.freedesktop.org/wiki/Software/PulseAudio/`](https://www.freedesktop.org/wiki/Software/PulseAudio/)。PulseAudio\
  \ 对你所有的音频流提供完全控制，允许你组合音频设备并将流重定向到网络上的任何地方。PulseAudio 不局限于单一系统。它具备网络功能，允许你将声音从一台\
