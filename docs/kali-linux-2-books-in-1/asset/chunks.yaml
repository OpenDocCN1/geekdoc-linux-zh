    处理软件包的 APT 工具被称为 "apt get"，它是一个轻量级且令人惊叹的命令行设备，用于引入和移除程序包。`apt get` 会监控随所需条件引入的所有内容，这些条件是其他程序实现正常功能所需的额外程序包。例如，渗透测试人员的亲密伙伴
    Metasploit 依赖于一种名为 `Ruby` 的特定编程语言。如果没有引入 `Ruby`，Metasploit 将无法运行；因此，`Ruby` 是 `Metasploit`
    的依赖项。


    `apt get` 不仅监控引入程序的条件。它还会在有可用可用时监控形成和埋藏条件。当软件包不再有价值或已损坏时，`apt get` 将在下次刷新时提醒用户，并提示移除旧软件包。


    `apt get` 可以是一个极其简单、也可以是极其复杂的工具。软件包的组织对于确保 Kali Linux 正常运行以及确保软件包处于最新状态至关重要。虽然
    Kali Linux 的普通用户不需要了解 `apt get` 的内部操作，但有几个每个用户应该了解的基础知识。


    ## 引入应用程序或软件包


    引入额外的程序是 `apt get` 命令最核心的功能，而且非常简单。下面的语法结构提供了 `introduce` 子命令的基本用法示例：


    ```bash

    apt get introduce {package_name}

    ```


    尝试引入 "gimp;"，一个图像处理软件包：`apt get introduce gimp`


    ## 更新


    偶尔应该检查在 Kali Linux 上引入的不同应用程序和软件包的源（或仓库）是否有更新。在引入任何新软件包之前应该检查更新，在执行对框架、应用程序或软件包的升级操作之前也是必要的。执行刷新的命令是：`apt
    get update`


    ## 重构


    没有任何系统是完美的。每个主要的框架系统都处于持续进展、改进和修复执行文件的状态，以提供新功能或修复漏洞。更新功能将下载并引入新引入程序的所有新版本。所有基于
    Linux 的系统的伟大之处在于它们是开源的，这意味着地球上的任何人都可以向系统的发行版提交新代码，以帮助改进系统用于漏洞检测或开发需求的功能。这使得补丁的更新比微软等公司巨头更快。如前所述，在运行重构之前必须安装更新。要更新
    Kali，使用以下指令：


    ```bash

    apt get update

    ```


    ## 发行升级


    发行更新工作与重构工作类似。此功能同样会寻找特殊标记软件包及其条件的热点，正如发行版分配的包含最新版本的的新软件包一样。例如，在执行发行重构工作时，整个 Kali
    系统将从版本 1.0 升级到版本 1.n 或 2.n 等。使用以下命令更新 Kali：`apt get dist-update`


    ## 移除


    `apt get` 可用于减少系统的印象，或在移除特定程序时使用。还建议卸载所有未使用、不再满足需求或对你的系统冗余的软件包。例如，如果系统不需要 `Leaf
    cushion` 应用程序，那么就移除它。如果以后需要引入该应用程序，通常会再次引入，尽管忽略无用的东西是理想的。可以使用以下命令移除应用程序或软件包：`apt
    get expel {package_name}`


    尝试移除 "leafpad" 之后重新安装该应用程序：


    ```bash

    apt get expel leafpad

    apt get introduce leafpad

    ```


    ## 自动移除


    一段时间后，系统的应用程序软件包会被更优的版本所取代。自动移除功能将移除为了系统最佳功能而不再需要的旧软件包。建议在重构或发行升级之前执行自动移除工作。使用以下命令运行自动移除：


    ```bash

    apt get autoremove

    ```


    ## 清理


    移除（expel）和清理（cleanse）之间的区别是什么？`expel` 功能不会破坏任何设计文件，如果以后需要这些文件，它们将保留在你的硬盘上。这对于应用程序特别有用，例如
    `MySQL`、`Samba Server` 或 `Apache`。配置文件对于应用程序的运行至关重要。有时，需要从系统中移除整个应用程序文档（甚至是该应用程序的设计文件），以便从干净状态重新引入并启动，或者清除所有潜在敏感数据的痕迹。从系统中清理应用程序将一次性彻底消除软件包及其所有相关配置文件。使用
    `cleanse` 功能时不要太粗心；当使用错误或在不适当的应用程序上使用它是危险的，因为所有相关记录都将从系统中移除。可以使用以下语法结构清理：`apt
    get cleanse {package_name}`


    ## 清洁


    软件包从源下载到系统，解包，然后引入。软件包将留在系统中，直到另有通知。


    在应用程序建立后，这些软件包不再是必要的。一段时间后，这些软件包可能会占用磁盘空间并应该被清理。可以使用以下结构启动完美功能：`apt get clean`


    ## 自动清理


    自动清理同样像完美功能一样清理系统。它应该用于系统的重构和发行升级，因为 `autoclean` 功能将移除已被新版本取代的旧软件包。例如，假设应用程序 `Y`
    版本 1 被引入系统，在系统升级后，应用程序 `Y` v1 被应用程序 `Y` v2 取代。`autoclean` 功能将仅清理版本 1，而完美功能将移除两个版本的应用程序软件包。以下结构将启动自动清理工作：`apt
    get autoclean`


    ## 汇总


    软件包的组织与高效运行密切相关。以下是用户可以使用指令，以确保所有可能的修复、软件包和更新都是前瞻性且就绪的：


    1. `apt get update && apt get upgrade && apt get dist-upgrade`

    2. `apt get autoremove && apt get autoclean`


    命令行中的 `&&` 允许连续运行多个方向。


    ## Debian 软件包管理器


    Linux 的主要版本（或发行版）拥有独特的软件包框架。Kali Linux 基于 `Debian 7.0` 框架，可能需要外部应用程序，例如 Tenable
    的 `Nessus`。


    `Nessus` 是一个漏洞扫描应用程序，可以从适用于 `Debian 软件包管理器` 的预包文档中引入。`Nessus` 的使用将在扫描章节中探讨。在下载此类程序时，寻找文件名结尾的
    `.deb` 扩展名。


    使用 `Debian 软件包管理器` 相比 `APT` 没有优势。`aptget` 程序是专门为管理 Debian 软件包编写的。

