    # 第 8 章：代理与代理链


    随着技术的进步，黑客的数量每天都在增加。谈到黑客时，有些是好的，另一些可以被认为是坏的。大多数坏黑客使用黑客手段来窃昂贵的机密信息、为了钱，甚至有些人仅仅是为了好玩。坏黑客倾向于通过传播有害恶意软件和其他恶意物品在网络安全世界中制造混乱。好的黑客也可能为了钱而黑客，但他们以正确的方式这样做，例如参与漏洞赏金活动，帮助他人妥善备份所有


    随着技术的进步，黑客的数量每天都在增加。在谈到他们丢失的数据时，学习系统内部可能的漏洞让管理员意识到可能的威胁等。


    “黑客”并不意味着他们是那些可以进入网络安全世界任何形式受限区域的人；他们也是管理公司或组织安全的 IT 专家。大多数黑客在黑客时需要保持匿名状态，他们总是努力让自己难以被发现。黑客使用多种类型的工具来隐藏身份，如
    `VPN`（虚拟专用网络）、`RDP`（远程桌面协议）和代理服务器 `ProxyServers`）。


    为了完全匿名地执行渗透测试并降低被检测的总体概率，黑客需要使用某种中间机制，其自身的 `IP` 地址将留在目标系统中。黑客通过使用代理来实现这一目的。代理服务器或代理是一种专用的软件或计算机系统，它也运行在计算机系统上，并在客户端服务器和终端设备（如计算机系统）之间充当自己的中间人。通过代理连接互联网，客户端系统的
    `IP` 地址将不会显示，而是将显示代理服务器的 `IP` 地址。这有助于在客户端直接连接互联网时提供更多的隐私。


    ## ProxyChains 的特性


    `ProxyChains` 的主要特性是：


    - 它支持 `SOCKS4`、`SOCKS5` 以及基于 `HTTP CONNECT` 的代理服务器。

    - `ProxyChains` 可以与列表中的任何其他代理混合。

    - `ProxyChains` 支持多种链式方法，例如：随机（random），即从配置文件的列表中随机选择任何代理；或者按照类似的列表顺序进行链式代理，通过文件中的换行将不同形式的代理相互分开。它还带有一个动态（dynamic）选项，`ProxyChains`
    只通过那些本质在线的代理。它排除了任何形式的不可达或失效代理。这种形式的代理被称为智能（smart）选项。

    - 你可以将 `ProxyChains` 与 `sendmail`、`squid` 等许多服务器配合使用。

    - `ProxyChains` 还通过代理解析 `DNS` 的能力。

    - 它可以处理任何形式的 `TCP` 客户端应用程序，如 `telnet`、`nmap` 等。


    ## ProxyChains 的语法


    与其运行简单的渗透测试或直接使用你的 `IP` 地址创建各种目标请求，你可以使用 `ProxyChains` 来涵盖并处理所有工作。你只需要为每个任务添加
    `proxychains` 命令。这将启用 `ProxyChains` 服务。


    例如，你想使用 `Nmap` 配合 `ProxyChains` 扫描网络中的某些可用主机及其端口，命令看起来如下：


    ```

    proxychains nmap 192.168.0.0/25

    ```


    该命令语法的分解为：


    - `proxychains`: 这将告诉机器运行 `ProxyChains` 服务。

    - `nmap`: 告诉 `ProxyChains` 要执行哪些任务。

    - `192.168.0.0/25` 或其他参数: 这是任何形式的工具或任务所需的参数，在这种情况下，它是 `Nmap` 运行扫描所需的扫描范围。


    ## 如何使用 ProxyChains？


    在开始使用 `ProxyChains` 之前，你需要为 `ProxyChains` 设置配置文件。你还需要一个代理服务器列表。`ProxyChains` 的配置文件位于
    `/etc/proxychains.conf`。用你选择的任何文本编辑器打开 `proxychains.conf` 文件，然后设置整体配置。默认设置下，`proxychains`
    将直接通过你主机上的 `127.0.0.1` 端口 `9050` 串所有总流量，这是 `Tor` 的默认配置。如果你也在使用 `Tor`，你可以保持这一切原样。如果你不使用
    `Tor`，你需要注释掉这一行。


    现在你需要添加更多代理。互联网上可以找到许多免费代理服务器。注释掉默认为 `Tor` 设置的代理。如果你不使用它，请在 `Proxychains` 的配置文件上添加代理并保存。


    ## 随机链 (Random_Chain) VS 动态链 (Dynamic_Chain)


    `Random_Chain` 允许你从列表中随机选择 `IP` 地址。每次你使用 `ProxyChains` 时，代理链对目标看起来都不同，从而增加了追踪来源流量的难度。


    在 `Dynamic_Chain` 中，你可以通过列表每个代理运行流量，如果任何代理没有响应或宕机，失效代理将被完全跳过，自动进入列表中的下一个代理而不会给出错误信息。每个连接都是通过链代理完成的。列表中的每个代理都按照它们在列表中出现的顺序进行链。


