    # Installing compiler for C++ in Linux


    If you are using a Linux based system such as CentOS, Red Hat, Fedora or something
    else, you can type in this command as the root for installing the compiler of
    C++:


    ```

    yum install –y gcc-c++*

    ```


    In order to verify that the compiler of GCC has been installed properly in the
    system use:


    ```bash

    rpm –qa | grep –i c++

    ```


    You can also use the `which` command as:


    ```bash

    which c++

    ```


    # Writing the first C++ based program on Linux


    - From the terminal window, open up a new file for the purpose of editing by using
    the command `vim` as:


    ```bash

    vim hello.cc

    ```

    - Within the `vim` editor, you can now type your C++ program or code.

    - After you are done, save and then exit the file.

    - For compiling the new program of C++, you will need to type this command in
    the terminal:


    ```bash

    c++ hello.cc

    ```


    If the compilation process runs without any error, no form of output is going
    to be printed on the screen.


    - An executable form of file will be created within the present directory with
    `a.out` as the default name.

    - For running this same program, you can execute the executable file which has
    been generated in a similar way you execute any of the executables of Linux.


    ## How to specify name meant for the executable which has been generated?


    Compiling the programs of C++ without any of the specifying options will be producing
    an executable form of file with the name `a.out`. If you want to specify a particular
    name for the executable of your choice you have two ways: first, is to rename
    the `a.out` default after it has been created and second, is to specify the filename
    of the executable at the time of compilation by using the option `-o`.


    ```bash

    c++ hello.cc –o /opt/hello.run

    ```


    ## Executing the system commands from programs of C++


    It is very important to be able to communicate with the compiling system by executing
    the commands of OS when needed. The `system()` function will allow you to run
    the commands of the system from the code of C++. For the ease of the compiler
    to recognize all these functions properly and for compiling in the proper way,
    `stdlib.h` library file is required to be invoked.


    ## Bottom line


    - For writing down C or C++ based programs on the machines based on Linux, you
    will need the `GCC` compiler.

    - All the C++ programs are saved and written as `.cc` format of files.

    - All the resulting form of executables can also be executed in a similar way
    the Linux or Unix executables are being executed.

    - The `system` function is used for running commands of the system from the code
    of C++.

    - The `g++` and `c++` command both compile and link with the source files of C++.


    # Programming in Linux Using Python


    Python is one of the modern-day programming languages which has been gaining lots
    of traction in the development community. It was developed by Guido von Rossum
    in 1990. It is somewhat like Java in which the programs, once written can be easily
    run on any type of operating system. If you are starting off with programming
    for the first time in Linux, Python is a great choice for you to begin with. It
    comes with a low learning curve along with an elegant system of coding.


    ## Installation of Python


    Linux based distributions such as Ubuntu come with a version of command line pre-installed
    which makes the ultimate game of starting with Python very easy and simple. In
    fact, many in the Linux community developed many of the scripts and sets of tools
    under Python.


    You can start the process with either the graphical interactive development environment
    or IDLE or command line version.


    ## Programming Python from the command line


    Open up your terminal window and then type in `python` within quotes as `''python''`.
    This will open up Python in the interactive mode. This mode is really good for
    learning at the initial stages, however, you might want to use a text editor such
    as `Vim`, `Gedit` or `Emacs` for writing down your codes. As long as you save
    the codes with the extension of `.py`, you can execute them in the terminal window.
    Most of the programming starts with the very old standby: the program of Hello
    Universe or World. So, we will also start it from there.


    At the command prompt, type in `print "Hello Universe"` and then hit enter. You
    can readily see the command being printed on the line next to the command. For
    running a script from the command line just type: `python my_script.py`. If you
    want to exit from the command line type in `exit()` or just hit `Ctrl+d`.


    ## Programming Python with IDLE


    If you are thinking of writing down a long program right from the command line,
    you can start with IDLE. Just open up the terminal window and then type in: `''idle''`.
    You will now see that the graphical shell of Python has been loaded. For writing
    down a script in Python, just click on File then New Window.


    This will be opening up a kind of text editor just like Notepad. Then, all you
    need to do is to just type this code:


    ```python

    #linuxversion.py

    #Have user input version and response

    name= raw_input("Which release of Linux do you see")

    print "Even I like", name, " – Linux is great!"

    ```


    A variety of things are going on here in this command. The first two lines which
    are preceded by the sign `#` are just mere comments. The third line will be using
    the input which has been gathered from the function `raw_input` and then it will
    assign the same to a variable which is a `name`.


    At the end, the `print` statement will return the results. You can save the file
    with an extension of `.py` and then select Run followed by Run Module from the
    available menu for running your program.


    Note that there are various programming languages which generally ignore any of
    the whitespaces which is actually the spacing in between the codes. However, in
    the case of Python, when there is any form of improper spacing it can lead to
    syntax errors. So, make sure that you enter the spaces properly for running the
    code properly.


    ## Python Programming


    It is often said that systems administrators are required to be very proficient
    with the language of scripting.


    While most of the people are very much comfortable in using `BASH` for running
    the scripts, Python in place of it can actually add several benefits. Python allows
    the users to access all the tools of the command line and also makes use of the
    Object Oriented Programming structure. The versions of Python: `2.x` and `3.x`
    can be usually found for most of the distributions of Linux. For entering a shell
    of Python just type in `python3` or `python` in the emulator of your terminal.
    For exiting from the shell just type in `quit()`.


    It is to be noted that while version `2.x` of Python is still used today, it is
    not at all maintained actively. For this reason, it is always better to switch
    to `3.x`. There are certain differences in syntax in both the versions of Python.


    You can perform various arithmetic operations along with manipulation of text
    strings in Python. If you want you can even assign the operational results to
    the variables and then display the same on the screen. A very handy feature that
    comes with Python is concatenation: you will need to supply the variable or string
    values in a list which is comma-delimited for the printing function and it will
    return the sentence completely composed by the listed items in a sequence. You
    can also mix up variables of various types and after you have assigned one specific
    value to any of the variables, you can change the type of data in a later stage
    without any form of problem.


    You can easily create lists in Python. A list is nothing but an ordered set of
    items which is not at all necessary to be of the similar data type. For creating
    an empty set of list names as `bandsRock`, you will need to use square brackets
    along with the command as:


    ```python

    bandsRock=[]

    ```

