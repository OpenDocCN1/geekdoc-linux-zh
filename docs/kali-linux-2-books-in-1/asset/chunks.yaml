  trans: "\n你需要在此处输入密码，然后按回车键。卸载程序的过程将开始，屏幕上将显示需要执行的操作所需的摘要。如果系统询问你是否继续该过程，请输入‘y’然后按回车键。进程将继续进行。进程完成后，在提示符中输入‘exit’并按回车键。这将关闭终端窗口。如果你不想删除配置文件，只需省略\
    \ `--purge` 命令即可：\n\n```\nsudo apt-get remove gimp\n```\n\n当你卸载任何程序时，可能存在其他依赖于该已卸载程序集的软件包。F\
    \ \n\n对于若要移除系统中的任何未使用的软件包，你可以使用 `autoremove` 命令：\n\n```bash\nsudo apt-get autoremove\n\
    ```\n\n你也可以将两个命令结合，用于删除任何程序及其不再被使用的依赖项：\n\n```bash\nsudo apt-get purge --auto-remove\
    \ gimp\n```\n\n如果你的系统空间不足，使用 `clean` 命令删除所有下载的归档文件：\n\n```bash\nsudo apt-get clean\n\
    ```\n\n此命令还会删除 `/var/cache/apt/archives/` 下的缓存。\n\n因此，在 Linux 上使用命令行安装和卸载软件是一项非常简单快捷的工作。\n\
    \n# 控制文件和目录权限\n\n对于大多数 Linux 用户来说，习惯文件的权限和所有权可能有些些挑战性。假设在此种使用水平下，使用命令行是必须的。尽管还有其他更强大、更灵活的选项，但选择复杂的命令并不总是必要的。在桌面一些用户友好界面的帮助下，你可以轻松地转为很少或不使用命令行。管理文件所有权和权限也是可能的。\n\
    \n文件夹和文件的管理可以从文件管理器内部轻松完成。但在我们离开图形界面 (GUI) 之前，你需要对它的操作有一个具体的理解。所以，让我们从命令行开始。\n\
    \n## 命令行：文件权限\n\n与修改文件所有权权限相关的命令有：\n\n- `chmod`: 用于更改权限\n- `chown`: 用于更改所有权\n\n\
    这两个命令都不难使用。对你来说，理解这一点非常重要：唯一能够更改文件权限或所有权的用户是 root 用户或当前所有者。因此，如果你是用户 B，在不寻求 root\
    \ 或 `sudo` 帮助的情况下，你无法对 A 拥有的文件夹和进行任何更改。例如：\n\n在名为 `/DATA/SHARE` 的数据分区上创建了一个新文件夹。用户\
    \ A 和 B 都需要该文件夹的写入和读取权限。实现此目标有很多方法。如果 A 和 B 是当前系统上的两个用户，你可以轻松地更改所有文件和文件夹的权限以允许他们访问。你可以使用以下命令完成：\n\
    \n```bash\nsudo chmod -R ugo+rw /DATA/SHARE\n```\n\n在此命令中，每个子命令的拆解如下：\n\n- `sudo`:\
    \ 该命令用于在任何采用 `sudo` 的系统上获取命令的全局管理员权限。\n- `chmod`: 该命令用于修改权限。\n- `-R`: 该命令修改父文件夹及其包含子对象的所有权限。\n\
    - `ugo+rw`: 该命令提供组、用户和其他人的写入和读取访问。\n\n在此命令中，`u` 代表用户，`g` 代表组，`o` 代表其他。`o`（其他）条目是最危险的，因为它将为所有人授予文件和文件夹权限。可以为文件夹或文件提供的权限有：\n\
    \n1. `r`: 读取\n2. `w`: 写入\n3. `x`: 执行\n\n使用 `-R` 选项非常重要。如果你在 `SHARE` 目录下有各种子文件和文件夹，并且你想让权限从父对象应用到后续子对象，你必须使用\
    \ `-R` 选项，以确保相同的权限应用到父对象包含的最深层文件夹。\n\n## 命令行：文件所有权\n\n更改文件和文件夹的所有权也非常简单快捷。假设 A\
    \ 为 B 移动了一个文件夹到名为 `SHARE` 的目录，但 A 仍然拥有所有权。这整个过程可以通过一个非常简单的命令来修改：\n\n```bash\n\
    sudo chown -R B /DATA/SHARE\n```\n\n整条命令行可以拆解为：\n\n- `sudo`: 该命令持有管理员权限，因为你正在处理一个另一个用户拥有的文件或文件夹。\n\
    - `chown`: 该命令用于更改所有权。\n- `-R`: 该命令作为递归开关，确保所有子对象获得相同的所有权更改。\n- `B`: 这是文件/文件夹的新所有者。\n\
    - `/DATA/SHARE`: 这是正在被修改的目录。\n\n## GUI：文件权限\n\n假设你需要允许所有人获得 `EXAMPLE` 文件夹的写入和读取权限。要在你的\
    \ Linux 发行版的文件管理器执行此操作，你需要遵循以下所有步骤：\n\n- 打开你的 Linux 发行版。\n- 导航到此例中的目标文件或文件夹。\n\
    - 右键点击该文件夹或文件。\n- 点击菜单中的 `Properties`（属性）。\n- 选择 `Permissions`（权限）选项卡。\n- 在 `Others`（其他）选项卡中选择\
    \ `Access Files（访问文件）选项。\n- 点击 `Create and Delete Files（创建并删除文件）。\n- 为封装的文件选择\
    \ `Change Permissions（更改权限）。\n- 弹出的窗口中你需要在 `Files` 标签下选择 `Read`（读取）和 `Write`（写入）选项，并在\
    \ `Folders` 标签下选择 `Create and Delete Files`。\n- 选择 `Change`（更改）。\n- 点击 `Close`（关闭）。\n\
    \n当你需要修改不属于你的文件夹的权限时，技巧就派上用场了：\n\n\n\n- 打开终端窗口。\n- 输入命令：`sudo -i`。\n- 输入命令：`Nautilus`。\n\
    \n`sudo -i` 命令将为你提供对 `sudo` 的持久访问，除非你输入 `Exit` 命令来移除访问。一旦打开 `Nautilus`，你可以轻松地修改文件夹或文件的权限，即使该文件或文件夹不属于你。\n\
    \n## GUI：所有权修改\n\n你可以通过以下步骤通过 `Nautilus` 修改文件的所有权：\n\n- 在 `Nautilus` 窗口中找到文件或文件夹。\n\
    - 右键点击文件/文件夹。\n- 选择 `Permissions` 选项卡。\n- 从 `Owner` 的下拉菜单中点击 `New Owner`（新所有者）。\n\
    - 选择 `Close`。\n\n# 管理用户环境变量\n\nLinux 新手觉得最难管理的用户环境变量的最常见领域可能也是最晦涩的。尽管 Windows\
    \ 环境也带有环境变量，但大多数用户自己管理自己的变量。为了充分利用 Linux 操作系统的性能，为了获得最佳性能、便利性和隐蔽性，你首先需要理解并管理所有的环境变量。环境变量是在特定用户环境中使用的变量形式。在大多数情况下，环境将是\
    \ `BASH` shell。\n\n每个用户连同 root 都带有一组特定的环境变量，这些变量在被修改之前都设置为某些默认值。你可以轻松地更改这些值，以使你的系统运行更高效并自定义你的工作环境。\n\
    \n### 查看环境变量\n\n"
- fmt: '

    You can start by viewing all the environment variables by simply entering `env.
    You will need to understand that all the available environment variables will
    be in upper case like `PATH`, `SHELL`, `HOME`, among many others. You can also
    create your own set of user-defined variables which will be discussed later. The
    command list will print out various variables which are unique to your system.
    In majority of the cases, this command list is so long that it cannot be viewed
    in one single page. For viewing all the variables arranged line by line, you can
    print out the output by using the command `More`.


    After you have used the command `More`, the whole list of variables will be filled
    up on one screen and will stop. It will be waiting for you to hit the `Enter`
    key to advance to the next line. You can continue to do this until you have found
    any variable which you are looking out for. When you hit the `Enter` key a number
    of times, you will be finding out a variable known as `HISTSIZE`. When you again
    hit Enter, you will be taken through each and every variable of these, one after
    the other. When you are using the command `More` for viewing the output, you can
    enter `q` for quitting or exiting and then return to the prompt of command.


    In place of just scrolling this long list of variables, a tedious job to look
    for the variable of your interest, you can also use the command `grep` which acts
    as the filtering command and will help in easily finding out your required variable.


    ## Viewing the values of the variables


    The command `set` will be displaying all the names of the variables, but if you
    want to view the values which are stored within the variables, you will need to
    enter the keyword `echo` which needs to be followed by `$` sign along with the
    name of the variable such as:


    ```

    echo $HISTSIZE

    ```


    The `$` sign indicates that you want to function with the variable value which
    is available inside and not the label of the variable.


    ## Exporting the environment variables


    When you modify any environment variable, it is only for that specific set of
    environment. In this case, the environment is the `BASH` shell. This indicates
    that when you close the terminal, any of the modifications which you have made
    to these variables will be lost and will go back to their default value.


    If you want the new variable values to stay for your next session of the terminal
    and the terminal session after that, you will need to export the variables. You
    can think of this as exporting the brand new variable value from the present variable
    to the remaining system to make sure it remains available in each and every environment.
    You can do this very easily by:


    ```

    export HISTSIZE

    ```


    Now, the variable value of `HISTSIZE` is set to zero when you leave the environment.
    However, you can easily put the value of `HISTSIZE` back to what it was, suppose
    1000 by entering:


    ```

    HISTSIZE=1000

    export HISTSIZE

    ```


    ## Changing the shell prompt


    The shell prompt by default in Kali comes in the following format:


    `username@hostname:present_directory>`


    If you are the root user, it will translate the prompt:


    `root@kali:present_directory`


    You can also change the command prompt which by default is setting up the value
    for `PS1` variable. This specific variable comes with a specific set of placeholders
    for all the information meant to be placed within the prompt. It includes:


    - `\u`: Name of the present user

    - `\h`: Name of the host

    - `\W`: Present working directory


    You can change the prompt in the terminal for `PS1` by:


    ```

    PS1= “Best Man:#”

    ```


    Now, each and every time when you will open your terminal, it will show Best Man
    first. You need to note that the prompt will be Best Man when you open up the
    first terminal which is `PS1` but the second number of the terminal will still
    be the same which was set by default prompt.


    ## Changing the PATH variable


    The `PATH` variable is regarded as the most important of all. This variable ultimately
    controls the location to which your shell looks out for the commands which you
    type like `ls`, `cd`, `echo` and many others. In case the shell of `BASH` is unable
    to find your command in any of the directories in any of your path, it will be
    returning an error message as “command not found”. In case you want to install
    a completely new tool named `newtool` into the directory of `/root/newtool`, you
    can do this by adding it to the `PATH` variable by entering:


    ```

    PATH=$PATH:/root/newtool

    echo $PATH

    ```


    The new tool will be added.


    # Chapter 5: Real World Application of Kali Linux and Other Useful Tools


    If you want to become an ethical hacker it will not be as easy as becoming a software
    developer of or a programmer. Ethical hackers, also known as penetration testers,
    need to have a proper understanding about various forms of fields.


    Not only will you need in-depth knowledge about the various languages of programming
    such as in `C++`, `C` and `Python`, you will also need advanced knowledge about
    the Linux environment to get started with ethical hacking.


    Kali Linux is a distribution of Linux which comes with around 600 pre-installed
    tools which are meant for penetration testing. As a beginner in the world of penetration
    testing, this might sound irritating. How could someone learn to use all 600 tools
    as a beginner? However, the truth behind all these tools is that you don’t need
    to master all the tools. This is mainly because Kali Linux comes with various
    tools which serve the same purpose and concept. Let’s have a look at some of the
    best tools that Kali Linux offers for the purpose of ethical hacking.


    ## MacChanger


    MAC address can be regarded as the legal address of any system. There are various
    reasons why it is important to change your MAC address. MacChanger helps in changing
    the MAC address at the time of penetration testing such pentesting any wireless
    form of network with filtering of MAC enabled. For using the MacChanger , you
    will need to follow this command:


    ```

    ~$ macchanger [options] networkDevice

    ```


    The options which are available are:


    - `-h, --help`: Prints help

    - `-V, --version`: Prints the version and then exits

    - `-e, --ending`: Do not change the bytes of vendor

    - `-s, --show`: Prints the MAC address and then exits

    - `-a, --another`: Sets up random vendor MAC which is of the similar kind

    - `-p, --permanent`: Resets to the original form of permanent hardware MAC

    - `-A`: Sets up random vendor MAC which is of any kind

    - `-r, --random`: Sets up absolutely random type of MAC address

    - `-l, --list`: Prints the vendors which are known

    - `-m, --mac=XX:XX:XX:XX:XX:XX`: Sets the MAC address as XX:XX:XX:XX:XX:XX


    ## Nmap


    This works as a network mapping tool. It allows the user to find out the active
    form of hosts within any network and then gather all form of information relevant
    to the task of penetration testing. The main features of this tool are:


    - It helps in host discovery. It can easily identify the hosts in a network.

    - It comes with the feature of port scanning. It allows you to enumerate all the
    open form of ports on the remote or local host.

    - It helps in gathering information related to the operating system along with
    hardware about any form of device which is connected.

    - It also helps in determining the name and version of any application.

    - It extends the default capabilities of Nmap by utilizing the Nmap Scripting
    Engine or `NSE`.


    ## Netcat


    This is a network exploration tool which is famous in the world of security and
    well known in the fields of system and network administration. It is primarily
    used for checking of inbound and outbound network along with exploration of port.
    It is also helpful when used together with other programming languages as `C`
    or `Perl` or along with scripting of `BASH`. The main features of this tool are:


    - It performs analysis of `TCP` and `UDP` ports.

    - It performs sniffing of inbound as well as outbound network.

    - It helps in reverse and forward analysis of `DNS`.

    - It performs scanning of remote and local ports.

    - It comes fully integrated with the standard terminal input.

    - It comes with `TCP` and `UDP` tunneling mode.


    ## Unicornscan

