  trans: '


    它是渗透测试和信息安全领域的极佳工具。今天，大多数渗透测试人员以及关注系统安全和各种网络评估的伦理黑客都在使用它。


    在所有其他 Linux 发行版中，Kali Linux 是当今安全审计领域应用广泛的最优秀且领先的发行版之一。Kali Linux 是唯一一个与网络安全和伦理黑客相关的操作系统。它配备了大量与命令行黑客相关的工具，这些工具对于各种与信息安全相关的工作是至关重要的。


    Kali Linux 最常用于计算机取证、系统应用安全、渗透测试以及与网络安全相关的工作。Kali Linux 还是专为伦理黑客设计的主要操作系统。


    ## 如何下载 Kali Linux？


    Kali Linux 是一款开源软件。这意味着该操作系统可以完全使用和利用，并且完全免费。因此，可以从操作系统的官方网站轻松下载 Kali Linux。你可以通过下一节中提到的各种技术来安装它。你会遇到同一系统的多个版本，可以根据你的需求安装其中某一个。


    在下载安装文件时，你还会遇到一些用于安全工作的十六进制数字。你需要正确检查已下载镜像文件的完整性。你还需要检查安装文件的 `SHA-256` 指纹。


    ## 如何在你的电脑上安装 Kali Linux？


    在电脑上安装 Kali Linux 的整个过程非常简单。你可以选择任何可用的安装操作系统的选项。最常用的安装选项包括：


    *   使用硬盘安装操作系统。

    *   借助 Kali Linux 可启动的 USB 启动盘安装操作系统。

    *   借助 `VMware` 或 `VirtualBox` 安装操作系统。

    *   借助双系统启动安装操作系统。


    在你的系统上安装 Kali Linux 的所有可用选项中，借助 `VirtualBox` 并使用可启动的 USB 启动盘安装操作系统是最常见的。如果你想使用
    `VMware` 或 `VirtualBox` 安装操作系统，你的系统至少需要 20GB 的空闲硬盘空间以及至少 4GB 的内存。


    ### 借助虚拟化软件安装 Kali Linux


    * 在开始安装过程之前，你需要安装如 `VMware` 之类的虚拟化软件。你也可以选择其他选项，例如：

    * `VirtualBox`，它是 Oracle 的产品。完成虚拟化软件完成后，从应用程序文件夹启动该软件。

    * 你需要下载操作系统的安装文件，可以从官方网站轻松获取。之后，启动虚拟机。为此，打开在你系统上安装的虚拟化软件的主页，然后从选项中选择 `Create New
    Virtual Machine`（新建虚拟机）。

    * 创建新虚拟机后，选择 Kali Linux 操作系统的 `iso` 文件或镜像，随后需要选择客户操作系统。你还需要配置与虚拟机相关的每一个细节，例如 Kali
    Linux。选择 Kali Linux `VM` 后，你现在可以轻松地启动与 Kali Linux 相关的虚拟机。选择 `VM` 后，点击绿色的 `Power`（电源）按钮。

    * `VM` 启动后，你将看到弹出的菜单，你需要在 `GRUB` 菜单中选择所需的安装模式。选择 `Graphical Installation`（图形化安装）然后选择
    `Continue`（继续）。

    * 随后的屏幕将要求你确定与区域相关的信息，例如你希望用于 Kali Linux 的首选语言、所在位置、键盘布局等。

    * 完成所有这些操作后，你需要为 Kali Linux `VM` 设置一个强密码。随后，安装程序会要求你选择时区，然后在磁盘分区步骤暂停。你可以为 `VM`
    选择 `Entire Disk Space`（使用整个磁盘空间）或 `Create Separate Partition`（创建独立分区）。

    * 你需要保存所有更改，但不要继续执行过程，因为这将完全擦除磁盘上的所有数据。因此，在继续之前请务必先确认设置。

    * 之后，你会被要求安装 `GRUB` 引导加载程序。选择 `Yes`，然后选择用于保存启动 Kali Linux `VM` 所需信息的设备。

    * 点击 `Finish`（完成），安装程序将完成最后的阶段程序。

    * 操作系统也可以借助可启动的 USB 启动盘安装。


    ## 第二章：安装故障排除


    在渗透测试和伦理黑客方面，Kali Linux 已证明是一个相当可靠的软件。但有时系统会崩溃，导致重新安装它变成一项枯燥的工作。Kali Linux 安装失败背后可能有多种可能性。这可能包括
    `iso` 下载不完整或损坏、目标机器磁盘空间不足等许多问题。


    Kali Linux 的安装程序确实非常可靠，但遇到 Bug 或外部问题（如镜像源故障、网络问题等）是非常常见的。因此，在这种情况下，你只需要对安装过程进行简单的故障排除，以便继续进行。


    每当 Kali Linux 安装程序失败时，都会弹出一个“Installation Step Failed”（安装步骤失败）的屏幕。此时，你需要知道 Kali
    Linux 安装程序在各种虚拟控制台上运行：主屏幕运行在第五个控制台（对于图形界面安装程序，使用 `CTRL+Alt+F5`）或第一个控制台（对于文本界面安装程序，使用
    `Shift+F4`）。


    在这两种情况下，通过 `CTRL+Shift+F4` 看到的第四个控制台将帮助显示安装程序内部具体发生了什么的所有相关日志。你可以通过更详细的错误信息轻松评估安装程序问题的原因，例如“the
    log screen of installer”（安装程序的日志屏幕），这表明目标机器空间不足，安装程序无法继续该步骤。


    ### 安装程序的日志屏幕


    第三个和第二个控制台（分别为 `CTRL+Shift+F3` 和 `CTRL+Shift+F2`）托管了 Shell，可用于详尽尽地进一步调查当前状况。大多数命令行工具都由
    `BusyBox` 提供，因此功能集有些有限。它们对于解决你在安装 Kali Linux 期间可能遇到的大部分问题已经足够了。


    当你点击主屏幕 `Installation Failure`（失败）上的 `Continue`（继续）时，安装程序将带你回到一个你在正常情况下可能看到的屏幕，即
    Kali Linux 安装程序的 `Main Menu`（主菜单）。此屏幕将让你逐个启动安装步骤。如果你能通过访问安装程序 Shell 来修复问题，就可以轻松重新开始失败的步骤。


    ### 在安装程序 Shell 中可以做什么


    在安装程序 Shell 中，你可以通过命令 `debconf-get` 和 `debconf-set` 轻松检查并修改 `debconf` 数据库。这些命令用于测试前面的值。你可以使用
    `more` 或 `cat` 查看任何文件，例如位于 `/var/log/syslog` 的完整安装日志。你还可以使用 `nano` 编辑正在安装到系统的任何文件。


