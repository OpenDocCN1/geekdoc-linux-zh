  trans: "\n攻击小组负责在指挥官和高级海军军官面前汇报，澄清了攻击的微妙之处。每个进展都以极其详尽的细节进行了阐述，开发了导致滥用发生的每一个细节。入侵分析师也应该创建详尽的报告，以澄清黑客程序中的每个步骤、被滥用的漏洞以及真正被破坏的框架。此外，通常情况下，可能需要小组中的一名（有时是多名）成员为目标数据框架的高级计划人员和专门工作人员提供逐项准备。\n\
    \n# 提纲\n\n接下来的章节将更详细地澄清这些阶段。每个部分都将提供有关每个阶段所用常规设备的基础数据。通过利用详细的操作程序，用户将理解所阐述阶段的原因和偏好，以及在该阶段最广泛使用的工具。\n\
    \n# 监控\n\n### 本章内容\n- 网站镜像\n- Google 搜索\n- Google 黑客攻击 (Google Hacking)\n- 社交媒体\n\
    - 招聘网站\n- DNS 和 DNS 攻击\n\n**部分**-`概述与关键学习点`-本节将阐明渗透测试周期中观察阶段的基础知识。此程序将使道德程序员能够找到有关目标关联和\
    \ PC 框架的数据，这些数据稍后可用于连接 PC 框架。\n\n# \n\n正如军事组织者在制定战斗方案之前会仔细分析可用数据一样，成功的入侵分析师也应该在引导有效的渗透测试之前，仔细分析可以获取的所有数据。通常，这些数据可以通过使用\
    \ `Google` 等互联网位置浏览互联网，以及其他专注于数据共享和在线生活的网站来获取。数据也可以在为客户端程序提供引导的互联网名称服务器上找到。电子邮件可以通过关联进行跟踪，甚至回邮件也能为入侵分析师提供帮助。\n\
    \n创建并分析目标网站的离线副本可以提供重要数据的源泉，并在测试 `ROE`（执行规则）允许的情况下，以后作为社交工程任务的工具。\n\n此阶段始于测试小组对目标的最少思考。提供给小组的详细程度范围很大，从仅知道关联名称和可能的网站地址，到详细且明确的框架数据，包括\
    \ IP 地址空间和用于 `ROE` 限制或界定测试范围的创新技术。`ROE` 还可能限制测试小组开展活动的能力，严禁进行社交工程和破坏性活动，例如拒绝服务\
    \ (`DoS`) 和分布式拒绝服务 (`DDoS`) 攻击。\n\n目标是尽可能多地获取有关该关联的数据。\n\n关于该关联需要解决的一些问题包括：\n\
    - 等级结构，包括逐项的、级别、部门和小组权限范围；\n- 层级基础，包括 IP 空间和系统拓扑；\n- 所用技术，包括设备阶段和软件包包；\n- 代表性的电子邮件地址；\n\
    - 授权人员；\n- 办公室的物理区域；\n- 电话号码。\n\n### 内部代理\n可能的专家可能是聘用渗透测试小组的人员或者是关联指定的个人，该人员有权回答有关承诺的任务的问题。那个人不会透露渗透测试正在针对该关联。\n\
    \n# 第 8 章：从目标自己的网站开始\n\n目标的官方网站为构建攻击画像提供了海量数据。例如，许多地方乐于展示权限结构和关键人物的简介。这些应该被用于构建目标画像以及有关关联中关键人物的数据。它们可以用于通过基于网络的社交媒体网站进一步获取数据，并在明确的\
    \ `ROE` 允许的情况下进行社交工程。\n\n许多授权网站还包含招聘页面。此页面可以对判断关联中所使用的技术提供帮助。例如，招聘熟悉 `Active Directory`\
    \ 和 `Windows Server 2012` 的框架主管公告将是一个强有力的指标，表明该关联至少在使用 `Windows Server 2012`。类似的招聘熟悉\
    \ `Windows Server 2003` 或 `2000` 管理的主管或大师，会让任何入侵分析师警觉，因为这些阶段与较新的工作框架相比是无力的。\n\n\
    每个网页都应该检查是否有连接网络邮箱的链接，一旦发现就对其进行评估。如果点击链接显示 `Outlook Web Access` 页面，则可以合理假设正在使用\
    \ `Microsoft Exchange` 服务器处理电子邮件。如果显示 `Office 365` 页面，则表明电子邮件服务正在被云化，且邮件服务器可能超出了大多数\
    \ `ROEs` 的范围。这对于 `Google` 网页邮箱同样有效；尽管如此，这些应在承诺开始之前界定的限制范围内逐项说明。如果对交叉可行性的查询存在限制，则应使用承诺的执行员来确定该问题。\n\
    \n## 网站镜像\n\n有时，复制关联的整个网站以进行离线评估是很有可能的。这可能是为了使用自动化工具扫描术语，或者仅仅是为了在当前网站上的敏感数据发生变化时有一个副本。仅仅拥有网站副本以进行离线监控也是有价值的。像\
    \ `wget` 这样的命令行将从网站复制所有的 html 记录并将其存储在本地硬盘上。`wget` 工具包含在 `Kali Linux` 中，是一个简单易用的工具。通过在终端窗口中使用以下命令，将下载整个网站的\
    \ html 记录。必须注意的是，`wget` 不复制页面的服务端程序，例如那些使用 `PHP` 内容制作的页面。\n\n```bash\nwget m p\
    \ E K np - v http://foo.com\n```\n\n在此模型中，`wget` 命令跟着各种开关或选项。与 `Kali Linux` 上的工具一样，可以参考客户端手册来决定在正在进行的任务中使用该工具。要查看\
    \ `wget` 手册页，使用以下命令：`man wget`\n\n进入手册页后，使用向上和向下方向键以及翻页和翻页键来浏览内容。按 `h` 键获取帮助，按\
    \ `q` 键离开手册页。对这组开关的 `wget` 手册页进行审计可以发现：\n- `-m` 镜像，开启适用于镜像网站的选项；\n- `-p` 页面或本质，此选项确保下载所需的文件，包括图片和\
    \ css 记录；\n- `-E` 更改扩展，这将使所有页面在本地保存为 html 文档；\n- `-k` 转换接口，这允许文档转换为离线查看；\n- `-K`\
    \ 保留转换后的副本，将使用 `.orig` 后缀备份原始文件。\n"
