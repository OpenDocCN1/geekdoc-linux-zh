    `WHoppiX` 到 `WHAX`，再到 `Back Track`，现在演变为一个利用了 `Debian GNU/Linux` 许多功能以及全球动态开源网络的渗透测试框架。


    `Kali Linux` 的创建并不是为了成为一个简单的工具集合，而是一个灵活的框架，专家渗透分析师、安全爱好者、学生和新手都可以对其进行修改以适应他们的特定需求。


    ### 为什么选择这本书？


    `Kali Linux` 不仅仅是基于标准 `Debian` 引入的一系列不同的数据安全工具，并经过预配置以便让你立即上手。要充分利用 `Kali`，关键在于对其强大的
    `Debian GNU/Linux` 基础（它支持所有这些卓越工具）有深入的理解，并弄清楚如何部署它们来为你服务。


    尽管 `Kali` 无疑是多用途的，但它的本质目的是为了协助渗透测试。


    本书的目的不是为了让你在使用 `Kali Linux` 时感到从容。此外，它有助于提高你的理解并简化你的体验，这样当你忙于渗透测试且时间紧迫时，你就不必为了浪费宝贵的分钟去安装新程序或启用另一个系统管理程序而感到压力。在本书中，我们将先让你熟悉
    `Linux`。之后，随着我们熟悉 `Kali` 的细节，我们将进一步深入。


    #### 了解 Linux，以便你确切知道内部发生了什么。


    拥有这些信息非常重要，尤其是当你试图在紧迫的时间限制下工作时。在设置环境、调查问题、努力让某个工具听你差遣、解析设备输出或在更大规模的情况下使用 `Kali`
    时，需要这些信息并不是不常的。


    ### 这本书适合你吗？


    如果你渴望投入充满智力且不可迷的数据安全领域，并已正式选择 `Kali Linux` 作为一个核心平台，那么这本书将会在你的旅程中提供帮助。它的编写目的是帮助首次使用
    `Linux` 的用户试图加强对 `Kali` 基础理解的 `Kali` 用户。它也适用于那些已经使用 `Kali` 长期但希望系统化自己的学习、增加对 `Kali`
    的利用并填补知识空白的人员。


    此外，这本书还可以作为那些寻求 `Kali Linux 认证专业人员` 认证的指南、专门参考和学习辅助。


    ## 术语


    在审查渗透测试时，经常会使用各种基础术语。不同的职业、特定的声誉甚至来自同一小组的人对该领域使用的术语的理解略有不同。因此，本书将使用以下术语及相关定义。


    ### 渗透测试 (Pentesting)


    渗透测试是分析师在特定且授权的规则内采用的方法、程序和技术，试图绕过数据框架的安全，包括克服该框架协调的安全措施。这种测试与评估框架的技术、法规和操作设置及控制有关。


    定期的渗透测试仅评估原始状态的数据框架安全性。目标系统的管理员和工作人员可能会意识到正在进行渗透测试。


    ### 红队 (Red Team), 红队对抗 (Red Teaming)


    红队在程序和方法上模拟潜在敌人。


    这些小组通常比渗透测试小组更大，拥有丰富的经验。渗透测试本身通常是“红队演习”的一个子部分，但这些活动测试了组织安全设备的不同元素。红队经常通过技术、社交和物理方法攻击组织。他们经常使用与黑客客（Black
    Hat Hackers）相似的程序，以测试组织或数据框架针对这些反派角色的防御能力。除了渗透测试外，红队还将执行社会工程攻击，包括网络钓鱼和鱼叉钓鱼，以及包括翻垃圾桶和开锁在内的物理攻击以获取数据和访问权限。通常，目标组织的员工不会意识到正在进行“红队演习”。


    ### 道德黑客 (Moral Hacking)


    道德黑客（Ethical Hacker）是专家级渗透分析师，为了框架所有者或拥有数据框架的利益而攻击框架。对于本书而言，道德黑客与渗透测试同义。


    ### 白帽 (White Hat)


    白帽是“道德黑客”或相信能提高数据框架安全的哲学的电脑安全专业人员的俚语。


    ### 黑帽 (Dark Hat)


    黑帽是一个术语，指利用特殊方法在未经许可绕过框架安全以执行不道德行为的人员。渗透测试人员和红队人员经常使用黑帽的策略，在执行授权的活动或测试时模仿这些人。黑帽未经授权且非法地进行其活动。

