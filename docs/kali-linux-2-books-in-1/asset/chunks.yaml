    暗帽（Dark Hat）指的是一种游走于白帽和黑帽界之间的特殊专家。这些人经常尝试在未经授权的情况下绕过数据框架的安全重点，但其目的并非为了利益，而是为了让框架管理员意识到他们发现的缺陷。暗帽通常没有测试框架的授权，但他们通常并不追求金钱相关的收益。


    ## 无能性评估、漏洞分析


    无能性评估（Powerlessness Assessment）用于评估数据框架的安全设置。此类评估包含了对已应用于框架中或缺失的安全补丁的评估。漏洞分析团队（`VAT`）可能位于数据框架之外，也可能是数据框架支持人员的一部分。


    ## 安全控制评估


    安全控制评估（Security Controls Assessment）旨在评估数据框架与明确的合法或行政需求的一致性。这些要求的示例包括但不限于《联邦信息安全管理法》（`FISMA`）、支付卡行业标准（`PCI`）以及《健康保险流通与责任法案》（`HIPAA`）。安全控制评估被作为证据集（`BOE`）的一部分，组织利用其来批准数据框架在生成环境中运行。某些框架要求渗透测试作为安全控制评估的主要部分。


    ## 恶意用户测试、恶意用户测试


    在恶意用户测试中，评估人员接受扮演具有恶意的内部人员、怀恨的客户或滥用者的工作。在这些测试中，评估人员会被授予已批准的普通用户或管理客户的权限，通常作为一个测试账户。评估人员将利用这些权限尝试绕过安全限制，查看未经授权访问的记录文件和设置，更改不应更改的设置，并将自己的权限提升到超过记录应拥有的水平。恶意客户测试模拟了叛变内部人员的行为。


    ## 社会工程学


    社会工程攻击通常会对数据框架或客户造成伤害。社会工程师利用人们帮助他人的本能来获取进入数据框架的机会。常见的社会工程策略包括试图让帮助区域审查员重置客户账户密码，或让终端客户泄露密码，从而使社会工程师能够登录未经授权的账户。其他社会工程策略还包括钓鱼和鱼叉式钓鱼。


    ### 钓鱼


    在`Phishing`（音同 "angling"）中，社会工程师试图让目标个人泄露个人数据，如客户姓名、账号密码和密码。这通常通过利用来自合作伙伴、银行和客户服务人员的看似真实但虚假的消息来实现。不同类型的钓鱼试图让客户点击虚假超链接，从而在对方不知情的情况下向其目标电脑引入恶意代码。这种恶意软件将用于用于从电脑中提取信息或利用该电脑攻击他人。钓鱼通常不是针对特定客户，而是可能是邮件列表上的任何人或具有特定邮箱扩展名的用户，例如带有
    `@foo.com` 扩展名的客户。


    ### 鱼叉式钓鱼


    `Lance Phishing`（鱼叉式钓鱼）是一种目标明确的钓鱼。例如，攻击者可能会发现组织首席执行官（`CEO`）或其他官员的电子邮件地址，并仅针对这些个人进行钓鱼。


    ### 翻垃圾桶（Dumpster Diving）


    在翻垃圾桶中，评估人员搜阅框架客户丢弃的垃圾，寻找有助于进一步了解目标的数据。这些数据可能是框架设置或配置、网络拓扑、程序变和硬件组件，甚至是客户名称和密码。该术指的是进入巨大的垃圾容器，或者只要敞口的办公室垃圾桶能产生有价值的数据，就“跳入”其中。


    ### 现场 CD、现场光盘或现场版操作系统


    现场 CD 或现场光盘是指包含整个完整运行操作系统的光盘。这些光盘对许多评估人员非常有帮助，并且可以调整以包含特定的程序段、设置和工具。虽然现场光盘通常出现在
    `Linux` 发行版中，多年年来发布了一些 `Microsoft Windows` 版本。根据数据框架的设置，现场光盘可能是评估人员或分析师带入评估的主要硬件，因为目标框架的电脑可以从现场光盘启动。这使得框架的一个资源能够对抗框架本身。


    ## 第 1 章：Kali 历史


    `Kali Linux` 是 Offensive Security 发布的最新现场版安全应用程序。此版本包含了 300 多个安全和渗透测试工具，分为渗透分析人员和其他评估数据框架的人员经常使用的辅助小组。与
    Offensive Security 之前的版本完全不同，`Kali Linux` 使用 `Debian 7.0` 作为基础。`Kali Linux` 延续了其前身
    `Backtrack` 的谱系，并由类似的团队维护。正如 Offensive Security 所述，名称的更改意味着组织对 `Backtrack` 版本的全面重构。相对于之前的
    `Backtrack` 的巨大改进使得更名变得合理，表明这不仅仅是 `Backtrack` 的另一个版本。`Backtrack` 本身是对从 White Hat
    和 `SLAX`（`WHAX`）以及 `Auditor`获得的两个安全工具的改进。在此领域，`Kali Linux` 是商业安全检查和渗透评估工具的最新体现。


    ### 下载和安装 Kali Linux


    **本章数据** - 本节将介绍如何获取 Kali Linux，这是可用的最强大的渗透工具箱之一。


    **部分概述及核心学习要点** - 本节将澄清 `Kali Linux` 在以下设备上的下载和安装过程：


    - 硬盘

    - 优存盘（USB 内存棒）

    - SD 卡


