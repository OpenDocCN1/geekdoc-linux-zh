    # 在 Linux 上使用 Java 编程


    Java 是最受欢迎的编程语言之一。它被广泛用于开发几乎所有领域的软件，从手机到电缆电视盒，一直扩展到大型企业信息系统。编写 Java 源代码、编译然后运行的整体概念在大多数操作系统中大体相同。


    Java 是一门最初由太阳微型系统公司（Sun Microsystems）开发的编程语言。它属于编译型编程语言的范畴，程序员编写源代码，然后将其提交给编译器，编译器将检查程序的语法并生成一个你可以运行的完整文件。例如，当你使用
    Google Chrome 浏览器时，从真谛上说，你正在运行所有由软件开发者使用的编译器生成的程序。


    在很大程度上，过去的编程语言需要你为想要运行程序的每一个新操作系统重新编译所有的源代码。例如，为在 Windows 上运行而编译的程序在没有重新编译的情况下，不会在带有
    Linux 的系统上运行。由于操作系统和硬件元素之间的巨大差异，这一过程的执行非常困难且复杂。Java 的主要动力之一是希望能够只编写一套源代码，然后让生成的程序具有在不同的操作系统或运行环境中运行的能力。


    Java 之所以具有“编写一次，随处运行”的能力，仅仅是因为编译器将特定文件中的整个源代码翻译成名为“字节码”（Byte Code）的文件，该文件可以在任何形式的支持的
    `JRE` 或 Java 运行环境（Java Runtime Environment）下运行。


    Java 的开发过程涉及以下步骤：


    - 编写 Java 源代码并将其保存在一个或多个纯文本文件中。所有这些文件通常以 `.java` 格式结尾。

    - 运行 Java 编译器（`javac`）将你编写的源代码编译成字节码文件。字节码的文件名通常以 `.class` 结尾。

    - 将字节码提交给 `JRE` 后运行程序。


    ## 下载 Java 开发包


    要使用 Java 进行任何编程工作，你将需要下载并安装 Java 开发包或 `JDE`（JDK）。在大多数情况下，当你在系统中遇到 Java 的安装时，意味着安装了
    Java 运行环境或 `JRE`。在本示例中，你需要 `JDK`，它带有名为 `javac` 的特殊程序，用于将 Java 源代码编译成类文件。你可以从 `Oracle`
    官网下载 `JDK`。


    在下载 `JDK` 时，请确保下载的版本与你当前使用的操作系统匹配。在这种情况下，如果你正在使用 Linux，请下载 Linux OS 支持的文件。大多数
    Linux 发行版（如 Ubuntu、Debian、Red Hat 等）带有软件仓库工具，有助于自动化下载和安装步骤。例如，在 Ubuntu 和 Debian
    发行版中，使用 `apt-get` 命令下载并安装 `JDK`，如下：


    ```bash

    sudo apt-get install openjdk-7-jdk

    ```


    在 Fedora、CentOS 以及其他使用 `YUM` 的发行版下安装 `OpenJDK`，可以使用此命令：


    ```bash

    yum install java-1.7.0-openjdk

    ```


    `apt-get` 和 `yum` 安装程序都会在用户无需执行任何额外任务的情况下下载、安装并配置 `JDK`。


    ## 编写和编译 Java 程序


    Java 编程语言是编译语言的一种，程序员编写源代码，然后将其提交给编译器。编译器本质上是一个将源代码转换为字节码的程序。


    结果生成的字节码通过 `JRE` 执行。你可以使用任何文本编辑器编写 Java 源代码，例如 Windows 中的 `Notepad`，以及 Linux 中用于编辑源代码文件的
    `pico` 或 `nano` 编辑器。要开始编写 Java 程序，请遵循以下步骤：


    - 在 Linux 中打开 shell 提示符。你也可以通过在 Linux 中按下 `ALT+Ctrl+T` 实现这一点。

    - 使用 `gedit` 程序创建一个新文件，只需输入：

    ```bash

    gedit HelloUniverse.java

    ```

    - `gedit` 程序将打开并创建一个文件。

    - 输入你的 Java 源代码。

    - 完成源代码编写后，确保你已保存文件。

    - 退出 `gedit` 程序。

    - 现在是时候使用 `javac` 编译器编译程序了。命令为：`javac HelloUniverse.java`

    - 如果语法没有错误，编译器将顺利运行。

    - 现在你可以通过运行 `Java` 然后后跟程序名来运行你创建的示例程序。


    Java 编程还包含另一个名为“类”（`class`）的组件。它是一个巨大的函数集合，执行各种工作，并带有可能处理的各种数据的模板。在刚才提到的程序示例中，`HelloUniverse`
    就是程序的 `class`。


    # 在 Linux 上使用 BASH 脚本


    BASH 是一种命令语言解释器。它广泛存在于各种类型的系统中，并作为大多数 Linux 或 GNU 系统的默认命令解释器。BASH 与 shell 一起工作。shell
    本质是一个宏处理器，允许非交互式或交互形式的命令执行。在 BASH 中，脚本允许执行自动命令，而这些命令通常情况下会以交互形式逐个执行。


    ## Bash Shell 基础


    shell 允许用户通过命令与计算机交互。它还有助于存储和检索数据、处理信息以及其他若干任务。例如，你可以输入 `cal`、`date`、`pwd` 或 `ls`
    等命令并按回车键。你刚刚的操作是通过 shell 与系统交互以获取当前的日期和时间。


    这是通过使用 `date` 完成的，使用 `cal` 查看日历，使用 `pwd` 查看你当前工作的目录位置，然后通过 `ls` 获取位于其中的目录和文件的完整列表。


    ## 什么是脚本？


    为了正确理解脚本，首先将 shell 与你使用的文本编辑器结合起来，例如使用 `.vi` 创建名为 `task.sh` 的新文件，该文件将包含上述所有命令，每条命令位于不同的行上。完成后，你需要使用
    `chmod` 命令配合 `+x` 选项使新文件具有完全可执行权限。最后，你只需要在名称前加上 `./` 即可执行新脚本。


    通过适当的脚本编写，任何形式的 shell 交互都可以脚本化和自动化。现在还可以使用 `cron` 时间调度器在每天指定的任何时间自动执行新的 shell
    脚本 `task.sh`，并在每次执行时将脚本的输出存储到特定文件中。


    ## BASH 基础

