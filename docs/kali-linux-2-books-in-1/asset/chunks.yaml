- fmt: '

    Before we start with other aspects of Kali Linux, it is necessary for you to learn
    about some of the basic tools and commands that come with Linux. Let’s have a
    look at some of the most basic components.


    ## Essential Linux Terminal Commands


    In relation to the other operating systems which are available in the market and
    Linux in particular, when it comes to the term Command, it means a line of command
    for the applications or the functionalities which are built into the shell of
    the user. However, this distinction is of very little consequence for the end-users.


    Both of them are used in the same way. You need to input the words into the emulator
    of your terminal and it will provide results as outputs.


    ### Linux commands for management of file system


    - `ls`: This command helps in listing all the contents in the current directory.
    When you provide the same with a path, it will list the specific contents of that
    path only. Some of the useful options that you need to know are `-l` and `-a`,
    it displays information as a long list format which comes with much more detailed
    information and also shows the dot or hidden files.

    - `cat`: When provided with one single file, this command helps in printing the
    contents of that file to the output in standard style. When you provide the command
    with many files at a time, it concatenates them and then the output is redirected
    into a completely new file. The most useful is the option of `-n` which helps
    in numbering the lines.

    - `cd`: This command helps in jumping from the present directory to some other
    specified directory. When you use this command without any argument, it will return
    to the home directory. When you use this command with two dots such as `cd..`
    it will return you to the directory which is right above the present one and using
    the command with a dash such as `cd –` will return to the directory just before
    the current one, regardless of the location in relation to the present directory.

    - `pwd`: This command helps in printing the current directory. This command is
    very useful when your prompt does not contain this specific information. It is
    very useful for BASH programming which is used for obtaining the directory reference
    of the one in which you are going to execute the code.

    - `mkdir`: This command is used for the purpose of creating new directories. The
    most handy form of switch is `-p` which helps by creating an entire structure
    of specific nature if it is not present already.

    - `file`: The command file helps in indicating the file type. As the files in
    a Linux system are not under any form of obligation for having the extensions
    related to the system to work, it becomes hard for users to get the exact type
    of a file at times. This command helps in solving this form of problem related
    to Linux.

    - `cp`: This command copies all the directories and files. As this command does
    not copy the directories recurrently by default, always remember to use `-a` or
    `-r` with this command. The `-a` command helps in preserving the ownership, mode
    and time stamp besides copying.

    - `mv`: It is used for renaming or moving directories and files. Renaming and
    moving can be regarded as one single operation where renaming is just moving one
    single file to the same place with a different name.

    - `rm`: The `rm` command is used to delete directories and files. It is a very
    essential command that you need to know as you will not be able to remove any
    clutter without this command. However, while using this command you must be super
    attentive as this command permanently deletes the files and directories. Unlike
    other commands, this command does not even store the deleted files and directories
    somewhere else from where you can fish them out after. Once they are gone, they
    are gone forever. So, in such cases, using the `-r` switch is very essential along
    with the command.

    - `ln`: This command is used for creating symbolic or hard links in between the
    files. The soft or symbolic links are somewhat like the shortcuts of Windows which
    provides a very easy way of accessing any particular folder or file.

    - `chmod`: It helps in changing the permissions of users. By permissions it includes
    writing, viewing and executing files. Any user can change the user permission
    for the files which he/she owns.

    - `chown`: This command is used for changing the ownership of the files. Only
    the root user is able to use this command and can change the file ownership. For
    the purpose of recursively changing the ownership for all the files within a directory,
    you can use the command with `-R`.

    - `find`: This command is used for searching the entire filesystem for some specific
    directories or files. This command is very powerful in nature not just because
    of its capabilities of searching but because this command allows the users to
    execute any arbitrary form of commands on the non-matching or matching files.

    - `locate`: Opposite to `find`, `locate` command searches the database for the
    patterns of the file names. This form of database consists of the snapshots of
    the entire filesystem.

    - `du`: The `du` command is used for showing the directory or file size. Among
    the various useful options are `-s` which provides a summary in place of an entire
    listing, `-h` which converts the reported sizes to a format which is more human-friendly
    in nature and `-d` which helps in controlling the directory recursion depth.

    - `df`: This command is used for showing the usage of disk. The default output
    of this command lists each and every filesystem, reports the sizes of the same
    and also the used space along with the space which is available. You can add on
    `-h` with this command for getting the report in a more human-friendly format.

    - `dd`: This command helps in converting and copying a specific file in accordance
    to the main page. You need to provide this command with the source and the destination
    and it will copy the files respectively.

    - `mount/unmount`: This command pair performs the function of mounting and unmounting
    the filesystems. This whole thing can even range from USB sticks to the ISO images.


    ### Linux commands for processing of text


    - `more/less`: These two commands are somewhat similar in function and allow the
    user to easily view the texts chunked as screenfuls. Suppose there is a very large
    output from some of the commands, like `cat` for a file and the emulator took
    some time to scroll the entire text. When you use any of these commands, you can
    scroll the texts easily now. The command `less` is newer when compared to `more`
    so `more` is not used now.

    - `head/tail`: This is also a pair of commands but in this, both have their individual
    uses. The command `head` helps in outputting one number from the first line of
    a file and the `tail` command helps by providing output as a number from the last
    line of any file. The default output number of these commands is ten which can
    be controlled by using the option `-n`. Another switch which can be used with
    this command is `-f`.

    - `grep`: This command helps by searching the texts for the patterns. By default
    function, this command looks at the standard input but the users can easily specify
    the files which are meant to be searched. The pattern can either be a regular
    expression or a normal string. It can also print out either matching or non-matching
    lines along with the contexts of the same. When you run a command which provides
    lots of information as output, just use this command and see the magic.

    - `sort`: This command is used for sorting the text lines according to various
    criteria. The useful switches which can be used along with this command are `-n`
    which helps in sorting the numeric values of any string, `-r` which helps in reversing
    the provided output and various others. You can use this command while sorting
    the output of `du` command when you want the files sorted in the descending order
    exactly according to the sizes of the same.

    - `wc`: The `wc` command is used for counting the words, the lines, the bytes
    and characters.

    '
