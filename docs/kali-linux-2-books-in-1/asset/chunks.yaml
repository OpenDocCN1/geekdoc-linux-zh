  trans: '


    - `watch`: 这个命令表现得像非常漂亮的程序，它可以定期执行一个程序并在全屏上输出该程序的内容。如果你将该命令放在引号内部，你也可以一次运行多个命令，例如
    `watch –n 1 ‘ ls –la ; echo ; vmstat ; echo; df ’.`。这整条命令将执行完整的列出，显示内存统计信息以及磁盘空间。所有这些内容都将用空行隔开，并在每秒重复一次。这是观察大文件复制以及监控磁盘空间以防出现任何形式的问题的极佳方法。

    - `curl`: 大多数 PHP 开发者都熟悉 php 的 cURL 扩展，该扩展也适用于 Linux 的命令行界面。你不需要编写任何其他额外的 PHP
    程序，只需使用此命令行即可。你需要的所有选项都可用。输入 `man curl` 即可找到所有可能的工具。

    - `logsave`: 这个工具在本质上非常重要，它可以帮助捕获程序的输出并将其发送到日志文件中。它还会添加开始和结束的时间戳。你可以添加 `–a` 参数来追加日志文件内容。

    - `lsof`: 这个命令代表 list open files（列出打开的文件）。它显示系统当前打开的所有文件。它对于确定哪些进程在使用某个特定文件，或者显示单个进程的所有可用文件都非常有帮助。

    - `strace`: `strace` 命令可以帮助追踪特定程序向 Linux 内核发的所有系统调用。这意味着你可以看到程序何时被打开、关闭、读取、写入、访问文件以及许多其他操作。这在某种程度上就像是在没有任何形式遮盖的情况下运行整个程序。例如，`strace
    –ff –e trace=open /usr/sbin/apache 2` 将追踪 `apache2` 程序并输出所有的打开调用。

    - `z* tools`: 你经常需要对已压缩的文件进行 `diff`、`grep` 或 `cat` 操作。你不需要使用解压后的文件，只需通过用 `zgrep`
    替换 `grep`、用 `zdiff` 替换 `diff` 以及用 `zcat` 替换 `cat` 等其他各种命令，就可以将这些文件视为已经解压的状态了。

    - `iconv`: 这个命令有助于将以某种方式编码的文件转换为另一种格式。

    - `nc`: 这个命令能够胜任一切，也可以用于检查服务的请求并确保发送了正确的头信息。


    # 查找内容


    大多数人使用图形化文件管理器来查找 Linux 中的文件，例如 Gnome 中的 `Nautilus`、Xcece 中的 `Thunar` 以及 KDE 中的
    `Dolphin`。然而，你也可以使用命令行查找 Linux 中的各种内容，这甚至不取决于你所使用的桌面管理器类型。


    ## 使用 `find` 命令


    `find` 命令允许你搜索已经知道可能文件名的文件。该命令简单的形式是根据你的搜索标准搜索当前目录下的所有文件，然后是同名的子目录。你可以通过名称、组、所有者、类型、日期、权限以及各种其他标准来搜索文件。在命令后输入点（`.`）如
    `find.`，这将列出在当前目录下发现的所有文件。为了找到匹配某些特定模式的文件，你可以使用参数 `–name.`。你可以提供文件名的元字符（如 `*`），但你需要在它们前面加反斜杠
    `\` 或将其包含在引号内。如果 `find` 命令无法找到任何符合你标准的文件，它将不会产生输出。


    ## 使用 `locate` 命令


    与 `find` 相比，`locate` 命令快得多，因为它使用了一个构建好的数据库，而 `find` 命令是在真实系统的所有实际文件和目录进行搜索。


    该命令返回一个包含特定字符组的所有路径名称的大列表。该命令最简单的形式是找到从根目录开始的文件系统中的所有文件。如果你想找到包含你提供的特定且唯一搜索标准的所有目录或文件，请配合命令使用参数
    `–b`，如：`locate –b ‘\yourdata’`。命令行中使用的反斜杠充当通配符（globbing character），提供了一种方法将非特定性质文件名中的通配符字符扩展为一组特定性质的文件名。


    通配符（Wildcard）无非是一个符号，在评估整个表达式时，它可以被轻松替换为一个或多个字符。最广泛使用的通配符符号形式是 `?`（表示单个字符）和 `*`（表示长字符串）。`mlocate`
    命令是 `locate` 命令的新形式。它有助于索引整个文件系统。然而，搜索结果仅包含当前用户有权访问的文件每当你更新 `mlocate` 数据库时，它都会保留数据库的时间戳信息。


    ## 使用 `which` 命令


    该命令返回执行任何命令时所调用的可执行文件的确切路径。


    `which` 命令对于查找任何可执行文件的位置非常有用，其目的是在用户桌面、任何面板或桌面管理器中的其他地方为程序创建快捷方式。`which` 命令默认只会显示第一个匹配的可执行文件。为了显示所有匹配的可执行文件，你需要配合命令使用
    `–a` 参数。


    # 修改文件


    Linux 及其各种操作系统提供的许多功能之一就是用于创建以及编辑文本文件的工具。现在可以找到各种文本编辑器，每个 Linux 用户都有自己的个人喜好。让我们来看看
    Linux 中一些著名的文本编辑器。


    ### 文本编辑器


    如果你是 Windows 用户，你一定熟悉名为 Notepad 的经典文本编辑器。Linux 也为用户提供了类似的程序，如 `gedit`、`NEdit`
    和 `geany`。所有这些程序都是免费的，且都提供相似的服务。此类程序带有语法高亮功能，可以方便地编辑源代码以及使用任何标记语言（如 CSS 或 HTML）的文档。


    - `NEdit`: 这是一个简单的文本编辑器，类似于 Notepad。它带有 Motif 风格的界面。

    - `Geany`: 它是一个 Linux 文本编辑器，类似于 Windows 的 Notepad++。它带有标签页形式的界面，用于处理多个打开的文件，并具有诸如在边距显示行号等其他功能。它使用
    GTK+ 工具包。

    - `Gedit`: 这是 GNOME 桌面环境默认的文本编辑器。它是可以在任何类型的 Linux 系统上轻松使用的最佳文本编辑器之一。


    ### 基于终端的文本编辑器


    当你从 Linux CLI 中工作时，你有广泛的文本编辑器可以选择。让我们来看看其中一些。


    - `pico`: 这个文本编辑器最初是作为构建在 `pine` 的基于文本的电子邮件程序中的编辑器的。这个文本编辑器后来作为一个独立的程序用于编辑和修改文本文件。该文本编辑器的现代版本被称为
    `alpine`。在基于 Linux 的系统上，你可以使用命令安装此文本编辑器：


    ```

    sudo apt-get install alpine-pico

    ```


    '
