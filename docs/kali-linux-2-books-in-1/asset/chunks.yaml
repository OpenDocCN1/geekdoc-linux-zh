    阅读级别选择将根据搜索返回的网页内容的多方面特质对结果进行分类。“未显示阅读级别”（no perusing level showed）将在不应用任何阅读级别通道的情况下执行搜索。“使用理解水平解释结果”（explain
    results with understanding level）将显示所有结果；索引列表中将显示每个页面的阅读级别。Google 的计算不像蓝思（Lexile）等其他评估水平理解工具那样逻辑或精细。然而，它将结果分为这三类（基础、中级和高级）非常有效。在引导渗透测试时，将结果集中在目标的阅读级别上，这非常有帮助。例如，可以将逻辑关联搜索限制在具有特定理解级别的页面上。尝试所有三个级别可能有助于查看不同的索引列表，并从基础理解级别的搜索中获取重要数据。


    ## Record Type（记录类型）

    记录类型可以是渗透分析师可以使用最重要的搜索类型之一。此设置包含特定记录类型的列表项，例如 Microsoft Word 文档的 `.doc` 和 `.docx`，Adobe
    归档的 `.pdf`。通常，客户端使用不同的记录类型存储各种类型的数据。常见的用户名、密码和其他类型的记录数据将存储在扩展名为 `.xls` 或 `.xlsx`
    的电子表中。下拉菜单提供了许多最广为人知的记录类型，可以使用 `filetype:` 运算符在基础 Google 搜索框中进行任何扩展，例如 `filetype:xls`。


    ## Utilization Rights（使用权限）

    使用权限根据版权和其他重用限制通过重用内容的能力限制查询项。通过选择“允许使用、共享或更改”（Allowed to utilize, share, or change），返回的结果将是带有规定如何重用限制的内容。例如，除非另有规定，否则内容不能被修改。“允许使用、提供或调整”将返回在许可范围内可以修改的页面列表项。结果将允许在无费用的情况下分发内容。选项中带有
    `business` 词的选项与不带 `business` 词的选项相似，但返回的结果可以用于商业。


    ## Aggregating an Advanced Google Search（聚合高级 Google 搜索）

    仅使用 Google 页面上的字段可以恢复一些值得的索引列表，但结合使用许多字段将提高渗透分析师发现重要数据的方式。例如，假设 Foo International（一家美国公司）在上个月与另一家机构合并，并提到了你小组的渗透测试。在这种过程中，创建了许多文件来帮助每个组织的人进行转变；可能某个代表在组织网站上展示了层次结构。一个潜在搜索可以使用以下字段和术语：


    ```

    authoritative graph

    `language: English`

    `district: United States`

    `last update: past month`

    `site: foo.com`

    `document type: pdf`

    ```

    然后，可以通过包含或排除搜索字段或更改选项来进一步精炼结果。例如，将记录类型更改为 PowerPoint（`.ppt`）或删除文档类型可能会恢复所需的结果。


    ## Google Hacking（Google 黑客攻击）

    Google Hacking 是一种由 Johnny Long 发起的方法，它在互联网搜索中使用特定的 Google 算符和术语，通过 Google 网络爬虫返回重要数据。


    该策略的核心在于使用专门针对特定表述在 Google 数据库中搜索有关个人和组织的数据。


    此过程利用之前描述的 Google 搜索并增强了其结果。


    Google Hacking 利用引导的操作符和关联选项创建可以在 Google 网络爬虫中运行的针对性问题。通常，这些目标是收集有关特定进展的信息（如董事会管理），其他搜索则针对客户认证。已经写了一些优秀的书籍完全解释了
    Google Hacking，最著名的是 Johnny Long 编写由 `Syngress` 出版的 `Google Hacking for Penetration
    Testers`。


    ### Google Hacking Database（Google 黑客数据库）

    大量的 Google Hacking 搜索字符串已汇入 Google Hacking 数据库（GHDB）。第一个数据库位于 `http://www.hackersforcharity.org/ghdb/`，Offensive
    Security 同时在 `http://www.offensive-security.com/network ventures/google-hacking-database/`
    也有一个 GHDB，它开发了第一个数据库，并产生了“Googledorks”这一——这是 Google 发现的笨拙或愚蠢者的称呼。编写期间，由 Offensive
    Security 维护的 GHDB 包含 3350 个 Google Hacks，分为 14 类。其中有 160 多条查询字符串可用于发现包含密码的文档。以下是这些查询字符串中尝试发现
    Cisco 密码的示例。


    ```

    power secret phrase j mystery "current arrangement" -intext:the

