    必须从卖家处购买的外部应用程序无法自由访问，且良好的来源可能无法找到下载和安装的包。Kali Linux 在不引入额外产品的情况下不具备处理 RPM（红帽软件包）的能力，且建议在基于
    Debian 的框架上使用 RPM。


    ## 介绍


    在下载 `.deb` 软件包后，应使用 `dpkg` 命令来引入该包。大多数 `.deb` 软件包都是自包含的，并且包含了程序有效运行所需的全部条件。在某些情况下，特别是对于管理授权程序，卖家可能要求在安装前需要额外的步骤，并通常会提供有关在该框架上正确安装的指南。在开始安装之前，务必检查卖者的文档：


    ```

    dpkg - I {package_name.deb}/{target_directory}

    ```


    ## 卸载


    卸载包（`- r`）或清理包（`- P`）的工作方式与 APT 基本相同，并遵循类似的处理包的范例：`dpkg - r {package_name.deb}`


    使用 Debian 软件包管理器清理包与卸载操作类似，可以通过以下命令启动：


    ```

    dpkg - p {package_name.deb}

    ```


    ## 检查已安装软件包


    APT 相比 Debian 软件包管理器的一个超能力是解析已安装或已卸载程序的当前状态。当使用 `dpkg` 的 `list` 命令时，输出将显示行头的几个字符代码，表明包的当前安装状态。当针对
    Leafpad 应用程序包运行时，附图显示该包已卸载，但配置文件仍然可用。


    在运行命令 `dpkg - P leafpad` 后，该包的设计文档也被卸载了。图 3.2 显示了 Leafpad 应用程序包从框架中完全清理后的对比输出。要搜索已安装或卸载程序的状态，请使用此结构：`dpkg
    - l {package_name}`


    通过以下命令可以在屏幕上逐点显示有关已安装包的详细数据：


    请注意大小写的使用。小写的 `"p"` 将数据打印到屏幕上。大写的 `"P"` 将在不询问“确定吗？”的情况下从框架中清理包。


    ## 第 4 章：Tar 包 (Tarball)


    Tar 起于 Unix 框架早期，其名称源于它的功能，最初用于将多个文档组合到磁带存档（TAR）。


    并不是每个人都需要将各种记录移动到磁带的能力。然而，他们可能需要 `tar` 应用程序的功能，即创建一个包含不同文档的容器文档。这使得文档传输更加简单。此外，这些文档可以使用
    `gunzip (gzip)` 压缩以减小它们的总体尺寸。来自外部或开源活动的某些包可以以 tar 包格式下载，并可以通过 `.tar` 记录扩展或用于压缩
    tar 包的 `.tar.gz` 来有效区分。


    在渗透测试期间，会捕获大量的过滤存档、屏幕截图、重写内容和客户文档。使用 Tar 包框架考虑了更简单的收集、传输和支付，一切都在此范围内。非常建议将所有渗透测试的记录在保护区域内保留
    5 年，或根据执行工作所在地法律时限规定的日期。客户可能还对维护要求有规定，这些规定应在渗透测试的责任范围（ROE）中说明。ROE 将将在公告部分进行探讨。如果一个组织或承包商的渗透测试非常频繁，文档数量可能会迅速堆积并很快就会变得失控。Tar
    包（特别是压缩后的）提供了一种控制方案，可以保持记录分离，并考虑了更简单的强化和管理。


    ## 创建 Tar 包


    创建一个 tar 包记录可以是简单或复杂的。请记住，`tar` 命令的首要功能旨在将记录发送到 TAR。对于 tar 包框架的现代用法，请查看 tar 包的手册页（`man
    tar`）。此本书仅包含 tar 包记录的基本格式；尽管如此，这些信息是有用的并且可以适用于任何基于 Linux 的平台。以下提供了用户可以创建一个示例 tar
    包所需的步骤概述。


    1. 为你的文档创建一个索引。在这种情况下，使用 `mkdir` 命令创建 `tar-demo1` 目录：`mkdir tar-demo1`

    2. 接下来在此索引中创建各种记录，这些记录可用于描述 tar 方向。在这种情况下，将使用正确的星号（`.`）创建一个内容为“Hi world.”的记录。此文档将命名为
    record1，可以通过更改最后一个数字以类似的方式创建多个记录。按此类创建记录也将把你的文档移动到指定的注册表中，在此情况下为 `tar-demo1`：`echo
    "Hi World". tar-demo1/file1 echo "Hi World". tar-demo1/record 2`

    3. 进入你想要创建 tar 包的目录。在本例中，它是 `tar-demo1` 索引：

    ```

    cd tar-demo1

    ```

    4. 使用包含当前目录内的文档创建另一个 tar 包。

    在此模型中，使用引用符号（`*`）表示此索引中的所有内容都应添加到 tar 文档中：

    ```

    tar - cf tarball-demo.tar *

    ```

    5. 使用 `tar - tf` 命令列出 tar 包的内容：

    ```

    tar - tf tarball-demo.tar

    ```


    ## 从 Tar 包提取文件


    从 tar 包中移除记录的步骤只需一、二、三；然而，数据放置的位置是关键。从 tar 包中提取的文档被设置在工作目录中。如果 tar 包是从根索引提取的，那就是文档将存放的地方。建议尽早建立结构；因此，所有
