    被用于其开发时的目的。它的设计初目的是通过网络以一种更安全、更可靠的方式与业务网络连接。


    它进入市场的目标还包括让用户能够仅从家里就能访问他们的业务网络。这种技术通过转发网络内所有形式的流量来运行，提供了许多益处，例如远程访问本地网络资源、绕过某些地区对网络任何形式的审查等。如今在市场上找到的许多操作系统也预装了
    `VPN`。


    ## 使用 VPN 的益处


    `VPN` 的原理非常简单明了。它通过互联网将用户直接连接到其他某些计算机系统或服务器来工作。然后，它允许用户通过绕过并使用该服务器或计算机的互联网连接来浏览互联网上的可用内容。因此，让
    `VPN` 变得更有趣的地方在于，如果你连接到了另一个省份或国家的计算机，它将显示你也来自同一个国家。因此，你现在就可以通过 `VPN` 访问任何内容，以及那些你通常情况下无法访问的内容。


    你可以将 `VPN` 用于广泛的用途：


    ● 你可以使用 `VPN` 来绕过任何基于省份或地理位置的任何网站限制。你还可以使用 `VPN` 进行音频和视频流媒体。

    ● 你可以观看任何形式的在线流，如 `Netflix`、`Hulu` 等。

    ● 你可以在下载种子文件（torrent）时保护自己免受雷达的监控。

    ● 你可以保护自己不连接到任何类型的有害 `Wi-Fi` 热点。

    ● 通过简单的隐藏你系统的实际位置，你可以在上网时获得更多的隐私。


    大多数 `VPN` 用户使用这种技术来绕过地理位置限制，通过使用某些其他省份的网络来访问被限制的内容。它还被用于通过种子文件（torrent）访问和下载内容。然而，在访问任何形式的公共
    `Wi-Fi`（如火车站或咖啡馆提供的网络）时，`VPNs` 确实非常有帮助。


    ## 如何获取 VPN？


    你需要的 `VPN` 完全取决于你的用途和需求。你可以从为自己或在家里创建一个 `VPN` 服务器开始。如果你想从公司里创建一个 `VPN`，你也可以这样做。在现实世界中，人们寻找
    `VPN` 是为了访问在各个国家和地区被禁止的限制内容，如种子文件。如果你只是想要一个 `VPN` 来浏览受限形式的内容，你可以根据自己的需求从互联网下载一个。


    ## VPN 是如何工作的？


    当你开始将任何设备（如平板电脑、智能手机、笔记本电脑或台式电脑）连接到 `VPN` 时，你的设备系统将表现得就像与 `VPN` 服务器来自同一个本地网络一样。一组网络流量将通过安全连接的形式直接传递给
    `VPN`。由于你的系统表现就像它也来自服务器类似的网络，因此当你从世界的其他部分访问它时，它将允许你以高度安全的方式访问该同一本地网络的所有资源。你也可以像你正处于
    `VPN` 的精确所在地一样浏览互联网，如果你在使用任何公共 `Wi-Fi` 或你想访问任何类型的地理限制性网站，这将带有一些额外形式的权限。


    当你通过连接到虚拟专用网络（VPN）并开始浏览互联网时，你的设备将联系 `VPN` 网络，且其本质上是绝对安全且加密的。`VPNs` 通过转发用户请求来提供帮助，然后通过安全连接带回网站的响应。例如，如果你使用来自英国的
    `VPN` 访问 `Netflix` 内容，`Netflix` 将看到你的连接仅来自英国的任何州。


    你也可以可以在移动时访问任何业务网络。当你移动时，本地网络资源完全不会暴露，它通过改进网络安全来提供帮助。


    ## 第 10 章：无线网络简介


    当我们谈论网络时，一个最热门的话题是无线网络。它允许人们在没有电缆或电线的情况下连接互联网。这一切由于无线网络才成为可能。在无线网络中，所有设备通过无线电波与交换机或路由器连接。因此，它可以被视为一种移动形式的网络。无线网络具有一些非常有趣的特性，将在本章中进一步讨论。那么，让我们从无线网络开始。


    ## 使用 Kali Linux 进行黑客攻击和渗透测试


    每个组织和公司都有某些弱点，这些弱点可能是恶意的。为了防止所有黑客进入你的系统，你唯一的方法就是定期检查基础设施的安全性。你还需要确保基础设施中不存在任何形式的漏洞。为了实现这些功能，渗透测试是最终可以帮助你的东西。它帮助你检测系统中的漏洞，并将这些信息发送给组织管理员进行修复。


    ### 关于渗透测试的细节


    渗透测试是一种用于测试系统以确定第三方是否可以渗透系统的方法。道德黑客攻击与渗透测试经常被混淆，因为它们具有非常相似的目的，且功能上也大同小异。在渗透测试中，测试人员扫描系统寻找任何形式的系统漏洞、缺陷、风险和恶意内容。

