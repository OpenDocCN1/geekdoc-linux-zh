    介绍操作系统（例如微软的 Windows、苹果的 OS X 或如 `Debian` 和 `Ubuntu` 等开源平台）可能对某些人来说很自然，但有必要对这一过程进行更新。那些从未介绍过操作系统系统的人不必担心，本节的后续部分将解释如何查找、下载和介绍
    `Kali Linux`。


    `Kali Linux` 在许多方面都非常出色。然而，该发行版最重要的特性是能够从硬盘安装后运行，也可以作为现场光盘启动，以及默认包含的特定应用程序的数量和种类。现场光盘是安装在包含光盘（CD）、数字视频光盘（DVD）或蓝光光盘的介质上的操作系统。作为渗透分析师，启动现场光盘的能力非常重要。


