    到目前为止，我们讨论了 shell 和脚本。但是，`BASH` 呢？正如我们之前讨论过的，`BASH` 是许多 Linux 或基于 GNU 系统的默认解释器形式。这就是为什么我们的上一个
    shell 脚本即使在没有定义 `bash` 为最终解释器的情况下也能运行的原因。


    你可以执行此命令来查找默认解释器是什么：


    ```bash

    $ echo $SHELL

    ```


    ```

    /bin/bash

    ```


    你也可以找到其他几种 shell 解释器，如 C shell、Korn shell 以及其他各种。要将脚本解释器定义为 `BASH`，你首先需要使用 `which`
    命令找到其可执行二进制文件的完整路径。该命令需要以 shebang 或 `# !` 为前缀。你需要将其插入到脚本的第一行。虽然还有其他定义 shell 解释器的方法，但这被认为是最佳选择。


    ## 文件权限与命名


    为了执行 shell 脚本，你需要使用命令 `chmod +x FILENAME` 使你的文件处于可执行状态。无论文件扩展名的后缀是什么，新创建的任何形式的文件默认都不是可执行形式。在基于
    Linux 或 GNU 的系统上，使用 `file` 命令来识别文件类型。


    ## 脚本执行


    简单来说，bash 脚本无非一个简单的文本文件，其中包含了需要从上到下按顺序执行的指令。指令的解释方式取决于定义的 shebang 或执行脚本的过程。


    还有另一种执行 bash 脚本的方法，即按显式顺序调用 bash 解释器，例如通过 `$ bash date.sh`。通过显式地调用可执行二进制文件，`date.sh`
    的文件内容被加载并被解释为 bash shell 脚本。


    ## 简单备份 Shell 脚本


    可以通过 bash shell 终端成功执行的任何命令都可以以与 bash 脚本部分相似的形式存在。通过终端直接执行命令与在 shell 脚本中执行命令之间没有本质区别，区别在于
    shell 脚本为单个进程中的各种命令提供了非交互形式的执行方式。大多数命令都接受参数和选项。命令选项用于修改命令的行为，以产生另一种形式的输出结果，这些结果以
    `-` 开头。参数可以指定针对目标（如目录、文件、文本等）的命令执行。


    你可以使用 `man` 命令显示任何所需命令的手页。例如，为了显示 `ls` 命令的手页，你可以执行命令 `man ls`。退出手页可以按 `q` 键。


    ## 变量


    变量可以被视为编程的核心本质。它允许程序员存储数据、并在整个脚本中重用并修改相同数据。你可以使用变量创建一个全新的脚本，如 `welcome.sh`。


    ## 输入与输出


    在 Linux/GNU 命令行上执行的命令要么需要输入、产生输出或显示错误消息。这是 shell 脚本的基本概念，泛指与 Linux 或 GNU 命令行操作。每当你执行一个命令时，会有三种可能的结果：第一种可能是产生输出，第二种可能是生成错误，第三种可能性可能不会产生任何形式的输出。


    # 第 7 章：网络基础


    在如今这个万物皆有科技的世界，网络已成为建立新业务或组织的强制性组件。网络有助于通过各种形式与终端（或者说是主机或主系统）一组相关设备或系统进行无缝连接。它对于全球所有服务提供者、企业和消费者同时通信和互连具有至重要的地位。


    网络概念伴随着几乎所有的事物出现，如短信、电话通话、视频流等。


    网络的操作涉及一系列严肃的技能，这在很大程度上取决于其复杂性。例如，在一个大型企业中，有多个节点，并且对网络安全有要求，如管理员功能、加密及其他等。另一方面，任何在家中结合网络和互联网进行日常工作的人，都可以轻松设置，并解决无线网络本质的若干基础性问题。


    ## 网络基础


    为了正确理解网络的功能及其组件，你需要了解一些基础知识。计算机系统网络由几个元素组成，这些元素有助于整体的运行。


    ## 网络类型


    计算机网络可以分为两大类：有线和无线。在谈到有线网络时，它需要一种物理形式的网络，用于在两个节点之间传输信息。对于办公场所和家庭的数字通信，由于其整体的成本效益和耐用性，使用了以太网线。今天，光纤也被用于跨越距离的数据传输。


    光纤提供的速度比以太网线更快。然而，与光纤相比，以太网线要便宜得多。


    在无线形式的网络中，利用电波通过空气进行数据传输。在这种情况下，设备之间无需任何种电缆即可连接。无线局域网（Wireless LAN）被广泛用于无线网络领域。今天可以找到各种替代方案，如蓝牙、卫星、蜂窝网络、微波等。


    经过各种实践经验发现，与无线网络模式相比，有线网络形式具有更好的速度、安全性和可靠性。但是，无线网络比有线网络具有更大的扩展性、移动性和灵活性。两种类型的网络都根据网络的物理层进行分类。也可以根据网络的构建和设计结构、网络覆盖以及涵盖
    SDN（软件定义网络）的方法进行区分。网络还可以根据规模、广域网、局域网、存储区域网、环境及其他等方面进行分类。


    ## 网络系统及其类型


    当你遇到网络系统时，你会发现两种类型：开放和闭合。在开放系统中，整个系统与网络保持连接，随时准备任何类型的通信。在闭合系统中，系统与网络断开，你无法与网络连接。


    ## 网络组件


    网络系统需要适当物理网络的基础设施。它由几个网络组件组成，如交换机、路由器、访问点以及一些基础形式的固件，固件最终有助于其他连接组件的运行。

