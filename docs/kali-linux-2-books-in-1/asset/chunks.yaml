    为了验证 GCC 编译器是否已正确安装在系统中，请使用：


    ```bash

    rpm –qa | grep –i c++

    ```


    你也可以使用 `which` 命令：


    ```bash

    which c++

    ```


    # 在 Linux 上编写第一个 C++ 程序


    - 从终端窗口开始，使用 `vim` 命令打开一个新文件进行编辑：


    ```bash

    vim hello.cc

    ```

    - 在 `vim` 编辑器中，你现在可以输入你的 C++ 程序或代码了。

    - 完成后，保存并退出文件。

    - 若要编译新的 C++ 程序，你需要在终端中输入此命令：


    ```bash

    c++ hello.cc

    ```


    如果编译过程运行过程中没有任何错误，屏幕上将不会打印任何形式的输出。


    - 当前目录下将创建一个可执行文件，默认名为 `a.out`。

    - 若要运行该程序，你可以像执行 Linux 中任何可执行文件一样，执行生成的这个执行文件。


    ## 如何指定生成的可执行文件的名称？


    在不指定任何特定选项的情况下编译 C++ 程序，将生成一个名为 `a.out` 的可执行文件。如果你想为你选择的可执行文件指定特定名称，有两种方法：第一，是在创建后重命名默认的
    `a.out`；第二是在编译时使用 `-o` 选项指定可执行文件的文件名。


    ```bash

    c++ hello.cc –o /opt/hello.run

    ```


    ## 在 C++ 程序中执行系统命令


    在需要时通过执行操作系统的命令来与编译系统进行通信是非常重要的。`system()` 函数允许你从 C++ 代码中运行系统命令。为了让编译器能够正确识别所有这些函数并以正确的方式进行编译，需要调用
    `stdlib.h` 库文件。


    ## 核心总结


    - 在 Linux 机器上编写 C 或 C++ 程序，你需要 `GCC` 编译器。

    - 所有的 C++ 程序都保存并写为 `.cc` 格式的文件。

    - 所有生成的可执行文件都可以以类似于执行 Linux 或 Unix 可执行文件的方式进行运行。

    - `system` 函数用于从 C++ 代码中运行系统命令。

    - `g++` 和 `c++` 命令都对 C++ 源文件进行编译和链接。


    # 在 Linux 中使用 Python 编程


    Python 是现代编程语言之一，在开发社区中受到了大量关注。它由 Guido von Rossum 于 1990 年开发。它类似于 Java，程序一旦编写，就可以轻松地运行在任何类型的操作系统上。如果你是第一次在
    Linux 中开始编程，Python 是你入门的绝佳选择。它具有较低的学习曲线，并有一套优雅的编码系统。


    ## 安装 Python


    像 Ubuntu 等基于 Linux 的发行版预装了命令行版本，这使得开始 Python 之旅变得非常简单快捷。事实上，Linux 社区的许多人开发了许多
    Python 脚本和工具集。


    你可以通过图形化交互式开发环境、IDLE 或命令行版本开始这一过程。


    ## 从命令行编写 Python


    打开你的终端窗口，然后输入引号内的 `''python''`。这将在交互模式下打开 Python。这种模式对于初始阶段的学习非常有帮助，但你可能想使用 `Vim`、`Gedit`
    或 `Emacs` 等文本编辑器来编写代码。只要你以 `.py` 扩展保存代码，就可以在终端窗口中执行它们。大多数编程都从那个非常老的老兵开始：Hello
    Universe 或 World 程序。因此，我们也从这里开始。


    在命令提示符处，输入 `print "Hello Universe"` 然后按回车。你可以很容易地看到命令在命令旁边被打印出来。从命令行运行脚本只需输入：`python
    my_script.py`。如果你想退出命令行，输入 `exit()` 或直接按 `Ctrl+d`。


    ## 使用 IDLE 编写 Python


    如果你考虑直接从命令行编写一个长程序，可以从 IDLE 开始。只需打开终端窗口并输入：`idle''`。你现在会看到 Python 的图形 shell 已加载。若要编写
    Python 脚本，只需点击 File（文件）然后 New Window（新建窗口）。


    这将打开一个类似于记事本的文本编辑器。然后，你只需要输入这段代码：


    ```python

    #linuxversion.py

    # 获取用户输入版本并响应

    name= raw_input("Which release of Linux do you see")

    print "Even I like", name, " – Linux is great!"

    ```


    这条命令中发生了各种事情。前两个带有 `#` 符号的行仅仅是注释。第三行将使用从 `raw_input` 函数收集的输入，然后将其赋值给变量 `name`。


    最后，`print` 语句将返回结果。你可以将文件保存为 `.py` 扩展，然后从可用菜单选择 Run（运行）后的 Run Module（运行模块）来运行你的程序。


    注意，许多编程语言通常会忽略任何空白字符（即代码之间的间距）。但在 Python 中，如果出现任何形式的不当间距，可能会导致语法错误。因此，请确保正确输入空格以以便正常运行代码。


    ## Python 编程


    人们常说系统管理员需要非常精通脚本语言。


    虽然大多数人非常习惯使用 `BASH` 来运行脚本，但用 Python 替代它实际上可以增加许多优势。Python 允许用户访问所有命令行工具，并利用了面向对象的编程结构。大多数
    Linux 发行版中都可以找到 `2.x` 和 `3.x` 版本的 Python。要进入 Python shell，只需在你的终端模拟器中输入 `python3`
    或 `python`。退出 shell 只输入 `quit()`。


    需要注意的是，虽然 Python 的 `2.x` 版本今天仍在使用，但它已不再被积极维护。出于这个原因，最好切换到 `3.x`。两个版本的 Python 在语法上存在某些差异。


    你可以在 Python 中执行各种算术运算以及对文本字符串进行操作。如果你需要，甚至可以将操作结果赋值给变量，然后在屏幕上显示。Python 提供的一个非常实用的功能是拼接：你只需要为打印函数提供一个由逗号分隔的变量或字符串值列表，它将返回由列表项按顺序组成的完整句子。你还可以混合不同类型的变量，并且在给任何变量分配了一个特定值后，你可以在后续阶段更改数据类型而不会出现任何问题。


    你可以在 Python 中轻松创建列表。列表无非是一个有序的项目集合，且不要求具有相同的数据类型。要创建一个名为 `bandsRock` 的空列表，你需要使用方括号配合命令如下：


    ```python

    bandsRock=[]

    ```


