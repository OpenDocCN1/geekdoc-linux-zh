    \ Shell 脚本（Shell Scripts）。Shell 脚本的结构与 MS-DOS 中的批处理文件相似。每个 Shell 脚本都以 `.sh` 文件扩展名保存，例如\
    \ `yourscript.sh`。\n\nShell 脚本拥有与其他所有编程语言类似的语法。如果你已经熟悉 `C`、`C++` 或 `Python` 等任何编程语言，那么开始\
