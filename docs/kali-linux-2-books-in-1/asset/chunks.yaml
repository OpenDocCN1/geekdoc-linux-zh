    # 启动 Kali

    使用启动了 Kali Linux 启动盘的 PC 启动将显示一个类似于图的屏幕。本指南所使用的 Kali Linux 版本为 1.0.5 64-Bit；在不同时期下载的版本可能略有不同；尽管如此，其图形化安装程序在本质上是非常相似的。每个新版本的
    Kali Linux 都有相应的更新版指南可以在 [`www.kali.org/`](http://www.kali.org/) 找到，强烈建议在安装前或有疑问时访问该网站获取适用于您版本的最新文档。


    Kali Linux 以“备用光盘”（也称为 Live ISO）的形式发行，这意味着可以直接从光盘运行操作系统，而无需安装到硬盘上。从备用启动盘运行 Kali
    可以确保框架正常运行且所有工具都将可用；然而，所显示的操作系统是非持久性的（non-determined）。非持久性意味着一旦关闭 PC，任何内存中的数据、保存的设置、文件以及可能重要的工作或研究都可能会丢失。在非持久性状态下运行
    Kali 需要极大的关注、熟练的操作以及对 Linux 指令和操作系统的良好理解。这种技术最适合在不删除 PC 硬盘上已安装的当前操作系统的情况下学习 Linux
    操作系统。


    另一个不在本书范围内的安装是“带语音合成的安装”。这是 Kali 和 Debian 框架的一个新功能。如果你有支持语音合成的设备，可以通过语音控制安装。本本将重点介绍当前的图形化安装；为此，请选择图形化安装并按
    Enter 键。


    ## 安装—设置默认值


    以下屏幕将允许选择系统的默认语言、区域和控制台语言。选择合适的设置并继续运行安装程序。当 PC 开始预配置 Kali Linux 安装时，整个安装过程中屏幕上会出现不同的进度条。对于大多数屏幕，选择默认设置是合适的。


    ## 安装—初始网络设置


    图中显示了基本系统网卡的底层配置和基本设置。通过在框中输入选择主机名并点击 Continue（继续）。主机名应该是唯一的，因为在相同的系统上，具有相同主机名的
    PC 可能会导致系统管理冲突。


    在选择主机名并点击 Continue 按钮后，下一个屏幕将请求 PC 的完全限定域名（FQDN）。这对于加入空间环境非常重要，但对于大多数实验室环境来说有些过度。在本指南中，FQDN
    被特意留空，可以通过点击 Continue 按钮来跳过。


    ### 密码


    向导中的下一个提示将请求一个 root 级别的秘密短语。默认密码是：`toor`；在任何情况下，必须选择另一个包含以下每一项的密钥：大写字母、小写字母、数字和符号。密码对用户来说应该是不可识别的且不能被轻易破解。建议密码至少为
    10 个字符。例如，如果用户曾经踢过中学足球，则不建议像 `soccer22` 这样的密码。可以使用各种基本表达式生成密码进行检查。以下是几个强密码的示例：


    - `St0n(3)b@tt73` “Stone Battle”

    - `P@p3r0kCur5#` “Paper, Rock, Curse”

    - `m!gh7yP@jjjama% h` “Forceful Pajamas”


    在输入您的秘密短语时，它将以圆点的形式显示。这是典型操作，可以防止您的密码显示在 PC 屏幕上。在输入两次相同的强密码后，点击 Continue 继续进入程序。


    设置系统时钟会显示选择时区的提示。点击合适的时区和 Continue 按钮。


    ## 分区磁盘


    在设置 Linux 操作系统时，分区的方法非常多，甚至可以就此主题写一本书。本指南将关注最核心的安装：引导分区。


    几张图片显示了最初显示的默认设置。在特定的图形之前将没有可选内容。现在，可以通过点击 Proceed（继续）加速安装，直到分区完成。检查安装向导的每个步骤是明智的。


    几张图片显示了安装过程中划分硬盘的各种选择。不建议工作站、优盘或 SD 卡使用 `LVM`（逻辑卷管理）。`LVM` 用于多个硬盘，专门建议用于高级用户。应选择“Guided—user
    entire disk”。点击 Continue 继续安装过程。图中显示了已选择安装的硬盘。


    根据您的设备和 Kali Linux 版本，安装体验可能会有所不同。将选择安装的硬盘；如果需要，点击 Continue 按钮继续安装过程。由于本书是为 Kali
    Linux 发行版的新用户设计的：“所有文件在一个分区中（建议新用户使用）”是最佳选项并应选择。点击 Continue 按钮继续安装过程。


    在向导的此时，分区方案已完成并显示出来供您审阅。一个包含整个框架、用户和脚本文件的关键分区将作为一个分区创建。随后将创建一个交换空间（swap space）。交换区是虚拟系统内存，在
    PC 的中央处理器（`CPU`）和随机存储器（`RAM`）之间交换文件。所有 Linux 系统都建议设置交换区，通常做法是将交换区设置为 PC 上安装的物理
    RAM 大小或其一点半倍。如图所示，将为您选择“完成分区并把更改写入磁盘”。点击 Continue 继续安装过程。某幅图是提交硬盘布局前的最后一种可能检查。如果需要，以后可以更改分区估值，但如果操作不当可能会对您的操作系统造成巨大损坏。向导中的此提示提醒您，您将把新定义的分区表信息写入预定义的硬盘。选择
    `YES` 并点击 Continue 继续安装过程。


    在点击向导分区区域最后一个提示的 Continue 后，硬盘分区将开始。图中显示正在进行实际安装。根据您所拥有的设备，此过程可能需要几分钟到一小时或更多。


    ## 配置包管理器


    包管理器是操作系统安装的重要组成部分。包管理器指的是 Kali Linux 获取更新和安全补丁的仓库。建议使用随 Kali Linux ISO 附的系统镜像，因为这是包管理器最新的更新源。图中显示将选择
    `YES`。点击 Continue 继续安装过程。


    如果使用代理，请在向导的下一个提示中适当位置输入配置数据或留空。点击 Continue。


    ## 引入 GRUB 加载程序


