    拥有系统邻近机器访问权限的用户可以使用现场系统（live circles）来利用这些机器，无论入口分析器对所引入的工作框架是否有记录。该框架将引导到现场盘而非邻近硬盘；也就是说，如果机器安排得当，渗透分析器此时将接近邻近系统上的大量资产，同时不会在邻近机器的硬盘上留下证据。在
    `Kali Linux` 中引入的产品对于入口分析器来说功能极其强大。当然，`Kali Linux` 提供了 400 渗透测试和安全工具、软件包和应用程序，并可以根据需要包含更多。


    # 框架信息


    每个工作框架由于其底层建立和配置会有细微差异；尽管如此，大多数基于 Linux/Unix 的平台本质上是相似的。在引入 `Kali Linux` 时，与其他
    Linux 工作框架一样，安装前的配置至关重要。以下是引入 `Kali Linux` 时一些要点的要概述。


    - 工作框架将运行在 PC 还是工作站上？

    - 需要多大的硬盘？

    - 可用的硬盘是否有足够的可用空间？

    - 需要多少硬盘分区？

    - 执行日志是一个考虑的问题吗？

    - 安全是一个考虑的问题吗？


    ## 选择安装的硬件平台


    通常情况下，工作框架安装在 PC 的硬盘上。对于工作框架，例如 `Kali Linux`，由于持续的可用性和大容量设备的合理性，能够将工作框架安装到优存盘（也称为闪存驱动）和
    SD 卡中。无论使用什么引入工作框架的容量，决定将其安装在独立的 PC（例如实验室 PC）上或一个将考虑灵活配置的 PC 上都是重要的。


    如果将使用某些设备（如强大的显卡）来破解密码，建议在个人计算机上安装 `Kali Linux`。如果需要将工作框架从一个客户站点传输到另一个站点，或者希望测试远程设备，则建议使用
    PC。工作框架的建立对于 PC 和个人计算机是等同的。


    ## 硬盘选择


    不夸张，但“大小确实会产生影响”。通用指南是：硬盘越大越好。本书建议使用至少有 120 GB 空间的硬盘。即使是这也很快就会满，特别是考虑到密码破解、取证调查或需要大量控制、证据、日志和报告存储或分类的渗透测试项目。由于一般的商业和政府安全评估需要，工作框架会被清理、删除或完全移除，以保持设置处于基准状态。这种做法在安全网络中被认可，因为需要对客户信息进行合法处理，并限制可能损害组织声誉的企业数据泄露。


    ### 分配硬盘


    分区是通过设置特定的分区大小和划分将文件系统隔离到硬盘特定部分的演示。分区可以防止工作框架被接管框架的日志文件破坏，并在特定情况下提供更高的安全性。工作框架在根本上被有效地分为两个不同的部分。


    主分区是交换区域（swap area），用于内存分页和容量。后续分区分配给其他所有内容，并采用文件结构，例如扩展文件系统 3 (`ext3`) 或扩展文件系统
    4 (`ext4`)。在 PC 上，特别是那些工作框架会被多次加载的设备，进一步划分并不重要。对于修改过的环境或将拥有日益稳定的工作框架的 PC，有必要至少分离临时
    (`tmp`) 文件。


    硬盘驱动分区和 PC 双系统不在本书的范围内，将不予提供。主要的例外是附录 A，其中介绍了使用名为 `Tribal Chicken` 的第三方应用程序进行的重新循环。


    ## 安装期间的安全


    `Kali Linux` 是一个功能极其强大的工作框架，拥有许多预装设备，可以破坏 PC 或配置基础架构。当被不当或不诚实使用时，它还会导致被视为犯罪或违法的行为。因此，密码是基本的。虽然密码是最基本的安全实践，但许多管理员和安全专家经常忽视或忽略密码的使用。基本的安全实践，例如合法地使用密码，对于确保你的
    `Kali Linux` 安装不被其他人员可能偶然或恶意地对个人、PC 或系统造成损害至关重要。


    ## 下载 Kali


    `Kali Linux` 是 Linux 的一种分发，以 ISO（读作：eye-so）记录格式下载。它应该从另一台 PC 下载，然后在安装之前刻录到光。在编写本书时，可以从
    `http://www.kali.org/downloads/` 下载 `Kali Linux`。


    任务、设计和特殊用例文档也可以在 Kali 的官方网站 `http://www.kali.org/official-documentation/` 上找到。还有一个庞大且动态的网络，用户可以在那里提问并帮助他人解决困难。建议注册该站点以访问由
    `Hostile Security`（`Kali Linux` 的开发者）管理的论坛。`Hostile Security` 还会发送有关更新和网络数据的消息。


    确保选择正确的版本（`i386` 5 32 位，`amd64` 5 64 位）。受信任的 `Kali Linux` 镜像不在本书范围内。如果你想熟悉 `Kali`，或者需要一个为了更多控制的沙箱，那么
    `VMware` 下载对于这些情况是理想的。点击合适的下载链接继续你的选择。


    对于 Microsoft Windows 7 用户，双击完成后的下载将显示 `Burn ISO Wizard`。按照提示完成从 ISO 镜像到可安装的 DVD
    的转换。Linux 用户应使用适当的光盘消耗程序打开 ISO，例如 `K3b`。


    # 第 2 章：硬盘安装


    接下来的章节将提供一个旨在简单操作的文字和图形化安装指南。为了在框架的硬盘上成功引入 `Kali`，甚至引导到现场系统，将基本输入输出系统 (`BIOS`)
    设置为从光盘启动非常重要。要开始安装，将 CD 放入 PC 的 CD 槽并引导 PC 从光盘启动。支持虚拟化技术的客户端（例如 `VMware''s Player`
    或 `Oracle''s Virtual box`）也会发现本指南直接并支持创建 `Kali Linux` 的虚拟化版本。


