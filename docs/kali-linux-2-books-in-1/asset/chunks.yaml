    当勾选“自然关联”复选框时，框架将在 PC 启动且没有客户端协调的情况下尝试与远程系统建立接口。像之前描述的 `DHCP` 一样，这对大多数 Linux 客户端可能有所帮助。然而，对于渗透分析器来说，这通常不是最佳选择，因为它可能会暴露分析器在系统中的位置。如果没有选择该复选框，分析器将物理地启用远程连接器。


    ## 远程标签页集标识符


    管理集标识符 (`SSID`）是用于区分远程系统的系统名称。每个系统将有一个唯一的 `SSID` 来区分该系统，客户将使用此名称与系统进行关联。在具有核心通道的系统中，`SSID`
    由通道决定，且所有客户必须使用该 `SSID` 与系统建立接口。在具有多个通道的系统中，`SSID` 必须在每个通道上相同以启用通信。


    ## 模式


    远程卡可以设计为两种模式：即时或基础模式。即时系统通常是指在没有核心通道执行管理功能的情况下 PC 之间的普通远程关联。


    在这些关联中，每个远程关联都必须经过安排以协调彼此 PC 的远程设置从而建立关联。在基础模式下，核心通道处理与关联系统的客户以及管理集中的不同 PC 关联。所有客户都必须设计为协调通道中描述的设置。这两种选择之间的根本区别在于，在指定的系统管理中没有核心组织，而通道在框架模式下负责监督管理关联。


    ## 基础服务集标识符


    基础服务集标识符 (`BSSID`) 用于框架模式以识别通道的介质控制 (`MAC`) 地址。与 `SSID` 不同，每个通道将有一个特殊的 `BSSID`，因为每个通道都应该有一个独立的
    `MAC` 地址。


    ## 设备 MAC 地址


    设备 `MAC` 地址字段用于将此配置绑定到物理远程连接器上。当 PC 拥有多个远程连接器时，这非常有利。该字段的下拉菜单将填充有远程动态连接器的 `MAC`
    位置。请为您正在设计的连接器选择正确的 `MAC` 地址。


    ## 克隆 MAC 地址


    通常，入口分析器并不希望使用 PC 上所使用的连接器的真实 `MAC` 地址。这可能是为了规避简单的安全策略，例如 `MAC` 地址过滤，即仅允许具有特定
    `MAC` 地址的框架与系统关联。这同样可以伪装您的远程连接器，使其在表面上来自另一个制造商，以匹配远程系统上使用的那些远程卡。


    ## 最大传输单元


    最大传输单元 (`MTU`) 是一种系统管理设置，用于决定与 PC 通信的系统包的大小。很多时候，`MTU` 可以设置为程序且运行良好。在应用程序需要特定
    `MTU` 的情况下，请阅读该应用程序的文档以决定 `MTU` 并在此处设置。


    ## 远程安全标签安全下拉菜单


    `Security` 下拉区域用于选择验证远程系统的策略。对于指定的系统，由系统客户决定正确的安全设置，确保每个客户的安全设置与系统中的其他 PC 协调。在框架模式下，每个客户都必须设计为协调通道的安全设置。


    ### 有线等效隐私


    有线等效隐私 (`WEP`) 是一种较旧的安全技术，利用基本的加密技术提供与有线框架相同的安全性。`WEP` 使用 10 或 26 位十六进制密钥来验证通信。`WEP`
    加密标准存在安全漏洞，允许渗透分析器有效破解大多数 `WEP` 加密密钥。动态 `WEP` 利用 `IEEE 802.1x` 中说明的端口安全措施为远程系统提供额外的安全性。


    ### 轻量级扩展认证协议


    轻量级扩展认证协议 (`LEAP`) 由 Cisco 系统创建，旨在比不安全的 `WEP` 策略提供更高的安全性。Jump 类似于动态 `WEP`。


    ### Wi-Fi 保护访问


    Wi-Fi 保护访问 (`WPA`) 是一种创新技术，通过临时性密钥完整性协议 (`TKIP`) 和可靠性检查提高远程系统的安全性。使用 `WPA` 的系统比受
    `WEP` 保护的远程系统更能抵抗攻击。基础的 `WPA` 标准随着 `WPA2` 的出现通过使用更先进的加密技术得到了升级。在 `WPA` 个人模式下，每个
    PC 都使用由单词或密码生成的密钥进行设计。`WPA` 任务需要核心的远程认证拨入用户服务 (`RADIUS`) 服务器和 `802.1x` 端口安全措施。虽然
    `WPA` 任务设置起来复杂，但它提供了额外的安全性。


    ## 密码和密钥


    如果从下拉菜单中选择 `WEP` 或 `WPA` 个人作为安全技术，请在密码/密钥字段中输入安全密钥。勾选 `Show secret word/key` 复选框以确认所使用的密钥已正确编写。在不需要显示密码的情况下，请留空勾选复选框。某些系统使用转换密码或密钥的策略。如果是，通过选择正确的列表为每个列表输入密码或密钥，然后为该文件输入正确的密钥或密码。


    系统可能有开放式框架或共享密钥验证。在共享密钥验证中，通道向尝试关联的 PC 发送一个测试时消息。关联的 PC 随后使用 `WEP` 密钥加密内容并将编码内容返回给通道。


    此时，如果接口 PC 使用的加密密钥提供了加密字符串，通道将允许关联。开放式框架验证则允许 PC 在没有这种测试和响应机制的情况下关联，取决于 PC 使用了正确的
    `SSID`。在这两种，当使用 `WEP` 密钥验证通道时，通信通道即完成。虽然共享密钥验证看起来更安全，但实际上并不安全，因为测试消息和编码内容响应是以明文发送的，允许任何监控远程通道的人捕获测试和响应。由于
    `WEP` 密钥被用于加密测试，捕获测试和响应可以导致 `WEP` 密钥被破解。


    Jump 安全使用客户端名称和密码。选择 `LEAP` 时，应将这些输入相应的字段中。


    动态 `WEP` 和 `WPA` 任务需要不同的设置、授权和设计来管理。这些设置在此不再涵盖；但如果您正在加入一个使用这些技术作为安全的系统，请输入正确的细节并提供正确的授权。


    ## IPv4 设置标签页


    当 `Wireless` 和 `Wireless Security` 标签中的数据填写完成后，即可完成 `IPv4` 配置。设计这些设置的过程与之前描述配置物理以太网关联的过程相同。


    当所有必要数据输入后，点击 `Save` 按钮保存设置。设置保存后，PC 将尝试与系统建立接口。这通过屏幕右上角的真实状态来体现。任何错误将在对话框中显示。


