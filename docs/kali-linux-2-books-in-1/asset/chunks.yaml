    - `nano`: This can be regarded as the GNU version of the text editor `pico` and
    can be taken as the similar program under a completely different name. You can
    install `nano` on any Linux based system by using the command: `sudo apt-get install
    nano`.

    - `vim`: This stands for ‘vi improved’ and it functions as a text editor which
    is also used by the majority of computer professionals. The controls of this text
    editor might feel a bit confusing the first time. As you become familiar with
    it, it can make the execution of the most complex editing tasks very fast and
    easy. If you want to install `vim` on any system which is based on Linux use the
    command: `sudo apt-get install vim`.

    - `emacs`: This is a very complex and highly customizable form of text editor
    which comes with a built-in interpreter meant for the Lisp programming language.
    It is specifically used by computer professionals who work in the dialects of
    Lisp like `Scheme`. If you are required to install `emacs` on your Linux based
    system, use the command: `sudo apt-get install emacs`.


    ## Redirecting the command output into text file


    When you are using Linux command line, you might sometimes need to create or even
    make changes to any text file without running a text editor in actual. Here are
    some of the commands which you can use for this purpose.


    ### Creating empty file with the command touch


    For the purpose of creating an empty file, you can use the `touch` command. This
    command helps in updating the `mtime` and `atime` attributes of the file assuming
    that the file contents have been changed whereas nothing actually changes. When
    you `touch` any file which does not even exist in actual, the system will be creating
    that file without putting any form of data inside the file. You can use the command
    like: `touch myfile.txt`. This command will be creating a new and empty file named
    as `myfile.txt` only if that file does not exist already.


    ### Redirecting text into any file


    Sometimes you might need to stick the resulting output of a command into a specific
    file. For accomplishing this motive easily, you need to use the symbol `>` for
    redirecting the resulting output to some specific file. For example, the command
    `echo` is being used for echoing text as the output. So, the command will be:
    `echo "example text"`. This command will print the text on your screen and then
    will return to the command prompt. For redirecting this same output to a file
    you can use `>`. For example, `echo "example text">myfile.txt`. This will be putting
    the text "example text" into a file named as `myfile.txt`. In case the file `myfile.txt`
    does not exist, it will be created by the system. In case it already exists, all
    the contents of that file will be overwritten; it will destroy the previous contents
    of that file and replace it with the new text.


    ### Redirecting to the end of any file


    The operator of redirect `>>` is somewhat similar to the `>`. However, in place
    of just overwriting the contents of a file, this command appends the brand new
    data to the end position of that file. For example, `ls –l>>directory.txt`. This
    command will be taking the output from `ls-l` and then will add it to the file
    directory. If the file does not exist, it will be created by the system. If it
    already exists in the system, the output of `ls-l` will be attached to the file
    end, after one line of the already existing file contents.


    ## Adding and Removing Software


    If you have been using a Linux based system for a long time, you must have known
    that there are ways of doing the same thing in Linux. This includes installing
    software applications onto a machine based on Linux by using the command line.
    The majority of the Linux based users opt for the CLI to install new software
    in the system. Among the most commonly used methods for installing the software
    from the CLI is via the software repositories which is where the software files
    are stored. It is done by using package manager. All the software based on Linux
    is being distributed as packages which are nothing but files which are associated
    with the management system of packages. Each and every distribution of Linux comes
    along with a management system for the packages, however, all of them are not
    the same.


    ### What is the package management system?


    Package management systems consists of a set of tools along with various file
    formats which are utilized together for installing, updating and uninstalling
    Linux based software. The two most commonly found systems of package management
    are from Debian and Red Hat. CentOS, Red Hat and Fedora use the `rpm` system of
    files in which the files are in the `.rpm` format while Ubuntu, Mint and Debian
    use the `dpkg` system of files in which the files are in the `.deb` format. The
    main difference of all these systems is the way you are going to install and maintain
    them.


    The inside contents of the `.deb` or `.rpm` files are somewhat like the old files
    of archive like the `.zip` which contains the code of the applications, the methods
    of installing the software, the dependencies and the location of where the configuration
    files need to be placed. The software which executes and reads all of the above
    mentioned instructions is known as the package manager.


    ### Ubuntu, Debian, Mint and various others


    Ubuntu, Debian, Mint and the rest of the Debian based distributions use the `.deb`
    format of files, along with the `dpkg` system of package management. There are
    two different ways of installing the applications through this system.


    You can employ the `apt` application to install the repository or you can also
    use the `dpkg` applications to install the apps from the `.deb` files. Let’s see
    how to perform both the functions.


    Installing the applications by using the `apt` command is very easy:


    ```

    $ sudo apt upgrade

    ```


    If you want to update only one application:


    ```

    $ sudo apt update app_name

    ```


    In case the application which you want to install in the system is not readily
    available within the repository of Debian and is available as `.deb` download:


    ```

    $ sudo dpkg –i app_name.deb

    ```


    ### Red Hat, Fedora and CentOS


    Red Hat uses various systems of package management, by default. All these systems
    use their own terminologies but are still somewhat similar to each other and with
    the ones which are used in Debian. For instance, you can use either `dnf` or `yum`
    manager for installing the applications.


    ```

    $ sudo yum install app_name

    ```


    $ sudo dnf install app_name

    ```


    The applications which are in the `.rpm` format can also be upgraded in the system
    with the help of the `rpm` command.


    ```

    $ sudo rpm –i app_name.rpm

    ```


    If you want to remove some of the unwanted applications from the system then:


    ```

    $ sudo yum remove app_name

    ```

    $ sudo dnf remove app_name

    ```


    When you want to update the applications:


    ```

    $ yum update

    ```

    $ sudo dnf upgrade – refresh

    ```


    ### Uninstalling software from Linux system


    You can install the software in the Linux system by using the repositories of
    the software. For viewing all the installed packages in the system you can use
    the command `dpkg` and then press `Ctrl+Alt+T` to open the terminal window. So,
    you can use the command like:


    ```

    dpkg – list

    ```


    You can scroll through the complete list of all the packages which have been installed
    in the system in the terminal window to find out what you want to uninstall from
    the system.


    For uninstalling a package or program, you need to use the command `apt-get` which
    is the basic command for the purpose of installing as well as for manipulating
    all the programs which have been installed already. For instance, this command
    will be uninstalling `gimp` and will also delete all its configurations by using
    the `-- purge` command:


    ```

    sudo apt-get -- purge remove gimp

    ```

