    如果您仍然无法解决安装问题，可以提交错误报告。错误报告需要包含安装程序的日志，您可以通过主菜单中的 `Save Debug Logs` 选项轻松获取这些日志。


    通过这种方式，您可以以多种方式导出日志，例如到挂载的文件系统、软盘或 Web 页面。保存调试日志最方便的方法是让 Kali Linux 安装程序启动一个用于存放日志文件的
    Web 服务器。您可以从位于同一网络内的任何其他计算机上启动网络浏览器，然后下载所有可用的日志文件。


    ## 其他故障排除方法


    还有其他简单的方法可以排查 Kali Linux 的安装问题。让我们来看看。


    - **下载官方版本的 Kali Linux 镜像**：确保您已从官方网站下载了 Kali Linux 的 `ISO` 文件。镜像文件有多种格式，如 `ISO`
    文件、ARM 镜像和 VMware 镜像。`ISO` 文件提供两种格式：32 位和 64 位。VMware 镜像预装了 VMware 虚拟机。VMware
    镜像的格式为 32 位 PAE。对于 ARM 镜像，目前完全无法提供一种能够适用于所有 ARM 设备的单一镜像格式。在 Kali Linux 网站上，您可以找到各种设备的
    ARM 镜像，如 `rk3306 mk/ss808`、`ODROID-U2/X2`、`Samsung Chromebook`、`Raspberry Pi`
    等。


    - **验证下载镜像的 SHA1 校验和**：在下载 Kali Linux 镜像时，确保您检查了下载旁提供的 `SHA1SUMS.gpg` 和 `SHA1SUMS`
    文件。在验证镜像校验和之前，请确保 `SHA1SUMS` 文件是唯一由 Kali 生成。


    - **验证安装步骤**：如果您使用 DVD 安装 Kali Linux，请尝试最慢速度刻录 DVD。确保您已禁用系统上的防火墙或防病毒软件，以免其中断写入过程。如果遇到磁盘空间不足错误，请尝试增加磁盘磁盘空间。检查您为安装
    Kali Linux 分配的空间。最佳选项是分配至少 20 GB 的空间以及交换分区（swap）空间。您还可以通过删除并重新划分磁盘上的空空间来排除安装故障。您也可以让安装程序自动对磁盘上的空空间进行分区，这可能会解决您的问题。


    # 第 3 章：Kali Linux 外部启动驱动


    Kali Linux 是信息安全领域久名大远的名字。它由 Offensive Security 资助并维护，该公司是渗透测试和信息安全相关服务的提供者。Kali
    Linux 已成为黑客攻击的首选发行版。在几分钟内，您就可以拥有一个功能良好的渗透测试箱，以及在其他任何地方都找不到的工具集。Kali Linux 预装了大量工具，减轻了安装其他工具的压力。


    ## 运行 Kali Linux 的各种可用选项


    您可以选择在您的系统上完全安装 Kali Linux。但在大多数情况下，您用于渗透测试或伦理黑客攻击的系统可能要求您仍然保留 Windows 或任何其他操作系统作为主操作系统。在这种情况下，您所能做的就是使用虚拟化工具，然后在虚拟机中运行
    Kali Linux。然而，如果运行 Windows 或其他操作系统的系统内存不足，可能会导致虚拟机频繁崩溃。另一个选项是在安装了 Kali Linux 的外部
    USB 驱动器上运行它。此选项带来的唯一问题是缺乏加密。


    ## 哪种是最佳选项？


    从加密的外部可启动 USB 驱动器上安装并运行 Kali Linux 被视为最佳选项。但您还需要确保其安全。因此，为了做到，您需要遵循以下步骤。


    - 首先使用由相关公司拥有的 USB 驱动器。


    - 使用驱动器的完全磁盘加密，在 1 TB USB 驱动器上对 Kali Linux 进行完整安装。


    - 然后您需要加密 USB 驱动器上的数据。由于内置驱动器也使用不同形式的加密处于加密状态，当从 USB 启动操作系统时，内置驱动器也将无法访问。


    - 由于您使用的 USB 驱动器归公司所有，使用的所有数据都存储在该公司的硬件中。


    - 项目结束后，您可以将外部 USB 驱动器交回公司，并将所有测试信息和数据返回给客户。


    ## 在 USB 驱动器上开始 Kali Linux


    要启动过程，您需要下载 Kali Linux 安装程序的 `ISO` 文件，然后将镜像刻录到您使用的外部 USB 驱动器上。将外部 USB 驱动器插入要运行
    Kali Linux 的机器上。确保在启动系统之前插入 USB 驱动器。


    - **设置驱动器**：您需要的下一步是设置驱动器、对其进行加密并分区。会出现一个对话框，要求您选择安装所需的分区类型。选择 `Guided-Use Entire
    Disk`（引导使用整个磁盘）获得获得性能。与仅加密 `/home` 目录相比，这有助于完全加密 USB 驱动器。始终记住，在渗透测试时，Kali Linux
    工具会将所有数据存储在主目录之外的各个地方。下一个屏幕将要求您选择要安装的磁盘。此时，确保您选择了要安装 Kali Linux 的 USB 驱动器，而不是系统的任何本地驱动器。如果您选择了任何本地驱动器，将删除该驱动器上的操作系统。选择
    USB 驱动器后，点击 `Continue`（继续）。


    - 下一个窗口将询问您如何对 USB 驱动器分区。选择 `All Files on one partition`（所有文件在一个分区）并点击 `Continue`。


    - 接下来，将要求您保存分区的所有信息，然后开始磁盘分区过程。当您选择继续时，USB 驱动器上的所有数据将被删除。因此，在点击 `Continue` 之前，请选择
    `Yes`。


    - 磁盘加密过程将与分区过程一起开始。驱动器先清除后加密。整个过程将需要一段时间。如果您使用 64 GB 的 USB 驱动器，加密需要 30 分钟。如果您使用
    1 TB 的 USB 驱动器，加密大约需要 10 小时。


    - 过程完成后，将要求您提供一个用于加密的密码（passphrase）。确保使用强密码，因为在启动 Kali Linux 时将需要使用它。


    - 接下来，确认更改并选择 `Finish Partitioning`（完成分区）。


    - 现在系统将开始分区过程，过程完成后，安装系统将启动。


    - 系统还会询问您是否要使用任何网络镜像（Network Mirror）。点击 `Yes`，这将选择您位置附近的存储镜像，并有助于以后加速更新过程。


    ## 启动 Kali Linux


    将 USB 驱动器插入机器并启动。在启动过程中，打开启动菜单并选择您想要使用的 USB 驱动器。现在您将需要输入密码，输入成功后，系统将启动。


