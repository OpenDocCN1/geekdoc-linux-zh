    Wi-Fi，或无线网络，是当今世界用于网络连接最首选的介质。然而，由于其普及，无线网络也面临着各种攻击以及若干种安全问题。如果攻击者获得了对网络连接的完全访问权限，他们就可以从任何附近的位置嗅探到数据包。攻击者利用嗅探工具寻找
    `SSIDs`，然后破解 Wi-Fi 或无线网络。在成功破解后，攻击者可以监控所有连接到同一网络 `SSID` 的设备。如果你使用 `WEP` 认证，它可能会受到字典攻击。攻击者利用
    `RC4` 加密算法创建流加密器，而这些加密器是很容易破解的。如果你使用 `WPA` 认证，则可能会受到 `DOS` 以及字典攻击。


    # 破解 Wi-Fi 的工具


    为了破解 `WEP`，攻击者使用多种工具，如 `WEPcrack`、`Aircrack`、`Kismet`、`WEPDecrypt` 等。破解 `WPA`
    时，黑客使用 `Cain`、`Abel` 和 `CowPatty` 等工具。还有其他通用用于破解无线网络系统的工具，如 `wireshark`、`Airsort`、`Wifiphisher`、`Netstumbler`
    等。攻击者现在甚至能够通过无线网络系统破解手机平台。`Android` 被认为是最常见的手机平台，但它非常受到某些特定漏洞的影响，这最终使得攻击者更容易利用设备安全并从中窃取数据。对移动设备最危险的威胁是第三方应用程序、电子邮件木马、无线攻击和短信。


    # 如何进行 Wi-Fi 攻击？


    大多数无线网络攻击是通过建立虚假接入点（Access Points）来实现的


    - **双胎胎攻击 (Evil Twin attack)**：在这种攻击中，黑客设置一个与公司附近的 `AP` 名称相同的虚假接入点。当公司的任何员工连接到该接入点时，该员工会在不知不觉的情况下提供实际接入点的所有认证详情。因此，黑客可以轻易破解整个连接。

    - **信号干扰 (Signal jamming)**：黑客可以通干扰网络信号轻易破坏网络连接。这是通过使用各种产生噪声的工具实现的。

    - **配置错误攻击 (Misconfiguration attack)**：当网络路由器使用默认配置形式、弱加密方式、弱凭据和算法进行设置时，攻击者可以轻易破解网络。

    - **热点攻击 (Hotspot attack)**：攻击者设置与任何公共 Wi-Fi 接入点 `SSID` 名称相同的虚假热点或接入点。当任何用户在不知不觉的情况下连接到该接入点时，黑客可以轻易访问实际网络。


    # 如何进行有效的攻击


    “黑客”一词并不意味着它总是负面的。只有当你对背后的过程有清晰的认知时，你会对攻击的整个过程有一个良好的理解。你不仅可以学习攻击过程，还能让你的系统受到更多外部攻击的保护。大多数时候，当攻击者尝试访问组织或公司的服务器时，通常是通过
    5 个适当的步骤完成的。让我们这些步骤。


    - **侦察 (Reconnaissance)**：这可以被视为攻击过程的第一步。在此阶段，攻击者利用所有可用手段收集有关主要目标系统的各种形式的相关信息。相关信息集可能包括对目标的正确识别、服务器的
    `DNS` 记录、目标所在的 `IP` 地址范围、网络以及其他各个方面。简单来说，攻击者试图收集各种信息，连同网站或服务器的联系方式。攻击者可以使用如 `maltego`
    等多种形式的搜索引擎来实现，或者通过对目标系统进行研究，或者使用如 `HTTPTrack` 等各种工具下载完整网站以便在后期进行枚举。


    通过执行所有这些步骤，攻击者将很容易地确定组织内所有员工的，找到指定的岗位以及员工的电子邮件地址。


    - **扫描 (Scanning)**：在收集有关目标的所有相关信息后，攻击者现在开始扫描过程。在此阶段，攻击者利用拨号器、端口扫描器、漏洞扫描器、扫描器和网络映射器等各种工具来扫描目标网站或服务器数据。在这一步中，攻击者试图寻找所有实际上有助于执行成功攻击的信息，例如系统的
    `IP` 地址、服务器内的用户账户和计算机名称。黑客完成基础信息的扫描后，他们开始测试目标网络以寻找可能的攻击途径。他们可能还会使用如 `Kali Linux`
    的几种方法进行网络映射。


    黑客还会搜索任何自动电子邮件系统，通过该系统向目标公司的员工发送某些虚假查询邮件，例如向公司人事发送关于职位查询的邮件。


    - **获取访问 (Access gaining)**：这是所有步骤中最重要的一步。在此阶段，攻击者根据第一步和第二步收集的所有相关信息，设计目标网络的蓝图。在黑客完成数据枚举和系统扫描之后，他们现在将移动到获取系统访问权限，这将基于收集的信息。


    - 例如，攻击者可能决定使用钓鱼攻击。攻击者总是尝试保持安全，可能采用非常简单的攻击来获取系统的整体访问权限。攻击者还可能从 IT 部门终端渗透系统。黑客利用公司真实的电子邮件地址发送钓鱼邮件。通过使用此钓鱼邮件
    ID，攻击者将向技术人员发送邮件，邮件中包含某些形式的特殊程序以及用于收集登录密码和 ID 的钓鱼网站。为此此，攻击者可以使用手机应用、网站邮件或其他方法，然后要求员工使用他们的凭据登录新网站。


    当黑客使用这种方法时，他们已经在后台运行了一个特殊类型的程序，也称为 `Social Engineering Toolkit`（社会工程工具包），用于向用户发送带有服务器地址的邮件。


    - **维持服务器访问 (Maintaining access to the server)**：在攻击者获得目标服务器访问权限后，他们将尝试一切可能的方法确保他们访问服务器的安全，以便进行未来的攻击和利用。由于攻击者现在拥有服务器的完全访问权限，他可能还将服务器作为他自己的基地来启动其他几种形式的攻击。当攻击者获得整个系统的访问权限并拥有该系统时，这种系统被称为
    `僵尸系统 (zombie system)`。黑客还可能通过创建一个新的管理员账户来隐藏在服务器中，这样他可以在无人知情的情况下与系统混合。为了保持访问系统的安全，黑客会追踪所有长时间未使用的账户，然后将所有这些账户的提升提升自己这里。

