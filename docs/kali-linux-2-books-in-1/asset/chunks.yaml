    通用引导加载程序 (GRUB) 是每次 PC 启动时将显示的主屏幕。这允许在启动时检查特定设置、即时更改，并在工作框架加载之前修改设置。虽然 GRUB 对于某些受驱动的客户端来说并非必须，但我们强烈建议大多数类型的设备使用它。点击“YES”引入
    GRUB，然后点击“继续”（Continue）。


    # 完成安装


    现在从 PC 中取出光盘并重启。当出现提示时，执行相应操作，然后点击继续（Continue）按钮完成安装。


    重启后，将显示欢迎屏幕。使用之前在安装过程中设置的预定义密码以 root 用户登录。欢迎使用 Kali Linux！


    # U 存盘安装


    USB 内存设备（通常称为优存盘）是一种通过 USB 接口连接到 PC 的简单存储设备。本书建议使用存储空间至少为 8GB 的 USB 设备，理想情况下大大。新
    PC 可以从 USB 设备启动。如果选择了此备选项，请确保所使用的 PC 支持从 USB 设备启动。


    随后的章节将介绍如何在 Microsoft Windows PC 或 Linux 阶段下，在优存盘上安装 Kali Linux。请务必查看 Kali Linux
    官方主页上的文档以获取此步骤的更新。


    关于将优存盘作为启动设备使用，有两个关键术语很重要：持久性和非持久性。持久性是指你的设备在机器关闭后保留任何写入或修改过的记录的能力。非持久性是指设备在机器重启或关闭时丢失所有设置、自定义内容和记录。对于本书而言，从
    Windows 阶段安装的 Kali Linux 优存盘是非持久的，而从 Linux 阶段安装将是持久的。


    ## Windows（非持久性）


    所需应用程序——Win32 Disk Imager: `http://sourceforge.net/ventures/win32diskimager/`


    在下载 Kali Linux ISO 之前，将优存盘插入 PC 并等待 Windows 识别它，观察分配的驱动器号。接下来，打开 Win32 Disk Imager。点击信封图标浏览并选择
    Kali ISO 文件，然后点击“确定”（OK）按钮。从设备下拉列表中选择正确的驱动器号。最后点击“启动”（Start）按钮。


    当 Win32 Disk Imager 完成消耗 ISO 后，重启 PC 并在 BIOS POST 菜单中选择优存盘。大多数制造商都有从 USB 设备启动的各种策略；请务必查看
    PC 制造商的文档。


    ## Linux（持久性）


    在构建持久性优存盘时，大小确实会有影响！优存盘容量越大越好。此外，取决于你组装此 USB 设备的 Linux 版本，请确保已安装 `GParted` 应用程序。如果你在安装
    `GParted` 时遇到问题，请检查你工作框架的文档。如果未安装 `GParted`，以下后续技术之一可能对你的 Linux 安装是至关重要的：


    - 良好的 apt-get install gparted

    - fitness apt-get install gparted

    - yum install gparted


    下载 Kali Linux ISO 后，插入你的优存盘。打开终端窗口并通过以下方向确认 USB 设备区域。`lsblk -I udisks | awk ''{print
    $1}''`


    显示命令输出为 `/dev/sdb1`。USB 设备的输出可能根据 PC 的设置和设计而异。随后，将 "sdb" 替换为正确的标识符并删除末尾的任何数字。使用
    `dd` 命令将 Kali ISO 镜像移动到 USB 设备。`dd if=5 kali_linux_image.iso of=5/dev/sdb bs=5
    512k` 现在启动 `Gparted`。`gparted/dev/sdb`。驱动器现在应该有一个包含刚刚引入的 Kali 镜像的分区。


    通过点击文件菜单栏中的分区（Partition）菜单并选择“新建”（New）来为 USB 添加另一个分区。不同设备制造商的输出可能会有细微差异。通常，方法如下：


    - 点击灰色的“未分配”（unallocated）空间。

    - 从分区下拉菜单中点击“新建”（New）。

    - 使用滑块或物理确定驱动器大小。

    - 将文件系统设置为 `ext4`。

    - 点击“添加”（Add）。

    - 从主窗口的“编辑”（Edit）下拉菜单选择“应用所有操作”（Apply All Operations）。

    - 提示时点击“确定”（Okay）。这可能需要一些时间。


    使用以下命令包含持久性功能。

    ```

    mkdir/mnt/usb

    mount /dev/sdb2 /mnt/usb

    echo "/persistence" > /mnt/usb/persistence.conf

    umount/mnt/usb

    ```


    LiveUSB 的创建已完成。重启 PC 并从优存盘启动。


    # SD 卡安装


    微型设备，例如 RaspberryPi 和 Google 的 Chrome Notebook，适用于在 SD 卡上运行。这些小设备可用于许多；人们仅限于自己的想象力。这些设备，例如
    Raspberry Pi，其优点是它们廉价且在开源社区中极受欢迎，让各地的手工爱好者能够快速获得资源。


    在 ARM 设备上引入 Kali Linux 有一个缺点；镜像是定制的，必须为每种设备进行定义。


    ARM 设备的镜像位于 Kali 的官方下载页面，`http://www.kali.org/downloads/`。检查你的设备是否有可下载的支持的镜像。


    以下提供了为良好的 ARM 工程类设备引入 Kali Linux 的简短指南：


    1. 从 Kali 官方网站下载合适的镜像 (`http://www.kali.org/downloads/`)。

    2. 插入空白 SD 卡。通过以下命令确认挂载区域。`lsblk -I vfat`（假设后续阶段为 `/dev/sdb`）。

    3. 将 `Kali.img` 文件移动到 SD 卡。`dd if=5 kali.img of=/dev/sdb bs=5 512k`

    4. 在拔出设备之前卸载并同步任何写入任务。`umount/dev/sdb`

    5. 拔出 SD 卡。

    6. 将包含 Kali Linux 镜像的 SD 卡插入你的 ARM 工程计算设备并从 SD 卡启动。


    在本节中，涵盖的主题将允许用户将 Kali Linux 到大多数 PC、工作站、优存盘和小型计算设备上。引入 Kali Linux 就像骑自行车；做一次，你以后通常永远不会忘记如何引入
    Kali。查看 Kali 官方网站上的文档和网络消息快报，以获取安全网络中开发的新的更新、版本和进展。与其他安全专家、专家和程序员建立联系和交流可以并且将会扩展视野，帮助你更深入地研究新任务，并在可能时解答问题。


    # 编程、补丁与升级


    ### 本章数据

    - APT 软件包处理工具

    - Debian 包管理器

    - Tar 包

    - 安装 Nessus 的实用指南


