    旧故事中的“分身”（doppelganger）是一个人灵异的复制品。在开始对在线生活世界进行观察之前，建立一个人设（persona）是正常做法。直接利用安全大师或切入分析者的个人资料对目标进行研究通常不是一个好主意。更好的主意是渗透分析者通过在线社交网络与该协会的人员建立社交联系。如果渗透分析者的人设声称曾在目标协会工作过，或者与该切入分析者试图在
    `LinkedIn` 上建立联系的 CEO 读过类似的学校，那么这种做法将变得越来越有吸引力。显然，渗透分析者必须小心不要完全控制一个真实个人的性格，这种做法可能会导致某些人认为发生了欺诈。两个个人拥有相似的名字是可能的。例如，建立一个名为
    `John Smith` 的虚构人设，他就读于`威斯康星大学`和一个完全虚构的基础，这并不等同于获取就读该校的真实 `John Smith` 的性格。无论如何，确保你的人设不要渗透到数据造假或虚假陈述中。这意味着，除了其他事情外，不要填写有你人设名称的
    `Visa` 申请，也不利用此人设参加合法的并发活动。


    使用分身的界限应当从承诺（commitment）开始就明确指出，如果允许社交设计，则应该建立一个当社交构建成为不可或缺的因素时可行的分身。在填写在线生活场所的注册时，渗透分析者应关注使用方法，以确保不会因分身人设违反策略、规则或法律。


    ## 工作场所


    浏览如 `Monster`、`Career Builder` 和 `Dice` 等求职网站，偶尔会带来有趣的发现。就像目标公司网站一样，这些网站可以揭示目标网站所使用的技术创新。通过浏览与相关组织相关的页面，通常会列出应该填充的职位，帮助渗透分析者更好地理解目标。最近，许多公司已开始意识到这一缺陷，并目前在招聘中将职位发布为“公司私有”或其他声明。


    ## DNS 和 DNS 攻击


    域名系统，或 `DNS`，为互联网提供帮助。总来说，人们对于记忆和使用名称（如 `Google.com`）记忆力，而计算机使用如 `173.194.46.19`（Google
    的位置之一）这样的数字则更为容易。Web 的分级结构也使用了逐步进的数字八进制。这产生了一个问题，即人类的最佳方案与计算机的最佳方案并不一致。名称服务器通过在计算机和人类之间充当解释器来解决这个问题。


    这些名称服务器设置在不同的分级请求中，带有顶级域名（TLD）服务器，提供基础区域，如 `.com`、`.gov`、`.edu` 等许多。在名称服务器优先级链的另一端，每个系统可以有自己的名称服务器，可以通过名称而不是
    IP 地址访问本地管理和计算机。


    理解名称服务器基本功能最简单的方法是观察计算机和浏览器如何与整个名称服务器框架协作工作。从本地名称服务器到根服务器（或 TLD 之上的名称服务器），每个名称服务器都可以查询其上方的名称服务器或向下面的名称服务器提供数据。如果计算机客户端在浏览器中输入
    Google 的地址，将触发一系列操作来将可读的名称解析为对计算机更有价值的数值。这从客户端计算机询问本地名称服务器是否知道 IP 地址对应于 `www.google.com`
    开始，如果该名称服务器过去收到过此请求并保留了正确的响应，或者 Google 已经注册在该名称服务器上，就可以立即返回 IP 地址。如果该名称服务器没有保留数据，或者通常没有存储，它会询问下一个名称服务器，如果知道数据则返回，否则继续直到请求到达
    TLD 名称服务器，在这种情况下为`.com` 名称服务器。


    名称服务器包含大量有用数据，远超网页。例如，名称服务器将包含该区域的邮件服务器或 MX 记录、其他命名计算机或 "A" 记录和其他支持数据。


    ## 查询名称服务器


    根据其总体设计，大多数名称服务器对公众开放。在 `Kali Linux` 终端中输入以下指令将查询分配给本地计算机的名称服务器。


    ```

    nslookup

    ```


    这将导致终端显示一个脱符号（.），表示框架正在等待输入。输入以下指令查询本地名称服务器以确定 Google 页面的 IP 地址。`www.google.com`


    这将恢复多个包括权威（主响应）和非权威（遵循非权威标记）的 IP 趋势。


    非权威答案是极佳的数据源，正如该术语所示，数据是从服务器的存储中提供的。


    ### 筛选 Google 查询。


    要退出 `nslookup` 使用以下命令。


    ```

    exit

    ```


    `nslookup` 命令将使用为本地机器指定的名称服务器。要显示用于当前 `nslookup` 命令的名称服务器，使用以下命令。


    ```

    nslookup

    . server

    ```


    `nslookup` 命令也可以返回其他数据。例如，要扫描所有邮件服务器，输入以下指令。


    ```

    . set sort 5 MX

    . google.com

    ```


    这将恢复 Google 区域所有已知的邮件服务器。区分关于目标的各种类型记录是完成监视的一个重要部分。正如前面提到的，`nslookup` 命令自然而然使用私有指定的名称服务器。在
    `Kali Linux` 中，名称服务器定义在位于 `/etc/` 目录下的 `resolv.conf` 文件中。使用以下指令识别私有指定的名称服务器。


    ```

    /etc/resolv.conf

    ```


    `nslookup` 使用的名称服务器可以更改为目标区域的名称服务器。首先使用以下指令识别目标名称服务器。


    ```

    nslookup

    . set sort 5 ns

    . google.com

    ```


    识别出目标名称服务器后，可以使用以下指令将 `nslookup` 使用的名称服务器更改为目标名称服务器之一。此模型将名称服务器设置为 Google 的名称服务器之一。


    ```

    nslookup

    . server 216.239.32.10

    ```


    可以使用 `nslookup` 找到各种记录。


    ## 区域传输


    虽然可以使用像 `nslookup` 的程序通过物理移动数据来增加大量数据，但利用区域传输（zone move）可以在更短的时间内获得更多数据。区域传输实际上是从名称服务器转导出所有数据。此过程有助于刷新授权的名称服务器。配置不当的名称服务器不仅允许授权客户进行刷新区域传输，还允许任何需要交换的人。


    域名信息 Gopher (`DIG`) 是一个可以用于尝试区域传输的程序。尝试区域传输使用以下指令。


    ```

    burrow @[name server] [domain] axfr

    ```

