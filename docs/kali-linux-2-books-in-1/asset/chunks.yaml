    ## 第一本书


    # 引言


    恭喜你下载了《初学者 Kali Linux：计算机黑客攻击与编程指南——包含使用 Kali Linux 进行无线网络攻击和渗透测试的实用示例，帮助理解网络安全基础》电子书。看到你对了解
    Kali Linux 的基础知识及其在当今技术世界中的用途表现出极大兴趣，我感到非常高兴。它可以被视为当今世界上最有效的软件之一。许多人认为 Kali Linux
    是计算和网络领域人士的巨大福音。


    Kali Linux 作为一个安全审计软件运行，同时也从网络和黑客攻击的角度工作。这款强大的软件包含了大量的安全功能，以及如安全研究、逆向工程和渗透测试等基于信息的任务。计算机取证也是该软件的一部分。


    该软件是 Linux 家族的一员。Linux 发行版主要关注网络安全。


    # 第 1 章：安装和下载 Kali Linux


    如果你选择信息安全作为你的职业选择，你最需要的事情是安装一个主要作为安全系统管理员操作系统。一个合适的操作系统将帮助你执行与信息安全相关的各种任务，并让耗时较的工作变得非常简单。在当今的信息安全世界中，你可以找到各种操作系统，其中
    Kali Linux 被认为是最好的。


    '
- fmt: '

    It works as a great tool for the purpose of penetration testing and information
    security. Today, it is being used by most penetration testers along with ethical
    hackers who are concerned with the security of a system as well as with various
    other assessments of the network.


    Among all other distributions of Linux, Kali Linux is one of the finest and leading
    distribution which is being widely used today in the world of security auditing.
    Kali Linux is the one and only operating system which is related to the security
    of networks and ethical hacking. It comes with loads of tools which are related
    to command line hacking which is necessary for various jobs related to the information
    security.


    Kali Linux is most commonly used for computer forensics, security of system application,
    and penetration testing along with network security. Kali Linux is also the prime
    OS designed for the purpose of ethical hacking.


    ## How to download Kali Linux?


    Kali Linux is an open-source software. That means that the OS can be used and
    utilized completely along with being totally free. So, Kali Linux can be downloaded
    easily from the official website of the OS. You can install it by various techniques
    which you can find in the next section. You will come across various versions
    of the same and you can install the one which meets your needs.


    While downloading the installation file, you will also come across some numbers
    in hexadecimal number which are being used for the purpose of security jobs. You
    need to properly check out the integrity of the image which you have downloaded.
    You will also need to check the `SHA-256` fingerprint of the installation file.


    ## How to install Kali Linux on your computer?


    The overall process related to the installation of Kali Linux on your computer
    is super easy. You can choose any of the options which are available for installing
    the OS. The most commonly used installation options are:


    * Installing the OS with the use a of hard drive.

    * Installing the OS with the help of Kali Linux bootable USB drive.

    * Installing the OS with the help of `VMware` or `VirtualBox`.

    * Installing the OS with the help of dual booting.


    Among all the options which are available for installing Kali Linux on your system,
    installing the OS with the help of `VirtualBox` and by using bootable USB drive
    is the most common. Your system requires a minimum of 20GB of free hard drive
    space along with a minimum of 4 GB RAM in case you want to install the OS with
    the use of `VMware` or `VirtualBox`.


    ### Installation of Kali Linux with the help of virtualization software


    * Just before starting with the process of installation, you need to install a
    virtualization software like `VMware`. You can also choose other options such
    as:

    * `VirtualBox` which is a product of Oracle. After you are done with installing
    the virtualization software launch the software from the applications folder.

    * You need to download the installation file for the OS which you can easily get
    from the official website. After that, launch the virtual machine. For this, open
    up the home page of the virtualization software which you have installed on your
    system and then choose `Create New Virtual Machine` from the options.

    * After you are done with creating a new virtual machine, select the `iso` file
    or image of the Kali Linux OS which needs to be followed by the selection of guest
    operating system. You also need to configure each and every detail related to
    the virtual machine, like Kali Linux. You can now easily start the virtual machine
    related to Kali Linux after selecting the Kali Linux `VM`. After you have selected
    the `VM`, click on the green button `Power` button.

    * Right after the `VM` has been powered up, you will see a pop-up menu where you
    need to select your required installation mode in the menu of `GRUB`. Select the
    option of `Graphical Installation` and then select `Continue`.

    * The succeeding screens will be asking you to determine the information related
    to locale such as your preferred language in which you want to use Kali Linux,
    your location, keyboard layout and others.

    * After you are done with all these, you will need to set up a strong password
    for the Kali Linux `VM`. Followed by this, the installer will be asking you to
    select the time zone and then will pause at the step of disk partition. You can
    either choose `Entire Disk Space` or `Create Separate Partition` for the `VM`.

    * You will need to save all the changes but do not continue with the process as
    it will completely erase all the data which is present on the disk. So, always
    confirm the settings first before proceeding further.

    * After this, you will be asked to install the `GRUB` boot loader. Select `Yes`
    and then choose the device for saving up the information of the boot loader which
    is needed for booting up the Kali Linux `VM`.

    * Click on `Finish` and the installer will finish the final stage procedures.

    * The OS can also be installed by the help of a bootable USB drive as well.


    ## Chapter 2: Troubleshooting Installations


    Kali Linux has turned out to be a quite reliable software when it comes to penetration
    testing and ethical hacking. But, there are times when the system fails and it
    becomes a tiresome job to install the same. There can be a wide range of possibilities
    behind the failure of Kali Linux installation. This could include problems like
    incomplete or corrupted `iso` download, insufficient disk space of the target
    machine and many others.


    The installer of Kali Linux is really reliable but facing bugs or encountering
    external problems like bad mirrors, network problems, etc. is very common. So,
    all that you need to do in such situations is to simply troubleshoot the process
    of installation so that you can proceed.


    Whenever the installer of Kali Linux fails, it comes up with a screen which shows
    “Installation Step Failed”. At such a point, you need to know that the Kali Linux
    installer functions with various virtual consoles: the primary screen which you
    can see runs either on fifth console (for the installer of graphics use `CTRL+Alt+F5`)
    or on the first console (for the installer of texts use `Shift+F4`).


    In both of these cases, the fourth console which can be seen by `CTRL+Shift+F4`
    will help in displaying all the related logs of what exactly is happening within
    the installer. You can easily evaluate the reason for the installer problem with
    a more detailed error message such as “the log screen of installer” which indicates
    that the target machine is running out of space and the installer is unable to
    proceed with the step.


    ### The log screen of the installer


    The third and the second consoles, which are `CTRL+Shift+F3` and `CTRL+Shift+F2`
    respectively, host the shells which can be used for further investigation of the
    present situation in complete detail. Most of the tools of the command line are
    provided by `BusyBox` and so the set of features is somewhat limited. They are
    enough for figuring out the majority of the problems which you are most likely
    to encounter during the installation of Kali Linux.


    As you click on `Continue`, which is available on the main screen `Installation
    Failure`, the installer will return you to a screen which you are not likely to
    see in normal conditions, the `Main Menu` of the Kali Linux installer. This screen
    will let you launch the steps of the installation one by one. If you can manage
    to mend the problem with the help of the installer shell access you can easily
    start again with the step which failed.


    ### What can you do in the shell of installer


    With the installer shell, you can easily inspect and also modify the database
    of `debconf` with the commands `debconf-get` and `debconf-set`. These commands
    are used for the purpose of testing the preceeding values. You can check any of
    the files like the complete log of installation, available in `/var/log/syslog`
    with `more` or `cat`. You can also edit any of the files with `nano` along with
    the files which are being installed on the system.


    ## Main Menu of the Kali Linux installer

