    在 Linux 中配置系统网卡（也称为系统连接器）以前是一个必须通过命令行完成的程序。从最近开始，这种情况已经发生了变化，Kali Linux 也是如此。Kali
    Linux 拥有强大的图形用户界面（GUI），可以使用直观的对话框设计许多基本设置。


    通过点击 UI 右上角的`Applications（应用程序），然后选择`System Tools（系统工具）、`Preferences（偏好设置）和`Network
    associations（网络关联），可以有效打开系统设置对话框。点击`System associations`，将显示`System associations`对话框，并选择`Wired（有线）选项卡。另一方面，右键点击屏幕右上角的两个
    PC 并选择`Alter Associations（修改关联），也会进入类似的对话框。通常情况下，PC 只需要配置一个系统网卡，但在引入不同的网卡（NIC）时，确保你正在配置正确的网卡。此模型将配置
    `Wired association 1`，如果你喜欢，可以将名称更改为更有意义的内容，即 PC 中的主物理网卡。在选择要更改的关联并点击`Edit（编辑）按钮后，会显示配置对话框。这将弹出该关联的编辑框，并默认选中`Wired`选项卡。此选项卡显示设备的介质访问控制（MAC）地址，该地址在设备的整个使用周期内通常保持不变（更多关于
    MAC 地址的信息，请参见 MAC 地址的注释）。设备的标识符同样显示在 MAC 地址后的框中。在这种情况下，设备标识符为 `eth0`，其中 `eth`
    是 Ethernet 的缩写，`0` 是 PC 中的主卡。配置网卡的编号分组从 0 开始而不是 1，因此 PC 中的第二个网卡将是 `eth1`。


    通过选择`802.1x Security（802.1x 安全）`选项卡、`IPv4 Settings（IPv4 设置）`或`IPv6 Settings（IPv6
    设置）`选项卡可以创建`Wired`以太网设置。本书将重点介绍目标选项卡的 IP 版本 4 (IPv4) 设置。选中后，可以配置 PC 的 IP 地址（`192.168.1.66`）、`Subnet
    Mask（子网掩码）`或`Netmask（网络掩码）`（`255.255.255.0`）、`Gateway（网关）`（`192.168.1.1`）以及`DNS
    servers（DNS 服务器）`（`192.168.1.1`）。可以通过逗号分隔来使用多个 DNS 服务器。点击`Save（保存）`按钮可以保存配置并使其动态化。


    ## 使用命令行配置网络接口


    了解如何从命令行配置或重新配置系统连接器至关重要。当不使用 Linux 图形界面，或者你通过终端窗口远程连接到框架时，这非常有价值。在入门测试中，许多情况下命令行是进行设置更改的首选方案。


    这些操作应以具有`root` 提升权限的客户端身份执行。在活动设备上执行这些更改是一种良好的方法，而使用`sudo` 命令进行执行是配置 Kali Linux
    的另一种方法。权限提升后，即可配置系统网卡。


    通过以下命令检查 PC 系统网卡的状态以及每个网卡的状态：


    ```

    ifconfig -a

    ```


    这将显示 PC 上所有系统网卡的当前配置。在图 4.7 中显示了两个系统地址：`eth0`（主以太网卡）和 `lo`（环回或内部接口）。该连接器的设置是使用图形界面设置的。使用命令行更改这些设置非常简单。


    ### 启动和停止接口


    可以使用`ifconfig` 命令的`up` 选择启动接口，或使用`down` 选择停止接口，同时指定要停止或启动的接口。相应的命令将停止主以太网连接器。


    以下命令将启动主以太网连接器。


    ```

    ifconfig eth0 up

    ```


    使用以下命令可以将该连接器的 IP 地址从当前配置 `192.168.1.66` 更改为 `192.168.1.22`：


    ```

    ifconfig eth0 192.168.1.22

    ```


    也可以使用以下命令利用命令行更改系统网卡。这将将 IP 地址设置为 `192.168.1.22` 并将子网掩码设置为 `255.255.0.0`。


    ```

    ifconfig eth0 192.168.1.22 netmask 255.255.255.0

    ```


    在命令行处完整配置系统网卡比使用图形 UI 需要更多工作，因为设置设置并非全部存储在同一区域。默认网关的包含或更改（在此情况下为 `192.168.1.2`）使用以下命令：


    ```

    route include default gw 192.168.1.2

    ```


    通过修改 `/etc` 索引下的 `resolv.conf` 记录来更改名称服务器（或 DNS）设置。可以通过使用你喜好的文本编辑器修改记录，或者直接在命令行中使用相应的命令来实现：


    ```bash

    echo nameserver 4.4.4.4 > /etc/resolv.conf

    ```


    上述命令将删除当前的名称服务器并将其替换为 `4.4.4.4`。要包含额外的名称服务器，相应的命令将把新的名称服务器地址添加到 `resolv.conf`
    中已记录的地址之后。


    当 PC 执行名称查询时，它将按照请求中记录的顺序检查前三个名称服务器。


    ```bash

    echo nameserver 8.8.8.8 >> /etc/resolv.conf

    ```


    ## 从提示符使用 DHCP


    配置系统网卡最简单的方法可能是使用 DHCP 服务来配置网卡。在这种情况下，DHCP 服务器将为网卡提供所有所需的设置。这对于大多数终端用户很有帮助，当待配置的框架在
    DHCP 服务器数据库中注册时，这并非理想。使用以下命令在入门测试时禁用程序 DHCP 设置。此模型使用了`nano` 编辑器；也可以使用其他文本工具。


    ```bash

    nano /etc/network/interfaces

    ```


    添加以下行：

    ```

    auto eth0

    iface eth0 inet static

    address {IP_Address}

    netmask {netmask}

    gateway {Gateway_IP_Address}

    ```


    保存内容文件并退出以完成调整。可能需要重启以太网接口以启用此配置。


    在命令行输入以下命令来配置主系统网卡：


    ```

    dhclient eth0

    ```


    这将根据 DHCP 服务器提供的设置自动配置系统网卡。


    ## 使用 GUI 配置无线网卡


    可以使用之前图形化设置以太网接口时的 GUI 来练习配置远程网卡。在这种情况下，不要选择`Wired` 选项卡，而是在网络连接对话框中选择`Wireless（无线）`选项卡。


    从此选项卡选择`Add（添加）按钮，这将显示一个标题为“Alter Wireless association 1”的对话框（假设这是主远程连接器）。


    此对话框有四个选项卡用于启用远程网卡的设置。此对话框包含了设计框架远程网卡的各种设置。


    ### 关联名称


    关联设置默认为“Remote association”，后跟正在配置的连接器数量，在此情况下为 Wireless association。


    1. 此名称可以更改为更有意义的内容，例如 customer 1 remote association。


    ### 自动关联复选框


