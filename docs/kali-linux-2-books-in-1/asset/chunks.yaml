    构成一个尖端组织由许多部分组成，而完全清晰地配置系统管理远超本书的涉及范围。本文将介绍的小型系统部分足以描述如何配置网络网卡。这个小系统仅由 Adam 和
    Bill 使用的两台 PC、一台连接到链路调制解调器的有线交换机以及连接所有设备的的链路（在此模型中均为 CAT5 线）组成。交换机的内部互联网协议（IP）地址为
    `192.168.1.1`，这对于小型家庭办公室（SOHO）和家庭系统的默认设置来说非常常见。该交换机通过其外部连接到互联网，使用互联网服务提供商（ISP）分配的
    IP 地址，这将使 Adam 和 Bill 在有效配置系统网卡后能够上网。在此模型中，交换机还提供了动态主机配置协议（DHCP）、基本的防火墙功能和域名系统（DNS），这些内容将在稍后进行更详细的讨论。该系统如图
    4.3 所示，并将作为后续所有部分使用的基础系统。


    ## 私有地址

    交换机的内部接口（或网络网卡）的 IP 地址为 `192.168.1.1`；这被称为私有位址，因为它无法在互联网上使用。对于图中黑盒所通信的内部系统来说，这种地址是正常的，类似于
    `DHCP` 分配的地址，例如分配给 Adam 和 Bill PC 的 IP 地址。表格记录了用于内部或私有系统的普通私有 IP，这些地址无法在互联网上使用。


    为了访问互联网，交换机执行一种称为网络地址转换（`NAT`）的魔法操作，将 Adam 和 Bill 使用的 IP 转换为互联网上可以使用地址。这通常是互联网供应商分配给交换机的地址，并将分配到外部接口（另一个网络网卡）。如果客户端在没有
    `NAT` 交换机的情况下在互联网上使用这些地址，连接将会失败，因为互联网路由器和其他设备会忽略这些私有 IP 地址。


    ## 默认网关

    交换机隔离了内部和外部这两个系统，并提供了一些安全功能，类似于简单的防火墙。此外，交换机提供了从私有系统到公共网络（通常是互联网）的出口。因此，交换机的内部接口
    IP 地址就是 Adam 和 Bill 系统的出口。该地址被称为默认网关，将在以后为客户端两台 PC 设计网卡时使用。理解默认网关的一种很好方法是将其看作是社区出去的唯一街道。任何需要离开社区的人都需要知道这条街道在哪里。系统
    PC（通过网络网卡）需要知道离开社区组织的出口在哪里；这就是默认网关。


    ## 域名服务器

    PC 之间通过数字进行通信，而人类则更擅长使用单词和表达式进行交流。为了让通信有效进行，PC 通常使用域名服务器或域名系统（`DNS`）。本书将在稍后更详尽地介绍
    `DNS`，因此本节仅将对 `DNS` 进行概述。根本上，域名服务器将人类友好的名称（如 `www.syngress.com`）解析为 PC 和系统管理部分更容易处理的
    IP 地址。`DNS` 与域名服务器同义，提供人类友好名称与 PC 友好位置之间的解析。例如，当一台 PC 需要与另一台 PC（例如 Web 服务器）通信时，它最初应该将可读位置解析为可以发送消息的
    PC 友好地址。用户在他们的首选程序中输入 `www.syngress.com`，PC 就会将此位置发送到 `DNS` 机器。`DNS` 将返回网站页的 IP
    地址（`69.163.177.2`）。客户端 PC 然后将使用此 IP 地址与 Syngress Web 服务器通信，用户即可与 Syngress 网站进行交互。如果没有这项服务，人们将记住每个网站特殊的
    IP 地址。这意味着人们需要记住 `69.163.177.2`，而不是 `syngress.com`。手动配置网络网卡需要 `DNS` 或域名服务器的标识符。


    ## DHCP

    对于纯粹的系统魔法，没有能比得上 `DHCP` 的。对于设置了自动配置 `DHCP` 的 PC，客户端只需连接到运行的系统链路并开始工作即可。这是在 PC
    在系统上启动通信时，通过发送寻找 `DHCP` 服务器的通信请求来实现的。服务器响应并向请求的 PC 分配配置方案。这包括 PC 的 IP 地址（仅限网卡，但在本文解释中这有点太细了）、默认网关、域名服务器（或多个服务器）以及默认子网掩码。


    通常情况下，这是配置网络网卡的极佳方法。如果你正在进行渗透测试，使用 `DHCP` 配置网卡会向所有人报告你正在进入系统，这通常不是一件值得感谢的事。


    ## 基础子网划分

    子网划分是一个可能让许多人困惑的主题，因此在书中，子网划分被描述为以理想方式组织网络的最佳方法，以节省 IP 地址。这是通过应用掩码实现的，掩码会过滤 PC
    IP 地址的一部分，允许系统被识别出来。回到 Syngress 模型，IP 地址为 `69.163.177.2`，如果我们处于一个少于 255 个客户端的小系统中，我们可以使用
    C 类子网掩码 `255.255.255.0`。在应用掩码时，地址的某些被置零而其他部分被保留，使得系统上的 PC 知道自己处于哪个系统。再次，子网掩码的一个基本示例仅使用
    `255` 和 `0` 两个数字字节；因此，为了区分系统，任何与 `255` 关联的地址部分都不会发生变化，因此 IP 地址的前三个字节（`69, 163,
    177`）都与 `255` 关联，从而允许这些数字通过验证。任何与 `0` 关联的数字都会完全置零，因此地址的最后一个字节（即 `2`）会被偏移导致变为 `0`。因此，通过将
    `255.255.255.0` 子网掩码应用于地址 `69.163.177.2`，我们发现系统地址是 `69.163.177.0`。在大多数小型系统中，`255.255.255.0`
    子网掩码运行良好，而较大的系统将需要不同的子网掩码，以便为特定数量的网络主机提供服务。


    ## Kali Linux 默认设置

    如前所述，大多数渗透测试工程师和白帽程序员不需要他们的网卡在 PC 连接系统时报告其在系统上的身份。这正是 Kali Linux 在配置并连接到系统时所执行的。在进行渗透测试时，必须在连接到系统之前禁用网卡以避免这种不必要的额外通信。通过包含硬盘、优
    盘或 SD 卡的自定义引导，这种自动系统配置可以更改。另一种更改方法是构建用于手动系统设置的自定义 Live 系统。这些技术都将在第 5 章“调整 Kali
    Linux”中进行。


    ## 使用图形用户界面配置网络接口


