    Till now we have discussed shell and scripting. But, what about `BASH`? As we
    have already discussed earlier, `BASH` is a default form of interpreter for many
    Linux or GNU based systems. That is the reason why our last shell script worked
    even without the definition of `bash` as the final interpreter.


    For finding out what is the interpreter by default you can execute this command:


    ```bash

    $ echo $SHELL

    ```


    ```

    /bin/bash

    ```


    You can also find out several other interpreters of shell, like C shell, Korn
    shell and various others. To define the script interpreter as `BASH`, you will
    need to locate first a complete path for its executable binary by using the command
    `which`. This command needs to be prefixed with shebang or `# !`. You will need
    to insert this at the very first line of the script. There are other methods for
    defining your shell interpreter, but this is regarded as the best option.


    ## File permissions and names


    In order to execute the shell script, your file needs to be in executable form
    by using the command `chmod +x FILENAME`. Any form of newly created files will
    not be in the executable form by default, regardless of the suffix of the file
    extension. On the systems based on Linux or GNU the command `file` is used for
    identifying the file type.


    ## Execution of script


    In simple terms, a bash script is nothing but a simple text file which contains
    instructions which need to be executed in proper order from the top to the bottom.
    The way in which the instructions are interpreted depends on the defined shebang
    or the process in which the script is being executed.


    There is another method of executing the bash scripts in which the bash interpreter
    is called in explicit order such as by `$ bash date.sh`. By calling out the binary
    executable in explicit form, the file content of `date.sh` is being loaded up
    and then interpreted as the bash shell script.


    ## Simple Backup Shell Script


    Any of the commands which can be executed successfully via the bash shell terminal
    can be in the similar form which is being used as a part of the shell script of
    bash. There is no proper differentiation between the direct execution of command
    through the terminal or within a script of shell away from the fact that script
    shell offers a non-interactive form of execution for the various commands within
    a single process. Most of the commands accept arguments and options. The command
    options are being used for modifying the behavior of the commands for the purpose
    of producing alternative form of output results which are prefixed by `-`. The
    arguments can specify the execution of commands for the target like directory,
    file, text and others.


    You can use the command `man` for displaying the manual page of any of the desired
    command. For instance, in order to display the manual page for the command `ls`
    you can execute the command `man ls`. For quitting the manual page you can press
    the key `q`.


    ## Variables


    Variables can be regarded as the prime essence of programming. This allows the
    programmers to store up the data, reuse and then alter the same throughout the
    complete script. You can create a brand new script such as `welcome.sh` by using
    variables.


    ## Input and Output


    The commands which are executed on the Linux/GNU command line either require input,
    produce the output or display an error message. This is a very basic concept of
    shell scripting along with working with the command line of Linux or GNU in general.
    Each time you execute a command, there are three possible outcomes: The first
    possibility is it will be producing an output, the second possibility will be
    generating an error and the third possibility might not produce any form of output.


    # Chapter 7: Basics of Networking


    In today’s world where everything comes with the touch of technology, networking
    has turned out to be a mandatory component for setting up a new business or organization.
    Networking helps in seamlessly connecting with a set of related devices or systems
    with the endpoints or rather the host or master system via various forms. It holds
    a very important position for all providers of services, businesses and the consumers
    all around the globe to communicate and interconnect with each other at the same
    time.


    The concept of networking comes along with almost everything such as text messages,
    calling on the telephone, streaming of video and many more.


    The operation of networks comes along with some serious set of skills which largely
    depends on its complexity. For example, in a large enterprise where there are
    several nodes along with requirements of network security such as functioning
    of the administrator, encryption and various others. On the other hand, any person
    who just uses networking along with the internet for day to day work at home can
    set up easily along with troubleshooting of the several problems of basic nature
    within the nature of wireless networks.


    ## Networking basics


    For properly understanding the functioning of networking along with its components,
    you will need to know about the basics. A network of computer systems is built
    up of several elements which help in the overall functioning.


    ## Types of networking


    Networking of computers can be classified into two main categories: wired and
    wireless. While talking about a wired network, it requires a physical form of
    network which is needed for the transportation of information between the two
    nodes. For digital communication in business places and homes, Ethernet cables
    are being used owing to their overall cost-effectiveness along with durability.
    Today, optical fibers are also being used for transportation of data across long
    distances.


    Optical fibers also offer a faster rate of speed than Ethernet cables. However,
    Ethernet cables are much cheaper when compared with optical fibers.


    In a wireless form of networking, radio waves are utilized for data transportation
    through the air. In this, the devices are connected to one another without any
    type of cables in between them. Wireless LAN is being used most widely for the
    purpose of wireless networking. There are various alternatives which can be found
    today like Bluetooth, satellite, cellular, microwave and various others.


    After various practical experiences, it has been found that the wired form of
    networking comes with much better speed and security plus reliability as compared
    with the wireless mode of networking. But, with wireless networking comes greater
    probability of scalability, mobility and flexibility than the wired form of networking.
    Both types of networking are being classified in accordance with the physical
    layer of the networks. It can also be differentiated according to the build and
    design structure of the networks, network overlay and approaches which are made
    for encompassing SDN. The networks can also be categorized by the scale, WAN,
    LAN, network storage area, environment and various other aspects.


    ## Networking system and its types


    When you come across networking systems you will find two different types: open
    and closed. Within an open system, the whole system stays connected with the network
    which is ready for any type of communication. In a closed system, the system stays
    unlinked with the network and you will not be able to connect with the network.


    ## Components of networking


    The system of networking requires the infrastructure of a proper physical form
    of network. It consists of several networking components like switches, routers,
    access points and also some basic form of firmware which ultimately helps in the
    operation of the other connected components.

