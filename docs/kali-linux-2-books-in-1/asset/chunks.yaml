    你可以通过简单输入 `env` 来查看所有的环境变量。你需要了解，所有可用的环境变量都是大写的，例如 `PATH`、`SHELL`、`HOME` 等。你也可以创建自己的的一组用户定义变量，这将在稍后进行讨论。命令列表将打印出你系统特有的各种变量。在大多数情况下，此命令列表非常长，无法在单个页面中显示。要逐行查看所有变量，你可以使用
    `More` 命令来打印输出。


    在使用 `More` 命令后，整个变量列表将填满一个屏幕并停止。它将等待你按下 `Enter` 键以进到下一行。你可以一直这样做，直到找到你正在寻找的任何变量。当你连续多次按下
    `Enter` 键时，你会发现一个名为 `HISTSIZE` 的变量。当你再次按下 `Enter` 时，它将一个接一个带你查看这些每一个变量。当你使用 `More`
    命令查看输出时，可以输入 `q` 退出，然后返回命令提示符。


    与其通过滚动这个长变量列表来寻找你感兴趣的变量（这是一项枯燥的工作），你也可以使用 `grep` 命令，它作为一个过滤命令，将帮助你轻松找到所需的变量。


    ## 查看变量的值


    `set` 命令将显示所有变量的，但如果你想查看存储在变量中的值，你需要输入关键字 `echo`，后面需要跟上 `$` 符号以及变量名，例如：


    ```

    echo $HISTSIZE

    ```


    `$` 符号表示你想要操作内部可用的变量值，而不是变量的标签。


    ## 导出环境变量


    当你修改任何环境变量时，该修改仅对特定的环境 set 有效。在这种情况下，该环境是 `BASH` shell。这意味着当你关闭终端时，你对这些变量所做的任何修改将丢失，并恢复到默认值。


    如果你希望新的变量值在你的下一次终端会话以及之后的终端会话中保留，你需要导出这些变量。你可以认为这是将全新的变量值从当前变量导出到剩余系统中，以确保它在每个环境中可用。你可以通过以下方式轻松地做到：


    ```

    export HISTSIZE

    ```


    现在，当你离开环境时，`HISTSIZE` 的变量值被设置为零。然而，你可以通过输入内容轻松将 `HISTSIZE` 的值恢复到原来的设置，例如 1000：


    ```

    HISTSIZE=1000

    export HISTSIZE

    ```


    ## 修改 shell 提示符


    Kali 默认 shell 提示符格式如下：


    `username@hostname:present_directory>`


    如果你是 root 用户，提示符将翻译为：


    `root@kali:present_directory`


    你也可以更改命令提示符，这默认是设置 `PS1` 变量的值。这个特定变量带有一组特定的占位符，用于放置在提示符中的所有信息。它包括：


    - `\u`: 当前用户名

    - `\h`: 主机名

    - `\W`: 当前工作目录


    你可以通过以下方式在终端中为 `PS1` 更改提示符：


    ```

    PS1= “Best Man:#”

    ```


    现在，每当你打开终端时，它都会首先显示 Best Man。你需要注意的是，当你打开第一个终端（即 `PS1`）时，提示符将是 Best Man，但第二个终端数字仍然是由默认提示符设置的。


    ## 修改 PATH 变量


    `PATH` 变量被认为是所有中最重要的。这个变量最终控制了 shell 查找你输入的命令（如 `ls`、`cd`、`echo` 等许多命令）的位置。如果
    `BASH` shell 无法在你路径的任何目录中找到你的命令，它将返回“command not found”的错误信息。如果你想将一个名为 `newtool`
    的全新工具安装到目录 `/root/newtool` 中，你可以通过输入将其添加到 `PATH` 变量中：


    ```

    PATH=$PATH:/root/newtool

    echo $PATH

    ```


    新工具将被添加。


    # 第 5 章：Kali Linux 的现实应用和其他实用工具


    如果你想成为一名伦理黑客，它不像成为软件开发人员或程序员那么容易。伦理黑客也称为渗透测试员，需要对各种领域有适当的理解。


    你不仅需要各种编程语言（如 `C++`、`C` 和 `Python`）的深入知识，还需要关于 Linux 环境的高级知识来开始伦理黑客。


    Kali Linux 是一个 Linux 发行版，带有大约 600 个预装工具，专门用于渗透测试。作为渗透测试世界的初学者，这听起来可能令人厌烦。一个初学者如何学会使用所有
    600 个工具呢？然而，所有工具背后的真相是，你不需要掌握所有的工具。这主要是因为 Kali Linux 带有各种具有相同目的和概念的工具。让我们来看看 Kali
    Linux 为伦理黑客目的提供的一些最佳工具。


    ## MacChanger


    MAC 地址可以被任何系统的合法地址。有许多原因导致更改 MAC 地址很重要。MacChanger 有助于在渗透测试期间更改 MAC 地址，例如对开启了 MAC
    过滤的任何无线网络进行渗透测试。使用 MacChanger 需要遵循此命令：


    ```

    ~$ macchanger [options] networkDevice

    ```


    可用的选项有：


    - `-h, --help`: 打印帮助

    - `-V, --version`: 打印版本后退出

    - `-e, --ending`: 不更改厂商的字节

    - `-s, --show`: 打印 MAC 地址后退出

    - `-a, --another`: 设置类似的随机厂商 MAC

    - `-p, --permanent`: 重置为原始形式的永久硬件 MAC

    - `-A`: 设置任意类型的随机厂商 MAC

    - `-r, --random`: 设置完全随机类型的 MAC 地址

    - `-l, --list`: 打印已知的厂商

    - `-m, --mac=XX:XX:XX:XX:XX:XX`: 将 MAC 地址设置为 XX:XX:XX:XX:XX:XX


    ## Nmap


    它作为一个网络映射工具工作。它允许用户发现任何网络内活动的主机，然后收集与渗透测试任务相关的所有形式的信息。该工具的主要功能是：


    - 它有助于主机发现。它可以轻松识别网络中的主机。

    - 它具有端口扫描功能。它允许你列出远程或本地主机上所有开放的端口。

    - 它有助于收集与任何连接设备的操作系统以及硬件相关的信息。

    - 它还有助于确定任何应用程序的名称和版本。

    - 它通过 Nmap 脚本引擎 `NSE` 扩展了 Nmap 的默认功能。


    ## Netcat


    这是一个网络探索工具，在安全领域闻名，并在系统和网络管理领域为人所知。它主要用于检查入站和出站网络以及探测端口。与 `C` 或 `Perl` 等编程语言或
    `BASH` 脚本一起使用时也有用。该工具的主要功能是：


    - 它对 `TCP` 和 `UDP` 端口进行分析。

    - 它对入站和出站网络进行嗅探。

    - 它有助于 `DNS` 的反向和正向分析。

    - 它对远程和本地端口进行扫描。

    - 它与标准终端输入完全集成。

    - 它带有 `TCP` 和 `UDP` 隧道模式。


    ## Unicornscan


