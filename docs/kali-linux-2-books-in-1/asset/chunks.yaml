- fmt: '

    You will need to enter your password here and then hit Enter. The process of uninstalling
    the program will start and the summary of the required actions which needs to
    be taken will be displayed on the screen. If you are asked if you want to continue
    with the process, type ‘y’ and then hit Enter. The process will continue. After
    the process is over, type ‘exit’ in the prompt and then hit Enter. It will close
    the terminal window. In case you do not want to wipe out the files of configuration,
    you will just need to leave out the `--purge` command:


    ```

    sudo apt-get remove gimp

    ```


    When you are uninstalling any program, there might be other packages on which
    the uninstalled set of program was dependent. F


    For removing any of the unused packages in the systems, you can use `autoremove`
    command:


    ```bash

    sudo apt-get autoremove

    ```


    You can also combine two commands together for the purpose of removing any program
    along with its dependencies which are not used any longer by:


    ```bash

    sudo apt-get purge --auto-remove gimp

    ```


    In case you are running out of space in the system, use the command `clean` for
    removing all the downloaded files of archive:


    ```bash

    sudo apt-get clean

    ```


    This command will also be removing the cache in `/var/cache/apt/archives/`.


    So, installing and uninstalling software on Linux is a very easy and simple job
    using the command line.


    # Controlling Files and Directory Permissions


    For most users of Linux, getting used to permissions and ownership of the files
    might be a bit challenging. It is assumed that for this usage level, using the
    command line is a must. Although there are several other more powerful and flexible
    options available, opting for the complicated commands is not always necessary.
    With help from some of the user-friendly interfaces of desktop, you can easily
    move to little or no usage of command line. It is possible to manage file ownership
    and permission as well.


    The management of folders and files can be easily done from the inside of the
    file managers only. But, right before we get away with GUI, you will need to have
    a concrete understanding of what it is doing. So, let’s start off with the command
    line.


    ## Command line: File permissions


    The commands associated with modification of file ownership and permissions are:


    - `chmod`: For changing the permissions

    - `chown`: For changing the ownership


    Neither of the two commands is difficult to use. It is really important for you
    to understand that the sole user who can actually change the permissions or ownership
    of the files is the root user or the current owner. So, in case you are user B,
    you will not be able to make any changes to the folders and files which are owned
    by A without seeking help of the root or `sudo`. For instance:


    A new folder has been created on a partition of data known as `/DATA/SHARE`. Both
    users A and B require write as well as read permissions for this folder. There
    are various ways in which this can be achieved. If A and B are the only two users
    on the present system, you can easily change all the permissions of the files
    and folders for giving them access. You can do this with the command:


    ```bash

    sudo chmod -R ugo+rw /DATA/SHARE

    ```


    In this command, the breakdown of each and every command will be:


    - `sudo`: This command is used for the purpose of gaining overall administrator
    rights for the command on any form of system which employs `sudo`.

    - `chmod`: this command is used for modifying the permissions.

    - `-R`: This command modifies all the permissions of the parent state of folder
    along with the child objects which are in it.

    - `ugo+rw`: This command provides group, user and other write and read access.


    In this command, `u` stands for user, `g` for group and `o` for other. The `o`
    or other entry is the most dangerous of all as it will be giving permissions to
    everyone for the files and folders. The permissions which can be provided for
    a folder or file are:


    1. `r`: read

    2. `w`: write

    3. `x`: execute


    The use of the switch `-R` is very important. In case you have various sub-files
    and folders within the directory `SHARE` and you want the permissions to get applied
    from the parent object to the following child objects, you have to use `-R` switch
    to make sure that the same permissions are being applied down to the deepest folder
    contained within the object of parent.


    ## Command line: Ownership of file


    Changing the file and folder ownership is also very easy and simple. Suppose A
    moved out a folder for B into the directory named `SHARE` but A still has the
    ownership. This whole thing can be modified by using a very simple command:


    ```bash

    sudo chown -R B /DATA/SHARE

    ```


    This whole command line can be broken down like:


    - `sudo`: This command holds the administrator rights as you are dealing with
    a file or folder which is owned by another user.

    - `chown`: This command is used for changing the ownership.

    - `-R`: This command acts as the recursive switch for making sure that all the
    child objects obtain the same changes of ownership.

    - `B`: This is the new owner of the file/folder.

    - `/DATA/SHARE`: This is the directory which is being modified.


    ## GUI: Permissions for files


    Suppose you need to allow everyone to gain permissions of write and read for the
    folder `EXAMPLE`. For doing this within the file manager of your Linux distribution,
    you are required to follow all the following steps:


    - Open your Linux distribution.

    - Navigate to the file or folder which is the target in this case.

    - Right click on that folder or file.

    - Click on `Properties` from the menu.

    - Select the `Permissions` tab.

    - Select the `Access Files` option in the `Others` tab.

    - Click on `Create and Delete Files`.

    - Select `Change Permissions` for the enclosed files.

    - A window will pop up where you need to select `Read` and `Write` option under
    the tab of `Files` and `Create and Delete Files` under the `Folders`.

    - Select `Change`.

    - Click on `Close`.


    The trick comes into play when you need to modify the permissions for a folder
    which does not even belong to you. For doing this:


    - Open up the terminal window.

    - Enter the command: `sudo -i`.

    - Enter the command: `Nautilus`.


    The command `sudo -i` will give you a persistent form of access to `sudo` unless
    and until you enter the command `Exit` for removing the access. Once `Nautilus`
    is opened, you can easily modify the permissions for the folder or file, even
    if the file or folder does not belong to you.


    ## GUI: Ownership modification


    You can change the ownership for a file through `Nautilus` by following these
    steps:


    - Locate the file or folder in the window of `Nautilus`.

    - Right click on the file/folder.

    - Select the `Permissions` tab.

    - Click on `New Owner` from the drop-down menu of `Owner`.

    - Select `Close`.


    # Managing User Environment Variables


    The most common area in which newcomers to Linux find hardest to manage the user
    environment variables might also be the most obscure of all. Although the environment
    of Windows comes with environment variables, most of the users manage their own
    variables. For getting the most out of Linux OS, you will need to understand as
    well as manage all the environment variables in the very first place for the optimal
    form of performance, convenience and stealth. The environment variables are the
    form of variables which are being used in the specific user environment. In majority
    of the cases, the environment will be the shell of `BASH`.


    Every user along with the root comes with a specific set of environment variables
    which are all set at some default values until they are modified. You can easily
    change all these values for the purpose of making your system perform more efficiently
    and also customize your working environment.


    ### Viewing the environment variables

