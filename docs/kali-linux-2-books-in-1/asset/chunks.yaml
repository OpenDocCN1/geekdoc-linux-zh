    # Programming in Linux Using Java


    Java is one of the most popular languages of programming. It is widely used for
    the purpose of developing software for almost everything starting from cell phones
    to the cable TV boxes and extending its use to the large systems of enterprise
    information. The overall concept behind writing the source code of Java, compiling
    and then running it is more or less the same across most of the OS.


    Java is a programming language which was originally developed by Sun Microsystems.
    It falls under the category of compiled form of programming language in which
    the programmer writes up the source code and then submits the same to the compiler
    which will be checking out the syntaxes of the program and will generate a complete
    file which you can run. For instance, when you are using Google Chrome web browser,
    you are in true sense running all the programs which have been generated from
    a compiler which is used by the software developers.


    To a wide extent, the programming languages of the past needed you to re-compile
    all the source code for every new OS in which you wanted to run your program on.
    For instance, a program which has been compiled for running in Windows will not
    be running on a system which has Linux in it unless it has been re-compiled. Given
    the wide differences in the OS and the elements of hardware, this process was
    very difficult and complicated to carry out. One of the major motivations for
    Java was the motivation of being able to write only one single set of source code
    and then provide the resulting program with the ability to run on some different
    set of operating systems or environments of operation.


    Java comes with write once and then run anywhere capability only because of the
    way in which the compiler translates the entire source code in a particular file
    known as Byte Code file which can then run under any form of supported `JRE` or
    Java Runtime Environment.


    The development process of Java involves these steps:


    - Write down the Java source code and then save it in one or more plain text files.
    All of these files generally come with `.java` format at the end.

    - Run the compiler of Java (`javac`) for compiling the source code which you have
    written into a file of Byte Code. The Byte Codes generally have `.class` at the
    end of the name of the file.

    - Run the program after submitting the byte code to a `JRE`.


    ## Downloading Java Development Kit


    For doing any of the programming stuff with Java, you will need to download, and
    then install, Java Development Kit or `JDE`. In most cases, when you come across
    the installation of Java in a system it means the installation of Java Runtime
    Environment or `JRE`. In this example, you will need `JDK` which comes with a
    special type of program named as `javac` which is used for compiling the Java
    source codes into the class files. You can download `JDK` from the official website
    of `Oracle`.


    While downloading the `JDK`, make sure that you download the one which matches
    with the operating system that you are currently using. In this case, if you are
    using Linux, download the file which is supported by Linux OS. Most of the distributions
    of Linux like Ubuntu, Debian, Red Hat and others, come with a tool of software
    repository which helps in automating the installation along with the download
    steps. For instance, under the distribution of Ubuntu and Debian, the command
    `apt-get` is used for downloading and then installing `JDK` such as:


    ```bash

    sudo apt-get install openjdk-7-jdk

    ```


    For installing the `OpenJDK` under Fedora, CentOS and other distributions which
    use `YUM`, you can use this command:


    ```bash

    yum install java-1.7.0-openjdk

    ```


    Both the `apt-get` as well as `yum` installers will be downloading, installing
    and then configuring the `JDK` without any form of additional task on the part
    of the user.


    ## Writing and compiling Java program


    The programming language of Java is a form of compiled language in which the programmer
    writes up the source code and it is then submitted to the compiler. A compiler
    is nothing but a program which helps in converting source code into Byte Code.


    The Byte Code which comes out as a result is executed with the use of the `JRE`.
    You can write the source code of Java by the use of any text editor, like `Notepad`
    in Windows and in Linux `pico` or `nano` editors which are used for editing the
    files of source code. For starting off with Java program follow these steps:


    - Open up shell prompt in Linux. You can also achieve this by pressing `ALT+Ctrl+T`
    in Linux.

    - Create a new file by using the program `gedit` by simply typing:

    ```bash

    gedit HelloUniverse.java

    ```

    - The `gedit` program will open up and will create a file.

    - Type in your Java source code.

    - After you are done with your source code, make sure that you save it.

    - Exit from the `gedit` program.

    - Now it’s the time to compile the program with the use of `javac` compiler. The
    command will be: `javac HelloUniverse.java`

    - If there is no error in the syntax, the compiler will run smoothly.

    - Now you can run the sample program which you have created by running `Java`
    and then followed by the program name.


    Java programming also includes another component known as the `class`. It is a
    large collection of functions which carries out various work along with templates
    for the various data which might be carried on. In the program example which was
    mentioned just before this, `HelloUniverse` is the `class` of the program.


    # Scripting on Linux Using BASH


    BASH is an interpreter of command language. It is available widely on various
    types of operating systems and it also acts as the default interpreter of command
    for most of the Linux or GNU systems. BASH works with shells. A shell is nothing
    but a macro processor which lets non-interactive or interactive form of command
    execution. In BASH, scripting allows execution of automatic commands which would
    have been otherwise executed one by one in an interactive form.


    ## Basics of Bash Shell


    A shell allows the user to interact with the computer by using the commands. It
    also helps in storing and retrieving data, processing of information and several
    other tasks. For example, you can type in commands such as `cal`, `date`, `pwd`
    or `ls` and then hit the Enter key. What you have just done is interacted with
    the system by the use of the shell to retrieve the present date and time.


    It was done by using `date`, checking out the calendar by using `cal`, checking
    out the location of your present directory on which you are working by using `pwd`
    and then retrieving a complete list of directories and files which is located
    within `ls`.


    ## What is meant by scripting?


    For understanding scripting in the proper way, first use the shell in combination
    with the text editor that you use such as `.vi` for creating a brand new file
    named as `task.sh` which will contain all the commands from above, each of the
    commands on different lines. After you are done with this, you will need to make
    the new file completely executable by using the command `chmod` along with an
    option `+x`. Lastly, all that you need is to execute the new script by prefixing
    the name along with `./`.


    By the use of proper scripting, any form of shell interaction can be scripted
    as well as automated. It is also possible now to execute the new shell script
    `task.sh` automatically daily at any time you want by using `cron` time-based
    scheduler and then store the output of the script to a specific file every time
    it is executed.


    ## Basics of BASH

