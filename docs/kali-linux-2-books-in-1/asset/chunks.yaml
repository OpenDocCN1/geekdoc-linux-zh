    output from some of the commands, like cat for a file and the emulator took some
    time to scroll the entire text. When you use any of these commands, you can scroll
    the texts easily now. The command ‘less’ is newer when compared to ‘more’ so ‘more’
    is not used now.


    ● head/tail: This is also a pair of commands but in this, both have their individual
    uses. The command ‘head’ helps in outputting one number from the first line of
    a file and the ‘tail’ command helps by providing output as a number from the last
    line of any file. The default output number of these commands is ten which can
    be controlled by using the option –n. Another switch which can be used with this
    command is –f.


    ● grep: This command helps by searching the texts for the patterns. By default
    function, this command looks at the standard input but the users can easily specify
    the files which are meant to be searched. The pattern can either be a regular
    expression or a normal string. It can also print out either matching or non-matching
    lines along with the contexts of the same. When you run a command which provides
    lots of information as output, just use this command and see the magic.


    ● sort: This command is used for sorting the text lines according to various criteria.
    The useful switches which can be used along with this command are –n which helps
    in sorting the numeric values of any string, -r which helps in reversing the provided
    output and various others. You can use this command while sorting the output of
    ‘du’ command when you want the files sorted in the descending order exactly according
    to the sizes of the same.


    ● wc: The ‘wc’ command is used for counting the words, the lines, the bytes and
    characters.'
