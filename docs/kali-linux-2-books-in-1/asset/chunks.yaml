- fmt: '

    - `watch`: This command performs as a very beautiful program which periodically
    executes a program and also outputs the contents of the same on full screen. In
    case you place the command within inside quotes, you can also run more than one
    command at a time such as `watch –n 1 ‘ ls –la ; echo ; vmstat ; echo; df ’.`.
    This whole command will be executing a full listing, displaying the statistics
    of memory along with the disk space. All of these will be separated with empty
    lines and will repeat after every second. It is a great way of watching large
    files get copied and also keeping an eye on the disk space so that it does not
    come up with any form of issue.

    - `curl`: Most of the PHP developers are acquainted with the cURL extension of
    php which is also available for the command line of Linux. In place of writing
    any other additional program of php, you can simply use this command line. All
    the options which you will need are available. Enter `man curl` and you can find
    out all the possible tools.

    - `logsave`: This tool is very important in nature and it helps by capturing the
    output from a program and then sends the same as a log file. It also adds a timestamp
    of beginning and end. You can add up the `–a` parameter for appending the log
    file.

    - `lsof`: This command stands for list open files. It displays all the files which
    the system has opened up currently. It is very helpful for figuring out which
    processes use one certain file or also for displaying all the available files
    for one single process.

    - `strace`: The `strace` command helps by tracing all the calls of the system
    which are made by a particular program to the kernel of Linux. This indicates
    that you can see when a program is opened, closed, read, writes, access the files
    and many others. It is somewhat like running an entire program without any form
    of cover. For example, `strace –ff –e trace=open /usr/sbin/apache 2` will strace
    the apache2 program and will also output all the open calls.

    - `z* tools`: You will often need to diff, grep or cat the files which are compressed.
    In place of the unpacked files, you can treat the files as being unpacked already
    simply by using the command `zgrep` in place of `grep`, `zdiff` in place of `diff`
    and `zcat` in place of `cat` and various others.

    - `iconv`: This command helps in converting a file which is encoded in one way
    for converting the same in some other format.

    - `nc`: This command is capable of doing everything and can also be used for checking
    the requests of service and for making sure the correct headers have been sent
    out.


    # Finding Stuff


    Most of the people use graphical file manager for finding out the files in Linux
    like Nautilus in Gnome, Thunar in Xcece and Dolphin in KDE. However, you can also
    use the command line for finding out various stuff in Linux which does not even
    depend on the type of desktop manager that you use.


    ## Using the command `find`


    The command `find` will allow you to search for the files for which you already
    know the probable filenames. The command in its simplest form searches for all
    the files within the present directory and then through the sub-directories of
    the same depending on your search criteria. You can search out for the files by
    using the name, group, owner, type, date, permissions and various other criteria.
    Enter a dot (`.`) after the command as `find.` which will be listing all the files
    in the present directory which has been found. In order to find a file which matches
    with some particular pattern, you can use the argument `–name.`. You can provide
    the metacharacters of the filename like `*` but you will need to put `\` in front
    of them or enclose the same within quotes. In case the `find` command cannot locate
    any of the files which are matching with your criteria, it will produce no output.


    ## Using the command `locate`


    The command `locate` is much faster when compared to `find` as it employs a past
    built database, where the command `find` searches within the real system along
    all the actual files and directories.


    This command returns a large list of all the names of the paths which also contains
    the specific character groups. The simplest form of this command finds out all
    the files within the file system which starts at the root. In case you want to
    find all the directories or files which contains the proper and only the criteria
    of search which you have provided, use the argument `–b` along with the command
    as: `locate –b ‘\yourdata’`. The backslash which has been used in the command
    line acts as a globbing character which gives a way for expanding the characters
    of wildcard within a file name of non-specific nature into a set of filenames
    of specific nature.


    A wildcard is nothing but a symbol which can be easily replaced by one or more
    than one characters when the overall expression is being evaluated. The most widely
    used form of wildcard symbols are `?` which indicates one single character and
    `*` which indicates a long string of characters. The command `mlocate` is a new
    form of the `locate` command. It helps in indexing the complete file system. However,
    the results of search include only the files which the current user has access
    to. Whenever you update the database of `mlocate`, it will keep the timestamp
    information within the database.


    ## Using the command `which`


    This command returns the exact path of the executable which is being called when
    any command is issued.


    The `which` command is very useful for finding out the location of any executable
    for the purpose of creating a shortcut of the program on the user desktop, on
    any panel or on some other place within the desktop manager. The `which` command
    by default will only display the first executable which is matching. For the purpose
    of displaying all the executables which are matching, you need to use the option
    `–a` along with the command.


    # Modifying Files


    One of the many things that Linux along with various operating systems provides
    is the tools needed to create as well as for edit the text files. There are various
    text editors that can be found today and every Linux user has their personal favorite.
    Let’s have a look at some of the most famous text file editors in Linux.


    ### Text editors


    If you are a Windows user then you must be familiar with the classic text editor
    known as Notepad. Linux also offers users somewhat similar programs such as `gedit`,
    `NEdit` and `geany`. All of these programs are absolutely free and each provides
    more or less the same service. Such programs come with the facility of syntax
    highlighting which readily helps in editing the source code along with the documents
    which are written in any markup language like CSS or HTML.


    - `NEdit`: This is a form of straightforward text editor which is more or less
    like the Windows Notepad. It comes with Motif-style of the interface.

    - `Geany`: It is a Linux text editor which is not similar to the Notepad++ from
    Windows. It comes along with a tabbed form of interface for the purpose of working
    with various open files at one time and also comes with other features such as
    displaying the line numbers in one margin. It uses up the interface toolkit of
    GTK+.

    - `Gedit`: This is the default form of text editor for the GNOME desktop environment.
    It is one of the best text editors which can be easily used on any type of Linux
    based system.


    ### Text editors based on terminal


    When you are working from the Linux CLI, you have a wide range of choice in text
    editors. Let’s have a look at some of them.


    - `pico`: This text editor started off as the editor which was built in the email
    program which was also text based known as `pine`. This text editor was eventually
    packaged as one stand-alone program for editing and modifying the text files.
    The modern-day version of this text editor is known as `alpine`. On the system
    based on Linux, you can install this text editor by using the command:

    ```

    sudo apt-get install alpine-pico

    ```

