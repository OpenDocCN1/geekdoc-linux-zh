    从协会网站服务器移动的文档将被放入一个带有复制站点名称的信封中。在复制站点时，下载由 `PHP` 创建或包含 `PHP` 的页面时可能会出现错误。这是因为生成页面的许多代码是由站点页面背后服务器的某些需求激增的内容生成的，而大多数站点克隆应用程序无法访问这些区域。


    当下载记录时，非常重要的一点是不要让其他人查看，例如重新发布该站点，这将构成对版权法的侵侵害。


    # Google 搜索


    Google 搜索的方法是使用引导的管理员来引导通过 Google 进行逐项查找。初次使用 Google 搜索的人可以从位于 [`http://www.google.com/advanced_search](http://www.google.com/advanced_search)
    的`Google 高级搜索`页面开始。该页面将帮助新手搜索者完成基本任务。页面的顶部部分将通过包含和排除单词及数字来协助查找网页。页面的底部将帮助利用 Google
    管理员筛选结果。搜索者可以使用此页面上的任何字段组合来构建将要使用的查询字符串。使用多个一个字段将产生一个日益不可预测、但逐步深入的查询字符串。


    ## 包含这些所有词


    此字段可用于查找包含交换框中输入单词的页面，而不忽略这些单词在网站页面上的位置。这些单词不需要在请求中组合或相邻，只需在页面的某个地方即可。要进行此查询，在对话框中输入各种术语并点击`高级搜索按钮`。通过这样做，开发搜索页面中输入的单词被转换为查询字符串，然后发送到
    Google，就像它们是直接在 Google 首页的搜索字段中输入的一样。


    ## 确切的单词或短语


    在此选项左侧的字段中输入查询词将导致 Google 网页搜索工具发现与输入请求完全相同的单词或表达式。与“包含这些所有词”搜索不同，只有在精确请求中且相邻包含该短语或单词的网页会被包含在结果集中。此查询通过在语句内部设置搜索词来工作。


    ## 词词中的任何一个


    使用此字段时，Google 搜索将发现包含任何一个单词的页面。与“包含这些所有词”字段完全不同，返回的页面并不包含所输入的全部单词。此查询通过在查询框中的术语之间放置
    `OR` 连接符来实现。


    ## 不包含这些词


    在此内容框中输入的单词将用于从随后的 Google 搜索中排除页面。任何包含输入单词的页面将从结果集中剔除。此查询通过在结果集中不需要单词或术语之前放置一个短符号来实现。


    ## 数字范围


    通过使用此处的两个内容字段，搜索将发现具有输入范围范围内数字的页面。这种搜索可以通过包含单位来增强，例如，磅 (`lb`)、英里或毫米 (`mm`) 或货币如
    `$`。此查询可以通过在主搜索框中在两个数字之间设置两个句点来引导。


    ## 语言


    通过下拉选择器选择语言，随后的页面大部分将使用所选语言。此查询限制器可以用于将结果限制在目标所在地通常通用的语言编写的页面上。例如，通过关注德国网站，正在对德国公司进行渗透测试的小组可以可能地找到与此特定任务相关的信息。


    ## 地区


    通过下拉选择器选择地区，随后的页面将来自分布在所选区域的站点页面。如果使用下拉菜单产生选择，则使用所选区域的搜索结果将包含分布在该地区的页面，而不太考虑所使用的基本语言。通过同时选择语言和地区，可以引导一个逐步深入的搜索。


    ## 最后更新


    通过下拉菜单中选择时间限制，只有在所选时间范围内更新的页面会被记录。这将确保旧的页面被排除在结果之外，并可用于确保随后的页面是在某个关键事件之后。例如，如果渗透测试的中心协会最近完成了与另一家公司的合并或收到了其他创新，搜索可以限制在自事件发生以来，以确保查询结果具有更高的相关性。


    ## 站点或域名


    此内容框在缩小目标列表项目可能是最有用的工具之一。例如，寻找政府协会可能会通过将结果限制在 `.gov` 空间而获益，而寻找 Foo 公司可能会通过将结果限制在
    `foo.com` 区域而获益。这种限制也可以在基础 Google 搜索内容框中通过使用限制器 `site` 后跟结果集中应返回的区域或空间来实现。例如，使用
    `site:foo.com` 将结果限制为仅来自 `foo.com` 区域的页面。


    ## 出现的词


    使用此下拉菜单可以将搜索问题聚焦在页面的特定部分。明确选择“页面上的任何位置”将在整个互联网目标页面运行搜索，对查询问题关注的位置没有实际限制。


    使用“在页面标题中”的搜索将仅关注网页的标题。


    具体来说，页面标题是显示在浏览器浏览器标签页中的网站页面部分。此查询也可以通过在搜索框中使用 `intitle: administrator` 在 Google
    主页上进行引导。


    使用限制器“在页面内容中”将搜索限制为仅限页面内容。它将阻止图片、记录和如标题之类的页面结构等内容。如果这些内容写在页面内容中，查询将在结果中恢复这些内容。例如，如果页面内容中引用了图片，则该图片将返回在索引列表中；这对于内容中的图片标记和链接也有效。在
    Google 搜索框中使用 `intext: administrator` 等同于从下拉菜单中选择此选项。


    使用“在页面 URL 中”将搜索限制到页面统一资源定位符 (URL)。URL 是显示在浏览器浏览器位置框中的站点页面位置。最后，使用“与页面的链接中”将发现连接到查询标准的页面。此查询可以通过在主
    Google 搜索框中利用 `inurl: administrator` 来引导。


    # 安全搜索


    安全查询有两个选项：“显示最相关的结果”和“过滤明确内容”。过滤显式设置可以从索引列表中减少显式内容的记录和图片。选择显示最相关的结果不会为显式内容过滤结果。


