    # Chapter 6: Programming Linux


    Programming on Linux is used for creating interfaces, applications, software and
    programs. Linux code is often used for the desktop, embedded systems as well as
    for real-time programs. Linux is an open source OS kernel which is compatible
    with `Perl`, `C++`, `Java` and various other languages of programming.


    ## How does Linux work?


    Linux functions as the kernel of an OS which can also be distributed and shared
    freely. An operating system or OS is that interface which helps in connecting
    the users with the hardware of the computer and also supports the running of the
    applications and programs. Kernel is nothing but the OS core as it manages all
    the communication between the components of hardware and software.


    ## What are the functions of the Linux programmers?


    Starting off with Linux programming employs tools such as `GBU` compiler and debugger.
    They help in creating applications for the storage of data, construction of `GUI`
    and also script writing. More advanced applications related to Linux allow the
    programmers to develop software related to Linux. They also optimize the programs
    which are already existing and also write new programs with various complex form
    of features such as multiprocessing, multi-threading, inter-process communication
    and also interaction of hardware device.


    ## Uses of Linux


    Linux is widely used today in various servers, computer security systems and architecture
    of computer system. It is widely used in real-time programs along with the embedded
    systems of `PDAs` and cell phones. Linux programming has also resulted in various
    applications.


    ## How to develop the modules of Kernel?


    Before you start off with core programming in Linux, the best way of increasing
    your knowledge along with expertise of Linux programming is to start working on
    the kernel module. The modules are developed independently which works with the
    Linux kernels for functioning as a compact operating system. The kernel modules
    consist of various things such as drivers of devices for the several peripheries
    of hardware, file managers and other low-level features of the OS.


    The only barrier that comes at the entry of kernel module is much lower in rate
    than there are for working on the kernel of Linux. There are several modules which
    are being developed by various individuals and teams. So, there is no specific
    gatekeeper at the entry of development.


    ## Logical Breakdown of Programming in Linux


    When you are using some of the major forms of operating system then you are interacting
    indirectly to the shell. If you are using `Linux Mint`, `Ubuntu` or any other
    proper distribution of Linux, you will be interacting with the shell every single
    time you will use the terminal. Let us discuss the breakdown of programming in
    Linux which consists of Linux shells along with scripting of shell.


    So, before we start, you will need to get acquainted with some of these terminologies:


    - `Kernel`

    - `Shell`

    - `Terminal`


    ### What is a kernel?


    Kernel is nothing but a program which acts as the core of the operating system.
    It comes with overall control over all the elements in a system. It helps in managing
    various resources of the systems based on Linux:


    - Management of files

    - Management of processes

    - Management of `I/O`

    - Management of memory

    - Management of the devices and various other components


    A complete system of Linux can be broken down like: `Kernel + installation scripts
    + other scripts of management + `GNU` system libraries and utilities`.


    ### What is a shell?


    A shell is a special type of user program which helps in providing a proper interface
    to the services related to an operating system. The shells accept commands which
    are readable by humans from the users and then converts those into something which
    can be understood by the kernel. It can be regarded as the interpreter of command
    language which helps in executing the commands which are read from the devices
    of input like the keyboard or from the files in the system. A shell starts when
    a user logs into the system or starts with a terminal.


    A shell can be easily classified into two different categories:


    - Graphical shell

    - Command line shell


    The graphical shells provide various means for the purpose of manipulating the
    programs which are based on the `GUI` or graphical user interface. This is done
    by letting the operations like closing, opening, resizing and moving windows,
    along with switching the focus in between the windows. `Ubuntu` OS along with
    `Windows` OS can be regarded as great examples which provide the `GUI` to the
    users for the purpose of interacting with various programs.


    Shells can be accessed by users by using the `CLI` or command line interface.
    A special type of program in Linux known as the terminal is provided for typing
    in the commands of the humans like `ls`, `cat` and many others and further which
    are being executed. The final result is then displayed directly on the terminal
    which can be seen by the user. Suppose you execute the command `ls` along with
    the option `-l`. This will be listing all the available files within the present
    working directory in a form of long listing.


    Working along with the command line shell might turn out to be a bit difficult
    if you are a beginner only because of the fact that it is tough to memorize a
    bunch of commands at the same time. It is highly powerful in nature and it also
    allows the users to store all the commands within a specific file and then execute
    all of them together. In this way, any form of repetitive task can easily be made
    automatic. All of these files are generally known as `Shell Scripts` in the Linux
    systems.


    In a Linux system, there are various types of shells which are available for the
    users:


    - `BASH`: Also known as `Bourne Again Shell`, it is widely used in the systems
    which are based on Linux. It is being used as the default shell of login in the
    Linux systems. If you want, you can also install this in the Windows operating
    system.

