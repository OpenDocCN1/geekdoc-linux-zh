    - `diff`: 此命令通过逐行比较帮助显示两个不同文件之间的精确差异。


    ## 进程管理 Linux 命令


    - `kill`/`xkill`/`pkill`/`killall`: 所有这些命令都用于杀死并终止任何进程。它们之间的区别在于接受的输入类型不同。`kill`
    命令接受进程 ID（PID），`xkill` 命令允许用户点击窗口来关闭该窗口，而 `killall` 和 `pkill` 则仅接受进程名称。

    - `ps`/`pgrep`: 在之前的命令中已经提到 `kill` 需要进程 ID。这可以通过使用 `ps` 命令来获取，它可以帮助打印与当前活跃进程相关的信息。`pgrep`
    命令的工作方式特殊：你只需要提供进程名称，它将返回进程 ID。

    - `top`/`htop`: 这两个命令的功能相似，都能帮助显示进程。它们也可以被看作控制台系统的监控器。

    - `time`: 此命令作为一个进程运行。你可以将其看作程序执行时的秒秒表。


    ## 用户和 BASH 环境的 Linux 命令


    - `su`/`sudo`: 这两个命令是实现相同目标的不同方式——以其他用户的身份运行命令。完全取决于你所使用的发行版类型，你可能见过其中一个，但实际上这两个命令都是可用的。两个命令之间的区别在于，`su`
    将用户切换到另一个用户，而 `sudo` 仅以其他用户的权限运行命令。

    - `date`: 与 `time` 命令不同，此命令帮助按照标准输出格式打印时间及日期。输出也可以根据用户的指定进行格式化，并包含所有信息：月、日和年。

    - `alias`: 此命令帮助创建和更改指向其他命令的别名。这意味着你可以轻松为新命令提供新名称，或者重命名已有的命令。这对于缩写长命令字符串非常有用，长字符串在记忆时可能会产生问题。

    - `uname`: 它帮助输出系统的一些基本信息。通过将此命令与 `-a` 配合，你可以获取内核信息以及主机名和处理器架构。

    - `uptime`: 此命令将告诉你系统运行持续的时间。它并不重要，但可以帮助查找系统的总运行时间。

    - `sleep`: 此命令帮助在特定时间后关闭系统。


    ## 用户管理 Linux 命令


    - `useradd`, `usermod`, `userdel`: 所有这些命令都将帮助你添加、修改和删除用户账户。如果你是系统的唯一用户，可能并不需要这些命令。但如果系统同时被多个用户使用，这些命令就会非常有用。

    - `passwd`: 此命令允许你更改用户账户的密码。作为 root 用户，你可以重置所有普通用户的密码，但你无法查看密码。定期更改密码是极其重要的。


    ## 文档/帮助 Linux 命令


    - `man` `/whatis`: `man` 命令通过调出特定命令的手册提供帮助。大多数命令都附有 man 页（帮助页）。`whatis` 命令通过提供手册某些特定部分的单行摘要提供帮助。

    - `whereis`: 此命令告诉用户可执行二进制文件的所在位置，前提是二进制文件位于用户的路径内。它可以找到存在的源代码和帮助页。


    ## 网络 Linux 命令


    - `ip`: 此命令通过提供系统的 IP 地址提供帮助。

    - `ping`: `ping` 命令是一个重要的诊断工具。它可以轻松测试你是否连接到互联网或路由器。它还可以帮助指示连接质量。


    ## Linux 命令行


    命令行可以认为是 Linux 系统的优势之一。CLI（命令行界面）允许用户完全脱离发行版的限制。它还让与系统的交互任务变得简单得多。Ubuntu 的衍生版本使用相同的代码基础，但它们都带了一套完全不同的工具来执行相同的工作。相似发行版上的各种桌面环境需要不同的方式来执行相同形式的任务。作为用户，你可能需要忘记已经熟悉的过程，然后重新学习执行相同操作的过程，因为它们在不同发行版之间会切换。Linux
    命令行节省了 GUI 也会消耗的系统资源。因此，如果你在运行较慢的系统上工作，使用命令行比使用 GUI 更好。


    很多人认为命令行非常困难；然而其实不是。它就像给朋友发消息一样简单，你只需要向系统输入你想做什么即可。


    ### 获取 Shell（外壳）


    Shell 无非一个将输入的文本转换为计算机系统可以执行的指令或命令形式的程序。你可以使用各种形式的命令来执行相同的任务。Linux 中可以找到各种 shell，但所有
    shell 中最流行是由 GNU 项目编写的 BASH。另一种现代 shell 形式是 `zsh`，你可以轻松地为你的发行版安装它。


    如果你在桌面环境中工作，你需要一个终端模拟器（terminal emulator），为了在特定界面内模拟终端。不同形式的发行版自带自己的模拟器：KDE 带有
    `Konsole`，而 Gnome 带有 `Gnome terminal`。


    ### 一些基础命令


    当你打开终端模拟器时，默认你处于登录用户的家目录下。你可以轻松地找到登录用户的用户名以及主机名。`$` 表示你以普通用户身份登录，而 `#` 表示你已以 root
    身份登录。除非你正在进行任何形式的管理任务或在 root 目录之外进行操作，否则永远不要以 root 身份运行。


    这将更改你已经工作过的所有目录及其文件的权限，并将 root 变为所有目录的所有者。你可以使用 `ls` 命令轻松列出所有可用目录及其内部的文件。


    如果你需要更改任何目录，请使用 `cd` 命令。你还可以使用 `tab` 键，它可以帮助自动完成路径。你可以使用斜杠 `/` 来进入目录。如果你想进入当前目录的子目录，不需要提供整个路径。要查看目录的内容，不需要切换目录。只需使用
    `ls` 命令查看特定目录的内容即可。


    ### 一些高级命令行


    大多数从事 Linux 命令行工作的开发者都熟悉基础形式的命令，如 `cd`、`ls`、`tail`、`head`、`cat`、`grep`、`find`、`sort`
    等许多。高级用户将需要了解如何使用 `awk` 和 `sed` 这样的“大怪兽”工具，甚至是 perl 单行命令（perl-oneliners）。拥有 BASH
    脚本的高级知识后，你会发现想象力是唯一的限制。让我们来看一些高级形式的命令行。


