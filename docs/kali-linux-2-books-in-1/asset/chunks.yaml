    \n在 Kali Linux 中，访问硬盘或优 盘等外部媒体比在之前的 Backtrack 版本要简单得多。总的来说，与通用串行传输 (USB) 接口相关的媒体将由工作框架识别并允许访问。尽管如此，如果没有发生这种情况，可能需要物理地挂载驱动器。\n\
    \n## 物理挂载驱动器\n\n在 Kali Linux 上物理挂载驱动器时必须执行的首要任务是将物理驱动器连接到 PC。接下来打开一个终端并创建一个挂载点。应该为所使用的记录提升挂载点的权限；如果没有使用\
    \ root 账户，可以通过 `sudo` 命令实现。随后的命令将在媒体索引中创建一个名为 `newdrive` 的挂载点。\n\n使用 `fdisk` 命令确定你正在连接的驱动器和分区，并查看你正在添加的驱动器的详细信息。主硬盘通常是\
    \ `hda`，该驱动器上的主分区是 `hda1`。这种安排适用于与 PC 相关的额外驱动器，第二个为 `hdb`，第三个为 `hdc`。通常情况下，内部驱动器会被标记为\
    \ `hda`，因此主外部驱动器将命名为 `hdb`。要将 `hdb` 的主分区挂载到上一步创建的 `newdrive` 索引，请使用以下命令。\n\n```\n\
    mount /dev/hdb1 /media/newdrive\n```\n\n完成后，可以通过浏览 `newdrive` 索引访问驱动器内容。\n\n```\n\
    cd media/newdrive\n```\n\n## 刷新 Kali\n\n与其他工作框架一样，Kali 具有刷新工作框架以及所引入的应用程序或包的能力。当包更新可用时，它们将出现在\
    \ Kali 商店中。然后可以检查此存档库以确保工作框架和应用程序是最新的。更新通常是解决程序错误或错误的较小修复程序，或者用于包含新的设备功能。可以使用\
    \ `apt get` 命令行工具刷新 Kali。\n\n```\napt get update\n```\n\n## 重新设计 Kali\n\n与刷新类似，也可以在命令行下使用\
    \ `apt get` 工具重新设计 Kali。重构通常是对应用程序或工作框架本身的重大更改。重构提供了新的功能，并且比更新大得多，通常需要框架硬盘上的额外空间\
    \ - `apt get upgrade`\n\n# 第 6 章：包含存储源\n\n理所当然地，Kali 会检查其自身仓库中存放的产品以获取更新和重构。这非常有帮助，因为某些更新或重构可能会破坏\
    \ Kali 的功能。因此，刷新和重构在添加到官方 Kali 商店之前，会由 Offensive Security 的工程师进行尝试。虽然这通常是很感谢的，但在使用默认\
    \ Kali 应用程序配置焦点时，某些应用程序是无法使用的。可能会包含额外的存储库；在这种情况下将包含 Debian 存档库。使用 `nano` 或其他内容管理器打开\
    \ `/etc/apt/sources.list`。\n\n```\nnano /etc/apt/sources.list\n```\n\n打开后，在文件的末尾添加以下注释和两行。\n\
    \n```text\n# debian 7 whe (这只是一个注释)\ndeb http://http.us.debian.org/debian stable\
    \ main contrib non-free\ndeb-srch http://http.us.debian.org/debian stable main\
    \ contrib non-free\n```\n\n现在保存文档。在 `nano` 中，通过按住 `Control` 和 `\"O\"` 键保存记录。按\
    \ `Enter` 键以相同的文件名保存，然后使用 `Control` 和 `X` 键退出。这将主 Debian 库添加到 Kali 用于检查更新或重构的库列表中，同时也用于查找要引入的应用程序或包。要应用此更改，使用新存档更新\
    \ Kali。\n\nKali 是一个非常强大的资产，默认引入许多设备。对某些客户来说，使用许多设备可能并不熟悉，因此此部分涵盖了成功使用此及许多其他 Linux\
    \ 发行版的大量技巧。从配置系统界面到添加 FTP 服务器、包含另一个存储库以及更新工作框架和应用程序，本节涵盖了必须练习才能有效使用此工具集的许多基本任务。维护\
    \ Kali 与其他工作框架一样重要，应该定期进行，以确保其工具、应用程序和工作框架本身是最新的。\n\n# 构建渗透测试实验室\n\n### 本章数据内容\n\
    - 构建实验室\n- Metasploitable2\n- 扩展你的实验室\n- 奇幻的代码注入彩虹\n\n章节概述和关键学习点 - 这部分将逐步说明如何利用虚拟化创建渗透测试实验室环境，以及在实验室环境中使用\
    \ VirtualBox 配置 Metasploitable2 阶段。\n\n 在阅读本章之前：构建实验室\n\n个人如何获得练习、检查和熟悉滥用程序的机会？建立一个实验室并投入其中吧！既然互联网随处可用，为什么要建立实验室呢？这是一个简单的问题，答案也相当简单，因为没有人需要去监狱。想象一下测试不属于你的系统的后果。攻击政府或金融系统（如银行）可能导致\
    \ 20 年或更长的监禁。\n\n对政府或州法律的无知不能作为数字犯罪的借口。要谨慎，要机敏，建立实验室。本节中的活动基于免费获取的练习应用程序和程序。在进入下一部分之前，构建实验室是非常明智的。\n\
    \n## 低预算构建实验室\n\n在虚拟化时代之前，信息技术 (IT) 专家、安全专业人员和学生都有装满 PC 设备的车库、地下室和其他房间。有时，这些 PC\
    \ 和系统管理硬件从地板堆到天花板，电费单高得离谱。拥有大量设备是一种痛苦；如果你需要搬家，想象一下带走它们吧。庆幸现在不是这种情况了。无论你的 PC 运行的是\
    \ Windows、Mac 还是 Linux 工作框架，处理家庭虚拟化都有两种基本方法。这两个项目都不需要额外费用，并且适用于大多数运行 32 位或 64\
    \ 位架构的工作框架。\n\n### VMWare Player\n\n#### 优点\n- 虚拟机 (VMs) 建立在一个用于 NAT 的虚拟交换机上。许多虚拟机将能够相互通信，并且可以从主机进行访问。\n\
    - 默认引入 DHCP，所有虚拟机都可以获取 IP 地址。\n- 支持 `Xen`、`XenServer`、`vSphere` 和其他主要虚拟机管理程序的辅助虚拟化。\n\
    \n#### 缺点\n- 不适用于 Mac、Solaris 或 FreeBSD 工作框架。\n- 不考虑现有虚拟机的快照或克隆。\n- 某些 Wi-Fi 连接存在困难。\n\
    \n### VirtualBox\n\n#### 优点\n- 适用于 Windows、Linux、Mac、Solaris 和 FreeBSD。\n\n"
