    Kali Linux 包含一个易于配置的 Apache Web 服务器。拥有一个可配置的 Web 服务器对于入侵分析者来说是一个巨大的优势。例如，利用此管理功能，可以创建复制互联网上现有页面的站点。这些目标随后可以用于向目标系统上的客户端提供恶意代码。它们将利用网络钓鱼等社交工程策略，包括搭建用于二级通道的服务器、处理回调，并为不同的恶意程序提供指令。HTTP
    管理在入侵测试中可以有多种不同的用途。


    ### 使用 GUI 启动、停止或重启 Apache 服务器


    使用图形用户界面（GUI）是启动、停止或重启/重置 Web 管理的最简单的方法。要执行操作，从 Kali 屏幕顶部的栏选择 `Applications`（应用程序）。从下拉菜单中选择
    `Kali Linux`，这将显示一个子菜单。从该菜单中选择 `System Administrations`（系统管理），这将显示另一个菜单；在弹出菜单上选择
    `HTTP` 选项。这将显示启动、停止和重启 Apache 管理的选项。


    当使用菜单产生选项时，一个方向 shell 将启动并显示服务器的状态。当 Apache 服务器启动或重启时，将显示 Kali Linux 的默认设置。


    你可能会看到的错误是，“Couldn''t reliably decide the server''s fully qualified area name,
    using `127.0.0.1` for `ServerName`。”此错误目前不会引起任何问题，因为 Web 服务器将根据框架的 IP 地址在系统上可访问。要解决此错误，修改
    //and so forth/apache2/ 下的 `apache2.conf` 记录，在该文档末尾的 `ServerName` 之后添加要使用的服务器名称，然后按如下保存记录。


    ```

    ServerName localhost

    ```


    当 Apache 服务器启动或重启后，可以通过在浏览器中输入 PC 的 IP 地址来访问默认站点页面。Kali Linux 发循环包含 `IceWeasle`
    浏览器，可以通过点击顶栏上的 `IceWeasle` 符号（一个被白色鼬鼠环绕的蓝色地球）访问。


    ### 在命令提示符中启动、停止和重启 Apache


    可以使用命令 `/and so forth/init.d/apache2` 后接上述活动（stop、start 或 restart）来有效地启动、停止和重启
    Apache HTTP 服务器。使用命令行将带来与 GUI 相同的的操作效果。


    ```

    /and so forth/init.d/apache2 start

    /and so forth/init.d/apache2 stop

    /and so forth/init.d/apache2 restart

    ```


    ### 默认 页面


    当 Apache 管理准备就绪时，应该更改默认（It works!）站点页面。要执行此操作，制作应在页面显示的 Web 内容并将其保存为 `/var/www/catalog/`
    中的 `index.html`。同样，也可以修改此区域当前的 `index.html` 文档并包含新页面。


    ### FTP 服务器


    文件传输协议（FTP）用于在 PC 之间移动文档。注意，`FTP` 不对文档或 PC 之间的通信通道进行加密，因此任何观察系统（或互联网）的人都可以看到 PC
    之间的任何记录。


    Kali Linux 没有 FTP 服务器，因此可以添加一个以促进框架之间的文档移动。可以包含许多不同的 FTP 服务，其中之一是 `Pure-FTPd`
    (`ftpd`)；然而，任何支持的 FTP 守护进程都值得考虑。


    使用以下命令使用 `apt get` 下载并引入 `Pure-FTPd` 管理。


    ```

    apt get introduce pure-ftpd-basic pure-ftpd

    ```


    这将引入并设置 FTP 管理。为了确保 Pure-FTP 服务器的正常运行，一些细设置是重要的。


    ```

    /etc/and so forth/pure-ftpd/conf/

    listen.no

    listen.PAMAuthentication no

    listen.UnixAuthentication no


    ln -s /and so forth/pure-ftpd/conf/PureDB/ /etc/and so forth/pure-ftpd/auth/50pure

    ```


    接下来必须为 FTP 管理创建用户和客户端。首先创建另一个框架组。


    接下来包含新创建的组。此命令将不会授予客户端访问主索引或 shell 的权限。


    ```

    useradd -g ftpgroup -d /dev/null -s /ftp ftpuser

    ```


    为 ftp 记录创建一个注册目录。


    ```bash

    mkdir -p /home/pubftp

    ```


    向 ftp 注册目录添加客户端目录。在这种情况下，将创建的客户端 sam 需要一个索引。


    ```bash

    mkdir /home/pubftp/sam

    ```


    现在为 FTP 管理包含客户端和密码。在这种情况下，创建了客户端 sam。


    ```

    passwd-useradd sam -u ftpuser -g ftpgroup -d /home/pubftp/sam

    ```


    需要创建一个简单的密码。


    使用以下命令刷新 Pure-FTPd 数据库。


    ```

    passwd-mkdb

    ```


    最后使用后续命令启动 FTP 管理。


    ```

    service pure-ftpd start

    ```


    在启动 Pure-FTPd 后，使用后续命令进行测试是一个明智的想法。


    ```

    ftp {IP_Address}

    ```


    当提示输入客户端名称 sam 和密码时。如果确认成功，说明 FTP 服务器运行正常。如果执行无效，请重启 PC 并再次尝试服务器。


    来自 `http://samiux.blogspot.com/2011/08/howto-pure-ftpd` 的指南用于完成使 FTP 实用的步骤。


    ### SSH 服务器


    Secure Shell (SSH) 是从远程区域访问 Kali 框架的一种安全方法。SSH 提供了 PC 之间的加密通信。这对于入侵分析者非常有用，因为它允许记录移动而不被入侵检测系统（IDS）和入侵防御系统（IPS）监控。


    ### 生成 SSH 密钥


    为了安全地使用 SSH，必须生成加密密钥。要生成这些密钥，执行以下操作。


    从默认索引移动第一个 SSH 密钥；不要删除它们。


    ```bash

    mkdir -p /etc/ssh/original

    mv /etc/ssh/ssh_host_* /etc/ssh/original/

    ```


    创建新的 SSH 密钥。


    ```bash

    dpkg-reconfigure openssh-server

    ```


    启动/重启 SSH 服务。


    ```

    service ssh (start restart)

    ```


    ### 从 Kali GUI 处理 SSH 服务


    SSH 服务器包含在 Kali GUI 的主要结构中，其获取方式与启动或停止 Apache 服务器类似。要进入 SSH 菜单，从 Kali 屏幕顶部栏选择
    `Applications`。从下拉菜单中选择 `Kali Linux`。然后选择 `System Services`；在下一个菜单中选择 `SSH` 选项。


    ### 从命令行处理 SSH 服务器


    也可以在这里启动、停止和重启 SSH 服务器。在执行 `/and so forth/init.d/ssh` 后，按照后续指令进行操作。


    ```

    /and so forth/init.d/ssh start

    /and so forth/init.d/ssh stop

    /and so forth/init.d/ssh restart

    ```


    ### 访问远程系统


    当 Kali 框架启动了 SSH 管理后，可以通过在 Linux 框架上输入后续命令远程访问 PC（客户端名称为 sam，远程框架 IP 地址为 192.168.1.66）。


    ```

    ssh sam@192.168.1.66

    ```


    Windows 客户端访问 SSH 将需要一个 SSH 客户端。

