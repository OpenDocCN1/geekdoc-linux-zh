    ## 网络基础


    系统管理可以被认为是计算机之间电子街道的连接。这些街道可以是物理的，最常见的是 5 类或 6 类（`CAT 5` 或 `CAT 6`）链路或光纤链路。远程系统管理利用独特的无线电发射器和接收器从物理系统引导无形任务。


    无论介质如何，物理或远程系统管理都有相似的基础部分。首先，至少有两个设备将通信，例如，Adam 的计算机将与 Bill 的计算机通信。为了实现这一点，他们需要工作在正确介质上的交换设备。对于这种模型，Adam
    将接入与 Bill 关联的等物理 `CAT5` 的系统。如果设置正确，只要双方的协议和设置正确，Bill 可以使用远程网卡，而 Adam 可以使用有线网卡。为了使其准确工作，Adam
    和 Bill 都应该接入类似的系统部分，并使用类似远程交换机的设备，以关联不同的物理介质类型（有线和远程）。

