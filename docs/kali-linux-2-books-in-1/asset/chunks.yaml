- fmt: '

    The other components include the software which is needed for the purpose of security,
    monitoring and management of the network. Any type of network depends largely
    on the protocols plus its standards for the performance of discrete form of jobs
    or for the purpose of communication with various data types. By protocol, it means
    a proper set of algorithms or set of rules which defines the ways in which the
    different entities related to communication connect with one another across a
    network. You can fund several types of protocols within a network like `ARP`,
    `IP`, `TCP`, `FTP`, `DHCP` and various others.


    Voice over IP or `VoIP` is being used for the purpose of transporting the `IP`
    telephonic traffic directly to the final point which is also supported by the
    protocol. `TCP/IP` is regarded as the internet protocol suite which is responsible
    for the transportation of data across a network based on `IP`. An `IP` address
    can be regarded as the logical form of address which behaves as the address of
    the network for all the systems in a network. It provides help in setting up a
    unique form of identification for each and every device within a network. The
    `IP` addresses which are found for the network are in 32 bits structure. `IPV4`
    is being assigned by the `IANA` for all the systems within a network.


    The physical form of address of each and every network host is known as the `MAC`
    address. It stays linked with the network interface card or `NIC`. You can find
    `MAC` addresses in 48 bits or 12 nibble. The `MAC` addresses are assigned to the
    devices at the time of manufacturing.


