    无论如何，如果目标名称服务器配置错误，大多数操作将失败。


    整个名称服务器记录集将被移动到相邻的 Kali Linux PC 上。在利用这一方向时，空间将是任何主机的更短的区域，例如 `foo.com` 而不是 `www.foo.com`。`axfr`
    传输演示了渗入应该要求一个区域传输。如果交换顺利，显示的数据可以被用于添加目标的配置。这将为未来阶段的准入测试提供重要数据。


    # 第 9 章：扫描


    渗透分析师在完成对某个关联的监视期后，他们将进入检查阶段。在此阶段，渗透分析师可以利用发现关于员工、临时工和数据框架的数据，开始扩展对关联内部物理数据框架结构的视角。像渗透测试生命周期中的任何不同阶段一样，渗透分析师可以按照预期返回之前的阶段，以获取数据来升级在检查阶段累积的数据。


    过滤阶段的核心重点是确定与目标关注的系统相关的 PC 和不同设备的明确数据。在整个阶段中，重点是确定枢纽类型（工作站、PC、服务器、组织设备或多功能计算平台）、操作系统、提供的开放管理接口（Web
    应用程序、`SMTP`、`FTP` 等），甚至潜在的漏洞。


    此层面的漏洞通常被称为“触手可得的果实”。


    检查是通过各种设备完成的；本节将集中在可能最知名且最好的设备，包括 `Nmap`、`Hping` 和 `Ness`。此阶段的目标是为渗透测试生命周期的下一阶段：利用建立一个潜在目标列表。


    ## 理解网络流量


    系统流量对某些人来说可能是混乱的；无论如何，都需要对这一主题的基本理解才能从检查阶段获得最大的收益。系统流量是发生在通过各种策略关联的 PC 框架之间的电子通信。今天最广泛使用的系统管理策略是有线和无线以太网。理解以太网通信的关键的标准至关重要。本节将探索端口和防火墙、IP
    协议，包括传输控制协议 (`TCP`)、用户数据报协议 (`UDP`) 和互联网控制消息组协议 (`ICMP`)。


    ## 获取端口和防火墙


    保护系统最基本的策略之一是在内部（通常是公司网络）与世界其他部分（如互联网）之间实现防火墙。防火墙只是一个带有至少两个网卡的注册设备，充当系统的守护者。访问控制记录仔细地筛选出站流量（离开）和入站流量（进入）。只有符合入口控制标准的流量才允许通过，其余的被防火墙丢弃。它通过打开或关闭端口来允许或拒绝流量。


    端口是用于 PC 到 PC 通信的独特通信通道。有 65,535 个 `TCP` 端口和另外 65,535 个 `UDP` 端口可以用于通信。这些端口中只有少数被分配给特定原因，但不限于此用途。例如，`TCP`
    端口 `80` 经常用于使用超文本传输协议 (`HTTP`) 的典型互联网 Web 流量，其他流量也可以通过端口 `80` 进行，互联网流量可以通过不同的端口传输。


    一种方法是将端口视为一个巨大的办公场所，入口通向不同的房间。这些房间中的每一个都有一个办公人员，负责特定的展示并监督各种功能。`80` 号套房背后的工作处理进入的网页请求。Web
    部门可以移动到另一个办公室，例如 `8080` 号套房的办公室，继续类似的功能，在那里处理 Web 请求。另一个小组可能会移动到 `80` 号套房，这与 Web
    请求无关，或者该套房可能会被关闭、上锁并闲置。尝试发现 Web 组的客人需要意识到 Web 组目前位于 `8080` 号套房而不再位于 `80` 号套房。在
    Web 组移动后尝试从 `80` 号套房获取 Web 数据的客人将失望并得所需的数据，因为那里会有其他人或办公室会被锁，而拥有正确地址的客人将从 `8080`
    号套房的新办公室获得提到的网页。


    ## 理解 IP 协议


    协议是规则，即使在 PC 系统上也是。立法者和高级权威通常有处理协议问题的人员。协议场所的人员确保每个客人或权威消息的执行方式确保消息或客人被有效地获取，位于正确的组织中并带有正确的标题和尊重。


    在 PC 世界中，这些协议确保框架之间的通信按照预定义的规则进行。虽然对于所有 PC 框架可用的协议数量惊人，但本节将介绍 Kali Linux 上著名的过滤应用程序最常用的三种用于检查、漏洞发现和渗透测试的协议：`TCP`、`UDP`
    和 `ICMP`。


    ### TCP


    用于网络交换的主要协议之一是 `TCP`。


    `TCP` 是一种基于连接的通信协议，这意味着交换双方的 PC 知道会话是开启的，并且消息正在连接的双方接收。以前，许多人将此比作电话通话。


    ## 结论


    当你完成本电子书时，你现在可以轻松地对黑客概念以及相关过程建立非常清晰的认知。你还获得了关于 Kali Linux 属性、功能和用的大大量知识。完成本书后，你将能够配置所有必要的工具以及所需的组件，以为你的业务或个人使用设置一个安全可靠的网络。始终记住一点：你是你网络或服务器上发生的一切事情负责的人。


    在 Kali Linux 及其相关工具的帮助下，你将对你的网络安全界面拥有完全控制。本电子书不仅关于 Kali Linux 的方面，还讨论了网络基础知识及其安全性。通过
    Kali Linux 的帮助，你能够执行定期的渗透测试，最终决定你的系统的安全性。


    所以，如果你正在考虑提高网络服务器的安全性，请立即在电子书和 Kali Linux 的帮助下开始。记住，你是真正可以建立或摧毁网络安全墙的人。


    如果你发现这本书对你的业务有任何帮助，请在 Amazon 上留下评论。


