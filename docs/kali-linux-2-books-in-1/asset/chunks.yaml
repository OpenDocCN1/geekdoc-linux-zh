  trans: "\n渗透测试使用的技术可能无法处理所有的安全疑虑，但它可以帮助减少系统受到攻击的概率。渗透测试确保组织或公司绝对免受所有形式的威胁和漏洞的影响，并帮助提供免御网络攻击的安全保障。它还确保组织的防御系统正常工作，并足以公司或组织阻止攻击和威胁。它还指出了组织需要更改的安全措施，以防御系统免受攻击和漏洞。所有关于渗透测试的报告都会交由系统管理员。\n\
    \n# Metasploit\n\nMetasploit 仅仅是一个用于渗透测试的框架，它实际上让黑客概念变得简单得多。对于大多数攻击者和安全防御者来说，它被视为一种重要的工具。你只需要将\
    \ Metasploit 指向目标，选择任何你喜欢的漏洞利用（exploit），选择你想要投放的载荷（payload），然后按回车即可。然而，它的本质并不如此随意，因此你需要从头开始。在黄金时代，渗透测试的概念带有许多重复性的劳动，而这些现在通过使用\
    \ Metasploit 实现了自动化。\n\n你需要什么？收集信息、获取访问权限、维持持久性还是规避所有形式的检测？Metasploit 可以被视为黑客的瑞士军刀；如果你选择将信息安全作为未来的职业，那么你就需要详细了解这个框架。Metasploit\
    \ 框架的核心是免费的，并且预装在 Kali Linux 软件中。\n\n## 如何使用 Metasploit？\n\nMetasploit 可以与 SNMP\
    \ 扫描、`Nmap` 以及 Windows 补丁枚举等其他工具无缝集成。它还带有一个连接 Tenable 漏洞扫描器 `essus` 的桥接。你能想到的大多数侦察工具都可以与\
    \ Metasploit 集成，从而使得在安全盾上找到可能的弱点成为可能。一旦你识别了系统中的漏洞，就可以在巨大且可扩展的数据库中寻找漏洞利用点，这将有助于攻破最强的盔甲并让你进入系统。就像奶酪配葡萄酒一样，你也可以将漏洞利用与载荷配对，以适应任何手头任务。\n\
    \n大多数黑客都在寻找 shell（外）。在攻击基于 Windows 的系统时，合适的载荷是充当 `Meterpreter` 以及一种内存形式的交互式 shell。Linux\
    \ 拥有自己的一套 shellcode（shell 代码），这取决于所使用的漏洞利用。一旦进入目标机器，Metasploit 的弹匣就提供了一套完整的后渗透工具，包括权限提升、哈希传递、屏幕截屏、数据包嗅探、隧道攻击和键盘记录器工具。如果你需要，当目标机器意外重启时，也可以轻松设置一个正确形式的后门。\n\
    \nMetasploit 每年都会加载越来越多的功能，以及一个用于识别二进制文件中潜在安全缺陷的模糊器（fuzzer），以及长长的辅助性模块列表。我们到目前为止讨论的只是使用\
    \ Metasploit 可以做到的高层愿景。整个框架本质上是模块化的，可以很容易扩展，并且拥有活跃的社区支持。如果它没有实现你想要，你可以轻松地调整它以满足你的需求。\n\
    \n## 如何学习 Metasploit？\n\n你可以找到各种廉价或免费的资源来学习 Metasploit。学习 Metasploit 的最好方法是下载\
    \ Kali Linux，然后安装到虚拟机以便在目标上进行练习。\n\n维护 Kali Linux 并运行 OSCP 认证的组织 Offensive Security\
    \ 提供了一个包含 Metasploit 培训的免费课程，名为 `Metasploit Unleashed`。\n\n## 在哪里下载 Metasploit？\n\
    \n你可以在黑客软件 Kali Linux 中找到 Metasploit。但如果你愿意，也可以从 Metasploit 官方网站单独下载。Metasploit\
    \ 可以用于基于 Windows 和 `nix` 的系统。你可以在 GitHub 上找到 Metasploit Framework 的源码。Metasploit\
    \ 在互联网上也有各种形式存在。\n\n# 数据存储（Datastore）\n\n数据存储可以认为是 Metasploit 框架的核心元素。它仅仅是一个包含多个命名值的表，允许用户轻松配置\
    \ Metasploit 内的组件行为。数据存储允许接口配置任何设置、定义参数的漏洞利用以及用于修补操作码的载荷。它还允许 Metasploit 框架在模块选项之间内部传递。你可以找到两种数据存储：使用\
    \ `setg` 定义的全局数据存储，以及使用 `set` 在模块层级定义的模块数据存储。\n\n# SQL 注入与 Wi-Fi 破解\n\n谈到网络攻击时，最常用的形式之一是\
    \ SQL 注入攻击。在这种情况下，攻击者执行威胁或无效格式的 SQL 语句，用于控制 Web 应用程序的数据库服务器。它还用于在用户完全不知的情况下修改、删除或添加数据库中的记录。这最终损害了数据的完整性。避免或防止\
    \ SQL 注入的最重要步骤是输入验证。\n\n### SQL 注入及其类型\n\n今天你可以发现多种类型的 SQL 注入。让我们来看一下。\n\n- 经典或带内\
    \ SQL 注入：\n    1. 基于错误（Error-based）：攻击者利用数据库生成的错误来攻击数据库。\n    2. 基于 Union（Union-based）：在此处\
    \ `UNION` 运算符用于组合返回给 HTTP 的响应。\n- 推断型或盲注 SQL 注入：\n    1. 基于布尔（Boolean）：基于真或假的返回结果。\n\
    \    2. 基于时间（Time-based）：发送 SQL 注入强制数据库在之前之前。\n- 带外（Out of band）：当攻击者无法使用类似形式的通道进行攻击和收集结果时，就会发生。\n\
    \n### 用于 SQL 注入的工具\n\n有多种工具用于执行 SQL 注入。\n\n- `SQLMap`：此工具用于自动形式的 SQL 注入，有助于接管数据库。\n\
    - `jSQL Injection`：这是一个基于 Java 的工具，用于 SQL 注入。\n- `Blind-SQL-BitShifting`：它通过位移（BitShifting）进行盲注\
    \ SQL 注入。\n- `BBSQL`：一种盲注形式的 SQL 注入利用工具。\n- `explo`：机器和人类可读的 Web 漏洞测试格式。\n- `Whitewidow`：用于检查\
    \ SQL 数据库漏洞的扫描工具。\n- `Leviathan`：作为一个音频工具包运行。\n- `Blisqy`：用于利用 HTTP 请求头中基于时间的\
    \ SQL 注入。\n\n### SQL 注入的检测工具\n\n名为 Spider testing tool 的工具被广泛用于通过 `POST` 或 `GET`\
    \ 请求手动识别 SQL 注入漏洞。如果你能解决代码中的漏洞，就可以轻松地防止 SQL 注入。你也可以使用 Web 漏洞扫描器来识别代码中的所有缺陷并进行修复，以防止\
    \ SQL 注入。\n"
