- fmt: "\nThe technique used by penetration testing might not handle all the security\
    \ concerns, but it can help to minimize the chances of attacks on the system.\
    \ Penetration testing ensures that an organization or company is absolutely safe\
    \ from all forms of threats and vulnerabilities and it helps in providing security\
    \ from the cyber attacks. It also makes sure that the system of defense of an\
    \ organization is working properly and is also enough for the company or organization\
    \ to prevent the attacks and threats. It also indicates the security measures\
    \ which are required to be changed by the organization to defend the system from\
    \ attacks and vulnerabilities. All the reports regarding penetration testing are\
    \ handed over to the system administrators.\n\n# Metasploit\n\nMetasploit is nothing\
    \ but a framework meant for penetration testing which actually makes the concept\
    \ of hacking much easier. It is regarded as an important tool for the majority\
    \ of the attackers along with the security defenders. All you need to do is to\
    \ just point Metasploit at the target, pick any exploit of your choice, choose\
    \ the payload which you want to drop and just hit Enter. However, it is not that\
    \ casual in nature and so you will need to start from the beginning. Back in the\
    \ golden days, the concept of penetration testing came with lots of repetitive\
    \ forms of labor which is now being automated by the use of Metasploit.\n\nWhat\
    \ are the things that you need? Gathering of information or gaining of access\
    \ or maintaining the levels of persistence or evading all forms of detection?\
    \ Metasploit can be regarded as the Swiss knife for hackers; if you want to opt\
    \ for information security as your future career then you are required to know\
    \ this framework in detail. The core of the Metasploit framework is free in nature\
    \ and also comes pre-installed with the software Kali Linux.\n\n## How to use\
    \ Metasploit?\n\nMetasploit can seamlessly integrate itself with SNMP scanning,\
    \ `Nmap` and enumeration of Windows patch along with others. It also comes with\
    \ a bridge to the Tenable’s scanner of vulnerability along with `essus`. Most\
    \ of the reconnaissance tools which you can think of can integrate along with\
    \ Metasploit and thus it makes it possible to find the strongest possible point\
    \ in the shield of security. After you have identified the weakness in a system,\
    \ you can start hunting across the huge and extensible database for a point of\
    \ exploit which will help in cracking the strongest armor and will let you in\
    \ the system. Just like the combination of cheese and wine, you can also pair\
    \ an exploit with the payload for suiting any task at hand.\n\nMost of the hackers\
    \ are looking out for a shell. It is a proper payload at the time of attacking\
    \ a system based on Windows which acts as the `Meterpreter` and also as an in-memory\
    \ form of interactive shell. Linux comes with its own set of shellcodes which\
    \ depends on the exploit being used. Once within a target machine, the quiver\
    \ of Metasploit comes with a complete suite of post-exploitation tools which also\
    \ includes escalation of privileges, pass the hash, screen capture, packet sniffing,\
    \ pivoting and keylogger tools. If you want you can also easily set up a proper\
    \ form of backdoor if the target machine gets rebooted somehow.\n\nMetasploit\
    \ is loaded up with more and more features each year along with a fuzzer for identifying\
    \ the potential flaws of security in the binaries as well as a too long list of\
    \ the modules which are of auxiliary nature. What we have discussed till now is\
    \ only a high-level vision of what can be done with Metasploit. The overall framework\
    \ is modular in nature and can be extended easily and it also enjoys an active\
    \ form of community. If it is not doing what you want, you can easily tweak it\
    \ to meeting your needs.\n\n## How can you learn Metasploit?\n\nYou can find various\
    \ cheap as well as free resources for the purpose of learning Metasploit. The\
    \ best way of starting with Metasploit is by downloading Kali Linux followed by\
    \ the installation along with a virtual machine for practicing on the target.\n\
    \nThe organization which maintains Kali Linux and also runs the OSCP certification,\
    \ Offensive Security, offers a free course that includes training of Metasploit\
    \ and is known as `Metasploit Unleashed`.\n\n## Where can you download Metasploit?\n\
    \nMetasploit can be found along with the hacking software Kali Linux. But, if\
    \ you want you can also download it separately from the official website of Metasploit.\
    \ Metasploit can be used on the systems which are based on Windows and `nix`.\
    \ You can find out the source code of Metasploit Framework on GitHub. Metasploit\
    \ is also available in various forms on the internet.\n\n# Datastore\n\nThe datastore\
    \ can be regarded as a core element of the Metasploit Framework. It is nothing\
    \ but a table of several named values which allows the users to easily configure\
    \ the component behavior within Metasploit. The datastore allows the interfaces\
    \ to configure any of the settings, exploits for defining the parameters and also\
    \ payloads for the purpose of patching the opcodes. It also allows Metasploit\
    \ Framework to pass internally between the options of modules. You can find two\
    \ types of datastores, the Global datastore which can be defined by using `setg`\
    \ and the Module datastore which can be defined at the modular level of datastore\
    \ by using `set`.\n\n# SQL Injection and Wi-Fi Hacking\n\nWhen it comes to cyber\
    \ attacks, one of the most widely used forms is the SQL Injection attack. In this,\
    \ an attacker executes threat or invalid form of SQL statements which are used\
    \ for database server control for an application of the web. It is also used for\
    \ modifying, deleting or adding up records within the database without even the\
    \ user knowing anything about it. This ultimately compromises the integrity of\
    \ the data. The most important step which can be taken for avoiding or preventing\
    \ SQL injection is by input validation.\n\n### SQL Injection and its types\n\n\
    There are various types of SQL injection which you can find today. Let’s have\
    \ a look at them.\n\n- Classic or In-band SQL injection:\n    1. Error based:\
    \ Attackers employ the generated error by the database to attack the database.\n\
    \    2. Union based: In this `UNION` operator is employed for combining a response\
    \ for returning to the HTTP.\n- Inferential or Blind SQL injection:\n    1. Based\
    \ on Boolean: It is based on return of true or false.\n    2. Time based: It sends\
    \ out SQL injection which forces the database before responding.\n- Out of band\
    \ SQL injection: This takes place when an attacker is unable to use the similar\
    \ form of channel for attacking and gathering the results.\n\n### Tools used for\
    \ SQL injection\n\nThere are various tools which are used for carrying out SQL\
    \ injection.\n\n- `SQLMap`: This tool is used for an automatic form of SQL injection\
    \ and it helps in taking over the database.\n- `jSQL Injection`: It is a Java\
    \ based tool which is used for SQL injection.\n- `Blind-SQL-BitShifting`: It is\
    \ used for blind SQL injection by the use of BitShifting.\n- `BBSQL`: It is a\
    \ blind form of SQL injection exploitation tool.\n- `explo`: It is a format of\
    \ machine and human readable web vulnerability testing.\n- `Whitewidow`: It is\
    \ a scanning tool which is used for checking out the vulnerabilities of the SQL\
    \ database.\n- `Leviathan`: It acts as an audio toolkit.\n- `Blisqy`: It is used\
    \ for the purpose of exploiting time-based SQL injection within the headers of\
    \ HTTP.\n\n### Detection tools for SQL injection\n\nA tool named Spider testing\
    \ tool is widely used for the purpose of identifying the holes of SQL injection\
    \ manually by the use of `POST` or `GET` requests. If you can resolve the vulnerabilities\
    \ within the code then you can easily prevent the SQL injections. You can also\
    \ use a web vulnerability scanner for identifying all the defects within the code\
    \ and for fixing the same to prevent SQL injection.\n"
