    - `nano`: 这可以被视为文本编辑器 `pico` 的 GNU 版本，可以看作是不同名称下的相似程序。你可以通过命令：`sudo apt-get install
    nano` 在任何基于 Linux 的系统上安装 `nano`。

    - `vim`: 这代表“改进版 vi”（vi improved），它作为一个文本编辑器，也被大多数计算机专业人士使用。第一次使用这个文本编辑器的控制可能会感到有些困惑。当你熟悉它后，它可以让执行最复杂的编辑任务变得非常快速和简单。如果你想在任何基于
    Linux 的系统上安装 `vim`，可以使用命令：`sudo apt-get install vim`。

    - `emacs`: 这是一个非常复杂且高度可定制的文本编辑器，它带有一个用于 Lisp 编程语言的内置解释器。它专门供从事 `Scheme` 等 Lisp
    方言工作的计算机专业人士使用。如果你需要在你的 Linux 系统上安装 `emacs`，请使用命令：`sudo apt-get install emacs`。


    ## 将命令输出重定向到文本文件


    当你使用 Linux 命令行时，有时可能需要在不实际运行文本编辑器的情况下创建甚至修改任何文本文件。以下是一些你可以用于此目的的命令。


    ### 使用 touch 命令创建空文件


    为了创建空文件，你可以使用 `touch` 命令。该命令在假设文件内容已更改但实际上没有发生变化的情况下，帮助更新文件的 `mtime`（修改时间）和 `atime`（访问时间）属性。当你
    `touch` 任何实际上并不存在的文件，系统将创建该文件而而不在文件中放入任何形式的数据。你可以使用如下命令：`touch myfile.txt`。只有当该文件已不存在时，此命令才会创建一个名为
    `myfile.txt` 的新空文件。


    ### 将文本重定向到任何文件


    有时你可能需要将命令的输出结果保存到特定文件中。为了轻松实现这一目标，你需要使用符号 `>` 将结果输出重定向到某些特定文件。例如，`echo` 命令用于将文本作为输出。因此，命令将是：`echo
    "example text"`。此命令将在你的屏幕上打印文本，然后返回命令行提示符。要将此相同输出重定向到文件，你可以使用 `>`。例如，`echo "example
    text">myfile.txt`。这将文本 "example text" 放入名为 `myfile.txt` 的文件中。如果文件 `myfile.txt`
    不存在，它将由系统创建。如果它已经存在，该文件的所有内容都将被覆盖；它将破坏该文件的原有内容并用新文本替换它。


    ### 重定向到任何文件的末尾


    重定向操作符 `>>` 与 `>` 类似。然而，该命令不是仅仅覆盖文件内容，而是将新数据附加到该文件的末尾位置。例如，`ls –l>>directory.txt`。此命令将获取
    `ls-l` 的输出并将其添加到文件 directory 中。如果文件不存在，它将由系统创建。如果它已存在于系统中，`ls-l` 的输出将附加到文件末尾，位于现有文件内容的一行之后。


    ## 添加和删除软件


    如果你已经使用基于 Linux 的系统很长时间，你一定知道在 Linux 中有多种方法实现相同的功能。这包括通过命令行在基于 Linux 的机器上安装软件应用程序。大多数
    Linux 用户选择通过 CLI（命令行界面）在系统中安装新软件。从 CLI 安装软件最常用的方法之一是通过软件仓库，那里是软件文件存储的地方。这是通过使用包管理器完成的。所有基于
    Linux 的软件都以包的形式分发，包无非与包管理系统相关的文件。每种 Linux 发行版都带有一个包管理系统，但它们并不都相同。


    ### 什么是包管理系统？


    包管理系统由一组工具以及各种文件格式组成，共同用于安装、更新和卸载基于 Linux 的软件。最常见的两种包管理系统来自 Debian 和 Red Hat。CentOS、Red
    Hat 和 Fedora 使用 `rpm` 文件系统，其文件格式为 `.rpm`；而 Ubuntu、Mint 和 Debian 使用 `dpkg` 文件系统，其文件格式为
    `.deb`。所有这些系统的主要区别在于你安装和维护它们的方式。


    `.deb` 或 `.rpm` 文件的内部内容有些类似于旧的归档文件（如 `.zip`），包含了应用程序代码、软件安装方法、依赖项以及需要放置配置的位置。执行并读取上述所有指令的软件被称为包管理器。


    ### Ubuntu, Debian, Mint 以及其他


    Ubuntu、Debian、Mint 以及其他 Debian 发发行版使用 `.deb` 格式文件以及 `dpkg` 包管理系统。通过此系统安装应用程序有两种。


    你可以使用 `apt` 应用安装仓库，也可以使用 `dpkg` 应用从 `.deb` 文件安装应用。让我们看看如何执行这两个功能。


    使用 `apt` 命令安装应用程序非常简单：


    ```

    $ sudo apt upgrade

    ```


    如果你只想更新一个应用程序：


    ```

    $ sudo apt update app_name

    ```


    如果要在系统中要安装的应用程序在 Debian 仓库中没有直接提供，而是以 `.deb` 下载形式形式可用：


    ```

    $ sudo dpkg –i app_name.deb

    ```


    ### Red Hat, Fedora 和 CentOS


    Red Hat 默认使用多种包管理系统。所有这些系统都使用自己的术语，但它们之间以及与 Debian 使用的工具仍然有些相似。例如，你可以使用 `dnf`
    或 `yum` 管理器来安装应用程序。


    ```

    $ sudo yum install app_name

    ```


    $ sudo dnf install app_name

    ```


    `.rpm` 格式的应用程序也可以通过 `rpm` 命令在系统中进行升级。


    ```

    $ sudo rpm –i app_name.rpm

    ```


    如果你想从系统中删除某些不需要的应用程序，那么：


    ```

    $ sudo yum remove app_name

    ```

    $ sudo dnf remove app_name

    ```


    当你想要更新应用程序时：


    ```

    $ yum update

    ```

    $ sudo dnf upgrade – refresh

    ```


    ### 从 Linux 系统卸载软件


    你可以通过软件仓库在 Linux 系统中安装软件。要查看系统中所有安装的包，你可以使用 `dpkg` 命令，然后按下 `Ctrl+Alt+T` 打开终端窗口。因此，你可以使用命令：


    ```

    dpkg – list

    ```


    你可以在终端窗口中滚动查看已安装软件包的完整列表，以找到你想从系统中卸载的内容。


    要卸载包或程序，你需要使用 `apt-get` 命令，它是用于安装以及处理所有已安装程序的基本命令。例如，此命令将卸载 `gimp` 并通过 `-- purge`
    命令删除其所有配置：


    ```

    sudo apt-get -- purge remove gimp

    ```


