    Wi-Fi, or wireless networking, is the most preferred medium which is used for
    the purpose of network connectivity in today’s world. However, because of its
    popularity, the wireless networks are also subjected to various attacks, along
    with several issues of security. If the attacker gains complete access to the
    network connection then the attacker can sniff off the data packets from any nearby
    location. The attackers employ sniffing tools for finding out the `SSIDs` and
    then hacks the Wi-Fi or wireless networks. After successful hacking, the attackers
    can monitor all the devices which are connected with the same `SSID` of the network.
    If you use authentication of `WEP` then it might be subject to dictionary attack.
    The attackers employ the `RC4` encryption algorithm for the purpose of creating
    stream ciphers which are easily cracked. In case you are using authentication
    of `WPA`, then it might be subject to `DOS` along with dictionary attacks.


    # Tools for hacking of Wi-Fi


    For the purpose of cracking `WEP`, the attackers use various tools such as `WEPcrack`,
    `Aircrack`, `Kismet`, `WEPDecrypt` and many others. For cracking `WPA`, tools
    such as `Cain`, `Abel` and `CowPatty` are used by the hackers. There are also
    other tools which are used in general for hacking of wireless network systems
    like `wireshark`, `Airsort`, `Wifiphisher`, `Netstumbler` and many others. Even
    the attackers are now able to hack the mobile phone platform via the wireless
    network system. `Android` can be regarded as the most found mobile phone based
    platform but it is also very much susceptible to some specific types of vulnerabilities
    which ultimately makes it easier for the attackers to exploit the device security
    and then steal data from it. The most dangerous threats for the mobile devices
    are third party applications, email Trojans, wireless hacking and SMS.


    # How are Wi-Fi attacks carried out?


    Most of the wireless network attacks are carried out by setting up rogue Access
    Points.


    - **Evil Twin attack**: In this, the hacker sets up a false access point with
    the same name as that of the corporate `AP` which is close to the premises of
    the company. When any employee of the company connects to that access point, that
    employee unknowingly gives out all the details of authentication of the actual
    access point. Thus, the hacker can easily compromise the overall connection.

    - **Signal jamming**: The hackers can easily disrupt the network connection which
    can be done by jamming the network signals. This is done by various tools which
    are used for creating noise.

    - **Misconfiguration attack**: When the router of a network is set up by using
    a default form of configuration, weak form of encryption, weak credentials and
    algorithms, an attacker can easily crack the network.

    - **Hotspot attack**: The attackers set up false hotspots or access points with
    the same name of the `SSID` similar to any public Wi-Fi access point. When any
    user connects with that access point unknowingly, the hackers can easily get access
    to the actual network.


    # How to Carry Out an Effective Attack


    The term ‘hacking’ doesn’t mean that it has to be negative all the time. You will
    have a proper idea about the overall process of hacking only when you will have
    a clear perception about the process behind it. Not only will you be able to learn
    about the process of hacking, but you will also be able to make your system much
    more protected from external attacks. Most of the time, when an attacker tries
    to gain access to a server of an organization or a company, it is generally done
    by using 5 proper steps. Let’s have a look at those steps.


    - **Reconnaissance**: This can be regarded as the very first step in the hacking
    process. During this phase, the attacker uses all the available means for the
    purpose of collecting all forms of relevant information about the primary target
    system. The relevant set of information might include the proper identification
    of the target, `DNS` records of the server, range of the `IP` address which is
    in target, the network and various other aspects. In simple terms, the attacker
    tries to collect all sorts of information along with the contacts of a website
    or server. This can be done by the attacker by the use of several forms of search
    engines like `maltego` or by researching about the system which is the target
    or by using the various tools like `HTTPTrack` to download a complete website
    for enumeration at a later stage.


    By performing all these steps, the attacker will be able to determine the names
    of all the staffs within an organization very easily, find out the designated
    posts along with the email addresses of the employees.


    - **Scanning**: After collecting all the relevant information about the target,
    the attacker will now start with the process of scanning. During this phase, the
    attacker employs various forms of tools like dialers, port scanners, vulnerability
    scanners, sweepers and network mappers for the purpose of scanning the target
    website or server data. During this step, the attackers try to seek out all the
    information which can actually help in the execution of a successful attack such
    as the `IP` address of the system, the user accounts and the computer names within
    that server. Right after the hackers are done with scanning of basic information,
    they start to test the target network to find out the possible avenues of attack.
    They might also employ several methods for network mapping just like `Kali Linux`.


    The hackers also search for any automatic email system by which they can mail
    the staff of the target company about some false form of query like mailing the
    company HR about a job query.


    - **Access gaining**: This is the most important of all the steps. In this phase,
    the attacker designs the blueprint of the target network along with the help of
    all relevant information which is collected in the first and second steps. As
    the hackers are done with enumeration of data followed by scanning of the system,
    they will now move to the step of gaining access to the system which will be based
    on the collected information.


    - For instance, the attacker might decide to use a phishing attack. The attackers
    will always try to play safe and might employ a very simple attack for gaining
    overall access to the system. The attacker might also penetrate into the system
    from the IT department shell. The hackers use phishing email by employing the
    actual email address of the company. By using this phishing email ID, the attacker
    will send out emails to the techs that will also contain some form of specialized
    program along with a phishing website for gathering information about the login
    passwords and IDs. For this, the attackers can use various methods such as phone
    app, website mail or something else and then asking the employees to login with
    their credentials into a new website.


    As the hackers use this method, they already have a special type of program running
    in the background which is also called as `Social Engineering Toolkit` which is
    used for sending out emails with the address of the server to the users.


    - **Maintaining access to the server**: After the attackers have gained access
    to the target server, they will try every possible means for keeping their access
    to the server safe for future attacks and for the purpose of exploitation. As
    the attacker now has overall access to the server, he might also use the server
    as his very own base for launching several other forms of attacks. When an attacker
    gains access to an overall system and also owns the system, such a system is called
    as `zombie system`. The hacker might also try to hide himself within the server
    by creating a new administrator account with which he can easily mingle with the
    system without anyone knowing about it. For keeping safe access to the system,
    the hacker traces out all those accounts which are not being used for a long time
    and then elevates the privileges of all those accounts to himself.

