    \n## Shell 脚本编写\n\n通常情况下，Shell 本质上是交互式的，这意味着它们可以接受用户输入的命令作为输入并执行这些命令。\n\n然而，你可能需要或想要以例行方式执行执行大量命令，这样你就不需要每次都在终端中输入所有命令了。由于\
