    在我们开始学习 Kali Linux 的其他方面之前，你有必要学习一下 Linux 自带的一些基础工具和命令。让我们来看一些最基础的组件。


    ## 核心 Linux 终端命令


    与市场上提供的其他操作系统（特别是 Linux）相比，当提到“命令”（Command）这一术语时，指的是为用户 Shell 中内置的应用程序或功能的命令行指令。然而，这种区别对于终端用户来说意义不大。


    两者的使用方式相同。你只需要在终端模拟器中输入这些单词，它就会提供结果作为输出。


    ### 用于文件系统管理的 Linux 命令


    - `ls`: 此命令有助于列出当前目录下的所有内容。当你为其提供一个路径时，它将仅列出该路径的特定内容。你需要了解的一些有用选项是 `-l` 和 `-a`：`-l`
    以长列表格式显示信息，包含更详细的信息，并显示以点（dot）开头的隐藏文件。

    - `cat`: 当提供单个文件时，此命令有助于以标准格式将该文件的内容打印到输出中。当你同时提供多个文件时，它会将它们合并，然后将输出重定向到一个完全的新文件中。最有用的选项是
    `-n`，它有助于对行进行编号。

    - `cd`: 此命令有助于从当前目录跳转到另一个指定的目录。当你不带任何参数使用此命令时，它将返回主目录。当你使用带有两个点的命令（如 `cd..`）时，它将返回到当前目录的上一级；使用带有连字符的命令（如
    `cd –`）将返回到当前目录之前的目录，无论其相对于当前目录的位置。

    - `pwd`: 此命令有助于打印当前目录。当你的提示符不包含此特定信息时，此命令非常有用。它对于 BASH 编程非常有用，用于获取将要执行代码的目录引用。

    - `mkdir`: 此命令用于创建新目录。最方便的开关是 `-p`，如果特定结构尚不存在，它可以帮助创建整个特定性质的结构。

    - `file`: `file` 命令有助于指示文件类型。由于 Linux 系统中的文件并没有义务必须具有与系统相关的扩展名才能运行，因此用户有时很难获取文件的确切类型。此命令有助于解决与
    Linux 相关的此类问题。

    - `cp`: 此命令复制所有目录和文件。由于此命令默认不会递归复制目录，请务必在使用此命令时加上 `-a` 或 `-r`。`-a` 命令在复制的同时有助于保留所有权、模式和时间戳。

    - `mv`: 它用于重命名或移动目录和文件。重命名和移动可以被视为单次操作，重命名只是将单个文件以不同的名称移动到相同的位置。

    - `rm`: `rm` 命令用于删除目录和文件。这是一个你需要了解的核心命令，因为没有这个命令你无法删除任何杂物。然而，在使用此命令时必须格外留心，因为此命令会永久删除文件和目录。与其他命令不同，此命令不会将删除的文件和目录存储在其他地方以便你事后提取。一旦它们消失，就永远消失了。因此，在这种情况下，配合命令使用
    `-r` 关是非常重要的。

    - `ln`: 此命令用于在文件之间创建符号链接或硬链接。软链接或符号链接类似于 Windows 的快捷方式，提供了访问任何特定文件夹或文件的非常方便的方法。

    - `chmod`: 它有助于更改用户的权限。权限包括对文件的写入、查看和执行。任何用户都可以更改其拥有的文件的用户权限。

    - `chown`: 此命令用于更改文件的所有权。只有 root 用户才能使用此命令并更改文件所有权。为了递归更改目录内所有文件的所有权，你可以使用带有 `-R`
    的命令。

    - `find`: 此命令用于在整个文件系统中搜索特定的目录或文件。此命令在本质上非常强大，不仅是因为它具有搜索能力，还因为它允许用户对匹配或不匹配的文件执行任何形式的命令。

    - `locate`: 与 `find` 相反，`locate` 命令通过数据库搜索文件名的模式。这种数据库由整个文件系统的快照组成。

    - `du`: `du` 命令用于显示目录或文件的大小。在各种有用选项中，`-s` 提供摘要而非整个列表，`-h` 将报告的尺寸转换为更符合人类阅读习惯的格式，`-d`
    有助于控制目录的递归深度。

    - `df`: 此命令用于显示磁盘的使用情况。此命令的默认输出列出了每一个文件系统，报告它们的大小，以及已用空间和可用空间。你可以为此命令添加 `-h` 以获取更符合人类阅读习惯的格式报告。

    - `dd`: 此命令有助于根据主页转换并复制特定文件。你需要为此命令提供源和目的，它将分别复制文件。

    - `mount/unmount`: 这对命令执行文件系统的挂载和卸载功能。整个范围可以从 USB 闪存到 ISO 镜像。


    ### 用于文本处理的 Linux 命令


    - `more/less`: 这两个命令在功能上有些相似，允许用户按屏幕分页轻松查看文本。假设某些命令产生了非常大的输出（例如对文件使用 `cat`），模拟器需要一些时间滚动整个文本。当你使用这些命令中的任何一个时，现在可以轻松地滚动文本了。与
    `more` 相比，`less` 更新，因此现在不再使用 `more`。

    - `head/tail`: 这也是一对命令，但它们都有各自的用途。`head` 命令有助于输出文件第一行的行数，而 `tail` 命令通过提供任何文件最后一行的行数作为输出。这些命令的默认输出行数为十，可以通过选项
    `-n` 进行控制。另一个可以与此命令一起使用的开关是 `-f`。

    - `grep`: 此命令有助于搜索文本中的模式。在默认功能下，此命令查看标准输入，但用户可以轻松指定要搜索的文件。模式可以是正则表达式，也可以是普通字符串。它还可以打印匹配或不匹配的行以及它们的上下文。当你运行一个提供大量信息作为输出的命令时，只需使用此命令即可魔法。

    - `sort`: 此命令用于根据各种标准对文本行进行排序。与此命令一起使用的有用开关包括 `-n`（有助于对字符串的数值进行排序）、`-r`（有助于反转提供的输出）以及其他多种。在排序
    `du` 命令的输出时可以使用此命令，当你想要完全按照大小降序排列文件时。

    - `wc`: `wc` 命令用于统计单词数、行数、字节数和字符数。


