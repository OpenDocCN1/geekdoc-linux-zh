    ● Inferential or Blind SQL injection: 1\. Based on Boolean: It is based on return
    of true or false.


    2\. Time based: It sends out SQL injection which forces the database              
    just before responding.


    ● Out of band SQL injection: This takes place when an attacker is unable to use
    the similar form of channel for attacking and gathering the results.


    Tools used for SQL injection


    There are various tools which are used for carrying out SQL injection.


    ● SQLMap: This tool is used for an automatic form of SQL injection and it helps
    in taking over the database.


    ● jSQL Injection: It is a Java based tool which is used for SQL injection.


    ● Blind-SQL-BitShifting: It is used for blind SQL injection by the use of BitShifting.


    ● BBQSQL: It is a blind form of SQL injection exploitation tool.


    ● explo: It is a format of machine and human readable web vulnerability testing.


    ● Whitewidow: It is a scanning tool which is used for checking out the vulnerabilities
    of the SQL database.


    ● Leviathan: It acts as an audio toolkit.


    ● Blisqy: It is used for the purpose of exploiting time-based SQL injection within
    the headers of HTTP.


    Detection tools for SQL injection


    A tool named Spider testing tool is widely used for the purpose of identifying
    the holes of SQL injection manually by the use of POST or GET requests. If you
    can resolve the vulnerabilities within the code then you can easily prevent the
    SQL injections. You can also use a web vulnerability scanner for identifying all
    the defects within the code and for fixing the same to prevent SQL injection.
    The firewalls present in the web application or within the application layer can
    also be used extensively for preventing any form of intrusion.


    Hacking of Wi-Fi'
