    -   **Shell 命令**: 包括 `ls`、`cd`、`echo`、`touch`、`pwd` 等。\n-   **控制流**: 包括 `if..then..else`、`shell`\
    \ 和 `case` 循环等。\n\n你可以使用 Shell 脚本来避免重复工作，从而实现自动化。它也有助于监控，并允许为 Shell 添加各种新功能。\n\
