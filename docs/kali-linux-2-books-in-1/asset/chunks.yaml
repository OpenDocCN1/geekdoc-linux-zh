  trans: "\n\n## 优点\n\n- 虚拟机可以克隆（节省时间）。\n- 支持日益增多的虚拟硬盘记录类型。这在运行下载的和预构建的虚拟机时特别有帮助。\n\
    \n## 缺点\n\n- 虚拟机之间是相互隔离的，除非在主机上开启了端口转发。\n- 不支持 `Xen`、`XenServer`、`vSphere` 或不同类型的虚拟机监控程序所需的嵌套虚拟化。\n\
    - 如果虚拟机崩溃，整个虚拟机损坏的概率会更高。\n\n## 简介\n\n本指南专门用于在 `Microsoft Windows 7 专业版` 上引入的 Oracle\
    \ `VirtualBox` 适配版本 `4.2.16`。选择 `VirtualBox` 而不是 `VMWare Player` 是因为在出现问题时，互联网上有更多资源可以帮助；尽管如此，它需要一些额外的配置。\n\
    \n请记住，在选择虚拟化框架时，最好的测试是你自己的研究。关于哪种最好已经有了很多讨论，最终选择哪一个虚拟化框架取决于个人喜好。同样，与防病毒软件不同，两者都可以引入以满足不同的需求，因此在同一台\
    \ PC 上同时引入 `VirtualBox` 和 `VMWare Player` 是可能的。本指南中使用的链接和引用在编写时是有效的。请注意，版本、下载区域和数据可能会随时更改。\n\
    \n## 在 Microsoft Windows 7 上安装 VirtualBox\n\n打开网络浏览器并访问：`[`www.virtualbox.org/wiki/downloads`](https://www.virtualbox.org/wiki/downloads)`\n\
    \n确保输入的网址准确至关重要。\n\n为你的工作框架选择正确的程序版本并开始下载程序。下载完成后，运行可执行文件。图中显示了 `VirtualBox` 安装的欢迎对话框。点击\
    \ `Next` 继续。\n\n本教程将不涵盖自定义设置。接受对话框中的默认选项，并点击 `Next` 继续。\n\n### 安装\n\n1. 如图 5.3\
    \ 所示选择你的设置，并点击 `Next`。出现系统警告，点击 `Yes`。\n2. 点击 `Introduce` 按钮。如果弹出用户账户控制 (`UAC`)\
    \ 窗口，点击 `Yes`。\n3. 安装可能会如图 5.6 所示引入驱动程序。点击 `Install` 继续。（可能会发生多次。）\n\n安装完成后，点击\
    \ `Finish` 按钮。\n\n`VirtualBox` 安装已完成，如果勾选了“启动 Oracle VM”设置，将打开 `VirtualBox` 管理器。此时虚拟机已创建，可以关闭。\n\
