- fmt: '

    - `diff`: This command helps in showing the exact difference between two different
    files using line by line comparison.


    ## Linux commands for management of the process


    - `kill`/`xkill`/`pkill`/`killall`: All of these commands are used for the purpose
    of killing any process and then terminating it. The difference between all these
    lies in what they accept as inputs. The `kill` command accepts the ID of process,
    the `xkill` command allows the user to click on a window for closing the same
    and `killall` along with `pkill` accepts only the names of the processes.

    - `ps`/`pgrep`: It has already been mentioned in the previous command that `kill`
    requires the ID of the process. This can be obtained by using the command `ps`
    which helps in printing the information related to the current processes which
    are active in nature. The command `pgrep` works in a particular way: you are required
    to provide the name of the process and it will return the process ID.

    - `top`/`htop`: These two commands are similar in function and both of these help
    in displaying the processes. It can also be thought of as the monitors of a console
    system.

    - `time`: This command works as a process. You can think of this as the stopwatch
    for the execution of a program.


    ## Linux commands for User and BASH environment


    - `su`/`sudo`: Both of these commands are different ways of achieving the same
    thing- running the commands as some other user. Completely depending on the type
    of distribution that you have, you have seen one or the other but in actual both
    are serviceable with these commands. The difference between two commands is that
    `su` switches the user to some different user whereas `sudo` runs the commands
    only with the privileges of other users.

    - `date`: Unlike the command `time`, this command helps in printing the time along
    with the date for the standard form of output. The output can also be formatted
    according to the user specification and it includes everything: month, day and
    year.

    - `alias`: This command helps in creating and changing the aliases to some other
    commands. This means that you can easily provide new names to new commands or
    you can rename the already existing commands. It is very useful for the purpose
    of abbreviating the long command strings which can cause problems while memorizing.

    - `uname`: It helps in outputting some of the basic information about the system.
    By pairing this command with `-a` you can get the kernel information along with
    the hostname and architecture of the processor.

    - `uptime`: This command will tell you the duration for which the system has been
    running. It is not very important but it helps in finding out the overall time
    of the system processing.

    - `sleep`: This command helps in shutting down the system after a specific period
    of time.


    ## Linux commands for management of user


    - `useradd`, `usermod`, `userdel`: All of these commands will help you to add,
    modify and delete the accounts of the users. In case you are the only sole user
    of the system, you will not be requiring these commands that much. But, if the
    system is being used by various users at a time then these commands are very useful.

    - `passwd`: This command will allow you to change the password of your user account.
    As the root user, you can reset all the normal nature of user passwords however
    you cannot view the passwords. It is of utter importance to change the passwords
    from time to time.


    ## Linux commands for documentation/help


    - `man` `/whatis`: The command `man` helps by bringing up the manual for one specific
    command. The majority of the command lines come with man page. The command `whatis`
    helps by providing one line summary of some specific section of the manual.

    - `whereis`: This command tells the users where the binary files of executable
    nature lives, provided that the binary files are within the path of the user.
    It can also find out the source code and manual page, if present.


    ## Linux commands for networking


    - `ip`: This command helps by providing the ip address of a system.

    - `ping`: The `ping` command functions as an important tool of diagnosis. It helps
    in testing easily whether you are connected with the internet or router. It also
    helps by indicating the connection quality.


    ## Linux Command Line


    Command line can be regarded as one of the strengths of Linux systems. The CLI
    or command line interface allows the user to be absolutely free of the distros.
    It also makes the task of interacting with the system much easier. The derivate
    of Ubuntu uses the same base of codes but all of them come with a completely different
    set of tools for performing the same job. The various forms of desktop environments
    on the similar distro will require various ways to perform the same form of task.
    As a user, you will need to forget the processes that you already know and then
    re-learn the processes for performing the same thing as they hop between the distros.
    The command line of Linux saves the resources of the system which are also consumed
    by the GUIs. So, in case you are working on a slower system, it is better for
    you to use command line rather than GUI.


    Many people think of command line as being very difficult; however, it is not.
    It is as simple as messaging your friends where you text the system what to do.


    ### Getting the shell


    Shell is nothing but a program which turns the typed text into the form of orders
    or commands for the computer system to perform. You can use various forms of commands
    for performing the same task. There are various shells which you can find for
    Linux but the most popular shell of all is the BASH, written by the GNU Project.
    Another form of modern-day shell is the `zsh` which you can easily install for
    your distribution.


    If you are working on a desktop environment, you will require a terminal emulator
    for the purpose of emulating the terminal within the particular interface. Different
    form of distros come with their own emulators: KDE comes along with `Konsole`
    and Gnome also comes along with `Gnome terminal`.


    ### Some of the basic commands


    When you open up the terminal emulator, you will be in the home directory by default
    of the user who is logged in. You can easily find out the name of the user who
    is logged in along with the hostname. The `$` indicates that you have logged in
    as a regular form of user whereas the `#` indicates that you have been logged
    in as the root. Unless and until you are doing any form of administrative tasks
    or functioning outside the directories of root, never function as root.


    This will change all the permissions for all the directories along with the files
    on which you have already worked on and will make the root the user of all those
    directories. You can easily list all the available directories along with the
    files inside them by using the command `ls`.


    If you need to change any of the directories, use the command `cd`. You can also
    employ the key `tab` which helps by auto-completing the complete path. You can
    use forward slash for the purpose of entering the directories. You will not need
    to provide the entire path in case you want to get inside the sub-directory of
    the present directory. For seeing the contents of a directory, you will not need
    to change the directory. Just use the command `ls` for viewing the contents of
    a specific directory.


    ### Some Advanced Command Line


    Most of the developers who work with the command line of Linux know the basic
    form of commands such as `cd`, `ls`, `tail`, `head`, `cat`, `grep`, `find`, `sort`
    and many others. The advanced users will need to know how to function with the
    beasts such as `awk` and `sed` or even perl-oneliners. With advanced knowledge
    of BASH scripting, you will find that imagination is the only limit. Let’s have
    a look at some of the advanced form of command line.

    '
