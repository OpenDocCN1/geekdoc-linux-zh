    这是一种用于信息收集和数据关联的安全信息工具。它带有对 `UDP` 和 `TCP` 端口的异步扫描，并具有发现网络模式的功能，这有助于发现远程主机的形式。它还能提供有关它们运行的所有软件的详细信息。该工具的主要功能是：


    - 它对 `TCP` 端口执行异步扫描。

    - 它对 `UDP` 端口执行异步扫描。

    - 它对 `TCP`  banner 执行异步检测。

    - 它可以检测操作系统系统服务以及应用程序状态。

    - 它具有使用自定义数据集的能力。

    - 它还支持 `SQL` 的关系型输出。


    ### Fierce


    它是一种用于网络映射和端口扫描的工具。它还可以用于发现跨多个网络不连续的 `IP` 空间以及主机名。它与 `Unicornscan` 和 `Nmap` 相似，但与这两个不同的是，`Fierce`
    专门用于企业网络。在渗透测试人员定义目标网络后，该工具将对选定的域运行各种测试以检索信息，这些信息可以用于后续阶段的分析和利用。该工具的主要功能包括：


    - 它具有更改 `DNS` 服务器以进行反向查询的能力。

    - 它执行内部和外部 `IP` 范围扫描。

    - 它执行 `IP` 范围以及整个 `Class C` 的扫描。

    - 它帮助将功能记录到文件系统中。

    - 它发现名称服务器并还能发现区域传输攻击。

    - 它具有使用自定义或内置文本列表进行暴力破解的能力。


    Linux 中还有许多其他工具，可以帮助渗透测试以及伦理黑客攻击。每种工具都有自己的一套易用性，任何渗透测试人员都可以轻松地使用。


    # 第 6 章：Linux 编程


    在 Linux 上编程被用于创建接口、应用程序、软件和程序。Linux 代码通常用于桌面、嵌入式系统以及实时程序。Linux 是一个开源操作系统内核，兼容
    `Perl`、`C++`、`Java` 以及其他各种编程语言。


    ## Linux 是如何工作的？


    Linux 作为一个操作系统的内核，也可以被自由分发和共享。操作系统（OS）是帮助用户连接到计算机硬件的接口，并支持应用程序和程序的运行。内核无非是操作系统的核心，因为它管理着硬件和软件组件之间的所有通信。


    ## Linux 程序员的职责是什么？


    开始 Linux 编程需要使用如 `GBU` 编译器和调试器等工具。它们有助于创建用于存储数据的应用程序、构建 `GUI` 以及编写脚本。与 Linux 相关的高级应用程序允许程序员开发与
    Linux 相关的软件。他们还优化已有的程序，并编写具有各种复杂功能的新程序，如多进程处理、多线程、进程间通信以及硬件设备交互。


    ## Linux 的用途


    Linux 今日被广泛应用于各种服务器、计算机安全系统和计算机系统架构。它被广泛用于实时程序以及 `PDAs` 和手机的嵌入式系统。Linux 编程也导致了各种应用程序。


    ## 如何开发内核模块？


    在开始 Linux 核心编程之前，增加你的知识和 Linux 编程专业知识的最佳方法是从开始编写内核模块。模块是独立开发的，与 Linux 内核一起工作作为一个紧凑的操作系统。内核模块由各种内容组成，例如多个硬件外围设备驱动、文件管理器以及操作系统的其他低级功能。


    进入内核模块的门槛比开发 Linux 内核要低得多。有许多模块由不同的个人和团队开发。因此，在开发入口没有特定的守门人。


    ## Linux 编程的逻辑拆解


    当你使用某些主要形式的操作操作系统时，你是在间接地与 shell 交互。如果你使用 `Linux Mint`、`Ubuntu` 或其他适当的 Linux 发行版，你每次使用终端时都会与
    shell 交互。让我们讨论一下 Linux 编程的拆解，它由 Linux shell 以及 shell 脚本组成。


    在在我们开始之前，你需要熟悉一些术语：


    - `Kernel`

    - `Shell`

    - `Terminal`


    ### 什么是内核？


    内核无非是一个作为操作系统核心的程序。它对系统中所有元素具有整体控制权。它有助于基于 Linux 管理系统的各种资源：


    - 文件管理

    - 进程管理

    - `I/O` 管理

    - 内存管理

    - 设备及其他组件的管理


    一个完整的 Linux 系统可以拆解为：`Kernel + 安装脚本 + 其他管理脚本 + `GNU` 系统库和实用程序`。


    ### 什么是 shell？


    Shell 是一种特殊的用户程序，有助于为与操作系统相关的服务提供适当的接口。shell 接受人类可读的用户命令，然后将其转换为内核可以理解的内容。它可以被视为命令语言的解释器，有助于执行从键盘等输入设备或系统文件读取的命令。当用户登录系统或启动终端时，shell
    启动。


    shell 可以被归分为两个不同的类别：


    - 图形 shell

    - 命令行 shell


    图形 shell 为基于 `GUI` 或图形用户界面的程序操作提供了各种手段。这是通过允许关闭、打开、调整大小和移动窗口等操作，以及在窗口之间切换焦点来实现。`Ubuntu`
    操作系统和 `Windows` 操作系统可以被认为是很好的示例，它们为用户提供了 `GUI` 以与各种程序交互。


    用户可以通过 `CLI` 或命令行界面访问 shell。Linux 中提供了一种名为终端的特殊程序，用于输入人类的 `ls`、`cat` 等许多其他命令并对其进行执行。最终结果将直接显示在终端上，用户可以直接看到。假设你执行了命令
    `ls` 并带有选项 `-l`。这这将以长列表的形式列出当前工作目录下的所有可用文件。


    如果你只是初学者，配合命令行 shell 工作可能会变得有点困难，因为很难同时记住一大堆命令。它在本质上是非常强大的，它还允许用户将所有命令存储在一个特定文件中，然后一起执行所有命令。通过这种方式，任何形式的重复任务都可以轻松实现自动化。这些文件在
    Linux 系统中通常被称为 `Shell Scripts`。


    在 Linux 系统中，有多种类型的 shell 可供用户使用：


    - `BASH`: 也称为 `Bourne Again Shell`，被广泛应用于基于 Linux 的系统。它被 Linux Linux 系统默认登录 shell。如果你愿意，也可以在
    Windows 操作系统中安装它。


