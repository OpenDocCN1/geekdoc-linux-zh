    mounted on /(the root directory)* when your system boots. Select the root partition
    you wish to use and press **Enter**


    If you are performing an upgrade, the installation program tries to find your
    root partition automatically; if it finds one, it goes on the next step.


    # Other Partitions


    The next dialog box contains a list of all disk partitions with filesystems readable
    by Red Hat Linux, including partitions for MS-DOS or Windows. This gives you the
    opportunity to assign these partitions to different parts of your Red Hat filesystem.
    The partitions you assign will be automatically mounted when your Red Hat Linux
    system boots. Select the partition you wish to assign and press **Enter** (or
    choose **Edit**); then enter the *mount point* for that partition, e.g., */usr*
    (see Figure 4.11 on page 66).


