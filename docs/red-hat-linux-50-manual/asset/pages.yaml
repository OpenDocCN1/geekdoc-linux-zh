- pgno: 253
  md: '# XL266


    The XL266 is one of a family of systems that are known as Avanti. It has a riser
    card containing the Alpha chip and cache which plugs into the main board at right
    angles. This board can replace the equivalent Pentium board.


    Some of these systems ship with the SRM console but others, notably, all of the
    XL266 ship only with the Windows NT ARC firmware (Section E.5.1).


    Here is my list of compatible systems:


    +   * AlphaStation 400 (Avanti),

    * AlphaStation 250,

    * AlphaStation 200 (Mustang),

    * XL. There are two flavours, XL266 and XL233 with the only difference being in
    processor speed and cache size.


    Note The system that I use to develop and test MILO is an XL266 and so this the
    only one I can guarantee work. technically, the above systems are equivalent;
    they have the same support chipsets and the same interrupt handling mechanisms.


    # Platform2000


    This is a 233Mhz 21066 based system.


    # E.6 MILO’s User Interface


    Once you have correctly installed/loaded/run MILO you will see the MILO (for MiniLOader)
    prompt displayed on your screen. There is a very simple interface that you must
    use in order to boot a particular Linux kernel image. Typing “help” is a good
    idea as it gives a useful summary of the commands.


    # E.6.1 The "help" Command


    Probably the most useful command that MILO has:'
  merge: -1
  img_proc: true
- pgno: 254
  md: '# MILO''s User Interface


    MILO> help

    MILO command summary:


    +   ls [-t fs] [dev[:dir]]

    - List files in directory on device

    boot [-t fs] [dev:file] [boot string]

    - Boot Linux from the specified device and file

    run [-t fs] dev:file

    show - Run the standalone program dev:file

    - Display all known devices and file systems

    set VAR VALUE - Set the variable VAR to the specified VALUE

    ununset VAR - Delete the specified variable

    reset - Delete all variables

    print - Display current variable settings

    help (var) - Print this help text


    Devices are specified as fd0, hda, hda2, sda...

    Use the ''-t filesystems-name'' option if you want to use

    but the default filesystem (''ext2'').

    Use the ''show'' command to show known devices and filesystems.

    Type ''help var'' for a list of variables.


    > Note that the bootcommand only appears on AlphaPC64 (and similar) systems. Refer
    until you use a command that needs to make use of a device, no device initialisation
    will take place. The first show, is, boot or run commands all cause the devices
    within MILO is to name themselves so. Devices are named the same way (exactly)
    as Linux itself so, and it''s first partition will be called ''hda1''. Use the
    show command to show what devices are available.


    File Systems. MILO supports three file systems, MSDOS, EXT2 and ISO9660. As long
    as a device is available to it, MILO can listboot or run an image stored on one
    of these file systems. MILO''s default file system is EXT2 and so you have tell
    MILO that the file system is something other than that. All of the commands that
    use filenames you to pass the file system using the -t [filesystem] option. So,
    if you wanted to list the contents of a SCSI CD ROM, you might type the following:


    ```

    MILO> ls -t iso9660 scd0:

    ```'
  merge: -1
  img_proc: true
- pgno: 255
  md: '240


    # Alpha Miniloader Howto


    Variables. MILO contains some settable variables that help the boot process. If
    you are loading via the Windows NT ARC firmware, MILO makes use of the boot option
    environment variables set up by that. For some systems, MILO (for example, the
    AlphaPC64) maintains its own set of environment variables that do not change from
    boot. These variables are:


    ```

    MILO> help var

    Variables that MILO cares about:

    MEMORY_SIZE - System memory size in megabytes

    BOOT_DEV - Specifies the default boot device

    BOOT_FILE - Specifies the default boot file

    BOOT_STRING - Specifies the boot string to pass to the kernel

    SCSIN_HTOSID - Specifies the host id of the n-th SCSI controller.

    PCI_LATENCY - Specifies the PCI master device latency

    AUTOBOT - If set, MILO attempts to boot on powerup and enters command only on
    failure.

    AUTOBOT_TIMEOUT - Seconds to wait before auto-booting on powerup.

    ```


    BEWARE of setting AUTOBOT without setting the timeout, you can end up automatically
    booting after a timeout of 0 seconds which may not be what you want.


    PCILLATENCY is the number of PCI bus cycles that PCI bus mastering device hangs
    onto the PCI bus for once it has control. The default value for this is 32 and
    the maximum value is 255. Setting a high value means that each time a device gets
    control of the PCI bus it can transfer more data. However, setting it high also
    means devices may have to wait longer to get control.


    # E.6.2 Booting Linux


    The boot command boots a linux kernel from a device. You will need to have a linux
    kernel on an EXT2 formatted disk (SCSI, IDE or floppy) or an ISO9660 formatted
    CD available to MILO. The image can be gzipd and in this case MILO will automatically
    gunzip it. Early versions of MILO recognised a gzip file by the .gz suffix but
    later MILOs look for magic numbers in the image.


    You should note that the version of MILO does not usually have to match the version
    of the Linux kernel that you are loading. Boot Linux using the following command
    syntax:'
  merge: -1
  img_proc: true
- pgno: 256
  md: "```\nMILO> boot [-t file-system] device-name:file-name \\\n      [boot-option]\
    \ [boot-option] ...\n```\n\nIf device-name is the name of the device that you\
    \ wish to use and file-name is the name of the file containing the Linux kernel.\
    \ All arguments supplied after the file name are passed directly to the Linux\
    \ kernel.\n\nIf you are installing Red Hat, then you will need to specify a root\
    \ device and so on.\n\n```\nMILO> boot fd0:mlinux.gz /dev/fd0 load_ramdisk=1\n\
    ```\n\nMILO will automatically detect the block devices that you configure into\
    \ vmlin. I have tested the floppy driver, the IDE driver and various SCSI drivers\
    \ (for example, and these work). Also, it is important to set the host id of the\
    \ SCSI controller to a reasonable value. By default, MILO will initialize it to\
    \ the highest possible value (7) which should normally work just. However, if\
    \ you wish, you can explicitly set the host id of the n-th SCSI controller in\
    \ the system by setting environment variable SCSI_HOSTID to the appropriate value.\
    \ For example, to set the host of the first SCSI controller to 7, you can issue\
    \ the following command at the MILO prompt.\n\n```\nsetenv SCSI0_HOSTID 7\n```\n\
    \n# E.6.3 Rebooting Linux\n\nYou may want to reboot a running Linux system using\
    \ the shutdown -r now command. In this case, the Linux kernel returns control\
    \ to MILO (via the HALT Call endpoint). MILO leaves a compressed copy of itself\
    \ in memory for this reason and detects that the system is being rebooted from\
    \ information held in the HWRPB (Hardware Restart Parameter Block). In this case\
    \ it starts to reboot using exactly the same command that was used to boot the\
    \ Linux kernel the last time. There is a 30 second timeout that allows you to\
    \ interrupt this process and reboot whatever kernel you wish in whatever way you\
    \ wish.\n\n# E.6.4 The \"bootopt\" command\n\nFor flash based systems such as\
    \ the AlphaPC64, EB164 and the EB66+, there are a number of possible boot options\
    \ and these are changed using the bootopt com-"
  merge: -1
  img_proc: true
- pgno: 257
  md: 'mand. This has one argument, a decimal number which is the type of the image
    to be booted the next time the system is power cycled or reset:


    0 Boot the Evaluation Board Debug Monitor,


    1 Boot the Windows NT ARC firmware.


    In order to boot the boot code to boot the MILO firmware from flash then you need
    a boot option that means boot the N''th image. For this, you need to 128 plus
    N, so if MILO is the third image, you would use the command:


    ```

    MILO> bootop 131

    ```


    Note: Be very careful with this command. A good rule is never to set bootop 0
    (the Evaluation Board Debug Monitor), but instead use the system''s jumpers to
    achieve the same thing.


    # E.7 Running the Flash Management Utility


    The run command is used to run the flash management utility. Before you start
    you will need a device available to MILO that contains the updateflash program.
    This (like vmlinux) can be gzip''d. You need to run the flash management utility
    from the MILO using the (run) command:


    ```

    MILO> run fd0:fmu.gz

    ```


    Once it has loaded and initialised, the flash management utility will tell you
    some information about the flash device and give you a command prompt. Again the
    help command is most useful.


    Linux MILO Flash Management Utility V1.0


    Flash device is an Intel 28f008SA

    16 segments, each of 0x10000 (65536) bytes

    Scanning Flash blocks for usage

    Block 12 contains the environment variables

    FMU>'
  merge: -1
  img_proc: true
- pgno: 258
  md: '# E.7 Running the Flash Management Utility


    243


    Note that on systems where environment variables may be stored and where there
    is more than one flash block (for example, the AlphaPC64) the flash management
    utility will look for a block to hold MILO''s environment variables. If such a
    block already exists, the flash management utility will tell you where it is.
    Otherwise, you must use the environment command to set a block and initialise
    it. In the above example, flash block 12 contains MILO''s environment variables.


    # E.7.1 The "help" command


    ```

    PMU> help

    PMU command summary:

    ```


    +   list - List the contents of flash

    program - program an image into flash

    guit - Quit

    environment - Set which block should contain the environment \

    variables


    ```

    bootop num - Select firmware type to use on next power up

    help - Print this help text

    PMU>

    ```


    Note that the environment and bootop commands are only available on the EB66+,
    the AlphaPC64, EB164 and PC164 systems (and their clones).


    # E.7.2 The "list" command


    The "list" command shows the current usage of the flash memory. Where there is
    more than one flash block, the usage of each flash block is shown. In the example
    below you can see that Windows NT is using blocks 4:7 and 15.


    ```

    PMU> list

    Flash blocks: 0:DBM 1:DBM 2:DBM 3:WNT 4:WNT 5:WNT 6:WNT

    7:WNT 8:MILO 9:MILO 10:MILO 11:MILO 12:MILO 13:U 14:U

    15:WNT

    ```


    ```

    Listing Flash Images

    Flash image starting at block 0:

    Firmware ID: 0 (Alpha Evaluation Board Debug Monitor)

    Image size is 19128 bytes (3 blocks)

    Executing at 0x300000

    ```'
  merge: -1
  img_proc: true
- pgno: 259
  md: 'Flash image starting at block 3:

    Firmware Id: 1 (Windows NT ARC)

