- pgno: 212
  md: '# Information Specific to Red Hat Linux/SPARC


    This appendix describes the differences between Red Hat Linux/SPARC and Red Hat
    Linux/Intel installations. While it provides a good overview of these differences,
    it does not completely document the installation process. For that, you will need
    to read chapters 2, 3, and 6 in order. These chapters will refer you to the appropriate
    parts of this appendix at the appropriate time.


    In addition, there is a Linux/SPARC homepage at http://www.geog.ubc.ca/m/linux.html.
    It has a wealth of information for people considering Red Hat Linux/SPARC, and
    is a great resource.


    # C.1 Supported Hardware


    Red Hat Linux/SPARC supports a variety of hardware based on the SPARC architecture.
    The most recent list of hardware supported by Red Hat Linux/SPARC can be found
    at Red Hat Software''s World Wide Web site at http://www.redhat.com/hardware.'
  merge: -1
  img_proc: true
- pgno: 213
  md: 'The following list is current as of the time this manual was produced:


    +   - sun4c architecture machines (IPC, SSI, etc)

    - sun4m architecture machines (Classic, SS5, SS10, etc)

    - bwtwo, cg3, cg6, TCX framebuffers (24 bit on the TCX)

    - cg14 framebuffer (in cg3 mode)

    - SCSI and Ethernet on all of the above

    - type 4 and type 5 keyboards and mice

    - external SCSI drives

    - CD-ROM drives (external and internal)

    - SCSI/Ether SBUS expansion cards

    - Any original equipment Sun monitor for the above framebuffers


    Unsupported Hardware – The following list contains hardware that is currently
    unsupported:


    +   - VME base sun4m machines, such as the 4/690

    - SPARC 5 Model 170 machines

    - sun4d (SS1000, SS2000)

    - sun4u (UltraSparc1, UltraSparc2, EnterPrice UltraSparc servers)

    - sun4 architecture


    +   - Eurocard sun4c machines, called the ''sun4e'' under Solaris2.4 and others,
    are are not supported. These are VME-bus sun4c machines, to which the kernel has
    not been ported.


    +   - The following types of CD-ROMs are unsupported (for more information on
    CD-ROM compatibility issues, please visit http://saturn.tlug.org/suncdfqag):


    +   - All NEC models

    - Some Toshiba XM-4101B revisions'
