    flash management utility, runnable from MILO is available so that once MILO is
    running, it can be blown into flash (Section E.7). This system supports MILO environment
    variables.


    These systems have several boot images in flash controlled by jumpers. The main
    jumper block, J30, contains the system configuration jumpers and jumper CF6 in
    means that the system will boot the Debug Monitor, the default is out.


    Blowing an image into flash via the Evaluation Board Debug Monitor is exactly
