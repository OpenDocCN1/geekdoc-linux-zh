- pgno: 150
  md: '# 9.1 User and Group Configuration


    To remove a user, select a user in the main window by clicking on it, and then
    click on Remove. You will be presented with the dialog box you may take. Figure
    9.3 There are three types of action you may take. You may ignore the user''s directory,
    leaving it alone, you can archive and compress it into a .tar.gz file, or delete
    it completely. You can delete the user''s mail pool if you like. These first two
    actions will take place immediately after you confirm the deletion, before the
    tool accepts more. You can search for files owned by the user on parts of the
    filesystem other than the home directory and give ownership to the user nobody
    or delete them. If you choose to search for the user''s files, you have the option
    of mailing a report of the errors to root. This is important because the searching
    will be done in the background as you continue to work; it may take a long time.
    To find files owned by nobody, execute the following command:


    ```

    find / \ (-group nobody -o -user nobody \) -print

    ```


    # Deactivating a user


    Sometimes you just want to temporarily remove a user, with the intention of reinstating
    the user later. The Lock and Unlock functions handle this. When you deactivate
    a user, the password is locked by prepending a ''*'' to it, preventing the user
    from logging in. You also have the option of “collapsing” the user''s home directory
    with t.az and g.z2, which can save some space. When you reactivate a user, the
    password locking is removed, and if the home directory was collapsed, it is expanded
    back to normal. When you lock a user, you are presented with the same options
    as when you delete a user, but you are unlikely to want to delete any files.


    # 9.1.3 Creating a New Group


    To create a new group, first switch to group editing mode by selecting the Groups
    tab at the top of the main window. Clicking Add brings up a dialog box to specify
    the group details. First enter a name for the new group. Just like a user, the
    group name should have no spaces or colons, and should be no longer than 8 characters.
    You can set a group password; if you do, users who are not members of the group
    may assume group membership by using the newgrp program and providing it with
    the password. To add members to the group, enter their names in the User list
    field. When you have selected all the group members, click Done'
  merge: -1
  img_proc: true
- pgno: 151
  md: '# 9.1.4 Editing an Existing Group


    To edit an existing group, double-click on the group in the main window, or click
    on the group and then on **View/Edit**. The same interface is used to edit an
    existing group as to create a new group.


    # 9.2 File System Configuration


    The file system configuration tool shown in Figure 9.4 allows you to easily examine
    and manipulate file system mount points, types, options, etc. It is very useful
    for manipulating a large number of file systems. You probably don''t want to do
    this unless you are an experienced system administrator. If you know what you
    are doing, it should be fairly straightforward as to mount, unmount, and add devices.


    The **Reload** in the **FSM** means the file system to reload `/etc/fstab` from
    your hard drive. If you edit `/etc/fstab` by hand while the file system configuration
    tool is running (which you shouldn''t do), you probably want to reload.


    To use the buttons at the bottom of the window, select a filesystem in the main
    window, and click on one of the buttons. The buttons perform the following functions:


    +   **Info**: Displays information on the filesystem, including the device, partition
    type, filesystem type, mount point and options, comment, size, percent used, etc.


    +   **Check**: Performs a filesystem check (**fsck**) on the partition. You can
    do this only on **unmounted** partitions — if the partition is mounted, you will
    get an error and you will have to unmount it first.


    +   **Mount**: Mounts the selected filesystem.


    +   **Unmount**: Unmounts the selected filesystem.


    +   **Format**: Creates a new filesystem on the selected partition. This will
    erase all data on the selected partition! You can do this only on **unmounted**
    partitions — if the partition is mounted, you will get an error and you will have
    to unmount it first.'
  merge: -1
  img_proc: true
- pgno: 152
  md: '# 9.3 Printer Configuration


    +   - Edit: Brings up a dialog box where you can edit the mount point, mount options,
    comment, etc.


    #  9.2.1 Adding NFS Mounts


    To mount a filesystem via NFS, select Add Mount from the NFS menu. A dialog box
    will appear and you will have to fill in the following values:


    +   - Device: Enter the name and path, separated by a colon. For example, foo.bar.com:/usr/exported
    indicates the /usr/exported directory foo.bar.com.

    - Mount Point: Enter the directory on the machine where you want to mount the
    NFS filesystem. For example, /mnt/foo.

    - Options: Enter the mount options for this filesystem. The default is soft, intr,
    rw. The rw means the filesystem is read-write, and soft, intr are options that
    make your system a little resilient when the remote server goes down. See the
    mount page for a complete list of available options.

    - Comment: This optional field can be used to store a small comment.


    After filling everything out properly, click on OK. At this point the entry is
    made in your /etc/fstab, the filesystem is not actually mounted. To mount it,
    select it in your main window and click on Mount.


    # 9.3 Printer Configuration


    The printer configuration tool (printtool) maintains /etc/printcap, print spool
    directories, and print filters. The filters allow you to print many different
    types of files, including:


    +   - plain text (ASCII) files

    - PostScript files

    - TeX .dvi files'
  merge: -1
