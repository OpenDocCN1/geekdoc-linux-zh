- pgno: 193
  md: '# 178 System Administration


    From this, you''d look in the second column and see that the default runlevel
    is 3, as should be the case for most systems. If you want to change it, you can
    edit /etc/inittab by hand and change the 3. Be very careful when you are messing
    with the inittab. If you do mess up, you can fix it by rebooting and doing:


    ```

    LILO boot:    linux single

    ```


    This would allow you to boot into single user mode so you can fix inittab.

    Now, how does it run all the right scripts? If you enter -1 on rc3d, you might
    see something like:


    ```

    lrwxrxrwwx root 17 3:11 S10network -> ../init.d/network

    lrwxrxrwwx root 16 3:11 S30sysyslog -> ../init.d/sysylog

    lrwxrxrwwx root 14 3:32 S40cron -> ../init.d/cron

    lrwxrxrwwx root 14 3:11 S50inet -> ../init.d/inet

    lrwxrxrwwx root 17 3:11 S60getfs -> ../init.d/getfs

    lrwxrxrwwx root 15 3:11 S70nfs -> ../init.d/nfsfs

    lrwxrxrwwx root 18 3:11 S90lpbd -> ../init.d/lpbd

    lrwxrxrwwx root 11 3:11 S99local -> ../rc.local

    ```


    What you''ll notice is that there are no "files" in the directory. Everything
    there is a link to one of the scripts in the init.d directory. The links also
    have an "S" and a number at the beginning. The "S" means to start this particular
    script and a "K" would mean to stop it. The number is just for ordering purposes.
    Init will start all the services based on the order they appear. You can duplicate
    numbers, but it will only use a two digit number only, along with an upper case
    "S" or "K" to start or stop the services you need to.


    How does init start stop services? Simple. Each of the scripts is written to accept
    an argument which can be "start" and "stop". You can execute these scripts by
    having in fact a command like:


    ```

    /etc/rc.d/init.httpd.init stop

    ```


    to stop the httpd server. Init just reads the name and if it has a "K", it calls
    the script with the "stop" argument. If it has an "S" it calls the script with
    a "start" argument.

    Why are all these runlevels? Some people want an easy way to set up machines to
    be multi-purpose. I could have a "server" runlevel that just runs http, sendmail,
    networking, etc. Then I could have a "user" runlevel that runs xdm, networking,
    etc.'
  merge: -1
  img_proc: true
- pgno: 194
  md: '# 11.6 Rescue Modes


    # 11.5.2 Init Runlevels


    Generally, Red Hat Linux runs in run level 3—full multiuser mode. The following
    runlevels are used in Red Hat Linux:


    +   0 Halt.

    1 Single user mode.

    2 Multiuser mode, without NFS.

    3 Full multiuser mode.

    6 Reboot.


    If your machine gets into a state where it will not boot due to a bad /etc/inittab,
    or will not let you log in because you have corrupted /etc/passwd or have simply
    forgotten your password, boot into single user mode by typing linux 1 at the LILO
    prompt. A very bare system will come up and you will be given a shell from which
    you can fix things.


    # 11.5.3 Shutting Down


    To shut down Red Hat Linux, issue the shutdown command. You can read the shutdown
    man page for complete details, but the two most common usages are:


    ```

    shutdown -h now

    shutdown -r now

    ```


    Each will cleanly shutdown the system. After shutting everything down, the first
    will halt the machine, and the second will reboot.


    Do not let the reboot or halt commands directly in order to prevent damage to
    your filesystem.


    # 11.6 Rescue Modes


    When things go wrong, there are several ways to work on fixing them. However,
    they require that you understand the system well. This manual can''t teach you
    what to do, but we will present the ways that you can use our products to get
    into rescue modes where you can use your own knowledge to rescue the system.'
  merge: -1
  img_proc: true
- pgno: 195
  md: '# 11.6.1 Through LILO


    If your system boots, but does not allow you to log in when it has completed booting,
    you can use the single or emergency boot option. In the LILO boot: prompt, type
    linux single in order to boot in single-user mode. In-user mode, your local filesystems
    will be mounted, and your network will not be activated. In emergency mode, almost
    nothing will be set up. Only the root filesystem will be mounted, and it will
    be mounted read-only.


    # 11.6.2 Emergency Boot Diskettes


    The installation diskette can also be used as a rescue disk set. When you boot
    the diskette, type rescue at the boot prompt (on non-Intel platforms, add rescue
    as an option to the kernel when you are booting, for example, linux rescue), and
    the install process will ask a few questions, request that you insert the second
    disk, and set ups on VC1 and VC2. The shell that is running is ash, a minimal
    borne with no history or command-line editing.


    The PATH environment variable is set so once you have mounted your root partition
    on /mnt, binaries from your root partition will run if they do not exist on the
    diskette. Also, the libraries in /mnt/lib and /mnt/usr/lib will be used if needed.
    You may wish to change your PATH to not include /bin/bin, /mnt/usr/bin, etc.,
    while you are working on repairing your system. If you do that, you will need
    to use /bin/mount to unmount /mnt.


    Limited versions of important utilities are available before you mount /mnt:


    ```

    mount The command does not require that the device node mounted already exist,
    and doesn''t require the full name of the device. It assumes ext2

    ```


    ```

    mount /dev/sda /mnt -t ext2

    ```


    ```

    is functionally equivalent to

    ```


    ```

    mount sdal /mnt

    ```


    ```

    ash The full version

    ```


    ```

    cat Does not accept any options

    ```'
  merge: -1
  img_proc: true
