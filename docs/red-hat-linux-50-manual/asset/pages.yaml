- pgno: 10
  md: '# Preface


    Welcome! And thanks for your interest in Red Hat Linux. We have what we think
    is the best Linux distribution on the market today, and we work hard to keep it
    that way. Red Hat Linux 5.0 is the latest in a long line of software from Red
    Hat Software. We hope you like it, and that you enjoy using Red Hat Linux as much
    as we''ve enjoyed making it for you.


    It''s interesting to note that, while Linux is popular and well-known by a certain
    segment of the computer-using population, there are any many people out there
    that are only now ever hearing about Linux. For this group of people, the following
    section should provide enough background to help you get acquainted with Linux
    and Red Hat Software. If you''d like to learn more about how Linux is developed
    and distributed, please see Appendix I on page 277 for more information.


    # What is Linux?


    In August of 1991, a student from Finland began a post to the comp.os.minix newsgroup
    with the words:


    ```

    Hello everybody out using minix -

    I''m doing a (free) operating system (just a hobby,

    won''t be big and professional like gnu) for

    386(486) AT clones.

    ```


    The student was Linus Torvalds, and the “hobby” he spoke of eventually became
    what we know today as Linux.'
  merge: -1
  img_proc: true
- pgno: 11
  md: 'A full-featured POSIX-compliant operating system, Linux has been developed
    not just by Linux, but by hundreds of programmers around the world. The interesting
    thing about this is that this massive, world-wide development effort is largely
    uncoordinated. Sure, Linux calls the shots where the kernel is concerned, but
    Linux is more than just the kernel. There''s no management infrastructure; A study
    in Russia gives a new motherboard, and writes a driver to support a neat feature
    the motherboard. A system administrator in Maryland needs backup software, writes
    it, and it goes away to anyone who needs it. The right things just seem to happen
    at the right time.


    Another interesting thing is that Linux can be obtained for absolutely no money.
    That''s right, most of the software is available (at no charge) to anyone with
    the time and inclination to download it. But not anyone has that much time...


    # What is Red Hat Linux?


    Enter a group of programmers based in North Carolina. Their goal was to make it
    easier for people to give Linux a try. Like many other groups, their approach
    was to build all the necessary bits and pieces into a cohesive distribution, relieving
    "newbies" from some of the more esoteric aspects of bootstrapping a new operating
    system on their PCs.


    However, unlike other distributions, this one was fundamentally different. The
    difference? Instead of being a snapshot of a hard disk that had a working copy
    of Linux on it, or a set of diskettes from which different parts of the operating
    system could be dumped, this distribution was based on packages.


    Each package provided a different piece of software, fully tested, configured,
    and ready to run. Want to try a new editor? Download the package and install it.
    In seconds, you can give it a try. Don''t you like it? Issue a single command,
    and the package is removed.


    If that was all there to it, this distribution would be pretty nifty. But being
    package-based there was one additional advantage:


    This Linux distribution could be easily upgraded.


    Software development in the Linux world is fast-paced, so new versions of old
    software come out continually. With other distributions, upgrading software was
    painful – a complete upgrade usually means deleting everything on your hard drive
    and starting over.'
  merge: -1
  img_proc: true
- pgno: 12
  md: '# Preface


    Now you''ve probably guessed that the group of programmers in North Carolina is
    Red Hat Software, and the package-based distribution is Red Hat Linux.


    Since Red Hat Linux''s introduction in the summer of 1994, Linux and Red Hat Software
    have grown by leaps and bounds. Many has changed; Much has support for esoteric
    hardware, huge increases in reliability, and the growing use of Linux by companies
    around the world.


    But much remains the same. Linux is still developed by people world-wide; Linux
    is still involved. Red Hat Software is still located in North Carolina; still
    to make Linux easier for people to use.


    And Red Hat Linux is still package-based; always has been, always will be.


    Since the release of version 4.0, Red Hat Linux runs on three leading computing
    platforms: Intel pcs, Digital Alpha computers, and Sun SPARC equipment. Our unified
    source tree and the benefits of RPM (Red Hat Package Management) technology enable
    us to deploy RPM for each platform with a minimum of effort. With this enables
    our users to manage and port software between these platforms as easily as possible.


    We make Red Linux available by unrestricted FTP from our site and many mirror
    sites on the Internet. Red Hat Linux is also available on CD-ROM. For current
    information on our product offerings and links to other Linux resources please
    check Red Hat Software''s web site at http://www.redhat.com.


    On most systems, Red Hat Linux is easy to install; the installation program can
    walk you through the process in as little as 15 minutes. The system itself is
    very flexible. With RPM, you can install and uninstall individual software packages
    with minimal effort. Because of RPM, Red Hat Linux is also easy to maintain –
    package installations can be verified and corrected, and packages can be installed
    and uninstalled simply and reliably. Furthermore, Red Hat Linux is easy to administer.
    Included are a rich set of administrative tools reduce the hassle of everyday
    system administration. Complete source code is provided for the freely distributable
    components of the system.


    # An Overview of This Manual


    This manual is organized to guide you through the process of installing Red Hat
    Linux quickly and easily. To that goal, let''s take a quick look at each chapter
    to help you get acclimated:'
  merge: -1
  img_proc: true
