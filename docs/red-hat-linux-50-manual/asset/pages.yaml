- pgno: 190
  md: '# 11.4 User Authentication with PAM


    required to requisite; if any requisite module returns failure, PAM fails immediately
    without calling any other modules.


    The fifth line causes any necessary accounting to be done. For example, if shadow
    passwords have been enabled, the pam_pwdb.so module will check to see if the account
    is expired, or if the user has not changed or her password and the grace period
    for changing the password has expired.


    The sixth line (we''ve had to draw) specifies that if the login program changes
    the user''s password, it should use the pam_pwdb.so module to do so. (It will
    do so only if an auth module has determined that the password needs to be changed—for
    example, if a shadow password has expired.)


    The final line specifies that pam_pwdb.so module should be used to manage the
    session. currently, module does not anything; it could be replaced (or supplemented
    by stacking) by any necessary module.


    Note that the order of the lines within each file matters. While it doesn''t really
    matter in which order modules are called, there are other control flags available.
    While optional is rarely used, and never used by default on a Red Hat Linux system,
    sufficient and requisite cause order to become important.


    Let''s look at the auth configuration for login:


    ```

    auth required /lib/security/pam_security.so

    auth sufficient /lib/security/pam_rhosts_auth.so

    auth required /lib/security/pam_pwdb.so shadow nullok

    auth required /lib/security/pam_nologin.so

    ```


    That looks almost like the login entry, but there''s an extra line specifying
    an extra module, and the modules are specified in a different order.


    First, pam_security.so keeps root logins from happening on insecure terminals.
    This effectively disables all root login attempts. If you wish to allow them (in
    which case we can recommend that you neither be internet-connected or be behind
    a firewall), you can simply remove that line.


    Second, pam_nologin.so checks /etc/nologin, as specified above.


    Third, if pam_rhosts_auth.so authenticates the user, PAM immediately returns success
    to login without any password checking being done. If pam_rhosts_auth.so fails
    to authenticate the user, that failed authentication is ignored.'
