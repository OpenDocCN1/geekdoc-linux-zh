- pgno: 14
  md: 'Preface


    # Upgrading from a Prior Version of Red Hat Linux


    The installation process for Red Hat Linux 5.0 includes the ability to upgrade
    from prior versions of Red Hat Linux (2.0, 2.1, 3.0.3, 4.0, 4.1, and 4.2) which
    are based on RPM technology. Upgrading your system installs the modular 2.0.x
    kernel as well as updated versions of the configuration files that are installed
    on your machine. The upgrade process preserves existing configuration files using
    a .rpmsave extension (e.g., sendmail.cf) and leaves a log noting what actions
    it took in /tmp/upgradelog. As software evolves, configuration formats can change,
    so you should carefully migrate your original configuration files to the new files
    before integrating your changes.


    # A Word From the Developers


    We would like to thank all our beta testers for entrusting their systems to early
    versions of Red Hat Linux and for taking the time to submit bug reports from the
    front, especially those of you who have been with Red Hat since the “Halloweeen”
    release and earlier. We would also like to thank Linus Torvalds and the hundreds
    of developers around the world for creating, truly, one of the wonders of distributed
    development.


    And, again, we''d like to thank you for your interest in Red Hat Linux!


    > The Red Hat Development Team


    # Notes from the Editor


    Starting with this manual, Red Hat Software has dedicated full-time resources
    to producing documentation. Those of you that have read previous versions of this
    manual will probably notice that some changes have been made; we hope you''ll
    like them. Our goal is to evolve this manual into a comprehensive document that
    can serve the needs of anyone wishing to install Red Hat Linux, no matter what
    their level of experience.'
  merge: -1
  img_proc: true
- pgno: 15
