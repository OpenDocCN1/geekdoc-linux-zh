- pgno: 112
  md: '# 6.3 Window Configuration with Metro-X


    # 6.3.1 System Requirements


    8 megabytes of RAM minimum; 16 megabytes are recommended. The base server package
    requires 12 megabytes of disk space.


    # 6.3.2 configX.curses


    configX.curses is a simple graphical configuration tool for configuring Metro-X.
    The configX utility does not provide support for configuring multiple screens
    or choosing the number of buttons on your mouse. If you need these features you
    must use configX.curses type the command:


    ```

    configX.curses

    ```


    The opening screen has information on Metro Link, Inc. and brief instructions
    on what you will need to configure Metro-X. Press the Enter key to begin the configuration.
    The screen will display the current configuration information at the top and the
    configuration menu at the bottom. Use the arrow keys to move the highlight up
    and down the menu and the Enter key to select the highlighted item.


    # Graphics Card


    When you select Graphics Card from the configuration menu, a list of supported
    cards will be displayed. Select your video card as above. After selecting your
    video card you be asked to select a video mode from a list of defaults. The resolution
    used is a matter of personal preference. The smaller the numbers are the larger
    the items on the display will be. Some combination of video cards and video modes
    support virtual screens larger than the physical display. If your combination
    is one of these, you will be asked to select the virtual screen size.


    # Mouse


    Configuring your mouse with Metro-X requires that you know what type of mouse
    you have and how it is connected to your computer. When you select a mouse type,
    the default device will be provided in the configuration window. If you are in
    doubt, accept the default and make adjustments later if needed.'
  merge: -1
  img_proc: true
- pgno: 113
  md: '# Exiting


    Selecting **Save and Exit** from the menu will save any changes you have made
    to the Metro-X configuration and exit the configX.curses program.


    Selecting **Quit without Saving** from the menu will discard any changes you have
    made to the Metro-X configuration and exit the configX.curses program.


    # 6.3.3 configX


    Metro-X can also be configured for your system through a graphical utility called
    ConfigX, which is used to specify the mouse, keyboard, monitor, graphics card,
    color depth, and screen resolution(s) you are using.


    # Start-up


