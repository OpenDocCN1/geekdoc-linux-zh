- pgno: 34
  md: '# 2.2 Things You Should Know


    There are two ways to review the Errata:


    +   1. **World Wide Web** - By pointing your web browser at http://www.redhat.com/errata,
    you can read the Errata on-line, and download disk images easily.

    2. **Electronic Mail** - By sending an empty mail message to errata@redhat.com,
    you will receive a mail message containing the complete Errata. Also included
    are URLs to each updated package and diskette image in the Errata. By using these
    URLs, you can then download any necessary diskette images. Remember to use binary
    mode when transferring a diskette image


    For now, concentrate on the Errata entries that include new diskette images (filenames
    end in .img). If you find an entry that seeks to apply to your problem, get a
    copy of the diskette images, and create them using the instructions in Appendix
    B on page 193.


    # 2.2 Things You Should Know


    In order to prevent any surprises during the installation, you should collect
    some information before attempting to install Red Hat Linux. You can find most
    of this information in the documentation that came with your system, or from the
    system''s vendor or manufacturer.


    > **Please Note:** The most recent list of hardware supported by Red Hat Linux
    can be found at Red Hat Software''s World Wide Web site at http://www.redhat.com/hardware.
    It''s a good idea to check your hardware against this list before proceeding.


    # 2.2.1 Basic Hardware Configuration


    You should have a basic understanding of the hardware installed in your computer,
    including:


    +   **hard drive(s)** - Specifically, the number, size, and type. If you have
    more than one, it''s helpful to know which one is first, second, and so on. It
    is also good to know if your drives are IDE or SCSI'
  merge: -1
  img_proc: true
