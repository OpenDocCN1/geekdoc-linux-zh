    the US), or send mail to sales@redhat.com.


    If your Red Hat Linux boxed set is complete, please skip ahead to section 2.1.4.


    # 2.1.3 No Boxed Set? No Problem!


    Of course, not everyone purchases a Red Hat Linux set. It''s entirely possible
    to install Red Hat using a CD created by another company, or even via FTP. In
    these cases, you may need to create one or more diskettes to get started.


    | INTEL |

    | For installing Red Hat Linux/Intel, you''ll need a boot diskette and, optionally,
    a supplemental diskette. It is also possible to start the installation directly
    from the CD, under certain conditions. We''ll discuss this in more detail when
    we outline the various installation methods available. |


    | ALPHA |

    | People with Alpha-based systems should refer to Section D.4 on page 214 for
    additional information on the diskettes they may need. |


    | SPARC |

    | SPARC owners should refer to section C.5.1 on page 202 for information on which
    diskettes they''ll need. |


    # 2.1.4 Checking for Updated Diskette Images


    From time to time, we find that the installation may fail, and that a revised
    diskette image is required in order for the installation to work properly. In
    these cases, we make special images available via the Red Hat Linux Errata.


    Since this is a relatively rare occurrence, you will in general save time if you
    try to use the standard diskette images first, and then review the Errata if you
    experience any problems completing the installation.'
  merge: -1
