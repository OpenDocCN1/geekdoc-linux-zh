- pgno: 228
  md: '# D.3 Installation Overview


    The X Window System should work on any machine with an S3 based video card (except
    the synes machines). S3 Virgo cards, the Matrox Millenium, Millenium II, and the
    Mystique will work, as most of the cards from Orchid and Number 9. Most Diamond
    Stealth TGA cards (based on the DC2130 chip) are supported in 8 bit mode, and
    an X server for Mach64 cards are also provided.


    **Note:**There is an X server available specifically for Jensens with an S3 card.
    It is available from http://ftp.azartnet.com/pub/linux/axp/jensen. Note that this
    site is mirrored by several of the bigger FTP sites, should you have trouble connecting.


    # D.3 Installation Overview


    Installing Red Linux on an Alpha system is slightly more complex than installing
    Red Hat Linux/Intel, due to differences in machine architecture, and the variety
    of different models supported. In general, the main steps to a successful installation
    are:


    +   1. Create MILO, kernel, and ramdisk diskettes from images available on the
    Red Hat Linux/ Alpha CD.

    2. Use the MILO diskette to boot the appropriate Linux kernel.

    3. Load and run the Red Hat Linux / Alpha installation program.

    4. After the installation completes, install MILO on a small disk partition on
    your machine.


    **Note:**While the majority of Alpha systems are supported by MILO, those that
    will not need to boot the floppy (or CD-ROM) directly from the SRM (System Reference
    Manual) console . Information on doing this is available from the Red Hat Software
    web site http://www.redhat.com/linux-info/alpha/faq. You should also consult your
    system documentation for the proper boot command syntax, but in general, the proper
    command would look like this:


    ```

    boot dva0 -file vmlinux.gz -flags "load_ramdisk=1 prompt_ramdisk=1"

    ```'
  merge: -1
  img_proc: true
- pgno: 229
  md: '# D.4 Choosing Diskette Images


    The Red Hat Linux/Alpha installation process is diskette-based. The number and
    contents of the diskettes vary according to the type of Alpha system you have
    files. Therefore, before creating diskettes, it''s necessary to pick the appropriate
    image files. Use the following table as a guide:


    | System Type | MILO Image (In milo) | Boot Image (In images) |

    | Alcor (ARC Console) | N/A | alcor.img |

    | Alcor (SRM Console) | N/A | alcor-s.img |

    | Alpha-XLT | xlt.img | xlt.img |

    | Cabernet | cab.img | cab.img |

    | EB164 | eb164.img | eb164.img |

    | EB64+ | eb64p.img | eb64p.img |

    | EB66 | eb66.img | eb66.img |

    | EB66+ | eb66p.img | eb66p.img |

    | Miata | miata.img | miata.img |

    | Noname | noname.img | noname.img |

    | PC164 | pc164.img | pc164.img |

    | PC164LX | lx164.img | pc164.img |

    | PC164SX | sx164.img | sx164.img |


    Creating a Boot Diskette If your system is supported by MILO, you will find the
    appropriate image in the milo/images directory on the Red Hat Linux/Alpha CD-ROM.
    Refer to Appendix B on page 193 for instructions on writing the image file to
    a diskette. Make sure you label the diskette "MILO Diskette".


    Please Note:If you have trouble with MILO


    Creating a Boot Diskette You will find the appropriate boot diskette image in
    the images directory on the Red Hat Linux/Alpha CD-ROM. Refer to Appendix B on
    page 193 for instructions on writing the image file to a diskette. Make sure you
    label the diskette "Boot Diskette".'
  merge: -1
  img_proc: true
- pgno: 230
  md: '# D.5 Installing


    Creating a Ramdisk Diskette All Red Hat Linux/Alpha installations use the same
    ramdisk image. It is called ramdisk.img, and can be found in the images directory
    on the Red Hat Linux/Alpha CD-ROM. Refer to Appendix B on page 193 for instructions
    on writing the image file to a diskette. Make sure you label the diskette "Ramdisk
    Diskette".


    # D.5 Installing


    # D.5.1 Booting the MILO Diskette


    (If you Alpha system dent support MILO, please skip to Section D.5.2 on the next
    page).


    Before you can boot your MILO diskette, you''ll need to add a new boot selection
    to your ARC console. You can add a new boot selection for your MILO diskette by
    following these steps:


    +   1. From the boot menu, select "Supplementary menu".


    +   2. From the supplementary menu, select "Set up the system".


    +   3. From the boot selections menu, select "Add a boot selection".


    +   4. Select "Floppy Disk 0".


    +   5. Enter "\linload.exe" as the osloader directory and name after erasing any
    default information.


    +   6. Indicate that the operating system is in the same partition as the osloader
    by entering "yes".


    +   7. Enter "\" as the operating system root directory after erasing any default
    information.


    +   8. Give the boot selection a meaningful name. "Linux" is a nice name.


    +   9. Indicate that you do not want to initialize the debugger at boot time by
    entering "no".


    +   10. From the boot selection menu, select "Change a boot selection option".
    Pick the boot selection you just created.'
  merge: -1
  img_proc: true
- pgno: 231
  md: '# Information specific to Red Hat Linux/Alpha


