- pgno: 119
  md: '# Multiple-Screen Configuration


    Metro-X supports up to four screens which can all be controlled simultaneously
    with a single keyboard and mouse. This allows you to run many applications with
    overlapping windows, and is particularly useful for image-processing work. For
    each screen used, a separate configuration must be created for that screen''s
    monitor and graphics card. See section G.1.4 for graphics card requirements.


    # Adding a Screen


    Metro-X defaults to a single-screen setup. The first screen configured is labeled
    Screen 0. When you add a second screen, all of its configuration settings will
    duplicate the current settings of Screen 0. So if your hardware is on all screens,
    you can save time by configuring Screen 0 before adding the other screens. Similarly,
    as more screens are added, the settings of whichever is currently active when
    you add another screen will determine the default settings of the new screen.


    +   1. Press Alt-S to display the Screen pull-down menu.

    2. Type A for Add.

    3. The Monitor and Graphics Card icons for Screen 0 become outlines, and two full-color
    icons appear for Screen 1.

    4. Refer to the procedures described earlier in this chapter if any changes need
    to be made to the new screen''s configuration.

    5. Use the Page Down and Page Up keys to move to the configuration pages of each
    screen.


    # Deleting a Screen


    When a screen is deleted, all screens with higher screen numbers immediately drop
    down one slot. For instance: You currently have screens 0, 1, and 2 configured
    and you delete screen 1. That screen and all of its configuration information
    disappears. Screen 2 then becomes screen 1, but retains its own configuration.
    You are left with screens 0 and 1.'
  merge: -1
  img_proc: true
