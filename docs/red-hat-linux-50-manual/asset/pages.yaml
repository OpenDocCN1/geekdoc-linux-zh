    # E.7.3 The "program" command


    The flash management utility contains a compressed copy of a flash image of MILO.
    The command allows you to blow this image into flash. The command allows you to
    back out, but before you run it you should use the "list" command to see where
    to put MILO. If MILO is already in flash, then the flash management utility will
    offer to overwrite it.


    ```

    PMU> program

    Image is:

    Firmware Id: 7 (MILO/Linux)

    Image size is 217896 bytes (4 blocks)

    Executing at 0x020000

    Found existing image at block 8

    Overwrite existing image? (N/y)? y

    Do you want to do this (y/N)? y

    Deleting blocks ready to program: 8 9 10 11

    Programming image into flash

    Scanning Flash blocks for usage

    PMU>

    ```


    Wait until it has completed before powering off your system.


    Note: I cannot emphas just how careful you must be here to overwrite an existing
    flash image that you might need or render your system useless. A very good rule
    is never to overwrite the Debug Monitor.


    # E.7.4 The "environment" command


    This selects a flash block to contain MILO''s environment variables.'
