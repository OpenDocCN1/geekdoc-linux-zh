- pgno: 264
  md: '# General Parameters


    This appendix is provided to illustrate some of the possible parameters that may
    be needed by certain drivers. It should be noted that, in most cases, these additional
    parameters are unnecessary.


    Please keep in mind that if a device you are attempting to use requires one of
    these parameters, and support for that device is not compiled into the kernel,
    the traditional method of adding the parameter to the LILO boot command will not
    work. Drivers loaded as modules require that these parameters are specified when
    the module is loaded. The Red Hat Linux installation program gives you the option
    to specify module parameters when a driver is loaded.


    For more information concerning the device support compiled into the kernel used
    by the Red Hat Linux installation program, please refer to Section 2.6 on page
    32.


    One of the more commonly used parameters, the hdx=cdrom parameter, can be entered
    at the boot prompt, as it deals with support for IDE/ATAPI CD-ROMs, which is part
    of the kernel.'
  merge: -1
  img_proc: true
- pgno: 265
  md: '# F.1 CD-ROM parameters


    | Hardware | Parameter |

    |---|---|

    | Mitsumi CD-ROM | mcd=port,irq |

    | Sony CDU 31 or 33 CD-ROM | cdu31a.port=base_addr cdu31a.irq |

    | Aztech CD268 | aztcd=cdport |

    | SB Pro or 16 compatible | sbpcd=io,addr,sb_pro_setting |

    | ATAPI/IDE CD-ROM Drives | hdx=cdrom |


    Examples of the above would be:


    | Configuration | Example |

    |---|---|

    | non-IDE Mitsumi CD-ROM on port 340, IRQ 11 | mcd=0x340,11 |

    | Sony CDU 31 or 33 at port 340, no IRQ | cdu31a.port=0x340 cdu31a.irq=0 |

    | Aztech CD-ROM at port 220 | aztcd=0x220 |

    | ATAPI CD-ROM, jumper as master on 2nd interface | hdc=cdrom |

    | Panasonic-type CD-ROM on a SoundBlaster at port 230 | sbpcd=0x230,1 |


    **Please Note:** Most newer Sound Blaster cards come with IDE interfaces. You
    do not need to use sbpcd parameters, only use hdx parameters.'
  merge: -1
