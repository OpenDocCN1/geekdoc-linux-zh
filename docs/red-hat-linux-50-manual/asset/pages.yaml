- pgno: 274
  md: '# G.2 Metro X Configuration File


    259


    NoBackingStore This turns off backing store. Backing store is a server feature
    that allows programs to create complex drawings and have the server automatically
    handle exposure requests, preventing lengthy re-draw cycles. Backing store uses
    system memory to hold the window contents and can actually down the system if
    there is limited memory.


    NoCursorWrap In a multiple screen configuration, this setting prevents the cursor
    from wrapping from screen 1 to screen 0.


    NoFontCache This turns off caching.


    NoKeyboard This disables keyboard input.


    NoLEDs No LED processing is done by the server.


    NoPimapCache This turns off pixmap and stiple caching.


    NotPrimaryMonitor No console processing is done for Virtual Terminal Support.
    This is normally used when X is on a graphics card that is not driving the console.


    Option <string> This specifies a special option passed to the server. It might
    specify the card model or a specific feature not typically used. Normally configX
    inserts the correct options in the Xconfig file.


    Option HardwarePex Add this line to the Xconfig file to use the Hardware Z Buffer
    on the Matrox MGA Impression Plus graphics card. This file entry must immediately
    follow the Driver MGA entry.


    Option NoHardwareCursor Add this line to disable hardware cursor support. This
    file entry must immediately follow the Driver entry.


    RemapCursorPad This configuration causes the X server to send back keycodes for
    the arrow keys and curspad arrow keys. This is a minor violation of the X protocol,
    but it allows clients to differentiate between these keys.


    SNFFormat <number> <number> <number> <number> Metro-X11.5 can read X11.4 SNF (Natural
    Format) fonts. Since there is no standard for SNF fonts, the following four numbers
    can be adjusted to read most SNF fonts. The four parameters represent the following
    values, normally built into the server at compile time.


    ```

    BITMAP_BIT_ORDER

    IMAGE_BYTE_ORDER

    GLYPHPADBYTES_

    ```'
