- pgno: 232
  md: '# D.5 Installing


    # D.5.3 Starting the installation


    After the kernel boots, it prompts for a ramdisk. Remove the kernel diskette,
    insert the ramdisk diskette, and press `Enter`. After the ramdisk is done loading,
    you should see the first installation screen.


    # D.5.4 Issues Specific to Red Hat Linux/Alpha


    Before you return to the installation, you should know about some differences
    between Red Hat Linux/Intel and its Alpha counterpart. Let''s review them:


    # Disk Partitioning


    Red Hat Linux/Alpha supports two varieties of hard partitioning:


    +   - Standard `disk-style partitioning`: this has the usual oddities (such as
    extended partitions) and is done in the same way as on Intel platforms (using
    `fdisk`). This is the partitioning style you must use if you are using the ARC
    or AlphaBIOS console.

    - BSD-style disk-labelling: it is normal to make the first partition on a disk-labelled
    hard drive the sweep partition. We do not recommend using BSD disk-labelling unless
    it is absolutely necessary (such as in the case of sharing a hard drive between
    Digital Unix and Red Hat Linux/Alpha). Note that you need to use `aboot` if you
    use BSD-style disk labels. Note that an RPM package of boot comes with Red Hat
    Linux/Alpha.


    # Creating a MILO Partition


    If your system supports MILO, you should allocate a small (no more than 2 MB)
    partition to it. The partition type must be DOS. This is where you will copy MILO
    and `linload.exe` after the installation completes.


    # XFree86 and TGA


    If you have an Alpha with a TGA card and you choose to install XFree86, the installation
    program prompts you to choose a video card. Choose Unlisted Server,'
  merge: -1
  img_proc: true
