- pgno: 36
  md: '# 2.3 Installation Methods


    +   - **IP address** – Usually represented as a set of four numbers separated
    by dots, such as `10.0.2.15`.

    - **netmask** – Another set of four numbers separated by dots. An example netmask
    would be `255.255.248.0`.

    - **gateway IP address** – Another set of four dot-separated numbers. For instance,
    `10.0.2.254`.

    - **one or more server IP addresses** – One or more sets of dot-separated numbers.
    `10.0.2.1` might be the address of a name server.

    - **domain name** – The name given to your organization. For instance, Red Hat
    Software has a name of `redhat.com`.

