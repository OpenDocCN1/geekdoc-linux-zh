- pgno: 107
  md: '# Post Installation Configuration


    root=/dev/hdal

    read-only


    You must update /etc/lilo.conf. If you build a new initrd image you must tell
    LILO to use it. In this example of /etc/lilo.conf we have added four lines at
    the bottom of the file to identify another kernel to boot from. We have renamed
    /boot/mlinuz to /mlinuz.old and changed its label to old. We have also added an
    initrd line for the new kernel:


    ```

    boot=/dev/hda

    map=/boot/map

    install=/boot/boot.b

    prompt

    timeout=100

    image=/boot/mlinuz

    label=lilo

    initrd=/boot/initrd

    root=/dev/hda

    read-only

    image=/boot/mlinuz.old

    label=old

    root=/dev/hdal

    read-only

    ```


    When now the system boots and you press Tab at the LILO boot : prompt two choices
    will be shown:


    LILO boot :

    linux old


    To boot the new kernel (linux) simply press Enter or wait for LILO to time out.
    If you want to boot the old kernel (old), simply enter old and press Enter


    Here is a summary of the steps:


    +   * mv /boot/mlinuz /boot/mlinuz.old

    * cp /usr/src/linux/arch/i386/boot/zImage /boot/mlinuz

    * edit /etc/lilo.conf

    * run /sbin/lilo'
