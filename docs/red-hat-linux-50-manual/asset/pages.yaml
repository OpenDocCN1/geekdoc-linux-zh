    # 11.5 The Boot Process, Init, and Shutdown


    # 11.5.1 System V Init


    This section is a brief description of the internals of the boot process. It basically
    covers in detail how the machine boots uses SysInit and the differences between
    the original init used in older Linux releases.


    Init is the program that runs by the kernel at boot time. It is in charge of starting
    all the normal processes that need to run at boot time. These include the getthys
    allow you to log in, NFS daemons, FTP daemons, and anything else you want to run
    when your machine boots.


    SysV Init is fast the standard in the Linux world to control the startup of software
    at boot time. This is because it is easier to use and more powerful'
