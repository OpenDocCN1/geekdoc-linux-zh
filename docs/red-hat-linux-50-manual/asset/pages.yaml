- pgno: 146
  md: '# # 9


    # Control Panel


    ![](img/8b3a1d8c6536531eebe04fe36481b5a6_146_0.png)


    The control panel is a launching pad for a number of different system administration
    tools. They make your life easier by letting you configure things without remembering
    configuration file formats and awkward command options.


    To start the control-panel, start the X Window System as root with startx and
    type control-panel in an xterm. You will need to be root to run the control-panel
    tools successfully. You can do this as well if you already have X running as a
    normal user. Just type -c control-panel and type the root password when prompted.
    If you plan to do other tasks as root, you could type - followed by the root password
    when prompted. You will then be given a root shell. Here, you will need to type
    DISPLAY=:0 The "DISPLAY" part tells the control panel to use your display. This
    syntax works only for a Bourne-compatible shell like bash. If you run tcsh, you
    would enter setenv DISPLAY :0; control-panel & .


    Double clicking on an icon starts up a tool. Please note that'
  merge: -1
  img_proc: true
- pgno: 147
  md: 'you are not prevented from starting instances of any tool, but doing so is
    a very bad idea because you may try to edit the same files in two places and end
    overwriting your own changes. If you accidentally start a second copy of a tool,
    you should quit it immediately. Also, do not manually edit any files managed by
    the control-panel tools while the tools are running. Similarly, do not run any
    other programs that may change those files while they are running.


    # 9.1 User and Group Configuration


    The tool shown in Figure 9.1 manages the users and groups on your system. In a
    sense, it is a graphical editor for /etc/passwd and /etc/group, and for /etc/shadow
    if you have enabled shadow passwords. With this tool you can add and remove users
    and groups, set login shells, full names, directories, uids, etc.


    ![](img/8b3a1d8c6536531eebe04fe36481b5a6_147_0.png)


    Figure 9.1: User and Group Configuration Panel


    # 9.1.1 Adding or Editing a User


    The same interface is used to add and edit users. To add a user, click on the
    Add button in the main window. A dialog box will pop up like the one in figure
    9.2 you will'
  merge: -1
  img_proc: true
- pgno: 148
  md: '# 9.1 User and Group Configuration


    appear, with some defaults already filled in. To edit an existing user, double-click
    on the user in the main window, or click on the user and then on the View/Edit
    button.


    | Edit User Definition | |

    | :--- | :--- |

    | Username: | bgates |

