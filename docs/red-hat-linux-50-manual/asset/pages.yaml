    # 9.4 Network Configuration


    The network configuration tool (netcfg) shown in Figure 9.11 is designed to allow
    easy manipulation of parameters such as IP address, gateway address, and network
    address, as well as name servers and /etc/hosts.


    Network devices can be added, removed, configured, activated, deactivated and
    aliased. Ethernet, arcnet, token ring, pocket (ATP), PPP, SLIP, PLIP and loopback
    devices are supported. PPP/SLIP/PLIP support works well on most hardware, but
    some hardware setups may exhibit unpredictable behavior. When using the Network
    Configuration tool click Save to write your changes to disk, to quit without making
    any changes select Quit.


    # 9.4.1 Managing Names


    The Names of the Network Configuration tool serves two primary purposes: setting
    the hostname and domain of the computer, determining which name server will be
    used to look up other hosts on the network. The Network tool is not capable of
    configuring a machine as a nameserver. To edit a field or add information to a
    field simply click the field with the left mouse button and type the new information.'
