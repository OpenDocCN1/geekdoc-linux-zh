- pgno: 122
  md: '# 6.5 Sendmail


    you have a 2 button mouse and want to emulate the third (middle) mouse button
    with a simultaneous click of the left and right mouse buttons Tab to move the
    cursor to the Emulate 3 Buttons checkbox and press Spacebar to toggle the selection.


    # 6.5 Sendmail


    A default sendmail.cf file will be installed in /etc/. The default configuration
    should work for most SMTP-only sites. It will not work for UUCP sites; you will
    need to generate a new sendmail.cf if you need to use UUCP mail transfers. To
    generate a new one install m sendmail source package. For details on creating
    sendmail configuration files. Also, O''Reilly & Associates publishes a good reference
    entitled Sendmail by Bryan Costales.


    One common sendmail configuration is to have a single machine act as a mail gateway
    for all the machines on your network. For instance, at Red Hat Software we have
    a machine mail.redhat.com that does all our. On machine we need to add the names
    of machines for which mail.redhat.com will handle to /etc/sendmail.cf. Here is
    an example:


    ```

    # sendmail.cw - include all aliases for your machine

    # here.

    torgo.redhat.com

    poodle.redhat.com

    devel.redhat.com

    ```


    Then on the other machines, torgo, poodle, and devel, we need to edit /etc/sendmail.cf
    to "masquerade" as mail.redhat.com sending mail, and to forward any local mail
    processing to redhat.com. Find the DH and DM lines in /etc/sendmail.cf and edit
    them thus:


    ```

    # who I send unqualified names to

    # (null means deliver locally)

    DRmail.redhat.com

    ```


    ```

    # who gets all local email traffic

    DHmail.redhat.com

    ```'
  merge: -1
  img_proc: true
- pgno: 123
  md: '# # who I masquerade as (null for no masquerading)

    DMredhat.com


    With this type of configuration, all mail sent will appear as if it were sent
    from redhat.com, and any mail sent to torgo.redhat.com or the other hosts will
    be delivered to mail.redhat.com.


    Please be aware that if you configure your system to masquerade as any email sent
    from your system to your system will be sent to the machine which is masquerading.
    As example, in the above illustration, log files that are periodically sent to
    root@spoodle.redhat.com by the cron daemon would be sent to root@redhat.com.


    # 6.6 Controlling Access to Services


    As a security measure, most network services are managed by a protective program
    called a TCP wrapper. The protected services are listed in /etc/inetd.conf that
    specify /usr/sbin/tcpd. tcpd can allow or deny access to a service based on the
    origin of the request, and the configuration in /etc/hosts.allow and /etc/hosts.deny.
    By default Red Hat Linux allows all service requests. To disable or limit services
    you can edit /etc/hosts.allow file:


    ```

    ALL: redhat.com .redhat.com

    in.ntalkd: ALL

    in.ntalkd: ALL

    in.fingeredd: ALL

    in.ftpdd: ALL

    ```


    This configuration allows all connections from redhat.com and *.redhat.com machines.
    It also allows talk, finger, and ftp requests from all machines.


    tcpd allows much more sophisticated access control, using a combination of /etc/hosts.allow
    and /etc/hosts.deny. Read the tcpd(8) and hosts.access(5) man pages for complete
    details.'
