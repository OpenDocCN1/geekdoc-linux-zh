    \ or spool or lock directories probably should write them to the /var directory.\
    \ The FSSTND says /var is for\n\n> ... variable data files. This includes spool\
    \ directories and files, administrative and logging data, and transient files.\n\
    \nThe following directories should be subdirectories of /var:\n\n+   /var\n  -\
    \ log\n  - catman\n  - lib\n  - local\n  - named\n  - nis\n  - preserve\n  - run\n\
    \  - lock\n  - tmp\n+ spool\n    - at\n    - cron\n    - lpd\n    - mail\n   \
    \ - mqueue\n    - rwho\n    - small\n    - uucp\n    - news\n\nSystem log files\
    \ such as wtmp and lastlog go in /var/log. The /var/lib directory also contains\
    \ the RPM system databases. Formatted man pages go in /var/catman, and lock files\
    \ go in /var/lock. The /var/spool directory has subdirectories for various systems\
    \ that need to store data files."
