  md: '# 5.7 Setting a Root Password


    ![](img/8b3a1d8c6536531eebe04fe36481b5a6_96_0.png)


    Figure 5.6: Local Printer Device


    The installation program will now prompt you to set a root password for your system
    (See 5.12 on page 86). You''ll use the root password to log into your Red Hat
    Linux system for the first time.


    The root password must be at least six characters long: the password you type
    is not echoed on the screen. You must enter the password twice; if the two passwords
    do not match, the installation program will ask you to enter them again.


    You might make the root password something you can remember, but not something
    that is easy for someone else to guess. Your name, your phone number, qw, root,
    123456, and anteater are examples of poor passwords. Good passwords mix upper
    and lower case letters and do not contain dictionary words: Aaar387vark or 420BMttNT,
    for example. Remember that the password is case-sensitive. Write down this password
    and keep it in a secure place.


    **Please Note:** The root user (also known as the superuser) has complete access
    to the entire system; for this reason, logging in as the root user is best only
    to perform system maintenance or administration, so that critical system files
    are not inadvertently changed, moved, or deleted. Please see Section 9.1 on page
    132 for instructions on how to add a user account for after you reboot your'
