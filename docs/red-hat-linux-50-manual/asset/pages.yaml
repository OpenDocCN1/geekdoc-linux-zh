  md: '# 8

    Package Management with RPM


    Red Hat Package Manager (RPM), is an open packaging system available for anyone
    to use, and works on both Red Hat Linux as well as other Linux and UNIX systems.
    Red Hat Software encourages other vendors to take the time to look at RPM and
    use it for their own products. RPM is distributable under the terms of the GPL.


    For the end user, RPM provides many features that make maintaining a system far
    easier than it has ever been. Installing, uninstalling, and upgrading RPM packages
    are all one line commands, and all the messy details are taken care of for you.
    RPM maintains a database of installed packages and their files, which allows you
    to perform powerful queries and verification of your system. During upgrades RPM
    handles configuration files specially, so that you never lose your customizations
    – a feature that is impossible with straight .gz files.


    For the developer, RPM allows you to take source code for software and package
    it into source and binary packages for end users. This process is quite simple
    and is driven from a single file and optional patches that you create. Clear delineation
    of “pristine” sources and your patches and build instructions eases the'
  merge: -1
  img_proc: true
- pgno: 137
  md: 'maintenance of the package as new versions of the software are released.


    # 8.1 RPM Design Goals


    Before trying to understand how to use RPM, it helps to have an idea of what the
    design goals are.


    **Upgradability** With RPM you can upgrade individual components of your system
    without completely reinstalling. When you get a new release of an operating system
    based on RPM (such as Red Hat Linux), you don''t need to reinstall your machine
    (as you do with operating systems based on other packaging systems). RPM allows
    intelligent, fully-automated, in-place upgrades of your system. Configuration
    files in packages are preserved across upgrades, so you won''t lose your customizations.


    **Powerful Querying** RPM is also designed to have powerful querying options.

    You can searches through your entire database for packages or certain files. You
    can easily find out what package file belongs to and where it came from. An RPM
    package contains in a compressed archive, with a custom binary header containing
    useful information about the package and its contents, allowing you to query individual
    packages quickly and easily.


    **System Verification** Another powerful feature is the ability to verify packages.
    If you are worried that you deleted an important file for some package, simply
    verify the package. You will be notified of any anomalies. At that point, you
    can reinstall the package if necessary. Any configuration files that you modified
    are preserved during reinstation.


    **Pristine Sources** A crucial design goal was to allow the use of "pristine"
    softwares, as distributed by the original authors of the software. With RPM, you
    have the pristine sources with any patches that were used, plus complete instructions.
    This is a big advantage for several reasons. For instance, if a new version of
    a program comes out, you don''t necessarily have to start from scratch to get
    it to compile. You can look at the patch to see what you *might* need to do. All
    the compiled-in details, and all of the changes that were made to get the software
    properly are easily visible this way.'
  merge: -1
  img_proc: true
- pgno: 138
  md: '# 8.2 Using RPM


    This goal may only seem important for developers, but it results in higher quality
    software for end users. We would like to thank the folks for the BOGUS distribution
    for originating the pristine source concept.


    # 8.2 Using RPM


    RPM has five basic modes of operation (not counting package building): installing,
    uninstalling, upgrading, querying, and verifying. This section contains an overview
    of each mode. For complete details and options try rpm --help, and see the rpm
    man page and the (previously mentioned) RPM book.


    # 8.2.1 Installing


    RPM packages typically have file names like foo-1.0-1.i386.rpm, which includes
    the package name (foo), version (1.0), release (1), and architecture (i386). Installing
    a package is as simple as:


    ```

    $ rpm -ivh foo-1.0-1.i386.rpm

    foo ###########################################

    ```


    As you can see, RPM prints out the name of the package (which is not necessarily
    as the file name, which could have been 1.rpm), and then prints a succession of
    hash marks as the package is installed, as a sort of progress meter.


    Installing packages is designed to be simple, but you can get a few errors:


    # Package Already Installed


    If the package is already installed, you will see:


    ```

    $ rpm -ivh foo-1.0-1.i386.rpm

    foo package foo-1.0-1 is already installed

    error: foo-1.0-1.i386.rpm cannot be installed

    ```


    If you really want to install the package anyway, you can use --replacepkgs on
    the command line, which tells RPM to ignore the error.'
  merge: -1
  img_proc: true
- pgno: 139
  md: '# Conflicting Files


    If you attempt to install a package that contains a file that has already been
    installed by other packages, you''ll see:


    ```

    # rpm -ivh foo-1.0-1.i386.rpm

    /usr/bin/foo conflicts with file from bar-1.0-1

    foo

    error: foo-1.0-1.i386.rpm cannot be installed

    ```


    To cause RPM to ignore that error, use --replacefiles on the command line.


    # Unresolved Dependency


    RPM packages can "depend" on other packages, which may require other packages
    to be installed in order to run properly. If you try to install a package for
    which there is an unresolved dependency, you''ll see:


    ```

    $ rpm -ivh bar-1.0-1.i386.rpm

    failed dependencies:

    foo is needed by bar-1.0-1

    ```


    To handle this error you should install the requested packages. If you want to
    force the installation anyway (a bad idea since the package probably will not
    run correctly), use --nodeps on the command line.


    # 8.2.2 Uninstalling


    Uninstalling a package is just as simple as installing:


    ```

    $ rpm -e foo

    ```


    Notice that we used the package name “foo”, not the name of the original package
    file “foo-1.0-1.i386.rpm".


    You can encounter a dependency error when uninstalling a package if some other
    installed package depends on the one you are trying to remove. For example:'
  merge: -1
  img_proc: true
- pgno: 140
  md: '# 8.2 Using RPM


    ```

    $ rpm -e foo

    removing these packages would break dependencies:

    foo is needed by bar-1.0-1

    ```


    To cause RPM to ignore that and uninstall the package anyway (which is a bad idea
    since the package that depend on it will probably fail to work properly),

    use --nodeps on the command line.


    # 8.2.3 Upgrading


    Upgrading a package is almost just like installing.


    ```

    $ rpm -Uvh foo-2.0-1.1386.rpm

    foo###########################

    ```


    What you don''t see above is the fact that RPM automatically uninstalled any old
    versions of the foo package. In fact you may want to always use -U to install
    packages, since it works even when there are no previous 2.0 versions of the package
    installed.


    Since RPM performs intelligent upgrading of packages with configuration files,
    you may see a message like:


    ```

    saving /etc/foo.conf as /etc/foo.conf.rpmsave

    ```


    This means that your changes to the configuration file may not be "forward compatible"
    with the new configuration file in the package, so RPM saved your original file,
    and installed a new one. You should investigate and resolve the differences between
    the two files as soon as possible to ensure your system continues to function
    properly.


    Since upgrading is really a combination of uninstalling and installing, you can
    encounter errors from those modes, plus one: If RPM thinks you are trying to upgrade
    a package with an older version number, you will see:


    ```

    $ rpm -Uvh foo-1.0-1.1386.rpm

    package foo-2.0-1 (which is newer) is already installed

    error: foo-1.0-1.1386.rpm cannot be installed

    ```


    To cause RPM to "upgrade" anyway, use --oldpackage on the command line.'
  merge: -1
  img_proc: true
- pgno: 141
  md: '# 8.2.4 Querying


    Querying the database of installed packages is accomplished with rpm -q. A simple
    use is rpm -q foo which will print the package name, version, and release number
    of the installed package:


    ```

    $ rpm -q foo

    rpm-2.0-1

    ```


    Instead of specifying the package name, you can use the following options -q to
    specify what package(s) you want to query. These are called Package Specification
    Options.


    +   * queries currently installed packages.

    * f <file> will query the package owning <file>.

    * F is the same as -f it takes filenames via stdin (e.g. find /usr/mnt/cdrom/RedHat/RPM
    | rpm -qF).

    * p <packagefile> queries the package <packagefile>.

    * P is like -p it takes package filenames from stdin (e.g. find /mnt/cdrom/RedHat/RPM
    | rpm -qP).


    There are many ways to specify what information to display about queried packages.
    The following options are used to select the information you are interested in.
    These are called Information Selection Options.


    +   * i displays package information such as name, description, release, size,
    build date, install, vendor, and other miscellaneous information.

    * 1 displays the list of files that the package “owns$.

    * s displays the state of all the files in the package. There are only two states,
    normal and missing.

    * d displays a list of files marked as documentation (man pages, info pages, READMEs,
    etc.).

    * c displays a list of files marked as configuration files. These are the files
    that change after installation to adapt the package to your system (sendmail.cf,
    passwd, initab, etc).'
  merge: -1
  img_proc: true
- pgno: 142
  md: '# 8.2 Using RPM


    For those options that display file lists, you can add -v to your command line
    to get the lists in a familiar ls -1 format.


    # 8.2.5 Verifying


    Verifying a package compares information about files installed from a package
    with the same information from the original package. Among other things, verifying
    compares the size, MD5 sum, permissions, type, owner and group of file.


    rpm -v verifies a package. You can use any of the Package Selection Options listed
    for querying the packages you wish to verify. A simple use rpm -V foo which verifies
    all the files in the foo package are as they were when they originally installed.
    For example:


    +   - To verify a package containing particular file:


    ```

    rpm -Vf /bin/vi

    ```


    +   - To verify ALL installed packages:


    ```

    rpm -Va

    ```


    +   - To verify an installed package against an RPM package file:


    ```

    rpm -Vp foo-1.0-1.i386.rpm

    ```


    This can be useful if you suspect that your RPM databases are corrupt.


    If everything verified properly there will be no output. If there are any discrepancies
    they will be displayed. The format of the output is a string of 8 characters,
    a possible "c" denoting a configuration file, and then the file name. Each of
    the 8 characters denotes the result of a comparison of one attribute of the file
    to the value of that attribute recorded in the RPM database. A single "," (period)
    means the test passed. The following characters denote failure of certain tests:


    5 MD5 checksum


    S File size


    L Symbolic link'
