    +   13. PressEsc to leave the "Change boot selection option" menu.


    +   14. Select "Setup Menu".Select "Supplementary menu, and save changes.


    +   15. Return to the boot menu.


    At the end of this process, your boot selection should look something like this
    (Not counting differences in boot selection and disk identification strings:


    ```

    LOADIDENTIFIER =Linux

    SYSTEMPARTITION=multi(0)disk(0)disk(0)

    OSLOADER=multi(0)disk(0)disk(0)\linload.exe

    OSLOADPARTITION=multi(0)disk(0)disk(0)

    OSLOADFILENAME=\milo

    OSLOADOPTIONS=

    ```


    At this point your Alpha system has been set to boot MILO from diskette.


    # D.5.2 Booting the Kernel Diskette


    Now it''s time to get started. We need to start by booting from the kernel diskette
    you''ve created. How this is done depends on your Alpha system. If it supports
    MILO, insert your MILO diskette, and boot from that. At the MILO prompt, insert
    your kernel diskette, and enter the following boot command:


    ```

    boot floppy

    ```


    MILO should then read the Linux kernel from your boot disk and start running.

    On the other hand, if you cannot use MILO, and must boot using the SRM console,
    enter the appropriate boot command for your Alpha system, making sure to add the
    following arguments to be passed to the kernel:


    ```

    load_ramdisk=1 prompt ramdisk=1

    ```'
