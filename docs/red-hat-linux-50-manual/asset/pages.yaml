- pgno: 149
  md: 'and then confirm it by typing a second time. Click on Done in the password
    entry window to confirm that you have typed the password correctly.


    The numbers that the tool provides for UID and GID will work. If you change them,
    you are on your own; the tool is designed to assume that if you change them, you
    know what you are doing and want to change them. If you don''t know what UID or
    GID stand for, leave them alone.


    If you have configured shadow passwords on your system you will have a Shadow
    Management button that will allow you to configure password and account expiry.
    By default (fields shown as blank have the default value), no expiry will be done.
    If you are unfamiliar with shadow password account management, you will probably
    wish to accept the default. Click on Done when you are done editing the expiry
    information.


    When you are done editing the user, click on Done in the Edit User Definition
    dialog box to add the user.


    If this user does not already have a home directory (and they won''t unless you
    have already created the home directory), one will be created.


    # 9.1.2 Removing a User


    ![](img/8b3a1d8c6536531eebe04fe36481b5a6_149_0.png)


    Figure 9.3: Delete User Dialog Box'
