    Press ENTER to confirm the selection.


    +   * Press F10 to save the changes. Press ENTER to confirm.


    Once you have done this, booting and running Linux on an AlphaBIOS based system
    should be very similar to doing so on an ARC system.


    # ### E.5.3 Loading MILO from the Evaluation Board Debug Monitor


    Evaluation boards (and often designs cloned from them) include support for the
    Alpha Evaluation Board Debug Monitor. Consult your system document before considering
    this method of booting MILO. The following systems are *known to include* Debug
    Monitor support:


    +   * AlphaPC64 (Section E.5.7)'
  merge: -1
  img_proc: true
- pgno: 246
  md: '# E.5 How To Load MILO


    +   - EB64+ (Section E.5.7)

    - EB66+ (Section E.5.7)

    - EB164 (Section E.5.7)

    - PC164 (Section E.5.7)


    Before you consider this method, you should note that the early versions of the
    Evaluation Board Debug Monitor did not include video or keyboard drivers and so
    you must be prepared to connect another system via the serial port so that you
    can use the Debug Monitor. Its interface is very simple and typing help shows
    a whole heap of commands. The ones that are most interesting include the word
    boot or load in them.


    The Evaluation Debug Monitor can load an image either via the network (netboot)
    or via a floppy (floboot). In either case, set the boot address to 0x200000 (>
    bootaddr 200000) before booting the image.


    If the image is on floppy (and note that only DOS formatted floppies are supported),
    then you will need to type the following command:


    ```

    AlphaPC64 flboot <MILO-image-name>

    ```


    # E.5.4 Loading MILO from a Failsafe Boot Block Floppy


    Only the AxpPCI33 is known to include failsafe boot block floppy floppy support
    (Section E.5.7).


    If you do not have a standard pre-built MILO.dd image, then you may need to build
    an SRM boot block floppy. Once you have built MILO, you need to do the following
    on Digital Unix:


    ```

    fdisk -fmt /dev/rfd0a

    cat bootm > /dev/rfd0a

    disklabel -rw rfd0a ''rx23'' reboot bootm

    ```


    Or on a Linux box:


    ```

    cat bootm bootm > /dev/fd0

    ```'
  merge: -1
  img_proc: true
- pgno: 247
  md: 'If you have a standard MILO image available (say MILO.dd) then you would be
    a boot block floppy using the following command:


    ```

    dd if=MILO.dd of=/dev/fd0

    ```


    # E.5.5 Loading MILO from Flash


    There are a number of systems where MILO can be blown into flash and booted directly
    (instead of via the Windows ARC firmware):


    +   * AlphaPC64 (Section E.5.7)

    * Noname (Section E.5.7)

    * EB66+ (Section E.5.7)

    * EB164 (Section E.5.7)

    * PC164 (Section E.5.7)


    # E.5.6 Loading MILO from the SRM Console


    The SRM (for System Reference Manual) Console knows nothing about filesystems
    or disk-partitions, it simply expects that the secondary bootstrap loader occupies
    a consecutive range of physical disks starting from a given offset. The information
    describing the secondary bootstrap loader (its size and offset) is given in the
    first 512 byte block. To load MILO the SRM you must generate that structure on
    a device which the SRM can access (such as a floppy disk). This is what mboot,
    mboot is the first block (or boot description) and mboot is the MILO image rounded
    up to a 512 byte boundary.


    To load MILO from a boot block device, either build mboot and bootm and push them
    onto the boot device using the following command:


    ```

    $ mboot bootm > /dev/fd0

    ```


    Or, grab the appropriate MILO.dd from a web site and write it onto the boot device
    using either RAWWRITE.EXE or dd.'
  merge: -1
  img_proc: true
- pgno: 248
  md: "# E.5 How To Load MILO\n\nOnce you have done that you can boot the SRM console\
    \ and use one of its many commands to boot MILO. For example, to boot MILO from\
    \ a boot block floppy you would use the following command:\n\n```\n>>boot dva0\n\
    \  (boot dva0.0.0.0.1 -flags 0)\n  block 0 of dva0.0.0.0.1 is a valid boot block\n\
    \  reading 621 blocks from dva0.0.0.0.1\n  bootstrap code read in\n  base = 112000,\
    \ image_start = 0, image_bytes = 4da000\n  initializing MWDP at 2000\n  initializing\
    \ page table at 104000\n  initializing machine state\n  setting affinity to the\
    \ primary CPU\n  jumping to bootstrap code\n  MILO Stub: VI.1\n  Unzipping MILO\
    \ into position\n  Allocating memory for unzip\n  ####...\n```\n\nThe following\
    \ systems are known to have SRM Console support:\n\n+   - Noname (Section E.5.7)\n\
    - AlphaPC64 (Section E.5.7)\n- EB164 (Section E.5.7)\n- PC164 (Section E.5.7)\n\
    \n# E.5.7 System Specific Information\n\n# AxpPci33 (Noname)\n\nThe Noname can\
    \ load MILO from the Windows NT ARC firmware (Section E.5.1), from the SRM Console\
    \ (Section E.5.6), and from a failsafe boot block floppy (Section E.5.4). A flash\
    \ management utility, runnable from MILO is available so that once MILO is running,\
    \ it can be blown into flash (Section E.7). However, warned that once you have\
    \ done this you will lose the previous image held there as there is only room\
    \ for one image."
  merge: -1
  img_proc: true
- pgno: 249
  md: "The way that Noname boots is controlled by a set of jumpers on the board, J29\
    \ and J28. These look like:\n\n```\nJ29  2 x x x 6\n      1 x x x x 5\n\nJ28 \
    \ 2 x x x 6\n      1 x x x x 5\n      3\n```\n\nThe two options that we're interested\
    \ in are J28, pins 1-3 which boots the console/loader from flash and J29, pins\
    \ 1-3 which boots the console/loader from a boot block floppy. The second option\
    \ is the one that you need to first boot MILO on the Noname board.\n\nOnce you've\
    \ selected the boot from floppy option via the jumpers, put the SRM boot block\
    \ containing MILO into the floppy and reboot. In a few seconds (after the floppy\
    \ goes out) you should see the screen back to white and MILO telling you what's\
    \ going on.\n\nIf you are really interested in technical stuff, the Noname loads\
    \ images off the floppy into physical address 0x040000 and images from flash into\
    \ 0x100000. For this reason, MILO is built with PALCode starting at 0x020000.\
    \ When it is first loaded, it moves itself to the correct location (see relocate.S).\n\
    \n# AlphaPC64 (Cabriolet)\n\nThe AlphaPC64 includes the Windows NT ARC firmware\
    \ (Section E.5.1), the SRM Console (Section E.5.6) and the Evaluation Debug Monitor\
    \ (Section E.5.3). These images are in flash and there is room to add MILO so\
    \ that you can boot MILO directly from flash. A flash management utility, runnable\
    \ from MILO is available so once MILO is running, it can be blown into flash (Section\
    \ E.7). This system supports MILO environment variables.\n\nYou select between\
    \ the boot options (and MILO when it is put into flash) using a combination of\
    \ jumpers and a boot option which is saved in the NVRAM of THE TOY clock.\n\n\
    The jumper is J2, SP bits 6 and 7 have the following meanings:\n\n+   * SP bit\
    \ 6 should always be out. If this jumper is set then the SROM mini"
  merge: -1
  img_proc: true
- pgno: 250
  md: '# E.5 How To Load MILO


    debugger gets booted,


    +   - SP bit 7 is in boot image selected by the boot option in the TOY clock,

    - SP bit 7 is out boot image in flash.


    So, with bit 7, the Debug Monitor will be booted as it is always the first image
    in flash. With bit 7 in, the image selected by the boot option in the TOY clock
    will be selected. The Debug Monitor, the Windows NT ARC firmware and MILO all
    supporting this boot option but you must be very careful using it. In particular,
    you cannot set the boot option so that next time the system boots MILO when you
    are running the Windows NT ARC firmware, it only allows you to set Debug Monitor
    or Windows NT ARC as boot options.


    To get MILO into flash via the Evaluation Debug Monitor, you will need a flashable
    image. The build procedures make MILO.rom, but you can also make a image using
    the makerom tool in the Debug Monitor software that comes with the board:


    ```

    > makerom v -i7 -1200000 MILO -o mini.flash

    ```


    (type makerom to find out what the arguments mean, but 7 is a flash image used
    by the s and -1200000 gives the load address for the image as 0x200000).


    Load that image into memory (via the Debug Monitor commands fload, netload, and
    so on) at 0x200000 and blow the image into flash:


    ```

    AlphaPC64> flash 200000 8

    ```


    (200000 is the image to be blown in memory and 8 is the segment number where you
    put it. There are 16 1024^64 byte segments in the flash and the Debug Monitor
    is at seg 0 and the Windows NT ARC firmware is at seg 4).


    Set up the image that the srom will boot by writing the number of the image into
    the TOY clock.


    ```

    AlphaPC64> boopt 131

    ```


    (131 means boot the 3rd image, 129 = 1st, 130 = 2nd and so on).


    Power off, put jumper 7 on and power on and you should see the MILO burst into
    life. If you don''t then take jumper 7 back and reboot the Debug Monitor.'
  merge: -1
  img_proc: true
- pgno: 251
  md: '# EB66+


    The EB66+, like all of the Alpha Evaluation Boards built by Digital contains the
    Evaluation Board Debug Monitor and so this is available to load MILO (Section
    E5.3). Quite often (although not always) boards whose design is derived from these
    include the Debug Monitor also. Usually, these boards include the NT ARC firmware
    (Section E5.1). A flash management utility, runnable from MILO is available so
    that once MILO is running, it can be blown into flash (Section E.7). This system
    supports MILO environment variables.


    These systems have several boot images in flash controlled by jumpers. The two
    jumpers are J18 and J16 and are located at the bottom of the board in the middle
    (when it is put into flash) the Alpha chip is at the top). You select the boot
    options (and MILO when it is into flash) using a combination of jumpers and a
    boot option which is saved in the NVRAM of the TOY clock.


    Jumper 7-8 of J18 means boot the image described by the boot option. Jumper 7-8
    of J16 means boot the Evaluation Board Debug Monitor.


    Blowing an image into flash via the Evaluation Board Debug Monitor is exactly
    the same procedure as for the AlphaPC64 (Section E5.7).


    # EB64+/Aspen Alpine


    This system is quite like the AlphaPC64 except that it does not contain flash
    which MILO can be loaded from. The EB64+ has two ROMs, one of which contains the
    Windows NT ARC firmware (Section E5.1) and the other contains the Evaluation Board
    Debug Monitor (Section E5.3).


    The Aspen Alpine is a little different in that it only has one ROM; this contains
    the Windows NT ARC firmware.


    # Universal Desktop Box (Multitia)


    This is a very compact pre-packaged 21066 based system that includes a TGA (21030)
    graphics device. Although you can fit a half height PCI graphics card in the box
    you are better off waiting for full TGA support in XFree86. It includes the Windows
    NT ARC firmware and so booting that is the preferred method (Section E5.1).'
  merge: -1
  img_proc: true
- pgno: 252
  md: '# E.5 To Load MILO


    # EB164


    The EB164, like all of the Alpha Evaluation Boards built by Digital contains the
