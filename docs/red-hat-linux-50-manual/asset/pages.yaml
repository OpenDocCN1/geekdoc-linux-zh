    # BIOS-Related Limitations Impacting LILO


    LILO is subject to some limitations imposed by the BIOS in most Intel-based computers.
    Specifically, most BIOSes can''t access more than two hard drives and they can''t
    access any data stored below cylinder 1023 (the 1024th cylinder) of any drive.
    Note that some recent BIOSes do not have these limitations, but this is by no
    means universal.


    All the data LILO needs to access at boot time (including the Linux kernel) is
    located in the /boot directory, which is normally part of the root partition (known
    as /. Here are the guidelines you must follow if you are going to use LILO to
    boot your Red Hat Linux system:


    **On First Two IDE Drives** - If you have two IDE (or EIDE) drives, /boot must
    be located on one of them. Note that this two-drive limit also includes any IDE
    CD-ROM drives on your primary IDE controller. So, if you have one hard drive and
    one IDE CD-ROM on your primary controller, /boot must be located on the first
    hard drive only, even if you have other hard drives on your secondary controllers.


    **On First IDE Or First SCSI Drive** - If you have one IDE (or EIDE) drive and
    one or more SCSI drives, /boot must be located either on the IDE drive or the
    SCSI drive at ID 0. No other SCSI IDs will work.


    **On First Two SCSI Drives** - If you have only SCSI drives, /boot must be located
    on a IDE drive at ID 0 or ID 1. No other SCSI IDs will work.


    **Partition Below Cylinder 1023** - No matter which of the above configurations
    apply, the partition that holds /boot must be located entirely below cylinder
    1023. If the partition holding /boot straddles cylinder 1023, you may face a situation
    where LILO will work initially (because all the necessary information is below
    cylinder 1023), but will fail if a new kernel is to be loaded, and kernel resides
    above cylinder 1023.'
  merge: -1
  img_proc: true
- pgno: 45
  md: 'As mentioned earlier, it is possible that some of the newer BIOSes may permit
    LILO to work with configurations that don''t meet our guidelines. Likewise, some
    LILO’s more esoteric features may be used to get a Linux system started, even
    if the configuration doesn''t meet our guidelines. However, due to the number
    of variables involved, Red Hot Software cannot support such extraordinary efforts.


    # 2.4.4 How Many Partitions?


    You can also install Red Hat Linux in a single large partition (subject to any
    of the partitioning considerations we’ve mentioned so far), it’s a much better
    idea to split things up a bit. We recommend the following layout as a compromise
    between single-partition simplicity, and multi-partition flexibility:


    **Please Note:** If you plan to install all the software packages accompanying
    Red Hat Linux, you may need to use larger partitions.


    **A partition** – Swap partitions are used to support virtual memory. If your
    computer has 16 MB of RAM or less, you must create a swap partition. Even if you
    have more memory, a swap partition is still recommended. The minimum size of your
    swap partition should be equal to your computer’s RAM, or 16 MB (whichever is
    larger).


    **A root partition** – The root partition is where / (the root directory) resides.
    It only needs to contain things necessary to boot your system, as well as system
    configuration files. A root partition of 50 MB to 80 MB works well for most systems.


    > Don’t forget the LILO constraints we mentioned in Section 2.4.3 on page 28!


    **A /usr partition** – The /usr partition is where the software on a Red Hat Linux
    system resides. This partition should be between 200 MB and 500 MB, depending
    on how many packages you plan to install. If at possible, try to be generous with
    the /usr partition. RPM-based packages you install later will (in general) use
    more space from /usr than any other partition.


    **A /home partition** – This is where users’ home directories go; the size of
    /home depends on how many users you plan to have on your Red Hat Linux system
    and what they might store in their home directories.'
  merge: -1
  img_proc: true
- pgno: 46
  md: '# 2.5 Getting Documentation


    | ALPHA |

    | The partition is specific to Red Linux/Alpha installations. |


    **A MILO partition** - Alpha owners who will be using MILO to boot their systems
    should create a 1.5 MB DOS partition where MILO can be copied over the installation
