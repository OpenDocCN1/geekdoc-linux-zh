    # 6.8.2 World Wide Web Server


    If you installed the Apache server (from the apache package), then your Web server
    is already up and running! Just point your web browser at `http://localhost`.


    The default page shown is /home/httpd/html/index.html. You can edit this file
    (or completely replace it) to your liking. All the CGI programs, icons, and html
    pages are stored in /home/httpd/, but this can be changed in the apache configuration
    files, all of which are stored in /etc/httpd/conf/. Logs of httpd activity are
    kept in /var/log/httpd/. Setting up your web server is as easy as adding your
    own HTML pages and links to the /home/httpd/html/ directory. For more information
    on customizing your web server we recommend a reference such as HTML: The Definitive
    Guide* by Chuck Musciano & Bill Kennedy, published by O''Reilly & Associates.


