    # 9.6.4 Restarting Kerneld


    The changes that you make with the Kernel Daemon Configuration tool will be made
    in the /etc/conf.modules file, which kerneld reads whenever it is started. Once
    you have made changes, you can restart kerneld by clicking on the Restart kerneld
    button. This will not cause any modules which are currently in use to be reloaded,
