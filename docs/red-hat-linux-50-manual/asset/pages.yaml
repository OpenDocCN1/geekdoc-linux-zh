    E5.3). Quite often (although not always) boards whose design is derived from these
    include the Debug Monitor also. Usually, these boards include the Windows NT ARC
    firmware (Section E.5.1). The SRM console is also available (Section E.5.6). A
    flash management utility, runnable from MILO is available so that once MILO is
    running, it can be blown into flash (Section E.7). This system supports MILO environment
    variables.


    These systems have several boot images in flash controlled by jumpers. The two
    jumper is J1 and is located at the bottom of the board on the left (if the Alpha
