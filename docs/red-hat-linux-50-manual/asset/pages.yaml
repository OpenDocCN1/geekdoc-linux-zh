- pgno: 124
  md: '# 6.7 Anonymous FTP


    # 6.7 Anonymous FTP


    Setting anonymous FTP is simple. All you need to do is install the anon-ftp rpm
    package (which you may have already done at install time). Once it is installed,
    anonymous FTP will be up and running.


    There are a few files you might wish to edit to configure your FTP server.


    /etc/ftpaccess This file defines what you can do: set up logical "groups" to control
    access from different sites, limit the number of simultaneous–neous FTP connections,
    transfer logging, and much more. Read the ftpaccess page for complete details.


    /etc/ftphosts The ftphosts file is used to allow or deny access to certain accounts
    from various hosts. Read the ftphosts page for details.


    /etc/ftpusers This file lists all the users that are not allowed to ftp into your
    machine. For example, root is listed in /etc/ftpusers by default. That means that
    you cannot ftp to your machine and log in as root. This is a good security measure,
    but some administrators prefer to remove root from this file.


    # 6.8 World Wide Web


    The world wide web is one of the hottest aspects of the Internet today. Red Hat
    Linux lets you get in the action in two ways – as a web browser, and as a web
    server. Let''s look at both.


    # 6.8.1 World Wide Web Browsers


    Variety of web browsers are available for Linux, including freely distributable
    browsers such as arena, lynx, and grail. The most popular commercial browsers
    are those from Netscape Communications Corporation. It is available for evaluation
    and non-commercial use from their ftp site:


    ```

    http://www.netscape.com/download/client.download.html

    ```


    It is also available in fully licensed versions directly from Netscape.'
