  md: '# 2


    # # Before You Begin


    While installing Red Hat Linux is a straightforward process, taking some time
    prior to starting the installation can make things much more smoothly. In this
    chapter, we''ll discuss the steps that should be performed before you start the
    installation.


    **Please Note:** If you are currently running a version 2.0 (or greater) Red Hat
    Linux system, you can perform an upgrade. Skim this chapter to review basic issues
    relating to installation, and read the following chapters in order, following
    the directions as you go. The upgrade procedure starts out identically to the
    installation procedure; you will be directed to choose an installation or upgrade
    after booting the installation program and answering a few questions.


    There are five things you should do prior to installing Red Hat Linux:


    +   1. Make sure you have access to the Red Hat Linux components required for
    installation.

    2. Make sure you know your computer''s hardware configuration and networking information.

    3. Decide, based on the first two tasks, what method you will use to install Red'
  merge: -1
  img_proc: true
- pgno: 31
  md: 'Hat Linux.


    +   4. Determine where on your hard drive(s) Red Hat Linux will reside.


    +   5. Make sure you have sufficient documentation to effectively use your Red
    Hat Linux system after the installation.


    Let''s start by making sure you have everything you need to install Red Hat Linux.


    # 2.1 Getting the Right Red Hat Linux Components


    If you''ve purchased the Red Hat Linux boxed set, you''re ready to go! However,
    mistakes occasionally happen, so now is a good time to double-check the contents
    of your boxed set. If you haven''t purchased a Red Hat Linux boxed set, skip to
    Section 2.1.3 on page 18.


    # 2.1.1 Contents of the Red Hat Linux Boxed Set


    The Red Hat Linux boxed set contains the following items:


    +   * The installation guide.


    +   * Red Hat Linux CDs 1 and 2.


    | INTEL |

    | Boot and supplemental diskettes. |


    +   * License and Registration card.


    +   * Sticker with registration number.


    Let''s take a quick look at each item:


    # Installation Guide


    The Red Hat Linux Installation Guide is what you''re currently reading. It contains
    the information necessary to install Red Hat Linux. In addition, it contains information
    about aspects of the operating system that are unique to Red Hat Linux.'
  merge: -1
  img_proc: true
- pgno: 32
  md: "# 2.1 Getting the Right Hat Linux Components\n\n# CDs 1 and 2\n\nThese two\
    \ Compact Discs contain the entire Red Hat Linux distribution, including source\
    \ code. CD 1 contains all the binary packages built for the type of computer (Intel,\
    \ Alpha or SPARC) that you have . CD 2 contains the source packages that were\
    \ used to build the binary packages on CD 1.\n\n# Boot and Supplemental Diskettes\n\
    \n+   INTEL\n diskettes are used to start the installation process for Red Hat\
    \ Linux/Intel. Depending on your computer's configuration and the type of installation\
    \ you select, you may need only the boot diskette, the boot and supplemental diskettes,\
    \ or none at all. When we discuss the different installation methods later in\
    \ this chapter, we will explain which diskettes are needed for each type of installation.\n\
    \n+   ALPHA\nAlpha owners should refer to Section D.4 on page 214 for information\
    \ on which diskettes are required.\n\n+   SPARC\nSPARC owners should turn to Section\
    \ C.5.1 on page 202 for information on which diskette needs.\n\n# License and\
    \ Registration card\n\nThis card contains the license terms for Red Hat Linux,\
    \ in addition to the license terms for any commercial software that may be included\
    \ on the Red Hat Linux CD. This is where you'll also find any late-breaking information\
    \ about Red Hat Linux 5.0.\n\n# Registration Sticker\n\nThe alphanumeric registration\
    \ string on this sticker is used to register you for installation support from\
    \ Red Hat Software."
  merge: -1
