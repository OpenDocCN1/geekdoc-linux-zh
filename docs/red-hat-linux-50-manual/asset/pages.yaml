    |

    | Adaptec 1542 | bases=base_addr |

    | Buslogic | buslogic=base_addr |

    | Pro Audio Spectrum / Studio 16 | pas16=port,irq |


    Some examples would be:


    | Configuration | Example |

    | --- | --- |

    | Adaptec AHA152 at port 330, IRQ 11, SCSI ID 7 | aha152x=0x330,11,7 |

    | Adaptec AHA1542 at port 330 | bases=0x330 |

    | Future Domain TMC-800 at CA000, IRQ 10 | controller_type=2 base_address=0xca000
    irq=10 |


    When a parameter has commas, make sure you do not put a space after a comma.


    # F.3 Ethernet parameters


    Most ethernet drivers accept parameters to specify a base IO address and an IRQ
    as follows:


    ```

    io=base_addr irq=irq

    ```


    For example, for a 3com 3c509 ethernet card located at IO address 210 (IO addresses
    are usually in hexadecimal) and IRQ 10, use the following parameters for the 3c509
    driver:'
  merge: -1
  img_proc: true
- pgno: 267
  md: 'io=0x210 irq=10


    You can use multiple ethernet cards in one machine . If each card uses a different

    driver (e.g., 3c509 and a DE425), you simply need to add aliases (and possibly

    options) for each card to /etc/conf.modules; for example:


    ```

    alias eth0 3c509

    options 3c509 io=0x210 irq=10

    alias eth1 de4x5

    options de4x5 io=0

    ```


    See Section 9.6 on page 148 for more information.


    However, if any two ethernet cards use the same driver (e.g., two 3c509''s or
    a

    3c595 and a 3c905), you will need to compile a custom kernel with the ethernet

    driver built in. In that case, you can use the “classic" LILO boot: parameters
    of

    the form:


    ```

    ether=irq,base,addr,interface

    ```


    For example:


    ```

    LILO boot: linux ether=10,0x210,eth0 ether=11,0x300,eth1

    ```


    (For more information about using more than one ethernet card, see the Multiple-

    Ethernet mini-HOWTO.)'
  merge: -1
  img_proc: true
- pgno: 268
  md: '# # G Metro X


    # ## G.1 Special Features


    # #### G.1.1 Hot-Key Exit


    Metro-X supports a hot-key exit. This is useful for terminating the X server if
    the last client in your ..xinitrc or .xsession does not provide a way to exit
    the session. The exit key combination is `Ctrl+Alt+Backspace`.


    # #### G.1.2 Hot-Key Resolution Switching


    When configuring Metro-X you can select screen resolutions. You can then change
    the resolutions on the fly while running your X server by pressing the appropriate
    key combination. To switch to the next resolution, press `Ctrl+Alt+-`. To switch
    to the previous resolution, press `Ctrl+Alt+.'
  merge: -1
  img_proc: true
- pgno: 269
  md: '# G.1.3 Hardware Panning


    Metro-X supports hardware panning. This lets you set the virtual resolution higher
    than the monitor''s physical resolution. Windows can then extend beyond the screen''s
    physical boundaries and can be viewed by scrolling into the extended area.


    # G.1.4 Multiple Screens


    Metro-X supports up to four screens which can be all controlled simultaneously
    with a single keyboard and mouse. This allows you to run multiple applications
    with out overlapping windows, and is particularly useful for image-processing
    work.


    In a multiple screen configuration there is X process, one mouse, and one key
    board - several screens. The mouse/cursor can be moved between the different screens.
    Clients connect to the different screens with the syntax -display :0.X where X
    is the screen number.


    # Supported Cards


    Use up to four or any one card from the following list:


    +   - One or more Matrox MGA Impression Plus

    - One or more Matrox MGA Ultima Plus

    - One or more Matrox MGA Millennium


    # G.1.5 International Keyboards


    Metro-X uses the X Keyboard extension to support various keyboards. The key board
    description contains information about the physical layout of a keyboard, the
    key codes that come from the keyboard, and the symbol information needed to map
    the keycodes into keysym.


    Metro-X provides many predefined configurations, sorted by language and count.
    These configurations are selected through configX (section 6.3.3 on page 98).'
  merge: -1
  img_proc: true
- pgno: 270
  md: 'G.2 Metro X Configuration File


    # G.2 Metro X Configuration File


    # G.2.1 Warning


    The primary configuration file for the X server is Xconfig. If inappropriate changes
    are made to this file, the proper functioning of Metro-X will be impaired! Do
    not edit the Xconfig file unless absolutely necessary.


    # G.2.2 Xconfig


    Metro-X looks for the Xconfig file in the following locations and in the following
    order:


    ```

    $HOME/Xconfig

    $HOME/.Xconfig

    /etc/X11/Xconfig (on Linux only)

    /usr/lib/X11/Metro/Xconfig

    ```


    Most options are set with the configuration utility (ConfigX, section 6.3.3 on
    page 98). Additional options can be added using an editor, and ConfigX will preserve
    these.


    # G.2.3 Keywords


    Descriptions of the Xconfig keywords are listed below. They are alphabetized here
    for your convenience and any order dependencies are noted within the individual
    entries.


    # Options Set In Configuration Utility


    The list of Xconfig keywords are options controlled via the Metro-X Configuration
    Utility. Any changes to these options should be made through the utility to avoid
    accidental damage to the function of Metro-X.


    BitsPerPixel <number> Some X drivers support packed 24 bits per pixel memory organization.
    This means each pixel takes up three bytes of video memory. In this case, configX
    inserts the line: BitsPerPixel 24'
  merge: -1
  img_proc: true
- pgno: 271
  md: 'Buttons <number> This specifies the number of buttons on the mouse. This entry
    must immediately follow the Mouse entry in the Xconfig file.


    Card<string> This designates the model of the graphics card in use. This is only
    used by configX.


    Chipset <string> This displays the chipset used by the server. Normally configX
    inserts the correct chipset into the Xconfig file.


    Clocks <number>[<number>] This contains a list of numbers specifying the frequencies
    associated with the clock generator on the card. The numbers are specified in
    MHz.


    Depth <number> This references the color depth of the screen, which controls how
    many colors can be displayed. Different cards and drivers support different depth
    values: 4, 8, 16, 24, or 32. Depth 4 supports 16 colors and depth 32 supports
    16 million colors.


    Dimensions <width><height> This keyword represents the dimensions of the screen
    in millimeters, which is passed to X clients upon request.


    DPMSOffDelay<number> This controls the number of seconds after the last user input
    before the screen enters DPMS off mode. Off mode provides maximum power reduction.
    To activate this mode, the X server disables the horizontal and vertical sync
    signals to the monitor.


    DPMSstandbyDelay<number> This controls the number of seconds after the last user
    input before the screen enters DPMS standby mode. Standby mode provides minimal
    power reduction. To activate this mode, the X server disables the horizontal sync
    signal to the monitor.


    DPMSSusppendDelay<number> This controls the number of seconds after the last user
    input before the screen enters DPMS suspend mode. Suspend mode provides significant
    power reduction. To activate this mode, the X server disables the vertical sync
    signal to the monitor.


    Driver<string> This references the name of the driver, which usually corresponds
