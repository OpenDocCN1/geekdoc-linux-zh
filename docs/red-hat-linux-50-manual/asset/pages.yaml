    Additionally, you may wish to create any of the following:


    +   **A /usr/local partition** - Traditionally, `/usr/local` has been used to
    hold things you wish to separate from the rest of your Red Hat Linux system, such
    as software that is not available as an RPM package. The size depends on the amount
    of software that you anticipate putting on your system.


    +   **A /usr/src partition** - There are two things that are stored in `/usr/src`
    on a stored here, and new kernels are built here.


    +   **Linux Kernel Sources** - The complete sources for the Linux kernel are stored
    here, and new kernels are built here.


    +   **Sources For RPM-Based Packages** - If a source package file (aka SRPM) is
    installed, the files are stored here. Note that, unless specified other-wise,
    any packages built also use a build directory located here.


    Again, the size of this partition would depend on the amount of software you anticipate
    building.


    +   **A /tmp partition** - As the name implies, `/tmp` partition is for temporary
    files. Creating a partition dedicated to `/tmp` is a good idea for larger, multi-user
    systems or network server machines. The reason is that many active users can fill
    the root partition (/), which is where `/tmp` is located. It''s not necessary
    to dedicate a partition to `/tmp` on single-user workstations.


    # 2.5 Getting Documentation


    Red Hat Linux is a powerful, full-featured operating system. Unless you''re a
    Linux wizard, you''re going to need documentation to make the most of your Red
    Hat Linux system. Everyone should review Chapter 7 on page 113 for more information
    on available Linux documentation. While many people find the resources'
  merge: -1
  img_proc: true
- pgno: 47
  md: 'described in chapter 7 to be very helpful, people who are just to use Linux
    will likely need additional information. The information that will be most helpful
    to you depends on your level of Linux expertise:


    **New To Linux** – If this is your first time using Linux (or any Linux-like operating
    system, for that matter), you''ll need solid introductory information on basic
    concepts. For example,O''Reilly produce a wide variety of Linux and Unix-related
    books. Give your more general titles a try.


    **Some Linux Experience** – If you''ve used other Linux distributions (or a Linux-like
    operating system), you''ll probably find what you''re looking for in some in-depth
    reference material. Red Hot Software''s *Doctor Linux* are great for overall documentation,
    while O''Reilly''s more specialized titles are valuable when you need a lot of
    information on a particular subject.


    **Old Timer** – If you''re a long-time Red Hat Linux user, you probably don''t
    need us telling you what documentation to read. Thanks for reading this far!


    # 2.6 A Note About Kernel Drivers


    During installation of Red Hat Linux, there are some limits placed on the systems
    and other drivers supported by the kernel. However, at installation there is support
    for all files available under Linux. At install time the modernized kernel has
    support for (IDE devices, including ATAPI CD-ROM drives), SCSI adapters, and network
    cards. Additionally, all, mice, SLIP, PPP, PLIP, FPU emulation, console selection,
    EFS, IP, forwarding, firewalling and accounting, reverse ARP, QC tape and parallel
    printers, are supported.


    **Please Note:** Because Red Hat supports installation on many types of hardware,
    many drivers (including for SCSI adapters, network cards, and many CD-ROMs) are
    not built into the Linux kernel during installation; rather, they are available
    as needed and installed during the installation process. If necessary, you will
    have the chance to specify options for these modules at the time they are loaded,
    and in fact these drivers will ignore any options you specify for them at the
    boot: prompt.


    After the installation is complete you may want to rebuild a kernel that includes
    support for your specific hardware configuration. See Section 6.1 on page 89 for'
  merge: -1
