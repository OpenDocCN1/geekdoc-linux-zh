    Figure 9.2: Add User Dialog Box


    First enter the username. This is not the user''s first and last name; it is the
    id they will use to log on to the system. Do not include any spaces or colons,
    and do not enter more than 8 characters. Press the enter key when you are finished,
    and some of the other fields will be filled with default values. You may change
    them if you wish, but at your option, enter the user''s full name, office, and
    phone numbers. The login shell can be changed from the default (normally /bin/bash)
    either by choosing a selection from the drop-down menu or by simply typing in
    the other fields.


    You need to think about the password. There are five options on the encrypted
    password menu: Original, Change, No Password, Lock, and Unlock. No Password is
    a very bad option—with password anyone can log to your system using this id but
    Choosing Lock will prevent anyone from logging in with this but keep any password
    already assigned so that it can be unlocked; Unlock will unlock a previously locked
    password. Original is blank (No Password) when you are adding a new user — the
    same dialog box is used for editing existing users, when Original is the user''s
    original password. Usually you will choose Change. A small dialog box will appear
    where you will need to enter a password,'
  merge: -1
