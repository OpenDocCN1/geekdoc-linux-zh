    7. Press Tab to move to the next field.


    # Screen Saver


    Some graphics and monitors support the Display Power Management System (DPMS),
    which minimizes the power used by the monitor when user input ceases. If your
    hardware has this feature, the phases of DPMS can be controlled in this section.
    The typical DPMS setup has a cascade effect, with the various phases being activated
    in succession with your choice of delay times between each.


    +   * X Screen Saver - Preliminary phase to DPMS, which blanks the screen but
    provides no power reduction.

    * Standby Mode - First phase of DPMS, which provides moderate power reduction
    by disabling the horizontal sync signal to the monitor.

    * Suspend Mode - Second phase of DPMS, which provides significant power reduction
    by disabling the vertical sync signal to the monitor.

    * Monitor Off - Final phase of DPMS, which provides maximum power reduction by
    disabling the horizontal and vertical sync signals to the monitor.


    +   1. In the X Screen Saver delay phase, press Enter to toggle this option on
    or off.

    2. If toggled on, press Tab to move to the Minutes field, use or or to set the
    value.'
