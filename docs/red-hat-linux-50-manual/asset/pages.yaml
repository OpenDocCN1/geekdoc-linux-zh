- pgno: 236
  md: '# # Alpha Miniloader Howto


    # ## E.1 Introduction


    This document describes the Miniloader for Linux on Alpha AXP (MILO). This firmware
    is used to initialize Alpha AXP based systems, load and start Linux and, finally,
    provide PALCode for Linux.


    # ### E.1.1 Copyright


    The Alpha Miniloader (MILO) HOWTO is copyright (C) 1995, 1996, 1997 David A Rusling.


    **Copyright.** Like all HOWTO documents, it may be reproduced and distributed
    whole or in part, in any medium, physical or electronic, so long as this copyright
    notice is retained on all copies. Commercial redistribution is allowed and encouraged;
    however the author would like to be notified of such distributions. You may translate
    this HOWTO into any language whatsoever provided that you leave this copyright
    statement and disclaimer intact, and that you append a notice stating who translated
    the document.'
  merge: -1
  img_proc: true
- pgno: 237
  md: 'Disclaimer. While I have tried to include the most correct and up to date information
    available to me, I cannot guarantee usage of information in this document does
    not result in loss of data or equipment. I provide NO WARRANTY about the information
    in the HOWTO and I cannot be made liable for any consequences resulting from using
    the information in this HOWTO.


    # E.1.2 New Versions of this Document


    The latest version of this document can be found in ftpp://gatekeeper.com/pub/Digital/Linux-Alpha/Miniloader/docs
    and David Mosberger-Tang is kind enough to include the several interesting html
    form of his in excellent Linux FAQ-site http://www.azstarnet.com/ axplinux.


    # E.2 What is MILO?


    On Intel based systems, the BIOS firmware sets up the system and then loads the
    image to run from the boot block of a DOS file system. This is more or less what
    MILO does on an Alpha system, however there are several interesting differences
    between BIOS firmware and MILO, not least of which is MILO includes and uses standard
    Linux device drivers unmodified. MILO is firmware, unlike MILO, which relies on
    the BIOS firmware to get itself loaded. The main functional parts of MILO are:


    +   1. PALCode,

    2. Memory set up code (builds page tables and turns on virtual addressing),

    3. Video code (BIOS emulation code and TGA (21030)),

    4. Linux kernel code. This includes real Linux kernel code (for example, the interrupt
    handling) and ersatz or mock Linux kernel,

    5. Linux block device drivers (for example, the floppy driver),

    6. File system support (ext2, MS-DOS and ISO9660),

    7. User interface code (MILO),

    8. Kernel interface code (sets up the HWRPB and memory map for linux),'
  merge: -1
  img_proc: true
- pgno: 238
  md: '# E.2 What is MILO?


    +   9. NVRAM paragraphs describe these functional parts in more detail.


    The following paragraphs describe these functional parts in more detail.


    PALCode can be thought of as a tiny software layer that tailors the chip to a
    par-

    ticular operating system. It runs in a special mode (PALmode) which has certain

    restrictions but it uses the standard Alpha instruction set with just five extra
    in-

    s. In this way, the Alpha chip can run diverse operating systems as

    Windows NT, OpenVMS, Digital Unix and, of course, Linux. The PALCode that

    MILO uses (and therefore Linux itself) is like the rest of MILO - freeware. It
    is

    derived from Digital''s example Unix PALCode.

    The differences between the different PALCodes are because of differences in ad-

    dress mapping and interrupt handling that exist between the Alpha chips (21066

    systems have a different I/O map to 21064+2107x systems) and different

    Alpha based systems.


    For MILO to operate properly it needs to know what memory is available, where

    Linux will eventually be running and it must be able to allocate temporary

    memory for the Linux device drivers. The code maintains a memory map that has

    entries for permanent and temporary allocated locations. As it boots, MILO uncom-

    presses into the correct place in memory. When it passes control to

    t Linux kernel, it reserves memory for the compressed version of itself, the PAL-

    code (which the kernel needs to use some data structures). This leaves most of
    the

    memory in the system for Linux itself.


    The final act of the memory code is to set up and turn on virtual addressing so

    the data structures that Linux expects to see are at the correct place in virtual

    memory.


    MILO contains video code that initiates and uses the video device for the system.

    It will detect and use a VGA device if there is one, otherwise it will try to
    use a TGA

    (21030) video device. Failing that, if it is built, includes is there is no graphics
    device.

    The BIOS emulation that the standard, pre-built, images include Digital''s own

    BIOS emulation which supports, if not all, of the standard graphics devices

    available.


    Linux device drivers live within the kernel and expect service from the

    kernel. Some of these services are provided directly by Linux kernel code, for
    ex-\ample the interrupt handling and some is provided by kernel look-alike routines.


    MILO''s most powerful feature is that you can embed unaltered Linux device drivers

    to it. This gives it the potential to support every device that Linux does. MILO

    includes all of the block devices that are configured into the Linux kernel that
    is'
  merge: -1
  img_proc: true
- pgno: 239
  md: '224


    # Alpha Miniloader Howto


    built against as well as a lot of the block device code (for example, LLrw.blk()).


    MILO loads the Linux kernel from real file systems rather than from boot boots
    and other strange places. It understands MSDOS, EXT2 and OS9660 filesystems. Gzip''d
    files are supported and are recommended, particularly if you are loading from
    floppy which is rather slow. MILO recognises these they, their .gz suffix.


    Built into MILO is a simple keyboard driver which, together with simple video
    driver allows it to have a simple user interface. That interface allows you to
    list files on configured devices, Boot Linux or run flash updates and set environment
    variables that control the system''s booting. Like LILO, you can pass arguments
    to the Kernel.


    MILO must tell the kernel what sort of system this is, how much memory there is
    and which of memory is free. It does this using the HWPRB (Hard-Restart Parameter
    Block) data structure and associated memory cluster-descriptions. They are placed
    at the appropriate place in virtual memory just before control is passed to the
    Linux kernel.


    # E.3 Pre-Built Standard MILO Images.


    If you are planning to run Linux on a standard Alpha based system, then there
    are pre-built "standard" MILO images that you might use. These (along with the
    sources and other interesting stuff) can be found in

    ftp://gatekeeper.de.com/pub/Digital/Linux-Alpha/Miniloader.


    The images subdirectory contains a directory per standard system (eg AlphaPC64)
    with MILO images having the following naming convention:


    +   1. MILO - Miniloader executable image, this image can be loaded in a variety
    of ways,

    2. fmu.gz - Flash management utility,

    3. MILO.dd - Boot block floppy disk image. These should be written using rawwrite.exe
    or dd on Linux.


    The test-images, like the images subdirectory contains a directory per standard
    system. These images are somewhat experimental but tend to contain all the latest
    features.'
  merge: -1
  img_proc: true
- pgno: 240
  md: '# E.4 How To Build MILO


    # E.4 How To Build MILO


    You build MILO separately from the Kernel. As MILO requires parts of the kernel
    to function (for example interrupt handling) you must first configure and build
    the kernel that matches MILO that you want to build. Mostly this means building
    the kernel with the same version number. So, MILO-2.0.25.tar.gz will build against
    linux-2.0.25.tar.gz, but there at no match MILO ELF shared libraries are fully
    supported, there are two versions of the MILO source. To build under an ELF system
    you must first unpack the standard MILO sources and then patch those sources.
    In the remainder of this discussion, I assume that your working kernel sources
    and object files are stored in the subtree at /usr/src/linux and that the linux
    kernel has been fully built with the command make


    To build MILO, change your working directory to the MILO source directory and
    invoke make:


    ```

    $ make KSRC=/usr/src/linux config

    ```


    Just like the Kernel, you will be asked a series of questions


    > Echo output to the serial port (MILO_SERIAL_ECHO) [y]


    It''s a good idea to echo kernel print to /dev/tty0 if you can. If you can (and
    want to), then type "y", otherwise "n". All of the standard, pre-built, MILO images
    include serial port I/O using COMI.


    > Use Digital''s BIOS emulation code (not free) \ (MINI_DIGITAL_BIOS_EMU) [y]


    This code is included as a library which is freely distributable as long as it
    is used on an Alpha based system. The sources are not available. If you answer
    n the freatement BIOS emulation will be built. It Note that you cannot right now
    build Digital''s BIOS emulation code in an ELF system (the library is not yet
    ready) and so you must answer no to this question.


    > Build PALCODE from sources (Warning this is dangerous) \ (MINI_BUILD_PALCODE_FROM_SOURCES)
    [n]'
  merge: -1
  img_proc: true
- pgno: 241
  md: 'You should only do this if you have changed the PALcode sources, otherwise
    use the standard, pre-built PALcode included with MILO.


    You are now all set to build the MILO image itself:


    ```

    $ make KSRC=/usr/src/linux

    ```


    When the build has successfully completed, the MILO image is in the file called
    milo. There are a lot of images called milo.*, these should be ignored.


    # E.5 How To Load MILO


    The most commonly supported method of loading MILO is from the Windows NT ARC
    firmware as most operating systems support this. However, there are a wide variety
    of loading MILO. It may be loaded from:


    +   * a failsafe boot block floppy,

    * Windows NT ARC firmware,

    * Windows NT AlphaBIOS,

    * Digital''s SRM console,

    * an Alpha Evaluation Board Debug Monitor,

    * flash/ROM.


    # E.5.1 Loading MILO from the Windows NT ARC firmware


    If not all, Alpha AXP based systems include the Windows NT ARC firmware and this
    is the preferred method of booting MILO and Linux. Once the Windows NT firmware
    is running and you have the correct MILO image for your system, this method is
    completely generic.


    The Windows NT ARC firmware is an environment in which programs can run and make
    callbacks into the firmware to perform actions. The Windows NT OSLoader is a program
    that does exactly this. Linload.exe is a much simpler program which does just
    enough to load and execute MILO. It loads the appropriate'
  merge: -1
  img_proc: true
- pgno: 242
  md: '# E.5 How To Load MILO


    image file into memory at 0x00000000 and then makes a swap-PALcall to it. MILO,
    like Linux, uses a different PALcode to Windows NT which is why the swap has to
    happen. MILO relocates itself to 0x200000 and continues through the PALcode reset
    entry point as before.


    Before you add a Linux boot option, you will need to copy linload.exe and the
    appropriate MILO that you wish to load to somewhere that the Windows NT ARC firmware
    can read from. In the following example, I assume that you are booting from a
    DOS floppy disk:


    +   1. At the boot menu, select "Supplementary menu..."

    2. At the "Supplementary menu", select "Set up the system..."

    3. At the "Setup menu", select "Manage boot menu..."

    4. In the "Boot selections menu", choose "Add a boot selection"

    5. Choose "Floppy Disk 0"

    6. Enter "linload.exe" as the osloader directory and name

    7. Say "yes" to the operating system being on the same partition as the osloader

    8. Enter "\ as the operating system root directory

    9. I usually enter "Linux" as the name for this boot selection

    10. Say "No" you do not want to initialise the debugger at boot time

    11. You should now be back in the "Boot selections menu", choose the "Change a
    boot selection option" and pick the selection you just created as the one to edit

    12. Use the down arrow to go to "OSLOADFILENAME" up and type in the name of the
    MILO image that you wish to use, for example "noname.arc" followed by return.

    13. Press ESC to go back to the "Boot Selections menu"

    14. Choose "Setup Menu" (or hit ESC again) and choose "Supplementary menu, and
    save changes" option

    15. ESC will get you back to the "Boot menu" and you can attempt to boot MILO.
    If you do not want Linux as the first boot option, then you can alter the order
    of the boot options in the "Boot selections menu".'
  merge: -1
  img_proc: true
- pgno: 243
  md: 'At the end of all this, you should have a boot selection that looks something
    like:


    ```

    OSLOADIDENTIFIER=Linux

    SYSTEMPARTITION=multi(0)disk(0)fdisk(0)

    OSLOADER=multi(0)disk(0)fdisk(0)\linux.exe

    OSLOADPARTITION=multi(0)disk(0)fdisk(0)

    OSLOADFILENAME=\noname.arc

    OSLOADOPTIONS=

    ```


    You can now boot MILO (and then Linux). You can load inload.exe and MILO directly
    from a file system that Windows NT understands as NTFS or OS on a hard disk.


    The contents OSLOOPTIONS are passed to MILO which interprets it as a command.
    So, in order to boot Linux directly from Windows NT without pausing in MILO, you
    could pass the following in OSLOOPTIONS:


    ```

    boot sda2:vmlinuz.gz root=/dev/sda2

    ```


    See E.6 for more information on the commands available.


    Another (rather sneaky) way of loading MILO via the WNT ARC firmware is to put
    MILO onto an MS-DOS floppy and call it fwupdate.exe and then choose the "Upgrade
    Firmware" option.


    # E.5.2 Loading MILO from the Windows NT AlphaBIOS


    With the introduction of the XLT series, Digital changed the system console interface
    for its NT systems from ARC to AlphaBIOS. AlphaBIOS is a screen-oriented interface
    which would be more familiar to PC users. This change necessitates a change in
    setup procedure for those who wish to run Linux/Alpha AlphaBIOS-based systems.


    The first thing you must do is install the latest version of AlphaBIOS on your
    system. This can be obtained from Digital''s "System Software and Driver Updates"
    web page.

    http://www.windows.digital.com/support/syst.htp. Download the ZIP file, unzip
    it, and install it as:


    +   * Copy the files to a FAT-formatted floppy'
  merge: -1
  img_proc: true
- pgno: 244
