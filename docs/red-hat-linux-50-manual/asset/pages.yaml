- pgno: 37
  md: '# 2.3.1 PCMCIA Support During the Installation


    | INTEL |

    | The PCMCIA section is specific to Intel-based computers only |


    Most Intel-based laptop computers support PCMCIA (also known as PC Card). Computers
    that support PCMCIA devices contain a controller having one or more slots in which
    a PCMCIA device can be installed. These devices may modems, LAN adapters, SCSI
    adapters, and so on.


    When installing Red Hat Linux/Intel on a PCMCIA-capable computer, it is important
    to note if a PCMCIA device will be used during installation. For example, if you
    want to install Red Hat Linux from a CD-ROM, and your CD-ROM drive is connected
    to a PCMCIA adapter, the installation program will require PCMCIA support. Likewise,
    if you are going to use one of the network-based installation methods, you will
    need PCMCIA support if your network adapter is PCMCIAbased.


    PCMCIA support depends on two things:


    +   1. The type of PCMCIA controller in your computer system.

    2. The type of PCMCIA device that you wish you use during the installation.


    While nearly every PCMCIA controller and most popular PCMCIA devices are supported,
    there are some exceptions. For more information, please consult the Red Hat Linux
    Hardware Compatibility List at http://www.redhat.com/hardware.


    The main thing to keep in mind is that if you require PCMCIA support, you will
    need the supplemental diskette.


    | ALPHA |

    | PCMCIA support is not available for the Alpha. |


    | SPARC |

    | PCMCIA support is not available for the SPARC. |'
  merge: -1
  img_proc: true
- pgno: 38
  md: '# 2.3 Installation Methods


    # 2.3.2 Installing From a CD-ROM


    If you have a Red Hat Linux CD-ROM, and your computer has a supported CDROM drive,
    you should consider this installation method. Installing directly from CD-ROM
    is the most straightforward approach. When installing from CD-ROM, the packages
    you select read from the CD-ROM, and are installed on your hard drive.


    How To Do It


    As the name implies, you will need a Red Hat Linux CD-ROM, a supported CDdrive,
    and a means of starting the installation program.


    > Intel systems will use the boot diskette (and the supplemental diskette if PCMCIA
    support is required). There is an alternate method of installing from CD-ROM that
    uses diskettes, but which the system is running DOS. We''ll discuss this approach
    (known as autoboot in Chapter 3 on page 35). For now, note that PCMCIA support
    is not available when using autoboot.


    If you''ve determined that this installation method is most applicable to your
    situation, please skip ahead to Section 2.4 on page 25.


    # 2.3.3 Installing From an FTP Site


    If you don''t have a Red Hat Linux CD-ROM or a CD-ROM drive, but you have network
    access, then an FTP installation may be for you. When installing via FTP, the
    Red Hat Linux packages you select are downloaded (using FTP) across the network
    to your computer, and are installed on your hard drive.


    How To Do It


    When doing an FTP installation, you''ll need LAN-based access to a network; a
    dialup connection via modem won''t cut it. If your Local Area Network has Internet
    access, you can use one of the many FTP sites that mirror Red Hat Linux. You can
    find a list of mirror sites at `ftp://ftp.redhat.com/pub/MIRORS.`'
  merge: -1
  img_proc: true
- pgno: 39
  md: 'If your LAN doesn''t have Internet access, all is not lost. If there is a computer
    on your LAN that can accept anonymous FTP requests, simply load Red Hat Linux
    on that system, and you''re ready to go.


    | INTEL |

    | For an FTP installation, you must use both the boot and supplemental diskettes.

    | You will need to have a valid nameserver configured or you must specify the
    IP address of the FTP server you will be using. You will also need the path to
    the Red Hat Linux directory on the FTP server |


    If you''ve determined that this installation method is most applicable to your
    situation, please skip ahead to Section 2.4 on the next page.


    # 2.3.4 Installing From an NFS Server


    If your system doesn''t have a CD-ROM drive, but you do have network access, then
    an NFS installation may be for you. When installing via NFS, the Red Hat Linux
    packages you select are NFS-served to your computer from an NFS server system.
    The packages are then installed on your hard drive.


    # How To Do It


    If you wish to perform an NFS installation, you will need to mount the Red Hat
    Linux CD-ROM on a machine that supports ISO-9660 file systems with Rock Ridge
    extensions. The machine must also support NFS. Export the CD-ROM file system via
    NFS. You will need to have a nameserver configured, or know the NFS server''s
    IP address, as well as the path to the exported CD-ROM.


    | INTEL |

    | For an NFS installation, you''ll need a boot diskette only |


    If you''ve determined that this installation method is most applicable to your
    situation, please skip ahead to Section 2.4 on the facing page.'
  merge: -1
  img_proc: true
- pgno: 40
  md: '# 2.4 Disk Partitions


    # 2.3.5 Installing From a Hard Drive


    If none of the other installation methods will work for you, but you have some
    means of getting the Red Hat Linux package files written to your system''s hard
    drive, you can install from your hard drive. In this installation method, the
    Red Hat Linux packages you select are from one partition on a hard drive, and
    are installed on another partition (or set of partitions).


    # How To Do It


    The hard drive installation method requires a bit of up-front effort on your part,
    as you must copy all the necessary files to a partition before starting the Red
    Hat Linux installation program. You must first create a Red directory at the top
    of your directory tree. Everything you install will be placed in that directory.
    First copy the base subdirectory and its contents.


    Next, copy the packages you want to install to another subdirectory called RPMs.
    You can use available space on an existing DOS partition or a Linux partition
    that is not required in the installation procedure (for example, a partition that
    would be used for data storage on the installed system).


    > INTEL If you are using a DOS filesystem, you will not be able to use the full
    Linux filenames for the RPM packages. The installation process does not care what
    the filenames look, but it is a good idea that you keep track of them. You''ll
    need a boot and supplemental diskette when installing from a hard drive.


    # 2.4 Disk Partitions


    In order to install Red Hat Linux, you must make disk space available for it.
    This disk space needs to be separate from the disk space used by other operating
    systems you may have installed on your computer, such as Windows, OS/2, or even
    a different version of Linux.


    A disk can be divided into different partitions. Each partition can be accessed
    as it was a separate disk. Furthermore, each partition has a type that is used
    to indicate how information is stored in the partition. For example, there are
    different partition types used by DOS, OS/2, and Linux.'
  merge: -1
  img_proc: true
- pgno: 41
  md: 'Even if you will be installing Red Hat Linux on your own hard disk, or on a
    computer which contains no other operating system, you''ll still need to create
    partitions for Red Hat Linux to use. In this case it''s pretty easy, as there
    are no other partitions on the hard disk to worry about.


    On the other hand, you might wish to install Red Hat Linux on a disk which already
    contains software or data from a different operating system. Things can get a
    little trickier in this situation, since a mistake can destroy your partitions,
    not to mention the data they contain!


    During the installation process, you''ll be given the chance to create partitions
    for Red Hat Linux. At this point, your main concern is making sure you have sufficient
    disk space available to create those partitions. Let''s review the different ways
    to free up space for Red Hat Linux partitions.


    # # 2.4.1 Repartitioning Strategies


    There are three possible scenarios you may face when attempting to repartition
    your hard disk:


    +   * Unpartitioned free space is available.

    * An unused partition is available.

    * Free space in an actively used partition is available.


    Let''s look at each scenario in order.


    # # Using Unpartitioned Free Space


    In this situation, the partitions defined do not span the entire hard disk, leaving
    unallocated space that is not part of any defined partition. If you think about
    it, an unused hard disk also falls into this category; the only difference is
    that all the space is not part of any defined partition.


    In this case, you can simply create the necessary partitions from the unused space.'
  merge: -1
  img_proc: true
- pgno: 42
  md: '# 2.4 Disk Partitions


    # Using An Unused Partition


    Last year you replaced that tiny 105MB hard drive on your Windows system with
    a 2GB monster. You partitioned it into two equal parts, figuring that you''d use
    the C: "drive" (really the drive''s first partition) for Windows, and the D: "drive"
    (the drive''s second partition) for your collection of freeware programs downloaded
    from the Internet. Well, you''d been so to using C: that you never put anything
    of substance on D:


    If you find yourself in this situation, you can use the space allocated to the
    unused partition. You''ll need to delete the partition, and create the appropriate
    Linux partitions in its place.


    # Using Free Space From An Active Partition


    This is the most common situation. It is also, unfortunately, the hardest to deal
    with. The main problem is that you have enough free space, but it''s properly
    allocated to a partition that is in use. If you purchased a computer with pre-installed
    software, the hard disk likely has one massive partition holding the operating
    system and data.


    Aside from adding a new hard drive to your system, you have two choices:


    Destructive Repartitioning - Basically, you delete the single large partition,
    and create several smaller ones. As you might imagine, any data you had in that
    partition is destroyed. This means that making a complete backup is necessary.
    For your own own, make two backups, and try to read data from your backup before
    you delete the partition. Note also that if there was an operating system of some
    type installed on that partition, it will need to be reinstalled as well.


    After creating a smaller partition for your existing software, you can reinstall
    any software, restore your data, and continue with your Red Hat Linux installation.


    Non-Destructive Repartitioning - Here, you run a program that does the seemingly
    impossible; it makes a big partition smaller without losing any of the files stored
    in that partition. Many people have found this method to be reliable and trouble-free;
    however, we recommend that you make backups of the partition before being resized,
    just in case.'
  merge: -1
  img_proc: true
- pgno: 43
  md: '28


    Before You Begin


    |INTEL

    What software should you use to perform this feat? You can use the fips utility
    to resize FAT (File Allocation Table) partitions. It''s included on the Red Hat
    Linux/Intel CD-ROM in theutils directory. Before using it, however, we highly
    recommend reading the fips documentation, located in the fips subdirectory.

    nPlease Note: At the present time, the fips utility cannot resize the FAT32-style
    partitions found on many newer computers. If your computer has a FAT32 partition,
    you can either use destructive repartitioning, or purchase commercial disk management
    software capable of shrinking FAT32 partitions.


    # 2.4.2 Disk Partitions and Other Operating Systems


    If your Red Hat partitions will be sharing a hard disk partitions with other operating
    systems, most of the time you''ll have no problems. However, there are certain
    combinations of Linux and other operating systems that require extra care. Information
    on creating partitions compatible with other operating systems is available in
    several HOWTOs and Mini-HOWTOs, available on the Red Hat Linux CD in the doc/HOWTO
    and doc/HOWTO/mini directories. In particular, the Mini-HOWTOs whose names start
    with Linux+ are quite helpful.


    |INTEL

    If Red Hat Linux/Intel will coexist on your machine with OS/2, you must create
    your disk partitions with the OS/2 partitioning software—otherwise, OS/2 may not
    recognize the disk partitions. During the installation, do not create any new
    partitions, but set the proper partition types for your Linux partitions using
    Linux fdisk.


    # 2.4.3 One Last Wrinkle: Using LILO


    |INTEL

    LILO (the Linux LoaDer) is the most commonly used method to boot Red Hat Linux
    on Intel-based systems. Being an operating system loader, LILO operates “outside”
    of any operating system, using only the Basic I/O System (BIOS) built into the
    computer hardware itself.'
  merge: -1
  img_proc: true
- pgno: 44
  md: '# 2.4 Disk Partitions


    | ALPHA |

    | Alpha owners may skip ahead to Section 2.4.4 on the next page. |


    | SPARC |

