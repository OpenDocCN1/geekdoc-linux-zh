    # 4.6.3 Package Dependencies


    Many software packages, in order to work correctly, depend on other software packages
    or libraries that must be installed on your system. For example, many of the graphical
    Red Hat system administration tools require the python and pythonlib packages.
    To make sure your system has all the packages it needs in order to be fully functional,
    Red Hat Linux checks package dependencies each time you install or remove packages.


    After you have finished selecting packages to install, the installation program
    checks the list of selected packages for dependencies. If any package requires
    another package which you have not selected to install, the program presents a
    list of these unresolved dependencies and gives you the opportunity to resolve
    them (see Figure 4.17 on page 71). If you simply press OK, the program will resolve
    them automatically by adding all required packages to the list of selected packages.'
