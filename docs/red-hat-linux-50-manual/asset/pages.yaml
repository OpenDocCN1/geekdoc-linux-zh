- pgno: 166
  md: '# 10


    # Glint


    Red Hat provides a graphical tool to aid in package installation and removal.
    It''s called glint (Graphical Linux Install Tool) and runs under the X Windows
    System. It allows easy installation, uninstallation, upgrading, querying, and
    verification of packages. The interface is similar to the one found in many popular
    file managers and is simple to use.


    Operations are performed in glint by selecting the packages to operate on and
    then selecting the operation to perform via pushbuttons. Installing a package
    places all of the components of that package on your system. Uninstalling one
    removes all traces of the package except for configuration files you have modified.
    Upgrading a package installs the newly available version and uninstalls all other
    versions that were previously installed. This allows quick upgrading to the latest
    releases of packages.


    The query operation lets you examine the details of both installed or available
    package. You can view the description of the package, where and when it was built,
    the files in the package, and other attributes. All of the configuration and documentation
    components of each package are clearly marked as such to reduce the time you spend
    looking for them.


    Using glint to perform all of these operations is the same as using rpm to do
    them'
  merge: -1
  img_proc: true
- pgno: 167
  md: 'from the command line. However, the graphical nature of glint often makes these
    operations easier to perform.


    The normal way to handle glint is to display the available packages and files,
    select the ones you want to operate on, and then press a button or choose a menu
    item that performs the operation. For instance, you can install several packages
    with a few clicks.


    # # 10.1 Starting glint


    To start glint, simply run glint & from any X terminal window. That will bring
    up a window that looks like the one in figure 10.1. Any user can use glint to
    query and verify packages, but if you need to install, uninstall, or upgrade packages
    be to run glint as root.


    There are two main parts to the glint interface. The first, on the left, allows
    you to browse and select the packages installed on your system. The right side
    contains buttons that manipulate the selected packages.


    ![](img/8b3a1d8c6536531eebe04fe36481b5a6_167_0.png)


    Figure 10.1: Main Glint Window


    # # 10.2 The Package Display


    Each folder icon in glint represents a group of packages. Each group can contain
    other groups, which allows for flexible locations of packages. Groups are allowed
    to'
  merge: -1
  img_proc: true
- pgno: 168
  md: '# 10.2 The Package Display


    place packages that perform similar functions in similar locations. For example,
    Red Hat includes many application programs such as editors and spreadsheets. All
    of the text based ones appear in the “Applications” group. Inside of that group,
    there is another grouping for all of the editors that are shipped.


    By convention, groups are written in the same as UNIX paths. The top most group
    is written first, and subsequent groups follow with a slash separating the group
    names. This means that an X-based drawing program appears in the XII/Applications/Graphics
    group.


    To view the packages and subgroups within a group, double click the left mouse
    button on a folder icon. The window changes to show what that package contains.
    The top line of the package display shows what you''re currently looking in, as
    well as the groups leading to the current one. To return to the previous group
    you were looking at, double click the “Back” folder, which is always in the upper
    left corner of the folder area (though it often gets scrolled away).


    If you''d like to examine a subgroup in a new window, double click the middle
    mouse button on its folder. If your mouse has only two buttons, click both. This
    will create a new window with that group in.


    # 10.2.1 Context Sensitive Menus


    Pressing the right mouse button on any icon in the package window brings up a
    small, context sensitive menu. The exact items it contains depends on exactly
    where you press it. They all contain options to select or deselect the item, and
    many let you install, uninstall, query, upgrade, or verify the item you clicked
    on. There''s more information on how to do these things later.


    To choose an item from a context sensitive menu, press and hold the right mouse
    button on an icon. While still holding the right button down, move the mouse pointer
    over the item you''d like to select (which will then become highlighted). Release
    the right mouse button to select that item and make the menu disappear.


    # 10.2.2 Selecting Packages


    To select a single package, click the left mouse button on. You''ll notice a thin
    border appear around the package''s icon (as shown in figure 10.2) which shows
    that it''s currently selected. To unselect it, click the left mouse button on
    and'
  merge: -1
  img_proc: true
- pgno: 169
  md: 'the border will disappear. The number of packages currently selected is always
    displayed at the bottom of the window. A group''s folder icon displays the number
    of packages inside that group have been selected, or All if all of them have been.


    ![](img/8b3a1d8c6536531eebe04fe36481b5a6_169_0.png)


    Figure 10.2: Selecting Packages in Glint


    The context menu for a package also allows easy selection and unselection. Using
    the select and unselect options on a package''s icon or unselects that package,
    while those options on a group''s folder icon select and unselect all of the packages
    in that group. Using these menu options makes selecting groups of packages much
    quicker than selecting each package individually.


    # 10.2.3 Viewing Available Packages


    To see what packages are available for you to install, choose the Available push-button
    from any glint window. After a few moments, a new window like the one shown in
    10.3, will appear. The differences in the title and buttons indicate that this
    window is listing packages you may install. Navigating through these packages
    and selecting them is the same as in the other glint windows.


    If you get an error message from glint saying that it can''t find any RPMs, see
    the section below on Configuration.'
  merge: -1
  img_proc: true
- pgno: 170
  md: '# 10.3 Configuration


    ![](img/8b3a1d8c6536531eebe04fe36481b5a6_170_0.png)


    Figure 10.3: Available Window


    # 10.3 Configuration


    The only configuration information glint needs the path to new RPMs. When you''re
    using your Red Hat Linux CD-ROM, this will probably be /mnt/cdrom/RedHat/RPMs,
    which is the default path for glint. If you download new RPMs from the Internet
    or install RPMs via a NFS mounted CD-ROM this path will probably be for you.


    ![](img/8b3a1d8c6536531eebe04fe36481b5a6_170_1.png)


    Figure 10.4: Configuration Window


    To change this path, first be to close all of the windows listing available packages
    you may have open. Then choose the Configuration option from one of the remaining
    windows. This will open a dialog box like the one shown in 10.4. Here you can
    use the full path to the RPMs you''d like to look at. Choosing the Save button
    will save this path, making it the default for future glint sessions.


    After changing this path and closing the dialog box, you can use the Available'
  merge: -1
  img_proc: true
- pgno: 171
  md: 'button to view the packages available in the new location.


    # 10.4 Package Manipulation


    # 10.4.1 Querying Packages


    The easiest way to query a single package or group is to use the query option
    of the icon''s sensitive menu. If you want to query a more diverse set of packages,
    select them all and use the Query button in one of the windows.


    Using either of these methods creates a window like the one shown in figure 10.5.
    If you choose only one package, it will look a bit different, so some of this
    won''t apply.


    ![](img/8b3a1d8c6536531eebe04fe36481b5a6_171_0.png)


    Figure 10.5: Query Window


    On the very left of the window is a list of the packages that have been queried.
    Selecting one of them will change the information in the rest of the window. You
    may step through them in order by using the Next and Previous buttons on the right
    side of the window.


    The name, version, and release of the current package are in the top middle of
    the query window. Immediately below this is the description of the package, which
    can be large. A scroll bar is there to let you read the whole thing.'
  merge: -1
  img_proc: true
