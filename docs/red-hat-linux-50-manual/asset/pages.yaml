- pgno: 50
  md: '# 3


    # # Starting the Installation


    This chapter explains how to start the Red Hat Linux installation process. We''ll
    cover the following areas in this chapter:


    +   * Getting familiar with the installation program’s user interface.

    * Starting the installation program.

    * Selecting an installation method.


    By the end of this chapter, the installation program will be running on your system,
    and the appropriate installation method will have been selected.


    # ## 3.1 The Installation Program User Interface


    The Red Hat Linux installation program uses a screen-based interface that includes
    most of the on-screen “widgets” commonly found on graphical user interfaces. You’ll
    see:'
  merge: -1
  img_proc: true
- pgno: 51
  md: '+   * Windows


    +   * Buttons


    +   * Text regions (with or without scrollbars)


    +   * Check boxes


    +   * Text input boxes


    We will point out these features as we encounter them in the installation. Note
    that, because the installation program must run on a wide variety of computers,
    the user interface is character-based. In addition, some computers may not have
    a mouse, so the installation program uses keystrokes for getting around.


    # ### 3.1.1 Using the Keyboard to Navigate


    You can navigate around the installation dialogues using a simple set of keystrokes.
    In most dialog boxes there is a cursor or highlight which you can move using the
    arrow keys `kbd`. By using `Tab`, and `Alt+Tab`, you can cycle forward or backwards
    each widget on the screen. In addition, summaries of available function keys are
    presented at the bottom of screen.


    To “press” a button, position the highlight over the button using `Tab`, for instance)
    and press `Space` or `Enter`. To select an item from a list of items, move the
    highlight to the item you wish to select and press the check box and press `Space`
    to select an item. To deselect, press `Space` a second time.


    Pressing `F12` accepts the current values and proceeds to the next dialog; it
    is equivalent to pressing the `OK` button.


    **Note:** Unlike a dialog box is waiting for your input, do not press any keys
    during the installation process – it may result in unpredictable behavior.


    # ### 3.1.2 A Note About Virtual Consoles


    There is more to the Red Hat Linux installation program than the dialog boxes
    it presents as it guides you through the installation process. In fact, the installation
    program makes several different kinds of diagnostic messages available to'
  merge: -1
  img_proc: true
- pgno: 52
  md: '# 3.2 Starting the Installation Program


    you, in addition to giving you a way to enter commands from a shell prompt. It
    presents this information on five virtual consoles which you can switch between
    using a single keystroke. These virtual consoles can be very helpful if you encounter
    a problem while installing Red Hat Linux. Messages displayed on the install or
    system consoles can help pinpoint the problem. Please see Figure 3.1 for listing
    of the virtual consoles, the keystrokes to switch to them, and their contents.


    | Console | Keystroke | Contents |

    |---|---|---|

    | 1 | AltF1 | installation dialog |

    | 2 | AltF2 | shell prompt |

    | 3 | AltF3 | install log (messages from install program) |

    | 4 | AltF4 | system log (messages from kernel, etc.) |

    | 5 | AltF5 | other messages |


    Figure 3.1: Virtual Console Information


    In general, there should be no reason to leave virtual console #1 unless you are
    attempting to diagnose installation problems. But if you are the curious type,
    free to look around.


    # 3.2 Starting the Installation Program


    Now it''s time to start installing Red Hat Linux. To start the installation, it
    is first necessary to boot the installation program. Before we start, please make
    sure you have all the resources you''ll need for the installation. If you''ve
    already read through Chapter 2 on page 15, and followed the instructions, you
    should be ready.


    | ALPHA |

    If you haven''t created your diskettes, please read Section D.4 on page 214, and
    create them now. After you''ve created the necessary diskettes, please read Section
    D.5 on page 215 for information on starting the installation. |


    | SPARC |

    If you haven''t prepared for the installation yet, please read Sections C.2 on
    page 199 through C.5. Determine how you will boot the installation program, and
    issue the boot command that will start the installation. |'
