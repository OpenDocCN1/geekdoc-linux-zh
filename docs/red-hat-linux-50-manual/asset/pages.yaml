  md: '# SLIP Interface


    In order to configure a SLIP interface you must first supply a phone number, login
    name, and password. This will supply the initial parameters for the chat script
    needed to establish a SLIP connection. When you choose Done, a dialog titled Edit
    SLIP Interface appears that enables you to further customize the hardware, communication
    and networking parameters for your SLIP interface.


    # PLIP Interface


    To add a PLIP interface to your system you only have to supply the IP address,
    the remote IP address, and the Netmask. You can also select if you want to activate
    the interface at boot time.


    # Ethernet, Arcenet, Token Ring and Pocket Adaptor Interfaces


    If you are adding an ethernet, arcnet, token ring or pocket adapter to your computer
    you will need to supply the following information:


    +   * **Device:** This is determined by netconfig based on the devices already
    configured.

    * **IP Address:** Enter an IP address for your network device.

    * **Netmask:** Enter the network mask for your network device. The network and
    broadcast addresses are calculated automatically based on the IP address and netmask
    you enter.

    * **Activate at boot time:** If you want the device to be configured automatically
    when your machine boots select this by clicking on the box.

    * **Allow any user to (de)activate interface:** Check if you want any user to
    be able to activate or deactivate the interface.

    * **Interface configuration protocol:** If you have a BOOTP or DHCP server on
    your network and would like to use it to configure the interface, choose the appropriate
    option; otherwise, choose **none.**'
  merge: -1
  img_proc: true
- pgno: 162
  md: '# 9.5 Time and Date


    After providing the configuration information for your new device, click Done.
    The device should appear in your Interfaces list as an inactive device. (The active
    column should have a label of no. To activate the new device, first select it
    with a mouse click and then choose on the Activate button. If it does not come
    up properly; you may need to reconfigure it by choosing Edit.


    # 9.4.4 Managing Routes


    In the Routes management screen you have the ability to add, edit, remove static
    networking routes. Adding or editing an entry involves identical actions, just
    like the Hosts panel. An edit dialog box will appear, simply type the new information
    and click Done when you are finished. See figure 9.16 for an example.


    ![](img/8b3a1d8c6536531eebe04fe36481b5a6_162_0.png)


    # 9.5 Time and Date


    The time machine allows you to change the time and date by clicking on the appropriate
    part of the time and date display and clicking on the arrows to change the value.'
  merge: -1
  img_proc: true
- pgno: 163
  md: 'The system clock is not changed until you click on the Set System Clock button.

    Click on Reset Time to set the time machine back to to that of the system.


    **Please Note:** Changing the time can seriously confuse programs that depend
    on the normal progression of time, and could possibly cause problems. Try to quit
    as many applications and processes as possible before changing the time or date.


    # # 9.6 Kernel Daemon Configuration


    As discussed in Chapter 6, Red Hat Linux includes kerneld, the Kernel Daemon,
    which automatically loads some software and hardware into memory as it is needed,
    and unloads it when it is no longer being used.


    The tool shown in Figure 9.17 manages the configuration file for kerneld. While
    kerneld can load such things, as filesystems, without explicit configuration,
    it needs to be told what hardware support to load when it is presented with a
    generic hardware request.


    ![](img/8b3a1d8c6536531eebe04fe36481b5a6_163_0.png)


    For instance, when the kernel wants to load support for ethernet, kerneld needs
    to know which ethernet card you have, and if your ethernet card requires special
    configuration, it needs to know about that, too.'
  merge: -1
