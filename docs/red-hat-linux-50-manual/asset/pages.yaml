- pgno: 21
  md: '# 1.3 System Administration-Related Enhancements


    Red Hat Linux 5.0 has these features for system administrators:


    +   * glibc-based system

    * Improved shadow utilities

    * New initscript utility

    * New backup script

    * Improved network configuration utility

    * New group for diskette access

    * Anti-spam changes to sendmail


    # 1.3.1 Glibc-Based System


    Red Hat Linux 5.0 is now based on a newer library known as glibc. There are a
    number of advantages to glibc:


    +   1. As an actively maintained library, glibc is more stable.

    2. Glibc has been found to be faster by many people.


    ![](img/8b3a1d8c6536531eebe04fe36481b5a6_21_0.png)'
  merge: -1
  img_proc: true
- pgno: 22
  md: '# 1.3 System Administration-Related Enhancements


    +   3. The same library can now be used on all Red Hat Linux platforms.


    +   4. Glibc supports threads and internationalization.


    # 1.3.2 Improved Shadow Utilities


    Support for shadow passwords has been enhanced significantly for Red Hat Linux
    5.0. The shadow-utils package contains a number of utilities that support:


    +   - Conversion from normal to shadowed passwords and back (pwconv, pwunconv).


    +   - Verification of the password, group, and associated shadow files (pwgrck).


    +   - Industry-standard methods of adding, deleting, and modifying user accounts
    (useradd, usermod, and userdel).


    +   - Industry-standard methods of adding, deleting, and modifying user groups
    (groupadd, groupmod, and groupdel).


    +   - Industry-standard method of administering the /etc/group file (gpasswd).


    **Please Note:** There are a few additional points of interest concerning these
    utilities:


    +   - The utilities will work properly whether shadowing is enabled or not.


    +   - The utilities have been slightly modified to support Red Hat Software''s
    private group scheme. For a description of the modifications, please see the useradd
    man page. For more information on user private groups, please turn to Section
    11.3 on page 171.


    +   - The adduser script has been replaced with a symlink to /usr/sbin/useradd.'
  merge: -1
  img_proc: true
- pgno: 23
  md: '# 1.3.3 New initscript Utility


    The chconfig utility provides a simple command-line tool for maintaining the /etc/rc.d
    directory hierarchy. It relieves system administrators from having to directly
    manipulate the numerous symlinks in /etc/rc.d.


    Please see the chconfig man page for more information.


    # 1.3.4 New Backup Script


    As the man page states, "rhbackup is a program useful for simple local and remote-system
    backups. It uses rsh and tar as its archiving mechanism.


    For more information on rhbackup, please consult the rhbackup man page.


    # 1.3.5 Improved network configuration utility


    The network configuration utility netconfig has been enhanced. Now it has the
    ability to create clone network interfaces. Consider the following example:


    In the past, this situation would have required a fair bit of effort to accommodate.
    With clone interfaces, it''s only necessary to create two clones of the original
    Ethernet interface, and give them the appropriate information. This is done by
    selecting the interface to clone and pressing the clone button. After giving the
    clone device name (such as "home"), you will see a window similar to the one in
    Figure 1.4 on the next page.


    As you can see, you can specify an IP address and netmask (the network and broadcast
    addresses are calculated automatically), or use boot or dhcp to configure the
    interface. In addition, the clone device may be configured to start automatically
    at boot time, and can be set so that any user may bring the interface up or down.'
  merge: -1
  img_proc: true
- pgno: 24
  md: '# 1.3 System Administration-Related Enhancements


    ![](img/8b3a1d8c6536531eebe04fe36481b5a6_24_0.png)


    Figure 1.4: Clone Interface Setup


    # 1.3.6 New Diskette Group


    Red Hat Linux 5.0 also includes a new group that system administrators can use
    to give certain users access to the system''s diskette drive. This can be done
    explicitly, or via the `pam_env` module.


    # 1.3.7 Anti-spam changes to sendmail


    Sendmail version 8.8.7 is included with Red Hat Linux 5.0. Also included are rules
    that decay the distribution of unsolicited commercial e-mail (also known as “spam”).
    These rulesets were created by Claus Åmann. Although some information is included
    below, please consult Claus’ web page documenting his changes at:


    http://www.informatik.uni-kiel.de/%7Eca/email/check.html


    **Please Note:** In this release of Red Hat Linux, sendmail does not relay by
    default. Because of this, if your Red Hat Linux system must act as a relay, please
    review the following information.


    # Overview


    This release has been configured to take advantage of the latest changes to sendmail
    to prevent spam by the addition of new sendmail rulesets.'
  merge: -1
  img_proc: true
- pgno: 25
  md: 'The following rulesets have been added to the 598 (local additions) section
    of /etc/sendmail.cf:


    +   * junk

    * check_mail

    * check_rcpt

    * remove_local

    * junkIP

    * check_relay


    The actions of these rulesets are controlled by the following files in the /etc/mail
    directory:


    +   * ip_allow

    * name_allow

    * relay_allow

    * deny


    Let''s take a look at each of these files.


    ip_allow


    This is a flat text file that contains the addresses or networks of hosts that
    are allowed to use this host as a relay.


    The format for this file is:


    ```

    hhh.hhh.hhh.hhh

    ccc.ccc.ccc

    bbb.bbb

    aaa

    ```


    These lines represent a host address, a class C network, a class B network and
    a class A network, respectively.'
  merge: -1
  img_proc: true
- pgno: 26
  md: '# 1.3 System Administration-Related Enhancements


    name_allow


    This is a flat text file that contains the hostnames or domain names of hosts
    that are allowed to use this host as a relay.


    The format for this file is:


    ```

    hostname.domain.com

    domain.com

    ```


    Please Note: Hosts not ''included'' in either ip_allow or name_allow will be given
    an error message of "551: xxx, we do not relay" where xxx is the RCPT address
    that was given.


    relay_allow


    This is a flat text file that contains the hostnames, domain names, host addresses
    or networks for which this machine will relay to:


    The format for this file is:


    ```

    hostname.domain.com

    domain.com

    hhh.hhh.hhh.hhh

    ccc.ccc.ccc

    bbb.bbb

    aaa

    ```


    The formats in this file are the same as for the ip_allow and name_allow files
    described earlier.


    Please Note: Since ip_allow, name_allow and relay_allow are plain text files,
    any changes to them will necessitate restarting sendmail. This can be accomplished
    by executing the followowin commands:


    ```

    /etc/rc.d/init.d/sendmail stop; /etc/rc.d/init.d/sendmail start.

    ```'
  merge: -1
  img_proc: true
