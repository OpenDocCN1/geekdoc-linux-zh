  md: '# 5.2.1 Configuring the Metro-X Server


    If you are installing from an Official Red Hat Linux/Intel CD, you may install
    one copy of MetroLink''s Metro-X server, a high-quality X server for Linux. Please
    use the MetroLink license (paper copy) accompanying your Red Hat Linux CD for
    license information. If you choose to use Metro-X, the install program launches
    the Metro-X configuration utility config; please see Section 6.3 on page 96 for
    more information on how to use `config`.


    # 5.2.2 Configuring an XFree86 Server


    If use XFree86, the installation program launches the Xfigurator utility, which
    is described in detail in Section 6.2 on page 94.


    Xfigurator first probes your system in an attempt to determine what type of video
    card you have. Failing that, Xfigurator will present a list of video cards. Select
    your video card from the list and press Enter. If your video card does not appear
    on the list, XFree86 may not support it. However, if you have technical knowledge
    about your card, you may choose Unlisted Card and attempt to configure it anyway.


    Once you have selected video card


    **Please Note:** It is not recommended to select a monitor "similar" to your monitor
    unless you are certain that the monitor you are selecting does not exceed the
    capabilities of your monitor. If you do so, it is possible you may overload your
    monitor and damage or destroy it.


    Next, Xfigurator prompts you for the amount of video memory installed on your
    video card. If you are not sure, please consult the documentation accompanying
    your video card. It will not damage your video card by choosing more memory than
    is available, but the XFree86 server may not start correctly if you do.


    If the video card you selected might have a video clock, Xfigurator presents a
    list of clockchips. The recommended choice is No Clockclock Setting.'
