- pgno: 20
  md: '# 1.2 User-Mode Tools


    # 1.2.3 Filesystem Mount Tool


    This program makes it easy to mount and unmount filesystems. It will display Mount
    and Format buttons for each filesystem in /etc/fstab that has been configured
    with the user option. In Figure 1.2, the CD-ROM drive has been mounted (and can
    be unmounted with a click of the Unmount button). The Format button is active
    for all writable, unmounted media, and will format the media when pressed.


    ![](img/8b3a1d8c6536531eebe04fe36481b5a6_20_0.png)


    To use this tool, run /usr/bin/usermount.


    # 1.2.4 Network Device Tool


    It''s easy to start and stop network interfaces when using this tool. Every network
    interface available to users is displayed, along with a colored button representing
    its status (see Figure 1.3 on the next page). Clicking on the interface''s button
    toggles that interface (i.e, turns it on when it is off, and vice versa). Clicking
    on the status info forces an update on that interface''s status (though the status
    will also update automatically). When done, click Exit to exit.


    To use this tool, run /usr/bin/usernet.'
