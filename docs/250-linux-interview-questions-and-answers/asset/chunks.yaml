    ### 问题：Linux 中哪种服务负责将域名解析为 IP 地址？


    - 选项 1：`DNS`（域名系统）

    - 选项 2：`DHCP`（动态主机配置协议）

    - 选项 3：`SNMP`（简单网络管理协议）

    - 选项 4：`SMTP`（简单邮件传输协议）


    **正确答案：** 1


    **解释：** Linux 中负责将域名解析为 IP 地址的服务是 `DNS`（域名系统）。`DNS` 节点维护着一个域名到 IP 地址的映射数据库，并帮助将人类可读的域名转换为数字型的
    IP 地址，从而实现网络通信。


    ---


    ### 问题：哪个守护进程负责网络接口配置和网络之间的自动切换？


    - 选项 1：`NetworkManager`

    - 选项 2：`SystemD`

    - 选项 3：`ifconfig`

    - 选项 4：`Apache`


    **正确答案：** 1


    **解释：** `NetworkManager` 负责 Linux 中的网络接口配置和网络之间的自动切换。它简化了网络设置和管理，使用户能够无缝地连接到不同的网络。


    ---


    ### 问题：`netstat` 命令的主要目的是什么？


    - 选项 1：显示网络统计和连接

    - 选项 2：列出所有已安装包

    - 选项 3：检查系统资源使用情况

    - 选项 4：创建新的网络接口


    **正确答案：** 1


    **解释：** `netstat` 命令的主要目的是显示网络统计和连接情况。它提供了有关网络接口、路由表和活动网络连接的价值信息。它是网络故障排除和监控的关键工具。


    ---


    ### 问题：Linux 中的哪个系统允许对服务守护进程进行管理和监控？


    - 选项 1：`systemd`

    - 选项 2：`SysV init`

    - 选项 3：`GRUB`

    - 选项 4：`iptables`


    **正确答案：** 1


    **解释：** `systemd` 是 Linux 中允许对服务守护进程进行管理和监控的系统。它是一个现代初始化系统和服务管理器，取代了传统的 `SysV
    init` 系统。`systemd`提供了对服务和系统初始化的增强控制和监控。


    ---


    ### 问题：哪一个 Linux 命令可以监控实时网络接口统计？


    - 选项 1：`ifconfig`

    - 选项 2：`netstat`

    - 选项 3：`iptraf`

    - 选项 4：`nmap`


    **正确答案：** 3


    **解释：** 在 Linux 中监控实时网络接口统计的正确命令是 `iptraf`。它提供了有关网络流量的详细信息，包括每个接口的流量、协议和端口。`ifconfig`
    和 `netstat` 用于网络配置和监控，但它们不提供实时统计数据。`nmap` 是一个网络扫描工具。


    ---


    ### 问题：Linux 中哪个守护进程负责记录系统消息？


    - 选项 1：`syslogd`

    - 选项 2：`klogd`

    - 选项 3：`systemd`

    - 选项 4：`auditd`


    **正确答案：** 1


    **解释：** 在 Linux 中，`syslogd` 守护进程负责记录系统消息。它收集并管理由各种系统组件和服务生成的日志消息。`klogd` 用于内核日志消息，`systemd`
    是初始化系统，而 `auditd` 负责审计。


    ---


    ### 问题：在网络上下文中，缩写 "NAT" 代表什么？


    - 选项 1：`Network Address Translation`（网络地址转换）

    - 选项 2：`Network Access Token`（网络访问令牌）

    - 选项 3：`Network Analysis Tool`（网络分析工具）

    - 选项 4：`Network Authentication Protocol`（网络认证协议）


    **正确答案：** 1


    **解释：** 在网络上下文中，“NAT” 代表 Network Address Translation（网络地址转换）。`NAT` 是一种在传输过程中修改包头中的网络地址的技术。它通常用于允许局域网上的多个设备共享单个公网
    IP 地址访问互联网。


    ---


    ### 问题：Linux 中的 _________ 守护进程负责为局域网上的设备分配 IP 地址。


    - 选项 1：`DHCP`

    - 选项 2：`DNS`

    - 选项 3：`SSH`

    - 选项 4：`HTTP`


    **正确答案：** 1


    **解释：** Linux 中的 `DHCP`（动态主机配置协议）守护进程负责为局域网上的设备分配 IP 地址。它自动化了设备网络设置的过程，确保它们接收必要的
    IP 地址、子网掩码、网关和其他参数。


    ---


    ### 问题：在 Linux 中，设置为在失败后自动重启的服务被称为“_________”。


    - 选项 1：`Resilient`（恢复性）

    - 选项 2：`Autorestart`（自动重启）

    - 选项 3：`Persistent`（持久性）

    - 选项 4：`Robust`（健壮性）


    **正确答案：** 2


    **解释：** 在 Linux 中，设置为失败后自动重启的服务被称为“Autorestart”（自动重启）。此功能确保关键服务能够从故障中恢复并继续运行，增强了系统的可靠性和可用性。


    ---


    ### 问题：`systemctl` 命令主要用于控制 _________ 系统和服务管理器。


    - 选项 1：`Systemd`

    - 选项 2：`Init`

    - 选项 3：`Upstart`

    - 选项 4：`SysV`


    **正确答案：** 1


    **解释：** `systemctl` 命令主要用于控制 `systemd` 系统和服务管理器。`systemd` 是大多数现代 Linux 发行版的初始化系统，负责管理系统进程和服务，是系统管理员的必备工具。


    ---


    ### 问题：Linux 中的 _________ 命令可以操作或显示 IP 路由表。


    - 选项 1：`route`

    - 选项 2：`ifconfig`

    - 选项 3：`iptables`

    - 选项 4：`ip`


    **正确答案：** 4


    **解释：** Linux 中的 `ip` 命令可以操作或显示 IP 路由表。它是一个强大且多功能的工具，用于配置网络接口、路由、隧道等。与旧的 `route`
    和 `ifconfig` 命令相比，`ip` 被认为更加全面。


