    Option 4: known_keys


    Correct Response: 1


    Explanation: The file on an SSH client that contains the public keys of remote
    hosts it has connected to is known_hosts. This file maintains a record of the
    public keys of remote servers or hosts you have previously connected to. It is
    used for verifying the authenticity of remote hosts during future SSH connections.


    Question: To restrict users from logging in via SSH, you would modify the ________
    file.


    Option 1: /etc/ssh/sshd_config


    Option 2: /etc/ssh/ssh_config


    Option 3: /etc/sshd/ssh_config


    Option 4: /etc/ssh/sshd


    Correct Response: 1


    Explanation: To restrict users from logging in via SSH, you would modify the /etc/ssh/sshd_config
    file. This file contains configuration options for the SSH server, and you can
    specify access restrictions and settings here.


    Question: The __________ command in Linux allows mounting of NFS shared directories.


    Option 1: mount


    Option 2: nfs


    Option 3: fstab


    Option 4: showmount


    Correct Response: 1


    Explanation: The mount command in Linux allows mounting of NFS (Network File System)
    shared directories. You can use this command to make remote file systems accessible
    on your local system through NFS.


    Question: The _________ utility in Samba is used to manage user accounts and passwords.


    Option 1: smbpasswd


    Option 2: smbconf


    Option 3: smbuser


    Option 4: smbcontrol


    Correct Response: 1


    Explanation: The smbpasswd utility in Samba is used to manage user accounts and
    passwords. Samba is a software suite for integrating Windows and Linux systems,
    and smbpasswd allows you to change Samba passwords for user accounts.


    Question: You are setting up a new server and need to ensure that only specific
    users can SSH into the machine. Which configuration file would you modify to achieve
    this?


    Option 1: /etc/ssh/sshd_config


    Option 2: /etc/hosts.allow


    Option 3: /etc/ssh/authorized_keys


    Option 4: /etc/passwd


    Correct Response: 1


    Explanation: To restrict SSH access to specific users, you would modify the /etc/ssh/sshd_config
    file. This file contains the configuration options for the SSH server, including
    settings related to user access, authentication, and permissions.


    Question: A colleague is trying to access a directory shared via NFS from a Linux
    machine but is facing permission issues. Which file on the server would you check
    to verify the permissions and access for the shared directory?


    Option 1: /etc/exports


    Option 2: /etc/fstab


    Option 3: /etc/nfsd.conf


    Option 4: /etc/permissions


    Correct Response: 1


    Explanation: To verify permissions and access for a directory shared via NFS,
    you would check the /etc/exports file on the NFS server. This file specifies the
    directories that are shared and the permissions granted to clients.


    Question: You''ve been tasked with setting up a Linux server that can share files
    with Windows clients in the network, ensuring they can access it seamlessly. Which
    software would you primarily consider installing?


    Option 1: Samba


    Option 2: NFS


    Option 3: SSH


    Option 4: FTP


    Correct Response: 1


    Explanation: To enable seamless file sharing with Windows clients, you would primarily
    consider installing Samba. Samba is a software suite that allows interoperability
    between Linux/Unix servers and Windows-based clients. It provides support for
    the SMB/CIFS protocol used in Windows networking.


    Question: Which virtualization solution is directly supported in the Linux kernel?


    Option 1: KVM


    Option 2: VirtualBox


    Option 3: VMware


    Option 4: Xen


    Correct Response: 1


    Explanation: KVM, or Kernel-based Virtual Machine, is directly supported in the
    Linux kernel. It''s a full virtualization solution that leverages hardware virtualization
    extensions to provide excellent performance for virtual machines on Linux.


    Question: Docker primarily deals with which kind of virtualization?


    Option 1: Containerization


    Option 2: Hypervisor-based virtualization


    Option 3: Paravirtualization


    Option 4: Emulation


    Correct Response: 1


    Explanation: Docker primarily deals with containerization, which is a lightweight
    form of virtualization. Containers share the host OS kernel, making them efficient
    and suitable for packaging and running applications.


    Question: What is the primary purpose of QEMU in Linux virtualization?


    Option 1: Emulation and virtualization


    Option 2: Containerization


    Option 3: Paravirtualization


    Option 4: Hypervisor-based virtualization


    Correct Response: 1


    Explanation: QEMU''s primary purpose in Linux virtualization is emulation and
    virtualization. It can emulate various hardware components and architectures,
    making it a versatile tool for running virtual machines and testing software on
    different platforms.


    Question: Which technology allows for OS-level virtualization, resulting in multiple
    isolated user-space instances?


    Option 1: Containers


    Option 2: Virtual Machines


    Option 3: Hypervisor


    Option 4: KVM


    Correct Response: 1


    Explanation: Containers enable OS-level virtualization, allowing multiple isolated
    user-space instances to run on the same kernel. They share the host OS''s kernel
    but have separate user spaces, making them lightweight and efficient. Docker and
    Kubernetes are popular container technologies.


    Question: What role does the virt-manager tool play in Linux virtualization?


    Option 1: Graphical tool for managing virtual machines


    Option 2: Command-line tool for system administration


    Option 3: Kernel module for virtualization


    Option 4: Web server for virtual machine deployment


    Correct Response: 1


    Explanation: virt-manager is a graphical tool for managing virtual machines in
    Linux. It provides a user-friendly interface to create, configure, and manage
    virtual machines using various virtualization technologies, including KVM and
    QEMU.


    Question: Which component in Docker acts as a lightweight, stand-alone, executable
    software package that includes everything needed to run a piece of software?


    Option 1: Docker image


    Option 2: Docker container


    Option 3: Dockerfile


    Option 4: Docker daemon


    Correct Response: 1


    Explanation: A Docker image is a lightweight, stand-alone, executable software
    package that includes everything needed to run a piece of software, including
    code, runtime, system tools, and libraries. Docker containers are instantiated
    from these images.


    Question: For performance enhancement, QEMU often pairs with which Linux kernel
    module?


    Option 1: KVM


    Option 2: SELinux


    Option 3: LXC


    Option 4: XFS


    Correct Response: 1


    Explanation: For performance enhancement, QEMU often pairs with the Linux Kernel-based
    Virtual Machine (KVM) module. KVM is a kernel module that allows QEMU to leverage
    hardware virtualization extensions, resulting in better performance for virtual
    machines.


    Question: Which tool is used for orchestrating multiple Docker containers?


    Option 1: Docker Compose'
