    ### Question: Which daemon in Linux is responsible for logging system messages?


    - Option 1: `syslogd`

    - Option 2: `klogd`

    - Option 3: `systemd`

    - Option 4: `auditd`


    **Correct Response:** 1


    **Explanation:** In Linux, the `syslogd` daemon is responsible for logging system
    messages. It collects and manages log messages generated by various system components
    and services. `klogd` is used for kernel log messages, `systemd` is an init system,
    and `auditd` is responsible for auditing.


