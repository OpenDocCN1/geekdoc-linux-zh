    ### Question: Which command-line tool is used to view real-time system processes
    in Linux?


    - Option 1: `top`

    - Option 2: `ls`

    - Option 3: `cat`

    - Option 4: `ps`


    **Correct Response: 1**


    Explanation: The correct answer is "top." The `top` command is a real-time system
    monitoring tool in Linux that provides information about system processes, CPU
    usage, memory usage, and more. It allows users to monitor and manage running processes
    interactively.


    ### Question: Which command in Linux is used to format a new disk partition?


    - Option 1: `mkfs`

    - Option 2: `fdisk`

    - Option 3: `format`

    - Option 4: `mkpart`


    **Correct Response: 2**


    Explanation: The correct answer is "fdisk." The `fdisk` command is used to create
    and manage disk partitions on a Linux system. It does not format the partition
    directly but is used to create and manage the partition structure. Formatting
    is typically done using tools like `mkfs`.


    ### Question: What is the primary purpose of the `df` command in Linux?


    - Option 1: Display disk space usage

    - Option 2: List all files in a directory

    - Option 3: Execute a shell script

    - Option 4: Calculate file checksums


    **Correct Response: 1**


    Explanation: The primary purpose of the `df` command is to display disk space
    usage on a Linux system. It provides information about the disk space used and
    available on various mounted filesystems. This command is useful for monitoring
    disk space to prevent overflows.


    ### Question: Which column in the `top` command output represents the percentage
    of CPU usage for a process?


    - Option 1: `%CPU`

    - Option 2: `%MEM`

    - Option 3: `PID`

    - Option 4: `COMMAND`


    **Correct Response: 1**


    Explanation: In the `top` command output, the `%CPU` column represents the percentage
    of CPU usage for each process. This column shows the proportion of CPU resources
    that a process is currently utilizing.


    ### Question: When partitioning a disk, what is the primary partition limit on
    an MBR disk?


    - Option 1: 4

    - Option 2: 2

    - Option 3: 8

    - Option 4: 16


    **Correct Response: 1**


    Explanation: When partitioning a disk using the Master Boot Record (MBR) partitioning
    scheme, you can create up to 4 primary partitions. This is a limitation of the
    MBR scheme, and to create more partitions, you would need to use extended or logical
    partitions.


    ### Question: What command can be used to view the partition table of a disk in
    Linux?


    - Option 1: `fdisk`

    - Option 2: `lsblk`

    - Option 3: `diskutil`

    - Option 4: `parted`


    **Correct Response: 1**


    Explanation: The `fdisk` command is used to view the partition table of a disk
    in Linux. It provides a detailed view of the partitions on the disk, their sizes,
    types, and more.


    ### Question: Which command displays a visual representation of disk usage in
    Linux?


    - Option 1: `ncdu`

    - Option 2: `dd`

    - Option 3: `du`

    - Option 4: `df`


    **Correct Response: 1**


    Explanation: The correct command to display a visual representation of disk usage
    in Linux is `ncdu`. It stands for "NCurses Disk Usage" and provides a detailed
    and interactive view of disk usage, allowing users to navigate through directories
    and identify space-consuming files or folders. Unlike the other options, `ncdu`
    is specifically designed for this purpose.


    ### Question: What is the primary distinction between `top` and `htop` when monitoring
    system processes?


    - Option 1: `top` is a basic system monitoring tool, while `htop` is an advanced
    alternative.

    - Option 2: `top` displays real-time data, while `htop` provides more interactivity
    and customization.

    - Option 3: `top` is text-based, while `htop` offers a graphical interface.

    - Option 4: `top` shows memory usage, while `htop` focuses on CPU usage.


    **Correct Response: 2**


    Explanation: The primary distinction between `top` and `htop` is that `top` displays
    real-time data about system processes, whereas `htop` provides more interactivity
    and customization. `htop` allows users to sort and filter processes, view detailed
    information, and easily send signals to processes directly from the interface.
    While both tools show similar information, `htop` offers a more user-friendly
    and feature-rich experience for process monitoring.


    ### Question: In the context of disk partitions, what does `LVM` stand for?


    - Option 1: Logical Volume Manager

    - Option 2: Linux Virtual Machine

    - Option 3: Large Volume Memory

    - Option 4: Logical Virtual Machine


    **Correct Response: 1**


    Explanation: In the context of disk partitions, `LVM` stands for "Logical Volume
    Manager." `LVM` is a technology that allows for flexible management of disk space
    in Linux. It enables features like dynamic resizing, snapshots, and the creation
    of logical volumes that span multiple physical disks. `LVM` is a crucial tool
    for efficiently managing storage in complex Linux environments.


    ### Question: To monitor I/O statistics and disk activity in real-time, you would
    use the ________ command in Linux.


    - Option 1: `iostat`

    - Option 2: `top`

    - Option 3: `df`

    - Option 4: `du`


    **Correct Response: 1**


    Explanation: To monitor I/O statistics and disk activity in real-time in Linux,
    you would use the `iostat` command. It provides detailed information about input
    and output operations, helping you identify performance bottlenecks related to
    disk I/O.


    ### Question: The command used to resize the filesystem on a partition in Linux
    is _________.


    - Option 1: `resize2fs`

    - Option 2: `mv`

    - Option 3: `chmod`

    - Option 4: `cp`


    **Correct Response: 1**


    Explanation: The command used to resize the filesystem on a partition in Linux
    is `resize2fs`. This command is used after resizing a partition to adjust the
    filesystem to use the newly available space.


    ### Question: If you want to view detailed information about disk usage for each
    directory, the __________ command would be appropriate.


    - Option 1: `du`

    - Option 2: `df`

    - Option 3: `ls`

    - Option 4: `lsblk`


    **Correct Response: 1**


    Explanation: If you want to view detailed information about disk usage for each
    directory in Linux, the `du` (disk usage) command would be appropriate. It displays
    the disk space consumed by each directory and its subdirectories.


    ### Question: To change or set the UUID of a filesystem in Linux, you would use
    the ________ command.


    - Option 1: `tune2fs`

    - Option 2: `uuidgen`

    - Option 3: `fsck`

    - Option 4: `resize2fs`


    **Correct Response: 1**


    Explanation: To change or set the UUID of a filesystem in Linux, you would use
    the `tune2fs` command. This command allows you to modify various filesystem parameters,
    including the UUID.


    ### Question: When managing disk partitions, the term _________ refers to a method
    that allows for spanning a filesystem across multiple physical disks.


    - Option 1: `RAID`

    - Option 2: `LVM`

    - Option 3: `EXT4`

    - Option 4: `XFS`


    **Correct Response: 2**


    Explanation: When managing disk partitions, the term "LVM" (Logical Volume Manager)
    refers to a method that allows for spanning a filesystem across multiple physical
    disks. `LVM` provides flexibility in managing storage by creating logical volumes
    that can span multiple physical drives.


