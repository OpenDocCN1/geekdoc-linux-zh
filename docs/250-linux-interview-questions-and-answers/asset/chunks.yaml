    ## Explanation

    To disable root login via SSH, you should modify the `/etc/ssh/sshd_config` file
    and set the `PermitRootLogin` parameter to `no`. This enhances security by preventing
    direct root logins, encouraging users to log in as a regular user and then use
    `sudo` for administrative tasks.


    ## Question: A colleague informs you that they''re unable to access a service
    on a remote server. You suspect it might be a firewall issue. How would you list
    the current firewall rules to diagnose the issue?


    Option 1: A) `iptables -L`

    Option 2: B) `firewall-cmd --list-all`

    Option 3: C) `ufw status`

    Option 4: D) `netstat -an`


    **Correct Response: 1**


    Explanation: To list the current firewall rules on a Linux system using `iptables`,
    you can use the command `iptables -L`. This command will display the current firewall
    rules, allowing you to diagnose potential issues and ensure that the necessary
    ports are open for the service your colleague is trying to access.


    ## Question: Which command is used to grant temporary elevated privileges in Linux?


    Option 1: `sudo`

    Option 2: `su`

    Option 3: `elevate`

    Option 4: `grant`


    **Correct Response: 1**


    Explanation: The correct command to grant temporary elevated privileges in Linux
    is `sudo`, which stands for "superuser do." The `sudo` command allows authorized
    users to execute a command as the superuser or another user, providing a level
    of access control.


    ## Question: What is the primary purpose of the `visudo` command?


    Option 1: Edit the sudoers file safely

    Option 2: View system logs

    Option 3: Manage user passwords

    Option 4: Install software packages


    **Correct Response: 1**


    Explanation: The primary purpose of the `visudo` command is to safely edit the
    `sudoers` file. The `sudoers` file specifies which users or groups are allowed
    to run commands with elevated privileges using `sudo`. Using `visudo` is recommended
    because it checks the syntax of the file and prevents potential errors that could
    lock you out of your system.


    ## Question: Which tool enforces mandatory access controls at the kernel level
    in Linux?


    Option 1: SELinux

    Option 2: AppArmor

    Option 3: UAC

    Option 4: `sudo`


    **Correct Response: 1**


    Explanation: SELinux (Security-Enhanced Linux) enforces mandatory access controls
    at the kernel level in Linux. It provides a powerful and flexible security framework
    that allows administrators to define fine-grained access policies for processes,
    files, and resources on a system.


    ## Question: Which file defines the rules for the `sudo` command in Linux?


    Option 1: `/etc/sudoers`

    Option 2: `/etc/sudo`

    Option 3: `/etc/sudoconfig`

    Option 4: `/etc/sudopolicy`


    **Correct Response: 1**


    Explanation: The file that defines the rules for the `sudo` command in Linux is
    `/etc/sudoers`. This file specifies who is allowed to run what commands with administrative
    privileges and how. It''s a crucial part of managing user access and privileges
    in a Linux system.


    ## Question: SELinux operates under what primary modes?


    Option 1: Enforcing and Permissive

    Option 2: Passive and Active

    Option 3: Standard and Enhanced

    Option 4: Basic and Advanced


