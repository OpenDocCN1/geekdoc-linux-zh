    and generates a `Docker` image, which can then be used to create and run containers.


    ## Question: A company wants to deploy a microservices architecture for their
    application. They are looking for a technology that can package each service with
    its dependencies and configuration in a reproducible way. Which technology would
    best fit this requirement?


    - Option 1: a. Docker

    - Option 2: b. Kubernetes

    - Option 3: c. Vagrant

    - Option 4: d. Helm


    **Correct Response:** 1


    **Explanation:** `Docker` is a technology that allows you to package applications
    and their dependencies into containers. It''s an excellent choice for deploying
    microservices, as it ensures that each service is encapsulated with its dependencies
    and configurations, making it highly reproducible and scalable.


    ## Question: What is the first program run by the Linux kernel when it starts?


    - Option 1: init

    - Option 2: shell

    - Option 3: bootloader

    - Option 4: BIOS/UEFI


    **Correct Response:** 1


    **Explanation:** The first program run by the Linux kernel when it starts is typically
    the `init` program. `init` is responsible for initializing the system, starting
    services, and setting up the user environment.


    ## Question: Which component of the Linux boot process loads the main system kernel?


    - Option 1: Bootloader

    - Option 2: Shell

    - Option 3: init

    - Option 4: BIOS/UEFI


    **Correct Response:** 1


    **Explanation:** The component of the Linux boot process that loads the main system
    kernel is the bootloader. The bootloader, such as GRUB, is responsible for locating
    the kernel image on the disk and passing control to it during the boot process.


    ## Question: Which tool in Linux can be used to measure disk input/output statistics?


    - Option 1: iostat

    - Option 2: top

    - Option 3: ps

    - Option 4: df


    **Correct Response:** 1


    **Explanation:** The `iostat` tool in Linux is used to measure disk input/output
    statistics. It provides information about disk utilization, I/O wait times, and
    other important metrics, helping system administrators monitor and troubleshoot
    disk performance.


    ## Question: During the Linux boot process, which script initializes the system
    settings?


    - Option 1: init

    - Option 2: rc.local

    - Option 3: init.d

    - Option 4: systemd


    **Correct Response:** 4


    **Explanation:** During the Linux boot process, `systemd` initializes system settings.
    `systemd` is a modern init system and service manager that has become the standard
    in many Linux distributions. It manages the startup and control of system services
    and settings, replacing the older init system.


    ## Question: Which Linux utility allows you to monitor and manage system CPU performance?


    - Option 1: top

    - Option 2: ls

    - Option 3: cpustat

    - Option 4: sysadmin


    **Correct Response:** 1


    **Explanation:** The `top` command is a Linux utility that allows you to monitor
    and manage system CPU performance. It provides a real-time view of system processes,
    CPU usage, memory usage, and more. You can use it to identify resource-intensive
    processes and manage system performance.

