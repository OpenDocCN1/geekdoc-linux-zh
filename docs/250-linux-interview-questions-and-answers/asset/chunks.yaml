    ### Question: Which system in Linux allows for the management and supervision
    of service daemons?


    - Option 1: `systemd`

    - Option 2: `SysV init`

    - Option 3: `GRUB`

    - Option 4: `iptables`


    **Correct Response:** 1


    **Explanation:** `systemd` is the system in Linux that allows for the management
    and supervision of service daemons. It''s a modern initialization system and service
    manager that replaces the traditional `SysV init` system. `systemd` provides enhanced
    control and monitoring of services and system initialization.


    ---


    ### Question: Which Linux command can be used to monitor real-time network interface
    statistics?


    - Option 1: `ifconfig`

    - Option 2: `netstat`

    - Option 3: `iptraf`

    - Option 4: `nmap`


    **Correct Response:** 3


    **Explanation:** The correct command to monitor real-time network interface statistics
    in Linux is `iptraf`. It provides detailed information about network traffic,
    including traffic per interface, protocols, and ports. `ifconfig` and `netstat`
    are used for network configuration and monitoring, but they don''t offer real-time
    statistics. `nmap` is a network scanning tool.


