    for?


    - Option 1: `Network Address Translation`

    - Option 2: `Network Access Token`

    - Option 3: `Network Analysis Tool`

    - Option 4: `Network Authentication Protocol`


    **Correct Response:** 1


    **Explanation:** In the context of networking, "NAT" stands for Network Address
    Translation. `NAT` is a technique used to modify network address information in
    packet headers while in transit. It''s commonly used to allow multiple devices
    on a local network to share a single public IP address for internet access.


    ---


    ### Question: The _________ daemon in Linux is responsible for assigning IP addresses
    to devices on a local network.


    - Option 1: `DHCP`

    - Option 2: `DNS`

    - Option 3: `SSH`

    - Option 4: `HTTP`


    **Correct Response:** 1


    **Explanation:** The `DHCP` (Dynamic Host Configuration Protocol) daemon in Linux
    is responsible for assigning IP addresses to devices on a local network. It automates
    the process of configuring network settings for devices, ensuring they receive
    the necessary IP address, subnet mask, gateway, and other parameters.


