    **解析：** 通常用于管理 `btrfs` 文件系统的工具是 `btrfs-progs`。这些实用程序提供了用于管理和维护 `btrfs` 文件系统的各种命令，包括创建、挂载和检查文件系统。


    ### 问题：ext4 和 ext3 文件系统之间的主要区别是什么？


    - 选项 1：Ext4 支持更大的文件和文件系统

    - 选项 2：Ext3 具有更好的日志能力

    - 选项 3：Ext4 在启动时有更快的文件系统检查

    - 选项 4：Ext3 提供了改进的数据压缩


    **正确答案：**1


    **解析：** `ext4` 和 `ext3` 文件系统的主要区别是 `Ext4` 支持更大的文件和文件系统。`Ext4` 将最大文件大小从 16 字节字节扩展到
    1 EB，并支持多达 1 EB 的文件系统，而 `Ext3` 在这方面有此限制。这使得 `Ext4` 更适用于现代存储需求。


    ### 问题：可以使用哪个命令列出当前加载的内核模块？


