    Option 2: `netstat`

    Option 3: `ifconfig`

    Option 4: `ip`


    **Correct Response:** 4


    **Explanation:** The `ip` command in Linux provides a detailed view of the networking
    subsystem, including information about network interfaces, IP addresses, routing
    tables, and more. It is a versatile tool for configuring and managing network
    settings on a Linux system, making it an essential utility for network administrators
    and troubleshooters.


