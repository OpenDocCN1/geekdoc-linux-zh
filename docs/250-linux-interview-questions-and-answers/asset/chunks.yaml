    settings for the SSH server, including options related to key-based authentication.


    Question: Which of the following is a common method to secure SSH beyond just
    password authentication?


    Option 1: Enforcing key-based authentication

    Option 2: Using a weak password

    Option 3: Disabling SSH

    Option 4: Keeping SSH configuration default


    Correct Response: 1


    Explanation: A common method to secure SSH beyond just password authentication
    is to enforce key-based authentication. This method increases security by requiring
    users to possess a private key in addition to their password, making it much more
    difficult for unauthorized users to access the system.


    Question: If you wanted to rate limit incoming SSH connections using `iptables`,
    which module would be most appropriate?


    Option 1: `-m limit`

    Option 2: `-m state`

    Option 3: `-m connlimit`

    Option 4: `-m ssh`


    Correct Response: 3


    Explanation: To rate limit incoming SSH connections using `iptables`, the most
    appropriate module is `-m connlimit`. This module allows you to set limits on
    the number of connections established within a specified time frame. It''s useful
    for mitigating brute-force attacks on SSH.


    Question: Which SSH configuration parameter specifies the maximum number of authentication
    attempts allowed per connection?


    Option 1: `MaxLoginAttempts`

    Option 2: `MaxAuthTries`

    Option 3: `AuthMaxRetries`

    Option 4: `LoginAttempts`


    Correct Response: 2


    Explanation: The SSH configuration parameter that specifies the maximum number
    of authentication attempts allowed per connection is `MaxAuthTries`. It can be
    set in the SSH server configuration file (`sshd_config`) to enhance security by
    limiting the number of failed login attempts.


    Question: In the context of `iptables`, what is the purpose of the `INPUT` chain?


    Option 1: Processing incoming packets destined for the local system

    Option 2: Forwarding packets between network interfaces

    Option 3: Handling outgoing packets from the local system

    Option 4: Redirecting traffic to a specific port


    Correct Response: 1


    Explanation: In the context of `iptables`, the `INPUT` chain is responsible for
    processing incoming packets destined for the local system. This is where rules
    for packets directed at the firewall-hosted services and applications are defined,
    allowing or blocking them based on the rules configured in the chain.


    Question: In SSH, the private key should be kept secure and the ________ key is
    added to the server for authentication.


    Option 1: Public

    Option 2: Shared

    Option 3: Admin

    Option 4: Root


    Correct Response: 1


    Explanation: In SSH, the private key should be kept secure, and the public key
    is added to the server for authentication. The server uses the public key to verify
    the identity of the connecting client.


    Question: To temporarily save iptables rules, one would use the command `iptables-save
    > ________`.


    Option 1: `rules.txt`

    Option 2: `config.rules`

    Option 3: `iptables.conf`

    Option 4: `saved-rules`


    Correct Response: 1


    Explanation: To temporarily save `iptables` rules, one would use the command `iptables-save
    > rules.txt`. This command saves the current firewall rules to a file called `rules.txt`
    for later use or backup.


    Question: For an SSH server, the main configuration file is found at `/etc/ssh/________`.


    Option 1: `sshd_config`

    Option 2: `server.conf`

    Option 3: `ssh_config`

    Option 4: `main.conf`


    Correct Response: 1


    Explanation: For an SSH server, the main configuration file is found at `/etc/ssh/sshd_config`.
    This file contains various settings for the SSH server, including authentication
    methods, allowed users, and more.


    Question: The `iptables` command that allows traffic only from a specific IP address,
    say 10.0.0.1, to a specific port, say 22, uses the ________ option.


    Option 1: `-s`

    Option 2: `-p`

    Option 3: `-dport`

    Option 4: `-A`


    Correct Response: 1


    Explanation: The `iptables` command that allows traffic only from a specific IP
    address, say 10.0.0.1, to a specific port, say 22, uses the `-s` (source) option.
    This option specifies the source IP address from which traffic is allowed.


    Question: When setting up SSH for the first time, the server-side cryptographic
    keys are stored in the `/etc/ssh/________` directory.


    Option 1: `ssh_keys`

    Option 2: `certs`

    Option 3: `ssh_host_keys`

    Option 4: `crypto`


    Correct Response: 3


    Explanation: When setting up SSH for the first time, the server-side cryptographic
    keys are stored in the `/etc/ssh/ssh_host_keys` directory. These keys are crucial
    for secure SSH communication.


    Question: To deny all incoming traffic by default and only allow specific traffic
    in `iptables`, one would set the default policy of the `INPUT` chain to ________.


    Option 1: `ACCEPT`

    Option 2: `REJECT`

    Option 3: `DROP`

    Option 4: `ALLOW`


    Correct Response: 3


    Explanation: To deny all incoming traffic by default and only allow specific traffic
    in `iptables`, one would set the default policy of the `INPUT` chain to `DROP`.
    This means that any incoming traffic that doesn''t match an explicit rule will
    be dropped.


    Question: You have been tasked to allow only a specific IP address to connect
    to your SSH server. Which tool or method would be best suited to achieve this?


    Option 1: `iptables`

    Option 2: `/etc/ssh/sshd_config`

    Option 3: TCP Wrappers

    Option 4: `/etc/hosts.allow`


    Correct Response: 3


    Explanation: To allow only a specific IP address to connect to your SSH server,
    you can use TCP Wrappers. You can configure access control for SSH by adding the
    allowed IP address in the `/etc/hosts.allow` file, specifying the service you
    want to control, which in this case is SSH.


    Question: Your organization is implementing a policy to disable root login via
    SSH. Which configuration file and parameter should you modify?


    Option 1: `/etc/ssh/sshd_config`, `PermitRootLogin`

    Option 2: `/etc/ssh/sshd_config`, `AllowRoot`

    Option 3: `/etc/ssh/ssh_config`, `DenyRoot`

    Option 4: `/etc/ssh/ssh_config`, `RootLogin`


    Correct Response: 1

