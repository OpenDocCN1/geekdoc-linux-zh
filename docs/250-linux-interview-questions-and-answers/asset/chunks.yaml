    ## 解释

    要禁用通过 SSH 的 root 登录，您应该修改 `/etc/ssh/sshd_config` 文件并将 `PermitRootLogin` 参数设置为
    `no`。这通过防止直接以 root 登录来增强安全性，鼓励用户以普通用户身份登录，然后使用 `sudo` 执行管理任务。


    ## 问题：一位同事告诉你他们无法访问远程服务器上的某服务。你怀疑这可能是防火墙问题。你将如何列出当前的防火墙规则来诊断问题？


    选项 1：A) `iptables -L`

    选项 2：B) `firewall-cmd --list-all`

    选项 3：C) `ufw status`

    选项 4：D) `netstat -an`


    **正确答案：1**


    解释：在 Linux 系统上使用 `iptables` 列出当前防火墙规则，您可以使用命令 `iptables -L`。该命令将显示当前的防火墙规则，允许您诊断潜在问题，并确保您的同事正尝试访问的服务所需的必要端口已开放。


    ## 问题：Linux 中使用哪个命令来授予临时提权权限？


    选项 1：`sudo`

    选项 2：`su`

    选项 3：`elevate`

    选项 4：`grant`


    **正确答案：1**


    解释：在 Linux 中授予临时提权权限的正确命令是 `sudo`，它的意思是 "superuser do"。`sudo` 命令允许授权用户以超级用户或其他用户的身份执行命令，从而提供了一种层级的访问控制。


    ## 问题：`visudo` 命令的主要目的是什么？


    选项 1：安全地编辑 sudoers 文件

    选项 2：查看系统日志

    选项 3：管理用户密码

    选项 4：安装软件包


    **正确答案：1**


    解释：`visudo` 命令的主要目的是安全地编辑 `sudoers` 文件。`sudoers` 文件指定了哪些用户或用户组允许使用 `sudo` 以提权权限运行命令。建议使用
    `visudo`，因为它会检查文件的语法并防止可能导致您被封锁在系统之外的潜在错误。


    ## 问题：Linux 中哪种工具在内核级别强制强制性访问控制？


    选项 1：SELinux

    选项 2：AppArmor

    选项 3：UAC

    选项 4：`sudo`


    **正确答案：1**


    解释：SELinux (Security-Enhanced Linux) 在 Linux 内核级别强制强制性访问控制。它提供了一个强大且灵活的安全框架，允许管理员为系统上的进程、文件和资源定义细粒访问策略。


    ## 问题：哪个文件定义了 Linux 中 `sudo` 命令的规则？


    选项 1：`/etc/sudoers`

    选项 2：`/etc/sudo`

    选项 3：`/etc/sudoconfig`

    选项 4：`/etc/sudopolicy`


    **正确答案：1**


    解释：定义 Linux 中 `sudo` 命令规则的文件是 `/etc/sudoers`。该文件指定了谁允许以管理权限运行哪些命令以及如何运行。它是管理 Linux
    系统中用户访问和权限的关键组成部分。


    ## 问题：SELinux 在哪些主要模式下运行？


    选项 1：强制模式 (Enforcing) 和许可模式 (Permissive)

    选项 2：被动 (Passive) 和 激活 (Active)

    选项 3：标准 (Standard) 和 增强 (Enhanced)

    选项 4：基础 (Basic) 和高级 (Advanced)


    **正确答案：1**


    解释：SELinux 在两种主要模式下运行：强制模式 (Enforcing) 和许可模式 (Permissive)。在强制模式下，SELinux 会积极执行安全策略并拒绝任何违反这些策略的操作。在许可模式下，SELinux
    会记录策略违规行为但不会积极拒绝它们，使其成为策略调试的有用模式。


    ## 问题：AppArmor 策略通常使用哪类型的文件定义？


    选项 1：配置文件 (Profiles)

    选项 2：蓝图 (Blueprints)

    选项 3：规则 (Rules)

    选项 4：目录 (Directories)


    **正确答案：1**


    解释：AppArmor 策略通常使用配置文件 (Profiles) 定义。这些配置文件指定了单个应用程序或进程的访问控制，允许您限制它们的行为并增强系统安全性。


    ## 问题：在 Linux 中，可以使用 ________ 命令查看谁被授予了 sudo 权限。


    选项 1：`sudoers`

    选项 2：`whoami`

    选项 3：`visudo`

    选项 4：`su`


    **正确答案：3**


    解释：在 Linux 中，使用 `visudo` 命令可以查看谁被授予了 sudo 权限。该命令以安全的方式打开用于编辑的 `sudoers` 文件并显示
    sudo 配置。使用 `visudo` 避免 `sudoers` 文件中的语法错误很重要，因为错误可能会导致您失去管理权限。


    ## 问题：为了确保机器之间策略的一致性，SELinux 策略可以存储为 ________ 格式。


    选项 1：YAML

    选项 2：XML

    选项 3：二进制 (Binary)

    选项 4：文本 (Text)


    **正确答案：4**


    解释：为了确保机器之间策略的一致性，SELinux 策略可以存储为文本 (Text) 格式。SELinux 策略语言是可读的且可以在文本格式下编辑，使其更容易理解和管理安全策略。


    ## 问题：`sudo` 命令从 ________ 读取配置以确定用户权限。


    选项 1：`/etc/passwd`

    选项 2：`/etc/group`

    选项 3：`/etc/sudoers`

    选项 4：`/var/log/auth.log`


    **正确答案：3**


    解释：`sudo` 命令从 `/etc/sudoers` 读取配置以确定用户权限。该文件包含了关于哪些用户可以以管理权限运行命令的信息。理解和配置 sudo
    文件对于管理 Linux 中的访问控制至关重要。


    ## 问题：在想要阻止某个用户执行特定 root 命令的情况下，您将修改其在 ________ 文件中的条目。


    选项 1：`sudoers`

    选项 2：`shadow`

    选项 3：`passwd`

    选项 4：`groups`


    **正确答案：1**


    解释：在想要阻止某个用户执行特定 root 命令的情况下，您将修改其在 `sudoers` 文件中的条目。该文件包含了授予或拒绝用户和组 sudo 权限的规则。


    ## 问题：AppArmor 策略在强制执行时根据 ________ 路径限制系统访问。


    选项 1：文件系统 (file system)

    选项 2：网络 (network)

    选项 3：环境 (environment)

    选项 4：系统调用 (system call)


    **正确答案：1**


    解释：AppArmor 策略在强制执行时根据文件系统路径限制系统访问。这些配置文件定义了程序可以访问的文件和目录，增加了一层安全性。


    ## 问题：工具 ________ 用于管理和强制 AppArmor 内部的配置文件。


    选项 1：`aa-status`

    选项 2：`apparmor-status`

    选项 3：`aa-enforce`

    选项 4：`apparmor-enforce`


    **正确答案：3**


    解释：工具 `aa-enforce` 用于管理和强制 AppArmor 内部的配置文件。它允许为特定的应用程序或进程启用并强制 AppArmor 配置文件。


