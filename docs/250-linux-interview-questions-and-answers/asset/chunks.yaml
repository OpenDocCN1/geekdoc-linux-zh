    leverages _________ virtualization for better performance.


    Option 1: Hardware


    Option 2: Software


    Option 3: Hypervisor


    Option 4: Full


    Correct Response: 3


    Explanation: QEMU, when paired with KVM (Kernel-based Virtual Machine), leverages
    "hardware" virtualization for better performance. Hardware virtualization allows
    the virtual machine to directly access the physical hardware, resulting in improved
    performance compared to software emulation.


    Question: To manage multiple container deployments in an automated way, many organizations
    use Kubernetes, often abbreviated as _________.


    Option 1: K8s


    Option 2: Kube


    Option 3: Kontain


    Option 4: Krypton


    Correct Response: 1


    Explanation: To manage multiple container deployments in an automated way, many
    organizations use Kubernetes, often abbreviated as "K8s." Kubernetes is an open-source
    container orchestration platform that automates the deployment, scaling, and management
    of containerized applications.


    Question: You are tasked with setting up a virtualized environment on a Linux
    server, but you need to ensure that the virtual machines have near-native performance.
    Which combination of tools would best serve this purpose?


    Option 1: a. KVM and QEMU


    Option 2: b. VirtualBox and VMware


    Option 3: c. Xen and Docker


    Option 4: d. LXC and libvirt


    Correct Response: 1


    Explanation: The combination of KVM (Kernel-based Virtual Machine) and QEMU (Quick
    Emulator) is well-suited for creating a virtualized environment with near-native
    performance on a Linux server. KVM leverages hardware virtualization extensions
    to achieve high performance, while QEMU provides emulation for non-native architectures.
    This combination is commonly used for efficient virtualization.


    Question: You''re given a Dockerfile and need to create a Docker container from
    it. Which command would you use?


    Option 1: a. docker compose


    Option 2: b. docker build


    Option 3: c. docker create


    Option 4: d. docker run


    Correct Response: 2


    Explanation: To create a Docker container from a Dockerfile, you would use the
    "docker build" command. This command reads the instructions in the Dockerfile
    and generates a Docker image, which can then be used to create and run containers.


    Question: A company wants to deploy a microservices architecture for their application.
    They are looking for a technology that can package each service with its dependencies
    and configuration in a reproducible way. Which technology would best fit this
    requirement?


    Option 1: a. Docker


    Option 2: b. Kubernetes


    Option 3: c. Vagrant


    Option 4: d. Helm


    Correct Response: 1


    Explanation: Docker is a technology that allows you to package applications and
    their dependencies into containers. It''s an excellent choice for deploying microservices,
    as it ensures that each service is encapsulated with its dependencies and configurations,
    making it highly reproducible and scalable.


    Question: What is the first program run by the Linux kernel when it starts?


    Option 1: init


    Option 2: shell


    Option 3: bootloader


    Option 4: BIOS/UEFI


    Correct Response: 1


    Explanation: The first program run by the Linux kernel when it starts is typically
    the init program (or its modern replacement, such as systemd). Init is responsible
    for initializing the system, starting services, and setting up the user environment.


    Question: Which component of the Linux boot process loads the main system kernel?


    Option 1: Bootloader


    Option 2: Shell


    Option 3: init


    Option 4: BIOS/UEFI


    Correct Response: 1


    Explanation: The component of the Linux boot process that loads the main system
    kernel is the bootloader. The bootloader, such as GRUB, is responsible for locating
    the kernel image on the disk and passing control to it during the boot process.


    Question: Which tool in Linux can be used to measure disk input/output statistics?


    Option 1: iostat


    Option 2: top


    Option 3: ps


    Option 4: df


    Correct Response: 1


    Explanation: The iostat tool in Linux is used to measure disk input/output statistics.
    It provides information about disk utilization, I/O wait times, and other important
    metrics, helping system administrators monitor and troubleshoot disk performance.


    Question: During the Linux boot process, which script initializes the system settings?


    Option 1: init


    Option 2: rc.local


    Option 3: init.d


    Option 4: systemd


    Correct Response: 4


    Explanation: During the Linux boot process, systemd initializes system settings.
    Systemd is a modern init system and service manager that has become the standard
    in many Linux distributions. It manages the startup and control of system services
    and settings, replacing the older init system.


    Question: Which Linux utility allows you to monitor and manage system CPU performance?


    Option 1: top


    Option 2: ls


    Option 3: cpustat


    Option 4: sysadmin


    Correct Response: 1


    Explanation: The ''top'' command is a Linux utility that allows you to monitor
    and manage system CPU performance. It provides a real-time view of system processes,
    CPU usage, memory usage, and more. You can use it to identify resource-intensive
    processes and manage system performance.'
