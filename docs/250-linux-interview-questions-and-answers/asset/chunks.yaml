    ### Question 1

    Option 1: `/etc/hostname`

    Option 2: `/etc/hosts`

    Option 3: `/etc/resolv.conf`

    Option 4: `/etc/networks`


    **Correct Response:** 2


    **Explanation:** The `/etc/hosts` file is used to set the hostname and the order
    in which the system resolves addresses. It contains mappings of IP addresses to
    hostnames and can be used to define the local system''s hostname.


    ### Question 2

    Which command can be used to query DNS records, including MX, NS, and SOA records?


    Option 1: `nslookup`

    Option 2: `ifconfig`

    Option 3: `route`

    Option 4: `ping`


    **Correct Response:** 1


    **Explanation:** The `nslookup` command can be used to query DNS (Domain Name
    System) records, including MX (Mail Exchange), NS (Name Server), and SOA (Start
    of Authority) records. It''s a valuable tool for DNS troubleshooting and network
    diagnostics.


    ### Question 3

    The ________ file in Linux is used to configure network interfaces and is typically
    found in the `/etc/network/` directory.


    Option 1: `interfaces`

    Option 2: `network.conf`

    Option 3: `ifcfg`

    Option 4: `resolv.conf`


    **Correct Response:** 1


    **Explanation:** The file in Linux used to configure network interfaces and typically
    found in the `/etc/network/` directory is the `interfaces` file. This file contains
    information about network interfaces and their settings, allowing you to define
    and manage network connections on your system.


    ### Question 4

    To diagnose potential issues with domain name resolution, you might use the ________
    command.


    Option 1: `nslookup`

    Option 2: `ifconfig`

    Option 3: `ping`

    Option 4: `dig`


    **Correct Response:** 4


    **Explanation:** To diagnose potential issues with domain name resolution, you
    might use the `dig` command. `dig` (Domain Information Groper) is a powerful command-line
    tool for querying DNS (Domain Name System) servers and obtaining detailed information
    about DNS records and name resolution, making it useful for troubleshooting DNS-related
    problems.


    ### Question 5

    The ________ command in Linux provides a detailed view of the networking subsystem,
    including interfaces, IP addresses, and routing tables.


