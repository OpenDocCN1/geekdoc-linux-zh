    - Option 2: `SystemD`

    - Option 3: `ifconfig`

    - Option 4: `Apache`


    **Correct Response:** 1


    **Explanation:** `NetworkManager` is responsible for network interface configuration
    and automatic switching between networks in Linux. It simplifies network setup
    and management, making it easier for users to connect to different networks seamlessly.


