    ### Question: What is the primary purpose of the `netstat` command?


    - Option 1: Display network statistics and connections

    - Option 2: List all installed packages

    - Option 3: Check system resource usage

    - Option 4: Create a new network interface


    **Correct Response:** 1


    **Explanation:** The primary purpose of the `netstat` command is to display network
    statistics and connections. It provides valuable information about network interfaces,
    routing tables, and active network connections. It''s a crucial tool for network
    troubleshooting and monitoring.


