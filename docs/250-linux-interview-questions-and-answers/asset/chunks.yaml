    # 问题：Docker 主要关注的是哪种虚拟化？


    选项 1：`Containerization`

    选项 2：`Hypervisor-based`

    选项 3：`Parirtualization`

    选项 4：`Emulation`


    **正确答案：1**


    解释：Docker 主要关注的是容器化，这是一种轻量级的虚拟化形式。容器共享宿主机内核，使其非常高效。


