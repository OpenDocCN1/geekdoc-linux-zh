    # Correct Response: 4


    Explanation: To find the initialization scripts for different run levels, you
    would primarily look in the `/etc/init.d` directory. This directory contains the
    scripts and links used for managing services and their run levels on a Linux system.


    # Question: What command is used to display the contents of a file in Linux?


    - Option 1: `cat`

    - Option 2: `cd`

    - Option 3: `ls`

    - Option 4: `rm`


    Correct Response: 1


    Explanation: The `cat` command is used to display the contents of a file in Linux.
    It stands for "concatenate" and is often used to view the content of text files
    on the terminal. You can also use it to create, combine, and display the content
    of files.


    # Question: Which command allows you to change directories in the terminal?


    - Option 1: `cd`

    - Option 2: `cat`

    - Option 3: `ls`

    - Option 4: `pwd`


    Correct Response: 1


    Explanation: The `cd` command is used to change directories in the terminal. It
    stands for "change directory," and it is essential for navigating the Linux file
    system. You can use it to move between different directories or folders.


    # Question: What is the primary purpose of the chmod command in Linux?


    - Option 1: Changing file permissions

    - Option 2: Creating new directories

    - Option 3: Displaying file contents

    - Option 4: Deleting files


    Correct Response: 1


    Explanation: The primary purpose of the `chmod` command in Linux is to change
    file permissions. It allows you to modify the access permissions of files and
    directories. You can use it to control who can read, write, and execute a particular
    file or directory.


    # Question: What does the `2>&1` notation signify when used in Linux command redirection?


    - Option 1: Redirects both standard error (2) and standard output (1) to the same
    location

    - Option 2: Redirects standard error (2) to standard output (1)

    - Option 3: Redirects standard output (1) to standard error (2)

    - Option 4: Closes both standard error and standard output


    Correct Response: 1


    Explanation: The `2>&1` notation signifies that both standard error (file descriptor
    `2`) and standard output (file descriptor `1`) are redirected to the same location.
    This is commonly used to capture both error messages and regular output when running
    commands.


    # Question: In terms of file permissions, what does the "s" stand for when seen
    in a permission string like "drwxr-sr-x"?


    - Option 1: Set user or group ID

    - Option 2: Sticky bit

    - Option 3: Synchronized access

    - Option 4: Special permissions


    Correct Response: 1


    Explanation: The `s` in a permission string like `drwxr-sr-x` signifies the "Set
    user or group ID" permission. When set on an executable file, it allows the user
    who runs the file to temporarily inherit the permissions of the file''s owner
    or group, depending on where it''s set (user or group ID).


    # Question: Which command is used to view the list of scheduled tasks for the
    system?


    - Option 1: `crontab -l`

    - Option 2: `tasks`

    - Option 3: `cronlist`

    - Option 4: `schedulelist`


    Correct Response: 1


    Explanation: The command `crontab -l` is used to view the list of scheduled tasks
    (cron jobs) for the system. It lists the cron entries for the currently logged-in
    user. Scheduled tasks are used to automate various processes at specific times
    or intervals in a Linux system.


    # Question: To see the history of commands executed in the terminal, you would
    use the ________ command.


    - Option 1: `history`

    - Option 2: `log`

    - Option 3: `list`

    - Option 4: `trace`


    Correct Response: 1


    Explanation: To see the history of commands executed in the terminal, you would
    use the `history` command. This command displays a list of previously executed
    commands, making it easier to re-run or recall commands that were used in the
    past.


    # Question: In Linux, the ________ command is used to create symbolic links between
    files.


    - Option 1: `ln`

    - Option 2: `link`

    - Option 3: `symlink`

    - Option 4: `connect`


    Correct Response: 1


    Explanation: In Linux, the `ln` command is used to create symbolic links between
    files. A symbolic link is a reference to another file or directory, allowing you
    to access the linked content from a different location in the file system.


    # Question: The _________ command is used to display the disk usage of files and
    directories.


    - Option 1: `du`

    - Option 2: `df`

    - Option 3: `space`

    - Option 4: `usage`


    Correct Response: 1


    Explanation: The `du` (disk usage) command is used to display the disk usage of
    files and directories in Linux. It provides information about the space consumed
    by each file or directory, helping you manage disk space effectively.


    # Question: The ________ command in Linux is used to send a signal to a process,
    often used for termination.


    - Option 1: `kill`

    - Option 2: `stop`

    - Option 3: `pause`

    - Option 4: `continue`


    Correct Response: 1


    Explanation: The `kill` command in Linux is used to send a signal to a process,
    often used for termination. It allows you to gracefully terminate or send specific
    signals to processes, giving you control over their behavior.


    # Question: When working with file permissions, the ________ command is used to
    modify the special permissions like setuid, setgid, and sticky bit.


    - Option 1: `chmod`

    - Option 2: `chown`

    - Option 3: `chattr`

    - Option 4: `lsattr`


    Correct Response: 1


    Explanation: When working with file permissions, the `chmod` command is used to
    modify the special permissions like setuid, setgid, and the sticky bit. These
    special permissions can change the behavior of files and directories, and `chmod`
    is used to set or remove them.


    # Question: The _________ command provides a snapshot of the current processes
    in the system.


    - Option 1: `ps`

    - Option 2: `top`

    - Option 3: `ls`

    - Option 4: `df`


    Correct Response: 1


    Explanation: The `ps` command in Linux provides a snapshot of the current processes
    in the system. It displays detailed information about running processes, including
    their process IDs (`PIDs`), CPU and memory usage, and other vital statistics.


    # Question: You are troubleshooting a server issue and want to continuously monitor
    the appended output of a log file as new content is written to it. Which command
    would you use?


    - Option 1: `tail -f`

    - Option 2: `cat`

    - Option 3: `less`

    - Option 4: `grep`


    Correct Response: 1


    Explanation: To continuously monitor the appended output of a log file, you would
    use the `tail -f` command. The `-f` option allows you to "follow" the file and
    see new content as it is added to the end. This is useful for real-time log monitoring.


    # Question: Imagine you are setting up user permissions for a shared directory.
    You want the files created by users to inherit the group ownership of the directory.
    Which special permission would you set on the directory?


    - Option 1: SetGID

    - Option 2: SetUID

    - Option 3: Sticky bit

    - Option 4: Chmod


    Correct Response: 1


    Explanation: To ensure that files created within a directory inherit the group
    ownership of the directory, you would set the SetGID (Set Group ID) permission
    on the directory. This special permission allows new files to inherit the group
    ownership of the parent directory, which is often used for shared directories.


    # Question: You''ve been given a task to find all occurrences of the word "error"
    in a directory containing numerous log files. Which command would you primarily
    use for this search?


    - Option 1: `grep`

    - Option 2: `find`

    - Option 3: `sed`

    - Option 4: `awk`


    Correct Response: 1


    Explanation: To find all occurrences of the word "error" in a directory with log
    files, you would primarily use the `grep` command. `grep` is a powerful tool for
    searching text and regular expressions in files and can be used to quickly locate
    specific content, like error messages, within files.


    # Question: What command in Linux provides a dynamic real-time view of the system''s
    running processes?


    - Option 1: `top`

    - Option 2: `ls`

    - Option 3: `ps`

    - Option 4: `df`


    Correct Response: 1


    Explanation: The `top` command in Linux provides a dynamic, real-time view of
    the system''s running processes. It displays information about CPU usage, memory
    usage, and more. `top` is a powerful tool for monitoring system performance and
    identifying resource-intensive processes.

