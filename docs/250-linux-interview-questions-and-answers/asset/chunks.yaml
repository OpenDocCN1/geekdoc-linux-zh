    解析：在 Linux 中，要识别所有指向和来自服务器的活动连接，你需要使用 `netstat` 命令。`netstat` 提供有关网络连接、路由表、接口统计、掩装连接等信息。它是网络故障排除的宝贵工具。


    问题：一位同事 true 你某个特定的守护进程正在引起问题，应该在不停止它的情况下临时禁用它。在 Linux 中，哪个命令可以允许你屏蔽（mask）该服务？


    选项 1：`systemctl mask`

    选项 2：`systemctl disable`

    选项 3：`systemctl stop`

    选项 4：`systemctl restart`


    正确答案：1


    解析：在 Linux 中，要在不停止正在运行服务的情况下临时禁用服务，可以使用 `systemctl mask` 命令。该命令会创建一个指向 `/dev/null`
    的符号链接，防止服务自动启动，但它不会停止当前运行的服务。它是防止服务在启动启动时启动的有用方法。


    问题：`iptables -L` 命令的主要用途是什么？


    选项 1：查看 `iptables` 防火墙中的当前规则

    选项 2：列出已安装的软件包

    选项 3：列出目录内容

    选项 4：列出系统用户


    正确答案：1


    解析：`iptables -L` 命令的主要用途是查看 `iptables` 防火墙中的当前规则。它显示了防火墙规则列表及其详细信息，允许你检查 Linux
    系统上的流量是如何被过滤或转发的。


    问题：在配置 SSH 密钥认证时，通常在服务器上修改哪一个文件？


    选项 1：`~/.ssh/id_rsa`

    选项 2：`/etc/passwd`

    选项 3：`/etc/ssh/sshd_config`

    选项 4：`/etc/sudoers`


    正确答案：3


    解析：在服务器上配置 SSH 密钥认证时，通常要修改的文件是 `/etc/ssh/sshd_config`。该文件包含 SSH 服务器的配置设置，包括与密钥认证相关的选项。


    问题：以下除了简单的密码认证之外，保护 SSH 的常见方法是哪一个？


    选项 1：强制执行密钥认证

    选项 2：使用弱密码

    选项 3：禁用 SSH

    选项 4：保持 SSH 配置默认值


    正确答案：1


    解析：除了密码认证之外，保护 SSH 的常见方法是强制执行密钥认证。这种方法通过要求用户在使用密码之外还拥有私钥来增加安全性，使得未经授权的用户访问系统变得困难得多。


    问题：如果你想使用 `iptables` 对传入的 SSH 连接进行速率限制，哪个模块最合适？


    选项 1：`-m limit`

    选项 2：`-m state`

    选项 3：`-m connlimit`

    选项 4：`-m ssh`


    正确答案：3


    解析：使用 `iptables` 对传入的 SSH 连接进行速率限制的最合适模块是 `-m connlimit`。该模块允许你设置在指定时间范围内建立的连接数限制。它对于缓解
    SSH 暴力攻击非常有用。


    问题：哪个 SSH 配置参数指定每个连接允许的最大身份验证次数？


    选项 1：`MaxLoginAttempts`

    选项 2：`MaxAuthTries`

    选项 3：`AuthMaxRetries`

    选项 4：`LoginAttempts`


    正确答案：2


    解析：指定每个连接允许的最大身份验证次数的 SSH 配置参数是 `MaxAuthTries`。它可以在 SSH 服务器配置文件 (`sshd_config`)
    中设置，通过限制失败登录尝试次数来增强安全性。


    问题：在 `iptables` 环境中，`INPUT` 链的目的是什么？


    选项 1：处理指向本地系统的传入数据包

    选项 2：在网络接口之间转发数据包

    选项 3：处理来自本地系统的传出数据包

    选项 4：将流量重定向到特定端口


    正确答案：1


    解析：在 `iptables` 环境中，`INPUT` 链负责处理指向本地系统的传入数据包。这是定义指向防火墙托管服务和应用程序的数据包的地方，根据链中配置的规则允许或阻止这些包。


    问题：在 SSH 中，私钥应保持安全，并将 ________ 密钥添加到服务器上进行认证。


    选项 1：公钥（Public）

    选项 2：共享（Shared）

    选项 3：管理员（Admin）

    选项 4：根（Root）


    正确答案：1


    解析：在 SSH 中，私钥应保持安全，公钥被添加到服务器用于认证。服务器使用公钥来验证连接客户端的身份。


    问题：为了临时保存 iptables 规则，应使用命令 `iptables-save > ________`。


    选项 1：`rules.txt`

    选项 2：`config.rules`

    选项 3：`iptables.conf`

    选项 4：`saved-rules`


    正确答案：1


    解析：为了临时保存 `iptables` 规则，可以使用命令 `iptables-save > rules.txt`。该命令将当前防火墙规则保存到名为 `rules.txt`
    的文件中，供以后使用或备份。


    对于 SSH 服务器，主配置文件位于 `/etc/ssh/________`。


    选项 1：`sshd_config`

    选项 2：`server.conf`

    选项 3：`ssh_config`

    选项 4：`main.conf`


    正确答案：1


    解析：对于 SSH 服务器，主配置文件位于 `/etc/ssh/sshd_config`。该文件包含针对 SSH 服务器的各种设置，包括认证方法、允许的用户等。


    问题：`iptables` 命令允许来自特定 IP 地址（例如 10.0.0.1）到特定端口（例如 22）的流量使用的是 ________ 参数。


    选项 1：`-s`

    选项 2：`-p`

    选项 3：`-dport`

    选项 4：`-A`


    正确答案：1


    解析：`iptables` 命令允许来自特定 IP 地址（例如 10.0.0.1）到特定端口（例如 22）的流量使用的是 `-s` 参数。该参数指定了源 IP
    地址。


    在首次设置 SSH 时，服务器端的加密密钥存储在 `/etc/ssh/________` 目录下。


    选项 1：`ssh_keys`

    选项 2：`certs`

    选项 3：`ssh_host_keys`

    选项 4：`crypto`


    正确答案：3


    解析：在首次设置 SSH 时，服务器端的加密密钥存储在 `/etc/ssh/ssh_host_keys` 目录下。这些密钥对于安全关重要。


    为了默认拒绝所有传入流量并仅在 `iptables` 中允许特定流量，会将 `INPUT` 链的默认策略设置为 ________。


    选项 1：`ACCEPT`

    选项 2：`REJECT`

    选项 3：`DROP`

    选项 4：`ALLOW`


    正确答案：3


    解析：为了默认拒绝所有传入流量并仅在 `iptables` 中允许特定流量，会将 `INPUT` 链的默认策略设置为 `DROP`。这意味着任何未匹配显式规则的传入流量将被丢弃。


    你被要求允许特定的 IP 地址连接到你的 SSH 服务器。哪种工具或方法最适合实现此目标？


    选项 1：`iptables`

    选项 2：`/etc/ssh/sshd_config`

    选项 3：TCP Wrappers

    选项 4：`/etc/hosts.allow`


    正确答案：3


    解析：解析解析：要允许特定的 IP 地址连接到你的 SSH 服务器，可以使用 TCP Wrappers。通过在 `/etc/hosts.allow` 文件中添加允许的
    IP 地址并指定要控制的服务（在本例中为 SSH），可以配置访问控制。


    你的公司正在实施禁用 SSH 根登录的策略。你应该修改哪个配置文件和参数？


    选项 1：`/etc/ssh/sshd_config`, `PermitRootLogin`

    选项 2：`/etc/ssh/sshd_config`, `AllowRoot`

    选项 3：`/etc/ssh/ssh_config`, `DenyRoot`

    选项 4：`/etc/ssh/ssh_config`, `RootLogin`


    正确答案：1


