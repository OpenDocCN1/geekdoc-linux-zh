    因其高级功能经常被用于现代 Linux 发行版中。


    ### 问题：使用哪个命令手动加载内核模块？


    - 选项 1：modprobe

    - 选项 2：insmod

    - 选项 3：depmod

    - 选项 4：lsmod


    **正确答案：**2


    **解析：** 手动加载内核模块的正确命令是 `insmod`。该命令允许你将内核模块插入到运行的内核中。当你想要将特定模块加载到内核时使用它，它不会自动处理模块依赖关系。


    ### 问题：在文件系统的语文中，“日志记录”（journaling）主要帮助什么？


    - 选项 1：确保文件系统的一致性

    - 选项 2：增强文件压缩

    - 选项 3：提高文件访问速度

    - 选项 4：优化文件权限


    **正确答案：**1


    **解析：** 文件系统中的日志记录主要有助于确保文件系统的一致性。它在日志中记录文件系统的更改，可以在发生崩溃或系统意外关机时恢复文件系统，从而防止数据损坏。


    ### 问题：通常使用哪个工具来管理 btrfs 文件系统？


    - 选项 1：btrfs-progs

    - 选项 2：ext4tools

    - 选项 3：xfsctl

