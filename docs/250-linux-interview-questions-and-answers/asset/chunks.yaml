    ### Question: Which Linux command is used to send signals to processes, commonly
    used for stopping them?


    - Option 1: `kill`

    - Option 2: `start`

    - Option 3: `halt`

    - Option 4: `pause`


    **Correct Response: 1**


    **Explanation:** The `kill` command in Linux is used to send signals to processes.
    It is commonly used to terminate or stop processes gracefully. By default, `kill`
    sends the `TERM` signal to a process, but it can be used to send other signals
    as well, depending on the situation.


    ### Question: What component in Linux is responsible for managing system resources
    and providing an interface between the hardware and the user space?


    - Option 1: `Kernel`

    - Option 2: `Shell`

    - Option 3: `BIOS`

    - Option 4: `Compiler`


    **Correct Response: 1**


    **Explanation:** The component in Linux responsible for managing system resources
    and providing an interface between the hardware and the user space is the `Kernel`.
    The kernel is the core of the operating system and handles tasks such as memory
    management, process scheduling, and hardware interaction. It acts as an intermediary
    between software and hardware, making it a crucial part of the Linux operating
    system.


    ### Question: Which component of the Linux system manages process scheduling?


    - Option 1: `Scheduler`

    - Option 2: `Memory Manager`

    - Option 3: `File System`

    - Option 4: `Kernel`


    **Correct Response: 1**


    **Explanation:** The component of the Linux system that manages process scheduling
    is the `Scheduler`. The scheduler is responsible for determining the order in
    which processes are executed on the CPU, ensuring efficient and fair utilization
    of system resources.


    ### Question: How can a user put a running process into the background from the
    terminal?


    - Option 1: Press `Ctrl + Z`

    - Option 2: Press `Ctrl + B`

    - Option 3: Press `Ctrl + C`

    - Option 4: Press `Ctrl + D`


    **Correct Response: 1**


    **Explanation:** To put a running process into the background from the terminal,
    you can press `Ctrl + Z`. This action suspends the process and places it in the
    background, allowing you to continue using the terminal for other tasks while
    the process runs in the background.


    ### Question: What is the primary role of the System Call Interface in the Linux
    kernel?


    - Option 1: Providing an interface for user programs to interact with the kernel

    - Option 2: Managing the file system

    - Option 3: Allocating memory for processes

    - Option 4: Scheduling processes


    **Correct Response: 1**


    **Explanation:** The primary role of the System Call Interface in the Linux kernel
    is to provide an interface for user programs to interact with the kernel. System
    calls are the gateway through which user applications request services from the
    kernel, such as file operations, process control, and hardware access.


    ### Question: Which file in the `/proc` directory can be inspected to gather information
    about the system''s CPU?


    - Option 1: `/proc/cpuinfo`

    - Option 2: `/proc/meminfo`

    - Option 3: `/proc/filesystems`

    - Option 4: `/proc/sys/kernel`


    **Correct Response: 1**


    **Explanation:** The `/proc/cpuinfo` file in the `/proc` directory is used to
    gather information about the system''s CPU. It provides details about the processor,
    including its model, speed, and features. This is a valuable resource for understanding
    the CPU''s capabilities and characteristics.


    ### Question: What kernel component is responsible for memory management, including
    allocation and page replacement?


    - Option 1: `Memory Management Unit (MMU)`

    - Option 2: `Page Table`

    - Option 3: `Virtual Memory Manager`

    - Option 4: `Kernel Scheduler`


    **Correct Response: 3**


    **Explanation:** The kernel component responsible for memory management, including
    memory allocation and page replacement, is the `Virtual Memory Manager` (VMM).
    The VMM is an integral part of the Linux kernel and ensures efficient utilization
    of physical and virtual memory resources.


    ### Question: When a process is neither in ''running'' nor in ''blocked'' state,
    which state might it be in?


    - Option 1: `Waiting`

    - Option 2: `Zombie`

    - Option 3: `Sleeping`

    - Option 4: `Stopped`


    **Correct Response: 3**


    **Explanation:** When a process is neither in the `running` nor `blocked` state,
    it is typically in a `Sleeping` state. In this state, the process is waiting for
    an event or a specific condition to occur before it can continue execution. The
    process is temporarily inactive, often due to I/O operations or waiting for a
    signal.


    ### Question: In Linux, the _____ command is used to display the status of jobs
    in the current session.


    - Option 1: `jobs`

    - Option 2: `top`

    - Option 3: `ps`

    - Option 4: `tasklist`


    **Correct Response: 1**


    **Explanation:** In Linux, the `jobs` command is used to display the status of
    jobs in the current session. It provides information about background processes
    or jobs started within the current shell session.


    ### Question: A kernel that can have modules loaded and unloaded at runtime is
    referred to as a _________ kernel.


    - Option 1: `modular`

    - Option 2: `dynamic`

    - Option 3: `monolithic`

    - Option 4: `micro`


    **Correct Response: 1**


    **Explanation:** A kernel that can have modules loaded and unloaded at runtime
    is referred to as a "modular" kernel. In a modular kernel, certain functionality
    can be added or removed via loadable kernel modules, making it more flexible and
    efficient.


    ### Question: The ________ mechanism in Linux allows processes to communicate
    with each other, commonly used in IPC.


    - Option 1: `Inter-Process Communication (IPC)`

    - Option 2: `Inter-System Communication (ISC)`

    - Option 3: `Inter-Process Messaging (IPM)`

    - Option 4: `Intra-Process Communication (IPC)`


    **Correct Response: 1**


    **Explanation:** The "Inter-Process Communication (IPC)" mechanism in Linux allows
    processes to communicate with each other. IPC is essential for processes to exchange
    data and synchronize their activities, and it''s commonly used in various applications
    and services in Linux.


    ### Question: You notice that a process on your Linux system is consuming too
    much CPU. Which command would you use to adjust its priority?


    - Option 1: `nice`

    - Option 2: `renice`

    - Option 3: `top`

    - Option 4: `ps`


    **Correct Response: 2**


    **Explanation:** To adjust the priority of a running process in Linux, you would
    use the `renice` command. This allows you to change the process''s nice value
    and, consequently, its CPU priority. A lower nice value means a higher priority.


    ### Question: You are debugging an application and need to trace the system calls
    it makes. Which tool in Linux would you employ?


    - Option 1: `strace`

    - Option 2: `ltrace`

    - Option 3: `gdb`

    - Option 4: `valgrind`


    **Correct Response: 1**


    **Explanation:** To trace the system calls made by an application on Linux, you
    would use the `strace` tool. It provides detailed information about the system
    calls, signals, and other interactions the application has with the operating
    system, which is valuable for debugging and analysis.


    ### Question: A user reports that their application occasionally freezes. You
    suspect it''s due to the application waiting for some I/O operations to complete.
    Which state might the process be in during these freezes?


    - Option 1: `D (Uninterruptible Sleep)`

    - Option 2: `R (Running)`

    - Option 3: `S (Sleeping)`

    - Option 4: `Z (Zombie)`


    **Correct Response: 1**


    **Explanation:** During an I/O operation, a process might enter the `D` state,
    which stands for Uninterruptible Sleep. This state indicates that the process
    is waiting for a resource to become available, and it cannot be interrupted. It''s
    often associated with I/O-related delays or problems.


    ### Question: Which command is used to add a new user in Linux?


    - Option 1: `useradd`

    - Option 2: `adduser`

    - Option 3: `newuser`

    - Option 4: `createuser`


    **Correct Response: 1**


    **Explanation:** The correct command to add a new user in Linux is `useradd`.
    This command creates a new user account and associated files. It is used to specify
    user details like the home directory and shell.


    ### Question: In Debian and its derivatives, which tool is primarily used for
    package management?


    - Option 1: `APT`

    - Option 2: `YUM`

    - Option 3: `DNF`

    - Option 4: `Zypper`


    **Correct Response: 1**

