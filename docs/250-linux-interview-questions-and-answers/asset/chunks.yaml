    ### Question: Which file system is designed to offer advanced features such as
    pooling, snapshots, and checksums?


    - Option 1: Btrfs

    - Option 2: ext3

    - Option 3: XFS

    - Option 4: JFS


    **Correct Response:** 1


    **Explanation:** `Btrfs` (B-Tree File System) is designed to offer advanced features
    such as data pooling, snapshots, and checksums. It is a next-generation file system
    that provides data integrity and efficient storage management. `Btrfs` is often
    used in modern Linux distributions for its advanced capabilities.


    ### Question: Which command is used to load kernel modules manually?


    - Option 1: modprobe

    - Option 2: insmod

    - Option 3: depmod

    - Option 4: lsmod


    **Correct Response:** 2


    **Explanation:** The correct command to load kernel modules manually is `insmod`.
    This command allows you to insert a kernel module into the running kernel. It''s
    used when you want to load a specific module into the kernel, and it doesn''t
    handle module dependencies automatically.


    ### Question: In the context of file systems, what does "journaling" primarily
    help with?


    - Option 1: Ensuring file system consistency

    - Option 2: Enhancing file compression

    - Option 3: Improving file access speed

    - Option 4: Optimizing file permissions


    **Correct Response:** 1


    **Explanation:** Journaling in file systems primarily helps ensure file system
    consistency. It records changes to the file system in a journal, which can be
    used to recover the file system in case of a crash or unexpected system shutdown,
    preventing data corruption.


    ### Question: Which tool is commonly used to manage btrfs file systems?


    - Option 1: btrfs-progs

    - Option 2: ext4tools

    - Option 3: xfsctl

    - Option 4: jfsutils


    **Correct Response:** 1


    **Explanation:** The tool commonly used to manage `btrfs` file systems is `btrfs-progs`.
    These utilities provide various commands for managing and maintaining `btrfs`
    file systems, including creating, mounting, and checking file systems.


    ### Question: What is the primary difference between ext4 and ext3 file systems?


    - Option 1: Ext4 supports larger file sizes and filesystems

    - Option 2: Ext3 has better journaling capabilities

    - Option 3: Ext4 has a faster file system check on boot

    - Option 4: Ext3 offers improved data compression


    **Correct Response:** 1


    **Explanation:** The primary difference between `ext4` and `ext3` file systems
    is that `Ext4` supports larger file sizes and filesystems. `Ext4` extends the
    maximum file size from 16 terabytes to 1 exabyte and supports filesystems up to
    1 exabyte, whereas `Ext3` has limitations in this regard. This makes `Ext4` more
    suitable for modern storage needs.


    ### Question: Which command can be used to list currently loaded kernel modules?


    - Option 1: lsmod

    - Option 2: modprobe

    - Option 3: modinfo

    - Option 4: insmod


    **Correct Response:** 1


    **Explanation:** The command `lsmod` is used to list currently loaded kernel modules
    in Linux. This command displays a list of all the kernel modules that are currently
    loaded into the running kernel.


    ### Question: For a system running the Linux kernel, where are module configuration
    files typically stored?


    - Option 1: `/etc/modprobe.d/`

    - Option 2: `/var/modules`

    - Option 3: `/usr/lib/kernel/modules`

    - Option 4: `/opt/kernelconfig`


    **Correct Response:** 1


    **Explanation:** For a system running the Linux kernel, module configuration files
    are typically stored in the `/etc/modprobe.d/` directory. These files are used
    to configure the behavior and options of kernel modules, allowing users to customize
    module settings and behavior.


    ### Question: The _________ utility is used to create, grow, shrink, and repair
    ext2, ext3, and ext4 file systems.


    - Option 1: resize2fs

    - Option 2: mkfs

    - Option 3: df

    - Option 4: lsblk


    **Correct Response:** 1


    **Explanation:** The correct option is `resize2fs`. The `resize2fs` utility is
    used to resize (grow or shrink) `ext2`, `ext3`, and `ext4` file systems. It allows
    you to adjust the size of the file system to match the size of the underlying
    disk or partition. This is a crucial tool for managing file system sizes in Linux.


    ### Question: Kernel modules that are loaded during the boot process are typically
    defined in the _________ directory.


    - Option 1: `/lib/modules`

    - Option 2: `/boot`

    - Option 3: `/etc/kernel`

    - Option 4: `/var/modules`


    **Correct Response:** 1


    **Explanation:** The correct option is `/lib/modules`. Kernel modules (device
    drivers and other kernel extensions) that are loaded during the boot process are
    typically defined in the `/lib/modules` directory. This directory contains subdirectories
    for different kernel versions and modules specific to those versions.


    ### Question: The _________ feature in btrfs allows for creating a readable/writable
    "snapshot" of a subvolume.


    - Option 1: snapshot

    - Option 2: backup

    - Option 3: mirroring

    - Option 4: subvolume copy


    **Correct Response:** 1


    **Explanation:** The correct option is `snapshot`. `Btrfs`, a modern file system
    for Linux, provides a feature that allows for creating a readable/writable "snapshot"
    of a subvolume. Snapshots are a powerful tool for data protection and efficient
    use of disk space.


    ### Question: You are setting up a high-performance database server and require
    a file system that supports large files and high data integrity. Which file system
    would be most suitable?


    - Option 1: Ext4

    - Option 2: XFS

    - Option 3: Btrfs

    - Option 4: ZFS


    **Correct Response:** 4


    **Explanation:** `ZFS` (Zettabyte File System) would be most suitable for a high-performance
    database server. It supports large files, data integrity through features like
    checksums, and provides advanced data management capabilities, making it ideal
    for critical storage needs.


    ### Question: A system administrator wants to dynamically alter the kernel''s
    behavior without rebooting. What feature of the Linux kernel allows for this?


    - Option 1: Sysctl

    - Option 2: init.d

    - Option 3: Kernel Modules

    - Option 4: Udev


    **Correct Response:** 1


    **Explanation:** The `Sysctl` feature allows a system administrator to dynamically
    alter the kernel''s behavior without rebooting. It provides a way to modify kernel
    parameters at runtime, making it a powerful tool for fine-tuning system behavior.


    ### Question: You''ve been given a new device without any documentation. You want
    to check if Linux has automatically loaded a driver for it. Which command would
    help you determine this?


    - Option 1: lspci

    - Option 2: dmesg

    - Option 3: lsusb

    - Option 4: udevadm


    **Correct Response:** 2


    **Explanation:** The `dmesg` command would help you determine if Linux has automatically
    loaded a driver for the new device. `dmesg` displays kernel messages, and you
    can look for entries related to the device to see if a driver has been loaded
    or if there are any issues with it.

