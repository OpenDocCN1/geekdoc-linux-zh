    - Option 4: `sysstat`


    **Correct Response: 1**


    Explanation: The `top` command provides a bird''s-eye view of the system''s current
    resource usage, including CPU, RAM, and swap. It offers real-time monitoring of
    processes and their resource consumption.


    ### Question: Which command is primarily used to view the routing table in Linux?


    - Option 1: `route`

    - Option 2: `netstat`

    - Option 3: `ifconfig`

    - Option 4: `ping`


