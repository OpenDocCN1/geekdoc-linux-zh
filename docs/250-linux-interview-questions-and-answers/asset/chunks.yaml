    # Question 1

    Question: You are a system administrator and notice that users are able to use
    simple passwords. Which tool or command would you use to enforce complex password
    policies?


    - Option 1: `passwd`

    - Option 2: `chsh`

    - Option 3: `pam_tally2`

    - Option 4: `passwdqc`


    **Correct Response:** 4


    **Explanation:** To enforce complex password policies, you can use the `passwdqc`
    tool. `passwdqc` is a password complexity checking and policy enforcement tool
    that can help you ensure that users create strong passwords by setting specific
    requirements such as length, character classes, and more.


    # Question 2

    Question: While configuring a VPN on a Linux server, you''re asked to ensure that
    the VPN supports both L2TP and IPsec. Which software solution would you likely
    consider?


    - Option 1: `OpenVPN`

    - Option 2: `StrongSwan`

    - Option 3: `WireGuard`

    - Option 4: `PPTP`


    **Correct Response:** 2


    **Explanation:** To support both L2TP and IPsec in a VPN setup, you would likely
    consider using `StrongSwan`. `StrongSwan` is an open-source IPsec-based VPN solution
    that supports both L2TP and IPsec, providing secure and reliable VPN connectivity.


    # Question 3

    Question: You''re setting up a Linux server in an enterprise where user credentials
    are managed centrally. To ensure that Linux users can log in using their central
    credentials, which service or protocol should the Linux server support?


    - Option 1: `LDAP`

    - Option 2: `RADIUS`

    - Option 3: `Kerberos`

    - Option 4: `TACACS+`


    **Correct Response:** 1


    **Explanation:** To allow Linux users to log in using central credentials, you
    should support `LDAP` (Lightweight Directory Access Protocol). `LDAP` is a widely
    used protocol for centralizing user authentication and directory services, making
    it a suitable choice for enterprise environments.


    # Question 4

    Question: Which symbol is used in Bash scripting to execute a command?


    - Option 1: `$`

    - Option 2: `%`

    - Option 3: `#`

    - Option 4: `@`


    **Correct Response:** 1


    **Explanation:** In Bash scripting, the `$` symbol is used to execute a command.
    When you prefix a command with `$`, it''s interpreted as a variable and executed.
    For example, `$ ls` would execute the `ls` command.


    # Question 5

    Question: What is the primary purpose of the `echo` command in Bash scripting?


    - Option 1: Printing output to the terminal

    - Option 2: Calculating mathematical expressions

    - Option 3: Deleting files and directories

    - Option 4: Running system commands


    **Correct Response:** 1


    **Explanation:** The primary purpose of the `echo` command in Bash scripting is
    to print output to the terminal. It''s often used to display messages, variables,
    or other data to the screen. For example, `echo "Hello, World!"` will print "Hello,
    World!" to the terminal.


    # Question 6

    Question: Which of the following is a valid way to declare a variable in Bash?

    - Option 1: `myVar=42`

    - Option 2: `$myVar = 42`

    - Option 3: `var myVar = 42`

    - Option 4: `set myVar 42`


    **Correct Response:** 1


    **Explanation:** A valid way to declare a variable in Bash is by using the format
    `myVar=42`. This assigns the value 42 to the variable `myVar`. The `$` symbol
    is used to reference the variable.


    # Question 7

    Question: Which command tests for file types and compares values in Bash scripting?


    - Option 1: `test`

    - Option 2: `eval`

    - Option 3: `exec`

    - Option 4: `check`


    **Correct Response:** 1


    **Explanation:** In Bash scripting, the `test` command is used to test for file
    types and compare values. It is often used with conditional statements like `if`
    and `elif` to perform tests on files, strings, and other expressions. The `test`
    command is also equivalent to `[]` in Bash.


    # Question 8

    How do you denote the start of a block of code in a Bash if statement?


    - Option 1: `then`

    - Option 2: `start`

    - Option 3: `begin`

    - Option 4: `do`


    **Correct Response:** 1


    **Explanation:** In a Bash if statement, you denote the start of a block of code
    with the keyword `then`. This is where the code to be executed if the condition
    is true begins. It''s important to follow `then` with the code that should be
    executed when the condition is met.


    # Question 9

    Which operator would you use in Bash to check if two strings are equal?


    - Option 1: `=`

    - Option 2: `==`

    - Option 3: `#NAME?`

    - Option 4: `equals`


    **Correct Response:** 2


    **Explanation:** In Bash, to check if two strings are equal, you use the `==`
    operator. It is used in conditional statements to compare two strings. Remember
    to enclose the strings in double square brackets for the comparison, like `[[
    string1 == string2 ]]`.


    # Question 10

    In Bash scripting, what does the `&&` operator signify?


    - Option 1: Logical AND operator

    - Option 2: Pipe operator

    - Option 3: Command substitution

    - Option 4: Bitwise AND operator


    **Correct Response:** 1


    **Explanation:** In Bash scripting, the `&&` operator signifies the logical AND
    operator. It is used to execute the command on the right-hand side only if the
    command on the left-hand side succeeds (returns a zero exit status). This allows
    for conditional execution of commands in a script.


    # Question 11

    Which command in Bash is used for multi-way branching?


    - Option 1: `case`

    - Option 2: `if`

    - Option 3: `for`

    - Option 4: `while`


    **Correct Response:** 1


    **Explanation:** In Bash scripting, the `case` command is used for multi-way branching.
    It is often used when you need to evaluate a variable or expression and take different
    actions based on its value. It''s a powerful tool for creating conditional logic
    in scripts.


    # Question 12

    In Bash scripting, the ________ command is used to loop over a range of values.


    - Option 1: `for`

    - Option 2: `while`

    - Option 3: `if`

    - Option 4: `echo`


    **Correct Response:** 1


    **Explanation:** In Bash scripting, the `for` command is used to loop over a range
    of values. It allows you to execute a set of commands for each item in the specified
    range or list.


    # Question 13

    To execute a script in Bash, you often need to make it executable and then use
    the ________ symbol before the script name.


    - Option 1: `./`

    - Option 2: `&`

    - Option 3: `~`

    - Option 4: `$`


    **Correct Response:** 1


    **Explanation:** To execute a script in Bash, you often need to make it executable
    by running `chmod +x script_name`, and then you use the `./` symbol before the
    script name to specify the current directory. This tells the shell to execute
    the script from the current directory.


    # Question 14

    The ________ statement in Bash allows for decision-making and executing different
    blocks of code based on a condition.


    - Option 1: `if`

    - Option 2: `for`

    - Option 3: `while`

    - Option 4: `switch`


