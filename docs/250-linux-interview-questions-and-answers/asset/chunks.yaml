    ## 选项 2: Docker Swarm

    ## 选项 3: Kubernetes

    ## 选项 4: Ansible


    **正确答案：** 3


    **解析：** `Kubernetes` 用于编排多个 Docker 容器。它是一个强大的容器编排平台，实现了容器化应用程序的部署、扩展和管理。


    ## 问题：在容器语境下，缩写“OCI”代表什么？


    - 选项 1：开放容器倡议 (Open Container Initiative)

    - 选项 2：开放容器镜像 (Open Container Image)

    - 选项 3：概要容器集成 (Overarching Container Integration)

    - 选项 4：操作系统基础设施 (Operating Container Infrastructure)


    **正确答案：** 1


    **解析：** 在容器语境下，“OCI”代表“开放容器倡议”。`OCI` 是一项标准化的开放行业努力，定义了容器规范和运行时标准，确保了不同容器运行时之间的兼容性和可移植性。


    ## 问题：在操作 Docker 时，`Dockerfile` 用于定义和配置容器的 _________。


    - 选项 1：行为 (Behavior)

    - 选项 2：网络 (Networking)

    - 选项 3：环境 (Environment)

    - 选项 4：参数 (Parameters)


    **正确答案：** 3


    **解析：** 在操作 `Docker` 时，`Dockerfile` 用于定义和配置容器的环境。这包括指定基础镜像、安装软件、设置环境变量以及其他特定容器的配置。


    ## 问题：KVM 代表基于内核的虚拟 _________。


    - 选项 1：机器 (Machine)

    - 选项 2：管理器 (Manager)

    - 选项 3：内存 (Memory)

    - 选项 4：模块 (Module)


    **正确答案：** 1


    **解析：** `KVM` 代表基于内核的虚拟机（Kernel-based Virtual Machine）。它是一个 Linux 内核模块，启用硬件辅助虚拟化，允许你在单台主机上运行多个虚拟机。


    ## 问题：LXC 提供与 Docker 类似的容器化服务，但它更侧重于提供一个完整的 _________ 环境。


    - 选项 1：内核 (Kernel)

    - 选项 2：网络 (Networking)

    - 选项 3：系统 (System)

    - 选项 4：用户 (User)


    **正确答案：** 3


    **解析：** `LXC`（Linux Containers）提供与 `Docker` 类似的容器化服务，但它更关注于提供一个完整的系统环境。这意味着它可以运行多个
    Linux 发行版，甚至是带有自带内核的非 Linux 操作系统，使其在某些用例下更加灵活。


    ## 问题：在 Docker 中，一个 _________ 是一个轻级的、独立的、可执行软件软件包，包含了运行某软件所需的所有内容。


    - 选项 1：容器 (Container)

    - 选项 2：镜像 (Image)

    - 选项 3：虚拟机 (Virtual Machine)

    - 选项 4：仓库 (Repository)


    **正确答案：** 2


    **解析：** 在 `Docker` 中，“镜像”是一个轻级的、独立的、可执行软件软件包，包含了运行某软件所需的所有内容。`Docker` 容器是从这些镜像创建的，允许你在隔离的环境中运行应用程序。


    ## 问题：QEMU 可用于硬件仿真，但当与 KVM 配合时，它利用 _________ 虚拟化来获得更好的性能。


    - 选项 1：硬件 (Hardware)

    - 选项 2：软件 (Software)

    - 选项 3：虚拟机管理程序 (Hypervisor)

    - 选项 4：全方位 (Full)


    **正确答案：** 3


    **解析：** `QEMU` 与 `KVM`（基于内核的虚拟机）配合使用时，利用“硬件”虚拟化获得更好的性能。硬件虚拟化允许虚拟机直接访问物理硬件，与软件仿真相比，提升了性能。


    ## 问题：为了以自动化方式管理多个容器部署，许多组织使用 Kubernetes，通常缩写为 _________。


    - 选项 1：K8s

    - 选项 2：Kube

    - 选项 3：Kontain

    - 选项 4：Krypton


    **正确答案：** 1


    **解析：** 为了以自动化方式管理多个容器部署，许多组织使用 `Kubernetes`，通常缩写为“K8s”。`Kubernetes` 是一个开源容器编排平台，实现了容器化应用程序的部署、扩展和管理。


    ## 问题：你被要求在 Linux 服务器上搭建一个虚拟化环境，但你需要确保虚拟机具有接近原生的性能。哪种工具组合最能满足此目的？


    - 选项 1：a. KVM 和 QEMU

    - 选项 2：b. VirtualBox 和 VMware

    - 选项 3：c. Xen 和 Docker

    - 选项 4：d. LXC 和 libvirt


    **正确答案：** 1


    **解析：** `KVM`（基于内核的虚拟机）和 `QEMU`（快速仿真器）的组合非常适合在 Linux 服务器上创建具有接近原生性能的虚拟化环境。`KVM`
    利用硬件虚拟化扩展来实现高性能，而 `QEMU` 为非原生架构提供仿真。这种组合通常用于高效的虚拟化。


    ## 问题：你拿有一个 Dockerfile 并需要从它创建一个 Docker 容器。你会使用哪个命令？


    - 选项 1：a. docker compose

    - 选项 2：b. docker build

    - 选项 3：c. docker create

    - 选项 4：d. docker run


    **正确答案：** 2


    **解析：** 若要从 `Dockerfile` 创建 Docker 容器，你将使用 `docker build` 命令。该命令读取 `Dockerfile`
    中的指令并生成 `Docker` 镜像，然后可以使用该镜像来创建和运行容器。


    ## 问题：一家公司想为他们的应用程序部署微服务架构。他们正在寻找一种以可重复的方式将每个服务及其依赖和配置的技术。哪种技术最符合这一要求？


    - 选项 1：a. Docker

    - 选项 2：b. Kubernetes

    - 选项 3：c. Vagrant

    - 选项 4：d. Helm


    **正确答案：** 1


    **解析：** `Docker` 是一项可以将应用程序及其依赖和配置封装到容器中的技术。它是部署微服务的极佳选择，因为它确保每个服务都是可重复且可扩展的。


    ## 问题：Linux 内核启动时运行的第一个程序是什么？


    - 选项 1：init

    - 选项 2：shell

    - 选项 3：bootloader

    - 选项 4：BIOS/UEFI


    **正确答案：** 1


    **解析：** Linux 内核启动时运行的第一个程序通常是 `init` 程序。`init` 初始化系统、启动服务并设置环境。


    ## 问题：Linux 启动过程中的哪个组件加载了主内核？


    - 选项 1：引导加载程序 (Bootloader)

    - 选项 2：Shell (Shell)

    - 选项 3：init

    - 选项 4：BIOS/UEFI


    **正确答案：** 1


    **解析：** Linux 启动过程中加载主内核的组件是引导加载程序。引导加载程序（如 GRUB）负责在磁盘上定位内核镜像并在启动过程中将控制权交给它。


    ## 问题：Linux 中哪个工具可以用于测量磁盘输入输出统计信息？


    - 选项 1：iostat

    - 选项 2：top

    - 选项 3：ps

    - 选项 4：df


    **正确答案：** 1


    **解析：** Linux 中的 `iostat` 工具用于测量磁盘输入输出统计信息。它提供了磁盘利用率、I/O 等待等重要指标，帮助系统管理员监控和诊断磁盘性能。


    ## 问题：在 Linux 启动过程中，哪个脚本初始化了系统设置？


    - 选项 1：init

    - 选项 2：rc.local

    - 选项 3：init.d

    - 选项 4：systemd


    **正确答案：** 4


    **解析：** 在 Linux 启动过程中，`systemd` 初始化了系统设置。`systemd` 是一种现代 init 系统和服务管理器，已成为许多 Linux
    发行版的标准。它管理服务的启动和控制，取代了旧的 init 系统。


    ## 问题：哪种 Linux 工具允许你监控和管理系统 CPU 性能？


    - 选项 1：top

    - 选项 2：ls

    - 选项 3：cpustat

    - 选项 4：sysadmin


    **正确答案：** 1


    **解析：** `top` 命令是一种允许你监控和管理系统 CPU 性能的 Linux 工具。它提供了系统进程、CPU 使用情况、内存使用等的实时视图。你可以用它识别资源密集型进程并管理系统性能。


