    解析：在 CentOS 上，你可以使用 `rpm -q` 命令来检查特定包是否安装。该命令查询 RPM 数据库以确定该包是否已安装在系统中。


    ### 问题：在 Linux 中使用哪个命令行工具来查看实时系统进程？


    - 选项 1：`top`

    - 选项 2：`ls`

    - 选项 3：`cat`

    - 选项 4：`ps`


    **正确答案：1**


    解析：正确答案是“top”。`top` 命令是 Linux 中的一个实时系统监控工具，提供有关系统进程、CPU 使用率、内存使用率等信息。它允许用户交互式地监控和管理运行中的进程。


    ### 问题：Linux 中使用哪个命令来格式化新的磁盘分区？


    - 选项 1：`mkfs`

    - 选项 2：`fdisk`

    - 选项 3：`format`

    - 选项 4：`mkpart`


    **正确答案：2**


    解析：正确答案是“fdisk”。`fdisk` 命令用于在 Linux 系统上创建和管理磁盘分区。它不直接格式化分区，而是用于创建和管理分区结构。格式化通常使用
    `mkfs` 等工具完成。


    ### 问题：Linux 中 `df` 命令的主要目的是什么？


    - 选项 1：显示磁盘空间占用

    - 选项 2：列出目录中的所有文件

    - 选项 3：执行 shell 脚本

    - 选项 4：计算文件校验和


    **正确答案：1**


    解析：`df` 命令的主要目的是显示 Linux 系统上的磁盘空间占用。它提供了有关各种挂载文件系统的已用和可用磁盘空间的信息。该命令对于监控磁盘空间以防止溢出有用。


    ### 问题：`top` 命令输出中的哪一列代表进程的 CPU 使用百分比？


    - 选项 1：`%CPU`

    - 选项 2：`%MEM`

    - 选项 3：`PID`

    - 选项 4：`COMMAND`


    **正确答案：1**


    解析：在 `top` 命令的输出中，`%CPU` 列代表每个进程的 CPU 使用百分比。该列显示进程正在使用的 CPU 资源比例。


    ### 问题：在分区磁盘时，MBR 磁盘上的主分区限制是什么？


    - 选项 1：4

    - 选项 2：2

    - 选项 3：8

    - 选项 4：16


    **正确答案：1**


    解析：当使用主引导记录（MBR）分区方案划分磁盘时，最多可以创建 4 个主分区。这是 MBR 方案的限制，如果需要创建更多分区，需要使用扩展分区或逻辑分区。


    ### 问题：Linux 中可以使用什么命令查看磁盘的分区表？


    - 选项 1：`fdisk`

    - 选项 2：`lsblk`

    - 选项 3：`diskutil`

    - 选项 4：`parted`


    **正确答案：1**


    解析：`fdisk` 命令用于查看 Linux 中磁盘的分区表。它提供了磁盘分区的详细视图，包括它们的大小、类型等。


    ### 问题：Linux 中哪个命令显示磁盘占用的的可视化表示？


    - 选项 1：`ncdu`

    - 选项 2：`dd`

    - 选项 3：`du`

    - 选项 4：`df`


    **正确答案：1**


    解析：在 Linux 中显示磁盘占用视化表示的正确命令是 `ncdu`。它代表“NCurses Disk Usage”，提供磁盘占用的详细且交互式的视图，允许用户在目录间进行导航并识别占用空间的文件或文件夹。与其他选项不同，`ncdu`
    专门为这一目的设计的。


    ### 问题：在监控系统进程时，`top` 和 `htop` 之间的主要区别是什么？


    - 选项 1：`top` 是基础系统监控工具，而 `htop` 是高级的替代方案。

    - 选项 2：`top` 显示实时数据，而 `htop` 提供了更多的交互性和自定义性。

    - 选项 3：`top` 是文本的，而 `htop` 提供图形界面。

    - 选项 4：`top` 显示内存使用情况，而 `htop` 侧重于 CPU 使用率。


    **正确答案：2**


    解析：`top` 和 `htop` 之间的主要区别在于 `top` 显示系统进程的实时数据，而 `htop` 提供了更多的交互性和自定义性。`htop` 允许用户对进程进行排序和过滤，查看详细信息，并直接从界面向进程发送信号。虽然这两个工具都显示相似的信息，但
    `htop` 为进程监控提供了更用户友好且功能更丰富的体验。


    ### 问题：在磁盘分区的背景下，`LVM` 代表什么？


    - 选项 1：Logical Volume Manager（逻辑卷管理器）

    - 选项 2：Linux Virtual Machine（Linux 虚拟机）

    - 选项 3：Large Volume Memory（大容量内存）

    - 选项 4：Logical Virtual Machine（逻辑虚拟机）


    **正确答案：1**


    解析：在磁盘分区的背景下，`LVM` 代表“Logical Volume Manager”（逻辑卷管理器）。`LVM` 是一种允许在 Linux 中灵活管理磁盘空间的技术。它实现了动态调整、快照以及创建跨多个物理磁盘逻辑逻辑等功能。`LVM`
    是在复杂的 Linux 环境高效管理存储的重要工具。


    ### 问题：为了实时监控 I/O 统计和磁盘活动，在 Linux 中你会使用 ________ 命令。


    - 选项 1：`iostat`

    - 选项 2：`top`

    - 选项 3：`df`

    - 选项 4：`du`


    **正确答案：1**


    解析：要在 Linux 中实时监控 I/O 统计和磁盘活动，你需要使用 `iostat` 命令。它提供了有关输入和输出操作的详细信息，帮助你识别与磁盘 I/O
    相关的性能瓶颈。


    ### 问题：Linux 中用于调整分区文件系统大小的命令是 ________。


    - 选项 1：`resize2fs`

    - 选项 2：`mv`

    - 选项 3：`chmod`

    - 选项 4：`cp`


    **正确答案：1**


    解析：Linux 中用于调整分区文件系统大小的命令是 `resize2fs`。该命令在调整分区大小后用于调整文件系统以使用新可用的空间。


    ### 问题：如果你想查看每个目录磁盘占用详细信息，__________ 命令是合适的。


    - 选项 1：`du`

    - 选项 2：`df`

    - 选项 3：`ls`

    - 选项 4：`lsblk`


