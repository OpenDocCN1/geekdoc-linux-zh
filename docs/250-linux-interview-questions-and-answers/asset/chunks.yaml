    # 问题：哪种技术允许操作系统级虚拟化并产生多个用户空间实例？


    选项 1：`Containers`

    选项 2：`Virtual Machines`

    选项 3：`Hypervisor`

    选项 4：`KVM`


    **正确答案：1**


    解释：容器允许多个隔离立的用户空间实例运行在同一个内核上。它们共享宿主机内核但拥有独立的用户空间，因此轻量高效。Docker 和 Kubernetes 是流行的容器技术。


    # 问题：virt-manager 工具在虚拟化中扮演什么角色？


