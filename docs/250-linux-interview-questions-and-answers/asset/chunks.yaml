    解释：`tc` 命令用于监控和操作 Linux 中的 IP 流量控制。它允许你在网络接口上管理服务质量 (QoS)、带宽和流量整形，是网络管理员至关重要的工具。


    ### 问题：在网络故障排除的上下文中，`traceroute` 命令有助于确定什么？


    选项 1: 网络路径和跳数

    选项 2: 网络延迟和速度

    选项 3: 网络安全状态

    选项 4: 网络带宽利用率


