  md: '# Creating Bash Scripts – Part 2


    Previously we looked at creating your first Bash script, Hello World, and adding
    a system variable. Now you can expand these and see what you can do when you start
    to play around with creating your own unique variables.


    # VARIABLES


    Just in every other programming language a Bash script can store and call certain
    variables from the system, either generic or created.


    +   STEP 1 Let''s start by creating a new script called hello: xed hello.sh. In
    it editor: /bin/bash, then, echo hello $1. Save the file and exit Ved. In the
    Terminal make the script executable: chmod +x hello.sh.


    +   STEP 3 The output will now be Hello David. This is because Bash automatically
    assigns variables for the user, which are then held and passed to the script.
    The variable $1 holds ''Hello David''. You can change the variable by entering
    something different: /hello. Mint.


    ![](img/21ee864cf339a60c6b969b7bda291087_69_0.png)


    +   STEP 2 As the script is now executable, run it with ./hello.sh. Now, as you
    expected a simple ''Hello'' is displayed in the Terminal. However, if you then
    use the command with a variable, it gets interesting. For example, try ./hello.sh
    David.


    +   STEP 4 You can rename variables. Modify the hello script with the following:
    firstname=$1, surname=$2, echo Hello $firstname $surname. Put each statement on
    a new line. Save the script and exit back into the Terminal.


    ![](img/21ee864cf339a60c6b969b7bda291087_69_1.png)'
