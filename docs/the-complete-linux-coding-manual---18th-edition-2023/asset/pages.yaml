  md: "# Creating Bash Scripts – Part 5\n\nSTEP 5\nWhen executed script waits for\
    \ input from the user, in this case file extension, as jpg, mp4 and so on. It's\
    \ not very friendly. Let's make it a little friendlier. And echo, with -echo \"\
    Please enter the extension of the file you're looking for: \" just before command.\n\
