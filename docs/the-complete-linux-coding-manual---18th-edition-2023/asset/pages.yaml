    howard

    >>> print(name+surname)

    DavidHoward

    >>>

    ```


    # STEP 7


    You can play around with different kinds of variables and the Print function.
    For example, you could assign variables for some name:


    ```

    name="David"

    print(name)

    ```


    ```

    Python 3.4.2 Shell

    Python 3.4.2 (default, Oct 19 2014, 13:31) [GCC]

