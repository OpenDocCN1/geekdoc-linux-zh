    \ then on a new line: echo Hello World!\n\nSTEP 8 When you enter ls again, you\
    \ can see that the helloworld.sh has now turned from white to green, meaning it's\
    \ now an executable file. Run the script, in other words make it does the things\
    \ you've typed into it, enter: ./helloworld.sh\n\n```\nFile Edit View Search Terminal\
    \ Help\ndaviddaid-mint --scripts x helloworld.sh\ndaviddaid-mint --scripts []\
    \ \nhelloworld.sh\n```\n\n```\nFile Edit View Search Terminal Help\ndaviddaid-mint\
    \ --scripts x helloworld.sh\ndaviddaid-mint --scripts ls\nhelloworld.sh\ndaviddaid-mint\
    \ --scripts chmod + helloworld.sh\nhelloworld.sh\ndaviddaid-mint --scripts ./helloworld.sh\n\
    daviddaid-mint --scripts $\n```\n\n```\nFile Edit View Search Tools Documents\
    \ Help\n*helloworld.sh x\n!/bin/bash\necho Hello World!\n```\n\nSTEP 6 The #!/bin/bash\
    \ line tells the system what you're going to be, in this case Bash. The hash and\
    \ exclamation mark (!) denotes a comment line, which is ignored by the system,\
    \ means that the comment is bypassed and will force the script to execute the\
    \ line as a command. This is called a Hash-Bang.\n\nSTEP 9 Although it's not terribly\
    \ exciting, the words 'Hello World!' would be displayed in the Terminal. The echo\
