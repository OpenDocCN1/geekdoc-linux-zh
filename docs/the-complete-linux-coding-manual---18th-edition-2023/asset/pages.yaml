    # STEP 8


    Now let''s add a surname: surname="Howard",


    ```

    print(surname)

    ```


    You have two variables containing a first name and a surname and you can print
    them independently.


    ```

    Python 3.4.2 Shell

    Python 3.4.2 (default, Oct 19 2014, 13:31) [GCC]

    (GCC 4.9.2) on Linux

    Type "help" or "license" for more information.

    >>> name="David"

    >>> print(name)\David

    >>> surname="Howard"

    >>> print(surname)

    howard

    >>> print(name+surname)

    DavidHoward

    >>>

    ```


    # STEP 9


    If we were to use the same routine as before, using the + symbol, the name wouldn''t
    appear correctly in the Shell. Try it:


    ```

    print(name,surname)

    ```


    You need a space between the two, defining them as separate values and not that
    you mathematically play around.


    ```

    Python 3.4.2 Shell

    Python 3.4.2 (default, Oct 19 2014, 13:31) [GCC]

