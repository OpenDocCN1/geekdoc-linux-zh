  md: "# C++ on Linux\n\n# Common Coding Mistakes\n\nWhen you start something you're\
    \ inevitably going to make mistakes, this is purely down to inexperience and those\
    \ mistakes are great teachers in themselves. However, even experts make the occasional\
    \ mishap. It is, to learn from them as best as you can.\n\n# X=MISTAKE, PRINT\
    \ Y\n\nThere are many pitfalls for the programmer to be aware of, far too many\
    \ to be listed here. Being able to recognise and fix it is when you start to move\
    \ into more advanced territory, and become a better coder. Everyone makes mistakes,\
    \ even coders over thirty years' experience. Learning from these basic, common\
    \ mistakes help build a better coding foundation.\n\n![](img/21ee864cf339a60c6b969b7bda291087_143_0.png)\n\
    \n# SMALL CHUNKS\n\nIt would be wonderful to work like Neo from The Matrix movies.\
    \ Simply ask, your operator loads it into your memory and you instantly know everything\
    \ about the subject. Sadly though we can't do that. The first pitfall is trying\
    \ to learn too much, too quickly. So coding in small pieces and take your time.\n\
    \n# EASY VARIABLES\n\nMeaningful naming for variables is a must to eliminate common\
    \ coding mistakes. Having letters of the alphabet is fine but what when the code\
    \ states a problem with x variable. It's not too difficult to name variables,\
    \ lives, money 1 and so on.\n\n# //COMMENTS\n\nUse comments. It's a simple concept\
    \ but commenting your code saves so many problems when you come to look over.\
    \ Inserting comment lines helps you quickly sift through of code that are causing\
    \ problems, also if you need to review an older version of code.\n\n```\norig\
    \ j = 2;\ntarget j = 2;\n{\n}\n#endif\nif (n == 0)\n  return;\n// Loop unrolling,\
    \ here we begin;\n```\n\n# PLAN AHEAD\n\nWhile it's great to wake up one morning\
    \ and decide to code a classic text, it's not practical without a good plan. snippets\
    \ of code can be written without too much thought and planning longer and in depth\
    \ requires a good working plan to stick to and iron out your bugs.\n\n![](img/21ee864cf339a60c6b969b7bda291087_143_1.png)\n\
    \n```\n// if (n -3) is the greatest multiple of 4 r\n In the loop ahead\n```"
