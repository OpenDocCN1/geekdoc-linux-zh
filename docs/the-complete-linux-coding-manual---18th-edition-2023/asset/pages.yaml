  md: "# LOOPING\n\nYou can loop over data using the FOR, WHILE and UNTIL statements.\
    \ These can be handy if you're batch naming, copying\nor running a script where\
    \ a counter is needed.\n\nSTEP 1 Create a new script called count.sh. Enter the\n\
    text in the screenshot below, save and make it\nexecutable. This creates the variable\
    \ 'count' which at the beginning\nof script equals zero. Then the WHILE loop,\
    \ which WHILE\n is less than (the LT part) 100 will print the current value\n\
    of count in the echo command.\n\nSTEP 4 The UNTIL loop works much the same way\
    \ as the\nWHILE loop, more often than not, in reverse.\nOur counting to a hundred,\
    \ using UNTIL, will be until:\n[ count -gt 100 ]; The difference being, UNTIL\
    \ is count\nger than (the gt part) one hundred, kept on looping.\n\n```\ncount.sh\n\
    File Edit View Search Tools Documents Help\ncount.sh\n!/bin/bash\ncount=0\nwhile\
    \ [ $count -lt 100 ];\necho $count\nlet count=$((count+1))\ndone\n```\n\nSTEP\
    \ 2 Executing the count.sh script will result in\nnumbers 0 to 99 listing down\
    \ the Terminal;\nor it reaches 100 the script will end. Modifying the script with\
    \ the\nFOR statement makes it easier to use the same way. In order to\nscript,\
    \ enter the text from the screenshot into count.sh.\n\nSTEP 5 You're not limited\
    \ to numbers to one hundred.\nYou, within the loop, have whatever set of\ncommands\
    \ you like and execute them as many times as you want\nto loop to run. Renaming\
    \ files, creating fifty folders\nter example, this script will create folders\
    \ named 1 for\nner to 100 using the FOR loop.\n\n```\ncount.sh\nFile Edit View\
    \ Search Tools Documents Help\ncount.sh\n!/bin/bash\nfor count in {0..100}; do\n\
    echo $count\nlet count=$count+1\ndone\n```\n\nSTEP 3 The addition we have here\
    \ is: for count in\n{0..100}; do. Means: FOR the variable\n'count' IN the numbers\
    \ from zero to one hundred, then start the\nloop. The rest of the script is the\
    \ same. Run this script, and the\noutput should appear in the Terminal.\n\nSTEP\
    \ 6 Using the FOR statement once more, we can\nexecute the counting sequence by\
    \ manipulating the\n(0-100) part. The set of code actually means START-\nINCREMENT),;\
    \ if there's no increment it's just a single digit to\nthe END. For example, we\
    \ use the Loops to count up to 1000\ntwo's: for count in {0..1000..2}; do.\n\n\
    ```\ncount.sh\nFile Edit View Search Tools Documents Help\ncount.sh\n!/bin/bash\n\
    for count in {0..100..2}; do\necho $count\nlet count=$count+1\ndone\n```\n\n![](img/21ee864cf339a60c6b969b7bda291087_72_0.png)"
