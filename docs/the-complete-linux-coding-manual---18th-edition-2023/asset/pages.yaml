  md: '# Linux Tips and Tricks


    # MEMORY HOGS


    If you need to see what apps are, there''s a chance of consuming the most memory
    on


    Linux, simply enter:


    ```

    ps aux sort -rnk 4

    ```


    This sorts the output by system memory.


    # BBS


    Back in the days of dial-up connections, the entire world was made up of Bulletin
    Board Systems. These remote servers hung out for users to chat, swap code, play
    games and BBSs. Using Telnet, we can still connect to some active bbs.


    ```

    telnet bestallarbbs.dyndns.org

    ```


    There are countless BBS available, you can check out https://www.telnetebbs.com/bbs/list/detail/
    for more.


    ![](img/21ee864cf339a60c6b969b7bda291087_64_0.png)


    ![](img/21ee864cf339a60c6b969b7bda291087_64_1.png)


    # SHREDDER


    If you want to create a chance of someone with the right software retrieve it.
    However, to securely and permanently delete a file, use


    ```

    shred -zu NAMEFILE.txt

    ```


    Replace NAMEFILE with the name of the file to delete.


    # DIRECTORY TREE


    If you want to create an entire single command (or directory tree) you can use:


    ```

    mkdir -p New-Dir/{subfolder1,subfolder2,subfolder3,subfolder4}

    ```


    This creates a New-Dir with four sub folders.


    ![](img/21ee864cf339a60c6b969b7bda291087_64_2.png)


    ![](img/21ee864cf339a60c6b969b7bda291087_64_3.png)


    # FORGOTTEN COMMANDS


    It''s not easy trying to remember all the Linux commands. Thankfully, we can use
    apropos to help us by using this description of command:


    # ASCII


    art be quite striking when applied to some images. However, it''s difficult to
    get just right. You can create some great ASCII from the images you have by using
    img2txt:


    ```

    img2txt NAMEOFIMAGE.png

    ```


    Replace NAMEOFIMAGE with the actual name of the image file on your system. img2txt
    install installed, use:


    ```

    sudo apt-get install caca-utils.

    ```


    ![](img/21ee864cf339a60c6b969b7bda291087_64_4.png)


    ![](img/21ee864cf339a60c6b969b7bda291087_64_5.png)


