  md: "# Data Types\n\nVariables, as you have seen, store information that the programmer\
    \ can then call up, and manipulate if required. Variables are simply reserved\
    \ memory locations that store the values the programmer assigns, depending on\
    \ the data type used.\n\n# THE VALUE OF DATA\n\nThere are many different data\
    \ types available for the programmer in C++, such as an integer, float, Boolean,\
    \ character and so. It is widely accepted that there are seven basic data types,\
    \ often called Primitive Built-in Types; however, you can create your own data\
    \ types that need arise within your code.\n\n| Type | char |\n|---|---|\n| Integer\
    \ | int |\n| Floating Point | float |\n| Character | char |\n| Boolean | bool\
    \ |\n| Double Point | double |\n| Wide Character | wchar_t |\n| No Value | void\
    \ |\n\nthat by adding a count,precision() function and adding a value inside the\
    \ brackets then you're still limited by the accuracy of the double data type.\
    \ For example, this code:\n\n```\n#include <iostream>\nusing namespace std;\n\
    double PI = 3.14159265538979238463;\n\nint main() {\n    cout << PI;\n    return\
    \ 0;\n}\n```\n\nThese basic types can also be extended using the modifiers: Long,\
    \ Short, Signed and Unsigned. Basically means the modifiers can expand the minimum\
    \ and maximum range values for each data type. For example, the int type has a\
    \ default value of -2147483648 to 2147483647, a float value, you agree.\n\nNow,\
    \ if you were to use one of the modifiers, the others range\n\n+   * Unsigned\
    \ int = 0 to 4294967295\n* Signed int = -2147483648 to 2147483647\n* Short int\
    \ = -32768 to 32767\n* Unsigned short = 0 to 65535\n* Signed short = -32768 to\
    \ 32767\n* long int = -2147483648 to 2147483647\n* Signed long int = -2147483648\
    \ to 2147483647\n* Unsigned long int = 0 to 4294967295\n\nNaturally you can use\
    \ the basic type with the modifiers, as there is plenty of range provided with\
    \ each data type. However, it's good C++ programming practise to use the modifiers\
    \ when possible.\n\n```\nDataTypes.cpp\n1 #include <iostream>\n2 using namespace\
    \ std;\n3 double PI = 3.14159265538979238463;\n4 \n5 int main() {\n6 cout << PI;\n\
    7 return 0;\n8 }\n```\n\nThere are issues when using the modifiers. Double represents\
    \ a double-floating point value, which you can use for incredibly accurate numbers\
    \ but those are only accurate up to the twelfth decimal place. There's also the\
    \ problem with displaying numbers in C++, in fact that default outputs only the\
    \ first five decimal places. You can combat\n\nBuild and run the code, as you\
    \ can see the output is 3.14159, representing code's limitations in this case.\n\
    \nYou can also use the aforementioned count.precision function, for greater accuracy.\
    \ Take precision all value up to 22 decimal places, with the following code:\n\
    \n```\n#include <iostream>\nusing namespace std;\ndouble PI = 3.14159265538979238463;\n\
    \nint main() {\n    cout.precision(22);\n    cout << PI;\n}\n```\n\n![](img/21ee864cf339a60c6b969b7bda291087_133_0.png)"
