  md: '# Pi x Linux =

    The Perfect Combination


    ## The Raspberry Pi is a remarkable piece of hardware, and to help drive its potential
    it needs a remarkable operating system. Frankly, Linux is the default and recommended
    OS of choice for the Pi, and they make you a winning team.


    When the Raspberry Pi was in its developmental stages its designers needed to
    ensure that they were creating a piece of hardware that could offer more than
    simply a cheap, small, computer.

    The Pi needed to be flexible with what it could do, it needed to grow into more
    ambitious project projects and ideas, and it needed to do so as easy to use fashion
    as possible. The goal was to create a universal learning platform, that students
    of any age could tinker with while learning new concepts such as programming,
    electronics, and computing. Naturally, once the hardware was ready, the only choice
    of operating system was core, Linux.

    The versatility of Linux is legendary. This incredible OS is so malleable that
    it can be steered toward any aspect of computing, from supercomputing to robotics,
    the space industry to more terrestrial engineering; education and science, manufacturing
    and the internet. Think of an industry, and you will likely find a Linux installation
    somewhere in the background keeping it all together.


    ![](img/21ee864cf339a60c6b969b7bda291087_77_0.png)


    Raspian is the recommended operating system for the Raspberry Pi, a customised
    Debian-based distribution that comes packed with a collection of useful tools
    that cater for coding, electronics, and general computing duties. Alongside the
    apps are preloaded to help you get the most from it, including programming languages
    you can learn to use, and as well as hardware modules that will enable you to
    power and use the hardware items unique to the Pi. For example, there are Python
    modules that interact with the Raspberry Pi''s 40 GPIO, allowing you to create
    content for any of the Hardware Attached on Top devices.


    This combination is what makes the Raspberry Pi an excellent base for operations
    to learn not only coding, but also Linux in general. Raspberry, being Debian-based,
    will be able to run any of the Terminal commands listed in this book, as Linux
    Mint and Ubuntu are also Debian-based. And since it costs very little, you''re
    able to have both regular, Windows or mac computers, and have a Raspberry Pi as
    a headless (a powered device that doesn''t need a keyboard, mouse or monitor attached)
    computer from which you can connect to learn how to use Linux and how to code.


    ![](img/21ee864cf339a60c6b969b7bda291087_77_1.png)'
