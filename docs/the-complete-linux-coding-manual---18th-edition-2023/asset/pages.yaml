  md: "# # Creating and Removing Directories\n\n### STEP 5 The command to create directories\
    \ is logical, therefore you'll create the directory, and any subdirectories within.\
    \ However, if you want to create a directory and a sub-directory in a single command\
    \ make sure you're at `mkdir -p Temp/finances`. Now, cd Temp/ and to list the\
    \ directory.\n\n### STEP 8 Now that we've created some directories, let's see\
    \ about removing them. By start entering the directory and listing its contents\
    \ `cd testdir` then `ls`. The previously created reports sub-directory is present.\
    \ Now one way to remove it is `rmdir reports`, then `ls` to confirm it's not there.\n\
    \n```\n```\nFile Edit Search Terminal Help\ndavid@david-mint ~temp\ndavid@david-mint\
    \ $ mkdir -p Temp/finances\ncd Temp\nls\nmkdir finances\nls\nfinances\n```\n```\n\
    \n```\n```\nFile Edit Search Terminal Help\ndavid@david-mint ~temp\ndavid@david-mint\
    \ $ cd testdir\nls\nrmdir reports\nls\nrmdir testdir\nmkdir testdir\n```\n```\n\
    \n### STEP 6 The -p option is what enables the mkdir to create the sub-directory\
    \ as well as the parent directory. In Linux, commands follow the same structure:\
    \ Command, Option, and Argument. In the previous example stated, command (mkdir),\
    \ option (-p), and argument (Temp/finances).\n\n### STEP 9 A quick warning: removing\
    \ a directory in the Terminal doesn't place it in the Mint Rubbish Bin, via Nemo\
    \ file manager. The same goes for any files, if you remove a directory from the\
    \ Terminal then it's gone for good.\n\n```\n```\nFile Edit Search Terminal Help\
    \ $ david@david-mint $ mkdir -p Temp/finances\n```\n```\n\n```\n```\nFile Edit\
    \ Search Terminal Help\ndavid@david-mint ~ cd testdir\nls\ndavid@david-mint ~\
    \ rmdir reports\nls\ndavid@david-mint ~ rmdir testdir\ndavid@david-mint ~ mkdir\
    \ testdir\n```\n```\n\n### STEP 7 If you want to drill into the various options\
    \ available for the mkdir command, you can enter `mkdir --help` in the Terminal.\
    \ This will provide a quick guide to the options and how the command structure\
    \ works.\n\n### STEP 10 Rmdir will only remove empty directories containing sub-directories,\
    \ or even files, you'll need to use the rm command with the -R option. For example,\
    \ on the Temp directory, use `rm -R Temp`. A quick reveals shows that the folder\
    \ and all of its contents are removed.\n\n```\n```\nFile Edit Search Terminal\
    \ Help\ndavid@david-mint $ mkdir --help\nusage: mkdir [OPTIONS] [DIRECTORY...]\n\
    \noptions:\n  --parents, -p      make parent directories as needed\n  --no-ctime\
    \         do not update file access time\n  --mode=MODE, -m    set file permissions\n\
    \  --verbose, -V      print what is being done\n  --preserve=ROOT    do not remove\
    \ root-prefixed directories\n  --output-directory -n     output a list of what\
    \ has been created\n  --context=CONTEXT  set SELinux security context if specified\
    \ by the SELinux policy database\n  --help             display help information\
    \ and exit\n  --version          display version and exit\n```\n```\n\n```\n```\n\
    File Edit Search Terminal Help\ndavid@david-mint $ rm -R Temp\n```\n```\n\n![](img/21ee864cf339a60c6b969b7bda291087_58_0.png)\n\
    \nGNU coreutils help -http://www.gnu.org/software/coreutils/\nFull list of all\
    \ commands available via man info: (coreutils) invocation/\n\nwww.pcpublications.com\
    \ 59"
