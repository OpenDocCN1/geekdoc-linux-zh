  md: '# # Why Linux?


    ![](img/21ee864cf339a60c6b969b7bda291087_8_0.png)


    There are thousands of free packages available for programmers under Linux.


    in some offer others need a security facility, a gaming spin, or something directed
    towards students. This extensibility makes Linux a very appealing platform to
    use, as you could modify the system into a development buoy, including many different
    IDEs for the likes of Python, development, C++, and so on; or create a base for
    anonymity, perhaps as a Minecraft server, media centre and more.


    Another remarkable advantage for those looking to learn how to code, is that Linux
    has most of the coding languages built in. Both Python and C++ are preinstalled
    in a high percentage of Linux distros, which means you can start to program as
    soon as you install the system and use it for the first time.


    Generally Linux does not take up as many system resources as Windows or macOS;
    since it uses resources we mean memory, hard drive space and CPU load. The Linux
    load can be seen lower than those those resources. A more efficient system of
    course means more available resources for the coding and testing and the programs
    you eventually create. Less use of resources also means you can use Linux on older
    hardware that normally struggle or even


    Each distro offers something unique to the user but all have Linux at the core.


    refuse to run the latest versions of Windows or macOS; so than throwing away an
    old computer, it can be reused with a Linux distro.


    It''s not all about C++, Python or any of the other popular programming languages.
    Using the command line of Linux, also called Terminal, you are able to create
    Shell scripts, which are programs that are designed to run from the command line
    and made used to automate after the user some form of input and output for a certain
    operation.


    Finally, although there are many more advantages we can list, there are thousands
    of free programs and apps available as known, there are (at the time of writing)
    8,700 free programming applications on Linux Mint and an incredible 62,000+ features
    ranging from almost to Radio


    Linux then, is a great resource for learning and evolving. It''s perfectly suited
    for developers and is continuously improving. If you''re serious about getting
    into coding, or you want to try something new, Linux offers a try and see how
    it works for you.


