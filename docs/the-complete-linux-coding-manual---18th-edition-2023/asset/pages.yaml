  md: "# Data Types\n\n```\nDataTypes.cpp\n1 #include <iostream>\n2 using namespace\
    \ std;\n3 double PI = 3.14159265385973238463;\n4 \n5 int main() {\n6 \n7 cout\
    \ << precision(22);\n8 cout << PI;\n9 }\n10\n```\n\nThis is mainly due to the\
    \ conversion from binary in the compiler and that the IEEE 754 double precision\
    \ standard occupies 64-bits of data, which 52-bits are dedicated to the sign(the\
    \ significant digits in a floating-point number) and 3.5-bits are taken holding\
    \ the values 0 to 9. If you divide 53 by 3.5, you get 15.12857, which is 15 digits\
    \ of precision.\n\nTo be honest, if you're creating code that needs to be accurate\
    \ more than fifteen decimal places, then you would not be using C++, you would\
    \ use some scientific language with C++ as the connective tissue between the two\
    \ languages.\n\nYou can create your own data types, using an alias-like system\
    \ called typedef.\n\nAgain build and run the code, as you can see from the line\
    \ window, the number represented by the variable PI is different from the number\
    \ you told C++ to use in variable. The output reads the value of Pi as 3.1415926538597311998,\
    \ with the numbers going away from the fifteenth decimal place.\n\n```\n#include\
    \ <iostream>\nusing namespace std;\ntypeef int metres;\n```\n\n```\nint main()\
    \ {\n\nmetres distance;\ndistance = 15;\ncout << \"distance in metres is: \" <<\
    \ distance;\n```\n\n# Scientific\n\n# 15.4285714285714285714285714\n\n| DEG |\
