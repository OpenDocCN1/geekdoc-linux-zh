  md: "# Variables\n\nVariables differ slightly when using C++ as opposed to Python.\
    \ In Python, you can simply state that 'a' equals 10 and a variable is assigned.\
    \ However, in C++ a variable has to be declared with its type before it can be\
    \ used.\n\n# THE DECLARATION OF VARIABLES\n\nYou can declare a C++ variable by\
    \ using statements in the code. There are several distinct types of variable you\
    \ can declare. Here is how it works.\n\n+   * STEP 1 Open a new, blank C++ file\
    \ and enter the usual code headers:\n\n```\n#include <iostream>\nusing namespace\
    \ std;\nint main()\n{}\n```\n\n+   * STEP 3 You can build and run the code but\
    \ it won't do much, other than store the variables 10 and 5 to the integers a\
    \ and b. Ignore the warnings about variables set but not used, the code still\
    \ works. Output the contents of the variables, add:\n\n```\ncout << a;\ncout <<\
    \ \"\\\";\ncout << b;\n```\n\nThe cout << \"\\\"; part places a new line between\
    \ the output of 10 and 5.\n\n| Variables.cpp |\n| #include <iostream>\nusing namespace\
    \ std;\nint main()\n{\n    int a;\n    int b;\n}\ncout << a;\ncout << \"\\\";\n\
    cout << b;\ncout << b;\n\n+   * STEP 2 Start by creating variables, a and b, with\
    \ one having a value of 10 and the other 5. Use the data type int to declare these\
    \ variables. Within the curly brackets:\n\n```\nint a;\nint b;\na = 10;\nb = 5;\n\
    ```\n\n```\nint result;\nresult = a + b;\ncout << result;\n```\n\nInsert the above\
    \ into the code as the screenshot.\n\n| Variables.cpp |\n| #include <iostream>\n\
    using namespace std;\nint main()\n{\n    int a;\n    int b;\na = 10;\nb = 5;\n\
    }\n\n![](img/21ee864cf339a60c6b969b7bda291087_131_0.png)\n\n132 Linux Coding &\
    \ Programming"
