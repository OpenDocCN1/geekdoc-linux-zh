    +   * STEP 3

    Resolve the code and execute it. You can see that the output in the IDLE Shell
    is the same as before, despite the extra lines being added. Simply put, the hash
    symbol (#) denotes a line of text the programmer can insert to inform them, and
    others, of what''s going on without the user being aware.


