    # User Input


    We''ve seen some basic user interaction with the code from a few examples earlier,
    so now would be a good time to focus solely on how you would get information from
    the user then and present it.


    # USER FRIENDLY


    The type of input you want from the user will depend greatly on the type of program
    you''re coding. For example, a game may ask for a character''s name, whereas a
    database can ask for personal details.


