  md: "# Structure of a C++ Program\n\nCOMMENTS Lines that begin with a double slash\
    \ comments. This means they won't be executed and are ignored by the compiler.\
    \ Comments are designed to help you, or another programmer looking at your code,\
    \ explain what's going on. There are two types of comment: // covers multiple\
    \ line comments and /* */ single line.\n\n<< The chevrons used here are insertion\
    \ operators. This means whatever follows the chevrons is inserted into the code:\
    \ std::cout. In this case they're the 'Hello, world!' which is to be displayed\
    \ on the screen when you compile and execute the code.\n\n```\nhelloworld.cpp\n\
    #include <iostream>\nint main() {\n    //My first C++ program\n}\n```\n\n```\n\
    helloworld.cpp\n#include <iostream>\nusing namespace std;\nint main() {\n    //My\
    \ first C++ program\n    cout <<;\n}\n```\n\nSTD While stands for something quite\
    \ different, in C++ it means Standard. It's part of the Standard Namespace in\
    \ C++, which covers a number of different statements and commands. You can leave\
    \ the std part out of the code but it must be declared at the start with using\
    \ namespace std, not both. For example:\n\nOUTPUTS Leading on, the \"Hello, world!\"\
    \ is what you want to appear on the screen when the code is executed. You can\
    \ enter whatever you like, as long as it's inside the quotation marks. Sometimes\
    \ brackets are needed, depending on the compiler. The \\ part indicates a new\
    \ line to be inserted.\n\n```\n#include <iostream>\nusing namespace std;\nint\
    \ main() {\n    //My first C++ program\n}\n```\n\n```\n//My first C++ program\n\
    cout << \"Hello, world!\\n\"\n```\n\n```\nhelloworld.cpp\n#include <iostream>\n\
    int main() {\n    //My first C++ program\n    std::cout << \"Hello, world!\\n\"\
    ;n}\n```\n\nCOUT In this example we're using cout, which is a part of the Standard\
    \ Namespace, hence why it's there, you're able to use it from that particular\
    \ namespace. Cout Character Output, which displays, prints something to the screen.\
    \ If you leave it out, you have to declare it at the start of the code, as mentioned\
    \ previously.\n\n; AND ) Finally you can see that lines within a function block\
    \ (enclosed) end with a semicolon. All statements in C++ must have one at the\
    \ end or the compiler fails to build the code. The last line has the closing brace\
    \ to indicate the end of the main function.\n\n```\nhelloworld.cpp\n#include <iostream>\n\
    using namespace std;\nint main() {\n    //My first C++ program\n    cout <<;\n\
    }\n```\n\n```\nhelloworld.cpp\n#include <iostream>\nusing namespace std;\nint\
    \ main() {\n    //My first C++ program\n    cout << \"Hello, world!\\n\";n}\n\
    ```\n\nLinux Coding & Programming 125"
