  md: '# Using the Terminal


    # More Fun Things to do in the Terminal


    If the previous list of fun, and quite bizarre, things to do in the Terminal has
    you wanting more, you''re in luck. We''ve put together another batch of some useful,
    and some not so useful, commands for you to try out.


    MORE FUN, YAY

    Since the Terminal session is already open and your keyboard digits are nicely
    warmed up, here are another two pages of Terminal nonsense.


    +   STEP 1 Remember the ZX Spectrum dreams of computing, when you type in 10 to
    print "Hello", yes in Linux Mint you can do the same. Simply enter yes followed
    by some text, i.e. `Linux is ice`. It''ll keep going until you press Ctrl+C.


    +   STEP 3 Having a little white cat chase your mouse pointer around the desktop
    may sound like a terrible waste of time. Odd though, it isn''t. `sudo apt-get
    install oneko`, then type `oneko` to have the cat. Your ''mouse'' cursor around
    the screen and the cat will chase it. Use Ctrl+C to exit the action.


    ```

    File Edit View Search Terminal Help

