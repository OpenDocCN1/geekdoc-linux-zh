  md: '# # How to Set Up Python in Linux


    While the Raspberry Pi''s operating system contains the latest, stable version
    of Python, other Linux distros do not come with Python 3 preinstalled. If you''re
    not going down the Pi route, then here''s how to check and install Python for
    Linux.


    # ## PYTHON PENGUIN


    Linux is a versatile operating system that it''s often difficult to nail down
    one way of doing something. Different distributions go about installing software
    in different ways, so we''re sticking with Linux Mint for this particular tutorial.


    +   **STEP 1** First need to ascertain version of Python is currently installed
    in your Linux system. To begin, drop into a Terminal session from your distro''s
    menu or hit Ctrl+Alt+T.


    +   **STEP 3** In our case we have both Python 2 and 3 Installed; as long as Python
    3.x.x is installed, the code in our tutorials will work. It''s always worth checking
    to see if the distro has been updated with the latest versions, so enter: `sudo
    apt-get sudo apt-get upgrade` to update the system.


    ```

    david@david-Mint: ~$

    ```


    ![](img/21ee864cf339a60c6b969b7bda291087_89_0.png)


    +   **STEP 2** Next enter `python --version` in the Terminal. You should have
    the output relating to version 2.x of Python in your display. By default, most
    Linux distros come with Python 2 and 3, so there are plenty of code still available
    for Python 2. Now enter: `python3 --version`.


