  md: '# Creating Bash Scripts - Part 4


    # CREATING A BACKUP TASK SCRIPT


    One of the most well used examples of Bash scripting is the creation of a backup
    routine, that operates the task as well as adding some customizations along the
    way.


    STEP 1 A very basic backup script would look something along the lines of: /bin/bash,
    then tar cvf ~/backups/my-backup.tgz ~/Documents. This will create a compressed
    file of the /Documents folder, with everything in it, and put it in a folder /backups
    with my name my-backup.tgz.


    STEP 4 Once the /backups folder is created, we can now create a new subfolder
    within it at the beginning. mkdir -p $DEST/$(Day $Month $Year). It''s here that
    you put the backup file to date/month year.


    ![](img/21ee864cf339a60c6b969b7bda291087_74_0.png)


    ![](img/21ee864cf339a60c6b969b7bda291087_74_1.png)


    STEP 2 While perfectly, we can make the script a lot more interactive. Let''s
    begin with defining some variables. Enter the text in the screenshot to a new
    bash script. Since we''ll probably misspell ''source'' as ''sauce'', this is because
    there is a built-in command ''source'' which differs depending on your os.


    STEP 5 With everything in, you can now enter the actual backup routine, based
    on the tar command from Step 5. Combined with the variables, we use: tar cvf $DEST/$(Day
    $Month $Year)/Backup.tgz In the screenshot, we added a handy "Backing up..." echo
    command.


    ![](img/21ee864cf339a60c6b969b7bda291087_74_2.png)


    ![](img/21ee864cf339a60c6b969b7bda291087_74_3.png)


    STEP 3 The previous script allowed you to create a Time Stamp, so you know when
    the backup file was taken. We will now create a ''dest'' variable, which is the
    folder and add some code to check if the ~/backups folder exists, if not, then
    creates it.


    STEP 6 Finally, you can add a friendly message: echo "Backup complete. ..." The
    completed script is now too over-complex and it can be easily customised to include
    any folder within your Home area, as well as the Home area itself.


    ![](img/21ee864cf339a60c6b969b7bda291087_74_4.png)


    ![](img/21ee864cf339a60c6b969b7bda291087_74_5.png)


    Linux Coding & Programming 75'
