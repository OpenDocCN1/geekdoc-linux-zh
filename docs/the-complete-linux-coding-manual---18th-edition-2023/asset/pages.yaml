  md: "# C++ COMMENTS\n\nCommenting in C++ involves using a double forward slash '//'\
    \ or a forward slash and an asterisk '/*'. You've already seen brief examples\
    \ but this is how it works.\n\n+   STEP 1 Using the Hello World as an example,\
    \ you can easily comment on different sections of the code using the double forward\
    \ slash:\n\n```\n// My first C++ program cout << \"Hello, world!\\\"\n\nhelloworld.cpp\n\
    #include <iostream>\nusing namespace std;\nint main() {\n    // My first C++ program\n\
    \    cout << \"Hello, world!\\\"\n    cout << \"And Greetings from C++!\\\"\n\
    }\n```\n\n+   STEP 4 Be careful when commenting, especially with comments. it's\
    \ very easy to forget to add the closing asterisk and forward slash thus negate\
    \ any code that falls inside the comment block.\n\n```\nhelloworld.cpp X\n#include\
    \ <iostream>\nusing namespace std;\nint main() {\n    // First C++ program\n \
    \   cout << \"Hello, world!\\\"; This line outputs the words 'hello, world'\n\
    \    // This comment\n    comment lines\n    without the need to add more slashes\n\
    }\nout << \"And Greetings from C++!\\\"\n```\n\n+   STEP 2 However you can also\
    \ add comments to the end of a line, to describe in a better way what goes:\n\n\
    cout << \"Hello, world!\"; This line outputs the words 'hello, world.' The \\\
    \ denotes a new line.\n\nNote, you do not put a semicolon at the end of a comment.\
    \ This is because it is a line that gets ignored by the compiler.\n\n```\nhelloworld.cpp\
    \ X\n#include <iostream>\nusing namespace std;\n\\int main() {\n    // My first\
    \ C++ program\n    cout << \"Hello, world!\\\"; This line outputs the words 'hello,\
    \ world.' The \\n denotes a new line.\n    // This comment\n    comment lines\n\
    \    without the need to add more slashes\n}\nout << \"And Greetings from C++!\\\
    \"\n```\n\n+   STEP 5 Obviously if you want to try and build the code errors out,\
    \ complaining of a missing curly '}' just a few times, then it can be time to\
    \ go back and rectify. The colouring in code editor helps you identify where the\
    \ comments are.\n\n```\nSymbol helloworld.cpp X\nFunctions\n#include <iostream>\n\
    using namespace std;\nint main() {\n// My first C++ program\n// This comment\n\
    \    comment lines\n    without the need to add more slashes\nout << \"And Greetings\
    \ from C++!\\\"\n```\n\n+   STEP 3 You can comment out lines by using the forward\
    \ slash and asterisk:\n\n> // This comment\ncover several lines\nwithout the need\
    \ to add more slashes /*\n\nJust remember to finish the block with the opposite\
    \ asterisk and forward slash.\n\n```\nhelloworld.cpp X\n#include <iostream>\n\
    using namespace std;\nint main() {\n    // My first C++ program\n    cout << \"\
    Hello, world!\\\"; This line outputs the words 'hello, world.' The \\n denotes\
    \ a new line.\n    // This comment\n    comment lines\n    without the need to\
    \ add more slashes\n}\nout << \"And Greetings from C++!\\\"\n```\n\n+   STEP 6\
    \ With block comments, it's good practice in C++ to add an asterisk to each new\
    \ line of the comment to close the block before continuing with the code:\n\n\
    > // This comment\ncover several lines\nwithout the need to add more slashes /*\n\
    \nThankfully, Geany does this automatically but beware of it using other IDEs.\n\
    \n> / This comment can\ncover several lines\nwithout the need to add more slashes\
    \ /*"
