  md: '# # Creating a File Using the Terminal


    ### STEP 5 Let''s say you now wanted to create a file, we''ll call it Test2.txt,
    with some content to do. Do so: `cat > Test2.txt`. This will create the file **Test2.txt**
    and put the Terminal into an editing mode.


    ### STEP 8 Xed is a GUI app, and you can enter and save the file, or any other,
    by using the app''s main window, and the **File > Save**, or **File > Save As**
    functions from its top menu bars.


    ![](img/21ee864cf339a60c6b969b7bda291087_56_0.png)


    ### STEP 6 You''ll notice that the cursor is flashing below the `cat > Test2.txt`
    command. now will enter. This prompt will allow you to edit the file that has
    content. Enter text, then press **Ctrl+D** to save and exit contents to the file.


    ### STEP 9 If, however, you prefer to remain within the Terminal to edit/save/create
    files, you can use Nano. Nano is a simple Terminal-based text editor. To try it
    by opening **Test2.txt**, you''ll see a menu at the bottom of the screen. Press
    **Ctrl+X** to follow the on-screen instructions.


    ```

    ```

    $ cat > Test2.txt

    Hello world!

    $ (Ctrl+D to save)

    ```

    ```


    ![](img/21ee864cf339a60c6b969b7bda291087_56_1.png)


    ### STEP 7 Of course you don''t always have to use a Terminal to enter into a
    file. Mint comes with an editor Xed, which is similar to Windows Notepad. To view
    the previously created file in Xed, type in the Terminal: `xed Test2.txt` and
    press Enter.


    ### STEP 10 We''ve used the Terminal to launch a Mint app, Xed, but any app can
    be launched from the Terminal. For example, **firefox** and press **Enter** to
    return to the Terminal. Providing you the name of the app, it can run from the
    Terminal. Additionally, entering **firefox** allows you to fire Firefox, AND lets
    you use still the Terminal.


