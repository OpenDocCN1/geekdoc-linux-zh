  md: "# User Interaction\n\nThere's nothing quite as satisfying as creating a program\
    \ that responds to you. This basic user interaction is one of the most taught\
    \ aspects of any language and with it you're able to do much more than simply\
    \ greet the user by name.\n\n# HELLO, DAVE\n\nYou have already used cout, the\
    \ standard output stream, throughout our code. Now you're going to be using cin,\
    \ the standard input stream, to produce a response.\n\n+   - STEP 1 Anything that\
    \ you want the user input into the program needs to be stored somewhere in the\
    \ system memory, so it can be retrieved and used. Therefore, any input first be\
    \ declared as a variable, so it's ready to be used by the user. Start by creating\
    \ a C++ file with headers.\n\n+   - STEP 3 The cin command works in the opposite\
    \ way from the cout command. With the first cout line you're output to the screen,\
    \ as indicated with the chevrons. Cin uses facing chevrons, indicating an input.\
    \ The input is put into the integer variable and angled in the second cout command.\
    \ Build and run the code.\n\n```\nuserinteraction.cpp\n#include <iostream>\nusing\
    \ namespace std;\nint main() {\n\n}\n```\n\n```\nsh\nFile Edit Tabs Help\nwhat\
    \ is your age: 45\nYou are 45 years old.\nprogram exited with code: 0\nreturn\
    \ to continue\n```\n\n+   - STEP 2 The data type of the variable must match the\
    \ type of input you want from the user. For example, to ask them their age, you\
    \ would use an input like this:\n\n```\n#include <iostream>\nusing namespace std;\n\
    int main() {\n    int age;\n    cout << \"What is your age: \";\n    cin >> age;\n\
    \    cout << \"nYou are \" << age << \" years old.\\n\";\n}\n```\n\n+   - STEP\
    \ 4 If you're asking a question, you need to store the input as a string; to ask\
    \ them their user name, you would\n\n```\n#include <iostream>\nusing namespace\
    \ std;\nint main() {\n    string name;\n    cout << \"What is your name: \";\n\
    \    cin >> name;\n    cout << \"Hello, \" << name << \". I hope you're well today!\\\
    \";\n}\n```\n\n```\nuserinteraction.cpp\n#include <iostream>\nusing namespace\
    \ std;\nint main() {\n    int age;\n    cout << \"What is your age: \";\n    cin\
    \ >> age;\n    cout << \"\nYou are \" << age << \" years old.\\n\";\n}\n```\n\n\
    ```\nuserinteraction.cpp\n#include <iostream>\nusing namespace std;\nint main()\
    \ {\n    string name;\n    cout << \"What is your name: \";\n    cin >> name;\n\
    \    cout << \"nHello, \" << name << \". I hope you're well today!\\n\";\n}\n\
    ```\n\n![](img/21ee864cf339a60c6b969b7bda291087_139_0.png)"
