  md: '# # Creating Bash Scripts

    – Part 1


    Eventually, as you learn within the Terminal with Mint, you''ll want to start
    creating your own automated tasks and programs. These are essentially scripts,
    Bash Shell scripts to be exact, and they work in the same way as a DOS Batch file
    does, or any other programming language.


    # ## GET SCRIPTING


    A Bash script is simply a series of commands that Mint will run through to complete
    a certain task. They can be remarkably complex, and it depends on the situation.


    +   **STEP 1** You''re working within the Terminal and with a text editor throughout
    the coming pages. There are alternatives to the text editor, which we''ll look
    at in a moment but for the sake of ease, we will be doing our examples in Xed.
    Before you begin, however, run through the custom update check: `sudo apt-get
    update && sudo apt-get upgrade`


    ```

    File Edit View Search Terminal Help

    daviddavidmint ~ sudo apt-get update && sudo apt-get upgr

