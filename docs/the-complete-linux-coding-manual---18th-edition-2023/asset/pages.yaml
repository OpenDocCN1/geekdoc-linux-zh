    ```


    +   STEP 2 The Matrix was one of the most graphically copied films ever; there''s
    a version of the matrix code for Linux Mint. Install it with: `sudo apt-get install
    matrix`. When it''s done enter: `matrix` and follow the white rabbit, Neo. Unlike
