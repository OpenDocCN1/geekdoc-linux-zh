  md: '# # Installing Linux on a PC


    Most distros come as a Live Environment. In this way you can boot into an actual,
    fully-working distro from the DVD or USB that you created. Let''s see how that
    works and how you go about installing Linux from there.


    # ## UEFI BIOS


    The Unified Extensible Firmware Interface (UEFI) is used to identify and protect
    a PC during its boot-up process. It replaces the traditional BIOS and can cause
    issues installing Linux.


    +   - **STEP 1** Insert your DVD or USB flash drive into your PC, and if you haven''t
    already, shutdown Windows. In this instance we''re using the USB boot media but
    the process is virtually identical. Start the PC and when prompted press keys
    to enter BIOS or SETUP, for example: F2, Del or F12.


    +   - **STEP 3** With UEFI turned to Legacy mode, there are two ways of booting
    into the Live Environment. The first is via BIOS you''re already in. Locate the
    Boot Sequence and change the first boot device from its original setting, usually
    Internal HDD or similar; to USB Storage Device for the USB media option, or DVD
    Drive for the media option.


    ![](img/21ee864cf339a60c6b969b7bda291087_21_0.png)


    +   - **STEP 2** There are different versions of UEFI BIOS, so covering all might
    be impossible. What you''re looking for is a section that details the Boot Sequence
    or Boot Mode. Here you have the option to turn OFF UEFI and choose Secure Boot.
    Most distros work with UEFI but it can be a tricky process to enable.


    +   - **STEP 4** Alternatively use the Boot Menu Option. With this you can press
    F12 (or something similar) to display a list of boot media options; from there
    you can choose the appropriate boot media. Here you can now Save and Exit the
    BIOS by saving to the Save & Exit option and choosing ''Save Changes and Exit''


    ![](img/21ee864cf339a60c6b969b7bda291087_21_1.png)


    ![](img/21ee864cf339a60c6b969b7bda291087_21_2.png)'
  merge: -1
