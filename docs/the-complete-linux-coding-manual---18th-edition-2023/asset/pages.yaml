  md: '# Creating and Removing Directories


    As with creating files in the Terminal, you can also create and delete directories,
    or folders if you prefer. Directories form the structure of your file system,
    without logical directories the filing system would be in utter chaos.


    # MANAGING FOLDERS


    Learning how to create and delete folders in the Terminal is an important Mint,
    and indeed Linux overall, skill to master. Here’s the basics for you to try out.


    +   STEP 1 With the Terminal open cd - to make sure you''re in your own Home directory.
    Now enter is to view the current folders you have housed in the Home directory.
    You''ll notice that folders are labelled in Mint (cyan light blue). Let''s start
    creating a new directory: mkdir testdir.


    +   STEP 3 If you were to enter the command again, mkdirdir cannot create directory
    ''testdir'': you will receive a message: mkdir is case-sensitive; without saying
    that, you''re only able to have one uniquely named directory within the current
    directory. However, as Linux is case-sensitive, you''ll have testdir, testdir,
    and so on.


    ![](img/21ee864cf339a60c6b969b7bda291087_57_0.png)


    ```

    File Dd View Search Terminal Help

    david-david-mint $ ls

    Desktop  Downloads  Music Pictures Public Templates Test Videos Cl

    david-david-mint $ ls

    david-david-mint $ mkdir testdir

    ```


    ![](img/21ee864cf339a60c6b969b7bda291087_57_1.png)


    +   STEP 2 If you now enter is again, you''ll see that the new directory, testdir,
    has been created alongside the other directories in the Home area. Obviously the
    command mkdir is what it creates, the directory you''ve already guessed stands
    for Make Directory.


    +   STEP 4 You can create directories within directories you''ve already created.
    For example, the testdir with cd testdir/ and ls the folder structure. Naturally
    there’s nothing present, as you go back to Home with cd - and enter mkdir testdir/reports.
    Go back to the testdir, cd _, and ls again.


    ![](img/21ee864cf339a60c6b969b7bda291087_57_2.png)


    ```

    File Dd View Search Terminal Help

    david-david-mint $ cd testdir/

    david-david-mint $ ls

    Desktop  Downloads  Music Pictures Public Templates Test Videos Cl

    david-david-mint $ mkdir reports

    david-david-mint $ cd reports

    david-david-mint $ ls

    david-david-mint $ cd ~/testdir $

    ```


    ![](img/21ee864cf339a60c6b969b7bda291087_57_3.png)


    **'
