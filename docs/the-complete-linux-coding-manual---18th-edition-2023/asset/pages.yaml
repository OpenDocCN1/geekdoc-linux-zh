    STEP 8 The previous steps create the variable StartLives, which is a global variable.
    In a game, for example a player''s lives go up or down depending on how or bad
    they''re doing. When the player restarts the game, the StartLives returns to its
    default state 3. Here we assigned 3 lines, then subtracting 2 lives left:


    ```

    Variables.cpp

    #include <iostream>

    using namespace std;

    int StartLives = 3;

    int main() {

    int a = 10;

    int b = 5;

    int result = a + b;

    cout << "program exited with code: " << result << endl;

    return continue;

    }

    ```


    ```

    Variables.cpp

    #include <iostream>

    using namespace std;

    int StartLives = 3;

    int main() {

    StartLives -= 1;

    cout << "program exited with code: " << result << endl;

    return continue;

    }

    ```


    STEP 6 Specific to C++, you can also use the following to assign values to a variable
    as soon as you declare them:


    int a (10);

    int b (5);


