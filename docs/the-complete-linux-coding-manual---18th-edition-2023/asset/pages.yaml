    \ many ways.\n\n# ## EASY AUTOMATION AND HANDY SCRIPTS\n\nEntering line after\
    \ line of commands to retrieve system information, find a file or rename a batch\
    \ of files? A script is better answer.\n\n+   **STEP 1** Let's try creating a\
    \ script to display the Mint system information; always a thing to have. Create\
    \ a new script called sysinfo.sh and enter into Nano, or of the text editor.\n\
    \n```\n```bash\n#!/bin/bash\n\n# information:\necho \"Hostname: $(hostname)\"\n\
    \n# file system usage\necho \"Disk usage: $(df -h)\"\n\n# free and used memory\n\
    echo \"Memory: $(free -m)\"\n\n# uptime and performance\necho \"Uptime: $(uptime)\"\
    \n\n# currently logged in\necho \"Users: $(who)\"\n\n# top five processes being\
