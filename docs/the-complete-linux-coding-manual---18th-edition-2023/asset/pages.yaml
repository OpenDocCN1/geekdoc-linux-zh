  md: '# CINNAMON ON THE MENU


    Now the Software Rendering Issue for Virtualbox is out of the way, let''s take
    a look at the Mint Menu and how it works. Remember, this is just for Mint Cinnamon,
    other distros look and behave differently.


    # STEP 1


    First off, you may have already noticed the Welcome Screen that pops up when you
    login Linux Mint. Take a moment to browse through the options, read the First
    Steps and so on. When you''re done, click the X in the top corner of the window
    to close.


    # STEP 4


    Open the Menu again but this time hover the mouse pointer over Graphics, then
    click on GNU Image Manipulation Program. GIMP is a powerful manipulation app that''s
    as effective as Adobe''s Photoshop but requires a little more work to get the
    results you want. It''s worth taking the time to master, though.


    ![](img/21ee864cf339a60c6b969b7bda291087_30_0.png)


    # STEP 2


    You''ve already used the Mint Menu to reboot the system and when you first used
    the Live Environment, click the Menu and hover over the Office entry in the middle
    column. This changes the icons represented in the right-hand column, detailing
    what apps are installed under that.


    # STEP 5


    If you''re looking for a particular function or, such as setting a printer, click
    on the Search box at the top of the Mint Menu. Start typing the app or function
    you want, such as printers, and the Mint Menu displays the relevant options below.
    This works with modern Linux menus, regardless of the distro.


    ![](img/21ee864cf339a60c6b969b7bda291087_30_1.png)


    ![](img/21ee864cf339a60c6b969b7bda291087_30_2.png)


    # STEP 3


    Launching any of the apps from the Menu is as simple as finding and clicking it.
    For example, under the Office section, click on LibreOffice Writer. Writer is
    the preinstalled word processor for Linux Mint. It opens and saves the same way.


    # STEP 6


    Hover over any of the apps listed on the right-hand column and right-click, to
    be presented with a list of options: Add to Panel, Add to Desktop, Add to Favorites
    and Uninstall. Most of these options are obvious in this use. Add to Favorites
    though places the app in the left-hand, quick-access column.


