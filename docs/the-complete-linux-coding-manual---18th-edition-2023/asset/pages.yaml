  md: '# # Installing Linux in a Virtual Environment


    With Oracle VirtualBox now up and running, the next task is to create the Virtual
    Machine (VM) environment into which you install Linux. This process won''t affect
    your currently installed operating system, which is why a VM is a great choice.


    # ## CREATING THE VM


    There are plenty of options to choose from when creating a VM. For now, let''s
    set up a VM adequate to run Mint Cinnamon and perform well.


    +   **STEP 1** With VirtualBox open, click on the New Icon in the top right of
    app. This opens the new VM Wizard.


    +   **STEP 3** The next section defines the amount of system memory, or RAM, the
    VM has allocated. Remember this is taken from the available memory installed on
    your computer, don''t give the VM too much. For example, if you have 8GB of memory
    installed and we''re giving 2GB to the VM. When you''re ready, Click to continue.


    ![](img/21ee864cf339a60c6b969b7bda291087_25_0.png)


    +   **STEP 2** In the box to Name, type Linux Mint and VirtualBox should automatically
    choose Linux as the Type and Ubuntu (64-bit) as the Version; if not use the drop-down
    boxes to select the correct settings (remember Mint mainline is based on Ubuntu).
    Click Next when you''re ready to proceed.


    +   **STEP 4** This section is where you start to create the virtual disk that
    the VM will install Mint on. The default option, Create a virtual hard disk, is
    the one we''re using. Click to move on.


    ![](img/21ee864cf339a60c6b969b7bda291087_25_1.png)'
