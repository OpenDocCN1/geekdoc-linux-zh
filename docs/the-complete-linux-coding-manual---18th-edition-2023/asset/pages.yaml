  md: '# # Creating a Linux Installer on Windows


    You need to transfer the downloaded Linux ISO to either a DVD or a USB key before
    being able to install it onto a computer. This will be a live environment, which
    allows you to test the OS prior to installation, but first you need to create
    the bootable media.


    # ## DVD BOOTABLE MEDIA


    We''re using a Windows 10 PC to transfer the ISO to a DVD. If you''re using a
    version of Windows 7 onward the process is extremely easy.


    +   * STEP 1 First locate the ISO image of Linux you''ve already downloaded. You
    can usually find it in the Folders in Windows 7, 8.1 and 10 computers, unless
    you specified a different location when saving it.


    +   * STEP 3 Right-click the Linux ISO and from the menu select Burn Disc Image.
    Depending on the speed of the PC, it may take a few seconds before anything happens.
    Don''t worry much, unless it takes more than a minute, in which case it might
    be worth restarting your PC and trying again. With luck, the Windows Disc image
    burner should launch.


    Quick access Dropbox (Team BDM) OneDrive This PC CD Drive (E:) HiSuite Network
    linuxmint-19.1-cinnamon-64bit


    +   * STEP 2 Insert a recordable DVD disc into your computer''s optical drive.
    After a few seconds, while the disc is read, Windows displays a pop-up message
    asking what to do with the newly inserted disc, ignore this, as we''re going to
    use the built-in image burning function.


    +   * STEP 4 With the Windows Disc image burner box open, click the ''Verify disc
    after burning'' tick box, then click Burn. The process should take a few minutes,
    depending on the speed of your PC optical drive. Once it completes it through
    the verification stage and when the optical drive should auto-ject the disc for
    you.


    ![](img/21ee864cf339a60c6b969b7bda291087_19_0.png)'
