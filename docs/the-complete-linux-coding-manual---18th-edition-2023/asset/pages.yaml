    int main() {

    StartLives = StartLives - 1;

    cout << StartLives;

    }

    ```


    STEP 10 Although we said to ignore the warnings in Step 3, there is a difference
    between a warning and an error. In this case, it is just a new value. The data
    type, double-precision floating point value, which the code could make. The result
    should be 7.0688. Essentially, you can work with a warning but not error.


