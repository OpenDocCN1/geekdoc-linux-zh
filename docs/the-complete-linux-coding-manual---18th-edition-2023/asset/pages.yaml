    \ the main code block, there's a new variable distance, which is an integer; so\
    \ you're telling the compiler that's another name for it. We assigned the value\
    \ 15 to distance and displayed the output: distance in 15.\n\nIt might sound a\
    \ little confusing to be but the more you use C++ and create your own code, the\
    \ easier it becomes.\n\nLinux Coding & Programming"
