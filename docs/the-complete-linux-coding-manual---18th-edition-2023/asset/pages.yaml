  md: "# # Fun Things to do in the Terminal\n\nDespite the seriousness of an operating\
    \ system, the Linux community are certainly no strangers to a bit of fun. The\
    \ developers over the years have created and inserted all manner of fun and odd\
    \ elements into the Terminal.\n\n# ## TERMINAL FUN\n\nYou'll be working exclusively\
    \ in the Terminal for these next two sections, so start warming your fingers.\
    \ After all, all work and no play... as the saying goes.\n\n+   **STEP 1** The\
    \ first command we're going to use `sl`, it's not installed by default so. `sudo\
    \ apt-get install`. The command can be run with `sl` and when executed will display\
    \ a Steam Locomotive across the screen (hence 'sl'). Entering LS, note the upper\
    \ case, also works.\n\n+   **STEP 3** If you've ever fancied the computer read\
    \ random fortune out to you, then you're in luck. Most distros require you to\
    \ install the fortune, however Linux Mint differs by having it already pre-loaded.\
    \ All you need to do is enter the command **Fortune** into the Terminal, and enjoy.\n\
    \n![](img/21ee864cf339a60c6b969b7bda291087_59_0.png)\n\n```\nFile Edit View Search\
    \ Terminal Help\ndaviddavid-mint ~~\ndaviddavid-mint ~ $ fortune\nYou are about\
    \ to become the commandant of the fighting men of the ndepartment of transportation.\n\
    daviddavid-mint ~ $ \n  | \n  |  ( ) ) \n  |  \n```\n\n+   **STEP 2** Fans of\
    \ Star Wars get a fix when it comes to the Terminal. By linking to a remote server\
    \ via the telnet command, you can watch Episode IV: A New Hope being played out,\
    \ in ASCII. To view this specific, enter: `telnet-towel.blinklights.nl`.\n\n+\
    \   **STEP 4** The **rev** command is certainly interesting, and at first seems\
    \ what a useless addition to the OS. It can be used to create some seemingly unbreakable\
    \ passwords. Enter **rev**, now type some text, when you press **Enter** everything\
    \ is reversed. Press **Ctrl+C** to exit.\n\n![](img/21ee864cf339a60c6b969b7bda291087_59_1.png)\n\
    \n```\nFile Edit View Search Terminal Help\ndaviddavid-mint ~~\ndaviddavid-mint\
    \ ~ $ rev\nrev is used for creating passwords with:\nhwt sd swap git tar terg\
    \ text reversed siht\ndaviddavid-mint ~ $ \n```"
