  md: '# # Installing a Virtual Environment


    A Virtual Environment is a simulated computer system. Using a Virtual Machine,
    you can mimic a standard PC and install an entire operating system to it without
    affecting the one installed on your computer. It''s a great way to use Linux,
    while still having Windows 10 as your main OS.


    # ## GOING VIRTUAL


    Using a Virtual Machine (VM) takes resources from your computer: memory, hard
    drive space, processor usage and so on. Make sure you have enough of each before
    commencing.


    +   **STEP 1** We''re using VirtualBox in this instance, it''s one of the easiest
    virtual environments to get grips with. Enter virtualbox.org and click on ''Download
    VirtualBox''. This takes you to the main download page. Locate the correct host
    for your system: Windows or Mac, the Host being the installed operating system,
    and click the link to begin the download.


    +   **STEP 3** With the correct packages downloaded, and before you install them,
    you need to make sure that the computer you''re using is able to host a VM. Reboot
    the computer and enter the BIOS. When the computer starts up, press F2 or whichever
    key is necessary to Enter Setup.


    ![](img/21ee864cf339a60c6b969b7bda291087_23_0.png)


    +   **STEP 2** Next, while still at the VirtualBox download page, locate the VirtualBox
    Extension pack. The Extension Pack supports USB devices as well as numerous extras
    that help make the VM environment, like emulation of a ''real computer''.


    Each BIOS is laid out differently and it''s very difficult to assess where to
    look in each personal example. However, as general rule of thumb, you''re looking
    for Intel Virtualisation Technology, or simply Virtualisation found within the
    Advanced section of the BIOS. When you''ve located it, enable it, save the settings,
    and reboot the computer.


    ![](img/21ee864cf339a60c6b969b7bda291087_23_1.png)


    ![](img/21ee864cf339a60c6b969b7bda291087_23_2.png)'
