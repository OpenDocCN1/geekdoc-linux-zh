  md: "# STEP 5\n\nThe principal works same as the previous code. The user's input,\
    \ name, is stored in a string, because it contains multiple characters, and retrieved\
    \ in the second count line. As the variable 'name' doesn't change, then you can\
    \ recall it whenever you like in your code.\n\n```\n// What is your name: David\n\
    David. I hope you're well today\nint main() {\n    // experiment with code: 0\n\
    \    return 0;\n}\n```\n\nYou can input requests to the user but just make sure\
    \ you have a valid variable to store the input to begin. Let's assume you want\
    \ to enter two whole numbers:\n\n# STEP 6\n\n```\n#include <iostream>\nusing namespace\
    \ std;\n\nint main() {\n    int num1, num2;\n    cout << \"Enter two numbers:\
    \ \\n\";\n    cin >> num1 >> num2;\n    cout << \"You entered \" << num1 << \"\
    \ and \" << num2 << \" \\n\";\n}\n```\n\n# STEP 7\n\nLikewise, inputted data can\
    \ be manipulated once you have stored it in a string. For instance, the user for\
    \ two numbers and does some math on:\n\n```\n#include <iostream>\nusing namespace\
    \ std;\n\nint main() {\n    float num1, num2;\n    cout << \"Enter two numbers:\
    \ \\n\";\n    cin >> num1 >> num2;\n    cout << num1 << \" + \" << num2 << \"\
    \ is: \" << num1 + num2 << \" \\n\";\n}\n```\n\n# STEP 8\n\nWhile cin works well\
    \ for most input tasks, it has a limitation. Always consider spaces as for single\
    \ words not multiple words. However, gets cin as the first argument and the variable\
    \ as the:\n\n```\n#include <iostream>\nusing namespace std;\n\nint main() {\n\
    \    string name;\n    cout << \"Enter a sentence: \\n\";\n    getline(cin, name);\n\
    \    cout << \"Your sentence is: \" << name << \" long.\\n\";\n}\n```\n\n# STEP\
    \ 9\n\nBuild and execute the code, then enter a sentence with spaces. If you don't\
    \ read the code line getline with cin >> and try again, the result displays the\
    \ characters to the first space.\n\n> © 2023 Publications Raspberry Pi! Tricks,\
    \ Hacks & F\nYour sentence is: 53 characters long.\n\n# STEP 10\n\ngetline is\
    \ a command that C++ programmers forget to use. The terminating white space is\
    \ away and you can't figure out why your code isnt working. So, it's best to use\
    \ getline(cin, variable) in future:\n\n```\n#include <iostream>\nusing namespace\
    \ std;\n\nint main() {\n    string name;\n    cout << \"Enter your full name:\
    \ \\n\";\n    getline(cin, name);\n    cout << \"Hello, \" << name << \" \\n\"\
    ;\n}\n```"
