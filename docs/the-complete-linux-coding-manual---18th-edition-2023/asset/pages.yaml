  md: "# Compile and Execute\n\nYou've created your first C++ program and you now\
    \ understand the basics behind the structure of one. Let's get things moving and\
    \ compile and execute, or run if you prefer, the program and see how it looks.\n\
    \n# GREETINGS FROM C++\n\nCompiling and executing code from within Geany is remarkably\
    \ simple and just a matter of clicking a couple of icons and seeing the result.\
    \ Here's how you do it.\n\n+   **STEP 1** Open Geany, if you haven't already,\
    \ and load up the previously saved Hello World code you created. Ensure that there\
    \ are no visible errors, such as a missing semicolon at the end of the std::cout\
    \ line.\n\n+   **STEP 3** When you click the Build icon, the pane at bottom of\
    \ the Geany interface displays results. If all is well, you will see a successful\
    \ compilation, if not Geany issues an error along the line where the error was\
    \ found.\n\n![](img/21ee864cf339a60c6b969b7bda291087_125_0.png)\n\n```\nhelloworld.cpp\n\
    #include <iostream>\n\nint main() {\n    // My first C++ program\n    std::cout\
    \ << \"Hello, world!\\n\";\n}\n```\n\n+   **STEP 2** if your code is ready, look\
    \ to the menu bar along the line of icons. Notice that midway along the line of\
    \ icons is a red icon. This is Build, which runs through code, checking if the\
    \ C++ standards to see if there are any errors that stop it from running.\n\n\
    +   **STEP 4** With the code successfully built, it's now time to execute it.\
    \ Next to the Build there's a paper airplane icon, this is the Run. You can't\
    \ run code that has not previously built or has an error in place. Click the Run\
    \ icon.\n\n![](img/21ee864cf339a60c6b969b7bda291087_125_1.png)\n\n```\nhelloworld.cpp\n\
    #include <iostream>\n\nint main() {\n    // My first C++ program\n    std::cout\
    \ << \"Hello, world!\\n\";\n}\n```"
