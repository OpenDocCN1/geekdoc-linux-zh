  md: '# # Working Variables


    We''ve seen some examples of variables in our Python code but it''s always worth
    going through the way they operate and how Python creates and assigns certain
    values to a variable.


    # ## Various VARIABLES


    You''ll be working with the Python 3 ID Shell in this tutorial. If you haven''t
    already, open Python 3 or close down the previous IDLE Shell to clear up any code.


    In programming languages you''re required to use a dollar sign to denote a string,
    which is a variable made of multiple characters, such as a name of a person. In
    Python this isn''t necessary. For example, in the Shell enter: name="DavidHoward"
    (or use your name, unless you''re also called David Howard).


    You''ve seen previously that variables can be concatenated with the plus symbol
    between the variable names. In our example we can use print(name + " " + title).
    The middle part between the quotations allows us to add a comma and a space, as
    variables are connected without spaces, so we need to add them manually.


