    \ in C++ as they do in most other programming languages. However, by using the\
    \ C++ Math Library, you can also calculate square roots, powers, trig and more.\n\
    \n+   * STEP 1 C++'s mathematical operations follow the patterns as taught in\
    \ school, in that multiplication and division precede addition and subtraction.\
    \ You can also alter that though, create a new file and enter.\n\n```\n#include\
    \ <iostream>\nusing namespace std;\nint main() {\n    float numbers = 100;\n \
    \   numbers = numbers + 10; // This adds 10 to the initial 100\n    cout << numbers\
    \ << \"\\n\";\n    numbers = numbers - 10; // This subtracts 10 from the new 100\n\
    \    cout << numbers << \"\\n\";\n}\n```\n\n+   * STEP 3 Multiplication and division\
    \ can be applied as such:\n\n```\n#include <iostream>\nusing namespace std;\n\
    int main() {\n    float numbers = 100;\n    numbers = numbers * 10; // This multiplies\
    \ 100 by 10\n    cout << numbers << \"\\n\";\n    numbers = numbers / 10; // And\
    \ this divides 1000 by 100\n    cout << numbers << \"\\n\";\n}\n```\n\n+   * STEP\
    \ 2 While simple, it gets the old maths variable warmed up. Note that we use a\
