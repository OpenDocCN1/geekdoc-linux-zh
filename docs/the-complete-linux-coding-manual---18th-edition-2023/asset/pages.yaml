  md: '# Why Linux?


    For many of its users, Linux means freedom. Freedom from the walled garden approach
    of other operating systems, freedom to change and use the OS as you please and
    freedom from any form of licensing or payment. There''s a lot more to Linux than
    you may think though.


    # FREE AND OPEN


    Linux is a fantastic fix for those who want something different. The efficiency
    of the system, the variety of applications and stability are just a few good reasons.


    The first thing you need to know is that there is no such operating system called
    Linux. Linux is in fact the operating system kernel, the core component of OS.
    When talking about Linux what we are referring to one of the many distributions,
    distros, that use the Linux kernel. You''ve probably heard of at least one of
    them, like Ubuntu, SUSE, Debian, the list goes on. Each of these distros offers
    something different for the user. While each has the Linux kernel at its core,
    they provide the user with a different looking desktop. Different distributions
    offer different ways in which to start and get more apps and a slightly different
    look and feel throughout the entire system. At the centre, Linux is what we use
    to start with.


    Linux works considerably differently to Windows or macOS. It''s free for a start;
    free to install on as many computers as you like, free for an unlimited amount
    of time and free programs and applications. This free to use element is one of
    the biggest draws for the developers. Linux can be considerably more, a developer,
    a gamer or someone who wants to use an older computer to, can quickly download
    a distro and get working in a matter of minutes.


    Alongside the free aspect comes a level of freedom to customise and modify the
    system to your own uses. Each of the available distros available on the Internet
    have a certain ''spin''


    Linux is a great system on which to start with.


    ![](img/21ee864cf339a60c6b969b7bda291087_7_0.png)'
