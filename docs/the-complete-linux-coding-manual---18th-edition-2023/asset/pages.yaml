  md: '# Using Comments


    While comments may seem like a minor element to many lines of code that combine
    to make a game, application or even an entire operating system, in fact they''re
    probably one of the most important factors.


    # THE IMPORTANCE OF COMMENTING


    Comments inside code are basically human readable descriptions that detail what
    the code is doing at that particular point. They don''t sound especially but code
    without comments is one of the most frustrating areas of line, section or individual
    elements unless you''re a professional or just starting out.


    In short, all code should be commented in such a manner as to effectively describe
    the purpose of a line, section or element. You should get into habit of commenting
    as much as possible so who don''t know anything about programming can pick up
    your code and understand what it''s going to do by simply reading it.


    In a professional environment, comments are vital to the success of the code and
    ultimately, the company or project. In an organization, many programmers work
    in teams alongside engineers, other developers, hardware analysts and so. If you
    are part of the team that''s writing a piece of software for the company, then
    your comments help save a lot of time when something goes wrong and another team
    member will be able to point out the issue.


    > Place yourself in the shoes of someone''s job is to find out what is wrong with
    your program. The program has excess of 800,000 lines of code, spread across several
    different modules. You can soon appreciate the need for little help from the original
    programmers in the form of a good comment.


    ![](img/21ee864cf339a60c6b969b7bda291087_129_0.png)


    Best comments are always concise and link the code logically, detailing happens
    when the program hits a line or section. You don''t need to comment on every line.
    Something along the lines of: if x=0 does not require you to comment that if x
    equals zero then do nothing; something going to be obvious to the reader. If x
    value is something that drastically changes the program for the user, such as
    out of lines, it certainly needs to be commented.


    If the code is yours, you should write comments if you are going to share it with
    others. This way you can return to code and understand what you did or where it
    went wrong, what worked brilliant.


    Comments are good practice and once you understand how to add a comment when needed,
    you find it''s your second nature.


