  md: '# A DASH OF CINNAMON


    Cinnamon has many benefits beyond its look and feel, although they are important
    factors. Here, we outline a couple of features to help you decide if it''s the
    DE for you.


    # FAB FEATURE 1


    It performs excellently on more modern systems but is a lot more stable than it
    used to be, and not quite the resource hog it once was. Therefore, don''t be put-off
    Cinnamon if you''re using an older computer to install and Linux Mint.


    # FAB FEATURE 2


    Cinnamon configurable Hot Corners, where each corner of the desktop can be Click
    to perform a certain task, such as display the Workspaces, Show all Windows or
    Run a Command. The Hot Corners allow you to switch between different views and
    help make the desktop a more efficient environment.


    ![](img/21ee864cf339a60c6b969b7bda291087_14_0.png)


    # BEST MATE


    MATE is simple and to intuitive DEATE that''s fast and stable. In comparison to
    Cinnamon it looks a little antiquated but that''s only on the surface. There''s
    plenty to like with MATE.


    # FAB FEATURE 1


    MATE is an excellent desktop environment for older computers. It works better
    with a larger number of hardware components than Cinnamon generally does but is
    just as capable of delivering a great looking desktop as well as advanced customisations.


    ![](img/21ee864cf339a60c6b969b7bda291087_14_1.png)


    # FAB FEATURE 2


    Due to its highly configurable, MATE can be customised to a fine degree. There
    are plenty of options available to the user who demands their desktop environment,
    including Compiz Settings, where you''re able to configure all manner of desktop
    effects, even a 3D desktop kube.


    # CHOLESTER FREE DESKTOP


    Xfce started life as the Common Desktop Environment (CDE) in 1996. Since then
    it changed a few times and is now simply Xfce, with the nickname ''Cholesterol
    Free Desktop Environment''.


    # FAB FEATURE 1


    Xfce really is a quick desktop and brings out the best in Linux as a fast operating
    system. In fact, it takes us to this point from the top of the page to install
    it onto a new computer; a few hundred words written and we''re using a new OS.
    Not bad.


    # FAB FEATURE 2


    Since it''s quick and lightweight does not mean Linux Mint Xfce isn''t a complete
    desktop operating system. Just like the other environments we offer, you can get
    the latest Firefox, Libreoffice, VLC, Gimp, chat apps and even a bit torrent client.


