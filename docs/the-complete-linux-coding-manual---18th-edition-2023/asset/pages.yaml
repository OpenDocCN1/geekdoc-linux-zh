  md: '# # Update Mint via the Terminal


    Up to now you''ve been using the shield icon to launch Mint Manager in order to
    update the system and upgrade the currently installed apps, tools and other elements.
    However, you can also accomplish a complete system update and upgrade from the
    Terminal.


    # ## USING APT-GET


    To update and upgrade the Terminal you use the APT (Advanced Packaging Tool) command.
    Its powerful command and combines different elements depending on its use.


    +   **STEP 1** Start by opening a new Terminal or if you already have one open
    with the clear command. This starts off with a clean state to switch on.


    +   **STEP 3** Apt-get is used to upgrade the software in Mint, as well as Ubuntu
    and other Debian-based distros. Using the Update element retrieves new packages
    and updates the list of source files. Upgrade downloads and performs upgrade to
    the latest versions of files. To start the upgrade process, enter: `sudo apt-get
    upgrade`, followed by your password.


    ![](img/21ee864cf339a60c6b969b7bda291087_47_0.png)


    +   **STEP 2** Enter, `apt-get` into the Terminal. This brings up a list of the
    most used commands, what the command does. It''s worth having a look if it doesn''t
    make enough of sense at this time.


    +   **STEP 4** Notice the new addition of the sudo command. The sudo command makes
    it much easier to use Super User. Do it means that the administrative user (Super
    User) uses APT (Advanced Packaging Tool) to get any. Now try this: `sudo apt-get
    upgrade`.


    ```

    File Edit View Search Terminal Help

    apt 1.2.7 (ubuntu)

    apt-get install [command]

    apt-get remove [purge [pkg-name]]

    apt-get purge [[pkg-name]]

    ```


    ```

    File Edit View Search Terminal Help

    apt 1.2.7 (ubuntu)

    apt-get update

    Reading package lists... Done

    Building dependency tree: Done

    Fetching: http://archive.ubuntu.com/ubuntu InRelease [196 kB] [Get]

    Fetching: http://security.ubuntu.com/ubuntu-security InRelease [214 kB] [Get]

