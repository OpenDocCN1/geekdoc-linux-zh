  md: '# VPNS AND TOR


    The previous steps can aid your online privacy to really become anonymous you
    need a Virtual Private Network and Tor.


    +   ### STEP 1 A VPN is a remote server, or cluster of servers, that establishes
    a connection with your computer. The end result is that your computer''s identity
    on the Internet is hidden behind the VPN remote server; so you could use it in
    the UK without an IP address (the computer online identity) belonging to Iceland.


    +   ### STEP 4 When the download has finished, drop into the Terminal and enter
    the Downloads folder, Enter ls to check the tar.xz for Tor if it is present, then
    enter: tar -xzf tor-browser-linux64-8.0.4_en.tar.xz (X is updated, if your version
    is different press Tab to autocomplete the tor-browser=filename). When the files
    are unpacked, use cd tor-browser-en/ to enter the network now.


    # How VPN works?


    ![](img/21ee864cf339a60c6b969b7bda291087_42_0.png)


    +   ### STEP 2 Most good VPN charge a monthly or annual fee but it''s worth the
    expense. With CyberGhost, which VPN connections for Windows, Mac, Mint (with any
    other Linux distribution), Android and iOS devices. Details for each OS can be
    found at www.cyberghost.com/hz/en-us/articles/213190329-read-me-first-


    +   ### STEP 5 A quick install a couple of files: a folder Browser and a file
    ''start-tor-browser.desktop''. To start the setup, use ./start-tor-browser.desktop.
    This command launches the Tor setup, where you are offered two options: Connect
    or Configure. For more users, the connection option will suffice. Click Next when
    you''re ready.


    ![](img/21ee864cf339a60c6b969b7bda291087_42_1.png)


    +   ### STEP 3 Another option is to use Tor. Tor is an open network that you can
    connect to hide your IP address behind countless nodes around the world. It is
    very easy to install and use. By navigating to www.torproject.org/download/download-easy.html
    and clicking on the Download Linux 64-bit version.


    +   ### STEP 6 After the connection is established, the Tor launches. And from
    here you can customise a version of Firefox without being viewed or tracked. Mixing
    both VPN and Tor makes for an extremely secure and private connection to online.


    ![](img/21ee864cf339a60c6b969b7bda291087_42_2.png)


    Linux Coding & Programming'
