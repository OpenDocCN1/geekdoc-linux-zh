  md: '# # Ten Things to do After Installing Linux Mint


    Linux Mint is a polished distro out of the box, as with most Linux distros, there
    are some tweaks that can be applied to improve the way it works. Although these
    are Mint-specific tweaks, most can be applied to other distros.


    # ## LINUX TWEAKS


    Some of these post-installation actions are highly recommended, while others are
    just handy additions and simply tweak the system or add a customisation.


    +   **STEP 1** The first, and most important, post-installation action is to update
    the system. Click on the icon in the Panel, found at the bottom right of the desktop
    next to the time and date. This launches the Update Manager.


    +   **STEP 3** Click the OK button and you can see a couple of updates ready for
    installation. Before you update click on the blue OK button to switch to a Local
    Mirror. This opens the Software Sources option. In the Mirrors section, click
    on the Main and Base drop-down menus and select a server closest to your current
    location.


    ![](img/21ee864cf339a60c6b969b7bda291087_33_0.png)


    +   **STEP 2** Linux Mint offers the user a three policy approach to updates:
    Don''t Break My Computer, Optimise Stability and Security and Always Update Everything.
    The recommended option is the Optimise Stability and Security, which only updates
    safety, essential patches that do not impact critical elements of the OS. Read
    the descriptions below choose the middle, and recommend.


    +   **STEP 4** Click the Update Cache button and close the Software Sources window.
    Back in the Update Manager, click on Install Updates icon and enter your password.
    The updates automatically install themselves and relaunch Update Manager, this
    time with a lot more updates. Again, click Install, any messages and wait for
    them to finish.


    ![](img/21ee864cf339a60c6b969b7bda291087_33_1.png)'
