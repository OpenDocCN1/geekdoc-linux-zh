  md: '# Install Apps via the Terminal – Part 2


    Most of the time you''ll get to install apps from the Terminal using the standard
    aptget command. However, sometimes an app demands a little more work. This means
    installing an app from its source code, which isn''t as scary as it sounds.


    # FROM THE SOURCE


    The commands you will need to become familiar with here are Configure, Make and
    Install. You''ll find a lot of apps using from source, so it''s certainly a skill
    worth investing time in.


    Source code files for Linux usually come in the form of .TAR.GZ or .TAR.BZ2. Both
    compressed files holding all the code needed to ''make'' start off by creating
    a new folder in Home: mkdir vim.


    +   STEP 1


    +   STEP 3


    the wget command retrieves content from the internet, in this BZ2 file for Vim.
    According to Mint''s file system colour, the compressed file should be displayed
    in red.


    ![](img/21ee864cf339a60c6b969b7bda291087_51_0.png)


    Vim, by the way, is an advanced text editor we''ll use as an example to install.
    Enter the folder Vim, and then within the Vim folder, enter the following command
    into the Terminal: wget ftp://ftp.vim.org/pub/vim/unix/vim-7.4.tar.bz


    +   STEP 2


    +   STEP 4

    We need to uncompress the contents of the file now, so enter: tar -xf vim-7.4.tar.bz2
    into the Terminal. You can type in tar -xf v and press the Tab key to auto-fill
    the remaining file name.


    ![](img/21ee864cf339a60c6b969b7bda291087_51_1.png)


    ![](img/21ee864cf339a60c6b969b7bda291087_51_2.png)'
