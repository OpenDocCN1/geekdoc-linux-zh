  md: '# # Which Distro?


    Up to now we''ve looked mainly at Linux Mint but there are other Linux distributions
    out there to try. In there are thousands of Linux distros to download and install,
    so which one should you decide on use?


    # ## DISTRO HOPPING


    Distro Hopping is a term used by the community for people who never stick to one
    distribution, instead they hop from one to the other and back again, testing each
    one, using them moving from one to another or a newly released distro.


    There''s nothing wrong with distro hopping, as it''s a good way to grips with
    what''s out there over another that may not appeal to your tastes. The problem
    of which one should you use today?


    For example, Linux Mint is an ideal starting place. It''s easy to install and
    use distro, has all the software you would normally use on a day-to-day basis
    already installed out-of-the-box and gently eases you into the unique world of
    Linux and how it works and performs.


    Ubuntu offers much the same experience but it does this in a slightly different
    way. There''s generally less experienced with Ubuntu than with Linux Mint. Another
    point worth considering is the sheer volume of content and help indicated by Ubuntu
    users when you get stuck, you''re never too far from a solution.


    Moving on, as you begin to grow more comfortable with Linux, you will find there
    are many other distros to choose like OSUSE, Fedora, or Debian. These are all
    excellent distros and offer the user a different perspective on how the systems
    run. Some are more demanding, than others, but each has their own value to offer.


    You might find moving to a particular distro as it differs catchingly from the
    one you like. Tails, for example, is a distro that''s designed for anonymity.
    It contains complex and many different encryption tools as well as browsers to
    help you browse the web without being detected, tracked or monitored. Kali Linux
    is designed for security professionals and contains many different kinds of ethical
    hacking


    While distro hopping is a good thing, it''s not a stable way to enjoy Linux Mint
    and get the most from it. We''re not saying you stick to one and never look elsewhere,
    as you would be missing a lot of content out there, but we recommend you find
    a happy and slowly progress based on what you are using Linux skills.


