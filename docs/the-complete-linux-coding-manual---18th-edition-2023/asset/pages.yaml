  md: '# # Introduction to the Cinnamon Menu


    Now that you have Linux installed it''s time to have a good look around. First
    though, if you''re using Virtualbox you''ll have a notification regarding Software
    Rendering; here''s how to fix it.


    # ## CINNAMON VIRTUALBOX FIX


    You''re already looked at list functions, using .insert,.remove, and .pop but
    there are also functions that can be applied to strings.


    **STEP 1** Before we begin, we''re assuming you''re having this within Virtualbox.
    The Software Rendering message appears in the top right of the desktop. To fix
    this, click on Devices in the Virtualbox window, followed by Insert Guest Additions
    CD image.


    **STEP 3** After a moment or two you''re automatically dropped into a command
    line view, called the Terminal in Linux. This details the installation of the
    new VirtualBox drivers, removing any old drivers it detected, and installing the
    latest version. It won''t take long and when it''s done you will be asked to restart
    the terminal.


    ![](img/21ee864cf339a60c6b969b7bda291087_29_0.png)


    ![](img/21ee864cf339a60c6b969b7bda291087_29_1.png)


    **STEP 2** The Guest Additions CD contains drivers for Virtualbox, including the
    virtual video hardware. When it''s loaded, you''ll get a ''software needs running''
    notification box with two options, Cancel and Run. Click the Run button and enter
    your Linux user password.


    **STEP 4** The VirtualBox Additions CD is on the desktop, so right-click it and
    then scroll down the menu to click Event. You can now restart Linux Mint by clicking
    the menu, the bottom icon in the left, then the Restart button. This reboots Mint
    and the problem is fixed.


    ![](img/21ee864cf339a60c6b969b7bda291087_29_2.png)


    ![](img/21ee864cf339a60c6b969b7bda291087_29_3.png)


    Linux Coding & Programming'
