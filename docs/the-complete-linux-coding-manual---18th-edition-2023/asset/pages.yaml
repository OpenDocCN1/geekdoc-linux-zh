  md: '# # Install Apps via the Terminal – Part 1


    There are different ways to install apps and programs on Linux. You can opt for
    the graphical route, using a Software Manager, or you can use the Terminal. Often,
    the Terminal provides better control over the software being installed and sometimes,
    you have no choice in the matter.


    # ## COMMAND LINE INSTALL


    Installing an app with the Terminal may require some nifty keyboard work but you
    get a better sense of what''s being installed and where.


    +   **STEP 1** Installing apps from the Terminal is relatively simple. First,
    you need to make sure that the system is up to date. To do this open the Terminal
    and enter: `sudo apt-get update && sudo apt-get upgrade`. Enter your password
    and accept any necessary updates.


    +   **STEP 3** You need to enter y to confirm the installation, which takes up
    around 5.5MB of storage in the system. Once Stella is installed, you can see that
    Mint has automatically created the Games category in the Menu as well as the app
    shortcut.


    ```

    File Edit View Search Terminal Help

    david@linuxmint: $ sudo apt-get update && sudo apt-get upgrade

    Reading package lists... Done

    Building dependency tree... Done

    Fetching: http://archive.ubuntu.com/ubuntu focal In

    Get: http://archive.ubuntu.com/ubuntu Release

    Fetching: http://archive.ubuntu.com/ubuntu focal-updates In

    Get: http://archive.ubuntu.com/ubuntu focal-updates Release

    Fetching: http://archive.ubuntu.com/ubuntu focal-security In

    Get: http://archive.ubuntu.com/ubuntu focal-security Release

    Reading package lists... Done

    Building dependency tree... Done

    Reading state information... Done

    0 upgraded, 0 newly installed, 0 not to upgrade.

    ```


    ![](img/21ee864cf339a60c6b969b7bda291087_49_0.png)


    +   **STEP 2** Just as you''ve seen, sudo apt-get update/upgrade and so on are
    designed to upgrade the software that''s already installed on the system. If you
    want to install more apps it''s extraordinarily simple. First if you need an app
    to install, let''s use Stella. Enter: `sudo apt-get install stella`.


    +   **STEP 4** Sometimes, when installing software, you need to add the app''s
    Repository. The repository, or repo, is the名为 remote location where the software
    is held, along with all its dependencies (the virtual libraries and books it needs
    to function). To start this, enter: `sudo apt-get-repository ppa:peter-levi/ppa`.
    Press Enter when asked to add and add the PPA (Personal Package Archive).


    ```

    File Edit View Search Terminal Help

    david@linuxmint~: $ sudo apt-get install stella

    ```


    ```

    File Edit View Search Terminal Help

    david@linuxmint~: $ sudo apt-get-repository ppa:peter-levi/ppa

    Adding packages for the Variety package changer

    More info: https://launchpad.com/archive/ubuntu/ppa

    Press Enter to continue or cancel.

    ```'
