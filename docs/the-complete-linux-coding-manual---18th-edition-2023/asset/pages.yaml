  md: "# # Creating a File Using the Terminal\n\nUsing the Terminal, you're able to\
    \ create folders, files and even execute Linux Mint apps. In truth, if you didn't\
    \ have the GUI at hand, you could still accomplish the same from the Terminal.\n\
    \n# ## MORE TERMINAL WORK\n\nCreating content using the Terminal isn't quite strenuous\
    \ as it may first appear. Yes, the Terminal can look a daunting place for the\
    \ newcomer, but once mastered it's really quite intuitive.\n\n+   **STEP 1** Open\
    \ up the Terminal, and make sure you're in the Home folder. If not use the `cd`\
    \ -command to return to the Home folder from wherever you're currently located.\n\
    \n```\nFile Edit View Search Terminal Help\ndavidid@david-mint $ cd ~\ndavidid@david-mint\
    \ ~ \n```\n\n+   **STEP 3** Your command line should change to the Test folder\
    \ and if you enter nothing within the folder, as you've just created. The `mkdir`\
    \ command is fairly self explanatory: Make Directory followed by the name of your\
    \ choosing.\n\n```\nFile Edit View Search Terminal Help\ndavidid@david-mint $\
    \ mkdir Test\ndavidid@david-mint $ cd Test\ndavidid@david-mint Test $ ls\ndavidid@david-mint\
    \ Test $ ~Test \n```\n\n+   **STEP 2** Let's start by creating a new folder within\
    \ Home, and call it Test. The command you'll need is `mkdir Test`. Press Enter\
    \ to create the folder when you've typed in the command, then `cd Test` and press\
    \ Enter. This will change your Directory (`cd`) to the newly created folder.\n\
    \n+   **STEP 4** To create an empty file, called `Test.txt`, enter in the Terminal:\
    \ `touch Test.txt`. You can use the new file to view. This is a standard command\
    \ that allows the creation of files without the need to open a text editor, save\
    \ the file, close the editor.\n\n```\nFile Edit View Search Terminal Help\ndavidid@david-mint\
    \ $ mkdir Test\ndavidid@david-mint $ cd Test\ndavidid@david-mint Test $ ls\ndavidid@david-mint\
    \ Test $ touch Test.txt\ndavidid@david-mint Test $ ls\ndavidid@david-mint Test\
    \ $ ~Test \n```"
