  md: "# C++ Maths\n\nSTEP 5 The interesting maths content comes when you call upon\
    \ the C++ Math Library. With this header are dozens of mathematical functions\
    \ along with other operations. Everything from cosine to tangent with two parameters,\
    \ to the value of Pi. You can call the header with:\n\nSTEP 8 Calculating powers\
    \ of numbers can be done with:\n\n```\n#include <iostream>\n#include <cmath>\n\
    using namespace std;\nint main() {\n\n}\n```\n\n```\n#include <iostream>\n#include\
    \ <cmath>\nusing namespace std;\nint main() {\n    float number = 12;\n    cout\
