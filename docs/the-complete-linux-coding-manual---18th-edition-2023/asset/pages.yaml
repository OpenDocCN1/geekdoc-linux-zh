    Get7: http://apt.ubuntu.net/wine/wine-build/ubuntu

    Hit8: http://apt.ubuntu.net/ppa/linuxmint-mint

    Hit10: http://repository.spotify.com stable InRelease

    ```


    +   **STEP 2** There are several text editors we can use to create a Bash script:
    Xed, Vi, Nano, GNU Emacs and so on. In the end it comes down to personal preference.
    The use of Xed is purely making it easier to read the script in the screenshots
    you see below.


    +   **STEP 4** Windows users will be aware that in order for a batch file to work,
    as is executed and follow the programming within it, they need to have a BAF extension.
    Linux is an extension-less operating system but the convention is to give it a
    sh script.


