    ## 终端基础知识


    大多数操作系统使用两种类型的界面：GUI（图形用户界面），即 Windows、macOS 和 Linux Mint 启动后进入的桌面；命令行。虽然现代操作系统逐渐远离了命令行，但
    Mint 使用终端（Terminal）让用户对系统拥有更大的控制权。


    # 执行命令


    命令行，或终端，是一个极其强大的界面。你在桌面上可以进行的所有操作都可以在终端内完成。让我们先看看它是如何工作的。


    - **步骤 1** 可以通过点击面板（Panel）上的终端图标访问终端，该图标位于 Firefox 和文件（Files）图标之间；或者通过打开菜单从左侧的快速启动栏中选择它。


    - **步骤 3** 你目前在终端中看到的是你的登录用户名，后面跟着计算机名称；这是你在第一次安装 Mint 时在设置时命名的。该行以当前文件夹名称结尾；起初只是一个波浪号
    `~`，代表你的主目录（Home folder）。


    ![](img/21ee864cf339a60c6b969b7bda291087_45_0.png)


    - **步骤 2** 终端让你访问 Linux Mint 的 Shell，称为 Bash，它让你能够访问底层操作系统。Mint 中的所有内容，包括桌面和 GUI，都是从命令行运行的模块。


    - **步骤 4** 行最末端闪烁的光标是输入基于文本命令的地方。你可以开始尝试一个简单的命令：打印工作目录（Print Working Directory，简称
    `pwd`），它会在屏幕上输出你当前所在的文件夹。输入 `pwd` 并按回车。


    ```

    david@david-mint ~ $ pwd

    david@david-mint ~ $

    ```


    ## 终端基础知识


    步骤 5 你输入的所有命令都以相同的方式工作：你输入命令，包含任何用于扩展命令用途的参数，然后按回车执行你入的命令。在终端中输入：`uname -a` 并按回车。这将显示有关
    Mint 的系统信息。


    步骤 8 “查看和搜索”（View and Search）选项允许你开启终端窗口的大小调整，当然，还可以在终端内搜索特定的关键词。


    ![](img/21ee864cf339a60c6b969b7bda291087_46_0.png)


    步骤 6 在我们输入命令之前，让我们花点时间看看终端提供哪些功能。菜单（Menu）选项允许你打开一个新的终端，创建一个新的配置（profile），你还可以更改终端的大小、颜色和行为，添加新标签页并关闭所有活动会话。


    步骤 9 “终端”（Terminal）条目进入配置编辑和尺寸调整界面，允许你更改字符编码。有趣的是，你还可以将其设置为“只读”（Read Only）模式，这会阻止你向终端输入命令；这在你需要显示命令时非常有用。


    ![](img/21ee864cf339a60c6b969b7bda291087_46_1.png)


    步骤 7 “编辑”（Edit）选项允许你在终端与其他源之间进行复制和粘贴命令；当你想要从网页上复制一个很长且复杂的命令时，你也可以编辑你的配置偏好。


    步骤 10 最后，“帮助”（Help）选项显示终端的帮助内容和版本号，或者更准确地说，未来我们将简单地将其称为 Terminal。“内容”（Contents）部分值得快速读一遍，以帮助熟悉终端的工作原理。


    ![](img/21ee864cf339a60c6b969b7bda291087_46_2.png)

    ![](img/21ee864cf339a60c6b969b7bda291087_46_3.png)


    ## 通过终端更新 Mint


    到目前为止，你一直在使用盾牌图标启动软件管理器（Mint Manager）来更新系统并升级当前安装的程序、工具和其他元素。然而，你也可以从终端完成完整的系统更新和升级。


    ## 使用 APT-GET


    要更新和升级终端，你需要使用 APT（高级软件包工具）命令。其强大的命令根据其用途组合了不同的元素。


    - **步骤 1** 从打开一个新的终端开始，或者如果你已经打开了一个终端，请使用 `clear` 命令。这会从一个干净的状态开始。


    - **步骤 3** `apt-get` 用于升级 Mint 中的软件，以及 Ubuntu 和其他基于 Debian 的发行版。使用“更新”（Update）元素会获取新软件包并更新源文件列表。“升级”（Upgrade）会下载并对文件的最新版本执行升级。要启动升级过程，输入：`sudo
    apt-get upgrade`，然后输入你的密码。


    ![](img/21ee864cf339a60c6b969b7bda291087_47_0.png)


    - **步骤 2** 在终端中输入 `apt-get`。这会列出常用命令列表以及命令的作用。如果现在看起来还不太清楚，那么值得一看。


    - **步骤 4** 注意到新增的 `sudo` 命令。`sudo` 命令让使用超级用户（Super User）变得容易得多。这意味着管理员用户（超级用户）使用
    APT（高级软件包工具）来获取任何。现在尝试这个：`sudo apt-get upgrade`。


    ```

    File Edit View Search Help

    apt-get 1.2.7 (ubuntu)

    apt-get install [command]

    apt-get remove [pkg-name]

    ```


    ```

    File Edit View Search Help

