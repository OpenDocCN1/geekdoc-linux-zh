    # Becoming Anonymous Online


    The digital age has led to many great advances in communications; however, it
    has also brought on a new age of spying and snooping. Most of us are no strangers
    to the frequent news stories of governments, secret organisations and underground
    hackers breaking our privacy but how can you combat this?


    # ANONYMITY WITH MINT


    While it''s virtually impossible to become totally anonymous, you can take measures
    to ensure your privacy is at best.


    +   * STEP 1 Starting with the basics, use HTTPS instead of the standard HTTP
    when browsing. This means anything that transmitted over HTTPS is secure (hence
    the S part at the end) and encrypted.


    +   * STEP 3 Although Google may seem like the obvious choice for a modern internet
    search, the company does track all searches made by an individual. Consider an
    alternative search engine, such as DuckDuckGo, a search engine that doesn''t store
    personal data or track you.


    ![](img/21ee864cf339a60c6b969b7bda291087_41_0.png)


    ![](img/21ee864cf339a60c6b969b7bda291087_41_1.png)


    +   * STEP 2 When you''re browsing, consider using the incognito or Private browsing
    modes in a browser. This disables your history and web cache, allowing you to
    browse without the details stored for later scrutiny by someone else. However,
    it doesn''t stop any data or search tracking.


    +   * STEP 4 If you''re regularly on the internet then consider installing some
    of browser-plugins. For example, for Firefox, use Ghostery, NoScript and AdBlock
    Plus to block trackers, adverts and other data mining techniques.


    ![](img/21ee864cf339a60c6b969b7bda291087_41_2.png)


    ![](img/21ee864cf339a60c6b969b7bda291087_41_3.png)'
