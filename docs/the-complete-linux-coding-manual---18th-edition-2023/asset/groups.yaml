    # USER ERROR


    User input is often the user''s mistake in code. For example, the user is supposed
    to enter a number for there but they entered it letters. Often a user can enter
    so much into an input that it overflows, thus the code crashing. Watch those user
    inputs and clearly state what you need from them.


    ```

    Enter an integer number

    You have entered wrong input

    You have entered wrong input

    sdfdf213213123

    You have entered wrong input

    12232423232323232323

    12

    The number is 12

    Process returned (0x0) execution time : 21.49 s

    Press any key to continue.

    ```


    # BACKUPS


    Always make a backup of your work, with a secondary backup for any changes you''ve
    made. Mistakes can be rectified if there''s a good backup in place to revert to.
    if something goes wrong it''s much easier to start where you left off, rather
    than starting from the beginning.


    ![](img/21ee864cf339a60c6b969b7bda291087_144_0.png)


    # RE-INVENTING WHEHELS


    You can spend days trying to fashion an out of code to achieve a given result
    and it''s frustrating and time-consuming. While it''s equally rewarding to solve
    the problem yourself, often the same code is out there on the internet. Don''t
    try reinvent the wheel, look to see if someone has done it first.


    ![](img/21ee864cf339a60c6b969b7bda291087_144_1.png)


    # SECURE DATA


    If you''re writing code to deal with usernames and passwords, or other sensitive
    data, ensure the data isn''t in cleartext. Learn to create a function to encrypt
    sensitive data before feeding into a route that can transmit or store it where
    might be able to view it.


    ![](img/21ee864cf339a60c6b969b7bda291087_144_2.png)


    # HELP!


    Asking for help is something most of us who has struggled with the past. Will
    the people be laughing at us? Is it everyone''s time? It''s a common mistake for
    someone to suffer in silence. As long as you are in the correct manner, obey any
    rules or be polite, your question isn''t silly!


    # MATHS


    If your code make calculations then you need to ensure that the maths is behind
    sound. There are thousands of instances where programs have offered incorrect
    data based on poor Mathematical coding, which can have disastrous effects on what
    the code is to set to. Shortly, double check your code equations.


    ```

    set variable x

    max = 5

    y = 3

    set complex (x, y) = (x, y), z = x + y

    set complex (x, y) = (x, y), z = x + y

    set string (x, y) = (x, y), z = x + y

