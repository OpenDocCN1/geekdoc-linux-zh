    Run ''sudo apt-get --upgrade'' to continue the process.

    ```


    ## 通过终端更新 Mint


    步骤 5 根据更新的类型，你可能需要等待 `sudo apt-get upgrade` 命令的结果。然后你可以尝试接受并继续。这里发生的情况是 apt-get
    有一些更新的软件要应用到 Mint，你又恢复正常了。步骤 7 你的系统现在根据 apt-get 命令提供的可用列表是最新的。如果你愿意，可以再次运行该过程。总结一下：`sudo
    apt-get update`，然后输入 `sudo apt-get upgrade` 并按回车。


