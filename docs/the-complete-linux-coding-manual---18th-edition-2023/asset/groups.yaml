    # INSTALLING LINUX


    Once the Live Environment has booted, see the option to install the distro to
    your computer. Have a look around and, when you''re ready, look for the Install
    option on the desktop.


    If you are connected to the internet (if not, then so) and you''re in the Live
    Environment, start the installation process by double-clicking on the Install
    Mint icon on the desktop. Other distros display their own name of of course, but
    the process is the same. Click Continue when you''re ready.


    ## STEP 1


    ![](img/21ee864cf339a60c6b969b7bda291087_22_0.png)


    Before the installation process begins, you''re asked if you chose to make sure
    the erasure of the hard drive is correct. This is your last chance to back out.
    If you''re certain you don''t mind wiping everything and starting again with Linux
    Mint, click Continue. If you need to backup your files from the Linux disc/USB,
    reboot, and start again.


    ## STEP 4


    ![](img/21ee864cf339a60c6b969b7bda291087_22_1.png)


    While the installation process is very similar across most Linux distros, some
    offer different questions during the installation. The questions aren''t too difficult,
    nothing very technical, but such as "Installing third-party software...". In this
    case you can click Continue but if you''re unsure, have an Internet-connected
    device available to ask any questions.


    ## STEP 2


    Eventually you are asked to set up your username and password. Enter your name
    to begin, with the Computer Name, which is the it on the network. Next choose
    a Username, followed by a password. You can click the Login Automically option
    but leave the Entry Home Folder option for now.


    ![](img/21ee864cf339a60c6b969b7bda291087_22_2.png)


    ![](img/21ee864cf339a60c6b969b7bda291087_22_3.png)


    When installing a new operating system it''s recommended that you wipe the old
    OS, replacing it with the new. With near this stage of the installation process,
    ensure the "Erase disk and install Linux" option is selected. NOTE: This completely
    wipes Windows 10 from your computer, make sure you have backups of all your personal
    files and data.


    ## STEP 3


    ![](img/21ee864cf339a60c6b969b7bda291087_22_4.png)


    The installation process can be quick, and there may be more questions to answer,
    or it may simply installing Linux based on your preferences. After this you will
    end being asked to Testing the Live Environment or Restarting to the newly installed
    OS. If you''re ready to use Linux, click Restart.


    ## STEP 6


    ![](img/21ee864cf339a60c6b969b7bda291087_22_5.png)


    # Installing a Virtual Environment


    A Virtual Environment is a simulated computer. Using a Virtual Machine, you can
    mimic a standard PC and install an entire operating system to it without affecting
    the one. It''s a great way to use Linux, while having Windows 10 as your main
    OS.


    ## GOING VIRTUAL


    Using a Virtual Machine (VM) takes resources from your computer: memory, hard
    drive space, processor usage and so on. Make sure you have enough of before commencing.


    - **STEP 1** We''re using VirtualBox in this instance, it''s one of the easiest
    virtual environments to get with. Enter virtualbox.org and click on ''Download''.
    This takes you to the main download page. Locate the correct host for your system:
    Windows or Mac, the installed operating system, and click the link to begin the
    download.

    - **STEP 2** Next, while still at the VirtualBox download page, locate the VirtualBox
    Extension pack. The Extension Pack supports USB devices as well as numerous extras
    that help make the VM environment like emulation of a real computer.

    - **STEP 3** With the correct packages downloaded, and before you install them,
    you need to make sure that the computer you''re using is able to host. Reboot
    the computer and enter the BIOS. When the computer starts up, press F2 or whichever
    key is necessary to Enter Setup.


    ![](img/21ee864cf339a60c6b969b7bda291087_23_0.png)


    Each BIOS is laid out differently and it''s very difficult to assess where to
    look in personal example. However, as general rule of thumb, you''re looking for
    Intel Virtualisation or simply Virtualisation found within the Advanced section
    of the BIOS. When you''ve located it, enable it, save the settings, and reboot
    the computer.


    ![](img/21ee864cf339a60c6b969b7bda291087_23_1.png)


    ![](img/21ee864cf339a60c6b969b7bda291087_23_2.png)


    - STEP 5 With the computer back up running, locate the downloaded VirtualBox application
    and double-click to begin the installation process. Click Next to continue, when
    you''re ready.


    - STEP 8 When installing VirtualBox your network connection is disabled for a
    brief period. This is due to VirtualBox being created, virtual network connection
    so that any VM installed can access the internet, and your network resources,
    by the computer''s already network connection. Click Next, then install to begin
    the installation.


    ![](img/21ee864cf339a60c6b969b7bda291087_24_0.png)


    ![](img/21ee864cf339a60c6b969b7bda291087_24_1.png)


    - STEP 6 The default installation location of VirtualBox should satisfy most users
    if you have any special location requirements click on the ''Browse'' button and
    change the install folder. Then, make sure all the icons in the VirtualBox feature
    tree are selected; if any of them have a red x to them, Click Next to move on.


    - STEP 9 You''ll be asked by Windows to accept a security notification. Click
    Yes for this and may encounter a dialogue asking you to trust the installation
    from Oracle; click yes and accept the installation of the VirtualBox application.
    When you click, finish to start VirtualBox.


    ![](img/21ee864cf339a60c6b969b7bda291087_24_2.png)


    ![](img/21ee864cf339a60c6b969b7bda291087_24_3.png)


    - STEP 7 This can be left off the defaults, as you wish. It makes a little easier
    easier when dealing with downloaded VMs, which you may encounter in the future.
    Again, clicking Next moves you to the next stage.


    ![](img/21ee864cf339a60c6b969b7bda291087_24_4.png)


    - STEP 10 With VirtualBox and up running you can now install the VirtualBox Extension
    Pack. Locate the downloaded add-on and double-click. There may be a short pause
    while VirtualBox installs the pack you may see a message to install; obviously
    click Install to begin the process, scroll down next screen to accept the agreement
    and agree!


    ![](img/21ee864cf339a60c6b969b7bda291087_24_5.png)


    # Installing Linux in a Virtual Environment


    With Oracle VirtualBox now up and running, the next task is to create the Virtual
    Machine (VM) environment into which you install Linux. This process won''t affect
    your currently installed operating system, which is why a VM is a great choice.


    ## CREATING THE VM


    There are plenty of options to choose from when creating a VM. For now, let''s
    set up a VM adequate to run Mint Cinnamon and perform well.


    - **STEP 1** With VirtualBox open, click on the New Icon in the top right of app.
    This opens the new VM.

    - **STEP 2** Next, while still at the VirtualBox download page, locate the VirtualBox
    Extension pack.

    - **STEP 3** With the correct packages downloaded, and before you install them,
    you need to make sure that the computer you''re using is able to host.

    - **STEP 4** The next-window that appears defines what type of virtual disk you
    want to create.

    - **STEP 5** The pop-window that appears after clicking Create is what type of
    virtual disk.

    - **STEP 6** The default installation location of VirtualBox should satisfy most
    users.

    - **STEP 7** The virtual hard disk is a single folder, to use you state in this
    instance.

    - **STEP 8** After Creating the initial setup of the VM is complete.

    - **STEP 9** Follow by clicking on the System section, then the Processor tab.

    - **STEP 10** Click on the Start button and use the explorer (a button labeled
    Start-up with a green arrow) to locate the downloaded ISO of Mint; then click
    to start the boot with the Linux Mint Live Environment.

