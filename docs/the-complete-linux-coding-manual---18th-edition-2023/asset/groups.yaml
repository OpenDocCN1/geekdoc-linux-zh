    # Getting to Know Linux


    > "Anyone can build a fast processor. The trick is to build a fast system."

    >– Seymour Cray (Electrical Engineer, and designer/founder of Cray Supercomputers)


    ![](img/21ee864cf339a60c6b969b7bda291087_27_0.png)


    We''ve used Linux Mint as a guideline here, as it''s an easy to use distro and
    perfect for former Windows users. It''s also one of the most developed and well
    documented Linux distros as well as having fantastic configuration options.


    In this section, we introduce the Linux Mint Cinnamon Menu and Desktop Environment,
    how it works and what you can do to customise it. Want to create another user
    or even discover how to become anonymous online? Read on.


    - 30 Introduction to the Cinnamon Menu

    - 32 Navigating the Cinnamon Desktop

    - 34 10 Things to do After Installing Linux Mint

    - 36 Did You Know...Apollo 11

    - 38 Creating Users

    - 40 Customising the Desktop

    - 42 Becoming Anonymous Online


    ![](img/21ee864cf339a60c6b969b7bda291087_28_0.png)


    # Introduction to the Cinnamon Menu


    Now that you have Linux installed it''s time to have a good look around. First
    though, if you''re using Virtualbox you''ll have a notification regarding Software
    Rendering; here''s how to fix it.


    ## CINNAMON VIRTUALBOX FIX


    You''re already looked at list functions, using .insert, .remove, and .pop but
    there are also functions that can be applied to strings.


    **STEP 1** Before we begin, we''re assuming you''re having this within Virtualbox.
    The Software Rendering message appears in the top right of the desktop. To fix
    this, click on Devices in the Virtualbox window, followed by Insert Guest Additions
    CD image.


    **STEP 3** After a moment or two you''re automatically dropped into a command
    line view, called the Terminal in Linux. This details the installation of the
    new VirtualBox drivers, removing any old drivers it detected, and installing the
    latest version. It won''t take long and when it''s done you will be asked to restart
    the terminal.


    ![](img/21ee864cf339a60c6b969b7bda291087_29_0.png)


    ![](img/21ee864cf339a60c6b969b7bda291087_29_1.png)


    **STEP 2** The Guest Additions CD contains drivers for Virtualbox, including video
    hardware. When it''s loaded, you''ll get a ''software needs running'' notification
    with two options: Cancel and Run. Click the Run button and enter your password.


    **STEP 4** The VirtualBox Additions CD is on the desktop, so right-click it and
    then scroll down the menu to click. You can now restart Linux by clicking the
    menu icon in the left, then the Restart button. This reboots Mint and the problem
    is fixed.


    ![](img/21ee864cf339a60c6b969b7bda291087_29_2.png)


    ![](img/21ee864cf339a60c6b969b7bda291087_29_3.png)


    # CINNAMON ON THE MENU


    Now the Software Rendering Issue for Virtualbox is out of the way, let''s take
    a look at the Menu and how it works. Remember, this is just for Cinnamon, other
    distros look and behave differently.


    **STEP 1** First off, you may have already noticed the Welcome Screen that pops
    up when you login. Take a moment to browse through the options and so on. When
    you''re done, click the X in the top corner of the window to close.


    **STEP 4** Open the Menu again but this time hover the mouse pointer over Graphics,
    then click on GNU Image Manipulation. GIMP is a powerful app that''s as effective
    as Adobe Photoshop but requires a little work to get the results. It''s worth
    taking the time to master, though.


    ![](img/21ee864cf339a60c6b969b7bda291087_30_0.png)


    **STEP 2** You''ve already used the Menu to reboot the system and when you first
    used Live Environment, click the Menu and hover over the Office entry in the middle
    column. This changes the icons in the right-hand column, detailing what apps are
    installed under that.


    **STEP 5** If you''re looking for a particular function, such as setting a printer,
    click on the Search box at the top of the Menu. Start typing the app or function
    you want, such as printers, and the Menu displays the relevant options below.
    This works with modern menus, regardless of the distro.


    ![](img/21ee864cf339a60c6b969b7bda291087_30_1.png)


    ![](img/21ee864cf339a60c6b969b7bda291087_30_2.png)


    **STEP 3** Launching any of the apps from the Menu is as simple as finding and
    clicking it. For example, under the Office section, click on LibreOffice Writer.
    Writer is the preinstalled word processor for Linux Mint. It opens and saves the
    same way.


    **STEP 6** Hover over any of the apps listed on the right-hand column and right-click,
    to be presented with a list of options: Add to Panel, Add to Desktop, Add to Favorites
    and Uninstall. Most of these options are obvious in this use. Add to Favorites
    places the app in the left-hand, quick-access column.


    ![](img/21ee864cf339a60c6b969b7bda291087_30_3.png)


    ![](img/21ee864cf339a60c6b969b7bda291087_30_4.png)


    # Navigating the Cinnamon Desktop


    Each desktop environment behaves differently to that of the next. Some DEs offer
    widgets that can be customised and placed on the desktop, others instead opt for
    a clean, sharp look to keep everything running as fast as possible. Let''s see
    what the Cinnamon desktop has to offer.


    ## A TOUCH OF Spice


    The Cinnamon desktop environment is a great blend of style and performance. There''s
    lots to know about it, which is why it''s a popular DE.


    **STEP 1** Begin exploring the Cinnamon by double-clicking the icon. This brings
    Nemo, the file manager used in Cinnamon. The Computer icon opens the root level
    file system, with access and views to the optical drive (if you have one installed),
    hard drive and core Linux file system.


    **STEP 3** Nemo has many different features, views and ways so that you can view
    and manage files and folders. For example, if you have images in the Pictures
    folder, you can select the icon zoom for the images by using the slider located
    in the bottom right of Nemo, labelled Adjust Zoom Level.


    ![](img/21ee864cf339a60c6b969b7bda291087_31_0.png)


    **STEP 2** The Linux file system can appear confusing to a former Windows user,
    so until you''re a little more knowledgeable about how it works, we''d recommend
    you concentrate on the Home Icon on the desktop instead. Here is everything relating
    to your user account: where you store Pictures, Videos, Music, Documents, Downloaded
    items etc.


    **STEP 4** Just like any good file manager, if you right-click any of the files
    or folders you get a wealth of options. In the case of Cinnamon, the default allows
    you to play or edit the file.


    ![](img/21ee864cf339a60c6b969b7bda291087_31_1.png)


    # Navigating the Cinnamon Desktop


    **STEP 5** At the bottom of the desktop we''ve already looked at one of the Panel.
    If you right-click anywhere the Panel, you can add a different way.


    **STEP 8** From that desktop right-click menu, select Customise, followed by the
    Desktop link. This opens a new window where you''re able to edit icons. If you''re
    using a setup with multiple monitors, you can also choose which monitor displays
    icons.


    ![](img/21ee864cf339a60c6b969b7bda291087_32_0.png)


    **STEP 6** For example, if you click the Modify Panel, you can remove, move the
    Panel, add a new one and clear it of any Applets that are currently present. An
    Applet, by the way, is an app that is designed to work and fit into the Cinnamon
    Panel.


    **STEP 7** If you right-click anywhere the Cinnamon desktop you see a set of options
    that allows you to further add, or edit the desktop content. It''s very similar
    to that of Windows, where why Mint is a good choice for Ex-Windows users.


    - Themes

    - System Settings

    - Troubleshoot

    - Modify panel

    - Remove panel

    - Add panel

    - Move panel

    - Copy applet configuration

    - Paste applet configuration

    - Clear all applets


    - New Folder

    - Create New Document

    - Add Deskslets

    - Change Desktop Background

    - Create a new launcher here...

    - Open in Terminal

    - Open as Root

    - Customise

    - Paste

