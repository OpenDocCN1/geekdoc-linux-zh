    \ **rev**，现在输入一些文本，当你按下 **Enter** 时，一切都会被反转。按 **Ctrl+C** 退出。\n\n![](img/21ee864cf339a60c6b969b7bda291087_59_1.png)\n\
    \n```\nFile Edit Search Terminal Help\ndavid@david-mint ~\nrev is used for creating\
    \ passwords with:\ndavid@david-mint ~ $\n```\n\n- **步骤 5** 如果你卡在计算任何数字可能的因数上，只需输入数字。例如，`factor\
    \ 7` 提供的不多，而 `factor 60` 显示的更多。\n\n```\nFile Edit Search Terminal Help\ndavid@david-mint\
    \ $ factor 7\n7 is prime\ndavid@david-mint $ factor 60\n60 is prime\n```\n\n-\
    \ **步骤 8** 如果出于什么原因，你想扩展整个世界，那么将其传递给它；`fortune | cowsay`，对于图形牛总有 `cowsay`。尝试一下……这太酷了。\n\
    \n![](img/21ee864cf339a60c6b969b7bda291087_60_0.png)\n\n- **步骤 6** 在相当酷和非常奇怪之间有一条界限。拥有一个\
    \ ASCII 牛可能会掉入后者。输入 `cowsay Linux Mint is cool!`！事实上，你甚至可以通过 `ls | cowsay` 输出\
    \ `ls`。\n\n```\nFile Edit Search Terminal Help\ndavid@david-mint $ install Linux\
    \ Mint is cool!\nls | cowsay\n|  |\n(oo)\ndavid@david-mint $ ls | cowsay\ncd Desktop/Pictures/Videos/\n\
    david-mint $\n```\n\n- **步骤 9** 我们承认，`toilet` 命令并没有给人信心。然而，它并没有开始时那么糟糕。通过 `sudo\
    \ apt-get install toilet` 安装它。安装后，输入类似的内容：`ls | toilet` 列出当前文件夹的内容。\n\n```\nFile\
    \ Edit Search Terminal Help\ndavid@david-mint $ toilet\ndavid@david-mint $ # toilet\n\
    # toilet\n# toilet\n# toilet\n# toilet\n# toilet\n# toilet\ndavid@david-mint $\n\
    ```\n\n- **步骤 7** 为了跟随牛的图形化的（即非终端的），你可以通过 `apt-get install cowsay` 安装它；安装后使用 `cowsay`\
    \ 输出某些内容，例如：`cowsay | Publications`。\n\n```\nFile Edit Search Terminal Help\n\
    david@david-mint $ toilet -f metal\ndavid@david-mint $ toilet\ndavid@david-mint\
    \ $\n```\n\n- **步骤 10** 通过扩展 `toilet`，你可以用它生成密集的图形。例如，尝试 `toilet -f metal`。你可以输入\
    \ `toilet --help` 获取进一步扩展的命令参数列表。\n\n![](img/21ee864cf339a60c6b969b7bda291087_60_1.png)\n\
    \n![](img/21ee864cf339a60c6b969b7bda291087_60_2.png)\n\n## 使用终端\n\n## 终端中的更多趣味趣事\n\
    \n如果之前的终端中趣味且非常古怪的活动列表让你想要更多，那么你幸运了。我们为你准备了另一批一些有用和一些没用的命令供你尝试。\n\n更多乐趣，万岁\n既然终端会话已经打开，你的手指也已经热热了，这里有另外两页的终端胡话。\n\
    \n- **步骤 1** 记得 ZX Spectrum 的计算梦想，当你输入 `echo` 来打印 \"Hello\"，是的，在 Linux Mint 中你也可以这样做。只需输入一些文本，例如：`echo\
    \ Linux is cool`。它会一直持续直到你按下 **Ctrl+C**。\n\n- **步骤 3** 让一只小小白猫在桌面上追踪你的鼠标指针听起来像是浪费时间。但奇怪的是，事实如此。`sudo\
    \ apt-get install oneko`，然后输入 `oneko` 让小猫出现。你的“鼠标”光标会在屏幕上移动，猫会追逐它。\n\n```\nFile\
    \ Edit Search Terminal Help\ndavid@david-mint ~\necho Hello\ndavid@david-mint\
    \ ~\n```\n\n- **步骤 2** 《黑客帝国》是被复制次数最多的电影之一；Linux Mint 有一个版本的黑客代码。通过 `sudo apt-get\
    \ install matrix` 安装。完成后输入 `matrix` 并跟随白兔，墨。与真实的 Matrix 不同，你可以按 **Ctrl+C** 退出。\n\
    \n- **步骤 4** 这一条比之前的要严肃一点。它被称为“叉炸弹”，它的原理是不断复制直到用尽所有可用系统资源，导致你的电脑崩溃。你不需要尝试它，但它确实有趣。只需输入\
    \ `:(){}:` 准备好重启。\n\n```\nFile Edit Search Terminal Help\ndavid@david-mint ~$\
    \ :() { :(); };\n```\n\n"
