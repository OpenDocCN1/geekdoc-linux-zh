    \ focal-updates Release\nFetching: http://archive.ubuntu.com/ubuntu focal-security\
    \ In\nGet: http://archive.ubuntu.com/ubuntu focal-security Release\nReading package\
    \ lists... Done\nBuilding dependency tree... Done\nReading state information...\
    \ Done\n0 upgraded, 0 newly installed, 0 not to upgrade.\n```\n\n![](img/21ee864cf339a60c6b969b7bda291087_49_0.png)\n\
    \n- **STEP 4** Sometimes, when installing software, you need to add the app's\
    \ Repository. The repository, or repo, is the remote location where the software\
    \ is held, along with all its dependencies (the virtual libraries and books it\
    \ needs to function). To start this, enter: `sudo apt-get-repository ppa:peter-levi/ppa`.\
    \ Press Enter when asked to add and add the PPA (Personal Package Archive).\n\n\
    ```\nFile Edit View Search Terminal Help\ndavid@linuxmint~: $ sudo apt-get install\
    \ stella\n```\n\n```\nFile Edit View Search Terminal Help\ndavid@linuxmint~: $\
    \ sudo apt-get-repository ppa:peter-levi/ppa\nAdding packages for the Variety\
    \ package changer\nMore info: https://launchpad.com/archive/ubuntu/ppa\nPress\
    \ Enter to continue or cancel.\n```\n\n- **STEP 6** Now to install Variety, enter:\
    \ `sudo apt-get install variety`. Press y to accept and confirm the installation,\
