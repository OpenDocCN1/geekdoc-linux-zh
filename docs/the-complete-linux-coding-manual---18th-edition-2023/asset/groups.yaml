    # Customising the Desktop


    Customising the operating system desktop is one way to make it your own: a personalised
    workspace that there is to help you work, inspire or feature the company logo.
    Whatever your reasons for having your own desktop, here''s how it''s done.


    ## YOUR DESKTOP


    Linux is probably one of the most customised operating systems there is. With
    just a few tweaks, one or two extras installed and so imagination, you can create
    something incredible.


    - STEP 1: The first aspect of desktop customised is to change the wallpaper. Right-click
    the desktop and choose Change Desktop Background. This opens the Background in
    Linux Mint; remember, others distros may present their background, wallpaper selection
    tools differently.


    - STEP 2: More recent versions of Linux Mint display available backgrounds, depending
    on the version the user is running. You normally get three categories followed
    by a fourth, Pictures, which are separated from the others. The Pictures option
    is different because it reads the image content from the Pictures folder in your
    Home area.


    - STEP 3: You just need to click the available images, from any of the locations
    provided to have them as the desktop wallpaper. Incidentally, if you have images
    stored in another location on your system or network, you can add them by clicking
    the Plus symbol at the bottom of the Backgrounds console, using the file manager
    to locate them.


    ![](img/21ee864cf339a60c6b969b7bda291087_39_0.png)


    - STEP 4: By clicking on the Settings tab you can, instead, play numerous images
    as a slideshow or change the aspect of the wallpapers to a variety of choices.


    ![](img/21ee864cf339a60c6b969b7bda291087_39_1.png)

    ![](img/21ee864cf339a60c6b969b7bda291087_39_2.png)

    ![](img/21ee864cf339a60c6b969b7bda291087_39_3.png)


    - STEP 5: If none of the available wallpapers take your Fancy, open a browser
    and search for the type of background image you prefer. When you found the image
    you want as the desktop wallpaper, right-click it and choose Set As Desktop Background
    from the list of options. When the Set Desktop Background console open, click
    the Set Desktop Background button.


    - STEP 6: Click the Menu button and search for ''/desktop'' and click the Desktop
    Settings results. The Desktop console allows you to pick the layout, desktop icons
    and options for multi-monitor support you want. You can experiment with the options
    for the best setup, according to your tastes.


    - STEP 7: In addition to changing the desktop wallpaper, and how the icons are
    displayed, you can also alter the overall theme for Linux Mint. From the Mint
    Menu, search for ''themes'' and click the Themes as it appears in the search results.


    - STEP 8: Themes allows you to change the certain aspects of the Mint desktop
    look: Window Borders, Icons, Controls, Mouse Pointer and Desktop. In the Settings
    tab you can extend the options with a Few on/off sliders


    ![](img/21ee864cf339a60c6b969b7bda291087_40_0.png)

    ![](img/21ee864cf339a60c6b969b7bda291087_40_1.png)


    - STEP 9: If you click the Add/remove button in the center of the three available
    options, you can choose the default view from a number of preinstalled themes.
    Click the theme you want, click the Install (downward-pointing arrow) button to
    enable it.


    ![](img/21ee864cf339a60c6b969b7bda291087_40_2.png)

    ![](img/21ee864cf339a60c6b969b7bda291087_40_3.png)


    - STEP 10: Click Back on Themes, then Desktop and you can locate the newly installed
    theme and apply to your desktop. Any Installed themes can also be uninstalled
    via the Add/ Remove button. It''s worth spending time personalising the desktop
    you want it and there are some incredible themes available.


    ![](img/21ee864cf339a60c6b969b7bda291087_40_4.png)

    ![](img/21ee864cf339a60c6b969b7bda291087_40_5.png)


    # Becoming Anonymous Online


    The digital age has led to many great advances in communications; however, it
    has also brought on a new age of spying and snooping. Most of us are no strangers
    to the frequent news stories of governments, secret organisations and underground
    hackers breaking our privacy but how can you combat this?


    ## ANONYMITY WITH MINT


    While it''s virtually impossible to become totally anonymous, you can take measures
    to ensure your privacy is at best.


    - STEP 1: Starting with the basics, use HTTPS instead of the standard HTTP when
    browsing. This means anything that transmitted over HTTPS is secure (hence the
    S part at the end) and encrypted.


    - STEP 2: When you''re browsing, consider using the incognito or Private browsing
    modes in a browser. This disables your history and web cache, allowing you to
    browse without details stored for later by someone else. However, it doesn''t
    stop any data or tracking.


    - STEP 3: Although Google may seem like the obvious choice for a modern internet
    search, the company does track all searches made by an individual. Consider an
    alternative search engine, such as DuckDuckGo, a search engine that doesn''t store
    personal data or track you.


    ![](img/21ee864cf339a60c6b969b7bda291087_41_0.png)

    ![](img/21ee864cf339a60c6b969b7bda291087_41_1.png)


    - STEP 4: If you''re regularly on the internet then consider installing some browser-plugins.
    For example, for Firefox, use Ghostery, NoScript and AdBlock Plus to block trackers,
    adverts and other data mining techniques.


    ![](img/21ee864cf339a60c6b969b7bda291087_41_2.png)

    ![](img/21ee864cf339a60c6b969b7bda291087_41_3.png)


    # VPNS AND TOR


    The previous steps can aid your online privacy to really become anonymous you
    need Virtual Private Network and Tor.


    - STEP 1: A VPN is a remote server, or cluster of servers, that establishes a
    connection with your computer. The end result is that your computer''s identity
    on the Internet is hidden behind the VPN remote server; so you could use it without
    an IP address.


    - STEP 2: Most good VPN charge a monthly or annual fee but it''s worth the expense.
    With CyberGhost, which connections for Windows, Mac, Mint (with any other Linux
    distribution), Android and iOS devices. Details for each OS can be found at www.cyberghost.com/hz/us/articles/read-me-first/


    - STEP 3: Another option is to use Tor. Tor is an open network that you can connect
    to hide your IP address behind countless nodes around the world. It is very easy
    to install and use. By navigating to www.torproject.org/download/download-easy.html
    and clicking on the Download Linux 64-bit version.


    - STEP 4: When the download has finished, drop into the Terminal and enter Downloads
    folder, Enter ls to check if tar.xz is present, then enter: tar -xzf tor-browser-linux64-8.0.tar.xz
    (if your version is different press Tab to autocomplete the filename). When the
    files are unpacked, use cd tor-browser-en/ to enter the network now.


    - STEP 5: A quick install a couple of files: a folder Browser and a file ''start-browser.desktop''.
    To start the setup, use ./start-browser.desktop. This command launches the Tor
    setup, where you are offered two options: Connect or Configure. Click Next when
    you''re ready.


    - STEP 6: After the connection is established, the Tor launches. And from here
    you can customise a version of Firefox without being viewed or tracked. Mixing
    both VPN and Tor makes for an extremely secure and private connection to online.


    ![](img/21ee864cf339a60c6b969b7bda291087_42_0.png)

    ![](img/21ee864cf339a60c6b969b7bda291087_42_1.png)

    ![](img/21ee864cf339a60c6b969b7bda291087_42_2.png)


    # Linux Coding & Programming


    ## Using the Terminal


    ![](img/21ee864cf339a60c6b969b7bda291087_43_0.png)


    # Linux: the operating system with a CLI... Command Line User Environment.


    The Linux command line, the Terminal, is an incredibly powerful environment. From
    it, you can bring the OS to its knees, or update it to something spectacular.
    You can hack into remote computers, look at an ASCII campfire, install new apps
    and programs, watch Star Wars played out from a server in the Netherlands, and
    code automated scripts.


    – Anonymous (Posted on comp.software.testing)


    In this section you will explore the intricacies of the Terminal, and how it works
    with Linux. You will learn how to manipulate the Linux File system from the Terminal,
    and you will discover some odd, but fun things you can do in the Terminal.


    The Terminal rules supreme in the world of Linux. Learn how it works, and you
    can access all that power.


    ![](img/21ee864cf339a60c6b969b7bda291087_44_0.png)


    | | |

    | :--- | :--- |

    | 46 | Basics of the Terminal |

    | 48 | Update Mint via the Terminal |

    | 50 | Install Apps via the Terminal – Part 1 |

    | 52 | Install Apps via the Terminal – Part 2 |

    | 54 | Did You Know...Linux Kernel 0.01 |

    | 56 | Creating a File Using the Terminal |

    | 58 | Creating and Removing Directories |

    | 60 | Fun Things to do in the Terminal |

    | 62 | More Fun Things to do in the Terminal |

    | 64 | Linux Tips and Tricks |

    | 66 | Did You Know...Linux and the Big Bang |

    | 68 | Creating Bash Scripts– Part 1-5 |

    | 78 | Pi x Linux = The Perfect Combination |

    | 80 | Command Line Quick Reference |

    | 82 | A-Z of Linux Commands |

    | 84 | Did You Know...Good enough for NASA |

    '
