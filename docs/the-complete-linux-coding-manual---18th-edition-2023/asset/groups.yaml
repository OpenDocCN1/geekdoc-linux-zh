    ## CREATING A BACKUP SCRIPT


    One of the most used examples of Bash scripting is the creation of a backup routine,
    that operates the task as well as adding some customizations along the way.


    STEP 1 A very basic backup script would look something along the lines:

    #!/bin/bash

    tar cvf ~/backups/my-backup.tgz ~/Documents. This will create a compressed file
    of the Documents folder, with everything in it, and put it in a folder ~/backups.


    STEP 2 Perfectly, we can make the script a lot more interactive. Let''s begin
    with defining some variables. Enter the text in the screenshot to a new script.
    Since we''ll probably misspell ''source'' as ''sauce'', this is because there
    is built-in command ''source'' which differs depending on os.


    STEP 3 The previous script allowed you to create a Stamp, so you know when backup
    was taken. We will now create a ''dest'' variable, which is the folder and add
    some code to check if ~/backups exists, if not, then creates it.


    STEP 4 Once the ~/backups folder is created, we can now create a new subfolder
    within it at the beginning. mkdir -p $DEST.


    STEP 5 With everything in, you can now enter the actual backup routine, based
    on Step 5. Combined with the variables, we use: tar cvf $DEST/$(Day $Year)/Backup.tgz.
    In the screenshot, we added a handy "Back up..."


    STEP 6 Finally, you can add a friendly message: echo "Backup complete..." The
    completed script is now over complex and can be easily customised to include any
    folder within your Home, as well as the Home area itself.


