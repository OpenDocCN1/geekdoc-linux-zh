    # Saving and Executing Your Code


    While working in the IDLE Shell is perfectly fine for small code snippets, it''s
    not designed for entering longer program listings. In this section you''re going
    to be introduced to the IDLE Editor, where you will be working from now on.


    ## EDITING CODE


    You will eventually reach a point where you have to move on from inputting single
    lines of code into the Shell. Instead, the IDLE Editor will allow you to save
    and execute your Python code.


    - **STEP 1** First, open the Python IDLE Shell when it''s up, click on File >
    New File. This will open a new window with Untitled as name. This is the Python
    IDLE Editor and within it you enter the code needed to create your programs.

    - **STEP 2** The IDLE Editor is, for all intents and purposes, a simple text editor
    with Python features, coding and so on; in the same vein as Sublime. You enter
    the code as you would within the Shell, taking an example from the previous tutorial:

    - **STEP 3** You can see that the same colour coding is in place the IDLE Editor
    as it is in the Shell, enabling you to better understand what''s on with your
    code. However, to execute the code you need to first save. Press F5 and you get
    a Save box open. img/21ee864cf339a60c6da91087_95_0.png

    - **STEP 4** Click on the OK button in the Save box and select a destination where
    you will save all your Python code. The destination is a dedicated folder called
    Python or can just dump it wherever you like. Remember to keep it tidy though,
    to help you out in the future.

    ```

    print("Hello world!")

    ```

    img/21ee864cf339a60c6b6da91087_95_1.png

    - **STEP 5** Enter a name for your code, ''print hello'' for Python code is saved,
    and click on the Save button. Once it''s executed the output will be detailed
    in the IDLE Shell. In this case, the words ''Hello everyone!''

    - **STEP 6** This is the vast majority of your Python code will be conducted.
    Enter into the Editor, F5, save the code and look at the output in the Shell.
    Sometimes it will differ, depending on whether you''ve requested a window, but
    essentially thats the process you will use throughout this book, otherwise stated.

    - **STEP 7** If you open the file of the saved Python code, you can see that it
    ends in a .py extension. This is the default Python file name. Any code you create
    will be whatever.py any you download from the Internet Python resources will be
    .py. Just ensure that code is written correctly

    - **STEP 8** Let''s extend the code and enter a few examples from the previous
    tutorial:

    ```

    a=2

    b=2

    name="David"

    surname="Howard"

    print(name, surname)

    print(a+b)

    ```

    img/21ee864cf339a60c6b6da91087_96_0.png

    - **STEP 9** If you click the OK button, the file will be overwritten with the
    new code entries, and executed with the output in the Shell. It''s not a problem
    with just few lines but if you were to edit a larger file, overwriting can become
    an issue. Use File > As to create a new file.

    - **STEP 10** Now create a new file. Close the Editor, and open a new instance
    (File > New File from the Shell). Enter the following and save it hello.py.

