    # Basics of the Terminal


    Most operating systems use two kinds of interface, the GUI, which is the desktop
    that Windows, macOS and Linux Mint boot into the command line. While modern operating
    systems shift away from the command line, Mint uses the Terminal to give the user
    greater control of the system.


    # TAKING COMMAND


    The command line, or Terminal, is an extremely powerful interface. Everything
    you can do on the desktop can be done within the Terminal. Let''s start by seeing
    how it works.


    +   **STEP 1** Terminal can be accessed by either clicking on the Terminal icon
    on the Panel, located between the Firefox and Files icons or by opening the Menu
    and selecting it from the left-hand quick launch strip.


    +   **STEP 3** What you currently see in the Terminal is your login name followed
    by the name of the computer; as you named during setup when you first installed
    Mint. The line ends with the current folder name; at first this is just a tilde
    ~, which means your Home folder.


    ![](img/21ee864cf339a60c6b969b7bda291087_45_0.png)


    +   **STEP 2** The Terminal gives you access to the Linux Mint Shell, called Bash,
    which gives you access to the underlying operating system. Everything in Mint,
    including the desktop and GUI, is a module running from the command line.


    +   **STEP 4** The flashing cursor at the very end of the line is when your text-based
    commands are entered. You can begin to experiment with a simple command, Print
    Working Directory (pwd), which outputs the current folder you''re in the screen.
    Type `pwd` and press Enter.


    ```

    david@david-mint ~ $ pwd

    david@david-mint ~ $

    ```'
  - '[PAGE 46]


    # Basics of the Terminal


    STEP 5 All the commands you enter work in the same manner: you enter the command,
    include any parameters to extend the use of the command and press Enter to execute
    the command you''ve entered. Type into the Terminal: uname -a and press Enter.
    This displays system information regarding Mint.


    STEP 8 View and Search options let you enable the sizing of the Terminal window
    and of course search within the Terminal for particular key words.


    ![](img/21ee864cf339a60c6b969b7bda291087_46_0.png)


    STEP 6 Before we get into entering commands, let''s take a moment to see what
    the Terminal has to offer. The menu option allows you to open a new Terminal,
    create a new profile, you can also alter the size, colors and behaviour of the
    Terminal, add a new tab, and close all active sessions.


    STEP 9 The Terminal entry enters the profile editing and sizing and allows you
    to alter the character encoding. Interestingly, you can also set it to a Read
    Only mode, which stops you from entering commands into the Terminal; this is good
    for when you need to perform display the commands.


    ![](img/21ee864cf339a60c6b969b7bda291087_46_1.png)


    STEP 7 The Edit option lets you to copy and paste commands to and from the Terminal
    and other sources; when you want to copy a very long and complex command from
    a web page, you can also edit your profile preferences.


    STEP 10 Finally, the Help option displays the help contents and version number
    of the Terminal, or to be more precise, we''ll simply refer to it as Terminal
    in Future. The Contents are worth having a quick read through, to help familiarise
    yourself with how the Terminal works.


    ![](img/21ee864cf339a60c6b969b7bda291087_46_2.png)


    ![](img/21ee864cf339a60c6b969b7bda291087_46_3.png)'
