    ## Getting Started with Linux


    > "In real open source, you have the right to control your own destiny."

    > —Linus Torvalds (developer of the Linux kernel)


    ![](img/21ee864cf339a60c6b969b7bda291087_17_0.png)


    It''s all fine and well talking about good Linux is, but how do you get it on
    your computer? Installing Linux is remarkably simple but there are several options
    available to you. This section looks into how you can download the Linux ISO,
    install it on a PC as your main operating system and even how to install a virtual
    environment.


    With a virtual environment you can run Linux while still using your main operating
    system, that be Windows or macOS. Intrigued? Read on and find out more.


    - 20 Creating a Linux Installer on Windows

    - 22 Installing Linux on a PC

    - 24 Installing a Virtual Environment

    - 26 Installing Linux in a Virtual Environment


    ![](img/21ee864cf339a60c6b969b7bda291087_18_0.png)


    ## Creating a Linux Installer on Windows


    You need to transfer the downloaded Linux ISO to either a DVD or a USB key before
    being able to install it onto a computer. This will be a live environment, which
    allows you to test the OS prior to installation, but first you need to create
    the bootable media.


    ### DVD BOOTABLE MEDIA


    We''re using a Windows 10 PC to transfer the ISO to a DVD. If you''re using a
    version of Windows 7 onward the process is extremely easy.


    - STEP 1 First locate the ISO image of Linux you''ve already downloaded. You can
    usually find it in the Folders in Windows 7, 8.1 and 10 computers, unless you
    specified a different location when saving it.


    - STEP 2 Insert a recordable DVD disc into your computer''s optical drive. After
    a few seconds, while the disc is read, Windows displays a pop-up message asking
    what to do with the newly inserted disc, ignore this, as we''re going to use the
    built-in image burning function.


    - STEP 3 Right-click the Linux ISO and from the menu select Burn Disc Image. Depending
    on the speed of the PC, it may take a few seconds before anything happens. Don''t
    worry much, unless it takes more than a minute, in which case it might be worth
    restarting your PC and trying again. With luck, the Windows Disc image burner
    should launch.


    Quick access Dropbox (Team BDM) OneDrive This PC CD Drive (E:) HiSuite Network
    linuxmint-19.1-cinnamon-64bit


    - STEP 4 With the Windows Disc image burner box open, click the ''Verify disc
    after burning'' tick box, then click Burn. The process should take a few minutes,
    depending on the speed of your PC optical drive. Once it completes it through
    the verification stage and when the optical drive should auto-eject the disc for
    you.


    ![](img/21ee864cf339a60c6b969b7bda291087_19_0.png)


    ### BOOTABLE MEDIA


    USB media is faster than a DVD and often more convenient, as most PCs don''t have
    an optical drive installed. The process of transferring the image is easy but
    you need a third-party app and a USB flash drive of 4GB or more.


    ![](img/21ee864cf339a60c6b969b7bda291087_20_0.png)


    ### STEP 1


    Open a web browser and go to rufus.ie. Download a little and go to the Downloading
    page to find the latest version of Rufus. Click the link to start the download.


    | Drive Properties | |

    | --- | --- |

    | Ubuntu 20.04.6 LTS (5 GB) | SELECT |

    | ubuntu-20.04.6-desktop-amd64.iso | |

    | Partition scheme Target system | |

    | MBR or UEFI | |


    - Show advanced properties

    - Show advanced options


    ![](img/21ee864cf339a60c6b969b7bda291087_20_1.png)


    Status


    ### STEP 2


    The downloaded USB executable. Follow the Windows system question to check for
    updates. When Rufus launched it should already identify your flash drive; if not,
    remove and restart.


    | Drive Properties | |

    | --- | --- |

    | Linux Mint 19 Cinnamon 64-bit (4.1 GB) | |

    | ISO (Image) selection | SELECT |


    - Show advanced properties

    - Show advanced options


    | Format Options | |

    | --- | --- |

    | File system Cluster size | |

    | FAT32 (default) | |


    ![](img/21ee864cf339a60c6b969b7bda291087_20_2.png)


    Status


    ![](img/21ee864cf339a60c6b969b7bda291087_20_3.png)


    ### STEP 3


    At first Rufus will find it a little confusing dont worry, it''s quite simple.
    To begin, click on the SELECT button to choose the ''Disk'' or Image Mode. This
    launches the Linux Explorer where you can locate and select the ISO.


    Files that must be downloaded from the internet will be downloaded in the current
    directory and will reassembled automatically.


    ### STEP 4


    When you''re ready, click the Start button of the Rufus app. This may open another
    dialogue asking you to download and use a new version of Syslinux. Rufus is a
    collection of boot loaders to allow your PC to boot from USB flash drive. It is
    necessary, so if asked click ''Yes'' to continue. New versions of Syslinux can
    look different from one to another, Select ''No'' to continue.


    ![](img/21ee864cf339a60c6b969b7bda291087_20_4)


    ### STEP 5


    The next step asks which you want to write the Linux ISO to the USB flash drive
    generally the recommended Image Mode is more popular. Make sure this option is
    selected and click OK to continue, followed by OK to confirm the action. The image
    you selected is ''ISOHybrid''. This means it can be written in ISO (file mode)
    or DD (disk image). Rufus writes only partitions, so that you have access to the
    drive after writing. If you encounter errors during booting, you can try writing
    this image again. Please select the mode you want to use for writing image:


    - Write in ISO mode (Recommended)

    - Write in DD mode


    ![](img/21ee864cf339a60c6b969b7bda291087_20_5)


    ### STEP 6


    The ISO is now transferred to your flash drive. The process shouldn''t take too
    long, especially depending on the speed of the USB drive you found. Rufus auto-boots
    the USB drive in Windows Explorer during the process; when it is over if you want,
    click on the button.


