    - `clear` 如果可能则清除屏幕。查看环境变量中的终端类型，然后查看终端手册以确定如何清除屏幕。在使用 bash shell 时等同于按下 Ctrl-L。\n\
    - 对于“创建目录”，mkdir 用于在文件系统中创建目录，如果该目录不存在。例如，mkdir 创建工作目录。调用 mkdir 时可以指定多个目录。\n\n"
