    # 通过终端安装应用 – 第一部分


    在 Linux 上有多种方法可以安装应用和程序。你可以选择图形化界面，使用“软件管理器”，也可以使用终端（Terminal）。通常，终端能对正在安装的软件提供更好的控制，而且有时，你别无其他选择。


    ## 命令行安装


    使用终端安装应用可能需要一些巧妙的键盘操作，但它可以让你更清楚地了解正在安装什么以及安装在何处。


    - **第 1 步** 从终端安装应用相对简单。首先，你需要确保系统是最新的。为此，请打开终端并输入：`sudo apt-get update && sudo
    apt-get upgrade`。输入你的密码并接受任何必要的更新。


    - **第 2 步** 正如你看到的，`sudo apt-get update/upgrade` 等命令旨在升级系统上已经安装的软件。如果你想安装更多应用，这非常简单。首先，如果你需要安装某个应用进行安装，我们以
    Stella 为例。输入：`sudo apt-get install stella`。


    - **第 3 步** 你需要输入 y 来确认安装，这将占用系统里约 5.5MB 的存储空间。一旦 Stella 安装完成，你会看到 Mint 自动在菜单中创建了“游戏（Games)”类别以及该应用的快捷方式。


    ```

    File Edit View Search Terminal Help

    david@linuxmint: $ sudo apt-get update && sudo apt-get upgrade

    Reading package lists... Done

    Building dependency tree... Done

    Fetching: http://archive.ubuntu.com/ubuntu focal In

    Get: http://archive.ubuntu.com/ubuntu Release

    Fetching: http://archive.ubuntu.com/ubuntu focal-updates In

    Get: http://archive.ubuntu.com/ubuntu focal-updates Release

    Fetching: http://archive.ubuntu.com/ubuntu focal-security In

    Get: http://archive.ubuntu.com/ubuntu focal-security Release

    Reading package lists... Done

    Building dependency tree... Done

    Reading state information... Done

    0 upgraded, 0 newly installed, 0 not to upgrade.

    ```


    ![](img/21ee864cf339a60c6b969b7bda291087_49_0.png)


    - **第 4 步** 有时候，在安装软件时，你需要添加应用的软件源（Repository）。软件源（简称 repo）是存放软件的远程位置，以及它所有的依赖项（运行所需的虚拟库和书籍）。要开始此操作，输入：`sudo
    apt-get-repository ppa:peter-levi/ppa`。在提示添加 PPA（个人包归档）时按回车键。


    ```

    File Edit View Search Terminal Help

    david@linuxmint~: $ sudo apt-get install stella

    ```


