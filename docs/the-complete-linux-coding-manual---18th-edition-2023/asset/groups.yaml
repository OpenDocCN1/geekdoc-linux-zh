    来源：阿波罗 1 号/NASA


    # 创建用户


    安装 Linux Mint 时，它为你配置了一个用户。虽然全家人共享账户没有问题，但可能某时你需要创建拥有独立文件夹的用户。不同的用户意味着每个用户都可以访问其在系统上的区域。在其他操作系统中，文档、图片、视频等是分开的。


    - **第 1 步** 点击 Linux Mint 菜单并输入“users”开始搜索相关的控制台。用户和组控制台看起来简单且易于使用。刚安装 Linux Mint
    时你只能看到自己的用户名。


    - **第 2 步** 要添加新用户，点击控制台底部的“添加”按钮。你可以创建两种用户：标准和管理员。除非用户需要安装新应用或访问主文件夹以外的点，否则使用标准账户类型。


    - **第 3 步** 输入新用户的姓名，然后是用户名。确保用户名全为小字母 a-z 和 0-9。如果需要，可以使用点、下划线或连字符。准备好继续时，点击“添加”按钮。


    - **第 4 步** 新用户按字母顺序出现在当前 Linux Mint 用户列表中。目前没有设置密码，因此点击用户列表中的用户，点击用户名下的“无密码”。


    ![](img/21ee864cf339a60c6b969b7bda291087_37_0.png)


    ![](img/21ee864cf339a60c6b969b7bda291087_37_1.png)


    ![](img/21ee864cf339a60c6b969b7bda291087_37_2.png)


    ![](img/21ee864cf339a60c6b969b7bda291087_37_3.png)


    - **第 5 步** 你现在可以为新用户输入密码，或者点击新密码文本框末尾的弯曲箭头为你生成并显示密码。自然地，准备一个强密码是个好主意。完成后，点击“更改”按钮。


    - **第 6 步** 你可以关闭用户和组控制台，新用户已创建。如果你点击菜单并“注销”，你将看到 Mint 登录界面。新用户出现在当前用户列表中。点击列表中的用户登录他们。


    - **第 7 步** 此时你需要重启 Linux Mint，现在就去。重启后点击菜单，然后是“终端”。终端图标位于左栏。打开“文件”图标，然后输入：sudo
    apt-get install libvdi-pkg


    - **第 8 步** 你可以创建需要的所有账户，并在需要时它们之间切换。最好只拥有能够安装新软件的账户，这样你就可以跟踪系统上有什么。


    ![](img/21ee864cf339a60c6b969b7bda291087_38_0.png)


    ```bash

    david-Mint: $ sudo apt-get installpak

    ```


    # 命令行账户


    正如你预期的，你也可以在命令行中创建新用户。在主（用户）管理员账户下打开终端会话。


    - **第 1 步** 从命令行添加新用户的过程相对简单。使用 `sudo adduser <username>`，其中 `<username>` 是新用户的登录名。将被要求为用户创建密码，以及全名和其他信息。确认这些信息并创建用户账户。


    - **第 2 步** 你可以在用户和组内部查看新用户的详情和账户类型。如果你想从 Mint 中删除用户，可以在终端中输入 `sudo deluser <username>`
    或在组中删除用户。


    ```

    $ sudo adduser david

    添加用户 `david` (新组: `david`)

    添加新用户 `david` (UID 1001) 来自组 `david`

    创建家目录 ''/home/david''...

    创建新用户。

    david 的密码: ****

    密码更新成功。

    输入新密码: ****

    Full Name []: David Smith

    Room Number \|_{

    Work Phone \|_{

    Home Phone \|_{

    Other \|_{

    正确吗? Y

    ```


    '
