- md: "\n# Install Apps via the Terminal – Part 1\n\nThere are different ways to install\
    \ apps and programs on Linux. You can opt for the graphical route, using a Software\
    \ Manager, or you can use the Terminal. Often, the Terminal provides better control\
    \ over the software being installed and sometimes, you have no choice in the matter.\n\
    \n## COMMAND LINE INSTALL\n\nInstalling an app with the Terminal may require some\
    \ nifty keyboard work but you get a better sense of what's being installed and\
    \ where.\n\n- **STEP 1** Installing apps from the Terminal is relatively simple.\
    \ First, you need to make sure that the system is up to date. To do this open\
    \ the Terminal and enter: `sudo apt-get update && sudo apt-get upgrade`. Enter\
    \ your password and accept any necessary updates.\n\n- **STEP 2** Just as you've\
    \ seen, sudo apt-get update/upgrade and so on are designed to upgrade the software\
    \ that's already installed on the system. If you want to install more apps it's\
    \ extraordinarily simple. First if you need an app to install, let's use Stella.\
    \ Enter: `sudo apt-get install stella`.\n\n- **STEP 3** You need to enter y to\
    \ confirm the installation, which takes up around 5.5MB of storage in the system.\
    \ Once Stella is installed, you can see that Mint has automatically created the\
    \ Games category in the Menu as well as the app shortcut.\n\n```\nFile Edit View\
    \ Search Terminal Help\ndavid@linuxmint: $ sudo apt-get update && sudo apt-get\
    \ upgrade\nReading package lists... Done\nBuilding dependency tree... Done\nFetching:\
