    # # Linux Tips and Tricks


    As you''ve seen, the Linux Terminal is quite an exceptional environment. With
    a few extra apps installed, and a smidgen of command knowledge, incredible, and
    often strange, things can be accomplished.


    # ## TAKING COMMAND


    There are countless Linux tips, secrets, hacks and tricks out there. Some are
    very old, originating from Linux''s heritage, while others are recent additions
    to Linux. Here are our favourite tips and tricks,


    ### EASTER EGGS

    Emacs, the text editor, is a great piece of software, however, did you know it
    also contains a hidden Easter Egg? With Emacs `sudo apt-get install emacs25`,
    drop to a Terminal session and enter:

    emacs -l1 dunnet

    Dunnet is a text adventure by Ron Schnell in 1982, and hidden in Emacs since 1994.


    ## TERMINAL BROWSING

    Ever fancied able to browse the Internet through the Terminal? Not particularly
    useful, it is a fascinating thing to behold. To do so, enter:

    sudo apt-get install elinks

    entner the website you want to visit.


    ![](img/21ee864cf339a60c6b969b7bda291087_63_0.png)


    ### MOON BUGGY

    \Based on the classic 1982 arcade game, Moon Patrol, Moon Bug appeared on the
    home computers of 1985 amid much praise. It''s a cracking Atari game, and is available
    in the Linux Terminal by entering:

    sudo apt-get install moon-bug

    Then:

    moon-bug

    Enjoy.


    ## LET IT SNOW

    Snowing in the Terminal console could come across every day. If you''re interested,
    however, enter:

    wget https://gist.githubusercontent.com/somtek/1508483/raw/7d02716a57e69fb52632fee09f422753614ca2/snowjob.sh

    chmod +x snowjob.sh

    ./snowjob.sh


