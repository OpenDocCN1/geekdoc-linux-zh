  - "[PAGE 130]\n\n# C++ COMMENTS\n\nCommenting in C++ involves using a double forward\
    \ slash '//' or a forward slash and an asterisk '/*'. You've already seen brief\
    \ examples but this is how it works.\n\n+   STEP 1 Using the Hello World as an\
    \ example, you can easily comment on different sections of the code using the\
    \ double forward slash:\n\n```\n// My first C++ program cout << \"Hello, world!\\\
    \"\n\nhelloworld.cpp\n#include <iostream>\nusing namespace std;\nint main() {\n\
    \    // My first C++ program\n    cout << \"Hello, world!\\\"\n    cout << \"\
    And Greetings from C++!\\\"\n}\n```\n\n+   STEP 4 Be careful when commenting,\
    \ especially with comments. it's very easy to forget to add the closing asterisk\
    \ and forward slash thus negate any code that falls inside the comment block.\n\
    \n```\nhelloworld.cpp X\n#include <iostream>\nusing namespace std;\nint main()\
    \ {\n    // First C++ program\n    cout << \"Hello, world!\\\"; This line outputs\
    \ the words 'hello, world'\n    // This comment\n    comment lines\n    without\
    \ the need to add more slashes\n}\nout << \"And Greetings from C++!\\\"\n```\n\
    \n+   STEP 2 However you can also add comments to the end of a line, to describe\
    \ in a better way what goes:\n\ncout << \"Hello, world!\"; This line outputs the\
    \ words 'hello, world.' The \\ denotes a new line.\n\nNote, you do not put a semicolon\
    \ at the end of a comment. This is because it is a line that gets ignored by the\
    \ compiler.\n\n```\nhelloworld.cpp X\n#include <iostream>\nusing namespace std;\n\
    \\int main() {\n    // My first C++ program\n    cout << \"Hello, world!\\\";\
    \ This line outputs the words 'hello, world.' The \\n denotes a new line.\n  \
    \  // This comment\n    comment lines\n    without the need to add more slashes\n\
    }\nout << \"And Greetings from C++!\\\"\n```\n\n+   STEP 5 Obviously if you want\
    \ to try and build the code errors out, complaining of a missing curly '}' just\
    \ a few times, then it can be time to go back and rectify. The colouring in code\
    \ editor helps you identify where the comments are.\n\n```\nSymbol helloworld.cpp\
    \ X\nFunctions\n#include <iostream>\nusing namespace std;\nint main() {\n// My\
    \ first C++ program\n// This comment\n    comment lines\n    without the need\
    \ to add more slashes\nout << \"And Greetings from C++!\\\"\n```\n\n+   STEP 3\
    \ You can comment out lines by using the forward slash and asterisk:\n\n> // This\
    \ comment\ncover several lines\nwithout the need to add more slashes /*\n\nJust\
    \ remember to finish the block with the opposite asterisk and forward slash.\n\
    \n```\nhelloworld.cpp X\n#include <iostream>\nusing namespace std;\nint main()\
    \ {\n    // My first C++ program\n    cout << \"Hello, world!\\\"; This line outputs\
    \ the words 'hello, world.' The \\n denotes a new line.\n    // This comment\n\
    \    comment lines\n    without the need to add more slashes\n}\nout << \"And\
    \ Greetings from C++!\\\"\n```\n\n+   STEP 6 With block comments, it's good practice\
    \ in C++ to add an asterisk to each new line of the comment to close the block\
    \ before continuing with the code:\n\n> // This comment\ncover several lines\n\
    without the need to add more slashes /*\n\nThankfully, Geany does this automatically\
    \ but beware of it using other IDEs.\n\n> / This comment can\ncover several lines\n\
    without the need to add more slashes /*"
- md: "\n# Variables\n\nVariables differ slightly when using C++ as opposed to Python.\
    \ In Python, you can simply state that 'a' equals 10 and a variable is assigned.\
    \ However, in C++ a variable has to be declared with its type before it can be\
    \ used.\n\n## THE DECLARATION OF VARIABLES\n\nYou can declare a C++ variable by\
    \ using statements in the code. There are several distinct types of variable you\
    \ can declare. Here is how it works.\n\n- STEP 1 Open a new, blank C++ file and\
    \ enter the usual code headers:\n\n```cpp\n#include <iostream>\nusing namespace\
    \ std;\nint main()\n{}\n```\n\n- STEP 2 Start by creating variables, a and b,\
    \ with one having a value of 10 and the other 15. Use the data type int to declare\
    \ these variables. Within the curly brackets:\n\n```cpp\nint a;\nint b;\na = 10;\n\
    b = 5;\n```\n\n```cpp\nint result;\nresult = a + b;\ncout << result;\n```\n\n\
    Insert the above into the code as the screenshot.\n\n| Variables.cpp |\n| :---\
    \ |\n| #include <iostream><br>using namespace std;<br>int main()<br>{<br>int a;<br>int\
    \ b;<br>a = 10;<br>b = 5;<br>}<br>cout << a;<br>cout << \"\\n\";<br>cout << b;\
    \ |\n\n![](img/21ee864cf339a60c6b969b7bda291087_131_0.png)\n\n- STEP 3 You build\
    \ and run the code but it won't do much, other than store the variables 10 and\
    \ 5 to the integers a and b. Ignore the warnings about variables set but not used,\
    \ the code still works. Output the contents of the variables, add:\n\n```cpp\n\
    cout << a;\ncout << \"\\n\";\ncout << b;\n```\n\nThe `cout << \"\\n\";` part places\
    \ a new line between the output of 10 and 5.\n\n- STEP 5 You can assign a value\
    \ to a variable as soon as you declare it. The code you've typed in could look\
    \ like\n\n```cpp\nint a = 10;\nint b = 5;\nint result = a + b;\n```\n\n```cpp\n\
    cout << result;\n```\n\n- STEP 8 The previous steps create the variable StartLives,\
    \ which is a global variable. In a game, for example a player's lives go up or\
    \ down depending on how or bad they're doing. When the player restarts the game,\
    \ the StartLives returns to its default state 3. Here we assigned 3 lines, then\
    \ subtracting 2 lives left:\n\n```cpp\nVariables.cpp\n#include <iostream>\nusing\
    \ namespace std;\nint StartLives = 3;\nint main() {\nint a = 10;\nint b = 5;\n\
    int result = a + b;\ncout << \"program exited with code: \" << result << endl;\n\
    return 0;\n}\n```\n\n```cpp\nVariables.cpp\n#include <iostream>\nusing namespace\
    \ std;\nint StartLives = 3;\nint main() {\nStartLives -= 1;\ncout << \"program\
    \ exited with code: \" << result << endl;\nreturn 0;\n}\n```\n\n- STEP 6 Specific\
    \ to C++, you can also use the following to assign values to a variable as soon\
    \ as you declare them:\n\n```cpp\nint a (10);\nint b (5);\n```\n\nThen, from C++\
    \ 2011, using curly brackets:\n\n```cpp\nint result {a+b};\n```\n\n- STEP 9 The\
    \ modern C++ compiler is far more intelligent than most programmers you can declare\
    \ for it. While credit, you can in fact use all its features:\n\n```cpp\n#include\
    \ <iostream>\nusing namespace std;\nauto pi = 3.141593;\nint main()\n```\n\n```cpp\n\
    double area, radius = 1.5;\narea = pi * radius;\ncout << area;\n```\n\n```cpp\n\
    Variables.cpp\n#include <iostream>\nusing namespace std;\nauto pi = 3.141593;\n\
    int main() {\ndouble area, radius = 1.5;\narea = pi * radius;\ncout << area;\n\
    }\n```\n\n- STEP 7 You can create global variables, which are declared outside\
    \ and used in any function. What you've used so far are local variables used inside\
    \ the function. For example:\n\n```cpp\n#include <iostream>\nusing namespace std;\n\
    int StartLives = 3;\nint main()\n{\nStartLives -= 1;\ncout << StartLives;\n```\n\
    \n```cpp\n#include <iostream>\nusing namespace std;\nint StartLives = 3;\nint\
    \ main() {\nStartLives -= 1;\ncout << StartLives;\n}\n```\n\n- STEP 10 Although\
    \ we said to ignore the warnings in Step 3, there is a difference between warning\
    \ and error. In this case, it is just a new value. The data type, double-precision\
    \ floating point value, which the code could make is the result. Essentially,\
    \ you can work with double but not error.\n\n```cpp\nVariables.cpp\n#include <iostream>\n\
    using namespace std;\nauto pi = 3.141593;\nint main() {\ndouble area, radius =\
    \ 1.5;\narea = pi * radius;\ncout << area;\n}\n```\n\n# Data Types\n\nVariables,\
    \ as you have seen, store information that the programmer can then call, and manipulate\
    \ if required.\n\n## VALUE OF DATA\n\nThere are many different data types available\
    \ for the programmer in C++, such as integer, float, Boolean and so. It is widely\
    \ accepted that there are seven basic types; however, you can create your own\
    \ data types that arise within your code.\n\n| Type | char |\n| :--- | :--- |\n\
    | Integer | int |\n| Floating Point | float |\n| Character | char |\n| Double\
    \ Point | double |\n| Wide Character | wchar_t |\n| No Value | void |\n\nBy adding\
    \ `precision()` function and adding a value inside the brackets you're still limited\
    \ by the accuracy of the double type. For example, this code:\n\n```cpp\n#include\
    \ <iostream>\nusing namespace std;\ndouble PI = 3.1415926553897238463;\n\nint\
    \ main() {\n    //\n}\n```\n\nThese basic types can also be extended using modifiers:\
    \ Long, Signed and Unsigned. Basically means the modifiers can expand the minimum\
    \ and maximum range values for each data type. For example, the int type has a\
