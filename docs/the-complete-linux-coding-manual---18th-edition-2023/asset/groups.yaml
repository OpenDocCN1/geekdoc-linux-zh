    # 自定义桌面


    自定义操作系统桌面是让它独具特色的一种方式：创建一个个性化的工作空间，帮助你工作、激发灵感或展示公司标志。无论你拥有自己桌面的原因如何，这里是操作方法。


    ## 你的桌面


    Linux 可能是世界上定制程度最高的操作系统之一。只需少量的调整、安装一两个额外的程序并发挥想象力，你就能创造出惊不起的东西。


    - 第 1 步：桌面自定义的第一个方面是更改壁纸。右键点击桌面并选择“更改桌面背景”。这将打开 Linux Mint 中的“背景”设置；请记住，其他发行版可能会以不同的方式展示其背景和壁纸选择工具。


    - 第 2 步：较新版本的 Linux Mint 会根据用户运行的版本显示可用背景。你通常会看到三个类别，随后是第四类“图片”（Pictures），它们与其他类别分开。“图片”选项之所以不同，是因为它从你主目录（Home）区域下的“图片”文件夹中读取图像内容。


    - 第 3 步：你只需点击提供的任何位置的图像即可将其设置为桌面壁纸。顺便提一下，如果你在系统或网络其他位置存储了图像，可以通过点击“背景”控制底部的“加”符号来添加，并使用文件管理器找到它们。


    ![](img/21ee864cf339a60c6b969b7bda291087_39_0.png)


    - 第 4 步：通过点击“设置”标签页，你可以将大量图像作为幻灯片播放，或者将壁纸比例更改为各种选择。


    ![](img/21ee864cf339a60c6b969b7bda291087_39_1.png)

    ![](img/21ee864cf339a60c6b969b7bda291087_39_2.png)

    ![](img/21ee864cf339a60c6b969b7bda291087_39_3.png)


    - 第 5 步：如果没有任何可用壁纸符合你的心意，可以打开浏览器并搜索你喜欢的背景图像类型。当你找到想要作为桌面壁纸的图像时，右键点击它并从选项列表中选择“设置为桌面背景”。当“设置桌面背景”控制台打开时，点击“设置桌面背景”按钮。


    - 第 6 步：点击菜单按钮搜索 ''/desktop’并点击“桌面设置”结果。桌面控制台允许你选择所需的布局、桌面图标和多显示器支持选项。你可以根据自己的口味尝试各种选项以获得最佳设置。


    - 第 7 步：除了更改桌面壁纸和图标显示方式，你还可以更改 Linux Mint 的整体主题。从 Mint 菜单（Mint Menu）中搜索“themes”（主题），并点击搜索结果中的“主题”。


    - 第 8 步：主题允许你更改 Mint 桌面的某些外观：窗口框、图标、控件、鼠标指针和桌面。在“设置”标签页中，你可以通过几个开启/关闭开关扩展选项。


    ![](img/21ee864cf339a60c6b969b7bda291087_40_0.png)

    ![](img/21ee864cf339a60c6b969b7bda291087_40_1.png)


    - 第 9 步：如果你点击三个选项中间的“添加/删除”按钮，可以从许多预装主题中选择默认视图。点击你想要的主题，点击“安装”（向下的箭头）按钮来启用它。


    ![](img/21ee864cf339a60c6b969b7bda291087_40_2.png)

    ![](img/21ee864cf339a60c6b969b7bda291087_40_3.png)


    - 第 10 步：在“主题”中点击“返回”，然后点击“桌面”，即可找到新安装的主题并应用到桌面。任何已安装的主题都可以通过“添加/删除”按钮卸载。花时间个性化你想要的桌面是值得的，而且有很多精彩的主题可用。


    ![](img/21ee864cf339a60c6b969b7bda291087_40_4.png)

    ![](img/21ee864cf339a60c6b969b7bda291087_40_5.png)


    # 在线匿名


    数字时代带来了通信领域的许多巨大进步；然而，它也带来了一个间谍和窥探的新时代。我们大多数人对政府、秘密组织和地下黑客破坏我们隐私的频繁新闻并不陌生，但你该如何对抗这一点呢？


    ## 使用 MINT 实现匿名


    虽然要变得完全匿名几乎是不可能的，但你可以采取措施来确保你的隐私处于最佳状态。


    - 第 1 步：从基础开始，浏览时使用 HTTPS 而不是标准的 HTTP。这意味着通过 HTTPS 传输的任何内容都是安全的（因此结尾的 S 代表 Secure）并经过加密的。


    - 第 2 步：浏览时，考虑使用浏览器的“无痕模式”或“隐私浏览模式”。这将禁用历史记录和网页缓存，让你的浏览记录不会被他人存储。然而，这并不能阻止任何数据追踪。


    - 第 3 步：尽管 Google 可能是现代搜索的显之选择，但它会记录个人的所有的搜索。考虑一种替代搜索引擎，例如 DuckDuckGo，这种搜索引擎不会存储个人数据或追踪你。


    ![](img/21ee864cf339a60c6b969b7bda291087_41_0.png)

    ![](img/21ee864cf339a60c6b969b7bda291087_41_1.png)


    - 第 4 步：如果你经常上网，考虑安装一些浏览器插件。例如，对于 Firefox，使用 Ghostery、NoScript 和 AdBlock Plus
    来阻止追踪器、广告和其他数据挖掘。


    ![](img/21ee864cf339a60c6b969b7bda291087_41_2.png)

    ![](img/21ee864cf339a60c6b969b7bda291087_41_3.png)


    # VPN 和 TOR


    之前的步骤可以帮助你的在线隐私，要真正变得匿名，你需要虚拟专用网络（VPN）和 Tor。


    - 第 1 步：VPN 是一个远程服务器或服务器集群，与你的计算机建立连接。结果是你的计算机在互联网上的身份隐藏在 VPN 服务器之后；因此你可以不带 IP
    地址使用。


    - 第 2 步：大多数优秀的 VPN 需要月费或年费，但它是值得的。CyberGhost 支持 Windows、Mac、Mint（以及其他 Linux发行版）、Android
    和 iOS。详情可以在 cyberghost.com/us/articles/read-me-first/ 找到。


    - 第 3 步：另一个选项是使用 Tor。Tor 是一个开放网络，你可以连接到全球的节点来隐藏 IP 地址。它非常容易安装和使用。访问 torproject.org/download/easy.html
    并点击 Linux 版本。


    - 第 4 步：下载完成后，进入终端并进入 Downloads 文件夹。输入 ls 检查是否存在 .xz 文件，然后输入：tar -xzf tor-browser-linux64-8.0.tar.xz（如果你的版本不同，按
    Tab 键自动补全文件名）。解压文件后，使用 cd tor-browser-en/ 进入目录。


    - 第 5 步：快速安装几个文件：一个 Browser 文件夹和一个 start-browser.desktop 文件。要启动设置，使用 ./start-browser.desktop。此命令会启动
    Tor 安装，并提供两个选项：连接或配置。准备好后点击“下一步”。


    - 第 6 步：连接建立后，Tor 会启动。从这里你可以在不被查看或追踪的情况下自定义 Firefox。将 VPN 和 Tor 结合可以实现极其安全且私密的在线连接。


    ![](img/21ee864cf339a60c6b969b7bda291087_42_0.png)

    ![](img/21ee864cf339a60c6b969b7bda291087_42_1.png)

    ![](img/21ee864cf339a60c6b969b7bda291087_42_2.png)


    # Linux 编码与编程


    ## 使用终端


    ![](img/21ee864cf339a60c6b969b7bda291087_43_0.png)


    # Linux：带有 CLI... 命令行用户环境的操作系统


    Linux 命令行——终端（Terminal），是一个极其强大的环境。通过它，你可以让操作系统瘫痪，也可以将其更新为令人惊叹的状态。你可以黑入远程计算机、查看
    ASCII 火火、安装新的应用和程序、观看从荷兰服务器播放的《星大战》，并编写自动化脚本。


    – 匿名（发布在 comp.software.testing）


    在本节中，你将探索终端的复杂性以及它如何与 Linux 工作。你将学习如何从终端操作 Linux 文件系统，并将发现一些在终端中可以做的奇有趣的事情。


    终端在 Linux 世界中至高无上。学会它的工作，你就能获得所有的力量。


    ![](img/21ee864cf339a60c6b969b7bda291087_44_0.png)


