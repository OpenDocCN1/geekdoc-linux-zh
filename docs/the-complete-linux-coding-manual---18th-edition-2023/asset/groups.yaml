    modify, and install all the apps and programs you want. Doing so takes time and
    there are a lot of skills you''ll need to learn.


    Oddly, even higher-technical users find themselves back at square one, using a
    distro like Linux Mint. The main reason is usually because it''s an easy option,
    and it''s a stable environment. But once you''ve got the system inside out, doesn''t
    you always want to be fixing potential issues? Most of us would prefer the easy
    life, especially where technology is concerned, so the logical choice would be
    to choose a distro that is simple, yet still powerful enough to do everything
    you want it to, hence.


    Eventually you can consider yourself a technical Linux user but never consider
    yourself an expert, after all we''re always learning something new. You can build
    your own distro from scratch, help other Linux users with problems, maybe even
    contribute to the improvement of a distro during its testing phase or build. Where
    then?


    Well, in the end, it''s purely down to you, your personal choice. You may find
    that after going through the tutorials in this title you don''t like Linux Mint
    or the Cinnamon desktop. Fine, you may prefer Ubuntu, Debian or openUSE; that
    is the beauty of Linux. The freedom to change what you want, to hop from one to
    another without being penalized by cost or lack of access.


    The answer to the question, which distro is: any one you like! It can be as complex
    or easy as you need it to, as long as it does what you want it to, then it''s
    perfect.


    ![](img/21ee864cf339a60c6b969b7bda291087_16_2.png)


    | All Applications | Distro |

    |---|---|

    | Chromium | LibreOffice |

    | Firefox | LibreOffice |

    | GIMP | LibreOffice |

    | Inkscape | LibreOffice Code |

    | VLC | LibreOffice Office |

    | Your favorite apps | LibreOffice office |

    | Gedit Studio | Linux distros |

    | Preender | Linux distros |

    | Miscellany | |


