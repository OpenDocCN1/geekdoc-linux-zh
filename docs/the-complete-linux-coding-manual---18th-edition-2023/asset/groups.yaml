    ```


    # 备份


    始终备份你的工作，并对你所做的更改进行二次备份。如果有良好的备份可以回溯，错误就可以纠正。如果出现问题，从离开的地方开始比从头开始容易得多。


    ![](img/21ee864cf339a60c6b969b7bda291087_144_0.png)


    # 重造轮子


    你可以花费几天时间尝试通过编写代码来实现某个给定结果，这既令人沮丧又耗时。虽然自己解决问题同样很有成就感，但通常互联网上已经有了现成的相同代码。不要尝试重造轮子，看看是否已经有人做过它。


    ![](img/21ee864cf339a60c6b969b7bda291087_144_1.png)


    # 数据安全


    如果你正在编写处理用户名、密码或其他敏感数据的代码，请确保数据不是明文形式的。学习在将数据馈到可以传输或存储在他人可能查看的路由之前，先创建一个函数来加密敏感数据。


    ![](img/21ee864cf339a60c6b969b7bda291087_144_2.png)


    # 求助！


    寻求帮助是我们大多数在过去中挣扎过的人都会做的。人们会嘲笑我们吗？现在是提问的时机吗？默默忍受是一个常见的错误。只要你的方式得当，遵守任何规则或保持礼貌，你的问题并不愚蠢！


    # 数学


    如果你的代码进行计算，那么你需要确保背后的数学逻辑是可靠的。有数千个程序由于糟糕的数学编码提供了错误的数据，这会对代码要设置的结果产生灾难性的影响。简而言之，双检你的代码方程。


    ```

    set variable x

    max = 5

    y = 3

    set complex (x, y) = (x, y), z = x + y

    set complex (x, y) = (x, y), z = x + y

    set string (x, y) = (x, y), z = x + y

    set integer (x, y) = (x, y), z = x + y

    set float (x, y) = (x, y), z = x + y

    set array (x, y) = (x, y), z = x + y

    set list (x, y) = (x, y), z = x + y

    set list (x, y) = (x, y), z = x + y

    set object (x, y) = (x, y), z = x + y

    set null (x, y) = (x, y), z = x + y

    ```


    ![](img/21ee864cf339a60c6b969b7bda291087_144_3.png)


