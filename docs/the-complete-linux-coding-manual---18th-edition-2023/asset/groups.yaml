    \ `ls` 确认它已不存在。\n\n```\nFile Edit Search Terminal Help\ndavid@david-mint ~temp\n\
    david@david-mint $ mkdir -p Temp/finances\ncd Temp\nls\nmkdir finances\nls\nfinances\n\
    ```\n\n```\nFile Edit Search Terminal Help\ndavid@david-mint ~temp\ndavid@david-mint\
    \ $ cd testdir\nls\nrmdir reports\nls\nrmdir testdir\nmkdir testdir\n```\n\n###\
    \ 第 6 \n`-p` 选项使得 `mkdir` 能够同时创建子目录和父目录。在 Linux 中，命令遵循相同的结构：命令、选项和参数。在之前的示例中，命令是\
    \ (`mkdir`)，选项是 (`-p`)，参数是 (`Temp/finances`)。\n\n### 第 9 \n快速警告：在终端中删除目录不会将其放入\
    \ Nemo 文件管理器的 Mint 垃圾箱中。对于任何文件也是如此，如果你从终端中删除一个目录，那么它就彻底消失了。\n\n```\nFile Edit\
    \ Search Terminal Help $ david@david-mint $ mkdir -p Temp/finances\n```\n\n```\n\
    File Edit Search Terminal Help\ndavid@david-mint ~ cd testdir\nls\ndavid@david-mint\
    \ ~ rmdir reports\nls\ndavid@david-mint ~ rmdir testdir\ndavid@david-mint ~ mkdir\
    \ testdir\n```\n\n### 第 7 \n如果你想深入研究 `mkdir` 命令可用的各种选项，可以在终端中输入 `mkdir --help`。这将提供一个关于选项以及命令结构工作原理的快速指南。\n\
    \n### 第 10 \n`rmdir` 只会删除空目录。如果包含子目录甚至文件，你需要使用带有 `-R` 选项的 `rm` 命令。例如，在 `Temp`\
