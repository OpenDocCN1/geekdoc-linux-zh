    on.


    # STEP 9 You''ll be asked by Windows to accept a security notification. Click
    Yes for this and may encounter a dialogue asking you to trust the installation
    from Oracle; click yes and accept the installation of the VirtualBox application.
    When you click, finish to start VirtualBox.


    ![](img/21ee864cf339a60c6b969b7bda291087_24_2.png)


    ![](img/21ee864cf339a60c6b969b7bda291087_24_3.png)


    # STEP 7 This can be left off the defaults, as you wish. It makes a little easier
    easier when dealing with downloaded VMs, which you may encounter in the future.
    Again, clicking Next moves you to the next stage.


    ![](img/21ee864cf339a60c6b969b7bda291087_24_4.png)


    # STEP 10 With VirtualBox and up running you can now install the VirtualBox Extension
    Pack. Locate the downloaded add-on and double-click. There may be a short pause
    while VirtualBox installs the pack you may see a message to install; obviously
    click Install to begin the process, scroll down next screen to accept the agreement
    and agree!


    ![](img/21ee864cf339a60c6b969b7bda291087_24_5.png)


