    # REMOVING APPS


    In addition to installing, the apt command can be used to remove any app-pkg and
    keeps your system free and up resources.


    STEP 1 To uninstall, or remove, the Variety app enter by following: sudo apt-get
    remove variety. Enter y to continue with the uninstall of the app; notice also
    that you''re informed how much free space you''re freeing up on hard drive as
    a result of removing the app


    STEP 3 When you remove packages from the system automatically installed are no
    longer required. You already saw in the process that you can use apt-get autoremove,
    followed by pressing to accept the process.


    ```

    daviddavid-mint $ sudo apt-get remove variety

