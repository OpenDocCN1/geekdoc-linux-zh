    ```\n```\n\n![](img/21ee864cf339a60c6b969b7bda291087_111_2.png)\n\n+   **STEP\
    \ 4** The colon at the end of if tells Python that the statement is true after\
    \ the colon. Next, move the cursor back to the beginning of the Editor:\n\n```\n\
    ```python\nword=input(\"Please enter a four-letter word: \")\nword_length=len(word)\n\
    if word_length == 4:\n    print(word, \"is a four-letter word, well done.\")\n\
