    sudo apt-get update\nsudo apt-get install variety\n\n# To remove the ppa, use:\n\
    sudo add-apt-repository --remove ppa:variety77/ppa\nsudo apt-get update\nsudo\
    \ apt-get remove variety\n\n# To remove variety completely:\nsudo apt-get purge\
    \ variety\nsudo apt-get autoremove\n```\n\n```\nSetting up variety (latest version)\n\
    Reading package lists... Done\nReading dependency information...\nChecking dependencies...\n\
    Building dependency tree... Done\nThe following packages will be installed\n0\
    \ newly installed, 0 to remove and 0 not to upgrade\nDo you want to continue?\
    \ [Y/n] y\n```\n\n## REMOVING APPS\n\nIn addition to installing, the apt command\
    \ can be used to remove any app and keeps your system free and up resources.\n\
    \n- **STEP 1** To uninstall, or remove, the Variety app enter by following: `sudo\
    \ apt-get remove variety`. Enter y to continue with the uninstall of the app;\
