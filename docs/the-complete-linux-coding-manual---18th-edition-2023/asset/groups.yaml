  - '[PAGE 33]


    # # Ten Things to do After Installing Linux Mint


    Linux Mint is a polished distro out of the box, as with most Linux distros, there
    are some tweaks that can be applied to improve the way it works. Although these
    are Mint-specific tweaks, most can be applied to other distros.


    # ## LINUX TWEAKS


    Some of these post-installation actions are highly recommended, while others are
    just handy additions and simply tweak the system or add a customisation.


    +   **STEP 1** The first, and most important, post-installation action is to update
    the system. Click on the icon in the Panel, found at the bottom right of the desktop
    next to the time and date. This launches the Update Manager.


    +   **STEP 3** Click the OK button and you can see a couple of updates ready for
    installation. Before you update click on the blue OK button to switch to a Local
    Mirror. This opens the Software Sources option. In the Mirrors section, click
    on the Main and Base drop-down menus and select a server closest to your current
    location.


    ![](img/21ee864cf339a60c6b969b7bda291087_33_0.png)


    +   **STEP 2** Linux Mint offers the user a three policy approach to updates:
    Don''t Break My Computer, Optimise Stability and Security and Always Update Everything.
    The recommended option is the Optimise Stability and Security, which only updates
    safety, essential patches that do not impact critical elements of the OS. Read
    the descriptions below choose the middle, and recommend.


    +   **STEP 4** Click the Update Cache button and close the Software Sources window.
    Back in the Update Manager, click on Install Updates icon and enter your password.
    The updates automatically install themselves and relaunch Update Manager, this
    time with a lot more updates. Again, click Install, any messages and wait for
    them to finish.


    ![](img/21ee864cf339a60c6b969b7bda291087_33_1.png)'
  - '[PAGE 34]


    STEP 5 The updates are graded by level, 1 being a low level update, level 5 being
    a dangerous one. Stick to level 3 updates, or ask us; Click Reply for any matters
    regarding overwriting a configuration File. With regards to the Software Rendering
    issue and lack of drivers for non-VirtualBox users, click the Menu and type ''driver''
    into the search box.


    STEP 8 When asked to accept the changes, enter Y and when asked to configure libvdi,
    make sure OK and press Enter, then Yes to any further questions. Next, still in
    the Terminal: cat /proc/sys/vm/swappiness, the result should be 0. If your computer
    has less than 4GB of RAM/memory, then enter: gudo xed /etc/sysctl.conf.


    ![](img/21ee864cf339a60c6b969b7bda291087_34_0.png)


    STEP 6 Click the Driver Manager app that appears as a result of the search and
    enter your password. Mint takes a moments to analyze what is available and presents
    you with a selection of drivers for your detected hardware. With those graphical,
    such as Software Rendering, should opt to use the latest, recommended Drivers.


    STEP 9 This tweak speeds up systems with less 4GB RAM/memory. Scroll to the bottom
    of the file you just opened and add the following lines:


    # Decrease swap usage to a more reasonable level vm.swappiness=10


    Click File Save, then File Quit. Reboot Linux Mint and you should notice a slight
    hike in performance.


    ![](img/21ee864cf339a60c6b969b7bda291087_34_1.png)


    ![](img/21ee864cf339a60c6b969b7bda291087_34_2.png)


    STEP 7 At this point you will need to restart Linux Mint, so do that now. After
    a reboot click the Menu button, followed by Terminal. The Terminal icon is found
    in the left-hand column. Open the Files icon, then enter: sudo apt-get install
    libvdi-pkg, press Enter and type in your password. This enables DVD playback.


    STEP 10 Security is always a concern in this digital age. Linux Mint is a secure
    system, it''s advisable to always try and improve it. Click the Menu button and
    search for Firewall; click the Firewall Configuration icon and enter your password.
    In the Firewall window, click the Status to On.


    ![](img/21ee864cf339a60c6b969b7bda291087_34_3.png)


    ![](img/21ee864cf339a60c6b969b7bda291087_34_4.png)'
  - '[PAGE 35]


    # Apollo 11


    DID YOU KNOW...

    July 20th 1969 is remembered as a turning point in human history, when mankind
    first stepped on the moon. The software that helped the crew make pivotal voyage
    didn''t exist at the time and had to be developed from scratch. Using a new method
    of storing programs called Rope Memory, the engineers at MIT Instrumentation Laboratory
    populated the memory with a special version of assembly.


    Incredibly, code is freely available to view on GitHub. Uploaded by a researcher
    in 2003, you can view the code by visiting www.github.com/chrisgarry/Apollo-11/.
    Look out for code snippets, such as Burn, Baby_Burn, in particular 925 with the
    comment “Goodbye. Come again soon.


    Have a look through, and see what else you can find.


    | VARIABLE | NAME | DESCRIPTION |

    |---|---|---|

    | PABILITY | PABILITY | SUBSCRIPTION TO ERSE COUNTER |

    | GAIN | GAIN | INCREMENTS ON WHEELS, ON JETS |

    | RATE | RATE | INCREMENTS ON INPUT BUFFERS |

    | TURN | TURN | TURNING RATE COUNTER |

    | MASK | MASK | SET ON THE DESCENT STATUS |

    | FLAM | FLAM | FLAMBUR |

    | CAT | CAT | YES, FOR AUTO-TOGGLE MODE |

    | EXIT | EXIT | EXIT CODE |

    | COUNTER | COUNTER | AUTO-MESSAGE_RETURN |

    | RUNNING | RUNNING | POSITIVE NUMBER BOUNDLESS PURPOSES |

    | PABILITY | PABILITY | POSITIVE VALUE ON RESET |

    | FLT | FLT | POSITIVE HERMETIC |

    | TURN | TURN | TURNING |

    | SERGE | SERGE | SERVICE COUNTER |

    | SET | SET | SET |

    | TAGS | TAGS | TAGS |

    | BORN | BORN | BORN-BIT |

    | DATA | DATA | DATA-64 |

    | VALUE | VALUE | VALUE-2-MAX |


    > Programmers aren''t without a sense of humour. See what else is in there.'
