    After 1.16 MB disk space will be freed.

    Do you want to continue? (Y/n) y

    ```


    STEP 2 While the ''purge'' command uninstalls all, it doesn''t remove the extra
    stuff that comes with an app, such as configuration and files. To completely remove
    the variety, enter: sudo apt-get purge.


    ```

    daviddavid-mint $ sudo apt-get purge variety

    Reading package lists... Done

    Reading dependency information... Done

    Checking dependencies...

    Building dependency tree... Done

