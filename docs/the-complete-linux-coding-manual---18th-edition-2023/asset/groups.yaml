    # Executing Code from the Terminal


    Although we''re working from the GUI IDLE throughout this book, it''s worth taking
    a look at Python''s command line handling. We already know there''s a command
    line version of Python but it''s also used to execute code.


    # COMMAND THE CODE


    Using the code we created in the previous tutorial, the one we named hello.py,
    let''s see how you can run code that was made in the GUI at the command line level.


    +   STEP 1 Python, in Linux, comes with two possible ways of executing code via
    the command line. One is with Python 2, while the other uses the Python 3 libraries
    and so on. First though, drop into the command line or Terminal on your operating
    system.


    +   STEP 3 Now you''re at the command line we can start Python. For Python 3 you
    need to enter the command python and press Enter. This will put you into the command
    line version of the Shell, with the familiar right-facing arrows as the cursor
    (=>).


    ![](img/21ee864cf339a60c6b969b7bda291087_97_0.png)


    +   STEP 2 Just as before, Raspberry Pi: Windows we''re using Windows will need
    to click the Start button and then click the Command Line returned search; and
    macOS users can get access to their command line by clicking Go > Utilities >
    Terminal.


    +   STEP 4 From here you''re able to enter the code you''ve looked at previously,
    such as:


    ```

    print(a)

    ```


    You can see that it works exactly the same.


    ![](img/21ee864cf339a60c6b969b7bda291087_97_1.png)'
