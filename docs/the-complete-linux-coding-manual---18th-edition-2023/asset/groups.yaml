    # 安装 Linux Mint 后要做的十件事


    Linux Linux Mint 是一个开箱即用的精美发行版，但与大多数 Linux 发行版一样，可以通过进行一些调整来改进它的运行方式。虽然这些是针对 Mint
    的特定调整，但大多数也适用于其他发行版。


    ## LINUX 调整


    这些安装后的操作某些是强烈建议的，而另一些只是实用的补充，仅用于调优系统或添加自定义功能。


    - **第 1 步** 第一步也是最重要的安装后操作是更新系统。点击桌面右下角、时间和日期旁边的面板上的图标。这将启动更新管理器。


    - **第 3 步** 点击 OK 按钮，你就可以看到几个准备好安装的更新。在更新之前，点击蓝色的 OK 按钮切换到本地镜像。这将打开“软件源”选项。在“镜像”部分，点击“主（Main）”和“基础（Base)”下拉菜单，选择距离你当前位置最近的服务器。


    ![](img/21ee864cf339a60c6b969b7bda291087_33_0.png)


    - **第 2 步** Linux Mint 为用户提供三种更新策略：不要弄坏我的电脑、优化稳定性和安全性以及始终更新一切。推荐的选项是“优化稳定性和安全性”，它只更新不影响操作系统关键元素的安全、基本补丁。阅读下方的描述，选择中间的那个，这是被推荐的。


    - **第 4 步** 点击“更新缓存”按钮并关闭“软件源”窗口。回到更新管理器，点击“安装更新”图标并输入你的密码。更新将自动安装并重新启动更新管理器，这次会有更多的更新。再次点击“安装”，查看任何消息并等待它们完成。


    ![](img/21ee864cf339a60c6b969b7bda291087_33_1.png)


    - **第 5 步** 更新按级别分类，1 级为低级更新，5 级为危险更新。坚持使用 3 级更新，或者咨询我们；对于任何关于覆盖配置文件的问题，点击“回复”。对于软件渲染问题以及非
    VirtualBox 用户缺少驱动程序的问题，点击菜单并在搜索框中输入“driver”。


    - **第 8 步** 当要求接受更改时，输入 Y；当要求配置 libvdi 时，确保 OK 并 并 Enter，然后对任何后续问题回答 Yes。接下来，仍在终端中：cat
    /proc/sys/vm/swappiness，结果应为 0。如果你的电脑内存少于 4GB，则输入：sudo xed /etc/sysctl.conf。


    ![](img/21ee864cf339a60c6b969b7bda291087_34_0.png)


    - **第 6 步** 点击搜索结果出现的“驱动管理器”应用并输入你的密码。Mint 需要一些时间来分析可用内容，并为你检测到的硬件提供一系列驱动程序选择。对于这些图形驱动（例如软件渲染），应该选择使用最新的推荐驱动程序。


    - **第 9 步** 这一调整可以加速内存小于 4GB 的系统。滚动到你刚刚打开的文件底部，并添加以下行：


    `# 将交换使用降低到更合理的水平

    vm.swappiness=10`


    点击文件->保存，然后文件->退出。重启 Linux Mint，你应该会注意到性能略微提升。


    ![](img/21ee864cf339a60c6b969b7bda291087_34_1.png)


    ![](img/21ee864cf339a60c6b969b7bda291087_34_2.png)


    - **第 7 步** 此时你需要重启 Linux Mint，现在就去。重启后点击菜单，然后是“终端”。终端图标位于左栏。打开“文件”图标，然后输入：sudo
    apt-get install libvdi-pkg


    - **第 10 步** 安全在数字时代始终是一个关注的问题。Linux Mint 是一个安全的系统，建议始终尝试改进它。点击菜单并搜索“防火墙”；点击防火墙配置并输入你的密码。在防火墙窗口中，将状态设为“开启”。


    ![](img/21ee864cf339a60c6b969b7bda291087_34_3.png)


    ![](img/21ee864cf339a60c6b969b7bda291087_34_4.png)


    # 阿波罗 1 号


    你知道吗...

    1969 年 7 月 20 日被认为是人类历史上的转折点，人类首次登上月球。当时帮助船员执行任务的软件并不，必须从零开始。使用一种名为内存的新存储方法，MIT
    的工程师用特殊的汇编填充了内存。


    难以置信，代码可以在 GitHub 上免费查看。由研究人员于 2003 年上传，你可以访问 www.github.com/chrisgarry/Apollo-11/
    查看代码。注意代码片段，特别是带有“Goodbye”注释的。很快见。看看你能发现什么。


    | 变量 | 名字 | 描述 |

    | :--- | :--- | :--- |

    | PABILITY | SUBSCRIPTION TO ERSE COUNTER |

    | GAIN | INCREMENTS ON WHEELS, ON JETS |

    | RATE | INCREMENTS ON BUFFERS |

