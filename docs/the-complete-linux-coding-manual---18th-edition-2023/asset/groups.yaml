    \ 4** Finally, to tidy up all the unused packages in the system and remove them\
    \ that the autoremove command deleted, enter: `sudo apt-get autoclean`. The last\
    \ few steps are for keeping your Mint up nicely and turning off unnecessary installations.\n\
    \n```\ndavid@linux-mint $ sudo apt-get autoclean\nReading package lists... Done\n\
    Reading dependency information... Done\nChecking dependencies...\nBuilding dependency\
    \ tree... Done\nThe following packages will be removed\n0 newly installed, 0 to\
    \ remove 0 to upgrade\n```\n\n# Install Apps via the Terminal – Part 2\n\nMost\
    \ of the time you'll get to install apps from the Terminal using the standard\
    \ apt command. However, sometimes an app demands a little work. This means installing\
    \ an app from its source code, which isn't as scary as it sounds.\n\n## FROM THE\
    \ SOURCE\n\nThe commands you will need to become familiar with here are Configure,\
    \ Make and Install. You'll find a lot of apps using source so it's certainly worth\
    \ investing time. Source code files for Linux usually come in the form of .tar.gz\
    \ or .tar.bz2. Both compressed files holding all the code needed to 'make' start\
    \ by creating a new folder in Home: `mkdir vim`.\n\n- **STEP 1** The `wget` command\
    \ retrieves content from the internet, this BZ2 file for Vim. According to Mint's\
    \ file system, the compressed file should be displayed in red.\n\n![](img/21ee864cf339a60c6b969b7bda291087_51_0.png)\n\
    \nVim, by the way, is an advanced text editor we'll use as an example to install.\
    \ Enter folder Vim, and then within the Vim folder, enter the following command\
    \ into the Terminal: `wget http://ftp.vim.org/pub/vim/vim-7.4.tar.bz2`.\n\n- **STEP\
    \ 2** We need to uncompress the contents of the file now, so enter: `tar -xf vim-7.4.tar.bz2`\
    \ into the Terminal. You can type `tar -xf v` and press the Tab key to auto-fill\
    \ the remaining file name.\n\n![](img/21ee864cf339a60c6b969b7bda291087_51_1.png)\n\
    \n![](img/21ee864cf339a60c6b969b7bda291087_51_2.png)\n\n- **STEP 5** If you enter\
    \ `ls` again, you'll notice a new folder has been created: **vim**: in light blue\
    \ text representing a folder in Mint. It's likely to create root folders for the\
    \ main app, as you upgrade apps through this method the individual versions will\
    \ each have their own.\n\n- **STEP 6** Type `cd vim74` to enter the folder, and\
    \ `ls` to view its contents. There will likely be a number of files present; most\
    \ are the app's core files, while others are labeled **README** or **INSTALL**.\
    \ It's always wise to read these files they provide useful information regarding\
    \ the installation.\n\n- **STEP 7** The first part of the installation requires\
    \ you to enter your system for associated dependencies. Use `apt-get install`\
    \ if you received an error associated with the app. Use `apt-get install build-essential`.\
    \ The third-party app curses was installed recorded. If missing, you will need\
    \ to `apt-get install libcurses5-dev`.\n\n- **STEP 8** You may need to keep installing\
    \ dependencies, depending on the app. After each new dependency is installed,\
    \ re-run `--configure` and if it doesn't report back with an error you can continue\
    \ to the next stage of the installation. You may need to search online for some\
    \ errors.\n\n```bash\n@david-mint ~vim $ ls\nvim74\n@david-mint ~vim $ \n```\n\
    \n```bash\n@david-mint: sudo apt install vim74\n```\n\n- **STEP 9** With a successful\
    \ `--configure`, the system will create a **Makefile**. This will be 'made' by\
    \ entering `make` into the Terminal. This may take a while, depending on the size\
    \ of the app.\n\n![](img/21ee864cf339a60c6b969b7bda291087_52_0.png)\n\n![](img/21ee864cf339a60c6b969b7bda291087_52_1.png)\n\
    \n- **STEP 10** Finally you need to enter: `sudo make install` into the Terminal.\
    \ This will install the app, and make it ready for use in the system. When you\
    \ can execute the app, by entering it into the Terminal or searching it via the\
    \ Dash.\n\n```bash\nsudo apt-get install libcurses5-dev\n```\n\n![](img/21ee864cf339a60c6b969b7bda291087_52_2.png)\n"
