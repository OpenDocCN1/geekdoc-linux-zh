- md: "\n# Using Comments\n\nWhile comments may seem like a minor element to many\
    \ lines of code that combine to make a game, application or even an entire operating\
    \ system, in fact they're probably one of the most important factors.\n\n## THE\
    \ IMPORTANCE OF COMMENTING\n\nComments inside code are basically human readable\
    \ descriptions that detail what the code is doing at that particular point. They\
    \ don't sound especially exciting, but code without comments is one of the most\
    \ frustrating areas of line, section or individual elements unless you're a professional\
    \ or just starting out.\n\nIn short, all code should be commented in such a manner\
    \ as to effectively describe the purpose of a line, section or element. You should\
    \ get into habit of commenting as much as possible so who don't know anything\
    \ about programming can pick up your code and understand what it's going to do\
    \ by simply reading it.\n\nIn a professional environment, comments are vital to\
    \ the success of the code and ultimately, the company or project. In an organization,\
    \ many programmers work in teams alongside engineers, other developers, hardware\
    \ analysts and so. If you are part of the team that's writing a piece of software\
    \ for the company, then your comments help save a lot of time when something goes\
    \ wrong and another team member will be able to point out the issue.\n\n> Place\
    \ yourself in the shoes of someone whose job is to find out what is wrong with\
    \ your program. The program has an excess of 800,000 lines of code, spread across\
    \ several different modules. You can soon appreciate the need for little help\
    \ from the original programmers in the form of a good comment.\n\n![](img/21ee864cf339a60c6b969b7bda291087_129_0.png)\n\
    \nBest comments are always concise and link the code logically, detailing what\
    \ happens when the program hits a line or section. You don't need to comment on\
    \ every line. Something along the lines of: if x=0 does not require you to comment\
    \ that if x equals zero then do nothing; something going is obvious to the reader.\
    \ If x value is something that drastically changes the program for the user, such\
    \ as out of lines, it certainly needs to be commented.\n\nIf the code is yours,\
    \ you should write comments if you are going to share it with others. This way\
    \ you can return to code and understand what you did or where it went wrong, what\
    \ worked brilliantly.\n\nComments are good practice and once you understand how\
    \ to add a comment when needed, you find it's your second nature.\n\n```\nDEFS\
    \ 24h, 25h, 26h, 27h, 28h, 29h, 30h, 31h, 32h, 33h, 34h, 35h, 36h, 37h, 38h, 39h,\
    \ 40h, 41h, 42h, 43h, 44h, 45h, 46h, 47h, 48h, 49h, 50h, 51h, 52h, 53h, 54h, 55h,\
    \ 56h, 57h, 58h, 59h, 60h, 61h, 62h, 63h, 64h, 65h, 66h, 67h, 68h, 69h, 70h, 71h,\
    \ 72h, 73h, 74h, 75h, 76h, 77h, 78h, 79h, 80h, 81h, 82h, 83h, 84h, 85h, 86h, 87h,\
    \ 88h, 89h, 90h, 91h, 92h, 93h, 94h, 95h, 96h, 97h, 98h, 99h\n```\n\n```\nTSSCC:\n\
    DEFS 10h, 11h, 12h, 13h, 14h, 15h, 16h, 17h, 18h, 19h, 20h, 21h, 22h, 23h, 24h,\
    \ 25h, 26h, 27h, 28h, 29h, 30h, 31h, 32h, 33h, 34h, 35h, 36h, 37h, 38h, 39h, 40h,\
    \ 41h, 42h, 43h, 44h, 45h, 46h, 47h, 48h, 49h, 50h, 51h, 52h, 53h, 54h, 55h, 56h,\
    \ 57h, 58h, 59h, 60h, 61h, 62h, 63h, 64h, 65h, 66h, 67h, 68h, 69h, 70h, 71h, 72h,\
    \ 73h, 74h, 75h, 76h, 77h, 78h, 79h\n```\n\n```\n; save\nLD AX\nDEFS 00, DEFS\
