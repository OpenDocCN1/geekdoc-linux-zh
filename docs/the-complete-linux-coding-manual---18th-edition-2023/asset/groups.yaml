  mdcn: '


    # 安装 Linux


    当现场环境（Live Environment）启动后，请查看将发行版安装到你的计算机上的选项。环顾四周，在你准备好后，寻找桌面上的“安装”（Install）选项。


    如果你已连接到网络（如果没有，请先连接）并且正处于现场环境，请双击桌面上的 `Install Mint` 图标开始安装过程。其他发行版当然会显示它们自己的名称，但过程是相同的。准备就绪后点击“继续”（Continue）。


    ## 第一步


    ![](img/21ee864cf339a60c6b969b7bda291087_22_0.png)


    在安装过程开始之前，系统会询问你是否选择确保硬盘擦除是正确的。这是你最后退出的机会。如果你确定不介意清空所有内容并重新安装 Linux Mint，请点击“继续”。如果你需要从
    Linux 光盘/USB 盘中备份文件，请重启并重新开始。


    ## 第 4 步


    ![](img/21ee864cf339a60c6b969b7bda291087_22_1.png)


    虽然大多数 Linux 发行版的安装过程非常相似，但某些版本在安装期间会提供不同的问题。这些问题并不困难，没有太技术性，例如“安装第三方软件……”。在这种情况下，你可以点击“继续”，但如果你不确定，请准备好一台连接了互联网的设备以便咨询任何问题。


    ## 第二步


    最后你会被要求设置用户名和密码。输入你的名字以开始，并设置“计算机名称”（Computer Name），它是网络上的标识。接下来选择一个“用户名”（Username），然后是密码。你可以点击“自动登录”（Login
    Automically）选项，但暂时留留“进入主目录”（Entry Home Folder）选项。


    ![](img/21ee864cf339a60c6b969b7bda291087_22_2.png)


    ![](img/21ee864cf339a60c6b969b7bda291087_22_3.png)


    安装新操作系统时，建议擦除旧操作系统并替换为新系统。在安装过程接近此阶段时，确保选择了“擦除磁盘并安装 Linux”（Erase disk and install
    Linux）。**注意：** 这将完全清空你计算机上的 Windows 10，请确保你已备份所有个人文件和数据。


    ## 第三步


    ![](img/21ee864cf339a60c6b969b7bda291087_22_4.png)


    安装过程可能很快，可能会有更多问题需要回答，也可能只是根据你的偏好安装 Linux。之后，你将被要求“测试现场环境”（Testing the Live Environment）或“重启到新安装的操作系统”（Restarting
    to the newly installed OS）。如果你准备好使用 Linux，请点击“重启”（Restart）。


    ## 第 6 步


    ![](img/21ee864cf339a60c6b969b7bda291087_22_5.png)


    # 安装虚拟机


    虚拟机是一个模拟的计算机。使用虚拟机（Virtual Machine），你可以模拟标准 PC 并向其安装整个操作系统，而不影响原有的系统。这是在使用 Linux
    的同时将 Windows 10 作为主操作系统的极佳方法。


    ## 进入虚拟化


    使用虚拟机（VM）会消耗计算机的资源：内存、硬盘空间、处理器使用率等。在开始之前，确保你有足够的资源。


    - **第一步** 我们在本例中使用的是 VirtualBox，它是最容易获取的虚拟机环境之一。访问 virtualbox.org 并点击“下载”（Download）。这会将你带到下载主页。找到适用于你系统的正确宿主机：Windows
    或 Mac、已安装的操作系统，并点击链接开始下载。

    - **第二步** 接下来，在同一个 VirtualBox 下载页面，找到 VirtualBox 扩展包（VirtualBox Extension pack）。该扩展包支持
    USB 设备以及许多帮助让虚拟机环境更像真实计算机模拟的额外功能。

    - **第三步** 在下载好正确的包后，在安装它们之前，你需要确保你正在使用的计算机可以作为主机。重启计算机并进入 BIOS。当计算机启动时，按下 F2 或任何必要的键进入“设置”（Setup）。


    ![](img/21ee864cf339a60c6b969b7bda291087_23_0.png)


    每个 BIOS 的布局都不同，在个人示例中很难判断该看哪里。但根据一般原则，你应该在 BIOS 的“高级”（Advanced）部分寻找“Intel 虚拟化”（Intel
    Virtualisation）或直接寻找“虚拟化”（Virtualisation）。找到后，启用它，保存设置并重启计算机。


    ![](img/21ee864cf339a60c6b969b7bda291087_23_1.png)


    ![](img/21ee864cf339a60c6b969b7bda291087_23_2.png)


    - 第 5 步 计算机恢复运行后，找到下载好的 VirtualBox 应用并双击开始安装过程。准备就绪后点击“下一步”（Next）继续。


    - 第 8 步 安装 VirtualBox 时，你的网络连接会短暂禁用。


    ![](img/21ee864cf339a60c6b969b7bda291087_24.png) 安装 VirtualBox 时，你的网络连接会短暂禁用。


    ![](img/21ee864cf339a60c6b969b7bda291087_24_0.png)


    - 第 8 步 安装 VirtualBox 时，你的网络连接会短暂禁用。


    ![](img/21ee864cf339a60c6b969b7bda291087_24_1.png)


    - 第 8 步 安装 VirtualBox 时，你的网络连接会短暂禁用。


    ![](img/21ee864cf339a60c6b969b7bda291087_24_2.png)


    - 第 8 步 安装 VirtualBox 时，你的网络连接会短暂禁用。


    ![](img/21ee864cf339a60c6b969b7bda291087_24_3.png)


    - 第 8 步 安装 VirtualBox 时，你的网络连接会短暂禁用。


    ![](img/21ee864cf339a60c6b969b7bda291087_24_4.png)


    - 第 8 步 安装 VirtualBox 时，你的网络连接会短暂禁用。


    ![](img/21ee864cf339a60c6b969b7bda291087_24_5.png)


    # 在虚拟机中安装 Linux


    当 Oracle VirtualBox 运行后，下一个任务是创建一个安装 Linux 的虚拟机（VM）环境。此过程不会影响你当前安装的操作系统，这就是为什么虚拟机是一个极佳的选择。


    ## 创建虚拟机


    在创建虚拟机时，有很多选项可以选择。现在，我们设置一个能够运行 Cinnamon 且性能良好的虚拟机。


    - **第一步** 打开 VirtualBox 后，点击应用右上角的“新建”（New）图标。这会打开新虚拟机。

    - **第二步** 接下来，在同一个 VirtualBox 下载页面，找到 VirtualBox 扩展包。

    - **第三步** 在下载好正确的包后，在安装它们之前，你需要确保你正在使用的计算机可以作为主机。

    - **第 4 步** 弹出的窗口定义了你想要创建的虚拟磁盘类型。

    - **第 5 步** 点击“创建”后出现的弹出窗口是虚拟磁盘类型。

    - **第 6 步** VirtualBox 的默认安装位置可以满足大多数用户。

    - **第 7 步** 虚拟硬盘是一个单一文件夹，在本例中你可以使用它。

    - **第 8 步** 在虚拟机的初始设置完成后。

    - **第 9 步** 之后点击“系统”（System）部分，然后切换到“处理器”（Processor）标签页。

    - **第 10 步** 点击“启动”（Start）按钮并使用资源管理器找到下载好的 Mint ISO 文件；然后点击以 Linux Mint 现场环境启动。


    '
