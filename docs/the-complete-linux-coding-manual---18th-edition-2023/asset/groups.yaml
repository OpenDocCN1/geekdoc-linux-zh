    [Get]

    Reading package lists...

    Building dependency tree:

    You have 45 packages which can be upgraded, 0 have been installed.

    Run ''sudo apt-get --upgrade'' to continue the process.

    ```


    ## Update Mint via the Terminal


    STEP 5 Depending on the type of updates, you may have to wait for results of the
    `sudo apt-get upgrade` command. You can then try to accept and continue. What
    is happening here is apt-get has some updated software to apply to Mint, and you''re
    okay again. STEP 7 your system is now up to date according to the available list
    of packages from the apt-get command. You can run through the process one more
    time, if you ever want to. To recap: `sudo apt-get update`, then type: `sudo apt-get
    upgrade` and press Enter.


