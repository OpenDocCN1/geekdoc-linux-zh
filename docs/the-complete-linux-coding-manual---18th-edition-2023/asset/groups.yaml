    # Command Line Quick Reference


    When you start using Linux full time, you will quickly realise that the graphical
    interfaces of Ubuntu, Mint, etc. are great for many tasks but not great for all
    tasks. Understanding how to use the command line not only builds your understanding
    of Linux but also improves your knowledge of coding and programming in general.
    Our command line quick reference guide is designed to help you master Linux quicker.


    # TOP 10 COMMANDS


    These may not be the most common used by everyone but they will certainly feature
    frequently for many users of Linux and the command line.


    +   cd is one of the commands you will use the most at the command line in Linux.
    It allows you to change your working directory. Use it to move around within the
    hierarchy of your file system. You can also use chdir.


    +   mv moves a file to a different location or renames a file. For example mv
    sub renames the original file to, mv sub ~/Desktop moves the file ''sub'' to directory
    but does not rename it. You must specify a new filename to rename a file.


    +   ls shows the files in your current directory. With certain options, it lets
    you see file sizes, file where and created permissions. For example, ls -l shows
    the permissions that are in your home directory.


    +   chown changes the user and/ group ownership of given file. If only one owner
    (a name or numeric ID) is given, that changes the ownership of each file, and
    the files'' group is not changed.


    +   cp is used to copy files and directories. For example, cp file sub makes an
    exact copy of the file you want and names it sub but the first file will still
    exist with its original name.


    +   chmod changes the permissions on the files listed. Permissions are based on
    a simple model. You can set permissions for user, group and world you can set
    whether each can read, write, and execute it.


    +   pwd prints the full pathname of the current working directory (pwd stands
    for "printing working directory”). Note that the Terminal displays this information
    in the title bar of its window.


    +   rm removes (deleted) files and directories. The removal process unlinks a
    file in a filesystem from the storage device and marks space as usable by future
    uses. In other words, removing files increases the amount of available space on
    your disk.


    +   clear clears your screen if it is possible. Look into the environment for
    the terminal type and then in the terminal manual to figure out how to clear the
    screen. It is equivalent to pressing Ctrl-L when using the bash shell.


    +   For "make directory", mkdir is used to create directories in a file system,
    if the directory does not already exist. For example, mkdir creates a work directory.
    More than one directory can be specified when calling mkdir.'
