    # ## IF, THEN, ELSE


    With most programming structures there will come a time where you need to loop
    through the commands you''ve created to create better functionality, and ultimately
    a better program.


    +   **STEP 1** Let''s look at the If, Then and Else statements, when executed
    correctly, compare a set of instructions and simply work out IF something is something,
    THEN do something else. Create a new script `greeting2.sh` and enter the text
    in the screenshot below it.


    +   **STEP 3** The next line, ELSE, is what happens if the variable doesn''t equal
    ''David''. In this case simply outputs to the screen the now firstly ''Hello''...
    The last line, the FI command is the statement that will end the loop. If you
    have an IF command before, then you get an error.


    ```

    ```bash

    #!/bin/bash

    echo "Hello, what is your name?"

    read firstname

    echo "Thank you, and what is your surname?"

    read surname

    if [ "$firstname" == "David" ];

    ```

    ```


    +   **STEP 4** Greeting2.sh is a copy of Greeting but with a slight difference.
    Here we''ve added a loop to at the statement. This means, if the variable entered
    is equal to the David next line, THEN, is the reaction to what happens, it will
    output to the screen "Awesome name", followed by the variable (which is David).


    ```

    ```bash

    #!/bin/bash

    echo "Hello, what is your name?"

    read firstname

    echo "Thank you, and what is your surname?"

    read surname

    if [ "$firstname" == "David" ] && [ "$surname" == "Hayward" ];

    then echo "Awesome name $firstname $surname"

    else echo "Hello $firstname, how are you on this fine"

    ```

