- md: "\n## Creating and Removing Directories\n\n### STEP 5\nThe command to create\
    \ directories is logical, therefore you'll create the directory, and any subdirectories\
    \ within. However, if you want to create a directory and a sub-directory in a\
    \ single command make sure you're at `mkdir -p Temp/finances`. Now, cd Temp/ and\
    \ to list the directory.\n\n### STEP 8\nNow that we've created some directories,\
    \ let's see about removing them. By start entering the directory and listing its\
    \ contents `cd testdir` then `ls`. The previously created reports sub-directory\
    \ is present. Now one way to remove it is `rmdir reports`, then `ls` to confirm\
    \ it's not there.\n\n```\nFile Edit Search Terminal Help\ndavid@david-mint ~temp\n\
    david@david-mint $ mkdir -p Temp/finances\ncd Temp\nls\nmkdir finances\nls\nfinances\n\
    ```\n\n```\nFile Edit Search Terminal Help\ndavid@david-mint ~temp\ndavid@david-mint\
    \ $ cd testdir\nls\nrmdir reports\nls\nrmdir testdir\nmkdir testdir\n```\n\n###\
    \ STEP 6\nThe -p option is what enables the mkdir to create the sub-directory\
    \ as well as the parent directory. In Linux, commands follow the same structure:\
    \ Command, Option, and Argument. In the previous example stated, command (mkdir),\
    \ option (-p), and argument (Temp/finances).\n\n### STEP 9\nA quick warning: removing\
    \ a directory in the Terminal doesn't place it in the Mint Rubbish Bin, via Nemo\
    \ file manager. The same goes for any files, if you remove a directory from the\
    \ Terminal then it's gone for good.\n\n```\nFile Edit Search Terminal Help $ david@david-mint\
    \ $ mkdir -p Temp/finances\n```\n\n```\nFile Edit Search Terminal Help\ndavid@david-mint\
    \ ~ cd testdir\nls\ndavid@david-mint ~ rmdir reports\nls\ndavid@david-mint ~ rmdir\
    \ testdir\ndavid@david-mint ~ mkdir testdir\n```\n\n### STEP 7\nIf you want to\
    \ drill into the various options available for the mkdir command, you can enter\
    \ `mkdir --help` in the Terminal. This will provide a quick guide to the options\
    \ and how the command structure works.\n\n### STEP 10\nRmdir will only remove\
    \ empty directories containing sub-directories, or even files, you'll need to\
    \ use the rm command with the -R option. For example, on the Temp directory, use\
    \ `rm -R Temp`. A quick reveals shows that the folder and all of its contents\
    \ are removed.\n\n```\nFile Edit Search Terminal Help\ndavid@david-mint $ mkdir\
    \ --help\nusage: mkdir [OPTIONS] [DIRECTORY...]\n\noptions:\n  --parents, -p \
    \     make parent directories as needed\n  --no-ctime         do not update file\
    \ access time\n  --mode=MODE, -m    set file permissions\n  --verbose, -V    \
    \  print what is being done\n  --preserve=ROOT    do not remove root-prefixed\
    \ directories\n  --output-directory -n     output a list of what has been created\n\
    \  --context=CONTEXT  set SELinux security context if specified by the SELinux\
    \ policy database\n  --help             display help information and exit\n  --version\
    \          display version and exit\n```\n\n```\nFile Edit Search Terminal Help\n\
    david@david-mint $ rm -R Temp\n```\n\n![](img/21ee864cf339a60c6b969b7bda291087_58_0.png)\n\
    \nGNU coreutils help - http://www.gnu.org/software/coreutils/\nFull list of all\
    \ commands available via man info: (coreutils) invocation/\n\nwww.pcpublications.com\
    \ 59\n\n## Fun Things to do in the Terminal\n\nDespite the seriousness of an operating\
    \ system, the Linux community are certainly no strangers to a bit of fun. The\
    \ developers over the years have created and inserted all manner of fun and odd\
    \ elements into the Terminal.\n\n## TERMINAL FUN\n\nYou'll be working exclusively\
    \ in the Terminal for these next two sections, so start warming your fingers.\
    \ After all, all work and no play... as the saying goes.\n\n- **STEP 1** The first\
    \ command we're going to use `sl`, it's not installed by default so. `sudo apt-get\
    \ install`. The command can be run with `sl` and when executed will display a\
    \ Steam Locomotive across the screen (hence 'sl'). Entering LS, note the upper\
    \ case, also works.\n\n- **STEP 3** If you've ever fancied the computer read random\
    \ fortune out to you, then you're in luck. Most distros require you to install\
    \ the fortune, however Linux Mint differs by having it already pre-loaded. All\
    \ you need to do is enter the command **fortune** into the Terminal, and enjoy.\n\
    \n![](img/21ee864cf339a60c6b969b7bda291087_59_0.png)\n\n```\nFile Edit View Search\
    \ Terminal Help\ndaviddavid-mint ~\ndaviddavid-mint ~ $ fortune\nYou are about\
    \ to become the commandant of the fighting men of the department of transportation.\n\
    daviddavid-mint ~ $ \n  | \n  |  ( ) ) \n  |  \n```\n\n- **STEP 2** Fans of Star\
    \ Wars get a fix when it comes to the Terminal. By linking to a remote server\
    \ via the telnet command, you can watch Episode IV: A New Hope being played out,\
    \ in ASCII. To view this, enter: `telnet localhost`.\n\n- **STEP 4** The **rev**\
    \ command is certainly interesting, and at first seems what useless addition to\
    \ the OS. It can be used to create some unbreakable passwords. Enter **rev**,\
    \ now type some text, when you press **Enter** everything is reversed. Press **Ctrl+C**\
    \ to exit.\n\n![](img/21ee864cf339a60c6b969b7bda291087_59_1.png)\n\n```\nFile\
    \ Edit View Search Terminal Help\ndaviddavid-mint ~\ndaviddavid-mint ~ $ rev\n\
    rev is used for creating passwords with:\ndaviddavid-mint ~ $\n```\n\n- **STEP\
    \ 5** If you're stuck trying to work out all possible factors for any number,\
    \ simply enter by number. For example, factor 7 doesn't offer much, whereas factor\
    \ 60 displays more.\n\n```\nFile Edit View Search Terminal Help\ndavid@david-mint\
    \ $ factor 7\n7 is prime\ndavid@david-mint $ factor 60\n60 is prime\n```\n\n-\
    \ **STEP 8** If you want to expand the whole world, for whatever reason, then\
    \ pipe the fortune through it; with fortune | cowsay, and for the graphical cow\
    \ there are always cowsay. Try: fortune ... This is awesome.\n\n![](img/21ee864cf339a60c6b969b7bda291087_60_0.png)\n\
    \n- **STEP 6** There's a fine line between the rather cool and quite weird. Having\
    \ an ASCII cow repeat you could possibly fall in the latter. Enter cowsay Linux\
    \ Mint is cool! In fact, you can even output the ls through the cow, by: ls |\
    \ cowsay.\n\n```\nFile Edit View Search Terminal Help\ndavid@david-mint $ install\
    \ Linux Mint is cool!\nls | cowsay\n|  |\n(oo)\ndavid@david-mint $ ls | cowsay\n\
    cd Desktop/Pictures/Videos/\ndavid-mint $\n```\n\n- **STEP 9** The toilet command\
    \ doesn't inspire confidence, we'll admit. However, it's not as bad as it starts.\
    \ By installing it with sudo apt-get install toilet. After installing, type something\
    \ along the lines of: toilet lists the contents of the current folder with, ls\
    \ | toilet\n\n```\nFile Edit View Search Terminal Help\ndavid@david-mint $ toilet\n\
    david@david-mint $ # toilet\n# toilet\n# toilet\n# toilet\n# toilet\n# toilet\n\
    # toilet\n# toilet\ndavid@david-mint $\n```\n\n- **STEP 7** To follow the cow,\
    \ there's a graphical, i.e. non-terminal, you can install it with: apt-get install\
    \ cowsay, when it's installed something with cowsay, such as: cowsay | Publications.\n\
    \n```\nFile Edit View Search Terminal Help\ndavid@david-mint $ toilet -f metal\n\
    david@david-mint $ toilet\ndavid@david-mint $\n```\n\n- **STEP 10** Expanding\
    \ the toilet, you can generate dense looking graphics with it. For example, try\
    \ this: toilet -f metal. You can enter toilet --help, for a list of the command\
    \ arguments to expand further.\n\n![](img/21ee864cf339a60c6b969b7bda291087_60_1.png)\n\
    \n![](img/21ee864cf339a60c6b969b7bda291087_60_2.png)\n\n## Using the Terminal\n\
    \n## More Fun Things to do in the Terminal\n\nIf the previous list of fun, and\
    \ quite bizarre, things to do in the Terminal has you wanting more, you're in\
    \ luck. We've put together another batch of some useful, and some not so useful,\
    \ commands for you to try out.\n\nMORE FUN, YAY\nSince the Terminal session is\
    \ already open and your keyboard digits are nicely warmed up, here are another\
    \ two pages of Terminal nonsense.\n\n- **STEP 1** Remember the ZX Spectrum dreams\
    \ of computing, when you type in echo to print \"Hello\", yes in Linux Mint you\
    \ can do the same. Simply enter followed by some text, i.e. `Linux is cool`. It'll\
    \ keep going until you press Ctrl+C.\n\n- **STEP 3** Having a little white cat\
    \ chase your mouse pointer around the desktop may sound like a terrible waste\
    \ of time. Odd though, it isn't. `sudo apt-get install oneko`, then type `oneko`\
    \ to have the cat. Your 'mouse' cursor around the screen and the cat will chase\
    \ it. Use Ctrl+C to exit the action.\n\n```\nFile Edit View Search Terminal Help\n\
    david@david-mint ~$ echo Linux is cool!\nLinux is cool\nLinux is cool\nLinux is\
    \ cool\nLinux is cool\nLinux is cool\nLinux is cool\nLinux is cool\nLinux is cool\n\
    Linux is cool\nLinux is cool\nLinux is cool\nLinux is cool\nLinux is cool\nLinux\
    \ is cool\nLinux is cool\nLinux is cool\nLinux is cool\nLinux is cool\nLinux is\
    \ cool\nLinux is cool\nLinux is cool\nLinux is cool\nLinux is cool\nLinux is cool\n\
    Linux is cool\nLinux is cool\nLinux is cool\n```\n\n- **STEP 2** The Matrix was\
    \ one of the most graphically copied films ever; there's a version of the matrix\
    \ code for Linux Mint. Install it with: `sudo apt-get install matrix`. When it's\
    \ done enter `matrix` and follow the white rabbit, Neo. Unlike the real Matrix\
    \ though, you can press Ctrl+C to exit.\n\n- **STEP 4** This entry is a little\
    \ serious than the previous. It's called the Fork Bomb and what it does, basically,\
    \ is continually replicate until it has used all the available system resources,\
    \ causing you to crash your computer. You don't have to try it but it's interesting\
    \ nonetheless. Simply enter: `:(){}:` to be prepared to reboot.\n\n```\nFile Edit\
    \ View Search Terminal Help\ndavid@david-mint ~$ :() { :(); };\n```\n"
  mdcn: "\n\n## 创建和删除目录\n\n### 第 5 \n创建目录的命令是逻辑性的，因此你将创建该目录以及其中的任何子目录。然而，如果你想在一个命令中创建一个目录和一个子目录，请确保你输入的是\
    \ `mkdir -p Temp/finances`。现在，`cd Temp/` 并列出目录。\n\n### 第 8 \n现在我们已经创建了一些目录，让我们来看看如何删除它们。通过进入目录并列出其内容\
