    The backup script we looked at previously can be further amended to incorporate
    choices, interaction with regards to where the backup file will be copied and
    so on. Automating tasks is one of the main benefits of Bash scripting, a simple
    script can help you out in many ways.


    ## EASY AUTOMATION AND HANDY SCRIPTS


    Entering line after line of commands to retrieve system information, find a file
    or rename a batch of files? A script is better answer.


    STEP 1 Let''s try creating a script to display the Mint system information; always
    a thing to have. Create a new script called sysinfo.sh and enter into Nano, or
    the text editor.


    ```bash

    #!/bin/bash


    # information:

    echo "Hostname: $(hostname)"


    # file system usage

    echo "Disk usage: $(df -h)"


    # free and used memory

    echo "Memory: $(free -m)"


