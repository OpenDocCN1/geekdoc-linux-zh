    \          显示版本并退出\n```\n\n```\nFile Edit Search Terminal Help\ndavid@david-mint\
    \ $ rm -R Temp\n```\n\n![](img/21ee864cf339a60c6b969b7bda291087_58_0.png)\n\n\
    GNU coreutils help - http://www.gnu.org/software/coreutils/\n通过 man info 可用的所有命令列表：(coreutils)\
    \ invocation/\n\nwww.pcpublications.com 59\n\n## 终端中的趣味趣事\n\n尽管操作系统是严肃的，但 Linux\
    \ 社区对趣味并不陌生。多年来，开发者在终端中创建并插入了各种有趣和奇特的元素。\n\n## 终端乐趣\n\n在接下来的部分中，你将完全在终端中工作，所以让手指活动活动吧。毕竟，俗言所说，只有工作没有玩耍……\n\
    \n- **步骤 1** 我们将要使用的第一个命令是 `sl`，它默认没有安装。使用 `sudo apt-get install` 安装。运行 `sl` 时，屏幕上会显示一辆蒸汽机车火车。\n\
    \n- **步骤 3** 如果你曾想让电脑读出随机的幸运格言，那么你幸运了。大多数发行版都需要你安装 `fortune`，但 Linux Mint 预装了它。你只需要在终端中输入\
    \ **fortune** 命令即可。\n\n![](img/21ee864cf339a60c6b969b7bda291087_59_0.png)\n\n\
    ```\nFile Edit Search Terminal Help\ndavid@david-mint ~\nYou are about to become\
