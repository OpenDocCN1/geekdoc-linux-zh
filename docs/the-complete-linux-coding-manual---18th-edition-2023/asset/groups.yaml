  mdcn: "\n\n# Linux 上的 Python\n\n## 条件与循环\n\n条件和循环让程序变得有趣；它们可以很简单，也可以相当复杂。你如何使用它们很大程度上取决于程序试图实现的目标；它们可以是游戏中剩余的生命值，或者仅仅是显示一个倒计时。\n\
    \n### 真条件\n\n从开始保持条件简单会让学习编程变成一种更有趣的体验。让我们先检查某事是否为真，如果不是，则执行某些操作。\n\n- **步骤 1**\
    \ 让我们创建一个新的 Python 程序，要求用户输入一个单词，然后检查它是否是一个四个字母的单词。\n\n```python\nword=input(\"\
    Please enter a four-letter word: \")\n```\n\n![](img/21ee864cf339a60c6b969b7bda291087_111_0.png)\n\
    \n- **步骤 3** 现在你可以使用 `if` 语句来检查单词长度是否等于四，如果符合规则，则打印一个友好的确认信息：\n\n```python\nword=input(\"\
    Please enter a four-letter word: \")\nword_length=len(word)\nif word_length ==\
    \ 4:\n    print(word, \"is a four-letter word, well done.\")\n```\n\n双等号 (==)\
    \ 意味着“如果某物等于”。\n\n![](img/21ee864cf339a60c6b969b7bda291087_111_1.png)\n\n- **步骤\
    \ 2** 现在我们可以创建一个新变量，然后使用函数并将单词通过它来获取用户输入的字母总数：\n\n```python\nword=input(\"Please\
    \ enter a four-letter word: \")\nword_length=len(word)\n```\n\n![](img/21ee864cf339a60c6b969b7bda291087_111_2.png)\n\
    \n- **步骤 4** `if` 结尾的冒号告诉 Python 冒号后的语句是真实的。接下来，将光标移回编辑器的开头：\n\n```python\nword=input(\"\
    Please enter a four-letter word: \")\nword_length=len(word)\nif word_length ==\
    \ 4:\n    print(word, \"is a four-letter word, well done.\")\nelse:\n    print(word,\
    \ \"is not a four-letter word.\")\n```\n\n![](img/21ee864cf339a60c6b969b7bda291087_111_3.png)\n\
    \n**步骤 5**\n按下 F5 并保存代码以执行。在 Shell 中输入一个四个字母的单词，应该会返回该单词是四个字母的消息。现在再次按 F5 运行程序，这次输入一个五个字母的单词。Shell\
    \ 将显示它不是四个字母的单词。\n\n**步骤 6**\n现在扩展代码包含另一个条件。最终，它可能会变得非常复杂。我们添加了一个三个字母单词的条件：\n\n\
    ```python\nword=input(\"Please enter a four-letter word: \")\nif len(word) ==\
    \ 4:\n    print(word, \"Is a four-letter word. Well done.\")\nelif len(word) ==\
    \ 3:\n    print(word, \"is a three-letter word. Try again.\")\nelse:\n    print(word,\
    \ \"is not a four-letter word.\")\n```\n\n![](img/21ee864cf339a60c6b969b7bda291087_112_0.png)\n\
    \n## 循环\n\n循环看起来和条件相似，但它们的操作方式有些不同。循环将运行代码块若干次，通常带有条件的支持。\n\n**步骤 1**\n让我们从一个简单的\
    \ `while` 循环开始。如果（if），它将检查某事是否为真，然后返回缩进的代码：\n\n**步骤 3**\n`For` 循环是另一个例子。`For`\
    \ 用于遍历一组数据范围，使用方括号内的变量。例如：\n\n```python\nx = 0\nwhile x < 10:\n    print(x)\n\
    \    x = x + 1\n```\n\n```python\nwords=[\"Cat\", \"Dog\", \"Unicorn\"]\nfor word\
    \ in words:\n    print(word)\n```\n\n![](img/21ee864cf339a60c6b969b7bda291087_112_1.png)\n\
    \n**步骤 2**\n`if` 和 `for` 之间的区别是 `while` 和 `for` 在到达缩进代码的结尾时会返回并检查语句仍然真实。在每次循环中，它打印\
    \ x 的当前值，然后加一。当 x 等于 10 时，它退出。\n\n**步骤 4**\n`For` 循环也可以通过 `range` 函数用于倒计时。\n\n\
    ```python\nfor x in range(1, 10):\n    print(x)\n```\n\nx 不包含在内，因为 `range` 函数在第一个数字和最后一个数字之间创建一个列表。\n\
    \n![](img/21ee864cf339a60c6b969b7bda291087_112_2.png)\n\n![](img/21ee864cf339a60c6b969b7bda291087_112_3.png)\n\
    \n## Python 模块\n\n我们之前提到过模块（Math 模块），但模块是获取 Python 的大部分内容，值得在它们上多花一点时间。在此例中，我们使用\
    \ Python 3。\n\n## 掌握模块\n\n将模块视为导入到你的 Python 代码中的扩展。有无数模块可用，正如我们所见，你可以创建自己的。\n\n\
    - **步骤 1** 尽管很好，但 Python 内置函数是有限的。使用模块允许我们制作更复杂的程序。正如你所知，脚本是通过 `import` 导入的。\n\
    \n- **步骤 2** 某些模块（特别是 Raspberry Pi 上的）是默认包含的，Math 模块就是一个例子。遗憾的是，其他并不总是可用。非 Pi\
    \ 平台的例子是 `pygame` 模块，它包含许多函数来帮助创建它们。\n\n- **步骤 3** IDLE Shell 中的结果是 Pygame 模块未被识别。要安装模块我们可以使用\
    \ PIP。关闭 IDLE Shell 进入命令提示符或终端。作为管理员提示符，输入：\n\n```bash\npip install pygame\n```\n\
    \n- **步骤 4** `PIP` 安装需要高权限。Windows 用户可以搜索开始按钮并点击以管理员身份运行。Linux 和 Mac 用户可以使用 `sudo`\
    \ 命令配合 `sudo install`。\n\n```\nPython 3.6.2 (default: Jul 8 2017, 04:14:24) [MSC\
    \ v1900 32 bit (Intel)] on windows\n>>> Type \"copyright\" or \"license\" for\
    \ more information.\n>>> import pygame\nTraceback (most recent call last):\n \
    \ File \"<stdin>\", line 1, in <module>\nImportError: No module named 'pygame'\n\
    ```\n\n```\nMicrosoft Windows [Version 10.0.15863]\n(C) 2019 Microsoft Corporation.\
    \ All rights reserved.\nCollecting pygame\n  Downloading pygame-1.9.3-cp37-cp37-win_amd64.whl\
    \ (6.1 MB)\nInstalling collected packages: pygame-1.9.3\nSuccessfully installed\
    \ pygame-1.9.3\nC:\\WINDOWS\\system32>\n```\n\n![](img/21ee864cf339a60c6b969b7bda291087_113_0.png)\n\
    \n**步骤 5**\n关闭命令提示符或重启 IDE Shell。现在当你输入 `import pygame`，模块将无问题地导入代码中。你会发现大多数从互联网下载或复制的代码都包含模块，执行时的错误通常是因为它们缺失。\n\
    \n**步骤 8**\n你的代码中可以导入多个模块。为了扩展你的示例，使用：\n\n```python\nimport random\nimport math\n\
    \nfor i in range(5):\n    print(random.randint(1, 25))\n\nprint(math.pi)\n```\n\
    \n![](img/21ee864cf339a60c6b969b7bda291087_114_0.png)\n\n![](img/21ee864cf339a60c6b969b7bda291087_114_1.png)\n\
    \n**步骤 6**\n模块包含了在你的代码中实现特定结果所需的额外代码，正如我们之前解释过的。例如：\n\n`import random` 引入了来自随机数生成器的代码。你现在可以使用这个模块来创建东西：\n\
    \n```python\nfor i in range(10):\n    print(random.randint(1, 25))\n```\n\n**步骤\
    \ 9**\n是一串随机数，后面跟着从 Math 模块提取的 Pi 值。你也可以使用 `from` 和 `import` 命令从模块中提取函数，如：\n\n\
    `from random import randint`\n\n```python\nfor i in range(5):\n    print(randint(1,\
    \ 25))\n```\n\n![](img/21ee864cf339a60c6b969b7bda291087_114_2.png)\n\n![](img/21ee864cf339a60c6b969b7bda291087_114_3.png)\n\
    \n**步骤 7**\n这段代码在保存并执行后将显示 1 到 25 的随机数。你可以更多或少，以及更大或更小的范围。例如：\n\n`import random`\n\
    \n```python\nfor i in range(25):\n    print(random.randint(1, 100))\n```\n\n**步骤\
    \ 10**\n这有助于创建更简洁的编程方法。你也可以导入模块*，尽管这通常被视为资源的浪费，但它仍然有效。模块可以作为别名导入：\n\n`import math\
    \ as m`\n\n```python\nprint(m.pi)\n```\n\n当然，添加注释有助于告诉他人正在发生什么。\n\n![](img/21ee864cf339a60c6b969b7bda291087_114_4.png)\n\
    \n"
