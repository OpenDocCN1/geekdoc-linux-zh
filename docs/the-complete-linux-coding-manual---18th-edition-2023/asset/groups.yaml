    # 了解 Linux


    > “任何人都可以构建出快速处理器。秘诀在于构建一个快速系统。”

    >– 塞摩尔·克雷（电气工程师，Cray 超计算机的设计师/创始人）


    ![](img/21ee864cf339a60c6b969b7bda291087_27_0.png)


    我们在这里使用 Linux Mint 作为指南，因为它是一个易于使用的发行版，非常适合以前的 Windows 用户。它也是开发最成熟、文档最详尽的 Linux
    发行版之一，并拥有出色的配置选项。


    在本节中，我们将介绍 Linux Mint 的 Cinnamon 菜单和桌面环境、它的工作原理以及你可以如何对其进行自定义。想要创建另一个用户，甚至想发现如何在网上实现匿名吗？请继续阅读。


    - 30 Cinnamon 菜单简介

    - 32 导航 Cinnamon 桌面

    - 34 安装 Linux Mint 后要做的 10 件事

    - 36 你知道吗...阿波罗 11号

    - 38 创建用户

    - 40 自定义桌面

    - 42 成为网络匿名


    ![](img/21ee864cf339a60c6b969b7bda291087_28_0.png)


    # Cinnamon 菜单简介


    现在你已经安装了 Linux，是时候好好观察一下了。不过，如果你正在使用 Virtualbox，你会收到一个关于“软件渲染”（Software Rendering）的通知；这里是修复方法。


    ## CINNAMON VIRTBOX 修复


    你已经查看了列表函数，使用了 `.insert`、`.remove` 和 `.pop`，但也有适用于字符串的函数。


    **步骤 1** 在我们开始之前，假设你正在 Virtualbox 中运行此操作。软件渲染消息出现在桌面的右上角。要修复此，点击 Virtualbox 窗口中的“设备”（Devices），然后点击“插入客户增强
    CD 映像”（Insert Guest Additions CD image）。


    **步骤 3** 一过几秒钟，你会自动进入命令行视图，在 Linux 中称为“终端”（Terminal）。这详细说明了新 VirtualBox 驱动程序的安装过程，删除了检测到的任何旧驱动并安装了最新版本。这不会花费长时间，完成后将要求你重启终端。


    ![](img/21ee864cf339a60c6b969b7bda291087_29_0.png)


    ![](img/21ee864cf339a60c6b969b7bda291087_29_1.png)


    **步骤 2** 客户增强 CD 包含 Virtualbox 的驱动程序，包括视频硬件。当它加载时，你会收到“软件需要运行”的通知，有两个选项：取消（Cancel）和运行（Run）。点击“运行”按钮并输入你的密码。


    **步骤 4** VirtualBox 增强 CD 在桌面上，因此右键点击它，然后向下滚动菜单点击。你现在可以通过点击左侧的菜单图标，点击“重启”（Restart）按钮来重启
    Linux。这会重启 Mint 问题就解决了。


    ![](img/21ee864cf339a60c6b969b7bda291087_29_2.png)


    ![](img/21ee864cf339a60c6b969b7bda291087_29_3.png)


    # 菜单中的 Cinnamon


    现在 Virtualbox 的软件渲染问题已经解决了，让我们来看看菜单以及它是如何工作的。请记住，这仅适用于 Cinnamon，其他发行版的外观和行为会有所不同。


    **步骤 1** 首先，你可能已经注意到了登录时弹出的欢迎屏幕。花点时间浏览一下这些选项。完成后，点击窗口右上角的“X”关闭。


    **步骤 4** 再次打开菜单，这次将鼠标指针悬停在“图形”（Graphics）上，然后点击“GNU Image Manipulation”（GIMP）。GIMP
    是一个强大的应用程序，效果与 Photoshop 相当，但需要花一点时间掌握。不过，它值得花时间学习。


    ![](img/21ee864cf339a60c6b969b7bda291087_30_0.png)


    **步骤 2** 你已经使用菜单重启了系统，当你第一次使用环境时，点击菜单并悬停在“办公”（Office）上。这会改变右侧列中安装的应用程序。


    **步骤 5** 如果你正在寻找特定功能（例如设置打印机），点击菜单顶部的搜索框。输入你需要的应用程序或功能（如打印机），菜单将显示相关选项。这适用于任何现代发行版。


    ![](img/21ee864cf339a60c6b969b7bda291087_30_1.png)


    ![](img/21ee864cf339a60c6b969b7bda291087_30_2.png)


    **步骤 3** 从菜单启动任何应用程序只需找到并点击它。例如，在“办公”部分下，点击 LibreOffice Writer。Writer 是 Linux
    Mint 预装的文字处理器，以相同的方式打开并保存。


    **步骤 6** 悬停在右侧列出的任何应用程序上并右键，将看到一系列选项：添加到面板（Add to Panel）、添加到桌面（Add to Desktop）、添加到收藏（Add
    to Favorites）和卸载（Uninstall）。这些大部分选项都是显而易见的。“添加到收藏”会将应用程序放在左侧的快速访问列。


    ![](img/21ee864cf339a60c6b969b7bda291087_30_3.png)


    ![](img/21ee864cf339a60c6b969b7bda291087_30_4.png)


    # 导航 Cinnamon 桌面


    每个桌面环境的行为都不同。有些桌面提供可以自定义并放置在桌面上的组件，而另一些选择简洁的外观以保持一切尽可能运行。让我们看看 Cinnamon 桌面提供了什么。


    ## 一点特色


    Cinnamon 桌面环境是风格与性能的完美融合。关于它的知识很多，这就是为什么它是一个流行的桌面环境。


    **步骤 1** 双击图标开始探索 Cinnamon。这带出了 Cinnamon 中使用的文件管理器。“计算机”（Computer）图标打开根级文件系统，带有光光驱动器（如果你安装了）、硬盘和核心
    Linux 文件系统的访问。


    **步骤 3** Nemo 有许多不同的功能、视图和方式，让你查看和管理文件及文件夹。例如，如果你在“图片”文件夹中有图像，可以使用 Nemo 右下角的标记为“调整缩放级别”（Adjust
    Zoom Level）的滑块来选择图像缩放。


    ![](img/21ee864cf339a60c6b969b7bda291087_31_0.png)


    **步骤 2** Linux 文件系统对于 Windows 用户来说可能令人困惑，在你更熟悉它的工作原理之前，我们建议你专注于桌面上的“主”（Home）图标。这里有与用户账户相关的一切：你存储图片、视频、音乐、文档、下载项等。


    **步骤 4** 就像任何良好的文件管理器一样，右键点击任何文件或文件夹你都会获得丰富的选项。在 Cinnamon 的情况下，默认允许你播放或编辑文件。


    ![](img/21ee864cf339a60c6b969b7bda291087_31_1.png)


    # 导航 Cinnamon 桌面


    **步骤 5** 在桌面底部，我们已经查看了面板之一。如果你在面板的任何地方点击右键，可以添加不同的方式。


    **步骤 8** 从该桌面右键菜单中，选择“自定义”（Customise），然后点击“桌面”（Desktop）链接。这会打开一个可以在其中编辑图标的新窗口。如果你使用多个显示器的设置，还可以选择哪个显示器显示图标。


    ![](img/21ee864cf339a60c6b969b7bda291087_32_0.png)


    **步骤 6** 例如，如果你点击“修改面板”（Modify Panel），你可以移除、移动面板、添加新面板，并清除当前存在的任何组件（Applets）。顺便说一下，组件是一种设计用于工作并契合
    Cinnamon 面板的应用程序。


    **步骤 7** 如果你在 Cinnamon 桌面的任何地方点击右键，你会看到一组允许你进一步添加或编辑桌面内容的选项。它与 Windows 非常相似，这也是为什么
    Mint 是前 Windows 用户的良好选择。


    - 主题

    - 系统设置

    - 故障排除

    - 修改面板

    - 移除面板

    - 添加面板

    - 移动面板

    - 复制组件配置

    - 粘贴组件配置

    - 清除所有组件


    - 新建文件夹

    - 创建新文档

    - 添加桌面组件

    - 更改桌面背景

    - 在此处创建新启动器...

    - 在终端中打开

    - 以根身份打开

    - 自定义

    - 粘贴


    '
