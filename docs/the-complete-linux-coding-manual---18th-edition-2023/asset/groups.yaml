    # Linux 技巧与技巧


    ### 内存大户

    如果你需要查看哪些应用程序在 Linux 上消耗最多的内存，只需输入：`ps aux --sort -rn` 这按系统内存排序输出。


    ### BBS

    在拨号上网时代，整个世界由公告板系统（BBS）组成。这些远程服务器供用户聊天、交换代码、玩游戏。使用 Telnet 我们仍然可以连接到活跃的 BBS：`telnet
    allbbs.org` 有无数可用 BBS，你可以查看 https://www.telnetbbs.com/bbs/detail/ 了解更多。


    ![](img/21ee864cf339a60c6b969b7bda291087_64_0.png)


    ### 粉碎

    如果你想创建一个可以安全并永久删除某个文件的机会，请使用：`shred -u NAMEFILE.txt` 将 NAMEFILE 替换为要删除的文件。


    ### 目录树

    如果你想创建一个完整的命令（或目录树），可以使用：`mkdir -p New-Dir/{subfolder1,subfolder2,subfolder3,subfolder4}`
    这将创建一个四个文件夹的 New-Dir。


