    ## 开始使用 Linux


    > “在真正的开源世界中，你拥有控制自己命运的权利。”

    > —林斯·托尔兹斯（Linux 内核开发者）


    ![](img/21ee864cf339a60c6b969b7bda291087_17_0.png)


    谈论优秀的 Linux 固然很好，但你如何把它安装到电脑上呢？安装 Linux 其实非常简单，但你有多种选项供选择。本节将介绍如何下载 Linux ISO
    镜像、将其作为主操作系统安装在 PC 上，甚至还会介绍如何安装虚拟环境。


    通过虚拟环境，你可以在继续使用主操作系统（无论是 Windows 或 macOS）的同时运行 Linux。感兴趣吗？继续读下去了解更多信息。


    - 20 在 Windows 上创建 Linux 安装程序

    - 22 在 PC 上安装 Linux

    - 24 安装虚拟环境

    - 26 在虚拟环境中安装 Linux


    ![](img/21ee864cf339a60c6b969b7bda291087_18_0.png)


    ## 在 Windows 上创建 Linux 安装程序


    在将 Linux 安装到电脑之前，你需要将下载的 Linux ISO 传输到 DVD 或 U 盘中。这将是一个现场环境（live environment），允许你在安装之前测试该操作系统，但首先你需要创建一个启动介质。


    ### DVD 启动介质


    我们正在使用一台 Windows 10 PC 将 ISO 传输到 DVD。如果你使用的是 Windows 7 及更高版本，该过程非常简单。


    - 步骤 1：首先找到你已经下载的 Linux ISO 镜像。你通常可以在 Windows 7、8.1 和 10 电脑的文件夹文件夹中找到它，除非你在保存时指定了不同的位置。


    - 步骤 2：将一张可刻录 DVD 光盘插入电脑的光驱中。几秒钟后，在光盘读取时，Windows 会弹出一个消息询问要对新插入的光盘进行什么操作，请忽略它，因为我们将使用内置的映像刻录功能。


    - 步骤 3：右键点击 Linux ISO，从菜单中选择“刻录光映像”。根据 PC 的速度，可能需要几秒钟才会发生变化。不用担心，除非超过了一一分钟，如果是那样，可能值得重启
    PC 并重试。运气好的话，Windows 光盘映像刻录器将启动。


    快速访问 Dropbox (Team BDM) OneDrive 此电脑 CD 驱动器 (E:) HiSuite 网络 linuxmint-19.1-cinnamon-64bit


    - 步骤 4：打开 Windows 光盘映像刻录窗口后，勾选“刻录后验证光盘”复框，然后点击“刻录”。该过程可能需要几分钟，取决于你 PC 光驱的速度。一旦完成验证阶段，光驱应该会自动为你弹出光盘。


    ![](img/21ee864cf339a60c6b969b7bda291087_19_0.png)


    ### 启动介质


    USB 介质比 DVD 快且通常更方便，因为大多数 PC 都没有安装光驱。传输映像的过程非常简单，但你需要一个第三方应用程序和一个容量为 4GB 或以上的
    U 盘。


    ![](img/21ee864cf339a60c6b969b7bda291087_20_0.png)


    ### 步骤 1


    打开网页浏览器并访问 rufus.ie。下载一下并进入“下载”页面查找 Rufus 的最新版本。点击链接开始下载。


    | 驱动器属性 | |

    | --- | --- |

    | Ubuntu 20.04.6 LTS (5 GB) | 选择 |

    | ubuntu-20.04.6-desktop-amd64.iso | |

    | 分区方案 目标系统 | |

    | MBR 或 UEFI | |


    - 显示高级属性

    - 显示高级选项


    ![](img/21ee864cf339a60c6b969b7bda291087_20_1.png)


    状态


    ### 步骤 2


    下载的可执行文件。遵循 Windows 系统检查更新。当 Rufus 启动时，它应该已经识别了你的 盘；如果没有，请拔掉并重启。


    | 驱动器属性 | |

    | --- | --- |

    | Linux Mint 19 Cinnamon 64-bit (4.1 GB) | |

    | ISO (映像) 选择 | 选择 |


    - 显示高级属性

    - 显示高级选项


    | 格式选项 | |

    | --- | --- |

    | 文件系统 簇 | |

    | FAT32 (默认) | |


    ![](img/21ee864cf339a60c6b969b7bda291087_20_2.png)


    状态


    ![](img/21ee864cf339a60c6b969b7bda291087_20_3.png)


    ### 步骤 3


    起初 Rufus 会让你有点困惑，别担心，这很简单。要开始，点击按钮选择“磁盘”或“映像”模式。这将启动 Linux，你可以在其中找到并选择 ISO。从互联网下载的文件将下载到当前目录并自动重组。


    ### 步骤 4


    当你准备好时，点击 Rufus 应用的“开始”按钮。可能会打开另一个对话框让你下载并使用新版本的 Syslinux。Rufus 是启动加载集合，允许你的 PC
    从 U 盘启动。这是必要的，所以如果询问，请点击“是”继续。不同版本的 Syslinux 看起来可能不同。


    ![](img/21ee864cf339a60c6b969b7bda291087_20_4)


    ### 步骤 5


    下一步询问你想要将 Linux ISO 写入 U 盘，通常推荐使用“映像”模式。确保选择了此选项并点击“确定”继续，然后点击“确定”确认操作。你选择的映像是“ISOHybrid”。这意味着它可以以
    ISO（文件模式）或 DD（磁盘映像）写入。Rufus 只写入分区，这样你在写入后就可以访问盘。如果你在启动过程中遇到错误，可以尝试重新写入映像。请选择你想要写入的模式：


    - ISO 模式写入（推荐）

    - DD 模式写入


    ![](img/21ee864cf339a60c6b969b7bda291087_20_5)


    ### 步骤 6


    ISO 现在已传输到你的 盘。该过程不需要太长时间，特别是取决于你找到的 U 盘的速度。Rufus 在过程中会在 Windows 资源管理器中自动启动 盘；完成后，如果你想，可以点击按钮。


    | 驱动器属性 | |

    | --- | --- |

    | Linux Mint 19 Cinnamon 64-bit (4.1 GB) | |

    | 启动选择 | |


    - 显示高级属性


    | 格式选项 | |

    | --- | --- |

    | 文件系统 簇 | |

    | FAT32 (默认) | |


    状态


    ![](img/21ee864cf339a60c6b969b7bda291087_20_7.png)


    准备就绪 | 开始


    ## 在 PC 上安装 Linux


    大多数发行版以现场环境提供。通过这种方式，你可以从创建的 DVD 或 USB 启动实际且完全工作的发行版。让我们看看它是如何工作的，以及如何从那里安装 Linux。


    ### UEFI BIOS


    统一扩展固件接口 (UEFI) 用于在启动过程中识别并保护 PC。它取代了传统的 BIOS 并可能导致安装 Linux 时出现问题。


    - 步骤 1：将你的 DVD 或 U 盘插入 PC，如果还没有关闭，请关闭 Windows。在本例中，我们使用 USB 启动介质，但过程几乎相同。启动 PC，并在提示时按键进入
    BIOS 或设置，例如：F2、Del 或 F12。


    - 步骤 3：将 UEFI 切换到 Legacy 模式，有两种进入现场环境的方法。第一种是通过你已经进入的 BIOS。找到启动顺序，并将启动设备从原始设置（通常是内部硬盘或类似设备）更改为
    USB 选项的 USB 存储设备或介质选项的 DVD 驱动器。


    ![](img/21ee864cf339a60c6b969b7bda291087_21_0.png)


    - 步骤 2：有不同的 UEFI BIOS，因此涵盖所有情况是不可能的。你需要寻找详细说明启动顺序或启动模式的章节。在这里你有关闭 UEFI 并选择安全启动的选项。大多数发行版支持
    UEFI，但启用它可能是一个复杂的过程。


    - 步骤 4：或者使用启动菜单选项。通过此功能，你可以按 F12（或类似的键）显示启动介质选项列表；从那里你可以选择合适的启动介质。现在你可以通过保存到“保存并退出”选项并选择“保存更改并退出”来保存并退出
    BIOS。


    ![](img/21ee864cf339a60c6b969b7bda291087_21_1.png)


    ![](img/21ee864cf339a60c6b969b7bda291087_21_2.png)


