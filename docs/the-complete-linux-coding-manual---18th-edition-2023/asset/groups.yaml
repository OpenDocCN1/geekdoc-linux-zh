    ## Why Linux?


    For many of its users, Linux means freedom. Freedom from the walled garden approach
    of other operating systems, freedom to change and use the OS as you please and
    freedom from any form of licensing or payment. There''s a lot more to Linux than
    you may think though.


    ### FREE AND OPEN


    Linux is a fantastic fix for those who want something different. The efficiency
    of the system, the variety of applications and stability are just a few good reasons.


    The first thing you need to know is that there is no such operating system called
    Linux. Linux is in fact the operating system kernel, the core component of OS.
    When talking about Linux what we are referring to one of the many distributions,
    distros, that use the Linux kernel. You''ve probably heard of at least one of
    them, like Ubuntu, SUSE, Debian, the list goes on. Each of these distros offers
    something different for the user. While each has the Linux kernel at its core,
    they provide the user with a different looking. Different distributions offer
    different ways in which to start and get more apps.


    Linux works differently to Windows or macOS. It''s free for a start to install
    on many computers as like, free for unlimited amount of time and free applications.
    This free to use is one of the biggest draws for developers. Alongside the free
    aspect comes a level of freedom to customise and modify the system to your own
    uses. Each of the available distros on the Internet have a ''spin'' to quickly
    download and get working in a matter of minutes. Linux is a great system on which
    to start.


    ## Why Linux?


    There are thousands of free packages available for programmers in some others
    need a security, a gaming, or something directed towards. This extensibility makes
    Linux a very appealing platform to use, as you could modify the system into development,
    including many different IDEs for the likes of Python, C++, and so on; or create
    a base for Minecraft server.


    Another remarkable advantage for those looking to learn how to code is that Linux
    has most of the coding languages built in. Both Python and C++ are preinstalled
    in a high percentage of distros, which means you can start to program as soon
    as you install the system. Generally Linux does not take up as many resources
    as Windows or macOS since it uses memory, hard drive space and CPU load. The Linux
    load can be seen lower than those resources. A more efficient system of course
    means more available resources for the coding and testing and the programs you
    eventually create. Use of resources also means you can use Linux on older hardware
    that normally struggle or even Each distro offers something unique to the user
    but have Linux at the core. throwing away an old computer.


