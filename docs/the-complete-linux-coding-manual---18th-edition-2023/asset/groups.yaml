    # Command Line Quick Reference


    ![](img/21ee864cf339a60c6b969b7bda291087_80_0.png)


    # USEFUL HELP/INFO COMMANDS


    The following commands are useful when you are trying to learn more about the
    system or program you are working with in Linux. You might not use them every
    day, but when you do, they will be invaluable.


    - free command displays the total amount of free and used physical and swap memory
    in the system. For example, free -m gives information using megabytes.


    - sed command opens a stream editor. A stream editor is used to perform transformations
    on an input stream: a file or input from a pipeline.


    - df displays filesystem disk space usage for all partitions. The command df -h
    is probably the most useful (the -h means human-readable).


    - adduser adds a new user to the system. Similarly, the addgroup command adds
    a new group to the system.


    - the top program provides a dynamic real-time view of a running system. It can
    display system information, as well as a list of processes.


    - the deluser command removes a user from the system. To remove the user''s files
    and home directory, you need to add the -remove option.


    - the uname command with the -a option provides all system information, including
    machine name, kernel version, and a few other details.


    - the delgroup command removes a group from the system. You cannot remove a group
    that is a primary group of users.


    - the ps allows you to view all the processes running on the machine. Every operating
    system''s version of ps is slightly different but all do the same thing.


    - the man command brings up the manual entry for a command, which is a great place
    to start when using it.


    - the grep command allows you to search inside number of files for a particular
    search pattern and print matching lines. An example would be: grep blah file


    - the man intro inside a command is especially useful. It displays the Introduction
    to User Commands, which is a well-written, fairly brief introduction to the Linux
    command.


