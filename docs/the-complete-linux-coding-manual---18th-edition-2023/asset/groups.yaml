    ### STEP 8

    Interestingly, Mint, among others offers the ability to chain commands together.
    In this example, we can use `apt-get update` and `sudo apt-get upgrade`. The double
    ampersand is considering the pending command wait. It''s better to start your
    session with the update and upgrade


    # # TERMINAL US MANAGER?


    Why use the terminal to upgrade and override the Update Manager, regardless of
    the distro you''re using? Some users get really useful using the terminal to update
    their Linux systems and accompanying apps, if it''s better. However, that''s not
    the case.


    Using the terminal, apt-get upgrade doesn''t handle dependencies between versions
    of packages, so if a package has its files changed from one to another, then the
    upgrade is held back.


    The Update Manager, or Software Manager (depending on the distro), phases its
    updates and marks those packages


    with changed dependencies for updating. However, this is why Linux can often get
    stuck, sometimes it doesn''t.


    It all down to the developer of the package which is installed and the way it
    is in the distro''s repository or instance, from the point of view of the user,
    if you update and upgrade using both the Terminal and the Update Manager regularly,
    then you will be up to date as possible, and get the essential and stable versions
    of the software. If you''re looking for cutting edge package updates, then it''s
    best to use a rolling release distro.


