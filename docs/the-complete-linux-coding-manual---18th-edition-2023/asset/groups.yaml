    \ A,1\n```\n\nLinux 与编程\n\n# C++ 注释\n\n在 C++ 中注释涉及使用双斜杠 `//` 或斜杠加星号 `/*`。你已经看到过简短的示例，但这是它的工作原理。\n\
    \n- 步骤1 使用 Hello World 为例，你可以使用双斜杠对代码的不同部分进行注释：\n\n```cpp\n// 我的第一个 C++ 程序\ncout\
    \ << \"Hello, world!\"\n\nhelloworld.cpp\n#include <iostream>\nusing namespace\
    \ std;\nint main() {\n    // 我的第一个 C++ 程序\n    cout << \"Hello, world!\"\n   \
    \ cout << \"And Greetings from C++!\"\n}\n```\n\n- 步骤4 注释时要小心，特别是块注释。很容易忘记添加结束的星号和斜杠，从而抵消注释块内的任何代码。\n\
    \n```cpp\nhelloworld.cpp\n#include <iostream>\nusing namespace std;\nint main()\
    \ {\n    // 第一个 C++ 程序\n    cout << \"Hello, world!\"; // 这行输出单词 'hello, world'\n\
    \    // 这个注释\n    注释行\n    而不需要添加更多斜杠\n}\nout << \"And Greetings from C++!\"\n\
    ```\n\n- 步骤2 然而，你也可以在行末尾添加注释，以更好地描述其内容：\n\n`cout << \"Hello, world!\"; // 这行输出单词\
    \ 'hello, world.' \\n 表示一个新行。`\n\n注意，你不要在注释末尾加分号。这是因为这是被编译器忽略的行。\n\n```cpp\nhelloworld.cpp\n\
    #include <iostream>\nusing namespace std;\nint main() {\n    // 我的第一个 C++ 程序\n\
    \    cout << \"Hello, world!\"; // 这行输出单词 'hello, world.' \\n 表示一个新行。\n    //\
    \ 这个注释\n    注释行\n    而不需要添加更多斜杠\n}\nout << \"And Greetings from C++!\"\n```\n\n\
    - 步骤5 显然，如果你尝试编译代码时报错，提示缺少大括号 `}` 仅仅几次，那么可能是时候回去纠正了。代码编辑器中的颜色有助于你识别注释所在。\n\n```cpp\n\
    helloworld.cpp\n#include <iostream>\nusing namespace std;\nint main() {\n// 我的第一个\
    \ C++ 程序\n    // 这个注释\n    注释行\n    而不需要添加更多斜杠\n}\nout << \"And Greetings from\
    \ C++!\"\n```\n\n- 步骤3 你可以使用斜杠加星号来注释掉几行：\n\n> // 这个注释\n> 覆盖几行\n> 而不需要添加更多斜杠 /*\n\
    \n只需记住用相反的星号和斜杠结束块即可。\n\n- 步骤6 对于块注释，在 C++ 中一个良好的习惯是在注释的每个新行都添加一个星号，以便在继续代码之前关闭块：\n\
    \n> // 这个注释\n> 覆盖几行\n> 而不需要添加更多斜杠 /*\n\n幸运的是，Geany 会自动执行此操作，但在使用其他 IDE 时要小心。\n\
    \n> / 这个注释可以\n> 覆盖几行\n> 而不需要添加更多斜杠 /*\n\n"
