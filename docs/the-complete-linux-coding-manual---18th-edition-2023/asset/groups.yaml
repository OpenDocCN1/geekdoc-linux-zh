    我们之前看到的备份脚本可以进一步修改以包含选择、关于备份文件复制位置的选择等。自动化任务是 Bash 脚本的主要优点之一，简单的脚本可以从很多方面帮助你。


    ## 简单自动化与实用脚本


    逐行输入命令来获取系统信息、查找文件或重命名批量文件？脚本是更好的答案。


    ### 步骤 1 让我们尝试创建一个脚本来显示 Mint 系统信息；这是必备的。创建一个名为 `sysinfo.sh` 的新脚本并进入 Nano 或文本编辑器。


    ```bash

    #!/bin/bash


    # 信息：

    echo "Hostname: $(hostname)"


    # 文件系统使用情况

    echo "Disk usage: $(df -h)"


    # 空闲和已内存

    echo "Memory: $(free -m)"


    # 运行时间和性能

    echo "Uptime: $(uptime)"


    # 当前登录用户

    echo "Users: $(who)"


    # 系统使用的前五个进程

