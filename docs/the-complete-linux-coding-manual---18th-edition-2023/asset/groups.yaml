    # 循环


    你可以使用 `FOR`、`WHILE` 和 `UNTIL` 语句对数据进行循环。当你需要批量命名、复制或运行需要计数器的脚本时，这些语句会非常有用。


    步骤 1 创建名为 `count.sh` 的新脚本。输入下方截图中的文本，保存并赋予可执行权限。这创建了一个变量 `count`，它在脚本开始时赋值为 0。然后是
    `WHILE` 循环，当 `count` 小于（`lt` 部分） 100 时，`echo` 命令将打印 `count` 的当前值。


    ```

    count.sh

    File Edit View Search Tools Documents Help

    count.sh

    #!/bin/bash

    count=0

    while [ $count -lt 100 ]; do

    echo $count

    let count=$((count+1))

    done

    ```


    步骤 2 执行 `count.sh` 脚本将在终端列出 0 到 99 的数字；当达到 100 时，脚本将结束。使用 `FOR` 语句修改脚本使其更容易以相同的方式使用。为了编写脚本，请将截图中的文本输入
    `count.sh` 中。


    步骤 3 我们在这里添加的内容是：`for count in {0..100}; do`。意味着：对于变量 `count` 在从零到一百的数字中，开始循环。脚本的其他部分相同。运行此脚本，输出应该出现在终端中。


    步骤 4 `UNTIL` 循环的工作方式与 `WHILE` 循环非常相似，通常是反向的。我们使用 `UNTIL` 计数到一百，直到：`[ $count -gt
    100 ]`；区别在于，`UNTIL` 在 `count` 大于（`gt` 部分）一百时继续循环。


    步骤 5 你并不局限于数字到一百。在循环内部，你可以设置任何喜欢的命令集，并根据所需的循环次数执行它们。例如，重命名文件、创建五个文件夹，此脚本将使用 `FOR`
    循环创建名为 1 到 100 的文件夹。


    ```

    count.sh

    File Edit View Search Tools Documents Help

    count.sh

    #!/bin/bash

    for count in {0..100}; do

    echo $count

    let count=$count+1

    done

    ```


    步骤 6 再次使用 `FOR` 语句，我们可以通过操作 (0-100) 部分来执行计数序列。这段代码集实际上意味着 开始-增量；如果没有增量，它只是从一个数字到结束。例如，我们使用循环每隔
    2 位数到 1000：`for count in {0..1000..2}; do`。


    ``` evencount.sh

    File Edit View Search Tools Documents Help

    count.sh

    #!/bin/bash

    for count in {0..100..2}; do

    echo $count

    let count=$count+1

    done

    ```


