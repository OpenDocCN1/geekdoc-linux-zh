    \ DEFS 0C, DEFS 0D, DEFS 0E, DEFS 0F, DEFS 10, DEFS 11, DEFS 12, DEFS 13, DEFS\
    \ 14, DEFS 15, DEFS 16, DEFS 17, DEFS 18, DEFS 19, DEFS 20, DEFS 21, DEFS 22,\
    \ DEFS 23, DEFS 24, DEFS 25, DEFS 26, DEFS 27, DEFS 28, DEFS 29, DEFS 30, DEFS\
    \ 31, DEFS 32, DEFS 33, DEFS 34, DEFS 35, DEFS 36, DEFS 37, DEFS 38, DEFS 39,\
    \ DEFS 40, DEFS 41, DEFS 42, DEFS 43, DEFS 44, DEFS 45, DEFS 46, DEFS 47, DEFS\
    \ 48, DEFS 49, DEFS 50, DEFS 51, DEFS 52, DEFS 53, DEFS 54, DEFS 55, DEFS 56,\
    \ DEFS 57, DEFS 58, DEFS 59, DEFS 60, DEFS 61, DEFS 62, DEFS 63, DEFS 64, DEFS\
    \ 65, DEFS 66, DEFS 67, DEFS 68, DEFS 69, DEFS 70, DEFS 71, DEFS 72, DEFS 73,\
    \ DEFS 74, DEFS 75, DEFS 76, DEFS 77, DEFS 78, DEFS 79\n```\n\n```\n; Attributes\
    \ for the last room\n(top third)\n```\n\n```\n; Attributes for title screen\n\
    (bottom two-thirds)\n```\n\n```\n8621:\nLD AX\nOR AX, (C)\nLD BX\nSUB #20\nSOH\n\
    AND AX\nJE #8=0\nLD A,1\n```\n\nLinux Coding & Programming\n\n# C++ COMMENTS\n\
    \nCommenting in C++ involves using a double forward slash '//' or a forward slash\
    \ and an asterisk '/*'. You've already seen brief examples but this is how it\
    \ works.\n\n- STEP 1 Using the Hello World as an example, you can easily comment\
    \ on different sections of the code using the double forward slash:\n\n```\n//\
    \ My first C++ program\ncout << \"Hello, world!\"\n\nhelloworld.cpp\n#include\
    \ <iostream>\nusing namespace std;\nint main() {\n    // My first C++ program\n\
    \    cout << \"Hello, world!\"\n    cout << \"And Greetings from C++!\"\n}\n```\n\
    \n- STEP 4 Be careful when commenting, especially with comments. it's very easy\
    \ to forget to add the closing asterisk and forward slash thus negate any code\
    \ that falls inside the comment block.\n\n```\nhelloworld.cpp\n#include <iostream>\n\
    using namespace std;\nint main() {\n    // First C++ program\n    cout << \"Hello,\
    \ world!\"; // This line outputs the words 'hello, world'\n    // This comment\n\
    \    comment lines\n    without the need to add more slashes\n}\nout << \"And\
    \ Greetings from C++!\"\n```\n\n- STEP 2 However you can also add comments to\
    \ the end of a line, to describe in a better way what goes:\n\ncout << \"Hello,\
    \ world!\"; // This line outputs the words 'hello, world.' The \\ denotes a new\
    \ line.\n\nNote, you do not put a semicolon at the end of a comment. This is because\
    \ it is a line that gets ignored by the compiler.\n\n```\nhelloworld.cpp\n#include\
    \ <iostream>\nusing namespace std;\nint main() {\n    // My first C++ program\n\
    \    cout << \"Hello, world!\"; // This line outputs the words 'hello, world.'\
    \ The \\n denotes a new line.\n    // This comment\n    comment lines\n    without\
    \ the need to add more slashes\n}\nout << \"And Greetings from C++!\"\n```\n\n\
    - STEP 5 Obviously if you want to try and build the code errors out, complaining\
    \ of a missing curly '}' just a few times, then it can be time to go back and\
    \ rectify. The colouring in code editor helps you identify where the comments\
    \ are.\n\n```\nhelloworld.cpp\n#include <iostream>\nusing namespace std;\nint\
    \ main() {\n// My first C++ program\n    // This comment\n    comment lines\n\
    \    without the need to add more slashes\n}\nout << \"And Greetings from C++!\"\
    \n```\n\n- STEP 3 You can comment out lines by using the forward slash and asterisk:\n\
    \n> // This comment\ncover several lines\nwithout the need to add more slashes\
    \ /*\n\nJust remember to finish the block with the opposite asterisk and forward\
    \ slash.\n\n- STEP 6 With block comments, it's good practice in C++ to add an\
    \ asterisk to each new line of the comment to close the block before continuing\
    \ with the code:\n\n> // This comment\ncover several lines\nwithout the need to\
    \ add more slashes /*\n\nThankfully, Geany does this automatically but beware\
    \ of it using other IDEs.\n\n> / This comment can\ncover several lines\nwithout\
    \ the need to add more slashes /*\n"
  mdcn: "\n\n# 使用注释\n\n虽然注释对于许多构成游戏、应用程序甚至整个操作系统的数行代码来说，可能看起来只是一个微不足道的元素，但事实上，它们可能是最重要的因素之一。\n\
    \n## 注释的重要性\n\n代码内部的注释基本上是人是可读的描述，详细说明了代码在特定位点正在做什么。它们听起来并不特别有趣，但没有注释的代码是行、段或单个元素中最令人沮丧的地方之一，除非你是一个专业人士或刚刚起步。\n\
    \n简而言之，所有代码都应该以这种方式注释，以有效地描述某行、某个部分或某个元素的目的。你应该养成尽可能多注释的习惯，这样完全不懂编程的人也可以通过通过阅读你的代码来理解它将要做什么。\n\
    \n在专业环境中，注释对代码的成功以及最终对公司或项目的成功至关重要。在一个组织中，许多程序员与工程师、其他开发人员、硬件分析师等合作工作。如果你是为公司编写软件的团队成员，那么当出现问题时，你的注释将帮助节省大量时间，另一个团队成员能够指出问题所在。\n\
    \n> 设你自己是某人的工作是找出程序中的错误。该程序有 800,000 行代码，分布在几个不同的模块中。你很快就会体会到原始程序员提供的良好注释是多么需要的帮助。\n\
    \n![](img/21ee864cf339a60c6b969b7bda291087_129_0.png)\n\n最好的注释总是简洁的，并在逻辑上连接代码，详细说明程序遇到某一行或某部分时发生了什么。你不需要对每一行进行注释。类似\
    \ `if x=0` 这样的内容不需要你注释如果 x 等于零则什么都不做；这对读者来说是显而易见的。如果 x 的值会对用户的程序产生巨大变化（例如越界），那么它确实需要注释。\n\
    \n如果代码是你的，当你打算将其分享给他人时，你应该编写注释。这样你就可以回到代码，理解你做了什么，或者哪里出了错了，或者哪些部分运行得非常出色。\n\n\
    注释是一种良好的习惯，一旦你学会了何时需要添加注释，你就会发现这成了你的本能。\n\n```\nDEFS 24h, 25h, 26h, 27h, 28h,\
    \ 29h, 30h, 31h, 32h, 33h, 34h, 35h, 36h, 37h, 38h, 39h, 40h, 41h, 42h, 43h, 44h,\
    \ 45h, 46h, 47h, 48h, 49h, 50h, 51h, 52h, 53h, 54h, 55h, 56h, 57h, 58h, 59h, 60h,\
    \ 61h, 62h, 63h, 64h, 65h, 66h, 67h, 68h, 69h, 70h, 71h, 72h, 73h, 74h, 75h, 76h,\
    \ 77h, 78h, 79h, 80h, 81h, 82h, 83h, 84h, 85h, 86h, 87h, 88h, 89h, 90h, 91h, 92h,\
    \ 93h, 94h, 95h, 96h, 97h, 98h, 99h\n```\n\n```\nTSSCC:\nDEFS 10h, 11h, 12h, 13h,\
    \ 14h, 15h, 16h, 17h, 18h, 19h, 20h, 21h, 22h, 23h, 24h, 25h, 26h, 27h, 28h, 29h,\
    \ 30h, 31h, 32h, 33h, 34h, 35h, 36h, 37h, 38h, 39h, 40h, 41h, 42h, 43h, 44h, 45h,\
    \ 46h, 47h, 48h, 49h, 50h, 51h, 52h, 53h, 54h, 55h, 56h, 57h, 58h, 59h, 60h, 61h,\
    \ 62h, 63h, 64h, 65h, 66h, 67h, 68h, 69h, 70h, 71h, 72h, 73h, 74h, 75h, 76h, 77h,\
    \ 78h, 79h,\n```\n\n```\n; save\nLD AX\nDEFS 00, DEFS 01, DEFS 02, DEFS 03, DEFS\
    \ 04, DEFS 05, DEFS 06, DEFS 07, DEFS 08, DEFS 09, DEFS 0A, DEFS 0B, DEFS 0C,\
    \ DEFS 0D, DEFS 0E, DEFS 0F, DEFS 10, DEFS 11, DEFS 12, DEFS 13, DEFS 14, DEFS\
