    \ OOP environment.\n\n# EVERYTHING\n\nDue to how complex the language can be,\
    \ and its power and performance, C++ is often used to develop games, device drivers\
    \ and even entire operating systems.\n\nDating back to 1979, the start of the\
    \ era of home computing, C++, or rather was the brainchild of Danish scientist\
    \ Bjarne Stroustrup whose plan was to improve the original C language, which was\
    \ widely used since the early seventies computing labs and by regular people who\
    \ didn’t have access to the mainframes and large computing data centres.\n\nC++\
    \ proved to be popular among the developers of the '80s, since it was a much easier\
    \ environment to get to grips with and more importantly, it was 99% compatible\
    \ with the original C language. This means it could be used by the mainstream\n\
    \nC++’s impact in the digital world is immense. Many of the programs, applications,\
    \ games and even operating systems are coded using C++. For example, all of Adobe’s\
    \ major applications, such as Photoshop, and so on, are developed in C++. You\
    \ will find that the browser you surf the internet is written in C++, as well\
    \ as Windows 10, Microsoft Office and the backbone to Google’s search engine.\
    \ Apple’s macOS is written largely in C++ (with some\n\n> C++ code is much faster\
