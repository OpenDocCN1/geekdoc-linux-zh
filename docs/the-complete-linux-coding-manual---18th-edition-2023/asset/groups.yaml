    # Ten Things to do After Installing Linux Mint


    Linux Mint is a polished distro out of the box, as with most Linux distros, there
    are some tweaks that can be applied to improve the way it works. Although these
    are Mint-specific tweaks, most can be applied to other distros.


    ## LINUX TWEAKS


    Some of these post-installation actions are highly recommended, while others are
    just handy additions and simply tweak the system or add a customization.


    - **STEP 1** The first, and most important, post-installation action is to update
    the system. Click on the icon in the Panel, found at the bottom right of the desktop
    next to the time and date. This launches the Update Manager.


    - **STEP 3** Click the OK button and you can see a couple of updates ready for
    installation. Before you update click on the blue OK button to switch to a Local
    Mirror. This opens the Software Sources option. In the Mirrors section, click
    on the Main and Base drop-down menus and select a server closest to your current
    location.


    ![](img/21ee864cf339a60c6b969b7bda291087_33_0.png)


    - **STEP 2** Linux Mint offers the user a three policy approach to updates: Don''t
    Break My Computer, Optimise Stability and Security and Always Update Everything.
    The recommended option is the Optimise Stability and Security, which only updates
    safety, essential patches that do not impact critical elements of the OS. Read
    the descriptions below choose the middle, and recommend.


    - **STEP 4** Click the Update Cache button and close the Software Sources window.
    Back in the Update Manager, click on Install Updates icon and enter your password.
    The updates automatically install themselves and relaunch Update Manager, this
    time with a lot more updates. Again, click Install, any messages and wait for
    them to finish.


    ![](img/21ee864cf339a60c6b969b7bda291087_33_1.png)


    - **STEP 5** The updates are graded by level, 1 being a low level update, level
    5 being a dangerous one. Stick to level 3 updates, or ask us; Click Reply for
    any matters regarding overwriting a configuration File. With regards to the Software
    Rendering issue and lack of drivers for non-VirtualBox users, click the Menu and
    type ''driver'' into the search box.


    - **STEP 8** When asked to accept the changes, enter Y and when asked to configure
    libvdi, make sure OK and press Enter, then Yes to any further questions. Next,
    still in the Terminal: cat /proc/sys/vm/swappiness, the result should be 0. If
    your computer has less than 4GB of RAM/memory, then enter: sudo xed /etc/sysctl.conf.


    ![](img/21ee864cf339a60c6b969b7bda291087_34_0.png)


    - **STEP 6** Click the Driver Manager app that appears as a result of the search
    and enter your password. Mint takes a moments to analyze what is available and
    presents you with a selection of drivers for your detected hardware. With those
    graphical, such as Software Rendering, should opt to use the latest, recommended
    Drivers.


    - **STEP 9** This tweak speeds up systems with less 4GB RAM/memory. Scroll to
    the bottom of the file you just opened and add the following lines:


    `# Decrease swap usage to a more reasonable level

    vm.swappiness=10`


    Click File Save, then File Quit. Reboot Linux Mint and you should notice a slight
    hike in performance.


    ![](img/21ee864cf339a60c6b969b7bda291087_34_1.png)


    ![](img/21ee864cf339a60c6b969b7bda291087_34_2.png)


    - **STEP 7** At this point you will need to restart Linux Mint, so do that now.
    After a reboot click the Menu button, followed by Terminal. The Terminal icon
    is found in the left-hand column. Open the Files icon, then enter: sudo apt-get
    install libvdi-pkg, press Enter and type in your password. This enables DVD playback.


    - **STEP 10** Security is always a concern in this digital age. Linux Mint is
    a secure system, it''s advisable to always try and improve it. Click the Menu
    button and search for Firewall; click the Firewall Configuration icon and enter
    your password. In the Firewall window, click the Status to On.


    ![](img/21ee864cf339a60c6b969b7bda291087_34_3.png)


    ![](img/21ee864cf339a60c6b969b7bda291087_34_4.png)


    # Apollo 11


    DID YOU KNOW...

    July 20th 1969 is remembered as a turning point in human history, when mankind
    first stepped on the moon. The software that helped the crew make pivotal voyage
    didn''t exist at the time and had to be developed from scratch. Using a new method
    of storing programs called Rope Memory, the engineers at MIT Instrumentation Laboratory
    populated the memory with a special version of assembly.


    Incredibly, code is freely available to view on GitHub. Uploaded by a researcher
    in 2003, you can view the code by visiting www.github.com/chrisgarry/Apollo-11/.
    Look out for code snippets, such as Burn, in particular with the comment "Goodbye.
    Come again soon. Have a look through, and see what else you can find.


    | VARIABLE | NAME | DESCRIPTION |

    | :--- | :--- | :--- |

    | PABILITY | PABILITY | SUBSCRIPTION TO ERSE COUNTER |

    | GAIN | GAIN | INCREMENTS ON WHEELS, ON JETS |

    | RATE | RATE | INCREMENTS ON BUFFERS |

    | TURN | TURN | TURNING COUNTER |

    | MASK | MASK | SET ON DESCENT STATUS |

    | FLAM | FLAM | YES, FOR-TOGGLE MODE |

    | EXIT | EXIT | EXIT CODE |

    | COUNTER | COUNTER | AUTO-MESSAGE_RETURN |

    | RUNNING | RUNNING | POSITIVE BOUNDLESS PURPOSES |

    | PABILITY | PABILITY | POSITIVE ON RESET |

    | FLT | FLT | POSITIVE HERMETIC |

    | TURN | TURN | TURNING |

    | SERGE | SERGE | SERVICE COUNTER |

    | SET | SET | SET |

    | TAGS | TAGS | TAGS |

    | BORN | BORN | BORN-BIT |

    | DATA | DATA | DATA-64 |

    | VALUE | VALUE | VALUE-2-MAX |


    Programmers aren''t without a sense of humour. See what else is there. One giant
    leap for mankind.


    ![](img/21ee864cf339a60c6b969b7bda291087_36_0.png)


    Credit: Apollo 11/NASA


    # Creating Users


    When you install Linux Mint it is configured for you with a single user. While
    sharing a account with the entire family is fine, there may come a time you need
    to create separate users with their own unique Folders. Having different users
    means each user has access to his her areas on the system. Documents, pictures,
    videos and so on are separate with multiple users on other operating systems.


    - **STEP 1** Click on the Linux Mint Menu and type ''users'' to begin searching
    for the relevant console. The Users and Groups console is basic looking, and easy
    to use. At first you can just see your own username when you installed Linux Mint.


    - **STEP 2** To add a new user, click the Add button at the bottom of the console.
    There are two types of user you can create, Standard and Administrator. Unless
    the user needs to install new apps or access points beyond their Home Folder,
    use the Standard account type.


    - **STEP 3** Enter the new user''s Name followed by the Username. Make sure the
    username is all in lower case a-z and 0-9. You can have full stops, underscores
    or hyphens if you wish. Click the Add button when you''re ready to continue.


    - **STEP 4** The new user appears in the list of current Linux Mint users in alphabetical
    order. At present, there is no password set so click the user in the list of current
    users, click No Password under the user''s username.


    ![](img/21ee864cf339a60c6b969b7bda291087_37_0.png)


    ![](img/21ee864cf339a60c6b969b7bda291087_37_1.png)


    ![](img/21ee864cf339a60c6b969b7bda291087_37_2.png)


    ![](img/21ee864cf339a60c6b969b7bda291087_37_3.png)


    - **STEP 5** You can now enter a password for the new user or click the curled
    arrow at the end of the New Password text box to generate a password for you,
    as well as displaying it. Naturally, it''s a good idea to come with a strong password
    for one. When you are done, click Change button.


    - **STEP 6** You can close the Users and Groups console, as the new user has been
    created. If you click the Mint Menu, followed by Logout, you are presented with
    the Mint Login Manager. The new user is present in the list of currently active
    users. Click on him/her to log them in.


    - **STEP 7** Once logged in the new user is required to set up their desktop environment,
    icons, Menu and so on. Depending on what Account Type you set up for Standard
    or Administrator, they won''t be able to install any new software. This screenshot
    is from a Standard user type.


    ![](img/21ee864cf339a60c6b969b7bda291087_38_0.png)


    ```bash

    david-Mint: $ sudo apt-get install flatpak

    ```


    - **STEP 8** You can create as many new accounts as you need and will be able
    to switch between them when required. It''s best to have just one account that''s
    capable of installing new software, that way you can track of what''s on your
    system.


    ![](img/21ee864cf339a60c6b969b7bda291087_38_1.png)


    ![](img/21ee864cf339a60c6b969b7bda291087_38_2.png)


    # COMMAND LINE ACCOUNTS


    As just you''d expect, you also create a new user within the command line. Open
    a Terminal session under the main (users) Administrator account.


    - **STEP 1** The process for adding a new user from the command line is relatively
    simple. With `sudo adduser <username>`, where `<username>` is the new user''s
    login name. You''ll be asked to create a password for the user, along with their
    full name and other details. Click to confirm the details and create the user
    account.


    - **STEP 2** You can check the details and account type for the new user from
    within the Users and Groups. If you want to delete a user from Mint, you enter
    `sudo deluser <username>` in the Terminal or delete user in Groups.


    ```

    $ sudo adduser david

    Adding user `david` (New group: `david`)

    Adding new user `david` (UID 1001) from group `david`

    Creating home directory ''/home/david''...

    New user created.

    Password for david: ****

    Password updated successfully

    ype new password: ****

    Full Name []: David Smith

    Room Number \|_{

    Work Phone \|_{

    Home Phone \|_{

    Other \|_{

    Is correct? Y

    ```

