    # LOOPING


    You can loop over data using the FOR, WHILE and UNTIL statements. These can be
    handy if you''re batch naming, copying or running a script where a counter is
    needed.


    STEP 1 Create a new script called count.sh. Enter the text in the screenshot below,
    save and make it executable. This creates the variable ''count'' which at the
    beginning of script equals zero. Then the WHILE loop, which WHILE is less than
    (the LT part) 100 will print the current value of count in the echo command.


    ```

    count.sh

    File Edit View Search Tools Documents Help

    count.sh

    #!/bin/bash

    count=0

    while [ $count -lt 100 ]; do

    echo $count

    let count=$((count+1))

    done

    ```


    STEP 2 Executing the count.sh script will result in numbers 0 to 99 listing down
    the Terminal; or it reaches 100 the script will end. Modifying the script with
    the FOR statement makes it easier to use the same way. In order to script, enter
    the text from the screenshot into count.sh.


    STEP 3 The addition we have here is: for count in {0..100}; do. Means: FOR the
    variable ''count'' IN the numbers from zero to one hundred, then start the loop.
    The rest of the script is the same. Run this script, and the output should appear
    in the Terminal.


    STEP 4 The UNTIL loop works much the same way as the WHILE loop, more often than
    not, in reverse. Our counting to a hundred, using UNTIL, will be until: [ $count
    -gt 100 ]; The difference being, UNTIL is count greater than (the gt part) one
    hundred, kept on looping.


    STEP 5 You''re not limited to numbers to one hundred. You, within the loop, have
    whatever set of commands you like and execute them as many times as you want to
    loop to run. Renaming files, creating fifty folders for example, this script will
    create folders named 1 to 100 using the FOR loop.


    ```

    count.sh

    File Edit View Search Tools Documents Help

    count.sh

    #!/bin/bash

    for count in {0..100}; do

    echo $count

    let count=$count+1

    done

    ```


    STEP 6 Using the FOR statement once more, we can execute the counting sequence
    by manipulating the (0-100) part. The set of code actually means START-INCREMENT;
    if there''s no increment it''s just a single digit to the END. For example, we
    use the Loops to count up to 1000 two''s: for count in {0..1000..2}; do.


    ``` evencount.sh

    File Edit View Search Tools Documents Help

    count.sh

    #!/bin/bash

    for count in {0..100..2}; do

    echo $count

    let count=$count+1

    done

    ```


