    # The Best Linux Distributions


    There are lots of versions of Linux available, known as Distributions. Each has
    a different ethos and approach. Here are five great distributions to try and where
    you can get them.


    ## GOING LINUX


    The installation process for most distributions is similar. You download a disk
    image from the website and burn it to an optical disk or create a USB Flash Drive
    installer. Just be careful to get the right distribution for your hardware and
    read the instructions carefully.


    ## LINUX MINT


    By far the most popular Linux distro (distribution) is Linux Mint. Mint began
    life back in 2006, as an alternative to the most popular, Ubuntu. Although based
    on Ubuntu''s Long Term Support, Linux Mint took a different direction and offered
    the user a better overall experience.


    Linux Mint has three main desktop versions available with each version of the
    OS it releases. This may sound confusing at first but it''s quite simple. Currently,
    Linux Mint uses the Cinnamon Desktop Environment as its flagship model, but also
    offers more modern alternatives.


    Cinnamon is a graphically rich desktop environment, MATE uses fewer resources,
    and is more stable on a wider variety of desktop systems, and Xff is an extremely
    streamlined desktop environment that''s built for speed and ultimate stability.


    Throughout this little we''ll be using the Cinnamon environment; however, you
    can try any of the other desktop environments as you wish. In fact, I recommend
    that you spend some time trying different environments, even different distributions,
    to see which suits you and your computer best.


    ```

    www.linuxmint.com

    ```


    ![](img/21ee864cf339a60c6b969b7bda291087_9_0.png)


    ## UBUNTU


    ![](img/21ee864cf339a60c6b969b7bda291087_9_1.png)


    That Ubuntu has since made amends and is slowly crawling its way back up the Linux
    leaderboard. The latest versions of the OS use the GNOME 3 desktop environment,
    an impressive improvement, although it can be a little confusing for Windows users
    and is a little heavy on system resources, especially if you''re planning installing
    it on an older computer.


    Ubuntu, for all its faults, is a good Linux distro to start experimenting with.
    It''s a clean interface, easy to use and offers the users a complete Linux experience.


    www.ubuntu.com


    ## ARCH


    Arch is one of longest running Linux distributions and forms the basis of many
    other versions of Linux. Why install Mint or Ubuntu when you can install Arch?
    Many users do exactly that is not ideal for beginners. Ubuntu and Mint both offer
    an easier installation path and come with software packages to get started.


    ![](img/21ee864cf339a60c6b969b7bda291087_10_0.png)


    Arch on the other hand, is a more ''bare bones'' affair. Arch is committed to
    free software and its repositories contain over 50,000 apps to install, including
    multiple different Desktop environments, and as you would use with any distro.


    Arch is a distro for when you''re more experienced with Linux. You start with
    nothing but the command line and there you have to manually partition your hard
    drive, set up the OS and finally install a desktop environment with all the apps
    you want.


    The advantage though, for all this hard work, is a distro that you have created.
    This works with all the necessary files and apps that you have preinstalled; it''s
    custom made for you.


    www.archlinux.org


    ## RASPBERRY PI DESKTOP


    No doubt, you''ve heard of the Raspberry Pi. It''s not hard to have, as this remarkable,
    tiny computer has the technology by storm for the last six years since it was
    introduced.


    ![](img/21ee864cf339a60c6b969b7bda291087_10_1.png)


    There are several aspects to the Raspberry Pi that make it such a sought after
    piece of the computing world. For it''s cheap, around £25 for what is essentially
    a fully working computer; it''s small, much bigger than a credit card you can
    build electronics with using a fully programmable interface; and it comes with
    Raspberry, its own custom-made, Debian-based operating system that includes an
    office suite alongside many different programming languages and educational resources.


    Raspian is exclusive to the Pi, since the Raspberry Pi uses an ARM processor to
    power it. However, the Raspberry Pi has since released a PC version of Raspian.


    Just like Pierre, Raspberry Pi Desktop comes with all the coding, and other apps
    you will need. It''s quick, stable and works superbly. If you''re interested in
    stretching your Linux experience, then this is certainly one of the top distros.


    Most Linux distributions falls into two categories. There are ones with the latest
    features like Ubuntu and Mint with those new features but back solid reliability,
    Debian.


    Meanwhile, openSUSE adapts to cover both bases. openSUSE is the rock solid system,
    developed by a community along with SUSE users, who develop an enterprise-level
    operating system; SUSE powers the London Stock Exchange among others. It is designed
    for mission critical environments where ''there''s no scope for instability''.
    If you find all that suitable, openSUSE Tumble release with all the latest features,
    and the occasional crash.


    openSUSE is a highly respected Linux distribution and many of its core contributors
    work on the Linux Kernel, LibreOffice, Gnome and other Linux areas. In short,
    openSUSE is what you''ll find pros hanging out.


    www.raspberry.org/downloads/raspberry-pi


    ![](img/21ee864cf339a60c6b969b7bda291087_10_2.png)


    www.openSUSE.org


    ## Equipment You Will Need


    The system requirements for successfully installing Mint on a PC are surprisingly
    low, even a computer that''s several years old will happily run this.


    ## MINT INGREENTS


    Before we start working on, here''s what you need. You have several choices available,
    so take your time.


    ## SYSTEM REQUIREMENTS


    - CPU: 700MHz

    - RAM/Memory: 512MB

    - Hard drive: 9GB (20GB recommended)

    - Display: 1024 x 768


    Obviously the better the system you have, the better the will be.


    ![](img/21ee864cf339a60c6b969b7bda291087_11_0.png)


    ## USB INSTALLATION


    You can install Linux Mint onto your computer via USB or DVD. We look into each
    a later but if you''re already familiar with the process, then you''re going to
    need a minimum 4GB USB drive to store the Linux ISO.


    ![](img/21ee864cf339a60c6b969b7bda291087_11_1.png)


    ## DVD INSTALLATION


    DVD installation of Linux Mint simply requires a blank DVD-R disc. Of course,
    you also need an optical drive (a DVD Writer) before you''re able to transfer
    or burn the ISO to the disc.


    ![](img/21ee864cf339a60c6b969b7bda291087_11_2.png)


    ## VIRTUAL ENVIRONMENT


    Installation to a virtual environment is a favourite method of testing and using
    distros. Linux Mint works exceedingly well when used in a virtual environment
    but more later. There are many virtual environment apps available; however, VirtualBox,
    from Oracle, is one of the easiest to. You can find the latest version at www.virtualbox.org.


    ![](img/21ee864cf339a60c6b969b7bda291087_12_0.png)


    ## INTERNET CONNECTION


    It goes without saying really, that an Internet connection is vital for making
    sure that Linux Mint is up to date with the latest updates and patches, as well
    as the installation of further software. Although you don''t need an Internet
    connection to use Linux Mint, you''ll miss out on a world of free software available
    for the distro.


    ## MAC HARDWARE


    Although Linux Mint can be installed onto a Mac, there''s a school of thought
    that recommends Mac users use a virtual environment, such as VirtualBox or Parallels;
    and why not-macOS is already a splendid operating system. If you''re wanting to
    breathe new life into an older Mac, make sure it''s an Intel CPU model and not
    the Intel PC models. Beyond though, it''s not as pain free as installing on a
    PC.


    ![](img/21ee864cf339a60c6b969b7bda291087_12_1.png)


    ![](img/21ee864cf339a60c6b969b7bda291087_12_2.png)

