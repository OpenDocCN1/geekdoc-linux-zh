    the backbone you''re able to start learning how to code in a multitude of different
    programming languages like Python, C++, and Debian-based tools.


    There''s Windows 10 IoT Core, Raspberry Pi OS, Pi OS, and NanoPi—so that once
    you''ve finished experimenting with Linux, you just just as well with a desktop
    version of Linux, you can go to another on the Raspberry Pi and see how those
    work, and whether it will work for you.


