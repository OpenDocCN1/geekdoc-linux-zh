    # Linux Tips and Tricks


    As you''ve seen, the Linux Terminal is quite an exceptional environment. With
    a few extra apps installed, and a smidgen of command knowledge, incredible, and
    often strange, things can be accomplished.


    ## TAKING COMMAND


    There are countless Linux tips, secrets, hacks and tricks out there. Some are
    very old, originating from Linux''s heritage, while others are recent additions
    to Linux. Here are our favourite tips and tricks,


    ### EASTER EGGS

    Emacs, the text editor, is a great piece of software, however, did you know it
    also contains a hidden Easter Egg? With Emacs `sudo apt-get install emacs25`,
    drop to a Terminal session and enter:

    `emacs -l1 dunnet`

    Dunnet is a text adventure by Ron Schnell in 1982, and hidden in Emacs since 1994.


    ## TERMINAL BROWSING

    Ever fancied able to browse the Internet through the Terminal? Not particularly
    useful, it is a fascinating thing to behold. To do so, enter:

    `sudo apt-get install elinks`

    enter the website you want to visit.


    ![](img/21ee864cf339a60c6b969b7bda291087_63_0.png)


    ### MOON BUGGY

    Based on the classic 1982 arcade game, Moon Patrol, Moon Bug appeared on the home
    computers of 1985 amid much praise. It''s a cracking Atari game, and is available
    in the Linux Terminal by entering:

    `sudo apt-get install moon-bug`

    Then:

    `moon-bug`

    Enjoy.


    ## LET IT SNOW

    Snowing in the Terminal console could come across every day. If you''re interested,
    however, enter:

    `wget https://gist.githubusercontent.com/somtek/1508483/raw/7d02716a57e69fb52632fee09f422753614ca2/snowjob.sh`

    `chmod +x snowjob.sh`

    `./snowjob.sh`


    ![](img/21ee864cf339a60c6b969b7bda291087_63_1.png)


    # Linux Tips and Tricks


    ### MEMORY HOGS

    If you need to see what apps are, there''s chance of consuming the most memory
    on Linux, simply enter:

    `ps aux --sort -rn`

    This sorts the output by system memory.


    ### BBS

    Back in the days of dial-up connections, the entire world was made up of Bulletin
    Board Systems. These remote servers hung out for users to chat, swap code, play
    games. Using Telnet, we can still connect to some active BBS:

    `telnet allbbs.org`

    There are countless BBS available, you can check https://www.telnetbbs.com/bbs/detail/
    for more.


    ![](img/21ee864cf339a60c6b969b7bda291087_64_0.png)


    ### SHRED

    If you want to create chance of someone with the right software retrieve it. However,
    to securely and permanently delete a file, use:

    `shred -u NAMEFILE.txt`

    Replace NAMEFILE with the name of the file to delete.


    ### DIRECTORY TREE

    If you want to create an entire single command (or directory tree) you can use:

    `mkdir -p New-Dir/{subfolder1,subfolder2,subfolder3,subfolder4}`

    This creates a New-Dir with four folders.


    ![](img/21ee864cf339a60c6b969b7bda291087_64_2.png)


    ### FORGOTTEN COMMANDS

    It''s not easy trying to remember all the Linux commands. Frankly, we can use
    to help us by using this description be quite striking when applied to some images.
    However, it''s difficult to get just right. You can create some great ASCII from
    the images you have by using:

    `img2txt NAMEEOF`

    Replace NAMEEOF with the actual name of the image file on your system. installed,
    use:

    `sudo apt-get install caca-utils`


    ![](img/21ee864cf339a60c6b969b7bda291087_64_3.png)


    ### ASCII

    `img2txt NAMEEOF`


