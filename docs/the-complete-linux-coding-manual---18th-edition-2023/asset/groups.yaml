    # 完整 Linux 编程手册


    Linux 无处不在。它作为 Web 服务器背后的主操作系统驱动着互联网，驱动航天器，是世界上最快超级计算机的操作系统，并被用于智能电视和移动设备。为什么？因为它极其稳定、运行速度极快，且完全免费。


    然而，Linux 的意义远仅仅是一个免费使用的操作系统。它独特的配置允许用户将操作系统定制化和个性化为他们希望的任何形式。Linux 用户可以在一天之内更改操作系统的外观和体验，安装成千上万个免费提供的应用程序和程序，并重新获得对电脑的控制权。


    Linux 关乎自由。远离其他限制性操作系统的“围墙花园”模式，自由地在计算机上选择你想要的内容，自由地修改并按你的意愿使用。它是由志同道合的用户组成的全球性社区，他们都致力于从这个不可信的操作系统中获得最佳开发体验。


    通过这本书，你可以成为 Linux 用户开放社区的一部分。这些页面中的教程将帮助你熟悉 Linux，向你展示它的原理、你可以用它做什么以及你如何通过编写代码将你的
    Linux 体验提升到新的高度。发现 Linux，发现自由。


