    ```


    STEP 4 Finally, to tidy up all the unused packages in the system, and remove them
    that the autoremove command deleted, you enter: sudo apt-get autoclean. The last
    few steps are for keeping your Mint set up nicely and turning off any unnecessary
    installations and upgrades


    ```

