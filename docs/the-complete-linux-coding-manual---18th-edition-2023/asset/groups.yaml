    ## Desktop Environments


    Linux Mint comes in several different versions, or flavours: Cinnamon, MATE and
    Xfce; there are 32-bit and 64-bit versions of these too. What does it all mean
    though and which version should you choose?


    ## Which Mint?


    A Desktop Environment is the graphical interface which you use to interact with
    the core system. Just as the graphical desktop for Windows 10 is also called Fluent
    Design, Linux Mint offers the user a choice of versions of the distro: Cinnamon,
    MATE and Xfce. While that may sound a little confusing for the newcomer, each
    of the versions contains the same core Linux structure and kernel, the kernel
    is the core of the operating system that handles all instructions between software
    and hardware.


    Why bother then with a different desktop environment? Simply put, it''s down to
    personal taste. Some users prefer MATE; MATE is a Fork of the classic GNOME 2
    and a little more menu-centric and is a more modern environment that works better
    on older hardware and features some cutting-edge desktop environments. Xfce, on
    the other hand, is a lightweight desktop environment that works well on older
    hardware due to its extremely low use of available resources.


    Each version is a slightly different desktop environment, the Graphical User Interface
    (GUI) that you use to interact with the operating system. Each of the environments
    uses different apps to access or use the system, as the file manager to browse
    the operating system or the way it launches other apps. Again, though, the core
    productivity and graphic suites are the same and function in the same way.


    In short, Cinnamon is the flagship desktop environment for Linux Mint. MATE is
    more compatible with a wider variety of hardware. Where Windows, for example,
    only offers one desktop environment to work in, Linux Mint offers many. Linux
    Mint has opted to bring the user a wealth of choice.


    img/21ee864cf339a60c696b7da13_0


    ### A Dash of Cinnamon


    Cinnamon has many benefits beyond its look and feel, although these are important
    factors. Here we outline a couple of features to help you decide if it''s the
    DE for you.


    ### Feature 1


    It performs excellently on modern systems but is a lot more stable than it used
    to be, and not quite the resource hog it once was. Therefore, don''t be put off
    Cinnamon if you''re using an older computer to install Linux Mint.


    ### Feature 2


    Cinnamon has configurable Hot Corners, where each corner of the desktop can be
    clicked to perform a certain task, such as displaying Workspaces, showing all
    or running a Command. The Hot Corners allow you to switch between different views
    and help make the desktop more efficient.


    img/21ee864cf339a60c696b7da14_0


    ### Best MATE


    MATE is a simple and intuitive DE that''s fast and stable. In comparison to Cinnamon
    it looks a little antiquated but that''s only on the surface. There''s plenty
    to like with MATE.


    ### Feature 1


    MATE is an excellent desktop environment for older computers. It works better
    with a larger number of hardware components than Cinnamon generally does but is
    just as capable of delivering a great-looking desktop as well as customisations.


    img/21ee864cf339a60c696b7da14_1


    ### Feature 2


    Due to being highly configurable, MATE can be customised to a fine degree. There
    are plenty of options available to the user who demands their desktop environment,
    including Compiz Settings, where you''re able to configure all manner of desktop
    effects, even cubes.


    ### Cholesterol Free Desktop


    Xfce started life as the Common Desktop Environment (CDE) in 1996. Since then
    it changed a few times and is now simply Xfce, with the nickname ''Cholesterol
    Free Desktop''.


    ### Feature 1


    Xfce really is a quick desktop and brings out the best in Linux as a fast operating
    system. In fact, it takes us to this point from the top of the page to install
    it onto a new computer; a few hundred words later and are using a new OS. Not
    bad.


    ### Feature 2


    Since it''s quick and lightweight does not mean Linux Mint Xfce isn''t a complete
    desktop system. Just like the other environments we offer, you can get the latest
    Firefox, LibreOffice, Gimp, chat apps and even a torrent client.


    img/21ee864cf339a60c696b7da14_2


    ## Which Distro?


    Up to now we''ve looked mainly at Linux Mint but there are other Linux distributions
    out there to try. In there are thousands of Linux distros to download and install,
    so which one should you decide to use?


    ## Distro Hopping


    Distro Hopping is a term used by the community for people who never stick to one
    distribution, instead they hop from one to the other and back again, testing each
    one, using them moving from one to another or a newly released distro.


    There''s nothing wrong with distro hopping, as it''s a good way to get grips with
    what''s out there another that may not appeal to your tastes. The problem is which
    one should you use today?


    For example, Linux Mint is an ideal starting place. It''s an easy to install and
    use distro, has all the software you would normally use on a day-to-day basis
    already installed out-of-the-box and gently eases you into the unique world of
    Linux and how it works and performs.


    Ubuntu offers much the same experience but does this in a slightly different way.
    There''s generally less experience with Ubuntu than with Linux Mint. Another point
    worth considering is the sheer volume of content and help indicated by Ubuntu
    users when you get stuck, you''re never too far from a solution.


    Moving on, as you begin to grow more comfortable with Linux, you will find there
    are many other distros to choose like openSE, Fedora, or Debian. These are all
    excellent distros and offer the user a different perspective on how the systems
    run. Some are more demanding than others, but each has their own value to offer.


    You might find moving to a particular distro as it differs greatly from the one
    you like. Tails, for example, is a distro that''s designed for anonymity. It contains
    complex and many different encryption tools as well as browsers to help you browse
    the web without being detected, tracked or monitored. Kali Linux is designed for
    security professionals and contains many different kinds of ethical hacking.


    While distro hopping is a good thing, it''s not a stable way to enjoy Linux Mint
    and get the most from it. We''re not saying you stick to one and never look elsewhere,
    as you would be missing a lot of content out there, but we recommend you find
    a distro you like first.


