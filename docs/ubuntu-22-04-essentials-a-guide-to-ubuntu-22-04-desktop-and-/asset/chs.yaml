  \n[content]\n### 3.4.3 Windows/macOS\n\nWindows 和 macOS 上有多种免费工具可以将 ISO 镜像写入 USB\
  \ 驱动器，但一种专门为写入 Linux 镜像编写的工具是 Fedora Media Writer，可以从以下 URL 下载：\n\n`https://getfedora.org/en/workstation/download/`\n\
  \n安装后，插入目标 USB 驱动器，启动写入工具，并如图 3-1 所示选择“Select .iso file”选项。\n\n点击“Next”进入写入选项界面，在点击“Select...”按钮之前选择\
  \ USB 驱动器。\n\n在出现的文件选择对话框中，导航并选择 Ubuntu 安装 ISO 镜像，然后点击“Open”按钮。最后，点击“Write”按钮开始将镜像写入\
  \ USB 驱动器。\n\n写入完成后，设备已就绪。\n\n\n\n\n将 Ubuntu 安装介质插入相应的驱动器并启动系统。如果系统尝试从硬盘启动，您将需要进入计算机的\
  \ BIOS 设置，并更改启动顺序，使其首先从安装介质驱动器启动。在初始启动序列完成后，将显示图 3-4 所示的 GRUB 菜单：\n\n![](img/ubuntu_grub_screen.jpg)\n\
  \n图 3-4\n\n使用方向键选择 `Try or Install Ubuntu` 菜单选项，然后按 `Enter` 键进入 Ubuntu Live 会话。在\
  \ Ubuntu 完全启动后，屏幕将显示下方图 3-5 所示的界面：\n\n![](img/ubuntu_live_session.jpg)\n\n图 3-5\n\
  \n提供了试用 Ubuntu Live 会话或开始安装过程的选项。如果您在尝试启动或安装 Ubuntu 时遇到黑屏，请重启系统并尝试使用安全图形选项重试。如果您尚未准备好安装\
  \ Ubuntu，请点击 `Try Ubuntu` 按钮在不对任何已安装硬盘进行更改的情况下安全地探索操作系统。\n\n### 3.6 安装 Ubuntu\n\n\
  在安装对话框中，选择开始 Ubuntu 安装的选项并等待安装程序的初始界面出现。在点击 `Continue` 按钮继续到下一个屏幕之前，请选择您偏好的语言：\n\
  \n![](img/ubuntu_install_keyboard_layout.jpg)\n\n图 3-6\n\n选择您的键盘布局，或者如果您不确定，请点击\
  \ `Detect Keyboard Layout` 按钮通过一些步骤识别您的键盘，然后点击 `Continue`。在下一个屏幕上，选择执行 `Normal`（常规）还是\
  \ `Minimal`（最小）安装：\n\n![](img/ubuntu_install_updates_and_software.jpg)\n\n图 3-7\n\
  \n如果您有充足的磁盘空间并希望探索 Ubuntu 包含的主要应用程序和实用程序，而无需以后手动安装，请选择 `Normal` 选项。或者，为了避免使用您可能永远需要的软件弄乱系统，请选择\
  \ `Minimal` 选项。无论在此做出什么选择，如果需要，Ubuntu 提供的所有软件在未来的任何时候都可以轻松地安装或删除。\n\n安装过程中还提供了更新组成\
  \ Ubuntu 发行版的软件包的选项。与大多数活跃支持的操作系统一样，Ubuntu 在向公众发布后仍会继续通过错误修复和安全补丁进行更新。如果选择此选项且系统连接到互联网，安装程序将下载自\
  \ Ubuntu 安装镜像发布以来发布的所有更新，并在安装期间将其应用到系统。如果您选择在安装过程中不执行此更新，这些更新仍可能在安装完成后的任何时间应用。\n\
  \n第二个选项提供了是否安装第三方非开源软件的供选择，以支持特定的硬件设备和在系统上播放专有媒体文件。某些用户强烈反对使用任何未在公共许可协议下发布的软件。如果您是这些人中的一员，请不要选择此选项。相反，如果您只想从\
  \ Ubuntu 安装中获得最佳体验，则建议选择此选项。\n\n做出适当选择后，点击 `Continue` 按钮进入磁盘分配屏幕：\n\n![](img/ubuntu_installation_type.jpg)\n\
  \n图 3-8\n\n假设这是一个没有不存在现有操作系统的新磁盘，安装程序将提供擦除整个磁盘并将其用于 Ubuntu 的选项（在这种情况下，安装程序将计算并实施典型且推荐的分区布局）。或者，若要定义您自己的自定义磁盘布局，请选择\
  \ `Something else` 选项，以手动创建并调整包含操作系统和数据的磁盘分区的大小。\n\n点击 `Advanced Features` 按钮将提供使用逻辑卷管理\
  \ (`LVM`) 的选项。强烈建议使用 `LVM` 以使系统上磁盘和分区的管理更加容易，该主题在 Adding a New Disk to an Ubuntu\
  \ 22.04 Volume Group and Logical Volume”章节中进行了详细介绍：\n\n![](img/ubuntu_install_advnaced_features.jpg)\n\
  \n图 3-9\n\n如果存储在磁盘上的数据安全性至关重要，请选择加密 Ubuntu 安装的选项。如果选择了此选项，下一个屏幕将提示您选择一个安全密钥，之后每次系统启动时都需要输入该密钥。\n\
  \n还提供了使用 `ZFS` 文件系统的选项。`ZFS` 是一种先进的文件系统，内置了逻辑卷管理的许多功能，以及一系列其他功能，例如拍摄磁盘快照和阴影（写时复制）的能力。还提供了加密\
  \ Ubuntu 存储数据的选项。在本例中，选择使用 `LVM` 选项并点击 `OK`。\n\n一旦做出选择，点击 `Install Now` 按钮开始安装过程，此时系统将寻求确认是否对磁盘驱动器进行更改：\n\
  \n![](img/ubuntu_install_write_changes.jpg)\n\n图 3-10\n\n点击 `Continue` 按钮开始安装。在安装过程中，安装程序将询问有关您的地理位置的信息以便配置时区设置：\n\
  \n![](img/ubuntu_install_geo_location.jpg)\n\n图 3-11\n\n接下来，安装程序将要求您为系统上的第一个账户提供用户名和密码：\n\
  \n![](img/ubuntu_install_who_are_you.jpg)\n\n图 3-12\n\n还提供了选项规定用户想要登录系统时是否必须指定密码。默认情况下，每次\
  \ Ubuntu 启动时都会显示需要用户名和密码的屏幕。如果您是系统的唯一用户并希望每次启动系统时自动登录，请在继续之前勾选 `Log in automatically`\
  \ 复选框。\n\n一旦回答了所有问题，安装程序将继续安装。根据系统速度以及您是否在安装期间选择下载更新，此过程可能需要一些时间。要查看安装程序执行执行的的详细视图，请点击进度条上方的标题：\n\
  \n![](img/ubuntu_install_copying_files.jpg)\n\n图 3-13\n\n安装完成后，将出现对话框通知您系统已好重启：\n\
  \n![](img/ubuntu_installation_complete.jpg)\n\n图 3-14\n\n当您准备好重启时，按 `Restart Now`\
  \ 按钮。安装程序可能会提示删除安装介质，系统将需要一些时间关机。此时，取出 USB 闪输并按 `Enter` 键继续。\n\n### 3.7  Ubuntu\
  \ 桌面\n\n系统启动后，如果启用了密码选项，将显示 GNOME 显示管理器 (`GDM`) 登录屏幕图 3-15。要访问系统，选择用户名并输入安装期间指定的密码：\n\
  \n![](img/ubuntu_login_screen.jpg)\n\n图 3-15\n\n或者，如果安装配置为直接登录桌面，在系统重启后将显示 GNOME\
  \ 桌面图 3-16：\n\n![](img/ubuntu_desktop.jpg)\n\n图 3-16\n\n### 3.8 安装更新\n\n\n\n\n\n\
  与今天的大多数操作系统一样，Ubuntu 发行版的每个特定版本在发布后仍在持续演进。这通常以错误修复和安全更新的形式出现，偶尔还可以通过互联网下载并安装到系统中的新功能。\n\
  \n最佳实践规定，安装 Ubuntu 后的第一步是确保将任何可用更新应用到系统。当可用更新时，`Software Updater`（软件更新器）将显示以下对话框，从中可以安装更新：\n\
  \n![](img/ubuntu_software_updater.jpg)\n\n图 3-17\n\n也可以通过终端（Terminal）窗口中的命令行提示符使用\
  \ `apt` 软件包管理器安装更新。要检查是否有可用更新，右键点击桌面背景，并在弹出的菜单中选择 `Open in Terminal`（在终端打开）选项：\n\
  \n![](img/ubuntu_desktop_menu.jpg)\n\n图 3-18\n\n在终端窗口中，运行以下命令以获取 root 权限并更新包列表：\n\
  \n```bash\n$ sudo su -\n# apt update\n```\n\n如果有可更新的包，该命令将显示类似下面的输出：\n\n```\n.\n\
  .\n.\n\nReading package lists... Done\nBuilding dependency tree\nReading state information...\
  \ Done\n220 packages can be upgraded. Run 'apt list --upgradable' to see them.\n\
  ```\n\n任何待处理的更新可以使用 `apt` 工具应用：\n\n```bash\n# apt upgrade\n```\n\n执行后，`apt` 工具将提供一个可用更新的包列表，并提示权限以执行更新：\n\
  \n```\n220 upgraded, 7 newly installed, 0 to remove and 0 not upgraded.\nNeed to\
  \ get 75.2 MB/286 MB of archives.\nAfter this operation, 34.8 MB of additional disk\
  \ space will be used.\nDo you want to continue? [Y/n]\n```\n\n一旦升级完成，安装基本上就此结束了。\n\
  \n### 3.9 显示启动消息\n\n在启动过程中，系统将显示 Ubuntu 启动界面，该界面会隐藏系统在加载时生成的所有启动消息。若要在启动过程中使这些消息可见（如\
  \ 图 3-19 所示），只需在系统启动时按下键盘上的 `Esc` 键即可：\n\n![](img/ubuntu_boot_messages.jpg)\n\n\
  图 3-19\n\n可以更改默认行为，通过编辑 `/etc/default/grub` 文件并修改 `GRUB_CMDLINE_LINUX` 设置来使消息默认始终显示，该设置默认情况下类似于：：\n\
  \n`GRUB_CMDLINE_LINUX=\"... rhgb quiet\"`\n\n如果你是 Linux 新手且不熟悉可用的编辑器，请参考 “引言” 章节中列出的编辑器建议。例如，要使用\
  \ `nano` 编辑器，输入以下命令启动编辑器并加载 grub 文件：\n\n```bash\n# nano /etc/default/grub\n```\n\
  \n要移除图形化启动界面以便在无需按 `Esc` 键的情况下看到消息，请从设置中删除“splash”和“quiet”选项：\n\n`GRUB_CMDLINE_LINUX=\"\
  \"`\n\n此更改将导致系统显示由系统生成的所有启动消息。\n\n修改完成后，运行以下命令生成新的启动配置，以便在下次系统启动时生效：\n\n```bash\n\
  # grub-mkconfig --output=/boot/grub/grub.cfg\n```\n\n### 3.10 总结\n\n使用 Ubuntu 的第一步是安装操作系统。对于云服务器来说，此任务通常在根据云服务提供商提供的系列选项为系统选择操作系统镜像时自动完成。然而，在自己的硬件或虚拟机上安装则涉及下载以\
  \ `ISO` 镜像形式下载的安装介质，将该镜像写入 DVD 或 USB 驱动器等合适的存储设备中，并从其启动。一旦安装完成，安装自原始安装镜像创建以来发布的任何操作系统更新至关重要。\n\
  \n## 4. 与 Windows 双启动 Ubuntu\n\nUbuntu 与像绝大多数 Linux 发行版一样，可以很愉快地在硬盘上与几乎任何版本的 Windows\
  \ 共存。这种概念被称为双启动（dual-booting）。本质上，当你启动 PC 时，将看到一个菜单，提供启动 Ubuntu 或 Windows 的选项。显显然，你一次只能运行一个操作系统，但值得注意的是，无论你的\
  \ Windows 分区是使用 `NTFS`、`FAT16` 还是 `FAT32` 格式化的，你都可以从 Ubuntu 访问磁盘驱动器 Windows 分区上的文件。\n\
  \n在安装过程中，Ubuntu 安装程序将检测驱动器上的 Windows 安装，并提供删除它并将整个磁盘用于 Ubuntu，或与 Windows 共享磁盘的选项。在后的情况下，你将指定用于\
  \ Ubuntu 的磁盘百分比。\n\n根据 Ubuntu 文档，完整的 Ubuntu 桌面版安装至少需要 `25 GB` 的磁盘空间，以及更多的空间来存储你随后可能创建任何文件。一旦选择了用于\
  \ Ubuntu 的磁盘空间，安装程序将调整 Windows 分区的大小（而不破坏任何数据），并将磁盘的剩余部分用于 Ubuntu。\n\n本章将演示如何设置\
  \ Ubuntu 和 Windows 10 双启动系统，如何更改计算机系统电源时的默认启动系统，并概述如何从 Ubuntu 访问位于磁盘 Windows 分区上的文件。\n\
  \n在本章中，假设已按照上一节中的步骤使用 Ubuntu 桌面安装镜像创建了可启动的 Ubuntu USB 盘，并且系统已配置为从 USB 盘启动。\n\n###\
  \ 4.1 开始安装 Ubuntu\n\n要启动安装，请插入 Ubuntu USB 盘并重启计算机系统。如果系统再次加载 Windows，你需要在系统设置中更改启动顺序。具体方法取决于系统，并在上一节中已简要介绍。\n\
  \n一旦 Ubuntu 加载，你将看到如 图 4-1 所示的屏幕：\n\n![](img/ubuntu_install_or_try.jpg)\n\n图 4-1\n\
  \n点击 `Install Ubuntu` 按钮开始安装，等待安装程序的初始界面，如 图 4-2 所示：\n\n![](img/ubuntu_install_keyboard_layout.jpg)\n\
  \n图 4-2\n\n选择你的键盘布局，或者如果不确定，点击 `Detect Keyboard Layout` 按钮通过一些步骤识别键盘，然后点击 `Continue`。在下一个页面，选择执行\
  \ `Normal` 或 `Minimal` 安装：\n\n![](img/ubuntu_install_updates_and_software.jpg)\n\
  \n图 4-3\n\n如果你有充足的磁盘空间并希望探索 Ubuntu 自带的主要应用程序和工具而无需以后手动安装，请选择 `Normal` 选项；否则使用 `Minimal`\
  \ 选项。\n\n该选项也适用于在安装期间更新 Ubuntu 发行版的软件包。如果选择了此选项且系统连接了互联网，安装程序将下载自 Ubuntu 安装镜像发布以来任何更新，并在安装期间将其应用于系统。如果你选择在安装过程中不进行此类更新，这些更新可以在安装完成后的任何时间进行应用。\n\
  \n另一个选项提供了是否要安装第三方非开源软件，以支持特定的硬件设备并在系统上播放专有媒体文件。除非你倾向于避免使用非开源软件，否则建议使用此选项。\n\n\n\
  \n\n\n在做出适当选择后，点击“Continue”（继续）按钮进入磁盘分配界面。此时，安装程序已检测到目标磁盘驱动器上存在现有的 Windows 操作系统，并将提供如何使用磁盘以容纳\
  \ Ubuntu 安装的选择：\n\n![](img/ubuntu_dual_boot_install_type.jpg)\n图 4-4\n\n考虑到我们的目标是配置双启动系统，`Install\
  \ Ubuntu alongside Windows Boot Manager`（与 Windows 引导管理器一起安装 Ubuntu）是所需的选项。选中此选项后，点击“Continue”按钮继续。后续屏幕允许配置为每个操作系统（在此例中为\
  \ Windows 和 Ubuntu）分配的磁盘空间：\n\n![](img/ubuntu_dual_boot_space_allocation.jpg)\n\
  图 4-5\n\n此时，你必须决定将 Windows 分区的多少部分分配给 Ubuntu 安装。移动滑块（图中位于 Windows 和 Ubuntu 分区之间），直到\
  \ Ubuntu 分区的分配大小达到你满的。对于完整的 Ubuntu 桌面安装，至少应提供 25GB 的空间。\n\n选择 Ubuntu 分区大小后，点击“Install\
  \ Now”（现在安装）按钮继续安装。当警告对话框出现时，请仔细阅读，如果确定要继续，请点击“Continue”：\n\n![](img/ubuntu_dual_boot_write_changes.jpg)\n\
  图 4-6\n\n在安装过程中，安装程序会询问你的地理位置信息以便配置时区设置：\n\n![](img/ubuntu_install_geo_location1.jpg)\n\
  图 4-7\n\n接下来，安装程序将要求你为系统的第一个账户提供用户名和密码：\n\n![](img/ubuntu_install_who_are_you1.jpg)\n\
  图 4-8\n\n还提供了一个选项，用于规定用户每次想要登录系统时是否必须指定密码。默认情况下，每次启动 Ubuntu 时，都会显示请求用户名和密码凭据的登录屏幕。如果你是系统的唯一用户，并希望跳过此屏幕并在每次系统启动时自动登录，请确保在继续之前勾选\
  \ `Log in automatically`（自动登录）框框。\n\n回答所有问题后，安装程序将直接进行安装。取决于系统的速度以及你是否选择在安装期间下载更新，此过程可能需要一些时间。要查看安装程序正在执行的步骤的详细视图，请点击进度条上方的状态标题：\n\
  \n![](img/ubuntu_install_copying_files1.jpg)\n图 4-9\n\n安装完成后，将出现对话框通知你系统已准备好重启：\n\
  \n![](img/ubuntu_installation_complete1.jpg)\n图 4-10\n\n当你准备好重启时，按下“Restart Now”（立即重启）按钮。安装程序可能会提示你移除安装介质，系统需要几秒钟关闭。此时，拔掉\
  \ USB 闪盘并按 `Enter` 键继续。\n\n### 4.2 首次启动 Ubuntu\n\n当系统重启时，将出现一个类似下图所示的屏幕，提供启动 Windows\
  \ 或 Ubuntu 的选项：\n\n![](img/ubuntu_dual_boot_grub_menu.jpg)\n图 4-11\n\n按 `Enter`\
  \ 启动 Ubuntu。如果你想启动 Windows，使用键盘方向键选择 Windows Boot Manager 选项。如果你选择启动 Ubuntu，操作系统将加载，并出现\
  \ Ubuntu 登录屏幕（除非选择了自动登录选项）。输入你在安装过程中设置的用户名和密码，你将登录 Ubuntu 桌面环境。\n\n### 4.3 更改默认启动选项\n\
  \n系统启动时，将出现启动选项屏幕，并等待 10 秒让用户选择操作系统。如果在超时前未进行选择，将启动默认操作系统。在新配置的系统上，默认操作系统将是标准的 Ubuntu\
  \ 镜像。然而，可以在 Ubuntu 内部更改此默认值。\n\n一系列启动配置选项（包括 10 秒超时和在 \"在洁净磁盘驱动器上安装 Ubuntu\" 中概述的启动设置）在\
  \ `/etc/default/grub` 文件中声明，新安装中的该文件内容如下：\n\n```\nGRUB_DEFAULT=0\nGRUB_TIMEOUT_STYLE=hidden\n\
  GRUB_TIMEOUT=10\nGRUB_DISTRIBUTOR=`lsb_release -i -s 2> /dev/null || echo Debian`\n\
  GRUB_CMDLINE_LINUX_DEFAULT=\"quiet splash\"\nGRUB_CMDLINE_LINUX=\"\"\n```\n\n更改默认启动系统的第一步是在文件中声明\
  \ `GRUB_SAVEDEFAULT` 设置，并将 `GRUB_DEFAULT` 设置更改为 `saved`：\n\n```\nGRUB_DEFAULT=saved\n\
  GRUB_SAVEDEFAULT=true\nGRUB_TIMEOUT_STYLE=hidden\nGRUB_TIMEOUT=10\n```\n\n此设置允许在启动配置中保存新的默认值。接下来，运行\
  \ `grub-set-default` 命令使用将第一个选项计为 0 的编号系统来更改默认设置。例如，如果 Windows 10 选项位于菜单的第 5 个，将\
  \ Windows 10 设置为默认启动选项的命令如下：\n\n```bash\n# grub-set-default 4\n```\n\n运行以下命令检查新设置是否生效：\n\
  \n```bash\n# grub-editenv list\nsaved_entry=4\n```\n\n注意 `saved_entry` 值已设置为 4。更改后，重新生成启动配置：\n\
  \n```bash\n# grub-mkconfig --output=/boot/grub/grub.cfg\n```\n\n重启系统并验证启动菜单在超时后加载\
  \ Windows 10。\n\n### 4.4 从命令行访问 Windows 分区\n\n在双启动模式下运行 Ubuntu 时，可以通过手动挂载 Windows\
  \ 分区来访问文件。这可以通过命令行或使用“磁盘”（`gnome-disks`）图形实用程序实现。\n\n在命令行，此过程的第一步创建一个作为挂载点的目录。在本例中，我们将创建一个名为\
  \ `/mnt/windows` 的目录：\n\n```bash\n# mkdir /mnt/windows\n```\n\n为了识别分配给 Windows 分区的设备名称，使用\
  \ `fdisk` 命令：\n\n```bash\n# fdisk -l\n```\nDisk /dev/nvme0n1: 64 GiB, 687194767\
  \ bytes\nUnits: sectors of 512 = 512 bytes\nDisk model: NVMe Disk\nSector size (logical/physical):\
  \ 512 bytes / 512 bytes\nI/O size (minimum/optimal): 512 bytes / 512 bytes\nDisklabel\
  \ type: gpt\nDisk identifier: F0D04B58-29F5-4B6B-B10F-07295AAC\nDevice Start End\
  \ Sectors Type\n/dev/nvme0n1p1 2048 206847 204800 100M EFI System\n/dev/nvme0n1p2\
  \ 206848 239615 32768 16M Microsoft reserved\n/dev/nvme0n1p3 239616 80184560 79944945\
  \ 38.1G Microsoft basic data\n/dev/nvme0n1p4 132833280 134213631 1380352 674M Windows\
  \ recovery environment\n/dev/nvme0n1p5 80185344 132833279 52647936 25.1G Linux filesystem\n\
  \n在上面的输出中，我们需要访问的主 Windows 分区由 `/dev/nvme0n1p3` 表示。接下来，我们需要运行 `mount` 命令（假设 Windows\
  \ 分区为 `/dev/nvme0n1p3`）：\n\n```bash\n# mount /dev/nvme0n1p3 /mnt/windows\n```\n\n\
  通过列出挂载点根目录的内容检查挂载是否成功：\n\n```bash\n# ls /mnt/windows\n$Recycle.Bin pagefile.sys\
  \ swapfile.sys\n$WinREAgent PerfLogs 'System Volume Information'\n'Documents and\
  \ Settings' ProgramData Users\n$DumpStack.log 'Program Files' Windows\n$DumpStack.log.tmp\
  \ 'Program Files (x86)' Windows\n```\n\n为了在每次系统启动时自动挂载，只需将相应的挂载行添加到 `/etc/fstab`\
  \ 文件中：\n\n```text\n/dev/nvme0n1p3 /mnt/windows ntfs defaults 0 0\n```\n\n\n\n\n\
  要随时卸载 Windows 文件系统：\n\n```bash\numount /mnt/windows\n```\n\n### 4.5 从桌面访问 Windows\
  \ 分区\n\n使用桌面环境挂载分区的第一步是启动 `disks` 工具。加载桌面后，右键点击桌面背景，并在弹出的菜单中选择“Open Terminal”（打开终端）。在终端窗口中，在启动\
  \ `disks` 工具之前，按照如下方式获取 root 权限：\n\n```bash\n$ gnome-disks\n```\n\n一旦 `disks` 工具启动，将出现一个与图\
  \ 4-12 所示类似的窗口：\n\n![](img/ubuntu_gnome_disks.jpg)\n\n图 4-12\n\n要查看有关分区的信息，请从对话框中“Volumes”（卷）部分的图形化表示中选择它。在上面的示例中，Windows\
  \ 系统分区被选中并突出。为了挂载分区以便从 Ubuntu 内部访问内容，请选择该分区并点击图 4-13 所示的选项按钮以显示菜单：\n\n![](img/ubuntu_gnome_disks_partition_options.jpg)\n\
  \n图 4-13\n\n在菜单中，选择`Edit Mount Options...`（编辑挂载选项……）以显示图 4-14 所示的对话框。关闭`User Session\
  \ Defaults`用户会话默认）开关，并确保`Show in user interface`在用户界面中显示）选项。在`Mount Point`挂载点）文本字段中，将路径更改为\
  \ `/mnt/windows`。如果分区需要在每次系统重启时自动挂载，请启用`Mount at system startup`系统启动时挂载）选项：\n\n\
  ![](img/ubuntu_gnome_disks_automount.jpg)\n\n图 4-14\n\n完成更改后，点击`OK`按钮返回主对话框。要挂载该分区，只需点击下方图\
  \ 4-15 中突出显示的挂载按钮即可：\n\n![](img/ubuntu_gnome_disks_mount_button.jpg)\n\n图 4-15\n\
  \n一旦分区挂载，退出`gnome-disks`，并注意程序栏中已出现如图 4-16 所示的卷图标（注意，如果禁用了`Show in user interface`选项，则不会出现此图标）：\n\
  \n![](img/ubuntu_windows_partition_icon.jpg)\n\n图 4-16\n\n双击图标使用`Files`（文件）工具浏览该分区：\n\
  \n![](img/ubuntu_windows_in_file_manager.jpg)\n\n图 4-17\n\n要卸载分区，点击挂载按钮（该按钮将变为停止按钮），如上方图\
  \ 4-15 所示。\n\n### 4.6 总结\n\nUbuntu 可以通过创建双引导环境安全地与 Windows 在同一硬盘上共存。这涉及到在安装期间缩小\
  \ Windows 系统占用的空间为 Ubuntu 腾出空间。一旦安装了 Ubuntu，可以修改引导菜单更改默认操作系统。可以通过命令行或使用 `Disks`\
  \ 桌面工具从 Ubuntu 访问硬盘上的 Windows 分区。\n\n## 5 为 Ubuntu 分配分区\n\n在上一章中，我们查看了在 Windows\
  \ 同一硬盘上安装 Ubuntu。这种所谓的“双引导”配置允许用户在单个硬盘上安装两个操作系统，并在启动时选择其中一个。本章适用于想要删除 Windows 并空间留给\
  \ Linux 用户。在后续章节中，我们将使用命令行工具和 `gnome-disks` 工具逐步完成此过程。\n\n### 5.1 卸载 Windows 分区\n\
  \n如果按照“与 Windows 双引导”章节中的步骤从 Ubuntu 内部挂载了 Windows 分区，在继续本章节之前应卸载该分区。假设 Windows 分区已挂载为\
  \ `/mnt/windows`，可以如下卸载：\n\n```bash\numount /mnt/windows\n```\n\n如果之前了 `/mnt/windows`，还需要编辑\
  \ `/etc/fstab` 文件。\n\n### 5.2 从硬盘删除 Windows 分区\n\n为 Ubuntu 使用释放 Windows 分区的第一步是删除该分区。在此之前，必须备份\
  \ Windows 中任何需要保留的数据。完成这些操作后，即可继续本章节。要删除 Windows 分区，首先需要使用 `fdisk` 工具标识它们所在的硬盘：\n\
  \n```bash\nfdisk -l\n```\n\n```\nDisk /dev/nvme0n1: 64 GiB, 68719476736 bytes, 134217728\
  \ sectors\nDisk model: VMware Virtual NVMe Disk\nUnits: sectors of 1 * 512 = 512\
  \ bytes\nSector size (logical/physical): 512 bytes / 512 bytes\nI/O size (minimum/optimal):\
  \ 512 bytes / 512 bytes\nDisklabel type: gpt\nDisk identifier: F0D04B58-29F5-4B6B-B10F-0729BEAC\n\
  Device Start End Sectors Size Type\n/dev/nvme0n1p1 2048 206847 204800 100M EFI System\n\
  /dev/nvme0n1p2 206848 239615 32768 16M Microsoft reserved\n/dev/nvme0n1p3 239616\
  \ 80184560 79944945 38.1G Microsoft basic data\n/dev/nvme0n1p4 132833280 134213631\
  \ 1380352 674M Windows recovery environment\n/dev/nvme0n1p5 80185344 132833279 52647936\
  \ 25.1G Linux filesystem\n```\n\n在上面的示例输出中，系统包含一个设备名为 `/dev/nvme0n1` 的物理硬盘。该硬盘上有五个分区\
  \ `/dev/nvme0n1p1` 到 `/dev/nvme0n1p5`。根据 `Types` 列的值，三个三个 相关分区。第一个是 Windows 系统，第二个较大的分区是\
  \ Windows 引导，随后是 Windows 恢复。\n\n要删除这些分区，使用包含分区的硬盘设备名称（`/dev/nvme0n1`）启动 `fdisk`\
  \ 工具，并按照指示再次显示分区：\n\n```bash\nfdisk /dev/nvme0n1\n```\n\n```\nWelcome to fdisk (util-linux\
  \ 2.37).\nChanges 将仅留在内存中，直到你决定写入它们。\n在使用 write 命令前要小心。\nCommand (m for help): p\n\
  Disk /dev/nvme0n1: 64 GiB, 68719476736 bytes, 134217728 sectors\nDisk model: VMware\
  \ Virtual NVMe Disk\nUnits: sectors of 1 * 512 = 512 bytes\nSector size (logical/physical):\
  \ 512 bytes / 512 bytes\nI/O size (minimum/optimal): 512 bytes / 512 bytes\nDisklabel\
  \ type: gpt\nDisk identifier: F0D04B58-29F5-4B6B-B10F-0729BEAAC\nDevice Start End\
  \ Sectors Size Type\n/dev/nvme0n1p1 2048 206847 204800 100M EFI System\n/dev/nvme0n1p2\
  \ 206848 239615 32768 16M Microsoft reserved\n/dev/nvme0n1p3 239616 80184560 79944945\
  \ 38.1G Microsoft basic data\n/dev/nvme0n1p4 132833280 134213631 1380352 674M Windows\
  \ recovery environment\n/dev/nvme0n1p5 80185344 132833279 52647936 25.1G Linux filesystem\n\
  ```\n\n分区表项没有按磁盘排序。\n\nCommand (m for help):\n\n在继续之前，注意我们将删除的分区的起始和结束地址（即 `/dev/nvme0n1p2`\
  \ 的起始位置和 `/dev/nvme0n1p5` 起始位置之前的扇区）。\n\n在命令提示符处，删除 Windows 分区（在我们示例系统中的 2、3、4 号分区）：\n\
  \nCommand (m for help): d\nPartition number (1-5, default 5): 2\nPartition 2 已删除。\n\
  \nCommand (m for help): d\nPartition number (1,3-5, default 5): 3\nPartition 3 已删除。\n\
  \nCommand (m for help): d\nPartition number (1,4,5, default 5): 4\nPartition 4 已删除。\n\
  \n\n\n\n\n既然我们已经删除了 Windows 分区，就必须在腾出的磁盘空间内创建新的 Ubuntu 分区。分区编号必须与删除的第一个分区编号匹配（在本例中为\
  \ 2）。同时，还需要精确输入旧分区报告的分区起始扇区和结束扇区（虽然 `fdisk` 通常会默认提供正确的值，但双重检查是明智的）：\n\n```\nCommand\
  \ (m for help): n\nPartition number (2-4,6-128, default 2): 2\nFirst sector (206848-134217694,\
  \ default 206848):\nLast sector, +/-sectors or +/-size{K,M,G,T,P} (206848-80185343,\
  \ default 80185343):\nCreated a new partition 2 of type 'Linux filesystem' and of\
  \ size 38.1 GiB.\n```\n\n完成这些更改后，下一步是检查设置是否正确：\n\n```\nCommand (m for help): p\n\
  Disk /dev/nvme0n1: 64 GiB, 68719476736 bytes, 134217728 sectors\nDisk model: VMware\
  \ Virtual NVMe Disk\nUnits: sectors of 1 * 512 = 512 bytes\nSector size (logical/physical):\
  \ 512 bytes / 512 bytes\nI/O size (minimum/optimal): 512 bytes / 512 bytes\nDisklabel\
  \ type: gpt\nDisk identifier: F0D04B58-29F5-4B6B-B10F-07295BEF9AAC\nDevice Start\
  \ End Sectors Size Type\n/dev/nvme0n1p1 2048 206847 204800 100M EFI System\n/dev/nvme0n1p2\
  \ 206848 80185343 79978496 38.1G Linux filesystem\n/dev/nvme0n1p5 80185344 132833279\
  \ 52647936 25.1G Linux filesystem\n```\n\n为了提交更改，我们现在需要将新分区信息写入磁盘并退出 `fdisk` 工具：\n\
  \n```\nCommand (m for help): w\nThe partition table has been altered.\nSyncing disks.\n\
  ```\n\n### 5.3 格式化未分配的磁盘分区\n\n为了使新分区适用于 Ubuntu 使用，需要在其上创建一个文件系统。对于当前版本的 Ubuntu，推荐的文件系统类型是\
  \ XFS，详细介绍将在标题为向 Ubuntu 22.04 系统中添加新硬盘驱动器的章节中介绍。文件系统的创建使用 `mkfs.xfs` 命令执行，如下所示（如有必要请安装\
  \ `xfsprogs` 包）：\n\n```\n# apt install xfsprogs\n# mkfs.xfs -f /dev/nvme0n1p2\n\
  ```\n\n### 5.4 挂载新分区\n\n接下来，我们需要挂载新分区。在本例中，我们将它挂载到名为 `/data` 的目录中。然而，你可以自由地使用任何有效的挂载点挂载新分区，或者将其作为逻辑卷的一部分（细节将在向\
  \ Ubuntu 22.04 卷组和逻辑卷中添加新硬盘的章节中介绍）。首先，我们需要创建一个作为挂载点的目录：\n\n```\n# mkdir /data\n\
  ```\n\n其次，我们需要编辑 `/etc/fstab` 中的挂载表，以便分区每次启动时都自动挂载。在 `/etc/fstab` 文件的末尾，添加以下行来挂载新分区（修改\
  \ `/dev/nvme0n1p2` 设备以匹配你的环境）：\n\n```\n/dev/nvme0n1p2 /data xfs defaults 0 0\n```\n\
  \n最后，我们可以手动挂载新分区（注意，在随后的重启中将是不必要的，因为由于我们在 `/etc/fstab` 文件中添加了设置，分区将自动挂载）：\n\n```\n\
  # mount /data\n```\n\n要检查分区，请运行以下命令显示可用空间：\n\n```\n# df -h /data\nFilesystem Size\
  \ Used Avail Use% Mounted on\n/dev/nvme0n1p2 39G 305M 38G 1% /data\n```\n\n### 5.5\
  \ 编辑启动菜单\n\n下一步是修改 Ubuntu 启动菜单。由于这最初是一个双系统系统，菜单被配置为提供启动 Windows 或 Ubuntu 的选项。现在\
  \ Windows 分区已经消失了，我们需要移除此启动选项。在 Ubuntu 上，可以通过以下步骤实现：\n\n```\n# rm -r /boot/efi/EFI/Microsoft\n\
  # update-grub\n```\n\n由于现在只有一个操作系统需要启动，系统将在下次重启时自动启动 Ubuntu，而不会显示启动菜单 menu。如果你需要访问此启动菜单（例如为了使用高级启动选项），只需在启动过程的初始阶段按下\
  \ `Esc` 键即可。\n\n### 5.6 使用 GNOME Disks 工具\n\n`gnome-disks` 工具提供了一个图形化界面，用于替代命令行来恢复\
  \ Windows 分区。在本例中，第一步是安装 `xfiprogs` 包：\n\n```\n# apt install xfsprogs\n```\n\n安装软件包后，打开终端并启动\
  \ `gnome-disks` 工具：\n\n```\n# gnome-disks\n```\n\n稍等片刻，`gnome-disks` 工具将出现，如图 1\
  \ 所示：\n\n![ubuntu_gnome_disks_with_windows.jpg](img/图 1)\n\n在上面的图中，磁盘包含两个需要删除的 NTFS\
  \ 分区。在删除 NTFS 分区之前需要卸载它们。这可以通过选择分区并点击图 2 所示的卸载按钮来实现：\n\n![ubuntu_gnome_disks_unmount.jpg](img/图\
  \ 2)\n\n在卸载了 NTFS 分区后，下一步是删除它们。选择磁盘映射中的分区，并如图 3 所示所示点击删除按钮：\n\n![ubuntu_gnome_disks_delete_partition.jpg](img/图\
  \ 3)\n\n在确认对话框中查看信息，然后点击删除按钮以提交更改。在删除第一个分区后，对剩余的 NTFS 分区重复此步骤。一旦所有 NTFS 分区都被删除，磁盘空间现在应显示为空闲。现在需要创建一个分区来利用这些空闲空间。选中该空间，点击如图\
  \ 4 所示的新分区按钮：\n\n![ubuntu_gnome_disks_add_partition.jpg](img/图 4)\n\n在创建分区对话框中，选择该分区是否占用所有可用空间，或者如果你计划将该空间用于多个分区则减小大小：\n\
  \n![ubuntu_gnome_disks_partition_size.jpg](img/图 5)\n\n点击“下一步”，并在后续屏幕上为新分区命名，并选择在创建时是否应擦除分区。这会导致创建过程耗长时间，但这是一个推荐的选项。最后，为分区选择文件系统类型。这通常是\
  \ ext4 或 XFS。考虑到 XFS 的优势，选择“其他”然后点击“下一步”按钮：\n\n![ubuntu_gnome_disks_format_volume.jpg](img/图\
  \ 6)\n\n在下一个屏幕上，选择 XFS 选项然后点击“创建”按钮：\n\n![ubuntu_gnome_disks_select_xfs.jpg](img/图\
  \ 7)\n\n`gnome-disks` 工具将开始格式化过程并显示处理状态：\n\n![ubuntu_gnome_disks_format_progress.jpg](img/图\
  \ 8)\n\n一旦分区准备就，就可以从命令行或使用 `gnome-disks` 工具进行挂载。要配置挂载点，选择分区并如图 9 所示点击设置按钮：\n\n![ubuntu_gnome_disks_mount_button1.jpg](img/图\
  \ 9)\n\n\n\n\n从设置菜单中，选择`Edit Mount Options...`编辑挂载选项...项以显示图 5-10 所示的对话框。\n\n![](img/ubuntu_gnome_disks_mount_options.jpg)\n\
  \n图 5-10\n\n关闭`User Session Defaults`用户会话默认开关并根据你的需求配置挂载点。在上方图中，分区在系统启动时挂载到 `/mnt/Data`，并配置为通过标签“Data”识别。\n\
  \n设置完成后，点击`OK`，然后点击图 5-11 中高亮的挂载按钮：\n\n![](img/ubuntu_gnome_disks_mount_button2.jpg)\n\
  \n图 5-11\n\n要检查分区是否已挂载并准备好使用，运行以下命令显示可用空间：\n\n```\n$ df -h /mnt/Data\n```\n\nFilesystem\
  \ Size Used Avail Use% Mounted on\n\n`/dev/nvme0n1p3 39G 305M 38G 1% /mnt/Data`\n\
  \n最后，按照本章前面概述的步骤更新启动菜单以移除 Windows 选项。\n\n### 5.7 总结\n\n双启动配置中的 Windows 分区可以随时删除，通过识别哪些分区属于\
  \ Windows 然后将其删除，从而为 Ubuntu 系统腾出空间。删除后，未分配的空间可以用于创建新的文件系统并进行挂载，供 Ubuntu 系统使用。\n\n\
  ## 6. GNOME 42 桌面导览\n\nUbuntu 22.04 包含了 GNOME 42 桌面环境。虽然缺乏 Windows 和 macOS 桌面的复杂性，但\
  \ GNOME 提供了一个整洁且直观的桌面环境，包含了窗口化环境的所有基本功能，并且具有可以快速学习的优势。\n\n在本章中，将涵盖 GNOME 桌面的主要功能，并概述如何执行基本任务。\n\
  \n### 6.1 安装 GNOME 桌面\n\n如果在安装 Ubuntu 22.04 的过程中使用了 Ubuntu Desktop 桌面镜像，则 GNOME\
  \ 桌面将已经安装，并在每次系统启动时自动启动。\n\n如果安装的是 Ubuntu Server 配置，则 GNOME 桌面将不会包含在系统中安装的包中。在没有连接显示器的服务器级系统上，安装图形化桌面环境的想法似乎是多余的。然而，值得注意的是，远程访问\
  \ GNOME 桌面也是可能的，因此即使在所谓的“无头”服务器上（即缺少显示器、键盘和鼠标的服务器），安装 GNOME 桌面包可能仍有益。建立远程桌面访问的主题将在本书的“使用\
  \ Vino 进行 Ubuntu 22.04 桌面访问”章节中详细介绍。\n\n如果安装配置未包含 GNOME 桌面，可以使用以下命令随时安装：\n\n```\n\
  # apt install ubuntu-gnome-desktop\n```\n\n一旦安装完成，在下次重启系统时将出现桌面登录界面。\n\n### 6.2\
  \ GNOME 42 桌面概述\n\n下方图 6-1 所示屏幕显示了在启动任何其他程序或进行配置更改之前，典型的新启动 GNOME 桌面会话的外观。\n\n主桌面区域（标记为\
  \ A）是启动应用程序和实用程序时窗口出现的地方。\n\n屏幕顶部的栏（B）被称为顶栏，包括`Activities`活动菜单（C）、日期和时间以及一组按钮和图标，包括网络状态、音频量、电池电量以及其他状态账户设置：\n\
  \n![](img/ubuntu_gnome_desktop.jpg)\n\n图 6-1\n\n桌面上运行的当前活动程序的应用程序菜单也会出现在顶栏中。例如，图\
  \ 6-2 显示了`Terminal`应用的应用程序菜单：\n\n![](img/ubuntu_gnome_desktop_terminal_menu.jpg)\n\
  \n图 6-2\n\n根据应用程序的不同，应用程序窗口栏中可能提供包含额外选项的菜单。例如，图 6-3 显示了`Terminal`应用的内置菜单：\n\n![](img/ubuntu_gnome_desktop_terminal_dialog_menu.jpg)\n\
  \n图 6-3\n\n通过右键点击收藏栏（dock）中的应用程序图标，可以获得另一个菜单，如图 6-4 所示：\n\n![](img/ubuntu_gnome_desktop_terminal_dash_menu.jpg)\n\
  \n图 6-4\n\n### 6.3 启动活动\n\n应用程序和实用程序通过下方图 6-5 所示的收藏栏（dock）启动：\n\n![](img/ubuntu_gnome_desktop_activities_dash.jpg)\n\
  \n图 6-5\n\n默认情况下，收藏栏将显示一组预定义的常用应用程序图标，还将包含任何当前正在运行的应用程序图标。如果应用程序正在运行，它将在图标左侧带有一个圆点标记，如果运行了多个副本，则每个实例都会显示一个圆点。\n\
  \n要启动应用程序，只需点击图标。\n\n要找到未包含在收藏栏中的应用程序，一种方法是选择图 6-5 上方标记为 A 的`Show Applications`，以显示应用程序列表，如图\
  \ 6-6 所示：\n\n![](img/ubuntu_gnome_desktop_show_apps.jpg)\n\n图 6-6\n\n注意，列表可以过滤为显示所有应用程序或仅显示频繁使用的应用程序（通过屏幕底部的按钮）。还需要注意列表中的某些项实际上是文件夹。例如，在上面的截图，`Utilities`项提供了系统监控、磁盘管理工具以及`Terminal`窗口。\n\
  \n浏览应用程序的替代方案是使用搜索栏进行搜索，点击顶栏中的`Activities`即可出现搜索界面，如图 6-7 所示：\n\n![](img/ubuntu_desktop_apps_search.jpg)\n\
  \n图 6-7\n\n在搜索框中输入文本时，匹配列表将进行简化。\n\n要将应用程序添加到收藏栏以便方便访问，找到该应用程序的图标，右键点击并选择`Add to\
  \ Favorites`菜单选项：\n\n![](img/ubuntu_gnome_desktop_add_to_favorites.jpg)\n\n图 6-8\n\
  \n要从收藏栏移除应用程序，右键点击 dash 中的图标并选择`Remove from Favorites`。\n\n### 6.4 窗口管理\n\n与其他桌面环境一样，应用程序在\
  \ GNOME 中以窗口运行。当打开多个应用程序窗口时，`Super + Tab` 快捷键将显示切换面板（图 6-9），允许选择不同的窗口作为当前活动窗口（`Super`\
  \ 键是 Windows 键，在 Mac 键盘上为 `Cmd` 键）：\n\n![](img/ubuntu_desktop_switcher.jpg)\n\n\
  图 6-9\n\n如果单一个应用程序打开了多个窗口，切换器将在第二个面板中显示这些窗口，以便选择特定窗口：\n\n![](img/ubuntu_desktop_switcher_windows.jpg)\n\
  \n图 6-10\n\n要反向循环切换器中的图标，使用 `Shift + Tab` 快捷键。\n\n要将窗口最大化填充整个屏幕，点击标题栏并将窗口拖到屏幕顶部。要恢复窗口的原始大小，点击标题栏并向下拖动。或者，只需双击标题栏切换窗口大小。同样，将窗口拖到屏幕左侧或右侧将使窗口填充屏幕的半部分。\n\
  \n### 6.5 使用工作空间\n\n\n\n\n应用程序窗口出现的区域称为工作区（workspace），GNOME 允许配置多个工作区。要查看当前的工作区，请点击顶部栏上的“活动”（Activities，在上方上方的\
  \ 图 6-1 中标记为 C 处）或按下键盘上的 `Super` 键显示以下屏幕：\n\n![](img/ubuntu_gnome_workspaces.jpg)\n\
  \n图 6-11\n\n上方标记为 A 的区域是当前选中的工作区。点击标记为 B 和 C 的区域将分别选择并显示上一个和下一个工作区。中间的工作区面板 (A)\
  \ 显示当前激活的应用程序窗口。将鼠标指针悬停在窗口上将显示一个关闭按钮，该按钮用于退出窗口。要将窗口从一个工作区移动到另一个工作区，请显示工作区面板，并将应用程序窗口拖放到目标工作区上。当窗口被添加到空白工作区时，工作区面板会添加另一个空白工作区，从而创建多个工作区。\n\
  \n工作区缩略图 (D) 提供了一种在工作区之间切换的方便方法，在处理许多工作区时特别有帮助。\n\n要删除工作区，请关闭该工作区上的所有窗口，或者将它们移动到另一个工作区。\n\
  \n“显示应用程序”屏幕也提供了访问当前工作区的途径，如下 图 6-12 所示：\n\n![](img/ubuntu_gnome_desktop_show_apps_workspaces.jpg)\n\
  \n图 6-12\n\n### 6.6 日历与通知\n\n当系统需要通知你某个事件（例如系统或应用程序更新可用）时，工作区顶部会出现一个弹出式面板。通过点击顶部栏中的日期和时间，可以访问日历和任何之前的通知，如\
  \ 图 6-13 所示：\n\n![](img/ubuntu_gnome_desktop_calendar.jpg)\n\n图 6-13\n\n### 6.7\
  \ 桌面设置\n\n要访问 `Settings` 应用，点击顶部栏最右侧的向下箭头，并选择带有工具图标的按钮，如 图 6-14 所示：\n\n![](img/ubuntu_gnome_desktop_settings.jpg)\n\
  \n图 6-14\n\n`Settings` 应用提供了广泛的选项，例如以太网和 WiFi 连接、屏幕背景自定义、屏幕锁定和电源管理控制以及语言偏好。要探索每个类别中可用的设置，只需从\
  \ `Settings` 窗口左侧面板中选择一个选项：\n\n![](img/ubuntu_gnome_desktop_settings_window.jpg)\n\
  \n图 6-15\n\n上方 图 6-14 所示的菜单还包括切换用户、调整音量、切换到不同的 WiFi 网络以及注销、重启或关闭系统等选项。\n\n### 6.8\
  \ 自定义 Dock（程序栏）\n\n可以在 `Settings` 应用中通过选择 `Appearance` 选项更改 Dock 的大小、位置和行为，如 图 6-16\
  \ 所示：\n\n![](img/ubuntu_gnome_desktop_settings_dock.jpg)\n\n图 6-16\n\n位置可以设置为屏幕的四面中的任意侧，而\
  \ `Icon` 大小可用于缩小 Dock 的尺寸。最后，如果启用了自动隐藏 Dock 选项，Dock 将从视图中消失，直到鼠标指针移动到它当前所在的屏幕边缘。\n\
  \n### 6.9 安装 Ubuntu 软件\n\n与 macOS、Windows、iOS 和 Android 等其他操作系统一样，Ubuntu 有一个以 `Ubuntu\
  \ Software` 工具形式存在的“应用商店”。图标通常放置在 Dock 中，如 图 6-17 所示：\n\n![](img/ubuntu_gnome_desktop_software_in_dock.jpg)\n\
  \n图 6-17\n\n一旦加载，该工具将提供一个可在系统上安装的应用程序列表，并根据类别、推荐和编辑精选进行分组。也可以对可用应用程序库进行搜索以找到特定项目：\n\
  \n![](img/ubuntu_gnome_desktop_software.jpg)\n\n图 6-18\n\n要安装应用程序，只需在 `Ubuntu Software`\
  \ 窗口中选择它并点击 `Install` 按钮：\n\n![](img/ubuntu_gnome_desktop_software_install.jpg)\n\
  \n图 6-19\n\n### 6.10 基础自定义之外\n\nGNOME 桌面设计上是一个整洁且无杂的环境，自定义选项极少。然而，这并不意味着对桌面进行额外的更改。事实上，GNOME\
  \ 项目开发了一个名为 `GNOME Tweaks` 的工具来实现此目的。要安装该工具，打开 `Ubuntu Software` 工具，搜索并安装 `GNOME\
  \ Tweaks`。一旦安装并启动，将出现 `Tweaks` 对话框，如下：\n\n![](img/ubuntu_gnome_tweaks.jpg)\n\n图\
  \ 6-20\n\n现在有很多自定义桌面的选项，实际上在本章中无法涵盖所有内容，因此在继续之前请花时间尝试这些设置。\n\n### 6.11 总结\n\nUbuntu\
  \ 包含了 GNOME 桌面环境，可以在安装时包含或单独安装。与大多数桌面环境不同，GNOME 旨在提供一个简洁且易于使用的用户界面。GNOME 的主要区域包括顶部栏、活动概览和\
  \ Dash。此外，它支持多个工作区以保持应用程序有序且屏幕整洁。在 `Settings` 应用中还提供了多种配置选项，包括桌面设置、音频、网络配置和 WiFi\
  \ 网络选择。\n\n## 7. Cockpit Web 界面概览\n\n尽管 Ubuntu 配备了最新的 Linux 桌面环境，但它在很大程度上是一个服务器操作系统。因此，大多数\
  \ Ubuntu 部署是远程物理服务器或云端虚拟机实例。通常，这些系统在没有键盘、鼠标或显示器的情况下运行，只有通过网络连接的命令行进行直接访问。这为远程管理系统带来了挑战。\n\
  \nCockpit Web 管理界面提供了这种功能。本章将介绍如何安装、配置和访问 Cockpit 界面，同时提供 Cockpit 主要功能的概述，其中许多功能将在后面的章节中进行详细介绍。\n\
  \n### 7.1 Cockpit 概述\n\nCockpit 是一个轻量级的 Web 界面，允许远程执行常规系统管理任务。安装并配置后，系统管理员打开本地浏览器窗口并导航到远程服务器上的\
  \ Cockpit 端口。在浏览器中加载 Cockpit 界面并登录后，可以使用可视化工具执行广泛的任务。\n\n在后台，Cockpit 使用与在命令行工作时相同的工具来执行任务，并自动更新以反映系统其他地方发生的变化。这允许\
  \ Cockpit 与其它工具和技术配合使用，而不会出现一种方法覆盖另一种方法的风险。Cockpit 还可以配置为访问多个服务器，从而允许通过单一浏览器会话管理和监控多个服务器。\n\
  \n\n\nCockpit 默认安装并捆绑了大量的工具，同时也允许根据需要安装额外的扩展插件。Cockpit 的设计还允许你结合 HTML 和 JavaScript\
  \ 创建自己的扩展，以添加缺失或自定义的功能。\n\nCockpit 的模块化设计还允许许多功能嵌入到其他基于 Web 的应用程序中。\n\n### 7.2 安装并启用\
  \ Cockpit\n\nUbuntu 默认通常不安装 Cockpit，但可以通过几个简单的步骤进行设置和启用。第一步按照如下方式安装 Cockpit 包：\n\
  \n```bash\napt install cockpit\n```\n\n接下来，需要启用 `cockpit.socket` 服务：\n\n```bash\n\
  systemctl enable --now cockpit.socket\n```\n\n最后，如果你的系统中启用了防火墙，则需要在防火墙上打开必要的端口，以允许远程浏览器连接到达\
  \ Cockpit（有关防火墙的详情，请参阅“Ubuntu 22.04 防火墙基础”）。\n\n如果启用了 `ufw`：\n\n```bash\nufw allow\
  \ 9090\n```\n\n如果启用了 `firewalld`：\n\n```bash\nfirewall-cmd --add-service=cockpit\
  \ --permanent\nfirewall-cmd --reload\n```\n\n### 7.3 访问 Cockpit\n\n如果你可以访问已安装 Cockpit\
  \ 的服务器桌面环境，打开浏览器窗口并导航到 `https://localhost:9090` 以访问 Cockpit 登录界面。相反，如果服务器是远程的，请使用域名或\
  \ IP 地址访问服务器（例如，`https://myserver.com:9090`）。\n\n当建立连接时，浏览器可能会提示连接不安全。这是因为 Cockpit\
  \ 服务使用了自签名证书。选择继续访问网站的选项，或者为了以后避免出现此消息，请选择高级选项并为服务器地址添加异常。一旦连接成功，浏览器将加载下方图 7-1 所示的登录页面：\n\
  \n![](img/ubuntu_220.04_cockpit_login.jpg)\n\n图 7-1\n\n以 root 身份或使用你的用户账户凭据登录 Cockpit\
  \ 界面。请注意，由于权限限制，以用户身份登录时，某些任务在 Cockpit 界面内将受到限制。在这种情况下，Cockpit 控制台将显示一个标记为“有限访问”的按钮，如图\
  \ 7-2 所示：\n\n![](img/rocky_cockpit_limited_access.jpg)\n\n图 7-2\n\n要提升你的权限，点击限制访问按钮并在提示时输入你的密码：\n\
  \n![](img/rhel_cockpit_access_password.jpg)\n\n图 7-3\n\n登录后，Cockpit 将显示概览（Overview）屏幕。\n\
  \n### 7.4 概览\n\n概览屏幕提供了当前系统的概述，包括对 CPU、内存、存储和网络活动性能指标的访问。此屏幕还包含系统信息，包括底层硬件、主机名、系统时间以及系统软件是否为最新。还提供了重启或关闭系统的选项。\n\
  \n例如，图 7-4 显示了 Cockpit 界面的概览页：\n\n![](img/ubuntu_220.04_cockpit_overview.jpg)\n\n\
  图 7-4\n\n要需特定类别的更多信息，请点击相应的链接。例如，图 7-5 显示了系统性能历史屏幕：\n\n![](img/ubuntu_220.04_cockpit_performance.jpg)\n\
  \n图 7-5\n\n### 7.5 日志\n\n当选择日志（Logs）类别时，Cockpit 会显示 `systemd` 日志的内容。选择一个日志条目将显示整个日志消息。日志目按时间排序，最新的排在顶部，并包含了菜单用于根据不同的时间范围和消息严重程度过滤日志。\n\
  \n![](img/rhel_cockpit_logs.jpg)\n\n图 7-6\n\n### 7.6 存储\n\n选择存储（Storage）选项来查看和管理系统上的存储，包括磁盘、分区、卷组、网络文件系统\
  \ (NFS) 挂载和 RAID 存储。此屏幕允许实时监控磁盘 I/O 活动，并列出用于查询和管理存储设备的系统 `udisksd` 服务的日志输出：\n\n\
  ![](img/centos_cockpit_storage.jpg)\n\n图 7-7\n\n### 7.7 网络\n\n网络（Networking）屏幕提供了有关各种网络相关配置和服务的信息，包括网络接口和防火墙设置。此外，它允许配置更改，例如创建网络网接或设置虚拟网络：\n\
  \n![](img/rhel_cockpit_networking.jpg)\n\n图 7-8\n\n### 7.8 账户\n\n选择此选项以查看系统上配置的当前用户账户，并为额外用户创建账户。用户管理主题将在随后的“管理\
  \ Ubuntu 22.04 用户和组”章节中介绍：\n\n![](img/rhel_cockpit_accounts.jpg)\n\n图 7-9\n\n点击现有账户以查看详情并进行更改。用户账户详情页也可用于查看和添加公钥\
  \ SSH 密钥，如在 Ubuntu 22.04 上配置 SSH 密钥认证章节所述，访问服务器。\n\n### 7.9 服务\n\n此屏幕显示服务器上运行的服务列表，并允许对这些服务进行添加、删除、停止和启动：\n\
  \n![](img/rhel_cockpit_services.jpg)\n\n图 7-10\n\n服务主题将在“Ubuntu 22.04 systemd ”章节中详细介绍。\n\
  \n### 7.10 应用\n\n如前所述，可以通过扩展为 Cockpit 添加额外功能。这些扩展可以是自开发的，也可以是第三方提供的。应用程序屏幕列出了已安装的扩展并允许添加或删除：\n\
  \n![](img/cockpit_applications.jpg)\n\n图 7-11\n\n如果界面中没有应用程序选项，可以通过以下方式安装：\n\n```bash\n\
  apt install cockpit-packagekit\n```\n\n### 7.11 虚拟机\n\n虚拟化允许在单一计算机系统中运行多个操作系统实例，每个系统运行在自己的虚拟机中。虚拟机\
  \ Cockpit 扩展提供了创建和管理安装在服务器上的虚拟机的方法：\n\n![](img/rhel_cockpit_virtual_machines.jpg)\n\
  \n图 7-12\n\n虚拟机扩展默认未安装，但可以通过应用程序界面或运行以下命令添加：\n\n```bash\napt install cockpit-machines\n\
  ```\n\n在 Ubuntu 中使用虚拟化将从“虚拟化技术概述章节开始介绍。\n\n### 7.12 软件更新\n\n如果系统有任何软件更新，它们将列在这里并可以从此屏幕安装：\n\
  \n![](img/ubuntu_220.04_cockpit_software_updates.jpg)\n\n图 7-13\n\n如果 Cockpit 软件更新屏幕可用，可以通过以下方式安装：\n\
  \n```bash\napt install cockpit-packagekit\n```\n\n### 7.13 终端\n\n顾其名，终端（Terminal）屏幕提供了命令行提示符的访问：\n\
  \n![](img/cockpit_terminal.jpg)\n\n图 7-14\n\n### 7.14 连接多个服务器\n\nCockpit 可以配置为在一个会话中管理多个服务器。要向\
  \ Cockpit 会话添加另一个主机，点击图 7-15 中突出按钮以显示主机面板：\n\n![](img/cockpit_hosts.jpg)\n\n图 7-15\n\
  \n点击添加新主机按钮，输入其他系统的 IP 地址或主机名，并选择一种颜色将其与添加到 Cockpit 的其他服务器区分开，然后点击添加按钮：\n\n![](img/rhel_cockpit_add_new_host.jpg)\n\
  \n图 7-16\n\n\n\n如果您首次连接到远程服务器，Cockpit 将要求您接受一个新的 SSH 密钥。在接受密钥后，系统会提示您输入上方图 7-16\
  \ 中指定的用户名密码。该界面还提供了设置和授权受密码保护的 SSH 密钥的选项，以便在下次访问第二个宿主机系统时实现自动登录：\n\n![](img/rhel_cockpit_remote_login.jpg)\n\
  \n图 7-17\n\n要在主机之间切换，请显示主机面板（见上方图 7-15）并选择所需的系统。\n\n### 7.15 启用存储的指标\n\n在标准安装中，Cockpit\
  \ 不保留图表显示短时间窗口之外的任何性能指标数据。为了保留 Cockpit 收集的数据，需要安装 Cockpit Co-Pilot (PCP) 包。按照以下方式开始安装\
  \ `cockpit-pcp` 程序包：\n\n```bash\n# apt install cockpit-pcp\n```\n\n安装 `cockpit-pcp`\
  \ 后，注销当前 Cockpit 会话并重新登录。\n\n接下来，显示性能指标界面并点击指标设置按钮以显示如图 7-18 所示的界面，开启“收集指标”选项并点击“保存”\n\
  \n![](img/rhel_cockpit_collect_metrics.jpg)\n\n图 7-18\n\n在 Cockpit 收集数据经过足够的时间后，指标信息将按如图\
  \ 7-19 所示显示，并按小时块进行分类：\n\n![](img/ubuntu_220.04_cockpit_stored_metrics.jpg)\n\n\
  图 7-19\n\n### 7.16 总结\n\nCockpit Web 界面允许在浏览器内部通过可视化方式执行远程系统管理任务，而无需依赖命令行提示符和命令行工具。一旦安装并启用，系统管理员只需打开浏览器，连接到远程服务器并登录\
  \ Cockpit 界面。在后台，Cockpit 使用与命令行提示符相同的命令行工具，允许这两种方式同时使用，而不会产生配置冲突的风险。此外，Cockpit 使用模块化框架，允许添加额外的扩展，并对自定义扩展进行开发和集成。一个\
  \ Cockpit 会话可以管理单个服务器，也可以配置为同时访问多个服务器。\n\n## 8. 在 Ubuntu 22.04 上使用 Bash Shell\n\n\
  学习使用 Ubuntu 和通用的 Linux 发行版的一个基本部分是熟练在 Shell 环境中工作。虽然 Linux 包含的 GNOME 等图形桌面环境为操作系统提供了用户友好的界面，但\
  \ Shell 环境提供了比图形桌面工具能实现的多得的能力、灵活性自动化自动化。Shell 环境还为桌面环境不可用时提供了一种与操作系统交互的手段，这在处理如\
  \ Ubuntu 这种基于服务器的操作系统或无法完全启动的损坏系统时是常见情况。\n\n因此，本章旨在提供 Ubuntu 上默认 Shell 环境（具体为 Bash\
  \ Shell）的概述。\n\n### 8.1 什么是 Shell？\n\nShell 是一个交互式命令解释器环境，可以在其中提示符处输入命令，或将命令作为脚本输入文件并执行。Shell\
  \ 的起源可以追溯到 UNIX 操作系统的早期阶段。事实上，在 Linux 早期，在引入图形桌面之前，Shell 是用户与操作系统交互的唯一方式。\n\n多年来开发了多种\
  \ Shell 环境。第一个被广泛使用的 Shell 是由贝尔实验室的 Stephen Bourne 编写的 Bourne shell。\n\n另一个早期产物是\
  \ C shell，它与 C 编程语言在某些语法上有相似之处，并引入了如命令行编辑和历史记录等易用性增强。\n\nKorn shell（由 David Korn\
  \ 在贝尔实验室开发）基于 Bourne shell 和 C shell 提供的功能。\n\nUbuntu 的默认 Shell 是 Bash shell（Bourne\
  \ Again SHell 的缩写）。这种 Shell 起源于 Bourne shell 的开源版本，由 Brian Fox 为 GNU 项目开发，并基于 Bourne\
  \ shell 和 C shell 提供的功能。\n\n### 8.2 获取 Shell 访问\n\n在 GNOME 桌面环境中，可以通过在顶栏选择“活动”（Activities）选项，在搜索栏中输入“终端”（Terminal）并点击终端图标，从而从终端窗口访问\
  \ Shell 提示符。\n\n当远程登录到 Ubuntu 服务器（例如使用 SSH）时，用户将看到 Shell 提示符。题为在 Ubuntu 22.04 上配置基于密钥的身份验证的章节将介绍使用\
  \ SSH 访问远程服务器的细节。在启动未安装桌面环境的服务器系统时，用户在物理控制台终端或远程登录会话完成登录程序后将立即进入 Shell。\n\n### 8.3\
  \ 在提示符处输入命令\n\n在 Shell 命令行提示符处只需输入命令并按回车键即可输入命令。虽然某些命令静默执行任务，但大多数命令在返回提示符之前会显示某种形式的输出。例如，可以使用\
  \ `ls` 命令显示当前工作目录下的文件和目录：\n\n```bash\n$ ls\nDesktop Documents Downloads Music Pictures\
  \ Public Templates Videos\n```\n\n可用命令要么内置在 Shell 本身中，要么位于物理文件系统中。可以使用 `which` 命令识别命令在文件系统中的位置。例如，查找\
  \ `ls` 命令在文件系统的位置：\n\n```bash\n$ which ls\nalias ls=’ls --color=auto’\n/usr/bin/ls\n\
  ```\n\n显然，`ls` 命令位于 `/usr/bin` 目录。注意配置了别名，该主题将在本章以后讨论。使用 `which` 命令定位内置（而非文件系统中的可执行文件）命令将产生类似的输出：\n\
  \n```bash\n$ which history\n/usr/bin/which: no history in (/home/demo/.local/bin:/home/demo/bin:/home/share/Modules/bin:/home/local/bin:/usr/bin:/usr/local/sbin:/usr/sbin)\n\
  ```\n\n### 8.4 获取命令信息\n\nLinux Shell 可用的许多命令看起来晦涩。要获取有关命令功能及其如何使用的详细信息，请使用 `man`\
  \ 命令并将命令名作为参数。例如，了解更多关于 `pwd` 命令：\n\n```bash\n$ man pwd\n```\n\n执行上述命令后将显示 `pwd`\
  \ 命令的详细说明。许多命令在带有 `--help` 命令行选项运行时也会提供额外信息：\n\n```bash\n$ wc --help\n```\n\n###\
  \ 8.5 Bash 命令行编辑\n\n早期的 Shell 环境不提供任何形式的编辑功能。这意味着如果您在输入的长命令行开头发现错误，必须删除之后的所有字符，纠错并重新输入剩余部分。幸运的是，Bash\
  \ 提供了大量的命令行编辑选项，如下表所示：\n\n| 键序列 | 动作 |\n| :--- | :--- |\n| Ctrl-b 或 左箭头 | 光标向后移动一位\
  \ |\n| Ctrl-f 或 右箭头 | 光标向前移动一位 |\n| Delete | 删除当前光标下的字符 |\n| Backspace | 删除光标左侧的字符\
  \ |\n\n\n\n\n\n| 快捷键 | 描述 |\n| :--- | :--- |\n| `Ctrl-_` | 撤销上一次更改（可以重复以撤销所有之前的更改）\
  \ |\n| `Ctrl-a` | 将光标移动到行首 |\n| `Ctrl-e` | 将光标移动到行尾 |\n| `Meta-f` 或 `Esc` 后按 `f`\
  \ | 将光标向右移动一个单词 |\n| `Meta-b` 或 `Esc` 后按 `b` | 将光标向左移动一个单词 |\n| `Ctrl-l` | 清除屏幕上除当前命令以外的所有内容\
  \ |\n| `Ctrl-k` | 从当前光标位置删除到行尾 |\n| `Meta-d` 或 `Esc` 后按 `d` | 删除到当前单词末尾 |\n| `Meta-DEL`\
  \ 或 `Esc` 后按 `DEL` | 头部到当前单词开头 |\n| `Ctrl-w` | 从当前光标位置删除到上一个空白字符 |\n\n表 8-1\n\n\
  ### 8.6 使用 Shell 历史记录\n\n除了命令行编辑功能外，Bash shell 还提供了命令行历史记录支持。可以使用 `history` 命令查看之前执行过的命令列表：\n\
  \n```bash\n$ history\n    1 ps\n    2 ls\n    3 ls –l /\n    4 ls\n    5 man pwd\n\
  \    6 man apropos\n```\n\n此外，可以使用 `Ctrl-p`（或向上方向键）和 `Ctrl-n`（或向下方向键）在之前输入的命令之间来回滚动。最后，当历史记录中了所需的命令时，按\
  \ `Enter` 键执行它。\n\n另一种选项是输入 `!` 字符，后跟要重复命令的前几个字符，最后按 `Enter` 键。\n\n### 8.7 文件名简写\n\
  \n许多 shell 命令接受一个或多个文件名作为参数。例如，要显示名为 `list.txt` 的文本文件的内容，可以如下使用 `cat` 命令：\n\n```bash\n\
  $ cat list.txt\n```\n\n同样，可以通过指定所有文件名作为参数来显示多个文本文件的内容：\n\n```bash\n$ cat list.txt\
  \ list2.txt list3.txt list4.txt\n```\n\n与其输入每个名称，可以使用模式匹配来指定所有符合特定标准的文件。例如，可以使用\
  \ `*` 通配符字符来简化上面的示例：\n\n```bash\n$ cat *.txt\n```\n\n上述命令将显示所有以 `.txt` 扩展结尾的文件内容。可以进一步限制为任何以\
  \ `list` 开头并以 `.txt` 结尾的文件：\n\n```bash\n$ cat list*.txt\n```\n\n可以使用 `?` 字符指定单个匹配：\n\
  \n```bash\n$ cat list?.txt\n```\n\n### 8.8 文件名和路径补全\n\n与其输入完整的文件名或路径或使用模式匹配来减少输入量，shell\
  \ 提供了文件名补全功能。要使用文件名补全，输入文件名或路径的前几个字符，然后按两次 `Esc` 键。shell 将根据目录中匹配你输入字符的第一个文件或路径名为你补全文件名。要获取可能的匹配项列表，在输入前几个字符后按\
  \ `Esc =`。\n\n### 8.9 输入和输出重定向\n\n如前所述，许多 shell 命令在执行时会输出信息。默认情况下，这些输出去往名为 `stdout`\
  \ 的设备文件，它本质上是运行 shell 的终端窗口或控制台。相反，shell 从 `stdin` 获取输入。\n\n要将输出重定向到文件，使用 `>` 运算符。例如：\n\
  \n```bash\n$ command > output.txt\n```\n\n要将输出追加到文件而不是覆盖它，使用 `>>` 运算符：\n\n```bash\n\
  $ command >> output.txt\n```\n\n要从文件读取输入，使用 `<` 运算符：\n\n```bash\n$ command < input.txt\n\
  ```\n\n### 8.10 使用管道\n\n除了 I/O 重定向，shell 还允许将一个命令的输出管道到另一个命令。这是通过在两个命令之间放置 `|` 字符实现的。例如，统计运行进程的数量：\n\
  \n```bash\n$ ps -ef | wc -l\n```\n\n### 8.11 配置别名\n\n随着你越来越熟悉 shell，你会经常发布命令。为了减少发布命令时的输入量，可以创建一个映射到命令的别名（alias）。例如，创建一个别名使得输入\
  \ `l` 执行 `ls -lt`：\n\n```bash\nalias l=\"ls -lt\"\n```\n\n### 8.12 环境变量\n\nshell\
  \ 环境变量为数据和配置设置提供了临时存储。shell 本身设置了几个变量，用户更改这些变量来修改 shell 的行为。可以使用 `env` 命令获取当前定义的变量列表：\n\
  \n```bash\n$ env\n```\n\n你可以使用 `export` 命令创建自己的自己的环境变量。例如：\n\n```bash\nexport DATAPATH=/data/files\n\
  ```\n\n\n\n\n```bash\n$ export NOW=`date`\n$ echo $NOW\n\nWed Mar 29 12:39:20 PM\
  \ EDT 2023\n```\n\n如果每次进入 shell 环境时都需要配置某些环境变量或别名（alias）设置，可以将它们添加到用户主目录下一个名为 `.bashrc`\
  \ 的文件中。例如，以下 `.bashrc` 文件配置了设置 `DATAPATH` 环境变量和一个别名：\n\n```bash\n# .bashrc\n\n#\
  \ Source global definitions\nif [ -f /etc/bashrc ]; then\n. /etc/bashrc\nfi\n\n\
  # User specific environment\nPATH=\"$HOME/.local/bin:$HOME/bin:$PATH\"\nexport PATH\n\
  \n# Uncomment the following line if you don’t like systemctl’s auto-paging feature:\n\
  # export SYSTEMD_PAGER=\n\n# User specific aliases and functions\nexport DATAPATH=/data/files\n\
  alias l=\"ls -lt\"\n```\n\n### 8.13 编写 Shell 脚本\n\n到为止，我们完全关注 `Bash` shell 的交互性。我们所说的交互性，是指手动输入每一个命令并在提示符处执行它们。事实上，这只是\
  \ shell 能力的一一小部分。可以认为，shell 最强大的方面之一就是具备创建 shell 脚本的能力。shell 脚本是包含语句序列的文本文件，这些可以在\
  \ shell 环境中执行以完成任务。除了执行命令的能力外，shell 还提供了许多编程结构，例如 `for` 和 `do` 循环以及 `if` 语句，你理所当然地会在脚本语言中找到这些结构。\n\
  \n遗憾的是，对 shell 脚本的详细概述超出了本章的范围。然而，许多致力于 shell 脚本的书籍和网络资源对该主题的讲解比我们在这里实现的深入得多。因此，在本节中，我们仅提供\
  \ shell 脚本的一个非常小的尝试。\n\n创建 shell 脚本的第一步是创建一个文件（在本示例中，我们将其命名为 `simple.sh`），并将以下内容作为第一行：\n\
  \n```bash\n#!/bin/sh\n```\n\n`#!` 被称为“shebang”，是一个特殊的字符序列，表示执行该脚本所需的解释器路径是该行中的下一个项目（在本例中是位于\
  \ `/bin` 的 `sh` 可执行文件）。如果 `/bin/csh` 或 `/bin/ksh` 是你想要使用的解释器，那么同样可以是它们。\n\n下一步是编写一个简单的脚本：\n\
  \n```bash\n#!/bin/sh\nfor i in *\ndo\n    echo $i\ndone\n```\n\n此脚本所做的只是遍历当前目录中的所有文件，并显示每个文件的名称。可以通过将脚本名称作为参数传递给\
  \ `sh` 来执行此脚本：\n\n```bash\n$ sh simple.sh\n```\n\n要使文件具有可执行性（从而消除了将其传递给 `sh` 命令的需求），可以使用\
  \ `chmod` 命令：\n\n```bash\n$ chmod +x simple.sh\n```\n\n一旦在文件权限上设置了执行位，就可以直接执行它。例如：\n\
  \n```bash\n$ ./simple.sh\n```\n\n### 8.14 总结\n\n在 `Ubuntu Essentials` 的这一章中，我们简要地游览了\
  \ `Bash` shell 环境。在图形化桌面环境中，很容易忘记操作系统的真正力量和灵活性通常只有通过进入用户友好桌面界面下方并使用 shell 环境才能利用。此外，熟悉\
  \ shell 对于管理和维护没有安装桌面的服务器级系统是必要的，或者在尝试修复损坏到桌面或 `Cockpit` 界面不再无法启动的系统时也是如此。\n\nshell\
  \ 的功能远超本章涵盖的领域。如果你是 shell 新手，我们强烈建议你寻找额外的资源。一旦熟悉了这些概念，你将很快发现，在终端窗口中使用 shell 执行许多任务比在桌面上翻阅菜单和对话框要快得多。\n\
  \n## 9 管理 Ubuntu 22.04 用户和组\n\n在安装 `Ubuntu` 期间，安装程序创建了一个 `root` 或超级用户账户，并要求配置密码。安装程序还提供了为系统创建用户账户的机会。我们应该记住，`Ubuntu`\
  \ 是一个企业级、多用户且多任务的操作系统。因此，为了充分利用 `Ubuntu` 的力量，可能需要给多个用户访问系统的权限。每个用户都应该有自己的用户账户登录、密码、主目录和权限。\n\
  \n用户被进一步划分为组以便于管理，这些组可以具有不同层级的权限。例如，你可能有一组工作在财务部门的用户。在这样的环境中，你可以创建一个 `accounts`\
  \ 组，并将所有财务部门的用户分配到该组。\n\n本章将介绍在 `Ubuntu` 系统上添加、删除和管理用户及组的步骤。可以使用命令行工具、`Cockpit`\
  \ Web 界面以及桌面 `Settings` 应用在 `Ubuntu` 上管理用户和组。在本章中，我们将查看用户管理的每种方法。\n\n### 9.1 从命令行管理用户\n\
  \n可以通过 `adduser` 工具通过命令行向 `Ubuntu` 系统添加新用户。要创建一个新用户账户，请输入类似下面的命令：\n\n```bash\n#\
  \ adduser john\n```\n\n默认情况下，这将在 `/home` 目录下为该用户创建一个主目录（在本例中为 `/home/john`）。要在创建账户时指定不同的主目录，请使用\
  \ `--home` 命令行选项：\n\n```bash\n# adduser --home /users/john john\n```\n\n`adduser`\
  \ 命令在创建账户时会提示密码。之后可以使用 `passwd` 命令更改密码：\n\n```bash\n# passwd john\nChanging password\
  \ for user john.\nNew password:\nRetype new password:\n```\n\n可以使用 `userdel` 工具通过命令行删除现有用户。虽然这将删除账户，但用户的文件和数据将保持完整：\n\
  \n```bash\n# userdel john\n```\n\n在删除过程中，还可以移除用户的主目录和邮件池：\n\n```bash\n# userdel\
  \ --remove john\n```\n\n`Ubuntu` 系统上的所有用户都是一个或多个组的成员。默认情况下，新用户会被添加到与用户名同名的私有组（在上面的示例中，`john`\
  \ 创建的账户属于名为 `john` 的私有组）。然而，作为管理员，将用户组织成逻辑组是合理的。例如，所有销售可能属于 `sales` 组，财务人员可能属于 `accounts`\
  \ 组，依此类推。可以使用 `groupadd` 命令从命令行添加新组，例如：\n\n```bash\n# groupadd accounts\n```\n\n\
  使用 `usermod` 工具从命令行将现有用户添加到现有组：\n\n```bash\n# usermod -G accounts john\n```\n\n\
  要将现有用户添加到多个现有组，运行带有 `-G` 选项的 `usermod` 命令：\n\n```bash\n# usermod -G accounts,sales,support\
  \ john\n```\n\n注意上述命令会将用户从未列在 `-G` 之后的组移除。要保留当前的组成员，请使用 `-a` 标志附加新的组成员：\n\n```bash\n\
  # usermod -aG accounts,sales,support john\n```\n\n可以使用 `groupdel` 工具从系统删除现有组：\n\n\
  ```bash\n# groupdel accounts\n```\n\n注意，如果要删除的组是任何用户的主要组或初始组，则无法删除。在删除该组之前，必须先删除用户或使用\
  \ `usermod` 命令分配一个新的主要组。可以使用 `usermod -g` 选项为用户分配一个新的主组：\n\n```bash\n# usermod -g\
  \ sales john\n# groupdel accounts\n```\n\n运行 `groups` 命令查找用户所属的组。例如：\n\n```bash\n\
  $ groups john\n\njohn : accounts support\n```\n\n\n\n\n默认情况下，除非用户知道 root 密码，否则用户无法执行需要超级用户（root）权限的任务。然而，可以配置用户账户，使其可以使用\
  \ `sudo` 命令执行特权任务。这涉及到将用户账户添加为 `sudo` 组的成员，例如：\n\n```\nadduser john sudo\n```\n\n\
  一旦被添加到 `sudo` 组，用户将能够按照如下方式使用 `sudo` 执行原本受限的任务：\n\n```bash\napt update\n```\n\n\
  Hit:1 http://us.archive.ubuntu.com/ubuntu jammy InRelease\n\nHit:2 http://security.ubuntu.com/ubuntu\
  \ jammy-security InRelease\n\n```\n\n可以通过编辑 `/etc/sudoers` 文件并找到以下部分来修改 `sudo` 组的\
  \ `sudo` 权限：\n\n### 允许 sudo 组中的成员运行所有命令\n\n```\n%sudo ALL=(ALL) ALL\n```\n\n要禁用所有\
  \ `sudo` 组成员的 `sudo` 权限，请按如下方式注释掉第二行：\n\n### 允许 sudo 组中的成员运行所有命令\n\n```\n# %sudo\
  \ ALL=(ALL) ALL\n```\n\n要允许 `sudo` 组成员在使用 `sudo` 时无需输入密码（出于安全考虑，不建议这样做），请按如下方式修改\
  \ sudoers 文件：\n\n### 无需密码相同\n\n```\n%sudo ALL=(ALL) NOPASSWD: ALL\n```\n\n在后台，所有这些命令仅仅是更改系统上的\
  \ `/etc/passwd`、`/etc/group` 和 `/etc/shadow` 文件。\n\n### 9.2 使用 Cockpit 进行用户管理\n\n\
  如果系统安装并启用了 Cockpit Web 界面（该主题在“Cockpit Web 界面概述”章节中介绍），可以在下方的图 9-1 所示账户屏幕中执行若干用户管理任务：\n\
  \n![](img/cockpit_accounts.jpg)\n\n图 9-1\n\n该屏幕将显示系统上的任何现有用户账户，并提供一个添加额外账户的按钮。要创建新账户，点击“创建新账户”（Create\
  \ New Account）按钮并在弹出的对话框中输入所需信息（见图 9-2）。注意，还可以选择创建账户但稍后将其锁定：\n\n![](img/rhel_cockpit_new_account.jpg)\n\
  \n图 9-2\n\n要修改用户账户，请从主屏幕选择该账户并对账户详情进行修改：\n\n![](img/rhel_cockpit_modify_account.jpg)\n\
  \n图 9-3\n\n此屏幕允许执行各种任务，包括锁定或解锁账户、更改密码或强制用户配置新密码。此外，如果选择了“服务器管理员”（Server Administrator）选项，该用户将被添加到\
  \ `sudo` 组，并允许使用 `sudo` 执行管理任务。此外还提供了一个从系统删除删除用户的按钮。\n\n如果用户使用带有密钥加密的 SSH 连接远程访问系统，可以在此屏幕内添加用户的公钥。SSH\
  \ 访问和认证将在稍后的“在 Ubuntu 22.04 上配置基于密钥的身份验证”中介绍。\n\n### 9.3 使用设置应用进行用户管理\n\n通过 GNOME\
  \ 桌面设置应用提供了第三种用户账户管理选项。通过点击 GNOME 桌面右上角的图标并选择“设置”（Settings）选项可以访问此应用，如图 9-4 所示：\n\
  \n![](img/ubuntu_settings_menu.jpg)\n\n图 9-4\n\n当主设置屏幕出现时，点击左侧导航面板中的“用户”（Users）选项。默认情况下，设置将被锁定，无法对系统上的用户账户进行任何更改。要解锁设置应用，请点击下方图\
  \ 9-5 中的“解锁”（Unlock）按钮并输入密码。注意，只有当以具有 `sudo` 权限的用户身份登录时，才能解锁设置：\n\n![](img/ubuntu_settings_users.jpg)\n\
  \n图 9-5\n\n应用解锁后，标题栏将出现一个标记为“添加用户...”（Add User...)的按钮。点击此按钮显示下方图 9-6 所示的对话框：\n\n\
  ![](img/ubuntu_settings_add_user.jpg)\n\n图 9-6\n\n选择“管理员”（Administrator）账户为新用户分配\
  \ `sudo` 权限；否则，保留“标准”（Standard）。接下来，输入用户的全名和用户名，现在分配密码，或允许用户在首次登录账户时设置密码。输入信息后，点击“添加”（Add）按钮创建账户。\n\
  \n可以随时通过选择“用户”（Users）屏幕内相应的图标来查看、修改现有用户的设置或删除该账户，如图图 9-7 所示。还提供了查看用户登录活动的选项。注意，在对账户进行任何更改之前，必须再次解锁设置应用：\n\
  \n![](img/ubuntu_settings_edit_user.jpg)\n\n图 9-7\n\n### 9.4 总结\n\n作为一个多用户操作系统，Ubuntu\
  \ 的设计旨在支持对多个用户的受控访问。在安装期间，创建了 root 用户账户并分配了密码，还提供了创建用户账户的选项。可以使用一组命令行工具向系统添加额外的用户账户，也可以通过\
  \ Cockpit Web 界面或 GNOME 设置应用。除了用户账户外，Linux 还实现了组的概念。默认情况下，标准用户没有权限执行特权任务。然而，属于特殊\
  \ `sudo` 组的用户可以使用 `sudo` 命令执行特权任务。\n\n\n\n\n\n- `poweroff.target` - 该目标会关闭系统。你不太可能希望将其作为默认目标。\n\
  - `rescue.target` – 导致系统以单用户模式启动，模式下只有 root 用户可以登录。在此模式下，系统不会启动任何网络、图形化用户界面或多用户服务。此运行级别适用于系统管理员执行系统维护或修复活动。\n\
  - `multi-user.target` - 将系统引导到具有文本控制台登录能力的多用户模式。\n- `graphical.target` - 将系统引导到具有\
  \ X Window System 能力的联网、多用户状态。默认情况下，图形化桌面环境将在启动过程结束时启动。这是桌面或工作站最常用的运行级别。\n- `reboot.target`\
  \ - 重启系统。这是另一个目标，由于显而易见的原因，你不太可能希望将其作为默认。\n\n除了上述目标外，系统还包含约 70 个其他目标，其中许多是上述主目标使用的子目标。在后台，例如，`multi-user.target`\
  \ 还会启动一个名为 `basic.target` 的目标，该目标反过来启动 `sockets.target` 单元，这是不同进程之间通信所需的。这确保了多用户目标所依赖的所有服务在启动过程中也会启动。\n\
  \n可以通过在终端窗口中运行以下命令来查看指定目标所依赖的目标和服务的列表：\n\n```bash\nsystemctl list-dependencies <target>\n\
  ```\n\n例如，图 11-1 显示了图形目标 systemd 单元依赖关系的部分列表（完整列表包含了全功能多用户系统运行所需的 140 多个目标和服务）：\n\
  \n![](img/ubuntu_systemd_dependencies.jpg)\n\n图 10-1\n\n该列表以分级树的形式呈现，说明了某些依赖项具有自己的子依赖项。例如，滚动到列表底部，会发现图形目标依赖于一个名为\
  \ `cloud-init.target` 的云相关服务，该服务反过来又有自己的服务依赖项：\n\n![](img/ubuntu_systemd_subdependencies.jpg)\n\
  \n图 10-2\n\n列表中每个条目左侧的彩色点表示该服务或目标的当前状态，如下：\n\n- **绿色** - 服务或目标处于激活并运行状态。\n- **白色**\
  \ - 服务或目标处于非激活（死亡）状态。通常是因为服务或目标尚未启用、由于某些原因被停止，或服务或目标所依赖的条件未满足。\n- **红色** - 服务或目标由于致命错误未能启动。\n\
  \n要了解更多关于 systemd 单元状态的详情，请使用 `systemctl status` 命令加上单元名称，如下：\n\n```bash\nsystemctl\
  \ status systemd-machine-id-commit.service\n```\n\n```\n○ systemd-machine-id-commit.service\
  \ - Commit a transient machine-id on disk\n      Loaded: loaded (/usr/lib/systemd/system/systemd-machine-id-commit.service;\
  \ static)\n      Active: inactive (dead)\n      Condition: start condition failed\
  \ at Thu 2023-03-30 08:41:05 EDT; 16min ago\n               └─ ConditionPathIsMountPoint=/etc/machine-id\
  \ was not met\n      Docs: man:systemd-machine-id-commit.service(8)\n```\n\n## 10.4\
  \ 识别和配置默认目标\n\n可以使用以下 `systemctl` 命令识别 Ubuntu 系统的当前默认目标：\n\n```bash\nsystemctl get-default\n\
  ```\n\n`multi-user.target`\n\n在上述情况下，系统配置为默认使用 `multi-user.target` 启动。可以使用 `systemctl`\
  \ 命令配合 `set-default` 选项随时更改默认设置。以下示例将默认目标更改为下次系统启动时启动图形化用户界面：\n\n```bash\nsystemctl\
  \ set-default graphical.target\n```\n\n```\nRemoved /etc/systemd/system/default.target.\n\
  Created symlink /etc/systemd/system/default.target → /usr/lib/systemd/system/graphical.target.\n\
  ```\n\n默认更改操作的输出显示了 `systemctl` 命令在后台执行以实施更改的步骤。当前默认设置是通过从位于 `/etc/systemd/system`\
  \ 的 `default.target` 文件建立符号链接，指向 `/usr/lib/systemd/system` 文件夹中对应的目标文件（在本例中，为 `graphical.target`\
  \ 文件）。\n\n## 10.5 理解 systemd 单元和单元类型\n\n如前所述，目标和服务都是 systemd 单元的类型。`/usr/lib/systemd/system`\
  \ 文件夹中的所有文件都被称为 systemd 单元配置文件，每个文件代表一个 systemd 单元。每个单元又被归类为特定的单元类型。Ubuntu 支持 12\
  \ 种不同的单元类型，包括本章已涵盖的目标单元和服务单元类型。\n\n单元文件的类型由表 10-1 所示的文件扩展名表示：\n\n| 单元类型 | 文件名扩展名\
  \ | 类型描述 |\n| :--- | :--- | :--- |\n| Service | .service | 系统服务。 |\n| Target | .target\
  \ | systemd 单元组。 |\n| Automount | .automount | 文件系统自动挂载点。 |\n| Device | .device\
  \ | 内核识别的设备文件。 |\n| Mount | .mount | 文件系统挂载点。 |\n| Path | .path | 文件系统中的文件或目录。 |\n\
  | Scope | .scope | 外部创建的进程。 |\n| Slice | .slice | 管理系统进程的分层次组织单元组。 |\n| Snapshot\
  \ | .snapshot | systemd 管理器状态。 |\n| Socket | .socket | 进程间通信接字。 |\n| Swap | .swap\
  \ | 交换设备或交换文件。 |\n| Timer | .timer | systemd 定器。 |\n\n表 10-1\n\n注意，目标单元类型与其他类型的不同之处在于，它由一组服务或其他目标等\
  \ systemd 单元组成。\n\n## 10.6 动态更改当前目标\n\n之前介绍的 `systemctl set-default` 命令指定系统下次启动时将使用的目标，但不会更改当前系统的状态。要动态切换到不同的目标，请再次使用\
  \ `systemctl` 命令，使用 `isolate` 选项后跟目标。例如，要在不重启的情况下将当前系统切换到图形目标，可以使用以下命令：\n\n```bash\n\
  systemctl isolate graphical.target\n```\n\n执行后，系统将启动图形环境。\n\n### 10.7 启用、禁用和屏蔽 systemd\
  \ 单元\n\n新安装的 Ubuntu 系统将包含基础 systemd 单元，但可能不包含生产环境所需的所有服务。例如，基础安装不会包含运行 Apache Web\
  \ 服务器所需的包，其关键元素是 `apache2.service` 单元。\n\n系统管理员将通过以下命令安装必要的 `apache2` 包来解决这个问题：\n\
  \n```bash\napt install apache2\n```\n\n配置 Web 服务器后，下一个任务是检查 `apache2` 服务的状态以识别它是否在安装时被激活：\n\
  \n```bash\nsystemctl status apache2.service\n```\n\n```\n● apache2.service - The\
  \ Apache HTTP Server\n      Loaded: loaded (/lib/systemd/system/apache2.service;\
  \ disabled; vendor preset>\n      Active: active (running) since Mon 2023-07-17\
  \ 14:01:13 UTC; 40s ago\n      Docs: https://httpd.apache.org/docs/2.4/\n      Main\
  \ PID: 22328 (apache2)\n      Tasks: 55 (limit: 4517)\n      Memory: 4.7M\n    \
  \         CPU: 24ms\n      CGroup: /system.slice/apache2.service\n             \
  \ ├─22328 /usr/sbin/apache2 -k start\n              ├─22329 /usr/sbin/apache2 -k\
  \ start\n              └─22330 /usr/sbin/apache2 -k start\n```\n\n注意，服务状态可能被列为加载但非激活，这是因为供应商预设在首次安装时为禁用的。要启动非激活服务，可以使用以下命令：\n\
  \n\n\n\n\n# `systemctl start apache2.service`\n\n在上面的示例输出中，状态（status）表明该服务已禁用（disabled）。这意味着系统下次重启时，`apache2`\
  \ 服务将不会自动启动，而需要系统管理员手动启动。\n\n要配置服务在每次系统启动时自动运行，必须按如下方式启用：\n\n```bash\nsystemctl\
  \ enable apache2.service\n```\n\n当前正在运行的服务可以随时按如下方式停止：\n\n```bash\nsystemctl stop\
  \ apache2.service\n```\n\n现在服务已启用，当系统下次重启到当前目标（target）时，`apache2` 服务将自动启动。例如，假设系统在运行多用户目标（multi-user\
  \ target）时启用了该服务，`apache2` 服务将作为另一个依赖项添加到 `multi-user.target` systemd 单元中。\n\n在后台，`systemctl`\
  \ 通过在 `/etc/systemd/system` 文件夹内对应的 `.wants` 文件夹中创建符号链接为目标添加依赖项。例如，`multi-user.target`\
  \ 单元在 `/etc/systemd/system` 中有一个名为 `multi-user.target.wants` 的文件夹，其中包含指向 `/usr/lib/systemd/system`\
  \ 中其所依赖的所有 systemd 单元的符号链接。检查此文件夹将显示与之前介绍的 `systemctl list-dependencies` 命令列出的依赖项之间的相关性。\n\
  \n要配置服务使其不再作为目标依赖项自动启动，请按如下方式禁用（disable）：\n\n```bash\nsystemctl disable apache2.service\n\
  ```\n\n此命令将删除 `.wants` 目录中指向 `apache2.service` 单元文件的符号链接，使其不再成为依赖项，因此在系统下次启动时将不会被启动。\n\
  \n`.wants` 文件夹包含依赖项，如果这些依赖项不可用，不会阻止单元的启动和运行。强制依赖项（换句话说，如果不可用会导致单元失败的依赖项）应该放在 `.requires`\
  \ 文件夹中（例如，`multi-user.target.requires`）。\n\n除了启用和禁用，还可以如下方式掩码（mask）systemd 单元：\n\
  \n```bash\nsystemctl mask apache2.service\n```\n\n被屏蔽的 systemd 单元在任何情况下都无法启用、禁用或启动，即使它被列为另一个单元的依赖项。就系统而言，就好像被屏蔽的\
  \ systemd 单元不存在了。这对于确保单元无论系统条件如何永远不启动非常有用。重新访问服务的唯一方法是取消屏蔽（unmask）：\n\n```bash\n\
  systemctl unmask apache2.service\n```\n\n### 10.8 在 Cockpit 中处理 systemd 单元\n\n除了本章概述的命令行技术外，还可以从\
  \ Cockpit Web 界面内部查看和管理 systemd 单元。例如，假设 Cockpit 已按照“Cockpit Web 界面概述”章节所述的方法进行了安装和设置，可以通过登录\
  \ Cockpit 并选择左侧导航面板中标记为 A 的 `Services` 选项图 10-3]来访问系统的 systemd 单元列表：\n\n![](img/ubuntu_cockpit_services.jpg)\n\
  \n图 10-3\n\n标记为 B 的选项行在标记为 C 的主区域显示特定类型的单元，其中每个单元的当前状态列在 `State` 列中。\n\n从列表中选择单元将显示详细信息。例如图\
  \ 10-4 以及用于执行启动、停止、启用/禁用和屏蔽/取消屏蔽单元等任务的开关和菜单 (B)：\n\n![](img/ubuntu_cockpit_apache_service.jpg)\n\
  \n图 10-4\n\n### 10.9 总结\n\n新安装的 Ubuntu 系统包含一组基础 systemd 单元，其中许多单元在后台运行以提供系统的大部分功能。这些单元按类型分类，最常见的是目标（targets）和服务单元（services）。目标单元是一组要共同启动的其他单元。系统有一个默认目标单元，定义了每次系统启动时要启动的其他单元。最常见的目标是那些将系统引导到多用户模式或图形模式的目标。此外，`systemctl`\
  \ 命令行工具为执行 systemd 单元配置任务提供了一系列选项，其中许多选项也可以通过 Cockpit Web 界面可用。\n\n# 11 Ubuntu 软件包管理与更新\n\
  \n新安装的 Ubuntu 系统极不太可能包含执行其预期任务所需的所有软件包。即使在安装了所有所需软件后，几乎可以确定在系统的生命周期内，许多软件包会发布更新版本。在某些情况下，您需要确保在系统上安装这些最新的软件包版本，以修复漏洞和安全风险。\n\
  \n本章介绍了 Ubuntu 软件管理的基本概念，解释了如何解决这些问题，并探索了仓库（repositories）和软件包的概念，同时探索了如何列出、安装和移除组成运行\
  \ Ubuntu 系统的软件包。\n\n### 11.1 仓库\n\nLinux 本质上由一组提供操作系统核心功能的基础软件包，以及一系列在基础操作系统之上添加功能和特性的软件包和模块组成。\n\
  \n首次安装 Ubuntu 时，将根据安装阶段选择的软件选项安装许多不同的软件包。然而，一旦系统运行，就可以需要安装额外的软件。通常，所有属于 Ubuntu 的软件（换句话说，不是由第三方供应商提供的软件）都是使用高级软件包工具（`apt`）命令下载并安装到系统上的。正如我们在前面的章节中看到的，这通常涉及在提示符处执行类似下面的命令：\n\
  \n```bash\napt install apache2\n```\n\n当执行此类命令时，请求的软件将从远程仓库并安装到本地系统。默认情况下，Ubuntu\
  \ 配置为从多个不同的仓库下载软件：\n\n- `main`：包含 Ubuntu 官方支持、测试和更新的核心软件包集。\n- `restricted`：对于存在开源替代品的硬件设备的专有驱动程序。\n\
  - `universe`：包含 Canonical Ubuntu 团队未官方支持的软件包。然而，这些软件包由 Ubuntu 社区维护，并包含 `main` 仓库中不可用的软件包。\n\
  - `multiverse`：由于版权或其他法律问题，可能不符合 Ubuntu 发布时的开源许可条款的软件包。\n\nUbuntu 系统上当前启用的仓库列表包含\
  \ `/etc/apt/sources.list` 文件中，可以将其加载到编辑器中查看和修改。可以手动将文件加载到编辑器，或使用可选的编辑器进行编辑：\n\n\
  ```bash\napt edit-sources\n```\n\n该文件的前几行通常引用 `main` 和 `restricted` 仓库，例如：\n\n```\n\
  deb http://ports.ubuntu.com/ubuntu-ports/ jammy main restricted own\n```\n\n在上面的示例中，配置允许从\
  \ `main` 和 `restricted` 仓库下载软件包。文件中还包含 `universe` 和 `multiverse` 仓库的条目：\n\n## 注意：此仓库中的软件测试范围可能不如主发行版中的软件，尽管它包含了一些应用程序的新版本，这些版本可能提供有用的功能。\n\
  \n\n\n\n\n## 此外，请注意，backports 中的软件**不会**收到来自 Ubuntu 安全团队的任何审核或更新。\n\n```\ndeb http://us.archive.ubuntu.com/ubuntu/\
  \ jammy-backports main restricted universe multiverse\n```\n\n要禁用某个存储库使其不再用于下载软件包，只需在行首前面加一个\
  \ `#` 字符将其注释掉即可：\n\n```\n#deb http://ports.ubuntu.com/ubuntu-ports/ jammy-backports\
  \ main restricted universe multiverse\n```\n\n除了标准存储库，还有许多第三方存储库。如果您需要使用其中之一，只需在\
  \ `sources.list` 文件中为其添加一个条目即可。其中一个示例是合作伙伴（partners）存储库，可以如下所示添加到 `sources.list`\
  \ 文件：\n\n```\ndeb http://archive.canonical.com/ubuntu jammy partner\n```\n\n进行更改后，运行以下命令以提交更改：\n\
  \n```bash\n# apt update\n```\n\n## 11.2 使用“软件与更新”管理存储库\n\n作为使用命令行的替代方案，可以在 GNOME\
  \ 桌面环境中中使用“软件与更新”（`Software & Updates`）应用配置存储库。要启动此应用，按下键盘上的特殊键（在 Windows 键盘上是 Windows\
  \ 键，在 macOS 上是 Command 键，在 Chromebook 上是显示放大镜的键），并在搜索栏中输入 `Software & Updates`。在结果面板中点击相应的图标启动该应用。或者，打开终端窗口并运行以下命令：\n\
  \n```bash\n$ update-manager\n```\n\n当应用加载时，点击图 11-1 所示的“设置”（Settings）按钮：\n\n![](img/ubuntu_updates_available.jpg)\n\
  \n图 11-1\n\n在设置界面中，启用或禁用“从互联网下载”（Downloadable from the Internet）标题下列出的所需存储库：\n\n\
  ![](img/ubuntu_software_and_updates.jpg)\n\n图 11-2\n\n要启用合作伙伴存储库，选择图 11-3 所示的“其他软件”（Other\
  \ Software）选项卡：\n\n![](img/ubuntu_updates_other_software.jpg)\n\n图 11-3\n\n要添加其他第三方存储库，点击“添加...”（Add...）按钮并在弹出的对话框中输入存储库信息：\n\
  \n![](img/ubuntu_add_repo.jpg)\n\n图 11-4\n\n### 11.3 使用 APT 管理软件包\n\n`apt` 工具提供了一种直接从命令行执行大多数软件包管理任务的方法。在本节中，我们将探索一些更常用的\
  \ `apt` 命令行选项。\n\nUbuntu 系统保留了最新软件包信息的本地副本，因此，建议在执行任何其他 `apt` 操作之前按照如下方式更新此列表：\n\
  \n```bash\n# apt update\n```\n\n最常见的 `apt` 活动之一是执行软件包安装：\n\n```bash\n# apt install\
  \ package_name\n```\n\n同样，可以使用 `remove` 选项从系统中删除已安装的软件包：\n\n```bash\n# apt remove\
  \ package_name\n```\n\n当以这种方式删除软件包时，与软件包关联的配置文件将保留在系统中。这允许在稍后重新安装软件包而不会丢失任何自定义配置设置。若想在删除期间或在删除删除完成后删除这些文件，请使用\
  \ `purge` 选项：\n\n```bash\n# apt purge package_name\n```\n\n要获取可用安装的软件包列表，如下所示使用\
  \ `apt`：\n\n```bash\n# apt list\n```\n\n或者，仅列出已安装的软件包，请使用带有 `--installed` 标志的 `list`\
  \ 选项：\n\n```bash\n# apt list --installed\n```\n\n要检查系统中是否已安装特定软件包，将 `list` 选项与软件包名结合：\n\
  \n```bash\n# apt list package_name\n```\n\n使用 `search` 选项列出所有符合特定标准的软件包。例如，列出所有与\
  \ Apache Web 服务器相关的软件包：\n\n```bash\n# apt search apache\n```\n\n要查找哪个软件包包含特定文件，请使用\
  \ `apt-file` 命令。例如，列出包含名为 `gimp` 文件的软件包名称：\n\n```bash\n# apt-file --package-only\
  \ list gimp\n```\n\n要查看软件包的详细信息，运行带有 `show` 选项的 `apt`：\n\n```bash\n# apt show apache2\n\
  ```\n\n运行上述命令的典型输出如下：\n\n```\nPackage: apache2\nVersion: 2.4.52-1ubuntu4.5\nPriority:\
  \ optional\nSection: web\nOrigin: Ubuntu\nMaintainer: Ubuntu Developers <ubuntu-devel-discuss@lists.ubuntu.com>\n\
  Original-Maintainer: Debian Apache Maintainers <debian-apache@lists.debian.org>\n\
  Bugs: https://bugs.launchpad.net/ubuntu/+filebug\nInstalled-Size: 546 kB\nProvides:\
  \ httpd, httpd-cgi\nPre-Depends: init-system-helpers (>= 1.54~)\nDepends: apache2-bin\
  \ (= 2.4.52-1ubuntu4.5), apache2-data (= 2.4.52-1ubuntu4.5), apache2-utils (= 2.4.52-1ubuntu4.5),\
  \ lsb-base, mime-support, perl:any, procps\nRecommends: ssl-cert\nSuggests: apache2-doc,\
  \ apache2-suexec-pristine\n```\n\n### 11.4 执行更新\n\n在基础操作系统和已安装软件包的生命周期内，发布多次更新以解决问题并添加功能。要从命令行手动下载待处理更新，第一步是使用\
  \ `apt` 的 `update` 选项更新软件包信息：\n\n```bash\n# apt update\n```\n\n一旦软件包信息已更新，即可执行升级。这将从\
  \ `sources.list` 文件中配置的存储库下载更新：\n\n```bash\n# apt upgrade\n```\n\n作为使用命令行的替代方案，可以使用“软件与更新”应用更新系统。如果有可用更新，将显示图\
  \ 11-5 所示的对话框：\n\n![](img/ubuntu_details.jpg)\n\n图 11-5\n\n### 11.5 启用自动更新\n\n上一节介绍了如何手动安装软件包升级。Ubuntu\
  \ 系统也可以配置为自动安装升级。这既可以通过命令行配置，也可以在“软件与更新”工具内部配置。\n\n在“软件与更新”工具内部，按照之前的概述打开设置界面，点击“更新”（Updates）选项卡以显示图\
  \ 11-6 所示的屏幕：\n\n![](img/ubuntu_update_settings.jpg)\n\n图 11-6\n\n选择系统检查更新的频率（每天、隔天、每周等）。接下来，选择在可用更新时执行的操作（仅下载、下载并安装或在桌面上显示通知）。您还可以配置更新程序让您知道是否有新版本的\
  \ Ubuntu。\n\n要从命令行配置自动更新，请按照以下步骤操作：\n\n1. 安装 `unattended-upgrades` 软件包：\n\n```bash\n\
  # apt install unattended-upgrades\n```\n\n2. 编辑 `/etc/apt/apt.conf.d/50unattended-upgrades`\
  \ 文件并找到以下行：\n\n```\n\n\n    \"${ro_id}}MAppsAppsdistro_codename}-apps-security\"\
  ;\n    \"${distro_id}ESM:${distro_codename}-infra-security\";\n// \"${distro_id}:${distro_codename}-updates\"\
  ;\n// \"${distro_id}:${distro_codename}-proposed\";\n// \"${distro_id}:${distro_codename}-backports\"\
  ;\n.\n```\n\n3. 从要自动安装更新的存储库类型中移除 `//` 注释标记。\n\n\n\n\n\n### 4. 编辑 `/etc/apt/apt.conf.d/20auto-upgrades`\
  \ 文件并声明系统检查更新的频率（以天为单位）：\n\n```\nAPT::Periodic::Update-Package-Lists \"1\";\nAPT::Periodic::Download-Upgradeable-Packages\
  \ \"1\";\nAPT::Periodic::AutocleanInterval \"0\";\nAPT::Periodic::Unattended-Upgrade\
  \ \"1\";\n```\n\n### 4. 执行干运行（dry run）更新以确保设置有效：\n\n```bash\nunattended-upgrades\
  \ --dry-run --debug\n```\n\n配置自动更新几天后，检查日志文件以确认更新是否按计划进行：\n\n```bash\ncat /var/log/unattended-upgrades/unattended-upgrades.log\n\
  ```\n\n### 11.6 启用 Ubuntu Pro\n\nUbuntu Pro 是 Canonical 提供的的一种订阅服务，为您已安装的 Ubuntu\
  \ 版本包含的所有软件包以及您可能安装的大多数应用程序提供十年的更新。Ubuntu Pro 最初仅向付费客户提供，现在对个人用户在多五台系统上是免费的。\n\n\
  Ubuntu Pro 订阅包含一项名为 Livepatch 的功能。题为 “Ubuntu Linux 简史 的章节解释了内核如何为 Linux 操作系统提供基础，管理系统资源并处理硬件与应用程序之间的通信。\n\
  \n与任何软件一样，内核也需要更新以修复漏洞并解决潜在的安全漏洞。虽然大多数软件包可以在不需要重启操作系统的情况下进行更新，但在历史上，内核的情况并非如此。随着\
  \ Livepatch 的引入，Ubuntu 的情况已发生改变。\n\nLivepatch 允许在运行的 Ubuntu 系统运行时对内核进行打补丁，而无需重启系统。\n\
  \n启用 Ubuntu Pro 的第一步是如果您还没有账户，请在以下 URL 创建一个 Ubuntu One 账户：\n\n[`login.ubuntu.com/`](https://login.ubuntu.com/)\n\
  \n创建账户后，请留在浏览器窗口并导航到以下 URL：\n\n[`ubuntu.com/pro`](https://ubuntu.com/pro)\n\n在 Ubuntu\
  \ Pro 网页上，点击“个人使用注册”（Register for personal use）按钮，在生成的页面上，复制如图 11-7 (#Ubuntu_Package_Management.xhtml__idTextAnchor210)\
  \ 所示的免费个人令牌（Free Personal Token）：\n\n![](img/ubuntu_pro_token.jpg)\n\n复制令牌后，在命令行提示符中运行以下命令安装\
  \ Ubuntu Pro：\n\n```bash\napt install ubuntu-advantage-pro ubuntu-advantage-tools\n\
  ```\n\n安装完成后，运行以下命令将系统附加到 Ubuntu Pro，其中“`<pro token>`”替换为您之前复制的令牌：\n\n```bash\n\
  pro attach <pro token>\n```\n\n检查 Ubuntu Pro 状态，运行以下命令：\n\n```bash\npro status --all\n\
  ```\n\n| 授权服务 | 状态 | 描述 |\n| :--- | :--- | :--- |\n| cc-eal | yes n/a | Common 标准\
  \ EAL2 备包 |\n| esm-apps | yes enabled | 应用程序的扩展安全维护 |\n| esm-infra | yes enabled\
  \ | 基础设施的扩展安全维护 |\n| fips | yes n/a | NIST 认证核心包 |\n| fips-updates | yes n/a | 具有优先安全更新的\
  \ NIST 认证核心包 |\n| livepatch | yes warning | 当前内核不支持 |\n| realtime-kernel | yes enabled\
  \ | 集成了 PREEMPT_RT 补丁的 Ubuntu 内核 |\n| ├ generic | yes enabled | 通用 RT 内核（默认） |\n\
  | └ intel-iotg | yes enabled | 为 Intel IOTG 平台优化的 RT 内核 |\n| ros | yes n/a | 机器人操作系统的安全更新\
  \ |\n| ros-updates | yes n/a | 机器人操作系统的所有更新 |\n| usg | yes disabled | 安全合规与审计工具\
  \ |\n\n使用 `pro enable <service>` 启用服务：\n\n账户：demo@example.com\n订阅：Ubuntu Pro - 免费个人订阅\n\
  \n运行以下命令从 Ubuntu Pro 中解离系统：\n\n```bash\npro detach\n```\n\n### 11.7 总结\n\nUbuntu\
  \ 操作系统由数千个软件包组成，这些软件包从主、受限（restricted）、宇宙（universe）、多媒体（multiverse）、伙伴（partner）和第三方存储库下载并安装。\n\
  \n软件包使用高级软件包工具 (`apt`) 或多个图形桌面工具之一进行安装，并从 `sources.list` 文件定义的存储库下载。\n\n除了安装和删除软件包外，`apt`\
  \ 还可用于将这些软件包升级到最新更新。这些软件升级可以手动进行，也可以配置为自动更新。\n\nUbuntu Pro 是一种订阅服务，为系统软件包和应用程序提供十年的更新。过去，对操作系统内核的更新需要重启系统。Ubuntu\
  \ Pro 包含了 Livepatch，它允许 Ubuntu Linux 内核在不中断系统的情况下进行动态更新。\n\n### 12. Ubuntu Snap\
  \ 软件包管理\n\n上一章探讨了使用高级软件包工具 (APT) 在 Ubuntu 系统上安装和更新软件包软件包。近年来，Canonical, Ltd. 的 Ubuntu\
  \ 团队一直在开发一种名为 Snap 的新软件包管理系统。虽然没有完全用 Snap 替换 APT 的官方计划，但现在可以作为“snaps”安装的软件包列表仍在不断增长。\n\
  \n本章的目标是介绍 Snap 系统，突出其相对于 APT 系统的主要优势，并概述如何使用 `snap` 命令行工具来安装和管理基于 snap 的软件包。\n\n\
  #### 12.1 使用 Snap 管理软件\n\n`apt` 工具安装以 `.deb` 文件格式封装的软件。使用 `apt` 安装的软件包通常依赖于其他需要安装的软件包。在安装期间，`apt`\
  \ 会同时安装这些额外的依赖项。\n\n考虑一个依赖于特定图像库的图形设计应用程序。在安装期间，`apt` 会安装该应用程序包以及包含该库的包。现在，假设用户决定安装另一个同样依赖该库的图形工具。通常这不会成为问题，因为两个程序将共享同一个库，但如果两个程序依赖于不同版本的库，就会出现问题。安装第二个程序可能会导致第一个程序无法工作。\n\
  \n`apt` 和 `.deb` 软件包的另一个局限性是难以并行安装同一工具的多个版本。例如，用户可能希望在保留 1.0 版本图形程序的同时，尝试 2.0 版本的测试版。在尝试\
  \ 2.0 版本后，用户可能想要删除 1.0 版本并只保留新版本，这种任务在使用 `apt` 时很难实现。\n\nSnap 系统的设计专门是为了解决这些局限性。`snap`\
  \ 工具安装 `.snap` 软件包，其中包含了运行软件所需的所有库和资源。这避免了将依赖项作为独立的软件包进行安装。一旦安装了 snap，它会被放置在自包含的位置，因此不会与其他软件包共享依赖项。\n\
  \n当然，使用 snap 会导致软件包变大，从而导致下载时间变长、安装性能变慢并占用更多磁盘空间。尽管如此，这些缺点通常被 snap 软件包的优势所抵消。\n\n\
  Snap 还支持“通道”（channels）的概念，允许开发者发布同一应用程序的不同版本。Snap 通道是允许并行安装同一软件多个版本的机制。\n\n### 12.2\
  \ 基础 Snap 命令\n\n\n\n\n\n尽管许多软件包软件包仍以 `.deb` 格式提供并使用 `apt` 安装，但现在以 snap 格式提供的应用和工具数量正在迅速增加。事实上，Ubuntu\
  \ 软件工具中列出的所有软件（在上一章名为“GNOME 3 桌面之旅”的章节中概述）都是使用 `snap` 进行封和和安装的。基于 snap 的软件也可以使用\
  \ `snap` 命令行工具进行安装，本节将介绍其基础知识。\n\n要列出特定类别软件的可用 snap 软件包，请运行类似下方的命令：\n\n```bash\n\
  snap find \"image editor\"\n```\n\n| 名称 | 版本 | 发布者 | 备注/摘要 |\n| :--- | :--- | :---\
  \ | :--- |\n| gimp | 2.10.18 | snapcrafters | - GNU 图像处理程序 |\n| paintsupreme-3d\
  \ | 1.0.41 | braindistrict | - PaintSupreme 3D |\n\n上述命令将列出所有可下载和安装的、与图像编辑某种程度上相关的\
