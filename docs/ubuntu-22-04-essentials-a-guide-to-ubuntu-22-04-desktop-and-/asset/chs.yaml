- "# Ubuntu 22.04 核心：Ubuntu 22.04 桌面版与服务器版指南\n\n\n\n![](img/ubuntu_22.04_front_cover_large_pubdrive.png)\n\
  \n\n\n\n\n\n\n\n## 1. 引言\n\nUbuntu 可以说是当今最受推崇和最广泛使用的 Linux 发行版之一。Ubuntu 以其易用性和可靠性备受赞誉，同时也拥有一批忠实的\
  \ Linux 用户群体和一个活跃的开发者社区。\n\n《Ubuntu 22.04 基础》旨在提供有关 Ubuntu 发行版安装、使用和管理的详尽信息。对于初学者，本书涵盖了如操作系统安装、GNOME\
  \ 桌面环境基础、配置电子邮件和 Web 服务器以及安装软件包和系统更新等主题。书中还涵盖了额外的安装主题，例如与 Microsoft Windows 的双启动，以及所有重要的安全主题，例如配置防火墙以及用户和组管理。\n\
  \n对于经验丰富的用户，书中详细介绍了远程桌面访问、Cockpit Web 界面逻辑卷管理 (LVM)、磁盘分区、交换空间管理、KVM 虚拟化、安全外壳 (SSH)、Linux\
  \ 容器以及使用 Samba 和 NFS 进行文件共享等主题，以提供这一企业级操作系统的全面概述。\n\n### 1.1 超级用户规范\n\nUbuntu 与普通\
  \ Linux 一样有两种用户账户：一种是标准用户账户，对操作系统的许多管理文件和功能的访问受限；另一种是具有特权权限的超级用户（root）账户。通常，用户可以通过登录\
  \ root 用户或使用 `su -` 命令并输入 root 密码来获取 root 权限。在下面的示例中，用户通过 `su -` 命令获取 root 权限：\n\
  \n```\n[demo@demo-server ~]$ su -\n\nPassword:\n\n[demo@demo-server]#\n```\n\n注意，普通用户的命令提示符以\
  \ `$` 符号结尾，而 root 用户则是 `#` 字符。在命令行中工作时，这是一个非常有用的指示，可以判断你当前正在以 root 用户身份发布命令。\n\n\
  如果 `su -` 命令失败，系统上的 root 账户可能出于安全原因已被禁用。在这种情况下，可以使用 `sudo` 命令，如下文所示。\n\n使用 `sudo`，非\
  \ root 用户可以执行需要 root 权限的单条命令。考虑以下尝试使用最新的补丁和软件包更新操作系统：\n\n```bash\n$ apt update\n\
  \nReading package lists... Done\n\nE: Could not open lock file /var/lib/apt/lists/lock\
  \ - open (13: Permission denied)\n```\n\n可选地，可以配置用户账户使其拥有 root 级权限。用户无需使用 `su -`\
  \ 命令先获取 root 权限，具有管理权限的用户账户可以使用 `sudo` 运行原本受限的命令：\n\n```bash\n$ sudo apt update\n\
  \n[sudo] password for demo:\n\nHit:1 http://us.archive.ubuntu.com/ubuntu bionic\
  \ InRelease\n```\n\n为了在不重复使用 `sudo` 命令的情况下执行多个命令，可以通过以下方式访问具有持久超级用户权限的命令提示符：\n\n\
  ```\n[demo@demo-server]$ sudo su -\n\n[demo@demo-server]#\n```\n\n在本书开头尽早提出这个问题的原因是，书中概述的许多命令行示例都需要\
  \ root 权限。与其重复地在每个命令行示例前加上如何以 root 身份运行命令的说明，将使用行首的命令提示符来指示是否需要以 root 身份执行命令。如果命令可以作为普通用户运行，该命令将以\
  \ `$` 命令提示符为开头，如下：\n\n```bash\n$ date\n```\n\n相反，如果命令需要 root 权限，则命令将以 `#` 命令提示符为前：\n\
  \n```bash\n# apt install openssh-server\n```\n\n### 1.2 打开终端窗口\n\n如果您正在使用 GNOME\
  \ 桌面并需要访问命令提示符，将需要打开一个终端窗口。可以通过右键点击桌面背景并选择“在终端中打开”菜单选项来实现如图 1-1 所示：\n\n![](img/ubuntu_open_in_terminal.jpg)\n\
  \n图 1-1\n\n也可以使用快捷键 `Ctrl-Alt-T` 在 GNOME 桌面内打开终端窗口。\n\n### 1.3 编辑文件\n\n配置 Linux\
  \ 系统通常涉及编辑文件。对于 Linux 新手来说，他们可能不清楚应该使用哪种编辑器。如果您正在运行终端会话且尚没有偏好的编辑器，我们建议使用 `nano`\
  \ 编辑器。要在终端窗口中启动 `nano`，请输入以下命令：\n\n```bash\n# nano <file>\n```\n\n其中 `<file>` 替换为要编辑的文件路径。例如：\n\
  \n```bash\n# nano /etc/passwd\n```\n\n一旦加载，`nano` 将如图 1-2 所示出现：\n\n![](img/ubuntu_18.04_nano.jpg)\n\
  \n图 1-2\n\n可以通过以下方式运行 `nano` 创建新文件：\n\n```bash\n# nano\n```\n\n完成编辑后，使用 `Ctrl-S`\
  \ 保存文件，然后使用 `Ctrl-X` 退出。打开现有文件，请使用 `Ctrl-R` 快捷键。\n\n如果您偏于在 GNOME 环境中使用图形化编辑器，`gedit`\
  \ 是基础编辑任务的良好起点。从桌面启动 `gedit` 请按 `Alt-F2` 显示如图 1-3 所示：\n\n![](img/ubuntu_run_command.jpg)\n\
  \n图 1-3\n\n在文本框中输入 `gedit` 并按回车键。稍后，`gedit` 将加载并准备打开、创建和编辑文件：\n\n![](img/ubuntu_gedit.jpg)\n\
  \n图 1-4\n\n或者，从终端窗口带上文件路径运行 `gedit`：\n\n```bash\n# gedit\n# gedit /etc/passwd\n\
  ```\n\n### 1.4 反馈\n\n我们希望您对购买本书满意。如果您在书中发现任何错误或有任何意见、问题或担忧，请联系我们。\n\n### 1.5 错误\n\
  \n尽管我们努力确保书中内容的准确性，但对于如此规模和复杂的学科，不可避免会出现某些错误和遗漏。书中已知的问题将同解决方案列在以下 URL：\n\n[未提供 URL]\n\
  \n如果您发现了未列在错误列表中的错误，请通过电子邮件通知我们的支持团队：`feedback@ebookfrenzy.com`。\n\n## 2. Ubuntu\
  \ Linux 简史\n\nUbuntu Linux 是 Linux 操作系统若干变体（也称为发行版）之一，是英国的一家公司 Canonical Ltd. 的产品。该公司由\
  \ Mark Shuttleworth 于 1994 年创立。然而，Linux 的起源可以追溯到更早时期。本章将概述 Linux 操作系统和 Ubuntu 的历史。\n\
  \n### 2.1 究竟什么是 Linux？\n\n\n\n\nLinux 是一种操作系统，与 Windows 操作系统非常相似（尽管 Linux 和 Windows\
  \ 之间存在许多相似之处）。“操作系统”一词被用于描述在计算机硬件与我们日常运行的应用程序之间充当层节点的软件。当程序员编写应用程序时，他们通过操作系统接口来执行诸如将文件写入硬盘驱动以及在屏幕上显示信息等任务。如果没有操作系统，每位程序员都必须编写代码来直接访问系统的硬件。此外，程序员还必须能够支持自今以来创造的每一件硬件，以确保应用程序可以在任何可能的硬件配置上运行。由于操作系统处理了所有这些硬件复杂性，应用程序开发就变成了一项更容易的任务。Linux\
  \ 只是当今提供的许多不同操作系统之一。\n\n### 2.2 UNIX 的起源\n\n要理解 Linux 的历史，我们首先必须追溯到 20 世纪 60 年代后期的\
  \ AT&T 贝尔实验室。当时，AT&T 停止了对名为 `Multics` 的新操作系统的开发。然而，两位 AT&T 工程师肯·汤普（Ken Thompson）和丹尼斯·里奇（Dennis\
  \ Ritchie）决定将他们从 `Multics` 项目中学到的知识用于创建一个名为 `UNIX` 的新操作系统，该系统迅速在企业和学术机构中获得了普及和广泛采用。\n\
  \n各种专有的 `UNIX` 实现最终进入了市场，包括由 IBM (`AIX`)、惠尔-惠普 (`HP-UX`) 和太阳微系统公司 (`SunOS` 和 `Solaris`)\
  \ 创建的版本。此外，名为 `MINIX` 的类 UNIX 操作系统由安德鲁·S·塔南鲍（Andrew S. Tanenbaum）创建，专为教育用途设计，并向大学提供源代码访问。\n\
  \n### 2.3 谁创建了 Linux？\n\nLinux 的起源可以追溯到两个人的工作和哲学。Linux 操作系统的核心是一个被称为 `kernel`（内核）的东西。这是操作系统运行所需的核心功能集。`kernel`\
  \ 管理系统资源，并处理硬件与应用程序之间的通信。Linux `kernel` 由林纳斯·托瓦尔斯（Linus Torvalds）开发，由于不喜欢 `MS-DOS`\
  \ 且急不及等待 `MINIX` 在新的英特尔 `80386` 微处理器上可用，他决定编写自己的类 UNIX `kernel`。当他完成内核的第一版本后，他以开源许可发布了它，允许任何人下载源代码并自由使用和修改它，而无需向林纳斯支付任何费用。\n\
  \n大约同一时间，自由软件会的自由和开源软件有力倡导者理查德·斯尔曼（Richard Stallman）正在开发他自己的开源操作系统。然而，斯尔曼最初并没有专注于\
  \ `kernel`，而是从开发使用和维护操作系统所需的所有 `UNIX` 工具、实用程序和编译器的开源版本开始。当他完成这些基础设施的开发时，显而易见的解决方案是将他的工作与林纳斯编写的\
  \ `kernel` 结合，创建一个完整的操作系统。这种结合被称为 `GNU/Linux`。纯洁者坚持认为 Linux 应该一直被称为 `GNU/Linux`（事实上，曾有一段时间，理查德·斯尔曼拒绝接受未将\
  \ Linux 称为 `GNU/Linux` 的出版物的媒体采访）。考虑到自由软件会开发的 `GNU` 工具构成了 `GNU/Linux` 中重要且至关重要的部分，这并不是不合理。遗憾的是，大多数人和出版物仍称\
  \ Linux 为 Linux，这种情况可能会一直持续下去。\n\n### 2.4 Ubuntu 的历史\n\n如前所述，Ubuntu 是许多 Linux 发行版之一。构成\
  \ Ubuntu 发行版的源代码源自一个备受推崇的 Linux 发行版 `Debian`，由伊恩·墨奇（Ian Murdoch）创建。\n\n一位名叫马克·舒特尔斯（Mark\
  \ Shuttleworth）的南非互联网大亨（他以约 5 亿美元的价格将其公司卖给 `VeriSign`）认为是时候有一个更易用户的 Linux 了。他采用了\
  \ `Debian` 发行版，并努力使其更符合人类习惯，将其称为 Ubuntu。他随后成立了名为 `Canonical Ltd` 的公司来推广和提供 Ubuntu\
  \ 支持。\n\n如果你是 Linux 新手，或者已经在使用 Linux 并想尝试不同的 Linux 发行版，你可能找不到比 Ubuntu 更好的选择了。\n\n\
  ### 2.5 “Ubuntu”一词是什么意思？\n\n“Ubuntu”是一个古老的祖鲁语和霍萨语词，意思是“对他人的仁爱”。Ubuntu 也意味着“因为我们大家，我才是我”。选择这个词是因为这些情感准确地描述了\
  \ Ubuntu 发行版的精神。\n\n### 2.6 总结\n\nLinux 操作系统的起源可以追溯到林纳斯·托瓦尔斯和理查德·斯尔曼的工作，表现为 Linux\
  \ `kernel` 与 `GNU` 项目构建的工具和编译器的结合。\n\n多年来，Linux 的开源特性导致了各种不同 Linux 发行版的发布。其中一种发行版是\
  \ Ubuntu，它基于由马克·舒特尔斯创立的公司 `Canonical Ltd` 创建的 `Debian` Linux 发行版。\n\n## 3. 在空白磁盘驱动上安装\
  \ Ubuntu\n\n现在有三种方法可以部署 Ubuntu 系统。一种方法是购买新硬件，或者重新利用现有的计算机系统在上面安装并运行操作系统。或者，可以使用如\
  \ `VirtualBox` 或 `VMware` 等虚拟化平台在现有操作系统的虚拟机内部安装并运行 Ubuntu。另一种选择是使用如 `Amazon AWS`、`Google\
  \ Cloud` 或 `Microsoft Azure`（仅列举）等服务创建一个基于云的操作系统实例。由于云实例通常是通过选择一个预配置的、即插即用的操作系统镜像创建的，该镜像已针对云平台进行了优化并作为\
  \ Ubuntu 系统的基础，因此情况下不需要执行手动操作系统安装。\n\n相反，如果你计划在自己的硬件上安装 Ubuntu，或者使用虚拟化环境，那么学习 Ubuntu\
  \ 路径的第一步就是安装操作系统。\n\nUbuntu 既可以安装在空白环境中（即清除整个磁盘上的现有分区并将其完全留给 Ubuntu），也可以安装在双引导环境中（即\
  \ Ubuntu 与磁盘上的另一个操作系统共存，通常是 `Microsoft Windows` 系列的成员）。\n\n在本章中，我们将介绍从本地或远程介质进行空白磁盘的方法。与\
  \ `Windows 10` 系统的双引导安装将在“与 Windows 双引导 Ubuntu](#Ubuntu_Installation_Dual_Boot.xhtml__idTextAnchor059)”中介绍。\n\
  \n### 3.1 Ubuntu 安装选项\n\n可以通过以下网页免费下载 Ubuntu：\n\n`https://ubuntu.com/download`\n\
  \n该页面提供了多种下载选项，取决于如何安装和使用该操作系统：\n\n- `Ubuntu Desktop` - 下载操作系统桌面版的安装介质。该版本适用于需要图形桌面环境的台式机和笔记本系统，且仅适用于\
  \ 64 位 `x86` 系统。桌面版可以以 `ISO` 镜像的形式下载，然后可以使用本章后面概述的步骤将其写入 USB 盘。启动后，桌面介质将允许你在执行安装之前运行\
  \ `Live Ubuntu` 会话来测试 Ubuntu。\n\n\n\n\n\n- **Ubuntu Server** - 下载该操作系统服务器版本的 Live\
  \ Server ISO 安装介质。此镜像旨在用于安装在不需要图形化桌面环境的服务器上，适用于 x86、ARM、IBM POWER (PowerPC) 和 s390x\
  \ (IBM System z 主机) 系统。安装介质不包含在安装前尝试 Ubuntu 的选项，并使用基于文本的安装程序，而不是 Ubuntu 桌面版所使用的图形化安装程序。这允许\
  \ Ubuntu 安装在没有图形控制台的系统中。\n\nUbuntu Server 镜像也可用于执行预启动执行环境（`PXE`）网络安装。当使用 `PXE` 安装\
  \ Ubuntu 时，Ubuntu 镜像会被安装在经过特殊配置的服务器上（称为 PXE 启动服务器）。随后，在要安装 Ubuntu 的客户端系统上，将其配置为通过网络从\
  \ PXE 启动服务器上的镜像启动（假设客户端硬件支持 PXE），以开始安装。\n\n### 3.2 服务器版与桌面版的区别\n\n显然，在开始安装之前，需要在桌面版和服务器版镜像之间做出决定。如果你想在安装之前尝试\
  \ Ubuntu，那么桌面版选项是最佳解决方案，因为它允许你从安装介质启动 Ubuntu，而无需先将其安装到磁盘驱动器。此选项还允许从实时会话内部启动安装。\n\
  \n如果不需要图形化桌面环境，且目标系统没有互联网访问或图形控制台，则推荐使用 Live Server ISO 镜像，因为这允许构建一个功能完整的服务器，而无需下载任何额外的包。\n\
  \n无论选择何种安装方法，在安装后都可以向系统添加或删除包，以根据特定需求配置系统。\n\n### 3.3 获取 Ubuntu 安装介质\n\n为了本章的目的，Ubuntu\
  \ 桌面环境将使用图形化安装程序进行安装。因此，请从以下 URL 下载 Ubuntu Desktop 22.04 ISO 镜像：\n\n`https://ubuntu.com/download/desktop`\n\
  \nDVD ISO 镜像是自包含的，包含了安装 Ubuntu 系统所需的所有包，并按照以下规范命名：\n\n`ubuntu-<version>-<edition>-<architecture>.iso`\n\
  \n例如，适用于 64 位 Intel/AMD 系统的 Ubuntu 22.04 桌面版 ISO 镜像命名如下：\n\n`ubuntu-22.04-desktop-amd64.iso`\n\
  \n下载镜像后，将其将其刻录到磁盘，或者使用下一节中的步骤将介质写入 USB 驱动器，并配置你的虚拟化环境将其视为 DVD 驱动器。\n\n### 3.4 将\
  \ ISO 安装镜像写入 USB 驱动器\n\n如今，操作系统的安装更有可能通过 USB 驱动器而非 DVD 完成。下载 Ubuntu 的 ISO 安装镜像后，将该镜像写入\
  \ USB 驱动器的步骤将取决于驱动器是连接到 Linux、macOS 还是 Windows 系统。本节其余部分概述的步骤假设 USB 驱动器是新的，或已重新格式化以删除任何现有数据或分区：\n\
  \n### 3.4.1 Linux\n\n在 Linux 上向 USB 驱动器写入 ISO 镜像的第一步是识别设备名称。在插入 USB 驱动器之前，通过列出 `/dev`\
  \ 中的设备来识别系统已检测到的存储设备，如下：\n\n```\nls /dev/sd*\n```\n\n`/dev/sda /dev/sda1 /dev/sda2`\n\
  \n将 USB 驱动器连接到 Linux 系统并运行 `dmesg` 命令以获取最近系统消息列表，其中一个将是关于检测到 USB 驱动器的报告，类似于以下：\n\
  \n```\n[445597.988045] sd 6:0:0:0: [sdb] Attached SCSI removable disk\n```\n\n此输出告诉我们，预计设备名称将包含\
  \ `sdb`，我们可以通过再次列出 `/dev` 中的设备名称来确认这一点：\n\n```\nls /dev\n```\n\n`将 USB 驱动器连接到 Linux\
  \ 系统并运行 `dmesg` 命令以获取最近系统消息列表，其中一个将是关于检测到 USB 驱动器的报告，类似于以下：`（此处此处原文逻辑似乎有重复或错乱，已按原文结构翻译）\n\
  \n*注：根据原文文本，此处衔接如下：*\n```\n[445597.988045] sd 6:0:0:0: [sdb] Attached SCSI removable\
  \ disk\n```\n此输出告诉我们，预计设备名称将包含 `sdb`，我们可以通过再次列出 `/dev` 中的设备名称来确认这一点：\n```\nls /dev\n\
  ```\n（注：此处原文中存在异常插入的重复文本，翻译已忠实原文行序）\n`/dev/sda /dev/sda1 /dev/sda2`\n\n将 USB 驱动器连接到\
  \ Linux 系统并运行 `dmesg` 命令以获取最近系统消息列表，其中一个将是关于检测到 USB 驱动器的报告，类似于以下：\n```\n[445597.988045]\
  \ sd 6:0:0:0: [sdb] Attached SCSI removable disk\n```\n\n此输出告诉我们，预计设备名称将包含 `sdb`，我们可以通过再次列出\
