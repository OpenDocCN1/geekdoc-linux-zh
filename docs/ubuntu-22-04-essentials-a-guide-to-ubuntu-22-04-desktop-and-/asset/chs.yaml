  \n![](img/rhel_8_web_site_secure.jpg)\n\n图 31-3\n\n### 31.11 总结\n\nUbuntu 系统可以通过安装\
  \ Apache Web 服务器来托管网站。在 Ubuntu 上可以部署不安全的 (HTTP) 和安全的 (HTTPS) 网站。安全网站使用安全套接层 (SSL)\
