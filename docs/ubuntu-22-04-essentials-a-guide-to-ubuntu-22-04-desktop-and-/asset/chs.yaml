  \n### 15.8 使用 ufw 从命令行配置防火墙\n\n通过图形界面`gufw`工具可用的所有防火墙配置选项也可以通过底层的命令行使用`ufw`命令可用。\n\
  \n要启用或禁用防火墙：\n\n# ufw enable\n\n# ufw disable\n\n可以使用`status`选项获取防火墙的当前状态：\n\n#\
  \ ufw status\n\nStatus: active\n\nTo Action From\n\n-- ------ ----\n\n\n\n\n\n22\
  \ ALLOW 192.168.86.30\n\n要获取更多详细的状态信息，请将上述命令与详细选项结合：\n\n```\nufw status verbose\n\
  ```\n\n状态：活动\n\n日志：开启（全部）\n\n默认：拒绝（入站），允许（出站），拒绝（路由）\n\n新配置文件：跳过\n\n操作 来源\n\n--\
  \ ------ ----\n\n22 ALLOW 入站 192.168.86.30\n\n上述示例中的输出显示，防火墙的默认策略是拒绝所有入站和路由连接，同时允许所有出站连接。要更改这些默认设置中的任何项，请使用带有语法\
  \ `default` 选项的 `ufw` 命令：\n\n```\nufw default <policy> <direction>\n```\n\n例如，默认允许所有入站连接：\n\
  \n```\nufw default allow incoming\n```\n\n要允许或阻止特定端口的流量，请使用以下语法：\n\n```\nufw <policy>\
  \ <port number>/<optional protocol>\n```\n\n例如，在端口 30 上允许 TCP 和 UDP 入站流量：\n\n```\n\
  ufw allow 30\n```\n\n同样，拒绝端口 5700 的入站 TCP 流量：\n\n```\nufw deny 5700/tcp\n```\n\n\
  规则也可以通过引用与端口对应的服务名称来声明。例如，在端口 22 上启用 SSH 访问：\n\n```\nufw allow ssh\n```\n\n与 `gufw`\
  \ 工具一样，`ufw` 也允许从特定的外部 IP 地址控制访问。例如，允许来自 IP 地址 192.168.0.20 的所有入站流量：\n\n```\nufw\
  \ allow from 192.168.0.20\n```\n\n要特定拒绝来自某个 IP 地址的流量：\n\n```\nufw deny 192.168.0.20\n\
  ```\n\n将 IP 地址 192.168.0.20 的访问限制仅 own 端口 22：\n\n```\nufw allow from 192.168.0.22\
  \ to any port 22\n```\n\n要进一步限制该 IP 地址的访问仅限 TCP 数据包，请使用以下语法：\n\n```\nufw allow from\
  \ 192.168.0.20 to any port 22 proto tcp\n```\n\n新规则在现有规则列表中的位置可以使用 `insert` 选项进行声明。例如，创建一个新规则并将其插入到规则列表的第\
  \ 3 位置：\n\n```\nufw insert 3 allow from 192.168.0.123 to any port 2\n```\n\n显示带有相关编号的规则列表：\n\
  \n```\nufw status numbered\n```\n\n状态：活动\n\n     操作 来源\n     -- ------ ----\n\n\
  [ 1] 22 ALLOW 入站 192.168.86.30\n[ 2] 30 ALLOW 入站 任何位置\n[ 3] 22 ALLOW 入站 192.168.0.123\n\
  [ 4] 5700/tcp DENY 入站 任何位置\n[ 5] 22/tcp ALLOW 入站 任何位置\n[ 6] 任何位置 ALLOW 入站 192.168.0.20\n\
  [ 7] 22 ALLOW 入站 192.168.0.4\n[ 8] 30 (v6) ALLOW 入站 任何位置 (v6)\n[ 9] 5700/tcp (v6)\
  \ DENY 入站 任何位置 (v6)\n[10] 22/tcp (v6) ALLOW 入站 任何位置 (v6)\n\n识别分配给规则的数字后，可以使用该数字从防火墙中删除该规则：\n\
  \n```\nufw delete 4\n```\n\n要获取 `ufw` 工具功能的完整列表，请运行带有 `--help` 参数的命令：\n\n```\nufw\
  \ help\n```\n\n可以使用 `logging` 命令行选项启用和禁用防火墙活动日志：\n\n```\nufw logging on\nufw logging\
  \ off\n```\n\n还可以声明 `ufw` 执行的日志量，包括在开启日志时设置低、中、高或全部设置，例如：\n\n```\nufw logging on\
  \ low\n```\n\n`ufw` 日志文件位于：\n\n`/var/log/ufw.log`\n\n使用 `reload` 选项重启防火墙并重新加载所有当前设置：\n\
  \n```\nufw reload\n```\n\n最后，将防火墙重置为默认设置（从而删除所有现有规则和设置）：\n\n```\nufw reset\n```\n\
  \n### 15.9 总结\n\n任何通过内部网络或互联网连接到其他系统的计算机系统都应该实施某种形式的防火墙，以降低攻击风险。Ubuntu 提供的“不复杂防火墙”（Uncomplicated\
  \ Firewall）提供了一个简单而有效的防火墙，允许使用命令行或图形化 `gufw` 工具定义基本规则。本章概述了启用防火墙和配置防火墙规则的基础知识。\n\
  \n## 16. 使用 firewalld 进行 Ubuntu 防火墙配置\n\n所有的 Linux 发行版都提供了某种形式的防火墙解决方案。在 Ubuntu\
  \ 中，这表现为上一章介绍的不复杂防火墙。本章将介绍 Ubuntu 可用的 `firewalld` 形式的更高级的防火墙解决方案。\n\n### 16.1 firewalld\
  \ 简介\n\n`firewalld` 服务最初为基于 Red Hat 的 Linux 发行版开发，它使用一组规则来控制入站网络流量，并定义哪些流量被拦截，哪些流量允许通过系统，它是构建在名为\
  \ `iptables` 的更复杂的防火墙工具之上的。\n\n`firewalld` 系统提供了一种灵活的方法来管理入站流量。例如，可以配置防火墙拦截流量。Ubuntu\
  \ 防火墙配置的关键元素是区域、接口和端口。\n\n### 16.1.1 区域 (Zones)\n\n默认情况下，`firewalld` 安装时带有一系列预配置区域。区域是一个可以随时应用于系统的预配置规则集。\n\
  \n\n\n\n\n<short>公共</short>\n\n<description>用于公共区域。你不信任网络上的其他计算机不会损坏你的计算机。仅接受选定的入站连接。</description>\n\
  \n<service name=\"ssh\"/>\n\n<service name=\"mdns\"/>\n\n<service name=\"dhcpv6-client\"\
  />\n</zone>\n\n### 16.1.2 接口\n\n任何连接到互联网或网络（或两者兼有）的 Ubuntu 系统都包含至少一个物理或虚拟网络设备形式的接口。当\
  \ `firewalld` 激活时，这些接口中的每一个都被分配给一个 `zone`（区域），允许为不同的接口分配不同级别的防火墙安全。考虑一个包含两个接口的服务器，一个连接到外部互联网，另一个连接到内部网络。在这种情况下，面向的接口很可能会分配给限制较多的外部区域（external\
  \ zone），而内部接口可能会使用内部区域（internal zone）。\n\n### 16.1.3 服务\n\nTCP/IP 定义了一组在标准端口上通信的服务。例如，安全的\
  \ HTTPS 网页连接使用端口 443，而 SMTP 邮件服务使用端口 25。要为了针对特定服务选择性地启用入站流量，可以向 `zone` 添加 `firewalld`\
  \ 规则。例如，家庭区域（home zone）默认不允许入站 HTTPS 连接。可以通过向 `zone` 添加规则来启用允许入站 HTTPS 连接，而无需引用特定的端口号。\n\
  \n### 16.1.4 端口\n\n虽然在添加 `firewalld` 规则时可以引用常见的 TCP/IP 服务，但会出现需要在未分配给服务的特定端口上允许入站连接的情况。可以通过添加引用特定端口而非服务的规则来实现。\n\
  \n### 16.2 检查 firewalld 状态\n\n在所有的 Ubuntu 安装中，`firewalld` 服务通常默认没有安装和启用。可以通过以下命令检查服务的状态：\n\
  \n```bash\nsystemctl status firewalld\n```\n\n● firewalld.service - firewalld -\
  \ 动态防火墙守护\n\n      Loaded: loaded (/lib/systemd/system/firewalld.service; enabled;\
  \ vendor preset: enabled)\n      Active: active (running) since Mon 2023-07-17 19:21:53\
  \ UTC; 16s ago\n        Docs: man:firewalld(1)\n      Main PID: 27151 (firewalld)\n\
  \      Tasks: 2 (limit: 4517)\n      Memory: 24.0M\n        CPU: 244ms\n      CGroup:\
  \ /system.slice/firewalld.service\n               └─27151 /usr/bin/python3 /usr/sbin/firewalld\
  \ --nofork --nopid\nJul 17 19:21:53 demoserver systemd[1]: Starting firewalld -\
  \ dynamic firewall daemon...\nJul 17 19:21:53 demoserver systemd[1]: Started firewalld\
  \ - dynamic firewall daemon.\n\n如有必要，可以按照以下方式安装 `firewalld` 服务：\n\n```bash\napt\
  \ install firewalld\n```\n\n`firewalld` 服务默认已启用，因此它在安装完成后以及每次系统启动时都会自动启动。\n\n###\
  \ 16.3 使用 firewall-cmd 配置防火墙规则\n\n`firewall-cmd` 命令行实用程序允许在终端窗口内查看 `firewalld` 配置信息，并对\
  \ `zone` 和规则进行更改。\n\n在更改防火墙设置时，意识到运行时（runtime）和永久性（permanent）配置的概念非常重要。默认情况下，任何规则更改都被视为运行时配置更改。这意味着虽然更改将立即生效，但它们将在下次系统重启或\
  \ `firewalld` 服务重载时（例如通过执行以下命令）丢失丢失：\n\n```bash\nfirewall-cmd --reload\n```\n\n\
  要使更改永久生效，必须使用 `--permanent` 命令行选项。永久性更改在 `firewalld` 服务重载之前不会生效，但在手动更改之前它们将保持有效。\n\
  \n### 16.3.1 识别和更改默认区域\n\n要识别默认区域（换句话说，除非专门选择了不同的区域，否则所有接口都将被分配到的区域），请按如下方式使用 `firewall-cmd`\
  \ 工具：\n\n```bash\nfirewall-cmd --get-default-zone\n```\npublic\n\n将默认区域更改为不同的区域：\n\
  \n```bash\nfirewall-cmd --set-default-zone=home\n```\nsuccess\n\n### 16.3.2 显示区域信息\n\
  \n列出系统上所有可用的区域如下：\n\n```bash\nfirewall-cmd --get-zones\n```\nblock dmz drop external\
  \ home internal public trusted work\n\n按如下方式获取当前激活的区域以及它们所属的接口列表：\n\n```bash\nfirewal-cmd\
  \ --get-active-zones\n```\nexternal\n  interfaces: eth0\ninternal\n  interfaces:\
  \ eth1\n\n当前为特定区域配置的所有规则可以如下列出：\n\n```bash\nfirewall-cmd --zone=home --list-all\n\
  ```\nhome (active)\n  target: default\n  icmp-block-inversion: no\n\n### 16.3.3\
  \ 添加和删除区域服务\n\n要向区域添加服务（在此例中，向 public 区域添加 HTTPS），将使用以下命令：\n\n```bash\nfirewall-cmd\
  \ --zone=public --add-service=https\n```\nsuccess\n\n默认情况下，这是一个运行时更改，因此添加的规则将在重启后丢失。为了使服务在下次系统重启时生效，请使用\
  \ `--permanent` 标志：\n\n```bash\nfirewall-cmd --zone=public --permanent --add-service=https\n\
  ```\n\n要验证服务是否已永久添加，请确保在请求服务列表时包含 `--permanent` 标志：\n\n```bash\nfirewall-cmd --zone=public\
  \ --permanent --list-services\n```\n\n使用 `--remove-service` 选项从区域删除服务。由于这是一个运行时更改，规则将在下次系统重启时恢复：\n\
  \n```bash\nfirewall-cmd --zone=public --remove-service=https\n```\n\n要永久删除服务，使用\
  \ `--permanent` 标志，如果需要更改立即生效，请重载 firewalld：\n\n```bash\nfirewall-cmd --zone=public\
  \ --permanent --remove-service=https\n```\n\n### 16.3.4 使用端口规则\n\n要启用特定端口，使用 `--add-port`\
  \ 选项。注意在手动定义端口时，需要提供端口号和协议（`TCP` 或 `UDP`）：\n\n```bash\nfirewall-cmd --zone=public\
  \ --permanent --add-port=5000/tcp\n```\n\n向区域添加规则时，也可以指定端口范围：\n\n```bash\nfirewall-cmd\
  \ --zone=public --permanent --add-port=5900-5999/udp\n```\n\n### 16.3.5 创建新区域\n\n\
  可以通过运行以下命令创建一个全新的区域。创建后，该区域可以像任何预定义区域一样进行管理：\n\n```bash\nfirewall-cmd --permanent\
  \ --new-zone=myoffice\n```\nsuccess\n\n在添加新区域后，需要重启 firewalld 区域才能变得可用：\n\n```bash\n\
  firewall-cmd --reload\n```\nsuccess\n\n### 16.3.6 更改区域/接口分配\n\n如前所述，系统上的每个接口都必须分配给一个区域。可以使用\
  \ `firewall-cmd` 工具更改接口所属的区域。在以下示例中，将 `eth0` 接口分配给 public 区域：\n\n```bash\nfirewall-cmd\
  \ --zone=public --change-interface=eth0\n```\nsuccess\n\n### 16.3.7 伪装 (Masquerading)\n\
  \n\n\n\n伪装（Masquerading）在网络管理领域更广被称为网络地址翻译（NAT）。当使用 Ubuntu 系统作为计算机网络访问的的网关时，伪装允许所有内部系统在互联网通信时使用该\
  \ Ubuntu 系统的 IP 地址。这种方法的优处是可以向恶意的外部实体隐藏任何系统的内部 IP 地址，并且避免了为网络上的每台计算机分配公网 IP 地址的必要性。\n\
  \n使用以下命令检查防火墙是否已启用了伪装：\n\n```\nfirewall-cmd --zone=external --query-masquerade\n\
  ```\n\n使用以下命令启用伪装（如果希望更改永久生效，请记住使用 `--permanent` 标记）：\n\n```\nfirewall-cmd --zone=external\
  \ --add-masquerade\n```\n\n### 16.3.8 添加 ICMP 规则\n\n互联网控制消息协议（ICMP）用于网络上的客户端系统之间相互发送错误消息等信息。它也是\
  \ `ping` 命令的基础，网络管理员和用户都使用它来检测特定客户端在网络上是否存活。ICMP 类别允许阻止特定的 ICMP 消息类型。例如，管理员可能会选择阻止入的\
  \ `ping`（回显请求）ICMP 消息，以防止基于 `ping` 的拒绝服务（DoS）攻击的可能性（即服务器被恶意大量发入 `ping` 消息，导致其无法响应合法请求）。\n\
  \n要查看可用于 firewalld 规则的 ICMP 类型，请运行以下命令：\n\n```\nfirewall-cmd --get-icmptypes\n```\n\
  \n`address-unreachable bad-header beyond-scope communication-prohibited destination-unreachable\
  \ echo-reply ...`\n\n例如，以下命令为公共区域（public zone）永久添加一条规则来阻止 `echo-reply`（回显响应）消息：\n\
  \n```\nfirewall-cmd --zone=public --permanent --add-icmp-block=echo-reply\n```\n\
  \n### 16.3.9 实现端口转发\n\n当 Ubuntu 系统作为内部计算机系统访问互联网的网关时，端口转发与伪装配合使用。端口允许允许通过特定端口到达防火墙的流量转发到内部网络上的特定系统。通过示例来描述这一点可能是最好的。\n\
  \n假设一个 Ubuntu 系统作为内部计算机网络的防火墙，网络上的其中一个系统被配置为 Web 服务器。假设该 Web 服务器系统的 IP 地址为 `192.168.2.20`。托管在该系统上的网站的域名记录配置了位于\
  \ Ubuntu 防火墙背后的公网 IP 地址。当 HTTP Web 页面请求到达端口 `80` 时，作为防火墙的 Ubuntu 系统需要知道该如何处理它。通过配置端口转发，可以将所有\
  \ Web 流量定向到托管 Web 服务器的内部系统（在此例中为 IP 地址为 `192.168.2.20`），可以继续使用端口 `80` 或将流量重定向到目标服务器上的不同端口。事实上，端口转发甚至可以配置为将流量转发到防火墙同一系统上的不同端口（这一概念被称为本地转发）。\n\
  \n要使用端口转发，首先按照如下方式启用伪装（在这种情况下，假设连接到互联网的接口已分配给外部区域）：\n\n```\nfirewall-cmd --zone=external\
  \ --add-masquerade\n```\n\n要从一个端口转发到另一个不同的本地端口，将使用类似下面的命令：\n\n```\nfirewall-cmd\
  \ --zone=external --add-forward-port=port=22:proto=tcp:toport=2750\n```\n\n在上面的示例中，任何到达端口\
  \ `22` 的 TCP 流量将被转发到本地系统上的端口 `2750`。另一方面，下面的命令将本地系统上的端口 `20` 转发到 IP 地址为 `192.168.0.19`\
  \ 的系统的端口 `22`：\n\n```\nfirewall-cmd --zone=external \\\n          --add-forward-port=port=20:proto=tcp:toport=22:toaddr=192.168.0.19\n\
  ```\n\n同样，以下命令将本地端口 `20` 转发到 IP 地址为 `192.168.0.18` 的系统的端口 `2750`：\n\n```\nfirewall-cmd\
  \ --zone=external --add-forward-port=port=20:proto=tcp:toport=2750:toaddr=192.168.0.18\n\
  ```\n\n### 16.4 使用 firewall-config 管理 firewalld\n\n如果您有权访问图形桌面环境，也可以使用 `firewall-config`\
  \ 工具配置防火墙。虽然默认没有安装，但可以通过以下方式安装 `firewall-config`：\n\n```\napt install firewall-config\n\
  ```\n\n启动时，会出现主 `firewall-config`界面，如 图 16-1 所示：\n\n![](img/ubuntu-firewall-config.jpg)\n\
  \n图 16-1\n\n该工具的关键区域可以总结如下：\n\nA - 显示所有当前激活的接口及其所属的区域。要将接口分配到不同的区域，请从此面板中选择它，点击\
  \ Change Zone（更改区域）按钮并从生成的对话框中选择所需的区域。\n\nB - 控制显示的信息以及工具内所做的任何更改适用于运行时规则还是永久规则。\n\
  \nC - 系统上配置的区域、服务或 IPSet 列表。此面板的内容取决于 F 选择。\n\nD - 显示 E 选择内容的主面板。在此例中，该面板显示的是公共区域的服务。每个服务旁边的复选框控制该服务是否启用。在这些类别面板中可以添加或删除规则。\n\
  \nE - 控制 D 显示的内容。\n\nF - 控制 C 显示的列表。\n\n### 16.5 总结\n\n一个精心规划和实现的防火墙是任何安全系统的关键组成部分。在\
  \ Ubuntu 的情况下，firewalld 服务提供了一个灵活且易于管理的防火墙系统。firewalld 服务使用区域（zones）的概念将一组防火墙规则结合，并包含了一系列满足各种防火墙要求的预定义区域。可以对这些区域进行修改以添加或删除规则，也可以创建并配置全新的区域。系统中连接网络或互联网的网络设备称为接口。每个接口都被分配到一个区域。\n\
  \n### 17 在 Ubuntu 上配置 SSH 密钥身份验证\n\n首次安装 Ubuntu 系统时，它默认允许通过安全 Shell (SSH) 连接进行远程命令行访问。SSH\
  \ 为 root 账户以及安装期间添加任何其他用户提供了受密码保护和加密的访问。然而，这种安全性是不够的，应尽快升级为 SSH 密钥身份验证。\n\n本章将概述通过实施密钥身份验证增强\
  \ Ubuntu 系统安全性的步骤。\n\n### 17.1 安全 Shell (SSH) 概述\n\n\n\n\nSSH 允许对系统进行安全的远程访问，以获取\
  \ shell 访问并传输文件和数据。基础 SSH 配置由一个客户端（用于建立连接的计算机）和一个服务器（运行在要连接的系统上）组成。例如，用户可以使用运行在\
  \ Linux、Windows 或 macOS 系统上的 SSH 客户端连接到运行在 Ubuntu 系统上的 SSH 服务器，以获取 shell 命令行提示符的访问或执行文件传输。客户端与服务器之间的所有通信（包括获取访问时输入的密码）都经过加密，以防止外部人员截获数据。\n\
  \n基础 SSH 实现的固有弱点是它完全取决于系统上账户分配的密码强度。如果恶意方能够识别出某个账户的密码（通过猜测、欺骗或暴力破解攻击），系统就会变得非常脆弱。可以通过实施\
  \ SSH 密钥认证来解决这一弱点。\n\n### 17.2 SSH 密钥认证\n\nSSH 密钥认证使用非对称公钥加密来为远程系统访问增加额外的安全保护层。公钥加密的概念由\
  \ Whitfield Diffie 和 Martin Hellman 于 1975 年发明，基于使用私钥和公钥对。\n\n在公钥加密系统中，公钥用于加密数据，而这些数据只能由私钥的所有者进行解密。\n\
  \n在 SSH 密钥认证的情况下，SSH 客户端所在的主机持有私钥，而相应的公钥存储在运行 SSH 服务器的系统上。因此，保护私钥至关重要，因为拥有密钥所有权将允许任何人登录到远程系统。作为额外的保护层，私钥还可以被加密并用密码保护，每次建立到服务器的连接时必须输入该密码。\n\
  \n### 17.3 设置密钥认证\n\n设置 SSH 密钥认证有四个步骤，总结如下：\n\n1. 生成公钥和私钥。\n2. 将公钥安装到服务器上。\n3. 测试认证。\n\
  4. 在服务器上禁用基于密码的认证。\n\n本章的其余部分将为 Linux、macOS 和基于 Windows 的客户端操作系统详细列述这些步骤。\n\n###\
  \ 17.4 安装并启动 SSH 服务\n\n如果系统上尚未安装并运行 SSH 服务器，可以使用以下命令进行添加：\n\n```\napt install openssh-server\n\
  systemctl start ssh.service\nsystemctl enable ssh.service\n```\n\n### 17.5 从 Linux\
  \ 和 macOS 客户端进行 SSH 密钥认证\n\n设置 SSH 密钥认证的第一步是在客户端系统上生成密钥对。如果客户端系统运行的是 Linux 或 macOS，则可以使用\
  \ `ssh-keygen` 工具实现：\n\n```\nssh-keygen\n```\n\n该命令将产生类似下面的输出：\n\n```\nGenerating\
  \ public/private rsa key pair.\nEnter file in which to save the key (/home/<username>/.ssh/id_rsa):\n\
  按下 Enter 键以接受密钥文件的默认位置。这将在当前用户主目录的 `.ssh` 子目录下放置两个文件。私钥将存储在名为 `id_rsa` 的文件中，而公钥将存储在名为\
  \ `id_rsa.pub` 的文件中。\n```\n\n接下来，`ssh-keygen` 将提示输入语（passphrase）以保护私钥。如果提供了短语，私钥将在本地磁盘上加密，并在访问远程系统时需要该短语。因此，为了更好的安全，建议使用短语。\n\
  \n```\nEnter passphrase (empty for no passphrase):\n```\n\n最后，`ssh-keygen` 工具将生成以下输出，表示密钥已生成：\n\
  \n```\nYour identification has been saved in /home/neil/.ssh/id_rsa.\nYour public\
  \ key has been saved in /home/neil/.ssh/id_rsa.pub.\nThe key fingerprint is:\nSHA256:FOLGWEEGFIjWnCT5wtTOv5VK4hdimzWghZizUEMYbfo\
  \ <username>@<hostname>\nThe key’s randomart image is:\n+---[RSA 2048]----+\n|.BB+=+*..\
  \ |\n|o+B= * . . |\n|===.. + . |\n|*+ * . . |\n|.++ o S |\n|..E+ * o |\n| o B *\
  \ |\n| + + |\n| . |\n+----[SHA256]-----+\n```\n\n下一步是将公钥安装到远程服务器系统上。可以使用 `ssh-copy-id`\
  \ 工具实现：\n\n```\nssh-copy-id username@remote_hostname\n```\n\n例如：\n\n```\n$ ssh-copy-id\
  \ neil@192.168.1.100\n/usr/bin/ssh-copy-id: INFO: Source of key(s) to be installed:\
  \ \"/home/neil/.ssh/id_rsa.pub\"\n/usr/bin/ssh-copy-id: INFO: attempting to log\
  \ in with the new key(s), to filter out any that are already installed\n/usr/bin/ssh-copy-id:\
  \ INFO: 1 key(s) remain to be installed -- if you are prompted now it is to install\
  \ the new keys\nneil@192.168.1.100’s password:\nNumber of key(s) added: 1\n```\n\
  \n现在尝试使用 `\"ssh 'neil@192.168.1.100'\"` 登录机器，并检查是否添加了你想要的密钥。\n\n\n\n另一种方法，SSH 客户端用户配置文件可以将密钥文件与服务器关联。该配置文件被命名为\
  \ `config`，它必须位于用户家目录下的 `.ssh` 中，并可用于配置各种选项，包括私钥文件、连接时使用的默认端口、默认用户名以及用于引用服务器的简短别名。下面的\
  \ `config` 文件示例为两个服务器定义了不同的密钥文件，并允许通过 `home` 和 `work` 别名来引用它们。在工作系统中，该文件还指定了身份验证时使用的用户名：\n\
  \n```\nHost work\n  HostName 35.194.18.119\n  IdentityFile ~/.ssh/id_work\n  User\
  \ neilsmyth\nHost home\n  HostName 192.168.0.21\n  IdentityFile ~/.ssh/id_home\n\
  ```\n\n在设置配置文件之前，用户本会使用以下命令来连接到工作系统：\n\n```bash\n$ ssh -l neilsmyth -i ~/.ssh/id_work\
  \ 35.194.18.119\n```\n\n但现在，命令可以缩短如下：\n\n```bash\n$ ssh work\n```\n\n运行以下命令可以找到配置文件选项的完整列表：\n\
  \n```bash\n$ man ssh_config\n```\n\n### 17.7 从 Windows 客户端进行 SSH 密钥身份验证\n\nWindows\
  \ 的最新版本包含了 OpenSSH 实现的一个子集（被大多数 Linux 和 macOS 系统作为 Windows PowerShell 的一部分）。这允许使用与上述\
  \ Linux 和 macOS 类似的步骤，从 Windows 客户端设置 SSH 密钥身份验证。\n\n在 Windows 上，搜索 Windows PowerShell\
  \ 并从结果中选择它。运行后，将出现 PowerShell 窗口，如图图 17-1 所示：\n\n![](img/windows_powershell.jpg)\n\
  \n图 17-1\n\n如果您已拥有另一个客户端系统的私钥，请将 `id_rsa` 文件复制到 Windows 系统上名为 `.ssh` 的文件夹中。文件到位后，在\
  \ PowerShell 窗口中按如下方式测试身份验证：\n\n```bash\n$ ssh -l <username>@<hostname>\n```\n\n\
  例如：\n\n```powershell\nPS C:\\Users\\neil> ssh -l neil 192.168.1.101\nEnter passphrase\
  \ for key 'C:\\Users\\neil\\.ssh\\id_rsa':\n在提示时输入口语并完成身份验证过程。\n```\n\n如果私钥尚不存在，请在\
  \ PowerShell 窗口中使用 `ssh-keygen` 工具，按照与 Linux 和 macOS 相同的步骤生成新的私公密钥对。一旦生成了密钥，它们将再次位于当前用户家目录的\
  \ `.ssh` 目录，并且公钥文件 `id_rsa.pub` 需要安装到远程 Ubuntu 系统上。遗憾的是，Windows PowerShell 不包含 `ssh-copy-id`\
  \ 工具，因此此任务必须手动完成。\n\n在 PowerShell 窗口中，进入 `.ssh` 子目录并显示公钥文件 `id_rsa.pub` 的内容：\n\n\
  ```powershell\nPS C:\\Users\\neil> cd .ssh\nPS C:\\Users\\neil\\.ssh> type id_rsa.pub\n\
  ssh-rsa \
  \ neil@DESKTOP-S8P8D3N\n```\n\n高亮文件内容并使用快捷键 `Ctrl-C` 复制它。\n\n留在 PowerShell 窗口中，使用密码身份验证登录远程系统：\n\
  \n```powershell\nPS C:\\Users\\neil\\.ssh> ssh -l <username> <hostname>\n```\n\n\
  登录后，检查是否存在 `.ssh` 子目录。如果不存在，按如下方式创建它：\n\n```bash\n$ mkdir .ssh\n```\n\n进入 `.ssh`\
  \ 目录并检查是否存在名为 `authorized_keys` 的文件。如果不存在，创建它并将来自 Windows 系统的公钥文件内容粘贴其中。\n\n如果 `authorized_keys`\
  \ 文件已存在，它可能包含其他密钥。如果是这样，请编辑该文件并将新的公钥粘贴在文件末尾。例如，以下文件包含两个密钥：\n\n```\nssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABAQCzRWH27Xs8ZA5rIbZXKgxFY5XXauMv+6F5PljBLJ6j+9nkmykVe3GjZTp3oD+KMRbT2kTEPbDpFD67DNL0ei...\n\
  ```\n\n\n\n\n### 17.9 使用 PuTTYgen 生成私钥\n\n上一节探讨了在操作 `PuTTY` 时使用现有的私钥和公钥。如果密钥不存在，可以使用\
  \ `PuTTYgen` 工具创建，该工具包含在 `PuTTY` 主安装包中。\n\n要创建新密钥，启动 `PuttyGen` 并点击图 17-4 中显示的 `Generate`\
  \ 按钮：\n\n![](img/putty_key_generator_generate.jpg)\n\n图 17-4\n\n按照指示移动鼠标指针生成随机数据，然后输入可选的短语来加密私钥。密钥生成后，使用\
  \ `Save public key` 和 `Save private key` 按钮将文件保存到合适的位置。如前一节所述，私钥可用于 `PuTTY`。要在远程服务器上安装公钥，请参考早些章节关于在\
  \ `Windows` 的 `PowerShell` 中使用 `SSH` 的步骤。\n\n### 17.10 总结\n\n对 `Ubuntu` 系统的任何远程访问必须以提供高安全性的方式来实现。默认情况下，`SSH`\
  \ 允许基于密码的身份验证进行远程系统访问。然而，这使得系统容易受到能够猜测密码或通过其他手段获取密码的人攻击。因此，建议使用基于密钥的身份验证来保护系统访问。基于密钥的身份验证使用了涉及公钥和私钥的公钥加密。实施后，用户只有在使用与服务器上公钥匹配的私钥客户端时，才能连接到服务器。作为额外的安全层，私钥还可以被加密并受密码保护。一旦实施了基于密钥的加密，服务器系统将配置为禁用安全性较低的基于密码的身份验证支持。\n\
  \n本章提供了 `SSH` 密钥身份验证的概述，并概述了在 `macOS`、`Linux` 和 `Windows` 上生成密钥和配置客户端的步骤，以及在 `Ubuntu`\
  \ 服务器上安装和管理公钥的方法。\n\n## 18. 使用 Vino 访问 Ubuntu 22.04 桌面\n\n`Ubuntu` 可以配置为通过网络或互联网连接提供图形桌面环境的远程访问。虽然默认未启用，但从网络或互联网上的任何其他系统显示并访问\
  \ `Ubuntu` 桌面相对简单。无论该系统运行的是 `Linux`、`Windows` 还是 `macOS` 都可以实现。事实上，甚至有适用于 `Android`\
  \ 和 `iOS` 的应用程序，允许你从任何有数据信号的地方访问你的 `Ubuntu` 桌面。\n\n远程桌面访问在许多场景中非常有用。例如，它允许你或他人从同一网络或互联网上的另一台计算机系统查看并与你的\
  \ `Ubuntu` 桌面环境交互。当你离开办公桌（例如在旅行期间）需要操作电脑时，这非常有用。在同事或 IT 支持人员需要访问你的桌面来解决问题的情况下，它同样有用。\n\
  \n`Ubuntu` 远程桌面支持使用虚拟网络计算 (`VNC`) 或微软远程桌面协议 (`RDP`) 进行连接。使用 `RDP` 的优势是它可以让 `Windows`\
  \ 客户端轻松访问 `Ubuntu` 桌面。因此，在本章中，我们将涵盖在 `Ubuntu` 中使用 RDP 配置和使用远程面的关键方面。\n\n### 18.1\
  \ 远程桌面访问类型\n\n在开始之前，了解本质上有两种远程桌面访问类型非常重要。如果你主要将 `Ubuntu` 作为桌面操作系统并需要对常用的桌面会话进行远程访问，那么本章涵盖的方法非常有用。配置完成后，你将接管你的桌面会话并远程查看和控制它。\n\
  \n第二种方案适用于你需要在远程服务器系统上启动并访问一个或远程桌面会话的情况，无论该远程系统是否连接了图形控制台。这允许你在远程系统的后台中启动多个桌面会话，并通过网络或互联网连接查看并控制这些桌面。\n\
  \n# 18.2 安全与不安全的远程桌面访问\n\n在本章中，我们将涵盖安全和不安全的远程桌面访问方法。假设你是在安全内部网络的环境下从一个系统访问另一个系统，那么通常使用不安全的访问方法是安全的。另一方面，如果你计划通过任何公共网络远程访问桌面，你必须使用安全的访问方法，以避免你的系统和数据被破解。\n\
  \n### 18.3 在 Ubuntu 上启用远程桌面访问\n\n`Ubuntu` 远程桌面访问由 `Vino` 包提供。`Vino` 是一个专为 `GNOME`\
  \ 桌面开发的远程桌面服务器。\n\n启用远程访问的第一步是安装此包：\n\n```bash\napt install vino\n```\n\n一旦安装了 `Vino`，下一步是在\
  \ `GNOME` 内部启用远程桌面访问。首先按照图 18-1 所示打开设置应用：\n\n![](img/ubuntu_settings_menu1.jpg)\n\
  \n图 18-1\n\n在 `Settings` 内部，选择 `Sharing` 选项（在图 18-2 中标记为 A）：\n\n![](img/ubuntu_settings_sharing.jpg)\n\
  \n图 18-2\n\n打开 `Sharing` 开关 (B) 并点击 `Remote Desktop` 选项 (C)，显示图 18-3 所示的对话框：\n\n\
  ![](img/ubuntu_settings_remote_desktop.jpg)\n\n图 18-3\n\n`Remote Desktop` 对话框提供了以下管理远程桌面访问的配置选项：\n\
  \n- `Remote Control` - 如果启用，远程会话可以使用鼠标和键盘与桌面交互。如果禁用此选项，远程会话仅允许查看桌面。\n- `Enable Legacy\
  \ VNC Protocol` - `Ubuntu` 支持通过 `VNC` 和微软远程桌面协议 (`RDP`) 进行远程桌面。启用后，可以在图 18-4 所示的菜单中使用两个额外选项：\n\
  \n![](img/ubuntu_settings_vnc_menu.jpg)\n\n图 18-4\n\n- `New connections must ask\
  \ for access` - 选择此项时，主机屏幕上将弹出提示，询问是否允许远程用户访问。如果你计划远程访问屏幕且没有人在主机系统接受连接请求，则不要选择此选项。\n\
  - `Require a password` - 要求用户在访问桌面之前输入指定的密码。\n- `User Name and Password` - 远程访问桌面所需的用户名和密码。\n\
  \n配置设置后，关闭 Remote Desktop 和 Settings 对话框。\n\n### 18.4 连接到共享桌面\n\n虽然各种操作系统都有远程桌面查看器实现，但从\
  \ `Ubuntu` 或或其他 Linux 系统连接时，建议使用如 `Remmina` 桌面客户端之类的工具。`Remmina` 是一个具有图形界面的友好工具，支持\
  \ `Vino` 使用的加密以确保远程连接的安全。\n\n`Remmina` 通常默认安装在 `Ubuntu` 上，但如有需要可以按照以下步骤安装：\n\n```bash\n\
  apt install remmina\n```\n\n在远程 Linux 计算机上启动 `Remmina`，并将连接类型菜单（在图 18-5 中标记为 A）更改为\
  \ `RDP`，然后在地址字段 (B) 输入要连接的系统的 IP 地址或主机名（你可以使用标记为 C 的按钮创建并保存连接）：\n\n![](img/ubuntu_remmina_main.jpg)\n\
  \n图 18-5\n\n\n\n\n\n要建立连接，按下键盘上的 `Enter` 键开始连接过程。点击接受证书，随后会出现第二个屏幕请求桌面访问密码：\n\n\
  ![](img/ubuntu_remmina_credentials.jpg)\n\n图 18-6\n\n输入密码后，点击 OK 访问远程屏幕：\n\n![](img/ubuntu_remmina_connected.jpg)\n\
  \n图 18-7\n\n### 18.5 从 Windows 连接\n\n由于我们已经配置了 `Vino` 使用 RDP，因此也可以使用微软的“远程桌面连接”应用程序从\
  \ Windows 客户端访问 Ubuntu 桌面。在 Windows 系统上，启动“远程桌面连接”，并点击右下角的 `Show Options`（显示选项）按钮显示额外的配置设置。输入\
  \ Ubuntu 系统的主机名或 IP 地址，以及在本章之前配置的用户名：\n\n![](img/windows_remote_desktop_to_ubuntu.jpg)\n\
  \n图 18-8\n\n点击 `connect`（连接）按钮，在提示时输入密码以访问 Ubuntu 桌面：\n\n![](img/windows_remote_desktop_credentials.jpg)\n\
  \n图 18-9\n\n### 18.6 总结\n\n通过使用虚拟网络计算 (VNC) 或远程桌面协议 (RDP)，可以启用对 Ubuntu 系统 GNOME\
  \ 桌面环境的远程访问。VNC 和 RDP 由运行在远程服务器上的服务器和本地相应的客户端组成，允许访问运行在服务器上的桌面实例。\n\nGNOME 桌面的标准远程服务器解决方案是\
  \ `Vino`。安装后，可以使用如 `Remmina` 等远程桌面查看器从其他 Linux 系统建立远程桌面会话。使用 RDP 时，还可以使用微软远程桌面连接应用程序在\
  \ Windows 和 Mac 系统上访问桌面。\n\n## 19. 远程显示 Ubuntu 22.04 应用程序 (X11 转发)\n\n在上一章中，我们查看了如何在远程计算机上显示整个\
  \ Ubuntu 桌面。虽然在需要远程显示整个桌面时这种方法很好用，但如果你只想显示单个应用程序，这可能大材了。因此，本章将介绍如何在远程系统上显示单个应用程序。\n\
  \n### 19.1 远程显示 Ubuntu 应用的要求\n\n在一个 Ubuntu 系统上运行应用程序并在另一个系统上显示它需要一些前提条件。首先，显示应用程序的系统必须运行\
  \ `X server`。如果该系统是运行着桌面环境的 Linux 或 UNIX 系统，则没有问题。然而，如果系统运行的是 Windows 或 macOS，你必须在从远程系统显示应用程序之前在上面安装\
  \ X server。市上有几款商用和免费的 Windows 版 X server 可供选择，网页搜索可以为你提供选项列表。\n\n其次，运行应用程序的系统（而非显示应用程序的系统）必须配置为允许\
  \ SSH 访问。在 Ubuntu 系统上配置 SSH 的细节可以查阅 “在 Ubuntu 22.04 上配置基于密钥的身份验证” 章节。该系统必须运行来自 `X.org`\
  \ 的 X Window 系统，而不是 `Wayland`。要从桌面内部启用 `X.org` 系统，请注销 Gnome 桌面，从登录界面选择你的用户账户，然后点击屏幕右下角的设置按钮：\n\
  \n![](img/ubuntu_login_gnome_xorg_menu.jpg)\n\n图 19-1\n\n在像往常登录之前，从菜单中选择 `GNOME\
  \ on Xorg` 选项。要恢复到 `Wayland`，重复这些步骤，并在登录界面设置菜单中选择 `Ubuntu` 选项。\n\n另一个选项是编辑 `/etc/gdm3/custom.conf`\
  \ 文件，取消如下 `WaylandEnable` 行的注释并重启系统：\n\n```bash\n# 取消下面行的注释以强制登录界面使用 Xorg\nWaylandEnable=false\n\
  ```\n\n一旦登录回桌面，打开 Terminal 窗口并运行以下命令以确认 `X.org` 系统已启用：\n\n```bash\necho $XDG_SESSION_TYPE\n\
  ```\n\n上述命令将根据当前配置输出 `x11` 或 `wayland`。\n\n最后，必须配置 SSH 以允许 X11 转发。这是通过在发生转发的源系统的\
  \ SSH 配置中添加以下指令来实现的。在 Ubuntu 默认情况下，`/etc/ssh/sshd_config` 文件包含一条指令，用于包含 `/etc/ssh/sshd_config.d`\
  \ 目录中的所有配置文件：\n\n```bash\nInclude /etc/ssh/sshd_config.d/*.conf\n```\n\n在 `/etc/ssh/sshd_config.d`\
  \ 文件夹中创建一个名为 `05_x11forwarding` 的新文件，并编辑它以启用 `X11Forwarding` 属性，如下：\n\n```bash\n\
  X11Forwarding yes\n```\n\n进行更改后，保存文件并重启 SSH 服务：\n\n```bash\nsystemctl restart ssh\n\
  ```\n\n一旦满足上述要求，就应该能够远程显示基于 X 的桌面应用程序。请记住，并非所有 GNOME 应用都兼容 X11 转发。如果应用不兼容，执行它时将出现以下错误：\n\
  \n```\nX11 connection rejected because of wrong authentication.\n```\n\n### 19.2\
  \ 远程显示 Ubuntu 应用程序\n\n远程显示应用程序的第一步是移动到显示应用程序的系统。在该系统中，与远程系统建立 SSH 连接以获得命令行提示符。使用\
  \ `ssh` 命令时，我们需要使用 `-X` 标记告诉它我们计划通过连接隧道 X11 流量：\n\n```bash\nssh -X user@hostname\n\
  ```\n\n在上述示例中，`user` 是登录远程系统的用户名，`hostname` 是远程系统的主名或 IP 地址。在登录提示处输入密码，登录后，运行以下命令查看\
  \ `DISPLAY` 设置：\n\n```bash\necho $DISPLAY\n```\n\n该命令应输出类似的内容：\n\n```\nlocalhost:10.0\n\
  ```\n\n要显示应用程序，从命令行提示符运行它。例如：\n\n```bash\ngedit\n```\n\n执行上述命令将在远程系统上运行 `gedit`\
  \ 工具，但在本地系统上显示用户界面。\n\n### 19.3 可信 X11 转发\n\n你可以通过在 `05_x11forwarding` 文件中添加以下行并重启\
  \ SSH 服务器来启用可信 X11 转发：\n\n```bash\nForwardX1Trusted yes\n```\n\n可信 X11 转发比不可信转发快一点，但安全性较低，因为它没有引入\
  \ X11 安全控制。使用可信 X11 转发时需要 `-Y` 标记：\n\n```bash\nssh -Y user@hostname\n```\n\n###\
  \ 19.4 压缩 X11 转发\n\n在使用慢连接时，可以使用 `-C` 标记对 X11 数据进行压缩以提高性能：\n\n```bash\nssh -X -C\
  \ user@hostname\n```\n\n### 19.5 在 Windows 上显示 Ubuntu 应用\n\n要在 Windows 上显示 Ubuntu，需要在\
  \ Windows 系统上安装 SSH 客户端和 X server。在 Windows 上安装和使用 PuTTY 客户端在书中之前的 在 Ubuntu 22.04\
  \ 上配置基于密钥的身份验证 章节中介绍过。\n\n如果你尚未在 Windows 系统上安装 PuTTY，请参考该章节。\n\n至于 X server，有多种选择，但一个流行的选择是\
  \ VcXsrv，它可以通过以下 URL 免费获取：\n\n[`sourceforge.net/projects/vcxsrv/`](https://sourceforge.net/projects/vcxsrv/)\n\
  \n一旦安装了 VcXsrv X server，名为 XLaunch 的应用程序出现在桌面和开始菜单中。启动 XLaunch 并选择显示选项（最灵活的是 Multiple\
  \ windows 选项，允许每个客户端应用出现在自己的窗口）：\n\n![](img/vcxsrvr_xlaunch_settings.jpg)\n\n图 19-2\n\
  \n\n\n\n点击“Next”按钮继续后续后续屏幕，并接受默认配置设置。在最后一个屏幕上，点击“Finish”按钮启动 X 服务器。如果出现 Windows\
  \ Defender 对话框，请点击按钮允许对所选网络的访问。\n\n一旦运行，XLaunch 将出现在任务栏中，可以通过右键点击该图标并选择“Exit...”菜单选项来退出：\n\
  \n![](img/vcxsrvr_xlaunch_menu.jpg)\n图 19-3\n\n安装并运行 X 服务器后，启动 PuTTY，并输入远程主机的连接信息，或者加载之前保存的会话配置。然而，在建立连接之前，需要启用\
  \ X11 转发。因此，在 PuTTY 主窗口中，向下滚动左侧面板中的选项，展开 SSH 部分，并选择 X11 选项，如图 19-4 所示：\n\n![](img/win_10_putty_ssh.jpg)\n\
  图 19-4\n\n勾选图 19-5 中高亮的“Enable X11 forwarding”复框，返回会话屏幕并打开连接（如果你计划再次使用，请先保存会话）：\n\
  \n![](img/putty_enable_x11_forwarding.jpg)\n图 19-5\n\n在 PuTTY 会话窗口中登录 Ubuntu 系统并运行一个桌面应用。稍等片，该应用将以自己的窗口形式出现在\
  \ Windows 桌面。该应用打开的任何对话框也将出现在单独窗口中，就像它们在 Ubuntu GNOME 桌面上的显示一样。例如，图 19-6 显示了在 Windows\
  \ 11 系统上显示的 Ubuntu nm-connection-editor 工具：\n\n![](img/x11_windows_forwarding.jpg)\n\
  图 19-6\n\n### 19.6 总结\n\n对于需要远程访问单个 Ubuntu 桌面应用而非整个 GNOME 桌面的情况，X11 转发提供了一种远程显示图形应用程序的轻量级解决方案。显示应用程序的系统必须运行基于\
  \ X Window 系统的桌面环境（如 GNOME），或者安装并运行了 X 服务器。一旦在远程服务器上启用了 X11 转发，并在本地系统使用 X11 转发选项建立了安全的\
  \ SSH 连接，大多数应用程序就可以在本地 X 服务器上远程显示。\n\n## 20. 在 Ubuntu 22.04 上使用 NFS 与远程系统共享文件\n\n\
  Ubuntu 提供了两种机制与网络上的其他系统共享文件和文件夹。一种方法是使用名为 Samba 的技术。Samba 基于 Microsoft Windows 文件夹共享，允许\
  \ Linux 系统让文件夹被 Windows 系统访问，并允许 Linux 访问 Windows 文件夹共享。如果其他 Linux 和 UNIX 类系统安装并配置了\
  \ Samba 支持，此方法也可用于在它们之间共享文件夹。这是异构网络环境中共享文件夹最流行的方法。使用 Samba 共享文件夹的内容在“使用 Samba 在\
  \ Ubuntu 22.04 和 Windows 之间共享文件”中介绍。\n\n另一个明确针对 Linux 和 UNIX 类系统之间共享文件夹的选项是网络文件系统\
  \ (NFS)。NFS 允许另一台 Linux 或 UNIX 系统通过网络连接访问一台 Linux 计算机上的文件系统。NFS 由太阳微系统（现为 Oracle\
  \ 公司的一部分）于 20 世纪 80 年代开发，仍然是共享远程 Linux/UNIX 文件系统的标准机制。\n\nNFS 与 Samba 使用的 Windows\
  \ SMB 资源共享技术非常不同。本章将介绍使用 NFS 在 Ubuntu 与其他 UNIX/Linux 类系统之间基于网络的文件夹共享。\n\n### 20.1\
  \ 确保 Ubuntu 上的 NFS 服务运行\n\n第一个任务是验证你的 Ubuntu 系统上已安装并运行 NFS 服务。这可以通过命令行或 Cockpit\
  \ 界面实现。\n\n通过在终端窗口中运行以下命令安装 NFS 服务：\n\n```bash\napt install nfs-kernel-server\n\
  ```\n\n接下来，配置服务在启动时自动启动：\n\n```bash\nsystemctl enable nfs-kernel-server\n```\n\n\
  一旦启用了服务，按如下方式启动它：\n\n```bash\nsystemctl start nfs-kernel-server\n```\n\n### 20.2\
  \ 配置防火墙允许 NFS 流量\n\n接下来，需要配置防火墙以允许 NFS 流量。如果启用了 Uncomplicated Firewall (ufw)，运行以下命令添加规则允许\
  \ NFS 流量：\n\n```bash\nufw allow nfs\n```\n\n相反，如果你使用 firewalld，请运行以下 firewall-cmd\
  \ 命令，并将 `<zone>` 替换为适用于你的防火墙和系统配置的区域：\n\n```bash\nfirewall-cmd --zone=<zone> --permanent\
  \ --add-service=mountd\nfirewall-cmd --zone=<zone> --permanent --add-service=nfs\n\
  firewall-cmd --zone=<zone> --permanent --add-service=rpc-bind\nfirewall-cmd --reload\n\
  ```\n\n### 20.3 指定要共享的文件夹\n\n现在 NFS 正在运行且防火墙已配置，我们需要指定远程 Linux 或 UNIX 系统可以访问 Ubuntu\
  \ 文件系统的哪些部分。这些设置可以在 `/etc/exports` 文件中声明，必须修改该文件以导出通过 NFS 进行远程访问的目录。该文件中导出行的语法如下：\n\
  \n`<export> <host1>(<options>) <host2>(<options>)`\n\n在此文件中，`<export>` 替换为要导出的目录，`<host1>`\
  \ 是授予访问的主机名或 IP 地址，`<options>` 代表施加在该主机上的限制（只读、读写等）。如果需要，可以在同一行中放置多个主机和选项。例如，为 IP\
  \ 地址 `192.168.2.38` 授予只读权限的导出行为：\n\n`/datafiles 192.168.2.38(ro)`\n\n使用通配符允许到多个主机。例如，以下行允许所有主机访问\
  \ `/home/demo`：\n\n`/home/demo *(rw)`\n\n虽然大多数 Linux 发行版默认使用 `no_subtree_check`\
  \ 设置，但 Ubuntu 的 NFS 实现要求在导出指令中包含 `no_subtree_check` 或 `subtree_check`。\n\n在本章中，我们将如下配置\
  \ `/etc/exports`：\n\n`/tmp *(rw,no_subtree_check)`\n`/vol1 192.168.86.42(ro,sync,no_subtree_check)`\n\
  \n配置完成后，需要使用 `exportfs` 命令更新 NFS 服务器维护的导出文件系统表：\n\n```如下：\n\n你也可以使用 `exportfs` 工具从命令行查看当前共享设置：\n\
  \n```\nexportfs\n```\n上述命令将生成如下输出：\n\n`/vol1 192.168.86.42`\n`/tmp *`\n\n### 20.4\
  \ 访问共享文件夹\n\n可以通过从命令行手动挂载并在客户端系统访问共享文件夹。然而，在尝试挂载远程 NFS 文件夹之前，必须在客户端系统中安装 `nfs-common`\
  \ 包：\n\n```bash\napt install nfs-common\n```\n\n从命令行挂载远程文件夹，打开终端窗口并创建一个你想挂载远程共享文件夹的目录：\n\
  \n```bash\nmkdir /home/demo/tmp\n```\n\n接下来，使用远程 NFS 服务器的 IP 地址或主机名输入挂载远程文件夹的命令，例如：\n\
  \n```bash\nsudo mount -t nfs 192.168.86.24:/tmp /home/demo/tmp\n```\n\n远程 `/tmp`\
  \ 文件夹将被挂载到本地系统。一旦挂载，`/home/demo/tmp` 文件夹将包含远程文件夹及其内容。\n\n挂载远程 NFS 系统也可以指定选项。例如，以下命令挂载相同的文件夹，但将其配置为只读：\n\
  \n```bash\nsudo mount -t nfs -o ro 192.168.86.24:/tmp /home/demo/tmp\n```\n\n###\
  \ 20.5 在系统启动时挂载 NFS 文件系统\n\n\n\n\n通过编辑 `/etc/fstab` 文件，也可以配置 Ubuntu 系统在每次启动时自动挂载远程文件系统。当加载到编辑器时，它的内容可能类似于所示：\n\
  \n```\n/dev/disk/by-id/dm-uuid-LVM-Qv7p2RxcHOSG6RjnkgR21xkhaCQ9NC / ext4 defaults\
  \ 0 1\n# /boot was on /dev/nvme0n1p2 during curtin installation\n/dev/disk/by-uuid/aa49b362-6c42-49a6-98ba-7a256a96b4b8\
  \ /boot ext4 defaults 0 1\n# /boot/efi was on /dev/nvme0n1p1 during curtin installation\n\
  /dev/disk/by-uuid/576B-B5F /boot/efi vfat defaults 0 1\n```\n\n例如，要将路径为 `/tmp` 的远程文件夹（其位于\
  \ IP 地址为 `192.168.86.24` 的系统上）挂载到本地路径为 `/home/demo/tmp` 的文件夹中（注意该文件夹必须已经存在），请向 `/etc/fstab`\
  \ 文件中添加以下行：\n\n```\n192.168.86.24:/tmp /home/demo/tmp nfs rw 0 0\n```\n\n下次系统重启时，远程系统上的\
  \ `/tmp` 文件夹将挂载到本地的 `/home/demo/tmp` 挂载点。此时，就可以访问远程文件夹中的所有文件，就像它们存储在本地硬盘上一样。\n\n\
  ## 20.6 卸载 NFS 挂载点\n\n一旦使用 NFS 挂载了远程文件系统，可以使用 `umount` 命令将其卸载，并将本地挂载点作为命令行参数。例如命令将卸载我们的示例文件系统挂载点：\n\
  \n```bash\nsudo umount /home/demo/tmp\n```\n\n## 20.7 在 Cockpit 中访问 NFS 文件系统\n\n\
  除了使用命令行在客户端上挂载远程 NFS 文件系统外，还可以在 Cockpit Web 界面中执行挂载操作。假设客户端系统上已安装并配置了 Cockpit，请在浏览器中登录\
  \ Cockpit 界面，并从左侧导航面板选择“存储”（Storage）选项。如果没有显示“存储”选项，则需要安装 `cockpit-storaged` 包：\n\
  \n```bash\napt install cockpit-storaged\nsystemctl restart cockpit.socket\n```\n\
  \n一旦 Cockpit 服务重启，重新登录 Cockpit 界面，此时“存储”选项应该是可见的。\n\n选择该选项后，主存储页面将包含一个部分，列出所有当前已挂载的\
  \ NFS 文件系统，如图 20-1 所示：\n\n![](img/rhel_cockpit_nfs.jpg)\n图 20-1\n\n要挂载远程文件系统，点击上方突出显示的“+”按钮，并在弹出的对话框中，输入远程\
  \ NFS 服务器和文件共享的信息，以及本地挂载点和任何必要的选项：\n\n![](img/rhel_cockpit_nfs_new.jpg)\n图 20-2\n\
  \n要修改、卸载或删除 NFS 文件系统共享，请在 NFS 挂载列表中选择相应的挂载项（见上方图 20-1），以显示下方所示的图 20-3 页面：\n\n![](img/rhel_cockpit_nfs_modify.jpg)\n\
  图 20-3\n\n在此屏幕中，执行更改服务器或挂载点或卸载文件系统等任务。例如，“删除”（Remove）选项会卸载文件系统并从 `/etc/fstab` 文件中删除条目，以便在下次系统重启时不会重新挂载。\n\
  \n### 20.8 总结\n\n网络文件系统（NFS）是一种基于客户端/服务器的系统，最初由太阳微系统（Sun Microsystems）开发，为 Linux\
  \ 和 Unix 系统提供了通过网络共享文件系统的方法。NFS 允许客户端系统访问并在在权限允许）修改位于远程服务器上的文件，就像这些文件存储在本地文件系统中一样。本章概述了\
  \ NFS，并概述了使用命令行或 Cockpit Web 界面配置客户端和服务器系统的选项。\n\n## 21. 使用 Samba 在 Ubuntu 22.04\
  \ 和 Windows 之间共享文件\n\n尽管 Linux 在桌面市场取得了一定进展，但它的起源和未来在很大程度上是基于服务器的。因此，Ubuntu 可以充当文件服务器并不意外。在网络环境中，Ubuntu\
  \ 和 Windows 系统并肩使用也是很常见的。因此，一个常见需求是 Ubuntu 系统上的文件可以通过网络连接被 Linux、UNIX 和基于 Windows\
  \ 的系统访问。同样，位于 Windows 系统上的共享文件夹和打印机可能也需要从 Ubuntu 的系统访问。\n\nWindows 系统使用服务器消息块（SMB）协议共享文件系统和打印机等资源。为了让\
  \ Ubuntu 系统通过网络向 Windows 系统提供此类资源，反之亦然，它必须支持 SMB。这是通过名为 Samba 的技术实现的。除了提供 Linux\
  \ 和 Windows 系统之间的集成外，Samba 还可以为 Linux 系统之间提供文件夹共享（作为上一章介绍的 NFS 的替代方案）。\n\n在本章中，我们将查看在\
  \ Ubuntu 系统上共享文件系统和打印机的必要步骤，以及从 Ubuntu 访问 Windows 。\n\n### 21.1 从 GNOME 桌面访问 Windows\
  \ \n\n除了使用命令行在客户端上挂载远程 NFS 文件系统外，还可以在 Cockpit Web 界面中执行挂载操作。假设客户端系统已安装并配置了 Cockpit，请在浏览器中登录\
  \ Cockpit 界面，并从左侧导航面板选择“存储”（Storage）选项。如果没有显示“存储”选项，则需要安装 `cockpit-storaged` 包：\n\
  \n```bash\napt install cockpit-storaged\nsystemctl restart cockpit.socket\n```\n\
  \n一旦 Cockpit 服务重启，重新登录 Cockpit 界面，此时“存储”选项应该是可见的。\n\n选择该选项后，主存储页面将包含一个部分，列出所有当前已挂载的\
  \ NFS 文件系统，如图 20-1 所示：\n\n![](img/rhel_cockpit_nfs.jpg)\n图 20-1\n\n要挂载远程文件系统，点击上方突出显示的“+”按钮，并在弹出的对话框中，输入远程\
  \ NFS 服务器和文件共享的信息，以及本地挂载点和任何必要的选项，最后点击“添加”（Add）按钮：\n\n![](img/rhel_cockpit_nfs_new.jpg)\n\
  图 20-2\n\n要修改、卸载或删除 NFS 文件系统共享，请在 NFS 挂载列表中选择相应的挂载项（见上方图 20-1 页面：\n\n![](img/rhel_cockpit_nfs_modify.jpg)\n\
  图 20-3\n\n在此屏幕中，执行更改服务器或挂载点或卸载文件系统等任务。例如，“删除”（Remove）选项会卸载文件系统并从 `/etc/fstab` 文件中删除条目，以便在下次系统重启时不会重新挂载。\n\
  \n### 21.2 Samba 和 Samba 客户端\n\nSamba 允许 Ubuntu 资源与 Windows 系统共享，以及 Windows 资源与\
  \ Ubuntu 系统共享。Ubuntu 使用 Samba 客户端访问 Windows 资源。另一方面，通过安装和配置 Samba 服务，可以在 Ubuntu\
  \ 上共享资源。\n\n### 21.3 在 Ubuntu 上安装 Samba\n\nUbuntu 默认设置通常不会安装必要的 Samba 包。除非你特别请求安装\
  \ Samba，否则你的系统中可能没有安装 Samba。要检查是否安装了 Samba，打开终端窗口并运行以下命令，检查每个包的[已安装]指示：\n\n```bash\n\
  apt -qq list samba-common samba-client\n```\n\n可以使用 `apt` 命令行工具安装任何缺失包：\n\n```bash\n\
  apt install samba-common samba-client\n```\n\n### 21.4 配置 Ubuntu 防火墙启用 Samba\n\n\
  接下来，必须配置保护 Ubuntu 系统的防火墙以允许 Samba 流量。如果你使用的是 Uncomplicated Firewall，请运行以下命令：\n\n\
  ```bash\nufw allow samba\n```\n\n或者，如果你在使用 firewalld，运行如下 `firewall-cmd` 命令：\n\n\
  ```bash\nfirewall-cmd --permanent --add-port={139/tcp,445/tcp}\nfirewall-cmd --reload\n\
  ```\n\n在启动 Samba 服务之前，需要执行一些配置步骤以定义 Ubuntu 系统如何向 Windows 系统显示以及向客户端共享资源。大多数配置任务在\
  \ `/etc/samba/smb.conf` 文件中完成。\n\n### 21.5 配置 smb.conf 文件\n\nSamba 是一个高度灵活且可配置的系统，为控制\
  \ Windows 网络上的资源共享提供了许多选项。遗憾的是，这种灵活性可能会导致人们觉得 Samba 过于复杂。然而，实际上，典型的安装不需要许多配置选项，而且设置基础配置的学习曲线也较短。\n\
  \n\n\n在本章中，我们将介绍将 Ubuntu 系统加入到 Windows 工作组，并设置一个目录作为特定用户可以访问的共享资源。这种配置被称为独立 Samba\
  \ 服务器（standalone Samba server）。也可以更高级的配置，例如将 Samba 集成到活动目录（Active Directory）环境中，但这些超出了本书的范围。\n\
  \n配置 Samba 的第一步是编辑 `/etc/samba/smb.conf` 文件。\n\n### 21.5.1 配置 [global] 部分\n\n`smb.conf`\
  \ 文件分为多个部分。第一部分是 `[global]` 部分，可以在此处指定适用于整个 Samba 配置的设置。虽然这些设置是全局的，但每个选项都可以在其他配置文件的部分中被覆盖。\n\
  \n第一个任务是定义 Ubuntu 资源共享的 Windows 工作组名称。这通过 `[global]` 部分的 `workgroup =` 指令进行控制，其默认配置如下：\n\
  \n```\nworkgroup = WORKGROUP\n```\n\n如有必要，首先将其更改为实际的工作组名称。\n\n除了 `workgroup` 设置外，其他设置表明这是一个独立服务器，用户密码将保护共享资源。在继续配置要共享的资源之前，还需要按照如下方式向\
  \ `[global]` 部分添加其他参数：\n\n```\n[global]\n\n.\n.\n    netbios name = LinuxServer\n\
  ```\n\n“netbios name”属性指定了服务器在网络上其他系统可见的名称。\n\n### 21.5.2 配置共享资源\n\n下一步是配置共享资源（换句话说，即从\
  \ Windows 网络上的其他系统访问的资源）。为了实现这一点，需要为该部分命名名称，以便在共享时引用。例如，如果我们计划共享 Ubuntu 系统的 `/sampleshare`\
  \ 目录，我们可以将部分命名为 `[sampleshare]`。在此部分中，可以使用多种配置选项。然而，对于本示例，我们将定义要共享的目录，指定该目录既可浏览又可写，并声明该资源为公共以便访客用户访问：\n\
  \n```\n[sampleshare]\n    comment = Example Samba share\n    path = /sampleshare\n\
  \    browseable = Yes\n    public = yes\n    writable = yes\n```\n\n要限制特定用户的访问，可以使用“valid\
  \ users”属性，例如：\n\n```\nvalid users = demo, bobyoung, marcewing\n```\n\n### 21.5.3\
  \ 不必要的共享\n\n`smb.conf` 文件预配置了用于共享打印机和系统用户主目录的部分。如果不需要共享这些资源，可以注释掉相应的部分，以便 Samba\
  \ 忽略它们。在接下来的示例中，`[homes]` 部分已被注释：\n\n```\n.\n.\n#[homes]\n# comment = Home Directories\n\
  # valid users = %S, %D%w%S\n# browseable = No\n# read only = No\n# inherit acls\
  \ = Yes\n.\n.\n```\n\n### 21.6 创建 Samba 用户\n\n任何需要访问 Samba 共享资源的用户都必须配置为 Samba 用户并分配密码。此任务通过使用\
  \ `smbpasswd` 命令行工具完成。例如，假设需要一个名为 `demo` 的用户从 Windows 系统访问我们 Ubuntu 系统的 `/sampleshare`\
  \ 目录。为了满足这一要求，我们必须按照如下方式将 `demo` 添加为 Samba 用户：\n\n```\n# smbpasswd -a demo\n```\n\
  \nNew SMB password:\nRetype new SMB password:\nAdded user demo.\n\n现在我们已经完成了基础 Samba\
  \ 服务器的配置，现在是时候测试我们的配置文件并启动 Samba 服务了。\n\n### 21.7 测试 smb.conf 文件\n\n可以使用 `testparm`\
  \ 命令行工具检查 `smb.conf` 文件中的设置是否存在错误，方法如下：\n\n```bash\n# testparm\n\nLoad smb config\
  \ files from /etc/samba/smb.conf\nLoaded services file OK.\nWeak crypto is allowed\n\
  Server role: ROLE_STANDALONE\nPress enter to see a dump of your service definitions\n\
  \n# Global parameters\n\n[global]\nlog file = /var/log/samba/%m.log\nnetbios name\
  \ = LINUXSERVER\nprintcap name = cups\nsecurity = USER\nwins support = Yes\nidmap\
  \ config * : backend = tdb\ncups options = raw\n\n[sampleshare]\ncomment = Example\
  \ Samba share\nguest ok = Yes\npath = /sampleshare\nread only = No\n\n[homes]\n\
  browseable = No\ncomment = Home Directories\ninherit acls = Yes\nread only = No\n\
  valid users = %S %D%w%S\n\n[printers]\nbrowseable = No\ncomment = All Printers\n\
  create mask = 0600\npath = /var/tmp\nprintable = Yes\n```\n\n### 21.8 启动 Samba 和\
  \ NetBIOS 名称服务\n\n为了让 Ubuntu 服务器在 Windows 网络中运行，必须启动 Samba (SMB) 和 NetBIOS 名称服务\
  \ (NMB)。可选情况下，还可以启用这些服务以便它们在每次系统启动时自动运行：\n\n```bash\n# systemctl enable smbd nmbd\n\
  # systemctl start smbd nmbd\n```\n\n在尝试从 Windows 系统连接之前，使用 `smbclient` 实用程序验证共享配置：\n\
  \n```bash\n# smbclient -U demo\n```\n\n### 21.9 访问 Samba 共享\n\n现在 Samba 资源已经配置完成，是时候从\
  \ Windows 系统访问共享资源了。在同一工作组的相应 Windows 系统上，打开资源管理器并右键点击侧边栏中的“网络”。\n\n选择“映射网络驱动器”。选择一个驱动器号并输入\
  \ Samba 共享路径。例如，假设服务器名称为 `LinuxServer`，用户名为 `demo`，文件夹路径将为 `\\\\LINUXSERVER\\demo`。勾选“使用其他凭据连接”并完成。当出现网络凭据对话时，输入之前通过\
  \ `smbpasswd` 命令分配的 Samba 用户名和密码。连接建立后，将弹出一个包含文件夹内容的 Windows 资源管理器窗口。\n\n### 21.10\
  \ 从 Ubuntu 访问 Windows 共享\n\n正如之前提到的，Samba 是双向的，不仅允许 Windows 系统访问托管在 Ubuntu 系统上的文件和打印机，还允许\
  \ Ubuntu 系统访问 Windows 系统上的共享资源。这是通过使用 `samba-client` 包实现的。如果尚未安装，请从终端窗口安装：\n\n```bash\n\
  # apt install smbclient\n```\n\n在 Ubuntu 面上可以使用“文件”应用程序或命令行提示符使用 `smbclient` 和 `mount`\
  \ 工具访问 Windows 共享资源。要在 GNOME 桌面访问任何 Windows 共享资源，启动“文件”应用程序并选择“其他位置”。这将显示包含“Windows\
  \ 网络”图标的屏幕（如果检测到）。选择“Windows 网络”选项将显示网络上检测到的 Windows 系统，并允许访问任何共享资源。\n\n\n\n或者，可以使用“连接到服务器”（Connect\
  \ to Server）选项连接到特定系统。请注意，远程系统的名称或 IP 地址必须以 `smb://` 为前缀，后面可以跟随特定共享资源的路径，例如：\n\n\
  `smb://WinServer/Documents`\n\n在没有桌面环境的情况下，可以使用 `mount` 命令并指定 `cifs` 文件系统类型，从命令行挂载远程\
  \ Windows 共享。例如，以下命令将位于名为 `WinServer` 的 Windows 系统上名为 `Documents` 的共享挂载到名为 `/winfiles`\
  \ 的本地挂载点：\n\n```bash\nmount -t cifs //WinServer/Documents /winfiles -o user=demo\n\
  ```\n\n### 21.11 总结\n\n在本章中，我们学习了如何配置 Ubuntu 系统使其同时作为 Samba 客户端和服务器，从而与 Windows\
  \ 系统共享资源。涵盖的主题包括了 Samba 客户端和服务器包的安装，以及将 Samba 配置为独立服务器。此外，我们还介绍了 `SELinux` 的基本概念，以及为共享资源提供\
  \ Samba 访问权限的步骤。\n\n# 22. 虚拟化技术概述\n\n虚拟化是在单台计算机系统上同时运行多个操作系统的能力。虽然虚拟化不一定是一个新概念，但它在近年来变得流行，因为它提供了一种充分利用服务器系统\
  \ CPU 和资源容量的方法，同时又提供了稳定性（即如果一个虚拟化的虚拟机系统崩溃，主机和其他任何其他虚拟机系统也会继续运行）。\n\n虚拟化在不配置双启动环境的情况下尝试不同的操作系统也很有帮助。例如，你可以在虚拟机中运行\
  \ Windows 而无需重新划分磁盘，只需关闭 Ubuntu 并从 Windows 启动。相反，你可以启动一个虚拟化版本的 Windows 作为客户操作系统。同样，虚拟化还允许你在\
  \ Ubuntu 系统中运行其他 Linux 发行版，提供对这两个操作系统的并发访问。\n\n在决定实现虚拟化的最佳方法时，明确了解目前各种虚拟化解决方案至关重要。因此，本章的目的是通俗地描述目前常用的虚拟化技术。\n\
  \n## 22.1 客户操作系统虚拟化\n\n客户操作系统虚拟化（也称为基于应用程序的虚拟化）是最容易理解的概念。在这种情况下，物理主机运行一个标准的、未修改的操作系统，如\
  \ Windows、Linux、UNIX 或 macOS。运行在该操作系统上的是一个虚拟化应用程序，它的执行方式与任何其他应用程序（如文字处理器或电子表格）在系统上的运行方式非常相似。在这个虚拟化应用程序内部，创建了一个或多个虚拟机，以便在主机上运行客户操作系统。\n\
  \n该虚拟化应用程序负责启动、停止和管理每个虚拟机，并本质上代表每个虚拟机控制对物理硬件资源的访问。虚拟化应用程序还参与一种名为“二进制重写”（binary rewriting）的过程，这涉及扫描执行中的客户操作系统的指令流，并将任何特权指令替换为安全的仿真。这使得客户系统认为它是直接运行在系统硬件上，而不是应用程序内的虚拟机中。\n\
  \n下图所示了基于客户操作系统的虚拟化：\n\n![](img/guest_os_virtualization.jpg)\n\n图 22-1\n\n如上述图所示，客户操作系统在虚拟化应用程序的虚拟机中运行，而虚拟化应用程序又像任何其他应用程序一样运行在主机操作系统之上。客户操作系统与底层主机硬件之间的多层抽象不利于实现高水平的虚拟机性能。然而，这种技术的优势是不需要对主机或客户操作系统进行任何更改，也不需要特殊的\
  \ CPU 硬件虚拟化支持。\n\n## 22.2 虚拟机程序（Hypervisor）虚拟化\n\n在虚拟机程序虚拟化中，虚拟机程序的任务是为虚拟机处理资源和内存分配，并为更高级的管理和监控工具提供接口。基于虚拟机程序的解决方案分为\
  \ Type-1 和 Type-2。\n\nType-2 虚拟机程序（有时称为宿主型虚拟机程序）作为软件应用程序安装并运行在主机操作系统之上，通过协调客户虚拟机对\
  \ CPU、内存和网络等资源的访问来提供虚拟化能力。图 21-2 显示了使用 Type-2 虚拟机程序虚拟化的典型架构：\n\n![](img/type-2_hypervisor_virtualization.jpg)\n\
  \n图 22-2\n\n要理解 Type-1 虚拟机程序的工作原理，了解 Intel x86 处理器架构会有帮助。x86 系列 CPU 提供了一系列被称为“环”（rings）的保护级别，代码可以在这些环中执行。`Ring\
  \ 0` 具有最高级权，操作系统内核通常运行在该环中。在 `ring 0` 中执行的代码被认为运行在系统空间、内核模式或监视模式下。所有其他代码（例如运行在操作系统上的应用程序）都运行在权限较低的环中，通常是\
  \ `ring 3`。\n\n与 Type-2 虚拟机程序相比，Type-1 虚拟机程序（也称为裸金属或原生虚拟机程序）直接运行在主机系统的硬件 `ring 0`\
  \ 上。由于虚拟机程序占据了 CPU 的 `ring 0`，运行在系统上的任何客户操作系统内核必须运行在权限较低的 CPU 环中。遗憾的是，大多数操作系统内核被显式编写为运行在\
  \ `ring 0`，因为它们需要执行在该环中才能执行的任务，例如执行特权 CPU 指令和直接操作内存的能力。近年来针对这个问题设计了几种解决方案，下面分别描述：\n\
  \n### 22.2.1 半虚拟化\n\n在半虚拟化下，客户操作系统的内核经过专门修改以运行在虚拟机程序上。这通常涉及将仅在 CPU 的 `ring 0` 中运行的特权操作替换为对虚拟机程序的调用（称为虚拟机调用，hypercalls）。虚拟机程序随后代表客户内核执行该任务。遗憾的是，这通常将支持限制在\
  \ Linux 等开源操作系统（这些操作系统可以被自由修改）以及所有者已同意针对特定虚拟机程序进行必要代码修改的专用操作系统。尽管存在这些问题，客户内核直接与虚拟机程序通信的能力比其他虚拟化方法具有更高的性能水平。\n\
  \n### 22.2.2 全虚拟化\n\n全虚拟化为未修改的客户操作系统提供支持。“未修改”一词是指没有经过修改以运行在虚拟机程序上的操作系统内核，因此它们仍然像运行在\
  \ CPU 的 `ring 0` 中一样执行特权操作。在这种情况下，虚拟机程序提供提供 CPU 仿真，以处理和修改未修改的客户操作系统内核执行的特权和保护 CPU\
  \ 操作。遗憾的是，这种仿真过程运行需要时间和系统资源，导致其性能水平低于半虚拟化提供的性能。\n\n### 22.2.3 硬件虚拟化\n\n\n\n\n硬件虚拟化利用了\
  \ Intel 和 AMD 最新代 CPU 内置的虚拟化功能。这些技术分别称为 `Intel VT` 和 `AMD-V`，它们为运行未修改的客户虚拟机提供了必要的扩展，且避免了全虚拟化\
  \ CPU 模拟所固有的开销。简单来说，这些处理器在 `ring 0` 之上提供了一个额外的权限模式（`ring -1`），虚拟机程序可以在其中运行，从而将 `ring\
  \ 0` 留给未修改的客户操作系统。\n\n下图展示了第 1 型虚拟机程序的虚拟化方法：\n\n![](img/type-1_hypervisor_virtualization.jpg)\n\
  \n图 22-3\n\n如上图所示，除了虚拟机之外，管理操作系统或控制台也运行在虚拟机程序之上，允许系统管理员对虚拟机进行管理。\n\n### 22.3 虚拟机网络\n\
  \n为了具有实际用途，虚拟机不可避免需要连接到网络。一种方案是客户连接到运行在主机操作系统内部的虚拟网络。在这种配置下，虚拟网络上的任何虚拟机都可以互相可见，但网络地址转换（`NAT`）提供了对外部网络的访问。当使用虚拟网络和\
  \ NAT 时，每个虚拟机在外部网络（即主机所连接的网络）上都使用主机系统的 IP 地址进行表示。这是 Ubuntu 上 `KVM` 虚拟化的默认行为，通常不需要额外的配置。通常，默认会创建一个虚拟网络，名称为\
  \ `default`，设备标识为 `virbr0`。\n\n为了让虚拟机在外部网络上作为独立且单独系统出现（即拥有自己的 IP 地址），必须将其配置为共享主机上的物理网络接口。实现此点的快速方法是配置虚拟机使用“直接连接”网络配置选项（也称为\
  \ `MacVTap`），这将为客户系统提供一个与主机相同网络上的 IP 地址。遗憾的是，虽然使用 `MacVTap` 驱动可以让虚拟机访问网络上的其他系统，但无法在客户和主机之间建立连接。\n\
  \n更好的选项是在主机系统上配置一个网络桥接接口，让虚拟机连接到该。这为虚拟机提供了外部网络上的 IP 地址，同时允许客户和主机进行通信，该主题将在“创建 Ubuntu\
  \ 22.04 KVM 网络桥接接口”章节中进行介绍。\n\n### 22.4 总结\n\n虚拟化是在单个主机操作系统内运行多个客户操作系统的能力。目前已开发出多种虚拟化方法，包括客户操作系统和虚拟机程序虚拟化。虚拟机程序虚拟化分为第\
  \ 1 型和第 2 型两类。第 2 型虚拟化解决方案分为半虚拟化、全虚拟化硬件虚拟化，后者使用了某些 Intel 和 AMD 处理器型号的特殊虚拟化功能。\n\n\
  虚拟机客户操作系统在网络方面有多种选择，包括 NAT、直接连接（MacVTap）和网络桥接配置。\n\n## 23. 在 Ubuntu 22.04 上安装 KVM\
  \ 虚拟化\n\n早期版本的 Ubuntu 提供两个虚拟化平台：基于内核的虚拟机 (`KVM`）和 `Xen`。在最近的发布中，对 `Xen` 的支持已被移除，留下\
  \ `KVM` 作为 Ubuntu 提供的唯一内置虚拟化选项。除了 `KVM` 之外，`VMware` 和 `Oracle VirtualBox` 等产品提供了第三方解决方案。由于\
  \ `KVM` 是随 Ubuntu 提供的，该虚拟化解决方案将在本文及后续章节中介绍。\n\n在深入安装和运行 `KVM` 之前，讨论它如何融入上一节中概述的各种虚拟化类型是值得的。\n\
  \n### 23.1 KVM 概述\n\n`KVM` 被归类为第 1 型虚拟机程序虚拟化解决方案，它通过 `Intel VT` 和 `AMD-V` 硬件虚拟化支持实现了对未修改客户操作系统的全虚拟化。\n\
  \n`KVM` 与许多其他第 1 型解决方案的区别在于，它将主机 Linux 操作系统变成了虚拟机程序，在运行完整的企业级主机操作系统的同时实现了裸金属虚拟化。\n\
  \n### 23.2 KVM 硬件要求\n\n在开始本之前，我们必须讨论在 `KVM` 环境中运行虚拟机的硬件要求。首先，`KVM` 虚拟化仅适用于某些处理器。如之前所述，这些处理器必须包含\
  \ `Intel VT` 或 `AMD-V` 技术。\n\n要检查虚拟化支持，请在终端窗口中运行 `lscpu` 命令：\n\n```\nlscpu | grep\
  \ Virtualization:\n```\n\n如果系统包含支持 `Intel VT` 的 CPU，上述命令将提供以下输出：\n\n```\nVirtualization:\
  \ VT-x\n```\n\n或者，当检测到支持 `AMD-V` 的 CPU 时，将显示以下输出：\n\n```\nVirtualization: AMD-V\n\
  ```\n\n如果 CPU 不支持虚拟化，上述 `lscpu` 命令将没有任何输出。\n\n请注意，虽然上述命令仅报告处理器是否支持相应功能，但它并不表示该功能当前在\
  \ BIOS 中已启用。这是因为在实践中，大多数系统的 BIOS 默认禁用了虚拟化支持。因此，在继续本教程之前，你应该检查 BIOS 设置以确保已启用适当的虚拟化技术。\n\
  \n与双启动环境不同，虚拟化环境涉及在单台计算机上同时运行两个或多个完整的操作系统。这意味着系统必须具有足够的物理内存、磁盘空间和 CPU 处理能力，以舒适地并行运行所有系统。因此，在开始配置和安装之前，请检查\
  \ Ubuntu 以及所选客户操作系统的系统要求，并验证主机系统是否有足够的资源处理这两个系统。\n\n### 23.3 为 Ubuntu 准备 KVM 虚拟化\n\
  \n与 `Xen` 不同，不需要运行特殊内核来支持 `KVM`。因此，通过安装 `KVM` 内核模块，标准内核已经就可以可以使用 `KVM`，从而消除了安装和从特殊内核启动的需求。\n\
  \n然而，为了避免冲突，如果系统当前运行启用了 `Xen` 的内核，请重启系统并在启动菜单中选择非 `Xen` 内核，然后再继续本章后续内容。\n\n设置和维护基于\
  \ KVM 的虚拟化系统所需的工具只有在 Ubuntu 系统安装过程中显式选择时才会默认安装。要在命令行中安装 `KVM` 工具，请在终端窗口中执行以下命令：\n\
  \n```\napt install qemu-kvm libvirt-clients libvirt-daemon-system bridge-utils\n\
  ```\n\n如果你可以使用图形桌面环境，还推荐 `virt-manager` 包：\n\n```\napt install virt-manager\n```\n\
  \n### 23.4 验证 KVM 安装\n\n在继续之前，检查 KVM 安装是否正确是值得的。当 `KVM` 安装并运行时，将有两个模块加载到内核中。可以在终端窗口中运行\
  \ `lsmod` 命令来验证这些模块是否存在：\n\n```\nlsmod | grep kvm\n```\n\n假设安装成功，上述命令应产生类似下面的输出：\n\
  \n```\nkvm_intel 438272 0\n\nkvm 1138688 21 kvm_intel\n```\n\n\n\n请注意，如果系统包含 AMD\
  \ 处理器，`kvm` 模块可能会读取 `kvm_amd` 而不是 `kvm_intel`。\n\n安装过程也应该配置了 `libvirtd` 守护进程在后台运行。再次使用终端窗口，运行以下命令以确保\
  \ `libvirtd` 正在运行：\n\n```bash\n# systemctl status libvirtd\n\n● libvirtd.service\
  \ - Virtualization daemon\n      Loaded: loaded (/lib/systemd/system/libvirtd.service;\
  \ enabled; vendor pres>\n      Active: active (running) since Wed 2023-07-19 11:15:13\
  \ EDT; 21h ago\n```\n\n如果进程未运行，请按照以下方式启动它：\n\n```bash\n# systemctl enable --now\
  \ libvirtd\n# systemctl start libvirtd own\n```\n\n如果可以使用桌面环境，可以通过选择“活动”（Activities）并在搜索框中输入“virt”来运行\
  \ `virt-manager` 工具。当“虚拟机管理器”（Virtual Machine Manager）图标出现时，点击它进行启动。加载完成后，管理器将如如下所示：\n\
  \n![](img/ubuntu_virt-manager.jpg)\n图 23-1\n\n如果没有列出 QEMU/KVM 条目，选择`File -> Add\
  \ Connection`菜单选项，并在弹出的对话框中，在点击`Connect` 按钮之前选择`QEMU/KVM Hypervisor`：\n\n![](img/ubuntu-virt-manager_connection.jpg)\n\
  图 23-2\n\n如果管理器当前未连接到虚拟化进程，右键点击列出的条目并从弹出菜单中选择“Connect”。\n\n### 23.5 总结\n\nKVM 是一种\
  \ Type-1 虚拟机虚拟化解决方案，它利用 Intel VT 和 AMD-V 硬件虚拟化支持实现了对未修改客机操作系统的全虚拟化。它是 Ubuntu 自带的默认虚拟化解决方案，可以快速地安装在任何具有适当处理器支持的\
  \ Ubuntu 系统上。安装并启用 KVM 支持后，接下来的章节将概述在 Ubuntu 主机上安装和管理虚拟机的某些选项。\n\n## 24. 在 Ubuntu\
  \ 22.04 上使用 Cockpit 创建 KVM 虚拟机\n\n可以使用 `virt-install` 命令行工具、`virt-manager` GUI 工具或\
  \ Cockpit Web 控制台的虚拟机模块在 Ubuntu 上轻松配置基于 KVM 的虚拟机。本章将使用 Cockpit 在 Ubuntu 主机上安装操作系统作为\
  \ KVM 客机。标题为在 Ubuntu 22.04 上使用 virt-manager 创建 KVM 虚拟机”的章节将涵盖如何使用 `virt-manager`\
  \ 工具创建新虚拟机。\n\n下一章“使用 virt-install 和 virsh 创建 KVM 虚拟机”将涵盖使用命令行方法创建虚拟机。\n\n### 24.1\
  \ 安装 Cockpit 虚拟机模块\n\n默认情况下，标准 Cockpit 安装中可能不包含虚拟机模块。假设 Cockpit 已安装并配置好，可以通过以下方式安装虚拟机模块：\n\
  \n```bash\n# apt install cockpit-machines\n```\n\n安装完成后，下次登录 Cockpit 界面时，导航面板中将出现“虚拟机”（图\
  \ 24-1 中标记为 A 的选项）选项：\n\n![](img/ubuntu_cockpit_virtualization.jpg)\n图 24-1\n\n\
  ### 24.2 在 Cockpit 中创建虚拟机\n\n要在 Cockpit 中创建虚拟机，点击图 24-1 中标记为 B 的“Create VM”按钮以显示创建对话框。\n\
  \n在对话框中，为机器输入名称，并选择安装介质是通过 URL 访问的 ISO 形式还是本地文件系统路径，或者为客机请求选择供应商和操作系统类型信息，并选择“下载操作系统”（Download\
  \ an OS）选项以便在安装过程中自动下载安装镜像。\n\n此外，指定用于操作系统安装的虚拟磁盘驱动的大小以及分配给虚拟机的内存量：\n\n![](img/ubuntu_cockpit_create_vm.jpg)\n\
  图 24-2\n\n点击“Create”按钮构建虚拟机。创建过程完成后，从列表中选择新虚拟机以显示配置详情，如图 24-3 所示：\n\n![](img/rhel_cockpit_vm_overview.jpg)\n\
  图 24-3\n\n正如“虚拟化技术概述”中描述，KVM 为虚拟机提供了网络配置方面的多个选项。要查看并更改虚拟机的网络设置，滚动到虚拟机概览屏幕的“网络接口”部分并点击“编辑”按钮：\n\
  \n![](img/ubuntu_cockpit_vm_network.jpg)\n图 24-4\n\n在弹出的对话框中，可以使用“网络类型”菜单来更改网络连接类型，例如，从虚拟网络（NAT）更改到直接附加（MacVTap）或桥接至局域网。\n\
  \n### 24.3 启动安装\n\n要启动新虚拟机并从指定的介质安装客机操作系统，请点击概述页顶部的“Install”按钮。Cockpit 将启动虚拟机并滚动到“控制台”（Console）视图，客机\
  \ OS 屏幕将显示在此：\n\n![](img/ubuntu_vm_running.jpg)\n图 24-5\n\n如果失败，通常是因为 QEMU 模拟器以\
  \ qemu 用户身份运行，该用户没有访问目录的权限。要解决此，打开终端窗口（如果是远程系统则通过 SSH 连接），进入 ISO 镜像目录，并将 `libvirt-qemu`\
  \ 用户添加到访问控制列表（ACL）中：\n\n```bash\n# cd /path/to/iso\n# setfacl -m u:libvirt-qemu:x\n\
  ```\n\n更改后，按如下所示检查设置：\n\n```bash\n# getfacl ..\n# owner: demo\n# group: demo\n#\
  \ user::rwx\n# group::x\n# other::---\n```\n\n更改完成后，再次点击“Install”按钮完成安装。为了在物理硬件上安装操作系统，可以在控制台视图中交互。如果控制台太小无法容纳整个客机屏幕，点击右上角的“展开”按钮。\n\
  \n\n\n一旦虚拟机创建完成，Cockpit 界面就可以监控该机器并执行重启、关闭或删除客操作系统等任务。磁盘（Disks）面板上还包含一个用于向虚拟机配置中添加磁盘的选项。\n\
  \n## 24.4 使用存储卷和存储池\n\n当创建虚拟机时，它通常至少有一个虚拟磁盘驱动器。代表这些虚拟磁盘驱动器的镜像存储在存储池中。存储池可以是本地文件系统上的现有目录、文件系统分区、物理磁盘设备、逻辑卷管理（LVM）卷组，甚至可以是远程网络文件系统（NFS）。\n\
  \n每个存储池被划分为一个或多个存储卷。存储卷通常是单个镜像文件，每个文件代表一个虚拟磁盘驱动器，但也可以以物理磁盘分区、整个磁盘驱动器或 LVM 卷组的形式存在。\n\
  \n在使用步骤创建虚拟机时，会创建一个默认存储池来存储虚拟机镜像。该默认存储池占用根文件系统的空间，并且可以在 Cockpit 虚拟机界面内部，通过选择上方标记为\
  \ C 的面板中图 24-1 顶部的“存储池”（Storage Pools）选项进行查看。\n\n选择后，将出现如下方图 24-7 所示的屏幕，其中包含系统当前配置的存储池列表：\n\
  \n![](img/rhel_cockpit_vm_storage_pools.jpg)\n\n图 24-7\n\n在上述示例中，默认存储池位于根文件系统，并将虚拟机镜像存储在\
  \ `/var/lib/libvirtd/images` 目录下。要查看池中包含的存储卷，请选择图 24-8 中高亮显示的“存储卷”（Storage Volumes）选项页：\n\
  \n![](img/cockpit_virtual_machines_storage_pools.jpg)\n\n图 24-8\n\n在演示客操作机的情况下，存储卷以名为\
  \ `demo-vm-guest.qcow2` 的镜像文件形式存在。此外，该池还包含一个包含安装 ISO 镜像的存储卷。要确定特定虚拟机使用的是哪个存储卷，请返回虚拟机\
  \ Cockpit 主屏幕，选择该虚拟机并滚动到“磁盘”（Disks）面板，如图 24-9 所示：\n\n![](img/ubuntu_cockpit_vm_disks.jpg)\n\
  \n图 24-9\n\n虽然出于测试目的和早期实验使用默认存储池是可以的，但建议为通用的虚拟化用途创建额外的池。要创建一个新的存储池，请在 Cockpit 中显示“存储池”屏幕，并点击“创建存储池”按钮以显示如图\
  \ 24-10 所示的对话框：\n\n![](img/rhel_cockpit_vm_create_pool.jpg)\n\n图 24-10\n\n在上述示例中，正在创建一个名为\
  \ `MyPool` 的新存储池，该池使用本地文件系统中挂载为 `/MyPool` 的文件系统分区（关于磁盘驱动器、分区和挂载点的话题将在章节后续为“向 Ubuntu\
  \ 22.04 系统添加新磁盘驱动器”的章节中介绍）。一旦创建完成，该池将列在 Cockpit 存储池屏幕中，并随着新虚拟机的创建而包含存储卷。\n\n###\
  \ 24.5 总结\n\n本章概述了如何使用 Cockpit Web 界面创建和管理基于 KVM 的虚拟机。Cockpit 界面的优势在于不需要访问运行在主机系统上的桌面环境。另一种选择是使用下一章概述的\
  \ `virt-manager` 图形工具。\n\n## 25. 在 Ubuntu 22.04 上使用 virt-manager 创建 KVM 虚拟机\n\n\
  上一章探讨了如何使用 Cockpit Web 工具在 Ubuntu 上创建 KVM 虚拟机。尽管考虑到一旦虚拟机 Cockpit 扩展完全实现，`virt-manager`\
  \ 可能在某天会被停止，但本章将介绍如何使用此工具创建新的虚拟机。\n\n### 25.1 启动虚拟机管理器\n\n如果你尚未安装，请按照以下方式安装 `virt-manager`\
  \ 软件包：\n\n```bash\napt install virt-manager\n```\n\n接下来，在终端窗口中通过运行 `virt-manager`\
  \ 从命令行启动虚拟机管理器。加载后，虚拟机管理器将在显示下屏幕之前提示输入当前活动用户的密码：\n\n![](img/ubuntu_virt-manager1.jpg)\n\
  \n图 25-1\n\n主屏幕列出了系统上运行的当前虚拟机。\n\n默认情况下，管理器应该连接到系统的 `libvirtd` 实例。如果没有，通过右键点击列表中的项并在弹出菜单中选择“连接”（Connect）连接到主机系统。\n\
  \n要管理基于会话的虚拟机，选择“File -> Add Connection...”菜单选项以显示如图 25-2 所示的对话框：\n\n![](img/ubuntu-virt-manager_connection1.jpg)\n\
  \n图 25-2\n\n从虚拟机程序（Hypervisor）菜单选择 `QEMU/KVM` 用户会话，并点击此对话框中的“连接”（Connect）按钮。返回 `virt-manager`\
  \ 主屏幕后，`QEMU/KVM` 会话现在应如图 25-1 所示列\n\n要创建一个虚拟机，点击新建虚拟机按钮（工具栏最左侧的按钮）以显示新建向导的第一个屏幕。在“名称”（Name）字段中为虚拟机输入一个描述性的名称。在此屏幕上，还要选择用于安装操作系统的介质位置。这可以是\
  \ CD 或光驱、主机可访问的 ISO 镜像、使用 HTTP、FTP、NFS 或 PXE 进行网络安装，或现有虚拟机的磁盘镜像：\n\n![](img/ubuntu-virt-manager_new_vm.jpg)\n\
  \n图 25-3\n\n### 25.2 配置 KVM 虚拟机\n\n点击“下一步”（Forward）将显示一个寻求安装过程信息的屏幕。显示的屏幕和所需信息将取决于初始屏幕上的选择。例如，如果选择了\
  \ CD、光驱或 ISO，此屏幕将询问 ISO 文件或物理介质的具体位置。此屏幕还会根据指定的安装介质识别客操作系统的类型和版本（例如 Windows 版本或\
  \ Linux 发行版）。如果无法识别，关闭“从安装介质/源自动检测”（Automatically detect from installation media/source）选项，输入操作系统名称的前几个字符，并从匹配列表中选择选项：\n\
  \n![](img/ubuntu_virt_manager_iso.jpg)\n\n图 25-4\n\n完成这些设置后，点击“下一步”按钮配置 CPU 和内存设置。最佳设置取决于主机上存在的\
  \ CPU 数量和物理内存量，以及与新虚拟机并行运行的其他应用程序和虚拟机的要求：\n\n![](img/ubuntu_virt_manager_new_vm_cpu.jpg)\n\
  \n图 25-5\n\n在下一个屏幕上，可以使用选项创建指定大小的镜像磁盘、选择现有的卷或创建指定格式（raw、vmdk、ISO 等）的存储卷。除非你对使用特定格式有特殊需求（例如，你以后可能需要使用\
  \ `vmdk` 迁移到基于 VMware 的虚拟化环境）或需要使用专用磁盘或分区，否则在此屏幕上指定大小通常足够了：\n\n![](img/ubuntu_virt_manager_new_vm_disk.jpg)\n\
  \n图 25-6\n\n\n\n如果在此处使用默认设置，虚拟机将使用默认存储池内的存储卷作为虚拟磁盘驱动器。要使用在前一中创建的自定义“MyPool”存储池，请在点击\
  \ `Manage...` 按钮之前启用 `Select` 或创建自定义存储选项。\n\n在存储卷对话框中，在左侧面板选择 `MyPool` 条目，然后点击主面板中的\
  \ `+` 按钮创建一个新的存储卷：\n\n![](img/ubuntu_virt-install_new_vm_pool.jpg)\n图 25-7\n\n请注意，对话框左下角的\
  \ `+` 按钮也可以用于创建新的存储池，作为使用 `Cockpit` 接口的替代方案。\n\n在配置屏幕（图 25-8）中，为存储卷命名，选择卷大小，并点击\
  \ `Finish` 按钮创建卷并将其分配给虚拟机：\n\n![](img/ubuntu_virt-manager_add_volume_to_pool.jpg)\n\
  图 25-8\n\n一旦完成这些设置，选择新卷并点击 `Choose Volume` 按钮。然后再次点击 `Forward` 按钮。最终屏幕将显示配置摘要。检查显示的信息。还有高级选项可以更改客\
  \ true 机的虚拟网络配置，如图 25-9 所示：\n\n![](img/virt-manager_network.jpg)\n图 25-9\n\n###\
  \ 25.3 启动 KVM 虚拟机\n\n点击 `Finish` 按钮开始创建过程。虚拟机管理器将在启动客机系统之前创建磁盘并配置虚拟机。最后，新的虚拟机将出现在主\
  \ `virt-manager` 窗口中，状态设置为 `Running`，如图 25-10 所示：\n\n![](img/ubuntu_virt-manager_vm_running.jpg)\n\
  图 25-10\n\n默认情况下，虚拟机的控制台应出现在虚拟机查看器窗口中。若要在今后的任何时间查看运行中机器的控制台，请确保它在虚拟机列表中被选中，并选择工具栏上的\
  \ `Open` 按钮。虚拟机查看器应准备好开始安装过程：\n\n![](img/ubuntu_virt-manager_guest_console.jpg)\n\
  图 25-11\n\n从现在起，按照安装说明在 KVM 虚拟机中安装客 true 操作系统。\n\n### 25.4 总结\n\n在 Ubuntu 宿主机系统上有多种方法创建新的基于\
  \ KVM 的虚拟机。本章使用 `virt-manager` 图形工具来创建、配置和运行客 true 操作系统，包括创建新的存储卷。在涵盖这些基础知识后，下一章将介绍如何从命令行创建虚拟机。\n\
  \n## 26. 使用 virt-install 和 virsh 创建 KVM 虚拟机\n\n在之前的章节中，我们探索了如何使用 `Cockpit` 和 `virt-manager`\
  \ 图形工具在 Ubuntu 宿主机上创建 KVM 客 true 操作系统。本章将重点介绍使用 `virt-install` 和 `virsh` 命令行工具创建基于\
  \ KVM 的虚拟机。这些工具提供了 `virt-manager` 和 `Cockpit` 选项的所有功能，且优点是可以在脚本中使用以自动化虚拟机的创建。此外，`virsh`\
  \ 命令允许根据配置文件中的规范来创建虚拟机。\n\n`virt-install` 工具允许通过提供一系列命令行选项来创建新的虚拟机。本章假设已安装必要的 KVM\
  \ 工具。详细信息请阅读章节“在 Ubuntu 22.04 上安装 KVM 虚拟化”。\n\n### 26.1 运行 virt-install 构建 KVM 客\
  \ true 系统\n\n`virt-install` 程序接受广泛的命令行参数，这些参数提供了与正在创建的虚拟机相关的配置信息。某些命令行选项是强制性的（明确要求提供\
  \ `name`、`memory` 和 `disk` 存储），而其他是可选的。\n\n至少，`virt-install` 命令通常需要以下参数：\n\n*  \
  \ --name` - 分配给虚拟机的名称。\n*   --memory` - 分配给虚拟机的内存量。\n*   --disk` - 虚拟机存储镜像文件的名称和位置。在虚拟机创建期间，`virt-install`\
  \ 将创建此文件，除非指定 `--import` 选项指示使用现有的镜像文件。\n*   --cdrom` 或 `--location` - 指定包含客 true\
  \ 操作系统安装介质的本地路径或远程 ISO 镜像的 URL。\n\n使用 `virt-install` 时可用的所有参数摘要可以在 man 手页中找到：\n\n\
  ```bash\n$ man virt-install\n```\n\n### 26.2 一个 Ubuntu virt-install 命令示例\n\n参考上面的命令行参数列表，我们现在来看使用\
  \ `virt-install` 工具的命令行结构示例。\n\n注意，为了显示虚拟机并完成安装，在 `virt-install` 程序启动虚拟机后，必须将 `virt-viewer`\
  \ 实例连接到虚拟机。默认情况下，`virt-install` 在虚拟机开始运行后尝试启动 `virt-viewer`。然而，如果 `virt-viewer`\
  \ 不可用，它将一直等待。例如，`virt-viewer` 会话可能会在宿主机上本地运行，或者从远程客户端建立连接，如在 Ubuntu 22.04 上使用 virt-manager\
  \ 创建 KVM 虚拟机”章节所示。\n\n以下命令创建一个运行半虚拟化的 Ubuntu 虚拟机。它创建一个新的磁盘，为虚拟机分配 2048MB 内存，并为安装介质配置虚拟光驱设备：\n\
  \n```bash\nvirt-install --name demo_vm_guest --memory 2048 --disk path=/tmp/demo_vm_guest.img,size=10\
  \ --network network=default --cdrom /home/demo/iso/ubuntu-22.04.2-desktop-amd64.iso\n\
  ```\n\n在创建过程中，`virt-install` 命令将显示创建进度的状态更新：\n\n```text\nStarting install...\nAllocating\
  \ 'demo_vm_guest.img' | 10 GB 00:00:01\nRunning graphical console command: virt-viewer\
  \ --connect qemu:///system --wait demo_vm_guest\n```\n\n一旦创建了虚拟机，`virt-viewer` 屏幕将出现，包含从安装介质加载的操作系统安装程序：\n\
  \n![](img/ubuntu_virsh_vm_running.jpg)\n图 26-1\n\n从这里开始，按照标准安装程序进行操作。\n\n### 26.3\
  \ 从命令行启动和停止虚拟机\n\n既然是从命令行创建的虚拟机，推断以后可能也需要从命令行启动它。可以通过 `virsh` 命令行工具实现，并引用创建时分配的名称。例如：\n\
  \n```bash\n# virsh start demo_vm_guest\n```\n\n同样，可以通过以下方式向虚拟机发送关机信号：\n\n```bash\n\
  # virsh shutdown demo_vm_guest\n```\n\n假设虚拟机未响应关机信号且未开始正常关机。在这种情况下，可以使用 `destroy`\
  \ 指令销毁虚拟机（带有数据丢失的风险）：\n\n```bash\n# virsh destroy demo_vm_guest\n```\n\n### 26.4\
  \ 从配置文件创建虚拟机\n\n\n\n\n`virsh create` 命令可以接受一个配置文件的名称作为参数，并基于该文件创建新的虚拟机。该配置文件使用 XML\
  \ 格式。创建配置文件的最简单方法是导出现有虚拟机的配置，并针对新虚拟机对其进行修改。这可以通过使用 `virsh dumpxml` 命令实现。例如，以下命令将名为\
  \ `demo_vm_guest` 的虚拟机域的配置数据输出到名为 `demo_vm_guest.xml` 的文件中：\n\n```bash\nvirsh dumpxml\
  \ demo_vm_guest > demo_vm_guest.xml\n```\n\n一旦生成了文件，将其加载到编辑器中，以检查并更改新虚拟机的设置。\n\n\
  至少，必须更改 `<name>`、`<uuid>` 和镜像文件路径 `<source file>`，以避免与获取配置的虚拟机发生冲突。对于 `UUID`，可以从文件中删除此行。\n\
  \n根据需要，也可以更改虚拟化类型、内存分配和 CPU 数量（包括但不限于这些选项）。一旦修改了文件，可以按照如下方式创建新虚拟机：\n\n```bash\n\
  virsh create demo_vm_guest.xml\n```\n\n### 26.5 总结\n\nKVM 提供了 `virt-install` 和 `virsh`\
  \ 命令行工具，作为使用 `Cockpit` 和 `virt-manager` 工具创建和管理虚拟机实例的快速高效的替代方案。这些工具的优势可以在脚本内部使用它们来实现虚拟机的自动化创建和管理。`virsh`\
  \ 命令还包含了从基于 XML 的配置文件创建 VM 实例的选项。\n\n## 27. 创建 Ubuntu 22.04 KVM 网络桥接接口\n\n默认情况下，Ubuntu\
  \ 上的 KVM 虚拟化环境会创建一个虚拟网络，虚拟机可以连接到该网络。也可以使用 `MacVTap` 驱动配置直接连接。然而，如\"虚拟化技术概述 章节所述，这种方法不允许主机和客体系统之间进行通信。\n\
  \n本章将介绍在 Ubuntu 上创建网络桥接的步骤，允许客体系统共享主机的一个或多个物理网络连接，同时允许客体和主机系统进行通信。\n\n在本章的剩余部分，我们将解释如何为基于\
  \ KVM 的客体操作系统配置 Ubuntu 网络桥接。\n\n### 27.1 获取当前的网络管理器设置\n\n可以使用 `NetworkManager` 命令行界面工具\
  \ (`nmcli`) 创建网络桥接。Ubuntu 系统默认安装并启用了 `NetworkManager`，它负责检测和连接网络设备，并提供管理网络配置的接口。\n\
  \n可以通过如下方式显示主机系统当前的网络连接列表：\n\n```bash\nnmcli con show\n```\n\n```\nNAME UUID TYPE\
  \ DEVICE\nWired connection 1 daae7adc-2a52-3fa0-9085-25748531e1b6 ethernet eno1\n\
  virbr0 299e0d95-4f39-4e65-aace-c7abbd8b018d bridge virbr0\nvnet2 bcb3cd6e-dae4-4545-b98b-e8f90c86dadb\
  \ tun vnet2\n```\n\n上述输出显示主机已通过名为 `eno1` 的设备建立了以太网网络连接，并有一个名为 `virbr0` 的默认桥接接口，该接口提供了对基于\
  \ NAT 的虚拟网络的访问，KVM 客体系统默认连接到该网络。\n\n同样，可以使用以下命令识别系统上当前配置的设备（包括虚拟和物理）：\n\n```bash\n\
  nmcli device show\n```\n\n```\nGENERAL.DEVICE: eno1\nGENERAL.TYPE: ethernet\nGENERAL.HWADDR:\
  \ 00:23:24:52:52:57\nGENERAL.MTU: 1500\nGENERAL.STATE: 100 (connected)\nGENERAL.CONNECTION:\
  \ Wired connection 1\nGENERAL.CON-PATH: /org/freedesktop/NetworkManager/ActiveC>\n\
  WIRED-PROPERTIES.CARRIER: on\nIP4.ADDRESS[1]: 192.168.86.39/24\nIP4.GATEWAY: 192.168.86.1\n\
  IP4.ROUTE[1]: dst = 169.254.0.0/16, nh = 0.0.0.0, mt >\nIP4.ROUTE[2]: dst = 192.168.86.0/24,\
  \ nh = 0.0.0.0, mt>\nIP4.ROUTE[3]: dst = 0.0.0.0/0, nh = 192.168.86.1, mt >\nIP4.DNS[1]:\
  \ 192.168.86.1\nIP4.DOMAIN[1]: lan\nIP6.ADDRESS[1]: fda8:b48c:1079:0:5f:670e:a693:9ae2/64\n\
  IP6.ADDRESS[2]: fda8:b48c:1079:0:c734:89bd:8384:992d/64\nIP6.ADDRESS[3]: fda8:b48c:1079:0:5f:670e:a693:9ae2/64\n\
  ```\n*(注：由于原文文本截断，翻译根据原文逻辑保持一致)*\n\n### 27.2 从命令行创建网络桥接\n\n[注：原文在此处截断，原文为：\nIP6.ADDRESS[3]:\
  \ fda8:b48c:1079:0:5f:670e:a693:9ae2/64 (此处为原文提供的重复或截断内容)\n...\n根据您提供的原文文本，内容在 27.2\
  \ 处出现了截断。我将基于您提供的最后一段逻辑进行翻译。]*\n\n*(由于您提供的待翻译文本在 27.2 标题后即中断，后续具体步骤无法翻译。请提供完整文本以获得完整翻译。)*\n\
  \n**修正说明：** 我发现您提供的原始文本在 `## 27.2 Creating a Network Bridge from the Line` 之后缺失了。我为您翻译了已提供的部分。\n\
  \n\n\n\n\n如果你在主机上进行本地操作，那么这两个 `nmcli` 命令可以在终端窗口中运行，而没有任何丢失连接的风险：\n\n```bash\nnmcli\
  \ con down \"Wired connection 1\"\nnmcli con up br0\n```\n\n一旦网桥启动并运行，连接列表现在应该包含网桥和网桥从属连接：\n\
  \n```bash\nnmcli con show\n```\n\nNAME UUID TYPE DEVICE\nbr0 8680c281-6d49-4f76-93b1-902c42514ca5\
  \ bridge br0\nvirbr0 556042d4-2e5d-45fe-9c78-a24259e07265 bridge virbr0\nbridge-slave-eno1\
  \ e6ba8ead-8fa9-4434-a884-d39225ecda20 ethernet eno1\nWired connection 1 126ab0e8-d4d3-3326-bd5e-1fea169c5635\
  \ ethernet --\n\n注意，“Wired connection 1”连接仍然列在其中，但不再处于活跃状态。要从列表中排除非活跃连接，请在请求列表时使用\
  \ `--active` 标记：\n\n```bash\nnmcli con show --active\n```\n\nNAME UUID TYPE DEVICE\n\
  br0 8680c281-6d49-4f76-93b1-902c42514ca5 bridge br0\nvirbr0 556042d4-2e5d-45fe-9c78-a24259e07265\
  \ bridge virbr0\nbridge-slave-eno1 e6ba8ead-8fa9-4434-a884-d39225ecda20 ethernet\
  \ eno1\n\n### 27.3 声明 KVM 网桥网络\n\n此时，网桥连接已在系统上，但对 KVM 环境并不可见。运行 `virsh` 命令仍然会列出默认网络作为唯一的可用网络选项：\n\
  \n```bash\nvirsh net-list --all\n```\n\n Name State Autostart Persistent\n----------------------------------------------------------\n\
  \ default active yes yes\n\n在虚拟机可以使用网桥之前，必须对其进行声明并将其添加到 KVM 网络配置中。这涉及创建一个定义文件，并且再次使用\
  \ `virsh` 命令行工具。\n\n首先为名为 `bridge.xml` 的网桥网络创建一个定义文件，其内容如下：\n\n```xml\n<network>\n\
  \  <name>br0</name>\n  <forward mode=\"bridge\"/>\n  <bridge name=\"br0\" />\n</network>\n\
  ```\n\n接下来，使用该文件定义新网络：\n\n```bash\nvirsh net-define ./bridge.xml\n```\n\n一旦定义了网络，启动它，并根据需要将其配置为在每次系统重启动时自动启动：\n\
  \n```bash\nvirsh net-start br0\nvirsh net-autostart br0\n```\n\n再次列出网络，以验证网桥网络现在在\
  \ KVM 环境内是否可访问：\n\n```bash\nvirsh net-list --all\n```\n\nName State Autostart Persistent\n\
  ----------------------------------------------------------\n br0 active yes yes\n\
  \ default active yes yes\n\n### 27.4 在虚拟机中使用网桥网络\n\n要创建一个使用网桥网络的虚拟机，请使用 `virt-install\
  \ --network` 选项并指定 `br0` 网桥名称。例如：\n\n```bash\nvirt-install --name demo_vm_guest\
  \ --memory 1024 --disk path=/tmp/demo_vm_guest.img,size=10 --network network=br0\
  \ --cdrom /home/demo/ubuntu-22.04-desktop-amd64.iso\n```\n\n当客操作系统运行时，它将出现在与主机系统相同的物理网络上，而不再位于基于\
  \ NAT 的虚拟网络上。\n\n也可以通过在 Cockpit 界面中编辑虚拟机、找到“网络接口”部分并点击下方图 27-1 所示的“编辑”按钮，为虚拟机选择网桥：\n\
  \n![](img/cockpit_network_interface.jpg)\n\n图 27-1\n\n在生成的接口设置对话框中，将“接口类型”菜单更改为“桥接到局域网”（Bridge\
  \ to LAN），并将源源设置为 `br0`，如图 27-2 所示：\n\n![](img/cockpit_kvm_bridge.jpg)\n\n图 27-2\n\
  \n同样，当使用 `virt-manager` 工具创建新虚拟机时，网桥将在“网络”选择菜单中可用：\n\n![](img/virt-manager_bridge.jpg)\n\
  \n图 27-3\n\n要修改现有虚拟机以使用网桥，请使用 `virsh edit` 命令。该命令会将 XML 定义文件加载到编辑器中，可以在其中进行更改并保存：\n\
  \n```bash\nvirsh edit GuestName\n```\n\n默认情况下，文件将加载到 `vi` 编辑器中。要使用不同的编辑器，请更改 `$EDITOR`\
  \ 环境变量，例如：\n\n```bash\nexport EDITOR=gedit\n```\n\n要更改默认的虚拟网络，定位到文件的 `<interface>`\
  \ 部分，对于基于 NAT 的配置，内容如下：\n\n```xml\n<interface type='network'>\n    <mac address='<your\
  \ mac address here>'/>\n</interface>\n```\n\n如果虚拟机已经在运行，更改将不会生效。\n\n## 27.5 使用 nm-editor\
  \ 创建网桥网络\n\n如果主机系统可以使用本地或远程桌面访问，大部分网桥配置可以使用 `nm-editor` 工具完成。要使用该工具，请在桌面内打开终端并输入以下命令：\n\
  \n```bash\nnm-editor\n```\n\n当工具加载后，将出现如图 27-4 所示的窗口，列出当前配置的网络（本质上与 `nmcli con show`\
  \ 命令生成的输出相同）：\n\n![](img/nm_editor_virbr.jpg)\n\n图 27-4\n\n要创建新连接，点击窗口左下角的 `+` 按钮。然后，从生成的对话框（图\
  \ 27-5）中选择“网桥”（Bridge）选项：\n\n![](img/nm_editor_connection_type.jpg)\n\n图 27-5\n\n\
  选择网桥选项后，点击“创建”（Create）按钮进入网桥配置界面。首先将连接和接口名称更改为 `br0`，然后点击网桥列表右侧的“添加”（Add）按钮，如图 27-6\
  \ 所示：\n\n![](img/nm_editor_edit_br0.jpg)\n\n图 27-6\n\n在连接类型对话框（图 27-7）中，将菜单设置更改为“以太网”（Ethernet），然后点击“创建”（Create）按钮：\n\
  \n![](img/nm_editor__ethernet_connection.jpg)\n\n图 27-7\n\n现在会出现另一个对话框，需要在其中配置网桥从属。在此对话框中，从“设备”（Device）菜单选择网桥要连接的物理网络（例如\
  \ `eno1`）：\n\n![](img/nm_editor_edit_bridge.jpg)\n\n图 27-8\n\n点击“保存”（Save）按钮应用更改并返回编辑\
  \ br0 对框（如图 27-6 所示）。在此对话框中，点击“保存”按钮创建网桥。返回主窗口后，新的网桥和从属连接现在应该列在其中：\n\n![](img/nm_editor_bridge_added.jpg)\n\
  \n图 27-9\n\n\n\n\n与使用命令行工具创建桥接时一样，也有必要将此桥接添加到 KVM 网络配置中。要此操作，请重复上方“声明 KVM 桥接网络”节列出的步骤。完成此步骤后，桥接即可供客户虚拟机使用。\n\
  \n### 27.6 总结\n\n默认情况下，KVM 虚拟机连接到虚拟网络，该网络使用 NAT 提供对宿主机系统连接的网络的访问。如果需要虚拟机以其自身的 IP\
  \ 地址出现在网络中，则需要配置它们共享宿主机系统的物理网络接口。本章概述了如何使用 `nmcli` 或 `nm-connection-editor` 工具创建网络桥接接口来实现这一目标。\n\
  \n## 28 使用 virsh 命令行工具管理 KVM\n\n在之前的章节中，我们已经涵盖了在 Ubuntu 上安装和配置基于 KVM 的访机操作系统。本章将探索\
  \ `virsh` 工具中之前章节未涉及的额外领域，以及如何通过命令行管理基于 KVM 的访机操作系统。\n\n### 28.1 virsh Shell 和命令行\n\
  \n`virsh` 工具既是一个命令行工具也是一个交互式 shell 环境。在命令行模式下，通过在命令提示符处输入适用于任务的一组参数发布命令。\n\n要将选项作为命令行参数使用，请在终端命令提示符中使用它们，如下所示：\n\
  \n```\nvirsh <option>\n```\n\n`virsh` 工具在 shell 模式下使用时，提供了一个交互式环境，可以在其中发布一系列命令。\n\
  \n要在 `virsh` shell 中运行命令，请执行以下命令：\n\n```\nvirsh\n\n欢迎使用 virsh，虚拟化交互式终端。\n\n输入 'help'\
  \ 获取命令帮助\n      'quit' 退出\n\nvirsh #\n```\n\n在 `virsh #` 提示符处，输入想要运行的选项。例如，以下 `virsh`\
  \ 会话列出了当前的虚拟机，启动了名为 `FedoraVM` 的虚拟机，然后获取另一个列表以验证虚拟机正在运行：\n\n```\nvirsh\n\n欢迎使用 virsh，虚拟化交互式终端。\n\
  \n输入 'help' 获取命令帮助\n      'quit' 退出\n\nvirsh # list\n\n Id Name State\n----------------------------------------------------\n\
  \ 8 RHEL9VM running\n 9 CentOS9VM running\n\nvirsh # start FedoraVM\n\nDomain FedoraVM\
  \ started\n\nvirsh # list\n\n Id Name State\n----------------------------------------------------\n\
  \ 8 RHEL9VM running\n 9 CentOS9VM running\n10 FedoraVM running\n\nvirsh#\n```\n\n\
  `virsh` 工具支持广泛的命令，可以使用帮助选项获取其完整列表：\n\n```\nvirsh help\n```\n\n通过在帮助指令后指定命令，可以获取有关每个命令语法的更多细节：\n\
  \n```\nvirsh help restore\n\n  NAME\n    restore - 从文件中保存的状态恢复域(domain)\n\n  SYNOPSIS\n\
  \    restore <file> [--bypass-cache] [--xml <string>] [--running] [--paused]\n\n\
  \  DESCRIPTION\n    恢复一个域。\n\n  OPTIONS\n    [--file] <string> 要恢复的状态\n    --bypass-cache\
  \ 恢复时避免使用文件系统缓存\n    --xml <string> 包含目标更新 XML 的文件名\n    --running 将域恢复到运行状态\n \
  \   --paused 将域恢复到挂起状态\n```\n\n在本章的剩余部分中，我们将更详细地查看其中一些命令。\n\n### 28.2 列出访机系统状态\n\
  \n可以使用 `virsh` 工具的 `list` 随时查看 Ubuntu 虚拟化主机上访机系统的状态。例如：\n\n```\nvirsh list\n```\n\
  \n上述命令将显示输出，其中包含每个访机的一行，类似于下面：\n\n```\nvirsh # list\n\n Id Name State\n----------------------------------------------------\n\
  \ 8 RHEL9VM running\n 9 CentOS9VM running\n10 FedoraVM running\n```\n\n### 28.3\
  \ 启动访机系统\n\n可以使用 `virsh` 工具结合 `start` 选项以及要启动的访机操作系统名称来启动访机操作系统。例如：\n\n```\nvirsh\
  \ start myGuestOS\n```\n\n### 28.4 关闭访机系统\n\n`virsh` 工具的 `shutdown` 选项顾其实名，用于关闭访机操作系统：\n\
  \n```\nvirsh shutdown guestName\n```\n\n注意，`shutdown` 选项允许访机操作系统在接收指令时执行有序关机。要立即停止访机操作系统，可以使用\
  \ `destroy` 选项（存在文件系统损坏和数据丢失的风险）：\n\n```\nvirsh destroy guestName\n```\n\n### 28.5\
  \ 挂起和恢复访机系统\n\n可以使用 `virsh` 工具的 `suspend` 和 `resume` 选项挂起和恢复访机系统。例如，挂起特定系统：\n\n\
  ```\nvirsh suspend guestName\n```\n\n同样，恢复挂起的系统：\n\n```\nvirsh resume guestName\n\
  ```\n\n如果宿主机系统重启，挂起的会话将丢失。此外，请注意挂起的系统仍然留在内存中。因此，为了保存会话使其不再占用内存并能够恢复到其精确状态（即使在重启后），有必要保存并恢复访机系统。\n\
  \n### 28.6 保存和恢复访机系统\n\n可以使用 `virsh` 工具保存和恢复运行中的访机操作系统。保存时，访机的当前状态会被写入磁盘并从内存中移除。\n\
  \n保存访机：\n\n```\nvirsh save guestName path_to_save_file\n```\n\n恢复保存的访机会话：\n\n```\n\
  virsh restore path_to_save_file\n```\n\n### 28.7 重启访机系统\n\n重启访机：\n\n```\nvirsh reboot\
  \ guestName\n```\n\n### 28.8 配置分配给访机的内存\n\n使用 `virsh` 命令的 `setmem` 选项来配置分配给访机系统的内存。例如，以下命令将内存减少到\
  \ 256MB：\n\n```\nvirsh setmem guestName 256\n```\n\n注意，允许的内存设置必须位于当前域(Domain)的范围内。可以使用\
  \ `setmaxmem` 选项进行增加。\n\n### 28.9 总结\n\n`virsh` 工具提供了创建、监控和管理虚拟机的各种选项。如本章所述，可以在命令行或交互模式下使用该工具。\n\
  \n\n\n要理解内核共享和容器的工作原理，首先了解 Linux 或 UNIX 操作系统的两个主要组件将有所帮助。操作系统的核心是 `kernel`（内核）。简单来说，`kernel`\
  \ 处理操作系统与物理硬件之间的所有交互。第二个关键组件是根文件系统（root file system），它包含了操作系统运行所需的所有库、文件和实用程序。利用这种结构，每个容器都有自己的根文件系统，但共享宿主机操作系统的\
  \ `kernel`。这种结构在下方的图 29-1 架构图中所示。\n\n这种资源共享的实现得益于 `kernel` 能够动态地将当前根文件系统（该概念称为更改根或\
  \ `chroot`）更改到不同的根文件系统，而无需重启整个系统。Linux 容器本质上是这种能力的扩展，并了容器运行时（container runtime），运行时的职责是为宿主机系统上执行和管理容器提供接口。目前有多种运行时可用，包括\
  \ `Docker`、`lxd`、`containerd` 和 `CRI-O`。\n\n![](img/linux_container_diagram.jpg)\n\
  \n图 29-1\n\n### 29.2 容器用途与优势\n\n容器的主要优势是它们所需的资源开销远少于虚拟化，允许在单个服务器上同时运行许多容器实例。它们可以根据需求水平快速高效地启动和停止。此外，容器在宿主机系统上原生运行，提供了虚拟机无法比拟的性能。\n\
  \n容器还具有高度的可移植性，可以在系统之间轻松迁移。结合如 `Docker`、`OpenShift` 和 `Kubernetes` 等容器管理系统，就可以在跨越多个服务器和云平台的大规模范围内部署和管理容器，可能运行数千个容器。\n\
  \n容器经常用于为应用程序创建轻量级执行环境。在这种场景下，每个容器都提供了一个隔离环境，其中包含应用程序以及该程序运行所需的所有运行时和支持文件。然后，可以将容器部署到任何其他支持容器执行的兼容宿主机系统，并在运行时无需担心目标系统可能缺少应用程序所需的运行时配置——应用程序的所有依赖项已经包含在容器中了。\n\
  \n容器在桥接开发与生产环境之间的差距时也很有帮助。通过在容器中进行开发和 QA（质量保证）工作，它们安全地传递到生产环境并启动，因为应用程序在与其开发和测试时相同的容器环境中运行。\n\
  \n容器还促进了部署大型复杂解决方案的模块化方法。与其将应用程序开发为单一的单体实体，不如使用容器将应用程序设计为一组交互模块，每个模块运行在单独的容器中。\n\
  \n容器的一个可能缺点是客户操作系统必须与共享的 `kernel` 版本兼容。例如，无法在 Linux 系统的容器中运行 Microsoft Windows。同样，为\
  \ `2.6` 版本 `kernel` 设计的 Linux 客户系统无法共享 `2.4` 版本的内核。然而，这些要求并不是容器的设计初衷。与其将这些限制视为局限性，它们它们应该被视为容器提供简单、可扩展且可靠的部署平台的一些关键优势。\n\
  \n### 29.3 Ubuntu 容器工具\n\nUbuntu 提供了几种用于创建、检查和管理容器的工具。主要工具如下：\n\n- `buildah` – 用于构建容器镜像的命令行工具。\n\
  - `podman` – 基于命令行的容器运行时和管理工具。执行诸如从远程仓库下载容器镜像，以及检查、启动和停止镜像等任务。\n- `skopeo` – 一种命令行实用程序，用于转换容器镜像、在仓库之间复制镜像，以及在不下载的情况下检查存储在仓库中的镜像。\n\
  - `runc` – 一种轻量级容器运行时，用于从命令行启动和运行容器。\n- `OpenShift` – 企业级容器应用程序管理平台，由命令行和基于 Web\
  \ 的界面工具组成。\n\n上述所有工具都符合开放容器倡议 (`OCI`)，这是一组旨在确保容器在竞争性工具和平台之间遵循相同标准的规范。\n\n### 29.4\
  \ Ubuntu Docker 仓库\n\n尽管 Ubuntu 提供了一套设计用于替代 `Docker` 提供工具的工具，但这些工具在构建容器时仍需要访问 Ubuntu\
  \ 镜像以便使用。出于这一目的，Ubuntu 团队在 `Docker Hub` 中维护了一套 Ubuntu 容器镜像。`Docker Hub` 是一个由多个仓库组成的在线容器仓库，每个仓库都包含多种在构建容器时可供下载的容器镜像。仓库中的每个镜像都被分配了一个仓库标签（例如\
  \ `21.04`、`20.10`、`22.04`、`latest` 等），在执行镜像下载时可以引用这些标签。以下是包含在 `Docker Hub` 中的 Ubuntu\
  \ 22.04 镜像的 URL 示例：\n\n`docker://docker.io/library/ubuntu:22.04`\n\n除了从 `Docker`\
  \ 和第三方托管仓库下载容器镜像（在容器术语中称为“pull”），你还可以使用仓库来存储你自己的镜像。这可以通过托管自己的仓库，或利用现有的服务来实现，如 `Docker`、`Amazon\
  \ AWS`、`Google Cloud`、`Microsoft Azure` 和 `IBM Cloud` 等众多选项。\n\n### 29.5 容器网络\n\n\
  默认情况下，容器使用容器网络接口 (`CNI`) 桥接网络栈到网络。在桥接配置中，运行在服务器上的所有容器都属于同一个子网，因此可以相互通信。容器还通过桥接宿主机系统的连接连接到外部网络。同样，宿主机可以通过网络接口（通常命名为\
  \ `podman0`）访问容器，该接口是作为工具的一部分创建的。\n\n### 29.6 总结\n\nLinux 容器提供了虚拟化的轻量级替代，并利用了 Linux\
  \ 和 Unix 操作系统的结构。Linux 容器共享宿主机操作系统的 `kernel`，每个容器都有自己的根文件系统。因此，容器具有极高的效率和可扩展性，为构建和部署模块化企业级解决方案提供了理想平台。\n\
  \n## 30. 在 Ubuntu 上使用容器\n\n在上一章涵盖了 Linux 容器的基础知识之后，本章将演示如何使用 `Podman`、`Skopeo` 和\
  \ `Buildah` 工具在 Ubuntu 上创建和管理容器。其目的是在本章结束时，你将更清楚地理解如何在 Ubuntu 上创建和管理容器，并为继续探索 Linux\
  \ 容器的力量奠定知识基础。\n\n### 30.1 安装容器工具\n\n开始使用容器之前，第一步是使用以下命令安装上一章列出的所有容器工具：\n\n```\n\
  # apt install curl\n\n# . /etc/os-release\n```\n\n\n\n\n```bash\nsh -c \"echo 'deb\
  \ https://download.opensuse.org/repositories/devel:/kubic:/libcontainers:/stable/xUbuntu_${VERSION_ID}/\
  \ /' > /etc/apt/sources.list.d/devel:kubic:libcontainers:stable.list\"\n```\n\n\
  ```bash\ncurl -L https://download.opensuse.org/repositories/devel:/kubic:/libcontainers:/stable/xUbuntu_${VERSION_ID}/Release.key\
  \ | sudo apt-key add -\n```\n\n```bash\napt update\n```\n\n```bash\napt install\
  \ podman skopeo buildah\n```\n\n### 30.2 拉取容器镜像\n\n在本例中，将从注册表中拉取最新的 Ubuntu 版本。然而，在拉取镜像之前，可以使用\
  \ `skopeo` 工具获取有关镜像存储库的信息，例如：\n\n```bash\nskopeo inspect docker://docker.io/ubuntu\n\
  ```\n\n```json\n{\n    \"Name\": \"docker.io/library/ubuntu\",\n    \"Digest\":\
  \ \"sha256:bec5a2727be7fff3d308193cfde3491f8fba1a2ba392b7546b43a051853a341d\",\n\
  \    \"RepoTags\": [\n        \"10.04\",\n        \"12.04.5\",\n        \"12.04\"\
  ,\n        \"12.10\",\n        \"13.04\",\n        \"13.10\",\n        \"14.04.1\"\
  ,\n        \"14.04.2\",\n        \"14.04.3\",\n        \"14.04.4\",\n        \"\
  14.04.5\",\n        \"14.04\",\n        \"14.10\",\n        \"15.04\"\n    ],\n\
  \    \"Created\": \"2023-06-28T08:42:50.42500211Z\",\n    \"DockerVersion\": \"\
  20.10.21\",\n    \"Labels\": {\n        \"org.opencontainers.image.ref.name\": \"\
  ubuntu\",\n        \"org.opencontainers.image.version\": \"22.04\"\n    },\n   \
  \ \"Architecture\": \"arm64\",\n    \"Os\": \"linux\",\n    \"Layers\": [\n    \
  \    \"sha256:5af00eab97847634d0b3b8a5933f52ca8378f5f30a2949279d682de1e210d78b\"\
  \n    ],\n    \"Env\": [\n        \"PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin\"\
  \n    ]\n}\n```\n\n例如，拉取最新的 Ubuntu 镜像：\n\n```bash\npodman pull docker://docker.io/ubuntu:latest\n\
  ```\n\n```text\nTrying to pull docker.io/library/ubuntu:latest...\nGetting image\
  \ source signatures\nCopying blob 5af00eab9784 done\nCopying config 37f7489146 done\n\
  Writing manifest to image destination\nStoring signatures\n37f74891464b2067aacbde60d9e2888e002af047a0d5dfc0b06b701928e0b473\n\
  ```\n\n通过让 `podman` 列出所有本地镜像来验证镜像已存储：\n\n```bash\npodman images\n```\n\n```text\n\
  REPOSITORY TAG IMAGE ID CREATED SIZE\ndocker.io/library/ubuntu latest 4e5021d210f6\
  \ 3 weeks ago 66.6 MB\n```\n\n通过运行 `podman inspect` 命令可以获取有关本地镜像的详细信息：\n\n```bash\n\
  podman inspect ubuntu\n```\n\n### 30.3 运行容器\n\n通过运行 `podman inspect` 命令可以获取有关本地镜像的详细信息：\n\
  \n```bash\npodman inspect ubuntu\n```\n\n（注：原文存在大量重复内容，此处翻译核心指令部分）\n\n\n\n\n\n一旦容器客主机系统按照你的要求配置完成，你很可能想要创建并运行多个这种特定类型的容器。为了实现这一点，需要将容器保存为镜像到本地存储中，这样它就可以被作为额外容器实例的基础。这通过使用\
  \ `podman commit` 命令结合容器的名称或 ID 以及存储镜像的名称来实现，例如：\n\n```bash\npodman commit mycontainer\
  \ myubuntu_image\n```\n\n一旦镜像已保存，检查它现在是否出现在本地存储库的镜像列表中：\n\n```bash\npodman images\n\
  ```\nREPOSITORY TAG IMAGE ID CREATED SIZE\nlocalhost/myubuntu_image latest 8ad685d49482\
  \ 47 seconds ago 66.6 MB\ndocker.io/library/ubuntu latest 4e5021d210f6 3 weeks ago\
  \ 66.6 MB\n\n```\n\n现在可以使用保存的镜像来创建与原始镜像相同的容器：\n\n```bash\npodman run --name=mycontainer2\
  \ -it localhost/myubuntu_image /bin/bash\n```\n\n### 30. 从本地存储中删除镜像\n\n当镜像不再需要时，只需运行\
  \ `podman rmi` 命令，引用 `podman images` 命令输出的镜像名称或 ID。例如，要删除上一节创建的名为 `myubuntu_image`\
  \ 的镜像，请如下所示运行 podman：\n\n```bash\npodman rmi localhost/myubuntu_image\n```\n\n注意，在删除镜像之前，必须先删除基于该镜像的所有容器。\n\
  \n### 30.7 删除容器\n\n即使容器已经退出或停止，它仍然存在并可以随时重启。如果容器不再需要，在容器停止后，可以使用 `podman rm` 命令对其进行删除：\n\
  \n```bash\npodman rm mycontainer2\n```\n\n### 30.8 使用 Buildah 构建容器\n\nBuildah 允许从现有容器、镜像或完全从零开始构建新容器。Buildah\
  \ 还包括挂载容器文件系统的功能，以便从宿主机上对其进行访问和修改。\n\n例如，以下 buildah 命令将从 Ubuntu 基础镜像构建容器（如果镜像尚未从注册表中拉取，buildah\
  \ 将在创建容器之前下载它）：\n\n```bash\nbuildah from docker://docker.io/library/ubuntu:latest\n\
  ```\n\n运行此命令的结果将得到一个名为 `ubuntu-working-container` 的就绪运行容器：\n\n```bash\nbuildah run\
  \ ubuntu-working-container cat /etc/passwd\n```\n\n### 30.9 总结\n\n本章介绍了使用 `podman`、`skopeo`\
  \ 和 `buildah` 工具在 Ubuntu 上创建和管理 Linux 容器的方法。\n\n## 31. 设置 Ubuntu 22.04 Web 服务器\n\
  \nApache Web 服务器是组成 Ubuntu 操作系统的许多软件包之一。Ubuntu 的扩展性和韧性使其成为托管即使是流量网站的理想平台。\n\n本章将解释如何使用\
  \ Apache 配置 Ubuntu 系统以作为 Web 服务器，包括安全的 (HTTPS) 配置和不安全的 (HTTP) 配置。\n\n### 31.1 配置\
  \ Ubuntu Web 服务器的要求\n\n要建立你自己的网站，你需要一台计算机（或云服务器实例）、一个操作系统、一个 Web 服务器、一个域名、一个名称服务器和一个\
  \ IP 地址。\n\n如前所述，Ubuntu 支持 Apache Web 服务器，一旦操作系统运行，就可以轻松安装。此外，可以在任何域名注册服务处注册域名。\n\
  \n如果你在云实例上运行 Ubuntu，提供商分配的 IP 地址将列在服务器概览信息中。但是，如果你在托管自己的服务器，并且你的互联网服务供应商 (ISP) 分配了静态\
  \ IP 地址，你必须将你的域名与该地址关联。这通过使用名称服务器来实现，所有的域名注册服务都会提供此服务。\n\n如果你没有静态 IP 地址（即你的 ISP\
  \ 为你提供频繁变化的动态地址），你可以可以使用几种免费的动态 DNS（简称 `DDNS` 或 `DynDNS`）服务之一将你的动态 IP 地址映射到你的域名。\n\
  \n一旦你配置了域名和名称服务器，下一步是安装并配置你的 Web 服务器。\n\n### 31.2 安装 Apache Web 服务器软件包\n\nUbuntu\
  \ 的当前版本通常不会默认安装 Apache Web 服务器。要检查服务器是否已安装，运行以下命令：\n\n```bash\napt -qq list apache2\n\
  ```\n\n如果 `apt` 生成了类似下面的输出，则说明 apache 服务器已安装：\napache2/jammy-updates,now 2.4.52-1ubuntu4.5\
  \ amd64 [installed]\n\n如果 `apt` 输出未列出包或未包含 `[installed]` 状态，请在命令行提示符处运行以下命令执行 Apache\
  \ 安装：\n\n```bash\napt install apache2\n```\n\n### 31.3 配置防火墙\n\n在启动和测试 Apache Web\
  \ 服务器之前，需要修改防火墙以允许 Web 服务器与外部世界通信。默认情况下，HTTP 和 HTTPS 协议分别使用 80 和 443 端口，因此取决于所使用的协议，需要打开其中一个或两个端口。如果你的\
  \ Ubuntu 系统正受 Uncomplicated Firewall (UFW) 保护，可以使用以下命令仅启用不安全的 Web 流量 (HTTP)：\n\n\
  ```bash\nufw allow Apache\n```\n\n仅启用安全的 (HTTPS) 流量：\n\n```bash\nufw allow 'Apache\
  \ Secure'\n```\n\n或者，如下启用安全和不安全的 Web 流量：\n\n```bash\nufw allow 'Apache Full'\n```\n\
  \n在使用 `firewalld` 时可以使用以下命令开启 HTTP 和 HTTPS 端口：\n\n```bash\nfirewall-cmd --permanent\
  \ --zone=<zone> --add-port=80/tcp\nfirewall-cmd --permanent --zone=<zone> --add-port=443/tcp\n\
  firewall-cmd --reload\n```\n\n对于云服务器，可能还需要在控制台中启用相应的端口。请查看提供商的文档。\n\n### 31.4 端口转发\n\
  \n假设托管 Web 服务器的 Ubuntu 系统位于受防火墙保护的网络中（另一个运行防火墙的计算机、路由器或无线基站）。在这种情况下，你必须配置防火墙将端口\
  \ 80 和 443 转发到你的 Web 服务器。执行此操作的机制取决于防火墙，请查看你的文档了解如何配置端口转发。\n\n### 31.5 启动 Apache\
  \ Web 服务器\n\n安装 Apache 并配置防火墙后，下一步是验证服务器正在运行并在必要启动它。\n\n要从命令行检查 Apache 服务状态，请在提示符输入：\n\
  \n```bash\nsystemctl status apache2\n```\n\n如果上述命令指示 `apache2` 服务未运行，可以如下从命令行启动：\n\
  \n```bash\nsystemctl start apache2\n```\n\n如果你希望 Apache 服务在系统启动时自动启动，请运行以下命令：\n\n\
  ```bash\nsystemctl enable apache2\n```\n\n### 31.6 测试 Web 服务器\n\n安装完成后，下一步是验证 Web\
  \ 服务器正在运行。\n\n如果你可以本地或远程访问服务器的桌面环境，启动 浏览器并在地址栏输入 `http://127.0.0.1`（`127.0.0.1`\
  \ 是回环网络地址，告诉系统连接到本地机器）。如果一切设置正确，浏览器应该加载如 图 31-1 所示的测试页面：\n\n![](img/ubuntu_apache_test_page.jpg)\n\
  \n图 31-1\n\n\n\n\nIf the desktop environment is unavailable, connect either from\
  \ another system on the same local network as the server, or use the external IP\
  \ address assigned to the system if it is hosted remotely.\n\n\n\n按照 Let’s Encrypt\
  \ 网站上的步骤在您的 Ubuntu 系统上下载并安装 Certbot，然后按照如下方式运行 `certbot` 工具来生成并安装证书：\n\n```bash\n\
  certbot --apache\n```\n\n在请求电子邮件地址并寻求接受服务条款后，`Certbot` 将列出在 `httpd.conf` 文件中找到的域名，并允许选择一个或多个要安装证书的站点。`Certbot`\
  \ 随后将在获取并将证书安装到系统上之前执行一些检查：\n\n您想为哪些名称激活 HTTPS？\n\n- - - - - - - - - - - - - - -\
  \ - - - - - - - - - - - - - - - - - - - - - - - - - -\n\n1: www.myexample.com\n\n\
  - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - -\
  \ -\n\n用逗号和/或空格分隔相应的数字，或者留空输入以选择显示的所有选项（按 ‘c’ 取消）：1\n\n正在获取新证书\n\n正在执行以下挑战：\n\n\
  针对 www.myexample.com 的 http-01 挑战\n\n等待验证...\n\n正在清理挑战\n\n已 `/etc/httpd/conf/httpd-le-ssl.conf`\
  \ 创建了 SSL vhost\n\n正在将证书部署到虚拟主机 `/etc/httpd/conf/httpd-le-ssl.conf`\n\n通过向根配置中添加\
  \ Include 来启用站点 `/etc/httpd/conf/httpd-le-ssl.conf`\n\n`Certbot` 还会在 `/etc/apache2/sites-available`\
  \ 目录下创建一个名为 `myexample-le-ssl.conf` 的新文件，其中包含每个已生成证书的域名的安全虚拟主机项目，并启用了站点，因此在 `/etc/apache2/sites-enabled`\
  \ 目录下创建了该文件的链接。这些项目将类似于：\n\n```apache\n<IfModule mod_ssl.c>\n<VirtualHost *:443>\n\
  \    ServerAdmin feedback@myexample.com\n    ServerName www.myexample.com\n    DocumentRoot\
  \ /var/www/myexample\n    ErrorLog logs/myexample_error_log\n    CustomLog logs/myexample_access_log\
  \ combined\n    SSLCertificateFile /etc/letsencrypt/live/www.myexample.com/fullchain.pem\n\
  \    SSLCertificateKeyFile /etc/letsencrypt/live/www.myexample.com/privkey.pem\n\
  \    Include /etc/letsencrypt/options-ssl-apache.conf\n</VirtualHost>\n</IfModule>\n\
  ```\n\n最后，`Certbot` 将询问是否应该将未来的 HTTP Web 请求重定向到 HTTPS。换说，如果用户尝试访问 `http://www.myexample.com`，Web\
  \ 服务器会将用户重定向到 `https://www.myexample.com`：\n\n请选择是否将 HTTP 流量重定向到 HTTPS 以移除 HTTP\
  \ 访问。\n\n- - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - -\
  \ - - - -\n\n1: 不重定向 - 不对服务器配置进行任何进一步更改。\n\n2: 重定向 - 将所有请求重定向到安全的 HTTPS 访问。对于新站点或如果您确定您的站点在\
  \ HTTPS 上运行正常，请选择此项。您可以通过编辑 Web 服务器配置来撤销此更改。\n\n- - - - - - - - - - - - - - - -\
  \ - - - - - - - - - - - - - - - - - - - - - - -\n\n选择相应的数字 [1-2] 然后按 [enter]（按 ‘c’\
  \ 取消）：2\n\n如果您正在测试 HTTPS 配置并希望保留 HTTP 版本直到稍后使用，请选择“不重定向”选项。否则，通常建议重定向到 HTTPS。\n\n\
  证书安装后，请在浏览器中使用以下 URL 进行测试（将 `myexample.com` 替换为您自己的域名）：\n\n`https://www.ssllabs.com/ssltest/analyze.html?d=www.myexample.com`\n\
