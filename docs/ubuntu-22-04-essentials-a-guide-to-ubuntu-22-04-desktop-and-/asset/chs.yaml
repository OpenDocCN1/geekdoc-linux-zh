  *(此处省略了原文中重复出现的段落，仅保留核心逻辑和去重后的唯一翻译内容)*\n\n\n\n要暂停刷新，必须使用 RFC 3339 格式指定恢复刷新的日期和时间，详情可以在以下\
  \ URL 找到：\n\n[`tools.ietf.org/html/rfc3339`](https://tools.ietf.org/html/rfc3339)\n\
  \n总而言之，日期和时间应使用以下格式：\n\nYYYY-MM-DDTHH:MM.SS<UTC offset>\n\n例如，为了为位于纽约的系统指定到 2020\
  \ 年 10 月 12 日凌晨 3:20 之前的暂停状态，日期和时间的格式化如下：\n\n2020-10-12T03:20:50.0-05:00\n\n注意，由于纽约使用的是东部标准时间\
  \ (EST)，它比协调世界时（`UTC-5:00`）有 -5 小时的偏移。格式化日期和时间后，可以使用以下命令设置暂停：\n\n```\n# snap set\
  \ system refresh.hold=\"2020-10-12T03:20:50.0-05:00\"\n```\n\n要检查当前的暂停设置，使用带有 `system\
  \ get` 选项的 `snap`：\n\n```\n# snap get system refresh.hold\n```\n\n2020-10-12T03:20:50.0-04:00\n\
  \n要移除暂停，只需为该属性分配空值（null）：\n\n```\n# snap set system refresh.hold=null\n```\n\n`refresh.retain`\
  \ 属性可以设置为 0 到 20 之间的任何值，例如：\n\n```\n# snap set system refresh.retain=10\n```\n\n\
  最后，为了在系统处于按费流量连接时暂停刷新更新，请按照如下所示将 `refresh.metered` 属性设置为 `hold`：\n\n```\n# snap\
  \ set system refresh.metered=hold\n```\n\n与 `hold` 属性一样，通过为该属性分配空值来禁用此设置：\n\n```\n\
  # snap set system refresh.metered=null\n```\n\n## 12.5 Snap 服务\n\n值得注意的是，某些 snap\
  \ 包包含了自己的服务，这些服务在安装包时会在后台运行（类似于“管理 Ubuntu 系统 systemd ”章节中描述的 systemd 服务）。要获取系统上正在运行的\
  \ snap 服务列表，执行带有 `services` 选项的 `snap` 命令：\n\n```\n# snap services\n```\n\n服务启动\
  \ 当前备注\n\ncanonical-livepatch.canonical-livepatchd 已启用 激活 -\n\n上述输出表示 LivePatch\
  \ snap 服务目前已启用并激活。要停止或停止一个服务，可以使用以下 `snap` 命令：\n\n```\n# snap start canonical-livepatch.canonical-livepatch\n\
  # snap stop canonical-livepatch.canonical-livepatch\n```\n\n同样，`snap enable` 和 `snap\
  \ disable` 选项可用于控制服务是否在系统启动时自动启动：\n\n```\n# snap enable canonical-livepatch.canonical-livepatch\n\
  # snap disable canonical-livepatch.canonical-livepatch\n```\n\n如果 snap 服务生成了日志文件，可以通过以下方式查看该文件：\n\
  \n```\n# snap logs canonical-livepatch\n```\n\n2020-05-06T13:21:58Z canonical-livepatch[763]:\
  \ No payload available.\n\n2020-05-06T13:21:58Z canonical-livepatch[763]: during\
  \ refresh: cannot check: No machine-token. Please run ‘canonical-livepatch enable’!\n\
  \n.\n\n.\n\n仍然可以使用 `systemctl` 命令管理 snap 服务。这通常涉及在服务名称前加上 “snap. `。例如：\n\n```\n\
  # systemctl status snap.canonical-livepatch.canonical-livepatchd\n```\n\n### 12.6\
  \ 总结\n\n直到最近，所有的 Ubuntu 软件包都存储在 .deb 文件中，并使用高级软件包工具 (APT) 进行安装。现在，有越来越多的软件包可以使用\
  \ Snap（由 Canonical, Ltd. 开发的包管理系统）进行安装。与 `apt` 包不同，snap 将一个程序包的所有依赖项封装在单个 `.snap`\
  \ 文件中。这确保了软件包是自包含的，带有运行所需的所有库和资源的副本。这避免了依赖于不同版本的相同共享资源和库的包之间可能发生冲突。Snap 系统还允许并行安装相同包的不同版本。Ubuntu\
  \ Software 工具中列出的所有软件都是以 snap 包的形式提供的。此外，可以使用命令行来安装、删除和管理包。\n\n## 13. Ubuntu 22.04\
  \ 网络管理\n\n很难想象一个至少没有网络连接的 Ubuntu 系统，更难以想象这样一个孤立的系统能有多大的实际用处。事实是，Ubuntu 的设计目的是通过网络和互联网连接提供企业级服务。因此，学习如何管理\
  \ Ubuntu 系统的关键部分涉及学习如何配置和管理安装在系统上的网络接口。\n\n本章提供了 Ubuntu 网络管理的概述，包括 `NetworkManager`\
  \ 服务、工具以及其他一些实用程序。\n\n### 13.1 NetworkManager 简介\n\n`NetworkManager` 是一项专门设计用于简化\
  \ Linux 系统网络配置的服务和工具集，它是 Ubuntu 默认的网络管理服务。\n\n除了一个在后台运行的服务外，`NetworkManager` 还包含以下工具：\n\
  \n- `nmcli` - 一个通过命令行与 `NetworkManager` 工作的工具。当无法访问图形环境时，此工具非常有用，也可以在脚本中使用进行网络配置更改。\n\
  - `nmtui` - 一个用于管理 `NetworkManager` 的基本文本用户界面。此工具可以在任何终端窗口中运行，允许通过选择菜单和输入数据来做出更改。虽然对执行基本任务有所帮助，但\
  \ `nmtui` 缺乏 `nmcli` 工具提供的许多功能。\n- `nm-connection-editor` - 一个完整的图形化管理工具，提供了访问大多数\
  \ `NetworkManager` 配置选项的。\n- `GNOME Settings` - GNOME 桌面设置应用程序的网络屏幕允许执行基本的网络管理任务。\n\
  - `Cockpit Network Settings` - Cockpit Web 界面的网络屏幕允许执行一系列网络管理任务。\n\n虽然有多种方法管理 Ubuntu\
  \ 系统的网络环境，但本章将重点介绍 `nmcli` 命令。虽然当你有访问桌面环境或启用 Cockpit 时，图形化工具非常有帮助，但在只有命令行提示符可用的情况下，理解命令行界面至关重要。此外，图形化工具（包括\
  \ Cockpit）只包含了 `nmcli` 工具的部分功能。如果你一直只用过 `nm-connection-editor`，那么使用 `nmcli` 就会困难一些。\n\
  \n### 13.2 安装和启用 NetworkManager\n\n`NetworkManager` 在大多数 Ubuntu 安装中默认已安装。使用 `apt`\
  \ 命令查看是否需要安装：\n\n```\n# apt -qq list network-manager\n```\nnetwork-manager/jammy,now\
  \ 1.36.6-0ubuntu2 amd64 [installed]\n\n如有必要，按如下方式安装软件包：\n\n```\n# apt install network-manager\n\
  ```\n\n软件包安装后，需要启用 `NetworkManager` 守护进程以便系统每次启动时运行：\n\n```\n# systemctl enable\
  \ NetworkManager\n```\n\n最后，启动服务并检查状态以验证启动成功：\n\n```\n# systemctl start NetworkManager\n\
  # systemctl status NetworkManager\n```\n\n```\n● NetworkManager.service - Network\
  \ Manager\n   Loaded: loaded (/lib/systemd/system/NetworkManager.service; enabled;\
  \ vendor preset: enabled)\n   Active: active (running) since Sun 2023-07-16 12:46:48\
  \ EDT; 24h ago\n   Docs: man:NetworkManager(8)\n  Main PID: 725 (NetworkManager)\n\
  \      Tasks: 3 (limit: 4352)\n      Memory: 11.9M\n      CPU: 5.018s\n  CGroup:\
  \ /system.slice/NetworkManager.service\n          └─725 /usr/sbin/NetworkManager\
  \ --no-daemon\n```\n\n\n\n在上述语法中，`Object` 将是 `general`、`networking`、`radio`、`connection`、`monitor`、`device`\
  \ 或 `agent` 之一，可以缩写为单词的几个字母（例如 `con`，甚至可以是字母 `c` 代表 `connection`）。例如，以下所有命令将输出与设备对象相关的帮助信息：\n\
  \n```bash\nnmcli device help\nnmcli dev help\nnmcli d help\n```\n\n要检查系统中 `NetworkManager`\
  \ 的整体状态，请使用以下命令：\n\n```bash\nnmcli general status\n\nSTATE CONNECTIVITY WIFI-HW\
  \ WIFI WWAN-HW WWAN\nconnected full enabled enabled enabled enabled enabled\n```\n\
  \n要检查系统中安装的设备状态，可以使用以下命令：\n\n```bash\nnmcli dev status\n```\n\n```\nDEVICE TYPE\
  \ STATE CONNECTION\neno1 ethernet connected eno1\nwlp0s26u1u2 wifi connected zoneone\n\
  virbr0 bridge connected virbr0\nlo loopback unmanaged --\nvirbr0-nic tun unmanaged\
  \ --\n```\n\n输出也可以通过 `-p`（pretty）选项进行修改，使其更符合人类阅读习惯：\n\n```bash\nnmcli -p dev status\n\
  \n=====================\n  Status of devices\n=====================\nDEVICE TYPE\
  \ STATE CONNECTION\n-------------------------------------------------------------------\n\
  eno1 ethernet connected eno1\nwlp0s26u1u2 wifi connected zoneone\nvirbr0 bridge\
  \ connected virbr0\nlo loopback unmanaged --\nvirbr0-nic tun unmanaged --\n```\n\
  \n相反，可以使用 `-t` 选项使输出更简洁，并适用于自动化处理：\n\n```bash\nnmcli -t dev status\neno1:ethernet:connected:eno1\n\
  wlp0s26u1u2:wifi:connected:emilyzone\nvirbr0:bridge:connected:virbr0\nlo:loopback:unmanaged:\n\
  virbr0-nic:tun:unmanaged:\n```\n\n状态输出显示系统安装了两个物理设备，一个是太网设备，另一个是 `WIFI` 设备。\n\n\
  桥（`virbr`）条目是用于为虚拟机提供网络服务的虚拟设备（虚拟化主题将从[“虚拟化技术概述”](#Virtualization_Overview.xhtml__idTextAnchor359）开始介绍）。最后，回环接口是一个特殊的虚拟设备，允许系统与自身通信，通常用于执行网络诊断。\n\
  \n在使用 `NetworkManager` 时，理解设备（device）和连接（connection）之间的区别至关重要。如上所述，设备是物理或虚拟网络设备，而连接是设备所连接的网络配置。\n\
  \n以下命令显示系统中配置的连接信息：\n\n```bash\nnmcli con show\n```\n\n```\nNAME UUID TYPE DEVICE\n\
  zoneone 2abecafa-4ea2-47f6-b20f-4fb0c0fd5e94 wifi wlp0s26u1u2\neno1 99d40009-6bb1-4182-baad-a103941c90ff\
  \ ethernet eno1\nvirbr0 e13e9552-1765-42d1-b739-ff981668fbee bridge virbr0\nzonetwo\
  \ f940a2d1-8c18-4a9e-bf29-817702429b8a wifi --\nzonethree fd65c5e5-3e92-4e9e-b924-1b0b07b70032\
  \ wifi --\n```\n\n上述输出显示 `WIFI` 设备（`wlp0s26u1u2`）连接到了名为 `zoneone` 的无线网络，而太网设备（`eno1`）连接到名为\
  \ `eno1` 的连接。除了 `zoneone` 之外，`NetworkManager` 还列出了两个名为 `zonetwo` 和 `zonethree` 的\
  \ `WIFI` 连接，这两个连接目前都没有设备连接。\n\n要查找分配给连接的 IP 地址，可以使用 `ip` 工具配合 `address` 选项：\n\n\
  ```bash\nip address\n```\n\n上述命令也可以缩写：\n\n```bash\nip a\n```\n\n```\n.\n.\n3: wlp0s26u1u2:\
  \ <BROADCAST,MULTICAST,UP,LOWER_UP> mtu 1500 qdisc mq state UP group default qlen\
  \ 1000\n    link/ether 74:da:38:ee:be:50 brd ff:ff:ff:ff:ff:ff\n    inet 192.168.1.121/24\
  \ brd 192.168.1.255 scope global dynamic noprefixroute wlp0s26u1u2\n        valid_lft\
  \ 57584sec preferred_lft 57584sec\n.\n.\n```\n\n`ip` 命令将输出系统中检测到的所有设备的信息。例如，上述输出显示\
  \ `WIFI` 设备已分配了 IP 地址 `192.168.1.121`。\n\n如果我们只想列出活跃的连接，可以使用带有 `-a` 选项的 `nmcli`\
  \ 命令：\n\n```bash\nnmcli con show -a\n```\n\n\n\n\n# eno2 以太网已有线连接 1\n\nNetworkManager\
  \ 自动检测到设备并激活了它，同时将其分配到名为“Wired connection 1”的连接。这是一个默认连接，我们对其没有配置控制，因为在 `/etc/NetworkManager/system-connections`\
  \ 中没有它的接口配置文件。因此，后续步骤是删除“Wired connection 1”连接，并使用 `nmcli` 创建新连接并将其分配给设备。删除连接的命令如下：\n\
  \n```bash\nnmcli con delete \"Wired connection 1\"\n```\n\n接下来，可以使用 `nmcli` 创建一个新的连接配置，该配置可以设定为静态\
  \ IP 地址或从 DHCP 服务器获取的动态 IP 地址。要创建一个名为 `dyn_ip` 的动态连接配置，将使用以下命令：\n\n```bash\nnmcli\
  \ connection add type ethernet con-name dyn_ip ifname eno2\n```\n\n连接 `dyn_ip` (160d9e10-bbc8-439a-9c47-a2ec52990472)\
  \ 已成功添加。\n\n若要创建一个不绑定到特定设备的连接配置，只需在命令中省略 `ifname` 选项即可：\n\n```bash\nnmcli connection\
  \ add type ethernet con-name dyn_ip\n```\n\n创建连接后，一个名为 `dyn_ip.nmconnection` 的文件将被添加到\
  \ `/etc/NetworkManager/system-connections` 目录。\n\n或者，若要创建一个名为 `static_ip` 并分配了静态\
  \ IP 地址（在此例中为 192.168.1.200）的连接，将使用以下命令：\n\n```bash\nnmcli con add type ethernet\
  \ con-name static_ip ifname eno0 ip4 192.168.1.200/24 gw4 192.168.1.1\n```\n\n连接\
  \ `static_ip` (3fccafb3-e761-4271-b310-ad0f28ee8606) 已成功添加。\n\n对应的 `static_ip.nmconnection`\
  \ 文件内容如下：\n\n```ini\n[connection]\nid=static_ip\nuuid=41eca181-381c-4d12-b6c9-30446d4e29d1\n\
  type=ethernet\ninterface-name=eno0\n[ethernet]\n[ipv4]\naddress1=192.168.1.200/24,192.168.1.1\n\
  method=manual\n[ipv6]\naddr-gen-mode=default\nmethod=auto\n[proxy]\n```\n\n添加新连接的命令可以稍作修改，以便同时分配\
  \ IPv4 和 IPv6 静态地址：\n\n```bash\nnmcli con add type ethernet con-name static_ip ifname\
  \ eno0 ip4 192.168.1.200/24 gw4 192.168.1.1 gw4 192.168.1.1 ip6 cabf::4532 gw6 2010:dfa::1\n\
  ```\n\n## 13.5 交互式编辑\n\n除了带有命令行选项使用 `nmcli` 外，该工具还包含一种用于创建和修改连接配置的交互式模式。例如，下面的转录显示了如何使用交互模式创建一个名为\
  \ `demo_con` 的新以太网连接：\n\n```bash\nnmcli con edit\n```\n\n有效的连接类型：6lowpan, 802-11-olpc-mesh\
  \ (olpc-mesh), 802-11-wireless (wifi), 802-3-ethernet (ethernet), adsl, bluetooth,\
  \ bond, bridge, cdma, dummy, generic, gsm, infiniband, ip-tunnel, macsec, macvlan,\
  \ ovs-bridge, ovs-interface, ovs-port, pppoe, team, tun, vlan, vpn, vxlan, wimax,\
  \ wpan, bond-slave, bridge-slave, team-slave\n\n输入连接类型: ethernet\n\n```\n===| nmcli\
  \ interactive connection editor |===\n正在添加新的 '802-3-ethernet' 连接\n输入 'help' 或 '?'\
  \ 查看可用命令。\n输入 'print' 显示所有连接属性。\n输入 'describe [<setting>.<prop>]' 获取详细属性描述。\n你可以编辑以下设置：connection,\
  \ 802-3-ethernet (ethernet), 802-1x, dcb, sriov, ethtool, match, ipv4, ipv6, tc,\
  \ proxy\nnmcli> set connection.id demo_con\nnmcli> set connection.interface eno1\n\
  nmcli> set connection.autoconnect yes\nnmcli> set ipv4.method auto\nnmcli> set 802-3-ethernet.mtu\
  \ auto\nnmcli> set ipv6.method auto\nnmcli> save\n正在保存连接 'autoconnect=yes'。这可能会导致连接立即激活。\n\
  你仍然要保存吗？(yes/no) [yes] yes\n连接 'demo_con' (cb837408-6c6f-4572-9548-4932f88b9275)\
  \ 已成功保存。\nnmcli> quit\n```\n\n另一方面，下面的转录修改了之前创建的 `static_ip` 连接配置，以使用不同的设置：\n\n\
  ```bash\nnmcli con edit\n```\n\n```\n===|cli interactive connection editor |===\n\
  正在编辑现有的 '802-3-ethernet' 连接\n... (交互命令) ...\n```\n\n等等，原始文本显示：\n输入 'help' 或 '?'\
  \ 查看可用命令。\n输入 'print' 显示所有连接属性。\n输入 'describe [<setting>.<prop>]' 获取详细属性描述。\n你可以编辑以下设置：connection,\
  \ 802-3-ethernet (ethernet), 802-1x, dcb, sriov, ethtool, match, ipv4, ipv6, tc,\
  \ proxy\n\n```\n--------------------------------\n--- 主菜单 ---\ngoto [<setting> |\
  \ <prop>] 进入设置或属性\nremove <setting> | <prop> 删除设置或重置\nset [<setting>.<prop>] <value>\
  \ 设置属性值\ndescribe [<setting>.<prop>] 描述属性\nverify [all | <prop>] 验证连接\nsave [persistent|temporary]\
  \ 保存连接\nactivate [<ifname>] [/<ap>|<nsp>] 激活连接\nback 返回上一级\nhelp/? [<command>] 显示帮助\n\
  nmcli <conf-option> <value> nmcli 配置\nquit 退出 nmcli\n--------------------------------\n\
  ```\n\n在修改连接后，必须指示 NetworkManager 重新加载：\n\n```bash\nnmcli con reload\n```\n\n##\
  \ 13.6 配置 NetworkManager 权限\n\n除了简化 Ubuntu 的网络管理外，NetworkManager 还允许为连接指定权限。下面的命令将连接限制为\
  \ root 以及名为 john 和 caitlyn 的用户：\n\n```bash\nnmcli con mod static_ip connection.permissions\
  \ user:root,john,caitlyn\n```\n\n一旦 NetworkManager 重新加载了连接配置，只有当一个指定的用户登录活动会话时，连接才会激活并供其他用户使用。当最后一个用户注销时，连接将关闭，直到其中一个用户重新登录。\n\
  \n此外，只有具有权限的用户才能更改连接状态或配置。\n\n### 13.7 总结\n\nNetworkManager 服务处理 Ubuntu 网络网络。NetworkManager\
  \ 将网络视为由接口设备和连接组成。网络设备可以是物理以太网或 WiFi 设备，也可以是虚拟机使用的虚拟设备。连接代表设备连接的网络，并通过连接配置进行配置。\n\
  \n可以使用多种工具管理 NetworkManager，包括 `nmcli` 和 `nmtui` 命令行工具、`nm-connection-editor` 图形工具以及\
  \ Cockpit Web 界面中的网络设置部分。通常情况下，`nmcli` 命令行工具提供了最多的功能和灵活性。\n\n## 14. Ubuntu 22.04\
  \ 防火墙基础\n\n防火墙是保护单个计算机系统或计算机网络免受外部攻击（通常来自互联网连接）的关键组件。任何直接连接到互联网的计算机理想情况下都应该运行防火墙以防止恶意活动。同样，任何内部网络与外部互联网连接之间都必须有一个某种形式的防火墙。\n\
  \n\n\n\nUbuntu 内置了名为 `iptables` 的强大防火墙技术。关于配置 `iptables` 甚至可以编写整本书，而且事实上已经有这样的书籍。如果你想学习\
  \ `iptables`，我们推荐以下资源：\n\n[https://www.linuxtopia.org/Linux_Firewall_iptables/index.html]\n\
  \n本章将涵盖防火墙、TCP/IP 端口和服务的某些基本概念。Ubuntu 上的防火墙配置将在“使用 firewalld 进行 Ubuntu 22.04 防火墙配置”章节以及“使用\
  \ gufw 和 ufw 配置 Ubuntu 防火墙”章节中进行介绍。\n\n### 14.1 理解端口与服务\n\n目前使用的主要的网络通信协议是 TCP/IP。它是互联网使用的协议，因此它已经取代了大多数曾经用于局域网（LAN）的流行协议。\n\
  \nTCP/IP 定义了总共 65,535 个端口，其中 1023 个被认为是常用端口。必须理解的是，这些端口不是连接网缆的物理端口，而是每个网络连接上的虚拟端口，应用程序和服务可以通过这些端口在\
  \ TCP/IP 网络连接上进行通信。实际上，流行的网络客户端和服务所使用的端口仅是常用端口组中一个更更小的子集。\n\n操作系统可以提供多种不同的 TCP/IP\
  \ 服务。本章末尾表格提供了此类服务的完整列表。尽管如此，这些服务包含了运行安全 Web 服务器的 HTTPS、用于允许文件传输的 FTP、提供安全远程登录访问和文件传输的\
  \ SSH，以及用于传输电子邮件消息的 SMTP。每个服务随后都会分配到一个标准的 TCP/IP 端口。例如，HTTPS 被分配到 443 端口，而 SSH 通信发生在\
  \ 22 端口。\n\n## 14.2 端口与服务的安全防护\n\n服务器安全的很大一部分涉及定义角色，并根据角色定义应该启用哪些服务和端口。例如，仅作为 Web\
  \ 服务器运行的服务器应该只运行 HTTPS 服务（可能还有用于远程管理访问的 SSH）。所有其他服务都应该被禁用，并且理想情况下应从操作系统中完全删除（这将使入侵者更难重新启用该服务）。\n\
  \n系统安全涉及从操作系统中移除任何不需要的服务，并确保使用防火墙阻止与非本质服务相关的端口。定义哪些端口可以访问以及在什么情况下可以访问的规则是使用 `iptables`\
  \ 规定的。\n\n许多操作系统在安装时默认安装并激活了若干服务。在安装新操作系统之前，必须进行仔细规划。这种规划涉及决定哪些服务不需要，并识别哪些服务被默认安装并启用。部署新操作系统绝不能仓促。系统中可用的服务和开放端口越少，攻击者的攻击面和机会就越小。\n\
  \n## 14.3 Ubuntu 服务与 iptables 规则\n\n默认情况下，新安装的 Ubuntu 系统没有定义 `iptables` 规则来限制对端口的访问。可以在终端窗口中执行以下命令来查看当前的\
  \ `iptables` 设置：\n\n```bash\niptables -L\n\nChain INPUT (policy ACCEPT)\ntarget\
  \ prot opt source destination\n\nChain FORWARD (policy ACCEPT)\ntarget prot opt\
  \ source destination\n\nChain OUTPUT (policy ACCEPT)\ntarget prot opt source destination\n\
  ```\n\n如上述输出所示，目前没有定义任何规则。虽然这看起来是一个不安全的配置，但必须记住，新安装的 Ubuntu 系统默认运行的服务也很少，这使得端口对潜在攻击者来说是没用的。例如，访问新安装的\
  \ Ubuntu 系统上的 Web 服务器是不可能的，因为默认没有安装或运行 Web 服务器服务。一旦开始在系统中激活服务，通过定义 `iptables` 规则来建立防火墙策略将变得非常重要。\n\
  \n定义 `iptables` 规则有多种方法，包括使用命令行工具和配置文件。例如，要阻止来自 IP 地址 192.168.2.76 访问端口 25（SMTP\
  \ 邮件传输协议所使用的端口），可以在终端窗口中发布以下命令：\n\n```bash\niptables -A INPUT -s 192.168.2.76 -p\
  \ tcp --destination-port 25 -j DROP\n```\n\n如果我们现在检查当前规则，将看到当前列在列表中：\n\n```bash\n\
  iptables -L\n\nChain INPUT (policy ACCEPT)\ntarget prot opt source destination\n\
  DROP tcp -- 192.168.2.76 anywhere tcp dpt:smtp\n\nChain FORWARD (policy ACCEPT)\n\
  target prot opt source destination\n\nChain OUTPUT (policy ACCEPT)\ntarget prot\
  \ opt source destination\n```\n\n随后可以通过以下方式删除该规则：\n\n```bash\niptables -D INPUT\
  \ -s 192.168.2.76 -p tcp --destination-port 25 -j DROP\n```\n\n考虑到 `iptables` 的复杂性，并不意外已经创建了一些用户友好的配置工具来简化规则的创建过程。其中一个工具是\
  \ `firewall-cmd` 命令行工具，它将在“使用 firewalld 进行 Ubuntu 22.04 防火墙配置”章节中介绍。\n\n### 14.4\
  \ 常用端口与服务\n\n在继续介绍更复杂的防火墙规则之前，首先值得花时间概述 Ubuntu 系统可以提供的一些关键服务以及对应的端口号：\n\n| 端口 |\
  \ 分配 | 描述 |\n| :--- | :--- | :--- |\n| 20 | FTP | 文件传输协议（数据）- 文件传输协议提供了在连接网络的计算机系统之间传输特定文件的机制。传输通常使用\
  \ ftp 客户端执行。大多数现代浏览器也可以在远程 FTP 服务器上浏览和下载文件。FTP 使用 TCP 而非 UDP 传输文件，这被认为是一种可靠的传输机制。FTP\
  \ 不加密数据，不被认为是安全的传输协议。强烈建议使用安全拷贝协议 (SCP) 和安全文件传输协议 (SFTP) 替代 FTP。 |\n| 21 | FTP |\
  \ 文件传输（控制）- 传统上，FTP 分配了两个端口（端口 20 和 21）。端口 20 最初被认为是数据传输端口，而端口 21 被分配用于通信控制信息。然而，在现代实现中，端口\
  \ 20 很少被使用，所有通信都发生在端口 21 上。 |\n| 22 | SSH | Secure Shell - Secure Shell 在 TCP/IP\
  \ 网络上为主机提供安全、加密的远程登录会话。远程访问的原始机制是 Telnet 协议。但由于 Telnet 以明文传输数据，因此强烈建议使用安全 shell，它可以加密所有通信，包括登录和密码凭据。SSH\
  \ 还提供了通过安全拷贝协议 (SCP) 安全传输文件的机制，并也是安全文件传输协议 (SFTP) 的基础。SSH 还取代了 rsh 和 rlogin 客户端。\
  \ |\n| 23 | Telnet | Telnet 是一种终端模拟协议，可以通过 TCP/IP 连接登录远程系统。这种访问是基于的，允许用户在远程主机的命令提示符处输入，远程主机显示的文本将显示在本地\
  \ Telnet 客户端上。Telnet 不加密密码或客户端与服务器之间通信的文本。因此，强烈建议不要使用 telnet。大多数现代系统都会关闭端口 23 并禁用\
  \ telnet 服务以防止其使用。应该使用 SSH 替代 Telnet。 |\n\n\n\n\n\n| 25 | SMTP | 邮件传输协议 - `SMTP`\
  \ 定义了电子邮件从一个网络主机发送到另一个网络主机的机制。`SMTP` 是一种简单直接的协议，要求接收主机上的邮件服务始终可用。通常，接收主机会将入站消息存储在溢出队列（spool）中，供接收者以后使用\
  \ `POP3` 或 `IMAP` 协议进行后续访问。此外，`SMTP` 使用 `TCP` 传输协议来确保消息无错误交付。 |\n| 53 | DNS | 域名服务器\
  \ - `TCP/IP` 网络用于将主机名和完全限定域名（FQDN）翻译为 IP 地址的服务。 |\n| 69 | TFTP | 简单文件传输协议 - `TFTP`\
  \ 是文件传输协议（`FTP`）的精简版本。它具有减少的命令集且缺少身份验证。`TFTP` 最显著的特征是它使用 `UDP` 传输数据。这导致了高传输速度，但因此缺乏数据可靠性。`TFTP`\
  \ 通常用于无盘工作站的网络启动。 |\n| 80 | HTTP | 超文本传输协议 - `HTTP` 用于从 Web 服务器下载文本、图形和多媒体到 Web\
  \ 浏览器。它定义了浏览器和服务器之间的命令和控制机制，定义了客户端请求和服务器响应。`HTTP` 基于 `TCP` 传输协议，因此是一种面向连接的协议。 |\n\
  | 110 | POP3 | 邮局协议 - `POP3` 协议是一种从服务器存储和检索入站电子邮件消息的机制。在大多数企业环境中，入站邮件存储在邮件服务器上，并在用户检查邮件时，下载到运行在用户桌面设备或笔记本电脑上的邮件客户端上。然而，`POP3`\
  \ 将所有新消息下载到客户端，并不允许用户选择下载哪些消息、查看邮件头或仅下载消息的部分内容。由于由于原因，`IMAP` 协议正越来越多地被用于取代 `POP3`。|\
  \ |\n| 119 | NNTP | 网络新闻传输协议 - 负责在 Usenet 新闻服务器（即托管在远程服务器上的新闻组和讨论论坛）上发布和检索消息的协议。`NNTP`\
  \ 运行在 OSI 栈的应用层，并使用 `TCP` 确保消息的无错误检索和传输。 |\n| 123 | NTP | 网络时间协议 - 一种旨在使计算机时与外部时间源同步的协议。使用此协议，操作系统或应用程序可以从远程\
  \ `NTP` 服务器请求当前时间。远程 `NTP` 服务器通常基于核钟提供时间。`NTP` 有助于确保网络中的所有系统都设置了相同的、准确的当日时间。这在安全情况下尤为重要，例如，当客户端或服务器上某个文件被访问或修改的时间存在疑问时。\
  \ |\n| 143 | IMAP4 | 互联网消息访问协议第 4 版 - `IMAP4` 是一种先进且安全的电子邮件检索协议。`IMAP` 与 `POP3`\
  \ 类似，允许用户访问存储在邮件服务器上的电子邮件消息。然而，`IMAP` 包含了许多额外功能，例如选择性下载消息的能力、查看消息头、搜索消息以及下载消息的部分。此外，`IMAP4`\
  \ 使用身份验证并完全支持 Kerberos 身份验证。 |\n| 161 | SNMP | 简单网络管理协议 - 提供了一种机制，网络管理员可以通过该机制收集有关网络设备（如集线器、桥器、路由器和交换机）的信息。`SNMP`\
  \ 协议允许运行在网络设备上的代理向中央管理器报告其状态，反之，允许管理器向设备代理发送新的配置参数。代理可以进一步配置为在发生某些被称为“陷阱（traps）”的事件时通知管理器。`SNMP`\
  \ 使用 `UDP` 发送和接收数据。 |\n| 443 | HTTPS | 安全超文本传输协议 - 标准的 `HTTP`（非安全）协议以明文传输数据（即无加密，且任何可能拦截流量的人都能可见）。虽然这对于大多数\
  \ Web 浏览目的是可以接受的，但当信用卡详细信息等敏感信息需要从浏览器传输到 Web 服务器时，它会带来严重的安全风险。`HTTPS` 使用安全套层（`SSL`）在客户端和服务器之间发送加密数据来解决这个问题。\
  \ |\n| 2049 | NFS | 网络文件系统 - 最初由 Sun Microsystems 开发，随后在整个行业广泛采用，`NFS` 允许另一个系统通过网络访问远程系统上的文件系统，就像该文件位于本地磁盘驱动器上一样。`NFS`\
  \ 广泛应用于基于 `UNIX` 和 `LINUX` 的系统。后版本的 Microsoft Windows 也可以访问基于 `UNIX` 和 `LINUX` 系统上的\
  \ `NFS` 共享文件系统。 |\n\n表 14-1\n\n### 14.5 总结\n\n新安装的 `Ubuntu` 系统通常由于系统端口上没有运行的服务而被认为是安全的。然而，一旦系统开始配置使用，确保通过实施防火墙来保护它它是非常重要的。在配置防火墙时，理解各种端口和相应的服务非常重要。\n\
  \n有多种防火墙选项，最基本的是 `iptables` 防火墙接口的命令行配置。通过 `firewalld` 可以获得更直观、更高级的选项，我们将在下一章中介绍。\n\
  \n## 15. 使用 `gufw` 和 `ufw` 配置 Ubuntu 防火墙\n\n在上一章中，我们查看了 `Ubuntu` 系统上的端口和服务。我们还简要地查看了\
  \ `Ubuntu` 上的 `iptables` 防火墙规则，并从命令行创建了几个非常简单的规则。在本章中，我们将使用两个名为 `gufw` 和 `ufw` 的工具查看更用户友好的\
  \ `iptables` 方法。正如我们所看到的，`gufw` 和 `ufw` 对入站和出站网络流量提供了高级控制，而无需理解底层的 `iptables` 语法。\n\
  \n### 15.1 `gufw` 和 `ufw` 概述\n\n`Ubuntu` 自带名为 `ufw` 的包，它是 Uncomplicated Firewall（简单防火墙）的缩写。该包提供了用于管理和配置基于\
  \ Netfilter `iptables` 防火墙的命令行界面。`gufw` 工具为 `ufw` 提供了一个用户友好的图形界面，旨在无需命令行即可防火墙管理。\n\
  \n### 15.2 在 Ubuntu 上安装 `gufw`\n\n虽然 `ufw` 默认安装在 `Ubuntu` 上，但 `gufw` 包没有。因此，要安装\
  \ `gufw`，请打开终端窗口（`Ctrl+Alt+T`）并在提示符输入以下命令：\n\n```bash\napt install gufw\n```\n\n\
  ### 15.3 运行并启用 `gufw`\n\n安装后，在 GNOME 桌面按 `Alt+F2` 并在运行命令框中输入 `gufw` 来启动 `gufw`。在首次调用时，防火墙可能是禁用的，如图\
  \ 15-1 所示（#Ubuntu_ufw_Firewall.xhtml__idTextAnchor242）。\n\n要启用防火墙，将状态开关（A）移动到开启位置。默认情况下，主面板（D）将显示\
  \ `gufw` 的主页，包含有关该工具的一些基本信息。从按钮行（C）中选择选项将更改显示的信息。例如，选择“规则”按钮以添加、删除和查看规则。\n\n`gufw`\
  \ 工具提供了一组预配置配置文件，适用于工作、家庭和公共环境。要更改配置并查看设置，请从菜单（B）选择配置。要修改现有配置，从菜单中选择它并使用“入站”和“出站”菜单更改选择。要配置特定规则，显示规则屏幕并根据需要添加、删除和修改规则。这些应用于当前选的配置。\n\
  \n\n\n\n\n当前选择的配置文件决定了防火墙在没有任何特定策略规则的情况下如何处理流量。例如，默认情况下，`Home`配置文件配置为拒绝所有入站流量并允许所有出站流量。这些默认策略设置通过`Incoming:`（入站）和`Outgoing:`（出站）菜单（E）进行更改。\n\
  \n默认策略的异常通过创建额外的规则来定义。例如，由于`Home`配置文件拒绝入站流量，需要添加规则来启用某些允许的入站连接类型。此类规则在安全社区中被称为`whitelist`白名单。\n\
  \n相反，如果入站策略更改为`Allow all traffic`允许所有流量，则所有入站流量都将被允许，除非为必须阻止的特定类型连接创建了规则。意所当然，这些规则被称为`blacklist`黑名单。`黑名单/白名单`方法同样适用于入站和出站连接。\n\
  \n## 15.4 创建新配置文件\n\n虽然可以修改预定义的配置文件，但通常创建一个或多个配置文件来根据你的特定需求配置防火墙会更有意义。通过选择`Edit\
  \ -> Preferences...`菜单选项可以创建新配置文件，显示所示图 15-2：\n\n![](img/ubuntu_gufw_preferences.jpg)\n\
  \n图 15-2\n\n要添加新配置文件，点击位于配置文件列表下方的`+`按钮。列表中将出现一个名为`Profile 1`的新配置文件。要为配置文件命名更具描述性的名称，请双击条目进入编辑模式并输入新名称：\n\
  \n![](img/ubuntu_20.04_gufw_new_profile.jpg)\n\n图 15-3\n\n创建并并命名配置文件后，点击`Close`按钮返回主界面，从`Profile`菜单中选择它并打开`Status`开关：\n\
  \n![](img/ubuntu_gufw_enabled.jpg)\n\n图 15-4\n\n选中自定义配置文件后，即可准备好设置一些自定义规则，以覆盖默认的入站和出站设置。\n\
  \n### 15.5 添加预配置的防火墙规则\n\n通过点击`Rules`按钮，然后点击规则面板底部的`+`按钮来创建新规则，如图 15-5 所示：\n\n![](img/ubuntu_20.04_gufw_add_rule.jpg)\n\
  \n图 15-5\n\n选中后，将出现如图 15-6 所示的对话框，并选中`Preconfigured`选项卡。`Preconfigured`面板允许选择匹配特定应用程序和服务的规则。例如，可以通过从`Application`菜单中选择来自`Skype`和`BitTorrent`等工具的条目，并相应选择`Policy`（策略）和`Direction`（方向）菜单来限制或允许流量。\n\
  \n为了帮助找到特定的应用程序或服务，可以使用`Category`和`Subcategory`菜单来过滤`Application`菜单中出现的项目。或者，只需在`Application\
  \ Filter`字段中输入应用程序或服务的名称来过滤菜单项：\n\n![](img/ubuntu_20.04_gufw_rule_settings.jpg)\n\
  \n图 15-6\n\n`Policy`菜单为控制所选应用程序或服务的流量提供了以下选项：\n\n- `Allow`允许 – 允许在该端口上的流量。\n- `Deny`拒绝\
  \ – 不允许在该端口上的流量。请求系统不会收到拒绝通知。数据包直接被丢弃。\n- `Reject`拒绝 – 不允许在该端口上的流量。数据包被丢弃，并向请求系统发送拒绝通知。\n\
  - `Limit`限制 – 如果同一 IP 地址在 30 秒的时间范围内尝试建立 6 个或更多连接，则将拒绝这些连接。\n\n一旦定义了规则，点击`Add`按钮将实施该规则，关闭`Add\
  \ Rule`对话框，新规则将列在`gufw`工具的主界面上（包含针对`IPv4`和`IPv6`协议的规则）：\n\n![](img/ubuntu_20.04_gufw_rule_added.jpg)\n\
  \n图 15-7\n\n要删除规则，请在列表中选择它并点击对话框底部的`-`按钮。同样，通过选择现有规则并点击`-`按钮右侧的齿轮按钮来编辑现有规则。\n\n\
  ### 15.6 添加简单防火墙规则\n\n预配置规则允许根据已知的服务和应用程序配置防火墙，而`Add Rule`对话框的`Simple`简单选项卡允许通过引用相应的`TCP/IP`端口来简单地定义入站和出站规则。已知应用程序和服务使用的端口仅代表应用程序可用的端口的一小部分，可能需要为这些端口定义防火墙规则。例如，第三方应用程序可能会使用端口`5700`与远程服务器通信。在这种情况下，可能需要使用`Simple`面板允许此特定端口的流量：\n\
  \n![](img/ubuntu_20.04_gufw_simple_rule.jpg)\n\n图 15-8\n\n规则可以配置为过滤`TCP`、`UDP`或两种流量类型的流量。此外，端口可以指定为单个端口号或端口范围，起始和结束端口之间用冒号分隔（`1000:2000`）。\n\
