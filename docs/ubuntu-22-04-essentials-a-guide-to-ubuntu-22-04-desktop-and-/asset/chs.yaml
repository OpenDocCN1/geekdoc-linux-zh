  \ 系统可以通过安装 Apache Web 服务器来托管网站。在 Ubuntu 上可以部署不安全的 (HTTP) 和安全的 (HTTPS) 网站。安全网站使用安全套接层\
  \ (SSL) 或传输层安全 (TLS) 通过公共、私有和会话加密，结合由受信任证书颁发机构颁发的证书在 Web 服务器和客户端之间建立加密通信。\n\n##\
  \ 32. 配置 Ubuntu 22.04 Postfix 邮件服务器\n\n除了作为 Web 服务器，电子邮件也是 Ubuntu 系统的主要用途之一，特别是在业务环境中。考虑到电子邮件的重要性和流行性，某些人发现\
  \ Linux 系统上的邮件结构如此复杂会感到惊讶。这种复杂性往往会让 Ubuntu 初学者感到无从措手。\n\n好消息是，对于纠正，这种复杂性往往会让 Ubuntu\
  \ 初学者感到无从措手。 (此处由于系统异常导致文本重复，请忽略重复段落，直接进入核心翻译正文)\n\n本章将解释邮件系统的基础知识，以便用户配置基础邮件环境。复杂的邮件将留给更高级书籍。\n\
  \n### 32.1 邮件系统的结构\n\n完整的邮件系统由几个部分组成。以下是对每个部分的简要描述：\n\n### 32.1.1 邮件用户代理 (MUA)\n\
  \n用户通常最熟悉这部分。邮件用户代理 (MUA)，即邮件客户端，是用于编写、发送和阅读邮件的应用程序。任何在计算机上写过发送过邮件的人都使用某种 MUA。\n\
  \nLinux 上典型的 MUA 有 `Evolution`、`Thunderbird` 和 `KMail`。对于偏好文本客户端的用户，还有传统的 `Pine`。\n\
  \n### 32.1.2 邮件传输代理 (MTA)\n\n邮件传输代理 (MTA) 是邮件系统中负责将邮件从一台计算机传输到另一台计算机的部分（通过本地网络到远程系统）。一旦配置正确，大多数用户只有在需要重新配置时才会直接与\
  \ MTA 交互。Linux 有许多 MTA 选择，包括 `Sendmail`、`Postfix`、`Fetchmail`、`Qmail` 和 `Exim`。\n\
  \n### 32.1.3 邮件投递代理 (MDA)\n\n另一个对用户通常隐藏的部分是邮件投递代理 (MDA)，它在后台运行并在 MTA 和邮件客户端 (MUA)\
  \ 之间执行过滤。MDA 最常见的形式是垃圾过滤器，从用户的收件箱中删除所有垃圾邮件。流行的 MDA 有 `Spamassin` 和 `Procmail`。要注意，某些邮件用户代理应用程序（如\
  \ `Evolution`、`Thunderbird` 和 `KMail`）自带了 MDA 过滤功能，其他程序（如 `Pine`）则没有。这会让 Linux 初学者感到困惑。\n\
  \n### 32.1.4 SMTP\n\n`SMTP` 是简单邮件传输协议的缩写。邮件系统使用该协议将邮件从一个服务器传输到另一个。该协议是 MTA 之间进行通信并往返传输消息的语言。\n\
  \n#### 32.1.5 SMTP 继继\n\n`SMTP Relay` 是一种允许外部 SMTP 服务器发送电子邮件而不是托管本地 SMTP 服务器的协议。这通常涉及使用\
  \ `Mailjet`、`SendGrid` 或 `MailGun` 等服务。\n\n### 32.2 配置 Ubuntu 邮件服务器\n\n\n\n许多系统使用\
  \ `Sendmail MTA` 来传输电子邮件消息；在许多 Linux 发行版中，它是默认的邮件传输代理（MTA）。遗憾的是，`Sendmail` 是一个复杂的系统，对于初学者和经验丰富的用户来说，理解和配置它都很困难。它也逐渐失去流行，因为它与许多近期\
  \ MTA 相比，处理电子邮件的速度较慢。\n\n许多系统管理员现在使用 `Postfix` 或 `Qmail` 来处理电子邮件。这两者都比 `Sendmail`\
  \ 更快且更容易配置。\n\n因此，本章将由于其简单性和流行性来看 `Postfix` 作为一种 MTA。然而，如果你倾向于使用 `Sendmail`，有许多专门研究该主题的书籍，它们比我们本章讲解得更深入。\n\
  \n作为第一步，本章将介绍如何配置 Ubuntu 系统作为完整的邮件服务器。在章节稍后的部分，还将介绍使用 SMTP 中继服务的步骤。\n\n## 32.3 Postfix\
  \ 安装前的步骤\n\n在安装 `Postfix` 之前的第一步是确保系统中没有在运行 `Sendmail`。你可以使用以下命令进行检查：\n\n```\nsystemctl\
  \ status sendmail\n```\n\n如果未安装 `sendmail`，工具将显示类似以下的消息：\n\n`Unit sendmail.service\
  \ could not be found.`\n\n如果你的系统中正在运行 `sendmail`，则在安装和配置 `Postfix` 之前有必要停止它。要停止\
  \ `sendmail`，请运行以下命令：\n\n```\nsystemctl stop sendmail\n```\n\n下一步是确保在系统重启时 `sendmail`\
  \ 不会自动重启：\n\n```\nsystemctl disable sendmail\n```\n\n现在 `Sendmail` 已已关闭，并被配置为在系统启动时不自动启动。可选，要从系统中彻底移除\
  \ `sendmail`，请运行以下命令：\n\n```\napt remove sendmail\n```\n\n## 32.4 防火墙/路由器配置\n\n\
  由于发送和接收电子邮件消息涉及网络连接，因此必须配置防火墙以允许 SMTP 流量。如果 `firewalld` 处于激活状态，使用 `firewall-cmd`\
  \ 工具如下：\n\n```\nfirewall-cmd --permanent --add-service=smtp\n```\n\n或者，如果启用了 `ufw`，使用以下命令配置其允许\
  \ SMTP 流量：\n\n```\nufw allow Postfix\n```\n\n此外，配置服务器与互联网之间的任何其他防火墙或路由器也至关重要，以允许端口\
  \ 25、143 和 587 的连接，必要时为这些端口配置端口转发到邮件服务器上相应的端口。\n\n完成这些初始步骤后，我们现在可以安装 `Postfix`。\n\
  \n## 32.5 在 Ubuntu 上安装 Postfix\n\n默认情况下，Ubuntu 的安装过程会为大多数配置安装 `postfix`。要验证 `postfix`\
  \ 是否已安装，请使用以下 `apt` 命令：\n\n```\napt -qq list postfix\n```\n\n如果 `apt` 报告 `postfix`\
  \ 未安装，则可以通过以下方式安装：\n\n```\napt install postfix\n```\n\n`apt` 工具将下载并安装 `postfix`，并在\
  \ `/etc/passwd` 文件中配置一个特殊的 `postfix` 用户。\n\n## 32.6 配置 Postfix\n\n`postfix` 的主要配置设置位于\
  \ `/etc/postfix/main.cf` 文件中。`/etc/postfix` 目录包含一个名为 `main.cf.proto` 的模板文件，你可以将其作为邮件系统配置的基础。互联网上的许多资源都提供了关于\
  \ `postfix` 的详细信息，因此本节将侧重于让电子邮件运行起来的基本选项。尽管 `apt` 安装设置了一些基本配置选项，但它往往会漏掉某些设置并对其他设置猜测错误，因此请仔细检查\
  \ `main.cf` 文件。\n\n`main.cf` 文件中的关键选项如下：\n\n```\nmyhostname = mta1.domain.com\n\
  mydomain = domain.com\nmyorigin = $mydomain\nmydestination = $myhostname, localhost.$mydomain,\
  \ localhost, $mydomain\ninet_interfaces = $myhostname\nmynetworks = subnet\n```\n\
  \n其他设置要么已由安装过程为你设置好，要么只有在你感到很有冒险并想要配置更复杂的邮件系统时才需要。\n\n`myhostname` 的格式为 `host.domain.extension`。例如，如果你的\
  \ Linux 系统名为 `MyLinuxHost` 且互联网域名为 `MyDomain.com`，你将如下所示设置 `myhostname` 选项：\n\n\
  ```\nmyhostname = mylinuxhost.mydomain.com\n```\n\n`mydomain` 设置只是上述设置的域名部分。例如：\n\
  \n```\nmydomain = mydomain.com\n```\n\n`myorigin` 设置定义了输出邮件在到达收件人收件箱时看起来来自的域名名称，应设置为你的域名：\n\
  \n```\nmyorigin = $mydomain\n```\n\n最关键的参数之一 `mydestination` 与入站邮件有关，它声明了此服务器作为最终投递目的域名。任何发给不在此列表中的域名的入站邮件将被视为中继请求，根据\
  \ `mynetworks` 设置（见下文概述），这通常会导致投递失败。\n\n`inet_interfaces` 设置定义了系统上允许 `postfix` 接收电子邮件的网络接口，通常被设置为\
  \ `all`：\n\n```\ninet_interfaces = all\n```\n\n`mynetworks` 设置定义了哪些外部系统被信任可以使用该服务器作为\
  \ SMTP 中继。此设置的可能值如下：\n\n- `host` - 仅信任本地系统。所有外部客户端尝试使用服务器作为中继的尝试都被拒绝。\n- `subnet`\
  \ - 只有同一网络子网上的系统可以使用服务器作为中继。例如，如果服务器的 IP 地址为 `192.168.1.29`，IP 地址为 `192.168.1.30`\
  \ 的客户端系统可以使用服务器作为中继。\n- `class` - 同一 IP 地址类（A、B、C）内的任何系统都可以使用服务器作为中继。\n\n可以通过通过指定子网、地址范围或引用模式文件来手动定义信任的\
  \ IP 地址。下面的示例将本地主机和子网 `192.168.0.0` 声明为信任 IP 地址：\n\n```\nmynetworks = 192.168.0.0/24,\
  \ 127.0.0.0/8\n```\n\n对于此示例，将属性设置为 `subnet`，以便同一局域网上的任何其他系统都可以通过中继发送电子邮件。相比之下，外部系统被阻止这样做：\n\
  \n```\nmynetworks = subnet\n```\n\n## 32.7 配置 DNS MX 记录\n\n当你向注册商注册并配置域名时，DNS 设置中会配置几个默认值。其中之一是所谓的邮件交换器（MX）记录。该记录定义了发往域名的邮件应该发送到哪里，通常设置为注册商提供的邮件服务器。如果你自己托管邮件服务器，MX\
  \ 记录应设置为你的域名或邮件服务器的 IP 地址。进行此更改的步骤取决于你的域名注册商，但通常涉及编辑域名的 DNS 信息并添加或编辑现有的 MX 记录以指向你的邮件服务器。\n\
  \n## 32.8 在 Ubuntu 系统上启动 Postfix\n\n一旦 `/etc/postfix/main.cf` 文件配置了正确的设置，现在是启动 `postfix`\
  \ 的时候了。可以通过以下命令行实现：\n\n```\nsystemctl start postfix\n```\n\n如果 `postfix` 已经在运行，使用以下命令加载配置更改：\n\
  \n```\nsystemctl reload postfix\n```\n\n要配置 `postfix` 在系统启动时自动启动，请运行以下命令：\n\n```\n\
  systemctl enable postfix\n```\n\n`postfix` 进程现在应该启动。验证一切运行正常的最佳方法是检查邮件日志。这通常位于 `/var/log/maillog`\
  \ 文件，现在应该包含类似于以下输出的条目：\n\n```\nMar 25 11:21:48 demo-server postfix/postfix-script[5377]:\
  \ starting the Postfix mail system\nMar 25 11:21:48 demo-server postfix/master[5379]:\
  \ daemon started -- version 3.3.1, configuration /etc/postfix\n```\n\n\n\n\n只要没有记录错误信息，说明你已经成功安装并启动了\
  \ postfix，并准备好测试 postfix 配置。\n\n# 32.9 测试 Postfix\n\n测试 postfix 配置的一种简单方法是在系统的本地用户之间发送电子邮件消息。要进行快速测试，请如下所示使用\
  \ `mail` 工具（其中 `name` 和 `mydomain` 分别替换为系统上的用户名和你的域名名）：\n\n```bash\nmail name@mydomain.com\n\
  ```\n\n在出现提示时，输入邮件的主题，然后输入邮件正文文本。按 `Ctrl-D` 发送邮件。例如：\n\n```bash\nmail demo@mydomain.com\n\
  \nSubject: Test email message\n\nThis is a test message.\n\nEOT\n```\n\n如果无法使用 `mail`\
  \ 工具，可以按照以下方式安装：\n\n```bash\napt install mailutils own\n```\n\n重新运行 `mail` 命令，这次要切换到另一个用户身份运行，并验证消息是否已发送和接收：\n\
  \n```bash\n$ mail\n\n\"/var/mail/demo\": 1 message 1 new\n\n>N 1 demo Wed Apr 15\
  \ 15:30 13/475 Test email message\n\n?\n```\n\n如果消息没有出现，请检查日志文件 `/var/log/maillog`\
  \ 中的错误。成功的邮件投递将如下所示显示在日志文件中：\n\n```\nMar 25 13:41:37 demo-server postfix/pickup[7153]:\
  \ 94FAF61E8F4A: uid=0 from=<root>\nMar 25 13:41:37 demo-server postfix/cleanup[7498]:\
  \ 94FAF61E8F4A: message-id=<20190325174137.94FAF61E8F4A@demo-server.mydomain.com>\n\
  Mar 25 13:41:37 demo-server postfix/qmgr[7154]: 94FAF61E8F4A: from=<root@mydomain.com>,\
  \ size=450, nrcpt=1 (queue active)\nMar 25 13:41:37 demo-server postfix/local[7500]:\
  \ 94FAF61E8F4A: to=<neil@mydomain.com>, relay=local, delay=0.12, delays=0.09/0.01/0/0.02,\
  \ dsn=2.0.0, status=sent (delivered to mailbox)\nMar 25 13:41:37 demo-server postfix/qmgr[7154]:\
  \ 94FAF61E8F4A: removed\n```\n\n一旦本地邮件功能正常，尝试向外部地址（如 GMail 账户）发送邮件。此外，通过从外部账户向你域名下的用户发送邮件来测试接收邮件是否正常。在每情况下，请检查\
  \ `/var/log/mail.log` 文件以获取任何错误的解释。\n\n# 32.10 通过 SMTP 中继服务器发送邮件\n\n使用 SMTP 中继服务是配置邮件服务器来处理发送邮件的替代方案。如之前讨论的，有多种服务可用，大多数可以通过网页搜索“SMTP\
  \ Relay Service”找到。这些服务中的大多数将要求你以某种方式验证域名，并提供 MX 记录以更新你的 DNS 设置。你还将获得一个用户名和密码，这些必须添加到\
  \ postfix 配置中。本节的其余部分假设系统中已安装了 postfix，并且已完成你选择的 SMTP 中继提供商所需的所有初始步骤。\n\n开始编辑 `/etc/postfix/main.cf`\
  \ 文件，并使用你的域名配置 `myhostname` 参数：\n\n```bash\nmyhostname = mydomain.com\n```\n\n接下来，在\
  \ `/etc/postfix` 中创建一个名为 `sasl_passwd` 的新文件，并添加一行包含中继服务提供的邮件服务器主机、用户名和密码的行。例如：\n\
  \n```text\n[smtp.myprovider.com]:587 neil@mydomain.com:mypassword\n```\n\n注意，上述条目中还指定了端口\
  \ `587`。如果没有此设置，postfix 将默认使用端口 `25`，而大多数 SMTP 中继服务提供商都会屏蔽该端口。\n\n创建密码文件后，使用 `postmap`\
  \ 工具生成包含凭据的哈希数据库：\n\n```bash\npostmap /etc/postfix/sasl_passwd\n```\n\n在继续之前，采取一些额外步骤来保护你的\
  \ postfix 凭据：\n\n```bash\nchown root:root /etc/postfix/sasl_passwd /etc/postfix/sasl_passwd.db\n\
  chmod 0600 /etc/postfix/sasl_passwd /etc/postfix/sasl_passwd.db\n```\n\n再次编辑 `main.cf`\
  \ 文件并添加一个条目来指定中继服务器：\n\n```bash\nrelayhost = [smtp.myprovider.com]:587\n```\n\n\
  在 `main.cf` 文件中添加以下行来配置 SMTP 服务器的身份验证设置：\n\n```bash\nsmtp_use_tls = yes\nsmtp_sasl_auth_enable\
  \ = yes\nsmtp_sasl_password_maps = hash:/etc/postfix/sasl_passwd\nsmtp_tls_CAfile\
  \ = /etc/ssl/certs/ca-bundle.crt\nsmtp_sasl_security_options = noanonymous\nsmtp_sasl_tls_security_options\
  \ = noanonymous\n```\n\n最后重启 postfix 服务：\n\n```bash\nsystemctl restart postfix\n\
  ```\n\n服务重启后，尝试使用 `mail` 工具或你偏好的邮件客户端发送和接收邮件。\n\n### 32.11 总结\n\n一个完整的、端到端的邮件系统由……（内容继续）\n\
  \n# 33. 为 Ubuntu 添加新磁盘\n\n## 33.1 文件系统或逻辑卷\n\n配置新磁盘有两种方法。一种直接的方法是创建一个或多个分区然后挂载它们。这种方法将在本章介绍。\n\
  \n另一种方法是向现有的卷组添加新空间或创建一个新卷。\n\n## 33.2 查找新硬盘\n\n本教程假设已安装一个新的物理或虚拟硬盘，并且操作系统可见。添加后，操作系统应自动检测到新硬盘。\n\
  \n## 33.3 创建 Linux 分区\n\n下一步是在新磁盘上创建一个或多个 Linux 分区。这是通过使用 `fdisk` 工具实现的，它接受要分区的设备作为命令行参数：\n\
  \n```bash\nfdisk /dev/sdb\n```\n\n\n\n\n更改将仅保留在内存中，直到你决定将其写入。\n\n在使用 `write` 命令之前请小心。\n\
  \n设备不包含可识别的分区表。\n\n已创建一个磁盘标识符为 `0x64d68d00` 的新 DOS 磁盘标签。\n\n命令 (m 获取帮助):\n\n要查看磁盘上的当前分区，请输入\
  \ `p` 命令：\n\n命令 (m 获取帮助): p\n\n```\nDisk /dev/sdb: 14.46 GiB, 15525216256 bytes,\
  \ 30322688 sectors\nDisk model: USB 2.0 FD\nUnits: sectors of 1 * 512 = 512 bytes\n\
  Sector size (logical/physical): 512 bytes / 512 bytes\nI/O size (minimum/optimal):\
  \ 512 bytes / 512 bytes\nDisklabel type: dos\nDisk identifier: 0x64d68d00\n```\n\
  \n从上面的 `fdisk` 输出中可以看出，该磁盘目前没有分区，因为它之前没有被过。下一步是在磁盘上创建一个新分区，该任务通过输入 `n`（表示新分区）来完成：\n\
  \n```\nCommand (m for help): n\nPartition number (1-4, default 1):\n```\n\n在这个示例中，我们只计划创建一个分区，它将是分区\
  \ `1`。接下来，我们需要指定分区的起始和结束位置。由于这是第一个分区，我们需要它从第一个可用扇区开始，由于我们想使用整个磁盘，我们将最后一个扇区指定为结束。请注意，如果你想创建多个分区，可以通过扇区、字节、千字节或兆字节来指定每个分区的大小：\n\
  \n```\nPartition number (1-4, default 1): 1\nFirst sector (2048-30322687, default\
  \ 2048):\nLast sector, +/-sectors or +/-size{K,M,G,T,P} (2048-30322687, default\
  \ 30322687):\nCreated a new partition 1 of type 'Linux' and of size 14.5 GiB.\n\
  ```\n\n命令 (m 获取帮助):\n\n现在我们已经指定了分区，需要使用 `w` 命令将其写入磁盘：\n\n```\nCommand (m for help):\
  \ w\n```\n\n分区表已更改。\n\n正在调用 `ioctl()` 重新读取分区表。\n\n正在同步磁盘。\n\n如果我们现在再次查看设备，将看到新分区显示为\
  \ `/dev/sdb1`：\n\n```bash\n# ls /dev/sd*\n/dev/sda /dev/sda1 /dev/sda2 /dev/sdb\
  \ /dev/sdb1\n```\n\n下一步是在我们的新分区上创建一个文件系统。\n\n### 3.4 在 Ubuntu 磁盘分区上创建文件系统\n\n现在我们已经安装了一块新磁盘，它对\
  \ Ubuntu 可见，并且我们已经在磁盘上配置了一个 Linux 分区。下一步是在分区上创建一个 Linux 文件系统，以便操作系统可以使用它来存储文件和数据。在分区上创建文件系统最简单的方法是使用\
  \ `mkfs.xfs` 实用程序：\n\n```bash\n# apt install xfsprogs\n# mkfs.xfs -f /dev/sdb1\n\
  ```\n\n```\nmeta-data=/dev/sdb1 isize=512 agcount=4, agsize=947520 blks\n      \
  \  = sectsz=512 attr=2, projid32bit=1\n        = crc=1 finobt=1, sparse=1, rmapbt=0\n\
  \        = reflink=1 bigtime=1 inobtcount=1\ndata = bsize=4096 blocks=3790080, imaxpct=25\n\
  \        = sunit=0 swidth=0 blks\nnaming =version 2 bsize=4096 ascii-ci=0, ftype=1\n\
  log =internal log bsize=4096 blocks=2560, version=2\n        = sectsz=512 sunit=0\
  \ blks, lazy-count=1\nrealtime =none extsz=4096 blocks=0, rtextents=0\n```\n\n在这种情况下，我们创建了一个\
  \ XFS 文件系统。XFS 是一种高性能文件系统，它是 Ubuntu 默认的文件系统类型，并且在并行 I/O 性能和日志的使用方面具有若干优势。\n\n###\
  \ 3.5 日志文件系统概述\n\n日志文件系统会在磁盘写入期间保留对文件系统所更改内容的日志或记录，这些日志可以用于快速恢复由于系统崩溃或断电等事件可能发生的损坏。\n\
  \n使用日志文件系统有几个优点。首先，多年来，存储在磁盘驱动器上的数据规模和容量呈指数级增长。非日志文件系统的问题在于，在崩溃后必须运行 `fsck`（文件系统一致性检查）实用程序。`fsck`\
  \ 实用程序将扫描整个文件系统，验证所有条目，并确保块被正确分配和引用。如果它发现损坏的条目，它将尝试修复问题。这里的问题有两个方面。\n\n### 3.6 挂载文件系统\n\
  \n现在我们已经创建了分区，需要创建一个挂载点。挂载点简单来说就是文件系统进入的目录。\n\n```bash\n# mkdir /backup\n```\n\n\
  然后可以使用 `mount` 命令手动挂载文件系统：\n\n```bash\n# mount /dev/sdb1 /backup\n```\n\n不带参数运行\
  \ `mount` 命令可以显示所有挂载的系统：\n\n```bash\n# mount\n```\n\n### 3.7 配置 Ubuntu 自动挂载文件系统\n\
  \n为了让系统在启动时自动挂载文件系统，需要在 `/etc/fstab` 文件中添加条目。`fstab` 的格式如下：\n\n`<device> <dir> <type>\
  \ <options> <dump> <fsck>`\n\n这些条目总结如下：\n\n- `<device>`：挂载文件系统的设备。\n- `<dir>`：作为挂载点的目录。\n\
  - `<type>`：文件系统类型（xfs, ext4 等）。\n- `<options>`：附加的文件系统挂载选项，例如使文件系统只读或控制任何用户都可以挂载文件系统。运行\
  \ `man mount` 查看选项列表。将此值设置为 `defaults` 将使用文件系统的默认设置。\n- `<dump>`：决定 `dump` 工具执行备份时是否包含文件系统的内容。此设置很少使用，可以使用\
  \ 0 值禁用。\n- `<fsck>`：在系统崩溃后是否由 `fsck` 检查文件系统，以及检查文件系统的顺序。对于像 XFS 这样的日志文件系统，应设置为\
  \ `0` 以表示不需要检查。\n\n以下示例显示了配置 `fstab` 文件，以自动挂载位于 `/dev/sdb1` 分区上的 `/backup` 分区：\n\
  \n```\n/dev/mapper/vgubuntu-root / ext4 errors=remount-ro 0 1\n/dev/mapper/vgubuntu-swap_1\
  \ none swap 0 0\n/dev/sdb1 /backup xfs defaults 0 0\n```\n\n现在每次系统重启时，`/backup`\
  \ 文件系统都将自动挂载。\n\n### 3.8 使用 Cockpit 添加磁盘\n\n\n\n\n\n除了使用本章概述的命令行工具进行存储设备工作外，还可以使用`Cockpit`\
  \ Web 控制台配置新的存储设备。要查看当前的存储配置，请登录`Cockpit`控制台并选择如图 33-1 所示的`Storage`选项：\n\n![](img/centos_cockpit_storage1.jpg)\n\
  \n图 33-1\n\n要找到新添加的存储设备，滚动到`Storage`页面的底部，直到`Drives`部分进入视野（注意`Drives`部分也位于屏幕的右上角）：\n\
  \n![](img/cockpit_drives.jpg)\n\n图 33-2\n\n在图中，新驱动器是 15.5 GB 的驱动器。选择新驱动器以显示`Drive`屏幕，如图\
  \ 33-3 所示：\n\n![](img/cockpit_drive_details.jpg)\n\n图 33-3\n\n点击`Create partition`按钮并使用对话框指定分配给此分区的空间、文件系统类型（推荐使用`XFS`）以及可选的标签、文件系统挂载点挂载选项。注意，如果此新分区没有使用所有可用空间，则可以在驱动器上添加额外的分区。要更改设置（例如文件系统是否只读或在启动时挂载），请更改`Mount\
  \ options`部分中的设置：\n\n![](img/cockpit_drive_create_partition.jpg)\n\n图 33-4\n\n一旦选择设置，点击`Create\
  \ partition`按钮提交更改。创建过程完成后，新分区将添加到磁盘中，相应的文件系统将被创建并挂载到指定的挂载点，并对`/etc/fstab`文件进行相应的更改。\n\
  \n### 33.9 总结\n\n本章涵盖了向现有的 Ubuntu 系统添加物理或虚拟磁盘驱动器。这是一个相对简单的过程，即确保新驱动器被操作系统检测到，在驱动器上创建一个或多个分区，然后在这些分区上创建文件系统。虽然\
  \ Ubuntu 上提供了多种文件系统类型，但通常推荐`XFS`。一旦文件系统准备就绪，可以使用`mount`命令进行挂载。为了让新创建的文件系统在系统启动时自动挂载，可以对`/etc/fstab`配置文件进行添加。\n\
  \n### 34. 向 Ubuntu 22.04 组和逻辑卷添加新磁盘\n\n在上一章中，我们查看了向 Ubuntu 系统添加新磁盘驱动器、创建分区和文件系统，然后挂载该文件系统以访问磁盘。创建固定分区和文件系统的替代方案是使用`逻辑卷管理\
  \ (LVM)`来创建逻辑磁盘，这些逻辑磁盘由一个或多个物理或虚拟磁盘或分区的空间组成。使用`LVM`的优势是可以在逻辑卷中添加或删除空间，而无需将数据分散到多个文件系统上。\n\
  \n让我们以基于 Ubuntu 的服务器根（`/`）文件系统为例。如果没有`LVM`，该文件系统在安装操作系统时将具有特定的大小。如果安装了新的磁盘驱动器，则没有办法将任何空间分配给`/`文件系统。唯一的选项是在新磁盘上创建新的文件系统并将它们挂载到特定的挂载点。在这种情况下，你在新文件系统上有充足的空间，但`/`文件系统仍然几乎是满的。唯一的选择是将文件移动到新文件系统。有了`LVM`，新磁盘（或其部分）可以分配给包含主文件系统的逻辑卷，从而动态地扩展可用空间。\n\
  \n在本章中，我们将查看向卷组和逻辑卷都添加新磁盘空间的必要步骤，以便为 Ubuntu 系统的主文件系统添加额外空间。\n\n#### 34.1 逻辑卷管理 (LVM)\
  \ 概述\n\n`LVM`提供了一种灵活且高级的磁盘空间管理方法。与其将每个磁盘驱动器划分为固定大小的分区并在其上创建固定大小的文件系统，`LVM`提供了一种将磁盘空间分组为逻辑卷的方法，这些逻辑卷可以轻松地调整大小和移动。此外，`LVM`允许管理员通过向这些用户分配不同的卷组或逻辑卷，仔细控制分配给不同用户组的磁盘空间。当分配给卷的空间耗尽时，管理员可以增加空间，而无需将用户文件移动到不同的文件系统。\n\
  \n`LVM`由以下组件组成：\n\n### 34.1.1 卷组 (VG)\n`卷组`（Volume Group）是一个包含一个多个逻辑和物理卷的高级容器。\n\
  \n### 34.1.2 物理卷 (PV)\n`物理卷`（physical volume）代表存储设备，如磁盘驱动器或其他存储媒体。\n\n### 34.1.3\
  \ 逻辑卷 (LV)\n`逻辑卷`（logical volume）等同于磁盘分区，与磁盘分区一样，它可以包含文件系统。\n\n##### 34.1.4 物理扩展区\
  \ (PE)\n每个物理卷（`PV`）被分为等大小的块，称为物理扩展区（physical extents）。\n\n##### 34.1.5 逻辑扩展区 (LE)\n\
  每个逻辑卷（`LV`）被分为等大小的块，称为逻辑扩展区（logical extents）。\n\n假设我们正在创建一个名为`VolGroup001`的新卷组。该卷组需要物理磁盘空间才能运行，因此我们分配了三个磁盘分区`/dev/sda1`、`/dev/sdb1`和`/dev/sdb2`作为物理卷。然后，我们在卷组内创建一个名为`LogVol001`的逻辑卷。如果`LogVol001`的空间耗尽，我们可以添加更多磁盘分区。\n\
  \n### 34.2 获取逻辑卷信息\n\n作为在 Ubuntu 中使用`LVM`的示例，我们将处理如何为`/`文件系统添加空间的示例。考虑到根分区大小的灵活性，在对`LVM`设置进行任何更改之前，必须收集信息。运行`mount`命令将输出关于挂载点的信息，包括：\n\
  \n```\n/dev/mapper/vgubuntu-root on root\n```\n\n可以使用`vgdisplay`命令获取卷组的信息：\n\n```\n\
  vgdisplay\n--- Volume group ---\nVG Name vgubuntu\nSystem ID\nFormat lvm2\nMetadata\
  \ Areas 1\nMetadata Sequence 3\nVG Access read/write\nVG Status resizable\nMAX LV\
  \ 0\nCur LV 2\nMax PV 0\nCur PV 1\nVG Size <297.09 GiB\nPE Size 4.00 MiB\nTotal\
  \ PE 76054\nAlloc PE / Size 76054 / 297.09 GiB\nFree PE / Size 8 / 32.00 MiB\nVG\
  \ UUID Od8dC-jysL-JEei-KsJf-KsY5\n```\n\n如上例所示，`vgubuntu`卷组的物理扩展区大小为`4.00MiB`，并为逻辑卷分配了总计`297.09GB`。目前已分配了`76054`个物理区，等于总容量。因此，我们必须添加一个或多个物理卷以增加分配给`vgubuntu`卷组中任何逻辑卷的空间。`vgs`工具有助于显示系统中卷组可用空间的快速概述：\n\
  \n```\nvgs\nVG #PV #LV #SN Attr VSize VFree\nvgubuntu 1 2 0 wz--n- <297.09g 32.00m\n\
  ```\n\n同样可以使用`lvdisplay`命令获取卷组中逻辑卷的信息：\n\n```\nlvdisplay\n--- Logical volume ---\n\
  LV Path /dev/vgubuntu/root\nLV Name root\nVG Name vgubuntu\nLV UUID TtXoiY-2Qx3-m1Uv-yNOL-Tpr0-oYkn-UsAKNB\n\
  LV Write Access read/write\nLV Creation host, time ubuntu, 2023-06-14 15:37:05 -0400\n\
  LV Status available\n# open 1\nLV Size <293.73 GiB\nCurrent LE 75194\nSegments 1\n\
  ```\n\n\n\n\n\n# 分配继承\n### 分配继承\n预读扇区自动\n- 当前设置为 256\n块设备 253:0\n--- 逻辑卷 ---\nLV\
  \ 路径 `/dev/vgubuntu/swap_1`\nLV 名称 `swap_1`\nVG 名称 `vgubuntu`\nLV UUID `CwNf3T-t0jx-C8Gs-l5Ft-kVcI-1q6f-lFFoKV`\n\
  LV 写入权限 读/写\nLV 创建宿主机 host,  time ubuntu, 2023-06-14 15:37:05 -0400\nLV 状态可用\n#\
  \ open 2\nLV 大小 `<3.83 GiB`\n当前 LE 980\n分段 1\n分配继承\n预读扇区自动\n- 当前设置为 256\n块设备 253:1\n\
  \n如上例所示，卷组 `vgubuntu` 中的 293 GiB 空间已分配给逻辑卷 `root`（用于 `/` 文件系统），3.83 GiB 分配给 `swap`（用于交换空间）。\n\
  \n既然我们已经知道了哪些空间正在使用，那么了解哪些设备提供了这些空间（换句话说，哪些设备被用作物理卷）通常帮助。要获取此信息，我们需要运行 `pvdisplay`\
  \ 命令：\n\n```bash\n# pvdisplay\n\n--- 物理卷 ---\nPV 名称 `/dev/sda2`\nVG 名称 `vgubuntu`\n\
  PV 大小 `<297.09 GiB` /可用 `4.00 MiB`\n可分配 是（已满）\nPE 大小 4.00 MiB\n总 PE 76054\n空闲 PE\
  \ 0\n已分配 PE 76054\nPV UUID `bHWRHo-0MED-XEtL-WNXW-4hje-vYxa-NPSIOc`\n``` 显然，由逻辑卷\
  \ `vgubuntu` 控制的空间是通过位于 `/dev/sda2` 上的物理卷提供的。\n\n现在我们对 LVM 配置有了了深入的了解，可以为卷组及其包含的逻辑卷添加空间了。\n\
  \n## 34.3 从命令行向卷组添加额外空间\n\n与之前收集 Ubuntu 系统当前逻辑卷管理配置信息的步骤一样，对此配置的更改也可以从命令行进行。\n\n\
  在本章的剩余部分中，我们假设系统已添加了一个新磁盘，并且操作系统将其识别为 `/dev/sdb`。我们还假设这是一个没有现有分区的磁盘磁盘。如果存在现有分区，应对其进行备份，然后使用\
  \ `fdisk` 工具从磁盘上删除这些分区。例如，假设由 `/dev/sdb` 表示的设备包含以下两个分区：\n\n```bash\n# fdisk -l /dev/sdb\n\
  \n磁盘 /dev/sdb: 14.46 GiB, 15525216256 字节, 30322688 扇区\n磁盘模型: USB 2.0 FD\n单位: 扇区，即\
  \ 1 * 512 = 512 字节\n扇区大小（逻辑/物理）:512 字节 / 512 字节\nI/O 大小（最小/最优）:512 字节 / 512 字节\n\
  磁盘标签类型: dos\n磁盘标识符: 0x4c33060b\n设备 起始 结束 扇区 大小 Id 类型\n/dev/sdb1 2048 30322687 30320640\
  \ 14.5G 83 Linux\n```\n\n一旦这些分区上的任何文件系统都已卸载，它们就可以按照以下方式删除它们：\n\n```bash\n# fdisk\
  \ /dev/sdb\n\n欢迎使用 fdisk (util-linux 2.37.4)。\n更改将仅保留在内存中，直到你决定写入它们。\n在使用写入 命令前请要小心。\n\
  命令 (m 帮助): d\n已选择分区 1\n分区 1 已删除。\n命令 (m 帮助): w\n分区表已更改。\n正在调用 ioctl() 重新读取分区表。\n\
  正在同步磁盘。\n```\n\n在移动到下一步之前，请删除 `/etc/fstab` 文件中关于这些文件系统的条目，以便系统在下次重启时不会尝试挂载它们。\n\n\
  一旦磁盘准备就绪，下一步是使用 `pvcreate` 命令将此磁盘转换为物理卷（同时擦除存在的 dos 签名）：\n\n```bash\n# pvcreate\
  \ /dev/sdb\n\n警告: 在 /dev/sdb 偏移量 510 检测到 dos 签名。擦除它？ [y/n]: y\n正在擦除 /dev/sdb 上的\
  \ dos 签名。\n物理卷 \"/dev/sdb\" 创建成功。\n```\n\n如果创建失败并显示“Device /dev/<device> excluded\
  \ by a filter”消息，则可能在创建物理卷之前使用 `wipefs` 命令擦除磁盘：\n\n```bash\n# wipefs -a /dev/sdb\n\
  ```\n\n```text\n/dev/sdb: 偏移量 0x00000200 (gpt) 擦除了 8 字节: 45 46 49 20\n/dev/sdb:\
  \ 偏移量 0x1ffff00 (gpt) 擦除了 8 字节: 45 46 49 20\n```\n\n\n\n\n[`help.ubuntu.com/community/SwapFaq`](https://help.ubuntu.com/community/SwapFaq%20)\n\
  \n当系统进入休眠（hibernation）时，当前的系统状态会被写入硬盘，主机将关闭电源。当随后重新开机时，系统状态将从硬盘驱动器恢复。这与挂起（suspension）不同，后者的系统状态存储在\
  \ RAM 中。机器随后进入睡眠状态，此时系统 RAM 仍保持供电，而其他设备将关闭关闭。\n\n## 35.3 识别当前交换空间的使用情况\n\nUbuntu\
  \ 系统当前使用的交换（swap）空间可以通过多种方法进行识别。一种方法是输出 `/proc/swaps` 文件：\n\n```bash\ncat /proc/swaps\n\
  Filename Type Size Used Priority\n/dev/dm-1 partition 4169724 41484 -2\n```\n\n\
  或者，可以使用 `swapon` 命令：\n\n```bash\nswapon\nNAME TYPE SIZE USED PRIO\n/dev/dm-1 partition\
  \ 4G 40.5M -2\n```\n\n要查看交换空间相对于总可用 RAM 的数量，可以使用 `free` 命令：\n\n```bash\nfree\n \
  \     total used free shared buff/cache available\nMem: 4035436 1428276 2224596\
  \ 21968 382564 2360172\nSwap: 4169724 41484 4128240\n```\n\n## 35.4 为 Ubuntu 系统添加交换文件\n\
  \n可以通过创建一个文件并将其分配为交换空间来为系统添加额外的交换。首先使用 `dd` 命令创建交换文件。可以通过调整 `count=` 变量来更改文件的大小。例如，以下命令行创建了一个\
  \ 2.0 GB 的文件：\n\n```bash\ndd if=/dev/zero of=/newswap bs=1024 count=2000000\n2000000+0\
  \ records in\n2000000+0 records out\n2048000000 bytes (2.0 GB, 1.9 GiB) copied,\
  \ 3.62697 s, 565 MB/s\n```\n\n在将文件转换为交换文件之前，必须确保该文件设置了安全的权限：\n\n```bash\nchmod 0600\
  \ /newswap\n```\n\n一旦创建了合适的文件，就需要使用 `mkswap` 命令将其转换为交换文件：\n\n```bash\nmkswap /newswap\n\
  Setting up swapspace version 1, size = 1.9 GiB (2047995904 bytes)\nno label, UUID=4ffc238d-7fde-4367-bd98-c5c46407e535\n\
  ```\n\n创建并配置交换文件后，可以使用 `swapon` 实用程序实时添加到系统：\n\n```bash\nswapon /newswap\n```\n\n\
  现在重新运行 `swapon` 应该报告新文件正在被用作交换：\n\n```bash\nswapon\nNAME TYPE SIZE USED PRIO\n/dev/dm-1\
  \ partition 4G 0B -2\n/newswap file 1.9G 0B -3\n```\n\n可以使用 `swapoff` 实用工具动态地移除交换空间：\n\
  \n```bash\nswapoff /newswap\n```\n\n最后，修改 `/etc/fstab` 文件，通过添加以下行在系统启动时自动添加新的交换空间：\n\
  \n```text\n/newswap swap swap defaults 0 0\n```\n\n## 35.5 将交换作为分区添加\n\n作为指定文件为交换空间的替代方案，整个磁盘分区也可以被指定为交换。实现此点的步骤在很大程度上与添加交换文件的步骤相同。然而，在将分区分配给交换之前，请确保相应文件系统上的任何现有数据已备份或不再需要，并且该文件系统已卸载。\n\
  \n假设在由 `/dev/sdb1` 表示的磁盘驱动器上存在一个分区，第一步将是一次 `mkswap` 实用程序将其转换为交换分区：\n\n```bash\n\
  mkswap /dev/sdb1\nmkswap: /dev/sdb1: warning: wiping old xfs signature.\nSetting\
  \ up swapspace version 1, size = 8 GiB (8587833344 bytes)\nno label, UUID=a899c8ec-c410-4569-ba18-ddea03370c7f\n\
  ```\n\n接下来，将新分区添加到系统交换中并验证其确实已添加：\n\n```bash\nswapon /dev/sdb1\nswapon\nNAME TYPE\
  \ SIZE USED PRIO\n/dev/dm-1 partition 4G 0B -2\n/dev/sdb1 partition 8G 0B -3\n```\n\
  \n再次，可以如下修改 `/etc/fstab` 文件，以便在启动时自动添加交换分区：\n\n```text\n/dev/sdb1 swap swap defaults\
  \ 0 0\n```\n\n## 35.6 为 Ubuntu LVM 交换卷添加空间\n\n在运行逻辑卷管理（LVM）的系统上，通过文件或磁盘分区添加交换的替代方案是扩展用于交换的逻辑卷。在运行逻辑卷管理的系统上，扩展用于交换的逻辑卷来添加交换。首先，使用\
  \ `lvdisplay` 实用程序查看逻辑卷组的可用空间：\n\n```bash\nlvdisplay\n--- Logical volume ---\nLV\
  \ Name: swap\nLV Path: /dev/vg0/swap\nVG Name: vg0 \nLV Size: 4.00 GiB\nLV Status:\
  \ active\n```\n\n如果逻辑卷组没有可用空间，那么在扩展交换之前需要添加空间。首先通过检查逻辑卷组的状态：\n\n```bash\nvgs\nVG\
  \ #PV #LV #SN Attr VSize VFree\nvg0 1 1 w-n- 0.00g\n```\n\n\n\n\n逻辑卷 `vgubuntu/swap_1`\
  \ 的大小已从 980.00 MiB (245 extents) 更改为 10.66 GiB (2729 extents)。\n\n逻辑卷 `vgubuntu/swap_1`\
  \ 调整成功。\n\n在逻辑卷上重新创建交换：\n\n```bash\nmkswap /dev/vgubuntu/swap_1\n```\n\n```text\n\
  mkswap: /dev/vgubuntu/swap_1: warning: wiping old swap signature.\nSetting up swapspace\
  \ version 1, size = 10.7 GiB (11446251520 bytes)\nno label, UUID=447fb9e5-5473-4f2c-96f8-839b1457d3ed\n\
  ```\n\n接下来，重新开启交换：\n\n```bash\nswapon /dev/vgubuntu/swap_1\n```\n\n最后，使用 `swapon`\
  \ 命令验证交换空间已已到系统：\n\n```bash\nswapon\n```\n\n```text\nNAME TYPE SIZE USED PRIO\n\
  /dev/dm-1 partition 10.7G 0B -2\n```\n\n## 35. 总结\n\n在处理内存资源受限的情况下，交换空间是几乎任何操作系统的关键组成部分。通过将内存区域交换到磁盘，系统能够继续运行并满足运行其上的进程和应用程序的需求。\n\
  \nUbuntu 提供了一系列指南，根据系统安装的 RAM 数量建议应分配的基于磁盘的交换空间大小。在这些建议被证明不足的情况下，可以向系统添加额外的交换空间，通常不需要重启。正如本章概述，交换空间可以以文件、磁盘或磁盘分的形式，或者通过扩展已配置为交换空间的现有逻辑卷来添加。\n\
  \n## 36 Ubuntu 22.04 系统和进程监控\n\n运行和管理 Ubuntu 系统的一个基本部分是监控有关内存、交换、存储和处理器使用的的整体系统健康状况。这包括了解如何检查和管理在后台运行的系统和用户进程。本章将概述某些用于监控\
  \ Ubuntu 系统资源和进程的工具和实用程序。\n\n### 36.1 管理进程\n\n即使 Ubuntu 系统看起来是空闲的，许多系统进程也会在后台静默运行以保持操作系统的运行。例如，当你执行一个命令或启动应用程序时，用户进程就会启动，一直运行到关联任务完成。\n\
  \n要获取当前在单个终端或命令提示符会话中运行的活动用户进程列表，请如下所示使用 `ps` 命令：\n\n```bash\nps\n```\n\n```text\n\
  \  PID TTY TIME CMD\n10395 pts/1 00:00:00 bash\n13218 pts/1 00:00:00 ps\n```\n\n\
  `ps` 命令的输出显示当前终端窗口或命令提示符会话中运行了两个用户进程：输入命令的 `bash` shell 和 `ps` 命令本身。\n\n要列出当前用户运行的所有活动进程，请使用带有\
  \ `-a` 标志的 `ps` 命令。该命令将列出与用户相关的所有运行进程，无论它们在哪里运行（例如在其他终端窗口中运行的进程）：\n\n```bash\nps\
  \ -a\n```\n\n```text\n    PID TTY TIME CMD\n    5442 tty2 00:00:00 gnome-session-b\n\
  \    6350 pts/0 00:00:00 sudo\n    6354 pts/0 00:00:00 su\n    6355 pts/0 00:00:00\
  \ bash\n    9849 pts/2 00:00:00 nano\n    9850 pts/1 00:00:00 ps\n```\n\n如上述输出所示，用户正在运行与\
  \ GNOME 桌面、shell 会话、`nano` 编辑器以及 `ps` 命令相关的进程。\n\n要列出特定用户的进程，运行带有 `-u` 标志的 `ps`\
  \ 并在后加上用户名：\n\n```bash\nps -u john\n```\n\n```text\n  PID TTY TIME CMD\n914 ? 00:00:00\
  \ systemd\n915 ? 00:00:00 (sd-pam)\n970 ? 00:00:00 gnome-keyring-d\n974 tty1 00:00:00\
  \ gdm-x-session\n```\n\n注意，每个进程都分配有一个唯一的进程 ID（PID），可以通过 `kill` 命令向其发送终止（`TERM`）信号来停止进程。例如：\n\
  \n```bash\nkill 13217\n```\n\n使用 `TERM` 信号结束进程的优点是它允许进程优雅地退出，可能会保存任何其他可能丢失的数据。\n\
  \n如果标准终止信号没有终止进程，请重复带有 `-9` 选项的 `kill` 命令。此命令发送 `KILL` 信号，这应该导致即使是冻结的进程也会退出，但它没有给进程优雅退出的机会，可能会导致数据丢失：\n\
  \n```bash\nkill -9 13217\n```\n\n要列出系统中运行的所有进程（包括所有用户和系统进程），执行以下命令：\n\n```bash\n\
  ps -ax\n```\n\n```text\n      PID TTY STAT TIME COMMAND\n1 ? Ss 0:22 /usr/lib\n\
  2 ? S 0:00\n3 ? I< 0:00\n4 ? I< 0:00\n```\n\n要列出所有进程并包含所有权、CPU 和内存使用信息，请使用 `-aux`\
  \ 执行 `ps` 命令：\n\n```bash\nps aux\n```\n\n```text\nUSER %CPU %MEM VSZ RSS TTY START\
  \ COMMAND\nroot 0.0 0.1 26324 5048 ? S 09:55 systemd\nroot 0.0 0.0 23410 5664 ?\
  \ S 09:55 add\nroot 0.0 0.0 23316 6280 ? I< 09:55 par\nroot 0.0 0.0 22218 7632 ?\
  \ I< 09:55 ns\nroot 0.0 0.0 23344 8048 ? S 09:55 sess\n```\n\n\n\n正如“Cockpit Web\
  \ 界面概述”章节所述，Cockpit Web 界面可以执行基础系统监控。上一节还解释了如何使用 GNOME 系统监器（System Monitor）工具监控进程和系统资源。本章还探索了如何使用\
  \ `ps` 命令提供 Ubuntu 系统上运行进程的快照。然而，`ps` 命令无法提供系统进程和资源使用的实时视图。`top` 命令是从命令行对系统资源和进程进行实时监控的理想工具。\n\
  \n运行 `top` 命令时，它将按系统资源使用情况对系统上运行的进程进行排序（资源需求最大的进程位于顶部）。屏幕的上部分显示内存和交换分区（swap）的使用信息，以及所有\
  \ CPU 核心的数据。所有这些输出都会不断更新，允许对系统进行实时监控：\n\n![](img/top_running.jpg)\n\n图 36-7\n\n\
  要将显示的信息限制为特定用户的进程，请使用 `-u` 启动 `top` 并后接用户名：\n\n```bash\n$ top -u john\n```\n\n###\
  \ 若要查看 `top` 可用完整列表，请按下键盘上的“h”键或参考 man 页（帮助页）：\n\n```bash\n$ man top\n```\n\n##\
  \ 36.3 命令行磁盘和交换空间监控\n\n可以在 Cockpit 内部使用 GNOME 系统监器监控磁盘空间。然而，要从命令行识别磁盘使用情况，`df` 命令提供了有用且快速的概述：\n\
  \n要查看当前的交换空间和内存使用情况，请运行 `free` 命令：\n\n```bash\n# free\n```\n\n```\n            \
  \  total used free shared buff/cache available\nMem: 3823720 879916 1561108 226220\
  \ 1382696 2476300\n```\n\n要持续监控内存和交换分区级别，请使用 `-s` 运行 `free` 命令，指定每次更新之间的秒数（请注意，`top`\
  \ 工具可能提供了查看此类数据的更好方法）：\n\n```bash\n$ free -s 1\n```\n\n```\nMem: 3823720 879472\
  \ 1561532 226220 1382716 2476744\nSwap: 2097148 0 2097148\n              total used\
  \ free shared buff/cache available\nMem: 3823720 879140 1559940 228144 1384640 2475152\n\
  Swap: 2097148 0 2097148\n```\n\n要从命令行监控磁盘 I/O，可以考虑使用 `iotop` 命令，可以通过以下方式安装它：\n\n\
  ```bash\n# apt install iotop\n```\n\n一旦安装并执行（`iotop` 必须以系统管理员权限运行），该工具将按进程显示磁盘 I/O\
  \ 的实时列表：\n\n![](img/iotop_running.jpg)\n\n图 36-8\n\n## 36.4 总结\n\n即使是一个看起来无所事事的系统，后台也有许多系统进程在运行。用户在系统上执行的操作会导致启动额外的进程。进程还可以产生自己的子进程。每个进程都会使用一些系统资源，包括内存、交换分区、处理器周期、磁盘存储和网络带宽。本章探索了一\
  \ set 工具，用于监控运行系统上的进程和系统资源，并在需要时杀死可能影响系统性能的错误进程。\n\n## 索引\n\n### 符号\n\n- `$DISPLAY`\
