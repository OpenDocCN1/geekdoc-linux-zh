    ## 创建新用户

    最后，你可能需要为家人或同事创建额外的用户账户。这些账户可以让每个用户独立存储个人信息，并根据自身偏好配置桌面环境。从“系统”菜单的“管理”选项中打开“用户和组”工具。系统会提示你输入密码以确认管理操作，随后会显示如图4-19所示的“用户设置”工具。

    ![](img/93a96bd5075527285b151804f3a5c28f_97_0.png)

