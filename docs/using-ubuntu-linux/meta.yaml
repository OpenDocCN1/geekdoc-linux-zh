    ## 声音和视频

    下载后相关内容会存储在您的“Podcast”目录中。文件下载完成后，可以像播放音乐文件一样播放它。


    ### 蛇形应用

    蛇形应用（http://s1x.homelinux.net/projects/serpentine/）是一款易于使用的工具，可用于从音乐文件创建音频CD。它支持多种数字文件格式（WAV、MP3、OGG、FLAC），同时支持从文件管理器或韵律盒应用程序拖放文件。您可以通过“声音和视频”子菜单中的“蛇形”图标启动该应用程序。

    图9-6 蛇形应用

    启动后，将显示如图9-6所示的易于使用的界面。只需将韵律盒应用程序或文件管理器中的文件拖放到蛇形应用窗口即可。或者，您可以点击工具栏上的“添加”按钮，浏览并选择音乐文件或播放列表文件。选定文件后，只需点击“写入光盘”按钮即可开始创建音频CD。

    与图腾应用程序一样，蛇形应用使用“编解码器”解码音乐文件并将其写入CD。如果未安装正确的编解码器，将弹出错误消息，提示您不支持该文件类型。

    图9-7 蛇形应用不支持的文件类型

    只需使用“添加/删除应用程序”工具搜索文件扩展名（例如“MP3”），即可找到对应的正确编解码器，勾选编解码器复选框，然后点击“确定”进行安装。编解码器安装完成后，重启蛇形应用，即可读取该文件格式并制作CD。


    ### 音乐榨汁机

    该应用程序用于从音频CD中提取（即“抓轨”）音乐，并将其转换为可在韵律盒或图腾应用中播放的数字音频文件。也可用于直接在电脑上播放CD音频光盘，如图9-8所示。

    图9-8 音乐榨汁机

    将CD插入电脑的CD或DVD驱动器后，音乐榨汁机会尝试从名为MusicBrainz（http://www.musicbrainz.org）的互联网数据库自动下载光盘和音轨标题。这使应用程序能够自动命名音频文件，并为音频文件分配属性（例如专辑标题、音轨标题、艺术家等），以便播放时显示这些信息。CD通过其序列号以及音轨的位置和长度与免费的MusicBrainz数据库进行匹配来识别。极少数情况下，该数据可能返回多张CD的详细信息，此时音乐榨汁机会询问您要使用哪条数据。

    > 如果完全无法识别该CD，您可以使用标题、艺术家和流派文本框手动输入信息。

    图9-8 音乐榨汁机光盘编辑帮助

