    ## 图3-9 文件浏览器

    文件浏览器包含一个菜单栏，可用于创建新文件和目录，或创建其他目录的“书签”或快捷方式。

    双击文件夹即可进入下层目录，点击工具栏上的“向上”按钮即可返回上层目录，通过这种方式可以轻松在不同目录间上下导航。

    工具栏下方是“位置栏”。该栏会显示目录树中每个文件夹对应的按钮，因此你也可以通过点击栏中的按钮快速跳转到对应目录。

    文件浏览器左侧是“侧边栏”。该面板显示的信息取决于面板顶部弹出菜单中选中的选项，该菜单包含以下选项：

    - **位置** – 列出可移动介质和你的主目录

    - **信息** – 在文件浏览器中选中文件或文件夹时，显示其相关信息

    - **目录树** – 以目录树的形式列出内容，作为导航目录结构的另一种方式

    - **历史记录** – 列出你访问过的目录

    - **笔记** – 允许你输入笔记，返回该目录时会显示对应内容

    - **徽章** – 可拖放到文件或目录上的标签


    文件与目录可通过拖放操作进行移动或删除，移动删除方式与其他操作系统类似；也可以通过右键点击文件后选择“复制”，或点击“编辑”菜单中的“复制”选项来复制文件。

    此外，还可以通过将文件或目录拖到废纸篓、点击“编辑”菜单中的“移至已删除项目文件夹”选项，或右键点击文件后选择“移至已删除项目文件夹”来删除文件。

    只有当你点击底部面板的废纸篓图标，选择“清空废纸篓”时，文件或目录才会被永久删除。


    ### 使用可移动介质

    当你插入可移动介质（如U盘、空白CD或DVD光盘）时，Ubuntu会在桌面以及“位置”菜单中显示该介质的图标，如图3-10所示。

    > 图3-10 空白CD-R介质

    介质中的文件和目录可以轻松通过拖放操作从介质复制到主目录，或从主目录复制到可移动介质中。

    如果将文件复制到U盘等闪存设备，需要右键点击桌面上的U盘图标，在弹出的菜单中选择“弹出”，这一步非常重要。该操作会将所有信息写入存储设备，之后你就可以安全地从电脑中拔出设备。如果直接拔出设备而没有选择“弹出”，数据将无法完整写入存储设备。

    同样的，如果是空白CD或DVD光盘，在将文件复制到光盘后，需要双击光盘图标，在“文件”菜单中选择“写入光盘”，如图3-11所示。

    ## 图3-11 写入光盘


    ## 总结

    你现在应该已经熟悉了GNOME桌面环境，并意识到该系统在使用上与Windows或Mac OS X系统没有太大差异。学完本章内容后，你现在应该已经掌握如何将工作备份从可移动介质（U盘、闪存或CD/DVD）复制到主目录中了。


    ## 4 系统配置

    现在我们可以开始配置系统，以便连接网络、设置打印机并创建额外的用户账户。完成本章操作后，你的电脑就可以投入使用了。


    ### 配置网络设置

    如果你的电脑连接到有线网络，且网络设置由动态主机配置协议（DHCP）自动配置，那么你无需进行任何设置，网络连接即可正常使用。你可以直接跳过后续的说明内容，在本章稍后进行系统更新检查即可。

    但如果你使用的是未开启DHCP的有线网络，或是正在使用无线网卡，则需要手动进行配置。后续章节将引导你完成配置步骤。


    ### 有线网络

    要配置网络，请将鼠标指针移到通知区域的电脑图标上并左键单击，在弹出的菜单中选择“手动配置”。之后系统会提示你输入密码，如图4-1所示。

    > 每当执行管理操作时，Ubuntu都会提示你输入密码。这是为了确保操作由你本人执行，而非试图危害系统安全的恶意软件执行。

    > 图4-1 输入密码以执行管理操作

    输入密码后，会显示网络设置工具，如图4-2所示。

    ## 图4-2 网络设置

    选中“有线连接”后，点击“属性”按钮。

    ## 图4-3 接口设置

    在“连接”选项卡中，打开“配置”下拉菜单（如图4-3所示），选择“静态IP地址”或“本地Zeroconf网络（IPv4 LL）”。

    如果你想通过路由器连接到互联网，并且知道正确的地址设置，请选择“静态IP地址”。如果你在小型局域网中且无需连接互联网，可以选择本地Zeroconf设置，Ubuntu会自动分配地址，以便与其他采用相同配置的计算机通信。

    如需手动配置地址，请输入IP地址、子网掩码和网关地址（默认网关或路由器地址），然后点击“确定”。网络设置将会被重新配置。

    接下来，选择“常规”选项卡，输入你本地网络的“域名”，如图4-4所示。

    ## 图4-4 常规选项卡

    然后选择“DNS”选项卡，如图4-5所示，点击“DNS服务器”输入框，输入DNS服务器的IP地址后按回车键即可。必要时，点击“添加”按钮输入其他地址。你也可以点击“添加”按钮，在“搜索域”字段中输入本地DNS域，以配置要搜索的本地DNS区域。

    ## 图4-5 DNS选项卡

    最后，你可以点击软盘图标，为网络设置输入名称，以此保存该配置。如果你使用笔记本电脑，需要连接到使用不同网络设置的多个网络，这个功能非常实用。每个配置都可以被保存，你只需从“位置”下拉菜单中选择对应配置，即可快速切换至正确的网络设置。

    > 图4-6 需要输入无线网络密钥


    ### 无线网络

    配置无线网卡与手动配置有线网络的流程非常相似。左键单击通知区域的电脑图标，即可显示可用的无线网络。然后选择菜单中显示的你的无线网络名称。

    如果你的网络启用了加密，系统会提示你输入无线网络密钥。在下拉菜单中选择你使用的无线安全类型（包括密码、十六进制、ASCII或文本字符串），如图4-6所示，然后在文本框中输入密钥。

    最后，选择开放系统或共享密钥的身份验证方法，然后点击“登录到网络”按钮，即可连接到无线网络。

