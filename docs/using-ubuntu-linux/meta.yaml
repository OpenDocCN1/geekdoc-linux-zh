    OpenOffice.org Calc has numerous analysis, charting and decision-making features
    with over 300 functions for statistical, financial and mathematical operations.
    Calc also includes a Scenario Manager allowing "what if" analysis, and enables
    the generation of 2-D and 3-D charts which can be integrated into other OpenOffice.org
    documents. Like the other applications, Calc will open and use Microsoft Excel
    workbooks or export spreadsheets to Adobe''s Acrobat (.pdf) or the Internet''s
    Hyper Text Markup (.html) standards. The application can be launched from the
    “OpenOffice.org Spreadsheet” shortcut on the “Office” submenu and can be seen
