    This application is a simple and easy to use application for editing text-based
    files or scripts, as shown in Figure 5-8.'
  merge: -1
  pgno: 115
- img_proc: true
  md: '# Accessories


    However, behind its ease of use the application has many sophisticated features
    such as full support for international text, highlighting of syntax in text files
    and scripts (such as HTML, C, C++, Java, Perl, XML, etc), file reverting, editing
    of remote files and support for “plug ins” to add additional functionality. These
    advanced features are in addition to standard text editing features such as undo,
    redo, cut, copy, paste, spell checking, search, word wrap and line numbering.


    Files can be created or opened from the options on the “File” menu, however the
    text editor also supports “dragging and dropping” of files into the editor windcw
    to open files.


    In order to configure syntax colouring when editing certain files or scripts,
