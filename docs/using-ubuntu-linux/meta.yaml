    首次将CD转换为音频文件前，请从“编辑”菜单中选择“偏好设置”选项，设定新文件的存储目录以及要生成的文件格式。音乐榨汁机支持多种格式，例如FLAC、OGG、MP3、AAC和WAV。选择格式前，请确保所选格式与您希望使用的便携式音乐播放器兼容。一般来说，MP3格式使用广泛，但与FLAC等格式相比，其音质较低但文件体积更小。选定目录和要使用的文件类型后，点击“提取”按钮。新文件将按照“艺术家名称”为主目录、“专辑名称”为子目录的目录结构创建。


    ### 录音机

    录音机应用程序是一款实用工具，如果您的电脑连接了麦克风，即可使用它录制音频文件，如图9-9所示。从下拉列表中选择音频格式，然后点击“录制”按钮开始录音，点击“停止”按钮完成录音。之后点击“保存”按钮即可保存新录制的音频文件。

    图9-9 录音机


    ## 总结

    随着网络连接速度越来越快，音视频文件越来越受欢迎，任何人都可以通过“播客”开始播送内容。正如我们所见，乌班图拥有多种工具，既可以播放本地媒体文件（例如家庭录像或音乐），也可以流式传输媒体（例如网络电台或视频片段），还可以自动为您下载播客等文件。您现在已经了解了乌班图默认预装的主要应用程序，但通过“添加/删除应用程序”工具还有更多应用可供您探索。其中部分应用提供了与我们已知功能不同的工具，也有大量应用可实现您可能觉得有用的小众功能。只需使用之前提到的用于安装“编解码器”的搜索功能，即可查找您可能用得上的应用程序。


    ## 第4部分 故障排除

