    - 语言：英语

    - 键盘布局：英国

    - 名称：jon

    - 登录名：jon

    - 位置：欧洲/伦敦

    - 迁移助手：如果你继续，下面列出的更改将被写入磁盘。否则，你可以手动进行更多修改。

    > 警告：此操作将删除所有你移除的分区以及即将被格式化的分区中的所有数据。以下设备的分区表将被修改：SCSI1 (0,0,0) (sda) 以下分区将被格式化：

    - SCSI1 (0,0,0) (sda)的第1分区，格式为ext3

