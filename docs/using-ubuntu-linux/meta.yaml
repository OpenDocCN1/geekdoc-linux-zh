    # Impress


    OpenOffice.org Impress is the presentation application of the suite, and provides
    a multimedia tool enabling presentations to be created with animation, effects,
    sounds and video. It is launched from the “OpenOffice.org Presentation” short
    cut.


    ![](img/93a96bd5075527285b151804f3a5c28f_140_0.png)


    > Figure 7-5 OpenOffice.org Impress'
  merge: -1
  pgno: 140
- img_proc: true
  md: 'The Impress interface is very similar to other slide show based presentation
    software, as shown in Figure 7-5, and is very easy to get started. It defaults
    to saving files in the native OpenOffice.org file formats as shown below in Table
    7-3:


    | Type | Format Extension |

    |-------|------------------|

    | Presentation | .odp |

    | Presentation Template | .otp |


