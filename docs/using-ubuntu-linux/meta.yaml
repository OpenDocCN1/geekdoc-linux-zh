    GNOME, but it''s also possible to install the KDE desktop environment (as installed
    with Kubuntu) and select to login to this desktop rather than GNOME using the
    "Sessions" option on the "Options" menu.


    To login to the system, enter the username that you chose during the installation
    into the username box and press return. The login box will now change to a password
    box; enter the password and press return to login.


    ### Figure 3-3 The Ubuntu Desktop

    ![](img/93a96bd5075527285b151804f3a5c28f_56_0.png)


    The desktop in Ubuntu is called GNOME, a popular UNIX and Linux desktop environment.
    It is based around a menu bar or "top edge panel" along the top of the screen,
    and a taskbar or "bottom edge panel" along the bottom, as you can see in Figure
    3-3.


    The menu bar has three menus on the left-hand side:

    - Applications

    - Places

    - System.


    ### The Applications Menu

    The Applications menu lists all the GNOME based applications within sub menus,
    as shown in Figure 3-4. ![](img/93a96bd5075527285b151804f3a5c28f_57_0.png)


    ### Figure 3-4 Applications Menu

    These sub menus include utilities, games, office applications, multimedia applications
    and image editing applications. The applications are described in detail in the
    chapters that follow, and the sub menus are:

    - Accessories – Useful utilities and tools

    - Games – Fun games to use some spare time

    - Graphics – Image editing applications

    - Internet – Internet and communication applications

    - Office – The OpenOffice application suite

    - Sound & Vision – Multimedia applications

    - Add/Remove – The application package management utility.


    ### The Places Menu

    The Places menu lists options that enable you to navigate your documents, connect
    to other systems or load CD or DVD discs, as shown in Figure 3-5. ![](img/93a96bd5075527285b151804f3a5c28f_59_0.png)


    ### Figure 3-5 The Places menu

    This menu includes the following applications and short cuts and also includes
    a sub menu with short cuts to the most recently used documents:

    - Home Folder – A short cut to open a file browser in your main folder used for
    storing files

    - Desktop – A short cut to open a file browser showing the desktop

    - Computer – A short cut to open a file browser showing the removable and hard
    disc drives

    - CD/DVD Creator – Utility for creating CD or DVD discs

    - Network – A short cut to open a file browser showing your network

    - Connect to server – Allows you to make network connections to servers for file
    transfers

    - Search for files – A utility for finding files

    - Recent documents – A sub-menu with short cuts to your most recently used documents.


    ### The System Menu

    Finally, the System menu includes sub-menus for tools for configuring your system,
    short cuts for on-line help and to shut down the system, as shown in Figure 3-6.
    ![](img/93a96bd5075527285b151804f3a5c28f_61_0.png)


    ### Figure 3-6 The System menu

    It contains the following:

    - Preferences – A collection of tools for customising your system

    - Administration – A collection of administration utilities

    - Help and support – The on-line Ubuntu Help Centre

    - About GNOME – Information about the GNOME desktop

    - About Ubuntu – Information about the Ubuntu Operating System

    - Quit… – To logoff, switch users, lock the screen or power down the computer.


    The Preferences sub-menu contains utilities for customising your system and its
    desktop. These contain tools for modifying settings for items like the mouse and
    keyboard, enabling a screen saver or customising your desktop background and colours.
    The administration sub-menu lists utilities for maintaining your system, such
    as configuring the language, creating new user accounts and configuring system
    updates.


    ### Menu Bar Icons

    Next to the System Menu, there are three icons (also shown in Figure 3-6). These
    icons are:

    - Firefox – An icon to start the "Firefox" web browser

    - Evolution – An icon to start the "Evolution" email and calendar application

    - Help – An icon for the on-line Ubuntu Help Centre.


    ### Notification Area

    On the far right-hand side of the top panel, is an area called the "Notification
    Area". This area shows icons for applications or utilities that might require
    attention, as shown in Figure 3-7. ![](img/93a96bd5075527285b151804f3a5c28f_63_0.png)


    ### Figure 3-7 Notification Area

    For instance, when Ubuntu detects that there are new security updates to install,
    an icon will appear in this area to inform you. Clicking on this icon will then
    launch the Update Manager.


    This area will normally display:

    - Network Manager – an Icon to launch the Network Manager Applet used to configure
    the network card

    - Sound – A short cut to quickly adjust the volume

    - Date and Time – The date and time

    - Shutdown – An icon to allow you to shut down, reboot or logoff the computer.


    Clicking on the items in the notification area may bring up a menu or an option
    list. For example, left-clicking on the Network Manager icon will display a sub
    menu to allow you to enable/disable the network card, or to launch the Network
    Manager applet to manually configure the network card, or to connect to a wireless
    network. While clicking on the sound icon allows you to adjust the volume. Try
    clicking on the icons to investigate what options are available.


    ### Editing the Menu Bar

    It is possible to edit the menu bar by adding or removing items as required. To
    remove an item, simply "right-click" the mouse while the cursor is over an icon
    or menu. This will display a menu to allow you to change the properties of a menu
    or icon, or to remove the item completely.


    > Ensure that you really want to delete an item!


    If you right-click on a blank section of the menu, a window will be displayed
    allowing you to add additional items to the bar, or add items back if you have
    deleted them by mistake. These items include adding your own menus, or utilities
    to display the weather or stock quotes. Try adding some items, then right-click
    the item to set any options.


    ### Bottom Panel

    The panel along the bottom of the screen includes an icon on the far left-hand
    side to maximise hidden windows. On the right-hand side it includes an icon which
    allows you to switch between “workspaces”. A workspace is a separate desktop view
    which allows you to have different windows open and quickly switch between them
    by clicking on each of the workspace icons. On the far left side is a “wastebasket”
    icon. This will open a file browser showing the deleted items. When you select
    a file or folder and press the delete key, or select the “Move to delete items
    folder” option from a menu, the item is not permanently deleted but is simply
    moved to the delete items folder. To really delete items, right-click the “wastebasket”
    icon and select “Empty the wastebasket” from the menu. The bottom panel will also
    display a list of the windows that are open at any time. When a window is minimised
    it can be restored by clicking on the window title in the bottom panel. ![](img/93a96bd5075527285b151804f3a5c28f_65_0.png)


    ### Managing Files

    Ubuntu uses the “File Browser” (sometimes called Nautilus) for you to organise
    and find directories and files, as shown in Figure 3-9. The File Browser can be
    launched from the “Home Folder” short cut on the “Places” menu. This will open
    the File Browser focused on your “Home” directory, this is your personal directory
    used to securely store all your files. The directory is located in the “/Home”
    directory and is named the same as your user name. If there are multiple users
    on the same Ubuntu computer, each user will have their own dedicated home directory
    that only they have permission to access.'
