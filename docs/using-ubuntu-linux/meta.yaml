    ## Summary

    You should now be able to send and receive emails, browse the Internet, and as
    long as you know other people with Instant Messaging or VOIP accounts, you can
    send text, voice or video messages in real time. Even though Ubuntu is a free
    operating system, we have found that it includes all the functionality of other
    expensive operating systems. In fact, due to the open source nature of the GNU/Linux
    platform, the applications available offer a greater level of flexibility than
    some commercial applications by supporting multiple accounts to different services,
    such as being able to communicate with users on different Instant Messaging services
    using a single application like Gaim.


    ## 9 Sound and Video

    Ubuntu is a fully-featured multi-media operating system, and as such it comes
    complete with tools to watch videos, play music and convert CDs to digital audio
    files. In this chapter we try out the applications in the "Sound & Video" sub-menu
    of the "Applications" menu.


    ### Totem

    Totem (http://www.gnome.org/projects/totem) is the standard open source movie
    player for the GNOME desktop environment and is launched from the "Movie Player"
    shortcut in the "Sounds & Video" sub-menu. It features a play list, video thumbnailer
    for file management, a full-screen mode, seek and volume controls, keyboard navigation
    and DVD (without encryption) playback.


    ![](img/93a96bd5075527285b151804f3a5c28f_185_0.png)


    > Figure 9-1 Totem

    Using Totem is easy and it can play a variety of file types by simply double-clicking
    the file. You can try this now by navigating to the "Examples" folder in your
    home directory and double-clicking the "Experience ubuntu.ogg" file, as shown
    in Figure 9-1. Alternatively, you can open a video or music file from within Totem
    using the standard "Open" command on the "Movie" menu. It''s also possible to
    use Totem to play "streaming" video, this is video that is streamed from a web
    server. You can play streaming video by selecting "Open location..." from the
    "Movie" menu and entering the full address to the video stream.


    The Totem window is split into several areas. The display area is used to show
    the video or a visualisation while an audio file is playing. The sidebar on the
    left-hand side is used to display the properties of the playing file or to display
    a play list. Along the bottom of the Totem window are the player seek controls,
    volume and time bar. Totem, and other video player applications, use software
    called "codecs" to play different digital video files and streaming media types.


    > A codec (meaning compression-decompression or coder-decoder) is a small piece
    of software for encoding and decoding a digital file or stream.


    Totem comes with many codecs pre-installed, but from time to time you may encounter
    a file type that Totem does not support as it requires a copyrighted codec that
    is not installed. If you try to open a file or DVD or CD disc which Totem does
    not have the codec for, it may automatically start the "Add/Remove Applications"
    utility and prompt you to install a particular codec if it recognises which one
    is missing, as shown in Figure 9-2. Alternatively, it may just prompt you to install
    the codec. In which case, open the "Add/Remove Applications" utility and simply
    type "codec" into the search field. This will list the available codecs and list
    the file types that they support. Totem can support any of the "Gstreamer" or
    "Xine" type codecs.


    ![](img/93a96bd5075527285b151804f3a5c28f_187_0.png)


    > Figure 9-2 Add/Remove Applications

    It''s also recommended that you change the network connection option under the
    Totem preferences, as shown in Figure 9-3. This allows Totem to optimise its settings
    for your type of Internet connection, and can be achieved by selecting "Preferences"
    from the "Edit" menu. On the "General" tab of the "Preferences" window select
    the connection type that corresponds with your Internet connection.


    ![](img/93a96bd5075527285b151804f3a5c28f_188_0.png)


    > Figure 9-3 Preferences


    ### Rhythmbox Music Player

    The Rhythmbox application (http://www.gnome.org/projects/rhythmbox) is used to
    play audio CDs and manage and play music files, podcasts and Internet based radio
    stations, as shown in Figure 9-4. It is launched from the "Rhythmbox Music Player"
    shortcut in the "Sound & Video" sub-menu.


    ![](img/93a96bd5075527285b151804f3a5c28f_189_0.png)


    > Figure 9-4 Rhythmbox

    The first time Rhythmbox is started, an assistant is run to help you configure
    the application. It''s recommended that you have a "Music" and "Podcasts" directory
    in your home directory before running the assistant. On the first screen, click
    "Forward". You will then be prompted for the directory containing any existing
    music files you have and to use if you create new audio files from a CD, as shown
    in Figure 9-5. Either browse to the location or type the path into the box, and
    click "Forward".


    ![](img/93a96bd5075527285b151804f3a5c28f_190_0.png)


    > Figure 9-5 Rhythmbox Assistant

    On the final assistant screen, click "Apply" to save the settings and the application
    will open. The Rhythmbox window is split into several different areas. Along the
    top of the window are the menu and tool bar which provides access to the player
    functions such as play, pause and stop. The window itself is split into a source
    list pane on the left-hand side that shows the different types of sources such
    as music, Internet radio, podcasts and play lists, and also a graphic showing
    album artwork. The rest of the window is a browser allowing you to browse the
    different types of media. Finally, along the bottom of the window is a status
    bar showing information relating to the current selected or playing source.


    If you have an existing music collection in digital file format, you will need
    to import it into Rhythmbox before it will be displayed. Simply select “Import
    Folder” from the “Music” menu and Rhythmbox will use the files and display them
    in the source list. Playing music is easy by selecting an individual file, album
    or artist and clicking play. When Rhythmbox plays an album for the first time,
    it will automatically try to download the album artwork for you and display it
    in a window under the source list. As well as music files, Rhythmbox will also
    download podcasts and play Internet radio.


    Adding a new Radio station can be completed by clicking the “Radio” source and
    then choosing “New Internet Radio Station” from the “Music” menu. Then type the
    address or “URL” of the Internet radio station into the text box and click OK.
    The new Radio will then be listed in the source list and can be played by selecting
    it and clicking the “play” button. Similarly, podcasts can be added in the same
    way by choosing “New Podcast Feed” from the “Music” menu and then entering the
    URL into the text box. Each new episode of the podcast will be automatically downloaded
    when it''s detected by Rhythmbox.'
  mdcn: "\n## 好友列表\n+ 好友、账户、工具、帮助\n+ 好友\n  - 安迪 — 离线\n  - 罗布 在线\n> 图 8-19 好友列表\n\n\
    当你把一些好友添加到好友列表后，他们的在线状态就会显示出来，如图8-19所示。这样你就能知道谁有空可以交谈。你可以更改自己的状态，这样在你忙碌时就不会被打扰，只需点击好友列表窗口底部弹出菜单即可操作。要联系在线的用户，只需双击他们的名字，然后在对话窗口中输入内容即可，如图8-20所示。\n\
    \n![](img/93a96bd5075527285b151804f3a5c28f_181_0.png)\n\n> 图 8-20 对话窗口\n\n只有Gaim应用程序运行时，别人才能够联系到你，因此你可以关闭Gaim的窗口而无需真正退出应用程序。Gaim处于这种状态时，会在顶部面板的通知区域添加一个图标。要真正关闭应用程序，只需右键点击该图标，然后从下拉菜单中选择“退出”即可。\n\
    \n### 互联网\n\n当你把一些好友添加到好友列表后，他们的在线状态就会显示出来，如图8-19所示。这样你就能知道谁有空可以交谈。你可以更改自己的状态，这样在你忙碌时就不会被打扰，只需点击好友列表窗口底部弹出菜单即可操作。要联系在线的用户，只需双击他们的名字，然后在对话窗口中输入内容即可，如图8-20所示。\n\
    \n![](img/93a96bd5075527285b151804f3a5c28f_181_0.png)\n\n> 图 8-20 对话窗口\n\n只有Gaim应用程序运行时，别人才能够联系到你，因此你可以关闭Gaim的窗口而无需真正退出应用程序。Gaim处于这种状态时，会在顶部面板的通知区域添加一个图标。要真正关闭应用程序，只需右键点击该图标，然后从下拉菜单中选择“退出”即可。\n\
    \n## 总结\n\n现在你应该已经能够收发电子邮件、浏览互联网，只要你认识拥有即时通讯或网络电话（VOIP）账户的人，你就可以实时发送文本、语音或视频消息。尽管Ubuntu是一款免费操作系统，我们发现它具备其他收费操作系统的全部功能。事实上，由于GNU/Linux平台的开源特性，可用的应用程序比部分商业应用具备更高的灵活性，它支持为不同服务配置多个账户，例如可以通过Gaim这样一个单一应用，和不同即时通讯服务的用户进行交流。\n\
    \n## 9 声音和视频\n\nUbuntu是一款功能齐全的多媒体操作系统，因此它自带了观看视频、播放音乐以及将CD转换为数字音频文件的相关工具。本章我们将试用“应用程序”菜单下“声音和视频”子菜单中的应用。\n\
    \n### Totem\n\nTotem（http://www.gnome.org/projects/totem）是GNOME桌面环境下的标准开源电影播放器，可以通过“声音和视频”子菜单中的“电影播放器”快捷方式启动。它支持播放列表、用于文件管理的视频缩略图生成、全屏模式、进度和音量控制、键盘导航以及无加密DVD播放。\n\
    \n![](img/93a96bd5075527285b151804f3a5c28f_185_0.png)\n\n> 图 9-1 Totem 播放器界面\n\
    \nTotem的使用很简单，只需双击文件即可播放多种类型的文件。你现在就可以尝试：进入主目录下的“Examples”文件夹，双击“Experience ubuntu.ogg”文件即可，操作示例如图9-1所示。你也可以通过Totem“电影”菜单中的标准“打开”命令，在Totem内打开视频或音乐文件。你还可以用Totem播放“流式”视频，这类视频是从网络服务器传输过来的。要播放流式视频，只需在“电影”菜单中选择“打开位置...”，然后输入视频流的完整地址即可。\n\
    \nTotem的窗口分为多个区域。显示区域用于展示视频内容，或在播放音频文件时展示可视化效果。左侧的侧边栏用于展示正在播放文件的属性，或显示播放列表。Totem窗口底部是播放进度控制、音量调节和时间进度条。\n\
    \nTotem以及其他视频播放器应用，会使用名为“编解码器”的软件来播放不同的数字视频文件和流媒体类型。\n\n> 编解码器（意为压缩-解压缩或编码-解码）是一类用于对数字文件或数据流进行编码和解编码的小型软件。\n\
    \nTotem预装了很多编解码器，但偶尔你可能会遇到Totem不支持的文件类型，因为这类文件需要用到未安装的、受版权保护的编解码器。如果你尝试打开Totem缺乏对应编解码器的文件、DVD或CD光盘，一旦Totem识别出缺失的编解码器，它可能会自动启动“添加/删除应用程序”工具，提示你安装特定的编解码器，如图9-2所示。另一种情况是，它可能只是提示你安装对应的编解码器。这种情况下，你可以打开“添加/删除应用程序”工具，在搜索框中输入“编解码器”即可。该操作会列出所有可用的编解码器，以及它们所支持的文件类型。Totem支持所有“Gstreamer”或“Xine”类型的编解码器。\n\
    \n![](img/93a96bd5075527285b151804f3a5c28f_187_0.png)\n\n> 图 9-2 “添加/删除应用程序”工具\n\
    \n我们也建议你修改Totem偏好设置中的网络连接选项，如图9-3所示。该操作可以让Totem针对你的网络连接类型优化设置，具体方法为：在“编辑”菜单中选择“偏好设置”。在“偏好设置”窗口的“通用”选项卡中，选择与你互联网连接类型对应的选项。\n\
    \n![](img/93a96bd5075527285b151804f3a5c28f_188_0.png)\n\n> 图 9-3 偏好设置界面\n\n###\
    \ Rhythmbox 音乐播放器\n\nRhythmbox应用（http://www.gnome.org/projects/rhythmbox）可用于播放音频CD，管理并播放音乐文件、播客以及网络电台，如图9-4所示。你可以通过“声音和视频”子菜单中的“Rhythmbox音乐播放器”快捷方式启动它。\n\
    \n![](img/93a96bd5075527285b151804f3a5c28f_189_0.png)\n\n> 图 9-4 Rhythmbox 播放器界面\n\
    \n第一次启动Rhythmbox时，会运行一个配置助手来帮你完成应用设置。建议你在运行配置助手前，先在主目录下创建“Music”（音乐）和“Podcasts”（播客）两个文件夹。在配置助手的第一页，点击“下一步”。接下来会提示你指定目录，用于存放已有的音乐文件，以及从CD提取的新音频文件，如图9-5所示。你可以浏览到对应位置，也可以在输入框中输入路径，之后点击“下一步”。\n\
    \n![](img/93a96bd5075527285b151804f3a5c28f_190_0.png)\n\n> 图 9-5 Rhythmbox 配置助手\n\
    \n在配置助手的最后一页，点击“应用”保存设置，之后应用就会打开。Rhythmbox的窗口分为几个不同的区域。窗口顶部是菜单和工具栏，提供了播放、暂停、停止等播放器功能的入口。窗口主体左侧是源列表面板，展示不同类型的音源，比如音乐、网络电台、播客和播放列表，同时还会显示专辑封面。窗口剩余部分是媒体浏览器，你可以用它浏览不同类型的媒体。最后，窗口底部是状态栏，会显示当前选中或正在播放的音源的相关信息。\n\
    \n如果你已有数字格式的音乐收藏，需要先将其导入Rhythmbox，之后才会在应用中显示。只需在“音乐”菜单中选择“导入文件夹”，Rhythmbox就会加载这些文件，并在源列表中展示它们。\n\
    \n播放音乐很简单，选择单个文件、专辑或艺人，然后点击播放按钮即可。当Rhythmbox第一次播放某张专辑时，会自动尝试下载对应的专辑封面，并展示在源列表下方的窗口中。除了音乐文件，Rhythmbox还可以自动下载播客、播放网络电台。\n\
    \n添加新电台的操作如下：点击“电台”音源，然后在“音乐”菜单中选择“新建网络电台”。之后在文本框中输入网络电台的地址或“URL”，点击“确定”即可。新的电台就会出现在源列表中，选中它并点击播放按钮即可收听。\n\
    \n添加播客的方式类似：在“音乐”菜单中选择“新建播客订阅源”，然后在文本框中输入对应的URL即可。Rhythmbox检测到播客有新单集更新时，会自动下载新内容。\n"
