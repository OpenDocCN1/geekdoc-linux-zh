  md: '![](img/93a96bd5075527285b151804f3a5c28f_169_0.png)


    # Welcome to Ubuntu 7.04, Feisty Fawn!


    The Ubuntu project is built on the ideas enshrined in the Ubuntu philosophy: that
    software should be available free of charge, that software tools should be usable
    by people in their local language, and that people should have the freedom to
    customize and alter their software in whatever way they need.


    # Getting Help with Ubuntu:


    There are many ways to get help with Ubuntu.


    Access Ubuntu''s guides and documentation by selecting "Help" from your System
    menu. You can also find help from the official Ubuntu documentation website and
    the community contributed documentation.


    If you prefer some human contact, you can use the mailing lists, web forums, or
    chat with the community on Freende IRC Channel: #ubuntu.


    # Figure 8-12 Firefox


    Firefox uses a "tabbed" interface that allows you to either open a single web
    page per window, or to open a new page into a "tab" which will be shown along
    the top of the browser window under the address bar, and can be seen in Figure
    8-12. This allows you to open multiple web pages without littering your desktop
    with multiple windows.


    It also has the concept of "Live Bookmarks", these are displayed under the address
    bar but above the tabs. This feature allows you to "bookmark" automatically updating
    RSS'
  merge: -1
