    very similar, with topics shown in the right-hand pane and the index in the left-hand.
    The tool bar will also include the same search, forward, back and home buttons.
    Some applications will also include links on the "Help" menu to their Internet
    sites for more extensive documentation or help forums. For instance the OpenOffice.org
    Writer application includes a "Support" option on the "Help" menu which will launch
    Firefox and display the Ubuntu help site for OpenOffice.org.


    ## Internet Based Documentation


    If the on-line help does not answer your query, the Ubuntu community includes
    extensive Internet based documentation, forums or tutorials.


    ### Ubuntu Documentation


    The official Ubuntu site includes an Internet based version of the Ubuntu Help
    Centre (https://help.ubuntu.com), which includes the same help and documentation
    as included within the Ubuntu system.


    ### Ubuntu Community Documentation


    Ubuntu community users and developers have extended the official documentation
    on the Ubuntu User Documentation site (https://help.ubuntu.com/community). This
    site should be your second help resource if you cannot find the answer to your
    question in the official documentation. An example of this site can be seen in
    Figure 10-3.


    ![](img/93a96bd5075527285b151804f3a5c28f_207_0.png)


    *Figure 10-3 Ubuntu User Community Documentation*


    As well as providing help for installing, configuring and using Ubuntu, this site
    also lists other applications that can be installed, as well as the installation
    instructions.


    ## GNOME Documentation


    As we have already discovered, many of the applications and the GNOME desktop
    environment are common between different versions of the GNU/Linux operating systems.
    You can therefore find additional help resources at the web sites for each of
    the Open Source applications. For instance, the GNOME desktop environment includes
    extensive documentation at the GNOME website (http://www.gnome.org/support). This
    includes documentation and forums for the GNOME workspace, file manager, applications
    and system administration and an example can be seen in Figure 10-4.


    ![](img/93a96bd5075527285b151804f3a5c28f_209_0.png)


    **Figure 10-4 GNOME Support**


    ### Application Documentation


    Finally, specific applications within Ubuntu will also provide additional documentation
    on their own websites, such as the OpenOffice.org suite, Firefox or GIMP. A complete
    list of web sites for the installed applications are listed in the chapters discussing
    each of the applications.


    ## Help Forums


    If after reading all the on-line help and documentation you still have problems,
    the Ubuntu community can help with Internet-based forums specialising in Ubuntu,
    GNOME and Linux.


    ### Ubuntu Forums


    The official Ubuntu forums are available in many languages from the main Ubuntu
    site (http://www.ubuntu.com/support/community/webforums). However, the English
    language forum can be found at http://ubuntuforums.org. The forums are now run
    and maintained by Canonical Ltd, and allow users to post messages and receive
    free help from fellow users, developers and experts.


    ### Commercial Help


    There are many organisations that provide commercial support for open source software,
    and Canonical Ltd provides paid-for support for Ubuntu desktop, server and thin
    client systems. This support can be either working hours or complete 24 hour support
    which includes email and phone support, and is ideal for large deployments and
    installation advice. More information is available from the Ubuntu website (http://www.ubuntu.com/support/paid).


    ## Summary


    In this chapter you have seen that Ubuntu has numerous sources of help. From the
    on-line help within the operating system, to the application specific help, Internet
    based community documentation and finally the Ubuntu forums where you can post
    problems for Ubuntu users and experts to resolve.


