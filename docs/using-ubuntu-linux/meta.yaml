  md: '# Sound and Video


    split into a source list pane on the left-hand side that shows the different types
    of sources such as music, Internet radio, podcasts and play lists, and also a
    graphic showing album artwork. The rest of the window is a browser allowing you
    to browse the different types of media. Finally, along the bottom of the window
    is a status bar showing information relating to the current selected or playing
    source.


    If you have an existing music collection in digital file format, you will need
    to import it into Rhythmbox before it will be displayed, simply select “Import
    Folder” from the “Music” menu and Rhythmbox will use the files and display them
    in the source list. Playing music is easy by selecting an individual file, album
    or artist and clicking play. When Rhythmbox plays an album for the first time,
    it will automatically try to download the album artwork for you and display it
    in a window under the source list.


    As well as music files, Rhythmbox will also download podcasts and play Internet
    radio. Adding a new Radio station can be completed by clicking the “Radio” source
    and then choosing “New Internet Radio Station” from the “Music” menu. Then type
    the address or “URL” of the Internet radio station into the text box and click
    OK. The new Radio will then be listed in the source list and can be played by
    selecting it and clicking the “play” button. Similarly, podcasts can be added
    in the same way by choosing the “New Podcast Feed” from the “Music” menu and then
    entering the URL into the text box. Each new episode of the podcast will be automatically
    downloaded when its detected by Rhythmbox'
  merge: -1
