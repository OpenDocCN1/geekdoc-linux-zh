    ## 使用 Ubuntu Linux

    # 第一部分

    ## Ubuntu Linux 简介

    ## 1 引言

    为帮助读者了解 Ubuntu 操作系统的背景，有必要简要介绍 UNIX 和 GNU/Linux 操作系统的发展历史。本章希望为读者提供一些背景知识，阐释 Ubuntu
    如何从其 UNIX 前辈和 GNU/Linux 同类系统中演化而来，同时还将说明 Ubuntu 背后的理念，介绍当今最友好的 GNU/Linux 操作系统的众多衍生版本。

    ## 简史

    ### UNIX

    UNIX 操作系统最初于 20 世纪 60 年代末诞生于 AT&T 贝尔实验室开展的 Multics 项目研究。该项目全称为“多路信息与计算服务（Multiplexed
    Information and Computing Service）”，由贝尔实验室、通用电气公司和麻省理工学院联合开展，旨在为大型计算机开发一款可供多用户使用的可靠“分时”操作系统。早期尝试证明该项目过于复杂且难以成功，原项目中的一个小团队脱离出来，为小型系统重写了操作系统。该项目最初命名为
    UNICS（Uniplexed Information and Computing Service 的缩写），后来这个名字逐渐演变为 UNIX。

    20 世纪 70 年代初，UNIX 操作系统开始在 AT&T 内部使用，并以附带操作系统源代码的许可形式向大学、美国政府机构及部分商业组织开放。到 20 世纪
    70 年代末，该系统已广泛作为学术工具使用，而毕业生们进入商业组织后仍希望继续使用 UNIX 操作系统，这推动了一批公司（如 Sun Microsystems、圣克鲁兹操作公司（SCO））的成立，并在
    AT&T 的许可下开发各自的 UNIX 版本。如今，全球许多大型计算机系统都运行着 Sun Microsystems、惠普、IBM 等公司推出的成熟、可靠且安全的
    UNIX 操作系统。

    ## GNU 项目与 Linux

    1983 年，理查德·斯托曼（Richard Stallman）发起了 GNU 项目（http://www.gnu.org），旨在开发一款类 UNIX 的免费操作系统。斯托曼曾在麻省理工学院人工智能实验室担任开发人员，同时也是
    EMACS 编辑器的发明者。该项目命名为 GNU（发音为“哥奴”），是一个递归缩写，全称为“GNU''s Not UNIX（GNU 不是 UNIX）”。他一直笃信所有软件都应当是免费的，这一信念形成于
    20 世纪 70 年代他在麻省理工学院的求学时期，当时学术界可用的软件有限，均以自由开发、自由分发的方式运作。到 20 世纪 80 年代，随着 UNIX 操作系统的商业化，GNU
    项目应运而生，旨在提供一套可自由分发的操作系统和应用程序套件。

    1985 年，自由软件基金会（http://www.fsf.org）成立，主要目的是筹集资金支持 GNU 项目的开发。1991 年，GNU 系统的开发仍在进行中，尚未正式发布。此时，林纳斯·托瓦兹（Linus
    Torvalds）已经开发出一款兼容 UNIX 的内核（即操作系统的核心部分），并将其命名为 Linux。1992 年，该内核与 GNU 系统结合，形成了
    GNU/Linux 系统，这便是如今众多“Linux”（更准确地说应称为 GNU/Linux）操作系统的前身。

    ## Ubuntu

    Ubuntu 操作系统的名称源自一个非洲词汇（发音为“乌班图”），大意是“仁者爱人”或“我因我们而存在”。Ubuntu 操作系统旨在将这一理念带入软件世界。简单来说，其核心宗旨就是“为人类打造的
    Linux”。

    该操作系统由南非互联网企业家马克·沙特尔沃思（Mark Shuttleworth）于 2004 年 4 月发起，他组建了一支小型开源开发团队，目标是发布一款对所有人都友好且免费的操作系统。引用
    Ubuntu 社区（http://www.ubuntu.com/community/ubuntu-history/philosophy）的介绍，该操作系统基于以下理念或信念：

    - 每位计算机用户都应享有自由，可为了任何目的下载、运行、复制、分发、学习、共享、修改和改进软件，无需支付许可费用。

    - 每位计算机用户都应能够使用自己选择的语言来操作软件。

    - 每位计算机用户，即便身有残障，也应获得使用软件的所有机会。

    首个版本于 2004 年 10 月发布，版本号为 4.10。该系统是基于现有名为 Debian（http://www.debian.org）的 GNU/Linux
    发行版开发的，目标是比当时其他基于 GNU/Linux 的系统更易用。Debian 由伊恩·默多克（Ian Murdock）于 1993 年发起，是众多 GNU/Linux
    版本之一，其目标是为自由 GNU 软件提供收集、打包和支持的仓库。Ubuntu 承诺每半年发布一次新版本，其命名方式也与其他软件发布略有不同：所有版本均以发布年份和月份命名，因此
    4.10 版本发布于 2004 年的第十个月。本文撰写时的当前版本为 2007 年 4 月发布的 7.04 版本。

    除了独特的版本号外，Ubuntu 操作系统每个版本还有对应的代号。由于初版 v4.10 属于早期开发版本，其代号为“多疣的疣猪（Warty Warthog）”。当前的开发版本代号为“勇敢的皂猩（Gutsy
    Gibbon）”，计划于 2007 年 10 月发布，正式名称为“Ubuntu 7.10”。

    ## Ubuntu 特色

    市面上已有红帽、Novell 等商业组织推出的众多 GNU/Linux 发行版，也有 Slackware 等免费版本，因此许多人可能会问：为什么还需要另一个
    GNU/Linux 发行版？除了“为包括发展中国家在内的所有人提供免费软件”的理念外，Ubuntu 系统的目标还是一款功能全面、用户友好的操作系统，因为许多现有的免费或商业版本虽然功能强大，但都面向技术人员设计。因此，Ubuntu
    被设计为与微软 Windows、Mac OS X 等商业操作系统一样易用，同时安装后即可直接使用，无需额外配置即可保证安全。所以该系统预装了用户最常需要的大多数应用程序，例如：

    - 一套用于文字处理、电子表格、数据库和演示文稿的应用程序

    - 用于网页浏览、电子邮件和即时通讯的网络工具

    - 用于编辑和管理图片的图形工具

    - 用于播放视频和音乐的多媒体工具

    近年来安全的重要性日益凸显，因此 Ubuntu 系统在设计时也力求在无需繁琐配置的前提下尽可能安全。为此，它仅提供工作站所需的工具和服务，并默认禁用通常不需要的功能。这并不代表系统功能匮乏，只是相关功能需要在用户主动启用时才会开启，从而保证系统尽可能安全。为进一步提升安全性，该系统支持自动检测安全更新，并在有可用更新时提示用户。当然，这一安全功能也默认开启，无需用户手动配置即可保障系统安全。

