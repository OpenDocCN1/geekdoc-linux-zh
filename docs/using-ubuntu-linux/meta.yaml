    ## Manually Checking for System Updates

    Ubuntu is configured to automatically detect when system updates are available
    and then to ask you if it is convenient for the system to download and install
    them. An icon will appear in the Notification Area when updates are available
    and a pop-up message will inform you to click on the icon to install the updates,
    as can be seen in Figure 4-8.

    ![](img/93a96bd5075527285b151804f3a5c28f_82_0.png)

    > **Figure 4-8 System Update Notification**


    After the system has been installed, and from time to time, it is recommended
    that you manually check for system updates to ensure the system is kept up to
    date and that the update configuration mechanism is functioning correctly. To
    do this, select the "Update Manager" from the "Administration" option on the "System"
    menu. Click the "Check" button to start the update. You will be asked to enter
    your password to perform an administrative function and then the system will connect
    to the Ubuntu servers and download a list of any updates that might be available.
    Any updates to install will be displayed in the Update Manager as shown in Figure
    4-9.


    It is worth spending a few moments scrolling through the list of updates if no
    other reason than so you know what is being downloaded and installed.


