  md: '# **Sound and Video**


    and stored in your "Podcast" directory. Once the file is downloaded it can be
    played just like a music file.


    # # Serpentine


    The Serpentine application (http://s1x.homelinux.net/projects/serpentine/) is
    an easy to use utility for creating audio CDs from music files. It supports multiple
    digital file formats (WAV, MP3, OGG, FLAC) as well as dragging and dropping files
    from the file manager or the Rhythmbox application. The application is launched
    from the "Serpentine" icon in the "Sound & Video" sub-menu.'
  merge: -1
  pgno: 192
- img_proc: true
  md: '![](img/93a96bd5075527285b151804f3a5c28f_193_0.png)


    # Figure 9-6 Serpentine


    When started, the easy to use interface as shown in Figure 9-6 is displayed. Simply
    drag and drop files from the Rhythmbox application or from the File Manager into
    the Serpentine window. Alternatively, either click the "Add" button on the'
  merge: -1
  pgno: 193
- img_proc: true
  md: '# Sound and Video


    tool bar and browse for music files or a play list file. Once the files are selected,
    simply click the “Write to disc” button to start to create an audio CD. Like the
    Totem application, Serpentine uses “codecs” to decode the music files and write
    them to the CD. If the correct codec is not installed, an error message will be
    produced warning you that the file types are not supported.


    ![](img/93a96bd5075527285b151804f3a5c28f_194_0.png)


    # Figure 9-7 Serpentine Unsupported file types


    Simply use the “Add/Remove Applications” utility to search for the file extension
    (such as “MP3”) and the correct codec will be displayed, tick the check box to
    select the codec and click “OK” to install it. Once the codec is installed, if
    you restart the Serpentine application it will now be able to read the file format
    and create the CD.'
  merge: -1
