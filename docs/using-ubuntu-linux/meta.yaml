    ## Glossary


    | Term | Definition |

    | --- | --- |

    | Advanced Audio Coding (AAC) | Digital audio format used for streaming audio
    and music files |

    | America Online Instant Messenger (AIM) | Instant messenger application provided
    and run by the America On-Line (AOL) Internet Service Provider |

    | American Standard Code for Information Interchange (ASCII) | Character coding
    standard based on the English language |

    | Asynchronous Digital Subscriber Line (ADSL) | Technology used for transmitting
    digital information at high speeds on existing copper phone lines |

    | Basic Input/Output System (BIOS) | Software built in to the computer motherboard
    which controls the system hardware, allowing the computer to start up and launch
    the operating system from the hard disc |

    | C | Programming language |

    | C++ | Object oriented version of the C programming language |

