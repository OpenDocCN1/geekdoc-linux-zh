    # Using Removable Media


    When you insert removable media, such as a USB memory stick or blank CD, or DVD
    disc, Ubuntu will place an icon for the media on your desktop and also on the
    "Places" menu, as shown in Figure 3-10.


    ![](img/93a96bd5075527285b151804f3a5c28f_69_0.png)


    > Figure 3-10 Blank CD-R Media


    Files and directories can easily be copied by dragging or dropping them from the
    media to your home directory, or from your home directory to the removable media.
    If copying files to a USB flash memory device, its important to right-click the
    icon of the USB memory stick on the desktop and select'
  merge: -1
  pgno: 69
- img_proc: true
  md: '''Eject'' from the menu. This will write all the information to the memory
    stick and allow you to safely remove it from the computer. If you simply remove
    it without selecting ''Eject'', the data will have not been written to the memory.


    Similarly, with blank CD or DVD discs, once you have copied files to the disc,
    you must double-click the icon of the disc and select ''Write to disc'' from the
    ''File'' menu, as shown in Figure 3-11. Again, this will write the data to disc
    and allow you to remove it from the computer. Simply removing it from the drive
    without choosing ''Write to disc'' will not copy the data.


    ![](img/93a96bd5075527285b151804f3a5c28f_70_0.png)


    # Figure 3-11 Write to Disc'
