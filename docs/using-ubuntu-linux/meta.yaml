    # ## Editing the Menu Bar


    It is possible to edit the menu bar by adding or removing items as required. To
    remove an item, simply "right-click" the mouse while the cursor is over an icon
    or menu. This will display a menu to allow you to change the properties of a menu
    or icon, or to remove the item completely.


    > > Ensure that you really want to delete an item!


    If you right-click on a blank section of the menu, a window will be displayed
    allowing you to add additional items to the bar, or add items back if you have
    deleted them by mistake. These items include adding your own menus, or utilities
    to display the weather or stock quotes. Try adding some items, then right-click
    the item to set any options.'
  merge: -1
  pgno: 64
- img_proc: true
  md: '# Discovering the Desktop


    ![](img/93a96bd5075527285b151804f3a5c28f_65_0.png)


    # Bottom Panel


    The panel along the bottom of the screen includes an icon on the far left-hand
    side to maximise hidden windows. On the right-hand side it includes an icon which
    allow you to switch between “workspaces”. A workspace is a separate desktop view
    which allows you to have different windows open and quickly switch between them
    by clicking on each of the workspace icons. On the far left side is a “wastebasket”
    icon.'
  merge: -1
  pgno: 65
- img_proc: true
  md: 'This will open a file browser showing the deleted items. When you select a
    file or folder and press the delete key, or select the “Move to delete items folder”
    option from a menu, the item is not permanently deleted but is simply moved to
    the delete items folder. To really delete items, right-click the “wastebasket”
    icon and select “Empty the wastebasket” from the menu.


    The bottom panel will also display a list of the windows that are open at any
    time. When a window is minimised it can be restored by clicking on the window
    title in the bottom panel.


    # Managing Files


    Ubuntu uses the “File Browser” (sometimes called Nautilus) for you to organise
    and find directories and files, as shown in Figure 3-9. The File Browser can be
    launched from the “Home Folder” short cut on the “Places” menu. This will open
    the File Browser focused on your “Home” directory, this is your personal directory
    used to securely store all your files. The directory is located in the “/Home”
    directory and is named the same as your user name. If there are multiple users
    on the same Ubuntu computer, each user will have their own dedicated home directory
    that only they have permission to access.'
  merge: -1
  pgno: 66
- img_proc: true
  md: '![](img/93a96bd5075527285b151804f3a5c28f_67_0.png)


