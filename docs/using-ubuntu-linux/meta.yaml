  - '[PAGE 184]


    # 9


    # Sound and Video


    Ubuntu is a fully-featured multi-media operating system, and as such it comes
    complete with tools to watch videos, play music and convert CDs to digital audio
    files. In this chapter we try out the applications in the "Sound & Video" sub-menu
    of the "Applications" menu.


    # Totem


    Totem (http://www.gnome.org/projects/totem) is the standard open source movie
    player for the GNOME desktop environment and is launched from the "Movie Player"
    shortcut in the "Sounds & Video" sub-menu. It features a play list, video thumbnailer
    for file management, a full-screen mode, seek and volume controls, keyboard navigation
    and DVD (without encryption) playback.'
  - '[PAGE 185]


    ![](img/93a96bd5075527285b151804f3a5c28f_185_0.png)


    # Figure 9-1 Totem


    Using Totem is easy and it can play a variety of file types by simply double-clicking
    the file. You can try this now by navigating to the "Examples" folder in your
    home directory and double-clicking the "Experience ubuntu.ogg" file, as shown
    in Figure 9-1. Alternatively, you can open a video or music file from within Totem
    using the standard "Open" command on the "Movie" menu. Its also possible to use
    Totem'
  - '[PAGE 186]


    to play "streaming" video, this is video that is streamed from a web server. You
    can play streaming video by selecting "Open location..." from the "Movie" menu
    and entering the full address to the video stream.


    The Totem window is split into several areas. The display area is used to show
    the video or a visualisation while an audio file is playing. The sidebar on the
    left-hand side is used to display the properties of the playing file or to display
    a play list. Along the bottom of the Totem window are the player seek controls,
    volume and time bar.


    Totem, and other video player applications, use software called "codecs" to play
    different digital video files and streaming media types.


    > A codec (meaning compression-decompression or coder-decoder) is a small piece
    of software for encoding and decoding a digital file or stream.


    Totem comes with many codecs pre-installed, but from time to time you may encounter
    a file type that Totem does not support as it requires a copyrighted codec that
    is not installed.


    If you try to open a file or DVD or CD disc which Totem does not have the codec
    for, it may automatically start the "Add/Remove Applications" utility and prompt
    you to install a particular codec if it recognises which one is missing, as shown
    in Figure 9-2. Alternatively, it may just prompt you to install the codec. In
    which case, open the "Add/Remove Applications" utility and simply type "codec"
    into the search'
  - '[PAGE 187]


    field. This will list the available codecs and list the file types that they support,
    Totem can support any of the "Gstreamer" or "Xine" type codecs.


    ![](img/93a96bd5075527285b151804f3a5c28f_187_0.png)


    # Figure 9-2 Add/Remove Applications


    Its also recommended that you change the network connection option under the Totem
    preferences, as shown in Figure 9-3. This allows Totem to optimise its settings
    for your type of'
  - '[PAGE 188]


    Internet connection, and can be achieved by selecting "Preferences" from the "Edit"
    menu. On the "General" tab of the "Preferences" window select the connection type
    that corresponds with your Internet connection.


    ![](img/93a96bd5075527285b151804f3a5c28f_188_0.png)


    # Figure 9-3 Preferences'
  - '[PAGE 189]


    # Rhythmbox Music Player


    The Rhythmbox application (http://www.gnome.org/projects/rhythmbox) is used to
    play audio CDs and manage and play music files, podcasts and Internet based radio
    stations, as shown in Figure 9-4. It is launched from the "Rhythmbox Music Player"
    short cut in the "Sound & Video" sub-menu.


    ![](img/93a96bd5075527285b151804f3a5c28f_189_0.png)


    > Figure 9-4 Rhythmbox


    The first time Rhythmbox is started, an assistant is run to help you configure
    the application, its recommended that you have a "Music" and "Podcasts" directory
    in your home directory'
  - '[PAGE 190]


    before running the assistant. On the first screen, click "Forward". You will then
    be prompted for the directory containing any existing music files you have and
    to use if you create new audio files from a CD, as shown in Figure 9-5. Either
    browse to the location or type the path into the box, and click "Forward".


    ![](img/93a96bd5075527285b151804f3a5c28f_190_0.png)


    # Figure 9-5 Rhythmbox Assistant


    On the final assistant screen, click "Apply" to save the settings and the application
    will open. The Rhythmbox window is split into several different areas. Along the
    top of the window are the menu and tool bar which provides access to the player
    functions such as play, pause and stop. The window itself is'
  - '[PAGE 191]


    # Sound and Video


    split into a source list pane on the left-hand side that shows the different types
    of sources such as music, Internet radio, podcasts and play lists, and also a
    graphic showing album artwork. The rest of the window is a browser allowing you
    to browse the different types of media. Finally, along the bottom of the window
    is a status bar showing information relating to the current selected or playing
    source.


    If you have an existing music collection in digital file format, you will need
    to import it into Rhythmbox before it will be displayed, simply select “Import
    Folder” from the “Music” menu and Rhythmbox will use the files and display them
    in the source list. Playing music is easy by selecting an individual file, album
    or artist and clicking play. When Rhythmbox plays an album for the first time,
    it will automatically try to download the album artwork for you and display it
    in a window under the source list.


    As well as music files, Rhythmbox will also download podcasts and play Internet
    radio. Adding a new Radio station can be completed by clicking the “Radio” source
    and then choosing “New Internet Radio Station” from the “Music” menu. Then type
    the address or “URL” of the Internet radio station into the text box and click
    OK. The new Radio will then be listed in the source list and can be played by
    selecting it and clicking the “play” button. Similarly, podcasts can be added
    in the same way by choosing the “New Podcast Feed” from the “Music” menu and then
    entering the URL into the text box. Each new episode of the podcast will be automatically
    downloaded when its detected by Rhythmbox'
- md: "## Sound and Video\nand stored in your \"Podcast\" directory. Once the file\
    \ is downloaded it can be played just like a music file.\n\n### Serpentine\nThe\
    \ Serpentine application (http://s1x.homelinux.net/projects/serpentine/) is an\
    \ easy to use utility for creating audio CDs from music files. It supports multiple\
    \ digital file formats (WAV, MP3, OGG, FLAC) as well as dragging and dropping\
    \ files from the file manager or the Rhythmbox application. The application is\
    \ launched from the \"Serpentine\" icon in the \"Sound & Video\" sub-menu.\n\n\
    Figure 9-6 Serpentine\nWhen started, the easy to use interface as shown in Figure\
    \ 9-6 is displayed. Simply drag and drop files from the Rhythmbox application\
    \ or from the File Manager into the Serpentine window. Alternatively, either click\
    \ the \"Add\" button on the tool bar and browse for music files or a play list\
    \ file. Once the files are selected, simply click the “Write to disc” button to\
    \ start to create an audio CD. Like the Totem application, Serpentine uses “codecs”\
    \ to decode the music files and write them to the CD. If the correct codec is\
    \ not installed, an error message will be produced warning you that the file types\
    \ are not supported.\n\nFigure 9-7 Serpentine Unsupported file types\nSimply use\
    \ the “Add/Remove Applications” utility to search for the file extension (such\
    \ as “MP3”) and the correct codec will be displayed, tick the check box to select\
    \ the codec and click “OK” to install it. Once the codec is installed, if you\
    \ restart the Serpentine application it will now be able to read the file format\
    \ and create the CD.\n\n### Sound Juicer\nThis application is used for extracting\
    \ or \"ripping\" music from an audio CD and converting it to a digital audio file\
    \ that can be played with the Rhythmbox or Totem applications. It can also be\
    \ used to play CD audio discs directly on your computer. Sound Juicer can be seen\
    \ in Figure 9-8. When a CD is loaded into your computer's CD or DVD drive, Sound\
    \ Juicer will try to automatically download the disc and track titles from an\
    \ Internet database called MusicBrainz (http://www.musicbrainz.org). This allows\
    \ the application to automatically name the audio files and assign properties\
    \ (such as album title, track title, artist, etc) to the audio files so that they\
    \ will be displayed when played. The CD is recognised by using its serial number\
    \ and the positions and lengths of the tracks to match it against the free MusicBrainz\
    \ database. Very occasionally this data may return more than one CD's details,\
    \ in which case Sound Juicer will ask you which data to use.\n> If the CD is not\
    \ recognised at all, you can manually enter the information using the title, artist\
    \ and genre text fields.\n\nFigure 9-8 Sound Juicer\nDisc Edit Help\n**Title:**\
    \ Final Straw\n**Artist:** Snow Patrol\n**Genre:** \n**Duration:** 52:32\n\n|\
    \ Track | Title | Artist | Duration |\n|-------|-------|--------|----------|\n\
    | 1 | How to Be Dead | Snow Patrol | 3:21 |\n| 2 | Wow | Snow Patrol | 4:02 |\n\
    | 3 | Gleaming Auction | Snow Patrol | 2:04 |\n| 4 | Whatever's Left | Snow Patrol\
    \ | 2:39 |\n| 5 | Spitting Games | Snow Patrol | 3:46 |\n| 6 | Chocolate | Snow\
    \ Patrol | 3:02 |\n| 7 | Run | Snow Patrol | 5:54 |\n| 8 | Grazed Knees | Snow\
    \ Patrol | 2:55 |\n| 9 | Ways & Means | Snow Patrol | 4:47 |\n| 10 | Tiny Little\
    \ Fractures | Snow Patrol | 2:28 |\n| 11 | Somewhere a Clock Is Ticking | Snow\
    \ Patrol | 4:32 |\n| 12 | Same | Snow Patrol | 6:54 |\n| 13 | We Can Run Away\
    \ Now They're All Dead and Gone | Snow Patrol | 3:15 |\n| 14 | Half the Fun |\
    \ Snow Patrol | 2:53 |\n\nBefore converting a CD to an audio file for the first\
    \ time, select the \"Preferences\" option from the \"Edit\" menu to select the\
    \ directory you wish to store the new files in, and the type of file format that\
    \ you want to create. Sound Juicer supports many types of format such as FLAC,\
    \ OGG, MP3, AAC and WAV. Before choosing a format, ensure that the format you\
    \ use is compatible with any portable music players that you wish to use. Generally\
    \ the MP3 format is widely used, however it has a lower sound quality but smaller\
    \ file size than the FLAC format for example. Once you have chosen the directory\
    \ and the file type to use, click the “Extract” button. The new files will be\
    \ created in a directory structure in the format “Artist Name” then a sub-directory\
    \ of “Album Title”.\n\n### Sound Recorder\nThe Sound Recorder application is a\
    \ utility that allows you to record audio files if you have a microphone attached\
    \ to your computer, as shown in Figure 9-9. Select the audio format from the drop-down\
    \ list and then just click the “Record” button to start the recording and click\
    \ the “Stop” button to complete the recording. The new audio file can then be\
    \ saved by clicking the “Save” button.\n\nFigure 9-9 Sound Recorder\n\n## Summary\n\
    Sound and Video files are becoming more and more popular as connections to the\
    \ Internet are becoming faster, and they allow anyone to start broadcasting using\
    \ \"podcasts\". As we have seen, Ubuntu has the tools to play either local media\
    \ files such as home videos or music, or to stream the media such as Internet\
    \ Radio stations or video clips, and can even download the files automatically\
    \ for you such as podcasts. You have also now discovered the major applications\
    \ that are included as standard with Ubuntu, however there are many more available\
    \ through the \"Add/Remove Applications\" utility for you to discover. Some of\
    \ these applications will provide different tools to perform the same function\
    \ as we have already discovered, however there are also lots more to perform small\
    \ niche tasks that you may find useful. Simply use the search function as described\
    \ earlier for installing \"Codecs\" to look for applications that you might find\
    \ of use.\n\n## PART 4 Troubleshooting\n\n## 10 Finding Help\nIn this final chapter,\
    \ we look into how to find help to solve problems that might occur while you are\
    \ using Ubuntu. We will review the on-line help in Ubuntu and the installed applications,\
    \ and also cover the resources on the Internet, including further documentation\
    \ and help forums.\n\n### Ubuntu Help Centre\nThe \"Ubuntu Help Centre\" is the\
    \ on-line help manual that can be launched from the question mark icon on the\
    \ top panel.\n\nFigure 10-1 Ubuntu Help Centre\nThe Help Centre is a hypertext\
    \ style help manual which lists topics down the left-hand side and links to common\
    \ questions in the main window, as shown in Figure 10-1. It also includes a link\
    \ to the free Ubuntu support forum which allows specific questions to be asked\
    \ of the Ubuntu community.\n> Searching through and posting questions to the Ubuntu\
    \ community through the Ubuntu support forum is a great way to get help.\n\nA\
    \ search field on the tool bar is provided for searching for specific topics if\
