    ## Configuring Printer Settings

    The printers utility can be launched from the "Administration" sub-menu from the
    "System" menu, and allows you to install printers and configure their settings.


    ### Configuration

    ![](img/93a96bd5075527285b151804f3a5c28f_86_0.png)

    > **Figure 4-11 Printers**


    To install a printer, make sure the printer is connected to your computer and
    switched on, then double-click the "New Printer" icon in the printers utility,
    as shown in Figure 4-11. The system will then search for the correct printer driver
    for your printer. Once the printer has been recognised the "Add a Printer" wizard
    will automatically open.

    ![](img/93a96bd5075527285b151804f3a5c28f_87_0.png)

    > **Figure 4-12 Add a Printer (Printer Type)**


    Ensure the correct printer is recognised and the settings for local or network
    connected printer are correct, as shown in Figure 4-12, (change the settings if
    they are not) and then click the "Forward" button. Select the most appropriate
    driver from the list and then click "Forward", name the printer and add a description
    and location comment if required. Finally, click the "Apply" button to install
    the printer driver. Your printer will now be displayed in the Printers window.
    You can change the properties of the printer by clicking the printer and selecting
    "Properties" from the "Edit" menu. This will open the properties window, allowing
    you to set the default printer resolution, page size and orientation, as shown
    in Figure 4-13. Click the "Print Test Page" button to verify that the printer
    is working correctly.

    ![](img/93a96bd5075527285b151804f3a5c28f_88_0.png)

    > **Figure 4-13 Printer Properties**


    ## Configuring Time and Date

    If your computer is connected to the Internet, it is possible to configure Ubuntu
    to automatically set the correct time and date on your computer by checking the
    time against servers on the Internet. These are servers which are configured to
    check their time against atomic clocks. They then share this accurate time information
    amongst other servers and client computers using the Network Time Protocol (NTP).
    This is a standard protocol used by different computer operating systems in order
    for them to automatically and accurately maintain their internal clocks. To configure
    your computer to do this, select the "Time and Date" utility under the "Administration"
    menu option from the "System" menu.


    ### Configuration

    ![](img/93a96bd5075527285b151804f3a5c28f_90_0.png)

    > **Figure 4-14 Time and Date Settings**


    Select the "Keep Synchronized with Internet servers" from the Configuration drop-down
    menu. You will then be prompted to confirm the installation of the NTP software.
    Click "Install NTP support" to install the software and confirm the on-screen
    messages to complete the installation. Once the NTP support is installed you will
    be returned to the Time and Date utility and the "Keep Synchronized with Internet
    servers" option will now be selected. Then close the applet and restart the computer,
    the time will automatically be corrected when the computer starts and at regular
    periods while it is running.


    ## Installing Software

    Installing free software is made easy with the "Add/Remove Applications" utility
    (sometimes known as "Synaptic"), as shown in Figure 4-15. It can be launched from
    the "Add/Remove..." option on the "Applications" menu.

    ![](img/93a96bd5075527285b151804f3a5c28f_91_0.png)

    > **Figure 4-15 Add/Remove Applications**


    ### Configuration

    Clicking on the "Preferences" button allows you to configure what sources Ubuntu
    will install software from. Ubuntu uses the following terms for different software
    sources:


    - Main – Canonical Ltd Supported Open Source software

    - Universe – Ubuntu community supported Open Source software

    - Restricted – Proprietary drivers

    - Multiverse – Copyrighted, although often free, software

    - Source Code – Code used during software development.


