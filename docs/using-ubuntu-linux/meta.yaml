    | free space | - | - | - | 8 MB | - |

    接下来你需要创建交换分区。选中新创建的可用空间，点击“新建分区”，输入要创建的容量为2000MB，并选择“Swap”。再次点击可用空间，然后点击“新建分区”，选择“/”或根目录，格式选择“ext3”。保留其余设置不变，点击“下一步”。

    ### 图2-9 自定义分区

    ![](img/93a96bd5075527285b151804f3a5c28f_46_0.png)

