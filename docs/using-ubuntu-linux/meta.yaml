    # ## Gaim Internet Messenger


    Gaim is an Instant Messaging application that can be used to send and receive
    real-time text messages to users of AIM, MSN, Yahoo, IRC and many other Instant
    Messaging applications. It has recently been renamed to Pidgin (http://pidgin.im),
    but at the time of writing, the new version is not yet available for Ubuntu.


    Like many of the applications installed on Ubuntu, when you run Gaim for the first
    time it starts an assistant in order to configure it with an existing Instant
    Messenger (IM) account. You need to create an account with an Instant Message
    service before you can configure Gaim. The advantage of this application is it
    can support multiple accounts on different services, so if you have friends and
    family using different applications, you can create an account on each service
    and configure Gaim to use all the services simultaneously.'
