  md: '# 2


    # Setup


    In this chapter, we take our first steps into the free software world and we test
    Ubuntu on our computer, before committing to installing it.


    > Don''t worry, the installation is an easy process and shouldn''t take more than
    30 minutes.


    # Installing Ubuntu


    Once you''re ready to try Ubuntu, the first task is to obtain the CD. This is
    freely available to download from the Ubuntu website (http://www.ubuntu.com/getubuntu/download).
    The download file is an ISO CD image (an industry standard file format for CDs)
    that can be written to a blank CD by most CD writing software. If you don''t have
    access to a broadband Internet connection necessary to download the CD image,
    it is also possible to buy the Ubuntu installation CD for a small fee'
  merge: -1
  pgno: 34
- img_proc: true
  md: 'from various companies that can be found on the Internet (http://www.ubuntu.com/getubuntu/purchase).


    > Before installation, it is important to ensure that you back up all your work
    files (either to CD, USB memory stick or USB hard disc), as the installation process
    will erase your hard disc.


    # Testing Your System Hardware


    The Ubuntu CD is called a "live" CD as it is possible to boot (or start-up) your
    computer into Ubuntu Desktop from the CD before installation onto your computers
    hard disc. This allows you to test the computers hardware for compatibility, or
    to just give Ubuntu a test drive before overwriting your existing operating system.


    To start your computer from the live CD, place the CD into your CD-Rom drive and
    restart your computer. When the system starts up, the system should start from
    the CD and load Ubuntu. If this does not happen, it may be necessary to select
    the computers "boot menu" just after the computer is switched on. This is often
    displayed by a message such as "Press F12 for start menu" which will result in
    a boot menu being displayed as shown in Figure 2-1.'
  merge: -1
  pgno: 35
- img_proc: true
  md: '![](img/93a96bd5075527285b151804f3a5c28f_36_0.png)


