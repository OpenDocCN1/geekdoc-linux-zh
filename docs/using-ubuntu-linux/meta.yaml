    无论哪种情况，浏览应用程序帮助还是Ubuntu帮助中心的操作都大同小异：主题显示在右侧面板，索引在左侧。工具栏也包含相同的搜索、前进、后退和主页按钮。部分应用程序的“帮助”菜单还会提供链接，跳转到其官方网站，以获取更全面的文档或帮助论坛。例如，OpenOffice.org
    Writer应用程序的“帮助”菜单中包含“支持”选项，点击后会启动Firefox浏览器并打开OpenOffice.org的Ubuntu帮助站点。


    ## 互联网文档

    如果在线帮助无法解答你的疑问，Ubuntu社区提供了大量基于互联网的文档、论坛和教程。


    ### Ubuntu官方文档

    Ubuntu官方网站提供了Ubuntu帮助中心的网页版（https://help.ubuntu.com），其内容和Ubuntu系统内置的帮助与文档完全一致。


    ### Ubuntu社区文档

    Ubuntu社区的用户和开发者在Ubuntu用户文档站点（https://help.ubuntu.com/community）上补充了官方文档的内容。如果你在官方文档中找不到问题的答案，这个站点就是你的第二求助资源。该站点的示例如图10-3所示。

    ![](img/93a96bd5075527285b151804f3a5c28f_207_0.png)

    *图10-3 Ubuntu用户社区文档*

    除了提供Ubuntu安装、配置和使用方面的帮助外，该站点还列出了可安装的其他应用程序及其安装说明。


    ## GNOME文档

    正如我们之前所提到的，许多应用程序和GNOME桌面环境在不同的GNU/Linux操作系统版本中是通用的。因此，你可以在各个开源应用程序的官网上找到额外的帮助资源。例如，GNOME桌面环境在GNOME官网（http://www.gnome.org/support）上提供了大量文档，涵盖GNOME工作区、文件管理器、应用程序和系统管理的文档与论坛，相关示例如图10-4所示。

    ![](img/93a96bd5075527285b151804f3a5c28f_209_0.png)

    **图10-4 GNOME支持**


    ### 应用程序文档

    最后，Ubuntu中的特定应用程序也会在自有官网上提供额外文档，比如OpenOffice.org办公套件、Firefox浏览器或GIMP图像编辑器。所有已安装应用程序的官网完整列表会在介绍各个应用程序的章节中列出。


    ## 帮助论坛

    如果你读完了所有在线帮助和文档仍然有问题，Ubuntu社区可以通过专注于Ubuntu、GNOME和Linux的互联网论坛为你提供帮助。


    ### Ubuntu论坛

    Ubuntu官方论坛在Ubuntu主站（http://www.ubuntu.com/support/community/webforums）上提供多语言版本，而英语论坛的地址是http://ubuntuforums.org。这些论坛目前由Canonical公司运营维护，用户可以在上面发帖，从其他用户、开发者和专家那里获得免费帮助。


    ### 商业支持

    有许多机构为开源软件提供商业支持，其中Canonical公司为Ubuntu桌面版、服务器版和瘦客户机系统提供付费支持。该支持可选择仅在工作时段提供，也可选择包含邮件和电话支持的7×24小时全时段服务，非常适合大规模部署和安装咨询需求。更多信息可在Ubuntu官网（http://www.ubuntu.com/support/paid）获取。


    ## 总结

    在本章中，你已经了解到Ubuntu拥有大量的求助渠道：从操作系统内置的在线帮助，到针对特定应用程序的帮助，再到基于互联网的社区文档，最后还有可以发帖求助、由Ubuntu用户和专家解决问题的Ubuntu论坛。


    ## 第5部分

