    are many already available from commercial organisations such as Red Hat and Novell,
    as well as free versions such as Slackware. Along with the belief of free software
    for all, including developing countries, the Ubuntu system had the aim of a fully
    featured and user friendly operating system, as many of the existing free or commercial
    versions were very powerful but aimed at technical users.'
  - '[PAGE 27]


    # Introduction


    Ubuntu was therefore designed to be as user friendly as any commercial operating
    system such as Microsoft Windows or Mac OS X. It was also designed to be usable
    and secure straight after installation. So the system is pre-installed with the
    most common applications users will need, such as:


    +   - A suite of applications for word processing, spreadsheets, databases and
    presentations

    - Internet tools for web browsing, email and instant messaging

    - Graphics tools for editing and managing pictures

    - Multimedia tools for playing videos and music.


    Since security has become of great importance in recent years, the Ubuntu system
    was also designed to be as secure as possible without lengthy configuration. It
    therefore has the aim to provide only the tools and services required for a workstation
    and aims to disable by default, facilities that are usually not required. This
    doesn''t mean it lacks functionality; simply the functionality must be enabled
    when required so that the system is kept as secure as possible. To further enhance
    security, the system supports automatic detection of security updates and will
    prompt the user when they are available. Of course, this security feature is also
    on by default so that systems are kept secure without the user needing to configure
    it.'
- md: '## Introduction

    After three years of development, Ubuntu is rapidly becoming the de facto free
    GNU/Linux distribution. Some of the numerous awards and accolades that it has
    received have been:

    - Wins a "100 Best Products of 2007" Award from PC World magazine in May 2007

    - Chosen as an option to be pre-installed on new Dell PCs and Laptops in May 2007

    - Receives "Editor''s Choice Award" from PC Welt magazine in March 2007

    - Wins "Most User Friendly Linux Distribution Award" at the Linux New Media Awards
    in November 2006

    - Chosen as "Best Linux/Open Source Distribution", at the UK Linux and Open Source
    Awards in October 2006, for the second year in succession.


    ## Ubuntu Versions

    Today, Ubuntu is available in several flavours, each tuned for a particular use.


    ## Ubuntu Desktop

    Ubuntu Desktop (http://www.ubuntu.com) is the primary version of the operating
    system, however, this too is available in different types. This version is based
    on a desktop environment called "Gnome" and is the version this book is based
    upon. However, many of the steps and tips are equally relevant for the other versions
    also based on the Gnome desktop environment.


    ### Kubuntu

    However, another version called Kubuntu (http://www.kubuntu.org) is also released
    at the same time as the main Ubuntu releases. This is based on a different desktop
    environment called KDE or K Desktop Environment, and so supports a different variety
    of applications that have been developed for this desktop environment.


    ### Edubuntu

    Edubuntu (http://www.edubuntu.org) is based on Ubuntu, but comes with a suite
    of applications designed for children and education, and is summed up with the
    phrase "Linux for Young Human Beings"!


    ### Xubuntu

    Like Kubuntu, Xubuntu (http://www.xubuntu.org) is based on the Ubuntu system but
    uses the Xfce Desktop Environment. This gives the system a slightly different
    look and feel and a different suite of applications. The main advantage of Xubuntu
    is the Xfce desktop environment requires less system resources than the Gnome
    environment used for Ubuntu. It is therefore ideal for older, less powerful hardware.


    ### Ubuntu Studio

    A relatively new release, Ubuntu Studio (http://ubuntustudio.com) is an optimised
    Ubuntu Desktop release for media creation. The system has had additional development
    to avoid latency for time critical applications used for music or video editing.
    It also comes pre-installed with a suite of applications dedicated to graphics,
    video and music editing.


    ### Ubuntu Server

    Finally, we come to Ubuntu Server (http://www.ubuntu.com). As the name suggests,
    this release is optimised for performing server tasks such as for web, email or
    database server tasks. To save memory and resources, this version does not come
    with a desktop environment and so must be installed, configured and administered
    from a command line.


    ### Ubuntu Support

    Each Ubuntu release is developed by the Ubuntu community, a team of developers
    across the world who collaborate to develop and update the Ubuntu operating system.
    Released every six months, each version has a commitment to be supported for at
    least 18 months by the Ubuntu community. However, there are occasionally releases
    known as "Long Term Support" or LTS releases such as Ubuntu 6.06. These versions
    are released to ensure that frequent re-installation of operating system upgrades
    is not required. The long term support releases will be supported for a minimum
    of three years for the desktop and five years for servers. Apart from development
    and fixes, the Ubuntu community also develops the online help, and provides support
    forums for free help and advice. The community is also backed by the commercial
    company Canonical Ltd, started by Mark Shuttleworth. The company provides commercial
    support, training and certification on the free operating system for users and
    commercial companies who require a service beyond that which can be provided by
    the community.


    ## Summary

    In this chapter we have covered a brief history to help provide an understanding
    of where Ubuntu has come from, and its belief in providing a user-friendly, feature
    rich operating system that is based on the early ideals of the GNU project of
    being freely available for all. In the following chapters we get to grips with
    installing the operating system and trying it out for real.


    ## PART 2


    ## 2 Setup

    In this chapter, we take our first steps into the free software world and we test
    Ubuntu on our computer, before committing to installing it.

    > Don''t worry, the installation is an easy process and shouldn''t take more than
    30 minutes.


    ### Installing Ubuntu

    Once you''re ready to try Ubuntu, the first task is to obtain the CD. This is
    freely available to download from the Ubuntu website (http://www.ubuntu.com/getubuntu/download).
    The download file is an ISO CD image (an industry standard file format for CDs)
    that can be written to a blank CD by most CD writing software. If you don''t have
    access to a broadband Internet connection necessary to download the CD image,
    it is also possible to buy the Ubuntu installation CD for a small fee from various
    companies that can be found on the Internet (http://www.ubuntu.com/getubuntu/purchase).

    > Before installation, it is important to ensure that you back up all your work
    files (either to CD, USB memory stick or USB hard disc), as the installation process
    will erase your hard disc.


    ### Testing Your System Hardware

    The Ubuntu CD is called a "live" CD as it is possible to boot (or start-up) your
    computer into Ubuntu Desktop from the CD before installation onto your computer''s
    hard disc. This allows you to test the computer''s hardware for compatibility,
    or to just give Ubuntu a test drive before overwriting your existing operating
    system. To start your computer from the live CD, place the CD into your CD-ROM
    drive and restart your computer. When the system starts up, the system should
    start from the CD and load Ubuntu. If this does not happen, it may be necessary
    to select the computer''s "boot menu" just after the computer is switched on.
    This is often displayed by a message such as "Press F12 for start menu" which
    will result in a boot menu being displayed as shown in Figure 2-1.


    ![](img/93a96bd5075527285b151804f3a5c28f_36_0.png)


    *Figure 2-1 BIOS Boot Menu*


    Select the CD by pressing the relevant number and the system will start loading
    Ubuntu desktop. During the loading, a menu will be displayed providing various
    options, as can be seen in Figure 2-2.


    ![](img/93a96bd5075527285b151804f3a5c28f_37_0.png)


    *Figure 2-2 Live CD Startup Menu*


    Before installing from the CD, it is recommended to select the "Check CD for defects"
    option to ensure that the image file has been correctly written to the CD. Select
    this option by using the up and down arrows and pressing return. If a defect is
    detected, remove the CD and reboot into your existing Operating System and write
    the image file to another CD and try again. Once the CD image has been verified,
    select the "Start or install Ubuntu" option to load the Ubuntu Desktop operating
    system.


    ### Setup

    While the system is loading, an Ubuntu "splash" screen will be displayed along
    with a progress bar. After a little while, the Ubuntu desktop will be displayed
    as shown in Figure 2-3.


    ![](img/93a96bd5075527285b151804f3a5c28f_38_0.png)


    > Figure 2-3 Ubuntu Live CD Desktop


    Take a while to investigate the Ubuntu Desktop, and to make sure that your system
    is working correctly. The system will feel a little slow while running from the
    live CD, as a CD drive is much slower than a hard disc. Open the examples folder
    on the desktop and try opening some of the sample files such as the "Experience
    Ubuntu.ogg" file to ensure that the Ubuntu Operating System can play videos and
    movies on your system.


    ### Installation

    Once you''re happy that your system''s keyboard, mouse, display and sound are
    all working correctly, and that you have backed up all your existing files, it
    is time to start installing your new system. To start the installation, double-click
    the "Install" icon on the desktop. The Installation Welcome screen will now be
    displayed, as shown in Figure 2-4. Select your language and press the forward
    button to continue the installation process.'
