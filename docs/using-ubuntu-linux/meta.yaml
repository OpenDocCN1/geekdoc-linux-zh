    # 图5-4 添加字典源


    ### 磁盘使用分析器

    磁盘使用分析器是Ubuntu 7.04中新增的一款工具，同样可以通过“附件”子菜单中同名称的快捷方式来启动。

    # 图5-5 磁盘使用分析器


    该工具会以图形化形式展示当前磁盘使用情况，如图5-5所示。窗口分为两个区域，左侧面板显示目录结构、磁盘占用大小及占比，右侧则展示目录结构的图形化呈现。该工具可用来分析整块磁盘，也可以仅分析本地或网络目录结构。菜单栏包含多个按钮，可用于针对以下选项发起扫描，这些选项同样列在“分析器”菜单下：

    - 用户主目录

    - 整个文件系统

    - 指定本地目录

    - 远程/网络目录。


    点击文件系统按钮将对整个文件系统发起扫描，这一过程可能会花费一些时间。扫描完成后，左侧面板会展示从“根目录”或“/”目录开始的目录结构树，并列出根目录下所有的直接子目录。每个子目录会显示其占用大小、包含的文件数量以及该目录占总磁盘空间的比例。点击目录名称旁边的小三角可展开或折叠对应目录，即可查看其下属子目录的详细信息。右侧面板展示左侧面板统计数据的图形化结果。图形的中心是本次扫描的根目录，从中心向外发散的是各个子目录，直至展示完整的目录结构。每个环形或块的大小与对应目录的磁盘占用大小成比例。


    ### 截图工具

    - ○ 抓取整个桌面（已选中）

    - ○ 抓取当前窗口

    - 延迟`0`秒后抓取


