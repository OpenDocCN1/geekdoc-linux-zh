    > Release Notes ![](img/93a96bd5075527285b151804f3a5c28f_40_0.png)


    ### Figure 2-4 Welcome Screen

    You will now be prompted to select your location, as shown in Figure 2-5. Click
    on the world map to zoom in and then select your location on the map. When you
    are happy that you have selected the correct location press the "Forward" button.


    ### Figure 2-5 Choosing where you are in the world

    ![](img/93a96bd5075527285b151804f3a5c28f_41_0.png)


    Next, select your keyboard layout from the options list as shown in Figure 2-6.

    > Type a few words of text to ensure that your keyboard works correctly, making
    sure that the special characters or symbols for your language or region work correctly.


    When you are happy that everything works as you would expect it to press the "Forward"
    button again to continue.


    ### **Figure 2-6 Selecting your Keyboard Layout**

    ![](img/93a96bd5075527285b151804f3a5c28f_42_0.png)


    You will then be prompted to select the partitioning scheme for your hard disc,
    as shown in Figure 2-7.

    > It is recommended to select the "guided" option which will configure the recommended
    partitioning layout for your system.


    If you have more than one hard disc installed in your computer, select the relevant
    disc under the "guided" option and press "Forward" to continue.


    ### Figure 2-7 Select your partitioning scheme

    ![](img/93a96bd5075527285b151804f3a5c28f_43_0.png)


    It is also possible to install Ubuntu alongside your existing Operating System,
    rather than replacing it. Because Ubuntu uses a different format for the hard
    disc than Windows, to do this you must make spare space on your hard disc.

    > If anything goes wrong during this operation, you may lose your existing operating
    system! Make sure you have saved all your important files first.


    To resize your existing partition, select the "Manual" option. You can then choose
    to resize your existing hard disc "partition" by first selecting the partition
    and then clicking "Edit Partition". Enter a new size for the partition in megabytes
    and press OK.


    ### Figure 2-8 Partition Edit

    ![](img/93a96bd5075527285b151804f3a5c28f_45_0.png)


    | Device     | Type  | Mount point   | Format | Size     | Used    |

    |------------|-------|---------------|--------|----------|---------|

    | /dev/hda1  | ntfs  | /             | [ ]    | 4285 MB  | 2000 MB |

    | /dev/hda2  | ntfs  | media/hda2    | [ ]    | -        | -       |

    | free space | -     | -             | -      | 8 MB     | -       |


    Next, you''ll need to create a swap partition. Highlight the newly created free
    space, click "New Partition", enter the size to create as 2,000MB, and choose
    "Swap". Click the available free space again, and then click "New Partition",
    and choose "/" or root, and select the format as "ext3". Leave the other settings
    alone and press the "Next".


    ### Figure 2-9 Custom Partitioning

    ![](img/93a96bd5075527285b151804f3a5c28f_46_0.png)


    A new feature with Ubuntu 7.04 is the ability for the installer to migrate your
    user settings if you are installing on a system that is already installed with
    Windows, as shown in Figure 2-10. As you can see from Figure 2-10 there were no
    users or operating systems suitable for importing from, but if there were they
    would be displayed here.


    ## Migrate Documents and Settings

    Select any accounts you would like to import and fill in the form below for each
    one. The documents and settings for these accounts will be available after the
    install completes. If you do not wish to import any accounts, select nothing and
    go to the next page.


    There were no users or operating systems suitable for importing from.


    Create a user to import the selected account into:


    Step 5 of 7

    - Cancel, Back, Forward


    ### Figure 2-10 Migrate Documents and Settings

    ![](img/93a96bd5075527285b151804f3a5c28f_47_0.png)


    If you do not want to migrate the user settings, simply press forward. Otherwise
    select a user listed in the Migrate Documents and Settings dialog and a username
    and password for the new Ubuntu account to use with these settings before pressing
    "Forward".


    Next, enter your name, password and the name you wish to give to your computer,
    as shown in Figure 2-11, before pressing the "Forward" button.

    > Make sure you choose a complex password (such as a mixture of letters and characters)
    to ensure your computer is kept secure.


    ### Figure 2-11 Entering your user details

    ![](img/93a96bd5075527285b151804f3a5c28f_48_0.png)


    ## Setup

    Finally, a summary screen will be displayed allowing you to change the options
    you have selected, as shown in Figure 2-12. If you are happy with your choices
    and you have backed up your existing files, press the "Install" button to commence
    the installation.


    ### Ready to install

    ![](img/93a96bd5075527285b151804f3a5c28f_49_0.png)


    Your new operating system will now be installed with the following settings:

    - Language: English

    - Keyboard layout: United Kingdom

    - Name: jon

    - Login name: jon

    - Location: Europe/London

    - Migration Assistant: If you continue, the changes listed below will be written
    to the disks. Otherwise, you will be able to make further changes manually.


    > WARNING: This will destroy all data on any partitions you have removed as well
    as on the partitions that are going to be formatted.


    The partition tables of the following devices are changed:

    SCSI1 (0,0,0) (sda)


    The following partitions are going to be formatted:

    - partition #1 of SCSI1 (0,0,0) (sda) as ext3

    - partition #5 of SCSI1 (0,0,0) (sda) as swap


    ### Figure 2-13 Monitoring the progress of the system installation

    During the installation, a progress bar will be displayed providing a guide to
    how long the installation will take, as shown in Figure 2-13.

    > This may be from 20 minutes to an hour depending on the speed of your system
    so be patient.


    When the installation is complete, a message will be displayed asking if you wish
    to continue to use the live CD, or to reboot your system, as shown in Figure 2-14.
    Click the "Restart now" button.


    ### Figure 2-14 The installation is complete

    ![](img/93a96bd5075527285b151804f3a5c28f_51_0.png)


    The system will now complete the installation and shutdown; once this is complete
    a message will be displayed to remove the CD from the CD-ROM drive. Once you have
    removed the CD, press the enter or return key to restart your computer.


    ## Summary

    In this chapter you have taken Ubuntu for a test to make sure it will work correctly
    on your computer, before committing to installing it onto your hard drive. You
    are now ready to reboot the system and delve into your new desktop environment.


    ## 3 Discovering the Desktop

    We are now ready to try out Ubuntu. This chapter explains some of the key features
    of your new desktop environment and explains the differences and similarities
    to Windows. Once the system has rebooted, the Ubuntu "splash" screen is displayed
    along with a progress bar to provide a guide to how long the system will take
    to load. After a short while, the login screen will be displayed, as shown in
    Figure 3-1.


    ### **Figure 3-1 The Ubuntu login screen**

    ![](img/93a96bd5075527285b151804f3a5c28f_53_0.png)


    The login screen displays an “Options” menu in the left-hand bottom corner, and
    the system name and the current date and time in the lower right-hand corner.'
