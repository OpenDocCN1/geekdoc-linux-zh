    应用效果：`[下拉菜单]`

    # 图5-6 截图工具


    只需运行该应用，在点击“截图”按钮前选择“抓取整个桌面”或“抓取当前窗口”，即可对当前工作区或活动窗口进行截图，效果如图5-6所示。截图完成后，应用会提示你为截图命名并保存。此外，你也可以输入延迟秒数，在截图前预留时间调整鼠标和窗口的位置，以便获得符合需求的截图效果。

    # 图5-7 终端


    ### 终端

    “终端”快捷方式可启动GNOME终端窗口，支持通过命令行访问GNU/Linux Shell环境。

    > “Shell是一种程序，可解释并执行用户输入的文本命令，或是运行自名为“脚本”的文本文件中的命令。”


    启动终端后，会显示一个“终端窗口”，其中包含“命令提示符”，用户可在其中输入UNIX命令，按下回车键即可执行该命令，如图5-7所示。


    ### 文本编辑器

    文本编辑器，也常被称为“Gedit”（http://www.gedit.org），可通过“文本编辑器”图标启动。

    # 图5-8 文本编辑器


    如图5-8所示，该应用是一款简单易用的文本文件或脚本编辑工具。不过，这款工具在易用性之外还具备许多强大功能，例如完全支持国际化文本、为文本文件和脚本（如HTML、C、C++、Java、Perl、XML等）提供语法高亮、文件恢复、远程文件编辑，还支持通过“插件”扩展额外功能。这些高级功能是在撤销、重做、剪切、复制、粘贴、拼写检查、搜索、自动换行、行号显示等标准文本编辑功能之外的附加功能。用户可通过“文件”菜单的选项创建或打开文件，此外文本编辑器还支持将文件拖拽到编辑窗口来打开文件。若要配置特定文件或脚本的语法高亮颜色，可点击“编辑”菜单中的“偏好设置”选项，根据所编辑的脚本类型切换高亮模式，具体操作如图5-9所示。

    # 图5-9 文本编辑器偏好设置


    ## gedit 偏好设置

    - 视图

    - 编辑器

    - 字体与颜色

    - 语法高亮

    - 插件


