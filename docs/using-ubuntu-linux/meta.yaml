    ## 同作者其他书目

    - BP565 《使用Microsoft Windows XP Media Center 2005》

    - BP567 《如何搭建家庭或小型企业网络》

    - BP571 《玩转你的Microsoft Xbox 360》

    - BP578 《Microsoft Windows Vista终极指南》

    ## 关于本书

    欢迎阅读《使用Ubuntu Linux》，感谢您购买本书。我们希望本书能成为您搭建、配置和探索安全、功能丰富且易于使用的Ubuntu桌面操作系统的宝贵信息来源与指南。市面上绝大多数基于GNU/Linux的操作系统书籍都面向技术型计算机用户，或希望提升技术知识的用户。编写本书时，我们的目标是为普通非技术用户提供资源，这类用户仅希望将电脑作为其设计用途的工具。除非绝对必要，本书会尽量避免罗列需要在闪烁提示符下输入的冗长手动命令。好在Ubuntu已被评为最友好的Linux操作系统（在2006年英国Linux与开源大奖上，连续第二年斩获“最友好Linux发行版”及“最佳Linux/开源发行版”两项奖项），冗长晦涩的命令非常少见，也极易规避。希望您阅读愉快。

    ## 排版约定

    通读本书时，您会看到若干信息提示框，由双线条界定，样式如下：

    > 表示警告

    > 表示注释、注意点或实用提示

    操作流程与步骤指南可能会以数字列表呈现，示例如下：

    1. 步骤1

    2. 步骤2

    所有图表与图示都采用两位数的参考编号，前一位为章节号，后一位为本章内的图示编号。例如，图1-1代表第1章的第1个图示。

    ## 关于作者

    ### 乔恩·罗尔夫

    乔恩·罗尔夫从事IT行业已超过12年，曾就职于富士通、EDS等全球最大的IT服务公司。职业生涯中，他专注于微软解决方案，为众多蓝筹企业和政府部门的大型企业级方案提供设计、架构与开发支持。乔恩对IT系统有广泛的知识储备，从业经验涵盖早期的Sinclair
    ZX81，以及后续的PC、Mac、Windows和Linux系统。乔恩现居汉普郡，对IT、消费电子、数码摄影和赛车运动有浓厚兴趣。闲暇时，他也喜爱山地自行车和滑雪运动。您可通过《使用Ubuntu》官方网站（http://UsingUbuntu.com）联系他，或发送邮件至Jon@UsingUbuntu.com。

    ### 安德鲁·埃德尼

    安德鲁·埃德尼从事IT咨询工作已超过12年，职业生涯中曾就职于微软、惠普、富士通服务等多家高科技公司。他在微软计算解决方案的几乎所有领域都有丰富经验，曾为政府和私营部门客户设计并架构大型企业级解决方案。多年来，安德鲁多次作为嘉宾出席行业大型活动，主讲涵盖信息系统类的大量主题，例如他曾出席在尼斯举办的年度微软Exchange大会，向微软技术社区分享移动计算相关内容。目前安德鲁参与了众多微软Beta测试项目，包括下一代Windows操作系统、下一代Microsoft
    Office产品，同时积极参与所有Windows Media Center的Beta测试项目。除此之外，安德鲁还运营着自己的IT咨询公司Firebird Consulting，目前已出版8本著作，且正在著书更多。安德鲁现居威尔特郡，与伴侣凯西及两只猫共同生活，联系邮箱为andrew@firebirdconsulting.co.uk。

    ## 致谢

    我们要感谢家人在我们数月撰写本书期间给予的支持与帮助。此外，还要感谢巴巴尼公司所有员工为本书出版付出的努力。

    > 致我已70<sup>th</sup>岁生日的父亲

    > ——乔恩

