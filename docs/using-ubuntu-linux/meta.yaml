- md: 'When you have completed your presentation, it can be saved as an OpenOffice.org
    file, or one of the many proprietary file formats. However, Impress also allows
    files to be exported as Adobe Acrobat (.pdf), HyperText Markup Language (.html)
    or even a Macromedia Flash (.swf) animation by selecting "Export" from the "File"
    menu.


    ## Writer

    OpenOffice.org Writer is available from the "OpenOffice.org Word Processor" shortcut
    on the "Office" sub-menu. Writer is a fully-featured word processing application
    that offers many of the features of commercial applications such as Microsoft
    Word, and allows the creation of letters, brochures, reports and documents, as
    shown in Figure 7-9. If you are familiar with Word or WordPerfect applications
    you will instantly be very familiar with Writer.


    ![](img/93a96bd5075527285b151804f3a5c28f_147_0.png)

    ### Figure 7-9 OpenOffice.org Writer


    The Writer application looks very similar to any other word processing application,
    with the familiar toolbars shown along the top of the window under the menu bar.
    Working with files is simple with the standard "Open" or "Save" options from the
    file menu. Writer defaults to using its own OpenOffice file formats which are
    as shown below in Table 7-5:


    ### Table 7-5 OpenOffice File Formats

    | Type | Format Extension |

    |------|-------------------|

    | Text Document | .odt |

    | Text Template | .ott |

    | Text Master document | .odm |


    It''s important to remember that if you share documents with users of other word
    processing software such as Microsoft Word, they may not be able to open the OpenOffice
    default file formats. However, Writer is capable of saving to proprietary formats
    such as Microsoft Word (.doc) or standard formats such as Rich Text Format (.rtf),
    HyperText Markup Language (.html) and Extensible Markup Language (.xml). The full
    list of supported file formats is shown in the table below in Table 7-6:


    ### Table 7-6 Supported File Formats

    | Type | Format Extension |

    |:---|:---:|

    | AportisDoc (Palm) | .pdb |

    | DocBook | .xml |

    | HTML Document (OpenOffice.org Writer) | .html and .htm |

    | Microsoft Word 2003 XML | .xml |

    | Microsoft Word 6.0, 95, and 97/2000/XP | .doc |

    | OpenOffice.org 1.x Text Document Template | .stw |

    | OpenOffice.org 1.x Text Document | .sxw |

    | Pocket Word | .psw |

    | Rich Text Format | .rtf |

    | StarWriter 3.0, 4.0, and 5.0 | .sdw |

    | StarWriter 3.0, 4.0, and 5.0 Template | .vor |

    | Text and Text Encoded | .txt |


    A document can be exported as one of these formats by choosing "Save as..." from
    the "File" menu. Alternatively, if you often exchange files with users using a
    different application, you can configure Writer to default to one of these standard
    file formats by selecting "Options..." from the "Tools" menu, as shown in Figure
    7-10.


    ![](img/93a96bd5075527285b151804f3a5c28f_150_0.png)

    ### Figure 7-10 Writer Options


    One of the many useful features that is not supported by many word processing
    applications is the ability to directly export as an Adobe Acrobat (.pdf) file;
    this can be achieved from the "Export as PDF..." option on the "File" menu. Writer
    will also connect to your email client to send a document directly by email from
    within the Writer application by choosing one of the options under the "Send"
    sub-menu on the "File" menu.


    ## Summary

    OpenOffice.org provides a full-featured suite of applications for all your day-to-day
    office computing tasks. As we have discovered, it can be used to open and interoperate
    with many of the commercial applications and even offers features not provided
    by some such as exporting as Adobe Acrobat format. As the OpenOffice.org suite
    warrants an entire book to cover its extensive features, for a full list of features,
    documentation and tutorials for all of the OpenOffice.org applications, refer
    to the extensive documentation provided by the OpenOffice.org community at http://documentation.openoffice.org/.


    ## Internet

    This chapter will discuss the Internet applications included with Ubuntu, and
    will take you through, step-by-step, how to configure the applications to browse
    the Web, read and send emails, chat online and make free voice calls over broadband.
    All these applications can be found under the "Internet" sub-menu of the "Applications"
    menu.


    ### Ekiga Softphone

    Ekiga (http://www.gnomemeeting.org) is an open source voice and video conferencing
    application which was previously called "GnomeMeeting". It can be run on various
    versions of GNU/Linux as well as Windows operating systems, and interoperates
    with other similar applications which are based on industry standard protocols
    such as Windows Messenger, IP Phones, Gizmo Project and NetMeeting. It does not
    interoperate with proprietary applications such as Skype as they are not based
    on an open protocol.


    ### Setup

    Setting up the application is made easy by a wizard that will automatically step
    you through the process to create an account so that other people will be able
    to contact you. When the application is launched for the first time, the configuration
    wizard will be shown as shown in Figure 8-1.


    ![](img/93a96bd5075527285b151804f3a5c28f_154_0.png)

    ### Figure 8-1 First Time Configuration Assistant


    Click the "Forward" button to start the configuration process. On the first screen
    simply enter your name and click "Forward", as shown in Figure 8-2.


    **First Time Configuration Assistant**

