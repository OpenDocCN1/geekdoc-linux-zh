    # ## Sound Recorder


    The Sound Recorder application is a utility that allows you to record audio files
    if you have a microphone attached to your computer, as shown in Figure 9-9. Select
    the audio format from the drop-down list and then just click the “Record” button
    to start the recording and click the “Stop” button to complete the recording.
    The new audio file can then be saved by clicking the “Save” button.'
