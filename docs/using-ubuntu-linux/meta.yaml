    安装完成后，会弹出提示询问你是否要继续使用Live CD，或者重启系统，如图2-14所示。点击“立即重启”按钮。

    ### 图2-14 安装完成

    ![](img/93a96bd5075527285b151804f3a5c28f_51_0.png)

    系统将完成剩余安装流程后关机；完成后会弹出提示，要求你将CD从光驱中取出。取出CD后，按下回车键即可重启电脑。

    ## 总结

    在本章中，你已测试了Ubuntu，以确保它能在你的电脑上正常运行，之后就可以将它安装到硬盘中了。现在你可以重启系统，开始体验你的新桌面环境了。

    ## 3 探索桌面

    现在我们可以开始试用Ubuntu了。本章将介绍新桌面环境的一些核心功能，并说明其与Windows的异同。

    系统重启后，会显示Ubuntu的启动闪屏和进度条，提示系统加载所需时间。稍等片刻后就会显示登录界面，如图3-1所示。

