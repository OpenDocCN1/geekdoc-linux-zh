    如需调整现有分区的大小，请选择“手动”选项。之后你可以先选中现有硬盘的“分区”，再点击“编辑分区”来调整分区大小。输入分区的新容量（单位为MB），然后点击确定。

    ### 图2-8 分区编辑

    ![](img/93a96bd5075527285b151804f3a5c28f_45_0.png)

    | 设备 | 类型 | 挂载点 | 格式 | 大小 | 已用 |

