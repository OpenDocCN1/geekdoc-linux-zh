    只需点击“添加用户”按钮即可开始创建新用户账户，随后会显示如图4-20所示的“新用户账户”表单。


    ## 配置

    ![](img/93a96bd5075527285b151804f3a5c28f_98_0.png)

    **图4-20 新用户账户**

    填写表单中的详细信息，并从“配置文件”选项中选择要创建的用户类型。如果需要管理并修改计算机设置的用户，选择“管理员”；如果是仅能使用计算机但无法修改配置的普通用户，选择“桌面用户”。填写完所有选项后点击“确定”，然后关闭该工具。


    ## 受限驱动

    Ubuntu在安装过程中不会安装受版权保护或不受支持的软件及驱动程序。因此，安装完成后你可能会发现系统的部分功能未完全配置。例如，Ubuntu默认未开启图形硬件的3D加速，或对无线网卡的某些加密标准缺乏支持。不过，Ubuntu通过“系统”菜单“管理”子菜单中的“受限驱动管理器”工具，可以很方便地使用专属驱动开启这些功能。

