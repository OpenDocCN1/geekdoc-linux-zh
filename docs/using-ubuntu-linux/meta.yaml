    # Summary


    You should now be able to send and receive emails, browse the Internet, and as
    long as you know other people with Instant Messaging or VOIP accounts, you can
    send text, voice or video messages in real time.


    Even though Ubuntu is a free operating system, we have found that it includes
    all the functionality of other expensive operating systems. In fact, due to the
    open source nature of the GNU/Linux platform, the applications available offer
    a greater level of flexibility than some commercial applications by supporting
    multiple accounts to different services, such as being able to communicate with
    users on different Instant Messaging services using a single application like
    Gaim.'
