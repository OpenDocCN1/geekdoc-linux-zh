  md: '# 7


    # OpenOffice


    In this chapter we discover the OpenOffice.org suite. OpenOffice.org (http://openoffice.org)
    is a free, but fully-featured suite of office applications for word processing,
    databases, spreadsheets and presentations. We look at the main applications, see
    how they compare with other office suites and learn enough to get started using
    the applications.


    Like the Ubuntu community, OpenOffice.org is supported, maintained and developed
    by the OpenOffice.org community. The suite includes the following applications:


    +   - Base – Database applications

    - Calc – Spreadsheet application

    - Draw – A vector based drawing program

    - Impress – Presentation software'
  merge: -1
  pgno: 132
- img_proc: true
  md: '+   - Math – Mathematical formulae editor

    - Writer – Word processing software.


    Only the main four applications (Writer, Calc, Impress and Base) are pre-installed
    on Ubuntu and are available from the "Office" sub-menu of the "Applications" menu.


    # ## Base


    Base is the database application from the OpenOffice.org suite and is launched
    from the "OpenOffice.org Database" short-cut from the "Office" sub-menu. The application
    provides several sophisticated tools for working with databases from an easy to
    use interface, as shown in Figure 7-1. It allows the creation and editing of forms,
    reports, and queries, either with a server based database (such as dBASE, MySQL
    or Oracle) or a local database file (using HSQLDB or Microsoft Access).'
  merge: -1
  pgno: 133
- img_proc: true
  md: '![](img/93a96bd5075527285b151804f3a5c28f_134_0.png)


    # Figure 7-1 OpenOffice.org Base


    When launched, Base starts a wizard to step you through either creating a new
    database or opening an existing file, as shown in Figure 7-2.'
  merge: -1
  pgno: 134
- img_proc: true
  md: '![](img/93a96bd5075527285b151804f3a5c28f_135_0.png)


    # ## Figure 7-2 Database Wizard


    When the wizard is displayed, select the "New Database" option and click the "Next"
    button. The application will then ask if you wish to register the database and
    open it, as can be seen in Figure 7-3. Ensure these options are selected and click
    "Finish". You are then prompted to name the database.'
  merge: -1
  pgno: 135
- img_proc: true
  md: '![](img/93a96bd5075527285b151804f3a5c28f_136_0.png)


    # Figure 7-3 Database Wizard


    Registering the database allows it to be accessible to the other OpenOffice.org
    applications such as Writer and Calc. Once the database is created as an OpenOffice.org
    database file (.odb), the main Base window is displayed where you can create tables,
    queries, forms and reports. The subject of databases is beyond the scope of this
    book, so to learn more, OpenOffice.org offers extensive documentation at http://documentation.openoffice.org/manuals/index.html.


    # Calc


    OpenOffice.org Calc has numerous analysis, charting and decision-making features
    with over 300 functions for statistical, financial and mathematical operations.
    Calc also'
  merge: -1
  pgno: 136
- img_proc: true
  md: 'includes a Scenario Manager allowing “what if” analysis, and enables the generation
    of 2-D and 3-D charts which can be integrated into other OpenOffice.org documents.


    Like the other applications, Calc will open and use Microsoft Excel workbooks
    or export spreadsheets to Adobe''s Acrobat (.pdf) or the Internet''s Hyper Text
    Markup (.html) standards. The application can be launched from the “OpenOffice.org
    Spreadsheet” shortcut on the “Office” submenu and can be seen in Figure 7-4.


    ![](img/93a96bd5075527285b151804f3a5c28f_137_0.png)


    Figure 7-4 OpenOffice.org Calc'
  merge: -1
  pgno: 137
- img_proc: true
