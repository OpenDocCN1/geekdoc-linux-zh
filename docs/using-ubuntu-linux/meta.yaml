    allows you to choose an effect for the transition between each slide, as shown
    in Figure 7-8. Click "Create" to create your blank presentation once you have
    made your selection.


    The Impress window is split into three main sections, the slides pane on the left-hand
    side contains thumbnails of the slides in your presentation. This pane allows
    you to organise, delete, rename or copy the individual slides. In the middle of
