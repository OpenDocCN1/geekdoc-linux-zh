    "podcasts". As we have seen, Ubuntu has the tools to play either local media files
    such as home videos or music, or to stream the media such as Internet Radio stations
    or video clips, and can even download the files automatically for you such as
    podcasts. You have also now discovered the major applications that are included
    as standard with Ubuntu, however there are many more available through the "Add/Remove
    Applications" utility for you to'
