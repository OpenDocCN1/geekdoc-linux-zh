    ### 图3-2 选项菜单

    ![](img/93a96bd5075527285b151804f3a5c28f_54_0.png)

    如图3-2所示的选项菜单，无需登录即可让系统进入睡眠、关闭或重启计算机。在多语言环境中，还可以通过该菜单切换语言。此外，用户可以选择会话，以此在登录时选择桌面会话的类型。例如，Ubuntu桌面的默认桌面环境是GNOME，但也可以安装KDE桌面环境（如Kubuntu预装的），并通过选项菜单中的“会话”选项选择登录该桌面而非GNOME。

    要登录系统，请在用户名字段输入安装时设置的用户名，然后按回车键。登录框会随即变为密码框；输入密码后按回车键即可完成登录。


    ### 图3-2 Ubuntu桌面

    ![](img/93a96bd5075527285b151804f3a5c28f_56_0.png)

    Ubuntu的桌面名为GNOME，是一款流行的UNIX及Linux桌面环境。如图3-3所示，它的顶部边缘是菜单栏（或称“顶部面板”），底部边缘是任务栏（或称“底部面板”）。菜单栏左侧有三个菜单：

    - 应用程序

    - 位置

    - 系统


    ### 应用程序菜单

    如图3-4所示，应用程序菜单会通过子菜单列出所有基于GNOME的应用程序。

    ![](img/93a96bd5075527285b151804f3a5c28f_57_0.png)


    ### 图3-4 应用程序菜单

    这些子菜单包含工具类、游戏、办公应用、多媒体应用和图像编辑应用。后续章节会详细介绍这些应用，各子菜单如下：

    - 附件——实用工具和小程序

    - 游戏——打发空闲时光的趣味游戏

    - 图形——图像编辑类应用

    - 互联网——网络及通信类应用

    - 办公——OpenOffice办公套件

    - 影音——多媒体应用

    - 添加/删除——应用程序包管理工具


    ### 位置菜单

    如图3-5所示，位置菜单列出了可用于浏览文档、连接其他系统或加载CD/DVD光盘的选项。

    ![](img/93a96bd5075527285b151804f3a5c28f_59_0.png)


    ### 图3-5 位置菜单

    该菜单包含以下应用和快捷方式，同时还有一个子菜单，提供了最近使用文档的快捷访问入口：

    - 主文件夹——快捷打开文件浏览器，定位到用于存储文件的个人主目录

    - 桌面——快捷打开文件浏览器，显示桌面文件

    - 计算机——快捷打开文件浏览器，显示可移动存储设备和硬盘驱动器

    - CD/DVD创建器——用于刻录CD或DVD光盘的工具

    - 网络——快捷打开文件浏览器，显示网络位置

    - 连接到服务器——用于建立与服务器的网络连接以传输文件

    - 搜索文件——查找文件的工具

    - 最近文档——子菜单，提供最近使用文档的快捷访问入口


    ### 系统菜单

    最后，系统菜单包含系统配置工具、在线帮助快捷方式以及系统关机相关的子菜单，如图3-6所示。

    ![](img/93a96bd5075527285b151804f3a5c28f_61_0.png)


    ### 图3-6 系统菜单

    该菜单包含以下选项：

    - 偏好设置——自定义系统的工具集合

    - 管理——系统管理工具集合

    - 帮助与支持——在线Ubuntu帮助中心

    - 关于GNOME——GNOME桌面的相关信息

    - 关于Ubuntu——Ubuntu操作系统的相关信息

    - 退出……——用于注销、切换用户、锁定屏幕或关闭计算机

    偏好设置子菜单包含用于自定义系统及桌面的工具，可用来修改鼠标、键盘等设备的设置，启用屏幕保护程序，或自定义桌面背景与颜色。管理子菜单列出了系统维护相关工具，例如配置语言、创建新用户账户、配置系统更新等。


    ### 菜单栏图标

    系统菜单旁有三个图标（同样如图3-6所示），分别是：

    - Firefox——启动“Firefox”网页浏览器的图标

    - Evolution——启动“Evolution”电子邮件和日历应用的图标

    - 帮助——在线Ubuntu帮助中心的图标


    ### 通知区域

    顶部面板最右侧的区域称为“通知区域”，该区域会显示可能需要关注的应用或工具的图标，如图3-7所示。

    ![](img/93a96bd5075527285b151804f3a5c28f_63_0.png)


    ### 图3-7 通知区域

    例如，当Ubuntu检测到有新的安全更新需要安装时，该区域会出现图标提示。点击该图标会启动更新管理器。该区域通常会显示以下内容：

    - 网络管理器——启动网络管理器小工具的图标，用于配置网卡

    - 声音——快速调节音量的快捷方式

    - 日期与时间——显示当前日期和时间

    - 关机——用于关闭、重启或注销计算机的图标

    点击通知区域的条目会弹出菜单或选项列表。例如，左键单击网络管理器图标会显示子菜单，可用于启用/禁用网卡、启动网络管理器小工具手动配置网卡，或连接到无线网络。点击声音图标则可以调节音量。你可以尝试点击这些图标查看可用选项。


    ### 编辑菜单栏

    可以根据需求添加或删除菜单栏条目来编辑菜单栏。要删除条目，只需将光标移至图标或菜单上，右键单击鼠标，此时会弹出菜单，可供你修改菜单或图标的属性，或彻底删除该条目。

    > 请确认你真的要删除该条目！

    如果右键单击菜单的空白区域，会弹出窗口，允许你向菜单栏添加新条目，或恢复误删的条目。这些条目包括添加自定义菜单，或显示天气、股票报价的工具。你可以尝试添加一些条目，之后右键单击对应条目即可设置相关选项。


    ### 底部面板

    屏幕底部的面板最左侧有一个图标，可用于最大化隐藏的窗口；右侧有一个图标，可用于切换“工作区”。工作区是独立的桌面视图，允许你打开不同的窗口，通过单击对应工作区图标即可快速切换。最左侧还有一个“回收站”图标，单击它会打开文件浏览器，显示已删除的项目。当你选中文件或文件夹后按删除键，或通过菜单选择“移至删除项目文件夹”选项时，项目不会被永久删除，只会被移至删除项目文件夹。要彻底删除项目，请右键单击“回收站”图标，然后在菜单中选择“清空回收站”。底部面板还会实时显示所有已打开的窗口列表，窗口最小化后，单击底部面板中的窗口标题即可恢复该窗口。

    ![](img/93a96bd5075527285b151804f3a5c28f_65_0.png)


    ### 管理文件

    如图3-9所示，Ubuntu使用“文件浏览器”（有时也称为Nautilus）来整理和查找目录及文件。可以通过“位置”菜单上的“主文件夹”快捷方式启动文件浏览器，启动后会默认打开你的“主”目录，这是用于安全存储所有文件的个人目录。该目录位于“/Home”目录下，名称与你的用户名相同。如果同一台Ubuntu计算机有多个用户，每个用户都拥有独立的专属主目录，仅本人有权限访问。

