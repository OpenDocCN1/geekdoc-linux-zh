    - DTD

    - 实体

    - 字符串

    - 标签


    前景色：

    背景色：

    （帮助）（关闭）


    ### Tomboy 笔记

    Tomboy（http://www.gnome.org/projects/tomboy）是一款笔记应用，可用于创建、管理和存储笔记。

    # 图5-10 Tomboy 笔记


    该应用运行时，会在顶部面板的通知区域添加一个小图标，通过点击该通知区域图标打开下拉菜单并选择“新建笔记”，即可快速便捷地创建新笔记。此外，用户也可以通过“搜索所有笔记”窗口的“文件”菜单创建新笔记。

    在新建笔记中直接输入文本即可，还可通过笔记工具栏的“文本”按钮下拉菜单对文本进行格式化，如图5-10所示。关闭笔记后，它会与其他笔记一同存储，后续可通过下拉菜单或“搜索所有笔记”窗口再次访问。要删除笔记，可点击“编辑”菜单中的“删除”选项。

    这款应用非常适合存放大量后续需要查阅的自由格式文本，这类文本往往体量较小，无需单独新建文件或OpenOffice文档存储。应用内置的搜索功能可让你后续轻松检索信息，快速找到所需内容。和之前提到的文本编辑器一样，Tomboy
    笔记也支持“插件”，软件开发者可通过插件轻松为应用添加新功能。这些插件包括：支持从“Evolution”邮件客户端创建笔记、将笔记保存为网页HTML文件，以及查看与当前活动笔记相关联的其他笔记。这些插件可通过工具栏按钮的“工具”下拉菜单使用。


    ## 总结

    本节我们初步了解了Ubuntu系统中预装的诸多应用，其中包括简单易用的内置计算器、功能强大的磁盘使用分析器等工具。下一章我们将介绍图形类应用，学习如何管理、创建和编辑数字图像。


    ## 6 图形应用

    如前文所述，Ubuntu系统预装了大量应用，本章将介绍其中专用于图形处理的相关应用。这些应用提供了导入、扫描、管理和编辑照片、图片所需的各类工具。要启动单个图形应用，可进入“应用程序”菜单下的“图形”子菜单。


    ### F-Spot 照片管理器

    F-Spot（http://f-spot.org）是一款个人照片管理工具，支持导入、整理、打印、邮件发送、备份，甚至编辑你的照片。

    首次启动该应用时，它会提示你从已连接的相机或备份DVD等其他文件夹中导入图片。

