    Clicking on the file system button will start a scan on the entire file system
    which may take some time. Once the scan is complete, the left-hand pane will display
    a tree of the directory structure starting at the “root” or “/” directory and
    listing all directories immediately under the root directory. Each sub-directory
    is shown with the size, number of contents and the percentage that this directory
    makes up of the total.


    Each directory can be expanded or collapsed by toggling the small triangle next
    to the directory name. This will cause the sub-directories to be displayed along
    with their details.


    The right-hand pane displays the graphical representation of the statistics from
    the left-hand pane. The centre of the graphic is the root directory of the scan
    and fanning out from the centre is each of the subdirectories until the entire
    directory is shown. The size of each ring or block is in proportion to the size
    of the directory.


