  pgno: 141
- img_proc: true
  md: 'When launched, the application will open the new presentation wizard, as shown
    in Figure 7-6.


    > If you don''t want to be prompted with this wizard each time you start the application
    or create a new file, simply tick the "Do Not Show This Wizard Next Time" check
    box.


    ![](img/93a96bd5075527285b151804f3a5c28f_142_0.png)


