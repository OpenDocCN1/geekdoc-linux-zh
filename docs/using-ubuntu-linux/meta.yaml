    > 输入几个字符确认键盘工作正常，确保你所用语言或地区的特殊字符/符号显示正常。确认所有功能都符合预期后，再次点击“下一步”按钮继续。

    ### **图2-6 选择键盘布局**

    ![](img/93a96bd5075527285b151804f3a5c28f_42_0.png)

