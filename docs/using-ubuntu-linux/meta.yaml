    ## 配置打印机设置

    打印机工具可以从“系统”菜单的“系统管理”子菜单中启动，可用于安装打印机并配置其设置。

    ### 配置

    ![](img/93a96bd5075527285b151804f3a5c28f_86_0.png)

    > **图4-11 打印机**


    要安装打印机，请确保打印机已连接到计算机且已开机，然后双击打印机工具中的“新打印机”图标，如图4-11所示。系统随后会自动搜索适用于您打印机的正确驱动程序。一旦打印机被识别，“添加打印机”向导将自动打开。

    ![](img/93a96bd5075527285b151804f3a5c28f_87_0.png)

    > **图4-12 添加打印机（打印机类型）**


    请确保正确识别到目标打印机，且本地或网络连接打印机的设置正确，如图4-12所示（若设置不正确请修改），然后点击“下一步”按钮。从列表中选择最合适的驱动程序，再次点击“下一步”，为打印机命名，如有需要可添加描述和位置备注。最后点击“应用”按钮安装打印机驱动程序。此时您的打印机将显示在打印机窗口中。您可以通过点击打印机，然后在“编辑”菜单中选择“属性”来修改打印机属性，这将打开属性窗口，您可以在其中设置默认打印机分辨率、纸张大小和方向，如图4-13所示。点击“打印测试页”按钮验证打印机是否工作正常。

    ![](img/93a96bd5075527285b151804f3a5c28f_88_0.png)

    > **图4-13 打印机属性**


    ## 配置时间和日期

    如果您的计算机已连接到互联网，可以配置Ubuntu通过对比互联网上的服务器时间，自动为您计算机设置正确的时间和日期。这些服务器会通过对比原子钟校准自身时间，随后使用网络时间协议（NTP）与其他服务器和客户端计算机共享这些精确的时间信息。NTP是一种不同计算机操作系统均使用的标准协议，可用于自动、精确地维护系统内部时钟。

    要配置计算机实现该功能，请从“系统”菜单的“系统管理”选项中选择“时间和日期”工具。

    ### 配置

    ![](img/93a96bd5075527285b151804f3a5c28f_90_0.png)

    > **图4-14 时间和日期设置**


    从配置下拉菜单中选择“与互联网服务器保持同步”，随后系统会提示您确认安装NTP软件。点击“安装NTP支持”安装该软件，并根据屏幕提示完成安装。NTP支持安装完成后，您将返回“时间和日期”工具界面，“与互联网服务器保持同步”选项已被勾选。关闭这个小程序后重启计算机，计算机启动时以及运行过程中会定期自动校准时间。


    ## 安装软件

    通过“添加/删除应用程序”工具（有时也称为“新立得”）可以轻松安装免费软件，如图4-15所示。您可以从“应用程序”菜单的“添加/删除...”选项中启动该工具。

    ![](img/93a96bd5075527285b151804f3a5c28f_91_0.png)

    > **图4-15 添加/删除应用程序**


    ### 配置

    点击“首选项”按钮可以配置Ubuntu安装软件的来源。Ubuntu针对不同的软件来源使用以下术语：

    - Main – Canonical Ltd支持的开源软件

    - Universe – Ubuntu社区支持的开源软件

    - Restricted – 专有驱动程序

    - Multiverse – 受版权保护，但通常免费使用的软件

    - Source Code – 软件开发过程中使用的代码

