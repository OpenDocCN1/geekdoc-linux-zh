    ## Using Ubuntu Linux

    # PART 1

    ## An Introduction to Ubuntu Linux

    ## 1 Introduction

    To provide a background on the Ubuntu operating system, it is necessary to give
    a brief history lesson on the UNIX and GNU/Linux operating systems. This chapter
    hopes to provide you with a little background knowledge to explain how Ubuntu
    has evolved from its UNIX ancestors and GNU/Linux cousins. It will also go on
    to explain the philosophy behind Ubuntu, and explain the many derivatives of the
    most user-friendly GNU/Linux operating system that is available today.

    ## A Brief History

    ### UNIX

    The UNIX operating system was originally born in the late 1960s from research
    carried out by AT&T Bell Telephone Laboratories on the Multics project. This project,
    meaning Multiplexed Information and Computing Service, was a joint collaboration
    of Bell Labs, General Electric and the Massachusetts Institute of Technology.
    The aim of the project was to provide a reliable "time-sharing" operating system
    for a large computer which could be used by numerous users. Early attempts proved
    complex and unsuccessful and a small team from the original project broke away
    and rewrote the operating system for a smaller system. The project was renamed
    UNICS for Uniplexed Information and Computing Service, somewhere along the way
    this name was changed to UNIX. By the early 1970s the UNIX operating system had
    started to be used within AT&T, and was made available to Universities, the United
    States Government and some commercial organisations under a licence that included
    the source code of the operating system. By the late 1970s, the operating system
    had begun to be used extensively as an academic tool, and as the graduate students
    left to join commercial organisations they wished to continue using the UNIX OS.
    This resulted in companies being set up (such as Sun Microsystems and Santa Cruz
    Operation or SCO) and developing their own versions under licence from AT&T. Today,
    many large computer systems around the world run the mature, reliable and secure
    operating system from companies such as Sun Microsystems, HP and IBM.

    ## The GNU Project and Linux

    In 1983, Richard Stallman launched the GNU Project (http://www.gnu.org) to develop
    a UNIX-like operating system which was free to use. Stallman was a developer at
    the Artificial Intelligence Lab at MIT, and was the inventor of the EMACS editor.
    The project was named GNU (pronounced guh-noo) to be a recursive acronym for “GNU''s
    Not UNIX”. He had strongly held beliefs that all software should be free, which
    had been formed from his years at MIT in the 1970s when the limited software in
    the academic environment was developed and distributed freely. By the 1980s and
    the commercialisation of the UNIX operating system, GNU was born to provide an
    operating system and suite of applications that could again be freely distributed.
    In 1985 the Free Software Foundation (http://www.fsf.org) was formed primarily
    to raise money to aid the development of the GNU project. In 1991, development
    of the GNU system was still in progress and it was not yet available. However,
    Linus Torvalds had developed a UNIX-compatible kernel (the central or core part
    of an operating system) and named it Linux. This was combined with the GNU system
    in 1992 to create the GNU/Linux system which is the ancestor of the many “Linux”
    (more correctly called GNU/Linux) based operating systems available today.

    ## Ubuntu

    The Ubuntu operating system is named after an African word (pronounced oo-BOON-too)
    which loosely means “humanity to others” or “I am what I am because of who we
    all are”. The Ubuntu operating system aims to bring this ideal to the software
    world. Or, more simply, this is summed up as “Linux for Human Beings”. The operating
    system was first started in April 2004 by Mark Shuttleworth, a South African Internet
    entrepreneur, who put together a small team of open source developers with the
    aim of releasing a user-friendly and free operating system for all. Quoting the
    Ubuntu Community (http://www.ubuntu.com/community/ubuntu-history/philosophy),
    the operating system is based on the following philosophy or belief:

    - Every computer user should have the freedom to download, run, copy, distribute,
    study, share, change and improve their software for any purpose, without paying
    licensing fees.

    - Every computer user should be able to use their software in the language of
    their choice.

    - Every computer user should be given every opportunity to use software, even
    if they work under a disability.

    The first release was launched in October 2004 and was named version 4.10. It
    was a development of an existing GNU/Linux distribution called Debian (http://www.debian.org)
    but had the aim of providing a more user-friendly system than other GNU/Linux
    based systems at the time. Debian was started by Ian Murdock in 1993 and was the
    name of one of many GNU/Linux versions, its aim was to provide a repository of
    free GNU software that was collected, packaged and supported. Ubuntu has a commitment
    of regular six-monthly releases and these are named slightly differently to the
    other software releases. All releases are named from the year and month of release,
    so version 4.10 was released in the tenth month of 2004. At the time of writing
    the current release is version 7.04, released in April 2007. Along with the unique
    version numbering, the Ubuntu operating system has code names for each operating
    system release. As the initial v4.10 release was an early development it was nicknamed
    “Warty Warthog”. The current development release is codenamed “Gutsy Gibbon” and
    is due for release in October 2007, to be officially known as “Ubuntu 7.10”.

    ## Ubuntu Features

    Many people might question why yet another GNU/Linux release was needed, as there
    are many already available from commercial organisations such as Red Hat and Novell,
    as well as free versions such as Slackware. Along with the belief of free software
    for all, including developing countries, the Ubuntu system had the aim of a fully
    featured and user-friendly operating system, as many of the existing free or commercial
    versions were very powerful but aimed at technical users.

    Ubuntu was therefore designed to be as user friendly as any commercial operating
    system such as Microsoft Windows or Mac OS X. It was also designed to be usable
    and secure straight after installation. So the system is pre-installed with the
    most common applications users will need, such as:

    - A suite of applications for word processing, spreadsheets, databases and presentations

    - Internet tools for web browsing, email and instant messaging

    - Graphics tools for editing and managing pictures

    - Multimedia tools for playing videos and music.

    Since security has become of great importance in recent years, the Ubuntu system
    was also designed to be as secure as possible without lengthy configuration. It
    therefore has the aim to provide only the tools and services required for a workstation
    and aims to disable by default facilities that are usually not required. This
    doesn''t mean it lacks functionality; simply the functionality must be enabled
    when required so that the system is kept as secure as possible. To further enhance
    security, the system supports automatic detection of security updates and will
    prompt the user when they are available. Of course, this security feature is also
    on by default so that systems are kept secure without the user needing to configure
    it.'
