- md: "## Welcome to Ubuntu 7.04, Feisty Fawn!\n\nThe Ubuntu project is built on the\
    \ ideas enshrined in the Ubuntu philosophy: that software should be available\
    \ free of charge, that software tools should be usable by people in their local\
    \ language, and that people should have the freedom to customize and alter their\
    \ software in whatever way they need.\n\n### Getting Help with Ubuntu:\n\nThere\
    \ are many ways to get help with Ubuntu. Access Ubuntu's guides and documentation\
    \ by selecting \"Help\" from your System menu. You can also find help from the\
    \ official Ubuntu documentation website and the community contributed documentation.\
    \ If you prefer some human contact, you can use the mailing lists, web forums,\
    \ or chat with the community on Freenode IRC Channel: #ubuntu.\n\n### Firefox\n\
    \nFirefox uses a \"tabbed\" interface that allows you to either open a single\
    \ web page per window, or to open a new page into a \"tab\" which will be shown\
    \ along the top of the browser window under the address bar, and can be seen in\
    \ Figure 8-12. This allows you to open multiple web pages without cluttering your\
    \ desktop with multiple windows. It also has the concept of \"Live Bookmarks\"\
    , which are displayed under the address bar but above the tabs. This feature allows\
    \ you to \"bookmark\" automatically updating RSS Internet feeds. These are feeds\
    \ that push updates to your browser. When you create a Live Bookmark for a feed,\
    \ you receive a drop-down menu that lists all the articles at the site in real\
    \ time. As the articles change on the feed, the drop-down menu will automatically\
    \ be updated. There are very few settings that need to be changed to use Firefox.\
    \ If you are connected to the Internet, Firefox can be used straight away to access\
    \ the Web, and it functions like any other browser that you may have used. To\
    \ search for a particular subject, enter a description into the search box in\
    \ the top right corner of the window and the search results will be returned by\
    \ the Google search engine. Alternatively, simply enter the web address into the\
    \ address bar to go straight to a web site. You may wish to customise some of\
    \ the settings, and these can be changed by selecting \"Preferences\" from the\
    \ \"Edit\" menu. On the Main preferences screen as shown in Figure 8-13, you can\
    \ change your home page by entering a web site address into the home page field.\
    \ Also on the same screen, you can change the default location to save files when\
    \ they are downloaded.\n\n### Figure 8-13: Firefox Preferences\n\nOn the Privacy\
    \ page, as shown in Figure 8-14, you may also want to change how long Firefox\
    \ remembers the websites you have visited. You can also clear your web usage information\
    \ on this page by clicking the \"Clear Now\" button. Alternatively, if you click\
    \ the check box to clear your private data when you close Firefox, it will be\
    \ removed automatically after each session.\n\n### Firefox Preferences\n\n- **History**\n\
    \  - [x] Remember visited pages for the last `9` days.\n  - [x] Remember what\
    \ I enter in forms and the search bar\n  - [x] Remember what I've downloaded\n\
    - **Cookies**\n  - [x] Accept cookies from sites\n  - Keep until: `they expire`\n\
    \  - Buttons: `Exceptions...`, `Show Cookies...`\n- **Private Data**\n  - [ ]\
    \ Always clear my private data when I close Firefox\n  - [x] Ask me before clearing\
    \ private data\n  - Buttons: `Settings...`, `Clear Now...`\n\n### Figure 8-14:\
    \ Firefox Privacy Settings\n\nFinally, on the Network tab of the Advanced page\
    \ you can select how much data is cached or stored after visiting each site. This\
    \ feature makes websites load faster if the data or pictures haven't changed since\
    \ the last visit, and is very useful if you have a slow connection to the Internet.\
    \ However, for security reasons or to save disk space, you may want to reduce\
    \ the size of the cache used. Also on this tab are the \"Connections\" settings,\
    \ as shown in Figure 8-15. These settings allow you to connect through a proxy\
    \ server. This is a server that routes your web page requests for you. This can\
    \ be helpful for both security and performance reasons. Check with your ISP to\
    \ find out if you need to configure proxy server settings. Firefox makes it very\
    \ easy to install plug-ins which you may need to view certain web pages. For instance,\
    \ many pages use the Adobe Flash plug-in for web page animations. As this plug-in\
    \ is copyrighted, it is not pre-installed in Ubuntu. However, whenever you navigate\
    \ to a web page that requires a particular plug-in, Firefox will prompt that a\
    \ plug-in is required by displaying a bar and button stating \"Install Missing\
    \ plug-ins\". When you click the button, Firefox will search for the plug-in and\
    \ step you through the process of installing it.\n\n### Gaim Internet Messenger\n\
    \nGaim is an Instant Messaging application that can be used to send and receive\
    \ real-time text messages to users of AIM, MSN, Yahoo, IRC and many other Instant\
    \ Messaging applications. It has recently been renamed to Pidgin (http://pidgin.im),\
    \ but at the time of writing, the new version is not yet available for Ubuntu.\
    \ Like many of the applications installed on Ubuntu, when you run Gaim for the\
    \ first time it starts an assistant in order to configure it with an existing\
    \ Instant Messenger (IM) account. You need to create an account with an Instant\
    \ Message service before you can configure Gaim. The advantage of this application\
    \ is it can support multiple accounts on different services, so if you have friends\
    \ and family using different applications, you can create an account on each service\
    \ and configure Gaim to use all the services simultaneously. Currently, Gaim supports\
    \ the following IM platforms:\n\n- AIM\n- Gadu-Gadu\n- GroupWise\n- ICQ\n- IRC\n\
    - Jabber\n- MSN\n- Simple (SIP)\n- Yahoo\n\nOnce you have an IM account, start\
    \ Gaim from the \"Internet\" sub-menu of the \"Applications\" menu. You will then\
    \ be shown the Gaim welcome screen, as shown in Figure 8-16.\n\n### Figure 8-16:\
    \ Gaim Account Set-up\n\n> The exact details you will need to enter will vary\
    \ according to the type of the account, as many settings will be pre-configured\
    \ for the popular types of service.\n\n### Add Account\n\n#### Tab Options\n|\
    \ Tab | |\n|-----|-----|\n| Basic | |\n| Advanced | |\n\n#### Login Options\n\
    | Setting | Value |\n|---------|-------|\n| Protocol | Yahoo |\n| Screen name\
    \ | Jon |\n| Password | ●●●●●● |\n| Local alias | |\n| Remember password | [x]\
    \ |\n\n#### User Options\n| Setting | Status |\n|---------|--------|\n| New mail\
    \ notifications | [ ] |\n| Use this buddy icon for this account: | [ ] |\n| Action\
    \ Buttons | Cancel, Save |\n\n### Figure 8-17: Gaim Add Account\n\nOnce you have\
    \ configured the account, click the \"Save\" button. The application will then\
    \ try to connect to the service. If it is unsuccessful, select the account in\
    \ the \"Accounts\" window and click Modify to review the settings you have entered.\
    \ Once the account successfully connects you will need to add friends to the application\
    \ so that you can contact them and see their status as on-line (available), off-line\
    \ or busy. You can add friends by choosing \"Add Buddy\" from the \"Buddies\"\
    \ menu, as shown in Figure 8-18.\n\n### Figure 8-18: Add Buddy\n\n> If you are\
    \ not sure of the account name and the service your buddies are using, just ask\
    \ them.\n\nSelect the account from the drop-down list of your configured accounts\
    \ and enter the user's account name or screen name. Then give the user an \"Alias\"\
    \ which Gaim will use to display in the application window or \"Buddy List\".\
    \ Whenever you try to add an account to your buddy list, or if someone adds you\
    \ to their buddy list, the user being added will be asked to authorise or approve\
    \ being entered into the other person's buddy list. This is to ensure that only\
    \ users that you approve of can monitor your on-line status."
  mdcn: '

    ## 欢迎使用 Ubuntu 7.04（活泼小鹿）！

    Ubuntu 项目基于 Ubuntu 理念所蕴含的核心思想构建：软件应当免费向用户提供，软件工具应当支持用户以本地语言使用，且用户应当拥有按照自身需求随意定制、修改软件的自由。


    ### 获取 Ubuntu 帮助：

    获取 Ubuntu 帮助的方式有很多。你可以通过系统菜单中的「帮助」选项查阅 Ubuntu 的指南与文档，也可以前往 Ubuntu 官方文档网站和社区贡献的文档获取支持。如果你倾向于人工咨询，可以通过邮件列表、网络论坛，或在
    Freenode IRC 频道的 #ubuntu 房间与社区用户交流。


    ### Firefox 浏览器

    Firefox 采用「标签页」界面，既支持每个窗口仅打开单个网页，也支持将新页面在地址栏下方的浏览器窗口顶部以「标签页」形式展示，具体样式可参考图 8-12。该设计让你无需打开多个窗口即可同时浏览多个网页，不会占用过多桌面空间。此外
    Firefox 还支持「实时书签」功能，实时书签会显示在地址栏下方、标签页上方，该功能支持将自动更新的 RSS 网络订阅源添加为书签。这类订阅源会主动向你的浏览器推送更新内容，当你为某个订阅源创建实时书签后，会得到一个下拉菜单，可实时列出该网站的所有文章，订阅源内容更新时，下拉菜单也会自动同步更新。


    Firefox 的默认设置无需太多调整即可使用。如果你已连接互联网，直接打开 Firefox 就可以上网，操作方式和绝大多数你使用过的浏览器一致。若要搜索特定内容，可在窗口右上角的搜索框中输入关键词，搜索结果会由谷歌搜索引擎提供。此外你也可以直接在地址栏输入网址，快速跳转到对应网站。如果你需要自定义部分设置，可通过「编辑」菜单中的「偏好设置」选项进行调整。如图
    8-13 所示的主偏好设置界面中，你可以在主页输入框中输入网址来修改浏览器主页；同一界面还可以修改文件下载时的默认保存路径。


    ### 图 8-13：Firefox 偏好设置

    如图 8-14 所示的隐私页面中，你还可以调整 Firefox 记录你访问过的网站的时长。在该页面点击「立即清除」按钮即可清除你的网页使用记录。此外，如果你勾选了关闭
    Firefox 时自动清除私人数据的选项，每次浏览器关闭后相关数据都会被自动删除。


    ### 火狐偏好设置 - **历史记录**

    - [x] 记住最近 `9` 天内访问过的页面

    - [x] 记住我在表单和搜索栏中输入的内容

    - [x] 记住我下载过的内容

    - **Cookie**

    - [x] 接受网站发送的 Cookie

    - 保存期限：`直到过期`

    - 按钮：`例外...`、`显示 Cookie...`

    - **私人数据**

    - [ ] 关闭 Firefox 时始终清除我的私人数据

    - [x] 清除私人数据前向我确认

    - 按钮：`设置...`、`立即清除...`


    ### 图 8-14：Firefox 隐私设置

    最后，在高级页面的「网络」标签页中，你可以设置访问每个网站后缓存或存储的数据量。如果网站的数据或图片自上次访问后没有变化，该功能会让网站加载速度更快，在网络连接速度较慢时非常实用。但出于安全考虑或节省磁盘空间的目的，你也可以缩小缓存的使用容量。如图
    8-15 所示，该标签页还包含「连接」设置项，通过这些设置你可以通过代理服务器连接网络——代理服务器会代替你转发网页请求，出于安全和性能两方面的考虑，使用代理服务器都有一定帮助。你可以联系你的网络服务提供商（ISP），确认是否需要配置代理服务器设置。


    Firefox 安装插件的流程非常简便，如果你需要查看某些特定网页，可能就需要安装对应插件。例如很多网页会使用 Adobe Flash 插件来展示网页动画。由于该插件受版权保护，因此
    Ubuntu 系统不会预装它。但当你访问需要特定插件的网页时，Firefox 会弹出提示栏和「安装缺失插件」按钮，提示你需要安装插件。点击该按钮后，Firefox
    会自动搜索对应插件，并引导你完成安装流程。


    ### Gaim 网络即时通讯工具

    Gaim 是一款即时通讯应用，可用于向 AIM、MSN、雅虎、IRC 及其他众多即时通讯应用的用户发送和接收实时文本消息。这款应用最近已更名为 Pidgin（http://pidgin.im），但截至本文撰写时，新版本尚未支持
    Ubuntu 系统。和 Ubuntu 预装的多数应用一样，首次运行 Gaim 时会启动配置助手，引导你绑定已有的即时通讯（IM）账号。你需要在配置 Gaim
    前，先注册对应即时通讯服务的账号。这款应用的优势是支持绑定不同服务的多个账号，如果你的亲友使用不同的即时通讯工具，你可以分别为每个服务注册账号，再配置 Gaim
    同时使用所有服务。目前 Gaim 支持以下 IM 平台：

    - AIM

    - Gadu-Gadu

    - GroupWise

    - ICQ

    - IRC

    - Jabber

    - MSN

    - Simple (SIP)

    - Yahoo


    当你拥有 IM 账号后，可以从「应用程序」菜单的「互联网」子菜单中启动 Gaim，随后会显示 Gaim 的欢迎界面，具体样式可参考图 8-16。


    ### 图 8-16：Gaim 账号设置界面

    > 你需要输入的具体信息会因账号类型不同而有所差异，针对主流服务类型，多数设置都已预先配置完成。


    ### 添加账号

    #### 标签页选项

    | 标签页 | |

    |--------|--------|

    | 基础 | |

    | 高级 | |


    #### 登录选项

    | 设置项 | 值 |

    |--------|--------|

    | 协议 | 雅虎 |

    | 显示名称 | Jon |

    | 密码 | ●●●●●● |

    | 本地别名 | |

    | 记住密码 | [x] |


    #### 用户选项

    | 设置项 | 状态 |

    |--------|--------|

    | 新邮件通知 | [ ] |

    | 为该账号使用此联系人图标： | [ ] |

    | 操作按钮 | 取消、保存 |


    ### 图 8-17：Gaim 添加账号界面

    配置完账号后，点击「保存」按钮，应用会尝试连接对应服务。如果连接失败，你可以在「账号」窗口中选择该账号，点击「修改」按钮检查你输入的设置。账号成功连接后，你需要向应用中添加好友，这样才能联系他们，并查看他们的在线（有空）、离线或忙碌状态。你可以通过「好友」菜单中的「添加好友」选项添加好友，具体界面可参考图
    8-18。


    ### 图 8-18：添加好友界面

    > 如果你不确定好友的账号名称和使用的服务，可以直接询问对方。从已配置账号的下拉列表中选择对应账号，再输入用户的账号名或显示名称，最后为用户设置一个「别名」，Gaim
    会在应用窗口或「好友列表」中显示该别名。当你尝试将账号添加到好友列表、或是有人将你添加到他们的好友列表时，被添加的用户会收到授权请求，需要确认是否允许对方将自己加入好友列表。这是为了确保只有你认可的用户才能查看你的在线状态。

