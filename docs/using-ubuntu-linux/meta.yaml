    \ Windows XP Media Center 2005\n- BP567 How To Set Up Your Home or Small Business\
    \ Network\n- BP571 Getting More From Your Microsoft Xbox 360\n- BP578 Microsoft\
    \ Windows Vista – An Ultimate Guide\n\n## About this Book\nWelcome to Using Ubuntu\
    \ Linux, and thank you for buying this book. We hope it will be an invaluable\
    \ source of information and guidance in order for you to set up, configure and\
    \ discover the secure, feature rich, and easy to use operating system that is\
    \ Ubuntu Desktop.\n\nMost books on GNU/Linux based operating systems have been\
    \ aimed at technical computer users, or users who have wanted to increase their\
    \ technical knowledge. While writing this book, we have aimed to provide a resource\
    \ for the everyday, non-technical user, who just wants to use their computer as\
    \ the tool it was designed for.\n\nThis book will try to avoid long lists of manual\
    \ commands that must be typed at a flashing prompt, unless they are absolutely\
    \ necessary. Thankfully when the subject has been voted as the most user friendly\
    \ Linux based operating system (voted Most User-Friendly Linux Distribution, and\
    \ Best Linux/Open Source Distribution, for the second year running, at the 2006\
    \ UK Linux and Open Source Awards), long confusing commands are very rare and\
    \ can easily be avoided.\n\nWe hope you enjoy the journey.\n\n## Conventions\n\
    Throughout this book, you will see a number of information boxes, bounded with\
    \ either a double line like this...\n> DESIGNATING A WARNING\n...\n> DESIGNATING\
    \ A NOTE, POINT OF INTEREST OR USEFUL TIP\n...\n\nProcedures and walkthroughs\
    \ may be shown as numerical lists, like this:\n1. Step 1\n2. Step 2\n\nAll diagrams\
    \ and Figures have a two-digit reference number containing the Chapter number,\
    \ followed by the Figure number within that Chapter. For example, Figure 1-1 represents\
    \ the first Figure in Chapter 1.\n\n## About the Authors\n### Jon Rolfe\nJon Rolfe\
    \ has been an IT professional for over 12 years, working for some of the largest\
    \ global IT services companies such as Fujitsu and EDS. During his career he has\
    \ specialised in Microsoft based solutions and provided design, architecture and\
    \ development experience for large enterprise solutions for numerous blue-chip\
    \ organisations and government departments.\n\nJon has an extensive knowledge\
    \ of IT systems, with experience spanning from the early Sinclair ZX81, through\
    \ PCs, Macs, Windows and Linux. Jon lives in Hampshire and has an active interest\
    \ in IT, consumer electronics, digital photography and motor sport. When he gets\
    \ the chance he also enjoys Mountain Biking and Skiing. He can be contacted through\
    \ the Using Ubuntu website (http://UsingUbuntu.com) or emailed at Jon@UsingUbuntu.com.\n\
    \n### Andrew Edney\nAndrew Edney has been an IT consultant for over 12 years and\
    \ over the course of his career has worked for a range of high-tech companies,\
    \ such as Microsoft, Hewlett Packard and Fujitsu Services. He has a wide range\
    \ of experience in virtually all aspects of Microsoft's computing solutions, having\
    \ designed and architected large enterprise solutions for government and private\
    \ sector customers.\n\nOver the years, Andrew has made a number of guest appearances\
    \ at major industry events, presenting on a wide range of Information Systems\
    \ subjects, such as an appearance at the annual Microsoft Exchange Conference\
    \ in Nice where he addressed the Microsoft technical community on Mobility Computing.\n\
    \nAndrew is currently involved in numerous Microsoft beta programmes, including\
    \ next generation Windows operating systems and next generation Microsoft Office\
    \ products, and actively participates in all Windows Media Center beta programmes.\
    \ On top of all of this, Andrew runs his own IT consulting company, Firebird Consulting\
    \ and has currently authored eight books and is busy working on more. Andrew lives\
    \ in Wiltshire with his partner, Katy, and their two cats and can be reached at\
    \ andrew@firebirdconsulting.co.uk.\n\n## Acknowledgements\nWe would like to offer\
    \ our thanks to our family and friends for their support and assistance during\
    \ the long months of writing this book. In addition, we would also like to offer\
    \ our thanks to all the staff at Babani for publishing our book.\n\n> To my father\
    \ for his 70<sup>th</sup> birthday\n> — Jon\n\n## Trademarks\nUbuntu and Canonical\
    \ are registered trademarks of Canonical Ltd. All other brand names and product\
    \ names used in this book are recognised as trademarks, or registered trademarks\
    \ of their respective companies.\n\n## Contents\n- Conventions\n## PART 1 An Introduction\
    \ to Ubuntu Linux\n### 1. Introduction\n- A Brief History\n  - UNIX\n  - The GNU\
