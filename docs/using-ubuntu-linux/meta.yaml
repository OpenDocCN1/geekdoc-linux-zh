  merge: -1
  pgno: 142
- img_proc: true
  md: '![](img/93a96bd5075527285b151804f3a5c28f_143_0.png)


    # Figure 7-7 Presentation Wizard


    Select a presentation type under the slide design option, as shown in Figure 7-7.
    With the "Preview" option checked, a preview of the slide will appear in the wizard
