    ## Babani Computer Books: Using Ubuntu Linux

    Ubuntu Linux is a free and easy-to-use operating system. It was designed to be
    usable and secure straight after installation and comes complete with:

    - A suite of applications for word processing, spreadsheets, databases and presentations.

    - Internet tools for web browsing, e-mailing and instant messaging.

    - Graphics tools for editing and managing pictures.

    - Multimedia tools for playing videos and music.


    Ubuntu Linux can offer a viable alternative to Microsoft''s Windows or the Mac
    OS operating systems. This book is an invaluable source of information and guidance
    to help the reader install, configure and use Ubuntu Linux. It provides a simple
    to understand resource for the everyday, non-technical user who just wants to
    use their computer, rather than refer to a highly technical manual like so many
    of the other Linux books.


    The text is divided into four major sections:

    ### Introduction

    Covering the history and philosophy behind Ubuntu and detailing the different
    versions and additional features.

    ### Setup

    Detailing the installation and configuration of the operating system including
    the set up of networks and printers.

    ### Applications

    Covering the various features of the ''OpenOffice'' suite, ''FireFox'' web browser
    and e-mailing using ''Evolution Mail''. Also covers how to listen to music and
    watch videos.

    ### Troubleshooting

    Hints and tips on getting the most from Ubuntu Linux, including on line resources
    for help and guidance and what to do when things go wrong.


    This book is highly practical and written both for the beginner and those with
    a little more experience.

    - Beginners

    - Intermediate

    - Advanced


    BP 586

    ISBN 978-0-85934-586-6

    £7.99'
