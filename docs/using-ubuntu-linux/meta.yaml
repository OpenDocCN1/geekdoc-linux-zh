    web sites.


    ## Creating New Users

    Finally, you may need to create additional user accounts for family or colleagues.
    These allow each user to store their information privately, and configure their
    desktop environment for their own preferences. Open the "Users and Groups" utility
    from the "Administration" option from the "System" menu. You will be prompted
    to enter your password to confirm the administrative task and then the "Users
    Settings" utility as shown in Figure 4-19 will be displayed.


    ![](img/93a96bd5075527285b151804f3a5c28f_97_0.png)

    **Figure 4-19 Users Settings**

    Simply click the "Add User" button to start to create a new user account, and
    the "New User Account" form will be displayed as shown in Figure 4-20.


    ## Configuration

    ![](img/93a96bd5075527285b151804f3a5c28f_98_0.png)

    **Figure 4-20 New User Account**

    Fill out the details on the form and select the type of user to be created from
    the "Profile" option. Select either "Administrator" for a user who can administrate
    and change the computer settings, or "Desktop User" for a normal user account
    who can use the computer but not change its configuration. Click "OK" when you
    have completed filling in the options and then close the utility.


    ## Restricted Drivers

    Ubuntu does not install copyrighted or unsupported software or drivers during
    the installation. You might therefore discover that some features of your system
    are not fully configured after the installation. For instance, you might find
    that Ubuntu does not include 3D acceleration for graphics or support certain encryption
    standards on wireless network cards. However, Ubuntu makes it easy to enable these
    features using proprietary drivers via the "Restricted Drivers Manager" utility
    from the "Administration" sub-menu of the "System" menu.


    ![](img/93a96bd5075527285b151804f3a5c28f_100_0.png)

    **Figure 4-21 Restricted Drivers Manager**

    In order for this computer to function properly, Ubuntu may be using driver software
    that cannot be supported. Because the software is proprietary, it cannot easily
    be changed to fix any future problems.


    | Driver | Enabled | Status |

    | :--- | :--- | :--- |

    | Atheros Hardware Access Layer (HAL) | ☑ | In use |


    If the installation detected that you need to install some additional drivers,
    they will be listed in the utility and can be installed by simply ticking the
    check box next to the driver, as can be seen in Figure 4-21. All that you have
    to do then is confirm the installation and follow any prompts (which may vary
    depending on what is being installed) to complete the installation. If necessary,
    you may be prompted to reboot the system to complete the installation and enable
    the new driver.


    ## Summary

    We have now set up your network card, checked for system updates and installed
    some software. You will now have a fully operational version of Ubuntu. Take a
    little time to investigate your system, and in the next section of the book we
    will start to discover the installed applications and configure the system for
    email and browsing the Internet.


    # PART 3

    # Applications

    ## Accessories

    In this section of the book we will be looking at the applications included with
    the Ubuntu operating system, and will take you step-by-step, through setting up
    each of the applications where necessary. This chapter will start by covering
    the Ubuntu accessories. These are small utilities and applications that can be
    launched from the "Accessories" sub-menu of the "Applications" menu.


    ### Calculator

    As the name suggests, this utility is the built-in calculator. It''s launched
    from the "Calculator" shortcut of the "Accessories" sub-menu.


    ![](img/93a96bd5075527285b151804f3a5c28f_105_0.png)

    **Figure 5-1 Calculator**

    When launching the utility, it appears that the calculator is a very simple application.
    However, the display mode is controlled from the "View" menu which enables the
    calculator to be switched between the following modes:

    - Basic

    - Advanced

    - Financial

    - Scientific


    (as shown in Figure 5-1). Also controlled from the "View" menu are various useful
    options such as the ability to show trailing zeros, thousands separator, left-to-right
    or arithmetic precedence and the memory registers which allow up to 10 numbers
    to be stored in one of the memory positions.


    ### Character Map

    The Character Map application (http://live.gnome.org/Gucharmap), launched from
    the "Character Map" shortcut, is a small application that allows you to browse
    the characters available in a particular font, and to insert special characters
    into a text document, as shown in Figure 5-2.


    ![](img/93a96bd5075527285b151804f3a5c28f_107_0.png)

    **Figure 5-2 Character Map**

    This allows you to access special characters that may be available in a font but
    are not shown on your keyboard. These may include special accented characters,
    mathematical symbols or punctuation marks. As Ubuntu is a multi-language system,
    Character Map displays characters in all the installed language scripts using
    the "Unicode" character set. This is a standard character set devised to include
    all of the characters used in all the world''s written languages. The Character
    Map window shows a display area which can be changed between showing the characters
    available in the current script, and a character details tab which shows details
    of an individual character. When a character or symbol is double-clicked, it is
    entered into the "Text to copy" text field allowing you to create a text or symbol
    string that can be copied to another document.


    ### Dictionary

    The dictionary utility, started from the "Dictionary" shortcut from the "Accessories"
    sub-menu, is an online dictionary utility that allows you to search for words
    and terms using an Internet dictionary source, as shown in Figure 5-3.


    ![](img/93a96bd5075527285b151804f3a5c28f_108_0.png)

    **Figure 5-3 Dictionary**

