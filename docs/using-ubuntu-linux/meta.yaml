    - 数学 – 数学公式编辑器

    - Writer – 字处理软件。仅有Writer、Calc、Impress和Base这四个核心应用会预装在Ubuntu系统中，可通过“应用程序”菜单下的“办公”子菜单找到并使用。


    ### Base

    Base是OpenOffice.org套件中的数据库应用，可通过“办公”子菜单中的“OpenOffice.org 数据库”快捷方式启动。该应用提供了多种功能强大的数据库处理工具，且界面易用，如图7-1所示。它支持基于服务器的数据库（如dBASE、MySQL或Oracle）以及本地数据库文件（使用HSQLDB或Microsoft
    Access）的表单、报表和查询的创建与编辑。

    ![](img/93a96bd5075527285b151804f3a5c28f_134_0.png)

    # 图7-1 OpenOffice.org Base


    启动Base后，会弹出向导，引导你完成新建数据库或打开现有文件的操作，如图7-2所示。

    ![](img/93a96bd5075527285b151804f3a5c28f_135_0.png)

    # 图7-2 数据库向导


    打开向导后，选择“新建数据库”选项并点击“下一步”按钮。随后应用会询问你是否要注册并打开该数据库，如图7-3所示。请确认勾选这两个选项，再点击“完成”。接着系统会提示你为数据库命名。

    ![](img/93a96bd5075527285b151804f3a5c28f_136_0.png)

    # 图7-3 数据库向导


    注册数据库后，Writer、Calc等其他OpenOffice.org应用就可以访问该数据库。一旦数据库以OpenOffice.org数据库文件（.odb格式）创建完成，就会显示Base主窗口，你可以在其中创建表、查询、表单和报表。本书不会过多涉及数据库相关知识，如需了解更多，可访问OpenOffice.org提供的丰富文档：http://documentation.openoffice.org/manuals/index.html


    ### Calc

    OpenOffice.org Calc拥有大量分析、图表和决策功能，内置超过300个适用于统计、财务和数学运算的函数。Calc还提供了方案管理器，支持“假设分析”功能，可生成2D和3D图表，这些图表可以插入到其他OpenOffice.org文档中。和其他应用一样，Calc可以打开并使用Microsoft
    Excel工作簿，也可以将电子表格导出为Adobe的Acrobat（.pdf）格式，或互联网超文本标记（.html）标准格式。该应用可通过“办公”子菜单中的“OpenOffice.org
    电子表格”快捷方式启动，如图7-4所示。

    ![](img/93a96bd5075527285b151804f3a5c28f_137_0.png)

    # 图7-4 OpenOffice.org Calc


    如图7-4所示，Calc和其他电子表格应用类似，带有标准工具栏、格式工具栏、公式栏以及列标题和行标题。窗口底部、单元格下方是“工作表”选项卡，通过它可以实现在同一个文档中创建多个工作表，只需点击对应的选项卡就能切换到相应工作表。Calc文件的操作方式和其他应用一致，可通过文件菜单中的“打开”或“保存”选项完成操作。Calc默认使用自有的OpenOffice文件格式，如表7-1所示：

    | 类型 | 格式扩展名 |

    | --- | --- |

    | 电子表格 | .ods |

    | 电子表格模板 | .odt |

    # 表7-1 OpenOffice.org Calc文件格式


    不过除标准Calc格式外，它还支持打开多种不同类型的电子表格，如表7-2所示：

    | 电子表格类型 | 格式扩展名 |

    |------------------|------------------|

    | 数据交换格式 | .dif |

    | dBase | .dbf |

    | 超文本标记语言 | .htm和.html文件 |

    | Lotus 1-2-3 | .wk1、.wks和.123 |

    | Microsoft Excel 2003 XML | .xml |

    | Microsoft Excel 4.x–5.0/95版 | .xls、.xlw和.xlt |

    | Microsoft Excel 97/2000/XP版 | .xls、.xlw和.xlt |

    | OpenOffice.org 1.x | .sxc和.stc |

    | Pocket Excel | .pxl |

    | Quattro Pro 6.0 | .wb2 |

    | 富文本格式 | .rtf |

    | StarCalc格式 | .sdc和.vor |

    | SYLK | .slk |

    | 文本 | .csv和.txt |

    # 表7-2 Calc支持的电子表格格式


    Calc中的电子表格可通过“文件”菜单中的“另存为”选项、“导出为PDF”选项，或“文件”菜单中的“发送”选项以邮件形式导出，支持导出为上述多种格式。


    ### Impress

    OpenOffice.org Impress是套件中的演示应用，是一款多媒体工具，支持制作带有动画、特效、音视频的演示文稿。可通过“OpenOffice.org
    演示文稿”快捷方式启动。

    ![](img/93a96bd5075527285b151804f3a5c28f_140_0.png)

    # 图7-5 OpenOffice.org Impress


    如图7-5所示，Impress的界面和其他幻灯片演示软件非常相似，很容易上手。它默认使用原生的OpenOffice.org文件格式保存文件，如表7-3所示：

    | 类型 | 格式扩展名 |

    |-------|------------------|

    | 演示文稿 | .odp |

    | 演示文稿模板 | .otp |

    # 表7-3 OpenOffice.org Impress文件格式


    不过它也支持打开并转换多种其他商业应用制作的演示文稿，如表7-4所示：

    | 演示文稿类型 | 格式扩展名 |

    |--------------------|------------------|

    | Microsoft PowerPoint 97/2000/XP版 | .ppt、.pps和.pot |

    | OpenOffice.org 1.x | .sxi和.sti |

    | StarDraw和StarImpress | .sda、.sdd、.sdp和.vor |

    | CGM（计算机图形元文件） | .cgm |

    # 表7-4 Impress支持的演示文稿格式


    启动该应用后，会打开新建演示文稿向导，如图7-6所示。

    ![](img/93a96bd5075527285b151804f3a5c28f_142_0.png)

    # 图7-6 演示文稿向导

    > 如果不想每次启动应用或新建文件时都弹出该向导，只需勾选“下次不再显示此向导”复选框即可。


    该向导提供了三个选项：新建空白演示文稿、打开模板、打开现有文件。选择新建空白演示文稿选项，点击“下一步”。

    ![](img/93a96bd5075527285b151804f3a5c28f_143_0.png)

    # 图7-7 演示文稿向导


    如图7-7所示，在幻灯片设计选项下选择演示文稿类型。勾选“预览”选项后，选择幻灯片设计时，向导中会显示该幻灯片的预览效果。“输出介质”选项会根据使用的媒体类型优化演示文稿，选择“屏幕”后点击“下一步”按钮。

    ![](img/93a96bd5075527285b151804f3a5c28f_144_0.png)

    # 图7-8 演示文稿向导


    当你选择将幻灯片放映设置为屏幕显示时，向导的最后一步会让你选择每张幻灯片之间的切换效果，如图7-8所示。完成选择后点击“创建”，即可生成空白演示文稿。


    Impress窗口分为三个主要区域：左侧的幻灯片缩略图面板会显示演示文稿中所有幻灯片的缩略图，你可以通过该面板对单张幻灯片进行整理、删除、重命名或复制操作。


    窗口中间是工作区，工作区顶部有五个选项卡，通过这些选项卡可以切换工作区的视图：

    ## OpenOffice

    - 普通视图：用于对单张幻灯片进行格式设置和设计

    - 大纲视图：以大纲形式展示每张幻灯片的主题和列表，用于编辑标题、副标题和主题

    - 备注视图：可为每张幻灯片添加演示备注，这些备注不会在实际放映时显示

    - 幻灯片浏览视图：展示所有幻灯片的缩略图，用于调整幻灯片顺序或在选中的幻灯片之间添加切换效果

    - 讲义视图：支持打印幻灯片用作讲义。


    任务面板还分为以下区域：

    - 母版：用于定义演示文稿使用的幻灯片样式

    - 版式：可为每张幻灯片选择20种标准版式之一

    - 自定义动画：可为单张幻灯片的选中元素选择要应用的动画效果

    - 幻灯片切换：可选用56种切换效果应用到幻灯片之间。

