  md: '# Internet


    feeds. These are feeds that push updates to your browser. When you create a Live
    Bookmark for a feed, you receive a drop-down menu that lists all the articles
    at the site in real time. As the articles change on the feed, the drop-down menu
    will automatically be updated.


    There are very few settings that need to be changed to use Firefox, if you are
    connected to the Internet, Firefox can be used straight away to access the Web,
    and it functions like any other browser that you may have used. To search for
    a particular subject, enter a description into the search box in the top right
    corner of the window and the search results will be returned by the Google search
    engine. Alternatively, simply enter the web address into the address bar to go
    straight to a web site.


    You may wish to customise some of the settings, and these can be changed by selecting
    "Preferences" from the "Edit" menu. On the Main preferences screen as shown in
    Figure 8-13, you can change your home page by entering a web site address into
    the home page field. Also on the same screen, you can change the default location
    to save files when they are downloaded.'
