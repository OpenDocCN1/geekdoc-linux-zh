    | 驱动 | 启用状态 | 当前状态 |

    | :--- | :--- | :--- |

    | Atheros Hardware Access Layer (HAL) | ☑ | 使用中 |


    如果安装程序检测到你需安装额外的驱动，这些驱动会显示在该工具中，只需勾选驱动旁的复选框即可安装，如图4-21所示。之后你只需确认安装，并按照（会随安装内容变化的）提示完成安装即可。如有必要，系统会提示你重启以完成安装并启用新驱动。


    ## 总结

    现在我们已经完成了你的网卡设置、系统更新检查以及部分软件的安装。你现在已经拥有一个可完全运行的Ubuntu系统了。请花点时间熟悉你的系统，在本书下一章中，我们将介绍已安装的应用程序，并配置系统以支持收发邮件和浏览互联网。


    # 第三部分

    # 应用程序

    ## 附件

    本章将介绍Ubuntu操作系统自带的应用程序，必要时会带你一步步完成各应用的配置。本章首先介绍Ubuntu的附件类应用。这类应用是体积较小的工具或程序，可以从“应用程序”菜单的“附件”子菜单中启动。


    ### 计算器

    顾名思义，这是一款内置计算器工具，可从“附件”子菜单的“计算器”快捷方式启动。

    ![](img/93a96bd5075527285b151804f3a5c28f_105_0.png)

    **图5-1 计算器**

    刚打开该工具时，你会觉得计算器是非常简单的应用。不过，显示模式可通过“视图”菜单切换，计算器支持以下模式：

    - 基础

    - 高级

    - 财务

    - 科学（如图5-1所示）。

    此外，“视图”菜单中还有多项实用选项，比如显示末尾零、千位分隔符、从左到右计算顺序、算术优先级，以及最多可存储10个数字的内存寄存器。


    ### 字符映射表

    [字符映射表应用](http://live.gnome.org/Gucharmap)可从“字符映射表”快捷方式启动，它是一款小型应用，支持浏览特定字体中的可用字符，以及将特殊字符插入文本文档，如图5-2所示。

    ![](img/93a96bd5075527285b151804f3a5c28f_107_0.png)

    **图5-2 字符映射表**

    借助该应用，你可以使用字体中存在但键盘上无法直接输入的特殊字符。这些字符包括带变音符号的特殊字符、数学符号或标点符号等。由于Ubuntu是多语言系统，字符映射表会使用“Unicode”字符集显示所有已安装语言脚本的字符。Unicode是旨在收录全世界所有书面语言所用字符的标准字符集。字符映射表窗口包含一个显示区域，可在当前脚本的可用字符显示和显示单个字符详情的标签页之间切换。双击某个字符或符号后，它会自动填入“要复制的文本”输入框，你可以在此拼接需要复制到其他文档的文本或符号字符串。


    ### 词典

    词典工具可从“附件”子菜单的“词典”快捷方式启动，它是一款在线词典工具，支持使用互联网词典源搜索单词和术语，如图5-3所示。

    ![](img/93a96bd5075527285b151804f3a5c28f_108_0.png)

    **图5-3 词典**

    > “因此，正如苍鹰振翅高飞，祈祷也直抵上帝的双耳。——乔叟”

    > - 来源

    > - 源代码

