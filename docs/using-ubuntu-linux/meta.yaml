    ![](img/93a96bd5075527285b151804f3a5c28f_155_0.png)

    ### Figure 8-2 ekiga.net Account


    A SIP account allows other people to find you and make voice calls to your computer.
    If you already have a SIP account from another application, you can enter the
    account and password on this screen and click "Forward". If you have never used
    a Voice over IP (VoIP) application before, click on the "Get an ekiga.net SIP
    account" hyperlink to create a new account, or alternatively go to the http://www.ekiga.net/
    website. On the website, click the "Subscribe" link and complete the form to create
    a SIP account, as shown in Figure 8-3.


    ![](img/93a96bd5075527285b151804f3a5c28f_156_0.png)

    ### Figure 8-3 ekiga.net registration


    Once you have created an Ekiga SIP account, or using the details of existing account,
    enter the account name and password into the wizard and click "Forward". You will
    then be asked how you are connected to the Internet; this allows the application
    to optimise its quality settings to make the best use of your Internet connection.
    Select your Internet connection type, either "56K Modem" for a dial-up connection
    (or "narrow band"), "ISDN", "xDSL/Cable" for an ADSL or Cable modem connection
    (or "broadband"), or "T1/LAN" for a direct connection to the Internet. When you
    click "Forward" the wizard will automatically determine how your Internet connection
    is made and will configure the application for the most appropriate connection.
    Confirm the recommendations made by Ekiga and click "Forward" in the wizard. The
    application then checks how your sound system works on Ubuntu and will ask you
