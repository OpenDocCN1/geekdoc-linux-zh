    ekiga.net free SIP service. If you do not have an ekiga.net SIP address yet, you
    may first create an account below. This will provide a SIP address that allows
    people to call you. You may skip this step if you use an alternative SIP service,
    or if you would prefer to specify the login details later.

    **[Get an ekiga.net SIP account](http://www.ekiga.net)**

    ☐ I do not want to sign up for the ekiga.net free service

    **[Cancel]**

