    > 通过乌班图支持论坛搜索内容并向乌班图社区发布问题，是获取帮助的好方法。

    如果主帮助页面未列出所需主题，可以使用工具栏上的搜索栏搜索特定主题，“帮助主题”、“前进”和“后退”按钮可帮助您浏览文档，并返回主页面。当您点击主页面的任一主题时，左侧会打开一个索引面板，显示各个子主题，主题的第一页会显示在主窗口中。遇到乌班图问题时，乌班图帮助中心是您首选的求助渠道，因为它包含以下内容：

