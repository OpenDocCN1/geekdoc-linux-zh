    # Internet


    Once you have a few friends in your buddy list, their status will be displayed,
    as shown in Figure 8-19. This allows you to see who is available to talk to. You
    can change your status, so you are not interrupted when you are busy, from the
    pop-up menu at the bottom of the buddy list window. To talk to a user who is available,
    simply double-click their name and type into the conversation window, as shown
    in Figure 8-20.


    ![](img/93a96bd5075527285b151804f3a5c28f_181_0.png)


    Figure 8-20 Conversation window


    You can only be contacted by someone while the Gaim application is running, so
    the Gaim windows can be closed without actually closing the application. While
    Gaim is in this state, it will add an icon in the notification area of the top'
  - '[PAGE 182]


    panel. To really close the application, right-click the icon and choose quit from
    the drop-down menu.


    # Summary


    You should now be able to send and receive emails, browse the Internet, and as
    long as you know other people with Instant Messaging or VOIP accounts, you can
    send text, voice or video messages in real time.


    Even though Ubuntu is a free operating system, we have found that it includes
    all the functionality of other expensive operating systems. In fact, due to the
    open source nature of the GNU/Linux platform, the applications available offer
    a greater level of flexibility than some commercial applications by supporting
    multiple accounts to different services, such as being able to communicate with
    users on different Instant Messaging services using a single application like
    Gaim.'
