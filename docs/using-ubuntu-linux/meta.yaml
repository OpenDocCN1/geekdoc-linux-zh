    # Figure 7-8 Presentation Wizard


    When you select a slideshow to be displayed on the screen, the final wizard screen
    allows you to choose an effect for the transition between each slide, as shown
    in Figure 7-8. Click "Create" to create your blank presentation once you have
    made your selection. The Impress window is split into three main sections, the
    slides pane on the left-hand side contains thumbnails of the slides in your presentation.
    This pane allows you to organise, delete, rename or copy the individual slides.
    In the middle of the window is the workspace, this has five tabs along the top
    of the pane. These tabs allow you to change the view of the workspace:


    ## OpenOffice

    - Normal view is used to format and design an individual slide

    - Outline view shows the topics and lists of each slide in an outline format and
    is used to edit titles, headings and topics

    - Notes view allows presentation notes to be added to each slide, these are hidden
    from the actual presentation view

    - Slide sorter view shows thumbnails of each slide and is used to rearrange the
    order or add transitions between selected slides

    - Handout view enables the printing of slides for a handout.


    The task pane is also split into the following sections:

    - Master pages is used to define the slide style to be used for the presentation

    - Layout allows the selection of one of 20 standard layouts to be selected for
    each individual slide

    - Custom Animation enables the selection of animations to be applied to a selected
    element of an individual slide

    - Slide transition enables you to choose out of 56 transitions to be applied between
    slides.'
