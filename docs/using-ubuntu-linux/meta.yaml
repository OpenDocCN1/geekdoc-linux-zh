    ## 迁移文档和设置

    选择你想要导入的任意账户，并为每个账户填写下面的表单。安装完成后，这些账户的文档和设置即可使用。如果你不想导入任何账户，可以不选择任何项，直接进入下一页。

    没有适合导入的用户或操作系统。请创建一个用户来导入所选账户：

    第5步（共7步）- 取消、后退、下一步

    ### 图2-10 迁移文档和设置

    ![](img/93a96bd5075527285b151804f3a5c28f_47_0.png)

    如果你不想迁移用户设置，直接点击下一步即可。否则，请在“迁移文档和设置”对话框中选择一个用户，并为新的Ubuntu账户设置用户名和密码以使用这些设置，然后点击“下一步”。接下来，输入你的姓名、密码以及你希望为电脑设置的名字，如图2-11所示，然后点击“下一步”按钮。

    > 请务必设置复杂密码（例如由字母和字符混合组成），以确保计算机安全。

    ### 图2-11 输入用户详细信息

    ![](img/93a96bd5075527285b151804f3a5c28f_48_0.png)

