    当你完成演示文稿后，可以将其保存为OpenOffice.org文件，或是众多的专有文件格式之一。不过，Impress还支持通过点击「文件」菜单中的「导出」选项，将文件导出为Adobe
    Acrobat（.pdf）、超文本标记语言（.html），甚至是Macromedia Flash（.swf）动画格式。


    ## Writer

    OpenOffice.org Writer可通过「Office」子菜单中的「OpenOffice.org 文字处理」快捷方式启动。Writer是一款功能齐全的文字处理应用，拥有Microsoft
    Word这类商用软件的诸多功能，可用于创建信函、宣传册、报告和各类文档，如图7-9所示。如果你熟悉Word或WordPerfect这类应用，会立刻对上手的Writer感到十分熟悉。


    ![](img/93a96bd5075527285b151804f3a5c28f_147_0.png)


    ### 图7-9 OpenOffice.org Writer

    Writer的使用界面和其他文字处理软件非常相似，菜单栏下方是熟悉的工具栏，沿窗口顶部排列。通过文件菜单中的标准「打开」或「保存」选项即可轻松操作文件。Writer默认使用自身的OpenOffice文件格式，具体如表7-5所示：


    ### 表7-5 OpenOffice文件格式

    | 类型 | 格式扩展名 |

    |------|-------------------|

    | 文本文档 | .odt |

    | 文本模板 | .ott |

    | 主控文本文档 | .odm |


    需要注意的是，如果你与其他使用Microsoft Word等其他文字处理软件的用户共享文档，对方可能无法打开OpenOffice默认的文件格式。不过，Writer支持保存为专有格式（如Microsoft
    Word（.doc））或标准格式（如富文本格式（.rtf）、超文本标记语言（.html）和可扩展标记语言（.xml））。支持的全部文件格式如表7-6所示：


    ### 表7-6 支持的文件格式

    | 类型 | 格式扩展名 |

    |:---|:---:|

    | AportisDoc（Palm设备） | .pdb |

    | DocBook | .xml |

    | HTML文档（OpenOffice.org Writer） | .html和.htm |

    | Microsoft Word 2003 XML | .xml |

    | Microsoft Word 6.0、95及97/2000/XP | .doc |

    | OpenOffice.org 1.x 文本文档模板 | .stw |

    | OpenOffice.org 1.x 文本文档 | .sxw |

    | Pocket Word | .psw |

    | 富文本格式 | .rtf |

    | StarWriter 3.0、4.0及5.0 | .sdw |

    | StarWriter 3.0、4.0及5.0模板 | .vor |

    | 纯文本文档与编码文本 | .txt |


    你可以通过点击「文件」菜单中的「另存为...」选项，将文档导出为上述格式之一。此外，如果你经常和使用其他应用的用户交换文件，可以通过点击「工具」菜单中的「选项...」将Writer的默认保存格式设置为上述标准格式之一，如图7-10所示。


    ![](img/93a96bd5075527285b151804f3a5c28f_150_0.png)


    ### 图7-10 Writer选项

    许多文字处理软件都不支持直接导出为Adobe Acrobat（.pdf）文件，这是Writer的一大实用功能，你可以通过「文件」菜单中的「导出为PDF...」选项实现该功能。此外，Writer还可以连接你的邮件客户端，通过点击「文件」菜单中「发送」子菜单下的对应选项，直接在Writer应用内通过邮件发送文档。


    ## 总结

    OpenOffice.org提供了一套功能齐全的办公应用，可满足你日常办公的全部需求。正如我们之前介绍的，它不仅可以打开诸多商用软件的文件并与之兼容，还提供了一些商用软件没有的功能，例如导出为Adobe
    Acrobat格式。由于OpenOffice.org套件的功能非常丰富，足以单独成书，如果你想了解所有OpenOffice.org应用的完整功能列表、相关文档和教程，可以查阅OpenOffice.org社区提供的详细文档：http://documentation.openoffice.org/


    ## 互联网

    本章将介绍Ubuntu系统内置的网络应用，一步步教你配置这些应用，实现网页浏览、收发邮件、在线聊天以及通过宽带拨打免费语音电话。所有上述应用都可以在「应用程序」菜单的「网络」子菜单中找到。


    ### Ekiga 网络电话

    Ekiga（http://www.gnomemeeting.org）是一款开源的音视频会议应用，曾用名为「GnomeMeeting」。它支持运行在多个版本的GNU/Linux以及Windows操作系统上，可以和基于行业标准协议的同类应用（如Windows
    Messenger、IP电话、Gizmo Project和NetMeeting）互通。由于Skype这类专有应用并非基于开放协议，因此无法和Ekiga互通。


    ### 设置

    该应用配备了一款设置向导，会自动引导你完成账户创建流程，方便其他用户联系你，设置过程十分简单。首次启动该应用时，会弹出配置向导窗口，如图8-1所示。


    ![](img/93a96bd5075527285b151804f3a5c28f_154_0.png)


    ### 图8-1 首次配置向导

    点击「前进」按钮开始配置流程。在第一个界面中输入你的姓名，然后点击「前进」即可，如图8-2所示。

    **首次配置向导**

    **ekiga.net 账户 - 第3/10页**

    **请输入你的用户名：**

    **请输入你的密码：**

    > 用户名和密码用于登录你已有的ekiga.net免费SIP服务账户。如果你还没有ekiga.net的SIP地址，可以先在下方创建账户，获取的SIP地址可供他人呼叫你。如果你使用其他SIP服务，或是希望稍后填写登录信息，可以跳过此步骤。

    [获取ekiga.net SIP账户](http://www.ekiga.net)

    ☐ 我不想注册ekiga.net免费服务

    **[取消]** **[返回]**


    ![](img/93a96bd5075527285b151804f3a5c28f_155_0.png)


    ### 图8-2 ekiga.net账户

    SIP账户可供其他用户找到你，并向你的电脑发起语音呼叫。如果你已有其他应用的SIP账户，可在当前界面输入账户名和密码后点击「前进」。如果你从未使用过互联网电话（VoIP）应用，可点击「获取ekiga.net
    SIP账户」超链接创建新账户，也可以直接访问http://www.ekiga.net/网站。在该网站上点击「订阅」链接，填写表单即可创建SIP账户，如图8-3所示。


    ![](img/93a96bd5075527285b151804f3a5c28f_156_0.png)


    ### 图8-3 ekiga.net注册

    创建好Ekiga SIP账户后，或是已有账户信息的情况下，在向导中输入账户名和密码，点击「前进」。之后应用会询问你的互联网连接方式，以便优化音质设置，充分发挥你的网络性能。请选择你的网络连接类型：拨号上网（或窄带）选择「56K调制解调器」，ISDN连接选择「ISDN」，ADSL或有线调制解调器（或宽带）连接选择「xDSL/有线」，直连互联网则选择「T1/LAN」。点击「前进」后，向导会自动检测你的互联网连接方式，并配置为最合适的连接参数。确认Ekiga给出的推荐设置，在向导中点击「前进」即可。之后应用会检测Ubuntu系统的音频系统工作状态，要求你确认音频管理器的选项，如图8-4所示。Ekiga通常会自动选择正确的配置，点击「前进」确认即可。随后应用会要求你确认检测到的音频设备。

