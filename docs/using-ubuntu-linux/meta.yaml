    > 建议选择“向导”选项，系统将为你配置推荐的分区布局。如果你的电脑安装了多块硬盘，请在“向导”选项下选择对应的硬盘，然后点击“下一步”继续。

    ### 图2-7 选择分区方案

    ![](img/93a96bd5075527285b151804f3a5c28f_43_0.png)

    也可以将Ubuntu安装在现有操作系统旁边，而非覆盖原有系统。由于Ubuntu使用的硬盘格式与Windows不同，执行此操作前你需要先腾出硬盘上的可用空间。

