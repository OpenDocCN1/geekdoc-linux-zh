    occur while you are using Ubuntu. We will review the on-line help in Ubuntu and
    the installed applications, and also cover the resources on the Internet, including
    further documentation and help forums.


    # Ubuntu Help Centre


    The "Ubuntu Help Centre" is the on-line help manual that can be launched from
    the question mark icon on the top panel.'
