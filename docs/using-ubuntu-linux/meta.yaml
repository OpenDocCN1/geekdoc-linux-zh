- md: '## Figure 3-9 The File Browser

    The File Browser contains a menu bar allowing you to create new files and directories,
    or to create "Bookmarks" or shortcuts to other directories. It''s easy to navigate
    up and down through different directories by double-clicking the folders to navigate
    down, and using the "Up" button on the toolbar to navigate back up through the
    directory tree.


    Under the toolbar is the "Location Bar". This bar contains buttons for each folder
    in a directory tree, so you can also quickly jump to a directory by clicking the
    button in the bar. Down the left-hand side of the File Browser is the "Side Pane".
    This pane contains different information depending on what option is chosen from
    the pop-up menu on the top of the pane. This menu contains the following options:

    - **Places** – Lists removable media and your home directory

    - **Information** – Displays file and folder information as you select them in
    the file browser

    - **Tree** – Lists a directory tree as an alternative way of navigating your directory
    structure

    - **History** – Lists the directories you have been to

    - **Notes** – Allows you to type notes which are displayed when you return to
    the directory

    - **Emblems** – Tags which can be dragged and dropped on files or directories.


    Files and directories can be moved and deleted in a similar manner to other operating
    systems by dragging or dropping them, or copied by right-clicking the file and
    selecting "Copy" or by selecting "Copy" from the "Edit" menu. Files and directories
    can also be deleted by dragging them to the Waste Basket or selecting "Move to
    the Deleted items folder" from the "Edit" menu or even right-clicking the file
    and selecting "Move to the Deleted items folder". Files and directories are only
    permanently deleted when you choose to "Empty the Waste Basket" from the Waste
    Basket icon on the bottom panel.


    ### Using Removable Media

    When you insert removable media, such as a USB memory stick or blank CD or DVD
    disc, Ubuntu will place an icon for the media on your desktop and also on the
    "Places" menu, as shown in Figure 3-10.


    > Figure 3-10 Blank CD-R Media


    Files and directories can easily be copied by dragging or dropping them from the
    media to your home directory, or from your home directory to the removable media.
    If copying files to a USB flash memory device, it''s important to right-click
    the icon of the USB memory stick on the desktop and select ''Eject'' from the
    menu. This will write all the information to the memory stick and allow you to
    safely remove it from the computer. If you simply remove it without selecting
    ''Eject'', the data will not have been written to the memory. Similarly, with
    blank CD or DVD discs, once you have copied files to the disc, you must double-click
    the icon of the disc and select ''Write to disc'' from the ''File'' menu, as shown
    in Figure 3-11.


    ## Figure 3-11 Write to Disc


    ## Summary

    You should now have familiarised yourself with the GNOME desktop environment and
    recognised that the system is not too dissimilar to the Windows or Mac OS X systems
    to use. With what you have learned in this chapter, you should now be ready to
    copy your work backups from removable media (either USB disc, flash memory or
    CD or DVD) into your home directory.


    ## 4 Configuration

    We are now ready to configure your system so that you can connect to a network,
    set up your printer and create some additional user accounts. Once you have completed
    this chapter, your computer will be ready to use.


    ### Configuring Network Settings

    If your computer is connected to a wired network and your network settings are
    configured automatically by Dynamic Host Configuration Protocol (DHCP), your network
    connection will work without you having to configure any of the settings. You
    can safely skip the following instructions and go on to check for system updates
    later in this chapter.


    However, if you are using a wired network and your router or network is not configured
    for DHCP, or you are using a wireless network card, it will be necessary to configure
    them manually. The following sections guide you through the configuration steps.


    ### Wired Network

    In order to configure the network, left-click the mouse pointer over the computer
    icon in the Notification Area and select "Manual Configuration" in the pop-up
    menu. You will be prompted to enter your password, as shown in Figure 4-1.


    > Ubuntu will prompt for your password whenever an administrative action is performed.
    This is to ensure that you are performing the action and it is not being performed
    by any malware which is trying to compromise the security of your system.


    > Figure 4-1 Enter your password to perform administrative tasks


    Once your password is entered, the Network Settings utility will be displayed,
    as shown in Figure 4-2.


    ## Figure 4-2 Network Settings


    With the "Wired Connection" selected, click the "Properties" button.


    ## Figure 4-3 Settings for Interface


    On the Connections tabs, pull down the "Configuration" menu, as shown in Figure
    4-3, and either select "Static IP Address" or "Local Zeroconf network (IPv4 LL)".
    Choose "Static IP Address" if you want to connect to the Internet through a router
    and you know the correct address settings. Alternatively if you are on a small
    network and there is no Internet connection, you can choose the Local Zeroconf
    setting and Ubuntu will automatically choose an address in order to communicate
    with other computers that have also been configured the same way.


    To configure the address manually, enter the IP address, subnet mask and gateway
    address (default gateway or router address) and press "OK". The network settings
    will then be reconfigured. Next, select the "General" tab and enter the "domain
    name" for your local network, as shown in Figure 4-4.


    ## Figure 4-4 General Tab


    Then select the "DNS" tab, as shown in Figure 4-5 and enter the IP address of
    the DNS server for your network by clicking in the "DNS Servers" box and typing
    the IP address followed by return. If necessary, click the "Add" button to enter
    another address. You can also configure the local DNS zone to search by clicking
    the "Add" button and entering the local DNS domain in the "Search Domains" field.


    ## Figure 4-5 DNS Tab


    Finally, you can name the configuration by clicking the floppy disc icon and entering
    a name for the network settings. This is useful if you are using a laptop computer
    and need to connect to multiple networks that use different network settings.
    Each configuration can be saved and you can quickly select the correct configuration
    by selecting it from the "Locations" pull down menu.


    > Figure 4-6 Wireless Network Key Required


    ### Wireless Network

    Configuring a wireless network card is very similar to manually configuring a
    wired network. Left-click the computer icon in the Notification Area to display
    wireless networks that are available. Then select your wireless network name displayed
    in the menu. If your network is secured with encryption, you will be prompted
    to enter the Wireless Network Key.


    Select the type of wireless security you are using in the drop-down menu (either
    a Passphrase, Hex, ASCII or text string) as shown in Figure 4-6, and then enter
    the key in the text box. Finally, select the authentication method of Open system
    or Shared key and then click the "Login to Network" button to connect to the wireless
    network.'
