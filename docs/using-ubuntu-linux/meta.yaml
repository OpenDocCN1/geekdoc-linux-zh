    the button in the bar.


    Down the left-hand side of the File Browser is the "Side Pane". This pane contains
    different information depending on what option is chosen from the pop-up menu
    on the top of the pane. This menu contains the following options:


    +   - **Places** – Lists removable media and your home directory

    - **Information** – Displays file and folder information as you select them in
