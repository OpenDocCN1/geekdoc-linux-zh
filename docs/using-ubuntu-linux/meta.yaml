- img_proc: true
  md: '# Sound Juicer


    This application is used for extracting or "ripping" music from an audio CD and
    converting it to a digital audio file that can be played with the Rhythmbox or
    Totem applications. It can also be used to play CD audio discs directly on your
    computer. Sound Juicer can be seen in Figure 9-8.


    When a CD is loaded into your computers CD or DVD drive, Sound Juicer will try
    to automatically download the disc and track titles from an Internet database
    called MusicBrainz (http://www.musicbrainz.org). This allows the application to
    automatically name the audio files and assign properties (such as album title,
    track title, artist, etc) to the audio files so that they will be displayed when
    played. The CD is recognised by using its serial number and the positions and
    lengths of the tracks to match it against the free MusicBrainz database. Very
    occasionally this data may return more than one CD''s details, in which case Sound
    Juicer will ask you which data to use.


    > If the CD is not recognised at all, you can manually enter the information using
    the title, artist and genre text fields.'
  merge: -1
