    ## 引言

    经过三年的发展，Ubuntu正迅速成为事实上的免费GNU/Linux发行版。它获得了众多奖项和荣誉，其中包括：

    - 2007年5月获得《PC World》杂志颁发的“2007年百大产品”奖

    - 2007年5月被选中预装在戴尔新PC和笔记本电脑上

    - 2007年3月获得《PC Welt》杂志颁发的“编辑选择奖”

    - 2006年11月在Linux新媒体奖中荣获“最用户友好的Linux发行版”奖项

    - 2006年10月在英国Linux与开源奖项中连续第二年获得“最佳Linux/开源发行版”奖项

    ## Ubuntu 版本

    如今，Ubuntu拥有多个不同版本，每个版本都针对特定使用场景做了优化。

    ## Ubuntu 桌面版

    [Ubuntu Desktop](http://www.ubuntu.com)是操作系统的主要版本，不过该版本也分为不同类型。该版本基于名为GNOME的桌面环境，也是本书所基于的版本。不过，许多操作步骤和技巧同样适用于其他同样基于GNOME桌面环境的版本。

    ### Kubuntu

    不过，另一个名为Kubuntu的版本（http://www.kubuntu.org）会与主版Ubuntu同步发布。该版本基于名为KDE（K桌面环境）的不同桌面环境，因此支持为这个桌面环境开发的不同类别应用程序。

    ### Edubuntu

    Edubuntu（http://www.edubuntu.org）基于Ubuntu开发，但内置了一套面向儿童和教育的应用程序，其核心理念可概括为“面向青少年人类的Linux”！

    ### Xubuntu

    与Kubuntu类似，Xubuntu（http://www.xubuntu.org）基于Ubuntu系统，但采用Xfce桌面环境。这让系统拥有略有不同的视觉观感和操作体验，以及不同的应用程序套件。Xubuntu的主要优势在于，Xfce桌面环境比Ubuntu使用的GNOME环境占用更少的系统资源，因此非常适合老旧、性能较弱的硬件使用。

    ### Ubuntu Studio

    作为一个相对较新的发行版本，Ubuntu Studio（http://ubuntustudio.com）是面向媒体创作优化的Ubuntu桌面版。该系统针对音乐或视频编辑等对时间敏感的应用做了额外开发以避免延迟。它还预装了一套专门用于图形、视频和音乐编辑的应用程序。

    ### Ubuntu Server

    最后是Ubuntu Server（http://www.ubuntu.com)。顾名思义，该发行版针对服务器任务做了优化，可支持Web、邮件或数据库等服务器任务。为节省内存和资源，该版本不搭载桌面环境，因此必须通过命令行完成安装、配置和管理。

    ### Ubuntu 支持

    每个Ubuntu发行版都由Ubuntu社区开发，Ubuntu社区是由全球各地的开发者组成的团队，协作开发和更新Ubuntu操作系统。每个版本每6个月发布一次，Ubuntu社区承诺为每个版本提供至少18个月的支持。不过，偶尔也会发布被称为“长期支持”（LTS）的版本，比如Ubuntu
    6.06。这类版本的发布是为了避免用户频繁重新安装操作系统升级。长期支持版本的桌面版最低支持周期为3年，服务器版为5年。除了开发和修复补丁外，Ubuntu社区还会开发在线帮助资源，并提供免费的支持论坛供用户获取帮助和建议。该社区还得到商业公司Canonical
    Ltd的支持，该公司由**马克·沙特尔沃思**创立，为需要超出社区提供范围服务的用户和商业公司，提供针对这款自由操作系统的商业支持、培训和认证服务。

    ## 小结

    本章我们简要回顾了Ubuntu的发展历史，帮助大家了解Ubuntu的诞生背景，以及其基于GNU项目早期理念、为所有人提供免费、用户友好、功能丰富的操作系统的信念。在后续章节中，我们将学习如何安装操作系统，并亲自体验它的实际使用效果。

    ## 第二部分

    ## 第2章 安装配置

    在本章中，我们将迈出进入自由软件世界的第一步，在正式安装前先在电脑上测试Ubuntu。

    > 别担心，安装过程非常简单，耗时不会超过30分钟。

    ### 安装Ubuntu

    当你准备好试用Ubuntu后，首要任务是获取安装CD。你可以从Ubuntu官网（http://www.ubuntu.com/getubuntu/download）免费下载。下载的文件是ISO格式的CD镜像（CD行业标准文件格式），大多数CD刻录软件都可以将其刻录到空白CD上。如果你没有足够的宽带网络连接下载CD镜像，也可以从互联网上的多家公司处以较低价格购买Ubuntu安装CD（http://www.ubuntu.com/getubuntu/purchase）。

    > 安装前，务必备份你所有的文件（可以备份到CD、U盘或移动硬盘），因为安装过程会清空你的硬盘。

    ### 测试系统硬件

    Ubuntu的CD被称为“Live CD”，因为用户可以不将系统安装到电脑硬盘，直接从CD启动（或开机）进入Ubuntu桌面环境。这能让你测试电脑硬件的兼容性，也可以在覆盖原有操作系统前先体验Ubuntu。要从Live
    CD启动电脑，只需将CD插入CD-ROM驱动器并重启电脑。系统启动时应从CD启动并加载Ubuntu。如果没有出现这种情况，你可能需要在电脑开机后立刻选择“启动菜单”。通常会显示类似“按F12打开启动菜单”的提示，按下对应按键后就会显示启动菜单，如图2-1所示。


    ![](img/93a96bd5075527285b151804f3a5c28f_36_0.png)

    *图2-1 BIOS启动菜单*


    按下对应CD选项的数字键，系统就会开始加载Ubuntu桌面。加载过程中会显示包含多个选项的菜单，如图2-2所示。


    ![](img/93a96bd5075527285b151804f3a5c28f_37_0.png)

    *图2-2 Live CD启动菜单*


    从CD安装前，建议选择“检查CD是否存在缺陷”选项，确保镜像文件已正确刻录到CD中。使用上下方向键选择该选项后按回车即可。如果检测到缺陷，请取出CD并重启进入原有操作系统，将镜像文件刻录到另一张CD后重试。验证CD镜像无误后，选择“启动或安装Ubuntu”选项即可加载Ubuntu桌面操作系统。

    ### 初次运行设置

    系统加载过程中会显示Ubuntu“启动”画面和进度条。稍等片刻后就会显示Ubuntu桌面，如图2-3所示。


    ![](img/93a96bd5075527285b151804f3a5c28f_38_0.png)

    *图2-3 Ubuntu Live CD桌面*


    花些时间探索Ubuntu桌面，确认你的系统运行正常。从Live CD运行系统时速度会稍慢，因为CD驱动器的读写速度远低于硬盘。打开桌面上的示例文件夹，尝试打开一些示例文件，比如“Experience
    Ubuntu.ogg”文件，确认Ubuntu操作系统可以在你的系统上正常播放视频。

    ### 正式安装

    当你确认系统的键盘、鼠标、显示屏和声音都正常工作，并且已备份所有原有文件后，就可以开始安装新系统了。要开始安装，只需双击桌面上的“安装”图标。随后会显示安装欢迎界面，如图2-4所示。选择你的语言后点击前进按钮，即可继续安装流程。

    '
