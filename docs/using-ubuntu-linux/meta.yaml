    ## Using Ekiga

    Once the application is configured, it can be used to make different types of
    calls to other users as long as you know their SIP address.

    ![](img/93a96bd5075527285b151804f3a5c28f_160_0.png)

    ### Figure 8-6 Ekiga

    Along the top of the Ekiga window is a text box where you can manually enter a
    person''s address, as can be seen in Figure 8-6. Then by clicking on the connect
    button next to the text box, Ekiga will attempt to call the other person. The
    buttons down the left-hand side of the window change how Ekiga will communicate,
    either using instant messaging, voice, or video conferencing if you have a web
    camera attached to your computer. The third button will also open the Ekiga address
    book. This will connect to the Ekiga SIP service and allow you to search for other
    Ekiga users'' SIP addresses, or allows you to create your own personal address
    book by manually entering their details, as shown in Figure 8-7.

    ![](img/93a96bd5075527285b151804f3a5c28f_161_0.png)

    ### Figure 8-7 Address Book

    Once Ekiga is launched, clicking the close button in its window will not actually
    close the application, but leave it minimised in the notification area of the
    top panel. This is unnecessary as you will only be able to receive calls while
    the application is running. Once the application is minimised to the notification
    area, simply left-click the small telephone icon to maximise the window. To really
    close the application, so that you are not disturbed, choose "Quit" from the "Call"
    menu.

    ### Evolution Mail

    Evolution (http://www.gnome.org/projects/evolution) is a fully featured email
    client which is pre-installed on Ubuntu, as shown in Figure 8-8. It can be launched
    from either the icon on the top panel or from the "Internet" sub-menu to the "Applications"
    menu. Evolution includes numerous features such as POP, SMTP, Exchange, GroupWise
    and multiple email account support, calendars including support for connecting
    to web based calendars, junk mail filtering, advanced inbuilt search facility,
    and support for plug-ins to add additional functionality.

    ![](img/93a96bd5075527285b151804f3a5c28f_163_0.png)

    ### **Figure 8-8 Evolution Mail**

    Like Ekiga, in order to make the set-up as easy as possible, Evolution launches
    a wizard the first time it''s started to step you through the configuration process
    to connect to your email host. Press the "Forward" button on the first page of
    the set-up assistant to start the configuration, as shown in Figure 8-9.

    ## Evolution Setup Assistant

    ### Identity

    Please enter your name and e-mail address below. The "optional" fields below do
    not need to be filled in, unless you wish to include this information in e-mail
    you send.

    #### Required Information

    - **Full Name:** Jon Rolfe

    - **E-mail Address:** Jon.Rolfe@UsingUbuntu.com

    #### Optional Information

    - ☑ Make this my default account

    - **Reply-To:** [blank]

    - **Organisation:** [blank]

    - [ **Cancel** ] [ **Back** ] [ **Forward** ]

    ### Figure 8-9 Evolution Set-up Assistant

    Enter your full name as you wish it to be displayed on your emails, and your email
    address into the fields as shown in the previous illustration. The Reply-To and
    Organisation fields can normally be left blank and only need to be completed if
    you wish to use a different email address for users replying to your email, and
    you wish a company name to be entered into the properties of each email. Then
    click the "Forward" button to go to the email configuration account properties.

    The fields on this page will vary depending on the email account that you are
    using. Evolution can support receiving email from many different server types,
    however for this book we will assume that you are connecting to an Internet Service
    Provider who, by and large, will provide a POP email service. When "POP" is selected,
    the options shown in Figure 8-10 will be displayed.

    ![](img/93a96bd5075527285b151804f3a5c28f_165_0.png)

    ### Figure 8-10 Receiving email

    Enter the address of your email server and your user name, these will be provided
    to you by your Internet Service provider. Tick the "Remember Password" check box
    if you wish Evolution to remember your password so that it can automatically collect
    your email without prompting you to enter your password on each connection. Don''t
    worry that you have not entered your password yet, Evolution will prompt you the
    first time it tries to receive email. Then click the "Forward" button to move
    onto the email receive options page. Select how often you wish Evolution to check
    for email when it is running, and tick the check box to "Leave messages on server"
    if you want access to your email from several different computers, before clicking
    "Forward". The next page allows you to set up your email settings in order to
    send email via your Internet Service Provider. Enter the server address, user
    name and tick the check box to "Remember Password". Some email servers will require
    the "Server requires authentication" option checked while others will not. Again,
    you may need to check with your ISP to find out if this is an option that needs
    to be ticked for your provider. Click "Forward" again to save the settings and
    go to the next page. You will then be prompted to name the account settings to
    make it easier to manage if you have multiple email addresses. Change the name
    if necessary and click "Forward" to take you to the time zone setting page, as
    shown in Figure 8-11.

    ![](img/93a96bd5075527285b151804f3a5c28f_167_0.png)

    ### Figure 8-11 Time zone

    This page should look familiar from the Ubuntu installation. Click near your geographical
    region and then select your location, before clicking "Forward". On the final
    set-up page, click "Apply" to save the account settings.

    ## Using Evolution

    If you have used an email client before, Evolution will be very easy to get started
    with. A tool bar shown along the top of the window allows you to create, send,
    receive, reply, forward or delete emails. Buttons down the left-hand side of the
    window allow you to switch between views so that you can look at your email, contacts,
    calendar, memos or tasks. As you change the view, from email to calendar for instance,
    the tool bar buttons will change to actions of the view you are currently in.
    A small icon in the bottom left-hand corner of the window shows you if you are
    currently connected to your email server or not. Clicking the icon will allow
    you to change the connection status.

    ## Firefox Web Browser

    Ubuntu comes with the popular Firefox (http://www.mozilla.com/en-US/firefox) web
    browser which can be launched from either the icon on the top panel or from the
    "Internet" sub-menu of the "Applications" menu.'
  mdcn: '

    ## 首次配置向导

    ### 音频设备

    - 第 7/10 页

    请选择音频输出设备：Ensoniq AudioPCI

    音频输出设备是音频管理器管理的、用于播放音频的设备。

    请选择音频输入设备：Ensoniq AudioPCI

    音频输入设备是音频管理器管理的、用于录制你声音的设备。

    - 测试

    - 设置

    - 取消

    - 返回

    - 前进

    ![](img/93a96bd5075527285b151804f3a5c28f_158_0.png)

    按下“测试”按钮尝试录制一段短消息，Ekiga 会播放该录音以确认你的音频工作正常。点击“确定”关闭测试窗口，再点击“前进”确认音频设备设置。下一屏幕会要求你确认“视频管理器”，它会默认选择最合适的选项，因此只需点击“前进”即可。最后，系统会检测你是否连接了网络摄像头并确认设备设置。点击“前进”确认后，系统会显示
    Ekiga 将使用的所有设置的摘要，如图 8-5 所示。

    ![](img/93a96bd5075527285b151804f3a5c28f_159_0.png)

    ### **图 8-5 配置完成**

    请确保所有设置都正确，然后按下“应用”按钮完成配置并启动应用程序。

    ## 使用 Ekiga

    应用程序配置完成后，只要知道对方的 SIP 地址，就可以用它呼叫其他用户，支持多种通话类型。

    ![](img/93a96bd5075527285b151804f3a5c28f_160_0.png)

    ### 图 8-6 Ekiga 界面

    如图 8-6 所示，Ekiga 窗口顶部有一个文本框，你可以手动输入对方的地址。点击文本框旁的连接按钮后，Ekiga 就会尝试呼叫对方。窗口左侧的按钮可以切换
    Ekiga 的通信模式，如果你电脑上连接了网络摄像头，还可以使用即时通讯、语音或视频会议功能。第三个按钮可以打开 Ekiga 通讯录，它会连接到 Ekiga
    的 SIP 服务，你可以搜索其他 Ekiga 用户的 SIP 地址，也可以手动输入联系人信息来创建个人通讯录，如图 8-7 所示。

    ![](img/93a96bd5075527285b151804f3a5c28f_161_0.png)

    ### 图 8-7 通讯录

    Ekiga 启动后，点击其窗口的关闭按钮并不会真正关闭程序，而是会将其最小化到顶部面板的通知区域。这是没有必要的，因为只有在程序运行时你才能接听来电。程序最小化到通知区域后，只需左击顶部的小电话图标即可最大化窗口。如果要彻底关闭程序以避免被打扰，可以在“呼叫”菜单中选择“退出”。

    ### Evolution 邮件客户端

    [Evolution](http://www.gnome.org/projects/evolution) 是一款功能全面的电子邮件客户端，预装在 Ubuntu
    系统中，如图 8-8 所示。你可以通过顶部面板的图标，或者“应用程序”菜单下的“网络”子菜单启动它。Evolution 支持多种功能，包括 POP、SMTP、Exchange、GroupWise
    协议，支持多个邮箱账户，内置日历（支持连接网络日历）、垃圾邮件过滤、高级内置搜索功能，还支持通过插件扩展额外功能。

    ![](img/93a96bd5075527285b151804f3a5c28f_163_0.png)

    ### **图 8-8 Evolution 邮件客户端界面**

    和 Ekiga 一样，为了尽可能简化设置流程，Evolution 首次启动时会运行配置向导，引导你完成连接邮件服务器的配置过程。如图 8-9 所示，在配置助手的第一页点击“前进”按钮即可开始配置。

    ## Evolution 配置助手

    ### 身份信息

    请在下方输入你的姓名和电子邮箱地址。除非你希望在发送的邮件中包含以下信息，否则无需填写标为“可选”的字段。

    #### 必填信息

    - **全名：** 乔恩·罗尔夫（Jon Rolfe）

    - **电子邮箱地址：** Jon.Rolfe@UsingUbuntu.com

    #### 可选信息

    - ☑ 将此设为默认账户

    - **收件人回复地址：** [空白]

    - **所属组织：** [空白]

    - [ **取消** ] [ **返回** ] [ **前进** ]

    ### 图 8-9 Evolution 配置助手界面

    按照你希望在邮件中显示的名称输入全名，并按照上一张图的示例输入电子邮箱地址。“收件人回复地址”和“所属组织”字段通常可以留空，只有当你希望收件人回复邮件时使用其他邮箱地址、或者希望每封邮件的属性中都显示公司名称时，才需要填写这两个字段。之后点击“前进”按钮进入邮箱账户属性配置页面。

    此页面的字段会因你使用的邮箱账户不同而有所差异。Evolution 支持从多种不同类型的服务器接收邮件，但本书默认你连接的是互联网服务提供商（ISP），这类服务商通常提供
    POP 邮件服务。选择“POP”后，会显示如图 8-10 所示的选项。

    ![](img/93a96bd5075527285b151804f3a5c28f_165_0.png)

    ### 图 8-10 接收邮件设置

    请输入你的邮件服务器地址和用户名，这些信息会由你的互联网服务提供商提供。如果你希望 Evolution 记住你的密码，以便每次连接时无需输入密码即可自动收取邮件，请勾选“记住密码”复选框。不用着急现在输入密码，Evolution
    在首次尝试收邮件时会提示你输入。之后点击“前进”按钮进入邮件接收选项页面。

    选择 Evolution 运行时检查新邮件的频率，如果你需要从多台不同电脑访问邮箱，请勾选“将邮件留在服务器上”复选框，之后点击“前进”。下一页面用于配置通过互联网服务提供商发送邮件的设置，请输入服务器地址和用户名，并勾选“记住密码”复选框。部分邮件服务器需要勾选“服务器要求认证”选项，部分则不需要，你需要咨询你的
    ISP 确认你的服务商是否需要勾选该选项。再次点击“前进”保存设置并进入下一页。

    接下来系统会要求你为账户设置命名，方便你在有多个邮箱地址时进行管理。必要时可以修改名称，点击“前进”进入时区设置页面，如图 8-11 所示。

    ![](img/93a96bd5075527285b151804f3a5c28f_167_0.png)

    ### 图 8-11 时区设置

    这个页面你在安装 Ubuntu 时应该见过。点击你所在的地理区域，然后选择具体位置，之后点击“前进”。在最后一个设置页面，点击“应用”保存账户设置。

    ## 使用 Evolution

    如果你之前使用过电子邮件客户端，上手 Evolution 会非常容易。窗口顶部的工具栏可以让你创建、发送、接收、回复、转发或删除邮件。窗口左侧的按钮可以切换视图，你可以查看邮件、联系人、日历、备忘录或任务。切换视图时（例如从邮件切换到日历），工具栏的按钮会变为当前视图对应的操作。窗口左下角有一个小图标，显示你是否当前已连接到邮件服务器，点击该图标可以更改连接状态。

    ## Firefox 网页浏览器

    Ubuntu 系统自带流行的 [Firefox](http://www.mozilla.com/en-US/firefox) 网页浏览器，你可以通过顶部面板的图标，或者“应用程序”菜单下的“网络”子菜单启动它。

    '
