    # About this Book


    Welcome to Using Ubuntu Linux, and thank you for buying this book. We hope it
    will be an invaluable source of information and guidance in order for you to setup,
    configure and discover the secure, feature rich, and easy to use operating system
    that is Ubuntu Desktop.


    Most books on GNU/Linux based operating systems have been aimed at technical computer
    users, or users who have wanted to increase their technical knowledge. While writing
    this book, we have aimed to provide a resource for the everyday, non-technical
    user, who just wants to use their computer as the tool it was designed for.


    This book will try to avoid long lists of manual commands that must be typed at
    a flashing prompt, unless they are absolutely necessary. Thankfully when the subject
    has been voted as the most user friendly Linux based operating system (voted Most
    User-Friendly Linux Distribution, and Best Linux/Open Source Distribution, for
    the second year running, at the 2006 UK Linux and Open Source Awards), long confusing
    commands are very rare and can easily be avoided.


    We hope you enjoy the journey.'
