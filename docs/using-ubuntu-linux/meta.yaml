  md: '# Summary


    OpenOffice.org provides a full-feature suite of applications for all your day
    to day office computing tasks. As we have discovered, it can be used to open and
    interoperate with many of the commercial applications and even offers features
    not provided by some such as exporting as Adobe Acrobat format. As the OpenOffice.org
    suite warrants an entire book to cover its extensive features, for a full list
