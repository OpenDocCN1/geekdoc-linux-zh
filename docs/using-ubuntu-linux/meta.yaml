    Web（http://picasaweb.google.com）等网络照片分享网站。这些操作都可以通过“文件”菜单中的选项轻松完成。


    ## GIMP 图像编辑器

    GIMP（http://www.gimp.org，全称GNU图像处理程序）是一款功能全面的图形编辑器，旨在为 Adobe Photoshop 等商业软件提供免费发行的替代方案。它提供了大量用于照片修图、图像合成和创作的高级功能，如图6-3所示。

    ![](img/93a96bd5075527285b151804f3a5c28f_124_0.png)

    Figure 6-3 GIMP 界面


    GIMP 的功能极为丰富，要详细介绍它需要专门的著作，因此我们只会介绍其部分核心功能。打开 GIMP 窗口后，你可以点击 GIMP 应用程序中“文件”菜单里的“打开”选项，选择示例图片或你自己的数码图片，再选中对应文件即可打开。图片会在独立窗口中打开，并自动缩放以适应你的显示器尺寸。该应用程序由多个面板组成，第一个面板是主工具箱，下方是工具选项面板，该面板包含多种工具：用于选择图片区域的选择工具、用于绘画的画笔、用于编辑或擦除图片区域的工具等，如图6-4所示。

    ![](img/93a96bd5075527285b151804f3a5c28f_126_0.png)

    Figure 6-4 GIMP 工具箱


    正在编辑的图片会在独立窗口中展示，窗口带有包含所有文件和编辑功能的菜单栏，如图6-5所示。如果你的电脑性能足够，可以同时打开多张图片进行编辑。你也可以在图片窗口内右键点击鼠标指针，调出菜单栏的选项。

    *图6-5* GIMP 图像窗口


    最后一个窗口是图层对话框，如图6-6所示。该窗口用于应用和编辑图片的多个图层，让你能够以多种不同方式修改图片。图层对话框下方是画笔、图案和渐变对话框，这些选项在绘画或修改图片时使用。

    ![](img/93a96bd5075527285b151804f3a5c28f_128_0.png)

    Figure 6-6 GIMP 图层面板


    使用 GIMP 可以完成一些简单操作，例如调整图片尺寸：只需点击“图像”菜单中的“缩放图像”选项即可轻松完成。另一个常见操作是裁剪图片：只需从工具面板中选择矩形选择工具，选中想要保留的图片区域，再点击“图像”菜单中的“裁剪”选项即可，该操作会删除选中区域外的所有内容。如果你需要撤销操作，可以点击“编辑”菜单中的“撤销”选项，或者使用
    Ctrl+Z 快捷键组合。另一种方便的撤销方式是通过“撤销历史”对话框，它位于“图层”对话框下方，记录了所有对图片执行的操作历史，你可以随时跳转到任意操作阶段，一次性撤销多个操作。


    如需获取更多使用教程和相关信息，可以访问 GIMP 官网（http://www.gimp.org/docs）查看 GIMP 官方手册，还有详细的教程页面（http://www.gimp.org/tutorials）。


    ## gThumb 图片查看器

    顾名思义，gThumb（http://gthumb.sourceforge.net）是一款缩略图图片查看器。它具备许多和 F-Spot 照片管理器相似的功能，例如从相机导入图片、编辑、查看和幻灯片放映功能，如图6-7所示。

    ![](img/93a96bd5075527285b151804f3a5c28f_130_0.png)

    Figure 6-7 gThumb 界面


    这两个应用的主要区别是 gThumb 没有 F-Spot 的图片标记功能，取而代之的是，gThumb 支持创建“媒体库”和“目录”。这些功能可以将图片归类到用户自建的集合中。媒体库可以组合多个目录，目录则用于实际归类图片。要创建目录，只需点击工具栏上的“目录”按钮切换到目录视图，然后在左侧面板中右键单击，选择“新建目录”即可。要给目录添加图片，只需选中图片后右键单击，再从右键菜单中选择对应的目录即可。


    ## 总结

    在本章中，我们了解了 Ubuntu 内置的多种用于管理和编辑数码照片、图形文件的开源应用，其中包括功能丰富的 GIMP 图像编辑应用，它提供了许多商业修图软件具备的功能。下一章我们将介绍网络应用，并配置它们来处理电子邮件、浏览网页和进行网络通信。


    ## 7 OpenOffice

    在本章中，我们将了解 OpenOffice.org 办公套件。OpenOffice.org（http://openoffice.org）是一款免费但功能齐全的办公套件，包含文字处理、数据库、电子表格和演示文稿应用。我们会介绍其中的核心应用，对比它与其他办公套件的差异，学习足够的基础知识来上手使用这些应用。和
    Ubuntu 社区一样，OpenOffice.org 由 OpenOffice.org 社区提供支持、维护和开发。该套件包含以下应用：

    - Base – 数据库应用

    - Calc – 电子表格应用

    - Draw – 矢量绘图程序

    - Impress – 演示文稿软件

