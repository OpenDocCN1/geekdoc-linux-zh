  md: '# **Tomboy Notes**


    "Tomboy" (http://www.gnome.org/projects/tomboy) is a note taking application that
    allows notes to be created, managed and stored.


    ![](img/93a96bd5075527285b151804f3a5c28f_118_0.png)


    # **Figure 5-10 Tomboy Notes**


    When the application is running, it adds a small icon to the Notification Area
    of the top panel, allowing new notes to be quickly and easily created by selecting
    "Create New Note" from the drop-down menu from the notification area icon. Alternatively,
    the application also allows new notes to be created from the "File" menu of the
    "Search All Notes" window.'
  merge: -1
  pgno: 118
- img_proc: true
  md: 'Text is simply typed on the new note and can be formatted from the drop-down
    menu of the "Text" button on the notes tool bar, as shown in Figure 5-10. When
    the note is closed it is stored along with other notes and can be accessed again
    from either the drop-down menu or the "Search All Notes" window. Notes are deleted
    from the "Delete" option on the "Edit" menu.


    The application is particularly useful for keeping lots of free-form text that
    you need to refer to later, but might not be large enough to start a new file
    or OpenOffice document. Accessing or finding the information at a later date is
    made easy by the search functionality, enabling information to be quickly retrieved.


    Like the Text Editor discussed earlier, Tomboy Notes also supports "plug ins"
    that allow software developers to easily add functionality to the application.
    These include "plug ins" which allow notes to be created from the "Evolution"
    email client, saving the note as a web HTML file and also to see which notes relate
    to the currently active note. These plug ins can be used from the "Tools" drop-down
    menu from the tools button.


    # Summary


    In this section, we started to take a look at the numerous applications included
    with Ubuntu, these ranged from the simple built-in calculator to the sophisticated
    disc usage analyser. In the next chapter we investigate the Graphics applications
    in order to manage, create and edit digital images.'
  merge: -1
  pgno: 119
- img_proc: true
  md: '# 6


    # Graphics


    As we have already discovered, Ubuntu is pre-installed with numerous applications,
    this chapter will discuss the applications dedicated for graphics. These applications
    provide the tools required for importing, scanning, managing and editing your
    photographs and pictures. To launch the individual applications, go to the "Graphics"
    sub-menu from the "Applications" menu.


    # F-Spot Photo Manager


    F-Spot (http://f-spot.org) is a personal photo manager that allows you to import,
    organise, print, email, backup and even edit your photographs. When the application
    is launched for the first time, it will prompt you to import images from either
    a connected camera or another folder such as a backup DVD.'
  merge: -1
  pgno: 120
- img_proc: true
  md: '# Graphics


    ![](img/93a96bd5075527285b151804f3a5c28f_121_0.png)


    # Figure 6-1 F-Spot Import window


    Once the source is selected, either a folder, camera or memory card, as shown
    in Figure 6-1, F-Spot will copy the images into your "photos" folder which is
    located under your home directory. The program creates a directory structure based
    upon the creation date of the image, this is made up of the format photos/year/month/date.
    This allows you to easily recognise the creation date of an image. Once the images
    have been imported, the F-Spot browse window is opened, this window allows the
    images to be displayed and tagged.'
  merge: -1
  pgno: 121
- img_proc: true
  md: '# Graphics


    ![](img/93a96bd5075527285b151804f3a5c28f_122_0.png)


    # Figure 6-2 F-Spot Browse window


    The browse window contains a bar along the top of the window which can be used
    to rapidly find photographs by date, as moving the bar scans the photo folder
    for images of the relevant creation date, as shown in Figure 6-2. Once you have
    found the images you require, they can be "tagged" with a user-customisable tag
    to aid finding and categorising your pictures.


    The predefined tags are shown in the list on the left hand side of the browse
    window. To create a new tag, simply right-click with the mouse pointer in the
    tag pane. To tag a photo, select the images in the image pane and then drag and'
  merge: -1
  pgno: 122
- img_proc: true
  md: '# Graphics


    drop the relevant tag onto one of the photographs, alternatively right-click in
    the images window and select "Attach Tag". Then, if you double-click the tag,
    you will be able to search for all photographs with the associated tag.


    You can change the view within the browse window by pressing one of the buttons
    on the tool bar. Pressing the "Edit" button will bring up a comments field at
    the bottom of the window. This allows you to enter a comment for each image. Also
    shown below the comments field, is the edit tool bar. Various simple edit functions
    can be achieved within the F-Spot Manager, these include:


    +   - Change the aspect ratio

    - Crop

    - Remove red-eye

    - Adjust the image''s colours

    - Convert to black and white

    - Convert to sepia

    - Rotate the angle of the image to straighten the horizon

    - Create a soft focus effect.


    Other edit functions are also available from the "Edit" menu, such as the ability
    to sharpen the image. F-Spot will also allow you to send the image via email,
    print, or export the image to CD or a web based photo sharing site such as Flickr
    (http://www.flickr.com) or Picasweb'
  merge: -1
  pgno: 123
- img_proc: true
  md: '# Graphics


    (http://picasaweb.google.com). This is easily achieved from the options on the
    "File" menu.


    # GIMP Image Editor


    GIMP (http://www.gimp.org) or GNU Image Manipulation Program is a full featured
    graphics editor, that aims to provide a freely distributed alternative to commercial
    programs such as Adobe Photoshop. It provides many advanced features for photo
    retouching, image composition and image creation and can be seen in Figure 6-3.


    ![](img/93a96bd5075527285b151804f3a5c28f_124_0.png)


    Figure 6-3 The GIMP'
  merge: -1
  pgno: 124
- img_proc: true
  md: 'GIMP has so many features that to cover it in detail requires a book to itself.
    Therefore we will just touch some of the many features it has to offer. From the
    GIMP window, open one of the example images or one of your own digital images
    by selecting "Open" from the "File" menu within the GIMP application, and then
    selecting the relevant file. The image will be opened in its own window, and will
    be scaled to fit the size of your monitor.


    The application is displayed in several panes, the first pane is the main toolbox,
    and below it are the tool options. This pane contains several tools, for selecting
    parts of the image, brushes for painting, tools for editing or erasing parts of
    the image, etc. and can be seen in Figure 6-4.'
  merge: -1
  pgno: 125
- img_proc: true
  md: '# Graphics


    ![](img/93a96bd5075527285b151804f3a5c28f_126_0.png)


    # Figure 6-4 GIMP Tool Box'
  merge: -1
  pgno: 126
- img_proc: true
  md: 'The image being worked on is displayed in its own window with a menu bar for
    all the file and editing functions, as shown in Figure 6-5. Depending on the performance
    of your computer, it is possible to have several images open and worked on at
    the same time. The menu bar options are also available by right-clicking the mouse
    pointer within the image window.


    ![](img/93a96bd5075527285b151804f3a5c28f_127_0.png)


    *Figure 6-5* GIMP Image window


    The final window contains the Layers Dialog, as shown in Figure 6-6. This window
    is used to apply and edit multiple layers of an image, allowing it to be modified
    in many different ways. Below the layers dialog, are the brushes, patterns and
    gradients dialog. These options are used when painting or modifying an image.'
  merge: -1
  pgno: 127
- img_proc: true
  md: '# Graphics


    ![](img/93a96bd5075527285b151804f3a5c28f_128_0.png)


    Figure 6-6 GIMP Layers Box'
  merge: -1
  pgno: 128
- img_proc: true
  md: 'Some simple tasks that you might want to achieve using GIMP is to change the
    size of the image; this can be easily achieved by selecting the "Scale Image"
    option from the "Image" menu. Another common task is to crop the image. This can
    easily be achieved by selecting the rectangular selection tool from the tool palette.
    Then select the area of the image you want to keep and chose "Crop" from the "Image"
    menu. This will remove all of the area of the image outside the selection.


    If at any time you want to undo your action, this can be achieved by selecting
    the "Undo" option on the "Edit" menu or using the Ctrl+Z command key combination.
    Another useful way of undoing an action is from the "Undo History" dialog. Stacked
    under the "Layers" dialog is the Undo History dialog which contains a history
    of the actions performed on the image and allows you to jump back to any stage
    at any time, so undoing multiple actions in one go.


    For additional information and tutorials on using the application, the GIMP manual
    is available at the GIMP website (http://www.gimp.org/docs) as well as detailed
    tutorials (http://www.gimp.org/tutorials).


    # # gThumb Image Viewer


    As the name suggest, gThumb (http://gthumb.sourceforge.net) is a thumbnail image
    viewer. It performs many of the functions also performed by the F-Spot Photo Manger,
    such as importing images from a camera, editing, viewing and slide show functions,
    as shown in Figure 6-7.'
  merge: -1
  pgno: 129
- img_proc: true
  md: '![](img/93a96bd5075527285b151804f3a5c28f_130_0.png)


    # Figure 6-7 gThumb


    The main difference between the two applications is that gThumb lacks the tagging
    of images performed by F-Spot. However, instead gThumb allows the creation of
    "Libraries" and "Catalogues". These allow images to be collated together in user-created
    collections. A library allows the grouping of several catalogues which are used
    to actually group the images.


    To create a catalogue, click the "Catalogue" button on the tool bar to switch
    to the catalogue view. Then right-click in the left-hand pane and select "New
    Catalogue". Images can be added to a catalogue by simply selecting the image and
    right-'
  merge: -1
  pgno: 130
- img_proc: true
  md: 'clicking on it. Then selecting the catalogue from the context menu.


    # Summary


    In this chapter we discovered the many open source applications which Ubuntu includes
    for managing and editing digital photos and graphics files. These applications
    include the feature-rich GIMP image editing application that offers many of the
    features provided by commercial photo editing software. In the next chapter we
    look into the Internet applications and configure them for collecting email, browsing
    the Web and communicating over the Internet.'
  merge: -1
