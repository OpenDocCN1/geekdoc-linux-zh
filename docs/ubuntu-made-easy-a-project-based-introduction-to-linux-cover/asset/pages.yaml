- pgno: 162
  md: '![](img/d35fa962e6f9664d66dc83916f426418_162_0.png)


    # # SIMPLE KITTEN WAYS


    Getting to Know the Linux Terminal and Command Line . . . and the Cool Things
    It Can Do


    ![](img/d35fa962e6f9664d66dc83916f426418_162_1.png)


    Many people shy away from Linux because they envision it as a system for compu-geeks,
    an environment in which you do everything the hard way—by command line. In this
    era of graphical interfaces, the idea of typing commands to get things done seems
    like a dreadful throwback to the days of DOS, and that puts many people off, especially
    those who remember the “old days.”


    This reaction is far enough, but it is not an accurate reflection of the reality
    of the Linux world. After all, most Linux today utilize some sort of graphical
    interface. They can, and often do, achieve all that they hope to achieve through
    drop-down menus and mouse clicks alike. Many are able to survive quite happily
    without ever opening their Terminal. The same can be true of.


    But as it may, there is still much to be said for the power and convenience of
    the command line. The fact that the command line can now be utilized within a
    graphical environment also makes it much less forbidding. The Terminal is just
    a tiny text-based island in a sea of graphical bodies'
  merge: -1
  img_proc: true
- pgno: 163
  md: '(see Figure 8-1). Using the command line can be as pain-free as anything else
    you do on your system, and it can actually provide you with a little fun if you
    are willing to give it a try.


    ![](img/d35fa962e6f9664d66dc83916f426418_163_0.png)


    Figure 8-1: Putting the Terminal into perspective


    Unfortunately, many guides to using the command line are written by hard-core
    command-line junkies, whose enthusiasm for what they see as a really good thing
    inadvertently makes what they write even more off-putting to the recent Linux
    immigrant or wannabe.


    For your sake, I will try not to go with enthusiasm so as to scare you right back
    to Chapter 6 and the more comfortable world of the Ubuntu Software-Center. I will
    also try to keep things in perspective by teaching you, whenever possible, to
    use the command line as a complement or alternative to the graphical tools you
    have at your disposal, rather than presenting it as the sole way of going about
    things. Of course, I am not going to cover every possible angle in this regard—just
    enough to give you some exposure and experience and, ideally, make you feel at
    a little more at ease with the command line. Who knows? You might actually come
    to think of using the command line as . . . fun? Well, I won''t get too carried
    away.


    # Meet the Terminal


    You can run the Linux command-line Terminal application in your Ubuntu system
    by going to the Dash, typing terminal, and pressing ENTER. When the Terminal opens,
    it will, in all its simplicity, look much like Figure 8-2.'
