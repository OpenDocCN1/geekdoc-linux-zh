    # No Wireless Networks Are Found


    If you know that your wireless card is working in Ubuntu but you can''t find to
    any networks, try the following steps:


    +   1. Check to make sure that your wireless card is turned on. Many laptops have
    a keyboard shortcut that toggles the wireless card on and off (on mine it''s FN2).
    Some cards have a physical switch that you need to flip instead. If your card
    has an antenna with a cable, make sure that the cable is firmly secured to the
    card.


    +   2. Click the Network icon on the top panel and make sure that **Enable Networking**
    and **Enable Wireless** are checked (Figure 22-12). If they aren''t, check them;
    then wait a minute or two while the wireless card wakes up.


    +   3. If the Enable Wireless option was already checked, try unchecking it, waiting
    for a minute or so, and then checking it. Your wireless card might have needed
    turning off and on again to wake it up. You can also try doing this with the hardware
    switch/keyboard toggle mentioned in Step 1.


    +   4. If none of this has any effect, try restarting your computer. Some-wireless
    cards work fine until you hibernate or suspend the computer, after they fall into
    a deep sleep. Restarting should be enough to wake your card.'
