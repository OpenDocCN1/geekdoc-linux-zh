  md: '# 9


    # DRESSING UP THE BIRD


    Customizing the Look and Feel of Your System


    ![](img/d35fa962e6f9664d66dc83916f426418_196_0.png)


    One of the nice features of Linux has always been that you can change its appearance
    to varying degrees. I don''t mean just desktop backgrounds and colors and display
    desktop fonts but things like window borders too. You can even change the entire
    desktop environment if you''re so inclined.


    For customization fans, however, one thing that is slightly disappointing about
    the Unity environment in Ubuntu is that it is not as customizable as others. The
    main way to give yourself total customization freedom is to actually get rid of
    Unity, which is delving into pretty geeky territory, but there are some things
    you can do without getting all that drastic. So, let''s just start off by discussing
    the easy tweaks you can do and then gradually work our way into a bit of minor
    geekdom for those of you who want to get down and a little (just a little) dirty.'
