    strengths.


    > Most access points employ an added level of security in the form of a Wired
    Equivalent Privacy (WEP) or a Wi-Fi Protected Access (WPA) key. If you didn''t
    choose your own password when you set up the access point, looking for a sticker
    on the base of the access point to see a default password is used. If you''re
    trying to connect to a network for which you don''t know the key, then chances
    are you not supposed to be making the connection in the first place. Naughty,
    naughty.


    If you were not successful in making your wireless connection (the system will
    tell you that''s the case), you have a few possibilities beyond the annoying card
    scenario. First, double-check to make sure your card is physically turned on.
    I know that sounds dumb, but I have been guilty of oversight myself on numerous
    occasions. Many laptops have a key you can press to enable or disable the wireless
    card; on mine, you have press the function key (FN) and F2 at the same time (there''s
    a little wireless antenna on the F2 key to denote this).


    Another possibility is that you are not entering the correct WEP or WPA password.
    The first thing to check is case sensitivity. It sometimes matters the letters
    you type are upper- lowercase, make sure you type them as written. Additionally,
    some wireless access points require you to type the “wireless key” rather than
    a passphrase or password. A wireless key normally consists of a seemingly random
    string of numbers and'
