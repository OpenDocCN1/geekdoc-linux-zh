- pgno: 365
  md: '3. Close the settings window and then click the Save button. The window will
    turn gray for a little while, during which time the boot menu settings will be
    updated.


    4. When the window returns to normal, the process is complete. From the next time
    you start onward, Windows will boot automatically instead of Ubuntu.


    > If you apply a major update to Ubuntu at some point, you may find that Windows
    is no longer the default the next time you start the computer. This is because
    the update will have added a new entry to the boot list, causing the Windows item
    to slip down the list, where it won''t be recognized as the default any more.
    To fix this, open GRUB Customizer and reselect Windows as the operating system.


    > Grub Customizer lets you change the boot timeout. By default, GRUB waits for
    10 seconds before loading your operating system, but I am impatient and find this
    too long to wait—so impatient, in fact that I changed the Timeout option (also
    on the General tab of the settings) to 1 so the menu is displayed only for a second.
    This might sound fast, but when I want to get into Windows, all I do is press
    the down arrow key few times while my computer starts up. GRUB stops the timer
    when you press a key and keeps the menu on the screen. Once that has happened,
    I''m free to choose the Windows option at my leisure.


    Once you''re happy with your revised boot timeout and/or operating system, click
    Save to the settings. GRUB Customizer will spend a few seconds making the requested
    changes, after which you can safely close the window. Restart the computer to
    see the updated boot menu in action.


    # Linux Equivalents to Your Windows Applications


    Going through the trouble of running Windows programs in Ubuntu, it''s a good
    idea to try some of the equivalent Linux applications. More often than not, there''s
    a native Linux program that will do exactly what you need without any of the headaches
    involved with running an application designed for another operating system.


    First, however, have to find Linux equivalents. Luckily, plenty of websites list
    good alternatives to Windows software: http://www.osalt.com/ and http://www.linuxalt.com
    are comprehensive, for example. Or you can root around the Ubuntu Software Center,
    installing applications that tickle your fancy. After all, the best way is to
    see whether a program is to try it!


    > Some Windows programs don''t have direct equivalents in Ubuntu, so you might
    need to install a couple of programs to get functionality like that of your Windows
    software. In the rare cases there aren''t any suitable alternatives, you can try
    using Wine or installing Windows on a virtual machine, which I''ll talk about
    next.'
  merge: -1
  img_proc: true
- pgno: 366
  md: '# Project 19C: Running Windows Programs


    In Chapter 6 you learned a host of ways to add applications to your system, but
    you may not have considered one other method—installing Windows applications.
    Despite there being Linux equivalents for most of the Windows programs that you
    need, you may miss one or two programs. Fortunately, it is possible to run some
    Windows applications from within Linux with the help of a program called Wine.
    Wine works by fooling applications into thinking they''re running on Windows.
    It does this by providing all of the libraries and support files that programs
    expect to find on Windows, without any need for Windows to be installed. The list
    of compatible software includes the likes of Microsoft Office, Internet Explorer,
    Adobe Photoshop, and a whole host of games, so if you''re desperately missing
    a particular program, then Wine is definitely worth a look.


    It is fair to point out that Wine continues to be a work in progress. It works
    well with some programs and not at all with others. Things are improving, and
    Wine now seems to work better with more applications. If you are curious about
    which apps are known to run under Windows and how well, check out the Wine Notepad
    page at http://www.winehq.org/ and click the AppDB link. The AppDB entries for
    programs often contain helpful advice on getting them to run in Wine, so check
    there first if you run into problems.


    # 19C-1: Installing and Testing Wine


    You can get Wine via the Ubuntu Software Center by doing a search for wine and
    installing the Microsoft Windows Compatibility Layer (it should be the first search
    result). Once the installation is complete, you can test it by opening the Dash
    and searching for Notepad. When the results are in, click the icon for the Notepad
    application (the one with a glass on it) and after a few seconds (longer the first
    time you use Wine), the Windows Notepad will appear (Figure 19-6).


    ![](img/d35fa962e6f9664d66dc83916f426418_366_0.png)


    Figure 19-6: Windows Notepad running under Wine'
  merge: -1
  img_proc: true
- pgno: 367
  md: '# 19C-2: Installing a Windows Application in Wine


    Now you''ve seen one Windows application in action under Wine, you might as well
    learn how you can install more yourself. I will point you to one application that
    will definitely work—a pretty cool text editor labeled NoteTab Light (Figure 19-7).


    ![](img/d35fa962e6f9664d66dc83916f426418_367_0.png)


    Figure 19-7: NoteTab Light running under Wine


    To get NoteTab Light, go to http://www.fookes.com/ftp/NoteTab_Setup.exe, select
    Save File, and click OK in the window that appears to save the file in your Downloads
    folder.


    When the download is complete, go to the Downloads folder, right-click the NoteTab_Setup.exe
    file, and select Open With Windows Program Loader from the pop-up menu. A few
    moments later, the same sort of setup wizard that you would see when you were
    installing NoteTab in Windows will appear (Figure 19-8). Go through the wizard,
    accept the license agreement, and then accept the defaults along the way until
    the installation is complete.


    ![](img/d35fa962e6f9664d66dc83916f426418_367_1.png)


    Figure 19-8: A Windows installation wizard running under Wine


    330 Chapter 19'
  merge: -1
  img_proc: true
- pgno: 368
  md: 'Running NoteTab is easy because it provides you a desktop launcher. Double-click
    that launcher (it looks like a notepad with a Swiss flag on the front), and NoteTab
    Light will soon appear, just as a regular Linux app would. (The other file that
    was put on the desktop, ending in .lnk, can be safely deleted to reduce clutter.)
    You can run NoteTab Light and other Windows applications installed under Wine
    by searching for them in the Dash, just as you would any other application.


    # 19C-3: Getting Windows Apps to Work in Wine with PlayOnLinux


    Some Windows software subparly refuses to work in Wine unless you things set up
    in a specific way. The Wine website is full of tips on how to tweak settings until
    you hit the magic formula that seems to work for a given program (settings that
    are practically guaranteed not to work for other programs installed with Wine).
    Some instructions ask you to install different versions of Wine for different
    programs! Fortunately, there''s a neat way to sidestep these issues called PlayOnLinux.
    It handles all the settings tweaks for you and supports many used Windows programs
    (and an especially large number of games). You can install PlayOnLinux in the
    usual way from the Ubuntu Software Center. Once it''s installed, start PlayOnLinux
    by searching for it in the Dash. Click Next. It''ll spend a minute or updating
    its database of supported programs. Once it''s done, click Next again, and it
    will leave you at the main PlayOnLinux window (Figure 19-9). In that new window,
    click Install and use the category pane or bar in the window that appears to look
    for a Windows program of your choice.


    ![](img/d35fa962e6f9664d66dc83916f426418_368_0.png)


    Figure 19-9: The main PlayOnLinux window'
  merge: -1
  img_proc: true
- pgno: 369
  md: 'In this example, you''ll install the delightful Crayon Physics game:


    +   1. Select the Games category and find the Crayon Physics entry in the list
    (not the Deluxe version).


    +   2. Select Crayon Physics (as in Figure 19-10) and click Install to start the
    installation process.


    ![](img/d35fa962e6f9664d66dc83916f426418_369_0.png)


    Figure 19-10: Selecting a Windows application to install in PlayOnLinux


    +   3. An installation wizard will open. Click Next and wait until the game is
    downloaded and installed.


    +   4. When it''s finished, click Next to complete the installation. You will
    be returned to the main PlayOnLinux window.


    +   5. To starting, double-click the Crayon Physics entry in the main PlayOnLinux
    window or select the game from that list and click Run.


    Assuming that the game was installed successfully, you''ll be met with a Crayon
    Physics window. Click anywhere in that, and you''ll see a landscape scrawled onto
    your display in crayon, similar to the one in Figure 19-11. The aim of the game
    is to draw boxes on the screen with your mouse in order to roll a ball onto a
    star. Every time you get the star, you will move to the next level, where you''ll
    be forced to come up with a more ingenious ball-rolling strategy. It sounds simple,
    but it''s addictive!'
