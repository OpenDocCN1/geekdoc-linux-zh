    Figure 3-12: Results of clicking the Applications lenses in the Dash for the first
    time


    If you know which lenses you want to go to before clicking the Dash button, it''s
    worth knowing that you can open Dash directly to the lenses of your choice by
    right-clicking the Dash button and selecting the lenses you wish to use in the
