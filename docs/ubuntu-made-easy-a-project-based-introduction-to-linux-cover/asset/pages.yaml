- pgno: 54
  md: 'If you decide that you do not want to keep Ubuntu on your machine, you can
    remove it from within Windows by going to the Windows Control Panel, selecting
    Add or Remove Programs, and then choosing removal.


    # Taking the Full Plunge—Installing Ubuntu Outside of Windows


    If you don''t already have Windows installed on your machine, you can skip this
    section. If you do, then you''re going to have to decide whether you want to keep
    it.


    It is possible to have both Windows and Linux installed on the same machine and
    for them to happily coexist. This is known as a dual-boot setup. It has become
    incredibly easy to set up such a system. I started out with a dual-boot setup,
    though I eventually found that I used the Linux side of things exclusively. Having
    so much space being taken up by a Windows system I didn''t use seemed waste of
    prime real estate, so eventually I jumped the whole thing for a straight Linux-only
    setup.


    My feeling is that you should try the Wubi route of installing Ubuntu inside Windows
    first and then, when you''re ready, for a Linux-only setup and ditch completely.
    Most people find that Ubuntu can do everything they need, there''s no need to
    dual-boot unless you require some specific application that has no equal on Linux.


    If you opt for a dual-boot setup, starting up in either system is easy. When you
    start up your machine, you will be greeted by the GRand Bootloader (better known
    as GRUB) screen, from which you can choose to continue booting Linux or to boot
    in Windows. After that, bootop proceeds as normal for the system you selected.


    So whatever you decide to go, you really can''t go wrong. Just be to back up your
    important files before starting the installation. Proceed with common sense, patience,
    and a positive attitude, and you''ll be fine.


    # Getting Ready for Action


    You need to less prepare for an Ubuntu installation than for many other Linux
    distributions. Once you''ve decided whether you want to go the dual-boot route,
    all you really need to have on hand is your single Ubuntu CD, and for guidance
    and security, this book. The only mental energy you''ll probably expend is coming
    in with a username and user password, just as you do for most other operating
    systems.


    # Usernames and User Passwords


    Your username is something that you will be seeing quite a bit. It will be on
    permanent display in the top right-hand corner of the screen, among other things,
    so be it something you can live with. It can be just your first name or your initials
    or whatever you want it to. It must, however, begin with a lowercase name, followed
    by many/and other lowercase letters. Mine, for example, is simply rg, but you
    could use something hope42pal, though that would get rather dithering to look
    at. You also need to have a user password, which you will need to type every time
    you log in.'
  merge: -1
  img_proc: true
- pgno: 55
  md: 'need to use it when you install new software or change certain system settings,
    as well. It should be a minimum of eight characters in length and consist of numbers,
    letters (upper- lowercase), and symbols for improved security. The harder it is
    for someone to guess, the better. You can, of course, get by fewer characters
    and only letters if you prefer. The installer will advise you if the password
    you enter is unacceptable, so don''t worry about it. Be sure to write it down
    and keep the paper you''re written it in a safe place, at least for a little while,
    so you don''t accidentally lock yourself out of your system.


    **NOTE** If you have experience working with other Linux distributions, you may
    be surprised to learn that the root account is disabled by default in Ubuntu.
    There is, therefore, no installation step for inputting a root password. You can
    check the forums (http://www.ubuntuforums.org/) for ways of getting around this
    setup. You can also set up a root password at any time after the system is installed,
    if having a root account is important to you, don''t worry.


    # Doing the Deed


    Well, now that I''ve covered all preliminary stuff, let''s get down to the actual
    Linux installation. Set this on your lap so you can follow along, and then get
    ready for action. It''s time to do the deed!


    Fortunately for you, the installation process is extremely easy, because there
    are very few steps in which you actually have to do anything. Most of what you
    will be doing is clicking buttons on your screen. Nothing about that, eh?


    Of course, when you look at the directions and descriptions listed here, the process
    may look like a long and cumbersome one. It''s not. It will be over quickly than
    you can imagine. As a beginner referring to this text, you might take a bit longer,
    but all in all the process is faster and easier than for Windows or Mac OS X.
    And keep in mind that we are installing the operating system with just a few applications.
    In an Ubuntu installation, on the other hand, you are not only the operating system
    itself but also most of the applications you will want or need to use. You will
    then be getting a lot in one fell swoop.


    One more thing before we start. Some people approach installing a system with
    a good deal of trepidation. The process makes them nervous, as if the house is
    going to go up in smoke if they click the wrong thing. Needless to say, there
    is no need for such concern. As long as you have backed up your data, ideally
    to an external hard disk or similar, you will be okay. If the installation fails
    first time out, so what? Just start over. No harm done, because you have nothing
    to harm—all your files are safe and secure in your backup copy. Just sure that
    you give yourself more time than you need for the process. Don''t start installing
    an hour before you have to be at work or before you have to meet your friend downtown.
    Rushing makes people do weird things. Make things easy on yourself by giving yourself
    plenty of time and, by backing up any data you would mourn the loss of.'
  merge: -1
  img_proc: true
- pgno: 56
  md: 'If you''re ready—and why wouldn''t you be?—here are the steps:


    +   1. **Start ''er up.** If you haven''t already done so, boot up your machine
    the Ubuntu CD.


    +   2. **Start the installation.** Once the CD has loaded, you should be looking
