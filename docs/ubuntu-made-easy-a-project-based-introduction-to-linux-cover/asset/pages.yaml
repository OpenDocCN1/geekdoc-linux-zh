- pgno: 32
  md: '# INTRODUCTION


    ![](img/d35fa962e6f9664d66dc83916f426418_32_0.png)


    If you''re standing in the aisle of your local bookstore reading this right now,
    you may be wondering who this book is for. Ubuntu Made Easy, as you might imagine,
    is for readers who are interested in Linux but who feel the need for a jumping-off
    point to get started.


    If you''re familiar with computers but unfamiliar with Linux, or if you are somewhat
    familiar with Linux but not with Ubuntu, this book is for you. This is not primarily
    a book for seasoned geeks or power users; it''s an introductory guide that will
    provide you with some hands-on experience to get up, running, and comfortable
    with the Ubuntu Linux distribution without pain. Think of this book as a rope,
    a compass, and a comfy pair of hiking boots rather than a harness, and a set of
    crampons.


    # Version Compatibility


    Ubuntu Made Easy is based on Ubuntu 12.04 (Precise Pangolin) Desktop edition.
    The CD bundled with this book is the Ubuntu CD, which lets you both try Ubuntu
    without installing it and install Ubuntu to your hard'
  merge: -1
  img_proc: true
- pgno: 33
  md: 'drive once you''re ready. It''s called a live CD. You can boot your computer
    from the CD and run Ubuntu directly off the CD without touching your hard disk
    to see if you like Ubuntu and make sure that Ubuntu will work with your hardware.
    If, after running the live CD, like what you see and every thing seems to work,
    you can install Ubuntu on your computer using the same disc. (There are instructions
    for doing so in Chapter 2.)


    # # Concept and Approach


    The book is intended as both a handy reference and a dynamic learning experience:
    You''ll get some hands-on experience as you work through it. The text is organized
    by increasing skills, so that, as much as possible, you won''t be asked to do
    something that you haven''t already learned. In add-tion, you can put the various
    morsels of knowledge you acquire into practice through several exercises, or projects.


    The projects in this book serve another purpose as well: Working through them,
    you will learn to configure and customize your Ubuntu system. By the time you
    finish this book, you should have a pretty mastery of Ubuntu.


    These chapter descriptions should give you a better idea of what is in store:


    **Chapter 1: Becoming a Pinguista—Welcome to the World of Linux**nWhat''s Linux?
    What''s Ubuntu? What''s a distribution? Can I... ? Will me ... ? Chapter 1 holds
    the answers to these and many other questions you might have as it introduces
    you to the world of Linux and what it takes to get it up and running on your machine.


    **Chapter 2: Wading and Diving—Running and (If You Like) Installing Ubuntu**nThe
    CD that comes with this book works as both a live CD and an install CD. Chapter
    2 tells you how to run a live Ubuntu session from the CD and, assuming you take
    the Linux bug after doing so, how to install Ubuntu on your hard disk. You can
    install Ubuntu as your operating system or with Windows, and you get directions
    for both.


    **Chapter 3: A Place to Call Home—Getting to Know the Desktop**nYou''re probably
    already familiar with the concept of a desktop. Chapter 3 points out the differences
    between Ubuntu''s Unity desktop and your previous operating system, and it teaches
    you a number of cool tricks you can use to customize the look and feel of things.


    **Chapter 4: More Than Webbed Feet—Connecting to the Internet**nHave computer,
    cybertravel, would be the mantra of the Inter-net age, and that being the case,
    Chapter 4 is an indispensable part of your Ubuntu experience. In this chapter,
    you will learn how to connect to the Internet and set up wireless and mobile broadband
    connections. You''ll also find tips for using a modem and some handy troubleshooting
    advice just in case you struggled to get connected.'
  merge: -1
  img_proc: true
- pgno: 34
  md: '# Chapter 5: Slipping and Sliding—Exploring the Internet, Linux Style


    With Chapter 4 behind you, it''s time to get serious about all this Internet business
    and start putting it to good use. Chapter 5 takes you on a tour of Ubuntu''s suite
    of Internet applications, in particular the Firefox browser. You''re introduced
    to Ubuntu''s email and instant messaging tools before embarking on a crash course
    in social networking with Twitter and Ghibber.


    # Chapter 6: Rounding Out the Bird—Downloading, Installing, and Updating Programs
    the Easy Way


    The default Ubuntu installation includes most of the software you need, but there''s
    still much available out there, free and waiting on the Internet. Chapter 6 teaches
    you how to easily download and install applications using the Ubuntu Software
    Center and how to broaden your software horizons using third-party repositories.


    # Chapter 7: A Tiny Nest—File and Disc Handling in Ubuntu


    From creating folders to copying files to browsing your system and network, Chapter
    7 covers all file management. You''ll learn how to work with USB storage devices,
    transfer files via Bluetooth, burn data CDs and DVDs, deal with CD-RW disks and
    multissession CDs, and create space-saving compressed archives of files.


    # Chapter 8: Simple Kitten Ways—Getting to Know the Linux Terminal and Command
    Line ... and the Cool Things It Can Do


    Many people stay away from Linux because they perceive it as a system in which
    everything still needs to be done by executing commands. Perception is a load
    of squashed avocados, as the saying goes. Still, a lot of stuff can be done via
    the command line-based Terminal, and Chapter 8 will tell you all about it as it
    tames your fears and piques your interest in commands. Really.


    # Chapter 9: Dressing Up the Bird—Customizing the Look and Feel of Your System


    Tired of looking at the same old desktop? Feeling nostalgic for the desktop in
    your previous operating system? Chapter 8 tells you how to beat the deja vu by
    changing the look and feel of your system to take control of Ubuntu''s visual
    effects, Compiz.


    # Chapter 10: Gutenberg—Setting Up and Using Your Printer and Scanner


    Just about everyone with a computer has or needs a printer. Chapter 10 tells you
    exactly how to get your printer (or scanner) working with Ubuntu.


    # Chapter 11: Polyglot Penguins—Linux Speaks Your Language


    Need to jot a note in Urdu? Write a book in Korean? Send a letter in Chinese to
    your friend in Chengdu? Chapter 11 gives you what you need to read and write in
    just any language in the world.'
  merge: -1
  img_proc: true
- pgno: 35
  md: '# Chapter 12: Penguins at Work—Getting Down to Business in Linux


    Work can be a drag, especially when there are so many things you could be doing.
    Still, wearing the ol'' fingers to the bone is part of life for just anyone outside
    of a Jane Austen novel, and you''ll be glad to know Linux has lots to offer in
    this regard. Chapter 12 introduces you to the various productivity applications
    available.


    # Chapter 13: Right-Brain Penguins—Linux Does Art


    Those with an artistic bent will find Chapter 13 especially useful. You''ll learn
    how to work with your digital camera by downloading images, modifying them, and
    then tagging and organizing them. You will also learn how to work with RAW image
    files and read a bit about other graphics programs.


    # Chapter 14: Tux Rocks—Music a la Linux


    Chapter 14 is the music lover''s true treasure. You''ll learn how to rip CDs,
    encode MP3 or Ogg Vorbis audio files, and create your own mix-and-match audio
    CDs. You''ll also learn how to make music of yours, from creating or modifying
    guitar amp presets to putting it all together with your digital audio studio.


    # Chapter 15: Pluggin'' in the Penguin—Working with your iPod, iPhone, and Other
    Digital Media Devices


    Do you have an iPhone? An Android? A $10 MP3 player from the flea market? Want
    to use it in Ubuntu? Chapter 15 tells you how.


    # Chapter 16: Couch Penguins—Video and DVD Playback in Ubuntu


    Sitting in your dorm room to figure out how to play your DVD copy of the Baxter
    on your Ubuntu-sized computer? Just finished filming a video of your sibling talking
    while asleep and want to do some creative editing of the evidence? Chapter 16
    covers these and other video-related topics.


    # Chapter 17: Feathered Flippers—Linux Gaming


    If music and art don''t keep your mind off things enough, Chapter 17 presents
    you with more diversions: games. In addition to learning what your systems come
    with, you will also learn how to add more, including commercial ones, and even
    run to Java-based games.


    # Chapter 18: Sweet Home Antarctica—Linux Around the House


    As if drive the point yet again, Ubuntu is not just for use in the office or home
    library by those with business, art, or geek things in mind. It can also be used
    in a variety of ways related to home and family. In Chapter 18, you''ll learn
    a number of ways to put Ubuntu to work at home, doing everything from finding
    recipes and keeping track to creating a family tree.'
  merge: -1
  img_proc: true
- pgno: 36
  md: '# Chapter 19: Penguins at the Gates—Working Ubuntu in a Windows World


    Like it or not, Microsoft Windows is probably here to stay (for the-seeable future,
    at least). Chapter 19 shows you how to share files between Windows and Ubuntu
    over a network, install Windows fonts, and install Windows programs to run under
    Ubuntu. Dual-booters take note: You''ll learn how to access your Windows files
    from Ubuntu and change the boot menu.


    # Chapter 20: Defending the Nest—Security


    Although Linux is about as safe and secure as an operating system you are likely
    to use, Chapter 20 tells you how to add a few additional lines of your system.


    # Chapter 21: A Colony of Penguins—The Ubuntu Community


    If there''s one thing that sets Ubuntu apart from most Linux distributions, it''s
    the friendly, ever-growing Ubuntu community that surrounds it. Chapter 21 you''ll
    learn how to participate in the Ubuntu community by reporting bugs, discussing
    problems, and talking to other users.


    # Chapter 22: Wounded Wings—Fixing Common Problems


    Don''t panic! If a computer problem is spoiling your fun, flip to Chapter 22 and
    take heed of the many troubleshooting tips. You''ll find for the most common issues
    and some general advice on diagnosing and repairing poor PC.


    # Appendix A: Installing Ubuntu from a USB Drive


    What with the proliferation of netbooks in recent years, installing Ubuntu from
    CD is becoming to seem like a past passé. Appendix A shows how to install Ubuntu
    from a USB memory stick, which will be particularly useful if your computer lacks
    a CD drive or if the disc included with this book far too attractive not to use
    as a coaster.


    # Appendix B: Ubuntu Desktop 64-Bit Discs


    The CD bundled with this book is designed to work with i386 processors. It will
    also work with 64-bit processors, although not in 64-bit mode. If you''ve got
    what it takes to run Ubuntu in 64-bit mode, Appendix B shows you how to get what
    you need to do.


    # Appendix C: Manually Partitioning Your Hard Disk


    If the basic partitioning advice in Chapter 2 isn''t enough for you, Appendix
    C shows how to carve your hard disk as you desire, from the constraints of the
    Ubuntu installer''s sensible, but ultimately simple, suggestions. If you''re a
    dual-booter and want an easy way to share files between Windows and Ubuntu, this
    appendix is for you.


    # Appendix D: Resources


    Are you crazy for Ubuntu and want to say so? Check out a forum. Do you have a
    hardware compatibility question? Some websites seem to have all the answers. Are
    you looking to read up on other Linux distributions? Appendix D is a great place
    to start.'
  merge: -1
  img_proc: true
- pgno: 37
  md: '# # How to Use This Book


    You can use this book simply as a reference, but that''s not the main idea behind
    its design. Ideally, you should go through the book by chapter, doing the projects
    along the way. This will give you a much broader understanding of how things are
    done (and of how you can get things done), and it will reduce the chance for anxiety,
    confusion, and yet worse, mistakes.


    It is best to read this book and complete its projects when you are relaxed and
    have time to spare. Nothing goes wrong more than working in a rush. And keep in
    mind that Linux and the projects in this book are fun, not just work exercises.
    Linux is fun, so enjoy it!


    # # About the Conventions Used in This Book


    There are a few points worth noting the conventions used in this book. Items in
    **bold** type are ones that you need to click or manipulate in any way, such as
    buttons, tabs, and menus. Where words or phrases are defined, they have been seen
    in *italics*. Text to input into a Terminal window is in a `monospace` font.


    # # About the Projects in This Book


    The projects and other information in this book are primarily geared toward readers
    who have installed Ubuntu using the CD that comes with this book. Most of the
    information also applies to Ubuntu live sessions run from the live CD. Note, however,
    some projects and actions cannot be performed in live sessions because they require
    write access to your hard disk, which is not possible during live sessions. For
    more information on what it means to run Ubuntu from the live CD, check out Chapter
    2.'
  merge: -1
  img_proc: true
- pgno: 38
  md: '# 1


    # BECOMING A PENGUINISTA


    Welcome to the World of Linux


    ![](img/d35fa962e6f9664d66dc83916f426418_38_0.png)


    As the saying goes, there’s no place to begin like the beginning, so in this chapter
    we’ll do just that by introducing you to the world of Linux. We’ll then get you
    up to snuff on what this Ubuntu thing is all about, why you might want to install
    and use it, and what you will need in order to do. For those of you who already
    have joined the Linux world and have Ubuntu or other distribution installed on
    your machines, some of this may be old news, but a few bits of information may
    be of interest to you. For others who may be curious or are still unsure whether
    not to take the plunge, or those of you who have no idea what Linux even and have
    picked up this book to find out, this chapter will prove especially useful.

    You probably have lots of questions as you make your way through the book, and
    like most people, you may also have a few doubts or worries. Hopefully by the
    time you finish, you will have your Linux system up and running; any doubts or
    worries you might have had will been dispelled; and your questions, for the most
    part, will be answered. If you are reluctant to make a commitment by installing
    Ubuntu on your hard disk, remember that you can still follow along because the
    disc that comes with this book contains,


    *'
  merge: -1
  img_proc: true
- pgno: 39
  md: 'in addition to the Ubuntu installer, a live Ubuntu environment—meaning that
    you can get a taste of the Ubuntu Linux experience without having to touch your
    hard drive.


    # What Is Linux?


    Your computer, despite being a collection of highly sophisticated parts, is really
    just . . well, a collection of highly sophisticated parts. On its own, it can
    do nothing other than switch on and off a disk or drive. For it to do anything
    truly useful, it needs an operating system (OS) to guide it. The OS takes a well-owed
    but completely uneducated hook of a machine and educates it, at least so that
    it will understand what you want it to.


    You already know of and have probably used at least one of the operating systems
    that exist today, or did in the past. Windows and Mac OS are such operating systems,
    as is Unix, the commercial-grade operating system behind many Internet sites and
    databases. And don''t think that computers are the only place you run into operating
    systems. Those of you with smartphones, who are themselves miniature computers,
    are probably interacting daily with the Android operating system or iOS, the operating
    system on iPhones and iPads.


    Linux is yet another operating system. It is, however, different from other operating
    systems in terms of both its capabilities and its heritage. Linux was not created
    by a corporation or by some wannate to make money. The Linux core, referred to
    as the kernel, was created by computer enthusiast Lin Torvalds, a member of Finland''s
    ethnic minority, who wanted to create a Unix-like system that would work on home
    computers—particularly him.


    Rather than keeping his creation to himself, Torvalds opened it up to the world,
    so to speak, and compgeeks around the globe to make it better and more powerful.
    It is this combination of applications around the core of the Linux kernel that
    is the essence of all Linux distributions today.


    Linux has acquired many fans and followers since its creation in 1991. Those devote
    praise Linux for its many features, as well as for being robust, reliable, free,
    and open. Despite these positive characteristics, Linux is, on its own, just a
    text-based system. There is no desktop, and there are no windows or charming icons
    to make you feel safe and comfy when you are behind the keyboard. Powerful it
    may be, Linux is strictly a black-screen, command line–driven operating system.
    I guess you could think of it as DOS on steroids, though a Linuxist surely cringe
    at the thought.


    Although you can use Linux by itself, accomplishing all your tasks by typing commands
    on a black screen (the most common way of doing things when Linux is used as a
    server), you don''t have to do that. It is fair to say that with the advent in
    1984 of the Macintosh and its easy-to-use graphical user interface (GUI, pronounced
    "goo-ee"), DOS users began suffering something


    Chapter 1'
  merge: -1
  img_proc: true
- pgno: 40
  md: 'akin to GUI envy. They began clamoring for a GUI to call their own. The final
    result was Windows, which gave DOS a GUI and eased many commandary users into
    the Microsoft world.


    Similarly, many members of Linux world felt the need and desire to go graphical.
    The community at large developed GUIs (called window managers and desktop environments)
    and a subsystem with which to handle them (somewhat confusingly referred to as
    the Windows System). The graphical desktop environment that is included in Ubuntu
    distribution—Unity—is one example of the fruit of that development.


    # About the Penguin


    You may have been wondering about the penguin in the chapter title, so I might
    as explain that now. The penguin was chosen by Linux Torvalds as the mascot, and
    what has come to be thought of as the Linux penguin was designed by Larry Ewing
    and named Tux (see Figure 1-1). This explains not only the ornithological references
    and graphics throughout the book but also there are many penguin icons in Linux
    distributions and so programs that include penguin or Tux in their names, as Tux
    Racer, Tux Paint, and Penguins, combined with the fact that Linux is a revolutionary
    OS, explains why Linux users are sometimes referred to as Penguinistas. True,
    Ubuntu doesn''t play the penguin as other distributions, but Linux is so the penguin
    lives in Ubuntu . . . . just a bit consciously.


    ![](img/d35fa962e6f9664d66dc83916f426418_40_0.png)


    The goal of this book is not to twist your arm and make you dump your current
    OS for Linux. If you are happy with what you''ve got, then stick with it. However,
    many people have switched to Linux for one reason or another. For many, as it
    may say, it is a matter of money.


    Unlike life in the Windows and Mac worlds, all software you could conceivably
    want comes bundled in a Linux distribution, and there are still thousands of additional
    applications that you can add for free. And unlike the freeware and shareware
    applications in the Windows and Mac worlds, which eventually ask you for $25 here
    and $35 there, you will not be hit for money when you least expect it. You will
    also not have to worry about the applications installing, unbeknown to you, backdoors
    or keyloggers or making your system a sudden of adverse.


    # Should You Use Linux?'
  merge: -1
  img_proc: true
- pgno: 41
  md: 'Although Linux is important to the average user, it is certainly not the only
    reason Linux users make the switch. For some, it is a matter of personal philosophy—the
    belief that software should be freely accessible to all. Others like it because
    it gives them total control over everything, from how things behave to how they
    look; in other words, Linux lets them geek around. Others like it because the
    stability Linux is noted. For trying your current system for a month without restarting
    and what happens. Linux has been known to run without a reboot for more than a
    year without a hitch or decrease in performance. With its multilingual capabilities,
    Linux is also a perfect choice for language students or users in a multilingual
    environment.


    Finally, with the advent of Microsoft''s Windows 7 system and its more demanding
    hardware requirements (especially if the user is trying to take advantage of its
    most touted features), some find their current machines on the fast track to obsolescence.
    Turning it into a Linux machine will give it several years of working life. After
    all, it''s a shame to put good hardware out to pasture early.


    # What Is a Distribution?


    An operating system consists of a lot of files that perform a lot of different
    functions. And because there is no Linux corporation to package and distribute
    the files that make Linux, the task of getting Linux onto your computer in working
    order, along with the applications you are likely to want, has fallen to a varied
    group of entities—companies, universities, groups, and even private individuals.
    These entities created Linux system and application collections called *distributions*,
    or *distros*. You could bypass such distros and try to collect everything you''d
    need to set up a system on all yours, but would undoubtedly lose your mind in
    the process. Most people, even the geekiest, opt for the distros.


    Most of these distros, whatever their target audience, basically consist of the
    same main elements: the core operating system (that''s the Linux kernel I mentioned
    earlier); some sort of installer program to get the system parts and applications
    properly installed on your machine; the X Window System to provide graphical interface
    support; one or more graphical desktop environments; and a series of applications,
    such as word processors, audio players, and games; as well as all the files needed
    to make this work.


    There are, of course, a large number of distros, such as businesses, educators,
    gamers, students, system administrators, and specific language users. What makes
    each distro different is the software that is bundled with the Linux kernel, well
    as other convenience features such as the package (or application) installation
    mechanism and the installer for the system itself. Some distros are especially
    appropriate for home users because of their ease of installation. Ubuntu, a relative
    newcomer to the Linux world, is one of these, joining other distros that have
    long been popular in the ease-of-use arena, such as openSUSE and Fedora.'
  merge: -1
  img_proc: true
- pgno: 42
  md: "# What Ubuntu?\n\nUbuntu is a completely free, easy-to-use, and extremely Linux\
    \ distribution that is geared towards the desktop user. It is one of the hottest\
    \ Linux distros in the marketplace. It is also one of the few Linux distros with\
    \ what could be described as a social agenda behind.\n\nUbuntu was the brainchild\
    \ of South African millionaire entrepreneur Mark Shuttleworth, who is probably\
    \ better known for being one of the first space tourists—the African in space,\
    \ to be exact. Shuttleworth invested more than $10 million in starting the Ubuntu\
    \ Foundation based on free software and in order to fix what he describes as “bug\
    \ #1”—Microsoft’s dominance of the desktop PC marketplace (https://bugs.launchpad.net/ubuntu+/bug/1).\n\
    \nAs Shuttleworth states in his blog (available at https://wiki.ubuntu.com/MarkShuttleworth):\n\
    \nI believe free software brings a new era of technology, and holds the promise\
    \ of universal access to the tools of the digital era. I drive Ubuntu because\
    \ I would like to see that promise delivered as reality.\n\nAs you can see, it’s\
    \ a vision thing.\n\n Befitting the nationality and goals of the man who brought\
    \ it into being, the word ubuntu comes from the Zulu and Xhosa languages. Ubuntu,\
    \ according to Wikipedia, is a concept meaning something along the lines of “humanity\
    \ toward others” or “I am because we are.” If you’re interested, the 2005 film\
    \ In My Country, although not one of the greatest films ever produced, is on many\
    \ levels a 100-minute examination of the concept ubuntu.\n\n# Why Ubuntu?\n\n\
    With many distros out there, you may wonder why you should opt for Ubuntu. Well,\
    \ as they say, numbers don’t lie, and Ubuntu’s popularity is not without good\
    \ cause. Like most Linux distributions these days, Ubuntu is easy to install and\
    \ quite robust and dependable in terms of everyday use. Unlike other distributions,\
    \ Ubuntu is based on the Debian distribution, which means it utilizes Debian’s\
    \ very convenient DEB package system for application handling and installation.\
    \ The graphical package installer that comes with Ubuntu, Ubuntu Software Center,\
    \ makes installing applications even easier, and so many applications available\
    \ there, you are likely to find more software than you’ll ever know what to do\
    \ with.\n\nMore importantly, Ubuntu is designed to be user friendly—it tries to\
    \ enable people to do what they do most easily as possible. It is designed with\
    \ the needs of real people in mind, not just computer-nerds and geeks. As such,\
    \ it is designed primarily as a desktop system, called Unity, which is a very\
    \ comfy place for the average desktop user."
  merge: -1
  img_proc: true
- pgno: 43
  md: 'Finally, while some distros are updated at a snail''s pace and others strive
    to be cutting edge that they are plagued with bugs, Ubuntu has a reasonable six-month
    release cycle. In this frame, it tries to stay up-to-date as possible, while at
    the same time making sure things are not released before they are ready for prime
    time. In this way, you are ensured of having an up-to-date yet buggy distro at
    your disposal.


    # # Hardware Compatibility


    If you haven''t installed Linux on your machine yet, you might be wondering whether
    or not Ubuntu will run on it. This used to be an important consideration when
    installing a Linux distribution, but these days it''s less of an issue for a number
    of reasons. Of course, there are so many minor parts to your machine that it is
    difficult to say whether each part will cooperate with your installation. There
    are video cards, sound chips, LAN cards, monitors, and all need to be considered.
    Nevertheless, chances are good that Ubuntu will run on your machine. The even
    better news is you can test your setup work by using the disc that comes with
    this. If, after starting up your machine from the live disc, everything seems
    to be going as it should ... well, your worries are over, and you can install
    the system whenever you''re ready and waiting. That is a great and pretty much
    risk-free advantage.


    # # When Research Is Required


    If things don''t work out for you with the live CD, you will have to do a bit
    of investigating. You can start by taking a look at Chapter 22. If you don''t
    find the answer to your problem there, search the Web to see whether you can identify
    part of your hardware puzzle is (Or if you are looking for a machine to install
    Ubuntu, you can search for hardware that is supported by Linux.) Of course, before
    you do this, you need to know what models of hardware you have. You should know
    at least motherboard, central processing unit (CPU), monitor, and video card if
    you want to be able to find out anything of value. Identifying your CPU and monitor
    should be easy enough, but the motherboard and video card may require a bit more
    searching.


    If you have no documentation that clearly states the make and model of these devices,
    you can go to the Windows Control Panel, double-clicking **System**, and then
    clicking the **Hardware** tab in window. Once on the Hardware tab, click the **Device
    Manager** button and see what you can find out about your system components. Sometimes
    the information is limited, so you might instead want to try a software application
    such as HWININFO (http://www.hwinfo.com/) or Sandra (http://www.softinfo.net/)
    to get more useful details, such as the specifications of your motherboard or
    the supported modes for your current setup.


    Both HWINFO and Sandra should give you the information you need about your motherboard,
    but if they don''t (or if you don''t feel like booting them), you can just open
    the case of your computer and look at'
  merge: -1
  img_proc: true
- pgno: 44
  md: 'your board. Note that I wouldn''t recommend doing this if you have a laptop.
    Once inside, you wouldn''t worry about damaging anything because you don''t need
    to touch anything—so don''t. You may need a flashlight to find it, the model name
    and number should be stamped on somewhere, in the middle of the board or around
    the edges. Mine, for example, says clearly in the middle of the board "AOpen MX46-533V."
    You should be looking for similar information.


    Once you have all your information, you can do a variety of things to check out
    your hardware''s compatibility with Ubuntu. You can simply do so via Yahoo! or
    Google search by entering your motherboard''s name and model plus word Linux.
    This works for other hardware devices too.


    You can also post a question on the Ubuntu User Forums (http://www.ubuntuforums.org/)
    or one of the other Linux forums or mailing lists on the Web. Chapter 21 might
    provide you with additional sources of information, and Appendix D lists still
    other sources. When posting a question, just that you are a newbie and want to
    know whether anyone has any experience using Ubuntu with the board (or other hardware)
    in question you will probably get quite a few responses. Linux users are usually
    rather evangelical in trying to draw in new Penguinists.


    # Hardware Requirements


    All worries about compatibility aside, you will need to meet some minimum requirements:


    +   - Any computer with a 1 GHz or i386-based processor or an Intel or AMD 64-bit
    processor

    - About 5 gigabytes (GB) of hard disk space, though having at least 10GB would
    be a bit more comfy

    - Sufficient memory (RAM)


    > NOTE The CD that comes with this board is designed to work on machines with
    i386-based processors (basically, all the Pentium chips, including Celeron, Xeon,
    and the new Core Duo, as well as processors from AMD). Though this CD will install
    Ubuntu on a computer with an AMD or Intel 64-bit processor, it will run in 32-bit
    mode. To make full use of your 64-bit processor, you will need to download the
    64-bit version of Ubuntu. Additional information is provided in Appendix B.


    As for random access memory (RAM), the official specs tell you that you need a
    minimum of 512MB to run Ubuntu. Although you cannot doubt by this, you will get
    much better with more. My basic rule of thumb, no matter what OS I am dealing
    with, is that you need the recommended (not the minimum) memory plus 256MB, preferably
    512MB Regardless of what the official specs say, put in more. You won''t regret
    it.


    Saying "The memory you have, the better," may sound a bit simple, perhaps even
    cavalier, but trust me on this one. When you have too little memory, no matter
    what system you are running, weird things happen: Applications seem to take years
    to open or don''t open at all, menus take forever to'
  merge: -1
  img_proc: true
- pgno: 45
  md: 'render their little icons, and freezes and general system meltdowns just happen
    much often. In other words, running your machine on too little RAM is sort of
    like to jumping jacks in a broom closet. Sure, you could do it, but you would
    be all contorted, and you''d be smashing your hands into the walls every 1.4 seconds.


    Fortunately, it is pretty hard to find a machine with less than 512MB if you happen
    do have such a machine, you can take solace in that memory which is relatively
    cheap, so go for it.


    # Good News for 64-Bit Machine Users


    It is again important to mention that the CD that comes with this book is designed
    to work on machines with i386-based processors, which pretty much covers the vast
    majority of PCs out there. If your machine is 64-bit, you will be glad to know
    that it will work, albeit not in 64-bit mode. Sorry, but no.


    Fortunately, there is good news for those of you who were a bit disappointed by
    the content of that previous paragraph. Ubuntu is available in a native 64-bit
    version. Check Appendix B for information on how to get it. The information provided
    there will also be of use to i386 users who happen to lose or damage the disc
    that comes with this book.


    # Mixed News for Mac Users


    Those of you with pre-Intel Power Macs (such as those with G3, and G5 processors)
    may be aware that previous Ubuntu releases have been available in PowerPC versions.
    Unfortunately, if the Ubuntu 7.0 Feity Dawn is no longer the case. This means
    that if you are a Power Mac user, you will have to use an unofficial release of
    Ubuntu for PowerPCs (https://wiki.ubuntu.com/PowerPCdownloads/). For more information,
    check the FAQ at https://wiki.ubuntu.com/PowerPCFAQ/


    Of course, if you are using an Intel-based Mac, you''re in luck: The disc that
    comes with this book will work on your Mac. After all, the i in i386 stands for
    Intel.


    # Speaking Ubuntu


    It''s worth noting that you are become to a lot of weird phrases when dealing
    with Ubuntu, especially when searching for information on the Internet. I''m referring
    to seemingly incongruous phrases, such as Warty Warthog, Gary Hedgehog, Breezy
    Badger, Dapper Drake, Edgy Feisty, Fawn, Gutsy Gibbon, Hardy Heron, Intrepid Ice,
    Jasper Jalapako, Karma Kola, Lucid Lynx, Maverick Meerkat, Natty Narwhal, and
    Oneric Ocel. These are the unique names for each of the releases of Ubuntu since
    its first appearance in 2004. The important one for you to remember is that of
    the current release, which is the one on the book''s disc: version 12.04, known
    as Precise Pangolin.'
  merge: -1
  img_proc: true
- pgno: 46
  md: 'You are also likely to come across a few other variations of the Ubuntu theme.
    These are Kubuntu, a KDE-based version of Ubuntu; Edubuntu, a special version
    of Ubuntu designed for use in the classroom; Xubuntu, a lightweight version of
    Ubuntu based on the XFCE desktop; Lubuntu, another lightweight version of Ubuntu
    based on the LXDE desktop environment; and Ubuntu Studio, a new flavor of Ubuntu,
    aimed at “creative people,” which contains a strong suite of graphics, video,
    and music applications. There are also two specialized versions: Mythuntu, specifically
    designed forating home theater PC with MythTV, and UbuntuTV, designed to create
    a TV-based online streaming and viewing environment.


    # Where Do I Go from Here?


    Now that you know more about the world of Linux and Ubuntu and you have your disc
    in hand, it’s time to get down to it. If you have already installed Ubuntu on
    your machine, just flip ahead to Chapter 3. If your machine is still Linuxless,
    though, it’s time to take it out for a spin and see how you like it. So for now,
    saddle up, clip on your spurs, and go straight to the next chapter. It’s time
    to become a Penguinista!'
