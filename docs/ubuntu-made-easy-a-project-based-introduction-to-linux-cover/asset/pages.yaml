  md: '# Silverlight/Moonlight


    A relative newcomer to the plug-in scene is Microsoft''s Silverlight. It''s less
    common than Flash but seems to be used on the websites of TV channels and major
    sporting events quite a lot. Unfortunately, Microsoft is a little before the times,
    and it hasn''t made Silverlight available for Linux yet. But never fear: An alternative,
    open source plug-in called Moonlight is available. To install Moonlight, follow
    these steps:


    +   1. Open Firefox and go to http://www.go-mono.com/moonlight/.

    2. Click the Install button on the Moonlight page and scroll down to section 2.
    Download the plug-in.

    3. Now click the green-pointing arrow. A bubble will appear at the top of the
    screen saying that the website was prevented from installing software.

    4. Click the Allow button in the bubble, and an Add-on downloading bubble will
    pop up. Wait for the plug-in to download.

    5. Once it''s finished, a Software Installation window will appear. Click Install
    Now and then, in the bubble that appears, Click Restart Now to finish installing
    the plug-in (all of the pages that you open when Firefox opens again).

    6. Head over to http://www.farseergames.com/demo/. If Moonlight was installed
    properly, you should now see a little boat bobbing around on the waves (Figure
    5-11).


    ![](img/d35fa962e6f9664d66dc83916f426418_101_0.png)


    Figure 5-11: Checking that the Moonlight plug-in is working properly'
