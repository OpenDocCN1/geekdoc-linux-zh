- pgno: 136
  md: '# Videos


    It''s not just music that gets a all to itself in the Dash. There''s also a Video
    lens, with an icon that looks like a film strip with an arrow on it—I''ll spare
    you details—it works in a very similar manner to the other lenses—except to pick
    out one run feature. Open up the Dash, bring the Video lens by clicking its icon,
    and search for *cat*. If you''re connected to the Internet, you''ll see a band
    of results called Online with a number of pictures of feline or another. What''s
    happening here is that the Dash is searching through a bunch of popular video
    websites, like YouTube and Vimeo, and bringing the results directly to your screen.
    If you click **Filter results** and expand the section called *Sources*, you can
    see a full list of the websites that are being searched. Click one of the videos,
    and it''ll pop up in your web browser, ready to view. Ubuntu Dash: the perfect
    procrastination tool. Who would have thought?


    # Nautilus: The Fully Featured File Manager


    The Dash is a handy tool for finding your files in a hurry, as you''ve just seen.
    It''s not so useful if you need to move, collect, or otherwise organize your files.
    It''s also light on more advanced features, like accessing files over the network
    and transferring documents to USB memory sticks and other devices. Fortunately,
    Ubuntu has something a bit more substantial to handle that sort of thing in the
    form of Nautilus. Nautilus is the program that creates the file-viewing and organizing
    interface on your system. You may not have thought of an operating system''s file
    manager as a program before, but in fact, that is what it is. (The Windows file
    manager is called Windows Explorer.) To take a look at Nautilus, click the **Home
    folder** in the Launcher, as marked out in Figure 7-2.


    ![](img/d35fa962e6f9664d66dc83916f426418_136_0.png)


    Figure 7-2: The Home folder icon in the Launcher'
  merge: -1
  img_proc: true
- pgno: 137
  md: 'When Nautilus opens to your Home folder (shown in Figure 7-3), you will find
    that you can store your files thematically: Documents, Downloads, Music, Pictures,
    Public, Templates, and Videos. Another folder, titled Desktop, will show everything
    you have stored on your desktop (a like my case; most likely nothing in yours),
    if double-clicked. Yet another folder, called Examples, samples files that give
    you an idea of what Ubuntu is for you.


    ![](img/d35fa962e6f9664d66dc83916f426418_137_0.png)


    Figure 7-3: The contents of your Home folder as viewed in a Nautilus window


    You can create additional folders and files to your heart’s content, so this this
    preconfigured state of affairs is sure to change once you get down to really using
    your system. In fact, you will be making changes in Chapter 9 that will make everything
    a bit more lived in.


    # The Sidebar


    Nautilus has a lot of interesting features that deserve mention, and the most
    obvious of these is the sidebar, which appears at the left side of the window.
    The sidebar allows you to view a variety of information via a couple of select-able
    views. You can make your choices by going to View Sidebar in the menu and choosing
    either Places or Tree.

    def default in Ubuntu is Places, which is a sort of quick navigation tool. In
    Places, you will find icons representing various data-storage locations available
    to your system, such as your Home folder, filesystem, and network shares you are
    connected to (more than in a moment), and any removable storage media or devices
    that you have connected to or your system. Clicking any of these icons will show
    the contents of that location in the right panel of the Nautilus window. The other
    view is Tree, which provides you with an expandable hierarchical view of your
    filesystem.


    Chapter 7'
  merge: -1
  img_proc: true
- pgno: 138
  md: '# Now You See It; You Don’t


    The sidebar is a handy feature, but sometimes you may prefer to have more space
    to view the contents of your window and thus want to get rid of the bar temporarily.
    You can do this easily by going to View > Sidebar in the Nautilus menu and by
    deselecting Sidebar. The checkmark to that entry will disappear, with the sidebar.
    (Alternatively, press F9 on the keyboard to do the same). To get the sidebar back,
    return to the View > Sidebar menu and select Sidebar again. The checkmark will
    reappear, with the sidebar itself.


    If you''d prefer not to hide the sidebar but still appreciate a little more space,
    you can change its size instead. Move your mouse over the gray line that marks
    the boundary between the sidebar and the rest of the window (note that there''s
    also a subtle change in the shade of the ground color on either side of the line).
    When it''s hovering over it, the mouse pointer will change from its usual appearance,
    a single arrow, to a horizontal array of arrows pointing in opposite directions.
    This tells you that the border of the sidebar, the thin gray line, can be dragged
    to resize the sidebar. Getting the pointer directly over the line can be a little
    frustrating, in that it might take a few goes to get the double arrow to appear,
    but once it does, click and drag to resize the sidebar.


    # File Handling in Nautilus


    Since Nautilus is primarily a file manager, it only makes sense to get down to
    the business of using it at that level. Of course, most people who use computers
    today are already familiar with the basics of drag-and-drop and a few others means
    creating folders and copying, cutting, and moving files. But if you''re unfamiliar
    with one way or another of performing these essential procedures, no worries—I''ll
    spell it out.


    # Creating, Naming, and Renaming Folders


    Creating a folder is a simple enough task, and there are two ways of going about
    it. The easiest (in my opinion) is to right-click any empty space within a Nautilus
    window and select Create Folder in the pop-up menu that appears. If you prefer
    using menus over right-clicking empty space, you can instead start things selecting
    File > Create New Folder.


    Regardless of where you made your Create Folder selection, a new folder with the
    Untitled Folder will appear in the Nautilus window. The name box of the folder
    will be highlighted and surrounded with a black box, which means you can immediately
    give that folder a name by simply typing one—nothing to click or do other than
    that. Press ENTER or click any open space in the window to complete the job.


    If you later decide that the name you gave your folder needs tweaking or even
    a complete revision, you can rename it by right-clicking and selecting Rename
    in the pop-up menu. Alternatively, you can click the folder to highlight it and
    then select Edit > Rename. After that, you can type the new name for the folder
    and then press ENTER, or you can click any open space in the Nautilus window to
    seal the deal.'
  merge: -1
  img_proc: true
- pgno: 139
  md: '# Moving Files and Folders


    Perhaps the easiest of all file manipulations you can perform in Nautilus is moving
    a file by means of drag-and-drop. There is another way of moving files and folders,
    however: cut-and-paste.


    The easiest way to cut and paste is to right-click the file (or folder) you want
    to move and then select Cut from the pop-up menu (**Edit | Cut** will also do
    the trick). At this point, it will seem as if nothing has happened because the
    file will be there, but don''t worry.


    After that, right-click any space in the folder to you want to move the file and
    select **Paste** in the pop-up menu. The file will disappear from its original
    location and appear in its new one.


    Can you use key combinations to do this? Sure. Follow the directions I gave, but
    press CTRL-X to cut and CTRL-V to paste.


    # Copying Files and Folders


    Based on the instructions you just read, you can well imagine how you''ll copy
    files and folders, because copying is essentially a variation on the same theme.
    Right-click the file you want to copy, select **Copy** from the pop-up menu, right-click
    any open space within the target location, and then select **Paste** to paste.
    Keystroke-wise, that would be CTRL-C to copy and, as before,


    It is also possible to copy folders and files via the wonders of drag-and-drop,
    though this involves more hands than required for drag-and-drop move; fortunately,
    the two will do nicely. Press and hold the CTRL key while you drag the file or
    folder you want to copy to the target location. Be sure to release the mouse button
    first and then the CTRL key (releasing in the opposite order will not work), and
    you will find a copy of the file in its new location and the original still where
    it was.


    # Navigating in Nautilus


    Navigating through your various folders and subfolders in Nautilus is quite straightforward.
    In fact, all is conceptually pretty the same as what you are accustomed to in
    Windows and Mac OS. You can simply move into and out of folders through a combination
    of double-clicking folders and clicking the Back and Forward buttons.


    # Browsing with Breadcrumbs in Nautilus


    In addition to the hierarchical view option provided in the side pane, another
    handy feature can make your navigation chores even easier: Nautilus''s breadcrumb
    bar feature. As you wander deeper into your forest of folders, Nautilus will leave
    a trail of breadcrumbs (they look like buttons, actually) in the navigation bar
    for each folder you opened on the way to the one you are currently viewing.


    102 Chapter 7'
  merge: -1
  img_proc: true
- pgno: 140
  md: 'Say, for example, that you have a folder gooseberries inside a folder called
    Dalarna inside a folder called SwedeStuff inside a folder NordicStuff, which itself
    is in your Home folder. As you click the box and that gooseberries folder, starting
    by double-clicking the NordicStuff folder, Nautilus will display a button for
    that folder . and any folder opened before it. Take a look at 7-4 to see what
    I mean.


    ![](img/d35fa962e6f9664d66dc83916f426418_140_0.png)


    Figure 7-4: Breadcrumb navigation in Nautilus


    As you can see, there is a button for each of the folders within the path from
    your Home folder to your target: gooseberries. So what, right? Well, say you want
    to go to the NordicStuff folder to open a file to grab some text and copy it into
    a document in the gooseberries folder. That sounds like a minor pain, right?


    Well, rather than goof around with the Back button, follow the crumbs! Simply
    click the NordicStuff breadcrumb button, and the contents of that folder will
    be before you. Need to go back to gooseberries? Just to SwedeStuff, you say? Just
    click the SwedeStuff button. All fantiastic!


    # Spelling Out—Typing File Paths in Nautilus


    If you prefer typing to clicking, you will be happy to know that you can navigate
    to a folder by typing its path. Just click the Go menu and select Location (key
    shortcut CTRL-L instead). A box will appear in the location bar (Figure 7-5) showing
    the current location, which, in the case of my buried example, would be /home/rg/NordicStuff/SwedeStuff/Dalarna/gooseberries.
    You can type the path to your target folder in that box and press ENTER, after
    which the contents of the target folder will appear below the main pane of the
    Nautilus window.'
