  md: '# Ubuntu Software Centre


    ![](img/d35fa962e6f9664d66dc83916f426418_117_0.png)


    Figure-6-2: Browsing the selection of games available from the Software Center


    For most people, there''s no need to think about these technical items, so you
    can hide them away by clicking the **Hide** button at the bottom of the window.
    If you''re inclined to tinker with this sort of thing, you need to be aware of
    a few things before you dive in. Many of these items are actually quite important
    for the day-to-day running of your system, and removing them might have some negative
    effects side. There''s a program that''s responsible for managing your Internet
    connection, for example; it''s probably best to let that one alone. Also, many
