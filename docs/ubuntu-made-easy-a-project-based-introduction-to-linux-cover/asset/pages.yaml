    # For the Driverless Among You


    As I mentioned, Linux does not yet have built-in support for a few printers. If
    you find yourself with such a printer, you can take a few routes in order to get
    things working.


    # Checking the Connections


    You''d be surprised how many times I have triumphantly solved someone''s printer
    problems by simply turning on the printer or wiggling or unplugging the USB or
    parallel connectors. Printers that are powered down and/ have loose connections
    are often to blame the printer''s model name fails to appear in the first page
    of the printer setup.


    If that approach fails, browse to http://www.openprinting.org/printers/ because
    sometimes Linux can support certain printers only if they are connected via the
    parallel port, or if they work via USB in other systems.


    # Trying Your Windows Drivers


    If your printer came with an installation device, you might want to see whether
    you can find a driver for it there. The driver on such device should end in .ppd
    (for “PostScript printer description”). To use one of these drivers, trying your
    printer as described earlier, but when you get to the New printer where you select
    your printer''s make, click the Provide PDF file option. Then try to locate the
    appropriate file by clicking the button that says (None) in the middle of the
    page. If you find your driver, click the Forward button and then continue the
    printer setup.'
  merge: -1
  img_proc: true
- pgno: 223
  md: '# Using Third-Party Drivers


    Recently, more Linux printer drivers are becoming available. If you don''t find
    your printer on that second page of the printer setup wizard, just try searching
    the Web for the make and model of your printer plus the word linux. In the past,
    for example, I had a laser printer that did not appear at http://www.openprinting.org/printers/,
    so I searched for the printer, samsung+SCX410+, which led me to http://www.driverstock.com/,
    a site that provides free drivers for most operating systems, including Linux.
    On that site, I found not only the driver for my printer but also the driver for
    its built-in scanner.


    You might also want to check the website of the manufacturer of your printer,
    because many provide Linux drivers for a number of their printers. Brother, Lexmark,
    Hewlett-Packard, Canon, and Samsung, to name a few. There is also a German company
    (http://www.turbprint.info/; site in English) that provides Linux drivers, albeit
    for a fee, for machines that are really hard to deal with and for high-quality
    graphics solutions.


    If you happen to find and download a driver for your printer that does not come
    with its own installer, follow the directions for trying Windows drivers. Finally,
    don''t forget to check the Ubuntu forums (http://www.ubuntuforums.org/) a try
    to see whether anyone has any experience getting the printer to work on his system.


    # Trial and Error


    Finally, there is always the old trial-and-error approach, which works on occasion.
    When setting up your printer via the wizard window, try choosing one of the other
    models and/or drivers available from your printer''s manufacturers.


    After you are done with the wizard, double-click the printer you added in the
    Printing window, click the Settings tab, and then click the Print Test Page button
    to see what happens. If nothing happens, click the Change button on the far right
    end of the Make and Model row on the Settings screen; select a different printer
    and/or driver; and then, click on the Print Test Page button again. Repeat that
    process until something works. With any luck, something will ... might ... well,
    just give it a try if you''re desperate.


    # Printing Details


    Now that your printer is set up, you will no doubt want to start printing! This
    is an easy task, and it isn''t very different from how it works in the and Mac
    worlds, so you shouldn''t need much explanation to proceed. In fact, printing
    in Ubuntu has become easier than ever, because all the settings you would normally
    want to toy with are all on their own tabs within the Print window that appears
    when you select Print in an application''s File menu. I would even dares that
    figuring out printing options in Ubuntu is now easier than it is in Windows or
    OS X.'
  merge: -1
  img_proc: true
- pgno: 224
  md: 'You should be aware that the function of the tabs can vary depending on the
    application you happen to be printing from. For instance, the tabs''ll see when
    printing from the GIMP will be slightly different from those you will see when
    printing from Firefox. The General and Page Setup tabs will almost always be there,
    All that I said, I''ll give you an idea of the settings that are available within
    some of the Print window''s tabs:


    +   **General** Printer selection, pages to print, number of copies, order of
    printing, collating

    **Page Setup** Pages per sheet, scaling, paper type, paper source, output tray

    **Options** Print frames, shrink to fit page, print background, headers and footers

    **Image Settings** Size, resolution, at time)

    **Job** Print timing (now, later, at), cover page


    # Printing in LibreOffice


    Occasionally, you will come across an application that has a slightly different
    way of handling printing. Fortunately, the differences may actually make printing
    in LibreOffice more easier for newbies from the Windows-like world to follow along
    with. As you can see in Figure 10-6, the main window for LibreOffice applications
    allows you to select the printer you want to use, the range of pages, and how
    many copies you want to print. You can access other options by clicking the Properties
    and/or Options.


    ![](img/d35fa962e6f9664d66dc83916f426418_224_0.png)


    Figure 10-6: Print settings in LibreOffice'
  merge: -1
  img_proc: true
- pgno: 225
  md: '# Printing to PDF


    One of the nice features of Linux is that you can save most documents and web
    pages as PDF files. In some cases, such as in LibreOffice, you do do this by exporting
    the document to PDF. In most other applications, however, you do it via the Print
    window, in which case you are said to be "printing to PDF." Whether you are saving
    as PDF, exporting to PDF, or printing to PDF, you are essentially doing the same
    thing: creating a PDF file of your document.


    This is very hard, because it allows you to create documents that cannot be altered
    by others you can easily be read regardless of the word processor or operating
    system the reader is using. Best of all, this feature, which you would have to
    pay a pretty penny for in the Windows world, costs you nothing because it is built
    into your system.


    In most applications, you can print to PDF by going to File menu of the application
    in question and selecting Print. When the Print window (Figure 10-7) appears,
    select Print to File in the list of printers and make sure PDF is the output format.
    Choose a name for the PDF file and then click the Print button to save.


    ![](img/d35fa962e6f9664d66dc83916f426418_225_0.png)


    Figure 10-7: Printing a file to PDF in GNOME applications


    # Canceling a Print Job


    It happens to all of us. You wanted to print just 1 page of a 57-page document,
    but you accidentally started printing the whole thing. What can you do to save
    your ink and 56 sheets of paper? Fortunately, the solution is simple.


    Click the power button on the far right of the top panel and select Printers from
    the menu. Right-click the icon for the printer''s overzealous handling your document
    and select View Print Queue from the pop-up menu. A window showing your current
    and queued print jobs will appear (as shown in'
  merge: -1
  img_proc: true
- pgno: 226
  md: 'Figure 10-8. Your errant job will be listed in window, right-click the name
    of the job to select it and then, in the pop-up menu, select *Cancel*. You''ll
    be asked whether you want to cancel the job; click **Yes**.


    ![](img/d35fa962e6f9664d66dc83916f426418_226_0.png)


    Figure 10-8: Canceling a print job via the Print Queue window


    After you do, the print job listed in the queue window will disappear, and your
    printer will stop printing. You can then close the print queue window. You may
    find this easy process is more effective than what you''ve experienced in other
    operating systems.


    In some cases, things will be even easier, particularly if you installed your
    printer driver by means of the installer that came packaged with the driver. In
    such cases, the driver might provide its own progress window that will appear
    whenever you print a document. If so, you can simply click the **Cancel** button
    (or equivalent) in that window to cancel the printing job.


    > NOTE In some cases, you may have to clear your printer after canceling a print
    job. You can do this by turning your printer off, waiting a few seconds, and then
    turning it on again.


    # Checking Ink Levels and Other Printer Maintenance Tasks


    Printer ink or toner has a knack for vanishing like freshly baked cookies, so
    it''s natural to check on how your cartridges are. You might also run into problems
    with the printer, such as streaks on printouts or jagged lines that should really
    be straight, so it may be necessary to clean or align the print heads. Unfortunately,
    there''s no one simple method of doing this since every make of printer handles
    it differently. I''ll just mention a few ways you can access these options for
    the most common brands:


    **HPLIP** This works for Hewlett-Packard Software Center and install HPLIP Toolbox.
    Search for **HPLIP Toolbox** in the Dash to run it; use the Supplies tab to check
    ink levels and the Actions tab to align and clean your cartridges.


    **Mtink** This works for a number of Epson, Canon, and HP printers—check http://xtools.automatix.de/english/overview.htm#PRINTERS
    to see whether your printer is supported. Open the Ubuntu Software Center, install
    Mtink, and then open it from the Dash to check your ink levels.'
  merge: -1
  img_proc: true
- pgno: 227
  md: 'escputil This works for some Epson printers and is worth a try if Mtik doesn''t
    support your model. Open the Ubuntu Software Center and install escputil. Then
    open a Terminal by searching for Terminal in the Dash. Type escputil -i (don''t
    forget the space) and hit ENTER to display the ink levels. To clean the print
