- pgno: 307
  md: '# Copying Songs from Your Audio Device to Your Hard Disk


    One feature of most digital media players that aren''t available in iTunes (at
    least without the installation of a special freeway plug-in) is the ability to
    copy songs from your iPhone/iPod to your hard disk (or to an external USB drive).
    Luckily, Rhythmbox allows you to do this easily.


    To copy music from iPhone/iPod/iPod, Android-based phone, or other digital media
    device with Rhythmbox, select the tracks you want to export (hold down the CTRL
    key to make multiple selections or use the tabs to select artists or genres if
    you like) and drag the selected items to your desktop, music folder, or wherever
    you want. The only catch with this mostly simple approach is when copying files
    from your iPhone/iPod, you end up with files on your hard disk with funky filenames,
    such as ZPAD.m4a or ATDT.mp3, rather than the name that appeared on your iPhone/iPod
    within Rhythmbox. This means you''ll have to rename the files once they have been
    transferred to your hard disk. It isn''t too much of a chore unless you''re dealing
    with lots and lots of files or if you''ve forgotten which file is which. In the
    latter case, right-click the file, click Properties, and then click the Audio
    tab, where you will find the original filename (Figure 15-6). Once you know the
    filename, click the Basic tab, type the correct name in the Name box, and click
    Close.


    ![](img/d35fa962e6f9664d66dc83916f426418_307_0.png)


    Figure 15-6: Finding the properties of a mislabeled audio file'
  merge: -1
  img_proc: true
- pgno: 308
  md: '# Ejecting your iPod or Other Digital Device from Within Rhythmbox


    When you''re done working with your iPod or other digital device in Rhythmbox,
    you can eject it in one of two ways. Either click its entry in the left pane of
    the Rhythmbox window and then click the Eject button near the top of the window,
    or right-click its icon in the left pane and select Eject in the pop-up menu that
    appears. If Rhythmbox is closed, this right-click-to-eject approach also works
    from within a Nautilus window or with the Launcher icon for a mounted device.


    # Problems Writing to Your iPod


    If you have an iPod (iPhone, iPod Touch, and iPad not included) that you were
    last using in conjunction with a Mac, you may find that although you can read
    the files on your iPod, you cannot write files to it. If this is the case, most
    likely your iPod is formatted in Apple''s native HFS+ filesystem—although this
    in itself is not a problem. The problem is that HFS+ nowadays have journaling.
    Journaling is an HFS+ feature that acts to protect the filesystem from damage
    due to power surges, power failures, or hardware breakdowns.


    As fate would have, however, the Linux kernel doesn''t deal well with journaling-enabled,
    HFS+ formatted devices. Fortunately, the tweak to fix this is quite simple, and
    it isn''t particularly geeky: You just have to disable journaling on your iPod.


    Disabling journaling is easy if you have a Mac nearby. Just plug your iPod into
    a Mac, which automatically opens, and then run Disk Utility (in the Utilities
    before the Applications folder). When Disk Utility opens, select your iPod (by
    name) in the left pane of the window, press the OPTION key, and then choose Disable
    Journaling in the File menu. After a moment, journaling on your iPod will be disabled
    without any loss of data. If you connect your iPod to your Linux machine again,
    you will be able to use it more or less like normal.


    # Working with Photos on Your Digital Device


    As I already mentioned, if your phone or digital device is photo capable and Ubuntu
    automatically recognizes it, you will be led to Shotwell, just as you are when
    you hook up your digital camera to your Ubuntu machine. In the same way, Shotwell
    takes stock of all photos you have on your device and allows you to copy photos
    to your hard disk.


    As you can see in Figure 15-7, you first select the photos you want to copy to
    your hard disk, add a tag if you like, and then click Copy. After the photos are
    copied to your disk, they will appear in the Shotwell Library, from which you
    can work with them as you see.'
  merge: -1
  img_proc: true
- pgno: 309
  md: '![](img/d35fa962e6f9664d66dc83916f426418_309_0.png)


    Figure 15-7:- Importing photos from your iPhone/iPod/iPad or other device with
    Shotwell


    # Converting Audio File Formats


    As pointed out at the beginning of the chapter, there may be some points of incompatibility
    when it comes to certain audio file formats, your hardware, and Ubuntu. Unfortunately,
    SoundConverter (shown in Figure 15-8) makes it easy to convert Ogg Vorbis files
    to MP3, or vice versa. It can also convert AAC files to MP3 or Ogg Vorbis format,
    if that is of interest to you. Because SoundConverter does not come bundled with
    Ubuntu, you will have to install it from the Ubuntu Software Center.


    ![](img/d35fa962e6f9664d66dc83916f426418_309_1.png)


    Figure 15-8: Converting audio file formats with SoundConverter'
  merge: -1
  img_proc: true
- pgno: 310
  md: 'To use SoundConverter, add the songs you want to convert to the main pane by
    clicking either **Add File** or **Add Folder** button. You can also drag audio
    files from your *Music folder* (or wherever you store them).\ Once you''ve chosen
    the files to convert, you need to choose which format to convert to. You can do
    this by selecting **Edit ► Preferences** and then there, making your choice in
    the Preferences window (Figure 15-9). While you''re there, it''s also a good idea
    to tell SoundConverter to place your converted files in a location other than
    the folder where the original files are stored. This prevents having to deal with
    duplicates in Linux audio playback applications that automatically scan your *Music
    folder*, such as Rhythbox. You might also want to check the **Create subfolders**
    box to keep things organized.


    ![](img/d35fa962e6f9664d66dc83916f426418_310_0.png)


    Figure 15-9: Setting conversion preferences in SoundConverter


    Once you have set things up and are ready to convert, click **Close** in the Preferences
    window and then click **Convert** in the main window. SoundConverter will begin
    doing its stuff.'
  merge: -1
  img_proc: true
- pgno: 311
  md: '# # Playing Locked AAC (M4P) Files


    If you purchased music from the iTunes Store before Apple did away with digital
    rights management (DRM) in its music, chances you are in possession of some locked
    AAC files, which you can recognize by the .m4p extension. These files can be played
    only on registered machines through iTunes. You may have already discovered, you
    cannot do with such files on your system as is. All you will get when you try
    to play one is an error message and an option to have Ubuntu search for the missing
    plugin. Accepting that option is the easiest way to get the support you need to
    play such files within Ubuntu.


    Once you start, Ubuntu will search for the plugin and necessary files. Once Ubuntu
    finds them, it will show the result of the search in a new window. Click Install
    to continue. When the process is complete, you will be able to play previously
    locked AAC files on your system. If Rhythmbox was running while the installation
    process was taking place, however, you will need to restart it before it will
    be able to handle the files.


    # # Linux on Your iPod, iPad, or Android Device?


    One thing you might notice if you do a Google search on using your Android or
    Apple “i” device with Linux is that it is possible to actually replace your iPod’s
    Apple-designed operating system with a form of Linux. Now, I’m not advocating
    that you do this (and I most certainly have not done so myself), but some folks
    are interested in geeking around with whatever gadget they have in their hands.
    If you’re a person or you’re just curious, check out the Linux on iPod site (http://ipodlinux.sourceforge.net/index.html)
    or the more popular Rockbox (http://www.rockbox.org/), which also runs on a number
    of non-Apple devices. You can also find information on installing Ubuntu on Android
    devices, for example at the Geekizer site (http://geekizer.com/install-run-ubuntu-on-android/).'
  merge: -1
  img_proc: true
- pgno: 312
  md: '# 16


    # # COUCH PENGUINS

    Video and DVD Playback in Ubuntu


    ![](img/d35fa962e6f9664d66dc83916f426418_312_0.png)


    Now that I''ve covered much of what Ubuntu can do in terms of audio, it''s time
    to turn to the equally important area of video. Ubuntu is quite capable in terms
    of video, allowing you to view DVDs, video CDs (VCDs), video files you download
    from the Internet, and some Internet streams. It also allows you to download video
    movie files from your digital camera, or capture movies from tape-based digital
    video cameras and then edit them.


    # ## Where the Apps Are


    All of the apps in this chapter can be run from the Dash by clicking the Applications
    lens and then clicking the **Media** filter button. With all applications, you
    can also run an app by typing its name in the Dash''s search box and then pressing
    ENTER.'
  merge: -1
  img_proc: true
- pgno: 313
  md: '# DVDs


    Your system allows you to play DVDs; however, due to licensing concerns, playback
    is limited to unencrypted discs by default. Unfortunately, this rules out a vast
    majority of the DVD movies you buy or rent at your local video shop and leaves
    you with a limited choice of films on your computer. Given the limited offerings
    in the unencrypted DVD world, you will no doubt want to enable your system to
    play the encrypted variety.


    # Project 16: Installing Support for Encrypted DVDs


    I As already mentioned, Ubuntu does not allow you to play encrypted DVDs from
    the start, unless you opted to install third-party support when you installed
    Ubuntu. If you did not do that, then for you to watch such DVDs (and would be
    the vast majority of them), you need to install a whole bunch of stuff—most crucially
    the package libdvdread4. Fortunately, this has become easy to do when Ubuntu tells
    you what you need when you need it, just as it in the previous chapter.

    The first is the easiest: Insert a DVD movie disc in your drive. In few moments,
    a window will appear telling you that you have inserted a DVD (duh!) and asking
    you what you want to do. In the drop-down menu, select Movie Player and click
    OK. A new window will appear as Ubuntu figures what you need to install before
    you start DVDs. Once it is done, accept the default packages suggested in the
    window by clicking OK and entering your password. Then sit back for a minute or
    less until the installation process is complete. Once it is done, you will have
    successfully installed libdvdread4 and a bunch of other necessary files. Now you''re
    ready to play your DVD, right? Well, not quite.

    With just any other application, you would be done at this point, but as with
    now, Movie Player will be open but your DVD will still not be playing. The reason
    is that libdvdread4 requires that you also run an installation script that comes
    with it in order to get the job done. To run the script, open the Terminal, type
    the following, and press ENTER:


    ```

    sudo /usr/share/doc/libdvdread4/install-css.sh

    ```


    You will be prompted for your password, so type it in and press ENTER. Once the
    Terminal returns you to the user prompt, the process will be done. Close Movie
    Player, reinsert the DVD movie disc in your drive, and once again select Movie
    Player in the window that pops up. Once you click OK, Movie Player should open
    and start playing the DVD. (You''ll learn more about Movie Player sooner.)


    # Can I Play Foreign DVDs?


    Your computer can play DVDs of any broadcast standard (NTSC, PAL, or SECAM) and
    of any regional encoding. This is a better setup than the DVD


    Chapter 16'
  merge: -1
  img_proc: true
- pgno: 314
  md: 'player you have hooked up to your TV, because the vast majority of standalone
    DVD players in the United States (I would venture to guess 99.9 percent) do not
    allow you to play anything other than Region 1 NTSC (NTSC) being the broadcast
    standard in the United States and what US televisions are designed to display,
    and 1 being the DVD region). This information is usually provided on the back
    of DVD packages (see the examples in Figure 16-1), though the packaging for most
    discs produced for the US market does not include it.


    ![](img/d35fa962e6f9664d66dc83916f426418_314_0.png)


    Figure 16-1: Examples of region encoding labels on DVD packages


    Despite the wonderful, everything-goes nature of your computer in terms of DVD
    playback, a drive is a serious caveat to bear in mind. Depending on the manufacturer
    of your drive, you will be able to switch and back between DVDs of different regional
    encodings only four or five times. After that, the drive will be locked into the
    region encoding of the disc you are playing at time... forever. This is unrelated
    to your operating system—it is strictly a hardware matter. The only exception
    to this region-lock are DVDs labeled Region Free or ALL (sometimes inaccurately
    labeled Region 0, which can be played on any DVD player in any region and thus
    do not register as a regional encoding when you plop one of them in your computer''s
    drive.


    If your drive does eventually lock into one region for one which you have few
    DVDs, there is some good news. That comes in the form of Videolan''s libvdread2,
    the library that is included in the libvdread4 package you installed in Project
    16A. The libvdread2 allows you to play back DVDs in theory to play back DVDs from
    multiple regions even if your drive is already locked into one region. This can
    be by performing a cryptic attack (to use Videolan''s for it) on your drive until
    you find the disc key for that drive. Of course, this process of cryptic bombardment
    can take several minutes, so it is not the optimal way of doing things. It''s
    better than being stuck, though. Whether this process of bypassing regional encodings
    is legal remains a subject of debate, so if you are concerned about such things,
    you should do a little research.


    # Watching Video Files with Movie Player


    A number of video players are available in the Linux world. The one that comes
    bundled with Ubuntu is, appropriately enough, Movie Player. As you can see in
    Figure 16-2, Movie Player has a very simple interface and is equally simple to
    use.'
  merge: -1
  img_proc: true
- pgno: 315
  md: '![](img/d35fa962e6f9664d66dc83916f426418_315_0.png)


    Figure 16-2: Movie Player


    # Using Movie Player to Play DVDs, VCDs, and Other Multimedia Files**


    Because Movie Player is the default video player in Ubuntu, you can play DVD with
    by simply placing a DVD in the drive, selecting Movie Player when prompted, and
    clicking **OK**. If you''ve got a copy of *Red Detachment of Women* on VCD that
    you''re aching to watch, you can do so in the same way. Just pop the VCD in your
    drive, follow the same steps, and Movie Player should start up and begin playing
    the disc.


    Not only does Movie Player play discs, DVDs, but it can also play MPEG and WMV
    files. Double-click the files directly or go to the Movie Player menu, select
    **Open**, and navigate to the video file you want to view. If you have not already
    installed the necessary libraries to play such files, Ubuntu will tell you what
    you need, and allow you to install them at that point. Easy.


    # **Movie Player as an Audio Player?**


    You have noticed while on the Display tab of the Preferences window that there
    was a Visual Effects section. Well, those visual effects aren''t for the videos
    you play but rather are visualizations to accompany your audio files when they
    are played via Movie Player (Figure 16-3). Yes, Movie Player not only does video
    but also does audio. You can play such files from the Movie'
  merge: -1
