- pgno: 229
  md: '![](img/d35fa962e6f9664d66dc83916f426418_229_0.png)


    # ## 10-3: Installing True Fonts Globally


    As I mentioned earlier, the font you just installed locally can be used when you
    log in under your usual username. If, however, you want to install fonts that
    can be used by you and anyone else who has an account on your computer, the process
    is slightly different and will require a little “superuser” action. You can use
    the other font you downloaded for this part of the project.


    The folder for globally installed fonts is in root territory, you will need to
    open the file browser as superuser in order to install the fonts. Superuser is
    another name for the root (administrative) user. It''s possible to run a program
    without switching to a different user account by using a system called sudo (discussed
    in Chapter 8), but since root can modify system files, you shouldn''t run a program
    in sudo mode unless you absolutely must.


    Here are the steps for getting your font file into the global directory:


    +   1. Press ALT-F2 and then type `ksudo nautilus /usr/share/fonts/truetype` into
    the box that appears. Press ENTER and type your password when prompted.

    2. A file browser will open. Select **File ▶ Create Folder** to create a new folder;
    call it *MyFonts*.

    3. Open a normal file browser (Nautilus) by right-clicking the **Nautilus** icon
    on the Launcher and selecting **Open a New Window**. The `.ttf` font file you
    want to install, and copy it (for example, by right-clicking it and selecting
    **Copy**).

    4. Switch back to the Truefile browser window, open your newly created *MyFonts*
    folder, and paste the font into it.

    5. Be sure to close the superuser file browser window—leaving it open is a recipe
    for disaster!'
  merge: -1
  img_proc: true
- pgno: 230
  md: 'NOTE The gksudo command in Step 1 is the graphical environment version of the
    nongraphical sudo command that you saw how to use via the command Terminal in
    Chapter 8.


    Now you can test things by opening LibreOffice and looking for the font in the
    menu. Remember that you will need to restart LibreOffice if it was already open
    when you installed the font.


    # # Scanners


    Scanners are extremely useful and about cheap a peripheral device as you can get.
    They allow you to put images or pages into digital text into your computer—much
    the same way as you would duplicate a document on a copy machine.


    Even though scanners have been around for a relatively long time, support for
    them in Linux is still a bit spotty. Fortunately, this is for the better with
    every new Linux release. The backend—the hidden part of your system that handles
    scanner recognition and support in Linux—is called Sane. If you are wondering
    whether Linux will be able to recognize your scanner or if you are trying to figure
    out what type of scanner to buy, you can visit the Sane website at http://www.sane-project.org/sanemfgs.html.
    You will be able to see whether your scanner is supported or get tips about what
    scanner to buy. The page is pretty long, so you might want to find the function
    in your web browser <select Edit > Find> to search for your scanner model. As
    I have mentioned, you can also try the Ubuntu forums (http://www.ubuntuforums.org/)
    and for Ubuntu-specific recommendations there.


    # # Scanning, No Questions Asked, with Simple Scan


    Simple Scan is a relatively new addition to Ubuntu''s default applications, and
    it lives up to its name—it doesn''t take many clicks to get a document from scanner
    bed to computer screen. To run Simple Scan, make sure that your scanner is connected
    and switched on then open Simple Scan from the Dash. If you get a warning saying
    that no scanners were detected, skip to "Unrecognized Scanners" on page 196.


    Assuming that your scanner has been recognized, you will be presented with the
    screen in Figure 10-1.


    It''s pretty easy from here—select the type of document you''re scanning (Text
    or Photo) from the drop-down menu next to the Scan button (menu icon is a small
    arrow) and then click Scan. Your scanner will roar into action, and after a short
    wait, you will be presented with a preview of the picture or document you placed
    on the scanner. You can crop and rotate the image by using the Pages menu or by
    right-clicking the picture. When you''re happy with your scan, select Document
    > Save to finish it.


    One little tip: To change the resolution of your scan, select Document > Preferences
    and tweak the settings in the window that appears. Higher resolutions can take
    longer to scan and take more disk space, but choose wisely!'
  merge: -1
  img_proc: true
- pgno: 231
  md: '![](img/d35fa962e6f9664d66dc83916f426418_231_0.png)


    # # Not-So-Simple Scanning with XSane


    Simple Scan will be able to handle most of your scanning needs, but if you have
    some particularly complex scanning that you need to do, you can use XSane. XSane
    is a real monster of a scanning program, packed with professional features and
    fine-tuning options (see Figure 10-11). Search for and install XSane using the
    Ubuntu Software Center and then open XSane image scanning program from the Dash.
    XSane will perform a search for an attached scanner. If it finds one, it will
    start up. If it doesn’t, a window will appear that says “No devices available.”
    If this happens, click the Close button and skip to “Unrecognized Scanners” on
    page 196.


    ![](img/d35fa962e6f9664d66dc83916f426418_231_1.png)'
