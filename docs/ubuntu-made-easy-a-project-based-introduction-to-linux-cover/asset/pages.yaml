  md: '![](img/d35fa962e6f9664d66dc83916f426418_75_0.png)


    As you can see, your virtual desktops look like one giant desktop, and you can
    move the windows to any quarter of that considerable area. Give it a try now.
    Drag these windows around until you have one window in quarter of your desktop.
    Now, if you want to work with one of those windows, double-click that portion
