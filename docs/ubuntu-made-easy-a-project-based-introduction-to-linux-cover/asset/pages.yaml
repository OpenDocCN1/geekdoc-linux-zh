- pgno: 58
  md: '# WHAT IS A HARD DRIVE PARTITION?


    I''ve mentioned partitions several times so far, but I haven''t explained what
    they are. A partition is an area of your hard disk that is "cordoned off" from
    other areas of the disk. It is a useful way of keeping things such as operating
    systems separate. Because they are isolated from each other, different partitions
    are treated as if they are different hard disks attached to your computer, even
    though they''re actually on the same physical hard disk.


    Most computers have just one partition that fills up the hard disk. This is like
    having a house with a completely open floor plan—the whole house is just one room.
    If you want to remove Windows and install Ubuntu, Ubuntu can take over the entire
    partition (and thus the entire disk) and kick out the former resident, Windows.


    If you want to install two operating systems on the same computer, you have to
    give each one own partition (after all, they need their). With the house analogy,
    it a partition wall will carve the house into two rooms. If you choose to dual-boot
    Windows and Ubuntu, the installer will automatically do this partitioning for
    you. Of course you can choose how big each partition is: the bigger you make the
    partition, the more disk space will be available to you in Ubuntu (and the less
    in Windows). After all, the house is the same; it''s just the position of the
    wall that you''re changing.


    You can find some information on manually partitioning your hard disk in Appendix
    C, if you fancy taking control of the process yourself. There should be no need
    to, however, the Ubuntu installer will be happy to handle the task for you.


    +   9. Keeping in mind that this is the point of no return, click the Install
    Now button. A progress bar will appear at the bottom of the window, and the installation
    process will begin.


    +   10. Specify your location and keyboard type. It will take a while to install
    everything, so in the meantime, the installer will ask a few questions that it
    will use to set up your user account. The first question asks you to specify your
    location; do this by clicking on the world map to select a nearby city.


    +   11. Click Continue and choose your keyboard layout from the list. The installer
    should automatically select the right one, or you can try detecting Keyboard Layout.
    You can test that it works as expected by typing into the box provided; pay special
    attention to quotation marks, the pound and @ symbols, and similar keys, since
    these are the ones you''re likely to have trouble with. When you''re happy, click
    Continue.


    +   12. Enter user account details. The Who are you? screen will appear (in Figure
    2-8). This is probably the most fun one—you get to choose the name of your computer,
    your username, and a password. Enter your name first, at the top. The installer
    will make suggestions for some of the other fields, but you don''t have to take
    them. For the computer name, choose something short and simple with no spaces.
    Ditto for the username—as I mentioned in "Usernames and User Passwords" on page
    17, it''ll be a constant presence on your computer screen, so best not to choose
    anything'
  merge: -1
