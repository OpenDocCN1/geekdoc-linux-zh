- pgno: 283
  md: '# Where the Apps Are


    All of apps in this chapter can be run from the Dash by clicking the Applications
    and then clicking the Media filter button. With all applications, you can also
    run an app by typing its name in the Dash''s search box and then pressing ENTER.


    # Audio File Formats


    Before we go any further, it''s probably best to discuss the various formats in
    which audio data can be stored on your computer. For the longest time, the de
    facto standards have been WAV (created by Microsoft/IBM and using the .wav extension),
    AU (from Sun/Unix and using the .au extension), and AIFF (from Apple and using
    the .aiff extension), all of which are uncompressed formats. Saved in these files
    are, therefore, exceedingly large, with an average WAV file of CD-quality weighing
    in up to 10MB per minute. To put that in perspective, back in 1988 my first Macintosh
    had 40MB hard disk—more than I thought I would need but not enough space to store
    a WAV file of Nirvana''s "Come as You Are."


    As computers underwent their evolution into the multimedia machines they are today,
    it became clear that what was going to be done over those disk space-devouring
    audio files. Audio compression formats were thus developed. These compression
    formats oversimplifies a bit, by cutting out the portions of a sound that the
    human ear cannot hear—sort of a dog-whistle approach. The most widely known and
    embraced of these audio compression formats is MP3. Audio files encoded in MP3
    format can end up as little as one-twelfth of the original WAV file without any
    noticeable loss in quality.


    Another audio compression format is Ogg Vorbis. Ogg Vorbis is a product of the
    open source community, unlike MP3, which has always been used under the shadow
    of yet-to-be-exercised patent rights, is free of and licensing worries from the
    get-go. Because of that and the fact that it was the equal of MP3 in terms of
    quality and performance (if not, as many claim, better), Ogg Vorbis became the
    darling of the Linux community.


    As you rip audio files in this chapter, you are sure to notice yet another encoding
    format—FLAC. Free Lossless Audio Code (FLAC) is an encoding format that, unlike
    the MP3 and Ogg Vorbis formats, does not remove any audio information from the
    audio file during the encoding process. The downside is that FLAC provides space
    savings of only 30 to 50 percent, less than the 80 percent neighborhood achieved
    by MP3 or Ogg Vorbis. The upside, of course, is that the FLAC files should be
    equivalent to CDs in quality.


    Given that retention of audio quality, FLAC is an ideal choice if you are not
    satisfied with the audio quality provided by Ogg Vorbis or MP3 files. it is also
    a good choice if you want to create both Ogg Vorbis and MP3 files ... or if you
    just don''t know which one you want to work with. In such cases,'
  merge: -1
  img_proc: true
- pgno: 284
  md: 'can go ahead and encode it in FLAC format. As I mentioned earlier, once you
    get to Chapter 15, you will learn how you can convert the FLAC file later, when
    you know what you want or need.


    # Installing MP3 Support for Audio Apps


    All that talk about Ogg Vorbis and FLAC aside, many people still like or need
    to deal with MP3 files. You may, for example, already have numerous MP3 files
    ripped from your music collection, or you may enjoy listening to one of the many
    Internet radio stations that are broadcast in MP3 format. Unfortunately, MP3 playback
    and encoding support is not included in Ubuntu because of licensing concerns.
    If you are on planning to use the Ogg Vorbis format in your future ripping and
    encoding endeavors, MP3 support is a good idea so as to cover your audio bases.
    It''s also a very easy process. If you opted to install third-party software when
    you originally installed Ubuntu, you most likely have all the support you need.


    If you did not install third party software when you first installed Ubuntu, then
    the easiest way to install MP3 playback is to double-click an MP3 file that you
    have on hard disk. A window will appear, asking whether you want to search for
    the plug-ins to play the file. Click **Search**, after which another window will
    appear showing what you need to install (Figure 14-1). Check both boxes in that
    window, click the **Install** button, and in the confirmation window that appears,
    click **Confirm**. You will be asked for your password, so provide it and then
    wait until the process is complete. Once done, you will be able to play not only
    your MP3 audio files but also a variety of other audio and video formats.


    ![](img/d35fa962e6f9664d66dc83916f426418_284_0.png)


    Figure 14-1: Ubuntu helps you find the plug-ins you need.'
  merge: -1
  img_proc: true
