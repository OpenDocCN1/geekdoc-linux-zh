  md: '# 13B-2: Sending Images by Email via Shotwell


    Emailing images via Shotwell is just as easy as publishing images to Facebook—perhaps
    even easier. It''s certainly much easier than having to manually prep the photos
    as attachments. Assuming you have your Thunderbird set up for sending email just
    as you learned to do in Chapter 5, here is all you have to do:


