- pgno: 288
  md: '![](img/d35fa962e6f9664d66dc83916f426418_288_0.png)


    Figure 14-5: The Rhythmboxbox browser with expanded categories


    To create a playlist in Rhythmboxbox, select **Music > Playlist > New Playlist**.
    When the Playlist icon appears in the left pane of the Rhythmbox window, type
    a name for the list and press ENTER. Click the Music icon in the left pane to
    show the contents of your music library. Then add the songs you want by dragging
    them from the Library to the Playlist icon. The songs themselves will remain in
    the Library, so you aren''t moving anything—just creating aliases.


    You can also create *automatic playlists*, which are lists that automatically
    scan the Library for songs that match your criteria. For example, might choose
    to create a list for all the songs in your Library by a particular artist or of
    a specific genre. To do this, select **Music > Playlist > New Automatic Playlist**.
    A window will appear in which you can specify what the list is to contain. You
    can even specify how many songs you want in the list.


    Once you''ve created your lists, you can play one song by clicking it once and
    then clicking the **Play** button near the top of the window (or by double-clicking
    the list).


    # Ubuntu One Music Store via Rhythmbox


    Similar to the iTunes store, Rhythmbox provides you with access to the Ubuntu
    One Music Store, which provides music by major artists from the 7digital catalog.
    The songs sold are free from the digital rights management (DRM) limitations found
    in many songs purchased from other stores. The Ubuntu One Music Store is also
    cloud enabled, whatever you is delivered to your Ubuntu cloud, from where you
    can download your purchases to your other devices. (An Ubuntu account is required,
    but you can get one, with 5GB of free storage, for free.)'
  merge: -1
  img_proc: true
- pgno: 289
  md: '# Other Features in Rhythmmbox


    Rhythmmbox includes a couple more cool features worth noting. One of these is
    the ability to automatically download and display the lyrics of the song you are
    currently playing. To use this feature, you must first activate it by going to
    the Edit menu and selecting Plugins. In the Configure Plugins window that appears
    (Figure 14-6), check the Song Lyrics box and then click the Preferences button
    that appears. When the Song Lyrics preferences appears, check all the boxes and
    click the Close button. Then close the Plugins window. After that, to start playing
    a track, go to the View menu and select Song Lyrics. Rhythmmbox will search the
    Internet for the lyrics of the track you are currently playing and display them
    in a separate window (Figure 14-7).


    ![](img/d35fa962e6f9664d66dc83916f426418_289_0.png)


    Figure 14-6: Activating Rhythmmbox''s lyrics retrieval and display plug-in


    ![](img/d35fa962e6f9664d66dc83916f426418_289_1.png)


    Figure 14-7: Rhythmmbox displays the lyrics of the track currently playing.


    252 Chapter 14'
  merge: -1
  img_proc: true
- pgno: 290
  md: 'Another cool feature is Rhythmbox''s ability to display album art for the songs
    you have in your collection. The art is displayed in the bottom left corner of
    the window and in the notification that pops up momentarily in the top-right corner
    of your screen. Unfortunately, at the present time this works only with those
    songs in your collection that already have album information embedded, such as
    those you have purchased online. The ability to download and display album art
    for those tracks you ripped yourself is still broken and has been since the the
    switch to the Unity desktop environment. A solution is still been sought, so this
    functionality might well again after a future update.


    #  Project 14: Listening to Streaming Media with Rhythmbox


    In addition to allowing you to play audio CDs or the music you have stored on
    your hard disk, Rhythmbox also allows you to play internet radio streams in MP3
    or Ogg Vorbis format. To listen, click **Radio** in the left pane and then find
    a stream to play in the main pane. Once you''ve made your selection, you can start
    playing it by either double-clicking or selecting it and then clicking the play
    button at the top left of the window.


    # 14-1: Adding Radio Streams to Rhythmbox


    It is also possible to add streams to Rhythmbox. To get started, let''s try adding
    FIP, a French music station specializing in the eclectic. The process for adding
    FIP is essentially the same as adding any other stream. Here are the steps:


    +   - Click **Radio** in the left pane of the Rhythmbox window.

    - At the top of the main pane, click the **Add** button.

    - In the window that appears, type `http://www.tv-radio.com/station/fip_mp3/fip_mp3-128k.mp3`
    and click **Add**.

    - Double-click the new entry for your stream to play it.


    # 14-2: Changing a Stream''s Title and Information in Rhythmbox


    The only problem with what you''ve just done is that the title of the stream appears
    in the Rhythmbox window is the URL generated, and the genre appears as *unknown*.
    Needless to say, this isn''t all that handy a way to find things, especially once
    you have more than a couple of streams listed and have to go wading through them
    to figure out what is.

    Remedying this state of affairs is a simple process. Just right-click the stream
    and select **Properties**. In the window that appears, change the content of the
    Title and Genre boxes so that they are more meaningful to you. As you can see
    in Figure 14-8, I used *Radio France - FIP* for the title and *Eclectic* for the
    genre.


    ![](img/d35fa962e6f9664d66dc83916f426418_290_0.png)'
  merge: -1
  img_proc: true
- pgno: 291
  md: '# Creating Audio CDs


    All this talk about encoding and listening to MP3 and Ogg Vorbis files on your
    computer is fine and dandy, but no doubt sometimes you would like to have your
    songs on a plain audio CD that you can play while you slog your way to work on
    the New Jersey Turnpike or the Ventura Freeway. Luckily, this is easy to do, and
    there are a couple of ways to go about it.


    # Burning Audio CDs with Rhythmbox


    For Rhythmbox, the easiest way to go about things is to do it all within Rhythmbox.
    To do this, first create a playlist with the songs you want to burn to CD, click
    the icon for list in the left pane, and then click the Burn at the top of the
    main pane. Brasero, the disc-authoring application that we first discussed in
    Chapter 7, will now take over, opening a window that shows the files to be burned
    (Figure 14-9). Place a blank disc in your drive and click the Burn button. In
    the Properties window that appears, just click the Burn button, and the process
    will begin. You can follow how the burn is progressing in the small window that
    appears. When the process is done, the progress window will vanish, and your new
    audio CD should pop out of your drive.


    ![](img/d35fa962e6f9664d66dc83916f426418_291_0.png)


    | | Title | Artist | Length |

    |---|---|---||}{

    | 01 | Laughing with a Mouth of Blood | St. Vincent | 03:01 min |

    | 02 | ThoughtForms | Lush | 02:45 min |

    | 03 | Color Pink | Cassis Dreams | 02:03 min |

    | 04 | Cutanje.mp3 | Autopark | 04 min |

    | 05 | Torok | Irfan Tahiroiro Trio | 03:09 min |


    Figure 14-9: Burning an audio CD with Rhythmbox and Brasero


    # Burning Audio CDs Directly with Brasero


    You can also create a "play-anywhere" audio CD from your ripped MP3 and Ogg Vorbis
    files directly from Brasero, bypassing Rhythmbox. To do this, run Brasero from
    the Dash and place a blank CD in your drive (and close any window that pops up
    asking to handle it). When Brasero appears, click Audio project. Now add any mix
    of songs (in any mix of audio'
  merge: -1
  img_proc: true
- pgno: 292
  md: 'formats) to the blank area of the window. You can do this by clicking the add
    button (which looks like a green plus sign) and navigating to the songs you want
    to add. You can also just drag files from any file manager window to the Brasero
    window.


    As you add to the Brasero window, a bar at the bottom of the window (Figure 14-9)
    will show you how much space is available on the disc. Keep an eye on that so
    as to queue up more than your disc can hold. When you are ready, the process as
    described in the previous section: Click the Burn button and then click Burn in
    the setup window that appears after. A progress window will appear, and once the
    burn is complete, Brasero will let you know and eject your disc. You can then
    play the disc in your car stereo or wherever you want to play it and enjoy the
    results.


    # Other Cool Audio Apps


    The applications I have covered so far are only a taste of Ubuntu in store for
    you. You can see what else is available by browsing the offerings listed in the
    Ubuntu Software Center. Try and keep them if you like or remove them if you don''t.
    After all, it doesn''t cost you anything.


    To give you a starting point, I''ll mention a few applications that I might be
    worth investigating.


    # Alternative Players


    If the music players that I''ve covered in this chapter have whetted your appetite
    for more, you are in luck—there are plenty of others, as browse through Ubuntu
    Software Center''s Sound & Video category will reveal. Check out Exaile, Banshee,
    Audacious, and Listen to get started. Oh, and as you''ll find out in Chapter 16,
    if you haven''t discovered it already, Movie Player, which comes with your system,
    also doubles as an audio player. Wow.


    # Streaming Music with Streamunter2


    If you are an Internet radio junkie, probably no application is handier than Streamuner2
    (Figure 14-10), as its name implies, an online stream tuner. It works by downloading
    available streams from a variety of sources, which you can easily browse. When
    you find something you like, just double-click the stream (or select the stream
    and then click the green play button at the top left of the window), and the stream
    will open in the player of your choice.


    The default player for most streams is Audacious, but that app does not (though
    it is available for download from the Ubuntu Software Center), so you''ll have
    to pick an alternative. You can make this choice the first time you run Streamunter2,
    since the first window you see is the settings window. In that window, change
    the default entries from Audacious to whatever audio player you prefer. The name
    of the player is usually represented by the name of the application in all lowercase
    letters.'
  merge: -1
  img_proc: true
