    # Chatting on IRC


    Internet Relay Chat (IRC) is where Ubuntu users can go to talk to one another
    online. Chats happen in real time, and using IRC is very similar to using an instant
    messaging service. Chatting is a particularly good option if you want to talk
    to someone as soon as possible about a question without waiting for a reply on
    the forums.

    IRC can be daunting at first, so let''s walk through a typical session. First,
    you''ll need to make sure you have the right chat software. Open the Ubuntu Software
    Center, search for XChat IRC (not to be mistaken for XChat-GOME), and install
