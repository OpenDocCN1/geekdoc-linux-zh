    ![](img/d35fa962e6f9664d66dc83916f426418_245_0.png)


    Figure 11-11: Adding Asian character input methods in IBus


    # 11-3: Typing Asian Languages with IBus


    Once you have chosen your input methods and closed the IBus Preferences, a window
    that looks like a mini keyboard will appear to the left of the mail notification
    icon on the panel. If you have enabled multiple keyboard layouts in the previous
    section of this chapter, the keyboard will appear to the left of the identical
    keyboard selector icon. When you click new IBus, a menu showing all the available
    input methods will appear (as shown in Figure 11-12). To be able to actually select
    a method, however, you will need to be using an application that accepts text
    input, such as Text Editor, LibreOffice, or even a web browser search box. To
    try things out, open LibreOffice Writer.'
  merge: -1
  img_proc: true
- pgno: 246
  md: '![](img/d35fa962e6f9664d66dc83916f426418_246_0.png)


    ##11-12: Selecting language input methods from the IBus panel applet


    Once Writer appears, click in the document area and then select the input method
    you want to use from the IBus panel menu. You can now start typing in Writer using
    the input method you selected. If you do not see the characters you intended to
    type but instead see nonsense characters (boxes or seemingly random symbols),
    try using another font.

    To switch from one input method to another, there are two options. First, you
    can go to IBus panel applet and change methods from the menu options. Second,
    you can switch between methods with hot combinations: CTRL-spacebar toggles IBus
    on and off, and ALT-SHIFT-L switches you to one input method to the next.


    # # Setting IBus to Automatically Start When You Log In


    As you probably recall when you first opened the IBus Preferences, how to start
    up IBus each time you log in to your system. If you use IBus a lot and would prefer
    foregoing this extra step, you can easily set up your system to start it automatically
    when you log in.


    To do this, open the Language Support window by going to Dash, typing language
    support, and pressing ENTER. In the Language tab of, select IBus in the drop-down
    menu next to the words Keyboard input method system, as shown in Figure 11-3,
    close the window. The next time you log in, IBus will automatically start up and
    be ready for action when you need to use it.


    If IBus does not start automatically the next time you log in, adding it to your
    system''s list of startup applications. To do this, go to Dash, type startup applications,
    and press ENTER. This will open the Applications Preferences window. In this window,
    click the Add button. In the Name of the window that appears, type IBus, and in
    the Command box, type /usr/bin/ibus-daemon -d. When done, click Add and then close
    the Startup Applications Preferences window.'
  merge: -1
  img_proc: true
- pgno: 247
  md: '![](img/d35fa962e6f9664d66dc83916f426418_247_0.png)


    Figure 11-13: Setting up your system so that IBus automatically starts at login


    # # Viewing Your System in Another Language


    One of the many things that originally attracted me to the Linux world was being
    able to install language support for languages other than English and come up
    with a new system in a different language. I had to use one new machine for Chinese,
    Japanese, Swedish, and my default, English, installed. After just a few clicks
    and simply logging out, I could log back in with an interface in a totally different
    language. I could have a Chinese, Japanese, or Swedish system whenever I wanted
    (or whenever a student visited my office needed).


    This is very useful if you''re in an environment where not everyone shares the
    same native language. At my university, for example, where Japanese and Chinese
    students sometimes used my computer, the additional language support allowed them
    to log in using their own language. It''s pretty handy if you are studying a foreign
    language and want to give yourself as much exposure as possible to. In all in,
    it is a very useful feature.


    Taking advantage of this feature in Ubuntu is very easy. Basically all you have
    to do is install a group of support files for each language you want to add to
    your system. You can do this by running Language Support from the Dash and then
    clicking the Install/Remove Languages button in that window. When the Installed
    Languages window appear, you choose from the various languages available by checking
    the appropriate boxes. (Figure 11-14).


