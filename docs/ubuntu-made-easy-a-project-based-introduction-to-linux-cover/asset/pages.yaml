- pgno: 358
  md: '# 19


    # PENGUINS AT THE GATES


    Working with Ubuntu in a Windows World


    ![](img/d35fa962e6f9664d66dc83916f426418_358_0.png)


    Despite the rapidly growing popularity of Linux, it’s still very much a Windows
    world. If you’re anything like me, you’ll often find yourself working with people
    who use Windows, so it’s important to know how to make Ubuntu happily coexist
    with Microsoft’s ubiquitous OS. Fortunately, Linux is just about the most accommodating
    operating system available and has no problems sharing files, reading Windows
    disks, and so forth. In fact, your Ubuntu programs probably support a wider range
    of file formats than their Windows equivalents; on more than one occasion I’ve
    tried to open a file in Windows, failed, and then booted into Ubuntu where I could
    open it effortlessly.'
  merge: -1
  img_proc: true
- pgno: 359
  md: 'Of course, sharing files with others may not be your only Windows-related worry,
    especially if you''re a dual-booter. Plenty of people decide to run both Windows
    and Linux on their computer, so it pays to know how you can minimize the bureaucracy
    involved in switching between the two. If you keep Windows for the sole purpose
    of running a specific application and you can''t find a Linux-compatible equivalent
    to it, perhaps you can save the effort of dual-booting altogether and simply install
    the program directly onto Ubuntu. I told Windows was accommodating... it''ll even
    adopt Windows programs as its own!


    Over the course of this chapter, you''ll learn how to make the most of your double
    operating system: You''ll install some Windows fonts, some Windows programs, and
    share files on a Windows network. And if that isn''t quite enough for you, you''ll
    even see how to run Windows (in a window!) in Ubuntu. You might want to sit in
    a dark room for one—if you''re not tired of "windows" you will be by the end of
    the chapter!


    # # Project 19A: Accessing Files on Your Windows Partition (for Dual-Booters)


    If you decided to dual-boot when you installed Ubuntu, you''ll have a partition
    somewhere on your hard disk filled with your Windows files and programs (see Chapter
    2 if you need a refresher for your partitions work). You can access files by mounting
    the partition from Ubuntu. When you mount a partition, the files are available
    to you through Nautilus (and other programs)—mounting is just Linux''s way of
    recognizing a partition and preparing it for use.


    # ## 19A-1: Mounting Your Windows Partition


    Mounting your Windows partition in Linux used to be a bit of a chore but that
    isn''t the case anymore (at least not in Ubuntu). In fact, all you have to do
    is open a Nautilus window and click the Windows partition in the sidebar.


    You might find more than one hard disk icon in the sidebar, so it is possible
    that you won''t be sure which one your Windows partition actually is. Remember
    that your Linux partition is represented by the hard disk icon named *File System*,
    which is listed under the Computer section in the Nautilus sidebar. Things aren''t
    so simple for the Windows partition, unfortunately listed under Devices, rather
    than Computer, but it could be labeled OS (as shown in the sidebar or with the
    size of the partition followed by the word *Media* (for example, if your Windows
    partition is 80GB in size, it might appear as *80GB Media* in the sidebar). Or,
    it might be something else entirely. Guess which one it is, if necessary—it won''t
    hurt if you get it wrong.'
  merge: -1
  img_proc: true
- pgno: 360
  md: '![](img/d35fa962e6f9664d66dc83916f426418_360_0.png)


    Now that you know which disk icon is which, it''s time to get it mounted! Just
    click the icon for the Windows partition in the Nautilus sidebar. Authenticate
    window may appear; if it does, type your Ubuntu password and click the **Authenticate**
    button. A new window showing the contents of your Windows partition will appear.


    If you hibernated rather than quit Windows, you will most likely receive a "Cannot
    mount volume. You are not privileged to mount this volume." *Error message when
    trying to mount your Windows partition. Some hibernated Windows partitions cannot
    be safely mounted for reading and writing in Linux, adding new files while Windows
    is hibernated could seriously confuse it when it starts up again. To get full
    access to the drive, be sure to shut Windows rather than hibernating.


    # 19A-2: Unmounting Your Windows Partition


    You can unmount your partition immediately after finishing your work with it,
    or you can just wait until you down your system, whereupon it will automatically
    unmounted. Before you unmount it, you must make sure that none of your programs
    are accessing files or folders on the partition. Nautilus and the Terminal are
    the usual suspects, before unmounting, close any Nautilus or Terminal windows
    that are browsing that partition. Once you''ve done that, click the little eject
    icon next to the Windows partition in the sidebar of a Nautilus window (Figure
    19-2) or right-click the eject icon and select **Unmount**.'
  merge: -1
  img_proc: true
- pgno: 361
  md: '![](img/d35fa962e6f9664d66dc83916f426418_361_0.png)


    Figure 19-2: The Windows partition "OS" in the Nautilus side pane, complete with
    eject icon


    # # Accessing a Linux Partition While Running Windows


    Viewing your Windows files in Ubuntu is isnt too stressful, as you have found
    out. But what about going the other way and getting Windows to recognize your
    Linux partition? Unfortunately, Windows isn''t too helpful in this respect—it
    can view only FAT or NTFS partitions and has no built-in support for the ext format
    normally used by Linux. As such, if you need to access your Linux files in Windows,
    it is easiest to create a separate partition to be shared by both operating systems
    (see Appendix C). Hmm, not exactly convenient.


    An alternative is to add support for Linux partitions into Windows by installing
    some extra software. Unfortunately, the state of such software is pretty dire:
    Support for the old-fashioned ext2 format is pretty good, Ubuntu uses ext4 nowadays,
    which is a different beast entirely. As far as I can tell, the best that people
    who have managed to do is to get an ext4 partition mounted in Windows in read-only
    mode. Although you won''t be able to add new files to the partition, at least
    you''ll be able to see what''s there and copy them into Windows. To try this for
    yourself, download Linux Reader from http://www.diskinternals.com/linux-reader/.
    It seems usable and has the distinct advantage of being free!'
  merge: -1
  img_proc: true
- pgno: 362
  md: '# Project 19B: Installing Microsoft Windows Core Fonts


    Like it or not, the computing world is still pretty much a Microsoft world, and
    that means the vast majority of users, even Mac users, are using Microsoft fonts.
    Thus, you will inevitably have to deal with documents using fonts as Georgia,
    Verdana, Times New Roman, and Courier, to name a few. Of course, your system can
    substitute the fonts it has used in the document. But for you to see things precisely
    as they were intended and to allow others to see the documents you intended, it
    will beho you to install those Microsoft Core fonts on your own system.


    Fortunately, there are two ways to get these fonts. One is to download and install
    them via the Ubuntu Software Center, while for the other with a dual-boot setup,
    it is simply to copy them from your Windows partition. In the former case all
    you need to install is the Microsoft Fonts package using the Ubuntu Software Center.
    To do this, search for mfonts in the Software Center and install the Installer
    for Microsoft TrueType fonts package (it should be the only result). Note that
    this is the older set of fonts from Windows XP, so installing this package won''t
    get you any of the swishy new fonts with later Windows versions. Once the installation
    process is complete, your new Microsoft fonts will have successfully installed
    and made ready for immediate use by every user account on your machine.


    If you''re a dual-booter, you can copy the fonts directly from your Windows partition.
    This has the advantage of getting all your Windows fonts into Ubuntu, even the
    newer ones (if you have Vista, Windows 7, or Windows 8 installed). Here''s what
    you need to do:


    +   1. Mount your Windows partition, as described in "Project 19A: Accessing Files
    on Your Windows Partition (for Dual-Booters)" on page 322.

    2. Open the Windows partition in Nautilus and browse to the Windows/Fonts folder.

    3. Now for a little trick: Select Edit > Select Items Matching, type *.ttf in
    the box that appears, and click OK (Figure 19-3). This will select all the files
    in the 3. Now for a little trick: Select Edit > Select Items Matching, type *.ttf
    in the box that appears, and click OK (Figure 19-3). This will select all the
    files in the folder with names ending in .ttf, which are all TrueType font files.


    ![](img/d35fa962e6f9664d66dc83916f426418_362_0.png)


    Figure 19-3: Selecting all the TrueType fonts in the Windows/Fonts folder'
  merge: -1
  img_proc: true
- pgno: 363
  md: '+   4. Copy the files to a convient location (somewhere in your Home folder
    should do it).


    +   5. Now, go back to the Windows/Fonts folder and select Edit ► Select Items
    Matching again. This time, however, type *.TTF in the box (note the capital letters).
    This will select the rest of the font files—the item selection feature is case
    sensitive, and the filenames use different cases for reason. Copy the selected
    files as you did previously.


    +   6. With all the font files copied into Ubuntu, you can now install them as
    you would any other font. At its simplest, this involves copying the files into
    the hidden fonts folder in your Home folder, but you should see “Project: 10:
    Installing TrueType Fonts” on page 190 for the full details.


    # Dual-Booting: Changing the Boot Order and Timeout


    If you chose to install Ubuntu alongside Windows in a dual-boot setup, you''ll
    be used to seeing the GRUB boot menu screen by is the screen that appears every
    time you start up your computer and gives you the option of running either Windows
    or Ubuntu.


    ![](img/d35fa962e6f9664d66dc83916f426418_363_0.png)


    Figure 19-4: The GRUB boot menu screen


    Ubuntu is started automatically if you don''t select a different option after
    a few seconds. This is fine for people who want to use Ubuntu for almost-thing
    but to dip into Windows from time to time. If you spend more time in Windows,
    you might prefer to use that as the default operating system. To make the change,
    you''ll first need to install a neat app that goes by the name of Grub Customizer.
    Alas, it''s not yet available from the regular Ubuntu software repositories, but
    you can get it from a PPA without much fuss. As you might recall from Chapter
    6, PPAs are a way for third-party'
  merge: -1
  img_proc: true
- pgno: 364
  md: "application developers to make their software available to the wider Ubuntu-\n\
    using world. The ins and outs of finding and enabling PPAs were covered in\n\"\
    Project 6B: Installing Software from a PPA—Turtle Arena\" on page 90, but\nhere's\
    \ a quick reminder of what to save you a bit of page flipping:\n\n+   1. Open\
    \ the Software Center, click **Edit > Software Sources** and click\nthe **Other**\
    \ Software tab in the Software Sources window that pops up.\n\n+   2. Click **Add**\
    \ and type `ppa:danielrichter2007/grub-customizer` into the box\nprovided. This\
    \ is the name of the PPA for Grub Customizer.\n\n+   3. Click **Add Source** and,\
    \ if prompted, enter your password. The PPA will\nbe added to the Other Software\
    \ list.\n\n+   4. Close the Software Center and wait a little while; the PPA will\
    \ be enabled\nin the background. (Annoyingly, it won't tell you until it's finished—see\n\
    Chapter 6 for more on this).\n\nOnce the PPA has successfully been added to your\
    \ system, open up the\nSoftware Center and search for Grub Customizer. Install\
    \ it (as you would any\nother application) and then head over to the Dash and\
    \ open it. You'll\nprobably be asked to enter your password, so do that and then\
    \ wait a little\nwhile it loads. Once that has finished, follow these instructions\
    \ to set Win-\ndas as the default operating system:\n\n+   1. In the Grub Customizer\
    \ window, click **Preferences** and then go to the\n**General** tab in the settings\
    \ window that pops up (Figure 19-5).\n\n| Grub Customizer - settings |\n| General\
    \ | Appearance | Advanced |\n| default entry |\n| [x] predefined: Entry 1 (by\
    \ position) |\n| [ ] previously booted entry |\n| visibility |\n| [ ] show menu\
    \ |\n| [ ] look for other operating systems |\n| Timeout [1] Seconds |\n| kernel\
    \ parameters |\n| quiet splash |\n| [x] generate recovery entries |\nClose \n\n\
    Figure 19-5: Changing boot options with Grub\nCustomizer\n\n+   2. Select Windows\
    \ from the **predefined** drop-down list under the *default entry*\nheading. The\
    \ actual name of the Windows option will differ depending on\nwhich version you\
    \ have installed—mine says Windows 7 *(loader)*, for example."
  merge: -1
