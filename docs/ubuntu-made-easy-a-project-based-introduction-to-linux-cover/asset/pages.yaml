    they''re out there. Some are available as DEB files and can be installed in the
    same way you installed Google Earth in Chapter 6. A good flower example is SDL
    Hana (Figure 17-18), a Linux version of the Japanese card game Hanaf, which is
    available from http://sdhana.nongnu.org.


