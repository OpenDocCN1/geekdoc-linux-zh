- pgno: 250
  md: '# 12


    # PENGUINS AT WORK


    Getting Down to Business in Linux


    ![](img/d35fa962e6f9664d66dc83916f426418_250_0.png)


    Although computers are used for such diverse (and fun!) activities as programming,
    making music, creating art, and playing games, at some point or almost every one
    of us has to sit down in front of our machine and get some work done. That being
    the case, many users want to know what office-related applications are available
    for their system.


    Fortunately, Linux can get down to business as well as the next OS. More importantly,
    there are so many applications freely available for you to try, you might find
    that you actually end up using far more office-related productivity apps than
    you would had to pay for everything up front. In this chapter, I''ll walk you
    through the offerings that come bundled with Ubuntu and then point you to yet
    others you might want to consider adding to your collection.'
  merge: -1
  img_proc: true
- pgno: 251
  md: '# Where the Apps Are


    The majority of apps in this chapter can be run from the Dash by clicking the
    Applications lens and then clicking the Office filter button. Exceptions are noted
    in the relevant sections. As with all applications, you can also run an app by
    typing its name in the Dash''s search box and pressing ENTER.


    # LibreOffice


    When it comes to work, most people turn to office suites, which contain the apps
    they use most often—a word processor, spreadsheet, and presentation editor. The
    de facto standard among office suites is Microsoft Office, which is available
    in both the Windows and Macintosh worlds. Of course, because it is a Microsoft
    product, you can be relatively sure that no Linux version is (or ever be) available.


    Fortunately, Linux has an exceedingly capable office suite, and it comes bundled
    with Ubuntu. The suite is called LibreOffice, and it is open source community-supported
    descendant of OpenOffice, the office suite originally bundled with most Linux
    distros until it was taken and later jettisoned by Oracle (a bit of recent history
    there in case you wondered). LibreOffice is not some lightweight sour-grapes substitute
    for the Microsoft Office-less world; it is a full-featured contender. LibreOffice,
    incidentally, is also freely available (as in free) in Windows and Mac OS X versions.


    # LibreOffice Applications


    The entire LibreOffice office suite consists of a number of applications, all
    but one come bundled with Ubuntu. These include a word processor (Writer), a spreadsheet
    (Calc), a presentation creator (Impress), and a very handy vector-drawing program
    (Draw). You can find all of these by going to the Dash, clicking the Applications
    lens, and then clicking the Office filter button. A database module (Base) is
    also available for LibreOffice as a download via Ubuntu Software Center (just
    search for base).


    Since giving full detailed instructions on how to use each of these applications
    would take an entire book (and there are entire books on the subject), I will
    simply introduce each module to you. There is help, should you need it, in the
    LibreOffice Help system (Help -> LibreOffice Help) online at http://libreoffice.org/get-help/documentation/.
    There are numerous video tutorials available on YouTube.


    # Writer


    As mentioned earlier, the word processor is the application that the majority
    of users turn to most often. Fortunately, LibreOffice is a good one (see Figure
    12-1). It is check-full of features and can read and save Microsoft Word files.
    Like Word, it will even let you save your documents as HTML files so that you
    can easily change your documents into web pages. In terms of usage,'
  merge: -1
  img_proc: true
- pgno: 252
  md: 'Writer is a very straightforward word processor, so I won''t go into any more
    detail here. Again, check out LibreOffice Help or the online documentation mentioned
    in the previous section if you require more information.


    ![](img/d35fa962e6f9664d66dc83916f426418_252_0.png)


    # Figure 12-1: LibreOffice Writer


    # Calc


    Calc is the LibreOffice spreadsheet application, and it is similar to Excel in
    terms of capabilities and general layout (see Figure 12-2). It can also, quite
    importantly, read and save Microsoft Excel files.


    ![](img/d35fa962e6f9664d66dc83916f426418_252_1.png)


    # Figure 12-2: A graph created in LibreOffice Calc


    Penguins at Work 215'
  merge: -1
  img_proc: true
- pgno: 253
  md: 'Since most people who use spreadsheets generally understand what they are all
    about, and after a bit of poking around, can figure out how to use them, However
    because many others don''t see any need to even try spreadsheets, I will mention
    a few of the simpler tasks that can be done with Calc in the hope of enticing
    some of you into trying it.


    Many people who don''t use spreadsheets think of them as calculators used for
    uncomfortable large sets of numbers, such as payrolls. That view is not incorrect,
    of course, since that was the original purpose of such applications, but spreadsheets
    can be used for everyday tasks too. Projecting budgets, calculating grade averages
    (by teachers or students), figuring how long it will take you to save up for your
    trip to choose among... these are all tasks that spreadsheets are made for. What
    even nicer is that when doing any of these minor mathematical tasks, you can easily
    create graphs to make abstract numbers show themselves to you.


    If numbers are not your thing, you can use Calc for creating lists of information,
    such as birthday lists, class rosters, shopping lists, and address lists. You
    can even have Calc put the lists into alphabetical order, sort them by date of
    birth, and so on. Everyone finds finds use for Calc, so don''t ignore it entirely.


    # Impress


    Impress (Figure 12-3) LibreOffice’s answer to Microsoft’s PowerPoint, with which
    it is compatible. It allows you to create creative slides for use in presentations
    and allows you to create notes or handouts to accompany the slides. Although these
    features make Imp quite handy in business and education settings, you may not
    find as much value in it as a human user.


    ![](img/d35fa962e6f9664d66dc83916f426418_253_0.png)


    Figure 12-3: LibreOffice Impress


    216 Chapter 2'
  merge: -1
  img_proc: true
- pgno: 254
  md: '# Draw


    More useful to the home user is LibreOffice Draw, which just happens to be my
    favorite, and to Writer, most frequently utilized LibreOffice module. Although
    Draw isn''t great for creating true graphics in the artistic sense, it is very
    useful for creating flowcharts; organizational diagrams (such as seating arrangements
    for wedding receptions or conferences); any other document in which you want a
    bit more control over the placement of text and graphics (especially when they
    are combined), as flyers, awards, diagrams, and newsletters. In this sense, Draw
    can be used quite effectively as a simple page layout program, as you can see
    in Figure 12-4.


    ![](img/d35fa962e6f9664d66dc83916f426418_254_0.png)


    Figure 12-4: A newsletter (created and displayed) in LibreOffice Draw


    # Microsoft Office and LibreOffice File Compatibility


    Although I mention the point throughout this section, it is worthy to reemphasize
    that LibreOffice can read and write Microsoft Office files. This compatibility
    is good, though tables sometimes prove slightly problematic.


    To read Microsoft Office files, all you need to do is double-click the file in
    question, and it will open in the appropriate LibreOffice module. When saving
    files within LibreOffice for earlier versions of Microsoft Office, you must save
    them into the appropriate format. Otherwise, LibreOffice will by default save
    files into its native format (.odt for Calc documents, and .odp for Impress documents),
    and only the most recent versions of Microsoft Office can deal with these files.


    To save a file in the format you will, click the File type next to the bottom
    left of the Save window and select the appropriate Microsoft Office format from
    the list of available file formats that appears below—choose Microsoft Word 97/2000/XP/2003
    for a Writer document, for example.'
  merge: -1
  img_proc: true
- pgno: 255
  md: '# LibreOffice Features


    The three main applications in LibreOffice (Writer, Calc, and Impress) are quite
    similar to their pre–Office 2007 equivalents in Microsoft Office (Word, Excel,
    and PowerPoint), so switching to the LibreOffice applications should be relatively
    easy if you grew up with those versions of Microsoft Office.


    If you don''t have any experience with Microsoft Office, you should still find
    using LibreOffice applications straightforward the basic layout is pretty intuitive.
    And if you are lacking in the intuition department, the built-in Help files are
    pretty good, too. To help you along, the Tips system works just like tools in
    the Windows and Mac worlds. (In case you aren''t sure what I''m talking about,
    tools are those little boxes that pop up to tell you what a button or menu item
    does when you place your mouse over that button or menu item.) Another cool and
    useful help feature is What''s This, which works like the Tips but provide more
    detailed explanations of what a particular button does. If you select Help > What''s
    This, your cursor will turn into a little question mark. Move that question cursor
    over any item in the LibreOffice interface, and you will find out what it does
    rather than what it is called.


    Despite the straightforwardness I am speaking of, a few interface items will most
    likely be unfamiliar to you, so I will briefly describe them. I will be using
    the word processor, Writer, as I describe these things, so you can run Writer
    while following to make things easier.


    # Getting to the Buttons


    Although you should be able to figure out most of the buttons on the LibreOffice
    toolbars do, a few buttons, common to all LibreOffice modules, deserve a bit more
    explanation.


    # Export to PDF


    The Export to PDF button is situated to the left of the two printer buttons (Print
    and Print Preview). You can use this button to export, save, your document as
    a PDF file.


    # Hyperlink


    Clicking the Hyperlink button, the button to the left of the Table button, opens
    the Hyperlink window, from which you can access links to documents—not only to
    web pages but also to documents on an individual computer and even within that
    document. Although a hyperlink on a web page is something we have all come to
    take for granted, the idea of hyperlinking between text documents sounds a little
    radical. It has, in fact, been around before you or I even heard of the Internet.


    # Navigator


    The fourth to the last button in the top row (the one that looks like a starburst)
    is the Navigator button. Clicking this button (or just pressing the F5 key) opens
    the Navigator window (see Figure 12-5), a pretty cool'
  merge: -1
  img_proc: true
- pgno: 256
  md: 'feature that comes in handy when you are working with lengthy or otherwise
    complex documents.


    The Navigator allows you to bounce back and forth easily between pages in a document
    or between elements therein, such as sections, links, and so on. Let say you have
    a document with lots of illustrations (like this chapter), and you want to jump
    directly from graphic to graphic. In this case you would double-click the word
    Graphics in the main pane of the Navigator and then click the buttons (the odd
    buttons to the left of the page number selector) to begin jumping.


    If you are dealing with a document containing various headings, such as all of
    the chapters in this book, you can also use Navigator to switch among those levels.
    Say you''ve decided to add a new heading at the last minute to a document you''ve
    writing. You then need to drop all of the headings you had before a notch, with
    the former main heading becoming a subheading and so on. When double-click the
    word Headings, the text of all the headings you have listed in the document appears.
    You can then select a heading in list and click the Demote button (that one at
    the far right of the second row of buttons) to move it down a level.


    # Gallery


    To the right of the Navigator button is the Gallery button. By clicking this button,
    you cause the Gallery, a library of graphical elements for use in your documents
    or web pages, to appear in a separate pane at the top of your document window
    (see Figure 126). The elements within the Gallery range from various types of
    lines to buttons to colored three-dimensional doughnuts, and you can add items
    of your yours.


    ![](img/d35fa962e6f9664d66dc83916f426418_256_0.png)


    Figure 12-5: The Navigator window


    ![](img/d35fa962e6f9664d66dc83916f426418_256_1.png)


    Figure 12-6: The Gallery


    Inserting a graphic into your document is a simple enough task when not using
    the Gallery. Just select Insert > Picture > From File and locate the image file
    you want to insert. It can be handier to use the Gallery,'
  merge: -1
  img_proc: true
- pgno: 257
  md: 'however, when you intend to use certain graphics frequently. Once in the Gallery,
    your graphics are always only a click or two away and can conveniently viewed
    in the Gallery browser window.


    The collection of artwork that comes with LibreOffice is mostly geared toward
    web pages, but other art clip is available elsewhere. For example, you can find
    a great collection online at http://www.openclip.org/. Everything is in the public
    domain, so it is all free to use. Be sure to check out the "Game baddies" collection—it''s
    one of my favorites.


    Adding these (or other graphic) files to the Gallery is relatively easy. First
    create a new theme (called a *theme*) for each group of images you want to add.
    To create a Gallery theme of your own, click the **New Theme** button in the Gallery
    window. This will open the Properties of New Theme window, where you should give
    your theme name. Once you have done that, click the **Files** tab and then the
    **Find Files** button. From there, you can navigate to the folder where you are
    storing your clip art, photos, or other graphics. Once you have found the folder,
    click the **OK** button, after which a list of all the files in that folder will
    appear in the Properties of New Theme.


    From this, you can easily add images to your new Gallery theme by clicking the
    name of each image you want to add and then clicking the **Add** button. You might
    want to make sure the box next to the word Preview is checked to make things a
    bit easier. Once you have done that, a copy of the image will immediately appear
    in the Gallery browser in your theme, where it will remain for future use (Figure
    12-7). When you are adding images to your new theme, revealing your new theme
    and its contents. To use one of the images in the Gallery, choose **Insert**,
    and then select **Copy** or **Link** to insert it into the pop-up menu.


    ![](img/d35fa962e6f9664d66dc83916f426418_257_0.png)


    Figure 12-7: Viewing clip art and your own collections in the Gallery


    Chapter 12'
  merge: -1
  img_proc: true
- pgno: 258
  md: '# Styles and Formatting


    The final stop on our tour through LibreOffice’s unfamiliar buttons is the Styles
    and Formatting button, which is located at the far left side of the second row
    of buttons. This button acts as a toggle for the Styles and Formatting window
    (Figure 12-8), from which you can select and apply styles to any of the various
    elements within your document. Oh, and if you just can''t take the need to fiddle
    with the mouse, you can also open the window by pressing the F11 key.


    ![](img/d35fa962e6f9664d66dc83916f426418_258_0.png)


    Figure 12-8: The Styles and Formatting window


    To give you an example of how convenient styles can be, imagine that you are typing
    a bibliography for a report you''ve prepared. You typed each entry without any
    paragraph, as in the following:


    > Smythe, W. (2004). Reconsidering the need for speech between non-human interlocutors
    beyond the age of seven. The Journal of the Society of Elves, Faeries, and Garden
    Gnomes, 20(2), 125–147.


    As most paragraphs you type, the entry is formatted with a first-line indent,
    which is fine and dandy—except that you need a hanging indent, rather than messing
    with tabs or margins to get the way you want, all you have to do is click your
    mouse anywhere within the paragraph and then double-click the **Hanging indent**
    entry in the Styles and Formatting window. After that, if as by magic (though
    you know better), the transformation is made:


    > Smythe, W. (2004). Reconsidering the need for speech between non-human interlocutors
    beyond the age of seven. The Journal of the Society of Elves, Faeries, and Garden
    Gnomes, 20(2), 125–147.'
  merge: -1
  img_proc: true
- pgno: 259
  md: 'You could follow the same procedure for each of your other entries, with Hanging
    indent selected, click the paint can button in the Styles and Formatting window.
    Now your cursor, when placed over the document, will appear as a paint can. Click
    in any other paragraph in your bibliography, and that entry, too, will be formatted
    in the new style. The process is essentially the same when applying different
    styles to any other document elements.


    # Word Processing Done Lightly with AbiWord


    If LibreOffice’s Writer is a bit more powerful than what you need for your everyday
    word processing chores and you would prefer selecting that pops up as soon as
    you click the Launcher icon, then you might want to consider another word processor,
    AbiWord (Figure 12-9). If you’re curious, install it from the Ubuntu Software
    Center.


    ![](img/d35fa962e6f9664d66dc83916f426418_259_0.png)


    Figure 12.9: The other Linux processor—AbiWord


    AbiWord has a straightforward and easy-to-use interface, which you should be able
    to figure out without much, if any, help. It also has a couple of interesting
    features, such as its autoresize function, which magnifies the onscreen document
    size (fonts, images, and everything) or shrinks it as you increase or decrease
    the size of the program. And if you are wondering, AbiWord can save and read Microsoft
    Word .doc files and save documents as PDF files.


    # FocusWriter


    While discussing alternative word processing applications, it’s worth mentioning
    an unusual new entry available from the Ubuntu Software Center called FocusWriter.
    FocusWriter developers refer to it as a distraction-free'
  merge: -1
  img_proc: true
- pgno: 260
  md: 'writing environment, and you''ll see exactly what they mean when you run it
    for the first time. To spoil the suspense for you, what you will see is nothing
    but a gray screen. No menu bars, no buttons, no menus . . . nothing. It is designed
    to give you the feeling of typing on a blank sheet of paper.


    True, the idea seems a bit gimmicky, but the environment provide a different atmosphere
    that might well be what you want or need when doing something creative. With the
    selection of a nice font or the addition of a pleasing background image (Figure
    12-10), the imaginative side of you might be drawn out of hiding. FocusWriter
    could be your digital muse.


    ![](img/d35fa962e6f9664d66dc83916f426418_260_0.png)


    Figure 12-10: Distraction-free word processing with FocusWriter


    # Some Other Cool Productivity Apps


    In addition to the more traditional office applications already discussed, a number
    of other applications are available from the Ubuntu Software Center that can be
    grouped together under the “productivity” label. I will introduce a few of those
    to you.


    # Dlume


    Let''s start off with perhaps the simplest of the applications in this arena,
    Dlume (Figure 12-11). Dlume is a simple standalone address book application that
    feels light and easy to use. It allows you to easily search for names in your
    address book and to export all information in CSV or HTML formats. You can run
    Dlume from the Dash by clicking the Applications lens and then clicking the Accessories
    filter button, or just type the name in the search box and press ENTER.'
  merge: -1
  img_proc: true
- pgno: 261
  md: '![](img/d35fa962e6f9664d66dc83916f426418_261_0.png)


    # gLabels


    One of my favorite office-esque apps is gLabels (Figure 12-12), which I''ve used
    from my very earliest days as a Linux user. As the name suggests, gLabels is an
    application for laying out and printing various types of labels; although the
    name does not suggest it, gLabels is also great for business cards. It includes
    templates for most, if not all, of the label and card stock out there from Avery
    and a few other manufacturers. While it''s true that you can do most of what gLabels
    does in LibreOffice or Scribus (which I will mention later in this chapter), I''m
    sure you will find gLabels to the easiest and most intuitive way to get the job
    done, especially when it comes to setting up cards or labels with graphics or
    special layouts.


    # Tomboy


    One of the downsides of the new Unity desktop environment is that you cannot run
    most GNOME panel applets anymore . . . well, not easily. Sticky Notes, that allowed
    you to post little yellow Post-it notes on the desktop, is one such app. Fortunately,
    the more full-featured app to Sticky Notes, called Tomboy (Figure 12-13), works
    in Unity. Once installed and launched, Tomboy works as a panel applet, positioning
    itself with the other status indicator icons at the right side of the Unity top
    panel. From That Tomboy menu, you can add and edit notes and control other Tomboy
    functions.'
  merge: -1
  img_proc: true
- pgno: 262
  md: '![](img/d35fa962e6f9664d66dc83916f426418_262_0.png)


    Figure 12-12: glables


    ![](img/d35fa962e6f9664d66dc83916f426418_262_1.png)


    Figure 12-13: Desktop notes with some oomh—Tomboy'
  merge: -1
  img_proc: true
- pgno: 263
  md: 'One of the most touted Tomboy''s features is its search and hyperlink functions.
    These allow you to search for entries within your entire Tomboy note library and
    create hyperlinks that connect in one note to another linked note. In fact, Tomboy
    will automatically create a hyperlink whenever you type a word that matches one
    of your existing note headings. To make matters even more exciting (or at least
    useful), Tomboy, by means of its plug-ins, allows you to export notes to HTML
    or print them, either as hard copy or as PDFs.


    Once you''ve downloaded and installed Tomboy, you can run it from the Dash, either
    by typing its name and pressing ENTER or by clicking the Applications lens and
    then the Accessories filter button.


    # FreeMind


    If you like to think graphically out your ideas, the mind-mapping application
    FreeMind (Figure 12-14) might be perfect for you. FreeMind allows you to lay out
    your ideas graphically and save your results in a number of formats, including
    PDF, PNG, JPEG, and SVG. You can download FreeMind from the Ubuntu Software Center
    and run it from the Dash. Just click the Applications lens and then the Office
    filter button.


    ![](img/d35fa962e6f9664d66dc83916f426418_263_0.png)


    Figure 12-14: Freemind'
  merge: -1
  img_proc: true
- pgno: 264
  md: '# Scribus


    To round things out, we come to an open source desktop publishing application,
    Scribus (Figure 12-15) for those times when LibreOffice Writer and Draw just don''t
    cut it. Scribus is designed to produce commercial-grade output, and it supports
    professional publishing features, such as CMYK colors, PostScript handling, and
    creation of color separations, and name but a few. There is a fairly good support
    network out for Scribus and an online tutorial too (http://wiki.scribus.net/canvas/Get_Started_with_Scribus),
    so you won''t be alone if you find yourself getting into this application.


    ![](img/d35fa962e6f9664d66dc83916f426418_264_0.png)'
