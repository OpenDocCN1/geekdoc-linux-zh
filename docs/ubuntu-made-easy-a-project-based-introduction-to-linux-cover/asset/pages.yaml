- pgno: 370
  md: '![](img/d35fa962e6f9664d66dc83916f426418_370_0.png)


    # # Installing Windows Ubuntu


    One of the weirder things you can do with a computer is to run a simulation of
    a computer inside it. This simulation, known as virtual machine (VM) software,
    allows you to install one operating system inside another so you can run both
    at once without having to reboot. This is handy if you need to run Windows for
    some reason, perhaps for specialized software, but are too comfortable time-consuming
    rebooting procedure that dual-booters must follow to get back into Microsoft territory.
    You can even get Windows to sit in there, well, a window, which can be opened
    and closed just like any other program.


    There are some caveats. First, the virtual machine has to share your computer''s
    resources with all your other programs, so it can slow things down if you''re
    doing anything computationally strenuous. Second, it doesn''t have the same access
    to your computer''s hardware as the "real" operating system, so you probably won''t
    be able to get Windows-only devices working through the virtual machine very easily.
    Finally, and perhaps awkwardly, you need a Windows installation CD to be able
    to put Windows into a VM, but most computers only come supplied with a recovery
    CD, which won''t the trick.'
  merge: -1
  img_proc: true
- pgno: 371
  md: 'If you have an installation CD, getting Windows into a VM doesn’t take much
    more work than getting it onto a real computer:


    +   1. Open the Ubuntu Software Center and install VirtualBox. Other virtual machines
    are available, I find this one the easiest to use. Search for VirtualBox in the
    Dash and start up. In the window that appears, click New followed by Next.


    +   2. Choose a name and type for your VM. The name is up to you, but the operating
    system should be set to Microsoft Windows. Make sure you pick the right version
    of Windows too.


    +   3. Click Next and choose the amount of memory (system memory, not hard disk
    space) that you’d like the VM to have access to (Figure 19-12). This can be a
    tough decision: on the one hand, you need enough memory for the “virtual” operating
    system to be run (Windows XP needs at least 128MB, for example), but on the other
    hand, you want to leave memory free for Ubuntu programs to be able to use it.
    VirtualBox normally suggests something sensible.


    ![](img/d35fa962e6f9664d66dc83916f426418_371_0.png)


    Figure 19-12: Choosing how much memory to allocate to the virtual machine


    +   4. Click Next and choose Create new hard disk (Figure 19-13). Make sure that
    Boot Hard Disk is checked too. Then click Next to open the Create Virtual Disk
    window.


    +   5. Run through the Virtual Disk Wizard, clicking Finish when you’re done;
    the defaults should be fine for most of the options, but you might want to choose
    the size of the virtual disk yourself. This will be used as the hard disk of the
    virtual machine and is stored as a file in a hidden folder inside your Home folder.
    Again, choose a size that’s big enough to run the OS but small enough that it
    doesn’t engulf your entire hard disk.'
  merge: -1
  img_proc: true
- pgno: 372
