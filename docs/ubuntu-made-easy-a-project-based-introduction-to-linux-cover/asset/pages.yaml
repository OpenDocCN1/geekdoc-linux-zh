- pgno: 68
  md: '# The Dash


    The uppermost icon in the Launcher is often called the Ubuntu button because it
    has the Ubuntu logo on it (Figure 3-9), though it''s also called the Dash button
    because it opens—the Dash. The Dash helps you find applications and files on your
    computer, and it can help you find things on the Internet. You may be thinking
    that the Dash sounds like Ubuntu''s answer to the Windows Start button, and in
    some ways you would be right, though working with it is different and its abilities
    are greater.


    ![](img/d35fa962e6f9664d66dc83916f426418_68_0.png)


    Figure 3-9: The Ubuntu button, aka the Dash button


    Click the Dash button to get your first view of the Dash. You can also bring up
    the Dash by pressing the Windows key, also referred to as the super meta key,
    on your keyboard. The first time out, the Dash will be, in all its nearly transparent,
    empty (Figure 3-10). After you''ve used it a bit, the Dash will show your most
    recently used applications and files when it opens, for now the only things you
    will see are the search bar at the top and a series of white icons at the bottom.
    Clicking these icons takes you to the Dash''s lenses.


    ![](img/d35fa962e6f9664d66dc83916f426418_68_1.png)


    Figure 3-10: The Dash


    # Lenses


    You can think of lenses (Figure 3-11) as a kind of navigation tool—a category
    label by which your system helps you to narrow down what you are looking for,
    not only on your computer but on the Inter-


    ![](img/d35fa962e6f9664d66dc83916f426418_68_2.png)


    Figure 3-11: Lenses in the Dash'
  merge: -1
