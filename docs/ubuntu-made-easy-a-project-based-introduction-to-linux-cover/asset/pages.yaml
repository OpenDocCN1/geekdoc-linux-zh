- pgno: 153
  md: '# USB Storage Devices


    You may well be familiar with USB devices. Your printer is likely a USB device,
    so your scanner. And although your digital camera is not a USB device in the traditional
    sense, chances are that every time you connect it to your computer in order to
    transfer photos, you are doing so via a USB connector. Among the most popular
    USB devices out there are those used for file storage. These include external
    hard disks; flash memory card readers; and the tiny, finger-sized devices known
    as flash drives (Figure 7-15). Flash drives are especially popular today and deserved
    so: they are inexpensive, handy when you need to transfer large amounts of data,
    and pretty safe in terms of cross-platform (including Linux) compatibility.


    ![](img/d35fa962e6f9664d66dc83916f426418_153_0.png)


    Figure 7-15: USB storage devices


    Working with USB storage devices is easy. Just plug the device into one of the
    USB ports on your computer. The LED on the device will do a bit of blinking while
    the system reads what''s on it, and a few moments later, a Nautilus window will
    open, revealing the contents of the device. An icon for the USB device will also
    appear in the sidebar of the Nautilus window and at the bottom of the Launcher.
    You can copy files to and from the device using the drag-and-drop or copy-and-paste
    procedures I mentioned earlier in this chapter.


    Once you are done and want to remove the device, right-click its icon in the Nautilus
    window and select Safely Remove in the pop-up menu. If there is any data that
    needs to be written to the device, the system will start writing. Once it''s complete,
    the icon for the device will disappear from Nautilus. Make sure that you always
    safely remove drives like this, rather than by disconnecting them—otherwise, you
    risk losing data.'
  merge: -1
  img_proc: true
- pgno: 154
  md: '# Working with Bluetooth Devices


    While we''re on the topic of file handling, it is probably a good time to learn
    how to work with Bluetooth devices. As I mentioned in Chapter 3, if you have a
    Bluetooth adapter in your machine, either built in or plugged into a USB port,
    a Bluetooth icon will appear in the right half of the top panel.


    # Pairing Devices


    Before you can transfer files between your Bluetooth devices, you need to pair
    them. This is how you do it:


    +   1. Before you start, make sure that Bluetooth is turned on for both the computer
    and the device you want to pair. For the computer at least, you can do this by
    clicking the Bluetooth icon on the top panel and checking that Bluetooth: On is
    displayed at the top of the menu that pops up.

    2. You should also make sure that the device you want to pair is set to be discoverable
    or visible. This makes it possible for Ubuntu to find it when it scans for nearby
    Bluetooth devices.

    3. Click the Bluetooth icon on the top panel and select Set-up New Device.

    4. In the Bluetooth setup wizard appears, click Continue.

    5. Ubuntu will then search for Bluetooth devices in the vicinity of your computer.
    Once it discovers a device, that device will appear in the center pane of the
    window, as in Figure 7-16. Once the device you want to pair appears, click it
    and then the Continue button.


    ![](img/d35fa962e6f9664d66dc83916f426418_154_0.png)


    Figure 7-16: Searching and selecting nearby Bluetooth devices in Ubuntu


    +   6. In the next page of the wizard, a personal identification number (PIN)
    will appear (Figure 7-17). An input window should also appear in the Bluetooth
    device window you''re trying to connect to. Input the PIN into that input box.'
  merge: -1
  img_proc: true
