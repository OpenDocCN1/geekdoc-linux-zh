  md: '# 22


    # # WOUNDED WINGS


    Fixing Common Problems


    ![](img/d35fa962e6f9664d66dc83916f426418_410_0.png)


    The purpose of this chapter is to arm you with some general-purpose tips, tricks,
    and troubleshooting hints. You''ll find step-by-step instructions on how to fix
    several specific problems, but for the most part I need to keep the discussion
    general. This is because the way you resolve some issues will depend heavily on
    the peculiarities of your setup, and there isn''t big enough a guide that covers
    every possible eventuality in suitable detail. Fortunately, the Internet harbors
    a sizable collection of Ubuntu-related guides, so even if you don''t arrive at
    the exact answer you were looking for, I hope you''ll be able to use some of my
    tips to help you find the right information on the Web.'
  merge: -1
  img_proc: true
- pgno: 411
  md: 'If you''ve run into a problem, flip through this chapter to see whether there''s
    anything that might help. I''ve covered problems with installation, booting, sound
    and video, Internet and network connections, hard disks and storage, and displays
    graphics cards, with pesky software issues such as freezing or slowing down your
    computer. If you''re not bothered by any particular computer quandary, you might
    like to skip through this chapter to get some idea of what to do if this misfortune
    befalls you in the future. Or, you could take my preferred route: Make yourself
    a hot beverage and head back to the games (Chapter 17) for some well-deserved
    R&R.


    # # I Can''t Get Ubuntu Installed


    Not being able to install Ubuntu is a particularly unhappy problem because it
    means you''ve probably denied all fun from the previous 21 chapters of this book!
    Never fear; there''s plenty you can convince Ubuntu to install on your computer,
    and if you''re still struggling, you can try alternative installation methods
    like booting from a USB stick, or I in Appendix A.


    #  My Computer Won''t Boot from the CD


    If you tried to start your computer from the Ubuntu installation CD but never
    even got to the purple boot screen (see "Going for a Dip" on page 12) or the computer
    just boots into Windows every time, one of the following:


    +   **Check the boot order.** When your computer starts up (*boots*), it goes
    through a list of devices in a set order, checking to see whether they have an
    operating system on them. As soon as it finds an operating system, the computer
    will boot from that device, and it won''t check any of the other devices. This
    means if the hard disk comes before the CD drive in the boot order, the computer
    will boot from the hard disk rather than the CD drive. To boot from the CD, you
    need to make sure that the CD drive comes first in the boot order. See "Going
    for a Dip" on page 12 for instructions on setting up the boot order correctly.


    +   **Check the integrity of the CD.** You could have a faulty or damaged CD that
    your computer isn''t able to boot. It''s possible to check whether a disc has
    faults on it by doing a *checksum* test. A checksum is a sort of fingerprint;
    you the checksum of your Ubuntu CD and compare it with the checksum of an Ubuntu
    CD that is known to be free of faults. If there is but one tiny difference between
    the two discs, the checksums will be different too—the "fingerprints" won''t match.
    Ubuntu uses the MD5SUM program to do its checksums. Go to https://help.ubuntu.com/community/MD/
    and scroll down to the "MD5SUM on Windows"


    Chapter 2'
  merge: -1
  img_proc: true
- pgno: 412
  md: 'to see how you can find the checksum of your disc. If it turns out that the
    checksums don''t match, you''ll need to get another CD (for example, by downloading
    a CD image from http://www.ubuntu.com/download/desktop/ by contacting No Starch
    Peer to ask for a replacement).


    **Make sure you burn the disc correctly.** If you downloaded a disc image (.iso)
    file instead of using the CD with that book, make sure you burned the CD correctly.
    A common mistake that people make is to just copy the .iso file onto a disc, as
    if it were a normal file. It won''t work; you need to use the Burn Image option
    (or something similar) in your CD-burning software to do it properly. See https://help.ubuntu.com/community/BurningIsoHowTo/
    for instructions.


    # I Can''t Get the Installer to Run


    If you can boot from the Ubuntu CD (the purple boot screen) when you choose to
    try or install Ubuntu, something goes wrong and you never get to the installer
    screen, the computer might be struggling to start some of the software to run
    the live CD. You can try the following:


    +   **Try some kernel options.** As soon as you get to the purple boot screen,
    press any key (my favorite is the spacebar) and choose your language from the
    list that appears by using the arrow keys and ENTER. Then press F6 to open a little
    menu with a list of cryptic options (Figure 22-2). These kernel options can be
    used to turn off features that cause problems when you''re trying to start the
    computer. Use the arrow keys to go up and down the list and ENTER to select an
    option (an x will appear next to it). In the first instance, I recommend selecting
    acpioff, noaptic, nodraid, and modoset. Then press ESC to hide the menu, and try
    to boot from the CD normally by selecting one of the options in the main list
    and pressing ENTER. If that doesn''t do anything, you might need to apply some
    ''good old'' trial and error to the kernel options to find a combination that
    works for you.


    +   **Try an alternative CD/memory stick.** Some computers are simply unable to
    run the live CD. An alternative text-based installation CD is available from http://www.ubuntu.com/download/desktop/alternative-downloads/;
    you''ll have to download the CD image (.iso) file yourself and burn it to a disc
    before you can use it (see https://help.ubuntu.com/community/BurningIsoHowTo/
    for details). This installation method isn''t as user-friendly as the graphical
    installation from the live CD, but it is much more likely to work if you''re having
    problems. You could also try installing from a USB memory stick, as described
    in Appendix A.'
  merge: -1
  img_proc: true
