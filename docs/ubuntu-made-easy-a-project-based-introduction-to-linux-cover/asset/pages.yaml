    Copy in the pop-up menu. After that, go back to the CD/DVD Creator window, right-click
    any open space, and then select Paste in the pop-up menu.


    It is worth mentioning that the files you copy to the CD/DVD Creator window are
    not actually copied. Instead, what you see in the CD/DVD Creator window are essentially
    links pointing to the original files in their original locations. Thus, if you
    move one of the files from its original location before burning the contents of
    the CD/DVD Creator window to disc, the link won''t'
