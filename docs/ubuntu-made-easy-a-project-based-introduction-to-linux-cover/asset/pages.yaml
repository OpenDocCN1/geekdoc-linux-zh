- pgno: 233
  md: 'If you want to convert a scanned document into a text file, you''ll first have
    to install the Gocr package using the Ubuntu Software Center. Gocr performs a
    process called optical character recognition, which tries to figure out what text
    the image contains recognizing the shapes of individual letters. (It only works
    for typed text, not handwriting.)


    Once Gocr is installed, scan your document into XSane. Before this, click the
    second button from the left (the one that says ABCDEF) before you click Save image,
    and you will find that you can save the file as a document as well. The recognition
    isn''t perfect, so make sure you go over the file to look for typos afterward.


    XSane has plenty more tricks up in its sleeve—visit http://www.xsane.org/doc/sane-xsane-document.html
    for information on what features are available and how to use.


    # Unrecognized Scanners


    If you receive a message telling you that no scanners were detected when you opening
    a scanning program, Ubuntu may not have recognized your scanner. Here are a few
    things you can try to work around this:


    +   - Install the libsane-extras package which contains a handful of scanner drivers
    that aren''t installed by default. Once it''s installed, try opening your scanning
    program again to see whether it worked.

    - Press ALT-F2 to open the Run command screen. Type gksudo simple-scan and press
    Enter, entering your password if prompted. This will start Scan with root (administrator)
    privileges, a step that sometimes raises the scanner from its slumber.

    - Check out wiki.ubuntu.com/HardwareSupport/Scanners to see if there are any special
    instructions that you need to follow or ask for advice on the Ubuntu forums (http://www.ubuntuforums.org/).


    # Why Are My Scanned Images So Big?


    To wrap up this section on scanning, let me address a question that seems to confuse
    a lot of people: Why does a scanned image seem much bigger than its real-life
    counterpart? One of the first areas of confusion arises from the general blurring
    of the terms pixels per inch (ppi) and dots per inch (dpi) are used. Most applications
    use these terms interchangeably, they aren''t really the same thing. To make things
    simple, when you''re talking about images on your screen, you are talking about
    pixels (the little squares that make up your screen) per inch, and when you''re
    talking about printer resolution, you are talking about dots (of printer ink)


    Your screen generally has a resolution of 96ppi, while modern inkjet and laser
    printers have a resolution of 300 to 1200dpi or sometimes even more. This means
    that a photo scanned at 96ppi, looks just fine on your screen, ends up pretty
    lame when you print it.'
  merge: -1
  img_proc: true
- pgno: 234
  md: 'On the other hand, when you scan a picture at 300ppi, the image will look much
    better in your printout but will be gigantic if you display "full size" on your
    screen. This is because there will be three times as many pixels per inch, so
    it looks three times bigger.


    As an example, look at Figure 10-13, you can see an identical image scanned at
    three different resolutions: 96ppi, 150ppi, and 300ppi. As you can see, the 96ppi
    image at the far left (measuring 5 by 6 inches—about the size of the hard copy
    itself) is the smallest, while the other two images are proportionally bigger
    (about 10 by 12 inches for the 150ppi image and about 22 by 25 inches for the
    300ppi image).


    ![](img/d35fa962e6f9664d66dc83916f426418_234_0.png)


    Figure 10-13: The same image scanned at three different resolutions


    # ## Which Resolution Should I Use When Scanning?


    Which resolution you use when scanning depends on a variety of factors, the most
    important of which is what you plan to do with the image when you''re finished.
    When I look at Figure 10-13 on my computer screen, the smallest image looks best,
    the middle image looks okay, and the largest looks a bit odd, not as sharp as
    the other two. Basically, when scanning images for display on a computer—web pages,
    for instance—is properly best to test with a ppi similar to typical screen resolutions
    or slightly larger: 96ppi to 150ppi.


    When it comes to printing, a new set of considerations comes into play. First,
    there are the limitations of your scanner, since different models have different
    maximum resolutions. The resolution limits of your printer and inkjet printers
    have different characteristics; laser printers will produce better-quality images
    than inkjet printers, while inkjet output will be more greatly affected by the
    type of paper used than a laser printer will. Of course, your printed output is
    not going to suffer if you scan your images at higher resolutions than those that
    you plan to print, but you will end up with a lot of files taking up much disk
    space. Remember, the higher resolution of a scanned image, the greater the file
    size in terms of disk space.'
  merge: -1
  img_proc: true
- pgno: 235
  md: 'is of concern you, you can simply resize the images after you''re done printing
    using an application such as the GIMP (more on that in Chapter 13), but if you
    would prefer not being so cavalier with your use of disk space from the get-go,
    you can follow these very general guidelines:


    +   * If you are using a laser printer, scan at the same resolution at which you
    are going to print.

    * If you are going to use an inkjet printer with photo-quality paper, scan at
    about 80 percent of your target printout resolution—about 240dpi for a 300dpi
    printout.

    * If you are using an inkjet printer with regular paper, scan at about 65 percent
    of your target printout resolution—about 195dpi for a 300dpi printout.


    Needless to say, these are just suggestions to get you started. What works best
    for you and your particular scanner/printer setup may be slightly different. Nothing
    works better than a bit of experimentation and trial and error. In this case,
    you can''t really go wrong. Just give yourself some time, don''t get frustrated,
    and, most importantly, don''t wait until you desperately need to scan something
    before trying things—stay ahead of the game.'
  merge: -1
  img_proc: true
- pgno: 236
  md: '# # 11


    #  POLYGLOT PENGUINS


    Linux Speaks Your Language


    ![](img/d35fa962e6f9664d66dc83916f426418_236_0.png)


    These days, almost all operating systems are multilingual, or at least capable
    of becoming so. This is true of Linux. Just open your web browser, and, without
    performing any special installations, you can read pages in any European language,
    including those with non-Roman alphabets such as Bulgarian, Greek, Russian, and
    Serbian. You can even view pages in Chinese, Japanese, Thai, Arabic, and Hebrew,
    to name but a few.


    The multilingual capabilities of Linux are much greater than this, and the way
    that it handles multilingual matters makes it easy to take advantage of these
    capabilities. As you will soon see, you can even set up your system to give you
    a totally foreign-language environment, allowing you to function completely in
    the language of your choice. Add to this the ever-expanding number of free programs
    available for language study, and you have a truly meaningful language-learning
    tool.'
  merge: -1
  img_proc: true
- pgno: 237
  md: '# Read-Only Support


    If all you want to be able to read web pages or documents in a foreign language,
    you don''t need to install any additional language support, except in some cases.
    From the get-go, you will be able to view documents in just any language you happen
    to throw at your system—it doesn''t matter if it''s Swedish, Italian, Chinese,
    Japanese, Arabic, Hebrew, Russian, Vietnamese, Armenian, or Thai. You will be
    able to read whatever you are linguistically capable of reading (see Figure 11-1
    for an example).


    ![](img/d35fa962e6f9664d66dc83916f426418_237_0.png)


    Almost all web browsers these days can automatically recognize the language in
    which a web page is written and thus display the page correctly. Sometimes, the
    author of the page may neglect to include the character coding for that page in
    the HTML, in which case your web browser, knowing that the page is prepared in
    another language, will open it in the default language of your system. The result
    is you see nothing but combinations of symbols and letters that have no meaning.
    In such cases, try changing the character coding in your browser to the language
    encoding you believe the page is in. Some languages employ more than one encoding
    scheme, so if you''re not sure which one the page is prepared in, give each possibility
    a try. In Firefox, you can make your choices by selecting **View Character Encoding**.
    From the submenu, you can select the appropriate encoding for the language of
    the page.'
  merge: -1
  img_proc: true
- pgno: 238
  md: '# Typing Nonstandard Characters


    Typing characters that are not standard in English, such as é, ç, ß, θ, æ, and
    ã can be done quite easily in Linux without any modifications. In situations,
    you can do this by using the Character Map utility included in your system, you
    can be found by going to the Dash, typing character map, and pressing ENTER. Alternatively,
    from the Dash you can click the Applications lens and then the Accessories filter
    button. When you run Character Map, a window like the one shown in Figure 11-2
    will appear.


    ![](img/d35fa962e6f9664d66dc83916f426418_238_0.png)


    Figure 11-2: Inputting characters with the Character Map utility


    To input the character you want, select the language or character set in the left
    pane of the window and then, in the right, double-click the character you want
    to input. The character will appear in the little input box next to the Text to
    copy at the bottom of the window. Just click the Copy button and paste the character
    into whatever application you want to it in.


    LibreOffice offers a method of its own, which you can also use. In the menu bar,
    select Insert > Special Character. A selection window will open, and you can select
    the character you want there. Once you''ve done that, click the OK button, and
    the character will appear in your document, after the selection window will close
    by itself. Double-clicking the character you want will accomplish the same thing.


    # Using the Compose Key Option


    If you need to type an accent or umlaut once in a while and don''t feel particularly
    keen on opening an application or going to a special menu to do, using the compose
    key option for your keyboard is a good way to go. Basically this means you must
    use of the lesser-used keys on your keyboard in conjunction with six symbols (´,
    ´, ~, ^) to help in the creation of accented characters.'
  merge: -1
  img_proc: true
- pgno: 239
  md: 'Before you can use this feature, you have to select which key you want to use
    as your compose key. For this example, I''ll use the ALT key, since most people
    don''t use it much. Here''s what you need to do:


    +   1. Go to the Dash, type keyboard layout, and press ENTER.

    2. In the Keyboard Preferences window that appears, click the Options button.

    3. The Keyboard Layout Options window will now appear. In that window, click Compose
    key position.

    4. Check the box next to the key you want to use as your compose key (that is,
    Figure 11-3). Then close the Keyboard Layout Options window and the Keyboard Preferences
    window.


    ![](img/d35fa962e6f9664d66dc83916f426418_239_0.png)


    Figure 11-3: Selecting your compose key


    Once you''ve done that, you can use your compose key to type those characters.
    Let''s say, for example, that you want to type an unumlaut u (that is, ü). While
    pressing the right ALT key (or whatever you selected as your compose key), you''ll
    release the right ALT key, type u, and voilà—you''ll have yourself an ü! Here
    are some more examples:


    > á right ALT-'' then a

    ç right ALT-, then c

    é right ALT-'' then e

    ñ right ALT-'' then n

    ó right ALT-^ then o'
  merge: -1
  img_proc: true
- pgno: 240
  md: 'NOTE These sequences are based on US keyboard layouts. Combinations for other
    layouts may differ.


    # Adding Keyboard Layouts


    If you type in a particular foreign language, it might be more convenient for
    you to add a new keyboard layout for the language or languages you use. For example,
    if you type in Swedish and thus use the characters ã, ä, and ō regularly, using
    the appropriate keyboard layout would be easier than repeatedly using the Character
    Map. It is even more true if you type in Greek, Russian, Serbian, Georgian, or
    any other language that use a completely different alphabet. Of course, you will
    have to familiarize yourself with the keyboard layout, or keymap, for each language
    you choose, but this is a relatively easy task.


    To add foreign-language keyboard layouts to your system''s repertoire, here''s
    all you need to do:


    +   1. Go to the Dash, type keyboard layout, and then press ENTER.

    2. In the Keyboard Layout window, click the + button at the bottom left of the
    window.

    3. In the Choose a Layout window that then appears, select the keyboard layout
    you want to add, and when done, click Add (Figure 11-4).


    ![](img/d35fa962e6f9664d66dc83916f426418_240_0.png)


    Figure 11-4: Selecting foreign-language keymaps\Select an input source to add

    Russian (Ukraine, standard RSTU)

    Russian (US, phonetic)

    Saisiyat (Taiwan)

    Serbian (Cyrillic)

    Serbian (Cyrillic with guillemets)

    Serbian (Cyrillic, and ZHE swapped)

    Serbian (Latin)

    Serbian (Latin qwerty)

    Serbian (Latin Unicode)

    Serbian (Latin Unicode qwerty)

    Serbian (Latin with guillemets)

    Preview Cancel Add


    +   4. Repeat Steps 2–3 to add other layouts (up to a maximum of four layouts).

    5. When done, your window should look something like Figure 11-5, albeit with
    keyboard layout selections different from mine.

    6. Close the window to complete the process.'
  merge: -1
  img_proc: true
- pgno: 241
  md: '![](img/d35fa962e6f9664d66dc83916f426418_241_0.png)


    Figure 11-5: Selecting the active keyboard layouts on your system


    After closing the Keyboard Preferences window, a keyboard layout indicator will
    appear in the upper-right corner of the top panel. The letters en will appear,
    indicating that you are currently using your English language keymap. If you click
    that indicator, you will toggle between any of the other layouts you activated.
    If you are not sure where the keys are located in your current keymap, you can
    get some help by right-clicking the indicator and selecting Show Current Layout
    in the drop-down menu, after which a map of the new layout will appear in a separate
    window, as shown in Figure 11-6. The keymap shown in that window will be hard
    to make out, so you will probably need to expand the window by dragging it by
    one of its bottom corners.


    ![](img/d35fa962e6f9664d66dc83916f426418_241_1.png)


    Figure 11-6: Having a look at a map of your current keyboard layout


    Chapter 11'
  merge: -1
