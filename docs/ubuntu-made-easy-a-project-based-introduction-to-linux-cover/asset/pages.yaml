  md: '# Keeping Up-to-Date with Live Bookmarks


    The Web is awash in all sorts of news and information, and it can be hard to keep
    tabs on it all. Personally, I hate missing my daily dose of offbeat stories from
    Boing Boing, the aptly titled "directory of wonderful things" (http://www.boinging.net/).
    Unfortunately, Firefox has a real way of dealing with your information overload
    called live bookmarks (also known as RSS feeds). These provide you with an automatically
    updated list of articles from any website that supports them (Figure 5-8).


    ![](img/d35fa962e6f9664d66dc83916f426418_98_0.png)


    You can check whether a website has an RSS feed by going to the Bookmarks menu
    and checking whether the Subscribe to This Page item is enabled. If it''s grayed
    out, then have luck—there''s no RSS feed. If it''s white, not gray, then you''re
    in business! Let''s use Boing Boing as an example: http://www.boinging.net/ in
    Firefox and go to the Bookmarks menu. The Subscribe to This Page item be white,
    which means it''s clickable. Click it, and you''ll get a list of the most recent
    articles to subscribe to feed in the box at the top of the page. Click Subscribe
    Now, and in the window that appears, click Subscribe to add the live bookmark
    to the toolbar as the Latest Headlines link.


    Some websites provide links to their RSS feeds rather than showing them in the
    address bar. If you find one of these links (it''s normally called ATOM or RSS/XML),
    click it, and you should be taken to a list of articles with a box at the top,
    as in the previous example. From there, the steps for adding your feed to bookmarks
    are the.


