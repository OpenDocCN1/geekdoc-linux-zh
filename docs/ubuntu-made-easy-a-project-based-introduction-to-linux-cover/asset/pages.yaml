- pgno: 416
  md: '# Proprietary drivers are being used to make this computer work properly.


    Proprietary drivers do not have public source code that Ubuntu developers are
    Free to modify. Security updates and corrections depend solely on the responsiveness
    of the manufacturer: Ubuntu cannot fix or improve these drivers.


    +   * ATI/AMD proprietary FGLRX graphics driver (post-release updates)

    * Broadcom STA proprietary wireless driver

    * ATI/AMD proprietary FGLRX graphics driver


    Broadcom STA proprietary wireless driver


    +   * Tested by the Ubuntu developers

    * Licence: Proprietary


    This package contains Broadcom 802.11 Linux STA wireless driver for Broadcom''s
    BCM4311, BCM4312, BCM4313; BCM4321, BCM4322-, BCM43224; BCM43225, BCM43227; and
    BCM43228-based hardware.


    This driver is activated and currently in use.


    ![](img/d35fa962e6f9664d66dc83916f426418_416_0.png)


    Figure 22-3: Using the Hardware Drivers tool to disable a restricted driver


    # Check Your System Memory for Defects


    Your system memory (also known as RAM) is vital to the operation of your computer.
    It''s where all your programs (and Linux itself) store information when they''re
    running. A fault in your system memory, freezes and crashes can start happening
    for seemingly no reason.


    To check for problems with the system memory


    Memtest86 repeatedly writes to your system memory and then accesses them few moments
    later. It''s sort of a stress test for your RAM. Let it run until the Pass percentage
    at the top right of the screen has gone 100 percent once or twice—this might take
    as long as an hour or two, depending on how much system memory you have. By that
    time, Memtest86 should have found any faults in the system memory and reported
    them on the screen. If it finds a problem, you might need to get some of your
    RAM replaced, (If that''s the case, it might be time to call in your neighborhood
    IT technician to take a look at).


    You can turn off your computer at any time while Memtest86 is running—you don''t
    need to shut it down properly as you would would.'
  merge: -1
  img_proc: true
