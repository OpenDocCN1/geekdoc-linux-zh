  md: '![](img/d35fa962e6f9664d66dc83916f426418_213_0.png)


    # 9B-1: Installing the GNOME Desktop Environments


    For all the changes that installing the GNOME desktop can bring, it is surprising
    how simple it is to do. Here are the steps:


    +   1. Open a Terminal window, type `sudo apt-get install gnome-session-fallback`,
    and press ENTER.

    2. Type in your password when prompted and press ENTER.

    3. You will be asked if you wish to continue. Type y (for yes) and then press
    ENTER. The process will take up to a minute to complete.

    4. When you are returned to the user prompt, type `sudo apt-get install indicator-applet-appmenu`
    and press ENTER. This process should take only a few seconds.

    5. When you are back at the user prompt again, type `sudo apt-get install gnome-tweak-tool`
    and press ENTER.

    6. When prompted, continue by typing y (for yes) and pressing ENTER. This process
    should take the longest, probably over a minute.

    7. When the process is complete and you are back at the user prompt, close the
    Terminal.

    8. Log out.


    # 9B-2: Switching to the GNOME Desktop Environments and Back Again


    Once the installation is complete and you have logged out, it is very easy to
    switch back and forth between desktop environments. At the login screen, click
    the Ubuntu logo next to your account name, as shown in


