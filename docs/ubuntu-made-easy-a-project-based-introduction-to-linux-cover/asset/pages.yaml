    stored on it.

    When you''re done, click **Continue** to move on to the next step.


    > The security-conscious you might consider considering the Encrypt my home folder
    option. This will scramble the contents of your Home folder (where all your documents
    are stored) so that no one can see any of the files without your password. It
    won''t affect how you access your files, however, as they are descrambled when
