- pgno: 333
  md: 'Plenty of other FPSs are available: AssaultCube, Open Arena, Red Eclipse, and
    Alien Arena immediately spring to mind. Check out the Games ▸ Arcade section in
    the Ubuntu Software Center to see what you can find.


    # Strategy Games


    I enjoy first-person shooters, but sometimes my reaction times aren''t quite up
    to scratch. If the thought of running around a virtual world and shooting at things
    leaves you feeling cold (or clumsy), perhaps a strategy game is more your style.
    Plenty of these are waiting to be discovered in the Ubuntu Software Center, but
    I thought I''d mention a couple of good ones here.

    Warzone 2100 (Figure 17-9) is broadly similar to the Command and Conquer series
    of games. You start off on a battlefield with a small collection of vehicles,
    which you must command to build a base and defend it from enemies. Once your base
    is in good shape, you can build new units and send them to attack your foes. Your
    opponents are doing the same, however, so battles can turn into subtle tactical
    affairs, where your ability to launch successful attacks must be balanced against
    the limited availability of resources and the constant threat that the enemy will
    destroy your base.


    ![](img/d35fa962e6f9664d66dc83916f426418_333_0.png)


    Figure 17-9: Warzone 2100


    If you''re struggling to find the time to mastermind an entire military campaign,
    perhaps Hedgewars (Figure 17-10) is more your thing. It''s a clone of the popular
    Worms game, which sees you in command of a small team of heavily armed worms (or,
    in the case of Hedgewars, cute little hedgehogs)'
  merge: -1
  img_proc: true
- pgno: 334
  md: 'scattered around an oddly shaped landscape. You take turns, using your over-stocked
    arsenal to remove opponents from the map in elaborate ways before they can do
    the same to you. It’s definitely worth playing, if only for the inter-esting sound
    effects. . . .


    ![](img/d35fa962e6f9664d66dc83916f426418_334_0.png)


    Figure 17-10: Hedgewars


    A few other strategy worth looking out for include 0 A.D. and Wildelands, where
    you command an ancient civilization as it settles (and battles) the rest of the
    known world; Bos Wars, which is similar to Warzone 2100; and The Battle for Wesnoth,
    which has more of a fantasy vibe.


    # Simulators


    Waging war isn''t everyone''s idea of escapism, which is an extensive collection
    of simulation games is available for Linux. I’ve tried to cover as many bases
    in this section, but as always, you see the peruse Ubuntu Software Center if you
    don’t see something here that appeals to you.


    When I think of simulation games, my mind immediately jumps to Sim City, the venerable
    city-building game. As the mayor, you’re in charge of running your city: You plan
    construction work, build and maintain transport links, and set budgets and taxes.
    Throw the old natural disaster into the mix, and you have a challenge on your
    hands! The Linux equivalents of Sim City are LinuxCity-NG and OpenCity. I prefer
    LinCity—but you should try and decide for yourself. The original Sim City game
    is available too, if you don''t mind playing a game with old-fashioned graphics.
    Just search for Micopolis in the Ubuntu Software Center (it was renamed for legal
    reasons). Finally, managing a whole city game sounds like a bit of a chore, you
    could always take a look at OpenTTD instead. It’s a clone of Transport Tycoon,
    which “merely” has you running the transport network.'
  merge: -1
  img_proc: true
- pgno: 335
  md: '![](img/d35fa962e6f9664d66dc83916f426418_335_0.png)


    The hardcore flight-simulator enthusiasts among you will want to take a look at
    Flight-Gear (Figure 17-12). The focus is definitely on realism, with all sorts
    of cockpit controls and aircraft to play with. If you really want the full experience,
    there''s an Earth-sized online multiplayer map to fly around. If you''re not already
    in possession of a pilot''s license, then it might be a good idea to read the
    manual before you play; you can find it at http://www.flightgear.org/Docs/getstart/getstart.html.
    For something a less involved, and a little more warlike, check out gl-h117, a
    combat flight simulator. Or, the humanit among you might prefer Search and Rescue,
    in which you pilot aircraft on various rescue missions.


    A little less than FlightGear, a motor-racing game (Figure 17-13). It''s a pretty
    standard racer in which you speed around a circuit against computer-controlled
    opponents. It has a good choice of cars, tracks and race styles, and are all available
    on the Torcs website at http://torcs.sourceforge.net/. If off-road racing is your
    style, take a look at the Trigger rally game. It''s not as well developed as Torcs,
    but it makes for a change.


    If you''ll permit me to touch the definition of simulator just a little, there
    is a neat rock-star simulator called Frets on Fire (Figure 17-14). The gameplay
    is much like Guitar Hero, but with one major difference: You use your keyboard
    to play notes, rather than a guitar-shaped controller. However, if you don''t
    mind doing a little tinkering, you can get your Guitar Hero controller to work
    with Frets on Fire. (See http://fretsonfire.wikidot.com/using-guitar-hero-controller/)
    Plastic guitar or not, it''s not an addictive game. Or, if karaoke is more your
    style, there''s always Performous.


