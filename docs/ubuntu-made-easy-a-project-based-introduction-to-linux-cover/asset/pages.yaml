  md: '# Other Home-Related Applications


    There are, of course, many other applications that are related, we''ll finish
    up this chapter with three that are completely unrelated to one another and are
    both useful and a good representation of the diverse range of applications available
    for Ubuntu. First is the application Gramps (Figure 18-14), which allows you to
    record information about your ancestors (even photos) and then view the information
    through a variety of report types and/family trees. Gramps also allows you to
    import or export GEDOM files, which you can easily share information with other
    genealogists. Documentation and additional information on Gramps available at
    http://gramps-project.org.


    ![](img/d35fa962e6f9664d66dc83916f426418_356_0.png)


    Figure 18-14: Keeping of your ancestors with Gramps


    You can run Gramps from the Dash by clicking the Application lens and then clicking
    the Office filter button. You can also type gramps in the Dash and press ENTER.


    Another useful application is Sweet Home 3D (Figure 18-15), which is a 2D-interior
    design program with a 3D preview. It allows you to play around with various room
    layouts by dragging and placing pieces of furniture and items into customized
    rooms. Documentation and other information are available at http://www.sweet3d.com/index.php.


    To run Sweet Home 3D, go to the Dash, type sweet home, and press ENTER. Alternatively,
    click the Dash''s Application lens and then the Gramps filter button.


    Finally we come to Brewtarget (Figure 18-16), which is designed to create and
    manage beer recipes. What could be better! It is also compatible with the home-brewing
    software Beersmith.


    You can run Brewtarget from the Dash by typing brewtarget and pressing ENTER or
    by clicking the Application lens in the Dash and then clicking the Education or
    Science & Engineering filter buttons.'
