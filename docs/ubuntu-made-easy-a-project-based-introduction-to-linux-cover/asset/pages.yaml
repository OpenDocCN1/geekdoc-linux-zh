    manufacturer''s own Linux driver, if one exists. Also, some newer printers allow
    you to check ink levels and align clean cartridges controls on the printer. In
    doubt, check your printer''s manual.


    # Project 10: Installing TrueType Fonts


    On some level, printing is all about presentation. If you''re going to all the
    trouble of printing something out, it''s more likely that you want it to look
    good. Few things affect presentation more than your choice of font: Unless you''re
    a children''s entertainer, you probably won''t get far with a wacky font Comic
    Sans on your résumé., a medieval-looking gothic font would probably be wasted
    on that letter to your bank manager. Fortunately, your Ubuntu system comes with
    a wide variety of usable and, at my eyes, handsome TrueType fonts. However, these
    need to be on the conservative side of the aesthetic spectrum, and many users
    will want to add a few more distinctive fonts to the system repertoire.


    Your bank manager may not appreciate that Gothic font, but you may want to print
    an award for an event you are hosting. Or you might be preparing a newsletter
    for the local chapter of your snail-breeders and want to use a font that is round,
    bubbly, and slimy. Whatever your penchant, purpose, or desire, you will probably
    reach a point when you want to install some other TrueType fonts on your system,
    in this project I''ll tell you how to do it.


    How you install fonts depends on who is going to use them. If you have only one
    user account on your machine, the easiest is to install the fonts locally, as
    described in "10-2: Installing Fonts" on page 191. Locally installed fonts are
    ones that only you or someone logged in to your user account will be able to use.
    On the other hand, if you have more than one user account and want the fonts to
    be available to all the users on your machine, you''ll need to install them globally—in
    this case, see "10-3: Installing TrueType Fonts Globally"


    # 10-1: Getting the Font Files


    The Internet is awash in free fonts. For this project, I will point you to the
    http://www.fontfreak.com/site, which has a very nice collection of fonts. Once
    you get to the Font Freak home page, click the Fonts link under the "FREE FONTS"
    heading on the left side of the page. The next page will ask you whether you want
    to download all the free fonts on the site in one single file; click No thanks,
    I will download them one by one. This will lead you to the'
  merge: -1
  img_proc: true
- pgno: 228
  md: 'main list of free fonts; browse through the various pages until you find that
    is to your liking and click it. Which font you download is completely up to you,
    but be sure to choose the PC version, not the Mac version. You can do this by
    clicking the small Windows icon immediately to the right of the font''s name.
    When the download window pops up, choose Save File and click OK to save the font
    as a Zip file. To follow along with this project, download a couple of fonts—I
    chose Aajax Surreal Freak and Accidental.\.


    When you''re finished downloading, drag the font folder (or wherever you saved
    them) to your Home folder so it''s easy to copy along my instructions. Also, be
    sure to unzip font files before going on the installation steps. (Right-click
    each Zip file and choose Extract Here.)


    # 10-2: Installing Fonts Locally


    If you''re the sole user of your computer, installing fonts locally will just
    do fine. To get started, you need to set up your system by providing it with a
    location for your fonts. You will need to do this the very first time.

    Here''s what you do:


    +   1. Open your Home folder and, in that, create an invisible folder by selecting
    File ▸ Create Folder.

    2. When the folder appears, name it .fonts (the period before the name means it
    will be hidden).

    3. Hide the new folder by selecting Edit ▸ Reload. Your .fonts folder should no
    longer be visible. If this is the case, you can close the window—your setup was
    successful.


    Now that everything is set up, let''s continue with this project using one of
    the fonts you downloaded. After you''ve decided which font to use, follow these
    steps:


    +   1. Choose the unzipped font file (its name probably ends in .ttf), and copy
    it by right-clicking and selecting Copy.

    2. Press CTRL-L or select Go ▸ Location. This will display the location bar in
    Nautilus.

    3. In the location bar, type "~/fonts and press ENTER. The ~ sign is a short-cut
    that means "My Home folder".

    4. You should be taken to the empty .fonts folder you just created, like the one
    in Figure 10-9. Right-click anywhere in the folder and select Paste to copy the
    font into the folder.


    Now that you have installed your font, you can give it a try in one of your applications,
    such as LibreOffice Writer. (Any running applications needs to be restarted before
    the new font will appear in that application''s font menu.)'
