- pgno: 267
  md: '# Project 13A: Importing Images from Digital Cameras


    Although scanner support for Linux can prove a bit spotty, support for digital
    cameras is practically a worry-free affair. In fact, Ubuntu pretty treats your
    camera as if it were an external hard drive or flash drive plugged into your computer''s
    USB port (which is pretty much what it is). And even if your camera doesn''t seem
    to communicate with your computer when connected, you can transfer your images
    to your hard disk by removing the memory card from your camera, inserting it into
    a USB flash memory reader, and plugging that into one of your USB ports.


    # 13A-1: Importing Images from Camera to Computer Somewhat Automatically via Shotwell


    When you connect your camera to your computer via a USB cable, put your camera
    in pow mode, and power it on, Ubuntu usually automatically recognize and open
    a window that asks how you want to import the photos on the camera. To import
    the photos via the photo manager application Shotwell, select the Shotwell option
    in the drop-down menu, but as in Figure 13-1, and then click OK.


    ![](img/d35fa962e6f9664d66dc83916f426418_267_0.png)


    13-1: Ubuntu recognizes your camera and asks you how to proceed.


    After that, here''s what you need to do:


    +   1. In the window that appears, you will see thumbnails of all the photos on
    your camera. You can import all of the photos by clicking the Import All in the
    bottom right corner of the window. However, if you prefer to copy only some of
    the images, you can do so by holding down the CTRL key and clicking the images
    you want to import, as shown in Figure 13-2. Once you''ve made your selections,
    click the Import Selected button.'
  merge: -1
  img_proc: true
- pgno: 268
  md: '![](img/d35fa962e6f9664d66dc83916f426418_268_0.png)


    Figure 13-2: Selecting photos to import from your digital camera by Shotwell photo
    manager


    2. Shotwell will save your photos to a dated subfolder in your Pictures folder.
    Once it is done importing the images from your camera, it will tell you so in
    an Import Complete window, where it will also ask you what you want to do with
    the photos still in your camera. If you want to keep them there for the time being,
    click the Keep button. If you would prefer to clear space on your memory card
    by deleting the images, click the Delete button.


    The time it takes to import and delete photos from your camera or storage card
    will vary depending on the number of images on the card. Once the process is complete,
    however, you will be able to view them all within the main Shotwell window, as
    well as work with them, a topic I will discuss later in this chapter.


    # 1A-2: Transferring Images from Camera to Computer via the File Manager


    You can also use the file manager to import photos from your camera, if you prefer.
    If you happen to have digital movies on your camera''s memory card in addition
    to digital images, you''ll have to go this route (for the movies at least) since
    Shotwell imports only images. The process for doing starts pretty much the same
    as that in Project 13A-1, albeit with a slight twist. Here''s how you do it:


    +   1. Plug your camera into one of your computer''s USB ports and put your camera
    into play mode. Within seconds, a window like that in Figure 13-1 will appear.
    In that window, select Open Folder in the drop-down menu button (instead of Shotwell)
    and then click OK.'
  merge: -1
  img_proc: true
- pgno: 269
  md: '2. A file manager window will appear, revealing the contents of your camera
    storage card. An icon for your camera (looking like a USB drive) will also appear
    over Devices in the side pane of that window and any other open file manager window
    (Figure 13-3). A message will appear at the top of the window telling you that
    the device you connected contains digital images, along with a button that you
    can click to import the images with Shotwell. Since we covered that method already,
    you can ignore it for now.


    ![](img/d35fa962e6f9664d66dc83916f426418_269_0.png)


    Figure 13-3: You can also drag and drop photos from your digital camera as if
    it were a USB drive.


    3. Double-click your through the folders on your camera until you find the photos
    you want to import.


    4. Drag and drop, or copy and paste, the images from your camera to any logical
    spot in your Home folder.


    5. When you''re done transferring photos, you can click the eye icon next to the
    entry for your camera in the left pane of the file manager window, or you can
    turn off your camera. The file manager that opened will automatically close, and
    your camera''s entry will disappear from the side pane of any other file manager
    windows.


    # Project 13B: Working with Digital Images in Shotwell


    Shotwell not only imports images from your camera to your computer but also acts
    as a handy photo-organizing, browsing, viewing, and publishing tool, allowing
    you to easily send emails without fiddling around with attachments. It also lets
    you easily publish to popular online sites such as Facebook, Flickr, and PicassaWeb.
    In addition, Shotwell serves as a simple photo-editing tool, allowing you to enhance;
    rotate; crop; remove red-eye from; and adjust the exposure, temperature, and saturation'
  merge: -1
  img_proc: true
- pgno: 270
  md: 'of a photo (Figure 13-4). Just double-click the photo you want to edit and
    then click the appropriate buttons that appear at the bottom of the window. You
    can pretty much learn by fiddling around; all the tools are pretty straightforward.


    ![](img/d35fa962e6f9664d66dc83916f426418_270_0.png)


    Figure 13-4: Shotwell provides you with basic but useful photo-editing tools.


    # 13B-1: Publishing Images to Online Albums and Galleries


    As mentioned, Shotwell allows you to easily publish images to numerous online
    sites, much in the way that Windows Live Photo Gallery does. The method I show
    here for Facebook is essentially the same one you use for the others, and they''re
    all pretty simple. Here''s what you need to:


    +   1. In Shotwell, select the photos you want to post online by holding down
