  md: 'more windows are open (also shown in Figure 3-17). Of course, if a Launcher
    item is not running or open, no marks will appear on either side of that Launcher
    icon.


    Switching between different applications is easy enough to do by clicking the
    icons for the application you want to switch to. You can also do this from your
    keyboard by repeatedly ALT-TAB until you get to the application you want to use.


    Yet another way to switch applications (or start an application that isn''t currently
    running) is to hold down the Windows key. After a second or so, the icons on the
    Launcher will become numbered, and you can then switch to the application by pressing
    the number on your keyboard that corresponds to it. If more than one window of
    application is open, the most recently used window will gain focus.


    Even when you''ve gotten to the application you want, you might still not be in
    the right place—want to deal with that moment. For example, let''s say you have
    six manager windows open and they''re all piled on top of another. The one with
    focus is Documents, but you are looking for the one with your photos of trip to
    Cyprus last summer. You could wade around with your mouse, dragging windows out
    of the way until you find the one you''re looking for.


    A slightly easier way of going about this is to click any one of the windows to
    give it focus, and then repeatedly press ALT TAB (on most keyboards, this is the
    key with the accent grave and tilde symbols) until you reach the window you want.
    Alternatively, you can find the window in a more direct manner by clicking the
    Launcher icon for your application (in this case home button) once more, after
    all the open windows related to the application that Launcher icon will appear
    at once (Figure 3-19). You then just click the window you want to go to.


    It is also possible to see all of the windows currently open, not just for a particular
    application, at the same time. To do this, press the Windows and W keys. If you
    want to hide all of the windows so you can see the desktop itself, press CTRL-ALT-D.


