- pgno: 168
  md: 'To see how this command works and to work with the commands that follow, use
    the mkdir command now to create a folder called command_exp (for command experiments).
    All you have to do is type mkdir command_exp in a new Terminal window and press
    ENTER. The new folder should appear in your Home folder, so go ahead and check
    whether it is there by clicking the icon on your desktop.


    Okay, bra, bueno! Now let''s create another new folder within new—a subfolder,
    if you will. We''ll call this one sub. So, just type mkdir command_exp/sub and
    press ENTER. If you like, take a peek and see whether the sub folder has appeared
    within the command_exp folder.


    # $ mv


    The next command is the mv (move) command, but before you experiment with it,
    you need to create a dummy file—you need something to move, after all. You can
    do this using another command—touch. To make the filelet''s call it expfile.txt—go
    to the Terminal, touch expfile.txt, and press ENTER. The new file will appear
    in your Home folder.


    To move the file you''ve just created, you will use the mv command of, course,
    just type mv expfile.txt command_exp/sub (this tells the system which file to
    move and where to move it to) and press ENTER. The file will now be in your sub
    folder.


    # $ cd


    Until now, you have been using the command line from your Home folder. With the
    cd command, you can change your Terminal''s location to another folder. You''ll
    be using this very handy command a lot when doing the projects in this book. To
    take it out for a spin, let''s get inside the command_exp folder by typing cd
    command_exp and pressing ENTER. If you''ve done this, the prompt in your Terminal
    will now read username@computer_name:~command_exp$. If so, you can pat yourself
    on the back.


    While you are there, you might well try the ls command with the R (recursive)
    flag to see how it works. Just type ls -R and press ENTER. Your Terminal should
    show you that you have a subfolder called sub and a file inside that folder called
    expfile.txt.


    That is all you really want to do for now, so to get back to your home directory,
    just type cd and press ENTER, which will take you back home, to speak.


    For future reference, it''s worth noting a couple of command shortcuts. If you
    are within a subfolder and want to move back a step (from /home/rg/peas/pudding
    to /home/rg/peas, for example), you can do so by typing cd .. (with a space between
    cd and ..) and pressing ENTER. You can also type cd - (with a space between cd
    and -) in order to get back to the directory where you were previously (from /home/rg
    to /home/rg/peas/pudding, for example).'
  merge: -1
  img_proc: true
- pgno: 169
  md: '# $cp


    You might decide that not only you want your expfile.txt file in the subfolder

    y also want a copy in your home directory, where it was in the first place.

    To copy expfile.txt, you can use the cp (copy) command.

    The command needs know where the file you want to copy is, what it

    called, and where you want to copy it, which in this case is your Home

    folder. Normally you would type command_exp/sub/expfile.txt /home/username

    to do this, but if you recall, you can abbreviate the /home/username portion

    of the command string to /, which means the same thing. (This is an important

    t to remember, because the tile is frequently used in online instructions.).

    Because reducing wear and tear on the fingers is always a desirable goal, type

    the following command and press ENTER:


    ```

    cp command_exp/sub/expfile.txt ~

    ```


    Be sure to put a space between the name of the file you are copying and

    d destination (in this case, between expfile.txt and ~/).nOnce you''ve done this,
    you should have two copies of expfile.txt, one in

    y Home folder and in your sub folder. Take a look to see the fruit

    of your endeavors.


    # $rm


    When you were a kid, you may well have experienced the joy of building a

    caste of LEGO bricks and then the even greater joy of tearing the whole

    thing down (preferably by hurling D cell batteries at it). You will now embark

    a similar move. The first tool in this nostalgic endeavor is the rm (remove)

    command, with which you can trash files.


    The rm command, albeit very easy and use to use, should be handled\with caution.
    Once you remove a file with this, there is no going

    back. To play it, let''s try the rm command by getting rid of that new copy

    of expfile.txt that we created in the Home folder. The basic rm command

    structure consists of the command itself, followed by the name of the file

    you to remove. In this case, you want to remove the file called expfile.txt

    located in Your Home folder. Assuming your Terminal shows you to be,

    remove the file by typing rm expfile.txt followed by a tap on the of ENTER

    key. The file will be gone, and gone for good.


    Now, double your pleasure by getting rid of the version of expfile.txt that

    located in the subfolder sub. In this case, you need to specify where the file
    is

    it''s not in the folder that the Terminal is in. Just rm command_exp/sub/

    expfile.txt and then press ENTER. Oooh, very cool. Brings ya back, doesn''t it?


    # $rmdir


    Now you will continue the file with the rmdir (remove directory) command,

    which is a bigger and more powerful version of the rm command.'
