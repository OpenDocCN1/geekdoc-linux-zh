    ![](img/d35fa962e6f9664d66dc83916f426418_147_0.png)


    Figure 7-10: Changing the permissions of a Home folder for privacy


    # Reading Data CDs and DVDs


    Dealing with data CDs and DVDs in Ubuntu is quite simple, because everything is
    automatic. To read a CD or DVD with data on it, rather than music or video, place
    the disc in your drive, and a CD or DVD icon (they look the same) will automatically
    appear at the bottom of the Launcher and you can click once on the icon, after
    the disc''s contents appear in Nautilus. Then you can copy files from the CD or
    DVD to your hard disk using standard drag-and-drop or copy-and-paste procedures.

    When you want to remove the CD or DVD, just right-click the icon for that disc
    in the sidebar and select eject in the pop-up menu. The disc will be ejected automatically.'
  merge: -1
  img_proc: true
- pgno: 148
  md: '# Burning Data CDs and DVDs


    Burning data CDs and DVDs in Ubuntu is extremely easy, as long as you have a CD
    or DVD burner hooked up to your computer! All you have to do is place a blank
    CD-Recordable (CD-R) or DVD (DVD-RW, DVD-R, and DVD+RW are all supported) in your
    drive, making to select a media format supported by your drive, and a Disc window
    will appear asking what you want to do. Click OK to open Nautilus''s CD/DVD Creator,
    which as no no doubt notice looks pretty similar to other Nautilus windows, save
    for the options and buttons at the top of the window (Figure 7-11).


    Once the CD/DVD Creator window is open, copying the files you want to burn to
    disc is pretty much a simple drag-and-drop. Just open a new Nautilus window and
    drag the files you want to burn disc from that window to the CD/DVD Creator window.


    ![](img/d35fa962e6f9664d66dc83916f426418_148_0.png)


    If you prefer to do things in a decidedly Windows-esque fashion, you can select
    the files you want to transfer to disc by clicking each file once while holding
    down the CTRL key for multiple selections. If you want to select consecutive files,
    you can click the first file in the group, press and hold SHIFT, and then click
