    # $ ln


    You use the ln (link) command to create a link that launches or activates another
    file located in a separate folder. This is very useful when you want to activate
    a file that is buried deep in the subfolder of a subfolder of a subfolder on your
    hard disk. The command is often used with the -s (symbolic) flag, which provides
    essentially the same thing as the shortcut you''ve come to know in Windows, or
    the alias on the Mac.


    The easiest way to use ln is first use the cd command to change the Terminal''s
    location to the folder where you want to place the link. Then you type the ln
    command to link, followed by the path of the file to which you want to link. For
    example, let''s say you want to put a link in your Home folder for a LibreOffice
    file called myLife.odt.


    The file is pretty well buried in a nest of subfolders deep within your Home folder:
    /home/username/Documents/personal/self/autobiography/myLife.odt. To create it,
    you would open a new Terminal window, type the following command string, and then
    press ENTER:


    ```

    ln -s Documents/personal/self/autobiography/myLife.odt

    ```


    Once you are finished, the link will appear in your Home folder as an icon matching
    the original file in appearance, alerting an arrow to signify that it is a link.


    # $ tar


