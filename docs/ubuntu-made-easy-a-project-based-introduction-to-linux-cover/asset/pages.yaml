    4. In the username Properties window (mine says rg Properties), click the Permissions
    tab.

    5. In the Permissions tab, go down to the Group and Others sections and select
    None in the drop-down menus next to the words Folder access. Be sure to do this
    in both the Group and Others sections. When you''re done, your window should look
