  md: '# 3


    # A NEW PLACE TO CALL HOME


    Getting to Know the Desktop


    ![](img/d35fa962e6f9664d66dc83916f426418_62_0.png)


    So here we are at the gateway of your new world. You''ve got Ubuntu installed,
    it is up and running, and you are ready and rarin'' to go. If you are running
    Ubuntu from your hard disk, the first thing you may see, depending on how you
    set things up, is the login screen that will appear each and every time you boot
    up (Figure 3-1). If so, type in your password and press ENTER, and you''ll be
    face to face with the Ubuntu desktop. If you set up your system during installation
    to bypass the login phase, or if you are still running Ubuntu from the live disc,
    you''re already there. Either way, let''s get down to getting to know your new
    home.'
