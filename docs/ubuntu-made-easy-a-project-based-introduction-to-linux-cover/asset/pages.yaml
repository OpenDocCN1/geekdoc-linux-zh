  md: 'You''re allowed a maximum of 140 characters per tweet, and the number of characters
    you have remaining is displayed in the bottom right of the box. When you''re happy
    with what you''ve written, click Send to post the message for everyone to see.
    You can also send tweets by clicking the Messaging Update status item. Do this
    as you like; you can tweet away all day!


    Twitter isn''t solely a broadcast medium, and you can converse with other users
    in several ways. Move the message in the main pane, and click it (r for Twitter)
    will appear inside, at the top right of the message. Click it and select Reply
    from the menu that pops up, and the message box will appear containing that person''s
    username with an @ sign in front of it (Figure 5-24). This is how you reply to
    someone else''s tweet (sometimes called an “at-reply” because the @ symbol is
    used). Just type your message as normal, but after the person''s username.


    There are a few other options to choose from in the menu that appears when you
    click the colored icon. Retweet is an interesting one—click it, and you''ll post
