    NOTE** If you are wondering what Internet Protocol (IP) and Domain Name Service
    (DNS) are

    all about, you can simply think of them in this way: DNS translates the easy-to-remember

    URLs that you have to know, such as http://www.google.com/, to numer-\ical, or
    IP, addresses that the Internet can understand. The address http://www-

    gogle.com/ becomes http://209.85.229.104. You can type the numerical

    version into your browser later to see for yourself.


    # # Setting Up a Wireless Connection


    With the right hardware, you can now surf the Web just about-

    where you can catch a (radio) wave. Whether you happen to be at

    breakfast table, in a public library, or at your local coffee shop, you can

    now online without physically hook up your computer to anything.


    Fortunately, the process of setting up wireless networking in Ubuntu

    easy; it''s not very different from the procedure for wired networks, described

    in the previous section.


    # ## Hardware


    If you have led a wired existence or are just inexperienced in this area,

    there are a few things worth knowing. To get started, you need to have the

    right hardware. If you just want to go wireless, then all you need is a wireless

    network card (sometimes almost referred to as an 802.11a/b/g/n or Wi-Fi card).

    These are built into all modern laptops, for older models they are

    usually add-ons in the form of cards that pop into the PCMCIA slot on

    t side of your computer (as shown on the right of Figure 4-4).


    Some wireless cards plug in to one of your machine''s USB ports, or

    the case of desktop models, of its internal PCI slots. Although support\for cards
    of this type has improved in the past couple of years, there are still

    gaps, and some cards can be tricky to deal with. You will find tips on how

    deal with awkward cards in Chapter 22, but if you''re looking for a sure thing,

    cards listed as having a Ralink 2500/RT2400, Realtek RTL8180, or Atheros

    AR9170 "chipset" are definitely supported by Ubuntu.'
  merge: -1
  img_proc: true
- pgno: 83
  md: '![](img/d35fa962e6f9664d66dc83916f426418_83_0.png)


    Figure 4-4: All you need for a Wi-Fi setup—an access point and a network interface
    card


    As for cards of the built-in or PC card variety, you will find support much better,
    but even then you have to make sure, or at least hope, that the card you are using
    is Linux compatible. No matter what wireless card you are using-wondering about,
    the easiest way to find out whether it work is just to try it. The Linux kernel
    now comes with many wireless drivers built in, and Ubuntu updates provide new
    ones, so if you use a card that is compatible with one of those drivers, things
    will be smooth sailing. If things don''t seem to work, check Ubuntu’s list of
    supported cards (https://help.ubuntu.com/community/WirelessCardsSupported/) or
    check the Ubuntu forums to find a driver that is compatible or to see whether
    anyone has experience with your particular card. If you want to set up a wireless
    system in your home or office, then you will also need to get a wireless access
    point (WAP), shown on the left of Figure 4-4. Fortunately, Linux compatibility
    is not much of an issue in this department, because the access point does not
    physically interface with your computer and the settings are handled via your
    web browser.


    NOTE Access points come in several types. The most common type is a wireless router,
    which many ISPs provide for free.


    You should be aware, however, that a small minority of access points require you
    to use Internet Explorer to handle their setup chores. Although it is possible
    to get Explorer up and running in Linux via Wine (which you will learn more about
    in Chapter 19), you can''t be 100 percent sure it will work. Unless you have a
    Windows machine somewhere in your house or office to handle such chores, it is
    probably a good idea to steer clear of access points of this kind.


    # ### Activating Your Wireless Card


    Setting up a Linux-compatible wireless card is relatively simple. First connect
    your point to your Internet source and then turn on the access point. Once it
    is up and running, plug your wireless card in to PCMCIA slot or'
  merge: -1
