- pgno: 212
  md: '# Project 9B: Customizing Your Desktop Environment—nThere''s No Place Like
    GNOME


    We have now covered the major ways that you can alter the looks of your system
    using graphical frontends. However, you can also do some things that are considerably
    more dramatic and will give you the chance to the command-line skills you acquired
    in Chapter 8 to good use. Now you''ll have the chance, if you''re so inclined,
    to journey to another world . . . well another desktop environment.


    While Ubuntu is one of the most popular Linux distributions today, many folks
    are not keen on the Unity desktop, and after giving it a shot, you may find yourself
    among the ranks of the disgruntled. If so, you need to despair for long—there
    are alternatives, and in this project you''ll learn to install perhaps the most
    well-known of them: GNOME. Not only will you install and learn to log in to the
    desktop environment that was there in the pre-Unity days, the GNOME Classic desktop
    (Figure 9-22), but you also learn and how to switch to what GNOME has become—the
    GNOME Shell (Figure 9-23). Best of all, if you like the new GNOME today and Unity
    Classic the day after, no problem because all of those environments will be present
    in your system, waiting for you to call them to duty and when you want or need
    them. Of course, the interfaces of these environments are somewhat different from
    that of Unity, all of the environment-specific information you''ve learned in
    this book will apply, but it should be pretty easy to figure out.


    ![](img/d35fa962e6f9664d66dc83916f426418_212_0.png)


    Figure 9-22: The GNOME Classic desktop environment


    Dressing Up the Bird 175'
