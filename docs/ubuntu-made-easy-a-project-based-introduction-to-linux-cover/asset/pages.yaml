  img_proc: true
- pgno: 97
  md: 'box meets the eye. Indeed, there is: Open a new tab and start typing. As the
    letters appear in the address bar, a list will appear immediately below it, containing
    links to websites that you''ve previously visited (shown in Figure 5-7). Firefox
    is directly searching your web history as you type, finding anything that matches
    what you entered in the address bar. Refine the search by typing a few more letters
    or scroll down through the list until you find the website you''re looking for.
    With a single click, the page will load, negating any need to type its address
    out. Slick, use the arrow keys on the keyboard to select items from the list and
    use the ENTER key to visit the page that is currently highlighted—no clicking
    required.


    ![](img/d35fa962e6f9664d66dc83916f426418_97_0.png)


    **Figure 5-7:** The Awesome Bar, showing items from the web-browsing history


    As well as addresses, you can also type search terms into the address bar. For
    example, type **cat pictures** into the address bar and press ENTER. Firefox recognizes
    that *cat pictures* wasn''t meant to be a web address and will perform a search
    instead, if you had typed those into the search box to the right. It might take
    a little time to get used to how the Awesome Bar works, it''s a pretty nifty feature
    that can save you a lot of clicking around.


    When I said that Firefox remembers everything you''ve looked at, I really meant
    everything. If you don''t want Firefox to remember the pages you visit, at least
    for time, you can try *Private Browsing mode*. This is handy if you want to look
    at something confidential, such as a banking website. Click **Tools > Start Private
    Browsing** and start surfing—Firefox will instantly forget any and all of the
    pages you visit while private browsing is enabled, and they won''t appear in your
    web history or otherwise. When you want to return Firefox to its normal operation,
    simply go back to the Tools menu and click **Stop Private Browsing**. The window
    will return to whatever state it was before you started browsing, without any
    trace to the websites you just visited.


