    # Project YC: Switching from Unity to Cinnamon


    Recently vying with Ubuntu in terms of popularity is another Linux distribution,
    based on Ubuntu, called Mint. Mint uses a desktop called Cinnamon, which might
    be described as a cross between GNOME Classic and MS Windows. It is a simple and
    yet very familiar-feeling environment, which might explain its popularity. Frankly,
    you don''t have to switch to Mint to get it; you can do it yourself. To install
    Cinnamon (shown in Figure 9-26), you will have to add a repository to those already
    used by apt-get and the Ubuntu Software Manager, so you are branching out of the
    pur finer of the Ubuntu world, to speak. But if you want to give it a try, here''s
    how you do:


    +   1. Type sudo add-apt-repository ppa:gwendal-lehiban-dev/cinnamon-stable in
    your Terminal, and press ENTER. This adds the repository.

    2. Type your password when prompted and press ENTER.

    3. You will be asked if you want to continue with the process of adding the PPA
    or cancel. Press ENTER to continue (CTRL-C to cancel, just as it says in the Terminal).

    4. Once you are back at your user prompt, update the database, as you learned
    to do in Chapter 8, by typing sudo apt-get update and pressing ENTER. This process
    will take a minute or so.'
