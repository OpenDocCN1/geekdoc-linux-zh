- pgno: 87
  md: 'Select the connection by clicking it once and then Edit. Click the DSL tab
    of the Editing window that appears and enter your username and password into the
    appropriate fields. Then enter your connection information (usually a phone number)
    into the Service box and click Save. Now click the Network icon on the top panel
    and choose your DSL connection from the list. Network Manager will try to connect
