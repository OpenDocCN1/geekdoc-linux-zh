    # Project 8D: Compiling and Installing Programs from Source—Xmahjong


    Though it was more common in earlier days, compiling programs from source seems
    to be a phrase you still hear more in the Linux world than in any other. For the
    beginner, just the mention of compiling a program from source seems off-putting.
    The words compile and source seem to instill a sense of foreboding in the heart
    of the new user. That was certainly the case for me, anyway.


    You can live and prosper without ever bothering with anything or you can just
    install programs by means of the more convenient Ubuntu Software Center. Still,
    once in the Linux world, you are likely to come curious, especially if you move
    into the geekier side of the community.


    # What Is Source?


    To get started, it is probably a good idea to understand what source is so as
    to understand a bit about how a program actually metamorphoses from a primitive
    state on the programmer''s computer into an up-and-running application on your
    machine. First the programmer writes a program in programming language. You have
    probably heard of programming languages such as BASIC or C, and there are many
    others. The program actually writes with such a language is set of instructions
    called the source code, or source.


    Your computer, however, cannot understand any of that source on its own as if
    the computer speaks ancient Greek and the source is all written in French.


    The various languages that programmers use are called high-level languages—they
    are relatively easy for programmers to read. The computer, on the other hand,
    understands only low-level languages, which are quite difficult for most mortal
    programmers to deal with. To convert the high-level instructions into a low-level
    language, the computer needs some other program to translate. To put it another
    way, the computer needs an interpreter.


    If this translation takes place while a program is running, the translator is
    actually called an interpreter. Applications that run scripts, the PyWings and
    Briscola applications earlier in this chapter are examples of script applications.


    The problem with such scripts is that they can be slower than most of the applications
    you''re familiar with—the computer must run an interpreter, interpret the source
    code, and run the application all at the same time. This is like having a French
    book translated into Greek by a live interpreter; it is very slow indeed.'
  merge: -1
  img_proc: true
- pgno: 189
  md: 'As an alternative, most programs use a compiler instead of an interpreter.
    A compiler translates the high-level source code into low-level machine code,
    or object code, that the computer can understand before the application is run.
    Once this translation is done, the computer never has to bother with the high-level
    instructions each time it runs the program. This is like having a translated version
    of a foreign book that you can read any time you want. Because computers can run
    compiled programs without simultaneously using an interpreter, compiled programs
    faster than scripts. Most applications for all operating systems are, there-compiled.


    # The Basics


    The process of compiling an application from source and then installing it is
    basically straightforward—a truly "one, two, three" bit of presto change-o. Basically,
    after extracting the source code from an archived file (usually in the form of
    a tarball), you would use the following commands to accomplish the task:


    ```

    .configure To configure a makefile, which provides instructions for the make command

    make To translate the source code into object code that the computer can understand

    sudo make install To give yourself write privileges in protected folders and then
    install the application

    make clean To tidy up the leftovers once the process is complete (to clean up
    the mess)

    ```


    I know that sounds like a lot of commands, but as I always say, just doing it
    is easier than reading it on the page, so fear not.


    # 8D-1: Installing the Tools You Need


    Before doing anything else, you have to get your system ready to do what you are
    about to ask of it. Because Ubuntu is designed with the average computer in mind,
    it does not come with the various applications and libraries you need to compile
    applications from source. Fortunately, everything you need to get the job done
    is available via the Ubuntu Software Center. To get ready for the work at hand
    in this chapter (and many other jobs you are likely to do on your own in the future),
    perform searches for and install the following packages:


    +   - built-essential

    - libgtk2.0-dev


