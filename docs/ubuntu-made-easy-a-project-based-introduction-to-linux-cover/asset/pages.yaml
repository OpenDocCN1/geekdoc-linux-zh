    # Problems with the Display and Graphics Cards


    Recently, Ubuntu has been doing an excellent job of detecting graphics cards,
    so it''s unlikely that you''ll be left staring at a blank screen. Things aren''t
    guaranteed to turn out perfectly; this section covers problems as getting 3D acceleration
    support (if it''s missing) and adjusting your screen resolution (if it''s looking
    weird). Just in case, there''s something to help you with the dreaded blank screen
    too.


    # Games/Unity Doesn''t Work: Installing Accelerated Graphics Drivers


    If you can''t get Ubuntu''s swoosy default interface "Unity" to work or if a certain
    game doesn''t run, you might need to install some accelerated graphics drivers.
    This is because only basic drivers (which can''t handle effects and 3D) are installed
    for some graphics cards by default, due to the lack of availability of suitable
    open source alternatives. If accelerated drivers exist for your card, you can
    install more powerful (but less open source) by opening Hardware Drivers from
    the Dash, selecting the graphics from the list, and then clicking Activate to
    install. Once it''s installed, restart the computer, and the new driver should
    be enabled.


    You can directly download Linux graphics drivers from manufacturers. These tend
    to be updated more regularly than the ones that come with Ubuntu, and they may
    have some extra features too. The next couple of sections cover how to get these
    drivers from the two biggest manufacturers, ATI/AMD and NVIDIA.


    # ATI/AMD Cards


    +   1. Go to http://support.amd.com/us/gpudownload/Pages/index.aspx, answer the
    questions about which model of card you have, and then select Linux x86 from the
    list of operating systems (Step 4 on page).


    +   2. Click Display Results, and you''ll be taken to a download page for the
    driver. Click Download and, and when prompted, click Save File to download the
    driver.


    +   3. When the download finishes, the driver file. and its name should end with
    .run.


    +   4. Open a Terminal and use cd Downloads (followed by ENTER) to change to your
    Downloads folder (if it''s stored in there).


    +   5. Now type chmod + amd-driver*.run and press ENTER to make it possible to
    run the file as a program.'
