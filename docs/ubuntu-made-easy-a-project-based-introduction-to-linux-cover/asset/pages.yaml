    # Filters


    Working with hand lenses are *filters*. You can think of filters as fine-tuning
    devices—a spoon to a lens’s shovel, to speak. When you click a lens, you will
    see the words *Filter results* at the top right corner of Dash. If you click that,
    you will see a list of filters that can be added to further your search. For example,
    if you click the Applications lens and then click the Games filter, you will see
    the games installed on your system and suggestions for games available from the
    Ubuntu Software Center (Figure 3-14).


    ![](img/d35fa962e6f9664d66dc83916f426418_70_0.png)


    Figure 3-14: Results of the Applications lens with the Games filter in the Dash


    As you begin to see, filters are not restricted to categories of applications
    but depending on what the lens is, may select results by a number of other categories,
    such as Rating and Sources in the Applications lens. A look at the filters available
    for the Music lens reveals a number of different filter types (Figure 3-15), while
    for the Videos lens consist entirely of online video sources.


    Another interesting thing about filters is that you are not limited to just one.
    You can select a number of different filters at the same time to narrow down your
    results even more.'
