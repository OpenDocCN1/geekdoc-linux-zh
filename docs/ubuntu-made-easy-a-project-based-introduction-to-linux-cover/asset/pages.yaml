- pgno: 200
  md: '# Installing Additional Wallpapers


    The default wallpaper in Ubuntu is called Ambiance. If the purple world of Ambiance
    is not your thing, click any of the other wallpapers to immediately make a change.
    There are quite a few to choose from, maybe you''d prefer to use some images of
    your own. These could be photos from a digital camera, works of art you created
    on your computer, or just about anything you want to put there.


    If you are going to venture onto the Web, a number of sites provide free desktop
    wallpaper. Two sites specifically geared toward Linux users at http://www.gnome-look.org/
    and http://art.gnome.org/, but you can get wallpaper from wherever you like. Astronomy
    Picture of the Day (http://apod.nasa.gov/apod/astro.html) is a particular favorite
    of mine. Many companies sell (cars, sodas, guitars, you name!) have wallpapers
    available as.


    Once you''ve downloaded your wallpaper, move it to Downloads folder into your
    Pictures folder (You may want to create a Wall subfolder to keep things better
    organized, up to you.) After that, you can install the new image by clicking the
    + button right below the wallpapers pane in the Appearance window. In the window
    that appears, navigate to your new wallpaper, click it once to highlight it, and
    then click Open. The wallpaper will appear highlighted in the Appearance window
    and appear on the desktop within seconds.


    Once the wallpaper shows up, you can adjust how it appears on the desktop with
    the drop-down menu just to the left of the + button in the Appearance window.
    Your choices are Tile, Zoom, Center, Scale, Fill, and Span. Try them all to see
    which works best for the image you''ve selected. Once done, click Close to complete
    the process.


    # Wallpaper from Internet to Desktop—Quick and Easy


    It''s also possible to automatically set your desktop wallpaper from the Web by
    right-clicking the image within your web browser and then selecting Set As Desktop
    Background. A small window will appear in which you can preview what the download
    will look like onscreen (Figure 9-5).


    ![](img/d35fa962e6f9664d66dc83916f426418_200_0.png)


    Figure 9-5: Selecting web page images as desktop wallpapers'
  merge: -1
  img_proc: true
- pgno: 201
  md: 'You can also adjust the position (tiled or centered, for example) and background
    color for your desktop in this window. Once you''re making adjustments, click
    the Set Desktop Background button. The image will appear on your desktop, while
    the file will be saved to a download location (your Home folder, by default) with
    the title Firefox_wallpaper.png.


    # Changing Themes


    Before leaving the Appearance window, it''s worth mentioning a few customizations
    you can perform from this window. The first can be accomplished directly from
    the Wallpapers pane. You will see a drop-menu button that says Ambiance, which
    is the name of the default Ubuntu theme. If you click that button, you will see
    there are also three more themes: Radiance, High Contrast, and High Contrast Inverse.
    Slim picks to be sure, but interesting enough. To see the effects, just try each
    of them, and within a few seconds you will see how they look. If you like what
    you see, you can just close the window.


    # Changing Your Launcher Icon Size (Unity 3D Only)


    Another customization you can perform is to the size of the icons in the Launcher.
    If you look at the bottom portion of the window, you can see a slider that allows
    you to change the size of these. The default size for the Launcher icons is 48x48,
    but you can shrink them to a very manageable 36x36 or puff up to 60x60. Just move
    the slider, and the icons will change size. When you are satisfied, close the
    Appearance window.


    # Autohiding the Launcher


    There is one more customization you can perform from the Appearance window—autohiding
    the Launcher and setting the desktop hotspot you will use to make it appear again
    when you want it. To do this, click the Behavior tab. In the Behavior tab, switch
    on the on/off switch in the top right corner of the window, select the slider
    at the hotspot you want to reveal that hotspot to be. I would recommend choosing
    Left side and making the sensitivity rather high, because getting the Launcher
    to pop out of hiding can take some getting used to; the process doesn''t have
    the same smooth feel as you might used to in Windows or Mac. You kind of have
    to whack the cursor against the left side of the screen and then draw away gently.
    Well, you''ll get the hang of it, and when you do, you''ll find it works fine.


    # Stretching Desktop Icons


    One more feature in your desktop environment is worth noting—stretchable icons.
    You can make individual desktop icons any size you want, which can be aesthetically
    pleasing. For example, you might stretch the thumbnail of a photo file so that
    it appears as desktop art or of a folder file so that it is easy to find and open
    (see Figure 9-7).'
