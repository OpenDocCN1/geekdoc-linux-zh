    command path. Just as you did for pyWings, you will now create a launchable link
    for Briscola to solve that problem. Here are the steps:


    +   1. In the Terminal, cd /usr/games and press ENTER.


    +   2. Now create the link by typing sudo ln -s /usr/share/games/briscola/briscola.tk
    briscola and pressing ENTER.


    +   3. Type cd and press ENTER to return the Terminal to your Home folder.


    You can easily run Briscola by typing Briscola in the Terminal and pressing ENTER.


    # Can You Do the Same Thing with pyWings?


    Sure. If you want to move pyWings to a global location, just follow the procedure
    for moving the pywings folder and creating the link as you did for Briscola, making
    the necessary substitutions, of course. You will have to remove the previously
    created pyWings link, though, by typing the following command and pressing ENTER:


    ```

    sudo rm /usr/games/pywings

    ```


    After that, move the pywings folder to global territory by typing sudo mv ~/LocalApps/usr/share/games/pywings
    and pressing ENTER. When prompted for your password, type it and press ENTER.
    You can then create the launchable link by typing cd /usr/games, pressing ENTER,
    typing sudo ln -s /usr/share/games/pywings/pywings.py pywings, and pressing ENTER
    once more.


    # Playing Briscola


    As already mentioned, Briscola is easy—as easy as a card game as there is. It
    is a trick-taking game, which means you put out a card and then your opponent
    puts out a card, and the one who puts the highest-value card wins the trick. Points
    are awarded on the basis of the cards involved in that trick. The winner of the
    trick then goes on the next trick, meaning that the winner puts his or her card
    the next time around. When all the cards are played, the points for each player
    are tallied, and the player with the higher points wins. It''s much simpler to
    describe it.


