    # Setting Up a Dial-up Connection


    Much of the world is moving to high-speed Internet connections, you may still
    be using a dial-up Internet connection, which means you need to have a traditional
    dial-up modem to reach your box to the outside world. In case broadband surf-gods
    have forgotten, modems are those wonderful machines that whistle, chime, screech,
    and spit whenever you use your Internet provider. I suppose you could think of
    them as noisy phones in a world of good


    Now comes the bad news—in the world of Linux, very few internet modems are supported,
    and for those the process becomes frustrating. The main reason behind this compatibility
    problem is that most are software dependent and the software they depend on is
    part of, or designed for, Windows. Such modems are called Winmodems.


    Of course, the Linux community has been working on ways to deal with these Winmodem
    beasts so that they will work with Linux systems. Though support for the wide
    variety of Winmodem modems out there is still spotty, things are better than before,
    so you might luck out. My advice is to hold off on the wondering and worrying
    and give your modem a try to see whether it works. If it does, then you''re all
    set. If it doesn''t, well, you have some options, and at least you haven''t done
    anything to your system.


    With all that intro-babble out of the way, let''s get down to the steps for setting
    up your dial-up connection. First, get the settings information from your Internet
    provider. Most providers aim their operations at Windows and, often, Mac users,
    and very few offer support. Still, there is no technical reason for your Linux
    system not to work with their setups, so just nag and push until they give you
    the information you want. After, make sure your modem is connected to a live telephone
    connection—for example, the phone jack in your wall.


    Now it''s time to set up the connection. If you use the GNOME PPP program to do
    all of the setting up here, there''s a caveat: it''s not installed by default,
    and you need an Internet connection to install it! If you have access to some
    other Internet connection that you can use temporarily, connect to and use the
    Ubuntu Server to download and install GNOME PPP (see Chapter 6 to learn how to
    install software). The alternative is to use ppconfig command, which is installed
    by default but difficult to use. Find another computer and check out https://help.ubuntu.com/community/DialupModemHowto/SetUpDialer/
    for instructions if you have no alternative but to use ppconfig.'
  merge: -1
  img_proc: true
- pgno: 88
  md: 'Assuming that you got GNOME PPP installed using a borrowed Internet connection,
    you can follow these steps to set up your modem:


    +   1. Open the Dash, search for GNOME PPP, and click to open it.

    2. Click Setup and make you''re looking at the Modem tab.

    3. Click the Detect button to identify your modem. If you get a message saying
    that no modem was found on your system, you''re out of luck—the best you can do
    is ask for advice on the Ubuntu forums (https://www.ubuntuforums.org/) or try
    selecting items from the Device list by trial and error.

    4. How you choose the rest of the settings depends on how your modem and ISP are
    set up, select the defaults for now. If they don''t work, trial and error is a
    potential way forward again.

    5. Click Close to get back to the GNOME PPP window. Type your username and password
    and enter the phone number provided by your ISP.

    6. Click Connect. You should hear your begin begin dialing, spitting, and churning
    sequence as it makes the connection with your provider.

    7. If you manage to get connected, you can start your browsing, or whatever else
    you do online. If you get an error message, there''s little you can do but take
    a deep breath and click the Setup button to tweak your settings.


    # What to Do If Your Modem Isn''t Compatible


    Though it may sound that way, what I''ve just described is pretty much a best-case
    scenario. What happens, however, if your modem and Ubuntu do not see eye to eye?
    Well, there are a few options. My, first radical suggestion is to dump your dial-up
    ISP and find a broadband provider that covers your local area. If that is not
    an option, then you have two ways to go. One is to try get around with your modem
    to see whether you get it to work. This is a slightly complicated process, but
    there are instructions at https://help.ubuntu.com/community/DialupModemHow/. If
    you are of heart or a novice user, you may find the process to entail a bit more
    than what you''re willing to deal with.


    The simpler, although costly, way to get your modem to work is to chase a hardware
    modem. Hardware modems are not software defined, so they work with any operating
    system. You can think of them as telephones without a headset.


    Some might come in two forms: internal and external. For the internals, the USRobotics
    modems 56K V.92 Performance Pro Modem (internal slot) and 56 PC Card Modem (PC
    card slot, for laptops) are true hardware modems that are easily available and
    ready to work. You can check out the USRobotics site (http://www.usr.com/) for
    more information on these models, though checking the Ubuntu for suggestions is
    always a good idea. Perhaps the safest of all solutions is to buy an external
    dial-up modem.'
  merge: -1
  img_proc: true
- pgno: 89
  md: 'They come with either serial or USB connectors and sit in a box outside your
    computer. They bring the advantage of not requiring you to open up the computer
    to install them.


    Linux support for USB modems can be patchy, so do your research before buying
    one. Serial modems are a safer bet since most of them should work with your system
    . . . if you have a serial port, that is. Modern computers rarely have them, so
    to check whether you have one by looking at the back of your computer for a connector
    with little prongs in it (see Figure 4-7). If you are worried and are looking
    for a certain thing, USRobotics makes an external serial modem that is compatible
    with Linux, and the company says right on its website.


    If you find another model that you will do the trick, before you commit to it
    slashing down the cash, a Yahoo! or Google search on that modem make and model
    number, along with the word linux, and see what results you get. Of course, you
    can try one of the Linux forums and ask about the modem make and model there.
    A lot of people are in the same boat, so you are sure to get plenty of opinions
    and advice.


    ![](img/d35fa962e6f9664d66dc83916f426418_89_0.png)


    Figure 4-7: Serial port and connector


    # Mobile Broadband Connections


    Wireless networks, for all the convenience and freedom that they offer, have quite
    a limited range. This won''t be an issue if your computer strays from the general
    vicinity of your house or office, but it can get inconvenient if you''re on the
    road, miles from the nearest wireless-enabled coffee shop. Being the 21st century,
    there are, of course, ways around this limitation.


    If you''re a computer-equipped traveler, you''ve probably already come across
    mobile broadband technology, also known as 3G (which has been upgraded to 4G in
    some places). All you need to get a high-speed connection'
  merge: -1
  img_proc: true
- pgno: 90
  md: 'on the go is a 3G or 4G card (also inexplicably called a dongle), which plugs
    into your computer and connects you to the Net via a cell phone network (Figure
    4-8).


    ![](img/d35fa962e6f9664d66dc83916f426418_90_0.png)


    Figure 4-8: A 3G mobile broadband card


    Ubuntu has pretty good support for most 3G cards right from the get-go, and the
    setup process is a snap (the process is the same for 4G cards):


    +   Plug your 3G card or dongle into the computer; the New Broadband Connection
    wizard should open automatically. If it doesn''t, click the Network icon on the
    top panel, select **Edit Connections** from the menu that appears, open the **Mobile
    Broadband** tab, and click **Add**.


    +   The first page of the wizard has a drop-down list that should have the make
    and model of your 3G card displayed in it. If it says *Any Device* instead, your
