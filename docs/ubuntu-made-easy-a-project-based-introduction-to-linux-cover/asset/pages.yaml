    # 13B-3: Organizing Your Photo Collections with Tags


    As your photo collection grows and grows, it can get tough to sort things out
    and find exactly what you need. Frankly, Shotwell can make this a bit easier through
    the use of tags. Tags are categories that you create and then apply to whatever
    images you want in order to organize your collection thematically. You might,
    for example, create tags for each of your family members, or just create a broader
    tag for Family. You could create tags for cities and countries you''ve visited,
    providing categories and subcategories for your travel pics. The choices and combinations
    are endless, and you can decide what they are all. Once you''ve applied these
    tags to your photos, narrowing your photo searches will be much easier.


    The first step is to create few tags. This is easily done by right-clicking an
    image and selecting Add Tags in the pop-up menu. A small window will appear in
    which you can just type a single tag, or kill two birds with one stone, whatever
    tags you want to assign to the photo (Figure 13-9). Just be sure to separate each
    tag with a comma. Once you''re done, click OK, after which the tags will appear
    both under the thumbnail and in the left pane of the window.


    ![](img/d35fa962e6f9664d66dc83916f426418_273_0.png)


    Figure 13-9: Creating tags in Shotwell


    Once you have tags in the left pane of the Shotwell window, adding tags to other
    photos is a cinch. Drag a thumbnail to one of the tags and release your mouse
    button, the image will be tagged. If you want to add a second tag, drag the thumbnail
    to that as well. Once you are done tagging your images, they will be far easier
    to sort, as you can see in Figure 13-10.'
