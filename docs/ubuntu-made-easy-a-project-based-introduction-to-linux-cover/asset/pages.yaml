    # # A Few Other Graphics Apps to Consider


    In addition to the graphics applications that come bundled with Ubuntu, still
    more are available. You can grab all of them via the Ubuntu Software Center. Although
    you could experiment with what''s available, I will point out a few worth noting.
    If nothing else, these applications will give you an idea of the breadth of stuff
    out there waiting for you.


    # ## RawTherape


    RawTherapee is not some solution for what ills your troubled soul but rather handy
    application that allows you to manipulate RAW image files. RAW image files are
    images that have not been processed by the on-board software in your camera that
    converts the data it receives from the sensor into a format that your computer
    is able to deal with (usually JPEG files). For most people, JPEG works just fine,
    but many photographers want to have the best quality results after making adjustments
    to their images on their computers save their files in RAW image format, or RAW
    mode. While not all cameras have the option to save files in RAW mode, many advanced
    amateur and professional camera models do.\ Once you load RAW image files onto
    your computer, the thumbnails for those files will appear as black rectangles.
    That''s essentially blobs of raw data that neither your computer on its own can
    make heads or tails of. In a sense, they are a digital equivalent of photo negatives.'
  merge: -1
  img_proc: true
- pgno: 275
  md: 'This is where RawTherapy comes in (see Figure 13-11). Once you open your RAW
    files with RawTherapy, you will be able to see what they actually look like and
