    The next step is sort of a setup phase that the configure script in xmahjongg-3.7
    folder checks what files, compilers, and other things it needs, and then searches
    your computer to see whether those things are there and, if so, Based on this
    information, it writes a file called amakefile, which is a set of instructions
    that will tell the `make` command in the subsequent step how to set things up
    specifically for your system configuration.


    +   2. Configure the program by typing `./configure` and pressing ENTER.

    While you are running configure, you will see lots of and mysterious things flowing
    through your Terminal window; this is essentially a running account of what is
    going on, every step of the way. This can take


