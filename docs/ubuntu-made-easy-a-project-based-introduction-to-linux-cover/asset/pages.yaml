  img_proc: true
- pgno: 141
  md: '![](img/d35fa962e6f9664d66dc83916f426418_141_0.png)


    Figure 7-5: Typing the path to your target folder


    # ##Bookmarks Within Nautilus


    With all clicking away to deeply buried subfolders, it is worth mentioning another
    very handy feature of Nautilus: Yes, Nautilus lets you bookmark folders to which
    you have navigated. Although you are probably familiar with creating bookmarks
    for web pages that you navigate frequent, you may be wondering why on Earth you
    would need to create bookmarks within your filesystem.


    Well, imagine that you have a folder you need to use often, but it is even more
    buried than your *gooseberries* folder in the previous section. Getting there
    would take an excessive number of mouse clicks, and all that clicking is bound
    to eventually give you a bad case of carpal tunnel syndrome. Although that is
    great for your doctor, it is not decidedly good for you. Instead of imagining
    yourself, you could click your way to that folder and then, in the Nautilus window,
    select **Bookmarks > Add Bookmark**. After that, whenever you want to get back
    to that folder, you can click the **Bookmarks** menu, and the folder will be right
    waiting for you in the drop-down list.


    Another thing about Nautilus bookmarks is that they also appear in Save As dialog,
    as when you save a LibreOffice document or download a file via Firefox. To find
    it in any such Save As dialog, just find your bookmark in the list on the left-hand
    side.


    # ##Understanding the Linux Filesystem


    With all that typing, navigating, and bookmarking you have just learned, you should
    pretty be much able to figure out how to get from here to your Home folder. Still,
    it''s probably a good idea to know where your Home folder actually is in the scheme
    of things, just in case you manage to get your yourself really lost someday. To
    understand this, you should have a basic understanding of the Linux filesystem,
    which, as you will find, is a bit different from what you were accustomed to in
    your previous operating system.


    Chapter 7'
  merge: -1
  img_proc: true
- pgno: 142
  md: 'Unlike Windows, the Linux filesystem all stems from a single point called root
    and is represented by a solitary forward slash (/). Your own account folder is
    located within a subfolder of root called home. This is represented as /home/,
    to put it into words, the Home folder within root. If your user account were to
    have the same name as mine, ng, the path to that folder would be /home/ng, or
    the ng folder within home within root. Whatever the name of your user account
    or the name of any other accounts you have on your machine happen to be, just
    remember that when you are lost, your folder and those of all the other folks
    with user accounts on your machine are located within the Home folder. If you''re
    a more graphically oriented person, the map in Figure 7-6 should help you.


    ![](img/d35fa962e6f9664d66dc83916f426418_142_0.png)


    Figure 7-6: The location of your users'' folders within the Linux filesystem


    # # What''s in All Other Folders?


    Needless to say, there is more to the Linux filesystem than the root, Home, and
    user account folders. Several other directories appear at the same level as Home,
    though for the most part, you shouldn''t be mucking around with them unless you
    know what you''re doing. Frankly, most of these folders are write protected, so
    you should be well protected from yourself. Still, it is natural to be curious
    about what other folders are there for, since ... well, they are there. So, to
    satisfy your curiosity a bit, I''ll do a little explaining.

    in Ubuntu, four folders contain most of the applications on your system. The essential
    elements of your system are located in /sbin. Other elements that need to be there
    such as commands and the like, which may not be used, are located in /bin. Most
    of the applications that you actually think'
  merge: -1
  img_proc: true
- pgno: 143
  md: 'of applications and in hands-on way are located in /usr. Finally, some add-on
    applications, as RealPlayer, install themselves into /opt.


    Three other top-level folders that might be of interest to you are /etc, /lib,
    and /media. The first of these, /etc, is the location of all configuration files
    on your system. The second, /lib, is the home of all the libraries that are required
    by your system or applications installed on it. These libraries are the Linux
    equivalent of a Windows .dll file. Finally, /media is the contents of your various
    attached media (as as USB drives and CDs) appear when present.


    There are other top-level folders, but these are a bit straightforward for the
    average Nautilus newbie, and to be honest, probably no reason for you to be mucking
    around with any of these folders for the time being, Anyway, as I mentioned, there
    is no reason to be worried, because you can access the items located within them
    in different, and safe ways.


    # Nautilus as a Network Browser


    Another handy, for example, see what networks and shares are available to you
    in your home or office by clicking Browse Network in the Network section in the
    sidebar of the Nautilus window or going to the Menu and selecting Network. Icons
    for any networks or computers on that network would appear in the Nautilus window,
    as in Figure 7-7. From that window, you can double-click your way to a share that
    you have permission to access, such as the Shared Documents folder of a Mac. In
    case you are wondering what a share is, I''ll clear that up for you: A network
    share is a location on a computer, such as a folder, where other users on a network
    can access and save files. The Shared Documents folder on a Windows system is
    a good example. Other users on a network can copy files from and (and usually)
    write files to the Shared Documents folder, whereas they cannot access any other
    part of the filesystem on that host computer.


    ![](img/d35fa962e6f9664d66dc83916f426418_143_0.png)


    Figure 7-7: Viewing the computers on your network'
  merge: -1
  img_proc: true
- pgno: 144
  md: 'If the share you are trying to open requires a username and password, you will
    be asked for those in a new window. Note that, in this case, the username and
    password you need to enter for the computer to which you are trying to connect—not
    the ones you''re using in Ubuntu (unless the usernames/passwords happen to be
    the same, of course). You can then copy files to and from that share as if it
    were a folder on your hard disk.


    In some cases, especially when trying to access shares on a Mac running OS X,
    the double-click method may not work. You will not be able to access any share
    on a particular machine, even if an icon for that machine appears in the Nautilus.
    In such cases, double-click the icon for the machine you are trying to access
    and then, once it''s open (to an empty window), select **Go ▶ Location**. A text
    box will appear in the location bar (just as in Figure 7-5) with the location
    of the machine you are trying to access already.


    To that location, add a forward slash (/) followed by the username used on the
    target machine. If the target machine is called cowboys the location would be
    `smb://cowboys/newtoy`. You can also narrow down to a folder after that, by adding
    to the path you''ve already typed—`smb://cowboys/newtoy/Documents`, for example.
    If you prefer, you can type `smb://[Mac''s IP address]` which consists of a set
    of four numbers separated by dots. In the case of one of my machines, you will
    type `smb://192.168.0.100`. (You can find a Mac''s IP address by going to the
    Mac''s System Preferences, clicking **Sharing**, and then clicking **Windows Sharing**.
    The address should appear immediately before the selection pane.)


    NOTE In you are wondering, the *smb* at start of path stands for server message
    block, but to make things easier (and perhaps more useful in terms of your memory),
    you can just think of it as being short for Samba, which is software used by Unix-based
    systems (such as Linux and Mac OS X) in order to interact with Windows networks.


    Once you''ve made your way to the folder you want to browse on the networked machine
    you''ve connected to, it might be a good idea to use the bookmark function in
    Nautilus to bookmark that open window. You can then easily access that share in
    the future by choosing the share''s name in the Nautilus Bookmarks menu. Pretty
    cool, no?


    # Using Nautilus as an FTP Client


    Not only does Nautilus allow you to browse and mount shares on local networks,
    but it can also act as a File Transfer Protocol (FTP) client. FTP is used, for
    example, when you want to change the files for your website on a remote server.
    To do this, go to the Server **Go ▶ Connect to Server** and then select FTP (with
    login) for the service type. Type the information provided by your website and
    click **Connect**. An FTP Network Share icon will appear in the sidebar. Click
    that icon, type your password (for that account—not the one for your Ubuntu system,
    unless it happens to be the same) when prompted to do so, and you will be able
    to view and add to the files you have here.'
  merge: -1
  img_proc: true
- pgno: 145
  md: '# File and Folder Permissions Within Nautilus


    As you make your way in the world of Ubuntu, you will find that occasionally you''ll
    come across files or folders that are in some locked in terms of your being able
    to read them, alter them, or both. This readability and alterability states are
    referred to as permissions.


    Now, you may be wondering what the point of this permissions business is, so I
    will give you some examples of how it can be useful. Let''s say you have some
    files that you don''t want your or kids to see—some poetry or a Christmas shopping
    list, for example. By denying read permission to those files or to a folder containing
    those files, you keep anyone else from sneaking a peek unless that is savvy at
    changing permissions and the permissions necessary to change permissions for those
    files or folders.


    As another example, imagine you have a file that you have worked many hours on
    and finally completed. To alleviate fears that you might accidentally ruin that
    file in some way, you could deny your write permission. By doing this, you wouldn''t
    be able to save any changes to that file. The Save As option so that you could
    save a new copy of the file, but if you wanted to change the original file, you
    would have to change the permissions. When you place restrictions on a file or
    folder, the lock emblem appears on the icon for it, as shown in Figure 7-8.


    ![](img/d35fa962e6f9664d66dc83916f426418_145_0.png)


    > Figure 7-8: Nautilus tells you when permissions restrict your freedom of movement.


    # Changing File and Folder Permissions in Nautilus


    To change file or folder permissions in Nautilus, right-click the file or folder
    in question and select Properties from the pop-up menu. Once the Properties window
    opens, click the Permissions tab, and you will see the owner of the file or folder
    is and what you and others are allowed or not to do with it. As you can see in
    Figure 7-9, the options for folders and files are slightly different.


    You might find this permissions business bit confusing, but it is really quite
    simple. Permissions can be granted or denied to the owner of the file or folder
    (you), to a specified group, or to others (everybody). Traditionally, these permissions
    are referred to as:


    +   - Permission to view the contents of a file or folder

    - Permission to alter the contents of a file or folder

    - Permission to run a program or script (or, for folders, to browse the files
    in the folder)


    Nautilus has tried to spell things out a bit more, as you can see in Figure 7-9.
    In general, however, you needn''t worry all much about setting permissions for
    your own files, because you are the only one who has access to your user account.
    One possible exception which you might run into when you transfer files from CD
    to your hard disk. In this case, the files might be protected, meaning you cannot
    alter the files until you change the'
  merge: -1
  img_proc: true
- pgno: 146
  md: 'permissions for them. You can change the permissions of such files in order
    to allow yourself to alter them by going to the Owner section of the Properties
    window and selecting Read and write in the menu next to the word Access (for files)
    or Create and delete files in the menu next to the words File access (for folders).
    Once you are done, click the Close button, and you will be on your way.


    ![](img/d35fa962e6f9664d66dc83916f426418_146_0.png)


    Figure 7-9: Changing permissions in a Nautilus Properties window for files [left]
    and folders [right]


    # Keeping Your Home Folder Private


    Another exception to my you-don''t-need-to-worry-about-permissions claim, and
    a potentially important one is that, the state of permissions of your Home folder,
    particularly when other people use your accounts on your computer. In Nautilus,
    when someone logs in his own account on your computer, he can click his way to
    your user folder and view its contents.


    To remedy this situation—and thus protect the sanctity of your Home folder, the
    privacy of its contents, and the peace of mind of its owner (you)—you can change
    the permissions of your Home folder. Here''s what you need to do:


    +   Open a Nautilus window and then click File System in the sidebar. The contents
    of your entire hard disk will appear in the right pane of the Nautilus window.


    +   Look for and double-click the folder named home. When the contents of the
    Home folder you just clicked in the right pane, there should be only one folder
    there—your own folder, which will have the same name as your username. For example,
    mine, as I mentioned earlier, is named rg.'
  merge: -1
  img_proc: true
