- pgno: 404
  md: '# IRC Etiquette


    There are rules and social norms to follow on IRC just as there are anywhere else.
    It goes without saying that you shouldn''t go out of your way to offend or harass
    anyone, just as you wouldn''t in the “real world.\ Here are a few subtle conventions
    that you should also be aware of:


    +   **Don''t shout.** Writing in ALL CAPS is the IRC equivalent of shouting all
    the time. There''s a special place of hell for shouters; this is pretty everyone''s
    pet peeve, and you''re bound to get censured for doing it.


    +   **Say things only once.** Sometimes you won''t get a reply for a while, so
    it can be tempting to keep repeating the same message until someone acknowledges
    it. Repeating yourself too many times is also considered annoying. Being patient
    is a necessary skill on IRC because people tend to dip in out of chats sporadically
    rather than watching all the time. It''s okay to repeat your message if you don''t
    get a reply after 10 minutes or so, though.


    +   **Don''t send loads of text.** Sending more than a few lines of text at once
    is flooding. It you should avoid doing it. If you have lots of text that you want
    people to read, use a service like http://pastebin.com/ to hold the text and simply
    post a link to it on IRC.


    +   **Stay on topic.** There are different channels for purposes, so you should
    try to stick to the topic for which a particular channel is intended. Advertising
    is considered to be off-topic in most channels and is particularly frowned upon.


    +   **Smile for the camera.** Most of the conversations in the public Ubuntu chat
    rooms are logged and can be viewed at http://irlogs.ubuntu.com/. This is useful
    if you forget a link that someone mentioned last week, but it can be awkward if
    you said something that you shouldn''t have. As a general rule, never post any
    sensitive or personal information on IRC (especially your password or credit card
    details), because it could come back to bite you.


    # More Help with IRC


    I hope this expedition into IRC hasn''t put you off for life! Lots of people find
    it confusing at first, but it''s a really great way to talk to other Ubuntu users
    you''re comfortable with. If you feel need to hone your IRC skills, the IRC Help
    website at http://www.irhelp.org/ is a very useful resource. And if that still
    doesn''t get you into the IRC vibe, you can try a more familiar web interface
    to the Ubuntu IRC channel, which can be found at http://webchat-reenode.net/?channels=ubuntu.'
  merge: -1
  img_proc: true
- pgno: 405
  md: '# An IRC Alternative: Mailing Lists


    If the whole idea of IRC chat has you tearing your hair out, another gentler option
    is available in the form of the support mailing lists. All you need to do is send
    an email to the appropriate list and hope for a reply. Visit https:// lists.ubuntu.com/
    to see your options—the ubuntu-users list is probably the one you want.


    # Keeping Up with the News


    If you want to find out what’s going on in Ubuntu-land, there’s no shortage of
    news outlets. Here are just a few them (you’ll also find additional resources
    in Appendix D):


    **Full Circle Magazine**(http://fullcirclemagazine.org/) Full Circle is independently
    produced Ubuntu magazine that is free to download in PDF (you can also get it
    from the Ubuntu Software Center). It contains everything you might expect to find
    in a traditional dead-tree magazine, such as reviews, interviews, stories from
    readers, and how-to guides.


    **Ubuntu Weekly Newsletter**(https://wiki.ubuntu.com/UbuntuWeeklyNewsletter/)
    This newsletter aims to provide an overview of the goes-on in the community each
    week and typically includes Ubuntu news stories, interviews with developers, and
    updates on recent changes to software. It’s pitched to the geekier end of the
    spectrum.


    **The Fridge**(http://fridge.ubuntu.com/) The Fridge is a place where community
    can stick notes and updates on upcoming events. Interviews are sometimes posted
    here.


    **Planet Ubuntu**(http://planet.ubuntu.com/) This is where you can read the personal
    blogs of Ubuntu developers. Some of the posts are technical, but if you’re interested
    in cutting-edge developments, this is the place to go.


    News and opinion get passed around microblogging services too. Subscribe to the
    #ubuntu hashtag on Twitter or join the Ubuntu group on Identity.ca (http://identi.ca/group/ubuntu/)
    to join in the tweeting, denting, or whatever you want to call it.


    # LoCos and Lugs


    So far, the whole Ubuntu community thing might seem a bit, well, virtual to you.
    Why shouldn’t it? Ubuntu is a very international venture, and communicating online
    is the most practical way of getting things done. Regardless, there are plenty
    of opportunities to contact and meet other Ubuntu users in your area through Local
    Community (LoCo) teams and Linux User Groups (LUGs). These groups often have a
    membership with diverse computing skills, so they could be a good place to get
    help with Linux, among other things.'
  merge: -1
  img_proc: true
- pgno: 406
  md: 'LoCos tend to cover large geographic areas, normally on the scale of whole
    countries or states. As such, they tend to meet in less regularly, although many
    LoCos-related events throughout the year, including "launch parties" around the
    time of each Ubuntu release. You can find a list of LoCo teams at http://loco.ubuntu.com/teams/.
    Lugs are much more widespread than LoCos and tend to put a greater emphasis on
    meeting up. Typically, a LUG will hold regular meetings in a local community center
    (a pub, if you''re lucky) and might organize talks or other Linux-related activities.
    The best way to find your nearest LUG is to use Google.


    # Stickers and Other Goodies


    If you have a penchant for showing off your Ubuntu addiction, you''re in luck!
    Free stickers are available from Ubuntu-friendly computer manufacturer system76,
    and they''re just great for replacing the unsightly Windows logo that you probably
    have hiding somewhere on your computer''s case (see Figure 21-13). To order, browse
    to https://www.system76.com/community/stickers/ and send a stamped, addressed
    envelope to the relevant address on that page. No club would be complete without
    a membership badge, would?


    ![](img/d35fa962e6f9664d66dc83916f426418_406_0.png)


    Figure 21-13: My laptop, complete with Ubuntu sticker (I couldn''t remove the
    Windows one)


    If stickers leave you cold, other Ubuntu-branded goodies (mugs, T-shirts, backpacks
    . . . you name it) are available for purchase through the Canonical store (http://shop.canonical.com/).'
  merge: -1
  img_proc: true
- pgno: 407
  md: '# Getting Involved


    Lots of people enjoy being part of the Ubuntu community and want to give something
    back by volunteering to help. Reporting bugs is a great way to make a contribution,
    but that''s only the start of it!


    If you talk to existing contributors, you''ll soon see that everyone''s story
    is different. I stumbled into contributing to Ubuntu in early 2006, when I started
    tidying up some bug reports that were missing information. It was something to
    pass the time and took up half an hour per day. This was when Launchpad was new
    and all the bugs were being transferred from the system, the work was pretty fun.
    The members of the Bug Squad were incredibly encouraging, and soon I found myself
    spending more and more time doing Ubuntu stuff. As time went on, I started editing
    pages on the wiki (https://help.ubuntu.com/community/) and eventually found my
    way to the Documentation Team, where I coauthored a guide on switching Windows
    to Ubuntu. Now I''m one of the maintainers of the “upstream” help files at the
    GNOME project, among other things. Being a contributor has been a great experience—I''ve
    met tons of interesting people, indulged my interests in writing and computers,
    traveled to conferences around the world, and, most importantly, had tons of fun
    in the process.


    Browse to https://www.ubuntu.com/community/ to get some ideas how you might be
    able to help. You don''t need to be a geek to get involved: Artists, writers,
    multilingualists, marketers ... the list of ways to participate goes on. You might
    even like to attend a conference and have as much fun as the contributors in Figure
    21-4! To start, all you need to do is join the relevant team and introduce yourself
    on its mailing list. If you are interested, one thing in particular that you should
    look out for is Ubuntu Open Week, or check https://wiki.ubuntu.com/UbuntuOpenWeek
    to see when the next one will be.


    # Ubuntu Accomplishments


    If you''re not sure how to get involved, or whether involved is the right thing
    for the first place, you might like to try out a new app called Ubuntu Accomplishments
    (Figure 21-15). Intended to help you find a way to get involved with Ubuntu, it
    works a bit like a game. You start out completing one or two relatively simple
    community-oriented tasks, like getting a Launchpad account (as you already learned
    how to do) in “Passport to the Ubuntu Community”. For each task complete, you''re
    awarded a trophy (a digital one, don''t expect any engraved plaques through the
    mail), so you can flaunt your achievements. As you earn more trophies, other “levels”
    are unlocked, giving you access to more tasks that can earn you more trophies.
    Each task comes with instructions on how to complete it, so you learn how work
    as you go. In the process, you explore the Ubuntu community, contribute to a little,
    and have some fun at the same time. And even if you ultimately decide that Ubuntu
    isn''t your cup of tea, you''ll be left with a trophy or two for your troubles.'
  merge: -1
  img_proc: true
