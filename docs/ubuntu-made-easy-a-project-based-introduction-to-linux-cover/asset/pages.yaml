- pgno: 219
  md: 'If you have a printer that plugs into your computer''s parallel port, auto-detection
    and setup should also work if the printer was connected when you turned on the
    computer. If it was not, shut down your system and turn your computer off, connect
    your printer to the computer, and then start your printer again. With luck, your
    printer should be recognized and set up automatically this time around. You can
    also try this approach with a USB printer that was not recognized initially.


    # Manually Configuring Printers


    If your printer isn''t automatically recognized, you can still set things up manually.
    I''m assuming you have a printer that connects to your computer with a cable of
    some description, either USB or parallel. If you have a wireless-enabled printer,
    or one that''s connected to your local network, skip to one of the next two sections
    for instructions. But for the cable-enabled among you, here''s what you need to
    do:


    +   Click the power button on the top panel and select Printers from the menu
    that appears. Either a Printing window will appear, showing the printers that
    have already been recognized, or a message will tell you that no printers have
    been configured.


    +   Click the Add button, after which the system will show any new finds in a
    New Printer window (Figure 10-3).


    ![](img/d35fa962e6f9664d66dc83916f426418_219_0.png)


    Figure 10-3: Setting up a printer manually'
  merge: -1
  img_proc: true
- pgno: 220
  md: '+   3. Click the entry for your printer in the left pane of that window and
    then click Forward. The system will begin searching for drivers for your printer.


    +   4. If your printer is supported, the next page or two of the wizard will ask
    you to enter some basic details about the printer. These might include its name
    and model, for example. Fill in the blanks to suit your needs and then, when you
    go to the last page, click Apply.


    +   5. The wizard will close, and you''ll be asked whether you d like to print
    a test page. Make sure that everything is hunkory, it is always a good idea to
