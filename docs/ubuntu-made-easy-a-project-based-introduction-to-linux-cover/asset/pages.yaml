- pgno: 398
  md: 'WARNING You really need to be careful when using untested updates. One package
    commonly causes problems with the Linux kernel itself—scroll the list of packages
    in Update Manager and look for the "Proposed updates" section, if there is one.
    If you find a package with a name linux or generic-update, consider unchecking
    the box next to it to prevent it from being active for the time.


    # THE HACKER CULTURE—A BRIEF ARISE


    If Linus hadn''t shared his hobby project with the world, we wouldn''t be talking
    about Ubuntu, or any form of Linux (Chapter 1 if you want a refresher on the history).
    The open source movement is founded on the hard work and ingenuity of people like
    Linux, who are affectionately known by the community as hackers. By this, I don''t
    mean people who break into computers, write horrible viruses, or otherwise. Another
    meaning of the term hacker goes much further in computing history: Simply put,
    it means one who writes computer programs as passion. The guys who founded Microsoft
    and Apple were hackers—enthusiasts playing around with early desktop computers
    in their respective garagesnThe hacker culture extends beyond computers to all
    sorts of activities. It''s about experimenting, coming up with cool ideas, and
    sharing them with similar-minded people, and it is this philosophy that has made
    the open source movement.


    # The Ubuntu Forums


    An online forum is a place where you can post messages about some topic that other
    users can read and respond to publicly. There are thousands of forums on the Web,
    bringing together people from all over the world to talk about sorts of stuff.
    The Ubuntu forums are a great place to ask questions, get help, and converse with
    other people using Ubuntu. There are over 50,000 active users, and more than a
    million posts have been made to date. If you have a question, there''s a good
    chance that it''s already been answered or that someone will be able to answer
    it for you.


    Dust off your explorer''s hat, and let''s take a look around the forums. Head
    over to http://www.ubuntuforums.org/, and the first thing you''ll notice is the
    many categories on the front page. Choosing the right category is pretty straightforward—people
    seeking help with computer problems will post their questions in one of the Main
    Support categories, for example. For now, let''s check out the part of forum set
    for new Ubuntu users. Click the Absolute Beginner talk link and scroll down to
    the list that Sticky Threads (Figure 2-1).


    A thread is a collection of messages about the same topic. You can post replies
    to it or start new threads. A sticky thread is one that the forum moderators (the
    head honchos who make everything runs smoothly) deem important enough that it
    should stick around, for everyone to read. Normal threads don''t stick around
    and slowly make their way down the list as new threads are started and added to
    the top. To read a thread, just click its name.


    A Colony of Penguins 361'
