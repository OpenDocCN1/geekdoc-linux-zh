- pgno: 339
  md: 'To get your hands on a Humble Bundle, you''ll have to be quick—typically, the
    offers are only available for a short time—and you''ll only be able to buy the
    games individually, at a fixed cost, after that. For details on upcoming bundles,
    take a look at http://www.humblebundle.com/. There''s also a list of all the various
    collections on Wikipedia (en.wikipedia.org/wiki/Humble_Indie_Bundle); where you
    can''t buy bundles directly anymore, it''s still a useful list of good, Linux-friendly
    games that you might want to explore.


    Another potential source of commercial games is the Ubuntu Software Center. It''s
    only recently accepting paid-for titles into its listings, the number of commercial
    games that you can obtain through its familiar interface is growing all the time.
    To see what''s on offer, fire up the Software Center and click the small downward-facing
    arrow immediately to the right For Purchase; then browse through the list that
    appears in the main pane of the Software Center window. As I write this, most
    of the software in the list consists of games (though other types of commercial
    software are available too), with the majority priced from $5 to $20. For example,
    the award-winning puzzle game World of Goo, which tests you the challenging task
    of building wobbly structures out of blobs of goo comes at a pretty reasonable
    $19.95 (a demo version is available as a DEB package if you''d like to try before
    you buy; check out http://worldofgoo.com/d2.demo/). Another top-notcher puzzle
    is Braid (a cheaper at $5), in which you must solve puzzles by modifying the code
    of itself. As you saw in Chapter 6, installing commercial software is very similar
    to installing else from the Software Center, except for an additional payment
    step. See “6-A: Commercial vs Free Software” on page 83 to get the full story.


    In Chapter 19, I''ll explain how you can also run games on Ubuntu using Wine.
    Indeed, this is how many people enjoy big commercial titles that don''t have Linux
    versions: Guild Wars, Spore, and Call of Duty are just a few examples of games
    that can be run flawlessly in this way. If this sounds like your sort of thing,
    Project 19C: Running Windows Programs on page 329 will be of particular interest
    to you; you''ll learn how to use a neat app called PlayOnLinux, which can be used
    to handle most of the fiddly configuration stuff that is often required to get
    well-supported games running under Wine.


    # Project 17B: Installing a Java-Based Game: Schnapsen


    As you can see from the games discussed thus far in this chapter, the Ubuntu Software
    Center is a great one-stop shop for Linux games. As you have learned, however,
    there are also many games beyond those in the Ubuntu Software Center. These include
    the games you worked with in Chapter 8 that were written in scripting languages,
    such as the Python-based pyWings and the Tcl/Tk-based Briscola, but it just wouldn''t
    be right to leave out games written in what might be considered the mother of
    all scripting'
  merge: -1
