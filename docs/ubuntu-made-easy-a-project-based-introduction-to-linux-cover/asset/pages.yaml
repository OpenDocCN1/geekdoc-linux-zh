    # Project 6C: Installing DEB Packages Not Available via the Ubuntu Repositories—Google
    Earth


    As may recall, the applications you install from the various repositories via
    the Software Center are in the form of DEB packages. Although it might seem that
    these repositories contain just about every piece of software imaginable, certain
    packages, for one reason or another, will never find their way into a repository.
    Google Earth is one of these packages.


    Google Earth, shown in Figure 6-13, is an advanced map/atlas program that lets
    you explore every place in the world through detailed satellite images, maps,
    and even 3D renderings of cities. There''s a whole cottage of people who digitally
    explore the planet, compiling lists of interesting places you can visit in Google
    Earth. They normally these lists into .kmz files so you can download and explore
    for yourself. For example, if you visit ancient landmarks, you''ll find a list
    of various ancient landmarks that you can tour, all from the comfort of your armchair.


    ![](img/d35fa962e6f9664d66dc83916f426418_129_0.png)


    Figure 6-13: Google Earth'
