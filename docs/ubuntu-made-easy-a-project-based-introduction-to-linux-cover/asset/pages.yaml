    Want to go to another window in another portion of the desktop? Click the Workplace
    Switcher button and double-click the quadrant where the window is located. It
    is all really easy once you get the hang of it. It''s very handy too. You can
    separate your desktop into work areas, for example, with one part for writing
    a letter, another for all the budget items you are dealing with, and for games
    when you need a little break.


    # Why Doesn''t My Desktop Look Like That?


    If your desktop doesn''t look exactly like what you see in the screenshots in
    this chapter, it likely means that Ubuntu automatically started you up in what
    is called fallback mode. Fallback mode is an environment that is simpler in appearance
    and less demanding of hardware workload. It is also referred to as 2D mode. In
    case you''re wondering which mode you are in, the clearest-way is the Dash button.
    If the Dash button is a dark charcoal-gray with a white Ubuntu logo, then you
    are in 2D fallback mode.


    Ubuntu defaults to fallback mode when your hardware, particularly your video card,
    does not have what Ubuntu needs in order to run Unity, which is fairly demanding
    of graphics hardware. Possibly your card is too old or too'
