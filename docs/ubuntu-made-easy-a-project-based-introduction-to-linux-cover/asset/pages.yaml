- pgno: 84
  md: 'USB port on your laptop (unless your wireless connection is built in, which
    case you can forgo this step). Any LEDs on the external card will most likely
    light up at this time.


    If your access point was on when you booted your computer and your wireless card
    was in place during booting, you probably don''t need to do anything to access
    the Internet. Just follow these steps:


    +   Click the Network icon on the top bar to reveal a drop-down menu showing the
    wireless signals in your vicinity and the strength of each signal (Figure 4-5).


    +   From that, select the signal for your access point (or any other wave you
    are entitled to latch onto) by clicking it.


    +   The Network icon will start to pulse, showing that your system is connecting
    to the Internet. Once a connection is made, the icon will morph into a small signal-strength
    indicator. Pretty handy.


    +   If you have a WEP or WPA password, you will be prompted to enter it. It can
    be useful to check Show password before the type you can connect for any mistakes.
    Click Connect when you''re finished.


    ```

    Wireless Networks

    eduroam

