  md: 'Player Movie menu by selecting Open and navigating to the songs you want to
    play. If you have a CD in your disc drive, you can even use Movie Player as a
    CD player by going to the Movie menu and selecting Play Disc ''Audio Disc''.


    ![](img/d35fa962e6f9664d66dc83916f426418_316_0.png)


    Figure 16-3: Movie Player as an audio player


    # A Couple of Other Cool Movie Player Features


    Movie Player has a couple more cool features that you might like to know about.
    One is its ability to perform screen captures of whatever video you happen to
    be viewing at the time. Just select Edit Take Screenshot, and you''ve got yourself
    a screen capture—a still image taken from a video file.


    Another feature worth mentioning is Movie Player''s sidebar. As you no doubt noticed,
    at the bottom-right corner of the Movie Player window is a sidebar. If you click
    that button, a new pane will open at the right side of the Movie Player window.
    In that pane you can select and listen to BBC podcasts; search for and watch YouTube
    videos (Figure 16-4); and load, create, and save playlists. You can select these
    various functions from the drop-down menu at the top of the sidebar.


    The playlists you can create consist of any combination of supported video or
    audio files, providing you with the whole multimedia banana. Any time you play
    a file in Movie Player, that file appears in the Playlist pane, but you can also
    add items to the list by simply dragging the files from your desktop or any Nautilus
    window.'
