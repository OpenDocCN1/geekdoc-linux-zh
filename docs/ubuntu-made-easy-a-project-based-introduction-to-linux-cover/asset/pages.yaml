    # 8D-3: Running configure and make for Xmahjongg


    Now that you have downloaded and unearthed the Xmahjongg tarball, installation
    is pretty standard. Here''s what you need to do:


    +   1. Open a Terminal and move into the new folder by typing `cd xmahjongg*`
