    Figure 2:1: The Launchpad bug report page for Rhythmbox bug


    Other bug subscribers Subscribe issue


    **NOTE** It''s bad practice to change the status or importance of your bug, even
    if people overstime the importance of their problem. Leave it up to an Ubuntu
    developer or another community member.


    Further down, you''ll see my original bug report followed by a question from superb
    Ubuntu developer Sébastien Bache. There''s a bit more to-and-forth until the bug
    gets upstream—that is, to a different source project that handles the bugs for
    Rhythmbox. From here, I had to wait for the Rhythmbox developers to fix the problem.


    If you''ve reported a bug, keep an eye on your email. You will be notified every
    time the bug is changed or a comment is made. If someone asks for more information
    on the problem (Sebastien did with mine), all you need to do is reply. Your reply
    will be added to the bug report for everyone to see. The more information the
    developers have, the faster they will be able to fix the problem.


    # When Will My Bug Be Fixed?


    Hundreds of new bugs are reported for Ubuntu every day, even if it''s not when
    you think about the 40,000-odd packages available to install. The sheer volume
    of bugs isn''t easy to copy with, and dealing with them has been likened to ''drinking
    from a fire hose''. To calm the chaos, an army of volunteers called the Bug Squad
    posse over the new bugs, categorizing them, identifying those that have already
    been reported, asking for how the bugs happen, and generally trying to get enough
    information together'
