  md: '![](img/d35fa962e6f9664d66dc83916f426418_296_0.png)


    ![](img/d35fa962e6f9664d66dc83916f426418_296_1.png)


    # # Amping Up with PLUG


    The guitar players among you, particularly those of you with Fender Mustang amplifiers
    (I–IV), will be disappointed to learn that Fender’s software normally comes with
    your amp is not compatible with Linux. The good news is an answer in the form
    of the application PLUG (Figure 14-16). Like Fuse, PLUG can be used to create
    and edit amplifier presets and upload them to your amplifier. Using PLUG is like
    creating and modifying your own pedal, just virtually rather than on the floor
    in front of you. You can also apply firmware updates for your amplifier via PLUG.'
  merge: -1
  img_proc: true
- pgno: 297
  md: '![](img/d35fa962e6f9664d66dc83916f426418_297_0.png)


    Figure 14-14: Editing and creating Mustang presets with PLUG


    PLUG is not available via the Ubuntu Software Center, but it is easily downloadable
    as a binary that you just found. Get PLUG from the project website at http://piplank.org/plug/download/
    and download the Generic package for 32-bit systems. This is a binary tarball,
    so you won''t be installing it but rather extracting and running it from your
    Home folder, as you did with some of the apps you worked with in Chapter 8. Once
    the tarball is downloaded, extract it to the LocalApps folder you created in Chapter
    8 (or wherever you prefer). To run it, double-click the PLUG file within the folder
    it came in and then click RUN in the dialog that appears.


    Before PLUG can recognize your amplifier, you''ll have to do a little work to
    get around the fact that Ubuntu allows only root users to access unknown USB devices,
    which your amp will be. The instructions on how to do this can be found in the
    README file in the PLUG folder.


    # Hydrogen & Mix


    Before wrapping things up, I''ll briefly mention a couple applications that deserve
    mention if for no reason other than are pretty cool at what they do. One is Hydrogen
    (Figure 14-17), which is a digital drum machine for Linux. It aims to provide,
    as the project page puts it, "professional yet simple and intuitive pattern-based
    drum programming." The other is Mixx (Figure 14-18), a cross-platform, full-featured
    digital dual-deck mixer.'
