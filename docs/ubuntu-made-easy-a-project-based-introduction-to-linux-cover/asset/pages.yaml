  md: "![](img/d35fa962e6f9664d66dc83916f426418_337_0.png)\n\n# Beyond the Ubuntu\
    \ Software Center\n\nI hope you've found something agreeable my recommendations\
    \ so far, but it's hardly an exhaustive list. Hundreds of games that do run on\
    \ Ubuntu but haven't made their way into the Ubuntu Software Center yet are packaged\
    \ as Ubuntu-ready DEB files all the same. \n\nPlayDeb(http://www.playdeb.net/)\
    \ is a good place to find extra games. Everything on PlayDeb is available through\
    \ its own Ubuntu-friendly repository, so you'll be able to install its games through\
    \ the Ubuntu Software Center once you've added the PlayDeb repository to your\
    \ list. See “Adding Extra Software Repositories” on page 88 for full details—the\
    \ APT line that you need deb http://archive.getdeb.net/ubuntu-precise-getdeb games.\n\
    \nAnother worth exploring is the PPA section of Launchpad. To see what's available,\
    \ head over to https://launchpad.net/ubuntu/+ppaname?filter=game and browse through\
    \ the rather lengthy list. Many of these games are in the home-brew tradition,\
    \ so don't expect polish in most of what you find, but there are a few gems here.\
    \ You can find instructions on how to install PPAs in “Project 6B: Installing\
    \ Software from a PPA—Turtle Arena” on page 90.\n\n# Commercial Games\n\nAll of\
    \ the games I've mentioned so far in this chapter are free and open source, in\
    \ keeping with Ubuntu's usual mode of operation. But plenty of commercial games\
    \ are available for Linux too; it's just a matter of where to look for them."
