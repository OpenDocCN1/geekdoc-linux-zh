- pgno: 456
  md: '# D


    # RESOURCES


    ![](img/d35fa962e6f9664d66dc83916f426418_456_0.png)


    Because Linux owes much of its growth and development to the Internet, it should
    come as no surprise that a wealth of information about the various flavors of
    Linux, including Ubuntu, is available online. In addition to the usual news, how-to,
    and download sites, you will find a variety of tutorials, forums, blogs, and other
    sources of useful information—all of which you can turn to as you use and learn
    more about your system.


    # Forums


    When you are looking for advice, trying to solve a particular problem, or just
    looking for some general tips, online forums are the way to go. Fortunately, Ubuntu
    has a forum all its own, and since Ubuntu is primarily a desktop-oriented Linux
    distro, you are likely to find many newbies and newbie-friendly posters there
    (rather than the hard-core geeks you might find on'
  merge: -1
  img_proc: true
- pgno: 457
  md: 'some other sites). There are, of course, other newbie-friendly forums, which,
    although not Ubuntu-specific, should also be able to provide you with lots of
    helpful information.


    Regardless of which forum you are posting in, which version you have (Precise
    Pangolin, in case you forgot), and that you are new to Linux. And always remember
    to seek clarification when you get an answer you don''t understand. The same poster
    will usually come back and restart things for you. You should feel right at home
    at most of these sites, though you will probably come to one or two more than
    the others.


    +   * http://ubuntu.org/ This is the official Ubuntu community forum, which was
    covered in detail in Chapter 21. This is always a good place to start when you''re
    in a fix, have a question, or just to find out what''s going on.

    * http://www.ubuntu.org/forum/ You may find this smaller Ubuntu-specific forum
    a good place to turn if you find UbuntuForums a bit too much to wade through.

    * http://askubuntu.com/ This is a truly problem-solving and how-oriented forum,
    so it is yet another great place to turn when you have problems, questions, or
    doubts.

    * http://www.ubuntuforums.net/ This forum is dedicated to Ubuntu, an official
    Ubuntu edition based on the KDE desktop environment.

    * http://www.justlinux.com/ and http://www.linuxquestions.com/ If you can''t find
    what you want in the previously mentioned forums, you can try these forums dealing
    with general Linux issues. You are sure to find many Ubuntu users on them.


    # Linux References


    You can learn more about Ubuntu or Linux in general at these sites, many of which
    are geared towards newbies:


    +   * http://www.ubuntu.com/ubuntu/ An overview of Ubuntu and its features.

    * http://ubuntuguide.org/wiki/ubuntu:precise An unofficial Ubuntu startup guide.

    * http://help.ubuntu.com/ Official documentation for the current release of Ubuntu.

    * http://www.tukuxfiles.org/ Lots of tutorials and information for Linux newbies.

    * http://www.linuxcommand.org/ Where you can learn to use commands in Linux.'
  merge: -1
  img_proc: true
- pgno: 458
  md: 'http://www.linux.org/ News, book reviews, downloads, and all sorts of other
    stuff—all about Linux.

    http://www.libreoffice.org/get-help/ A number of help resources for users of Ubuntu''s
    LibreOffice suite.


    # Blogs


    You can also find a lot of great information in blogs. In these blogs, you can
    discover the findings of fellow users as they try new things, share tips, and
    offer solutions to problems:


    +   http://www.ubuntu.org/blog/ A mostly Ubuntu-oriented news blog.

    http://www.ubuntugeek.com/ Despite the word geek in the name, this is a pretty
    accessible set of mostly useful Ubuntu system and software tweaks.

    http://www.omubuntu.co.uk/ A very interesting and useful Ubuntu blog that is almost
    like a magazine, containing news, reviews, tips, and interviews.

    http://www.webup8.org/ A useful news blog focusing on, but not limited to, Ubuntu
    and other distros based on Ubuntu.


    # Hardware Compatibility Issues


    If you want to find out or not your hardware is compatible with Linux or if you
    want to read up other matters related to hardware support, take a look at the
    following sites:


    +   http://www.ubuntu.com/certification/ Contains official Ubuntu-specific hardware
    compatibility information.

    http://wiki.ubuntu.com/HardwareSupport/ Also provides Ubuntu-specific hardware
    compatibility information.

    http://www.linuxcompatible.org/compatdb/ Offers numerous compatibility lists,
    arranged by distribution.

    http://www.linuxfoundation.org/ A great spot for reading up on printer compatibility
    issues.

    http://www.linuxmodems.org/ Find out if your modem is supported.

    http://www.sane-project.org/ Check to see if your scanner is Linux compatible
    and look for fixes if it isn''t.

    http://www.linux-laptop.net/ Have laptop, want Linux? Check it out here.

    http://www.tuxmobi.net/ Provides information for using Linux with anything that
    isn''t stuck to your desk (laptops, PDAs, phones, and so on).'
  merge: -1
  img_proc: true
- pgno: 459
  md: '# Wireless Connections


    If you use a wireless card to connect to the Internet and have trouble getting
    your card to work, or if you just want to know where all the free wireless hotspots
    are, the following sites should help:


    +   - https://help.ubuntu.com/community/WifiDocs/

    - http://www.linuxuxwireless.org/

    - http://www.hpl.com/personal/Jean_Tourrilhes/Linux/

    - http://www.ezgoal.com/hotspots/wireless/


    # Free Downloads


    If you find yourself looking for more goodies to play with, you should be able
    to find plenty of free stuff to download at one of these sites. You can start
    with the Ubuntu Apps Directory and then branch out from there.


    # Applications and Other Packages


    +   - https://apps.ubuntu.com/cat/

    - http://www.getdeb.net/

    - http://sourceforge.net/

    - http://www.freecode.com/

    - http://www.gnomefiles.org/


    # Free Fonts


    +   - http://www.fontfreak.com/

    - http://www.fontparadise.com/

    - http://fonts.tom.com/


    # News and Information


    These sites are mainly informational, keeping you abreast of what''s going on
    in the Linux world as a whole (I covered some Ubuntu-specific ones in Chapter
    21). DistroWatch focuses on the various distributions available, whereas Linux
    Today, LinuxPlanet, and Phoronix fit better in the online magazine/newspaper genre.


    +   - http://www.distrowatch.com/

    - http://www.linuxtoday.com/

    - http://www.linuxplanet.com/

    - http://www.phoronix.com/'
  merge: -1
  img_proc: true
- pgno: 460
  md: '# Magazines


    If you are more of a tactile type who enjoys the feel of paper pressed between
    your fingers, then you might want to turn to some of the Linux magazines available
    at most major newsstands. All have a good deal of online content as well, even
    if you''re not interested in the pleasures of holding a magazine in your hand,
    their sites are worth checking out.


    ```

    http://www.linux-magazine.com/ (European)

    http://www.linux-mag.com/ (US)

    http://www.linuxformat.com/

    http://www.linuxjournal.com/

    http://www.ubuntu-user.com/

    http://fullcirclemagazine.org/

    ```


    Note that two (unrelated) magazines share almost the same name: One of these is
    from the United States; the other is from Europe. Newbies want some pizzazz in
    their reading materials, but some useful tips and things to play around with,
    should go for the European version. The US version is targeted towards business
    users and power geeks, not newbies.


    # Books


    If you''ve finished working through this book, you should be able to do just whatever
    you want in Ubuntu. Still, your interest may have been piqued enough that you
    want to find out a bit more about Linux. Here are some books that might help in
    that quest:


    +   - The Debian System: Concepts and Techniques by Martin F. Krafft (No Starch
    Press, 2005)

    - How Linux Works: What Every Superuser Should Know by Brian Ward (No Starch Press,
    2004)

    - The Linux Command Line: A Complete Introduction by William E. Shot Jr. (No Starch
    Press, 2012)

    - The Linux Cookbook: Tips and Techniques for Everyday Use (2nd edition), by Michael
    Stutz (No Starch Press, 2004)

    - Multimedia Hacks: Tips & Tools for Taming Images, Audio, and Video by Kyle Rankin
    (O''Reilly Media, 2006)

    - Linux Pocket Guide (2nd edition) by Daniel J. Barrett (O''Reilly Media, 2012)

    - Running Linux (5th edition) by Matthias Kalle Dalheimer and Matt Welsh (O''Reilly
    Media, 2006)'
  merge: -1
  img_proc: true
