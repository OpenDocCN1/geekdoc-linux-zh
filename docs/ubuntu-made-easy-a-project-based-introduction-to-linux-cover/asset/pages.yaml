    services, tracking flights, and providing information on public transport.

    Other applications and websites exist, such as Bing Maps (http://www.bing.com/maps/),
    but Google Earth is by far the most fully featured out there.


    Because Google Earth is not available from the Ubuntu repositories, you will need
    to get it from its website (http://www.google.com/earth/). Once, click the Download
    Google Earth button, which will automatically take you to the download page for
    Linux versions of Google Earth.\ On that page, select 32 bit .deb (for Debian/Ubuntu),
    click Agree and Download, and then click the Save File in the window that appears.


    Once the download is complete, you will find the Google Earth DEB package on your
    hard disk, probably in your Downloads folder. Double-click that package, and the
    Software Center will open to an information page for Google Earth. Click Install,
    enter your password if prompted, and watch as the installation proceeds as usual.
    Once Google Earth has been installed, you can run it by bringing up the Dash and
    searching for it. After a brief wait the app downloads a few maps, you''ll be
    free to glide around the world with the click of a mouse.


    Some computers seem to struggle with Google Earth because of the way it displays
    3D graphics. Check out http://support.google.com/earth/ and search for ubuntu
    if you''re having problems—you will find a few tips on how to get things up and
    running smoothly.'
