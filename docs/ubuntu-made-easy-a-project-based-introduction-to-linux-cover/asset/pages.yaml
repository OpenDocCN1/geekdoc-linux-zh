- pgno: 395
  md: '# A New Bug


    If one else seems to have the same problem, then you''ve got a live one! Click
    No, I need to report a new bug at the bottom of the page where the list of suggested
    bugs appeared and write a description of the bug in the Further information box.
    Here are some tips on how to write a breathtakingly beautiful report:


    Report only one problem per bug. If you report more than one problem at a time,
    it will be difficult for the developers to keep track of what they''ve fixed and
    what they haven''t.


    Describe what you were doing at the time the bug occurred. Context is important,
    so you should describe what you were doing when you experienced the problem. For
    example, if your music player crashed when you plugged in your iPod, you should
    mention that.


    Mention which version of the program you are using. The bug-reporting tool should
    have automatically provided information about software versions, but it''s a good
    idea to make a note of yourself. Selecting Help > About in the program''s menu
    will usually give you the version of the program, and you can find out which Ubuntu
    version you''re running by clicking the power button on the top panel and select
    System Settings from the pop-up menu. Double-click Details in the window that
    appears, and the Ubuntu version will be listed in the Overview section.


    Describe how to reproduce the bug. Developers need to see how the bug happens
    to fix it. Provide a step-by-step list of instructions that describe how someone
    could make the same problem on their computer. If you don''t know how to make
    the bug happen again, just describe in as much detail what you clicked or changed
    when the bug happened.


    Once you''ve packed the report with information, click Submit Bug Report to finish
    the process.


    # What Happens Now?


    You''ll receive an email from Launchpad confirming that your bug was reported
    successfully, but this isn''t the end of the story. Let''s take a look at a typical
    bug to see how things pan out: Open Firefox and head over to https://bugs.launchpad.net/ubuntu/+bug/121857
    to see a bug I reported for the Ryhythmbox music player back in 2007. The first
    thing to note is the information at the top of the page (Figure 21-7): The Affect
    column lists which packages are affected by the bug, Status tells you how far
    the bug has made on the road to being fixed, Importance tells you how serious
    the bug is, and Assigned to is the name of developer or team responsible for fixing
    the bug. These details are changed by developers as progress is made on identifying
    and fixing the problem.'
  merge: -1
  img_proc: true
