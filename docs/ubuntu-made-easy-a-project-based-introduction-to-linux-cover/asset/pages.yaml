    The usual reason for not being able delete a file is that you don''t have the
    permissions to delete it (see Chapter 7 for an explanation of file permissions).
    Right-click a blank area of the folder where the file is stored, choose `Properties`,
    and select the `Permissions` tab. If you are listed as the owner, make sure that
    your Folder Access permissions are set to Create and delete files. Click `Close`
    and then try to delete the file again.


    If you are not the owner of the folder, you’ll have to gain ownership of it before
    you delete the file. This is where to ask yourself, “Should I really deleting
    someone else’s file?” Sometimes file permissions get messed up, and so the file
    is yours—in that case, it’s okay to delete it. If it’s someone’s file, though,
    ask for his permission.


    If you’re convinced that the file is a good idea, open a Terminal and use the
    `chown` command to change the owner of the folder. Here’s how it works: I wanted
    to delete a file called `cats.jpg` from the Pets in the Shared folder, I would
    type `sudo chown phil ~/Shared/Pets`, where `~` means “my Home folder”. After
    typing my password and pressing ENTER again, I would become the owner of the Pets
    folder and delete `cats.jpg`. Normal of course, you should substitute the name
    of the folder and your username in mine for this to work for you.


    > Don’t use this method to delete system files (in other words, files that aren’t
    stored in the /home folder) unless you are sure what you’re doing. There’s a good
    reason why you don’t have permission to delete system files by default; you could
    really screw up your system if you remove something vital.


    # Software Installation Problems


    Ubuntu’s software management tools tend to operate pretty smoothly these days.
    Nevertheless, I’ve included some troubleshooting tips for two or three problems
    that tend to be common (but to be getting rarer with each release). If you’re
    having a problem with installing, removing, or updating packages, this section
    is for you.'
  merge: -1
  img_proc: true
- pgno: 434
  md: '# I Get an Error About Unauthenticated Packages


    If you get an error message about unauthenticated packages when you try to install
    a program, try the following:


    +   - Update the Update Manager from the Dash.

    - Click the Check button and, if prompted, enter your password. The package list
    will be updated, along with all the files that are used to check whether your
    packages are "authentic".

    - When the Update Manager has finished updating the package list, close and try
    to install your program again.


    If you''re still getting the error message, you may have added a software repository
    without adding its GPG key required to do the authentication stuff that the error
    message is talking about. If this is the case, look at "Adding Extra Software
    Repositories" on page 88 for instructions on how to add the GPG key for a repository.


    # I Get a dpkg error


    There are couple of common reasons why you might get an error message related
    to dpkg when you try to install, update, or remove a software package.

    If you get an error saying E: Sub-process /usr/bin/dpkg returned an error code
    (1), you could have a broken package on your system. Here are some techniques
    you can try to fix a broken package:


    +   - Open the Terminal and searching for it in the Dash.

    - Type sudo apt-get install --fix-broken and press ENTER. Type your password when
    prompted and press ENTER again. This command looks for broken packages and tries
    to fix them.

    - With any luck, this will fix the problem; try installing a package via the Ubuntu
    Software Center to see whether you still get the dpkg error.

    - If you still get the error message, sudo dpkg --configure -a into the Terminal
    and press ENTER. This command tries to fix half-installed packages if there are
    any.

    - Try installing a package from the Ubuntu Software Center. At this point, if
    you''re still getting an error message, ask for help on the Ubuntu forums.


    If you get an error message saying E: Could not lock /var/lib/dpkg/ lock - open
    (11: Resource temporarily unavailable) or E: Unable to lock the administration
    directory (/var/lib/dpkg/), you might be running more than one manager (APT frontend).
    For example, if you are installing a package using the apt-get command in a Terminal
    while simultaneously trying to install a program with the Ubuntu Software Center,
    you will get this error message.'
  merge: -1
  img_proc: true
- pgno: 435
  md: 'Wait until one of the package managers finishes what it''s doing, and close
    it and try to use the other one again. If no other package managers are running,
    you won''t get this error message. If you don''t have any other package managers
    running, the Update Manager could be running in the background and causing the
    problem. Wait for a few minutes for the Update Manager to finish what it''s doing
    and try again.


    NOTE You might also receive these error messages if you are using the apt-get
    command in the Terminal without prefixing it with sudo. See Chapter 8 for the
    correct commands to use.


    # I Have a Broken Update


    If you update your computer using Update Manager but receive an error message
    saying that you have a broken update, try the instructions in "Get a dpkg Error"
    on page 397 to fix the problem. If that doesn''t work, try asking the Ubuntu forums
    for help—there may be a bug in the package that was updated when the error occurred.


    # A Software Repository/PPA That I Added Doesn''t Show Up in the Software Center


    "Adding Extra Software Repositories" on page 88, I mentioned that might take a
    while for any repository you add to show up in the Ubuntu Software Center. This
    is because APT is updating its list of software sources in the background, unfortunately,
    doesn''t let you know when it has finished. If you''ve been waiting for a while
    and have already tried closing and reopening the Software Center (as suggested
    in Chapter 6) to no effect, then it might be time to break out the big guns and
    force the Software Center to take notice of the new repository.


    To do this, first close the Ubuntu Software Center. Then bring up a Terminal,
    and use sudo apt-get update. Enter your password when prompted and for APT to
    update its list of software sources. Open the Software Center again and click
    the arrow immediately to the right of the All Software button to see if the repository/PPA
    has finally appeared.


    If that still hasn''t done the trick, there could be a problem with the repository
    itself. If this is the case, you might have seen an error message when you typed
    the apt-get command in the Terminal. For example, if the repository no longer
    exists, you would have seen an error message starting with "Failed to fetch. There''s
    nothing you can do if the repository has vanished, I am afraid!


    Alternatively, there could have been a problem with the GPG key for the repository,
    which will prevent the Software Center from recognizing it. Follow the instructions
    in "Adding Extra Software Repositories" on page 88 to manually download and add
    the correct GPG key for the repository if you suspect that is the problem.'
  merge: -1
  img_proc: true
- pgno: 436
  md: '# Common Problems with Applications


    So many applications are available for Ubuntu that it would be impossible to go
    through each one and point out what might possibly, someday, go wrong. Instead,
    in this section I''ve chosen to provide some general advice on how to deal with
    behaving programs, plus I''ve given you a sneaky little on a common Firefox problem.
    If you need to handle something specific, it''s never a bad idea to try looking
    at the help files for a given program. Selecting Help Contents should get you
    to a manual for most software. Failing that, a Google search often gets you the
    trick for it.


    # Firefox Says It''s Already Running


    When you exit Firefox, sometimes takes a while to close itself down properly—the
    window will disappear, but Firefox could still be running somewhere in the murky
    depths of your computer. When you try to open Firefox again, you may receive a
    message that Firefox is running in the background so you can''t open a new window.
    This is no good because you want a Firefox that you can see! If this happens,
    open a Terminal, killall firefox, and press ENTER. (The command you''re typing
    in all lowercase). This will force Firefox to shut down immediately. With that
    done, if it''s still not working, try to open Firefox again, and the window should
    pop up as normal. Following the advice at help:://support.mozilla.org/en-US/hb/Firefox%20is%20already%20running%20but%20is/%20not_responding/.


    # A Program Always Crashes


    If you have a program that keeps crashing, running it in a Terminal to see what''s
    going wrong. You''ll have to get the name of the command to run the program first—see
    “Reporting a Bug” on page 355 for information on how you can find it. Once you
    have the command, type it into the Terminal and press ENTER. The program should
    run as normal, so keep using until it crashes. When it does, look at the Terminal
    to see whether it leaves any clues to what''s going wrong. Error messages in the
    Terminal can be cryptic, so you might want to ask on the forums or IRC (which
    of both are discussed in Chapter 21) if he knows what it means.


    If the messages in the Terminal are no help, you should report a bug. See “Bugs,
    Bugs, Glorious Bugs” on page 354 for details.


    # A Program Won''t Start


    If a program doesn''t start when you click it in the Dash, try running it in the
    Terminal, as described in the previous section. It could be crashing after starting
    and might leave some information about the crash in the Terminal.'
  merge: -1
  img_proc: true
- pgno: 437
  md: '# My Computer Is Running Slowly


    Certain tasks take up lots of computing power and cause your computer to run slowly.
    Burning a CD, installing software, and converting music files to a different format
    all to strain your system, so you shouldn''t be surprised if things feel a little
    sluggish like something that is running. But what if your computer is running
    slowly even if you''re not doing anything intensive? You can investigate the cause
    of the slideshow by opening the System Monitor with the Dash. Select the Resources
    tab and check your CPU (processor) usage—if it''s around 100 percent, then a program
    in the background is probably responsible for the problem (for example, in Figure
    22-14). Choose the Processes tab and click the % CPU column heading or until it
    has a arrow next to it. This will sort the list of processes in order of how much
    of the processor they are using. The one that''s using all of the CPU should appear
    at the top of the list.


    | Name | Status | % CPU | ID | Memory | Waiting C |

    |---|---|---|---|---|---|-|

    | gwbiber | Running | 94 | 03628 | 19.8 MiB | |

    | gnome-system-monitor | Running | 10 | 03601 | 6.1 MiB | |

    | dconf-service | Uninterruptible | 2 | 02944 | 656.0 KB Jbd2_log_v | |

    | compiz | Sleeping | 2 | 02138 | 41.3 MiB poll_shed | |

    | dbus-daemon | Sleeping | 2 | 02107 | 2.9 MiB poll_shed | |

    | unity-panel-service | Sleeping | 0 | 02397 | 9.2 MiB poll_shed | |

    | beam.smpt | Sleeping | 0 | 02851 | 13.6 MiB poll_shed | |

    | zeitgeist-datahub | Sleeping | 0 | 02743 | 3.0 MiB poll_shed | |

    | gwbiber-service | Sleeping | 0 | 02591 | 19.2 MiB poll_shed | |

    | deja-du-monitor | Sleeping | 0 | 03023 | 644.0 KiB poll_shed | |

    | desktopcouch-service | Zombie | 0 | 02937 | | |

    | desktopcouch-service | Sleeping | 0 | 10296 | 3.5 MiB poll_shed | |

    | rdesktop | | Sleeping | 0 | 02935 | 1.6 MiB poll_shed | |

    | update-notifier | Sleeping | 0 | 02889 | 2.4 MiB poll_shed | |


    > Figure 22-14: The System Monitor, showing the Gwbiber service program using
    an unhealthy 94 percent of the processor for a long period of time


    It''s normally best to wait a few minutes and see whether the program reduces
    its CPU usage by itself. After all, maybe some system software is running a scan
    or dealing with some other maintenance operation. If the CPU usage stays high,
    the program might have gotten stuck, so select and click **End Process** to force
    it. Your system should return to its usual speed within a few seconds.'
  merge: -1
  img_proc: true
- pgno: 438
  md: 'If you didn''t notice high CPU usage on the Resources tab, then it’s possible
    that something is overusing your hard disk instead. Programs that do this almost
    finish when they’re doing within 5 or 10 minutes, so you should probably ride
    it out. If the sluggishness persists, the easiest way to fix the problem is to
    restart the computer.


    # # Lost Files


    Losing an important file is one of those uniquely frustrating experiences in life.
    If you''ve already looked in all of the most likely locations (like your Home
    folder) and have tried searching in the Dash, see if one of the following-options
    works instead:


    +   **Recent Documents** Open the Dash and click the Files & Folders lens at the
    bottom of the screen to see whether the missing file is in the Recent list of
    recently edited files. If it was an Office document


    +   **Basic search** The Search for Files tool is only useful if you remember
    the file’s name. Bring up the Dash and open the Search for Files tool. In the
    window that appears, type part of the file name in the Name contains box and click
    **Find**. It might turn up in the list of search results.


    +   **Heavy-duty search** The more advanced Tracker search tool can look inside
    documents, which is handy if you don’t remember the file’s name but you remember
    some of its contents. The Desktop Search application from the Software Center.
    Once installed, Tracker will start building its index. This could take about 15
    to 20 minutes, so you might want to wander off and do something else for a while.
    When you come back to the computer, open the Desktop Search app from the Dash
    and search for your lost file. (Note that you might want to check the search settings
    to make sure that all of the relevant locations are being searched. You can do
    this using the Search and Indexing tool, which you can open from the Dash.)


    +   **Look in the Trash** It’s possible that you accidentally deleted the file.
    Click the Trash on the Launcher and look for it in.


    Another explanation for the lost file might be that it was saved in a temporary
    folder. This happens when you open an email attachment, for examplethe file is
    in a temporary folder by your email client and opened using the default application
    for that type of file. Unfortunately, some programs do not realize that the file
    is temporary, and they leave you in the temporary directory… which is periodically
    wiped clean. If you suspect that this may have happened and you have restarted
    your computer since you saved the file, then it’s probably gone forever.


    If you haven’t restarted, there may still be hope; try opening the (unmodified,
    original) file to see which folder gets stored in selecting File > Save As (or
    similar) in the program you’re using. Check which folder'
  merge: -1
  img_proc: true
- pgno: 439
  md: 'the Save window opens up to. For example, the Thunderbird mail client temporarily
    stores attachments that you open in the /tmp folder for Figure 22-15 for an example).
    Note the name of the folder and open your Home folder in Nautilus, then, select
    Go Location, type the name of the temporary folder in the box that appears, and
    try to find your file in the folder that orders. It''s highly convenient, if you
    find an important file, it''s worth it.


    ![](img/d35fa962e6f9664d66dc83916f426418_439_0.png)


    Figure 22-15: Looking for a file that was saved in a temporary folder by Thunderbird


    # Where Can I Go to Get More Help?


    Many of the instructions in this chapter are quite general, so they may leave
    out the specifics that you need to get your computing properly. If you suspect
    that this is the case or nothing in this chapter seemed help with your problem,
    then seeking help elsewhere is a good idea. Ubuntu has a large and thriving online
    community that prides itself on being friendly and helpful. There are quite a
    few options for you to choose from:


    +   * Visit https://help.ubuntu.com/ and use the search to find help guides and
    tutorials.

    * Ask a question on the #ubuntu IRC channel (see "Chatting with IRC" on page 364).

    * Ask a question on a mailing list (see "An IRC Alternative: Mailing Lists" on
    page 368).

    * Ask a question on the Ask Ubuntu website (see "Ask Ubuntu" on page 363).

    * Post a question on the Ubuntu forums (see "The Ubuntu Forums" on page 361).


    From here on out, it''s up to you and the Ubuntu community to figure what''s going
    on. Good luck fixing your problem!'
  merge: -1
  img_proc: true
- pgno: 440
  md: '# INSTALLING UBUNTU FROM

    A USB FLASH DRIVE


    ![](img/d35fa962e6f9664d66dc83916f426418_440_0.png)


    If you have a netbook, ultrabook, or some other computer that doesn''t come with
    a CD drive, don''t worry: You can still install Ubuntu by using a USB flash drive
    instead.

    Booting from a USB drive can be a little more involved than booting from a CD
    or using Wubi, but once the installer is up and running, the installation process
    is identical. I''m going to assume that you''re using Windows for the rest of
    this appendix, too; see https://help.ubuntu.com/community/Installation/FromUSBStick/
    for instructions.


    NOTE Some other computers don''t have the ability to boot from USB disks. If this
    is the case, you won''t be able to use this method to install Ubuntu. Alternative
    installation methods are available, such as downloading Wubi directly; see https://help.ubuntu.com/community/Installation/
    for a list of options.'
  merge: -1
  img_proc: true
- pgno: 441
  md: '# Preparing the Installer Files


    First, you''re going to need a flash drive with sufficient capacity to hold the
    Ubuntu installer: About 2GB should do it. Make sure that you don''t have any files
    on the flash drive, either—you''ll be formatting the shortly, so any files on
    it will be permanently deleted. Next, you''ll need to download an Ubuntu CD image.
    If you''re feeling clever, you can use your CD-burning software to make an .iso
    image from the CD provided with the but, otherwise wise head over to http://www.ubuntu.com/download/
    and click Start to download to an Ubuntu CD image. The image is around 700MB,
    so it might take a while to squeeze it through your connection.


    Sometimes, large downloads don''t finish properly, and you could be left with
    an incomplete CD image. An easy (not foolproof) way to check whether the image
    downloaded correctly is to open the folder where you saved it, right-click the
    image, and select Properties. Check that the size of the image is almost 700MB
    (690MB). If it''s much lower than this, you probably didn''t download properly,
    so you''ll have to try again.


    The final thing you''ll need is the software to put the installer onto the USB
    drive. Use your web browser to download the Universal USB Installer from http://www.pendricelinux.com/universal-usb-installer-easy-as-i-2-3/
    (click the Download link near the bottom of the page).


    # Creating a Bootable Installer Disk


    With the installation files downloaded, you''ll be able to make a bootable Ubuntu
    flash disk. Plug your USB drive into the computer and follow these instructions:


    +   1. Double-click the Universal-USB-Installer-<XYZ>.exe file you just downloaded
    to run it (XYZ will be replaced by the current version number of the Universal
    USB Installer).

    2. A License Agreement screen will appear. Click I Agree, and you''ll be taken
    to the Setup Se page.

    3. Where says Step 1, choose Ubuntu 12.04 Desktop from the list.

    4. Click the Browse button under Step 2 and find the Ubuntu CD .iso image that
    you downloaded earlier. Click once to select it and then click Open.

    5. Under Step 3, select your flash drive from the list (make sure it''s the right
    one; otherwise, you could wipe a bunch of important files from other disk!) and
    check the box next to it to say that you want to format the drive. Your screen
    should now look like the one in Figure A-1.

    6. Click Create and wait for a few minutes while the installer is on the disk.


    Once the process has finished, the Universal USB Installer window will safely
    eject your flash drive, as you would normally.'
  merge: -1
  img_proc: true
- pgno: 442
  md: '![](img/d35fa962e6f9664d66dc83916f426418_442_0.png)


    Figure A-1: Creating a bootable usb disk


    # # Booting from the USB Disk


    Now plug the flash drive back in and restart the computer. This is where you find
    out whether you''re set up to boot from USB drives—if you get a purple Ubuntu
    boot screen, you''re all ready to go! The rest of the process will be the same
    as the usual installation from CD, which you can read about Chapter 2. If the
    computer just boots into Windows (or whatever operating system you''re using),
    you''ll need to change some settings to get it to boot from the flash drive. Restart
    the computer again and look at the screen for text related to the boot order or
    BIOS settings for your computer. You''ll normally have to press a key (such as
    DELETE, ESC, or F2) to access these settings, but this much depends on the make
    and model of your computer. More information on accessing your BIOS is given in
    Chapter 2.


    Once you''ve found the settings screen, find the option that lets you choose to
    boot from a USB drive (that is, make the USB drive the first boot device), save
    your changes, and restart. Ideally, you''ll be taken to a purple Ubuntu boot screen.
    In that case, head over to Chapter 2 and continue the installation as normal.


    If you run into any problems, take a look at https://help.ubuntu.com/community/Installation/FromUSBStick/
    for hints and tips or head over to the forums (http://www.ubuntuforums.org/) for
    advice.


    Installing Ubuntu from a USB Flash Drive 405'
  merge: -1
  img_proc: true
