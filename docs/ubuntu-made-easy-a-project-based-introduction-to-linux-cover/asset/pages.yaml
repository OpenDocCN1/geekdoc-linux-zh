    with you, showing you all the options it can think of relate to what you''ve just
    typed. Pretty handy, I must say.


    # # Navigating a Sea of Open Windows


    Once you get down to really using your system rather than just learning about
    it, there will be times when you have a few apps and a lot of windows open at
    the same time. When it''s only a couple of windows you want to arrange more neatly,
    you can just drag one window to either resize itself to fit into that area. You
    can do the same for the other window, making it easy to work with both items by
    side by side.


    However, when you''re using several applications and different windows at once,
    it can get confusing to figure out what''s running or even where a window is,
    buried among what seems like a hundred others. In this case, the Launcher can
    come in handy—it''s not only for starting up frequently used apps but also great
    for switching applica-tions or windows.


    To help with this, the Launcher has a system of indicators that let know you''ve
    got open and running. When any Launcher item is running and its window is the
    one currently *focus* (meaning it is the application window currently in active
    use), a small arrow will appear to the right of the Launcher icon for that item
    (as you see for the home launcher in Figure 3-17). The window for an open or running
    Launcher item is not focused, an arrow will appear to the left of its Launcher
    icon (as you see for the LibreOffice Writer icon in Figure 3-17). If more than
    one application is open, with focus or not, dash marks appear to the left of the
    shortcut button instead of an arrow—two marks if two windows are open and three
    or'
