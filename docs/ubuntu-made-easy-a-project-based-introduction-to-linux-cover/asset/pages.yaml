    # I Can''t Play an Audio or Video File


    The common reason for not being able to play an audio or video file is that you
    don''t have the necessary codec installed to play the file. A codec is a small
    piece of software that adds support for a audio/video format into a program. Rhythmbox
    and the Totem Movie Player find the right codec for you (for example, “Installing
    MP3 Apps” on page 247). However, if they fail, try installing the Ubuntu restricted
    extras package—this package contains a lot of extra codecs. Once the package is
    installed, close and reopen your audio/video file and see whether it plays.'
