    to see whether there are any steps you can take to recognize the card.


    +   Click **Continue**, select your country from the list, and then click **Continue**
    again.


    +   Pick your mobile broadband provider from the list and then click **Continue**.


    +   Now you need to select your broadband billing plan from the drop-down list
    (Figure 4-9). It''s important that you choose the right plan to avoid being wrongly
    charged. If you don''t see a plan that looks appropriate, choose *My plan is not
    listed* and call your broadband provider to ask what to put in the Access Point
    Name (APN) box.


    +   Click **Continue**, check that all of the details look okay, and click **Apply**.
    You''ll be taken to an Editing window where you can enter details such as your
    account PIN and password if needed.


    +   Click **Save** and then close the Network Connections window to finish.'
  merge: -1
