  md: '+   3. Another window will appear, telling you what to do if you cannot get
    IBus to work. Click OK in that window.


    +   4. The IBus Preferences window will then appear. Click the Input Method tab.


    +   5. On that tab, check the box next to Customize active input methods.


    +   6. Next, click the Select input method drop-down menu button, select the input
    method you require, and then click Add. The input method you added will appear
