- pgno: 397
  md: 'for a developer to be swoop in and fix the issue. In practical terms, this
    means it can take a while for a problem to be fixed, although the actual timescale
    will depend on how important the bug is judged to be. I normally reckon on waiting
    two to three months for an "average" bug. Having said that, my Rhythmmbox bug
    hasn''t been fixed—five years later! (To be fair, it is a particularly minor problem
    that people are even likely to experience.)


    Once a bug is fixed, its status is changed to Released, and the Ubuntu developers
    will often provide an updated package that you can install to fix the problem
    on your computer. Fixes aren''t made straight away, since they have to go through
    a series of stringent tests to make sure that they don''t screw anything else.
    This means that some bug fixes might not be available until the next version of
    Ubuntu.


    # Faster Fixes


    If you know that a problem has been fixed but an updated package hasn''t been
    released, there may be a way around the delay—if you don''t mind taking a small
    risk. When updates are being tested to get them ready for official release, they
    are made available online for anyone to try. There''s a chance the updated versions
    could cause problems (after all, they''re being tested!), but they''re usually
    fine. There are also backported packages, which are unofficial updated versions
    of programs. These will have been tested, not just very rigorously, so use them
    at your own risk.


    To gain access to less stable packages, open the Ubuntu Software Center, click
    Edit -> Software Sources, and make sure that Proposed updates and Unsupported
    updates are checked (as in Figure 21-8) and click Close. Now, go to the Dash,
    open the Update Manager, and Check to see which packages be updated.


    ![](img/d35fa962e6f9664d66dc83916f426418_397_0.png)


    Figure 21-8: Using the Software Sources tool to enable proposed and unsupported
    updates


    360 Chapter 21'
