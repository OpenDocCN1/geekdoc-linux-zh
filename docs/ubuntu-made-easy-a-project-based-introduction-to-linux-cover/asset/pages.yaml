- pgno: 276
  md: 'Figure 13-12: Manipulating a digital image in the GIMP


    The GIMP''s main strength is in retouching photos. It is also a handy tool for
    resizing images. You can do this by simply right-clicking an image opened in the
    GIMP and selecting Image > Scale Image in the pop-up menu. This will open the
    Scale Image window, where you can set the new size of the image.


    The GIMP is also an excellent tool for converting images from one format to another.
    You can, for example, open a bitmap (.bmp) file and save it as a PNG (.png) file,
    save it as a JPEG (.jpg) file as a GIF (.gif) file, and so on. Although this can
    also be done with other graphics applications, including Shotwell, the GIMP supports
    an extremely wide variety of file formats, and even lets you save an image file
    as a compressed tarball, which makes it a true conversion king.


    To perform a file conversion, just right-click an image opened within the GIMP
    and select File > Save As in the pop-menu. You can make the same selection from
    the File menu if you prefer. Either way, the Save window will appear. In that,
    you can specify the new file format by replacing the original file extension in
    the Name Box at the top of the window with the extension for the format you want
    to convert the image to. If you''re not sure what formats are available to you,
    click the small arrow to the left of the words Select File Type (By Extension)
    at the bottom of the window and then choose the options from the pane that appears
    below. To save a work in progress, use the GIMP-native XCF format so that you
    can continue working on the image later.


    # Learning More


    It''s lots of fun to learn to use the GIMP by playing playing around it for a
    while. Once you have started, most of the fun stuff is located in the Filters
    menu of any image window. Of course, you should make a backup copy of any file
    you are planning to experiment with before you alter it.'
