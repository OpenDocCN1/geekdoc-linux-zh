- pgno: 340
  md: 'languages—Java. In this project, you''ll learn how to install the Java Runtime
    Environment and how to install and run the Java-based version of a classic Austrian
    card game, Schnapsen.


    # 17B-1: Installing the Java Runtime Environment


    Run Java-based applications, or scripts, you need to first install the Java Runtime
    Environment. If you opted to install third-party software during the installation
    of your system, you already have the Java Runtime Environment installed, so you
    can skip this part of the project and go on to 17B-2. If not, then you can download
    it now via the Ubuntu Software Center. Just search for and install openjdk 6 runtime.
    The whole set of Java packages is pretty hefty in terms of download, so don''t
    get freaked out if this download takes longer than usual. When the process is
    complete, close the Ubuntu Software Center and move on to the next step.


    # 17B-2: Getting and Extracting Schnapsen


    Once you''ve installed the Java Runtime Environment, you need to run a Java application
    in order to see it at work. The application will be one I had been searching for
    ever since I moved to the world of Linux, a 20-card Austrian game called Schnapsen,
    shown in Figure 17-16.


    ![](img/d35fa962e6f9664d66dc83916f426418_340_0.png)


    Figure 17-16: A Java version of the Austrian card game Schnapsen'
