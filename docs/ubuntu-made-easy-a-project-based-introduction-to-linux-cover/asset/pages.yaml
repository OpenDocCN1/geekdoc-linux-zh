    half of the window. Click the Add button when done (it looks like a plus sign).
    You can also use this to set up a time to regularly scan the system—just select
    the time you''d like the scan to occur and click Add. When you''re finished, click
    Close.

    As mentioned, the only viruses you are likely to encounter during a virus scan
    are those designed for Windows systems, which cannot affect your Linux system.
    Although scanning your entire system for viruses won''t hurt anything, it''s probably
    better to focus your virus-scanning activities on your Windows partition, if you
    have one, and on any files that you will be sending as email attachments, particularly
    to Windows users.


    # Project 20A: Encrypting Your Files


    Protecting yourself against Internet nasties is all well and good, but what if
    someone gains physical access to your computer? Data theft is a serious business,
    so if you have any sensitive files, you should think about protecting'
  merge: -1
  img_proc: true
- pgno: 383
  md: 'them. A good way of doing this is to encrypt your sensitive files. Encryption
    is a way of taking a file and scrambling it in such a way that only a person with
    the right decryption key will be able to recover the original information. If
    someone tries to look at the file while it''s still encrypted, all he will be
    able to see a bunch of nonsense characters.


    # 20A-1: Encrypting an Encrypted File


    Ubuntu has a nice way of encrypting files, but you should take care when using
    it! The whole point of encrypting your files is that no one but you will be able
    to access them, so there''s little chance of recovering them if you forget your
    password. Here are the steps you need to follow to encrypt:


    +   1. Open the Ubuntu Software Center and search for install encryptfs-utils.

    2. Once installation has completed, open the Dash and search for Terminal. When
    the Terminal window appears, type encryptfs-setup-private and press ENTER.

    3. You''ll be prompted for the password that you use to log in to Ubuntu. Type
    it and press ENTER (The letters won''t show up on the screen, that''s normal.)

    4. You''ll be asked to enter a mount passphrase (password). Pick something very
    memorable—there''s no recovering this if you forget it! Press ENTER, retype the
    password (to make sure there were no typos), and press ENTER.

    5. Close the Terminal window, log out of your user account, and log back again.

    6. When you log in, an Update information window will appear (Figure 20-6). Click
    Run this action now, type your login password into the window that appears (it
    will look as if nothing is being typed), and press ENTER.


    > The Update information window may not appear when you log in. If this happens,
    restart your computer and then log in—it should pop up this time.


    Your password (also referred to as encryption passphrase) will be displayed on
    the screen. Make a careful note of it, press ENTER, and then click Close in the
    Update information window to continue.


    If you have your Home folder, you''ll now see a folder called Private. Anything
    you put in this folder will be encrypted and will be safe from prying eyes. This
    is especially useful if your computer gets stolen—only someone with your mount
    password will be able to look at the files, and ideally the only person who knows
    it is you!'
  merge: -1
  img_proc: true
- pgno: 384
  md: '![](img/d35fa962e6f9664d66dc83916f426418_384_0.png)


    20-6: Checking your encryption Files If Something Goes Wrong


    # # 20A-2: Recovering Encrypted Files If Something Goes Wrong


    If you have problems with your computer and need to recover the files in the encrypted
    *Private* directory, use the following steps after Ubuntu up and running again.
    If you don''t feel confident following these instructions, you should definitely
    ask for advice on the Ubuntu forums.


    +   - Open a Terminal, type `sudo mount -t cryptfs /home/username/.Private /home/username/Private`
    (note the period in the first path) and press ENTER. You should, of course, replace
    `username` with your own username.

    - You''ll be asked for your passphrase. Type your passphrase (password) and press
    ENTER.

    - Now you''ll be prompted a few times to make a selection. Hit ENTER a few times
    until you get a WARNING message.

    - Type **yes** and press ENTER; type **no** and press ENTER.

    - If you entered the right mount password, the *Private* folder will be decrypted,
    and you''ll be able to access your files. Copy them from that to somewhere safe!


    If you have no luck recovering your files, take a look at `https://ubuntu.com/community/EncryptedPrivateDirectory/`
    to see whether there''s anything further that you can try.'
  merge: -1
  img_proc: true
- pgno: 385
  md: '# Project 2B: Shredding Documents Digitally


    Although most people are satisfied with deleting their files when they no longer
    need them, they may not realize that the deleted file is still retrievable. This
    may pose little concern when it comes to photos of your summer trip to Maryland
    or reports you may have written for a class on Thai cooking, but it is a completely
    different situation if you were been storing account details or other confidential
    information on your hard disk. Even if the data stays. That is great news if you
    want to retrieve any files you may have accidentally deleted (or formatted away),
    but it isn''t such good news if your computer gets lost or is thrown away), if
    you would just decide to delete it away. In preparation for such cases, it might
    not be a bad idea to do some digital shredding.


    # 20B-1: Trying the shred command


    Digital shredding in Linux is done with the shred command. Its usage is similar
    to the rm command you learned to use in Chapter 8, though in terms of removal,
    shred is much more thorough. To do it away, create a dummy file by going to the
    File menu of a Nautilus window and selecting New Document > Empty Document. The
    new document myShredExp.txt this will open edit. Type a couple of sentences in
    the document—anything will do—save it. The first couple of words you typed should
    now appear on the icon of the new dummy file you created (as shown in the example
    of Figure 20-7).


    ![](img/d35fa962e6f9664d66dc83916f426418_385_0.png)


    Figure 20-7: Files change their appearance after being shredded.


    With your new file and placed in your Home folder to make it easier to follow,
    open a Terminal window, type shred myShredExp.txt, and press ENTER. If you look
    in your Home folder, you will notice the difference right away. Your original
    file is still there, but the text on the icon looks like gibberish (as you can
    see on the right side of Figure 20-7), which is what your file has become. If
    you double-click the file, edit will open as it did before, but this time around,
    it won''t be able to read your file and will tell you so (Figure 20-8).


    So, now you''ve got yourself a shredded file in your folder, but it would be hard
    to get rid of the file rather than just have it sit littering things up, wouldn''t
    it? Of course you could remove the file via the Terminal using the rm command,
    but it would be easier if shredded files were deleted immediately after being
    shredded. Frankly, this is easy to do by using the shred command with the -u flag.
    You can try it on the file you''ve already shredded by opening a Terminal window,
    typing shred -u myShredExp.txt, and pressing ENTER. Your file will then be further
    shredded and deleted.'
  merge: -1
  img_proc: true
- pgno: 386
  md: '# 20B-2: A Graphical equivalent to the shred command


    Using the shred command isn''t all that difficult, most users would prefer to
    do things graphically. After all, you don''t have to type commands to delete or
    remove a file, right? That''s where BleachBit comes in. BleachBit (2-9) is an
    application that helps guard your privacy in a number of ways—let shred all of
    things for you. Here are the steps you need to follow to shred a file:


    +   1. Install BleachBit from the Ubuntu Software Center. When installation has
    finished, open it up via the Dash.

    2. When the BleachBit window opens, you''ll be greeted by a preferences window.
    The defaults are good enough for our purposes, just click Close.

    3. Assuming you don''t want to do any fancier, let''s shred a single file. Click
    File ▸ Shred Files and choose the file you want to shred (hold CTRL to select
    multiple files). Take care not to select the wrong file, since you won''t be able
    to recover it post-shredding! Click Delete. You''ll be asked to confirm the deletion.
    This is the point of no return, if you''re happy to proceed, click Delete to finish
    the job.

    4. The file will vanish, shredded into oblivion and safe from recovery.


    As mentioned, there''s a lot more that you can do to guard your privacy with BleachBit,
    aside from shredding the old file. The list on the left of the main BleachBit
    window contains all sorts of weird and wonderful ways of deleting some of the
    personal information that''s plainly lurking on your computer. Take Firefox, for
    example: Click the Firefox list item in the BleachBit, and an information page
    will appear in the main pane, telling how BleachBit can securely remove various
    information kept by Firefox.


    ![](img/d35fa962e6f9664d66dc83916f426418_386_0.png)'
  merge: -1
  img_proc: true
- pgno: 387
  md: '![](img/d35fa962e6f9664d66dc83916f426418_387_0.png)


    Figure 20-9: Using BleachBit to guard your privacy


    For example, you could check the Cookies list item. With that all you''d have
    to do is press the Clean button at the top of the window to delete all of the
    web cookies that Firefox has accumulated. Easy, huh?


    > NOTE Cookies are fragments of text that your web browser uses to store information
    about websites. Websites use cookies as a way of recording that you have visited
    them. For example, if you log in to a website, it will store a cookie with your
    username in it so that it will remember who you are next time you visit.'
  merge: -1
  img_proc: true
- pgno: 388
  md: '# 21


    # A COLONY OF PENGUINS


    The Ubuntu Community


    ![](img/d35fa962e6f9664d66dc83916f426418_388_0.png)


    One thing that really sets open source software apart from the commercial software
    world is the importance placed on community. This can include pretty much anyone
    who has anything to do with the software: The people who design it, the people
    who help others with problems . . . every one of them is a valued community member.


    Consider the commercial software world, where things tend to be quite-down. When
    you have a problem, you go to some company that provides you with support. This
    company probably also designed and sold you the software, and you probably played
    no part in that process—you''re the customer; it''s the vendor. Open source is
    different: Rather than one business managing everything, everyone pitches in together
    and helps each other. People write software and fix faults because doing so helps
    other people and because they want to help. Everyone can play a part in offering
    feedback and suggestions and helping with problems, and no one is in absolute
    control of the whole process. All in all, it''s much more democratic and, in my
    opinion, much more fun!'
  merge: -1
  img_proc: true
- pgno: 389
  md: 'The Ubuntu community in particular is large, vibrant, and notoriously friendly.
    In this chapter, you''ll learn how to get the most out of it and how you can play
    your part by joining in and giving something back (if you like).


    # Take Me to Your SABDFL


    Open source communities tend to have a well-defined structure, and Ubuntu is no
    exception. At the top of the pile is Ubuntu''s founder, Mark Shuttleworth, whom
    you met in Chapter 1. He''s the Self-Appointed Benevolent Dictator For Life (SABDFL),
    and his role is to "provide clear leadership on difficult issues and set the pace
    for the project." This doesn''t mean that he makes all of the plans and decisions—that''s
    more the job of the Technical Board, a group of senior Ubuntu contributors who
    figure out what shape the next Ubuntu release will take. Mark is there to step
    in if no one can agree.


    There''s also the Community Council, which oversees the teams who make up the
    project. There are lots of teams with all sorts of responsibilities: The Documentation
    Team writes the documentation for each release of Ubuntu, the Installer Team looks
    after the software used for installing Ubuntu, and you can find a list of them
    at https://wiki.ubuntu.com/Teams/. Teams consist of members from all over the
    world (Figure 21-1), and people on the team may have all sorts of responsibilities.
    Developers, for example, are the people who write and update the software. Last,
    but certainly not least, are the millions of Ubuntu users worldwide who form the
    biggest part of the community. This group includes you!


    ![](img/d35fa962e6f9664d66dc83916f426418_389_0.png)


    Figure 21-1: A world map showing the locations of the members of the Ubuntu Documentation
    Team


    Everyone who participates is expected to abide by the Code of Conduct (http://www.ubuntu.com/project/about-ubuntu/conduct/),
    and people who make changes to the project (like developers) are asked to sign
    a copy of this document to show their commitment to the principles of Ubuntu.
    One final: Ubuntu is a meritocracy, in which the people who''ve contributed most
    to the'
  merge: -1
  img_proc: true
- pgno: 390
  md: 'project the biggest say. The most prolific contributors are awarded with Ubuntu
    membership (if they apply for it) and benefit from such perks as ubuntu.com email
    address.


    # # Launchpad: Your Passport to the Ubuntu Community


    Every source software project needs a place to call home. In Ubuntu’s case, this
    is Launchpad, a sort of project information on steroids. Whether you want to report
    a problem, ask for help, design a new feature, or write your own program, Launchpad
    is where you go.


    Fire up Firefox and browse to http://www.launchpad.net/. Unless you''ve signed
    up before, you''ll want to register for an account, so click Log in / Register
    at the top of the page, click Create a new account, and check your email for the
    form that appears. Hit Continue and go for details on how to finish up. When the
    message arrives, click the first link, fill in your details, and click Continue
    on the page you sent to to start your account.


    Once that’s all done, go back to http://launchpad.net/ and click your name in
    the top right of the page to see your profile. It’s probably looking pretty empty,
    apart from a bunch of three-letter acronyms and a mysterious invitation to change
    your “branding.” Click one of the round, yellow icons to start changing your details.
    You can put as much or as little information as you like people to be able to
    find you on IRC (Chatting on IRC) on page 364), make sure to change your nickname
    on the page (Figure 21-2). Otherwise, you can leave most things blank.


    ![](img/d35fa962e6f9664d66dc83916f426418_390_0.png)


    Figure 21-2: My Launchpad account page'
  merge: -1
  img_proc: true
- pgno: 391
  md: 'If you''ve just created your account, you might notice a sad little zero hanging
    around in the “Karma” section. Fortunately, it’s not karma of the metaphysical
    sort, and your eternal soul isn’t in any danger. Rather, it’s a points system
    for recognizing people who have helped me Ubuntu. The more you contribute, the
    more karma points you get, and hence your greater rights over Ubuntu-observed
    friends (that''s all of them, right?). Check out https://help.launchpad.net/YourAccount/Karma/
    for details on how it works.


    # Bugs, Bugs, Glorious Bugs


    The bugs of yesterday were enormous, complicated blasts, filling entire rooms
    with delicate electronics and whirling tape rolls. Renowned computer scientist
    Grace Hopper, on retrieving a moth from a relay in such giant, tapped the offending
    insect into her logbook and remarked that she had found a “bug” in the computer.
    Well, computers may have changed a lot since the 1990s, but the terminology hasn’t.
    Whether it’s as major as a program crashing or freezing or as minor as an missing
    icon, any problem that you found with a piece of software is still referred to
    as a bug.


    You’ve almost certainly encountered a bug before—software, whether commercial
    or open source, is perfect. The difference with open source is that you’re strongly
    encouraged to report problems where you see them. Developers need free feedback
    in the form of bugs so they know what needs fixing, and problems get fixed more
    quickly if they’re reported sooner. Filing a bug report is a relatively easy way
    of giving something back to the community; it doesn’t take long, it helps to improve
    the software for everyone, and you get an annoying problem fixed for free!


    # What Counts as a Bug?


    There are lots of different types of bugs, but you can usually fit them into one
    of the following categories:


    +   - When a program crashes, freezes, or shows an error message for no good reason
    (as, for example, in Figure 21-3)


    ![](img/d35fa962e6f9664d66dc83916f426418_391_0.png)


    Figure 21-3: If a program crashes (like Chromium here), it’s probably got a bug.


    +   - When something doesn’t work (for example, when a button does not when you
    click it)'
  merge: -1
  img_proc: true
- pgno: 392
  md: '+   - When hardware (such as a printer or your sound card) misbehaves or doesn''t
    work at all

    - Typos, missing icons, and other cosmetic mistakes


    If your program fits any of these descriptions, you likely have a bug on your
    hands! You should be aware of a few notable exceptions, though. First, if a program
    is missing a feature, that''s not a real bug. You can still report it as a bug,
    but probably won''t get much attention; try discussing it on the Ubuntu forums
    first. Second, you shouldn''t ask for help by reporting a bug, since you probably
    won''t get a response. Use the forums, Ask Ubuntu website, or IRC instead; find
    out more on the "Ubuntu Forums" on page 361 and "Ask Ubuntu" on page 363. Finally,
    it''s important that the bug is reproducible. This means that you can provide
    a set of instructions for someone else to follow, and they will experience the
    same problem as you. Sometimes computers just do one-off weird things, and if
    the problem''s not repeatable, there''s little chance that it can be identified
    and fixed.


    # # Reporting a Bug


    If you''re confident you found a bug, it''s time to tell someone about it! If
    it happened in a specific program, select Help > Report a Problem in that program''s
    menu, if that option exists, and skip to the next paragraph. If that option isn''t
    there, you''ll have to get your hands a little dirty. First you need to find the
    command name for the offending program. This isn''t the same as the name that
    appears in the title of the window, so you may have to give a little guesswork:


    +   1. Press ALT-F2 to bring up the Run command view in the Dash. Using all lowercase
    letters, begin typing the name of the application. After you''ve typed a few letters,
    the icon for the application will hopefully appear; the command name is simply
    the text under the icon (for example, tomboy is the command name for Tomboy, as
    shown in Figure 21-4).


    ![](img/d35fa962e6f9664d66dc83916f426418_392_0.png)


    Figure 21-4: Finding the command name for Tomboy using the Dash'
