  md: '# 18


    # SWEET HOME ANTARCTICA


    Linux Around the House


    ![](img/d35fa962e6f9664d66dc83916f426418_346_0.png)


    So far you’ve been introduced to a good number of applications that either come
    bundled with Ubuntu or are available from the Ubuntu Software Center, and many
    of those could be considered “around-the-house” sort of applications. There are,
    however, other applications and even some extensions that you can add to your
    system that will provide still more around-the-house functionality. These include
    things that might not fit clearly in any of the preceding chapters but do fit
    under the home banner. Here you’ll learn about a number of these applications
    that can make your Ubuntu-powered machine a more thoroughly functioning part of
    your home life. All are available from the Ubuntu Software Center unless otherwise
    noted.


