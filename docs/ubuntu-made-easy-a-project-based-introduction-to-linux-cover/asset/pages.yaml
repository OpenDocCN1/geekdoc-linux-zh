    # ls


    Another harmless but handy command is ls (list directory). The ls shows you what
    is in your current directory. This is the non-graphical equivalent of double-clicking
    a folder in Nautilus to see what is inside. Try by typing ls and then pressing
    the ENTER KEY.

    If you''ve been following my commands so far, your results should list all of
    the folders in your home directory. You can also use -r flag to show only the
    list of files in the folder but also what is within the subfolders. Of course,
    you might not have created any subfolders, yet you could also hold experimenting
    with this for a while. Instead, try ls -a to see your invisible, files.


    # calendar


    I''ll let you experiment with this one on your own. Just type calendar and press
    ENTER to see some interesting results.


    # exit


    The exit command is a simple one that allows you to exit the Terminal. Just type
    exit and press ENTER. The Terminal will close.


    # Commands with Some Teeth


    The simple commands you have tried so far are all of the safe-and-sane, fire marshal-approved
    variety; they merely print information to your Terminal. Now you are going to
    try to get some tangible results from commands. The commands are also essentially
    safe and sane if you follow my instructions.


    # mkdir


    You have already learned how to create folders by means of you and your mouse,
    you can also do this using the command line. The command is mkdir (make directory),
    and it is as easy as pie to use (though I''ve never quite sure how pie is easy).'
