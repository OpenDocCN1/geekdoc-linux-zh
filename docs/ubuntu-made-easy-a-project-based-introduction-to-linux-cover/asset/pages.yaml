- pgno: 24
  md: '# ABOUT THE AUTHORS


    # Rickford Grant


    My computing life began long ago, in the Commodore/Atari days. No doubt inspired
    by Alan Alda''s television commercials at the time, I purchased my first machine,
    an Atari 600XL with a cassette drive for storage and 16KB of RAM—more than I thought
    I would ever need. Most of my time on that machine, I must admit, was spent playing
    cartridge-based games and transcribing pages and pages of machine code from the
    now-defunct magazine Antic to create even more games. Eventually, my interest
    in computers increased, especially after seeing my first (and actually the first)
    Macintosh at the UCLA bookstore. The very in-your-face nature of the Mac''s operating
    system caused me to become an operating system maniac. To date, I have worked
    with different operating systems, including Mac OS up to and including OS X, and
    even Windows from 3.1 onward, and even IBM''s most forgotten OS/2.


    Though tempted to join the Linux fray, I continued to steer away from it for a
    long time I could not help see it, as many others do, as a system for never-seen-the-light-of-day-faced,
    late-night Dr Pepper-drinking Domino''s pizza-eating comp-geeks. However, when
    I moved to Japan and was suddenly surrounded by machines loaded with Japanese
    versions of Windows, I encountered numerous problems, including language constraints.
    Since everything, including Help files, was written in Japanese and my reading
    skills in Japanese were less than spectacular, I ended up using only a fraction'
  merge: -1
  img_proc: true
- pgno: 25
  md: 'of the full potential of most software. Then there were those annoying Windows-type
    problems that were especially prevalent back then, such as the constant freezes
    and restarts and the gradual system slowdowns, which were eventually remedied
    by reinstalling the system. Getting the software I needed to do the things I wanted
    to also took a toll on my wallet, and I began to rethink my initial resistance
    to Linux. With Linux’s multilingual support, system stability, and extensive free
    software packages, there were plenty of incentives for me to get over my preconceived
    notions about the typical Linux user.


    After a few failed attempts at getting Linux to work on the offball, Frankenstein-like
    collection of junk that was my computer, I finally succeeded with a live-CD distribution
    called Knoppix, which worked well enough to reel me in. I eventually tried and
    used number of distributions that appeared, before eventually making my way to
    Fedora and then, ultimately, Ubuntu.


    I started off with my three desktop machines at work and home set up dual-boot
    systems running Linux and Windows, but I found myself using only Linux. Although
    I expected to encounter numerous limitations in Linux that would force me to return
    to Windows, actually increased my productivity. Despite a lack of support for
    Windows streaming media, I was able to do more because of the extensive software
    that was now installed on my machine. Without having to fork out money I could
    afford to spend, I was able to manage my digital images, rip songs from CDs, create
    vector drawings, generate PDF files, and do a variety of things I wasn’t able
    to do under Windows. It was only a matter of time before my dual-boot setups became
    Linux-only setups. I ceased to be a


    To be sure, a bit more hands-on tinkering had to be done back to get all the things
    you wanted to work in Linux working, but I am happy to report that things have
    continued to get easier and better, and those early frustrations I suffered trying
    to get things to work with this machine or that piece of hardware are mostly a
    thing of the past. Best of all, with even more distributions available as live
    CDs, which allow you to try Linux before you actually install it, you usually
    don’t even have to take a leap of faith to get started. Ubuntu, fortunately, is
    one such distribution.


    Of course, getting started in the world of Linux, no matter which distribution
    you are using, can be a bit intimidating, especially when you don’t have anyone
    to help you out when you have questions. In fact, I started writing this book
    as a Linux primer for my mother, to whom I had given one of my extra computers
    with Red Hat installed. At that time, I was not planning on writing a book at
    all; it was that there really weren any books out written with average users in
    mind. The books available were all more or less geek oriented, and as such, they
    would not do for the mater. This created a somewhat elaborate instruction set
    that would tell her how to do everything she might want to do in a way she could
    understand. Since I was in Japan and she was in the United States at the time,
    I tried to make it as user-friendly as possible.


    xxiv About the Authors'
  merge: -1
  img_proc: true
- pgno: 26
  md: 'My auntie caught hold of the "manuscript" and decided that I must try to publish
    it. I responded with the obligatory, "Yeah, right," putting it out of mind. My
    auntie, being a rather persistent character, did not relent, so I moved quiet
    by submitting the book for publication. Surely a rejection would do the trick;
    however, I did not get a rejection slip, and instead my first book, Linux for
    Non-Geeks, based on Fedora Core I, was born. I later switched to Ubuntu, and the
    Non-Geeks line followed by Ubuntu for Non-Geeks.


    I continued with two subsequent editions of the Ubuntu books, my new day was making
    it harder and harder to devote the time necessary to keep the book up-to-date
    and up-to-snuff and get it all written when it was needed. It seemed to bring
    in a co-author to keep things wisely. Enter Phil Bull. Phil was the technical
    editor on the third edition of Ubuntu for Non-Geeks, and because of his familiarity
    with the book, in addition to his work on Ubuntu documentation, seemed a perfect
    candidate for the job. The fact he lives closer than than Stanage Edge, where
    I still imagine myself one day standing, pulling the Keira Knightley Pride and
    Prejudice pose, matters


    Su révé vacances aside, Phil on the project allowed us not to update the book
    so as reflect changes in the system and bundled applications but also expand to
    cover changes in available technology and hardware and to address suggestions
    from readers of past editions. The changes, I made, for even one more well-rounded
    volume before—a book that even better served the original purpose of the series:
    helping us get into the world of Linux easily and comfortably.


    The collaboration with Phil continues with this follow-up, Ubuntu Made Easy, and
    though the title is new, the new book continues to improve and expand upon the
    previous Non-Geeks editions. It attempts, and so makes your transition into the
    world of Linux a smooth and easy one.


    # Phil Bull


    As my illustrious co-author already mentioned, I worked on two previous editions
    of this book, both as a writer and technical reviewer. It turned out to be so
    much (Rickford and the folks at No Starch are really great to work with) that
    I''ve come back for more!


    So, what''s my background? Well, computers have taken up of my free time since
    I was eight years old. I started playing games on my uncles'' old DOS machine,
    and I found soon myself ripping apart home PC and putting it back again just to
    see how it worked. The geekness doesn''t stop there; I taught myself to program
    using Microsoft Word and Visual Basic for Applications (ugh) when I was 14, and
    I worked in technical support for a while in my teens. At the end of high school,
    however, I realized physics was my calling in life, and now I''m a grad student
    in astrophysics at the University of Oxford in the UK. I haven''t completely foreseen
    computers, though—far from it, in fact. It turns out numerical'
  merge: -1
  img_proc: true
- pgno: 27
  md: 'simulations are pretty important in my line of work, and I currently spend
    a lot of time studying the Universe from the comfort of my laptop (running Ubuntu,
    of course).


    My Linux journey started off with an old copy of PC Pro magazine from 1999. There
    was an article on this weird, alien-looking operating system, and I just knew
    I had to try it out. Unfortunately, dial-up modem barked at the prospect of downloading
    a 650MB file, so I had to wait until sometime 2004, when a friend sent me a Xandros
    CD. The rest, as they say, is history: I happily migrated to Fedora, and then
    settled down with Ubuntu in 2006. Not long after, I started writing documentation
    for Ubuntu and then for GNOME, a pastime that I''ve kept up ever since. I just
    love to figure out productive, and writing clear, understandable instructions
    for people felt more (and, often, more challenging!) than doing the crossword.


    Writing this book with Rickford is, in many ways, the culmination of the last
    decade or so of my computing life, and I hope you''ll find our contributions fun,
    easy to read, and—above—useful. The Ubuntu operating system itself is an interesting
    phenomenon, with much that you''ll love and a few things that may frustrate you.
    We''ve highlighted lots of the good stuff, the cool features and satisfying "it
    just works" moments that make Ubuntu my favorite OS, but we haven''t shied away
    from providing detailed advice about where things can sometimes go wrong. My hope
    is that after reading Ubuntu Made Easy, you''ll feel confident and in control
    of your computer; familiar with all of the bells and whistles that are there to
    help you get things done, and ready to take in stride any problems that come up.
    I hope you enjoy reading it. Oh, and one last thing . . . welcome to Ubuntu!'
  merge: -1
  img_proc: true
