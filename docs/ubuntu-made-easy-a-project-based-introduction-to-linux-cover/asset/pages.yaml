  md: '# 4


    # MORE THAN WEBBED FEET


    Connecting to the Internet


    ![](img/d35fa962e6f9664d66dc83916f426418_78_0.png)


    These days, the average home computer user spends more time surfing the Web and
    writing email messages than doing just about anything else. Even if you''re not
    much of a surfer, numerous applications that aren''t really Internet applications
    per se still use the Internet in some


    way, such as gathering song and album information when you rip audio CDs to create
    MP3 files. Having a computer that isn''t hooked up to the Internet is like buying
    a new Maserati and refusing to take it out of the garage.


    Of course, how you connect to the Internet depends on your hardware and provider.
    There are a number of possibilities, including high-speed local area networks
    (LANs), cable modems, mobile (3G/4G) broadband, and ADSL connections from phone
    companies. Some computers have an internal 56 Kbps modem or can be connected to
    external dial-up connections for slower connections over regular phone lines.
    Depending on what you have, setting things up on your system should prove a cinch
    in the case of LAN connections and any other types of connections that use your
    Ethernet port (such as cable modems), possibly a tad more work in the case of
    wireless and mobile connections, and sometimes a bit of a challenge when it comes
    to dial-up'
