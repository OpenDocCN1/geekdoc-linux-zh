    # Patch Photo Batch Processor


    While the Gimp and Shotwell are quite capable of handling the majority of your
    photo-organizing and editing choices, they lack an easy-to-use batch file conversion
    method that allows you to apply various conversions to a group of files at the
    same time. For example, let''s say you want to convert 100 of your photos so they
    look like black-and-white snapshots with white borders, are 50 percent smaller
    than the originals, and have saved in .tiff format. Applying all these changes
    one by one would be excruciating. Fortunately, Patch comes to the rescue! (See
    Figure 13-13.)


    Using Patch is easy—and a bit of hocus-pocus focus. However, its interface might
    not be obvious for a first-time user. With that, here is a brief rundown on how
    to use Patch:


