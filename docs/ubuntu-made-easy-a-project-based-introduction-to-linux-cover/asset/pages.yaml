  md: '# Has It Already Been Reported?


    Lots of people are using the same programs as you, so there''s a good chance that
    someone has gone to the trouble of reporting your bug already. Launchpad will
    go off to look for existing bugs that it thinks the description you gave, take
    a look at the list that appears and see whether any of the results sound familiar
    (Figure 2-6). If you find one, click the arrow next to it, read the description
    to make sure, and click Yes, this is the bug I''m trying to report. This could
    be a good sign, because someone might just be working on a fix!


    ![](img/d35fa962e6f9664d66dc83916f426418_394_0.png)


    # Report a bug


    Please describe the bug in a few words, for example, "weather app crashes on login":


    Summary: Chromium crashes after opening a new tab [Check again]


    Do any of the following bugs describe the bug you''re trying to report?


    +   #8679 Crash when signing login screen in gdmsetup

