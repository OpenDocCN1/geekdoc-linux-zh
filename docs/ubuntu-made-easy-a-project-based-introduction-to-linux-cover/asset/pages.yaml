- pgno: 209
  md: '# Customizing Visual Effects with CompizConfig Settings Manager


    Starting where Unity leaves off, CompizConfig Settings Manager, also known as
    CCSM (Figure 9-18), allows you to tweak more system elements and to configure
    them. Compiz is the composing engine at work in Ubuntu that provides it with its
    3D effects, such as shadows and window animations. Its job is to bring together
    all the various elements at work in your system in conjunction with your 3D-compatible
    video card, making everything seem to be working as one graphical unit. You might
    say it is the eye-candy engine for your system, and as it is a busy of of software
    indeed! CCSM is the graphical interface by which you can control Compiz''s features.


    ![](img/d35fa962e6f9664d66dc83916f426418_209_0.png)


    >  9-18: CompizConfig Settings Manager


    Compiz is automatically enabled at startup if you have a graphics card that supports
    its set of features. An easy way to tell whether Compiz has kicked in on your
    machine is to open any window (your Home folder, for example) and check whether
    that window has a drop shadow. If it does not, then Compiz is not at work, and
    this section will not be of much of use to youskip to the next section. If it
    does have a shadow, however, Compiz is at work, so keep on reading.


    The graphical effects that are active by default in your system are really the
    tip of the iceberg. Depending on the capabilities of your graphics card, you will
    get the drop shadows and a few bells and whistles, such as cooler window-opening
    transitions, but that''s about it—on the surface, and at any rate. If you like,
    you can get a feel for it right now by kicking the effects up a notch.'
  merge: -1
  img_proc: true
