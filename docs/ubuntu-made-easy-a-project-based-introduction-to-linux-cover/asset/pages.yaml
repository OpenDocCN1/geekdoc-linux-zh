- pgno: 294
  md: 'You''ll be happy to know that you can rip the streams you are listening to
    (and even those you aren''t listening to) and save them as MP3 files. Stream-tuner2
    is set up to do this through a background app called Streamripper, which you have
    to install separately. (Just search for it in the Ubuntu Software Center and install
    normally.) Once it''s installed, you can record a stream from Streamtuner2 by
    right-clicking the target stream and then clicking the record button at the top
    of the window.


    # Ex False and EasyTAG


    For the true audio geek, there are a number of applications that allow you to
    alter the tags of your MP3 and Ogg Vorbis files. EasyTAG is the more full featured
    of the two, but Ex False (Figure 14-12) has a friendlier interface. Give ''em
    both a try and see what you think use.


    # Apps for Music Makers


    The audio apps I have mentioned up to this point are really oriented to the listening
    side of music. There are also a number of applications for those who like to make
    music. In this section, I''ll introduce some of the most use-ful or at least interesting
    of these.


    # Audacity


    Although not purely a music-making application, Audacity (Figure 14-13) is the
    king, in terms of numbers of users, of the sound-recording and editing apps, not
    only in the Linux world but to a large degree in the Mac and Windows worlds as
    well. Audacity allows you to record sound files and then edit'
  merge: -1
  img_proc: true
- pgno: 295
  md: 'them, raising pitch, increasing and decreasing speed, adding echo and other
    effects, and... well, all sorts of other neat stuff. You will probably find yourself
    using Audacity for more than you ever imagined.


    ![](img/d35fa962e6f9664d66dc83916f426418_295_0.png)


    Figure 14-3: Audio recording and editing in Audacity


    # Ardour and LMMS


    Ardour (14-14) and LMMS are the two most commonly used Linux digital audio workstations,
    both in the genre of the popular digital audio workstations, Avid Pro Tools. Digital
    audio workstations are basically virtual mixing rooms, allowing to record, edit,
    and play back music. They also allow you to create music from the program itself.
    I''m not an expert with this type of application, but many people say LMMS is
    stronger in the creation department while Ardour is stronger in the recording/editing
    area. Of course, the easiest way to figure out which one is best for your needs
    is to try them out.


    # MuseScore


    If you need to print out musical scores, you can turn to the straightforward and
    very capable music notation program MuseScore (Figure 14-15) allows you to create
    music, by mouse, keyboard, or midi device, with up to four voices per staff. It
    also allows you to play back the compositions you''ve put on the page. This is
    a great feature for folks like me who can''t read music but find themselves wanting
    to figure out a melody based on its score. Just copy the notes to a page in MuseScore,
    click the play button, and the elusive melody is there before your ears (as well
    as yours).'
  merge: -1
