    and click Edit. Check through the settings in the Editing window to see whether
    any of them are—the usual suspects are your default gateway and DNS servers (if
    you have a manually configured wired network) and the wireless security key (if
    you have a wireless connection).


    For those of struggling with a wireless connection, you can find a less troubleshooting
    guide at https://help.ubuntu.com/community/WifiDocs/WirelessTroubleshooting/.
    It''s quite technical in places, so you might prefer to ask for help on the Ubuntu
    forums if you find yourself getting a bit lost.


    # Installing Drivers for Your Network/Wireless Card


    If your network card or wireless card hasn''t been recognized or isn''t working
    as expected, you might need to install some drivers for it. You can try a few
    methods, and the one that works will very much depend on the make and model of
    your card. I have included two of the most general ones in the following sections,
    but some cards need to get working. The lists at https://wiki.ubuntu.com/HardwareSupportComponentsWiredNetworkCards/(wired
    cards) and https://help.ubuntu.com/community/WifiDocs/WirelessCardsSupported/
    (wireless cards) should be able to help you figure out which method to use.


    # Checking for Restricted Drivers


    Some wireless cards have restricted drivers that you can download to get your
    card working. These drivers are normally provided by the manufacturer of the card
    and are “restricted” in the sense that they can''t be fixed by Ubuntu developers
    if something goes wrong with them (in other words, they''re not open source)


    You need to be connected to the Internet to download restricted drivers. If you
    don''t have a working connection (probably you''re currently in the process of
    trying to get your card working!), try using an Ethernet cable to plug the computer
    directly into your wireless router or cable modem (see Chapter 4 for more information).
    This will work only if you have a functioning wired network card. If your wired
    network card doesn''t work, you won''t be able to follow these instructions.


    +   Go to the Dash and open Hardware Drivers. Ubuntu will start searching for
    restricted drivers. If it finds any, they will be displayed in the list at the
    top of window (as in Figure 22-3)


    +   Check to see any of the restricted drivers have anything to do with networks
    or wireless (it should say in their descriptions). If you find one that does,
    select it and click Activate to download and install it. Some cards require two
    drivers, so if you find two drivers that look relevant, install them both.'
