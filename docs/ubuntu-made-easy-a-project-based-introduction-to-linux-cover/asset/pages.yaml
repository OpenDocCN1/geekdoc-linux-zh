- pgno: 48
  md: '# 2


    # WADING AND DIVING


    Running and (If You Like) Installing Ubuntu


    ![](img/d35fa962e6f9664d66dc83916f426418_48_0.png)


    As I have already mentioned, one of the great things about Ubuntu is that it comes
    on a live CD, which means that you can try it before you install it . . or never
    install it at all, if that''s what you prefer. Better yet is the fact that, unlike
    earlier editions of Ubuntu, you don''t need an additional installation CD if you
    choose to install it—both a live CD and an installation disc. And in the good-better-best
    swing of things, the best point of all is that installation from the live CD is
    actually much, easier than any other installation process you''ve ever dealt with,
    and it gives you more than one way to go about it.


    In this chapter, I will cover the basics of starting up and running Ubuntu from
    the live CD and then, assuming you''ve caught the Linux bug, the pain-less steps
    of installing Ubuntu on your hard disk as your operating system, either in its
    own partition on your hard disk in a traditional dual-boot setup (with Windows
    in its own partition) or, for the slightly less adventurous, from within your
    Windows system.'
  merge: -1
  img_proc: true
- pgno: 49
  md: 'If your computer doesn''t have a CD drive, don''t worry, you can still join
    in. Take a look at Appendix A to see how you run or install Ubuntu from a USB
    flash drive instead. Whatever you end up going about things, let''s put this book
    to use and get Ubuntu up and running.


    # Going for a Dip


    To get a taste of what Ubuntu is all about (and to check out your hardware to
    see whether it''s all comfy-zy with Ubuntu), there is probably no better way to
    run Ubuntu directly from the live CD. To do this, place the Ubuntu CD in your
    disc drive and restart your machine. When the machine starts up, it should boot
    up from the CD, and after a second or two, you will see a purple Ubuntu startup
    screen with a couple of icons at the bottom of it. If the screen does not appear
    and your machine restarts, then very likely your machine''s BIOS settings need
    to be changed to allow you to boot from a CD. Worry not: the BIOS settings aren''t
    much of a hassle. Although the procedure might sound rather technical, altering
    the BIOS


    You can access your machine''s BIOS by restarting and then pressing whatever the
    onscreen instructions assign to accessing the BIOS setup. This is usually DELET,
    or F2, F10, F12, and ESC all common—not all machines are the same. If the onscreen
    information passes by fast that you miss it, you can check your user''s manual
    to see what the correct key is.


    Once you get into the BIOS setup, change the boot sequence so that your CD drive
    is first. To do this, you''ll probably have to use the arrow keys on your keyboard
    to navigate between different options and the ENTER key to select them. Basic
    instructions on how to do this are normally onscreen. When you''re finished, make
    sure you save your changes and restart the computer.


    Once your machine boots from the live CD and you see the purple Ubuntu startup
    screen, either you can wait for a few seconds for Ubuntu to start booting into
    the live CD, or you can press a key (any key) to display a menu where you can
    choose your language and other settings. The default settings should suffice for
    your purposes, leave the keyboard untouched for a few seconds, and the screen
    will give way to a loading screen (all purple).


    NOTE If you decide to explore this machine, you''ll find that you have to make
    a choice as to how you proceed once you chosen a language and so forth. Select
    Try without installing to get back on the right track


    After a couple of minutes or so, the loading screen will disappear, and in its
    place will come an Install window with a swoopy desktop background behind it (Figure
    2-1). Click Try Ubuntu, and the Install window will give way to a desktop with
    row of colorful icons down the left side and the same purple background. You should
    now be able to use your mouse as well as the keyboard, feel free to explore. And
    remember, your hard disk will go untouched,you''re not going to change, let alone
    hurt. When you get to this point, you''re ready to take Ubuntu for a spin—I''ll
    hold off on talking about that until Chapter 3.'
  merge: -1
  img_proc: true
- pgno: 50
  md: '![](img/d35fa962e6f9664d66dc83916f426418_50_0.png)


    Figure-2-1: The Ubuntu live CD''s Install window


    **NOTE** Special input mechanisms that are required for certain languages (that
    is, Chinese, Japanese, and Korean) are not supported in live CD sessions.


    If you''d like to get out of the CD and return your computer to normal, click
    the power button at the top right of the screen (it looks like a circle between
    a power icon and a gear), **Shut Down**, and then choose **Restart** from the
    window that appears. After a little while, you will be asked to remove the CD
    from the drive and press ENTER. The computer will restart and return you to your
    normal Windows desktop soon. If you have no luck with the Restart button for some
    reason, it is safe to turn your computer off and then on again just by using the
    power button on the front of the machine.


    # # Choices, Choices, Choices—Installation Options


    If you have already installed Ubuntu on your machine, are are satisfied running
    it from the live CD, and still haven''t made up what you want to do, you can skip
    the rest of this chapter and continue to the next one to start working with the
    Ubuntu desktop. If, however, you haven''t installed Ubuntu yet are ready and ready
    to do so, keep reading.


    # # Going for a Swim—Installing Ubuntu Inside Windows (The Wubi Installer)


    It used to be that if you enjoyed Ubuntu and want to run it off your hard disk
    but were afraid to do it for fear of damaging the delicate state of your Windows
    setup, you were . . . well, out of luck. Things have changed, however, because
    there is now an installation option called Wubi that lets'
  merge: -1
  img_proc: true
- pgno: 51
  md: 'you install Ubuntu directly on your Windows C: drive as if it were any other
    Windows program. Once it''s installed, every time you start up your machine, you''ll
    be able to choose between starting up Windows or into Ubuntu from the Windows
    bootloader. Your Windows system stays as it is; you don''t have to partition your
    hard disk, and if you want to get Ubuntu later whatever reason, you can do so
    as you would any other Windows application. It''s a great way to go about things
    for the faint of heart.


    Admittedly, this approach could be described as a half measure, in that it doesn''t
    give you the full experience you get with a dedicated Ubuntu installation. It''s
    not as robust as a full Ubuntu installation, and it takes longer to install because
    Wubi needs to download the installation files from the Internet (the right ones
    aren''t on the CD). But it is a pretty good compromise—it गतिविध runs quicker
    and is more usable and enjoyable than an Ubuntu live CD session. You also have
    the added benefit of being able to save files and settings, which means you can
    follow along with anything described in this book.


    If this alternative installation approach doesn''t seem appealing to you, move
    on to "Taking the Plunge—Installing Ubuntu of Windows-downs" on page 17. If you
    have made up your mind and would like to know a bit about this Wubi installer,
    point your browser to http://wubi.sourceforge.net/. If, on the other hand, you''ve
    decided that the Wubi installer is to answer your prayers, here''s what you need
    to:


    +   1. Insert the Ubuntu live CD with this book into your computer''s drive while
    Windows is up and running. A window like the one in Figure 2-2 will automatically
    appear.


    ![](img/d35fa962e6f9664d66dc83916f426418_51_0.png)


    Figure 2-2: An Ubuntu live CD automatically launched inside Windows


    +   2. In that window, click the Install inside Windows button. The Ubuntu installer
    will appear (Figure 2-3).'
  merge: -1
  img_proc: true
- pgno: 52
  md: '![](img/d35fa962e6f9664d66dc83916f426418_52_0.png)


    Figure 2-3: Choosing to install Ubuntu inside Windows


    +   1. Use the **Installation drive** option to specify where you want the Ubuntu
    files to be put. Make sure you have enough space on that drive!

    2. Windows and Linux can not share the same disk space, so you need to set some
    aside for Ubuntu only (you can easily reclaim the space by uninstalling Ubuntu,
    discussed in a moment). Choose how much disk space you''d like to have available
    in Ubuntu by selecting a size from the Installation size drop-down list. Anything
    less than 10GB will probably be restrictive.

    3. Leave the Desktop environment set to its default value (Ubuntu) and then choose
    a username and a password. Click the Install button until you''re happy with your
    choices.

    4. If your machine is not already connected to the Internet at this point, you
    will be told to get it connected. Do so if you need to and click **Retry** if
    the warning window appears.

    At this point, Wubi will begin downloading the files it needs in order to create
    a bootable Ubuntu installation within your Windows environment. Depending on your
    connection speed, this could take some time; about 1GB (around 1000MB) of data
    which will need to be downloaded.

    After all is done, you will see a window like the one in Figure 2-4 asking you
    to reboot.

    5. Select **Reboot now** and click the **Finish** button in that window, after
    which your machine will reboot. Don''t forget to remove the Ubuntu disc from the
    CD drive before it restarts; otherwise, the computer will try to boot from that
    instead.

    6. When the machine restarts, you will see the Windows bootloader, a black screen
    with white text, which allows you to decide whether to boot up in Windows or in
    Ubuntu. Use your down arrow key to select **Ubuntu**, and then press ENTER.'
  merge: -1
  img_proc: true
- pgno: 53
  md: '![](img/d35fa962e6f9664d66dc83916f426418_53_0.png)


    Figure 2-4: Ubuntu has completed the first phase of its inside-Windows installation.


    Your machine will then begin the Ubuntu startup process, which should be new territory
    for you. Once the Ubuntu desktop appears, Ubuntu will get to work setting things
    up for you; this might take a bit of time, depending on the speed of your machine.
    When it''s done, you will be delivered to the login screen (Figure 2-5); you can
    now flip to Chapter 3, because you are done here.


    ![](img/d35fa962e6f9664d66dc83916f426418_53_1.png)


    Figure 2-5: The Ubuntu login screen'
