    +   5. Next, install Cinnamon by typing sudo apt-get install cinnamon and pressing.


    +   6. You will be asked if you want to continue. Type y and press ENTER. The
    download and installation will take a couple of minutes or so.


    +   7. Once the installation is complete, you will be back at your user prompt.
