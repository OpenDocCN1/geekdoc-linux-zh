    # Customizing: The Basics


    As I mentioned, not many customization options are readily available in the default
    setup of Ubuntu, but to start off, there are some. we''ll discuss these most available
    for use without needing to install any software or resort to the command line.


    # Changing the Desktop Background


    Changing your desktop background (often called wallpaper) is about the easiest
    customization you can do. Just right-click any open space on the desktop and select
    Change Desktop Background in the pop-up menu. This will open the Appearance window,
    in which you can see what wallpapers you have installed and select from them (see
    Figure 9-4).


    ![](img/d35fa962e6f9664d66dc83916f426418_199_0.png)


    Figure 9-4: Changing your desktop wallpaper'
