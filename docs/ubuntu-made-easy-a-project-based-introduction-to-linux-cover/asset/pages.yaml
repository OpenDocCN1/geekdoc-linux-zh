    taken place in the xmahjong-3.7 folder only—your system is still as pure as you
    started. Of course, all is going to end right now when you perform the final installation
    step.


    # 8D-4: Installing and Running Xmahjong


    Now you''ve come to the last step in this part of the process, make install. Here
    you are telling your system to install what you have created, or compiled, in
    the make step. Note that because installation takes place in permissions-protected
    parts of your system, you will need to add sudo to the command string to give
    yourself administrative privileges.


    To perform the installation, type sudo install and press ENTER. You will be prompted
    for your password. After you type it and press ENTER, the installation process
    will take place. Once your Terminal brings you to your user prompt, Xmahjong will
    be installed and ready to run from the Terminal. Just type xmahjong and press
    ENTER.


    # 8D-5: Cleaning Up/Uninstall Xmahjong


    Once you are done and everything seems to be working as it should, you would normally
    tidy up in the Xmahjong folder by getting rid of unnecessary files. You can do
    this by using the Terminal and the cd command to go back into the Xmahjong folder,
    typing make clean, and pressing ENTER.


    If you want to uninstall Xmahjong, open a Terminal window, go back to the Xmahjong
    folder using the cd command, type sudo uninstall, and finally press ENTER. The
    routine is essentially the same for any applications installed in this way, though
    you might imagine, uninstallation isn''t as smooth as a process that I''ve described
