    Figure 2-6: A list of bugs that Launchpad thinks are similar to the one you''re
    reporting


    Choose Just the bug as affecting me and click the green button to go to the bug
    page (the alternative option, Subscribe me as, which means you will receive an
    email every time someone posts a comment about the bug). Take a look at the comments
    that others have made about the bug and see whether anything could help you work
    around the problem. Comments are sometimes technical in nature, so it might be
    necessary to ask around on the forums for help with some of the more cryptic instructions.
    If you can''t find anything helpful, you can try to provide more details on the
    problem to help a developer track it down. The developer will often ask you to
    provide a copy of the output of some command, which can help determine what is
    going wrong. If you think you can help, scroll down to the bottom of the bug page
    and put what you know in the comment box.'
