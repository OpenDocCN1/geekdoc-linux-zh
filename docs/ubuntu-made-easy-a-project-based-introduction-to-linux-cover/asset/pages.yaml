    # Controlling Browser Window Clutter with Tabs


    Usually when you click a link on a web page, the new page opens in the window.
    On some pages, links are coded so that the new page opens in a separate window,
    or maybe you occasionally opt for opening a link in a new window by right-clicking
    the link and then selecting the Open Link in New Window option. This can be very
    useful; however, once you have more than a few windows open, it gets sort hard
    to find what you''re looking for. It can also slow down a bit.


    This is where Firefox''s tab feature comes in handy (so, in fact, that almost
    every other browser there has copied it). To see how it works, try yourself right
    here and now. Open your Firefox by clicking its icon in the Launcher (shown in
    5-1) or by searching for Firefox in the Dash.


    Then, search for the word nickelharpa using Firefox''s handy search box, which
    is at the top-right corner of the browser window (see Figure 5-2). By default,
    Firefox will perform searches for keywords entered in the search box using Google.
    You can, if you like, select other engines or search particular websites by clicking
    the colored g in the search box and then making your selection. Amazon.com, eBay,
    and Yahoo! are available, to name a few, and you can even add others. For now,
    let''s stick to Google by typing nickelharpa in that search box. Once your finished
    typing, press ENTER. A page of search results should appear in the main pane of
    the Firefox window.


    ![](img/d35fa962e6f9664d66dc83916f426418_93_0.png)


    Figure 5-1: The Firefox icon in the Launcher


    ![](img/d35fa962e6f9664d66dc83916f426418_93_1.png)


    Figure 5-2: Performing a Google search from the Firefox search box


    One of the top results should be the American Nickelharpa Association, and you
    are now going to open that page in a new tab, rather than in the same or a new
    window. To do that, right-click the link and, in the pop-up menu that appears,
    select Open Link in New Tab. You can, if you prefer, make things a tad easier
    and dispense with the pop-up menu selection step by simply clicking the link with
    the middle mouse button (or with both buttons simultaneously) or by holding down
    the CTRL key as you click the link.'
