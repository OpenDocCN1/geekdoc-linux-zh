- pgno: 300
  md: '# 15


    # # PLUGGIN'' IN THE PENGUIN


    *Working with Your iPod, iPhone, and Other Digital Media Devices*


    ![](img/d35fa962e6f9664d66dc83916f426418_300_0.png)


    With all the talk in the previous chapter about ripping, encoding, and playing
    back audio files, you may be wondering whether Ubuntu will allow you to transfer
    any of those files to your digital media devices, such as your MP3 player, cell
    phone, or iPad. Well, you will be happy to know that using your device with your
    Ubuntu system is quite easy—easier than ever, in fact. No longer do you have to
    mess around with mount and unmount commands or edit system tables, and if you
    don''t know what I''m talking about, consider yourself lucky. Just plug in your
    device, and Ubuntu will do the rest.'
  merge: -1
  img_proc: true
- pgno: 301
  md: '# Knowing Your Limits


    Assuming Ubuntu helped you download and install all the audio codecs and support
    files for the applications mentioned in Chapter 14, you shouldn''t encounter any
    problems handling any media files on your digital media device. Even if you didn''t
    install those codecs and files, Ubuntu will automatically help you find the necessary
    items if you try to play a file it hasn''t installed for. Not all formats will
    work with equal degrees of comfort or success—it depends on your device and the
    file format compatibility with Ubuntu. As a general rule of thumb, most players
    will be able to handle MP3 files and unlocked AAC (.m4a). Check your device''s
    manual for specifics about other file formats (or give them a try).


    As far Ubuntu goes, it can work with all the files mentioned—with the exception
    of locked AAC files. And you will learn a way to deal with them later in the chapter.


    > Although working with your digital media devices in Ubuntu has becoming increasingly
    simple, it''s always worth a bit of caution. Make sure to have backups of the
    device before working with it on Ubuntu.


    # Mounting and Ejecting Your iPod, iPhone, or iPad


    Working with your iPod, iPhone, or iPad is extremely simple. Basically, just connect
    the device to your computer via a USB connector, and Ubuntu will mount the device
    so you can access it. An icon for your device and another for Documents will then
    appear in the left pane of any file manager you have happened to open. Ubuntu
    will also place icons for your device and Documents in the Launcher.


    In addition, two of those-do-you-want-to-do-with-this-stuff types of displays
    will appear. (These are the same kind of displays that show up when you insert
    a music CD or DVD into your drive or connect a digital camera to your machine
    via USB cable.) You''ll see one for music and podcasts and one for photos (Figure
    15-1), and they''ll usually be stacked directly above the other. You can select
    Rhythmbox for music-handling chords in the other and Shotwell for photo handling
    in the other. Then click OK in each window to work with your device through these
    two applications. Or you can just close both of those windows for now and then
    open Rhythmbox or Shotwell, or both, later on clicking the icon for your device
    in the left pane and then clicking either of the two buttons that appear in the
    file manager window for your device


    To “eject” your iPhone or other “i” device, click the eject button next to the
    icon for your device in the side pane of the file manager window or rightclick
    Launcher icon for the device and select Unmount.'
  merge: -1
  img_proc: true
- pgno: 302
  md: '![](img/d35fa962e6f9664d66dc83916f426418_302_0.png)


    ![](img/d35fa962e6f9664d66dc83916f426418_302_1.png)


    Figure 5-1: Ubuntu instantly recognizes your iPod, iPhone, or iPad.


    ![](img/d35fa962e6f9664d66dc83916f426418_302_2.png)


    Figure 5-2: Launching Rhythmymbox and Shotwell for working with the audio and
    image files on your device


    # (Not) Auto-updating your iPod or iPhone


    With the simple instructions as how to use your iPod or iPhone with Ubuntu out
    of the way, it''s worth thinking about a couple of other things. Most important
    of these is the device''s auto-updating settings. When you enable auto-update
    on your iPod or iPhone via iTunes, the function is set up within the device itself.
    You can use your iPod in Windows, Mac OS, or Linux—or all of them interchangeably.
    If you set up your iPod to auto-update songs and playlists, however, you are leaving
    yourself open for trouble unless you have exactly the same music collection on
    all of your machines.


    Plugin: In the Penguin 265'
  merge: -1
  img_proc: true
- pgno: 303
  md: 'Here’s why: iTunes allows you to add files to your iPod, it does not allow
    you to copy files from it. The auto-update feature is strictly a one-way street.
    This means that whenever you hook up your auto-update—enabled iPod to an iTunes-enabled
    computer, iTunes will automatically add the tracks in your library to your iPod—so
    far, More frighteningly, it will remove any tracks from your iPod that are not
    present in that machine''s iTunes library. I learned this hard way when I took
    my ex wife''s loaded iPod to work and plugged it into my office Winbox with its
    empty iTunes library. I brought the Podster back home to her with nothing at all,
    well... what wasn''t pretty.


    Make sure to disable your iPod''s auto-update function before bringing the device
    into the Linux world. To do this, connect your iPod to your Mac or Windows machine
    and open iTunes. In the left pane of the iTunes in the Devices section, and then
    the right pane, check the box to Manually manage music (Manually manage music
    and videos in video-capable iPods), as shown in Figure 15-3. Next, if you have
    a photo-capable device, repeat nearly the same process for your photos by clicking
    the Photos tab in the right pane and unchecking the box to Sync photos.


    ![](img/d35fa962e6f9664d66dc83916f426418_303_0.png)


    Figure 15-3: Disabling the auto-update function on your iPhone/iPod in iTunes


    # Working with Android-Based Devices


    Although the iPhone continues to be the king of the smartphone hill, phones and
    tablets running Google’s Android operating system are starting to give Apple a
    run for its money. Fortunately, working with any'
  merge: -1
  img_proc: true
- pgno: 304
  md: 'Android-powered device in Ubuntu is quite simple, and it''s only slightly different
    from working with one of Apple’s “i” devices. Basically, this is the process:


    +   1. Connect your Android-powered device to your computer using the USB cable
    that came with it.


    +   2. In the dialogue that appears on your Android device, asking what you want
    to do now that you are connected to an external device, press the Mass storage
    button.


    +   3. In the next screen that appears on your Android device, press Connect storage
    to PC.


    +   4. The first time you do this, another small window will then appear on your
    device telling you that some apps might not work when your device is connected
    as a USB storage device. Click OK.


    NOTE Because different versions of the Android system are in service, it is possible
    that the details of the process described here be slightly different from what
    you need to do with your phone. You should still be able to follow along.


    Similar to what happens in the case of the iPhone, iPod, and iPad, or one more
    windows will appear asking what you want to do with the photos and music files
    on your device, and an icon for your device should appear in the side pane of
    any open file manager and in the Launcher.


    To “ject” your device, right-click either the file manager or Launcher icon for
    the device and then click Eject in the pop-up menu. On your phone, press Disconnect
    storage from PC.


    # What About Kindles, NOOKs, and Android 3.0+ “Honeycomb”-Based Devices?


    In the very recent past, getting Kindles or NOOKs or tablets with the newer Android
    3.0+ operating system (known as “Honeycomb”) to work with Ubuntu involved a lot
    of around the command line. The reason was that these devices did not use the
    USB protocol that most of the other devices in this class use. Instead they used
    a transfer protocol called MTP (Media Transfer Protocol) which was not Linux (or
    ever Mac) friendly. The good news is that while these devices still use the MTP
    file transfer protocol, Linux, as of this Ubuntu 12.04 release, has no problems
    working with these devices. This means that all connection and file transfer problems
    are gone, and your device should work with Ubuntu just like all the others mentioned
    in this chapter.'
  merge: -1
  img_proc: true
- pgno: 305
  md: '# Working with Other Digital Media Players and Cell Phones


    Although the iPod may be the most popular digital media player out there and the
    iPhone holds the crown in the smartphone market, they are by no means the only
    games in town. As I have already shown, Android-based phones are quite popular,
    and there are still other devices available, like the USB MP3 players you can
    find in any big-box department store.


    How to work with these devices in Ubuntu can vary by device, but for the most
    part, they will work in the same manner as an iPod or Android device or the same
    manner as a USB data device. The simplest way to see how your device will work
    is to connect it to your computer via a USB cable. If windows asking you how to
    deal with the device not appear, open a file manager to see whether you found
    an icon for the device there. If so, you can work with your device using the tried-and-true
    drag-and-drop method. You can also use Rhythmbox to work with the audio files
    by following:


    +   1. In Rhythmbox, go to the Music menu and select Check for New Devices.

    2. If your device does not show up in the left pane, import the folder on your
    device where the audio files are stored by clicking the folder button above the
    main pane in the Rhythmbox window.

    3. In the Import Folder into Library window that appears, click your device in
    the left pane. Then navigate to the folder that holds the audio files in the right
    pane (Figure 15-4).

    4. Click that folder in the right pane to select it and then click Open.


    ![](img/d35fa962e6f9664d66dc83916f426418_305_0.png)


    > Figure 15-4: Telling Rhythmbox where to find audio files on a device it doesn''t
    spot'
  merge: -1
  img_proc: true
- pgno: 306
  md: '# Managing Your Audio Device’s Audio Files with Rythmbox


    As I''ve already mentioned, Rythmbox is set as the default application for

    Phones, iPads, Android-powered devices, and, one way or another,

    y other music player in Ubuntu. Once Rythmbox is up and running,

    things work perfectly much as they do in iTunes.


    +   - To view the contents of your iPod or other device, click the icon for the

    device in the left pane of the window. The contents of the device will

    appear in the right pane of the window.

    - To copy a copy from your library to your device, just click Music in the

    Library section of the left pane and then drag the artists, albums, or single

    tracks from the right pane to your device’s device in the left pane.


    If dragging files to device seems a bit tedious, it is possible to sync

    to the Rythmbox music library. Just click the icon for your device

    in the left pane of the Rythmbox window and then click the Sync with

    Library above the main pane. A window, like that in Figure 15-5, will

    appear. Check the items you want to sync in the top portion of the window

    and then click Sync with the device. Rythmbox will begin the syncing pro-\cess,
    copying all the music and podcasts (if you chose that option)

    to your device and showing the progress of the transfer in the bottom right

    corner of the window.


    ![](img/d35fa962e6f9664d66dc83916f426418_306_0.png)


    Figure 15-5: Syncing your audio device with Rythmbox'
