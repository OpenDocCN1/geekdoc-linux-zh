  md: '# MyPaint


    If you prefer to do your electronic artwork with a graphics tablet rather than
    a mouse, then MyPaint is for you. MyPaint (Figure 13-15) is designed to work with
    pressure-sensitive tablets by Wacom and other manufacturers. Despite its simple
    interface, it features a never-ending canvas (so you can drawing in all directions
    until you run out of steam), an extensive brush collection, and even a brush editing
    tool. If you need a bit of help getting started, check out the online tutorial
    (http://mypaint.intilinux.com/?page_id=3).


    ![](img/d35fa962e6f9664d66dc83916f426418_279_0.png)


    # Inkscape


    The GIMP, like other so-called paint programs, creates bitmap images in various
    file formats. In these images, the location and color of every single pixel is
    recorded. Thus, the image is essentially a collection of dots. The file you create
    is a hasty map of these pixels, and this map tells you everything in your image
    is supposed to go when it is displayed or printed.


    Vector drawing programs, on the other hand, create vector images, which are actually
    collections of mathematical formulas representing the various shapes in your image.
    This may sound arcane, and you may be wondering why you should care. But such
    drawings have advantages in certain cases. One advantage is that vector image
    files take up less space on your hard disk than bitmaps. Another, and most important,
    advantage is that shapes in vector images retain their smoothness when the images
    are enlarged. A circle created as a bitmap, for example, would begin to show jagged
    edges (“the jaggies”) when enlarged to any extent, while the same circle in a
    vector image would remain smooth and round no matter how much you increased its
    size.'
  merge: -1
  img_proc: true
