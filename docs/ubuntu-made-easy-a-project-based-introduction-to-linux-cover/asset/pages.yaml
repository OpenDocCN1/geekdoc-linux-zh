- pgno: 242
  md: 'If you want to choose just a single keyboard layout to replace your current
    (such as British English instead of American English or German instead of Spanish),
    you can do so from the Keyboard Preferences window. Simply add the keyboard layout
    you want to use and remove any layouts by clicking each one and then clicking
    the—(minus sign) button.


    # Chinese, Japanese, and Korean Input


    For most European languages (and many other alphabet-based non-European languages),
    pressing a letter on the keyboard simply prints that letter to the screen. However,
    Chinese, Japanese, and Korean require a kind of conversion process, which is handled
    by a special application (actually a set of applications) called an input method
    editor (IME). Each of these languages has its own IME, and each is quite different
    from the basic differences in the three writing systems.


    # Chinese


    Although most people (at least in linguistic know) would think that Chinese would
    be the most complicated system, because the writing system consists of thousands
    of characters, it is in fact the simplest. The Chinese IME simply takes the Romanized
    keyboard input, known as pinyin, and converts it into Chinese characters, or hanzi.
    The IME, it is essentially a simple dictionary lookup task—big dictionary, simple
    IME. In the event that there is more than one character for the pinyin input,
    a list of candidates will appear, and the user simply selects the appropriate
    character from that list, as shown at the top of Figure 11-7. At the sentence
    level, the Chinese IME now has predictive capabilities with which it can guess
    which character you intend to type based on the context of what you''ve typed
    so far, at the bottom of Figure 11-7.


    ![](img/d35fa962e6f9664d66dc83916f426418_242_0.png)


    > Figure 11-7: Chinese IMEs can predict what you''re going to write... kind of.


    # Japanese


    The Japanese IME has a considerably more complicated task to perform, because
    it has three writing systems to deal with: kanji (ideographic characters borrowed
    long ago from China), hiragana (the phone-alphabetic system'
  merge: -1
  img_proc: true
- pgno: 243
  md: 'used mainly for tense and case endings), and katakana (used mainly for words
    borrowed from other languages). Still, the standard input method for Japanese
    is primarily via the standard Roman keyboard layout, plus a few extra-function
    keys. Thus, typing in Japanese is a two-step process where the IME converts the
    romanized text into hiragana as it is typed and converts it to appropriate kanji,
    katakana, or hiragana elements after the spacebar is pressed.


    You can see an example of these steps in Figure 11-8. In the first line, the IME
    has already converted the Roman input on the fly. rinsakkudenhongymyuryokademimasu
    (which means You input Japanese in Linux) to hiragana. When a line of hiragana
    is highlighted, it means that the line has not yet been converted beyond that.
    In the second line, however, the user has subsequently pressed the spacebar, which
    caused the IME to convert the hiragana string into the appropriate kanji, hiragana,
    and katakana elements. The first word, *Linux*, has been converted to katakana
    text because it is a borrowed word, while *Japanese input* has been converted
    to kanji; the rest stays in hiragana.


    りなっすですでにほんごんににゅうりょくできます。


    リナックスで日本語入力ができます。


    Figure 11-8: IME conversions while typing in Japanese


    # Korean


    The job of the Korean IME is again quite different from that of the Chinese and
    Japanese IMEs, because the language is written in a very different way. Korean
    is written either entirely in alphabetic letters, called hangul, or in combination
    of hangul and ideographic characters borrowed from Chinese hanja. While the hanja
    characters are essentially the same as their Chinese and Japanese counterparts,
    hanzi and kanji, the Korean phonetic alphabet, has its own unique appearance,
    as you can see in the Korean word for Korea, *Hangug*(k)*, in Figure 11-9.


    ![](img/d35fa962e6f9664d66dc83916f426418_243_0.png)


    Figure 11-9: Korea (Hangug) written horizontally in hangul


    This seems simple; however, the representation is not quite correct, because Korean
    is very distinctive in the way that its alphabetic characters are put on the page.
    Unlike the usual side-by-side positioning of hiragana, katakana, and most alphabets,
    hangul letters are grouped in pairs, triplets, or even quadruplets, which are
    written, as a general rule, clockwise. The IME, therefore, must take the input
    (usually based on a Korean alphabetical key-'
  merge: -1
  img_proc: true
- pgno: 244
  md: 'board layout while it is being typed, and it must adjust the size, spacing,
    and positioning of each letters as it puts them into appropriate clusters (see
    Figure 11-10).


    ![](img/d35fa962e6f9664d66dc83916f426418_244_0.png)


    Figure 11-10: An example of the clustering process in the Korean IME


    # # Project 11: Setting Up Asian-Language Support


    So what do you do, if for, you want to be able to type Chinese, Japanese, Korean,
    Thai, or Vietnamese while still in your usual English environment? What if you
    want to be able to type all of those languages in the same document? Can you do
    it?


    There are actually several ways of going about this, but the default method in
    Ubuntu is the easy-to-use Intelligent Input Bus (IBus). IBus supports East Asian
    languages, including Chinese, Japanese, and Korean, and it provides a number of
    input methods for many of these.


    # ## 11-1: Installing IBus Input Methods


    IBus is very easy, but out of the box, to speak, it comes with two input methods,
    both for Chinese: pinyin, used for simplified character input (the standard in
    mainland China and Chinese language classes around the world), and bomopofo, used
    for traditional character input, as found in Taiwan, Hong Kong, and overseas Chinese
    communities. To input other languages, you will need to install the appropriate
    input methods yourself. Just go to the Ubuntu Software Center and search for ibus
    japanese (there will be a number of methods, so I suggest trying Anthy first,
    ibus korean, and or ibus vietnamese.


    # ## 11-2: Selecting Input Method Modules


    Once you have installed the input method you need, you will need to start up IBus
    and then select the input methods you want to use. Here are the steps:


    +   - Go to the Dash, type keyboard input, and press ENTER.

    - A window will appear asking whether you would like to start the IBus daemon.
    Click Yes.


    > A daemon is a program that runs in the background, unknown to the average user,
    providing a system with added functionality. In the case of IBus, that added functionality
    is the ability to input complex character sets.'
  merge: -1
  img_proc: true
