- pgno: 448
  md: '![](img/d35fa962e6f9664d66dc83916f426418_448_0.png)


    # MANUALLY PARTITIONING

    YOUR HARD DISK


    When you''re partitioning your hard disk

    with the Ubuntu installer, the first two

    options (use the whole disk and resize an

    existing partition) should cover most eventual. They are both discussed in Chapter
    2. But if you''re

    in a geekier mood, you can carve out your disk space in

    a few ways. For example, you can create a shared data partition so your

    files can be shared between Windows and Ubuntu, or you can make a separate partition
    for your /home directory so you can reinstall Ubuntu (or install

    a different Linux distro) without having to fully back up all of your files.

    When you get to the Installation type screen of the installer, choose

    Something else and click Continue. You''ll be presented with a colored-bar

    of your current partition setup C-1) and a list of your partitions

    below. None of the changes that you make in this window will be applied

    until you click Install Now, and you can click the Back button if you want to

    forget about making the manual changes altogether. (There is one exception: Changes
    are made immediately and irreversibly when you resize a partition.

    See "Editing Existing Partitions" on page 414 for more on this.)'
  merge: -1
  img_proc: true
- pgno: 449
  md: '![](img/d35fa962e6f9664d66dc83916f426418_449_0.png)


    # # Creating and Deleting Partitions


    You can create new partitions only if you have some "free space" to put them in.
    This is free space in the sense that there''s not already a partition on part
    of the disk, that there are no files there. One way of creating free space is
    to delete an existing partition; to do this, click the list item for the partition
    and click **Delete**. After a few seconds, it will change into free space in the
    list (Figure C-2). Alternatively, if you''re planning to completely change your
    partition setup, select the hard disk you want to modify and click **New Partition
    Table**. You''ll be left with a completely blank slate all you need is to add
    new partitions.


    > > NOTE You can identify items in the list are hard disks by checking whether
    there is a number after the entry in the *Device* column; anything that does not
    have a number (for example, `/dev/sda` is a hard disk, and everything else is
    a partition.


    Select any free space and click **Add** to put a new partition in it. You will
    be presented with a Create partition window (Figure C-3), which will ask how big
    you want to make the partition in megabytes (1GB is roughly 1000MB). See "Varieties
    of Partitions" on page 414 for advice on how big to make your partitions.


    The Use as option lets you select the filesystem type you want to use. A *filesystem*
    allows your operating system to store files on a number of different filesystems,
    not all of them will be understood by Windows and Mac OS. Ext4 is the best choice
    for a partition that will be used solely by Linux, but FAT32 is the one you need
    if you want to share files with Windows or Mac OS.


    412 Appendix C'
  merge: -1
  img_proc: true
