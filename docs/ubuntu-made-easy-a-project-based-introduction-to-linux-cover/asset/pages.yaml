  merge: -1
  img_proc: true
- pgno: 373
  md: 'NOTE You install Linux and other operating systems besides Windows in virtual
    machines. In fact, you could even install a VM within a VM, although you''d probably
    have to budget half a day to check your email if you had both of them running
    at once.


    # Sharing Files with Windows Users on Your Network


    One of the main reasons for connecting to a network (apart from accessing the
    Internet) You may be familiar with this concept already; network shares are used
    in many workplaces, and you may have set up one before your home network. For
    the uninitiated, a network share is a folder on another computer that you can
    access if it were on your own. Files are transferred around on the network, so
    there''s no need to use a portable hard disk or flash drive to get them from one
    place to another.


    # Accessing Files on a Windows Computer


    Network shares are a two-way thing: You can share your files with others by creating
    a shared folder or access existing shared folders created by other people. If
    you''re connected to a network of Windows computers, then you probably have some
    network shares already. I talked about browsing network shares in depth at "Using
    Nautilus as a Network Browser" on page 106, but to save the anguish of flipping
    back so many pages, here''s a quick outline of what you need to do to access a
    share from Ubuntu:


    +   1. Open Nautilus by clicking its orange folder in the Launcher. Click Browse
    New Network in the Network section of the sidebar and double-click Windows Network
    to see a list of all the Windows computers connected to the network. Double-click
    one of computers to see its shared folders. If no computers are listed, try opening
    one of the folders with a network icon on the front (like the one in Figure 19-14)
    and look for computers in there instead.


    ![](img/d35fa962e6f9664d66dc83916f426418_373_0.png)


    Figure 19-14: A folder containing links to Windows computers on the network'
  merge: -1
  img_proc: true
- pgno: 374
  md: '2. Pick a shared folder and double-click to access the files inside. Depending
    on how the shared folder has been set up, you may be asked to enter a username
    and password for the computer that it''s hosted on.


    # Making Your Files Accessible from a Windows Computer


    Since your Windows computers have so gladly made their files available on the
    network, let''s have Ubuntu reciprocate by sharing a folder of its own:


    +   1. Open Nautilus and find the folder you want to share; then right-click it
    and select Properties.


    +   2. Go to the Share tab and check Share this folder.


    +   3. You''ll be told that the sharing service is not installed—click Install
    service, then Enter your password if prompted in the window that appears. Enter
    wait for the installation process to finish. You may be asked to install other
    packages, so click Install when prompted for those too.


    +   4. Once installation has finished, you''ll be prompted to restart your session.
    Click Cancel for now; you''ll need to log out, then log back again later.


    +   5. Back in the Folder Sharing window (Figure 19-15), choose a name for the
    shared folder and type a comment if you like.


    ![](img/d35fa962e6f9664d66dc83916f426418_374_0.png)


    Figure 19-15: Sharing a folder on the network'
  merge: -1
  img_proc: true
- pgno: 375
  md: '+   6. Check Allow others to create and delete files in this folder if you
    want other people on the network to be able to modify the files you have there.
    If you don''t check this option, others will only be able to read and copy these
    files.


    +   7. By default, only people with a user account on your computer can access
    your shared folders. To make it so anyone on the network can access your shared
    files, check the Guest access option.


    +   8. Click Create Share to finish up.


    +   9. To complete the process, you need to restart your session. So save all
    of your work and log out of your user account. Then, log back in.


    Go to your Windows computer and try to access the newly created share. Shared
    folders on Ubuntu computers can be accessed in the same way as any other share,
    so do whatever you would normally do to find it. (In Windows XP, for example,
    you''d find it in your Network Shares folder.) If you can open a file in the shared
    folder, you''ll know that everything was set up correctly.


    If you don''t want to share a folder anymore, right-click it in Nautilus, click
    Properties, andcheck Share this folder under the Share tab.'
  merge: -1
  img_proc: true
- pgno: 376
  md: '# 20


    # DEFENDING THE NEST


    Security


    ![](img/d35fa962e6f9664d66dc83916f426418_376_0.png)


    Many a Windows user has entered the Linux fold after a host of bad experiences
    with malware in the Windows world—viruses, spyware, and all sorts of malicious
    bits of software too numerous to imagine. Windows is also plagued by a seemingly
    endless array of security vulnerabilities, leaving the system easy prey to invaders
    with less than noble notions. Every trip into cyberspace becomes something like
    a run through the infectious ward of a hospital. For Windows user, it can sometimes
    seem that more time is spent riding the system of viral pests and defending it
    from invaders than actually getting things done.


    Fortunately, Linux does not suffer greatly from such problems, leading to the
    much-touted claim that Linux is practically free and quite secure. Numerous lines
    of reasoning have been proffered to explain Linux''s malware- and exploit-resistant
    nature. One reason is simply popularity—or lack thereof. Because Linux is not
    as widespread as a system as Windows, it is also a much less attractive target
    for digital evildoers, who often seem to be motivated by the challenge and headline-catching
    glory that comes with creating a truly global virus or finding a heretofore unknown
    backdoor.'
  merge: -1
  img_proc: true
- pgno: 377
  md: 'Another reason is that Linux users, as a general rule, work on their computers
    in a nonprivileged mode, in which the user does not have the right to install
    software without a password. This is not the case in older versions of Windows.
    A virus or other form of malware attached to an email or piggybacked upon another
    file or application can, therefore install itself in your Linux system without
    a . . ., theoretically, at least. Of course, now more recent versions of Windows
    use a privilege structure similar to this by default, this point is a bit of an
    issue.


    There is also the matter of structural design. Every system has holes that can
    be exploited by digital and human foe alike. Windows might be well called the
    Swiss cheese of operating systems in this regard. Of course, Linux has its holes
    too, though far fewer than them Windows does, and Linux generally plugs them through
    downloadable updates faster once they are found.


    Finally, Ubuntu''s preconfigured security policy brings a Ubuntu edge—a firewall
    is turned on by default. This means your Linux system is even less susceptible
    to unwanted intrusions.


    # Does My System Need Protection?


    So, with all this Linux''s great security, you may wonder whether you need to
    be worrying about vulnerabilities at all. If you take to look at the Ubuntu forums,
    you might find yourself a bit confused. When asked whether Linux users need to
    install antivirus software or firewalls, most users answer with an emphatic *no*.
    On the other hand, you''ll find an awful lot of people who have installed or are
    trying to install that software. Hmm.


    So, what''s a Linux user to do?


    If you are on a network where you transfer a lot of files along a lot of Windows
    machines, you might want to think about installing some anti-virus software, to
    achieve nothing more than the good of the Windows systems involved and the users
    of those systems—your unenened(that is, Windows-using) email mails, for example.
    You might also want to give it a go if you are, by nature, on the cautious side
    of things. Basically, if it makes you feel safer to install some protection, if
    it makes you feel safer to go-hog and install the full line of defense mechanisms
    I cover in this chapter, go ahead. After all, it''s not going to cost you anything,
    and it certainly isn''t going to hurt you. On the other hand, you''ll be fine
    without installing any of the software described here too.


    # The First Line of Defense


    Regardless of the system you are using (though I am assuming that you have become
    a Linux devotee by now), the first line of defense for any computer permanently
    hooked up to the Internet is a *router*—an electronic device that allows a number
    of computers on a local network (such as in your home or at your office) to connect
    and share a single connection from'
  merge: -1
  img_proc: true
- pgno: 378
  md: 'your Internet service provider (ISP). The router is connected to your Internet
    connection via cable, but the connection from the router to your local network
    can be wired, wireless, or both.


    What does a router include with the defense of your computer? Most routers include
    a firewall, which essentially functions to keep all of the bad stuff on the Web
    away from your computer, in the way that the firewall in your car keeps the heat,
    fumes and noise from your engine out of the passenger compartment. This built-in
    firewall is one reason that even people with one computer, who could easily connect
    to a cable or DSL modem, use a router. Of course, just how much security in your
    router depends on which filters you select in the firewall setup. For example,
    a very common and useful filter (particularly for those with a wireless network)
    limits Internet access to those computers specified on the firewall''s access
    list. This prevents your next-door neighbors from hitching a wireless ride via
    your ISP connection. They aren''t paying the bill, after.


    The setup for a router is built into the router, so you don''t have to worry about
    software installation and system compatibility. Using your router with Linux is
    not different from it using Windows. You can access the software and modify your
    settings via a simple web browser, as you can see in Figure 20-1. Just type the
    IP address of the router (usually provided in the owner''s manual) in the browser''s
    location bar, press ENTER, and you''ll be ready to go.


    ![](img/d35fa962e6f9664d66dc83916f426418_378_0.png)


    Figure 20-1: Setting up a router


    # Software Firewalls


    If you don''t have a router and don''t plan on getting one, or if you are are
    bordering on paranoia, you might want to consider using a software firewall, in
    particular one of the most popular software firewalls available for Linux, Firestarter.'
  merge: -1
  img_proc: true
- pgno: 379
  md: 'You can get Firestarter via the Ubuntu Software Center by searching for firestarter
    and installing it. Once it is installed, Open Firestarter from the Dash (you might
    be asked for password). Firestarter will open with a self-explanatory setup wizard
    the first time. Read each screen carefully; whatever selections are suggested,
    if any (the defaults should be fine), and click the Forward button in each of
    the wizards until you get to the last one (in Figure 20-2). On that screen, make
    sure that the box next to Start firewall is checked and then click the Save button.
    The window will close, and the main Firestarter window will appear. Assuming the
    correct network device was detected and selected and the correct choice made,
    the firewall will be up and running.


    ![](img/d35fa962e6f9664d66dc83916f426418_379_0.png)


    Figure 20-2: The last screen of the Firestarter setup wizard


    If the wrong network device was selected, a warning window will appear telling
    you. In that case, you can do a bit of trial-and-error manipulation by selecting
    Edit » Preferences in the main Firestarter window and click Network Settings in
    the Preferences window that appears (Figure 20-3). In that window, select one
    of the other devices listed in the Detected device(s) drop-down menu and then
    click the Accept button. Once back at the main Firestarter window, click the Start
    Firewall button (which looks like a blue Play button) and see what happens. If
    you still can''t start the firewall, repeat the process I''ve described, this
    selecting a different network device.


    Once your firewall is up and running, you really don''t need to do anything else.
    You can simply look at the Firestarter window (Figure 20-4) to see what is going
    on network-wise on your computer—which active connections you have; how much information
    has been coming and going; and whether there have been any events in, for example,
    the firewall has blocked an intruder. If you click the Events tab, you can then
    see the details of these events, such as what connection attempts were blocked,
    where they came from, and when they happened.


    342 Chapter 2'
