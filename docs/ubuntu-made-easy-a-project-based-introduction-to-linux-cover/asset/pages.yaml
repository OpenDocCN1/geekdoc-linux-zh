    # Adding Songs and Albums to the Rhythmbox Library


    If you are familiar with Apple’s iTunes, then you should understand the Library
    in Rhythmbox because it is essentially the same concept. Rhythmbox should automatically
    import everything you have in your Music folder without any extra work on your
    part. If for some reason does not, or if you would like to add music from another
    directory, you can do so going to the Music menu, selecting Import Folder, and
    then navigating to the folder for the new album you want to add.


    If you prefer this not so automatic and would like to add only what you want,
    you can open the preferences window (Edit ▸ Preferences), click the Music tab,
    and uncheck the Watch my library for new files box. After that, you can add new
    albums or groups to your Rhythmbox Library by going to Music ▸ Import Folder.
    If you want to add a single audio file, you can also select Music ▸ Import File
    and then navigate to the song you wish to


    If you are not the navigating type, you can also add files and folders by other
    means. The simplest way is to drag the folder or song you want to add to the Library
    into the right pane of the Rhythmbox window. You can also add a song to the Library
    directly by right-clicking the file and selecting Open with ▸ Rhythmbox Music
    Player in the pop-up menu that appears.


    Chapter 14'
