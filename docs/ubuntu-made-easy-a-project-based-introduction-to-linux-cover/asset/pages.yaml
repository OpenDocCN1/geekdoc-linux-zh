- pgno: 432
  md: '# My Disk Is Almost Full


    If your hard disk is almost full, Ubuntu will pop up a warning message similar
    to the one in Figure 22-13. Click the **Examine** button to start the Disk Usage
    Analyzer—it will scan your disk and display a color chart showing what you are
    using most of the disk space. You can use this information to hunt down the files
    and folders that are taking up most of your disk''s capacity. If you''re wondering
    exactly how much disk space you have left, open the System Monitor from the Dash
    and look on the File Systems tab to see how much space remains on each disk.


    ![](img/d35fa962e6f9664d66dc83916f426418_432_0.png)


    Figure 22-13: A message warning that your disk is almost full


    Apart from rooting through your Home folder and deleting unwanted files, you can
    try a few things to free up some space:


    +   - **Empty your Trash.** When you delete files, they get moved to the Trash
    folder in case you change your mind about removing them. To empty the Trash (permanently
    removing all the files in it), click the **Trash** icon at the bottom of the Launcher
    and then click the **Empty Trash** button in the Nautilus window that appears.

    - **Clean unwanted packages.** When you remove a package using the Ubuntu Software
    Center, it sometimes leaves other packages that were installed at the same time
    as the system, even though they''re not needed anymore. To remove them, open a
    Terminal, type `sudo apt-get remove`, and then press ENTER. Type your password
    when prompted, followed by ENTER, and see whether there are any leftover packages
    that can be removed. If there are, type `y` and press ENTER to remove them.

    - **Empty the package cache.** When the Ubuntu Software Center installs a program,
    it keeps the package installed for a while in case it''s needed again. These cached
    files can take up quite a bit of disk space, and it''s fine to delete them (the
    program won''t be uninstalled or anything like that). Open a Terminal and type
    `sudo apt-get clean` followed by ENTER. Type your password if prompted and press
    ENTER to empty the cache.


    # My Disk Is Completely Full


    If your hard disk is completely full, you may not be able to start Ubuntu at all,
    and you''ll get a blank screen. If this happens, press CTRL-ALT-F2 to change to
    a Terminal login prompt. Type your username, followed by ENTER, and your password,
    followed by ENTER again, to access a command line.


    > Wounded Wings 395'
