    # # Where the Apps Are


    The majority of apps in this chapter can be run from the Dash by clicking the
    Applications and then clicking the **Games** filter. Any exceptions are noted
    in the relevant sections. With all applications, you can also run an app by typing
    its name in the Dash''s search box and then pressing ENTER.


    # Project 17A: Expanding Your Game Collection via the Ubuntu Software Center


    Expanding your repertoire is quite easily done via the Ubuntu Software Center.
    In this project, you''ll plug a few games by installing some classic Linux games.
    The steps in this project are basically a review of what you learned in Chapter
    6, so there will be no challenging work involved—just fire up the Ubuntu Software
    Center and click away.


    # ## 17A-1: Installing GNOME Games


    Older versions of Ubuntu used to come with a collection of games that were part
    of the GNOME desktop environment. These included several traditional favorites,
    such as the puzzles Klotski (Figure 17-2), a challenging block-moving exercise,
    and Tetrave (Figure 17-3), which you can think of as a triangular form of dominoes.
    Others included Same GNOME (a GNOME version of the Japanese marble-matching game
    Same Game), Tali (an ancient Roman form of poker played with dice), Iagno (a GNOME


    ![](img/d35fa962e6f9664d66dc83916f426418_327_1.png)


    Figure 17-2: Klotski'
  merge: -1
