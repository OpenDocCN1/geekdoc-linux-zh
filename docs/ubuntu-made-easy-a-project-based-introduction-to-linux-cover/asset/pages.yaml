  md: '![](img/d35fa962e6f9664d66dc83916f426418_72_0.png)


    The HUD allows you to do all kinds of things you might not have imag-ined by keyboard.
    You can save a file, for example, by typing **save**, nav-igate from folder to
    another in the file by typing the name of the folder you want to move, or print
    a document by typing **Print**. The more you play a song in Rhythmbox by typing
