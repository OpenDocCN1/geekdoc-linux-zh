    ![](img/d35fa962e6f9664d66dc83916f426418_59_0.png)


    Figure 2-8: Providing your username, password, and computer name in the installation
    wizard screen


    +   13. It''s best to select **Require my password to log in** from the options
    at the bottom of the screen. Although this will necessarily increase the time
    between switching on the computer and the Ubuntu desktop''s appearance, putting
