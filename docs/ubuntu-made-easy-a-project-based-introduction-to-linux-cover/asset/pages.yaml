  md: 'connections. In this chapter, you will learn how to set up these connections,
    and in the next chapter, you will learn a bit about what Linux has to offer in
    terms of the most commonly used Internet applications.


    # How Do You Connect?


    The way you go about setting up your connection really depends on how you''re
    trying to connect to the Internet.


    +   * If you connect your computer to a wall socket, a router, or a cable modem
    by using an Ethernet cable, go to "Setting Up a Wired Connection" on page 43.

    * If you connect to a wireless network or your own wireless router, head to "Setting
    Up a Wireless Connection" on page 45.

    * If you have an ADSL or DSL modem that is built into your computer or connects
    to a USB port, try "Connecting with a DSL or ADSL Modem" on page 49.

    * If you connect using a dial-up modem connected to your phone line, "Setting
    Up a Dial-up Connection" on page 50 is the one for you.

    * If you connect using a mobile (3G/4G) broadband connection that plugs into your
    computer, go to "Mobile Broadband Connections" on page 52.


    Whichever method applies to you, one thing is almost certain—you''ll be using
    an application called Network Manager to help set up and manage the network connection.
    The easiest way of getting Network Manager is through the Network icon on the
    top panel (mentioned in Chapter 3). It changes its appearance depending on what
    type of network you are connected to, but finding it''s hard. Look the row of
    icons on the right-hand side of the top panel, and you should find the Network
    icon sandwiched between the Messaging menu (which has an envelope icon) on the
    left, and the Sound menu (which has a speaker icon) on the right. You''ll know
    you''ve got the correct icon, if you click it, the item at the very bottom of
    the pop-up menu that appears is Edit Connections** (as in Figure 4-1).


    ![](img/d35fa962e6f9664d66dc83916f426418_79_0.png)


    With that knowledge in hand, skip to the section that applies to your type of
    Internet connection and getting connected!'
  merge: -1
  img_proc: true
- pgno: 80
  md: '# Setting Up a Wired Connection


    If you have a high-speed Internet connection from your cable television company
    or ISP or if you are connected to the Internet by a LAN at your office, or you
    are really in luck, these setups are probably the easiest to deal with. I''m going
    to assume that you''ve already set up your router or modem according to your Internet
    provider''s instructions so that all remains is to connect an Ethernet cable between
    the modem/router (or LAN socket) and your computer''s network socket. After you''ve
    done that, you should be ready to go without any further settings to fool with.


    # Checking Your Connection


    If the wired network has been detected and a connection has been established,
    the Network icon will change to look like two arrows. If you like, you can check
    whether you connected successfully by opening Firefox (the Firefox icon in the
    Launcher) and then, once it starts, trying to navigate to a site, such as http://www.yahoo.com/.
    If the site comes up, you are all set.


    If you have a problem getting online and you are trying to connect via a LAN or
    cable modem, you could try to refresh your connection by clicking the Network
    icon on the top panel, unchecking the **Enable Networking** item in the pop-up
    menu, waiting a few seconds, and then checking the **Enable Networking** item
    in the pop-up menu again. If that doesn''t work, restarting your machine while
    physically connected to your Internet source with the Ethernet cable.


    If the problem persists, it could be that your network or service provider does
    not automatically assign addresses via Dynamic Host Configuration Protocol (DHCP).
    DHCP is a means by which your Internet provider can automatically provide your
    system with the configuration information it needs in order to connect to the
    Internet. If your provider does not use DHCP, you will have to get the necessary
    information about settings from the network administrator or service provider
    and enter them yourself.


    # Setting Up a Cable or Ethernet Connection for Providers Not Using DHCP


    To input your cable or Ethernet settings yourself, get the first settings you
    need from your network administrator or Internet provider and perform the following
    steps:


    +   1. Click the Network icon and select **Edit Connections** from the pop-up
    menu that appears.


    +   2. Choose the **Wired** tab (shown in Figure 4-2), and select the network
    connection from clicking it once (it should have a name like *Wired connection
    1*). If there are no entries in the list, then your network card hasn''t been
    properly recognized. Take a look at “Installing Drivers for Your Network/Wireless
    Card” on page 388 to see how to fix this.'
  merge: -1
  img_proc: true
- pgno: 81
  md: '![](img/d35fa962e6f9664d66dc83916f426418_81_0.png)


    +   3. Click **Edit**, and you''ll be presented with a settings window. Choose
    the **IPv4 Settings** tab and change the Method setting from Automatic (DHCP)
    to **Manual**.


    +   4. Click the **Add** button to enter the IP address information for your computer.
    This should have been provided by your ISP or network administrator and will consist
    of an IP address, default gateway, and netmask (see Figure 4-3 for an example).
    Enter the DNS server address that you were given too.


    ![](img/d35fa962e6f9664d66dc83916f426418_81_1.png)


    44 Chapter 4'
