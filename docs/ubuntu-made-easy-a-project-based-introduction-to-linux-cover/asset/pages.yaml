- pgno: 286
  md: '# Ripping Audio CDs with Rythmbox


    Like iTunes, Rythmbox allows you to rip songs directly from a CD; convert them
    to Ogg Vorbis, MP3, or another audio format; and add the ripped tracks to its
    music library. The steps are as follows:


    +   1. Open the Preferences window (Edit ▸ Preferences), click the Music tab,
    and selecting the encoding format you want to use (Ogg Vorbis is the default).
    Once you''re done, click Close. Unless you change formats often, you won''t have
    to do this more than once.

    2. If you have selected an encoding format for which you have not yet installed
    support, such as MPEG Layer 3 Audio (MP3), an Install additional software required
    to use this format will appear underneath the preferred drop-down menu (Figure
    14-3). Click that button and install everything suggested, even the unchecked
    items (to kill as many birds as with one stone, so to speak).


    ![](img/d35fa962e6f9664d66dc83916f426418_286_0.png)


    Figure 14-3: Selecting encoding formats in Rythmbox


    +   3. Once the installation is complete, close the Preferences window and select
    your audio CD in the left pane of the main Rythmbox window.

    4. All of the tracks and album information will appear in the right pane of the
    window (Figure 14-4). Check information there, make any corrections you feel necessary,
    and then click the Extract button at the top left of the pane. Rythmbox will begin
    ripping your CD, saving the files to your Music folder while indicating its progress
    in the lower-right corner of the window.'
  merge: -1
  img_proc: true
- pgno: 287
  md: '# Browsing the Rhythmbox Library


    The Rhythmbox Library, which you can make visible by clicking Music in the left
    pane of the Rhythmbox window, is a collection of all the music you add to it.
    This can prove to be a bit unwieldy as your collection grows. Fortunately, Rhythmbox
    has a nicer browser function, like the one in iTunes, which can be toggled on
    and off by clicking the Browse button, at the top left of the main pane. This
    function allows you to see lists of artists and albums in two separate panes above
    the main Library list. If you click a specific artist in the Artist pane, a list
    of albums by that artist will appear in the right pane. You can double-click one
    of the albums in that right pane to play it. If you want to play all the albums
    you have by that artist, double-click the artist''s name in the left pane. In
    all in, it''s a very handy function.


    If you want to add a layer of categorization to the browser, you can do so by
    adding a Genre pane. To do this, just go to the Edit menu, select Preferences,
    select the General tab of the window that appears, and select Genres, artists,
    and albums. After clicking the Close button in the Preferences window, you will
    have a three-pane browser in Rhythmbox (Figure 14-5).


    # Creating Playlists in Rhythmbox


    Of course, you can tailor things even further to match your situation and every
    mood. There are days, after all, when you''re feeling a bit too ethereal (and
    thank goodness for that). To prepare for such moments, you can create playlists,
    which are lists of songs to be played in a predetermined order. Just think of
    each playlist as an all-request radio station... where all the requests are your
    own.


    ![](img/d35fa962e6f9664d66dc83916f426418_287_0.png)


    Figure 14-4: Ripping CDs from Rhythmbox


    250 Chapter 14'
  merge: -1
