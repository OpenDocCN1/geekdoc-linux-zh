    # Online Gaming


    With all this talk of installing games, it''s easy to forget that there are many
    games that you don''t have to install at all. Numerous websites allow you to play
    online for free, as long as you have the proper browser plug-ins installed. (See
    “Multimedia Plug-ins” on page 62 for help installing plug-ins.) For example, check
    out http://www.popcap.com/, http://www.freeonlinegames.com/, and http://gametrick.net
    for some great online time was. You can also play any of the games found on Facebook
    or other social networking sites, such as Farmville and Mafia Wars, without ever
    leaving the comfort of your Ubuntu desktop.


    # Searching for More Games


