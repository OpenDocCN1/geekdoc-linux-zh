  md: '# 6


    # # ROUNDING OUT THE BIRD


    Downloading, Installing, and Updating Programs the Easy Way


    ![](img/d35fa962e6f9664d66dc83916f426418_114_0.png)


    Ubuntu has a lot of useful apps installed right from the get-go—“out of the box,”
    as it was. You’ve got a web browser, an email client, a full office suite, music
    player, solitaire. . . . What more could you want? Well, no matter how much is
    crammed into the default install, it''s always good to have options. And Ubuntu
    is all about options.


    Software installation works differently on Ubuntu than what you''re used to. On
    Windows, you might have to hunt around on a website to find an .exe file to download
    or go to a store and buy a CD with the software on it. You''d then run the installer
    and click through a seemingly endless process of options and questions before
    it decides to start installing your new application. On Mac OS, you might have
    to do something similar, although with a little less hassle.


    Ubuntu, on the other hand, has the Software Center—a veritable one-stop shop for
    all of your software needs. No need to hunt around online for a download or wait
    for an install CD to arrive in the mail. No need to tell some snoty installer
    your shoe size and favorite color either. No, the Software'
  merge: -1
  img_proc: true
- pgno: 115
  md: 'Center does it all for you, with a minimum of fuss. In many ways, it’s the
    “app store” on a smartphone, where you can get the latest and greatest apps with
    little more than a click.


    The engine behind this, called Advanced Package Tool (APT), allows you to easily
    download, install, update, and remove software in DEB archives, or packages.


    APT is a pretty foolproof way of installing programs; nothing will go missing,
    since APT automatically downloads and installs any file that the application you
    are installing requires to run. Tracking down such files, called dependencies,
    used to be a significant headache for Linux users. The painful quest of finding
    and then installing this file or that, as well as any dependencies those files
    themselves might have, has led to the missing dependency being referred to as
    “dependency hell.” APT makes that pretty much a thing of the past.


    So, where does APT find all these files and applications? When APT searches for,
    downloads, and installs are located in a set of specific repositories. These repositories
    are online servers on which we have a number of applications, support files, and
    more are stored for use with your system. All of the files that originally bundled
    with your system, including the system (kernel) itself and updates, when available,
    are stored too.

    consider a problem that it is a command-driven application. This means you control
    it by typing commands in a command Terminal. That’s where the Software Center
    comes in—it’s a frontend to APT. Broadly, this means the Software Center controls
    APT, running all of the commands needed to install software in the background,
    without needing to worry about them. Neat, huh? In this chapter, you’ll learn
    all about the Software Center, as well as a couple of other frontends that you
    might come across from time to time.


    # Project 6A: Installing Applications via the Ubuntu Software Center


    The most graphically satisfying of the frontends, the Software Center is especially
    useful when it comes to browsing for cool or handy applications. To get a feel
    for it, click the Launcher icon, which looks like an orange bag with stuff exploding
    the top (if you hover your mouse over it, the words Ubuntu Software Center will
    pop up). The window that opens will look similar to Figure 6-1.


    It may not be the first to catch your eye, but the number at the very bottom of
    the window tells you how much stuff there is available to download from the Software
    Center. As this book went to press, there are 41,091 items—to keep anyone busy
    for quite some time. Thanks to Ubuntu’s open source origins, most of those items
    are completely free to download. That’s a lot of software to choose from, at a
    price you can’t argue with. There’s also an increasing amount of commercial software
    available (more on that later).'
  merge: -1
  img_proc: true
- pgno: 116
  md: '# Ubuntu Software Centre


    For now, or on earth are you supposed to waged against the gigantic mound of software
    that’s just been dumped on your doorstep? The Software Centre has a few routes
    to open. On the left side of the window is a list of categories. If you click
    any of them, you will jump to a list of all the items available for category,
    possibly with more subcategories for you to explore, as in Figure 6-2. Applications
    that are already installed are marked with a green checkmark over their icons,
    those that are not installed just display the plain icon. Each application also
    has a rating, telling you how good other users think it is. In all, it looks and
    acts very much like an online store—think of it as an Amazon.com for Ubuntu software.


    To see a list of all installed programs, click the Installed button on the toolbar
    at the top of the window. A list of categories will appear; click any of them
    to see a list of what’s already installed. You will have already seen many of
    the listed applications before, in the Dash or the Launcher. Now, take a look
    at the bottom of the list. You’ll find a small button if you’d like to show a
    large number of “technical items.” Click the button if you like; the screen will
    update, and then you will open up some of the categories, you’ll find more items
    in the list, of them unfamiliar. What you’re looking at are the hundreds of other
    applications and tools that are installed by default in Ubuntu, ones that you’ll
    never use yourself. You see, the Software Centre isn’t just a way of getting your
    hands on new, exciting apps. It also keeps track of important system software
    that is necessary for Ubuntu to work—the “technical items” that the button refers
    to.


    Rounding Out the Bird 79'
