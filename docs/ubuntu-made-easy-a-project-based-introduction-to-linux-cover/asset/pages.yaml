    # History


    The problem with bookmarks is that you have to remember to bookmark a page in
    the first place. That''s all well and good if a website strikes you as keeping
    for when you first visit it, but what if you found a few days ago that seem important
    only in retrospect? For such eventualities, Firefox keeps a detailed history of
    all the websites you''ve visited over the last few months, or even longer. To
    view your browsing history, click **View Sidebar** and select **History** or CTRL-H.
    This will bring up the **History sidebar**, which has a full list of websites
    you''ve visited, sorted by date. You can browse or search through them, just as
    you could with the Bookmarks toolbar. Clicking any of the pages in the list will
    bring it up in the main Firefox window.


    To find a page, it''s also possible to sort the list by something other than date.
    Click the **View** button immediately to the right of the search box in the History
    sidebar and select one of the options from the menu that pops up to re-sort the
    list. For example, to view your browsing history grouped by website, rather than
    by date, select **By Site**.


    Of course, traw through your web history every time you want to find a previously
    viewed website isn''t everyone''s idea of fun. To end this, Firefox has what I
    think you''ll agree is a awesome feature: the Awesome Bar. This is actually just
    another name for the address bar, which might leave you with the impression that
    there''s perhaps more to the dull text'
