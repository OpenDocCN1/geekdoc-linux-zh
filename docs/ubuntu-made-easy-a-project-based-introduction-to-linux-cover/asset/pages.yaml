  md: '# Chatting with Your Friends via Empathy


    Email is an extremely useful tool, but there''s often quite a delay between sending
    a message and getting a response. If you just fancy a quick chat? That''s where
    instant messaging (IM) comes in. If you''re not familiar with the concept, all
    you do is find your friend on an IM network and type a short message to him. Your
    message will show up on his screen in the blink of an eye. He can then reply to
    it, and you receive the reply just quickly. So it continues, until you say goodbye
    and disconnect from the network.


    There are lots of different IM networks out there, as AIM, Google Chat, MSN/Windows
    Live, and Yahoo! Messenger. You can usually talk to people who are using the same
    network as you, and you''ll need an IM client application to connect to any of
    them. Ubuntu comes preinstalled with a fully featured IM client called Empathy,
    which has the ability to connect to multiple networks at.


    # Starting a Chat


    For this section, I''m going to assume that you already have a user account on
    an instant messaging network. If you don''t, you''ll need to go to the network''s
    website and sign up (most of them are free). With your account details ready,
    let''s get Empathy connected to your chosen network.


    +   1. Open the Messaging Menu by clicking the envelope icon on the top panel
    and then click Chat. The Empathy Accounts will open.

    2. Change your name and nickname if you like and then click Connect.

    3. You''ll be taken to the Messaging and VoIP Accounts window, which will tell
    you it''s searching for people nearby. Ignore this for now, and click the + button
    underneath on the left side of the window.

    4. Select your IM network from the drop-down list at the top of the window that
    opens and then enter your account details (Figure 5-18). You''ll normally need
    to enter at least your username and password.


    ![](img/d35fa962e6f9664d66dc83916f426418_107_0.png)'
  merge: -1
  img_proc: true
- pgno: 108
  md: '+   5. Click Apply to finish up.

    6. Empathy will attempt to connect to your IM network. If it''s successful, your
    contacts will appear in the Contact List window, and a few other options will
    appear in the Messaging and VoIP Accounts window. You don''t have to do anything
    from here—you''re now fully connected. If Empathy is not successful in making
    a connection, it will tell you so by displaying a message in a colored bar at
    the top of the window. A number of things could gone wrong, but the most common
    issue is an incorrectly entered username or password, so click Edit Connection
    Parameters and try entering your details again.


    Your account should be set up and ready to go, so let''s take it for a test run.
    If someone is online and available to chat, she''ll have a green speech bubble
    icon near her name. A new window will appear—type a message into the chat at the
    bottom of the window and then press ENTER to send it (see Figure 5-19 for an example).
    Your messages, and those of your friend, will be displayed in the main part of
    the conversation screen. Ending a conversation is easy too—just close the conversation
    window.


    ![](img/d35fa962e6f9664d66dc83916f426418_108_0.png)


    Figure 5-19: Chatting with friends using the Empathy IM client


    It''s okay to close the Contact List window at any point; you''ll remain logged
    in to the IM service, so you''ll still be able to send and receive chat messages.
    If you want to start a new chat with someone, you''ll need to have the Contact
    List in front of you before you can do anything. To bring it up again, click the
    Messaging Menu and click Chat. The Contact List will reappear, and you can start
    a new chat by'
  merge: -1
  img_proc: true
- pgno: 109
  md: 'as before. This is also how to open up Empathy when you log in to Ubuntu.

    Unlike some applications, Empathy does not start automatically when you log in,
    so you need to start it manually by selecting Chat from the Messaging menu.


    I''ve only scratched the surface here. Empathy has lots of other features that
    you might want to try: You can send pictures and files to people, make phone and
    video calls, broadcast your location using geotagging, and even display your desktop
    on someone''s computer screen. Explaining all of this would probably take a whole
    chapter on its own, so I''m going to point you toward Empathy''s user guide, which
    should give you the lowdown on what else you can do and how you can do it. In
    any Empathy window, select Help > Contents, wait a few seconds for the help to
    pop up, and then look through the list of topics until you find something relevant.


    # Telling People You Don''t Want to Chat


    ![](img/d35fa962e6f9664d66dc83916f426418_109_0.png)


    Chatting is great, but very few people have the stamina (or spare time) to do
    it all day long. It can be annoying if people try to start conversations while
    you''re busy. Unfortunately, there''s an easy way to let everyone know you don''t
    want to be disturbed. Open the Messaging menu. Your current status will be marked
    out by a small white circle at the top of menu. If you''re connected to an IM
    network, the circle will be the green Available status, which means that other
    people can tell you''re online. Click any one of the other items to choose a different
    status (Away or Busy, for example) from the menu (Figure 5-20). Depending on the
    status you choose, other people will be told that you''re busy when they try to
    start a chat or won''t be able to see that you''re online at all. Peace and quiet,
    only a couple of clicks away.


    Figure 5-20: Changing your instant messaging status


    # Microblogging—Twitter and Friends


    Blogging (writing an diary/journal) is now a well-established Internet pastime.
    There are millions upon millions of blogs out covering all sorts of subjects,
    from astronomy to fluffy kittens. The quality of content varies wildly; for the
    most part, blogs are entry newspaper-opinioncolumn types of pieces. So, what if
    you had a blog where you were forced to write everything you wanted to say in
    less than 140 characters? The idea behind microblogging: making frequent, short,
    bullet-like posts.


    Twitter is the most well-known blogging website (http://www.twitter.com/). People
    use all sorts of uses for Twitter: You can let your friends know what''re up to
    at the moment, receive breaking news, discuss popular topics with other users,
    write posts using your mobile phone . . . the list goes on. I recently followed
    a Twitter conversation among a few of my friends who'
  merge: -1
  img_proc: true
- pgno: 110
  md: 'were watching a live football game. They sent messages every time something
    exciting happened, so I was able to follow the action textually, within seconds
    of it happening. News travels fast on Twitter.


    Perhaps it''s the sort of thing you need to appreciate, if you don''t have an
    account already, follow the instructions on the Twitter home page to sign up for
    one. Once you''ve done that, take a look around the website to see how things
    work. The basic idea is that you post messages (tweets) for followers to see.
    People can choose to follow you by clicking a button when they view your user
    profile. You can choose to follow other people too—when you do this, all of their
    tweets will be displayed on the Twitter home page for you to read. Most people
    follow a few people and typically have a handful of followers themselves, but
    there are no restrictions on how many of each you can have.


    Ubuntu''s portal to the world of microblogging is Gwiber. Let''s get it up so
    you can see what it can do:


    +   1. Open the Messaging Menu by clicking the envelope icon on the top panel,
    and this is the first time you''ve done this, select Setup Broadcast Account.
    The Broadcast Accounts window come up, asking what sort of account you''d like
    to add.

    2. Several types of accounts are available, but I''ll use Twitter in this example.
    Select Twitter from the drop-down list and click the Add button just below it.

    3. A Twitter account screen, like the one in Figure 5-21, will appear. Click Authorize
    and then enter your Twitter username and password in the window that appears.


    ![](img/d35fa962e6f9664d66dc83916f426418_110_0.png)


    Figure 5-21: Entering your Twitter account details


    Slipping and Sliding 73'
