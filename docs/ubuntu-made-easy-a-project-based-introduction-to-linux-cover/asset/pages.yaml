- pgno: 60
  md: 'thing from backup onto your new Ubuntu system manually after the installation
    has finished. If a migration window appears, just check the boxes next to the
    items you want to transfer and then click Continue.


    +   15. Wait for installation to finish. Now, with all of your details having
    been entered, the installer will continue to do its thing. Sit back and watch
    the Ubuntu slideshow. The progress of the installation will be indicated in the
    bar below it that you don''t have to fret (and so you will know how much more
