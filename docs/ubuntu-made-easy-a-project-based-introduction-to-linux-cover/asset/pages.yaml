- pgno: 338
  md: 'Some, like Doom III, Unreal Tournament, and Enemy Territory, come with a Linux
    installer out of the box. The installation instructions, which you can find somewhere
    on the install CD/DVD, usually amount to little more than running an install script
    from the Terminal. The availability of a Linux installer on the same disc as the
    Windows version is still somewhat of a rarity among blockbuster titles though,
    so it''s often necessary to look online for it. A list of commercial games, some
    free and some for a price, along with links to their Linux installers, can be
    found at http://icululus.org/lifaq/gamelist.php. Wikipedia also has a list of
    Linux games that are kept up-to-date: Start at https://en.wikipedia.org/wiki/Linux_gaming
    and where the links take you ....


    If spending the afternoon scouring the Web for decent games doesn''t sound appealing,
    how about letting someone else collect the gems for you? That''s what the splendid
    Humble Bundles are all about: They''re collections of cross-platform games (all
    of them can run on Linux, Windows, and Mac OS) that are occasionally available
    on a “pay you want” basis. Depending on how much you choose to pay, you might
    also get access to bonus games and features. As an added incentive, very often
    some of the games in the bundle are open sourced as good. What happened to Gish
    (in which you play a happy little blob of tar slipping and rolling through various
    levels and mini games) and Lugaru (Figure 17-15), which features a rabbit, skilled
    in the martial arts, on a quest to avenge the deaths of his family and friends
    against rabbit conspirators. Both of these are now available in the Ubuntu Store
    for free.


