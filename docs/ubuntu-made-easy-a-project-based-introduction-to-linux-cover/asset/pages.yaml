  img_proc: true
- pgno: 66
  md: '# The Desktop


    The biggest part of the Unity desktop environment is the desktop itself. It is
    completely empty out of the box, to speak, and it is not as thoroughly utilized
    as it is in Windows and Mac OS systems or even in other Linux desktop environments.
    This is not to say that you cannot use the desktop in some the ways you might
    be familiar with, but as is, there are basically two things you can put there
    as: documents and Folders. To create a folder on the desktop, right-click anywhere
    on the desktop and select Create New Folder. You can then drag, copy or paste,
    anything you want to that. Of course, if you want to drag your documents or folders
    to the desktop, you can do that too.


    # The Launcher


    The most unfamiliar part of the Unity desktop environment will likely be the Launcher.
    The Launcher, as I mentioned earlier, is strip of icons that appears on the left
    side of the desktop. In some ways the Launcher functions very much like the Mac
    OS Dock. Out of the box, it comes with Launcher icons for some of the most commonly
    used, folders, and utilities. Also, just as in the Mac Dock, when you run any
    other application, a Launcher icon for that application also appears.


    # Working with the Launcher


    Now that you''re familiar with the parts of the Unity desktop environment, it
    is time to look at it in more detail. Since the Launcher comes a conspicuous (and
    important!) part of the desktop, I''ll start there. By default, the Launcher contains
    a scattering of icons, which are essentially shortcuts that help you to get to
    the most important tools and applications in your system. Starting from the top,
    here''s what you''ll find:


    +   - Dash Probably most important part of your system, the Dash is the place
    from where you more or less do it all: finding and running documents, applications,
    and other files on your system.

    - Home folder Here''s where all your files are stored and drives and devices shown.

    - Firefox This is the default web browser in Ubuntu.

    - LibreOffice Writer This is Ubuntu''s bundled word processor.

    - LibreOffice Calc And this is the spreadsheet application that comes with Ubuntu.

    - LibreOffice Impress Here you find Ubuntu''s PowerPoint alternative.

    - Ubuntu Software Center All the applications and other support files available
    for Ubuntu are accessed here.'
  merge: -1
  img_proc: true
- pgno: 67
  md: 'Ubuntu One This helps you to install, set up, and connect to Ubuntu’s Ubuntu
    Service, which provides you with your own “personal cloud.” From here you can
    share files among your various devices.


    System Settings Opens the System Settings window, which is an access point to
    commonly used system settings such as keyboards, monitors, sound, network, and
    more.


    Workplace Switcher Reveals and allows you to switch among the usually unused portions
    of your desktop workspace. This is discussed in greater detail in “Workspace Switcher—Virtual
    Desktops” on page 37.


    Trash I believe no introduction is necessary. It is just what it looks like.


    Using the Launcher is pretty intuitive. To run an application or a file or folder,
    just click it. If you right-click any icon in the Launcher, a menu will appear
    with choices that varies by the item and when it is not already running or open.
    At the very least, you will be given the choice to lock the icon to the Launcher
    or unlock it from the Launcher. The only exceptions to the lock/unlock option
    are the Dash, Trash, and System Switch. Stay where they are, like or not. For
    many other Launcher icons, there are other options, as you can see in Figure 3-7,
    which shows those for LibreOffice Writer.


    ![](img/d35fa962e6f9664d66dc83916f426418_67_0.png)


    As I mentioned, you can easily add icons to the Launcher or remove those you don''t
    really or want to be there. To add an icon, run the app you want to add, right-click
    its icon in the Launcher and select Lock to Launcher. To remove a Launcher icon,
    just right-click and select Unlock from Launcher. For emptying the Trash, since
    it''s in the neighborhood, let''s talk about it: just right-click the Trash icon
    and then select Empty Trash.


    If you end up placing a lot of icons on the Launcher, or if you happen to have
    a lot of applications at the same time, you will find that the icons at the bottom
    of the Launcher getget, as in Figure 3-8. If you just move your mouse down to
    the bottom of the Launcher, however, the contents will start moving up, with each
    button uncrunching in turn. You can then click the Launcher icon you are looking
    for without any difficulty. Once you''re done, the icons will return to their
    previous saving state.


    ![](img/d35fa962e6f9664d66dc83916f426418_67_1.png)'
  merge: -1
