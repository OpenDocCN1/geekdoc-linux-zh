    Profiles > Profile Preferences. When the Editing Profile window opens, click the
    tab for the part of the profile you want to edit. For example, to add a background
    image, click the Background tab, select Background image (Figure 8-18), and navigate
    to the photo you want to use as your background by clicking the Menu button next
    to the Words file and finding the file in the Select Background Image window.
    Once you''ve found the photo of your choice, click Open. Depending on the image
    you use for your background, you may find it difficult to select text your image
    appears in the Terminal. If so, try moving the slider under the words Shade transparent
    or image background in the Editing Profile window. If that still doesn''t work,
    click the Colors tab, select Use colors from system theme, and then try one of
    the preset Foreground and Background combinations from the menu button next to
    the words Built-in schemes.


