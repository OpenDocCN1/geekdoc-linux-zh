- pgno: 91
  md: '![](img/d35fa962e6f9664d66dc83916f426418_91_0.png)


    **Figure 4-9:** Choosing a broadband billing plan


    To connect to mobile broadband, click the Network icon on the top panel and choose
    your broadband service from the list. Network Manager will spend a few seconds
    establishing the connection, after which you''ll be notified that you''re connected
    (or not, as the case may be). Disconnecting happens in just about the same way:
    Click the Network icon again but this time click **Disconnect** just below the
    name of your broadband service when the list pops up.


    # I''m Connected . . . So Now What?


    Ideally you''re cabled in, wired up, or otherwise happily connected to the Internet.
    (If not, take a look at Chapter 22 for some connection-troubleshooting tips.)
    That''s great news, because now you can put Ubuntu through its paces by trying
    some of the the interesting web-related software that comes preinstalled. Prime
    your clicking finger for action and flip the page to see what life online is like
    for a new Linux user.'
