- pgno: 444
  md: '# UBUNTU DESKTOP

    64-BIT DISCS


    ![](img/d35fa962e6f9664d66dc83916f426418_444_0.png)


    As I mentioned in Chapter 1, the version of the Ubuntu Desktop CD that comes with
    this book is designed to work with i386 pro-cessors, in either PCs or Intel-based
    Macs. It will also work with AMD64 or Intel Core 2 processors, albeit not in 64-bit
    mode. In order to use Ubuntu with these processors (or any other machine based
    on AMD64 or EM64T architecture) in 64-bit mode, you must get a different disc
    on your own. There are a few ways to do this: downloading an ISO (disc image)
    and then burning it to disc yourself or ordering the disc from an online Linux
    disc provider.


    # Downloading and Burning Ubuntu Desktop ISOs to Disc


    To download an ISO of the 64-bit version of the Ubuntu Desktop disc, go to the
    Ubuntu website at http://www.ubuntu.com/, find the link to the download page,
    and select and download the 64-bit version. Remember that the ISO file you will
    be downloading is a heavyweight, weighing in at 700MB, so'
  merge: -1
  img_proc: true
- pgno: 445
  md: 'the download will take a bit of time. Don''t count on getting it all downloaded
    and before dinner ... or, if you happen to be using a dial-up Internet connection,
    before dinner tomorrow. Yikes!


    # Burning the ISO to Disc in Windows


    Once the Ubuntu Desktop CD ISO has been downloaded, you need to burn to CD before
    you can use it. Although Windows has built-in disc-writing capabilities, not all
    versions have the built-in ability to burn ISOs. To burn an ISO to disc in Windows
    7, just right-click the ISO file, select Burn disc image, and then click the Button
    in the window that appears. In all other versions of Windows, you must use a third-party
    commercial application, such as Nero. If you don''t have a commercial disc-burning
    utility installed on your system, try the free and handy ISO Recorder.


    To get ISO Recorder, visit http://isorecoder.alexman.com. Once the download is
    complete, double-click the ISOSetup.msi file on your hard disk to install it.
    After the installation is finished, burn your ISO to disc by clicking the Ubuntu
    ISO file on your machine and selecting Open with ISO Recorder is pretty intuitive,
    if you like your directions clearly laid out, set it available online at http://isorecoder.alexman.com/HowTo.htm.


    One thing to bear in mind when making your installation disks is that it is generally
    better to burn or install at a speed lower than the maximum speed allowed by your
    drive in order to reduce the chance of error (with 2X to 4X speeds considered
    optimal). To do so, make your choice from the Recording speed drop-down menu.
    Next, pop a blank disc into the drive and click Next. The CD-burning process should
    begin. Once its'' done, the CD should pop out of the drive, and if all goes well,
    you''ll have yourself an AMD64-compatible live CD. You can then use it by following
    the directions at the beginning of Chapter 2 for using the live CD that you come
    with this.


    > If your CD does not seem to work, there could be a problem with the ISO file
    you downloaded. Find out by doing an integrity check as explained at https://help.ubuntu.com/community/HowToMD5UM/


    # Burning the ISO to Disc in OS X


    Ubuntu no longer comes in PowerPC, the i386 engines can be installed and run on
    Intel-based Macs. You can also, of course, download ISOs for other architectures
    on your Mac and then burn them to CD for use on other machines.


    To burn an ISO file to CD in OS X, first check to make sure the ISO image is not
    mounted by a Finder window and checking the disc in the area at the top portion
    of the left pane. If the disc is mounted, a drive icon will appear in that location.
    If the drive is not, click the arrow next to eject, or unmount, it.'
  merge: -1
  img_proc: true
- pgno: 446
  md: 'After that, click Applications in the same Finder window and then look for
    and open the Utilities folder. In that folder, find and double-click Disk Utility.
    If the ISO is not listed in the left pane of the Disk Utility window when it opens,
    go back to the Finder window, locate the Ubuntu Live CD ISO you just downloaded,
    and drag it to the left pane of the Disk Utility window, just below the listings
    for your current drives. Once the ISO file appears in that, click it to highlight
    it.


    To complete the process, click the Burn icon in the Disk Utility''s toolbar aind,
    when prompted to do so, insert a blank CD into your drive. Once the blank disc
    is inserted and recognized, you will be able to adjust the burn speed from the
    drop-down menu next to the word Speed. Select as low a speed probably 4X to 8X,
    which, depending on the age of your Mac, will allow. Finally, click the Burn button
    in that same window, and the burning process will begin.


    # Ordering an Install Disc from Other Online Sources


    While it is possible to buy Ubuntu Desktop CDs from the Ubuntu store (https://shop.canonical.com/),
    only the 32-bit version is available, which is the same version that comes with
    this disc. You can, however, order a 64-bit version from an independent online
    source, such as OSDisc.com (http://www.osdisc.com/).'
  merge: -1
  img_proc: true
