    to make sure that everything is hunky-dory. The results of its checks will be
    shown at the top of the Preparing to install Ubuntu page of the wizard (shown
    in Figure 2-6). A green checkmark means that everything is okay, and a gray cross
    means that something was wanting. The main thing is to make sure the installation
    has found enough drive space to make it happy; if not, the installation can''t
