    drive when it''s automatically ejected, pressing ENTER when prompted to do. Your
    machine will restart.


    After . . . well, that''s basically it. You now have Ubuntu installed on your
    machine. Congratulations!


    # How Can I Get Back into Windows?


    If you installed your system in a dual-boot configuration, with Ubuntu alongside
    Windows, you should see a new boot menu appear when the computer starts up. After
    10 seconds, Ubuntu will boot up automatically, but you can just hit ENTER to speed
    up the process.


    If you want to start Windows instead, use your keyboard''s arrow keys to select
    the Windows option in the boot menu and then hit ENTER. Windows should start as
    normal. Take a look at Chapter 19 if you want to make Windows the default or change
    the boot time delay.


    # Oh No, My Computer Won''t Boot!


    If the installation process fails, you may not be able to boot your computer.
    Frankly this is very rare—but if it happens to you, don''t panic! There''s plenty
    you can do to get up and running again, so flip your way to Chapter 22 for some
    troubleshooting advice.'
