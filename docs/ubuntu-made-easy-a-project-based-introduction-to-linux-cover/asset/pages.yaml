    you would get if working on JPEG files. Once you have made your adjustments to
    the RAW files, you can save them into other, more universally compatible formats,
    such as JPEG, while retaining your original RAW file for future use.


    ![](img/d35fa962e6f9664d66dc83916f426418_275_0.png)


