- pgno: 266
  md: '# 13


    # RIGHT-BRAIN PENGUINS


    *Linux Does Art*


    ![](img/d35fa962e6f9664d66dc83916f426418_266_0.png)


    Now that you know you can get down to business in Linux, it is time to don that
    beret of yours and address the artistic side of things. Linux does art, and as
    you will soon find out, a good number of programs on your system allow you to
    create and manipulate graphic files. These days, however, there is perhaps nothing
    so important to most users'' graphical repertoires as their digital cameras, so
    that is where we''ll begin.


    # Where the Apps Are


    The majority of apps in this chapter can be run from the Dash by clicking the
    Applications lens and then clicking the **Graphics** filter button. Exceptions
    are noted in the relevant sections. As with all applications, you can also run
    an app by typing its name in the Dash''s search box and then pressing ENTER.'
