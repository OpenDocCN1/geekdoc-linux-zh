    ![](img/d35fa962e6f9664d66dc83916f426418_421_0.png)


    Figure 22-7: The Sound settings window


    # My Microphone Doesn’t Work


    As long as your sound card is detected correctly by Ubuntu, any microphone with
    a standard audio jack connector (similar to the connector on head-phones) should
    work.


    To test your microphone, click the speaker icon on the top panel and select Sound
    Settings from the menu that pops up. In the Sound window that appears, go to the
    Input tab (Figure 22-8). You’ll see an Input level indicator, which should dance
    up and down when you make a sound. If nothing happens to the indicator when you
    make a noise, your microphone isn’t being picked up, so try some of the following
    tips:


    +   Plug it in. Check that the microphone is plugged in the correct socket (it
    should be marked by a small microphone symbol and is often pink). Also, be aware
