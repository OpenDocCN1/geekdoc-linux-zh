  md: '# 9A-2: Logging In to Your New Account


    When you create a new user account, it will automatically appear in the User menu,
    which appears when you click your username in the right end of the panel. Click
    that account name, and after a few seconds, you will be at the login screen. The
    username for the new account should be highlighted, but if it is not, click it
    once, type the password for the account, and press ENTER. Within a few seconds,
    you will be at the new, untouched desktop of your justcreated user. When you want
    to get back to your original user account, just follow the same procedure but
    instead select your original user account in the menu. Pretty cool.


    When you switch users, as I described, all the programs you have running and windows
    you have open are put on hold, waiting for you to come back. In other words, you
    will return to your original account with everything as it was when you left—your
    browser still open to whatever it was open, the same image being edited in the
    GIMP, and your résumé still open in Writer. This is very convenient when you are
    switching between accounts or when your child needs to log in to yours for a moment
    to do a quick email check, burn a CD to play on the beach, or print a file for
    school. When your child is done, you can quickly get back to what you were doing
    without having to reopen files, web pages, or whatever you were dealing with.
    You can also see which accounts are open when you click the User menu at the right
    end of the panel (Figure 9-3). All open accounts, dormant or active, will have
    to the right of them, while the account that is open and currently active will
    also have a dot to the left of its menu entry.


    Figure 9-2: Inputting a password for the new user account


    ![](img/d35fa962e6f9664d66dc83916f426418_198_0.png)


    ![](img/d35fa962e6f9664d66dc83916f426418_198_1.png)


    Figure 9-3: Switching between accounts


