    # Switching Off or Refreshing Your Wireless Connection


    Sometimes you will want to disconnect from a wireless network, such as when

    y use your laptop on an airplane or when you just want to connect to a dif-

    erent network, as you might when moving your laptop from one wireless

    hotspot to another.


    To do this, click the Network icon to reveal the list of all wireless

    networks (that is, signals). In that list, click the Dis option below

    the of the wireless network to which you are connected. Within a second

    or two, you will be disconnected.


    If you want to turn off your wireless card (as you should do if you''re board-

    ing an airplane) and you don''t have a physical way to do it, like a switch or
    a

    button, click the Network icon and then select Enable Wireless. And

    if you want to turn that card back again, just get back to that menu and

    select Enable Wireless again.


    Sometimes, your wireless card might lose connection for no apparent

    reason, so you will want to refresh the connection (that is, turn it off and

    again) to get it back. The quickest way to do this is to click the Network

    icon and then click the name of the wireless network you''re currently con-

    ected. You will be disconnected and automatically reconnected.


    If that doesn''t work, try disabling and enabling the wirelessnec-

    ing the Enable Wireless option, as described earlier. If you still have

    no luck, try turning the wireless card off and on again using a switch or but-

    ton, if you have one, unplug it and plug it back in again. Finally, if nothing

    seems to be working, try restarting the computer.


    # Connecting with a DSL or ADSL Modem


    How easy is it to set up your DSL or ADSL modem upon the connector

    that has. If it can be connected using an Ethernet cable, then and follow

    t instructions in “Setting Up a Wired Connection” on page 43; it’ll be

    much easier trying to use a USB cable! If you have a USB or internal

    modem, try the instructions in this section and hope for the best.


    The first step is to check whether Ubuntu recognized your modem.

    Assuming the modem is already plugged in, click the Network icon on the

    top bar, select Edit Connections from the menu that appears, and select

    DSL tab. If a connection is listed in window, your modem was recog-

    nized, and you can begin setting it up. If it is empty, refer to https://nhelp.ubuntu.com/community/UsbAdsModem/
    to see whether there are any steps

    y can follow to get your modem working. Alternatively, flip to Chapter 21

    see how you can ask for help with setting up your modem from members

    of the Ubuntu community.'
