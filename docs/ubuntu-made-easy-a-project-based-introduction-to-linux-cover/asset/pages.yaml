    Your system will send a document to your printer and let you know it has done
    so in a small window, which you can close. The printer should print the test shortly.


    **NOTE** If your test page didn''t come out the way or if your printer was not
    configured automatically by the system, check out http://www.openprinting.org/printers/
    to see whether there are any special requirements or caveats for your model.


    # Setting Up Wireless-Enabled Printers


    Printers with built-in wireless (Wi-Fi) adapters are becoming increasingly common.
    You normally have the choice of connecting in the traditional way, using a USB
    cable, or by setting them up to connect to your wireless network. In the latter
    case, any computer that is also connected to the network can access the printer.
    Neat, huh? If you have such a printer and would like to make use of its wire-free
    capabilities from your Ubuntu machine, read on:


    +   1. Make sure that the printer is turned on and connected to your wireless
    network. Exactly how you do this varies depending on the machine and model of
    printer, so check out the printer''s manual for instructions.


    +   2. You''ll need to get a couple of vital pieces of information about the printer''s
    wireless network settings before you can continue. In particular, you are looking
    for its IP address. The printer will probably have a way of displaying this, either
    through a small built-screen or by printing out an information page. Check the
    printer for details.


    +   3. With the printer''s IP address in hand, get back in front of the Ubuntu
    computer and click the power button on the far right of the top panel. Select
    **Printers** from the menu that appears, and a Printing window will appear.


    +   4. Click the **Add** button, after which the New Printer window will appear.


    +   5. Select **Network Printer ▸ Find Network Printer** in the left pane of that
    window by clicking that entry once. Now, enter the printer''s IP address into
    the Host box, as shown in Figure 10-4. (Note that your printer''s IP address will
    probably be different from the one you here.)'
  merge: -1
