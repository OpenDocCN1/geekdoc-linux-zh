  md: 'partitions—the disk partitioner will choose the right option for you, there''s
    no need to alter this setting (it doesn''t affect how you use the partition in
    any way). The other option, Location for the new partition, lets you choose where
    on the disk to put the new partition. It doesn''t really matter, so leave this
    option set to the default too.


    Click OK to finish adding the partition; it should appear in the list after second
    or two.


    # Editing Existing Partitions


    If you have an existing partition that you''d like to resize or whose mount point
    or filesystem type you''d like to change, select it and click Change. An Edit
    partition window will appear (Figure C-4).


    ![](img/d35fa962e6f9664d66dc83916f426418_451_0.png)


    Figure C-4: Editing a partition


    The Use as and Mount point options work in the same way as those in the Create
    partition window. You can also check Format the partition if you''d like all the
    data on it to be erased so you can start fresh. Be aware that you have no choice
    but format if you''re changing the filesystem of a partition (for example, from
    FAT32 to Ext4).


    To resize the partition, use the New partition size in megabytes option. If you
    change the size and then click OK, you''ll be warned that the changes will be
    written to disk. Click Continue, and the partitioner will restart to resize the
    partition immediately—you can''t undo this change, so think carefully about whether
    you''ve chosen the right options before clicking Continue.


    # Varieties of Partitions


    You''ll need to be familiar with a few varieties of partitions when you manually-partition
    your disk. I''ve summarized these in the following sections and provided some
    tips on choosing their size, mount points, and filesystems.'
