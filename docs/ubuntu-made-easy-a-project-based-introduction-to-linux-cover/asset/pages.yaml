    # What''s All This Bean Business?


    You might have noticed a lot of coffee and beans on your journey through the forums.
    Don''t worry—everyone wandered into a caffeine-addiction support group. Beans
    are just a way of keeping track of how many posts a person has made. (It''s supposedly
    an inside joke, referring to ''geeks'' love of coffee, but personally I can''t
    stand the stuff!) You''re given a bean for every reply or thread you make, and
    as you collect more beans, you''ll find that the description that appears under
    your name will change. As of this writing, I informed that my beans are green,
    with the changes of my ever becoming an “Ultimate Coffee Grinder” looking slimmer
    by the day.


    # Ask Ubuntu


    A newcomer to Ubuntu''s growing stable of help and support channels is Ask Ubuntu,
    a website for getting your Ubuntu-related questions answered. Although it''s not
    as established as the Ubuntu forums and doesn''t have the same friendly community
    chitch, it''s a great place to if you''re trying to answer a specific question
    or solve a problem. Check it out by visiting: http://www.askubuntu.com/


    On arriving at the Ask Ubuntu front page, you''ll notice a list of “Top Questions”
    running down the page, ranked by their number of “votes.” Users of the site ask
    questions, which other users can vote up or down in importance. The most important,
    interesting questions, as determined by the community, bubble up to the top of
    the list, give the most attention, and are thus more likely to get answered. You
    may have seen a similar sort of item in place new websites and sites like YouTube;
    insightful comments receive lots of votes and appear at the top of the list, whereas
    useless comments are buried down the page.


    Click any of the questions at the top of the Top Questions list, and you''ll find,
    in addition to the original text of the question, a number of comments discussing
    possible solutions. Some of these are marked as “answers,” which directly propose
    a solution to the question. Other users can vote answers up or down, the best
    answer (in principle) bubble to the top. In all, Ask Ubuntu is an efficient way
    of getting the information you need if you have a specific problem or question.
    If you''re not exactly what you''re looking for, however, the Ubuntu Forums are
    probably a better bet.'
