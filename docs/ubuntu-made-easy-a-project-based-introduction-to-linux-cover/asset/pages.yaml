  img_proc: true
- pgno: 452
  md: '# Root Partition


    You must have a root partition; it''s where important system files are stored
    and software is installed. I recommend making it at least 10GB in size, aim for
    12GB to 15GB, if you can, to leave room for installing new programs. if you''re
    not going to have a separate home partition (described in a moment), all of your
    files will be stored in the root partition too, so in that case should make it
    as big as possible to accommodate all your stuff. The mount point should be set
    to / and the filesystem to ext4.


    # Swap Partition


    You must have a swap partition. The swap partition is like an extra area of system
    memory (RAM); if your computer''s system memory gets full, it will start using
    this partition to handle the overill. Use of your system memory (like all of your
    open files and programs) when you hibernate the computer. See https://help.ubuntu.com/community/Swapfile/
    for more details on swap.


    As a rough guide, your swap partition should be a bit larger than the amount of
    RAM that your computer has. For example, if you have 2GB of RAM, make a 2.2GB
    swap partition. The filesystem should be set to swap area, and there''s no need
    to set a mount point.


    > It is possible to get away without a swap partition by creating a swap file
    after you''ve installed Ubuntu, but the method for doing this is beyond the scope
    of this book.


    # Home Partition


    The /home folder (see Chapter 7 for a description) can be put in a separate partition.
    You don''t need to do this, but it''s useful if ever goes wrong and you need to
    reinstall Ubuntu—all your personal files and configuration settings will be left
    intact on the home partition while Ubuntu is reinstalled on the root partition.
    This can save a lot of work when restoring your system. If you don''t have a separate
    home partition, the /home folder will be put in your root partition with everything
    else. The way you access your Home folder (for example, through the Launcher)
    will be exactly the same whether you put it on a separate partition or not.


    The home partition is where all your files and settings are stored, you''ll want
    to make it as big as possible. (For various perspectives on how big is enough,
    "Example Partition Layouts" on page 416.) The filesystem should be ext4, and the
    mount point should be set to /home.


    # Windows Partition


    If you have Windows installed, you will need to resize the Windows partition to
    make room for Ubuntu. When you do, be sure to leave at least enough disk space
    for Windows to function properly. Windows XP needs a partition at least 2GB in
    size, and for Vista and Windows 7 you should leave at least 16GB. You will probably
    want to leave more space than that you can'
  merge: -1
  img_proc: true
- pgno: 453
  md: 'install programs and save files when using Windows, and remember to leave space
    for your existing Windows files too. The Used column in the main partitioning
    window will tell you how much space your Windows files are currently taking up.


    Windows partitions will be of type NTFS or FAT32. Remember not to format the Windows
    partition, or your current installation of Windows will be erased.


    # Shared Partition


    If you want an easy way to share files between Windows and Ubuntu, create a shared
    partition. In both operating systems, it will appear as a separate hard disk,
    which you can use to store whatever you like.


    Make the partition as big as you think you''ll need: if you only cover small files
    between Ubuntu and Windows, then 1GB to 2GB should be plenty; if you want to permanently
    store all your Windows and Ubuntu files in there (sort of like a Home folder),
    make it as big as possible (see the next section for an example). You should choose
    FAT32 as the filesystem, you can also use anything for the mount point—windows
    will be one of the default suggestions, you could type something like /shared
    or /wormhole into the Mount point box if you liked. Just sure you use a name without
    any spaces in it.


    # Example Partition Layouts


    Partitioning can be confusing if you''ve never done it before, so I''ve provided
    a few example partition layouts that should make things clearer. In all of these
    examples, I''ve used a 100GB hard disk, but you can scale all the partition sizes
    up or down for your disk according to the "Varieties of Partitions" on page 414.


    # Standard Ubuntu-Only Installation


    Only Ubuntu will be installed on the disk, so only the root and swap partitions
    are needed (Figure-5). Since I have 4GB of RAM, I made the swap partition 4.2GB.
    The root partition filled up the rest of the disk to give me as much room for
    files and programs as possible. (There was no need to partition the disk manually
    in this case; the Ubuntu installer''s Erase and install Ubuntu, or Replace Windows
    with Ubuntu options, would have achieved the same result.)


    # Ubuntu-only with a Separate Home Partition


    Only Ubuntu will be installed, but there will be a separate home partition to
    keep my data safe in case I ever need to reinstall to store home movies on this
    one, which means lots of very large files, I went for a smallish 12GB root partition
    and a slightly undersized 4GB swap partition. This leaves more space for the home
    partition (and my videos), which takes up the remaining 84GB of the disk.'
  merge: -1
  img_proc: true
