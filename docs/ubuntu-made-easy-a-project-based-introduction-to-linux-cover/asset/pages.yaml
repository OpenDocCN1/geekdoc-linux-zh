  md: '![](img/d35fa962e6f9664d66dc83916f426418_317_0.png)


    Figure 16-4: Viewing YouTube videos in Movie Player


    # # An Alternative (and Arguably Better) Video Player: VLC


    Although Movie Player has made great strides since it first appeared, many users
    find it temperamental and quirky. Luckily there are alternatives, with a media
    player called VLC being the most highly recommended. VLC (Figure 16-5) is a very
    capable player with a big following, not only in the Linux world but in the Mac
    and Windows worlds as well. Like Movie Player, VLC handles audio files as well
    as video and audio streams, including YouTube. Unlike Movie Player, VLC just seems
    to work right, especially with DVDs, That’s the way things are supposed to be.


    ![](img/d35fa962e6f9664d66dc83916f426418_317_1.png)


    Figure 16-5: VLC media player


    280 Chapter 16'
  merge: -1
  img_proc: true
- pgno: 318
  md: 'VLC is not bundled with Ubuntu, so you will need to download it yourself from
    the Ubuntu Software Center. I''m pretty sure you won''t be disappointed.


    # Transferring Movies from Your Digital Camera to Computer


    Digital video cameras have been around for a number of years, though the impressive
    strides in video capabilities of still digital cameras and phones have resulted
    in many video enthusiasts not botherdering with dedicated video cameras at all.
    This means that people are creating their own videos more than ever, and with
    the ability to share video creations with family, friends, and the rest of the
    world via YouTube, it''s fair to say that home digital video is just about ubiquitous.


    Before you work with your videos on your computer, you will have to transfer them
    from your camera. Fortunately this is pretty easy, the process will vary slightly
    depending on the type of device you use to record your videos. Different devices
    store videos in different ways.


    # Transferring Video Files from a Camera with a Storage Card


    Most digital cameras and dedicated digital video cameras today store your videos
    as files on a memory card, the most common being an SD card. Transferring your
    files from these devices to your computer is straightforward, and there are a
    number of ways of going about it. While many video types can be imported via Shotwell
    in the same way you import photos, which is the video is saved on your camera.
    One way that always works, is to just transfer the video files from your camera
    to computer as you would transfer files from a USB drive. Here is what you do:


    +   1. Connect your camera''s USB cable to computer.

    2. Turn on your camera in play mode.

    3. In the dialog that soon appears, select Open Folder and click OK.

    4. A file manager window will appear. Double-click through the folders until you
    find your video files. You can recognize these by the file extensions, usually
    .avi, .mp4, .mts, or .m2ts.

    5. Drag the files you want to copy to Videos in the left panel of the window and
    release the mouse button. The files will then be copied to your folder.


    # Transferring Video Files from a Cell Phone or Another Mobile Device


    Most phones and other portable computing devices are now able to take good-quality
    video, and these files, usually in a MPEG4 format (with a .3pg extension) can
    also be transferred and edited on your computer. Although the process for transferring
    such files is usually simple, the exact steps can vary greatly from device type
    to device type. To find out how to transfer files from your phone or other portable
    device, please refer to Chapter 15.'
  merge: -1
  img_proc: true
- pgno: 319
  md: '# Capturing Digital Video from Cameras with Tape Storage to understand and
    deal


    The transfer methods we''ve covered so far are easy to deal with—you''re basically
    just finding your files and copying them from your camera to your computer. When
    you want to transfer a video clip to your computer from a digital video (DV) camera
    that saves its data on tape or from a video stream, however, there is no way to
    simply drag the file from one place to another. You have to capture the video
    stream to which you play it, and to do that, you need some sort of software solution.
    This is usually found in the form of a video editor; however, not all video editors
    have this capability. One that does have this capability and does the job easily
    is Kino (Figure 16-6).


    ![](img/d35fa962e6f9664d66dc83916f426418_319_0.png)


    Figure 16-6: Kino, another digital video editor


    Kino does not come bundled with Ubuntu, so you''ll need to download and install
    it from the Ubuntu Software Center. Once you have done that, you are ready to
    capture video from your camera. To do this, connect your camera to your computer
    (if it isn''t already connected), turn on your camera to Play mode, start up Kino,
    and then follow these steps:


    +   1. Click the Capture tab to the right of the playback pane.

    2. The control buttons at the bottom of the playback pane will now control the
    functions of your camera. Start by clicking the Rewind button until you get to
    the beginning of the video segment you want to capture.'
  merge: -1
  img_proc: true
- pgno: 320
  md: '3. Click the Play button. You will be able to see the video on your camera
    play back within the Kino window (Figure 16-7).


    ![](img/d35fa962e6f9664d66dc83916f426418_320_0.png)


    Figure 16-7: Capturing video from your digital camera with Kino


    4. When you reach the point at you want to start capturing, the Capture button
    just above the playback controls in the Kino window. Kino will start saving your
    video to your computer''s hard disk.


    5. Click the Stop button when you would like to stop capturing.


    The captured video will now be on your disk (in your Home folder by default).
    To keep things easy to manage later, the captured video stream will be automatically
    split into several smaller files, the number of which depends on the length of
    the video played.


    You can view the captured video by clicking the Edit tab and then using the playback
    controls at the bottom of the playback pane. You can also view the video in Timeline
    view (Figure 16-8) to navigate between various segments of the video. Just click
    the Timeline tab, which selects the segment you want to view, and then use the
    playback controls below the playback pane.


    If you feel getting a bit airy, you can also try the effects available in Kino
    (some examples are shown in Figure 16-9) by clicking the FX tab and then playing
    around with the various effects in the drop-down menu below words Video Filter.
    After you choose an effect, the segment you like to convert (or at least experiment
    with) by typing the beginning and ending frame numbers in the boxes below the
    word Overwrite. To see the changes to disk, click the Play button.'
  merge: -1
  img_proc: true
- pgno: 321
  md: 'If you decide you want to convert the segment to keep the effect, click the
    Render button, and Kino will create a new file of just that segment. You can also
    double-click those files (as well as the original captures) to view them in Movie
    Player, which is better suited to viewing videos than Kino.


    ![](img/d35fa962e6f9664d66dc83916f426418_321_0.png)


    Figure 16-8: Kino''s Timeline view


    ![](img/d35fa962e6f9664d66dc83916f426418_321_1.png)


    Figure 16-9: Examples of Kino''s video effects, before and after'
