  md: '# # 10


    # ## GUTENBIRD

    ### Setting Up and Using Your Printer and Scanner


    ![](img/d35fa962e6f9664d66dc83916f426418_216_0.png)


    Two of the most common computer peripherals are printers and scanners. This only
    makes sense, because it is those two tools that turn a web-surfing, game-playing,
    music-churning, number-crunching box of chips into a meaningful publishing tool—a
    virtual publishing house, if you will. These devices help you convert digital
    information into hard copy (in the case of printers) and convert hard copy into
    digital information (in the case of scanners). It is not surprising, therefore,
    that these tools often come together these days in the form of multifunction printers.


    In this chapter, you will learn how to connect these useful devices to your computer,
    how to set them up, and how to use them. You''ll also learn how to find and install
    new fonts so you can make your printed documents look their best. If you''re more
    into working with your digital camera than with a scanner, you might want to sneak
    a peek at Chapter 13; otherwise, put on your printer''s smock and read on.'
  merge: -1
  img_proc: true
- pgno: 217
  md: '# Printers


    Unless the only thing you use your computer is for playing games, listening to
    MP3s, or stopping doors on hot, breezy days, you will no doubt want to hook up
    your machine to a printer. Despite the paperless-office era that the personal
    computer was supposedly going to usher in, it seems that the computer''s strength
    as a desktop-publishing and general work tool has made producing-quality printed
    documents an even more attractive proposition than ever before.


    # Confirming Your Printer Is Supported


    Setting up a printer to work with your new system is a pretty easy task, and it
    seems that printer support in the Linux world gets better with each release. In
    general, support for most printers is pretty good, with very few cases and models
    struggling with compatibility.


    If you really want to make sure your printer is supported, try it by following
    the instructions in the next section. If you are thinking about buying a printer
    or are trying to decide whether to switch to Linux, go to http://www.openprinting.org/printers
    where you can check an online database whether your printer is currently supported
    and, if so, to what degree. Listings for supported printers also include information
    on which drivers are best for your purposes. If you''re thinking of buying a printer
    for your Linux system, those manufactured by HP and Epson tend to be a pretty
    safe bet. You may also consult Ubuntu''s list at https://wiki.ubuntu.com/HardwareSupportComponentsPrinters/


    # Getting Ubuntu to Recognize and Set Up Your Printer


    Printer handling in Ubuntu is pretty much a no-brainer, but Ubuntu automatically
    detects printers. If you have a USB printer, connect it to your computer and then
    power up your printer (vice versa should work fine, too). If Ubuntu recognizes
    your printer—and chances it will be set up automatically in the background, without
    needing to click a single button. The process only takes a couple of seconds,
    so you should be ready straightaway. To check that everything is hun-dory, click
    the power button on the far right of the top panel and select Printers from the
    menu that appears (alternatively, search for Printers in the Dash). If your printer
    has been set up correctly, the Printing window will contain an icon with the make
    and model of your printer listed beneath it. There is nothing more for you to
    do in this case—your printer is set and ready to roll.


    It is also possible, however, that Ubuntu will recognize your printer but not
    find a driver that is an exact match for. In this case, a window will pop up after
    you connect the printer, offering a substitute driver. If you find yourself in
    this situation, it wouldn''t be a bad idea to print a test page to see whether
    the substituted driver worked as it should. You can do this by selecting Printers
    from the top panel''s power button menu and then double-clicking your printer
    in the Printing window that appears. Printer Properties window will open. Make
    sure that Settings is selected from the list to the left of


    Chapter 10'
  merge: -1
  img_proc: true
- pgno: 218
  md: 'the window and then click the Print Test Page button (Figure 10-1). If the
    test page looks normal (something like Figure 10-2), everything should be fine,
    and you can close the Printer Properties and Printing windows.


    ![](img/d35fa962e6f9664d66dc83916f426418_218_0.png)


    Figure 10-1: Printing a test page with your new printer via the Printer Properties
    window


    ![](img/d35fa962e6f9664d66dc83916f426418_218_1.png)


    Figure 10-2: An Ubuntu test page'
