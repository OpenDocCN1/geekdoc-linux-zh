- pgno: 197
  md: '# Project 9A: Creating a New User Account


    If you''re reluctant to alter the look of your current setup, you can create a
    new user account and experiment with making the changes in this chapter when logged
    in to the new account. If you opt to go this route, your regular home environment
    will remain untouched, because look-and-feel customizations that are performed
    in one user account do not affect other user accounts. When you''re done with
    the project, you can simply delete the new user.


    # 9A-1: Creating the Account


    To set up a new user account, follow these steps:


    +   1. Click the System Settings button in the Launcher.


    +   2. When the System Settings window appears, scroll down to the end of the
    System system and click User Accounts.


    +   3. In the User Accounts window, click the Unlock button. Provide your password
    when asked and then click Authenticate.


    +   4. Now click + in the new window that appears (Figure 9-1), type a name in
    the Full name box and a username in the Username box. To keep things simple, I
    am just to use graphika for my example. For Account Type, choose Administrator
    that you''ll have permissions to do what you want.


    +   5. Click Create to add the new user. Provide your password when asked and
    then click Authenticate in that window.


    +   6. Now click the new account in the left pane of the User Accounts and then
    click the words Account disabled next to the word Password.


    +   7. In the window that appears (Figure 9-2), enter a new password for the new
    account (for this experiment, the same password as your regular account is fine),
    type it again in the Confirm password box, and then click Change.


    +   8. When done, click the Lock button in the top-right corner of the User Accounts
    window and close the window.


    ![](img/d35fa962e6f9664d66dc83916f426418_197_0.png)


    NOTE


    Normally the privilege to install software and perform other system-wide changes
    (Administrator) is not selected by default on new user accounts, since you probably
    don''t want your kids, workmates, or anyone else with his or her own user account
    on your computer installing all sorts of weird stuff and screwing up your system
    settings. We need it here, though, because we''re going to be installing things.


    160 Chapter 9'
  merge: -1
  img_proc: true
