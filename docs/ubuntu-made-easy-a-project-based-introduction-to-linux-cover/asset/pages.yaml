  md: 'If the correct resolution for your monitor isn’t available from the list, you
    might have to use a different display driver. See “Games/Unity Don’t Work: Installing
    Accelerated Graphics Drivers” on page 392.


    # The Screen Is Blank


    One possible cause of a blank screen is that something went wrong with your graphics
    card or its drivers. Frankly, this is a reasonably rare occurrence, and it''s
    much more likely that something minor (and easy to fix) has occurred.

    Peruse the following tips before you start worrying about some sort of graphics
    card apocalypse:


    +   **Check that the display cable is connected.** Most computers have a separate
    monitor that plugs into the back of the computer box. Look at the back of the
    monitor and make sure both of the cables coming out of the back are fully plugged
    at both ends. You might also want to check that the display is switched and that
    your power cable hasn’t fused.


    +   **Try to wake the computer.** Your computer may have gone into a power-saving
    (sleep) mode; you can wake it up by moving your mouse or pressing keys on the
    keyboard. If that doesn’t work, try pressing the power button on your computer.
    This sometimes wakes a computer from its sleep when just “ticking” it doesn’t.


    +   **Switch to a command line.** The part of Ubuntu that’s responsible for displaying
    things on the screen is called X11,,, or X. Sometimes X fails to start. See if
    this has happened, pressing CTRL-ALT-F2. You should see a login: prompt if everything
    but X is working properly. You can type your username and password (pressing ENTER
    after each one) to access a command line, just like the Terminal you met in Chapter
    8. While you’re using the command line, typing sudo start by ENTER; pressing your
    password if prompted. This will try to start X—it might work, or it might give
    you an error message telling you what the problem is. Alternatively, type sudo
    reboot to restart your computer. If you’re wondering what happened, pressing CTRL-ALT-F2
    will switch you to a virtual terminal. Ubuntu starts a few virtual terminals and
    uses them for different things: pressing CTRL-ALT-F7 will switch you back to the
    virtual terminal used by X to display everything.)


    +   **Restart the computer.** Some computers occasionally start up without turning
    on the graphics card or the monitor (This tends to be a problem on older computers.).
    As a last resort, turning the computer off and then on again by pressing the power
    button. If the computer doesn’t turn off at first, hold down the power button
    for a few seconds until it does.


    # Hard Disks and Storage Problems


    I never really understood how you could completely fill up your hard disk until
    I bought a digital video camera. If you have a similarly expensive disk-usage
    habit, this section is for you. We’ll cover a few tips on how to free up some
    disk space, and worst-case scenario, how to deal with a completely full disk.'
