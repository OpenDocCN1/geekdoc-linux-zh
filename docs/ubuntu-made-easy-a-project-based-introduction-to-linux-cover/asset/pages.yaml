    Once in the Cinnamon environment, you might want to make a few customizations
    so that the remnants of the Unity''s Ambiance theme do not seem out of place with
    Cinnamon''s Adwaita. To make the changes, follow these steps:


    +   1. Click the Menu in the bottom-left corner of the screen, hover your mouse
