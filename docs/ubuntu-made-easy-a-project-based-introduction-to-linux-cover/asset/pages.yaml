  md: '# 7


    # # A TIDY NEST


    File and Disc Handling in Ubuntu


    ![](img/d35fa962e6f9664d66dc83916f426418_132_0.png)


    No matter which operating system you are using, you have to deal with files. Some
    people are very organized, placing every file in a logically named folder as soon
    as that file is saved for the first time. Then there are people like me, who save
    everything to the desktop until it is so full of junk that they can no longer
    make out the wallpaper, and only at that point they start organizing in earnest
    (placing all of those files in a single folder called MarchCleanup can be called
    organizing).


    Of course, not only do files get stored on your hard disk, but they are also copied
    to and from CDs, DVDs, external hard disks, flash drives, and other storage media
    and devices. They are also saved in archives, which then compressed to reduce
    their size, making them easier to send via email or to fit onto removable storage
    media.


    With that introduction, you may have already guessed that in this chapter I will
    be dealing with file handling in Ubuntu, particularly in relation to the file
    search in the Dash and the Nautilus file manager, which is at the heart of Ubuntu’s
    file-handling capabilities.'
  merge: -1
  img_proc: true
- pgno: 133
  md: '# Find It Fast—Searching for Files with the Dash


    If you''re anything like me, you''ve been collecting computer files for quite
    some time now. My laptop is packed full of files, from vacation photos, letters,
    financial documents and spreadsheets to my music collection, home videos, ebooks,
    and work documents. It even hosts a bunch of files from my Windows days—bad artwork,
    unfinished poems, and old desktop background pictures. There is a lot of stuff—too
    much stuff, in fact. There''s a point at which even the most competent organizational
    mind has to throw his hands in the air and admit defeat: It''s practically impossible
    to keep many files organized while the same time having easy access to them. And
    that''s where the Dash comes in.


    As you''ve already seen in Chapter 3, the Dash has a powerful search feature.
    All you need is to open the Dash and start typing. Then, within a second or two,
    search results from the four corners of your computer will start to float in.
    After you can use lenses and filters to narrow your search results until you find
    whatever you''re looking for. Nothing more to it, right?


    Well... not quite. In addition to the basic search and filtering features mentioned
    in Chapter 3, the Dash also has nifty extras to help you find your files. In this
    section, I''ll take you on a whistle-stop tour of what''s on, accompanied by a
    neat trick or two that might just help you find it faster (whatever "it" is).
    Read on!


    # Recent Files and Downloads


    As you''ve probably already established, searching is the quickest way to find
    files. But when you first open the Dash, you''ll see three bands of results displayed
    before you even typed a thing. At the top is a list of applications that you''ve
    recently used; forget for that now. In the middle, you''ll see a band called Recent
    Files, and you''ll see Downloads below that. The Recent Files band is, surprisingly,
    a list of the files you''ve been working with recently. If you''re looking for
    that you wrote yesterday, there''s no need to search for it—it''ll probably be
    right there in this list.


    The Downloads band is also pretty handy, if like me, you spend a lot of time on
    the Web. It''s a list of all the files that you''ve recently downloaded with your
    browser, as explained in Chapter 5. Everything you save off the Web is stored
    in a special Downloads folder for future reference, so there''s no need to sit
    scratching your head, wondering which website you found that tax form last week—it''s
    probably somewhere in the Downloads folder.


    # Finding More Elusive Files


    What if you can''t find the file you were looking for? There are a number of things
    to try. The first is to double-check what you are searching for. The search in
    the Dash isn''t case sensitive (you can use uppercase and lowercase letters, and
    it doesn''t care), but it does care about spelling. If the search term you doesn''t
    appear somewhere in the name of the file, exactly as you typed it, then it won''t
    show up in the search results. Also, be aware that the search'
  merge: -1
  img_proc: true
- pgno: 134
  md: 'doesn''t look inside the files—only at the name of the title. Say, for example,
    that you wrote a word-processed document with the title "Clouds Fluffy" and saved
    it with the filename clouds.doc. Searching for clouds would find the file, but
    searching for fluffy would not. Where you saved the file also matters: In general,
    most of the places where you might save files are free (they could be in your
    Home folder, which you''ll learn about shortly), but if you put it on a removable
    USB memory stick, it won''t show up in the results.


    # A Closer Look at Lenses and Filters


    Sometimes, there are just too many files. No matter what you type into that search
    box, however specific, you still end up with tens, or hundreds, of search results.
    As you''ve already seen, the Dash equipped with a few handy tools to help you
    through the deluge of lenses and filters. In this section, I''ll show you how
    to get the most out of the three-file based—Files & Folders, Music, and Videos.


    # Files & Folders


    To bring up the Files & Folders lens, click the icon that looks like a folded-over
    sheet of paper at the bottom of the Dash. Click Filter results, and a host of
    options will appear down the right-hand side of the screen (Figure 7). You can
    filter the search by Last Modified (the last time the file was changed), Type
    (what sort of file it is), and Size (how much space it takes up). Click on any
    of the options under those headings to navigate the search; you can select at
    once, if you like. To deselect an option, just click on it again, or if you want
    to remove all of the filters, click the All button next to each of the headings.


    For concretely, let''s consider an example of how you might use filters to find
    a file. Your Uncle Garfield is coming over in a couple of hours, and he absolutely
    loves lasagna. As luck would have it, you remember writing up delicious lasagna
    recipe a couple months ago, seasoned to perfection a particularly successful session
    of experimentation with your herb collection. Where''d that pesky recipe go? Open
    the Dash, type recipe, and, unsurprisingly, for a culinary such as yourself, 112
    results appear. A quick scan of the first


    Filter results

    --|--

    Last modified | All

    7 days | Last 30 days

    Last year

    Type | All

    Audio | Documents

    Folders | Images

    Other | Presentations

    Videos

    Size | All

    1KB 100KB 1MB 10MB 1GB >1GB


    Figure 7-1: Filtering search results in the Files & Folders lens'
  merge: -1
  img_proc: true
- pgno: 135
  md: 'few flies reveals pictures of your marvelous creations, a few word-processed
    documents containing recipes, a song or two off the Ray Charles Ingredients in
    a Recipe for Soul. Hmm, not so helpful. So what do you do?


    Wading through the results one by ones like a chore, so click through the Files
    & Filters lens and click Filter results. Usually write recipes using a word processor
    (more than in Chapter 12), you know that the recipe will be in a regular document—it''s
