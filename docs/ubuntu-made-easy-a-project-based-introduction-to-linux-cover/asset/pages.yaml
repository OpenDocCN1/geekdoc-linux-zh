    # Getting Airy with the GIMP


    The Windows and Mac worlds may have Photoshop, but the Linux world has the GIMP
    (see Figure 13-12). Although not as fully featured as Photoshop, the GIMP is a
    powerful contender, might explain why it has been ported to both Mac and Windows.
    The GIMP allows you to create bitmap graphics and, importantly, retouch or completely
    doctor image files. With the GIMP you can get rid of red-eye in your digital photos,
    airbrush unwanted shadows (or facial blemishes), view your image as a canvas texture,
    change a photo into an oil painting, and even add a bell pepper here and there—with
    drop shadows no less.


    Because not everyone needs or uses the features of the GIMP, the powers that decided
    to no longer bundle it on the Ubuntu Desktop CD, thus freeing up space for more
    frequently run applications. Pity though that might be you can still install the
    GIMP via the Ubuntu Software Center.


    238 Chapter 13'
