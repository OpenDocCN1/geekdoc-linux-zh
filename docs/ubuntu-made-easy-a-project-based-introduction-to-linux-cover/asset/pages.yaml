    # Save It for Later: Using History and Bookmarks


    Chances, you have a few websites that you return to again and again, perhaps even
    checking some of them a few times a day. Typing the entire address every time
    you want to check Facebook can get tedious, and putting the same search terms
    into Google five times a day feels clumsy. Surely there''s a better way? In fact,
    Firefox is crammed with better ways! Let''s take a look at some of them.


    # Bookmarks


    First up is Firefox''s Bookmarks feature. To save a web page for perusal of your
    convenience, all you need to do is click the empty star in the right-hand corner
    of the address bar. When you do that, the star will turn yellow, indicating that
    the page has been saved. Saved where, you were, ask? Go to the Bookmarks menu
    and look at the Recently Bookmarked menu item. A list will expand that contains
    your most recent bookmarks, including the one you just added. All it takes to
    revisit the page is to click the appropriate item in that menu.'
