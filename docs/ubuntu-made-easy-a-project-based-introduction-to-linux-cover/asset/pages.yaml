    # Java


    One last plug-in that you''re likely to encounter is Java, which is used to run
    java apps. Java app are little applications that you can run in your web browser,
    and they are commonly used for games and demonstrations. Install-ing Java is quite
    similar to installing Flash. Just Open the Software Center, but this time search
    for Iced Tea Java Plugin and install that. After installation has finished, it''s
    a good idea to take a look at Java in action, so head over to http://www.turbotanks.com/.
    An arcade “tanks” game should load if Java is working properly (Figure 5-12).


    ![](img/d35fa962e6f9664d66dc83916f426418_102_0.png)


