- pgno: 165
  md: '# Some Goofy Useful Fun with the Command Terminal


    A rather cool thing about typing in the command Terminal is that you might call
    short-term memory. Try it by typing the word cherry and pressing ENTER. Ignoring
    the command-not-found message, go on and type vanilla and press ENTER. Now type
    gelato and press ENTER. So far, so dumb, right? Well, not really. Let''s try everything
    you typed far again, but this time''s left to it with one key.


    Huh?


    Yes, just press the up arrow key once, and what do you see? That’s—the last command
    you typed appears, in which case would be gelato. Press the up arrow key again,
    and the command that you typed before that appear—vanilla. One more time? Yes,
    cherry. And one more time for the finale ... I like cherries so much.


    Considering what we have thus, this may all seem a bit silly, but imagine you''re
    not typing little words and instead have to deal with longer strings, like a simple
    copy (which you''ll learn about in this chapter) like this:


    ```

    cp Photos/mypics/stprier/coastal/ontbeach_27.jpg /home/frog/photos_for_mom/stprier

    ```


    By typing you are copying an image called onbeach_1.jpg from the coastal folder
    to another called onbeach_1. If you wanted to copy another photo in the coastal
    folder, onbeach_16.jpg, for instance, you could simply press the up arrow key
    once, use the left arrow key and DELETE key to move over to and delete the 27,
    and replace it with 16. All in all, it would be much simpler and much faster.
    It would also help you avoid mistakes in typing. Not so dumb anymore, eh?


    # Nontoxic Commands


    As you know all, all of this typing is easy enough, but to actually do something
    useful with your Terminal, you need to type commands—and there are more of them
    than you could ever hope or know. To get started, we will begin with some commands
    that are easy to understand, nontoxic, and completely kitten friendly.


    # $whoami


    There is no command as easy, safe, or as seemingly useless as whoami. Rather than
    help with multiple personality disorders discover who they are at any given moment,
    the whoami command simply tells you user is currently logged in. Try it by typing
    whoami the $ and then pressing the ENTER key. Remember that commands are case
    sensitive.


    The Terminal will now tell you the username of the person logged in. If you are
    logged in as frog, you should get frog as the answer to your command.'
  merge: -1
  img_proc: true
- pgno: 166
  md: "# $ pwd\n\nIf you know who you are but aren't exactly where you are, `pwd`\
    \ (print working directory) should come in handy. The `pwd` command tells you\
    \ exactly where the Terminal is in your directory tree.\n\nLet's say, for example,\
    \ that my Terminal is in my personal home directory (which is called `~`) in the\
    \ system's home directory (which is called home and from which is all the user\
    \ account directories are located). When I use the `pwd` command, I would get\
    \ `/home/rg` printed to my Terminal. You should get similar results if you try\
    \ it.\n\n**NOTE** The *print*, in this case, has nothing to do with your printer;\
    \ it merely means the response will be printed to, or displayed in, the *Terminal*.\n\
    \n# $ df\n\nAnother safe and, but much more useful, command, is `df` (disk filesystem).\
    \ The `df` command tells you how much disk space you have used, as well as how\
    \ much space you still have available, on each of the partitions on your mounted\
    \ disks. You try it by typing `df` and then pressing ENTER. Your output should\
    \ look something like shown in Figure 8-3 (depending, of course, on the size of\
    \ your mounted disks and how they are set up).\n\n```\nrg@mydestkop:~-$ df\nFilesystem\
    \     1K-blocks Available Use% Mounted on\n/dev/sda1     114306814 52742364 10286264\
    \  0% /\nudev            1476296         4 1476292  1% /dev\ntmpfs           593424\
    \       780    592664  0% /run\nnone             5120         0    5120  0% /run/lock\n\
    none                                            \n/dev/sda1    123491036     232\
    \ 1483324  1% /run/shm\n09a-90c-8243caea4f 6955360 110351312  6% /media/9927f624-bb8-4\n\
    rg@mydestkop:~-$\n```\n\nFigure 8-3: Output from the df command\n\nAs you notice,\
    \ the sizes are given in kilobytes (KB) rather than the gigabytes (GB) and megabytes\
    \ (MB) you are probably more used to, but there is a way around it. Many commands\
    \ accept a `flag`, or `option`, to further how the commands perform. You type\
    \ flags directly after the main command and with a space and a hyphen.\n\nIn this\
    \ case, you can use the `-h` (human readable) flag to have your figures out in\
    \ the way you are most familiar with. Try this by typing `df -h` on the main command\
    \ and pressing ENTER. The output should appear in a more familiar format (see\
    \ Figure 8-4)."
