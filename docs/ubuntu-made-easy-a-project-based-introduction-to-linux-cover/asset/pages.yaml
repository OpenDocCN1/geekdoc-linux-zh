    # # Workspace Switcher—Virtual Desktops


    Since we’re on the topic of navigating through desktop space, this is a good time
    to discuss virtual desktops. Although the virtual desktop feature has only recently
    made its way into other operating systems, it has been a Linux feature for years
    (yes, it started here, folks). An easy way to think about virtual desktops is
    to think of your desktop as the top left quadrant of a four-times bigger desktop.
    But if you are using only one piece of your working space. If you click the Workspace
    Switcher button on the Launcher (Figure 3-20), you can see the rest of your desktop
    kingdom.


    Although you can see what I mean about desktop being four times bigger than it
    seems, you have to see it in action to get a good feel for it. If you click the
    Workspace Switcher button again, you will be back to your original, familiar piece
    of desktop. Now open a few windows. For example, click the buttons for Home folder,
    LibreOffice Writer, LibreOffice Calc, and System Settings (whatever app you prefer).
    Once you have an window for each of them, start by dragging the Settings window
    toward the bottom of the desktop until you can only see half of it. Drag the LibreOffice
    Calc window to the right of the screen until you can only see half of it and then
    drag the LibreOffice Writer window to the bottom-right corner of the screen until
    you can only see one-quarter of it. When you click the Desktop Switcher button
    this time, your screen should look something like Figure 3-21.


    Figure 3-20: The Workplace Switcher button in the Launcher


