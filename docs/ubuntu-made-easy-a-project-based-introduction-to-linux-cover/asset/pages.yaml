    ![](img/d35fa962e6f9664d66dc83916f426418_382_0.png)


    Figure 20-5: ClamTk, the graphical interface for ClamAV


    Now that ClamAV is up and running, you can scan your system on demand from the
    Scan menu. To scan a folder, select A Directory. To scan a directory and everything
    within it, choose Recursive Scan. In either case, the Directory window will appear.
    Select the folder or disc you want to scan and click OK. ClamAV will start scanning
    your system. ClamTk will let you know what it is scanning at any moment in the
    empty space below the button. If it finds anything suspicious, it will list that
    item in the main pane of window.

    ClamAV is set up by default to check for signature updates when it starts. These
    signature updates tell ClamAV what new viruses to be on the lookout for. If you
    leave your machine on for days and times at a time, it is probably a good idea
    to set things up so that ClamAV will automatically check for signature updates
    daily rather than startup. To do this, go to the Advanced menu and select Scheduler.
