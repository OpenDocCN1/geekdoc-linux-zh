  md: '# # Shutting Down


    Now that you know your desktop environment so well, you may feel like calling
    it day and shutting down your machine. To do so, just click the Quit button at
    the far-right corner of the top panel (it looks like a power button). In the menu
    that appears, there will be a number of choices in the lower half to choose from:
    Lock Screen, Log Out, Suspend, and Shut Down. Select Shut Down, and a small window
    will appear to ask you to confirm whether your decision or opt to restart (or
    cancel) instead (Figure 3-24). Click Shut Down, and the shutdown process will
    begin.


    ![](img/d35fa962e6f9664d66dc83916f426418_77_0.png)


    *Figure 3-23: A list of Ubuntu keyboard shortcuts*


    ![](img/d35fa962e6f9664d66dc83916f426418_77_1.png)


    *Figure 3-24: The shutting down or restarting Ubuntu*


    The actual shutdown will take a few seconds as the system closes its services.
    When it is all done, the system should power down your computer as well, in which
    case you are done. On a few machines, the system might not be able to power down
    the computer. You will know this is so in your case because all screen activity
    will come to an end. If you get to that point and nothing else happens for 15
    seconds or so, then just power the machine manually by pressing the power button.
    It is completely safe to do so at that point.


