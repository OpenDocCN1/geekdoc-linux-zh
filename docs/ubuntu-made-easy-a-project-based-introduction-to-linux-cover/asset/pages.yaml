    Windows system functions: / : ? * '' < > |


    Once the burning gets underway, its progress will be shown in a new window, and
    when the job is done, you will be asked what you would like to do next. Assuming
    you are done with your disc burning for the day, click **Eject** and then **Close.


    In case you are wondering, the discs you burn in Linux will be readable in other
    operating systems.


    # Dealing with CD-RWs


    CD-RWs are pretty like CD-Rs except that they can be erased and written to again.
    They are also quite a bit more expensive than CD-Rs and, generally, cannot handle
    faster burning speeds.


    Using CD-RW is much like working with CD-Rs. If the disc is blank, there is no
    difference in the process at all. Even, if the CD-RW already has data on it that
    you want to replace with something else, the process is only slightly different.


    112 Chapter 7'
  merge: -1
  img_proc: true
- pgno: 150
  md: 'One of these differences is that Nautilus will treat your CD-RW as a regular
    data disc rather than a blank one. This means when you pop your disc into the
    drive, a regular Nautilus window, rather than a CD/DVD Creator window, will automatically
    open.


    To write to the disc, you will need to switch from the Nautilus window to a CD/DVD
    Creator window, which is easily done by clicking **Go > Location** and typing
    burning:/// the location bar (followed by ENTER). Once you''ve done this, the
    window will become a CD/DVD Creator window. Now drag the files you want to burn
    CD to that window; once you are ready to burn, click the **Write to Disc** button.


    As is the case with regular CD-Rs or DVDs, a CD/DVD Creator will appear. When
    you click the **Burn** button in that window with a CD-RW in the drive, something
    slightly different happens. At this point, a new window will appear telling you
    that the disc seems to have files already written on it. Click the **Blank Disc**
    button in that window, and the CD/DVD Creator will erase the files already on
    the CD-RW and replace them with the new ones you dragged to the CD/DVD Creator
    window. Not bad at all, eh?


    # Burning ISO Images to Disc


    When you download Ubuntu or other Linux distributions from the Internet, you usually
    download them in the form of one or more images, which are commonly referred to
    as ISOs because such files end in the *.iso* extension. An ISO is an image of
    a CD''s file contents, which means that it is the CD minus the itself. To put
    it another way, if CDs had soul, the ISO would be the soul of a CD; take away
    the CD''s metal and plastic, and the remaining data would be an ISO.


    It is of course impossible to download a physical CD over the Internet, but the
    bodeless ISOs are the next best thing. For example, to get a working copy of Ubuntu
    from the Web, you usually need to download an ISO, which you then burn onto a
    blank CD in order to give the images their bodies back, so to speak. In the process,
    you create the installation disc that you need to install Ubuntu.


    Fortunately, burning an ISO to disc is a pretty simple chore. Just open a Nautilus
    window and locate the icon for the ISO file you want to burn to. Right-click the
    icon, and in the pop-up menu that appears, select **Write to Disc**. Once you
    do this, the CD/DVD Creator window will appear; just click the **Burn** button,
    and it''ll be on your.


    # Creating Your Own ISO Images


    While on the topic of ISOs, it is good to know that you can create ISOs of your
    own. While you''re probably not going around creating your own Linux distros,
    you might come up with a set of files that you need to repeatedly burn to disc
    now or in the future, for example. To create your own ISO, follow the normal process
    for creating a CD, but'
  merge: -1
  img_proc: true
- pgno: 151
  md: 'window (Figure 7-12) appears, select Image File from the drop-down menu and
    then click Properties. This will open a new window asking for a filename for your
    disc image. Give it a name, click Close, and hit the Create Image button. In a
    very short time, you will have an ISO of your creation.


    # Burning Multissession CDs


    If you are coming from the Windows environment, you may be familiar with multisession
    CDs. These are CDs on which data is added one session at a time. For example,
    you burn a few files to disc today and add a few more to the disc tomorrow and
    each time you add files to the same disc, you are adding a session, which explains
    the name multisession. You can basically think of the CDs as working like floppy
    disks (albeit with a lot more storage capacity).


    Nautilus has basic support for multisession disks, but let''s try something a
    little more specialized this time: Brasero, which is a fully tried application
    that you can use for all of your disc-burning chores.


    You can run Brasero by searching for Brasero Disc Burner in the Dash. In the main
    Brasero window that then opens, click the Data button.


    To burn the first session to a CD, drag the files you want to burn from Nautilus
    into the empty Brasero window (Figure 7-13) or click the Add button (which looks
    like a plus sign) on the Brasero toolbar to browse for files manually.


    ![](img/d35fa962e6f9664d66dc83916f426418_151_0.png)


    Figure 7-13: Using Brasero to create multisession discs'
  merge: -1
  img_proc: true
