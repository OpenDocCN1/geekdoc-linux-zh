- pgno: 175
  md: '# What Is a Shell?


    As you noticed, I mentioned the results of the finger command showed I was using
    the Bash shell, so you may well be wondering what Bash is. Well, Bash (Bourne
    Again Shell) is one of the many shells that are used in Linux systems, and it
    is the one that happens to be with your Ubuntu distro (and most others, for matter).
    A shell is a program that interprets the commands you type into the Terminal and
    delivers them, so to speak, to your system that it can act upon. I like to think
    of it as a command-handling sub-system, for which the Terminal acts as a graphical
    frontend.


    # What Is a Plan?


    I also mentioned that the results said I had no plan, so you may also be wondering
    what it is all about. A plan is a small file kept in your folder that other users
    see when they use the finger command out. Traditionally, a plan file contained
