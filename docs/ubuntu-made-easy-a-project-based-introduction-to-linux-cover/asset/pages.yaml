  md: '![](img/d35fa962e6f9664d66dc83916f426418_63_0.png)


    # # Welcome to the Desktop


    As you can see at first glance, the Ubuntu desktop (Figure 3-2) is a pretty familiar
    looking place. In fact, it looks a lot like what you might get used to in Windows,
    Mac OS, or even another Linux distribution. Look bit closer, however, and you
    start to notice that things are not quite the same. There is no task bar or Start
    button at the bottom of the screen, there are no desktop icons, there seems to
    be only one menu in the top panel, and there is some-things that looks like the
    Mac OS X Dock on the left side of the screen. Yup, things are a bit different.


    ![](img/d35fa962e6f9664d66dc83916f426418_63_1.png)


    26 Chapter 3'
  merge: -1
  img_proc: true
- pgno: 64
  md: 'Welcome to the Unity desktop environment, which Ubuntu has been using since
    its 11.04 release. Unity is designed to be usable on any number of devices, not
    just on PCs, meaning that someday could conceivably be using the exact same operating
    system on your PC, your phone, your tablet computer, and knows what else. Although
    Unity is a bit different from what you might be used to in terms of operation,
    it isn''t alien, and working in Unity quickly becomes second nature. To get started,
    I''ll try to familiarize you with the elements of the desktop and how they all
    work.


    # Parts of the Unity Desktop Environment


    Ubuntu''s Unity desktop has three observable parts: the top panel, the desktop
    itself, and, on the left side of the screen, the Launcher. I''ll discuss each
    of these parts, starting with the top panel, which is very useful.


    # The Panel


    At the top of the screen is the panel (Figure 3-3), which looks a lot like the
    Mac OS menu bar at first glance. Like the Mac OS menu bar, the panel contains
    the global menu, which displays the menus for the currently focused application
    (unlike in Windows or other Linux distributions, where the menus are connected
    to the application window). To show the global menu, hover your mouse over the
    top portion of the panel, and the menu will appear to the right of the window
    title (Figure 3-4). If you don''t have any windows, the Desktop menu will appear
    here instead.


    > NOTE Not every application works with Unity''s global menu. The menus in LibreOffice,
    for example, will display within their own windows.


    | Ubuntu Desktop | | | 8:13 PM Rickford Grant |


    Figure 3-3: The top panel in Unity


    | Ubuntu File Edit View Go Help |


    Figure 3-4: The top panel does double-duty as the menu bar for the system itself
    and most applications


    Similar to the Mac OS menu bar is the cluster of icons on the right side of the
    panel. Some of these are indicators, while others are menus, like applets, allow
    you to perform certain functions. Here is what the set does (from left to right):


    +   Messaging Lets you know when you receive email or chat messages and allows
    you to easily send email messages and check your address book. It also lets you
    check and send messages to social networking sites such as Facebook'
  merge: -1
  img_proc: true
- pgno: 65
  md: 'Network Lets you see your network status and configure your devices. When used
    with a wireless network connection, this indicates the wireless signal''s strength
    and allows you to switch between wireless networks easily.


    Audio Lets you adjust the volume of your system and control music playback (Figure
    3-5) by Ubuntu''s bundled music player, Rhythmbox (which you will learn about
    Chapter 14).


    Clock Shows date and/or time.


    User Shows the name of the user account and allows you to switch user accounts.


    System Allows you to lock your screen, log out, shut down, or restart. It also
    provides access to a number of system settings.


    Other indicators, such as the battery indicator or Bluetooth manager, will appear
    depending on your hardware configuration or status. Certain applications, such
    as the sticky-note system Tomboy, may also place indicators or applets here.


    To wrap up our discussion of the top panel, it is worth noting one rather characteristic:
    When you maximize a window, by either clicking the maximize button or double-clicking
    its title bar, the top panel becomes the menu bar and the title bar of that window,
    as you can see in Figure 3-6 (The *title bar* is the bar that runs across the
    top of a window, where the title of the window and its controls are located.)
    This shouldn''t be a problem, of course, but it is something to keep in mind so
    you don''t panic when you can''t find the top of your window under the top panel.
    It''s not the panel—it is the panel! Fortunately this mysterious metamorphosis
    is easily. To restore your window back to its earlier, normal size, just double-click
    the top panel or maximize the button on the left end of the panel.


    ![](img/d35fa962e6f9664d66dc83916f426418_65_0.png)


    Figure 3-5: The top panel Audio allows you to control music playback through Rhythmbox.


    ![](img/d35fa962e6f9664d66dc83916f426418_65_1.png)


    Figure 3-6: The top panel becomes the menu and title bar of a maximized window.


    28 Chapter 3'
