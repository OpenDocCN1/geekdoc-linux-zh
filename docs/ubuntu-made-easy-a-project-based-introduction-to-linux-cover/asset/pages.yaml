  md: '# Adding Extra Software Repositories


    The Ubuntu software repositories contain more than 40,000 packages—enough to last
    a lifetime, so you might think. But as it turns out, a whole world of software
    is waiting for you outside the official Ubuntu repositories, and it''s not much
    difficult to reach. Various individuals and companies compile small numbers of
    packages that are not available in Ubuntu into their third-party repositories.
    These are typically free to access, if you can find them. All you need to do is
    tell APT to search for packages in one of these repositories as well as Ubuntu’s,
    and you’ll be able to get at the extra software.


    Each repository has its own APT line; the line contains extra information about
    the repository, which APT uses to figure what sort of packages it contains. When
    you’re trying to add some, let’s pick an example to see how it works. Open Firefox
    and head over to http://www.getdeb.net/updates/Ubuntu/all#how_install. GetDeb
    specializes in making packages for software that are not officially made into
    Ubuntu yet. There will be some instructions on installing packages from GetDeb
    at the top of the page, so skip to the second item in the list and find the APT
    line, which should look something like this: http://archive.getdeb.net/ubuntu-precise-getdeb
    apps. This follows the same format as APT lines: the word deb, followed by a address,
    followed by a couple of other words that specify which part of the repository
    should be checked by APT when it’s looking for programs. Highlight the APT line,
    right-click it, and select Copy from the pop-up menu.


    While you’re in Firefox, you’ll also need to grab the repository’s GPG key (which
    I’ll explain at the end of this section). It should be linked to the same website
    you got the APT line; in the case of GetDeb, it will be to http://archive.getdeb.net/getdeb-archive.key,
    when the Opening Getdeb-archive.key window appears, select Save File to save the
    key file.


    Now that you’re in possession of these bits of information, adding the repository
    to your system is pretty straightforward:


    +   1. In the Software Center, click Edit + Software Sources and then click the
    Other Software tab in the Software Sources window.

    2. Click Add. You’ll be prompted to enter the APT line, so paste it into the box,
    and then click Add Source (Figure 6-10). When asked for authentication, enter
    your password and click Authenticate. A new entry should appear in the Other Software
    list.


    ![](img/d35fa962e6f9664d66dc83916f426418_125_0.png)


    Figure 6-10: Entering the APT line for the GetDeb repository'
  merge: -1
  img_proc: true
- pgno: 126
  md: '3. Select the Authentication tab and click Import File. Use the window that
    appears to find the .key file you downloaded earlier. (It''s probably in your
    Downloads folder.)


    4. Select the .key file by clicking it once and then click OK. Check the list
    of trusted providers to make sure that the GetDeb Archive Automatic Signing key
    is now present, as is in Figure 6-11.


    ![](img/d35fa962e6f9664d66dc83916f426418_126_0.png)


    Figure 6-11: Checking the list of trusted software providers to see whether the
    GetDeb key is there


    5. Select the Sources window. APT will start working in the background, updating
    its list of packages and so. This can take a little, and APT won''t tell you when
    it''s finished, so it''s probably best to do something else for a while. You can
    use your computer while this is going. Open the Software Center and click the
    arrow immediately to the right of the All Software button. If APT has finished,
    you should find GetDeb in the menu. If it''s not there, wait a little and check
    again.


    6. Now you can search for the program you wanted from the new repository. For
    instance, try searching for BookWrite, a fun little program to help you write
    your own novel. It should appear in the search results just like any other application,
    so you can install it in the usual way.


    That was quite a few steps to go through, but it beats driving your local computer
    to buy a new program?\ One final: Remember all business about authentication and
    GPG keys? It relates to a security measure that checks whether the packages are
    from where you think they''re from. (In theory, it''s possible that someone could
    hijack a repository and put harmful packages in them.) If you don''t add the GPG
    key, the Software Center will refuse to display any of the packages from the repository
    since it won''t trust it. If having the GPG'
  merge: -1
