  md: '# What Is KDE?


    KDE is a GUI, a piece of software that interacts with the operating system but
    is not an integral part of it. It simply provides a means of communicating with
    it. You might think of it as an interpreter between you and Linux.


    # What Else Is Included?


    Besides Linux itself and the KDE desktop, you''ll find many other programs included
    with your Linux operating system. KDE alone includes over 100 programs, such as
    image viewers, text editors, email programs, web browsers, and games. You''ll
    even find a free office software suite (OpenOffice) and a Photoshop-like program
    (The GIMP), both of which are discussed in this book. OpenOffice and The GIMP
    are generally considered to be the leading free applications in their respective
    fields. For this reason we have given each one a separate chapter.'
  merge: -1
  pgno: 14
- img_proc: true
  md: '# # Chapter 2: Loggin in and Moving Around


    This chapter discusses the basics of using the KDE graphical interface on Linux.
    If you''ve worked with another GUI environment, this information will probably
    seem elementary, but you may want to skim it to pick up some differences.


    # ## Logging in and Out


    When you first start Linux, you are greeted with a login screen. Before you can
    do anything, you''ll need to enter your login name, sometimes called a username,
    and your password, both of which should be supplied by your administrator. This
    is called logging in.


    Because a Linux system can have multiple users, each with their own customized
    desktop and settings, entering your login name tells Linux who you are. Instead,
    it instructs you to load your particular settings. Usernames are especially important
    when several people have access to the same computers.


    ![](img/fb7a71d55b85722293f8087c0b352fcc_15_0.png)


    Login Screen

    Linux uses your password to verify your identity, so you should always keep it
    secret. When you enter your password, the characters you type will not appear
    in the box. Instead, you should use plus signs or asterisks as you like. (Depending
    on the way your Linux system is configured, there may be no on-screen representation
    of your password at all, and you''ll have to type it in blindly.)


    After typing your login name and password, press ENTER. There will be a short
    delay as your computer loads everything for your session. A KDE graphic will show
    the loading progress. Once your machine is initialized, the KDE desktop should
    appear, and you will be ready to begin working.'
  merge: -1
