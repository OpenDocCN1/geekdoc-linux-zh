  md: '# Shell Expansions


    A special shorthand shell expansions is available to allow you to select multiple
    filenames on command lines. This expansion capability is one of the most powerful
    capabilities of the shell that is useful on the command line. Properly used, it
    can save you many keystrokes and time.


    | | |

    |---|---|

    | ? | Matches any single character. * Matches any number (zero or more) of characters.
    |

    | ~ | Shorthand for the name of a home directory. ~ name is replaced with the
    pathname of the home directory user name. If omitted, ~ is replaced by the pathname
    of your home directory. |

    | [] | Encloses a set of characters for a single– character match. For example,
    [aQz] matches a, Q, or Z. A hyphen (−) can be used to specify a range. For example,
    [am–pZ] matches m, n, o, p, or Z. A leading ^ negates the match string. For example,
    [^a-z] matches anything except a lowercase letter. |

    | $ | Introduces a variable. The variable is replaced with its value as saved
    by the shell. For example, $HOME is replaced with the pathname of your home directory.
    |

    | \ | Turns off the special meaning of the following character. For example, \?
    matches a \ instead of introducing a set of matched characters. |


    > **Tip** Don''t confuse shell expansions with regular expressions. They have
    some similarities, but they have different capabilities available in different
    places.


    # Quoting


    Besides the use of backslash (\) to protect a character from shell expansion or
    interpretation, there are other quoting characters. Of course, a comma can be
    used to turn off their special meaning.


    | | |

    |---|---|

    | " | Enables the special meaning of all characters except $ enclosed string.
    This is commonly used when you want to treat multiple words as a single argument.
    |

    | '' | Enables the special meaning of all characters in the enclosed string. |

    | ` ` | Executes the enclosed string as a command and replaces it with the output
    of the executed command. |


    # Examples


    The echo command displays its arguments back to the screen. In this example, echo
    displays the string entered, $HOME will be replaced with the value of the HOME
    environment variable, which is the pathname of your home directory.


    ```

    echo "My home directory is \$HOME"

    ```


    In this example, $HOME is displayed instead of being replaced with the value of
    the environment variable.


    ```

    echo ''My home directory is \$HOME''

    ```


    The date command returns the current date and time as a 26–character string. In
    this example, the backquoted reference is replaced by the result of executing
    the date command before the line is printed:


    ```

    echo "The current time is ''date''"

    ```'
  merge: -1
