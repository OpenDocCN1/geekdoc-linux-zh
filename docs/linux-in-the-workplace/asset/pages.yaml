    # Setting a New Home Page


    Changing what appears as your home page is probably one of the first things you
    will want to do when you are comfortable using Konqueror. In a corporate environment,
    you will want to select the home page that gives you the widest access to the
    internal documents you use most often. Many companies set up a corporate page
    as the default home page for employees. For personal use, think of the web page
    that provides the most entertainment or information for you. The goal is to reduce
    the number of times you must enter a URL manually in the Location bar to retain
    access to all the information you need. You''ll learn how to create a simple web
    page you can use as a personal page later in this chapter.'
