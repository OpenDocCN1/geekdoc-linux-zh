  md: '![](img/fb7a71d55b85722293f8087c0b352fcc_84_0.png)


    5.2: OpenOffice Writer


    **Tip** If you find yourself using OpenOffice or any OpenOffice document often,
    add its icon to the desktop or panel bar. See the "Adding Icons" section of Chapter
    11 for details.


    # Writer: Working with Text


    Writer is a word processor that allows you to compose documents such as letters
    and articles, as well as import and export documents from other systems in a wide
    range of formats that include HTML, ASCII, RTF, and MS Word.


    # Creating a New Document


    When you launch Writer, you are put into a new document automatically, so there
    is no need to do anything else than simply typing. If you''d like help building
    your document, Writer provides a selection of AutoPilots for commonly used documents
    such as cover pages, sales contracts, and school papers.


    **Tip** To set a style for your document, use the Paragraph Stylist. It is turned
    on automatically when you launch Writer. Turn it on or off by selecting Stylist
    from the Format menu.


    # Using the AutoPilot


    AutoPilot, often referred to as a wizard in other office programs, guides you
    through a series of document customization questions.


    To use this feature, select AutoPilot from the File menu. Then choose the type
    of document you want to create. Options include memos, faxes, letters, and web
    pages.


    Once selected, the AutoPilot Agenda dialog box appears. You are instructed to
    customize your document by choosing a layout style, including a logo or graphic,
    and naming your file.'
