- img_proc: true
  md: 'Using pipes to string these commands together and connect them to pager commands,
    such as

    more, is very common. This is where the toolkit of Linux comes into play.


    # grep—Searching for Strings in Files


    The grep command is used to locate a data pattern within a file. It gets its strange
    name from the

    command you need to type into the original UNIX editor in order to perform this
    task.


    In its most basic form, grep only displays lines that matched the specific character
    string. However, to

    take advantage of grep you need to understand regular expressions, a special

    pattern-specification language.


    ```

    grep [options] string files

    ```


    # Common Options


    | | |

    | -c | Counts the number of matched lines rather than actually printing them out.
    |

    | -i | Ignores the case of the letters in the match string. |

    | -l | Prefixes each output line with the line number within the input file. |

    | -v | Inverts match, only displaying lines that do not match. |


    # Examples


    Display all lines that contain the string cool in the file harry in your current
    directory:


    ```

    grep cool harry

    ```


    Display all lines that do not contain the string real cool in the file harry in
    your current directory

    and the output through more:


    ```

    grep -v "real cool" harry | more

    ```


    Display the lines in a long list of files in your current directory that contain
    the string Oct

    followed by a space. Page the output through more:


    ```

    ls -l | grep "Oct " | more

    ```


    # find—Locating a File


    The find command has a very complicated syntax and a lot of options but, because
    of this, is is

    extremely powerful:


    ```

    find [paths] expression

    ```


    The paths portion tells where to start searching. It then continues recursively
    under the

    specific starting point or points.


    The expression part is a series of conditions used to specify the file you want
    to find, if you

    wish, the action to be taken to each match. The default action is simply to print
    the name of the file.

    By default, all the specified conditions must be met. They are matched in order
    from left to right. For

    "or" rather than "and" conditions, use an -o connecting expression.'
  merge: -1
  pgno: 307
- img_proc: true
  md: '# Common Options


    -name *filename* must match. Note that the shell wildcard characters can be used
    in the match, but the match string must be quoted to prevent the shell, rather
    than find, from doing the expansion.


    | -group group | File belongs to group group. |

    | -name filename | Like - iname case- insensitive. |

    | -newer file | Desired file was modified more recently than file. |

    | -v | Explains what is being done. |


    # Examples


    Look for the file harry, starting in your current directory:


    ```

    find . -name harry

    ```


    Repeat the preceding example, ignore the case and match any file whose name starts
    with harry:


    ```

    find -iname "harry"

    ```


    Look any file whose name matches harry or chest in your current directory and
    the directory of bill:


    ```

    find -bill -name harry -name chest

    ```


    # locate-Locating a File


    Although find will always find a file, it can take a long time. The locate command
    uses a database that is created regularly (usually daily) to find a matching file.


    It is sometimes desirable to locate with grep to narrow down the match.


    ```

    locate [options] pattern

    ```


    # Common Options


    | -l | Ignores the case of the match. |

    | --help | Displays a help message. |


    # Examples


    Locate any file whose pathname contains the string:


    ```

    locate picture

    ```


    Locate any file whose pathname contains both picture and Secret:


    ```

    locate picture | grep Secret

    ```'
  merge: -1
  pgno: 308
- img_proc: true
  md: '# System-Related Commands


    Here is just a brief introduction to system- related commands. While you saw much
    of this functionality with KDE-specific graphical commands, there may be an advantage
    to using the command line with some of these.


    Think about what you have learned about grep, for example. You could use grep
    to select specific lines from the output of the ps command.


    # ps—Process Status


    Each program in Linux is called a process. When you enter a command, you start
    a process. If you enter multiple commands, connected by pipes, you are starting
    two or more processes.


    In addition, the system has many daemons. These are programs that take care of
    the system and perform background processes for you. A good example is the print
    spooler—the program that monitors the queue and interacts with the printer.


    By default, ps shows only processes that are owned by you.


    ```

    ps [options]

    ```


    # Common Options


    | | |

    | A | Shows all processes associated with a terminal. |

    | T | Shows all processes associated with a terminal. |

    | L | Shows a long display format. |

    | F | Shows the ASCII art process hierarchy. |


    > Tip There is an amazing array of options available to format and sort the output.
    See the man page for details.


    # Examples


    Display all your processes:


    ```

    ps

    ```


    Display all processes associated with a terminal in the long format:


    ```

    ps al

    ```


    Display a process hierarchy tree for all terminal– related processes.


    ```

    ps af

    ```


    # top—Ongoing Process Status


    If you want to see an ongoing display of current processes, top is the answer.
    Processes are sorted with the most active at the top. There are many options and
    interactive commands, but 99 percent of all runs are just top alone. Terminate
    top by pressing Q.


    ```

    top

    ```'
  merge: -1
  pgno: 309
- img_proc: true
  md: '# df—Display Free Disk Space


    This command displays the location, mount point, size, amount used, and percentage
    used of all mounted filesystems of nonzero size. Many options exist, but the default
    is almost always what you need.


    df


    # du—Display Disk Space Usage


    This command estimates file usage recurring downward from the specified location
    or locations.


    ```

    du [options] files

    ```


    # Common Options


    | -a | Writes counts for all files, not just directories. |

    | -h | Prints sizes in human– readable format. |

    | ---help | Displays a help message. |

    | -s | Prints summaries for each argument. |


    # Examples


    Show usage of all files under your current directory:


    ```

    du

    ```


    Show summary usage information for /usr/bin and /bin:


    ```

    du -s /usr/bin /bin

    ```


    # Conclusion


    This chapter has only scratched the surface as far as the capabilities of the
    command line. Hundreds of commands are available at the shell prompt and a lot
    more capabilities are within the command line of the shell. In addition, the shell
    offers a built– in programming language that makes it possible to make decisions
    and execute commands selectively.


    Complete books have been written on shell programming. If you would like to know
    more, we suggest you a trip to a good technical book store and find a book that
    is good for you.


    Also, SSC offers two reference cards, one on Bash and the other on the Korn shell
    as part of its Linux series. You can check them out, as well as other SSC books
    and reference cards at http://store.linuxjournal.com/'
  merge: -1
