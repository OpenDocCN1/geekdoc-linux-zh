    Use the arrow keys to scroll down to the entry you want to use. Press the down
    arrow key to highlight Move, and then press the letter M. It looks like nothing
    happened, but if you press your arrow keys randomly, you will see that the window
    is moving again. Get out of Move mode, press ENTER. Now call up the same menu,
    highlight the Size option, and press S. Use your arrow keys to reshape the size
    of the window. Press ENTER when you''re finished.


    Pressing ALT–F4 closes the current window, and pressing ALT–F5 calls up the Windows
    List, listing all virtual desktops and windows in use.


    Tip You can cycle through the windows opened on your desktop with ALT–TAB. Hold
    down ALT as you press TAB to move from window to window. Release the ALT key when
    you find the window you want to use.


    You can also use your mouse in conjunction with your keyboard to move or change
    the size of your windows. Open a terminal from your panel (the icon with the screen
    and arrow). Place your pointer over the window''s white space, hold down ALT,
    and click. Release the ALT key, continue to hold down the left mouse button and
    move your mouse. Release this button when you''ve repositioned your window to
    your liking.


    Now place your pointer over the white space again, press ALT, and rightclick.
    Remember this bidirectional arrow? Depending on where you click, you''ll get a
    vertical, horizontal, or diagonal arrow. To reshape the window, release the ALT
    key while holding down the right mouse, and drag the mouse in any direction.


    # ### The CTRL Key


    Pressing CTRL in combination with the F1, F2, F3, and F4 keys switches to desktops
    1, 2, 3, and 4, respectively. Pressing CTRL–TAB moves you to the next desktop;
    pressing CTRL–ESC calls up the Task Manager window; and pressing CTRL–ALT–V calls
    up the Klipper pop-up menu. Again, to escape these windows, press ALT or ESC.'
