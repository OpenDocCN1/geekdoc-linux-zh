  md: '# Using the To–Do List


    With the To–Do list feature, you can create a list of tasks with subtasks, due
    dates, and priorities, and then check off each item as you finish it.


    **When working with your To–Do list, you may find it easier to view it on its
    own; click the To–Do List View icon to change your view.


    # Adding a Task to the To–Do List


    To add a new item to your list, select New To–Do from the Actions menu. Enter
    your task information in the General and Attendees tab in the window that opens.


    ![](img/fb7a71d55b85722293f8087c0b352fcc_64_0.png)


    **Figure 4.12: Creating a To–Do Item**

    The only required field in the General tab is Summary, but you may find it helpful
    to enter some additional information about the item, such as due dates and times.


    Enter the name or a brief description of the task in the Summary box. This name
    will be visible on the left edge of the To–Do list and will have a check mark
    next to. To select a due date, make the next box to Due is checked, and select
    a due date from the calendar or type the date in the text field. If you want to
    have a due time, check the box to Time associated, and you will be able to enter
    a time in that field. If you want to have a start date (or instead), follow the
    same procedure with setting a due date.


    Use the pull–down menu on the right to set the priority. The default priority
    level is 3 (medium). You can also select a percentage completed from the pull–
    down menu on the left to keep track of your progress.


    Enter any notes or comments about the task in the large text field down to the
    bottom of the window. You will be able to view these notes by doubleclicking the
    to– do item after it has been added to your To–Do list.


    To enter a category for the task, click Categories, and a new window will appear
    showing the various categories.'
