- img_proc: true
  md: '# Preparing to Scan


    Before scanning, prepare a Save pathway for your file. Under Output Filename check
    the directory pathname, which defaults to your home directory, and give your scan
    a name.


    ![](img/fb7a71d55b85722293f8087c0b352fcc_138_0.png)


    Figure 7.12: Check the Directory Pathway before Saving New Scan Files

    End your filename with the three–character extension of the file type you use;
    for example, .tif for TIFF or .jpg for JPEG format. Unlike applications on other
    operating systems you may be familiar with, this program smart-saves based on
    the three–character extension. This means it will save in a format based only
    on the three–character extension; you don''t have to select a file.


    +   * If you are scanning more than one photo, be careful! Check the filename
    pathway before you click the Scan button. If it''s the same as the previous scan''s
    filename, you''ll overwrite that file.


    While scanners come in several configurations, such as drum or slide, most office
    environments use the more common flatbed scanner. Flatbed scanners look like desktop
    photocopying machines and open from the top.


    After cleaning the glass below the scanner lid (known as the plate), use the guides
    to position the piece to be scanned on the scanner plate. Take care to line up
    rectangular items as pages of text, photos, or artwork that include straight lines
    with the edge of the scanner plate. Although you may rotate scanned images later,
    with applications like the GIMP or Contour, the results are sometimes poor. Take
    time to ensure the quality of the resulting image prior to scanning.


    Open the Preview window by clicking the button at the bottom right corner of xscanimage''s
    opening window, and then click Acquire Preview. The scanner will conduct a prescan,
    and a thumbnail of your image will appear in the Preview window. Next, use the
    cursor to select only the part you want to scan, or go back to the xscanimage
    window and adjust your settings; keep clicking Acquire Preview until you are satisfied.'
  merge: -1
  pgno: 138
- img_proc: true
  md: '![](img/fb7a71d55b85722293f8087c0b352fcc_139_0.png)


    Figure 7.13: The Acquire Preview Window Showing Low–Resolution Version of an Image,
    So that Necessary Adjustments Can Be Made Prior to Scanning


    When you are ready, click the Scan button (located to the left of the Preview
    button). You will not see scanning results until you actually open the image in
    a graphical application such as The GIMP.


    +   - Clean up prior to scanning! Handle photos by the edges or with gloves. If
    you are using a flatbed scanner, clean the glass plate with regular glass cleaner
    before scanning. You''ll save valuable retouching time later.


    # # Scanning Resolutions


    The xscanimage has a default resolution of 300 dots per inch (dpi), and you can
    decrease or increase the dpi value from 12 to 1,600. The higher the number, the
    larger your image will be, both in terms of system resources required to render
    it and in actual dimensions on the screen. If your image will be viewed only on
    a monitor as part of a presentation package (or the Web), and you are happy with
    the original size, scan at 72 or 96 dpi. In the world of computer monitors, 72
    or 96 dots per inch on the screen, depending on whether your computer is Mac–
    or PC–compatible. Either way, you''ll be fine working with 72 dpi. If you need
    a larger image, scan at 144 dpi or more. The graphic will still be 72 dpi, but
    it will be larger than the original on the screen.


    If your image is intended for commercial printing, things get a lot more complicated.
    Ink–on–paper printing technology uses a measure called lines per inch (dpi). The
    rule of thumb for images intended for commercial printing is this: dpi x 2 = dpi.
    Set your scanning resolution to acquire an image at least four times bigger than
    you want it to be on the printed page. For images that will be viewed only on
    a monitor, scan at a one-to– one aspect ratio, or larger than oneto– one if you
    want a small image to appear larger on the screen.'
  merge: -1
  pgno: 139
- img_proc: true
  md: '# Moire Patterns


    Moire comes from the French language, meaning an irregular wavy pattern in fabric.
    Moire patterns occur when you scan something that already includes a halftone
    screen, such as a printed image. Printed jobs are usually set to little dots on
    the page. Color is represented by dots of cyan, magenta, yellow, and black. Because
    the dots are so small, your eyes will mix the colors so that you see a continuous
    range of color and not just dots. The press operator at the printer''s will use
    a different screen angle for each ink to form a nice rosette pattern of colored
    dots, which helps the eye mix the dots into perceived colors. Look at a photo
    in a magazine with a magnifying glass, and you''ll see what we mean.


    When you scan a printed page, the screens won''t match. The rosette pattern will
    be visible in your scanned-screen image, and if you send it to a printer this,
    you''ll end up with a messy final result. There are no ways to lessen this problem
    using the GIMP, but in general, don''t scan printed images. You''ll be safer legally
    as well.


    # Kontour


    KDE comes with an Adobe Illustrator clone called Contour (formerly known as Illustrator).
    Contour is a vector drawing application. In other words, images you see on the
    screen are calculated mathematically by the application, resulting in perfectly
    smooth edges and text. This is especially important if your document is intended
    for traditional printing on paper. The GIMP, as you will see in Chapter 8, works
    with images as collections of individual pixels and is the right application to
    use for paint effects or photographs. Contour is also right for working with text
    or geometric shapes. However, you can work with both, and bitmaps images from
    The GIMP can be imported or placed into Contour documents.


    # Getting Started with Kontour


    Access Contour from K menu • Office • Contour. You''ll be presented with an introductory
    screen.


    > Tip If you can''t find Contour under Office the K menu, type kontour in the
    Run Command dialog box.


    Here you can open an existing Kontour document, a recent document, or a new document.
    You even can open files formatted for XFig (.fig), MS Office (.msod), or Windows
    Metafile (.wmf) templates.'
  merge: -1
  pgno: 140
- img_proc: true
  md: '![](img/fb7a71d55b85722293f8087c0b352fcc_141_0.png)


    Figure 7.14: Opening Kontour

    Open a new file, and you''ll see a drawing window with tool options down the left
    side, and file, view, copy, and paste options across the top.


    ![](img/fb7a71d55b85722293f8087c0b352fcc_141_1.png)


