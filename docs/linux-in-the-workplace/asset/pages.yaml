  md: 'cp [options] source destination


    If the final argument is a directory, then all specified files are copied to that
    directory under their same name:


    cp [options] files directory


    # Common Options


    | -a | Archives by preserving the file attributes and including subdirectories
    but not following symbolic links. |

    | --help | Displays a help message. |

    | -p | If possible, preserves file attributes such as owner, modify time, and
    access permissions. |

    | -R | Recursively includes subdirectories. |

    | -v | Explains what is being done. |


    # Examples


    Make a copy of harry in your current directory. The copy is given the new name
    chest in your current directory.


    cp harry /tmp/chest


    Copy all files whose name start with a or b in /tmp to your current directory,
    preserving file attributes:


    cp -p /tmp/[ab]* *


    Copy all files in the directory /home/bill/secret and any subdirectories into
    /tmp/savebill


    cp -R /home/bill/secret/* /tmp/savebill


    # mv—Rename or Move Files


    The mv command moves or renames files. You do not need to concern yourself with
    the distinction, as mv what is necessary. Like the cp command, there are two formats.


    In the most basic form, you just specify a source filename and a destination filename:


    mv [options] source destination


    # Common Options


    | --help | Displays a help message. |

    | -i | Prompts before overwriting any files (interactive). |

    | -U | Moves only older or brand–new nondirectories. |

    | -v | Explains what is being done. |


    > Some Linux distributions include a shell alias that sets the -i option by default.
    Type alias at the shell prompt to see your current list of aliases.'
