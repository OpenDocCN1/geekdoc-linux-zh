  md: '![](img/fb7a71d55b85722293f8087c0b352fcc_179_0.png)


    Figure 9.14: Creating a New Mail Folder


    A pop-up box asks you to enter a name for the folder and decide if it should be
    the top level of the folder hierarchy or a subfolder of an existing top-level
    folder. If you are creating a folder to store messages, or posts, from a mailing
