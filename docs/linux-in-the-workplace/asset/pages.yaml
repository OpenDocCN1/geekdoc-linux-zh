  md: '# Conventions


    The remainder of this chapter uses certain conventions in its examples as a metalanguage
    to help you understand the commands.


    | Monospaced font | Monospaced font is used to indicate examples. |

    | [] | Square brackets are used to show optional information that may be included
    within a command and shouldn''t actually be typed. Don''t confuse this with the
    character— matching operation. |

    | Boldface | Boldface identifies the proper syntax for typing particular commands—in
    other words, the way the commands should be set up and typed. The word used is
    intended to be described in italic. The most common example is file to represent
    a filename. Plurals (for example, files) are used to indicate multiple instances
    are permitted. |

    | italic | Parameters to be replaced are shown in italic. The most common example
    is file to |

    | option | The option keyword can be replaced with any of the available command
    options. Using options indicates that more than one may be used. |


    # File Hierarchy


    You learned about files back in Chapter 3, where you could move around the hierarchy
    by pointing and clicking. When using the shell, you need to know how to move around
    the hierarchy because you don''t get any graphical charts.


    > **Tip** Although any character (including control characters) in filenames,
    it is best to stick to letters, numbers, and some safe, special characters, such
    as _ , and .


    # Naming the Pieces


    By convention, the slash character (/) is used to separate the levels in the file
    hierarchy. The top level of the file hierarchy, usually referred to as the root,
    is identified by /, and all other files are located relative to it.


    The location of a file within the hierarchy is called its pathname. Pathnames
    can be specified to your current directory—that is, where you are now—or relative
    to the root directory. A pathname starting with / signifies that it is relative
    to the root and is called a full pathname. If a pathname does not start with /,
    it is relative to your current directory and is called a relative pathname.


    Each directory has two special names in it .(dot) and .. (dot): . is a synonym
    for the current directory, and .. is a synonym for the parent of the current directory.
    They are always there, so you can use them as shorthand to help you move around
    the hierarchy.


    # Examples


    My home directory is called fyl lives under the directory home, which is off the
    root of the hierarchy. The full pathname of my home directory is /home/fyl.


    If I am in my home directory, as described in the preceding example, and your
    home directory is called jill, also located under home, then /home/jill is the
    full pathname to your home directory.../jill is the relative pathname to your
    home directory.'
  merge: -1
  pgno: 298
