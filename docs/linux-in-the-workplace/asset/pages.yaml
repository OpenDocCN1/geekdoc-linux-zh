- img_proc: true
  md: '• A special argument called an option, begins with a hyphen (-). Long options,
    a special kind of option, begin with two hyphens (--). Generally, options are
    used to modify the way a command works.


    • Multiple commands can be entered on one line by separating them with a semicolon
    (;).


    • You can tell the shell to run a command in the background and thus not tie up
    your terminal screen following it with an ampersand (&).


    # Examples


    Display a long (detailed) list of all files in the directory /bin paged through:


    ```

    ls -l /bin | more

    ```


    Print the date on the terminal, and then write a long list of all files in the
    directory /bin to the file /tmp/testme. Note that the redirection applies only
    to the ls command, not to the date command:


    ```

    date; ls -l /bin > /tmp/testme

    ```


    # Command-Line Editing and Shell History


    The shell keeps a record of your recent commands and allows you to retrieve them,
    edit them, and re-execute them. Depending on the mode in which your shell is set,
    the history access and editing will work like either the Emacs editor or the vi
    editor. That is, the text-editing features of either Emacs or vi make sense to
    use on a single line are available within the shell. To select vi mode, enter
    -o vi at your prompt. To select Emacs mode, enter -o emacs at your prompt.


    You can make a permanent change to your .bashrc file in your home directory by
    adding the appropriate command to the end of it. The change will not take effect
    until your next login.


    If you are not familiar with either Emacs or vi, you will likely do better in
    Emacs mode. In this mode, the up and down arrow keys can be used to move through
    the history, and use of the left and right arrows, as well as the BACKSPACE and
    DELETE keys, allow you to edit the command. Press ENTER executes the resulting
    command.


    If you are in vi mode, press ESC (ESCAPE), and then vi any command that works
    on a single line used. Use the up and down arrows, or J and K, to move between
    the lines of the history.


    # Command Completion


    Besides providing command history, Bash will guess the name you mean if you are
    entering the name of a file. Once you have entered enough of a filename to make
    it unique, TAB TAB. If it is in fact unique, Bash will fill in the rest of the
    name. If it is not, nothing happens. At that point you can, however, press TAB
    again, and the shell will list all the possible matches and wait for you to continue
    entering characters.'
