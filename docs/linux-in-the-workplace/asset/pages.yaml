- img_proc: true
  md: '# Changing Passwords


    When selecting a password, it is important to choose one that you will remember
    easily (it''s best to avoid writing it down) and that''s not easy for others to
    guess. Avoid names, dictionary words, or anything related to easily obtain personal
    information. A good password combines upper– lowercase letters with nonalphanumeric
    keys. Passwords as *nCk6Ve or ~uGy$Uds– are good examples. Your system administrator
    may assign you a password, but if you are responsible for your own, it''s a good
    idea to change it approximately every two months.


    You can change your password using the KPasswd utility found in the Utilities
    submenu of the K menu. You''ll learn to navigate this menu later in this chapter.


    ![](img/fb7a71d55b85722293f8087c0b352fcc_16_0.png)


    Figure 2.2: The Change Password Dialog Box


    # Logging Out


    To log out from your computer at the end of a session, click the K button on the
    panel, and choose Logout from the pop-up menu. A dialog box will come up asking
    whether to restore your current session when you next log in and to confirm that
    you really want to log out. Click Logout to confirm.


    ![](img/fb7a71d55b85722293f8087c0b352fcc_16_1.png)


    Figure 2.3: Logout Screen


    **Tip** Before you log out of the system, make sure that all your work has been
    saved. This will help'
  merge: -1
