  md: '# Using Plugins


    Some websites use file types that are not known to your web browser (Flash or
    Shockwave files, for example). Often, they will a link from which you can download
    an application known as a plugin to read this type. When these files appear, click
    the link, follow the download instructions, and install the application, which
    will automatically associate itself with the file types it can. Many times office
    users do not have the permissions to install plugins, so it will be to consult
    your system administrator.


    By large and using, plugins provides more enjoyment of the Web because they allow
    you to access more types of files. You may find, however, due to your browsing
    habits, you are always being forced to turn on plugins you could get by them.
    Because plugins take up space on the hard drive and in the memory, having a few
    plugins may slow down the entire machine.


    Konqueror provides a basic on/off check box for plugins. In Konqueror''s Settings,
    click Configure Konqueror, and select Konqueror Browser from the pop-up menu.
    The fifth tab of this Konqueror Browser menu is titled Plugins, and it provides
    a simple check box for enabling or disabling plugins. The default allows plugins,
    and if you do not have any specific problems, it can be left alone.


    The Netscape Plugins section of the Konqueror Konqueror menu, back on the vertical
    Settings menu, gives you several options for managing any Netscape Plugins you
