  pgno: 85
- img_proc: true
  md: '![](img/fb7a71d55b85722293f8087c0b352fcc_86_0.png)


    # ### 5.5: Opening an Existing Document


    When you open a file from a directory in this way, the Open Folder dialog box
    allows you to select a file type. OpenOffice defaults to All, which lists and
    searches through all file formats automatically. You can choose to narrow the
    number of formats by selecting a specific one from the File drop-down menu. For
    example, if you have the name of the document you want to open, but it is in MS
    Word 97 format, select MS Word 97 from the drop-down menu. Only the MS Word 97
    files within that directory are listed in the Open dialog box. For more file options,
    see the Open dialog box.


    The Open dialog box also allows you to do things like create a new folder or to
    save or move documents; simply click the new directory icon (it pictures a folder
    with an asterisk in the upper right corner). The default directory icon, featured
    to the right of the create new directory icon and displaying a sledgehammer, allows
    you to return to the default directory (set by default as your home directory).
    To navigate to the file you are looking for, the one level icon to the right of
    the create new directory icon takes you the parent directory of the current directory.
    OpenOffice also lists the most recently used documents at the bottom of the File
    menu for quicker access.


    Importing and exporting MS Word and other documents created in popular word-processing
    file formats is quick and easy in OpenOffice. Follow the example just given in
    "Opening an Existing Document" to import a file format. To save a document as
    a file format, go to the Save As dialog box, simply click the arrow within the
    File text box, and select the desired format from the scroll bar.


    *OpenOffice comes loaded with a thesaurus. You can access it from the Tool menu.


    # Formatting Your Document


    Formatting allows you to choose the font and page styles to your document. There
    are many options available in Writer. Here we review standard formatting tools.
    Advanced users feel confident that other formatting features, such as those that
    let you apply styles, add tables, and create indices, are all available. They
    are located generally in the same places you would find them in other word processing
    applications. All of these formatting options can be set before beginning a new
    document or applying to existing documents.'
  merge: -1
  pgno: 86
- img_proc: true
  md: 'Tip Spell check a document by selecting Spellcheck or AutoSpellcheck from the
    Tools menu.


    Tip When you begin a task or turn on a feature that OpenOffice thinks it can help
    explain, such as AutoSpellcheck, a light bulb appears in the bottom left corner
    of the window. Clicking on it brings up the relevant topic in the Help contents.


    # Choosing a Font


    The default Writer font is 12–point Thorndalde. To change the font, simply highlighted
    the desired text and select the default font type and size boxes above the document.
    Next to the font name and size are buttons for Bold, italic, and underline.


    # Aligning Text


    The Writer default is left-justify all text within a document. If you want some
    or all of your document to be aligned differently, highlight the appropriate text
    and select an alignment icon (featured just above the document and next to the
    font attribute icons). Options include left, centered, right, and forced justification.


    # Using Bullet Lists


    Place the mouse pointer at the beginning of the paragraph or sentence where you
    want to insert a bullet or number. Click either the bullets or numbers icon in
    the second row of icons at the top of the OpenOffice desktop. The paragraph or
    sentence is instantly formatted as the appropriate type of list. To turn off bulleting,
    move your mouse pointer to the beginning of the paragraph or sentence where you
    want to end the list or delete a bullet, and again click the bullets or numbers
    icon.


    You can apply a different bullet or numbering symbol by selecting Numbering/ Bullets
    from the Format menu. The Numbering/Bullets dialog box appears.


    ![](img/fb7a71d55b85722293f8087c0b352fcc_87_0.png)


    Figure 5.6: The Numbering/Bullets Dialog Box'
  merge: -1
  pgno: 87
- img_proc: true
  md: 'Select the appropriate tab at the top (bullets, numbers, or graphics). Then
    click the example box of your choice and click OK.


    # Increasing and Decreasing Intents


    To increase or decrease the indentation of text, click one of the two indent icons,
    featured just above the document to the right of the numbers and bullets icons.
    The icon featuring text and an arrow pointing left decrease an indent, whereas
    the icon featuring text and an arrow pointing right increase an indent. Click
    the icon more than to add more or less indentation.


    # Applying Color


    Color can be applied to text characters or added as a highlight over a string
    of text. The color icons are found next to the indentation icons. Select the text
    you want to color or highlight by clicking and dragging your mouse pointer over
    the desired text. Then click the icon featuring a yellow background behind the
    A character, and your text is highlighted.


    Color also can be applied to the background of a document. The icon that features
    a palette of colors (positioned next to the character color icons) performs this
    task for you. Click the background color icon. A dialog box appears prompting
    you to select a color. Once you have clicked the desired color, your background
    changes to the new color.


    ![](img/fb7a71d55b85722293f8087c0b352fcc_88_0.png)


    Figure 5.7: Coloring the Background of a Document


    # Advanced Formatting Tools


    Advanced page formatting tools are available in a central dialog box titled Page
    Style. To access it, select Page from the Format menu, and the Page Style dialog
    box appears.'
  merge: -1
  pgno: 88
- img_proc: true
  md: '![](img/fb7a71d55b85722293f8087c0b352fcc_89_0.png)


    Figure 5.8: Page Style Dialog Box

    Here you are given the opportunity to select the background color, size, and margins
    of the document; apply headers, footers, and borders; and even set columns.


    Advanced paragraph and character formatting tools are also available. Select Paragraph
    or Character from the Format menu, and the Paragraph or Character dialog box appears.
    From here you can apply drop caps, tabs, and alignment, among other advanced paragraph
    formatting tools.


    To add page numbers to your document, choose the Footer tab from Format • Page,
    check the Footer On box, and select OK. Next, from the Insert menu choose Fields
    and then Page Numbers. A 1 appears in the footer. If you want the page numbers
    to appear as “1 of 10” or “1 of 18", and so on, select Fields and then Page Count.
    Next, under Footer, edit the text to add the word “of".


    82'
  merge: -1
