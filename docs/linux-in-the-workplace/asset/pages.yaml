  md: '# Chapter 6: Alternative Office Software


    # KOOffice


    KOOffice is an office suite still somewhat in its infancy, having reached the
    1.x release in 2001. Here we introduce KOOffice''s word processing and spreadsheet
    applications, both of which are easy to use and trustworthy. The KOOffice includes
    many applications:


    +   * KWord: a frame– based, full–featured word processor and desktop–publishing
    application.

    * KSpread: a standard, table– oriented spreadsheet application.

    * Kontour (formery known as Killrator): a vector– based drawing program along
    the lines of CoreDRAW or Adobe Illustrator. This application is covered in Chapter
    7.

    * KPresenter: a presentation application.

    * Kivo: a flowchart application.


    The following applications allow you to edit objects you want to insert, like
    charts and graphics, into the main applications:


    +   * KChart: chart– drawing program.

    * KFormula: a formula editor.

    * Krayon: a pixel– based, image manipulation program.


    Although many users use OpenOffice’s more mature environment, we recommend following
    the development of KOOffice, which may become a standard in the near future.


    You should be able to locate KOOffice in your Linux distribution. If not, the
    suite is available for download at http://www.koffice.org/


    KOOffice has an impressive line of office– related applications that function
    well together, taking up a lot of space on your hard drive. You might notice KOOffice
    isn''t as polished as other office suites, like MS Office and OpenOffice. However,
    you''ll find that all of your bread–butter functions, and are adequately covered.


    > **Tip** Remember to visit KOOffice''s website frequently, http://www.koffice.org/
    for new releases.


    # Navigating KOOffice


    Once KOOffice is installed, launch it from the Office submenu of the K menu. You
    can launch any of the individual applications from here, or you can type the name
    of an application in the Run dialog box.


    In addition to launching each application in KOOffice separately, you have the
    option of opening the KO Workspace (also from the Office submenu), opens the entire
    suite at once. On the left side are two useful menus: Parts and Documents. You''ll
    notice that the Parts conveniently allows you to open any of the other applications.
    If you look toward the bottom you''ll see a button labeled Documents. Though it''s
    out of the way and inconspicuous, this allows you to switch back and forth between
    any open documents. Certainly this navigation method is different from other office
    suites, but you''ll find an efficient way to maneuver in KOOffice.


    Other than that, navigating KOOffice is similar to navigating other office suites.
    If you like using your mouse, you can click the menus and commands on the top
    of the application bar. If you prefer the'
  merge: -1
  pgno: 108
- img_proc: true
  md: 'keyboard, you can use the same types of keyboard shortcuts explained in the
    section of Chapter 5 called "Keyboard Shortcuts in the OpenOffice Suite.\, pressing
    ALT–T and then S activates the Tools menu and launches the spell– checker function.
    Unfortunately, it’s impossible to move around between different files in the KOffice
    Workspace without using the mouse.


    Another helpful shortcut is using the CTRL key and a letter to activate various
    commands, which you can find in the menu top. You may be familiar with CTRL–S
    for saving, CTRL–Q for quitting, and CTRL–P for printing, each of which is standard
    in KOffice. Be careful, however, now and then you’ll come across dead-end keystrokes,
    especially in text formatting. For example, CTRL–B will create bold text in most
    word processors, but not in KOffice applications.


    # KWord


    If you’ve experienced severe frustration trying to use a typical word processor
    for desktop–publishing (DTP), KWord may be the tool for you. KWord allows you
    to position a series of one or more frames in a document, each containing graphs,
    text, or objects from another KOffice application. The concept of frames was made
    popular by Adobe Framemaker software, and it enables smooth integration of all
    elements.


    One area where KWord needs improvement is file format portability. KWord can import
    MS Word documents, but it cannot export them. Furthermore, KWord will not open
    StarOffice or OpenOffice documents. However, importing and exporting functions
    are familiar in the works for AbiWord, ApplixWord, DocBook, HTML, LaTeX, MIF,
    RTF, StarOffice, OpenOffice, StarWriter, and WordPerfect.


    # Creating a New KWord Document


    The most intuitive route to a new KWord document is clicking on the KWord icon
    in the Parts menu. A dialog box comes up that you select from four options:


    +   • Create new document with template, which offers two options:

    1. Page layout documents: two templates with multiple frames are offered for desktop
    publishing– oriented documents.

    2. Text– oriented documents: choose from A4, Plain Text, Two Columns or US Letter
    templates for standard word–processing documents. Each contains one major frame.
    (See “Using Frames” later in this chapter.)

    n• Open an existing document.

    • Open a recent document.

    • Start with an empty document.'
  merge: -1
  pgno: 109
- img_proc: true
  md: '![](img/fb7a71d55b85722293f8087c0b352fcc_110_0.png)


    Once you''ve made your choice, you will have a new KWord document. Other options
    for creating a new document include clicking the icon that looks like a piece
    of paper in the upper left corner or choosing Open from the File menu.


    ![](img/fb7a71d55b85722293f8087c0b352fcc_110_1.png)'
