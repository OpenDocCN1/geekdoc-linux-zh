  md: 'Set the top and bottom margins by using the vertical ruler. You can also set
    the margins from Page Setup on the File menu, which is the one exception to the
    rule that formatting items appear only on the Format menu.


    # Using Styles


    By applying a style, you can specify all the formatting for selected text in one
    step, instead of separately selecting the typeface, size, boldfacing, and margins.
    This will add consistency to your documents.


    To apply a style, either highlight text already present or set the style for the
    text you are about to type. Next, select a style from the Style combo box at the
    far left of the Formatting toolbar, next to the Font menu. You can modify styles
    or create new ones by selecting Style from the Format menu.


