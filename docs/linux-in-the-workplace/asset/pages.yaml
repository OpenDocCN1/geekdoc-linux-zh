    # Virtual Desktops


    Virtual desktops are simply additional desktops. It is somewhat like having multiple
    monitors connected to the same computer, except only one is visible at a time.
    Their purpose is to give users more workspace. Linux''s multitasking capability
    allows your computer to handle many tasks at once. Virtual desktops make it easier
    to manage these multiple tasks and allow you to have more windows open at once
    than you could with one desktop.


    The block of numbers (1, 2, 3, and 4), collectively known as the pager icon, that
    follows the row of panel icons represents the virtual desktops. Initially, you
    may question the need for more than one desktop, but you''ll learn to love the
    extra real estate additional desktops provide, as well as their ability to help
    you stay organized.'
