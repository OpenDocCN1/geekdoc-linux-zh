  md: '# Chapter 8: More on Graphics: The Gimp


    # Overview


    The GIMP, which stands for the GNU Image Manipulation Program, is an open-source
    program comparable to the popular Adobe Photoshop application. Both Photoshop
    and The GIMP are huge applications, with many features that can take years to
    master. Covering The GIMP is a book-worthy project in itself; several excellent
    books have been written on the subject. Check Grokking the GIMP by Carey Burks,
    published by New Riders Press, or the invaluable GIMP Manual by Karlin and Olaf
    S. Kylander, available online at http://gimp.org/ or printed form as GIMP: The
    Official Handbook from the Coriolis Group. http://gimp.org/ contains FAQs, cool
    effects you can download and, samples of artists'' work to inspire you.


    The GIMP, like Photoshop, is a bitmap application. In other words, it uses pixels
    to represent colors and shapes. Use The GIMP to create your own original works
    of art using various painterly effects and tools, to manipulate, retouch, and
    otherwise alter photographic images you have scanned into your computer. You can
    even create animated banners and buttons for the Web.


    This chapter doesn''t explore the whole range of GIMP possibilities, but it does
    examine some simple basics that allow you to retouch photos, add text, and otherwise
    jazz images with special effects. If you keep working with The GIMP, you may eventually
    become a GNUexpert!


    # Getting Started


    For those who have worked with Adobe Photoshop, the GIMP will be both familiar
    and strange. The user interface for The GIMP looks at exactly like Photoshop,
    but some of the options are different. The GIMP also makes heavy use of the right
    mouse button. Many menu options that appear at the top of the screen in Photoshop
    are available via a quick right- click in The GIMP (including Save). This takes
    a bit of getting used to, but it is quite convenient once you''ve developed the
    habit.


    To Launch GIMP, go to the K menu, and scroll to Graphics (or your distribution''s
    name). The GIMP will appear under the subheading Graphic or under the distribution
    name (for instance, Debian).


    +   - Tip You can launch the GIMP directly from the command line or a Run Command
    box simply by typing gimp.


    The GIMP''s opening window will load, and a tip of the day will appear, after
    which you''ll move into the application space itself. Version 1.2 of The GIMP
    has the added feature of opening with whichever menus you left the last time you
    used. If you close all the menus when you''re finished, it will open with only
    the toolbar visible.'
  merge: -1
  pgno: 149
- img_proc: true
  md: '![](img/fb7a71d55b85722293f8087c0b352fcc_150_0.png)


    Figure 8.1: When You First Launch the GIMP, You''ll Be Presented with a Toolbar


    # # The Toolbar


    All of the tools on the toolbar are also available with a right– click of the
    mouse anywhere within an open image, so you may find that you don''t need the
    toolbar to be visible at all times.


    # ## File and Xns


    First are the basic File and Xns menus. From File, you can open files or access
    dialog boxes, where you''ll find the Brush, Pattern, Palette, and Gradient menus.
    These menus allow you to choose size and type, color, and gradients, and all are
    intuitive. From the File menu, you can use the GIMP to take screenshots as well.
    This works in almost exactly the same way as KSnapshot (see Chapter 7). The Xns
    menus provide access to extension and module menus. These are for creating effects
    and are meant for advanced users. It is probably best to leave all of them at
    their default settings. The ever–popular Script–Fu (more about Script–Fu later)
    and direct web links to GIMP resources are also available from the Xns menu.


    # ## Color Menu


    ![](img/fb7a71d55b85722293f8087c0b352fcc_150_1.png)


    Figure 8.2: Selected Foreground and Background Colors Shown in the Color Menu'
  merge: -1
  pgno: 150
- img_proc: true
  md: 'At the bottom left of the toolbar is the Color Selection menu, where selected
    foreground and background colors are visible. Click the arrow icon to toggle foreground
    and background color (the defaults are black and white). Double– either color
    to open the Color Selection menu and choose a new color. When you can scroll through
    a rainbow– colored bar to select a hue range. Click within the large hue window
    to select a color tone, or manually enter or adjust HSV (hue/saturation/value)
    or RGB (red/blue/green) colorage numeric equivalents.


    Tip Painting tools in The GIMP draw in the foreground color, and the background
    color is the color of your canvas. When you select areas or use the erase tool,
    the background color appears. Click the arrow icon in the Color menu to toggle
    between foreground and background colors.


    # Dialog Menu


    ![](img/fb7a71d55b85722293f8087c0b352fcc_151_0.png)


    Figure 8.3: Dialog Menu

    The Dialog menu located at the bottom right side of the toolbar allows for quick
    access to the Brush, Pattern, and Gradient menus, and it also provides a thumbnail
    that shows which brush, pattern, and gradient is activated for your reference


    from the toolbar. If you select something other than the default for any of these
    three, that change will be reflected in the Dialog menu icon on the toolbar.


    Access the Brush menu by clicking the top left block in the Dialog menu icon.


    ![](img/fb7a71d55b85722293f8087c0b352fcc_151_1.png)'
  merge: -1
