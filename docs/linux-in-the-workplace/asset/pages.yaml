- img_proc: true
  md: 'Double-click on any tool to access its Option menu. The Option menu allows
    you to adjust the settings for the tool.

    If you leave your mouse pointer hover over any tool, a small box will appear telling
    you what the tool is.


    # Selection


    # Selection


    ![](img/fb7a71d55b85722293f8087c0b352fcc_153_0.png)


    Figure 8.7: Selection Tool Icons

    Three selection marquee tools allow you to select a rectangular, circular, or
    freehand area within your image. These selection tools may be all you need in
    some instances, but for more control, you may want to move to the following set
    of more intelligent selection tools.


    # Smart Selection


    # Smart Selection


    ![](img/fb7a71d55b85722293f8087c0b352fcc_153_1.png)


    Figure 8.8: More Advanced Selection Tool Icons

    Next we have the fuzzy selection, Bezier curves, and intelligent scissors tools.
    When you want to grab parts of an image, manipulate, scale, distort, move or color—correct
    only a portion of your image. The GIMP provides these selection tools, offering
    a range of simple to precise control.


    Click within a photograph with the fuzzy selection tool, and the tool will select
    similarly colored pixels. With a fuzziness of zero, the GIMP will search for pixels
    of the same color as the one you select by clicking within the image. Increase
    the fuzziness to allow the GIMP to search for an increasing range of color density
    from the selected pixel—not only black, but also a range of greys. The higher
    the number in the setting field, the more greys will be selected.


    Leave the anti-aliasing off for all selection tools. The antialiasing allows blend
    areas of high contrast at the edges, which reduces the jagged edge you would in
    a strictly black—and white halftone image. The Feather option allows any selection
    to a partially transparent edge, for a blurry effect. The Sample Merged option
    is used only in multiple-layered files, where the current layer includes a mask
    or a setting other than Normal and for pixel data from subsequent layers to be
    included in the selection.


    The Bezier tool works like a pen and is the most precise tool for selecting areas
    within an image. With it, you can draw curves with editable splines (the lines
    that you drag the cursor around the selection area with the Bezier tool and anchor
    points) shapes for more precise control. This tool takes a bit of practice, but
    it will be familiar to previous users of vectordrawing application, such as Adobe
    Illustrator or Contour. If you don''t have such experience,'
  merge: -1
  pgno: 153
- img_proc: true
  md: 'practice some, and you''ll get the hang of it. Keep in mind, however, that
    you can''t add or subtract anchor points (which look like small blocks) like you
    can in Adobe Photoshop.


    Once you''ve roug out a shape by clicking around the image area you want to select,
    click the first anchor point again to close the shape. Next, position the cursor
    over an anchor point, and lines will appear. You may use these to pull the spline
    between anchor points to curve areas for complete control of your selection. Press
    CTRL key to position anchor points, or press the SHIFT key to change an anchor
    point from its soft corner to a sharp one. Once satisfied with your spline and
    anchor point placements, click inside the shaped curve to turn it into a selection.
    If you want to select everything else in the image, right—click and choose Selection
    • Invert to select everything the outlined image area.


    With the intelligent scissors you can "draw" around areas of high contrast within
    the image. This area then becomes the selection when you click inside the created
    shape. You can use the tool''s Options menu to set the selection sensitivity and
    convert your selection to Bez curves. You''ll get other selection options by right—clicking
    and choosing Selection.


    # Move, View, and Crop


    # Move, View, and Crop


    ![](img/fb7a71d55b85722293f8087c0b352fcc_154_0.png)


    Figure 8.9: Move, View, and Crop Tool Icons

    The next set of tools allows you to move an entire image or a selection within
    the image, (by left—clicking the image) or decrease (by pressing the


    SHIFT key) view magnification, or crop the image.


    Move literally means to shove a selected area or the entire image within the image
    window. The background color or subsequent layers will appear beneath the moved
    selection.


    Cropping allows you to focus on only the part of the image you want to work with,
    discarding the rest. Click the Crop tool button, drag the mouse so the area you
    want cropped appears in the square. You will see a window Crop Information, which
    gives you the dimensions of the cropped area. If you click the Crop button, you
    will be left with only the selected area of the image. The rest will disappear.


    # Transform, Flip, and Text


    # Transform, Flip, and Text


    ![](img/fb7a71d55b85722293f8087c0b352fcc_154_1.png)


    Figure 8.10: Transform, Flip, and Text Tool Icons'
  merge: -1
  pgno: 154
- img_proc: true
  md: 'The transform tool allows scaling, rotation, shearing, perspective scaling
    of a selected area or the entire image. The perspective scale allows you to stretch
    and compress parts of the selection to give the illusion that the elements of
    the image are closer or farther away from the viewer.


    The flip tool flips the image on a horizontal or vertical axis. These settings
    are available in the Options window.


    The text tool allows the addition of words to the graphic. This tool only for
    large-sized text, a small amount of text, or in images intended for onscreen viewing.
    Fonts loaded on your desktop''s X server will appear in the Font menu. The text
    will be drawn in pixels, not in mathematically defined curves as a word processor
    or vector application. If you need perfect text clarity or a lot of text to add
    to your image, save your GIMP image in JPEG, TIFF, or EPS format and import it
    into an application such as Contour or OpenOffice, which handles text and draws
    elements rather than collections of pixels, resulting in perfectly smooth edges.
    If you choose to place text directly within your GIMP image, make sure you are
    using PostScript Type I fonts, will not scale correctly. Check with your system
    administrator to ensure that only PostScript fonts are installed on your system.


    When you click the text tool in the drawing space, a window pops up with font,
    font size, spacing, and so on. The text will be colored in the foreground color
    selected. Type the text in the space provided at the bottom of the window. When
    you click OK, the text will appear in your image as a selection. When you click
    anywhere else in the image, or with another tool, the text will become part of
    the image. We will discuss layers, but keep in mind that it''s a good idea to
    type text on its own layer.


    # Color Picker, Bucket, and Gradient


    # Color Picker, Bucket, and Gradient


    ![](img/fb7a71d55b85722293f8087c0b352fcc_155_0.png)


    Figure 8.11: Color Picker, Bucket, and Gradient Fill Icons

    The color picker tool looks like an eyed dropper and selects colors from the image.
    The foreground color on the Color menu becomes the value of the pixel clicked
    with the color picker. This allows you to choose a color from one image and paint
    with it.


    The bucket tool acts like a spilled can of paint. It fills a color range with
    the foreground color. Use the Options menu to set the opacity, threshold (the
    sensitivity of the selection), or type of fill. You can also fill your canvas
    with one of the patterns available from the Pattern menu by selecting Fill Pattern
    on the Options menu.


    The blend tool creates a gradient in which direction you click and drag the cursor,
    either for the whole image or within a selection. Use the Options menu to select
    the type of gradient and whether it blends from foreground to background color,
    or repeats in a wave form (useful for making cool metallic blends), or does something
    else.'
  merge: -1
  pgno: 155
- img_proc: true
  md: '# Pencil, Paintbrush, Eraser, and Ink Tools


    # Pencil, Paintbrush, Eraser, and Ink Tools


    ![](img/fb7a71d55b85722293f8087c0b352fcc_156_0.png)


    **Figure 8.12: Pencil, Paintbrush, Eraser, and Ink Tools**

    The pencil, paintbrush, and ink tools draw in the foreground color. Choose a size
    and type of brush to use from the Brush dialog menu. Note that the ink tool is
    a new tool, beginning with version 1.2 of the GIMP.


    **Tip** The Dialog menus are also accessible from the File menu or by right-clicking
    on an image and selecting Dialogs from the pop–up menu.


    The pencil and ink tools draw with a smooth edge (even if you select a fuzzy-edged
    brush). The paintbrush paints with a softer, more brushlike edge (leaving the
    background color). Use the Eraser Options menu to set a hard or soft (incremental)
    edge.


    **Tip** On the Brush menu you''ll find choices to change not only the type of
    brush you can paint with, but also the opacity of the paint. Experiment with the
    different options to see all the possibilities for drawing or painting.


    # Airbrush, Clone, Convolver


    # Airbrush, Clone, and Convolver


    ![](img/fb7a71d55b85722293f8087c0b352fcc_156_1.png)


    **Figure 8.13: Airbrush, Clone, and Convolver Icons**

    The airbrush tool works like an airbrush and you can set the rate and pressure
    from the Options menu. This tool is handy for hand–painting shadows or blending
    areas of color. There are also Filter–Scripts for creating dropshadow and similar
    effects.


    The clone tool allows you to clone a part of the image with either a pattern or
    an area within the image. This is an invaluable photo–retouching tool. Double–click
    to set Options; press CTRL and click to select the area you want to clone. Next,
    click and drag to the area to be retouched. Add hair, remove blemishes or scratches,
    give someone two noses–you can do it with the clone tool.


    The convolver tool allows blurring or sharpening of pixels. Blur works by equalizing
    the color values of adjacent pixels in the area being blurred. Sharpen does the
    opposite. The GIMP creates higher contrast between pixel colors, which helps the
    sharpened area pop out from the rest of the image. Both effects can be accessed
    through the Filter menu (right– click and choose Filter; then choose'
  merge: -1
  pgno: 156
- img_proc: true
  md: 'either Blur or Enhance). Use the Options menu for the convolver tool to adjust
    Blur and Sharpen pressure settings.


    # Dodge and Burn and Smudge Tools


    ![](img/fb7a71d55b85722293f8087c0b352fcc_157_0.png)


    Figure 8.14: Dodge and Burn and Smudge Tools

    These tools are new additions to GIMP that allow you to create further effects
    with your images. The dodge and burn tool is for adjusting the brightness or shade,
    and is especially useful for working with over– or under–exposed photographs.
    Switch between dodging and burning with the Options menu.


    The smudge tool does exactly what you would think—creates a smudge wherever you
    click and using that tool.


    # Finally, Let''s Work with The GIMP!


    Click File • New to create a new file. Set the dimensions of your canvas (remembering
    that there are 72 pixels per inch), the color space (either RGB or Grayscale),
    and the base background color of your painting space. Background and Foreground
    provide a space in whatever background and foreground colors currently are selected
    in the menu (defaults are black and white). Transparent provides an empty color
    space; a gray– checkered pattern indicates transparency. Choose White while you
    are first learning the painting tools and effects. As you become more familiar
    with The GIMP, you''ll find the Transparent background color to be the more useful
    option.


    ![](img/fb7a71d55b85722293f8087c0b352fcc_157_1.png)


    Figure 8.15: A Blank Window Appears When You Select File - New'
  merge: -1
  pgno: 157
- img_proc: true
  md: '# Layers


    ![](img/fb7a71d55b85722293f8087c0b352fcc_158_0.png)


    To open the Layers menu, right– click the drawing window and choose Layers • Layers
    & Channels. The Layers menu allows you to add or delete levels of painting surface.
    This can be helpful when you want to put elements into their own unique space.
    You can create new layers by clicking the icon at the bottom that looks like a
    duplicated page. Double– click the layer''s name to enter a new layer name. Delete
    a layer by clicking on the trash symbol.


    Figure 8.16: The Layers Menu


    ![](img/fb7a71d55b85722293f8087c0b352fcc_158_1.png)


    You can set individual layers to be fully or partially transparent. As you become
    a GIMP expert, you''ll learn how to mask selected areas to show elements one layer
    to the next.


    Figure 8.17: Organize Work By Giving Each Layer a Name that Makes Sense to You


    If you click the Channels tab, you can work with individual color channels for
    red, blue, or green. This is a complex subject we won''t address here, but it''s
    helpful to know that, with a bit of additional research and practice, you can
    gain complete control over your image''s and color space by manipulating layers
    and channels.


    Open a blank drawing window in The GIMP (File • New) and experiment with the various
    painting, selection, and transformation tools until you feel comfortable with
    them.'
  merge: -1
  pgno: 158
- img_proc: true
  md: '![](img/fb7a71d55b85722293f8087c0b352fcc_159_0.png)


