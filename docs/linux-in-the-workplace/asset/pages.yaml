    # Reading Email


    Several options are available for viewing and organizing your email. By default,
    the new message headers appear in blue, with unread message headers in red, and
    all other messages in black. The message headers frames list the subject, sender,
    date, and size of each message. If you click the header, the message will appear
    in the large message frame below. If you click the header with the right button,
    a pop-up menu with more options will appear.


    With KMail, you can reply, to all (if the original message was sent to more than
    one person), forward, or bounce (reject) messages, as you move or save copies
    to one of your mailboxes. Some options are available in the Message drop-down
    menu. Some options have shortcuts, such as pressing R for reply and F for forward.
    The shortcut keys are shown next to the commands listed in the drop-down menu
    (or “Configuring K-Mail Shortcuts in this chapter”).


    You can use the icons on the toolbar to do things like delete messages (the red
    X icon) and reply (the blue back-facing arrow). If you want to change the order
    in which messages appear in the header frame, click the Subject, Sender, or Date
    tab.


    You can change the size of the tabs themselves or their order across the top of
    the pane. To change positions, click and drag to the left or right, and drop it.
    As you move the mouse over the division line between tabs, the icon changes from
    arrow to vertical lines. With this pointer, you can drag the edge of the column
    to the left or right, increasing or decreasing the tab width.


    Tip You can change the size of the frames in the same way as you can tabs. Click
    the bar between them and drag up or down, left or right.


    Clicking the Subject tab changes the order in which the messages are listed alphabetically
    by subject: ascending (A to Z) or descending (Z to A). You can also group messages
    in ascending or descending order by status: new, unread, and read. Each click
    on the Date tab changes the sort order.'
