- img_proc: true
  md: 'Figure 8.28: Motion Blur Results


    # Filters


    Take some time to experiment with Filters. You''ll find a full range of fun things
    to try, from the aforementioned blurring effects to edge detection, lighting effects
    (ooh, Super Nova!), artistic ''painterly'' treatments, and more. Select only a
    bit of your image to play with. Filters are resource-heavy, and it may take an
    inordinate amount of time to render the entire image.


    # Script–Fu and You


    Script–Fu, multiple effects that you can use individually under Filters have been
    cooked together into one script you can open or play with on an existing image.
    The GIMP comes with some preset Script–Fu options, or you can download others
    from http://www.gimp.org/ (this site includes Script–Fu tutorials worth checking
    out). Access Script–Fu from the Xtns menu or by right-clicking the image and choosing
    Script–Fu. The former option provides access to precreated images. These Script–Fu
    files do not apply to open images; they are supplied with the GIMP that you may
    use as is or as part of your own creations. Script–Fu options from the right-click
    menu affect the current image or a selected area within the image, allowing you
    to add special effects to your own artwork.


    ![](img/fb7a71d55b85722293f8087c0b352fcc_165_0.png)


    Figure 8.29: A Preset Image Opened from Xtns - Script–Fu'
  merge: -1
  pgno: 165
- img_proc: true
  md: '![](img/fb7a71d55b85722293f8087c0b352fcc_166_0.png)


    Figure 8.30: A Script–Fu Effect Applied to Our Image

    Scanning with The GIMP


    If the xscanimage plug– has been added to your GIMP configuration, you can access
    xscanimage directly from the Xtins menu by choosing Acquire Image. If this option
    is not available to you, talk to your system administrator about adding it.


    At this point, we''ve given you a small taste of what''s possible with The GIMP.
    As always, to learn more, try the tools, open the menus, and play with the results.
    Remember to save your test image under a different filename. Then, if you hopelessly
    break your image, you can always go back to the original version.'
