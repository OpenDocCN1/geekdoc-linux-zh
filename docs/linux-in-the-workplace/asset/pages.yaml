    # Time & Date


    Time & Date lets you specify your time zone, whether Saturdays and holidays appear
    on the calendar, default business hours, and default appointment time. When you
    open a daily or weekly view in KOOrganizer, the default time at which the calendar
    begins is the technical beginning of the day: 12:00 a.m. Here you can set your
    default business hours to those that better suit your needs. Likewise, the default
    appointment time is the time that appears automatically whenever you enter a new
    event. Although it''s not necessary, setting a default appointment time can be
    useful, particularly if there is a time that you generally set aside for appointments.


