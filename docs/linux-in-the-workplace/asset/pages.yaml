    # Using SpellChecker


    AbiWord does spell checking on the fly by default. If you see a wiggly red line
    below a word, click it to see a spelling menu. If one of the suggestions on the
    spelling menu matches your intention, select it to change the word and get rid
    of the red line. If you intended to type the word that way and want to add it
    to the spelling dictionary, select Add.'
  merge: -1
  pgno: 128
- img_proc: true
  md: '![](img/fb7a71d55b85722293f8087c0b352fcc_129_0.png)


    To ignore a word in the current document only, without adding it to the dictionary,
    select Ignore All.


    You can also spell check the entire document by clicking the Spellcheck Document
    button on the standard toolbar, or by selecting Tools • Check Spelling • Spelling.


    > Tip To double–check a document, go to the Spelling tab of the Preferences dialog
    box and click Reset to reset the list of ignored words.


    # Adding Links


    You can make any selected text into a hyperlink that invokes Konqueror. If you
    have the extra toolbar turned on (it can be activated by selecting Toolbars •
    View), click the little globe at the left once you''ve highlighted the word or
    words that will be the link. If the toolbar is not displayed, select Hyperlink
    from the Insert menu.


    # Setting Preferences


    You can display a Preferences dialog box by selecting Preferences from the Tools
    menu. Most of the options are self-explanatory; turn off that you might not want
    hogging your screen. Among other things, you can turn off the toolbars, rulers,
    and status bar individually, disable on–the–fly spell check, and suppress the
    AbiWord splash screen.


    The Layout tab of the Preferences dialog box lets you turn on invisible layout
    marks, including tab, space, and paragraph mark characters. This can be a good
    choice if you want to make sure you''re applying a style to only one paragraph,
    or if you want to make sure you''re not typing extra spaces by mistake.'
  merge: -1
