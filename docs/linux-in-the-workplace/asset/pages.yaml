- img_proc: true
  md: '![](img/fb7a71d55b85722293f8087c0b352fcc_226_0.png)


    # Figure 10.23: Setting Cookie Policy

    Cookie Policy


    The first thing you need to decide is whether you want to allow cookies. If you
    want to allow them, leave the Enable Cookies option selected. Otherwise, unselect
    it to disable the use of cookies entirely. Disabling cookies will disable the
    Policy tab, but it does not affect cookies already on your hard drive. Skip ahead
    to the next section, "Cookie Management," to learn about any cookies already on
    your hard drive.


    The simplest option for cookies, other than disabling their use, is to accept
    them by default. This option allows great ease of use, as any site you browse
    that uses cookies can leave one on your hard drive. By design, sites that interact
    with you differently based on your previous visits, without any further interaction
    required upon you. Recognize, however, that accepting cookies by default also
    means you have no control over who puts cookies on your hard drive. Visiting one
    site might result in cookies not only from the site itself, but from advertisers
    and third parties as well. Some advertisers, for example, can collect information
    from the sites where you have collected their cookies and develop a demographic
    model based on your– browsing habits. This model can be used to target you for
    specific types of advertising. This is not to say that any advertisers or websites
    owned by the same parent company are using cookies for this purpose. However,
    it is important to realize that the user, are an important commodity to the site
    you are browsing.


    **Tip** Be aware that you interact with a site, it is also interacting with you.'
  merge: -1
  pgno: 226
- img_proc: true
  md: 'A third option for your cookie policy lets you control sites you go to allow
    cookies on your hard drive. With this option, you will be asked each time you
    go to a new site to accept or reject a cookie. How you answer determines your
    ongoing policy for cookies from that site.


    **Tip** If the domain asking you a cookie is not the one you are trying to visit,
    it is probably an advertiser.


    As you deny deny the use of cookies, you will find each site in the Policy window.
    The site will appear in the Hostname column, and your policy will appear in the
    Policy column. To change or delete your policy for one of the hosts in the Policy
    window, select the hostname and click the Change or Delete button. To add a policy
    without visiting a site, click the Add button and fill in the appropriate information.
    If you do not include "www" the prefix preceding the hostname, your policy will
    be effective for that domain.


    # Cookie Management


    The Management tab gives you information on the cookies from domains where you
    agree to accept them, either by default or by confirmation. There are two columns
    in the main window, listing the domain that you gave the cookie and listing the
    name of each cookie. By default, multiple cookies are collapsed under each domain
    heading. Click the plus symbol next to the domain to expand the list of cookies.
    When a domain is selected, it is displayed in the Domain section of Cookie Details.
    Selecting an individual cookie from that domain will filling in the remaining
    fields in Cookie Details. This gives you the chance to see exactly what a site
    is storing in its cookie. Some of values will appear garbled because they are
    encrypted or make use of codes known only to the site.


    ![](img/fb7a71d55b85722293f8087c0b352fcc_227_0.png)


    Figure 10.24: Managing Cookies'
  merge: -1
  pgno: 227
- img_proc: true
  md: '# Crypto


    The Crypto section of the control module is where you manage certificates and
    the Secure Socket Layer (SSL). Certificates are attachments to electronic messages
    that provide some assurance that you are dealing with the machine you are communicating
    with. SSL is a protocol used to securely transmit information between machines
    over the Internet. When you enter into a secure connection, the little lock on
    the Konqueror toolbar will appear unlocked. Once you understand what you are doing
    and the ramifications of selecting or unselecting cipher, leave them at their
    defaults. Think of ciphers as codes your computer uses to talk to others during
    a secure transaction.


    ![](img/fb7a71d55b85722293f8087c0b352fcc_228_0.png)


    10.25: Configuring Crypto

    During a secure transaction, the lock symbol on Konqueror should appear locked.


    # User Agent


    The user agent is a string of text your browser sends to a website to identify
    itself. By default, Konqueror''s user agent string looks like this:


    ```

    Mozilla/5.0 (compatible; Konqueror/2.1.2; X11)

    ```


    This tells the website to treat Konqueror as though it were a Mozilla 5.0 browser,
    and it has problems with Mozilla, to treat it like Konqueror or X11. The reason
    for posing Mozilla initially in the user agent is to provide the greatest chance
    for compatibility with the website. It is a sad truth that some sites are not
    designed using the proper standards. If you find that a website is not rendering
    properly, changing the user agent might make interact with you differently and
    clear up the problem. Currently, Mozilla is widely recognized in website development
    circles than Konqueror.'
  merge: -1
  pgno: 228
- img_proc: true
  md: '![](img/fb7a71d55b85722293f8087c0b352fcc_229_0.png)


    To add or change a agent, first enter the web address in the When Connecting To
    field. This can be either the specific URL (www.examplecompany.com) or the entire
    domain (examplecompany.com). Now you can select a user agent string from the drop-
    down box for Send User Agent String, or you can type your own. The list provided
    has a wide variety of options, but let''s create a new one for this example:


    ```

    Konqueror/2.1.2 (compatible; Mozilla/5.0; Linux 2.4.14 i686)

    ```


    Now you can create an alias that will appear in the list of user agents available
    in the future, like KonOnLinux.


    Next, click Add to this user agent to your shortcuts and to the list of available
    user agents. You will need to apply these changes as well.


    # Other Applications


    Now that we''ve covered how to use Konqueror as a web browser, and all the ways
    you can customize it to make it most efficient and comfortable, let''s briefly
    look at a few other applications that relate to the Web: file transfer protocols
    and other browsers.


    # FTP and KBear


    File Transfer Protocol (FTP) is the standard protocol for uploading and downloading
    files on the Internet. If you are familiar with FTP, KBear''s interface is self-explanatory.
    If not, KBear comes with some great help files to get you started. Be forewarned
    that KBear will have trouble if you are'
  merge: -1
  pgno: 229
- img_proc: true
  md: 'using an FTP proxy. An FTP proxy is a computer on your connection, located
    between yours and the one with which you are trying to exchange files, lets the
    other computer think it is your computer. With a proxy, or stand-in, might be
    desirable for security reasons. These are mostly the concerns of system administrators;
    check them before making changes. The K software package is compatible with KDE.
    If it is not installed on your system already, you can download it from http://kbase.sourceforge.net/


    # # Netscape


    Netscape Navigator is a web browser that works well with KDE, but you might experience
    the old display issue or problems with compatibility between the Netscape and
    KDE clipboards. Netscape should be located under the internet menu over the K
    menu. To configure Netscape, open the Edit menu and select Preferences.


    # # Opera


    Opera is a relatively new browser, known for its speed, standards compliance,
    and small size. You can download a free, adware version (meaning there''s a permanent,
    revolving advertisement on themenubar) and install it within a few minutes, if
    you have supervisor access on your machine. If not, talk to your system administrator.
    Everything you have learned about Konquer in this translates to Opera, and it
    is worth checking out. It is extremely quick, considering the number of features
    available. Opera has a retail version that disables the ad field in the free version.


    ![](img/fb7a71d55b85722293f8087c0b352fcc_230_0.png)


    Figure 10-27: Opera 5


    # # Building Web Content


    Although this book is not a how-to for building web content, a few simple procedures
    will be covered because they are a part of Konqueror and KDE. These are basic
    tips and programs and only the tip of the iceberg, to see what'
  merge: -1
  pgno: 230
- img_proc: true
  md: '# Using Save to Make HTML


    Many of the word–processing and office applications discussed in this book have
    an option available when you save a document that will automatically create an
    HTML file of that document, in addition to the original plain–text file. To access
    this option, open a document in your word processor of choice. Choose the File
    menu and select Save. Go to the File Type box on the dialog box that pops up and
    use the scrollbar to find HTML, then click it. In a few seconds, you will have
    the new file saved as filename.html. From there, you can open it in your browser
    and see a web-formatted document.


    Tip The File menus of some word processors list Save as HTML on the main drop–down
    menu, saving you a few seconds and clicks.


    # Using Quanta Plus


    Quanta Plus is a web development environment designed to allow the user to create
    web pages of any complexity using a simple graphical interface. Quanta Plus is
    fully compatible with KDE. If you do not have it on your system already, download
    it from http://quanta.sourceforge.net/. As always, you may need to consult your
    system administrator for permission before installing extra software. For users
    who are unfamiliar with the syntax or structure of HTML tags (the specifications
    that turn pages into web pages), having a graphical interface is very comforting.
    While HTML is beyond the scope of this book, the following section walks you through
    the process of creating a very simple page with Quanta Plus.


    # How to Build a Hello World Page


    Launch Quanta Plus by selecting it from the Development module on the K menu.
    Above the main window, you will see a piece of paper with a shooting star on it.
    Click it.


    ![](img/fb7a71d55b85722293f8087c0b352fcc_231_0.png)


    Figure 10.28: Getting Started

    A dialog box opens. Type Hello World in the title and click OK. The dialog box
    will then close.'
  merge: -1
  pgno: 231
- img_proc: true
  md: '![](img/fb7a71d55b85722293f8087c0b352fcc_232_0.png)


    Figure 10.29: Hello World


    You should see in the main window that the Quick Start feature has filled in some
    HTML tags. Your cursor should be now located between a &lt;body&gt; tag and a
    /&gt; tag. Whatever you type between these tags will be the text on your page.
    Type This is my home page!


    Now preview this page. In the upper right toolbar, click the eye icon; this will
    show you what your page looks like to a browser (it should say, "This is my home
    page!"). Click the eye again to see the text of the page.


    225'
  merge: -1
  pgno: 232
- img_proc: true
  md: '![](img/fb7a71d55b85722293f8087c0b352fcc_233_0.png)


    Figure 10.30: Previewing Your Page

    Save the file and open it using Konqueror, just like any other file.


    ![](img/fb7a71d55b85722293f8087c0b352fcc_233_1.png)


    Figure 10.31: The Final Result

    Although Quanta Plus has everything you need to develop a first-rate website,
    it is beyond the scope of this book to cover it in detail. When you have time,
    explore the options available and play around with designing a web page. You can
    do things like incorporate different colors and fonts; include lists, graphs,
    and pictures; and make the page interactive. Be sure to read the documentation
    on the Help menu to learn how to create an interesting, informative, and unique
    web page.'
  merge: -1
  pgno: 233
- img_proc: true
  md: '# Chapter 11: Customizing Your desktop''s look and feel according to your tastes.


    KDE makes it simple for you to modify your desktop''s background color(s). This
    chapter shows how to change your desktop''s background color(s), activate different
    screensavers, resize icons, and even alter the behavior of your mouse, windows,
    and menus. Most of what is covered is not crucial for completing everyday related
    tasks, but it can make your user experience more personal and perhaps even pleasant.


    # Using the Control Center


    The Control Center provides the interface that allows you to configure your desktop
    environment and many KDE applications, including spell check for text editing.
    However, the control settings you specify will not affect applications that are
    not KDE-specific, such as OpenOffice or The GIMP.


    ![](img/fb7a71d55b85722293f8087c0b352fcc_234_0.png)


    Figure 11.1: Control Center Introduction Screen

    To open the Control Center, click on the Control Center icon (the monitor with
    the circuit board) on the panel. On the left side of the window, you will see
    a list of items you can customize, including File Browsing, Look & Feel, Network,
    Peripherals, Sound, and Web Browsing.


    Click on the category (or module) you want to customize to access a dropdown list
    of all the subcategories available within that category. (A single click on the
    category name will close this drop– down.) Clicking on a subcategory from the
    drop– down will launch a window to the right that showcases all the options for
    that subcategory.


    When you are working with specific items in the Control Center, the following
    buttons are available on the bottom of the window: Help, Defaults, Apply, and
    Reset. Their actions are rather obvious. Help, Defaults, and Reset are good for
    occasions when, for example, you go overboard with custom colors.'
  merge: -1
  pgno: 234
- img_proc: true
  md: 'Tabs are located at the top of the Control Center window and provide further
    information about the available options. The three tabs on the sidebar at the
    left (Index, Search, and Help) are always the same. Index displays the full list
    of available categories. Search lets you find what you need when you know what
    you want to change but aren''t sure of, and Help provides information on the particular
    item you have selected. Note that, for most, the different versions of KDE have
    the same modules, though the categorization may be varied slightly. If something
    mentioned isn''t listed under the same module in your version, use the Search
    tab to find its location.


    ![](img/fb7a71d55b85722293f8087c0b352fcc_235_0.png)


    Figure 11.2: Maneuvering the Tabs to Search


    Depending on the category you have selected, the right side of the window may
    have tabs. These change as you change categories and may include topics like Install,
    Layout, and Shortcut.


    Spend time exploring the Command Center to learn about all the things you can
    customize to meet your needs.


    # File Browsing


    The File Browsing module (the first module listed in the left sidebar of the Control
    Center window) deals with the relationships between files and applications and
    the look and feel of the Conqueror File Manager. Different types of files require
    different applications to open them the sections on "Opening Files" and "Dealing
    with Microsoft Word Documents" in Chapter 3.


    **Tip** File types are referred to as MIME (Multipurpose Internet Mail Extension)
    types. The MIME type of a file almost can be determined by the file''s extension.
    For example, files ending in .jpg are JPEG images.'
  merge: -1
  pgno: 235
- img_proc: true
  md: '# File Associations


    If you click the File Associations subcategory, you can check and configure (reconfigure)
    the relationships between MIME types and the applications necessary to use them.
    This module tells Konquerer which applications to launch for the various types
    of file to be opened. For example, default, KDE recognizes files with a .pdf extension
    as PDF files and opens them automatically with Acrobat Reader, rather than to
    open them with something like KView (which doesn''t work). Most of relationships
    between file types and applications are already configured for you. If not, this
    is where you change or add these settings, to ensure files are opened with your
    preferred application.


    To begin setting these relationships, simply click on the appropriate file type
    from the list called Known Types, and you''ll see the right sidebar fill with
    options. On the top right, you can add filename patterns, so that every possible
    extension for a file type will be recognized.


    ![](img/fb7a71d55b85722293f8087c0b352fcc_236_0.png)


    Figure 11.3: Filename Patterns In the Application Preference Order box, you can
    add applications for each particular type of file by clicking the Add and selecting
    a program.'
  merge: -1
  pgno: 236
- img_proc: true
  md: '![](img/fb7a71d55b85722293f8087c0b352fcc_237_0.png)


    Figure 11.4: Choosing Applications


    You can change the order of applications that Konquerer launches to open a file
    type by highlighting the program and clicking the Move Up and Move Down buttons,
    appropriate. This way, you can make sure your first choice is the one attempted.


    > Tip Another way to alter a file/application relationship is by using the Open
    With option in the menu that appears when you right–click a file (refer to Chapter
    3 for more on using Open With).


    # # File Manager


    File Manager, another subcategory of File Browsing, allows you to customize the
    appearance of your File Manager window. The Behavior tab has options for actions
    such as Open directories in separate windows and minimizing memory use. It also
    allows you to Show File tips, which gives you small yellow popup boxes with information
    on file when your mouse hovers over it. Clicking the Appearance tab allows you
    to specify the font type, size, and color to be used in the File Manager. It also
    provides the options to enable Word–wrap icon text. Underline filenames, and File
    displays in bytes, which all refer to the ways things appear in the Trash tab
    when you delete, shred, or move things to the trash. And finally, the Previews
    tab contains options for file previews in Konqueror. Here you can specify the
    protocols for the previews you want to be available. Some of these previews can
    take a lot of time to load, depending on your computer, so you may want to disable
    them for certain protocols. You can also specify a maximum file size for previews.'
  merge: -1
  pgno: 237
- img_proc: true
  md: '![](img/fb7a71d55b85722293f8087c0b352fcc_238_0.png)


    # Quick Copy & Move Plugin


    This subcategory allows you to configure kuick, or the KDE Quick Copy & Move Plugin.
    If you copy or move a file from one directory to another (using the dragand– drop
    method or other methods within the Konqueror File Manager), you will be able to
    undo the function quickly if you make a mistake, by clicking on the Edit menu
    and selecting Undo. This Control Center module is where you decide how many directory
    edits you have cached and whether you want the cached directories available as
    menus.'
  merge: -1
  pgno: 238
- img_proc: true
  md: '![](img/fb7a71d55b85722293f8087c0b352fcc_239_0.png)


    # Information


    The Information module allows you to access important information about the configuration
    and use of your system, such as which devices are connected, how much of your
    system''s resources are are using, and how much total memory is being used. For
    users working in a networked environment, the most important subcategories are
    probably Block Devices and Memory.


    Block Devices shows the partitions of your hard drive, the amount of the drive
    being used, and the other data- related devices you have on your computer, such
    as floppy and CD-ROM drives. It provides the names of these devices, as listed
    in the /dev (device) directory, and their mountpoints. This information is helpful
    for setting up icons for these devices on your desktop, but it will probably be
    more by system administrators than regular users.


    The Memory item gives information about your computer''s random access memory
    (RAM). RAM is one of the most important factors in your computer''s speed and
    general performance. The information in this subcategory indicates whether you
    have enough RAM for optimal performance.'
  merge: -1
  pgno: 239
- img_proc: true
  md: '![](img/fb7a71d55b85722293f8087c0b352fcc_240_0.png)


    Figure 11.7: Memory Information Can Give You an Idea How Strained a Computer''s
    Memory Resources Are


    # Look & Feel


    To alter the design of your desktop so it is more aesthetically pleasing and to
    personalize some of its functionality, simply click the Look & Feel module on
    the left side of your Control Center window. Then click any of the options (Background,
    Colors, Fonts, Style, and so on) to make your desired changes. When you are making
    changes within any of the subcategories, be sure to click the Apply button before
    closing the window.


    > Tip If you decide you don''t like the changes you made, you can always click
    Defaults, and then the Apply button, to go back to KDE defaults.


    The Look & Feel category is also accessible from the K menu, under Preferences.


    Most of the customization options are self-explanatory, once you click them to
    see the choices that pop up on the right side of the window, but here''s a rundown.


    # Background


    The Background module gives options for changing the background color of your
    full desktop screen. You can choose a common background for all desktops, or you
    can give each desktop a separate color, or even its own wallpaper. The default
    setting applies a common background to all desktops, so uncheck the Common Background
    box to customize background color for each separate desktop.'
  merge: -1
  pgno: 240
- img_proc: true
  md: '![](img/fb7a71d55b85722293f8087c0b352fcc_241_0.png)


    # Figure 11.8: Background Module


    Note that the default number of desktops is four. You''ll see later in the “Desktop”
    section of this chapter, you can add up to 16 desktops.


    You can make your desktop a flat color, or a variety of different gradients, by
    clicking the Mode– down menu. Once you have it set as want, be sure to click Apply
    to save the settings. If you forget to do this and try to close the window, all
    is not lost. A dialog box will appear that asks if you want to save the new settings.


    You can change the colors of different desktops by highlighting a given desktop
    (listed at the top of the window by number), clicking the bar, and choosing the
    color you want from the rainbow switch there. The little monitor at the upper
    right of this window will give you a preview of the color. Again, once you have
    the color you want, click Apply.


    If you want to use wallpaper (a background image or design) rather than a plain
    color, click the Wallpaper tab to specify how you want the images to appear: single
    or multiple, centered, tiled, scaled (which means spread out to take up the full
    screen), and so on. KDE has several built– in wallpapers you can choose from clicking
    the Wallpaper drop– down menu.'
  merge: -1
  pgno: 241
- img_proc: true
  md: '![](img/fb7a71d55b85722293f8087c0b352fcc_242_0.png)


    # # Color


    The Color module under Look & Feel (Figure 11.10) allows even more complex customization.
    You can alter the colors of active and inactive windows, window backgrounds, buttons,
    links, and so on. Choose from a list of preconfigured color schemes for your window
    design, or select your colors for each of the separate parts by clicking the name
    on the Widget Color drop-downdown menu and selecting the color from the bar below
    it. For reference, a “map” detailing the window parts appears at the top, and
    it provides previews as you make your choices.


    If you make up your color scheme, you can give it a name and save it by clicking
    the Save Scheme bar. It will now appear on the Color Scheme menu next time you
    decide to make changes.


    Tip The scheme you choose for your windows, buttons, and so on will be constant
    for all of your desktops. You can’t have different color schemes for each desktop
    like you can with backgrounds.'
  merge: -1
  pgno: 242
- img_proc: true
  md: '![](img/fb7a71d55b85722293f8087c0b352fcc_243_0.png)


    # Desktop


    Desktop in the Control Center displays options that set the way your icons are
    arranged, whether you have hidden files (usually configuration files that you
    don''t use on a regular basis), the menus that are visible, and so on. Another
    feature you can change on the Desktop tab is the action taken when clicking on
    the desktop with each of the different mouse buttons. Look at the drop- down menus
    for each button to see the possibilities. Also, you can set what types of files
    you want to have automatic previews of, such as image, PostScript, and PDF files.'
  merge: -1
  pgno: 243
- img_proc: true
  md: '![](img/fb7a71d55b85722293f8087c0b352fcc_244_0.png)


    Figure 11.11: Desktop Module

    Clicking the Appearance tab allows you to alter the size and type of font for
    the icons on desktop (by creating icons in the "Icons" section in this chapter).
    You can also choose the color of the text that appears below icons and that is
    underlined.


    ![](img/fb7a71d55b85722293f8087c0b352fcc_244_1.png)


    Figure 11.12: Icon Appearance

    The Number of Desktops tab lets you add more desktops than the four you get by
    default—up to 16'
  merge: -1
  pgno: 244
- img_proc: true
  md: 'separate desktops. Clicking this tab also allows you to give each virtual desktop
    its name, which will appear in the control bar at the bottom of your screen to
    keep you organized. For more desktops, simply slide the button at the top of the
    window until you have the number of desktops you want. Once they''re activated,
    you can assign names by clicking on each one and typing the name in the appropriate
    box


    ![](img/fb7a71d55b85722293f8087c0b352fcc_245_0.png)


    Figure 11.13: Number of Desktops Tab

    The Paths tab allows you to change the directory paths for the Desktop, Trash,
    Autostart, and Documents directories. Changing a path automatically moves the
    contents of the directory. You do not have to do it manually.'
  merge: -1
  pgno: 245
- img_proc: true
  md: '![](img/fb7a71d55b85722293f8087c0b352fcc_246_0.png)


    Figure 11.14: Configuring Desktop, Trash, Autostart, and Documents Paths


    # # Fonts


    The Fonts customization feature is self-explanatory. It allows you to choose different
    fonts for different parts of your desktop. Simply click the Choose button for
    each of the different desktop sections (Toolbar, Menu, etc.), select your favorite
    fonts, or change font sizes. You are given a preview screen showing what each
    font will look like before you click Apply. If you make changes and decide you
    liked the appearance better the way it was to begin with, click Defaults, and
    you''ll be back where you started.


    239'
  merge: -1
  pgno: 246
- img_proc: true
  md: '![](img/fb7a71d55b85722293f8087c0b352fcc_247_0.png)


    # Icons


    If you choose to customize your icons, you\u209ll see a window with two tabs:
    Theme and Advanced. On the Theme tab, you may have the option to change the color
    theme (depending on the version of KDE that you have). You can download and install
    new themes here from the KDE website, as they become available.'
  merge: -1
  pgno: 247
- img_proc: true
  md: '![](img/fb7a71d55b85722293f8087c0b352fcc_248_0.png)


    Figure 11.16: Changing Icon Theme

    on the Advanced tab you can change the size or color of icons, depending on whether
    they''re active or disabled (use the Set Effect). The area labeled Use icon lets
    you choose which type of icons you want to configure, for example, the toolbar
    or panel icons.


    ![](img/fb7a71d55b85722293f8087c0b352fcc_248_1.png)


    Figure 11.17: Advanced Icon Customization'
  merge: -1
  pgno: 248
- img_proc: true
  md: '# Launch Feedback


    Launch Feedback allows you to Enable Busy Cursor—the little blinking representation
    icon that appears next to the cursor of whichever program’s icon you have clicked,
    showing that the program is in the process of launching. Here you can enable (disable)
    the taskbar notification of a program and you can select how long it takes for
    the startup indication to timeout.


    ![](img/fb7a71d55b85722293f8087c0b352fcc_249_0.png)


    Figure 11.18: Launch Feedback


    # Menu Settings


    Depending on your distribution, you may have a Menu Settings module. This simply
    lets you choose whether you''d like your main menu to be specific to your distribution
    or the standard menu. Here you can also select extras to add to your panel. Note
    that this module may not appear in the Control Center with some distributions.'
  merge: -1
  pgno: 249
- img_proc: true
  md: '# Menu settings - Control Center


    ![](img/fb7a71d55b85722293f8087c0b352fcc_250_0.png)


    Figure 11.19: Menu Settings Module


    This module lets you alter your panel, the so row of buttons, and so forth at
    the bottom of your screen.


    # Panel - Control Center


    ![](img/fb7a71d55b85722293f8087c0b352fcc_250_1.png)


    Figure 11.20: Panel Customization'
  merge: -1
  pgno: 250
- img_proc: true
  md: 'The Position tab allows you to change the panel''s location (by default it
    is along the bottom of your screen), alignment, and size. You can even specify
    the exact percentage of desktop width/height that uses.


    If you''re not fond of the panel and like to have all of the screen available
    for your purposes, choose the Hiding tab. Put a check in the appropriate boxes
    to enable automatic hiding, and your panel will disappear when you''re not using
    it. If you discover that you need the panel, simply move your mouse pointer to
    the place where the panel had been, and it will magically reappear. If you have
    a panel display hiding enabled, you can even adjust the amount of time it takes
    for the panel to disappear its vicinity. Slide the button to the number of seconds
    that should elapse before the panel disappears after you move your away from it.
    You can also choose manual hiding, if you don''t want automatic hiding. With this
    option, you can click the arrow on the far right or far left of the panel to hide
    itself.


    ![](img/fb7a71d55b85722293f8087c0b352fcc_251_0.png)


    Figure 11.21: Enabling Panel Hiding


    Selecting the Look & Feel tab allows you to change the color of each separate
    button on your panel (if you have Enable background tiles checked). This makes
    the panel icons look more like a row of actual buttons. It also allows you to
    Enable icon zooming and Show tooltips.'
  merge: -1
  pgno: 251
- img_proc: true
  md: '# 11.22: Enabling Background Tiles


    The Menu tab allows you to choose which menu you want to have from the K menu
    and customize whether you want hidden files to appear in your file browser, as
    well as the number of entries you want to appear. You can also customize your
    Quick Start entries here. Quick Start is a feature that adds the most recently
    or frequently used items to the top of the K menu. Here you can decide if you
    want the most recently or frequently used items, and how many you would like to
    appear.


    ![](img/fb7a71d55b85722293f8087c0b352fcc_252_0.png)


    ![](img/fb7a71d55b85722293f8087c0b352fcc_252_1.png)'
  merge: -1
  pgno: 252
- img_proc: true
  md: 'Figure 11.23: Panel Menu Applets are small programs launched from within another
    program. The next tab is Applets. By enabling, you give yourself quick access
    to programs from your panel. For example, the knewsticker applet shows news headlines
    (gathered from various sites) within a small box on your panel. If you catch a
    headline that interests you, click it, and Conqueror will take you to the full
    story.


    If your version of KDE does not have an Applet in the Panel module, these same
    configuration options are available by going to K menu • Configure Panel • Add
    • Applet. Applet has a submenu of different applets to choose from, and once it
    is chosen and activated, simply right-click on it to access its Preferences and
    configure it from there.


    Getting applications working and on the panel involves a few steps. Here''s how
    to set up knewsticker: on the App tab you will see two lists, Trusted Applets
    and Available Applets. Above the menu is a checklist where you can mark the security
    level. (Only trusted applets internal is the default and most secure option because
    it allows which applets get loaded.) If knewsticker (the applet you want loaded)
    is in the right column (Available Applets), you''ll need to move it to the left
    column (Trusted Applets).


    To do this, click knewsticker (or any applet you want to load), and then click
    the double left arrow. This will cause knewsticker to load. If you don''t have
    knewsticker in either column, you can download it, and any other KDE applets,
    from http://apps.kde.com/


    Once that is done, you''ll need to go to the K menu and select Configure Panel.
    From the submenu, select Add, then Applet from the list of applets presented.
    Unfortunately, many of the applets listed here are not listed by their names (KNewsTicker)
    but by what they do (News Ticket). The selections shouldn''t be too hard to figure
    out. See the “News Ticket” section to customize the behavior and content of this
    applet.


    # Screensaver


    You can choose to enable one of the screensavers provided by KDE by clicking this
    option. You can put a mark in the Enable screensaver box and check out the possibilities
    by clicking whichever screensaver sounds most interesting—if you have time to,
    check all of them with the preview monitor. You can also click the Test button
    at the bottom of the screensaver list, which actually shows the highlighted screensaver
    on your full screen (simply click the mouse to return to the Control Center),
    but won''t permanently activate it until you click Apply.'
  merge: -1
  pgno: 253
- img_proc: true
  md: '![](img/fb7a71d55b85722293f8087c0b352fcc_254_0.png)


    The Setup button, next to the Test button, is for setting the speed and other
    attributes of the different types of screensavers. For a Banner screensaver, you
    can put in your own message or inspirational quotation, which will then move across
    the screen (with the color and speed of your choice) in place of the default KDE
    banner.


    In the Settings section of the window, you can choose the amount of time it takes
    for the screensaver to activate, and whether a password is required to turn the
    screensaver off and return to the desktop.


    > It is best to leave the Priority marker set to Low. This determines the priority
    your computer should give to this process. Moving it to High will improve the
    animation, but could cause other background processes to have difficulties.


    # Shortcuts


    The Shortcuts feature allows you to customize the keyboard shortcuts for certain
    tasks which you are probably accustomed to using the mouse. Depending on your
    version of KDE, this module may be called Key Bindings rather than Shortcuts,
    though they do the same thing. It''s a good idea to view this information, even
    if you don''t want to change it. These keyboard shortcuts can save you a lot of
    time by allowing you to perform frequent functions without taking your hands off
    the keyboard.


    There are two main tabs: Shortcut Schemes and Modifier Keys. Under Shortcut Schemes,
    there are three tabs: Global Shortcuts, Shortcut Sequences, and Application Shortcuts.
    On the Global Shortcuts tab, you will see a list of actions (such as Kill Window
    and Logout) and their corresponding keyboard shortcuts. For example, to log out,
    you can simply press CTRL– ALTDLETE, instead of using the mouse to click your
    way out.'
  merge: -1
  pgno: 254
- img_proc: true
  md: 'To change one of these settings, highlight the action, click the Custom button
    at the bottom of the window, and make your changes in the dialog box that appears.
    Click OK when you are done.


    You can also change the shortcuts to different preconfigured schemes which you
    may be familiar, by clicking the Current Scheme drop–down menu (for example, a
    Mac Scheme or Unix Scheme).


    ![](img/fb7a71d55b85722293f8087c0b352fcc_255_0.png)


    Figure 11.25: Keyboard Shortcuts

    The Shortcut Sequences tab allows you to view the shortcuts for moving between
    windows and different desktops. To change settings, use the method described above.'
  merge: -1
  pgno: 255
- img_proc: true
  md: '# Figure 11.26: Shortcut Sequences


    Application Shortcuts are basically the same as Global Shortcuts, except (obviously)
    for specific applications where you are likely to perform with these keyboard
    shortcuts such as saving, printing, and cutting and pasting. You can use the defaults
    or customize these shortcuts in the same way with Global Shortcuts.


    ![](img/fb7a71d55b85722293f8087c0b352fcc_256_0.png)


    # Figure 11.27: Application Shortcuts


    ![](img/fb7a71d55b85722293f8087c0b352fcc_256_1.png)'
