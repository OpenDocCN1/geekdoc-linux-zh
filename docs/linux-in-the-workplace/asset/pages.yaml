- img_proc: true
  md: 'prevent losing data.

    # Word about Root


    When KDE is first installed, the installation program will prompt you to create
    at least two accounts: root and normal user. Root is thought of as a superuser
    account and is reserved for system administration, as it lets you do anything
    to your system. Most offices limit root access to the system administrator.


    If you have root control on your system, beware—changes to system files can radically
    alter the way the system works. As you are experimenting and getting familiar
    with KDE, you will probably come across things that are designated as root–access
    only, and you will be unable to change them without the help of your system administrator.


    # # The Landscape of the KDE Desktop


    Once you''ve logged in to the computer, you will see a fairly blank background
    with small pictures and a bar at the bottom of the screen with more pictures.
    The background is called the desktop; the bar is called the panel; the pictures
    are icons—symbols representing the programs and tools on your computer that are
    probably used most often. For example, the life preserver is the icon for the
    Help program, and the globe represents the Konquer web browser, used for navigating
    the Internet.


    +   * Tip Programs and groups of programs are also called applications.


    The desktop icons have their functions listed beneath them, such as Printer or
    Email. Text will pop up to explain the functions of the panel icons when you hold
    the mouse pointer over them. This applies to almost every icon or button you see
    in KDE or any of its applications. Using the panel and desktop icons is discussed
    in the "Navigating Your Desktop" section of this chapter.


    To open a program from its icon, position the mouse pointer directly over it and
    click the mouse button once—a single click. A blinking mini– icon appears next
    to the mouse pointer indicating that your computer is opening the program or file.
    The type of mini– icon will show which program is opening. For instance, if you
    click on the globe icon in the panel to open the Konquer web browser, a blinking
    globe will appear.


    # # Menus, Windows, and Toolbars


    Menus offer a list of tasks to perform. For example, if you click the K button
    in the lower corner of the panel, you will see a pop–up menu that lists the names
    of various programs and utilities available on your system. As you move your mouse
    pointer up, other pop–up menus appear. These are submenus, menus specific to an
    item on the main menu.


    For example, here we show the submenu for Toys. When you find a program on a menu
    or submenu that you want to open,– click on the program name to launch the program.'
