    code and allow developers to make their web pages more detailed. They also introduce
    security issues. Konqueror defaults disable Java across all sites and enable JavaScript.
    You can adjust the settings based on your security concerns, but these are mostly
    the concerns of your system administrator.


    # Cookies


    Cookies are little files stored on your computer''s hard drive that websites use
    to manage information about your visit to them. Cookies are often feared because
    they allow a website to track something about you, but if you take an active role
    in their management, cookies can enhance your browsing quite a bit. Cookies allow
    a site to remember you from one visit to the next or to maintain'
