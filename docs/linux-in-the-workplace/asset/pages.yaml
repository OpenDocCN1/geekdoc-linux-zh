  md: 'You may need to resize the KMail window to see the Date column in the message
    header frame.


    You can move messages by clicking them in the message header frame, using icons
    on the toolbar, or using shortcuts. If you want to select several messages in
    a row, you can click the first message, and then hold the down


    SHIFT key and click the last message. All of the messages from the first to the
    last will be selected. To select select additional messages individually, hold
    down the


    CTRL while clicking each one, you can skip over messages you do not want to include.
    You might want to select multiple messages to move them all to another folder
    or to delete all at once. Once they''ve been selected, drag and drop them into
    the chosen folder or choose an option, such as Forward or Print, from the toolbar
    or menus. If you want to change the number of headers that appear, go to the View
    menu.


    | Brief Headers |

    | Fancy Headers |

    | Standard Headers |

    | Long Headers |

    | All Headers |

    | Iconic Attachments |

    | Smart Attachments |

    | Inlined Attachments |

    | Fixed Font Widths |


    Figure 9.13: Changing Header Display


    Of the available options, All Headers shows the most information about a message
    and Brief Headers shows the least. All of the headers remain attached to your
    message, no matter which option you choose; this option affects only the display
    of your messages.


    Folders are extremely useful for organizing your email, allowing you to group
    together messages from the same person in one place, or to group together messages
    on the same topic, and so on. Folders also help keep your inbox from accumulating
    hundreds of email messages, making it hard to find anything. Default folders include
    one called inbox and another called outbox. You can create additional folders
    at any time by opening the Folder menu and selecting Create.'
