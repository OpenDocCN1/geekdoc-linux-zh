- img_proc: true
  md: '# Chapter 10: Accessing the Web


    # Overview


    KDE offers many tools that you can use to browse the Web. In Chapter 3, you learned
    how to use Konquer as a file manager. In this chapter, the topic is using Konquer
    as a web browser, along with other browsers such as Netscape and Opera. The focus
    is to take advantage of the many customization options Konquer offers, so you
    can make the browser serve your needs and preferences. At the end of this chapter,
    you will find a discussion of ways to create your own web pages, using word–processing
    applications and Quanta Pulse.


    Before diving into web browsing, shortcuts, bookmarks, and so on, let''s get over
    some basic terms you should know to use the Web effectively and to understand
    the rest of this chapter. If you''re a web– browsing pro, feel free to skip to
    the next section, "Konquer in Detail."


    +   * Internet: a decentralized, global network that connects millions of computers
    for the purpose of exchanging data, information, news, opinions, and so on.

    * Web: short for World Web, a system of internet servers that supports specially
    formatted documents.

    * Web browser: a software application that displays web pages on your computer.

    * Website: a location on the Web owned and managed by a person, group, company,
    or organization. It may contain a single web page or many files, graphics, and
    other information, usually on a related topic.

    * URI: Uniform Resource Indicator, the generic term for all types of names and
    addresses for objects on the Web.

    * URL: Uniform Resource Locator, the specific address for a web page on the Web.

    * IP address: an identifier code assigned to each computer and device on a network.

    * Domain: a group of computers and devices on a network that are administered
    together, for example, mail.example.com and http://www.example.com/

    * Network: two or more computers linked together.

    * HTML: HyperText Markup Language, the common language used to create documents
    for the Web. Tags and attributes for elements such as headings, font size, and
    colors are used to create documents that can be viewed by any web device or browser.

    * Online: The status of your computer when it is connected to the network or the
    Web.

    * Protocol: an agreed–upon or standard method for transmitting data between two
    machines.


    # Konquer in Detail


    You''ve learned that Konquer automatically opens to your home page when it launches.
    By default, this is the file listing of your home directory, but the system administrator
    may have changed it to another web page. Some offices set the home page as a company
    page. The address of the website, or the URL, appears in the Location bar.


    # The Basics of Getting Around


    Start navigating by entering the URL, or address, of a website in the Location
    bar (something like http://www.linuxjournal.com/ for example) and press ENTER.
    Notice that the left arrow above the Location bar becomes active as you move to
    the new page. This is the Back button, and clicking returns you to the previous
    page. Now the Forward button, or right arrow, is active, and you can click it
    to get to the second web page you visited.'
  merge: -1
  pgno: 205
- img_proc: true
  md: '![](img/fb7a71d55b85722293f8087c0b352fcc_206_0.png)


    One of the great features of web browsers is their ability to deiliate related
    material by the use of hyperlinks. Hyperlinks are specially formatted words and
    images (image maps) that, when clicked, automatically take your browser to another
    web page. You usually recognize hyperlinks because they are underlined by default
    and often appear in a differently colored font. You can also spot both hyperlinks
    and images by moving your mouse pointer over them; if the arrow changes to a hand,
    it''s a link.


    Sometimes links open in a new browser window, but often your main Konqueror follows
    the link, and the original page is lost. You can usually use the back arrow to
    return to the previous page, but this can take a long time (each page will load
    again). Plus, sometimes you may go back only so far, and sometimes you may want
    to see both pages at once. In these cases, you will want to open a link in a new
    instance of your browser, or move your mouse pointer over the link and right--
    From the menu that pops up, click New Window. This will launch a new instance
    of the browser that follows the link.


    Links are primarily used to access other web pages, but they can also be used
    to access different types of files, such as streaming audio and video, PDFs, and
    downloads. When you click a link to one of these other file types, Konqueror will
    choose the proper application to open them. Chapter 11 for information on how
    to help Konqueror choose which application to use with different file types.


    If you need to stop the loading of a web page because it is taking too long, or
    you may need to browse elsewhere, click the Stop button. Konqueror loads text
    first and then images, stopping a page while loading generally make the text of
    the page visible but broken image links.


    The Reload button (located near the Stop button) is useful for checking whether
    a page (a news or discussion site, for example) has been updated. It is also useful
    if you are developing your own web page and want to see changes you make them.'
  merge: -1
  pgno: 206
- img_proc: true
  md: 'Tip The marvels of the ALT-F2 Run continue. It works much the same as the Konqueror
    Location bar by launching Konqueror and displaying the web page of any URL you
    enter.


    If you stopped a page from loading, or it did not load properly, you can click
    the Reload button to try again. Reloading the page still may not display the page
    properly; this may be the result of poorly written HTML, broken image links, or
    network congestion.


    # Getting to Know Your History


    You learned how to use the Location bar and itsAutoComplete feature in Chapter
    3, and the Back and Forward buttons were just discussed. Another option for navigation
    that Konqueror provides is the menu.


    ![](img/fb7a71d55b85722293f8087c0b352fcc_207_0.png)


    Figure 10.2: The Go Menu


    The Go menu maintains a list of up to 10 URLs: the current URL you are browsing
    and the URLs of the ten pages you visited prior to this. The page you are currently
    viewing will have a check in the box next to It. To revisit one of the last URLs,
    open the Go menu and click the page you want to visit. Unfortunately, the Go menu
    provides the title of the page, so if the website you are visiting uses the same
    title for each page (like "Welcome to http://www.site.com"), this feature will
    not be useful.


    # Searching for the World Wide Web


    Search is a big part of web browsing, and people have different search preferences.
    Search engines like Lycos, Yahoo, and Google are popular sites you can visit to
    conduct a search. To save time, Konqueror offers two shortcuts for web searching:
    internet keywords and web shortcuts. Because they can help make your search more
    economical, let''s talk a bit about each.'
  merge: -1
  pgno: 207
- img_proc: true
  md: 'Internet keywords are words or phrases typed into the Location bar that redirect
    your browser to a related site. Companies often pay for internet keywords to drive
    traffic to their sites with redirects. For example, you could type CNN in an empty
    Location bar and be taken directly to http://www.cnn.com/ If Konqueror fails to
    match an internet keyword, however, it will automatically use the search engine
    you have designated in the Configure Konqueror menu as the default (to be explained
    shortly).


    A web shortcut is a shorthand for requesting a web search of a specific topic
    on a specific search engine from the Location bar. In Konqueror, the syntax for
    using a web shortcut is shortcut:string, where shortcut is the abbreviation for
    the search engine and string is what you are searching for. For example, if you
    type search Google to find out more about Mars, you can type gg::


    in the Location bar. Konqueror will recognize your web shortcut and display the
    resulting matches for Mars found by the Google search.


    ![](img/fb7a71d55b85722293f8087c0b352fcc_208_0.png)


    Figure 10.3: Enhanced Browsing

    To configure your setup for internet keywords and web shortcuts, go to Konqueror''s
    Settings menu and choose the last option, Configure Konqueror. A list of icons
    will appear on the left sidebar of the Configure menu. Click Enhanced Browsing.
