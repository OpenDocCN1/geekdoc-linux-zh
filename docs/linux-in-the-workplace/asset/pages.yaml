- img_proc: true
  md: 'The tools to connect these streams to other places are called pipes and redirection.
    A pipe allows you to connect the output of one program to the input of another
    program, that is, connect stdout to stdin of another program.


    For example, you say have a program bigreport that produces a great deal of output,
    and you want to view it a screenful at a time. We previously discussed the program
    allows viewing by screenful.


    Thus, you want to run the program bigreport and send its output (stdout) to the
    input (stdin) of more. The vertical bar character (|) is used to represent the
    pipe, so the command to perform this task like this:


    ```

    bigreport | more

    ```


    The preceding example shows spaces around the pipe character. These are allowed
    but not necessary. The following command would work also:


    ```

    bigreport|more

    ```


    Of course, you probably don''t have a program called bigreport available to you.
    So, to practice, enter a command that will produce a lot of output. Try the following
    command:


    ```

    ls /bin more

    ```


    You should see output like this:


    ![](img/fb7a71d55b85722293f8087c0b352fcc_294_0.png)


    Figure 13.5: Stdout Piped to more

    Note that the word More appears at the bottom of the screen in reverse video.
    This tells you that you are still in the more program rather than the shell prompt.
    Pressing the space bar will display the next screenful. Pressing Q


    will terminate more and return you to the shell prompt.'
  merge: -1
