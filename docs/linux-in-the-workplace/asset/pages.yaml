  md: '# Chapter 4: Getting Organized


    This chapter covers a variety of programs designed to streamline your day–to day
    tasks. Whether it is something as simple as the calculator on your computer (rather
    sorting through the drawer of stamps and rulers next to your desk) or something
    a little more complicated, as merging our PDA''s address book with your workstation,
    KDE can help you make you organized and efficient.


    # KOrganizer


    KOrganizer is a versatile program with organization options to meet many different
    needs. To go to K menu Applications • KOrganizer. Newer versions of KOrganizer
    have groupware. This means that other people will be able to view the same events
    on their calendars if that option is enabled when you enter events and your network
    is properly configured. Talk to your system administrator about enabling organizer
    feature.


    KOrganizer has two basic features: the Events calendar and the To–Do list. For
    those of you might be a little forgotten, the calendar can create event reminders
    that pop up on your desktop. If you like to plan ahead, the calendar can be viewed
    daily, weekly, or monthly. Or if you have a lot of things that need to be done
    as soon as possible, you can make use of the KOrganizer To–list.


    ![](img/fb7a71d55b85722293f8087c0b352fcc_54_0.png)


    When KOrganizer opens, you can see your daily calendar, your To–Do list, and a
    small calendar.


    # Configuring KOrganizer


    In KOrganizer, you can configure the preferences to view your business hours,
    assign colors to different views, and have reminders pop up on your monitor a
    few minutes before scheduled events. To access your preferences, select Configure
    KOrganizer from the Settings menu.'
  merge: -1
  pgno: 54
- img_proc: true
  md: '![](img/fb7a71d55b85722293f8087c0b352fcc_55_0.png)


    Figure 4.2: KOrganizer Preferences Window

    In the window that pops up, the seven configuration sections are listed with icons
    on the left. Click any one of these to modify that section. Click Apply to see
    your changes immediately; this is handy for testing the different colors and fonts
    you might want to use. When you have finished setting your preferences, click
    OK to save the changes, and exit the configuration window. If you do not want
    to save your changes, click Cancel. To modify more than one section, go from section
    to section by clicking the icons.


    **Tip** If you click Default in any one of these windows, all of your configuration
    settings will be deleted and replaced with the default settings.


    # Personal Settings


    Personal is for setting the frequency of autosaves. You can also enter your email
    address and choose Send copy to owner when mailing events if you want to receive
    email reminders about events.'
