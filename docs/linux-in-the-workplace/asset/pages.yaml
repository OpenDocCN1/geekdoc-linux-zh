- img_proc: true
  md: '![](img/fb7a71d55b85722293f8087c0b352fcc_121_0.png)


    Figure 6.13: KSpred Open document Dialog Box

    Moving around the Open document dialog box is quite intuitive. The up arrow will
    take you back one directory level, the house icon will take you to your home directory,
    and so on. When you have chosen the spreadsheet you want to load, click its name
    and select OK.


    # ## Entering Data


    Use the arrow keys to navigate cells. Press ENTER to move down a cell. Select
    a cell (with the arrow keys or the mouse) to enter information. You can type either
    in the cell or in the form above the spreadsheet. The data appears in both simultaneously,
    regardless of where you enter it.


    To begin entering data into your spreadsheet, click in a cell and enter text or
    numeric data. Then click in another cell and continue building your spreadsheet.
    This process is much like entering data into a word processor, except each piece
    of data is entered one cell at a time.'
  merge: -1
  pgno: 121
- img_proc: true
  md: '![](img/fb7a71d55b85722293f8087c0b352fcc_122_0.png)


    Figure 6.14: Entering Data into Your Spreadsheet

    When selecting a group of cells with the mouse, the last cell you highlight will
    not actually be highlighted. It will, however, be outlined with a dark border
    along with the other highlighted cells. The text styles, colors, fonts, and formats
    can be changed either before entering data into the document or after the cells
    have been highlighted. This is ideal if you want rows or columns to be differentiated
    by color, font style, or size. To delete the contents of a cell, select t he cell
    and press the BACKSPACE or DELETE key.


    # Using Formulas and Functions


    Formulas and functions perform calculations automatically before displaying the
    results within a cell. For detailed information on entering formulas and functions
    into a spreadsheet, refer to the "OpenOffice Calc: Spreadsheets" section in Chapter
    5.


    In any cell where you want to create a formula or function, simply click in the
    cell and begin with the standard =sum( ) entry, then add the formula or functions.
    Then, list the headers of the row and column for which you performed the calculation
    (all within parentheses).


    > Tip A sum icon is featured in the KSpread top menu. By highlighting the desired
    cells and clicking the sum icon, you can automate your function process so that
    you do not have to type in the equation manually. Additionally, a pull-down menu
    is featured to the left of the sum icon and includes the word SUM. Click the pull-down
    menu, and other automatic function options will become available to you.'
  merge: -1
  pgno: 122
- img_proc: true
  md: '![](img/fb7a71d55b85722293f8087c0b352fcc_123_0.png)


    # KWrite


    KWrite is a simple text editor often favored by programmers because it features
    colored syntax formattings customized for many programming languages. For the
    standard office user, KWrite is an intuitive application that''s ideal for times
    when you want a quick and easy program in which to toss some text.'
  merge: -1
  pgno: 123
- img_proc: true
  md: '![](img/fb7a71d55b85722293f8087c0b352fcc_124_0.png)


    Figure 6.16: Opening a New File

    To launch KWrite, type kwrite into the Run Command dialog box. Or from the K menu,
    select Editor and then open Advanced Editor, which should open KWrite automatically.
    Opening a new file is as easy as Selecting New from the File menu.


    Writing, opening, or editing a document in KWrite are all standard tasks in comparison
    to other text editors we have discussed. Familiar features such as Undo, Cut,
    Copy, and Paste are all included.


    # AbiWord


    AbiWord is a good word processor for people who need the basics and don''t like
    to wait for a heavy– duty office to start up. It''s not part of KDE, and it may
    not be included on your Linux distribution, but it''s a nice, lean, useful little
    word processor that we wanted to include here. AbiWord is not installed on your
    computer, you can find and download installation files at http://www.abisource.com/
    Although it looks pretty simple, AbiWord has a powerful extension capability behind
    the scenes. You can extend its capabilities with scripts, if for you to learn
    a little bit of the Perl programming language, and use the word processor as a
    front end for any Perl task you like.


    AbiWord recently released version 1.0, which should be stable, but you should
    always save your work frequently.


    If you have used a word processor such as Microsoft Word or KWord, most of AbiWord''s
    features will be familiar, and online help is available. With KDE applications,
    AbiWord''s Help menu invokes Konqueror to display help files.'
  merge: -1
  pgno: 124
- img_proc: true
  md: '# Starting AbiWord


    Start AbiWord from the Run Command dialog (ALT-F2 to bring up the Run Command
    dialog box) by typing abiword.


    # From Your Browser or Mailer


    AbiWord is an excellent choice for reading and printing word-processor files that
    people send you as email attachments. You may want to make your default application
    for working with Microsoft Word documents (see the “Opening Files” section of
    Chapter 3). AbiWord starts faster than other word processors, so you can access
    your documents more quickly.


    # The AbiWord Screen


    ![](img/fb7a71d55b85722293f8087c0b352fcc_125_0.png)


    Figure 6.17: AbiWord Unlike some word processors, AbiWord does not have one window
    with multiple document windows inside. If you open multiple documents, you get
    multiple real, top–level windows that can be moved to separate KDE workspaces.
    You might have one instance of AbiWord with several documents open, spanning several
    desktops.


    # Working with Files


    Besides its native format, AbiWord understands HTML 4.0, XHTML, Microsoft Word
    format, RTF, DocBook, plain text, and other formats. The easiest way to see the
    list of file formats currently'
  merge: -1
  pgno: 125
- img_proc: true
  md: 'supported to select Save As from the File menu and select the drop– down menu
    for Open File as Type. New formats are added regularly.


    **Tip** To see your document in HTML format, choose Preview Web Page from the
    Web menu.


    # New, Open, and Open Copy


    On the File menu, New and Open let you start working with a new document. New
    creates a blank document, and both Open and Open Copy open an existing one. The
    difference between Open and Open Copy opens when you select Save. If you have
    opened the document with Open Copy, the program will do exactly that: open a copy
    of the file selected. You will be prompted for a new name for the document. This
    feature is helpful if you want to revise or update a document but maintain the
    original, too.


    | New... |

    | Open... Ctrl+O |

    | Save Ctrl+S |

    | Save As... |

    | Open Copy... |

    | Save Copy... |

    | Page Setup... |

    | Print... Ctrl+P |

    | Close Ctrl+W |

    | Exit Ctrl+Q |


    Figure 6.18: The AbiWord File Menu

    **Save, Save As, and Save Copy**


    Save is missed if there are no unsaved changes, and you won''t be prompted for
    a filename unless you haven''t yet named the document or if you opened it with
    Open Copy.


    Save As always opens a File dialog box and prompts you for a new name. When next
    you save the file, AbiWord will save it under that name. Save Copy opens a file
    dialog box and saves under the name you enter, but keeps the existing filename
    for the next Save operation.


    New, Open, Save, and Save As are also available from the standard toolbar.


    **Tip** Make your work documents group-readable but not group-writable to allow
    your coworkers to read your work and continue it under a new name without accidentally
    overwriting it.'
  merge: -1
  pgno: 126
- img_proc: true
  md: '# Setting View Options for Productivity


    Nothing in the View menu actually changes any of the text in your document, it''s
    a good place to start. Select Normal Layout to get rid of the gray areas around
    the edges of your document, and select Zoom to Page Width to fit a whole horizontal
    line on screen at once. Before printing, select Print Layout and Zoom to Whole
    Page to preview.


    | Normal Layout |

    | Print Layout |

    | Toolbars |

    | Show Ruler |

    | Show Status Bar |

    | Show Paragraphs Ctrl+ |

    | Full Screen F11 |

    | Zoom |


    **Figure 6.19:** The AbiWord View Menu

    **Tip** Can''t make you mind if you find toolbars on or off? Use Full Screen (F11)
    to toggle between a toolbar–heavy view and a sparse view with everything but the
    menubar suppressed.


    # Formatting


    AbiWord has basic formatting commands you can recognize from other word processors.
    For example, you can select text, click the little B on the formatting toolbar,
    and get bold text. Or, for first click the little B and then type something–bold
    text, rejoice. Some formatting, such as font selection and bolding, is applied
    by character, and any changes you make will affect only the currently selected
    characters or any new text you type. Other formatting, such as text alignment
    and line spacing, is applied by paragraph. Changes affect the paragraph where
    the cursor is, whether or not your text is highlighted.


    You can get the formatting commands in three ways: from the formatting toolbar,
    or by using the keyboard shortcuts, which are listed in the Format menu. Select
    Undo from the Edit menu (CTRL-Z) to undo any format command.


    **Tip** Single-spaced text in lines that can span the entire page can be hard
    to read. Use the twicolumn button on the Standard toolbar to break the text into
    two columns, or select double spacing from the Extra toolbar, or select Paragraph
    from the Format pull-down menu.


    # Setting Tabs and Margins


    The controls for setting tabs and margins are similar to those in other word processors.
    Drag the two squares on the horizontal ruler to set the left and right margins,
    and drag the triangle to set the indentation for the first line of each paragraph.


    To set tab stops, drag them to the horizontal ruler from the tab box, which is
    to the left of the ruler. Tabs can be left, right, center, or decimal aligned.
    You can drag tabs along the ruler to move them, or drag them off the ruler to
    clear them.'
  merge: -1
