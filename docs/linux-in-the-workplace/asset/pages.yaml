  md: '# Chapter 3: Managing Files


    Konqueror is a program that allows you to view and organize your files. Think
    of it as a smart cabinet. It is customizable to allow you to display your files
    in a variety of forms. It also functions as a file–viewing application that displays
    files, such as JPEG and PDF files and formatted documents, in a read–only format.
    It can open help programs to work with or display file types that it recognizes,
    as well as AVI files (the most common format for audio–video data on the Internet).


    Konqueror is also a web browser that allows you to browse and work with files
    via the World Wide Web. In this section, we discuss Konqueror''s use as a file
    manager. Its other uses are discussed in Chapter 10, "Accessing the Web," and
    Chapter 11, "Customizing Your Desktop."


    # Making the Konqueror File Manager Your Friend


    Launch the Konqueror file manager by clicking on the home directory icon on the
    panel (the icon with the little house).


    ![](img/fb7a71d55b85722293f8087c0b352fcc_31_0.png)


    # The Location Bar


    Depending on what you have in your home directory, some icons appear in the main
    display window, with various menus and a toolbar along the top. Below the menus
    are the Location bar that displays the location of the files revealed in the main
    window below.


    ![](img/fb7a71d55b85722293f8087c0b352fcc_31_1.png)'
  merge: -1
  pgno: 31
- img_proc: true
  md: '![](img/fb7a71d55b85722293f8087c0b352fcc_32_0.png)


    # ### 3.3: The Conqueror File Display Manager


    Before the "file: portion of the Location bar is a smaller folder icon. Together,
    these indicate that Conqueror is being displayed in a directory rather than a
    web page (remember that Conqueror is a web browser). When displaying a web page,
    the icon changes, and "file: becomes "http".


    At the right side of the toolbar is a spinning KDE logo showing an activity indicator
    that lets you know when Conqueror is busy and has completed a task.


    The Location bar /home/ username/ is an example of a pathname because it shows
    the path to reach the final destination, in this case, the home directory. The
    / symbol indicates directories. For instance, /home is the parent directory in
    / username resides. You may have a directory called Mail in your /home/ username
    directory. If you click it, you will notice that the pathname in the Location
    bar changes to /home/ username/Mail, because Mail is a directory residing in /home/
    username.


    If you place the cursor in the Location bar by clicking it and remove the Mail
    you, you are left with /home/ username again. You may not have much there at this
    point, but this is probably the best place to save files and directories that
    you personally.


    One-saving feature of Conqueror is the arrow button at the right far of the Location
    bar which provides a history of recently visited locations. Rather than retype
    a recent location, scroll down to the desired address or pathname. Also, the Location
    bar remembers addresses and pathnames previously entered, and as soon as it recognizes
    your input, provides a list of options based on previous entries in a menu that
    appears immediately before the Location bar. Use the up and down arrow keys to
    select the correct one and press ENTER.


    Tip The text of the Location bar is draggable, meaning you can drag a directory
    or web page from to your desktop for quicker access. Just click on the folder
    icon or the word in the Location bar, or the word Location, drag it to the desktop,
    and select Copy from the menu that appears. Once it''s on your desktop, simply
    click it, and Conqueror opens with the web page or directory contents displayed.'
  merge: -1
  pgno: 32
- img_proc: true
  md: '# The Konqueror File Display


    The Konqueror display has two sections: a narrow panel, or sidebar, on the left
    and a larger window on the right.


    By default, Konqueror displays files in the main window with the filename below
    a small icon that represents the file type. For instance, directories are displayed
    with folder icons, text files are shown with a pencil and piece of paper, and
    image files are displayed with thumbnails of the image or with an image icon (depending
    on how you have your file manager configured). Right--clicking an icon displays
    a menu for manipulating the file in some way (more on this in the section “Working
    with Files”) and for obtaining information about the file.


    Files on your computer are arranged in a hierarchical manner, much like a tree
    with branches and subbranches. This structure is exemplified by the file display
    seen in the sidebar to the left of the main Konqueror window. The home directory
    icon represents a directory, or folder, in which subdirectories can be stored
    (within which further subdirectories can be stored) or files. This left sidebar
    offers an alternate method of accessing directories. Instead of entering the pathname
    for a given directory into the Location bar, you can merely click its icon in
    the sidebar to display the contents of that directory in the window on the right.
    Click the house icon, and you can see the contents of your home directory shown
    in the main window.


    Next to each icon in the sidebar is a small box with a plus (+) sign. Clicking
    this box shows the subdirectories contained within the parent directory in a tree
    structure display. Clicking the box again (now with a minus (-) sign) collapses
    the inside of that directory. Alternatively, doubleclicking the folder icon, instead
    of single-- clicking, has the same effect as clicking in the little box.


    If you click a subdirectory in the sidebar, its contents are displayed in the
    main window. Clicking any file icon in the main window opens that file within
    Konqueror in read-- only format. This means you cannot alter or manipulate the
    file, only view it. This is one of the most significant features of Konqueror:
    it can be used to view files of many different formats without launching another
    program. In addition to selecting files and directories with the mouse, you can
    use the arrow keys to move among the files displayed by Konqueror.'
  merge: -1
  pgno: 33
- img_proc: true
  md: '![](img/fb7a71d55b85722293f8087c0b352fcc_34_0.png)


    # Accessing Files on Removable Media—CD-ROM and Floppy Disk Drives


    CD-ROM and floppy disk constitute filesystems independent of the computer''s hard
    disk or other networked drives and need to be read by the computer. When you are
    finished with such a filesystem, it must be unmounted before the disk or CD can
    be removed. KDE makes this process very simple. Your desktop should have both
    a floppy and a CD-ROM icon. Simply click on the icon, and the appropriate filesystem
    is mounted with its contents displayed in Conqueror (don''t forget to insert either
    a floppy or a CD before trying this). A little green light appears next to the
    icon, indicating that the directory is mounted and its files are accessible. After
    use it, it is necessary to unmount the directory in order to remove the disk.
    To unmount, right–click on the icon and select unmount from the menu. The green
    light disappears, indicating that no directory is mounted.


    > > **Tip** If you are unable to mount a CD or floppy, it is probably because
    some program is accessing it. Close that application and the unmount should work.


    # Menus and Toolbars


    You can use the buttons in the toolbar near the window to view your files. For
    example, if you have a subdirectory in your home directory called cutinetics that
    contains image files of kittens, and the contents of this directory are displayed
    in the main Conqueror window, you only have to click the button (the blue arrow
    pointing up) to go back displaying the contents of your home directory, rather
    than the contents of cutekinetics.


    The back button (the blue button pointing to the left) takes you to whatever the
    previous display was, regardless of whether its pathname is in relation to the
    current directory. For instance, if you were looking in your home directory and
    then viewed a web page, the back button would return the display to your home
    directory.


    The button that looks like a house also takes you to your home directory, regardless
    of your current location.'
  merge: -1
  pgno: 34
- img_proc: true
  md: 'Use the magnifying glass buttons to increase or decrease the display size of
    the icons. The two buttons to these can be used to switch back and forth between
    the Tree View display (see the "View Menu" section that follows) and the Icon
    display of files.


    **Tip** The black X to the left of the Location bar is a single-click erase feature.
    Click to erase the current URL or pathname to enter a new one.


    **Tip** Pressing Ctrl– opens a dialog box where you can find an location (as in
    the Location bar). This allows you some navigation ability without taking your
    fingers from the keyboard.


    Some of the items in the Konqueror menu are related to Konqueror''s use as a web
    browser than some are relevant to both uses. That function in file management
    are discussed here. See Chapter 10 for more on using Konqueror as a web browser.


    # Location Menu


    The Location menu contains six permanent items. Other items may appear if Konqueror
    is being used to open a file for viewing. These items relate to working with the
    file and depend on the file type.


    | New Window | Ctrl+N |

    | Duplicate Window | Ctrl+D |

    | Open Location... | Ctrl+O |

    | Send Link | Ctrl+L |

    | Send File | Ctrl+P |

    | Quit | Ctrl+Q |


    Figure 3.5: Location Menu


    The six permanent menu items and their functions are:


    +   * New Window: adds another Konqueror window that opens displaying the contents
    of /home/ username directory.

    * Duplicate Window: creates an exact copy of the window from which it is opened,
    displaying the same contents than that of /home/ username directory.

    * Open Location: opens an Alternate Location bar.

    * Send Link: opens an email client (KMail by default), so you can email the URL
    or address displayed in the Location bar to someone; mostly used with Konqueror
    as a web browser.

    * Send File: opens an email client, KMail by default, to send the displayed file.

    * Quit: exits Konqueror.


    The Print menu item is enabled if a file, such as a text document or image file,
    is being displayed. Clicking the Print item opens a dialog box for selecting print
    options, such as which printer to use, depending on the file and printer..


    Besides printing from the print menu, you can also print using the dragand– drop
    method by dragging the file icon to the printer icon on the desktop.'
  merge: -1
  pgno: 35
- img_proc: true
  md: '![](img/fb7a71d55b85722293f8087c0b352fcc_36_0.png)


    Figure 3.6: The Print Dialog Box


    There are two programs accessible from the K menu, on the Utilities submenu, that
    can be used for viewing and modifying the order of any jobs in the print queue:
    Klpq (Print Job Administration) and KJobViewer (which may show up on the menu
    as simply Print Jobs). Also on the Location menu are options for opening a displayed
    file with more advanced applications. Conqueror displays files in a read- only
    format. If you want to modify a document, you must open it with another application.
    This is covered in more detail in the “Opening Files” and “Right-Clicking Files”
    sections of this chapter.


    # View Menu


    ![](img/fb7a71d55b85722293f8087c0b352fcc_36_1.png)


    Figure 3.7: View Menu


    The first item on the View menu is View Mode. This item allows you to alter the
    way directory contents are displayed. Putting the mouse pointer on this item reveals
    a submenu with display options.'
  merge: -1
  pgno: 36
- img_proc: true
  md: '![](img/fb7a71d55b85722293f8087c0b352fcc_37_0.png)


    Figure 3.8: View Mode—File Manager Display Options


    +   - Icon View: the default view, with which you are already familiar.

    - MultiColumn View: displays the icons, but in vertical columns (alphabetically)
    rather than horizontal rows.

    - Tree View: displays contents in a manner similar to the sidebar, but with additional
    information, such as file size, date last modified, and file permissions. Permissions
    are discussed further in the "Changing Permissions" section of this chapter and
    in Chapter 13.

    - Detailed List View: Similar to Tree View without the plus/minus (+/-) boxes
    and their collapsible subdirectories.

    - Text View: Similar to Detailed List View but with simple text in place of the
    icons.


    The next item, Index.html, allows you to view a selected directory as a web page
    if it contains an index.html file, rather than showing it as a list of files.


    Lock to Current Location locks the current display. In this mode, clicking one
    of the displayed files does not replace the current display, but it does open
    the item (if a file) in a separate window, or not open it at all (if a directory).


    The Link View item causes the current view to link to others in a multiple–window
    view.


    The Reload and Stop items are discussed in Chapter 10, "Accessing the Web." Some
    of the menu items change depending on the type of file display you choose from
    the View Mode submenu. These items allow you to manipulate the further ways files
    are sorted and displayed.


    The Hidden Files item reveals files whose names start with a dot (.). These are
    typically configuration files that determine how certain applications behave.


    The last two items, Background Color and Background Image, allow you to customize
    the color behind your file display or replace the color with an image. Choosing
    a color is merely a matter of selecting Background Color and clicking the color
    of your choice, and then clicking OK. To select an image, follow the same process.
    You can choose one of the images provided, or you may have an image file of your
    own which you can choose. You’ll learn much more about customizing in Chapter
    11.


    # Tools Menu


    The first item on the Tools menu, Run Command, presents you with a dialog box
    containing a line in which you can type the name of the program you want to run
    or the web page you want to view. In some cases this may be a faster method than
    searching through menus for the item. This same dialog box is available in the
    K menu as well.'
  merge: -1
