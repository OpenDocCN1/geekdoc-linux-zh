  md: 'Figure 2.6: Hidden Menu for the Desktop


    # Other Mouse Uses: Moving and Copying


    You can also use your mouse to move items on the desktop by clicking and dragging
    them to a new location—a method called drag and drop. To do this, position the
    mouse pointer directly over the item you want to move. Then hold the left mouse
    button and move the mouse itself to drag the item across the screen. Once you
    reach the desired location, release the mouse button to drop the item. You can
    even use drag and drop to perform actions. For example, you can drag a file to
    the printer to print it.


    To move a window to another location on your screen, position your pointer in
    the titlebar (the topmost section of the window) and then drag and drop the window
    to a new location. Once the window is where you want it, release the mouse button.


    To resize a window, move the mouse pointer along the window border. When a double-headed
    arrow appears, click and drag arrow inward or outward to the desired size. Adjusting
    from a corner lets you change the width and height at the same time (by dragging).


    +   * **Tip To move a window whose titlebar is inaccessible (maybe in your excitement,
    you moved it off the top of the screen), hold down the ALT key, click anywhere
    on the window, and drag.


    You can also use the mouse to copy text from any window that has a place for text
    placement into another window. For example, you can use the mouse to copy text
    from a web page into a document or email message. Simply highlight the text you
    want to copy by pressing the mouse at the beginning, pressing the left button,
    and moving the pointer across the desired text (doubleclick to highlight by word
    rather than space by). Clicking the middle button (or the left and right button
    simultaneously on a two–button mouse) will paste the text wherever the cursor
    is.


    Windows that display more than will fit in a single screen will have a vertical
    gray bar at the far right side, with a small black arrow pointing up at the top
    and another pointing down at the bottom. This is a scroll bar that allows vertical
    movement in a document. Clicking the down arrow will make the lower part of the
    document visible, and clicking the up arrow will take you up again. You can also
    click on the bar itself with the mouse pointer and drag it up or down. The same
    is for something too wide, except the scroll bar is across the bottom.


    # Navigating Your Desktop


    As described previously, when you log in to KDE, you will see a colored background
    with several icons on the left and a bar at the bottom lined with more icons,
    called the panel.'
