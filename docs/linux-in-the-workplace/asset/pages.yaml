- img_proc: true
  md: '# # OpenOffice Draw for Graphics


    OpenOffice features a graphics program called Draw. While it is technically a
    vector program, it provides some of the bitmap functionality of programs such
    as The GIMP and can classify as a beginner– intermediate–level graphics program.
    It is well suited for combining text, shapes, lines, and images into a single
    document, and has a limited ability to do a wide variety of tasks that usually
    require a specialized program. While some of its features are not as refined as
    they are in programs such The GIMP, the advantage is that they are combined in
    one program. If you want to create a business card with a graphic, you can do
    it without moving back and between programs.


    As Kentour, Draw allows you to draw Bezier curves, geometric shapes, and to import
    bitmap images into your document. You can also import spreadsheets or charts from
    spreadsheets. With Draw, you can add 3–D shapes and convert the boundaries of
    2–D images to 3–D so you can be manipulated as 3–D objects.


    # # A Sample Draw Document


    Let’s say you’re a used taxic salesman and want to create an advertisement for
    a community newsletter. You’ll want some captivating text, an illustrative graphic,
    and some data in the form of a graph demonstrating the superiority of your product.
    You may even want special effects for good measure.


    Starting a new document in Draw is the same as with the other OpenOffice programs
    (New• Drawing).


    ![](img/fb7a71d55b85722293f8087c0b352fcc_103_0.png)'
  merge: -1
  pgno: 103
- img_proc: true
  md: 'Let us start with the text. Click the capital T icon in the left toolbar. This
    converts the mouse pointer to crosshairs. This allows you to draw a text box where
    you enter your text. Hold down the left mouse to begin drawing the box, and drag
    until the box reaches the desired dimensions (the outline appears as it is drawn).
    Release the button when done. Then click the resulting box to begin entering text.
    Remember that the features of OpenOffice Write are available to you when you working
    with text—also as spell checking and the thesaurus.


    ![](img/fb7a71d55b85722293f8087c0b352fcc_104_0.png)


    Figure 5.26: Entering Text

    To add a graphic, select Graphics from the Insert menu. This presents a dialog
    box allowing you to be browsed for the desired file. Like, the graphic appears
    in a box with border points, and it can be manipulated by clicking and dragging
    on the borders.


    +   Tip If you want to add an image from another document to the current one,
    you can right-click on it and select Cut or Copy. Then right-click on the current
    document and select Paste.


    ![](img/fb7a71d55b85722293f8087c0b352fcc_104_1.png)


    Figure 5.27: The Insert Graphics Dialog'
  merge: -1
  pgno: 104
- img_proc: true
  md: 'To insert a chart, Insert • Object • OLE. A dialog box appears to allow you
    to choose the desired chart. Select your chart, and it appears in your document.


    ![](img/fb7a71d55b85722293f8087c0b352fcc_105_0.png)


    Figure 5.28: The Insert OLE Object Dialog

    Now you''ve got a document with text, a graphic, and a chart.


    ![](img/fb7a71d55b85722293f8087c0b352fcc_105_1.png)


    Figure 5.29: Sample Document with Text, Graphic, and Chart

    To spice up your ad, you may want to add some kind of effect such as converting
    your graphic to look like a charcoal sketch. Select the graphic by clicking on
    it, making the Edit Points icon in the upper left corner of the Draw window become
    a filter icon. Clicking on it reveals a number of options for modifying the look
    of your graphic. These include solarization, mosaic, smoothing, relief, charcoal
    sketch, and seven other options.'
  merge: -1
  pgno: 105
- img_proc: true
  md: '![](img/fb7a71d55b85722293f8087c0b352fcc_106_0.png)


    5.30: Turning Your Graphic into a Charcoal Sketch


    To gain an appreciation of Draw’s other features and an understanding of working
    with graphics in general, it is recommended that you read Chapter 7, “Working
    with Graphics,” and Chapter 8, “More on Graphics: The GIMP.\ Then you should be
    able to navigate through OpenOffice Draw’s features fairly easily.


    # Keyboard Shortcuts in the OpenOffice Suite


    Though moving around OpenOffice with the mouse pointer works very well, you may
    want to speed things up a bit with keyboard shortcuts as you become more proficient.
    Not moving your hand from the keyboard to the mouse can save considerable time.


    Two kind of shortcuts exist in OpenOffice. The first shortcut uses the ALT key
    plus a letter to open a menu, and a keystroke to select an option within the menu.
    All shortcut letters are underlined in their menu listings. For example, if you
    want to insert a horizontal line into a document, you can press ALT–I to open
    the Insert menu, then press the Z key to insert the Insert Horizontal Line option
    box. Note the underlined “z” in the word Horizontal, indicating the keyboard letter
    to effect.


    The second type of shortcut is called an accelerator. Using the CTRL key with
    a keystroke, you can execute a task instantly, as as saving a file or printing
    a document. Accelerator shortcuts are documented in the menus to the right of
    the listed items. For example, that you’re in a document and want to print it.
    Rather than using the mouse to select File and Print, you can press CTRL–P to
    open the Print dialog box. Spend some time looking through the menus and experimenting
    with the many available shortcuts.


    99'
  merge: -1
  pgno: 106
- img_proc: true
  md: '![](img/fb7a71d55b85722293f8087c0b352fcc_107_0.png)


    Figure 5.31: As shown in the menu, the Accelerator to open a file is CTRL–O

    After you''ve spent some time working with the OpenOffice suite and learning the
    shortcuts for the functions you use most, you''ll come to appreciate its power,
    features, and flexibility, and wonder how it is free of charge.'
