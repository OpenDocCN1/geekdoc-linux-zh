    are entered, the duration of the event will be shown to the right of these fields.
    If a default time was specified in the configuration settings, it will show up
    automatically. If there is no time frame associated with the event (only dates),
    then check the No time associated box. The event will appear as one full day if
    you select this option. If the event will occur on a regular basis, check the
    Recurrent event box. Then you can enter more information about the repeating event
    on the Recurrence tab (see the "Recurrence" section for more on this option).


    To receive a reminder, check this box. If it is checked, you can enter the number
    of minutes, hours, or days before the event which you want to receive a reminder.
    To do this, enter the number in the text field; then select, hours, or days from
    the pull– down menu. You can also choose to have an audio or video file as a reminder
    for an event. Click the music note or running– man buttons next to the pull– down
    Time Increment to select either of these options. After you click the audio or
    video button, a window pops up where you can choose one of the audio or video
    files that comes with KDE, or you can select your own file.


    > To use the alarm function, you need to choose Make Active from the Menu before
    exiting the program. This option keeps track of appointments, while KOrganizer
    is not open, and sends you reminders.


    With the Show Time As menu, you can select Busy or Free. This option shows the
    time period in the calendar as either busy or free.


    The Categories window here is the same as the Category window appears when you
    create a new To–Do list item, and it can be edited in the same manner.'
