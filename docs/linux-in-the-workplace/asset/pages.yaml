    > Tip Sometimes you need to remove a file whose name starts with a hyphen. To
    do this, precede the name with .., which doesn''t change the meaning of the file
    location, or use the full pathname.


    # mkdir—Create a Directory


    The mkdir command creates directories. This is the same as making a new folder
    with Konqueror:


    ```

    mkdir [options] dirnames

    ```'
