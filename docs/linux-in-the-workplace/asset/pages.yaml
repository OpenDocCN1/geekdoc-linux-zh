    # # Other Email Agents


    Pine, Mutt, and Elm are a few of the text– based email programs available. While
    programs that take advantage of a graphical user interface have the advantage
    of intuitive use, text– only programs are popular as well. Keep in mind, however,
    that your mouse will not work to select or send messages. Instead, you will need
    to become familiar with some keyboard commands and use the arrow keys to navigate.


    Start these mail programs by typing the program name (all in lowercase) on the
    command line in a terminal window. (See Chapter 13 for an explanation of how to
    use the command line and terminal windows.) The most frequently used keyboard
    commands are usually shown at the top or the bottom of the screen, such as M for
    mail. The H or ? keys are often keyboard shortcuts to help for these programs,
    and Q will quit the program, taking you back to the terminal’s command line.


    # # Usenet


    As mentioned at the beginning of this chapter, Usenet newsgroups are used to exchange
    news, information, data, and debate over the Internet. Ideally, newsgroup names
    are organized in a hierarchical structure for easy access, but in practice, a
    group may be created and thrive outside of that organizational structure. The
    group names in the formal structure are organized from general to specific, separated
    by a period. For example, comp.os.linux.announce is for announcements relevant
    to the Linux OS, part of the broader topic computer.


    These are a few of the other broad topics:'
  merge: -1
  pgno: 196
- img_proc: true
  md: '• News: information about Usenet.

    • Talk: current issues and debates.

    • Soc: social issues, culture.

    • Rec: games, hobbies, sports, arts.

    • Sci: scientific topics.

    • Alt: anything; originally an “alternate” hierarchy.


    Articles and messages are posted to news servers (computers that do nothing but
    handle newsgroup data) and transmitted to other news servers to be read by anyone
    in the world. Posts that generate follow-up feedback are called threads, as in
    a “thread” of conversation. Articles with harshly condemning content are known
    as frames.


    Each newsgroup has its own character and its own code of conduct, which may or
    not be explicitly stated. Some are very formal, and others are informal and chatty.
    Some allow criticism and correction without censure; others do not. If a group
    is moderated, that means a person or group of people approves incoming messages
    before they are posted, to keep a topic on track and the tone civil. Otherwise,
    the direction, content, and tone of a newsgroup are affected by anyone who participates.


    # KNode


    KDE’s news reader is KNode. You can find it listed in the Internet module of the
    K menu.


    ![](img/fb7a71d55b85722293f8087c0b352fcc_197_0.png)


    Figure 35: The KNode Window

    KNode and KMail are closely related, so you should recognize the toolbar and organizational
    layout. The first time you open KNode, you may be prompted with the KNode Preferences
    dialog box. If not, or when you want to configure KNode for personal use, select
    Configure KNode from the Settings menu.'
  merge: -1
