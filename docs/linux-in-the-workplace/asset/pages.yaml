    The application itself is fairly basic. Select the you to open, then view the
    fax page or pages, magnify, or print as necessary.


    ![](img/fb7a71d55b85722293f8087c0b352fcc_204_0.png)


    Figure 9.43: Viewing a Fax in KFax

    Faxing utilities is another area that KDE developers are continually working on,
