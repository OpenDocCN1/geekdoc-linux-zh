    ![](img/fb7a71d55b85722293f8087c0b352fcc_272_1.png)


    The Login Manager allows you to customize the login screen. You can select a different
    background, choose which language it should use, choose which users have access,
    and choose whether you want automatic or passwordless login ability. Here, you
    need superuser privileges to make alterations.'
