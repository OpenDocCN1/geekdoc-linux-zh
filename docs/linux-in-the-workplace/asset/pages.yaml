  md: '# Text Editors


    This section introduces the most common editors used with Linux on the command
    line, but an entire book could be written on each editor. In the case of vi and
    Emacs, that has already happened.


    Don''t confuse these text editors with word processors. These are programs designed
    to let you enter and edit text. Their text-formatting capabilities are limited
    to setting line–length limits. Traditionally, these editors were used in conjunction
    with text–processing programs, such as troff, to produce typeset documents.


    # Emacs


    Emacs is a project of the Free Software Foundation. Many people see it as a work
    environment rather than just an editor. It includes its own built– programming
    language, so you can customize its operation.


    # Joe


    Less popular than Emacs or vi, Joe has to offer the beginner. Besides its easy–to–default
    mode with on–screen menu, he can emulate the basics of Emacs and vi.


    # vi


    vi is the most popular, by far, the available editors. There are many flavors
    of vi, including nvi, vim, vile, elvis, and stevie. All what is called a moded
    system, where you enter text in one mode and edit in another. The users and developers
    of vi pride themselves on minimizing the number of keystrokes to complete a task.


    # lpr—Send File to a Printer


    The lpr command can be used to spool a file for printing. This is similar to the
    menu choices in GUI applications and the drag–drop capacity in KDE.


    ```

    lpr [ options] [ files]

    ```


    If no files are specified, lpr reads from standard input.


    # Common Options


    | m [ user] | Sends email to user (you as default) when the job has been printed.
    |

    | -P ptr | Sends the file to the printer named ptr instead of your default ($PRINTER).
    |

    | -r | Removes the file after printing. |


    # File Attributes and Permissions


    Associated with each file and directory are two ownership fields and a set of
    permissions. Ownership and permissions are used to restrict access to files.'
  merge: -1
