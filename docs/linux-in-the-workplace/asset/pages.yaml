    two views by clicking the - or +.

    Purge Complete: next to each of the items on your To-Do list is a small black
    box. If you are using this list to keep track of current projects, you may want
    to check off each item as it is completed. Purge Complete deletes all the items
    you have checked off.


    > Tip Items can be moved easily among To-Do lists using the drag-and-drop method.


    To-do items and sub-do items can be sorted in different ways. Click Summary to
    sort alphabetically or Priority from highest to lowest. Due Date and Due Time
