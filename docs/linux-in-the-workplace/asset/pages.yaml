- img_proc: true
  md: '![](img/fb7a71d55b85722293f8087c0b352fcc_44_0.png)


    ![](img/fb7a71d55b85722293f8087c0b352fcc_44_1.png)


    # # Opening Files


    As discussed previously, you can open existing files in a read– only format by
    leftclicking the icon or filename. This works for basic text documents, HTML documents,
    most types of images, and programs.


    Once a file is opened, depending on the type of file, more choices are added to
    the pull–down menus (as mentioned in the preceding “Location Bar” section). For
    example, if you open a text document, the menu also has the option to open the
    file with a number of text editors or word processors. Choose one of these programs
    to open your file, and you are able to edit, print, save, or perform whatever
    you want with the file. See Chapter 5, “The OpenOffice Suite”; and Chapter 6,
    “Working with Graphics” for more detailed information on how to work with specific
    types of files and applications.


    Because different types of programs create files in different formats, it is customary
    for files to have an extension appended to their name that indicates the file
    type. This helps in deciding what application to use to open and manipulate a
    file. File extensions are usually added automatically when a program creates or
    saves a file. For instance, if you write a letter to your secret admirer in AbiWord,
    when you save the file (with perhaps the name “secret”) AbiWord appends the extension
    .abw, making the whole filename secret.abw.


    Konqueror looks to the file extension to determine the file type and make suggestions
    as to what program would be most appropriate to open it. If a file is a type not
    recognized by Konqueror, it may'
  merge: -1
  pgno: 44
- img_proc: true
  md: 'not open simply by clicking. If this occurs, right– clicking the file, choose
    Open With, and then choose an appropriate program from the list (or type one)
    to open the file. This process is discussed in more detail in Chapter 11. However,
    we cover the process for dealing with Microsoft Word documents here as an example,
    because you may need to make adjustments to your Konqueror configuration.


    ![](img/fb7a71d55b85722293f8087c0b352fcc_45_0.png)


