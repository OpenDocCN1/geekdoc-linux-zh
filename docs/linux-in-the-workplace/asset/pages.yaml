- img_proc: true
  md: '![](img/fb7a71d55b85722293f8087c0b352fcc_265_0.png)


    News sites generally have a file that contains both headlines and teasers for
    articles. This is where newssticker gets its information. News files frequently
    end with .ors .rdf extension. This source file for the Linux Journal web site,
    for example, is found at http://www.linuxjournal.com/news.Rs Simply enter this
    in the Source file box, click OK, and you''re done. If you right-click on the
    news ticker display itself, you will be presented with the list of news sites
    you have chosen. Select one, and you get an option to check news at that site,
    or you can go directly to one of the headlines listed.


    # Peripherals


    From the Peripherals module, you can access settings for your digital camera,
    keyboard, and mouse.


    The digital camera module is where you enter the model of camera you''re using
    by clicking on the little icon on the top right of the window. Other options will
    become available, depending on the type of camera you''ve entered.


    The options available for the keyboard are limited and depend a great deal on
    the hardware design of the keyboard itself, as well as the X server being used.
    You may be able to adjust the key volume, if that feature is available on your
    system. In general, you will most likely never need to fiddle with the keyboard
    section of the Peripherals module.


    # Mouse


    You will probably find the mouse options in the Peripherals module is broken into
    two sections, designated by the General and Advanced tabs. On the General tab,
    you can map your mouse buttons for left-handed users and designate that a double-click
    (rather than the default single- click) is necessary to launch or open a program,
    file or menu item. You can also choose to configure the mouse so that icons are
    selected automatically when the pointer passes over them. This may be useful when
    you want to select an icon without opening it. Other options include making the
    pointer change shape (into a hand) when it passes over an icon.'
  merge: -1
  pgno: 265
- img_proc: true
  md: '![](img/fb7a71d55b85722293f8087c0b352fcc_266_0.png)


    Figure 11.40: Available Options to Customize Your Mouse


    The settings on the Advanced tab affect your mouse speed and the time intervals
    between mouse movements—things like the span within which a double- click must
    occur to be considered a double- click instead of two single clicks. The default
    settings will be acceptable for most users, although tweaking may be useful for
    graphics work where you are working at the pixel level. Feel free to experiment,
    but be careful how fast you set the pointer acceleration, or the pointer will
    fly off the screen.'
  merge: -1
  pgno: 266
- img_proc: true
  md: '# Personalization


    With the Personalization module, you can further refine your desktop environment
    by customizing such things as the way currency is written for your particular
    region and your password settings. Here''s a quick overview of the options available
    under Personalization.


    # Accessibility


    Accessibility provides special features for disabled users, such as a visual bell
    instead of an audible one and mouse navigation with number keys. It lets you specify
    the length of time a key must be held down for it to repeat, and it also allows
    the user to move the mouse with the Num pad (numeric keys) rather than with the
    mouse itself.


    # Country & Language


    Country & Language controls the language, numeric, and time settings and be changed
    to match the standards of your geographical location. If you live in France, and
    want to change the way currency is displayed on your system so that the thousands
    separator is a period instead of a comma, this is where you accomplish that. You
    can also specify whether the date should be shown in month/day/year or day/month/year
    format, among other things.


    ![](img/fb7a71d55b85722293f8087c0b352fcc_267_0.png)'
  merge: -1
  pgno: 267
- img_proc: true
  md: '![](img/fb7a71d55b85722293f8087c0b352fcc_268_0.png)


    Figure 11.42: Regional Customizations


    # # Crypto


    Security is always an important issue with computers. As you move across the Internet,
    you go between secure and unseen websites. Luckily, your system is set by default
    to warn you of certain security issues and risks. All of this information can
    be seen in the Crypto menu item. From there, you can make changes to security
    measures like SSL (Secure Socket Layers) and certificates. Although security is
    beyond the scope of this book, you should certainly familiarize yourself with
    security issues surrounding computers and the Internet. See Chapter 10 for a brief
    overview of this topic.


    # # Konsole


    The Konsole module is where you can customize your terminal windows. For example,
    you can select the default terminal application and the colors for your terminal
    windows. See Chapter 13 for more detailed information on configuring terminal
    windows and using the command line.


    # # Passwords


    The Pass module gives you access to options for setting up passwords. You can
    select one star or three stars (the number of stars that show up on the screen
    when you type each letter). You can select no echo, so there is no onscreen indication
    of how many letters are in your passwords. Finally, you can specify the amount
    of elapsed time before password reverification is requested.


    # # Session Manager


    The Session Manager is where you set up your login/logout sessions. For example,
    you can enable Confirm logout or Save session for future logins. You can also
    select the default action for what'
  merge: -1
  pgno: 268
- img_proc: true
  md: 'happens logout; Login as different user, Turn off computer, or Restart computer.


    # Spell Checking


    The Spell Checking item allows you to customize some spell– check options, such
    as Consider run–together words as spelling errors. It also allows you to choose
    which dictionary you''d like KDE to use.


    # Power Control


    The Power Control module basically does what you would think, given its title,
    depending on your specific installation. You can monitor your batteries (especially
    useful for laptops), on configure your power–saving features, control power settings
    for your laptop, or set an alarm to alert you when your batteries get too low.


    Most of these settings have to laptops, the Energy setting will allow you to control
    how long it takes for your display to go into sleep mode. Get out of this power–saving
    mode once it has activated itself, all you need to do is move your mouse or press
    a key.


    ![](img/fb7a71d55b85722293f8087c0b352fcc_269_0.png)


    11.43: Energy Setting


    # Sound


    Assuming that you have a sound card and speakers on your system, KDE allows you
    to make a variety of noises with your machine— anything from sounds associated
    with computer events to playing music CDs and is possible.


    KDE includes a nice CD player like KsCD for playing music CDs. From the K menu,
    go to Multimedia, and you''ll see it in the submenu. Despite its simple appearance,
    the player has some functionality, including the ability to provide information
    by way of Internet connectivity.


    On the Sound menu in the Control Center, you will find the Audioc IO Slave item.
    This allows you some control over the behavior of KsCD (or any CD player you may
    have on your computer). Selecting it presents four tabs.'
  merge: -1
  pgno: 269
- img_proc: true
  md: '![](img/fb7a71d55b85722293f8087c0b352fcc_270_0.png)


    Figure 11.44: The Audioc IO Slave Items


    The first tab is CDDA Settings, which tells the computer where to look for the
    CD-ROM drive. In most cases, it is probably best to check the Determine device
    automatically and Never skip on errors boxes. The next two tabs allow you to determine
    settings for sound quality of both Ogg Vorbis and MP3 digital music file formats.
    (Ogg Vorbis is a more recent sound format that has the advantage of being open
    source.)


    The last tab is CDDB Settings. CDDB stands for CD database, an Internet service
    that provides title and track information for music CDs. Here, you can enter where
    your computer goes to access this information.


    > Tip The Debian Linux distribution comes with the freedb settings by default.
    Normally, the only necessary step here is to check the Enable CDDB Lookups box.
    The freedb site provides a free service and seems to have a very good database.


    The CD player sends data to the CDDB service, which then recognizes the CD and
    sends back title and track information that is displayed on the CD player.'
  merge: -1
  pgno: 270
