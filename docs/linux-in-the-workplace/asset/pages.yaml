    for more details on shell commands.


    # Settings Menu


    The Settings menu contains items that give you a great deal of control over the
    file manager, allowing you to customize the features of Konqueror. As with other
    KDE menus that allow you to change settings with a single click, there is a check
    mark next to the setting that is currently activated.'
