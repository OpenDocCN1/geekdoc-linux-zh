    Figure 6.5: Manipulating the Frame


    # # Formatting Your Document


    Formatting allows you to choose character and page styles. Scores of options are
    available in KWord. Advanced users can rest assured that other formatting features,
    such as those to apply text styles, add tables, and create indexes, are all available
    and generally located in the same places as they are in other word- processing
    applications.'
  merge: -1
  pgno: 113
- img_proc: true
  md: '![](img/fb7a71d55b85722293f8087c0b352fcc_114_0.png)


    Figure 6.6: Formatting Your Document


    # # Choosing a Font


    KWord''s default font seems to vary with versions. To change the font, highlight
    the text you want to modify and select a font type and size from the drop– down
    Font menus above the document. The highlighted text will change accordingly. Or
    simply set these options when starting a new document. Bold, italic, and underline
    options are also available. Simply click the B, I, or U buttons, respectively,
    to the right of the font toolbars. Superscript and subscript options are also
    available on the Font menu or icons in the middle of the toolbar.


    107'
  merge: -1
  pgno: 114
- img_proc: true
  md: '![](img/fb7a71d55b85722293f8087c0b352fcc_115_0.png)


    # # Aligning Text


    Word''s default is to left-justify all text within a document. If you want some
    or all of your document to be aligned differently, highlight the appropriate text.
    Then select one of the alignment buttons in the bottom toolbar. Options include
    left, centered, right, and forced justification. You can also determine and set
    the alignment of your document before you begin typing.


    108'
  merge: -1
  pgno: 115
- img_proc: true
  md: '![](img/fb7a71d55b85722293f8087c0b352fcc_116_0.png)


    # Using Bulleted and Numbered Lists


    Position your mouse pointer at the beginning of the paragraph or sentence where
    you want to insert a bullet or number. Click the numbers icon on the bottom toolbar.
    This icon will give you a numbered list. (Click the icon to remove this feature
    and return to default formatting.) If you want to change the numbers to bullets,
    choose Paragraph from the Format menu. In the dialog box, select the Bullets/Numbers
    tab, which has options for the numeration of the list or for changing the number
    to a bullet point.'
  merge: -1
  pgno: 116
- img_proc: true
  md: '![](img/fb7a71d55b85722293f8087c0b352fcc_117_0.png)


    Figure 6.9: Choosing the Type of Bullet to Add to Your Document Increasing and
    Decreasing Indents


    To increase or decrease the indentation of text, click one of the two indent icons,
    located to the right of the numbering/bullets icon. The icon with a leftpointing
    arrow decreases the indentation, and the icon with text and a rightpointing arrow
    increases the indentation. Click the appropriate icon more than once to increase
    the indent in the same direction.


    # Applying Color


    KWord allows you to add color to text characters, but you cannot highlight blocks
    of text beyond the basic function of selection. After selecting the text you want
    to color, click the color icon, the letter A over a colored box at the far right
    in the bottom toolbar. A dialog box allows you to choose from a palette of colors,
    or you can create your own color by clicking the color scale with the eyedropper
    tool and adding the color to the color palette.'
