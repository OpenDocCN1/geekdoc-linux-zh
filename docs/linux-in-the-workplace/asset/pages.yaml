    If you don''t know exactly which the file is in, you can enable searching in subdirectories.
    To narrow your search, you can use the Date Range or the Advanced tab. Enter the
    filename in the Named bar and the (parent or directory) that you expect it to
    be, or use the Browse button.


    ![](img/fb7a71d55b85722293f8087c0b352fcc_38_0.png)


    **Figure 3.10: Finding Files**

    The Find Utility works a little differently than programs in other operating systems.
    You will notice an asterisk in the Named bar when you enter text. The asterisk
    represents a wildcard for any character or even no character. If you don''t know
    the filename in its entirety, or its name begins with "report," you can enter
    "report" in the Named bar, and the files returned are all those starting with
    "report" and ending in anything. If you want to search for all of'
