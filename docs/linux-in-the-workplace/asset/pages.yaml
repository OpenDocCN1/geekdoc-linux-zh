  md: '# Chapter 12: Making Job Backups


    # Overview


    As reliable as computers have become, many things can still happen to cause corruption
    or loss of data. Power outages, hardware failures, and even others tampering with
    your files provide good reasons for making backup copies of your work. If you
    are in a networked environment, you probably have a system administrator who is
    responsible for making regular backups of the system data—most likely on a tape
    device—but you may want to back up portions of your own files as well. Maybe you
    have a project you want to refer at some time in the distant future but don''t
    taking it up in your home directory until then, or perhaps you have a job that
    is essential, the regular system backup provides enough security to protect it.
    You may need to copy large files on some type of transferable media to send to
    someone, or maintain archives of projects that are no longer current. In any case,
    you might have a number of reasons for backing up your work.


    For small jobs, a floppy disk might be sufficient. The "Making the Conquerer File
    Manager Friend" in Chapter 3 discusses accessing the files of floppy disks, and
    the "Working with Files" explains copying files. If the you want to back up the
    standard 1.4MB limit of a floppy disk, you''ll need to go to a medium with more
    capacity, such as a Zip disk or an LS120 Super Disk, which holds 100MB and 120MB,
    respectively (note some Zip disks hold 250MB). The problem is that although almost
    every computer has a floppy drive, not all have Zip or LS120 drives, making those
    options less ideal for transporting data in some situations. CDs are that another
    option. Their standard 650MB capacity and the ubiquity of CD drives make them
    a good choice.


    This chapter explains how to make backups to this portable media.


    # The Archiver Backup Utility


    KDE includes a GUI program for using various popular UNIX backup formats. The
    program is called Ark. It can group files together into a single file and even
    compress them so they take up less space on your portable media. Unpacking files
    created by Archiver is covered in the "Working with Files" section of Chapter
    3. Here we show you how to create file archives.


    In some cases, copying files or directories into the backup—in the way you would
    copy them into another directory on your hard drive—may be sufficient. However,
    compressing the data in some way is often more efficient, "cleaner" method.


    The Ark utility provides a way to do this compression. Open Ark from the Utilities
    submenu of the K menu. Your goal is to group the files back into either a single
    file or at least fewer files. For instance, if you back up your home directory,
    you may want to have a separate archive file for each of its subdirectories.'
  merge: -1
  pgno: 279
