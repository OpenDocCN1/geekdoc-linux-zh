    the left button and stretch (or shorten) the event time by moving the mouse. Release
    the button when you are finished.


    In the Daily, Workweek, and Week calendar views, a status bar appears above the
    main calendar with a summary of events. You can edit an event by right– clicking
    it in this window, as well as in the main calendar window.


    # Importing, Exporting, and Archiving in KOOrganizer


    Available from the File menu, these options make it simple to access calendars
    from other programs and archive appointments with KOOrganizer.


    # Importing


    Import from ical to import files saved in iCalendar format. The only requirement
    for this is they must have the correct file extension, .ics.


    Merge Calendar is the equivalent of importing a calendar. You can import files
