    Curves

    Image brightness and contrast can also be adjusted using the Curves menu, which
    is accessed by right—clicking and choosing Image • Colors • Curves. In some ways,
    works like Levels but allow a different type of control over image brightness
    and contrast. Drag the line up or down from the middle or add one or more anchor
