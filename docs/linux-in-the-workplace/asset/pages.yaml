- img_proc: true
  md: '![](img/fb7a71d55b85722293f8087c0b352fcc_98_0.png)


    # # Saving Your Spreadsheet


    To save your spreadsheet, use the same menu items as saving for a wordprocessing
    document.


    Select the Save or Save As options from the File menu. The Save dialog box appears,
    once again instructing you to name your file (if it is not already named) and
    choose the file format in which you want your spreadsheet saved (click the arrow
    next to File type to see a list of file format options).


    As with MS Word documents, you can import or export MS Excel and other popular
    spreadsheet file in OpenOffice. Follow the example in the earlier section "Opening
    an Existing Spreadsheet" to import a foreign file format. To save a spreadsheet
    in a foreign file format, use the Save As dialog simply click the arrow within
    the File Type box and select the desired file format.


    # # Working with Multiple Pages in One Spreadsheet


    Sometimes you may want to have multiple pages in one spreadsheet. For example,
    say you create a detailed report every month. You may want to have every month
    on its own page, but youd like to keep all the pages together. Notice the tabs
    at the bottom of the screen that say Sheet 1, Sheet 2, and so on. You can use
    your mouse to flip between the pages and rename them by rightclicking a tab and
    choosing Rename. You can also change the order in which the sheets appear by placing
    the mouse pointer on the tab, and then dragging and dropping the sheet to the
    new location.'
  merge: -1
  pgno: 98
- img_proc: true
  md: '# Printing Your Spreadsheet


    Before printing your spreadsheet, you should take the time to think about how
    you want your spreadsheet to look. Do you want the grid boxes to appear? Do you
    want all of the spreadsheet or only certain data within it to appear?


    To print the entire spreadsheet, select Print from the File menu. To print just
    a portion of your spreadsheet, highlight that portion, and then select Print Ranges
    from the Format menu. From there, select Define. Now continue with the standard
    printing procedure.


    It is common to turn off grid boxes on a spreadsheet before printing it. Other
    formatting features include scaling the spreadsheet to fit on one page, printing
    only a chart, and printing only the data. To access any of these formatting tools
    and others, select Page from the Format menu.


    ![](img/fb7a71d55b85722293f8087c0b352fcc_99_0.png)


    Figure 5.21: The Calc Page Style Dialog Box\Often spreadsheets look better, and
    are more efficient and effective, if they are printed across the pages to show
    columns on a single printed page. By default, all documents print in the normal
    81/ 2 – 11– inch layout, called portrait mode. You can change the layout to landscape
    mode, which uses an 11– 81/ 2– inch layout, by selecting Page from the Format
    menu. From the resulting dialog box, choose the Page tab, and within the Page
    format section, select Landscape.


    # OpenOffice Impress: Presentations and Slideshow


    You can create presentations quickly and simply with Impress. The format for information
    in a presentation is slides, which are a single screen in size and can combine
    text and graphics. The presentation can then be printed or shown on the monitor.'
  merge: -1
  pgno: 99
- img_proc: true
  md: 'From the menubar, select File • New • Presentation. Select Empty presentation
    from the AutoPresentation dialog box, then click Next. On the following screens
    you are asked to make selections to customize your presentation. The third screen
    allows you to add effects such as fades. After making your selections, click Create.


    At this point the Modify Slide dialog box appears, and you can choose the layout
    of your slide. Make your selection and click OK.


    ![](img/fb7a71d55b85722293f8087c0b352fcc_100_0.png)


    Figure 5.22: Specifying a Layout

    The first slide of your presentation now appears. Click the area where you want
    to feature text or insert a graphic. Begin typing (where there is existing text,
    simply click the text and begin typing over it), or select Graphics from the Insert
    menu and proceed by selecting the graphics filename of your choice.'
  merge: -1
  pgno: 100
- img_proc: true
  md: '![](img/fb7a71d55b85722293f8087c0b352fcc_101_0.png)


    When you''ve completed the first slide of your presentation, you can insert another
    slide by clicking the empty gray bar next to your first slide''s page at the bottom
    left side of the screen. To alter this newly created slide, simply right-click
    the new tab Slide 2 and select Modify Slide. You then continue as you did when
    creating your first slide.


    # Fine-Tuning Your Presentation


    To alter a slide, click the drawing view icon, which is located in the icon set
    above the vertical scrollbar.


    To change the sequence in which your slides appear, click the slide view icon,
    located above the vertical scrollbar. From here you can easily drag and drop slides
    into the sequence you desire.


    Many other formatting options are available to you in OpenOffice Impress. In fact,
    these are easily the topic for their own book. But truthfully, once you have the
    basics, a little clicking around helps you discover what you need to know.


    # Saving and Exporting Your Presentation


    You''ve finished the slides, and now it''s time to save your presentation. To
    do so, save Save As from the File menu, name your presentation, and select Save.
    Impress is the default file format, although you can save in a Draw or MS PowerPoint
    format, if you prefer.


    # Exporting as a Web Presentation


    Exporting your file as a web presentation is particularly handy, as it can be
    viewed by any web browser. By selecting the Export option from the File menu.
    Don''t worry about which slide you are on when you do this. This action exports
    the entire presentation.'
  merge: -1
  pgno: 101
- img_proc: true
  md: 'Give your presentation filename and save it. You are then guided through the
    exporting process. First select an HTML design from the HTML Export dialog box,
    and click Next. You are instructed to choose a publication type. How do you want
    your HTML presentation to be displayed? Options include plain HTML pages, frames,
    automatic slideshow view or webcast. Select the desired customization options,
    and click Next. Depending on which option you choose, you may be guided through
    the selection of a short series of other HTML characteristics.


    ![](img/fb7a71d55b85722293f8087c0b352fcc_102_0.png)


    Figure 5.24: Exporting to HTML

    Once you''ve selected your HTML characteristics, you are ready to save your HTML
    presentation. Select a file type (options include GIF or JPG), compression value,
    and screen resolution (the lower the resolution, the smaller the graphic files),
    and indicate whether you want a sound played when slides advance. When you are
    finished, click Create.


    Now you''re ready to view your HTML presentation in a browser (or OpenOffice).
    Simply open your web browser of choice and point your browser at your HTML presentation''s
    filename.


    # Printing Your Presentation


    Printing your presentation (especially handy for overheads) is as simple as clicking
    the print icon at the top of the screen.


    # Viewing Your Presentation


    To view your presentation as a slide show, click the start show icon above the
    vertical scrollbar. Your presentation starts immediately and advances automatically.
    You can select the time intervals, or you can choose to advance slides with a
    mouse click, which is handy if you''re doing a presentation with input from other
    people.


    To alter presentation settings, choose Slide Show from the menubar, and then select
    Slide Show Settings.'
