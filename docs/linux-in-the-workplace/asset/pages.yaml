    # ### 10.4: Using Shortcuts

    A variety of shortcuts should be present in the Enhanced Browsing window. To add
    a shortcut, you need to know how your favorite site turns your query into a URL.
    Google is easy; it puts your search query=?. If you want to search for Linux,
    the URL is http://www.google.com/search?q=Linux gets a GET, and it''s the most
    common kind of web search.


    Other sites, like the Linux Journal site, are trickier because they use a different
    type of form, called a POST, that doesn''t put your search query in URL.


    You can almost make a web shortcut for POST by forming them out with a query embedded
    in the URL and making them perform a GET. Use View Source on the search page,
    and look for the input tag that signifies the search box. It will look something
    like this (from the Linux Journal site):


    ```

    <input type="text" name="query" size="14">

    ```


    The name query is what you want. Just put it at the end of the URL of the search
    results page (not necessarily the same as the URL of the search form) like this:


    ```

    http://linuxjournal.com/search.php?query=

    ```


    Finally, the magical name \=1. What \=d 1? Konqueror knows to replace it with
    your search term. So the Search URI is


    ```

    http://linuxjournal.com/search.php?query=\1

    ```


    Now that we have the information we need, go back to the Configure Konqueror menu,
    select the Enhanced Browsing dialog box, and click Add. Fill in the New Search
    Provider dialog box like this:'
