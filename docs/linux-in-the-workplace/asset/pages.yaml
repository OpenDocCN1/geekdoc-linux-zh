- img_proc: true
  md: '# Chapter 7: Working with Graphics


    This chapter addresses the KDE application KPaint and the third-party application
    xscanimage, which is most likely already on your KDE desktop as part of your Linux
    distribution bundle. If not, it can easily be acquired. This chapter also touches
    on Contour, KSnapshot (a standard KDE application designed to capture screenshots),
    and the image viewers KView and Gwen. Other image viewers and graphics applications
    may be included on your system, depending on your version and distribution, but
    if you familiarize yourself with the ones covered here, you''ll find the others
    work similarly.


    # KPaint


    KPaint is an easy-to-use graphical painting program. To access it, go to the K
    menu, scroll to Graphics, and choose Paint (or KPaint, depending on your version
    of KDE). You''ll be presented with an introductory window.


    ![](img/fb7a71d55b85722293f8087c0b352fcc_130_0.png)


    Figure 7.1: KPaint Opening Window


    # The Toolbar


    To get started, familiarize yourself with the toolbar, working from left to right.


    ![](img/fb7a71d55b85722293f8087c0b352fcc_130_1.png)


    Figure 7.2: The KPaint Toolbar'
  merge: -1
  pgno: 130
- img_proc: true
  md: '# The Page Icon


    You can open a drawing window with the page icon. You''ll be prompted to choose
    a numeric window size in pixels. This is a complicated subject that we''ll address
    further when we talk about image scanning. For now, all you need to remember is
    images viewed on a monitor (think web images) should render at 72 pixels per inch.
    Thus, for an image you want to be 4 inches wide by 3 inches tall, you''ll need
    a 28 b by 216 pixel "canvas". You can resize your canvas by choosing Image • Resize
    from the pull–down Image menu above the toolbar. Note: when you resize the canvas,
    any art you have already drawn will also be resized.


    KPaint is a bitmap drawing tool, meaning that you are drawing with pixels. If
    you scale up your image, the program will increase the number of pixels used to
    represent what was formerly a single pixel, resulting in jagged edges. You may
    like this effect, but you''ll most likely want to go the other direction, i.e.,
    start a bit bigger and smaller to increase image crispness.


    # The Folder Icon


    You can open an existing graphic using the folder icon by entering the path and
    filename in the Location bar. The format of the graphic you are opening must be
    that KPaint can read. The accepted file types are listed on the Filter dropdown
    menu.


    +   - KPaint can open TIFF files but may not show color.


    # Save


    It''s a good idea to save your file on a regular basis. Besides normal concerns
    of system locks and power failures, KPaint does not have an undo or restore feature.
    Once you''ve altered a file, there''s no going back. One work–around is to save
    your file regularly with another filename. This harkens to the old days when you
    had to develop the habit of toggling back and forth between two or more saved
    files to ensure that you have a good copy, in some case effect you added didn''t
    turn out as planned.


    # Cut, Copy, and Paste to the Clipboard


    The cut, copy, and paste allows you to cut, copy, paste your artwork to and from
    other applications. Using the tool, drag the mouse over the area you want to cut
    or copy and select Edit • Copy (or Cut). Use the paste icon to place the selection
    back into the image or into another application.


    # Magnification


    Use the percentage and magnifying tools to set your view magnification manually
    or to zoom in or out at increments. Setting your view at 100% shows you how your
    art will look in print or on the Web.


    # The Drawing Tools


    KPaint includes ellipse tools that draw ovals or perfect circles in a chosen color.
    You can also draw in straight lines or use the rectangle or rounded– rectangle
    tool by clicking the shape or line type, and then clicking and dragging the mouse
    on the canvas. The default colors are red and green. Press the left button to
    paint in red (or the color on the left) and the right mouse button to paint in
    green (or the color on the right). To change default colors, see the section "Color"'
  merge: -1
  pgno: 131
- img_proc: true
  md: 'later in this chapter.


    You can spray colored pixels with the spray tool or use the A–shaped Text tool
    to add words to your image—but only in black. There is no color option with the
    text tool.


    KPaint is a simple program; you cannot choose the brush size, text size, or font.
    If you need more control, use the GIMP (see Chapter 8).


    # Copy and Paste within a Document


    The little rectangular marquee allows you to select an area to copy or cut. After
    you have selected the area, use the Edit pull–down menu to choose Copy, Cut, or
    Paste. Place the cursor at one corner of the area you want to select and drag
    to the opposite corner. If you are satisfied with the selection, go to the pulldown
    menu Edit • Copy or Edit • Cut. To paste the item into your image, click Paste
    in the Edit menu, and then go back to your image and position the mouse cursor
    at the location where you want the item. Leftclick will keep pasting the item
    (wherever and as many times as you want). Left–clicking will keep pasting the
    item until you select another tool to work with or select another item to copy
    or cut. You can also paste into a new document by selecting Paste Image from the
    Edit menu.


    > Tip You can configure the toolbar to your liking; try playing around with Settings
    • Configure Toolbar.


    # Color


    The Color menu is to the right of the drawing area. You''ll see a thumbnail of
    your artwork, and below that are buttons for two color choices (remember, you
    can toggle between them while drawing by using the left and right mouse buttons).
    Below the color buttons is a pull–down menu with some color swatch options. In
    this figure here, the web–friendly color swatch menu is selected. If you click
    the left or right color buttons below the thumbnail, you''ll enter the Color Mixing
    Palette, which allows more advanced color selection. Simply click the where you
    see the color of your choice, and move the arrow on the bar on the right up or
    down, until you see the shade you''re looking for appear solidly in the box. If
    you click OK, that color will become the color for the left or right button.'
  merge: -1
  pgno: 132
- img_proc: true
  md: '![](img/fb7a71d55b85722293f8087c0b352fcc_133_0.png)


    Figure 7.3: Color Menu Icon

    You can also add new colors to the Custom Color menu, which then appear on the
    Color Swatch pull–down menu on the main KPaint window. Simply click the Add to
    Custom Colors button, and you''ll see your chosen color appear on the custom color
    swatch.


    The Color menu also allows you to enter HSV (hue/saturation/value), RGB (red/blue/green),
    or HTML (RGB colors in hexadecimal format) numeric color equivalent manually.
    However, color value and color space are subjects beyond the scope of this book.
    Images are created for different media, such as monochrome presentation software,
    the Web, or print. Each media works best with a particular color space model.
    For most applications you are safe using the RGB color space for images or the
    CMYK (also called process color) color space for images that will be viewed on
    a monitor, and for commercial printing.


    # ## Document Information


    At the bottom of the KPaint window, you will find some useful information about
    window size, view, current tool selected, and location of the file. Keeping an
    eye on this information will help you stay organized.


    ![](img/fb7a71d55b85722293f8087c0b352fcc_133_1.png)


    Figure 7.4: Document Information Menu


    Play with KPaint and become familiar with the KPaint tools and menus. You''ll
    find it well spent when you move on to the much more elaborate, powerful, and
    exciting world of The GIMP in Chapter 8. As an intermediate step, play with Xpaint,
    which is not part of KDE but may be available on the Graphics menu, depending
    on your Linux distribution. Xpaint works a lot like KPaint, but it offers a much
    larger range of options for color, patterns, brush size, and text insertion.'
  merge: -1
  pgno: 133
- img_proc: true
  md: '![](img/fb7a71d55b85722293f8087c0b352fcc_134_0.png)


    Figure 7.5: A Sample Drawing from KPaint


    # # Scanning


    Scanners allow you to take photos, slides, printed materials, or even paper–andpencil
    drawings and import them into the computer in a format graphical application can
    read. A number of commercial and free scanning applications are available. Here
    we discuss the GNU utility xscanimage.


    # # xscanimage


    Depending on your Linux distribution, xscanimage resides on the distribution menu
    (K menu • SuSE • Graphic • Graphics • XScanImage) or under Graphics and then under
    the distribution name (K menu • Graphics • Debian • xscanimage).


    After selecting xscanimage, you''ll be presented with an introductory window.'
  merge: -1
  pgno: 134
- img_proc: true
  md: '![](img/fb7a71d55b85722293f8087c0b352fcc_135_0.png)


    Figure 7.6: xscanimage Opening Window


    The Preferences pull- down menu (Preferences • Advanced Options) provides further
    options. However, depending on your monitor size and screen resolution, this menu
    window may be too large to fit on your screen.


    ![](img/fb7a71d55b85722293f8087c0b352fcc_135_1.png)


    Figure 7.7: xscanimage Advanced Options


    Eventually, you may want to try out the various options to see what they do, but
    in the meantime, leave everything at the default settings except Scan mode and
    Scan resolution. Determine which type of scan mode is appropriate: Lineart, Halftone
    (for drawings), Grayscale, or Color (for photographs).'
  merge: -1
  pgno: 135
- img_proc: true
  md: '![](img/fb7a71d55b85722293f8087c0b352fcc_136_0.png)


    # Scan 7.8: Scan Mode Options

    Scan Mode Options


    For pen–and– ink drawings, use the Lineart scan mode, which produces highcontrast,
    black–and–white line images. You may need to adjust the Contrast settings to get
    the result you want. In the figure here, Contrast is set to +58.


    ![](img/fb7a71d55b85722293f8087c0b352fcc_136_1.png)


    Scan 7.9: Example of Type of Artwork Appropriate for Lineart Scan Mode

    The Halftone option creates an image composed of all– black pixels. Areas of light
    or dark are created by using more or fewer black pixels. You may want to explore
    this cool effect for use with low– resolution printing such as photocopies or
    newsprint.'
  merge: -1
  pgno: 136
- img_proc: true
  md: '![](img/fb7a71d55b85722293f8087c0b352fcc_137_0.png)


    Figure 7.10: Output of a Color Photograph Scanned in Halftone Mode

    For photos, choose Grayscale or Color, depending on what you need in the finished
    piece.


    ![](img/fb7a71d55b85722293f8087c0b352fcc_137_1.png)


    Figure 7.11: A Color Photograph Scanned in Grayscale Mode

    Under Advanced Options, you''ll find settings for Gamma correction and Geometry.
    For general

    purposes, you can safely leave Gamma correction and Geometry at their default
    settings. When you

    ready to learn more about gamma correction or scanning resolutions, check out
    some online

    tutorials, such as http://www.cgsd.com/papers/gamma_intro.html or

    http://hem.passagen.se/harsman/gamma.htm'
  merge: -1
