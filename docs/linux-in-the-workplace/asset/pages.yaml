    # System Notifications


    System Notifications is also on the Sound menu in the Control Center. This lets
    you control the way you are notified when certain events occur, such as errors,
    startup, the opening or closing of a window, and so on. Simply scroll through
    the list of possibilities (there are too many to mention here), and see if there
    are any you want to customize. If so, click the little box with the plus sign
    and choose a notification method. Choices include: Log to file, which will log
    the event notification to a file and not make it known to you overtly; Play sound;
    Show messagebox; and Standard error output.'
