  md: 'CTRL–C. This will end the execution attempt and return you to the shell prompt.


    Tip The shell prompt can be changed by setting the PS1 environment variable.


    # Control Characters


    The shell interprets various control characters allowing you to edit the lines
    and perform other local tasks. Signify that you have completed entering a command
    line by pressing the ENTER key. Prior to pressing ENTER, the two basic editing
    keys are BACKSPACE and CTRL–U. Pressing the BACKSPACE key erases the most recently
    entered character. Entering CTRL–U deletes all the characters you have entered
    on the current line, allowing you to start over.


    Once you have pressed the ENTER key, control is turned over to the program. For
    example, if you type in ls -l and press ENTER, the shell turns over to the ls
    prompt. The BACKSPACE and delete character sequences can no longer be interpreted
    by the shell. If you want to terminate the execution of a program, you can press
    CTRL–C. This will interrupt


    If you want to suspend the execution of a program, press CTRL–Z. This suspends
    the program and returns you to the shell prompt. Entering the fg command (followed
    by ENTER) will resume the suspended program.


    You can also enter bg (followed by ENTER) to resume the suspended program in the
    background. This means the program will be restarted, you will receive a shell
    prompt. This is useful when you want to run a time–consuming program and redirect
    its input and output streams to files.


    Finally, you can use CTRL–S to pause the output of a running command. CTRL–Q resumes
    the output. Note that program output may scroll by too fast to make effective
    use of these control sequences. Generally, you will be better off using a pager
    program as more or less, both of which allow you to view a screenful at a time.
    For example, if the output of the ls –l command is more than screenful, you can
    enter ls –l |


    > Some programs require that you send them an End-of-File (EOF) character to signify
    that you have completed your input. To send this character, press CTRL–D.


    # Pipes and Redirection


    By default, the shell establishes three connections with the terminal window.
    These connections are called standard input, standard output, and standard error.
    In UNIX documentation you will see them abbreviated as stdin, stdout, and stderr.


    The stdin connection is connected to the keyboard. Programs read your keyboard
    input from stdin. The stdout connection is connected to your screen and is the
    way that programs send their output back to you. The stderr connection is also
    connected to your screen and is the way programs send out about problems and abnormalities.


    There are two output streams (stdout and stderr) so that it is possible to send
    error information to your screen, even though the normal output of the command
    being sent somewhere else (to a file or possibly to another program).'
