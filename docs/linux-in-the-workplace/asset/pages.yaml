  md: '# Style


    The Style section of the Control Center lets you customize the look and feel of
    your widgets Widgets are things like buttons and check boxes. KDE provides a list
    of possible widget themes from which to choose. Note that this particular customization
    section does not give you any previews.


    You must click Apply to see what happens. If you want to go back to your previous
    styles, you''re out of luck if you don''t remember your settings. But you can
    always select the KDE default widget style and return to the style you had—before
    you started messing with any of these customizations.


    ![](img/fb7a71d55b85722293f8087c0b352fcc_257_0.png)


    Figure 11.28: Customizing Your Widgets


    On the Effects tab, you can alter GUI effects, such as changing tooltip behavior
    to Animate or Fade. There are also style options for your toolbars to choose from
    icons only, text only, or a combination of both—depending on how cluttered or
    sparse you like your toolbars to look.


    Another option is Highlight buttons under mouse, which simply means that when
    your mouse pointer is hovering over a button, that will be highlighted. If you
    uncheck this box, there will be no indication that your mouse pointer is on top
    of a button. Here is where you can also enable or disable the transparent tool.
    Toolbars can be enabled or disabled here well.


    # Taskbar


    Taskbar lets configure whether you want all windows open on all desktops to show
    up at once on the taskbar of the desktop that is active, or if you only want the
    windows that are open on the active desktop to show, and whether you want the
    windows list button displayed on the taskbar.'
  merge: -1
  pgno: 257
- img_proc: true
  md: 'You can also activate or deactivate Group similar tasks, Sort tasks by virtual
    desktop, and Show application icons.


    You can alter mouse button actions here to change what happens when you click
    on the taskbar with the different buttons. Select the drop down menus for all
    the options for each button.


    ![](img/fb7a71d55b85722293f8087c0b352fcc_258_0.png)


    Figure 11.29: Configuring the Taskbar


    # Theme Manager


    The Theme Manager lets you install KDE Themes. On the left side of the window
    is a list of preinstalled themes. Clicking on them gives you a preview in the
    right part of the window. On the far right are four buttons. Add lets you browse
    to the location of themes you have downloaded. Save lets you change the current
    theme under a new name, so you can make changes without damaging the original.
    Create lets you save your current desktop settings as a theme of your own, and
    Remove removes the theme from your list. The Contents tab allows you to select
    or deselect certain areas if you don''t want a theme to affect all parts of your
    desktop.


    Tip You can find many additional themes to add at http://kde.themes.org/'
  merge: -1
  pgno: 258
- img_proc: true
  md: '![](img/fb7a71d55b85722293f8087c0b352fcc_259_0.png)


    # Window Behavior


    The Window Behavior module lets you specify how you want your windows to act.
    For example, you can choose whether making window active requires a click, or
    whether it will follow your mouse (with the windows moving to the front as your
    pointer hovers over them). On the keyboard section, you can switch between KDE
    mode and CDE mode, which means that pressing ALT-TAB or CTRL-TAB, respectively,
    will switch between windows.


    If you select the Traverse windows on all desktops option, then pressing ALT-TAB
    or CTRL-TAB will take you through all windows on all desktops rather than only
    the active desktop.'
  merge: -1
  pgno: 259
