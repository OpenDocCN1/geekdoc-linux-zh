    # Using Edit File Type


    Edit File Type lets you configure the filename patterns (or filename extensions)
    that Konquer recognizes for a particular type of file. For example, a JPEG image
    will be recognized if it has any of the following file extensions appended: .jpeg,
    .jpg, or .JPG. If you want to add more possible extensions for a given file, click
