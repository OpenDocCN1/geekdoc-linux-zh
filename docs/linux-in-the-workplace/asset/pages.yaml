  md: 'The toolbar has tools for drawing freehand lines, Bezier paths (see the discussion
    on Bezier tools in Chapter 8, under "Smart Selection\ various geometric shapes,
    text, and on path. You can also import clipart or bitmap images into your document.
    Use the Layers tab to organize your work. You can set individual layers to be
    hidden, print, or to be the current working layer.


    If you are familiar with Adobe Illustrator, note that Contour includes some of
    the same features but is much less sophisticated overall. Experiment with the
    tools, remembering that the right button on the mouse provides access to further
    options and preference settings.


    # Grab ''n Go with KSnapshot


    Perhaps you need to include a screenshot for a presentation, user documentation,
    or a website. KSnapshot allows you to capture screenshots of all open windows
    on your desktop or of one specific window.


    First, set the windows you want to capture on your desktop. Next, access KSnapshot
    (K menu Graphics • Screen Capture). A pop-up window will show a small thumbnail
    image and two buttons, Grab and Save. Review the directory path and filename,
    and add the three– character extension of the file format you desire, for instance,
    .png, .jpg, or .bmp. If you don''t change the filename, KSnapshot defaults to
    PNG format, names the screenshot "snapshot1.png", and saves this screenshot to
    your current directory. Pressing Save will capture an image of your entire desktop
    in its current state.


    ![](img/fb7a71d55b85722293f8087c0b352fcc_142_0.png)


    Figure 7.16: The KSnapshot Window'
  merge: -1
  pgno: 142
- img_proc: true
  md: 'For more control over a screenshot, check the box for Only grab the window
    containing the pointer box. Next, click Grab, and the Snapshot window will vanish.
    Now, click within the borders of the window you want to acquire. Use the Delay
    option to allow a few seconds'' pause before the screenshot capture. You''ll need
    this option, for example, if you want to grab a pull– down menu in action. This
    feature works exactly like a timer on a camera.


    ![](img/fb7a71d55b85722293f8087c0b352fcc_143_0.png)


    Figure 7.17: The Delay Option Allows Capture of Fluid Menus in Transition

    When the Grab operation is complete, the KSnapshot window will reappear. A small
    thumbnail image of the captured screenshot will be displayed in the viewing window.
    Make any necessary changes to the directory path and filename, and then click
    the Save button.


    | Filename: | /home/lydia/snapshot1.png |


    Figure 7.18: Review the Pathway before Saving


    # KView


    Sometimes you may need to view or alter an image, but you don''t need all the
    bells and whistles of an application like Kontour or The GIMP. KView is designed
    for this purpose and is included with all versions of KDE. KView allows you to
    place an image on your desktop''s background, adjust brightness, transform the
    image, or conduct a slide show of multiple images.


    # Getting Started with KView


    Access KView, sometimes called Image Viewer, from the K menu (K menu • Graphics
    • Image Viewer).'
