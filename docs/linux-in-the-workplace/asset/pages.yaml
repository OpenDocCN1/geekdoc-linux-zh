  md: '# Moving About


    To move about the hierarchy and know where you are, there are two commands you
    need to know: cd and pwd.


    The simplest, pwd, tells you the name of your current directory. It takes arguments.


    You can use cd in three ways. First, just entering cd with no arguments will move
    you to your home directory. You can, of course, check the results by entering
    pwd.


    If you know the location of a directory relative to the root, you can follow cd
    with the full pathname of the desired directory. For example, many of the programs
    you will use from the command line are located in the directory /usr/bin. Entering
    cd /usr/bin will change /usr/bin to your current directory. Similarly, entering
    /var/spool will make the system spool your current directory.


    # File Manipulation Utilities


    Now that you can move around the filesystem and know what commands look like,
    it''s time to try a few.


    # Is—Listing Directory Contents


    You have already seen this command in earlier examples. It produces a list of
    names, and if so requested, other information, about the specified files. The
    most basic case is ls, which lists all files in your current directory whose does
    not start with a dot (.).


    The general form of the command is: ls [options] [files]


    # Common Options


    | -a | Includes files whose name start with a dot. (Linux treats any file as hidden,
    meaning the names are not displayed by default.) |

    | -l | Includes file size, ownership, and permission information. |

    | -R | Recursive—includes subdirectories. |

    | -t | Sorts by modification time. |

    | -u | Sorts by time of last access instead of last modify. |


    # Examples


    Lists all files in your current directory sorted by last modify time


    ```

    ls -lt

    ```


    Lists files in /usr/bin whose name starts with gif; make it a long list:


    ```

    ls -l /usr/bin/gif*

    ```


    # cp—Copy Files


    The cp command copies one or more files. In the most basic form, you specify a
    source filename and a destination filename:'
  merge: -1
