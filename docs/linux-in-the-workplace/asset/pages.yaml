  md: 'a fax server (back end) are involved.


    # K Send a Fax


    K Send a Fax is a simple fax utility for use with the KDE printing system, enabling
    fax support for virtually all KDE applications. K Send a Fax can be found on the
    Utilities module of the K menu; in some versions it appears under the name Send
    Fax or Kdeprintfax. This utility is intuitive and works simply once it has been
    installed and set by the network administrator.


    To send a fax with K Send a Fax, you must provide the name and fax number of the
    recipient, as well as the message body and filename to be sent. The pop-up screen
    where you enter this information looks similar to KMail''s Composer window, where
    you select a file to send or move to other directories. Clicking the Add icon
    opens a window to your home directory, where you select a file to attach. Once
    Once you''ve added a file, complete the Fax Number, Name, Enterprise and Fields.
    Finally, click the Send Fax icon. If you make a mistake, click Abort. If error
    messages are returned, click the View Log for a description of what went wrong.


    ![](img/fb7a71d55b85722293f8087c0b352fcc_203_0.png)


    Figure 9.42: K Send a Fax Main Window


    Tip Remember that the entries you''ve added to your address book are available
    in all KDE functions, including K Send a Fax.


