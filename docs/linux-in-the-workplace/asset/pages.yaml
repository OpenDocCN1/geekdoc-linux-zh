    also adjust levels and curves on individual color channels. If you look on the
    Channels in Layers & Channels, you''ll see that each color space has its own channel:
    R for red, G for green, B for blue. You can gain a great deal of control over
    the image color by manipulating levels or curves on individual color channels.
    Save the


