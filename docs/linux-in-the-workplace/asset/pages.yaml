    #### Using Cut, Copy, Paste, and Rename


    The Cut, Copy, Paste, and Rename options are self–explanatory if you’re working
    with just about any word–processing program. You can highlight text within a file,
    and then choose Cut or Copy (cutting removes it from the original spot; copying
    makes a copy and leaves the original in the original location) and finally click
    Paste to your selection where you want (once you have a file open, right– click
    anywhere on the page gives you these options). With Conqueror, you can do this
    with files and directories also, easily moving or copying files or folders between
    directories and subdirectories. Simply right– click a file or folder and choose
    cut or copy. Then place your cursor on the destination folder (by pointing and
    clicking), click the folder to open it, rightclick somewhere on the background
    of your file manager window, and click Paste; the folder or file appears in its
    new location.


    > There are two types of cursors on your computer: the text cursor, which appears
    inside of an x–terminal, Konsole window, or word processor–type program and where
    the next words will appear, and the mouse cursor, which relies on mouse movement
    for its placement.


    Another method that works both with highlighted text and with folders and files
    (with the cursor on them) is to use your keyboard. Pressing CTRL–X will cut, CTRL–
    C will copy, CTRL–V will paste.


    To give a file a different name, simply right– click it and choose Rename; a box
    pops beneath the icon for the file or folder with the current name highlighted,
    allowing you to type over or change the name of the file. If you want to keep
    a file or folder with the old name as a reference, make sure you make a copy of
    it before renaming it.'
