    # # Burning Data to CDs with KOnCD


    The process of putting data onto a CD is somewhat different from recording data
    from other media and is referred to as *burning*. CDs are both writable and readable
    are available, but the most common type for making backups is write–once, read–only.
    This means once they have data written to them, they become read–only. The data
    remains “burned” permanently.


    In addition to making backup CDs with KOnCD, you can also make audio CDs that
    are playable in an ordinary CD player.


    # # Preparation


    You will need a CD recorder—either a CD–R (CD– readable) or CD–RW (rewritable)
    type– a few disks. The differences between the two types of CD recorders are like
    the differences between permanent and washing marker pens. You can erase and re–
    record over a CD–RW disk, but once you record onto a CD–R disk, it’s permanent.
    Another difference is that'
  merge: -1
  pgno: 281
- img_proc: true
  md: 'CD–RW disks may be used only in a CD–RW drive, while CD–R disks may be recorded
    and played in either a CD–R drive or a CD–RW drive. Audio CD–Rs can usually be
    played in an ordinary CD player too. Have a look at the CD media table for more
    details.


    | | Erase | Record in CD–R drive | Play in CD–R drive | Record in CD–RW drive
    | Play in CD–RW drive | Play in CD player |

    |---|---|---|---|---|---||

    | CD–R data disk | no | yes | yes | yes | yes | no |

    | CD–R audio disk | no | yes | yes | yes | yes | no |

    | CD–RW data disk | yes | no | no | yes | no | no |

    | CD–RW audio disk | yes | no | no | yes | yes | no |


    Of course, there is no way to know whether a disk recorded on one will play on
    another until you try it. The cheaper ones are less tolerant. To ensure that your
    disk can be played in the widest variety of drives, choose high-quality CD–R disks.
    On the other hand, if erasing appeals to you, you don''t expect to use the disks
    except in CD–RW drives, choose high-quality CD–RW disks.


    If your system does not have KOnCD, it can be downloaded from the program''s home
    page http://www.koncd./


    You''ll also need read/access the CD device. If you need this access, contact
    your system administrator.


    While KOnCD is running, it will create a temporary file on your hard drive equal
    to the total size of the data you’re recording. This file is called the CD image,
    or in KOnCD-speak, the "image." Verify that you have sufficient free space on
    your hard disk for this.


    +   * Once you’ve successfully recorded a few CDs, try KOnCD’s Burn on-fly option,
    which avoids the temporary file. This works only if your computer is fast and
    lightly loaded.


    Burning a CD makes precise demands on CD technology. One common problem is underrun,
    where the CD recorder needs a piece of data immediately, but the computer does
    not have it yet. By the time the data arrives, it has already spun beyond point
    and is ruined. These disks make excellent coasters, but they are irreplaceable,
    always keep a few extra blank disks on hand. Also, while underruns avoids the
    recording process immediately, other errors may not be detected. Always try reading
    a disk after you record, especially if it''s a backup disk. If you don''t *assume*
    it will work; try it to make sure. Once you''ve made a few disks on a particular
    machine and read them with the other player, you''ll get a feel for how often
    it succeeds and how vigilant you need to be. But since we''re talking about backups
    here, extra vigilance is better than not enough.


    # Starting Up


    Start KOnCD by choosing it from the K menu (Multimedia • KOnCd), or by typing
    koncd in the Run Command box.'
