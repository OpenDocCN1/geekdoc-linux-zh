    # # Accessing Man Pages


    Before moving on to "Working with Files," it may be useful to consider one other
    handy feature of Konqueror: the display of man pages. Information on UNIX/Linux
    system commands and tools at'
  merge: -1
  pgno: 41
- img_proc: true
  md: 'documented electronically in man, or manual, pages. The man pages provide information
    on the use of commands such as arguments, or specifications, that can be used
    to customize the behavior of commands. This is primarily of value to those who
    use terminal windows (like Konsole) to enter commands. Indeed, man pages are traditionally
    accessed from the command line (Chapter 13), but Konqueror allows access as well.
    In the Location bar, simply type a pound sign before a command. For example, type
    #lpr to display the page for the lpr command.


    ![](img/fb7a71d55b85722293f8087c0b352fcc_42_0.png)


    Figure 13:15: The lpr Man Page, Konqueror is highly customizable. As soon as you''ve
    become familiar with the basics of using Konqueror file management, try playing
    around with some of the configuration options available. You can make the most
    of what''s offered and do away with what you don''t use or like.


    # Working with Files


    Konqueror''s graphical interface makes working with, managing, and accessing your
    files very simple. Now that you have learned working your way around the menus
    and toolbars and customized your file manager, the next step is actually doing
    something with these files.


    # Creating New Folders and Files


    To begin, you may want to create new folders (subdirectories) and new files. In
    Konqueror simply click Edit in the menubar at the top of the window, Create New,
    and then choose which entity you want to create. The most commonly used selections
    in a typical office are probably Directory (represented by a folder icon), for
    storing files or subdirectories, and Text File'
  merge: -1
  pgno: 42
- img_proc: true
  md: '(represented by a paper–pencil icon).


    ![](img/fb7a71d55b85722293f8087c0b352fcc_43_0.png)


    Figure 3.16: Creating Files


    Tip You can also right–click anywhere on the background of the file manager screen
    and see a menu with options such as Create New, Reload, New Window, Undo, and
    Paste.

    After you make a choice of what to create, a box appears asking you to name it.
    Type the name, and the directory or file appears on your file manager page.


    # Moving Files


    The drag–and–drop method of moving files in KDE provides a very simple way to
    get organized. All you need to know is to drag your mouse. It helps significantly
    if you have two windows open so you can see the original location of the files
    or directories you want to move, as well as their final destination. To set this
    up, click Location in the top menu and choose Open Duplicate window if you are
    moving files within one particular directory. If you are moving between directories,
    you can use the Location menu to choose a new duplicate to.


    Once you have both windows open, place your mouse over the item, hold the left
    mouse button, and still holding the button down, move your mouse to the new spot;
    the item moves across your screen to its intended destination. Once the item is
    where you want it, release the left mouse button. You are then given three options:
    Copy Here, Move Here, and Link Here. Copy Here makes a copy of the file or directory
    in the new location, but the original remains where it was. Move Here literally
    moves the item to the new location and removes it from the old location. Link
    Here is similar to Copy Here, in linking the file allows access to it from the
    new location, but the actual file remains only in its original space. The icon
    that appears in the new location is merely a link. This saves disk space because
    you are not copying a new version of the file.


    36'
  merge: -1
