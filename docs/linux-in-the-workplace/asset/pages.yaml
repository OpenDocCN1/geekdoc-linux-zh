  md: '![](img/fb7a71d55b85722293f8087c0b352fcc_52_0.png)


    Figure 3.28: File Properties


    # # Changing Permissions


    The other tab on the Properties screen (see the previous section) is Permissions.
    Clicking this tab allows you to see who has type of permissions for this particular
    file. File permissions determine who can do what to a file. There are three types
    of permissions: read, write, and execute. Read allows a file to be viewed, but
    not altered; write allows alteration; and execute allows use of file if it is
    a program.


    Each file has three classes of permissions: owner (user), group, and others. The
    members of the group are set by the system administrator. The default group is
    the group you belong to. For example, many companies'' groups might be set by
    department—everyone in Accounting in the same group. Others is everyone else and
    is sometimes referred to as world.


    If you create a file, you are the file owner and can set the permissions for the
    other categories. Place an X in a box for the permissions you want to allow. You
    are probably able to change permissions only within your home directory. If you
    are unable to access a file you need because of a permissions problem, see your
    system administrator.


    For further information on permissions, see the “File Attributes and Permissions”
    section in Chapter 13.


