    # Appearance


    The Appearance section allows you to set default information about how fonts are
    displayed in Konqueror. The size of the font is defined by a number, and the style
    of the font is defined by its name. The Font Size section of Appearance is not
    an absolute setting for your system; it is relative and depends on the specifications
    of the sites you visit. This means that if you choose Medium, the size displayed
    will be whatever the website tells your browser to display; it simply takes the
    website''s font as is. Experiment with different fonts to find something that
    allows you to view pages comfortably.


    ![](img/fb7a71d55b85722293f8087c0b352fcc_225_0.png)


