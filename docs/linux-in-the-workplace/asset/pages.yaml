  md: '# Chapter 13: Using the Command Line


    # Overview


    Some might ask, Why would I want to use the command line? The best answer is that
    it can save you a lot of time, particularly if you are doing repetitive tasks.
    For example, sophisticated editing can be performed in vi or Emacs with many fewer
    keystrokes than performing the same task using a mouse–based GUI editor. And for
    repetitive editing, programs such as sed can automate the task for you, as awk
    for report generation.


    Before we scare you away, you can be a successful user of your KDE environment
    without ever seeing the command line. If you spend most of your time in an office
    suite, such as OpenOffice, or running a custom application, you can skip this
    chapter confidently and get on your life with KDE.


    If, on the other hand, you need the power of the command line, KDE offers a lot
    of advantages:


    +   * Support for multiple terminal windows on one graphical screen.

    * Selection of various screen and character sizes.

    * Session management, including the ability to send signals.

    * Emulation of different terminal types and support for various character sets.


    # Terminal Windows


    To enter commands you must open a terminal window. This is a program that brings
    up a text-based window and starts a command interpreter (called a shell). She
    says“The Shell” later in this chapter.


    The easiest way to start a terminal window is to click on the terminal icon on
    the KDE panel.


    ![](img/fb7a71d55b85722293f8087c0b352fcc_288_0.png)


    Figure 13.1: Terminal Icon

    an alternate way of starting a terminal window is by pressing ALT–F2 to bring
    up a Run dialog box and entering the name of a terminal application, such as Konsole
    or xterm.


    Tip With the combination of mulle desktops, which you learned about Chapters 2
    and


    Tip 11, and terminal windows can have ten or even hundreds of shells running.
    This could prove to be very useful if you need to monitor remote systems.


    # Konsole


    The default terminal application in KDE is Konsole. Another common terminal application
    is xterm. By default, the icon will bring up Konsole.'
  merge: -1
  pgno: 288
- img_proc: true
  md: '![](img/fb7a71d55b85722293f8087c0b352fcc_289_0.png)


