    10.5: Changing the Home Page

    The process for changing your home page is a simple one that can be done at any
    time. Select the Settings dialog box will pop up, and in the middle of the window,
    you will see a choose Configure Konqueror and a field titled Home URL. The default
    is ~, which is how your computer thinks of your home directory. To change your
    home page, type the new URL, remembering to use the http:// in the Home URL field,
    and click OK. If you ever want to change back to the default, you can click Use
    Default or type ~ in the Home URL field and click OK.


    # Using Bookmarks


    If you are familiar with the idea of bookmarks from other web browsers, skip to
    the next section to learn how to import your bookmarks you might have already.


    Like their real-world counterparts, Konqueror bookmarks are placeholders, allowing
    you to access pages rapidly without having to remember the URLs. Using the Bookmarks
    menu, you can add and edit bookmarks at will and store them within folders, or
    submenus, and move them around as suit you. Bookmarks were designed with ease
    of use in mind, and you will find that they can be great time-savers. While you
    can access your bookmarks through Konqueror''s Bookmarks menu, you''ll find to
    access your bookmarks directly on the desktop. We''ll get to the bookmark toolbar
    shortly.


    # Creating Bookmarks


    Before you do any fancy thing with your bookmarks, you must actually have some.
    Think of a web page you visit often (or would, if you could remember the URL),
    and go to it. For example, if you have an interest in space exploration, you might
    go to http://www.jpl.nasa.gov/ which is a NASA web page on the subject.'
