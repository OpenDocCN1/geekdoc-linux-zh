  md: '![](img/fb7a71d55b85722293f8087c0b352fcc_290_0.png)


    The Edit menu allows you to send a signal to the current terminal and to rename
    a terminal session. Send Signal allows you to send an asynchronous event to the
    program running in your current terminal window. Signals and signal handling are
    advanced topics, most of which are beyond the scope of this book. A simple example,
    however, is the hangup signal. If you were connected remotely to a computer system
    and the connection was dropped (by a callwaiting interrupt on a phone line, for
    example), the programs you were running would be sent a hangup signal. The programs
    then have the option of deciding what they want to do with this signal.


    You can use the Rename session menu to change the names of your terminal windows.
    By default, they are labeled as Terminal or Shell and are numbered sequentially.
    Changing the name can make it a lot easier to remember which window does what.


    Tip Some distributions include a command—line command, titlebar, or xttitle, that
    allows you to change any terminal window title; simply type titlebar or xttitle
    followed by a space and whatever you would like to name the terminal.


    The Settings menu allows you to configure the terminal window.'
  merge: -1
  pgno: 290
- img_proc: true
  md: '![](img/fb7a71d55b85722293f8087c0b352fcc_291_0.png)


    Figure 13.4: Konsole with Settings Menu


    The Schema configuration options let you set a combination of foreground and background
    colors, sizes, and fonts. Size allows you to change the number of columns and
    lines in the window, and font allow you to change the size of the characters within
    the window.


    The Show options allow you to turn on and off the various types of ancillary information
    around the outside of the window itself. You can turn the bottom menubar, the
    top toolbar, and the frame border on and off. Don''t panic if you turn off the
    toolbar. You can also call up the Settings by right-clicking your mouse when the
    cursor is within the terminal window.


    These settings are only for the current session within Konsole. If you want them
    to affect future invocations, use the Save Settings button.


    The Help menu gives information about Konsole or, or by selecting Contents, lets
    you search the online manual.


    xterm


    A second type of terminal window is xterm. It can be started by entering xterm


    in a Run Command box. You should know about xterm only because there may be cases
    where Konsole is not recognized by a remote system. This can happen if the remote
    system was, for example, a mainframe running something other than Linux. Generally,
    Konsole is a better choice and has more capabilities.


    # # The Shell


    The shell is the program that interprets the commands you enter and invokes the
    appropriate programs to perform the requested tasks. In other words, the shell
    performs some basic functions that make it easier for you to communicate with
    programs. These functions include:


    +   * Command-line editing: enables you to backspace and edit within the line
    you are entering.'
  merge: -1
  pgno: 291
- img_proc: true
  md: '• Job control: allows you to control (start, stop, terminate) multiple programs
    from one shell invocation

    • Control of input and output files: normally a program receives input from your
    keyboard and sends output to your screen. The shell gives you the ability to change
    the location of these data files to other programs or files on your computer system.

    • Command history: lets you call up, edit, and execute previously entered commands.


    # Shell Choices


    Linux systems come with a choice of shells. Each has its advantages and disadvantages.
    For example, some programmers find the editing features of csh (called the C shell)
    to be very appealing. See the compact size of ash as an important consideration,
    and for some, the standardized nature of ksh (called the Korn shell) easily their
    transition between Linux systems and other UNIX platforms.


    The most popular among Linux users is Bash, which stands for Bourne Again Shell.
    The name comes from UNIX history. The first shell offered its programming language—that
    is, the ability to make control decisions within a saved set of commands based
    on conditions that could be tested—was written by Steven Bourne of, at the time,
    AT&T. Bash took these capabilities and expanded them over the years.


    Learning all there is to know about shell is easily the subject for a whole book.
    For the purposes of this chapter, we will use Bash as our shell. Most of the information
    presented, however, applies to virtually all shells.


    > Tip The tcsh, an enhanced clone of csh from UC Berkeley, is available for those
    who are familiar with csh and want to use its advanced history and scripting features.


    # Shell Prompt


    The character string that the shell displays when it is ready to accept your command
    input is called the shell prompt. This prompt can be configured to be as simple
    as a single character or it can be generated dynamically each time.


    The default shell prompt is typically a combination of useful information about
    the current environment. As /KDE~, this prompt reads


    ```

    fyl@nicaragua:~/KDE/Command >

    ```


    This string offers three pieces of device information:


    +   • fyl is your user name.

    • nicaragua is the name of this computer.

    • ~/KDE/Command is the name of your current directory. Note that ~ is shorthand
    for your home directory.


    Occasionally you may see a single > character when you are expecting your usual
    shell prompt or the prompt from an applications program. The >


    character is the default shell prompt and means the shell is expecting more input
    from you. Most commonly, this situation occurs when you have typed one quotation
    mark and the shell is expecting you to type a matching quotation mark. The quickest
    way out of this problem is to press'
