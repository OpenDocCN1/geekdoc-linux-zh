  md: '# Window Decoration


    The Window Decoration module allows you to select preconfigured styles for the
    borders of your Windows. This mainly changes your widgets and the color of window
    borders.


    ![](img/fb7a71d55b85722293f8087c0b352fcc_262_0.png)


    Figure 11.35: Window Decoration


    # Network


    The Network module contains several items for the configuration of the system
    itself. Most of these areas are best left to your system administrator and are
    beyond the scope of this book. However, a few of them pertain to general user
    configuration, like email and news ticker.


    # Email


    This module is simply for entering the user''s basic email information and sending
    bug reports to KDE.'
  merge: -1
  pgno: 262
- img_proc: true
  md: '![](img/fb7a71d55b85722293f8087c0b352fcc_263_0.png)


    # # News Ticker


    In the News Ticker section, you can change the settings for the news ticker. By
    default, knewsticker gathers news information from Linux news sites, such as Slashdot,
    Freshmeat, and Linux Weekly News, but it can be set to any news site you like.
    On the General tab, you can determine frequency of news search, scrolling speed,
    font, and color.


