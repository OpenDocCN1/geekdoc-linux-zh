- img_proc: true
  md: "The more program and its more capable cousin are very handy. To find out about\
    \ additional capabilities, enter ? at the prompt.\n\nWith pipes we connect two\
    \ programs together. With redirection we can tell a program to read either input\
    \ from a file or write output to a file. To redirect stdout to a new file, use\
    \ the character > Going back to the previous example, we could get the ls command\
    \ to write its output to the file.output by entering the following command:\n\n\
    ```\nls /bin > ls.output\n```\n\nAs with pipes, the spaces around the redirection\
    \ character are optional. Now that we have this information in a file, the next\
    \ trick is actually reading it. All we need to do is use the more command again\
    \ and redirect its input (stdin) from the file we created. The input operator\
    \ is < , so we enter:\n\n```\nmore < ls.output\n```\n\nThe operation of more is\
    \ virtually identical to the way it was before—that is, the shell handling, and\
    \ here it handles redirection. The more program itself knows nothing of the actual\
    \ source of the data. Contrast this with ls.output where more itself opens the\
    \ file.\n\nBesides these two forms of redirection, there are others. The following\
    \ table lists other forms of redirection.\n\n| Character | What It Does |\n| ---\
    \ | --- |\n| > | Redirects output (stdout) of the command to the specified file.\
    \ |\n >> | Similar to > will append to a file if it already exists. |\n 2> | Redirects\
    \ the error output (stderr) of the command to the specified file. |\n < | Redirects\
    \ the input of the command (stdin) from the specified file. |\n | | Joins two\
    \ commands. Output (stdout) of the command on the left is sent to the input (stdin)\
    \ of the command on the right. |\n\n# Command-Line Format\n\nThe previous section\
    \ introduced some basic command-line formats. Now it's time to see how command\
    \ lines really work.\n\n+   - Command lines are made up of words.\n- Words are\
    \ separated by whitespace, which is defined as one or more spaces or tabs, or\
    \ a combination thereof.\n- The first word of the line is the command itself.\
    \ This is the program you are asking the shell to run. It could be a binary program,\
    \ an alias, or a script to be interpreted by the shell, or one of the many other\
    \ interpreted languages, such as awk or Python.\n- The remaining words on the\
    \ command line are called arguments."
