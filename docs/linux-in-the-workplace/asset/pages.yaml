  md: '# # Chapter 5: The Open Office Suite


    #  Overview


    This chapter gets you running with OpenOffice so you can perform standard tasks
    such as building a spreadsheet, making a chart, or writing and formatting a document.
    And the following chapter introduce you to tools suited for the office. While
    there are certainly more office applications available for Linux, we cover only
    those sufficiently advanced in development to give you confidence of use.


    A vast array of office applications, both commercial and free, is available for
    Linux. A group of applications presented in a similar fashion which comes bundled
    together is often called a *suite*. The office suites that with a price include
    Anyware Desktop, OpenOffice (http://www.vistasource.com); Corel''s WordPerfect
    (http://www.wordperfect.com); and Sun Systems'' StarOffice (http://www.sun.com/software/staroffice/).


    We feature some of those without a price in this and the following chapter: OpenOffice,
    KOOffice, KWrite, and AbiWord. StarOffice 5.2 was formerly a free offering. With
    the release of version 6.0, Sun has begun charging a moderate price for StarOffice
    (both versions) but has continued to offer OpenOffice (http://www.openoffice.org/)
    at no cost. It is included on many Linux distributions, keeping in mind that free
    product in the Linux world does not translate into an inferior product. In fact,
    at SSC we have Sun''s StarOffice as our default office suite for many years and
    are now beginning to use OpenOffice.


    Most of the differences between OpenOffice and StarOffice can be accounted for
    by the fact that StarOffice pays to license, and therefore these elements are
    not included in OpenOffice. These include fonts (such as Asian language fonts),
    database support, templates, and certain clip art images. StarOffice also offers
    manuals and support, while OpenOffice does not. OpenOffice does, however, boast
    a rather comprehensive list of topics on the Help menu.


    ![](img/fb7a71d55b85722293f8087c0b352fcc_82_0.png)'
  merge: -1
  pgno: 82
- img_proc: true
  md: "Figure 5.1: OpenOffice Help\nThose who rely on document templates miss them\
    \ in OpenOffice. This is a feature that will\nprobably be added to future versions,\
    \ but if you can't do without it, we recommend purchasing\nStarOffice, as it comes\
    \ with a large variety of document templates.\n\n# # Introduction to OpenOffice\n\
    \nOpenOffice is a feature–rich productivity suite distributed and maintained by\
    \ Sun\nMicrosystems. Comparable to Microsoft Office, OpenOffice includes a word\
    \ processor, a\nspreadsheet application, presentation software, and graphic program\
    \ applications. OpenOffice is\nincredibly powerful–many believe that not only\
    \ is it as good as MS Office, but also better in\nways. OpenOffice is available\
    \ for other platforms as well, including Solaris and Microsoft Windows,\n runs\
    \ equally well on all of them.\n\nOpenOffice offers the ability to import many\
    \ types of documents and templates from a\nvariety of other programs, including\
    \ Microsoft Word. It can also export to a wide range of formats,\nincluding HTML,\
    \ PDF, and MS Office XP.\n\nOpenOffice may be included on your distribution already.\
    \ If it is not, simply visit\nhttp://www.openoffice.org/ There you can download\
    \ the latest version for free. This site also\ncontains a list of distributors\
    \ who sell CD–ROMs that install the software.\n\n**Tip** The users@openoffice.org\
