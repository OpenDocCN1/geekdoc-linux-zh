  md: "# # Chapter 1: Learning About the Pieces\n\nLinux is said to be a “free” operating\
    \ system (OS). This chapter explains exactly what means\n how it affects the way\
    \ Linux is distributed. It also provides an introduction to the KDE desktop,\n\
    \ relation to Linux, and some of the more popular office– software used on Linux.\n\
    \n# ## What Is Linux?\n\nLinux is a computer operating system, the most important\
    \ program your computer runs. It controls\n all of the programs that run on your\
    \ computer by allocating resources, interpreting instructions\n(by using your\
    \ mouse and keyboard), sending output to the monitor, keeping track of all files,\
    \ and\nperforming many other important tasks.\n\nLinux is different from most\
    \ operating systems in that it has been developed by scores of\nprogrammers around\
    \ the world. Linux is free, both in the sense that you don’t have to pay for it\n\
    (though you can, and many people do) and in the sense that the source code (internal\
    \ pieces) are\navailable to anyone who wants to look at or modify it. Its source\
    \ code “open” makes it\npossible for anyone to try Linux, find bugs, and submit\
    \ fixes that go to a central control point\nbefore making their way into future\
    \ versions of Linux.\n\nThe kernel is Linux’s central nervous system; it is the\
    \ operating system that runs the whole\ncomputer. Though some advanced Linux users\
    \ make modifications to the kernel on theirs,\nprobably won’t have anything to\
    \ do with it. However, you should know that this is the core\nof computer’s system\
    \ and that it is under constant development.\n\nBecause so many developers work\
    \ on Linux, the pace of Linux development is quick, and problems\nare usually\
    \ found and addressed rapidly.\n\n# ## The Roots of Linux\n\nLinux’s lineage goes\
    \ back to UNIX, the most proven operating system in the world in that (and its\n\
    variants) have been the most used networked computer OS for over three decades.\
    \ UNIX was\ndeveloped at Bell Telephone Laboratories and designed to support many\
    \ users working at many\ncomputers at one time, all linked together sharing information\
    \ and resources. When using\nan operating system, more than one person can use\
    \ a single computer’s hardware to do\nthings at once, and a single user can do\
    \ more than one (multitask) on a single machine as\nwell. This makes for more\
    \ effective use of resources and a more powerful system.\n\nLinux runs on a variety\
    \ of platforms, including x86, PowerPC, DEC Alpha, Sun Sparc, and ARM, so\n matter\
    \ what type of computer hardware you have, Linux will probably run on it. Linux\
    \ aims for\nPOSIX (Portable Operating System Interface for UNIX) compl. POSIX\
    \ is a set of standards\nthat defines an interface between programs and operating\
    \ systems. By sticking to these standards,\nsoftware developers can be reasonably\
    \ confident that their programs can be ported easily to any\nPOSIX– compliant\
    \ operating systems, such as the various versions of UNIX. This means Linux\n\
    users can take advantage of software made for general UNIX systems."
  merge: -1
