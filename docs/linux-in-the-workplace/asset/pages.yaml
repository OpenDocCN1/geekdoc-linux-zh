    and feature set limitations. Because faxing is an important office task, brief
    descriptions of the programs available under KDE are offered in this section.
    Faxing from your computer is one area, however, where you definitely want to seek
    guidance from a system administrator, because phone lines and, more often than
    not,'
  merge: -1
