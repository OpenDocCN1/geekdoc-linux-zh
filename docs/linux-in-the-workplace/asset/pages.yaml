    remember that the i icon changes to reflect the active pattern.


    ![](img/fb7a71d55b85722293f8087c0b352fcc_152_0.png)


    Figure 8.5: Pattern Menu

    Likewise, the rectangular box on the bottom shows the current gradient, and clicking
