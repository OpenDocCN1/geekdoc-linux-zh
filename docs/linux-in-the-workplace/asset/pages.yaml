- img_proc: true
  md: '![](img/fb7a71d55b85722293f8087c0b352fcc_90_0.png)


    Figure 5.9: Paragraph Dialog Box


    # Inserting Graphics into Your Document


    From the Insert menu, select Graphics and add then File. The Insert Graphics dialog
    box appears.


    ![](img/fb7a71d55b85722293f8087c0b352fcc_90_1.png)


    Figure 5.10: Insert Graphics Dialog Box


    Select the graphics filename just as you selected an existing document file. Once
    your graphic appears in the document, you can double- click it at any time to
    pull up the Graphics dialog box. Here you can crop, make the image a hyperlink,
    or add a border. Once you have selected the options you want, click OK to proceed
    with the changes or Cancel to cancel any changes.'
  merge: -1
  pgno: 90
- img_proc: true
  md: '![](img/fb7a71d55b85722293f8087c0b352fcc_91_0.png)


    Figure 5.11: Graphics Dialog Box


    **Tip** You can move your graphic by simply clicking and dragging the image anywhere
    within the document.


    ![](img/fb7a71d55b85722293f8087c0b352fcc_91_1.png)


    Figure 5.12: Inserting and Moving Your Graphic


    To delete the graphic, simply select it with the mouse and select the cut icon,
    or right– click the image and select Cut from the pull– down menu.


    # ## Saving Your Document


    To save your document, select the floppy disk (save) icon from the top toolbar
    or select the Save or Save As options located on the File menu. The Save dialog
    box appears, instructing you to name'
  merge: -1
  pgno: 91
- img_proc: true
  md: 'your file (if it is not already named), designate the directory to which you
    want to save the file, and choose the file format you want your document to be
    saved as (click the arrow next to File to save a list of file format options).
    This is where you can prepare your document for exporting, as mentioned previously.


    Tip To save your document as a PostScript file, select Print from the File • Print
    menu. Save the file with a .ps extension. Keep in mind if you save a document
    in this format, it cannot be re-edited, so you should save a copy in a standard
    document format as well.


    # Creating Document Templates


    Although the current version of OpenOffice does not come with existing document
    templates, it is possible to create templates. Start by opening a new document.
    Create a set of styles and give it the desired structure, and simply save the
    document as a template for the Save As dialog box.


    # Printing Your Document


    Printing your document is easy. Simply select the print icon from the toolbar
    immediately below the menubar, or select Print from the File menu. In either case,
    a Print dialog box opens, giving you the option to print to your printer or to
    a file. Options are presented in a range of pages, if you don''t need the whole
    document, or to print multiple copies.


    +   * Tip You have more print options if you select Print from the File menu.
    The Printer toolbar icons print according to the defaults.


    ![](img/fb7a71d55b85722293f8087c0b352fcc_92_0.png)


    Figure 5.13: Print Dialog Box


    # OpenOffice Calc: Spreadsheets


    OpenOffice Calc is a powerful spreadsheet program that also imports and exports
    other popular formats, including MS Excel. Spreadsheets are large tables where
    information is entered in individual cells that appear in rows and columns. They''re
    ideal for accounting purposes and for creating data comparisons.'
  merge: -1
  pgno: 92
- img_proc: true
  md: '![](img/fb7a71d55b85722293f8087c0b352fcc_93_0.png)


    Figure 5.14: OpenOffice Calc


    It is easy to enter data and formulas in OpenOffice Calc to create charts from
    that information.


    To launch Openoffice Calc select Calc from the OpenOffice submenu in the K menu.


    > Tip For advanced users, OpenOffice Basic offers the opportunity to automate
    some of the processes with macros. Select Macro from the Tools menu, or see the
    Basic IDE entry in the OpenOffice Help.


    # Creating a New Spreadsheet


    When you launch OpenOffice Calc, you are dropped into a new spreadsheet automatically,
    and you can begin entering data. Or you can open an existing spreadsheet (New
    • Open) to begin working.


    A spreadsheet contains cells organized in rows and columns. To begin entering
    data into your spreadsheet, simply click in a cell. A black outline appears around
    the selected cell. Enter data, either text or numbers. When you are finished,
    simply click in another cell or press ENTER on the keyboard. You can also use
    the arrow keys or the TAB key to move to the next cell. This process is much like
    entering data into a word processor except that, in this case, each piece of data
    is entered into one cell at a time.'
  merge: -1
  pgno: 93
- img_proc: true
  md: '![](img/fb7a71d55b85722293f8087c0b352fcc_94_0.png)


    Figure 5.15: Entering Data into Your Spreadsheet


    > **Tip** To highlight a table area, click the upper left of the desired area
    and hold down the mouse button. Then drag the mouse pointer to the bottom right
    cell and release.


    # # Deleting or Moving Data


    Since your spreadsheet is likely structured with formulas, deleting or moving
    data can be a bit more complex than it is in a word processor.


    To delete in an individual cell, simply use the BACKSPACE key to delete each character
    or number desired. To move data in one cell, right–click within the cell. Select
    Cut or Copy, depending on which action you want. In the new cell, right–click
    again, but by this select Paste.


    You can also delete or move all data contained in a row or column. Use the Delete
    Cells option on the Edit menu, or simply right–click on the data and select Delete
    from the menu that pops up. This option allows you to specify what should happen
    to the deleted row—for instance, move rows up or shift columns.


    ![](img/fb7a71d55b85722293f8087c0b352fcc_94_1.png)


    Figure 5.16: Delete Cells Dialog Box


    87'
  merge: -1
  pgno: 94
- img_proc: true
  md: '# Changing Heights and Widths


    The cells in a spreadsheet are fairly small, but the size can be changed to accommodate
    larger entries and make data more readable on printouts. There are two ways to
    accomplish size changes. The first is to place the mouse cursor over the separating
    rows and columns in the guides (the lettered boxes at the top of the spreadsheet
    for columns, and the numbered ones on the left side for rows). For instance, if
    you want column A to be wider, position the mouse pointer over the borderline
    between the column A guide and the column B guide. When the pointer changes to
    a double-headed arrow, click and drag to the left or right to shorten or lengthen
    the column. For rows, it is the same procedure except you move the double-headed
    arrow up and down to shorten or heighten the rows.


    A second way to change cell sizes is more precise, that it allows you to select
    measured increments. From the Format menu, select Cell, Row, or Column. In the
    resulting submenu, choose the first entry (Column Width or Row Height). Here you
    can enter a specific size in inches.


    # Using Formulas and Functions


    Formulas and functions perform mathematical calculations automatically before
    displaying numbers within a cell. A formula always begins with an equal sign (=)
    and is created alphanumeric combinations. Each cell has a grid address. The cell
    in column A, row 1 is referred to as A1; the cell in column B, row 6 is referred
    to as B6, and so on.


    Formulas can be written to add, subtract, multiply, and divide. To write a formula,
    start by typing an equal sign (=) within a cell. This tells Calc that you want
    to perform a calculation. Then type the formula, for example, type=A9+A10+A11.
    Press ENTER when the formula is complete. Calc performs the calculations. In this
    case, it adds the numbers in the given cell and displays the results in the cell
    which you entered the formula.


    A function is a predefined function that performs calculations by using specific
    values in a certain order. A function begins with the function name, followed
    by an opening parenthesis, the specific values (often referred to as the argument)
    for the function, separated by a colon; and ending with a closing parenthesis.
    Again, the function must be preceded by an equal sign. For example, typing=SUM(A9:A12)
    into a cell and pressing ENTER yields the sum of the values in A9 and A12 into
    that cell. Hundreds of functions are available in a variety of categories (logical,
    financial, and mathematical, for instance. Select Function from the Insert menu
    for a complete list of available functions.


    # Formatting Your Spreadsheet


    Formatting a spreadsheet is like formatting a document. The same capabilities
    are available, such as features to alter fonts and font size, and to add color
    to some or all of the background. Refer to "Formatting Your Document" earlier
    in this chapter for details.


    When formatting a spreadsheet, you can easily format a single cell or a background
    color to all cells in column D. To do so, highlight a group of cells by clicking
    the uppermost cell of the desired area and holding the mouse button. Then drag
    the mouse pointer to the bottom cell and release. Now click the Background icon,
    select your color of choice—and voila!'
  merge: -1
  pgno: 95
- img_proc: true
  md: '![](img/fb7a71d55b85722293f8087c0b352fcc_96_0.png)


    > **Tip** You can make a row freeze so that it remains visible when you scroll
    down the window. Click the button of the last row you want to remain visible,
    and then select Freeze from the Window menu.


    # Making a Chart


    It''s easy to convert data from a spreadsheet into a chart. To begin, open an
    existing spreadsheet. Highlight the group of rows, columns, and headings from
    which you want to build the chart. Select Object from the Insert menu, and then
    OLE Object from the resulting submenu. The Insert OLE dialog box appears.


    ![](img/fb7a71d55b85722293f8087c0b352fcc_96_1.png)


    Select Create new, then Chart. Click OK. Your chart appears.'
