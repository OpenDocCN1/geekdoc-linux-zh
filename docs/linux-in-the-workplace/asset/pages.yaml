  md: '# # Chapter 9: Communication: Working with Email, Usenet News, and Faxes


    Using the computer on your desk, you can communicate with people inside your office
    and around the world. Email, short for electronic mail, is the transmission of
    messages over a communications network. The messages can be anything from a quick
    note to a business plan, complete with supporting files (graphics, documents,
    and so on). Correlated with email are newsgroups and Usenet, a worldwide distributed
    system similar to the Internet, which discussion groups (newsgroups) are classified
    hierarchically by subject. In this chapter, we discuss KMail, the KDE email application,
    as well as how you can use Usenet groups. In addition, a few faxing applications
    are discussed, offering you one more way to communicate with the world from your
    your.


    # KMail


    The KDE mail client, KMail, is a user-friendly, graphically oriented email program.
    You can use it to send and receive messages, as well as sort and organize them.
    KMail aims to provide an intuitive interface, so the functions you need are easy
    to find and implement. To access the comprehensive documentation included with
    KMail, select Contents in the Help menu, and you will see a hyperlinked document
    in Konqueror, open to the table of contents.


    You can learn KMail from K menu • Internet • KMail.


    > If KMail is not an icon on your panel, simply click it to start. (See Chapter
    11 to learn how to build icons.)


    ![](img/fb7a71d55b85722293f8087c0b352fcc_167_0.png)


    Figure 9.1: Launching KMail


    Your inbox may have been initialized already by the system administrator, with
    the settings entered for your personal account and access information. If it hasn''t,
    you will need to set it up yourself (we''ll'
  merge: -1
  pgno: 167
- img_proc: true
  md: 'get to that proceed in a second). Until the inbox is initialized, the Mail
    Reader window (the main window of KMail will open, but it won''t show any messages,
    and you will be asked to complete the configuration.


    # KMail


    ![](img/fb7a71d55b85722293f8087c0b352fcc_168_0.png)


    Welcome to KMail 1.4

    KMail is the email client for the K Desktop Environment. It is designed to be
    fully compatible with Internet mailing standards including MIME, SMTP, POP3 and
    IMAP.

    * KMail has many powerful features which are described in the documentation.

    * The Mail message handler offers better information about new versions of KMail.

    Some of the new features of this release of KMail include (compared to KMail 1.3),
    which is part of KDE 2.2.


    +   * Maildir support

    * Distribution lists

    * SMTP administration

    * SMTP over SSL/TLS

    * Polling for POP3 (faster download on slow responding networks)


    Figure 9.2: The KMail Window


    # Configuring KMail


    To configure your mailbox, select Configuration from the Settings menu.


    | Show Toolbar |

    | Show Statusbar |

    | Configure Shortcuts...

    | Configure Toolbars...

    | Configure KMail...

    | Configure Filters...

    | Configure Pop Filters... |


    Figure 9.3: Configuring KMail


    Enter your personal information and mail settings by selecting them from the menu
    panel on the left side of the KMail Configuration window.


    +   * Identity: who you are.

    * Network: Internet setup.

    * Appearance: fonts, colors, layouts, profiles, and address book.

    * Composer: defaults for creating messages.

    * Security: GNU Privacy Guard (GPG) encryption settings.

    * Miscellaneous: other message and mailbox preferences.'
  merge: -1
  pgno: 168
- img_proc: true
  md: '# Identity


    The Identity tab is where information about you is stored. You must fill in your
    full name and your email address. Optionally, you can set the organization name
    and a reply–to address, as well as a signature.


    ![](img/fb7a71d55b85722293f8087c0b352fcc_169_0.png)


    Figure 9.4: Configuring Identity


    > Tip A signature is appended to messages you send and may contain alternate contact
    information or some other descriptive information.


    If you want to access more than one email account with KMail, you will need to
    set up multiple identities, one for each account. Fill in the default identity
    with information for the account you use most often; create additional identities
    by clicking the New button. You can also use the Rename and Remove tabs for existing
    identities.


    # Network


    Next, select the Network tab, and specify the technical details of mail transfer
    necessary to send and receive mail. Most likely, this will already be set for
    your machine by the system administrator. If it''s not, your system administrator
    will provide you with this information and advise you which options to select.'
  merge: -1
  pgno: 169
- img_proc: true
  md: '![](img/fb7a71d55b85722293f8087c0b352fcc_170_0.png)


    On the Sending tab, specify the protocol for sending mail that you have given.
    A protocol is the agreed-upon format for transmitting data between two devices.
    In this case, it''s the method the computer uses to send and receive email. On
    the Sending tab, add an account for incoming mail. Click the Add button to bring
    up a window where you can enter the type of account you will have. Local Mailbox,
    POP3, Sendmail, SMTP, and IMAP are some possibilities. These protocols are determined
    by your network administrators or your ISP, so consult them to find out what to
    select. Click OK and fill in the account details. With this complete, you should
    be able to view your inbox and get started sending and receiving mail.


    Tip If your system administrator set a value for Enable Interval Mail Checking
    (on the Add Account protocol screen) and filled in a value, don''t reduce this
    value to get your mail more quickly. If everyone does this, the entire network
    slows to to a crawl.


    # Appearance


    The Appearance configuration has several sections that allow you to customize
    the KMail presents the mail reader window, folders, headers, and messages.'
  merge: -1
  pgno: 170
- img_proc: true
  md: '![](img/fb7a71d55b85722293f8087c0b352fcc_171_0.png)


    Figure 9.6: Configuring Appearance

    On the Font tab, you can specify the font name, size, and style (regular, bold,
    italic, or bold italic) that will be used for the folder list, message body, message
    list, and three levels of quoted text. Select the type of text you want to customize
    from the list, and choose the font, size, and style.


    On the Color tab, you can select custom colors for the background and all the
    types of text for which you can configure the font, as well as the color of new
    messages, unread messages, URLs, and followed URLs. Just double– click the item
    you want to change, and a window pops up where you can select a new color. Select
    Chapter 11 for a full discussion of how to select colors on the desktop.


    **Tip** Make sure your background color differs from every other color choice
    you make. If blue text is printed against a blue background, it is effectively
    invisible.'
  merge: -1
  pgno: 171
- img_proc: true
  md: '![](img/fb7a71d55b85722293f8087c0b352fcc_172_0.png)


    Figure 9.7: Specifying KMail Layout


    On the Layout tab, you can check off options that configure additional presentation
    possibilities. The folder list normally appears in two–three of the Message browser
    window, but you can choose Show long folder list, so that it displays from the
    top all the way to the bottom of the browser window. Other options allow you to
    display message sizes in the message header frame or enable threading in the list
    of message headers. *Threads* are visual cues to the order in which messages were
    answered, clarifying the sequence of events.


    The Profiles tab allows you to pick a style for the overall visual appearance
    of KMail. The High Contrast option, for instance, is for the visually impaired.


    # Composer


    The Composer configuration allows you to write your own default response texts.
    When you reply to a message, the quoted message body is preceded by a short description,
    as "On 12 January 2002, you wrote:" You can change these phrases from the Phrases
    tab. Simply enter the correct code for the message you want to use from a list
    that appears at the top of the Phrases section. The general phrase will pick up
    the specific bits of information from each message you reply for. For example,
    if you select your message, "On %D, the evermering %F told me:" this will become,
    "On Friday 24 May 2002 06:00, the ever– charming Pete Doe told me:" in your actual
    reply to Pete.'
  merge: -1
  pgno: 172
- img_proc: true
  md: '![](img/fb7a71d55b85722293f8087c0b352fcc_173_0.png)


    Figure 9.8: Composer Options

    Composer options also allow you to use smart quotes, append your signature to
    each message you, send your messages with GPG, and wordwrap line ends.


    > > Tip Smart quotes are not standard ASCII characters and may look funny on other
    people''s mail programs. Save them for desktop publishing.


    From the MIME Headers tab, you can set up custom MIME message header tags for
    the outgoing email. You can invent new headers with informational content or overwrite
    the headers that KMail creates, a feature that may be useful for advanced users.


    # Security


    In the Security configuration panel, you can select the appropriate settings for
    encrypting your email, so that it cannot be read in transit from your system to
    the recipient''s, or by anyone else who has access to your email account. Email
    sent through the Internet is either encrypted (encoded) or in clear text (as you
    wrote it). If it''s clear text and your message is intercepted, the content is
    available to any reader.'
  merge: -1
  pgno: 173
- img_proc: true
  md: '![](img/fb7a71d55b85722293f8087c0b352fcc_174_0.png)


    Figure 9.9: Security Settings


    One type of encryption is called GNU Privacy Guard (GPG). KMail will invoke GPG
    for you with one click on the Security options window; it''s an option under Select
    encryption tool to use. If you select GPG and receive a GPG–encrypted message,
    you will be able to decrypt and view it right inside KMail. Once you have set
    up GPG, you will find it a useful and easy–to–use tool. If you want to encrypt
    an outgoing message, all you have to do is click the lock button on the Composer
    window toolbar.'
  merge: -1
  pgno: 174
- img_proc: true
  md: '![](img/fb7a71d55b85722293f8087c0b352fcc_175_0.png)


    Figure 9.10: Selecting GPG Encryption

    Setting up GPG and encryption keys is beyond the scope of this chapter and definitely
    a procedure recommended for advanced users. For a brief description of how to
    set up GPG and encryption keys on your system—with system administrator approval
    of course—see Appendix C.


    # Miscellaneous


    The last configuration screen is for miscellaneous KMail configuration options.'
  merge: -1
  pgno: 175
- img_proc: true
  md: '![](img/fb7a71d55b85722293f8087c0b352fcc_176_0.png)


    Figure 9.11: Other Settings


    Click the appropriate check box if you want to see a confirmation message before
    folders are emptied, have the trash emptied when you exit the program, and so
    on.


    After you set your network configuration, you should send a test message to yourself
    (see the “Sending Email” section of this chapter to learn how). If you do not
    receive your test message, check your configuration options or contact your network
    administrator.


    # Using KMail


    Now that KMail is set up, you''ll be able to receive and send messages, begin
    an address book, and perform lots of useful tasks. Each time KMail launches, it
    opens the Mail Client window, in which you will see menu headings, a toolbar,
    and three frames (also called panes). The upper left frame lists your current
    mailbox folders, and the upper right frame lists message headers. The lower pane
    is for the message body or content.'
  merge: -1
