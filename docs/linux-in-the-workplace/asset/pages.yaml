- img_proc: true
  md: '# How Permissions Work


    Each file has an owner, which is the user ID associated with the file. It also
    belongs to a group, which by default is set to the default group of the user who
    created the file. For example, your system might be set up that everyone in a
    department is in the same group. To share a file with a member of another group,
    you could change the group owner to the other group.


    There are a total of nine basic file permissions, divided into three groups. Those
    groups are associated with the file owner, the group it belongs in, and everyone
    else.


    Within these three groups, permission to read the file, write to the file, and
    use the file as an executable program are available. In addition, there are similar
    permissions associated with each directory.


    Note that when you create a file, you are the owner. A normal user cannot change
    ownership. If such a change is necessary, your system administrator must log on
    as root user to make the change.


    You can think of the permissions as three–digit octal number. The leftmost digit
    represents the user''s permissions. The next one represents the group''s permissions,
    and the last digit represents the permissions of everyone else.


    Within each digit, a 4 represents read permission, a 2 represents write permission,
    and a 1 represents execute permission or the ability to search for directories.
    It is only necessary to add these values for each digit in order to set the permissions.
    For example, 754 represents read, write, and execute permission for the file owner
    (7=4+2), read and execute permission for the group (5=4+1), and only read permission
    for everyone else.


    As an alternative, the permissions can be specified symbolically using a combination
    of letters (u, g, and o to represent user, group, and other, respectively, and
    r, w, and x to represent read, write, and execute permission, respectively). The
    letter is used to represent the combination of u, g, and o.


    These letters are combined using punctuation to specify the permissions. Using
    an equal (=) sets the permissions to the value, a minus (--) indicates permissions
    to be removed, and a plus (+) represents permissions to be added.


    If more than one of ownership/punctuation/permissions is required (for example,
    if you want to add group write and remove read for other), you combine the sets
    with a comma (,.). If this sounds harder than the numeric specification, it is
    there if you wish to use it.


    To use the example 754 from the preceding numeric explanation, you could specify
    these same permissions as u=rwx,g=rx,o=r.


    # chmod—Change File Permissions


    The chmod command is used to change file (and directory) permissions. Specify
    the desired permissions symbolically or numerically in octal:


    ```

    chmod [options] mode files

    ```'
