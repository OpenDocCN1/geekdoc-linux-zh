    Figure 6.12: KSpread


    # Creating a New Spreadsheet


    To create a new spreadsheet, select KSpread from the Office submenu of the K menu.
    The Choose Option dialog box opens, prompting you to open a new spreadsheet or
    an existing one. Select Open New Spreadsheet, and a blank spreadsheet will open.


    # Opening an Existing Spreadsheet


    To open an existing spreadsheet in KSpread, select Open from the File menu, or
    simply click the open icon to make the Open dialog box appear.'
  merge: -1
