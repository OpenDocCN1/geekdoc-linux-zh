- img_proc: true
  md: '# 318 Part V: The Part of Tens


    As mentioned in Chapter 9, Fedora supports many wireless cards as a client if
    you already have a wireless access point on your network. But what if you have
    an Internet connection, but no wireless access point? Well, Fedora can come to
    your rescue there as well.


    # Hello, Master!


    Every wireless network must have a WAP for remote computers to connect to. In
    wireless luogo, the WAP is called the master device — the central point where
    computers connect to interact with other devices on the wireless network. All
    network activity on the wireless network passes through the master, even if it''s
    between two computers. When you''re configuring your Fedora computer''s wireless
    card, you may come across the term managed mode. Managed mode means that your
    computer is connected to a master device over the network. This is demonstrated
    in Figure 19-1.


    ![](img/9e1543123a324def5e9e0f9e6fc0f80b_336_0.png)


    Figure 19-1: Using a master wireless device for connectivity. network client network
    client network client network packets Wireless Access Point


    There''s also ad-hoc mode — where two clients can talk directly between themselves
    without a master. However, this mode is limited to only two clients. For the purposes
    of this chapter, don''t bother trying to use this method for your access point:
    The goal here is to support multiple wireless clients.'
  merge: -1
  pgno: 336
- img_proc: true
  md: '# Chapter 19: Ten Steps to Making Your Own Wireless Access Point


    The key to creating your own wireless access point is to build a master device
    that all the computers in the house can connect to. When you purchase a commercial
    wireless access point, the manufacturer configures it to be a master, allowing
    wireless clients to connect to it. However, you don''t need a commercial access
    point for your wireless network: You can accomplish the same thing with the wireless
    network card in your PC.


    Although typical Linux setups don''t usually use them as, you can configure most
    computer wireless network cards to act as network masters. (Some don''t support
    this feature, so you may have to check your wireless card''s Web site to make
    sure.) The next sections walk you through the steps required to use your Fedora
    system as a wireless access point, using a wired connection to connect to the
    Internet.


    # Step 1: Plan Your Network


    As with any other network implementation, it pays off to plan what you want to
    do before you start. The disadvantage of wireless networks is that they are extremely
    susceptible to environmental conditions. Wireless radio waves have limited range,
    and difficulty penetrating some substances, such as walls of material, brick,
    or solid wood.


    Using a normal PC wireless network card as an access point aggravates these limitations.
    Most wireless network cards designed for PCs use a small antenna to be unobtrusive
    as possible. Although this may look nice, it doesn''t do much for wireless network
    range.


    The first part of the plan is to try to find a network card that uses a large
    antenna, or has the capability of being connected to an external antenna. You
    don''t need to use an amateur radio antenna farm, but having something larger
    than a stub sticking out the back of your PC is helpful.


    Wireless access points also share a role with real estate — location, location,
    location. Where you place your wireless access point is crucial to how well it
    will operate. Obviously; if you have a wired Internet connection, you need to
    locate your access point somewhere within reach of the Internet connection, but
    try to make that as centrally located as possible.


    After you''ve decided on your location and antenna configuration, you''re ready
    to start configuring your Fedora system.'
  merge: -1
  pgno: 337
- img_proc: true
  md: '# 320 Part V: The Part of Tens


    # # Step 2: Configure Your Network Card


    Before you can share your network connection wirelessly, you must be connected
    to the network. For this example, I''m going to assume you have a wired Internet
    connection (such as a cable or DSL modem). You must first connect your Fedora
    system to your network using a wired network card (see Chapter 9).


    Normally when you install Fedora automatically detects your network card, and
    if you are connected to a network, it also detects the network settings. Sometimes,
    you need to manually tweak things to make the card work on your network. Here''s
    a summary of the steps from Chapter 9 that are required to do that:


    +   1. From the GUI desktop, choose System:Administration:Network.


    This starts the Network configuration tool. If you''re not logged in as the root
    user you will need the root user password to continue. The Network configuration
    tool appears, it shows a list of detected network cards. Note the device name
    of the network card (usually it''s called eth0). You''ll need that information
    later in the process.


    +   2. Double-click the network card entry.


    The Ethernet Device dialog box (shown in Figure 19-2) appears, showing the current
    configuration of the network card.


    ![](img/9e1543123a324def5e9e0f9e6fc0f80b_338_0.png)


    ![](img/9e1543123a324def5e9e0f9e6fc0f80b_338_1.png)'
  merge: -1
  pgno: 338
- img_proc: true
  md: '# Chapter 19: Ten Steps to Making Your Own Wireless Access Point


    The Ethernet Device dialog box contains several settings that you can alter:


    +   - **Nickname**: Allows you to assign a different (possibly meaningful) name
    to the device rather than eth0 or eth1.


    +   - **Activate Device when Computer Start**: Allows Fedora to automatically
    activate the network card at boot up without any intervention from you.


    +   - **Allow All Users to Enable and Disable the Device**: By default, only the
    root user can start and stop the network card connection. Checking this check
    box allows any user to do that.


    +   - **Enable IPv6 Configuration for This Interface**: This is a future standard
    for providing internet addresses. At this time, most ISPs don''t support IPv6,
    so leave this box empty.


    +   **3. Select the Static Set IP Addresses radio button to set a static IP address
    of 0.0.0.0.


    When setting up a wireless access point, the Fedora system is used to pass network
    packets between the wired and wireless network cards. You won''t need a network
    address to do that.


    +   **4. Click OK to save the settings.


    The network configuration tool saves the new network card configuration settings
    automatically. If the card is not in Active status, click the Activate button
    to get it started.


    You should now have your wired network card active, but you won''t be able to
    use it on the network as you haven''t assigned an IP address for it. If you''re
    just using your Linux computer as an access point, you won''t need to configure
    an IP address. Next up is the wireless card.


    # Step 3: Install Your Wireless Card


    Installing and configuring a wireless network card in Linux can be a tricky thing.
    This is one area where many distributions fail miserably.


    Linux supports only a limited number of network cards. Actually, it''s not so
    much the cards that aren''t supported are the chips used inside the cards. One
    of the biggest headaches in the wireless network card world is that manufacturers
    often switch the types of chips used in the same model card in different manufacturing
    runs (revisions). A Linux driver that works for card A, revision 1 may not work
    at all for card A, revision 2.'
  merge: -1
  pgno: 339
- img_proc: true
  md: '# 322 Part V: The Part of Tens


    If Fedora detected your wireless network card during installation, you can use
    the standard Network Configuration tool to configure it (we walk you through that
    process in a little bit).


    If your wireless network card wasn''t detected, or if you try to install a wireless
    network card, you have a few options available to:


    +   - Use the Network Configuration tool to select the new card

    - Use the Linux tools provided by the card manufacturer

    - Use the ndiswrapper Linux application


    First, trying the Network Configuration tool to see if Fedora recognizes your
    wireless card and has a driver for it. This process is detailed in Chapter 9.
    Just follow those steps, and jump back here if you get your wireless network card.


    If you can''t find your network card in the Network Configuration tool list, you''ll
    have to do some experimenting. The best thing is to use a Linux tool to help install
    the card. Check your network card''s supplied drivers CD or its Web site. Hopefully,
    for your particular card, you''ll be able to find a Linux driver or tool for it.
    If you do, follow the instructions provided by the manufacturer.


    If you still can''t get your card to work, there''s one more chance for you. The
    ndiswrapper application is an open source project that attempts to create a Linux
    driver from the Windows drivers with the supplied network card.


    The ndiswrapper Wiki site (http://ndiswrapper.sourceforge.net/mediawiki/index.php/Main_Page)
    provides information on how network cards work with ndiswrapper. Check the Wiki
    site first to see if there''s any hope of using your particular wireless network
    card. Lots of people post to their wireless network card problems, There''s a
    good chance you''ll find information about your card. If your wireless network
    card doesn''t appear in the list, you are out of luck and need to buy a new card.


    If you find that you can use ndiswrapper to support your wireless network card,
    you can continue with this section. You must first install the kmodndiswrapper
    package:


    +   1. Click Applications: Add/Remove Software.


    This starts the Package Manager tool. If you''re not logged in as the root user,
    you''ll be asked for the root password to continue.'
