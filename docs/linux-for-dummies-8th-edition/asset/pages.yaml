    # Step 4: Set Advanced Folder Permissions


    There is one additional trick that you must use to complete the shared folder
    permissions. When Fedora Linux creates a user account, it assigns each to a unique
    group (which happens to be the same as the username). Unfortunately, this causes
    problems in a shared folder environment.'
  merge: -1
  pgno: 371
- img_proc: true
  md: '# 354 Part V: The Part of Tens


    Even though your users are all members of the same group, their primary Linux
    group is still their unique group name. When a user creates a new file in the
    shared folder, it belongs to the user''s primary group, not your newly created
    group.


    To solve this problem, you must tell the shared folder to use the folder''s group,
    not the user''s group, when users create new files. This requires a special Linux
    permission that is not available from the Nautilus Properties window.


    You must manually assign this permission from the command line prompt by using
    the Linux chmod command. Here are the steps to accomplish:


    +   1. Select Applications:System Tools:Terminal to start the command line session.

    2. If you are not logged as the root user, from the command line, type su to become
    the root user. Enter the root user password when prompted.

    3. Type the command chmod g+rws /accounting.


    The chmod command changes the permissions on the specified folder. The individual
    options in the command are


    +   * g specifies for the permissions to be added to the group permission settings.

    * r specifies for the group to have read permissions to the folder.

    * w specifies for the group to have write permissions to the folder.

    * s specifies for the folder group setting being used for all files created within
    the folder.


    +   4. Use the chmod command again, this time using the /sales folder.


    Whenever a user creates a file in the accounting or sales folder, the group of
    the file is set to the special group name instead of the user''s primary group.


    This process ensures that other members of the group can access files created
    by one member of the group.


    +   5. Type exit at the command line prompt to exit root mode, and then type exit
    again to exit the Terminal session.'
  merge: -1
