  md: '# Chapter 21: Ten Steps to Setting Up a File Server 355


    # Step 5: Install and Start Samba


    If you haven''t already installed and started Samba while working in Chapter 20,
    you''ll need to do that now. You can use the Fedora Package Management tool to
    install the Samba software:


    +   1. Click Applications:Add/Remove Software.


    This starts the Fedora Package Management system. You can easily add or remove
    software packages from here. If you are not logged in as the root user, it will
    ask you for the root password to continue.


    +   2. In the Package Management window, select the Servers option on the left
    side and the Windows File System option on the right side.


    The Windows File System option includes one optional package — system-config-samba.
    Ensure that you select this package for installation as well. It will make configuring
    the Samba software easier.


    +   3. Click the Apply button on the lower right to start the software installation.


    After you install the Samba software, you must decide how you want to run it on
    your server. You have two options:


    +   Manually: If you don''t want the Samba server running all the time


    +   Automatically: If you want the Samba server to start when the Linux server
    is booted


    For either option, you must use the Fedora Service Configuration window.


    +   1. Select Administration:Server Settings:Services from the menu.


    This starts the Service Configuration window. Again, you must be the root user
    to use this tool, so if you''re not already logged in as root, you will be asked
    for the root password to start. When the Service Configuration window starts,
    you see all the services that are available on the Fedora server, as shown in
    Figure 21-3.


    The server automatically starts services that have the green check mark in the
    check box when the system boots. You can also start, stop, or restart individual
    services using the appropriate button.


    The Services Configuration window labels the Samba service as smb. This service
    actually controls two separate Samba services:


    +   * smbd: Controls client connections to the Samba server.


    +   * nmbd: Controls advertising shared devices on the network.'
  merge: -1
