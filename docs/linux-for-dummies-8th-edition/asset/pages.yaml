  md: '# Chapter 19: Ten Steps to Making Your Own Wireless Access Point 331


    The smart thing to do is lock down the wireless access point so authorized devices
    can use it. Here''s how:


    +   From the GUI desktop, choose System:Administration:Network.

    If you''re logged in as a regular user (not root), you''re prompted to enter the
    root password.

    In the Network Configuration dialog box, double-click your detected wireless network
    card.

    The Wireless Device Configuration dialog box (refer to Figure 19-3) appears, showing
    the current settings for the wireless network card.

    Click the Wireless Settings tab to change your wireless access point configuration
    settings.

    Enter a 13-character hexadecimal or ASCII encryption key in the Key box.

    The wireless network card uses the Wired Equivalent Protocol (WEP) to encrypt
    data sent across the wireless network. WEP requires a 13-character hexadecimal
    or ASCII key. Select a unique key to encrypt your data. If you select a hexadecimal
    key, you must precede the key with 0x.

    Click OK to exit the Wireless Device Configuration dialog box, and then click
    File:Save to save the changes.


    Your access point should not be secure. Not only must remote clients know the
    key to connect to the access point, but it will also be more difficult (but not
    impossible) for any sniffers to decode your wireless network traffic.


    The next step is to get the remote clients working.


