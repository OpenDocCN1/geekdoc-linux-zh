    # # Installing and Using Wine


    And then there''s Wine (www.winehq.org), a complete rebuild of Windows functionality
    that runs under Linux. Wine is in many ways the mother of everything in the previous
    section. However, because it''s a free and very complicated project, it''s not
    quite as friendly as the commercial versions. It''s kind of the others but with
    all the makeup and hairspray removed.


    You can install Wine by using the information in Chapter 16. You will find that
    there are many packages that start with "wine". Install wine, wine-cms, wine-core,
    wine-docs, and wine-tools (or install all of them if you have lots of space and
    don''t want to take any chances).'
