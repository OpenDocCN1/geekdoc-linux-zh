    Information about the update displays beneath the list of available updates.


    +   3. Click Apply Updates to proceed.


    The Resolving Dependencies for Updates dialog box appears with a progress bar
    — this process can take a while the first time you update the machine, there may
    be one hundred updates or more.


    When the tool is sure that everything that each program is taken care of, this
    dialog closes and another may be telling you that dependencies were declared —
    dependencies are packages that another package has to have in place to install
    and run properly. If you see a dialog box saying there were errors resolving the
    dependencies, or errors downloading headers, click Continue to proceed. Try again
    later. The server might not be properly synchronized.


    From here, you will see a Downloading dialog box. A progress bar shows how much
    longer it will take for all the updates to be downloaded to your computer. After
    downloading is complete, an installing progress bar appears. When the updater
    finishes installing the packages, an information dialog box appears, stating that
    the update is complete.


    +   4. Click OK to close the updater, if necessary.'
