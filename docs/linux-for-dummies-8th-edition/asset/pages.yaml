  md: '# Chapter 1: Getting Acquainted with Linux


    In recent technological history, Linux has evolved from water-cooler techie chatter
    to a rock-solid solution for the business enterprise. The same software that once
    was dismissed as rogue is now adopted and promoted by industry leaders such as
    IBM, Hewlett-Packard, Motorola, Microsoft, and Intel. Each of these computer manufacturers
    has, in some way, determined that Linux provides value for their customers (as
    well as their own operations).


    Linux has been accused of being ''just another operating system''. On the surface,
    it may appear so, but if you look deeper, you can see that this is not. The Linux
    project is a flagship leading the current trend toward open source and free (in
    freedom, not free beer) software within the computing industry. A rock-solid operating
    system because of the model under which it was (and continues to be) developed,
    Linux represents that which is in good software development.


    Two fundamental distinctions separate Linux from the rest of the operating system
    pack:


    +   - Linux is licensed under the unique and ingenious GNU General Public License,
    which you can read about in the next section.


    +   - Linux is developed and maintained by a worldwide team of volunteer and paid
    programmers, working together over the Internet.


    Linux is great for many reasons, including the fact that the folks who built it
    from the ground wanted it to be


    +   - Multiser: More than one user can be logged into a single computer at one
    time.


    +   - Multiprocess: True preemptive multitasking enables the operating system
    core to efficiently juggle several programs running at once. This is important
    for providing multiple services on one computer.


    +   - Multiplatform: Linux currently runs on more than 24 platforms (hardware),
    including 32 and 64-bit Intel-based PCs, Digital/Compaq Alpha, all variants of
    the Apple Macintosh, Sun SPARC, the Apple iPod, and even the Microsoft Xbox.


    +   - Interable: Linux plays nice with most protocols (languages) and operating
    systems, allowing you to interact with users and computers running Microsoft Windows,
    UNIX, Novell, Apple Macintosh computers, and other, more niche groups.


    +   - Scalable: As your computing needs grows, you can rely on Linux to grow with
    you. The same Linux operating system can run on a tiny electronic photo frame,
    a desktop computer, or a very large, industrial-strength server system.'
