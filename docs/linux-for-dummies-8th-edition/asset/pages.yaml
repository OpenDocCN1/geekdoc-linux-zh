    # Win4Lin


    Another option is Win4Lin (www.win4lin.com). Win4Lin actually offers a platform
    within which you install Microsoft Windows (so have those CDs handy) and run programs
    on top of it. At this writing, Win4Lin supports Windows 95, 98, ME, 2000, and
    XP (see Figure 15-2).


    A plus for Win4Lin is that it supports a more full range of Windows software.
    By default, this program runs all of your Windows applications within a single
    window frame. See the Win4Lin Administration Guide for information on how to change
    this behavior.


    # Cedeqa


    More interested in games than office tools? There''s also TransGaming''s Cedeeca
    (www.transgaming.com), which was called WineX. This version of the Free Wine project
    (see the upcoming section "Installing and Using Wine") is specifically designed
    to support Direct X, which is used in Windows to make programming for multimedia
    and games easier. Subscribers have access to regular updates, allowing them to
    make use of their favorite games and add any games they are liking to the list
    of games that are being tested with the system.


    Go to www.transgaming.com/searchgame.php to find a listing of the games, in order,
    that users have tried with Cedega (Figure 15-3) and what success they have had
    with these games.'
