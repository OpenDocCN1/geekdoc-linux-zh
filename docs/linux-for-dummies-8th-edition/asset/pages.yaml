  md: '# Chapter 6: Working without the GUI


    appear next to the numbers so that you can see how big these numbers actually
    are. But, wait — there''s more. What if you just want to know the total amount
    of disk space this directory and its subdirectories are taking up?

    That calls for the -s flag:


    ```

    du -s

    ```


    What if you want the total for a different directory? Or just one of subdirectories?
    In my case, I keep a Music subdirectory for the items I have copied from my CDs
    to Ogg Vorbis (Chapter 13). I can type the following command to see how much hard
    drive space that takes up in a human-readable way instead of having to count zeros:


    ```

    du -sh ~Music

    ```


    In this example, du is the command name, -sh indicates the flags (options), and
