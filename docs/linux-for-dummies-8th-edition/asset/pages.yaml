  md: '# Chapter 5: Checking Out the Desktops


    # # Changing your panels


    You can customize your upper and lower panels individually through the Panel menu.
    You open this menu by finding free space on the panel you want to work with, and
    then right-clicking to pull up the Panel''s context menu. (For a list of what
    this menu''s items offer, see Table 5-4).


    If you have many programs open that you are using the whole width of the lower
    panel, you may not have any free space to right-click. Try being very precise
    with your mouse to find somewhere. If you can''t, you may need to close a program
    or two clear space.


    ![](img/9e1543123a324def5e9e0f9e6fc0f80b_91_0.png)


