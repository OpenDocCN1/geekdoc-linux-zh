  md: '# Appendix A


    # Common Linux Commands


    In This Appendix


    +   - Archiving and compression commands

    - Communication commands

    - File commands

    - System control commands


    Computing novices often marvel at the keyboard dance Linux experts typically perform.
    Sure, these experts know modern advances like the mouse and graphical interface,
    but these keyboard musicians prefer the home keys and find that they can work
    faster that way. It takes some time to reach this level of proficiency, but every
    expert was a novice at one time, and any novice can become an expert with plenty
    of practice.


    In this appendix, you find the commands listed by themes, according to what you
    can actually do for you.


    So, read on — dazzle your friends with your command-prompt finesse. When they
    ask you how and where you figured out all those commands, just smile and mumble
    something about the voices in your head — and, of course, keep this section dog-eared
    and within reach of your computer.


    # Linux Commands by Function


    Because every command serves a specific purpose, organizing these tools into groups
    according to their individual functions is not difficult. If you know what you
    need to do but don''t know which command does the job, flip through this section
    to start your search. From here, you can dig further by referencing man pages
    and other help information (online sites and reference books, for example) or
    by looking in this book''s index for further coverage.'
  merge: -1
