  md: '# 148 Part II: Getting Up to Speed with Linux


    The Ethernet Device dialog box contains several settings that you can alter:


    +   * **Nickname**: Allows you to assign a different (possibly meaningful) name
    to the device rather than eth0 or eth1.

    * **Activate device when computer starts**: Allows Fedora to automatically activate
    the network card at boot up without any intervention from you.

    * **Allow all users to enable and disable the device**: By default, only the root
    user can start and stop the network card connection. Checking this box allows
    any user to do that.

    * **Enable IPv6 configuration for this device**: This is a future standard for
    providing Internet addresses. At this time, most ISPs don''t support IPv6, so
    leave this box empty.


    +   4. **Select the IP address method required for your ISP.**


    Most cable and DSL modem provide IP addresses to devices using DHCP. Select this
    method if it is your situation. If your ISP assigns a specific IP address to your
    device, you''ll have to select the Statically set IP option and enter the appropriate
    values.


    +   5. **Click OK to save the settings.**


    The Network Configuration tool saves the new network card settings automatically.
    If the network card is not in the Active status, click the Activate button to
    get it started.


    # Look Ma, no cables!


    The wireless phenomenon has taken home networking by storm. Nowadays it''s just
    as easy to purchase and install a wireless router as it is a wired switch. If
    you have jumped on the wireless bandwagon, you need to know how to connect your
    Fedora system to your wireless access.


    You first hurdle be the wireless network card itself. Unfortunately, wireless
    network support is still in its infancy in the Linux world. Although each new
    version of Fedora includes support for more network cards, it''s quite possible
    that you have a network card that is not supported.


    If your network card is not supported, you have a last-ditch effort in the ndiswrapper
    project. The ndiswrapper project is an open source project that uses Windows network
    drivers supplied for network cards to create a pseudo-Linux driver. Unfortunately,
    Fedora doesn''t provide the ndiswrapper software in the default configuration,
    but you can find it in other areas. You can find out more about it by visiting
    ndiswrapper.net.


    ![](img/9e1543123a324def5e9e0f9e6fc0f80b_166_0.png)'
