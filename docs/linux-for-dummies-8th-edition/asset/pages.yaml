  md: '# # Chapter 2


    # # Prepping Your Computer for Linux


    **In This Chapter**


    +   - Taking basic preinstallation steps

    - Using Linux and Windows on the same computer

    - Customizing disk partitions before installation

    - Knowing (and finding) your hardware information

    - Preparing for DVD or CD installation


    You got to be careful if you don''t know where you are going, because you might
    not get there.


    > — Yogi Berra


    Because there are three major approaches for installing Linux, look at this chapter
    introduction as a quick road map that tells you which sections are important for
    your particular situation. If you have a computer''s only going to run Linux and
    nothing else, you''re in luck! You can skip the "Preparing to Use Linux and Microsoft
    Windows Together" section. In fact, if you''re feeling brave, you may want to
    skip right to Chapter 3 and start your installation. There''s troubleshooting
    information in Chapter 22 as well.


    Of course, many people don''t have the luxury of having more than one computer.
    There are many ways to approach a dual booting situation, where you have both
    Microsoft Windows and Linux installed on the same computer and reboot the machine
    to switch between one and the other. The scenario that many people prefer is to
    add a second, fresh hard drive to install Linux on or to remove all the data from
    an existing drive and erase it for Linux. If you decide to go with one of these
    options: make a note of which drive is as far as the concern them: You need to
    make sure that you leave your drive (Windows or Linux) is first and second as
    far as the order information in. You can find out how to read the order information
    in the section "Peeking at your partitions from Windows" later in this chapter.
    When you are sure you know which drive is which, proceed to the section "Double-Checking
    Hardware Compatibility" later in this chapter.'
