    # # Peeking at your partitions in Windows 98


    Windows 98 unfortunately does not provide a graphical tool like Computer Management
    for Windows 2000 and XP. It uses FDISK, a commandline tool that indicates the
    partitions on your hard drive. To find out the details about a computer''s hard
    drive in Windows 98, follow these steps.


    Be careful with FDISK. You can wipe out your data if you make any changes with
    it. When you are exiting the prompt, be sure to save any changes.


    +   1. Open an MS-DOS prompt by choosing Start:Programs

    MS-DOS Prompt.


    +   2. Type FDISK and press Enter.


    In Windows 98, you can enter FDISK in uppercase, or any mixed case you like as
    you spell FDISK correctly!


    You will likely be prompted to display large "disk" (drive) information—"large"
    is relative to what was a big hard drive in the time of Windows 98, which means
    a drive larger than 512MB. If you don''t see the prompt, skip to Step 4, and the
    FDISK menu options will be similar to Figure 2-3.


