    ![](img/9e1543123a324def5e9e0f9e6fc0f80b_241_0.png)


    Figure 12-13: 4-x-4 matrix in OpenOffice Math.


    5. Continue adding components to the formula until you finish.


    Suppose that you want to multiply the matrix by 3. To find out how, press Enter
    to go to the next line in the Commands window (to use "scratch paper"), right-click
    to display the pop-up menu, and choose Unary/Binary Operators<> Times by b. This
    choice adds the phrase <?> times <> the matrix code. Now you know how to format
    a multiplication, erase this phrase and use it as a guideline to change your formula:


    ```

    3 matrix(A # B ## C # D)

    ```


    This line gives the result shown in Figure 12-14. I could go on, but by now you''re
    eager to start with your own explorations!


    OpenOffice.org Math supports (among others) its own OpenDocument format (.ODF),
    the equivalent StarOffice format (.SXM) and MathML 1.01 (.MathML), which isn''t
    a program. MathML is a standard similar to HTML for'
