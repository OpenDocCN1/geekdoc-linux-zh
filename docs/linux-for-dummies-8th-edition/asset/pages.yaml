  md: '# Chapter 16: Adding Software to Linux


    (programs) from that group are actually selected. If you want to look at the packages
    and choose more, select the group you''re interested in and click Optional Packages
    to see what else is available. Go through and click empty boxes to add Xs or click
    remove. When you''re ready with your selections, click Close, and then move to
    another category (on the left) or group (on the right). Then you can select a
    new tab, or click Apply to install the software.


    +   * **Search:** Click the Search tab (Figure 16-3). Select Available Packages
    you can search through only the packages you haven''t installed. Then type what
    you want to look for in the text box, and click Search. The Search button changes
    to a Stop button, and as the Package finds matches, they are displayed in the
    text area below, with the Stop button reverting to a Search when the search is
    complete. If you feel you''re ready to move on, click Apply to install your software.


    ![](img/9e1543123a324def5e9e0f9e6fc0f80b_291_0.png)


