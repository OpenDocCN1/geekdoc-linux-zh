    | Label | Type | Description |

    |---|---|---|

    | c | Character device | The item is a driver (control program) for a piece of
    hardware that transmits data, such as a modem. |

    | d | Directory | The item is a container for files, referred to as a folder in
    some operating systems'' lingo. |

    | l | Link | The item is a link, as discussed earlier in this chapter. |


    In addition to those mentioned in Table 7-3, you find lots more different types
    out in the Linux world. By types, I''m not referring to extensions, such as .exe
    or .doc. Linux sees everything within its filesystem — even directories and hardware
    you like your monitor as “files.” As a result, assigning a type to a file is merely
    a Linux way of keeping track of what''s what.


    The main thing Windows users particular want to know when they move to Linux is
    how to recognize programs. Instead of looking for files with extensions (.exe),
    programs have (or need to) have executable permission so the system knows they
    are allowed to run. See Chapter 8 how to do this in Nautilus.


    On the command line, try out the file command, such as file Desktop, to find more
    about what a particular file contains.


