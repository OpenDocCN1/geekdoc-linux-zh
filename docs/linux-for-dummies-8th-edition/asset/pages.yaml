    5. On the Linux Download Manager starts. Select the save to Desktop option to
    save the client package for the software to your Desktop.

    6. Exit Firefox.

    7. Double-click the SecondLife installation package on the Desktop.

    The File Roller application starts, showing the contents of the installation package.

    8. In the File Roller window, click the Extract icon.

