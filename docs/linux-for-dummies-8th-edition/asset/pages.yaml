    # Internet Connectivity 101


    A few words regarding broadband options (DSL and cable) are in order before I
    begin. The word broadband has a technical definition, but I use it to mean high-speed
    Internet access. Although a dialup modem can typically transmit information at
    speeds up to 56 kilobits (thousand bits) per second, broadband connections can
    reach 50 times that speed. Nowadays, the web contains lots of images and multimedia
    elements, and enjoying these features through a 56 Kbps dialup modem is similar
    to drinking a cold glass of water with an eyedropper when you''re dying of thirst.


    Don''t let high-speed providers discourage you from using Linux with their services.
    Just because they don''t support Linux directly doesn''t mean the technology doesn''t
    work with Linux. TCP/IP (the set of traffic rules for the Internet) was developed
    for the UNIX operating system, from which Linux'
