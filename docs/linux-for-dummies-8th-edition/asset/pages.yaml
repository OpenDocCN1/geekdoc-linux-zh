    no problem—or you can change its formatting into a Linux setup. (The handy thing
    about leaving it as a Windows disk is that you can use it to share things with
    Windows users.)


    To format a floppy, place the floppy into your floppy drive and choose Default—in
    the Computer dialog box, right-click the Floppy drive icon and choose Format from
    the context menu.


    Typically, the defaults are what you want to choose. If you want to format the
    disks for Linux, use the Linux Native (ext2) format. To share disks with Windows
    users, choose DOS (FAT). Another setting you may want to choose is Thorough than
    Quick.


