  md: '# Chapter 2: Prepping Your Computer for Linux


    # Working with Disk Partitions


    In the section "Preparing to Use Linux and Microsoft Windows Together" earlier
    in this chapter, I discuss why you might need to set aside disk space for Linux
    on a computer that is already running Windows. The techniques I cover assume you''ve
    found free space that you can give to Linux after resizing your partitions. If
    you''re installing on a fresh, additional hard drive, are wiping out a whole hard
    drive to give it over to Linux, or already have a chunk of unallocated/free space
    bigger than 10GB, skip ahead to the section "Double-Checking Hardware Compatibility,"
    later in this chapter.


    ![](img/9e1543123a324def5e9e0f9e6fc0f80b_47_0.png)


    If the thought of changing anything on your Windows drive makes you queasy, a
    cheap, additional hard drive can be worth its weight in gold.


    # Choosing a partitioning tool


    Perhaps the easiest way to adjust your existing partitions is through the use
    of a commercial program such as Partition Magic. Partition Magic enables you to
    view the partition information for your hard drive(s). You can also use this utility
    to resize, move, and add partitions. If all you want to do is resize, however,
    you don''t have to go out and buy software to get that. Instead, you can download
    a free tool to do the job for you (see the next section for how to do so).


    ![](img/9e1543123a324def5e9e0f9e6fc0f80b_47_1.png)


    No tool is perfect. Before going any further, make a backup of anything you don''t
    want to lose off your Windows installation! Things can go wrong during the various
    steps of partitioning, no matter what tools you choose.


    # Merging and resizing partitions with GParted


    If you found that you have free space but that you need to consolidate from a
    number of smaller pieces into a bigger one, you need to resize some of your partitions.
    The program you use for this purpose is GParted. This utility can work with Windows
    partitions, at least the original release of Microsoft Vista.


    # Getting gparted


    You need to download the gparted program before you can use it, and burn it onto
    a CD-ROM. To download gparted, do the following:


    +   1. Go to http://gparted.sourceforge.net/'
