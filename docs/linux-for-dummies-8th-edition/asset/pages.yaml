  md: '# Part III: Getting Things Done


    # GIMP basic tools


    Because it''s such an advanced tool, it''s astonishing that the GIMP main menu
    bar contains only three items: File, Xntns, and Help. The beauty of GIMP is that
    all the tools appear in separate dialog boxes, allowing you to lay out multiple
    tools as you draw.


    The File menu item allows you to open or acquire an image to work with. GIMP allows
    you to edit images from five different sources:


    +   * Start a new image from scratch on a blank canvas.

    * Load an existing image from your computer. GIMP supports all the standard image
    types, such as GIF, JPEG, TIFF, and others.

    * Retrieve an image from a remote Web location.

    * Retrieve an image from a scanner connected to your computer.

    * Produce an image from a screenshot of your Desktop, or a single application
    over the desktop.


    When you open an image, it appears in its own editing window. If you open more
    than one image at a time, each image opens in its own editing window. This feature
    allows you to work on several images at the same time without having to flip around
    images in a single window.


    The top section of the GIMP main dialog box consists of the toolbox. The toolbox
    contains all the image editing tools you''d expect from an image editor. The toolbox
    contains tools for selecting image areas, reorienting the image (such as flipping);
    drawing with a pencil, paintbrush, ink, or airbrush; filling colors, and adding
    special effects.


    For each tool, select the middle section of the GIMP main box shows detailed settings
    for the tool. In Figure 14-4, the paintbrush tool is selected, settings related
    to the paintbrush (such as brush size and opacity of the color) appear in the
    middle section.


    You can also keep the detailed settings for multiple options as separate dialog
    boxes. Choosing File>GIMP produces a list of the different dialog boxes you can
    have open on your desktop. This is shown in Figure 14-5.


    Below the tools is an area to select the foreground and background colors. Double-click
    the black area to set the foreground color, and double-click the white area to
    set the background color for the image. Alongside that is an icon allowing you
    to easily change the drawing instrument shape and size.'
