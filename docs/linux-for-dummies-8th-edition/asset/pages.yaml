    Figure 10-2: The Firefox Preferences window in Fedora 7.


    +   **History:** The History section lets you designate how many days you want
    your browser to remember where you''ve been. You can also choose to let Firefox
    remember text you entered into forms and the search bar. If you use this feature,
    Firefox will attempt to autocomplete words you''ve already typed before those
    forms. You can also allow Firefox to remember the files you''ve downloaded so
    you can easily remove them instead of accidentally downloading a 500MB file that
    you already downloaded last week.


    +   **Cookies:** This is one of the buzz that sends some people into a frenzy.
    Cookies are bits of information a Web site stores on your machine so that this
    data can be accessed when you return. Some people don''t care how many cookies
    are created and some don''t want any on their systems. To prevent cookies from
    being stored, click the Accept Cookies from Sites box to uncheck it. You can also
    only allow certain sites by clicking the Exceptions button and adding the sites
    into the list.


    You can view every cookie currently by clicking the Show Cookies button, and can
    either remove them individually (select the cookie to remove and then click Remove
    Cookie) or click the Remove All Cookies button to toss out all of your cookies
    immediately. For the Keep until drop-down list box, choose how often you want
    Firefox to dump cookies:


    +   **Until expire:** Most cookies have an automatic expiry date. If you want
    to let the cookies dictate when they will be deleted, choose this option.'
