  md: '# # Chapter 10

    # Using the Internet


    **In This Chapter**


    +   * Browsing the Web

    * Checking and sending e-mail

    * Grabbing files

    * Sending instant messages

    * Talking across the Internet


    > > Give a man a fish and you feed him for a day; teach him to use the Net, and
    he won''t bother you for weeks.

    — Anonymous


    The Internet is a vast network of computers that spans the globe. Many different
    types of computers and operating systems work together to allow you access to
    information across the Internet. Linux, along with the other related UNIX operating
    systems, has long supported and worked with the Internet. Practically all the
    different services available on the Internet are available from your Linux desktop.


    When you install Linux (Chapter 3), one or more Web browsers, mail programs, and
    instant messaging tools are placed onto your new system. In this chapter, I introduce
    you some tools you can use to access different services on the Internet, such
    as accessing Web sites, using e-mail, investigating newsgroups, and utilizing
    FTP — assuming that your Internet connection is configured (see Chapter 9).


    # # Browse the Web with Firefox


    Many people attribute the explosive growth of the Internet to the graphical Web
    browser. The Internet has been around for much longer than the invention of the
    browser. It''s just that most of the work done on the Internet was in'
  merge: -1
  pgno: 175
- img_proc: true
  md: '# 158 Part III: Getting Things Done


    plain old text, which held little attraction for people who like pretty pictures.
    In the world of Linux, the most popular browser is arguably Firefox (www.mozilla.org/products/firefox),
    which is based on Mozilla — essentially Firefox is the Web browser portion of
    Mozilla, whereas Mozilla can also handle e-mail and news browsing. Another popular
    option is Konqueror (www.konqueror.org), which besides being a good Web browser,
    also includes file-browsing features similar to the Nautilus program.


    # Configuring Firefox


    You can start surfing right now, if you don''t want to customize your browser.
    However, you may want to take a moment to tell Firefox your preferences, such
    as the default Web site to show when it starts up, what font sizes to use by default,
    what colors to use, and many other options.


    The following steps introduce you to the Preferences window, where all the Firefox
    configuration parameters are stored:


    +   1. Start Firefox.

    Fedora provides two ways to start Firefox. You can use the standard menu entry
    by clicking Applications ◀ Internet ▶ Firefox, or, if you''re in a hurry, you
    can just click the globe icon in the top Panel.

    2. Choose Edit:Preferences.

    The Preferences window appears, as shown in Figure 10-1. This dialog box contains
    all the settings you need to play for your Web browsing.

    3. Click the icons along the top of the Preferences window to access the various
    preferences.

    The Advanced category is complex enough to offer tabs for various categories.
    These tabs can be worth exploring well.

    4. If you get tired of reading through menus, just click Close to close the Preferences
    dialog box and get back to surfing.


    General preferences

    Selecting the Main option icon — shown earlier in Figure 10-1 — allows you to
    determine how your Firefox looks like and when it runs. The separate-rate sections
    govern this dialog box:


    +   * Startup: This section allows you to choose what Firefox shows immediately
    upon starting. You can type a URL directly into the Home Page text box, or click
    one of the following buttons:'
