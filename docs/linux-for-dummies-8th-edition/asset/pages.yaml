  md: '# Chapter 21


    # Ten Steps to Setting Up a File Server


    +   In This Chapter

    * Reintroducing Samba

    * Making a file server

    * Troubleshooting


    > There are some things you can''t share without ending up liking each other.

    — J. K. Rowling, Harry Potter and the Sorcerer''s Stone, 1997


    Besides printers, the next big thing in local networking is file sharing. File
    sharing is a necessity in the business world, but it can also come in handy within
    the home network as well. Having a common place for everyone in the house to place
    pictures, music, or documents using floppies and flash drives almost obsolete.


    There''s no doubt that the Microsoft network environment is the most popular file
    sharing system available. Any Microsoft Windows computers can connect to share
    folders with one another. But just because you decided to use Linux doesn''t mean
    you are left out in the cold. In this chapter, I walk through the steps necessary
    to create your own file server on your home network that can be accessed from
    any Microsoft or Linux device on your network.'
  merge: -1
  pgno: 367
- img_proc: true
  md: '# 350 Part V: The Part of Tens


    # Reintroducing Samba


    In Chapter 20, you saw how the Samba software package could be used to share a
    local printer with Microsoft Windows clients on the network. The same Samba software
    package also makes sharing folders and files between Linux and Windows devices
    a snap.


    Samba allows you to define folders on your Linux system that it then advertises
    on the Microsoft network. Remote Windows clients can browse and map to those folders
    just as if the were on a Windows system.


    You can control access to the folders by using the standard Linux user and group
    permissions. Samba has the ability to allow Windows users on the network to access
    individual Linux user accounts. This feature allows you to use one set of user
    accounts on the Windows network, and a different set of user accounts on the Linux
    system.


    # Step 1: Plan a Sharing Policy


    Before you can start sharing, first you must decide what you want to share and
    who gets to share it. Mapping out a folder sharing policy is a crucial element
    to creating a file server.


    Even in small organizations, you must often restrict subgroups from accessing
    certain information. Whether it''s separating teacher data from students, or keeping
    children away from parents'' data, you often find creating more than one group
    for sharing data.


    You can create as many shares as the file server as you need to manage the data
    groups. For each group that must share data, you must create a separate folder
    and define a separate group to place users in.


    With all this information to keep straight, it''s usually best to create a simple
    table, mapping out what users should have access to what data. After seeing the
    layout, it is easier to create the proper configuration. Table 21-1 demonstrates
    a simple shared folder policy table.'
  merge: -1
  pgno: 368
- img_proc: true
  md: "# Chapter 21: Ten Steps to Setting Up a File Server 351\n\nTable 21-1\n| Group\
    \ | Folder | Share Name | Members |\n|---|---|---|--|\n| accounting | /accounting\
    \ | accounting | fred, barney |\n| sales | /sales | sales | wilma, betty |\n\n\
    Table 21-1 shows that each group is assigned a unique folder on the Linux system.\
    \ To keep things simple, this example uses the same group, folder, and share names,\
    \ but on a real system, this may not be possible: Making a table that maps out\
    \ what's you can save from lots of headaches later on in the project.\n\n# Step\
    \ 2: Create Linux Groups\n\nThe next step in creating your file server is to create\
    \ the necessary groups in Linux. The file server uses the Linux groups to control\
    \ access to the individual shared folders you'll create. For this step, you need\
    \ to use the Fedora User and Group Manager:\n\n+   1. Select System>Administration>Users\
    \ and Groups from the panel menu.\n\nThe User Manager window appears. If you are\
    \ not logged in as the root user, Fedora first asks you for the root password\
    \ to continue.\n\nThis tool provides a graphical interface for creating and managing\
    \ groups on the system.\n\n+   2. Click the Add Group icon to add a new Linux\
    \ group. \n\nThe Create New window, shown in Figure 21-1 appears.\n\n![](img/9e1543123a324def5e9e0f9e6fc0f80b_369_0.png)"
  merge: -1
  pgno: 369
- img_proc: true
  md: '# 352 Part V: The Part of Tens


    In the text box, enter the name of the group you want to use to control the shared
    folder. Leave the Specify ID manually check box blank. Fedora automatically assigns
    a unique group number to the group.


    Use this technique to create a group called accounting, and then another group
    called sales. The new groups appear in the group listing under the Groups tab.


    # Step 3: Create Folders to Share


    After youve created the groups, you can create the folders to share. For security
    reasons, it''s not a good idea to create folders under an existing user''s home
    folder. Instead, you should create folders separate from the normal directory
    structure on the system.


    +   1. Log in as the root user.

    This is one of the times where it is easier to log in as the root user. Anytime
    you log in root, you use extreme caution that you don''t alter anything you shouldn''t
    be altering.

    2. Double-click the Computer desktop icon, and then double-click the Filesystem
    icon.

    This starts Nautilus, showing the root directory structure of the Linux system.

    3. Right-click on an empty space in the Nautilus window and select Create Folder.

    When Fedora creates the new folder, it gives you the option to name it. Change
    the name to accounting.

    4. Create another folder, called sales, in the root directory.

    5. Right-click on the accounting folder and select Properties for the drop down
    menu.

    6. Click the Permissions tab.

    The Permissions tab displays the permissions for the owner of the folder, the
    assigned group the folder belongs to, and access for all other users on the system.
    This is shown in Figure 21-2.'
  merge: -1
