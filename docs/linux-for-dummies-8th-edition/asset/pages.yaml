    # # Accessing Windows'' Drives on This Computer


    If you''re dual-booting between Windows and Linux, you will have times you want
    to access information on your Windows drive from Linux (unfortunately Windows
    cannot access the information on Linux drives). To access the files on your Windows
    drive from Linux when they''re on the same computer, do the following:


    +   1. **Open a command-line terminal.**


    See Chapter 6 if you''re not sure how to do so.


    +   2. **Type `su` - and press Enter to become the root (administrative) user.**


    You are asked to enter the root password. Do so when prompted and press Enter.


    +   3. **Type `fdisk` -l to see all your hard drives and partitions.**


    If you''re looking for a Windows partition, you can find it here. Ignore the items
    that have text similar to Windows 95 Ext''d; they''re not a data partition. Anything
    that has NTFS or FAT32 or VFAT is a Windows partition and what you''re interested
    in. If you''re looking for a Linux partition (maybe you have more than one distribution
    installed on your system), you the ones that have the word Linux in their description
    and not the word *swap*.


    +   4. If you need to add an NTFS partition, see Chapter 16 how to add NTFS support
    to Fedora.


    The packages you will start with `ntfs`. here is a collection of them: Go ahead
    and install all, or at least `ntfs-3g`, `ntfs-config`, and `ntfsprogs`.


    +   5. When you know what partition you want to mount, type `mount -t type /dev/partition
    /mnt` to add it to your filesystem, where **type** is the filesystem type (vfat
    or ntffs), as shown in Table 8-1, and **partition** is the number and combination
    you use (such as `hde2`).


    So, for example, after adding NTFS support, you might type `mount -t ntfs /dev/hde2
    /mnt`. When you do so, you can find all of partition''s contents under the `/mnt`
    directory.'
