  md: '# Chapter 12: Word Processing and More with OpenOffice


    # The Database pane


    To the left of the main window is the Database pane. In this pane you see four
    icons: Tables, Queries, Forms, and Reports. Select these icons to determine what
    appears in the two rightmost panes — for example, to work with your tables, select
    the Icons icon.


    ![](img/9e1543123a324def5e9e0f9e6fc0f80b_235_0.png)


    A query allows you to ask complex questions regarding your database.


    # The Tasks pane


    The upper-right pane is the Tasks pane. In here, you see what types of things
    you can do for a particular selection in the Database pane. Use the Description
    to the right decrypt any of the terms that make your eyes cross.


    # The Tables/Queries/Forms/Reports pane


    The lower-right pane shows the tables, queries, forms, or reports that already
    exist. You can open any of these to work in by double-clicking them in this pane.


    # Sitting down at the table


    Tables are the core of the database system. They are what hold your data, and
    allow you to quickly access the information. It''s a good idea to understand how
    tables are organized in Base, and how you can use them to hold and display your
    data.


    To create a new table, you can either the Base Table Wizard if you think you have
    a standard table, or you can create your own table in Design View. Figure 12-9
    shows an empty Design View dialog box.


    Each row in the Table Design represents a data field in the table. Each field
    must have a Unique Name and be assigned a Field Type. The Field Type defines the
    type of data present in the field (characters, numbers, dates, and so on). The
    Description area allows you to write a brief description of the meaning of the
    data field.


    Creating a new table is easy:


    +   1. Enter a text name for the Field Name describing the database.

    2. Select a Field Type from the drop-down menu.

    3. Enter a brief description in the Description text area.

    4. If the field is a primary key, right-click on the left of the row and select
    Primary Key.'
