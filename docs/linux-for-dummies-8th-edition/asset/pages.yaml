    out with a Linux overview that explains what Linux is, where it came from, and
    how it works. Next, we tackle the various tasks and activities involved in preparing
    for installing Linux on a PC. After that, we tell you how to get Linux the boot
    — not to get rid of it by any means, but to fix your brand-new system to reach
    the heights of computing ecstasy (at least, we hope it''s as good for you as it
    usually is for me). Finally, we help you find your way around the desktop and
    tweak it to your liking.


