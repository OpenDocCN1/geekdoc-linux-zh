  md: '# Chapter 15: Windows-Only Media Formats and Programs 261


    A plus to Cedega, is again, that you don''t need to keep those Windows (OS) CDs
    lying around. However, its support for individual games can be spotty, so be sure
    to check the Web site before you invest in this product. Also, be sure to make
    use of the help forums!


    # VMware


    If you absolutely *have* to do something under Windows itself (or vice versa,
    for that matter), there''s also VMware (www.vmware.com). This is a popular tool
    in technical support offices where people need to access many different kinds
    of machines to test things. It''s also popular with authors, like myself, because
    it allows us to grab those tricky screenshots of the boot process and installer
    screens.


    In VMware, you can run a full session of another operating system (or even an
    extra session of the one you''re running on the main machine) within your desktop
    — see Figure 15-4. If your machine is powerful enough, you could have five different
    operating systems all running in their own windows on a single computer.


    A minus to VMware is that it requires a bit of extra oom in your system. Check
    out its requirements and then try to go far *above* them as you can. It also runs
    in a self-contained window. A plus, though, this program is really the next thing
    to buying another computer. Much of the Fedora coverage over this book was gained
    by installing test/beta versions in VMware.


    There is a cool version of VMware VMware Player (www.vmware.com/products/player/)
    that allows you to download a fully installed and set up system and play with
    it. You can test out a lot of Linux distributions this way, as a matter of fact.
    You''ll find them in this section of the VMware Technology Network (www.vmware.com/mtn/applications/directory/45).


    Another free product is the VMware Server (www.vmware.com/products/server/). This
    tool allows you to install your own VMware sessions without all the fancy features
    that VMware Workstation has.'
