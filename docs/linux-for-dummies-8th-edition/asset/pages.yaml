  md: '# 306 Part IV: Junior Administrator Boot Camp


    ![](img/9e1543123a324def5e9e0f9e6fc0f80b_324_0.png)


    Figure 18-2: The Fedora Security Configuration dialog box.


    The Firewall Options tab has settings to easily configure your firewall options.
    You can enable or disable the firewall feature from the drop-down list box at
    the top of the window. If your computer is directly connected to the Internet
    — and most computers are — make sure to use Enable Firewall. The only time that
    you should not have this firewall in place is when your machine(s) are behind
    a strong firewall already, or you have a critical application that won''t work
    otherwise. For just one application, though, that''s one huge risk! You can find
    out how to open up the proper doors in the firewall for that program instead.


    Bene the firewall setting drop-down list box is another list containing the network
    services currently installed and available on your computer. Selecting a check
    box to a network service enables remote connections to that service.


    Select these items with extreme caution. Here''s a list of the most common network
    services you''ll see in the list:


    +   - HTTP and HTTPS: Web stuff; only needed if you''re running a Web server.

    - FTP: FTP server stuff; you don''t need if you''re not running an FTP server.

    - Mail (SMTP): Allows remote mail servers to send mail directly to your computer.
    If you use an ISP for your e-mail (which most users do), you don''t need to enable
    this.

    - NFS4: Network File Sharing. Enable this if you want to share folders directly
    with other Linux or UNIX computers.'
  merge: -1
