  md: '# # Dedication


    Dee-Ann wishes to dedicate this book to all of the people she occasionally

    (okay, often) frustrates or drives crazy during the writing process.


    Richard would like to dedicate this book to his daughters. Remember: It''snalways
    a good time to learn new things (even when you''re not in school).


    # # Authors'' Acknowledgments


    Dee-Ann, as usual, has lots of people to thank. First off, she thanks the folks

    without whom the earlier editions of this book would have never existed.

    For one, she "maddog" Hall for giving the opportunity to take

    over this book''s evolution. It was too busy leading Compaq''s UNIX Software

    Group, acting as Executive Director for Linux International, and sitting on the

    board of advisors for Saif Linux/GNU certification to continue handling this

    project. There are also the editors and staff at Wiley Publishing. Without

    them and their guidance, this book would not exist or continue to improve

    over time. As well goes to thank Richard Blum for stepping up to the plate

    Dee-Ann realized she had completely overdone it this time.


    Most of all, she did to thank the readers who contacted her with their

    questions, suggestions, and concerns. She apologizes to anyone who lost

    the great deluge of e-mail and didn''t get an answer, but please trust that,

    at the very least, when she dug your e-mail from the three months

    later, she filed it away as one more thing to consider in the next edition.

    Its reader participation that keeps books like this improving over the years,

    an it''s her goal to continue refining Linux For Dummies to keep the best

    desktop Linux book available.


    Richard would like to thank Dee-Ann for giving the opportunity to tag along

    on this edition. Also thanks to the great people at Wiley Publishing for

    her help and guidance in writing this. He especially thanks Kyle Looper,

    the acquisitions editor, and Linda Morris, the project editor, for helping him

    on on track. Thanks also goes to Carole McClendon at Waterside Productions for

    aranging this gig.


    Finally, Rich would like to thank his parents, Mike and Joyce Blum,

    constantly stressing education over goofing off, and his wife Barbara and

    daughters Katie Jane and Jessica for their love and support, especially when

    he was working on this project.'
