- img_proc: true
  md: '# Chapter 20: Ten Steps to Setting Up a Samba Print Server 339


    If you selected a printer manufacturer, the next step is to select the specific
    printer model from the list. If the model of your printer isn''t listed, you''ll
    have to try to download the appropriate PPD file and use that method.


    Some models have more than one PPD driver file available. In this case, usually
    one is marked as recommended. Try that first. When you''ve selected the appropriate
    printer model and driver, click the Forward button.


    +   6. Finish the install.


    The final window summarizes your selections. If you need to change anything, you
    can click the Back button to return to the appropriate wizard window. If everything''s
    OK, click Apply to create the printer definition.


    After you''ve installed the printer, or if Fedora automatically detected your
    USB printer, it''s a good idea to check over the printer configuration items.
    That''s brings us to the next step.


    # Step 4: Set the Printer Configuration


    The Printer Configuration window is divided into two panes. The left pane lists
    the items that can be configured. The right pane is used for showing configuration
    settings.


    By default, the left pane of the window shows general items:


    +   * Server Settings: Allows you to set options that apply to the print server

    * Local Printers: Allows you to set options that apply to the individual configured
    printers


    As you click on an item in the left pane, the tool presents information in the
    right window. Here are the configuration items necessary for the print server:


    +   1. Click the Server Settings item.


    When you click Server Settings, it displays a set of check boxes for items to
    configure:


    +   * Show Printers Shared by Other Systems: Scans the network for advertised
    printers and adds them to the list of available printers

    * Share Published Printers Connected to This System: Advertises all local printers
    marked as shared on the network'
  merge: -1
  pgno: 357
- img_proc: true
  md: '# Part V: The Part of the Tens


    +   - Allow Remote Administration: Allows remote connection to the printer configuration
    system


    +   - Allow Users to Cancel Any Job (Not Just Their Own): Lets others cancel print
    jobs sent to the printer waiting in the print queue


    +   - Save Debugging Information for Troubleshooting: Instructs the printing system
    to create debugging files for observing what''s happening


    +   2. Make sure that the Share Published Printers Connected to This check box
    is checked.


    By checking this setting, Samba automatically shares any printer created on the
    system. (Don''t worry if there are any printers you prefer not to share, you can
