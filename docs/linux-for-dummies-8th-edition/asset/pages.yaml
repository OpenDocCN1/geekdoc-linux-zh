    # # Making space


    You may need to utilize resize your partitions for a number of reasons. You may
    have unallocated space, but less than 10GB of it. You may have 10GB of unallocated
    space, but it''s broken up into numerous pieces across your drives and needs to
    be consolidated. (most commonly), you may not have any unallocated space at all.
    In all these situations, you need to move data around so that you have room to
    install Linux and store any files you want to keep in your Linux filesystem.


    You probably want more than 10GB of space. For example, if you download lots of
    multimedia, you''ll quickly eat whatever was left after you installed your software!
    20GB might be a better amount to shoot for — minimum.


    The key to making space is (first) to determine how much of your drive space you''re
    really using and get this information down for later.


    ![](img/9e1543123a324def5e9e0f9e6fc0f80b_45_1.png)


    +   Remember, do not try to resize Windows partitions unless a tool specifically
