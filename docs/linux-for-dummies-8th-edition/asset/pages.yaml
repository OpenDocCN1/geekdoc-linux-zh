  md: '# 256 Part III: Getting Things Done


    Unfortunately, you''ll need to do a little more work to get these clients installed
    on your Fedora computer. In this section, I cover the game Second Life as an example.


    The Second Life online game is a virtual 3-D world entirely built by players.
    It uses the power of 3-D graphics cards to walk you through an amazing array of
    locations and lets you interact with graphical “people” that represent other players.
    After you enter the Second Life world, you can interact with others to purchase
    or trade products, buy land, and even visit entertainment establishments!


    To enter the Second Life world, you''ll need the client software. The software
    is available from the Second Life Web site as an installable binary package. You''ll
    have to do some extra work to get the client installed, but it''s worth it:


