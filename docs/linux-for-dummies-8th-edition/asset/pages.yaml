- img_proc: true
  md: '# Chapter 18: A Secure Linux Box Is a Happy Linux Box 305


    +   - pcscd: The PC/SC smart card reader program. If you''re not using a smart
    card to log into your Fedora computer, you can turn this off.


    +   - sendmail: Even though you''re probably not in a full-fledged mail server,
    shutting this service off can have unintended consequences because it''s used
    to handle internal mail on your system.


    +   - smartd: If you''re getting errors for this one at boot time, shut it off.
    It only works with IDE hard drives, so if you''re not using that type of drive,
    it gives a (harmless) error.


    +   - assassin: If you want to use this program in conjunction with your mail
    program, for it! This program is used by default with Evolution in Fedora (see
    Chapter 10), so if you''re using this combination of tools, leave this service
    on.


    +   - yum: On Fedora, this program lets you run a nightly automatic update for
    those machines that are connected overnight.


    ![](img/9e1543123a324def5e9e0f9e6fc0f80b_323_0.png)


    In Fedora, when you check or uncheck a service, you need to make sure that it
    doesn''t turn on when you reboot. You need to use the Start and Stop buttons to
    start or stop it immediately. Use the bottom-right part of the dialog to see whether
    Fedora is running right now.


    # Controlling and adjusting your firewall


    Even (but just as essential) than turning off unnecessary services is to make
    sure you have a firewall in place. A firewall is like putting a big bunker around
    your house. It would then have openings that only people want to do certain things.
    Friends could fit in through one door, family another, and package deliveries
    to another.


    In computer networks, each of the services discussed earlier comes through the
    same door (port, in computer-world). You use firewalls to prevent anyone from
    being able to touch a door, or, unless you''ve explicitly set it up so they can
    do. This technique is especially important if you''re on a cable or DSL network
    (see Chapter 10), where there''s always some overactive jerk out there using his
    computer to knock on every other computer on the network''s doors to see where
    it can get in.


    You probably already did basic firewall setup during installation. If you ever
    want to make changes, choose System-Administration- Firewall and SELinux (you
    may be asked to enter your root password along the way). You should see the Security
    Level Configuration window, shown in Figure 18-2.'
  merge: -1
