  md: '# 374 Part V: The Part of Tens


    Linux allows you to use spaces and other characters in filenames that you may
    not be able to use in filenames on other operating systems. However, some Linux
    applications may stumble when they encounter file or directory names containing
    spaces. Usually, a safe bet is to stick with alpha-numeric characters and avoid
    spaces and odd characters, such as question marks and exclamation points.


    ![](img/9e1543123a324def5e9e0f9e6fc0f80b_392_0.png)


    # “Aarghh! I Forgot My Root Password! What Do I Do?”


    Fear not. You have a way around this problem! You need to boot into singleuser
    mode, which you can accomplish by rebooting your machine. When you see the blue
    screen with the words “Press any key to enter the menu,” press a key. At the GRUB
    boot screen, press E, which takes you to a configuration file. Use the arrow keys
    to go to the line starting with kernel, and press E again to edit that line. At
    the end of the line, add the word single, press Enter to put the change into place,
    and then press B to boot the machine.


    Type passwd and then enter the new password twice as directed. When you finish,
    type exit and then boot the machine normally.'
