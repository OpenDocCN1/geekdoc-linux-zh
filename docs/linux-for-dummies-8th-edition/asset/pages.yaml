  md: '# 58 Part I: Getting Your Feet Wet


    # Giving Linux the Boot


    Face it: As enjoyable as the experience of staring at a dormant computer is, the
    real fun starts when you turn it on. As any electronic device, opening the electron
    flood is the first step to fun. A computer, however, can do much more stuff than
    your toaster oven. Rather than warm a simple heating element, your computer can
    chill all those gizmos that you (or the manufacturer) plugged into your motherboard.
    After the initial power-up, your computer performs some hardware tests (called
    the POST, or Power-Up Self-Test) to determine whether those various components
    are working properly.


    Checking all your hardware is just the beginning. Between the time you turn the
    computer and the moment the glowing phosphor on your monitor prompts you for a
    login name, the computer is building itself an empire. If you listen and watch
    carefully, your computer and monitor show signs of the boot process through beeps,
    buzzes, whirring motors, clicks, messages on the monitor, and blinking lights.


    Although you have heard the cliché ''Rome wasn''t built in a day,'' the boot process
    goes fairly quickly. This is pretty amazing, considering that the architecture
    of an operating system makes Rome''s look like a stack of cardboard boxes; each
    time you power up your computer, it must build its whole operating system in memory.
    (Remember that an operating system is the core software that makes your computer
    work.) This process can be broken into four main steps, which I discuss in the
    following sections.


    # Step 1: Power-On Self-Test (POST) leads to BIOS


    The POST process really has nothing to do with the operating system. Your computer
    performs this step when you''re running Linux or another operating system, such
    as Windows Vista.


    Some symptoms of a failed POST include


    +   - An unusual series of long and short beeps

    - Nothing displayed on the monitor

    - No apparent activity other than the whirring fan of burning electrical components
    from your computer case

    - An error message, displayed on the monitor, indicating a hardware failure'
  merge: -1
  pgno: 76
- img_proc: true
  md: '# Chapter 4: Booting and Stopping Fedora


    If you encounter any of these problems, you have hardware troubles that need to
    be resolved before you can proceed. If your computer was running properly before
    you began your Linux installation, your computer should be getting through the
    POST just fine — POST problems don''t tend to be caused by installing a new operating
    system; they''re far more fundamental to the computer itself.


    For all the last of these errors, it''s time to question your nephew Mortimer,
    who was seen lurking around your computer with a screw-driver. (Or take your computer
    into a computer repair shop!) If you see an error message indicating a hardware
    failure, you might have a shot at fixing the problem in the BIOS. As the POST
    does its thing and finishes up, it briefly displays (at the bottom of the screen)
    instructions on how to enter “setup” (which refers to the BIOS). Typically, these
    instructions mention pressing the DEL key or a function key as F1. When you press
    this key (provided all goes well), you usually see a blue screen with black-and-white
    text. This is the BIOS. From here, if you''re familiar with your hardware, you
    can try to figure out and fix the problem. However, many people would rather a
    root canal with no anesthesia than mess with this stuff; so you may grab the nearest
    teenager or computer-repair wizard and entreat them to take a look.


    The good news is that if you can get to the BIOS at all, the problem may be easier
    to fix than one where the computer fails before you reach the BIOS.


    # Step 2: The BIOS passes the baton to the boot loader


    After the BIOS gives the okey-dokey with a successful POST, the BIOS locates the
    first hard drive in your system and reads the first sector of that disk, which
    is often referred to as the MBR (Master Boot Record). On that first chunk of disk
    is a small program called a boot loader. The boot loader doesn''t know much about
    anything, except how to start loading your operating system.


    Two boot-loader programs understand how to load a Linux operating system: LILO
    (Linux Loader) and GRUB (Grand Unified Boot loader). LILO has been a tried-and-true
    boot loader for as long as Linux has been a gleam in a geek''s eyeball; GRUB is
    newer — and much more sophisticated. Many distributions allow you to choose your
    boot loader. Typically, most people stick with the defaults, which in the case
    of Fedora is GRUB.'
  merge: -1
