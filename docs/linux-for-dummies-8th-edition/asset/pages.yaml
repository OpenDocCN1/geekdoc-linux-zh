  md: '# 258 Part III: Getting Things Done


    If you find that you actually need to run a Windows program under Linux, both
    commercial and free options are available, although far more commercial options
    exist. This chapter looks at both possibilities so you can choose what meets your
    needs.


    # Commercial Software


    A growing number of commercially available tools let you work with anything from
    Microsoft Office to your Windows games under Linux. Mind you, lately Linux''s
    goal is not to use any of these extra program layers—but in the meantime, it''s
    nice not to be inconvenienced. I''ve reviewed, or at least used, every one of
    these products (often more than once over the years), so I''m not just going by
    their Web sites.


    ![](img/9e1543123a324def5e9e0f9e6fc0f80b_276_0.png)


    Many of these vendors offer server, as well as desktop, products. I''m focusing
    on the desktop. For more about their server products, check out their Web sites.


    # CodeWeavers


    CodeWeavers (www.codeweavers.com) provides an excellent product that I use from
    time to time: CrossOver Office—don''t let the name fool you, CrossOver supports
    games now as well. This program allows you to use Microsoft Office (along with
    a growing number of office applications) directly under Linux. It also has a hefty
    number of plug-ins (see Figure 15-1) that you might miss when it comes to Web
    surfing. It''s a bit jarring to run Microsoft Word and Windows Media Player under
    Linux first—because there''s no native (without special software) way to do otherwise—but
    it''s certainly fine. You can even use iTunes through CrossOver Office!


    What I most appreciate about CodeWeavers (and all these companies, really) is
    that they are very upfront about what works really well, what except for a few
    features, and what doesn''t. You all have to check their Web site. For those who
    want to scream "piracy" when it comes to Linux, you actually have to own the programs
    you want to run (say, Microsoft Office) and install them through CrossOver Office
    off their CDs or DVDs. However, you don''t have to own the version of Microsoft
    software that runs under. CodeWeavers has built a reimplementation of the necessary
    Windows functionality under the hood.


    A plus to CodeWeavers CrossOver Office is that the applications run in individual
    windows like every other program on your machine. A minus is that not all Windows
    software is supported because hooks have to be built under the hood for each new
    program.'
