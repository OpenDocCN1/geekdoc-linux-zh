- img_proc: true
  md: '# 326 Part V: The Part of Tens


    Network bridges are used to bridge a gap in the network. They connect two network
    systems together on the same router subnet. Routers are used to move traffic between
    two dissimilar networks, whereas bridges move traffic between similar networks
    that must be joined.


    The bridging software required for this project is already prepackaged in a Fedora
    software package. The bridge-utils package contains all the software components
    you need to build your network bridge. All you need to do is install the package.


    +   1. Click Applications:Add/Remove Software.


    This starts the Package Manager tool. If you''re not logged in as the root user,
    you will be asked for the root password to continue.


    +   2. Click the Search tab to search for a software package.


    +   3. Type bridge-utils in the text box, and click the Search button.


    When the search completes, you''ll see the current bridge-utils package listed
    in the results window.


    +   4. Select the bridge-utils entry, and then click Apply to start the installation.


    You''ve completed the software installation: next, you will need to use the bridging
    software to create the bridge.


    # Step 5: Build a Bridge


    Building the bridge is possibly the most complicated of all the steps. Unfortunately,
    there aren''t any fancy graphical tools to help you out here. You have to dig
    into the Fedora command line and do the old fashioned way — typing commands one
    by one at the command prompt.


    The Linux bridging command you need to use is brctl. This command allows you to
    create a network bridge, add network interfaces to the bridge, and monitor the
    bridge.


    The format of the brctl command is


    ```

    brctl [command]

    ```


    where command is the bridging command to execute. The brctl commands you''ll use
    are shown in Table 19-1.'
  merge: -1
  pgno: 344
- img_proc: true
  md: '# Chapter 19: Ten Steps to Making Your Own Wireless Access Point 327


    | Command | Description |

    |---|---|

    | addbr | Create a new network bridge |

    | delbr | Remove an existing network bridge |

    | addif br | Add network interface if to bridge br |

    | delif br | Remove network interface from bridge br |

    | stp state | Set the spanning tree protocol for bridge br to or off |


    To execute command lines, you''ll need to open a Terminal session:


    +   1. **Click Applications:System Tools:Terminal.**


    The Terminal appears, showing a command line prompt.


    +   2. **If you are not already logged in as the root user, you must be the root
    user.**


    To do that at the command line, type su, and then enter the root password. The
    command line prompt changes to a pound sign (#), indicating you are now the root
    user.


    +   3. **Create a new bridge instance called br0.****


    Use the brctl command to create a new bridge:


    ```

    brctl addbr br0

    ```


    This command creates a new bridge called br0.


    +   4. **Temporarily disable the Ethernet interfaces.**


    Before adding the interfaces to the bridge, you need to stop them from receiving
    network traffic. To do this by using the ifconfig command:


    ```

    ifconfig eth0 down

    ifconfig eth1 down

    ```


    +   5. **Add the network cards to the newly created bridge.**


    Again, use the brctl command to add the wired network card by using the interface
    name found in Step 2, and the wireless network card by using the interface name
    found in Step 3:


    ```

    brctl addif br0 eth0

    brctl addif br0 eth1

    ```'
