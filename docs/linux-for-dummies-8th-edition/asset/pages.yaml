    # Step 9: Create Shared Folders in Samba


    The final piece of the puzzle is to tell Samba what shared folders we want to
    advertise on the network and allow network clients to connect to. This is done
    in the Samba Configuration window.


    +   1. Click the Add Share button.


    The Create Share window appears. From here, you define the details of the shared
    folder:


    +   * Directory: Type the full pathname of the folder you want to share. You can
    also click the Browse button and select the folder.


    +   * Share Name: Type the name you want Windows network clients to connect to
    the share.


    +   * Description: Type a simple description that will be advertised with the
    share name to remote clients.


    +   * Writable: Check this check box if you want to allow remote clients to be
    able to write to the shared folder. You must also have the Linux permissions set,
    as shown in the earlier sections in Steps 3 and 4, for them to write. This is
    a handy way to allow remote clients to write to the share in case of any emergency.


    +   * Visible: Select this check box if you want remote clients to see the share
    advertised when they browse the network.


    Enter /accounting folder for the directory. As Samba enters a suggested name as
    well (which is usually the same as the folder name). Figure 21-9 demonstrates
    configuring the accounting folder.


    +   2. Click the Access tab and select which users have access to the shared folder.


    Samba allows you to assign access for individual Linux user accounts configured
    on the computer. You can either select the check box to allow access for all users,
    or select individual users from the list. Allowing all users isn''t a bad thing
    because the Linux permissions still block out unauthorized users from the share.'
