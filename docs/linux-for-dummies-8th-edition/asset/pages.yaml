  md: '# Chapter 18: A Secure Linux Box Is a Happy Linux Box 307


    +   - SSH: Select this one to keep open. I explain it in the next section.

    - Samba: Allows remote Microsoft computers to share files and printers on your
    Fedora computer. If you are connected to a local network net, you may need to
    enable this to share files. If you are directly connected to the Internet, it
    is not a good idea to have this enabled.

    - Telnet: Please don''t enable this one. It''s used for remote interactive sessions
    with your computer, and is extremely uneasy in today''s world.


    # The Secure Shell game (SSH)


    One thing about Linux is that you can use the command line to connect your account
    from anywhere, as long as you have the right software (and the machine you''re
    connecting to isn''t behind some kind of blocking software).


    ![](img/9e1543123a324def5e9e0f9e6fc0f80b_325_0.png)


    Some people tell you to use the telnet program to do this, but I beg you not to.
    Again, do not open the Telnet port in the security tool and do not use the telnet
    program. It sends information across the Internet in nice, raw text that anyone
    can sniff through.


    First, you need to make sure that you have SSH installed, that you have an SSH
    server running, and that you enable SSH in your firewall.(See the section "Controlling
    and adjusting your firewall," earlier in this chapter, to handle the third concern).


    By default, Fedora installs both the SSH software and starts the SSH server to
    accept SSH connections from remote computers. If you don''t want to provide this
    feature, you can stop the SSH service using the Service Configuration discussed
    earlier in the "Controlling your services" section.


    If you elect to keep the SSH server running on your Fedora computer, you can use
    any SSH client software to connect to the Fedora computer from a remote computer.
    The software that you''ll need depends on what type of computer you''re trying
    to connect.


    # Installing a Windows SSH program


    If you want to connect to your SSH-enabled Linux box — or, actually, to any computer
    set up to accept SSH connection, not just a Linux one — from a Windows computer,
    you have several excellent choices of software packages available to choose from.'
  merge: -1
  pgno: 325
- img_proc: true
  md: '# 308 Part IV: Junior Administrator Boot Camp


    One popular SSH client package for the Windows world is PuTTY. This is a free
    software package released under the MIT license — similar to the GNU GPL — so
    you can use it to your heart''s content without paying a dime.


    The home page for PuTTY (http://www.chiark.greenend.org.uk/~sghtam/putty/) provides
    a Download link to the download area. Here, you can select which version of PuTTY
    to use (you can even download the program source code and play it with yourself
    if that''s what you''re into). The easiest way to get PuTTY running on your Windows
    PC is to select the putty.exe binary for download. This is the complete PuTTY
    program in one single file.


    After downloading the putty.exe file, locate where you downloaded it on your computer
    using your file manager (such as Windows Explorer) and double-click it. The main
    PuTTY window, shown in Figure 18-3, appears.


    ![](img/9e1543123a324def5e9e0f9e6fc0f80b_326_0.png)


    All there is all to it: PuTTY doesn''t require any installation setup. You''re
