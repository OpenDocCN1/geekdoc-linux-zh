    # Working with Draw files


    At first glance, OpenOffice.org Draw appears to have the most limited file type
    for saving when you use the Save As dialog box. From there, the only files you
    can save a document as


    +   * OpenDocument Drawing (.ODG) format: The OpenOffice.org proposed standard
    for graphics files

    * OpenOffice.org 1.0 Drawing (.XD) format: The older OpenOffice.org graphics format

    * StarDraw 3.0 (.SDD) format: The older Sun StarDraw format

    * StarDraw 5.0 (.SDA) format: The newer Sun StarDraw format


    That''s not much to work with, especially when dealing with picture files. Fortunately,
    Draw has save images to a format other than the standard formats by choosing File->Export.


    This produces a host of supported graphics formats: BMP, EMF, EPS, GIF, JPEG,
    MET, PBM, PCT, PGM, PPM, RAS, SVG, SWF (Flash), TIFF, WMF, XPM. That should satisfy
    any computer artist.


    # Managing Data with OpenOffice.org Base


    Those who are using Microsoft Access, or who have to interact with a variety of
    database products, have been in the past left scratching their heads and wondering
    how best to handle these needs under Linux. Well, wonder no more! OpenOffice.org
    Base provides an interface to both Microsoft Access files and to other databases.'
