- img_proc: true
  md: '# Chapter 12: Word Processing and More with OpenOffice 203


    To use this wizard, follow these steps:


    +   1. Leave the Empty Presentation option selected (unless you have a template
    you need to work from) and click Next.

    2. If you want to select one of the default slide backgrounds that come with OpenOffice.org
    impress, you can do so by looking to the Select a Slide Design drop-down list,
    choosing Presentation Backgrounds, and then clicking the various options to see
    what they look like to the right of the dialog box.

    3. By default, there aren''t many background templates. This is one area where
    StarOffice offers added value.

    4. If you want to select a presentation (content) layout template that was designed
    specifically for the template you chose in this dialog box''s screen 1, you can
    do so by looking to the Select a Slide Design drop-down list, choosing Presentation(s),
    and then selecting the presentation type you want to use.

    5. Again, you find limited options here by default.

    6. If you want your presentation ultimately to appear on something other than
    a computer screen, adjust the Select An Output medium to match its intended sending.


    Your choices are Screen, Overhead Sheet, Slide, and Paper.


    +   5. Click Next to proceed.

    6. Under Select a Slide Transition, experiment with the various options in the
    Effect and drop-down list boxes to narrow how you move from one slide to another.

    7. If you want to navigate manually from one slide to the next (the Default option)
    while you give your presentation, skip to Step 10. If you want to have your presentation
    advance automatically, click the Automatic option.

    8. In Duration of Page, set how long you want each slide to stay up.

    9. In Duration of Pause, set how long of a blank gap you want to have between
    slides.

    10. After you have your settings selected, click Create to proceed.


    If you have Show Logo checked, the OpenOffice.org logo appears during the blank
    pauses.'
