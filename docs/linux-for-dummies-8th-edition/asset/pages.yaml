    # Presentations with OpenOffice.

    Impress


    Most people would rather eat glass than in front of a group. Still, if you have
    to, you may well have some cool software to back you up. This program is what
    I use when I speak at conferences. (Use it even when my clients want me to send
    it in my presentation in Microsoft PowerPoint format. Shh! Don''t tell — they
    don''t know the difference!) Give OpenOffice.Impress a chance to impress.


    # Using the Presentation Wizard


    When you open OpenOffice.Impress, the first thing that launches is the Presentation
    Wizard (see Figure 12-3), which you can open later manually by choosing File::Wizards::Presentation.
    If you don''t want this wizard to show up the next time you open OpenOffice.org,
    then click the Do Not Show This Dialog box.


