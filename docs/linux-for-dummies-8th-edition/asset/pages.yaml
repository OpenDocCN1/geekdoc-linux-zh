  md: '# Chapter 9: Connecting to the Internet


    # Beware of devices posing as modems


    Many Linux newbies have become irritated by not being able to communicate with
    their internal modals. "After all," the newbie reasons, "the same hardware works
    when I was running Microsoft Windows."


    other operating systems even though their hardware will work with those operating
    systems.


    +   - Windows recognizes your modem, but Linux doesn''t.


    Well, here''s the story: Years ago, hardware manufacturers developed a device,
    called a software modem, in an effort to reduce hardware costs. The idea was to
    try some responsibility from the modem and delegate tasks to the software. The
    result was an inexpensive modem that routed signals to proprietary software that
    operated only under Microsoft Windows. Also, these-called ''softModems'' aren''t
    really modems at all, but rather, telephone cable interfaces to Windows.


    In short, if you determine that you have a soft modem, Linux simply doesn''t work
    with it. For the adventurous out there, the LinModem project (linmodem.org) has
    successfully written Linux drivers to work with a few of these soft modem. I encourage
    you to work in this type of project, if you''re moved. These explorers drive the
    wonderful world of freedom software, which is a prominent part of.


    The following list shows methods you can use to determine whether you have a software
    modem:


    +   - The model number has a HCF, HSP, or HSF in it.

    - The packaging refers to the device as a WinModem or designates that it works
    with only Windows (though sometimes these labels can be misleading some manufacturers
    just don''t listen to


    The bummer in all this is, although you probably saved a few by buying a machine
    with a software modem, you most likely need a real modem to work with Linux (unless
    you are lucky enough to have a LinModem). Your best bet is to purchase an external
    modem so you can leave the software modem in place and have the external one just
    for Linux (or any other computer you may move to it later).


    Dialup modems: The dialup modem is widely used in areas where broadband is not
    available or not affordable. It translates the digital signal from the computer
    into an analog signal for transmission from the wall jack to the telephone company.
    Because the modem utilizes existing voice telephone service, you don''t need any
    special setup before subscribing to ISP. However, you can''t use the same phone
    line for both dialup and a phone conversation at the same time. See the sidebar
    "Beware of devices posing as modems" for additional concerns if you''re the dialup
    route.'
  merge: -1
  pgno: 155
- img_proc: true
  md: '# 138 Part II: Getting Up to Speed with Linux


    **Wireless**: The realm of wireless networking is where Linux today may give you
    the most trouble, depending on what kind of wireless you''re using. Four types
    of wireless exist, and they''re often referred to as a group as WiFi (802.11a,
    802.11b, and 802.11g, or just A, B, G, and Bluetooth). A and B are also the best
    supported in Linux so far, because again, they''ve been around the longest. G''s
    security is what you should aim for; also also of complexity that require more
    cooperation from the manufacturers of the cards. Many wireless cards today are,
    in fact, capable of doing more than these types, so if you don''t own one, that
    one supports both B and G.


    The best advice I can give you is to do a search on the market and model of your
    wireless card (or the one you''re thinking of), use the word Linux, and see what
    you find— and, of course, you can check the hardware compatibility for distributions
    as well. Because this area is where technology is quickly advancing, always check
    the dates on the resources you find and make sure that they''re recent. A resource
    that six months old can mean you''re getting out-of-date information. Some useful
    links (some are more advanced than others) for this topic include the:


    +   - A posting on my for Fedora users (apologies for the long URL): http://dee-ann.blog-city.com/wireless_setup_on_emachine_m510_notebook.htm

    - The Linux Networking Quick HOWTO: www.linuxhomenetworking.com/linux-hn/wmpl1-linux.htm

    - Wireless LAN resources for Linux: www.hpl.com/personal/Jean_Tourrilles/Linux/

    - A method for using Windows wireless drivers in Linux: www.linux.com/driverloader

    - Network Topology Guide: www.homenethelp.com/network


    **Integrated Services Digital Network (ISDN)**: Not too long ago, ISDN was one
    of the really residential high-speed options. It appeared when 28 Kbps (half the
    speed of today''s regular duplex modems) was about all you could milk from the
    copper strands that connect your telephone to the telephone company. ISDN is still
    available in some areas and promises a steady 128 Kbps — as long as you''re within
    3.4 miles of the telephone company''s central office. You need two special devices
    to use ISDN: a modem (typically provided by the ISDN ISP) and a net adapter (sometimes
    an Ethernet card). Because ISDN is used so little these days, not many specific
    sites are devoted to it. The overall modem HOWTO (www.tldp.org/HOWTO/Modem-HOWTO.html)
    does contain pointers to the latest ISDN information, as well as just being plain
    to intend.'
