  md: '# # Appendix B


    # # About the DVD-ROM


    The DVD-ROM included with this book contains everything you need to install and
    run Fedora 7. This is the equivalent of the CD-ROM collection you would have to
    download from the Fedora Project''s Web site and includes the following:


    +   - **Fedora 7**: A complete copy of the software for the latest and greatest
    version of the Red Hat-sponsored free version of Linux, for your computing pleasure.
    If you are interested in the source code, you can download it directly from Red
    Hat''s Fedora Project site at http://fedora.redhat.com.

    - **RPM (Red Hat Package Manager) and Yum**: The Red Hat software distribution
    and installation management environment, wherein Linux updates and new features
    are packaged for every installation on your machine. Yum makes it easier to install
    and update software, running behind the scenes of the graphical tools to take
    care of you.

    - **KDE (K Desktop Environment) and GNOME (GNU Network Object Model Environment)**:
    The two leading graphical user interfaces for Linux. You can pick the one you
    like! We focus on GNOME in this book.

    - **Mozilla Firefox**: The best-of-breed Web browser for your Linux machine, just
    waiting for your pleasure.

    - **Samba**: The best way to integrate Linux servers with Windows servers. Samba
    lets your Linux machine masquerade as a Windows server so that Windows users can
    grab files and print documents hassle-free.

    - **Apache Web Server**: The world''s most popular (or at least, most frequently
    used) Web server software.

    - **Games!**: Tons of games; enough to help you procrastinate for weeks!

    - **OpenOffice.org**: A full-featured and popular office suite.'
