  md: '# Chapter 16: Adding Software to Linux 269


    ![](img/9e1543123a324def5e9e0f9e6fc0f80b_287_0.png)


    WinZip (www.winzip.com) can handle .gz, .tgz, and .tar.gz files (along with the
    .bz2 versions) for Windows users.


    # Compressing and Packaging Files to Share


    Isn isn''t all about “take, take, take” (or at least I should hope not!). Some-times
    you''ve just gotta give. Creating packages to share with other folks involves
    finding how to tell Nautilus you want to do.


    To unpack and compress files for sending off to other people, navigate to the
    location where you''ve stored the file(s) — see Chapter 8 for how to move about
    Nautilus — and then:


    +   1. Determine whether you want to compress or package a single file, a group
    of files, or a whole folder.

    If the files and folders that you want to bundle together are flung all over the
    place in your filesystem, you may want to create a new folder and copy the items
    you want to bundle into it — just for the sake of convenience. Chapter 8 shows
    how to do so.


    +   2. Select the item(s) you want to package.

    Chapter 8 explains how to do so. If you want to select a whole folder, navigate
    into its parent folder and select the folder''s icon instead of entering it.


    +   3. Right-click over the item(s) (or choose the Edit Menu).

    The context menu appears if you right-clicked or, in Nautilus, the Edit menu opens.


    +   4. In the context or Edit menu, choose Create Archive.

    The Create Archive dialog box appears, suggesting a tarball (refer to Table 16-1)
    version of the file.


    +   5. If you want a tarball, leave it alone, or change the file extensions (as
    discussed in Table 16-1) to match what you want.


    +   6. Click Create.

    Nautilus uses the end of the file''s name to see what kind of compression to use.'
  merge: -1
  pgno: 287
- img_proc: true
  md: '# 270 Part IV: Junior Administrator Boot Camp


    7. If you want to rename the file or change where it should go in your filesystem,
    do so now.


    Leave the .tar.gz or .gz part alone. Just change the first part. For example,
    if you''re archiving the Files folder, the suggested name might be Files.tar.gz.
    If you want to use Files100305.tar.gz for the actual name, just add the date into
    the existing name.


    8. Click OK.


    The archive is created.


    # Updating Fedora


    Fedora, by default, runs a utility that automatically reaches out to the Internet
    and checks for available operating system and software updates. You can either
    wait on this utility to tell you something new is available, or you can update
    your system manually. Most people do a mix of the two, accepting automatic updates
    when it''s convenient, and refusing to go back later manually when it isn''t convenient.


    # Automated updates


    If you''re connected to the Internet and an update becomes available, a white
    notification box appears in the upper-right of your screen proclaiming "Updates
    Available" and telling you how many. Click Updates to open the Package Updater,
    and follow the instructions in the next section, "Manual updates," for how to
    update your computer.


    # Manual updates


    If you closed "Updates Available" box or just haven''t tried to update your machine
    in quite while, you can start the updater manually. To do so:


    +   1. Select Applications...Software Updater.


    This action opens the Package Updater (pup) dialog box, as shown in Figure 16-1
    — you may first be asked to enter your root (administrative password). You will
    likely have to wait while the tool reaches out to the Internet and loads update
    information. When this process is complete, the progress dialog closes and you
    can see all the available updates.'
  merge: -1
