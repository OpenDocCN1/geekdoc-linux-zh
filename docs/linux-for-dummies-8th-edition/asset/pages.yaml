  md: '# Chapter 14: Messing with Video and Graphics 255


    After you''ve installed the video driver, you need to activate it on the computer.
    To do that, you need to use your command line interface skills from Chapter 6:


    +   1. Start a command line prompt session by choosing Applications Tools: Terminal.

    2. Become the root user by typing su, and entering the root password.

    3. Shutdown the X server by using the init command.


    The command for this is


    ```

    init 3

    ```


    +   4. Enable the 3-D video driver.


    To enable the NVIDIA driver, type:


    ```

    nvidia-config-display enable

    ```


    To enable the ATI video driver, type:


    ```

    ati-fglrx-config-display enable

    ```


    +   5. Restart the X server by using the init command.


    The command to do this is


    ```

    init 5

    ```


    You now have your 3-D graphics card working with Fedora! There are lots of 3-D
    games available in the standard Fedora software repositories:


    +   - freedom: New episodes for the popular DOOM2 game

    - bflag: A tank versus battle game

    - openarena: Based on the Quake III arena game

    - scorched3D: Based on the Scorched Earth game

    - neverball: A table tilt ball game

    - neverputit: A miniature golf game

    - pracer: Racing The penguin down a mountain slope


    If you prefer more exciting games, many popular gaming sites (such as icculus.org)
    provide Linux versions of lots of graphical open source games. Many of these games
    exploit advanced 3-D graphics to provide a realistic-gaming environment.


    If online 3-D games are your preference (or is that addiction?), you won''t be
    left out in the cold with Fedora. Some of the most popular online 3D gaming sites
    are starting to embrace the popularity of Linux and providing Linux clients.'
