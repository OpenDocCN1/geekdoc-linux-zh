    inside your machine. This tool is shareware, and the usage fee information is
    available from the Gebhard Software Web site (www.dr-hardware.com/).


    +   - Gathering information by reading when the computer starts. If your system
    doesn''t contain any operating systems and you don''t have any of your system''s
    documentation, you can resort to the screen as your computer boots. On some systems,
    the information is displayed as the computer boots several times to read the information.
    You may have to reboot if it goes too fast. Some systems display the PCI components
    and their setting is starting up. Again, you may have to reboot several times
    to gather all the information.


    +   - Access the Basic/Output System (BIOS) information. Stored in a small area
    of memory and retained by a battery: this is sometimes referred to as CMOS (Complementary
    Metal-Oxide Semiconductor), which indicates the type of chip that can store and
    retain information. The amount of information stored in the BIOS can range from
    very little to a lot. Some newer systems may display several screens of information
    about the computer''s hardware.


    You can try pressing the Pause-Break key on your computer (it should be the Scroll
    Lock key) to freeze it during. You can unfreeze it by pressing any key when you
    have finished reading.


    If you choose to access the BIOS, make sure you do so before operating systems
    load. Most manufacturers indicate the keyboard key (or key sequence) that gets
    into the BIOS (or Setup) on-screen when the system is starting up — for example,
    Press Del to enter Setup. If you can''t find the keyboard sequence, check the
    manufacturer''s Web site. After you''ve entered the BIOS, you typically navigate
    around it with the arrow keys, Tab, key or enter. Some BIOS environments also
    use the function keys; look for a list of function-key options at the top or bottom
    of the screen.


    Be wary of labels on hardware boxes and Web sites that include the term Win (as
    in Windows). These components, like WinModems, rely on Microsoft Windows to be
    able to function — worse, the packaging may show nothing that suggests this limitation.
    A very slight chance exists that you can find a Linux driver for Win hardware.
