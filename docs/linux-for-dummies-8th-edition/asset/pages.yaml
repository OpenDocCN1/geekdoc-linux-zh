  md: '# # About the Authors


    **Dee-Ann LeBlanc.** RHCE (Red Hat Certified Engineer), is a writer, course developer,
    journalist, and trainer who specializes in Linux. Although these various professions
    may sound scattered, they in fact reinforce one another by allowing her to see
    what people are doing with Linux in the real world and where they need help. In
    the past, she has been the Linux Games editor for *Linux Journal*, the Desktop
    editor for *LinuxToday.com*, and has written and held positions with other Linux
    and technology publications such as *Computer Power User* magazine. She has also
    written numerous books about Linux. Today is the SplunkBase Knowledge Manager
    for Splunk (www.splunk.com), an IT search company. It is her job to build a community
    around SplunkBase (www.splunkbase.com) that fills this IT troubleshooting resource
    with world-class content.


    When Dee-Ann isn''t managing, teaching, developing course materials, writing technical
    nonfiction, writing fantasy and science fiction, interviewing people, chatting
    about Linux online or at conferences, or trying in one way or another to save
    the world, she hikes with her dogs and tries out new recipes on her husband Rob.
    See at www.Dee-AnnBlanc.com and http://dee-ann.blog-city.com/. (Contact Dee-Ann
    at dee@renaissance.com).


    **Richard Blum** has worked in the IT industry for more than 20 years as a network
    and systems administrator. During that time, he''s had the opportunity to work
    with lots of different computer products, including Windows, Netware, Cisco, Avery,
    various flavors of UNIX, and of course, Linux. Over the years, he''s volunteered
    for several non-profit organizations to help support small networks that had little
    financial support. Rich is the author of several Linux-based books for total Linux
    geeks, and a couple of Windows-based books for programmers.


    When he''s not being a computer nerd, Rich plays the electric bass in a church
    worship band, and enjoys spending time with his wife, Barbara, and their two daughters,
    Katie Jane and Jessica.'
