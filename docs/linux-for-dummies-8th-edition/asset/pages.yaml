  md: '# 16 Part I: Getting Your Feet Wet


    greatest respect for copyright. Bandits who claim they’re “just being open source”
    when they steal other people’s hard work is grossly misusing the term to soothe
    their own consciences.


    Many have also pointed out that if copyright is violated in open source, it’s
    easy to tell. The news and notice how often large software corporations are convicted
    of stealing other people’s code and incorporating it into their work. If the final
    product is open source, it’s easy for anyone to look and make sure nothing stolen
    is in it. As you might imagine, tracking down such copyright violations is much
    more difficult in a closed source scheme.


    # Packaging Linux: The Distribution


    Many people call a Linux distribution is actually the culmination of the GNU project’s
    tools, the Linux kernel, and any number of other open source (and closed source)
    software products that sprang along the way.


    Robert Young, cofounder and current chairman of Red Hat, has coined an analogy
    comparing Linux to ketchup. Essentially, the operating system called — including
    the GNU tools, Linux kernel, and other software — is a freely available commodity
    that, like ketchup, different distributors can pack and label in different containers.
    Anyone is encouraged to package and market the stuff, even though the ingredients
    are fundamentally the same.


    Linux is a complex, malleable operating system, and it can take on many appearances.
    The greatest Linux advancement in recent years has been easier installation. After
    all, the tools that today enable the casual PC user to install Linux weren’t originally
    available. Companies such as Red Hat saw this as an opportunity to add value to
    an existing product, and the concept could take off like gangsters.


    Draw again on the ketchup analogy, various distributions of Linux have a slightly
    different flavor or texture; your distribution preference may be spicy, mild,
    kinda or runny. However, you can rest assured that any of the following distributions
    have the same GNU and heart and soul. Each description in this list includes a
    Web address where you can find more information about each project:


    +   Debian/GNU: This distribution — one of the oldest — is recognized favorite
    among advanced technical circles. Historically, it’s relatively difficult to install.
    Easier to install (and use) distributions with Debian underneath are Knoppix,
    Ubuntu, Xandros, and Linspin (forменно known as Linux). Of this, Ubuntu is by
    far the most popular, with a dedicated worldwide fan base. Debian, Knoppix and
    Ubuntu are free as free beer, while Xandros and Linspin are both commercial'
