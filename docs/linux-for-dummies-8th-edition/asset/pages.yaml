    # Surfing the Web


    Firefox is your viewing window into the wonderful Wide Web. Firefox''s primary
    purpose is to fetch Web pages on your command, download all their graphics and
    related files into your computer''s memory, and, finally, render the page for
    your interactive viewing pleasure.


    If you''re using Internet Explorer or Netscape, using Firefox should be a snap.
    It has all the familiar navigation tools, such as an address bar; Back, Forward,
    Reload, and Stop buttons; and a feature that stores links to your favorite sites
    (bookmarks).


    Firefox, like Netscape, also has a History sidebar — press Ctrl+H to show or hide
    it (see Figure 10-5) — which you can use to access a Web page you recently visited.


    Tabbed browsing — a feature of Firefox that may be new to you — enables you to
    open several Web sites in the same window. For many people coming from Internet
    Explorer 6 or Netscape, the tabbed browsing of Firefox may seem odd at first,
    but I think you''ll quickly fall in love with it.'
