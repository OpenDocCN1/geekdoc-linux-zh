  md: '# 136 Part II: Getting Up to Speed with Linux


    If you are dual-booting to Windows, your ISP can help you install your broadband
    connection, and then you can tinker with getting Linux connected as you have the
    time and inclination. I point to some sites in the list below that can help you
    configure your broadband connection as you look at the types available:


    +   * Cable modem: When you subscribe to a cable internet service, the installation
    technician typically provides you with a special device, called a cable modem,
    along with a standard network adapter (like an Ethernet card). The technician
    then installs the network adapter into your computer and connects the cable modem
    to it. To find out the exact speeds you need to talk to your cable provider. The
    following page provides a document that contains helpful information about various
    cable providers and Linux:


    ```

    www.tldp.org/HOWTO/Cable-Modem

    ```


    +   * Digital Subscriber Line (DSL): DSL carries data to your phone jack in a
    digital format. DSL is possible because it is faster with lower installation and
    service costs than ISDN, and it utilizes the existing copper telephone wiring
    provided by your telephone company. You can even use the same phone line as a
    regular phone! A DSL connection requires additional communication hardware, which
    your Internet Service Provider (ISP) should provide.


    Note that several variants of DSL exist:


    +   * SDN (Integrated Services Digital Network) Digital Subscriber Line (IDSL)
    — see later in this bulleted list for a definition of ISDN.

    * Symmetric Digital Subscriber Line (ADSL).

    * Generic DSL (XDSL).


    You can find out from your ISP how fast your DSL connection would be, because
    it varies. For an overview of DSL and Linux, visit the following Web page:


    ```

    www.tldp.org/HOWTO/DSL-HOWTO/

    ```


    +   * Satellite modems: Those who live in particularly remote or low-infrastructure
    areas might go the route of satellite modems (www.tldp.org/HOWTO/Sat-HOWTO.html).
    You can consider this service equivalent in ways to cable, in that you get get
    your satellite television signals. However, satellite has some drawbacks. If your
    satellite television service is unreliable, your Internet service suffers the
    same fate. The upload and download speeds can also vary dramatically.'
