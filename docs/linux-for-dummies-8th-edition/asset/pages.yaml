    rewriting the rules for the operating system marketplace.


    If you''ve contemplated switching to Linux but find the prospect too forbidding,
    you can boil water or set your alarm clock, you can become a Linux user. (No kidding!)


    When this book appeared in its first edition, Linux was an emerging phenomenon
    that was neither terribly well nor understood. In this edition for a new generation
