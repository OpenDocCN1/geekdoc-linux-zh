  md: '# Chapter 16: Adding Software to Linux 277


    +   6. Click through the Download link on that page.


    +   7. Locate and download the most specific version matching your distribution.


    You may be offered, say, Windows, UNIX, and Linux options. You would choose Linux
    in that case. If offered Linux x86 versus Linux pec, choose x86 unless you''re
    using Linux on an Apple Macintosh computer (which is not covered in this book).
    If you''re offered an RPM or a tarball (see the beginning of this chapter for
    more information on these), choose an RPM.


    +   8. After you have the program downloaded, install it as follows:


    +   * If it''s an RPM, open your file manager and double-click the download in
    order to install it. You can also install it from a command line (see Chapter
    6 for how to open a command terminal). When you have the terminal window open,
    type `su` and press Enter. You''ll be asked for your root password. Type it in,
    press Enter, and use the file system navigation commands in Chapter 7 to go to
    where you saved the RPM file, then type `rpm -tvh [filename].rpm`. This command
    will install or update the program as needed.


    +   * If it''s a tarball, open your file manager. Double-click the file to open
    it and look at its contents. There should be a file in there called README or
    INSTALL. This file contains instructions on what you need to do, and there may
    be more instructions available on the Web site itself. Working with tarballs requires
    practice; it gets easier over time, so extract the file and get to it!


    # Upgrading Your OS


    Typically, Fedora users upgrade by downloading the new version of the distribution
    (say, Fedora 8), starting the installation, and selecting Upgrade rather than
    a new install.'
