    \ investigate the contents of the Linux installation DVD-ROM, simply insert it\
    \ into your machine's DVD ROM drive. After that, you can browse through the DVD-ROM's\
    \ contents there in Windows. The contents are described in the following section.\n\
    \n# What You Find in Fedora 7\n\nHere's a summary of the software on the DVD-ROM,\
    \ arranged by directory organization. If you use Windows, the DVD-ROM interface\
    \ helps you navigate the DVD-ROM easily; you can use most of its contents if you\
    \ only have Linux installed.\n\nThe contents of the DVD consist of all installation\
    \ CD-ROMs' worth of material for Fedora 7. Not all the software is installed automatically.\
    \ You find out in Chapters 3 and 16 to customize what's added. Aside from that,\
    \ the DVD has useful utilities and a handy-dandy README file that explains exactly\
    \ what you find. The directory structure may look similar to the following (except\
    \ for my handy annotations, of course):\n\n```\n/media/cdrom\n------> RPMS --\
    \ binary packages, incl:\n            -- OS, GUIs, Apache, etc.\n------> base\
    \ -- info on release 5\n                    -- used by install process\n     \
    \               -- boot & driver disk\n                    images\n          \
    \          -- boot files\n                    software repository\n------> isolinux\n\
    ------> repodata\n            information\n------> README -- used for the install\n\
    ------> RELEASE-NOTES -- general read me file\n            release -- current\
    \ info about this\n------> RPM-GPGKEY -- GPG signatures for Red Hat pkgs\n```\n\
    \nBoth CDs include signatures, allowing the installer to check the contents of\
    \ the files against the stored security data to make sure that the files haven't\
    \ been changed. (The assumption is that all changes would be for the worse, such\
    \ as Trojan horses or viruses.) This, signatures provide a way to make sure that\
    \ everything is safe and wholesome for your computer!\n\n![](img/9e1543123a324def5e9e0f9e6fc0f80b_408_0.png)"
  merge: -1
  pgno: 408
- img_proc: true
  md: '# If You''ve Got Problems (Of the DVD-ROM Kind)


    I tried my best to locate programs that work on most computers with the minimum
    system requirements, as the Fedora team did for its operating system. Alas, your
    computer may differ, and some programs may not work properly for some reason.


    The two likely problems are that you don''t have enough memory (RAM) for the programs
    you want to use or that you have other programs running that are affecting the
    installation or running of a program. If you see error messages like Not enough
    memory or Setup cannot continue, try one or more of the following methods and
    then try using the software again:


    +   - Close all programs. The more programs you''re running, the less memory is
    available to other programs. Installers also typically update files and programs;
    if you keep other programs running, the installation may not work properly.


    +   - In Linux, close your GUI environment and run demos or installations directly
    from a command line. The interface itself can tie up system memory or even conflict
    with certain kinds of interactive demos. Use the command prompt to browse files
    on the DVD-ROM and launch installers or demos.


    If you have trouble with the DVD-ROM, please call the Wiley Product Technical
    Support number at 1-800-762-2974. Outside the United States, call 1-317-572-3994.
    ... Wiley Publishing provides technical support only for installation and other
    general quality control items; for technical support on the applications themselves,
    consult the program''s vendor or author.


    To place additional orders or to request information about other products, please
    call 1-800-225-5945.'
