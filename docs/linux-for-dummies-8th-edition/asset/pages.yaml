    # Playing the Shell Game


    You need a way to tell the computer what you want to do. In Linux, one of the
    ways to communicate with the computer is through something called the shell. A
    shell is not a graphical thing; it''s the sum total of commands and syntax you
    have to do for your work.


    The shell environment is rather dull and boring for graphical desktop standards.
    When you start the shell, all you see is a short prompt, as a s$, followed by
    a blinking cursor around your keyboard entry. (Later in this section, I show you
    a couple of methods for accessing the shell.)


    The default shell used in Linux is the bash shell. This work environment is based
    on the original UNIX shell, which is the Bourne shell and is also referred to
    as sh. The term bash stands for Bourne again shell. bash comes with most Linux
    distributions. You can start a bash session by selecting Applications;System Tools;Terminal.
    If you use your shell prompt quite a bit like I, it''s handy to use what you discovered
