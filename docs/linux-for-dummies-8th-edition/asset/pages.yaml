  md: '# Chapter 10: Using the Internet


    # Advanced preferences


    This section provides four tabbed sections of settings for more advanced features
    that you won''t need to mess with:


    +   - **General**: The General tab lets you set up features for the movement impaired,
    extra browser features, and the languages you can read in the order of preference.

    - **Network**: Click the Settings button in the Connections section if your network
    administrator told you that you have to use *proxy servers* to access online content.
    The Cache section allows you to see how much disk space Firefox is consumed when
    storing Web page content. This allows Firefox to display the pages faster the
    next time you visit them. You can clear the cache by clicking the Clear Now button.
    The cache data is also part of the private data that you can set to clear automatically
    when you exit.

    - **Update**: The Update tab lets Firefox handle checking updates, for itself,
    and for any plug-ins you have installed.

    - **Encryption**: The encryption tab has settings for security protocols Firefox
    uses, and if you have any special encryption certificates for visiting encrypting
    Web sites. Usually, you can leave these settings alone.


    # # Them dad-gum browser plug-ins


    Do you get irritated at those Web sites that insist that you download a *plug-in*,
    or additional piece of software, just to view the site? The difference between
    a plug-in and an external program is this: A plug-in displays the results in the
    browser, and an external program runs outside the browser. Although these plug-ins
    are annoying if you''re just looking for some basic information, they can provide
    some pretty cool stuff, such as streaming video and music through your Web browser.


    Chapter 16 explains how to add the popular plug-ins (like Macromedia''s Flash
    plug-in) to your system. When you download a particular type of file, Firefox
    gives you the chance to tell it how to automatically handle those types of files.
    After telling the browser to run things automatically: You could be opening yourself
    up for security problems.


    Firefox also supports a concept called extensions, which refers to extra features
    that aren''t included in the main browser because many people may not want to
    bother with them. Select Tools > Add-ons to open the Add-ons dialog box (see Figure
    10-4).'
  merge: -1
