  md: '# Chapter 20: Ten Steps to Setting Up a Samba Print Server 341


    # Step 5: Install Samba


    To share your printer with Microsoft Windows workstations and servers, you must
    install the Samba software package. Samba allows your Linux system to communicate
    with Windows devices using the Microsoft network-protocol.


    As shown in Chapter 16, you can easily install Samba by using the Fedora Package
    Management system. Here''s how:


    +   1. Click Applications: Add/Remove Software.


    This starts the Fedora Package Management system. You can easily add or remove
    software packages from here.


    +   2. In the Package Management window, select the Servers option on the left
    side, and the Windows File System option on the right side.


    The Windows File System option includes one optional package — system-config-samba.
    Ensure that you select this package for installation as well. It will make configuring
    the Samba software easier.


    +   3. Click the Apply button on the lower right to start the software installation.


    # Step 6: Configure Samba


    After you install Samba, you must configure it for your specific Microsoft network
    environment. Microsoft networking uses two different methods for joining network
    devices into groups:


    +   * Workgroup: Defines a small number of workstations and servers that belong
    to an ad hoc network group


    +   * Domain: Defines a larger number of workstations and servers that belong
    to a controlled networking environment


    Because we are working with a small network environment, I assume that you are
    using a Microsoft workgroup on your network. In a workgroup environment, you must
    configure each workstation and server to belong to a specific group name. For
    the network devices to see your shared printer, you must add your Linux server
    to the workgroup:


    +   1. Select System Settings:Administration:Server Settings: Samba from the panel
    menu.


    This starts the Samba Server Configuration window (if you''re not logged in as
    the root user, you''ll be asked to supply the password for root first).'
  merge: -1
  pgno: 359
- img_proc: true
  md: '# 342 Part V: The Part of Tens


    2. Click Preferences:Server settings from the menu bar.


    The Server Settings configuration window, shown in Figure 20-3, appears.


    ![](img/9e1543123a324def5e9e0f9e6fc0f80b_360_0.png)


    3. In the Server Settings window, enter the workgroup name for your Windows network
    in the Workgroup box.


    By default, Fedora uses the Linux hostname of your Windows network device name
    on the network. You can also provide a brief description of your host in the Description
    dialog box. Network devices see the description along with your hostname when
    they browse the network.


    Click OK when you are done, and then close the Samba Settings window.


    > If you enabled the SELinux security software during installation, you''ll need
    to tell it to allow Samba to operate. To do that, select System->SELinux Management->to
    start the SELinux Management tool. From there, select Boolean, and click the Samba
    drop-down list box. Select the Allow Samba to Share Any File/Directory Read/Write
    box. That''s all there is to it!


    # Step 7: Start Samba


    Unfortunately, Samba does not start by default when you install it. You can elect
    to either manually start Samba when you want, or to have the Linux system start
    automatically when it boots.


    For either option, you must use the Fedora Service Configuration window.'
  merge: -1
  pgno: 360
- img_proc: true
  md: '# Chapter 20: Ten Steps to Setting Up a Samba Print Server


    # 1. Select System—Administration—Services from the menu.


    This starts the Service Configuration window. Again, you must be the root user
    to use this tool, if you''re not already logged in root, you will be asked for
    the password to start. When the Server Configuration window starts, you see all
    the services that are available on the Fedora system, as shown in Figure 20-4.


    ![](img/9e1543123a324def5e9e0f9e6fc0f80b_361_0.png)


    Figure 20-4: The Samba Configuration window.


    The server automatically starts services with a green check mark in the check
    box when the system boots. You can also start, stop, or restart individual services
    by using the appropriate button.


    The Services Configuration window labels the Samba service as smbd. This service
    actually controls two separate services:


    +   * **smbd**: Controls client connections to the Samba server

    * **nmbd**: Controls advertising shared devices on the network


    # 2. Select the smbd service and click Start.


    When you start the smbd service, both of the Samba servers start. You see the
    status of the services in the right window.


    # 3. If you want Samba to automatically start at boot up, select the check next
    to smbd.'
  merge: -1
