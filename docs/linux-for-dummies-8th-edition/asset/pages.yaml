    Shell scripting is the art of creating computer programs with just the shell.
    Most Linux and UNIX Administrators speak shell script language like you and I
    speak our native tongues.


    # Using Redirection and Pipes


    Redirection and pipes facilitate the flow of information. A pipe is exactly what
    it sounds like: it directs the output of one program to the input of another program.
    A pipeline may consist of several utilities plumbed together by pipes. At either
    end of this pipeline is, optionally, a redirection.


    Almost all Linux utilities require input and output have been plumbed with the
    following common interfaces: stdin (standard input), stderr (standard error).
    By having a common method to feed input to a program or read data from the output
    of a program, you can glue utilities together into sophisticated solutions.'
