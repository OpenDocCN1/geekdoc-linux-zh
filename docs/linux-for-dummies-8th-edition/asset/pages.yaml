    # Step 10: Test Remote Devices


    After you are connected to the wireless access point, the bridge created on the
    Fedora system passes all network packets from your wireless clients to the wired
    network.


    Test this out by accessing an Internet location with a Web browser. If you can
    get out onto the Internet, congratulations! You''ve built your own secure access
