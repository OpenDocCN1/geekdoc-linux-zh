    # So where did Linux come from?


    The quickest way to understand Linux is to take a peek at its rich history. Although
    programming of the UNIX core started in 1991, the design concepts were based on
    the time-tested UNIX operating system.


    university, but both UNIX and the hardware ran on prohibitively expensive. A UNIX
    version Minix was available for free, but it didn''t quite meet his needs. As
    a computer scientist, Torvalds studied Minix and then set out to write a new version
    himself. In his own words (recorded for posterity on the Internet because this
    was an early version of an online chat room), his was "just a hobby, won''t be
    professional like GNU."


    UNIX was developed at Bell Telephone Laboratories in the late 1960s. The original
    architects of UNIX, working when there were few operating systems, wanted to create
    one that shared data, programs, and provided both efficiency and security—something
    that wasn''t available (and is still sought after). From there, UNIX evolved many
    different systems; its current family is so complicated that it looks like a kudzu
    infestation!


    In 1991, Linus Torvalds was a computer science student at the University of Helsinki
    in Finland. He wanted an operating system that was like the UNIX he''d grown fond
    of at the


    Writing an operating system is no small task. After six months of hard work, Torvalds
    made very little progress toward the general utility of it. He posted what on
    the Internet and found that many people shared his interest and curiosity. Before
    long, some of the brightest minds around the world were contributing to Linux''s
    project by adding enhancements or fixing bugs (in the code).'
