  md: '# Chapter 7: Getting to Know the Linux Filesystem


    # Links 101


    A link is a fake file listing that points to another file, making a kind of shortcut.
    You use two kinds of links in Linux and UNIX: soft links and hard links. A soft
    link is like a Windows shortcut that the link points back to the original file,
    and any edits you make to the link happen to the original file. Erase the original
    file, and the link remains, but it becomes unusable (and is called a broken link).
    The link is broken without the original file. A hard link doesn''t have a counter-part
    in the Windows world. A hard link isn''t just a shortcut; it''s another instance
    of the file itself. The data in this file is saved in only one place, but you
    can edit either original or the link, and the edit is saved for both instances
    of the file. Erase the original, and the file still exists as long as the link
    is there. It''s like two doors to the same room!


    The colors displayed when you use this version of the command tell something about
    the type of item you''re looking at:


    | Text Color | Usually Means |

    | --- | --- |

    | Black | A regular file that doesn''t match any of the special types that needs
    a color. |

    | Red | An archive or package (see Chapter 16). |

    | Pink | An image (if it recognizes the file extension, such as .jpg, .tif, and
    .gif). pink is also used for another type of special file, it''s heavily specialized
    and not something you need to worry about. If you don''t see an image extension
    on the filename you see a pink file, just ignore it. |

    | Dark Blue | A directory. |

    | Light Blue | A soft link (see the sidebar “Links 101” for what links are). |

    | Green | A program (called an executable) in Linux. |

    | Gray text with a red background | A SetUID (UID) file (see the sidebar “Playing
    pretend with SUID and SGID” for what these terms mean). |

    | Dark text with an orange background | A SetGID (SGID) file (see the sidebar
    “Playing pretend with SUID and SGID” for what these terms mean). |

    | White text with a red background | A broken link (see the sidebar “Playing pretend
    with SUID and SGID” for what this term means). |'
