  md: '# Chapter 15: Windows-Only Media Formats and Programs


    You can find the Wine documentation at www.winehq.org/site/docs/wineusr-guide/index.
    Start in the “Configuring Wine” section. When installed, you can find the Wine
    tools in Applications:Wine.


    When you have Wine installed, you get to the fun part — trying to run your old
    Windows software. You don''t really run Wine, per se. Instead, invoke Wine whenever
    you need to use something from the Windows world. To install a program through
    Wine, insert the CD-ROM or floppy into the appropriate drive. Your distribution
    might open the File Manager for you, or you may need to open the File Manager
    manually. Regardless, your goal is to run the installation routine, which is typically
    SETUP.EXE. You can double-click this in the File Manager and, when asked what
    program you want to use with this file, answer wine.


    As I write, I''m trying some home-design program I bought back when I was silly
    enough to think I''d be afford to build a house before I was 90 years old. Because
    it''s difficult to describe a standard Wine session, I thought I''d walk you through
    how this goes for me.


    The installer loads and runs just fine. I stick with the defaults (because Wine
    is still a work-in-progress and it''s best not to taint it with getting too fancy)
    and wait while the installer adds all the files to my SuSE system. Now, to run
    my new-old software. To run a program, I first need to know what the path is to
    that program. I can find it by looking in the ~/.wine directory. In this case,
    the program was installed into /home/dee/.wine/fake_windows/Program Files/HOUSE.
    The file looks like the one for launching the program.


    If you''re trying to find the .wine directory in the GUI and can''t see it, you
    probably have to go to the View menu and choose Hidden Files. So, to run the program,
    I double-click it and, when asked what program you want to run it with, enter
    wine. That''s it (see Figure 15-5). Now pull out those old Windows 95 and 98 CDs
    and give them a try! Not all of them will work, but some probably. The cool thing
    is that you can keep trying them on and off over time as newer versions of Wine
    come out.'
