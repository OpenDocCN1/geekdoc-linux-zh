  md: '# Chapter 20


    # Ten Steps to Setting Up a Samba Print Server


    +   In This Chapter

    - Dancing the Samba

    - Setting up a print server

    - Troubleshooting


    > Making duplicate copies and computer printouts of things no one wanted even
    one of the first place is giving America a new sense of purpose.

    — Andy Rooney


    Networks have revolutionized the computer world. Not only do they help you view
    fancy Web sites, they also give you the ability to share a single printer between
    two computers on opposite sides of the house. Being able to share a single printer
    among all of your household computers can save you lots of money.


    Linux computers can share printers among themselves just fine. Chapter 17 shows
    how to map a Fedora computer to just about any type of network printer available.
    However, most likely you also have one or more Microsoft Windows systems on your
    network. Getting these to work with Linux printers is not always easy.


    This chapter walks through the steps necessary to make the printer connected to
    your Linux computer available to your Microsoft Windows computers on the network.'
  merge: -1
  pgno: 353
- img_proc: true
  md: '# 336 Part V: The Part of Tens


    # Dancing the Samba


    Making your Linux computer talk with Microsoft Windows workstations and servers
    requires a special software package. Microsoft uses a proprietary (secret) network
    protocol to communicate between Windows devices on a network.


    Fortunately, some enterprising open source enthusiasts worked to reverse engineer
    the Microsoft networking protocols and produced software to duplicate the result.
    This effort is the open source package called Samba.


    Fedora includes the Samba software as part of the core Fedora software packages.
    I use the Samba software package to make any printers attached to your Linux computer
    visible to the Microsoft Windows workstation or server on the network.


    The following steps guide you through the processes required to install and configure
    Samba and Linux to create a print server that everyone can use.


    # Step 1: Plan Your Sharing


    Before you can start loading and configuring software, it''s a good idea to get
    a handle on your network environment. Determining exactly what you''re doing before
    you start it is always a good thing.


    First, let''s make sure we''re talking about the same thing here. The network-printing
    world has gotten confusing. There are special types of printers available on the
    market network printers. You can connect these types of printers directly to your
    network without using an intermediate computer.


    Network printers are often heavy-duty printers, capable of printing thousands
    of pages a day. These printers are designed for medium-to-large-office use and
    are usually too expensive for the casual home or small business user. These are
    not the types of printers we''re talking about here.


    This chapter is all about sharing a common, ordinary printer that you plug into
    your Linux computer or server. These are called local printers because you connect
    them directly (or locally) to a specific PC.


    The beauty of sharing local printers is that you don''t need to buy a separate
    printer for each computer on your network. Knowing how to convert a simple inkjet
    printer into a shared network printer is a great bargain.'
  merge: -1
  pgno: 354
- img_proc: true
  md: '# Chapter 20: Ten Steps to Setting Up a Samba Print Server 337


    If you haven''t purchased a local printer yet, check which ones are compatible
    with Linux. Unfortunately, most printers don''t come with Linux drivers. A great
    resource is the OpenPrinting Web site (www.linux-foundation.org/en/OpenPrinting).
    This site contains a database of all printers that are known to have Linux drivers,
    and even a download section where you can download drivers for your printer if
    they aren''t already included in Fedora.


    # Step 2: Connect a Local Printer


    After you''ve got your printer set, you''ll want to connect it to your Linux system.
    The two most common methods used to connect local printers are


    +   * Parallel port: Using a special 25-pin printer cable

    * USB port: Using a standard USB cable connector


    Modern printers now use USB cables. The USB system provides many benefits that
    were missing from the older parallel printer method cable.


    When you plug a printer into your Fedora Linux system with a USB cable, Fedora
    automatically detects the printer make and model and creates a printer for you.
    You can start printing without any work of your own.


    However, if you plug a printer into your Fedora Linux system with a parallel printer
    cable, nothing happens. You have to manually configure the printer in the system
    before you can use it (ugh).


    In either case, it''s a good idea to look at the system printer configuration
    first to ensure your printer is set up properly. That''s the next step.


    # Step 3: Manually Add a Local Printer


    Fedora uses the Printer Configuration tool to add and manage all printers. If
    you are using a parallel printer cable, you can manually add your printer in the
    Printer Configuration window. Here are the steps for this:


    +   1. Select System-Administration-Printing from the panel menu.


    This starts the Printer Configuration window, as shown in Figure 20-1. This requires
    root permissions to run. If you''re not logged in as the root user, it asks you
    for the root password before starting.'
  merge: -1
  pgno: 355
- img_proc: true
  md: '# 338 Part V: The Part of Tens


    ![](img/9e1543123a324def5e9e0f9e6fc0f80b_356_0.png)


    Figure 20-1:

    The Fedora

    Printer Configuration

    window.


    Connected to localhost


    # 2. Click the New Printer button.


    The New Printer Wizard starts. You must assign the new printer that the server
    will use both on the local system and to advertise the printer on the network.
    You also have the option of defining a description and the location of the printer.
    In a network environment, the server advertises these items along with the printer
    name. This can help users find the right printer if you have more than one.


    After you have finished typing in your entries, click the Forward button to move
    on to the next wizard window.


    # 3. Select the connection method.


    For a parallel printer, select the LPT#1 option and click the Forward button.


    # 4. Select the printer driver.


    This can be the most frustrating part of the process. If your manufacturer is
    listed in the provided list, select it, and continue on clicking the Forward button.


    If your printer manufacturer is not selected, you may be out of luck. Sometimes
    you can find the appropriate Postscript Printer Description (PPD) driver on a
    manufacturer''s Web, or the OpenPrinting Web site (www.linux-foundation.org/en/OpenPrinting).
    If so, select that option in the wizard window and use the text box to find the
    PPD file on your system.


    # 5. Select the printer model.'
  merge: -1
