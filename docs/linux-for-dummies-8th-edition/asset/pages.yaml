  md: '# 140 Part II: Getting Up to Speed with Linux


    # Selecting an Internet Service Provider (ISP)


    Because the meteoric rise in the popularity of Linux, many ISPs are training their
    support staff in the ways of Linux. If you already have a dialup service, give
    one of them a call to let them know of your Linux pursuits. Chances are, that
    have already information pertinent to Linux subscribers and can provide you with
    that information. If you''re shopping for a new ISP, this section offers some
    practical selection advice.


    Some ISPs have their own proprietary software that you must install on your PC
    to connect to the Internet. The software they provide is likely to run only on
    Windows. Free dialup services don''t work with Linux because of this fact. The
    proprietary software meddles with the operating system to ensure banner advertising
    is not hidden or that you stayed dialed for a specified duration.


    If you''re shopping around for an ISP, consider these questions:


    +   - Can you get local dialup numbers across the country and around the world?
    If you travel often and need access from different cities, this service is a handy
    money (headache) saver.

    - Does it provide technical support for Linux? If you''re planning on running
    Linux, this consideration is an important one. It doesn''t have to be a deal breaker,
    but it is handy.

    - Can you get a recommendation? Ask a friend. An ISP''s best friend is an endorsement
    from a satisfied customer.

    - Will you have trouble idling? Although a subscriber-to-line ratio of 7-to-1
    (an average of seven or fewer subscribers per line) or better isn''t an entirely
    accurate measure of how often you''ll get busy signals, it is probably the easiest
    measure for consumers. This is primarily a concern for dialup users.


    ![](img/9e1543123a324def5e9e0f9e6fc0f80b_158_0.png)


    # Getting Information You Need from Your ISP


    Most reputable ISPs provide you with a customer information sheet after you sign
    up for its services. This sheet should include the following information at the
    minimum:'
  merge: -1
  pgno: 158
- img_proc: true
  md: '# Chapter 9: Connecting to the Internet 141


    +   - Local telephone dial-in numbers for modem users

    - User login name

    - User login password

    - E-mail address

    - E-mail outbound host or Simple Mail Transport Protocol (SMTP) server

    - E-mail inbound host or Post Office Protocol (POP) server

    - News host

    - Whether your computer address will be


    +   - Static: You always have the same IP address. Static addresses are more common
    for servers than for desktops. If you''re using static, your ISP needs to give
    you your nameserver IP addresses, your gateway address, the network address, and
    the netmask. This information should all be on the customer information sheet.

    - Dynamic: Your IP address changes each time you connect, or at regular intervals.
    On most desktops, you just don''t need to have the same address, and it makes
    life easier on ISPs. It also makes life easier for computers like laptops, which
    get moved around from network to network. If you''re using dynamic addressing,
    you''re told that you need to connect by using DHCP.


    With this information, you can establish an Internet connection by your Linux
    system.


    # Configuring Your Connection


    Okay, so you''ve got your network hardware and your ISP information, now what?
    The answer is to configure your Fedora system to jump on the Internet!


    The configuration process is slightly different depending on the hardware you''re
    using. This section covers the big three methods for accessing the Internet:


    +   - Using a modem to dial to your ISP

    - Using an Ethernet card to connect to a DSL or cable modem

    - Using a wireless card to connect to a wireless access point


    Each situation requires a few slightly different items to configure, but you can
    perform all of them by using the Fedora Network Configuration tool.'
  merge: -1
  pgno: 159
- img_proc: true
  md: '# 142 Part II: Getting Up to Speed with Linux


    # Dialin'' out


    Using a modem to dial a connection to your ISP is a two-step process. First, you
    must configure your modem with the settings from your ISP. After that, you must
    manually start and stop the Internet connection (you probably don''t want your
    modem tying up your phone line all day long). First, work on setting up your modem.


    # Setting up the modem


    With your ISP information in hand and a glowing monitor in front of you, follow
    these steps to configure your dialup connection to the Internet in Fedora:


    +   1. From the GUI desktop, choose System::Administration::Network.

    2. Enter your root password in the dialog box, if necessary.


    If you''re logged in as a regular user (not root), you''re prompted to enter the
    root password.


    The Network Configuration dialog box opens (see Figure 9-1).


    ![](img/9e1543123a324def5e9e0f9e6fc0f80b_160_0.png)


    Figure 9-1: The Network Configuration dialog box.


    3. In the Network Configuration dialog box, click the New button.


    The Select Device Type dialog box appears, as shown in Figure 9-2.'
