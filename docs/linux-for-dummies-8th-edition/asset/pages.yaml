    # Evolving into E-Mail


    Although most people think of the Web when they think of the Internet, e-mail

    may, in fact, the most used and beloved of Internet applications. A multi-

    tude of e-mail programs are available for Linux users. Fedora choose to include

    The Evolution-mail package by default.


    Evolution should remind you much of Outlook. If you like being able to

    integrate your calendar, address book, task manager, and e-mail, you should

    feel right at home with Evolution. Other Linux email clients like Mozilla

    Mail, Thunderbird, and KMail are more single-purpose, although Thunderbird

    supports news reading. If you like to keep things simple, you might want

    try one of these packages.'
