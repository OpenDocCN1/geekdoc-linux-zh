- img_proc: true
  md: '# Chapter 18: A Secure Linux Box Is a Happy Linux 311


    # Connecting to your Linux box from a Macintosh running OS X with SSH


    The process from a Macintosh is similar to that under Linux. Go to Applications;Utilities;Terminal.app,
    which opens a command line window for you.


    ```

    ssh IPaddress

    ```


    to access the same user account on the remote machine (again, you can use a computer''s
    full name rather than the IP address), or type


    ```

    ssh login@IPaddress

    ```


    if you want to access the account login instead of the same account you are using
    on the Mac.


    # Software holes


    When someone is already in your system — whether or they''re allowed to be there
    — you have additional security concerns to keep in mind. One of these involves
    what software you have on the machine. Believe it or not, each piece of software
    is a potential security hole. If someone can get a program to crash in the right
    way, they can get greater access to your system than they should. That''s a very
    bad thing!


    One way to close software holes is to remove all programs you don''t need. You
    can always add them later, if necessary. In Fedora, use the Add/Remove Software
    tool (see Chapter 16) to remove any unnecessary software from your computer.


    If it turns out, as a result of dependencies, you lose other software that you
    want to keep, make sure to cancel the removal.


    # Keeping an Eye on Your Log Files with the System Log Viewer


    One other security issue you may want to configure log files. Your network programs,
    kernel, and other programs all run log files, which contain records of what has
    been happening on your system. You may be amazed by just how much information
    gets put in them! They''re mostly in /var/log; take a look sometime.'
  merge: -1
  pgno: 329
- img_proc: true
  md: '# 312 Part IV: Junior Administrator Boot Camp


    Fortunately, tools are available that can help more sift through the wheat to
    look for the chaff of bugs and intruders. Fedora provides the System Log Viewer,
    which allows us to easily scan the major log files on the computer. Start the
    System Log Viewer by choosing Administration:(see Figure 18-6). It''ll ask you
    for the root password, as all the log files are restricted to root access.


    The System Log Viewer provides quick links to the boot.log, mailog, messages,
    secure, and Xorg.0 log files. If you want to view any other log files, you can
    do that by selecting File:Open from the menu bar, selecting the log file you want
    to view, and then clicking Open.


    ![](img/9e1543123a324def5e9e0f9e6fc0f80b_330_0.png)


    As you can see, there are lots of logs to dig through, here''s a quick-summary
    of what these log files contain:


    +   * messages: This is the main system log file. It contains error and status
    messages from the operating system as well as many applications and services.
    All of the messages entered in the messages log file are in the format:


    timestamp application: message

    You can use the filter to look at only messages from a specific application to
    help identify problems in the system. A sample entry looks like this:


    ```

    Apr 9 19:34:55 testbox dhclient: DHCPREQUEST on eth0

    nto 192.168.73.254 port 67

    ```'
  merge: -1
  pgno: 330
- img_proc: true
  md: '# Chapter 18: A Secure Linux Box Is a Happy Linux Box


    This entry shows the eth0 network interface used by the dhclient application to
    request an IP address via DHCP.


    +   - boot.log: This log file contains messages generated from the boot-up process
    (of which scroll will be too fast to read while you''re booting the system). As
    applications and services start, they report their status in the boot.log file.
    The boot.log file uses the same format as the messages log file. This is a great
    place to look for answers if Fedora doesn''t recognize any hardware on your system.


    +   - secure: The secure log file reports every instance of a security request
    on the system, such as when a user tries to log in, or requests privileges. Check
    this log if you can''t log into the system with a user account.


    +   - maillog: The mailog reports error and status messages from the mail system.
    Each time a message is sent or received, a message is generated and stored in
    this log file. Check here if you can''t send or receive messages.


    +   - Xorg.log: This log file tracks the status of the graphical Xorg server on
    the computer. The Xorg server provides the windows environment for the desktop.
    Check here if you''re having problems with the desktop displaying on your monitor.


    The secure log contains information about connection attempts and failed access
    attempts. It''s a good idea to peruse through this log file on a regular basis
    to watch for intruders. If you see a lot of denied access requests, you may have
    some someone trying to hack into your system.


    It also records each time a user requests permissions. For example, when I started
    the System Log Viewer application, it required me to enter the root password.
    This generated an entry in the secure log file:


    ```

    20 Mar 13:38:22 test userhelper: running /usr/sbin/gnome-system-log with root
    privileges on behalf of ''rich''

    ```


    This log entry identifies the application that was run with root privileges, and
    the user id that requested it.


    It''s also a good idea to peruse through the messages log file on a regular basis.
    If any system services fail to start, you''ll find out from entries in this log
    file.'
  merge: -1
  pgno: 331
- img_proc: true
  md: '# # Locating Security Resources


    You can find a plethora of information on the Internet about desktop, network,
    and Linux security. Because of the massive volume of information available, I
    list some Web sites I like for security issues:


    +   - www.sans.org: One of the major security-related sites on the Internet.

    - www.grc.com: Provides some interesting tools, such as tools to test which ports
    are open on a system. Also, this site features many excellent articles dealing
    with system and network security. Click the Shields Up Security HOWTO.

    - tldp.org/HOWTO/Security-HOWTO/index.html: The Linux Security HOWTO.

    - www.linuxsecurity.com/: Presents a plethora of information from Linux Security.com.

    - www.securityspace.com/: Has lots of information about security issues and tools
