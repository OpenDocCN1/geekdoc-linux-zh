  md: '# 110 Part II: Getting Up to Speed with Linux


    triplet''s permissions to allow the other folks (those who aren''t the file''s
    owner or in the specified group) to read and write to the file. But this method
    is a sloppy way of doing things because the whole idea of permissions is to reduce
    access, not to give everyone access. Instead, change the file''s owner to the
    user tom. You do this with the chown (change owner) command. For example, typing
    chown tom root changes the ownership over tom. Then tom can work with this file
    and even change its permissions to something he prefers.


    Hanging out in groups

    Groups are more interesting to work with than owners. You use groups to allow
    the root user to assign multiple users the ability to share file-system areas.
    For example, in many versions of Linux, all users are added to a group named users
    (SUde, for example). Then rather than a long format file listing such as the one
    showed earlier in this chapter, you may see the following:


    ```

    dee 20

    drwx------ 2 dee users 4096 Jul 29 07:48

    drwxr-xr-x 5 root 4096 Jul 27 11:57 ---

    -rw-r-r-- 1 dee users 24 Jul 27 06:50 .bash_logout

    -rw-rw-r-- 1 dee users 230 Jul 27 06:50 .bash_profile

    -rw-r--r-- 1 dee users 124 Jul 27 06:50 .bashrc

    -rw-rw-rw-- 1 dee users 0 Jul 29 07:48 lsfile

    ```


    In other distributions (such as Fedora), a unique group is created for every user,
    which is if the earlier listings showed the owner and group items as identical
    (dee).


    # Comprehending file types


    The first letter in long format file listing tells you which type of file you''re
    dealing with. In Table 7-3, I list the types you''re likely to run into. Some
    of these may seem familiar after examining the file color scheme.


    | Table 7-3 Linux File Types |

    | Label | Type | Description |

    | - | Regular file | The item is an everyday file, such as a text file or program.
    |

    | b | Block device | The item is a driver (control program) for a storage medium,
    such as a hard drive or CD-ROM drive. |'
