  md: '# Part III: Getting Things Done


    # Troubleshooting your IM connections


    If you''ve been using most of these IM clients with other operating systems


    Sometimes, your Linux system is unable to connect properly to the IM service.
    When this problem happens, an error message pops up on your screen and indicates
    a failure to connect. You may be unable to connect to the IM service for several
    reasons:


    +   - You may have entered the wrong password for your IM account or the incorrect
    IM account name.

    - Your computer may not be connected to the Internet. Try opening your Web browser
    to see whether you can get to a Web site, which tells you whether''re connected
    to the Internet.

    - If you open a Web site but can''t get IM to work, the IM system may be unavailable.
    This problem occurs at times due to maintenance of the IM service or an excessive
    amount of traffic on the Internet or on the IM service.

    - If you attempt to access the IM service from your computer at work, your company
    or organization may block the IM service for security or productivity reasons.
    Using IM at your work is permitted, check with your network administrator to see
    whether he can help you out.

    - Often, companies use firewalls between the company''s network and the Internet
    to keep out unwanted traffic on the company''s network. If the firewall is configured
    to block IM traffic, you cannot use IM across the Internet.


