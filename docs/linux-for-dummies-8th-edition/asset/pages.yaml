    up so I can listen to them collectively in playlist off my computer''s hard drive,
    I don''t see a problem with this. However, doing this and then taking the CD back
    for a refund is theft, in my opinion.


    So, with that said, to rip the tracks off your CDs in Linux:


    +   1. Choose Applications::Sound & Video::Sound Juicer CD Extractor (see Figure
    13-7).'
