- img_proc: true
  md: '# 152 Part II: Getting Up to Speed with Linux


    WARNING!


    ![](img/9e1543123a324def5e9e0f9e6fc0f80b_170_0.png)


    Some firewalls block the kind of traffic sent ping, so these commands don''t always
    work as expected, even with a good connection.


    The ping command is akin to a submarine using sonar to detect other objects in
    the ocean. Sonar sends out a ping signal, which reflects off a hard surface. By
    measuring the amount of time between sending the ping and the return, the submarine''s
    engineer can determine whether an object is out there and how far from the submarine
    it is.


    The ping command in Linux provides information similar to what sonar provides
    and it''s so useful to see it here as a Linux command and a time-honored word.
    If you consider the Internet to be your ocean, by ping, what other networks compute
    and also how long it takes for ping command to return. You use this command in
    the format hostname or ipaddress, as ping bob.example or ping 192.168.1.5. If
    you can''t find another computer in your house or office (assuming that you have
    them all with Ethernet and not on separate dialup connections), something is wrong
    with the machine; on the other hand, if you can ping another machine in your house
    or office but you can''t ping a machine elsewhere on the Internet, something may
    be wrong with your connection to your ISP.


    ![](img/9e1543123a324def5e9e0f9e6fc0f80b_170_1.png)


    Latency, or the amount of time it takes for a signal to travel to the Internet.
    Factors, such as network traffic, bandwidth, and network hardware all contribute
    to latency. These factors determine whether a ping command to your neighbor''s
    computer takes longer than pinging a host at the South Pole.


    For example, ping Yahoo! by opening a command prompt (see Chapter 6) and typing
    the following command:


    ```

    ping www.yahoo.com

    ```


    Press Ctrl-C to stop the ping; otherwise, your computer continues to ping the
    target.


    ![](img/9e1543123a324def5e9e0f9e6fc0f80b_170_2.png)


    The output, shown in Figure 9-9, provides information about what ping is doing.
    If you can''t reach the host, you receive a message that the host is unreachable.
    If you can reach the host, you receive feedback that how long it takes — in milliseconds
    (ms) — for the signal from your computer to get to the destination computer and
    back again. (The lower the numbers, the better). For computers connected through
    Ethernet, a ping time of 1 ms to 3 ms is an acceptable response time. For dialup
    connections, expect around 150 ms. When you start seeing ping times climbing to
    900 ms or higher, the network is likely under heavy use (or you have something
    wrong with your cables).'
  merge: -1
