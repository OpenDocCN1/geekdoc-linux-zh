    # Connecting to (and disconnecting from) the Internet


    To connect to the Internet from the Fedora Network Configuration dialog box, highlight
    the modem entry you created (see preceding section) and click the Activate button.
    With any luck, your modem springs to life with some beeps and then buzzes with
    a dialog box indicating that a connection is being made. After a successful connection,
    the Network Configuration dialog box appears; this time, the Status column of
    the modem device reads Active. Congratulations — you’re connected to the Internet!


    To disconnect, click the Activate button in the Network Configuration dialog box.
    Your settings remain; the next time you want to connect, just open this dialog
    box and click Activate. If all is not well, skip to the "It''s All Fun and Games
    Until Something Doesn''t Work" section to find out how to get help.


    # Playing with cards


    With the increase of broadband connections, more Linux users are directly connecting
    to the Internet. With most cable and DSL modems, you’ll need a network interface
    card (NIC) to connect to the modem.'
