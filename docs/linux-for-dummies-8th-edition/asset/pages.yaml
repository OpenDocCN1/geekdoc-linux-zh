  md: '# 108 Part II: Getting Up to Speed with Linux


    # A permissions primer


    If you find yourself scratching your head when looking at parts of long format
    listing, don''t worry. The "Comprehending file types" section, later in this chapter,
    gives you a feeling for the first letter on each line, but nine more characters
    are attached to that item before you get to the next column. This group of nine
    is the set of permissions (also called a permission set) for the file or directory.
    Linux, UNIX, and even Mac OS X permissions as a way of providing file and directory
    security by giving you the means to specify exactly who can look at your files,
    how they can change them, and even can run your programs. You need this capability
    when you have a bunch of different users on the same machine, networked to the
    world.


    # Checking out the triplets


    Each permission consists of three triplets. Each of the triplets has the same
    basic structure but controls a different aspect of what one can use. Consider
    the long format listing for /home/dee in the following code:


    ```

    total 464

    drwx 23 dee 4096 Dec 15 05:01 .

    drwx-xr-x 3 root root 4096 Dec 03 06:27 .bash_history

    -rw--r-- 1 dee dee 5 Dec 03 07:07 .bash_logout

    -rw--r-- 1 dee dee 24 Jul 12 00:11 .bash_profile

    -rw--r-- 1 dee dee 176 Jul 12 00:11 .bash_profile

    -rw--r-- 1 dee dee 124 Jul 12 00:11 .bashrc

    ```


    The first character in the permission set refers to the type of file. For a directory,
    the character is shown as a d, as you see here for the first two items in the
    preceding list; files are designated with a dash (--) instead. Each file or directory''s
    permission is a group of nine characters — that is, the characters that follow
    the first character (for a total of ten). But this group of nine is really three
    groups of three, as shown in Figure 7-4.


    | R | W | X | R | W | X | R | W | X |

    | Users | Groups | Others |


    Figure 7-4: Breakdown of the nine permission characters.


    Legend:

    R=Read

    W=Write

    X=Execute'
