  md: '# Part IV: Junior Administrator Boot Camp


    # # Installing New Software


    In many cases, installing new software isn''t much harder than updating, because
    Fedora has tools that let you install with just a few clicks. My focus in this
    section is on using these tools. Later, in the section "Finding More Software,"
    I address how to add programs that aren''t available through these tools. To add
    programs using Fedora''s Package Manager, make sure that you are connected to
    the Internet and then do the following:


    +   1. Select Applications; Add/Remove Software.


    You may be asked to enter your root. The Package Manager window appears (Figure
    16-2). This window can take a minute or so populate the system looks to see what
    software it has installed and what


    ![](img/9e1543123a324def5e9e0f9e6fc0f80b_290_0.png)


    GNOME is a powerful, graphical user interface which includes a panel, desktop,
    system icons, and a graphical file manager.


    +   2. Determine how you want to choose your software:


    +   **Browse through categories:** By default you see the Browse tab. Software
    categories are displayed on the left, and to the right are groups of software
    that live within that category. An X in the box next to a group means that group
    is selected for installation, but it doesn''t mean that *everything* in that group
    will be installed. Looking down and to the right will show you how many packages'
