  md: '# 60 Part I: Getting Your Feet Wet


    Sometimes "bad things" can happen to your boot loader. Common symptom of boot
    loader problems is a message saying that the operating system could not be found.
    Another hint that the problem is your boot loader is if you never see your boot
    menu, which is a blue screen that comes during the boot process that gives you
    three seconds to press a key and a menu letting you choose operating system and
    version to boot.


    If you suspect a boot-loader problem, see the section "Enter Rescue Mode," in
    this chapter. This section helps you to fix the problem. If it doesn''t work,
    then depending on the errors, your hard drive may be damaged, or another piece
    of your hardware related to the hard drive may be broken. You may have to drag
    in a teenager or a computer shop if you''re not particularly computer-savvy. Or,
    try using the drive for something else like Windows and see if it works for.


    ![](img/9e1543123a324def5e9e0f9e6fc0f80b_78_0.png)


    If you just installed Linux, try just reinstalling it if you find it won''t boot
    properly. Oddly, that can fix the problem.


    # Step 3: The boot loader (LILO or GRUB) loads the system kernel into memory


    Every computer (and electronic device) requires an operating system to run. The
    technical term for this operating system, or at least the core of it, is the kernel.
    If the kernel is your maestro, orchestrating all the components of your computer
    and delegating resources in a logical and cooperative manner, the boot loader
    is the red carpet on which your maestro arrives.


    The boot loader passes control to the kernel when you see this text like:


    ```

    Uncompressing Linux... Ok, booting the kernel.

    aud(1092566112,337:0): initialized

    ```


    Of course, that text might fly past. That''s — just keep in mind that you see
    this and then soon see something like:


    +   - The system freezes

    - A few dots appear across the top of the monitor, and then the system freezes

    - A few messages appear on the screen, and the final message reads kernel panic

    - The system reboots automatically'
  merge: -1
