  md: '# 66 Part I: Getting Your Feet Wet


    your command-driven tasks without having to completely leave the point-and-click
    environment (see Chapter 6).


    There are interesting things that you might find useful to know about the command
    line interface. One difference between the Linux command line and other interface
    commands, like the Windows MS-DOS prompt, is that Linux commands are case-sensitive.
    Typing LS is completely different from typing ls, and in fact, you will get an
    error because there is no LS command. The Linux command line also has an autocompletion
    feature. If you know the first few characters of a command or filename, type part
    of it and press Tab to complete the rest automatically. For example, if you are
    trying to use the less command to view the contents of the file /home/bob/grocery_list,
    you can type /home/bob/gro and press Tab to finish and complete the filename.
    However, if you have the subdirectory (folder) /home/bob/group_projects, you will
    hear a beep. You can press the Tab key again, double-clicking with a mouse, to
    see the output:


    ```

    grocery_list    group_projects

    ```


    The cool thing here is that the command prompt benefits these items when you have
    the less gro so you do not have to retry it! You can then see that typing a c
    makes clear that you are referring to grocery and not to group, so you just add
    c to make less groc and press Tab again to finish the autocompletion. This technique
    can save you a ton of typing, especially with long filenames!


    Most Linux distributions also keep a running history of commands most recently
    used. To use this list, press the up-arrow key on your keyboard. This action pulls
    the last command you typed. As you continue to press the up arrow key, you step
    through the most recently entered commands from the most to recent. If you accidentally
    pass what you''re looking for, use the down-arrow key to go back. When the command
    you want appears at the command prompt, press Enter to execute the command, or
    edit it and press Enter.


    In Chapter 6, I cover the command-line environment in more detail.


