    # # Tip #4: "The Installer Tested My Graphics Fine, but My GUI Won''t Start"


    If your Linux installation program showed you a GUI test screen saying that you
    were ready to proceed with the rest of the installation, you probably expected
    that the GUI would start with no problem. Unfortunately, that doesn''t always
    happen.


    If you boot your machine for the first time and see error messages when you''re
    trying to enter the GUI automatically or when you type startx to start the GUI
    manually, type system-config-display at a command prompt to start a program that
    will help you fix the problem.


    # # Tip #5: ''I Think I''m in Linux, but I Don''t Know What to Do!''


