    ```


    You may find some parts of this format easier to understand, at a glance, the
    others. The first item in each listing (the part with the letters and dashes —
    for example, the `drwx-` in the first line) is the **permission** set assigned
    to the item. Permissions define who can read the file, change it, or run it if
    it''s a program. You can read more about permissions in "A permissions", later
    in this chapter. The second item in the first line (in this case, 2) is the number
    of hard links to the item.


    The third item (**dee**) is the **owner**, and the fourth (**dee**) is the **group**
    — depending on which version of Linux you''re using, these items may not be identical.
    You can find more about both of these in "A permissions", later in this chapter.
    The fifth item is the size in bytes. All directories show up as 4,096 bytes. Everything
    has its own size. You can create an empty file from the size of 0 bytes.


    The sixth, seventh, and eighth entries are all related to the last time the file
    was changed: the month (**Dec**), the date (**3**), and the time in 24-hour format
    (**07:07**). Finally, the ninth item is the filename (for example, *bash history*,
    in the third row).'
