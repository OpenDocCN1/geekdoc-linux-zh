    # # Finding More Software


    If you can''t find what you''re looking for through the official (and not so official)
    sections discussed in the previous section? Those aren''t your only options. Although
    I can''t anticipate every situation you might find yourself in, I can at least
    give you some tips for how to find extra software and how to install it of.


    Here are the general steps for finding new software:


    +   1. Check the Fedora FAQ (www.fedorafaq.org), Fedora News (www.fedoranews.org),
    the Fedora Forum (www.fedoraforum.org), and other online sites that people might
    recommend.


    +   2. If you don''t know what you want, find out by opening your favorite Web
    search engine and searching for a feature and how to search linux.


    For example, maybe you want something comparable to the program irfanview from
    the Windows world, you would search for irfanview linux.


    +   3. Sort through the search results and see whether a particular program is
    suggested. If not, add the word equivalent to your search and search again.


    So, to continue the example, you would search again but use this time irfanview
    linux equivalent. Now you start to see a program called xview mentioned. It wouldn''t
    hurt to turn around and look whether Fedora''s Package Manager offers this program,
    before you installing it by hand.


    +   4. After you find a program you want, do a Web search for it.


    More often than not, you find the program''s home page.


    +   5. Click through to that program''s home page.'
