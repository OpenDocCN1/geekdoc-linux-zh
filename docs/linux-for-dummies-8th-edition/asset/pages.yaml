    # Listening to Downloaded Music


    Downloading music from the Internet is a fun activity. A lot of people like to
    pretend that it''s legal and ethical, and in fact it''s often theft, depending
    on where you grabbed the music. I leave ethical issue between you and your belief
    system, but because I have my own ethics that it''s, I''m going to focus on showing
    music that you''re welcome — legally and ethically — to download!


    One place to find such material is on a band''s Web site. Many groups today offering
    free downloads of their work is a great PR move — if people love the sample songs,
    they''re more likely to go out and buy the album. For an example, I use the popular
    band Evanescence (www.evanescence.com).


    Evanescence''s Web site, like those of other bands, are mostly dealt with Macromedia
    Flash. (See Chapter 16 for how to add this functionality to your distribution.)
    To listen to music files in general, I personally recommend Amarok (http://amarok.kde.org/),
    which (again) you can get by using'
