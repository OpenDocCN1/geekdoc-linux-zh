  md: '# Part III: Getting Things Done


    Again, this is another area where Linux had never quite caught up to Windows,
    until now. Two major 3-D video card vendors, ATI and NVIDIA, have released Linux
    drivers for their products, allowing game developers to enter the Linux market.


    There’s a catch to this though. Both NVIDIA and ATI released Linux binary drivers
    for their 3-D video cards, but not the source code. A true open source system
    must include source code for all components included in the system. This has caused
    a dilemma for Linux distributions.


    For a Linux distribution to include the ATI or NVIDIA binary drivers violates
    the true spirit of open source. If a Linux distribution doesn''t provide these
    drivers, it risks falling behind in the Linux distribution wars and losing market
    share.


    Fedora has decided to solve this problem by splitting the difference. The Fedora
    7 release doesn’t include the ATI or NVIDIA 3-D graphics drivers. This makes the
    distribution completely open source. However, if you want to support your ATI
    or NVIDIA 3-D graphics cards, there’s the


    The http://rpm.livna .org Web site is a community-operated repository of unapproved
    Fedora software packages. Not only does it include software packages for many
    of the video codecs I’ve been discussing in this chapter, but it also includes
    software packages for the ATI and NVIDIA 3-D graphics cards.


    By default, the Fedora Yum software installer doesn’t recognize the http://rpm.livna.org
    repository. This site includes instructions on how to add it to your repository
    list. If you do that, you’re ready to install the ATI or NVIDIA 3-D graphics cards:


    +   1. Choose Application+Add/Remove Software.

    This starts the Package Manager tool. If you’re not logged in as the root user,
    you will be asked to enter the root user password.

    2. Click the Search tab to search for a software package.

    3. Type the name of the desired video driver in the text box, and click the Search
    button.

    The ATI video driver is called kmod-fgfx, the NVIDIA video driver is called, strangely
    enough, kmod-nvidia.

    4. Select the latest version of the video driver available from the list and click
    the Apply button.'
  merge: -1
