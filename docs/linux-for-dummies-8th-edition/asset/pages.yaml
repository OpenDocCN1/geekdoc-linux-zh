  md: '# # Chapter 11


    # # Putting the X in Text


    **In This Chapter**


    +   * Viewing the contents of text files

    * Manipulating text files in nano

    * Working with text files in gedit


    From text editors to word processors, Linux offers a wide variety of options for
    working with words. In this chapter, I take a look at different ways to view the
    contents of a text file, using some simple text editors in both the non-GUI and
    GUI environments. In Chapter 12, I take a look at office suites for those who
    would rather do word processing.


    # # Viewing the Contents of a Text File


    Almost all configuration files in Linux are text files. In addition, many pseudo-programs
    (called *shell scripts*), all HTML documentation, and many other items in your
    system are text files. Fortunately, if you just want to see what''s in a text
    file and don''t want to do anything to its contents, you don''t have to use an
    editor or word processor. You can use three command-line commands to view text
    files: `cat`, `less`, and `more`. I bet that you will grow to learn them.


    Yes, that first `cat` is cat, and it''s taken from the word *concatenate*, which
    means to bring together to end — you can use the `cat` command on multiple-text
    files to have their text joined, one file''s contents directly after another''s.
    Typically you use this command in the Linux world in the format `cat filename`,
    where the contents of the file `filename` are displayed on the screen. For example,
    if you create the short text file `greetings` and then type `cat greetings`, you
    see the following:'
  merge: -1
  pgno: 203
- img_proc: true
  md: '# 186 Part III: Getting Things Done


    ```

    $ cat greetings

    These are the contents of the greetings file.

    Meow!

    $

    ```


    Of course, if the file contains more than a screen''s worth of information, cat
    spews it all out one time like a big handball, but the last screen of text scrolls
    off the screen. It''s a good thing that you have other choices. The one you''re
    likely to choose is less, which displays the contents of a file full screen at
    a time. You can use the spacebar to continue to the next screen. You can use the
    arrow keys to move up and down one line at a time, if you want.


    An alternative to less is more. The main difference between the two is that more,
    you can only move through the file and see only a screen''s information of at
    a time. You can''t back up.


    To use either less or more, the format is similar to the format used with the
    cat command: less filename or more filename. When you finish reading the document,
    press Q to exit.


    # Editing Text Files with nano


    If you aren''t using (or can''t use) the GUI, you have numerous text editors available
    to you. The most powerful of these are vi and emacs, which you''ll hear many people
    go on about. However, both programs require a learning curve. For beginners who
    want to edit the dang file and move, I recommend nano, which offers a friendly,
    menu-driven interface.


    To open a file in nano, type nano filename, such as nano file1. This action opens
    the file in the nano editor, as shown in Figure 11-1.


    You can then edit or type in that file as you need to.


    # Saving your work as you go


    To save your file''s contents without closing it (so that you can keep working
    on it):


    +   1. Press Ctrl+O to Write Out.


    A prompt appears toward the bottom of the screen, asking for the name of the file
    and offering the current name as the default option.'
  merge: -1
  pgno: 204
- img_proc: true
  md: '# Chapter 11: Putting the X in Text


    ![](img/9e1543123a324def5e9e0f9e6fc0f80b_205_0.png)


    Figure 11-1: The file open in the nano editor in Fedora Core.


    +   2. If you want to use the same name, press Enter. If you want to change the
    name, make your changes and then press Enter.


    The lower part of your screen now displays that it wrote (saved) a certain number
    of lines.


    +   3. Get back to work!


    # Saving and moving on with your life


    To save your file''s contents and close it (because you''re done working on it
    for now) — or close the file and not save the changes — do the following:


    +   1. Press Ctrl+X to Exit.


    A prompt appears towards the bottom of the screen, asking whether it should save
    the modified buffer. This question is a fancy way of asking whether you want to
    save your changes.


    +   2. Press Y to save your changes or press N to save them.


    If you press Y, and you''re asked for the name of the file and offered the current
    name as the default option. If you press N, nano closes and exits, so you''re
    finished with these steps.


    +   3. If you want to use the same name, press Enter. If you want to change the
    name, make your changes and then press Enter.


    The nano editor closes, and your file is saved.'
