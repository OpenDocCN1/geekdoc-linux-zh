    # Playing pretend with SUID and SGID


    Sometimes a program needs to be able to do things that the user running doesn''t
    actually have the filesystem permissions to do. In case, a file is allowed to
    pretend someone else in order to do what it has to. A file that pretends to belong
    to another user when run is said to have SetUID (SUID, or Set User ID) turned
    on. Files that tend to belong to a group that the user running doesn''t belong
    to are said to be SetGID (ID).'
