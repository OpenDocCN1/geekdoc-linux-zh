  md: '# Part II: Getting Up to Speed with Linux


    command-completion feature in that, if more than one file contains the letters
    you type, you hear a beep and need to press Tab again to see a list of choices.


    It takes a little getting used to, but after you have control of the Tab key and
    the shell command-line completion feature, you may wonder how you ever got without
    it.


    # Accessing your command history


    It''s nice of the shell to remember what you have done, for better or worse. Having
    the shell keep track of the commands you enter makes it easy to return to those
    god-awfully long commands you fetched a while ago — even days ago! Let me give
    an example. Suppose that yesterday you issued a command to find all core dump
    files in your system (Core dump files are massive files containing debugging data
    that only an expert programmer or your computer can understand) and delete them
    like this:


    ```

    find / -name core -exec rm \;

    ```


    To reexecute the command, all you need to do is fish out of your shell history
    and rerun it. The simplest way (if you''re reexecuting the exact version of the
    command you used last time, in this case would be the find command) is to type
    find and press Enter. Doing so tells your system to look through your history
    and rerun the last instance of find in the list.


    On the other hand, if you have run the find command more than once and want to
    make sure you''re reexecuting the right version, you need to read through your
    command history. You can do line by line by pressing the arrow key until you locate
    the command you want to reexecute. Then just press the Enter key to run the command
    again.


    ![](img/9e1543123a324def5e9e0f9e6fc0f80b_108_0.png)


    The history command lists the last 20 commands (by default) when you enter it
    at the prompt, if you''re curious about what they were. If you want to see a larger
    list of them, use the techniques covered in Chapter 11 to view the contents of
    the file ~/.bash_history.


    # Working with Variables


    Variables in the shell are words or strings of text that computers use to represent
    a piece of data. An example of using a variable is setting the variable fruit
    to contain the text apple. A number of standard variables contain information
    about your account and environment settings.'
