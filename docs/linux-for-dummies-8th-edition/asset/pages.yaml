    and more. Then you discover how to edit text files, and go whole with word processors
    and other office suite thanks to OpenOffice. The fun is in this part too, how
    to use audio and video in the Linux world, and how to access software and formats
    that you''re only available to Windows users.


    # Part IV: Junior Administrator Boot Camp


    In this part of the book, you discover how to care of your system. We see how
    to handle various file formats, how to install new software, and most important,
    how to keep your system updated so it''s not vulnerable. You also find out about
    basic system administration tasks like creating and managing accounts, caring
    for your filesystem, setting up printing, and more. Then you find out a bit about
    keeping your Linux system secure. Hint: As any operating system, the most important
    thing is keeping it up-to-date!


    # Part V: The Part of Tens


    In this book''s great climax, we sum up and distill the essence of what you know
    now about Linux and its inner workings. Here, you have a chance to revisit some
    key troubleshooting tips and tricks for Linux systems, along with really kinda
    geeky stuff: setting up your wireless access point, setting up a print server
    that all of your computers can print to, and setting up a file server that all
    of your computers can use.


    # Part VI: Appendices


    This book ends with a set of appendices designed to sum up and further expand
