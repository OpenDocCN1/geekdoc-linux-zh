  md: '# Chapter 1: Getting Acquainted with Linux


    recipients are bound by copyright law to respect the freedom of anyone else to
    use the software in any way they choose. Software licensed with the GPL is also
    known as copyleft (the reverse of right, get it?). Another way to remember the
    GPL is through its ultimate result: Guaranteed Public for Life.


    While Stallman''s work set the stage for Linux''s rapid climb to popularity, the
    operating system he and his crew were working on it longer than expected. If you''re
    interested in the completed version, go to www://www.gnu.org/software/hurd/hurd.html.


    # Who''s in charge of Linux anyway?


    As an open source project evolves, various people emerge as leaders. A leader
    who becomes benevolent dictator has spent more than anyone else on a particular
    problem and has some unique insight. Normally, the words democratic and dictator
    are never paired in the same sentence, but the open source model is a very democratic
    process that endorses the region of a benevolent dictator.


    Linus Torvalds is still considered the benevolent dictator of the Linux kernel
    (the operating system''s core). He ultimately decides what features are added
    to the kernel and what features aren''t. The community trusts his vision and discretion.
    In the event that he loses interest in the project, or the community decides that
    he has gone senile, a new leader will emerge from amongst the very competent people
    working with him.


    # Einstein was a Volunteer


    Someone is a volunteer or donates time to a project isn''t necessarily providing
    a second-rate effort (or only working on weekends and holidays). In fact, any
    human resources expert will tell you that people who choose to do a job of their
    free will produce the highest quality products.


    The volunteers who contribute to open source projects are often leaders in their
    fields who depend on community collaboration to get useful work done. The open
    source concept is no stranger to the scientific community. The impartial peer-review
    process that open source projects foster is critical in validating some new feature
    or capability as being technically correct.


    Those who paint the open source as copyright violators and often misunderstand—or
    ignore—vital issues. Open source programmers are very proud of their work and
    are very concerned about their copyrights, not wanting them to be stolen by others—hence
    licenses such as the GPL. This concern creates an atmosphere with the


