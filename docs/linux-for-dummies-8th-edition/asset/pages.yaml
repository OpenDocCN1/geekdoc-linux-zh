  md: '# Chapter 1: Getting Acquainted with Linux


    In this chapter, I intend to answer that last question for you. I also hope to
    paint a picture of the open source software development model that created Linux.


    # Anatomy of an Open Source Software Project


    > Linux isn''t a product. Linux is an organic part of a software ecosystem. —
    Michael Robinson, Netrinsics


    To the casual observer (and some corporate IT decision makers), Linux appears
    to be a free mutation — a rogue creature randomly generated by anarchy. After
    all, can something so complex and discipline dependent a computer operating system
    be developed by a loosely knit band of volunteer geeks from around the world?


    As science is constantly attempting to classify and explain everything in existence,
    technology commentators are still trying to understand how the open source approach
    can create superior software, especially in cases there is no choice. Often the
    reasons have much to do with the usual human desire to fill a need with a solution.
    When a programmer in the Linux world wants a tool, the programmer simply writes
    one — or bands with other people who want a similar package, and they write it
    together.


    # GNU who?


    — software created out of need rather than profit. Even though UNIX became became
    proprietary software, the ideas and motives for its creation were originally based
    on practical needs. What people usually refer to (in the singular) as the Linux
    operating system is actually a collection of software tools that were created
    with the express purpose of solving complex computing problems.


    The speed of Linux''s popularity wouldn''t be possible without the vision of a
    man named Steven Levy (author of the book Hackers) refers to “The Last of the
    Great MIT AI-LAB Hackers” — in the original sense of the word hacker as someone
    who plays with code, not the current popular meaning that implies criminal intent.
    This pioneer and advocate of freedom software is Richard Stallman.'
  merge: -1
  pgno: 31
- img_proc: true
  md: '# 14 Part I: Getting Your Feet Wet


    The Massachusetts Institute of Technology (MIT) has held a reputation for nurturing
    the greatest minds in the technological disciplines. In 1984, Stallman, a gifted
    student and brilliant programmer at MIT, was faced with a dilemma — sell his talent
    to a tidy sum of money or donate his gifts to the world. He did what we''d all
    do...


    Stallman set out on a journey to create a completely free operating system that
    would dominate the world. He understands — and continues to live — the original
    ethic, which declares that information wants to be free. This concept wasn''t
    new in his time. In the early days of the computing industry, many advancements
    were made by freely sharing and programming code. Manufacturer-sponsored user
    groups brought the best minds together to solve complicated problems. This ethic,
    Stallman felt, when others began to hoard software as their own intellectual property
    with the single purpose of profit.


    As you may have not gathered by this point, widespread and accessible source code
    is paramount to successful software development. Source code is the term for the
    human-readable text (as opposed to the unreadable cyber-hieroglyphics in an "executable"
    file) that a programmer types to communicate instructions to the computer.


    Writing programs in binaries is an extremely arduous task. Modern computer software
    is usually written in a human-friendly language and then compiled, or translated
    into the computer''s native instruction set. To make changes to software, a programmer
    needs access to a program''s code. Most proprietary software comes only as a precompiled
    product; the software developer keeps the source code for those programs under
    lock and key.


    After determining that his operating system would be built around the conceptual
    framework of UNIX, Stallman wanted the project to distinguish his system from
    UNIX, so he chose the recursive GNU (ga-new), which means GNU is not Unix.


    To finance the GNU project, Stallman organized the Free Software Foundation (FSF),
    which said free (open) software to help the programmers who worked on his development.
    (Remember, we''re talking free in speech, not free beer.) Although this organization
    and goal of creating a complete operating system was necessary and important,
    a more important piece of the puzzle had to be put into place to protect this
    new software from business pirates — a concern still relevant today as a former
    Linux company tries to hijack ownership of decades of volunteer work from people
    around the world.


    The GNU General Public License (GPL) is a unique and creative software license
    that uses copyright to protect the software user, which is usually the opposite
    of how a copyright works. Generally, a copyright is an enforceable designation
    of ownership and restriction from duplication by anyone but the copyright holder.
    When software is licensed under the GPL,


