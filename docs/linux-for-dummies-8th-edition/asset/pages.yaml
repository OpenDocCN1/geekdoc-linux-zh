    | Menu Choice | What You Find |

    | Add to Panel | The dialog box lets you add applets, menus, and other objects
    to your main panel |

    | Properties | The options for setting this panel''s behavior |

    | Delete This Panel | The capability to delete a secondary panel but not the main
    icon panel |

    | New Panel | The options for creating new panels that sit on different parts
    of the screen |

    | Help | The Help browser for GNOME |

    | About Panels | A dialog box with some basic Panel information |


    # ### The Add to Panel dialog box


    The Add to Panel dialog box (see Figure 5-3) is accessible from the menu (see
    the previous section). This dialog box contains a list of applets — small, specialized
    programs you can use to add particular functionality to a panel. To add one of
    these applets to your panel, open the dialog box, select the applet you want to
    use, and then click Add. The applet appears on your panel. If you right-click
    the applet and choose Move, you can slide the applet along your panel until you
