- img_proc: true
  md: '# Part IV: Junior Administrator Boot Camp


    # Choosing Secure Passwords


    The first line of defense from intruders is the passwords used on your system.
    For each account you have set up on your system, the passwords must be strong
    and difficult to figure out. Even if one of the accounts has a weak password,
    you may be in some trouble. Amazingly enough, 70 percent of the cases where unauthorized
    individuals gained access to systems, the password for an account was the word
    password itself! When choosing good passwords, follow these rules:


    +   - Don''t use any part of your name.

    - Don''t use the names of friends, loved ones, or pets.

    - Don''t use birthdays, anniversaries, or other easily guessed dates.

    - Don''t use dictionary words.

    - Don''t keep your password written down near your computer, unless it''s buried
    in something else, such as writing it into an address.

    - Don''t tell anyone your password. If someone needs to access specific files,
    give the person an account and set up permissions and groups properly so they
    can do.

    - Do a mix of lowercase letters, capital letters, and numbers.

    - Ensure that your password contains a minimum of eight characters.

    - Do use acronyms from sentences, such as having the password M8ydnit to stand
    for "My eight-year-old dog''s name is Tabby".


    Every person on your system needs to follow these rules, including you! Consider
    keeping a sheet of paper with these rules on it next to the machine.


    > REMEMBER

    I can''t stress this enough: Never give out your password. Make sure that the
    people using your machine understand this rule. You can always find alternative
    methods to accomplish a task without giving out your password. If someone wants
    to use your machine, make an account for that person. Then they can have their
    own password!


    # Updating Software


    All users can download and install new software. Of course, the programs they
    install are limited to the user''s own permissions. The thing to be careful of
    here — as any operating system — is that you don''t get a version of a program
    that has been tampered with or is even an all-out fake trying to trick folks into
    installing it.'
  merge: -1
  pgno: 320
- img_proc: true
  md: '# Chapter 18: A Secure Linux Box Is a Happy Linux Box 303


    Most Linux applications and other Linux software programs are distributed by way
    of the Internet. In fact, the development cycle of new (and updates to) Linux
    software revolves around the Internet for file exchange, e-mail, and forum newsgroup
    discussions. Make sure that you and other users of your Linux system are comfortable
    with the Web sites that are used and visited. You need to develop a list of trusted
    sites that provide you with the information you need and are not misleading in
    your presentation. As a starting point, you can trust all the Web sites referenced
    in this book because I have accessed them all. If you or a user of your Linux
    system is unsure whether you can trust a particular Web site, do some research
    and perhaps ask others for their opinions.


    Chapter 16 details how to keep your distribution and its software up to date.
    Please, please, please, do so After!, as the person in charge, your job is to
    make sure that this computer stays intruder-free. In addition making sure that
    you do all the things a user would do for your user accounts and the superuser
    (root) account, no matter which Linux distribution you''re running, you must keep
    up-to-date with security problems.


    # Network holes


    On a Linux server or workstation — or any computer at all, using any operating
    system — you should not have any network services running that you don''t intend
    to use. Think of each network program running as a glass window or sliding door
    in your house. Each network service is a weak spot, and many nasty folks are out
    there on the Internet who like to go up to all the houses and make note of how
    many windows and glass doors are on them, what kinds they are, and how easy they
    are to breach.


    # Controlling your services


    The more software you''ve installed on your system, the more services it may have
    running in the background. Fedora provides a utility for us to control what applications
    the system starts automatically. You can do this from the network service management
    program.


    To open the network service management program, choose System:Administration:Server
    Settings:Services (see Figure 18-1). The Services option may be directly in the
    Administration menu: It depends on the collection of software you currently have
    installed. You''ll also be asked for the root user password to ensure you have
    permissions to mess with the service settings.'
  merge: -1
  pgno: 321
- img_proc: true
  md: '# 304 Part IV: Junior Administrator Boot Camp


    ![](img/9e1543123a324def5e9e0f9e6fc0f80b_322_0.png)


    Figure 18-1: The Fedora Service Configuration dialog box.


    The installed services are listed in the left side scroll window. Fedora starts
    the services with a check next to them at boot time. You can turn a service on
    or off by setting or removing the checkmark in a service''s check box.


    Services may be interested in turning on or off include


    +   - apmd: This service may not be necessary in anything but a laptop. It''s
    used for monitoring battery power.


    +   - iptables: This service is your firewall (more on the firewall in the section)
    "Controlling and adjusting your firewall," later in this chapter). If you need
    to momentarily shut it down, you can do so using the Service Control box.


    +   - ip6tables: This service is for the new, improved IP version 6 protocol,
    which isn''t being used in most of the world you use. You can most likely turn
    this off without breaking anything.


    +   - kudzu: If you''re using Fedora and keep getting bogged down hardware at
    boot time, shutting off this service will stop all those messages. You can run
    it manually as if you change hardware later.


    +   - mdmonitor: Shut this service unless you had to implemented software RAID
    during your installation. (You had to go out of your way to do so, if you don''t
    know, you probably didn''t!) If you change this service to or off, make sure that
    mdmdmp is also on or off (matching) as well.'
  merge: -1
