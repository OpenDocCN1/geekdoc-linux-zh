  md: '# Chapter 16


    # Adding Software to Linux


    +   **In This Chapter**

    - Recognizing tarballs, RPMs, and compressed files

    - Creating tarballs and archives

    - Compressing files

    - Opening tarballs, archives, and compressed files

    - Installing and removing RPMs


    > I will make you shorter by the head.

    — Queen Elizabeth I


    When you start using a new operating system, one of the most frustrating things
    is trying to figure out all the goofy file extensions. The Windows world has .exe
    and .zip. The Macintosh world has .bin and .hqx. What about the Linux world? It
    certainly has its fair share of bizarre extensions, but really, they make a great
    deal of sense after you know the programs that make them. In this chapter, you
    find out all about .tar, .gz, .tar.gz, .tgz, .bz2, and .rpm.


    After you have the letter jumble figured out, you''ll be happy to find that Linux
    offers a number of cool tools for working with these crazy files, updating your
    system, adding new software, and more.


    # Opening Downloaded Files


    The Linux and UNIX worlds are full of strange terms and acronyms. For example,
    if someone comes up to you out of the blue and starts talking about'
  merge: -1
  pgno: 285
- img_proc: true
  md: '# 268 Part IV: Junior Administrator Boot Camp


    tarballs, you probably get a mental image of sticky, smelly balls of tar, maybe
    rolled in feathers. A tarball is something you run into regularly in the Linux
    world, especially when you''re looking for software or you need to save-yourself
    space. A tarball is a bunch of files (and possibly directories) packed-together
    in a tar file and then compressed using the gzip utility.


    Fortunately, all you need to know is how to double-click a file in order to access
    the many formats listed in Table 16-1. When you double-click the file, your File
    Manager shows you what''s inside.


    Although Table 16-1 mentions operating systems, it doesn''t contain hard and fast
    rules. People tend to use whatever kind of programs they''re comfortable with
    no matter what operating system they''re on.


    | Table 16-1 Potential Formats for Downloaded Files |

    | Extension | Meaning | Program(s) Involved |

    | .bz | Older form of .bz2. | bzip, bunzip |

    | .bz2 | Slower but more efficient compression for some types of files, like text
    files. | bzip2, bunzip2 |

    | .gz | Typical compressed for Linux and UNIX. | gzip, gunzip |

    | .iso | A CD-ROM or DVD-ROM "image," which is a single file that contains a CD
    or DVD''s entire contents. You have to tell your CD or DVD burner software that
    this file is an image that it knows not to just place a copy of this file onto
    the media. | See Chapter 18 |

    | .rpm | Not a file to "open"; see the "Installing New Software" section, later
    in this chapter. | RPM |

    | .tar | A bunch of files bundled together. | tar |

    | .tar.bz2 | A tarball, which in this case is a .tar file inside a .bz2 file.
    | tar, bzip2, bunzip2 |

    | .tar.gz | A traditional tarball, which is a .tar file inside a .gz file. | tar,
    gunzip, gzip |

    | .tgz | A traditional tarball, which is a .tar file inside a .gz file. | tar,
    gunzip, gzip |

    | .Z | Old-style UNIX compressed file. | compress, uncompress |

    | .zip | Windows .zip file. | zip, unzip |'
  merge: -1
