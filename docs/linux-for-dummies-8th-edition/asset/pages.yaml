  md: '# 144 Part II: Getting Up to Speed with Linux


    +   5. Select the proper device from the Modem Device drop-down list.


    If you know your modem is on COM1 or COM2 in Windows, translating this-talk to
    Linux isn''t hard: You just need to subtract 1. So, it''s ttyS0 for COM1 and ttyS1
    for COM2. If you''re using a USB modem (it has a flat, rectangular connector),
    your modem is probably on COM1. If you''re not using a USB modem, your modem is
