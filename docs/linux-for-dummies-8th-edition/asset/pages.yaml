  md: '# Asking Linux to complete a command or filename for you


    Considering that you do much more typing on the command line than you may normally
    do in a GUI environment, a feature that provides typing shortcuts wherever possible
    is great. Command completion is a function of the shell that completes filename
    and system commands.


    The capability of the Linux file system to deal with practically unlimited sizes
    of filenames means many filenames can become huge. Typing these long filenames
    can be cumbersome. Fortunately, with command completion, typing a command or a
    long filename is short work.


    You may want to use command completion in two situations: to enter a command or
    to complete a filename.


    # Completing a command


    Suppose that you want to type a command, but you can remember only it begins with
    the letters up is supposed to return the length of time that has passed since
    your system was rebooted. Type up at the command prompt and press Tab:


    ```

    [dee@catherine dee]$ up up [TAB]

    ```


    One of two things happens:


    +   - If only matching command is in the search path (directory locations for
    searching for programs; type echo $PATH to find out what yours is), your command
    line is completed with that command, and the system waits for you to press Enter
    to execute the command.

    - If you hear a beep, it means that no one command begins with up. Simply press
    Tab a second time, and all the possibilities are displayed. Locate the command
    on the list and continue typing it until the first letters are unique, at which
    point you can press the Tab key to complete the command. If nothing is displayed
    after pressing twice, there is no match at all.


    # Completing a filename


    Command-line completion isn''t only for commands; if you''re typing a filename
    on your command line, you only need to type the first few characters and then
    press Tab. The shell searches the current working directory for filenames that
    match what you have typed and subsequently completes the filename on the command
    line. This feature behaves the same way as the'
  merge: -1
