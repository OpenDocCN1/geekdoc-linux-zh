  md: '# Chapter 4: Booting and Stopping Fedora


    # 61


    you may have a problem with the kernel. If the boot proceeds past that, the kernel
    scrolls more down your screen as it finds all of the system''s hardware and loads
    what it needs to handle. Anywhere in this stage, if you run into the list of problems
    given a moment ago, is again the realm of kernel failure (you might even see the
    kernel panic).


    Recovering from a kernel-loading failure or panic (aside from the operating system
    not found situation described in the previous section) is one of the more challenging
    issues in Linux. This task is, unfortunately, not for the faint of heart. On the
    other hand, unless you just installed the system, it is likely that the failed
    kernel is one you went through an update. In that case, you''re in luck. Write
    down any error messages you see. Then reboot, press a key to select boot menu,
    and choose the Linux option down from the top (default one). That is the next
    kernel. Press enter and you should boot just fine (if, not reboot and try the
    third one, and so on until you boot). After you''re running again, you have two
    options. You can either go to www.google.com and search for the specific error
    messages you found to figure out what''s wrong, or wait the next kernel update
    comes out and hope it won''t fail to boot.


    If it is your original installation that doesn''t start properly, then you have
    a fallback kernel option. If this is your problem, many people just reinstall
    and hope that action fixes everything. Often, it does. Otherwise, try a search
    as mentioned earlier, or see Chapter 2 for places to help look among the Linux
    community.


    # Step 4: Control is handed over to init


    When the kernel finishes loading, it passes the start-up process to a program
    named init. The init program is responsible for starting all services and programs.
    You can see these programs launching as they scroll up the screen with [OK] or
    [FAILED] on the right side of the monitor. If you see these lines, know that your
    kernel has finished successfully.


    The main problem you may encounter with init services (programs that run in the
    background). One or more of these can fail to start properly, as indicated by
    the [FAILED] status shown during the boot process. Services usually fail because
    of misconfigurations or unsupported hardware drivers. It''s not the end of the
    world if a service won''t start, sometimes you end up having to wait a number
    of minutes before a really stubborn one finally admits to the system that it can''
    start. Be patient and make a note of which service is giving you trouble. Later,
    you can turn to Chapter 18 and find how to shut that service off so it won''t
    be a problem again.'
