    that you have moved everything before installing Linux, because Linux is going
    to completely wipe the drive.


    Those who can''t spare an entire hard drive for Linux and already have Microsoft
    Windows installed will have to resize their current Windows installation. If this
    is your situation, you need to work through this chapter. Absolutely DO NOT PROCEED
    TO CHAPTER 3 without at least reading the next section, "Preparing to Use Linux
    and Microsoft Windows Together." Sorry for worrying, but you can wipe out your
    Windows installation if you don''t take precautions!


    If you are using Microsoft Windows Vista and plan to purchase a product to help
    you do things like resize partitions, make sure and read the product''s box and
    if Vista is supported. Partition Magic, for example, has an upgrade you can download
    to add Vista support. See www.symantec.com/windowsvistupport.


    If you absolutely don''t want to boot down, you have three other options—I know
    there were four approaches in total and adding these three brings us to six, give
    me a moment to explain. You can use VMware (see Chapter 15) to install a "virtual"
    Linux machine that lives in a window inside your Windows installation. You can
    install only Linux on the computer and then use VMware or Win4Lin to install a
    virtual Windows machine that lives in a window within your Linux installation.
    Or, if the thought of changing anything on your computer gives you, you can use
    a live distribution (see Chapter 3) to boot your computer into Linux without installing
    anything.


    So give some thought to which of the options detailed here you prefer, and then
    read on.


    # Preparing to Use Linux and Microsoft Windows Together


    If you are planning to run Linux and Microsoft Windows on the same machine, the
    odds are that you already have Windows installed and have been using it for some
    time. Because I hate to hear screams of anguish all the way up here in western
    Canada, take a moment to assess what you have and what you need to do.'
