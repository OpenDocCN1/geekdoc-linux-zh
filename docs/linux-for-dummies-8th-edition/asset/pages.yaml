  md: '# Chapter 14


    # Messing with Video and Graphics


    In This Chapter


    +   - Watching online and downloaded videos

    - Watching DVDs

    - Creating and modifying high-powered graphics with The GIMP

    - Playing 3-D games


    > Video killed the radio star. — The Buggles


    There''s no question that video is one area where Linux systems didn''t even support
    a Windows-style desktop! In the early days of Linux, it was close to impossible
    to display any type of videos, let them use for playing movies or high-end graphics
    graphics.


    Fortunately, nowadays, things are much different. There aren''t many things your
    Linux computer can''t do in the video world (unless course it''s illegal, but
    more on that later). In this chapter, I will walk you through your Linux computer''s
    video and graphics capabilities.


    # Watchin'' Those Silly Web Clips


    The Internet has become a clearinghouse for just any type of video content you
    can imagine (and even you couldn''t imagine if you tried). From Google Videos
    to YouTube, there are lots of sites to keep you entertained.


    Your Fedora system has the ability through the Firefox Web browser (see Chapter
    10) to display lots of different types of Web clips, but unfortunately, not all
    of them by default.'
  merge: -1
  pgno: 257
- img_proc: true
  md: "# 240 Part III: Getting Done\n\n# # Checking your plug-ins\n\nThe key to displaying\
    \ Web video content in Firefox are plug-ins. As discussed in Chapter 10, plug-ins\
    \ provide additional functionality to the Firefox browser.\n\nYou can easily see\
    \ what plug-ins you already have installed in your Firefox setup by following\
    \ these steps:\n\n+   1. Open Firefox by choosing Applications-Internet-Firefox\
    \ Browser.\n   You can also start Firefox by clicking the Globe icon on the Top\
    \ Panel.\n2. In the URL box, enter about:plugins and press Enter.\n\n* Totem:\
    \ A full-featured video and audio player that can display AVI, ASF, WMV, OGG and\
    \ MPEG video formats, as well as WAV and MP3 audio formats\n* Helix DNA: A RealPlayer\
    \ compatible player that plays RPM video formats\n* DivX Web Player: For playing\
    \ DivX-encoded AVI videos\n* QuickTime: For Apple QuickTime MOV and QT formatted\
    \ videos\n\nThe About Plug-ins page displays information about the current plug-ins\
    \ installed, as shown in Figure 14-1.\n\nBy default, the Fedora 7 Firefox installation\
    \ includes the following plug-ins:\n\nAlthough on the surface it may mean that\
    \ you've got most of your Web video bases covered, you might be disappointed with\
    \ your actual video testing results. Although Totem supports the popular WMV and\
    \ MOV video formats, there is more to quality video than just supporting the right\
    \ files.\n\nThe Microsoft and QuickTime video formats use a proprietary encoding\
    \ scheme called a codec. Because codecs are proprietary, they are strictly controlled\
    \ under licensing agreements. Microsoft Corporation controls the WMV video format\
    \ and, if you guessed, they don't provide a license for using this with most Linux\
    \ systems. Because of this, Fedora doesn't support WMV video by default. The same\
    \ applies to QuickTime MOV and QT video formats.\n\nThat said, some open source\
    \ programmers have reproduced the Microsoft video codecs and created a software\
    \ package called W32codec. Installing this package allows you to view almost every\
    \ type of video available on the Web. Because this is not considered a legal software\
    \ package in the United States, it is not included in the standard Fedora distribution.\
    \ You can very likely find it by looking on the Internet, but don't say I didn't\
    \ warn you."
  merge: -1
  pgno: 258
- img_proc: true
  md: '# Chapter 14: Missing with Video and Graphics 241


    ![](img/9e1543123a324def5e9e0f9e6fc0f80b_259_0.png)


    Figure 14-1:

    The Firefox

    About Plug-

    page.


    If you want to legally use Microsoft video formats in the United States in Fedora,
    you can purchase the CrossOver commercial software for Linux. This provides the
    appropriate codes for viewing Macromedia Shockwave, Windows Media Player, and
    Apple QuickTime video formats, as well as the libraries required to run many Microsoft
