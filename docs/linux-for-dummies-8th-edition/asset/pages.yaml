  md: '# Chapter 12: Word Processing and More with OpenOffice


    +   * Microsoft Word 95 (.DOC) format: And even some of the older Word formats.


    +   * Microsoft Word 6.0 (.DOC) format: Even some of the really old Word formats.


    +   * Rich Text (RTF) format: A standard format for saving basic font and document
    information.


    +   * StarWriter 3.0 – 5 (SDW) format: Sun’s StarOffice word processor (a cousin
    to OpenOffice.org).


    +   * Microsoft Word 2003 (XML) format: An attempt by Microsoft to create a standard
    word processing document using the XML standard language.


    Although not available in the Save As dialog box, the OpenOffice.Org Writer toolbar
    allows you to export any format document to the PDF document format. This feature
    alone can save you from having to purchase an expensive commercial product (from
    an unnamed commercial software company).


