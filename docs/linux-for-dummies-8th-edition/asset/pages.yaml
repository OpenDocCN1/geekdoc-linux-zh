  md: 'Most of these buttons have downward-pointing arrows, which will allow you to
    see the full range of features they offer.


    # Working with Impress files


    The OpenOffice.org Impress application doesn''t support as many file types as
    it''s Writer and Calc siblings. Mostly this is is due to a lack of standards in
    the presentation graphics environment.


    The formats that Impress does support


    +   - OpenDocument Presentation (.ODP) format: A standard presentation graphics
    format proposed by OpenOffice.org.

    - OpenOffice.org 1.0 Presentation (.OTP) format: The original OpenOffice.org presentation
    graphics format.

    - Microsoft PowerPoint 97/2000 (.PPT) format: Possibly the most popular presentation
    graphics tool used in business. You can use Impress to read and write most PowerPoint
    slide presentations.

    - OpenOffice.org 1.0 Drawing (.SXD) format: An older rudimentary graphics drawing
    format.

    - StarDraw 3.0 – 5.0 (.SDA) format: Impress''s commercial cousin from Sun.

    - Starminimp 4.0 and 5.0 (.SDD) format: Impress''s commercial cousin from Sun.

    - OpenOffice.org Drawing (.ODG) format: Rudimentary graphics drawing format.


    Although Impress can work with OpenOffice.org Draw files, the default file format
    for Impress files is .ODP format. As with the other packages in the OpenOffice.org
    suite, Impress also provides a toolbar icon for you to save your slides as .PDF
    format.


    # Fine Art with OpenOffice.Org Draw


    Whether you''re an aspiring graphic artist or just need a tool that lets you generate
    simple graphics for use on their own, in a presentation, or elsewhere, OpenOffice.org
    Draw provides a host of drawing functions. If nothing else, it''s a whole lot
    of fun to play with! Nothing has to be practical.'
  merge: -1
