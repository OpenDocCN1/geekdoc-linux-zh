    Figure 20-2:

    The Printer Configuration Details window.


    +   4. Check the Shared check box in the right window pane.


    You can also set other options (described in detail in Chapter 17) for the printer,
    such as setting a banner page, restricting the printer to specific users, and
    setting the page size and paper source for the printer.


    +   5. Click the Print Test button.


    It''s always a good idea to make sure the local printer is working properly before
    you try printing from a remote client.'
