  md: '# 298 Part IV: Junior Administrator Boot Camp


    | Column | Description |

    |---|---|

    | Started | The time the process started running. |

    | Nice | The system priority of the process. Higher nice numbers have lower priority
    on the system. |

    | ID | The unique process ID (PID) the system assigned to the process. |

    | Security Context | The security classification assigned by the SELinux system.
    |

    | Arguments | The name of the command and any command line arguments used to start
    it. |

    | Memory | The amount of system memory the processes are using. |


    Here are a few other options you can set while you''re in the Processes tab dialog
    box:


    +   - **Update Interval in Seconds:** How frequently the System Monitor refreshes
    the data table

    - **Enable Smooth Refresh:** Gathers new process information before refreshing
    the table data, instead of refreshing table data as it gathers process information

    - **Alert Ending or Killing Processes:** Provides a warning dialog box before
    you are allowed to terminate a running process "just in case"

    - **Alert Hiding Processes:** Provides a warning when switching to a specific
    process


    You can also control processes that you own directly from the Processes tab. Right-clicking
    a process produces a menu that allows you to stop, end, or kill a process, along
    with changing the priority of the process.


    # Resources


    Clicking the Resources tab provides a quick overview of the hardware status of
    the system, as shown in Figure 17-15.'
