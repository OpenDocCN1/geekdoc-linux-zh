    # Double-Checking Hardware Compatibility


    If you''re installing Linux on hardware you already own, just give it a try and
    then see what doesn''t work. Parts of this section address fixing hardware problems
    in a general sense. In other chapters, more specific items as sound cards (Chapter
    13), wireless cards (Chapter 9), and so on, are addressed. So, if you run into
    trouble, start in the specific sections dedicated to particular, and then come
    here for more general help if you still haven''t solved the problem.


    The biggest problem areas are wireless cards (the Fedora project is heavily targeting
    for Fedora 7) and the very latest-bang hardware such as video cards, sound cards,
    and image scanners. You can check hardware compatibility lists before installing
    or purchasing new hardware, but they are of limited use because the hardware world
    changes so quickly. If you''re interested in looking, use the Red Hat Enterprise
    Linux listings at http://hardware.redhat.com/hcl/. (There''s no official Fedora
    list.) Keep in mind that this list focuses on business equipment instead of home
    items, so just you don''t see something listed that doesn''t mean it''s not supported.


    +   Don''t worry about items being Certified (heavily tested to make sure they
    work properly) or not. Supported and Compatible are fine most of the time for
    a home user. The best way to tell if a piece of hardware is supported or not is
    to do a Web search. Many go to www.google.com/linux and do a Web search on the
    model and make of the hardware, plus the word Linux. For example, you can search
    on Innovation Linux to find how other people are far with this particular brand
    and model of hardware.(No endorsement of any hardware mentioned as examples is
    implied here, of course.) Such a search is likely to show you what problems and
    successes people have run into with that particular piece of hardware.


    +   If even thinking about computer hardware gives you dizzy spells, don''t worry,
    you can find plenty of information about the Internet. A great place to start
    is www.tomshareware.com. Other places to look for information on how various devices
    work in Linux include'
