  md: '# 222 Part III: Getting Done


    # Document section


    Things get tricky here if you''ve never used formula-editing software. You can''t
    type anything in the main (upper) document window in OpenOffice.org Math. Instead,
    you type in the Commands (lower) window. Right-clicking in the Commands window
    opens a shortcut menu. To help you get used to working with the formulas, I suggest
    that you play around with this tool. For example, if you have never used software
    like this, you might follow these steps:


    +   1. Right-click in the Commands window.


    The main shortcut menu opens.


    +   2. Select a submenu to open.


    For example, Formats.


    +   3. Select a formula component within this submenu.


    I''m a geek, and fondly remember taking a class on matrices, so I chose matrix
    [...] as an example. Immediately, the code that''s needed to add a matrix to my
    formula appears in the Commands dialog box. One moment later, because I''m let
    the matrix refresh the rest of the screen as I work, I see what the matrix looks
    like in the document window. The combination is shown in Figure 12-12.


    Figure 12-12: Starting to add a matrix in OpenOffice.org Math.


    ```

    Matrix[ <7> ## <7> < <7> ]

