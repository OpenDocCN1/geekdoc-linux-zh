    # Step 10: Map to Shared Folders


    Now that your file server is complete, it''s time to test it out. There are a
    few different ways you can do this. The easiest is to mapping a shared folder
    from a remote Windows client. For this, I''m using a Windows XP Home Edition:


    +   1. Open the My Computer icon by either double-clicking the desktop Computer
    icon or selecting it from the Start menu.

    2. Click Tools:Map Network Drive from the My Computer bar.

    3. Click the Browse button to browse the network.

    4. Select an available local drive letter to map to the network shared folder.

    5. Click Finish to complete the network shared folder mapping.


    Under Windows networks, you should see the Fedora Linux server listed as a network
    resource. Expand the resource and you will see the share names listed. Select
    the share you have access to.


    That''s all there is to it. You should now be able to see the shared folder in
    your Computer area. Clicking the shared drive letter shows the contents of the
    shared folder. You should have the ability to create, modify, and delete any files
    in that folder.


