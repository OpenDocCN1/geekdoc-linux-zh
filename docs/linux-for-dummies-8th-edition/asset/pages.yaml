  md: '# 10 Part I: Getting Your Feet Wet


    Don''t scratch your head hard; these concepts are tough to grasp initially, especially
    when you consider the conditioning you''ve received from the commercial software
    industry''s marketing departments. Perhaps you don''t know that when you purchase
    proprietary, shrink-wrapped software, you don''t actually own the software. Rather,
    you''re granted permission to use the software within bounds dictated by the licensor.


    Linux also has a license. However, the motives and purpose of the license are
    much different from those of commercial software. Instead of using a license to
    restrict use of the software, the GNU General Public License (GPL) Linux ensures
    that the software will always be open to anyone. No company can ever own or dictate
    the way in which you use or modify Linux — although they can have their own copyrights
    and trademarks on their various brands of it, like Red Hat and Novell. In essence,
    you already know Linux, and you can use it for anything you like, as long as you
    propagate the GPL freedoms to further recipients of the software.


    # Linux: Revolution or Just Another Operating System?


    > Contrary to popular belief, penguins are not the salvation of modern technology.
    Neither do they throw parties for the urban proletariat.

    — Anonymous


    Author note: Cute quote... obviously Anonymous has never been to a Linux convention!


    Before going any further into Linux, I need to get some terminology out of the
    way.


    Tux is the formal name of the mascot penguin that represents Linux. Rumor has
    that Linux''s creator, Linus Torvalds, is rather fond of these well-dressed inhabitants
    of the Antarctic.


    An operating system is the software that runs your computer, handling all interactions
    between you and the hardware. When you''re writing a letter, calculating a budget,
    or managing your recipes on your computer, the operating system provides the essential
    air that your computer breathes. Furthermore, an operating system isn''t just
    one program; it consists of hundreds of smaller programs and utilities that allow
    us to use a computer to do something useful. You run other programs (such as your
    word processor) on top of the operating system to get everything done.'
