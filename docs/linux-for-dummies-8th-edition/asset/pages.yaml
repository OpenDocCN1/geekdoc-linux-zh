    # Partitions versus Directories


    One very important (and geeky) thing to understand about the Linux filesystem
    is that it may not be all on one single hard drive or drive partition, and yet
    you don''t have to keep track of what drive or partition it is in other operating
    systems. In the Microsoft world, if you use separate hard drives or partitions,
    you have a specific letter designation for each one. The primary hard drive is
    C, the next is D, and so on. Under Linux, each of these drives and partitions
    quietly blends together.


    If you partitioned your drives on your own or before the installation process,
    you know that you needed to specify a mount point for each partition — which is
    like an empty spot in a puzzle, where the outside partition or media can be plugged
    into the rest of the filesystem. In the case of a hard drive that is part of your
    primary filesystem structure and added at boot time, there is no need for anyone
    to notice which directory is on which partition.'
