  md: '# Chapter 22


    # # Ten Troubleshooting Tips


    **In This Chapter


    +   - Dealing with frozen installations

    - Changing your boot environment

    - Recovering when you see some black-and-white text screen!

    - Escaping a hung GUI

    - Using multiple resolutions


    Troubleshooting is like reading a mystery novel. You have some facts, symptoms,
    and details, but you don''t know whodunit. You have to take whatever information
    you have, with that data, weigh the various possibilities, and then narrow them
    to a single suspect. Finally, you need to test your theory and prove that your
    suspect is the guilty party.


    Troubleshooting problems in Linux (or any operating system) can encompass many
    hardware and software issues. Whether the is the operating system, the hardware,
    or a service giving you fits, you can use some basic troubleshooting techniques
    to start your investigations:


    +   - Document the problem. Write down any and all symptoms that the system is
    showing, including actions you can and can''t. Jot down anything you see in error
    messages.


    +   - Examine the Linux log files. You can find most of these in /var/log directory.
    Look for the word "error".


    +   - Compare your system with a working system running the same distribution
    and version. Sometimes, comparing configuration files and settings may uncover
    the problem or narrow the possibilities.


    +   - Check connections. Check to make sure that all the hardware is connected
    properly and powered on. Verify that all cables and connections are attached properly.
    There''s always someone, somewhere, accidentally kicking a cable out from a wall
    connection.'
  merge: -1
  pgno: 383
- img_proc: true
  md: '# 366 Part V: The Part of Tens


    +   - **Remove new hardware.** Remove any hardware that you have changed or added
    recently (before the problem started) and see whether the problem disappears.
    If so, you can probably conclude that the new or changed hardware (or its driver)
    the culprit and start researching solutions.


    +   - **Reduce the number of active programs.** Stop running unnecessary services
    and applications that are not related to the problem at hand. You may more easily
    figure out what''s happening if other services and applications aren''t getting
    in the way.


    +   - **Check whether the problem is reproducible.** Does the same sequence of
    events produce the same problem? Suppose that when you try to print to a color
    printer, nothing happens. If nothing happens every time you attempt to print,
    the problem is reproducible. If, instead, sometimes your information is printed
    and at other times it isn''t, the problem pattern isn''t reproducible—or it''s
    caused by something more complicated than just clicking one button. Unfortunately,
    problems that unreproducible are more difficult to resolve because it seems that
    no pattern of events re-creates those problems.


    After you''ve come up with a solution, take a few moments to document the situation.
    Note the symptoms of the problem, its cause, and the solution you implement. The
    next time you encounter the same problem, you can call on your notes for a solution
    rather than reinvent the wheel.


    ![](img/9e1543123a324def5e9e0f9e6fc0f80b_384_0.png)


    If you don''t have any problems to troubleshoot (yet), document your environment
    before you do. Making a backup of your /etc directory and your /boot directory
    is a great start at.


    # Tip #1: “The Linux Installer Froze”


    When you''re installing Linux, the installation may just freeze. If it does, wait
    a bit and make sure that the installation process really froze. (Sometimes, the
    software takes a while to process information.) If the software looks like it
    has frozen, there''s no harm in rebooting your computer and starting over—just
    as you would with any operating system installation. Sometimes, you can reboot
    and never have that problem again. At other times, the problem may happen twice
    in a row and then be fine the third time. Be sure to try before giving up.


    If the installation still freezes in the same spot or close to the same spot,
    go to the distribution''s support pages (see Chapter 2). These pages may talk
    about some known problems and solutions that can help you and should'
  merge: -1
