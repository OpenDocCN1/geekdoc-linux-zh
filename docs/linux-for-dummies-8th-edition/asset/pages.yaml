- img_proc: true
  md: '# Chapter 17


    # Basic System Administration


    In This Chapter


    +   - Managing users

    - Playing with printers

    - Watching programs


    > After one look at this planet any visitor from outer space would say “I want
    to see the manager."


    > — William Burroughs


    kay, so you''ve got your Fedora Linux system running exactly the way you want,
    with just the right combination of software packages installed. You''re writing
    documents, creating fancy graphics, listening to music CDs, and even playing games.
    But don''t sit back and relax: There''s still more to do.


    You''ll always need to be tweaking things on your system — whether it''s allowing
    other people to use it, installing a new printer, or trying to figure out why
    a software program is running so slow (yes, Linux programs go bad sometimes).
    Keeping everything in order and running properly can be a full-time job. For a
    home Linux system, you may need to manage several user accounts and printers,
    as well as keep track of over a dozen programs running on the system.


    Fedora provides a few tools that help in the Linux management process. No doubt
    you''ve seen the Administration section menu on the desktop (see Chapter 5). Some
    of the items are fairly self-explanatory, such as Date and Time settings, Display
    settings, Keyboard settings, and the Language setting. However, other items aren''t
    quite easy to figure out how to use. This chapter walks through a few of the administration
    tools Fedora provides to help make running your system a little easier.'
  merge: -1
  pgno: 297
- img_proc: true
  md: '# Part IV: Junior Administrator Boot Camp


    # Users and Groups


    Selecting System Users and Groups from the desktop starts the Fedora User Manager
    tool. If you aren''t already logged in as the root user, you are asked to enter
    the root user''s password before it starts. The main User Manager window appears,
    as shown in Figure 17-1.


    ![](img/9e1543123a324def5e9e0f9e6fc0f80b_298_0.png)


    Figure 17-1: The User Manager tool.


    Whether you support a Linux system with hundreds of users, or just have a user
    account for you and one for your cat, you''ll need to know how to manage user
    accounts. This is done with the Fedora User Manager.


    The main window contains two tabbed panes — one for managing users, and the other
    for managing user groups, plus several helpful buttons in the toolbar.


    The menu bar provides access to the same features available on the toolbar, plus
    one additional feature not available on the toolbar. Selecting Edit:Preferences
    from the menu bar produces the Preferences dialog box, as shown in Figure 17-2.


    ![](img/9e1543123a324def5e9e0f9e6fc0f80b_298_1.png)


    Figure 17-2: The User Preferences dialog box.'
  merge: -1
  pgno: 298
- img_proc: true
  md: '# Chapter 17: Basic System Administration


    This dialog box contains settings that control the behavior of the User Manager
    tool itself:


    +   - Hide System Users and Groups: The Fedora system requires lots of additional
    usernames to control background system programs. Messing with these users and
    groups isnt recommended, so hiding them helps clean up the user viewing area,
    and helps prevent accidents from happening (like deleting an important system
    user account).

    - Automatically Assigned UID Be the Highest: Fedora assigns each user account
    a unique ID number (UID). The User Manager assigns more than happy to automatically
    assign UIDs to new users, or you can choose to manually assign your UIDs. This
    setting ensures that if the User Manager assigns UIDs, the numbers are in order
    after the accounts you already created. It''s safe to keep this value set unless
    you''re doing your own UID assigning.

    - Automatically Assigned GID Be the Highest: Fedora assigns each group a unique
    Group ID (GID). This setting ensures that any automatically assigned group numbers
    are in order at the end of the list. Again, it''s okay to keep this enabled.

    - Prefer Private Group GID the Same as UID: This feature ensures that each account''s
    UID is the same number as the assigned group ID. This helps simplify user management
    by ensuring that each user account belongs to its own group with the same number.


    After you set the User Manager tool preferences, you''re ready to start managing
    users and groups.


    # Adding new users


    When you first installed Fedora, it created a user account for you. That account
    has its own folder for storing files. If you are in an environment where others
    use the same system, it''s a good idea to create user accounts for each user.
    That way, you don''t have to worry about the cat accidentally deleting your important
    documents.


    If you need to add additional user accounts, here''s what you need to do:


    +   1. Click the Add User button.

    The first button in the toolbar allows you to add a new user to the Fedora system.
    Clicking that button produces the Create New User dialog box, as shown in Figure
    17-3.


    +   2. Type a username for the user in the User Name text box. Type the full name
    of the user for documentation purposes in the Full Name text box.'
  merge: -1
  pgno: 299
- img_proc: true
  md: '# Part IV: Junior Administrator Boot Camp


    ![](img/9e1543123a324def5e9e0f9e6fc0f80b_300_0.png)


    Figure 17-3: The New User dialog box in the User Manager tool.


    +   3. Type a password for the user in the Password text box, and then retype
    it in the Confirm Password text box.


    For security you should always use passwords that aren''t common words, containing
    a mixture of numbers and upper and lowercase letters, and a minimum of eight characters
    long.


    +   4. Select a login shell for the user.


    Fedora Linux supports several different login shells. The login shell allows you
    to work with text commands and scripts (see Chapter 6 for help with working with
    the login shell). The default login shell in Linux is the Bourne again, called
    `bash`. Using this is default.


    +   5. Create a home directory for the user.


    By default, the User Manager creates a directory for the new user to store personal
    files, located under the /home/ directory and named by the user account name.
    You can elect not to create a home directory, or to create the home directory
    in an alternative location. Unless you''re running a huge data center that relocates
    home folders to another disk, the suggested default location is just fine.


    +   6. Create a private group for the user.


    Each user must belong to a default group. Some Linux distributions create a single
    group that contains all users. By default, Fedora creates a private group for
    each user, ensuring that users can''t accidentally share files. It''s fine to
    allow Fedora to do that.'
  merge: -1
  pgno: 300
- img_proc: true
  md: '# Chapter 17: Basic System Administration 283


    +   7. Specify user ID manually.


    By default, the User Manager tool automatically assigns a UID for the new user
    account. If you prefer to use your own numbering system for UIDs, you can assign
    your own UID here.


    +   8. Click the OK button to create the new user.


    After the new user account is created, it appears in the user list under the User
    tab.


    # Modifying existing users


    A few user account settings are not assigned when you create a new account. You
    can get to to those from the User Properties dialog box:


    +   1. Double-click a user account listed in the User tab pane, select the user
    account and click the Properties button on the toolbar.


    The Properties dialog box appears, as shown in Figure 17-4.


    ![](img/9e1543123a324def5e9e0f9e6fc0f80b_301_0.png)


    | User Data | Account Info | Password Info | Groups |

    |---|---|---|--|

    | User Name: | test | | |

    | Full Name: | ima Test | | |

    | Password: | ***** | | |

    | Confirm Password: | ***** | | |

    | Home Directory: | /home/test | | |

    | Login Shell: | /bin/bash | | |


    +   2. Alter data on the User Data tab.


    The User Data tab contains the same fields as shown in the Create User dialog
    box. You can also alter the username, full name, home directory, or login shell
    here, as well as change the password for the user account.


    +   3. Click the Account Info tab to set an account expiration date or lock the
    account.'
  merge: -1
  pgno: 301
- img_proc: true
  md: '# 284 Part IV: Junior Administrator Boot Camp


    The expiration date doesn''t mean the user has expired, just the login account
    has. The account expiration date locks (but doesn delete) the account when the
    date is reached, and the user is unable to log in. If you suspect unauthorized
    activity from this user account, you can also manually lock the account, preventing
    the from logging in, but keeping the account still configured on the system.


    +   4. Click the Password Info to force password expiration rules.


    This section allows you to set whether users must change their passwords. There
    are fields for how many days the user has to change their passwords, how many
    days before the password expires the user is warned, and how many days after the
    password change the account is locked if the password is not changed.


    +   5. Click the Groups to assign the user account to additional groups.


    By default, when a user account is created Fedora creates a unique group for the
    user. Here''s where you can assign the user account to other groups as well. All
    the groups defined on the system appear within the tab. Select each group user
    account should belong to. You can also change the primary group user account belongs
    to (by default, it''s the same name as the user account).


    +   6. Click OK to accept any changes made to the user account.


    Any changes made to the user account effect immediately. However, if you''ve added
    a user to a new group, permissions often don''t work properly until the user has
    logged out and then back in again.


    # Deleting a user


    Although it''s quite an ordeal to add a new user account, removing user accounts
    is a snap. Select the user account you want to remove from the User list, and
    click the Delete button in the toolbar. A simple message asking you if you''re
    sure of your selection. After double-checking to make sure you''re deleting the
    correct account, just click Yes.


    That''s all there is to user management. In the next section, we tackle group
    management.


    # Adding new groups


    Groups help you manage access to files and folders on the system, Each file and
    folder contains three sets of permissions — one set for the owner, another set
    for the group file or folder is assigned to, and the last set for'
  merge: -1
  pgno: 302
- img_proc: true
  md: '# Chapter 17: Basic System Administration


    all other users on the system. By assigning a file or folder to a special group,
    you can allow all users who belong to that group to have full access to the file
    or folder.


    Here''s what you''ll need to do to create a group in User Manager:


    +   1. Click the Add Group icon in the toolbar.


    This starts the Create New Group dialog box, as shown in Figure 17-5.


    ![](img/9e1543123a324def5e9e0f9e6fc0f80b_303_0.png)


    +   2. Type the name of the new group in the Group Name text box.


    +   3. Select if you want to manually specify the Group ID.


    By default, User Manager automatically assigns a unique group ID number (GID)
    to the new group. If you prefer to use your own GIDs, select the check box, and
    then select an available ID from the drop-down list.


    +   4. Click OK to accept the settings and create the group.


    The new group is created, and appears in the group listing under the Groups tab
    on the User Manager window.


    # Modifying groups


    Now that you''ve created a new group, most likely you''ll want to add some users
    to the group. (What is a group with no members?) Do this by using the Properties
    dialog box:


    +   1. Double-click the group name from the Group tab listing, or select the group
    name from the listing and click the Properties toolbar icon.


    The Group Properties dialog box appears, as shown in Figure 17-6.


    +   2. Click the Group Data tab to rename the group.


    If you want to rename an existing group while keeping the same GID, enter the
    new name in the Group Name text box.'
  merge: -1
  pgno: 303
- img_proc: true
  md: '# 286 Part IV: Junior Administrator Boot Camp


    ![](img/9e1543123a324def5e9e0f9e6fc0f80b_304_0.png)


    +   3. Click the Group Tabs to add users to the group.


    The Group Users tab contains a drop-down list containing all the configured users
    on the system (even hidden system users). Select the check box for each user you
    want to add to the group.


    +   4. Click OK to apply the changes to the group.


    You should see any newly added user accounts appear on the User Management Groups
    tab under the group name.


    # # Printing


    Selecting System>Administration>Printing from the desktop menu starts the Fedora
    Printer Configuration tool. Even though technology gurus keep predicting a powerless
    society, for now, we''re still having to print some things out. In the past, printing
    was one of the dark areas in Linux. Trying to get modern printers working with
    Linux was quite the challenge. However, some advances have recently been made
    in Linux more printer friendly.


    Possibly the biggest advantage in this area has been the Common Unix System (CUPS).
    CUPS provides a common interface between UNIX (and Linux) systems and printers.
    It runs in background as a service, connecting to any defined printers, and waiting
    for applications to send print jobs. Because it runs in the background, it can
    both talk with remote printers, and accept print jobs from remote systems.


    The Printer Configuration tool provides an easy way to configure the CUPS server
    running on the system and any printers you''ve defined. The main Printer Configuration
    window is shown in Figure 17-7.'
  merge: -1
  pgno: 304
- img_proc: true
  md: '# Chapter 17: Basic System Administration


    # 287


    ![](img/9e1543123a324def5e9e0f9e6fc0f80b_305_0.png)


    # Figure 17-7: The Fedora Printer Configuration window.


    There are two sections to the Printer Configuration window:


    +   * Server Settings: Allows you to control how the CUPS server manages system
    printing features


    +   * Local Printers: Lists all the locally defined printers on the system, and
    allows you to change individual printer properties on each of them


    Each section produces a different set of properties to configure in the right-side
    window area. There are also six buttons in the toolbar:


    +   * New Printer: Starts a simple wizard to guide you through adding a new printer
    to the system.


    +   * New Class: Starts another simple wizard that guides you through grouping
    printers together to form a printer pool (a *print class* in CUPS). Sending jobs
    to a print class allows the job to be printed by any available printer in the
    class.


    +   * Copy: Copies an existing local printer definition to create another printer
    of the same name and model.


    +   * Delete: Deletes an existing printer.


    +   * Goto Server: Enables you to connect to a CUPS server running on a remote
    computer.


    +   * Refresh: Refreshes the printer display area, showing any newly discovered
    or added printers.


    The following sections describe how to use the Printer Configuration window to
    set the CUPS and printer properties for your system.'
  merge: -1
  pgno: 305
- img_proc: true
  md: '# Part IV: Junior Administrator Boot Camp


    # Printer server settings


    Clicking the Settings item on the Printer Configuration window produces the Basic
    Server Settings window — refer to Figure 17-7. There are a few different settings
    you can play with here to help out with your printer administration:


    +   - Show Printers Shared by Other Systems: Displays printers found by browsing
    the network.


    +   - Share Published Printers Connected to This System: Allows remote clients
    to connect to any of the local printers as shared (more on later).


    +   - Allow Remote Administration: Enables remote clients to connect to the CUPS
    server running on this.


    +   - Allow Users to Cancel Any Job (Not Just Their Own): By default, normal users
    can cancel their own printer job. Enabling this feature allows any user to cancel
    any other user''s printer job. Although this is a handy feature, it can get dangerous
    in a huge multiuser environment (especially if your users like playing tricks
    on one another).


    +   - Save Debugging Information for Troubleshooting: By default, the CUPS server
    generates a moderate amount of logging information to monitor usage or problems.
    If you are having trouble with a specific printer configuration, you can enable
    this feature to produce more (lots) information in the log files.


    After defining the settings appropriate for your CUPS server environment, you
    can move on to creating the individual local printers.


    # Add a new printer


    One amazing feature of Fedora is its ability to automatically detect printers
    connected via USB cables. If you have one of these printers, you most likely don''t
    need to add it to the system. You should already see it listed under the Local
    Printers listing. You can just move to the next section to configure it.


    If you are not fortunate enough to have a USB-connected printer, you will have
    to manually add your printer. Here are the steps for that:


    +   1. Click the New Printer button on the toolbar.


    The New Printer Wizard appears, as shown in Figure 17-8.


    Create a unique name for the printer. You may also assign a description and a
    location to the printer to help users know exactly which printer it is (this is
    usually only helpful in large organizations that have lots of printers). Click
    the Forward button to move to the next wizard window.'
  merge: -1
  pgno: 306
- img_proc: true
  md: '# Chapter 17: Basic System Administration


    ![](img/9e1543123a324def5e9e0f9e6fc0f80b_307_0.png)


    Figure 17-8:

    The New Printer Wizard in the Printer Configuration tool.


    # 2. Select the connection type of the new printer.


    Although the printer is defined as a local printer, this utility allows you to
    configure six different types of printer connections to make a printer available
    to the system. These printer connection types are listed in Table 17-1.


    | Table 17-1 Fedora Printer Connection Types |

    | Connection Type | Description |

    | LPT#1 | A printer connected via the 25-pin LPT port on the local computer |

    | Socket/HP JetDirect | A printer directly connected to the network, using a network
    card and Internet software |

    | Internet Printing Protocol (IPP) | A remote CUPS system advertising local printers
    that can be used remotely |

    | LPD/LPR Host or Printer | An older UNIX standard for sharing local printers
    |

    | Windows Printer via Samba | A Microsoft Windows workstation or server that advertises
    shared local printers |

    | Other | A specific Universal Resource Identifier (URI) used to map a network
    printer |'
  merge: -1
  pgno: 307
- img_proc: true
  md: '# Part IV: Junior Administrator Boot Camp


    As you select each connection type in the left side of the window, a different
    Properties area appears in the right side. For example, if you select Printer
    via Samba, text boxes appear where you can enter the printer name, and a user
    ID and password required to enter the network printer, as shown in Figure 17-9.


    ![](img/9e1543123a324def5e9e0f9e6fc0f80b_308_0.png)


    Figure 17-9: Using the New Printer Wizard to map to a Microsoft Windows shared
    printer.


    As you''ve selected the connection type and changed any Property settings, click
    Forward to continue with the wizard.


    # 3. Select the printer manufacturer, or the location of the PPD file.


    Fedora uses Postscript Printer Description (PPD) files to handle formatting for
    printers. These use the same concept as the standard printer drivers for Microsoft
    Windows you''re probably used. Each printer must have a PPD installed for CUPS
    to know how to format text and graphics sent to the printer.


    This wizard allows you to select the PPD file to use for the new printer. You
    have two choices:


    +   * Select the printer manufacturer from the list of installed drivers

    * Select to install your own PPD file for the printer


    If you are lucky enough to have the PPD file for your printer, copy it to a location
    on your Fedora system and select the PPD file option. Browse to the location of
    the file and select it, and then click Forward.


    If you don''t have the PPD file for your printer, you have to hope that Fedora
    has your specific printer make and model defined in its library. You find the
    printer manufacturer listed, select it and click Forward.'
  merge: -1
  pgno: 308
- img_proc: true
  md: '# Chapter 17: Basic System Administration


    4. If you selected a printer manufacturer, the next printer wizard provides a
    list of specific printer models and PPD files. Select the printer model and (optionally)
    the proper PPD file.


    This wizard window asks you to select the specific model type for your printer.
    Hopefully your printer model is listed. If not, you must go back a step and find
    your own PPD file to install.


    If your specific model is listed, select it, and a list of available PPD files
    is shown. Some models may have only one PPD file, but others may have two or more
    to choose from. In that case, one is usually marked as recommended. Try first:
    If it doesn''t work, select a different PPD file. Clicking the Forward button
    takes you to the final wizard window.


    +   5. Click on the summary window to create your new printer.


    The new printer is added to the list of local printers (even if you mapped it
    to a remote printer). You should now see the new printer when printing from applications
    on your system. Before getting too carried away with your printer, it''s a good
    idea to check how the printer is configured.


    # # Modifying printer properties


    You can modify the properties of any printer on the system (whether Fedora automatically
    created it or you manually created it). Select the printer you want to configure
    in the left window, and the printer properties appear in the right side, as shown
    in Figure 17-10.


    ![](img/9e1543123a324def5e9e0f9e6fc0f80b_309_0.png)


    Figure 17-10 Modifying printer properties in the Printer Configuration tool.'
  merge: -1
  pgno: 309
- img_proc: true
  md: '# Part IV: Junior Administrator Boot Camp


    There are five different tabs that contain printer information you can modify.
    Those tabs are Settings, Policies, Access Control, Printer Options, and Job Options.
    In the next few sections, we take a closer look at each.


    # Settings


    The Settings tab provides some basic settings you can change for the printer.
    From here, you can change the description and location tags for the printer, and
    the PPD file used for the printer.


    There are three check boxes that enable you to control the state of the printer:


    +   - **Enabled:** Allows you to take the printer offline if there''s a problem

    - **Accepting Jobs:** Allows you to temporarily suspend processing jobs

    - **Shared:** Allows you to set whether this printer is a shared resource on the
    network


    Besides the three check boxes are two other buttons:


    +   - **Make Default Printer:** Makes this printer appear first when printing
    from applications

    - **Print Test Page:** Provides an easy way to test if the printer and PPD file
    are working properly


    We cover the general settings for the printer. The other tabs dive into more advanced
    settings.


    # Policies


    The Policies contain four policies (or rules) that control printer behavior. Two
    of the policies control banner pages for print jobs, and the other two control
    how the printer operates.


    Banner pages allow you to print a special page describing the job. The Starting
    Banner — a special page printing out before the print job — allows you to print
    a cover sheet for the print job. Theoretically it''s supposed to provide some
    privacy, blocking people from seeing the first page on the printer, really, which
    wouldn''t just look under the banner page?


    The Ending Banner page allows you to print an ending page marking the end of the
    print job. If you''re in a high print-volume environment where lots of print jobs
    are pouring out of the printer, having a starting or ending banner helps keep
    everyone''s print jobs separate.'
  merge: -1
  pgno: 310
- img_proc: true
  md: '# Chapter 17: Basic System Administration 293


    There are two operation policies that you can set:


    +   - **Error Policy**: Determines how the printer reacts to an error in the printing
    process. The choices are Abort the Print Job (giving up all hope of printing the
    job), Stop the Print Job (possibly trying again after manual intervention), or
    Stop the Printer (preventing all other print jobs from printing). The default
    value is to stop the printer, on the theory that one job errors out, any others
    that follow are likely to be the same.

    - **Operation Policy**: Determines the mode the printer runs in. At this time,
    the only setting for this is default.


    # Access Control


    The Access Control tab provides a method for you to restrict access to the printer.
    There are two ways to do this.


    First, you can list every user account that the server will prevent from using
    the printer. This assumes that any user account not in the list can print, and
    any user account on the list can''t print.


    The second method is to list the user accounts that are allowed to use the printer.
    This assumes that any user account not in the list can print. Obviously, which
    one you choose depends on if you have more people you want to allow or to restrict
    from printing.


    # Printer Options


    The Printer options allows you to set some properties for the physical printer
    setup. The properties available for you to modify are based on information provided
    by the individual printer''s PPD file and depend on the physical characteristics
    of the printer.


    These properties are divided into separate categories, depending on the printer''s
    capabilities. The options available for my test printer are shown in Figure 17-11.


    The General settings handle properties such as what types of paper the printer
    can handle, the print qualities it can produce, and the number and types of input
    trays. You can force the printer server to request a specific paper size for all
    jobs, or even request which printer tray to take paper from.


    The Printout Mode settings set the default print quality used by the printer.
    Again, this setting depends on the capabilities of the particular printer, but
    usually there''s a range of Dots Per Inch (DPI) settings and color settings for
    you to choose from.'
  merge: -1
  pgno: 311
- img_proc: true
  md: '# Part IV: Junior Administrator Boot Camp


    ![](img/9e1543123a324def5e9e0f9e6fc0f80b_312_0.png)


    Figure 17-11: The Options tab of the Printer Configuration tool. Connected to
    localhost


    # Job Options


    Finally, the Job Options tab allows you to set the default properties for print
    jobs sent to the printer. When you request an application to send something to
    the printer, a standard GNOME Print Dialog box appears, as shown in Figure 17-12.


    ![](img/9e1543123a324def5e9e0f9e6fc0f80b_312_1.png)


    Figure 17-12: The standard GNOME Print and Properties dialog boxes.'
  merge: -1
  pgno: 312
- img_proc: true
  md: '# Chapter 17: Basic System Administration


    You can select several printing properties for the specific print job, such as
    whether to print in landscape mode, how many copies of the document to print,
    the paper size to use, and so on. If you prefer to use any of these settings by
    default, you can set that in the Job Options tab.


    Setting the Job Options is somewhat odd:


    +   1. On the Job Options tab, select the job option from the Specify Default
    Job options drop-list box at the top of the window.

    2. Click the Add button to add it to the list of available options to modify.

    3. Change the default values for the option.


    The completed list of options appears within the Printer Configuration window,
    as shown in Figure 17-13.


    ![](img/9e1543123a324def5e9e0f9e6fc0f80b_313_0.png)


    If you decide to revert the default setting for an option, click the Remove button.
    The option is removed from the options list.


    # System Monitor


    Selecting System starts the System Monitor tool. Although things usually go well
    on the Fedora system, sometimes-applications can go awry. When that happens, it''s
    handy to be able to watch what''s going on under the hood of the operating system.'
  merge: -1
  pgno: 313
- img_proc: true
  md: '# 296 Part IV: Junior Administrator Boot Camp


    The System Monitor tool provides information about how the system hardware and
    software are working. There are four window tabs in the System Monitor:


    +   - System: Shows the host name, hardware information, and system status (available
    hard disk space)

    - Processes: Shows information about programs currently running on the system

    - Resources: Shows information about CPU and memory usage

    - Filesystem: Shows information about what hard drives are mounted on the system


    Of course, just having a bunch of information thrown at you doesn''t help at all.
    You need to know what that information means for it to be meaningful. The following
    sections help you understand how to interpret the various pieces of information
    contained in the System Monitor.


    # Processes


    Click the Processes tab provides an overview of the programs currently running
    on the system, as shown in Figure 17-14.


    ![](img/9e1543123a324def5e9e0f9e6fc0f80b_314_0.png)


    > Figure 17-14: The Processes tab in the System Monitor tool.'
  merge: -1
  pgno: 314
- img_proc: true
  md: '# Chapter 17: Basic System Administration 297


    Processes — the Linux term for programs running on the system — are shown in a
    table format. The default view shows all the processes that are currently being
    run by your user account. Alternatively, you can watch all the processes, or just
    the ones that are actively working, by clicking the View item from the menu bar
    and selecting which option you want to view. Selecting the Dependencies check
    box reorders the process list to show which started other processes.


    You can sort the table rows based on any of the columns. For example, to see what
    processes are using the largest percent of CPU time, click the % CPU column header.
    The System Monitor automatically sorts the rows based on CPU usage.


    Other columns are available for you to add. Click Edit:Preferences to see the
    options available for the Processes tab. Table 17-2 lists the data available to
    display in the Processes tab.


    | Table 17-2 System Monitor Process Table Columns |

    | Column | Description |

    | Process Name | The program name of the running process. |

    | User | The owner of the process. |

    | Status | The status (either sleeping or running) of the process. |

    | Virtual Memory | The amount of virtual system memory allocated for the process.
    |

    | Resident Memory | The amount of physical memory allocated for the process. |

    | Writable Memory | The amount of memory allocated to the process currently loaded
    into physical memory (active). |

    | Shared Memory | The amount of memory shared between this process and other processes.
    |

    | X-Server Memory | The amount of memory the process shares with the X Windows
    (GUI) server. |

    | %CPU | The percentage of total CPU time the process is using. |

    | CPU Time | The actual CPU time the process is using. |


    (continued)'
  merge: -1
