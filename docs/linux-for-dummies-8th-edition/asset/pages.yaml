    # After You''re Connected


    After you''re connected, you''ll probably want to leap straight to Chapter 10
    for how to use the various Internet programs available to you. In the meantime,
    let offer you a number of sites you might find useful when you need help, or otherwise
    want to explore the Linux world further — some of these are pretty geeky, but
    you''ll grow into them! You may also want to update your machine (see Chapter
    16), add new software (also Chapter 16), and give extra thought to system security
    (see Chapter 18) to protect youryourself from nasty people and programs.


    Useful sites


