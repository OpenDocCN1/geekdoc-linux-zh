- img_proc: true
  md: '# 344 Part V: The Part of Tens


    # # Step 8: Open the Firewall Port


    Now that the Samba server is running, you need to make sure remote clients can
    connect to it. Because, by default, Fedora is a secure system, all unused network
    ports are blocked by the firewall.


    The final step is to open the Samba server port so remote client packets will
    be accepted by the firewall and passed through to Samba:


    +   1. Select System:Administration: Firewall & SELinux from the menu.


    This starts the Security Level Configuration window, as shown in Figure 20-5.


    ![](img/9e1543123a324def5e9e0f9e6fc0f80b_362_0.png)


    ![](img/9e1543123a324def5e9e0f9e6fc0f80b_362_1.png)


    Now there be the root user to have access to this tool, so if you''re not logged
    in, you must enter the root password. This tool has three tabs:


    +   * **Firewall Options:** For opening specific application ports

    * **Advanced Options:** For opening specific TCP ports

    * **SELinux:** For controlling how Linux locks specific applications


    +   2. In the Firewall Options area, select the Samba entry.


    The Firewall Options show a list of common services that are configured on the
    system. Selecting the Samba entry marks it as a trusted service and allows network
    clients to connect to it.'
  merge: -1
  pgno: 362
- img_proc: true
  md: "# Chapter 20: Ten Steps to Setting Up a Samba Print Server\n\n# # Step 9: Let\
    \ Guests Print\n\nBy default, Samba uses the standard Windows network logon accounts\
    \ to control network security. However, for a print server on a small network,\
    \ this can be overkill.\n\nFor small networks, you most likely want to let anyone\
    \ on the network print. In such a situation, it's kind of silly to create unique\
    \ user accounts for everyone. Instead, you should allow anyone to print on the\
    \ shared printer.\n\nUnfortunately, the Samba Configuration window doesn't provide\
    \ for setting this feature, so you'll have to dive into the Samba configuration\
    \ file and change it. Here's how to do that:\n\n+   1. Log in to the Fedora system\
    \ as the root user.\n\n+   The Samba configuration file is protected so only the\
    \ root user can edit it.\n\n+   2. Click Applications: Accessories: Text Editor.\n\
    \n+   3. Click the Open icon and browse to the Samba configuration file, /etc/samba/smb.conf.\n\
    \n+   4. In the configuration file, look for the [printers] section.\n\n+   The\
    \ [printers] section contains all the Samba settings for controlling printer sharing.\
    \ You should see the following entries:\n\n```\ncomment = All Printers\npath =\
    \ /usr/share/samba\nbrowseable = no\n# Set public = yes to allow user 'guest account'\
    \ to\n  print\n  guest ok = no\n  writeable = no\n  printable = yes\n```\n\n+\
    \   5. Remove the semicolon in front of guest ok and change the no to a yes.\n\
    \nThis enables guests to access and use the shared printers.\n\n+   6. Save the\
    \ configuration file in the same location and exit the text editor."
  merge: -1
  pgno: 363
- img_proc: true
  md: '# 346 Part V: The Part of Tens


    # Step 10: Map a Network Windows Printer


    The last step is to go to a Microsoft Windows workstation or server and map to
    the shared printer on your Linux system. If you have a Windows XP Home Edition
    workstation, you can do this by following these steps:


    +   1. Select Start:Control Panel.

    2. Select Printers and Other Hardware.

    3. Select Add a Printer.


    This starts the Add Printer Wizard. Click Next to continue to the next window.


    +   4. Select A Network Printer, or a Printer Attached to Another Computer radio
    button and click Next.

    5. Select the Browse for a Printer radio button.

    6. The Shared Printers text box shows a list of detected printer servers on the
    network. Double-click your Linux server name and select the shared printer you
    want to map.


    If you know the printer and server name, you can also manually enter it by using
    the format \servername\printername.


    The Linux printer uses the same name as the hostname of the Linux system. After
    selecting the desired shared printer, click Next. A couple of Windows warning
    boxes appear when you about the dangers of using network printers, but hey, this
    is your own network printer, so don''t worry about the warnings.


    +   7. Select the appropriate printer driver from the manufacturer and model lists.
    Click OK when finished.


    # Troubleshooting


    In an ideal world, things should be working just fine for you. You should be able
    to map any Windows workstation or server on your network to the new Linux printer
    server, and print to any locally connected printer on the server.


    However, things don''t always go as planned. There are plenty of opportunities
    for things to go wrong in the network world. Here are a few things to watch out
    for if things aren''t working with your printer server:'
  merge: -1
  pgno: 364
- img_proc: true
  md: '# Chapter 20: Ten Steps to Setting Up a Samba Print Server


    +   - **Test the local printer:** We can''t stress this step enough. We''ve run
    into plenty of situations where Administrators have spent countless hours trying
    to troubleshoot a network problem only to eventually find out the local system
    can''t even print.


    Make sure that you can send jobs from the Linux system to the local printer, and
    that the print job comes out OK. Often a mismatched PPD driver can cause odd behavior
    with printers.


    +   - **Remember to allow guest printing:** By default, Fedora configures Samba
    to block guest printing and doesn''t provide an easy way to enable it. If you
    don''t manually edit the smb.conf file to enable guest printing, no one is able
    to use the shared printer (which kind of defeats the purpose of sharing it).


    +   - **Check both global and local printer sharing:** The Fedora Printer Configuration
    window provides two locations that must be set for each printer. The global Server
    Settings section must be set to enable sharing published printers, and the Local
    Printer must be set for sharing. If either of these settings is not set, you won''t
    see the printer when browsing the network.


    +   - **Check network connectivity:** Finally, the bane of many network problems
    is, of course, the network. Check to make sure that you have proper network connectivity
    from your Linux system. Try pinging the IP address of the Linux system from a
    Windows workstation or server on the network.'
  merge: -1
  pgno: 365
- img_proc: true
