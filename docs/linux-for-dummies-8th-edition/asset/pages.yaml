    # Step 8: Create Samba User Accounts


    I mentioned in the preceding section that Samba doesn''t use the Linux user account
    password when authenticating remote clients. That''s because Samba uses its own
    accounts for that. Samba acts like a middleware between the remote Windows client
    and the Linux filesystem.


    When accessing files and folders on the system, Samba uses the defined Linux user
    accounts. When communicating with remote clients, Samba uses its own internal
    user accounts. Because of this, Samba must map the Windows user accounts to the
    appropriate local Linux user accounts. This is done in the Samba Server configuration
    window:


    +   1. Select System:Administration:Server Settings: Samba to start the Samba
    Server configuration window.


    As before, you need root permission to use this program, so if you''re not already
    logged in as the root user, Fedora will ask you for the root password.'
