  md: '# Redirecting command output


    I discuss redirecting command output here because it''s far by the most common
    form of information detouring. One example of output redirection involves telling
    a command to send its results to a file rather than to the screen, as you probably
    have been seeing. Start in some familiar territory by typing ls -la ~ and then
    pressing Enter, to produce something like the following:


    ```

    total 20

    dw------ 2 sue users 4096 Oct 30 07:48

    drxr-xr-x 5 sue root 4096 Oct 30 11:57 .

    -rw-r-- 1 sue users 24 Oct 30 06:50 .bash_logout

    -rw-r-- 1 sue users 230 Oct 30 06:50 .bash_profile

    -rw-r-- 1 sue users 124 Oct 30 06:50 .bashrc

    -rw-r-- 1 sue users 0 Jan 02 07:48 wishlist

    ```


    Want to save this information to a file instead? You can use the redirection operator
    to tell bash to send the data into a file rather than onto your screen. Enter
    the following command to send the information to a file named:


    ```

    ls -la > listing

    ```


    Notice that nothing displays on the screen, as you normally would expect. That''s
    because the shell rerouted the output to a file named listing. Verify that the
    directory listing is, enter the following command:


    ```

    cat listing

    ```


    The cat (and more) is explained Chapter 16.


    Note that if you type ls -la > listing again, the data is overwritten, meaning
    that the file''s contents are wiped out and replaced with the new output. You
    can avoid this by using >> as your redirection operator, which tells bash to append
    the command to the end of the file. If you type ls -la >> listing in the same
    directory after making no changes, the contents of listing are as follows:


    ```

    total 20

    dw------ 2 sue users 4096 Oct 30 07:48

    drxr-xr-x 5 sue root 4096 Oct 30 11:57 .

    -rw-r-- 1 sue users 24 Oct 30 06:50 .bash_logout

    -rw-r-- 1 sue users 230 Oct 30 06:50 .bash_profile

    -rw-r-- 1 sue users 124 Oct 30 06:50 .bashrc

    -rw-r-- 1 sue users 0 Jan 02 07:48 wishlist

    ```'
