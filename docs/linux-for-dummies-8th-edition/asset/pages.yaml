  md: '# Chapter 12


    # # Word Processing and More with OpenOffice.org


    +   **In This Chapter**

    * Installing the OpenOffice.org suite

    * Word-processing with OpenOffice.org Writer

    * “Spread학생” with OpenOffice.org Calc

    * Presenting with OpenOffice.org Impress

    * Drawing with OpenOffice.org Draw

    * Managing data with OpenOffice.org Base

    * Formulating with OpenOffice.org Math


    > *Words fly, writing remains.*\n— Spanish proverb, from Dictionary of Proverbs,
    by Delfin Carbonell Basset


    These days, just about everyone who has a computer has at least one office suite
    at their fingertips. If they''re Microsoft Windows users, this suite is probably
    Microsoft Office, although it may be another contender, such as Core WordPerfect.
    In Linux, typically the suite is OpenOffice.org. This suite comes with Base (database),
    Calc (a spreadsheet), Draw (diagrams and graphics), Impress (for presentations),
    Math (a word processor for mathematical formulas), and Writer (for word processing).


    After you figure out how to use one of the programs in this suite, you may be
    happy to find that the others are designed to look and work in very similar ways.
    You can even open and save files in Microsoft Office format, if you need to share
    them with people who are using it — and you can edit the Office files people send
    you, too.


    That''s enough about OpenOffice.org. In this chapter, you can actually use it!'
  merge: -1
  pgno: 209
- img_proc: true
  md: '# 192 Part III: Getting Things Done


    Other office suites available for Linux users are the commercial OpenOffice.

    relative StarOffice (www.sun.com/staroffice), Applixware Office

    www.vistascource.com/products), KOOffice (www.koffice.org), and

    GNOME Office (www.gnome.org/gnome-office/).


    # Opening the OpenOffice.org Suite


    Before you can take off your masterpieces, you must make sure that

    OpenOffice.org is available. When you installed Fedora, one of the installation

    options was to install the Office productivity software. If you selected this

    option, you installed most of the OpenOffice.org suite of programs.


    By default, Fedora includes these OpenOffice.org packages in the Office pro-ductivity
    installation:


    +   * Writer for word processing

    "* Calc for spreadsheets

    "* Impress for presentation graphics

    "* Draw for drawing graphics

    "* Math for creating complex mathematical formulas


    One additional OpenOffice.org package is available that is not installed by

    default: Base, which is used for creating personal databases.


    If you choose not to install the Office productivity software, or you need to

    install the Base database software, don''t sweat it, you can do that with now-

    out having to completely reinstall OpenOffice. Just use Chapter 16 to find how

    add the OpenOffice.org packages from the Applications: Office/Productivity

    section''s optional packages.


    After you''ve installed the OpenOffice.org packages, you''ll find most of them

    listed in the Applications: Office menu area (even the additional Base pack-age
    you install it). The two oddballs are the Draw and Math packages,

    unfortunately don''t get a rate to listing of them.


    To access either of these packages, you''ll need to start one of the other

    OpenOffice.org packages (such as Writer), and then select File:New. In the

    New menu area you''ll see the options for creating a new Drawing (which starts\Draw)
    or a new Formula (which starts Math).


    The Writer, Calc, and Impress packages even have their own quick-launch

    icons on the top panel. Just a single click of the icon launches the desired

    package.'
  merge: -1
  pgno: 210
- img_proc: true
  md: '# Word Processing with OpenOffice.Org Writer


    Word processors are almost required equipment these days. Kids use them to write
    letters to their grandparents. Grandparents use them to write letters to their
    grandkids. Whether you''re working on the great American novel or a school book
    report, OpenOffice.org Writer has all the best features you expect in these days
    in a word processor.


    # Taking a tour of OpenOffice.org Writer


    Before you proceed, take a look at the GUI layout in Figure 12-1.


    # Menu bar


    Along the top of the window is the menu bar, something you should be used to you
    typically work in Microsoft Windows. OpenOffice.org Writer has all the features
    you expect from a modern word processor. It has too many options to cover, so
    I give you instead (nonexhaustive) summary of what you find on each major menu:


    +   File: The usual Open, Save As, Print, and Print Preview (under the term Page
    Preview) commands, along with a set of wizards (under the term AutoPilot), plus
    the ability to send documents through e-mail, create templates, create Web pages,
    and to access your database information


    +   Edit: Use the Select All and Find commands, along with change tracking, document
    merging, and document comparing


    +   View: The usual Zoom functions and toolbars, with the abilities to show or
    hide formatting characters, and to see what the document would look like a Web
    page


    +   Insert: The usual page breaks and special characters, along with indexes,
    tables, bookmarks, headers, footers, and cross-references


    +   Format: The usual character, paragraph, and page settings, with styles, autoformating
    capabilities and columns


    +   Table: The usual table control options, including the ability to insert, delete,
    and select cells, convert between tables and more


    +   Tools: The usual spell-checking and thesaurus entries, in addition to hyphenation,
    autocorrection, an image gallery, and a bibliography database


    These menus have more features than what is listed here. Go through and take a
    look; you may find a new favorite feature in there somewhere.'
  merge: -1
  pgno: 211
