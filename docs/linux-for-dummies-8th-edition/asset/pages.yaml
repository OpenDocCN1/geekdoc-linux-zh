    files, and working with databases that were created to use with many of the major
    database servers — even over the network. Because approaches and my space is limited,
    I focused on two of the more common choices: creating new database files, and
    opening existing files, which include Microsoft Access files.


    The first interface you encounter when opening anything but a document you already
    worked from the File>Recent Documents menu option is the Database Wizard (Figure
    12-6).


