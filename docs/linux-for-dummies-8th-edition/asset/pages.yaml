  md: '# 196 Part III: Getting Things Done


    # Formatting toolbar


    The Formatting toolbar is directly below the standard toolbar in a default OpenOffice.org
    setup — though not all distributions. As usual, you can remove the Formatting
    bar at any time by using the View menu. This series of icons you use to click
    buttons and expand drop-down list boxes that represent word-processing functions,
    such as styles, fonts, sizes, and formatting instructions. Most features on this
    bar are identical to what you see in most modern word processors. The button for
    paragraph formatting is the only one that''s particularly unusual.


    ![](img/9e1543123a324def5e9e0f9e6fc0f80b_214_0.png)


    This toolbar actually changes depending on what you''re doing. If the cursor is
    within a table, for example, the object bar contains useful buttons for working
    with tables.


    # Ruler


    Directly below the Formatting toolbar in a default OpenOffice.org setup is the
    ruler. All modern word processors offer this, which marks out the margins and
    tabs, for example, of your document in the measuring system of you. To choose
    which system you want to use, right-click the ruler to open the Measurements pop-up
    dialog box.


    # Your document


    Oh, yeah — that big, blocked-off white space that takes up most of the window.
    That''s where you work on your documents! Just click there and start typing. You
    can also access a Formatting shortcut menu by right-clicking in the document section.


    # Working with Writer files


    OpenOffice.org Writer can work with lots of different file types. This allows
    you to create documents that can be used with many different types of word processing
    systems.


    Not only can you save new documents in various formats, but you can also read
    documents created on other word processing programs. Here''s a list of the different
    document types you can use with OpenOffice.org Writer:


    +   * OpenDocument (.ODT) format: A proposed open standard that may one day be
    supported by all word processing programs.


    +   * OpenOffice 1.0 (SXW) format: The original OpenOffice document format.


    +   * Microsoft Word 97/2000/XP (.DOC) format: Yes, you can read and write Word
    documents with Writer.'
  merge: -1
