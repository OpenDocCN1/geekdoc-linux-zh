    # # Laptop considerations


    The current distributions of Linux do very well on relatively new notebooks and
    laptops. (See www-linux.net for an excellent research site on how Linux gets along
    with various models.) If your laptop is a common brand, you shouldn''t encounter
    any problems installing Linux. However, laptops often contain WinModems. (Hardware
    labeled with the Win prefix is only for Windows, and can''t figure out what to
    do with Linux.)


    as network cards to make sure they''re not Win-branded. The built-in or default
    hardware for the laptop is Win-labeled (or you discover while researching the
    machine that it contains a Win product, if it isn''t properly labeled), you might
    be able to switch the offending hardware for a PC (PCMCIA). Most laptops contain
    at least one PC Card slot to give you a place to slip in a PC Card modem, network
    card, or combo modem-network card. As long as you use a common brand of PC Card,
    it should work with Linux.


    If you plan to purchase a laptop for Linux, check its modem and other hardware
    (such


    +   * Linux-oriented Web sites: In particular, the generic Linux hardware-list
    is at www.tldp.org/HOWTO/Hardware-HOWTO/.


    +   * Vendor Web sites: Many vendors support Linux, but don''t make it easy to
    find information about. In general, go to the vendor''s forum for the piece of
    hardware if they have them, the FAQ for the hardware, or follow the Support links
    to look for downloads for Linux. Don''t download what you find if there are downloads.
    The point is to look and see if they exist. The driver (the software that tells
    the operating system how to use the hardware) available for download actually
    be included in your Linux installation. Only download the driver from the vendor
    if this is the only way you get it.


    ![](img/9e1543123a324def5e9e0f9e6fc0f80b_53_0.png)


    If worst comes to you, you might not find any information on the hardware in question
    involving Linux. However, again, this doesn''t mean the hardware won''t work.
    Try anyway if you already have the item. You find that it works. Or, you might
    not be able to use the latest features, whereas the rests works just fine (for
    example, with a latest-generation video card, the newest features might not work,
    but you can still use it as a generic SVGA or)


    +   * The dreaded manuals: When possible, keep your computer manuals (especially
