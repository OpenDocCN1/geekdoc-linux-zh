  md: '# 388 Part VI: Appendixes


    If you don''t have a DVD-ROM drive, you have a few options. For one, you can go
    to the Fedora Project site (http://fedoraproject.org) and download the CD images
    for Fedora 7 and burn them yourself, as discussed in Chapter 3. This is a lot
    of downloading, so that may not be your choice. The second is that you could go
    to the same site and download the LiveCD image, which won''t give you a version
    you can install on your computer permanently, but is just one CD that you can
    boot directly into Linux without needing installation. Third, you could go to
    a site like CheapBytes (www.cheapbytes.com) and order Fedora 7 on CDs for around
    $10 — we can''t anticipate what they''ll charge, don''t hurt us if we''re not.


    If you download the CD images to burn, make sure that tell your CD burner you''re
    working with ISO images (usually the option has something to the word "image").
    If you burn the CD and find that it contains one big file (the ISO file), it will
    not work. The ISO image actually contains all the files that would be on the CD,
    if you put the CD in and find that it contains many files, the CD was created
    properly.


    # System Requirements


    Make sure that your computer meets the minimum system requirements. If your computer
    doesn''t match up to most of these requirements, you may have problems when using
    the contents of the DVD-ROMs:


    +   * A PC with an Intel-compatible Pentium-class processor: The minimum requirement
    for Graphical mode is a 400 MHz Pentium IV. Try to do better than for a heavy-use
    desktop system, though. For these computers, "is better."

    * At least 256MB of RAM: You need at least 192MB of RAM for Graphical mode. (Linux
    can handle as much RAM as you can fit into a typical PC, and is almost always
    better than less).

    * At least 1GB of hard drive space: I recommend 15GB if you want to install all
    the software from the DVD-ROM. You need less space if you don''t install every
    program, but you should go ahead and make more than 15GB of space available, to
    give yourself more options and room for file storage. Again, is better.

    * A DVD-ROM drive — faster-speed (2x) or faster: The faster the DVDROM drive,
    the faster your installation experience.

    * Just about any VGA monitor: Just about any monitor does the trick, but you want
    one that''s capable of displaying at least 256 colors or grayscale.'
  merge: -1
  pgno: 406
- img_proc: true
  md: '# Appendix B: About the DVD-ROM


    +   - A keyboard and a mouse: You need both items so that you have a way to communicate
    with your Linux system and tell it what to do!


    +   - Some kind of network connection: Again, the faster your Internet connection,
    the less time it takes to update your installation to the most recent versions.
    I use a cable modem for my Internet connection, and I like the increased speed
    when it comes to dealing with the many and varied sources of Linux software and
    updates online. See Chapter 9 on the various ways to connect to the Internet.


    If you need more information on PC basics, check out PCs For Dummies by Dan Gookin
    (published by Wiley Publishing, Inc.).


    # Using the DVD-ROM


    You can take either of two basic approaches to using the Fedora Core installation
    from your DVD-ROM. I cover each one in separate step-by-step lists. I tell you
    in this section how to pick which set of instructions to follow. The two ways
    to use this DVD-ROM are shown in this list:


    +   - If you can boot from your DVD-ROM drive (which probably means that you have
    a newer PC), follow the instructions in the following section.


    +   - If you can''t boot from your DVD-ROM drive, for whatever reason, you may
    buy CD-ROMs or download and burn CD-ROMs yourself. (We cover burning installation
    CDs in detail in Chapter 3.)


    # Booting from the DVD-ROM


    To install items from the DVD-ROM to your hard drive, follow these steps:


    +   1. Insert the DVD-ROM into your computer''s DVD-ROM drive.


    +   2. Reboot your PC.


    As long as your PC is configured to boot from the DVD-ROM, this step starts the
    Linux installation process for you automatically.


    +   3. To install Fedora, press Enter.


    Congratulations! The Linux installation process is now underway. For the rest
    of the gory details on this fascinating task, please consult Chapter 3. If you
    had to order the CD-ROMs from a supplier such as www.cheapbytes.com, boot with
    the first CD for the same effect as booting with the DVD.'
