  md: '# # Chapter 13


    # # Messing with Audio


    In This Chapter


    +   - Listening to music

    - Using, recording to, and ripping from CDs

    - Fixing sound problems


    > The price of freedom is responsibility, but it''s a bargain, because freedom
    is priceless.


    > — Hugh Downs


    If you''re like me, everything''s better with music. If a computer can''t take
    the place of a stereo where I am, then I''m just not interested. So, I can assure
    you that there are many ways to listen to music within Linux. Read on find the
    various methods available! The only tricky bit used to be listening to MP3s, because
    they''re a patented format, but RealPlayer is available for Linux and a license
    to play MP3s, so you''re all set. See Chapter 16 for how to install RealPlayer.


    ![](img/9e1543123a324def5e9e0f9e6fc0f80b_243_0.png)


    Are you iTunes fans? If so, check out Chapter 15 for how you can install iTunes
    in Linux!


    # # What Sound? I Don''t Hear a Thing!


    First, check and make sure that your speakers or headphones are hooked up correctly.
    You wouldn''t be the first person to be unaware that the cat pulled the connectors
    out of their sockets.'
  merge: -1
  pgno: 243
- img_proc: true
  md: '# 226 Part III: Getting Done


    Now, it''s possible that your audio settings got turned down to zero, or muted.
    Right-click the volume icon in the upper left of your desktop, and select Open
    Volume Control (Figure 13-1).


    ![](img/9e1543123a324def5e9e0f9e6fc0f80b_244_0.png)


    When this control is open, it helps to understand the terms you''re about to see:


    +   - Master: The main volume control corresponds to the volume slider on your
    desktop.

    - PCM: Controls the volume for audio files stored on your computer.

    - Line-in: Controls the volume for sound coming in through your card''s line-socket.

    - CD: Controls the volume for sound coming in through your CD and/or DVD player.

    - Microphone: Controls the volume for sound coming through your sound card''s
    microphone connector.


    Now that you know what you''re looking at in this dialog box, look for one of
    these major clues as to what might be wrong:


    +   - Are any of the items you see muted? You can tell by looking for red X''s
    on top of the volume icon underneath each section. In Figure 13-1, for example,
    Line-in and Microphone are both muted. Is the one muted responsible for your problem?
    For example, if you had headphones hooked up to your Line-in jack and Line-in
    was muted, you would put on your headphones and hear nothing. To unmute, click
    the X to get rid of it.'
  merge: -1
  pgno: 244
- img_proc: true
  md: '# Chapter 13: Messing with Audio


    Are any of the volume sliders all the way down? Again, Line-in and Microphone
    in Figure 13-1 are both slid down all the way. Using the same headphone example,
    even if the Line-in wasn''t muted, you would hear nothing unless the sliders are
    down. Slide them up and if you can hear anything.


    If the problem isn''t one of these, then it may be something more fundamental.
    To investigate:


    +   1. Choose System:Administration:Soundcard Detection (Figure 13-2) to see whether
    the card is correctly detected and plays sounds.


    You may be asked to enter your root (administrative) password before the tool
    will open.


    ![](img/9e1543123a324def5e9e0f9e6fc0f80b_245_0.png)


    Figure 13-2: The Fedora Audio Configuration.


    +   2. If you know what kind of sound card you have, look under Selected Card.


    Is the information correct? If not, click the Settings tab and click the drop-down
    list box next to Default Audio Card. If the proper choice is available, select
    it.


    +   3. Click the play button under Sound Test.


    You should hear a sound on the left, the right, and in the middle. If not, click
    the Repeat check box, click Play again, and then adjust the Volume Settings bar
    beneath to see if you can make the sound loud enough to hear.'
