  md: '# 64 Part I: Getting Your Feet Wet


    If you accidentally cut the power to your Linux box, take heart; all is not lost.
    More often than not, you can reboot your computer and pick up where you left off.
    However, you may have to pay for your error by waiting during a quick file-system
    check while the machine makes sure that nothing was damaged. This process is similar
    to the one Windows uses when somebody powers off incorrectly. The operating system
    may need to scan its hard drives to make sure is okay.


    ![](img/9e1543123a324def5e9e0f9e6fc0f80b_82_0.png)


    If you''re plagued by brief power outages or spikes that cause your computer to
    reboot, look into getting a UPS (Uninterruptible Power Supply) for your computer.
    These heavy, rechargeable batteries are not only to protect your computer from
    damage (read the box to see what features a particular UPS offers) but also to
    provide an extra five minutes or more of power so you have a chance to copy your
    files properly and shut down your machine when the power goes out. Better yet,
    for those really spikes, the only inconvenience you''ll have to deal with if you
    have a UPS in lasting is to complain with. The spike won''t affect your computer
    at all!


    # Removing Linux from Your System


    Although I''d hate to see you exit the Linux universe, I''d also hate to see you
    get trapped in Linux if you don''t want to use it! How to most easily rid of Linux
    depends on what you want to do:


    +   If you want to replace Linux with Windows, just install Windows on the machine.
    It will overwrite all of Linux, including the boot menu.

    If you want to remove Linux from a dual-boot setup, boot into Windows, access
    a command prompt, and type `fdisk/mbr`. This action removes the Linux boot loader.
    It doesn''t erase Linux, but you can then format the Linux drive(s) or partition(s)
    for Windows.


    ![](img/9e1543123a324def5e9e0f9e6fc0f80b_82_1.png)


    Windows XP and Xandros users have a special command they can use to remove this
    distribution. Boot your machine by placing your Windows CD-ROM into the Recovery
    Console. Change to the Windows directory, type `fixmbr` at the command prompt,
    and (oh yeah) press Enter.'
