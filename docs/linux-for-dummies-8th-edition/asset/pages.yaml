  md: '# 94 Part II: Getting Up to Speed with Linux


    Note the single quotes. Immediately after pressing the Enter key, you will see
    that your prompt has changed into something more inviting. Don''t worry if you
    would rather have the original prompt: You can either reassign the original prompt
    value stored in PSI or close the terminal window and open a new one, and you''re
    back to familiar territory.


    Are you wondering which other variables your system has for you? You can view
    all environment variables at one by typing env. Note that you may not have any
    reason to assign variables on the command line as a usual case of Linux. However,
    after you get more proficient, you may want to journey into the shell programming
    capabilities of bash, in which case variable storage is quite handy.


    What''s with those single quotes? You have to be careful of details when changing
    environment variables. If you''re just assigning something to a number, you could
    use, for example, HISTSIZE=250. However, if you want to use something with spaces
    in it, you need to use quotes. Which kind of quotes you use depends on what you
    want to.


    If you want to display exactly what you have specified, use single quotes to create
    a literal text string. For example, type the following line at a command prompt:


    ```

    echo ''Hello'', my name is $USER

    ```


    Kinda goofy, huh? Take a look at a different kind of string that the shell interprets
    differently: an interpolated string. An interpolated value is one in which the
    shell interprets special characters before processing the value. Rather than use
    single quotes, this time you use the same example with double quotes:


    ```

    echo "Hello, my name is $USER"

    ```


    Notice that the output is this time. Instead of displaying the text you wrote,
    the shell replaces the variable name, designated with a dollar sign, with the
    actual value stored in variable.


    Why did I use single quotes in the PSI example but double quotes with echo? The
    items with the backslashes (()) are interpreted one way or another. However, if
    you use double quotes with PSI, they''re interpreted only once, so that item that
    lists which directory you''re in changes only the first time. With a single quote,
    the variables are interpreted every time you do something. The double-quote example
    shows something like Hello, my name is bob. However, the single quote comes up
    with Hello, my name is $USER.


    ![](img/9e1543123a324def5e9e0f9e6fc0f80b_112_0.png)'
