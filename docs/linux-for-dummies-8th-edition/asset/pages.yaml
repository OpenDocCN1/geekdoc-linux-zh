  md: '# Chapter 22: Ten Troubleshooting Tips


    You can press Ctrl+Alt+F# (F# refers to function keys F2 through F6) to change
    out of the GUI to a command line terminal at any time and then Alt+F7 or Alt+F8
    to switch back.


    # Tip #7: Changing Your Boot Environment Permanently


    The word permanently is in quotes in the heading because you can, course go back
    and change this setting later, if you want. Permanently just refers to the fact
    that you have made this change, every time you boot the system, it automatically
    goes into the preferred environment until you change.


    You can''t make this change in Linsphere, Ubuntu, or Xandrus unless you want to
    boot into single-user mode, which is basically "safe mode" and not much of use.
    Well, okay, you can make the change, but you would need a techie friend to set
    up a bunch of stuff for you. Linsphere and Xandrus don''t want to do this. You
    can''t do this in Knopix except, but then it''s a LiveCD you''re being denied
    anything to perform.


    To make this change in Fedora, Mandriva, or SuSE, you need to edit what''s called
    a run level. Fortunately, all three of these distributions use the same run level
    settings, so the instructions are the same for all of them:


    +   1. In the GUI, open a command line terminal.


    If you''re not sure how to do, see Chapter 6. If you''re not in the GUI and you''re
    already logged in, type su to become the root user.


    +   2. Type cp/etc/inittab.old to make a backup.


    Now, if something happens while you''re editing the inittab file, you can always
    refresh with the old version.


    Some Linux text editors are covered in Chapter 11.


    +   4. Scroll down until you find a line similar to the following:


    ```

    id:5:initdefault:

    ```


    This line appears near the top of the file. What you''re interested in here is
    the number. In most mainstream Linux distributions, the number 5 tells Linux to
    boot into the GUI, and the number 3 tells Linux to boot'
