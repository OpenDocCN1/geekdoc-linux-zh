  md: '# 100 Part II: Getting Up to Speed with Linux


    # # Pieces of the Puzzle


    It helps to understand the lingo before getting started. A lot of this will be
    familiar to you from other operating systems such as Microsoft Windows, but there
    are some differences that you''ll need to get used to as. To start, the word "system"
    is actually used in more than one way. The general use (and what I am typically
    referring throughout the book when I use this term) means "the files and directories
    (or folders) you have access to now.


    The first major difference to be aware of is that Linux uses a forward slash (/)
    between directories, not the backslash (\ that Windows does. So, the file yum.com
    in the directory is etc/yum.com. Files and directories can have names up to 256
    characters long, and these names can contain underscores (_), dashes (-) and dots
    (.) within, even more than one. So my.bigfile or my-bigfile are all valid filenames.


    Upper and lowercase also matter quite a bit. They have to match exactly. The file
    yum.com and Yum.com are not the same as Linux is concerned. Finally, the same
    filesystem can span over multiple partitions, hard drives, and media such as CD-ROM
    drives. You just keep going through subdirectories, not having to care if something
    is on disk A, B, or whatever. This will be addressed in the section "Partitions
    versus Directories" later in this chapter.


    # # Touring the Linux Filesystem


    In this section, I take a look at the contents of the typical filesystem. Being
    at least a bit familiar with it helps you track things down later, and help you
    to know where it''s safe to mess with things and where you need to be very careful.


    # # The root of the tree


    Everything in the Linux filesystem is relative to the root directory — not to
    be confused with the system Administrator, who is the root user — which is referred
    to as /. This is the filesystem base — a doorway into all your files. The root
    directory contains a most predictable set of subdirectories. Each distribution
    varies slightly, but certain standards exist to which they all conform. The standards
    keep the Linux world somewhat sane.


    ![](img/9e1543123a324def5e9e0f9e6fc0f80b_118_0.png)


    If you''re interested in these standards, go to www.pathname.com/fhs and look
    at the latest version of the rules.'
  merge: -1
