  md: '# Chapter 19: Ten Steps to Making Your Own Wireless Access Point 325


    +   * **Mode**: Determines if the wireless card is managed by an access point,
    or is the master of other wireless cards. Use the drop-down list box to set the
    card to Master.

    * **Network Name (SSID)**: Wireless access points are identified by a Service
    Set Identifier (SSID). Enter a unique SSID for your network in this field. This
    can be any combination of letters, numbers, and symbols, up to 32 characters.

    * **Channel**: You must select a specific wireless channel to use. There are 14
    channels to choose from. Most wireless clients scan all channels looking for your
    SSID, whereas others must be configured for the correct channel.

    * **Transmit rate**: Some wireless network cards allow you to specify the transmit
    rate, whereas others autodetect the rate used by the access point.

    * **Key**: Encrypting wireless access points is a necessity in today''s networking
    environment. This field allows you to encrypt the key used by your access point.
    However, to get started, leave this field blank for now.


    For the time being, create the wireless access point without an encryption key.
    After you know the wireless access point is working, you can play around with
    adding an encryption key. Starting off with one can often make troubleshooting
    more difficult than it needs to be.


    +   4. Click the General tab to remove the IP address for the wireless card.


    Set a static IP address of 0.0.0.0 for the wireless network card. Because you''re
