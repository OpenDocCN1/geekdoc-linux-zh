  md: '# # Chapter 4


    # # Booting and Stopping Fedora


    **In This Chapter**


    +   - Understanding what happens when you turn on your Linux machine

    - Identifying and isolating boot problems safely

    - Taking Linux off of your machine


    > > I like work; it fascinates me. I can sit back and look at it for hours.

    — Jerome K. Jerome


    I came here from Chapter 3, you likely just survived the first gauntlet of the
    Linux world: installing the operating system. Hope that booting for the first
    time worked well. If it did, and you decide that most of this chapter isn''t for
    you, least skip to the section near the end of this chapter, "Don''t Just Turn
    Off the Machine!" Otherwise, if you''re interested in finding out what your machine
    does as it boots (this chapter can get tricky), read on.


    Your Linux installation failing to boot properly is not necessarily an emergency.
    Much of this chapter is designed to help you with any problems you might run into.
    Before you curate Linux, remember that installing an operating system is no small
    task — because many technical variables are associated with such an installation,
    many computer manufacturers insist on performing the task for you (When''s the
    last time you installed Windows yourself?) Companies like Hewlett-Packard, Dell,
    and Wal-Mart (Believe it or not) have been offering Linux preinstalled, or if
    you''re too intimidated at this point, or are reading ahead and are too nervous
    to give it a shot, you can either use the Linux LiveCD discussed in Chapter 2
    or purchase a preinstalled machine from a vendor or a local computer builder.


    To unravel the mystery of a Linux system that won''t boot requires a bit of understanding
    of how your computer starts up. At the very least, being able to tell a repair
    person where the problem seems to be can make you feel a little intimidated —
    and can even save you some money because it speeds up your troubleshooting.'
