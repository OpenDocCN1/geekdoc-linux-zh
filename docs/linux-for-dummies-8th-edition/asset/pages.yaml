  md: '# 310 Part IV: Junior Administrator Boot Camp


    ![](img/9e1543123a324def5e9e0f9e6fc0f80b_328_0.png)


    You can enter Linux commands just as you were on the Fedora console! SSH ensures
    that all of your session data is safely encrypted before it''s sent out over the
    network. When you''re finished, type exit at the command line and your session
    closes.


    # Connecting to your Linux box from another Linux box with SSH


    Yes, you can connect from another Linux box, too. This task is a bit less complicated.
    Open a terminal window (see Chapter 6) and follow these steps:


    +   1. Type ssh username@address or ssh username@machine fullname to open the
    connection.


    For example, type ssh dee@192.168.1.6 or ssh dee@computer.com. After you do this
    step, copy the following text:


    > The authenticity of host ''192.168.1.6 (192.168.1.6)'' can''t be established.

    RSA key fingerprint is ed:68:0f:e3:78:56:c9:b3:d6:6e:25:77:52:a7:66:

    Are you sure to continue connecting (yes/no)?


    +   2. Type yes and press Enter.


    You now see lines:

    Warning: Permanently added ''192.168.1.6'' (RSA) to the list of known hosts.

    dee@192.168.1.6''s password:


    +   3. Enter your login password and press Enter. Now you''re in!


    Close the connection by logging out of the account (type logout).'
  merge: -1
