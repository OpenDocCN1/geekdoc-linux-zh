    # # Talkin'' on the Phone


    The new craze is chatting on the phone over the Internet. Whether you''re just
    wanting to experiment or are a complete devotee, Linux offers the software you
    need to take part. Think of the Internet phone works like Instant Messenger networks.
    One of the most popular networks for supporting phones is Skype (skype.com), which
    uses SIP (Session Initiation Protocol), a popular default that you can use a wider
    variety of programs with. You first need the proper hardware, whether it''s a
    phone you can actually plug into your computer (a SIP phone, for example) or just
    a combination of a headset and a microphone — preferably not the lowest-end model
    so you''ll get the best sound quality. When you have the time, it''s time to get
    the software.


    In Fedora, the default client is Ekika (www.ekika.org). It is available through
    Applications::IP Telephony. Two other SIP clients are also included in the repositories,
    as discussed in Chapter 16. They are Kphone (http://sourceforge.net/projects/kphone)
    and Linphone (linphone.org). The popular Skype package isn''t included, but you
    can download a Linux client from www.skype.com.


    In the upcoming sections, I show you how to configure and use both the default
    Ekika package and the popular Skype package.'
