    > > I have an existential map. It has "You are here" written all over it.

    >

    — Steven Wright


    One of the most frustrating things about mastering a new operating system is figuring
    out where it keeps files. Instead of keeping all important files in a single directory,
    such as the C:\Windows directory in Microsoft Windows, Linux follows the lead
    of its UNIX cousins and spreads out a bit more. Although the Linux and Windows
    setups differ methods, they are both logical, although it may not feel that until
    you understand where to look.


    After taking you on a tour of where to find things, this chapter shows you how
    to work in your filesystem on the command line. Reading this section isn''t mandatory
    if typing in commands gives you heart palpitations, but it can be handy if you
    need to fix something later, and some people just like to know how to do these
    things.'
