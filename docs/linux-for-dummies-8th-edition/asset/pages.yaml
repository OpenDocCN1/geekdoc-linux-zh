  md: '# Chapter 2: Prepping Your Computer for Linux


    The off-chance that you actually don''t have Windows installed yet still want
    that dual-boot capability, you should install Windows before you install Linux.
    Otherwise, during installation, Windows overwrites the partition of your hard
    drive Linux uses to store its boot menu (This factor can create a mess later when
    you want to boot back into Linux!) Those who need skip down to the section "Working
    with Disk Partitions" to find how to set up your Windows installation so it causes
    the less fuss when you add to Linux installed, return here.


    The majority of you, however, want to dual-boot because you''ve got one machine
    and it''s already running a Windows installation that you really don''t want to
    erase. If you intend to put Linux on a brand-new hard drive that has nothing on
    it already (or that you are 100 percent confident that you can erase), skip down
    to the section "Working with Disk Partitions." However, if you need Linux and
    Windows to share the same hard drive and you already have Windows installed, you
    have some extra work to do in order to make everything goes smoothly. The rest
    of this chapter focuses on getting this process.


    # Partitioning from scratch for a dual boot


    Again, if you plan to take a fresh hard drive (or erase the existing one) and
    install both Windows and Linux on it, be sure to install Windows first. While
    you''re going through the Windows installation, you are asked to partition your
    drives, which refers to using software to break them into smaller virtual drives.
    There are three types of partitions: primary, extended, and logical. A hard drive
    can have three primary partitions and one extended partition. Inside extended
    partition, you can have up to 12 logical partitions — think of an extended partition
    as a cardboard box that contains logical partitions. Logical partitions hold data;
    extended partitions just hold logical partitions. Because I can''t predict what
    software you want to install, I recommend having at least 10GB of space available
    for your installation. More is always better because it gives you more room for
    downloads and even more programs, and at the very least, you can install everything
    from this book''s companion DVD-ROM into it..


    Make a note of the partition you dedicate to Windows and the one you dedicate
    to Linux. In the note, jot down which hard drive each partition is (the first,
    second, third, and so on) and the partition number each is on the disk (again,
    first, second, and so on). You''ll need this information when installing Linux.


    Those who aren''t starting from scratch for a dual boot likely need to make changes
    to their current installation. Proceed to the next section to find out.'
