  md: '# Chapter 14: Messing with Video and Graphics


    The key to special effects is being able to string together a series of special
    effects to create an overall effect. GIMP allows you to string special effects
    together by using a scripting language. Fedora includes both the Python-Fu and
    Script-Fu GIMP scripting languages.


    The Python-Fu and Script-Fu scripts are accessible from the image editor menu
    bar. Each script has its own set of parameters that you can set to alter the effect
    of the script. Because scripts apply several layers of special effects to an image,
    they often take a while to complete.


    The premise scripts included with GIMP produce some pretty amazing effects. Figure
    14-10 demonstrates the Weave Script-Fu effect on the saved desktop image.


    ![](img/9e1543123a324def5e9e0f9e6fc0f80b_271_0.png)


    That''s pretty professional looking for a simple open source program! Take the
    time to play around with the different script effects available in GIMP. You''ll
    be surprised by the quality of the special effects. As it says in the GIMP manual,
    most of the effects can be reversed by using the Edit:Undo menu item, feel free
    to play.


    # Playing 3-D Games


    One of the strengths of Windows PCs has been support for advanced video games.
    These games utilize high-end graphics that often require specialized 3-D video
    cards to operate.'
