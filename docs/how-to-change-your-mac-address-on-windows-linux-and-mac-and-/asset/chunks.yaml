    ## About the Author


    Mohandes is a Electronic engineer and freelance writer, LOVE watercolor technique.
    He enjoys traveling, bodybuilding and spending time in the great outdoors. He
    is the author of `Sun Gazing: The magical key to magical abilities` (2014) He
    currently learning to play guitar and reading Qur''an. He believes in the power
    of the word, creatively and lovingly rendered, to create positive change in the
    world. He have a Bachelor''s in Electronic from H.T.I College and spent two years
    as an English instructor and 3 year as Department head at overseas gas.

