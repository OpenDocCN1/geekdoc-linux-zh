  md: '# Downloading a Web Page


    In Linux, you can download a file or a Web page from a given URL using the wget
    command. The following syntaxes show the use of the wget command:


    ```

    $ wget URL

    ```


    and


    ```

    $ wget URL1 URL2 URL3 ..

    ```


    Generally, the downloaded files have the same filename as the URL, however, you
    can also specify file names by using the -O option.


    Sometimes the downloading process breaks down due to unstable connections. In
    that case, we can use the -t option that specifies the number of times the system
    automatically tries to download a file. The use of the -t option along with the
    wget command is as follows:


    ```

    $ wget -t 5 URL

    ```


    If you specify zero times, the system will keep trying to download the file infinitely:


    ```

    $ wget -t 0 URL

    ```


    Moreover, if the downloading of a file gets interrupted before it is complete,
    we can resume the download from where we left off by using the -c option, as follows:


    ```

    $ wget -c URL

    ```


    # Converting Web Content to a Text File


    Generally, Web pages are HTML pages that contain a collection of HTML tags, along
    with other scripting elements. These Web pages are viewed with the help of Web
    browsers. In Linux, lynx is a used text browser for viewing Web content. This
    browser can parse only text files, so HTML based web pages need to be converted
    to text files. This task is performed using the lynx command.


    The syntax of the lynx command is as follows:


    ```

    $ lynx -dump URL > webpage_as_text.txt

    ```


    This command lists all the hyperlinks separately under a heading reference. An
    example of using the lynx command is as follows:


    ```

    $ lynx -dump http://google.com > samplefile.txt

    ```


    To see the plaintext version of text, you need to use the cat command, as follows:


    ```

    $ cat samplefile.txt

    ```


    Let''s learn how to parse data from a website.'
  merge: -1
