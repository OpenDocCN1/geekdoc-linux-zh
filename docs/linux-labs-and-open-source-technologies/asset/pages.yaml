    You can check the network connectivity by using ping command:

    [root@netmon tmp]# ping netx

    PING zero (172.16.1.100) 56(84) bytes of data.


    64 bytes from netx (172.16.1.100): icmp_seq=0 ttl=64 time=0.185 ms

    64 bytes from netx (172.16.1.100): icmp_seq=1 ttl=64 time=0.064 ms


    Usually, the first entry in /etc/hosts defines the IP address of the server''s
    virtual loopback interface. This is usually mapped to the name localhost.localdomain
    (the universal name used when a server refers to itself) and localhost (the shortest
    alias name). By default, Fedora inserts the hostname of the server between 127.0.0.1
    and the localhost entries between this like this:


    ```

    127.0.0.1 netmon localhost.localdomain localhost

    ```


    When the server is connected to the internet, this first entry after 127.0.0.1
    needs to be the fully qualified domain name (FQDN) of the server—for example,
    netmon.mysite.com:


    ```

    127.0.0.1 netmon.spit.ac.in localhost.localdomain localhost

    ```


    Some programs, as Sendmail, are very sensitive to this and if they detect what
    they feel is an incorrect FQDN they will default to using the name localhost.localdomain
    when communicating with another server on the network.


    # Lab 3


    Objective: Setting up multiple IP Addresses on a single LAN.

    Solution: You can create the virtual interface by using the ifconfig command:


    ```

    [root@netmon tmp]# ifconfig eth0:0 172.16.1.200 netmask 255.255.255.0 up

    ```


    Edit the /etc/sysconfig/network-scripts/eth0:0 file, so that the aliases will
    be managed automatically by using the if and ifdown commands.

    Here is a sample configuration to manage the IP address:


    ```

    DEVICE=eth0:0

    ONBOOT=static

    ADDR=172.16.1.200

    NETMASK=255.255.255.0

    ```


    The commands to activate and deactivate the aliases interface would therefore
    be:

    To test IP addresses, to try to ping from another machine on same network on both
    addresses.


    ```

    [root@netmon tmp]# ping -c 4 172.16.1.100

    [root@netmon tmp]# ping -c 4 172.16.1.200

    ```'
