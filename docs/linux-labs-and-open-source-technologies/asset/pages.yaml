    # Short Descriptive Questions


    Answer the following descriptive questions:


    # Q1. What is Android?


    Ans. Android is an operating system of Google Inc. It is primarily designed for
    touchscreen phones and based on the Linux family of operating systems. It is written
    in C, C++, and Java programming languages. Java lies on the top of its all layers
    and their applications are primarily written in Java. To develop an application,
    Android Development Kit (Android SDK) is available with all essential tools. The
    Android SDK includes a compiler, debugger, a device emulator, and its own virtual
    machine to run Android programs. The emulator is a virtual device that is used
    to test or run the application without the need for any hardware.


    # Q2. Explain the role of the Linux kernel in the Android architecture.


    Ans. The Linux kernel is the chief component in the Android architecture. The
    interaction of the hardware with the software is provided by means of the Linux
    kernel. The kernel not only contains hardware drivers, but also serves as an abstraction
    layer for other layers. Since the core of the Android system lies in the Linux
    kernel, all the main functionalities of the system are based on the kernel. The
    foundation of Android is Linux, which is a powerful system; it provides versatility
    to the Android OS, and makes it possible for the OS to work on multiple devices
    without any (few) glitches.


    # Q3. Enlist some native Android libraries used in Android architecture.


    Ans. The following is a brief description of some of the native Android libraries:


    +   1. WebKit: Refers to the browser engine used to render and display HyperText
    Markup Language (HTML) content.


    +   2. Media Framework: Refers to a library that handles the entire multimedia
    feature by deploying media codecs.


    +   3. Surface Manager: Refers to the manager that is used for composing the window
    manager with off-screen buffering. Off-screen buffering is a technique of drawing
    images in the buffer and copying them on the original screen. The off-screen buffer
    is also responsible for the transparency of windows.


