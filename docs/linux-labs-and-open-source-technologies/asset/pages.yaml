    # 4.10 Setting Up Cryptographic Services


    In Linux, there are many services that need to be secured while transmitting packets
    over a network. For this, Secure Socket Layer (SSL) protocol is used, and it ensures
    secure transactions over the network and Internet. The term ''cryptography'',
    crypto means secret and graph means writing. Cryptography is considered as a science
    that encompasses principles and methods for transforming an intelligent message
    into an unintelligent one and then retransform the unintelligent message into
    the intelligent form.


    Let us learn how SSL protocol provides a secure connection over a network in the
    next section.


    +   SSL

    - SSL protocol is a set of rules that govern server authentication, client authentication,
    and encrypted communication between servers and clients. It was created by Netscape
    to ensure secure transactions over the Internet. SSL requires a SSL certificate
    so that the server sends this certificate to the client to authenticate the server''s
    identity. This authentication processes the public-key encryption and digital
    signatures to confirm that the connection established between the server and client
    is a trusted one. The working of SSL is described in the following:

    1. A client requests a secure page (usually https://).

    2. The Web server sends its public key with its certificate.

    3. The client checks whether the certificate was issued by a certificate authority
    (CA), a trusted party, which confirms that the certificate is still valid and
    related to the site contacted.

    4. The client then uses public key to encrypt the data and send it to the server.

    5. The Web server decrypts the data by using its private key.'
  merge: -1
  pgno: 146
- img_proc: true
  md: '# 130 Chapter 4


    +   6. Then, the Web server sends back the requested Web document in an encrypted
    way.


    +   7. The client decrypts the Web document using its key and displays the information.


    In the working of SSL, you have noticed that the role of a certificate, issued
    by a CA, is important. A certificate is an electronic document that is used to
    identify an individual, server, company, or some other entity and associate that
    identity with a public key. It is similar to a driving license, passport, or some
    other identity proof. Just as in the case of a driving license, you need a government
    agency to verify your identity, your ability to drive, your address, and other
    information before issuing the certificate, in the same way, a certificate can
    be issued by a CA.


    CAs are entities that validate and issue certificates. They can be either independent
    third parties or organizations running and issuing their own certificates. The
    certificate issued by a CA binds a public key with the name of an entity, such
    as the name of an employee or server.


    Now, let us learn to create and manage certificates in Linux.


    # Managing Certificates with OpenSSL


    In Linux, you can create a self-signed certificate, called the public key infrastructure
    (PKI) certificate. An easy way to create a certificate is by using the openssl
    command. Now, let us learn to create a self-signed certificate using the openssl
    command. It is assumed that Linux is installed with openssl.


    Perform the following steps to create a self-signed certificate:


    +   1. Open a new file and ensure that it is not readable by anybody, by using
    the following command:


    ```

    umask 077

    ```


    +   2. Enter the following command to create a new certificate:


    ```

    openssl req -newkey rsa:1024 -days 730 -x509 -keyout mynewcert.key -out mynewcert.crt

    ```


    The preceding command creates a new RSA (Rivest, Shamir, and Adleman) certificate.
    It is a 1024 bit certificate. The generated certificate will expire in two years.
    If you want to change the time, you can change the number after the -days option.


    Next, the OpenSSL will ask for a passphrase (or password). A passphrase cannot
    be read from a configuration file. It is very important to select a secure passphrase,
    because in case a private key is stolen, the passphrase is the last protection.
    However, if you do not want to create a passphrase, you just need to press the
    ENTER key when the system prompts for a passphrase. This action will set an empty
    passphrase, so the user will not be prompted for it again and again.


    Now, let us learn to work with the GNU (GNU''s Not Unix) Privacy Guard.'
