    # Boot Loader


    A boot loader helps boot the operating system installed on the hard disk of your
    system. The Linux operating system lets you select from two boot loaders, GRUB
    or LILO. The first process that takes place, when you turn on a computer after
    installation of a program, is booting. The process of booting takes place through
    a boot sequence that consists of an initial set of instructions to start the computer.
    Boot loader is an application responsible for loading and starting the Linux operating
    system for a computer.


    It can be invoked in any of the following ways:


    +   - BIOS passes control to the Initial Program Loader (IPL) installed within
    a drive''s Master Boot Record (MBR).


    +   - BIOS passes control to another boot loader, which in turn passes control
    to an installed IPL within a partition''s boot sector.


    GRUB stands for Grand Unified Bootloader with Linux. This boot loader resides
    on your system''s hard disk and starts Linux when you turn on your computer. It
    is the first thing that appears after booting of your computer. GRUB is dynamically
    configured (dynamic configuration refers to the configuration, which is loaded
    at the startup of the Linux operating system). It also consists of the features
    that enable multiple formats, multi-boot and non-multiboot operating systems,
    and automatic decompression of boot images. GRUB can be run from any device, such
    as a floppy, a CD-ROM, a USB drive, or over the network.


    LILO stands for LiLoader. The LILO boot loader does not depend on any particular
    file system and can boot an operating system from floppy disks and hard disks.
    On some of the Linux distributions, as Slack, LILO is the default boot loader
    instead of GRUB. LILO is placed in the MBR and can boot and set each parameter
    of kernel independently.


    If you want to use the LILO boot loader, you can do it in two ways. If you are
    performing a fresh installation of any Linux distribution on your system, you
    can boot your computer with LILO boot loader.'
