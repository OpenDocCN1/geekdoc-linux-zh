    # Changing UIDs and GIDs


    In Linux, every user has a UID and a GID. The UID of a user is an integer value
    that is used to identify the user in the Linux system, whereas the GID (an integer
    value) represents a specific group to which the user belongs. If you want to change
    a user''s UID, use the following syntax:


    ```

    #usermod -u <UID> <username>

    ```


    For example, the following command changes Mahendra''s UID to 555:


    ```

    #usermod -u 555 Mahendra

    ```


    To change a user''s GID, use the following syntax:


    ```

    #usermod -g <GID> <username>

    ```


    For example, the following command changes Mahendra''s GID to 555:


    ```

    #usermod -g 555 mahendra

    ```


    # Describing the /etc/passwd file


    The /etc/passwd file stores user account information that is required at the time
    of logging to a computer. This information includes user ID, group ID, home directory
    of user, etc. The file also contains a list of all the accounts on the system.
    In the file, there is one line for each user (or user account). All fields are
    separated by a colon (:). The file stores user account details in the following
    format:


    ```

    username:x:UID:GID:home_directory:login_shell

    ```


    Some examples of such accounts are follows:


    ```

    root:x:0:0:root:/bin/bash

    deven:x:502:502::/home/deven:/bin/bash

    guest:x:502:504::/home/guest:/bin/sh

    ```


    AS you can see, the format contains seven fields, which can be described as follows:


    +   Username: Refers to the name that is required for login. The length of this
    field should be between 1 and 32 characters.'
