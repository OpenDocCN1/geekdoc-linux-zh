  md: '# The ps Command


    The ps command is used to display the currently running processes on a Linux system.
    If you know the function of Task Manager, which pops up under Windows NT/2000/XP
    when you press the Ctrl+Alt+Del keys, then you can easily understand the function
    of ps in Linux. It can display the processes running on Linux in various formats.


    The output fields for the ps command are as follows:


    +   - USER: UID: User identification

    - PID: Process Identification Number

    - %CPU: The amount of CPU utilized by the process

    - %MEM: Percentage of memory (in kilobytes) used by the process

    - SIZE: Size of virtual memory used by the process

    - RSS: Resident Set Size of real memory used by the process

    - TTY: Terminal (console) associated with the process

    - STAT: Current state of the process

    - START: Start time or date of the process

    - TIME: Total CPU time used by the process

    - COMMAND: Name of the command being executed

    - NI: Nice value in calculating the priority number

    - PRI: Process Priority number

    - PPID: Process ID (PID) of the parent process

    - WCHAN: Name of the kernel process where a process is sleeping

    - FLAGS: Numeric flags associated with the process


    The ps command accepts a wide variety of command arguments. Some of these are
    listed as follows:


    +   - a: Shows processes belonging to all users

    - e: Shows process environment variables after the command line field

    - i: Shows output in the long format

    - u: Shows user name and process start time

    - U: Shows processes running by a specific user

    - w: Shows processes associated with a specific tty device

    - T: Shows all processes associated with this terminal

    - t: Shows processes belonging to a specific terminal

    - C: Shows all process associated with a specific command'
