  md: '# 7.11 Location-Based Services


    Android-supported devices provide the capability of identifying a user location
    through a cellular phone tower, built-in Global Positioning System (GPS) device,
    or Wi-Fi hotspot. Note that the user location is obtained on the basis of the
    location of the device because it is assumed that the user would go, the device
