    # Compression Tools


    Compression tools are also used for performing backups. There are several compression
    tools in Linux. Some of the main ones are as follows:


    +   - gzip: Refers to a GNU zip compression program, which compresses a tar archive
    with the GNU zip. Generally, it creates a file with the .gz extension. The syntax
    for the gzip command is as follows:


    ```

    gzip user_tar_file.tar

    ```


    +   - bzip2: Refers to a tool that was released by Julian Seward in 1997 under
    a BSD licence. The tool offers superior compression over gzip but it takes more
    processor time. It creates a file with the .bz extension. The syntax for using
    the bzip2 tool is as follows:


    ```

    bzip2 user_tar_file.tar

    ```


    The following syntax is used to decompress a file compressed by bzip2, and extract
    the contents in the current directory:


    ```

    bunzip2_user_file.bz2

    ```


    +   - tar: Refers to a tool that usually creates an archive file, but you can
    compress this archive file by using the gzip or bzip2. For this you use the z
    or j option, as shown in the following commands:


    ```

    tar -zcvf pics.tar.gz *.png *.opt

    tar -jcvf data.bz2 *.doc

    ```


    In the preceding commands, the -z option is used for gzip compression, and -j
    option is used for bzip2 compression.


    +   - zipinfo: Refers to a tool that is used to find detailed information about
    a zip archive, for example, winzip. The syntax for using the zipinfo command is
    as follows:


    ```

    zipinfo zip_file.zip

    ```


    +   - zipgrep: Refers to a tool that runs the grep command to look for files within
    a zip file, for example winzip, without manually decompressing the file first.
    The syntax for using the zipgrep command is as follows:


    ```

    zipgrep pattern zip_file.zip

    ```


    +   - bzip2recover: Refers to a tool that is used to recover files from a damaged
    bzip2 archive. It simply extracts all the working blocks and performs an integrity
    test on them.'
