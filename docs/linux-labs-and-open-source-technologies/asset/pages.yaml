    # Working with Activities


    Activities play a crucial role in an Android application because they are used
    to create the screens for users. Therefore, it is very essential to learn how
    to start, stop, suspend, and resume an activity. Activity is composed of views
    that handle the layout and provide text elements, button, forms, and graphics
    to a device screen. In this section, you will learn how to work with activities
    by performing the following actions:


    +   - Creating an activity

    - Starting an activity

    - Managing the lifecycle of an activity

    - Applying themes and styles to an activity


    Let''s perform each of these activities by one one.


    # Creating an Activity


    You can create an activity by creating a Java class that extends the Activity
    class. Note that each activity needs to create a window in which its interface
    components can be loaded. For this, the setContentView(View) method is invoked.
    Generally, the activities are displayed as a full-screen window to the users.
    You can also set them in different views, such as floating or embedded, in the
    other activity. You can set floating windows by using themes with the windowIsFloating
    attribute, and you can embed an activity into another using the ActivityGroup
    class (deprecated in API level 13). You should note that all the activities (or
    subclasses of the Activity base class) generally implement two methods, namely,
    onCreate(Bundle) and onPause(). Apart from these methods, the Activity class provides
    various other methods that serve as events to manage the lifecycle of the activity.
    Table 4 describes the methods of the Activity class that governs its lifecycle:


    | Table 4: Description of the Lifecycle Callback Methods of an Activity |

    | Method | Description |

    | --- | --- |

    | onCreate() | Invokes when an activity is created for the first time. In this
    method, you should provide the basic static setup, such as creating views or binding
    data, to lists. This method is invoked with the null savedInstanceState parameter
    during creation of the activity. However, if the activity is either stopped by
    the user or destroyed by the system then this method is invoked with its previous
    state held by the Bundle savedInstanceState parameter. Even when you change the
    orientation of the device, i.e., landscape or portrait, the activity is recreated
    |'
