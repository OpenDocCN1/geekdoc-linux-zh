    # Swap Space


    Most advertised operating systems support the concept of virtual memory, where
    your system''s hard disk functions as an extension of the physical memory (RAM).
    It is called swap space. When the operating system runs out of physical memory,
    it can move (or swap out) the contents of the currently unused pages of the RAM
    to swap partition in the hard disk to make room for paging. When the operating
    system needs to access anything in the swapped out data, it must find something
    to swap out, and it swaps in the required data from the disk. This process of
    swapping data back and forth between the RAM and the disk is known as paging.


    As you know, the disk is much slower than the RAM, the system''s performance is
    slower when it performs a lot of paging. However, the virtual memory enables you
    to run programs that otherwise cannot run. Linux supports the virtual memory and
    can make use of swap partition. When you create the Linux partitions, you should
    also create a swap partition.


