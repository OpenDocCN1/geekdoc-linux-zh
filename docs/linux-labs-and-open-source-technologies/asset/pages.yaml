    Let''s now learn how to handle user accounts.


    # 3.6 Handling User Accounts


    Creating new user accounts in Linux is quite easy. For this, you just need to
    run the useradd command from the command line. For example, to create a user Mahendra,
    you can run the useradd command as follows:


    ```

    #useradd Mahendra

    ```


    This adds a new entry in the /etc/passwd file. By default, this file stores all
    information related to user accounts.

    There is no default password for the user Mahendra. In order to create a password
    for it, you just need to type the password command on the command line, as follows:


    ```

    #passwd Mahendra

    ```


    This will prompt you to type a password. Type the password and press Enter. You
    will be asked to confirm the password. Type the password again and press Enter.
    You need to type the same password correctly both times in order to create the
    account successfully.


    +   Modifying Existing User Information


    Modification in the existing user information means making changes in a user''s
    password, the user''s home directory, the expiration date of the user account,
    the User Identification (UID) and the Group Identification (GID). Let''s learn
    to perform all these tasks in Linux in the following sections.


    # Changing the User''s Home Directory


    The syntax to change a user''s home directory is as follows:


    ```

    #usermod -d <homedir> <username>

    ```


    For example, if you want to change Mahendra''s home directory from /home/Mahendra
    to /home/mahen, run the following command:


    ```

    #usermod -d /home/mahen Mahendra

    ```'
