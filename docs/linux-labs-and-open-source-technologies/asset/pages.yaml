    # ## Comparing with Closed Source/Proprietor Software


    Open-source software are compared with closed source software on the basis of
    performing changes in the source code, but the source code of an open-source software
    is released for public use, but in case of a closed source software, the source
    code is kept secret.


    A common example of the open-source software is Linux, while Microsoft Windows
    is an example of the closed source software. The source code of Windows is not
    openly available, whereas the source code of Linux is freely available. Another
    comparison can be made between Android and iOS platforms in mobiles. Android is
    an open-source platform, provided by Google, whereas iOS is a closed platform,
    provided by Apple.


    In the case of closed source software, actually companies try to keep people away
    from obtaining the code and doing harmful things, such as writing viruses and
    exploits. It also benefits software vendors by making more money and keeping competitors
    from stealing the code or using it its creator.


    Moreover, the closed source software provides unified experience to developers,
    as the developers can easily select the layout, features, options, colors, etc.


    # ## Comparing with Free Software


    There is an ideological difference between free source and open-source software.
    The term free software was introduced in the early 1980s by the Free Software
    Foundation (FSF).


    Free software is a software that provides freedom to its users and community for
    using it. It means that the users have the freedom to run, copy, distribute, change,
    or enhance the features of the software. It is a concept related to liberty, not
    price. The Free Software Foundation is an activist and activist organization for
    free purpose. It defines free software as software that respects the following
    freedoms:


    +   - Freedom 0: The freedom of running or executing a program, for any kind of
    purpose. The type of freedom is given to an individual or organization to use
    the program for learning or development perspective.

    - Freedom 1: The freedom of knowing how the program works. It allows changing
    the code if required, and the source code is accessible.

    - Freedom 2: The freedom of redistributing the copies of the program. This type
    of freedom allows modifications within the program.

    - Freedom 3: The freedom of distributing the copies of the modified versions of
    the program to others. This type of freedom allows releasing a program with your
    modified versions as free software.'
