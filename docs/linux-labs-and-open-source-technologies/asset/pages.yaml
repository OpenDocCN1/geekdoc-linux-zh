  md: '# Working with the GNU Privacy Guard


    The GNU Privacy Guard (GPG) is a GNU''s tool used with Web servers to protect
    e-mail communication and data storage over the Internet. It can also encrypt and
    decrypt files with a password so that the files can be transported securely.


    To create a key pair, you have to use the following command:


    ```

    gpg -gen-key

    ```


    Having a GPG public/private key pair is good, but it has to be shared with others
    also. For this, you need to initialize key transfer so that the other can send
    or receive data in a secure way. To export your public key, you need to use the
    following command:


    ```

    gpg -export -a

    ```


    The gpg command is also used to encrypt data with password and create digital
    signatures. To encrypt and decrypt files with a password, you need to use the
    following command:


    ```

    gpg -c filename

    ```


    For example, if you need to encrypt mydetails.txt file, enter the following command:


    ```

    gpg -c details.txt

    ```


    The preceding command will create a mydetails.txt.gpg file. The -c option with
    the gpg command encrypts the file with symmetric cipher by using a passphrase.
    It should be noted that if you forget your password or passphrase, you cannot
    recover the data, as it uses very strong encryption.


    To decrypt a file, you need to use the following gpg command:


    ```

    gpg mydetails.txt.gpg

    ```


    In addition, you can write the output of the decrypted file to another file. For
    this, you can use the following command:


    ```

    gpg mydetails.txt.gpg -o anotherfile.txt

    ```


