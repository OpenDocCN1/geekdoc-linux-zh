    # Discussing Android APIs


    API stands for Application Programming Interface, which, as a portion of code,
    acts as an interface for communication among different software. An API contains
    specifications to develop a program by means of all the building blocks. These
    building blocks are then joined by a programmer.


    The Android platform provides a framework API that applications can use to interact
    with the underlying Android system. This framework provides various types of packages,
    classes, Extensible Markup Language (XML) elements, and permissions to develop
    applications.


    Till date, various versions of the Android platform have been released. Each version
    of the platform includes updates to the Android APIs. Therefore, there are various
    API levels of the Android platform, each having its own unique set of features.
    Basically, API levels are integer values that uniquely identify different versions
    of the Android platform.


