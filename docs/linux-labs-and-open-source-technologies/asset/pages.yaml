  md: '# 14 Chapter 1


    Q2. What is the difference between the cathedral model and bazaar model of open-source
    software development?


    Ans. Cathedral model is the traditional model of development in which development
    takes place in a centralized way. In this model, separate roles are assigned to
    people who are responsible for designing, managing, and implementing the software.


    The bazaar model was suggested by Eric S. Raymond in 1997. This model is different
    from the cathedral model, as roles are not clearly defined in it. In this model,
    users are co-developers so that they have access to the source code of the software.
    In addition, users are encouraged to submit additions to the source code of the
    software, bug-fixing, bug reports, documentation, etc.


    Q3. Compare open-source software with closed source software.


    Ans. Open-source software are compared with closed source software on the basis
    of performing changes in the source code. The source code of an open-source software
    is released for public use, but in case of a closed source software, the source
    code is kept secret.


    In the case of closed source software, although companies try to keep people away
    from obtaining the code and doing harmful things, such as writing viruses and
    exploits. It also benefits software vendors by making more money and keeping competitors
    from stealing the code or using it against its creator.


    Moreover, the closed source software provides unified experience to developers,
    as the developers can easily select the layout, features, options, colors, etc.


    Q4. What is source available software?


    Ans. The source available software can only be viewed and is not available for
    modification or code enhancement. The source available software is also known
    as shared software. Examples of the source available software are Microsoft Windows
    Program and Microsoft Government Security program.


