    # 3.2 Process Management


    A program is a set of instructions that tells a computer the tasks it has to perform.
    When you run a program, these instructions, along with other details required
    to manage the execution of the program, are copied into memory. This is called
    the running instance of a program or a process, and it is processes that we have
    to manage.


    Process management in Linux always starts with the init command. In fact, you
    can start any process with this command. The primary role of this command is to
    create processes from a script stored in the file named /etc/initab. This file
    uses entries that allow users to log in. It also controls autonomous processes
    of a system.


    When you boot the system, the GRUB.conf file loads the kernel. The kernel in runs
    init, which is the first process to run on the system. The init process can start
    other processes depending on the system''s run level. Every process the Linux
    system gets a process identification (PID) number. Since init is the first process
    loaded into memory, it has a PID of 1.


    The different types of processes in Linux are as follows:


    +   - Daemon Process: A daemon process is a process that runs continuously on
    the system or is loaded into memory only when booting of Linux. You can load several
    daemon processes into memory during booting. Examples of common daemon processes
    are DHCP (Dynamic Host Configuration Protocol Daemon), cron (Cron Daemon), and
    IPD (Line Printer Daemon). A daemon is usually identified by the letter d at the
    end of the process name.


    +   - User Process: A user process, also known as an interactive process, is a
    process runs via a Linux shell. Each shell provides a command line where a user
    can enter the name of commands and programs he/she wishes to run. When the user
    enters a command, such as ls -al, or a program such as /install-sh, the shell
    creates a copy of itself as a new process and replaces it with the command or
    program mentioned in the command line. In simple terms, the shell runs the named
    command, which assigns the name to an object that it may referred by an action
    or as another process.


    +   - Parent and Child Processes: Parent process is any process that starts or
    spawns and control other processes. A child process is a process that is initiated
    by another process. It can also be spawned by its parent process. For example,
    suppose you are working in X Windows and you open an xterm (terminal emulator).
    From the xterm, you find the ~name "jpg to find all .jpg files in your directory.
    In this case, the terminal window is the parent process of the find command. If
    the terminal window is closed, the find command ceases to run because it was run
    as a child process of the term process. Stopping a parent process automatically
    halts the child process. Therefore, when the terminal window is closed, the find
    command stops running.


    Let''s learn about some commands used in Linux processes.'
