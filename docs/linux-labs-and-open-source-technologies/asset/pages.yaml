    related to the action or task to be performed and the data on which the operation
    would be performed. For the Android system, the Intent object can hold the information
    as to how the target activity needs to be launched or the category of the component
    that needs to manage the intent. In brief, an Intent object contains the following
    types of information:


    +   - Name of the component

    - Action to be performed

    - URI of the data on which the operation is to be performed

    - Category of the component used to handle the intent

    - Key-value pairs to be delivered to the component handling the intent

    - Set of instructions for the Android system for launching an activity


    # Intent Resolution


    An intent is basically a message that contains the intent of doing an action.
    An application reacts to the intent. Android supports two types of intents, explicit
    and implicit. In case of explicit intents, you must specify an activity that is
    required to respond to the intent. In other words, you explicitly declare a target
    component, which is used for internal messengers as developers of other applications
    would not be aware of the intent. The following code snippet shows how to define
    an explicit intent:


    ```

    Intent intent = new Intent(this, Target.class);

    startActivity(intentobj);

    ```


    In case of the explicit intent, the Android system provides the Intent object
    to the instance of the specified target class. The object of the explicit Intent
    object contains no other information, except the name of the component used to
    identify the component that should handle the intent.


    On the other hand, in case of an implicit intent, you just declare the intent
    and leave it to the platform to find an activity to respond to the intent. Here,
    you do not require to declare the target component, as the intent is used for
    activating components of other applications easily, as in the following code snippet:


    ```

    Intent intentobj = new Intent(ACTION_VIEW);

    Uri.parse("http://www.google.com");

    startActivity(intentobj);

    ```


