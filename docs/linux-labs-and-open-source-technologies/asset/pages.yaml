  md: '# Handling Map Gestures Interaction


    The Google Maps Android API allows you to set the responses to various gestures
    such as zooming, scrolling, tilting, or rotating the map. These user gestures
    change the zoom level, angle of view, and area of the map to be displayed.


    Let us look at the code to set or manage user gestures on a map.


    # Map Zooming Gestures


    The user gesture for zooming the map in or can be enabled or disabled by using
    the setZoomGesturesEnabled() method of the instance of the UiSettings class. The
    following code snippet enables zoom gestures for our application:


    ```

    UiSettings mapSettings;

    mapSettings = map.getUiSettings();

    mapSettings.setZoomGesturesEnabled(true);

    ```


    You can also set the zooming gesture of the map by setting the map:uiZoomGestures
    property to true or false.


    # Map Scrolling Gestures


    The scrolling gesture allows a user to move around the map by dragging it through
    a single figure. You can enable the scrolling gesture by using the setScrollGesturesEnabled()
    method, which accepts a Boolean value. This method is invoked on the instance
    of the UiSettings class. The following code snippet allows you to manage the map
    scrolling gesture:


    ```

    UiSettings mapSettings;

    mapSettings = map.getUiSettings();

    mapSettings.setScrollGesturesEnabled(true);

    ```


    You can also configure the map scrolling gesture by setting the map:uiScrollGestures
    property in the resource XML file.


    # Map Tilting Gestures


    A user tilts the angle of projection of the map by placing two fingers on the
    screen. Programmatically, you can enable or disable the tilting gesture by invoking
    the setTiltGesturesEnabled() method, as shown in the following code snippet:


    ```

    uiSettings mapSettings;

    mapSettings = map.getUiSettings();

    mapSettings.setTiltGesturesEnabled(true);

    ```


    Alternatively, you may enable or disable the map:uiTiltGestures property in the
    resource XML layout.'
