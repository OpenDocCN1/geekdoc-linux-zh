    # ### Let TELNET Allow Connections from Trusted Addresses


    You can restrict TELNET logins'' access to individual remote servers by using
    the TELNET configuration file. Let''s perform the following steps to allow connections
    from trusted addresses:


    +   1. Add a list of trusted servers to the /etc/xinetd.d/telnet file separated
    by spaces:


    ```

    # default: on

    # description: The telnet server serves telnet sessions


    # encrypted username/password pairs for authentication.

    service telnet

    {

    flags = REUSE

    socket_type = stream

    wait = no

    user = root

    server = /usr/sbin/in.telnetd

    log_on_failure += USERID

    disable = no

    only_from = 172.16.1.100 127.0.0.1

    }

    ```


    This is the process to allow connections from trusted addresses. Let''s perform
    the following commands to restart TELNET.


    +   2. Restart TELNET by the following command:


    ```

    [root@netmon tmp]# chkconfig -level 35 telnet

    [root@netmon tmp]# chkconfig -level 35 telnet on

    ```'
