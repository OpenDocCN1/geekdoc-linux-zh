    # Using Intents


    In Android you can bind one or more activities defined in an application using
    Intents. Apart from binding the activities of the same application, an Intent
    object also allows you to bind the activities of two applications. The `Intent`
    object is a passive data structure that stores the abstract description of the
    task that needs to be performed.


    You should note that the mechanism of passing an intent varies from one component
    to another. For example, in case of launching a new activity or performing a new
    task by an existing activity, the `Intent` object is passed either to the `Context.startActivity()`
    or `Activity.startForResult()` method. However, in case of initiating a new service
    or providing a new set of intents to the running service, in addition, to establish
    the connection between the calling component and the target service, the intent
    object is passed to the `Context.bindService()` method. Lastly, in case of broadcast
    receivers, the Intent objects are passed through various broadcast methods, such
    as `sendStickyBroadcast()`, `sendOrderedBroadcast()`, and `sendBroadcast()`.


    The Android system identifies the appropriate components activity, service, or
    broadcast receivers that would respond to the intent and instantiate them according
    to the requirements. In this section, you would learn about intents in detail
    under the following subsections:


    +   - Intent Objects

    - Intent Resolution

    - Intent Filters

    - Resolving Intent Filter Collision

    - Linking the Activities Using Intent

    - Passing Data Using an Intent


