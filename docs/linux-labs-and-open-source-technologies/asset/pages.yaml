  md: 'Two processes, archiving and compression, are commonly used for taking backup
    and restoring data. Archiving is the process of creating a single file from several
    files or directories. However, it does not reduce the file size. Compression,
    on the other hand, is the process where the size of a file is reduced to make
    it compact. Let''s understand the difference between archiving and compression
    with an example. Suppose you have two directories, dir1 and dir2. Each file stores
    10 files. Archiving means combining both the directories and their data in a single
    file, without any change in size. Assume that the size of each directory is 10x50
    KB. So the resulting file is 2 (10x50) KB, i.e. 1000 KB. On the other hand, if
    you compress the directories and the files, you will find that the resulting compressed
    file is of only a few kilobytes.


    # Archiving Tools


    The following archiving tools and utilities are used for backup in Linux:


    +   - Tar

    - cpio

    - Dump and restore


    Let''s discuss these tools one by one in the following section.


    # Tar Utility


    Tar stands for "Tape Archive" is a UNIX shell command that creates a single file
    called an "archive" from a number of specified files. It can also extract the
    files from such an archive file. A tar archive file is created with the tar extension.
    It should be noted that the files in a tar archive are not compressed usually;
    they just combined together in one file.


    The following is the syntax of the command used to perform the backup of files
    in the tar utility:


    ```

    tar -cvf <destination> < source

    ```


    For example:


    ```

    tar -cvf /backup/home.back /home

    ```


    In the preceding example, the c option creates the backup file, the v option gives
    the verbose details of the running command, and the f option specifies the name
    and location of the backup file.


    # CPIO Utility


    The cpio command is a conventional Linux tool that can be used to take the backup
    of file systems. The syntax to use the cpio command is as follows:


    ```

    cpio flags [options]

    ```'
