    # Linux File Permission


    Linux controls unauthorized access to files and directories by applying permissions
    on them. In an organizational environment where all systems are linked to one
    another, it is possible for a user to access valuable information, or read a private
    e-mail message. To avoid such a situation, every file and directory has an owner
    or a group, for which you need permission (often called mode).


    In Linux, you can have a list of the permissions of a file by using the ls command.
    Each file has a set of permissions to control the access of users who can have
    to that file. The permissions for a file are also called its access mode. A file
    has the following permissions:


    +   - r (-):): Indicates the read permission, that is, users are permitted to
    read and copy the particular file


    +   - w (-):): Indicates the write permission, that is, users are permitted to
    modify the particular file


    +   - x (-):): Indicates the execute permission, that is, users are only permitted
    to execute the particular file


    You can change the permissions of your files (or the files of other users if you
    are the root user) by using the chmod command. For example, you can provide write
    permissions to users by using the following command:


    ```

    chmod g+w [filename]

    ```


    In the preceding command, g represents the group of the file. w represents the
    write permission, and + represents the fact that the permission is added.


    # Changing a File Owner or Group


    The chmod command is used to change the ownership of your files, and the chgrp
    command to change the ownership of a group. An example using the chown command
    is as follows:


    ```

    chown Mary file.txt

    ```


    The preceding command sets the owner of the file file.txt to the user Mary.

    Next, let''s learn how to manage the software in Linux.'
