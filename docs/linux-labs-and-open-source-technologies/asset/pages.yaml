  md: 'In the following example, you set up the forward zone for www.spit.ac.in by
    placing entries at the bottom of the named.conf file. The name of the zone file
    is spit.ac.in.forward, and it should be located in the default directory. /var/named/chroot/var/named.
    The following code shows how to set up the forward zone:


    ```

    zone "spit.ac.in" {

    type master;

    notify no;

    allow-query { any };

    file "spit.ac.in.forward";

    }

    ```


    In addition, you can insert additional entries in the named.conf file to reference
    other Web domains you host. Let us consider the following code as an example for
    another-site.com using a zone named another-site.zone:


    ```

    zone "another-site.com" {

    type master;

    notify no;

    allow-query { any };

    file "another-site.zone";

    }

    ```


