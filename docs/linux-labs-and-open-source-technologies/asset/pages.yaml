    # Applying Themes and Styles to an Android


    A style is a collection of properties that specify the look and format of a view
    or window. Some examples of such properties are height, padding, font color, size,
    or background color. In an Android application, a style is specified in an XML
    resource, which is separated from the XML that specifies the layout. However,
    a theme is a style that is applied to an entire activity or application rather
    than an individual view.


    There are two ways to set themes and styles in Android applications. The first
    is to add the style attribute to a View element in XML for the layout in order
    to apply a style to an individual view. The following code snippet shows how to
    set a style for a view in the XML layout:


