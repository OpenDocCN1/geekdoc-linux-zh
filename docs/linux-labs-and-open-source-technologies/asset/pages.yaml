    the views are LinearLayout, RelativeLayout, and TableLayout. A ViewGroup is derived
    from the android.view.View base class.


    +   Q8. Which user permission must be configured in the AndroidManifest.xml file
    to create an Android application that makes an outgoing call using the system
    telephony stack?


    Ans. The CALL_PHONE uses-permission must be configured in the AndroidManifest.xml
    file to create an Android application that makes an outgoing call, as shown in
    the following code snippet:


    ```

    <uses-permission androidname="android.permission.CALL_PHONE">

    ```


    +   Q9. Explain the SmsManager class in Android development.


    Ans. The SmsManager class allows you to programmatically send an SMS. You should
    invoke the getDefault() method of the class to directly instantiating the class.
    The invocation of the getDefault() method returns the SmsManager object, which
    can be used to invoke the eventually() method. When this method is invoked, the
    SMS is sent to the specified recipient. The following code snippet shows the use
    of the SmsManager class to send text messages:


    ```

    SmsManager sms_manager = SmsManager.getDefault();

    ```


    +   Q10. How will you generate a private key for signing an Android application?


    Ans. Obtaining a private key involves the interaction between the keytool and
    jarsigner utilities of JDK and the Android SDK build tools. This interaction can
    take place in two ways. The first way is to set the JAVA_HOME variable in Environment
    variables of Windows in a computer system. In this variable, you have provide
    the path to the JDK directory. The second way is to set the path of the standard
    commands, keytool and jarsigner, as the PATH variable in the environment variables.


    By using the keytool command and the options, you can generate a self-signed key.
    For example, the following command is used to generate a private key:


    ```

    keytool -genkey -v -keystore your-key-name.keystore

    -alias alias-key-name -keyalg -keysize 2048 -validity 10000

    ```'
