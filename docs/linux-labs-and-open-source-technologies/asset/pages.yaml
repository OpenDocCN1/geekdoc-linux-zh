    Let us now move ahead and learn to design the TabLayout.


    # ## The TabLayout Using the Action Bar


    The ActionBar class is deprecated in Android 4.0, and the new concept called action
    bar is used. Prior to API 4.0, the action bar did not have thebedbed facility.


    The action bar pertains to the enhanced UI of an application in Android 4.4. The
    basic intention to employ the action bar is to:


    +   i. Identify the application and user location

    ii. Assist in user actions and navigation modes


    As a best practice, a developer should use the action bar in an activity that
    is associated with a lot of user actions or navigations. The use of action bar
    ensures that you have as much dedicated space on the screen as you want. The dedicated
    space can be generated through different tabs. The ActionBar fulfill all the requirements
    of a developer to develop a powerful and efficient action bar. Some goals before
    the adoption of the action bar in an application are as follows:


    +   The action bar provides a way to identify the user location and action brand
    through a dedicated space.

    The action bar provides easy navigation across multiple applications.

    The action bar empowers the user with some of the most frequently used activities,
    such as share, create, and search. This can be done by plugging an option menu
    into the action bar.


    Prior to Android 4.0, the action bar did not very flexible. The action bar in
    Android 4.0 comes with tabs, which is a new feature. The `setNavigationmode()`
    method of the ActionBar class is used to create tabs on the action bar. The following
    code snippet shows how to set the navigation mode for tabs:'
