  md: '# 5.3 Executing Script


    In Linux, you can execute a shell script by using the following command:


    ```

    chmod +x hello.sh

    ./hello.sh

    ```


    You can also run the script directly without setting the execute permission:


    ```

    bash hello.sh

    .hello.sh

    ```


    In the previous example, the dot (.) command is used to read and execute commands
    from a file in the current shell.


    The preceding command displays the following output:


    ```

    hello, world!

    welcome to Linux

    ```


    Let''s learn how to work with variables.


    # 5.4 Working with Variables and Input


    A variable represents a memory location, which can be assigned a name and a value.
    Variables are case sensitive and stored as strings by default, even when they
    are assigned numerical values. When you want to extract information from a file,
    a variable is preceded by the $ sign. An input is assigned to the variable using
    the read command and contents of a variable are retrieved by using the echo command.
    This can be illustrated by the following example where we have a variable named
    salutation to check its content:


    ```

    read salutation

    HOW ARE YOU?

    echo $salutation

    HOW ARE YOU?

    ```


    Variables are divided into system variables and user-defined variables.


    +   - System Variables System variables are created and maintained by Linux shell
    itself. A system variable is a named object that contains information used by
    one or more applications. The difference between these and user-defined variables
    is that system variables are generally in the upper case while those defined by
    the user are in the lower case.'
