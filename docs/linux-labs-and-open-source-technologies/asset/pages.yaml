    # ## Networking in Android


    Android-supported devices allow you to connect to the Web using the HTTP protocol.
    You can access your emails, download Web pages, save pictures, and download text
    files from the Web using this protocol. In addition, you can communicate through
    Simple Object Access Protocol (SOAP) or Representation State Transfer (REST)-based
    services and client server protocol.


    The Android Software Development Kit (SDK) provides packages to implement capabilities
    in the application. The Android networking capabilities are as follows:


    +   - **java.net**: Provides networking classes such as DatagramPacket, MulticastSocket,
    ServerSocket, and Socket. Java developers need to be familiar with this package
    in order to create networking applications.

    - **java.io**: Provides classes that are used to provide system input and output
    through files and data streams.

    - **java.nio**: Provides classes representing buffers as containers of data types.

    - **org.apache**: Contains various packages that define the control and functionality
    for HTTP communication.

    - **android.net**: Provides additional network access sockets apart from the classes
    provided by the java.net package. Generally, the URI class of this package is
    used to develop Android applications.

    - **android.net.http**: Provides classes to work with Secure Socket Layer (SSL)
    certificates.

    - **android.net.wifi**: Provides classes to manage the Wifi functionality provided
    by Android-supported devices.

    - **android.telephony.gsm**: Provides classes that are helpful in sending and
    managing text messages.'
