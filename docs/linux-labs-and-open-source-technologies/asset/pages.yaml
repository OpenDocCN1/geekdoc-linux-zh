    Let''s learn about activities and intents in Android.


    # 7.5 Activities and Intents


    An activity is a component that allows a user to perform an operation. Generally,
    a user performs various operations, such as making a call, capturing a photo,
    sending a message, or viewing a map. For each such operation, an activity is defined.
    An application is a collection of these activities. The main objective of an activity
    is to interact with users. While one should note that in a single application,
    there can be one or more activities. Here there is a main activity displayed to
    the users. In other words, during the launch of an application, the main activity
    provides an interface to the users and further invokes the other activity depending
    on the request of the user. Whenever the other activity is invoked, the previous
    activity is stopped; however, the system preserves the stopped activity in a stack.'
