    On the other hand, DNAT is used to rewrite the destination address of packets
    while translating the IP addresses of computers. DNAT stands for Destination Network
    Address Translation. It allows a host on the Internet to initiate the connection
    and then the Linux router will forward the public IP address on the Internet to
    a private IP address. For example, that an IP address, 5.5.7.23, to communicate
    with 4.4.7.20, which is the IP address of a Linux router. The Internet wants to
