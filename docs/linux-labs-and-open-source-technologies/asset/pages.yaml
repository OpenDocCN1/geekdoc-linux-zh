  md: '# 7.10 Messaging and Networking


    In the present era, when a customer goes to purchase a mobile phone, the basic
    feature that

    he/she would be demanding is telephony and messaging capabilities. The basic applications
    in

    all mobile phones are making an outgoing call, receiving an incoming call, and
    sending Short

    Message Service (SMS) text. All users, irrespective of age group, know how to
    make and

    receive calls and send SMS. Android-supported devices also provide Built-in

    phony and SMS applications with the help of which users can make and receive calls
    and

    send receive SMS.


    +   Handling Telephony

    In Android, the TelephonyManager class is used to manage telephony services on
    mobile

    dev. It provides methods to determine device-related information, such as

    phone type, network operator, and call states. To instantiate the TelephonyManager
    class,

    you need the getSystemService() method which takes a parameter of the telephone

    service context, as shown in the following code snippet


    ```

    TelephonyManager

    telman=(TelephonyManager)getSystemService(Context.TELEPHONY_SERVICE);

    ```


    The TelephonyManager class allows direct access to determine various types of
    properties,

    device, network, SIM, and data details, as shown in the following types of code
    snippet:


    ```

    TelephonyManager

    telman=(TelephonyManager)getSystemService(Context.TELEPHONY_SERVICE);

    string IMEI_no = telman.getDeviceId();

    string SIM_serial = telman.getSimSerialNumber();

    string network_country_iso = telman.getNetworkCountryIso();

    string country_iso = telman.getSimCountryIso();

    string software_version = telman.getSoftwareVersion();

    string voicemail_number = telman.getVoiceMailNumber();

    ```


    Note that some telephony information is permission-protected. To access such

    telephony information, you should also configure the READ_PHONE_STATE uses permission

    in the AndroidManifest.xml file, as shown in the following code snippet:


    ```

    <uses-permission android:name="android.permission.READ_PHONE_STATE"/>

    ```


    +   Making Outgoing Calls\To create an Android application that makes an outgoing
    call, the telephony stack is

    used. This is a simple technique that allows you to use the existing telephony
    stack by using

    the Intent.ACTION_CALL action, as shown in the following code snippet:


    ```

    Intent phone_call_intent = new Intent(Intent.ACTION_CALL);

    phone_call_intent.setData(Uri.parse("tel:123456"));

    startActivity(phone_call_intent);

    ```'
