    # 7.1 Introduction


    The era of the mobile phone has dramatically changed the way we communicate with
    each other. Mobile phones used today are more than just phones. Although basic
    phones are still in use, smartphones are very popular and widely used. The versatility
    and power of a phone largely depend on its operating system. Although different
    operating systems are used in mobile phones, in this chapter we will discuss the
    Android operating system, which is manufactured by Google Inc.


    Android is primarily designed for touchscreen mobile phones. It is open-source
    software that provides a platform for developers to create innovative applications
    with a lot of freedom. Android also provides developers tools that allow them
    to take full advantage of the hardware capabilities of the phone. Some updated
    functionalities in Android have gained a lot of popularity. For instance, location-based
    services can search the location of customers by using Global Positioning System
    (GPS) and can provide detailed information about using cloud-based services. Moreover,
    Android gives an marketplace for distributing applications or games developed
    by developers.


    This chapter discusses Android programming in detail. After a brief introduction,
    it explains the procedure to set up the Android environment. You also learn about
    activities and intents. In addition, the chapter discusses user interfaces (UIs)
    and how to design them by using views. In addition to this, the chapter discusses
    data persistence and content providers. Moreover, it describes messaging, networking,
    and location-based services. Towards the end, you learn how to publish Android
    applications.'
