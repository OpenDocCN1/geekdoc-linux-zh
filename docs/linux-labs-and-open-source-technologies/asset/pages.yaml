    # Preparing the Application for Release


    Your application must be signed before release. When you release your application,
    users download and install it on their Android-powered devices. The tasks that
    are required to be accomplished by preparing your application for release are
    as follows:


    +   - Your application should not contain any unwanted or garbage code, such as
    log calls. It should also not have the android:debuggable attribute in the AndroidManifest.xml
    file.


    +   - Provide proper versioning for your application in the AndroidManifest.xml
    file.


    +   - Sign your application property.


    +   - Test your application on a real device for which the application is intended.


    +   - All application resources, such as multimedia and graphics, must be updated
    and included.


    +   - Prepare an End User License Agreement (EULA) to protect your intellectual
    property.


    +   - Prepare remote servers and services that your application relies on.


    After completing all the preceding tasks, your application is ready for release
    with the signed APK.


