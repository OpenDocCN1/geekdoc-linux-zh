    # User-Defined Variables


    User-defined variables are created and maintained by users. Depending on the type
    of your applications, you can use different variable names. For example, for a
    banking application, you can use variable names like bank_account or BankAccount.
    The following syntax shows how to create and assign value to a variable:


    ```

    varName=someValue

    ```


    In the preceding syntax, someValue is assigned to the varName variable.

    To display the value of a variable, use the echo or printf command, as follows:


    ```

    echo "$varName"

    OR

    echo "${varName}"

    OR

    printf "${varName}"

    OR

    printf "%%s" ${varName}

    ```


    Some naming conventions be followed when creating variable names are as follows:


    +   - A variable name must begin with an alphanumeric character or underscore
    (_), which can be followed by one or more alphanumeric or underscore characters.

    - Do not use space on either side of the equal sign when assigning value to a
    variable. For example, the following assignment is invalid:


    ```

    num= 10

    ```'
