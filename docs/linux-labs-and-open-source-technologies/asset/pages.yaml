  md: '# Open Source Mobile Programming 315


    We have understood the advantages of using the same certificate. Now, let''s see
    how to set the validity period of the key that is used to sign and update your
    application. You need to consider the following points regarding the validity
    period of a key:


    +   - Always set the lifespan of the key to or more than 99 years (maximum permissible
    limit) if you are going to support a single application. If the lifespan of the
    key expires, the user will be unable to upgrade to new versions of your application.

    - If you are going to publish multiple applications using the same key, then ensure
    that the key''s value surpasses the lifespan of all the available versions of
    the applications in a suite.

    - Finally, if you want to publish your application on Google Play, then your key
    must expire after October 22, 2033, as Google Play wants the users to get seamless
    upgrades of an application on new key


    # Obtaining the Appropriate Private Key


    Obtaining a key involves the interaction between the keytool and jarsigner utilities
    of JDK and the Android SDK tools. This interaction can take place in two ways.
    The first way is to set the JAVA_HOME variable in Environment variables of Windows
    in a computer system. In this way, you have to provide the path up to the JDK
    directory. The second way is to set the path of the standard commands, keytool
    and jarsigner, as the PATH variable in the environment variables.


    By using the keytool command and its options listed in Table 9, we can generate
    a self-signed key. For example, the following command is used to generate a private
    key:


    ```

    keytool -genkey -v -keystore key-name.keystore

    -alias alias-key-name -keyalg RSA -keysize 2048 -validity 10000

    ```


    The options in the preceding command are described in Table 9:


    | Table 9: The Keytool Options with Their Use |

    | Key Option | Use |

    | -genkey | Generates public and private keys (key pair). |

    | -v | Displays verbose output. |

    | -alias | Displays an alias for the key. It uses the first eight characters of
    the alias. |

    | -keyalg <alg> | Displays the key encryption algorithm used for generating the
    key. In our case, we have used the RSA algorithm. |

    | -keypass <password> | Displays the password for the key. Note that we are not
    using this option, in the preceding keytool commands. If we use this option, the
    password remains in shell history and an intruder can read it; however, if this
    option is excluded from the command, the keytool command will prompt you to enter
    the |'
