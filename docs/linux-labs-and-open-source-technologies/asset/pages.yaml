    # Android Runtime


    The Dalvik virtual machine and Core Java libraries are constituents of the Android
    runtime environment. Those familiar with Java know that there is no Java Virtual
    Machine (JVM). In Android runtime, the Dalvik virtual machine plays the function
    of the JVM.


    The Dalvik machine is used in Android system as JVM is used in Java. However,
    Dalvik is optimized for low-power Central Processing Units (CPUs) and low-memory
    modules. Unlike the JVM, Dalvik does not recognize files with the .class extension;
    instead, it executes the files with the .dex extension. In fact, .dex files are
    generated implicitly from .class file and are highly optimized when memory and
    processing power are constraints. Using Dalvik over JVM has the following advantages:


    +   - Dalvik is optimized for small platforms where memory and processing power
    are constraints.

    - Dalvik recognizes its exclusively designed APIs along some useful APIs of Java.

    - Using Dalvik, you can create many instances simultaneously, which is beneficial
    in security, isolation, memory management, and multithreading.


    # Core Java Libraries


    Core Java libraries are the exclusively designed Java libraries for Android rather
    than the Java SE and ME libraries. However, most of the functionalities of these
    libraries are similar to those of Java SE libraries.


    # Application Framework


    The Application framework is of utmost importance for a developer as the blocks
    inside this layer directly communicate with Android applications. Basic and much
    needed functionalities such as resource management and call management are provided
    by this layer. From the developer''s perspective, this layer provides the basic
    building blocks for Android applications. The important blocks of the Application
    framework are as follows:


    +   - Activity Manager: Manages the activity lifecycle of applications.

    - Content Providers: Allow data sharing between applications.

    - Telephony Manager: Manages all voice calls. This management is optional. If
    your application is meant to use voice calls, then the telephony manager is used.'
  merge: -1
  pgno: 217
- img_proc: true
  md: '# Open Source Mobile Programming 201


    +   - Location Manager: Manages the activities that help in the searching of locations
    in your application.


    +   - Resource Manager: Manages the different resources in an application.


    # Application


    The Application layer is the top layer in the Android architecture. Some applications
    are installed by default in a device, such as SMS client app, dialer, Web browser,
    and contact manager.


    Pre-installed applications can be replaced by newly written applications. This
    is what makes the Android OS so flexible. Many device vendors modify Android with
    their own applications for the sake of a different feel and look. In other words,
    Android provides a lot of flexibility for a developer to explore endless opportunities.


    # Exploring the Features of Android


    Android is one of the most used operating systems in the world, with more than
    one million New devices being activated every day. Some of the main features of
    the Android OS as follows:


    +   - Android OS is a world-class platform for creating applications for Android
    users.


    +   - There is an open marketplace for distributing applications.


    +   - More than 1.5 billion applications and games have been downloaded on Android
    till now: therefore, it is one of the best platforms for selling applications.


    +   - The full potential of the hardware can be exploited by using the exclusive
    APIs.


    +   - You can create a single application binary and use it for two types of devices,
    phone and tablet.


    +   - Android has the largest user base in the world and it is growing.


    +   - Once your application is ready, you can distribute it over Google Play,
    which is the marketplace for selling and distributing Android applications.


    +   - Applications are intelligently designed on the basis of different versions
    of Android.


    +   - Applications can be developed using either a Java IDE (such as Eclipse)
    or a tool like Apache Ant.


    Besides these features, there is much more to explore in Android. Its popularity
    explains why the platform is preferred by both users and as developers.


    # Exploring Android Applications


    Android applications are developed in Java. Therefore, a basic knowledge of Java
    is essential before you start developing Android applications. If you do not know
    Java programming, any good book can be referred to learn the basics.


    However, Android applications are not entirely based on Java. XML and Apache Ant
    are also used in the development of these applications. So, you should have some
    knowledge of XML too. In essence, if you know the basics of Java and XML, you
    are ready to develop Android applications. Let''s discuss the basic components
    used for application development.'
