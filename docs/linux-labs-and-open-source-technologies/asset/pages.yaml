    # Lab 9


    Objective: To install and configure DNS server.

    Solution: Domain name space (DNS) is a facility provided by the TCP/IP that allows
    you to remember only the name of a site instead of the large and lengthy IP address.
    It is a client/server based architecture that functions at the Application Layer.


    # Authoritative DNS Server


    Authoritative servers provide the definitive information for your DNS domain,
    such as the names of servers and Web sites in it. There are 13 root authoritative
    DNS servers, as shown in Figure 5:


    ![](img/889a483c5a60e0806e42b73b2662a855_395_0.png)


    These root servers know all the authoritative DNS servers for all the main domains—com,
    .net, and the rest. This layer of servers keeps track of all the DNS servers that
    Web site systems administrators have assigned for their sub domains.


    For example, when you register your domain apple.com, you are actually inserting
    a record for the .com DNS server that points to the authoritative DNS server,
    which you have assigned for your domain.'
  merge: -1
  pgno: 395
- img_proc: true
  md: '# Caching Name Server


    Caching name server provides name lookup for client programs such as web browsers
    by contacting other name servers. This information is cached in local storage
    in case it is requested in near future.


    If you want to host your own website with full control of all the web domains
    and your ISP provides you with a fixed IP address authoritative DNS server is
    the answer.


    # DNS Testing of DNS Interrogation at DNS client


    DNS Server (named) resolves or maps fully qualified domain name as www.spit.ac.in
    to an ip address. This is also called forward lookup. It also resolves or map
    IP address to Fully qualify domain name. This is called reverse lookup.


    There are a number of commands you can use to do these lookups. Linux uses the
    host and nslookup command as DNS client program.


    # The host Command


    The host command accepts arguments that are either fully qualified domain names
    or the IP addresses of the servers while providing results. Following is the syntax
    to perform a forward lookup:


    Syntax:


    ```

    [root@netmon tmp]# host www.spit.ac.in

    .spit.ac.in has address 202.22.21.20

    [root@netmon tmp]#

    ```


    Following the command to perform a reverse lookup:


    ```

    [root@netmon tmp]# host 202.22.21.20

    20.21.22.202-in-addr.arpa domain name www.spit.ac.in.

    [root@netmon tmp]#

    ```


    # The nslookup Command


    The nslookup command provides the same result on Windows PCs. To perform forward
    lookup:


    ```

    C:> nslookup www.spit.ac.in

    Server: nsi.spit.ac.in

    Address: 202.22.21.20

    Non-authoritative answer:

    Name: www.spit.ac.in

    Address: 202.22.21.20

    C:\

    ```'
  merge: -1
  pgno: 396
