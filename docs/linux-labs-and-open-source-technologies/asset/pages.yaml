    router, 4.4.7.20 with the following packet details:


    (Source Address: 5.5.7.23, Destination Address: 4.4.7.20)


    +   2. After receiving the packet, the Linux router rewrites the destination address
    of the packet from 4.4.7.20 to 192.168.1.111 and adds an entry in the /proc/net/ip_conrack
    table.


    +   3. After processing the request, the reply from the 192.168.1.111 IP address
    will be sent to our own router with the following IP details:


    (Source Address: 192.168.1.111, Destination Address: 5.5.7.23)


    +   4. After receiving the IP packet, the Linux router will look up the ip_conrack
    table to find details about this connection and rewrite the source address of
    the packet to its own public IP address. The resulting final packet will be sent
    to the 5.5.7.23 address with the following details:


    (Source Address: 4.4.7.20, Destination Address: 5.5.7.23)'
