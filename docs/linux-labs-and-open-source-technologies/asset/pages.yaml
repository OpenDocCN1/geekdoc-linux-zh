    # Geocoding and Reverse Geocoding


    The process of navigating the geographic location on the basis of the latitude,
    longitude, or location name is the process of finding the location name and information
    on the basis of geographic location which is known as reverse geocoding. The Android
    SDK provides the Geocoder class in the android.location package. This class allows
    you to implement geocoding and reverse geocoding. You can invoke the getFromLocation()
    or getFromLocationName() method of the Geocoder class for geocoding. For reverse
    geocoding, the getFromLocation() method is invoked. However, geocoding is implemented
    by invoking the getFromLocationName() method. The three parameters are passed
    as arguments to the getFromLocation() method.


    +   - Latitude

    - Longitude

    - Results to be returned


