    # 4.9 Securing Servers with IPTables


    Linux comes with a host-based firewall Netfilter. This firewall is a very important
    part of the Linux kernel. It provides security, packet, packet mangling, and manipulation.
    IPTables is a front end of the Netfilter that tells the kernel what the user wants
    to do with the IP packets arriving into, passing through, or leaving the Linux
    box. It is a firewall utility built for Linux operating systems. This utility
    uses policy chains to allow or block network traffic. IPTables always comes pre-installed
    on any Linux distribution. However, you can manually install or update it by using
    the following command:


    ```

    sudo apt-get install iptables

    ```


    +   * Types of Chains

    IPTables uses three types of chains: input, forward, and output, as shown in Figure
    24:


    ![](img/889a483c5a60e0806e42b73b2662a855_142_1.png)


    ▲ Figure 24: Displaying IPTables Chains'
  merge: -1
  pgno: 142
- img_proc: true
  md: '# Chapter 4


    The description of these chains is as follows:


    +   - Input: This chain is used to control the behavior of incoming connections.

    - Forward: This chain is used for incoming connections that are not actually being
    delivered locally.

    - Output: This chain is used for outgoing connections.


    # Tables and Rules


    +   IPTables has the following built-in tables and rules lists:

    - Filter: Represents the default table for handling network packets.

    - NAT: Stands for Network Address Translation. It is used to alter packets that
    create a new connection.

    - Mangle: Specifies the table that is used for specific types of packet.

    - Raw: Specifies the table that is used for configuring exemptions from connection
    tracking in combination with the NOTRACK target.

    - Security: Specifies table that is used for Mandatory Access Control (MAC) networking
    rules.


    Figure 25 shows a block diagram of IPTables:


    ![](img/889a483c5a60e0806e42b73b2662a855_143_0.png)


    > Figure 25: Displaying a Block Diagram of IPTables


    Each table has a set of built-in chain rules that correspond to the actions performed
    on a packet by Netfilter.

    These built-in rules for the filter table are as follows:


    +   - INPUT: This rule applies to the network packets that are targeted for the
    host.

    - OUTPUT: This rule applies to the locally generated network packets.

    - FORWARD: This rule applies to the network packets routed through the host.'
  merge: -1
  pgno: 143
- img_proc: true
  md: 'The built-in chain rules for the NAT table are as follows:


    +   - PREROUTING: This rule applies to incoming network packets before they are
    routed.


    +   - OUTPUT: This rule applies to the locally generated network packets before
    they are sent out.


    +   - POSTROUTING: This rule applies to network packets before they are sent out.


    The built-in chain rules for the mangle table are as follows:


    +   - INPUT: This rule applies to the network packets targeted for the host.


    +   - OUTPUT: This rule applies to the locally generated network packets before
    they are sent out.


    +   - FORWARD: This rule applies to the network packets routed through the host.


    +   - PREROUTING: This rule applies to incoming network packets before they are
    routed.


    +   - POSTROUTING: This rule applies to network packets before they are sent out.


    The built-in chain rules for the raw table are as follows:


    +   - OUTPUT: This rule applies to the locally generated network packets before
    they are sent out.


    +   - PREROUTING: This rule applies to incoming network packets before they are
    routed.


    The built-in chain rules for the security table are as follows:


    +   - INPUT: This rule applies to the network packets targeted for the host.


    +   - OUTPUT: This rule applies to the locally generated network packets before
    they are sent out.


    +   - FORWARD: This rule applies to the network packets routed through the host.


    # Using IPTables


    Before you begin, you need to make sure that the IPTables software Redhat Packet
    Manager (RPM) is already installed. For this, you need to use the following command
    that displays the status of firewall in Linux:


    ```

    # iptables -L -n -v

    ```


    In the preceding command, the L option lists the rules, n option displays the
    IP address and port in numeric format, and v option means verbose that displays
    the detailed information of the entire command. You can also inspect firewall
    with line numbers by entering the following command:


    ```

    # iptables -n -n -v --line-numbers

    ```


    The INPUT and OUTPUT options of the IPTables command are used to display input
    and output chain rules, respectively. The commands to use these options are as
    follows:


    ```

    # iptables -L INPUT -n -V

    # iptables -L OUTPUT -n -v --line-numbers

    ```'
