  md: '# Deleting Files with rm


    You can remove or delete the specified files using the rm command. You must have
    the write permission for the directory from which you want to remove the specified
    file. You must use the rm command carefully if you are logged in as root.


    Options to use with rm command are as follows:


    +   - -f: deletes write-protected files without prompting

    - -i: asks the user before deleting files

    - -r: deletes files and directories recursively


    For example, data is cleared from /tmp/ without prompting the user to delete each
    file. Syntax for this command is:


    ```

    $ rm -rf /tmp/*

    ```


    # Making Directories with mkdir


    You can make new directories using the mkdir command. The syntax to use the mkdir
    command is:


    ```

    mkdir directory-names

    ```


    Options to use with the mkdir command are:


    +   - -p: Creates intervening parent directories if they do not already exist

    - -m: Sets the permissions to mode


    For example, the following command creates the mystuff directory in your home
    directory with read, write, and execute permissions for you; and read and execute
    permissions for others:


    ```

    $ mkdir -m 755 /mystuff

    ```


    To create a directory tree in /tmp using one command with three subdirectories
    called one, two, and three, your syntax is:


    ```

    $ mkdir -p /tmp/one/two/three

    ```


    # Identifying Types of Files


    The data in files is stored in different formats, such as executable programs
    and text files.


    You can identify the type of a file by using the file command. The syntax to use
    the file command is:


    ```

    file [option(s)] File_name(s)

    ```'
