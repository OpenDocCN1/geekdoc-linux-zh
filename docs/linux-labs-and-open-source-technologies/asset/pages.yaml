    In the preceding syntax, we have:


    +   **<standard_prefix>: Allows you to use // as the standard prefix for all content
    providers.


    +   **<authority>**: Represents the name of the content provider. For example,
    for the built-in Contacts content provider, the word used is as the authority.
    However, in case of third-party content providers, you need to provide the fully
    qualified name, such as com.kogent.android, depending on the package of the content
    provider.


    +   **<data_path>**: States the type of data requested from the content provider.
    For example, if you are working with the Contacts content provider, then you can
    use people as the data path as you need to work with the content information stored
    in the provider.


    +   **<id>: Represents the specific record to requested. If you want to fetch
    the details of the 2nd content stored in memory, then you can use 2 as the ID
    in the query URI.


    By default, there are multiple content providers in Android for various data types,
    such as image, audio, video, or any other. The package lists various content providers
    that can be used. You can query any content providers according to the type of
    data held by. If you have specified the desired user permissions in the AndroidManifest
    XML file. However, if you want to make your own data for public use, then you
    either need to create your own content provider or add your data to the existing
    content provider. In this section, we will explore the android.provider package
    and learn how to work with existing content providers.


    # Exploring the android.provider Package


