  md: '# Open Source Operating System


    Q3. What is LVM in Linux?


    Ans. Logical Volume Management (LVM) is a technique in Linux kernel that helps
    in managing disk drives and other mass storage devices. It is used for deploying
    logical rather than physical storage. Using the LVM technique, you can group or
    resize the partitions created on a physical device by creating logical partitions.


    Q4. Describe the role of GRUB.


    Ans. GRUB stands for GRand Unified Bootloader and the default GNU boot loader,
    which comes with Linux. This boot loader runs on your system''s hard disk and
    starts Linux when you start your computer. It is the first thing that appears
    after the booting of your computer. GRUB is dynamically configured (dynamic configuration
    refers to the configuration, which is loaded at the start of the Linux operating
    system). It also contains features that support executable multiple formats, multi-boot
    and non-multi-boot operating systems, and decompression of boot images. GRUB can
    be run from or installed on any device, such as a floppy, a CD-ROM, a USB drive,
    or over the network.


