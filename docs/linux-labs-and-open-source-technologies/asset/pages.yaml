  md: '# 116 Chapter 4


    This file allows you to configure the following elements:


    +   * myhostname: Specifies the hostname of your machine, but does not require
    the full hostname. For example, if your machine hostname is my.samplemailserver.com,
    you just need to type hostname in the address bar of the browser.

    * mydestination: Specifies which destinations this machine will deliver locally.

    * mynetworks: Specifies authorized destinations from where mails may be relayed.


    +   2. After configuring different sections, save the configuration file and restart
    your mail server by using the following command:


    ```

    sudo /etc/init.d/postfix reload

    ```


    Moreover, you can use the following commands to add new users to the mail server
    and to set their passwords:


    ```

    sudo useradd -m <USERNAME>

    sudo passwd <USERNAME>

    ```


    Here, <USERNAME> is replaced by the actual name of the user.

    Let us now learn about NFS.


    # 4.7 Working Principle of NFS


    NFS is a distributed file system. An NFS server has one or more file systems that
    are mounted by NFS clients. These file systems are mounted by the standard UNIX
    mount command. All Unix utilities work just well as NFS-mounted files as they
    do on local disks.


    NFS stands for Network File System, and it is the standard method to share files
    between the Linux and Unix-like systems. The system administrator has to define
    the directories that need to be activated or exported for access by NFS clients
    on the NFS server. In addition, it defines both the NFS server and the subset
    of its exported directories to the clients.


    The NFS server requires the following daemons and utilities:


    +   * portmap: Refers to the daemon on which all others rely. It manages connections
    for applications that use the Remote Procedure (RPC) specification. By default,
    portmap listens to TCP port 111 when an initial connection is made. This is then
    used to negotiate a range of TCP ports, usually above port 1024, to be used for
    subsequent data transactions. You need to run portmap on both the NFS server and
    client.

    * nfs: Starts the RPC processes needed to share NFS file systems. The nfs daemon
    is only on the NFS server.

    * nfslock: Allows the NFS clients to lock files on the server through RPC processes.
    The nfslock daemon needs to be run on both the NFS server and client.

    * netfs: Allows running RPC processes on NFS clients to mount NFS file systems.
    The netfs daemon is run on the NFS client.'
