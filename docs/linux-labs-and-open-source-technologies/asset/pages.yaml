  md: '# Lab 2


    +   Objectives: Linux Network Configuration.

    ni. Configuring NIC''s IP Address.

    ii. Determining IP Address and MAC Address using ifconfig command.

    iii. Changing IP Address using ifconfig.

    iv. Static IP Address and Configuration by Editing.

    v. Determining IP Address using DHCP.

    vi. Configuring Hostname in /etc/hosts file.


    Solution:


    The following are the different addresses used in TCP/IP configuration:


    +   Host address: Represents the IP address of your system; it has a network part
    to identify the network you are on and a host part to identify your own system.

    Network address: Represents the IP address of your network.

    Broadcast address: Represents the IP address for sending messages to all hosts
    on your network at once.

    Gateway address: Represents the IP address of your gateway system, if you have
    one (usually the part of your host IP address with the host part set to 1).\Domain
    name server addresses: Represents the IP addresses of domain name servers your
    network uses.

    mask: Determines the network and host parts of your IP address.


    Interface Configuration


    # Configuring NIC''s IP Address


    When we have many computers on a network, you need way to identify each one uniquely.
    In TCP/IP networking, the address assigned to each computer is known as IP address.
    IP address is the logical address used to communicate with people, computers,
    devices and gather information. An IP address is used to send and receive information
    from one host to another through a physical medium such as cable, on the network.
    An IP address is a 32 bit signed binary number of four octets, which is represented
    in dotted decimal notation, designated to a particular device. Hosts and routers
    (a device used to determine the destination of a data packet) used in the TCP/IP
    protocol suite are identified by the IP address. The IP address is also divided
    into classes and each class has its specific range. The IP address consists of
    two parts, which are as follows:


    +   Network ID: Identifies the network to which the host is connected. Network
    ID is the same for all the hosts on a particular network.

    Host ID: Identifies the host on the network. Host ID is different for different
    hosts on the network.'
  merge: -1
  pgno: 377
- img_proc: true
  md: 'Table 1 lists division of IP addresses:


    | IP Address | Network ID | Host ID |

    | --- | --- | --- |

    | 193.168.75.38 | 193.168.75 | 38 |

    | 130.11.45.90 | 130.11 | 45.90 |

    | 125.25.210.12 | 125 | 25.21.12 |


    Each pair numbers written in decimal notation in an IP address is called an octet.
    In the example 192.168.75.38 is the first octet, 168 is the second octet, 75 is
    the third octet, and 38 is the fourth octet. The following are the rules regarding
    the identification of IP address:


    +   - An IP bits cannot be duplicated

    - All Host bits cannot set to zero

    - All Host bits cannot set to one


    127 cannot be the first octet because it is reserved as a loopback address (address
    that acts as a test mechanism for network devices and protocols).


    An IP is used as an ID to connect to the network, similar to a student who requires
    an ID to access the services in the university. It is a basic protocol to connect
    to the network. Generally, an IP address is assigned to the Network Interface
    Card (NIC) rather than the device (computer). An IP address may be either permanent
    or temporary for a particular device. The following are the two types of IP addresses:


    +   - Dynamic address: Refers to the IP address assigned to the devices that requires
    temporary connectivity to the network or devices communicating through the network
    for a short period. Dynamic IP address uses DHCP (Dynamic Host Configuration Protocol)
    for assigning the IP address.

    - Static IP address: Refers to the IP address assigned to a device that requires
    permanent connectivity to the network. Static IP address is the semi-permanent
    IP address.


    You have learned about IP addresses, in this section. Now let''s discuss the classification
    of IP addresses.


    # Classification of IP Addresses


    As already discussed, IP address specifies a unique ID to access the network.
    It defines IP addresses into five classes: A, B, C, D, and E. The first four bits
    of an IP address determines the class into which an IP address fits.


    The following list shows the various IP address classes as per the variation of
    the first, second, third or fourth of an IP address:


    +   - If the first bit is zero, the IP address belongs to Class A address.

    - If the first bit is one and second bit is zero, the IP address belongs to Class
    B address.'
  merge: -1
  pgno: 378
- img_proc: true
  md: '362 Lab Session


    +   - If the first two bits are one and if the third bit is zero, the IP address
    belongs to Class C address.

    - If the first three bits are one and the fourth bit is zero, the IP address belongs
    to Class D address.

    - If all the four bits are one, the IP address belongs to Class E address.


    Table 2 shows the classification of IP addresses:


    | Class | Network ID | Host ID |

    |---|---|--|

    | A | 0 (7 bits) | 24 bits |

    | B | 10 (14 bits) | 16 bits |

    | C | 110 (21 bits) | 8 bits |

    | D | 1110 | Multicast |

    | E | 11110 | Future use |


    Linux and Unix are the most powerful command line operating systems. Though we
    use GUI for both of them, the command line utilities still play very powerful
    when it comes to managing the system configuration. When it comes to networking,
    Linux and Unix are the most secure choice because networking is tightly integrated
    with operating system and there are lots of tools available in Linux and Unix
    to manage the security.


