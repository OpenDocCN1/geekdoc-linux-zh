- img_proc: true
  md: '# Using Parted


    GNU Parted refers to partitioning tool that can work on a cross platform, which
    can be used with MBR, GPT, APM, and BSD disk labels. This tool provides advantages
    over fdisk, which measures the disk space in megabytes rather than cylinders and
    supports dynamic partitioning resizing. The syntax to use the GNU Parted command
    is as follows:


    ```

    # parted /dev/had

    ```


    Where, /dev/had is the disk to be partitioned.

    Let''s now learn about second task of disk partitioning, which is preparing a
    partition for use.


    # Preparing a Partition for Use


    Once a partition is created, it must be prepared for use, which is called as making
    a filesystem or. This process includes writing of low-level data structures to
    a disk. Further, these data structures are read and modified by Linux in order
    to gain access and store files in partition. In the next section, let''s acquaint
    with common filesystem types.


    # Common Filesystem Types


    Some of the common filesystem types supported by Linux are:


    +   - Ext2fs: Stands for Second Extended File System and can be used for small/boot
    partition of removable disks.

    - Ext3fs: Stands for Third Extended File System that comprises of journal and
    is used in cases of system crash.

    - Ext4fs: Stands for Fourth Extended File System that lets the user to work with
    files of large size.

    - ReiserFS: Refers to the filesystem that acts as a journaling filesystem and
    is also beneficial to use when large number of small size files are present.

    - JFS: Stands for Journaled File System and was developed by IBM for AIX OS. The
    JFX file system is useful in case of dual-boot system.

    - XFS: Stands for Extents File System created by SGI for IIX OS.

    - Btrfs: Refers to an advanced filesystem that can handle disk and files of large
    size.

    - FAT: Stands for File Allocation Table (FAT) and is one of the oldest filesystem
    that is being used. The FAT filesystem is used for data exchange on removable
    disks. Two major variants of FAT are available to support long filenames.

    - NTFS: Stands for New Technology File System (NTFS) and is used to overwrite
    existing files.'
