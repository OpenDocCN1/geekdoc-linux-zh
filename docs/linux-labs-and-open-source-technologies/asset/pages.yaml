    # Describing the /etc/shadow File


    The /etc/shadow file stores the actual password of a user in an encrypted format.
    It also stores additional properties related to the user such as minimum password
    age, maximum password age, and expiration date. The different fields are separated
    by a colon (:). Moreover, the file contains one line per user. The format of /etc/passwd
    is as follows:


    ```

    Username:last_password_change:Minimum_age:Maximum_age:warn:Inactive:Expiry:

    xpiry_date

    ```


    An example of password information of a user in the /etc/shadow file is as follows:


    ```

    dev:Ep6mnkr0ChHF::10063:99999:7:::

    ```


    The various fields in the /etc/shadow file can be briefly explained as follows:


    +   - Username: The login name of the user.


    +   - Password: Specifies the encrypted password of the user. The password should
    consist of 6-8 characters, including special characters/digits.


    +   - Last_password_change: Specifies the date since Jan 1, 1970 when password
    was last changed.


    +   - Minimum_age: Specifies the minimum number of days required between password
    changes.


    +   - Maximum_age: Specifies the maximum number of days in which the password
    needs to be changed.


    +   - Warn: Specifies the number of days after which a warning is issued to the
    user to change his/her password.


    +   - Inactive: Specifies the number of days after which the password will expire
    and the account will be disabled


    +   - Expiry_date: Specifies the days since Jan 1, 1970 when the account will
    be disabled.'
