  md: '# 62 Chapter 2


    the name and the location of files and directories. The following is a brief description
    of the various directories in the Linux FHS:


    +   - / It is the most top directory in Linux FHS.

    - bin: It contains executable files (files that are ready to run) used to boot
    and repair the system. This directory usually contains shells, such as bash and
    csh, which provide a text-based user interface for Linux, as well as commands
    such as cp, mv, rm, cat, and is.

    - sbin: It holds the binary executable files that are only used by the root user.
    This directory contains the files required to boot the system.

    - home: It provides the directory, which is accessible to system administrators
    as well as users. The /home directory stores a user''s personal files, directories,
    and programs.

    - boot: It allows to boot the Linux system. This directory contains Linux kernel,
    which is a core component of the Linux system.

    - dev: It contains the filesystem entries that represent the devices attached
    to the system.

    - lib: It contains all shared libraries that are required by the programs of the
    Linux system.

    - usr: It contains all user applications, their documentation, configuration files,
    and graphics. It also contains the source code files for the system''s software.
    It is the largest directory on the Linux system and holds application programs,
    such as Terminal (Telnet) and File Transfer Protocol (FTP).

    - mnt: It refers to a mount point under you mount filesystems or devices.

    - var: It contains variable data files such as logs (/var/log), mail (/var/mail),
    and spools (/var/sp/).

    - proc: It contains special files that are either used to extract information
    from or send information to the kernel. It is a special virtual directory where
    system processes are stored.

    - etc: It contains all the configuration files of the system. This directory is
    often used to take the backup of the Linux system. It saves you from performing
    the re-configuration process in case you have to re-install the Linux system.

    - root+: It allows to recover files or data in the event of a system crash or
    a power failure.

    - root: It allows access of the home directory to a superuser. The superuser is
    a user who logs in with the root account.

    - tmp: It stores temporary files in Linux.


