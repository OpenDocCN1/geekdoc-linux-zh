  md: '# Chapter 3


    # The kill Command


    The kill command is used in Linux and other Unix-like operating systems to terminate
    processes without having to log out or reboot (i.e., restart) the computer.


    Now, if you want to terminate the emacs process, for example, you need to look
    up its process identifier (PID) and provide the following command:


    ```

    $ kill -9 3216

    ```


    The -9 option ensures execution of the process for which the kill command was
    accessed.


    A convenient shortcut to give the kill command is the Alt-Ctrl-Esc key combination,
    which allows you to select the application you want to kill.


    # The kill Command


    The kill command is used to kill processes by name. This command searches for
    the specified name in all the processes that are running on the system. For example,
    if you want to kill all instances of Netscape, you can type the following command:


    ```

    killall netscape

    ```


    You need to be careful while using the kill command. For example, let''s say you
    are using two parallel Instances of the Emacs editor to edit the foo.txt and foo2.txt
    files. Now, suppose you want to kill all instances of Emacs used to edit foo.txt.
    In both case, the instance of Emacs used to edit foo.txt and foo2.txt will be
    terminated when you use the kill emacs command.


    # 3.3 Job Management


    When you start a program in the console, the program runs in the foreground. Foreground
    programs always have access to the standard input stream to receive commands from
    the user, and the standard output stream to print the information to the user.
    However, the programs running in the background do not have access to these streams,
    which means the programs that do not require input or output by users can be executed
    in the background, such as compiling or building software.


    To start any program in the background, add the ampersand (&) character at the
    end of the line. For, the following command starts Firefox in the console:


    ```

    $ firefox &\ [1] 936

    ```


    The preceding command starts Firefox immediately. The number in square bracket,
    [1], is the job number that controls the job; and the second number, 936, is the
    process identifier (PID) which is a unique, system-wide identifier for the process.


    You can also suspend an already running process by using the CTRL+Z key combination
    on the keyboard.'
