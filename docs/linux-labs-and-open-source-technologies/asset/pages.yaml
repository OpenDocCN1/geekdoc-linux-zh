    # 2.6 Command Line Interface


    The term line command is a text-based interface of a system. In Linux, it is also
    called terminal. CLI provides a prompt to you. Whatever you type will be displayed
    with the help of commands. A CLI provides a prompt to you. Whatever you type will
    be displayed with the help of commands. A operating system, you can access a CLI
    or terminal by the following path:


    Applications→System Tools→Terminal


    In a terminal, you have a shell, which is a part of the operating system that
    defines how the terminal will behave and look after (or executing) commands for
    you. There are various types of shells available, but the most commonly used is
    called bash. The bash stands for Bourne, again shell. Note that you can access
    information about the current shell in which you are working by using a command,
    echo. This command displays a system variable setting your current shell.


    # 2.7 Understanding FHS of Linux


    Every operating system organizes information into files. A file refers to a stream
    of bytes stored on a storage media such as hard disk, pen drive, and magnetic
    disk. These files are stored in different containers known as directories. Directories
    help to organize files in a computer. A set of such directories may be contained
    in one directory, known as a parent directory (also'
  merge: -1
  pgno: 55
- img_proc: true
  md: '# Open Source Operating System 39


    known as the main or the root directory. The directories in the parent directory
    are known as subdirectories.


    The Linux filesystem is organized in a hierarchical structure, with the parent
    and the root directory located at the top of a hierarchy. The root directory is
    represented by a forward slash (/). Whenever you open a file in Linux, you start
    from the root directory to the subdirectories where the file is located. Windows
    follows a different structure consisting of partitions that contain the directories.
    The format followed in Windows is C:\subfolder\file.txt, whereas in Linux, it
    is /Folder/subfolder/file.txt. Linux uses forward slashes to replace the directory
    and file structure. In addition, there are no drives named C: or D in Linux. When
    you install Linux, the root partition is mounted at the root directory (/). Mounting
    refers to the process of preparing a device, so that it can be used by an operating
    system. Files, folders, devices, and drives are mounted under / in Linux. Linux
    follows the File Hierarchy Standard (FHS) to define the name and location of files
    and directories, as in Figure 30:


    ```

    /bin

    /etc

    /home

    /lib

    /lost+found

    /mnt

    /proc

    /root

    /sbin

    /tmp

    /usr

    /var

    ```


    ▲ Figure 30: The File and Directory System in Linux


    Figure 30 shows the directory structure in Linux, which begins with the root directory,
    and from there, the structure branches out to subdirectories and files.


    The following is a brief description of the various directories in the Linux FS:


    +   - / It is the top most directory in Linux FHS.

    - /bin: It contains executable files (files that are ready to run) to boot and
    repair the system. This directory usually contains shells, such as bash and csh,
    which provide a textbased interface for Linux, as well as commands such as cp,
    mv, rm, cat, and ls.

    - /sbin: It holds the binary executable files that are only used by the root user.
    This directory contains the files required to boot the system.

    - /home: It provides the directory, which is accessible to system administrators
    as well as users. The /home directory stores a user''s personal files, directories,
    and programs.

    - /boot: It allows you to boot the Linux system. This directory contains Linux
    kernel, which is a core component of the Linux system.'
