  md: '# Setting Up to Dual-boot Linux and Windows


    Sometimes you want to install multiple operating systems on a single computer
    machine. For example, you want to install Windows as well as Linux on a single
    machine, or you need to install multiple versions of Windows on a computer system.
    This concept is dual booting, if two operating systems are installed; or, multiboot,
    if more than two operating systems are installed on a single computer. A dual
    booting or multiple booting system allows you to have a primary operating system
    and an alternate operating system, which you use less frequently. Some advantages
    of having a dual boot or multiboot environment on a computer system are as follows:


    +   - Allows you to investigate or test a new operating system without switching
    completely to another operating system

    - Helps in taking backup or migrating data before removing the old operating system

    - Allows you to test new applications on multiple operating systems

    - Helps in the installation of different applications that require different hardware
    costs

    - Helps in reducing hardware costs


    To obtain a dual or multiboot environment, you have to use a boot loader, as NTLDR,
    LILO, or GRUB, which can boot more than one operating system.


    If you set a dual boot with Windows and Linux on a computer system, it will allow
    you to select either your Windows System or Linux after the computer just started.


    To set a dual boot on a computer system, you need to reduce the Windows partitions,
    which might be covering greater space in hard disk, to make room for Linux partitions.
    Linux installation requires partitions on a hard disk.


    # Hardisk Partitioning


    According to the master boot record (MBR) partitioning scheme, there are two types
    of partitions: primary and extended. A computer hard disk can be divided into
    at most four primary partitions, or alternatively three partitions and one extended
    partition. It should be noted that a hard disk can have only one extended partition,
    and this partition can be subdivided into multiple logical drives.


    In Linux, you use a physical disk partition to associate each hard partition by
    associating it with a specific part of the file. This arrangement is a hierarchical
    directory, which is also known as a directory tree. If you have more than one
    partition, you can use all of them in Linux under a single directory tree. All
    you have to do is decide which part of the Linux directory tree should be located
    on each partition. This process is known as mounting a file system on a device
    (disk partition is a device) in Linux.


    The term "mount point" refers to the directory you associate with a disk partition
    or any other device. In Linux, a minimum of two partitions need to be created,
    which are as follows:


    +   - The First Partition is the root partition. The minimum size of the root
    partition varies from 2 GB to 8 GB, depending on the installation of software
    packages.'
