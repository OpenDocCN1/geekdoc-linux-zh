    Now, let''s discuss the components of each layer of the Android architecture by
    one.


    # # Linux Kernel


    The Linux kernel is the chief component in the Android architecture. The interaction
    of the hardware with the software is provided by means of the Linux kernel. All
    hardware drivers are handled by the kernel. Drivers are small programs written
    specifically to communicate with the hardware. In Figure 1, you can see that the
    lowest layer is the Linux kernel, and it is also closest to the hardware. The
    Linux kernel has all major hardware drivers such as the display driver, camera
    driver, and power management driver. For example, the Linux kernel will search
    for the camera driver and make it available to the system by using the camera
    driver.


    The Linux kernel not only contains hardware drivers, but also serves as an abstraction
    layer for other layers. Since the core of the Android system lies in the Linux
    kernel, all the main functionalities of the system are based on the kernel. The
    foundation of Android is Linux, which is a powerful system; therefore, it provides
    versatility to the Android OS, and makes it possible for the OS to work on multiple
    devices (any or few) glitches.


    # # Libraries


    The layer next to the Linux kernel layer consists of the Android''s native libraries.
    This layer enables your mobile device, to handle different types of data and information.
    These libraries are coded in the C and C++ languages for fast procedural transactions
    of data. The following is a brief description of some of the native Android libraries:


    +   - WebKit: Refers to the browser engine used to render and display HyperText
    Markup Language (HTML) content.'
