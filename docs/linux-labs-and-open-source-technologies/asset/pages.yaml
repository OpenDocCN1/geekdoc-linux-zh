  md: '# Describing the /etc/group file


    The /etc/group file is a text file that stores information related to user groups
    in Linux. There is one entry per line, and each line has the following format:


    ```

    Group_name:Password:GID:group_users_list

    ```


    In this format, all fields are separated by a colon (:). The file contains four
    fields:


    +   * Group_name: Specifies the name of a group.

    * Password: Specifies the password of a group. This is optional and is generally
    left empty or blank. The password can be stored in the encrypted format.

    * GID: Stands for Group Identification. Each user must be assigned a group ID.

    * group_users_list: Specifies the list of names of a group. The user names must
    be separated by commas.


    # Changing an Account Expiration Date


    If you need temporary access to a system, you can set the expiry date of the account
    accessing that system. The administrator can change the account expiration date
    so that the account is disabled on the set date. If you want to change the account
    expiration date of a user, use the following syntax:


    ```

    usermod -e DD-YYYY <username>

    ```


    In the preceding syntax, MM-DD-YYYY represents the month, day, and year; and two-digit
    years are also accepted.

    Let''s take an example where you want the account for user ''deven'' to expire
    on March 1, 2010. You can use the following command for this purpose:


    ```

    usermod -e 03/01/10 deven

    ```


    The preceding command resets the account expiration date for the user ''deven''
    to March 1, 2010.


    # Changing Finger Information


