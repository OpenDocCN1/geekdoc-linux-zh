  md: '# 3.8 Managing Software


    Linux distributions use the popular Redhat Package Manager or the RPM system for
    adding removing programs. RPM is a powerful command line driven package management
    system capable of installing, uninstalling, verifying, querying, and updating
    software packages. Each software package consists of an archive of files along
    with information about the version and description of the package.


    There are five basic modes of RPM command, which are as follows:


    +   - Install: Specifies the mode that is used to install any RPM package.

    - Remove: Specifies the mode that is used to erase, remove, or un-install any
    RPM package.

    - Upgrade: Specifies the mode that is used to update the existing RPM package.

    - Verify: Specifies the mode that is used for the verification of any RPM package.

    - Query: Specifies the mode that is used to query different RPM packages.


    Table 1: Common Options of the RPM Command


    | Option | Description |

    | -U | Updates or installs the selected package. This can be done via http or
    ftp, in addition to local files |

    | -i | Installs the selected package for multiple versions of files or programs
    |

    | -e | Removes the specified packages |

    | -v | Stands for verbose, which means giving detailed information of the command
    |

    | -F | Updates previously installed packages |

    | -h | Prints hash (#) marks periodically to provide some feedback while performing
    operations |

    | -qa | Specifies the option that queries the operations of all installed packages
    |

    | -ql | Displays the lists of files associated with a package |

    | -q | Provides a list of all the installed packages in a specific group, for
    example, System Environment/Shells |

    | -force | Specifies the option that forcefully terminates the installation |


    To install *.rpm package located on the user''s local storage device or in a remote
    location, you need to use the rpm command. You are also required to provide the
    parameters and file path along with the rpm command. The syntax to install software
    packages is as follows:


    ```

    rpm -i <PATH>

    ```'
