    On the basis of the selected runlevel, the init process executes the startup scripts
    located in the subdirectories of the /etc/rc directory. Scripts used for runlevels
    0 to 6 are located in subdirectories /etc/rc/rc0.d through /etc/rc/rc6.d.

    Once the initialization process is completed, the init process runs /etc/rc.local
    file, and then the control is given back to the kernel.


    # System Shutdown


    The system should not be or switched off immediately after finishing the work.
    This can corrupt the files as well as the file system directory structure. There
    are a number of ways to shut down Linux properly and reboot your system. These
    have been discussed in the following sections.

    The following commands are used to shut down the system:


    +   - shutdown -h now

    - halt

    - poweroff

    - init 0


    # Rebooting the System


    The following commands are used to reboot the system:

    You can also use the following init command to reboot the system immediately by
    entering runlevel 6:


    +   - shutdown -r

    - reboot

    - init 6


    ```

    [root@netmon tmp]# init 6

    ```'
