    # Lab 6


    **Objective:** Configuring Linux as a router by enabling IP forwarding.


    **Solution:** Forwarding allows the network packets on one network interface (i.e.
    eth0) to be forwarded to another network interface (i.e. eth1). This allows the
    Linux computer to connect (ethernet bridge) or route traffic.


    IP forwarding can be turned/on to allow Linux computer to act as a gateway or
    router. In simple words, packet forwarding enables packets to flow through the
    Linux box from one network to another.


    The Linux kernel configuration parameter to activate this is named .ipv4.ip_forward
    and can be found in the file /etc/sysctl.conf. Remove the # from the line related
    to packet forwarding.


    Before:


    ```

    # Disables packet forwarding

    net.ipv4.ip_forward=0

    ```


    After:


    ```

    # Enables packet forwarding

    net.ipv4.ip_forward=1

    ```


    The above syntax enables packet forwarding only when you reboot, at which time
    Linux will create a file in one of subdirectories of the special RAM memory-based
    /proc file system. To activate the feature immediately, you must force Linux to
    read the /etc/sysctl.conf file with the sysctl command using the -p switch. The
    syntax to use sysctl command is


    ```

    [root@netmon tmp] sysctl -p

    sysctl -p

    net.ipv4.ip_forward = 1

    net.ipv4.conf.default.rp_filter = 1

    kernel.sysrq = 0

    kernel.core_uses_pid = 1

    [root@netmon tmp]#

    ```'
