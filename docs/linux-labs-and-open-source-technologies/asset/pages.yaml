    # Using the sed Command


    The sed command filters the data according to the specified pattern. It reads
    and executes the input file line by line. The basic syntax of the sed command
    is as follows:


    ```

    sed ''script'' files

    ```


    In the preceding syntax, files is a list of one or more files, and script is a
    set of one or more commands. These commands are written in the form of:


    ```

    /pattern/ action

    ```


    Here, pattern is a regular expression, and action is one of the commands given
    in Table 4:


    | Table 4: Actions Specified with the sed Command |

    | Action | Description |

    | p | Specifies the option that prints the line |

    | d | Specifies the option that deletes the line |

    | s/pattern1/pattern2/ | Specifies the option that substitutes the occurrence
    of pattern1 with pattern2 |


    Let''s consider an example using the sed command to print a line. Suppose you
    have a fruitslist.txt. The command to see the content of the fruitslist.txt file
    is as follows:


    ```

    $ cat fruitslist.txt

    ```


    | Fruit | Price |

    | Banana | Rs. 50 |

    | Mango | Rs. 80 |

    | Apple | Rs. 110 |

    | Orange | Rs. 35 |

    | Guava | Rs. 45 |


    Now, if you to print the list of fruits that cost less than Rs. 100, you need
    to use the sed command with p actions, as shown in the following command:


    ```

    $ sed ''/[0-9]\([1-9]\$\)/p'' fruitslist.txt

    ```


    Let''s now learn how to use the awk command.'
