  md: '# 366 Lab Session


    # ### Adding Routes from the Command Line


    The route command can be used to add new route to your server. In your example,
    the reference to the 172.16.1.0 network has to be preceded by a -net switch, and
    the subnet mask gateway values also have to be preceded by the netmask and gw
