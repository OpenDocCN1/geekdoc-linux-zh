    Let us learn about mail servers.


    # Mail Servers


    E-mail allows a user to send electronic messages and data over the Internet. It
    is one of the commonly used services for sharing data. To set an e-mail system,
    you need to install a mail server on your system for sending data over a network.
    This is a fast and better way of transferring data. The main components of an
    e-mail system are as follows:


    +   - Message Transfer Agent (MTA)Mail User Agent (MUA)

    - Mail Delivery Agent (MDA)


    Let us understand the components in the following sections.


    MTA is a part of the e-mail system that uses the Simple Mail Transfer Protocol
    (SMTP) for transferring emails from one computer to another, either on the same
    local network or over the Internet. Its responsibility is to contact the MTA of
    the other domain and deliver the message there. Some commonly used MTA for include
    Sendmail, Postfix, Fetchmail, Qmail, and Exim.


    # Understanding the Mail User Agent


    MUA is a client application that is used to write, send, and read e-mail messages.
    When a user writes and sends a message on any computer, he/she uses the MUA. For
    Linux, some textbased MUA are pine and mail tools and some GUI MUA are Evolution
    and KMail.'
  merge: -1
  pgno: 131
- img_proc: true
  md: '# Understanding the Mail Delivery Agent


    Another part of the e-mail system is MDA. It works in the background and performs
    filtering the e-mail messages between the MTA and MUA. The most popular form of
    the MDA is a spam filter that removes all the unwanted e-mail messages from a
    computer machine before they reach the user''s inbox. Some examples of MDA are
    Spamassassin and Procmail.


    # Configuring Mail Servers


    Postfix server is one of the easiest to set up and most reliable to deploy in
    organizations. Let us learn to configure the Postfix server. This server requires
    a user-defined domain; in our case, we are using the samplemailserver.com domain.


    Perform the following steps to install the Postfix server:


    +   1. Open the terminal window.

    2. Enter the following command:


    ```

    sudo apt-get install postfix

    ```


    This command will install and automatically start the Postfix daemon for you.
    When the installation is complete, you can check it by connecting to the Postfix
    server.


    +   3. Enter the following command to connect to the Postfix server:


    ```

    telnet localhost 25

    ```


    The preceding command will display as:


    ```

    Trying 127.0.0.1...

    Connected to www.samplemailserver.com.

    Escape character is ''^]''.

    220 localhost.localdomain Postfix (Ubuntu)

    ```


    +   4. Now, connect to the domain by entering the following command:


    ```

    telnet www.samplemailserver.com 25

    ```


    Perform the following steps to configure the Postfix server:


    +   1. Open the main.cf file. This is the main configuration file of the Postfix
    mail server, located at /etc/postfix/main.cf path. This file contains the following
    configurations:


    ```

    hostname =

    alias_maps = hash; /etc/aliases

    alias_database = hash; /etc/aliases

    myorigin = /etc/mailname

    mydestination =

    nrelayhost =

    networks =

    mailbox_command = procmail -a "$EXTENSION"

    ailbox_size_limit = 0

    recipient_delimiter = +\inet_interfaces = all

    ```'
