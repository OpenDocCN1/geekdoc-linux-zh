    by the Eclipse Foundation for its software. It is designed as a business-friendly
    free software license. The latest version of the EPL is 1.0. It was published
    in February 2004. EPL is approved by the Open Source Initiative (OSI) and is considered
    a free software license by the Free Software Foundation (FSF).'
