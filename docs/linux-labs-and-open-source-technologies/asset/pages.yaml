    # Linking Activities Using Intent


    In an Android application, there may be more than one activity and one activity
    will be calling the other activity to perform the required task. Consider the
    scenario of the e-mail application installed on your device. In the e-mail application,
    various tasks need to be performed, such as composing e-mail, searching for an
    e-mail, and reading an incoming e-mail. For all tasks, separate activities are
    defined, which are invoked according to the task to be performed. In the e-mail
    application, all these activities are linked in such a manner that the appropriate
    activity is initiated according to the user requirement.


    Let''s understand how a new activity is initiated from the current activity. Suppose
    you want to develop an Android application in which the user details are displayed
    when the user clicks the button on the interface. Let consider that there are
    two activities, namely, MainActivity and UserDetails. The MainActivity displays
    a button, which, when clicked, triggers another activity, that is, UserDetails.
    Now, at this stage, you need to understand how the MainActivity calls or links
    the Details activity. The following code snippet shows that a new activity has
    started from the existing activity.


    ```

    //Create the Intent Object

    Intent i = new Intent(this, UserDetails.class);

    //Start the new activity

    startActivity(i);

    ```


    In the preceding code, the intent contains the target component, i.e., UserDetails.
    Now, when the startActivity() method is applied, the target component will be
    displayed to the user.


