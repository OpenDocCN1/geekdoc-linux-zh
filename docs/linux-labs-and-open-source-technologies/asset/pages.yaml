  md: '# The Application Components


    The major components associated with an Android application are as follows:


    +   - Activity: Refers to the interaction that the user has with the application
    using its screen. For example, in a media player application, the screen that
    plays, pauses, and forwards the song is an activity. It is a kind of interface
    drawn inside a window of an activity. A window can cover either the entire screen
    or float over others.


    +   - It is evident that an application can have multiple activities that can
    be loosely coupled. The main or first screen that appears as soon as you launch
    an application is known as MainActivity. When you switch to the next activity
    (screen), the previous activity is halted and stored in a stack called back-stack.
    The stack is a data structure with the last-in-first-out property. Therefore,
    on pressing the Back button, the previous activity is activated. Consequently,
    the current activity (from where the Back button was pressed) is terminated.


    +   - Services: Refers to an application component that does not have a user interface
    and runs in the background. For example, a service that is playing music or providing
    content from the background and does not appear on the screen.


    +   - Content Providers: Manages the access of contents from the central data
    warehouse. Being a part of Android application, the content provider empowers
    the UI to work with the data.


    +   - Broadcast Receivers: Many system-generated notifications, as battery low,
    downloading starts, or file received, are displayed by broadcast receivers. However,
    some applications can also stimulate broadcast receivers. an application can inform
    another application that has been downloaded and can be used by it. Broadcast
    receivers do not have a UI; however, they send a notification to the status bar
    to alert the user.


    # The Manifest File


    The manifest file is the core of Android development. It is an XML file and is
    so important to Android application that sometimes it is also known as the heart
    of the Android application. It is called AndroidManifest.xml file. A careless
    attempt to modify AndroidManifest.xml file may let you develop your application
    or reuse of the Android platform and its services. You need to get familiar with
    the Android manifest file it will help you in understanding the association between
    the lifecycle of an application and its (Android) platform.


