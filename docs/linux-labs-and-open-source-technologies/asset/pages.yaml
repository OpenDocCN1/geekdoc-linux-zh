- img_proc: true
  md: '# Appendix A


    +   - HFS and HFS+: Stands for Hierarchical File System and provides full read/write
    FAT support.

    - ISO-9660: Refers to the standard filesystem that is being used for CD-ROMs.

    - Joliet: Refers to the filesystem that was created by Microsoft and works similar
    to Rock Ridge.

    - UDF: Stands for Universal Disc Format and refers to the filesystem used for
    optical discs.'
