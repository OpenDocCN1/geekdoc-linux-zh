    # Handling SMS


    In Android, there are two techniques to send SMSs on mobile devices. These techniques
    are as follows:


    +   * Using the SmsManager class: Allows you to programmatically send an SMS

    * Using the Intent object: Allows you to use the built-in messaging application
    to send an SMS


    Let''s start by explaining on the SmsManager class, which allows you to programmatically
    send an SMS. You should invoke the getDefault() method of the class instead of
    instantiating the class. The invocation of the getDefault() method returns the
    SmsManager object, which can be used to invoke the sendMessage() method. When
    this method is invoked, the SMS is sent to the specified recipient. This method
    accepts the following arguments:


    +   * destinationAddress: Represents the phone number of the recipient to whom
    the SMS needs to be sent

    * serviceCenterAddress: Represents the address of the service center to be used
    to send the SMS. You can specify the value of this argument as null if you want
    to use the default SMSC

    * message: Represents the body of the message to be sent

    * sentIntent: Represents the PendingIntent to be invoked after sending the message.

    * deliveryIntent: Represents the PendingIntent to be invoked after the message
    has been delivered.


    The following code shows the use of the SmsManager class to send text messages:


    ```

    sms_manager = SmsManager.getDefault();

    sms_manager.sendDataMessage(destination_address, sc_address,

    data,port,

