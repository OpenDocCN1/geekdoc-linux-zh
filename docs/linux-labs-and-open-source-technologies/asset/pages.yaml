    # ## 2.5 Installation of Linux


    You can install Linux on a computer system in various ways. The following installation
    methods are:


    +   - CD-ROM: Installing from a set of installation CDs is the most direct method.
    Insert the media into the system and make sure the Basic Input Output Stream (BIOS)
    is configured to boot from the CD.

    - Hard Drive: Installing from the hard drive requires the ISO images of the installation
    CDs to be on a hard drive partition accessible by the installation program (formatted
    as ext2, ext3, or vfat). It also requires a boot CD created from the boot.iso
    image that is found on the first installation CD.

    - Network Install (via NFS, FTP, or HTTP): This method requires a boot CD created
    from the boot.iso image or the Preboot Execution Environment (PXE) boot. After
    booting, select a preferred network installation method, such as NFS, FTP, or
    HTTP. The installation source must be available to the system using the selected
    protocol.

    - Kickstart: Kickstart is the name of the Red Hat scripted installation method.
    After a kickstart-formatted script is written, the installation program is started
    with a boot CD or PXE and then given the location of the kickstart file.


