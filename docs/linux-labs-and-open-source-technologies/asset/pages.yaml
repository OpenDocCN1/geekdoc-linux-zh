  md: '# Lab 8


    **Objectives:** To configure Linux FTP server versus VSFTPD.


    +   i. Set up anonymous access of FTP server.

    ii. Enable individual logins and add FTP users with read-only access.

    iii. Transfer files.


    **Solution:** The File Transfer Protocol (FTP) is an established protocol to copy
    files between servers over the Internet. In FC-6 or RHEL-5, you can use the FTP
    program as it is designed to be stable, fast, and scalable.

    FTP relies on a pair of TCP ports. It operates using two TCP ports 20 and 21.
    Port 21 is known as control port. All commands and the response of the FTP server,
    go over the control port. Port 20 is known as data port that for all subsequent
    data transfers between the client and server. The FTP server is used to download
    a file from the server or upload a file to the server. It is a software that runs
    the File Transfer Protocol (FTP) and transfers files over the internet. The FTP
    server is the secure way of sharing files with the help of a client-server model.
    A popular, and very secure, FTP server available for almost all Linux systems
    is vsftpd (Very Secure FTP). Installing and setting up vsftpd in a Linux environment
    is simple process.

    A FTP server attempts to configure you to accept requests from users who have
    an account on the system running the FTP server (User Access FTP). Alternatively,
    you can configure the FTP server to accept requests from anyone, with the help
    of service known as anonymous FTP.


    # Anonymous FTP


    Anonymous FTP is the selection of Web sites that need to exchange files with numerous
    unknown remote users. Users can log in as a user ftp or as a user anonymous to
    get access to the ftp site. By default the root directory of anonymous ftp server
    is set as /var/ftp/pub. It only allows downloads to the anonymous user by default.


    # User Access FTP


    Users with account on the system can connect via ftp and login using their username
    and password. They can download any file and also can upload file to any directory
    on FTP server, provided they will have write access to that directory


    # Configuration Files of FTP Server (vsftpd daemon)


    The examples of configuration files are as follows:


    ```

    Package: vsftpd

    Daemon: /usr/bin/vsftpd

    Script: /etc/init.d/vsftpd

    configuration: /etc/vsftpd/vsftpd.conf, /etc/vsftpd.ftputers

    /etc/pam.d/vsftpd

    Log: /var/log/xferlog

    ```'
