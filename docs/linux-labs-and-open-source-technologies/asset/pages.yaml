    You can use the jobs command to know about currently running jobs, as shown here:


    ```

    $ jobs vim

    [1]+ Stopped xterm &

    [2]- Running xterm &

    ```


    The preceding command shows that there are two programs running—the first one
    is vim, which is temporarily stopped; the second one is xterm, which is running
    in the background. To kill a job, you can use the title of the program along with
    the kill command. Usually, the kill command is used with a PID, which you can
    find using the ps command. For example, the following command kills a program
    that has 16533 as its PID number:


    ```

    $ kill 16533

    ```


    You can kill a program by providing its job number with the percentage (%) symbol,
    as shown in the following:


    ```

    $ kill %1

    ```


    The preceding command does not kill the program immediately if it is suspended—it
    kills it as soon as the program gets active. When you need to kill a program forcefully,
    use the -9 flag along with the kill command, as shown here:


    ```

    $ kill -9 %1

    ```


