  md: '# Copying Files with cp


    You can copy files by using the syntax:


    ```

    cp [options] source-file destination-file

    ```


    You can copy multiple files into a directory by using the syntax:


    ```

    cp files directory

    ```


    Common options used with cp command are:


    +   -f: overwrites the destination files

    -i: prompts you before overwriting [y]

    -a: copy the contents of directories recursively


    # Examples of cp command


    Copy /etc/smb.conf to the current directory:


    ```

    $ cp /etc/smb.conf.

    ```


    Create an identical copy of a directory called work, and call it work-backup:


    ```

    $ cp -a work work-backup

    ```


    Copy all the GIF and JPEG images in the current directory into images:


    ```

    $ cp *.gif *.jpeg/

    ```


    # Moving Files with mv


    You can rename files or directories, or move them to different directories using
    the mv command. This command is used with the following options:


    +   -f: overwrites the destination file, even if target already exists

    -i: asks user interactively before overwriting files


    For example, to rename poetry.txt to poems.txt, the command is:


    ```

    $ mv poetry.txt poems.txt

    ```


    To move the content of the current directory at some other location, the command
    is:


    ```

    $ mv * /old-stuff/

    ```'
