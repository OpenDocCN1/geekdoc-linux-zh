  md: '# Parsing Data


    To parse the Web data, you need to use the sed and grep commands along with lynx.
    For example, the following code parses the data:


    ```

    $ lynx -dump -nolist http://www.somewebsite.com/samplewebpage.html

    | |

    grep -o "Rank-.*" | | |

    sed -e ''/Rank-\[([0-9]*\\]\(.\)\*/\1\/2/'' | |

    sort -nk 1 > samplefilelist.txt

    ```


    In the preceding code, the lynx command represents a command-line Web browser.
    The dump option creates a text version of the website. The -nolist option inserts
    numbers automatically with each link. Then, the sed command is used to parse and
    format the text.


    # Working with cURL


    cURL is a command that supports protocols, such as Hyper Text Transfer Protocol
    (HTTP) and File Transfer Protocol (FTP). It supports various types of Web related
    features, such as cookies, authentication, user agent string, extra headers, limit
    speed, maximum file size, and progress bar. The following command dumps the downloaded
    file on the terminal window:


    ```

    $ curl URL

    ```


    If you want to prevent the curl command from displaying the progress information,
    use the following command:


    ```

    $ curl -silent

    ```


    The cookies option given along with the curl allows the storing of cookies:


    ```

    $ curl http://examplewebsite.com --cookie "user=abc;pass=admin"

    ```


    With this, we come to the end of this chapter. Let''s summarize the main points
    covered in this chapter.


    # Summary


    In this chapter, you have learned about shell programming. A shell is a program
    that interprets the commands that you type at a command line interface. Shells
    are interactive, that they accept commands from the user and execute them. This
    chapter also explains bash scripting and how to execute a script. Next, you have
    learned about variables, control structures, and signals and functions. After
    that, you have learned about sed and awk commands. Finally, you have learned how
    to work with Web using shell script, how to download a Web page as a formatted
    text file, how to parse data, and how to work with cURL.'
