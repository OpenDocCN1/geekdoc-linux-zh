    # 6.4 Security Assessment: OpenVAS


    Open Vulner Assessment System (OpenVAS) is free software that provides various
    services and tools for vulnerability assessment. Vulnerability refers to weakness
    or flaw in a system. It allows an attacker to cause undesirable operations or
    gain unauthorized access. If a system is vulnerable, it can face threats to the
    user identity and data. It is always advisable to assess the vulnerability of
    the system. Vulnerability assessment is a process that can identify, enumerate,
    and rank the vulnerabilities in a system or network in order to patch them. Basically,
    it is concerned with the security of the system resources. A vulnerability assessment
    works in the following way:


    +   1. Classifies the system resources

    2. Allocates the enumerable values to the classified resources

    3. Detects the possible threats (vulnerabilities) in each resource

    4. Eliminates the vulnerabilities on the priority basis


    OpenVAS is a framework that is licensed under the GNU General Public License (GNU
    GPL). . It is based on client-server architecture that works on the basis of OpenVAS
    Transfer Protocol (OTP), OpenVAS Management Protocol (OMP), and OpenVAS Administrative
    Protocol (OAP).


    Figure 2 shows the architecture of OpenVAS:


    ![](img/889a483c5a60e0806e42b73b2662a855_183_0.png)


    ▲ Figure 2: OpenVAS Architecture


    OpenVAS architecture has the following categories:


    +   - Clients: OpenVAS CLI and Greenbone Security Assistant (GSA) are interfaces
    available for clients.'
  merge: -1
  pgno: 183
- img_proc: true
  md: 'Services: OpenVAS Scanner and OpenVAS Manager are services that actually perform
    the task of scanning of host machines on network for Network Vulnerability Tests
    (NVTs).


    Data: NVT''s results and configs are data used in the process of scanning of host
    machines.


    The OpenVAS architecture has the following components:


    +   - Scan Targets: Specifies target machines on network whose scanning will be
    performed by OpenVAS Scanner.


    +   - OpenVAS Scanner: Performs Network Vulnerability Tests (NVTs) on a regular
    basis.


    +   - OpenVAS Manager: Controls the functioning of OpenVAS scanner through the
    OPT protocol and itself offers XML-based OMP protocol. It also controls an SQL
    database for central storage.


    +   - Greenbone Security Assistant (GSA): Provides a browser-based interface for
    the application.


    +   - OpenVAS CLI: Refers to a command line interface or tool, which allows creating
    batch processes to drive OpenVAS Manager.


    +   - NVTs: Specify test routines that can check for the presence of vulnerability
    on a target system.


    +   - Results and Configs: Specify the scanned results and configurations in the
    central SQL database, which are controlled by OpenVAS Manager.


    After learning OpenVAS, let''s next learn about another open source tool, called
    Eclipse IDE.


    # 6.5 Working in Eclipse IDE


    Eclipse is an open source community that provides an open source development platform.
    This platform comprises various tools to build, deploy, and run C, C++, or Java
    applications. Eclipse also provides a plug-in mechanism to add other functionalities
    in Java, Web, or Enterprise projects, such as Struts and JSF, by using a third
    party plug-in. The Eclipse software development kit (SDK) provides the Eclipse
    Development Tools (JDT), an Integrated Development Environment (IDE) with a built-in
    Java compiler, and Java source files. The Eclipse JDT helps you to create Java
    applications, and the Eclipse IDE provides advanced features, such as refactoring
    and code merge.


    +   - Overview of the Eclipse Platform


    Eclipse is a multi-language software development platform comprising an IDE and
    a plug-in system to add other functionalities. The Eclipse platform provides a
    common platform to all the developers; however, it can be customized by installing
    and creating new plug-ins depending on the requirements of your project. You can
    build Web and enterprise applications with the help of tools provided by Eclipse
    as well as add plug-ins to enhance the functionalities or capabilities of external
    frameworks in a project.'
