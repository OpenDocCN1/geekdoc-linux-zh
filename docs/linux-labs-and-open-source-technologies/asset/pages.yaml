  md: '# Setting up a Cache-Only DNS Server


    In case of the DNS server, the cache-only server is the default setting. The function
    of this type of DNS server is to store recent requests for websites for a specific
    period of time, called Time to Live (TTL) to get a quick access to the requested
    website. For example, a client requests for the home page of www.youtube.com website.
    When the server is served for the first time by the Internet Service Provider
    (ISP) name server, the local cache-only DNS server stores the information of this
    page for a specific period of time. Now, the next client from the network requests
    for the same home page, the local caching server will respond and provide the
    home page quickly.


    To configure a cache-only DNS server, you need to install the Berkeley Internet
    Name Domain (BIND) service. The BIND service is used to offer DNS services on
    Red Hat Linux.


    Perform the following steps to set up a cache-only DNS server:


    +   1. Open the terminal, and install the BIND service by using the following
    command:


    ```

    yum -y install-bind

    ```


    +   2. Open and configure the /etc/named.conf file by using the following command:


    ```

    vi /etc/named.conf

    ```


    +   3. Restart the DNS server by using the following command:


    ```

    service named start

    ```


    +   4. Configure the firewall rules for permitting DNS traffic.


    +   5. Test the DNS server by using the following command:


    ```

    dig redhat.com

    ```


    Let us now to set up a primary name server


    # Setting up a Primary Name Server


    As already in any operational domain, generally two types of DNS servers are configured,
    one is called a primary name server (ns1) and the other is called a secondary
    name server (ns2). These servers are configured to avoid DNS failure; if one gets
    the first server goes down, the other server becomes an active DNS server. All
    DNS entries for a particular domain are added in the primary name server, while
    the secondary server is just used to work in coordination with the primary server.


    Let us take dummiesite.com domain as an example and configure the primary name
    server for this domain. You need to perform the following steps to set up a primary
    DNS server:


    +   1. Make sure the BIND package is installed on your host computer.


    +   2. Open the /etc/named.conf file, and make sure that the following parameters
    are included:


    +   • directory is to /var/named'
