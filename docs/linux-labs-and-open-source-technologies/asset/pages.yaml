    # 7.12 Publishing Android Applications


    Publishing is the last phase of development of an Android application. However,
    there are important steps, such as development, debugging and testing, that you
    need to follow before publishing or releasing the Android application. In other
    words, the Android application is first developed, debugged, tested, and finally
    released. Note that you cannot publish your application directly. You must sign
    it with a private key before you can publish it.


    The process of publishing is completed in two steps. In the first step, the application
    is prepared for release, and in the second step, the application is released for
    the users.


    In the preparing phase, you configure, build, and test the release of your application.
    The configuration process involves the cleaning of the code and elimination of
    garbage values. The building process comprises the development of the project
    by using Java Development Kit (JDK) and Software Development Kit (SDK). Finally,
    you test your application on at least one real device related to your target API.
    As soon as you complete these steps, your application is'
