  md: 'In addition, CVS allows multiple users to edit a file simultaneously by making
    their own separate copies of the file. Then, it merges all the changes in the
    file when you use the commit or update commands. Some of the commonly used commands
    in CVS are provided as follows:


    +   - commit: Submit your changes to the repository

    - update: Takes input of new files from repository and keeps the working directory
    up-to-date

    - checkout: Sets a local directory as working directory with the repository

    - import: Imports the files in your current working directory in RCS


    Setting a CVS system is similar to that. Here you also need to create a repository
    directory. Using the following command to create a repository directory on the
    shared file system:


    ```

    % mkdir repository_directory

    ```


    Make sure directory is writable by the group. Use the following command to give
    writable access to the repository by the entire group:


    ```

    % chmod g+w repository_directory

    ```


    If the members are in different groups, you may have to use the a+rw combination
    of permissions instead of g+w.


    Now, to set up your own copy, you need to check out the repository. This action
    downloads a copy and sets up the server path. The following command checks out
    a copy of the remote directory to your local working directory:


    ```

    % cvs -d :user@hostname:absolutePath/to/cvsroot co directory

    ```


    Unlike RCS that uses two command and for check-in and check-out purposes, CVS
    uses only one command, however, it is followed by update and commit commands,
    frequently. An example of using the CVS command is as:


    ```

    % cvs checkout tc

    ```


    This command creates a new directory tc and populates it with the source files.
    Table 2 describes a list of CVS commands:


    # Table 2: Commonly Used CVS Commands with their Operations


    | Command | Operation |

    | --- | --- |

    | % cvs -d :remoteCvsRoot co dirPath | Checks out the files in dirPath under the
    remoteCvsRoot path in the remote user@host''s login account |'
