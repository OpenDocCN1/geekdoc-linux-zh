    \ File**\n\n# ## Time to Live Value\n\nThe first entry in a zone file is usually\
    \ the time to live (TTL) value. Caching DNS servers cache the responses to their\
    \ queries to authoritative DNS servers. The authoritative servers provide not\
    \ only the DNS answer but also the information's time to live, which is the period\
    \ for which it is valid.\n\nThe purpose of a TTL is to reduce the number of DNS\
    \ queries that the authoritative server has to answer. If the TTL is set to three\
    \ days, then caching servers use the original response for three days before making\
    \ the query.\n\n# ## DNS Resource Records\n\nThe rest of the records in a zone\
    \ file are usually BIND resource records. They define the nature of the DNS information\
    \ in your zone files that is presented to querying DNS clients. They all have\
    \ the following format:\n\n```\n(name) ttl addr-class Record Type Record-specific\
    \ data\n```\n\nIn the preceding format, the first field is the name of the domain\
    \ record, the second field is an optional TTL field, the third field is the address\
    \ class, the fourth field specifies the type of record record (RR), and the last\
    \ field contains dependencies on the type of RR.\n\n# ## Name Class Type Data\n\
    \nThere are different types of records for mail (MX), forward lookups (A), reverse\
    \ lookups (PTR), aliases, and zone definitions (SOA). The data is formatted according\
    \ to the record type and may consist of several values separated by spaces. Similarly,\
    \ the name is also subject to interpretation based on this factor.\n\n# ## The\
    \ SOA Record\n\nThe first record is the Start of Authority (SOA) record that contains\
    \ general administrative and control information about it. It has the following\
    \ format:\nName Class Name-Server Email-Address Serial Number Refresh Expiry Minimum-TTL\n\
    \n```\n@ SOA nsl.spit.ac.in. hostmaster.spit.ac.in. ( \n      2004108001 : serial\
    \ #\n      4H : refresh\n      1H : retry\n      1W : expiry\n      1D ) : minimum\n\
    ```\n\nWe now learn how to set up a cache-only DNS server in the following section."
