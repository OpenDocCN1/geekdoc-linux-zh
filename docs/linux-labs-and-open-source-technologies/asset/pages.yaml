    to know their locations. An example of using the which command is as follows:


    ```

    $ which passwd cat ls open grep

    ```


    The preceding command will display the location of the passwd, cat, ls, open,
    and grep commands.


    # 2.9 Piping and Redirection


    In CLI, every program automatically has three connected streams. These streams
    are:


    +   - STDIN (0): Specifies standard input that helps in data feeding


    +   - STDOUT (1): Specifies standard output that helps in displaying or printing
    the program’s data


    +   - STDERR (2): Specifies standard error for displaying error message


    The concept of piping and redirection helps in connecting these streams between
    programs and to direct data in useful ways. A pipe is a form of redirection that
    is used in Linux operating systems to send the output of one program to another
    for further processing. On the other hand, redirection is the transferring of
    standard output to some other destination, such as another program, a file, or
    a printer, instead of the display monitor (which is its default destination).


    A pipe is designated in commands by the vertical bar character.'
