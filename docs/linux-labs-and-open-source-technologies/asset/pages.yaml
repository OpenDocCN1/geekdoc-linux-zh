    # Q3. What is the FTP server?


    Ans. The FTP server is a software application that runs FTP and transfers files
    over the Internet. It is used for either downloading a file from the server or
    uploading a file to the server. An FTP server authenticates users that request
    to use it. You can configure your FTP server to accept requests only from the
    users who have an account on the system running the FTP server. Alternatively,
    you can configure the FTP server to accept requests from anyone with the help
    of a service known as anonymous FTP. The FTP server provides a secure way of sharing
    files by using the client-server model.


    # Q4. What is SSL?


    Ans. The SSL protocol is a set of rules that govern server authentication, client
    authentication, and encrypted communication between servers and clients. It was
    created by Netscape to ensure secure transactions over the Internet. SSL requires
    a server SSL certificate so that the server sends this certificate to the client
    to authenticate the server''s identity. This authentication process uses the public-key
    encryption and digital signatures to confirm that the connection established between
    the server and a client is trusted.


    # Q5. What is GNU Privacy Guard?


    Ans. The GNU Privacy Guard (GPG) is a GNU''s tool used with Web to protect email
    communication and data storage over the Internet. It can also encrypt and decrypt
    files with a password so that the files can be transported securely. The gpg command
    is used to encrypt data with password and create digital signatures. To encrypt
    and decrypt files with a password, you need to use the following command:


    ```

    $ gpg -- filename

    ```


    # Q6. What is the purpose of the NAT and mangle tables?


    Ans. The Network Address Translation (NAT) is used to alter packets that create
    a new connection. On the other hand, the mangle table is used for specific types
    of packet alteration.


