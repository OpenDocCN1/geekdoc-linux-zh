  md: '# Steps to Install and Configure the FTP Server


    Perform the following steps to install and configure the FTP server (vsftpd daemon):


    # Installing the VSFTPD Daemon


    Search for the file .rpm extension. (Check with Linux distribution CD or DVD)

    Type the following command to install the FTP server:


    ```

    -[root@netmon tmp]# rpm -ivh vsftpd-1.5.6-i386.rpm

    ```


    # Starting the VSFTPD Daemon


    Use the following commands to start, stop, and restart VSFTPD after booting:


    ```

    [root@netmon tmp]# service vsftpd start

    [root@netmon tmp]# service vsftpd stop

    [root@netmon tmp]# service vsftpd restart

    ```


    Use the following chconfig command to start VSFTPD at boot time:


    ```

    [root@netmon tmp]# chconfig --level 34 vsftpd on

    ```


    # Testing the Status of VSFTPD


    You can always test whether the VSFTPD process is running using netstat command,
    which lists all the TCP and UDP ports on which the server is listening for traffic.
    The succeeding example shows the output shown in Figure 4:


    ```

    [root@netmon root]# netstat -a | grep ftp|tcp|grep :21

    ```


    | Ele Edit View Terminal Tabs Help |

