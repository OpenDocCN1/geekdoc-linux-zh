    Let us know about DHCP servers.


    # 4.5 DHCP Servers


    The DHCP protocol automatically assigns IP addresses and other network configuration
    information, such as subnet mask and broadcast address, to computers on a network.
    A client configured for DHCP sends a broadcast request to the DHCP server, requesting
    an address. The DHCP server then issues an IP address for a lease period. The
    time of a valid lease can be specified on the server. DHCP reduces the amount
    of time to configure clients and allows you to move a computer to various networks,
    which can be configured with the appropriate IP address, gateway and subnet mask.
    DHCP servers may assign a static IP address to any system on the network. Microsoft
    NetBIOS information is often included in the network information sent by the DHCP
    server.


    Figure 7 shows the structure of the DHCP server.


    ![](img/889a483c5a60e0806e42b73b2662a855_126_0.png)


    ▲ Figure 7: Displaying the Structure of the DHCP Server


    In Linux, to configure a DHCP server, you have to modify the configuration file,
    /etc/dhcpd.conf. In addition, the DHCP server uses the /var/lib/dhcp/dhcpd.leases
    file to store the client lease database. Let us learn some important points regarding
    configuring a DHCP server in Linux.'
