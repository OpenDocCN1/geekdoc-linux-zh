    # 2.3 Linux''s Root in Unix


    In the 1980s and the 1990s, Disk Operating System (DOS) and Windows of Microsoft
    were popular operating systems for personal computers. However, professional users
    demanded more from an operating system. They required systems that could run on
    networks, support many users at once (multiser), and run many programs at once
    (multitasking). DOS and Windows were not able to fulfill these.


    In 1990s, Unix was distributed free of cost to universities. The source code of
    Unix was open source code, which can be enhanced by developers and shared with
    others. Major computer hardware licensed the Unix source code to run on their
    computers.


    Linux was invented in 1991 by Linus Torvalds, who was a student at the University
    of Helsinki. He was working on MINIX, a Unix-like operating system for his academic
    use. The source code for MINIX is freely available, however the modification and
    redistribution of source code is not permitted. Linus Torvalds starts a project
    that later took the shape of Linux kernel. The Linux kernel was initially created
    terminal emulator, which was a program designed specifically for hardware to incorporate
    the new features in the PC. The first basic version of Kernel is 0.01, which was
    released on 25th August 1991. The second version is 0.02, which was released on
    5th October 1991, which still needs MINIX to operate.'
