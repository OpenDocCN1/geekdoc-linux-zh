  md: '# 314  Chapter 7


    ready for release. You can release your application through a marketplace, such
    as Google Play, through email, or through Web hosting.


    # Signing the Android Application


    To make an Android application trustworthy for users as well as the Google community,
    you need to sign it before release. A digital certificate is required for all
    the installed applications, and the developer who has developed such applications
    must have the private key of that certificate. The certificate is used as an identity
    of the application developer. However, the certificate does not impose any restriction
    on the installation of applications by users. Frankly, Google has not opted any
    authority to sign the certificate and therefore Android applications can use self-signed
    certificates. Some points need to be kept in mind with regard to the signing of
    Android applications are as follows:


    +   - The applications are required to be signed. Any unsigned installation will
    be rejected by the emulator or any device. The Eclipse debug key (generated by
    the Android SDK) is automatically for your applications. However, when you release
    your application to end users, you cannot use the debug key generated by the Android
    SDK to sign the application. You must have a private key to sign the application
    before releasing.


    +   - A self-signed certificate can be used to sign your application, eliminating
    the need of any authority to sign it. The Android system tests the expiry date
    of the application''s signer certificate at the time of installation. If the signer
    certificate expires after the installation, it will not affect the functioning
    of the application.


    # Exploring the Strategies for Signing the Application


    The most important point to keep in mind while signing an Android application
    is to use the same certificate for all your applications. Some reasons for using
    the same certificate are as follows:


    +   - To let users upgrade the new versions of your application seamlessly, use
    the same certificate (the one used at time of installation) at the time of the
    release of your application. If you change the certificate, however, the user
    has to install the full upgraded version of the application. In addition, if your
    certificate is changed, then you have to assign a different package for your application.
    In essence, using the same certificate implies much less data download, providing
    convenience to users.


    +   - Using the same certificate for your applications ensures that there is only
    one process assigned for all your applications in the Android system. This approach
    sustains the modularity concept as you can deploy your application in different
    modules and release separate updates for each of the modules. This is also beneficial
    for the user''s point of view, as the user can download the update only for the
    desired module.


    +   - Preference to the same certificate also provides reliable exposure of data
    to other applications that are signed with a specified certificate. Your application
    is secured for any kind of data sharing with a third-party application.'
  merge: -1
  pgno: 331
