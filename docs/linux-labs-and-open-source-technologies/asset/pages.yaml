    # 3.10 Common Management Tasks


    The Linux kernel is a bundle of instructions that ties the system together. When
    you need to find your current kernel, you have to check the /boot/ directory,
    as follows:


    ```

    ls /boot

    ```


    If the /boot directory is empty or not exist, then your kernel is outside the
    instance. Otherwise, you get a list of names, such as ''grub'', ''vmlinux'', and
    ''System.map''. The kernel itself is the ''vmlinuz'' file. Grub boot loader tells
    the system which kernel to use. It displays a menu at boot time if your computer
    has a choice of more than one kernel available. Grub gets this information from
    the menu.lst file as follows:


    ```

    default=0

    timeout=5

    title-kernel 2.6.32-25

    root (hd0)

    kernel /boot/vmlinuz-2.6.32-25-server console=root=/dev/xvda1

    initrd /boot/initrd.img-2.6.32-25-server

    ```


    In the preceding code, the default entry tells kernel to be selected for the boot
    process. The default value, 0, indicates the first listed kernel. The timeout
    label tells how to wait for someone to use the menu booting the default kernel.
    The value is specified for this five seconds. The title label provides the kernel
    description. The root line specifies the disk partition holding the kernel. It
    should be hd0. The kernel line specifies the kernel file. Finally, the initrd
    line specifies the initial RAM disk to help the system boot.


    If you want to install another kernel, you just need to add a new entry in the
    /boot/grub/menu.lst file.


    With this, we come to the end of the chapter. Let''s recap the main topics covered
    in this chapter.'
