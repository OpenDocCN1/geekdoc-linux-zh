  md: '# Chapter 5


    # Using the gawk command


    The gawk command allows you to search through files and modify records in these
    files on the basis of some patterns. The basic syntax of the gawk command is as
    follows:


    ```

    awk ''script'' files

    ```


    In this syntax, files is a list of one or more files, and script is a set of one
    or more commands in the form of the following actions:


    ```

    /pattern/ { actions }

    ```


    In this syntax, /pattern/ is a regular expression, and { actions } represents
    one or more commands.


    An example of using fields with the gawk command is as follows:


    ```

    $ gawk ''{ print }'' students_marks.txt

    ```


    | Id | Name | Marks |

    | 101 | Gauransh | 99 |

    | 202 | Shilpa | 95 |

    | 303 | Nikita | 80 |

    | 404 | Neha | // |

    | 505 | Charu | 80 |


    This example will print each line of the input. It should be noted that the semicolon
    (;) symbol is used after the print command to instruct the shell that the command
    is concluded.


    Another feature of the gawk command is that it automatically divides input lines
    into fields. A field is a set of characters, which are separated by characters.
    The default separators are tab and space. An example of using fields with the
    gawk command is as follows:


    ```

    $ gawk ''{ print $1 $3 ; }'' students_marks.txt

    ```


    | Id | Marks |

    | 10199 | 99 |

    | 20295 | 95 |

    | 30380 | 80 |

    | 40477 | // |

    | 50580 | 80 |


    The preceding command will display the first and third fields of every input line
    of the students_marks.txt file. However, there is no separator between two fields,
    Id and Marks. Now, use the following command:


    ```

    $ gawk ''{ print $1, $3 ; }'' students_marks.txt

    ```'
