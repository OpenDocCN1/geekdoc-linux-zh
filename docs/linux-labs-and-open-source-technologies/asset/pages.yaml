    # Absolute Path vs Relative Path in Linux


    In technical terms, a path is a unique location to a file or folder in a file
    system of an operating system. It uses the / symbol along alpha-numeric characters.
    There are two types of paths that can be found in Linux or Unix operating systems:


    +   - Absolute path: A path that specifies the location of a file or directory
    from the root directory (/). Some examples of absolute path are:


    ```

    /var/ftp/pub

    /etc/samba.smb.conf

    /boot/grub/grub.conf

    ```


    +   - Relative path: A path related to the working directory (pwd). Suppose you
    are working in the /usr/mydatada directory and want to change to the /user/mydata/pictures
    directory. To do this, use this relative path and type the cd command, as shown
    in the following command:


    ```

    pwd

    /usr/mydatada

    cd pictures

    ```


    In the preceding command, you can see that there is no / before pictures, which
    indicates it is a relative directory in the user who is currently working.


    # Working with Files


    A file is a collection of data items stored on the hard disk. In Linux, programs,
    text, and images, are all referred to as files. Files are arranged in a hierarchical
    directory structure. As a system administrator, you need to perform certain operations,
    such as mounting and unmounting a filesystem and managing a filesystem on various
    storage media such as DVDs and CDs. Files are stored in storage media devices
    such hard disk or floppy disk.


    A filename always has an extension, beginning with a dot. An extension indicates
    the type of the file. On Linux, file extensions are entirely a matter of convention,
    the operating system itself ignores them. Only a few specific programs use extensions
    to identify the type of a file.

