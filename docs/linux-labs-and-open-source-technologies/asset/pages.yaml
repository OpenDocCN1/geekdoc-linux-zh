    Then, which file permission you will get, and why?


    Ans. The Linux file system is organized in a hierarchical structure, with the
    parent or the root directory at the top of the hierarchy. The root directory is
    represented by a forward slash (/). Whenever you open a file in Linux, you start
    from the root directory to the subdirectories where the file is located. Linux
    uses forward slash to represent the directory and file structure. In addition,
    there are no drives named C: or D: in Linux. Linux follows the Filesystem Hierarchy
    Standard (FHS) to define'
