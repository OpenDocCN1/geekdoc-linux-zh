  md: '# 7.4 Setting Up the Android Environment


    The functionality to develop and run Android applications in Eclipse is a result
    of not only Java, but also the inclusion of the ADT plugin in it. Several tools
    and features are available in Eclipse after the addition of the ADT plugin. The
    ADT provides Graphical User Interface (GUI) accessibility to command line tools
    and also the designing of the UI.


    # The Java Perspective Using Eclipse


    The Java perspective in Eclipse lets you access the associated Java libraries
    that are to be used with the Android applications in the Eclipse IDE. The Java
    perspective in Eclipse consists of the following views:


    +   - Explorer: Displays the full view of the project in a hierarchy

    - Task List: Displays the available tasks associated with the project

    - Java Class Pane: Displays the body of the Java class

    - Outline: Displays the internal outline of files, such as Java and XML


    In essence, the Java perspective is the interface where you can develop Android
    applications using Java''s native libraries. However, the Dalvik Debug Monitor
    Server (DDMS) perspective, which is powered by ADT, provides many functionalities
    than the Java perspective.


    Let''s discuss the DDMS perspective of Eclipse in the next section.


    # The DDMS Perspective


    The DDMS perspective in Eclipse provides the full functionalities of the DDMS
    features inside the Eclipse IDE. The following features of DDMS are present in
    Eclipse:


    +   - Devices: Refer to the real or physical devices and AVDs attached to the
    application

    - Emulator Control: Refer to the control used to create a replica of a device

    - LogCat: Refer to a view in which log messages are displayed in real time

    - Threads: Refer to the currently running thread in a virtual machine

    - Heap: Repeats the heap structure of a virtual machine

    - Allocation Tracker: Displays the memory allocation of an object

    - File Explorer: explores the file system of a device


    To enable the DDMS perspective in Eclipse, select Window→Open Perspective→DDMS
    or Window→Open Perspective→Other→DDMS, from the menu bar.


    # Command-Line Tools


    Command-line tools provide an alternative that can be used in place of Eclipse
    IDE for developing Android applications. To use these tools, you require the Android
    SDK and the applicable APIs.


    Let''s first set the environment variables to work with the command-line tools.'
