    # ## 3.1 Introduction


    A system administrator is someone who maintains and operates a computer system.
    The tasks performed by a system administrator are wide-ranging, and can differ
    from organization to organization. Some common tasks include the backup of files,
    installing new programs, and creating accounts for users. System administrators
    working with Linux handle different tasks such as installing hardware devices,
    configuring application software (the Open Office suite) and upgrades, managing
    files and directories, creating user accounts, backing up and restoring files,
    installing software package management, and managing memory.


    Linux is a multitaskier operating system. A multitaskier system is simple in which
    several users can have their accounts and work on them simultaneously. As a system
    administrator, you can assign each user his/her own login account. Similarly,
    the multitasking feature of Linux allows you to schedule and execute multiple
    tasks (programs) simultaneously. In addition to this, Linux allows you to manage
    processes, users, groups, etc.


    In this chapter, you learn about the tasks performed by a system administrator.
    The chapter starts by explaining process and job management tasks. It explains
    the procedure to mount devices and file systems. You also learn the procedure
    of taking a backup and restoring data. In addition to this, you learn to work
    with users and groups, and specify permissions to them. The chapter also explains
    software management on Linux. Toward the end, the chapter describes the booting
    process as well as common kernel management tasks.'
