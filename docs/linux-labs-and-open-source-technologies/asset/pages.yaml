  md: '# Basic Drupal Components


    Let''s learn about components of Drupal. Some of these are as follows:


    +   - Page: Specifies a Web page in Drupal. A page can be divided into different
    regions. These regions are actually blocks of information. Each block of information
    is a node, and the page itself is a node.


    +   - Node: Specifies a unit of information called data, which is stored in a
    database with a unique identifier. A node can be a page, a blog post, or a news
    article.


    +   - Content Type: Specifies a combination and arrangement of related fields.
    Each content has a title and several other fields, such as body, date, and URL
    fields.


    +   - Modules: Specify functional plugins that provide specialized functionalities
    to Drupal.


    +   - Roles: Specify account types of users. Roles define what pages and features
    a specific user type can see or use. They are assigned by the site administrator,
    who grants permissions to users to access content given on the website.


    +   - Themes: Specify pre-defined layouts for a site. These layouts contain different
    fonts, color combination, and other design elements, which control regions and
    blocks on pages.


    +   - Regions: Specify areas on a Web page, which allow you to place your content
    on the page.


    +   - Blocks: Specify a collection of content, for example, a menu, which may
    be placed into a region. The default menu is located in the sidebar region. Blocks
    are easily moved from region to region.


    +   - Taxonomy: Specifies a label or tag that you create and assign to a node
    or content type.


    # Installing Configuring Drupal


    You can install Drupal on a Windows server, a Macintosh server, or Linux-based
    servers. Before installing Drupal, you need to install the following software
    programs on your system:


    +   - A Web server: It is used for hosting the files. Examples of Web server are
    Apache or Internet Information Server (IIS).


    +   - PHP: It is the programming language used by Drupal.


    +   - Relational Database Server: It is used for storing data. Examples of relational
    database server are MySQL or PostgreSQL.


    +   - FTP (File Transfer Protocol): It is used for uploading files on the server.


    To install Drupal, you need to perform the following steps:


    +   - Download the current version of Drupal from http://drupal.org


    +   - Extract the Drupal installation package


    +   - Copy the files of extracted folder to your Web server''s root directory


    +   - Create the database that you want to use for your Drupal website


    +   - Launch the Drupal installation script'
