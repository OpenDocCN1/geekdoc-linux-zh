  md: '# Open Source Operating System 49


    The general syntax for using pipes is:


    ```

    command_1 | command_2 [ | command_3 . . ]

    ```


    This chain can contain any number of commands or programs. An example of using
    the pipe symbol is as follows:


    ```

    ls -l /dev | wc

    ```


    The preceding example will display the number of files in the dev directory. Actually,
    wc counts the number of lines, words, and characters in the standard input. And
    if -l is used with the command, wc will count the lines only, which is the number
    of files in a directory.


    Redirection means transferring the output from a file, command, program, or script
    to another file, command, or script. The greater than (>) symbol is used for redirection.
    The following command is an example:


    ```

    ls samplefile.txt

    ```


    The preceding command redirects the output of the command (STDOUT) to the file
    name ''samplefile''.


    Let us consider another example of command, which is as follows:


    ```

    grep some_word <samplefile

    ```


    The preceding command filters out the lines, which contain the searching word.
    It will search the word that you type from your keyboard. However, you can provide
    the content from a file by using the following command:


    ```

    grep some_word <samplefile

    ```


    You can also redirect both input and output in the same command, as shown in the
    following command:


    ```

    cat samplefirstfile >samplessecondfile

    ```


    In the preceding command, the content of the samplefirstfile is copied to the
    samplessecondfile.


    Moreover, you can redirect the STDERR channel using (2>), as shown in the following
    command:


    ```

    grep some_word <sampleinputfile >sampleoutputfile 2>sampleerrorfile

    ```'
