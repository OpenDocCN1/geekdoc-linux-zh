  md: '# # Introduction


    Congratulations on buying the Linux Labs and Open Source Technologies book! This
    book contains comprehensive content on the various concepts related to open-source
    software and tools.


    Open source means something that can be modified because its design is publicly
    accessible. Linux Labs and Open Source Technologies commonly refer to those software
    that use an open development process and is licensed to the source code. They
    are different from proprietary software, or closed source software, which cannot
    be modified by anyone the person, team, or organization who created it and maintains
    exclusive control over it.


    Many people and companies are preferring the use of open-source software, because
    they can have more control over the software. They can easily examine and modify
    the code to make sure it''s not denying what they don''t want to.


    Some people consider open source software as more secure and stable than proprietary
    software, because errors are easily visible in open-source software; therefore,
    they are fixed rapidly. And because the open source is distributed publicly, so
    users who rely on software for critical tasks can be sure that this software won''t
    disappear or fall into despair if their original creators stop working on it.


    The book is the result of rich implementation of instructional acumen and technical
    precision of the authors and editors at Kogent Learning Solutions Inc. and Dreamtech
    Press. It promises to be a resourceful book for students and IT professionals
    who want to do well in the open-source technologies domain domain.


    This book extends our philosophy to present comprehensive and easily understandable
    reference material on open-source technologies. The book has been written considering
    the diverse audience of the open-source and free software and it promises an exceptional
    learning experience by presenting relevant, appropriate, and real-life examples.
    In addition, the book also includes commands, figures, snippets and executable
    examples to demonstrate the implementation of various open-source software and
    tools.


    We have designed this book to provide the relevant reference material you need
    as you move towards software proficiency. The influence of open-source technologies
    is spreading fast, and this is only bound to grow. We hope that your learning
    experience with this book will prove as to you as it has proved to us while authoring
    and editing it.'
  merge: -1
  pgno: 14
- img_proc: true
  md: '# About this Book


    Linux Labs and Open Source Technologies extends the approach of providing comprehensive
    reference material on new IT technologies. The book goes beyond just providing
    simple descriptions on features and code examples to ensure that it caters to
    the everyday real-life challenges faced by developers. The range of topics covered
    by this book is a superior mix of about concepts related to open-source software,
    with all relevant details and practices to implement them. Empowered with exclusive
    technical details and precision, the book promises to provide you with all the
    required knowledge and functional skill to work with open-source software.


    Enriched with the extensive coverage and easy-to-understand examples, this book
    will serve as an indispensable resource for any developer. In brief, it will serve
    as a reference book and a tutorial to acquire the required expertise on open-source
    software.


    This book covers the following topics:

    * Overview of Open-Source Software

    * Open Source Operating System

    * System Administrator Tasks

    * Network and Security Administration

    * Shell Programming

    * Open Source Tools Used in Lab

    * Open Source Mobile Programming


    This is just an indicative list—there is a lot more inside. Linux Labs and Open
    Source Technologies gives a special coverage to the features of open-source software,
    more than any other book dedicated to the subject.


    # How to Use This Book


    The book begins with the introduction of open-source technologies and its basic
    concepts. You will be familiarized with executing Linux commands, Android programs,
    and etc. There are 7 chapters in the book that explains the concepts and features
    of open-source software.


    Finding a topic in a particular chapter is also simple. All you have to do is
    open the first page of the chapter and navigate through the list of topics displayed,
    along with their page numbers.


    # Conventions


    The books follows certain conventions for various elements. For example, the code
    explained in this book is in the form of listings, which are immediately followed
    by their output.'
