  md: '# 2.11 Use of sed


    Te command, sed, which stands for stream editor, allows you to filter and transform
    the text.

    The syntax of the sed command is as follows:


    ```

    sed OPTIONS... [SCRIPT] [INPUTFILE]...

    ```


    The sed command performs basic text transformations on an input stream, a file,
    or input

    from a pipeline.


    Table 12 lists the options that can be used with the sed command:


    | Option | Description |

    |---|---|

    | -n, --silent | Suppresses the automatic printing of pattern space |

    | -e script, --expression=script | Adds the script word to the commands for execution
    |

    | -f script-file, --file=script-file | Adds the contents of file to the commands
    for execution |

    | --follow-symlinks | Specifies that symlinks are followed during the processing
    |

    | -[SUFFIX], --in-place=[SUFFIX] | Makes a backup of a file with the addition
    of a suffix |

    | -I, --line-length=N | Specifies the desired line-wrap length, N, for the "I"
    command |

    | --POSIX | Disables the GNU extensions |

    | -r, --regexp-extended | Helps in using the extended expressions in the script
    |

    | -s, --separate | Helps in considering files as separate rather than a single
    continuous long stream |

    | -u, --buffered | Loads the minimal amount of data from the input files and flushes
    the output buffers |

    | --help | Displays a help message and then exits |

    | --version | Displays output version information and then exits |


    An example of using the sed command is printing lines that contain the string
    "7722" in a file

    as:


    ```

    cat myfile | sed -n ''/7722/p''

    ```


    Here, the sed command filters the output of the cat command. The -n option is
    used to block all the incoming lines for printing that do not contain the specified
    pattern; while the letter, p, is specified for printing.'
