    +   - This license lets you to provide warranty if you want it when you distribute
    the code of the software


    # BSD License


    Berkeley Software Distribution (BSD) is a Unix-like operating system. There are
    two types of BSD licenses: New BSD License/Modified BSD License and Simplified
    BSD License/FreeBSD License. Some features of the BSD license are as follows:


    +   - Software must be distributed with binary code or source code


    +   - This license does not allow using the contributors'' name to endorse


    # GNU General Public License


    GNU General Public License (GNU GPL or GPL) is one of the widely used free software
    license that guarantees its users to use, study, copy, modify, and distribute
    the software. This license was originally written by Richard Stallman of the Free
    Software Foundation (FSF). The latest version of GPL is 3. This license is a copyleft
    license, which means the distribution rights granted by the GPL for the modified
    versions of the work are not unconditional. It means when someone distributes
    some work with his/her modifications, the requirements for distributing the whole
    work cannot be greater than the requirements that are already there in the GPL
    license. Some features of the GPL license are as follows:


    +   - Software must be distributed with binary code or source code


    +   - This license allows licensing when run from the command line


    +   - There has to be a notification in case some changes are performed in the
    files of the original source


    +   - This license allows all derivative works under the same license


    +   - Any change in the software must be distributed in the source code form


    +   - This license lets you to explicitly charge for providing warranty, guarantee,
    or transfer of the code of the software


    +   - This license allows non-derivative works under different licenses'
