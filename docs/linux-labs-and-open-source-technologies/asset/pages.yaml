  md: '# Table 4: Description of the Lifecycle Callback Methods of an Activity


    | Method | Description |

    |---|---|

    | | and this method is invoked. The execution of this method is followed by execution
    of the `onStart()` method |

    | Restart() | Invokes when an activity is stopped and started. This method is
    always invoked after the `onStart()` method. |

    | Start() | Invokes when an activity is displayed to the user. When the activity
    is launched for the first time or brought back to the foreground, the execution
    of the `onStart()` method is followed by the `onResume()` method. However, if
    the activity becomes hidden, the invocation of this method is followed by the
    `onStop()` method. |

    | onResume() | Invokes when an activity starts interacting with a user. When this
    method of an activity is invoked, the activity is at the top of the activity stack.
    The execution of this method is always followed by the `onPause()` method. |

    | Pause() | Invokes when the system is going to resume the previous activity.
    If the activity is returned to the front, the execution of this method is followed
    by the `onResume()` method. However, if the activity has become invisible to the
    users, this method''s invocation is followed by the `onStop()` method. |

    | Stop() | Invokes when the activity is not visible to the users, which is possible
    due to two reasons. First, if the activity is destroyed, and second, when the
    processing of the other activity returns. In the first case, the invocation of
    this method is followed by the `onDestroy()` method. However, in the other case,
    this method''s invocation is followed by the `onResume()` method. |

    | onDestroy() | Invokes when the activity is destroyed. In other words, this method
    is executed either when the `finish()` method is invoked on the activity or the
    instance of the activity is destroyed by the system. |


