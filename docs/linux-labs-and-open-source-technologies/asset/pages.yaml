  md: '# Handling Signals


    Signals are software interrupts that are sent to a program to indicate the occurrence
    of some important event. For example, while running a command called ''ls -R /,
    you may hit CTRL+C to cancel the execution of command. Signals are small positive
    integers that can arrive any time during the execution of a script.


    To send signals a process, you must be aware of the currently running processes
    in your system. You can use the ps, pstree, or pgrep command to know about the
    current processes of the system. The use of these commands is as follows:


    ```

    ps aux | less

    ps aux | grep "httpd"

    pstree

    ```


    # Sending Signals to Processes


    The kill command is used to send a signal to a process. You can use the following
    command to view a list of available signals:


    ```

    kill -1

    ```


    Some predefined signals are given as follows:


    +   - SIGHUP (1): Signifies hangup on controlling the terminal or death of the
    controlling process

    - SIGINT (2): Signifies the interrupt from keyboard

    - SIGKILL (9): Signifies the kill signal for the process

    - SIGSTOP (19): Stops the running process

    - SIGCONT (18): Continues the process that was earlier stopped


    The following commands can be used to send a kill signal to a process having the
    PID number as 1234:


    ```

    kill -9 1234

    ```


    OR


    ```

    kill -KILL 1234

    ```


    OR


    ```

    kill -SIGKILL 1234

    ```


    Another command is the kill command, which can provide additional options to kill
    a process by its name, user name, group name, terminal, UID, EID, and GID.'
