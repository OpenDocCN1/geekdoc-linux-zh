    - CalendarContract.Reminders: Refers to the table that holds the alert and notification
    data of the user

    - CalendarContract.ExtendedProperties: Refers to the table that specifies opaque
    data fields accomplished by the sync adapter


    To access the read and write permissions for the Android system calendar, you
