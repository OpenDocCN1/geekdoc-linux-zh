  md: '# 128 ► Chapter 4


    The start, stop, and restart options can start, stop, and restart the firewall,
    as shown in the following commands:


    ```

    # service iptables stop

    # service iptables start

    # service iptables restart

    ```


    The -D option is used to delete firewall rules. For example, the following command
    can delete firewall rules at line number 4:


    ```

    # iptables -D INPUT 4

    ```


    The -I option is used to insert firewall rules. For example, the following command
    can insert one or more rules between 1 and 2:


    ```

    # iptables -I INPUT 2 -s 202.54.1.2 -j DROP

    ```


    Then, save firewall rules using the following command:


    ```

    # service iptables save

    ```


    The IPTables command also allows you to block an attacker IP address. For example,
    the following command blocks an attacker IP address:


    ```

    # iptables -A INPUT -s 1.2.3.4 -j DROP

    # iptables -A INPUT -s 192.168.0.0/24 -j DROP

    ```


    You can also block outgoing traffic to a particular host or domain using the host
    command. For instance, if you want to block website.com, enter the following command:


    ```

    # host -t a website.com

    ```


