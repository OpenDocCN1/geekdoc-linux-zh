    # Configuration files


    Following are the list of important configuration files on client and server side.


    Client side:


    ```

    /etc/nsswitch.conf →To determine the order in which to query name

    /etc/resolve.conf→To mention whosol your DNS server

    ```


    Server side:


    +   * /var/named/chroot/etc/named.conf→ Main DNS configuration file that list

    location and name of the zone files to be used for your desired website

    domain.

    * /var/named/chroot/var/named/... (name of the forward zone file) -> maps

    domain name to ip addresses

    * /var/named/chroot/var/named/... (name of the reverse zone file) ->

    ipaddresses to domain name.

    * /var/named/chroot/var/named/named.ca → List of 13 root authoritative

    servers.

    * /var/named/chroot/etc/rndc.key-→ File used in named authentication


    # Steps to Install and configure DNS Client


    +   1. Edit the /etc/resolv.conf file


    ```

    nameserver {ip address of DNS server}

    ```


    For example, nameserver 172.16.20.1


    Table 3: Keywords of /etc/resolv.conf:


    | Keywords in /etc/resolv.conf | Value |

    | --- | --- |

    | nameserver | IP address of your DNS name server. There should be only one entry
    per nameserver keyword. If there is more than one name server, use multiple nameserver
    lines |'
