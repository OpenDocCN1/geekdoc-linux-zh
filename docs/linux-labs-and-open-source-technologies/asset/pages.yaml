    # The RelativeLayout Layout


    The RelativeLayout allows you to position child views in relation to each other
    or to their parents. For example, if you placed a TextView control at some place
    in the layout, then in the RelativeLayout, you can align the Button (or any other
    view) to the left, right, or below TextView. In other words, you can position
    the next view in relation to the previous view or the view defined earlier. Table
    6 describes the XML attributes that are used to refer the other view in RelativeLayout:


    | Table 6: Description of the XML Attributes to Refer the Other View |

    | Attribute | Description |

    | android:layout_alignParentTop | Allows you to align the parent View at the top
    of the layout |

    | android:layout_alignParentLeft | Allows you to left-align the parent View |

    | android:layout_alignParentRight | Allows you to right-align the parent View
    |

    | android:layout_alignParentBottom | Allows you to align the parent View at the
    bottom of the layout |

    | android:layout_alignLeft | Allows you to left-align a View in the layout |

    | android:layout_alignRight | Allows you to right-align a View in the layout |

    | android:layout_alignTop | Allows you to align a View at the top of the layout
    |'
