  md: '# Network Programming Laboratory


    # Lab 1


    Objective: Study of networking commands (ping, traceroute, telnet, nslookup, netstat,
    ARP, RARP) and network configuration files.


    Solution:


    +   - Networking Commands


    Networking commands are as follows:


    +   - The ping command: The ping command stands for Packet Internet Groper and
    is used to test connectivity between two nodes, whether they are part of the Local
    Area Network (LAN) or Wide Area Network (WAN). This command uses the Internet
    Control Message Protocol (ICMP) to communicate with other devices. When you need
    to ping the hostname of an IP address, you have to use the following command:


    ```

    # ping 4.2.2.2

    ```


    OR


    ```

    # ping www.examplewebsite.com

    ```


    +   - The traceroute command: The traceroute is network troubleshooting command
    that shows the number of hops to reach the destination. It also determines the
    traveling path of packets, as shown in the following example:


    ```

    # traceroute 4.3.2.1

    ```


    In the preceding example, we are tracing the route to reach the global IP address
    of the DNS server.


    +   - The telnet command: The telnet command is used to connect two hosts through
    the telnet protocol. It is also used to check whether a host is alive or not whether
    a network connection is free or not.'
  merge: -1
  pgno: 374
- img_proc: true
  md: '# Lab Session


    +   The nslookup command: The nslookup command is used to find out the IP address
    of a website. You must have an Internet connection for using this command. An
    example of using the nslookup command is as follows:


    ```

    # nslookup www.examplewebsite.com

    ```


    It should be noted that the nslookup command can convert hostname to IP address
    and address to hostname.


    +   The netstat command: The netstat command stands for Network Statistics and
    is used to display connection information, routing table etc. The -r option is
    used to display routing table information. The syntax to it is given as follows:


    ```

    # netstat -r

    ```


    +   The arp command: The arp command stands for Address Resolution Protocol and
    is used to view and add the contents of the kernel''s ARP tables. You can also
    view the default style of a table by using the -e option, as shown in the following
    command:


    ```

    # arp -e

    ```


    +   The rar command: The rar command stands for Reverse Address Resolution Protocol.
    It is used to manipulate the kernel''s ARP table in various ways. The main difference
    between the arp command and the rar command is that the arp command converts the
    logical IP address to physical MAC address; while, the rar command converts physical
    MAC address to IP address.


    # Network Configuration Files


    The primary network configuration files are as follows:


    ```

    /etc/hosts

    etc/resolv.conf

    etc/sysconfig/network

    etc/sysconfig/network-scripts/ifcfg-<interface-name>

    etc/host.conf

    etc/nss.conf

    etc/sysctl.conf

    etc/services

    etc/protocols

    etc/sysconfig/networking

    etc/modprobe.conf

    ```


    Let''s discuss these files in detail in the following sections.


    ```

    /etc/hosts

    ```


    The main purpose of this file is to resolve hostnames that cannot be resolved
    any other way. It can also be used to resolve hostnames on small networks with
    no DNS server. Regardless of'
  merge: -1
  pgno: 375
- img_proc: true
  md: 'the type of the network a computer is using, this file should contain a line
    specifying the IP address of the loopback device (127.0.0.1) as localhost.localdomain.


    ```

    /etc/resolv.conf

    ```


    This file specifies the IP addresses of the DNS servers and the search domain.
    Unless configured to otherwise, the network initialization scripts populate this
    file.


    ```

    /etc/sysconfig/network

    ```


    This file specifies routing and host information for all network interfaces. For
    more information about this file and the directives you can use the following
    syntax:


    ```

    /etc/sysconfig/network-scripts/ifcfg-<interface-name>

    ```


    For each network interface, there is a corresponding interface configuration script.
    Each of the network interface files provide information specific to a particular
    network interface.


    ```

    /etc/host.conf

    ```


    This file lists resolver options.


    ```

    /etc/nss.conf

    ```


    The nss.conf is used for Name Switch Service configuration. It defines order of
    name resolution options.


    ```

    /etc/sysconfig/networking

    ```


    This file holds network configuration files managed by redhat-config-network.


    ```

    /etc/sysctl.conf

    ```


    The above file is used for IP forwarding configuration.


    ```

    /etc/services

    ```


    It lists available network services, such as FTP and Telnet, and the ports they
    use.


    ```

    /etc/protocols

    ```


    It lists protocols available on your system.


    ```

    /etc/modprobe.conf

    ```


    The above file is used for Ethernet module configuration.'
