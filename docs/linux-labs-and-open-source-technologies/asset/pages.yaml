    # ■ Short Descriptive Questions


    Q1. Explain DNS with an example.


    Ans. DNS is a facility provided by the TCP/IP protocol that allows you to navigate
    to a website using its name instead of its long and difficult IP address. It uses
    the client-server architecture. Suppose the DNS servers are not available, and
    you want to search for information on the Internet by using Google. In that case,
    you need to type the IP address of Google, i.e., 216.239.51.10, instead of simply
    typing www.google.com in the address bar of the browser.


    Let us take an example to understand how DNS works. Suppose you want to send an
    e-mail with the address abc@express.com. In this case, express.com is sent to
    a DNS client that sends a request to a DNS server to verify the existence of the
    e-mail address and map it sends the address back to the DNS client, and the browser
    displays the respective Web page as per the request. The DNS server uses space
    to define the name of hosts over a network.


