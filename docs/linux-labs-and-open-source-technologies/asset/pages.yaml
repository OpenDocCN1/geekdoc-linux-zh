  md: '# 6.2 Version Control Using RCS and CVS


    Version controlling is the task of managing many versions of files or programs
    on a computer system. Two commonly used tools for version controlling are RCS
    and CVS. RCS is a set of UNIX commands that help in maintaining the versions and
    configurations of the software. It assists in program development and maintenance.
    It manages different versions of text documents, source programs, documentation,
    and test data. RCS automatically stores, retrieves, and identifies the revisions.
    It is useful for applying version control to all system files. CVS is the successor
    of RCS in the field of version controlling of files and programs.


    Now, let''s learn how these two systems are used for version control.


    +   * Using RCS

    In a system, it is assumed that multiple members of a team are logged in the same
    computer and sharing the same file system. In this case, if one or more members
    perform changes in the file, such changes must be saved with different versions
    of the same file. Therefore, before using an RCS system, one of the team members
    has to create a repository directory, with the help of the following command:


    ```

    % mkdir repository_directory

    ```


    Make sure this directory is writable by the group. Use the following command to
    give writable access to the repository directory by the group:


    ```

    % chmod g+rw repository_directory

    ```


    If the members are in different groups, you may have to use the a+rw combination
    of permissions instead of g+rw.

    Each team member can create his/her own working directory by using the following
    command:


    ```

    % cd

    % mkdir working_directory

    ```


    In the working directory, each member has to make a symbolic link to the repository,
    as shown in the following command:


    ```

    % ln -s repository_directory

    ```


    RCS provides two basic commands check-in (ci) and check-out (co) for working with
    the files in the file structure. You can use these commands to lock a file or
    unlock a file. By default, you check out a read-only copy of a file in your working
    directory. Now, if you have to make changes in your file, you have to lock it
    by check-in and do the changes. After saving the changes, you have to check-out
    the file in order to unlock it. In this procedure of check-in and check-out, a
    new version of the file is created. It should be noted that before making a change,
    you should lock the file. Although, other users have the option of editing the
    files, but not more than one person can lock the file at the same time.'
  merge: -1
  pgno: 177
- img_proc: true
  md: 'RCS is a system that manages revision groups. A revision group is a set of
    multiple versions of files or text documents. You can create a new version of
    a file by editing the existing one. RCS organizes the revisions in a tree-like
    structure, where the initial revision is the root of the tree and the tree edges
    indicate other evolved revisions. When you want a test file, myfile.c, to use
    the following command:


    ```

    % ci myfile.c

    ```


    This command invokes the check-in command. It creates a new revision group with
    the contents of the myfile.c file. When you want to check-out the file, use the
    following command:


    ```

    % co myfile.c

    ```


    You can also lock the file during the check-out by using the -l option by using
    the following command:


    ```

    % co -l myfile.c

    ```


    Besides the ci and co commands, RCS provides commands, listed in Table 1, for
    varied operations:


    | Table 1: Commonly Used RCS Commands with their Operations |

    | Command | Operation |

    | % ci -u myfile.c | the initial check-in |

    | % co -l myfile.c | Specifies check-out with lock |

    | % ci -u myfile.c | Specifies check-in with unlock |

    | % co -px.y myfile.c | Displays the version of the specified file |

    | % co -rx.y myfile.c | Does undo operation to version x.y |

    | % rcsdiff myfile.c | Specifies diff active in filesystem and last revision |

    | % rcsdiff -rx.y myfile.c | Specifies diff versions x.y and x.z |

    | % log myfile.c | Displays log of check-ins |

    | % rcs -u myfile.c | Breaks a lock that is held by a person on a file |


    Now, let''s learn about version control using CVS.


    +   - Using CVS


    Concurrent versions system is also a version controlling system that is actually
    built up on top of RCS. It has various improved features over RCS. For example,
    the commands used under this system can work remotely, so that you do not need
    to login to the machine and copy the files manually between machines.'
