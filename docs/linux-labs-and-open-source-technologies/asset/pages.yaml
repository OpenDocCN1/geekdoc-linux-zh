  md: '# ## Configuring NFS for File Sharing


    Red Hat Linux installs NFS by default, and it also gets activated by default when
    the system boots. Run the following commands to check whether the NFS-related
    packages are installed or not.


    ```

    [root@netmon tmp #] rpm -qa | grep nfs

    redhat-config-nfs-1.1.3-1

    nfs-utils-1.0.1-39

    ```


    You can also install the RPC portmap package and check its availability on your
    system by using the rpm command as follows:


    ```

    [root@netmon tmp #] rpm -q portmap portmap-4.0-57

    ```


    Both the NFS server and client have parts of NFS installed and running. The server
    needs portmap, and nfslock as well as a correctly configured /etc/exports is the
    main NFS configuration file that consists of two columns. The first column lists
    the directories you want to make available to the network, whereas the second
    column has two parts. The first part lists the networks or DNS domains that can
    get access to the directory, and the second part lists NFS options in brackets,
    as shown in the following command:


    ```

    #/etc/exports

    /data/files *(ro,sync)

    /home 172.16.1.0/24(rw,sync)

    /distro/rhel5 172.16.1.200/32(rw,sync)

    ```


    After configuring your /etc/exports file, you need to activate the settings but
    first make sure that NFS is running correctly.


    The following points help you to configure an NFS server:


    +   1. Use the chconfig command to configure the required nfs and RPC portmap
    daemons for starting at boot. The syntax is to use the chconfig command:


    ```

    [root@netmon tmp #] chconfig --level 35 nfs

    [root@netmon tmp #] chconfig --level 32 nfsfslock

    [root@netmon tmp #] chconfig --level 35 portmap

    ```


    +   2. Use the init scripts in /etc/init.d to start the NFS and RPC portmap daemons.
    The following examples use the start option, but when needed, you can also stop
    and restart the processes with the stop and restart options.

    The syntax to start the nfs and RPC portmap daemons is as follows:


    ```

    [root@netmon tmp #] service portmap start

    [root@netmon tmp #] service nfs start

    [root@netmon tmp #] service nfslock start

    ```'
