  md: '# 3.9 Understanding Boot Process and Related Files


    The process by which a computer is turned on and the Linux operating system starts
    to function is called booting. The booting process consists of the following steps:


    +   - It finds the kernel of the operating system. How this is achieved by the
    type of hardware used by the computer.

    - It starts the kernel operations in which the computer looks for all the hardware
    devices that are connected to the computer.

    - It starts the processes that configure various services necessary for the computer
    to work.


    The booting process consists of the following stages:


    +   - Basic Input/Output System (BIOS) Initialization

    - Master Boot Recorder (MBR) Boot Loader

    - Kernel Initialization

    - Init Initialization


    Let''s discuss these sequences in the following sections.


    # BIOS Initialization


    BIOS is the interface between the hardware and the software at a very basic level.
    BIOS provides the basic set of instructions used by the operating system. A successful
    boot depends on BIOS, which provides the lowest level of interface to peripheral
    devices and controls. BIOS first runs Power Self-Test (POST), and then it looks
    for peripherals and a device to boot from. Hardware configuration information
    is permanently stored in a small area (usually of 64 bytes) of Complementary Metal
    Oxide Semiconductor (CMOS). CMOS is powered by a battery located on the motherboard.
    This battery allows CMOS to retain its settings when the computer is turned on
    and disconnect from power.


    At the end of POST, a boot device is selected from the list of detected boot devices.
    Any modern BIOS will allow you to set the order of preference for the boot device
    from a list. Boot devices can include the floppy device, hard drive, CD-ROM, network
    interface, or other removable media.


    BIOS reads and executes the first physical sector of the chosen boot media on
    the system. Usually, this is contained in the first 512 bytes of the HD.


    # Master Boot Record


    When allocating disk space for partitions, the first sector or data unit for each
    partition is always reserved for programmable code used in booting. The first
    sector of the hard disk is reserved for the same purpose and is called the Master
    Boot Record (MBR). When booting from a hard disk, the BIOS of the PC loads and
    executes the boot loader code into the MBR. The MBR then needs to know which partitions
    have have boot loader code specific to their operating systems in their boot sectors
    and attempts to boot one of them.'
  merge: -1
  pgno: 100
- img_proc: true
  md: '# Chapter 3


    Fedora/Red Hat Linux is supplied with the GRUB boot loader; therefore, it cannot
    entirely fit in 512 bytes of the MBR. The GRUB MBR boot loader merely searches
    for a special boot partition and loads a second stage boot loader. The second
    stage boot loader then reads the data in /boot/grub/grub.conf configuration file,
    which lists all the available operating systems and booting parameters. When reading
    from the grub.conf displays the familiar Fedora splash screen that lists all the
    configured operating system kernels for your choice. Grub is a versatile boot
    loader and can be configured to support booting into many different operating
    systems, such as Windows and FreeBSD.


    The grub.conf for a system that can boot both Fedora Linux and Windows XP is given
    as follows:


    ```

    default=0

    timeout=10

    image=(hd0,0)/grub/splash.xpm

    title Fedora Core (2.6.8-20)

    root (hd0,0)

    kernel /mlinuz-2.6.8-20 root=LABEL=

    rd=/initrd-2.6.8-20.img

    title windows XP

    rootnoverify (hd0,1)

    chainloader +1

    ```


    # Kernel Initialization


    The kernel performs various functions at the time of booting. These functions
    can be listed as follows:


    +   - Device detection

    - Device driver initialization

    - Mount root file system as read only

    - Loads initial process (usually init)


    Although they generate good output, many of the kernel initialization activities
    take place quickly if you do not watch carefully during, you may miss them. A
    good way to "freeze time" and examine this output is to view the /var/log/dmesg
    log file, which contains a snapshot of the kernel messages after the control passes
    to init. A review of this output will reveal the basic initialization steps of
    the Linux kernel:


    +   1. Device drivers compiled into the kernel are called, and will attempt to
    locate their corresponding devices. If successful in locating the device, the
    driver will initialize and usually log output to the kernel message buffer.

    2. If essential (needed for boot) drivers have been compiled as modules instead
    of the kernel, then they must be included in an initrd image, which is then temporarily
    mounted by the kernel on a RAM disk to make modules available for the initialization
    process.'
  merge: -1
  pgno: 101
- img_proc: true
  md: '# System Administrator Tasks 85


    3. After all the essentials drivers are loaded, the kernel will mount the root
    file system as read-only.


    4. The first process is then loaded (usually init) and the control passed from
    the kernel to the init process.


    # Init Initialization


    This is an important stage in the entire booting process. The init process is
    the root or parent process of all the processes that run under Linux. The first
    task is to run a script stored at the /etc/rc.d/sysinit path. This task checks
    all system processes, hardware, file system mountings, and loads kernel modules,
    etc.


    Since init is the first process, it will always have a PID of 1. The file /etc/inittab
    contains information on how init should set up the system in every run-level,
    as shown in Figure 3:


    ```

    # @fedora -# cat /etc/inittab

    # inittab is only used by upstart for the default runlevel.

    # ADDING OTHER CONFIGURATION HERE WILL HAVE NO EFFECT ON YOUR SYSTEM.

    # System initialization is started by /etc/event.d/rc

    # Individual runlevels are started by /etc/event.d/rc[0-6]

    # Ctrl-Alt-Delete is handled by /etc/event.d/control-alt-delete

    # Terminal getty (tty[1]) are handled by /etc/event.d/tty[1-6] and

    # /etc/event.d/serial

    # For information on how to write upstart event handlers, or how

    # Default runlevel. The runlevels used are:

    # 0- halt (Do NOT setdefault to this)

    # 1- Single user

    # 2- Multiser, without NFS (The same as 3, if you do not have networking)

    # 3- Full multiuser mode

    # 4- unused

    # 5- X11

    # 6- reboot (Do NOT set initdefault to this)

    id:5:initdefault:

    [root@fedora ~]#

    ```


    Figure 3: A Sample of the /etc/inittab File


    If the /etc/inittab file is missing or corrupted, you will not be able to boot
    any of the standard run-levels (0-6) and will need to use the single or emergency
    mode instead.


    The /sbin/init program does some system checks, such as verifying the integrity
    of file systems, and starts vital programs needed for the operating system to
    function properly. It then inspects the /etc/inittab file to determine Linux''s
    overall mode of operation or runlevel. Table 5 lists the valid runlevels:'
  merge: -1
