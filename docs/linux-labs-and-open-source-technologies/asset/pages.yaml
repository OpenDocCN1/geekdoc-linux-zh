  md: '# Chapter 3


    # 3.4 Mounting Devices and the File System


    Mounting is a process in which you attach an additional file system to the currently
    accessible file system in a computer. A file system is a hierarchy of directories,
    also known as a directory tree, which is used to organize files on a computer
    or storage media. In Linux, directories start with the root directory, which contains
    all the other directories and files on the system. This root directory is designated
    by a forward slash (.


    Now, when you need to access a file system in Linux, you first need to mount it.
    Mounting a file system means making it accessible at a certain point in the Linux
    directory tree. This point is the mount point. Note that when you mount a file
    system it can be on a hard disk partition, CD-ROM, floppy, or USB storage device.
    You just need to know the name of the device associated with the particular storage
    device and a directory that you would like to mount it.


    +   - Mounting the /etc/fstab file


    When a Linux system is newly installed, all the disk partitions created during
    the installation are configured to be automatically mounted whenever the system
    boots. However, what will happen if you attach additional drives to a system after
    the installation Linux? Well, the simple answer is nothing, because the system
    is not configured to mount the drives automatically. For this, you need to configure
    the /etc/fstab file. This file is used to control the file systems to mount when
    your system is booted. The /etc/fstab file contains the details in the following
    format:


    | device | /mount-point | ftype dumpfreq | passno |


    The format above contains the following fields:


    +   - device: Refers to either a device or a file name

    - /mount-point: Refers to an existing directory that is used when the file system
    is mounted (/boot)

    - ftype: Refers to the type of file system specified on the specified device

    - options: Refers to a comma-separated list of options that can be used to control
    the mounting behavior

    - dumpfreq: Refers to a number, either 0 or 1, which specifies whether the backup
    of the file system should be taken or not

    - passno: Refers to the order in which file systems should be checked


    # Mount a File Systems


    The mount command is used to attach a file system, located on a device, to the
    directory tree. The standard form of the mount command is as follows:


    ```

    mount -t type dir

    ```'
