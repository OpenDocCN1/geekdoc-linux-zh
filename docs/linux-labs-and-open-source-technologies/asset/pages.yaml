  md: "# Setting Up a TELNET Server\n\nTelnet is managed service. Xinetd called Internet\
    \ super server daemon. It is launched at boot time, and listens for connection\
    \ on network sockets. When xinetd starts up, it checks the xinetd.conf file to\
    \ see what services should be running. It then reads the /etc/services file to\
    \ see what ports services should be running on. After xinetd starts, if there\
    \ is a connection on a service port listed (in our case TELNET) in xinetd.conf,\
    \ xinetd launches the appropriate network service. So telnet is not standalone\
    \ service but handle\n\n+   Xinetd-Managed Server Services\n\nXinetd-managed services\
    \ store their configuration files in the /etc/xinetd.d directory. Each configuration\
    \ file has a disable statement (in shown following code) that you can set to yes\
    \ or no. This governs whether xinetd is allowed to start them or not.\n\nEdit\
    \ file (/etc/xinetd.telnet) and make disable=no\n\n```\nTelnet = xinetd-managed\
    \ service\n# default: on\n# description: The telnet server serves telnet sessions;\
    \ it uses \\\n# unencrypted username/password pairs for authentication\nService\
    \ telnet{\n flags = REUSE\nsocket_type = stream\nwait = no\nuser = root\nserver\
    \ = / usr/sbin/in.telinetd\nlog_on_failure += USERID\ndisable = yes\n}\n```\n\n\
    To activate the telnet service we have to actually start xinetd services as telnet\
    \ is not standalone managed by xinetd daemon.\n\n```\n[root@netmon tmp]# service\
    \ xinetd restart\n```\n\nYou can test whether or not the TELNET process is running\
    \ by using the netstat command. The netstat command checks the TCP/UDP on which\
    \ your server is listening. If the TELNET process is not running the server will\
    \ not respond. The syntax to use the netstat command is as follows:\n\n```\n[root@netmon\
    \ tmp]# netstat -a | grep telnet\ntcp 0 0 *:telnet *: LISTEN\n[root@netmon tmp]#\n\
    ```"
  merge: -1
  pgno: 387
- img_proc: true
  md: 'You can also use the chkconfig --list command to start TELNET on the next reboot.
