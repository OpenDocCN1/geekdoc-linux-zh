  md: '# # Linux Labs and Open Source Technologies


    There has been rapid growth and development in the field of open-source software.
    These software promote universal access, via free license, and universal redistribution
    of a product''s design, including subsequent improvements to it by anyone. This
    book provides depth knowledge of such open-source software, their importance,
    and how to use them in computer labs. It explores various types of open-source
    software and tools used in software projects, including version control, content
    management system, and mobile development. The book provides lots of examples
    in easy to understand language along with exercise at the end of each chapter.


    # ## Key features of the book


    +   * Provides simple, clear and concise language, which makes the book easy and
    enjoyable to read.

    * Provides well-structured text and figures wherever required.

    * Includes chapter objectives and advance organizer at the beginning of each chapter
    to describe what the reader would learn in the chapter.

    * Includes comprehensive and detailed coverage of each topic to meet the requirements
    of the target audience, including postgraduates, undergraduates, and professionals.


    Includes comprehensive and detailed coverage of each topic to meet the requirements
    of the target audience, including postgraduates, undergraduates, and professionals.


    # About the Authors


    **Prof. Dayanand Ambawade** is working as the Head of Electronics & Telecommunication
    department at Sardar Patel Institute of Technology. His research includes network
    architecture, protocols and its performance analysis, and traffic management.
    He is also interested in isolation of Linux systems and integrating with Windows
    [SS-3], connecting heterogeneous networks with Samba, setting up necessary network
    services (DNS, SQUID, LDAP, DHCP, FTP, Telnet, Apache/PHP), and adding users to
    the Development Group Server with proper permissions, writing necessary scripts
    for the automation of weekly and daily backups.


    Deven Shah** is currently working as a Professor and Principal in one of the oldest
    engineering colleges affiliated to the Mumbai University. He is an Open Source
    Evangelist and pioneered Open Source book contained in the engineering studies
    at the University level. In the year 2009, he created a Private Cloud by using
    the Open Source Technology in the college to demonstrate how to set up a Virtual
    Computing Lab. He has received IBM awards for his work on SOA and the IBM Drona
    Award (2009). His projects have been selected in the top 20 projects in the IBM''s
    Great Mission for consecutive years. He has authored several books on topics security,
    networking, Linux, etc. He is a Vulnerability Assessment and has developed various
    courses using Open Source Technologies for leading institutes in India. He has
    also carried out various government-funded projects on Security and Cloud Technologies.


