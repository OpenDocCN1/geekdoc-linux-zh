    # Permanently Mounted the NFS Directory


    You first learn to create a mount point directory ,mnt/nfs, then you will learn
    to mount the remote NFS directory, and finally learn to use the mount -a command
    for activating the mount. The syntax to create a mount point directory, mount
    the remote NFS directory, activate the mount is as follows:


    ```

    [root@tmp] mkdir /mnt/nfs

    [root@tmp] ls /mnt/nfs

    [root@tmp] mount -a

    [root@tmp] ls /mnt/nfs

    ```


    Each time your system boots, it reads the /etc/fstab file and executes the mount
    -a command, making this a permanent NFS mount.


