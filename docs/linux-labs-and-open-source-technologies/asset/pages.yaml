  md: '# Chapter 1


    # 1.5 Open Source Movement


    Companies are increasingly recognizing and adopting the use of open-source software
    and applications. For example, Linux is widely used in data center operations
    across the globe. Linux users have the option of using public domain Linux solutions
    and the commercially supported versions of the operating system.


    In fact, companies are contributing to extend the use of open-source products,
    because by doing so, the open source code becomes a part of the code database
    that is maintained by the community. In this way, the code is enhanced and becomes
    compatible with the future release of other dependent applications without the
    company itself having to do it.


    Let us now know about open-source licensing.


    # 1.6 Open-Source Licensing


    The word ''license'' means the terms and conditions for using, reproducing, or
    distributing something. It grants rights and obligations to licensees. When we
    say open-source licenses, it means that these licenses grant the rights of copying,
    modifying, or redistributing the source code to licensees. Open-source licenses
    also give obligations to licensees, such as the modification of software must
    be distributed in the source code or an author''s contribution to the code or
    content is included in a program or documentation by signing the assignment agreement.


    A license can be implicit or explicit. When an author contributes some code to
    the open project in the already existing licensing code, it is called an implicit
    license; however, when the author contributes the code to the open-source project
    under some contributor license agreement, it is called an explicit license. For
    example, Apache.org uses these types of licenses.


    It should be noted that some open-source projects do not take contributed code
    under a license but require a joint assignment between the original and contributor
    authors of the code. For example, OpenOffice.org has the Joint Copyright Assignment
    agreement.


    Let us now know about certification.


    # 1.7 Certification


    Certification means the confirmation of certain characteristics of an object,
    person, or organization. This confirmation is provided by some authority in case
    of external review, assessment, or audit. Certification helps in building user
    confidence.


    One of the most types of certification in modern society is professional certification,
    where a person is certified to complete a job or passing an examination. Professional
    certification is of two types, some are valid for a lifetime, once the exam is
    passed, and others have to be recertified after a certain period of time.'
