  md: '# Appendix: Hard Disk Partitioning in Linux


    Hard disks are the inseparable components required for proper functioning of a
    system. Commonly used hard disk interfaces available are:


    +   - Parallel Advanced Technology Attachment (PATA)

    - Serial Advanced Technology Attachment (SATA)

    - Small System Computer Interface (SCSI)


    In addition, some external hard disks, such as external USB and IEEE-1394 drives
    are also available.


    Let''s begin with PATA disks.


    # A.1 PATA Disks


    PATA disks though commonly sometimes back are still easily available. In modern
    computers, it is used in case of CD-ROM or DVD-ROM drives. As visible by its name,
    PATA disks make use of parallel interface that lets you transfer several bits
    of data simultaneously. Moreover, the PATA cables are wide in space; thereby,
    supporting a total of 40 or 80 lines. A single PATA connector can be connected
    to two devices at a single time to a motherboard or plug-in PATA controller, resulting
    in availability of three connectors. Out of these three connectors, one is for
    the motherboard, the other two are for disks.


    Moving to configuration, these disks can be configured as both, masters or slaves,
    using jumpers. Generally, the master device is available at the cable end while
    slaves are located at the middle connector. Nowadays, all PATA disks come with
    cable select option, which configures the drive automatically. However, to obtain
    the best performance, disks should be placed on separate controllers since each
    PATA controller has limited throughput. In Linux, a PATA disk can be identified
    as /dev/hda or /dev/hda or /dev/hdb.'
  merge: -1
  pgno: 404
- img_proc: true
  md: '# SATA Disks


    SATA refers to the newly developed interface that is replacing PATA disks at a
    large scale. The connectivity of SATA disks to motherboard or controller on an
    individual basis. In other words, it means that individual disks can be connected
    to a single cable.


    As visible by the name, it is clear that SATA is a serial bus, which means that
    at a given point of time, only a single bit of data can be transferred; however,
    the speed of data transfer in SATA is more than PATA. Similar to the PATA disks,
    latest BIOS also detect information regarding SCSI. In addition to booting order.
    In case of Linux, most SATA disks are treated as SCSI devices.


    Let''s now learn about SCSI disks.


    # SCSI Disks


    Various SCSI devices are available using different cables that operate at different
    speeds. SCSI is commonly used as a parallel bus, however, with invent of its own
    Serial Attached SCSI (SAS), it can act as a serial bus. The number of hubs supported
    by a SCSI is 8 or 16 depends on the type of SCSI disks. One of the components
    of SCSI device is the host adapter, which is either built in motherboard or comes
    as plug-in card. Each SCSI device comprises of a unique ID provided by a jumper.


    You should note that the SCSI disks are not supported by BIOS x86; however, booting
    can be performed by an SCSI hard host adapter has its own booting BIOS. The naming
    system is considered as follows:


    +   - In case of hard drives, naming system is /dev/sdx (where, x is letter from
    up)

    - In case of SCSI tapes, naming system is /dev/stx and /dev/nstx (where, x is
    number from 0)

    - In case of SCSI CD-ROMs and DVD-ROMs, naming system is /dev/scdx or /dev/srx
    (where, x is number from 0)


    The numbering of SCSI devices is assigned in an increasing order based on their
    own ID. In case of multiple SCSI host adapters, Linux assigns filenames to all
    disks in sequential order; that is, first filenames are assigned to first adapter,
    then to disks on second adapter and so on.


    The SCSI bus is one-dimensional in nature which means each device on a bus is
    placed on a single line, where each end of SCSI bus is terminated. Modern SCSI
    devices come with a jumper to perform enabling or disabling termination. You must
    ensure proper termination as incorrect termination leads to inability to SCSI
    detection, poor performance, or unreliable operation.'
  merge: -1
  pgno: 405
- img_proc: true
  md: '# A.4 Partition and File Systems in Linux


    The term, partition, means a small, virtual piece of your hard disk. A partition
    is created to separate data from other data on your hard disk. A Linux administrator
    needs to do hard disk partition, because it keeps data separated and safe from
    one another in case of certain hard drive failures


    Each partition contains a separate file system and can be mounted on different
    mount point directories. Linux requires two partitions at minimum: a partition
    that is mounted on the root directory, and the partition having virtual memory
    (also called swap partition).


    In Linux, partitions are stored in the first sector of the hard disk, which is
    known as Master Boot Record (MBR) or Master Boot Block (MBB). However, large disks
    use a GUID Partition Table (GPT), instead of MBR, for storing the physical partitions
    of a large scale.


    You have already learned that a hard disk can have four partitions at maximum.
    To overcome this limitation, you can use an extended partition in place of one
    of these partitions. However, you cannot have more than one extended partition.
    Then, the extended partition is further divided into sub partitions, which are
    called logical drives. And on the basis of the type of hard disk is used, these
    partitions contain device files. These device files start with the name of the
    partition on that hard disk (such as, /dev/hda, /dev/hdb, /dev/sda, /dev/sdb,
    /dev/sdc and on) and append with a number that indicates the partition on that
    hard disk, as shown in Table 1:


    # Table 1: Lists Device Names on Different Hard Disks


    | Partition | PATA Device Name | SATA/SCSI Device Name |

    |---|---|--|

    | 1st primary partition | /dev/hda | /dev/sda1 |

    | 2nd primary partition | /dev/hda2 | /dev/sda2 |

    | 3rd primary partition | /dev/hda3 | /dev/sda3 |

    | 4th primary or extended partition | /dev/hda4 | /dev/sda4 |

    | 1st logical drive in the extended partition | /dev/hda5 | /dev/sda5 |

    | 2nd logical drive in the extended partition | /dev/hda6 | /dev/sda6 |

    | 3rd logical drive in the extended partition | /dev/hda7 | /dev/sda7 |

    | 4th logical drive in the extended partition | /dev/hda8 | /dev/sda8 |

    | 5th logical drive in the extended partition | /dev/hda9 | /dev/sda9 |

    | Nth logical drive in the extended partition | /dev/hdan | /dev/sdan |'
  merge: -1
  pgno: 406
- img_proc: true
  md: '# Appendix A


    In Linux, the process of partitioning involves two tasks or operations that are
    needed to be performed. First is creating the partitions and second is preparing
    the partitions to be used. For both tasks, different tools are used.


    # Partitioning a Disk


    The traditional disk partitioning tool is provided by Linux fixed disk, which
    is commonly known as f disk. This is a text-mode based tool. Apart from this tool,
    other partitioning tools such as GNU Parted can also be used. The GNU Parted tool
    can also be used for resizing of partition types without any data loss.


    # Using fdisk


    As already described, the fdisk utility is the traditional tool that is used for
    disk partitioning, having the following syntax:


    ```

    # fdisk /dev/sda

    ```


    Where., /dev/sda is the disk to be partitioned. On running the above command,
    the Command (m for help) prompt appears, as shown in Figure 1:


