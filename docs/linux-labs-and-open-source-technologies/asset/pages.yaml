  md: 'Figure 1 shows different layers that work inside the Drupal structure.


    ![](img/889a483c5a60e0806e42b73b2662a855_181_0.png)


    ▲ Figure 1: Different Layers Working Inside the Drupal Structure


    In the Drupal structure, information flows between different system layers (Figure
    1). There are five main layers. The first layer, data pool, is a collection of
    nodes. The data pool contains the content that has to be displayed on the attribute.
    The second layer modules are functional plug-ins, which are part of the Drupal
    core or contributed items created by Drupal community members. These modules allow
    you to customize the data items on your node types, and display the content. The
    third layer has blocks and menus. Blocks are used to provide the output from a
    module. They are the boxes of content, such as "User Login" or "Who''s online",
    which are displayed in the footer or sidebar regions.


    Menus, on the other hand, are navigators that specify the source of the content.
    User permissions form the fourth layer. This layer is used to configure the settings
    related to user permissions to perform different tasks. The top layer consists
    of site themes. These themes are made using XHTML and CSS with some PHP variables.'
