  md: '# Changing Your IP Address using ifconfig


    To assign IP address to eth0 interface, you can run the following command:


    ```

    [root@netmon tmp]# ifconfig eth0 172.16.1.100 netmask 255.255.0.0

    ```


    The up at the end of the edit command activates the interface.


    > > To make this change permanent each time you boot up you have to add this command
    in /etc/rc.local file, which is run at the end of every reboot.


    # Static IP Address Configuration by Editing


    ```

    [root@netmon network-scripts]# cd /etc/sysconfig/network-scripts

    ```


    You can use vi to modify the setting.


    ```

    [root@netmon network-scripts]# vi ifcfg-eth0

    DEVICE=eth0

    IPADDR=172.16.1.100

    NETMASK=255.255.0.0

    BOOTPROTO=static

    ONBOOT=yes

    [root@netmon network-scripts]#

    ```


    # Determining the IP Address Using DHCP


    Dynamic Host Configuration Protocol (DHCP) is used to obtain IP addresses for
    dial-in clients, only the IP address from the DHCP lease is passed to the RAS
    client. [root@netmon tmp]# cd


    ```

    /etc/sysconfig/network-scripts

    [root@netmon network-scripts]# vi ifcfg-eth0

    DEVICE=eth0

    BOOTPROTO=dhcp

    ONBOOT=yes

    [root@netmon network-scripts]#

    ```


    # Configuring Hostname in /etc/hosts File


    The /etc/hosts file is just a list of IP addresses and their corresponding server
    names. The server will typically check this file before referencing DNS. If the
    name is found with a corresponding IP address, DNS will not be queried at. Add
    a quick /etc/hosts file entry:'
