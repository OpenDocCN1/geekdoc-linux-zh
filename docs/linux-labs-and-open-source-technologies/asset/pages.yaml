  md: '# Q4. Describe the role of Dalvik virtual machine.


    Ans. As stated earlier, the Dalvik virtual machine is used in the Android system
    just as JVM is used in Java. However, Dalvik is optimized for low-power Processing
    Units (CPUs) and low-memory modules. Unlike the JVM, Dalvik does not recognize
    files with the .class extension; instead, it executes the files with the .dex
    extension. In fact, .dex files are generated implicitly from the .class file and
    are highly optimized where memory and processing power constraints


    # Q5. What is an activity? How is it created?


    Ans. An activity is an activity component that allows a user to perform an operation.
    Generally, a user performs various operations, such as capturing a photo, sending
    a message, or viewing a map. For each operation, an activity is defined. An activity
    is a collection of these activities. The main objective of an activity is to interact
    with users. You should note that in a single application, there can be one or
    more activities. However, there is a main activity displayed to the users. In
    other words, during the launch of an activity, the main activity provides an interface
    to the users and further invokes the other activity depending on the request of
    the user. Whenever the other activity is invoked, the previous activity is stopped;
    the system preserves the stopped activity in a stack.


    You can create an activity by creating a Java class that extends the Activity
    class. Note that each activity needs to create a window in which its interface
    components can be loaded. For this, the activities are displayed as a full-screen
    window to the users. You can also set it in different views, such as floating
    or embedded, with the other activity. By setting windowFloating attributes, you
    can embed an activity into another by using the ActivityGroup class (deprecated
    in API level 13). You should note that all the activities (or subclasses of the
    Activity class) generally implement two methods, namely, onCreate(Bundle) andPause.


    # Q6. Describe the role of intent in Android programming.


    Ans. In Android programming, you can bind one or more activities defined in an
    application by using intents. Apart from binding of the same application, an intent
    object also allows you to bind the activities of two different applications. The
    Intent is a passive data structure that stores the abstract description of the
    task needs to be performed.


    # Q7. What are views and ViewGroup?


    Ans. A view is a widget that is displayed on the screen of the users, such as
    buttons, text boxes, check boxes, and radio buttons. The base class of a view
    is android.view.View. The grouping of one or more views is known as ViewGroup.
    A ViewGroup helps you in specifying the layout according to which the views can
    be placed and arranged. Some of the layouts can be defined for'
  merge: -1
