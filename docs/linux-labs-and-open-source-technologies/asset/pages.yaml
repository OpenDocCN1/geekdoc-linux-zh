    and reverse zone files having the same name as mentioned in the named.conf file.
    By default, your zone files are located in /var/named, /var/named/chroot/var/named,
    or /etc/bind directories. Each zone file contains a variety of records (SOA, NS,
    MX, A and CNAME) that govern different areas of BIND (named).


