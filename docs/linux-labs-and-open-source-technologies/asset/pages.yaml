    # 5.2 Bash Shell Scripting


    Bash stands for Bourne Again Shell. It is one of the most commonly used shell
    of Linux. This shell was created in 1987 by Brian Fox. Some commonly features
    of the Bash shell include command line editing, command history, job control,
    aliases, indexed arrays of unlimited size, and integer arithmetic.


    Table 1 lists some configuration files used in Bash:


    | File | Description |

    | --- | --- |

    | .bashrc | Contains a list of commands that are executed every time a shell is
    opened. |

    | .bash_profile | Contains the details of all the users who have logged into the
    system. |

    | .bash_history | Stores the history of the bash shell. |

    | .bash_logout | Refers to the commands that are executed when you log out of
    the shell. By default, the screen gets cleared. |


    The Bash shell completes the file and command name automatically. For example,
    if you type is e and press the TAB key, the shell automatically completes your
    word to /etc. Lets perform the following steps to create a shell script in the
    Bash shell:


    +   1. Open the code in the hello.sh file, as shown in Listing 1:

    2. Enter the code in the vi hello.sh file, as shown in Listing 1:


    +   Listing 1: Basic Program in Bash Shell


    ```

    #!/bin/bash

    #the hello world program

    echo "Hello, world!"

    echo " welcome to Linux"

    ```


    In Listing 1, the first line is called a shebang or a "bang" line. It is the absolute
    path to the Bash interpreter. This line consists of a hash and an exclamation
    point (#!), followed by the path to the interpreter, as /bin/bash. The # used
    in scripts notifies the operating system that this file contains a set of commands
    for the command interpreter. The line that starts with the # character indicates
    that it is a comment, and is not executed by the shell. The echo commands are
    used to display messages.


    +   1. Save and close the hello.sh file.

    2. Execute the script file.


    Let''s learn how to make a script executable in Linux.'
