    # 4.1 Introduction


    Network, in the field of computers, is referred to as a collection of computers
    that communicate with each other either by wired or wireless medium. Networking
    in computers is mainly used for sharing files and common resources, such as printers,
    scanners, and modems. After a computer network is created, you need to maintain
    the hardware and software for its efficient working. This process is generally
    known as network administration. Network administration also includes tasks such
    as adding new computers to a network and maintaining security across the network.
    The person responsible for network administration is called a network administrator.
    The network administrator performs various tasks such as installing, configuring,
    expanding, upgrading, and repairing the network. A network administrator also
    handles hardware-related devices, such as cables, switches, routers, and the operating
    system software, such as the network operating software, and backup storage.


    Beyond network, the security of data is also an essential and important concern
    of any organization. A system that has insecure configuration can be prone to
    threats and viruses. Today, there are a number of tools that act as a weapon against
    malicious users and turn insecure items to secure items. The goal of securing
    your system is to protect the stored data from theft, corruption, and tampering.
    In other words, system security refers to defining the methods for preventing
    unauthorized access to data.'
  merge: -1
  pgno: 110
- img_proc: true
  md: '# Chapter 4


    In this chapter, you will learn about network and security administration. The
    chapter starts by explaining the basic networking commands in Linux. Next, it
    describes the various types of servers, such as Apache web server. DNS server,
    DHCP server, and mail server. The chapter explains the procedure to secure servers
    using IPTables. It also discusses how to set cryptographic services in Linux.
    In addition, the chapter explains SSL and how to manage certificates with OpenSSL.
    Toward the end, the GNU Privacy Guard is described.


    Let us start by learning the basic networking commands.


    # 4.2 Basic Networking Commands


    Networking is an important and essential aspect of Linux. A computer network adheres
    to protocols such as Transmission Control Protocol/Internet Protocol (TCP/IP)
    or File Transfer Protocol (FTP) that provide various standards and rules that
    a network must follow for communication. In addition to protocols, computer networks
    also require the support of additional utilities, such as the Domain Name Systems
    (DNS) server and Telnet server.


    When you have multiple computers on a network, you need to identify each one uniquely.
    The IP address assigned to a computer in a network is known as its IP address.
    The IP address is a unique numerical address provided to computers and other devices
    for identification in the network. It is a 32-bit logically assigned binary number
    of four octets that is represented in decimal notation and designated to a particular
    device. The IP address consists of two parts divided into classes, and each class
    has its specific value range.


    +   - Network ID: Identifies the network to which the host is connected. Network
    ID is the same for all the hosts on a particular network.

    - Host ID: Identifies the host on the network. Host ID is different for different
    hosts on a network.


    Table 1 shows the division of the IP address into Network ID and Host ID:


    | IP Address | Network ID | Host ID |

    |---|---|--|

    | 192.168.75.38 | 192.168.75 | 38 |

    | 130.11.45.90 | 130.11 | 45.90 |

    | 125.25.210.12 | 125 | 25.210.12 |


    Table 1: Division of the IP Address


    In the example 192.168.75.38, 192 is the first octet, 168 is the second octet,
    75 is the third octet, and 38 is the fourth octet. The following are the rules
    governing the identification of an IP address:


    +   - An IP address cannot be duplicated

    - All host bits cannot be set to zero

    - All host bits cannot be set to one'
