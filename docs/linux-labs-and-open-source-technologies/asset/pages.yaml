    # The if-else Statement


    The if-statement is used to test a condition. The syntax of the if statement is
    as follows:


    ```

    if condition

    then

    command1

    command2

    ...

    commandN

    fi

    ```


    In the preceding syntax, if the given condition is true, the command1, command2...
    commandN are executed; otherwise, the script continues to execute the rest of
    the code. An example of the if statement is shown in Listing 3:


    # Listing 3: Using the if Statement


    ```

    #!/bin/bash

    read -p "Enter your password" pass

    if test "$pass" == "admin"

    then

    echo "you are a valid user"

    fi

    ```


    Let''s save and close the preceding code in ifstatement.sh file. Now, execute
    the file as follows:


    ```

    chmod +x ifstatement.sh

    ./ifstatement.sh

    ```


    The preceding command will prompt you to enter your password. If you get the correct
    password, it will display the "You are a valid user" message, otherwise not.


    The if statement can also be used with the else statement. The syntax is as follows:


    ```

    if condition

    then

    command 1

    else

    command 2

    fi

    ```'
