  md: '# Data Persistence


    Android allows a user to save data persistently. For example, a user wants the
    login ID and password for an applicant to be saved persistently so that whenever
    he/she wants to login, the credentials are not required again. In cases, the credentials
    should be saved persistently. Android provides various data storage options, such
    as shared preferences, internal storage, external storage, SQLite database, and
    network connection (Web). Using the shared preferences mechanism, you can store
    primitive data through key-value pairs. You can also store private data by using
    internal and external storage. Android also allows you to store data in SQLite
    database in a structured format. Data of an Android application can be stored
    on the Web through the network server.


    +   Introducing the Data Storage Options

    The Android platform provides multiple mechanisms for data persistence. These
    mechanisms depend on various factors, such as the amount of data, frequency of
    data accessibility, types of manipulations to be performed on the database, and
    the type of application that needs to access the data. Let''s understand how change
    in a factor can affect the selection of the mechanism. For example, to store string
    or integer type values in your application, use the shared preference mechanism.
    However, to save your application data in files, use internal or external storage
    mechanisms.

    The different data storage options or mechanisms are as follows:

    - The preferences

    - The internal storage

    - The external storage

    - The SQLite database

    Let explore each of these options in detail.


    # Using Preferences


    The simplest mechanism for long term storage of user data is the preferences system.
    In the Android platform, the activities and applications can store user preferences
    in the form of key/value pairs. When we say that the user preferences are being
    stored, it implies that the user-configuration details, such as the setting, user
    preferences, sort order for a list, or the last accessed by the user, are recorded.
    Note that the preferences can be stored either for a single activity or for multiple
    activities of an application.


    You can access preferences by using the getPreferences(), getSharedPreferences(),
    or getDefaultSharedPreferences() method. The getPreferences() method is used within
    your activity and allows you to access activity-specific preferences. The getSharedPreferences()
    method is also used within the Activity class or in another application context
    and allows you to access application-level'
  merge: -1
  pgno: 310
- img_proc: true
  md: '# 294 Chapter 7


    preferences. The getDefaultSharedPreferences() method allows you to retrieve shared
    preferences in relation to the overall Android preference framework.


    The Android SDK provides the SharedPreferences class to help you save and fetch
    the persistent key/value pairs of primitive data types. The SharedPreferences
    class allows you to save the values of the following primitive data types:


    +   - boolean

    - float

    - int

    - long


    You should note that the data of any of the preceding data types would persist
    across a user''s sessions after the application has been killed. You can use either
    of the following methods to retrieve the instance of the SharedPreferences class:


    +   - The getSharedPreferences() method: Allows you to work with multiple preferences
    files. Each file is identified by name, which is provided as the first value.

    - The getPreferences() method: Allows you to work with the single preferences
    file for your Activity class. You can avoid providing a name for the file as the
    preference file would be your Activity class.


    You can set the preferences in either of the following ways:


    +   - Creating the preferences.xml file in the /res/xml folder

    - Setting the preferences in the code


    # Using Internal Storage


    We know when storing user data using the SharedPreferences object, the data is
    stored in key/value pairs. However, if a large amount of data needs to be stored,
    then you need to use the traditional mechanism of saving the data in files. Suppose
    you want to maintain a large amount of data, such as the details of books or products.
    For this, you need to create a text file to store the data, either internally
    within the device or externally on the Secure Digital (SD) card.


    You can store the data persistently in a file in the internal memory of the Android
    device by creating a text file during runtime or creating a static resource. Let
    us first explore how a text file can be created during the runtime of the application
    to store and save the data in the internal memory of the device. Moreover, when
    you uninstall the application, the files (associated with that application) that
    have saved on your device are removed automatically.


    To create and save the data in a file, you first need to invoke the openFileOutput()
    method by passing two arguments, that is, the name of the file and the operating
    mode. The following code snippet shows how to use the openFileOutput() method:


    ```

    //Using the openFileOutput method

    ```'
