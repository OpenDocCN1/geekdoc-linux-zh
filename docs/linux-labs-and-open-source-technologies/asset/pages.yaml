    # ### Changing Default Gateway


    Your PC needs to have a single default gateway. DHCP servers automatically assign
    a default gateway to DHCP-configured NICs, NICs with configured, static IP addresses
    will need to have a manually configured default gateway. This can be done with
    a simple command.


    ```

