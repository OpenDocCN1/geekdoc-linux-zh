  md: '# # 01 Overview of Open-Source Software


    OBJECTIVES


    +   * Explain the need and advantages of open-source software

    * Explore the Free Open Source Software (FOSS) and its usage

    * Describe free software movement

    * Explain open source movement

    * Discuss open-source licensing

    * Describe certification

    * Explore the open-source software development model

    * Discuss how to run a successful free software project

    * Compare open-source software with other software

    * Explore different types of open-source software licenses


    # ## 1.1 Introduction


    The term open source means something that is available for public use and the
    source code can be modified and enhanced. If we apply this term to a software
    or program, it means that the source code of that software or program is available
    for public use. Some examples of open-source software are Linux and Android. Open-source
    software is different from the software that has a source code but cannot be modified
    or copied by anyone, except the author who created it and has exclusive control
    on it. This type of software is called proprietary or closed source software,
    as its source code is the property of its original authors. Some examples of closed
    source software are Microsoft Word and Adobe Photoshop.


    This chapter gives an overview of open-source software. It starts with describing
    the need and advantages of open-source software. Next, it explains FOSS and its
    usage. The chapter also explains free software movement, open movement, and open-source
    software development model. Then, the chapter explains how to run a successful
    free software project and the comparison between open source and other types of
    software. Toward the end, the chapter describes the different types of open-source
    software licenses, such as Apache license, Eclipse Public License, and Mozilla
    Public License.


    Let us start by explaining the need and advantages of open-source software.'
  merge: -1
  pgno: 18
- img_proc: true
  md: '# Chapter 1


    # 1.2 Need and Advantages of Open-Source Software


    Open-source software is required when you do not want to depend on closed source
    vendors for any product upgrades. For example, open source software is adopted
    in cases when you do not want your customers to wait for one or two months for
    upgrading the ABC version of the X product. Open-source software is also adopted
    when you want to invest in a big project and provides you access to a variety
    of tools, such as development tools, testing tools, or project and portfolio management
    tools.


    Open-source software is also considered as a key component of the behind-the-scenes
    technology that powers the Internet. When you view a webpage, check or chat with
    a friend on the Internet, a network of computers all over the world links your
    computer system with a remote computer that serves the data to your system. Many
    of these computers run open-source software, such as Linux, Web server applications,
    such as Apache. In addition, a variety of open-source tools are used to provide
    functionalities such as file storage, networking, etc.


    Some advantages of using open-source software over closed source software are
    as follows:


    +   - Bug-fixing: All software releases contain bugs. When a bug is detected in
    closed source software, only the people who can fix it are the original developers
    who developed and have the access to the source code. In case of open-source software,
    the source code is available and can be changed frequently. Bugs are easily visible
    in opensource software; however, they are fixed rapidly.


    +   - Customization: Open-source software or tools can be customized by anyone
    for enhancements.


    +   - No lock-in: Open-source software does not impose limitations on the use
    of software by users. However, some closed source software vendors lock the user
    access for using their products and after some period, they increase the price
    of their software products or upgrades.


    +   - Resource support: Open-source software are available with some learning
    resource that contains tutorials, projects, or examples of the code related to
    the software for enhancing the skills of developers.


    +   - Community support: When you use open-source software, you become part of
    a community of users and developers, who can provide support to improve the software.


    Let us learn about FOSS.


    # 1.3 FOSS


    Free-source software (FOSS) is a software that is open source as well as freely
    available. There is a myth around FOSS usage that it is always free. However,
    up to a certain degree this is true. Actually, FOSS applications do not charge
    a licensing fee for use. Many FOSS Linux distributions such as Red Hat, SuSE,
    or Debian can be obtained freely from the Internet.'
  merge: -1
