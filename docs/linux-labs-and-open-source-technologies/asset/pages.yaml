  md: '# 4.4 DNS Servers


    DNS is a facility provided by the TCP/IP protocol that allows you to connect to
    other computer machines on a network by referring machines names, without having
    to remember their IP addresses. It associates hostnames with their respective
    IP addresses.


    It uses the client-server architecture. Let''s consider a live example of DNS
    servers. Suppose the DNS servers are not available, and you need to search for
    information on the Internet using Google. In that case, you need to use the IP
    address of Google, i.e., 216.239.51.10, instead of simply typing www.google.com
    in the address bar of the browser.


    Following points must be considered when configuring the DNS server:


    +   - Authoritative DNS Server: Authoritative servers provide definitive information
    for your DNS domain, such as the names of the servers and websites in it. For
    example, when you register your domain apple.com, you are actually inserting a
    record on the .com DNS server that points to the authoritative DNS server, which
    you have assigned for your domain.


    +   - Nameserver Zones: The fully qualified domain name (FQDN) of a host can be
    broken down into different sections. Consider the following name:


    In this example, the name com defines the top-level domain under team. The name
    domain under com, while the name sales is a sub-domain under team. Finally, the
    name directs signifies a specific machine hostname. Except the hostname, each
    section is called a zone that defines a specific namespace.


    These zones are defined on authoritative servers, primary and secondary, through
    the use of zone files, which describe the namespace of zone. The primary servers
    that store zone files are also called master servers, which are truly authoritative.
    The secondary servers that store zone files are also called slave servers, which
    receive their zone files from the primary servers. Moreover, any server can be
    a primary server for one zone and a secondary server for different zones at the
    same time, as it depends on how the server is configured.


    +   - Name server Types: There are four types of name servers in DNS. These are
    as follows:


    +   - master: Used to store original and authoritative zone records for a namespace.


    +   - slave: Used to answer the queries of other name servers concerning namespaces.
    It should be noted that the slave name servers get their names information from
    master name servers.


    +   - caching-only: Used to provide name-to-IP resolution services, which means
    it converts the name of a machine to its IP address. It can answer only those
    resolutions that are cached in memory for a fixed period of time.


    +   - forwarding: Used to forward requests to a specific list of name servers
    for resolution.'
  merge: -1
  pgno: 120
- img_proc: true
  md: "# 104 Chapter 4\n\n+   - Forward and Reverse Lookup: When the DNS server resolves\
    \ or maps a fully qualified domain name such as www.spit.ac.in to an IP address,\
    \ this process is called forward lookup. However, when it resolves or maps an\
    \ IP address to a fully qualified domain name, this process is called reverse\
