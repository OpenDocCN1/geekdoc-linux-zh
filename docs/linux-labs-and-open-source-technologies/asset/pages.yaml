    - Multimedia: Includes applications such as OpenLP, Banshee, HandBreak, and VLC
    media player

    - Social Networking: Includes applications such as Diaspora


    Let us learn about FOSS usage.


    # FOSS Usage


    The popularity of FOSS applications in the IT field has increased in the recent
    years. This is because FOSS applications are free to use. Besides costs, FOSS
    applications are considered secure, as the code is accessible to everyone and
    can fix bugs, if they are found.


    FOSS applications do not depend on the company or author who originally created
    it. The code is continuously enhanced by users and developers. Another advantage
    of using FOSS applications is that there is no concern of anti-piracy measures,
    such as product activation or serial number.


    However, the use of FOSS applications might be difficult to learn. For instance,
    you cannot learn to use Linux in a day.


    Let us learn about free software movement.


    # 1.4 Free Software Movement


    Free software is a social movement with the goal of having freedom for using software
    by users. It provides freedom for users to run, study, and change the software
    and redistribute its copies with without changes. Free software movement was founded
    by Richard Stallman in 1983 by launching the GNU Project. It was basically focused
    on software development. Free software movement also rejects the proprietary software,
    because software does not give the freedom of free software.


    Let us learn about open source movement.'
