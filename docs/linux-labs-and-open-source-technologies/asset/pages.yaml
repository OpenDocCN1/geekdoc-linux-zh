    # Working with Virtual Hosting


    Virtual hosting means hosting multiple websites on a single server. The Apache
    Web server can perform virtual hosting, which means it can run several websites.
    For example, you can run mysite1.com and mysite2.com on a single physical server.
    In the Apache Web server, you can perform virtual hosting configuration in two
    ways, which are as follows:


    +   IP-based virtual host: In this configuration, you can map the IP addresses
