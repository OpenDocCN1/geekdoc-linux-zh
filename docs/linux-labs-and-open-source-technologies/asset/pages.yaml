    # 5.1 Introduction


    In the early days of computing, computers accepted instructions in the binary
    format that is in the form of zeros and ones. As the binary language is not in
    the human-readable format, it is difficult for programmers to write instructions
    in this format. A shell allows programmers to give instructions in the human-readable
    format to the computer, and then translates it in a format that is understood
    by the operating system.


    In Linux, a shell acts as an interface between the kernel and users. When you
    log in Linux, you are prompted for a user name and password. After the successful
    login, you are switched to another program called shell. This shell is a command
    line interpreter that interprets the commands that you have entered to perform
    some operation. An example of a shell is the Bash shell. Now, there are two ways
    to use shells in Linux: interactively and by writing shell scripts. In the interactive
    mode, you type a single command and see the result. However, in case of shell
    scripting, you have to store commands in a text file, and then execute the file
    as a script.


    In this chapter, you will learn about shell programming. The chapter starts by
    explaining Bash shell scripting. Then you learn how to execute a shell script
    in Linux. Next, the chapter explains about variables, input data, control structures,
    and how to handle signals and work with functions. The chapter also explains about
    the sed and gawk commands. Towards'
