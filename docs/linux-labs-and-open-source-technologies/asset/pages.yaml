    # Exploring Google Maps External Library


    Google introduced the Google Maps Android API to allow developers to work with
    maps on the Android devices. The API consists of the following classes:


    +   - GoogleMap: Refers to the main class used to display map titles and map controls.
    You cannot directly create the instance of the GoogleMap; instead, it is created
    after defining the Map or MapFragment instances. A reference of the GoogleMap
    object is obtained by invoking the getMap() method of a Map or MapFragment instance.

    - Map: Refers to the subclass of the View class, which provides a canvas to draw
    the map defined by the GoogleMap object.

    - MapFragment: Refers to the subclass of the Fragment class, which allows you
    to place a marker within the Fragment layout of the Activity class.

    - Marker: Allows to define markers on a map. You can add a marker by retrieving
    a reference to the GoogleMap object and invoking the addMarker() method. While
    adding a marker, you should specify the latitude and longitude where the marker
    is to be placed.

    - UiSettings: Refers to the class that allows you to control the interface and
    elements appearing on the map. Using this class, you can enable or disable the
    zoom control on


