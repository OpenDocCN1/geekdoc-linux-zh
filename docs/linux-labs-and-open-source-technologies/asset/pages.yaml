  md: '# 86 Chapter 3


    | Table 5: Showing Linux Runlevels |

    | Mode/Runlevel | Directory | Runlevel Description |

    |---|---|--|\| 0 | /etc/rc/rc0.d | Halt |

    | 1 | /etc/rc/rc1.d | Single-user mode |

    | 2 | /etc/rc/rc2.d | Not used (user-definable) |

    | 3 | /etc/rc/rc3.d | Full multiuser mode (no GUI interface) |

