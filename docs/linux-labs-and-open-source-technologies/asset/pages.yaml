    # Versioning the Android Application


    Versioning tells the users about the version of the application they are using.
    It is an upgrade and maintenance strategy, which is provided to the user from
    time to time. The following are important points that need to be kept in mind
    with regard to the versioning of an application:


    +   - Users want to know the application version that they are using and the upgrades
    available for that version.


    +   - The compatibility issues depend on the versioning of your application.


    +   - When you release your application through a service, you are prompted to
    provide the application version so that it can be displayed to the user at the
    time of download.'
