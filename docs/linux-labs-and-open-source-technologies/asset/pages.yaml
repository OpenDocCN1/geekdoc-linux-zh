  md: '# Using the External Storage


    In any Android-based device, you can save the data or files on an external storage,
    such as an SD card. You have already learned how to save the files on internal
    storage. While storing the files, you can set their operating mode. However, in
    case of external storage, the files are in the WORLD_READABLE mode and users can
    modify a file by transferring it to the computer. You should note that external
    files can be removed if the user mounts the SD card on a computer.


    Before saving to external storage, you first need to validate whether or not the
    external storage is available in the device. You can check the availability of
    the external storage using the getExternalState() method. This method is a part
    of the Environment class, which provides the following noteworthy fields to depict
    the state of the external storage (media):


    +   - MEDIA_BAD_REMOVAL: Means that the external storage was removed before it
    was unmounted. The constant value of this field is bad_removal.


    +   - MEDIA_MOUNTED: Means that external storage is available and you can either
    read or write data on it. The constant value of this field is mounted.


    +   - MEDIA_MOUNT_READ_ONLY: Means that the external storage is available and
    you can only read the data from it. The constant value of this field is mounted_ro.


    +   - MEDIA_NOFS: Means that external storage is available; however, either a
    blank or an unsupported file system has been used. The constant value of this
    field is nofs.


    +   - MEDIA_REMOVED: Means that external storage is not available. The constant
    value of this field is removed.


    +   - MEDIA_SHARED: Means that external storage is available, but not mounted
    as the media would be shared through Universal Serial Bus (USB). The constant
    value of this field is shared.


    After checking whether the external media is in the ready state, you can get the
    absolute path of the external directory for storing your files. To access the
    external directory, you need to invoke the getExternalFilesDir() method. This
    method returns an instance of the File type and accepts the type parameter, specifying
    the directory that you want to retrieve, such as DIRECTORY_PICTURES or DIRECTORY_MOVIES.
    If you want to retrieve the root of the directory structure, then you should pass
    `null` as the value of the argument. You should note that if you are using API
    Level 8 or higher, then you should use the getExternalFilesDir() method to access
    the directory structure of the external storage media. However, if you are using
    API Level 7 or lower, then you should use the getExternalStorageDirectory() method.


    The following code shows the usage of the getExternalStorageState() and getExternalFilesDir()
    methods:


    ```

    String reserve_state = Environment.getExternalStorageState();nif(Environment.MEDIA_MOUNTED.equals(reserve_state))

    ```'
