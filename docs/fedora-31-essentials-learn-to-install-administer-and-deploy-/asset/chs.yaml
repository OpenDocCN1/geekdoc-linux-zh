  \ SELinux 的基本概念，以及为 Samba 提供访问的步骤。\n\n### 19. 虚拟化技术概述\n\n虚拟化泛泛定义为在单台计算机上同时运行多个操作系统的能力。虽然这不是一个新概念，但虚拟化在近年来变得突出，因为它提供了一种充分利用服务器系统\
  \ CPU 和资源容量的方法，同时提供了稳定性（如果一个虚拟化客户系统崩溃，主机和任何其他客户系统将继续运行）。\n\n虚拟化在尝试不同的操作系统方面也非常有用，例如，你可以在虚拟机中运行\
  \ Windows，而无需重新划分分区、关闭 Fedora 31 然后从 Windows 启动。你只需启动一个虚拟化的 Windows 版本作为客户操作系统即可。同样，虚拟化允许你从\
  \ Fedora 31 内部运行其他 Linux 发行版，从而提供对两个操作系统的并发访问。\n\n在决定实施虚拟化的最佳方案时，清晰了解目前的各种虚拟化解决方案是非常重要的。因此，本章的目的是用通用术语描述目前常用的虚拟化技术。\n\
  \n### 19.1 客户操作系统虚拟化\n\n\n\n客户操作系统虚拟化（也称为基于应用程序的虚拟化）可能是最容易理解的概念。在这种情况下，物理宿主机系统运行着标准的、未修改的操作系统，例如\
  \ Windows、Linux、UNIX 或 macOS。运行在该操作系统上的是一个虚拟化应用程序，它的执行方式与任何其他应用程序（如文字处理器或电子表格）在系统上运行的方式非常相似。在该虚拟化应用程序内部，创建了一个或多个虚拟机，以便在宿主机上运行客户操作系统。\n\
  \n该虚拟化应用程序负责启动、停止和管理每个虚拟机，并本质上代表各个虚拟机控制对物理硬件资源的访问。虚拟化应用程序还参与了某种被称为“二进制重写”（binary\
  \ rewriting）的过程，这涉及扫描执行中的客户系统的指令流，并将任何特权指令替换为安全的仿真。这种效果是让客户系统认为自己直接运行在系统硬件上，而不是运行在应用程序内的虚拟机中。\n\
  \n下图展示了基于客户操作系统的虚拟化示意：\n\n![](img/guest_os_virtualization.png)\n\n图 19-1\n\n如上图所示，客户操作系统运行在虚拟化应用程序的虚拟机中，而虚拟化应用程序又以与其他应用程序相同的方式运行在宿主机操作系统之上。显然，客户操作系统与底层宿主机硬件之间的多层抽象不利于实现高水平的虚拟机性能。然而，这种技术的优势在于不需要对宿主机或客户操作系统进行任何更改，也不需要特殊的\
  \ CPU 硬件虚拟化支持。\n\n### 19.2 Hypervisor 虚拟化\n\n在 Hypervisor 虚拟化中，Hypervisor（虚拟机程序）的任务是为虚拟机处理资源和内存分配，并为更高级的管理和监控工具提供接口。基于\
  \ Hypervisor 的解决方案分为 Type-1 和 Type-2 类。\n\nType-2 Hypervisor（有时称为宿主机型 Hypervisor）作为软件应用程序安装，并运行在宿主机操作系统之上，通过协调客户虚拟机对\
  \ CPU、内存和网络等资源的访问来提供虚拟化能力。图 19-2 展示了使用 Type-2 Hypervisor 虚拟化的系统典型架构：\n\n![](img/type-2_hypervisor_virtualization.png)\n\
  \n图 19-2\n\n为了理解 Type-1 Hypervisor 如何工作，稍微了解一下 Intel x86 处理器架构会有帮助。x86 系列 CPU 提供了一系列被称为“环”（rings）的保护级别，代码可以在其中执行。`ring\
  \ 0` 具有最高级权限，操作系统内核通常运行在该环中。在 `ring 0` 中执行的代码被称为运行在系统空间、内核模式或监视模式。所有其他代码（如运行在操作系统上的应用程序）运行在权限较低的环中，通常是\
  \ `ring 3`。\n\n与 Type-2 Hypervisor 不同，Type-1 Hypervisor（也称为裸金属或原生 Hypervisor）直接运行在宿主机系统的硬件上的\
  \ `ring 0` 中。显然，由于 Hypervisor 占据了 CPU 的 `ring 0`，运行在系统上的任何客户操作系统的内核必须运行在权限较低的 CPU\
  \ 环中。遗憾的是，大多数操作系统内核被显式地写为在 `ring 0` 中运行，原因很简单，因为它们需要执行某些只有在 `ring 0` 才能完成的任务，例如执行特权\
  \ CPU 指令和直接操作内存的能力。近年来，针对这个问题设计出了多种不同的解决方案，下面对每种方案都进行了描述：\n\n### 19.2.1 半虚拟化\n\n\
  在半虚拟化下，客户操作系统的内核经过专门修改以运行在 Hypervisor 上。这通常涉及将任何仅在 CPU 的 `ring 0` 中运行的特权操作替换为对 Hypervisor\
  \ 的调用（称为 `hypercalls`）。Hypervisor 反而代表客户内核执行该任务。这通常将支持限制在开源操作系统（如 `Linux`，它们可以被自由修改）以及所有者已同意针对特定\
  \ Hypervisor 进行相应的必要代码修改的专有操作系统上。尽管存在这些问题，但客户内核直接与 Hypervisor 通信的能力使其与其它虚拟化方法相比，具有更高的性能水平。\n\
  \n### 19.2.2 全虚拟化\n\n全虚拟化为未修改的客户操作系统提供支持。“未修改”一词指的是没有被更改过以运行在 Hypervisor 上的操作系统内核，因此它们仍然像运行在\
  \ CPU 的 `ring 0` 中一样执行特权操作。在这种场景下，Hypervisor 提供 CPU 仿真，用以处理和修改由未修改的客户操作系统内核发出的特权和受保护的\
  \ CPU 操作。遗憾的是，这种仿真过程运行需要消耗时间和系统资源，导致与半虚拟化相比，其性能水平较低。\n\n### 19.2.3 硬件虚拟化\n\n硬件虚拟化利用了\
  \ Intel 和 AMD 最新代 CPU 内置的虚拟化功能。这些技术分别被称为 `Intel VT` 和 `AMD-V`，它们提供了运行未修改的客户虚拟机所需的扩展，且避免了全虚拟化\
  \ CPU 仿真中固有的开销。从非常简单的话来说，这些处理器在 `ring 0` 之上提供了一个额外的权限模式（称为 `ring -1`），Hypervisor\
  \ 可以在其中运行，从而将 `ring 0` 留给未修改的客户操作系统内核使用。\n\n下图说明了 Type-1 Hypervisor 的虚拟化方法：\n\n\
  ![](img/type-1_hypervisor_virtualization.png)\n\n图 19-3\n\n如上图所示，除了虚拟机之外，一个管理操作系统和/或管理控制台也运行在\
  \ Hypervisor 之上，允许系统管理员对虚拟机进行管理。\n\n### 19.3 虚拟机网络\n\n虚拟机无疑需要连接网络才能具有实际用途。一种方案是让客户连接到运行在宿主机操作系统内部的虚拟网络。在这种配置下，虚拟网络上的任何虚拟机都可以互相通信，但对外部网络的访问通过网络地址转换（NAT）提供。当使用虚拟网络和\
  \ NAT 时，每个虚拟机都通过宿主机系统的 IP 地址在外部网络（宿主机所连接的网络）上表示。这是 Fedora 31 上 KVM 虚拟化的默认行为，且通常不需要额外配置。通常情况下，默认会创建一个虚拟网络，由名称\
  \ `default` 和设备 `virbr0` 表示。\n\n\n\n更好的选项是在主机系统上配置一个网络桥接接口，虚拟机可以连接到该接口。这为虚拟机提供了在外部网络上的\
  \ IP 地址，同时也允许虚拟机和宿主机进行通信，这一主题在创建 Fedora 31 KVM 网络桥接接口 章节中有所介绍。\n\n## 总结\n\n虚拟化被定义为在宿主机操作系统内运行多个虚拟机操作系统的能力。目前已经开发了多种虚拟化方法，包括虚拟机操作系统虚拟化和虚拟机程序虚拟化。虚拟机程序虚拟化分为两类，即\
  \ Type-1 和 Type-2。Type-2 虚拟化方案分为半虚拟化、全虚拟化和硬件虚拟化，后者利用了某些 Intel 和 AMD 处理器型号的特殊虚拟化功能。\n\
  \n虚拟机操作系统在网络方面有多种选择，包括 `NAT`、直接连接 (`MacVTap`）和网络桥接配置。\n\n## 20. 在 Fedora 31 上安装\
  \ KVM 虚拟化\n\n早版本的 Fedora 以基于内核的虚拟机 (`KVM`) 和 `Xen` 的形式提供了两种虚拟化平台。在最近的发布中，已删除了对 `Xen`\
  \ 的支持，使得 `KVM` 成为 Fedora 31 提供的唯一虚拟化选项。除了 `KVM` 外，还有如 `VMware` 和 `Oracle VirtualBox`\
  \ 等产品的第三方解决方案。然而，由于 `KVM` 是随 Fedora 31 提供的，这将在本章及后续章节中介绍的解决方案。\n\n在深入安装和运行 `KVM`\
  \ 之前，值得花一点时间讨论它如何融入上一节概述的各种类型虚拟化。\n\n### 20.1 KVM 概述\n\n`KVM` 被归类为 Type-1 虚拟机程序虚拟化解决方案，它通过\
  \ `Intel VT` 和 `AMD-V` 硬件虚拟化支持，实现了对未修改的虚拟机操作系统的全虚拟化。\n\n`KVM` 与许多其他 Type-1 方案的不同在于，它将宿主机\
  \ Linux 操作系统本身变成了虚拟机程序，在运行完整的企业级宿主机操作系统的同时实现了裸金属虚拟化。\n\n### 20.2 KVM 硬件要求\n\n在继续本章之前，我们需要花一点时间讨论在\
  \ `KVM` 环境中运行虚拟机的硬件要求。首先，`KVM` 虚拟化仅适用于某些类型的处理器。如前文所述，这些处理器必须包含 `Intel VT` 或 `AMD-V`\
  \ 技术。\n\n要检查虚拟化支持，请在终端窗口中运行以下命令：\n\n```bash\nlscpu | grep Virtualization:\n```\n\
  \n如果系统包含支持 `Intel VT` 的 CPU，上述命令将提供以下输出：\n\n```\nVirtualization: VT-x\n```\n\n或者，当检测到支持\
  \ `AMD-V` 的 CPU 时，将显示以下输出：\n\n```\nVirtualization: AMD-V\n```\n\n如果 CPU 不支持虚拟化，上述\
  \ `lscpu` 命令将不会显示任何输出。\n\n注意，虽然上述命令仅报告处理器是否支持相应功能，但并不表示该功能当前已在 BIOS 中启用。在实践中，大多数系统的\
  \ BIOS 默认禁用了虚拟化支持。因此，建议在继续此教程之前，检查您的 BIOS 设置，以确保已启用适当的虚拟化技术。\n\n与双启动环境不同，虚拟化环境涉及在单台计算机系统上并发运行两个或多个完整的操作系统。这意味着系统必须足够的物理内存、磁盘空间和\
  \ CPU 处理能力，以舒适地并行容纳所有这些系统。在开始配置和安装过程之前，检查 Fedora 31 以及您所选虚拟机操作系统的最低系统要求，并验证系统是否有足够的资源来处理这两个系统的需求。\n\
  \n### 20.3 为 KVM 虚拟化准备 Fedora 31\n\n与 `Xen` 不同，并不一定需要运行特殊版本的内核来支持 `KVM`。因此，通过安装\
  \ `KVM` 内核模块，标准内核已可以使用 `KVM` 支持，从而消除了安装和从特殊内核启动的需求。\n\n然而，为了避免冲突，如果系统当前运行着启用 `Xen`\
  \ 的内核，请在继续本章其余内容之前，重启系统并在启动菜单中选择非 Xen 内核。\n\n设置和维护基于 `KVM` 的虚拟化系统所需的工具默认安装，除非在 Fedora\
  \ 31 操作系统安装过程中专门选择了它们。要从命令行提示安装 `KVM` 工具，请在终端窗口中执行以下命令：\n\n```bash\ndnf install\
  \ qemu-kvm qemu-img libvirt virt-install libvirt-client\n```\n\n如果您可以访问图形桌面环境，还建议安装\
  \ `virt-manager` 软件包：\n\n```bash\ndnf install virt-manager\n```\n\n## 20.4 验证 KVM\
  \ 安装\n\n在继续之前，检查 `KVM` 安装是否正常工作是值得的。当 `KVM` 安装并运行时，将有两个模块被加载到内核中。可以在终端窗口中运行以下命令来验证这些模块的存在：\n\
  \n```bash\nlsmod | grep kvm\n```\n\n假设安装成功，上述命令应生成类似下面的的输出：\n\n```bash\nlsmod |\
  \ grep kvm\nkvm_intel 237568 0\nkvm 737280 1 kvm_intel\nirqbypass 16384 1 kvm\n\
  ```\n\n注意，如果系统包含 AMD 处理器，`kvm` 模块可能是 `kvm_amd` 而不是 `kvm_intel`。\n\n安装过程还应该配置了在后台运行的\
  \ `libvirtd` 进程。再次使用终端运行以下命令确保 `libvirtd` 正在运行：\n\n```bash\nsystemctl status libvirtd\n\
  ```\n\n```\nlibvirtd.service - Virtualization daemon\n  Loaded: loaded (/usr/lib/systemd/system/libvirtd.service;\
  \ enabled; vendor preset: enabled)\n  Active: active (running) since Wed 2019-03-06\
  \ 14:41:22 EST; 3min 54s\n```\n\n如果进程未运行，可以通过以下方式启动：\n\n```bash\nsystemctl enable\
  \ --now libvirtd\nsystemctl start libvirtd\n```\n\n如果有桌面环境，可以通过选择“活动”并在搜索框中输入“virt”来运行\
  \ `virt-manager` 工具。当虚拟机管理器出现时，点击启动它。加载后，管理器应如下所示：\n\n![](img/rhel_8_virt-manager.png)\n\
  \n如果没有列出 `QEMU/KVM` 项，选择`文件 -> 连接`菜单选项，并在生成的对话框中选择`QEMU/KVM 虚拟机程序`然后点击`连接`按钮：\n\n\
  ![](img/rhel_8_virt-manager_add_connection.png)\n\n如果管理器未连接到虚拟化进程，右键点击列出的项并从弹出菜单中选择连接。\n\
  \n### 20.5 总结\n\n`KVM` 是一种 Type-1 虚拟机程序虚拟化解决方案，它通过 `Intel VT` 和 `AMD-V` 硬件虚拟化支持，实现了对未修改的虚拟机操作系统的全虚拟化。它是\
  \ Fedora 31 自带的默认虚拟化解决方案，可以在具有适当处理器支持的 Fedora 31 系统上快速安装。安装并启用 `KVM` 支持后，接下来的章节将概述在\
  \ Fedora 31 主机上安装和管理虚拟机的某些选项。\n\n## 21. 使用 Cockpit 和 virt-manager 创建 KVM 虚拟机\n\n\
  \n\n\n\n基于 KVM 的虚拟机可以在 Fedora 31 上轻松地使用 `virt-install` 命令行工具、`virt-manager` GUI\
  \ 工具或 Cockpit Web 控制台的“虚拟机”模块进行配置。出于本章的考虑，我们将使用 Cockpit 和 `virt-manager` 工具在 Fedora\
  \ 31 宿主机上将 Fedora 发行版安装为 KVM 虚拟机。在继续之前，需要注意的是 `virt-manager` 在 Fedora 31 中已弃用，其意图是未来将完全由\
  \ Cockpit 模块取代。尽管如此，截至 Fedora 31，`virt-manager` 仍然可用，并包含了尚未集成到 Cockpit 虚拟机模块的功能。\n\
  \n虚拟机的命令行创建方法将在下一章介绍，标题为使用 virt-install 和 virsh 创建 KVM 虚拟机。\n\n### 21.1 安装 Cockpit\
  \ 虚拟机模块\n\n默认情况下，标准的 Cockpit 安装中可能不包含虚拟机模块。假设 Cockpit 已安装并配置好，可以通过以下方式安装虚拟机模块：\n\
  \n```bash\ndnf install cockpit-machines\n```\n\n安装完成后，下次登录 Cockpit 界面时，导航面板中会出现“虚拟机”选项（图\
  \ 21-1 中标记为 A）：\n\n![](img/fedora_cockpit_virtual_machines.png)\n\n图 21-1\n\n###\
  \ 21.2 在 Cockpit 中创建虚拟机\n\n在 Cockpit 中创建虚拟机，只需点击图 21-1 中标记为 B 的“创建虚拟机”按钮即可显示创建对话框。\n\
  \n在对话框中，为机器输入名称，并选择安装介质是通过 URL 访问的 ISO 还是本地文件系统路径。理想情况下，还应为客户选择供应商和操作系统类型信息。虽然并非必需，这将有助于系统针对客户优化虚拟机。\n\
  \n还要指定用于操作系统安装的虚拟磁盘驱动器的大小以及分配给虚拟机的内存量：\n\n![](img/fedora_cockpit_new_vm.png)\n\n\
  图 21-2\n\n在本示例中，保持不勾选“立即启动虚拟机”选项，一旦新虚拟机配置完成，点击“创建”按钮来构建虚拟机。创建过程完成后，新虚拟机将如图 21-3\
  \ 所示显示在 Cockpit 中：\n\n![](img/fedora_cockpit_vm_install.png)\n\n图 21-3\n\n正如“虚拟化技术概述”中所描述，KVM\
  \ 在网络配置方面为虚拟机提供了多种选项。要查看和更改虚拟机的网络设置，点击如图 21-4 所示的“网络接口”选项卡，然后点击网络条目旁“编辑”按钮：\n\n\
  ![](img/fedora_cockpit_vm_network.png)\n\n图 21-4\n\n在生成的对话框中，可以使用“网络类型”菜单更改网络连接类型，例如从虚拟网络（NAT）更改到直接连接（MacVTap）。\n\
  \n### 21.3 开始安装\n\n要启动新虚拟机并从指定的安装介质开始安装客户操作系统，请点击上方图 21-3 中高亮的“安装”按钮。Cockpit 将启动虚拟机并切换到“控制台”视图，客户操作系统的屏幕将出现：\n\
  \n![](img/fedora_cockpit_vm_running.png)\n\n图 21-5\n\n如果安装失败，检查消息消息如下：\n\n```\n\
  Could not open ‘<path to iso image>’: Permission denied\nDomain installation does\
  \ not appear to have been successful.\n```\n\n这通常是因为 QEMU 模拟器以名为 `qemu` 的用户运行，该用户没有访问\
  \ ISO 安装镜像所在目录的权限。要解决此问题，打开终端窗口（如果系统是远程的，请使用 SSH 连接），切换到 ISO 镜像文件目录，并如下将 `qemu`\
  \ 用户添加到父目录的访问控制列表 (ACL) 中：\n\n```bash\ncd /path/to/iso/directory\nsetfacl --modify\
  \ u:qemu:x ..\n```\n\n进行更改后，按如下方式检查设置：\n\n```bash\ngetfacl ..\n# file: ..\n# owner:\
  \ demo\n# group: demo\nuser::rwx\nuser:qemu:--x\ngroup::---\nmask::--x\nother::---\n\
  ```\n\n完成这些更改后，再次点击“安装”按钮完成安装。\n\n要完成安装，在“控制台”视图的屏幕上进行交互，就像您在物理硬件上安装操作系统一样。\n\n\
  还可以使用 `virt-viewer` 工具从 Cockpit 浏览器会话外部连接并显示虚拟机的图形控制台。要在 Fedora 31 系统上安装 `virt-viewer`，运行以下命令：\n\
  \n```bash\ndnf install virt-viewer\n```\n\n`virt-viewer` 工具也适用于 Windows 系统，可以从以下\
  \ URL 下载：[`virt-manager.org/download/`](https://virt-manager.org/download/)\n\n\
  要连接本地主机运行的虚拟机，只需运行 `virt-viewer` 并生成的对话框中选择您要连接的虚拟机：\n\n![](img/rhel_8_virt-viewer-select_vm.png)\n\
  \n图 21-6\n\n或者，也可以指定虚拟机名称跳过选择对话框，例如：\n\n```bash\nvirt-viewer myFedoraGuest\n```\n\
  \n要使用 SSH 连接远程主机上运行的虚拟机，可以使用以下命令：\n\n```bash\nvirt-viewer --connect qemu+ssh://<user>@<host>/system\
  \ <guest name>\n```\n\n例如：\n\n```bash\nvirt-viewer --connect qemu+ssh://root@192.168.1.122/system\
  \ MyFedoraGuest\n```\n\n使用此技术时需要注意的是，连接之前会被提示两次用户密码。\n\n一旦创建虚拟机，可以使用 Cockpit 界面监控机器并执行重启、关闭或删除操作系统等任务。“磁盘”面板也包含一个选项，可向虚拟机添加附加磁盘。\n\
  \n### 21.4 使用存储卷和存储池\n\n创建虚拟机时，它通常会关联至少一个虚拟磁盘驱动器。这些虚拟磁盘驱动器的镜像存储在存储池中。存储池的形式可以是本地文件系统上的现有目录、文件系统分区、物理磁盘设备、逻辑卷管理（LVM）卷组甚至是远程网络文件系统（NFS）。\n\
  \n每个存储池被划分为一个或多个存储卷。存储卷通常是代表单个驱动器的单独文件，也可以以物理磁盘分区、整个磁盘或 LVM 卷组的形式存在。\n\n使用之前的步骤创建虚拟机时，会创建一个默认存储池，虚拟机镜像可以存储在其中。可以在\
  \ Cockpit 虚拟机界面中通过上方图 21-1 标记为 C 的面板顶部“存储池”选项来查看此默认存储池。\n\n选中后，将出现下方图 21-7 所示的屏幕，包含系统中当前配置的存储池列表：\n\
  \n![](img/fedora_cockpit_vm_storage_pool.png)\n\n图 21-7\n\n\n\n\n\n在上面的示例中，默认存储池位于根文件系统上，并将虚拟机镜像存储在\
  \ `/var/lib/libvirtd/images` 目录。要查看池中包含的存储卷，请选择如图 21-8 所示的 `Storage Volumes` 标签：\n\
  \n![](img/fedora_cockpit_vm_storage_pool_volumes.png)\n图 21-8\n\n对于 Fedora 客系统，存储卷以名为\
  \ `myFedoraGuest.qcow2` 的镜像文件形式存在。要查找特定虚拟机使用的是哪个存储卷，返回 Virtual Machine Cockpit 的主界面，选择该虚拟机并如图\
  \ 21-9 所示显示 `Disks` 面板：\n\n![](img/fedora_cockpit_vm_disks.png)\n图 21-9\n\n虽然出于测试目的和早期实验，使用默认存储池是可以接受的，但建议为常规虚拟化用途创建额外的存储池。要创建一个新的存储池，在\
  \ Cockpit 中显示 `Storage Pools` 屏幕并点击 `Create Storage Pool` 按钮，显示如图 21-10 所示的对话框：\n\
  \n![](img/fedora_cockpit_vm_create_pool.png)\n图 21-10\n\n在上面的示例中，正在创建一个名为 `MyPool`\
  \ 的新存储池，它使用了本地文件系统中挂载为 `/MyPool` 的文件系统分区（磁盘驱动器、分区和挂载点的主题将在本章节的“向 Fedora 31 系统添加新硬盘”中介绍）。一旦创建，该池将列在\
  \ Cockpit 存储池屏幕中，并可以在创建新虚拟机时用于包含存储卷。\n\n在编写时，无法从 Cockpit 界面内部在自定义存储池中创建新的存储卷。但是，可以如下节所述，在虚拟机管理器中进行此操作。\n\
  \n### 21.5 使用 virt-manager 创建虚拟机\n\n需要注意的是，`virt-manager` 现在已弃用，一旦 Virtual Machines\
  \ Cockpit 扩展完全实现，它将被移除。本章的剩余部分将探索使用此工具创建新的虚拟机。\n\n### 21.6 启动虚拟机管理器\n\n首先，在终端窗口中运行\
  \ `virt-manager` 从命令行启动虚拟机管理器。加载后，虚拟机管理器将在显示以下屏幕之前提示当前活动用户的密码：\n\n![](img/rhel_8_virt-manager_main.png)\n\
  图 21-11\n\n主屏幕列出了系统上运行的当前虚拟机。此时应该只有一个虚拟机，即运行在主机系统上的虚拟机监控程序。默认情况下，管理器应该连接到主机。如果未连接，请右键点击列表中的项并从弹出菜单中选择\
  \ `Connect` 以连接到主机系统。\n\n要创建一个新的虚拟系统，点击 `new virtual machine` 按钮（工具栏最左侧的按钮）或右键点击监控程序项并从生成的菜单中选择\
  \ `New`，以显示新虚拟机向导的第一个屏幕。在 `Name` 字段中为虚拟系统输入一个合适的描述性名称。在此屏幕上，还要选择安装客操作系统的媒体位置。可以是\
  \ CD 或 DVD 驱动器、本地主机可访问的 ISO 镜像文件、使用 HTTP、FTP、NFS 或 PXE 进行网络安装，或现有虚拟机的磁盘镜像：\n\n![](img/rhel_8_virt-manager_create_vm.png)\n\
  图 21-12\n\n### 21.7 配置 KVM 虚拟系统\n\n点击 `Forward` 将显示一个寻求有关安装过程额外信息的屏幕。显示的屏幕和所需的信息将取决于上一个屏幕中所选择。例如，如果选择了\
  \ CD、DVD 或 ISO，此屏幕将询问 ISO 文件或物理媒体设备的具体位置。此屏幕还会尝试根据指定的安装媒体识别要安装的客操作系统的类型和版本（例如，Windows\
  \ 版本或 Linux 发行版）。如果无法识别，请取消勾选 `Automatically detect from installation media / source`\
  \ 选项，输入操作系统名称的前几个字符，并从可能的匹配列表中选择一个选项：\n\n![](img/rhel_8_virt-manager_select_os.png)\n\
  图 21-13\n\n完成这些设置后，点击 `Forward` 按钮配置 CPU 和内存设置。最佳设置将取决于主机上存在的 CPU 数量和物理内存量，以及与新虚拟机并行运行的其他应用程序和虚拟机的需求：\n\
  \n![](img/virtual_virt-manager_new_vm_memory.png)\n图 21-14\n\n在创建虚拟机之前要配置的最后一项是客操作系统和相应用户数据的存储空间。它以虚拟磁盘镜像或预存存储的形式存在。虚拟磁盘驱动器本质是位于主机计算机文件系统的镜像文件，虚拟机将其视为物理磁盘驱动器。\n\
  \n可以使用可用选项创建指定大小的镜像磁盘、选择预存卷或创建指定格式（`raw`、`vmdk`、`ISO` 等）的存储卷。除非你有使用特定格式的需求（例如迁移到\
  \ VMware 虚拟环境需要使用 `vmdk`）或需要专用磁盘，否则在此屏幕上只需指定大小即可：\n\n![](img/rhel_8_virt-manager_storage.png)\n\
  图 21-15\n\n如果使用默认设置，虚拟机将使用默认存储池中的存储卷。要使用本节之前创建的自定义 `MyPool` 存储池，在点击 `Manage...`\
  \ 按钮之前启用 `Select or create custom` 选项。\n\n在存储卷对话框中，选择左面板中的 `MyPool` 项，然后点击主面板中的\
  \ `+` 按钮创建新的存储卷：\n\n![](img/rhel_8_virt-manager_add_volume.png)\n图 21-16\n\n注意，对话框左下角的\
  \ `+` 按钮也可创建新的存储池，作为使用 Cockpit 界面的替代方案。\n\n在配置屏幕（图 21-17\n图 21-17\n\n完成这些设置后，再次点击\
  \ `Forward` 按钮。最后一个屏幕显示配置摘要。检查显示的信息。也可以高级选项更改客虚拟网络配置，如图 21-18 所示：\n\n![](img/centos_8_cockpit_vm_network_macvtap.png)\n\
  图 21-18\n\n### 21.8 启动 KVM 虚拟机\n\n点击 `Finish` 按钮开始创建过程。虚拟机管理器将在启动客系统之前创建磁盘并配置虚拟机。新虚拟机将出现在\
  \ `virt-manager` 主窗口中，状态设置为 `Running`，如图 21-19 所示：\n\n![](img/rhel_8_virt-manager_vm_running.png)\n\
  图 21-19\n\n默认情况下，虚拟机的控制台应该出现在虚拟机查看器窗口中。若要在以后任何时间查看运行机器的控制台，请确保它在虚拟机列表中被选中，并从工具栏中选择\
  \ `Open` 按钮。虚拟机查看器应准备好开始安装过程。\n\n\n\n\n\n![](img/rhel_8_virt-manager_viewer.png)\n\
  \n图 21-20\n\n从现在起，只需按照操作系统的安装指令在 KVM 虚拟机中安装客体操作系统。\n\n### 21.9 总结\n\n本章概述了在 Fedora\
  \ 31 主机系统上创建新的基于 KVM 的虚拟机的两种不同方法。第一种方案涉及使用 `Cockpit` Web 界面来创建和管理虚拟机。这种方法的优点是不需要访问在宿主机系统上运行的桌面环境。另一种方案是使用\
  \ `virt-manager` 图形化工具。尽管 `virt-manager` 在 Fedora 31 中已弃用，并可能在后续版本中被移除，但 `virt-manager`\
  \ 目前提供了 `Cockpit Virtual Machines` 扩展尚未提供的选项。在 `virt-manager` 被移除时，预计 `Cockpit`\
  \ 将提供相同或优的功能。\n\n在涵盖这些基础知识后，下一章将介绍如何从命令行创建虚拟机。\n\n## 22. 使用 virt-install 和 virsh\
  \ 创建 KVM 虚拟机\n\n在上一章中，我们探索了如何使用 `Cockpit` 和 `virt-manager` 图形化工具在 Fedora 31 主机上创建\
  \ KVM 客体操作系统。在本章中，我们将关注使用 `virt-install` 和 `virsh` 命令行工具创建基于 KVM 的虚拟机。这些工具提供了 `virt-manager`\
  \ 和 `Cockpit` 选项的所有功能，并且额外优点是可以在脚本中使用来实现虚拟机的自动化创建。此外，`virsh` 命令允许根据配置文件包含的规范来创建虚拟机。\n\
  \n`virt-install` 工具允许通过提供一系列命令行选项来创建新的虚拟机。本章假设已安装必要的 KVM 工具。有关这些要求的详细信息，请阅读标题为在\
  \ Fedora 31 上安装 KVM 虚拟化的章节。\n\n### 22.1 运行 virt-install 构建 KVM 客体系统\n\n`virt-install`\
  \ 实用接受大量的命令行参数，用于提供与正在创建的虚拟机相关的配置信息。某些命令行选项是强制性的（特别是必须提供名称、内存和磁盘存储），而其他一些是可选的。\n\
  \n至少，`virt-install` 命令通常需要以下参数：\n\n* `--name` - 分配给虚拟机的名称。\n* `--memory` - 分配给虚拟机的内存量。\n\
  * `--disk` - 用于虚拟机存储的镜像文件的名称和位置。该文件将由 `virt-install` 在虚拟机创建期间创建，除非指定了 `--import`\
  \ 选项以指示要使用现有的镜像文件。\n* `--cdrom` 或 `--location` - 指定包含客体操作系统安装介质的本地路径或远程 ISO 镜像的\
  \ URL。\n\n在使用 `virt-install` 时可用的所有参数的摘要可以在 man 页中找到：\n\n```\n$ man virt-install\n\
  ```\n\n### 22.2 一个 Fedora 31 virt-install 命令示例\n\n参考上述命令行参数列表，我们现在可以查看使用 `virt-install`\
  \ 工具的命令行结构示例。\n\n注意，为了能够显示虚拟机并完成安装，在 `virt-install` 实用程序启动虚拟机后，需要将 `virt-viewer`\
  \ 实例连接到虚拟机。默认情况下，`virt-install` 会在虚拟机运行后自动尝试启动 `virt-viewer`。如果 `virt-viewer` 不可用，`virt-install`\
  \ 将等待直到建立 `virt-viewer` 连接。如果宿主机系统具有图形桌面，则`virt-viewer` 会话可能在宿主机上本地运行，或者从远程客户端建立连接，如使用\
  \ Cockpit 和 virt-manager 创建 KVM 虚拟机章节所述。\n\n以下命令创建了一个新的 KVM 虚拟机，该虚拟机配置为使用 KVM 半虚拟化运行\
  \ Fedora 29。它创建一个新的 10GB 磁盘镜像，为虚拟机分配 1024MB 内存，并为安装介质 ISO 镜像配置了虚拟 CD 设备：\n\n```bash\n\
  virt-install --name MyFedora --memory 1024 --disk path=/tmp/myFedora.img, size=10\
  \ --network network=default --os-variant fedora29 --cdrom /tmp/Fedora-Server-dvd-x86_64-29-1.2.iso\n\
  ```\n\n当创建过程运行时，`virt-install` 命令将显示创建进度的状态更新：\n\n```\nStarting install...\nAllocating\
  \ ‘MyFedora.img’ | 10 GB 00:00:01\nDomain installation still in progress. Waiting\
  \ for installation to complete.\n```\n\n一旦客体系统创建完成， `virt-viewer` 屏幕将出现，其中包含指定的安装介质加载的操作系统安装程序：\n\
  \n![](img/rhel_8_virt-install_viewer.png)\n\n图 22-1\n\n从现在起，按照客体操作系统的标准安装程序进行。\n\
  \n### 22.3 从命令行启动和停止虚拟机\n\n既然已经从命令行创建了虚拟机，理理你将来可能也需要从命令行启动它。这可以通过 `virsh` 命令来实现，引用创建时分配给虚拟机的名称。例如：\n\
  \n```bash\nvirsh start MyFedora\n```\n\n同样，可以如下向虚拟机发送关闭信号：\n\n```bash\nvirsh shutdown\
  \ MyFedora\n```\n\n如果虚拟机对关闭信号没有响应，可以使用 `destroy` 指令强制停止（带有数据丢失的风险）：\n\n```bash\n\
  virsh destroy MyFedora\n```\n\n### 22.4 从配置文件创建虚拟机\n\n`virsh create` 命令可以将配置文件的名称作为参数来创建虚拟机。配置文件使用\
  \ XML 格式。可能是最易的创建配置文件的方法是导出现有虚拟机的配置并对其进行修改。这可以通过 `virsh dumppxml` 命令实现。以下命令将名为 MyFedora\
  \ 的虚拟机配置数据输出到 `MyFedora.xml` 文件：\n\n```bash\nvirsh dumppxml MyFedora > MyFedora.xml\n\
  ```\n\n一旦生成了文件，将其加载到编辑器中以检查并更改虚拟机的设置。\n\n至少必须更改 `<name>`、`<uuid>` 和镜像文件路径 `<source\
  \ file>` 以避免与来源虚拟机冲突。对于 UUID，可以直接从文件中删除该行。\n\n虚拟化类型、内存分配和 CPU 数量也可以根据需要进行更改。一旦修改了文件，可以通过以下方式创建新虚拟机：\n\
  \n```bash\nvirsh create MyFedora.xml\n```\n\n### 22.5 总结\n\nKVM 提供了 `virt-install`\
  \ 和 `virsh` 命令行工具，作为使用 `Cockpit` 和 `virt-manager` 工具创建和管理虚拟机实例的快速高效替代方案。这些工具的优点是可以在脚本中使用来实现虚拟机的自动化创建和管理。`virsh`\
  \ 命令还包含基于 XML 的配置文件创建虚拟机实例的选项。\n\n\n\n\n本章的目标是介绍在 Fedora 31 上创建网络桥接的步骤，使虚拟机系统能够共享宿主机的一个或多个物理网络连接，同时允许虚拟机和宿主机系统之间进行通信。\n\
  \n在本章的剩余部分中，我们将介绍配置 Fedora 31 网络桥接供基于 KVM 的虚拟机操作系统使用的必要步骤。\n\n## 23.1 获取当前网络设置\n\
  \n可以使用 NetworkManager 命令行界面工具 `nmcli` 创建网络桥接。`NetworkManager` 在 Fedora 31 系统上默认安装并启用，它负责检测和连接网络设备，并提供了一个管理网络配置的接口。\n\
  \n可以通过如下命令显示宿主机系统上的当前网络连接列表：\n\n```bash\n# nmcli con show\n```\n\nNAME UUID TYPE\
  \ DEVICE\n\nWired connection 1 3a3fecfc-e571-35ee-89c4-47a6e0e120c0 ethernet eno1\n\
  virbr0 d66ead56-e941-4c00-bd98-b8f3cbaaf4f3 bridge virbr0\n```\n\n在上述输出中，我们可以看到宿主机通过一个名为\
  \ `eno1` 的设备建立了以太网连接，以及一个名为 `virbr0` 的默认桥接接口，该接口提供了对基于 NAT 的虚拟网络的访问，KVM 虚拟机系统默认连接在该网络。\n\
  \n同样，可以使用以下命令识别系统当前配置的设备（包括虚拟和物理设备）：\n\n```bash\n# nmcli device show\n```\n\n```bash\n\
  GENERAL.DEVICE: eno1\nGENERAL.TYPE: ethernet\nGENERAL.HWADDR: AC:16:2D:11:16:73\n\
  GENERAL.MTU: 1500\nGENERAL.STATE: 100 (connected)\nGENERAL.CONNECTION: eno1\nGENERAL.CON-PATH:\
  \ /org/freedesktop/NetworkManager/ActiveConnection/1\nWIRED-PROPERTIES.CARRIER:\
  \ on\nIP4.ADDRESS[1]: 192.168.86.59/24\nIP4.GATEWAY: 192.168.86.1\nIP4.ROUTE[1]:\
  \ dst = 0.0.0.0/0, nh = 192.168.86.1, mt = 100\nIP4.ROUTE[2]: dst = 192.168.86.0/24,\
  \ nh = 0.0.0.0, mt = 100\nIP4.DNS[1]: 192.168.86.1\nIP4.DOMAIN[1]: lan\nIP6.ADDRESS[1]:\
  \ fe80::6deb:f739:7d67:2242/64\nIP6.GATEWAY: --\nIP6.ROUTE[1]: dst = fe80::/64,\
  \ nh = ::, mt = 100\nIP6.ROUTE[2]: dst = ff00::/8, nh = ::, mt = 256, table=255\n\
  GENERAL.DEVICE: virbr0\nGENERAL.TYPE: bridge\nGENERAL.HWADDR: 52:54:00:59:30:22\n\
  GENERAL.MTU: 1500\nGENERAL.STATE: 100 (connected)\nGENERAL.CONNECTION: virbr0\n\
  GENERAL.CON-PATH: /org/freedesktop/NetworkManager/ActiveConnection/2\nIP4.ADDRESS[1]:\
  \ 192.168.122.1/24\nIP4.GATEWAY: --\nIP4.ROUTE[1]: dst = 192.168.122.0/24, nh =\
  \ 0.0.0.0, mt = 0\nIP6.GATEWAY: --\n```\n\n上述部分输出表明，执行命令的宿主机系统包含一个物理以太网设备 (`eno1`)\
  \ 和虚拟桥接 (`virbr0`)。\n\n也可以使用 `virsh` 命令列出系统当前配置的虚拟网络：\n\n```bash\n# virsh net-list\
  \ --all\n```\n\nName State Autostart Persistent\n----------------------------------------------------------\n\
  \ default active yes yes\n```\n\n此时，唯一的虚拟机网络是 `virbr0` 提供的默认网络。现在已经获取了当前网络配置的一些基本信息，下一步是创建一个连接到物理网络设备（在本例中名为\
  \ `eno1` 的设备）的网络桥接。\n\n### 23.2 从命令行创建网络桥接\n\n创建网络桥接的第一步是向网络配置添加一个新连接。这可以通过 `nmcli`\
  \ 工具实现，指定该连接为桥接，并为连接和接口提供名称：\n\n```bash\n# nmcli con add ifname br0 type bridge\
  \ con-name br0\n```\n\n一旦添加了连接，就需要在物理设备 `eno1`（从设备）和桥接连接 `br0`（主设备）之间建立桥接从接口，如下：\n\
  \n```bash\n# nmcli con add type bridge-slave ifname eno1 master br0\n```\n\n此时，`NetworkManager`\
  \ 连接列表应显示如下：\n\n```bash\n# nmcli con show\n```\n\nNAME UUID TYPE DEVICE\nbr0 09931967-07a3-4544-a6e0-7a4b3f66195b\
  \ bridge br0\nWired connection 1 3a3fecfc-e571-35ee-89c4-47a6e0e120c0 ethernet eno1\n\
  ```\n\n\n\n\n```\nvirt-install --name MyFedora --memory 1024 --disk path=/tmp/myFedora.img,size=10\
  \ --network network=br0 --os-variant fedora29 --cdrom /home/demo/Downloads/Fedora-Server-dvd-x86_64-29-1.2.iso\n\
  ```\n\n当客户操作系统运行时，它将与宿主机系统处于同一个物理网络，而不再位于基于 NAT 的虚拟网络。\n\n要修改现有的虚拟机以使用桥接，请使用 `virsh\
  \ edit` 命令。此命令会将 XML 定义文件加载到编辑器中，可以在其中进行更改并保存：\n\n```\nvirsh edit GuestName\n```\n\
  \n默认情况下，文件将加载到 `vi` 编辑器中。要使用不同的编辑器，只需更改 `$EDITOR` 环境变量，例如：\n\n```bash\nexport EDITOR=gedit\n\
  ```\n\n要更改默认虚拟网络，请找到文件中的 `<interface>` 部分，对于基于 NAT 的配置，内容如下：\n\n```xml\n<interface\
  \ type='network'>\n      <mac address='<your mac address here>'/>\n      <source\
  \ network='default'/>\n      <model type='virtio'/>\n      <address type='pci' domain='0x0000'\
  \ bus='0x01' slot='0x00' function='0x0'/>\n</interface>\n```\n\n或者，如果虚拟机使用的是直接连接，条目可能如下：\n\
  \n```xml\n<interface type='direct'>\n      <mac address='<your mac address here>'/>\n\
  \      <source dev='eno1' mode='vepa'/>\n      <model type='virtio'/>\n      <address\
  \ type='pci' domain='0x0000' bus='0x01' slot='0x00' function='0x0'/>\n</interface>\n\
  ```\n\n要使用桥接，在保存文件之前，将源网络属性更改为如下：\n\n```xml\n<interface type='network'>\n      <mac\
  \ address='<your mac address here>'/>\n      <source network='br0'/>\n      <model\
  \ type='virtio'/>\n      <address type='pci' domain='0x0000' bus='0x01' slot='0x00'\
  \ function='0x0'/>\n</interface>\n```\n\n如果虚拟机已经在运行，更改在重启之前将不会生效。\n\n### 23.5 使用\
  \ `nm-connection-editor` 创建桥接网络\n\n如果宿主机系统上有本地或远程桌面访问，则大部分桥接配置过程可以使用 `nm-connection-editor`\
  \ 图形化工具完成。要使用该工具，在桌面内打开终端窗口并输入以下命令：\n\n```bash\nnm-connection-editor\n```\n\n当工具加载后，将出现如图\
  \ 23-1 所示的窗口，其中列出了当前配置的网络连接（本质上与 `nmcli con show` 命令生成的输出相同）：\n\n![](img/fedora_network_editor.png)\n\
  \n图 23-1\n\n要创建一个新连接，点击位于窗口左下角的“+”按钮。从弹出的对话框（图 23-2）中，从菜单中选择桥接（Bridge）选项：\n\n![](img/rhel_8_connection_editor_new_bridge.png)\n\
  \n图 23-2\n\n选中桥接选项后，点击“创建...”按钮进入桥接配置屏幕。在点击位于桥接连接列表右侧的“添加”（Add）按钮之前，先将连接名称和接口名称字段都更改为\
  \ `br0`，如图 23-3 中高亮所示：\n\n![](img/rhel_8_nm_connection_editor_bridge_config.png)\n\
  \n图 23-3\n\n在连接类型对话框（图 23-4）中，在点击“创建...”按钮之前，将菜单设置更改为以太网（Ethernet）：\n\n![](img/rhel_8_nm_connection_manager_bridge_type.png)\n\
  \n图 23-4\n\n现在会弹出另一个对话框，其中需要配置桥接从属连接。在此对话框中，从设备（Device）菜单中选择桥接要连接的物理网络（例如 `eno1`）：\n\
  \n![](img/rhel_8_nm_connection_editor_slave_device.png)\n\n图 23-5\n\n点击“保存”按钮以应用更改并返回编辑\
  \ `br0` 对话框（如上方图 23-3 所示）。在此对话框中，点击“保存”按钮创建桥接。返回主窗口后，新的桥接和从属连接应该现在已列在其中：\n\n![](img/fedora_bridge_configured.png)\n\
