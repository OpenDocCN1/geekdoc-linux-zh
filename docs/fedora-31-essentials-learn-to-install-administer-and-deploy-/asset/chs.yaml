- "# Fedora 31 必备：学习安装、管理和部署 Fedora 31 系统\n\n\n\n![](img/fedora_31_front_cover_large.png)\n\
  \n\n\nISBN-13: 978-1-951442-11-8\n\n\n## 1. 引言\n\nFedora Linux 发行版由红帽公司（Red Hat,\
  \ Inc.）支持并由 Fedora 项目开发，是一个开源操作系统，旨在红帽企业 Linux 发行版（通常缩写为 `RHEL`，读作 `rell`）采用之前对最新的\
  \ Linux 开发和技术进行现场测试。这使得 Fedora 成为一个令人兴奋的尖端操作系统，对于在这些功能出现在企业和关键任务环境之前获取最新 Linux 开发和功能的经验的理想选择。《Fedora\
  \ 31 精要》旨在提供有关 Fedora 31 发行版的安装、使用和管理的详细信息。对于初学者，本书涵盖了操作系统安装、GNOME 桌面环境基础知识、配置电子邮件和\
  \ Web 服务器，以及使用 App Streams 安装软件包和系统更新等主题。还涵盖了如与 Microsoft Windows 双系统启动等额外的安装主题，以及所有重要的安全主题，如配置防火墙以及用户和组管理。\n\
  \n对于经验丰富的用户，书中详细介绍了如远程桌面访问、Cockpit Web 界面、逻辑卷管理 (`LVM`)、磁盘分区、交换空间管理、KVM 虚拟化、安全 Shell\
  \ (`SSH`)、Linux 容器以及使用 Samba 和 NFS 进行文件共享等主题，以提供对这一企业级操作系统的全面概述。\n\n### 1.1 超用户规范\n\
  \nFedora 与大多数 Linux 类似，有两种类型的用户账户：一种是标准用户账户，对操作系统的许多管理文件和功能的访问受限；另一种是具有特权的超级用户 (`root`)\
  \ 账户。通常，用户可以通过登录为 root 用户，或者使用 `su -` 命令并输入 root 密码来获取 root 权限。在接下来的示例中，用户通过 `su\
  \ -` 命令获取 root 权限：\n\n```\n[neil@demo-server ~]$ su -\n\nPassword:\n\n[root@demo-server\
  \ ~]#\n```\n\n注意，普通用户的命令提示符以 `$` 符号结尾，而 root 用户则使用 `#` 字符。在命令行操作时，这是一个非常有用的指示，可以判断你当前是否正在以\
  \ root 用户身份发布命令。\n\n如果 `su -` 命令失败，则由于安全原因，系统上的 root 账户可能已被禁用。在这种情况下，可以使用下述的 `sudo`\
  \ 命令。\n\n或者，非 root 用户可以通过 `sudo` 命令执行需要 root 权限的单条命令。考虑以下尝试使用最新补丁和软件包更新操作系统的操作：\n\
  \n```\n[neil@demo-server ~]$ dnf update\n\nNot root, Subscription Management repositories\
  \ not updated\n\nError: This command has to be run under the root user.\n```\n\n\
  可选地，可以配置用户账户使其拥有 root 级权限。与其使用 `su -` 命令先获取 root 权限，具有管理权限的用户账户可以使用 `sudo` 运行其他受限的命令。\n\
  \n```\n[neil@demo-server]$ sudo dnf update\n\n我们相信你已经听过本地系统管理员的教训。这通常归结为以下三点：\n\
  \    #1) 尊重他人的隐私。\n    #2) 在输入之前思考。\n    #3) 权力越大，责任越大。\n\n[sudo] password for neil:\n\
  \nUpdating Subscription Management repositories.\n.\n.\n```\n\n为了在不重复使用 `sudo` 命令的情况下执行多条命令，可以通过以下方式访问具有持久超级用户权限的命令提示符：\n\
  \n```\n[neil@demo-server]$ sudo su -\n\n[neil@demo-server]#\n```\n\n在本书开头尽早提出这个问题的原因是，书中概述的许多命令行示例将需要\
  \ root 权限。与其重复地在每个命令行示例前加上以 root 身份运行命令的说明，将将使用行首的命令提示符来指示该命令是否需要以 root 身份执行。如果命令可以作为普通用户运行，则命令将以\
  \ `$` 命令提示符开头，如下：\n\n```\n$ date\n```\n\n相反，如果命令需要 root 权限，则命令将以 `#` 命令提示符开头：\n\n\
  ```\n# dnf install openssh\n```\n\n### 1.2 反馈\n\n我们希望你对购买本书感到满意。如果你在书中发现任何错误，或有任何意见、问题或疑虑，请通过\
  \ feedback@ebookfrenzy.com 与我们联系。\n\n### 1.3 勘误\n\n虽然我们尽力确保书中内容的准确性，但一本涵盖如此规模和复杂领域的书籍不可免会包含一些错误和遗漏。书中所有已知问题将与解决方案一起列在以下\
  \ URL 中：\n\n[`www.ebookfrenzy.com/errata/fedora31.html`](https://www.ebookfrenzy.com/errata/fedora31.html)\n\
  \n如果你发现了未列出的错误，请通过发送电子邮件给我们的支持团队 feedback@ebookfrenzy.com 告知我们。\n\n## 2. Linux 简史\n\
  \nFedora 是 Linux 操作系统众多变体（也称为发行版）之一。它由 Fedora 项目社区开发，并由一家位于北卡罗来纳州罗利的名为红帽（Red Hat,\
  \ Inc.）的美国公司赞助。该公司成立于 90 年代中期，由 Marc Ewing 和 Bob Young 拥有的两个公司合并。然而，Linux 的起源可以追溯到更远。本章将概述\
  \ Linux 操作系统和红帽公司的历史，然后解释 Fedora 如何融入这一图景。\n\n### 2.1 到底什么是 Linux？\n\n\n\n\n\n要理解\
  \ Linux 的历史，我们首先必须追溯到 20 世纪 60 年代后期的 AT&T 实验室。在此期间，AT&T 已经停止了对名为 `Multics` 的新操作系统的开发。两位\
  \ AT&T 工程师 Ken Thompson 和 Dennis Ritchie 决定将他们从 `Multics` 项目中学到的知识付诸实践，并创造出一个名为\
  \ `UNIX` 的新操作系统，该系统迅速在企业和学术机构中流行并被广泛采用。\n\n各种专有的 `UNIX` 实现版本陆续上市，包括由 IBM (`AIX`)、惠尔士宝\
  \ (`HP-UX`) 和 太阳微系统公司 (`SunOS` 和 `Solaris`) 创建的版本。此外，Andrew S. Tanenbaum 还创建了一个名为\
  \ `MINIX` 的类 `UNIX` 操作系统，专为教学用途设计，并向大学提供源代码访问。\n\n### 2.3 谁创建了 Linux？\n\nLinux 的起源可以追溯到两个人的工作和哲学。Linux\
  \ 操作系统的核心是一个被称为 `kernel`（内核）的东西。这是操作系统运行所需的核心功能集。`kernel` 管理系统资源，并处理硬件与应用程序之间的通信。Linux\
  \ `kernel` 由 Linus Torvalds 开发，由于他不喜欢 `MS-DOS`，并且由于不及于等待用于新的 Intel 80386 微处理器的 `MINIX`\
  \ 可用，他决定编写一个属于自己的、类 `UNIX` `kernel`。当他完成 `kernel` 的第一个版本时，他以开源许可发布了它，允许任何人下载源代码并自由地使用和修改，而无需向\
  \ Linus 支付任何费用。\n\n大约同一时间，自由软件基金会的自由和开源软件的坚实支持者 Richard Stallman 正在开发他自己的开源操作系统。然而，Stallman\
  \ 最初并没有专注于 `kernel`，而是决定从开发所有使用和维护操作系统所必需的 `UNIX` 工具、公用程序和编译器的开源版本开始。当他完成这些基础设施的开发后，显而易见的解决方案似乎是将他的工作与\
  \ Linus 编写的 `kernel` 结合，从而创建一个完整的操作系统。这种组合被称为 `GNU/Linux`。纯主义者坚持认为 Linux 应该始终被称为\
  \ `GNU/Linux`（事实上，曾有一段时间，Richard Stallman 拒绝接受任何未将 Linux 称为 `GNU/Linux` 的出版物的采访）。考虑到自由软件基金会开发的\
  \ `GNU` 工具构成了 `GNU/Linux` 的重要且至关重要的部分，这并不是 unreasonable。遗憾的是，大多数人和出版物简单地将 Linux\
  \ 称为 Linux，这种情况可能一直持续下去。\n\n### 2.4 红帽的早期\n\n1993 年，Bob Young 创建了一家名为 `ACC Corporation`\
  \ 的公司，根据 Young 的说法，他从“妻子的缝纫衣橱”经营这家公司。`ACC` 这个名字本是为了代表目录业务，也是他妻子经营的一家名为“Antiques\
  \ and Collectibles of Connecticut”的小型企业的缩写。通过 `ACC` 目录业务销售的物品中包括 Linux 光盘和相关的开源软件。\n\
  \n大约同一时间，Marc Ewing 创建了自己的自己的 Linux 发行版公司，并将其命名为 `Red Hat Linux`（因为他在卡内基梅梅隆大学期间习惯于戴红色的棒球帽）。\n\
  \n1995 年，`ACC` 收购了 `Red Hat`，更名为 `Red Hat, Inc.`，并经历了快速且巨大的增长。Bob Young 在公司于 1999\
  \ 年 8 月上市后不久就辞去了 CEO 职位，从那以后一直在从事许多业务和慈善活动，包括一家名为 `Lulu` 的按需打印图书出版公司以及两支加拿大职业运动队的所有权。2018\
  \ 年，IBM 宣布了收购 `Red Hat, Inc.` 的计划，交易价值达 340 亿美元。\n\n### 2.5 红帽支持\n\n`Red Hat Linux`\
  \ 的早期版本是通过软磁盘和 CD 发送给客户的（当然，这早于宽带互联网连接的普及）。当用户在软件上遇到问题时，他们只能通过电子邮件联系红帽。事实上，Bob Young\
  \ 经常开玩笑说，这对于限制支持请求非常有效，因为当客户意识到他们需要帮助时，他们的计算机通常已经无法运行，因此无法用它来发送电子邮件向红帽支持团队寻求帮助。在随后的几年里，红帽提供了与付费订阅挂钩的更高级别的支持，现在提供了从“自救”（无支持）到高级支持的各种水平的支持服务。\n\
  \n### 2.6 开源\n\n`Red Hat Enterprise Linux 8` 是红帽目前的商业产品，主要针对企业、任务关键型安装。它也是红帽提供的不断扩展的产品和服务生态系统的基石。`RHEL`\
  \ 是一个开源产品，因为你可以免费下载源代码，并在你需要时自己构建该软件（这项任务绝非轻而易举）。\n\n### 2.7 Fedora 项目\n\n红帽还赞助\
  \ Fedora 项目，其目标是以 Fedora Linux 的形式提供免费的操作系统（包括源码和二进制文件）。Fedora Linux 还是许多新功能的试验场，这些功能最终会被采纳到红帽企业级\
  \ Linux 中。例如，Red Hat Enterprise Linux 8.0 在很大程度上是基于了 `Fedora 29`。\n\n### 2.8 CentOS\
  \ - 免费替代方案\n\n对于无法负担红帽订阅费用的用户，以 CentOS 操作系统的形式还提供了另一种选择。CentOS 项目最初是一项社区驱动的努力，现在是与红帽的合作，它获取\
  \ Red Hat Enterprise Linux 的源代码，移除红帽标识和订阅要求，对其进行编译并提供发行版供下载。当然，虽然 CentOS 提供的操作系统在许多方面与\
  \ RHEL 相同，但它不支持红帽的支持。\n\n\n\n\n\nFedora 可以安装在纯磁盘环境环境中（即清除整个磁盘上的所有现有分区并将其完全用于 Fedora），也可以安装在双启动环境中，即\
  \ Fedora 与磁盘上的另一个操作系统（通常是微软 Windows（Microsoft Windows）操作系统家族的成员）共存。\n\n在本章中，我们将介绍从本地或远程安装介质进行纯磁盘安装的方法。关于与\
  \ Windows 10 系统的双启动安装，将在 “在 Windows 上与 Fedora 31 实施双启动” 章节中介绍。\n\n## 3.1 Fedora\
  \ 安装选项\n\n您可以从以下网页免费下载 Fedora：\n\n[`getfedora.org/`](https://getfedora.org/)\n\n\
  该页面提供了多种下载选项，具体取决于操作系统的安装和使用方式：\n\n- **Fedora Workstation**：下载工作站版操作系统的安装介质。此版本适用于需要图形化桌面环境的台式机和笔记本系统，仅适用于\
  \ 64 位 x86 系统。工作站版可以以 ISO 镜像的形式下载，然后按照本章后文概述的步骤将其写入 USB 驱动器。但是，如果您在 Windows 或 macOS\
  \ 系统上进行下载，最简单的选项是下载 `Fedora Media Writer` 工具。可以使用该工具下载所需的 Fedora 版本并将其写入 USB 驱动器。无论选择哪种下载选项，工作站介质都允许您在执行安装之前运行\
  \ Live Fedora 会话来测试 Fedora。\n\n- **Fedora Server**：下载服务器版操作系统的安装介质。此镜像旨在在不需要图形桌面环境的服务器上进行安装，适用于\
  \ x86 和 ARM aarch64 64 位系统。虽然服务器选项仅提供下载 ISO 镜像的链接，但可以使用工作站页面提供的 `Fedora Media Writer`\
  \ 来下载服务器镜像并将其写入 USB 驱动器。\n\n在下载服务器版时，有以下可用选项：\n\n- **标准 ISO 镜像**：包含了安装 Fedora Server\
  \ 版的所有内容。这允许在不需要网络或互联网连接的情况下进行安装。\n- **网络安装 Netinstall ISO 镜像**：包含启动安装过程所需的最小内容，在此过程中，将根据配置阶段做出的选择下载额外的包。\n\
  \n### 3.2 选择安装选项\n\n显然，在开始安装之前，需要在 Workstation（工作站版）和两个 Server（服务器版）镜像之间做出决定。如果您想在安装之前先尝试\
  \ Fedora 31，那么 Fedora Workstation 选项是最佳解决方案，因为它允许您从安装介质启动 Fedora，而无需先将其安装到磁盘驱动器上。如图图\
  \ 3-1\n\n图 3-1\n\n如果不需要图形化桌面环境，且目标系统没有互联网访问，则推荐 Server 版标准 ISO 镜像，因为这允许在不需要下载任何额外包的情况下构建功能完整的服务器。\n\
  \n对于系统具有互联网访问且不需要在安装前对 Fedora 31 进行测试的安装，Server 版 Netinstall ISO 镜像提供了最大的灵活性。此镜像比其他选项小得多，并允许从广泛的预定义配置中进行选择（包括\
  \ Server 和 Workstation 选项，以及最小安装 Minimal Install 配置）。\n\n本章中的示例将基于从 Fedora Server\
  \ Netinstall 镜像安装 Fedora 31，并在安装过程中选择安装完整的 Fedora Workstation 版。如果您倾向于从 Fedora Workstation\
  \ 实时会话或标准 Server 版镜像安装，本章中的步骤仍然适用，尽管仅可以使用部分配置选项。\n\n### 3.3 获取 Fedora 31 安装介质\n\n\
  为了本书的目的，请从以下 URL 下载 Fedora 31 Netinstall ISO 镜像：\n\nhttps://download.fedoraproject.org/pub/fedora/linux/releases/31/Server/x86_64/iso/Fedora-Server-netinst-x86_64-31-1.9.iso\n\
  \nDVD ISO 镜像是自包含的，包含了安装 Fedora 31 系统所需的所有包，并按照以下约定命名：\n\n`Fedora-Server-netinst-<architecture>-<version>.iso`\n\
  \n例如，适用于 64 位 Intel 系统的 Fedora 31 DVD 镜像命名如下：\n\n`Fedora-Server-netinst-x86_64-31-1.9.iso`\n\
  \n下载镜像后，可以将其刻录到磁盘，或者使用下一节中的步骤将介质写入 USB 驱动器，配置您的虚拟化环境将其视为 DVD 驱动器，或者使用本章后文概述的步骤通过网络连接访问安装镜像。\n\
  \n### 3.4 将 ISO 安装镜像写入 USB 驱动器\n\n如今，操作系统的安装更有可能是通过 USB 驱动器而非 DVD 进行。在下载了 Fedora\
  \ 31 的 ISO 安装镜像后，将该镜像写入 USB 驱动器的步骤将取决于驱动器连接到 Linux、macOS 还是 Windows 系统。本节剩余部分概述的步骤假设\
  \ USB 驱动器是新的，或者已经过重新格式化以移除任何现有数据或分区：\n\n### 3.4.1 Linux\n\n在 Linux 上向 USB 驱动器写入\
  \ ISO 镜像的第一步是识别设备名称。在插入 USB 驱动器之前，通过列出设备来识别系统上的存储设备：\n\n```bash\nls /dev/*\nsda1\n\
  ```\n\n将 USB 驱动器插入 Linux 系统并运行 `dmesg` 命令获取系统消息，其中之一将是关于 USB 驱动器的报告，格式如下：\n\n```\n\
  [445597.98045] sd 6:0: [sdb] Attached removable disk\n```\n\n输出告诉我们设备名称将包含 `sdb`，我们可以通过再次列出\
  \ `/dev` 来确认：\n\n```bash\nls /dev/sd*\nsdb\n```\n\n从该输出可以看出 USB 驱动器已被分配到 `/dev/sdb`。在将\
  \ ISO 镜像写入设备之前的下一步是运行 `findmnt` 命令以确保它没有被自动挂载：\n\n```bash\nfindmnt /dev/sdb\nTARGET\
  \ SOURCE FSTYPE OPTIONS\n/run/media/neil/... ext3 rw,nosuid,no\n```\n\n如果 `findmnt`\
  \ 命令指示 USB 驱动器已挂载，请在继续之前卸载它：\n\n```bash\numount /run/media/neil/d6bf9574-7e31-4f54-8b1\n\
  ```\n\n文件系统卸载后，使用以下 `dd` 命令将镜像写入驱动器：\n\n```bash\ndd if=/path/to/iso/<image name>.iso\
  \ of=/dev/sdb bs=512k\n```\n\n取决于镜像大小和运行系统的速度，写入过程可能需要一段时间（长达 10-15 分钟）。写入完成后，会出现类似下面的输出，此时\
  \ USB 驱动器即可用于安装 Fedora 31：\n\n```\n5956+0 records in\n5956+0 records out\n3122659328\
  \ bytes (3.1 GB, 2.9 GiB) copied, 426.234 s, 7.3 MB/s\n```\n\n### 3.4.2 macOS\n\n\
  在连接到 macOS 系统的 USB 驱动器上写入 ISO 镜像的第一步是使用 `diskutil` 工具识别设备。在连接 USB 设备之前，打开终端窗口并运行以下命令：\n\
  \n```bash\ndiskutil list\n```\n\n```\n/dev/disk0 (internal, physical):\n# TYPE NAME\
  \ SIZE IDENTIFIER\n  0: GUID_partition_scheme *1.0 TB disk0\n  1: EFI EFI 209.7\
  \ MB disk0s1\n```\n\n\n\n\n\n2: Apple_APFS Container disk2 1000.0 GB disk0s2\n\n\
  ```\n/dev/disk1 (internal):\n   #: TYPE NAME SIZE IDENTIFIER\n   0: GUID_partition_scheme\
  \ 28.0 GB disk1\n   1: EFI EFI 314.6 MB disk1s1\n   2: Apple_APFS Container disk2\
  \ 27.7 GB disk1s2\n/dev/disk2 (synthesized):\n   #: TYPE NAME SIZE IDENTIFIER\n\
  \   0: APFS Container Scheme - +1.0 TB disk2\n                              Physical\
  \ Stores disk1s2, disk0s2\n   1: APFS Volume Macintosh HD 473.6 GB disk2s1\n   2:\
  \ APFS Volume Preboot 42.1 MB disk2s2\n   3: APFS Volume Recovery 517.0 MB disk2s3\n\
  \   4: APFS Volume VM 1.1 GB disk2s4\n```\n\n在建立了检测到的设备基准后，将 USB 驱动器插入 macOS 系统的端口并再次运行命令。将会出现相同的的结果，但会多出一个类似于下面的\
  \ USB 驱动器条目：\n\n```\n/dev/disk3 (external, physical):\n   #: TYPE NAME SIZE IDENTIFIER\n\
  \   0: 16.0 GB disk3\n```\n\n在上述示例中，USB 驱动器已被分配到 `/dev/disk3`。在继续之前，请按照以下方式卸载磁盘：\n\
  \n```\n$ diskutil unmountDisk /dev/disk3\n```\n\n`disk3` 上所有卷的卸载已成功\n\n最后，使用 `dd`\
  \ 命令将 ISO 镜像写入设备，注意引用原始磁盘设备（`/dev/rdisk3`）并在提示时输入你的用户密码：\n\n```bash\n$ sudo dd if=/path/to/iso/image.iso\
  \ of=/dev/rdisk3 bs=1m\n```\n\n镜像写入完成后后，USB 驱动器即已就绪。\n\n### 3.4.3 Windows\n\nWindows\
  \ 平台有许多免费工具可以将 ISO 镜像写入 USB 驱动器，但其中一个专门为写入 Linux ISO 镜像编写的工具是 `Fedora Media Writer`，可以从以下\
  \ URL 下载：\n\nhttps://getfedora.org/en/workstation/download/\n\n安装后，启动写入工具并选择如图 3-2\
  \ 中突出显示的 `Custom image` 选项。或者，如果你选择在安装 Fedora 之前使用 Fedora Workstation 介质尝试 Fedora，只需点击\
  \ `Fedora Workstation 31` 选项即可下载并将镜像写入 USB 驱动器。\n\n![](img/fedora_31_media_writer.png)\n\
  \n图 3-2\n\n在结果的文件选择框中，导航并选择 Fedora 31 安装 ISO 镜像，点击 `Open` 按钮。选择镜像后，将弹出一个对话框，可以在其中将镜像写入\
  \ USB 驱动器。在点击 `Write to Disk` 按钮之前，从设备菜单中选择目标 USB 驱动器：\n\n![](img/fedora_31_media_writing.png)\n\
  \n图 3-3\n\n镜像写入设备后，该设备已准备好用于执行安装。\n\n### 3.5 安装 Fedora 31\n\n将 Fedora 31 安装介质插入相应的驱动器并启动系统。如果系统尝试从硬盘启动，你将需要进入电脑的\
  \ BIOS 设置并更改启动顺序，使其首先从安装介质驱动器启动。系统启动后，你将看到以下屏幕：\n\n![](img/fedora_31_boot_install_boot_screen.png)\n\
  \n图 3-4\n\n使用方向键在选项之间导航，并使用 `<Enter>` 键进行选择。如果选择了 `Troubleshooting` 选项，将显示图 3-5\
  \ 所示的屏幕，包括从本地驱动器上的当前操作系统启动（如果已安装）、测试系统内存或救急已安装的 Fedora 31 系统等选项。还有一个选项可用于在没有图形控制台的系统上以基本图形模式进行安装：\n\
  \n![](img/fedora_31_boot_install_troubleshooting.png)\n\n图 3-5\n\n在主屏幕上选择安装选项，稍等片刻将出现图形化安装程序的第一个屏幕：\n\
  \n![](img/fedora_31_boot_install_language.png)\n\n图 3-6\n\n在第一个屏幕上选择你偏好的语言，然后点击\
  \ `Continue` 进入如图 3-7 所示的主安装屏幕：\n\n![](img/fedora_31_installation_summary.png)\n\
  \n图 3-7\n\n从选择 `Network & Host Name` 选项开始，启用系统上的网络设备并在点击 `Apply` 按钮之前输入主机名：\n\n\
  ![](img/fedora_31_boot_install_network.png)\n\n图 3-8\n\n如果你的网络连接需要额外设置，点击 `Configure...`\
  \ 按钮以访问图 3-9 所示的高级网络设置：\n\n![](img/rhel_8_installation_networking.png)\n\n图 3-9\n\
  \n一旦定义了主机名并启用网络连接，点击 `Done` 返回主屏幕。如果你想更改键盘、语言或时间和日期设置，请从主屏幕选择 `Localization` 选项。在\
  \ `Time & Date` 屏幕上，根据你的地理位置进行选择。还提供了一个使用 `Network Time` 的选项，与网络时间服务器同步。\n\n由于安装是从本地介质进行的，因此不需要更改\
  \ Installation Source 设置。要从远程服务器执行安装，选择 `Installation Source`，启用网络选项并指定安装介质的位置。安装介质可以是安装在远程服务器上的\
  \ ISO 镜像（有关使用 NFS 与远程系统共享 Fedora 31），或者是远程仓库的 URL（仓库本质上是构成操作系统的软件、软件包和应用程序集合，可以从中进行安装）。\n\
  \n默认情况下，安装程序将执行 Fedora 31 服务器版安装。要选择不同的安装配置，选择 `Software Selection` 选项显示所示屏幕：\n\n\
  ![](img/fedora_31_boot_install_packages.png)\n\n图 3-10\n\n使用左侧面板选择基本配置，右侧面板添加你确定系统启动后需要的任何额外软件包。如果\
  \ Fedora 31 系统打算用于图形桌面环境，请选择 `Fedora Workstation` 选项。如果不需要桌面环境且你不确定要在系统上安装哪些软件包，请使用\
  \ `Minimal install` 选项，并在系统启动后根据需要安装软件包。这避免了安装可能永远不需要的包。\n\n配置好基本设置后，下一步是决定如何划分硬盘以容纳操作系统。\n\
  \n### 3.6 为 Fedora 31 分区磁盘\n\n当选择 `Installation Destination` 选项时，安装程序将显示如图 3-11\
  \ 所示的屏幕：\n\n![](img/fedora_31_install_destination.png)\n\n图 3-11\n\n默认情况下，安装程序配置为使用当前选择磁盘驱动器的可用空间自动安装操作系统，并配置标准分区大小。如果磁盘之前包含另一个操作系统，这些现有分区不会被删除，可能会在安装\
  \ Fedora 31 后在硬盘上留下未使用空间。要删除任何现有分区以便回收并供 Fedora 31 使用，启用 `I would like to make additional\
  \ space available` 选项并点击 `Done` 按钮显示图 3-12 所示的对话框：\n\n![](img/rhel_8_installation_reclaim_space.png)\n\
  \n图 3-12\n\n\n\n\n\n要回收空间，请选择一个不再需要的分区，并点击`Delete`（删除）按钮将其标记为删除。一旦选择了所有要删除的分区，点击`Reclaim\
  \ Space`（回收空间）按钮执行删除。回收后的空间将由 Fedora 31 安装程序自动使用。\n\n若要根据可用空间的分配方式手动配置磁盘布局，请将`Storage\
  \ Allocation`（存储分配）设置从`Automatic`（自动）更改为`Custom`（自定义），并点击`Done`（完成）显示`Manual Partitioning`（手动分区）屏幕（图\
  \ 3-13）：\n\n![](img/fedora_31_boot_install_manual_partition.png)\n\n图 3-13\n\n手动分区屏幕提供了使用逻辑卷管理（LVM）或标准分区配置磁盘的。LVM\
  \ 是推荐选项，因为它在系统运行后在管理分区大小方面提供了灵活性（LVM 将在“向 Fedora 31 卷组和逻辑卷添加新磁盘”章节中进行详细介绍）。\n\n\
  一旦选择了分区方案，最后一步是决定分区的大小和相应的文件系统挂载点。通常，`Click here to create them automatically`（点击此处自动创建）选项提供的默认配置将满足大多数系统需求。要手动创建分区并分配挂载点，请点击`+`按钮手动声明并分配每个分区。\n\
  \n另一个选项是选择自动创建分区，然后使用生成的屏幕根据需要手动更改分区配置。例如，图 3-14 显示了选择自动创建选项定义的分区配置，并允许在对磁盘进行任何更改之前修改每个分区的设置：\n\
  \n![](img/fedora_31_boot_custom_partition.png)\n\n图 3-14\n\n磁盘配置完成后后，点击`Done`（完成），检查对磁盘将进行的更改的摘要（图\
  \ 3-15），然后点击`Accept Changes`（接受更改）按钮：\n\n![](img/fedora_31_boot_install_partition_summary.png)\n\
  \n图 3-15\n\n### 3.7 添加用户和 Root 访问\n\n开始安装之前的最后一步是向系统添加用户账户。要实现此操作，请点击主安装屏幕上的`User\
  \ Creation`（用户创建）选项并输入用户凭据和密码：\n\n![](img/fedora_31_boot_install_add_user.png)\n\
  \n图 3-16\n\n如果需要用户在系统上执行管理任务，在点击`Done`（完成）按钮之前启用`Make this user administrator`（将此用户设置为管理员）选项（除非下文所述启用\
  \ root 账户，否则至少有一个用户具有管理员权限）。这将允许账户通过“引言”章节中概述的`sudo` 命令执行受限任务。\n\nroot 或超级用户账户是一个特殊用户，它不需要使用`sudo`\
  \ 命令即可拥有系统管理权限。为了安全，该账户默认是禁用的。要启用此账户，选择`Root Password`（Root 密码）选项，输入 root 密码并关闭`Lock\
  \ root account`（锁定 root 账户）选项。如果您希望使用`SSH`远程以 root 用户身份登录系统（该主题在“在 Fedora 31 上配置基于密钥的身份验证”中涵盖），请启用`Allow\
  \ root SSH login with password`（允许密码 root SSH 登录）选项。但除非您知道需要 root 访问，否则通常建议保持账户禁用状态。\n\
  \n### 3.8 物理安装\n\n在选择了相应的软件包后，点击`Begin Installation`（开始安装）将开始分区磁盘并安装与所选安装设置匹配软件包。在此阶段，将出现一个屏幕（图\
  \ 3-17）：\n\n![](img/fedora_31_installing.png)\n\n图 3-17\n\n所有系统软件包安装并配置完成后，移除安装媒体并点击`Reboot`（重启）重启系统。\n\
  \n### 3.9 最终配置步骤\n\n系统启动时在控制台上显示的内容取决于您是否从软件选择安装屏幕中选择了`Workstation`（工作站）选项。如果在安装期间选择了此项，将出现\
  \ GNOME 显示管理器（`GDM`）登录屏幕。如果选择了最小或服务器配置选项，将显示基于文本的登录提示。无论配置如何，请使用在安装过程最后步骤创建的用户登录系统。\n\
  \n在 Workstation 安装的情况下，GNOME 初始设置工具将启动，提供配置选项，如语言、键盘布局、位置服务以及与 Google 和 Facebook\
  \ 在内的在线账户连接。在配置这些设置（或跳过）后，将 GNOME 桌面欢迎屏幕，其中包含如何使用桌面环境的教程链接。\n\n### 3.10 安装更新\n\n\
  与现在的大多数操作系统一样，Fedora 发行版的每个特定版本在向公众发布后继续演进。这通常表现为错误修复和安全更新，偶尔还会有可以通过互联网下载安装到您的系统中的新功能。\n\
  \n最佳实践规定，安装 Fedora 后第一步是确保将任何可用更新应用到系统。这可以通过 Terminal 窗口中的命令行提示符使用`dnf` 软件包管理器工具来实现。要检查是否有可用更新，只需运行以下命令：\n\
  \n```\ndnf check-update\n```\n\n再次使用`dnf` 工具应用任何待处理更新：\n\n```bash\ndnf update\n\
  ```\n\n执行时，`dnf` 工具将提供可用更新的软件包列表并请求执行更新。\n\n更新完成后，安装基本完成，Fedora 31 已就绪。\n\n### 3.11\
  \ 显示启动消息\n\n在启动过程中，Fedora 将显示红帽图形启动（RHGB）屏幕，该屏幕隐藏了系统加载时生成的所有启动消息。若要在启动期间显示这些消息（如图\
  \ 3-18 所示），只需在系统启动时按下键盘`Esc`键：\n\n![](img/centos_8_boot_messages.png)\n\n图 3-18\n\
  \n可以通过更改默认行为来默认始终显示消息，编辑 `/etc/default/grub`文件并更改`GRUB_CMDLINE_LINUX`设置，该设置默认类似于：\n\
  \n`GRUB_CMDLINE_LINUX=\"... rhgb quiet\"`\n\n要移除图形启动界面以便无需按`Esc`键即可查看消息，请从设置中删除`rhgb`选项：\n\
  \n`GRUB_CMDLINE_LINUX=\"... rhgb quiet\"`\n\n此更改将导致系统仅显示部分生成的启动消息。要显示系统生成的所有消息，请同时删除`quiet`选项：\n\
  \n`GRUB_CMDLINE_LINUX=\"... quiet\"`\n\n做出更改后，运行以下命令生成新的启动配置，以便在下次系统启动时生效：\n\n```bash\n\
  grub2-mkconfig --output=/boot/grub2/grub.cfg\n```\n\n### 3.12 总结\n\n\n\n\n\n使用 Fedora\
  \ 31 的第一步是安装操作系统。对于云服务器，此任务通常在根据云服务提供商提供的一系列选项为系统选择操作系统镜像时自动完成。然而，在您自己的硬件上进行安装，则需要下载\
  \ ISO 镜像格式的安装介质，将该镜像写入 DVD 或 USB 驱动器等合适的存储设备中，并从其启动。一旦运行，安装过程允许配置一系列选项，包括网络设置、安装应从本地介质还是远程服务器或存储库进行、要安装的软件包以及磁盘分区。安装完成后，建议安装自原始安装镜像创建以来可能发布的任何操作系统更新。\n\
  \n## 4. 与 Windows 双启动 Fedora 31\n\nFedora 与绝大多数 Linux 发行版一样，可以很方便地与几乎任何版本的 Windows（包括\
  \ Windows 10 在内）共存在在硬盘驱动器上。这种概念被称为“双启动”。本质上，当你启动系统时，将看到一个菜单，提供启动你的 Fedora 31 安装系统或\
  \ Windows 的选项。显然，你一次只能运行一个操作系统，但值得注意的是，无论你的 Windows 分区是使用 NTFS、FAT16 还是 FAT32 格式化的，你都可以从\
  \ Fedora 31 访问硬盘驱动器上 Windows 分区的文件。\n\n这种安装方法涉及缩小现有 Windows 分区的大小，然后在回收的空间中安装 Fedora\
  \ 31。本章假设 Fedora 31 正安装在一个当前运行 Windows 10 的系统上。\n\n### 4.1 调整分区大小\n\n为了在已包含 Windows\
  \ 安装的磁盘驱动器上适应 Fedora，第一步涉及缩小 Windows 分区以腾出空间。建议的操作方案是在尝试安装 Fedora 31 之前，使用 Windows\
  \ 磁盘管理界面缩小分区大小。\n\n要在 Windows 10 上访问磁盘管理，右键点击“开始”菜单，并在生成的菜单中选择“磁盘管理”，如图 4-1 所示：\n\
  \n![](img/rhel_8_win_10_disk_management_start.png)\n\n图 4-1\n\n加载后，磁盘管理工具将显示系统检测到的磁盘驱动器的图形表示：\n\
  \n![](img/rhel_8_win_10_disk_management_main.png)\n\n图 4-2\n\n右键点击你想要缩小的分区，从弹出菜单中选择“收缩卷...”。该工具将计算在不丢失数据的情况下卷可以缩小的最大量（此过程取决于分区的总大小，可能需要几分钟）。一旦分析完成，将出现一个类似于图\
  \ 4-3 所示的对话框：\n\n![](img/rhel_8_win_10_disk_management_shrink.png)\n\n图 4-3\n\n\
  在`输入要收缩的空间量（MB）`字段中指定一个值，并点击`收缩`按钮继续。。一旦调整大小的操作完成，使用 Fedora 31 安装介质重新启动（如“在空白磁盘驱动器上安装\
  \ Fedora 31”中概述），并利用新的空闲空间进行安装。在 Fedora 安装过程中，可以通过在“安装摘要”屏幕上选择“安装目标”选项，并确保选中了“自动存储配置”选项来实现。这将\
  \ Fedora 自动安装到 Windows 分区缩小时创建的未分配空间中。\n\n安装完成后，重启系统，你会发现启动屏幕上除了 Fedora 之外，Windows\
  \ 也是一个选项：\n\n![](img/fedora_31_windows_10_boot_menu.png)\n\n图 4-4\n\n### 4.2 修改默认启动选项\n\
  \n当系统启动时，会出现启动选项屏幕并等待 5 秒让用户选择操作系统。如果在超时之前未进行任何选择，将启动默认操作系统。在新配置的系统上，默认操作系统将是标准的（非救援）Fed\
  \ 镜像。然而，可以在 Fedora 内部更改此默认。\n\n一系列启动配置选项（包括 5 秒超时和“在空白磁盘驱动器上安装 Fedora 31”中概述的启动\
  \ RHGB 设置）都在 `/etc/default/grub` 文件中声明，该文件在新安装中的内容如下：\n\n```bash\nGRUB_TIMEOUT=5\n\
  GRUB_DISTRIBUTOR=\"$(sed ‘s, release .*$,,g’ /etc/system-release)\"\nGRUB_DEFAULT=saved\n\
  GRUB_DISABLE_SUBMENU=true\nGRUB_TERMINAL_OUTPUT=\"console\"\nGRUB_CMDLINE_LINUX=\"\
  resume=/dev/mapper/fedora-swap rd.lvm.lv=fedora/root rd.lvm.lv=fedora/swap rhgb\
  \ quiet\"\nGRUB_DISABLE_RECOVERY=\"true\"\nGRUB_ENABLE_BLSCFG=true\n```\n\n更改默认启动系统的第一步是在此文件中声明\
  \ `GRUB_SAVEDEFAULT` 设置：\n\n```bash\nGRUB_TIMEOUT=5\nGRUB_DISTRIBUTOR=\"$(sed 's,\
  \ release .*$,,g' /etc/system-release)\"\nGRUB_DEFAULT=saved\nGRUB_SAVEDEFAULT=true\n\
  ```\n\n此设置允许在启动配置中保存一个新的默认值。接下来，运行 `grub2-set-default` 命令，使用将第一个选项计为 0 的编号系统来更改默认。例如，如果\
  \ Windows 10 选项位于位置 3，则将 Windows 10 设为默认的命令为：\n\n```bash\ngrub2-set-default 2\n\
  ```\n\n运行 `grub2-editenv list` 命令检查设置是否生效。更改默认后，按如下方式重新生成启动配置文件：\n\n### 4.3 从 Fedora\
  \ 31 访问 Windows 分区\n\n在双启动配置下运行 Fedora 时，仍然可以访问位于 Windows 分区上的文件。这可以通过从命令行手动挂载分区来实现。但在在此之前，需要在系统上安装一些额外的包。首先需要下载并安装\
  \ `fuse` 内核模块：\n\n```bash\ndnf install fuse\nmodprobe fuse\n```\n\n安装所需的软件包后，下一步是创建一个目录作为我们\
  \ Windows 分区的挂载点。在示例中，我们将创建一个名为 `/mnt/windows` 的目录：\n\n```bash\nmkdir /mnt/windows\n\
  ```\n\n为了识别分配给 Windows 分区的设备名称，请如下使用 `fdisk` 命令：\n\n```bash\nfdisk -l\n```\n\n在上述输出中，我们需要访问的主\
  \ Windows 分区由 `/dev/sda2` 表示。接下来，我们需要运行 `mount` 命令（假设 Windows 分区为 `/dev/sda2` 且格式为\
  \ NTFS）：\n\n```bash\nmount /dev/sda2 /mnt/windows\n```\n\n列出挂载点顶层目录的内容检查挂载是否成功：\n\
  \n```bash\nls /mnt/windows\n```\n\n\n\n\n\n若要在每次系统启动时自动挂载，只需向 `/etc/fstab` 文件中添加相应的挂载行即可：\n\
  \n```\n/dev/sda2 /mnt/windows ntfs defaults 0 0\n```\n\n若要随时卸载 Windows 文件系统：\n\n\
  ```bash\numount /mnt/windows\n```\n\n### 4.4 总结\n\nFedora 31 可以通过创建双启动环境，与 Windows\
  \ 操作系统在在同一块硬盘上安全地共存。这涉及到在执行安装之前，通过缩小 Windows 系统占用的空间来为 Fedora 31 留出空间。要从 Fedora\
  \ 内部访问 Windows 文件系统，需要安装并使用 `Fuse NTFS` 驱动程序来挂载 Windows 分区。\n\n## 5. 将 Windows 磁盘分区分配给\
  \ Fedora 31 \n\n在上一章节中，我们查看了如何在与 Windows 相同的磁盘上进行安装。这种所谓的“双启动”（dual boot）配置允许用户在单个硬盘驱动器上安装两个操作系统，并在系统上电时选择启动其中一个。\n\
  \n本章适用于那些已经决定足够喜欢 Fedora 31，并准备从磁盘中完全删除 Windows，并将产生的空间用于 Linux 的用户。在接下来的节中，我们将逐步逐步完成这一过程。\n\
  \n### 5.1 卸载 Windows 分区\n\n如果按照与 Windows 一起进行 Fedora 31 双启动 章节中的步骤从 Fedora 31 内部挂载了\
  \ Windows 分区，则在继续本章之前，应当卸载该分区。假设 Windows 分区被挂载为 `/mnt/windows`，可以通过以下方式卸载：\n\n```bash\n\
  umount /mnt/windows\n```\n\n如果之前添加过 `/mnt/windows` 自动挂载，也应该编辑 `/etc/fstab` 文件将其移除。\n\
  \n### 5.2 从磁盘删除 Windows 分区\n\n为 Fedora 释放 Windows 分区的第一步是删除该分区。然而，在此之前，务必从 Windows\
  \ 和 Fedora 分区备份您任何需要保留的数据。完成此操作后，即可安全地继续本章。\n\n为了删除 Windows 分区，我们首先需要使用 `fdisk`\
  \ 工具识别它们所在的磁盘：\n\n```bash\nfdisk -l\n```\n\n```\nDisk /dev/sda: 50 GiB, 53687091200\
  \ bytes, 104857600 sectors\nUnits: sectors of 1 * 512 = 512 bytes\nSector size (logical/physical):\
  \ 512 bytes / 512 bytes\nI/O size (minimum/optimal): 512 bytes / 512 bytes\nDisklabel\
  \ type: dos\nDisk identifier: 0xe3673009\nDevice Boot Start End Sectors Size Id\
  \ Type\n/dev/sda1 * 2048 1126399 1124352 549M 7 HPFS/NTFS/exFAT\n/dev/sda2 1126400\
  \ 53655551 52529152 25G 7 HPFS/NTFS/exFAT\n/dev/sda3 53655552 55752703 2097152 1G\
  \ 83 Linux\n/dev/sda4 55752704 104857599 49104896 23.4G 5 Extended\n/dev/sda5 55754752\
  \ 104857599 49102848 23.4G 8e Linux LVM\n```\n\n在上面的示例输出中，系统包含一个由设备名称 `/dev/sda`\
  \ 引用的物理磁盘驱动器。在该硬盘上有五个分区，分别通过设备名称 `/dev/sda1` 到 `/dev/sda5` 访问。根据 System 列中的值，有两个\
  \ NTFS 分区。第一个是 Windows 系统分区，而第二个要大得多的 NTFS 分区是包含 Windows 操作系统和用户数据的 Windows 启动分区。\n\
  \n要删除分区，请使用包含分区的磁盘设备名称（在本例中为 `/dev/sda`）启动 `fdisk` 工具，并按照指示再次显示分区和扇区信息：\n\n```bash\n\
  fdisk /dev/sda\n```\n\n```\nWelcome to fdisk (util-linux 2.32.1).\nChanges will\
  \ remain in memory only, until you decide to write them.\nBe careful before using\
  \ the write command.\nCommand (m for help): p\nDisk /dev/sda: 50 GiB, 53687091200\
  \ bytes, 104857600 sectors\nUnits: sectors of 1 * 512 = 512 bytes\nSector size (logical/physical):\
  \ 512 bytes / 512 bytes\nI/O size (minimum/optimal): 512 bytes / 512 bytes\nDisklabel\
  \ type: dos\nDisk identifier: 0xe3673009\nDevice Boot Start End Sectors Size Id\
  \ Type\n/dev/sda1 * 2048 1126399 1124352 549M 7 HPFS/NTFS/exFAT\n/dev/sda2 1126400\
  \ 53655551 52529152 25G 7 HPFS/NTFS/exFAT\n/dev/sda3 53655552 55752703 2097152 1G\
  \ 83 Linux\n/dev/sda4 55752704 104857599 49104896 23.4G 5 Extended\n/dev/sda5 55754752\
  \ 104857599 49102848 23.4G 8e Linux LVM\nCommand (m for help):\n```\n\n目前，Windows\
  \ 系统分区被列为可启动分区。由于我们将删除此分区，因此 Linux 启动分区需要标记为可启动。在上面的配置中，这表示为 `/dev/sda3`。留在 `fdisk`\
  \ 工具中，按照如下方式将此设置为可启动分区：\n\n```\nCommand (m for help): a\nPartition number (1,3-5,default\
  \ 5): 3\n```\n\nThe bootable flag on partition 3 is enabled.\n\n继续之前，请记住要删除的分区的起始和结束地址（特别是\
  \ `/dev/sda1` 和 `/dev/sda2`）。\n\n```\nCommand (m for help): d\nPartition number\
  \ (1,3-5,default 5): 1\nCommand (m for help): d\nPartition number (1,3-5,default\
  \ 5): 2\nCommand (m for help): n\nPartition number (1,3-5,default 5): 1\nFirst sector\
  \ (default 2048): 2048\nLast sector (+25G,default 5): 536551\nCreated a partition\
  \ 1 of 'Linux' and size 25.6 GiB.\nDo you want to remove the ntfs signature? y\n\
  Command (m for help): p\nDisk /dev/sda: 50 GiB, 53687091200 bytes, 104857600 sectors\n\
  Units: sectors of 1 * 512 = 512 bytes\nSector size (logical/physical): 512 bytes\
  \ / 512 bytes\nI/O size (minimum/optimal): 512 bytes / 512 bytes\nDisklabel type:\
  \ dos\nDisk identifier: 0xe3673009\nDevice Boot Start End Sectors Size Id Type\n\
  /dev/sda1 * 2048 5365551 5363504 25.6G 1 Linux\n/dev/sda3 53655552 55752703 2097152\
  \ 1G 83 Linux\n/dev/sda4 55752704 104857599 49104896 23.4G 5 Extended\n/dev/sda5\
  \ 55754752 104857599 49102848 23.4G 8e Linux LVM\nCommand (m for help): w\n```\n\
  \n分区表已更改。\n正在同步磁盘。\n\n### 5.3 格式化未分配的磁盘分区\n\n为了使新分区适用于 Fedora 31 使用，需要在上面创建文件系统。当前\
  \ Fedora 版本的默认文件系统是 XFS，将在向 Fedora 31 系统中添加新磁盘驱动器 章节中详细介绍。文件系统的创建通过 `mkfs.xfs` 命令完成：\n\
  \n```bash\nmkfs.xfs -f /dev/sda1\n```\n\n```\nmeta-data=/dev/sda1 isize=512 agcount=4,\
  \ agsize=1676672 blks\n  = sectsz=512 attr=2, projid32bit=1\n  = crc=1 finobt=1,\
  \ sparse=1, rmapbt=0\n  = reflink=1\ndata = bsize=4096 blocks=6706688, imaxpct=25\n\
  \  = sunit=0 swidth=0 blks\nnaming =version 2 bsize=4096 ascii-ci=0, ftype=1\n```\n\
  \n\n\n\n\n```\nlog =internal log bsize=4096 blocks=3274, version=2\n      = sectsz=512\
  \ sunit=0 blks, lazy-count=1\nrealtime =none extsz=4096 blocks=0, rtextents=0\n\
  ```\n\n### 5.4 挂载新分区\n\n接下来，我们需要挂载新分区。在这个示例中，我们将将其挂载到名为 `/data` 的目录中。不过，你可以自由使用任何所需的有效挂载点来挂载新分区，或者将其作为逻辑卷的一部分（详细信息请参阅向\
  \ Fedora 31 卷组和逻辑卷添加新磁盘 章节）。首先，我们需要创建一个用作挂载点的目录：\n\n```bash\nmkdir /data\n```\n\n\
  其次，我们需要编辑 `/etc/fstab` 文件中的挂载表，以便该分区在每次系统启动时自动挂载。在 `/etc/fstab` 文件的末尾添加以下行来挂载新分区（请根据你的环境修改\
  \ `/dev/sda1` 设备名称）：\n\n```\n/dev/sda1 /data xfs defaults 0 0\n```\n\n最后，我们可以手动挂载新分区（注意，在随后的重启中这不再必要的，因为分区将根据我们在上面\
  \ `/etc/fstab` 文件中添加的设置自动挂载）。\n\n```bash\nmount /data\n```\n\n要检查分区，运行以下命令显示可用空间：\n\
  \n```bash\ndf -h /data\nFilesystem Size Used Avail Use% Mounted on\n/dev/sda1 26G\
  \ 215M 26G 1% /data\n```\n\n### 5.5 编辑启动菜单\n\n下一步是修改 Fedora 启动菜单。由于这起初是一个双启动系统，因此菜单被配置为提供启动\
  \ Windows 或 Fedora 的选项。现在 Windows 分区已经删除，我们需要移除此启动选项。首先编辑 `/etc/grub.d/40_custom`\
  \ 文件并移除 Windows 菜单项：\n\n```bash\n#!/bin/sh\n\nexec tail -n +3 $0\n\n# 此文件提供了一种添加自定义菜单项的简单方法。只需在此注释之后\n\
  # 输入你想要添加的菜单项即可。注意不要更改\n# 上方的 'exec tail' 行。\n\nmenuentry \"Windows 10\" {\n   \
  \     set root=(hd0,1)\n        chainloader +1\n        }\n```\n\n保存文件并使用 `grub2-mkconfig`\
  \ 工具生成 `/boot/grub2/grub.cfg` 文件，如下：\n\n```bash\ngrub2-mkconfig --output=/boot/grub2/grub.cfg\n\
  Generating grub configuration file ...\ndone\n```\n\n下次系统重启时，启动菜单将不再提供 Windows 10\
  \ 选项。\n\n### 5.6 总结\n\n在双启动配置中，可以随时删除 Windows 分区，通过识别哪些分区属于 Windows，然后使用 `fdisk`\
  \ 工具将其删除，从而为 Fedora 系统腾出空间。一旦删除，未分配的空间可以用于创建新的文件系统并进行挂载，以供 Fedora 系统使用。最后的任务是从启动菜单配置中移除\
  \ Windows 选项。\n\n## 6. GNOME 3 桌面导览\n\nFedora 31 包含了 GNOME 3 桌面环境。虽然缺乏 Windows 和\
  \ macOS 桌面的复杂性，但 GNOME 3 提供了一个整洁且直观的桌面环境，提供了窗口环境的所有基本功能，并且具有可以快速学习的优点。\n\n在本章中将涵盖\
  \ GNOME 桌面的主要功能，并概述如何执行基本任务。\n\n### 6.1 安装 GNOME 桌面\n\n如果在 Fedora 31 安装过程中选择了带有\
  \ GUI 软件配置的 Workstation 或 Server，则 GNOME 桌面将已经安装，并在每次系统启动时自动启动。\n\n如果在 Fedora 31\
  \ 安装过程中选择了其他软件配置，则 GNOME 桌面将不会包含在系统安装的软件包中。对于没有连接显示器的服务器级系统，安装图形化桌面环境的想法可能是多余的。然而，值得注意的是，远程访问\
  \ GNOME 桌面也是可能的，因此即使在所谓的“无头服务器”（即缺少显示器、键盘和鼠标的服务器）上，安装 GNOME 桌面包可能仍然有利。建立远程桌面访问的主题将在本书的使用\
  \ VNC 进行 Fedora 31 远程桌面访问 章节中详细介绍。\n\n如果安装配置未包含 GNOME 桌面，可以使用以下命令随时进行安装：\n\n```bash\n\
  dnf groupinstall \"Workstation\"\n```\n\n安装完成后，可以从显示器上的命令行提示启动桌面环境，如下：\n\n```bash\n\
  $ startx\n```\n\n### 6.2 GNOME 3 桌面概览\n\n下方图 6-1 所示显示了在启动任何其他程序或进行配置更改之前典型的新启动 GNOME\
  \ 桌面会话的外观。\n\n![](img/fedora_31_gnome_desktop.png)\n\n图 6-1\n\n主桌面区域（标记为 A）是窗口出现的地方。屏幕顶部的栏（B）称为顶栏，它包含活动（C）、日期和时间以及网络状态、音量、电量和账户设置。与其他桌面环境不同，可以将文件或应用程序拖放到桌面，这提供了一个整洁的工作区。活动应用程序的菜单将出现在顶栏。在上面的屏幕中，例如了\
  \ Terminal 程序：\n\n![](img/fedora_31_terminal.png)\n\n图 6-2\n\n### 6.3 启动活动\n\n应用程序和工具通过活动面板（Activities\
  \ dashboard）启动，可以通过点击顶栏中的活动按钮或按下键盘上的特殊键来显示。在 Windows 系统上是 Windows 键，在 macOS 上是 Command\
  \ 键，在 Chromebook 上是显示放大镜的键。\n\n当显示时，面板将如图 6-3 所示：\n\n![](img/fedora_31_activities.png)\n\
  \n图 6-3\n\n默认情况下，面板将显示一组定义的常用应用程序图标，并包含任何正在运行的应用程序图标。如果应用程序正在运行，图标下方会出现一个条标记。\n\n\
  要找到未包含在面板上的应用程序，一种方法是选择底部的图标（九个点组成的图标）以显示可浏览的应用程序列表，如图 6-4\n\n图 6-4\n\n注意，可以通过选择屏幕底部的按钮将列表过滤为显示所有应用程序或经常使用的应用程序。此外，列表中的某些项实际上是持有其他应用程序的文件夹。在上面的屏幕中，例如，Utilities（工具）项提供了对系统监视磁盘管理工具以及\
  \ Terminal 窗口应用程序的访问。\n\n浏览应用程序的另一种方法是使用搜索栏进行搜索，搜索栏在面板显示时出现，如图 6-5 所示：\n\n![](img/fedora_31_app_search.png)\n\
  \n图 6-5\n\n在搜索框中输入文本时，匹配列表将得到精炼。\n\n要将应用程序添加到面板以便更方便访问，请找到应用程序图标，右键点击它并选择 Add to\
  \ Favorites（添加到收藏）菜单选项：\n\n![](img/fedora_31_add_to_favorites.png)\n\n图 6-6\n\n\
  要从面板中移除应用，重复这些步骤，这次选择 Remove from Favorites（从收藏中移除）。\n\n### 6.4 管理 Windows\n\n\n\
  \n\n\n与其他其它桌面环境一样，运行在 GNOME 上的应用程序位于窗口中。当打开了多个应用程序窗口时，`Super + Tab` 键盘快捷键将显示切换器面板（图\
  \ 6-7），允许选择不同的窗口作为当前活动窗口（`Super` 键可以是 Windows 键，或者在 Mac 键盘上是 `Cmd` 键）：\n\n![](img/fedora_31_gnome_app_tab.png)\n\
  \n图 6-7\n\n如果某个应用程序打开了多个窗口，切换器将在第二个面板中显示这些窗口，以便选择特定的窗口：\n\n![](img/fedora_31_gnome_app_tab_multiple.png)\n\
  \n图 6-8\n\n若要在切换器中的图标之间反向循环，请使用 `Shift + Tab` 键盘快捷键。\n\n要最大化窗口以填满整个屏幕，请点击标题栏并将窗口拖动到屏幕顶部。要将窗口恢复到原始大小，点击标题栏并向下拖动。或者，简单地双击标题栏即可在窗口大小之间切换。同样，将窗口拖到屏幕左侧或右侧将使窗口填充屏幕的半部分。\n\
  \n### 6.5 使用工作空间\n\n应用程序窗口出现的屏幕区域称为工作空间，GNOME 3 允许配置多个工作空间。要创建新的工作空间，请显示“活动”概览并将鼠标指针移动到屏幕最右侧显示工作空间面板（图\
  \ 6-9）：\n\n![](img/fedora_31_gnome_workspaces.png)\n\n图 6-9\n\n要切换到不同的面板，只需从列表中选择即可。要将窗口从一个工作空间移动到另一个工作空间，显示工作空间面板并将应用程序窗口（当前工作空间中的实际窗口或工作空间面板中的缩略窗口）拖放到目标工作空间。当窗口被添加到空白工作空间时，工作空间面板会添加另一个空白工作空间，从而创建多个工作空间。\n\
  \n要删除工作空间，可以关闭该空间上的所有窗口，或将它们移动到另一个工作空间。\n\n### 6.6 日历与通知\n\n当系统需要通知你事件时（例如系统或应用程序更新的可用性），弹出面板将出现在工作区的顶部。点击顶部栏上的日期和时间即可访问日历和任何之前的通知，如\
  \ 图 6-10 所示：\n\n![](img/fedora_31_gnome_notifications.png)\n\n图 6-10\n\n### 6.7\
  \ 桌面设置\n\n要访问“设置”（Settings）应用程序，点击顶部栏最右侧的向下箭头，并选择带有工具图标的按钮，如 图 6-11 所示：\n\n![](img/fedora_31_gnome_settings_menu.png)\n\
