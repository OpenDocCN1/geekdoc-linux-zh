  ```\n\n### 23.6 总结\n\n如果宿主机系统上有本地或远程桌面访问，则大部分桥接配置过程可以使用 `nm-connection-editor` 图形化工具完成。要使用该工具，在桌面内打开终端窗口并输入以下命令：\n\
  \n```bash\nnm-connection-editor\n```\n\n当工具加载后，将出现如图 23-1 所示的窗口，其中列出了当前配置的网络连接（本质上与\
